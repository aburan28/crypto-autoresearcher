  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE AND IT MAY END THE RECORD: read [35, Theorem 1] and
      [35, Proposition 8.5] and answer four questions with citations -- how many
      OneEnd calls does the reduction make, on which curves, under what condition
      on the returned endomorphism, and how is a full-rank suborder saturated to
      the maximal one. If those answers are all present and benign, the record's
      job is done and it converts into a knowledge entry recording the
      preconditions, at a cost of one read. STAGE 1 (minutes): verify M1 directly
      on the four committed toy graphs. STAGE 2 (hours): simulate Algorithm 3's
      output distribution exactly on the toy graphs (draw the walk, take the
      minimal conjugate isogeny at the endpoint, pull back), and measure M2, M3,
      M4 over every vertex and at least 200 draws per vertex. STAGE 3 (hours):
      the null ensemble, M5. STAGE 4 (minutes): the special-curve known-answer
      arm. NO ATTACK, NOTHING AT CRYPTOGRAPHIC SIZE, AND NO ENDOMORPHISM RING IS
      EVER COMPUTED FROM A CURVE -- ground truth is taken from the quaternion side.
    controls:
      - >-
        SPECIAL-CURVE KNOWN ANSWER (blocking). A curve with explicitly known
        maximal order must give index 1 at k = 4 in poly(log p). If it does not,
        the index computation is broken and no other number is admissible.
      - >-
        MATCHED-NORM RANDOM NULL (blocking). Random trace-zero vectors of the
        same reduced norm, same k, same index computation. This is the control
        that decides whether any observed structure belongs to the algorithm or
        to the lattice.
      - >-
        LOCUS ARM VERSUS UNIFORM ARM (blocking). The two must behave
        DIFFERENTLY -- rank stuck at 2 versus rank 4 at k = 2. If they behave the
        same, either the locus simulation is wrong or the witness is wrong.
      - >-
        DETERMINISM CHECK. On a locus vertex, a deterministic OneEnd oracle must
        return the SAME Frobenius on every call. An implementation that returns
        varying answers there is re-randomising internally and is therefore not
        the oracle the witness is about; the distinction must be recorded
        explicitly because it IS dichotomy branch (D1).
      - >-
        AUTOMORPHISM CONVENTION. j = 0 and j = 1728 are fixed in writing before
        any count is scored, since those vertices have extra units and their
        orders behave differently.
    required_metrics:
      - delta_E at every locus vertex (must be exactly 1)
      - k to rank 4, per vertex, treatment and locus arms
      - log_2 index at k = 2..6, full distribution, treatment and null arms
      - largest prime factor of the index, as a fraction of log index, both arms
      - special-curve arm: index at k = 4 (must be 1) and its operation count

  falsification_conditions:
    - >-
      F1. A locus vertex with delta_E > 1. The witness is wrong or the archived
      labels are corrupt; stop and report, since the labels are used by several
