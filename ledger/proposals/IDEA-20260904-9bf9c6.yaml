  assumptions:
    - >-
      j(E) in F_p implies E^{(p)} is isomorphic to E over F_{p^2}, hence
      delta_E = 1. Elementary and checked directly in the minimal test rather
      than assumed.
    - >-
      Frobenius on an F_p-rational supersingular curve is a non-scalar
      endomorphism with pi^2 = -p, so it is a valid OneEnd answer under Problem
      2.2's definition, which asks only for an element of End(E) \ Z.
    - >-
      EndRing on the F_p-rational locus costs Otilde(p^{1/4}) and not less. This
      is the folklore Delfs-Galbraith figure, RECALLED, and it is dichotomy branch
      (D3) precisely so that it can be doubted rather than assumed.
    - >-
      At the toy primes used, End(E) is computable exactly on the quaternion side
      for every vertex, so index and rank are ground truth rather than estimates.

  proof_search_map:
    bottleneck: >-
      The step in the OneEnd-to-EndRing reduction that turns non-scalar
      endomorphisms into a FULL-RANK MAXIMAL order. Removing or bounding it is
      what fixes the true cost of Corollary 1.2 and therefore of every SQIsign
      and CGL figure this program quotes.
    baseline_embedding:
      parameter_slice: >-
        The trivial-reduction slice: a curve whose End(E) is already known
        explicitly (a special curve such as the j = 1728 curve for p = 3 mod 4),
        where the reduction must return the known basis at cost poly(log p) and
        index exactly 1 at k = 4. That is the known-answer arm and it must pass
        before any other number is quoted. IDEA-20260806-62ba9d's
        "trivial-reduction null that must return a known value" is the same idea
        and this record adopts it deliberately.
      reproduction_check: >-
        Frozen fixture: at each toy prime, the special curve's maximal order basis
        computed independently (from the standard quaternion presentation) must
        match the reduction's output as Z-modules, not merely in rank.
    observation_collision:
      observable: >-
        "A non-scalar endomorphism of E", i.e. the literal output specification
        of Problem 2.2.
      distinct_preimage_search: >-
        THE COLLISION IS EXHIBITED, NOT SEARCHED FOR, AND IT IS THE RECORD'S
        CENTRE. Two ground-truth objects with the same observable and opposite
        downstream value: (i) Frobenius on an F_p-rational curve -- a non-scalar
        endomorphism obtainable in O(log p), generating a rank-2 ring, and worth
        NOTHING for EndRing; (ii) the output of Algorithm 3 on a random curve --
        a non-scalar endomorphism costing p^{1/3+o(1)}, generating a rank-2 ring
        ON ITS OWN as well, but drawn from a distribution for which several
        samples generate rank 4. THE OBSERVABLE DOES NOT SEPARATE THEM, so any
        statement of the form "OneEnd solves EndRing" is under-specified as an
        identifiability claim, and the separating condition is a property of the
        DISTRIBUTION the answers are drawn from, not of any single answer. That
        is the precondition the record is hunting, stated in KN-TECH-080's own
        terms.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the observable "a non-scalar endomorphism" by the strictly
          stronger "a full-rank suborder together with its index in End(E)",
          which is what the recursion actually needs and what survives adjoining
          further generators (monotone in k). Track it instead of the
          endomorphism.
        predicted_gain: >-
          Makes the reduction's termination condition observable and therefore
          measurable, and separates the two collision preimages above -- the
          locus witness has rank 2 for every k, and that is visible immediately
          in the stronger invariant while invisible in the weaker one.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed (a non-scalar endomorphism), vary the
          forgotten structure (the distribution the answer is drawn from and the
          curve's position relative to the F_p-locus), and find an intrinsic
          invariant distinguishing the resulting objects. Candidate invariant:
          the discriminant of Z[alpha], which is -4p for Frobenius and
          -4 (deg omega)^2 p delta for an Algorithm 3 output.
        predicted_gain: >-
          A concrete, computable separating condition that can be checked against
          whatever [35] actually requires, once someone reads it.
    quantifier_order: >-
      AS THIS PROGRAM QUOTES IT: FOR ALL supersingular E, EndRing(E) is solvable
      in p^{1/3+o(1)}. WHAT THE REDUCTION PLAUSIBLY SUPPORTS: FOR ALL
      supersingular E, GIVEN an oracle that FOR A UNIFORMLY RANDOM curve returns
      an endomorphism drawn from a distribution with property Q, EndRing(E) is
      solvable in k(p) oracle calls plus poly. THE DIFFERENCE IS THE WHOLE
      RECORD. The witness of (A) shows the first form cannot be right as a
      black-box statement about the given curve, because the locus is a family of
      inputs on which a legitimate OneEnd oracle is free and EndRing is not. Note
      what is NOT claimed: that the second form fails, or that Q is hard to
      satisfy -- Algorithm 3 re-randomises and almost certainly satisfies it.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: the witness (A) as an elementary derivation verified exactly at
        four toy primes; the forced dichotomy (D1)/(D2)/(D3) as a logical
        statement; and measured distributions of k, of the index [End(E) : O_k],
        and of that index's largest prime factor, at toy scale, with a matched
        null. It can NEVER certify what [35] requires -- only reading [35] can do
        that -- and it certifies nothing about the correctness of any published
        theorem.
      nearby_object_control: >-
        THE OBJECT WHERE THE CONCLUSION IS KNOWN FALSE: the special curve with
        known maximal order. There EndRing is free, the reduction is trivial, and
        the index must be 1 at k = 4. If the measurement machinery reports a
        large index or a high k THERE, it is measuring its own implementation and
        every other number is void. THE OBJECT WHERE THE TENSION IS REAL: a
        uniformly random supersingular curve off the locus. The audit must see
        the two as different.
    proof_obligations:
      - claim: delta_E = 1 for every E with j(E) in F_p, hence OneEnd is polynomial there.
        responsibility: correctness
      - claim: >-
          Frobenius generates Z[pi], of Z-rank 2, so no number of queries to a
          deterministic OneEnd oracle on a fixed locus curve can produce four
          Z-module generators of End(E).
        responsibility: strictness
      - claim: The dichotomy (D1) or (D2) or (D3) is forced.
        responsibility: correctness
      - claim: k(p), the number of independent outputs needed for rank 4. Measured.
        responsibility: size
      - claim: >-
          The index [End(E) : O_k] and its largest prime factor. Measured, with
          a matched null.
        responsibility: size
      - claim: >-
          The true cost of Corollary 1.2 is k(p) p^{1/3+o(1)} plus the saturation
          cost, and neither factor is currently recorded anywhere in this program.
        responsibility: runtime
      - claim: >-
          Special-curve slice returns index 1 at k = 4 in poly(log p).
        responsibility: baseline
      - claim: >-
          All measurements are toy tier at the four committed primes; nothing is
          claimed about [35]'s actual content.
        responsibility: scope

  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: the smooth-ball search and every
      parameter variant of it; the detection-exponent axis (IDEA-20260904-ec17aa,
      IDEA-20260901-22428d); SQIsign transcript statistics; quantum cost models;
      and reduction-network COSTING in the style of IDEA-20260815-bf2b26 and
      IDEA-20260806-62ba9d -- this record deliberately does not count polynomial
      factors, it hunts a precondition with a witness.
    tracked_object: >-
      The order generated by the oracle's outputs, as the pair (rank, index in
      End(E)) indexed by the number of calls k.
    lossiness: >-
      Two integers standing for a list of endomorphisms; nothing about the
      endomorphisms is recoverable.
    propagation: >-
      Monotone and deterministic under the reduction's own step: adjoining a
      generator cannot lower the rank and can only divide the index. That
      monotonicity is the one-step propagation rule and it is exactly what makes
      the trajectory k -> (rank_k, index_k) a measurable object.
    newness_score: >-
      As mathematics, elementary and old. As a record here, absent: the pool's
      two reduction-network records both cost the network and neither exhibits a
      witness or names the index.
    testability_score: >-
      Very high. The witness is checkable by inspection; the trajectory is
      computable exactly at toy primes where End(E) is known; the whole test is
      an afternoon.
    survival_score: >-
      The object survives as long as the reduction is generator-by-generator. It
      dissolves if [35] proceeds by an entirely different route -- for instance
      by constructing the order directly from a single endomorphism plus a
      lattice computation -- and discovering that would itself resolve the
      dichotomy.

