    - >-
      F6. [35] cannot be obtained. INFRASTRUCTURE outcome under AGENTS.md rule 5;
      it is never evidence about what the reduction requires, and Stages 1-4 run
      anyway since they do not depend on it.

  confounders:
    - >-
      C1. "Deterministic oracle" is a modelling choice. A OneEnd oracle that
      internally re-randomises returns varied answers even on a locus curve, and
      then the witness bites only against the deterministic reading. That is not
      a weakness of the argument -- it is dichotomy branch (D1) -- but a careless
      write-up would conflate them, so the record separates the two readings
      explicitly and the determinism check measures which one an implementation
      realises.
    - >-
      C2. Toy primes have tiny End(E) discriminants (order p^2 with p under
      10^4), so indices are small in absolute terms and the largest-prime-factor
      statistic has almost no dynamic range. THE TREND ACROSS THE FOUR PRIMES IS
      THE EVIDENCE, never a single value, and no Dickman comparison is meaningful
      at these sizes -- the toy arm can only falsify a strong claim of
      smoothness, not confirm the Dickman prediction.
    - >-
      C3. Simulating Algorithm 3's output distribution is not the same as running
      it. The simulation draws the minimal conjugate isogeny directly rather than
      through the smooth-ball claw, so it misses any bias the SMOOTHNESS
      CONDITION imposes on which delta values are found. Algorithm 2 only ever
      returns SMOOTH-degree conjugate isogenies, so the realised alpha
      distribution is conditioned on smoothness and the simulation must condition
      on it too or it is measuring the wrong ensemble. This is a real and easily
      missed defect and it is written into the required metrics.
    - >-
      C4. The index depends on the walk length n through (deg omega)^2 = 2^{2n},
      and n = O(log p) with an unspecified constant. Different constants give
      different index sizes, so the walk length must be fixed and recorded before
      the measurement, not chosen to make the numbers look a certain way.
    - >-
      C5. Rank 4 is necessary but not sufficient for Problem 2.3, which asks for
      four generators of End(E) AS A Z-MODULE, i.e. index 1. Reporting k for rank
      alone and calling the reduction complete is precisely the error this record
      is auditing, and the record must not commit it itself.

  interpretation_limits:
    - >-
      NO ERROR IN ANY PUBLISHED THEOREM IS CLAIMED, ALLEGED, OR IMPLIED. The
