    - metric: >-
        M4 -- the largest prime factor of the index [End(E) : O_k], as a fraction
        of log of the index
      direction: higher
      minimum_effect: >-
        THIS IS THE NUMBER THE WHOLE RECORD EXISTS TO PRODUCE. Predicted to
        behave like the largest prime factor of a random integer of its size,
