  heuristic_assumptions:
    - id: H1
      statement: >-
        The index [End(E) : Z<alpha_1, alpha_2>] generated by two independent
        Algorithm 3 outputs on the same curve behaves, as an integer, like a
        uniformly random integer of its size with respect to smoothness; in
        particular its largest prime factor P satisfies
        Pr[P <= (index)^{1/u}] = rho(u) (1 + o(1)) with rho the Dickman-de Bruijn
        function, uniformly for u in the usual range.
      rigorous_support: >-
        RIGOROUS SIDE. The index is determined by the discriminants: for
        trace-zero alpha_1, alpha_2 with reduced norms N_1, N_2, the
        discriminant of Z<alpha_1, alpha_2> is an explicit polynomial in N_1,
        N_2 and Trd(alpha_1 alpha_2-bar), and disc(End(E)) = p^2, so the index
        squared is that polynomial divided by p^2 -- an exact identity, not an
        estimate. The integer whose smoothness is at issue is therefore a
        specific quadratic expression in three measurable quantities.
        CLASSICAL DISTRIBUTION STATEMENT IMITATED. Dickman-de Bruijn:
        Psi(X, X^{1/u})/X -> rho(u). H1 asks only that this particular quadratic
        expression behave like a random integer of its size, which is exactly the
        form of the frozen source's own Heuristic 1 and is imitated deliberately
        so that a reviewer can judge the two by the same standard.
      validation_plan: >-
        WHAT TO SAMPLE. The index and its factorisation, for many independent
        pairs (alpha_1, alpha_2) drawn from Algorithm 3's output distribution
        CONDITIONED ON SMOOTHNESS (see confounder C3).
        SHORTCUT THAT REACHES CRYPTOGRAPHIC SCALE. The frozen source's own
        Deuring sampler: draw random maximal orders uniformly up to conjugation,
        form the two-sided ideal P of reduced norm p, take short trace-zero
        vectors as the alpha's, compute the discriminant identity above, and
        factor it. This never touches a curve and therefore runs at
        p = 5*2^248 - 1 and p = 27*2^500 - 1 exactly as section 4.2 does.
        SCALE AND PARAMETERS TO RECORD. At least 10,000 pairs at NIST-I size and
        1,000 at NIST-V size, plus exhaustive vertices at the four toy primes;
        record p, the walk length n, the smoothness bound B used for the
        conditioning, and the automorphism convention.
        COMPARISON DISTRIBUTION. Empirical CDF of log(largest prime factor of the
        index)/log(index) against rho(u), plotted exactly as the frozen source
        plots its Figures 1 and 2 so the two are visually comparable.
        TAIL CHECKS. (i) The smoothest observed index against its predicted
        rho(u) probability -- the same tail check the frozen source performs;
        (ii) the fraction of samples whose index is 1, which is the fraction for
        which no saturation is needed at all and which is the single most
        actionable number the experiment produces.
        TRANSFER ASSUMPTION, STATED. The quaternion-side sample is of maximal
        orders, and its transfer to curves rests on the Deuring correspondence
        and on uniform order sampling being uniform curve sampling up to
        automorphism weights -- the frozen source's assumption, inherited here.
    - id: H2
      statement: >-
        Two independent Algorithm 3 outputs on the same curve generate a Z-order
        of rank 4 with probability 1 - O(1/p), i.e. the event that alpha_2 lies
        in the commutative field Q(alpha_1) is negligible.
      rigorous_support: >-
        RIGOROUS SIDE. Q(alpha_1) is a 2-dimensional subspace of the
        4-dimensional Q-algebra, so a uniformly distributed alpha_2 in the
        trace-zero part lands in it with probability O(1/p) in any reasonable
        model. CLASSICAL DISTRIBUTION STATEMENT IMITATED. The standard "a random
        vector avoids a fixed proper subspace" count over a finite field.
        WHERE IT FAILS, AND THIS IS THE POINT: on the F_p-rational locus, a
        DETERMINISTIC oracle returns alpha_2 = alpha_1 = Frobenius with
        probability 1, so H2 fails completely there. H2 is thus not a background
        assumption but the exact statement whose failure the witness exhibits.
      validation_plan: >-
        WHAT TO SAMPLE. The rank of Z<alpha_1, alpha_2> over many pairs at the
        four toy primes, separately for locus vertices and non-locus vertices.
        COMPARISON. Predicted rank 4 with frequency 1 - O(1/p) off the locus and
        rank 2 with frequency 1 on the locus under a deterministic oracle.
        TAIL CHECK. Every rank-2 outcome off the locus is examined individually
        rather than reported as a rate, since at toy p a handful of genuine
        degeneracies is expected and each one is informative about which curves
        have small-discriminant suborders.
        SCALE. Exhaustive over all vertices at all four primes; this is fully
        computable and needs no extrapolation.

