        largest prime factor above the square root -- which is exactly the regime
        where a saturation step requiring factorisation would be subexponential
        rather than polynomial. If the observed largest prime factors are
        systematically SMALL (smooth indices), the saturation is cheap and the
        cascade is fine, which is the benign branch.
    - metric: >-
        M5 -- the same index and largest-prime-factor distributions for the NULL
        ensemble of random trace-zero vectors of matched reduced norm
      direction: different
      minimum_effect: >-
        Predicted INDISTINGUISHABLE from the treatment arm, at the level of a
        two-sample test on log index with p-value above 0.05. If the treatment
        arm's indices are systematically smaller, Algorithm 3's outputs are
        special and the cascade is cheaper than generic bookkeeping suggests --
        which would be a genuine finding about the algorithm and must be reported
