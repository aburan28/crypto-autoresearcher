      low and it is written down so it cannot be quietly dropped.
    - >-
      F3. The index reaches 1 at small k with smooth indices. The saturation is
      cheap, the cascade is uniform in cost, and the audit CLOSES with a positive
      result: Corollary 1.2's cost is k p^{1/3+o(1)} with k measured and small.
