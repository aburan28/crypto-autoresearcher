    "claim": "For a specified synthetic nonce-leakage channel, a hybrid solver can improve the time-memory-sample frontier only if the charged cost of Fourier screening plus residual lattice search is below both complete baselines at equal success probability; likelihood mass discarded by screening must be explicitly bounded.",
    "mechanism": "Write the hidden-number likelihood as a product of factors L_i(a_i*x+b_i), with known a_i,b_i. Approximate a subset of factors by a finite Fourier expansion with a certified uniform error envelope. Use that envelope to retain candidate intervals or residues without discarding any candidate whose likelihood can exceed the threshold, then run a fixed lattice-with-predicate routine on each retained cell using the remaining factors. Screening output is a branching partial-action representation with branch count B and retained probability mass 1-epsilon. Sensor alphabet compression is not the algorithm; the proposed gain is a rigorously controlled split in solver work. All inputs are self-generated; ordinary ECDLP has no such likelihood factors.",
