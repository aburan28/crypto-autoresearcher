idea:
  id: IDEA-20260905-8fb675
  title: Sufficiency certificates for compressed nonce-observation channels
  class: representation
  claim: For a finite synthetic nonce-observation channel, a compressed observation can retain all information relevant
    to the nonce label exactly when its conditional posterior is constant on every compression fiber. This can distinguish
    justified storage reduction from silently weakened leakage assumptions.
  mechanism: 'Let X be a self-generated nonce-class label and Y a finite synthetic sensor output with a declared
    rational probability table. A compression S=f(Y) is sufficient for X precisely when the rows P(X|Y=y) agree
    for all y sharing S. Store the normalized posterior class as the tracked object, so redundant sensor labels
    collapse while statistically distinct labels remain distinct. The compression is a privacy and modeling artifact:
    its output has a certified relation to the source channel, and its stored alphabet size is charged. This is
    deliberately a statement about the abstract nonce channel, not entropy of the signing key conditioned on its
    public key; that latter quantity does not provide a computational-security bound. Sequential composition is
    valid only under the stated conditional channel factorization.'
