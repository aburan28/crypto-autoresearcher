idea:
  id: IDEA-20260816-edfb2a
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: Compose theta's single-position z-shift with rho's twenty-five lane offsets and pi's lane
    routing into one combinatorial diffusion process on the sixty-four z-positions, compute the round
    at which the deviation's z-support saturates, and ask whether the triangular-number offsets diffuse
    faster or slower than random ones
  class: composition
  claim: '(A) A PURELY COMBINATORIAL SUBPROCESS EXISTS INSIDE THE ROUND FUNCTION. Consider the z-support
    of the deviation, supp_z(D) = {z : some lane of D is nonzero at z}, a subset of Z/64. Reading
    the step definitions: theta can add nonzero positions only at z and z-1 relative to existing ones,
    because its correction term uses C[x+1][z-1]; rho translates each lane''s contribution by that
    lane''s fixed offset; pi routes lanes between positions without touching z; chi is z-local and
    adds nothing new; iota adds positions at z in {0,1,3,7,15,31,63} intersected with the injection.
    The z-support therefore evolves by a rule that mentions no bit values at all -- only offsets and
    set unions -- giving a deterministic OVER-APPROXIMATION of the support that costs nothing to iterate.
    (B) THE OVER-APPROXIMATION IS THE HONEST PART. XOR cancellation can remove positions the union
    rule predicts, so the combinatorial process bounds the true support from above and does not equal
    it. This contract measures the GAP: it iterates both the union bound and the exact support from
    the real deviation vectors and reports the difference per round. A tight gap makes the combinatorial
    process a free predictor; a loose gap is itself the measurement, and either way the result is
    a number rather than a verdict. (C) THE COMPARISON THAT GIVES IT MEANING. Keccak''s 25 rho offsets
    are triangular numbers modulo 64, a highly structured multiset. The identical diffusion computation
    runs on 1000 random offset multisets of the same size drawn from Z/64. The reported quantity is
    the saturation round -- the first r with supp_z = Z/64 -- for Keccak against that null distribution.
    This asks a specific, answerable question: do the standard''s offsets spread an internal differential
    across the lane axis faster, slower, or identically to arbitrary offsets? (D) NOT CLAIMED. No
    attack, no complexity, no claim that fast or slow z-diffusion is good or bad for security, and
    no claim about why any offsets were chosen. It is NOT claimed that z-support is a sufficient descriptor
    of the deviation -- part (B) is designed to quantify how insufficient it is. Nothing about full
    24-round SHA-3 or any deployed use.'
  mechanism: 'STAGE 1: derive the support-update rule from the step definitions and encode it as a
    map on subsets of Z/64 indexed by lane, i.e. 25 subsets rather than one, since rho acts per lane;
    verify the rule by checking that the exact support of a real deviation vector is always CONTAINED
    in the predicted set over 10^4 random symmetric starts and 12 rounds -- a containment failure
    falsifies the rule immediately. STAGE 2: iterate the union bound from the iota injection support
    for r = 1..12 and record |supp_z| per round and the saturation round. STAGE 3: iterate the exact
    support from real deviation vectors under the companion contract''s recursion and record the same
    statistics; report the gap. STAGE 4: repeat stages 2-3 for 1000 random offset multisets, holding
    theta, pi, chi and the constants fixed, so only rho varies. STAGE 5: repeat with theta''s z-shift
    term disabled, to separate rho''s contribution from theta''s, which is the decomposition that
    makes the composition claim meaningful. STAGE 6: report Keccak''s saturation round as a quantile
    of the null distribution, with and without theta''s shift. REFUTATION: the mechanism fails if
    the containment check fails, if the union bound saturates at round 1 (no dynamic range), or if
    the gap between bound and exact support is so large that the bound predicts nothing -- the last
    of which is still a usable measured obstruction against support-based reasoning.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/ docs/` from the
      repository root: four proposals (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc, IDEA-20260809-ce875b,
      IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), GOAL-SHA3-001 and five sibling goals,
      two decisions, and a block of KN-LIT files. Then per-noun counts over ledger/proposals/ and
      ledger/hypotheses/: translation-invariant (4, all ECDLP/AES), symmetry-decay (0), "internal
      differential" (0), sponge (2), "invariant subspace" (2), "chi step" (0), "rate/capacity" (0).
      Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001, KN-TECH-080 in full, docs/inventor-protocol.md
      sections 1-8, and headers of KN-TECH-066, KN-TECH-073, KN-TECH-074, KN-TECH-056. Additionally
      grepped ledger/proposals and ledger/hypotheses for `diffusion`, `offset`, `triangular` and `support`
      and inspected the hits.'
    results: No hits for rho offsets, triangular-number offsets or z-diffusion anywhere in the ledger.
      `diffusion` hits are all in the AES lane and in random-walk language on the ECDLP side; `support`
      hits are divisor supports on curves (for example the degeneration-divisor support drop in IDEA-20260811-d7856a)
      and polynomial supports in multivariate records, none of them a subset of a cyclic group tracking
      a permutation's spreading. No record anywhere composes two steps of a primitive into a reduced
      combinatorial process.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature, where diffusion analysis
      of this permutation is very likely extensive. NEW relative to this repository: the reduction
      of a round to a set-valued process on Z/64, and the offset-null comparison. ASSEMBLED FROM KNOWN
      PARTS: the support-update rule is read from the step definitions; the null-object discipline
      is inventor-protocol section 3; the deviation recursion is the companion active-row contract''s,
      reused unchanged. The contribution claimed is the reduced process, the measured bound-versus-exact
      gap, and the offset comparison.'
  object_first_candidate:
    tracked_object: The tuple of 25 per-lane z-supports (S_0, ..., S_24), each a subset of Z/64, followed
      through the round function -- and its union supp_z, a single subset of Z/64. The object is set-valued
      and carries no bit values at all.
    lossiness: 'This is the most aggressive projection in the bucket: 1600 bits collapse to 25 subsets
      of a 64-element set, discarding every bit value and keeping only occupancy. The discard is compatible
      with rho and pi exactly, because those are position maps that act on occupancy alone, and it
      is compatible with theta and chi only in the ONE direction that matters -- they can create occupancy
      at predictable positions but can also destroy it by cancellation, so the retained data propagates
      deterministically as a superset and not as an equality. The entry states this asymmetry as its
      central limitation rather than as a footnote, and stage 3 measures exactly how much is lost
      by it.'
    propagation: One round acts as S_lane -> (union over source lanes routed by pi of (S_source +
      rho_offset)) united with its own z-1 shift from theta's correction, united with the iota injection
      support for lane (0,0). Every term is a translation or a union of subsets of Z/64, so a round
      costs 25 shifts and 25 unions on 64-bit masks -- roughly fifty machine instructions, which is
      why twelve rounds over 1000 offset multisets is instantaneous.
    survival_score: 'The saturation round: the first r with supp_z = Z/64. Once saturated the object
      carries no further information, so its survival is exactly the number of rounds before saturation.
      The pre-run expectation, recorded before computing, is saturation between rounds 2 and 5 given
      that theta alone spreads by one position per round and rho''s offsets span the full range; if
      saturation occurs at round 1 the object is measured to be useless immediately, which is a clean
      and cheap closure.'
  null_object_control: 'NULL-OFFSET: 1000 random multisets of 25 offsets drawn uniformly from Z/64,
    with theta, pi, chi and the constants held fixed, run through the identical support iteration
    in the same invocation. For Keccak''s offsets to be said to do anything, its saturation round
    must fall outside the central 90 percent of the null distribution; a median position means z-diffusion
    speed is a property of having 25 spread-out offsets and not of the triangular structure. A second
    control, NULL-THETA, disables theta''s z-1 term in both arms: if saturation is unchanged, theta''s
    shift contributes nothing to z-diffusion and the composition claim reduces to a statement about
    rho alone, which the entry would then say plainly.'
  discriminated_from:
  - The companion active-row contract -- that tracks the full deviation vector and counts active rows;
    this tracks only occupancy positions and discards every value, which is a strictly coarser and
    strictly cheaper object with its own failure mode.
  - The column-parity representation contract -- that projects across y within a column and dies at
    rho; this projects across everything except z and is driven BY rho, so the two probe opposite
    halves of the linear layer.
  - The shape-matched random permutation control -- that randomises the whole linear layer; this randomises
    only the 25 offsets with everything else fixed, which is the finer instrument for attributing
    diffusion to rho specifically.
  - IDEA-20260811-d7856a (degeneration divisor support drop under an x-line translation) -- shares
    the word 'support' and the shape 'does the structure survive a translation', but its object is
    a divisor on a curve and its translation is a coordinate change on the x-line, with no permutation
    and no cyclic group action on positions.
  assumptions:
  - theta's correction introduces positions only at z and z-1 relative to existing occupancy, read
    from the C[x+1][z-1] term; verified by the stage 1 containment check.
  - chi introduces no new z-positions because it is z-local; verified in the same check.
  - Occupancy is a meaningful proxy for where structure has spread, notwithstanding that it ignores
    cancellation; stage 3 measures the cost of this proxy.
  - 1000 random offset multisets give usable resolution on saturation-round quantiles, which are integers
    over a small range and therefore coarse; this is a declared design limitation.
  predictions:
  - metric: containment of the exact z-support in the union-bound prediction, over 10^4 starts and
      12 rounds
    direction: higher
    minimum_effect: 1.0
  - metric: saturation round of the union bound for Keccak's offsets
    direction: lower
    minimum_effect: 6
  - metric: gap between union-bound support size and exact support size at round 4, in positions
    direction: different
    minimum_effect: no pre-commitment; the size of the cancellation gap is precisely the unknown that
      decides whether the reduced process predicts anything
  - metric: quantile of Keccak's saturation round within the NULL-OFFSET distribution
    direction: different
    minimum_effect: no pre-commitment; a median position is a legitimate controlled-null outcome and
      would say z-diffusion speed is generic to spread-out offsets
  - metric: change in saturation round when theta's z-1 term is disabled
    direction: higher
    minimum_effect: 0
  minimal_test:
    design: 'Stages 1-2 and 4 discriminate and cost under five minutes. Encode the support-update
      rule as 25 sixty-four-bit masks with per-lane rotations for rho, a routing permutation for pi,
      an OR with a one-position rotation for theta, and an OR with the injection support for iota.
      Iterate twelve rounds from the iota injection and record |supp_z| per round and the saturation
      round -- this is a few hundred machine instructions. Run the identical iteration for 1000 random
      offset multisets and read Keccak''s quantile. Before believing any of it, run the containment
      check: generate 10^4 real deviation vectors with the companion recursion and verify their exact
      supports are subsets of the predicted sets at every round; a single violation falsifies the
      rule and is worth finding immediately, because it would mean a step introduces occupancy the
      rule does not account for. This minimal version answers whether the reduced process is sound
      and whether Keccak''s offsets are unusual, and defers only the cancellation-gap measurement,
      which needs the full deviation vectors.'
    controls:
    - 'Containment control: exact support must always be a subset of the predicted support, over 10^4
      starts and 12 rounds.'
    - 'NULL-OFFSET: 1000 random 25-offset multisets from Z/64 with everything else fixed.'
    - 'NULL-THETA: theta''s z-1 term disabled in both signal and null arms, isolating rho''s contribution.'
    - 'Zero-injection control: with no iota injection the support must remain empty at every round,
      a hard correctness check on the iteration.'
    - 'Single-lane anchor: starting from occupancy at a single z in a single lane, the round-1 predicted
      support must equal the hand-derived set recorded in the contract text before the run.'
    required_metrics:
    - per-lane and union z-support size per round, union bound
    - per-lane and union z-support size per round, exact
    - gap between bound and exact per round
    - saturation round for the bound and for the exact support
    - NULL-OFFSET saturation-round distribution and Keccak's quantile
    - NULL-THETA saturation rounds for both arms
    - containment violation count (must be zero)
  falsification_conditions:
  - Any containment violation -- the support-update rule is incomplete and the reduced process is
    unsound.
  - The union bound saturates at round 1, leaving no dynamic range and closing the object immediately.
  - The zero-injection control produces nonempty support, falsifying the implementation.
  - The single-lane anchor disagrees with the hand-derived round-1 set.
  - Keccak's saturation round sits at the median of the NULL-OFFSET distribution -- controlled null,
    recorded as such.
  - The bound-versus-exact gap at round 4 exceeds half the support, meaning cancellation dominates
    and the reduced process predicts nothing -- a measured obstruction against support-based reasoning.
  confounders:
  - Saturation round is a small integer, so quantiles over 1000 nulls are coarse and ties are common;
    the full support-size curves are reported rather than only the saturation round.
  - Random offset multisets may contain repeats that Keccak's do not, or vice versa, changing diffusion
    for reasons unrelated to structure; the null is reported both unrestricted and restricted to multisets
    with Keccak's repeat profile.
  - The union bound ignores cancellation, which is systematically favourable to fast diffusion, so
    the bound will always saturate no later than the exact support and comparisons must be made bound-to-bound
    or exact-to-exact, never mixed.
  - pi's routing interacts with rho's offsets, so attributing a diffusion difference to offsets alone
    requires pi held fixed, which the design does but which limits what the comparison can conclude
    about the pair.
  interpretation_limits:
  - Fast or slow z-diffusion is not a security property and the record must not be read as praising
    or criticising the offset choice.
  - The reduced process is an upper bound on support and its predictions are one-sided by construction.
  - The comparison holds pi, theta, chi and the constants fixed, so it speaks about rho's offsets
    within Keccak's architecture and not about offsets in general.
  - Round-reduced structural measurement only; nothing bears on full 24-round SHA-3 or any deployed
    use.
  - A controlled-null outcome would mean the triangular structure contributes nothing measurable to
    this particular quantity, which says nothing about what it contributes to others.
  target_complexity:
    time_exponent: No attack exponent is claimed. Twelve rounds of 25 rotations and unions on 64-bit
      masks, times 1000 nulls, is under 2^22 operations; the containment check adds 10^4 full deviation
      iterations.
    memory_exponent: No attack memory exponent is claimed. Twenty-five 64-bit masks per arm.
    best_known: No incumbent is challenged and no attack is produced. Within this repository there
      is no incumbent diffusion measure for any permutation; the nearest relative is the AES lane's
      measured round effects, which use a different object and a different architecture.
    hidden_overhead: 'The lower-order term is cancellation, which the bound ignores entirely and which
      stage 3 exists to price. The human cost is small, but the interpretive risk is high: an occupancy
      curve looks like a diffusion measurement and is only an upper bound on one, and the record must
      keep saying so.'
  dominated_by: 'n/a (no result claimed). Every frontier axis checked explicitly: no attack time,
    memory or data/query row is emitted, so no frontier position is held. The comparison is between
    saturation rounds of a combinatorial process under different offset multisets, which is not an
    attack frontier.'
  sota_delta: no attack; conceptual/measurement contribution only. Output is a support-size curve,
    a saturation round, a cancellation gap and a null quantile.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the support-update rule is sound and the containment check passes:
    0.8, with the main risk being an unaccounted position introduced by theta''s column structure
    that the rule as derived misses. That the union bound has dynamic range, saturating between rounds
    2 and 5 rather than at round 1: 0.7. That the bound-versus-exact gap is small enough for the reduced
    process to predict the exact support usefully: 0.35, since cancellation under XOR is common. That
    Keccak''s saturation round separates from the random-offset null: 0.25 -- I expect a controlled
    null, and the entry is designed so that a controlled null is a recorded measurement about what
    the offsets do not do, not a nothing-result.'
