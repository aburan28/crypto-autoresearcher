idea:
  id: IDEA-20260808-cbb848
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  title: Signing A17 without measuring it - a two-sided sandwich in which negative association
    bounds the conditional term at every joint-moment order and the mixture term is exactly
    computable, so the direction the campaign declared unsignable is decided by comparing
    two closed-form numbers
  class: mechanism
  claim: 'Let N = sum_{j=1}^{n_e} 1[inner block j fails] and let W = w(e''). GOAL-HQC-001
    BATCH-002 recorded as its strongest result a NAMED OBSTRUCTION - that the direction of
    assumption A17''s failure "cannot be signed from the page, because two mechanisms of opposite
    sign are present and the distortion depends on the joint moment mu_{delta_e+1}, which
    second-moment data is structurally incapable of signing". THIS PROPOSAL CLAIMS THE OBSTRUCTION
    IS ESCAPABLE WITHOUT MEASURING THE JOINT MOMENT, because the joint moment decomposes into
    two terms of KNOWN sign: (i) CONDITIONAL ON W, the block weights (W_1, ..., W_{n_e}) are
    a multivariate-hypergeometric-type allocation and are therefore NEGATIVELY ASSOCIATED,
    which bounds E[prod_j f_j(W_j)] <= prod_j E[f_j(W_j)] for ALL increasing f_j and hence
    bounds the joint moment of EVERY order from above by its independent counterpart - so
    the conditional term can only make Theorem 6.1''s binomial tail CONSERVATIVE; (ii) the
    mixture over W contributes exactly Var_W(E[N | W]) plus higher cumulants of the same mixture,
    all computable in closed form from the weight law of e'', and this term can only make
    it OPTIMISTIC. THEREFORE sign(true DFR - Theorem 6.1 DFR) is decided by one comparison
    of two computable numbers, with no sampling at all, and the campaign''s queued joint-moment
    measurement is not the only route to the answer.'
  mechanism: 'Theorem 6.1 writes DFR <= sum_{l = delta_e + 1}^{n_e} C(n_e, l) p_i^l (1 - p_i)^{n_e
    - l}, which is exactly the tail of a Binomial(n_e, p_i) and is therefore the i.i.d.-across-blocks
    model (transcription assumption A17, implicit in the formula and unstated in prose, per
    KN-LIT-b9e1a8). Two structural facts fix its error. FIRST, if the positions of the W ones
    of e'' were a uniformly random W-subset of the code-relevant prefix, then the vector of
    block weights is multivariate hypergeometric, which Joag-Dev and Proschan proved is negatively
    associated (RECALLED FROM MEMORY, UNVERIFIED, and the permutation-distribution case is
    the one to cite); Dubhashi and Ranjan then give Chernoff-Hoeffding bounds for sums of
    NA indicators identical to the independent case. Block failure is an increasing event
    in the block''s error pattern PROVIDED the decoder''s failure region is monotone - which
    is exactly what C1-05 tests - so NA applies and the conditional-on-W tail is at most the
    binomial tail. SECOND, W is not fixed: it is a random variable whose law the specification
    itself models (and IDEA-20260805-db5afa shows is constrained to a parity class). Writing
    N''s tail through the law of total probability, Pr[N >= m] = E_W[Pr[N >= m | W]], and
    Jensen on the convex map W -> Pr[N >= m | W] gives a strictly positive inflation whose
    leading term is (1/2) Var(W) * d^2/dW^2 Pr[N >= m | W]. Both quantities are computable:
    Var(W) from the exact weight law (which C1-01''s C-A/C-B give in closed form, including
    its adversarial component), and the second derivative from Prop. 6.1.3/6.1.4''s own p_i(W).
    Comparing the two terms signs the deviation. The reason this escapes BATCH-002''s obstruction
    is that NA is an inequality valid at EVERY joint-moment order, so it does not need mu_{delta_e+1}
    to be measured; it needs only that the mixture term be computed.'
  why_not_a_renamed_known_approach: 'It is not the campaign''s own queued joint-moment estimator:
    that instrument measures mu_{delta_e+1} and, by the campaign''s own finding, cannot sign
    it. It is not a re-statement of "the bound is conservative because it is a union bound"
    - the union-bound slack is at the INNER level (Prop. 6.1.3) and the slack at issue here
    is at the OUTER, cross-block level. It is not a correlation-inequality hand-wave: NA is
    a specific, checkable property of a specific allocation model, it fails for other models,
    and the proposal names the model under which it holds and the two places it can break
    (non-monotone failure regions, and non-uniformity of positions given weight - the very
    assumption IDEA-20260805-db5afa proved false at the level of total-weight parity).'
  predictions:
  - observable: Sign of [Theorem 6.1's binomial-tail DFR] minus [the exact conditional-then-mixed
      DFR computed under the uniform-given-weight model].
    metric: log2 ratio, in bits, at HQC-1/3/5 and at three reduced cells.
    predicted: A definite sign at every parameter set, computed with no sampling. My own prior,
      which the computation is free to refute, is that at HQC-1 the mixture term dominates
      - i.e. Theorem 6.1 is OPTIMISTIC by a small number of bits - because Var(W) at n = 17669
      is large in absolute terms while the NA deficit for n_e = 46 nearly-independent blocks
      is tiny.
  - observable: The NA deficit, isolated by simulating the conditional-on-W block-weight allocation
      directly at HQC-1's true (n_e, n_2, W) grid.
    metric: log2[Pr_NA[N >= delta_e + 1 | W] / BinomialTail(n_e, p_i(W), delta_e + 1)].
    predicted: Non-positive at every W. A positive value falsifies the NA step.
  - observable: The mixture inflation, computed from the exact weight law.
    metric: log2[E_W[BinomTail(W)] / BinomTail(E[W])], in bits.
    predicted: Strictly positive; magnitude grows with Var(W), hence with C1-01's Psi.
  minimal_test: 'ENTIRELY ZERO-COMPUTE FOR THE MAIN CLAIM, which is why it should run alongside
    C1-01 rather than after it. (1) Write the two terms symbolically and evaluate them in
    exact rationals at HQC-1/3/5 using only figures already transcribed in KN-LIT-b9e1a8 (n_e,
    n_2, delta_e, p*, p_i). (2) Verify the NA step numerically at a scale where brute force
    is possible - n_e = 6 blocks of length 8, all weight allocations enumerated - by checking
    E[prod 1[W_j >= t]] <= prod E[1[W_j >= t]] exactly. (3) Verify the mixture step against
    a direct simulation at a reduced cell where DFR is about 2^-20. Total budget: under 100
    core-seconds.'
  controls:
  - MONOTONICITY PRECONDITION. Run C1-05 first or concurrently; if the ML decoder's failure
    region is materially non-monotone, the NA step is not licensed and the sandwich has only
    one side. Reporting the sandwich without this check would repeat the campaign's own four-instance
    control-blindness pattern.
  - EXCHANGEABILITY NULL. BATCH-003 found that exchangeability re-entered through HEUR-HQC-2's
    closure. Re-derive the NA claim on a deliberately NON-exchangeable allocation (blocks
    of unequal length) and confirm the inequality still holds or identify where it fails.
  - PARITY-CLASS CONTROL. Evaluate the mixture term with W restricted to the parity class
    forced by IDEA-20260805-db5afa and again without; the difference isolates how much of
    the mixture inflation is the forced algebraic channel rather than genuine dispersion.
  confounders:
  - The uniform-given-weight model is an assumption about e', not a fact; e' is a sum of three
    structured products. If positions given weight are not exchangeable, multivariate hypergeometry
    does not apply and NA must be re-derived (or abandoned) for the true law.
  - p_i itself depends on W, so "the binomial tail with p_i" is already a mixture in disguise;
    the decomposition must fix a convention for p_i(W) and state it, or the two terms will
    double-count.
  falsification_conditions:
  - The brute-force check at n_e = 6 finds an increasing pair of block events with positive
    association. NA dies and with it the signed upper half.
  - C1-05 measures a non-monotonicity rate large enough that block failure is not an increasing
    event; NA does not apply.
  - The two terms come out within a factor of 2 of each other at every parameter set, so the
    sign is not robust to the modelling choices and the campaign's measurement really is required.
    This is a legitimate and informative outcome and would strengthen, not weaken, the queued
    instrument.
  interpretation_limits: This signs the deviation of Theorem 6.1 from a MODEL of the truth,
    not from the truth. Its whole value is conditional on the uniform-given-weight model,
    which is exactly the assumption family this campaign has already found to be exactly false
    in one respect (parity). The honest headline of a positive result is "under model M, Theorem
    6.1 errs in direction D by B bits, and M's one known exact failure is controlled for".
    Claim tier TOY. Nothing here bears on deployed HQC.
  assumptions:
  - Theorem 6.1 is the binomial tail as transcribed in KN-LIT-b9e1a8.
  - Block failure is an increasing event in the block error pattern (tested by C1-05).
  - Positions of e' given its weight are exchangeable within the code-relevant prefix.
  heuristic_assumptions:
  - id: HA-1
    statement: Conditioned on w(e') = W, the positions of the ones of e' restricted to the
      code-relevant prefix of length n_e n_2 are exchangeable, so the block weight vector
      is distributed as a multivariate hypergeometric draw.
    rigorous_ingredient: Prop. 6.1.2 gives the exact marginal (each coordinate Bernoulli(p*)),
      and C1-01's C-A shows the marginal is invariant across coordinates for every fixed ciphertext
      - which is the first-moment component of exchangeability and is a theorem, not an assumption.
    distribution_imitated: 'The classical urn model: uniformly random W-subsets of a partitioned
      ground set induce multivariate hypergeometric block counts.'
    validation_route: At HQC-1's TRUE n, omega, omega_r, omega_e, sample 10^6 realisations
      of e' by sparse convolution, and test exchangeability by comparing the empirical block-weight
      vector's law against the multivariate hypergeometric with matched W, using a chi-square
      on the sorted block weights plus a direct check of the pair covariance against the hypergeometric
      value -W(n_2/n_e)(1 - 1/n_e)/(n - 1) shape. This is at deployed parameters for the WEIGHT
      STRUCTURE only, never for the DFR.
    tail_checks: Compare the empirical maximum block weight over 10^6 draws against the hypergeometric
      extreme-value prediction; the maximum block weight is the statistic the DFR actually
      depends on, so agreement in the bulk with disagreement in the max is the failure mode
      that matters.
  - id: HA-2
    statement: Pr[N >= m | W] is twice differentiable and convex in W throughout [E[W] - 6
      sd(W), E[W] + 12 sd(W)].
    rigorous_ingredient: p_i(W) is a ratio of binomial coefficients (Prop. 6.1.3/6.1.4) and
      the binomial tail is log-convex in its parameter on the relevant range.
    distribution_imitated: Cramer rate-function convexity for binomial tails.
    validation_route: Evaluate Pr[N >= m | W] on a grid of W in exact rationals and check
      second differences; no sampling needed.
    tail_checks: Confirm convexity persists at the largest W in range, where the mixture term
      draws most of its mass.
  target_complexity:
    time_exponent: Zero-compute derivation; no algorithmic exponent is claimed or moved. The
      claim is about the SIGN and MAGNITUDE (in bits) of an error in a published DFR bound,
      which enters IND-CCA2 linearly through (q_RO + q_D) * delta.
    memory_exponent: Negligible; exact rational arithmetic on tables of size n_e.
    best_known_baseline: 'The campaign''s own position after BATCH-002: the sign is unsignable
      from the page, and BATCH-003 established that direct measurement at HQC''s own parameters
      is structurally infeasible (T_req about 1/DFR: 3.4e41 / 6.8e59 / 8.4e79 trials).'
    hidden_overhead_disclosure: There is no hidden overhead; there is a hidden ASSUMPTION
      (HA-1), and it carries the whole result. Stated here rather than in a footnote.
    time_memory_tradeoff: Not applicable.
  sota_delta: Converts a declared obstruction into a decidable comparison at zero compute.
    If it works it supplies, in one session, the sign that eight batches of instrument work
    have not produced - and if it fails it names precisely which of NA, monotonicity, or exchangeability
    is the true blocker, which is forward guidance the campaign does not currently have.
  dominated_by: 'Nothing on the frontier dominates it, checked as follows: the campaign''s
    own joint-moment estimator (PS-R1/PS-R3 lineage) measures a strictly weaker object at
    strictly higher cost and both reviewers have judged its control lineage exhausted (DEC-20260806-0995d5);
    IDEA-20260805-15258a and IDEA-20260805-db5afa address the key side and the first moment
    respectively; no KN-FIND touches code-based crypto. External literature is UNSCREENED
    (no web access), and NA-based bounds on concatenated-code error exponents are a natural
    thing for the coding-theory literature to already contain - so this may well be dominated
    by a paper I cannot check, and that possibility is recorded rather than hidden.'
  estimated_cost: Implementation LOW (exact-rational evaluation plus a 6-block brute force,
    under 300 lines). Compute LOW (under 100 core-seconds).
  recommended_priority: high
  honest_prior_of_survival: 'About 0.5 that the sandwich closes and yields a definite sign
    at HQC-1, about 0.75 that at least one of the two halves is established cleanly. The main
    risk is HA-1: e'' is a structured object and exchangeability is exactly the sort of assumption
    this campaign has already caught being exactly false.'
  novelty_status: unverified
  novelty_screen: Screened against the four RQ-HQC-001 proposals, H-HQC-18d1b4/1d9b21/d46460,
    KNOWLEDGE_BARRIERS.txt, REJECTED_TITLES.txt, DEFERRED_TITLES.txt, and the GOAL-HQC-001
    batch checkpoints for BATCH-001..003 and BATCH-4b8ad3..2ecaa1 (all read this session).
    No corpus record proposes an NA-based bound. Web unavailable, so external novelty is unscreened.
  discriminated_from: 'The campaign''s queued joint-moment measurement (BATCH-003 design,
    PS-R1/R3): that measures mu_{delta_e+1}; this BOUNDS every joint moment from one side
    by a structural inequality and computes the other side exactly. IDEA-20260805-db5afa:
    a first-moment parity theorem, used here only as a control on the mixture term.'
