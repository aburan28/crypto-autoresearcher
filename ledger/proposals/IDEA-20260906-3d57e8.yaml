    "claim": "If a named protocol supplies D-d+1 suitably distinct shifted degree-D source-group tokens with the same hidden scalar and known shifts, finite-difference elimination can sometimes synthesize a needed degree-d auxiliary polynomial; it cannot create such an oracle from ordinary ECDLP, and monomial isolation may require more tokens than degree cancellation alone.",
    "mechanism": "Given tokens [(x+c_j)^D]P of the same source group and same unknown x, form the polynomial coefficient matrix over F_r. Compute a minimum-cost linear combination yielding x^d, or a polynomial whose lower-degree terms can be canceled using separately supplied tokens. Finite differences provide a structured candidate combination but all coefficients must be checked symbolically. Track a compiler circuit with source tokens, common-secret provenance, polynomial identity and multiscalar cost. Pairing outputs cannot be returned to the source group. The operation set is known linear combination of published tokens, a partial-action span with explicit acquisition. The contribution over an audit is a constructive query/circuit tradeoff on a named shifted-power family, not a new Cheon algorithm.",
