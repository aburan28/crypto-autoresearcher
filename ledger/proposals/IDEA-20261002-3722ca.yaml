idea:
  id: IDEA-20261002-3722ca
  question_id: RQ-ECDLP-002
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    Sampler exponent theta for an implicit multiplicative-coset base on a
    prime-field curve, and the cut theta < m - 4
  class: algorithm
  claim: >-
    On a generic prime-order short-Weierstrass curve E/F_p, represent each
    candidate abscissa by its discrete log in a fixed public subgroup H of
    F_p-star of order B (R1 of RQ-ECDLP-623a32). The attack stage is relation
    decomposition. Let theta be the exponent such that one decomposition
    attempt, arity m, costs B to the theta membership tests. Under the
    uniform-hit model below, charged relation collection plus linear algebra
    balances at time N to the power 2/(m - theta), where N is the prime group
    order. That exponent lies strictly below 1/2 if and only if theta < m - 4,
    and the sparse-hit regime used to derive the model holds at the balance
    point only if theta <= 1. For arity m = 5 the two cuts coincide at
    theta < 1. The proposal does not assert that theta < 1. It asserts that a
    toy measurement of additive energy of the successful seeds decides which
    side of the cut the implicit-membership base is on, against matched
    Pollard rho and BSGS.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the integer exponent e in 0..B-1 of an
    abscissa x = g to the e lying in a fixed subgroup H of F_p-star, g a
    public generator of H. Operation set Sigma: the single quadratic-formula
    step that, given one seed e and a public abscissa x(R), solves the
    degree-2 chord equation in the next abscissa and accepts the root only
    when it lies in H. Sigma does not contain elliptic translation. F2 (the
    chord equation, classically S_3) is a named component, not the lens. The
    lens is the cost of listing accepted seeds. TRICHOTOMY: branching. The
    acceptance bit is not a block system of a group acting on E. It is a
    membership event. LOSSY PROJECTION: the tracked object keeps e and
    discards the ordinate sign and every abscissa outside H. The discard is
    compatible with Sigma because Sigma is defined to reject non-members.
    Keeping the full point would be a coordinate change. It is not kept.
    DERIVATION, to be rechecked symbolically before any exponent is quoted
    as a result. Let pi be the probability a random target R = uP + vQ
    admits at least one decomposition into m - 1 points with abscissae in H.
    Model pi = Theta(B to the m-1 over N), used only when that quantity is
    at most 1. Let one attempt cost C = B to the theta. About B relations
    are required for a square matrix of width B. Then T_rel = Theta(N times
    B to the power theta + 2 - m) and T_LA = Theta(B squared) at matrix
    multiplication exponent 2. Balancing gives N = Theta(B to the m - theta)
    and T = Theta(N to the power 2/(m - theta)). Compare with rho time
    Theta(N to the 1/2). The inequality 2/(m - theta) < 1/2 is exactly
    theta < m - 4. Substituting the balanced B back into pi <= 1 forces
    theta <= 1. Hence m = 4 cannot cross below 1/2 for any theta >= 0
    (at theta = 0 the formula ties rho). m = 5 crosses if and only if
    theta < 1. Theta = 1 is a full scan of H. Theta < 1 is possible only if
    the successful seeds are cheaper to list than a scan, which for a
    uniformly random subset of H of size o(B) is false. The discriminating
    quantity is therefore the additive energy of the successful exponent
    set against a random subset of Z/BZ of the same cardinality.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over F_p is at least as costly as generic
        algorithms under the stated statistical assumptions, and the named
        algebraic factor bases are reported only at small parameters. Read
        from the rendered index-calculus frontier map, not from the primary
        papers.
      verified_by: idea-generator session 2026-10-02
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials are the index-calculus framework. Novelty has
        to sit in the factor base, the elimination, or the solver. Read from
        the rendered frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: 10.1016/j.ffa.2018.01.009
      provenance: retrieved
      claim: >-
        Amadori, Pintore, and Sala (Finite Fields Appl. 2018), introduction
        as read in the accepted manuscript: over prime fields their variant
        reduces relation collection to one multivariate system and they state
        that more work is needed before any improvement on Pollard rho. This
        proposal does not use their on-the-run factor base. It uses the
        sentence that the prime-field decomposition cost is the remaining
        obstacle.
      verified_by: idea-generator session 2026-10-02
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Bounded-degree plane predicates are the scoped-out class. Implicit
        membership is named as still open.
      verified_by: idea-generator session 2026-10-02
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C as read in the finding: exact sum-compatibility plus
        associativity forces a surjective homomorphism onto a group of order
        M, impossible for prime N and M < N. Sigma is therefore not a
        sum-compatible bucket index on E.
      verified_by: idea-generator session 2026-10-02
  assumptions:
    - >-
      F2 is a component only. The chord equation is used as a quadratic
      membership test. No claim is made for summation polynomials as such.
    - >-
      KN-OPEN-020 class of the base: implicit-membership. Membership is one
      exponentiation, x to the (p-1)/B equals 1, not evaluation of a dense
      degree-(p-1)/B polynomial. Description cost, membership cost, relation
      cost, descent (none is claimed), time, and memory are the quantities
      in target_complexity. If a reviewer reads the binomial as a
      bounded-degree predicate, the base is inside the scoped-out class and
      this record stops.
    - >-
      Linear algebra is charged at exponent 2. A smaller matrix-multiplication
      exponent only lowers the linear-algebra side.
  predictions:
    - metric: >-
        additive energy of the successful exponent set divided by the energy
        of a uniform random subset of Z/BZ of equal size, at arity m = 5
      direction: different
      minimum_effect: >-
        A ratio at least 4, sustained on at least 20 decomposable targets,
        is the smallest effect this record treats as evidence that theta
        may be below 1. A ratio in the closed interval from 0.5 to 2 is
        the uniform side and forces the conditional time exponent to stay
        at least 1/2 inside the model.
    - metric: >-
        charged field multiplications per successful decomposition, divided
        by B, which is the empirical theta in log scale (log cost over log B)
      direction: lower
      minimum_effect: >-
        Empirical theta at most 0.95 on the toy grid, against a scan baseline
        of theta = 1. A drop smaller than 0.05 is inside implementation noise
        and counts as theta = 1.
  minimal_test:
    design: >-
      Toy primes with N near 2 to the 20 and B near N to the 1/4, so that
      at m = 5 the uniform model predicts pi near 1 and successful seeds
      exist to measure. For each of 20 random targets that do decompose,
      list the successful exponents by a full scan (the theta = 1 baseline)
      and compute additive energy. Repeat on a non-subgroup control set of
      the same size. Do not scale past the toy grid.
    controls:
      - >-
        Pollard rho with distinguished points, and BSGS, on the same curves
        and the same targets, as matched cost baselines. No live keys.
      - >-
        Random-label control: replace H by a uniform random B-subset of
        F_p that is not a coset of a subgroup of size B. The energy ratio
        on that set is the artifact null.
      - >-
        Generic-group control: the same seed test on a relabelled copy of
        Z/NZ with a random injection into the abscissa slot. Structure that
        appears there is not elliptic.
      - >-
        m = 4 negative control on the same curves. The formula says m = 4
        does not cross below 1/2 for any theta >= 0. A reported crossing at
        m = 4 falsifies the algebra, not the curve.
    required_metrics:
      - empirical theta at m = 5
      - additive-energy ratio against the random subset
      - energy ratio on the non-subgroup control
      - rho iteration count and BSGS table size on the same toy
  falsification_conditions:
    - >-
      Energy ratio in [0.5, 2] on every decomposable toy target, including
      the j = 0 control curve. Then theta = 1 inside the tested range and
      the conditional exponent does not drop below 1/2.
    - >-
      The symbolic balance N = Theta(B to the m - theta) fails to reproduce
      T = Theta(N to the 2/(m - theta)) when the Theta constants are
      expanded. Then the exponent claim is an algebra error.
    - >-
      pi exceeds 2 times B to the m-1 over N by a factor growing with N on
      the fixed-base (non-target-dependent) arm. Then H1 is false and the
      formula is not the cost.
    - >-
      Membership by exponentiation is charged, by a counted instruction
      trace, at more than (log p) squared field multiplications. The
      implicit-membership escape was a hidden dense polynomial. Stop and
      place the base in the scoped-out class.
  confounders:
    - >-
      About half of the elements of H fail to be abscissae of affine points.
      That factor sits in Theta. It must be measured, not absorbed into theta.
    - >-
      Sign choices for the ordinate double the relation count. Counting them
      as separate seeds inflates energy.
    - >-
      At B near N to the 1/4 and m = 5, pi near 1 sits on the boundary of
      the sparse-hit hypothesis. Report pi itself.
    - >-
      A faster scan from hardware exponentiation is not a smaller theta.
      Theta is counted in membership tests, not in wall-clock seconds.
  interpretation_limits:
    - >-
      Toy N near 2 to the 20 only. No transfer to cryptographic p is claimed.
      A theta below 1 at this N does not by itself give a cryptographic
      exponent.
    - >-
      KN-OPEN-020 class: implicit-membership. This record does not enter the
      high-degree dense or target-dependent classes. Those are separate
      proposals.
    - >-
      Unconditional on theta, the model does not beat rho. KR-IC-5931ee
      remains the statement about naive Gröbner decomposition. This record
      does not contradict it.
    - >-
      No solve and no relation is claimed. No certificate is produced.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For uniform random R in the prime-order subgroup, the number of
        (m - 1)-tuples of H-abscissae whose chord-sum is R is within a
        factor 2 of B to the (m - 1) over N, whenever that quantity is at
        most 1, at the toy parameters N near 2 to the 20 and B near N to
        the 1/4, m in {4, 5}.
      rigorous_support: >-
        The count imitates a uniform random mapping from a domain of size
        B to the (m - 1) into a codomain of size N, whose image size is the
        classical balls-and-bins expectation. It is not a theorem for the
        chord equation.
      validation_plan: >-
        Sample 200 random targets at one toy prime. Compare the empirical
        hit indicator to the mean B to the (m - 1) over N. Tail check: the
        most decomposable target in the sample is at most 10 times the
        mean, or H1 fails. No Deuring shortcut is available. The transfer
        assumption, if anyone later quotes cryptographic p, is that the
        same factor-2 window survives. This proposal does not make that
        transfer.
    - id: H2
      statement: >-
        If the additive energy of the successful exponents exceeds 4 times
        the energy of a random set of the same size, then those exponents
        are contained in a union of at most B to the 1/2 arithmetic
        progressions, and listing them costs B to the theta with theta <= 1/2.
      rigorous_support: >-
        Balog–Wooley type energy-to-structure statements for subsets of Z/BZ
        give a large arithmetic progression inside a high-energy set, up to
        constants this proposal does not pin. The theta <= 1/2 listing cost
        is the imitation, not the theorem. A recalled pointer is the
        energy increment literature. It was not opened in this session.
      validation_plan: >-
        On every toy target with energy ratio at least 4, run a Greville or
        plain FFT autocorrelation and record the shortest arithmetic
        progression that covers the seeds. Theta is log(listing cost) over
        log B. If the cover is longer than B to the 1/2, H2 fails even
        though the energy was high.
  target_complexity:
    time_exponent: >-
      Conditional on theta < m - 4 and on H1 in the sparse regime:
      N to the power 2/(m - theta). At m = 5 and theta = 1/2 this is
      N to the 4/9. Unconditional, and on the uniform side theta = 1:
      the model does not go below N to the 1/2.
    memory_exponent: >-
      The relation matrix at the balance point has B squared rows worth of
      storage, hence the same exponent 2/(m - theta) as time. Rho memory is
      polylog N. The conditional point spends more memory to buy a lower
      time exponent.
    best_known: >-
      p to the 1/2 times polylog, Pollard rho, on a generic prime-field
      prime-order curve.
    hidden_overhead: >-
      Theta-notation hides m factorial, the fraction of H that lifts to
      points, a (log p) squared factor per exponentiation, and linear-algebra
      log factors. No o(1) in the exponent is claimed. The exponent is exact
      only inside the model.
    tradeoff_note: >-
      Single target, no preprocessing. Not a van Oorschot–Wiener curve.
      Parallelism is linear in the scan of H and does not change theta.
      Memory is the matrix, not distinguished points.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      The listing cost B to the theta of one accepted seed. Removing the
      hypothesis theta = 1 is the only step that moves 2/(m - theta).
    baseline_embedding:
      parameter_slice: >-
        theta = 1, any m. The formula returns time at least N to the 1/2
        after the regime check, which is the rho baseline inside the model.
      reproduction_check: >-
        Expand T_rel and T_LA with explicit constants c_pi, c_LA on a
        one-page symbolic balance and confirm the cut theta < m - 4. A
        failed expansion falsifies the record before any curve is touched.
    observation_collision:
      observable: >-
        The successful exponent set at a fixed R, together with its additive
        energy.
      distinct_preimage_search: >-
        Two seeds e and e-prime with the same energy contribution but
        distinct points. If every high-energy pair is the same point written
        twice (sign or coordinate duplicate), the energy is an artifact.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The exponent e in Z/BZ in place of the point, with Sigma the
          quadratic membership step.
        predicted_gain: >-
          A drop of theta from 1 to 1/2 at m = 5 moves the model exponent
          from a non-win (the theta = 1 side stays at or above 1/2) to
          4/9.
    quantifier_order: >-
      FOR ALL curves and targets in the toy grid, the measured energy ratio
      is either at least 4 (EXISTS a short arithmetic cover, theta <= 1/2
      is then the hypothesis under test) OR at most 2 (FOR ALL such targets
      theta = 1 and the model stays at or above exponent 1/2). The record
      claims the disjunction is decidable. It does not claim which arm fires.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scoped value of theta and a checked algebraic identity for
        2/(m - theta). Not a cryptographic break, and not a contradiction
        of KR-IC-5931ee.
      nearby_object_control: >-
        The same identity on a random B-subset that is not a subgroup. If
        theta drops there too, the subgroup was not the mechanism.
    proof_obligations:
      - claim: >-
          The balance T = Theta(N to the 2/(m - theta)) follows from
          pi, C, and B relations as written.
        responsibility: runtime
      - claim: >-
          theta <= 1 is required for pi <= 1 at the balanced B.
        responsibility: feasibility
      - claim: >-
          m = 4 does not cross exponent 1/2 for theta >= 0.
        responsibility: scope
    not_applicable_reason: null
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5931ee
      - KR-IC-5a43e5
      - KR-IC-955fd6
      - KR-IC-46d822
      - KR-IC-9e610d
      - KR-IC-0d2021
      - KR-RHO-13bf67
      - KR-RHO-0528e7
    nearest:
      - ref: KR-IC-5931ee
        provenance: retrieved
        relation: adjacent
        delta: >-
          That row lower-bounds naive Gröbner decomposition and records
          algebraic bases only at small parameters. This record does not
          rerun that Gröbner bound. It prices a different quantity, the
          listing exponent theta of implicit membership by one
          exponentiation, and the cut theta < m - 4. No speedup over
          p to the 1/2 is asserted.
      - ref: KR-IC-5a43e5
        provenance: retrieved
        relation: adjacent
        delta: >-
          The chord equation is a component. The claimed observable is
          theta, not a new summation polynomial.
    searched:
      corpus_grep:
        - implicit-membership
        - multiplicative subgroup factor base
        - sampler exponent theta
      web:
        - >-
          Amadori–Pintore–Sala 2018 manuscript introduction, read this
          session. Petit et al. 2016 was not opened. It is named only
          inside KR-IC-5931ee.
      blocked: []
  dominated_by: >-
    Unconditional reading (theta >= 1): KR-RHO-13bf67, Pollard rho at
    exponent 1/2 with polylog memory, which is strictly better in memory
    and no worse in time than the model. Conditional reading (theta < 1
    at m = 5): not strictly dominated on time by any row checked in
    prior_art.rows_checked. KR-RHO-ea34b8 reaches online exponent 1/3 only
    with preprocessing of size about l to the 2/3 and is a different data
    axis. KR-IC-46d822 beats a square root only for extension degree
    n >= 3, which this prime-field model does not use.
  sota_delta: >-
    Against p to the 1/2 rho: the uniform arm has time-exponent delta 0
    and a memory increase from polylog to N to the 2/(m - 1) at theta = 1,
    which is worse memory and not better time. The conditional arm at
    m = 5 and theta = 1/2 has time exponent 4/9, a delta of 1/2 - 4/9 =
    1/18 below the rho exponent, paid for by memory exponent 4/9. That
    arm is unmeasured.
