idea:
  id: IDEA-20261006-2cd127
  added: '2026-10-06'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  title: >-
    Image size of x(P+T) x(Q) on y^2 = x^3 - x over F_17, against the
    field shift x maps to x+1
  class: representation
  claim: >-
    Toy instance only, prediction fixed before any run. Let E be
    y^2 = x^3 - x over F_17 and let T = (1, 0), a rational point of
    order 2. Representation class R3 of RQ-ECDLP-623a32: ordered pairs
    of affine points (P, Q) on E times E, tracked by the single field
    element x(P) times x(Q). The attack stage is collision structure of
    that pair encoding. This claim does not say the stage's exponent
    changes. Let S be the set of pairs of affine points with P not
    equal to T. Let I_ell be the number of distinct values
    x(P+T) times x(Q) for (P, Q) in S, and let I_shift be the number
    of distinct values (x(P) + 1) times x(Q) for the same pairs.
    Prediction: I_shift minus I_ell is at least 2, and the branching b
    defined below is at least 2. Either inequality failing is a
    negative. On the control curve E_0: y^2 = x^3 + x over F_17 with
    T_0 = (0, 0), the same image gap against its own field shift is
    predicted to be at most 1. If both curves have a gap of at least 2,
    the gap is the field shift and the claim fails.
  mechanism: >-
    PAIR. Representation: the product of the two Weierstrass
    x-coordinates on E times E, an R3 pair representation, not a
    degree-d function on a single curve and not the Kummer line of
    one point. Operation set Sigma is translation by the single point
    T on the first factor only, (P, Q) maps to (P+T, Q). The subgroup
    generated by T has order 2, so Sigma is not the full translation
    action of any odd-order subgroup. Trichotomy class: branching.
    Reason: x(P+T) times x(Q) is not fixed by the product
    x(P) times x(Q); the chord-and-tangent sum reads y(P), which the
    product discards, so one product has several images.
    Lossy-projection test against this Sigma. Discarded: the
    factorisation of the product into x(P) and x(Q), both
    y-coordinates, and the second factor's point beyond x(Q). The
    discard is compatible with Sigma only as a branching bound: there
    is no claimed block system on which the product propagates
    deterministically. It is lossy because many pairs share one
    product whenever more than one factorisation exists in F_17, and
    a bijection between pairs and products would make the loss zero
    and would falsify the branching prediction b at least 2. The open
    number is the pair (L, b) of IDEA-20260802-002, with b(m) the
    number of distinct values x(P+T) times x(Q) among pairs with
    x(P) times x(Q) equal to m, b the maximum of b(m), and L equal to
    log2 of the size of S minus log2 of the number of distinct
    products. The minimal test measures b and the image gap against
    the null operation x maps to x+1 on the same pairs, and against
    E_0 with its own rational 2-torsion point. F1 through F7 are not
    the lens. In particular the product is not a summation polynomial
    and not a walk.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R3 includes E times E gluing representations. Kummer-line and
        degree-d-function-on-E representations are closed at model
        lever 1.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Full-translation deterministic lossy projections are constant
        or injective. Branching is the class where the update is
        multi-valued.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        ledger/proposals/IDEA-20260806-c5d183.yaml
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C rules out an exactly sum-compatible bucket index that
        is a surjective homomorphism onto M less than N for N prime.
        This proposal does not claim sum-compatibility.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/findings/KN-FIND-ffe1df.md at the Theorem C paragraph
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Semaev summation polynomials vanish on x-coordinates of points
        that sum to infinity, and using them for decomposition is the
        index-calculus framework itself.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group discrete logarithm on a prime-order group needs
        Omega(sqrt(p)) group operations.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Walking on negation classes gives a square-root-of-2 iteration
        reduction and introduces fruitless cycles. That is a rho walk,
        not a product on E times E.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
    - ref: KR-RHO-6654ba
      provenance: internal
      claim: >-
        On binary curves, point halving can replace addition-based rho
        steps and make iterations cheaper (Zhang-Wang 2011). The row
        states no numeric factor.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6654ba.yaml
  assumptions:
    - >-
      T = (1, 0) lies on y^2 = x^3 - x and has order 2 because the
      right-hand side vanishes at x = 1 and the polynomial has distinct
      roots 0, 1, and -1 in F_17.
    - >-
      T_0 = (0, 0) lies on y^2 = x^3 + x and has order 2.
    - >-
      Both cubics are nonsingular in characteristic not 2: each is of
      the form x^3 + A x with A not 0.
    - >-
      The field shift that sends x to x+1 is not the elliptic group
      law. It is the null operation.
  proof_search_map:
    not_applicable_reason: >-
      This is a branching measurement of one product on one prime
      field, not a proof that a collision-structure exponent changes.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: I_shift minus I_ell on E with T = (1, 0)
      direction: higher
      minimum_effect: I_ell is at least 2 below I_shift
    - metric: branching b on E
      direction: higher
      minimum_effect: at least 2
    - metric: image gap on E_0 with T_0 = (0, 0)
      direction: different
      minimum_effect: at most 1, while E's gap is at least 2
  minimal_test:
    design: >-
      List every affine point of E(F_17) and of E_0(F_17) by testing
      squares. On E, restrict to pairs with P not equal to T. Compute
      I_ell, I_shift, and b. Repeat on E_0 with T_0, calling the image
      sizes I_ell0 and I_shift0. Addition is the chord-and-tangent law.
      Do not replace it by a pre-simplified rational function. The
      prediction is scored only after both curves are finished.
    controls:
      - >-
        Field-shift null on the same pairs: replace x(P+T) by x(P)+1
        and keep x(Q).
      - >-
        Second curve of the same shape: E_0 given by y^2 = x^3 + x
        with its own order-2 point T_0 = (0, 0), same product and same
        field shift.
      - >-
        Generic-label null: replace the list of x(P) by the arithmetic
        progression 0, 1, 2, and so on, of the same length, add 1 in
        F_17, and multiply by the same list of x(Q). Record that image
        size. It is an instrument comparison; the success gap is
        I_shift versus I_ell.
    required_metrics:
      - I_ell
      - I_shift
      - I_shift minus I_ell
      - b
      - L
      - I_ell0
      - I_shift0
      - I_shift0 minus I_ell0
  falsification_conditions:
    - I_shift minus I_ell is less than 2.
    - b is 0 or 1.
    - >-
      I_shift0 minus I_ell0 is at least 2. The field shift then
      produces the gap on both curves, and the claim that E is special
      fails.
    - >-
      T is not order 2, or P+T cannot be computed for some P not equal
      to T because of an arithmetic error. That is an invalid run, not
      support.
    - >-
      A timeout or crash is infrastructure, not a falsification and
      not support.
  confounders:
    - >-
      Pairs with x(P) = 0 or x(Q) = 0 collapse the product to 0 and
      can shrink both images. The test keeps those pairs and reports
      the zero bin separately.
    - >-
      E(F_17) may not have prime order. The claim is about the product
      on the whole rational point set, not about a prime-order
      subgroup discrete logarithm.
    - >-
      Using -T instead of T is the same translation. Using a different
      order-2 point, (0, 0) or (-1, 0), is a different Sigma and is
      not a retry of this prediction.
  interpretation_limits:
    - >-
      A confirmed gap is a counted image difference at p = 17. It is
      not an exponent improvement over rho and not a factor-base
      escape from KN-OPEN-020.
    - >-
      The product factors through the two x-coordinates. The closed
      Kummer-line result still forbids returning the x-coordinate of
      one point as a new object. The object here is the product on
      E times E under a one-factor order-2 translation, and the
      quantity that can fail is the branching.
    - >-
      If b = 1 the trichotomy label in this proposal is wrong for this
      instance. That is a negative, not a reclassification license to
      claim a partial action after seeing the data.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On E(F_17) given by y^2 = x^3 - x, the image of
        x(P+T) times x(Q) is at least 2 smaller than the image of
        (x(P)+1) times x(Q) on the same pairs, while the same
        comparison on y^2 = x^3 + x with T = (0, 0) shrinks the image
        by at most 1, as if translation by (1, 0) imposed a relation
        that a field shift and the inversion-shaped translation by
        (0, 0) do not share.
      rigorous_support: >-
        The chord-and-tangent law is a rational function of x and y.
        No theorem opened in this session bounds the image of the
        product. The size gap imitates a uniformity statement that
        was not proved here: a generic degree-2 rational map on a set
        of size about p hits a positive fraction of F_p.
      validation_plan: >-
        Sample every affine pair at p = 17, not a subset. Compare
        I_ell with I_shift and compare I_ell0 with I_shift0. The
        arithmetic-progression label list of the same length is the
        generic-group-shaped control. Second-scale control, only if
        both inequalities hold at p = 17: repeat on y^2 = x^3 - x
        over F_29 with T = (1, 0), same minimum gap of 2 against the
        map x to x+1, and the same at-most-1 prediction on
        y^2 = x^3 + x over F_29 with T = (0, 0). A gap that appears
        only at p = 17 falsifies H1 as a stable image defect.
  target_complexity:
    time_exponent: p^{1/2} unchanged
    memory_exponent: O(1) beyond storing the prime-field point list
    best_known: >-
      Pollard rho in Theta(p^{1/2}) group operations on a prime-order
      subgroup, matching KR-RHO-13bf67 up to the constant
    hidden_overhead: >-
      None claimed. No o(1) term is introduced because no asymptotic
      algorithm is proposed.
    tradeoff_note: >-
      The measurement stores one product per pair, O(p^2) field
      elements at this toy size, and does not define a time-memory
      tradeoff for a discrete-logarithm algorithm.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    Opened KR-RHO-13bf67, KR-RHO-fb88e6, KR-RHO-5b1c0a, KR-RHO-6654ba,
    KR-IC-5a43e5, and KR-IC-46d822. None states the image size of
    x(P+T) times x(Q) on y^2 = x^3 - x over F_17. KR-RHO-13bf67
    dominates any exponent reading: Omega(p^{1/2}) against this
    proposal's exponent delta 0. KR-RHO-6654ba reports cheaper binary
    rho iterations by substituting halving for addition and states no
    numeric factor and no image size. KR-IC-5a43e5 dominates any
    reading of the product as a summation polynomial: S_2 is x1 minus
    x2, not a product, and this proposal does not decompose a point.
  sota_delta: >-
    Exponent difference 0 against Omega(p^{1/2}). Counted delta: image
    gap at least 2 and branching at least 2 at p = 17, with the
    control curve's gap at most 1. KR-RHO-6654ba's saving is an
    unquantified per-iteration discount on binary curves, not this gap.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-5b1c0a
      - KR-RHO-6654ba
      - KR-IC-5a43e5
      - KR-IC-46d822
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          Summation polynomials are the decomposition framework. This
          proposal never forms S_m. The measured object is an image
          size of a product under translation by one order-2 point.
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: orthogonal
        delta: >-
          The negation map quotients by the pair {P, -P} inside a rho
          walk and saves a square-root-of-2 factor. This proposal
          translates the first factor of a pair by T and claims no
          walk speedup.
      - ref: KR-RHO-6654ba
        provenance: internal
        relation: orthogonal
        delta: >-
          Keyword collision on halving and on a 2-torsion point. The
          row says binary rho iterations get cheaper when point halving
          replaces addition, and it states no numeric factor. This
          proposal's counted delta is I_shift minus I_ell at least 2
          at p = 17, exponent difference 0, and it never replaces a
          rho step by halving.
    searched:
      corpus_grep:
        - ledger/proposals IDEA-2026100 titles and RQ-ECDLP question_ids
        - product of x-coordinates, kernel polynomial
        - z-coefficient, Legendre, Galois-orbit
      web: []
      blocked: []
