idea:
  id: IDEA-20260828-54fd0a
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-28'
  title: 'Test whether the disturbance-vector class and its detector even apply once the initial chaining
    value is attacker-unknown: measure how message-modification condition-satisfaction probability
    degrades as an increasing number of initial state bits are hidden from the attacker, at reduced-step
    scale, to bound whether the classical near-collision attack model -- and hence its detector -- has
    any purchase on legacy HMAC-SHA-1 usage.'
  class: mechanism
  claim: '(A) RQ-SHAONE-081e3a''s own scope block names "legacy HMAC-SHA-1" as a live deployed usage
    of SHA-1 this program''s scope covers, alongside Git object IDs and PGP web-of-trust material. Every
    proposal in this batch -- the cost-model decompositions and both detector audits -- implicitly assumes
    the standard UNKEYED setting: the attacker freely chooses the full message from the standard, publicly
    known SHA-1 initial chaining value, which is exactly what message modification (KN-TECH-066) and
    the disturbance-vector class 3edd14 enumerates both require. In HMAC-SHA-1, the inner hash''s initial
    chaining value is H(ipad XOR key), a value the attacker does NOT know without breaking the key first.
    Whether the classical disturbance-vector class -- and therefore anything the deployed detector was
    designed to catch -- has any relevance to keyed usage is a genuinely open, untested scope question
    in this program''s corpus. (B) This is measurable without touching HMAC-SHA-1 directly or any real
    key: at reduced-step or MD5 scale, run the SAME message-modification/condition-satisfaction machinery
    the classical attack uses, but MARGINALISE over an increasing number m of initial chaining-value
    bits treated as unknown (drawn independently and uniformly, with the modification procedure required
    to succeed simultaneously across a sample of draws rather than for one fixed known value). The achievable
    success probability (or, equivalently, the residual degrees of freedom after modification) as a
    function of m is a real, computable curve. (C) The claim is that this curve is measurable at a small
    scale where exhaustive or large-Monte-Carlo verification is possible, that its decay shape (geometric
    in m, versus a sharper collapse, versus near-flat) is a falsifiable, two-sided question, and that
    a curve which collapses well before m reaches the number of unknown bits in a real keyed chaining
    value would support that the classical attack machinery -- and the detector built to catch it --
    has NO PRACTICAL PURCHASE on keyed usage, which is a real scope-narrowing finding for what "the detector
    protects" actually covers. (D) WHAT IS NOT CLAIMED: no attack on HMAC-SHA-1 of any kind, no statement
    about HMAC-SHA-1''s PRF security (a different and stronger property than collision resistance),
    no new SHA-1 or MD5 collision under unknown-key conditions, and no assertion about any deployed
    system. (E) A curve that does NOT collapse quickly -- i.e. condition-satisfaction probability degrades
    only mildly as bits are hidden -- would be an equally valuable and more surprising result, meaning
    the classical attack machinery is more robust to partial state ignorance than assumed, which would
    then make the keyed-usage scope question a live one worth pursuing further rather than one this
    proposal can close.'
  mechanism: 'STAGE 1: fix a reduced-step or truncated ARX compression function (following the same
    truncation discipline as this batch''s IDEA-20260816-71d4dd and IDEA-20260816-ade53e) with a declared
    classical disturbance vector and its associated message-modification procedure, at a scale where
    the FULL-KNOWLEDGE (m=0) success probability is directly measurable by many independent trials.
    STAGE 2: for increasing m (number of initial chaining-value bits treated as unknown, from 0 up to
    the full state width), redefine "success" as: the message-modification procedure, run using only
    the KNOWN bits and a stated default/marginalisation policy for the unknown bits (e.g. zero-fill,
    or requiring the modification to be valid simultaneously for a declared sample of random assignments
    to the unknown bits), achieves the differential path. Measure the achieved success probability at
    each m over many independent trials with fresh random assignments to both the message and the unknown
    bits. STAGE 3: fit the decay curve P(success | m) and compare against two named candidate forms
    -- (i) roughly geometric decay, P(m) approximately P(0) times r^m for some rate r less than 1, consistent
    with each unknown bit independently costing a fixed fraction of the remaining freedom, versus (ii)
    a sharp collapse at some threshold m*, consistent with a small number of "load-bearing" early conditions
    that fail almost certainly once even a few specific bits are unknown. STAGE 4, null control: repeat
    STAGE 1-3 with a SYNTHETIC condition chain of matched length and matched per-condition individual
    success probability but with conditions verified NOT to depend causally on the marginalised bits
    at all (e.g. conditions placed only in later message words with no data dependency on the initial
    chaining value), which by construction should show P(success | m) flat in m -- validating that the
    measured decay in the real chain is attributable to genuine data dependency on the hidden bits and
    not to an artifact of the marginalisation procedure. STAGE 5: report m* (or the fitted rate r) alongside
    the actual number of unknown bits in a real keyed initial chaining value (the full state width, since
    HMAC''s inner IV is a full compression-function output the attacker does not know at all without the
    key), making explicit how far the measured collapse point sits from that real number -- while stating
    plainly that this comparison is a SCALE COMPARISON across mismatched settings and not a numeric transfer.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a in full; its scope.standardization_status explicitly names "legacy
      HMAC-SHA-1" among live deployed uses. Read all 10 filed RQ-SHAONE proposals'' claims and mechanisms:
      every one operates on the standard unkeyed setting (full message freedom from the standard IV)
      and none mentions HMAC, keyed usage, or partial-chaining-value-knowledge. Grepped ledger/proposals
      for ''HMAC'' restricted to files also matching ''SHA''; grepped for ''keyed'' and ''chaining value
      unknown'' across ledger/proposals (no hits combining a keyed-usage question with disturbance-vector
      or message-modification machinery). Read knowledge/techniques/KN-TECH-066.md in full, which frames
      the entire unkeyed-vs-keyed economic distinction as the reason differential cryptanalysis of hash
      functions is fundamentally different from block-cipher differential cryptanalysis, but records
      no measurement of a PARTIAL-knowledge regime between the two extremes.'
    results: No proposal in this batch or elsewhere in ledger/proposals (as far as this session's grep
      reached) measures how message-modification/near-collision attack machinery degrades as a function
      of partial ignorance of the initial chaining value, and none connects this to the RQ's own explicit
      HMAC-SHA-1 scope note. KN-TECH-066 states the qualitative unkeyed/keyed distinction as background
      but contains no curve, no marginalisation procedure, and no threshold measurement.
    verdict: 'UNVERIFIED. No claim is made about whether the general question of "how much unknown state
      degrades a differential attack" has been studied in the cryptanalysis literature at large -- it
      would be unsurprising if related ideas appear in work on hash-based MACs or on quantifying differential
      attacks under partial key/state knowledge. What is claimed new internally: this repository holds
      no measurement of this curve for any hash-function differential attack, and no proposal connects
      the RQ''s own named HMAC-SHA-1 scope item to a testable question about whether the disturbance-vector
      class -- and therefore the detector built to catch it -- has any purchase outside the fully-known-IV
      setting every other proposal in this batch assumes.'
  citations:
    - ref: KN-TECH-066
      provenance: internal
      claim: "States the qualitative distinction that unkeyed differential cryptanalysis lets the attacker construct rather than merely collect conforming pairs, and that this economics does not hold once a secret key is present."
      verified_by: "Read in full this session."
    - ref: "RFC 2104 (HMAC construction)"
      provenance: recalled
      claim: "HMAC's inner hash initial chaining value is H(ipad XOR key), a full compression-function-width value the attacker cannot compute without knowledge of the key."
      verified_by: null
  object_first_candidate:
    tracked_object: 'The success/failure outcome of the message-modification procedure at declared marginalisation
      level m, carried as a Bernoulli draw per trial. What is followed through the computation is the
      SUCCESS-PROBABILITY CURVE P(m), not any individual message or state.'
    lossiness: 'Genuinely lossy. Each trial''s full message, differential path, and internal state are
      discarded, retaining only a success bit and the value of m. It is compatible with the operation
      because the modification procedure''s success is exactly a Bernoulli outcome as a function of
      m under the declared marginalisation policy, and the retained bit-and-m pair is what a decay-curve
      fit needs; what is lost is any per-condition attribution of WHICH bits being unknown caused a
      given failure, which is why STAGE 4''s data-independence null and STAGE 5''s explicit named comparison
      to real HMAC bit-width both exist as separate, coarser checks rather than being reconstructible
      from the curve alone.'
    propagation: 'One step of the target operation is one trial of the message-modification procedure
      at one declared m. It produces one success/failure draw; accumulating many draws at each m produces
      an empirical P(m) with a binomial confidence interval, and the curve across declared m values is
      the deliverable.'
    survival_score: 'The object survives as long as m is small enough that a meaningful number of trials
      can be run within budget at each level -- since larger m plausibly drives P(m) toward the generic
      birthday/brute-force floor, at which point trials succeed so rarely that the binomial interval
      becomes uninformative long before m reaches a real keyed chaining-value''s full bit width. Locating
      the m at which trials become too rare to measure at this budget is itself a required, reportable
      quantity, distinct from m* (the fitted collapse point), since the two can differ if the curve is
      measurable well past its collapse but not all the way to a real HMAC-scale m.'
  null_object_control: 'Synthetic condition chain (STAGE 4) of matched length and matched per-condition
    individual success probability, built with conditions placed only where they have NO data dependency
    on the bits being marginalised. Run through the IDENTICAL marginalisation-and-trial procedure in
    the same invocation. This null MUST show P(success | m) flat in m; if it does not, the marginalisation
    procedure itself is introducing an artificial penalty unrelated to genuine data dependency, and no
    claim about the real classical condition chain''s decay is admissible.'
  discriminated_from:
    - 'IDEA-20260816-ade53e (restart / abort-depth tail index): measures the DISTRIBUTION of how far
      a near-collision search gets before restarting under FULL knowledge of the initial state; this
      proposal varies how MUCH of the initial state is known at all, a disjoint axis, and shares only
      the reduced-step-analogue methodology.'
    - 'IDEA-20260816-71d4dd (birthday-phase distinguished-point efficiency): measures achieved-versus-ideal
      efficiency of the PARALLEL SEARCH under standard full-knowledge assumptions; this proposal never
      touches the birthday phase and instead asks whether the near-collision-block machinery itself
      presupposes full initial-state knowledge.'
    - 'IDEA-20260816-3edd14 and IDEA-20260816-70b60d (detector coverage and error-rate audits): both
      operate entirely within the standard unkeyed setting and do not address whether the disturbance-vector
      class, or the detector built over it, has any defined meaning once the initial chaining value
      is attacker-unknown; this proposal is upstream of both, asking whether their shared unkeyed-setting
      premise extends to the RQ''s own named HMAC-SHA-1 scope item at all.'
    - 'A generic statement that "HMAC is safe from collision attacks because it is keyed": that is a
      qualitative security claim this proposal does not make; this proposal instead measures a specific,
      falsifiable curve (condition-satisfaction probability versus bits of state ignorance) at reduced-step
      scale, with a null control, and states explicitly that no HMAC-SHA-1 PRF-security claim follows from it.'
  assumptions:
    - The reduced-step/truncated analogue's condition-chain structure is similar enough to a real classical disturbance vector that a measured decay shape is informative about the mechanism, not just about the analogue; this is the central extrapolation assumption and no numeric transfer to full-scale MD5 or SHA-1 parameters is performed.
    - The declared marginalisation policy (uniform random assignment to unknown bits, required-success sampling) is a reasonable operationalisation of "attacker does not know these bits"; a different policy (e.g. worst-case adversarial assignment) could show different decay and is named as an alternative not attempted here.
    - Binomial trial counts at each declared m are large enough for the confidence interval to be informative; STAGE 2 must establish this empirically rather than assume it, and the m at which trials become too rare to measure is itself reported.
    - The comparison in STAGE 5 between the measured collapse point and a real keyed chaining value's full bit width is a scale comparison only, explicitly not a numeric extrapolation, and is labelled as such wherever it appears.
  proof_search_map:
    not_applicable_reason: >-
      This is an empirical measurement of a success-probability curve under a declared marginalisation
      procedure at reduced-step scale, not a proof of a theorem or a claimed algorithmic ceiling. There
      is no bottleneck whose removal changes a theorem's statement, no certificate-carrying observable
      requiring a collision search, and no constructive transform being attempted; KN-TECH-080's proof-architecture
      apparatus does not apply. The nearest analogue is the null control in `mechanism` STAGE 4.
  predictions:
    - metric: fitted rate r in a geometric decay model P(success | m) approximately P(0) * r^m, real classical condition chain
      direction: different
      minimum_effect: 'explicit refusal to pre-commit a value: whether decay is well-approximated by a single geometric rate at all is itself part of the question, tested against the sharp-collapse alternative in STAGE 3; reported as both fits with residuals and an explicit statement of which fits better'
    - metric: fitted rate r for the STAGE-4 synthetic data-independent null
      direction: different
      minimum_effect: 'predicted r indistinguishable from 1 (flat curve); any material decay here is an instrument or marginalisation-procedure artifact that voids the real-chain measurement'
    - metric: collapse point m* (declared threshold where measured success probability falls below a pre-declared small fraction of P(0)), real chain versus synthetic null
      direction: lower
      minimum_effect: 'real-chain m* below the full state bit-width; magnitude not pre-committed, only that it must be strictly below the null''s m* (which should not exist, or should equal the full range, for the flat null)'
    - metric: largest m at which trials remain frequent enough for a usable binomial interval within the declared trial budget
      direction: different
      minimum_effect: 'no pre-committed value; this is a budget/measurability boundary reported as a fact about the experiment, not evidence about the mechanism (AGENTS.md rule 3)'
  minimal_test:
    design: 'The cheapest discriminating run measures only two points -- m=0 (full knowledge, the standard
      classical baseline already implicit in every other proposal in this batch) and one small m greater
      than 0 -- for both the real classical condition chain and the STAGE-4 synthetic null, in one invocation
      at the smallest reduced-step analogue width. This costs CPU-hours only, no GPU, and answers the
      single gating question before any full curve is bought: does hiding even a SMALL number of bits
      produce a measurable, real-chain-specific drop in success probability at all, distinguishable from
      the null''s expected flatness? If the two-point real-chain measurement shows no drop distinguishable
      from the null, the whole curve-fitting exercise is not worth its cost and the finding -- that the
      classical machinery is more robust to partial ignorance than expected -- is reported as the (still
      valuable, per (E) in `claim`) result.'
    controls:
      - Synthetic data-independent null condition chain, matched length and per-condition probability, same invocation.
      - Fresh independent random draws for both the message and the marginalised bits on every trial, with the random seed logged.
      - Two declared marginalisation policies (zero-fill and multi-sample-required-success) compared against each other at the smallest tested m, to bound sensitivity to the policy choice.
      - Binomial confidence intervals reported at every m, including m values where zero successes occur (as an upper bound, not a silent zero).
    required_metrics:
      - success probability with binomial interval at each declared m, real chain and synthetic null
      - fitted geometric rate r and sharp-collapse threshold m*, both candidate forms, with residuals for each
      - largest measurable m within the declared trial budget
      - sensitivity of the m=0-to-first-m drop to the choice of marginalisation policy
  falsification_conditions:
    - The STAGE-4 synthetic null shows material decay in success probability as m increases, indicating the marginalisation procedure itself penalises unknown bits independent of genuine data dependency, voiding any real-chain measurement.
    - The real classical chain's success probability does not drop in a measurably different way from the null at any m reachable within the trial budget, closing the question at this scale with a "no detectable sensitivity" result.
    - Trials become too rare to produce a usable binomial interval before any m greater than 1 is reached, making the curve unmeasurable at this budget -- a budget outcome, not evidence about the mechanism.
    - The two marginalisation policies (zero-fill vs. multi-sample-required-success) disagree materially on the m=0-to-first-m drop, showing the measured curve is policy-dependent rather than a property of the condition chain.
  confounders:
    - A reduced-step analogue may flatten exactly the early, load-bearing conditions that would show the sharpest sensitivity to hidden bits at full scale, biasing the measurement toward under-detecting a collapse.
    - The choice of which bits to marginalise (versus which to keep known) at a given m is a design choice that could be adversarially picked to either flatter or exaggerate the decay; this is mitigated by drawing the marginalised-bit SET randomly per trial rather than fixing it.
    - Binomial trial noise at small sample counts per m can manufacture an apparent geometric or sharp-collapse shape from pure sampling variation; bootstrap intervals on the fitted parameters, not point estimates alone, are required.
  interpretation_limits:
    - A measured curve at reduced-step or MD5 scale is a statement about that analogue's condition-chain dynamics under a declared marginalisation policy; no numeric transfer to real SHA-1 parameters or real HMAC-SHA-1 usage is performed or licensed.
    - This proposal makes no statement about HMAC-SHA-1's PRF security, which is a different, generally stronger property than collision resistance and is not addressed by any near-collision-block machinery at all.
    - A finding that the classical machinery collapses quickly under partial state ignorance narrows what the deployed detector's design assumptions cover; it does not itself constitute a completeness or coverage statement about the detector, which remains this batch's separate IDEA-20260816-3edd14/70b60d objects.
    - Nothing here bears on any real deployed system, repository, or certificate.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Under the declared marginalisation policy, each additional unknown initial-chaining-value bit
        that a message-modification condition causally depends on reduces the achievable success probability
        by a roughly constant multiplicative factor, behaving like treating each unknown bit as an independent
        uniform random variable that must be matched by chance -- the standard "random function" heuristic
        already used elsewhere in differential cryptanalysis (KN-TECH-066) applied here to PARTIAL rather
        than full state knowledge.
      rigorous_support: >-
        No proved theorem for the partial-knowledge regime specifically; it extrapolates the same random-oracle-style
        independence heuristic KN-TECH-066 already uses for full state unpredictability (as in the generic
        2^{n/2}/2^n collision/preimage bounds) down to a partial-knowledge setting, which is the untested step this proposal exists to check.
      validation_plan: >-
        Sample: many independent trials (target at minimum several thousand per declared m, more at
        small m where success is frequent, adaptively fewer where success becomes rare and the interval
        is reported as an upper bound) at a reduced-step or truncated analogue small enough that m can
        range from 0 to a substantial fraction of the state width within budget. Shortcut: none beyond
        direct simulation, since this is a combinatorial/probabilistic property of the modification procedure
        rather than a number-theoretic object requiring a correspondence like the Deuring correspondence.
        Comparison: empirical P(m) versus the geometric-decay prediction P(0)*r^m fit by regression on
        log P(m), with residuals reported; alternative sharp-collapse form fit and compared by an explicit
        model-selection statement (which residual pattern is smaller), not by eye. Tail check: the largest
        measurable m (where trials become rare) is exactly the tail of this distribution, and its binomial
        upper bound is reported rather than omitted, per the "including the zero-flag case" discipline
        this batch's sibling proposals already establish.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed. The deliverable is a success-probability decay curve under a declared
      marginalisation procedure, at reduced-step scale, not an asymptotic attack complexity.
    memory_exponent: No attack memory exponent is claimed. Memory cost is that of running many independent trials of a message-modification procedure at reduced-step scale, reported as an ordinary compute cost, not a cryptanalytic memory quantity.
    best_known: >-
      There is no existing decomposition in this program's corpus of how message-modification/disturbance-vector
      machinery behaves as a function of PARTIAL initial-state knowledge; every existing cost-model and
      detector proposal in this batch operates entirely within the full-knowledge (standard unkeyed)
      setting, which RQ-SHAONE-081e3a's own scope note names as only one of the deployed usages (alongside
      legacy HMAC-SHA-1) this program is meant to cover.
    hidden_overhead: >-
      Choosing the marginalisation policy honestly, and testing at least two distinct policies for sensitivity,
      is the part most likely to be under-budgeted; a single, convenient policy choice could silently
      determine the whole curve's shape, which is why STAGE 2's dual-policy comparison is written into
      the minimal test rather than treated as optional.
    tradeoff_note: not applicable; no time-memory tradeoff is exercised by a probability-curve measurement.
  dominated_by: >-
    n/a (no result claimed). Checked across time, memory and data/query axes: the deliverable is a
    success-probability decay curve under a declared marginalisation policy, placing no point on any
    attack frontier for SHA-1, MD5, or HMAC, and answering a scope question (does the disturbance-vector
    class apply outside full-IV-knowledge usage) that no existing frontier row in this repository addresses.
  sota_delta: >-
    No attack; conceptual/measurement contribution only. Quantitatively: the repository moves from
    a completely unaddressed keyed-usage scope question (despite the RQ's own explicit naming of legacy
    HMAC-SHA-1 as in scope) to a measured success-probability curve as a function of hidden initial-state
    bits, a data-independence null control, two compared marginalisation policies, and an explicit,
    labelled scale comparison to a real keyed chaining value's full bit width.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    Separable parts. (1) That the marginalisation procedure and its synthetic null can be implemented
    correctly, with the null showing a flat curve: about 0.75. (2) That the real classical chain shows
    a measurably different (non-flat) curve from the null at some reachable m within budget: about 0.6
    -- plausible given the chain's known data dependencies on early state, but the reduced-step analogue
    could flatten exactly this structure. (3) That trials remain frequent enough at a large enough m
    to distinguish geometric decay from sharp collapse, rather than the measurable range being too narrow
    for either fit: about 0.45, the most uncertain part of the design. (4) That the two marginalisation
    policies agree closely enough that the result is not simply a policy artifact: about 0.55. Composite
    roughly 0.11 for the full four-part design; the minimal two-point (m=0 vs. one small m, real chain
    vs. null) test alone succeeds with probability near 0.55 and is cheap enough to run as a first, cheap
    gate on whether the fuller curve is worth buying.
