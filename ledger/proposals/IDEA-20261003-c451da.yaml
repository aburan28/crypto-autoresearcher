# IDEA-20261003-c451da
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-c451da
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 8 has degree 64 and multiplication by 7 has degree 49
  class: measurement
  claim: >-
    Multiplication by 8 has degree 64. Multiplication by 7 has
    degree 49. Sixty-four exceeds forty-nine by 15. The product of
    the two degrees is 3136. Their sum is 113. The gap is a map
    degree, not an ECDLP exponent and not the degree pair 49 and 36.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Eight squared is 64. Seven squared is 49. Two maps of
    degree 49 have gap 0 and product 2401. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The multipliers 8 and 7 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 15.
    baseline_embedding:
      parameter_slice: The degrees 64 and 49.
      reproduction_check: >-
        Two readers must agree that 8 squared is 64 and that 7
        squared is 49.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 49 drops the gap. Two maps of
        degree 49 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 64 and 49.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The multipliers are fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degrees 64 and 49. Not the degree pair 49 and 36.
      nearby_object_control: >-
        Two maps of degree 49. The gap is 0 and the product is 2401.
    proof_obligations:
      - claim: Multiplication by 8 has degree 64.
        responsibility: size
      - claim: Multiplication by 7 has degree 49.
        responsibility: size
      - claim: The gap is not the degree pair 49 and 36.
        responsibility: scope
    not_applicable_reason: null
  predictions:
