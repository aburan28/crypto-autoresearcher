      direction: different
      minimum_effect: Sixty-four exceeds forty-nine by 15.
  minimal_test:
    design: >-
      Square 8 and square 7, then subtract 49 from 64. Do not map
      a curve point.
    controls:
      - Two maps of degree 49, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The degree of multiplication by 8 is not 64.
    - The product of the two degrees is not 3136.
  confounders:
    - The degree pair 49 and 36 belongs to multipliers 7 and 6.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic endomorphism.
    - This is not the degree pair 49 and 36.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen multiplication by 8 has degree 64, and the
        frozen multiplication by 7 has degree 49.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is a
