idea:
  id: IDEA-20261005-79cb0a
  question_id: RQ-HYPER-7ca025
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Prym dimension of the double cover cut out by one quadratic factor
    of the first admissible genus-2 sextic over F_11
  class: measurement
  claim: >-
    Let Q1, Q2, Q3 be the first triple of monic quadratics over F_11, in
    lexicographic order, that are pairwise coprime and whose product f
    is squarefree of degree 6. In the function field of y^2 = f, the
    element Q1 is not a square, every place has even valuation on Q1,
    and the extension obtained by adjoining a square root of Q1 has
    genus 3. The connected kernel of the norm to the genus-2 Jacobian
    then has dimension 3 - 2 = 1. That integer is the Prym dimension of
    this cover. It is a different integer from the dimension 3 that
    p1498_simple_prym_quotient_obstruction.py requires for its frozen
    cubic cover. The Richelot codomain triple is not computed. No
    discrete-log exponent moves.
  mechanism: >-
    An etale double cover of a genus-2 curve has genus 3: Riemann-Hurwitz
    with no ramification gives 2g - 2 = 2*(2*2 - 2) = 4, so g = 3. The
    Prym is the connected component of the kernel of the norm from that
    Jacobian to the base Jacobian, and its dimension is the difference
    of the genera, 1, once the cover is geometrically connected of
    degree 2. The cover attached to a quadratic factor is the Kummer
    extension w^2 = Q1 inside the function field of y^2 = f. In odd
    characteristic that extension is unramified when every valuation of
    Q1 is even, and it has degree 2 when Q1 is not already a square.
    Both conditions are checked, not assumed past the test. If either
    fails, the genus is not 3 and the dimension claim fails on this
    sextic.
    Two outcomes are separated before the run. Outcome A: degree 2,
    all valuations even, genus 3, Prym dimension 1. The quadratic factor
    cuts out an elliptic Prym. Outcome B: the degree is not 2, or some
    valuation is odd, or the genus is not 3. Then this factor does not
    cut out that Prym, and the dimension 1 is the wrong integer for this
    sextic.
    OBJECT FRAME. The tracked object is a point of the Prym. The
    underlying group is the Jacobian of the cover. Operation set Sigma
    is translation by the image of the pullback of the genus-2 Jacobian,
    the factor the norm sees. Sigma is not translation on a prime-order
    elliptic subgroup of a prime-field curve, and it is not a factor-base
    action.
    TRICHOTOMY. Partial-action. Under a product decomposition of the
    cover Jacobian, translation by a pullback point moves the base
    factor and fixes the Prym coordinate, so the Prym is a block system
    of that translation subgroup.
    LOSSY-PROJECTION TEST against that Sigma. Discarded: the genus-2
    Jacobian coordinate, dimension 2. Retained: the Prym coordinate,
    dimension 1. Compatible when the norm kernel is a complement of the
    pullback. Lossy: the base coordinate takes more than one value on a
    general fibre. A dimension computation that returns 2 has retained
    the base Jacobian. A dimension computation that returns 3 has
    retained the whole cover Jacobian, which is the p1498 shape on a
    different cover, not this one.
