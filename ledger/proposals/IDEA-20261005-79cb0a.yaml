  assumptions:
    - >-
      Lexicographic order on monic quadratics over F_11 is the same
      order IDEA-20261005-fb6ec7 uses to name the sextic. The cover
      uses the first quadratic of that triple.
    - >-
      Dimension of the connected kernel of the norm equals
      genus(cover) - genus(base) when the cover is geometrically
      connected of degree 2. That equality is what outcome A asserts
      and outcome B can reject by a genus other than 3.
    - >-
      The repeated-factor triple (x^2+1, x^2+1, x^2+2) is the
      inadmissible control, as in the research question.
  predictions:
    - metric: genus of F_11(x)[y, w]/(y^2 - f, w^2 - Q1)
      direction: different
      minimum_effect: >-
        The genus equals 3. A different genus is outcome B.
    - metric: Prym dimension, genus(cover) minus 2, when the extension degree is 2 and every valuation of Q1 is even
      direction: different
      minimum_effect: >-
        The dimension equals 1. The p1498 control integers give
        dimension 3 on a cubic cover. Returning 3 on this sextic, or
        1 on those control integers, crosses the two covers.
  minimal_test:
    design: >-
      Select the lex-first admissible triple over F_11. In the function
      field of y^2 = f, test whether Q1 is a square, list the valuations
      of Q1 at every place, and compute the genus of the extension
      w^2 = Q1. If the degree is 2 and every valuation is even, set the
      Prym dimension equal to genus minus 2 and require genus 3. If any
      check fails, record outcome B and the failing check. One sextic.
      No discrete-logarithm solver and no Richelot triple.
    controls:
      - >-
        Inadmissible control. The triple (x^2+1, x^2+1, x^2+2) is not
        squarefree. The selector must reject it and must not return
        Prym dimension 1 for it.
      - >-
        Ramified control. The cover y^2 = f of the x-line is ramified
        at the roots of f. Running the same valuation test on f, as a
        function on P^1, must report an odd valuation. An instrument
        that calls that cover etale is broken.
      - >-
        Dimension-3 control, arithmetic only. On the integers written
        in p1498_simple_prym_quotient_obstruction.py (cover genus 4,
        base dimension 1), genus difference is 3. The same subtraction
        that returns 1 on genera (3, 2) must return 3 on (4, 1). The
        result JSON of that script is not an input.
    required_metrics:
      - extension degree of w^2 = Q1 over the genus-2 function field
      - number of places where the valuation of Q1 is odd
      - genus of the extension
      - Prym dimension when the etale checks pass, otherwise the name of the failed check
      - rejection bit on the repeated-factor triple
  falsification_conditions:
    - >-
      On the admissible sextic the extension degree is not 2, or some
      valuation of Q1 is odd, or the genus is not 3. The elliptic Prym
      is then the wrong object for this factor.
    - >-
      The subtraction returns 1 on the p1498 control integers (4, 1),
      or returns 3 on genera (3, 2). The dimension is then an unlabeled
      integer and is not read.
    - >-
      The repeated-factor triple is accepted and assigned dimension 1.
  confounders:
    - >-
      Three quadratic factors give three covers. This record uses the
      first in the lex order of the triple. A different factor is a
      different run; it is not used to replace a failure on the first.
    - >-
      Genus 3 with a disconnected cover would make the norm's kernel
      the wrong variety. Degree 2 and geometric connectedness are
      required metrics, not optional comments.
    - >-
      q = 11 is one field. A genus of 3 here does not say the same
      factor is etale over every odd prime.
  interpretation_limits:
    - >-
      The Prym is a factor of the cover Jacobian. A dimension of 1 does
      not move the discrete logarithm on the genus-2 Jacobian into an
      elliptic curve. The base Jacobian remains dimension 2.
    - >-
      KR-IC-a4dd54 at genus 2 gives soft-O(q^{2-2/2}) = soft-O(q), the
      same exponent as rho on a group of size about q^2. This record
      does not change that exponent.
    - >-
      IDEA-20261005-fb6ec7 remains the Richelot-triple comparison.
      IDEA-20260920-10547b remains the n=5 cover genus. p1498 remains
      the dimension-3 cubic Prym.
    - >-
      Toy scope: one sextic over F_11. No statement about EcGFp5 or
      about a cryptographic field.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If Q1 is not a square in the function field of y^2 = f and every
        place has even valuation on Q1, then w^2 = Q1 is a geometrically
        connected etale double cover of genus 3, and the connected kernel
        of the norm has dimension 1.
      rigorous_support: >-
        Riemann-Hurwitz: 2g_cover - 2 = deg(pi)*(2g_base - 2) + deg(R).
        For deg(pi) = 2, g_base = 2, and deg(R) = 0, the genus is 3.
        The dimension of the Prym of a double cover is g_cover - g_base
        when the cover is geometrically connected. Even valuation is the
        Kummer criterion for deg(R) = 0 in odd characteristic.
      validation_plan: >-
        The sample is one sextic, the lex-first admissible triple over
        F_11, plus the three controls. There is no random draw and no
        tail across primes. The comparison is exact: genus 3 and
        dimension 1, against the control subtraction on (4, 1) giving 3.
        No transfer to characteristic 2, to n = 5, or to the cubic cover
        whose dimension is already 3 in the p1498 script.
    - id: H2
      statement: >-
        The three quadratic factors of one sextic determine three covers,
        and the lex-first factor is a fixed choice made before the genus
        is computed. A failure on that factor is not repaired by switching
        factors.
      rigorous_support: >-
        The selector is a total order on a finite set of monic quadratics.
        Exactly one triple is first. Exactly one factor of that triple is
        first. This is a definition, checked by listing the order.
      validation_plan: >-
        Recompute the lex-first triple twice from the same order and
        require the same (Q1, Q2, Q3). A disagreement means the order
        was not frozen. No distribution is involved.
