idea:
  id: IDEA-20260805-4ed1b1
  question_id: RQ-XEDN-003
  added: '2026-08-05'
  title: >-
    Two p-independent forced constants for the chi=1 xedni window: an absolute
    ceiling of 6 on Mordell-Weil relation coefficients (the affine E8 marks), and
    a mean of exactly 1 rational free-x section per uniformly sampled surface
    (Burnside on W(E8)) -- replacing a constant observable with one that has
    spread
  class: theory

  claim: >-
    TWO constants, both derived before any run, both independent of p, and both
    absent from every record in this lane.
    (A) THE CEILING. On y^2 = x^3 + a(t)x + b(t) over F_p(t) with deg a <= 4,
    deg b <= 6 and squarefree discriminant, the free-x sections (deg x <= 2,
    deg y <= 3) are the norm-2 vectors of an E8 Mordell-Weil lattice. A relation
    among such sections with MINIMAL SUPPORT is, up to sign and a common factor,
    the mark vector of an affine simply-laced Dynkin diagram: coefficients
    (1,...,1) for affine An, max 2 for affine Dn, max 3 for affine E6, max 4 for
    affine E7, and max 6 for affine E8 with mark vector (1; 2,3,4,6,5,4,3,2).
    Therefore the infinity norm of any minimal-support Mordell-Weil relation in
    this window lies in {1,2,3,4,6} and is AT MOST 6 -- for every prime, every
    deg a <= 4, every surface, forever. Coefficient GROWTH in this window is not
    merely unobserved, it is structurally impossible; the quantity three goals
    censused for growth is bounded above by an absolute constant that no census
    can move.
    (B) THE MEAN. Frobenius acts on the geometric Mordell-Weil lattice E8 by an
    isometry, and Aut(E8) = W(E8). The F_p-rational free-x sections are the roots
    fixed by that isometry. By Burnside's lemma the average number of fixed
    roots over W(E8) equals the number of W(E8)-orbits on the 240 roots, which is
    1 because W acts transitively on the roots of an irreducible simply-laced
    system. So under the heuristic that Frobenius equidistributes in W(E8) across
    the family, the EXPECTED number of F_p-rational free-x sections on a
    uniformly sampled surface is exactly 1 -- i.e. exactly 0.5 slots after the
    census's +/- canonicalisation -- independent of p. Every XEDN census instead
    reports 2 to 12 slots per surface, because none of them sampled uniformly:
    all of them SOLVE for (a,b) from two planted sections. The gap between 0.5
    and the observed counts is the size of the conditioning the lane never
    charged.
    NOTHING IS CLAIMED AS ESTABLISHED. (A) rests on a recalled correspondence and
    (B) on a numbered equidistribution heuristic; both are stated so they can be
    killed, and (B) is killable in minutes by uniform sampling in pure Python.

  object_first_candidate:
    tracked_object: >-
      The CONJUGACY CLASS of the Frobenius isometry w_S in W(E8), followed
      through the computation and read off from its two cheapest shadows: the
      fixed-root count N(S) = |{roots r : w_S r = r}| and the Dynkin type of the
      fixed root subsystem. This is the object the census was standing on without
      naming it. It is not the relation vector, not the relation's norm, and not
      the section count; those are functions of it. Tracking it makes the
      observable an element of a finite, enumerable set (the 112 conjugacy
      classes of W(E8), each with a computable fixed-root count) instead of an
      integer pinned at 1.
    established_families_off_limits: >-
      Off-limits as the primary lens: index calculus and factor-base relation
      collection; Semaev summation polynomials and solving-degree work; classical
      xedni-as-lift-to-Q and the JKSST refutation route; descent/Selmer;
      isogeny-graph, CM and class-group transfers; generic-group lower bounds;
      rho/kangaroo birthday search. Root-system and Weyl-group theory is the
      chosen lens and is NOT one of this program's established ECDLP families --
      the corpus records exactly one prior use of representation-theoretic
      machinery anywhere (EXP-EQJ-001, isotypic decomposition on a Semaev
      system), and none on Mordell-Weil lattices.
    newness_score: >-
      The mathematics is textbook: affine Dynkin marks and Burnside are standard,
      and the E8 identification is already asserted (without derivation, and
      without either constant) in ledger/decisions/DEC-20260724-021.yaml's
      limitations. What is new is the CONVERSION: turning "coefficients are
      absolutely bounded" -- a sentence written on 2026-07-24 and then never used
      -- into a specific ceiling of 6 with its attaining configuration, and into
      a specific expected value of 1 that decides whether the lane's sampler was
      measuring the family or the plant. Neither constant appears in
      EV-XEDN-002..006, KN-FIND-005/010/011, or any XEDN experiment contract.
    testability_score: >-
      Constant (A): fully decidable in pure Python at zero curve cost -- build
      E8's 240 roots, enumerate root subsystems, compute affine marks, and
      exhibit the attaining configuration. Constant (B): decidable in minutes by
      sampling (a,b) uniformly and counting slots with the frozen predicate,
      which is pure Python and already committed
      (experiments/EXP-XEDN-001/xedni_sections.py, sha256
      76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f, imports
      cleanly; measured this session: numpy 2.4.6 present, sympy and sage
      absent).
    survival_score: >-
      (A) survives exactly as far as the height-2 correspondence and the
      irreducible-fibre condition, and dies at chi >= 2 where minimal sections
      have norm 2 chi and the lattice is not a root lattice. (B) survives only as
      far as the equidistribution heuristic, which is the weakest thing in this
      record and is labelled as such; a measured mean far from 1 refutes the
      heuristic, not the algebra, and is itself the more interesting outcome.

  mechanism: >-
    PART A -- THE CEILING.
    Premises, inherited from IDEA-20260805-4ddf4e and re-stated so this record
    stands alone: for deg a <= 4 and deg b <= 6 the elliptic surface has
    chi = 1; for squarefree discriminant every fibre is irreducible; an integral
    section then has Shioda height 2 chi = 2; the height-2 sections are exactly
    those with x of degree <= 2 and y of degree <= 3; and the Mordell-Weil
    lattice is E8. [The height formula and the height-2 <-> deg-x-<=-2
    correspondence are RECALLED, UNVERIFIED from Shioda's Mordell-Weil lattice
    theory -- the papers were NOT READ -- but the same identification is asserted
    independently in this corpus at DEC-20260724-021, limitations, and the same
    decision's next_actions prescribes the pairing <P,P> = 2, <P,Q> = 1 - (P.Q).]

    Let Phi be the root subsystem realised over F_p, r its rank, N its number of
    positive roots. The relation lattice of a set of vectors that spans a rank-r
    lattice with N generators has rank N - r. A MINIMAL-SUPPORT relation is one
    whose support contains no proper subset supporting a relation; equivalently
    its support is a MINIMAL DEPENDENT set of roots, i.e. a circuit of the matroid
    of Phi. For a simply-laced root system the circuits of the root matroid are
    exactly the root sets of affine (extended) subdiagrams together with the
    trivial pairs {alpha, -alpha}. On such a circuit the unique relation, up to
    sign and scale, has coefficients equal to the MARKS of the affine diagram:
      affine A_n: all marks 1                      -> infinity norm 1
      affine D_n: marks 1,1,2,...,2,1,1            -> infinity norm 2
      affine E6:  marks 1,2,3,2,1,2,1              -> infinity norm 3
      affine E7:  marks 1,2,3,4,3,2,1,2            -> infinity norm 4
      affine E8:  marks 2,3,4,6,5,4,3,2 (plus 1)   -> infinity norm 6
    Since Phi is a subsystem of E8, every affine subdiagram it can contain is
    affine A, D, E6, E7 or E8, so
      max over minimal-support relations of the infinity norm <= 6,
    with 6 attained only when the realised subsystem contains a full affine E8
    configuration, which requires r = 8 (the maximum possible rank). THIS IS A
    UNIFORM BOUND IN p. It does not weaken as p grows, it does not depend on
    deg a within the window, and it cannot be moved by any amount of further
    census inside deg b <= 6.
    Two immediate consequences for the lane's own framing. First, H-XEDN-004's
    falsification condition ("any verified shortest relation with infinity-norm
    >= 4") is not merely unreached, it is unreachable through the SHORTEST
    relation: the shortest relation among a saturated root set is 1 whenever any
    relation exists at all (IDEA-20260805-4ddf4e Step 4). Values 2, 3, 4 and 6
    live only on MINIMAL-SUPPORT relations that are not the globally shortest --
    a different statistic, which no XEDN contract measures. Second, the
    literature obstruction the lane was chasing (relation-coefficient growth, per
    JKSST, NOT READ -- relayed) cannot be exhibited in this window at all, so a
    negative census result here is not evidence about that obstruction.

    PART B -- THE MEAN.
    The geometric Mordell-Weil lattice is E8; Galois acts on it by lattice
    isometries; Aut(E8) = W(E8) (the diagram has no nontrivial automorphism and
    -1 lies in W). Let w_S denote the Frobenius isometry attached to a surface S
    over F_p. The F_p-rational free-x sections are precisely the roots fixed by
    w_S, so
      N(S) = |Fix(w_S) intersect Roots(E8)|.
    Burnside / Cauchy-Frobenius applied to W(E8) acting on the 240 roots:
      (1/|W|) sum over w in W of |Fix(w) intersect Roots| = number of orbits = 1,
    the orbit count being 1 because W(E8) is transitive on the roots of an
    irreducible simply-laced system. So if Frobenius classes equidistribute in
    W(E8) across the family, E[N(S)] = 1 EXACTLY, for every p, and since roots
    occur in +/- pairs and the census records one representative per pair,
      E[slots per surface] = 0.5, independent of p.
    Nothing else in the lane predicts a number here at all. The prediction is
    sharp, cheap and falsifiable, and it is the natural null for section
    abundance: DEC-20260724-021's per-slot lift probability
    P_lift(p) = (1 - 2/p + p^-3)/(2 p^3) with alpha = 3 is the same statement
    seen from the counting side -- p^3 candidate x-polynomials times a p^-3
    square-density gives an O(1) expected count -- and Burnside pins that O(1) to
    exactly 1. The two derivations are independent and must agree; if they do
    not, one of them is wrong and finding out which is worth the minutes it
    costs.

    WHY THE CENSUS NEVER SAW 0.5. EXP-XEDN-005's sampler
    fiber_find_rich_surfaces does not draw (a,b); it draws two candidate sections
    and solves a = ((y1^2 - x1^3) - (y2^2 - x2^3))/(x1 - x2),
    b = y1^2 - x1^3 - a x1. Every censused surface is conditioned on Fix(w_S)
    containing a prescribed 2-root configuration. Under the mean-1 model that
    conditioning is enormous, and it is the mechanism that produced the observed
    2-to-12 slot counts and the high eligibility rate. The conditioning is
    disclosed in the artifacts as "source: fiber_over_sections"; what is missing
    is its size, which is exactly the ratio being proposed for measurement.

    THE REPLACEMENT OBSERVABLE. Both constants point the same way: stop
    projecting to the relation norm and report the realised subsystem. Its type
    varies -- candidate (rank, positive-root count) readings in the committed
    EXP-XEDN-005 data include (2,2), (2,3), (3,3), (3,4), (3,6), (4,10), (4,12),
    (6,9), (7,7), (8,10), which as ADE data would read A1^2, A2, A1^3, A2+A1,
    A3, A4, D4, A2^3, ..., i.e. genuine spread -- and its distribution over
    surfaces is a Chebotarev-type question about W(E8) with a computable
    prediction per conjugacy class. That is an observable with a comparator, a
    forced mean, and a per-class prediction, replacing one pinned at its floor.

  novelty_status: unverified

  literature_context:
    - >-
      Shioda's Mordell-Weil lattice theory (rational elliptic surfaces, E8,
      height formula) and Oguiso-Shioda's classification of the Mordell-Weil
      lattices of rational elliptic surfaces. NOT READ -- relayed claim from
      model memory. Every use is labelled and is a candidate to check; Stage 1 of
      the paired experiment either sources them or replaces them by an in-repo
      derivation and records which.
    - >-
      Bourbaki-style tables of affine Dynkin marks, including the affine E8 marks
      (2,3,4,6,5,4,3,2) with the extending node at 1. RECALLED, UNVERIFIED. These
      are not cited as authority: the experiment RECOMPUTES the marks from the
      E8 root system in exact integer arithmetic, which is a few lines and
      removes the dependence entirely.
    - >-
      ledger/decisions/DEC-20260724-021.yaml. READ IN FULL THIS SESSION. Supplies
      the in-corpus statement of the E8 identification, the prescribed Shioda
      pairing, the measured P_lift(p) = (1 - 2/p + p^-3)/(2 p^3) with alpha = 3,
      and a published FORBIDDEN-SENTENCE list that binds this record: nothing
      here states or implies "the multi-section or Mordell-Weil relation-source
      route is closed", "no lifting-based relation source exists over F_p(t)", or
      "section-rich surfaces are exponentially rare over F_p(t)".
    - >-
      Jacobson-Koblitz-Silverman-Stein-Teske on xedni calculus, recorded here as
      KN-LIT-021. NOT READ -- relayed claim. Used only to name which obstruction
      the literature is said to identify (relation-coefficient growth), which
      Part A says cannot be exhibited in the chi = 1 window.

  lossy_projection_identifiability_audit:
    projection: >-
      Surface S --> Frobenius isometry w_S in W(E8) --> its conjugacy class -->
      the fixed root subsystem Phi_p(S) --> (rank, positive-root count, Dynkin
      type) --> [the lane's further projection: the minimal relation's infinity
      norm].
    what_is_discarded: >-
      The surface's coefficients, its j-invariant, its fibre positions and the
      actual sections: everything except an element of a finite set of at most
      112 conjugacy classes, and in the reported shadow, of a handful of Dynkin
      types.
    why_genuinely_lossy: >-
      Genuinely lossy, and lossy in the right amount: the fibre over a given
      Dynkin type is large (many surfaces share it) while the image is not a
      single point. That is the property the lane's own observable lacks.
    why_compatible_with_the_operations: >-
      Compatible by construction. The Mordell-Weil group law is defined over
      F_p(t), Frobenius commutes with it, and the fixed sublattice is closed
      under addition -- so the retained part propagates deterministically through
      exactly the operation (section addition) that the relation search uses.
    is_it_only_a_change_of_coordinates: >-
      NO. Check run, and BOTH failure modes checked. It is not a change of
      coordinates: the map S -> class(w_S) forgets the surface entirely and
      cannot be inverted, since many (a,b) share a Frobenius class. It is not the
      mirror (constant) failure either, which is precisely the improvement over
      the incumbent observable: the incumbent projects further, to an integer
      that is 1 or undefined, and THAT step is where the comparator spread
      vanishes. The pre-run check for constancy is quantitative and is the
      dynkin_type_spread prediction below: fewer than 4 distinct realised types
      across the census would mean this object is no better than the one it
      replaces, and the proposal would have to be withdrawn on its own criterion.

  assumptions:
    - >-
      chi = 1 across the whole window deg a <= 4, deg b <= 6. Outside it (deg b
      >= 7) both constants lapse: minimal sections have norm 2 chi >= 4, the
      lattice is not a root lattice, marks are undefined and Burnside on W(E8)
      does not apply. GOAL-XEDN-003's deg b = 10 family is outside, and this
      record makes no claim about it beyond serving as the null.
    - >-
      Squarefree discriminant, checked per surface and not inherited from the
      recorded b_squarefree flag, which is a different condition.
    - >-
      Frobenius acts through W(E8) rather than through a larger group. This
      follows from Aut(E8) = W(E8) if the geometric lattice is exactly E8; on a
      surface with reducible fibres the lattice is a proper subgroup and the
      statement must be re-made there.
    - >-
      Minimal-support relations, not shortest relations. The ceiling of 6 is a
      statement about circuits. Conflating it with the lane's "shortest relation"
      metric would be an error and is called out here so no downstream record
      makes it.

  predictions:
    - metric: >-
        mark_ceiling: the maximum infinity norm over all minimal-support
        relations, computed exhaustively on the recomputed root subsystems of
        every archived XEDN chi=1 surface, and separately over synthetic
        saturated root subsets of E8 constructed to include affine subdiagrams
      direction: different
      minimum_effect: >-
        <= 6 on every real surface; EXACTLY 6 on the synthetic affine-E8
        configuration, with coefficient multiset {1,2,3,4,6,5,4,3,2}. Both
        forced before the run. A real surface exceeding 6 falsifies Part A
        outright. A synthetic affine-E8 configuration NOT returning 6 means the
        mark computation is wrong and no other number in the run may be used.
    - metric: >-
        mark_spectrum: the set of infinity norms of minimal-support relations
        realised across the recomputed census
      direction: different
      minimum_effect: >-
        A subset of {1,2,3,4,6}. The value 5 is FORBIDDEN -- no affine
        simply-laced diagram has largest mark 5 -- and that is the sharpest
        cheap falsifier in this record: a single observed minimal-support
        relation of infinity norm exactly 5 kills Part A with one example.
    - metric: >-
        uniform_mean_slots: the mean number of free-x slots per surface over
        surfaces drawn UNIFORMLY at random (a coefficients uniform in F_p^5 with
        deg a <= 4, b coefficients uniform with deg b = 6 exactly), at each of
        p in {7,13,19,31}, at least 20000 surfaces per prime
      direction: different
      minimum_effect: >-
        0.5 per surface (equivalently 1.0 rational roots per surface),
        independent of p, with a two-sided tolerance of +/- 0.05 absolute at
        20000 samples. Derived from Burnside before any run. A measured mean
        outside [0.45, 0.55] at any prime, or a mean with a monotone trend in p,
        refutes the equidistribution heuristic HEUR-W1 and is reported as a
        finding about Frobenius on E8 for this family, not as a defect of the
        algebra.
    - metric: >-
        conditioning_ratio: mean slots on plant-discovered surfaces (the
        fiber_over_sections sampler) divided by mean slots on uniformly sampled
        surfaces, at each prime
      direction: higher
      minimum_effect: >-
        >= 6.0. The archived census records slot counts of 2 to 12 with a mean
        well above 4 on plant-discovered surfaces; against a uniform mean of 0.5
        the ratio is an order of magnitude. Any ratio below 2.0 would mean the
        uniform mean is not 0.5 and Part B is wrong. THIS RATIO IS THE NUMBER THE
        LANE NEVER CHARGED, and it is the size of the selection effect behind
        every XEDN "section-rich surface".
    - metric: >-
        dynkin_type_spread: number of distinct Dynkin types of the realised
        subsystem across the recomputed archived census
      direction: higher
      minimum_effect: >-
        >= 4 distinct types. Below that, the replacement observable has no more
        comparator spread than the observable it replaces and this proposal fails
        on its own criterion.
    - metric: >-
        burnside_selfcheck: the mean fixed-root count computed by direct
        averaging over a uniformly sampled set of at least 200000 elements of
        W(E8) generated as products of simple reflections
      direction: different
      minimum_effect: >-
        1.00 +/- 0.02. This is a pure-mathematics self-check with a value forced
        by a lemma; if it fails, the W(E8) construction in the code is wrong and
        every downstream number is void. It costs seconds and it can fail.

  minimal_test:
    design: >-
      Cheapest-first, and the first two stages can end the line with no curve
      compute at all. STAGE 0 (pure Python, seconds): construct E8's 240 roots
      exactly, verify the Gram, verify transitivity of the generated reflection
      group on roots by orbit computation, and run burnside_selfcheck. STAGE 1
      (pure Python, minutes): enumerate affine subdiagrams, recompute their marks
      from scratch, confirm the ceiling 6 and the forbidden value 5, and build
      the attaining affine-E8 configuration explicitly. If the recomputed marks
      disagree with the recalled table, the recalled table is discarded and the
      recomputation stands. STAGE 2 (pure Python over ARCHIVED data, under a CPU
      minute): recompute the realised subsystem, its type, and all
      minimal-support relations for every surface in the committed EXP-XEDN-005
      and EXP-XEDN-007 results; report the mark spectrum. STAGE 3 (pure Python,
      minutes): the uniform-sampling arm for the mean-0.5 prediction and the
      conditioning ratio, using the frozen predicate module unchanged.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, PRE-DERIVED FORCED VALUE, CAN FAIL. Uniformly
        sampled surfaces from the SAME family (deg a <= 4, deg b = 6) -- same
        predicate, same enumeration, same code path, differing only in how (a,b)
        is obtained. Forced value: mean 0.5 slots per surface, invariant in p.
        This null can fail in two distinguishable ways -- a different constant
        (equidistribution wrong) or a p-trend (the lattice is not E8 uniformly)
        -- and each failure names a different repair.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR. A SYNTHETIC affine-E8
        circuit built by hand inside the E8 root system: nine roots forming an
        extended E8 diagram whose unique relation must come out with coefficient
        multiset {1,2,3,4,5,6,4,3,2} and infinity norm exactly 6. If the
        minimal-support machinery does not return 6 there, the instrument cannot
        see large coefficients at all and NO negative statement about coefficient
        size may be reported from any arm -- which is precisely the sensitivity
        demonstration the incumbent instrument never had.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED. Build
        synthetic circuits of type affine A4, affine D4, affine D6, affine E6,
        affine E7, affine E8 and report the returned infinity norm for each. The
        forced sequence is 1, 2, 2, 3, 4, 6 -- strictly non-decreasing along that
        order. A flat sequence means the machinery is reporting a constant of the
        apparatus; a non-monotone sequence localises the error to a specific
        diagram type instead of leaving "it did not work".
      - >-
        ORDERING CONTROL. Stage 0 and Stage 1 outputs, including the mark table
        and the forbidden value 5, are hashed and committed BEFORE any archived
        surface or any uniformly sampled surface is examined.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Confirm by grep that neither constant (the
        ceiling 6, the mean 1) appears in any XEDN record: EV-XEDN-002..006,
        KN-FIND-005/010/011, EXP-XEDN-002..007, GOAL-XEDN-001/002/003. Report the
        absence as an absence.
    required_metrics:
      - the exact E8 root list with its Gram and the orbit computation proving transitivity
      - the recomputed affine mark table with the attaining configurations, hashed pre-Stage-2
      - per-surface realised subsystem, Dynkin type, all minimal-support relations and their infinity norms
      - uniform-sampling slot histogram per prime with the sample count and the seed derivation
      - the conditioning ratio per prime, with both means reported separately
      - burnside_selfcheck value and sample count

  falsification_conditions:
    - >-
      Any minimal-support relation with infinity norm 5, or any with infinity
      norm > 6, on a surface satisfying the premises. Part A dies.
    - >-
      The synthetic affine-E8 circuit does not return 6. The instrument is blind
      to large coefficients and no coefficient conclusion may be drawn from any
      arm.
    - >-
      The uniform-sampling mean is outside [0.45, 0.55] at any tested prime, or
      shows a monotone trend in p. HEUR-W1 dies; Part B is withdrawn and the
      measured curve is reported instead.
    - >-
      The conditioning ratio is below 2.0. The claimed selection effect does not
      exist and the criticism of the sampler is withdrawn.
    - >-
      Fewer than 4 distinct Dynkin types across the census. The replacement
      observable has no spread and the constructive half of this proposal fails.

  confounders:
    - >-
      RECALLED CORRESPONDENCE. The height-2 <-> deg-x-<=-2 identification is
      remembered, not read. If it is wrong, Part A's premises fail and Part B's
      counting changes. Stage 2 tests it directly: every listed slot's recomputed
      Shioda height must be 2 on the pure stratum.
    - >-
      EQUIDISTRIBUTION IS A HEURISTIC, NOT A THEOREM. The Frobenius classes of a
      family of rational elliptic surfaces over F_p need not equidistribute in
      W(E8); a Chebotarev statement here would need the monodromy of the family
      to be all of W(E8) and the relevant density to converge, neither of which
      is established in this record. It is numbered HEUR-W1 and its falsification
      is the experiment's own arm.
    - >-
      SMALL p. At p = 7 the number of available surfaces and the error term in
      any equidistribution statement are both large; a deviation at p = 7 that
      shrinks with p is evidence for the heuristic, not against it, and the
      analysis must not read it the other way.
    - >-
      REDUCIBLE FIBRES CONTAMINATE BOTH PARTS. Surfaces with non-squarefree
      discriminant have a smaller Mordell-Weil lattice and a different root
      count; pooling them with the pure stratum would corrupt the mean. They are
      reported separately.
    - >-
      MINIMAL SUPPORT IS NOT SHORTEST. The ceiling of 6 belongs to circuits. The
      incumbent metric is a minimum over all relations and is 1 whenever any
      relation exists. Reporting the ceiling as if it bounded the incumbent
      metric from below, or the incumbent metric as if it refuted the ceiling,
      are both errors and both are pre-emptively forbidden here.

  interpretation_limits:
    - >-
      Both constants are statements about chi = 1 surfaces with irreducible
      fibres over the tested primes, established at claim tier toy, and they say
      NOTHING about crypto-scale ECDLP. In particular a ceiling on relation
      coefficients is not an attack, not a cost bound, and not a statement about
      any curve over a large prime field.
    - >-
      Part A, if it survives, means a census for coefficient growth inside
      deg b <= 6 cannot succeed. That is a statement about the OBSERVABLE and the
      WINDOW. It is not a closure of the lifting route, and DEC-20260724-021's
      forbidden-sentence list continues to bind verbatim. Forward guidance,
      required by the inventor protocol's closure standard and supplied here:
      coefficient growth, if it exists at all, must be sought at chi >= 2
      (deg b >= 7, where minimal sections have norm >= 4 and the lattice is not a
      root lattice), or among NON-integral sections (x = g/h^2, height > 2, which
      no XEDN contract has ever enumerated), or on MINIMAL-SUPPORT relations
      restricted to a prescribed set (IDEA-20260805-d426f9). Those three are
      named as open, not as dead.
    - >-
      No status change to any XEDN goal, hypothesis, evidence or knowledge record
      is proposed or implied. Those are Coordinator records.
    - >-
      Part B's expected value is conditional on a heuristic and must never be
      quoted unconditionally. "E[slots] = 0.5 under HEUR-W1" is the only
      admissible form.

  heuristic_assumptions:
    - id: HEUR-W1
      statement: >-
        FORMALLY: let F_p(deg a <= 4, deg b = 6) denote the set of Weierstrass
        pairs (a,b) over F_p with squarefree discriminant, and for S in that set
        let c(S) be the W(E8)-conjugacy class of the Frobenius isometry on the
        geometric Mordell-Weil lattice. Then as (a,b) is drawn uniformly, c(S)
        converges to the uniform distribution on conjugacy classes weighted by
        class size, i.e. to Haar measure on W(E8), with error o(1) as p -> oo.
      rigorous_support: >-
        The rigorous half is unconditional and is what makes the prediction sharp
        at all: Burnside gives (1/|W|) sum_w |Fix(w) on roots| = #orbits = 1
        exactly, with no error term, once the distribution is uniform. The
        distributional half is the heuristic: it is the elliptic-surface analogue
        of a Chebotarev statement for the monodromy of the universal family, and
        it requires the geometric monodromy group to be all of W(E8) and the
        specialisation to be equidistributed. NEITHER IS ESTABLISHED HERE and no
        source is cited for either. An independent consistency check exists
        inside this corpus and does not depend on the heuristic: the measured
        per-slot lift probability P_lift(p) = (1 - 2/p + p^-3)/(2 p^3) from
        DEC-20260724-021, multiplied by the p^3 candidate x-polynomials of degree
        <= 2, gives an expected slot count of (1 - 2/p + p^-3)/2, which tends to
        exactly 0.5. The two routes agree in the limit, which is real
        corroboration and is why the prediction is stated at 0.5 rather than "an
        O(1) constant".
      validation_plan: >-
        Direct uniform sampling at p in {7,13,19,31}, >= 20000 surfaces each,
        pure Python with the frozen predicate, reporting the full slot histogram
        rather than only the mean -- the histogram is a stronger test than the
        mean, because equidistribution also predicts the distribution of fixed
        root counts, which is computable class-by-class from W(E8). Falsification
        condition as stated above.
    - id: HEUR-W2
      statement: >-
        The geometric Mordell-Weil lattice of a chi = 1 surface with squarefree
        discriminant is exactly E8 (rank 8, 240 roots), not a proper sublattice.
      rigorous_support: >-
        RECALLED, UNVERIFIED from Shioda's classification. The supporting
        argument as remembered: the Shioda-Tate formula gives rank MW = rho - 2 -
        sum_v (m_v - 1), and with all fibres irreducible and rho = 10 for a
        rational elliptic surface the rank is 8, the lattice being E8 by the
        determinant computation. The papers were NOT READ.
      validation_plan: >-
        Not directly testable over F_p (the geometric lattice is not enumerable
        by the census), so the plan is indirect and its limits are declared: test
        the CONSEQUENCES -- that no realised subsystem exceeds rank 8, that no
        realised root count exceeds 240, and that every realised (rank, count)
        pair is that of a root subsystem of E8. Any violation refutes HEUR-W2.
        The absence of a violation is consistent with, and does not prove, it.

  proof_search_map_note: >-
    The paired hypothesis H-XEDN-906489 carries the filled proof_search_map with
    all four audits, covering both this proposal and IDEA-20260805-4ddf4e, which
    share premises and are tested by the same contract EXP-XEDN-1bcf87.

  target_complexity:
    exponent_moved: >-
      NONE. Stated plainly: this proposal moves no exponent, proposes no
      algorithm, and offers no attack. It is worth running anyway because it
      converts an empirical census question into two derived constants, one of
      which (the ceiling) makes further census in the window provably
      uninformative, and the other of which (the mean) measures a selection
      effect that every record in the lane inherits without charging.
    memory_exponent: n/a -- no algorithm.
    best_known: >-
      Pollard rho at sqrt(N) time and O(1) memory remains the ECDLP baseline; no
      arm of this proposal approaches it or claims to.
    hidden_overhead: >-
      n/a. Stages 0-2 are seconds to a CPU-minute; Stage 3 is minutes.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed, no Pareto point offered). Frontier rows actually
    checked before writing that, on time, memory and data/queries: Pollard rho
    (sqrt(N) time, O(1) memory, no data); parallel rho with distinguished points
    (sqrt(N)/w time, w memory); BSGS (sqrt(N) time, sqrt(N) memory); the
    corpus's prime-field index-calculus lane (no working subexponential variant
    recorded); Semaev/Gaudry-Diem (extension fields only, out of scope here);
    classical xedni (recorded refuted). This proposal offers no point on any of
    those axes; the honest statement is that it competes with nothing and is a
    derivation plus a measurement.
  sota_delta: >-
    Zero on every attack axis (time, memory, data, queries, preprocessing,
    advice). The quantitative deltas it does offer are internal and specific:
    it replaces an unbounded-in-principle observable by an absolute ceiling of 6;
    it replaces an unstated sampling assumption by a measured conditioning ratio
    predicted at >= 6x; and it supplies a forced expected value of 0.5 slots per
    surface where the lane's records supply none. Cost of obtaining all three:
    under one CPU-minute for the decisive stages.

  estimated_cost:
    implementation: low
    compute: very low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 for Part A (the ceiling of 6 and the forbidden value 5), because the
    mark computation is mechanical and self-checking and the only real risk is
    the recalled height-2 correspondence; it is not higher because that
    correspondence is unread and because a surface with reducible fibres breaks
    the premise. 0.45 for Part B's exact value of 0.5, and that number is
    deliberately near a coin flip: the Burnside step is exact, but the
    equidistribution heuristic it rests on is unestablished, the family is
    restricted (deg b exactly 6, non-isotrivial), and small p makes the error
    term large -- while on the other side the independent P_lift(p) route from
    DEC-20260724-021 lands on the same 0.5 in the limit, which is the main reason
    it is not lower. 0.97 that the conditioning ratio is well above 1 whatever
    the exact uniform mean turns out to be, since the sampler solves for (a,b)
    from planted sections by construction.
