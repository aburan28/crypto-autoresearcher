  title: Summation polynomials are insensitive to the form of p
  class: control
  claim: |-
    For fixed (a,b), S_3 and S_4 over F_p have identical monomial support and coefficient identities whether p = 2^n - c or a random n-bit prime; decomposition-solver throughput differs by a constant factor <= 3x.
  mechanism: |-
    S_m is a polynomial in x_1..x_m with coefficients in Z[a,b]; p enters only through reduction. A pseudo-Mersenne p can change arithmetic cost, not the algebraic structure of the decomposition problem.
  novelty_status: known
  citations:
  - ref: KN-LIT-001
    source_text: Semaev 2004 summation polynomials
    provenance: kb
    claim: |-
      S_m vanishes exactly on x-coordinates of points summing to O; coefficients in Z[a,b]
    verified_by: intake-session-20261009 (coordinator role) opened KN-LIT-001
  assumptions:
  - char != 2,3; Semaev summation polynomials as defined
  - |-
    Batch claim boundary: Every experiment is a bounded mathematical measurement on synthetic or known-answer instances at small p. No private-key recovery, no attack on deployed curves or keys. A working toy-p prototype is "finite control", never "subexponential ECDLP". Theorem-closed items can produce receipts, never results.
