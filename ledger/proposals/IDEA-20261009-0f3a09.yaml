    A sustained wall-time ratio outside [1/3, 3] on the fixed A3 workload with the same build and seeds.
  - A timeout, crash or symbolic-build failure is infrastructure, never evidence.
  confounders:
  - |-
    Arithmetic libraries special-case pseudo-Mersenne reduction; the reduction-share metric separates library speed from algebraic structure.
