  minimal_test:
    design: |-
      1. Build S_3, S_4 symbolically over Z[a,b] (Sage); reduce modulo p in {2^n - c, random n-bit} for n in {31, 61, 127, 255} with matched (a,b).
      2. Compare support, degree profile, factorization pattern.
      3. Time one fixed decomposition workload (the A3 harness) under both prime types.
    controls:
