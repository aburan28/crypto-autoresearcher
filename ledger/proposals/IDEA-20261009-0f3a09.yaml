  heuristic_assumptions:
  - id: H1
    statement: |-
      The reduction Z[a,b][x_1..x_m] -> F_p[x_1..x_m] of S_m preserves monomial support for p > the largest coefficient prime divisor, so prime form is invisible to the algebra and only arithmetic cost moves.
    rigorous_support: |-
      S_m has integer coefficients independent of p (KN-LIT-001); reduction kills a monomial only when p divides its coefficient.
    validation_plan: |-
