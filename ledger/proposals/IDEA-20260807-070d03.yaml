idea:
  id: IDEA-20260807-070d03
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    THE FACTOR-BASE MEMBERSHIP ORACLE, ADJUDICATED PROPERLY: it is the one place
    index calculus genuinely leaves the generic group model, and it is
    nevertheless worthless, because at arity 1 a FREE membership oracle yields an
    algorithm whose optimum is exactly rho at N/(2 sqrt(L)) draws with L = N,
    while at arity m >= 2 the useful object is not membership but DECOMPOSITION,
    whose prime-field cost is unbounded by any Bezout argument since -- with no
    proper subfield and hence no Weil restriction -- a size-L subset of F_p has
    vanishing degree exactly L, whereas the subfield factor base over F_{q^n} is
    cut out by n-1 LINEAR conditions
  class: mechanism

  claim: >-
    (A) THE ORACLE AND WHY IT IS THE INTERESTING ONE. FBMEM_S(h) returns the bit
    [ x(h) in S ] for a declared set S subset F_p of size L. Unlike every other
    oracle this campaign has named, its answer is NOT a function of the linear
    form lambda(h): two instances with identical generic transcripts can give
    different membership answers, because membership depends on the concrete
    encoding. THIS IS THE GENUINE ESCAPE FROM THE GENERIC GROUP MODEL, and it is
    the one that historically matters: it is the resource index calculus
    consumes, it is resource R1, and it is why KN-TECH-005's bound has never been
    a proof that ECDLP is hard.

    (B) THE FIRST ADJUDICATION, WHICH IS THE EASY ONE. NON-SIMULABLE, in the
    (N-weak) sense of IDEA-20260807-63056d: no simulator that is a function of
    lambda alone is correct. Witness, exhibitable at toy scale: fix E, P, Q and
    two distinct sets S_1, S_2 of the same size; the generic transcript is
    identical and the answers differ. That establishes (N-weak) and nothing more,
    and the record says so rather than claiming (N-strong).

    (C) THE SECOND ADJUDICATION, WHICH IS THE ONE THAT MATTERS, AND THE ANSWER
    IS THAT NON-SIMULABILITY BUYS NOTHING. FBMEM is SELF-COMPUTABLE: a real
    adversary holds the concrete coordinates of P and Q and knows the linear form
    (alpha, beta) it used to build h, so it computes [alpha]P + [beta]Q and tests
    x in S itself, in O(log N) field operations. The oracle hands it nothing. In
    the IDEA-20260807-5876b8 taxonomy this is cell (b), verdict PUB. The correct
    reading is NOT "the oracle is closed" but "THE ORACLE FRAMING IS EMPTY": the
    question is and always was about the cost of an ALGORITHM, never about access
    to a bit.

    (D) THE GENERATION CLAIM, WHICH COLLAPSES SEVERAL LANES' ORACLES AT ONCE.
    Every R1/R2 oracle this campaign has named factors through the single
    coordinate map x : G -> F_p up to a publicly computable function:
      FBMEM_S = 1_S composed with x -- a publicly computable predicate;
      MODEL-CHANGE (Weierstrass -> Montgomery / Edwards / Hessian / Jacobi-
        quartic / theta) = a publicly computable birational map applied to
        (x, y) -- so a model-change oracle is INTER-COMPUTABLE with the
        coordinate oracle and adds exactly zero;
      SUMMATION-POLYNOMIAL ROOT-FINDING at supplied field elements = a publicly
        computable root-find;
      any "x-coordinate in an interval / has small Hamming weight / lies in a
        prescribed algebraic set" predicate = a publicly computable predicate.
    Therefore THE R1/R2 FAMILY HAS ONE GENERATOR, x, AND IT IS FREE. Lane L11
    (curve models) consumes no resource its lane L1 sibling does not already
    have; a model change can alter the SHAPE OF THE FACTOR BASE and hence the
    cost of decomposition, and that -- not any new oracle -- is the only thing
    L11 can be about. This is a redirection for L11, not a closure of it.

    (E) THE ARITY SPLIT, WHICH IS THE ACTUAL EXPLANATION OF WHY THE ESCAPE HAS
    NOT BEATEN RHO OVER PRIME FIELDS. Give the adversary FBMEM for free and count.
      ARITY 1. Draw random R_j = [a_j]P + [b_j]Q and query FBMEM. A random point
        lies in the factor base with probability about 2L/N (the factor 2 because
        x determines the point up to sign). A hit gives one congruence
        a_j + b_j*k = +-e_i (mod N) where e_i = log_P(P_i) is a NEW UNKNOWN. The
        system closes only when two hits land on the SAME factor-base element, at
        which point subtracting gives k. By the birthday bound that needs about
        sqrt(L) hits, hence about sqrt(L) * N/(2L) = N/(2 sqrt(L)) draws. This is
        MINIMISED AT L = N, where it equals sqrt(N)/2 draws -- and at L = N the
        "factor base" is the whole group and the membership oracle is vacuous.
        CONCLUSION: an unlimited free membership oracle at arity 1 gives an
        algorithm that is exactly Pollard rho, whose optimum is attained by
        throwing the factor base away. Non-simulable, free, and provably
        worthless -- the third member of the KN-FIND-b7e091 "non-simulable but
        useless" family, and the first one with a cost formula attached.
      ARITY m >= 2. The useful object is not membership but DECOMPOSITION: given
        a target R, RETURN m factor-base elements summing to it. With
        L = (m! N)^{1/m} a random R decomposes with constant probability, L + 1
        relations suffice, and the QUERY COUNT is about L = N^{1/m}, which is
        sub-birthday for every m >= 3. SO THE ESCAPE IS REAL IN THE QUERY MODEL,
        and the entire prime-field ECDLP question is the CHARGED COST C of one
        decomposition. This is why the honest verdict for the decomposition
        oracle is COST (cell c) and not a closure, and why this lane must not
        report index calculus as closed by Shoup (see IDEA-20260807-7270d1).

    (F) WHY C IS LARGE OVER F_p AND SMALL OVER F_{q^n}, STATED AS A DEGREE FACT
    RATHER THAN AS FOLKLORE. The decomposition condition is
    S_m(x_1, .., x_m, x(R)) = 0 together with "x_i lies in the factor base".
      OVER F_{q^n} with the subfield factor base {x in F_q}: after Weil
        restriction each x_i becomes an n-tuple of F_q-coordinates and the
        condition x_i in F_q becomes n-1 LINEAR equations on that tuple --
        DEGREE 1. The system's Bezout bound is then controlled by deg S_m alone
        and is independent of the factor-base size; this is the structural reason
        Gaudry/Diem-style index calculus beats rho over extension fields.
      OVER F_p: n = 1, there is no Weil restriction and no proper subfield. The
        smallest-degree polynomial vanishing on a size-L subset of F_p has degree
        EXACTLY L -- for every subset, including intervals, random sets and root
        sets of chosen polynomials, since a monic polynomial vanishing on L
        points has degree at least L. So the membership condition contributes
        degree L per variable, the Bezout bound on the decomposition system
        scales like L^m * deg S_m, and at the useful L = N^{1/m} that is already
        about N. NO CHOICE OF PRIME-FIELD FACTOR BASE ESCAPES THIS, because the
        obstruction is a counting fact about subsets of F_p, not a defect of any
        particular choice.
    That is the precise content of KN-FIND-5c1a03's "non-algebraic factor base
    forced by Bezout", written as a degree computation that a toy experiment can
    check.

    (G) THE DISCRIMINATING EXPERIMENT, AND IT HAS A GENUINE TWO-WAY OUTCOME.
    Three factor bases MATCHED ON SIZE L and differing only in structure --
    (a) an interval [0, L), (b) a uniformly random subset, (c) the root set of a
    chosen degree-L polynomial -- must, by (F), give the SAME decomposition cost
    over F_p, because all three have vanishing degree exactly L. A fourth arm,
    OUT OF SCOPE AND LABELLED AS SUCH, is the subfield factor base over F_{q^2}
    at matched total field size, which by (F) must be CHEAPER. If (a), (b), (c)
    differ, (F)'s degree argument is incomplete and there is prime-field
    factor-base structure this program has not identified -- which would be the
    most valuable outcome available in the entire campaign. If the F_{q^2} arm is
    NOT cheaper, the instrument is broken and no negative from it is citable.

  resource_label: >-
    R1 (x-coordinates as field elements) -- CLAIMED AND GENUINE. This is the one
    proposal in this lane whose oracle really does consume a non-generic
    resource. The audit's verdict is that the resource is real, free, and
    insufficient at arity 1; at arity m the resource is real and the binding
    quantity is a COST, not an oracle.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE, and it is the only oracle in this lane's nine proposals that is.
    FBMEM's answer is not a function of the group-operation transcript: it reads
    the x-coordinate as a field element, which is exactly resource R1 in
    DECOMPOSITION.md section 2 and exactly the blind spot KN-TECH-005 names
    ("the bound is about the generic model; it says nothing about attacks
    exploiting concrete structure"). The admissibility filter passes it. What
    this record then shows is that passing the filter is necessary and nowhere
    near sufficient, which is the campaign's own decision target stated from the
    other side.

  discriminated_from:
    - >-
      KN-FIND-b7e091's Oracle C (incidence), which asks whether a SUPPLIED subset
      sums to Q -- a function of lambda, simulable, closed. FBMEM asks a question
      about a coordinate and is not a function of lambda. Adjacent-sounding,
      categorically different, and conflating them is the error this record
      exists partly to prevent.
    - >-
      KN-FIND-5c1a03, which states the missing-ingredient characterization
      ("non-algebraic factor base forced by Bezout") as a convergence of three
      analyses. This record does not restate it; it converts it into (i) an
      explicit degree fact -- vanishing degree of a size-L subset of F_p is
      exactly L -- and (ii) a matched-size three-arm experiment that could
      falsify it. That conversion is the proposal.
    - >-
      H-STR-002, which is `weakened` (DEC-20260727-009) with its replication
      obligation DEFER-BATCH009-001 OPEN. THIS RECORD DOES NOT TEST, SUPPORT,
      WEAKEN OR RESTORE H-STR-002 and asserts nothing about phi-stable factor
      bases. The mechanism here is a DEGREE-COUNTING statement about arbitrary
      subsets of F_p, which the weaken did not touch and which is independent of
      any equivariance claim. If a reviewer judges otherwise, GOAL-ENDO-001 pause
      condition P2 applies and this record must wait rather than proceed.
    - >-
      The DREG-lane solving-degree measurements (KN-TECH-004, KN-TECH-011,
      KN-FIND-f8c290). Those measure one solver's behaviour on the Semaev system.
      This record measures the DEPENDENCE OF THAT COST ON FACTOR-BASE STRUCTURE
      at matched size, which is a different independent variable and is the one
      (F) makes a prediction about.

  object_first_candidate:
    tracked_object: >-
      The membership bit-string b(R) = ( [x(R) in S] ) as R ranges over the
      points the algorithm forms -- i.e. the factor base indicator pulled back
      along the coordinate map, followed through the algorithm's walk.
    lossiness: >-
      EXTREMELY LOSSY: log_2(p) bits of x-coordinate are projected onto ONE bit.
      Nothing about the point survives except a yes/no. This is the most lossy
      projection considered anywhere in this lane.
    propagation: >-
      IT DOES NOT PROPAGATE, AND THAT IS EXACTLY WHY IT ESCAPES. b(R_1 + R_2) is
      not a function of b(R_1) and b(R_2): membership is a predicate on the
      x-coordinate and the x-coordinate of a sum is a rational function of both
      summands' coordinates, so the group law does not act on the retained bit at
      all. Under the inventor-protocol section 2 test this is the OPPOSITE
      situation from every other object in this lane: the projection is lossy AND
      incompatible with the target's operations. In the GGM that means
      "non-simulable"; in attack terms it means the object cannot be propagated
      forward, so it can only be SAMPLED, and sampling is what index calculus
      does. THE GENERAL PRINCIPLE, worth stating once: a lossy projection that
      propagates under the group law is a simulable oracle; a lossy projection
      that does NOT propagate is a candidate non-generic resource that must be
      resampled at every step, and the cost of resampling is the whole game.
    survival_score: >-
      Survives nothing, structurally -- one group operation destroys the relation
      between the retained bits. Survives a change of factor base only as a
      redefinition. What it DOES survive is the thing that matters: it survives
      being the definition of a relation, and a set of L+1 relations closes the
      system. The object's value is not in its propagation but in its
      ACCUMULATION, which is a different mode entirely and is why index calculus
      does not look like a differential attack.

  mechanism: >-
    STEP 1 (zero compute) -- THE TWO ADJUDICATIONS. Write the (N-weak)
    non-simulability witness and the poly-time self-computation. Verdict PUB.
    Record that the verdict is a REDIRECTION and not a closure.

    STEP 2 (zero compute) -- THE ARITY-1 COST DERIVATION of (E). Derive
    N/(2 sqrt(L)) draws and its minimum sqrt(N)/2 at L = N. State the conclusion
    in the form that makes it checkable: at arity 1 the optimal factor base is
    the whole group, i.e. there is no factor base.

    STEP 3 (zero compute) -- THE GENERATION CLAIM of (D). For each named R1/R2
    oracle write the publicly computable map that reduces it to x. Publish the
    table. This is what closes L11's oracle framing.

    STEP 4 (zero compute) -- THE DEGREE FACT of (F). State and prove: a nonzero
    polynomial over F_p vanishing on a set of size L has degree at least L; the
    subfield condition over F_{q^n} becomes n-1 linear conditions after Weil
    restriction. Two elementary facts whose CONTRAST is the whole content.

    STEP 5 (toy compute, the experiment) -- THE MATCHED-SIZE FOUR-ARM
    MEASUREMENT. At p <= 2^20, fix a curve, fix a target R, fix arity m = 3, and
    fix factor-base size L. Build the decomposition system and measure, per arm:
    Groebner solving degree, first-fall degree, Macaulay matrix dimension at the
    solving degree, wall-clock, and DECOMPOSITION SUCCESS RATE.
      ARM A: interval factor base [0, L).
      ARM B: uniformly random subset of size L (THE NULL: matched on size, no
        structure whatsoever).
      ARM C: root set of a chosen degree-L polynomial with structured
        coefficients (e.g. a Chebyshev-like or Artin-Schreier-like family), to
        test whether ANY prime-field algebraic structure helps.
      ARM D, OUT OF CAMPAIGN SCOPE AND LABELLED AS SUCH: E over F_{q^2} with
        q^2 approximately p and the subfield factor base {x in F_q}, matched on
        L and on m. This is the POSITIVE CONTROL for "algebraic factor base
        helps"; if it is not cheaper, the instrument cannot detect the effect it
        is looking for and Arms A-C prove nothing.
    Repeat over 5 seeds and 3 sizes.

    STEP 6 (zero compute) -- THE CHARGED-COST ACCOUNTING. For each arm compute
    q * C + g against 0.886 * sqrt(N), with q the measured relation count needed
    and C the measured per-decomposition cost, so that the record ends in the
    cell-(c) arithmetic rather than in a verdict word.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), 2026-08-07,
      over the whole tree, then narrowed to ledger/, knowledge/, docs/,
      analysis/. Patterns: "factor.base.membership|factor-base-membership|
      membership oracle"; "Bezout"; "Weil restriction"; "vanishing degree";
      "simulab|simulator".
    results: >-
      "factor-base membership" appears widely in the PRIOR-CORPUS directories
      (outputs/prior_proposals_index.json, inputs/, focus/, research/) as a
      component of many earlier candidate mechanisms -- VC dimension bounds,
      Maltsev polymorphisms, Koszul operads, modular carry polytopes -- none of
      which adjudicate it as an oracle in the generic group model. Inside the
      curated corpus, KN-FIND-982fdf mentions a threshold-factor-base membership
      identification task; KN-FIND-5c1a03 states the Bezout/non-algebraic
      factor-base characterization at the level of a convergence summary. NO
      record states the arity-1 cost formula N/(2 sqrt(L)), the generation claim
      that R1/R2 factors through x, or the vanishing-degree-exactly-L contrast
      with the Weil-restricted linear conditions.
    verdict: adaptation
  novelty_screen_note: >-
    ADAPTATION, and honestly so on two counts. The arity-1 degeneration of
    factor-base methods to a birthday search is standard folklore in the
    index-calculus literature and is not claimed as new; what is new to this
    program is writing the cost formula and its optimum down so the "escape" can
    be quantified. The Weil-restriction contrast is the standard explanation of
    why Gaudry/Diem work over extension fields and not over prime fields; what is
    proposed is its conversion into a matched-size falsifiable experiment. No
    external-literature novelty is claimed, and a published matched-size
    factor-base-structure comparison would be an ingredient, not a
    disappointment; a Stage-0 literature scout for one is part of the design.

  null_object_control: >-
    MANDATORY AND BLOCKING, and it is ARM B. The uniformly random size-L subset
    is the matched null: same size, same expected decomposition probability, zero
    structure. Prediction (F) says Arms A, B and C are INDISTINGUISHABLE; if Arm
    A or C beats Arm B on solving degree by more than the seed-to-seed spread,
    prime-field factor-base structure exists and the degree argument is
    incomplete -- the campaign's best available outcome.
    DECAY PARAMETER: the factor-base size L, on a ladder
    L in {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}}. The degree argument predicts the
    Bezout bound and the observed solving degree grow with L for ALL arms
    identically; a structural advantage in Arm A or C should SHRINK as L grows
    toward N (where every set is unstructured). A putative advantage that does
    NOT decay as L grows is the canonical artifact tell.
    PLANTED-SIGNAL CONTROL: ARM D, the out-of-scope F_{q^2} subfield factor base,
    which by (F) MUST be cheaper. An instrument that cannot see Arm D's advantage
    cannot see factor-base structure at all, and every Arm A/B/C null it produces
    is void rather than negative.
    SECOND PLANTED CONTROL: a factor base constructed to contain a KNOWN
    decomposition of the target R. The decomposition oracle must find it; a
    solver that misses a planted solution is broken.

  assumptions:
    - >-
      G has prime order N; the factor base is a set of x-coordinates, so each
      member corresponds to a point up to sign, which is where the factor 2 in
      the arity-1 probability comes from.
    - >-
      In the arity-1 derivation the drawn points behave like uniform elements of
      G. This is the standard rho-style heuristic, is named as HEUR-1 below, and
      is testable directly.
    - >-
      "A nonzero polynomial over F_p vanishing on L points has degree at least L"
      -- elementary and used without proof.
    - >-
      The Weil-restriction statement is the standard Gaudry/Diem setup and is
      relayed, not re-derived here. Its precise form for a given (q, n) must be
      confirmed before Arm D is interpreted, and if it cannot be confirmed the
      arm is reported as an uninterpreted control.
    - >-
      Toy scale p <= 2^20 with m = 3 is where Groebner computations on the
      decomposition system terminate in pure Python. Everything measured is
      scoped there; no extrapolation to crypto-scale solving degree is performed
      and none is licensed.

  proof_search_map:
    bottleneck: >-
      The CHARGED COST C of one arity-m decomposition over F_p. Every other
      quantity in this record is either derived in two lines (arity-1 cost, the
      degree fact) or clerical (the generation table). C is the single number
      whose value decides whether prime-field index calculus beats rho, it is the
      only thing the experiment actually measures, and it is the exact step whose
      removal would change the theorem.
    baseline_embedding:
      parameter_slice: >-
        m = 1 and L = N. At this slice the method must degenerate to Pollard rho
        at sqrt(N)/2 draws, reproducing the frontier baseline (KN-TECH-001,
        KN-TECH-006) exactly. Second slice: the F_{q^2} subfield factor base at
        Arm D, which must reproduce the known extension-field advantage
        qualitatively (cheaper than Arms A-C at matched L and m).
      reproduction_check: >-
        SYMBOLIC at the first slice (the arity-1 formula evaluated at L = N gives
        sqrt(N)/2, matching the birthday constant up to the 0.886 factor's
        derivation, and the discrepancy between 0.5 and 0.886 must be explained
        as the difference between distinct-point draws and rho's walk, not
        glossed). FROZEN FIXTURE at the second: Arm D's solving degree at fixed
        (q, n, m, L) recorded once and re-checked on every later run.
    observation_collision:
      observable: >-
        The Groebner solving degree of the decomposition system, plus the
        measured per-decomposition cost C.
      distinct_preimage_search: >-
        REQUIRED, AND THE WHOLE EXPERIMENT IS ONE. Arms A, B and C are three
        structurally distinct factor bases predicted to share the same
        observable. If they do, the observable is a function of SIZE alone and
        the record's conclusion is that prime-field factor-base structure is
        invisible to the cost -- a controlled null in the inventor-protocol
        section 3 sense, and the predicted outcome. A SECOND collision, on the
        other side: Arm A over F_p and Arm D over F_{q^2} at matched L, m and
        total field size are predicted to have DIFFERENT observables despite
        identical combinatorial shape, which is what makes the observable
        meaningful at all. An instrument for which A, B, C, D all collide is
        measuring nothing.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure "vanishing degree of the factor base" and
          realize it by the specialization to F_{q^n}, where the measure drops
          from L to 1 because the subfield condition linearizes after Weil
          restriction. Charges are added only over the proved-disjoint blocks
          {membership conditions} and {the summation polynomial}, whose degrees
          multiply in the Bezout bound rather than interacting.
        predicted_gain: >-
          Converts "prime fields are harder for index calculus" from a folklore
          statement into a single integer per factor base -- the vanishing degree
          -- with a prediction (equal across all prime-field arms, 1 for the
          subfield arm) that a toy experiment can falsify.
      - transform: observable_fiber
        proposed_object: >-
          Hold the solving degree fixed and vary the factor base's algebraic
          structure at matched size. The fiber is predicted to contain Arms A, B
          and C. Finding an intrinsic invariant that separates them WOULD BE THE
          CAMPAIGN'S BEST RESULT and is the constructive branch.
        predicted_gain: >-
          If the fiber is not a single point -- if some prime-field factor base
          is cheaper at matched size -- the gain is a concrete algorithmic target
          with a measured size. Predicted probability of that: low (see honest
          prior), which is why the record is filed as a controlled null with a
          live constructive branch rather than as an attack proposal.
    quantifier_order: >-
      THE CLAIMS, IN ORDER, WITH DEPENDENCIES MADE EXPLICIT:
        (B) NON-SIMULABILITY, (N-weak) form: EXISTS a pair of instances with
          identical generic transcripts and differing answers, hence FORALL
          simulators S that are functions of lambda alone, S is incorrect. NOT
          CLAIMED: FORALL efficient S EXISTS a distinguisher, which would be
          (N-strong) and would require ruling out lazy consistent sampling.
        (C) SELF-COMPUTABILITY: FORALL instances, FORALL queries, EXISTS a
          poly(log p) algorithm computing the answer from the public data. The
          algorithm is uniform in the instance, which is what makes the verdict
          PUB rather than instance-dependent.
        (E) ARITY-1 COST: FORALL factor bases S of size L, the expected number of
          draws to closure is about N/(2 sqrt(L)); hence EXISTS an optimum at
          L = N with value sqrt(N)/2. The universal over S comes FIRST, so no
          choice of factor base evades it -- that ordering is the content, and
          the weaker "EXISTS S for which the cost is sqrt(N)" would say nothing.
        (F) DEGREE FACT: FORALL subsets S of F_p with |S| = L, FORALL nonzero
          polynomials f vanishing on S, deg f >= L. Again the universal over S
          comes first. The contrast statement is EXISTS a field F_{q^n} and a
          factor base whose membership condition has degree 1 after Weil
          restriction -- an existential, and it is realized by the subfield.
      THE ORDER IS THE ARGUMENT: prime fields lose because a UNIVERSAL statement
      holds over all their factor bases, whereas extension fields win because an
      EXISTENTIAL is realized. Any attempt to beat (F) must exhibit a
      prime-field factor base escaping a universally quantified counting fact,
      which is why the record predicts the null.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At m = 3 and p <= 2^20, with these five seeds and this solver, the
        Groebner solving degree of the decomposition system does not depend on
        the algebraic structure of the factor base at matched size, while it does
        drop for the Weil-restricted subfield factor base." It can NEVER certify
        that no prime-field factor base is better, that C is large at
        cryptographic size, that index calculus cannot beat rho, or anything
        about m > 3. Dropping any of those qualifiers is overclaiming under
        AGENTS.md rule 4.
      nearby_object_control: >-
        THE SUBFIELD FACTOR BASE OVER F_{q^2} (Arm D) is precisely the nearest
        object on which the hoped-for conclusion ("factor-base structure does not
        matter") FAILS -- and it must fail there, or the instrument is blind.
        This is the unusual case where the nearby-object control is REQUIRED TO
        BREAK the conclusion, and the record is designed around that.
        A SECOND nearby object: a factor base of size L close to N, where every
        subset is structureless and all arms must agree trivially. Including it
        guards against reading an agreement at small L as informative.
    proof_obligations:
      - claim: >-
          The (N-weak) non-simulability witness exists and is checkable.
        responsibility: correctness
      - claim: FBMEM is poly-time self-computable from public data.
        responsibility: correctness
      - claim: >-
          The arity-1 expected draw count is about N/(2 sqrt(L)) and is minimised
          at L = N.
        responsibility: success_probability
      - claim: >-
          Every named R1/R2 oracle reduces to x by a publicly computable map.
        responsibility: scope
      - claim: >-
          A nonzero polynomial over F_p vanishing on L points has degree at least
          L, and the subfield condition over F_{q^n} is n-1 linear conditions
          after Weil restriction.
        responsibility: size
      - claim: >-
          The arity-1 slice at L = N reproduces the rho baseline.
        responsibility: baseline
      - claim: >-
          Arm D is cheaper than Arms A-C; the planted decomposition is found.
        responsibility: interface
      - claim: >-
          Every reported number names its arity, factor-base size, prime, seed
          and solver.
        responsibility: scope

  predictions:
    - metric: >-
        expected number of random draws to recover k with a free arity-1
        membership oracle, as a function of factor-base size L, measured at
        p <= 2^20
      direction: different
      minimum_effect: >-
        Fits N/(2 sqrt(L)) within 25 percent across L in
        {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}}, and the measured minimum over L is
        attained at the largest L tested. A fit that fails means the uniformity
        heuristic HEUR-1 is wrong for this walk and the derivation must be
        redone; a minimum attained at SMALL L would mean the arity-1 factor base
        genuinely helps, which contradicts the derivation and is the single most
        interesting negative outcome available here.
    - metric: >-
        Groebner solving degree of the arity-3 decomposition system, Arms A vs B
        vs C at matched L
      direction: different
      minimum_effect: >-
        PREDICTED: no difference beyond the seed-to-seed spread, i.e. all three
        within 1 degree. A reproducible gap of >= 2 degrees in favour of Arm A or
        C, surviving the L-ladder decay test, falsifies (F)'s completeness and is
        escalated to independent review before any record states it
        (GOAL-ENDO-001 pause condition P3 if it implies a cost below the
        discounted rho baseline).
    - metric: >-
        Groebner solving degree, Arm D (F_{q^2} subfield) vs Arms A-C at matched
        L, m and total field size
      direction: lower
      minimum_effect: >-
        Arm D at least 2 degrees lower, or the instrument is declared blind and
        Arms A-C produce no citable negative. This is the planted-signal
        direction and it is blocking.
    - metric: >-
        charged accounting q*C + g versus 0.886*sqrt(N) for the best arm
      direction: higher
      minimum_effect: >-
        Predicted to exceed the rho baseline by at least a factor 10 at every
        tested size, i.e. no arm is competitive. A ratio below 1 at any size is a
        measured sub-rho decomposition at toy scale and triggers immediate
        escalation; it would almost certainly be a toy-scale artifact (small-p
        effects, smooth order) and the confounder list says how to check.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, 2 hours): the two adjudications, the arity-1 cost
      derivation, the generation table, the degree fact. Plus a literature scout
      for an existing matched-size factor-base-structure comparison; log any hit
      to knowledge/literature/.
      STAGE 1 (toy compute, <= 30 min, HARD GATE): the arity-1 measurement. Draw
      random combinations, query a locally implemented membership predicate,
      count draws to closure, fit against N/(2 sqrt(L)) over the L ladder. This
      is cheap, needs no Groebner engine, and if the fit fails the rest of the
      design is built on a broken derivation.
      STAGE 2 (toy compute, HARD GATE): the two planted controls -- planted
      decomposition must be found; Arm D must be cheaper. Both blocking.
      STAGE 3 (toy compute, hours): the four-arm matched-size measurement at
      m = 3, three sizes, five seeds, with the L ladder.
      STAGE 4 (zero compute): the charged accounting of Step 6 and the write-up,
      with every number naming its arity, L, prime, seed and solver.
    controls:
      - >-
        ARM B, uniformly random size-L factor base (matched null, blocking)
      - >-
        ARM D, F_{q^2} subfield factor base (planted signal, blocking, and
        explicitly OUT OF CAMPAIGN SCOPE -- a scope-boundary control, never
        evidence about prime fields)
      - >-
        planted decomposition of the target inside the factor base (solver
        sanity, blocking)
      - >-
        L ladder {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}} as the decay test
      - >-
        factored group order and largest prime factor per curve (KN-TECH-030
        hygiene), and #E != p (KN-TECH-033 hygiene)
      - >-
        matched Pollard rho with negation and matched BSGS on identical
        instances, counted in the same operation unit
    required_metrics:
      - draws to closure vs L at arity 1, with the fitted exponent
      - Groebner solving degree, first-fall degree, Macaulay dimension per arm
      - decomposition success rate and per-decomposition wall-clock (this is C)
      - relations needed to closure (this is q)
      - q*C + g against 0.886*sqrt(N) per arm
      - pass/fail of both planted controls
      - factored order and largest prime factor per curve

  falsification_conditions:
    - >-
      The arity-1 draw count does not fit N/(2 sqrt(L)) within 25 percent. The
      uniformity heuristic or the derivation is wrong; the arity-1 conclusion is
      withdrawn and the arity-m design is re-examined, since it shares the
      heuristic.
    - >-
      Arms A or C beat Arm B reproducibly by >= 2 solving degrees, surviving the
      L-ladder decay test. (F) is incomplete; prime-field factor-base structure
      exists; escalate to independent review. THIS IS THE OUTCOME THE RECORD
      HOPES FOR AND EXPECTS NOT TO GET.
    - >-
      Arm D is not cheaper than Arms A-C. The instrument cannot detect
      factor-base structure; Arms A-C produce no citable negative and the run set
      is INVALID rather than confirming (AGENTS.md rule 5, RQ-INSTR-f8faa0).
    - >-
      The planted decomposition is not found. Solver broken; nothing is reported.
    - >-
      A curve in the set has smooth order or #E = p. Pohlig-Hellman or the
      anomalous transfer is doing the work; the instance is void and is replaced,
      not interpreted.
    - >-
      Groebner computations at m = 3 exceed the memory or time budget before any
      degree resolves. INFRASTRUCTURE outcome under AGENTS.md rule 5, recorded as
      such, never as evidence about decomposition cost.

  confounders:
    - >-
      SIZE-STRUCTURE CONFLATION. Any comparison of factor bases must match on
      SIZE, or a difference in decomposition probability is mistaken for a
      difference in structure. Every arm uses exactly L elements and the design
      says so three times because this is the error that would invalidate
      everything.
    - >-
      SOLVER STRATEGY. Solving degree depends on monomial order and selection
      strategy. All arms must use the identical solver configuration and it must
      be recorded; a cross-arm comparison with differing configurations measures
      the configuration.
    - >-
      SMALL-p ARTIFACTS. At p <= 2^20 the field equations and accidental
      coincidences can dominate. The prime ladder must span enough range to see
      whether the arm ordering depends on p at all; an ordering that appears at
      one prime and vanishes at another is noise.
    - >-
      ARM D SCOPE LEAKAGE. Arm D is over an EXTENSION field and is outside this
      campaign's declared scope. It is a control on the instrument and may never
      appear in a conclusion about prime fields. This is a documentation risk,
      not a technical one, and it is the most likely way this record gets
      misread.
    - >-
      ARITY-1 WALK CORRELATION. If the arity-1 draws are produced by a rho-style
      walk rather than independent draws, the birthday constant changes and the
      fit degrades for reasons unrelated to the claim. Independent draws are
      specified.

  interpretation_limits:
    - >-
      The verdict PUB is a REDIRECTION, not a closure: it says the oracle framing
      of index calculus is empty and the question is a cost. Anyone citing this
      record as "factor-base membership is closed" has inverted its meaning.
    - >-
      The decomposition oracle is NOT closed by this record and is NOT closed by
      Shoup. It is cell (c), verdict COST, and its adjudication is arithmetic
      pending a measurement of C. See IDEA-20260807-7270d1.
    - >-
      All measurements are toy scale, m = 3, p <= 2^20, five seeds, one solver.
      Nothing extrapolates to cryptographic size and the record licenses no
      extrapolation.
    - >-
      This record asserts nothing about H-STR-002, which remains `weakened` with
      its replication obligation open.
    - >-
      Arm D establishes nothing about prime fields. It establishes that the
      instrument can see the effect it is looking for.

  reachability_gate: >-
    NOT APPLICABLE in the curve-motion sense: no isogeny walk is proposed and no
    curve is changed. The analogous gate that DOES bind here is the factor-base
    reachability question, and the record states it explicitly: a good factor
    base is useful only if it is (i) common enough to hit by random choice or
    (ii) recognisable by a local test. Claim (F) predicts there is no good
    prime-field factor base to reach, which discharges the gate by emptiness
    rather than by cost -- and Arm B, the uniformly random factor base, is
    precisely the test of whether random choice suffices.

  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        UNIFORMITY OF DRAWN POINTS. For independently and uniformly chosen
        (a_j, b_j) in (Z/N)^2, the points R_j = [a_j]P + [b_j]Q are distributed
        uniformly and independently in G, so P[x(R_j) in S] = 2L/N up to O(1/N)
        and the number of draws to a repeated factor-base hit is governed by the
        birthday bound at sqrt(L) hits.
      rigorous_support: >-
        RIGOROUS FOR UNIFORMITY, HEURISTIC ONLY FOR INDEPENDENCE-UNDER-REUSE.
        Uniformity is exact: (a, b) uniform in (Z/N)^2 makes [a]P + [b]Q uniform
        in G. The heuristic part is treating successive hits as independent
        birthday trials, which is the standard assumption underlying the 0.886
        constant in the rho literature (KN-TECH-006) and is the classical
        statement being imitated -- the birthday problem for uniform draws from a
        set of size L.
      validation_plan: >-
        Sample directly at p in {2^16, 2^18, 2^20} over the L ladder, 200 trials
        per cell, and compare the empirical draw-count distribution against the
        predicted geometric-then-birthday form, reporting the mean, the median
        and the 95th percentile rather than the mean alone. Tail check: the
        largest observed draw count against the predicted tail. THIS IS TOY-SCALE
        VALIDATION and is labelled as such; it validates the counting model at
        p <= 2^20 and says nothing about cryptographic size, where the same
        counting model is standard but is not validated by anything here.
    - id: HEUR-2
      statement: >-
        SOLVING DEGREE AS A PROXY FOR C. The Groebner solving degree of the
        decomposition system is a monotone proxy for the wall-clock cost C of one
        decomposition, at fixed solver and fixed system shape, so an arm ordering
        by solving degree is an arm ordering by cost.
      rigorous_support: >-
        Not a theorem. It is the standard working assumption of the program's own
        DREG lane (KN-TECH-004, KN-TECH-011) and it is stated here rather than
        assumed silently. The rigorous relation it imitates is that the Macaulay
        matrix at the solving degree has dimension binomial(n + D, D), which
        grows monotonically in D at fixed n.
      validation_plan: >-
        Measure BOTH solving degree AND wall-clock AND Macaulay dimension on
        every cell and report their rank correlation. If the correlation is weak,
        the arm ordering must be read from wall-clock and the degree numbers are
        reported as descriptive only. This is cheap because all three come out of
        the same run.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT IS CLAIMED, and the record's arithmetic says why.
      ARITY 1 with a free membership oracle: N/(2 sqrt(L)) draws, minimised at
      sqrt(N)/2 -- exponent 1/2, i.e. exactly rho and no better, for every L.
      ARITY m with a free decomposition oracle: about N^{1/m} queries -- exponent
      1/m, which IS sub-birthday, but each query costs C and the charged exponent
      is 1/m + log_N(C). The prime-field question is entirely the value of C, and
      no value is claimed here; it is measured at toy scale only.
    memory_exponent: >-
      Arity 1: O(sqrt(L)) stored hits, i.e. up to N^{1/2} at the optimum -- so
      the arity-1 method is a BSGS-class memory consumer with rho-class time,
      hence strictly Pareto-dominated by rho with distinguished points, which is
      worth stating because it means even the tie at exponent 1/2 is a loss.
      Arity m: O(L) = O(N^{1/m}) relation storage plus the linear-algebra stage.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted on CM curves (KN-TECH-018); BSGS at sqrt(N) time and memory
      (KN-TECH-031). For the decomposition step specifically, the program's
      standing results are KN-FIND-f8c290 and the DREG-lane degree measurements.
    hidden_overhead: >-
      Two disclosures. First, the arity-m exponent 1/m counts QUERIES ONLY and
      hides C entirely -- quoting N^{1/m} without C is the characteristic
      overclaim of this whole area and the record refuses it. Second, the
      arity-1 formula hides the memory cost of storing hits, which turns an
      apparent tie with rho into a strict loss on the Pareto frontier.
    tradeoff_note: >-
      Arity 1 sits at (time N^{1/2}, memory N^{1/2}) -- the BSGS corner --
      dominated by rho at (N^{1/2}, O(1)). Arity m sits at
      (time N^{1/m} * C, memory N^{1/m}) and its position depends entirely on C.
      Parallelisation: the arity-m relation-collection stage is embarrassingly
      parallel; the linear-algebra stage is not, and any concrete cost table must
      charge it.

  dominated_by: >-
    AS AN ATTACK: this record mounts none, and it also DERIVES that the arity-1
    attack it analyses is dominated. Checked row by row: parallel Pollard rho
    with distinguished points at 0.886*sqrt(N) time and O(1) memory
    (KN-TECH-001, KN-TECH-006) dominates the arity-1 method on memory at equal
    time exponent, and dominates this record on everything; BSGS at sqrt(N) time
    and sqrt(N) memory (KN-TECH-031) TIES the arity-1 method on both axes, which
    is the sharpest available statement -- a free non-simulable oracle buys
    exactly a re-derivation of BSGS; the automorphism-discounted rho baseline on
    CM curves (KN-TECH-018) dominates by a further factor up to sqrt(6). For the
    arity-m case the dominating row cannot be named until C is measured, and
    saying otherwise would be a fabrication. `null` is not available anywhere
    here.
  sota_delta: >-
    Zero speedup against any attack baseline: 0 time, 0 memory, 0 queries.
    Quantitative content instead: the arity-1 free-oracle method is measured
    against rho at a ratio of (N/(2 sqrt(L))) / (0.886 sqrt(N)), which is >= 0.56
    for every L <= N and equals 0.56 only at L = N where the oracle is vacuous --
    so a free non-simulable oracle buys at most a constant factor 1.77 and buys
    it by paying sqrt(N) memory. For arity m the delta is UNDETERMINED pending
    the measured C, and the record's whole purpose is to make that the stated
    open quantity rather than an implied win. Instrument delta: converts
    KN-FIND-5c1a03's qualitative characterization into a 4-arm matched-size
    experiment with a pre-registered null and a blocking positive control.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the arity-1 derivation is right and its measurement fits. 0.85 that
    Arms A, B and C are indistinguishable -- the degree fact is a universally
    quantified counting statement and I do not see how a prime-field subset
    evades it, but 0.15 is not negligible and that 0.15 is where the campaign's
    upside lives. 0.6 that Arm D shows a clean advantage at toy scale with a
    pure-Python solver, which is the design's weakest link: if it does not, the
    negative from Arms A-C is not citable and the run is inconclusive rather than
    negative. Overall the most likely honest headline is "at toy scale,
    prime-field decomposition cost is a function of factor-base SIZE and not of
    its algebraic structure, while the extension-field subfield base is cheaper"
    -- a controlled null with a working positive control, which is exactly what
    the inventor protocol asks a negative to look like.

