        phenomenon. Adopted here by name for the primal setting.
      verified_by: 'read in substantial part this session (lines 1-120)'
  assumptions:
    - >-
      Failure is cheaply and certainly detectable, so retrying is a legitimate strategy. For LWE
      key recovery this is immediate - a candidate secret is checked against the public equations
      in linear time - and it is what makes expected cost equal cost per trial divided by success
      probability.
    - >-
      Randomised re-runs on one instance are approximately independent. This is checked, not
      assumed, by NULL-R and by measuring the empirical correlation between trials.
    - >-
      a_eff is affine in the charge exponent, a_eff = 0.292 + 0.2075 c, which follows from
      EV-MLKEM-020's own charge family and sieve-memory model and is exact within that model. The
      record inherits that model's defects, including the unbounded o(n) that record flags.
    - >-
      beta* is well defined as the blocksize at which the modelled success first reaches one under
      the convention. Where the instrument reports a non-integer effective dimension, the record
      uses it as given and records the rounding.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the cost: replacing the success curve p(beta) by a step
      function at beta*, so that the optimisation min_beta cost(beta)/p(beta) is never performed.
      That replacement is made by the convention itself and is inherited by every committed figure
      in this lane.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is s(beta) = +infinity for beta < beta* and 0 above, at which
        the optimiser returns beta* and G = 0 for every a_eff. This is a runnable configuration of
        the Stage-1 evaluator, not a limit argument, and it must reproduce the committed cost
        figures exactly.
      reproduction_check: >-
        Frozen fixture - fed the step-function success curve and the committed attack parameters,
        the evaluator must return EV-MLKEM-020's committed log2(rop) values digit for digit at
        c = 0, and its charge-family values at c = 1/6, 1/3, 1/2, 1.
    observation_collision:
      observable: >-
        The scalar attack cost in bits at the chosen operating point - which is the only thing this
        lane ever records.
      distinct_preimage_search: >-
        COLLISION FOUND AND EXHIBITED. Two attacks with the same recorded cost: (a) one run at
        beta* with p = 1, and (b) 2^k runs at a smaller blocksize each with p = 2^-k. They are
        indistinguishable in the observable, have identical expected cost by construction, and have
        COMPLETELY DIFFERENT memory footprints - (b)'s peak memory is that of the smaller
        blocksize, i.e. 2^(0.2075 (beta* - Delta)) rather than 2^(0.2075 beta*). That is a second,
        sharper consequence: the probabilistic attacker is also a LOWER-MEMORY attacker, so the
        collision sits on opposite sides of exactly the conclusion this lane cares about. The
        separating condition is to record the pair (blocksize, success probability) with every
        cost, which is this record's deliverable.
    constructive_transforms:
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from "one run at beta*" to "the family of (beta, retry
          count) schedules with a cheap checker", and prove a STRICT inward improvement - that the
          optimum is interior - rather than mere feasibility. Strictness is exactly what
          s(beta) < a_eff on a nonempty window certifies.
        predicted_gain: >-
          G bits at c = 0, and G(a_eff_charged) - G(0.292) bits of give-back per charge exponent,
          both measured. Compared in the same units against the red team's committed +0.461 /
          +0.441 / +0.353.
      - transform: telescoping_potential
        proposed_object: >-
          Charge the whole retry schedule to a single budget by summing per-increment differences
          a_eff - s(beta) across the blocksize axis, so the optimum is read off a cumulative sum
          rather than fitted. This is the internal falsifier named in the propagation field.
        predicted_gain: >-
          Removes the need to fit a curve at all - the optimum is the crossing point of a measured
          difference sequence, which is robust to the shape of p.
    quantifier_order: >-
      FOR EACH charge exponent c in {0, 1/6, 1/3, 1/2, 1} and FOR EACH parameter set, THERE EXISTS
      a blocksize beta_opt(c) minimising a_eff(c) * beta - log2 p(beta), with G(c) >= 0 and G
      non-decreasing in c. THE DISCRIMINATING CLAIM, which can fail: THERE EXISTS a reachable
      dimension at which the measured window {beta : s(beta) < 0.292} is nonempty AND its width as
      a fraction of beta does not decrease across at least four dimensions. NOT claimed: anything
      uniform over dimensions, anything at FIPS 203 dimensions, anything about attacks other than
      the primal one measured, and no witness is allowed to depend on the seed - the plateau must
      appear in the ensemble, not in a lucky instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At dimensions n in [40, 70], with the stated instance family and reduction, the measured
        log-success slope falls below a_eff over a window of width w(n), and the implied
        probabilistic discount at charge exponent c is G(c) bits, with give-back
        G(c) - G(0) bits." Nothing about FIPS 203 dimensions, nothing about security, and nothing
        about attack families not measured.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is an instance family with a genuinely
        sharp threshold - a planted vector so short that recovery is deterministic above a
        blocksize and impossible below it. The method must report G = 0 there. If it reports a
        positive discount on a deterministic family, the discount is an artifact of the fitting or
        of the censoring and not a property of the success curve.
    proof_obligations:
      - claim: The step-function slice reproduces the committed cost figures digit for digit.
        responsibility: baseline
      - claim: G >= 0 and G is non-decreasing in a_eff in every computed cell.
        responsibility: correctness
      - claim: The deterministic nearby object returns G = 0.
        responsibility: strictness
      - claim: Trials at fixed beta are shown approximately independent (NULL-R and measured correlation).
        responsibility: feasibility
      - claim: The telescoping sum of per-increment differences reproduces the fitted optimum.
        responsibility: correctness
      - claim: The measurable p floor is reported, and no plateau is claimed below it.
        responsibility: scope
      - claim: No figure measured at n <= 70 is presented as a statement about FIPS 203.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        width of the window {beta below beta* such that s(beta) < 0.292}, expressed as a fraction
        of beta, measured at four or more dimensions
      direction: higher
      minimum_effect: >-
        A fraction of at least 0.02 that does not decrease across the sampled dimensions is the
        exponent-verdict threshold. A fraction consistent with zero, or one shrinking like 1/beta,
        is the additive-constant verdict and the record reports itself as a building block.
    - metric: >-
        probabilistic discount G at charge exponent c = 0, in bits, at the measured dimensions
      direction: higher
      minimum_effect: >-
        1 bit. Below 0.1 bits the p = 1 convention is validated at those dimensions and Explanation
        A stands.
    - metric: >-
        give-back G(c = 1/3) - G(c = 0), in bits - the interaction this record exists to measure
      direction: higher
      minimum_effect: >-
        0.353 bits, the smallest of the three figures the red team recovered on the beta/eta/d axes
        at the same charge exponent, chosen so the two re-optimisations are compared at a common
        scale. Direction is FORCED and carries no information; only the magnitude does.
    - metric: >-
        peak sieve memory at the optimised operating point, relative to peak memory at beta*
      direction: lower
      minimum_effect: >-
        A factor 2^(0.2075 * Delta) where Delta is the measured blocksize shift; any reduction at
        all sharpens the observation collision, because it means the probabilistic attacker is also
        a lower-memory attacker and is charged less by every memory-priced metric in this lane.
  minimal_test:
    design: >-
      Stage 1 alone, using the published simulator's p(beta) if Stage 0 obtains it, is the minimal
      discriminator - compute G at the five charge exponents and report the give-back. No lattice
      computation. If the simulator cannot be obtained, the minimal test becomes Stage 2 restricted
      to one dimension (n = 48) with K = 200 randomised trials on 40 instances across an
      eight-point blocksize grid, sufficient to bracket the crossing s(beta) = a_eff for the two
      extreme charge exponents.
    controls:
      - NULL-N, no-secret null - p must be identically zero.
      - NULL-F, forced-success null - p must be 1 and the optimum at the smallest beta.
      - NULL-R, no-re-randomisation null - trials must be perfectly correlated within an instance.
      - NULL-C, cost-slope null - c = 0 reproduces the free-memory optimum; huge a_eff drives the optimum to the grid edge.
      - The deterministic-threshold nearby object, which must return G = 0.
      - The step-function baseline slice, which must reproduce the committed figures exactly.
      - Per-instance versus ensemble decomposition with the churn statistic, before any plateau is interpreted.
    required_metrics:
      - success indicator per (instance, blocksize, trial), with seeds recorded
      - per-instance and ensemble p(beta), with intervals and the measurable p floor
      - fitted s(beta) with intervals, and the telescoped cumulative-difference check
      - beta_opt and G at each charge exponent, per dimension
      - window width in absolute blocksizes and as a fraction of beta, per dimension
      - peak memory at beta_opt relative to beta*
      - churn statistic and the trial-to-trial correlation
  falsification_conditions:
    - >-
      If s(beta) exceeds a_eff at every measurable beta below beta* and G is under 0.1 bits at
      every charge exponent and every measured dimension, the p = 1 convention is VALIDATED at
      those dimensions, the interaction claim is refuted, and the lane gains a closed axis. This is
      the outcome that would most improve this program's confidence in its own committed figures.
    - >-
      If the window width as a fraction of beta shrinks across the sampled dimensions, the effect is
      an additive constant and the record must report itself as a building block rather than an
      exponent result, per docs/target-result-profile.md.
    - >-
      If Stage 0 finds that the published simulator already evaluates the optimisation under a
      memory-charged cost slope, the record demotes to a re-evaluation at this program's charge
      exponents and says so.
    - >-
      If NULL-R shows trials are strongly correlated even under re-randomisation, the retry model
      is invalid, expected cost is not cost divided by p, and the whole framing fails - reported as
      a mechanism failure, not as a null result.
  confounders:
    - >-
      The low-beta end censors first, and it is exactly the end where the plateau would live. A
      measured window can therefore be truncated by the trial budget rather than by the
      mathematics, and the record must report the measurable p floor alongside every window width.
    - >-
      Progressive BKZ blurs the meaning of "blocksize" - a run that reaches beta has already done
      work at every smaller blocksize, so cost(beta) is not a pure exponential and a_eff is an
      effective slope, not a definition. The analysis must use the instrumented operation count of
      the actual schedule, not the idealised exponential, and report both.
    - >-
      Per-instance and ensemble success probabilities answer different questions and a plateau in
      one is not a plateau in the other. This is the confound IDEA-20260816-725f05 was built
      around, and its churn statistic is imported precisely to control it.
    - >-
      EV-MLKEM-020's own text carries both 0.292 and approximately 0.296 for the free-memory growth
      term in different places. A 0.004 difference in a_eff shifts the crossing point, and the
      record must evaluate both rather than pick one.
    - >-
      The re-randomisation itself costs something (a unimodular transform and a fresh LLL), and at
      small beta that cost is not negligible relative to the reduction. It must be charged inside
      cost(beta) or the discount is overstated.
  interpretation_limits:
    - >-
      Everything measured is measured at n in [40, 70]. The plateau-width trend is reported as a
      trend across four sampled dimensions with an interval, and is NOT extrapolated to the
      committed sieve dimensions. The exponent verdict, if it is reached, is a verdict about the
      sampled band and a hypothesis about anything larger.
    - >-
      A positive discount is a statement that the convention's cost is an upper bound on an
      idealised attacker's expected cost inside a cost model. It is not an executed attack and
      carries no claim tier above toy under docs/claims-and-verification.md.
    - >-
      The interaction's direction is forced by the algebra. Reporting the direction as a finding
      would be a forced-value error, and the record's deliverable is magnitudes and widths only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Independent randomised re-runs of the reduction on a fixed instance succeed independently
        with a common probability p(beta), so the expected cost of the retry schedule is
        cost(beta)/p(beta) and k trials fail with probability (1 - p(beta))^k.
      rigorous_support: >-
        The re-randomisation is an exact measure-preserving action on the basis (a random unimodular
        transform leaves the lattice unchanged), which rigorously makes the trials identically
        distributed; independence is the heuristic part, and it imitates the classical
        independent-trials model used for every randomised lattice-reduction retry argument. The
        failure mode being hunted is an instance-borne floor - a subset of instances no reduction
        ever solves - in which case p is not a per-instance constant and the retry model collapses
        for those instances.
      validation_plan: >-
        Sample: at n = 48 and three blocksizes straddling the crossing, K = 200 trials on each of
        40 instances, seeds recorded. Compare the observed per-instance success counts against the
        Binomial(K, p_i) prediction by a dispersion test, and compare the ensemble against the
        mixture that per-instance heterogeneity would produce. Tail check: the instance with the
        most successes and the instance with the fewest are checked against the extreme-order
        statistics of the fitted binomial mixture rather than against the mean. Transfer
        assumption, stated explicitly: independence measured at n = 48 is assumed at the other
        sampled dimensions and is re-checked at the largest one; it is not assumed at FIPS 203
        dimensions and no claim there depends on it.
    - id: H2
      statement: >-
        The log-success slope s(beta) is non-increasing in beta over the measurable band, so the
        objective a_eff * beta - log2 p(beta) is convex and its unique minimiser is the crossing
        point s(beta) = a_eff.
      rigorous_support: >-
        Monotonicity of p in beta is rigorous (a larger blocksize dominates a smaller one for
        progressive schedules that pass through it), so p is non-decreasing; the non-increasing
        SLOPE is the heuristic, and it imitates the classical saturating-success-curve shape
        assumed in every threshold phenomenon of this kind. If s is not monotone, the objective may
        have several local minima and the optimum must be found by exhaustive evaluation over the
        grid rather than by root-finding - which is the fallback the implementation must carry.
      validation_plan: >-
        Sample: estimate s on the full blocksize grid at each dimension from the measured p, with
        intervals, and test monotonicity directly by an isotonic fit and its residual. Compare the
        measured curve's shape against the published simulator's predicted curve where Stage 0
        obtains it - a shape agreement is external calibration, a disagreement is a reportable
        finding about either the simulator or the harness and must be resolved before any G is
        quoted. Tail check: the largest and smallest measured slopes must be consistent with the
        forced endpoints, s -> 0 above beta* and s bounded by the grid's censoring floor below.
  target_complexity:
    time_exponent: >-
      Conditional and stated as a slope, not a constant. Under the convention the attack cost is
      2^(a_eff * beta) with a_eff = 0.292 free-memory and 0.292 + 0.2075 c under charge exponent c.
      Under the probabilistic optimum it is 2^(a_eff * beta - G), with G measured. IF and ONLY IF
      the window in which s < a_eff has width proportional to beta, with fraction theta and plateau
      value s0, the effective exponent becomes a_eff - (a_eff - s0) theta - a genuine exponent
      movement. If the window width is O(1), G is an additive constant of a few bits and this is
      explicitly a BUILDING BLOCK, not an exponent result, and it is prioritised as such.
    memory_exponent: >-
      Strictly improved at the probabilistic optimum, by construction - peak sieve memory is
      2^(0.2075 * beta_opt) with beta_opt <= beta*, so the memory exponent falls by
      0.2075 * (beta* - beta_opt) bits. This is the one axis on which the record's outcome is
      forced to be non-adverse, and it is why the memory-charge interaction is signed.
    best_known: >-
      MODEL-RELATIVE, AND DOUBLY SO. The comparison baseline is EV-MLKEM-020's primal_bdd under
      RC.MATZOV at 140.1994731076207 / 200.9587149140538 / 270.7236234535225 log2 rop. That is a
      cost-model output evaluated at p = 1, not a run and not a measurement; its authors do not
      record it as tight, and this program's own record marks several of its inputs unvalidated
      (H4, H5, H8, H9, H11). "Dominated by 140.199 bits" therefore means "dominated inside
      RC.MATZOV at the p = 1 convention", which is not domination in fact.
    hidden_overhead: >-
      The re-randomisation cost per trial, the failure-check cost per trial, and the fact that
      progressive schedules amortise across blocksizes so that cost(beta) is not a clean
      exponential. All three are charged explicitly in the instrumented operation count rather than
      hidden in an o(1).
    tradeoff_note: >-
      This IS a time-memory tradeoff, and an unusual one - the probabilistic attacker trades
      expected time (up by the retry factor 1/p) against peak memory (down by
      2^(0.2075 (beta* - beta_opt))), and under any cost measure that charges memory the trade is
      favourable, which is exactly the interaction claimed. Parallelisation position - the retries
      are embarrassingly parallel with no communication, which is strictly better than a single
      large sieve, so under a parallel-cost metric the probabilistic schedule gains a second time.
      Both effects push the same way and neither is modelled by the convention.
  dominated_by: >-
    EV-MLKEM-020's committed primal_bdd/RC.MATZOV figures dominate any cost this record could
    produce UNLESS the measured G is positive, and that domination is MODEL-RELATIVE - it holds
    inside RC.MATZOV at the p = 1 convention, which is the very convention under test, so it is not
    domination in fact. Pareto check performed across all three axes against every row this program
    holds: EV-MLKEM-020's eighteen attack cells (two cost models x three attacks x three parameter
    sets), EV-MLKEM-015's pinned-estimator figures, and the external points in the corpus
    (KN-LIT-110 MATZOV, KN-LIT-122 AGPS20). On the MEMORY axis this record's operating point is
    strictly better than every one of those rows by construction, and on the data/query axis all
    rows are identical (one public key). The one row that could dominate it outright is
    Postlethwaite-Virdia's own re-estimate of the lattice KEM finalists, whose numbers were NOT
    fetched this session; Stage 0 must obtain them, and until it does this field is honestly
    incomplete rather than null.
  sota_delta: >-
    Stated as a range with its two branches, not as a word. Branch A - G under 0.1 bits at every
    charge exponent, sota_delta exactly 0, and the value delivered is a validated convention.
    Branch B - G of at least 1 bit at c = 0, growing by at least 0.353 bits (the red team's
    smallest committed beta/eta/d recovery at c = 1/3) when memory is charged, against a smallest
    committed margin of 1.276377 bits at ML-KEM-1024. The quantity is measured at n in [40, 70] and
    NOT transferred; the transfer is the plateau-width trend and it is reported as a trend with an
    interval.
