idea:
  id: IDEA-20260829-247e35
  question_id: RQ-MLKEM-003
  added: '2026-08-29'
  title: >-
    Core-SVP prices the attack at the blocksize where success is treated as CERTAIN, so the
    convention asserts that the success probability is a step function - a modelled claim, never
    measured here. Track the pair of SLOPES (cost per unit blocksize, log-success per unit
    blocksize) as the object, and test the interaction nobody has priced - that charging memory
    STEEPENS the cost slope, which moves the attacker's optimum to LOWER blocksize and lower
    success probability, giving back part of the very margin that charging memory restores
  class: mechanism
  claim: >-
    (A) THE CONVENTION AND WHAT IT ASSERTS. Every cost this lane has committed prices one attack
    at one blocksize and treats it as succeeding. Written honestly, an attacker who can cheaply
    DETECT failure - and can, since a candidate secret is checkable against the LWE equations in
    linear time, which is exactly the certificate discipline of docs/claims-and-verification.md -
    pays min over beta of cost(beta) / p(beta), where p(beta) is the probability that one
    randomised reduction at blocksize beta recovers the secret. The convention is the special case
    p(beta) = 1 for beta >= beta* and 0 below, i.e. an infinitely steep success curve. That is a
    MODEL of the success curve, and this program has never measured one for the primal attack.
    (B) THE OBJECT AND THE ARITHMETIC THAT MAKES IT DECISION-RELEVANT. Write
    log2 cost(beta) = a_eff * beta + O(log), and s(beta) = d log2 p(beta) / d beta >= 0, the
    log-success slope. The attacker's optimum sits where s(beta) = a_eff, and the PROBABILISTIC
    DISCOUNT relative to the convention is
    G(a_eff) = a_eff * beta* - min_beta [ a_eff * beta - log2 p(beta) ] >= 0.
    Under the free-memory convention a_eff = 0.292. Under EV-MLKEM-020's own charge family
    T * M^c with sieve memory 2^(0.2075 * beta), a_eff = 0.292 + 0.2075 c, which is 0.3612 at
    c = 1/3, 0.39575 at c = 1/2 and 0.4995 at c = 1. Because s is decreasing in beta (success
    saturates), a LARGER a_eff meets s at a SMALLER beta, so G is non-decreasing in a_eff. THE
    INTERACTION CLAIM IS THEREFORE SIGNED IN ADVANCE AND ITS MAGNITUDE IS THE OPEN QUESTION:
    charging memory makes probabilistic low-blocksize attacks strictly more attractive, so part of
    the margin that charging memory restores is given back on an axis the charge does not model.
    (C) WHY THIS IS NOT COVERED BY THE RE-OPTIMISATION ALREADY DONE. EV-MLKEM-020's H10 reads
    "The attack is held fixed; no memory-aware re-optimisation", and its validation_status records
    that the red team re-optimised beta, eta and d inside RC.MATZOV in 26 seconds and recovered
    +0.461 / +0.441 / +0.353 bits at c = 1/3. Those three parameters are all evaluated AT p = 1.
    The success probability is a fourth axis and it was not re-optimised, because the instrument
    has no slot for it. The recovered figures also fix the scale of what matters here: an effect of
    a third of a bit is already the size of the corrections this lane argues about, against a
    smallest committed margin of 1.276377 bits.
    (D) THE EXPONENT QUESTION, STATED AS AN EXPONENT QUESTION. If s(beta) merely dips below a_eff
    in an O(1)-wide window below beta*, G is an additive constant of a few bits and this is a
    building block, not an exponent result - and the record says so. If instead s(beta) has a
    PLATEAU at a value s0 < a_eff over a window proportional to beta, of width theta * beta, then
    the effective cost exponent is a_eff - (a_eff - s0) theta, a genuine exponent movement. The
    measurable object that decides between "additive constant" and "exponent" is the WIDTH OF THE
    PLATEAU AS A FRACTION OF beta, measured across dimensions, and that is the primary metric of
    this record.
    (E) EXPLANATIONS DISCRIMINATED. EXPLANATION A, STEP FUNCTION - s(beta) exceeds a_eff at every
    reachable beta below beta*, the optimum sits at p close to 1, G is under 0.1 bits at every
    charge exponent, and the p = 1 convention is VALIDATED with a number, closing an axis the whole
    lane has assumed. EXPLANATION B, SOFT THRESHOLD - s(beta) falls below a_eff over a window whose
    width does not shrink relative to beta, G is at least 1 bit at c = 0 and strictly larger at
    c = 1/3, and every committed figure in this lane is an upper bound on the attacker's cost by an
    amount that GROWS as memory is charged.
    (F) NOT CLAIMED. No new attack, no break, no claim about FIPS 203 dimensions from measurements
    taken at n in [40, 70], and no claim that any published estimate ignores success probability -
    published work explicitly does not (see the citations), which is precisely why this record's
    contribution is the INTERACTION with the memory charge and not the existence of the effect.
  mechanism: >-
    STAGE 0, READING. Retrieve and read Postlethwaite-Virdia (ePrint 2020/1308, PKC 2021) and, if
    reachable, Dachman-Soled et al. (Crypto 2020) and Albrecht et al. (Asiacrypt 2017), and record
    exactly what each already establishes about p(beta) for the primal attack, and in particular
    whether any of them evaluates min_beta cost(beta)/p(beta) under a MEMORY-CHARGED cost slope
    rather than under core-SVP. If one does, this record demotes to a literature note plus a
    re-evaluation at this program's committed charge exponents, which is still worth having and is
    cheap. The published simulator at github.com/fvirdia/usvp-simulation is the external
    calibration target for Stage 2 and its availability is checked here, not assumed.
    STAGE 1, THE ZERO-COMPUTE ARM. Using ONLY the published simulator's predicted p(beta) (if
    Stage 0 obtains it) or a parametric family with a declared shape, compute G(a_eff) at
    a_eff in {0.292, 0.3612, 0.39575, 0.4995} at the committed effective sieve dimensions, and
    report the give-back G(a_eff_charged) - G(0.292) in bits per parameter set. This produces the
    interaction number without running a single reduction, and it is the minimal discriminator.
    STAGE 2, THE MEASURED SUCCESS CURVE. At n in [40, 70] with ML-KEM's q-ary shape and secret law,
    generate instances with retained ground truth. For each instance and each beta on a grid, run K
    independent RANDOMISED reductions (fresh random unimodular re-randomisation per trial, seeds
    recorded) followed by Babai lifting, and record a success bit per trial. This yields
    p_i(beta), a per-instance success probability over reduction randomness, and its ensemble mean.
    Fit s(beta) per instance and for the ensemble, with intervals.
    STAGE 3, THE DECOMPOSITION THAT DECIDES WHAT p MEANS. The attacker retries the SAME instance,
    so the operative probability is the per-instance one; a plateau in the ensemble mean can also
    arise from a fixed easy subset. Report the per-instance success matrix and the churn statistic
    - among trials succeeding at the largest beta, the fraction of instances that also succeed at
    smaller beta - and state which of the two objects every downstream number uses.
    STAGE 4, THE PLATEAU WIDTH. Across at least four dimensions, measure the width of the window in
    which s(beta) < a_eff, as an absolute number of blocksizes and as a fraction of beta. Report
    the trend in the fraction. A fraction shrinking with n is the additive-constant verdict; a flat
    or growing fraction is the exponent verdict, reported with its interval and no extrapolation.
    STAGE 5, THE COST-SLOPE SWEEP. Recompute G at each charge exponent c using the MEASURED s(beta)
    rather than a parametric family, and report the give-back table alongside the +0.461 / +0.441 /
    +0.353 bits the red team recovered on the beta/eta/d axes, so the two re-optimisations are
    compared in the same units.
  novelty_status: unverified
  novelty_screen:
    method: >-
      Read this session: RQ-MLKEM-003 in full; the 28-title inventory for this RQ;
      IDEA-20260816-725f05 in substantial part (the nearest neighbour, a success-curve design);
      IDEA-20260816-08eda1 (head); IDEA-20260816-bd7f26 (head); IDEA-20260821-472aa2 (lines
      1-681); IDEA-20260828-5b7795; EV-MLKEM-020 lines 388-467 and 595-634, including H10's
      validation_status verbatim.
      Greps: `question_id: RQ-MLKEM-003` over ledger/proposals (28 files); `success
      probability|Postlethwaite|Virdia|randomiz` over knowledge/ (40+ files, none opened - a
      declared gap in this screen).
      Web this session: WebSearch on Postlethwaite-Virdia; WebFetch of
      https://eprint.iacr.org/2020/1308 returning the verbatim abstract. The crypto-kb MCP index
      was not queried.
    results: >-
      IDEA-20260816-725f05 is the closest record in the lane and is genuinely adjacent - it tracks
      P(success | N) for a DUAL distinguisher as the dual-vector budget N grows, hunting a
      waterfall floor, and it contributes the per-instance indicator matrix and the churn statistic
      that this record adopts by name. It differs in attack family (dual versus primal), in the
      independent variable (retained-vector count versus blocksize), in the derived quantity (an
      asymptote versus a SLOPE compared against a cost slope), and above all in that it draws no
      connection to a cost model at all, whereas this record's entire claim is an interaction
      between the success slope and the memory-charged cost slope. Adopting its controls and
      crediting them is the correct relationship; merging the two would lose both.
      No other record in the lane treats success probability as an optimisable attack parameter.
      EV-MLKEM-020's H10 names the re-optimisation gap and the red team closed three axes of it
      (beta, eta, d) at p = 1, leaving this axis open by construction.
      EXTERNALLY the effect is NOT new: the fetched abstract of ePrint 2020/1308 states that its
      technique explains earlier experiments "where attacks succeeded with smaller than expected
      block sizes" and that the authors "use our simulators to reestimate the cost of attacking
      the three lattice KEM finalists". So a success-probability-aware re-estimate of Kyber exists
      in the literature. What this record adds, and what its novelty claim is confined to, is the
      evaluation of that optimisation under a MEMORY-CHARGED cost slope and the plateau-width
      measurement that separates an additive discount from an exponent movement.
    verdict: >-
      UNVERIFIED. Only the abstract of the nearest external work was fetched; its body, its
      simulator's predictions and its cost model were not read, and it is entirely possible that it
      already answers Stage 1. That would be a good outcome and the record is designed for it.
      Claimed new RELATIVE TO THIS REPOSITORY: the two-slope object, the memory-charge interaction
      with its signed direction, the plateau-width-as-a-fraction-of-beta metric, and the comparison
      of the probability-axis give-back against the red team's committed beta/eta/d recovery in the
      same units. Assembled from known parts: randomised-reduction retrying is standard, the churn
      statistic is IDEA-20260816-725f05's, and the charge family is EV-MLKEM-020's.
  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: dual-attack score geometry (IDEA-20260805-5a4409,
      -a102ec, -bb7668, IDEA-20260808-0eb075, IDEA-20260816-ba5bd8, -725f05), sieve cost constants
      (IDEA-20260807-8fbc86, IDEA-20260805-fc6361, -f7c912), the module-structure discount
      (IDEA-20260816-b824af, -f4ce0b, -fdc8e8, -bd7f26), memory PRICING of the sieve
      (IDEA-20260816-70e41d, -7bc28c, IDEA-20260821-46c09f) and the quantum resource triple
      (IDEA-20260821-472aa2). This record uses the memory charge only as a KNOWN INPUT that moves a
      slope; it prices no memory itself.
    tracked_object: >-
      The ordered pair of slopes (a_eff, s(beta)) - cost bits per unit blocksize and log-success
      bits per unit blocksize - carried together across the blocksize axis, plus the per-instance
      success indicator matrix from which s is estimated. Two numbers per blocksize, one bit per
      (instance, trial, blocksize).
    lossiness: >-
      LOSSY, and severely. The underlying state is every reduced basis produced by every randomised
      trial - the full Gram-Schmidt profile, the entire trajectory of the reduction, the realised
      error vector. The projection retains one bit per trial and, from the bits, one slope per
      blocksize. It discards the profile entirely, so two trials that failed by wildly different
      margins are the same object.
      NOT A CHANGE OF COORDINATES: the map from (basis trajectory) to (success bit) is massively
      many-to-one, and two instances with identical success curves can have completely different
      profiles - which is exactly why the record also retains the margin as a secondary metric,
      since the primary object cannot see it.
      THE COMPATIBILITY CONDITION: the operation being modelled is "retry and check", and its
      cost is by construction a function of the success bit alone - expected cost = cost per trial
      divided by success probability, with the check being cheap and certain. So the discarded
      structure is discarded compatibly with the operation, and the retained bits propagate
      deterministically under repetition (independent trials multiply failure probabilities). A
      projection retaining the whole profile would be more faithful and no more predictive of
      retry cost.
    propagation: >-
      One step is one increment of beta. Under it, cost gains a_eff bits and log-success gains
      s(beta) bits, so the objective a_eff * beta - log2 p(beta) changes by exactly
      a_eff - s(beta). The object's propagation law is that single subtraction, which is why the
      whole record reduces to comparing two slopes, and why raising a_eff by charging memory
      necessarily moves the optimum toward smaller beta. The cheap internal falsifier: summing the
      increments from the smallest measured beta to beta* must reproduce the measured
      log2 p(beta*) - log2 p(beta_min) to within the fit's interval; if it does not, s was fitted
      on a non-differentiable curve and no optimum is reportable.
    survival_score: >-
      Survives while exact recovery is reachable and trials are affordable - n roughly 40 to 70,
      with K trials per (instance, beta) cell and a blocksize grid wide enough to straddle beta*.
      It dissolves upward when p becomes too small to estimate with K trials (the low-beta end
      censors first, which is exactly the end the plateau lives at, and that is the design's
      binding constraint, stated here rather than discovered later) and downward when beta is so
      small that reduction quality rather than luck determines the outcome. The honest boundary is
      that a plateau below the measurable p floor is invisible, and the record reports the floor.
  null_object_control: >-
    NULL-N, THE NO-SECRET NULL. Run the identical pipeline on instances whose secret is resampled
    after b is fixed, so no recovery is possible. p must be identically zero at every beta and
    every trial. If any success is recorded, the recovery detector fires without a planted secret
    and every curve is an artifact.
    NULL-F, THE FORCED-SUCCESS NULL. Instances with a planted vector short enough that LLL alone
    provably recovers it. p must be 1 at every beta and s must be 0, so the fitted optimum must sit
    at the smallest beta on the grid. If the optimiser returns anything else, the objective is
    mis-implemented.
    NULL-R, THE RE-RANDOMISATION NULL. Repeat trials at fixed beta WITHOUT re-randomising the
    basis. Successes must then be perfectly correlated within an instance (all trials agree), which
    checks that the randomisation is the source of trial-to-trial variation and that the retry
    model is legitimate rather than an artifact of nondeterministic floating point.
    NULL-C, THE COST-SLOPE NULL. Setting c = 0 must reproduce the free-memory optimum exactly, and
    setting a_eff to a very large value must drive the optimum to the smallest beta on the grid.
    Both are forced and are checked before any signal number is read.
    FORCED VALUES DECLARED IN ADVANCE, so they are not reported as findings. (1) G >= 0 always -
    an optimisation over a superset cannot cost more. (2) G is non-decreasing in a_eff - so the
    DIRECTION of the memory-charge interaction is forced and only its magnitude carries
    information. (3) At a_eff exceeding max_beta s(beta), the optimum is at the grid's left edge and
    the measurement is censored rather than informative. Only magnitudes and the plateau width are
    open.
  discriminated_from:
    - >-
      IDEA-20260816-725f05 measures a DUAL distinguisher's success against the retained-vector
      budget N and hunts a plateau below one. This record measures a PRIMAL attack's success
      against blocksize and hunts a SLOPE, then compares that slope against a cost slope from a
      charge model. Different attack family, different independent variable, different derived
      quantity, and 725f05 connects to no cost model. This record adopts 725f05's per-instance
      indicator matrix and churn statistic by name and credits them.
    - >-
      EV-MLKEM-020's H10 re-optimisation, run by the red team, moved beta, eta and d inside
      RC.MATZOV at p = 1 and recovered +0.461 / +0.441 / +0.353 bits at c = 1/3. The success
      probability is a fourth axis with no slot in the instrument. The two are additive in
      principle and the record reports them side by side rather than combining them.
    - >-
      IDEA-20260816-08eda1 measures the estimator's signed residual against completed runs at a
      pinned version. That is a calibration of the instrument's LEVEL at p = 1; this measures a
      quantity the instrument does not represent at all.
    - >-
      IDEA-20260816-70e41d locates an enumeration/sieving crossover as a curve over a memory price.
      That varies which ALGORITHM wins as memory is priced; this varies which OPERATING POINT of
      one algorithm wins. Both use a memory price as an input and neither computes the other's
      quantity.
  citations:
    - ref: >-
        Eamonn W. Postlethwaite and Fernando Virdia, "On the Success Probability of Solving Unique
        SVP via BKZ", ePrint 2020/1308, PKC 2021; code at github.com/fvirdia/usvp-simulation
      provenance: retrieved
      claim: >-
        Verbatim from the fetched abstract - "The primal attack reduces key recovery against such
        schemes to instances of the unique Shortest Vector Problem (uSVP). Dachman-Soled et al.
        (Crypto 2020) recently proposed a new approach for fine-grained estimation of the cost of
        the primal attack when using Progressive BKZ for lattice reduction. In this paper we review
        and extend their technique to BKZ 2.0 and provide extensive experimental evidence of its
        accuracy. Using this technique we also explain results from previous primal attack
        experiments by Albrecht et al. (Asiacrypt 2017) where attacks succeeded with smaller than
        expected block sizes. Finally, we use our simulators to reestimate the cost of attacking
        the three lattice KEM finalists of the NIST Post Quantum Standardisation Process."
        LIMIT ON THIS CITATION - only the abstract was fetched. Whether the paper evaluates
        min_beta cost(beta)/p(beta) under a memory-charged cost slope, and whether it reports a
        plateau width, is NOT established by this citation and is Stage 0's first job.
      verified_by: 'WebFetch of https://eprint.iacr.org/2020/1308, idea-generator, 2026-08-29'
    - ref: >-
        Dachman-Soled, Ducas, Gong, Rossi (Crypto 2020) fine-grained primal-attack estimation;
        Albrecht, Gopfert, Virdia, Wunderer (Asiacrypt 2017) primal attack experiments
      provenance: recalled
      claim: >-
        Named inside the fetched 2020/1308 abstract as, respectively, the source of the
