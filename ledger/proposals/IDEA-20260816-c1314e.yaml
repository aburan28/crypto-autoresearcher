idea:
  id: IDEA-20260816-c1314e
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: 'Turn the ALPF lane''s implicit toy-to-medium transfer hope into a pre-registered numeric
    prediction: fit the survivor''s degree and cost curve on 13, 15 and 17 bit instances, freeze a
    written prediction for 21 and 25 bit instances before running them, then run them and report the
    signed residual.'
  class: measurement
  claim: '(A) Every ALPF conclusion is stated at toy scale and every use of it presumes, silently,
    that the behaviour observed at 13 to 17 bits is the behaviour that would continue. EXP-ALPF-010''s
    own analysis carries the flag ''extrapolate size trend before any claim'', and its committed table
    shows the crossbred-to-rho field-op ratio falling from 8.02 at 13 bits to 4.06 at 15 bits to 2.01
    at 17 bits at |FB|=3 -- a trend that is either a real scaling law or an artifact of the cost proxy,
    and the archive does not say which. (B) The claim is that this is testable as a pre-registration:
    fit whatever law the three archived sizes support, write the predicted values for two larger sizes
    into a frozen file BEFORE computing them, then compute them and report the signed residual and
    its confidence interval. The deliverable is the residual, not the extrapolation. (C) The claim
    is further that the two quantities transfer differently: the algebraic quantity d_ff and D_reg_pred
    are predicted to be scale-INVARIANT in the field size at fixed |FB| and fixed representation,
    because they depend on the degree profile and not on p, whereas the cost ratio is predicted to
    move, because the rho baseline grows like sqrt(p) while the algebraic cost does not depend on
    p at all. If both move, or neither, the underlying cost model is mis-specified. (D) NOT CLAIMED:
    that any method beats any other at any scale; that a favourable residual licenses extrapolation
    to cryptographic scale; that the crossbred approach is or is not a survivor. A pre-registered
    residual measured across 13-to-25 bits is a statement about a 12-bit interval and nothing more,
    and the explicit purpose of measuring it is to stop the lane from importing an unmeasured transfer
    assumption into its downstream reasoning.'
  mechanism: 'STAGE 1: extract the archived three-size table from experiments/EXP-ALPF-010/analysis.md
    verbatim into a frozen fixture -- the |FB|, D_reg, d_ff, crossbred field-ops, F4 ops and rho ops
    columns at 13, 15 and 17 bits. STAGE 2: fit two candidate laws per quantity: constant-in-p, and
    log-linear in p. Record both fits with their residuals on the three archived points. STAGE 3:
    WRITE the predicted values at 21 and 25 bits, for both laws, into a file that is committed and
    hashed before any new computation runs. This is the pre-registration and it is the load-bearing
    step. STAGE 4: generate fresh toy instances at 21 and 25 bits with harness/toycurve.py, build
    the same representations at the same |FB| values, and measure d_ff, D_reg_pred, and the field-op
    counts using the same cost accounting the archive used (8 field multiplications per group operation
    for rho; a stated matrix-dimension exponent for the algebraic side, with the exponent varied as
    a control). STAGE 5: report signed residual = observed minus predicted for each quantity and each
    law, with the fitted law identified by which residual is smaller. STAGE 6: report which of the
    two predicted transfer behaviours in claim (C) held. Refutation: if the algebraic quantities move
    with p at fixed profile, claim (C) is falsified and the degree profile is not the whole story,
    which is itself a strong redirection.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'toy-to-medium|toy_to_medium|transfer' ledger/proposals/ ; grep -ril 'crossbred'
      ledger/proposals/ ; grep -ril 'ALPF' ledger/proposals/ ; read experiments/EXP-ALPF-010/analysis.md
      cost table in full, experiments/EXP-ALPF-011/analysis.md, ledger/evidence/EV-ALPF-001.yaml observations
      for EXP-ALPF-010, ledger/questions/RQ-ALPF-001.yaml scope block, ledger/questions/RQ-INSTR-f8faa0.yaml
      title.
    results: 'Zero proposals reference ALPF. ''transfer'' matches IDEA-20260815-528b6e (RQ-ECDLP-002,
      rigidity theorem for objects on pairs), IDEA-20260815-143d6e (RQ-ECDLP-002, pricing deferred
      tier-ladder lanes), IDEA-20260815-ad4b55 (DREG lane), IDEA-20260806-c5d183 (RQ-ECDLP-002, translation-action
      orbit argument) and IDEA-20260811-565915 (RQ-VOLC-f6253b) -- none pre-registers a numeric two-scale
      prediction for an ALPF survivor. ''crossbred'' matches IDEA-20260808-51e40f (RQ-MQOM-001, Weil
      descent and the polynomial method), IDEA-20260805-69af7c, IDEA-20260808-fc5e3e, IDEA-20260805-7abf04,
      IDEA-20260805-be7738, IDEA-20260807-b63f08, IDEA-20260808-da1428 and IDEA-20260731-005; these
      are crossbred/XL algorithm proposals in other lanes and none reads the archived ALPF crossbred-vs-rho
      table or predicts its continuation. The nearest committed statement is inside EXP-ALPF-010 itself:
      ''FLAG: extrapolate size trend before any claim'' -- an instruction the archive issued and no
      record has executed.'
    verdict: 'UNVERIFIED. No external-literature claim is asserted. Assembled from known parts: pre-registration
      (already the program''s prereg_quantity/prereg_formula contract in templates/research-records.md),
      the archived three-size cost table, and inventor-protocol section 6 step 2, which says to run
      the pipeline on a scaled-down instance and check the predicted ratio as a MEASURED ratio rather
      than an extrapolation. Claimed new relative to this repository: (i) executing the extrapolation
      flag the archive itself raised in EXP-ALPF-010, with the prediction frozen and hashed before
      the confirming computation; (ii) the split prediction in claim (C) that algebraic quantities
      are p-invariant at fixed profile while the cost RATIO is not, which makes a single run able
      to falsify the cost model rather than merely extend the table.'
  object_first_candidate:
    tracked_object: The size-indexed measurement pair (algebraic quantity, cost ratio) for one fixed
      representation at one fixed |FB|, followed as the field size parameter increases -- that is,
      the trajectory of a cell through the size axis rather than the cell itself.
    lossiness: 'Genuinely lossy. The trajectory retains, per size, only two numbers -- an algebraic
      degree and a cost ratio -- discarding the curve, the coefficients, the factor base contents,
      the Macaulay matrix, the target point, and every intermediate. It is compatible with the operation
      of interest (increasing p) because both retained numbers are defined identically at every size
      and the operation acts on the index alone. It is non-injective by a wide margin: every curve
      of a given bit size with the same representation and |FB| projects to the same trajectory point
      if the algebraic quantities coincide, which is exactly the prediction being tested and the reason
      the projection is informative rather than a relabelling.'
    propagation: 'One step of the target operation is one increment of field bit size. Acting on the
      tracked object, it maps (d_ff, D_reg_pred, ratio) at size b to the same triple at size b + delta.
      Claim (C) states the predicted action precisely: the first two components are fixed points of
      this step at fixed profile and |FB|, while the third is multiplied by roughly 2^{-delta/2} because
      the rho baseline scales as sqrt(p) and the algebraic count does not depend on p. This gives
      a closed-form predicted step and makes the residual, not the value, the measured quantity.'
    survival_score: 'The trajectory is well defined as long as instances at that size can be built
      and metered, which for the pure-Python meter at |FB| in {3,4,5} runs comfortably to 25 bits
      and begins to strain around 29 to 31 bits where the Macaulay matrix at D_reg=12 becomes the
      binding cost. The structure dissolves in a second, more interesting way if claim (C) fails:
      if the algebraic components are not fixed points of the size step, the trajectory stops being
      a two-parameter object and the archived table''s columns are not comparable across rows, which
      would retroactively scope every ALPF cross-size statement.'
  null_object_control: 'Two nulls, both run in the same invocation. First, a null trajectory: random
    homogeneous systems matched to the same degree profile at each of 13, 15, 17, 21, 25 bits, metered
    identically -- these have no curve behind them, so any p-dependence they show is p-dependence
    of the instrument rather than of elliptic curves, and the signal arm''s p-dependence must exceed
    the null arm''s for claim (C) to mean anything. Second, a null cost ratio: the same cost accounting
    applied to a method with a KNOWN scaling, namely rho against rho with different seeds, whose ratio
    must come out flat at 1 within noise at every size; if that control drifts with size, the cost
    accounting is size-biased and no ratio in the archive or in this run is interpretable. For the
    measurement to mean anything the profile-matched null must show flat algebraic quantities and
    the rho-vs-rho control must show a flat unit ratio.'
  discriminated_from:
  - 'EXP-ALPF-010 itself measured three sizes and explicitly deferred the extrapolation (''FLAG: extrapolate
    size trend before any claim''). This proposal does not re-measure those three sizes for their
    own sake; it freezes a prediction from them and tests it at two new sizes, so the deliverable
    is a residual the archive does not contain.'
  - IDEA-20260815-143d6e prices deferred lanes across the tier ladder -- a portfolio-cost question.
    This measures one lane's scaling residual and makes no portfolio recommendation.
  - RQ-INSTR-f8faa0's 15-plus cost-model proposals concern machine variance and single-machine timing.
    This experiment reports FIELD-OPERATION COUNTS, which are machine-independent by construction,
    and treats the field-op conversion constants as a declared control variable rather than as the
    object; no wall-clock number is used in any primary metric.
  - The DREG ladder (IDEA-20260815-ad4b55, IDEA-20260815-b751cf) sweeps degree of regularity as m
    and the system grow. This holds m, |FB| and the representation fixed and varies only the field
    size, which the DREG ladder holds fixed.
  - IDEA-20260805-be7738 and the other crossbred proposals concern crossbred/XL as an algorithm. This
    proposal treats the archived crossbred numbers purely as a trajectory to be predicted and does
    not propose any algorithmic change.
  assumptions:
  - The cost columns in experiments/EXP-ALPF-010/analysis.md are field-operation counts computed as
    the analysis states (rho at 8 field multiplications per group operation; F4 ops as ncols(D_solve)
    raised to 2.37), and are reproducible from the same formulas.
  - Toy instances at 21 and 25 bits with prime-order subgroups can be generated by harness/toycurve.py
    within the budget.
  - The same representations (x-ring baseline, e-ring, power-sum) can be built at the new sizes with
    the same |FB| values, giving the same leading-form degree profiles.
  - Three archived points suffice to distinguish a constant law from a log-linear law well enough
    for the pre-registration to be non-vacuous; if they do not, the pre-registration records both
    laws and the residual identifies which.
  - The Macaulay meter reaches D_reg_pred = 12 at |FB| = 5 within the memory budget at 25 bits.
  predictions:
  - metric: signed residual of d_ff at 21 and 25 bits under the constant-in-p law
    direction: different
    minimum_effect: 0
  - metric: signed residual of D_reg_pred at 21 and 25 bits under the constant-in-p law
    direction: different
    minimum_effect: 0
  - metric: crossbred-to-rho field-op ratio at 21 bits relative to 17 bits
    direction: lower
    minimum_effect: 'forced: predicted factor 2^{-2} = 0.25 under the sqrt(p) rho scaling, so ratio
      at 21 bits predicted 0.50 from the archived 2.01 at 17 bits and |FB|=3'
  - metric: rho-vs-rho null cost ratio at every size
    direction: different
    minimum_effect: 'forced: must equal 1.0 within 10 percent at every size or the cost accounting
      is reported size-biased and no ratio is interpretable'
  - metric: p-dependence of algebraic quantities in the profile-matched null arm
    direction: different
    minimum_effect: 0
  minimal_test:
    design: 'Two sizes, one representation, one |FB|. Freeze the prediction for the x-ring baseline
      at |FB| = 3, whose archived row reads D_reg = 7, d_ff = 7 at all three of 13, 15, 17 bits with
      the ratio falling 8.02, 4.06, 2.01. The constant-in-p law predicts D_reg = 7 and d_ff = 7 at
      21 bits, and the sqrt(p) rho scaling predicts the ratio drops by 2^{-2} per 4 bits to about
      0.50. Generate 10 instances at 21 bits, meter them, count field ops with the archived formulas,
      and report the two residuals. In the same invocation run 10 profile-matched null systems at
      13 and 21 bits and one rho-vs-rho ratio control at each size. This is a few CPU-minutes and
      it discriminates sharply: a nonzero algebraic residual falsifies claim (C) immediately, and
      a ratio residual with the null controls flat isolates the cost model.'
    controls:
    - Profile-matched null systems at every size, metered identically, to separate instrument p-dependence
      from curve p-dependence.
    - Rho-vs-rho unit-ratio control at every size, to detect size bias in the field-op accounting.
    - 'Cost-exponent sensitivity arm: recompute every ratio with the algebraic matrix exponent set
      to 2.0, 2.37 and 3.0, reporting how far the residual moves, so the conclusion is not an artifact
      of one constant.'
    - 'Group-operation conversion sensitivity: recompute rho field ops at 6, 8 and 12 field multiplications
      per group operation.'
    - 'Archived-row reproduction: recompute the 13, 15 and 17 bit rows from the same formulas and
      require they match the committed table before any new size is run.'
    - 'Seed-block control: 5 seed blocks per new size.'
    required_metrics:
    - signed residual (observed minus pre-registered) per quantity per new size
    - d_ff and D_reg_pred per instance at every size
    - crossbred, F4 and rho field-operation counts per cell
    - cost ratio per cell under each of the three matrix exponents
    - archived-row reproduction indicator for the 13/15/17 bit rows
    - rho-vs-rho null ratio per size
    - profile-matched null algebraic quantities per size
    - hash of the pre-registration file and the commit that contains it
  falsification_conditions:
  - Algebraic quantities d_ff or D_reg_pred move with field size at fixed profile and fixed |FB|,
    falsifying claim (C) and scoping every cross-size ALPF comparison.
  - The archived 13/15/17 bit rows cannot be reproduced from the stated formulas, in which case no
    residual is reported at all.
  - The rho-vs-rho unit-ratio control drifts with size by more than 10 percent, indicating size-biased
    cost accounting.
  - The cost-ratio residual flips sign as the matrix exponent moves within 2.0 to 3.0, indicating
    the trend is an artifact of the proxy rather than a measured law.
  - Instances at 25 bits cannot be metered within the memory budget, in which case only the 21-bit
    residual is reported and the 25-bit prediction is left standing and unresolved rather than quietly
    dropped.
  - The profile-matched null arm shows the same p-dependence as the signal arm, making the signal
    arm a controlled null.
  confounders:
  - The field-op cost model uses conversion constants (8 multiplications per group operation, exponent
    2.37) that are modelling choices; the sensitivity arms bound but do not eliminate this.
  - Instances at 21 and 25 bits are freshly generated and may differ systematically from the archived
    'structured' curves in a way the archive does not document.
  - The archived table's 'structured' curve label is not defined in the imported analysis, so matching
    the curve family across sizes may be impossible and the comparison may cross curve families silently.
  - rho op counts at these toy sizes are small integers where rounding in the sqrt(n) estimate is
    a meaningful fraction of the value.
  - A pre-registration is only load-bearing if it is genuinely frozen; if the fit is revised after
    seeing the new sizes the experiment reduces to curve fitting.
  interpretation_limits:
  - A residual measured across 13 to 25 bits constrains a 12-bit interval; it licenses no statement
    about 256-bit curves and none is made.
  - A small residual does not validate the cost model, only its self-consistency across the tested
    interval under the tested constants.
  - No method is claimed faster or slower than any other at any size; the ratio is a tracked quantity,
    not a performance claim.
  - The 'structured' curve family of the archive may not be reproducible, in which case the residual
    mixes a family change with a size change and must be reported as such.
  target_complexity:
    time_exponent: No attack exponent is claimed. The archived ratio column is a ratio of two modelled
      field-operation counts, not a measured attack cost, and this experiment predicts and measures
      that ratio without asserting either count is achievable.
    memory_exponent: No attack memory exponent is claimed. The experiment's own peak memory is the
      Macaulay matrix at D_reg = 12 for |FB| = 5, which is the binding constraint at 25 bits.
    best_known: The incumbent is Pollard rho at roughly sqrt(n) group operations, which is exactly
      the denominator of the archived ratio column and is recomputed here at every size. The incumbent
      for the transfer question is the archived three-point table in EXP-ALPF-010 with its explicit
      deferral flag.
    hidden_overhead: 'The human cost is entirely in the freeze discipline: writing and committing
      the prediction before running, and resisting refitting afterwards. Lower-order term: reproducing
      the archived ''structured'' curve family may require reading the source scripts under experiments/EXP-ALPF-010/source/
      and may end in a documented failure to reproduce, which becomes part of the result.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed across time, memory and data/queries:
    this experiment yields no attack point on any frontier, and the ratio it predicts is a ratio between
    two modelled counts neither of which is offered as an achievable cost. Against the incumbent transfer
    evidence -- the three-point archived table -- this is strictly more informative (a frozen prediction
    plus two new points plus two null controls) at strictly greater compute, hence dominated on cost
    and dominating on information.'
  sota_delta: 'No attack; measurement contribution only. Quantitatively: the incumbent evidence for
    toy-to-medium transfer in this lane is three sizes spanning 4 bits with no prediction; this yields
    five sizes spanning 12 bits with a frozen prediction and a signed residual per quantity, plus
    a rho-vs-rho size-bias control the archive lacks. Zero change to any ECDLP time or memory exponent,
    and the archived ratio is neither improved nor claimed achievable.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the archived 13/15/17 rows reproduce from the stated formulas: 0.6
    -- the formulas are given in prose in the analysis header and the underlying scripts are archived,
    but ''structured'' curve provenance is undocumented. That claim (C)''s algebraic invariance holds
    (d_ff and D_reg_pred fixed in p at fixed profile and |FB|): 0.8, since both are functions of the
    degree profile by construction, with the residual risk that the profile itself changes with p
    through the factor-base construction. That the ratio follows the predicted 2^{-delta/2} law within
    a factor of 1.5: 0.5 -- plausible from the sqrt(p) rho scaling but the archived crossbred column
    is itself constant in p, which makes the prediction almost tautological and therefore weak evidence
    either way, and I flag that as the main scientific weakness of this entry. That the whole thing
    runs at 25 bits inside budget: 0.65.'
