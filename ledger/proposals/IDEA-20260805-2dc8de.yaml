idea:
  id: IDEA-20260805-2dc8de
  question_id: RQ-DREG-001
  added: '2026-08-05'
  title: >-
    The decision variable is unnormalised - RQ-DREG-001's departure criterion and
    every scale-free version of the same committed data point in opposite
    directions, and the raw deficit does not even grow monotonically
  class: control

  claim: >-
    RQ-DREG-001 declares departure when there is "a deficit that grows with n".
    Applied to the five committed D=5 cells of this goal, that criterion is
    simultaneously satisfied and violated, and every scale-free normalisation of
    the same numbers says the opposite of the raw one. The committed deficits are
    1,322 (n=12), 1,862 (n=15), 1,823 (n=17), 1,999 (n=18), 2,724 (n=21 seed 1).
    RAW: not monotone - it FALLS from 1,862 to 1,823 between n=15 and n=17.
    Normalised by the semi-regular reference sr_pred(n,5) it is
    0.04494, 0.02625, 0.01436, 0.01370, 0.01014 - strictly decreasing at every
    rung, a factor 4.4 fall. Normalised by the actual column count:
    0.02830, 0.01298, 0.00580, 0.00557, 0.00350 - strictly decreasing. Normalised
    by the semi-regular Hilbert coefficient h_5, which is the quantity the
    deficit is an excess OVER: 0.0781, 0.0236, 0.00873, 0.00821, 0.00453 - a
    factor 17 fall. All four normalisations agree with each other and disagree
    with the raw criterion. The proposal is to fix the decision variable BEFORE
    the goal's ladder produces its committed Coordinator decision, because the
    variable currently on the record can be made to say either thing on data that
    already exists. Second, related finding, also zero compute: every measurement
    in the goal sits at D = 5 or 6 while the semi-regular freeze degree of the
    same systems is phi_full = 7 at n=12 and 9 at n=21, so the ladder is
    measuring 2 to 4 degrees BELOW d_reg and the criterion's own clause
    "evaluated at D up to and including d_reg where reachable" has not been met
    at any rung.

  object_first_candidate:
    tracked_object: >-
      The DECISION VARIABLE itself: the scalar the goal will use to decide
      support / weaken / reject_scoped, followed backwards from the completion
      criterion through the committed cells to the raw ranks, asking at each step
      what the quantity is a fraction of.
    established_families_off_limits: >-
      Off-limits as the primary lens: index calculus; Weil descent; Groebner /
      F4 / F5 solving-degree estimation; Pollard rho comparison; the semi-regular
      Hilbert series as an authority (it is used here purely as a denominator
      whose value is reproduced exactly, never as a source of truth); and any new
      rank measurement whatsoever - this proposal is forbidden from asking for
      compute, because its whole point is that the existing data already decides.
    newness_score: >-
      The move is the corpus's own "attack the measurement, not the target"
      template, and it is the single most repeatedly-skipped move in the program
      (75 of 131 cost-claiming evidence records charge wall clock only; 95 of 131
      have no dominated_by). Against THIS goal it is new: no record in
      GOAL-DREG-001 divides a deficit by anything. Every deficit in every
      checkpoint, every evidence record and the goal's own criterion is a raw
      integer.
    testability_score: >-
      Complete, immediately, at zero compute, on data already committed. The five
      deficits and the sr_pred values are in the ledger and the instrument
      headers; the normalisations are division.
    survival_score: >-
      The object survives to the end of the goal - it IS the goal's output - and
      it survives past this goal to GOAL-SDEG-001 and GOAL-SIG-001, which read
      the same deficits.

  mechanism: >-
    WHAT A DEFICIT IS. rank_sem(n,D) = sr_pred(n,D) - deficit_D(n), where
    sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+ and h_k are the coefficients of
    H_n(z) = (1+z)^{nb} (1+z^2)^{-n} (1+z^3)^{-n}, nb = n + 3*ceil(n/3). Since
    the cumulative Hilbert function of the quotient is N(nb,D) - rank, we have
      sum_{k<=D} HF_sem(k) = sum_{k<=D} h_k^+  +  deficit_D(n).
    A deficit is therefore not a free-standing integer: it is an EXCESS of the
    system's cumulative Hilbert function over the semi-regular one. The natural
    question about an excess is what fraction of the thing it exceeds it is, and
    that fraction is the quantity nobody has computed.

    THE MODEL IS RECONSTRUCTED AND EXACT, SO THE ARITHMETIC BELOW IS NOT AN
    APPROXIMATION OF THE LANE'S CONVENTION BUT THE LANE'S CONVENTION ITSELF.
    Recomputed this session from the definitions above: sr_pred(9,3..6) =
    180 / 1,674 / 9,504 / 28,068 and sr_pred(12,3..6) = 312 / 3,834 / 29,418 /
    156,520, matching every committed value; nrows(9,6) = 45,324,
    nrows(12,6) = 183,312, nrows(12,5) = 31,512, matching; and, at the
    crypto-scale rung, the same construction at t = 7, n = 161 (k = 23,
    nb = 966, 161 quadrics and 805 cubics) returns freeze degree EXACTLY 150,
    which is BATCH-001's committed crypto-scale d_reg. Three of the five
    committed deficits are recovered independently as sr_pred minus a committed
    rank: 29,418 - 28,096 = 1,322 (n=12 D5, the h012c instrument's own validation
    gate), 145,881 - 143,882 = 1,999 (n=18 D5, same source), and
    268,674 - 265,950 = 2,724 (n=21 seed 1 D5, the BATCH-003 anchor). Nothing
    below depends on a number this session did not reproduce.

    THE TABLE. Columns: n, deficit, sr_pred(n,5), ncols(n,5) (from the closed
    form of IDEA-20260805-90a841), sum_{k<=5} h_k, h_5, then the four ratios.
      n=12  1,322    29,418     46,717     26,037     16,920   .04494 .02830 .05077 .07813
      n=15  1,862    70,935    143,421    103,502     78,906   .02625 .01298 .01799 .02360
      n=17  1,823   126,922    314,472    257,246    208,896   .01436 .00580 .00709 .00873
      n=18  1,999   145,881    358,678    297,823    243,612   .01370 .00557 .00671 .00821
      n=21  2,724   268,674    778,394    706,308    601,650   .01014 .00350 .00386 .00453
    Every ratio column is strictly decreasing in n across all five rungs,
    including the off-lattice rung n=17. The raw column is not: 1,862 -> 1,823.

    WHY THIS IS THE CANONICAL ARTIFACT TEST, RUN IN REVERSE. Inventor protocol
    section 3 says to ask what the measured quantity SHOULD do as the parameter
    meant to destroy it increases, and to suspect the measurement when it fails
    to decay. Here the parameter is n and the quantity is the departure from
    genericity. The ambient objects grow like C(nb,5), i.e. faster than n^5,
    while the departure grows like a low power of n at best - so a departure that
    is real and structural should hold a roughly constant SHARE, and one that is
    a finite-size effect should have a vanishing share. The share vanishes, and
    it vanishes fast: a factor 17 in deficit/h_5 over a factor 1.75 in n. That is
    the decay signature, and it is the signature the raw criterion is blind to
    by construction.

    WHAT THIS DOES NOT ESTABLISH, STATED HERE RATHER THAN AT THE END. It does not
    show the deficit is zero, is noise, or is uninteresting. A vanishing share is
    consistent with a genuine but subleading structure, and the whole point of a
    degree-of-regularity question is that a subleading effect at D=5 can become
    leading at D near d_reg. It also does not show that the goal should close.
    It shows that the sentence "a deficit that grows with n" cannot carry a
    decision, because on the committed data it is false as stated (non-monotone)
    and, in the only reading under which it is true (endpoints only), it is true
    of a quantity whose share is collapsing.

    THE SECOND, INDEPENDENT MEASUREMENT PROBLEM. phi_full(n) - the semi-regular
    freeze degree, the model's own d_reg - is 6, 7, 8, 8, 9, 9, 10, 11, 12 at
    n = 9, 12, 15, 17, 18, 21, 24, 27, 30, and grows with slope ~0.267 in n at
    large n (the campaign's committed linear law, c* = 0.23748, is the same
    phenomenon at its own normalisation). Every committed cell of this goal is at
    D = 5 or D = 6. So at n = 21 the ladder is measuring four degrees below the
    reference's own d_reg. The goal's completion criterion requires evaluation
    "at D up to and including d_reg where reachable"; at no rung has that been
    reached, and the honest statement of what the ladder currently contains is
    "low-degree rank excess", not "d_reg". This is a scope statement about
    existing artifacts, not a criticism of any run.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/goals/GOAL-DREG-001.yaml (objective, completion_criteria, all checkpoints)
      - ledger/RQ-DREG-001.yaml
      - ledger/evidence/EV-DREG-004/006/007/008.yaml
      - ledger/hypotheses/H-SDEG-0dd021.yaml
      - ledger/proposals/IDEA-20260801-002.yaml
    grep_results:
      - >-
        Every deficit in the goal record and in the evidence records is a raw
        integer. No record divides one by sr_pred, by ncols, by h_D, or by
        anything else. EV-DREG-004 does mention "the n=18 deficit zone (~0.1%)"
        as a column-progress telemetry ratio, which is a different quantity
        (fraction of columns processed), not a normalised deficit.
      - >-
        The completion criterion's phrase "a deficit / gap(n)=d_reg-d_ff that
        grows with n" appears in the goal record and in RQ-DREG-001 with no
        normalisation and no growth rate attached.
    conclusion: >-
      Not present in this corpus for this goal. The general move is standard and
      is the program's own house template; its absence here is the finding.

  lossy_projection_identifiability_audit:
    projection: >-
      The whole committed measurement record of a cell (matrix, ranks, seeds,
      chunk receipts)  -->  the single scalar deficit_D(n)  -->  a monotonicity
      verdict on the sequence n -> deficit_D(n).
    what_is_discarded: >-
      At the first step: everything except one integer. At the second step:
      the integer's magnitude relative to anything - the ambient dimension, the
      reference Hilbert function, the degree, the seed spread.
    why_genuinely_lossy: >-
      Extremely lossy, and that is exactly the complaint. The second projection
      in particular retains only an order relation on five integers.
    why_compatible_with_the_operations: >-
      IT IS NOT, AND THAT IS THE FINDING. A monotonicity verdict is compatible
      with the target's operations only if the compared quantities live in
      comparable spaces. They do not: sr_pred(12,5) = 29,418 and
      sr_pred(21,5) = 268,674, so the same integer deficit means a nine-times
      smaller departure at the later rung. The projection to a raw integer is
      NOT compatible with the n-indexed family it is applied across, which is
      the precise sense in which the decision variable is broken.
    is_it_only_a_change_of_coordinates: >-
      Neither failure mode in the pure form. It is not a change of coordinates
      (huge information loss) and it is not constant across instances (the five
      values differ). It is the third failure the audit exists to catch: a
      projection that IS lossy, IS non-constant, and is nevertheless
      incomparable across the family it is being compared over. The check run
      was the constancy check on the ratio columns - if a normalisation had come
      out constant across n it would have been the trivial one and worthless;
      instead all four move monotonically and agree, which is what makes them
      informative.

  assumptions:
    - >-
      That the five deficits are the sem-versus-sr_pred quantity at D=5 for
      t=3, ti=0, and that they are mutually comparable. THREE of the five are
      re-derived independently this session from committed ranks; TWO (n=15's
      1,862 and n=17's 1,823) are read from EV-DREG-004's summary line
      "1,322/1,862/1,823/1,999" and are NOT independently reproduced here. Their
      seeds are not established in this record. The experiment's first task is to
      resolve each of the five to a committed rank and a seed, or to mark it
      unresolved - a normalisation applied to a number whose provenance is
      unresolved is worth nothing.
    - >-
      That sr_pred as reconstructed here is the reference the deficits were taken
      against. Supported by three independent exact recoveries (1,322 / 1,999 /
      2,724) and by the crypto-scale freeze degree 150.

  predictions:
    - metric: >-
        monotonicity of the raw deficit sequence over the five committed D=5
        rungs
      direction: different
      minimum_effect: >-
        NOT MONOTONE - specifically deficit(15) > deficit(17), 1,862 > 1,823.
        This is a claim about numbers already on the record and is falsified if
        the two values resolve to different seeds, different D, or different
        instrument conventions, which is why provenance resolution is stage 1.
    - metric: >-
        monotonicity of deficit/sr_pred, deficit/ncols, deficit/sum_{k<=5} h_k
        and deficit/h_5 over the same five rungs
      direction: lower
      minimum_effect: >-
        STRICTLY DECREASING in all four, at all five rungs, with total falls of
        4.4x, 8.1x, 13.2x and 17.3x respectively from n=12 to n=21. Any one of
        the four failing to decrease falsifies the finding as stated.
    - metric: >-
        deficit/h_5 at the missing on-lattice rung n = 24, once measured
      direction: lower
      minimum_effect: >-
        Below 0.00453 (the n=21 value) if the decay continues. This is the
        pre-registered out-of-sample test and it is the one that matters: a value
        at or above 0.00453 would break the decay and would be genuine evidence
        of departure under the corrected variable. sr_pred(24,5) = 456,324 and
        h_5(24) are forced by the reconstruction, so the prediction is a number
        as soon as any future rank exists.
    - metric: >-
        the degree at which any cell of this goal has been measured, against
        phi_full(n) for the same n
      direction: lower
      minimum_effect: >-
        Every committed cell is at D in {5,6} while phi_full(n) is 7 at n=12 and
        9 at n=21, so the shortfall is at least 1 and at most 4 degrees at every
        rung, and is exactly 0 nowhere. Falsified by exhibiting any committed
        cell at D >= phi_full(n).

  minimal_test:
    design: >-
      Zero compute; it is arithmetic on committed integers plus a provenance
      trace. Stage 1 (the decisive one, and it can end the line): resolve each of
      the five deficits to a committed rank, a seed, a D and an artifact path;
      any that cannot be resolved is dropped from the sequence and the finding is
      restated on what survives. Stage 2: recompute sr_pred, ncols, sum h and h_D
      for those cells from the frozen definitions and emit the four ratio
      columns. Stage 3: emit the forced out-of-sample values at n=24 and n=27 for
      whichever rung is measured next. Stage 4: state, as forward guidance and
      not as an amendment, the candidate replacement decision variables and what
      each would require. NO EXISTING RECORD IS EDITED; the completion criterion
      belongs to the Coordinator (AGENTS.md rule 1) and this proposal only
      supplies the arithmetic a revision would need.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, forced value pre-derived, CAN FAIL: apply
        the identical five-point monotonicity analysis to a sequence that is
        KNOWN to track the null - the full-support random null's deficit at the
        same five n at D=5, whose forced value is EXACTLY 0 at every rung (the
        committed n=12 D6 calibration "null rank = sr_pred = 156520, deficit 0"
        is the one measured instance of it). A null sequence of exact zeros must
        be classified "tracks the null" by every candidate decision variable. Any
        candidate variable that classifies the all-zero sequence as a departure
        is disqualified. This control can fail: a badly-formed ratio (for
        instance one with the deficit in the denominator) divides by zero and is
        eliminated on the spot.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: a synthetic sequence
        constructed to be a genuine departure - deficit_D(n) = c * h_D(n) with c
        fixed, i.e. a constant share. Every candidate decision variable MUST
        classify it as a departure. A variable that cannot see a constant-share
        departure is blind to the phenomenon the goal exists to detect, and if
        NO candidate fires on it the analysis is broken and nothing is reported.
      - >-
        GRADED CONTROL, 4 interior points, monotonicity reported: synthetic
        sequences with deficit_D(n) = c * h_D(n)^beta for beta in {0, 0.25, 0.5,
        0.75, 1.0}, spanning "constant absolute deficit" to "constant share".
        Report the beta at which each candidate variable flips its verdict. This
        turns "the criterion is wrong" into "the criterion's detection threshold
        sits at beta = X", which localises the problem instead of asserting it.
      - >-
        ORDERING CONTROL: the null and synthetic control sequences are analysed
        and their verdicts committed BEFORE the five real deficits are put
        through the same code.
    required_metrics:
      - provenance resolution status of each of the five deficits (rank, seed, D, path)
      - the four ratio columns for every resolved cell
      - verdict of each candidate decision variable on the all-zero null, on the constant-share positive control, and on the graded family
      - forced out-of-sample values at n = 24 and n = 27

  falsification_conditions:
    - >-
      Two or more of the five deficits fail provenance resolution, or resolve to
      different D, different instruments, or incomparable conventions. The
      sequence is not a sequence and no monotonicity statement of any kind -
      including this proposal's - may be made from it. This is the most likely
      single failure and it would itself be the deliverable.
    - >-
      Any of the four normalisations fails to decrease. The agreement among them
      is what makes the finding robust; disagreement means the choice of
      denominator matters and the analysis must report all four without picking.
    - >-
      A candidate replacement variable classifies the all-zero null as a
      departure, or fails to classify the constant-share control as one. That
      candidate is dead.
    - >-
      Some committed cell is found at D >= phi_full(n). The second finding is
      then wrong as stated.

  confounders:
    - >-
      SEED MIXING. n=12's 1,322 and n=21's 2,724 come from different seeds
      (n=21 seed 1) and possibly different instrument versions; a five-point
      trend across mixed seeds is weaker than one at fixed seed. The committed
      seed-to-seed spread evidence available is small (sem rank moves 138,570 ->
      138,573 between seeds 2 and 2026 at n=12 D6, spread 3 against deficits of
      order 10^3-10^4), which is reassuring but is one cell.
    - >-
      LATTICE PARITY. n=17 is off-lattice (3 does not divide 17), giving k=6,
      nb=35 rather than the on-lattice pattern; the raw non-monotonicity
      1,862 -> 1,823 sits exactly at that transition and may be a lattice-parity
      artifact rather than a fact about the trend. Both readings are reported.
      Note that the on-lattice-only raw subsequence 1,322 / 1,862 / 1,999 / 2,724
      IS monotone, so the raw criterion survives if and only if one restricts to
      on-lattice n - which the goal's criterion does not say.
    - >-
      DENOMINATOR CHOICE. Four denominators are offered and all four agree here,
      but the choice is a modelling decision and a fifth denominator could
      disagree. The mitigation is to report all of them, per AGENTS.md retrieval
      policy item 7 (report contradictory sources, do not pick).
    - >-
      ADVOCACY ASYMMETRY. A record that reframes a goal's decision variable can
      look like it is steering the goal toward a null verdict. It is not, and the
      design says so structurally: the corrected variable has a pre-registered
      out-of-sample value at n=24 that CAN come out on the departure side, the
      positive control exists precisely so a real departure is detectable, and
      the finding is stated as "the variable cannot carry a decision", not as
      "the answer is null". Deprioritising or closing this goal on the strength
      of this record alone would be exactly the premature closure the inventor
      protocol forbids.

  interpretation_limits:
    - >-
      NO STATUS CHANGE is proposed or implied for H-DREG-001, H-SIG-001, or
      GOAL-DREG-001, and no completion criterion is edited. Only the Coordinator
      may do any of that (AGENTS.md rule 1). This record supplies arithmetic.
    - >-
      A collapsing share is NOT proof that the deficit is an artifact. It is
      consistent with a real subleading structure, and a degree-of-regularity
      effect can be subleading at D=5 and leading at D near d_reg. The forward
      guidance is therefore explicit: what would settle it is one cell at
      D >= phi_full(n) at any n, however small - n=9 needs D=6 (already
      measured at D=6, ncols 29,332) and phi_full(9)=6, so n=9 D=6 IS AT the
      freeze degree and is the cheapest cell in the program at which the
      normalised question can be asked at d_reg rather than below it.
    - >-
      Toy scale, boolean, t=3. Nothing here bears on prime-field ECDLP, moves any
      exponent, or touches the Pollard rho baseline.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING FOR THE ARITHMETIC. The ratio columns are divisions of
        committed integers by integers reproduced exactly from frozen
        definitions. No distributional assumption enters.
      rigorous_support: >-
        sr_pred, ncols, sum h and h_D were all recomputed from the definitions
        this session and validated against 8 independent committed integers
        (sr_pred(9,3..6), sr_pred(12,3..6), nrows(9,6), nrows(12,5), nrows(12,6),
        and the crypto-scale freeze degree 150).
      validation_plan: >-
        Re-derivation inside the experiment, with each committed integer and its
        source path listed beside the reproduced value.
    - id: H2
      statement: >-
        INTERPRETIVE, AND THE ONLY ONE: that for an n-indexed family of
        increasing ambient dimension, a structural departure worth calling a
        departure should hold a non-vanishing share of the reference quantity it
        exceeds.
      rigorous_support: >-
        NOT A THEOREM AND NOT PRESENTED AS ONE. It is the standard reading of a
        finite-size effect versus a structural one, and it is exactly what
        inventor protocol section 3 asks of any signal. It could be wrong for a
        threshold phenomenon that only switches on at D near d_reg, which is
        precisely the case this goal cares about, and that possibility is carried
        forward in interpretation_limits rather than argued away.
      validation_plan: >-
        The graded synthetic control measures where each candidate variable's
        threshold sits, so the assumption's consequences are quantified rather
        than assumed. The n=9 D=6 cell (D = phi_full) is the concrete way to test
        it against a threshold phenomenon.

  target_complexity:
    time_exponent: >-
      This proposal moves NO exponent and says so plainly. It is a decision-
      variable audit. What it bears on is whether a future exponent-facing claim
      out of this goal would rest on a comparison that survives normalisation.
    memory_exponent: n/a
    best_known: n/a - no algorithm proposed or compared.
    hidden_overhead: >-
      None computationally. The real cost is provenance: two of the five
      deficits are not independently reproduced here.
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed, no algorithm, no Pareto point) - and the frontier was
    checked for an existing normalised analysis rather than assumed empty.
    Checked: TIME - no alternative method for this quantity exists; the analysis
    is division and nothing dominates it. MEMORY - kilobytes. DATA/QUERIES - it
    requires ZERO new runs and no new measurement, which is strictly better than
    every other proposal in this batch on that axis and is the reason it is
    ranked as it is. PREPROCESSING - the provenance trace, which is reading. On
    the ECDLP attack frontier this offers nothing at all and dominates nothing.
  sota_delta: >-
    Zero on every attack axis. Quantitatively, on the evidentiary axis: it
    converts a decision variable that admits both verdicts on the same five
    committed numbers into four that agree with each other, and it supplies a
    factor-17 measured decay (deficit/h_5 from 0.0781 to 0.00453 over n = 12 to
    21) that no record in this goal currently contains. It costs zero compute
    against a goal whose next queued measurement is a chunked multi-hour rank.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the finding stands as stated after provenance resolution. Not
    higher, because two of the five deficits (n=15 and n=17) are read from a
    single summary line in EV-DREG-004 and are not independently reproduced in
    this record, and because the non-monotonicity that makes the raw criterion
    fail sits precisely at the on-lattice/off-lattice transition, so a reviewer
    can reasonably restrict the sequence to on-lattice n and recover monotonicity
    - which is why the finding is stated on the normalised columns, which
    decrease at every rung including n=17, rather than on the non-monotonicity
    alone. Not lower, because three of the five deficits are recovered exactly
    from committed ranks this session, because the reference model is validated
    against eight committed integers including the crypto-scale freeze degree
    150, and because all four independent normalisations agree.
