  minimal_test:
    design: >-
      STAGE 0 (derivation, zero compute): write out Lagrange's theorem's
      application to both sides explicitly (as done in claim parts A and B)
      and confirm by hand, on a toy cyclic group of prime order (e.g. Z/17)
      and a toy cyclic group of composite order (e.g. Z/16), that the block
      systems predicted (none nontrivial; four nontrivial, corresponding to
      divisors 2, 4, 8) match a direct enumeration of all subgroups. STAGE 1
      (toy curves, n <= 41): for a small set of toy binary curves with
      KNOWN prime-order target subgroup G and known cofactor h (varying h
      across {2, 4, 8, 16} where reachable at n <= 41, to probe multiple
      2-adic valuations), EXHAUSTIVELY search over all partitions of G
      invariant under translation by a fixed generator S, confirming none is
      nontrivial (the closure prediction), and over all partitions of the
      FULL E(F_q) invariant under translation by a fixed generator of the
      whole group, confirming the nontrivial ones found correspond exactly to
      the divisors of |E(F_q)| (the lever-side prediction, including deeper
      than index 2 where h has higher 2-adic valuation). STAGE 2 (point
      halving cost measurement): on the same toy curves, measure the field
      operation count of computing an i-level 2-power-torsion class by
      iterated point halving, for i up to the curve's 2-adic cofactor
      valuation, confirming O(1) per level.
    controls:
      - >-
        COMPOSITE-ORDER NULL/CONTROL: a toy group of composite order, matched
        in size to the prime-order test group, must show nontrivial block
        systems (the mandatory positive control that the search procedure
        itself has power to find them when they exist).
      - >-
        PLANTED NONTRIVIAL PARTITION on a prime-order group (deliberately
        constructed to be translation-INVARIANT only approximately, i.e. a
        near-miss): must be REJECTED by the exact block-system test (which
        requires exact invariance, not approximate), confirming the test is
        not accidentally lenient.
      - >-
        Exhaustive enumeration at these toy sizes, not sampling: the closure
        claim is a universal statement and admits no sampled confirmation as
        adequate.
    required_metrics:
      - count_of_nontrivial_block_systems_found_prime_order_group_per_toy_cell
      - count_of_nontrivial_block_systems_found_composite_order_group_per_toy_cell_with_divisor_list
      - field_operation_count_per_point_halving_level_per_toy_curve
      - planted_near_miss_partition_rejection_verdict
  falsification_conditions:
    - >-
      Any nontrivial translation-compatible partition found on a prime-order
      toy group by exhaustive search. Would refute Lagrange's theorem, which
      this record does not expect to happen and treats as certain; reported
      as an instrument defect in the search code, not as new mathematics,
      unless independently reproduced.
    - >-
      No nontrivial partition found on the matched composite-order control.
      Would mean the search procedure itself lacks power, voiding the
      prime-order null's interpretability.
    - >-
      Point-halving per-level cost measured to grow with i (not O(1)) on toy
      curves. Refutes the "cheap but not free, O(i) not O(1)-per-level-forever"
      framing of part (C) and requires the open-number pricing to be revised.
    - >-
      A toy curve with cofactor exactly 2 showing a block system other than
      (or additional to) pi's index-2 partition. Refutes the specific
      "pi is the unique coarsest lever" instance of part (B) for that curve.
  confounders:
    - >-
      FINITE-SEARCH COMPLETENESS. "No nontrivial partition found" at toy scale
      is only informative if the search is genuinely exhaustive over ALL
      candidate partitions, not merely over a structured family (e.g. only
      linear/algebraic ones); the minimal test's Stage 1 must enumerate over
      ALL set partitions invariant under the step, not just algebraically
      described ones, to actually test the theorem rather than assume it.
    - >-
      WALK STEP CHOICE. If S = O or S has small order (a degenerate or
      badly-chosen step), <S> may not equal all of G, changing which
      subgroup's cosets are the relevant block systems; Stage 1 must confirm
      S generates G (or explicitly test the sub-case where it does not, as a
      secondary, disclosed arm).
    - >-
      POINT-HALVING BRANCH FAILURES. Not every point is halvable at every
      level (halving can fail, requiring a fallback to the point's coset
      representative or a different starting point); Stage 2 must record the
      halving SUCCESS rate alongside the per-level cost, since a low success
      rate would change the practical cost of the deepened lever beyond the
      raw per-attempt field-operation count.
