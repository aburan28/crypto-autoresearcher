idea:
  id: IDEA-20260922-153a90
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    The exact sieve obstruction, stated to the closure standard: a factoring
    sieve amortises because divisibility-by-p is a LINEAR test invariant under
    translation by p; on E(F_q) the only lossy, translation-compatible test is
    the block-system decomposition of the acting group, and on the standardized
    curves' PRIME-ORDER target subgroup G that decomposition is forced trivial
    by Lagrange -- closing the "sieve the targets" escape route completely --
    while the FACTOR BASE lives in the composite-order full group, where
    nontrivial block systems (cedd2f/3119c9/1b16d7's trace-parity quotient) DO
    exist, which is exactly why every surviving yield lever in this lane
    classifies legs, never targets, and ECC2K-130 (k=131, cofactor 4) is the
    sharpest curve on which to state the boundary because it is this program's
    only row with both a certified prime-order target and a certified rho
    calibration point
  class: control
  claim: >-
    THE FACTORING SIEVE'S MECHANISM, STATED PRECISELY ENOUGH TO PORT OR REFUSE
    TO PORT. A sieve amortises over a candidate range [a, a+I) because, for a
    fixed prime p in the factor base, "n is divisible by p" is a LINEAR
    (residue) condition: n = a + i is divisible by p iff i is in a fixed
    arithmetic progression modulo p, so ONE PASS over the residue classes mod p
    marks EVERY candidate in the interval that p divides, at cost O(I/p) rather
    than O(I) trial divisions. The two ingredients this needs are (i) a LOSSY
    projection of the candidate (its residue mod p) that (ii) PROPAGATES
    DETERMINISTICALLY under the specific operation "advance the candidate by
    1" (equivalently, "translate by the group generator of the candidate range
    under addition"). This is precisely the PAIR/lossy-projection framework
    docs/object-frame-ideation.md requires of every candidate in this lane:
    representation = residue class mod p; operation set Sigma = translation by
    1 (equivalently by any fixed step, since Z is cyclic); the projection is
    lossy (many n share a residue) and Sigma-compatible (n = a+i, n' = a+i+p
    share the residue, by construction).

    THE ELLIPTIC CANDIDATE SPACE AND THE TWO PLACES IT COULD LIVE. The natural
    "interval" analogue for point-decomposition relation collection is either
    (i) the set of TARGETS to be decomposed (walking R_0, R_0+S, R_0+2S, ... by
    a fixed step S, hoping some cheap-to-update test predicts decomposability),
    or (ii) the set of FACTOR-BASE LEGS or leg-tuples (walking through V or
    V^{m-1}, hoping some cheap test predicts which combinations matter). This
    record proves the first is CLOSED, by Lagrange, and the second is exactly
    the object every surviving yield lever in this lane already uses --
    explaining, rather than merely observing, why cedd2f / IDEA-20260915-3119c9
    / IDEA-20260922-1b16d7 all classify LEGS and never TARGETS.

    (A) THE TARGET-SIEVE CLOSURE, BY THE BLOCK-SYSTEM THEOREM ALREADY IN THIS
    CORPUS. For Sigma = the cyclic group generated by a fixed step S acting on
    E(F_q) by translation, IDEA-20260901-863e36 establishes that the lossy
    objects (translation-compatible projections) compatible with a regular
    group action are EXACTLY the block systems of that action, and for a
    REGULAR translation action of a cyclic group on itself the block systems
    are exactly the coset partitions of its subgroups (Lagrange). If S has
    order N (the group's own order, the generic case for a well-chosen walk
    step), Sigma acting on E(F_q) has block systems corresponding to the
    DIVISORS of N. If the walk is confined to targets living in the PRIME-ORDER
    subgroup G (order r, r prime, as every standardized curve's target subgroup
    is by construction), the only divisors of r are 1 and r, so the ONLY block
    systems of <S> acting on G are the trivial one (every point its own block)
    and the total one (all of G one block, useless). THIS IS THE SAME CLOSURE
    KN-FIND-ffe1df's Theorem C states for prime-order E(F_p) via a quasigroup
    argument ("a prime-order group has no proper quotients") and the SAME
    closure IDEA-20260806-c5d183 states for the full translation action; this
    record's addition is showing the closure ALSO covers the WEAKER,
    single-generator cyclic-step Sigma a literal sieve-style walk would use --
    not just the full translation action those two results were stated for --
    because a cyclic group of PRIME order has no proper subgroups regardless of
    which generator drives the walk. There is no escape route left: neither the
    strong Sigma (full translation, already closed) nor the weak Sigma (a
    single fixed step, closed here) admits a nontrivial lossy test on targets
    in G.

    (B) WHY THE FACTOR-BASE SIDE IS DIFFERENT, EXACTLY, AND WHY THAT IS NOT A
    LOOPHOLE IN (A). Factor-base legs range over E(F_q), the FULL, composite-order
    group (order N = h*r with cofactor h even on every standardized curve --
    h in {2,4,6,10,76,10080,...} per analysis/binstd-curve-audit's dump), not
    over G. Lagrange places no obstruction here: N has proper divisors (2 at
    minimum, since h is always even), so the translation action of E(F_q) on
    itself has NONTRIVIAL block systems -- the cosets of 2E(F_q), of order 2 --
    and pi: E(F_q) -> E(F_q)/2E(F_q) = Z/2 IS exactly this block system's
    quotient map, the SAME pi that IDEA-20260913-cedd2f, IDEA-20260915-3119c9
    and IDEA-20260922-1b16d7 (this lane's own prior work, this session's
    included) use as their entire yield lever. Those three records did not
    derive pi from the block-system theorem; they derived it from the 2-torsion
    /point-halving literature directly. This record's contribution is showing
    THEIR CONSTRUCTION IS THE ONLY ONE AVAILABLE: by (A), no nontrivial block
    system exists on G (where targets live), so any translation-compatible
    amortisation MUST operate on E(F_q)'s own composite-order structure --
    i.e. on legs, cosets, or the factor base's index set -- never on targets
    directly. That pi happens to be a block system of INDEX 2 (the coarsest
    possible nontrivial one, from the SMALLEST prime factor of the cofactor,
    which is always 2 on a binary curve with a rational 2-torsion point) is
    also forced, not a design choice: it explains why cedd2f's confinement
    lever gives a factor of (at most) 2 per level and why no deeper amortisation
    is available from the SAME mechanism without a genuinely different
    ingredient (deeper 2-power torsion needs actual point-halving computation
    per level, not a free residue lookup, and is left explicitly open below --
    not claimed, not refuted, priced as an open number).

    (C) THE OPEN NUMBER, PRICED RATHER THAN LEFT VAGUE. The one thing (A)+(B)
    do NOT settle is whether a DEEPER 2-power-torsion quotient (E(F_q) ->
    E(F_q)/2^i E(F_q) = Z/2^i, well-defined whenever the 2-Sylow subgroup of
    E(F_q) is cyclic of order >= 2^i, which point-halving papers establish
    holds whenever E(F_q) has a UNIQUE rational point of order 2) gives a
    genuinely cheaper, more-amortised sieve than pi alone. The named obstruction
    to it costing nothing: computing an individual point's class in
    E(F_q)/2^i E(F_q) for i > 1 needs the ITERATED point-halving criterion,
    which (per Fong-Hankerson-Lopez-Menezes 2003 and Pornin ePrint 2022/1325,
    both already cited in cedd2f and relayed here, not independently re-fetched)
    requires ACTUALLY COMPUTING i-1 successive half-points, each an O(1)
    field-arithmetic operation (a half-trace plus a square-root-style solve),
    to determine level i's class -- unlike a factoring sieve's residue test,
    which is FREE at every level once the modulus is fixed (no recomputation
    as the sieve advances). So amortisation to depth i costs O(i) field
    operations PER FACTOR-BASE POINT, once, in a precompute pass -- cheap
    (O(i*B) total for a base of size B) but NOT FREE the way a genuine sieve's
    per-prime test is. Whether an O(i*B)-cost, 2^i-fold yield lever (on curves
    whose cofactor has 2-adic valuation v >= i, e.g. c2tnb431r1 at v = 5,
    identifiable directly from the audit dump's cofactor 10080 = 2^5 * 315)
    is worth pursuing beyond i = 1 is EXPLICITLY LEFT OPEN by this record --
    it is a distinct proposal, not proposed here, and is named as forward
    guidance per the docs/inventor-protocol.md section 4 closure standard this
    record otherwise meets for the TARGET-sieve question.

    (D) THE FLAGSHIP CURVE, AND WHAT IT CLOSES THE LOOP TO. ECC2K-130 (k = 131
    Frobenius/Koblitz order, cofactor 4, group order 4*l with l a certified
    129-bit prime, KN-LIT-096) is the sharpest curve to state this on because
    it is the ONE row in this program's entire standardized population with
    BOTH a certified prime-order target subgroup (Lagrange applies cleanly, no
    ambiguity about which subgroup "the target subgroup" means) AND a
    published, independently-cited rho calibration figure (2^60.9,
    KN-LIT-096) against which any future amortisation claim on this curve must
    be checked. (A) says: no walk over targets in the 129-bit prime subgroup,
    however cheap its per-step test, can ever exploit a nontrivial residue
    structure -- the entire 2^60.9-iteration rho search is, and must remain,
    a walk with NO sieve-style shortcut available on the target side. (B) says:
    the k=131-fold Frobenius orbit reduction this program's own matched-rho
    convention already charges (per RQ-BINSTD-b6f698's baseline convention)
    is a DIFFERENT symmetry (an automorphism of the WHOLE curve, order 131,
    coprime to the cofactor 4) from the 2-power block system (B) describes,
    and the two compose multiplicatively rather than one subsuming the other
    -- both are legitimate, disjoint amortisations of rho itself, neither is a
    "sieve" in the factoring sense, and this record does not conflate them.
  mechanism: >-
    OBJECT FRAME, STATED FOR THE OBSTRUCTION ITSELF RATHER THAN FOR A PROPOSED
    ATTACK. Representation: elements of E(F_q) under a fixed generating step S
    (TARGET side, part A) versus elements of E(F_q) under the full group
    structure (FACTOR-BASE side, part B). Operation set Sigma: <S>, the cyclic
    group generated by one fixed walk step, acting by translation -- explicitly
    the WEAKER operation set this lane's brief names as the one the general
    IDEA-20260806-c5d183 / KN-FIND-ffe1df closure was NOT stated for (those
    results cover the FULL translation action; this record covers the
    single-generator case, which is the one a literal sieve-style walk
    actually uses).

    TRICHOTOMY. On G (target side): PARTIAL-ACTION in name only -- the
    trichotomy is DEGENERATE, because the only block systems available are
    trivial, so there is no nontrivial partial action to classify; this is
    itself the content of the closure. On E(F_q) (factor-base side): also
    PARTIAL-ACTION (Class I), exactly as in cedd2f / 3119c9 / 1b16d7, whose
    tracked object (the relation vector, classified by pi's coset) is cited
    and not re-derived here.

    LOSSY-PROJECTION TEST, RUN TO A NEGATIVE RESULT ON THE TARGET SIDE. On G,
    ANY candidate lossy projection pi': G -> [M] (M < r) that is meant to be
    Sigma = <S>-compatible must satisfy pi'(P+S) = f(pi'(P)) for a fixed update
    rule f -- i.e. pi' must be constant on the fibres of a Sigma-invariant
    partition, i.e. a block system of <S> acting on G. Since <S> acting on G
    (order r, prime) is either trivial (S = O) or itself has order dividing r
    (hence equal to r, since r is prime and S != O implies ord(S) = r by
    Lagrange), <S> = G itself generically, and the block systems of G acting on
    itself BY ITS OWN REGULAR ACTION are the cosets of subgroups of G -- of
    which there are exactly two (trivial and improper), because r is prime.
    THE TEST FAILS TO PRODUCE A NONTRIVIAL CANDIDATE: there is no pi' to run
    the discard/propagation check on at all, which is the strongest form the
    lossy-projection test can return -- not "this candidate object turned out
    non-lossy", but "no candidate object of this form exists".

    LOSSY-PROJECTION TEST, RUN TO THE ALREADY-CONFIRMED POSITIVE RESULT ON THE
    FACTOR-BASE SIDE. Reproduces cedd2f's own test (cited, not re-derived): pi
    on E(F_q) discards all but one bit of x_P and is Sigma-compatible because
    pi is a genuine group homomorphism (pi(P+Q) = pi(P)+pi(Q)), which survives
    precisely because E(F_q) has even order (h even on every standardized
    curve) and therefore a proper index-2 subgroup to quotient by -- Lagrange
    working FOR the construction here, exactly as it worked AGAINST the
    target-side construction in part (A). This symmetry -- the SAME theorem
    (Lagrange) producing closure on one side and the only available lever on
    the other, purely as a function of whether the acted-on group has prime or
    composite order -- is the exact obstruction this record was asked to state.

    THE PRICED OPEN NUMBER: deepening the factor-base-side lever beyond pi
    (part C). O(i) field operations per factor-base point (iterated point
    halving) to compute an i-bit class, against O(1) for factoring's free
    residue test at any depth once the modulus is fixed -- the quantitative
    difference between "amortised for free" (factoring) and "amortised
    cheaply but not for free" (this record's finding for the elliptic case),
    stated as a number (O(i*B) total precompute) rather than left as an
    unquantified "there's no sieve for ECC" folklore claim.

    KN-OPEN-020 CLASS DECLARATION. No factor base is proposed here at all;
    this record is an audit of an EXISTING mechanism's necessity, not a new
    construction. Where it touches pi (part B), pi's class is exactly
    cedd2f's -- F_2-linear membership, description O(1), inherited unchanged.
