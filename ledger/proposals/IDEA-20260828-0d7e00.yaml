idea:
  id: IDEA-20260828-0d7e00
  title: >-
    Exact (non-heuristic) truncated-pattern reachability search for a
    5-round single-key impossible differential in AES-128 -- the
    impossible-differential contradiction object RQ-AES-001 names and no
    filed proposal has yet used.
  class: mechanism
  claim: >-
    Define, for a truncated activity pattern p in {0,1}^16 (which byte
    positions carry a nonzero difference; NOT the values), the FORWARD
    k-ROUND REACHABLE SET F_k(p_in) = the set of patterns q such that there
    EXISTS a concrete assignment of nonzero GF(2^8) values to the active
    bytes of p_in, and of arbitrary values to inactive bytes, whose
    AES-round-function image after k rounds has EXACTLY activity pattern q
    (an EXISTENCE predicate, computed exactly via the AES linear layer over
    GF(2^8) and the exact fact that SubBytes preserves nonzero-ness
    losslessly -- no probabilistic or Markov-cipher assumption anywhere in
    this definition). Define B_k(p_out) symmetrically by running the
    (linear, hence exactly invertible) round function backward. CLAIM: for
    the classical 4-round single-key impossible differential of AES
    (p_in = one active byte, p_out = one inactive byte in the same or a
    related position, exact shape to be enumerated up to the C4 column-
    rotation symmetry already used in IDEA-20260808-4c309d's HA-2),
    F_4(p_in) intersect B_0(p_out) = empty set holds EXACTLY (not just
    "generically" or "heuristically") -- this record's baseline-reproduction
    gate. THE OPEN QUESTION THIS RECORD ANSWERS: does there exist ANY
    (p_in, p_out) pair with |active(p_in)| <= 2 and |inactive(p_out)| <= 2,
    up to the symmetry group, and any round split k in {1,...,4} of a
    5-round window, such that F_k(p_in) intersect B_{5-k}(p_out) = empty
    set EXACTLY -- i.e. a genuine 5-round single-key impossible differential
    certified by exact reachability rather than by a probabilistic
    argument? TWO DISCRIMINATED OUTCOMES: a nonempty search result is a
    certified reduced-round distinguisher (an unconditional impossibility,
    the strongest form of distinguisher this program can produce, requiring
    no heuristic assumption at all) matching RQ-AES-001's decision target
    outright; an empty search result over the full enumerated shape class is
    a SCOPED CLOSURE at the docs/inventor-protocol.md section 4 standard --
    a named obstruction (no exact reachability contradiction exists in this
    shape class at 5 rounds), an argument (the reachable sets' sizes, why
    they intersect), and forward guidance (which shape classes remain
    unenumerated: wider activity weights, related-key, or genuinely
    probabilistic near-impossible variants).
  mechanism: >-
    SubBytes acts on activity exactly (a byte's output difference is zero
    IFF its input difference is zero, because the S-box is a bijection with
    no additive structure needed for this fact) -- this step requires NO
    heuristic. ShiftRows permutes positions exactly. MixColumns is the only
    step requiring genuine computation: for a 4-byte column with input
    activity subset S_in (|S_in| = s), whether output activity subset S_out
    (|S_out| = t) is EXACTLY reachable is equivalent to solvability, over
    GF(2^8), of a linear system asking whether the MDS matrix restricted to
    columns S_in and rows (complement of S_out) has full rank AND whether a
    nonzero solution avoiding the union of finitely many coordinate
    hyperplanes exists -- a finite check, decidable by direct enumeration
    over GF(2^8)^s for s <= 4 (at most 255^4 candidates per column-shape,
    but the SET of reachable output shapes per input shape needs computing
    only once, is a table of size 2^4 x 2^4 per column, and is reused across
    all propagation steps). Composing this per-column existence table across
    4 columns and R rounds gives the EXACT forward/backward reachable-
    pattern sets, with NO heuristic anywhere -- unlike every probability-
    based AES distinguisher this program has proposed (IDEA-20260808-76260d's
    active-S-box bound, IDEA-20260807-3d9c9f's overdispersion instrument),
    this object answers a YES/NO existence question, not a probability. THE
    TRACKED OBJECT is the pair of reachable PATTERN SETS (not trails, not
    values) -- a projection discarding every concrete GF(2^8) value and
    keeping only which subsets of positions can ever be simultaneously
    active, together with the per-column existence tables that make that
    retained information propagate deterministically without reference to
    the discarded values (the lossy-projection test of
    docs/inventor-protocol.md section 2: genuinely lossy, since many value
    assignments share one activity pattern, and compatible with AES's own
    operations because each operation's action on patterns is itself an
    exact, computable function of the pattern alone plus the fixed
    per-column existence tables). Nearest known method: the classical
    "miss-in-the-middle" impossible-differential construction (established,
    declared off-limits as the naive lens); the difference here is
    replacing its usual branch-number/weight-counting HAND ARGUMENT (as in
    IDEA-20260808-76260d's HA-1, itself only a heuristic pending validation)
    with an EXHAUSTIVE, exact per-column table, then SEARCHING a bounded
    shape space computationally rather than constructing one shape by hand.
  novelty_status: unverified
  citations:
    - ref: "Impossible differential cryptanalysis (Knudsen 1998 / Biham-Biryukov-Shamir 1999, exact titles not confirmed this session)"
      provenance: recalled
      claim: The classical miss-in-the-middle construction and its 4-round AES instance.
      verified_by: null
    - ref: IDEA-20260808-76260d
      provenance: internal
      claim: >-
        HA-1 of that record already asserts "any pattern with total weight
        at least 5 across a column's input and output is realisable by SOME
        difference -- provable directly from MDS", labelled a heuristic
        pending its own toy validation. This record needs the FULL per-shape
        reachability table (not just the weight-5 threshold), re-derives it
        independently, and uses it for a different deliverable (existence
        search for impossibility, not an LP bound).
      verified_by: "idea-generator subagent (read ledger/proposals/IDEA-20260808-76260d.yaml in full during idea generation)"
    - ref: IDEA-20260808-4c309d
      provenance: internal
      claim: The C4 column-rotation symmetry group used to bound the shape enumeration, reused here rather than re-derived.
      verified_by: "idea-generator subagent (read ledger/proposals/IDEA-20260808-4c309d.yaml in full during idea generation)"
  assumptions:
    - The pinned FIPS-197 harness supplies the exact MixColumns matrix and ShiftRows permutation.
    - The per-column reachability tables (2^4 x 2^4 boolean tables, one per round's column structure) are small enough to compute exhaustively within budget (at most 255^4 ~ 4.2e9 candidate checks per column-shape in the worst case, reducible by symmetry and by checking rank conditions instead of brute force where possible).
  proof_search_map:
    bottleneck: >-
      Whether the branch-number weight-5 NECESSARY condition on MixColumns
      activity is also SUFFICIENT for every specific shape pair, or fails on
      a measure-zero set of shapes that a probabilistic argument would miss
      -- this is the exact step every prior impossible-differential argument
      in this program (and, recalled-unverified, in the literature) treats
      as obvious without a per-shape check.
    baseline_embedding:
      parameter_slice: >-
        The classical 4-round single-byte-in/single-byte-out AES impossible
        differential, whose empty intersection is provable by hand and must
        be reproduced by the exact reachability computation before any
        5-round search is trusted.
      reproduction_check: >-
        F_4(single active byte) intersect B_0(single inactive byte) = empty
        set, verified by direct set computation, frozen as a fixture.
    observation_collision:
      observable: emptiness of the forward/backward reachable-set intersection at a given round split.
      distinct_preimage_search: >-
        The dangerous collision is a shape pair where the WEIGHT-based
        (76260d-style) argument predicts nonemptiness (reachable by the
        coarse branch-number bound) but the EXACT per-shape table says
        empty, or vice versa -- any such disagreement is reported explicitly
        as the discriminating case between the two instruments.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: exact per-column reachability tables replacing the branch-number weight bound
        predicted_gain: converts a hand-wavy sufficiency assumption into a checked existence table, closing a gap in 76260d's own HA-1.
      - transform: observable_fiber
        proposed_object: any shape pair where weight-argument and exact-table disagree
        predicted_gain: a concrete counterexample to "MDS weight >= 5 implies realisable", if one exists, or a confirmation that none does within the searched space.
    quantifier_order: >-
      THERE EXISTS a shape (p_in, p_out, k) in the enumerated class such
      that FOR ALL value assignments consistent with p_in, the round
      function's k-round forward image and (5-k)-round backward image from
      p_out never agree in activity pattern -- i.e. exists-a-shape,
      forall-values, contradiction. This is NOT "for all keys" (the claim is
      key-independent by construction, since it operates purely on
      differences) and NOT "for all shapes" (only the enumerated bounded
      class is searched; failure to find one there is a scoped, not
      universal, negative).
    method_ceiling:
      strongest_certifiable_claim: >-
        "no concrete pair of plaintexts with activity pattern p_in can
        produce a ciphertext pair with activity pattern p_out through 5
        rounds" -- an unconditional distinguisher for that exact shape, with
        no probability and no key-dependence, but nothing about shapes
        outside the searched class and nothing about attacks that use
        MULTIPLE shapes jointly.
      nearby_object_control: >-
        An AES variant with MixColumns replaced by a matrix of branch number
        4 (one less than AES's 5) is predicted to show STRICTLY MORE
        reachable patterns at every round (weaker diffusion), which must be
        verified as a sanity check that the exact tables are reading branch
        number and not an implementation artifact.
    proof_obligations:
      - claim: 4-round fixture emptiness reproduces exactly
        responsibility: baseline
      - claim: per-column reachability tables are exhaustively correct
        responsibility: correctness
      - claim: shape enumeration is complete up to the C4 symmetry group
        responsibility: interface
      - claim: search terminates within the stated compute budget
        responsibility: runtime
      - claim: any positive (nonempty) 5-round contradiction found is independently re-verified by a second, differently-coded reachability implementation
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: "F_4(single active byte) intersect B_0(single inactive byte), classical shape"
      direction: different
      minimum_effect: exact empty-set result, reproduced by two independent implementations
    - metric: number of (p_in, p_out, k) shapes in the bounded 5-round class (|active| <= 2, |inactive| <= 2, up to C4 symmetry) yielding an exact empty intersection
      direction: higher
      minimum_effect: at least 1 (a positive discovery) OR a fully enumerated zero (a closure) -- both are informative outcomes, not a null result
    - metric: agreement rate between the coarse branch-number weight bound (76260d-style) and the exact per-shape reachability table, over all enumerated column shapes
      direction: different
      minimum_effect: any single disagreement is independently notable and reported regardless of its direction
    - metric: reachable-set size on the branch-number-4 null MixColumns variant vs. real AES, same round count
      direction: higher
      minimum_effect: strictly larger reachable sets on the null at every round tested; equality falsifies the instrument
  minimal_test:
    design: >-
      (1) Compute the exact per-column reachability existence table (2^4 x
      2^4 booleans) for AES's real MixColumns matrix by finite-field solvability
      checks, and independently by direct enumeration on a reduced field
      (GF(2^4) small-AES analogue) as a cross-check. (2) Reproduce the
      classical 4-round impossible differential as an exact set computation
      (fixture). (3) Enumerate the bounded 5-round shape class up to the C4
      symmetry group (reusing IDEA-20260808-4c309d's group machinery) and
      compute F_k(p_in) intersect B_{5-k}(p_out) for every shape and every
      round split k. (4) For any nonempty finding (a genuine impossibility),
      re-verify with an independently coded second implementation before
      reporting. (5) Run the branch-number-4 null variant across the same
      enumeration as a structural-tell control.
    controls:
      - 4-round classical fixture, exact.
      - Branch-number-4 null MixColumns variant (larger reachable sets expected at every round).
      - Independent second implementation of the reachability table and the search, checked for agreement before any positive claim.
      - Cross-check the per-column table on a GF(2^4) small-AES analogue against full enumeration (feasible there) before trusting the GF(2^8) version.
    required_metrics: [reachable-set sizes per round per shape, intersection emptiness per (shape, k), agreement rate with the branch-number bound, wall-clock and memory cost of the enumeration]
  falsification_conditions:
    - The 4-round fixture is nonempty under the exact computation -- construction error, stop.
    - The branch-number-4 null shows reachable-set sizes equal to or smaller than real AES at any round -- the instrument is not reading diffusion strength.
    - A found 5-round "impossibility" fails to reproduce under the independently coded second implementation -- retract, do not report.
    - The full bounded shape class enumerates to zero found impossibilities -- record as a scoped closure per docs/inventor-protocol.md section 4, not as "no 5-round impossible differential exists" (only the searched class is closed).
  confounders:
    - The bounded shape class (|active| <= 2, |inactive| <= 2) is a genuine scope limit; a 5-round impossibility could exist outside it (heavier activity weights, or genuinely probabilistic near-impossible variants) and this search would report a closure that does not cover that space.
    - The AES key schedule and AddRoundKey are transparent to activity patterns (a difference in the key does not change which bytes are active, since AddRoundKey with a FIXED (unknown but fixed) key difference of zero in the standard single-key ID setting is an XOR with a constant and preserves activity exactly) -- this must be checked explicitly rather than assumed, since it is the one step this record has not yet argued in detail.
    - Computational cost of the per-column existence table could exceed budget if brute-force GF(2^8)^4 enumeration is needed instead of a rank-based shortcut; the rank-based approach must be validated against brute force on the small-AES analogue first.
  interpretation_limits: >-
    Reduced-round only, RQ-AES-001 ceiling. A found impossibility is an
    UNCONDITIONAL distinguisher for the exact tested shape and round count
    only; it says nothing about wider shape classes, related-key settings,
    or full-round AES. A closure at this record's scope is a closure of the
    SEARCHED shape class, not a general non-existence proof, and is stated
    as such per docs/inventor-protocol.md section 4's standard.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For every column-activity shape (S_in, S_out) with |S_in| + |S_out|
        >= 5 (AES's branch number), a rank-based sufficiency check (existence
        of a nonzero solution avoiding a specific finite union of hyperplanes
        over GF(2^8)) can be substituted for brute-force enumeration over
        GF(2^8)^{|S_in|} without changing the exact/inexact answer.
      rigorous_support: >-
        For a GENERIC MDS matrix this is a standard fact (Aubry-Oyono-Vincent-
        style generic-position argument, recalled_unverified as to exact
        citation); AES's specific MixColumns matrix is fixed and not generic
        by assumption, so this record treats the substitution as an
        assumption to be validated, not a theorem to be cited.
      validation_plan: >-
        On the GF(2^4) small-AES analogue (16 candidate values per active
        byte, so full brute force over up to 4 active bytes is 16^4 = 65536,
        exhaustively feasible), compute the reachability table BOTH by brute
        force and by the rank-based shortcut for every one of the 2^4 x 2^4
        shape pairs, and report any disagreement exactly (not as a rate) --
        a single disagreement falsifies the shortcut for AES's real matrix
        and forces brute force at GF(2^8), which is then time-boxed and
        reported as a scope limit if infeasible.
  target_complexity:
    time_exponent: >-
      No attack proposed; this is an EXISTENCE SEARCH. If successful, the
      resulting distinguisher's data cost is the size of the searched
      activity pattern's fixed byte set (as low as one or two known bytes
      per side, i.e. a toy/medium-tier reduced-round result, not an
      asymptotic claim). The search itself costs, per shape,
      O(2^4 x 2^4) table lookups composed over R rounds -- negligible; the
      dominant cost is building the per-column table once, bounded by the
      small-AES validation above.
    memory_exponent: negligible (boolean tables of size 2^4 x 2^4 per round-column, activity-pattern sets of size at most 2^16).
    best_known: >-
      No published or internal reduced-round AES impossible-differential
      baseline exists in this repository (checked knowledge/frontiers/
      symmetric-cryptanalysis.yaml -- AES rows are all full-round). The
      classical 4-round single-key impossible differential is the informal
      internal reference point, recalled_unverified as to exact original
      citation.
    hidden_overhead: not applicable; no asymptotic form, exact search only.
    tradeoff_note: not applicable.
  dominated_by: >-
    Checked all 12 filed RQ-AES-001 proposals; none performs an exact
    reachability search for impossible differentials. IDEA-20260808-76260d
    is adjacent (active-S-box LP bound) and is dominated on RIGOR by this
    record for the specific question of exact per-shape realisability
    (76260d's HA-1 is a heuristic this record either validates or refutes),
    while 76260d dominates on GENERALITY (bounds ALL trail weights, not just
    searching for empty intersections). Externally, whether a 5-round
    single-key AES impossible differential has been published is
    UNRESOLVABLE-IN-THIS-ENVIRONMENT (network access to primary full-text
    archives is unreliable per IDEA-20260805-78d9bd's measurement); this
    record's search is independent of that literature question and reports
    its own result regardless.
  sota_delta: >-
    Unknown until the search completes. A positive finding is a genuine,
    unconditional distinguisher at the exact tested shape and round count --
    the strongest possible form of match to RQ-AES-001's decision target,
    since it carries NO heuristic assumption. A negative finding is a scoped
    closure, at the docs/inventor-protocol.md section 4 standard, of the
    bounded shape class searched.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
  added: '2026-08-28'
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-08-28'
  source_refs:
    - RQ-AES-001
    - GOAL-AES-001
    - IDEA-20260808-76260d
    - IDEA-20260808-4c309d
    - IDEA-20260805-78d9bd
