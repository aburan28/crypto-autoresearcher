idea:
  id: IDEA-20260805-7d97be
  question_id: RQ-MQOM-001
  added: '2026-08-05'
  title: >-
    MQOM is the matched unstructured NULL OBJECT the whole structured-MQ family
    has never been measured against: one instrument, two arms, and the rule that
    any device which also fires on MQOM has proved it is not using the structure
    it claims to use
  class: control

  claim: >-
    MQOM's design premise -- stated by its own specification as "MQOM relies on
    fully random unstructured instances of the MQ problem" -- makes it the
    UNIQUE object in the NIST Round-3 MQ family with no oil space, no quotient
    ring, no matrix-ring lift, and no trapdoor structure of any kind. That is
    exactly the definition of a matched null for UOV, MAYO, QR-UOV and SNOVA.
    THE CLAIM: for any algebraic instrument I (first-fall degree, degree-D
    Macaulay rank profile, solving-degree law, kernel dimension, wedge-product
    rank) and any structured scheme S with parameters (q, n, m), the quantity
    that carries information about S's trapdoor is not I(public map of S) but
    the RATIO I(public map of S) / I(MQOM-shaped random map at identical
    (q, n, m) and identical monomial support). This corpus contains 195
    experiment contracts of which exactly ONE mentions arms_and_controls, 39 of
    1694 run directories are controls, and 166 of 229 evidence records carry no
    null anywhere. No structured-MQ measurement in this corpus has ever been run
    against a matched random-MQ arm, and the scout brief records the reason it
    matters in the sharpest possible form: a UOV public key is DESIGNED to look
    semi-regular, so measuring it alone measures nothing. The deliverable is a
    single instrument, executable in this container with no solver, that emits
    (I_structured, I_null, ratio) and a pre-derived forced value for I_null, and
    a stated RULE OF INFERENCE that any future structured-MQ finding in this
    program must clear: a device that fires identically on MQOM has not found
    structure. FOR GOAL-MQOM-001 SPECIFICALLY, the same instrument answers the
    goal's own second flank -- it measures MQOM's solving degree at small
    (q, n=m) against the specification's semi-regular prediction, which is the
    only calibration of that prediction available at any scale this container
    can reach.

  object_first_candidate:
    tracked_object: >-
      THE DISCRIMINATION RATIO of an algebraic instrument between a structured
      MQ map and its matched unstructured twin, followed as a function of a
      GRADED STRUCTURE PARAMETER. Concretely: build a family of MQ systems
      interpolating between a MQOM-shaped fully random map and a fully
      structured one (for UOV shape: an oil space of dimension o, swept
      o = 0, 1, 2, ..., o_max, where o = 0 IS the MQOM object), measure the
      first-fall degree and the Macaulay rank profile at each o, and track the
      ratio to the o = 0 arm. The tracked object is that ratio curve. It
      propagates deterministically because rank is a deterministic function of
      the system once the seed is fixed, and the interpolation is by
      construction, not by chance.
    established_families_off_limits: >-
      Off-limits as the primary lens: designing a new MQ solver; Fiat-Shamir and
      soundness analysis (IDEA-20260805-7abf04); cost-model and memory
      accounting (IDEA-20260805-be7738); Groebner basis theory as a source of
      new theorems; the intersection / reconciliation / rectangular-MinRank
      attack literature as a thing to reproduce. This proposal refuses to
      propose an attack on anything. It proposes the CONTROL that every attack
      claim in the family has so far been allowed to skip.
    newness_score: >-
      Genuinely new in this corpus and, as a framing, not a repackaging of
      anything in the prior-art list: the single prior MQOM idea
      (IDEA-20260801-018) is a forgery-advantage simulation and touches no
      algebraic object. The scout brief supplies the direct precedent for the
      framing in another family -- "FRODO-001 is the matched null object for
      every structured-lattice discount claim ... nothing in its brief frames it
      that way; the framing is free and unused" -- and observes that the same
      free framing is unused for MQOM. The instrument itself (Macaulay rank over
      a small finite field) is completely standard.
    testability_score: >-
      High, and executable TODAY in this container. Exact rank over F_2, F_16
      and F_256 needs only integer arithmetic and, at the sizes reachable here,
      not even numpy: a pure-Python Gaussian elimination over a small field
      table suffices. Measured this session: numpy 2.4.6 is present, sympy is
      absent, Sage is absent, and src/ic_first_fall_fast.py cannot be imported
      (its line 23 is `from sage.all import GF, Matrix`). The existing d_reg
      instrument is therefore unavailable and the port is the experiment, which
      is honest rather than fatal.
    survival_score: >-
      The ratio object survives to whatever n exact rank is affordable at --
      realistically n up to about 12-16 over F_2 and about 8-10 over F_16 /
      F_256 at degree D <= 4, which is TOY and is labelled toy everywhere. It
      does not survive to n = 56 or n = 160. The proposal is written so that the
      deliverable is an INSTRUMENT PLUS A CALIBRATION CURVE, not an
      extrapolation, precisely because this program's own record of
      extrapolation failure (toy-to-crypto leaps from p = 1009 to N = 2^256)
      is the reason its goal record demands honest uncertainty here.

  mechanism: >-
    THE ASYMMETRY THAT MAKES MQOM THE NULL. Verified from the v2.1
    specification, READ this session (https://mqom.org/docs/mqom-v2.1.pdf,
    HTTP 200, lossy zlib text extraction; every quotation to be re-verified
    against the rendered PDF): MQOM's key generation derives the quadratic parts
    A_i and linear parts b_i by expanding a public seed with an XOF, and the
    public key is (mseed_eq, y) with y = P(x). There is no secret linear change
    of variables, no oil subspace, no quotient ring and no matrix lift. The
    specification's own summary is "MQOM relies on fully random unstructured
    instances of the MQ problem which is believed to be a conservative hardness
    assumption". By contrast UOV and MAYO hide an oil space O with P(O) = 0 (or
    a whipped variant thereof), QR-UOV embeds the map in a quotient ring, and
    SNOVA works over M_l(F_q). EVERY published structural attack on those
    schemes is an attack on the object MQOM does not have.

    THE INSTRUMENT AND ITS EXACT DEFINITION. Fix (q, n, m) and a seed. Build the
    degree-D Macaulay matrix M_D of the quadratic system: rows are the products
    u * f_i for monomials u of degree <= D - 2, columns are the monomials of
    degree <= D (over F_2 with the field equations carried, columns are the
    squarefree monomials of degree <= D and rows are reduced modulo
    x_i^2 = x_i). Report rank_D over the exact field, the FIRST-FALL DEGREE
    d_ff = min{ D : rank_D < rank predicted by the semi-regular model }, and the
    full profile (rank_D)_{D=2..D_max}. All of this is exact integer / small
    field linear algebra.

    THE FORCED VALUE FOR THE NULL ARM, DERIVED BEFORE ANY RUN. The
    specification's own semi-regular model (Section 4.2, quoted in
    IDEA-20260805-be7738) gives, for a system of m quadratics in nv variables
    over a field where field equations are not carried,
    sum_j a_j z^j = (1 - z^2)^m / (1 - z)^(nv + 1), rank_D = C(nv+D, D) - a_D
    for D below the solving degree, and rank_D = C(nv+D, D) at or above it.
    THIS IS THE NULL ARM'S PREDICTION AND IT CAN FAIL: measured rank differing
    from it at any (q, nv, m, D) with nv small refutes semi-regularity AT THAT
    SIZE and is a first-class result, because the same assumption is inherited
    by 24 files and 13 experiment contracts in this corpus.
    A SECOND FORCED VALUE, EXACT AND STRUCTURAL: at m = nv (MQOM's own shape)
    the series collapses to (1+z)^nv / (1-z), so a_D = sum_{j<=D} C(nv, j) > 0
    for every D and the semi-regular solving degree DOES NOT EXIST. Verified
    this session at all nine MQOM (q, n=m) pairs out to D = 60. The null arm at
    MQOM's own shape therefore predicts rank_D = C(nv+D,D) - sum_{j<=D} C(nv,j)
    at every D, with no saturation, and a measured saturation at small nv is an
    immediate, unambiguous refutation of the model at that size.

    THE GRADED STRUCTURE ARM. Build a UOV-shaped map at the same (q, n, m) and
    the same seed discipline: choose a subspace O of dimension o, sample m
    quadratics vanishing identically on O, and apply a random invertible linear
    change of variables. o = 0 gives exactly the MQOM-shaped random map (the
    null); o = n/2 gives the classical UOV shape. Sweep o over at least four
    interior points. THE PREDICTION, STATED BEFORE THE RUN: d_ff is
    non-increasing in o, and the rank deficit relative to the semi-regular
    prediction is non-decreasing in o. A flat curve means the instrument cannot
    see oil structure at the reachable sizes and NO negative statement about any
    structured scheme may be made from it. A curve that decreases at o = 0 --
    that is, a deficit in the null arm itself -- means the null is not null and
    the whole instrument is mis-specified.

    WHY THIS SERVES FOUR OTHER GOALS AND NOT JUST THIS ONE. GOAL-UOV-001,
    GOAL-MAYO-001, GOAL-QRUOV-001 and GOAL-SNOVA-001 are all draft goals with no
    evidence, and the scout brief's ranked angle 16 states the exact obstacle:
    measuring a UOV public key's solving degree measures nothing because the key
    is designed to look semi-regular, so the informative object is the
    attack-derived system. That is correct AND it is only half the fix: the
    other half is that a measurement on the attack-derived system is
    uninterpretable without a matched random arm of identical (q, n, m, support).
    MQOM supplies that arm, at parameters that are themselves a NIST submission
    rather than a synthetic convenience. The instrument built here is therefore
    a DONOR ARTIFACT, and the rule of inference it establishes -- a device that
    fires identically on MQOM has not found structure -- is stated as a
    reusable, citable sentence rather than left implicit.

    THE FIELD GATE, STATED BEFORE ANY BUDGET IS CLAIMED. The scout brief warns
    that this program's existing Macaulay tooling is F_2 by construction
    (frozenset monomials, union multiplication, XOR cancellation, x_i^2 = x_i).
    Confirmed indirectly here: the tooling cannot even be imported without Sage.
    MQOM spans F_2, F_16 and F_256, so "reuse existing instrumentation" is FALSE
    and a port is part of the work. The port is small -- a table-driven finite
    field of size 2, 16 or 256 plus Gaussian elimination -- and it is stated as
    a cost rather than assumed away. If the port cannot be completed inside
    budget, the honest disposition is an infrastructure report and the F_2-only
    cells, never a mathematical negative (AGENTS.md rule 5).

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - experiments/
      - ledger/evidence
      - ledger/proposals
      - knowledge/open-problems
    grep_results:
      - >-
        No experiment in this corpus measures any MQ signature scheme's public
        map against a matched random arm. The only Macaulay-rank lineages
        (EXP-DREG-*, EXP-SIG-*) measure boolean chained Semaev systems, a
        different object, and their nulls are matched to THAT object.
      - >-
        No record anywhere frames MQOM as a null object for the structured MQ
        family, and neither GOAL-MQOM-001 nor the four structured-MQ goal
        records mention each other in that role.
      - >-
        KN-OPEN-004 records that the Newton polytopes and mixed volumes of the
        UOV / MAYO / QR-UOV / SNOVA / MQOM public maps have never been computed
        here -- an adjacent, unconsumed gap that this instrument does not close
        and should not be confused with.
    conclusion: >-
      New within this corpus as a framing and as an instrument. NOT claimed new
      externally: comparing a structured system's Groebner behaviour against
      random systems of the same size is completely standard practice in
      multivariate cryptanalysis, and any claim otherwise would be false. What
      is being proposed is that THIS PROGRAM adopt it as a gate, with MQOM as
      the standing null.

  literature_context:
    - >-
      READ (primary, this session, lossy extraction): MQOM v2.1 specification,
      for the unstructured-instance design statement, the key-generation
      description, the semi-regular series of Section 4.2, and Table 6's
      (q, n=m) values 2/160, 2/240, 2/320, 16/56, 16/84, 16/116, 256/48,
      256/72, 256/96.
    - >-
      ABSTRACT ONLY, relayed via the session scout brief and NOT independently
      retrieved for this record: ePrint 2026/237 (wedge-product attack said to
      break 6 of 11 SNOVA parameter sets, SNOVA-V 310 -> 181 bits) and ePrint
      2026/298 (Furue-Ikematsu, CRYPTO 2026, UOV over p^l-truncated polynomial
      rings, intersection attack said to reduce multiple parameters below
      claimed security, and said to fail against MAYO and QR-UOV "because their
      parameter sets do not yield a large enough linear solution space"). THESE
      ARE RELAYED CLAIMS. Neither paper was read here and no number from them is
      used in any derivation. They are listed because they are the reason the
      structured-MQ family needs a null right now: two 2026 results moved real
      parameters by finding that structured systems do not behave like
      semi-regular ones, which is precisely the quantity this instrument
      measures.
    - >-
      IN-CORPUS, READ: the scout brief's method-gaps census (39 of 1694 run
      directories are controls; arms_and_controls appears in 1 of 195 specs;
      166 of 229 evidence records have no null; 188 of 229 have no positive
      control). These counts are this program's own measurements of itself and
      are the strongest available argument for the proposal.
    - >-
      NOT RETRIEVED: [BFS15] Bardet-Faugere-Salvy on semi-regular sequences,
      [CG23] on solving degree. The specification cites both for its model. The
      series used here is the SPECIFICATION'S, taken as a candidate to test, not
      as an authority, exactly as H-SDEG-0dd021 does for the boolean case.

  lossy_projection_identifiability_audit:
    projection: >-
      Full MQ system (all m * C(n+1,2)-ish coefficients, plus the hidden
      trapdoor if any) --> the integer vector of Macaulay ranks
      (rank_2, rank_3, ..., rank_Dmax), and hence the scalar first-fall degree.
    what_is_discarded: >-
      All coefficient data, the trapdoor, the solution, and the field
      automorphisms. Two systems related by any invertible linear change of
      variables have identical rank profiles, so the entire GL_n(F_q) orbit
      collapses to one point.
    why_genuinely_lossy: >-
      Massively lossy and provably non-invertible: the fibre over a rank profile
      contains at least a full GL_n(F_q) orbit, of size up to about q^(n^2).
    why_compatible_with_the_operations: >-
      Compatible with exactly the operation the target performs. A Groebner or
      XL solver's cost is governed by the rank profile, and the rank profile is
      invariant under the linear change of variables that IS the UOV trapdoor's
      concealment. This is the reason the projection is the right one: the
      attacker cannot see the trapdoor, and neither can the instrument, but both
      see the rank.
    is_it_only_a_change_of_coordinates: >-
      NO -- it is invariant under change of coordinates, which is the opposite
      and is the point. THE FAILURE MODE CHECKED FOR IS THE MIRROR ONE:
      constancy. Is the rank profile the same for every system of given
      (q, n, m), so that the comparator has zero spread? THAT IS EXACTLY WHAT
      SEMI-REGULARITY ASSERTS -- the specification says the assumption "implies
      that it only depends on n and m, and does not depend from the actual
      coefficients". So under the null hypothesis the observable IS constant,
      and the instrument has power ONLY against systems where the assumption
      fails. This is disclosed as the central risk: if the reachable sizes are
      too small for the oil structure to move the rank, the graded curve is flat
      and the instrument is uninformative at those sizes. The graded control
      exists to detect precisely that, and its flatness would be reported as a
      measured limitation of the instrument rather than as a fact about UOV.

  assumptions:
    - >-
      That exact rank over F_2 / F_16 / F_256 at the reachable sizes is
      affordable in pure Python within the declared budget. This is an
      engineering assumption and it is tested by the first cell, not assumed:
      the contract orders cells smallest-first and reports what it covered.
    - >-
      That the UOV-shaped construction used for the graded arm is a faithful
      shape. It is a textbook construction and the record does not claim it
      reproduces any deployed scheme's key generation. No statement about
      deployed UOV, MAYO, QR-UOV or SNOVA parameters may be made from it.
    - >-
      NO ASSUMPTION that structure is visible at toy sizes. The proposal's
      honest expectation is that it may not be, and the deliverable is
      constructed to be worth having either way.

  predictions:
    - metric: >-
        null_arm_model_agreement: fraction of measured (q, nv, m, D) cells in the
        o = 0 arm whose exact rank equals the specification's semi-regular
        prediction C(nv+D,D) - a_D
      direction: higher
      minimum_effect: >-
        1.00 at every cell with nv >= 6, predicted before any run. Any single
        disagreement at nv >= 6 refutes semi-regularity at that size and is
        REPORTED FIRST, before anything about structure, because it invalidates
        the baseline that 13 experiment contracts in this corpus inherit.
    - metric: >-
        undefined_solving_degree_at_m_equals_nv: number of measured cells at
        m = nv where the rank saturates at C(nv+D,D) for some D <= D_max
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Forced by a_D = sum_{j<=D} C(nv,j) > 0 for all D, derived in
        this session. A single saturation at m = nv falsifies the identity, and
        would be the most interesting single outcome of the experiment.
    - metric: >-
        graded_monotonicity: sign of the change in the rank deficit
        (semi-regular prediction minus measured rank) as the oil dimension o
        increases through at least four interior points, at fixed (q, n, m, D)
      direction: higher
      minimum_effect: >-
        NON-NEGATIVE AT EVERY STEP and STRICTLY POSITIVE AT AT LEAST ONE. A flat
        curve at every step means the instrument has no power at these sizes and
        no negative conclusion about any structured scheme is admissible.
    - metric: >-
        positive_control_deficit: rank deficit at the maximal oil dimension
        o = floor(n/2) at the largest reachable (q, n, m)
      direction: higher
      minimum_effect: >-
        STRICTLY GREATER THAN ZERO. At o = floor(n/2) with m <= o, a UOV-shaped
        system has a known linear-algebra solution and its Macaulay matrix must
        be rank-deficient relative to the semi-regular prediction. IF THIS IS
        NOT OBSERVED, THE INSTRUMENT IS BROKEN AND NO RESULT MAY BE REPORTED
        FROM ANY ARM.
    - metric: >-
        discrimination_ratio: measured rank in the structured arm divided by
        measured rank in the matched null arm at identical (q, n, m, D, support)
      direction: lower
      minimum_effect: >-
        BELOW 1.00 at the maximal oil dimension. Equal to 1.00 exactly at o = 0
        by construction, which is the trivial self-consistency check.
    - metric: >-
        instrument_port_status: whether exact rank over F_16 and F_256 was
        achieved, or only over F_2
      direction: different
      minimum_effect: >-
        REPORTED, NOT PREDICTED. A partial port is an infrastructure outcome and
        the F_2-only cells stand on their own; it is never negative mathematical
        evidence (AGENTS.md rule 5).

  minimal_test:
    design: >-
      Four stages, cheapest first.
      STAGE 0 (zero compute, minutes): record the environment probe verbatim --
      numpy version, sympy import result, sage import result, and the exact
      failure line of src/ic_first_fall_fast.py -- as the answer GOAL-MQOM-001's
      next_action demands about the d_reg backend, and state that EV-DREG-004's
      object is a different object.
      STAGE 1 (zero compute, seconds): evaluate the semi-regular series in exact
      integer arithmetic for every planned cell and freeze the predicted rank
      table BEFORE any linear algebra is run. Committed as the pre-registration.
      STAGE 2 (F_2 cells, minutes to an hour): measure exact GF(2) Macaulay rank
      for the null arm at n = m in {4,6,8,10,12} and D in {2,3,4}, then the
      graded oil sweep at the largest affordable n. Report null-arm agreement
      BEFORE looking at the structured arm.
      STAGE 3 (F_16 / F_256 port, optional and outside the completion gate):
      the same at n = m in {4,6,8} with a table-driven field. If the port does
      not land inside budget, report it as infrastructure and stop.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, forced value derived before the run, able
        to fail: the o = 0 arm IS the MQOM-shaped map, and its predicted rank at
        every cell is the exact integer C(nv+D,D) - a_D computed in stage 1 and
        committed. It can fail at every single cell. This is the null the four
        structured-MQ goals have never had.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT where the effect MUST appear: a
        UOV-shaped system at o = floor(n/2) with m <= o, where the oil space
        gives a linear-algebra solution and the Macaulay rank MUST fall below
        the semi-regular prediction. Threshold declared before the run: strictly
        positive deficit at D = 3. If the instrument does not fire here, NO
        negative result may be reported from any arm at all.
      - >-
        GRADED CONTROL with at least four interior points and monotonicity
        reported: o swept over {0, 1, 2, 3, 4, floor(n/2)} at fixed (q, n, m).
        Reports at which o the deficit turns on, localising the obstruction
        rather than leaving "the instrument saw nothing".
      - >-
        SEED CONTROL: at least three seeds per cell, with the seed-to-seed
        spread of the measured rank reported BEFORE any model error is
        reported. Semi-regularity asserts the rank is coefficient-independent,
        so a nonzero spread at any cell is itself a refutation of the assumption
        at that size and must be reported first. This mirrors HEUR-BF-1 in
        H-SDEG-0dd021, whose lane learned this lesson the expensive way.
      - >-
        VERDICT-ON-THE-NULL-FIRST: the decision rule is executed and committed
        on the o = 0 arm before the structured arms are read.
      - >-
        ARCHIVE CHECK (zero compute): list every archived rank measurement in
        this corpus and state applicability. EV-DREG-001/002/004,
        EV-SIG-006/008 all measure boolean chained Semaev at n <= 21 with field
        equations carried on a chained construction; they are NOT applicable and
        the non-applicability is recorded rather than claimed as a passed check.
    required_metrics:
      - the frozen stage-1 predicted rank table, committed before stage 2
      - measured exact rank per (q, n, m, D, o, seed), with the field and the elimination order stated
      - null-arm agreement fraction, reported before any structured arm
      - seed-to-seed spread per cell, reported before any model error
      - the graded deficit curve with monotonicity
      - the positive-control deficit and whether it fired
      - the verbatim environment probe from stage 0

  falsification_conditions:
    - >-
      Any null-arm cell at nv >= 6 whose measured rank differs from the frozen
      semi-regular prediction. Semi-regularity is then refuted at that size and
      the finding is reported as such, scoped exactly to the tested (q, nv, m, D).
    - >-
      A measured saturation at m = nv, contradicting the derived a_D > 0
      identity.
    - >-
      The positive control failing to produce a deficit at o = floor(n/2).
      Instrument broken; nothing negative may be reported.
    - >-
      Seed-to-seed spread comparable to or larger than the deficits being
      measured. The instrument is then measuring noise and must be reported as
      doing so, not as a fit.
    - >-
      A flat graded curve at every o. The instrument has no power at the
      reachable sizes; that is a measured limitation, reported with its exact
      boundary, and it forbids any statement about UOV, MAYO, QR-UOV or SNOVA.

  confounders:
    - >-
      SIZE. Everything reachable here is toy: n <= 12 over F_2 and n <= 8 over
      F_16 / F_256, against MQOM's n = 48 to 320. AGENTS.md rule 7 binds
      absolutely and no cell may be presented as a statement about deployed
      parameters. The proposal's value is instrument plus calibration, not
      extrapolation.
    - >-
      CONSTRUCTION FIDELITY of the UOV-shaped arm. A hand-built oil space is not
      a deployed key generation. The arm is labelled "UOV-SHAPED", never "UOV",
      throughout.
    - >-
      SUPPORT MATCHING. "Matched null" means matched in (q, n, m) AND in
      monomial support and degree histogram. This corpus has a worked failure to
      avoid: EV-SEMAEV-94f6d5 compared factor bases at different B while
      KN-FIND-007 proves the mean yield is forced by B alone. The support
      matching is written into the contract as a checked precondition, not an
      intention.
    - >-
      SELECTION OF D_max. Choosing D_max after seeing where the deficit appears
      would be fitting. D_max is frozen in stage 1.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO COST CLAIM. Claim tier toy, and it may not be
      raised by any downstream citation.
    - >-
      A deficit in a structured arm is not a break of any scheme. It is a
      measured departure from a model, at a toy size, on a hand-built object.
    - >-
      A NULL RESULT IS THE EXPECTED OUTCOME AND IS THE DELIVERABLE. If the null
      arm agrees with the semi-regular prediction everywhere and the graded
      curve turns on only at large o, the correct report is: the instrument
      works, MQOM-shaped maps are semi-regular at the tested sizes, and the
      structured-MQ family now has a matched null to be measured against. That
      is the product.
    - >-
      Nothing here bears on MQOM's forgery bound, its GGM tree, or its
      implementation. Those are the other three MQOM proposals of this session.

  heuristic_assumptions:
    - id: HEUR-MQOM-NULL-1
      statement: >-
        SEMI-REGULARITY AT SMALL SIZE. For all q in {2,16,256}, for all
        nv >= 6, for all m, for all D below the solving degree, and for a
        uniformly random choice of coefficients, the degree-D Macaulay rank of
        m quadratics in nv variables equals C(nv+D,D) - a_D with probability
        1 - o(1), where a_D is the coefficient of the specification's series.
        Note the quantifier order: the prediction is required to hold FOR ALL
        cells with ONE fixed formula, not to be fitted per cell.
      rigorous_support: >-
        The specification's own appeal to practice ("usually well-verified in
        practice on unstructured systems") plus the classical
        Bardet-Faugere-Salvy framework, WHICH WAS NOT RETRIEVED FOR THIS RECORD.
        The support is therefore an appeal, not a theorem, and the record says
        so. There is a specific and recorded reason for caution in this corpus:
        semi-regularity is exactly the assumption known to fail for
        summation-polynomial systems, and it is inherited unnamed by 24 files
        here.
      validation_plan: >-
        THIS IS THE EXPERIMENT. Stage 2's null arm is a direct, exact,
        multi-seed test of the assumption at every reachable size, with the
        prediction frozen in stage 1 before any measurement.
      falsification_condition: >-
        A single null-arm cell at nv >= 6 whose exact rank differs from the
        frozen prediction, replicated across at least two seeds.
    - id: HEUR-MQOM-NULL-2
      statement: >-
        VISIBILITY. That oil-space structure of dimension o produces a Macaulay
        rank deficit detectable at the sizes reachable in this container.
      rigorous_support: >-
        NONE. This is the proposal's weakest link and it is stated as such. It
        is entirely possible that the deficit only appears at n far beyond
        reach, in which case the graded curve is flat and the instrument is
        uninformative at toy scale.
      validation_plan: >-
        The graded control IS the test, and the positive control at
        o = floor(n/2) with m <= o is the guaranteed-fire anchor: there the
        deficit is forced by the existence of a linear-algebra solution, so a
        flat response includes a broken instrument in its explanations and the
        contract requires that reading first.
      falsification_condition: >-
        Flat deficit across the whole o sweep including o = floor(n/2).

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND THIS PROPOSAL DOES NOT PRETEND OTHERWISE. It is a
      control and an instrument. Its relation to exponents is indirect and
      stated plainly: the exponent claims it could eventually gate are the
      published structural-attack exponents in the UOV / MAYO / QR-UOV / SNOVA
      family (relayed: SNOVA-V 310 -> 181 bits, ePrint 2026/237, ABSTRACT ONLY),
      each of which asserts that a structured system behaves unlike a random one
      -- an assertion that has a matched-null test and has never been given one
      in this corpus.
    memory_exponent: >-
      n/a for the claim. As an engineering matter the instrument's own memory is
      the binding constraint on reachable n and is budgeted explicitly.
    best_known: >-
      For MQOM's own MQ hardness: the specification's Tables 16-18, transcribed
      in IDEA-20260805-be7738. For the structured schemes: the relayed 2026
      results, unread here and used for no derivation.
    hidden_overhead: >-
      The instrument's own field arithmetic. A pure-Python F_256 Gaussian
      elimination is roughly two orders of magnitude slower than an optimised
      one, which caps reachable n and is stated in the budget rather than
      discovered during the run.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed) -- this proposal produces a control, not a cost
    point, so no frontier row can dominate it. Rows checked before writing
    "n/a", per the inventor protocol: TIME axis -- every MQ solving row in
    MQOM's Tables 16, 17 and 18 (twelve rows, transcribed in
    IDEA-20260805-be7738); this instrument solves nothing and competes with
    none of them. MEMORY axis -- the same twelve rows' printed space columns;
    this instrument's memory is toy-scale and irrelevant to them. DATA / QUERIES
    axis -- all twelve rows consume zero signatures, as does this instrument,
    so the axis separates nothing. Corpus rows checked for a prior matched-null
    MQ measurement: none exists.
  sota_delta: >-
    No attack; instrument and control contribution only. Quantitatively, the
    deliverable is a table of (rank_measured, rank_predicted, deficit, ratio)
    over at least 5 sizes x 3 degrees x 6 oil dimensions x 3 seeds = 270 cells
    at q = 2, each an exact integer, of which zero currently exist in this
    corpus. Against the corpus's own control census (39 control runs out of
    1694; 1 of 195 specs with arms_and_controls), that is a measurable increment
    in the one dimension this program has been measured to be weakest in.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.75 that the instrument is built, the null arm agrees with the frozen
    semi-regular prediction at every reachable cell, and the artifact is
    delivered in a form the four structured-MQ goals can consume. It is not
    higher because the F_16 / F_256 port is real work in a container with no
    algebra system, because the reachable n may be smaller than hoped, and
    because a pure-Python rank at D = 4 grows fast. It is not lower because the
    F_2 arm needs nothing but integers and bit operations and because the
    predictions are exact integers that either match or do not.
    Separately: 0.30 that the graded arm shows a detectable deficit at any
    interior o below floor(n/2) at reachable sizes -- that is the genuinely
    uncertain part, it is HEUR-MQOM-NULL-2, and if it comes out flat the honest
    report is a measured limit on the instrument rather than a statement about
    any scheme. And 0.05 that the null arm itself departs from the semi-regular
    prediction at nv >= 6, which would be the single most consequential outcome
    available here, because that model is inherited by 13 experiment contracts
    in this corpus and by the security analysis of a NIST Round-3 candidate.
