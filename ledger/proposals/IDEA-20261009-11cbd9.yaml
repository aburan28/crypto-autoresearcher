idea:
  id: IDEA-20261009-11cbd9
  question_id: RQ-QLWE-9108dc
  added: '2026-10-09'
  status: proposed
  approved_by: null
  title: >-
    Exact composed boundary of the MLWE-to-RLWE modulus switch with the
    ideal chain
  class: composition
  claim: >-
    A theorem-shaped boundary sentence, derived symbolically before any run,
    for the composition of the Albrecht-Deo MLWE-to-RLWE modulus switch
    (MLWE rank d, modulus q -> RLWE modulus q^d, error rate multiplied by
    a quadratic factor in ring dimension and a square root in rank, as
    reported in KN-LIT-4628) with the cyclotomic ideal chain
    (exp(O~(sqrt(n))), KN-TECH-046): the composite recovers the MLWE
    secret with advantage over structure-blind BKZ at matched total
    dimension only inside a stated parameter region, whose boundary is
    written with explicit quantifiers and checked on one toy slice (rank 2,
    ring degree 8, ternary secrets) run end to end classically. Expected
    outcome: the boundary excludes cryptographic error rates (a named
    approximation-factor-gap obstruction); the opposite outcome is the
    surprise the derivation exists to detect. No deployed parameter set is
    claimed affected.
  mechanism: >-
    The object is the composite arrow MLWE -> RLWE(q^k) -> ideal-chain
    reach, and its exact error-rate and approximation-factor accounting.
    Each arrow is recorded separately (KN-LIT-4628; KN-TECH-046); the
    composite's cost bookkeeping — how exp(O~(sqrt(n))), the modulus
    blowup q^k and the error-rate multiplication interact — is recorded
    nowhere and is the gap closed here. Lossy projection: the switch
    itself — under it the module becomes a ring instance, and what survives
    is exactly what the chain can attack; an advantage that dies in the
    error-rate term is a named obstruction at a stated boundary. This is
    the reduction-network-cascade pattern: both arrows published, the
    composite cost is the deliverable.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-4628
      provenance: kb
      claim: >-
        MLWE(d,q) reduces to RLWE at modulus q^d, error rate multiplied by
        a quadratic factor in ring dimension and a square root in rank
        (power-of-two cyclotomics); MLWE and RLWE are polynomial-time
        equivalent. Read from the corpus entry; not re-derived.
      verified_by: knowledge/literature/KN-LIT-4628.md
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        The ideal chain reaches exp(O~(sqrt(n))) on cyclotomic ideals in
        quantum polynomial time. Read from knowledge/techniques/KN-TECH-046.md.
      verified_by: knowledge/techniques/KN-TECH-046.md
    - ref: KN-LIT-115
      provenance: kb
      claim: >-
        Log-unit decoding recovers short generators for typical
        distributions in prime-power cyclotomics — the classical step the
        toy check exercises.
      verified_by: knowledge/literature/KN-LIT-115.md
  assumptions:
    - The switch applies to the toy slice's shape (power-of-two
      cyclotomic, ternary secrets) with no hypotheses beyond KN-LIT-4628.
    - The chain's classical steps run exactly at ring degree 8, so the toy
      check exercises the composite bookkeeping, not the quantum steps.
  predictions:
    - metric: composed_boundary_sentence
      direction: different
      minimum_effect: >-
        One explicit sentence 'the composite reaches error rate alpha only
        where q >= f(alpha,k,n)' with every constant named and tagged
        reported-or-derived, committed before any run.
    - metric: toy_slice_agreement
      direction: different
      minimum_effect: >-
        Measured advantage-over-BKZ matches the predicted region on both
        sides of the boundary the slice can reach.
    - metric: boundary_vs_cryptographic_regime
      direction: lower
      minimum_effect: >-
        The boundary sits at error rates >= 100x the toy analogue of
        cryptographic rates (expected), or inside them (the surprise),
        stated either way.
  minimal_test:
    design: >-
      (1) Symbolic derivation of the composite cost accounting with explicit
      forall/exists order, every imported constant tagged by corpus source.
      (2) Toy check: rank-2 module over Z[x]/(x^8+1), q in {32,1024},
      ternary secrets; apply the switch (modulus q^2, doubled error rate
      per the reported factor), run the classical chain steps on the
      switched instance; matched BKZ on the original module and the
      switched instance as the structure-blind baseline; measure secret
      column recovery where the sentence predicts advantage.
    controls:
      - Plain LWE of the same total dimension 16, same secrets and budget.
      - The unswitched module with the same chain steps (isolates the
        switch's contribution).
      - A long-generator ideal collision cell (decoder bias check).
    required_metrics:
      - derived boundary sentence, committed before the run
      - secret-column recovery per cell (certificate-checked)
      - achieved approximation factors per cell
      - error rate before and after the switch, measured
  falsification_conditions:
    - >-
      The slice shows chain advantage where the sentence predicts none, or
      none where it predicts advantage: the accounting is wrong and becomes
      a correction obligation.
    - >-
      The plain-LWE null recovers at the same rate: the advantage is
      budget, not structure.
    - >-
      Measured error-rate multiplication disagrees with KN-LIT-4628's
      factor by more than 2x: the switch step is misapplied.
  confounders:
    - >-
      At degree 8 the chain's factor band is numerically close to
      polynomial factors; the boundary sentence, not a bare factor, carries
      the regime reading.
    - >-
      The quantum class-group step is simulated by exact classical
      arithmetic at degree 8; the check exercises bookkeeping, not quantum
      cost.
    - Small-q cells can sit in overstretched regimes of NTRU-shaped
      intermediates; the design avoids NTRU shapes.
  interpretation_limits:
    - Toy scale (degree 8, rank 2); no transfer to any deployed parameter
      set or statement about ML-KEM, ML-DSA, Falcon, Hawk, NTRU,
      FrodoKEM.
    - The derivation is only as good as its imported reported constants;
      none is re-proved here.
    - A negative boundary closes only this composite route.
  proof_search_map:
    bottleneck: >-
      The un-recorded composite cost accounting: whether the switch's
      error-rate multiplication kills the chain's reach before
      cryptographic regimes. Closing it converts a folklore adjacency into
      a measured boundary.
    baseline_embedding:
      parameter_slice: >-
        The switch alone at (d,k)=(8,2) reproduces KN-LIT-4628's reported
        error-rate factor on one instance; the chain alone on the switched
        instance reproduces the k=1 ideal cell of IDEA-20261005-9f4777
        scaled to degree 8.
      reproduction_check: >-
        Measured error-rate multiplication matches the reported factor;
        the degree-8 ideal cell reproduces certificate=1.
    observation_collision:
      observable: secret-column recovery with advantage over matched BKZ.
      distinct_preimage_search: >-
        A switched instance with the secret error redrawn (no planted
        secret) has the same public shape: 'recovery' there is solver
        bias, not composition.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The composite arrow MLWE -> RLWE(q^k) -> ideal chain as one
          bookkeeping object with a stated advantage region.
        predicted_gain: >-
          A named boundary (or its absence) for the cheapest composite
          route from module instances to ideal-chain attacks, at derivation
          tier.
    quantifier_order: >-
      For every MLWE instance in the stated region (exists derivation
      witness) the composite has advantage; the region claim is universal
      over instances but conditional on reported constants; the toy check
      instantiates two boundary points, not all of it.
    method_ceiling:
      strongest_certifiable_claim: >-
        The composite's advantage region, derived with tagged constants
        and toy-checked on each side; nothing about MLWE hardness outside
        this route.
      nearby_object_control: >-
        Plain-LWE null and the unswitched module; readings not separating
        them certify nothing.
    proof_obligations:
      - claim: the switch's factors are imported, not re-derived
        responsibility: scope
      - claim: the boundary sentence precedes the run and is falsifiable
        responsibility: feasibility
      - claim: the toy slice sits on both sides of the boundary
        responsibility: strictness
      - claim: chain steps at degree 8 use exact arithmetic with seeds
        responsibility: runtime
      - claim: >-
          recovery is certificate-checked (recovered column satisfies the
          public equations)
        responsibility: correctness
  heuristic_assumptions:
    - id: H1
      statement: >-
        The reported Albrecht-Deo error-rate factors hold on the toy
        slice's parameter shape.
      rigorous_support: >-
        The published reduction for power-of-two cyclotomics (KN-LIT-4628,
        reported, not re-derived).
      validation_plan: >-
        Measure the error-rate multiplication on the slice and compare to
        the reported factor; a 2x disagreement blocks the reading.
    - id: H2
      statement: >-
        Exact classical class-group and log-unit computations at degree 8
        faithfully stand in for the chain's quantum steps for bookkeeping.
      rigorous_support: >-
        KN-LIT-117 records the quantum steps as polynomial-time in
        arbitrary degree (reported); the classical stand-in is exact at
        degree 8.
      validation_plan: >-
        The unswitched-module control must behave as the k=1 ideal cell
        predicts, isolating the switch's contribution.
  target_complexity:
    time_exponent: >-
      Derivation tier: no new exponent. The composite inherits the
      chain's quantum polynomial time at exp(O~(sqrt(n))) on the
      switched instance; the boundary sentence states where it has
      advantage.
    memory_exponent: inherited, not changed.
    best_known: >-
      Structure-blind BKZ at matched total dimension; the ideal chain at
      exp(O~(sqrt(n))) (KN-TECH-046). The composition is the object, not
      a new algorithm.
    hidden_overhead: >-
      The O~ hides polylog factors; the switch's modulus q^k blows up
      arithmetic sizes; both appear in the boundary sentence.
    tradeoff_note: none beyond the switch's own modulus growth.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP question; no ECDLP known-results row covers lattice
      reduction compositions.
    nearest:
      - ref: KN-LIT-4628
        provenance: kb
        relation: same
        delta: >-
          The switch reduction is recorded; this idea adds the composite
          cost boundary with the ideal chain — the region where the
          composition beats structure-blind BKZ — which the source does not
          state.
      - ref: KN-TECH-046
        provenance: internal
        relation: adjacent
        delta: >-
          The chain's ceiling is recorded for ideals; this composes it with
          the module-to-ring switch and derives the composite's error-rate
          boundary, left open by the technique note.
      - ref: KN-LIT-7208
        provenance: kb
        relation: orthogonal
        delta: >-
          Classical MLWE hardness at linear rank is a hardness direction; no
          result transfers either way without a new reduction.
  dominated_by: >-
    Baseline named: matched-budget BKZ on the original module and the
    switched instance; the un-composed chain on ideals (KN-TECH-046).
    The composition beats neither on any tested cell; its boundary is the
    deliverable.
  sota_delta: >-
    Not an attack claim. Separator: the derived composite advantage region
    (error rate vs q, k, n) with one toy slice checked on each side — the
    first recorded cost accounting for this composite route.
