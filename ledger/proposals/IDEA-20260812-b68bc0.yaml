idea:
  id: IDEA-20260812-b68bc0
  question_id: RQ-EWALK-8fa147
  added: '2026-08-12'
  proposed_by: idea-generator
  status: proposed
  class: control

  title: >-
    The degree floor for orbit invariants. Closed isogeny-graph walks supply
    endomorphisms whose eigenvalue on the rational points is a + b mod N in
    closed form, so large orbit groups are free; the binding constraint is that
    an ALGEBRAIC canonical form for an orbit of size r is a rational function of
    degree at least r, and the minimal degree is measurable by linear algebra
    that separates automorphism-induced orbits from every other kind.

  object: >-
    TRACKED OBJECT. The PARTITION of the prime-order group <P> into orbits of a
    subgroup Lambda of (Z/N)^*, carried together with the minimal degree of a
    rational function on E constant on its blocks. The state being projected is
    the pair (curve, walk position); what is retained is only which block the
    position lies in and how expensive it is to name that block algebraically.
    Established families declared off-limits as the primary lens - the classical
    automorphism quotient itself (KN-TECH-018, closed at sqrt(|Aut|)), the
    enumerate-and-minimise canonicalisation cost gate (IDEA-20260802-005, which
    closes the enumeration route and explicitly leaves THIS door open), the
    kernel-or-injective dichotomy for isogeny point transport
    (IDEA-20260807-053a55), and isogeny transfer to a weak destination
    (EV-ECDLP-b3e847). Candidate objects enumerated and scored on (new /
    one-step propagation definable and measurable / survival depth) - the point
    itself (baseline, not an object); the orbit as a SET, canonicalised by
    enumeration (known and closed by IDEA-20260802-005 / testable / dissolves at
    r above 6); the endomorphism ring element realising the orbit generator
    (known, that is R3 in the lane's method list / testable / survives but says
    nothing about cost); the MINIMAL-DEGREE INVARIANT of the orbit partition
    (new here / testable, it is the rank of an explicit linear system / survives
    to every r and every N, which is what makes the ladder test possible); the
    straight-line-program length of that invariant (new, strictly stronger, but
    its one-step propagation is not definable within budget - recorded as the
    residue). The minimal-degree invariant is the lens. KN-OPEN-019 records that
    no written object-enumeration for the ECDLP exists in this programme, so the
    above is a sketch and not a taxonomy.

  lossy_projection_test: >-
    The projection (walk state) -> (its Lambda-orbit) is genuinely lossy - it
    discards log2(r) bits of the point and keeps only the block label. What it
    discards is discarded COMPATIBLY with the operation the object exists to
    track, namely the Lambda-action itself - applying the orbit generator does
    not change the block, so the retained part propagates deterministically
    under that operation, which is exactly the property an orbit-quotient rho
    needs. HONEST SCOPE LIMIT, stated here rather than discovered later - the
    projection is NOT compatible with the group law - the block of Q + Q prime is
    not a function of the blocks of Q and Q prime. That is a real limitation and
    it is the reason this record analyses canonicalisation cost rather than
    proposing a new walk; a projection compatible with addition would be a
    homomorphism onto a smaller group and would be a different, much stronger
    object. The test is applied, and it passes for the operation at issue and
    fails for the other one; both halves are recorded.

  claim: >-
    Let E/F_p be ordinary with prime N = #E(F_p), let O = End_{F_p}(E) = Z[pi],
    and let Lambda = <lambda> be a subgroup of (Z/N)^* of order r acting on <P>
    by scalar multiplication. Three statements, C1-C3.

    (C1) LARGE ORBIT GROUPS ARE FREE, AND THE ISOGENY GRAPH SUPPLIES THEM. For
    alpha = a + b*pi in O, alpha acts on every F_p-rational point as
    [a + b mod N], because pi is the identity on rational points. So every
    endomorphism obtainable as a CLOSED WALK in the F_p-isogeny graph - a
    product of prime ideals that is principal - yields, in closed form and with
    no discrete logarithm, a scalar lambda = a + b mod N together with an
    evaluation procedure costing one polylog-length chain of small-degree Velu
    steps. There is therefore NO shortage of evaluable scalars of large
    multiplicative order r. Whatever bounds the endomorphism speedup, it is not
    the availability of the group.

    (C2) THE DEGREE FLOOR. Suppose f is a non-constant rational function on E,
    defined over F_p, with f(Q) = f([lambda]Q) for every Q in <P>. Then each
    Lambda-orbit lies inside a single fiber of f, and a fiber of a degree-d map
    from E to the projective line contains at most d points, so
    deg(f) >= r. The bound is TIGHT and is attained exactly at the automorphism
    group - for Lambda = {+1,-1} the function x has degree 2 = r, for j = 1728
    with r = 4 the function x^2 has degree 4 = r, for j = 0 with r = 6 the
    function x^3 has degree 6 = r. The record's claim is that attainment is
    SPECIAL - for Lambda not induced by an automorphism of E, the minimal degree
    of an orbit-constant function is not r but Theta(N), i.e. as large as for a
    random partition of <P> into blocks of size r, and hence carries no saving
    at all.

    (C3) CONSEQUENCE FOR THE LANE. An orbit-quotient rho with an ALGEBRAIC
    canonical form costs at least the evaluation of a function of degree at least
    r; with the minimal degree at Theta(N) for non-automorphism Lambda, the
    canonicalisation is more expensive than the entire walk and the quotient is
    worthless. Combined with IDEA-20260802-005, which closes the
    enumerate-and-minimise route at cost r per step, this closes BOTH known
    canonicalisation routes and answers RQ-EWALK-8fa147 in the form - the
    speedup is bounded by sqrt(|Aut|) not because large groups are unavailable
    (C1 says they are free) but because only the automorphism subgroup has a
    cheap algebraic canonical form (C2).

    DISCRIMINATION BETWEEN THREE EXPLANATIONS. (a) Minimal degree equals r for
    automorphism Lambda and Theta(N) for isogeny-loop Lambda, matching the random
    partition - the degree floor is the operative obstruction, it is measured
    rather than argued, and the lane closes with a named mechanism. (b) Minimal
    degree is Theta(N) even for the automorphism Lambda - the instrument cannot
    see a structured partition and NOTHING is read about the other arms.
    (c) Minimal degree is o(N) for some isogeny-loop Lambda with r large - a
    cheap algebraic canonical form exists outside the automorphism group, which
    would be the first non-constant-factor endomorphism gain in this programme
    and requires independent review before being described as anything.

  mechanism: >-
    A rho walk on orbits needs a canonical block label at every step. There are
    exactly two known ways to produce one - enumerate the block and take a
    minimum, or evaluate a function constant on blocks. The first costs r per
    step and is closed (IDEA-20260802-005). The second is a geometric object -
    a map from E to a curve or a line whose fibers are the blocks - and geometry
    imposes a price - the fibers of a degree-d map have at most d points, so the
    map's degree is at least the block size. When the block-forming group acts by
    curve AUTOMORPHISMS the quotient map exists with degree exactly r and with a
    power-map form that evaluates in O(log r) operations, which is precisely why
    negation and the j = 0 / j = 1728 automorphisms give real savings. When the
    group acts only on the finite set <P> - which is the case for every scalar
    not induced by an automorphism, including every scalar coming from a closed
    isogeny walk - the blocks are not fibers of any low-degree map and the
    invariant degenerates to interpolation through N points. The mechanism is
    therefore that the SAVING is subgroup-theoretic while the COST is geometric,
    and they are only aligned on the automorphism locus.

  novelty_status: adaptation
  novelty_note: >-
    CORPUS CHECKED, WEB NOT AVAILABLE. WebSearch returned a backend model error
