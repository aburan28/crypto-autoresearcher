    fiber-size bound (a fiber of a degree-d map has at most d points) is
    elementary, and the automorphism examples are textbook. Claimed as this
    record's contribution and unverified against external literature - the use of
    that bound as the closure mechanism for the endomorphism lane, the closed
    form lambda(a + b*pi) = a + b mod N tying isogeny-graph loops to orbit
    groups, and the minimal-degree measurement with a random-partition null.

  assumptions:
    - >-
      E/F_p ordinary with prime N = #E(F_p) and E(F_p) cyclic; O = Z[pi] so that
      the closed-form eigenvalue in C1 holds as written. Conductor greater than 1
      changes only the description of O, not the eigenvalue formula for elements
      of Z[pi], and is carried as a control cell.
    - >-
      Candidate scalars lambda are drawn from two declared sources - (i) the
      automorphism group, where available (j = 0, j = 1728), and (ii) closed
      walks in the F_p-isogeny graph, i.e. products of prime ideals that are
      principal, whose generator a + b*pi is recovered from the walk and whose
      eigenvalue is a + b mod N. No lambda is obtained by solving a discrete
      logarithm, which would make the measurement circular.
    - >-
      "Algebraic canonical form" means a rational function on E defined over F_p.
      Non-algebraic canonical forms - hashes, lattice-reduced normal forms,
      arbitrary polynomial-time predicates - are OUTSIDE the scope of C2 and are
      the declared residue.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks;
      any discrete logarithm solved in a control arm is a benchmark with a
      recorded seed and an independently re-verified certificate.

  proof_search_map:
    bottleneck: >-
      Per-step canonicalisation of an orbit. It is the single step that turns an
      r-fold reduction of the search space into either a sqrt(r) saving or a
      sqrt(r) loss, and IDEA-20260802-005 has already priced one of its two
      known implementations. Removing it - exhibiting a cheap canonical form for
      a large non-automorphism orbit - would be the first exponent-relevant
      endomorphism result in this programme.
    baseline_embedding:
      parameter_slice: >-
        Setting Lambda = {+1,-1} recovers the standard negation-quotient rho -
        the minimal-degree invariant is x, of degree 2 = r, and the measured
        speedup is the sqrt(2) already folded into this programme's 0.886
        constant (KN-TECH-006). Setting Lambda = Aut(E) on j = 0 recovers the
        classical sqrt(6) automorphism quotient. Both are exact parameter slices
        of the frame, not analogies.
      reproduction_check: >-
        Frozen regression fixture with an EXACTLY PREDICTED NUMBER - the
        minimal-degree solver, run on Lambda = {+1,-1}, must return minimal map
        degree exactly 2; run on the j = 1728 automorphism group it must return
        exactly 4; run on the j = 0 automorphism group it must return exactly 6.
        These three integers are frozen before any other arm is run and a
        deviation voids the instrument.
    observation_collision:
      observable: >-
        The minimal degree of a rational function on E constant on the blocks of
        a given partition of <P>.
      distinct_preimage_search: >-
        Search for two DISTINCT partitions of <P> into r-blocks - one a
        Lambda-orbit partition for a non-automorphism lambda, one a random
        partition from a recorded seed - with the SAME minimal degree. The
        prediction is that this collision is TOTAL, i.e. the observable cannot
        tell them apart, and that is precisely the content of C2 - the orbit
        structure of a non-automorphism scalar is algebraically invisible.
        Finding a systematic SEPARATION instead is outcome (c) and reopens the
        lane. This is an unusual case in which the collision is the predicted
        result rather than the feared one, and it is stated that way on purpose.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The minimal degree of an orbit-constant rational function, as an
          invariant of a subgroup Lambda of (Z/N)^* acting on <P>.
        predicted_gain: >-
          It converts a vague question ("is there a cheap invariant?") into an
          integer computable by one rank computation, with an exactly predicted
          value on three positive controls.
      - transform: observable_fiber
        proposed_object: >-
          The fiber of the minimal-degree observable over the set of r-block
          partitions of <P>.
        predicted_gain: >-
          None as an attack. Predicted structure - the fiber at the small value r
          contains only the automorphism-induced partitions, and everything else
          sits at Theta(N). Establishing that the small-value fiber is exactly the
          automorphism locus IS the closure.
    quantifier_order: >-
      FOR ALL ordinary E/F_p with prime N, FOR ALL subgroups Lambda of (Z/N)^*
      of order r that are NOT induced by an automorphism of E, DOES THERE EXIST a
      rational function on E of degree o(N) constant on the Lambda-orbits inside
      <P>? Predicted - NO. Note the order carefully - Lambda is quantified
      universally so no favourable scalar may be selected after the measurement,
      and the function is quantified existentially over a degree bound that
      scales with N, so the answer cannot be manufactured by taking N small.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale statement about ALGEBRAIC canonical forms - for the tested
        curves, scalars and degree bounds, no rational function of degree below
        the measured threshold is constant on the orbits of a non-automorphism
        scalar. It certifies NOTHING about non-algebraic canonical forms, nothing
        about canonical forms defined on a different model of the curve (Kummer,
        theta, Edwards - the last unavailable here since N is odd and prime),
        nothing at cryptographic N, and it is not a lower bound on
        endomorphism-based cryptanalysis in general.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS - the
        automorphism group itself, where a degree-r invariant exists with an
        O(log r) straight-line program, giving the real sqrt(|Aut|) saving. Any
        argument that "proves" no cheap invariant exists must NOT also apply to
        j = 0, and the three frozen integers 2, 4, 6 are the check that it does
        not. A second nearby object - Koblitz-style curves over extension fields,
        where Frobenius is a free automorphism-like map with large orbit and the
        saving IS real; that setting is outside RQ-EWALK-8fa147's prime-field
        scope and is named here so the closure is not silently over-read.
    proof_obligations:
      - claim: alpha = a + b*pi acts on E(F_p) as multiplication by a + b mod N
        responsibility: correctness
      - claim: >-
          A closed isogeny-graph walk of smooth norm yields such an alpha with a
          polylog evaluation procedure
        responsibility: feasibility
      - claim: >-
          An orbit-constant non-constant rational function has degree at least
          the orbit size
        responsibility: size
      - claim: >-
          For non-automorphism Lambda the minimal degree is Theta(N), matching
          the random-partition null
        responsibility: strictness
      - claim: >-
          The instrument returns exactly 2, 4 and 6 on the three automorphism
          controls
        responsibility: baseline
      - claim: >-
          Charged per-step canonicalisation cost from an algebraic invariant is
          at least the evaluation cost of a degree-r function
        responsibility: runtime

  predictions:
    - metric: >-
        minimal map degree of an orbit-constant rational function, for
        Lambda = {+1,-1}, for Aut on j = 1728, and for Aut on j = 0
      direction: same
      minimum_effect: >-
        Exactly 2, exactly 4 and exactly 6 respectively, with zero tolerance.
        These are the blocking calibration values; a deviation voids everything.
    - metric: >-
        minimal map degree for Lambda generated by an isogeny-loop scalar of
        multiplicative order r with 6 < r < N-1, divided by N
      direction: same
      minimum_effect: >-
        At least 0.5*(1 - 2/r) and statistically indistinguishable from the
        random-partition null at the same r and N (two-sided, 15 percent band).
        The predicted value is Theta(N), i.e. no saving whatsoever.
    - metric: >-
        ratio of minimal degree (isogeny-loop Lambda) to minimal degree (random
        partition with matched block size), as N grows over at least three sizes
      direction: same
      minimum_effect: >-
        1.00 plus or minus 0.15, CONSTANT in N. A ratio decaying below 0.5 as N
        grows is outcome (c) and reopens the lane. This is the ladder test - N is
        the parameter, and the statistic must be shown capable of moving, which
        the automorphism arm demonstrates by staying at r while the others grow
        linearly.
    - metric: >-
        charged per-step canonicalisation cost, in field multiplications, for the
        best invariant found at each r
      direction: higher
      minimum_effect: >-
        Growing at least linearly in the minimal degree, hence at least linearly
        in r for automorphism Lambda and at least linearly in N otherwise; the
        net orbit-quotient rho cost must therefore never fall below
        0.886*sqrt(N/r)*(cost per step), and the measured net ratio against plain
        rho must exceed 1 for every non-automorphism arm.

  minimal_test:
    design: >-
      Pure exact linear algebra plus a small amount of curve arithmetic. For at
      least three toy ordinary curves with prime N in [2^10, 2^14] (small enough
      that <P> can be enumerated in full, which the method requires) - (1)
      enumerate <P> and fix a labelling; (2) build the candidate scalar list -
      the automorphism scalars where they exist (a j = 0 and a j = 1728 curve are
      included on purpose), and at least six isogeny-loop scalars obtained by
      finding principal products of small prime ideals in the isogeny graph,
      recovering the generator a + b*pi from the walk and setting
      lambda = a + b mod N, with the multiplicative order r recorded; no lambda
      is obtained by solving a discrete logarithm; (3) for each candidate, form
      the orbit partition of <P> and solve the LINEAR FEASIBILITY problem "does
      there exist a polynomial u in x of degree at most D, not constant on <P>,
      with u constant on every block" by a rank computation, bisecting on D to
      find the minimal D; report the map degree 2D (and repeat allowing functions
      of the form u(x) + y*v(x) so the search is not artificially restricted to
      even functions, reporting both); (4) repeat the identical computation on
      the matched random-partition null; (5) repeat over at least three values of
      N to obtain the ladder. Every arm shares one solver and one charged-unit
      ledger.
    controls:
      - >-
        POSITIVE CONTROL, BLOCKING AND RUN FIRST - the three automorphism cells,
        whose minimal map degrees must come out exactly 2, 4 and 6. This proves
        the solver can see a structured partition; if it cannot, no other arm is
        read in either direction.
      - >-
        NULL OBJECT, MANDATORY - a random partition of <P> into blocks of the
        SAME size r, drawn from a recorded seed, measured by the identical
        solver. This is the object of the same shape that should show no effect,
        and the entire claim of C2 is that the isogeny-loop arms are
        indistinguishable from it.
      - >-
        SECOND NULL - a partition into r-blocks generated by a scalar of order r
        that is NOT in the image of any endomorphism (an arbitrary element of
        (Z/N)^* of order r). If the isogeny-loop arms differ from THIS null, the
        difference is attributable to the isogeny origin rather than to the block
        size, which is the confound this control removes.
      - >-
        LADDER / DECAY TEST - N increased over at least three values with r held
        fixed. The automorphism arm must stay at r; the null and isogeny-loop
        arms must grow linearly. A statistic that does not move when the
        parameter meant to move it moves is the canonical artifact tell
        (docs/inventor-protocol.md).
      - >-
        MATCHED BASELINES - plain rho with negation and BSGS on the same
        instances, as required by RQ-EWALK-8fa147's constraints; and the
        automorphism-discounted rho baseline on the CM curves (KN-TECH-018).
      - >-
        CERTIFICATE CONTROL - every solve in the cost arm independently
        re-verified by a checker sharing no code with the solver.
    required_metrics:
      - >-
        minimal polynomial degree D and minimal map degree, per candidate scalar,
        per curve, for both function families (even and general)
      - the same quantities on both nulls, with matched block sizes
      - >-
        the three frozen automorphism values, reported first and separately
      - >-
        multiplicative order r of every candidate scalar, and the walk that
        produced it (ideal factorisation and the recovered a, b)
      - >-
        charged per-step canonicalisation cost and the net orbit-quotient rho
        ratio against plain rho, in charged units, never wall clock
      - rank-computation dimensions, so the linear algebra is auditable
      - certificate verification fraction; must be 1.0

  falsification_conditions:
    - >-
      The three automorphism controls do not return exactly 2, 4 and 6.
      Instrument failure; everything void, nothing read.
    - >-
      A non-automorphism Lambda with r greater than 6 admits an orbit-constant
      function of map degree below 0.1*N, reproduced across curves and across
      fresh scalars. C2 is false, a cheap algebraic canonical form exists outside
      the automorphism group, and the endomorphism lane reopens on a route
      IDEA-20260802-005 explicitly left open. Independent review before any
      description.
    - >-
      The isogeny-loop arms are systematically SEPARATED from the matched random
      partition (ratio below 0.5 and decaying with N). Same consequence as above,
      and additionally it would mean isogeny-graph origin confers algebraic
      structure on the orbit partition - a mechanism this record does not
      predict.
    - >-
      The random-partition null returns a small minimal degree. The solver is
      finding degenerate solutions (for instance the constant function, or a
      function vanishing identically on <P>); the non-constancy constraint is
      mis-implemented and everything is void.
    - >-
      The ladder does not move - minimal degree independent of N on the null arm.
      The statistic cannot be moved by the parameter meant to move it, which is
      an artifact tell, and no closure may be written.

  confounders:
    - >-
      Restricting the function family to polynomials in x alone builds in the
      negation invariance and will make r = 2 look trivially special. Both
      families (even functions of x, and u(x) + y*v(x)) must be searched and both
      reported, or the r = 2 control is meaningless.
    - >-
      A function that is constant on blocks but also constant on ALL of <P> is a
      degenerate solution. Non-constancy on <P> is a hard constraint in the
      feasibility problem and its enforcement must be visible in the artifact.
    - >-
      An orbit-constant function must additionally SEPARATE distinct orbits to be
      a canonical form. Minimal degree for constancy is a LOWER BOUND on the
      degree needed for a usable canonical form; the record must not silently
      treat the two as equal, and the separation property is measured and
      reported alongside.
    - >-
      Small N makes Theta(N) and a large constant indistinguishable. Three values
      of N spanning at least a factor of 8 are required, and the claim is about
      the SLOPE, not the level.
    - >-
      Scalars recovered from isogeny walks may accidentally coincide with
      automorphism scalars on a CM curve; each candidate's membership in the
      automorphism image is checked explicitly and such cases are reported in the
      automorphism arm, not the isogeny arm.
    - >-
      The multiplicative order r of an isogeny-loop scalar is itself a
      measurement requiring the factorisation of N - 1; at toy N this is free,
      and the record must not assume it stays free.

  interpretation_limits:
    - >-
      Toy scale, claim tier toy. The method requires enumerating <P>, so N is
      capped near 2^14 and no result transfers to cryptographic N.
    - >-
      C2 covers ALGEBRAIC canonical forms only. Non-algebraic canonical forms are
      the declared residue and this record neither tests nor closes them; a
      closure written from this experiment must name that residue explicitly.
    - >-
      The result is a constant-factor statement about the rho baseline in both
      directions. It cannot move an exponent and the claim is that nothing in
      this lane can, which is a statement about this lane and not about ECDLP.
    - >-
      RQ-EWALK-8fa147's own decision target says this lane is on the wrong side
      of the generic-group admissibility filter by construction and that its
      purpose is to measure the ceiling precisely. That is exactly what this
      record does, and it should not be read as more.
    - >-
      Timeouts, crashes and infrastructure failures are never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H-DEG-1
      statement: >-
        For a partition of <P> into blocks of size r that is not the orbit
        partition of a curve automorphism, the space of polynomials of degree at
        most D in x whose restriction to <P> is block-constant is trivial (only
        the constants) until D reaches (N-1)*(1/2 - 1/r) + O(1) - that is, the
        partition behaves like a uniformly random r-block partition with respect
        to the evaluation map from polynomials to functions on <P>.
      rigorous_support: >-
        Rigorous ingredients - (i) the evaluation map from polynomials of degree
        at most D in x to functions on <P> has image of dimension min(D+1,
        (N-1)/2 + 1) because x takes each value at exactly the two points +-Q;
        (ii) the space of block-constant functions on <P> has dimension exactly
        (N-1)/r; (iii) a non-trivial intersection therefore requires
        (D+1) + (N-1)/r > (N-1)/2, which is a hard counting bound and not a
        heuristic. Distribution imitated - that the two subspaces are in GENERAL
        POSITION, which is the standard genericity assumption for a random
        subspace of a given dimension and is exactly what the automorphism
        partitions violate.
      validation_plan: >-
        Measured directly, not assumed - for each N and r, compute the minimal D
        by rank computation on at least 32 independent random partitions from
        recorded seeds and compare the empirical distribution of D against the
        general-position prediction (D + 1 = (N-1)*(1/2 - 1/r) + 1). Tail check -
        the SMALLEST minimal D observed over all seeds and all r is compared
        against the general-position minimum over that many trials; a random
        partition attaining a small D would indicate the counting bound is not
        binding and the whole design is mis-specified. Sampled parameters
        (N values, r values, seed list) are recorded in the manifest. Transfer
        assumption stated - this is a statement about the linear algebra at toy N
        and is NOT extrapolated to cryptographic N, where the enumeration is
        infeasible and the question would need a different instrument.
    - id: H-DEG-2
      statement: >-
        The scalar lambda = a + b mod N obtained from a closed walk of B-smooth
        ideal norm in the F_p-isogeny graph is distributed like a uniformly
        random element of (Z/N)^*, so its multiplicative order r is typically of
        size N and small-order evaluable scalars do not occur by accident.
      rigorous_support: >-
        Rigorous ingredient - the eigenvalue map lambda from O onto Z/N is a
        surjective ring homomorphism with kernel (pi - 1), so the image of any
        sufficiently large set of endomorphisms covers Z/N; and elements of
        Z[pi] of norm at most X have coefficients bounded by |a| < X^{1/2} and
        |b| < (X/p)^{1/2}, so the reachable (a, b) form an explicit lattice
        region. Distribution imitated - the classical distribution of
        multiplicative orders of random residues modulo a prime
        (Erdos-Pomerance-type statistics), the same imitation used by
        IDEA-20260808-bba3dc's HA-1 for ord(pi mod M).
      validation_plan: >-
        Sample at least 500 closed walks per toy curve, compute lambda and its
        exact multiplicative order r (N - 1 is factored at toy scale), and
        compare the empirical distribution of r against that of uniformly random
        elements of (Z/N)^* by a two-sample test. Tail check - the SMALLEST order
        observed over the whole sample against the predicted minimum over that
        many draws; an isogeny-loop scalar of unexpectedly small order is exactly
        the object that would make outcome (c) reachable and is re-drawn and
        re-verified rather than discarded. Sampled parameters and seeds recorded.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED, on every branch this record expects. The orbit quotient
      changes the constant to 0.886/sqrt(r) at best and to something worse than
      0.886 once canonicalisation is charged. The one branch that would move an
      exponent - a cheap algebraic invariant at r = N^{delta}, giving
      p^{(1-delta)/2} - is the branch this record predicts does not exist, and it
      is named so that the prediction can fail visibly.
    memory_exponent: >-
      O(1) for the rho arms; sqrt(N) for the matched BSGS baseline. The
      measurement itself needs O(N) memory to hold <P> and the rank computation,
      which is a measurement cost and not an attack cost.
    best_known: >-
      Pollard rho with negation at 0.886*sqrt(N)/sqrt(2) group operations and
      O(1) memory (KN-TECH-001, KN-TECH-006), improved by at most a further
      sqrt(3) on j = 0 and sqrt(2) on j = 1728 by the automorphism quotient
      (KN-TECH-018).
    hidden_overhead: >-
      Three disclosed items - the minimal-degree measurement needs <P> in full,
      so it is toy-only by construction; the "evaluation cost is at least linear
      in the degree" step assumes the function is given by explicit coefficients
      and would be defeated by a short straight-line program for a high-degree
      function, which is the residue this record cannot close; and the
      multiplicative order r requires factoring N - 1, free at toy scale and not
      at cryptographic scale.
    tradeoff_note: >-
      van Oorschot-Wiener parallelisation applies unchanged to every arm and the
      orbit quotient neither helps nor hinders it, so the comparison is
      parallelisation-neutral. There is no new time-memory tradeoff.

  dominated_by: >-
    Pollard rho with negation dominates every arm of this experiment on time at
    equal memory, and on the automorphism cells the automorphism-discounted rho
    (KN-TECH-018) dominates by a further sqrt(3). Frontier rows checked as
    recorded in this corpus - BSGS (sqrt(N) time / sqrt(N) memory); van
    Oorschot-Wiener parallel rho on wall time; the multi-target frontier
    sqrt(L*N) (Kuhn-Struik, relayed via IDEA-20260802-005); the preprocessing
    frontier S*T^2 = Omega(epsilon*N) (Corrigan-Gibbs and Kogan, relayed via
    IDEA-20260802-005). All four rows dominate, so `null` is not available and is
    not written. The two external frontier citations were NOT independently
    re-verified this session because web search was unavailable.
  sota_delta:
    time_exponent: >-
      0 (no change) on the predicted branch. On the falsifying branch (c) the
      delta would be -delta/2 for a cheap invariant at r = N^{delta}; this record
      predicts that branch does not occur and refuses to quote its exponent as an
      expectation.
    memory_exponent: 0 (no change).
    data_or_query_exponent: 0 (no change).
    note: >-
      not_applicable as an exponent claim, and stated as such rather than dressed
      up. The deliverable is the closure of the second and last known
      canonicalisation route for orbit-quotient rho, with a measured mechanism
      and an exactly predicted calibration triple (2, 4, 6). Its priority rests on
      being the cheapest remaining decider of RQ-EWALK-8fa147 rather than on
      moving an exponent, and that is said plainly here as the search-heuristic
      guidance in agents/idea-generator.md requires.

  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Enumerating <P> at N below 2^14 and running rank computations over F_p on
    matrices of size at most (N-1) by (N/2) is seconds to a few minutes per cell
    in a computer-algebra system; with three curves, ten scalars, two function
    families, two nulls and three N values that is well under one CPU-hour. The
    isogeny-loop scalar generation reuses the class enumerator that
    EXP-ISOU-2ac81f and IDEA-20260812-a3720a already require. This is the
    cheapest decisive experiment in this batch.
  recommended_priority: high

  relation_to_existing_records:
    successor_to: >-
      IDEA-20260802-005 falsification condition N3, which names "a cheap
      invariant that selects a representative" as the open residue after the
      enumeration route is closed. This record supplies the instrument for
      exactly that residue.
    complements: >-
      IDEA-20260812-c49409, which measures the one cell where a cheap invariant
      DOES exist (the automorphism locus reached by vertical ascent) and charges
      the walk to it. Together the two say - the cheap invariant exists at exactly
      one vertex of the class, and only there.
    does_not_duplicate: >-
      EXP-ISOU-2ac81f, which measures solve cost across a complete class and
      explicitly segregates special-j members; this record measures an algebraic
      invariant of an orbit partition and does not need a complete class census.
