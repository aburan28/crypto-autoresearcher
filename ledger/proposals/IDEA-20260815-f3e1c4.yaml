idea:
  id: IDEA-20260815-f3e1c4
  question_id: RQ-ICEX-001
  added: '2026-08-15'
  title: >-
    THE LANE'S DECISION TARGET IS AN INTERVAL EXCLUDING 1/2 AND THAT IS A
    ONE-SIDED TEST WITH NO STATED ALTERNATIVE: write the decision rule with
    both error rates before any measurement is authorised
  class: theory

  claim: >-
    RQ-ICEX-001 will decide whether a charged exponent's interval excludes
    1/2. That is a hypothesis test, and it currently has no stated
    alternative, no significance level, and no power target. Without them
    the decision rule can be settled after seeing the data, which is the
    failure mode pre-registration exists to prevent and which matters most
    on a decision this consequential.

  mechanism: >-
    State the null and alternative explicitly, fix the significance level
    and the target power, and derive the required interval width. Pre-
    register the rule and check it against the lane's planned ladder using
    the power analysis already proposed for it.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of RQ-ICEX-001's decision target; grep 'pre-registration',
      'significance', 'power', 'decision rule'.
    results: >-
      The decision target is stated as an interval condition; no record
      states the alternative, level or power that make it a rule rather
      than an observation.
    verdict: >-
      ADAPTATION. Pre-registering a decision rule is standard methodology;
      the contribution is doing it for the lane whose decision this
      campaign is organised around.

  object_first_candidate:
    tracked_object: >-
      THE DECISION RULE ITSELF, stated with both error rates before any
      measurement.
    lossiness: >-
      An interval condition without a stated alternative projects a two-
      sided decision onto a one-sided observation, which is what allows
      the rule to move after the data arrives.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives entirely as a symbolic pre-registration; its value depends
      on being written before the measurement, which is the whole point.

  null_object_control: >-
    NULL 1 -- applying the rule to synthetic data with exponent exactly 1/2,
    where the false-exclusion rate must match the stated level. NULL 2 --
    synthetic data at the alternative, where the detection rate must match
    the stated power.

  discriminated_from:
    - >-
        The exponent-fit power analysis in this series, which computes
        what the ladder can resolve; this states what the lane will
        conclude from it, and the two together make the decision well
        posed.
    - >-
        The optimistic-instantiation record in this series, which bounds
        the verdict before measurement; this governs how the measurement
        itself will be read.

  assumptions:
    - >-
        A meaningful alternative can be stated; if the lane cannot say
        what exponent would count as index calculus winning, the decision
        target is not well posed and that is the finding.
    - >-
        The exponent estimator's distribution is characterisable well
        enough for error rates to be computed, which the companion power
        analysis supplies.

  predictions:
    - metric: >-
        null-at-one-half false-exclusion rate
      direction: different
      minimum_effect: >-
        FORCED to match the stated significance level; a higher rate
        means the rule is over-confident.
    - metric: >-
        detection rate at the stated alternative
      direction: different
      minimum_effect: >-
        FORCED to match the stated power.
    - metric: >-
        required interval width against what the planned ladder can
        deliver
      direction: different
      minimum_effect: >-
        The deliverable; if the ladder cannot deliver it, the decision
        is unreachable as specified and the lane must restate its
        target.
    - metric: >-
        whether a meaningful alternative can be stated at all
      direction: different
      minimum_effect: >-
        Reported explicitly; a lane that cannot say what would count as
        winning has a deeper problem than a missing rule.

  minimal_test:
    design: >-
      Symbolic pre-registration plus synthetic validation of both error
      rates, consuming the companion power analysis.
    controls:
      - >-
          Null-at-one-half false-exclusion validation.
      - >-
          Alternative-detection power validation.
      - >-
          The rule written and committed before any measurement is
          authorised.
      - >-
          Required width compared against the planned ladder's
          capability.
    required_metrics:
      - >-
          Stated null, alternative, significance level and power target.
      - >-
          Validated error rates on synthetic data.
      - >-
          Required interval width against ladder capability.

  falsification_conditions:
    - >-
        The false-exclusion rate exceeds the stated level. The rule is
        over-confident and would manufacture a positive.
    - >-
        No meaningful alternative can be stated. The decision target is
        not well posed and must be restated before any measurement is
        funded.
    - >-
        The required width exceeds what the ladder can deliver. The
        decision is unreachable as specified, which the campaign should
        know before spending on four deferred lanes to feed it.
    - >-
        The rule is well posed and the ladder can deliver it. The lane's
        decision is properly specified, which is what a consequential
        decision needs.

  confounders:
    - >-
        POST-HOC RULE ADJUSTMENT: the entire value of this record is that
        it is written first, and a rule adjusted after seeing data is
        worth nothing however well specified.
    - >-
        ALTERNATIVE CHOICE: the stated alternative determines the required
        power and hence the ladder, so choosing a generous alternative
        makes the decision cheap and meaningless.

  interpretation_limits:
    - >-
        A methodological pre-registration; produces no measurement and no
        evidence.
    - >-
        Its value is contingent on being committed before measurement.
    - >-
        A well-posed rule does not make the underlying comparison sound;
        the paired-design and cost-model records govern that.

  heuristic_assumptions:
    - id: HEUR-ICEX-RULE-1
      statement: >-
        The charged exponent estimator's sampling distribution is
        characterisable well enough to compute both error rates before
        measurement.
      rigorous_support: >-
        Rigorous ingredient: for a regression-based exponent estimator
        with known noise structure the sampling distribution is
        standard, giving computable error rates. THE GAP: the noise
        structure is estimated from existing toy runs, which the
        companion power analysis flags as systematically understating
        variance at larger sizes -- so both error rates inherit that
        optimism and the real false-exclusion rate is likely higher than
        the stated level.
      falsification_condition: >-
        Measured false-exclusion rate on synthetic data exceeding the
        stated significance level.
      validation_plan: >-
        SAMPLE: >= 1000 synthetic datasets at the null and at the
        alternative, across the noise levels the companion analysis
        sweeps. COMPARISON: empirical error rates against stated
        targets, per noise level. TAIL CHECK: the highest noise level,
        where the rule is weakest. TRANSFER: stated and unjustified
        beyond the modelled noise.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic plus synthetic validation; seconds of
      compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent decision rule exists; the lane states an interval
      condition without the alternative, level or power that would make it
      a rule.
    hidden_overhead: >-
      The noise model inherited from the companion power analysis carries
      a known optimism, which propagates into both error rates.
    tradeoff_note: >-
      A strict rule makes a positive meaningful and demands a longer
      ladder; a loose one is cheap and decides nothing. The record makes
      that trade explicit before it is made implicitly.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As statistics: entirely standard and
    dominated by the methodological literature. As a decision rule for this
    lane: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a pre-registered decision
    rule for the campaign's central comparison, with both error rates stated
    and validated on synthetic data, and the required interval width checked
    against what the planned ladder can actually deliver.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.6 that a meaningful alternative can be stated, which is the binding
    question and is more about the lane's scientific target than about
    statistics. 0.9 that error rates validate on synthetic data once the
    rule is written. 0.5 that the required width exceeds the planned ladder,
    which would show the campaign's central decision is unreachable as
    currently specified.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
