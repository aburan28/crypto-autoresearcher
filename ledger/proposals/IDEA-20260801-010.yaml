idea:
  id: IDEA-20260801-010
  question_id: RQ-FNDSA-001
  title: >-
    Sampler distributional exactness probe: statistical test of the FN-DSA
    Gaussian sampler's output against the ideal discrete Gaussian, independent
    of timing
  class: measurement
  claim: >-
    The FN-DSA sampler's output distribution can be tested against the ideal
    discrete Gaussian on the signature distribution's support using a
    statistical test that is independent of timing: collecting a large sample
    of the sampler's outputs (seeded, in a non-timing channel) and applying a
    goodness-of-fit test against the ideal discrete Gaussian either rejects
    the distributional-exactness assumption that carries FN-DSA's security or
    fails to reject it within the sample size. This decides whether the
    sampler's distributional error is a plausible attack surface, separately
    from timing leaks.
  mechanism: >-
    NTRUSign's break came from distributional, not timing, error. The FN-DSA
    sampler's output distribution is the corresponding assumption; the
    signature distribution being a non-exact discrete Gaussian opens a
    distinguishing attack on the secret. A seeded, timing-independent sample
    of the sampler's outputs permits a chi-square or Kolmogorov-Smirnov
    goodness-of-fit test against the ideal distribution; a rejection with
    sufficient power indicates a distributional defect, while a non-rejection
    bounds the defect below the sample's resolution.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal runs a distributional goodness-of-fit test on
        the FN-DSA sampler independent of timing.
    conclusion: >-
      Measurement proposal; novelty unverified against full literature; the
      NTRUSign analogy motivates the test but is not a claim of a break.
  assumptions:
    - The sampler is observable in a non-timing channel (seeded outputs).
    - The ideal discrete Gaussian over the sampler's support is computable.
  predictions:
    - metric: sampler_gof_p_value
      direction: lower
      minimum_effect: >-
        A p-value below 1e-3 with power >= 0.95 against a shift of one
        standard-deviation-scale distributional error constitutes a rejection
        signal.
  minimal_test:
    design: >-
      Collect >= 10^6 seeded sampler outputs; compute the ideal discrete
      Gaussian over the support; run chi-square and K-S goodness-of-fit;
      report p-values and the minimum distributional deviation detectable at
      that sample size.
    controls:
      - Test the test on a reference sampler that is exactly discrete-Gaussian
        (positive control, must not reject).
      - Test on a deliberately perturbed sampler (negative control, must
        reject).
    required_metrics:
      - chi-square and K-S p-values
      - minimum detectable deviation at the sample size
      - reference and perturbed control outcomes
  falsification_conditions:
    - Test rejects on the real sampler (distributional defect; attack surface
      exists).
    - Test fails to reject on the real sampler while rejecting the perturbed
      control (distributional exactness holds within resolution).
  confounders:
    - Seed determinism making the sample non-independent.
    - Support truncation changing the ideal distribution.
  interpretation_limits:
    - A non-rejection is a bound, not a proof of exactness.
    - Timing leaks are out of scope; this tests distribution only.
  heuristic_assumptions:
    - id: HEUR-FNDSA-GOF-1
      statement: >-
        The sampler's outputs are independent draws from a fixed distribution
        under fresh seeds.
      rigorous_support: None; standard statistical-testing assumption, checked
        by the independence diagnostics.
      validation_plan: Autocorrelation and seed-interleaving diagnostics on
        the sample.
  target_complexity:
    time_exponent: n/a (measurement)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a statistical bound on the sampler's
    distributional error, which either opens or closes the distributional
    attack surface.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
