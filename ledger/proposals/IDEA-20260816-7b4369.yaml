idea:
  id: IDEA-20260816-7b4369
  question_id: RQ-POLYMAC-7c89e4
  added: '2026-08-16'
  title: Locate the bound's tight region as a geometric object in the message-length by query-count
    plane, by mapping where the measured-to-bound ratio is nearest one in each field, and report the
    two fields' tight regions as overlapping or disjoint sets rather than as advice
  class: measurement
  claim: '(A) A forgery bound is a function of at least two parameters - message length L and query
    count q - and its tightness is not a scalar. The claim is that tightness is a REGION: the subset
    of the (L, q) plane on which the ratio of the exactly measured optimal forgery probability to
    the instantiated bound lies within a declared tolerance of one. (B) The claim is that this region
    is computable at scaled-down parameters, that it has a describable boundary (its shape along the
    L axis, along the q axis, and along the diagonal where both grow together), and that the region
    computed for a binary-extension arm and the region computed for a prime arm can be superimposed
    on a common (L, q) grid at matched log-cardinality. (C) The pairing claim is the specific deliverable:
    the symmetric difference of the two regions. If the two regions coincide, tightness at these parameters
    is a property of the polynomial-evaluation construction; if they do not, the non-overlapping part
    is a property of one field or of one encoding, and the record names which cells differ rather
    than asserting a cause. (D) A secondary, purely descriptive product is the set of (L, q) coordinates
    implied by any concrete data limit the Coordinator supplies from primary text, PLOTTED on the
    same map at their scaled-down images under the frozen scaling rule - that is a location, not a
    recommendation, and the contract forbids any sentence of the form therefore deployments should.
    (E) WHAT IS NOT CLAIMED: no deployment advice of any kind, which the bucket explicitly excludes;
    no claim that either bound is loose or tight where it is actually applied; no claim that the scaled-down
    image of a deployed coordinate is that coordinate; no attack; and no assertion about any protocol,
    library, or specification text beyond the arithmetic of placing a point on a grid.'
  mechanism: 'STAGE 1 reuses the exact root-set enumeration to obtain the optimal forgery probability
    at every node of an (L, q) grid, in both arms, at each tested width. STAGE 2 instantiates the
    pinned bound at the same nodes and forms the ratio. STAGE 3 defines the tight region as the set
    of nodes where the ratio lies in [1 - tau, 1] for a declared tolerance tau, and computes its boundary
    by scanning each axis; the tolerance is swept over three values so that the region''s sensitivity
    to tau is visible rather than hidden in a single choice. STAGE 4 superimposes the two arms'' regions
    at matched log-cardinality and computes the symmetric difference cell by cell. STAGE 5 maps any
    Coordinator-supplied deployed coordinate through the frozen scaling rule onto the grid and records
    its cell index and that cell''s ratio, with the projection label attached. STAGE 6 runs the random-function
    null over the identical grid: the null''s ratio is flat by construction, so its tight region is
    either the whole grid or empty depending on the bound''s constant, and either answer calibrates
    what the tolerance tau is actually selecting. Refutation: if the tight region is empty at every
    tau in both arms, the bound does not approach the measured optimum anywhere in the tested window,
    and the record reports the minimum achieved ratio and the coordinate where it occurs instead of
    a region.'
  novelty_status: unverified
  novelty_screen:
    method: Repository-wide greps for POLYMAC, GHASH, Poly1305 across ledger and knowledge as recorded
      for this batch; targeted greps for tight, tightness, rekeying, data limit and region across
      ledger/proposals and ledger/questions; read RQ-POLYMAC-7c89e4's decision_target and the GOAL-POLYMAC-001
      objective in full to check that the region framing is not already the goal's own stated deliverable.
    results: The anchor question and GOAL-POLYMAC-001 both ask for the RATIO and both mention where
      deployed limits sit, but neither defines tightness as a region with a boundary, and no ledger
      record anywhere holds a tightness map. The nine RQ-AEADC-8db132 proposals are about commitment,
      not about bounds in (L, q). IDEA-20260809-3a39bc mentions GOAL-POLYMAC-001 owning forgery bounds
      and stops there. No evidence record, hypothesis, or experiment directory contains an (L, q)
      grid of any kind for a MAC. The blacklisted RQ-INSTR-f8faa0 cost-model audits concern this program's
      own timings and are a different object entirely.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. What is claimed new WITHIN
      THIS REPOSITORY: tightness as a two-dimensional region with a measured boundary and a tolerance
      sweep, and the SYMMETRIC DIFFERENCE of two fields'' regions as the headline number. What is
      assembled from known parts: the ratio itself is the ratio-surface entry''s product in this same
      batch and is explicitly not re-claimed here - this record consumes it; grid mapping and tolerance
      sweeps are ordinary practice.'
  object_first_candidate:
    tracked_object: 'The INDICATOR FUNCTION of near-tightness on the (L, q) grid: a binary-valued
      function on grid nodes, one per arm per tolerance, whose support is the tight region. The object
      followed through the computation is that support set and its boundary, not the underlying probabilities.'
    lossiness: 'Lossy, and deliberately coarse. It discards the ratio''s actual value at every node,
      the identity of the maximising forgery, the field arithmetic, and everything about the messages
      - retaining only a yes/no per node. This is compatible with the target operation because the
      question being asked is a set question (where is the bound nearly attained) and not a value
      question, and because the discarded values are recorded separately as secondary metrics so the
      coarsening is auditable rather than destructive. It is not a change of coordinates: two arms
      with very different ratio surfaces can have identical tight regions, and that coincidence is
      exactly the kind of statement the object is built to make.'
    propagation: 'Increasing q by one moves each node''s underlying probability up by at most the
      largest achievable single-query root-set fraction, and moves the bound up by whatever its q-dependence
      is; the indicator therefore flips only where those two rates cross. So one step of the target
      operation acts on the tracked object by advancing the region''s boundary along the q axis at
      a rate equal to the difference of the two growth rates. The same holds along L with the degree
      ceiling as the numerator''s rate. The boundary''s slope is thus a directly interpretable quantity:
      it is the place where the measured growth rate and the bound''s growth rate agree.'
    survival_score: 'The region survives as a well-defined object across the whole tested grid and
      across the tolerance sweep. It DISSOLVES in three named places: where the enumeration stops
      being exhaustive (beyond the declared strategy family for large q), because then the indicator
      is computed from a lower bound and its support can only shrink; where the bound''s formula degenerates
      at small field size, because then the denominator is not the bound anyone applies; and at the
      grid edges, where the region''s boundary is an artifact of the window rather than of the mathematics
      - the contract requires the window be enlarged until the boundary is interior or the record
      states the boundary was never observed.'
  null_object_control: The random-function null runs on the identical grid in the same invocation.
    Its optimal forgery probability is independent of L and grows linearly in q, so its ratio surface
    is a known analytic shape and its tight region must be either the entire grid or empty, with the
    transition occurring at a tolerance the contract can predict in advance from the bound's constant.
    For the signal arms to mean anything the null must land on the predicted side at each tau; if
    the null's region has an interior boundary in L, the enumeration is producing L-dependence where
    none can exist and no signal cell is interpretable. A second control, a shuffled-grid arm in which
    the measured ratios are randomly permuted across nodes before region extraction, must produce
    a region with no connected boundary - establishing that the region-extraction code is detecting
    structure and not shape-fitting noise.
  discriminated_from:
  - 'The ratio-surface entry in this batch: that one produces R at grid nodes and is the input here.
    This record''s object is the support set of near-tightness and its cross-arm symmetric difference,
    which the ratio table alone does not state.'
  - 'Any restatement of a bound: this record computes no bound of its own and asserts no bound''s
    form; the bound is a pinned input and a declared derivation gap.'
  - 'Deployment guidance: explicitly excluded by the bucket and by this contract''s claim ceiling.
    The map records coordinates; it emits no recommendation and the falsification criteria include
    the presence of any prescriptive sentence.'
  - 'RQ-INSTR-f8faa0 cost-model audits (blacklisted): those measure this program''s own machine variance.
    Here nothing depends on wall clock at all, since every primary quantity is a counted cardinality.'
  - 'GOAL-POLYMAC-001''s own objective text, which asks for a ratio and mentions where deployed limits
    sit: this record is the concrete instrument for the second half and is filed as a proposal rather
    than treated as already done, because the goal is at status draft and holds no measurement.'
  assumptions:
  - The pinned bound is a function of (L, q, field size) that instantiates at toy parameters; otherwise
    no ratio and no region exist and the run reports that.
  - The exhaustive optimum is the true optimum at each node, or the indicator is computed from a lower
    bound and the region is a subset of the true region, which is stated wherever it applies.
  - A tolerance-based definition of near-tightness is meaningful; the three-value sweep is the defence
    against that assumption being load-bearing.
  - Matched log-cardinality is the right superposition rule for the two arms, fixed identically to
    the other contracts in this batch.
  predictions:
  - metric: null-arm tight region shape
    direction: different
    minimum_effect: the null region must be the whole grid or empty at each tau, with zero interior
      boundary in L; any interior L boundary invalidates the run
  - metric: shuffled-grid control region connectivity
    direction: lower
    minimum_effect: the largest connected component of the shuffled control's region must be at most
      25 percent of the size of the corresponding signal arm's largest component
  - metric: size of the symmetric difference of the two arms' tight regions, as a fraction of their
      union
    direction: different
    minimum_effect: 'no pre-commitment. Reason: this quantity depends on the bound''s exact form,
      which this record deliberately does not hold, so any number stated here would be invented.'
  - metric: boundary slope of the tight region along the q axis
    direction: different
    minimum_effect: the contract pre-commits only to reporting the slope with its grid resolution
      and to declaring the boundary unobserved if it lies outside the window
  minimal_test:
    design: Fix a single width n = 16 and a grid of L in {1, 2, 4, 8, 16, 32} by q in {1, 2, 4, 8},
      both arms, one tolerance tau = 0.1. Compute the exhaustive optimum at each node using the shared
      enumeration module, instantiate the bound, form the ratio, and threshold. Emit two binary grids
      and their symmetric difference, plus the null grid and the shuffled control. This is 48 nodes
      per arm and a few minutes of pure-Python work at n = 16. The discrimination is immediate and
      has three readings. If both arms' regions are identical, tightness at this width is construction-level
      and the pairing has done its job positively. If they differ, the differing cells are listed
      by coordinate and become the target for the padding and clamping entries in this batch, which
      are the two candidate causes. If both regions are empty at tau = 0.1, the record reports the
      grid's minimum ratio and its coordinate, which is a measured gap and a usable obstruction even
      though it produces no region at all.
    controls:
    - Random-function null arm on the identical grid, same invocation.
    - 'Shuffled-grid control: the same measured ratios randomly permuted across nodes before region
      extraction, 32 permutations.'
    - Tolerance sweep over tau in {0.02, 0.1, 0.3} so the region's dependence on the threshold is
      visible.
    - 'Window enlargement check: the grid is doubled along whichever axis shows a boundary at the
      edge, until the boundary is interior or the enlargement budget is exhausted.'
    - Both arms computed by one code path with the field as a parameter, so no arm-specific code can
      create an arm-specific region.
    required_metrics:
    - binary tight-region indicator per (arm, node, tau)
    - symmetric difference size as a fraction of the union, per tau
    - boundary coordinates along each axis, per arm
    - minimum and maximum ratio over the grid, per arm
    - null-arm region and shuffled-control largest connected component
  falsification_conditions:
  - The null arm's region has an interior boundary in L.
  - The shuffled control produces a connected region comparable in size to the signal arms.
  - The tight region changes qualitatively across the tolerance sweep in a way that makes the region
    undefined rather than merely resized.
  - The region's boundary lies at the grid edge in every arm after the enlargement budget, so no boundary
    was actually observed.
  - The bound cannot be instantiated at the tested width, so no ratio and no region exist.
  - Any prescriptive sentence about deployment appears in the emitted report, which is a contract
    violation and voids the record.
  confounders:
  - The tolerance choice can manufacture agreement or disagreement between arms; the sweep is the
    only defence and may be insufficient if the two arms' ratio surfaces have different slopes at
    the threshold.
  - 'Grid resolution: a coarse L ladder can hide a boundary entirely, and the doubling rule is bounded
    by budget.'
  - The two arms' achievable-difference families differ because of padding, so a region difference
    may be an encoding effect rather than a field effect - and this record cannot distinguish them,
    which is why it names the padding entry as the follow-up.
  - The scaled-down image of any deployed coordinate depends entirely on the frozen scaling rule,
    and a different rule moves the plotted point anywhere on the map.
  - Log-cardinality matching leaves a residual mismatch between 2^n and p that grows relative to the
    grid spacing at small n.
  interpretation_limits:
  - The region is a statement about the tested grid at the tested width with the pinned bound. It
    is not a statement about tightness at deployed parameters.
  - Plotting a scaled-down image of a deployed coordinate on the map is an arithmetic operation under
    a declared rule and carries no implication for the deployed setting; it is labelled a projection
    throughout.
  - 'A single-arm map is materially weaker and the record must say so: without the second field, a
    region is a fact about one field and one encoding at once, with no way to separate them.'
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Cost is the ratio-surface cost plus a negligible
      thresholding pass: O(grid * A * 2^n) field operations, dominated by the shared enumeration.'
    memory_exponent: 'No attack memory exponent is claimed. Two binary grids of at most a few hundred
      nodes plus the shared bitmaps: O(2^n) bits transient.'
    best_known: The incumbent is a bound quoted as a scalar at a single operating point. Within this
      repository the incumbents are the relayed abstract statements in KN-LIT-5652 and KN-LIT-7035,
      both at confidence reported, neither of which this record restates or relies upon.
    hidden_overhead: The window-enlargement rule can quietly multiply the compute by four; and the
      human cost of freezing a scaling rule that will be used to plot deployed coordinates is high
      precisely because that rule is what makes the plotted point meaningful or meaningless.
  dominated_by: n/a (no result claimed). The Pareto check covered every polymac-relevant row this
    repository holds - KN-LIT-4060, KN-LIT-5652, KN-LIT-7035, KN-LIT-1337, KN-LIT-4188, KN-LIT-1445,
    and the nine RQ-AEADC-8db132 proposals - and none of them occupies a time, memory or query frontier
    that a region map competes on, because a region map is not an algorithm. No attack is claimed,
    so there is no frontier position to dominate.
  sota_delta: No attack; measurement contribution only. Delta is from zero tightness maps in the ledger
    to two thresholded (L, q) regions per tolerance in two fields with a null and a shuffled control,
    plus a symmetric-difference number.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'By part. That a well-defined region can be extracted at all, given a
    bound that instantiates: about 0.8. That the bound instantiates at toy width in the first place:
    about 0.6, carried over from the ratio-surface entry and genuinely uncertain. That the null and
    shuffled controls both behave as required, making the region interpretable: about 0.75. That the
    two arms'' regions differ measurably: about 0.5, and if they do, this record cannot say why -
    it can only hand the differing coordinates to the padding and clamping entries, which is a deliberate
    division of labour rather than a weakness. That the record survives red team without a single
    prescriptive sentence creeping in: about 0.7, and that is a real risk given the subject matter.'
