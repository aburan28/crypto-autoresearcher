  predictions:
    - id: P1
      statement: >-
        Under the genuine simulator null and valid candidate laws, the true
        label is ever eliminated in at most 0.05 of trials at total alpha 0.05.
      metric: anytime family-wise true-label elimination rate
      threshold: upper endpoint of reported 95 percent interval <= 0.05
      test_boundary: N <= 1024 and q <= 2048 held-out transcripts
    - id: P2
      statement: >-
        With a planted per-transcript betting edge of 0.06, median surviving
        list size is at most 0.50 N by q = 512 while planted-label survival is
        at least 0.95.
      metric: surviving fraction and planted-label coverage
      threshold: surviving fraction <= 0.50 and coverage >= 0.95
      test_boundary: preregistered planted positive family
    - id: P3
      statement: >-
        Reusing held-out transcripts for bet selection inflates false
        elimination by at least 2 times in the calibrated overfit positive,
        which the disjoint firewall removes.
      metric: false-elimination rate ratio
      threshold: reuse rate / firewall rate >= 2.0
      test_boundary: planted adaptive-overfit control
  controls:
    - genuine-simulator null with candidate labels hidden from bet training
    - planted positive with betting edge varied continuously from 0 to 0.06
    - adaptive-overfit positive comparing transcript reuse with strict holdout
    - fixed-horizon Bonferroni test as a non-anytime baseline
    - constant-one e-process that must eliminate no candidate
    - nearby candidate family with identical held-out laws but different training artifacts
    - public-curve reproduction for every surviving ideal
  falsification_conditions:
    - any e-process fails the supermartingale audit under its candidate law
    - null anytime error exceeds the allocated alpha boundary
    - firewall does not remove the calibrated reuse artifact
    - planted edge fails to shrink the list at the declared q boundary
  confounders:
    - accidental overlap between training and held-out transcripts
    - candidate-dependent stopping rules not included in the proof
    - numerical underflow in multiplicative e-process updates
    - target ideal absent from the enumerated set
  interpretation_limits:
    - martingale validity for production transcripts is not established
    - list contraction does not imply secret-key recovery
    - no timing, retry-count, or secret-state oracle is admitted
    - no SSI hard-problem or verified GRH claim is made
  heuristic_assumptions:
    - held-out transcripts are conditionally generated by the stated candidate law
    - all adaptive choices use only the training stream or past held-out data allowed by predictability
    - numerical updates preserve the nonnegative supermartingale guarantee
  target_complexity:
    baseline: fixed-q evaluation of every one of N candidates
    proposed: anytime stopping with the same worst-case O(N q) score updates
    success_probability: at least 1-alpha only if the e-process premises hold
  cost_model:
    time: O(N) frozen-bet updates per held-out transcript until stopping
    memory: O(N) e-values, candidates, and witness state
    data: disjoint training and held-out transcript streams
    preprocessing: candidate enumeration, bet training, and alpha allocation
    oracle_access: public transcript access only
    verification: martingale simulation, fixed-horizon comparison, and curve reproduction
  proof_search_map:
    baseline_reproduction: reproduce fixed-horizon family-wise error before optional stopping
    observation_collision_search: retain candidates whose held-out likelihood processes coincide
    quantifier_order: fix candidate set, alpha allocation, firewall, and query cap before evaluation
    method_ceiling: exhibit indistinguishable candidate laws for which every e-process stays near one
    nearby_object_control: run on training-different but held-out-identical candidates
  nearest_neighbors:
