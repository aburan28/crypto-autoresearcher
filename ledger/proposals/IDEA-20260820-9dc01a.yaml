idea:
  id: IDEA-20260820-9dc01a
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Anytime e-process elimination with a held-out transcript firewall
  class: sequential-statistical algorithm proposal
  claim: >-
    Given a fixed finite candidate set and candidate-wise test martingales that
    are valid under each candidate law, an anytime elimination rule using a
    disjoint held-out transcript stream can control erroneous elimination while
    producing a coverage-certified surviving list. This is conditional on the
    martingale laws and does not establish real SQIsign leakage.
  corrects: IDEA-20260820-2b64b9
  supersedes: null
  correction: >-
    Preserves the predecessor's anytime candidate elimination, e-process
    accounting, and held-out firewall. It adds complete citation verification
    metadata and replaces the unsupported GRH language with the exact boundary:
    KN-TECH-058 records inherited and unverified reductions and supplies no
    verified GRH premise for this proposal.
  mechanism: >-
    Before evaluation, enumerate a finite ideal set C and allocate error alpha_I
    across candidates. Use a training stream only to choose bounded betting
    functions. Freeze them, then update a candidate-wise e-process E_t(I) on a
    disjoint held-out stream. Eliminate I only when E_t(I) >= 1/alpha_I. Ville's
    inequality then supplies the intended anytime error control if E_t(I) is a
    nonnegative supermartingale under candidate I. Stop at a preregistered query
    cap or list size and return surviving ideals with public-curve witnesses.
  novelty_status: unverified
  status: proposed
