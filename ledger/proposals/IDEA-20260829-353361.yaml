idea:
  id: IDEA-20260829-353361
  question_id: RQ-MLKEM-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed

  title: >-
    ML-KEM sits at module-BKZ block RANK TWO, so the d-1 penalty that answers
    Kyber's Q8 negatively is being read off an asymptotic in beta at
    beta/d = 2.4: measure the concrete offset beta_mod - beta as a function of
    (field degree d, module rank r) with the Ducas-Engelberts-de Perthuis
    released implementation, and decide whether the penalty is 255, is 30, or
    changes sign

  class: measurement

  claim: >-
    (A) THE GATE NOBODY HAS OPENED. Ducas, Engelberts and de Perthuis (eprint
    2025/1904, October 2025, revised February 2026) conclude that for
    power-of-two cyclotomic fields module-BKZ "requires a blocksize larger than
    its unstructured counterpart by d - 1 + o(1)". Applied naively to ML-KEM
    this is a 255-blocksize penalty and a 2^(0.292 * 255) = 2^74.5 core-SVP
    slowdown, and it closes the module-BKZ lane outright. The claim of this
    proposal is that this reading is NOT YET LICENSED at ML-KEM's parameters and
    that the licensing question is cheap, decisive, and unasked. The DEP
    statement is an asymptotic in the blocksize beta at fixed field degree d.
    ML-KEM-768's published attack blocksize is about 623 against d = 256, so
    beta/d = 2.43; ML-KEM-512 gives 406/256 = 1.59 and ML-KEM-1024 gives
    873/256 = 3.41. Module-BKZ block RANK is r = beta_mod/d, so ML-KEM is run
    entirely at r in {2, 3, 4} - the regime where module-BKZ is barely more than
    module-LLL and where "asymptotic in beta" has had one or two doublings to
    take effect, not many.
    (B) THE FALSIFIABLE STATEMENT. Define the CONCRETE MODULE OFFSET
    Delta(d, r) as the difference between the unstructured BKZ blocksize and the
    module-BKZ SVP-oracle dimension that produce the SAME measured log-profile
    slope on random q-ary module lattices of rank r over a degree-d
    power-of-two cyclotomic field, at q = 3329 with CBD-shaped planted secrets.
    The claim is that Delta(d, r) is measurable at d in {4, 8, 16, 32} and
    r in {2, 3, 4, 5} with DEP's own released implementation and admits a fit in
    (d, r), and that the fit discriminates three mutually exclusive hypotheses:
    H_ASYMPTOTIC - Delta(d, r) = d - 1 + small, essentially independent of r,
    in which case the naive reading is right, ML-KEM's penalty is 255, and the
    entire module-BKZ family (including the base-order arbitrage of
    IDEA-20260829-1ebebd) is closed by a single number;
    H_RANK_LIMITED - Delta(d, r) grows with r and is materially SMALLER than
    d - 1 at r in {2, 3, 4}, e.g. Delta(d, 2) below d/4, in which case ML-KEM's
    true penalty is tens of blocksize units rather than 255, the closure is
    quantitatively wrong, and module-BKZ becomes a live low-cost lane whose
    residual constant-factor gains (automorphism-quotient sieving inside a
    block, cheaper non-SVP BKZ bookkeeping on d-times-smaller matrices) are
    worth measuring;
    H_SIGN_CHANGE - Delta(d, r) < 0 for some (d, r) in the tested range, i.e.
    module-BKZ at small block rank BEATS unstructured BKZ even over a
    power-of-two cyclotomic field, contradicting the asymptotic and making the
    module structure of ML-KEM an exploitable liability at exactly the block
    ranks the real attack uses.
    (C) WHY THIS IS A GATE AND NOT AN ATTACK. This record makes no complexity
    claim of its own and explicitly does not qualify as target-class under
    docs/target-result-profile.md A1. It is a required building block: it is the
    ONLY measurement that decides whether a whole family - every algebraic
    reduction strategy priced by the DEP law, including IDEA-20260829-1ebebd's
    base-order arbitrage - is worth any further compute at ML-KEM parameters.
    Under H_ASYMPTOTIC the family closes at a cost of a few CPU-days, which is
    the cheapest closure available anywhere in this lane. That is its
    justification for priority despite being non-target-class.

  mechanism: >-
    LOSSY-PROJECTION TEST. The tracked object is the ALGEBRAIC LOG-PROFILE: the
    sequence (log ||b*_1||, ..., log ||b*_r||) of the r Gram-Schmidt norms of a
    module basis over O_K, one per rank-1 block, rather than the Z-rank
    r*d profile. This projection discards, per block, everything about the d
    Z-dimensions inside it except a single scalar - the block's normalized
    covolume - so it throws away a factor d of the state and is genuinely lossy.
    It is discarded compatibly with the operations: module-BKZ's basis updates
    are O_K-linear and act on whole blocks, so the r-term algebraic profile
    propagates deterministically under them, which is exactly the content of
    DEP's algebraic GSA. The projection is NOT a change of coordinates - the
    Z-profile cannot be recovered from the algebraic profile, and the gap
    between them is the discriminant term the DEP law is about.
    WHY THE NUMBER IS IN DOUBT. Two independent reasons, both structural rather
    than a hunch. First, the residual d - 1 has the exact form of a GRANULARITY
    penalty: module-BKZ's SVP oracle acts on free blocks of Z-dimension r*d, so
    the reachable oracle dimensions are 256, 512, 768, ... and an unstructured
    blocksize of 623 must be rounded up to 768. A rounding penalty of at most
    d - 1 is a WORST-CASE over the residue of beta modulo d, and its expected
    value over the parameter sets is d/2, and its realized value at a specific
    beta is (-beta) mod d - for beta = 623 and d = 256 that is 145, not 255.
    Whether DEP's d - 1 is a worst-case bound of this shape or a genuine
    slope-level loss is exactly what the abstract does not say and what the
    measurement decides. Second, at r = 2 the module-BKZ "block" is the whole
    rank-2 module and module-BKZ degenerates to rank-2 module reduction, for
    which Lee-Pellet-Mary-Stehle-Wallet-style algorithms have qualitatively
    different behaviour from block reduction at large r; an asymptotic in beta
    derived for r growing need not describe r = 2 at all.
    HOW THE MEASUREMENT IS MADE MATCHED. For each cell (d, r), generate random
    q-ary module lattices with q = 3329 and a planted CBD_2 secret, run DEP's
    module-BKZ at oracle dimension m*d for m = 1, 2, 3, ... and record the fitted
    log-profile slope; independently run fplll/G6K unstructured BKZ on the SAME
    lattices at a sweep of blocksizes and record the same fitted slope; define
    Delta(d, r) by interpolating the unstructured blocksize whose slope matches.
    Both arms consume the identical lattices, the identical slope estimator, and
    the identical fitting window, so the difference is a difference of
    algorithms and not of accounting.

  novelty_status: unverified

  citations:
    - ref: 'eprint 2025/1904 (arXiv 2510.10540), Ducas, Engelberts, de Perthuis, "Predicting Module-Lattice Reduction"'
      provenance: retrieved
      claim: >-
        Module-BKZ over K of degree d needs SVP-oracle dimension
        beta + log(|Delta_K|/d^d) * beta/(d log beta) + o(beta/log beta) to
        match unstructured BKZ at blocksize beta; for power-of-two cyclotomics
        |Delta_K| = d^d and the required blocksize is larger by d - 1 + o(1);
        the work provides "the first open-source implementation of module-BKZ
        for some cyclotomic fields" and predicts concretely "using
        experimentally verified heuristics"; it explicitly targets Kyber's Q8.
      verified_by: >-
        WebFetch of https://eprint.iacr.org/2025/1904 and
        https://arxiv.org/abs/2510.10540 on 2026-08-29; abstract returned
        verbatim from both and the two agree. Paper BODY NOT READ. The claim
        that the paper does not already tabulate ML-KEM parameters comes from
        the fetch tool's reading of the landing page only and is NOT reliable.
    - ref: 'Lee, Pellet-Mary, Stehle, Wallet, "An LLL Algorithm for Module Lattices" (ASIACRYPT 2019); Mukherjee, Stephens-Davidowitz, "Lattice Reduction for Modules" (CRYPTO 2020)'
      provenance: recalled
      claim: >-
        Establish existence of module analogues of LLL and of block reduction,
        with worst-case provable guarantees; cited by DEP as the foundational
        works whose average-case behaviour DEP analyse. Relied on here only for
        the qualitative point that rank-2 module reduction is a distinct regime.
        Not fetched this session.
      verified_by: null
    - ref: IDEA-20260829-1ebebd
      provenance: internal
      claim: >-
        The companion base-order-arbitrage proposal, whose entire pricing is
