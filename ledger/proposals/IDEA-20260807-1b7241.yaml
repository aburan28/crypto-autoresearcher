idea:
  id: IDEA-20260807-1b7241
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    THE LANE'S CLOSURE, WITH AN EXPLICIT SIMULATOR RATHER THAN A FAILED
    REDUCTION COUNT: in a curve-aware generic group model where the adversary
    receives the entire isogeny class in the clear plus free vectorization and
    action oracles, but touches G only through a generic encoding, the
    curve-level view is a deterministic function of (p, E, t) and is therefore
    INDEPENDENT of k -- so the simulator computes it itself and Shoup's
    Omega(sqrt N) survives untouched; the residual open class is named
    precisely and is non-empty
  class: mechanism

  claim: >-
    (A) WHY A SIMULATOR AND NOT A LIST OF FAILED ATTEMPTS. The inventor
    protocol's closure standard (docs/inventor-protocol.md section 4;
    KN-TECH-056) is explicit that a count of screened-and-rejected mechanisms
    is a fatigue report whose honest status is `unverified`. A closure needs a
    named obstruction, an argument, and forward guidance. This record supplies
    all three, and the argument is a SIMULATOR -- the same instrument that
    closed the incidence and endomorphism-image oracle classes in
    KN-FIND-b7e091 -- applied to a genuinely new and much stronger oracle.

    (B) THE MODEL, STATED PRECISELY BECAUSE THE WHOLE RESULT IS SCOPED BY IT.
    Call it CAGG (curve-aware generic group with class-group action). An
    adversary A in CAGG receives, in the clear and for free:
      - p, the Weierstrass equation of E, the trace t, D = t^2 - 4p, the order
        O = End_{F_p}(E), and h = h(O);
      - explicit equations for EVERY curve in the isogeny class with End = O
        (all h of them), and the full ell-volcano structure for every small
        ell;
      - an ACTION oracle Act([a], E_1) returning [a] * E_1, at unit cost;
      - a VECTORIZATION oracle Vec(E_1, E_2) returning the unique [a] with
        [a] * E_1 = E_2, at unit cost -- an oracle strictly stronger than any
        known classical or quantum algorithm;
      - the group order N and the structure of Cl(O).
    A accesses the subgroup G = <P> ONLY through a generic encoding: a random
    injective sigma : Z/N -> S, handles sigma(1) for P and sigma(k) for Q, and
    oracles for the group operation and for equality. A does NOT receive the
    affine coordinates of the encoded points. That last restriction is the
    model's entire content and is discussed in (E).

    (C) THE SIMULATOR, AND IT IS SHORT. Let A be any CAGG adversary making q
    generic-group queries. Build a Shoup-model adversary A' making q queries:
      1. A' is given N and generic handles for P and Q, nothing else.
      2. A' SAMPLES the curve-level world itself. It picks any p, E, t
         consistent with N -- or, in the non-uniform version, has (p, E, t)
         hardwired -- computes the isogeny class, Cl(O), the volcano, and
         implements Act and Vec in the clear by its own computation. No
         oracle is needed: these are functions of (p, E, t) alone.
      3. A' runs A, answering every curve-level query from step 2 and
         forwarding every generic-group query to its own oracle.
      4. A' outputs whatever A outputs.
    A' perfectly simulates A's view, because the curve-level view V(p, E, t)
    is a DETERMINISTIC FUNCTION OF (p, E, t) with no dependence on k, and k is
    uniform on Z/N given the curve. Formally: the joint distribution of
    (V, k) is the product of a point mass at V and the uniform distribution on
    k, so conditioning on V leaves k uniform. Hence A' has the same success
    probability as A with the same query count, and Shoup's bound applies:
        Pr[A recovers k] = O(q^2 / N),
    so q = Omega(sqrt(N)). THE VECTORIZATION ORACLE IS WORTH EXACTLY NOTHING
    IN THIS MODEL.

    (D) THE NAMED OBSTRUCTION. Call it OBS-6, the PRODUCT-STRUCTURE
    OBSTRUCTION: the ECDLP instance space over a fixed isogeny class factors
    as (curve coordinate in a Cl(O)-torsor) x (answer k in Z/N), the
    class-group action moves only the first factor, and k is a Cl(O)-INVARIANT
    of the instance (this is precisely transport theorem T1 of the campaign's
    decomposition: an isogeny carries (E,P,Q,k) to (E',phi P,phi Q,k) with the
    SAME k). A symmetry group that acts trivially on the answer space confers
    no search advantage. The contrast that proves the statement is not vacuous:
    Aut(E) acts NON-trivially on the answer space (identifying P with zeta P
    shrinks the search by |Aut|), which is exactly why it buys the
    sqrt(|Aut|) <= sqrt(6) discount of KN-TECH-018 -- and Cl(O), of order
    h ~ sqrt(p), buys nothing at all despite being astronomically larger. The
    relevant quantity is the ORBIT OF THE ANSWER, not the size of the group.

    (E) THE MODEL'S ONE REAL RESTRICTION, AND THE RESIDUAL OPEN CLASS. In
    CAGG the adversary cannot turn a POINT into a CURVE, because it never sees
    x(Q) as a field element. In reality it does. So the honest reading of (C)
    is: any bridge from ECDLP to the class group must pass through the
    CONCRETE REPRESENTATION of points -- resource R1, x-coordinates as field
    elements -- and not through their group-theoretic content. That is the
    forward guidance this closure owes, it is precise, and the class is
    NON-EMPTY: IDEA-20260807-326442, filed in this same batch, is a concrete
    member of it (multi-curve factor bases), and the R1 lanes L1/L4/L11 own the
    rest. Two further classes remain outside the model and are named rather
    than swept up: multi-instance/preprocessing adversaries across a class
    (lane L13, resource R8), and adversaries whose queries depend on the
    concrete encoding of S. Naming three residual classes is what separates
    this from a fatigue report.

    (F) WHAT THIS IS NOT. It is not a lower bound on the ECDLP. It is not a
    claim that no reduction exists. It is a statement that ONE specific and
    very powerful resource -- the exact class-group coordinate of any curve --
    is generic-group-simulable relative to the point group, and is therefore
    closed at exponent 1/2 in the same sense as KN-FIND-b7e091's two oracle
    classes.

  resource_label: >-
    Audit: consumes no resource. This proposal EXTENDS the campaign's
    admissibility filter to a new oracle class (R4, the class-group action and
    vectorization) rather than consuming it. It is an L12-style audit executed
    inside L10, which is where its target lives.
  admissibility: inadmissible_generic_group
  admissibility_argument: >-
    The verdict applies to the ORACLE CLASS under audit, not to the audit. The
    vectorization and action oracles are shown CAGG-simulable by the explicit
    simulator in (C), hence closed at exponent 1/2 by Shoup exactly as the
    incidence and endomorphism-image oracles were in KN-FIND-b7e091 and
    DEC-20260804-3b4258. This is a strictly stronger statement than
    H-ENDO-001's scalar collapse, which concerns endomorphisms acting ON G:
    here the oracle never touches G at all, and it is still worthless, for the
    independent reason that its answers are k-independent. Recording the
    verdict as `inadmissible_generic_group` is the campaign-correct label and
    the brief directs that such a proposal be filed anyway as a recorded
    closure with its obstruction named.

  discriminated_from:
    - >-
      KN-FIND-b7e091 / EV-GGM-79e710 / DEC-20260804-3b4258, which simulate the
      INCIDENCE oracle (factor-base subset sums) and the ENDOMORPHISM-IMAGE
      oracle (phi(G), phi(Q)). Both of those oracles return GROUP ELEMENTS and
      are simulated by group operations. The vectorization oracle returns an
      element of Cl(O) and is simulated by an entirely different argument -- a
      product-structure/independence argument, not a group-operation count.
      Same instrument, new and structurally different target.
    - >-
      H-ENDO-001, which is a LATTICE statement about endomorphisms acting on G
      as scalars. Nothing here acts on G. The two closures are independent and
      neither implies the other.
    - >-
      IDEA-20260807-5d7606 and IDEA-20260807-0fafe8, which attempt explicit
      reductions and name obstructions specific to each direction. This record
      is stronger in one respect (it rules out a whole model rather than one
      construction) and weaker in another (it is scoped by CAGG's restriction,
      which those records are not). The three are complementary and the batch
      files all three deliberately.
    - >-
      Lane L12 (RQ-GGMB-6eaabc), which owns the campaign's simulability audits
      generally. This record executes an L12-style audit on L10's specific
      oracle; it does not claim L12's lane and the two should be
      cross-referenced by the coordinator.

  object_first_candidate:
    tracked_object: >-
      THE ADVERSARY'S VIEW, split into its curve-level component V and its
      generic-group component. The tracked object is the pair (V, transcript
      of group-oracle answers), followed as the adversary runs.
    lossiness: >-
      LOSSY IN THE DECISIVE WAY: V forgets k entirely. That is not an
      assumption, it is the content -- V is a function of (p, E, t) and the
      instance family holds those fixed while k varies. What V discards is
      discarded compatibly with the target's operations because every
      operation the adversary can perform on curves (act, vectorize, walk,
      twist, quotient by a named subgroup) maps V to V without consulting k.
      It is emphatically not a change of coordinates: an entire oracle
      collapses to something the simulator can compute for free.
    propagation: >-
      One-step propagation is defined and measurable: apply any curve-level
      operation and ask whether V changed in a way that depends on k. It never
      does. On the generic side, one step is one group-oracle query and the
      propagation is Shoup's standard polynomial-in-the-handles bookkeeping.
      The two components propagate independently, which IS the product
      structure.
    survival_score: >-
      Survives every curve-level operation, every oracle strength (the result
      holds for a PERFECT vectorization oracle, which no algorithm achieves),
      and every h. DIES the instant the adversary is handed x(Q) as a field
      element, because then a curve-valued function of k becomes conceivable.
      That single, sharp death condition is the residual open class in (E) and
      is why the closure is scoped rather than absolute.

  mechanism: >-
    STEP 1 (zero compute). Write the CAGG model down formally: the exact
    interfaces, the exact free information, the exact restriction. A model
    that is not pinned cannot be the scope of a closure.

    STEP 2 (zero compute, THE ARGUMENT). Prove the simulation lemma of (C).
    Two checks are the whole risk and both must be done explicitly rather than
    waved at:
      (i) EVERY oracle in the model is a function of (p, E, t) alone -- verify
          interface by interface, including the volcano data and the class
          group structure;
      (ii) the simulator's reconstruction is EFFICIENT ENOUGH for the claimed
          statement. Note honestly: computing the whole class costs
          poly(p)-ish at toy scale and L_p(1/2) or worse at crypto scale, so
          the simulation is TIGHT for the query-complexity statement (which is
          what Shoup bounds) and LOOSE for a time-complexity statement. The
          record claims only the query-complexity version, and says so in the
          method ceiling. Getting this distinction wrong is the single most
          likely way this argument fails, so it is pinned here.

    STEP 3 (zero compute). Derive OBS-6 in the symmetry form: define the
    action of Cl(O) on instances, verify k is invariant (this is T1), and
    state the orbit-of-the-answer principle with the Aut(E) contrast as the
    non-vacuity witness.

    STEP 4 (toy compute, THE EMPIRICAL FACE OF A SYMBOLIC RESULT). The
    simulation lemma predicts a measurable thing: an ECDLP solver that is
    ALLOWED to use the class-group action must not beat one that is not.
    Implement a CLASS-AUGMENTED RHO: a Pollard rho whose state is (curve,
    point) and whose steps are, with probability 1 - q an ordinary pseudo-
    random group step on the current curve, and with probability q an isogeny
    step to an adjacent curve carrying the point along by T1 transport.
    Measure total cost to solve, in a unit that charges an isogeny step its
    true price, against plain rho on identical instances and seeds.
    PREDICTED: strictly WORSE, by the factor (1 + q * (cost of an isogeny step
    / cost of a point addition - 1)), i.e. the augmentation is pure overhead.
    A class-augmented walk that solves FASTER than plain rho at equal charged
    cost would contradict OBS-6 and is the one outcome worth escalating.

    STEP 5 (zero compute). Write the three residual open classes of (E) with
    pointers, so the closure carries forward guidance and not just a verdict.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "GGM|generic group|Shoup|simulable|simulator"; "vectoriz";
      "class group"; "KN-FIND-b7e091". Full reads: KN-FIND-b7e091,
      H-ENDO-001, KN-TECH-027, DECOMPOSITION.md sections 2-4, RQ-GGMB-6eaabc,
      RQ-CLGP-b99df5.
    results: >-
      KN-FIND-b7e091 closes exactly two oracle classes -- incidence and
      endomorphism-image -- and neither is a vectorization or class-group
      action oracle. No record in ledger/ or knowledge/ defines a curve-aware
      generic group model or simulates a class-group oracle. DECOMPOSITION.md
      section 4 opens lane L12 as the campaign's internal falsifier and says
      explicitly that it "extends KN-FIND-b7e091 to the NEW oracle classes the
      other lanes invent" -- which is precisely what this record does, for
      L10's oracle.
    verdict: >-
      ADAPTATION. Shoup's bound and the simulation technique are standard and
      are not claimed as new; KN-FIND-b7e091 established the pattern inside
      this program. New to this corpus: the CAGG model, the simulation of a
      vectorization oracle by a product-structure argument rather than a
      group-operation count, OBS-6 in its symmetry form with the Aut(E)
      contrast, and the class-augmented rho as the empirical face of the
      lemma. No external novelty is claimed; curve-aware generic models exist
      in the literature in other forms and a citation for one would be a
      welcome ingredient rather than a defeat.

  null_object_control: >-
    MANDATORY AND BLOCKING, and it must be a PLANTED-BRIDGE MODEL because the
    prediction is a null. Define CAGG+ identically to CAGG except that the
    adversary additionally receives one extra oracle Leak(Q) returning
    ([k mod M] embedded in Cl(O)) for a planted modulus M | h. In CAGG+ the
    simulator provably FAILS (the extra oracle is not a function of (p,E,t)),
    and a class-augmented solver provably beats plain rho by the accounting of
    IDEA-20260807-bbdcf3. The Step 4 harness must be run in BOTH models: it
    must show no benefit in CAGG and a measurable benefit in CAGG+. A harness
    that shows no benefit in CAGG+ cannot detect a benefit at all, so its
    CAGG null is void and the run set is INVALID rather than negative.
    DECAY PARAMETER: M. As M decreases to 1, the measured CAGG+ benefit must
    decay to zero. A benefit that persists at M = 1 means the harness is
    leaking k through the instance generator or the seed schedule -- the
    canonical artifact tell -- and everything downstream is void.
    MATCHED SHAPE: CAGG+ differs from CAGG in exactly one interface, so the
    null object has the same shape as the object.

  assumptions:
    - >-
      Shoup's generic group lower bound applies to the point-group component:
      any algorithm using only group operations and equality tests on a
      cyclic group of prime order N needs Omega(sqrt N) queries. Named public
      theorem (Shoup 1997), used exactly as KN-FIND-b7e091 uses it.
    - >-
      The curve-level view is a deterministic function of (p, E, t). This is
      checked interface by interface in Step 2(i) rather than assumed, and it
      is the load-bearing hypothesis: an interface that secretly depended on
      the encoding sigma would break the simulation.
    - >-
      The result is a QUERY-COMPLEXITY statement. The simulator's own running
      time is not polynomial at crypto scale (reconstructing the class costs
      at least L_p(1/2)). This is disclosed, and the record never states a
      time-complexity closure.
    - >-
      Ordinary curves with End_{F_p}(E) = O, Cl(O) acting freely and
      transitively on the O-stratum (Deuring/Waterhouse/Kohel).
    - >-
      T1 transport (the campaign's decomposition, section 3): for an isogeny
      of degree coprime to N, phi restricted to G is injective and
      phi(Q) = [k] phi(P) with the SAME k. This is elementary and is what
      makes k a Cl(O)-invariant.

  proof_search_map:
    bottleneck: >-
      Step 2(i): the interface-by-interface verification that nothing in the
      curve-level view depends on the encoding sigma or on k. The simulation
      is trivial once that holds and false if any interface violates it. This
      is where a red team should look first, and the most promising attack is
      to find an interface that lets the adversary EXPORT a handle into the
      curve world.
    baseline_embedding:
      parameter_slice: >-
        h = 1 (the isogeny class contains a single curve with End = O). CAGG
        then degenerates to the plain Shoup model, Vec and Act are trivial,
        and the bound must reduce exactly to Omega(sqrt N). If it does not,
        the model is malformed.
      reproduction_check: >-
        Frozen fixture: three toy instances with h = 1 or 2, run through the
        Step 4 harness in CAGG mode; the measured cost must match plain rho at
        0.886 sqrt(N) within 20 percent, and the class-augmented arm must
        coincide with the plain arm because there is nowhere to walk.
    observation_collision:
      observable: >-
        The adversary's curve-level view V(p, E, t).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED COMPLETELY: find two instances with
        the same V but different k. Predicted: for a fixed curve, ALL N-1
        nonzero values of k share the identical V, so the fibre of the
        observable over V is the entire instance family. Maximal collision.
        That is the simulation lemma restated as a fibration and it is the
        cleanest possible statement of the closure. A single pair of instances
        with the same (p,E,t) and distinguishable V would refute the lemma and
        must be reported immediately.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "does the class-group action help ECDLP" into the generic group
          model, where it becomes "is the class-group view simulable", a
          question with a two-line answer.
        predicted_gain: >-
          Converts an open-ended search over reduction strategies into one
          checkable lemma, at zero compute. The gain is entirely in the
          strength and finality of the statement, not in attack cost.
      - transform: observable_fiber
        proposed_object: >-
          The fibre V^{-1}(V_0) inside the instance family, shown to be
          everything.
        predicted_gain: >-
          A closure of exactly the shape the inventor protocol demands: named
          observable, proved trivial fibration, explicit residual class where
          the fibration is NOT trivial (namely once x(Q) enters V).
    quantifier_order: >-
      ASSERTED: FORALL CAGG adversaries A and FORALL q, THERE EXISTS a Shoup
      adversary A' making q queries such that FORALL (p, E, t, N) and FORALL
      distributions on k, A' perfectly simulates A's view; hence FORALL A,
      Pr[A wins] = O(q^2/N).
      Note the order: A' is constructed AFTER A but BEFORE the instance, which
      is what makes the simulation uniform over instances. The dangerous
      weaker reading, NOT claimed: FORALL instances THERE EXISTS a simulator
      -- which would allow the simulator to depend on k and prove nothing.
      Guarding against exactly that inversion is why the order is written here
      rather than left implicit.
      NOT CLAIMED: any statement about adversaries outside CAGG; any
      time-complexity bound; any statement about the real ECDLP.
    method_ceiling:
      strongest_certifiable_claim: >-
        "In CAGG, exact vectorization and action oracles for the instance's own
        isogeny class give zero advantage, and Omega(sqrt N) queries remain
        necessary." It can NEVER certify: anything about adversaries that see
        x(Q) as a field element (index calculus, Semaev, and every R1 method
        live there); anything about multi-instance or preprocessing
        adversaries; anything about time as opposed to query complexity; and
        nothing whatsoever about the actual hardness of the ECDLP. A summary
        dropping any of those four qualifiers is overclaiming under AGENTS.md
        rule 4.
      nearby_object_control: >-
        CAGG+ of the null control, where the desired conclusion FAILS by
        construction. The argument must NOT close CAGG+. If a version of the
        simulation lemma also "closes" CAGG+, it has assumed away the very
        dependence it is supposed to detect, and the whole argument is
        circular.
    proof_obligations:
      - claim: >-
          Every CAGG curve-level interface is a function of (p, E, t) alone.
        responsibility: correctness
      - claim: >-
          The simulator's view is perfectly indistinguishable from A's.
        responsibility: correctness
      - claim: >-
          Shoup's bound applies to the resulting Shoup adversary.
        responsibility: correctness
      - claim: >-
          The statement is query complexity, not time complexity, and the
          simulator's own cost is disclosed.
        responsibility: scope
      - claim: >-
          k is a Cl(O)-invariant of the instance (T1).
        responsibility: correctness
      - claim: >-
          The class-augmented rho is strictly more expensive than plain rho at
          equal charged cost.
        responsibility: runtime
      - claim: >-
          CAGG+ does exhibit a benefit in the same harness.
        responsibility: soundness

  predictions:
    - metric: >-
        charged cost to solve (in point-addition-equivalents) of
        class-augmented rho divided by plain rho, on identical instances and
        seeds, in CAGG mode
      direction: higher
      minimum_effect: >-
        At least 1.0 at every isogeny-step probability q > 0, and increasing
        in q, matching the predicted overhead factor within 25 percent. A
        ratio below 0.9 that persists across seeds contradicts OBS-6 and is
        escalated for independent review before any interpretation.
    - metric: >-
        the same ratio in CAGG+ mode with a planted modulus M ~ sqrt(N)
      direction: lower
      minimum_effect: >-
        Below 0.6 at M ~ sqrt(N). If the harness shows no benefit even with
        the bridge planted, it cannot detect a benefit and every CAGG null is
        void.
    - metric: >-
        decay of the CAGG+ benefit as M decreases to 1
      direction: higher
      minimum_effect: >-
        The ratio must rise monotonically to within 10 percent of 1.0 at
        M = 1. A persistent benefit at M = 1 is the artifact tell and halts
        the line.
    - metric: >-
        number of curve-level interfaces found to depend on sigma or k during
        the Step 2(i) audit
      direction: lower
      minimum_effect: >-
        Zero. A single dependent interface refutes the simulation lemma as
        stated and is the most valuable possible outcome of this record.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE, AND THIS IS THE WHOLE CHEAP CORE):
      write CAGG formally and run the interface-by-interface audit of Step
      2(i). If every interface is (p,E,t)-determined, the lemma follows in two
      lines and the closure is established at ZERO compute. If any interface
      is not, the record is refuted, also at zero compute.
      STAGE 1 (minutes): the h = 1 degeneracy check.
      STAGE 2 (hours): implement class-augmented rho over a toy isogeny class
      -- state (curve, point), transport by T1, cost model charging isogeny
      steps at their measured price -- and run it against plain rho on
      identical seeds.
      STAGE 3 (hours): run the identical harness in CAGG+ with planted moduli
      M in {1, N^{1/4}, N^{1/2}} and record the decay curve.
      STAGE 4 (zero compute): write the three residual open classes.
    controls:
      - >-
        CAGG+ planted-bridge model -- the harness MUST show a benefit there
      - >-
        M = 1 decay endpoint -- the benefit MUST vanish
      - >-
        h = 1 degeneracy -- class-augmented and plain arms MUST coincide
      - >-
        plain rho baseline at 0.886 sqrt(N) within 20 percent on identical
        instances, before any ratio is computed
      - >-
        identical seeds across arms, so the comparison is paired rather than
        distributional
    required_metrics:
      - charged cost per arm per instance per seed, in point-addition
        equivalents, with the isogeny-step price measured not assumed
      - the ratio class-augmented/plain, per q, with paired confidence
        intervals
      - the same in CAGG+ per planted M, and the decay curve
      - the Step 2(i) audit table: one row per interface, with its verdict
      - h, N, and the isogeny-step price per instance

  falsification_conditions:
    - >-
      An interface of CAGG is found that is not a function of (p, E, t) --
      e.g. an oracle whose behaviour depends on the encoding sigma. The
      simulation lemma is false as stated; the closure does not hold; supersede
      the record. This is the cheapest and most valuable falsification and it
      costs nothing.
    - >-
      Class-augmented rho solves faster than plain rho at equal charged cost,
      persistently across seeds and instances. OBS-6 is contradicted
      empirically; escalate immediately for independent review, and do not
      interpret until replicated, because the far more likely cause is a
      mischarged isogeny step.
    - >-
      CAGG+ shows no benefit. Harness blind; run set INVALID rather than
      negative (docs/inventor-protocol.md, controls before belief).
    - >-
      The CAGG+ benefit fails to decay at M = 1. The harness leaks k; every
      number in the run set is void.

  confounders:
    - >-
      MISCHARGED ISOGENY STEPS. If an isogeny step is charged at one point
      addition, the class-augmented arm will look free and any conclusion is
      worthless. The step price must be MEASURED on the same machine in the
      same unit and reported per instance. This is the single largest
      confounder in Step 4.
    - >-
      SEED PAIRING. Comparing arms on different seeds turns a paired
      comparison into a distributional one and inflates variance enough to
      hide a factor-2 effect at toy sizes. Seeds are shared across arms.
    - >-
      TINY h. At h < 20 the class-augmented walk revisits curves constantly
      and its behaviour is dominated by the tiny state space rather than by
      the mechanism. Require h >= 100 before interpreting the q-sweep.
    - >-
      FRUITLESS CYCLES. Rho variants that use maps of small order are prone to
      fruitless cycles (the classical negation-map problem). A
      class-augmented walk has the same risk through short isogeny cycles, and
      an unmitigated cycle would make the augmented arm look worse for a
      reason unrelated to OBS-6. Cycle detection and its mitigation are part
      of the harness and are reported.
    - >-
      MODEL/REALITY SLIPPAGE. The strongest confounder is rhetorical rather
      than statistical: it is very easy to state the CAGG result and then
      discuss it as though it were about real adversaries. Every reported
      sentence must carry the model name.

  interpretation_limits:
    - >-
      A closure IN A MODEL. CAGG excludes exactly the adversaries that matter
      most for prime-field ECDLP progress -- those that read x-coordinates as
      field elements. The record says so in its headline, not in a footnote.
    - >-
      Query complexity, not time complexity. The simulator is not efficient at
      crypto scale.
    - >-
      QUANTUM: Kuperberg/Regev-style subexponential quantum vectorization
      (KN-TECH-027, KN-TECH-051, KN-OPEN-014, KN-LIT-071) would make the
      granted oracle cheap to REALISE, and changes nothing here, because the
      oracle is granted for free and is still worthless. Recorded so nobody
      imports the quantum result as relevant; the campaign is classical.
    - >-
      The empirical arm is toy scale and is a CONSISTENCY CHECK on a symbolic
      lemma, never its validation. The lemma stands or falls on Stage 0.
    - >-
      This record changes no hypothesis status and closes no lane officially.
      It is a proposal; only the Coordinator may act on it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO HEURISTIC IS LOAD-BEARING FOR THE CLOSURE. The simulation lemma is
        an exact indistinguishability argument; Shoup's bound is a theorem;
        T1 is elementary. The only heuristic content is in the EMPIRICAL arm.
      rigorous_support: >-
        Stated explicitly so that no reader imports conditionality. If the
        Stage 0 audit passes, the closure is unconditional WITHIN CAGG.
      validation_plan: >-
        Not applicable; the Stage 0 audit is the validation, and it is
        symbolic.
    - id: H2
      statement: >-
        For a class-augmented rho with isogeny-step probability q on a toy
        class of size h, the expected charged cost is
        (1 + q(rho_iso - 1)) times the plain rho cost, where rho_iso is the
        measured price of an isogeny step in point-addition equivalents; i.e.
        the walk's collision behaviour is unchanged and only the price per
        step moves.
      rigorous_support: >-
        Rests on the standard birthday analysis of rho (0.886 sqrt(N) steps,
        KN-TECH-001/KN-TECH-006) together with the observation that T1
        transport is a group isomorphism on G, so the induced walk on the
        ANSWER space is statistically identical. The heuristic content is the
        usual random-function idealisation of the rho step map, which this
        program already relies on everywhere.
      validation_plan: >-
        Measure the step count (not the charged cost) of the class-augmented
        arm against 0.886 sqrt(N) across q in {0, 0.1, 0.5, 1.0}; predicted
        invariant in q. Compare the empirical distribution of step counts
        against the standard rho distribution; tail check on the 95th
        percentile. A step count that DECREASES with q would be the
        interesting refutation and is the same event as the OBS-6 falsifier.
        LABELLED TOY SCALE.

  reachability_gate: >-
    T5 IS SATISFIED IN THE STRONGEST POSSIBLE WAY AND THAT IS THE POINT OF THE
    RECORD. The model GRANTS the adversary the ability to reach any specified
    curve at unit cost -- the hard side of the T5 dichotomy is handed over for
    free, along with the exact address of every curve. The conclusion is
    unchanged: no advantage. So this record settles the reachability question
    for L10 in the only way that matters -- by showing that even FREE
    reachability is worthless, so the gate is not the binding constraint in
    this lane and no future L10 proposal may claim value from cheaper
    reachability alone. For the empirical arm, reachability is cheap by
    construction: the class-augmented walk moves to ADJACENT curves via small
    split primes, which is the O(log p) rapid-mixing side of the dichotomy, and
    never needs to reach a specified curve.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT, AND THAT IS THE ASSERTED RESULT: query complexity stays
      at Omega(sqrt(N)) = Omega(p^{1/2}) in CAGG with the oracle, exactly as
      without it. The predicted empirical effect of the class-augmented walk
      is a cost INCREASE by the factor (1 + q(rho_iso - 1)).
    memory_exponent: >-
      O(1) for both rho arms with distinguished points. The simulator itself
      stores the isogeny class, i.e. O(h) = O(sqrt(p)) curve equations, which
      is disclosed because it is what makes the simulation a query-complexity
      rather than a full-cost statement.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
      sqrt(N)/sqrt(N); automorphism-discounted rho at 0.886 sqrt(N/|Aut|) with
      |Aut| <= 6 (KN-TECH-018). Shoup's Omega(sqrt N) is the matching lower
      bound in the generic model (KN-TECH-005). This record changes none of
      them and extends the last one's reach to a new oracle class.
    hidden_overhead: >-
      Disclosed prominently: the simulator's own running time is at least the
      cost of reconstructing the isogeny class and Cl(O), which is
      superpolynomial at crypto scale (L_p(1/2) at best, by Hafner-McCurley).
      Every statement here is therefore query complexity. Anyone quoting this
      as a time-complexity closure would be misreporting it.
    tradeoff_note: >-
      Not applicable -- no algorithm is produced. For the empirical arm, both
      rho variants sit at the same point of the van Oorschot-Wiener frontier
      (linear parallel speedup, O(1) memory per core); the augmented variant
      simply pays more per step, which is the predicted effect.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier. As an attack this proposal mounts none and its
    empirical arm is PREDICTED TO BE STRICTLY WORSE than the incumbent, so it
    is dominated by parallel rho with distinguished points (0.886 sqrt(N),
    O(1) memory, KN-TECH-001/KN-TECH-006) on time and ties it on memory; by
    BSGS (sqrt(N)/sqrt(N)) on time; by automorphism-discounted rho on CM
    curves (KN-TECH-018) on time; and by kangaroo on a known interval when one
    is available. It consumes no data and no queries beyond the granted
    oracles. As a LOWER-BOUND result it is not dominated -- it strictly
    extends KN-FIND-b7e091's closed oracle list by one new class -- and that
    is the only axis on which it is not dominated. dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline, and a predicted NEGATIVE delta
    for the empirical arm: class-augmented rho costs (1 + q(rho_iso - 1)) times
    plain rho, i.e. worse by a factor equal to the measured isogeny-step price
    whenever q = 1. The positive delta is in the closure: the campaign's list
    of GGM-simulable oracle classes grows from two (incidence,
    endomorphism-image; KN-FIND-b7e091) to three (adding exact vectorization
    plus action for the instance's own class), the new one is closed by a
    different argument (product structure rather than group-operation
    counting), and three residual open classes are named with a concrete
    member filed in the same batch.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the Stage 0 interface audit passes and the simulation lemma
    holds as stated -- the residual 0.1 is concentrated on the possibility
    that a carefully chosen interface (most likely something exporting a
    handle into the curve world, or a model that hands the adversary
    x-coordinates by accident) breaks it, which is exactly what the audit is
    for. 0.85 that the empirical arm reproduces the predicted overhead within
    the pre-registered band. 0.7 that CAGG+ fires correctly on the first
    implementation. Priority HIGH because Stage 0 costs nothing, produces the
    lane's strongest deliverable, and is a genuine closure at the inventor
    protocol's standard rather than a fatigue report.

