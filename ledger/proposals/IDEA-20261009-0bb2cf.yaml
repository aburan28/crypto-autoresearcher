  title: |-
    Rank required for a Q-lift index calculus - measured N(H) vs the coverage requirement
  class: measurement
  claim: |-
    On every available curve with certified generators (rank 5-29 from the literature plus the rank-30/31 baseline curves in the rank campaign) the fitted N(H) matches the lattice-count model within 2x; coverage of E(F_p) at 128- and 256-bit p is below 2^-60 for r <= 31; the rank needed for coverage >= 1/L_p(1/2) is >= 60 at 128 bits and >= 100 at 256 bits.
  mechanism: |-
    Factor base = reductions of points of canonical height <= H_F, so |F| about N(H_F) about V_r H_F^(r/2) / sqrt(Reg). m-fold sums have height at most about m^2 H_F, so at most N(m^2 H_F) about m^r |F| points of E(F_p) decompose. Coverage about p forces r >= log p / log m.
  novelty_status: unverified
