  assumptions:
    - >-
      OFF-LIMITS COMPONENT NAMED. The host pipeline is m = 3 factor-base
      index calculus (Class I partial-action; family F-index-calculus of
      IDEA-20260802-002) with the lane's set-theoretic membership f_V of
      degree B (KN-OPEN-020 high-degree class). The record adds a learned
      choice of solver trajectory and nothing else; no new factor base, no
      new representation, no new relation mechanism.
    - >-
      The solver whose trajectory is learned is a Groebner-order solver
      (Buchberger/F4 family over F_p with an exposed pair queue) or a
      Macaulay/XL layer with an exposed guess schedule; it is NOT the
      program's sympy wrapper, which does not expose its pair queue and whose
      degree outputs were a proxy with no dynamic range
      (IDEA-20260807-1354d8). Building the instrumented solver is the
      implementation cost.
    - >-
      The k = m-1 leaf of the hybrid ladder is charged by root-finding plus
      an O(1) hash lookup (da1428 leaf-costing control), never by a
      Macaulay solve; this is what keeps "guess everything" honestly cheap
      and prevents a manufactured interior optimum.
    - >-
      The policy's own inference cost is part of the charged cost at a
      declared exchange rate (one 32-bit floating-point multiply-add counted
      as one F_p multiplication at the toy sizes); results are reported
      both with and without it.
    - >-
      Toy scale only: log2 p <= 28. Exhaustive c_D vectors at these sizes
      are the certified-failure oracle and are computed by a code path the
      policy never sees.
    - >-
      Concurrent sibling records IDEA-20260906-79ff48 (learned predictor)
      and IDEA-20260906-1f6bfe (symbolic regression) were not on disk when
      this record was written; every reference to them falls back to the
      corresponding line of RQ-RELN-61638a's methods list.

  proof_search_map:
    bottleneck: >-
      Whether the Semaev ideal I_R = <S_4(x(R), x_1, x_2, x_3), f_V(x_1),
      f_V(x_2), f_V(x_3)> admits a cheap guess order -- a choice of which
      coordinate to specialise, to which value or class, and at what degree
      to branch -- under which the EFFECTIVE solving degree of the residual
      ideals falls below the semi-regular reference ceil(((3-k)(B-1)+D_S)/2)
      by a margin that grows with B. If it does, the hybrid optimum moves
      interior (da1428's escape E2) and s(B) changes; if it does not, every
      policy is constant-factor and the record's claim holds. This single
      step is what the whole experiment measures, through the policy as a
      search over schedules.
    baseline_embedding:
      parameter_slice: >-
        The zero-learning slice: the untrained policy replaced by the default
        strategy (sugar / normal selection; degree-by-degree F4 batching; the
        lane's frozen hybrid convention with k = 2 leaf charged by
        root-finding). At this slice G_obj = G_null = Gamma = 1 identically,
        by definition.
      reproduction_check: >-
        (i) The instrumented solver, run with the default strategy on the
        frozen SDEG/PFDR toy fixtures (p = 1009, 4099; B in {6, 8, 12};
        m = 3), must reproduce the committed semi-regular graded rank
        profile and d_reg = ceil((3(B-1)+D_S)/2) on the random-support null
        to the digit, and its counted operation totals must be
        bit-reproducible across two runs. (ii) The k-ladder cost table of
        da1428 stage 0 (cost versus k at omega = 2) must be reproduced by the
        instrumented solver's counted operations to within a stated constant
        at B in {6, 8, 12}. A failure of either check voids every downstream
        cell.
    observation_collision:
      observable: >-
        The pair (charged cost profile, terminal certificate) of an episode:
        the vector of counted operations per step and the certified
        decomposition or certified failure at the end. Two policies are
        observationally identical iff they produce the same cost profile and
        the same certificate on every held-out target.
      distinct_preimage_search: >-
        Search for two policies with EQUAL cost profiles on the object that
        differ on the null (or vice versa): if such a pair exists at every
        rung the observable cannot separate structure-specific from generic
        gain, and Gamma is not identifiable from cost alone. Concretely:
        train >= 5 seeds per arm; if the seed-to-seed spread of G_obj
        exceeds |G_obj - G_null| at every rung, the observable has collided
        and the cell reports "unidentifiable" rather than a Gamma.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The learned policy's ACTION RULE restricted to guess decisions, as
          a function of coordinates-only features (x(R), the QR class of
          x(R), the x-values and classes of the base, the current degree
          profile) -- the fibre of the cost observable over the guess
          schedule. This is the object handed to symbolic regression in the
          alive branch.
        predicted_gain: >-
          Null outcome: the rule is indistinguishable from the default
          schedule (guess in index order, or by a feature-free degree rule);
          predicted gain on the object over the null exactly 1. Alive
          outcome: a rule of expression complexity <= 12 nodes that predicts
          the policy's guess on >= 90% of held-out episodes and, when
          substituted for the policy, reproduces >= 80% of its Gamma at the
          held-out rung.
      - transform: specialization_pack
        proposed_object: >-
          The planted positive control: I_R with f_V(x_1) replaced by a
          product g_1 g_2 of two factors of degree about B/2 with disjoint
          root sets known to the experimenter, so that guessing x_1 among the
          roots of g_1 first provably reduces the residual to a system of
          semi-regular degree about ceil((2(B-1) + (B/2 - 1) + D_S)/2) on
          half the branches.
        predicted_gain: >-
          A known, computable factor in counted operations (stage-0
          obligation: emit it from the closed form at each B). The policy
          must recover >= 80% of it or the instrument is void.
    quantifier_order: >-
      For every curve family in scope, for every rung p on the toy ladder,
      for every policy architecture and training budget in the declared
      grid, there EXISTS a constant C (predicted about 1, in any case
      independent of p) such that the structure-specific gain
      Gamma(p) = G_obj(p)/G_null(p) satisfies |log Gamma(p)| <= log C at
      every rung; equivalently the fitted slope of log Gamma against log p
      has a confidence interval containing 0. The ALIVE negation: there
      exists a curve family, a channel and an architecture in the grid for
      which the slope's Holm-corrected interval excludes 0 with positive
      lower end, replicated across >= 3 curves and >= 5 training seeds.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, on the tested curves, base geometry, solver and
        budget: a constant Gamma with an interval per channel and a slope
        interval per channel; or, in the alive branch, a stated guess rule
        as a candidate invariant with its held-out accuracy -- never a
        theorem. The intrinsic ceiling on the solve channel is the PC
        refutation degree / effective d_reg of the GUESSED ideal
        (H-PCD-03be5a): no selection policy reaches below it, and a guess
        policy is charged at its branching factor, so the certifiable claim
        is bounded above by da1428's (E2) effect size at the tested B. On
        the existence channel the ceiling is the constant < 2 derived in
        the claim. On the LA channel the ceiling is the fill-in gap between
        the object matrix and a random matrix of the same profile.
      nearby_object_control: >-
        The support-matched semi-regular random system (N1) and the
        relabelled Z/N instance (N2), plus the random sparse matrix of the
        same row-weight profile for the LA channel. A policy gain that
        appears on the object and on N1 alike is a fact about degree-B
        membership polynomials, not about E; a gain on the object and N2
        alike is a fact about the group order and base size, not about the
        curve's coordinates.
    proof_obligations:
      - claim: >-
          The existence-channel ceiling: the ratio of expected lookups under
          random order to expected lookups under a perfect ordering oracle is
          a constant below 2 for every mu, tending to 1 as mu -> 0 (exact
          value per first-element convention).
        responsibility: baseline
      - claim: >-
          The planted positive control's predicted gain factor, from the
          semi-regular closed form, at each B in the grid.
        responsibility: feasibility
      - claim: >-
          In the alive branch: the extracted guess rule, substituted for the
          policy, lowers the effective solving degree of I_R by the measured
          margin (strictness), and does NOT do so on the semi-regular null
          (scope).
        responsibility: strictness
      - claim: >-
          The instrumented solver's counted operations reproduce the
          committed toy rank profiles and the da1428 k-ladder (baseline).
        responsibility: correctness
      - claim: >-
          If Gamma(p) ~ p^delta with delta > 1/4 in s(B) were ever
          established, the ledger's m = 3 exponent would drop below 1/2;
          this record claims the opposite and the obligation is to state the
          arithmetic exactly (done in target_complexity).
        responsibility: size
    not_applicable_reason: null

  predictions:
    - metric: >-
        G_null(p): baseline charged cost divided by trained-policy charged
        cost on the support-matched semi-regular null, solve channel, per
        rung, median over held-out targets with a bootstrap interval
      direction: higher
      minimum_effect: >-
        > 1 at every rung (generic solver overhead learned; this is expected
        and is not a finding). No minimum magnitude is required; a G_null
        indistinguishable from 1 at every rung would instead indicate an
        instrument with no dynamic range and is reported as such.
    - metric: >-
        Gamma_solve(p) = G_obj(p)/G_null(p), solve channel, per rung, with
        bootstrap interval over held-out targets and over >= 5 training seeds
      direction: different
      minimum_effect: >-
        NULL OUTCOME (predicted): |log_2 Gamma| <= 0.15 at every rung and the
        fitted slope of log Gamma against log p has a Holm-corrected 95%
        interval containing 0. ALIVE OUTCOME (falsifies the claim): slope
        interval excludes 0 with positive lower end, Gamma >= 1.25 at the top
        rung, replicated across >= 3 curves and >= 5 seeds, and surviving
        the permuted-reward, planted-needle and leak controls.
    - metric: >-
        Gamma_LA(p) = G_obj/G_null on the linear-algebra channel (counted
        field operations of structured Gaussian elimination plus the sparse
        solve, object relation matrix versus a random sparse matrix of the
        same row count and row-weight profile), per rung
      direction: different
      minimum_effect: >-
        Predicted |log_2 Gamma_LA| <= 0.15 at every rung; alive as above.
    - metric: >-
        Existence-channel oracle ratio: expected lookups under random order
        divided by expected lookups under a perfect (exhaustive-oracle)
        ordering, measured on the exhaustive c_D tables at mu ~ 1
      direction: lower
      minimum_effect: >-
        < 2 at every rung under both first-element conventions, and
        decreasing toward 1 in a mu-ladder (mu in {1, 1/2, 1/4}) -- a check
        of the in-record derivation, with the exact stage-0 value as the
        predicted number. A measured ratio >= 2 refutes the derivation and
        re-opens the existence channel.
    - metric: >-
        Permuted-reward control: charged cost of a policy trained on
        seeded-noise reward versus a uniformly random policy, per rung
      direction: different
      minimum_effect: >-
        Must NOT differ (interval containing 0); a permuted-reward policy
        that beats random by more than the seed spread means the state
        leaks the answer and every cell of that rung is void.
    - metric: >-
        Planted-needle recovery: fraction of the planted positive control's
        predicted gain the trained policy recovers, per rung
      direction: higher
      minimum_effect: >-
        >= 0.8 of the predicted factor; below it the instrument cannot find
        a planted structure and no null result may be reported from it.
    - metric: >-
        Frozen-policy determinism: bit-identity of the two re-run trajectory
        transcripts and counted-cost totals per episode
      direction: different
      minimum_effect: >-
        Zero differing episodes; any nonzero count is an infrastructure
        defect (AGENTS.md rule 3) and blocks the cell.
    - metric: >-
        Alive branch only -- extracted guess rule: expression complexity of
        the symbolic-regression fit to the policy's guess decisions, its
        held-out agreement, and the fraction of Gamma it reproduces when
        substituted for the policy at the held-out rung
      direction: higher
      minimum_effect: >-
        Complexity <= 12 nodes, agreement >= 0.9, >= 0.8 of Gamma
        reproduced; otherwise the policy's advantage is not a rule and no
        proof obligation is emitted (reported as "gain without a rule").

  minimal_test:
    design: >-
      STAGE 0 (no compute): emit the existence-channel oracle ratio from the
      Poisson law under both first-element conventions at mu in {1, 1/2,
      1/4}; emit the planted control's predicted gain from the semi-regular
      closed form at each B; emit the da1428 k-ladder table at omega = 2 for
      the B grid. STAGE 1 (instrument): an instrumented Buchberger/F4 solver
      over F_p with an exposed pair queue, an exposed guess schedule, counted
      field operations and counted pair reductions, and a structured-
      Gaussian-elimination routine with an exposed pivot choice; pass the
      baseline_embedding reproduction checks. STAGE 2 (cells): ONE curve
      family, 3 prime-order short-Weierstrass curves per rung, m = 3, toy
      ladder log2 p in {16, 20, 24, 28}. Two B schedules, declared: (a) the
      lane convention B = round((6N)^{1/3}) for the existence, target and LA
      arms; (b) for the solve arm, where a k = 0 algebra at the lane B is out
      of reach beyond the first rung (that unreachability is da1428's
      verdict and is recorded, not hidden), a crossed grid B in {8, 12, 16,
      24} at every rung, with mu reported per cell. Targets per cell: >= 30
      held-out evaluation targets, half certified-decomposable and half
      certified-undecomposable by the exhaustive oracle so that both
      terminal states occur; training on a DISJOINT target set from curves
      1-2 of the rung, evaluation on curve 3 (cross-curve) and on held-out
      targets of curves 1-2 (within-curve), both reported. ARMS per cell:
      object (E, x-interval base and QR-class base), N1 (support-matched
      semi-regular random system), N2 (relabelled Z/N, existence/target arms
      only), LA object versus random-profile matrix, permuted-reward
      control, planted-needle control, untrained-policy control. Policy:
      one declared architecture (a small MLP or transformer over the state
      summary) and one training algorithm (policy gradient with a declared
      budget in episodes), >= 5 seeds. STAGE 3: frozen-policy re-run
      determinism check; leak audit (feature inventory signed off as
      coordinates-only; label code path disjoint); Holm correction across
      all (rung, channel, base) cells; slope fits of log G_obj, log G_null,
      log Gamma against log p. STAGE 4 (alive branch only): symbolic
      regression on the policy's guess decisions with the recovery controls
      of the sibling record; the recovered rule substituted for the policy
      and re-measured; the rule filed as a candidate invariant with a proof
      attempt and the semi-regular null as its nearby-object control.
    controls:
      - >-
        SUPPORT-MATCHED SEMI-REGULAR NULL (N1): S_4 replaced by a random
        polynomial of the same multidegree support, f_V kept, same targets'
        x-values as the constant term; same policy, same budget, same seeds.
      - >-
        RELABELLED Z/N NULL (N2): the same base and targets under a random
        bijection of labels, for the existence and target-selection arms; a
        policy gain here is a fact about (N, B) alone.
      - >-
        RANDOM-PROFILE MATRIX (LA channel): a random sparse matrix over F_N
        with the same row count and row-weight histogram as the object's
        relation matrix.
      - >-
        PERMUTED-REWARD control (reused from harness/rl_isogeny): reward
        replaced by seeded noise; the trained policy must not beat a random
        policy.
      - >-
        PLANTED-NEEDLE positive control: the specialization_pack object; the
        policy must recover >= 80% of the predicted gain or the cell is
        void.
      - >-
        UNTRAINED-POLICY control (KN-TECH-d64293): the randomly initialised
        policy's cost, reported next to the trained one, so that "gain" is
        measured against both the default strategy and the untrained net.
      - >-
        LEAF-COSTING control (da1428): the k = 2 leaf charged by
        root-finding plus lookup, never by a Macaulay solve.
      - >-
        PROXY-CORRELATION check (KN-TECH-d64293): on a sample where both are
        computable, the Spearman correlation between any intermediate
        reward shaping term (e.g. per-step degree drop) and the terminal
        charged cost; a shaping term with correlation <= 0 is removed before
        training.
      - >-
        DEFAULT-STRATEGY baseline run twice with different seeds of the
        solver's own tie-breaking, to bound the baseline's own variance.
      - >-
        FROZEN-POLICY DETERMINISM re-run.
    required_metrics:
      - >-
        Per episode: counted F_p multiplications, counted pair reductions,
        counted Macaulay row operations, counted lookups, policy inference
        operations at the declared exchange rate, wall clock (recorded,
        never a decision variable), terminal certificate (decomposition
        triple re-verified by an independent point-addition path, or
        exhaustive-oracle failure certificate), branch depth reached,
        maximum degree reached per branch.
      - >-
        Per cell: G_obj, G_null (N1, N2 where applicable), Gamma with
        bootstrap intervals over targets and seeds; untrained-policy ratio;
        permuted-reward ratio; planted recovery fraction; determinism count.
      - >-
        Per rung: the measured d_reg profile of the null against the
        closed form (H1 validation); the existence-channel oracle ratio.
      - >-
        Across rungs: slope of log Gamma against log p per channel with
        Holm-corrected intervals; the same for log G_null (H2 validation).
      - >-
        Alive branch: the extracted rule, its complexity, held-out
        agreement, substituted-rule Gamma, and the nearby-object
        (semi-regular) result for the same rule.

  falsification_conditions:
    - >-
      OF THE CLAIM (alive branch): Gamma_solve or Gamma_LA with a fitted
      slope whose Holm-corrected 95% interval excludes 0 with positive lower
      end, Gamma >= 1.25 at the top rung, replicated across >= 3 curves and
      >= 5 seeds, with the permuted-reward control at parity, the planted
      control recovered, and the leak audit passed. The claim "Gamma is a
      constant" is then false at the tested scale and the record's alive
      branch (symbolic-regression extraction, proof obligation, feed into
      RQ-PFDR-ae2fba's (E2)) is entered.
    - >-
      OF THE EXISTENCE-CHANNEL CEILING: a measured oracle ratio >= 2 at any
      rung under either first-element convention, or a ratio increasing
      with decreasing mu. The in-record derivation is then wrong and the
      existence channel is re-opened as a live channel for a policy.
    - >-
      OF THE CEILING STATEMENT ON THE SOLVE CHANNEL: a trained policy whose
      counted cost on a k = 0 branch falls below the Macaulay cost implied
      by the branch's PC refutation degree / measured effective d_reg. This
      would mean the cost model or the solver model is wrong (e.g. the
      solver is not a Groebner-order solver in the H-PCD-03be5a sense) and
      is reported as an instrument finding, not as a policy gain.
    - >-
      OF THE INSTRUMENT (no conclusion admissible): planted-needle recovery
      below 0.8; permuted-reward policy beating random beyond seed spread;
      baseline_embedding reproduction checks failing; determinism check
      failing; G_null indistinguishable from 1 at every rung (no dynamic
      range).
    - >-
      OF THE IDENTIFIABILITY: seed-to-seed spread of G_obj exceeding
      |G_obj - G_null| at every rung (observation collision); the cell
      reports "unidentifiable" and the claim is neither confirmed nor
      refuted.

  confounders:
    - >-
      REWARD HACKING ON SOLVER-INTERNAL COUNTERS: the policy may learn to
      trigger uncounted work (e.g. routing reductions through a Buchberger
      criterion check that is not charged, or forcing early branch abandon
      that defers cost to a sibling branch that is counted separately).
      Mitigation: the charged cost is the TOTAL over all branches to a
      certificate, every code path that touches a polynomial increments a
      counter, and the counter set is frozen before training; the
      proxy-correlation check removes shaping terms.
    - >-
      LEAKAGE OF THE TARGET'S LOG OR LABEL THROUGH THE TRAINING SET: at toy
      scale every log is computable, so the danger is a feature or a label
      path that encodes decomposability. Mitigation: coordinates-only
      feature inventory, exhaustive labels computed by a disjoint code path,
      target-disjoint and curve-disjoint splits, and the permuted-reward
      control, which detects a state that leaks the answer.
    - >-
      SOLVER NON-DETERMINISM (hash ordering, tie-breaking): a policy could
      "learn" a lucky tie-break. Mitigation: pinned tie-breaking, the frozen
      re-run determinism check, and the baseline run under two tie-break
      seeds.
    - >-
      THE B SCHEDULE OF THE SOLVE ARM confounds with mu: at B in {8..24} and
      log2 p >= 20, mu << 1 and nearly every target is undecomposable, so
      the solve arm measures cost-to-certified-failure more than cost-to-
      relation. Mitigation: the 50/50 target split by the exhaustive oracle,
      and mu reported per cell; conclusions scoped to that split.
    - >-
      SMALL-B REGIME (da1428 confounder): at B <= 12 the residual degree is
      dominated by D_S rather than by B, so a guess rule that helps there
      may say nothing about the B-linear slope. Mitigation: the B grid
      reaches 24 and the slope in B is reported separately from the slope in
      p.
    - >-
      POLICY INFERENCE COST: an expensive policy can appear to win on solver
      counters alone. Mitigation: inference operations charged at the
      declared rate; both totals reported.
    - >-
      GENERIC-GAIN DOMINANCE: G_null may be large and noisy enough that
      Gamma's interval is wide at every rung; this is the observation-
      collision case and is reported as unidentifiable rather than as
      Gamma ~ 1.
    - >-
      CURVE-TO-CURVE TRANSFER: a policy trained on curves 1-2 may fail on
      curve 3 for reasons of overfitting rather than absence of structure;
      within-curve and cross-curve evaluations are both reported, and a
      within-curve gain absent cross-curve is labelled "curve-specific,
      unexplained".
    - >-
      NEGATION-CLOSED BASE TRAP (seed brief INV-2''): under the unreduced
      W = -W convention the base itself is a forced cluster of easy
      targets; the certificate convention (exactly 3 points, signs free, no
      {P, -P} pair) is declared before any cost is reported.

  interpretation_limits:
    - >-
      CONSTANT-FACTOR UNLESS THE GROWTH ARM SAYS OTHERWISE: a Gamma that
      does not grow with p is a constant and is reported as one
      (RQ-RELN-61638a constraint 3; 772cff channel ledger). A G_null > 1 is
      generic solver overhead and is never reported as a finding about E.
    - >-
      NOTHING ABOUT CRYPTOGRAPHIC SCALE: toy ladder log2 p <= 28, three
      curves per rung, one base family, one solver, one policy architecture;
      no transfer to P-256-class curves is licensed by any outcome
      (AGENTS.md rules 4 and 6).
    - >-
      THE LEARNED RULE IS NOT A THEOREM: in the alive branch the extracted
      guess rule is a candidate invariant carrying a proof obligation; it
      becomes a result only through a proof record or a replicated
      null-separated measurement at a further rung, never through the
      policy's accuracy.
    - >-
      SOLVE-ARM SCOPE: the solve channel is measured at a B grid below the
      lane convention beyond the first rung because the k = 0 algebra is
      unreachable there; that unreachability is itself da1428's verdict, and
      nothing here changes it.
    - >-
      FACTOR-BASE CLASS: the base is the lane's set-theoretic f_V (KN-OPEN-020
      high-degree class); the record proposes no base and its conclusions do
      not transfer to implicit-membership or target-dependent bases.
    - >-
      TIMEOUTS, OOM, training divergence and solver crashes are
      failed_infrastructure, never evidence (AGENTS.md rule 3); an episode
      that exceeds its budget carries no cost and no certificate.
    - >-
      This record does not close any channel of 772cff (G): a constant
      Gamma is a statement about learned schedules at toy scale, not about
      the solve channel's intrinsic cost.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The support-matched null system (random polynomial of S_4's
        multidegree support plus f_V(x_1), f_V(x_2), f_V(x_3)) is
        semi-regular in the Bardet-Faugere-Salvy sense, with graded rank
        profile given by the Hilbert-series coefficients and solving degree
        ceil((3(B-1) + D_S)/2), and this persists after specialising k
        coordinates (da1428 HA-1).
      rigorous_support: >-
        Froberg's conjecture / Bardet-Faugere-Salvy semi-regularity for
        generic overdetermined sequences (the classical distribution
        theorem imitated); the box-convolution factor from f_V is exact
        since the f_V form a regular sequence (da1428 HA-1's rigorous part).
      validation_plan: >-
        Measure the graded rank profile of the null at every degree up to
        d_reg for B in {8, 12, 16, 24}, m = 3, >= 5 random supports and
        >= 5 random specialisations per cell, at the lowest rung and the
        highest reachable one; compare coefficient-by-coefficient to the
        closed form. TAIL CHECK: report the draw with the largest negative
        residual per cell (a heavy left tail means rare specialisations
        collapse the degree and is reported, not averaged). TRANSFER: none
        beyond the tested B; no crypto-scale shortcut exists for this
        quantity and none is claimed.
    - id: H2
      statement: >-
        The generic gain G_null(p) of a fixed policy architecture and
        training budget is a constant independent of p along the ladder
        (its dependence is on B and on the system shape, not on the prime).
      rigorous_support: >-
        None known; the assumption imitates the empirical regularity that
        selection-strategy speedups on generic ideals are constant factors
        (recalled from the Peifer-Stillman-Halpern-Leistner line, marked
        recalled). It is what makes Gamma a well-defined ratio.
      validation_plan: >-
        Fit log G_null against log p at fixed B (the crossed grid); the
        slope interval must contain 0. If it does not, the null has its own
        growing structure, Gamma is not a clean ratio, and the cell reports
        both slopes separately rather than a Gamma. TAIL CHECK: the largest
        per-target G_null in each cell, to detect a few dominating episodes.
    - id: H3
      statement: >-
        At the lane's base size the decomposition count c_D(R) of a
        uniformly chosen target is Poisson(mu) to within the Janson bracket
        of IDEA-20260906-86cd30, which is what the existence-channel ceiling
        derivation uses.
      rigorous_support: >-
        Conservation of the mean (KN-FIND-007, exact); the m = 3 Janson
        two-sided bracket on P[c = 0] (IDEA-20260906-86cd30); the m = 2 exact
        random-base law as the pattern.
      validation_plan: >-
        Use the exhaustive c_D tables of the enumeration battery at N in
        {2^16, 2^18, 2^20, 2^22} (already committed for the FB3 geometries
        at some rungs, EXP-FB3-001) to compute the oracle ratio directly
        under both first-element conventions and compare with the Poisson
        prediction; TAIL CHECK: the k-rich tail P[c >= k] against Poisson
        for k up to the observed maximum, because an over-dispersed base
        (seed brief INV-2) changes the ratio. TRANSFER: the ceiling is a
        bound for every mu; only its exact value depends on the tail.
    - id: H4
      statement: >-
        The relation matrix produced by the lane's base at m = 3 has, under
        a random row order, the fill-in behaviour of a random sparse matrix
        with the same row-weight profile under minimum-degree pivoting.
      rigorous_support: >-
        None; imitates the random-sparse-matrix fill models used to cost
        structured Gaussian elimination in index-calculus linear algebra
        (KN-TECH-008 / KN-TECH-011 family, not re-opened this session).
      validation_plan: >-
        Measure fill-in and counted operations for minimum-degree pivoting
        on the object matrix and on >= 10 random-profile matrices per rung;
        the object must lie inside the random interval. A departure is
        itself a KN-OPEN-006-relevant finding and is reported before any
        policy is trained on the channel.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. The best known m = 3 ledger (772cff
      (E)) is total = T s(B) + L(B) with T = kappa 6N/B^2; with the
      meet-in-the-middle s(B) = Theta(B) and L(B) = Theta(B^2) it is
      6N/B + B^2, minimised at B^3 = 3N, total 3(3N)^{2/3} = Theta(N^{2/3}).
      This record predicts a CONSTANT structure-specific gain on s(B) and on
      L(B), which leaves the exponent 2/3 untouched. WHAT A GROWING GAIN
      WOULD DO, stated exactly so the arithmetic is on record: if a
      structure-specific gain Gamma = N^delta divided s(B), i.e.
      s(B) = Theta(B / N^delta), the ledger becomes 6N^{1-delta}/B + B^2,
      minimised at B^3 = 3N^{1-delta}, total Theta(N^{2(1-delta)/3}); this
      beats Pollard rho's N^{1/2} only for delta > 1/4. Since the existence
      channel's ceiling is a constant, such a delta could only come from the
      solve channel beating enumeration by a growing factor -- da1428's
      (E2) -- and then the result belongs to the solve, not to the policy.
      If instead a growing gain divided L(B), i.e. L(B) = Theta(B^{2-eps}),
      the optimum moves to B^{3-eps} ~ 6N and the total is
      Theta(N^{(2-eps)/(3-eps)}), reaching N^{1/2} only at eps = 1, which is
      the sparse-solver floor and is not reachable by pivot ordering alone.
    memory_exponent: >-
      Policy parameters: O(1) in N. Existence channel: the pair-sum table
      Theta(B^2) = Theta(N^{2/3}) at the ledger optimum, the genuine memory
      cost 772cff already discloses. Solve channel: one Macaulay layer per
      live branch, C(d_reg + 3, 3)^2 dense at worst, which at B = 24 (d_reg
      about 36) is about 8e7 entries per branch at toy scale. LA channel:
      the relation matrix plus fill, Theta(B) nonzeros before elimination.
      For the MEASUREMENT: under 4 GB at every declared cell (memory limits
      are machine protection, docs/research-budget-policy.md).
    best_known: >-
      Pollard rho at 0.886 sqrt(N) time and O(1) memory; van Oorschot-Wiener
      parallel rho at sqrt(N^3/w) time with memory w; within the
      decomposition subproblem the target-keyed meet-in-the-middle at
      Theta(B) lookups per target with a Theta(B^2) table (772cff) or
      B^{ceil(m/2)} time and B^{floor(m/2)} memory (da1428); the m = 3
      index-calculus ledger at Theta(N^{2/3}); the corpus's measured
      chained-Semaev index calculus at 2.0e4..1.5e5 times rho. Every point
