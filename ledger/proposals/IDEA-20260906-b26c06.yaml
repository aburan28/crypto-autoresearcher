idea:
  id: IDEA-20260906-b26c06
  id_allocation_provenance: >-
    Token assigned by the orchestrating session for this task (2026-09-06)
    and confirmed absent from ledger/ by glob before writing; not derived by
    scanning state for a next free number.
  question_id: RQ-RELN-61638a
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. Natural hosts are GOAL-RELN-001 (the
    decomposition-probability audit, whose certificate contract this record
    reuses) and RQ-PFDR-ae2fba (the solve-channel state: semi-regular
    reference d_reg, hybrid guessing dominating the algebra, the
    support-matched semi-regular null). Binding is a Coordinator act.
  added: '2026-09-06'
  title: >-
    A LEARNED SEARCH POLICY FOR RELATION COLLECTION, CHARGED AGAINST A
    STRUCTURE-FREE NULL, WITH ITS CEILING STATED FIRST: target selection is
    the predictor problem, decomposition existence is a Theta(B) lookup that
    no policy beats by more than a constant below 2, and the only live
    channels are the Groebner/hybrid-guess solve (g1) and the sparse
    linear-algebra ordering (g2), where the record's claim is that the
    STRUCTURE-SPECIFIC gain -- object gain divided by the gain of the same
    policy on a support-matched semi-regular random system and on a
    relabelled Z/N instance -- is a constant (about 1) that does not grow
    along the p ladder; the alive outcome is a growing gain, whose learned
    guess rule is then extracted by symbolic regression as a proof obligation
  class: algorithm

  claim: >-
    SETTING. E/F_p short Weierstrass of prime order N, factor base D of B
    x-classes (point set W = D and its negatives, |W| = 2B, the RELN lane's
    x-class convention, H-RELN-96e3ba), arity m = 3, index-calculus base
    size B ~ (6N)^{1/3} so that the conservation mean mu = C(B+2,3)/N is
    about 1 (KN-FIND-007). A relation for target R is a certified triple
    (P_1, P_2, P_3) in W with P_1 + P_2 + P_3 = R. The lane's charged cost
    ledger is total = T * s(B) + L(B), T = kappa * 6N/B^2 targets processed,
    s(B) the per-target decomposition-search cost, L(B) the linear algebra
    (IDEA-20260830-772cff (E)).

    WHERE A LEARNED POLICY CAN ACT, EXACTLY. There are four places a policy
    could make a choice, and two of them are already closed to it by
    reduction.

    (1) TARGET SELECTION -- which R to process next -- is a bandit whose
    only reward signal is whether R decomposes, i.e. it is the
    representation-decidable predictor problem of IDEA-20260830-c5c614 and
    the sibling IDEA-20260906-79ff48 (concurrent record; if absent, the
    learned-predictor line of RQ-RELN-61638a's methods list). Its gain is
    the precision lift lambda at the selection density sigma, its ceiling
    is c5c614's growth arm, and it is not re-proposed here.

    (2) DECOMPOSITION EXISTENCE -- does R decompose over W -- is a
    meet-in-the-middle lookup: with the pair-sum table T = {P_i + P_j}
    (size Theta(B^2), shared across all targets), R decomposes iff some
    R - P_k lies in T, which is B table lookups, s(B) = Theta(B), giving the
    772cff ledger 6N/B + B^2 = Theta(N^{2/3}) at B^3 = 3N. A policy cannot
    beat a lookup on existence; the most it can do is ORDER the B lookups so
    that a hit comes early. DERIVED IN-RECORD (unreviewed orchestrator-style
    sketch, a stage-0 obligation to check): an undecomposable target needs
    all B lookups under any order, and with c_D(R) ~ Poisson(mu) at mu = 1
    the fraction e^{-1} = 0.368 of such targets alone costs 0.368 B lookups
    per target; a decomposable target with c' valid first elements costs
    (B+1)/(c'+1) under random order and 1 under a perfect oracle order.
    Summing over the Poisson law the ratio (random order)/(oracle order) is
    about 1.34 if every decomposition contributes its 3 first elements
    (c' = 3c) and about 1.86 if c' = c; in every convention it is a constant
    below 2, and it tends to 1 as mu -> 0 (the cryptographic regime, where
    almost every target is undecomposable). So the existence channel's
    ceiling for ANY policy, learned or oracle, is a constant < 2, and the
    ordering rule it would learn is again a representation-decidable
    predicate on (x(R), x(P_k)) -- the predictor problem at pair level.
    Existence is therefore not a channel for this record.

    (3) THE SOLVE CHANNEL g1. When existence is decided algebraically rather
    than by lookup, the solver works on the Semaev system
    I_R = < S_4(x(R), x_1, x_2, x_3), f_V(x_1), f_V(x_2), f_V(x_3) >
    with f_V the set-theoretic membership polynomial of degree B (the
    KN-OPEN-020 high-degree class; no new base is proposed). The choices a
    policy can make are (a) S-pair / critical-pair selection order in a
    Buchberger/F4-type solve, (b) WHICH variable to specialise, to WHICH
    factor-base value or ordered class, and AT WHAT DEGREE to stop the
    algebra and branch (the hybrid guess-and-determine schedule), (c) when
    to abandon a branch. Under the semi-regular null the residual solving
    degree after guessing k of the 3 coordinates is
    ceil(((3-k)(B-1) + D_S)/2) (IDEA-20260808-093497), and
    IDEA-20260808-da1428 shows the hybrid optimum is the boundary k = m-1 =
    2, i.e. pure enumeration, with the k = 1 cell costing Theta(B^{2 omega
    - 1}) more. So the DEFAULT strategy for this channel is already "guess
    everything", and the only way a policy earns anything is if the
    SEMAEV-SPECIFIC ideal admits an interior schedule -- some guess order or
    pair order under which the effective solving degree of the residual
    ideal falls below the semi-regular value, which is exactly da1428's
    escape (E2). This record makes the policy an INSTRUMENT for detecting
    (E2), not a mechanism that could produce it.

    (4) THE LINEAR-ALGEBRA CHANNEL g2. The relation matrix has about B rows
    of weight <= m+1 over F_N; structured Gaussian elimination (pivot /
    elimination-order choices) before a sparse solver is a sequence of
    choices whose cost is counted fill-in and field operations. A policy can
    choose the next pivot. Its ceiling is set by the row-support structure:
    a random sparse matrix of the same row-weight profile has no structure
    to exploit, and the only structural lever the corpus names is
    displacement-rank / arithmetic-progression supports (KN-OPEN-006,
    IDEA-20260816-dca08c), which is a property of the base, not of the
    pivot order.

    THE POLICY, AS AN MDP. Episode = one target R (solve channel) or one
    relation matrix (LA channel). STATE = a lossy summary of the current
    partial computation: the degree profile of the current basis / Macaulay
    layer, pair-queue statistics (counts by degree and sugar, LCM degree
    histogram, number of pairs discarded by Buchberger criteria), the set of
    already-guessed variables with their values or classes, branch depth,
    charged cost so far; for the LA channel the row/column weight histogram
    and the current fill. ACTION = next pair (or next degree batch), next
    guess (variable, value or ordered class), abandon branch, or next pivot.
    REWARD = minus the increment of CHARGED cost, in counted field operations
    plus counted pair reductions plus the policy's own inference cost at a
    declared exchange rate, until a CERTIFIED decomposition (a triple
    re-verified by an independent point-addition code path) or a CERTIFIED
    failure (c_D(R) = 0 by an exhaustive enumeration the policy never sees).
    BASELINE = the default strategy: sugar / normal selection in the
    Buchberger loop, degree-by-degree batching in F4, and the lane's frozen
    hybrid convention (the k = m-1 leaf charged by root-finding plus hash
    lookup, never by a Macaulay solve -- da1428's leaf-costing control).
    G_obj(p) = charged cost of the baseline / charged cost of the trained
    policy, on held-out targets of the Semaev system at prime p.

    THE NULL, WHICH IS THE POINT. The SAME policy architecture is trained
    and evaluated, with the same budget, on (N1) a SUPPORT-MATCHED
    SEMI-REGULAR RANDOM SYSTEM of the same shape -- S_4 replaced by a random
    polynomial of the same multidegree support, f_V kept (da1428's
    random-support null; the T11 discipline of RQ-DREG-001 carried into
    RQ-PFDR-ae2fba) -- and (N2) a RELABELLED Z/N instance, the same base and
    targets pushed through a random bijection of labels so that no
    coordinate structure exists, used for the enumeration-side and
    target-side arms where the object is a group and not a polynomial
    system; for the LA channel the null is a random sparse matrix with the
    same row count and row-weight profile. G_null(p) is the same ratio on
    the null. The STRUCTURE-SPECIFIC GAIN is Gamma(p) = G_obj(p) / G_null(p).

    THE CLAIM. Gamma(p) is a constant, predicted about 1, along the toy
    ladder log2 p in {16, 20, 24, 28} on both live channels: whatever a
    learned policy gains on the Semaev system it gains equally on a random
    system of the same shape, because the gain is generic solver overhead
    (a learned sugar-like heuristic, a learned early-abandon rule, a learned
    minimum-degree pivot rule) and not Semaev structure. G_null > 1 is
    expected and is NOT a finding. The ALIVE outcome, which this record is
    designed to be able to see and which falsifies the claim, is Gamma(p)
    growing with p (fitted slope delta > 0 in log Gamma against log p,
    Holm-corrected across cells, surviving the permuted-reward and
    planted-needle controls and the leak audit). In that case the policy's
    learned guess rule is extracted as a formula by symbolic regression
    (sibling IDEA-20260906-1f6bfe, concurrent; if absent, the symbolic-
    regression line of RQ-RELN-61638a's methods list) -- for example "the
    policy always specialises the variable whose x lies in the lowest
    quadratic-residue class" or "the policy always branches at degree d*(B)
    = alpha B + beta" -- and that formula becomes a PROOF OBLIGATION: a
    checkable statement about the ideal I_R that either lowers its effective
    solving degree (escape (E2) realised, feeding RQ-PFDR-ae2fba's alive
    branch) or is refuted on a nearby object.

    THE CEILING, STATED FIRST AND NOT AS A CAVEAT. A policy cannot lower the
    solving degree of the ideal it is handed: for any Groebner-order solver
    -- every monomial order, every selection strategy, F4, F5, XL -- the
    polynomial-calculus refutation degree of the instance is a lower bound
    on the maximum degree reached (H-PCD-03be5a, IDEA-20260806-e4f96e), so
    pair selection alone cannot move a degree-driven cost. A policy CAN
    change the ideal by guessing, and every guess is charged at its
    branching factor (B per fully specialised variable; B/t per ordered
    class of size t, times the class-membership cost). Since the hybrid
    optimum under the null is already full guessing (da1428), the algebra's
    marginal value is negative unless (E2) fires; the policy's best case on
    the solve channel is therefore exactly the size of the (E2) effect, and
    on the existence channel it is a constant below 2. Nothing in this
    record can move an exponent by itself, and the record says so in
    target_complexity.

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md section 3). Representation:
    the affine x-coordinate on the short-Weierstrass model -- the class in
    which S_4 and f_V are written; RQ-ECDLP-623a32's class label for it was
    not re-opened this session and is carried by name only. Operation set
    Sigma: NOT the group's translation action -- the policy acts on the
    SOLVER'S computation, so Sigma = {reduce one S-pair / one F4 degree
    batch, specialise one variable to a factor-base value or ordered class,
    abandon a branch, eliminate one pivot}. Trichotomy: COORDINATE-DEPENDENT
    (the policy's features are functions of x(R), of the x-values of the
    base, and of the solver's internal degree/support statistics; no
    discrete logarithm enters), with the host pipeline -- index calculus --
    being Class I partial-action (translation by base elements only,
    IDEA-20260806-c5d183), named as the off-limits component it is built on.

    LOSSY-PROJECTION TEST AGAINST SIGMA. The MDP state DISCARDS the
    polynomial coefficients and the exact monomial supports, retaining
    degree profiles, queue statistics and the guessed set. This is genuinely
    lossy (two ideals with identical degree profiles and different
    coefficients are common: the semi-regular null is constructed to be one
    of them). The discard is NOT Sigma-compatible in the deterministic sense
    -- the next degree profile depends on coefficients the state has thrown
    away -- so the retained object does NOT propagate deterministically. It
    is a BRANCHING object (IDEA-20260802-002 sense) whose branching is the
    policy's own action set; the state is a partially observed projection,
    which is exactly why the rule is LEARNED rather than computed, and the
    thing being learned is a statistical regularity of the loss. This is
    the honest placement and it is why the record's claim is about a
    measured gain against a null, not about a new invariant.

    WHY G_null > 1 IS EXPECTED. Selection heuristics are known to change
    Buchberger's running time by large constants on generic systems, and a
    learned selection strategy on random binomial ideals is reported to beat
    the classical degree/sugar strategies by a constant factor (RECALLED:
    Peifer, Stillman, Halpern-Leistner, "Learning selection strategies in
    Buchberger's algorithm", ICML 2020; provenance recalled, not fetched
    this session). That literature is about GENERIC systems, i.e. about
    G_null. Reporting G_obj alone would therefore report a known effect as
    a discovery; the null arm subtracts it.

    WHY Gamma ~ 1 IS PREDICTED. Three reasons stack. (i) The membership
    generators f_V are the same polynomials on object and null; they carry
    the degree-B slope of da1428 and dominate the residual solving degree
    at every k, so the degree profile the policy sees is mostly f_V's on
    both arms. (ii) The corpus's committed prime-field degree readings are
    consistent with the semi-regular reference or are proxies with no
    dynamic range (IDEA-20260807-1354d8; RQ-PFDR-ae2fba motivation (i)),
    and the one recorded early fall (EV-ALPF-001) was never replicated under
    a validated meter with a matched null; so no committed measurement
    supports a Semaev-specific degree deficit at toy scale. (iii) Any guess
    rule that is a function of x(R) and the base's x-values alone is a
    representation-decidable predicate, and the lane's evidence on such
    predicates (the FB3 battery, c5c614's decay exponents) points at
    constants. If all three hold, the policy learns the same tricks on both
    arms and Gamma ~ 1.

    WHAT WOULD MAKE Gamma GROW. Only a schedule under which the Semaev
    ideal's EFFECTIVE solving degree -- the degree at which some branch of
    the guessed ideal reaches a Groebner basis -- falls below the
    semi-regular value by a margin growing with B. That is (E2). The
    positive control makes this concrete: a PLANTED system in which one
    variable's membership polynomial is replaced by a product of two
    low-degree factors known to the experimenter, so that specialising THAT
    variable first provably halves the residual degree; a policy that
    cannot learn to specialise the planted variable first is not a search,
    and the cell is void (the planted-needle control of harness/rl_isogeny
    and IDEA-20260904-987b20, reused).

    THE LA CHANNEL MECHANISM. Structured Gaussian elimination on B rows of
    weight <= 4 is a fill-in minimisation whose classical heuristics
    (minimum degree, Markowitz) are already near the constant-factor
    frontier on random sparse matrices; a learned pivot rule changes
    constants on the null and could only change more on the object if the
    relation supports carry structure (AP supports, KN-OPEN-006). Gamma_LA
    is therefore a cheap side measurement of whether the lane's relation
    supports have any exploitable structure at all, which KN-OPEN-006 asks
    and IDEA-20260816-dca08c measures by a different invariant.

    SEQUENCING. This record is deliberately placed AFTER the exhaustive
    enumeration battery and the predictor panel of RQ-RELN-61638a: the
    exhaustive c_D tables supply the certified-failure oracle and the
    decomposable/undecomposable target split the solve arm needs, and the
    predictor panel decides whether target selection has any lift, which
    determines whether channel (1) is worth a bandit at all.

