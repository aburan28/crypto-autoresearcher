idea:
  id: IDEA-20260801-018
  question_id: RQ-MQOM-001
  title: >-
    TCitH forgery bound tightness probe: measured forgery advantage of the
    TCitH transform at toy parameters versus the tightness bound
  class: control
  claim: >-
    MQOM's TCitH forgery bound claims a specific tightness relationship;
    a controlled toy experiment measuring the actual forgery advantage of
    the TCitH transform at toy parameters (vs. the ideal MQ challenge) and
    the actual MQ solving cost at MQOM's parameter pattern either confirms
    the claimed tightness or reveals a gap between the bound and the
    measured advantage. This decides whether the forgery bound is tight.
  mechanism: >-
    TCitH (Threshold-Commit-and-Prove in-the-Head) bounds forgery advantage
    by a function of the underlying MQ hardness; at toy parameters both the
    forgery advantage (by direct forgery simulation) and the MQ solving cost
    are measurable. The comparison of the measured forgery advantage to the
    bound's prediction, at the parameter pattern MQOM uses, probes
    tightness.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal probes TCitH forgery-bound tightness at toy
        parameters in this program.
    conclusion: >-
      Control experiment; novelty unverified against full literature, which
      is the point of the probe.
  assumptions:
    - Toy parameters preserve the TCitH transform's structure.
    - Direct forgery simulation at toy sizes is feasible.
  predictions:
    - metric: measured_forgery_advantage_over_bound_prediction
      direction: different
      minimum_effect: >-
        A measured advantage above the bound's prediction by more than 2x
        at the largest toy size is a tightness departure.
  minimal_test:
    design: >-
      Build toy MQOM-style instances with the TCitH transform at the
      parameter pattern (threshold, parallel repetitions); run direct forgery
      simulation to measure advantage; compute the bound's prediction;
      report the ratio. Separately measure MQ solving cost at the toy
      parameter pattern.
    controls:
      - Ideal MQ challenge instances (no transform) as the baseline.
      - Two independent forgery simulations.
    required_metrics:
      - measured forgery advantage
      - bound prediction
      - MQ solving cost at the parameter pattern
  falsification_conditions:
    - Measured advantage within 2x of the bound (bound tight at toy scale).
    - Measured advantage above 2x (bound loose; tightness claim fails).
  confounders:
    - Toy-size effects on the threshold structure.
    - Forgery-simulation model choices.
  interpretation_limits:
    - Toy probe only; no crypto-scale claim about MQOM's parameters.
    - A tight toy probe does not prove crypto-scale tightness.
  heuristic_assumptions:
    - id: HEUR-MQOM-TIGHT-1
      statement: >-
        The TCitH forgery-advantage ratio at toy sizes is directionally
        representative of larger sizes.
      rigorous_support: None; heuristic, tested by the toy-size trend.
      validation_plan: Run the probe at 2-3 toy sizes and check the trend.
  target_complexity:
    time_exponent: n/a (probe)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured forgery-advantage vs
    bound ratio that decides whether TCitH's tightness claim holds at toy
    scale.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
