idea:
  id: "IDEA-20261007-670f01"
  question_id: RQ-SSI-1946c9
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: "Multi-hop reduction ledger compiler from EndRing to one-way to IND-CPA skeleton"
  class: composition
  claim: "Every PKE syntax on this question compiles into an explicit hop ledger H0 EndRing challenge distribution to H1 intermediate search to H2 one-wayness to H3 IND-CPA target, each hop carrying distribution, output equivalence, auxiliary list, tightness loss, and quantifier order; the compiler either emits the complete checkable skeleton or names the first missing hop (distribution gap, equivalence gap, circular-evaluation gap, auxiliary gap, quantifier gap) as the obstruction with a pointed repair."
  mechanism: "Ledger template with one row per hop: H0 states D_EndRing, witness shape, and equivalence check; H1 states the intermediate search (example: smooth path E_pk to E_c) and its GRH-conditional bridge with the condition labeled not discharged at toy scale; H2 states f_pk one-wayness with the public-Eval non-circularity certificate (Eval runs on pk plus coins only); H3 states the 1-bit indistinguishability target with the hardcore-invariance entry pointing at IDEA-20261007-20f660 results. Compiler checks check quantifier order (forall pk from D_KeyGen, exists PPT inverter with stated loss), tightness multiplication across hops, auxiliary closure (every helper input appears in exactly one hop auxiliary list), and cascade naming (which published reductions a tight H0-to-H2 entry would feed). Cheap pre-compute audits run before any implementation: exact baseline reproduction of the H0-to-H1 equivalence statement, observation-collision search over witnesses sharing one public state, quantifier-order write-out, and method-ceiling plus nearby-object control. Output is a skeleton or a named gap, never a security verdict."
  novelty_status: unverified
  citations:
    - {ref: "IDEA-20261004-a09dd4", provenance: "recalled", claim: "Single-instance bridge with distance epsilon; this compiler differs by bookkeeping all hops plus quantifiers and tightness", verified_by: null}
    - {ref: "IDEA-20261004-e4c461", provenance: "recalled", claim: "Label-transport barrier consumed here as the H2 observation-collision audit", verified_by: null}
    - {ref: "KN-LIT-074", provenance: "recalled", claim: "H0-to-H1 conditional equivalence shape, recorded as undischarged condition", verified_by: null}
    - {ref: "KN-TECH-028", provenance: "recalled", claim: "Deuring and KLPT ingredient references for H1 solver statements", verified_by: null}
    - {ref: "KN-LIT-6628", provenance: "recalled", claim: "Prior supersingular pointer to position cascade claims against, not checked", verified_by: null}
    - {ref: "KN-LIT-827", provenance: "recalled", claim: "Prior supersingular pointer to position cascade claims against, not checked", verified_by: null}
  assumptions:
    - "Compiler is unconditional bookkeeping: instantiating its rows may be conditional but compiling the ledger invokes no heuristic, stated explicitly here."
    - "Every intermediate assumption (torsion images, orientations, trusted setup, hidden paths, special-curve sampling) gets its own hop row; silence is a gap, not a default."
    - "IND-CCA, KEM, concrete-level, and deployment claims are separate later contracts and must not appear in any H3 entry."
    - "Reduction direction is from the weaker to the stronger statement with loss stated; reversed or loss-free hops are rejected as malformed."
  proof_search_map:
    bottleneck: "H1-to-H2 hop: converting a found smooth path (any preimage) into inversion of the exact randomized Eval preimage with hardcore preservation."
    baseline_embedding:
      parameter_slice: "H0-to-H1 equivalence statement as recalled from KN-LIT-074 (GRH-conditional EndRing to path shape) reproduced symbolically as the boundary the ledger must not claim to extend."
      reproduction_check: "Write out the recalled equivalence with its GRH condition and distribution qualifier verbatim as a skeleton row, marked undischarged, before adding any new hop."
    observation_collision:
      observable: "Public pair (pk, c1) plus decoder output bit."
      distinct_preimage_search: "Search two distinct witnesses (two EndRing bases for one pk, or two randomness values r1 versus r2 with Eval(pk, r1)=Eval(pk, r2)) that give the same observable input but different decoder outputs; a hit is the label-transport or preimage-non-uniqueness obstruction."
    constructive_transforms:
      - {transform: "representation_reduction", proposed_object: "hop ledger reducing a multi-assumption candidate to single-responsibility rows", predicted_gain: "first missing hop named without implementation spend"}
      - {transform: "observable_fiber", proposed_object: "collision search over the fiber above one public state", predicted_gain: "kills circular or ambiguous H2 entries before audit spend"}
    quantifier_order: "Forall security parameters and forall (pk, sk) in the support of D_KeyGen, exists PPT inverter Inv such that forall messages and forall randomness, decoder agreement holds except with stated failure probability; the IND-CPA target separately quantifies forall PPT adversaries exists negligible advantage bound as an undischarged skeleton entry."
    method_ceiling:
      strongest_certifiable_claim: "Well-typed non-duplicative PKE mechanism with checkable toy correctness and a precise EndRing-anchored hop skeleton, or a named gap for every examined mechanism."
      nearby_object_control: "Same ledger applied to an oriented-CM variant must expose the extra orientation hop as a gap rather than passing silently; if it passes silently the compiler is broken."
    proof_obligations:
      - {claim: "H0 distribution and equivalence are stated", responsibility: "interface"}
      - {claim: "H1 solver shape and conditions are stated", responsibility: "correctness"}
      - {claim: "H2 public-Eval non-circularity holds", responsibility: "strictness"}
      - {claim: "H3 target game is one-way or IND-CPA only", responsibility: "scope"}
      - {claim: "Tightness product and auxiliary closure check", responsibility: "size"}
    not_applicable_reason: null
  predictions:
    - {metric: "first-gap identification rate", direction: "higher", minimum_effect: "on at least 3 of 4 pilot candidates (W template plus 3 recalled prior shapes) the compiler names a distinct first gap without implementation, else the template is insufficiently strict"}
    - {metric: "silent-pass rate on nearby oriented control", direction: "lower", minimum_effect: "0 silent passes on the oriented-CM nearby object; any silent pass is a compiler bug"}
  minimal_test:
    design: "Paper-compile 4 pilot ledgers (one for IDEA-20261007-20f660 plus one skeleton each for the 3 recalled prior shapes KN-LIT-6572, KN-LIT-6628, KN-LIT-827 slash KN-LIT-1260 at skeleton depth only) and run the four pre-compute audits per ledger with no code."
    controls: ["oriented-CM nearby object that must expose an extra hop", "deliberately circular Eval variant that must fail the H2 certificate", "blank-aux variant with hidden torsion that must fail auxiliary closure"]
    required_metrics: ["first gap named per pilot", "quantifier-order checklist pass or fail", "collision-search hit or miss log", "tightness product expression per ledger"]
  falsification_conditions:
    - "Two pilots with plainly different missing assumptions receiving the same first gap falsifies the ledger strictness and returns template-coarseness obstruction."
    - "Silent pass on any control variant falsifies compiler soundness and blocks use until repaired."
    - "No gap named on a pilot whose primary, once read, shows an unstated assumption is a missed-gap failure with forward guidance to add the hop row."
  confounders:
    - "Recalled (not read) prior shapes mis-stating their aux lists, mitigated by marking every such row recalled slash unverified."
    - "Conflating skeleton completeness with security, forbidden by the H3 scope rule."
    - "Tightness arithmetic hiding superpolynomial loss in prose rather than factors."
  interpretation_limits:
    - "Paper audit only; a complete skeleton is readiness for toy implementation, never evidence of hardness or security."
    - "Cascade entries name published reductions that would apply if hops tighten; they assert no corollary now."
    - "Scoped to PKE KeyGen slash Encrypt slash Decrypt; KEX, NIKE, AKE, signatures, combiners, and deployed protocols are excluded."
  heuristic_assumptions: []
  target_complexity:
    time_exponent: "N/A: ledger compiler moves no exponent; it prices which hop would need to move one"
    memory_exponent: "N/A: no memory claim"
    best_known: "Otilde(p^{1/4}) pure path-finding baseline carried as the H1 context, recalled from KN-OPEN-013"
    hidden_overhead: "Tightness losses are written as explicit factors per hop, never absorbed."
    tradeoff_note: "No tradeoff claimed; cofactor-level tightening work must label itself as such per the exponent-first bias."
