# IDEA-20261003-6a9d3a
# Separable-degree split. Proposal only. Not approved.
idea:
  id: IDEA-20261003-6a9d3a
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Frobenius in characteristic 5 has inseparable degree 5 and separable degree 1
  class: measurement
  claim: >-
    Frobenius in characteristic 5 has inseparable degree 5 and
    separable degree 1. Five exceeds one by 4. The product of the
    two degrees is 5. Their sum is 6. The gap is a split of one
    map degree, not an ECDLP exponent and not a square.
  mechanism: >-
    OBJECT FRAME. R3 is the Frobenius endomorphism. The operation
    set is splitting its degree into an inseparable part and a
    separable part, which is coordinate-dependent on the
    characteristic and is not a translation of a curve point.
    Two copies of separable degree 1 have gap 0. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from this
        inseparable and separable split.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The characteristic 5 is frozen before the degrees are read.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 4.
    baseline_embedding:
      parameter_slice: The inseparable degree 5 and the separable degree 1.
      reproduction_check: >-
        Two readers subtract and must agree that 5 exceeds 1 by 4.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 1 drops the gap. Two copies of
        separable degree 1 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two degree parts.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The characteristic is fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degrees 5 and 1. Not a square.
      nearby_object_control: >-
        Two copies of separable degree 1. The gap is 0.
    proof_obligations:
      - claim: The inseparable degree is 5.
        responsibility: size
      - claim: The separable degree is 1.
        responsibility: size
      - claim: The gap is not a square.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: Five exceeds one by 4.
  minimal_test:
    design: >-
      Subtract 1 from 5 and multiply 5 by 1. Do not map a curve point.
    controls:
      - Two copies of separable degree 1, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The inseparable degree is not 5.
    - The product of the two degrees is not 5.
  confounders:
    - The total degree 5 is not a second separable degree.
  interpretation_limits:
    - A degree split is not a walk length.
    - No transfer to a cryptographic field.
    - This is not a comparison of total degrees over fields of size 3 and 2.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen Frobenius in characteristic 5 has inseparable
        degree 5 and separable degree 1.
      rigorous_support: >-
        No Frobenius theorem is re-proved here. The count is a
        reading of one characteristic.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: The total degree is the product, already frozen as 5.
    tradeoff_note: A larger inseparable degree is not a shorter walk.
