# IDEA-20261003-6d205b
# Negation-orbit parity. Proposal only. Not approved.
idea:
  id: IDEA-20261003-6d205b
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Negation orbits on one frozen curve have size 1 or 2
  class: measurement
  claim: >-
    On one frozen short-Weierstrass curve over one frozen prime field,
    every rational point has negation-orbit size 1 or 2. Size 1 is the
    2-torsion. The number of points with size 2 is even. An orbit of
    size greater than 2 falsifies the claim. The even count is not an
    ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R3 is the endomorphism ring, used only through the
    negation map, which is the automorphism [-1]. The operation set is
    that map on rational points. Negation is an involution, so orbits
    have size 1 or 2. The measurable number for a larger unit group is
    the cost of picking one representative per orbit. This proposal
    checks the involution case only.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        Endomorphism image and automorphism discount are in scope, and a
        constant at or below sqrt(6) is not an attack.
      verified_by: coordinator session 2026-10-03, question file read
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic floor remains the exponent constraint.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The curve and the prime are frozen before the orbit count.
    - Negation is the map (x, y) to (x, -y) in the frozen chart.
  proof_search_map:
    bottleneck: The orbit size of negation.
    baseline_embedding:
      parameter_slice: One curve and the negation map.
      reproduction_check: >-
        Two counters list orbits and must agree that every size is 1 or 2
        and that the size-2 count is even.
    observation_collision:
      observable: The multiset of orbit sizes.
      distinct_preimage_search: >-
        An orbit of size 3 or more is not negation on an elliptic curve.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: The set of negation orbits.
        predicted_gain: A parity check. No exponent.
    quantifier_order: >-
      The curve is fixed before the orbits are listed.
    method_ceiling:
      strongest_certifiable_claim: >-
        Orbit sizes on that curve. Not a GLV speedup.
      nearby_object_control: >-
        The identity map. Every orbit has size 1, and the size-2 count is 0.
    proof_obligations:
      - claim: Every negation orbit has size 1 or 2.
        responsibility: correctness
      - claim: The size-2 count is even.
        responsibility: size
      - claim: The parity is not an ECDLP exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: negation_orbit_size
      direction: different
      minimum_effect: Every orbit has size 1 or 2, and the size-2 count is even.
  minimal_test:
    design: >-
      Freeze the curve. Enumerate rational points. Group them by negation.
    controls:
      - The identity map, whose size-2 count is 0.
      - An independent grouping.
    required_metrics:
      - orbit sizes
      - the size-2 count
      - the size-1 count
  falsification_conditions:
    - An orbit has size other than 1 or 2.
    - The size-2 count is odd.
  confounders:
    - The point at infinity is fixed and must be counted as size 1.
    - Characteristic 2 makes the chart (x, -y) the wrong negation formula.
  interpretation_limits:
    - One curve is not a theorem about every endomorphism.
    - Orbit size 2 is the negation involution, not a GLV decomposition.
    - No transfer to a cryptographic prime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Negation is an involution on the rational points of the frozen
        short-Weierstrass chart in odd characteristic.
      rigorous_support: >-
        [-1] composed with itself is the identity on an elliptic curve
        in odd characteristic. This proposal tests that reading by enumeration.
      validation_plan: >-
        Enumerate orbits. Any size outside {1, 2} falsifies the reading
        on that curve.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: O(p) for a toy enumeration.
    best_known: >-
      Automorphism-discounted rho. Orbit size 2 is the |Aut| factor 2,
      a constant, not an exponent.
    hidden_overhead: The point at infinity and the characteristic.
    tradeoff_note: Enumeration is the measurement, not an attack.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic floor forbids reading an involution as an exponent
          improvement. This record measures orbit sizes only.
  dominated_by: >-
    No attack is claimed. Rho rows dominate any attack reading of an
    orbit size.
  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: One frozen curve and the negation map.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
