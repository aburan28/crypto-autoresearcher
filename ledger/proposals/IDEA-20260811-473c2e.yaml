idea:
  id: IDEA-20260811-473c2e
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE ARITHMETIC HALF OF THIS LANE, MEASURED WITH THE ONE DESIGN THAT REMOVES
    ITS CONFOUND - fix N = 19507 and vary the trace, so D = (t-2)^2 - 4N sweeps
    46 DISTINCT fundamental discriminants across 51 conductor-1 classes spanning
    |D_0| = 1299 to 78027 at IDENTICAL GROUP ORDER; regress relation density on
    log|D_0| with a pre-registered slope of ZERO, and note that this is the first
    design in the campaign for which NULL-C is the RIGHT detector rather than a
    disqualified one, because the #E confound it is maximally sensitive to has
    been made to vanish identically instead of being modelled
  class: measurement

  object: >-
    OBJ-DISC, the fundamental discriminant |D_0| as a continuous covariate at
    fixed group order. Equivalently, at conductor 1, the minimal norm
    N(alpha_min) ~ |D_0|/4 of a non-rational endomorphism, and equivalently the
    degree h(D_0) of the Hilbert class polynomial whose roots are the class's
    j-invariants. The tracked object is the ARITHMETIC SIZE OF THE ENDOMORPHISM
    RING, which is the lane's own definition of "special j" in the CM sense - and
    which IDEA-20260811-df6c0f shows is a different divisor from the algebraic one
    the rest of this batch studies.

  resource: >-
    R3 (End(E) as a ring) primarily, with R1 supplying the measured functional
    (relation density in a Semaev decomposition). H-ENDO-001 admissibility: the
    endomorphisms are never applied to points of G, only their RING is used as a
    covariate; nothing here requires a non-scalar action, and the record would be
    dead on arrival if it did.

  claim: >-
    (A) THE IDENTITY THAT MAKES THE DESIGN POSSIBLE. With N = #E(F_p) and t the
    trace, p = N + t - 1 and
        D = t^2 - 4p = (t - 2)^2 - 4N.
    So FIXING N AND VARYING t sweeps D - hence D_0 and the conductor f - while
    the group order is identical by construction. [The identity is elementary and
    is *[derived here]* in MATCHED-ORDER-DESIGN.md section 3, where it is
    reported as verified on every admissible trace of the computed families;
    that note is a design proposal, not a committed measurement, and every number
    below is a gate of the minimal test.]
    (B) THE INSTANCE. At N = 19507 (prime): 59 isogeny classes, about 2000 curves
    total, ALL with #E = 19507 exactly; 51 classes at conductor f = 1 carrying 46
    DISTINCT fundamental discriminants (five values hit twice by trace pairs,
    which is a free internal replication check) spanning |D_0| = 1299 to 78027 -
    nearly two orders of magnitude with the conductor pinned. At f = 1 every
    curve is at the crater with End(E) = O_{D_0}, so N(alpha_min) ~ |D_0|/4 and
    the class's j-invariants are the h(D_0) roots of the Hilbert class polynomial
    modulo p. THIS IS THE ARITHMETIC-SPECIAL-j AXIS, SWEPT PROPERLY, WHICH THE
    LANE HAS NEVER DONE.
    (C) WHY THE CONFOUND MATTERS AND WHY THIS DESIGN KILLS IT. The campaign's
    earlier between-class results were voided by the #E confound: the hash-and-lift
    target sampler's acceptance rate is (#E - 1 + z)/(2p), so it encodes the class
    label into the target multiset (CORR-20260807-a05e1e, committed, which
    forbids citing the p-values it supersedes). And NULL-C, the permutation null
    those results rest on, was characterised by the red team as a BETWEEN-CLASS
    MEAN DETECTOR with power 1.00 at a 0.9% shift - "maximally sensitive to
    exactly the #E confound", with median p = 0.059 at zero planted shift because
    "the real data already carries a small class effect from #E"
    (red_team_notes.md section 5, committed). AT FIXED N THAT CONFOUND IS
    IDENTICALLY ZERO: there is no #E covariate to model, no matching to perform,
    and NULL-C's known failure mode is out of scope by construction. This is the
    only design in the campaign for which NULL-C is the appropriate instrument
    rather than a disqualified one, and that inversion is worth stating
    explicitly because NULL-C's disqualification has become a reflex.
    (D) THE PRE-REGISTERED PREDICTIONS.
      P1 (the null, and what I expect) - the slope of decomposition_rate_m3 on
        log|D_0| across the 51 conductor-1 classes is ZERO within a 95%
        confidence interval whose half-width is reported. Basis:
        DECOMPOSITION.md section 5 item 1 predicts "zero variance in relation
        yield, which depends on N and factor-base size only", and N is identical
        by construction here.
      P2 (the alternative, stated so the test has a direction) -
        MATCHED-ORDER-DESIGN.md section 5 names "N(alpha_min) down => relation
        density up" as the real form of the hoped-for effect. At f = 1 that means
        a NEGATIVE slope on log|D_0|. If the slope is negative and survives the
        density sweep and reproduces at a second N, the lane has its first
        genuine arithmetic effect.
      P3 (replication) - the five discriminants hit twice by trace pairs must
        show the SAME rate within noise at both traces. This is free internal
        replication and a cheap artifact detector: a difference between t and t'
        at the same D_0 and the same N cannot be an arithmetic effect.
      P4 (the twist check) - trace pairs (t, -t) at this N have the SAME D and
        therefore the same D_0, and by IDEA-20260811-bbcd68 the same j-multiset.
        Their relation densities may differ, because #E differs between them...
        EXCEPT THAT IT DOES NOT HERE: N is fixed, so a trace pair (t, -t) does
        NOT both appear in this family (p differs). The contract must state which
        traces are in the family and must not assume twist pairing survives the
        N-fixing, which it does not - a subtle point the design note does not
        make and this record does.

  mechanism: >-
    A decomposition rate is the probability that a random point of E(F_p) is the
    sum of m factor-base points. Counting heuristically, it depends on the number
    of m-subsets of the factor base and the group order, i.e. on |V| and N alone.
    The endomorphism ring enters only through the curve's equation, and the
    equation enters the decomposition system only through the summation
    polynomial's coefficients. So the mechanism predicting P1 is that there is no
    channel: nothing carries |D_0| into the count. The mechanism that would
    produce P2 is that the curve's equation is systematically less generic at
    small |D_0| - the j-invariants are roots of a low-degree Hilbert class
    polynomial - and that this non-genericity biases the Semaev variety's
    F_p-point count. That is a real, statable alternative rather than a hope,
    and the experiment separates them.

  novelty_status: adaptation
  novelty_note: >-
    The matched-order construction is *[derived here]* in the campaign's own
    design note MATCHED-ORDER-DESIGN.md sections 3 and 4 (experiment E2), which
    is explicitly "a design proposal, not an approved contract" that "mints no
    ledger IDs and changes no hypothesis status". THE ADAPTATION is turning its
    E2 into a pre-registered proposal record in THIS lane, scoped to the |D_0|
    axis rather than the conductor axis, with numeric predictions, and with the
    NULL-C inversion and the twist-pairing correction in (D) P4 that the note does
    not contain. Corpus grep: no IDEA record cites N = 19507 or the matched-order
    identity. External literature NOT checked.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-a3d644, which proves that an exact (p, N, cofactor) match
    across different D_0 is IMPOSSIBLE by T4 and therefore builds its null
    through the COFACTOR at fixed p; this record fixes N and lets p vary, which
    is the complementary and previously unused escape from the same obstruction,
    and the two records' impossibility arguments are consistent - a3d644's holds
    at fixed p, and this design does not fix p. NOT IDEA-20260807-778375, which
    argues about what small |D_0| makes computable and measures nothing. NOT
    IDEA-20260811-99cc67, which is the WITHIN-class |Aut| contrast at a single
    trace of the same family; this is the BETWEEN-class |D_0| contrast across 51
    traces, and the two use disjoint arms of one construction.

  assumptions:
  - >-
    Every arithmetic fact in (B) is *[derived here]* in a design note and must be
    RE-DERIVED as gate 1: primality of 19507, the 59 classes, the 51 conductor-1
    classes, the 46 distinct D_0, the |D_0| range, and the five doubled values.
    A design whose parameters are wrong measures a different family.
  - >-
    Class enumeration uses the Hurwitz-Kronecker mass, not the class number, per
    IDEA-20260811-cd7c10 - relevant here because the family contains a D_0 = -3
    class whose vertex count and mass differ by 2/3.
  - >-
    TARGETS ARE SAMPLED WITH targets_B (harness/exp_icinv_fullgroup.py), NOT
    targets_uniform, which samples only the cyclic subgroup <G> and is disputed
    by H-ICINV-6c7920 (status `specified`, neither presumed true nor false).
    Reusing targets_uniform would measure two different estimands on the two
    halves of every class, split by r.
  - >-
    The factor-base DENSITY, not its absolute size, is held fixed across classes,
    because p varies across the family (see confounders).

  proof_search_map:
    bottleneck: >-
      The bottleneck is the #E confound, which voided the campaign's previous
      between-class relation-density results and which no amount of modelling
      removed. The matched-order identity removes it by construction, which is
      the only reason this measurement is worth taking again.
    baseline_embedding:
      parameter_slice: >-
        A single class of the family, measured against the binomial expectation
        for its |V| and N, is the baseline slice; the decomposition rate must
        match the standard heuristic 1/m! at the operating density within the
        binomial band.
      reproduction_check: >-
        Reproduce the committed p = 4001 rate_m3 mean of about 0.44-0.48 at the
        committed density on a class of comparable size, as a frozen fixture,
        before running the family. A pipeline that cannot reproduce the
        campaign's own committed rates is not measuring the same quantity.
    observation_collision:
      observable: The decomposition rate at a fixed density.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE. The rate is a function of (N, |V|, m) to first
        order, and N and |V| are held fixed by design, so ALL 51 classes are
        predicted to collide on the observable. That predicted collision IS P1.
        The separating condition, if P2 held instead, would be the curve equation
        entering through the summation polynomial - which is why the contract
        also records the S_3 and S_4 supports per class, so that an observed
        effect can be checked against the algebraic covariate rather than
        attributed to |D_0| by default.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        A design in which the nuisance variable is annihilated by an algebraic
        identity rather than adjusted for: D = (t-2)^2 - 4N makes N a design
        constant and D a free covariate, so the charges are over disjoint classes
        with no shared nuisance.
      predicted_gain: >-
        Removes the exact confound that NULL-C is maximally sensitive to, which
        converts NULL-C from a disqualified instrument into the correct one, at
        no cost.
    quantifier_order: >-
      FOR ALL conductor-1 classes in the family, the expected decomposition rate
      at fixed density equals a constant independent of D_0. The existential that
      breaks it is THERE EXISTS a monotone dependence on log|D_0|. The quantifier
      is over CLASSES, and the replication unit is the class, not the curve -
      so the effective sample size is 51 and not 2000, and the contract must
      compute its power on 51.
    method_ceiling:
      strongest_certifiable_claim: >-
        A slope estimate with a confidence interval at one N, one m, one prime
        range, over 51 classes and a stated density sweep. It CANNOT certify
        absence of an effect - only bound it at the achieved detectable slope -
        and it cannot extend beyond the tested |D_0| range of 1299 to 78027.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is the CONDUCTOR
        axis: within one class, D_0 is fixed and f varies, and MATCHED-ORDER-
        DESIGN.md section 1 shows the effective sample size there is 5, not 138,
        with the crater at n = 3. Running both arms and finding that the |D_0|
        arm has power while the conductor arm does not is what shows the design
        is identifying the right variable rather than any variable.
    proof_obligations:
    - claim: The family has 51 conductor-1 classes with 46 distinct D_0 at N = 19507
      responsibility: baseline
    - claim: The slope on log|D_0| is zero within the stated interval
      responsibility: correctness
    - claim: The doubled discriminants replicate
      responsibility: correctness
    - claim: NULL-C's power is characterised on THIS design in both signs
      responsibility: interface
    - claim: The achieved minimum detectable slope is reported
      responsibility: scope

  predictions:
  - metric: slope_of_decomposition_rate_m3_on_log_absD0
    direction: different
    minimum_effect: >-
      ZERO, with a 95% confidence interval containing zero, at every density in
      the sweep. The achieved half-width - the minimum detectable slope - MUST be
      reported; a null without it is not citable.
  - metric: slope_of_decomposition_rate_m2_on_log_absD0
    direction: different
    minimum_effect: ZERO, same standard. m2 and m3 are reported separately.
  - metric: slope_of_liftable_density_on_log_absD0
    direction: different
    minimum_effect: >-
      ZERO, same standard. Noted with suspicion: liftable_density is the ONE
      committed "positive" from the earlier between-class work, with NULL-C
      p-values of 0.0005 / 0.0000 / 0.2935 at p = 4001 / 2003 / 6007
      (red_team_notes.md section 4) - i.e. it did NOT reproduce at the third
      prime, and it is the metric most contaminated by the superseded sampler.
      It is measured here BECAUSE it is the suspicious one, and its result at
      fixed N is the cleanest available test of whether that positive was the
      #E confound all along.
  - metric: doubled_discriminant_replication_agreement
    direction: different
    minimum_effect: >-
      The five D_0 values hit by two traces each must agree within the binomial
      band, 5 of 5. A disagreement cannot be an arithmetic effect and would
      expose a per-class artifact.
  - metric: null_c_power_curve_on_this_design_both_signs
    direction: different
    minimum_effect: >-
      Reported before the main run: the planted-shift size at which NULL-C
      reaches power 0.8 on THIS family, measured separately for POSITIVE and
      NEGATIVE planted shifts, because the four committed p = 4001 classes carry
      an ordered class-mean gradient and a construction's measured power is NOT
      portable across sign. This is a required deliverable, not an optional
      characterisation.
  - metric: s3_and_s4_support_per_class
    direction: different
    minimum_effect: >-
      Recorded as a covariate, not predicted. If any class contains a curve on
      the degeneration divisor, that curve is flagged and the class is analysed
      with and without it, so that an algebraic accident cannot be read as an
      arithmetic trend.

  minimal_test:
    design: >-
      (1) Re-derive the family from scratch: all admissible traces at N = 19507,
      their D, D_0 and conductor, the class sizes by Hurwitz mass, and the
      conductor-1 subfamily. Publish the design matrix BEFORE measuring anything.
      (2) Characterise NULL-C on this design in both signs, with a planted-shift
      power curve. (3) For each of the 51 conductor-1 classes, enumerate its
      curves, and for each curve sample targets with targets_B, stratified on
      r = #{x : x^3 + a x + b = 0}, at a factor-base DENSITY swept over at least
      three values bracketing 1/m! ~ 0.167 - never the saturated row alone, since
      the committed over-dispersion decays from 2.04 to 0.93 as density falls.
      (4) Regress the class-mean rate on log|D_0| with the class as the
      replication unit. (5) Report the doubled-discriminant replication. (6)
      Record S_3 and S_4 support per class as an algebraic covariate. (7)
      Replicate the entire design at a second N before any general statement.
    controls:
    - >-
      C-NULL-C-POWER (BLOCKING). Both-sign power characterisation on this design,
      before the main run. NULL-C is used here - legitimately, for the first time
      - and using it without a fresh power curve on the actual design is exactly
      the error that cost the campaign a batch.
    - >-
      C-DENSITY-SWEEP (BLOCKING). At least three densities; the saturated row
      alone is not admissible.
    - >-
      C-TARGETS. targets_B with r-stratification, never targets_uniform.
    - >-
      C-BINOMIAL. Per-class rates compared against the binomial expectation for
      the class's own |V| and N; a class whose rate is outside the binomial band
      for reasons other than D_0 is flagged before pooling.
    - >-
      C-DOUBLED. The five doubled discriminants as internal replication.
    - >-
      C-ALGEBRAIC-COVARIATE. Any class containing a degeneration-divisor curve is
      analysed both with and without it.
    required_metrics:
    - design_matrix_trace_D_D0_conductor_class_size
    - decomposition_rate_m2_m3_per_curve_per_density_per_r_stratum
    - liftable_density_per_curve
    - class_mean_rates_and_regression_slope_with_interval
    - minimum_detectable_slope
    - null_c_power_curve_positive_and_negative
    - doubled_discriminant_agreement
    - s3_s4_support_per_class

  lossy_projection_answer: >-
    The projection is class -> |D_0|, discarding the trace, the individual
    j-invariants and everything about the equations. It is compatible with the
    campaign's operations in the required sense: D_0 is an isogeny-class
    invariant, so the retained part is constant on the object it labels and
    propagates trivially under transport. THE COST-SIDE HONESTY, WHICH IS
    DIFFERENT FROM THE REST OF THIS BATCH: the measured functional here is
    RELATION DENSITY, which is not a shadow of anything - it is a direct input to
    index-calculus cost, one relation at a time. So this record does NOT inherit
    the support-versus-time lossy projection at all; if a slope existed it would
    be a real cost effect. That is the strongest reason to run this arm even
    though I expect its null: it is the one measurement in this lane whose
    positive would not have to survive a projection argument.

  t5_reachability_answer: >-
    T5 IS INAPPLICABLE IN THE USUAL FORM AND THE RECORD SAYS WHY. |D_0| is fixed
    by the class (T4), so it is not something one walks to; there is no
    within-class minimiser to reach. The relevant gate is instead a
    CURVE-GENERATION question - could a curve be chosen with small |D_0| to make
    it weaker - and the answer to that is decided by whether P1 or P2 holds. If
    P1 holds there is nothing to choose. If P2 held, the affected-versus-safe
    scope audit is IDEA-20260807-51675e's nine-square-test table, not this
    record, and this record commits to routing it there rather than claiming it.

  null_object: >-
    NULL-C (label permutation across classes) is the null, used here for the
    first time in its actual domain of validity, with a fresh both-sign power
    curve as a blocking prerequisite. C-BINOMIAL is the within-class null.
    C-DOUBLED is the internal replication. Together these are the three
    directions the campaign's earlier between-class work lacked.

  falsification_conditions:
  - >-
    The regression slope on log|D_0| differs from zero beyond the stated interval
    at two or more densities. P1 is falsified; before any description, check the
    algebraic covariate and the doubled-discriminant replication, and replicate at
    a second N.
  - >-
    The doubled discriminants disagree. A per-class artifact exists and no
    regression is admissible.
  - >-
    NULL-C's power curve is strongly asymmetric in sign on this design. The
    detector is not usable as a symmetric test and the analysis must switch to a
    sign-aware procedure declared before the main run.
  - >-
    The rate depends on density in a way that changes the SIGN of the slope
    across the sweep. The effect is a saturation artifact, exactly as the
    committed over-dispersion decay suggested, and no arithmetic claim follows.
  - >-
    Any design fact in (B) fails to re-derive. The family is not what the design
    note says and the measurement is of an unspecified object.
  - >-
    liftable_density shows a slope while the decomposition rates do not. Given
    that liftable_density is the metric most contaminated by the superseded
    sampler (CORR-20260807-a05e1e), the pre-registered reading is SAMPLER
    ARTIFACT until independently reproduced with a third sampler - not an
    arithmetic effect.

  confounders:
  - >-
    p VARIES ACROSS THE FAMILY, and this is the design's one irreducible
    imperfection. p = N + t - 1 with |t - 2| <= 2 sqrt(N) ~ 279, so p spans
    roughly 19229 to 19787 - about 2.9%. The factor base must therefore be held
    at fixed DENSITY (fraction of the x-line) rather than fixed absolute size, or
    the field-size variation enters as a covariate. The contract must declare
    which and, if fixed density, must confirm that |V| differs across classes and
    account for it. THE DESIGN NOTE DOES NOT MENTION THIS AND THIS RECORD DOES.
  - >-
    Class size varies with h(D_0) ~ sqrt(|D_0|), from roughly 36 to 280 curves,
    so the per-class mean has 8x different precision across the range. The
    regression must be weighted, and an unweighted fit would let the large-|D_0|
    classes dominate exactly the covariate being tested.
  - >-
    Conductor is pinned at 1 only in the 51-class subfamily; the remaining 8
    classes have f in {3, 107} and belong to the volcano-depth arm, not here.
    Pooling them would confound the two axes.
  - >-
    The D_0 = -3 class in the family carries |Aut| = 6 at its crater and needs the
    Hurwitz correction; it is the object of IDEA-20260811-99cc67 and must be
    analysed with the correct denominator or excluded and reported as excluded.
  - >-
    Ordered class-mean gradient and sign-dependent power, carried forward from
    the committed p = 4001 four-class observation; handled by the both-sign power
    requirement.

  interpretation_limits:
  - >-
    One N, one prime range, one m suite, one solver, toy scale. A null bounds the
    effect at the achieved minimum detectable slope and asserts no absence.
  - >-
    Replication at a second N is REQUIRED before any general statement; a
    single-family slope, positive or null, is not a fact about discriminants.
  - >-
    claim_tier toy. No attack, no exponent, no speedup, sota_delta zero.

  heuristic_assumptions:
  - id: H1
    statement: >-
      For a factor base V of density delta in the x-line, the probability that a
      uniformly random point of E(F_p) decomposes as a sum of m factor-base
      points is approximately delta^m * |V|^m / m! normalised appropriately -
      i.e. a function of (|V|, N, m) alone, with no dependence on the curve.
    rigorous_support: >-
      The mean is exact for any factor base of the same size under the standard
      counting heuristic; this campaign records that as KN-FIND-007 (CITATION TO
      BE RE-VERIFIED against the corpus before use, not trusted from this
      record). The classical statement imitated is the uniform-random-subset-sum
      heuristic. The VARIANCE is not covered and is exactly where the campaign
      has already found unexplained over-dispersion.
    validation_plan: >-
      Sample: at least 10^4 targets per curve per density across all 51 classes,
      drawn with targets_B and stratified on r. Comparison: the empirical rate
      against the binomial prediction per class, and the dispersion ratio across
      the density sweep, which is expected to fall from about 2 to about 1 as
      density falls, reproducing the committed decay from 2.04 to 0.93. Tail
      check: the most extreme per-curve rate in each class against the binomial
      extreme-value prediction. Transfer to other N is NOT claimed and is the
      reason a second family is required.
  - id: H2
    statement: >-
      At conductor 1 the minimal norm of a non-rational endomorphism is
      N(alpha_min) ~ |D_0|/4, so |D_0| is a faithful proxy for the arithmetic
      size of End(E).
    rigorous_support: >-
      Elementary from the norm form of the order O_{D_0}; the campaign's own
      design note tabulates the corresponding N(alpha_min) values
      *[derived here]*.
    validation_plan: >-
      Compute N(alpha_min) exactly for all 51 classes by reducing the norm form,
      and confirm the proportionality to |D_0|/4 across the whole range. The tail
      check is the smallest and largest |D_0| in the family, where the
      approximation is weakest.
  - id: H3
    statement: >-
      The unexplained density-independent within-class over-dispersion recorded
      by the campaign is NOT caused by the #E confound and will therefore persist
      at fixed N.
    rigorous_support: >-
      None; this is an open question and DEC-20260810-d70ece NA8 records it as
      "the campaign's highest-priority open question", untouched. THIS DESIGN
      TESTS IT AS A FREE BY-PRODUCT, because it holds N fixed: if the
      over-dispersion vanishes at fixed N, it was the confound; if it persists,
      it is not, and the campaign's highest-priority open question gains its
      first discriminating datum.
    validation_plan: >-
      Report the within-class dispersion ratio per class across the density
      sweep, and compare against the committed p = 4001 values of 1.478 to 2.068
      at m = 2 and 3.940 to 5.922 at m = 3. A persistence at fixed N is a
      substantive result in its own right and must be reported even though it is
      not this record's primary question.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted on CM curves (KN-TECH-018). Note N = 19507 is far
      below any regime where index calculus is competitive, so the relation
      density is measured as a structural quantity and not as an attack
      component, and the record says so.
    hidden_overhead: Not applicable; no asymptotic claim.
    tradeoff_note: >-
      Not applicable to a claim. Operationally, 2000 curves x 3 densities x 10^4
      targets is the compute driver and is embarrassingly parallel.

  dominated_by: >-
    Every row of the attack frontier dominates - parallel rho with distinguished
    points, BSGS, kangaroo, and prime-field index calculus, none of which this
    record improves. Checked against each. At N = 19507 rho costs about 124 group
    operations in expectation, so no relation-collection design is remotely
    competitive at this scale and none is claimed.
  sota_delta: ZERO on every axis.

  estimated_cost:
    implementation: medium
    compute: high
  compute_note: >-
    2000 curves and a three-point density sweep make this the second most
    expensive proposal in the batch after IDEA-20260811-18bbf9. It is NOT
    timing-sensitive - decomposition rates are counts, not wall-clock - so the
    host-load gate that binds the timing contracts does not bind this one, which
    is a real scheduling advantage worth noting.

  recommended_priority: medium
  expected_value: >-
    MEDIUM-HIGH, AND THE STRONGEST NON-SYMBOLIC PROPOSAL IN THE BATCH. Three
    things make it worth its compute: its measured functional is a direct
    index-calculus cost and therefore does not have to survive a lossy-projection
    argument; its design annihilates the exact confound that voided the
    campaign's previous between-class results rather than modelling it, which
