idea:
  id: IDEA-20260815-8f5ae8
  question_id: RQ-XEDN-001
  added: '2026-08-15'
  title: >-
    THREE XEDNI COEFFICIENT-BOUND CONTROLS COMPLETED AND ALL CONSTRAINED THE
    FAMILY SEPARATELY; FIT THE LIFT-PROBABILITY EXPONENT ACROSS THEIR POOLED
    CENSUS DATA RATHER THAN RUNNING A FOURTH CONTROL
  class: measurement

  claim: >-
    GOAL-XEDN-001, -002 and -003 are completed controls, each constraining a
    different coefficient window on function-field lifting. The phase-two
    gate the lane was built for is fitting the lift probability exponent
    across at least three sizes. That data may already exist, pooled across
    the three completed goals, and fitting it is cheaper than commissioning
    another control.

  mechanism: >-
    Pool the census data from the three completed XEDN goals, check that
    their sampling designs are poolable, and fit the lift-probability
    exponent with confidence intervals. Report whether the fitted exponent
    excludes the threshold the lane declared.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-XEDN-001/002/003 (all completed) and RQ-XEDN-001's
      phase-two gate; grep 'pooled', 'exponent fit', 'lift probability'.
    results: >-
      The three goals are completed and the phase-two exponent fit is the
      lane's declared gate; no record attempts the fit across pooled data.
    verdict: >-
      ADAPTATION. The gate is the lane's own; the contribution is noticing
      the data may already exist and testing poolability before spending
      on a fourth control.

  object_first_candidate:
    tracked_object: >-
      THE LIFT-PROBABILITY EXPONENT fitted across pooled census data from
      three completed controls.
    lossiness: >-
      Pooling discards each control's specific coefficient window, which
      is why poolability is tested first rather than assumed.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives only if the three sampling designs are compatible; if they
      are not, the honest output is that the fit is unavailable and a
      fourth control is genuinely needed.

  null_object_control: >-
    NULL 1 -- fit each control separately and check the exponents agree
    before pooling; disagreement means the designs are not measuring one
    quantity and pooling would be wrong. NULL 2 -- the planted-section
    control already recorded in the lane, which must be recovered in the
    pooled data.

  discriminated_from:
    - >-
        The three completed XEDN goals, whose data this record consumes
        rather than duplicating.
    - >-
        The classical xedni collapse literature, which predicts the
        exponent's rough behaviour and is the comparison target rather
        than a competitor.

  assumptions:
    - >-
        The three controls' census designs are compatible enough to pool;
        this is tested rather than assumed and a negative answer is a
        legitimate result.
    - >-
        Their raw census data is retained and reachable from the completed
        goal records.

  predictions:
    - metric: >-
        per-control exponent agreement before pooling
      direction: different
      minimum_effect: >-
        FORCED to agree within intervals; disagreement blocks pooling
        and is itself a finding about the lane.
    - metric: >-
        planted-section recovery in pooled data
      direction: different
      minimum_effect: >-
        FORCED recovered.
    - metric: >-
        fitted exponent against the lane's declared threshold
      direction: different
      minimum_effect: >-
        The gate; reported with its interval and with the number of
        distinct sizes the fit actually spans.

  minimal_test:
    design: >-
      Pool, check agreement, fit. No new experiment unless poolability
      fails.
    controls:
      - >-
          Per-control exponent agreement check, blocking.
      - >-
          Planted-section recovery.
      - >-
          Number of distinct sizes reported, since a fit over two sizes
          is not a fit.
      - >-
          Sampling-design compatibility audit.
    required_metrics:
      - >-
          Per-control exponents with intervals.
      - >-
          Pooled fit with interval and size count.
      - >-
          Poolability verdict with its reasons.
      - >-
          Comparison against the lane's declared threshold.

  falsification_conditions:
    - >-
        Per-control exponents disagree. Pooling invalid; report and
        reconsider what the controls measured.
    - >-
        Raw census data is not retained. The fit is impossible and a
        fourth control is genuinely required.
    - >-
        The fit spans fewer than three distinct sizes. The gate is not met
        and the lane cannot close on this data.
    - >-
        The fitted exponent excludes the threshold. The lane's phase-two
        gate resolves on data already paid for.

  confounders:
    - >-
        POOLING ACROSS INCOMPATIBLE DESIGNS, which would produce a
        confident fit of nothing; the agreement check is the only defence.
    - >-
        SURVIVORSHIP: the three completed goals may have been completed
        precisely because their windows behaved, which biases a pooled
        fit.

  interpretation_limits:
    - >-
        A fit over existing data; no new evidence is generated.
    - >-
        Scoped to the three controls' coefficient windows and sizes.
    - >-
        A fit meeting the gate resolves the lane's phase-two question only
        within those windows.

  heuristic_assumptions:
    - id: HEUR-XEDN-POOL-1
      statement: >-
        The census designs of the three completed XEDN controls estimate
        the same lift-probability quantity and may be pooled.
      rigorous_support: >-
        Rigorous ingredient: all three sample sections on rational
        elliptic surfaces under the same lifting definition. THE GAP:
        each deliberately varies a different coefficient window, and if
        the exponent depends on the window then the three estimate
        different quantities and pooling is simply invalid.
      falsification_condition: >-
        Per-control exponents disagreeing beyond their intervals.
      validation_plan: >-
        SAMPLE: all retained census data from the three goals.
        COMPARISON: per-control exponents against each other before any
        pooling. TAIL CHECK: the control whose window is most extreme,
        checked as the likeliest outlier. TRANSFER: none beyond the
        tested windows.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is data retrieval and curve fitting; no new
      census runs unless poolability fails.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the classical xedni collapse result, which predicts
      rapid decay and is the comparison target for the fitted exponent.
    hidden_overhead: >-
      Retention of raw census data from completed goals is the binding
      unknown and determines whether this record is nearly free or
      impossible.
    tradeoff_note: >-
      Pooling buys a fit from data already paid for and risks combining
      incompatible designs; the agreement check decides which.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a lifting result: dominated by the
    classical xedni literature. As a pooled fit: none exists here. Not null
    on any axis.
  sota_delta: >-
    No attack, no exponent claim of its own. Content delivered: a
    poolability verdict across three completed controls and, if poolable,
    the lane's declared phase-two exponent fit from data already collected
    rather than from a fourth commissioned control.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.5 that raw census data is retained and reachable, which decides
    everything. 0.45 that the three designs are poolable given they
    deliberately vary the window. 0.6 that, if poolable, the fit spans
    enough distinct sizes to meet the gate.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
