      tau-stable V) that finding does not cover, since 3c7a91's own tested
      interventions were not orbit-specific. (3) IDEA-20260915-eee7e4 tests
      a DIFFERENT, already-measured reduction (adding the raw E-membership
      constraint to shrink effective l) which this record explicitly
      distinguishes from H1 -- eee7e4's reduction is already folded into
      0d8e90's own accounting, not a new exponent term the way H1 proposes.
      (4) IDEA-20260920-b9f0c5 (dedup surface, title/scope only, not opened
      in full this session) tests whether WDSat's OWN solver spontaneously
      exploits basis structure ("basis-blind vs first pruning") at n=41/43
