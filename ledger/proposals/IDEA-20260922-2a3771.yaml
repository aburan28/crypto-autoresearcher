      the next gate, consuming IDEA-20260913-9c54f9's or IDEA-20260913-9ba7fc's
      recharged Table 3 rather than reproducing it.
    - >-
      Scoped to the tested toy n, this program's own WDSat/Macaulay
      pipeline, and the specific tau-stable V construction cited. Nothing
      transfers to m >= 131 without a stated, disclosed extrapolation
      assumption.
  heuristic_assumptions:
    - id: HC-1
      statement: >-
        (EXPLICIT ORBIT ENCODING, H1) If tau-stability of V and tau's status
        as an E-endomorphism are used to add valid, satisfiability-
        preserving orbit-equivalence unit clauses to the PDP CNF, WDSat's
        measured conflict count on tau-stable-V instances falls by a factor
        consistent with an additive m_a*log2(m)-bit exponent reduction,
        BEYOND what a matched generic symmetry-breaking clause set of the
        same size achieves.
      rigorous_support: >-
        RIGOROUS PART: the clauses' LOGICAL VALIDITY is a direct corollary
        of tau being an endomorphism and V being tau-stable -- adding them
        cannot change satisfiability, only solving trajectory, and this is
        checked directly rather than assumed. HEURISTIC PART: whether a
        CDCL-style solver's conflict-driven search actually exploits such
        clauses to prune is empirical and, per general SAT-solving
        experience (recalled, not independently verified this session),
        symmetry-breaking clauses sometimes help and sometimes hurt
        depending on solver heuristics and encoding -- exactly the open
        question Step 2-3 answer directly rather than assume. CLASSICAL
        ANALOGUE IMITATED: symmetry-breaking predicates in constraint
        satisfaction / SAT solving (Crawford et al.-style lexicographic
        leader constraints) -- a well-established general technique this
        record applies to a Frobenius-specific symmetry group rather than a
        generic permutation group, and predicts a COMPARABLE, not
        guaranteed, effect size by that analogy.
      validation_plan: >-
        WHAT TO SAMPLE: toy K-n curves, n in {17, 23, 29, 31, 37, 41}, with
        tau-stable V per IDEA-20260915-8fe0ef's ker g(tau) construction, at
        l in the range this lane's own exhaustive budget already reaches.
        SHORTCUT: none needed at this scale. PREDICTED DISTRIBUTION:
        bimodal -- either the augmented encoding's conflict count tracks the
        predicted m^{-m_a} reduction closely (within a small multiplicative
        band) or it does not move beyond the generic-symmetry-breaking
        control's own effect, with no intermediate regime expected given the
        clauses' exactness. TAIL CHECK: any partial, in-between effect at
        more than one tested n would itself be the informative result and is
        reported as such rather than forced into one bin. TRANSFER
        ASSUMPTION, STATED: none of this extrapolates to m >= 163; the
        scaling of the effect (if any) with l and n is an open question this
        record's own toy range is too narrow to resolve and is named as a
        limit, not glossed over.
    - id: HC-2
      statement: >-
        (NORMAL-BASIS AMORTISATION, H2) The one-time cost of converting a
        deployed polynomial-basis representation of F_{2^n} to a normal
        basis, plus the per-preprocessing-call orbit-collapsed membership
        check in that basis, is repaid (falls below naive per-element
        preprocessing) once the number of preprocessing calls sharing the
        conversion exceeds a computable crossover tied to |V| and the
        conversion cost's own order (~n^2).
      rigorous_support: >-
        RIGOROUS PART: the orbit-constancy of the membership indicator on a
        tau-stable V is proven (direct corollary of tau being an
        endomorphism, no heuristic content); the AMORTISATION ARITHMETIC
        itself (one-time cost C amortised over k calls beats k*naive-cost
        once k exceeds C / (naive-cost - collapsed-cost)) is elementary and
        not heuristic either. HEURISTIC PART, NAMED HONESTLY: this
        heuristic's only open content is an IMPLEMENTATION fact -- the
        ACTUAL per-operation cost of normal-basis field arithmetic on this
        program's own toy tooling, which is not assumed equal to
        polynomial-basis arithmetic's per-operation cost and is measured
        directly rather than modelled. This departs from the corpus's usual
        Dickman/Kloosterman-style distributional template, and the record
        says so explicitly: HC-2 is a COMBINATORIAL/COMPLEXITY-ACCOUNTING
        heuristic, not a distributional one, because its content is a
        deterministic corollary plus an implementation-cost measurement,
        with no random sampling in the mathematics itself. CLASSICAL
        ANALOGUE IMITATED: none in the distributional sense; the nearest
        analogue is the standard one-time-preprocessing-versus-amortised-
        query tradeoff accounting used throughout algorithm analysis
        (e.g. batching / precomputation crossover arguments), named here for
        honesty about the heuristic's actual character rather than forced
        into a distributional frame it does not have.
      validation_plan: >-
        WHAT TO SAMPLE: the SAME toy n set as HC-1, measuring actual
        operation counts (not modelled ones) for (a) normal-basis
        construction, (b) per-call orbit-collapsed preprocessing in that
        basis, and (c) naive per-element preprocessing in the polynomial
        basis, at several |V| sizes within this lane's exhaustive budget.
        SHORTCUT: none needed. PREDICTED PATTERN (not a distribution): a
        crossover |V|-size exists and is locatable within the tested range,
        or it does not and the extrapolated crossover is reported with its
        own disclosed uncertainty. TAIL CHECK: not applicable in the
        distributional sense; the check is whether the measured per-
        operation costs for normal-basis arithmetic are wildly out of line
        with polynomial-basis arithmetic (a factor > 10, say), which would
        itself be the informative finding. TRANSFER ASSUMPTION, STATED:
        none of this extrapolates to m=163's actual preprocessing call
        volume, which depends on the full attack's (m_a, l) balance -- an
        input this record does not derive, consuming instead whatever the
        SEMBIN lane's own recharged Table 3 eventually supplies.
  heuristic_note: >-
    HC-1 is written to be killed cheaply: a single toy run at n=17 that
    fails to beat the generic-symmetry-breaking control closes it, matching
