  assumptions:
    - >-
      DECLARED COMPONENT: F2 (factor-base decomposition), as the question
      requires. H1 modifies the SOLVER ENCODING of an existing F2 search; H2
      modifies PREPROCESSING for an existing F2 factor base; neither
      introduces a new factor base, and no KN-OPEN-020 escape is claimed.
    - >-
      H1's orbit-equivalence clauses, if implemented, must be verified
      LOGICALLY VALID (implied by the tau-stability of V and tau's status as
      an endomorphism of E) before any solving-speed claim is made; adding
      an invalid clause could change satisfiability, not merely search
      trajectory, which would be a correctness bug, not a finding.
    - >-
      H2's rigorous clause (orbit-constancy of the membership indicator) is
      a direct corollary already implicit in H-SEMBIN-83a856-adjacent
      reasoning; this record does not claim it as new mathematics, only as
      an unpriced COST fact.
  proof_search_map:
    bottleneck: >-
      No filed record states, as two SEPARATE, NAMED, TESTABLE conditions,
      what would have to be true for K-163's decomposition step specifically
      to move below its own rho baseline. The pieces exist scattered (an
      exhaustive-core law, a negative solver-engineering finding, a
      tau-stable-V construction, a basis-label fact) but have never been
      assembled into the two conditions this record names.
    baseline_embedding:
      parameter_slice: >-
        the degenerate slice with NO orbit-clause augmentation and NO basis
        conversion (H1 and H2 both switched off): this must reproduce
        0d8e90's own exhaustive-core figure exactly, c in [0.9,1.0], as the
        reproduction check before either intervention is tested.
      reproduction_check: >-
        reproduce 0d8e90's own three shipped medians (30978.5 at (15,5),
        254656.5 at (17,6), 255301 at (19,6), against c in [0.945, 0.974])
        with this record's own harness before attempting the H1 augmentation
        on the same instances.
    observation_collision:
      observable: >-
        for H1, the conflict-count ratio (orbit-clause-augmented instance /
        unaugmented instance) on matched tau-stable-V instances; for H2, the
        wall-clock/operation-count ratio (normal-basis orbit-collapsed
        preprocessing + one-time conversion cost) / (naive polynomial-basis
        per-element preprocessing), as a function of |V|.
      distinct_preimage_search: >-
        an H1 ratio below 1 has at least two distinct preimages: (i) genuine
        structural pruning from the orbit clauses (H1 proper); (ii) the
        clauses accidentally act as symmetry-BREAKING rather than
        symmetry-EXPLOITING, which for some SAT solvers reduces conflicts by
        eliminating redundant equivalent branches rather than by any
        Frobenius-specific mechanism -- separable by comparing against a
        GENERIC (non-Frobenius) symmetry-breaking clause set of the same
        SIZE on the SAME non-Koblitz control, which would show the same
        reduction if (ii) is the true cause and would not if (i) is.
      constructive_transforms:
        - transform: explicit_orbit_encoding
          proposed_object: >-
            the CNF encoding of the PDP search, re-parametrised over
            tau-orbit representatives rather than raw V-elements, for H1.
          predicted_gain: >-
            if realised, an additive m_a*log2(m)-bit reduction in the
            per-attempt exponent -- a genuine, disclosed constant-factor
            gain (not an exponent-class move, stated honestly), tested
            against the negative prior evidence rather than assumed.
        - transform: normal_basis_preprocessing
          proposed_object: >-
            the factor-base-membership preprocessing step, re-represented
            in a normal basis with an explicit, charged conversion cost,
            for H2.
          predicted_gain: >-
            an amortised ~1/m preprocessing saving PAST the one-time
            conversion cost, explicitly disclosed as preprocessing-only and
            not claimed to touch the dominant per-attempt search term.
    quantifier_order: >-
      H1 is an EXISTS statement about a specific, named, not-yet-tested
      construction (explicit orbit clauses); its current status is "not
      supported by ADJACENT but distinct tested constructions," not
      "refuted," and this record is careful to keep that distinction. H2's
      rigorous clause (orbit-constancy) is a FOR-EVERY statement over
      tau-stable V, genuinely proven; its COST-REALISATION clause (whether
      the amortised saving beats the conversion cost at reachable scales) is
      an EXISTS-a-crossover statement, decided empirically by the minimal
      test.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At toy n in {17, 23, 29, 31, 37, 41}, with a tau-stable V per
        IDEA-20260915-8fe0ef's construction, the orbit-clause-augmented CNF
        encoding's measured conflict-count ratio against the unaugmented
        encoding, and the normal-basis-collapsed preprocessing's measured
        operation-count ratio against naive per-element preprocessing
        (including the charged one-time conversion cost), are [measured
        values], compared against the two-band predictions [<1 with
        symmetry-breaking control passed / ~1] and [amortisation crossover
        at V-size X]." Conditional on the toy scale and this program's own
        solver pipeline; explicitly not a claim about K-163's exponent
        relative to rho, which remains open at every outcome.
      nearby_object_control: >-
        the matched non-Koblitz control (no tau, no orbit structure at all)
        must show NO reduction under either H1's orbit clauses (which are
        undefined/vacuous with no tau-stable V) or H2's orbit-collapsed
        preprocessing (same reason) -- the same control both sibling records
        in this batch already use, reused here rather than re-derived.
    proof_obligations:
      - claim: Orbit-equivalence clauses are logically valid (satisfiability-preserving) before any speed claim.
        responsibility: correctness
      - claim: The reproduction check against 0d8e90's own three shipped medians passes before H1 is tested.
        responsibility: correctness
      - claim: H1's ratio is separated from generic symmetry-breaking via the matched-size control.
        responsibility: confound
      - claim: H2's one-time conversion cost is charged explicitly, never amortised away silently.
        responsibility: qualification
      - claim: Non-Koblitz control shows no reduction under either H1 or H2.
        responsibility: baseline
      - claim: No claim about K-163's actual security, nor any exponent-class movement, at any outcome.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        WDSat conflict-count ratio, orbit-clause-augmented / unaugmented,
        on matched tau-stable-V toy K-n instances (H1)
      direction: lower
      minimum_effect: >-
        EITHER a ratio consistent with an additive m_a*log2(m)-bit
        reduction (roughly 2^{-m_a log2 m} = m^{-m_a}) OR a ratio near 1
        (H1 fails, consistent with 3c7a91's adjacent finding) -- these are
        the two non-overlapping bands the design must separate
    - metric: >-
        the same ratio on a GENERIC (non-orbit) symmetry-breaking clause set
        of matched size, on the SAME instances (H1's confound control)
      direction: higher
      minimum_effect: >-
        if H1's reduction appears but this generic control shows the SAME
        reduction, the effect is attributed to symmetry-breaking in
        general, not to the Frobenius specifically
    - metric: >-
        preprocessing operation-count ratio, normal-basis orbit-collapsed
        (with charged conversion cost) / naive polynomial-basis, as a
        function of |V| (H2)
      direction: lower
      minimum_effect: >-
        a crossover |V|-size below which naive preprocessing is cheaper and
        above which the orbit-collapsed approach (with its amortised
        one-time cost) wins, located explicitly rather than assumed to exist
    - metric: >-
        reduction ratio on the matched non-Koblitz control, under either H1
        or H2's construction
      direction: higher
      minimum_effect: exactly 1 (no reduction), or the instrument is quotienting by something other than tau
  minimal_test:
    design: >-
      Step 0: reproduce IDEA-20260915-0d8e90's three shipped conflict-count
      medians exactly with this record's own harness (reproduction check).
      Step 1: re-read IDEA-20260904-3c7a91, IDEA-20260915-eee7e4 and
      IDEA-20260920-b9f0c5 in full (only their titles were used this
      session) to confirm the distinctions drawn in this record's mechanism
      and overlap_review sections hold against their actual content, before
      any new code is written. Step 2 (H1): at n = 17 (cheapest, matching
      this lane's own reproduction fixture), build a tau-stable V per
      IDEA-20260915-8fe0ef's construction; encode the PDP CNF with and
      without explicit orbit-equivalence clauses; verify the clauses'
      logical validity by confirming identical satisfiability with and
      without them on a sample of instances; measure conflict-count ratios,
      WITH the matched generic-symmetry-breaking confound control. Step 3
      (H1, extend): repeat at n in {23, 29, 31, 37, 41} if Step 2 shows a
      non-trivial, control-surviving effect; otherwise stop and report the
      negative result, since a negative here CONFIRMS rather than surprises
      given 3c7a91's adjacent prior. Step 4 (H2): construct an explicit
      normal basis for F_{2^n} at the same n set (always exists; found by a
      standard linear-independence search over {alpha, alpha^2, alpha^4,
      ...}); measure the ACTUAL operation count of (a) naive per-element
      preprocessing in the polynomial basis (already what 8ac1ea's own (M2)
      measures) versus (b) orbit-collapsed preprocessing in the normal
      basis PLUS the one-time conversion cost, at several |V|; locate the
      crossover |V|, if any, within the tested range.
      OUTCOMES. (A) H1 negative (ratio ~1, confirming 3c7a91): this record's
      contribution is a NAMED, CLOSED condition -- "explicit orbit clauses,
      specifically, do not prune beyond what generic symmetry-breaking
      already achieves at toy scale," a scope limit on every future proposal
      that assumes Frobenius structure helps the per-attempt search. (B) H1
      positive AND survives the generic-symmetry-breaking control: the most
      valuable possible outcome, since it would be the FIRST measured
      per-attempt exponent gain from Koblitz structure in this program, and
      is reported as a finding requiring its own follow-on record, not
      claimed here beyond the toy measurement. (C) H2 shows a crossover
      within the tested |V| range: a genuinely new, previously unpriced
      preprocessing-cost fact, explicitly disclosed as preprocessing-only
      per (S4). (D) H2 shows no crossover within reach (conversion cost
      always dominates at tested scale): the honest report is the
      extrapolated crossover |V| and the disclosed extrapolation distance to
      it, not a claim either way about deployed scale.
    controls:
      - >-
        REPRODUCTION: 0d8e90's own three shipped medians, matched before any
        new measurement is trusted.
      - >-
        GENERIC SYMMETRY-BREAKING CONTROL (H1's confound control): a clause
        set of matched size that is NOT tau-specific, to separate a
        Frobenius-specific effect from a generic SAT-engineering effect.
      - >-
        MATCHED NON-KOBLITZ CONTROL: neither H1's orbit clauses nor H2's
        orbit-collapsed preprocessing are defined on a curve with no tau;
        applying either must be refused or must show ratio exactly 1.
      - >-
        LOGICAL VALIDITY CHECK: identical satisfiability with and without
        the orbit clauses, on a sample of instances, before any speed
        comparison is trusted.
      - >-
        CHARGED CONVERSION COST: H2's one-time normal-basis construction
        cost is measured and reported as its own line item, never folded
        into the preprocessing saving.
    required_metrics:
      - reproduction-check pass against 0d8e90's three medians
      - H1 conflict-count ratio, with and without the generic-symmetry-breaking control
      - H1 satisfiability-preservation check
      - H2 operation-count ratio as a function of |V|, with the crossover |V| located or its absence disclosed
      - H2 one-time conversion cost, charged separately
      - non-Koblitz control ratio under both H1 and H2 (must read 1)
  falsification_conditions:
    - >-
      An H1 ratio below 1 that does NOT survive the generic-symmetry-
      breaking control falsifies "Frobenius-specific" as the cause; the
      finding is then attributed to generic SAT engineering, and H1 as
      stated (a specifically Frobenius mechanism) is not supported.
    - >-
      Orbit-equivalence clauses that change measured satisfiability on any
      instance falsify their logical validity and halt the design until
      located -- a correctness bug, not a finding about K-163.
    - >-
      A nonzero H1 or H2 reduction on the non-Koblitz control falsifies the
      instrument, not the hypothesis.
    - >-
      A reproduction-check failure against 0d8e90's own medians invalidates
      the harness before any new measurement is trusted.
  confounders:
    - >-
      SOLVER-SPONTANEOUS DISCOVERY, THE b9f0c5 CONFOUND. If WDSat already
      discovers SOME of the orbit structure on its own (b9f0c5's own open
