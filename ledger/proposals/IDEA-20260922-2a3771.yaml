    - >-
      WALL-CLOCK VERSUS CONFLICT COUNT FOR H2. Preprocessing acceleration
      claims must be checked against wall-clock as well as raw operation
      count, since a normal-basis field-arithmetic implementation could be
      slower per-operation even with fewer operations (the same caution
      IDEA-20260815-66496a already raises for this lane generally, cited
      by both sibling records this session).
    - >-
      SMALL-n NOISE, matching every toy-scale design in this lane; multiple-
      n replication is required before any ratio is trusted as structural
      rather than instance-specific.
    - >-
      CONFLATION WITH IDEA-20260922-f37254's AXIS. H2 shares its basis-
      conversion instrument with that sibling record but studies a
      DIFFERENT operation set (tau, not translation) and a DIFFERENT phase
      (preprocessing, not decomposition search); results must not be
      cross-attributed between the two records without re-checking which
      axis actually produced a given measured effect.
  interpretation_limits:
    - >-
      This record NAMES two conditions and prices them at toy scale; it
      does NOT claim either holds, and explicitly discloses that H1
      currently has adjacent negative evidence and H2, even at its most
      favourable, is preprocessing-only.
    - >-
      No claim about K-163's actual security, nor about any exponent-class
      movement, follows from any outcome here. The record's own honest
      ceiling, even under outcome (B) or (C), is a toy-scale measured ratio,
      not a crossing of the rho baseline, which would require the further,
