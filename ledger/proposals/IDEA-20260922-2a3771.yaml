idea:
  id: IDEA-20260922-2a3771
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    WHAT WOULD HAVE TO BE TRUE: TWO NAMED, NUMBERED CONDITIONS FOR K-163's
    DECOMPOSITION STEP TO UNDERCUT ITS OWN MEASURED EXHAUSTIVE-CORE EXPONENT,
    ONE ALREADY PARTIALLY FALSIFIED AT TOY SCALE (IDEA-20260904-3c7a91's "no
    solver engineering helps") AND ONE PRICED HERE FOR THE FIRST TIME (A
    FROBENIUS-ORBIT PREPROCESSING SHORTCUT THAT EVERY DEPLOYED FIPS BINARY
    CURVE PAYS AN UNCHARGED BASIS-CONVERSION COST TO EVEN ACCESS, SINCE NONE
    OF THEM IS DEPLOYED IN A NORMAL BASIS).
  class: mechanism
  claim: >-
    R1 representation: the field basis used for the factor-base-membership
    preprocessing (polynomial versus normal), distinguished from IDEA-20260922
    -f37254's axis (polynomial versus polynomial, trinomial versus
    pentanomial) by naming a DIFFERENT operation set. Operation set for H1:
    Sigma = translation by factor-base elements, unchanged, augmented at the
    SOLVER-ENCODING level only. Operation set for H2: Sigma = <tau>, the
    order-m Frobenius, acting on the FACTOR-BASE MEMBERSHIP SET, not on
    translation -- the search-bias-6 pairing this lane's brief explicitly
    asks for ("Sigma must not be the full translation action"). Attack stage:
    POINT DECOMPOSITION (per-attempt search cost) for H1; PREPROCESSING
    (factor-base construction, a one-time amortized cost) for H2.

    (S1) THE BASELINE FACTS, CITED NOT RE-DERIVED. Matched rho on K-163 costs
    2^{77.16} group operations (IDEA-20260922-1a081a's own arithmetic,
    cited). The measured per-attempt decomposition law (IDEA-20260915-0d8e90,
    already filed) is EXHAUSTIVE CORE: WDSat conflicts = c * 2^{m_a l} with
    c in [0.9, 1.0] -- no above-leaf pruning measured at the tested toy
    cells -- and IDEA-20260904-3c7a91 (already filed) states this as a
    closed form: "the SAT solver is a complete enumerator of V^m modulo S_m
    with a unit-propagation leaf test, so the search exponent is exactly
    ml - log2|G| and no solver engineering tested so far changes it." Taken
    at face value, per-attempt exhaustiveness alone NEVER beats rho for any
    (m_a, l): the total cost, composed across the ~2^{n-m_a l} attempts a
    fixed yield requires, is at best 2^n regardless of the split -- the same
    finding IDEA-20260915-0d8e90 itself reports by quoting Yokoyama-Yasuda-
    Takahashi-Kogure's conclusion that the naive method "cannot be more
    efficient than the rho method and even the brute force method."

    (S2) WHY THIS DOES NOT CONTRADICT SEMAEV'S OWN CLAIM, AND WHAT "WHAT
    WOULD HAVE TO BE TRUE" ACTUALLY ASKS. Semaev's 2^{1.6986 sqrt(n ln n)}
    figure is not a claim that any single decomposition attempt escapes
    exhaustiveness; it is a BALANCE-POINT claim across his eqs (15)-(17)
    (cited via RQ-SEMBIN-9fa4ba), jointly optimising (m_a, l) so that
    stage-1 exhaustive-core search and stage-2 linear algebra trade off
    subexponentially in n. So the question this record actually poses is not
    "can K-163 escape exhaustiveness in general" (Semaev's own construction
    does not need that) but: "beyond what Semaev's GENERIC-curve balance
    already assumes, what would have to be true SPECIFICALLY OF K-163 -- a
    curve with an endomorphism its generic construction does not use -- for
    K-163's own balance point to fall below its OWN <tau,-1> rho baseline
    (2^{77.16}) at n=163 specifically", a small n where the generic balance
    is understood (per RQ-SEMBIN-fa2e3f's motivation, citing the paper's own
    conclusion about the FIPS set at larger n) not yet to have crossed.

    (S3) TWO NAMED CONDITIONS, STATED HONESTLY WITH THEIR CURRENT STATUS.

    H1 (ESCAPE THE EXHAUSTIVE CORE, PER ATTEMPT). If an EXPLICIT CNF
    encoding augmentation -- adding, for a tau-stable factor base V (per
    IDEA-20260915-8fe0ef's ker g(tau) construction), one unit-propagation-
    style orbit-equivalence clause set per tau-orbit representative, so the
    search variables range over |V|/m orbit classes rather than |V| raw
    elements -- causes WDSat's measured conflict count to fall to
    c' * 2^{m_a (l - log2 m)} with c' comparable to c, then K-163's
    per-attempt exponent gains an ADDITIVE m_a * log2(m) reduction relative
    to a non-Koblitz curve at the same (n, l). CURRENT STATUS: partially
    tested and NOT supported. IDEA-20260904-3c7a91 already found no tested
    solver engineering prunes above the leaf on this exact CNF-XOR model;
    IDEA-20260915-eee7e4 shows a DIFFERENT, already-accounted reduction
    (adding the raw E-membership constraint directly, shrinking the
    EFFECTIVE l used in 0d8e90's own law -- not a new exponent term); and
    IDEA-20260920-b9f0c5 (dedup surface, cited, not opened in full) tests
    "WDSat symmetry breaking... basis-blind vs first pruning" at n=41/43,
    which is a DIFFERENT question -- whether the SOLVER SPONTANEOUSLY
    discovers tau-symmetry -- from H1's proposal, which is to HARD-CODE the
    orbit structure as explicit clauses rather than rely on solver-internal
    discovery. H1 as stated here has not been tested by any filed record.

    H2 (PRICE A FROBENIUS-ORBIT PREPROCESSING SHORTCUT THAT NO FILED RECORD
    HAS EVER CHARGED). The E-side membership indicator, restricted to a
    tau-stable V, is EXACTLY constant on each tau-orbit -- a rigorous
    corollary of tau being an endomorphism of E, requiring no heuristic (if
    x is in x(E) and tau(V)=V, then tau(x) is in x(E) too, since tau is an
    endomorphism). So the ONE-TIME preprocessing cost of computing
    |Fb_E ∩ V| -- IDEA-20260922-8ac1ea's own (M2) instrument -- could in
    principle fall from |V| membership evaluations to |V|/m representative
    evaluations, PROVIDED the field is represented in a NORMAL basis, where
    tau acts as a cheap cyclic coordinate rotation rather than requiring m
    independent Frobenius evaluations to even IDENTIFY an orbit. THIS
    PROGRAM'S OWN VERIFIED FACT (this session's reading of the audit dump,
    cross-checked against IDEA-20260922-f37254's independent reading):
    EVERY curve in analysis/binstd-curve-audit/binary-curve-params.txt is
    labelled "ppBasis" (polynomial basis) or "tpBasis" (trinomial polynomial
    basis); NONE is "onBasis" (optimal normal basis). K-163 as DEPLOYED is
    in a polynomial basis. So realising H2 on K-163 requires an EXPLICIT,
    UNCHARGED basis-conversion step -- an O(m^2)-ish one-time transport,
    the SAME construction IDEA-20260922-f37254 prices for a different
    purpose -- before the orbit-quotient preprocessing saving can be
    collected at all. CURRENT STATUS: never measured, priced, or even named
    by any filed record in this program's binary lane (checked by grep for
    "normal basis" combined with Frobenius/orbit terms in ledger/proposals
    and knowledge/; no hit).

    (S4) THE HONESTY OBLIGATION THIS RECORD MEETS EXPLICITLY. Even if H2
    held in full, it affects ONLY the preprocessing phase, a ONE-TIME cost
    amortised over however many decomposition attempts follow -- NOT the
    per-attempt search itself, which per H1's current negative toy evidence
    remains exhaustive-core. So H2 alone, at its most favourable, is a
    constant/amortized-cost adjustment, not an exponent-class move, and this
    record says so rather than dressing a preprocessing saving as a
    decomposition-step speedup. "What would have to be true for K-163's
    DECOMPOSITION STEP to have a cost exponent below rho's" therefore
    requires H1 specifically (the per-attempt exponent), and H1 is the
    condition with negative toy evidence already on file.
  mechanism: >-
    OBJECT FRAME FOR H1: NOT A NEW TRACKED OBJECT. H1 proposes a solver-
    encoding intervention on the EXISTING Sigma = translation-by-Fb search,
    not a new object; this record states that plainly rather than dressing
    an engineering test as a new mechanism, matching IDEA-20260904-3c7a91's
    own framing of "no solver engineering helps" as the question being
    asked. H1's contribution is naming the SPECIFIC untested intervention
    (explicit orbit-equivalence clauses, not spontaneous solver discovery)
    and citing exactly which existing negative and adjacent-but-distinct
    findings bear on it.

    OBJECT FRAME FOR H2: A GENUINE (REPRESENTATION, OPERATION-SET) PAIR WITH
    SIGMA != TRANSLATION. Representation R1: normal versus polynomial basis
    of F_{2^n} (the SAME representation axis as IDEA-20260922-f37254, but a
    different pairing partner). Operation set Sigma: <tau>, the cyclic
    Frobenius group of order m, acting on the FACTOR-BASE MEMBERSHIP SET --
    NOT on translation, and not on the group of points itself, satisfying
    the lane's own search bias 6 directly. TRICHOTOMY: COORDINATE-DEPENDENT
    (docs/object-frame-ideation.md), the same class IDEA-20260922-f37254
    occupies, for the same underlying reason -- whether the orbit-collapse
    SAVING is realisable is a function of which basis is used, not of the
    group element itself.

    LOSSY-PROJECTION TEST FOR H2, ARGUED PROPERLY. The candidate projection
    is: (raw membership indicator over V) -> (one membership bit per
    tau-orbit of V). Is it Sigma(=tau)-compatible? YES: since V is
    tau-stable and x(E) is tau-invariant (x in x(E) implies tau(x) in x(E),
    because tau is an endomorphism of E -- the same fact H-SEMBIN-83a856-
    adjacent reasoning in IDEA-20260915-8fe0ef already establishes for a
    related quotient map), applying tau to a V-element and checking
    E-membership commutes exactly with checking the ORBIT's collective
    membership -- the projection propagates deterministically under tau.
    Is it LOSSY in the representation used? YES: it discards WHICH specific
    member of a tau-orbit a given element is, useful for the AGGREGATE
    preprocessing count (M2's exhaustive |Fb_E ∩ V|) but not for the
    eventual decomposition search itself, which still needs the raw
    elements -- so the object is genuinely lossy for preprocessing purposes
    and genuinely NOT lossy (indeed not even proposed) for the decomposition
    search proper, a distinction this record keeps explicit throughout
    rather than letting the two blur, which is precisely the (S4) honesty
    point stated algebraically.

    THE ONE OPEN NUMBER, PRICED (SHARED WITH IDEA-20260922-f37254). The
    normal-basis construction and the polynomial-to-normal basis-conversion
    cost is the SAME O(n^2)-ish one-time transport IDEA-20260922-f37254
    prices for its own purpose; this record additionally prices the
    AMORTISATION CROSSOVER -- the number of decomposition attempts (hence
    preprocessing calls) needed before the one-time O(m^2) conversion cost
    is repaid by the ~1/m-per-call preprocessing saving -- as its own
    distinct open number, not shared with the sibling record.
