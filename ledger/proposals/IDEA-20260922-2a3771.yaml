      encoding, explicitly distinguished here from H1's proposal to modify
      the encoding itself with explicit orbit clauses. (5)
      IDEA-20260906-a77711 is the standing closure H1 and H2 both engage
      with directly: "the Frobenius gain on the decomposition step is a
      DIMENSION gain (instance count), not a per-instance SYMMETRY gain."
      This record does not contest that closure's own argument (about
      conjugate instances of DIFFERENT targets); it asks a narrower,
      distinct question a77711 does not address -- whether the FACTOR-BASE
      MEMBERSHIP TEST, which is INSTANCE-INDEPENDENT preprocessing shared
      across all targets, can be orbit-reduced even though the per-target
      SEARCH cannot, per (S4)'s own explicit disclosure that this would be
      a preprocessing-only effect. (6) IDEA-20260922-1a081a and (7)
      IDEA-20260922-8ac1ea are this batch's siblings; neither proposes a
      new solver encoding (1a081a is a pure indexing/audit record; 8ac1ea's
      (M2) instrument measures the SAME preprocessing quantity H2 discusses
      but never proposes accelerating it via a basis change, only measuring
      it as-is). (8) IDEA-20260922-f37254 (this batch) shares H2's
      basis-conversion instrument but studies a DIFFERENT pairing
      (polynomial-vs-polynomial sparsity, Sigma = translation) for a
      DIFFERENT purpose (decomposition-search cost, not preprocessing);
      the two records explicitly cross-reference their shared tooling and
      keep their claims separate. Grep of ledger/proposals and knowledge/
      for "normal basis" combined with orbit/Frobenius preprocessing found
      no hit; this axis has not been priced in this program before.
