# IDEA-20261003-247e49
# Symbol-value count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-247e49
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The symbol values -1, 0, and 1 number 3 and their absolute values sum to 2
  class: measurement
  claim: >-
    The frozen symbol values are -1, 0, and 1. They number 3. The
    absolute values 1, 0, and 1 sum to 2 and multiply to 0. Three
    exceeds two by 1. The product of the count and the absolute
    sum is 6. The gap is a value-set size, not an ECDLP exponent.
  mechanism: >-
    The object is the value set. No symbol is evaluated at a field
    element. Two copies of the value 1 have absolute gap 0. This
    is not a character sum.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-898783
      provenance: internal
      claim: >-
        Interval kangaroo constants are a different object from a value set.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The three values are frozen before they are counted.
    - No field element is tested.
  proof_search_map:
    bottleneck: The excess 1 of the count over the absolute sum.
    baseline_embedding:
      parameter_slice: The values -1, 0, and 1.
      reproduction_check: >-
        Two readers must agree that the count is 3 and the
        absolute sum is 2.
    observation_collision:
      observable: The count 3 and the absolute product 0.
      distinct_preimage_search: >-
        Dropping 0 from the set changes the count. Two copies of
        1 have absolute gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The three frozen values.
        predicted_gain: Integer count. No character sum.
    quantifier_order: >-
      The values are fixed before the count.
    method_ceiling:
      strongest_certifiable_claim: >-
        The count 3 and the absolute sum 2. Not a character sum.
      nearby_object_control: >-
        Two copies of the value 1. Their absolute gap is 0.
    proof_obligations:
      - claim: The value set has 3 elements.
        responsibility: size
      - claim: The absolute values sum to 2 and multiply to 0.
        responsibility: correctness
      - claim: The count is not a character sum.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: value_gap
      direction: different
      minimum_effect: Three exceeds two by 1.
  minimal_test:
    design: >-
      Count the three frozen values and add their absolute values.
      Do not test a field element.
    controls:
      - Two copies of 1, whose absolute gap is 0.
      - An independent count.
    required_metrics:
      - the count
      - the absolute sum
      - the absolute product
  falsification_conditions:
    - The count is not 3.
    - The absolute sum is not 2.
  confounders:
    - A convention that omits 0 changes the count.
  interpretation_limits:
    - A value-set size is not a character sum.
    - No transfer to a cryptographic field.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen value set is -1, 0, and 1, in that order.
      rigorous_support: >-
        No reciprocity theorem is claimed. The count is a reading
        of three integers.
      validation_plan: >-
        Two independent readings. A mismatch voids the count.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Evaluating the symbol at a field element is a different task.
    tradeoff_note: Three possible values do not shorten a walk.
