idea:
  id: IDEA-20260816-e36836
  question_id: RQ-MCEQ-fcb504
  added: '2026-08-16'
  title: 'Before asking whether the two-sided matrix-code action blocks invariant-based distinguishers,
    measure what those distinguishers cost when they DO work: the false-positive rate, false-negative
    rate and stall rate of a hull-plus-weight-enumerator coordinate signature on random binary codes,
    as a function of hull dimension, with permuted copies as the positive control.'
  class: tooling
  claim: '(A) RQ-MCEQ-fcb504 asks whether matrix code equivalence inherits the structural weaknesses
    known for permutation and monomial equivalence, and the two proposals already filed against it
    (IDEA-20260808-0b3072, IDEA-20260808-d935d1) both argue about whether an invariant-based attack
    CAN exist. Neither has an error rate for the permutation-case instrument they are reasoning about,
    and without one, ''blocked'' and ''not blocked'' are not measurable states. This proposal builds
    and calibrates the permutation-case instrument first. (B) The instrument is this program''s own
    construction, named as such: for a binary code C, compute the hull H = C intersect C-perp, and
    for each coordinate j compute a signature sig(j) = the weight enumerator of H shortened at j,
    as a small integer vector. Two codes are declared permutation-equivalent when their signature
    multisets match and a consistent bijection exists. The measurable quantities are: FALSE POSITIVE
    rate (independently drawn random codes of the same (n,k) declared equivalent), FALSE NEGATIVE
    rate (a code and a random permutation of it declared inequivalent), and STALL rate (two or more
    coordinates sharing a signature, so no unique bijection is available), each as a function of measured
    hull dimension. (C) NOT CLAIMED: nothing about what any published support-splitting algorithm
    is or does; no agent here can read external literature, and this record asserts nothing about
    it in either direction. Not an attack, not a key recovery, not a claim that permutation equivalence
    is easy or hard, and no statement about Classic McEliece, whose parameter security is explicitly
    out of scope for RQ-MCEQ-fcb504. (D) The negative outcome is the more useful one: if the stall
    rate rises to near one as soon as hull dimension exceeds a small threshold, then every argument
    of the form ''MCE blocks this technique'' is comparing against an instrument that already fails
    on most random inputs, and the correct next question changes shape entirely.'
  mechanism: 'STAGE 1: hull computation. For a code with generator G, the hull is the null space of
    G G^T intersected appropriately; concretely compute a basis for C intersect C-perp by stacking
    G and a parity check and solving over GF(2) with bitmask elimination. Record dim(H) per code.
    STAGE 2: control the hull dimension experimentally rather than hoping for a spread. Random binary
    codes have small hulls typically; to sweep the axis, construct codes with prescribed hull dimension
    by starting from a self-orthogonal seed subspace of chosen dimension h and extending it randomly
    to dimension k, so h is an independent variable rather than an observed one. STAGE 3: signature.
    For each coordinate j, shorten the hull at j and compute the full weight enumerator of the resulting
    small code by enumeration, which is cheap because hulls are small by construction. sig(j) is that
    integer vector. STAGE 4: the matcher. Given two codes, compare signature multisets; if they match,
    attempt to build a coordinate bijection consistent with signatures and verify the induced permutation
    actually maps one code to the other by direct matrix comparison. This final verification step
    is what separates a declared match from a verified one, and both rates are reported. STAGE 5:
    the three arms. POSITIVE: (C, pi(C)) for random pi, where the correct answer is equivalent. NEGATIVE:
    (C, C'') for independently drawn C'' at the same (n,k), where the correct answer is inequivalent
    with overwhelming probability. STALL: count coordinate signature collisions per code. STAGE 6:
    sweep h from 0 to about log2(n) and beyond, 200 pairs per (n, k, h) cell, and report all three
    rates with confidence intervals.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran grep -ril ''support.splitting|support_splitting'' over ledger/ and knowledge/ (hits:
      IDEA-20260805-f58517, IDEA-20260808-b9a74c, IDEA-20260808-0b3072, IDEA-20260808-d935d1, RQ-MCEQ-fcb504,
      and literature notes KN-LIT-0f43ad, KN-LIT-b777d1, KN-LIT-7519, KN-LIT-886c90). Ran grep -ril
      ''hull'' over ledger/proposals/ and grep -ril ''permutation equivalence''. Read RQ-MCEQ-fcb504
      in full including its in_scope and out_of_scope lists and its status_note. Read the titles and
      classes of the two proposals bound to it. Read docs/inventor-protocol.md section 3 on controls
      before belief.'
    results: Exactly two proposals are bound to RQ-MCEQ-fcb504. IDEA-20260808-0b3072 argues that the
      hull is NOT an invariant of matrix code equivalence so support splitting is structurally blocked,
      and offers the determinantal hypersurface as a replacement invariant -- a symbolic argument
      that measures nothing. IDEA-20260808-d935d1 proposes a rank-stratum counting test that decides
      'before any algorithm is written' whether a Leon-style distinguished-set attack can exist --
      again a counting argument, explicitly pre-implementation. IDEA-20260808-b9a74c (bound to RQ-MCE-e65b3c)
      proposes refining a support-splitting signature with a Schur-square defect, which presupposes
      a base signature whose error rate is nowhere measured. RQ-MCEQ-fcb504's in_scope list explicitly
      names 'hull-based and support-splitting-style invariants under the two-sided action'. Nothing
      in the repository measures the error rate of any equivalence-testing instrument on any input,
      random or structured.
    verdict: 'UNVERIFIED. Calibrating an equivalence test by its false-positive rate on random inputs
      is elementary practice and nothing here asserts anything about the published treatment of support
      splitting, which no agent in this environment can read. What is claimed new is local and specific:
      the two proposals bound to this question both reason about whether an invariant-based attack
      can exist, and neither supplies the baseline error rate that would make ''blocked'' a measurable
      state; the hull-dimension sweep as a controlled independent variable (by constructing codes
      with prescribed hull rather than sampling and observing) is the one construction here that is
      not merely assembling standard parts, and even that is a straightforward design choice rather
      than a discovery.'
  object_first_candidate:
    tracked_object: The multiset of per-coordinate signatures {sig(j)}_{j=1..n}, where sig(j) is the
      weight enumerator of the hull shortened at coordinate j, held as a vector of small non-negative
      integers. The object followed through the computation is that multiset together with the partition
      of coordinates it induces; every rate this proposal reports is a property of that partition.
    lossiness: 'Lossy in a way that is easy to state and easy to get wrong. The full code, a k-dimensional
      subspace of F_2^n, is projected first onto its hull -- typically a subspace of dimension 0 to
      a handful -- and then onto n small integer vectors. Almost everything is discarded, including
      the whole complement of the hull inside the code. The retained part propagates because the hull
      is equivariant under coordinate permutation: the hull of pi(C) is pi(hull of C), so a permutation
      acts on signatures by permuting them and leaves the multiset fixed. That equivariance is the
      entire mechanism, and it is the reason a signature comparison is a legitimate invariant test
      at all. Where the projection is TOO lossy is exactly the stall regime this proposal measures:
      when the hull is trivial, every sig(j) is identical, the partition is one block, and the object
      carries no information whatsoever.'
    propagation: 'One step of the target operation -- applying a coordinate permutation pi -- acts
      on the tracked object as a relabelling: sig_{pi(C)}(pi(j)) = sig_C(j). The multiset is therefore
      an invariant and the partition is equivariant, which is what a matcher exploits. The failure
      mode is degenerate propagation in both directions: if the hull is zero-dimensional the multiset
      is a single value with multiplicity n and the permutation acts trivially on it (no information),
      and if two coordinates share a signature the induced bijection is not unique and the matcher
      must branch. The measured stall rate is precisely the probability that propagation is degenerate,
      and it is a function of hull dimension, which is why hull dimension is made an independent variable
      rather than left to chance.'
    survival_score: 'Structure survives while the signature partition has many blocks, and dissolves
      when it has one. Concretely: at hull dimension 0 the partition is trivially one block for every
      n, so survival is zero steps; as hull dimension h grows the number of distinct signatures grows
      and the matcher becomes usable; at large h the hull approaches the code, signatures become expensive
      to compute by enumeration (2^h codewords) and the instrument becomes computationally rather
      than informationally limited. The experiment reports the measured h at which the stall rate
      first drops below 0.05 and the h at which enumeration cost exceeds the budget, and the usable
      band between them is the survival interval, stated as an interval of integers per (n, k).'
  null_object_control: 'The null arm is built into the design and executes in the same invocation
    as the signal arm: for every positive pair (C, pi(C)) a negative pair (C, C'') is drawn with C''
    an independently sampled random code of the same (n, k) and the same prescribed hull dimension
    h, and the identical signature computation and matcher are run on it. For the instrument to mean
    anything the null must show a false-positive rate near zero -- specifically, that independently
    drawn codes are declared equivalent at a rate consistent with the multiset-collision probability
    and, crucially, that any declared match FAILS the direct verification step. A false-positive rate
    indistinguishable from the true-positive rate means the signature carries no information at that
    hull dimension, and the honest report is the rate, not a verdict. A second null, matched on hull
    dimension but with signatures replaced by random integer vectors of the same shape, isolates how
    much of the matcher''s success comes from the signature and how much from the matching procedure
    itself.'
  discriminated_from:
  - 'IDEA-20260808-0b3072: argues symbolically that the hull is not an MCE invariant and proposes
    the determinantal hypersurface instead. It measures nothing and depends on a baseline error rate
    for the permutation case that does not exist; this proposal supplies that baseline and takes no
    position on the hypersurface claim.'
  - 'IDEA-20260808-d935d1: a rank-stratum counting test that decides ''before any algorithm is written''
    whether a Leon-style attack can exist. Counting arguments about existence and measured error rates
    of an implemented instrument are different deliverables; this one executes.'
  - 'IDEA-20260808-b9a74c: proposes refining a support-splitting signature with a Schur-square defect.
    That refinement presupposes the base instrument''s error rate, which this proposal measures and
    that one assumes.'
  - 'Any published support-splitting algorithm: not asserted, not read, not characterised here. The
    instrument implemented is this program''s own hull-signature construction and every rate reported
    is a rate of THAT construction on THOSE inputs.'
  - 'Proposal 8 of this set (fibre counting for (L,g)): also about equivalence, but it counts a fibre
    of a parametrisation map rather than measuring a decision procedure''s error rate, and it runs
    on Goppa codes rather than random ones.'
  assumptions:
  - Hull dimension can be prescribed by construction (extend a self-orthogonal seed subspace) without
    biasing the resulting code ensemble in a way that changes the measured rates; this is itself an
    assumption and the ensemble control exists to probe it.
  - Hulls stay small enough (h <= 12) that full weight-enumerator computation by codeword enumeration
    is affordable, capping the sweep.
  - Independently drawn codes at the same (n, k, h) are inequivalent with probability overwhelmingly
    close to one at n >= 24, so a declared match on the negative arm is a false positive rather than
    a lucky coincidence; the direct verification step makes this checkable rather than assumed.
  - The matcher's branching policy on ties is fixed in advance; a matcher that branches unboundedly
    would trade stall rate for time and make the three rates incomparable.
  predictions:
  - metric: false-positive rate of the signature matcher on independently drawn (n,k,h) pairs at n=32,
      k=16, h=4, after the direct verification step
    direction: lower
    minimum_effect: 0.01
  - metric: false-negative rate on permuted-copy positive pairs at the same cell
    direction: lower
    minimum_effect: 'forced value: exactly 0. The hull is equivariant under permutation, so a permuted
      copy must always match; any nonzero false-negative rate is an implementation bug and not a property
      of the instrument.'
  - metric: stall rate (fraction of codes with at least two coordinates sharing a signature) as hull
      dimension falls from 4 to 0
    direction: higher
    minimum_effect: 'forced value: 1.0 at h = 0, since a trivial hull gives every coordinate the same
      signature. The interesting measurement is the h at which the rate first drops below 0.05, which
      is not pre-committed.'
  - metric: false-positive rate of the randomised-signature second null at the same cell
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit: this quantifies how much of the matcher''s behaviour
      is the matching procedure rather than the invariant, and pre-committing it would presume the
      answer this arm exists to find.'
  minimal_test:
    design: 'One (n, k) and a short hull sweep decide whether the instrument is worth characterising
      further. Fix n = 32, k = 16, and h in {0, 1, 2, 4}. For each h, build 200 codes by extending
      a random self-orthogonal seed of dimension h to dimension 16, verifying the realised hull dimension
      after construction rather than trusting it. For each code compute the hull, enumerate its at
      most 2^4 = 16 codewords, shorten at each of the 32 coordinates, and record the 32 weight-enumerator
      signatures. Form 200 positive pairs (C, pi(C)) and 200 negative pairs (C, C''), run the matcher
      on each, and verify every declared match by direct matrix comparison. Report false-positive
      rate, false-negative rate and stall rate per h with Wilson intervals. Cost is minutes on one
      core with no dependency. The discrimination: if the stall rate is already near one at h = 2,
      the instrument is unusable on most random inputs and every existing argument about whether MCE
      blocks it is comparing against something that mostly does not work.'
    controls:
    - 'Positive control: permuted copies, where the correct answer is always ''equivalent'' and any
      miss is a bug.'
    - 'Negative null: independently drawn codes at matched (n, k, h), same invocation.'
    - 'Randomised-signature null: the identical matcher run on random integer vectors of the same
      shape, isolating the matcher''s own contribution.'
    - 'Realised-hull verification: the constructed hull dimension is measured after construction,
      never assumed from the seed.'
    - Direct verification of every declared match by applying the induced permutation and comparing
      row spaces, so that 'declared' and 'verified' rates are both reported.
    required_metrics:
    - false-positive rate with Wilson interval, per (n,k,h)
    - false-negative rate, per cell
    - stall rate and mean number of distinct signatures, per cell
    - realised hull dimension distribution
    - randomised-signature null false-positive rate
    - wall-clock and hull-enumeration cost per code
  falsification_conditions:
  - Any false negative on a permuted-copy positive pair falsifies the implementation, since hull equivariance
    forbids it.
  - A false-positive rate on the negative null indistinguishable from the true-positive rate at some
    h means the signature carries no information at that h, closing the instrument's usable band from
    that side.
  - A randomised-signature null with a false-positive rate as low as the real signature's shows the
    matcher, not the invariant, is doing the work, which refutes the instrument's premise.
  - Realised hull dimension not matching the prescribed h in a majority of constructions falsifies
    the construction method and voids the sweep's independent variable.
  - Stall rate below 1.0 at h = 0 falsifies the signature computation, since a trivial hull cannot
    distinguish coordinates.
  confounders:
  - The prescribed-hull construction may produce a non-generic code ensemble whose signature behaviour
    differs from that of naturally-occurring small-hull codes; the ensemble is a confound and is named,
    not solved.
  - At small n, coincidental weight-enumerator collisions inflate the stall rate for counting reasons
    unrelated to structure.
  - The matcher's tie-breaking policy trades stall rate against runtime and is a free parameter whose
    setting changes all three rates.
  - Random codes over GF(2) have a well-known bias toward very small hulls, so the h = 0 and h = 1
    cells are heavily populated in nature while larger h must be constructed, and the two regimes
    are not sampled from the same process.
  interpretation_limits:
  - Every rate reported is a rate of THIS program's hull-signature construction on THESE inputs, and
    is not a statement about any published algorithm.
  - Results are for permutation equivalence of random binary codes; nothing here transfers to the
    two-sided matrix-code action without a separate measurement, and RQ-MCEQ-fcb504 puts Classic McEliece
    parameter security out of scope entirely.
  - A usable band in h says nothing about whether codes arising in any application fall inside that
    band.
  - n <= 48 results do not extrapolate; the stall rate depends on n through collision counting.
  target_complexity:
    time_exponent: No attack exponent is claimed. The instrument costs O(n * 2^h * n) bit operations
      per code for signature computation plus elimination for the hull; the sweep is capped at h <=
      12 precisely because the enumeration is exponential in h.
    memory_exponent: No attack memory exponent is claimed. Peak memory is 2^h codewords of the hull
      plus n signature vectors, negligible at h <= 12.
    best_known: 'The incumbent for permutation-equivalence testing is the published support-splitting
      line, which this program has not read and about which it asserts nothing. Within this repository
      the incumbent is nothing: no equivalence test of any kind is implemented, and the two proposals
      bound to RQ-MCEQ-fcb504 both reason about instruments that do not exist here.'
    hidden_overhead: 'The tie-breaking and branching policy is where the real cost hides: a matcher
      that branches on every signature collision converts a stall into a runtime blow-up, so the reported
      stall rate is only meaningful alongside the frozen branching policy. Human overhead is in the
      hull-construction routine, where a subtle error yields codes whose realised hull differs from
      the prescription and silently destroys the sweep''s independent variable.'
  dominated_by: 'n/a (no result claimed). The Pareto check applies vacuously: this proposal builds
    a measuring device and constructs no adversary against any problem, so there is no time/memory/data
    frontier row it occupies. As a permutation-equivalence tester it is presumably dominated by mature
    implementations that this environment does not have and that this record does not characterise.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitative delta: zero measured
    error rates for any equivalence-testing instrument in this repository before, three rates (false
    positive, false negative, stall) with confidence intervals across a hull-dimension sweep and two
    nulls after.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: P(the hull and signature computation is implemented correctly and the
    permuted-copy positive control passes at 100 percent) = 0.8; hull computation over GF(2) is the
    fiddly part and an index error there shows up immediately in the positive control, which is why
    it is a gate. P(the stall rate is near 1.0 at h <= 1 and drops below 0.05 by h = 4) = 0.6; the
    direction is close to forced by counting but the exact crossover is unknown and is the number
    worth having. P(the false-positive rate on the negative null is below 0.01 at h = 4) = 0.65. P(the
    randomised-signature null shows the matcher contributes materially) = 0.35, which is the outcome
    that would most change how the two existing proposals bound to this question should be read. P(this
    measurement changes the framing of IDEA-20260808-0b3072 or d935d1) = 0.4, and that is a Coordinator
    judgement, not mine.
