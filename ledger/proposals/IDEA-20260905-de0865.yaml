idea:
  id: IDEA-20260905-de0865
  title: An encoding lower bound for sparse-matrix memory claims
  class: mechanism
  claim: A sparse linear-algebra cost model can carry a conditional lower bound on matrix description size, distinguishing
    genuinely compressible structure from an uncharged assumption that arbitrary index data fit in negligible memory.
  mechanism: Track the number of distinguishable matrices admitted by the claimed representation class. With D columns
    and exactly w distinct nonzero positions per row, an unrestricted row position pattern requires at least log2
    binomial(D,w) bits in a fixed-length description, or in expected prefix-free length under the uniform class,
    before coefficients and metadata. Across R independently variable rows this becomes R times that quantity. Structural
    generators may reduce the bound only by restricting the admitted class, and the generator plus regeneration
    work must be charged. This information-counting certificate gives a mathematical floor beneath a memory estimate
    without running sparse algebra or optimizing an attack. It can separate a valid compressed representation from
    a constant-bytes-per-entry claim that omits column entropy.
