    (C2, THE PROPOSAL.) Validate Heuristic 1 as stated, in three stages.
    Stage B: control the sampler. Stage C: toy-to-mid scale test. Stage D:
    SQIsign NIST-I scale, behind a feasibility gate. Stage D is reachable
    because delta(E) <= (p/2)^{1/3} is only about 2^83 at p = 5*2^248 - 1, and
    each sample needs one rank-4 lattice reduction plus one 83-bit
    factorisation.
    (C3, THE CONTROL THE SOURCE DOES NOT REPORT.) The source samples orders
    "uniformly random up to conjugation" (line 246) and does not state how. Any
    practical sampler is a walk, or an equivalent, from a fixed starting order.
    If the walk is short relative to its mixing time, the sampled delta
    distribution is biased, and the bias would show as agreement with rho(u)
    that does not change with walk length k. That pattern is the "should decay
    and does not" tell of docs/inventor-protocol.md section 3. The AOV/WISDE
    exhaustive dataset already used by EXP-SSIQ-4de240 gives delta_E = N1 exactly
    for every maximal-order type at the primes it covers. It is the ground
    truth such a sampler must reproduce before its large-p output is believed.
  mechanism: >-
    Tracked quantity: for each sampled maximal order O (equivalently a curve E),
    the integer delta(E) = min Nrd(x)/p over nonzero x in P. We record its full
    factorisation and its largest prime factor ell_max. This is a measurement of
    a heuristic, not an attack. The trichotomy of IDEA-20260806-c5d183 does not
    apply: no projection is propagated under a group operation. The lossy
    projection involved (curve -> delta(E) -> ell_max) is the heuristic's own
    observable, fixed by the frozen text. Sampler: start at a fixed special
    maximal order O_0 (for p = 3 mod 4, O_0 containing Z<i, j> with i^2 = -1,
    j^2 = -p). Take a non-backtracking walk of length k on left O-ideals of norm
    2 and set O := the right order of the product ideal. Compute P, the
    two-sided ideal of norm p of O, as a Z-basis. LLL-reduce P under Nrd/p;
    rank 4 makes this exact and cheap. Factor the minimum. Every step is
    integer linear algebra on 4x4 matrices. No elliptic-curve arithmetic occurs,
    which removes the cost wall that stopped NC36.
