    Hom(E, E^{(p)}) with Nrd/p, and reads delta(E) as P's shortest vector.
    (b) OBJECT. The NC36 contract's heuristic_1_statement.informal
    (specification.yaml lines 93-98) and its NC-3 objective describe the
    smoothness of random isogeny chains of fixed length from a fixed curve. That
    is not the quantity in the frozen Heuristic 1, which is the smoothness of ONE
