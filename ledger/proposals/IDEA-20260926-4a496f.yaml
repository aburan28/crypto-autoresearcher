  proof_search_map:
    bottleneck: >-
      Whether the sampler reaches the curve-uniform distribution the heuristic
      quantifies over, at the walk length used. Every downstream reading of
      rho(u) agreement rests on this.
    baseline_embedding:
      parameter_slice: >-
        k -> infinity at a WISDE-covered prime reproduces the exhaustive,
        exactly-known distribution of delta_E (curve-weighted). That is the
        reproduction target, and it has a known answer.
      reproduction_check: >-
        At each WISDE-covered prime used, recompute H_reconstructed(p) from the
        dataset and match the class number H(p) (the check EXP-SSIQ-4de240
        already runs). Then check that the sampler at large k matches the
        exhaustive curve-weighted delta distribution within sampling error.
    observation_collision:
      observable: >-
        The empirical CDF of log(ell_max(delta)) and its agreement with rho.
      distinct_preimage_search: >-
        Two distinct ground truths give the same observable: (i) a curve-uniform
        sampler on a population that satisfies Heuristic 1; (ii) a short-walk
        sampler biased toward orders near O_0, on a population that does not.
        Both can print "consistent with rho(u)". The exhaustive toy ground truth
        and the k-sweep separate them; nothing at crypto scale can.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the rho-agreement verdict fixed and vary the sampler (walk length
          k, starting order O_0). An observable that does not move with k while
          the positive control does move is instrument-independent. One that
          moves with k is a sampler artifact.
        predicted_gain: >-
          A disqualification rule for sampler artifacts, available before any
          crypto-scale run.
    quantifier_order: >-
      Heuristic 1: FORALL p large, FORALL B in the stated u-range, the
      probability over uniformly random E is at least u^{-u(1+o(1))}. The test:
      FOR the tested primes and B values, the empirical smooth fraction with
      Wilson interval is at or above the prediction, AND the sampler's
      curve-level distribution matches ground truth where ground truth exists.
      The uniformity is over E, so the sampler's measure is part of the
      quantifier. It is not a nuisance.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested primes (log2 p in {64, 96, 128}, and 5*2^248 - 1 if
        Stage D passes its gate), with N samples each, the empirical
        B-smoothness rate of delta(E) is consistent with or inconsistent with
        Heuristic 1's bound at resolution r. The sampler's walk length exceeds
        the mixing threshold measured at toy primes." It certifies nothing for
        p > the largest tested, and the mixing threshold is transferred to large
        p only by extrapolation in log p.
      nearby_object_control: >-
        A KNOWN-BIASED sampler (k in {0, 1, 2}: walks that stay within 2 of O_0)
        must show a detectable deviation from ground truth at toy primes, and
        the deviation must shrink as k grows. If it does not, the instrument
        has no power, and every "no bias" reading is void.
    proof_obligations:
      - claim: P (two-sided, reduced norm p) with Nrd/p is isometric to Hom(E, E^{(p)}) with deg (frozen line 244; Deuring correspondence).
        responsibility: correctness
      - claim: The right order of a norm-2^k left ideal from O_0 is a maximal order, and the walk's stationary measure is the Eichler-weighted (curve-level) measure.
        responsibility: correctness
      - claim: "Exhaustive curve-weighted delta distribution at WISDE primes equals #{N1 = t} weighted 1 for N1 = 1 and 2 otherwise (automorphism exceptions j in {0, 1728} stated)."
        responsibility: baseline
      - claim: Per-sample cost is poly(log p). Rank-4 LLL plus factorisation of an integer at most (p/2)^{1/3}.
        responsibility: runtime
      - claim: Smoothness prediction per sample is rho(log delta / log B) for an integer of delta's own size; the source's bound uses the maximal size (p/2)^{1/3}, a lower bound on the probability.
        responsibility: success_probability
    not_applicable_reason: null

  predictions:
    - metric: sampler_vs_exhaustive_total_variation_at_WISDE_primes, as a function of walk length k
      direction: lower
      minimum_effect: >-
        Decreasing in k and below the sampling-noise floor (bootstrap) by
        k = c * log2 p for a fitted c. A TV that plateaus above the floor is a
        sampler defect and blocks Stages C and D.
    - metric: positive_control_bias (k in {0, 1, 2}) against exhaustive ground truth
      direction: higher
      minimum_effect: >-
        FORCED: detectably nonzero at k = 0 and shrinking with k. Failure voids
        the instrument.
    - metric: smooth_fraction_ratio = empirical Pr[delta B-smooth] / u^{-u} prediction, per prime and B
      direction: different
      minimum_effect: >-
        Heuristic 1 predicts a ratio of at least 1 - (Wilson half-width) at
        every tested (p, B) in the u-range. It is expected to exceed 1, because
        the bound evaluates at the maximal size (p/2)^{1/3} and most delta are
        smaller (Remark 1 of the source; the density law of H-WESO-9dc201). A
        ratio materially below 1, replicated at two or more primes, is a
        falsification signal.
    - metric: size_matched_smooth_ratio = empirical smooth count / sum over samples of rho(log delta_i / log B)
      direction: different
      minimum_effect: >-
        Near 1 if delta behaves like a random integer of its own size (the
        "random integer of its size" reading at line 83). A persistent excess
        or deficit that does not decay with p is structure in delta's
        factorisation, and is reported as such in either direction.
    - metric: tail check, smoothest sample of N against rho at that smoothness
      direction: different
      minimum_effect: >-
        Mirrors the source's line-250 check. Observed rank of the smoothest
        sample is consistent with N * rho(u_min) within a Poisson interval.

  minimal_test:
    design: >-
      STAGE A (zero sampling). At every WISDE-covered prime already used by
      EXP-SSIQ-4de240, build the exact curve-weighted distribution of delta_E
      from N1, with the class-number check. STATED LIMIT: at these primes
      delta_E <= (p/2)^{1/3} is a few dozen at most. Stage A is ground truth for
      the SAMPLER only, not a smoothness test, and no Heuristic-1 verdict may be
      drawn from it.
      STAGE B (sampler control; minutes). Implement the norm-2 ideal-walk
      sampler from O_0. At 3+ WISDE primes, draw 10^4 orders per k for
      k in {0, 1, 2, 4, 8, 16, 32, 64}. Compare the sampled curve-weighted delta
      distribution and order-type distribution with Stage A by TV and chi^2,
      with bootstrap floors. Fit the mixing threshold k*(p). The positive
      control (k in {0, 1, 2}) must show bias. GATE: Stage C runs only if TV
      reaches the noise floor at some k* and k*(p) fits c * log2 p.
      STAGE C (the heuristic test). log2 p in {64, 96, 128} (p = 3 mod 4), with
      k = 3 * c * log2 p. N = 10^5 samples per prime. For B on a grid spanning
      the u-range, report the empirical B-smooth rate of delta with Wilson
      intervals, both predictions (u^{-u} at the maximal size, and the
      size-matched rho sum), and the tail check.
      STAGE D (behind FG-D). p = 5*2^248 - 1, N = 10^4. FG-D: measured
      per-sample cost times N within the declared budget. An INFEASIBLE FG-D is
      an infrastructure outcome and never evidence (AGENTS.md rule 5).
    controls:
      - Exhaustive AOV/WISDE ground truth (Stage A) as the sampler's reference distribution
      - Known-biased short-walk sampler (k in {0, 1, 2}) as a positive control that must fail
      - Starting-order control, a second O_0 (different p mod 8 class where available) at one prime
      - >-
        Null integer control: uniform random integers drawn with the empirical
        delta size distribution. Their smooth rate is the exact target of the
        size-matched prediction, which checks the smoothness code itself.
      - Class-number reconstruction check on every WISDE prime used (inherited from EXP-SSIQ-4de240)
    required_metrics:
      - per (p, k) - TV and chi^2 against exhaustive, with bootstrap floor
      - per (p, B) - empirical smooth count, Wilson CI, u^{-u} prediction, size-matched prediction
      - per p - empirical delta size distribution against the H-WESO-9dc201 density law (reported, not tested here)
      - per p - smoothest sample, its ell_max, and predicted rho at that ell_max
      - per sample (archived) - order basis hash, delta, full factorisation
      - wall time per sample (secondary)

  falsification_conditions:
    - >-
      SAMPLER ARTIFACT: TV to ground truth plateaus above the noise floor as k
      grows, while the positive control shows the instrument has power. Stages
      C and D are then blocked. The finding, that the obvious walk sampler does
      not reach the curve-uniform measure at the tested k, is itself recorded,
      because the frozen source's Section 4.2 sampler is unspecified and the
      same risk applies to it.
    - >-
      HEURISTIC 1 SIGNAL: smooth_fraction_ratio materially below 1 (upper
      Wilson bound < 1) at two or more primes in Stage C, with the sampler gate
      passed. This is a scoped adverse finding for the tested primes, reported
      in the negative-result phrasing of docs/evidence-and-reproducibility.md.
      It is not a statement about NIST-scale p.
    - >-
      INSTRUMENT VOID: the positive control shows no bias, or the null-integer
      control disagrees with rho by more than its sampling error. Every other
      reading is void and is reported as an instrument limit.
    - >-
      NORMALISATION FAILURE: any WISDE prime fails the class-number
      reconstruction. That prime is excluded, and the exclusion is reported.

  confounders:
    - >-
      Order types vs curves. Uniform sampling of order TYPES overweights F_p
      curves (delta = 1) by a factor 2 relative to curves, and j in {0, 1728}
      carry automorphism weights. This matters at toy primes and is negligible
      at large p, where the F_p locus has density about p^{-1/2}. Stage B
      compares at curve level.
    - >-
      Maximal-size versus size-matched prediction. Heuristic 1 is a lower bound
      stated at size (p/2)^{1/3}. Agreement with the size-matched prediction and
      exceeding the maximal-size bound are different findings, and both are
      reported.
    - >-
      Walk parity or bipartiteness. A norm-2 walk may alternate between classes
      for some p. The sampler must use a lazy or non-backtracking variant with
      stated aperiodicity.
    - >-
      Factorisation failures at Stage D (83-bit integers). Must be zero. Any
      failure is reported and not dropped.

  interpretation_limits:
    - >-
      No exponent moves and no attack is proposed. This is the
      heuristic-validation artifact that docs/target-result-profile.md C12
      requires and that the program has never produced.
    - >-
      Toy-to-mid scale (log2 p <= 128) validates nothing at NIST-I by itself.
      Stage D is the only crypto-scale stage, and it is gated.
    - >-
      A PASS supports Heuristic 1 at the tested primes. It does not revisit the
      concrete-cost bracket of GOAL-P13-001 (whose width is dominated by L4 and
      the per-entry cost, not by P0) and does not bear on any SSIQ lever except
      through the inherited condition.
    - >-
      The record's reading of EXP-P13-NC36 as testing a different object is a
      textual comparison of two committed files. Any Coordinator ruling on it
      belongs in a decision record, not here.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (UNDER TEST, not relied on.) Heuristic 1 of the frozen source, verbatim
        at line 69: for uniformly random supersingular E/F_{p^2},
        Pr[delta(E) is B-smooth] >= u^{-u(1+o(1))} with u = log(p/2)/(3 log B),
        uniformly as p -> infinity for (log p)^eps < u < (log p)^{1-eps}.
      rigorous_support: >-
        Theorem 1.5 (Aubry-Oyono-Vincent, via the frozen source line 81):
        delta(E) <= (p/2)^{1/3}. Combined with Canfield-Erdos-Pomerance,
        Psi(X, B) = X u^{-u(1+o(1))} in the same u-range. The imitated statement
        is that delta behaves like a uniform random integer of its size for
        smoothness.
      validation_plan: >-
        This record's own Stages C and D. The Deuring sampler (Section 4.2 of
        the source) reaches log2 p up to 256. Compare the empirical CDF of
        log ell_max against rho(u), and the size-matched prediction. Tail check
        on the smoothest sample. Sampled primes and N are recorded. Transfer to
        larger p is stated as extrapolation.
    - id: H2
      statement: >-
        (SAMPLER MIXING, relied on at Stages C-D and measured at Stage B.) A
        non-backtracking norm-2 ideal walk of length k >= c * log2 p from O_0 is
        within o(1) total variation of the Eichler-weighted (curve-uniform)
        measure on maximal-order types, with c independent of p.
      rigorous_support: >-
        The ideal graph is the Brandt-matrix / supersingular 2-isogeny graph,
        which is Ramanujan (Pizer; RECALLED and unverified in this program,
        carried as in H-SSIQ-055a36). Ramanujan graphs mix in O(log #vertices) =
        O(log p) steps. The imitated statement is the standard expander
        mixing-time bound.
      validation_plan: >-
        Stage B measures TV against exhaustive ground truth as a function of k
        at 3+ primes and fits k*(p) = c * log2 p. Transfer to log2 p in
        {64, ..., 256} is by this fit and is stated as an extrapolation. At
        Stages C-D the walk length is set to 3x the fitted threshold as margin.

  target_complexity:
    time_exponent: not applicable (measurement; no algorithm claimed)
    memory_exponent: not applicable
    best_known: >-
      Not applicable as a Pareto comparison. The incumbent it conditions is
