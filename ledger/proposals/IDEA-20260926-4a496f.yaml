    hidden_overhead: >-
      Per-sample cost poly(log p): walk of O(log p) ideal multiplications and
      HNFs on 4x4 integer matrices, one rank-4 LLL, and factoring an integer of
      at most (p/2)^{1/3}. No superpolynomial term.
    tradeoff_note: Embarrassingly parallel across samples.

  dominated_by: >-
