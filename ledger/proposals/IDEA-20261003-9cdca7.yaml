# IDEA-20261003-9cdca7
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-9cdca7
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A width-11 window table stores 1024 entries and a width-10 table stores 512
  class: representation
  claim: >-
    A window of width 11 stores 1024 precomputed entries. A window of
    width 10 stores 512. One thousand twenty-four exceeds five
    hundred twelve by 512. The product of the two table sizes is
    524288. Their sum is 1536. The gap is a table size, not an ECDLP
    exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    10 is 1024. Two to the power 9 is 512. Two width-10 tables both
    store 512, so that gap is 0 and their product is 262144. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 512.
    baseline_embedding:
      parameter_slice: The widths 11 and 10 and the sizes 1024 and 512.
      reproduction_check: >-
        Two readers must agree that 2 to the power 10 is 1024 and that
        2 to the power 9 is 512.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 512 drops the gap. Two width-10
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-10 table.
        predicted_gain: Five hundred twelve fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 1024 and 512. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-10 tables. Both store 512, and the gap is 0.
    proof_obligations:
      - claim: The width-11 table stores 1024 entries.
        responsibility: size
      - claim: The width-10 table stores 512 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: One thousand twenty-four exceeds five hundred twelve by 512.
  minimal_test:
    design: >-
      Compute 2 to the power 10 and 2 to the power 9. Do not add a
      curve point.
    controls:
      - Two width-10 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-11 table size is not 1024.
    - The product of the two sizes is not 524288.
  confounders:
    - A width-10 table of size 512 is a different window from a width-9 table of size 256.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 512 and 256.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-11 table has size 2 to the power 10, and the
        frozen width-10 table has size 2 to the power 9.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: One thousand twenty-four stored entries versus five hundred twelve, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-38be82
      - KR-RHO-cd86f5
      - KR-RHO-13bf67
      - KR-RHO-898783
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 1024 and 512 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 1024 versus 512
    data_queries: Two frozen widths.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
