idea:
  id: IDEA-20260913-4efec0
  title: Affine doubling slope lambda as a lossy tangent coordinate
  class: representation
  claim: >-
    The affine doubling slope lambda(P) = (3x(P)^2+A)/(2y(P)) is a lossy
    R1 rational-function projection of a non-2-torsion affine point.
    Paired with Sigma={[2]}, either (A) lambda([2]P) is a rational
    function of lambda(P) alone, so the fibres are a block system of
    <[2]>, or (B) lambda does not close and is priced by (L, b). This
    is not the Jacobian determinant of IDEA-20260913-768066 (that is
    det of the 2x2 differential of the doubling map); lambda is the
    tangent slope used to define doubling. Stage-0 is the frozen pair
    (lambda(P), lambda([2]P)) = (18, 3) together with the doubling
    identity x' = lambda^2 - 2x = 16. No exponent gain. Attack stage:
    collision structure.
  mechanism: >-
    Representation: R1 field representation — affine (x, y), then the
    rational function lambda = (3x^2+A)/(2y) in F_p. Operation set
    Sigma = {[2]}, then recompute lambda([2]P) from (x', y'). Trichotomy
    class: coordinate-dependent -- lambda lives in a chosen affine
    chart and changes under PGL_2 reparametrisation, so it is a function
    of the representation, not of the group element alone. One-line
    reason: the tangent slope is a chart-dependent rational function,
    not a class function of <P>. R1 class. Attack stage: collision
    structure (whether lambda can serve as a closed distinguished-point
    weight under doubling).

    LOSSY-PROJECTION TEST against Sigma={[2]}. What is discarded: the
    point (x, y) except for the slope of its tangent, and all other
    models. Lossy: a non-constant rational function on E has finite
    fibres of size governed by its degree, so 1 < |fibre| << N for
    generic values (many points share a tangent slope). Discard
    compatibility: doubling produces (x', y') from lambda, and
    lambda' = (3x'^2+A)/(2y') is well-defined whenever y' != 0.
    Unary closure of lambda' as a function of lambda is Outcome A
    versus B. If A, the fibres of lambda are a block system of <[2]>
    and the open number is orbit-canonicalisation cost from the slope
    label. If B, measure (L, b) against identity, random F_p labels,
    and relabelled Z/NZ.

    PAIR (representation, Sigma) = (affine tangent slope lambda, {[2]}).
    Not 768066: that object is det D[2]_P of the Jacobian matrix of
    the doubling map as a function F_p^2 -> F_p^2; this object is the
    scalar (3x^2+A)/(2y) appearing in the classical doubling formulae.
    Not F1 as primary lens: a later walk could consume the slope as a
    predicate; what is added is the slope coordinate, not a new walk.
    IDEA-20260911-2dd68d used a constructed curve whose doubling slope
    equals 1 as a positive-control artifact; that is a fixture choice,
    not a tracked object. No factor base (KN-OPEN-020 does not apply).
    No Semaev, Velu, Gaudry, Miller, Tate, cubical/biextension.

    STAGE-0 IDENTITY (independently computed on the frozen F_19 curve
    y^2=x^3+x-1, P=(2,3), [2]P=(16,11)):
    lambda(P) = (3*2^2+1)/(2*3) = 13 * 16 = 18 in F_19
    (6^{-1}=16 because 6*16=96≡1);
    lambda([2]P) = (3*16^2+1)/(2*11) = 9 * 13 = 3
    (16^2≡9, 3*9+1=28≡9, 22≡3, 3^{-1}=13 because 3*13=39≡1);
    and x' = 18^2 - 2*2 = 324-4 ≡ 16. Independently,
    [4]P computed from lambda([2]P)=3 is (15, 11).
