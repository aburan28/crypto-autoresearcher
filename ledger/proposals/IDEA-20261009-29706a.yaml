  title: |-
    Lifting a fixed E/F_p to Q - rank and generator heights across the (s, t) lift family
  class: measurement
  claim: |-
    Over 10^4 lifts with |s|, |t| <= 100 of a fixed E/F_p (p about 2^20 and 2^30), the rank distribution matches random curves of the same conductor range (mean <= 1, max <= 4); minimal generator height >= c log p with c stable across p; the union over all lifts of reductions of points of height <= 20 log p covers < 1% of E(F_p).
  mechanism: |-
    Every lift is y^2 = x^3 + (a + p s) x + (b + p t). Over Q(s) with t fixed this is a rational elliptic surface (chi = 1, geometric MW rank <= 8), so lifts cannot be steered to high rank, and Lang's bound makes every generator's height >= c log p.
  novelty_status: unverified
  citations:
  - ref: Hindry-Silverman 1988 (Lang height conjecture)
    source_text: Hindry-Silverman 1988 (Lang height conjecture)
    provenance: recalled
    claim: |-
      canonical height of nontorsion points is >= c log |Delta| under Szpiro-type hypotheses
    verified_by: null
