  predictions:
    - metric: >-
        log-log slope of the basin-size survival function on 10 <= n <= W^2/4
      direction: different
      minimum_effect: >-
        Fitted slope within 0.10 of -1/2 (survival of an n^{-3/2} density) at
        every N and seed. Outside that band the Borel model is wrong for this
        walk and (B1)-(B3) are not the right predictions.
    - metric: >-
        deduplicated coverage of m random-start walks divided by
        1 - (1 + 2 m W^2/N)^{-1/2}
      direction: different
      minimum_effect: >-
        Ratio in [0.90, 1.10] at every m in T0*{1/4..16} and every N >= 2^24;
        the ratio must NOT drift with N.
    - metric: >-
        top-T basin share divided by C_max(a)
      direction: different
      minimum_effect: >-
        Ratio in [0.90, 1.05] at a in {1/8, 1/4, 1/2, 1}; the residual must
        be attributable to cap and cycle mass (reported separately) rather
        than to the tail shape.
    - metric: >-
        scaled main-computation cost of the published-weight arm at
        (a, N/T) in {1/2, 1} x {1, 2, 8}, beside Table 4.1
      direction: different
      minimum_effect: >-
        Within 0.10 of 2.14/2.01, 1.62/1.62, 1.38/1.50 at N >= 2^30; and the
        N/T = 8 cells within 0.05 of the model oracle 1.35/1.51. Failure of
        the first is an instrument mismatch; failure of the second while the
        first holds is a model failure and the more interesting outcome.
    - metric: >-
        coverage of the published weight divided by the oracle on the
        generated set, as a function of N/T
      direction: higher
      minimum_effect: >-
        Monotone increasing in N/T with CI-separated steps between 2 and 8;
        above 0.97 at N/T = 8. A gap that does not close with N/T contradicts
        the size-biased Poisson hit model and the paper's own Table 4.1.
    - metric: coverage under the relabelling null minus unselected coverage
      direction: different
      minimum_effect: >-
        Zero within the Wilson interval at every cell (M = 40000 walks gives
        half-width about 0.005).
    - metric: >-
        generic-instrument constant minus curve-walk constant at matched
        (N, a, N/T)
      direction: different
      minimum_effect: >-
        Zero within CI for r-adding walks with r >= 16; a systematic
        difference is a walk-quality finding and must be reported as such.

  minimal_test:
    design: >-
      STAGE 0 (reading): DONE for the primary text via the coordinator's
      copy (selection weight, parameters, Table 4.1, absence of length-
      variant, multi-DP, variable-theta and batch-table discussion all
      recorded in claim (C) and the citations). Remaining: a validator
      opening the two recalled random-mapping references.
      STAGE 1 (minutes): N = 2^20, one seed, exact basins; Step 2 slope and
      cutoff; Step 3 at m = T0 against (B1) and the top-T0 share against (B2)
      at a = 1. THIS IS THE CHEAPEST VALID DISCRIMINATOR of the whole lane: it
      separates "basins are Borel and coverage is additive" from "the walk is
      not random-function-like" with one array pass.
      STAGE 2 (about one hour on one CPU): N in {2^20, 2^22, 2^24, 2^26}, 5
      seeds each, Steps 3-6 at a in {1/8, 1/4, 1/2, 1} and N/T in {1, 2, 4,
      8, 16}; M = 40000 online walks per cell for the empirical coverage
      beside the exact one; the Table 4.1 fixture at a in {1/2, 1}.
      STAGE 3 (hours): N in {2^30, 2^34, 2^40}, sampled basins only, 3 seeds,
      the same cells, the N-independence test and the fixture at the scale
      closest to the paper's l about 2^48.
      STAGE 4 (hours): the toy-curve transfer arm at N of about 2^24 and 2^28
      (prime-order short-Weierstrass curves found by search over small a, b
      with point counting), r-adding walks with r = 16 and r = 32, every
      solved logarithm certified by an independent scalar multiplication.
      Seed policy: seeds 1..5 for the walk key and 101..105 for targets,
      recorded per cell; confidence intervals: Wilson for hit rates, BCa
      bootstrap over seeds for ratios.
    controls:
      - published Bernstein-Lange weight (total length + 4W per walk) as the selection baseline
      - count-only selection as the c -> infinity limit
      - uniform-random selection of T DPs from the generated set (unselected)
      - the paper's N = T procedure (generate until T distinct DPs)
      - Pollard rho with distinguished points and no table on the same instances
      - oracle top-T by true basin size, on the generated set and globally
      - relabelling null of the ranking statistic
      - sigma-noise decay sweep of the ranking statistic
      - generic random-function walk versus r-adding curve walk at matched parameters
      - N-independence of every constant across 2^20..2^40
      - Table 4.1 fixture at (a, N/T) in {1/2, 1} x {1, 2, 8}
    required_metrics:
      - exact basin-size multiset per seed and its fitted body slope and cutoff
      - cycle mass and cap-loss fraction per cell (8W and 20W caps)
      - exact and empirical coverage per (N, a, N/T, rule) with Wilson intervals
      - scaled main-computation cost per cell beside Table 4.1
      - online group operations per solved target and the implied T L^2 / N
      - precomputation group operations P = sum of generation walk lengths, scaled by (NT)^{1/2} beside the paper's rows
      - bits per entry of the stored table, frozen before Stage 2
      - certificate pass count on the curve arm

  falsification_conditions:
    - >-
      The basin-size body slope is outside [-1.6, -1.4] or the cutoff sits
      away from n theta^2/2 = 1 by more than a factor 2 at N >= 2^24: the
      Borel model is wrong for this walk; (B1)-(B3) are withdrawn as
      predictions and the instrument reports the empirical laws instead.
    - >-
      Unselected coverage deviates from 1 - (1 + 2a)^{-1/2} by more than 10%
      at N >= 2^24 with no cap or cycle explanation: the size-biased sampling
      assumption H2 fails.
    - >-
      The published-weight arm does not reproduce Table 4.1 within 0.10 at
      N >= 2^30: the instrument is not comparable to the paper; nothing
      downstream is reported and the run set is invalid, not negative.
    - >-
      Any selection rule's exact coverage EXCEEDS the global oracle top-T
      share: impossible by disjointness, hence an implementation error; the
      run set is invalid, not a finding.
    - >-
      The relabelling null differs from the unselected control beyond CI:
      instrument broken; nothing is reported.
    - >-
      The constants drift with N beyond CI across 2^20..2^40: the quantity
      measured is not the asymptotic constant and no extrapolation is
      licensed.

  confounders:
    - >-
      The online cap (8W in Bernstein-Lange) truncates walks in DP-free
      cycles and long tails; the loss must be counted and reported (the 20W
      arm measures it), not absorbed into the coverage.
    - >-
      Basins of size 1 (DPs with in-degree 0) exist in the exact enumeration
      but are never reached by generation walks; the "global oracle" must be
      computed over ALL DPs, the "generated-set oracle" over reached DPs, and
      the two must not be confused.
    - >-
      Duplicate DPs among generation walks are counted once in the table but
      their walks are charged in P; the paper's N = T cell discards duplicates
      and continues, which biases toward short walks (their own remark) and
      must be reproduced literally in that cell.
    - >-
      r-adding walks with small r are measurably non-random (Teske); the
      transfer arm uses r >= 16 and reports r.
    - >-
      Finite-N corrections to the Borel asymptotic are O(theta) = O(N^{-1/3})
      and are visible at N = 2^20 (theta = 1/100); the N sweep is what
      separates them from model failure; the paper's l about 2^48 has
      theta = 2^{-19}, so its rows are closer to the asymptotic than any toy
      cell and the fixture tolerance is set accordingly.

  interpretation_limits:
    - >-
      Every number is claim_tier toy. N-independence within 2^20..2^40 is the
      only transfer evidence; the constants at 2^256 are an assumption.
    - >-
      The instrument bounds the SELECTION axis at fixed (T, W, walk). It says
      nothing about non-generic structure and does not move the exponent.
    - >-
      The oracle ceiling is the ceiling for coverage-per-entry at fixed W; the
      choice of W (the alpha sweep) is part of the optimisation and is
      reported as a point on the (P, S, L, epsilon, U) frontier, never as a
      T reduction by itself; the paper's Figure 4.3 already places extra
      precomputation above alpha-tuning and this record does not contest it.
    - >-
      P is charged as generation walk length in group operations; memory used
      during precomputation is not charged in the RQ's model (the paper makes
      the same distinction) and is stated.

  heuristic_assumptions:
    - id: H1
      statement: >-
        RANDOM-FUNCTION HEURISTIC. For an r-adding walk with r >= 16 on a
        prime-order group and a DP predicate of density theta = W^{-1} with
        W <= N^{1/3}, the DP-truncated functional graph has the same law as
        that of a uniformly random function on N points truncated at an
        independent Bernoulli(theta) marking, up to o(1) relative error in
        every statistic used here, uniformly for N in [2^20, 2^40].
      rigorous_support: >-
        Imitates the random-mapping statistics of Flajolet-Odlyzko (tree and
        component sizes of random functions, recalled) composed with Bernoulli
        thinning; the rigorous half is the random-mapping theory, the
        heuristic half is that r-adding walks behave as random mappings,
        which Teske (cited in KN-LIT-012) supports empirically for r >= 20 at
        the level of the rho constant.
      validation_plan: >-
        Sample: exact basin multisets at N in {2^20..2^26} for both the keyed
        random function and the curve walk, 5 seeds each; compare the two
        empirical CDFs by a two-sample Kolmogorov-Smirnov statistic at
        alpha = 0.01, and the max-basin order statistic against the
        Borel(1-theta) N/W-sample prediction; tail check: the largest basin
        per seed must lie within the predicted 99% band. Transfer assumption:
        the same law at 2^256, not tested.
    - id: H2
      statement: >-
        SIZE-BIASED SAMPLING. A generation walk from a uniformly random start
        lands in the basin of DP d with probability |B(d)|/N, independently
        across walks; the number of walks landing in a basin of size n out of
        T_gen is Binomial(T_gen, n/N), approximately Poisson(r a x) with
        x = n/W^2, r = T_gen/T, a = T W^2/N.
      rigorous_support: >-
        Exact given the basin partition (a start point is uniform in G); the
        paper states the same fact ("the chance of a uniform random group
        element walking to this point is exactly the number of ancestors
        divided by l"). The imitated classical statement is the size-biased
        Borel distribution of the component containing a uniform random
        vertex (Aldous-Pitman, recalled).
      validation_plan: >-
        Sample: for T_gen = 16 T0 walks at N = 2^24, regress the observed hit
        count of each DP on its exact basin size; predicted slope T_gen/N,
        intercept 0; dispersion consistent with Poisson (variance/mean in
        [0.9, 1.1]). Tail check: the most-hit DP's basin must be within the
        top 1% of basins in 95% of seeds.

  target_complexity:
    time_exponent: >-
      ONLINE 1/3 in N at T = N^{1/3}, unchanged from Bernstein-Lange; the
      instrument targets the CONSTANT: the model's oracle value 1.28 N^{1/3}
      (a = 1/4) against the published 1.79 at N/T = 2, and 1.35/1.51 against
      the published 1.38/1.50 at N/T = 8. PRECOMPUTATION 2/3 in N, unchanged;
      its constant N/T is the price of approaching the oracle (the paper's
      Table 4.1 prices it at 1.9-3.7 (lT)^{1/2} for N/T = 2 and 15.7-36.9 for
      N/T = 8).
    memory_exponent: >-
      1/3 in N, unchanged. At fixed L the model's floor is T = 1.64 N/L^2
      against the headline 3.20 N/L^2 (1.79^2), a factor 1.95 in T in the
      P -> infinity limit, and against 1.90 N/L^2 (1.38^2) at N/T = 8, a
      factor 1.16; this record MEASURES that ceiling, it does not claim to
      reach it.
    best_known: >-
      Bernstein-Lange published weight: 1.79 (l/T)^{1/2} at alpha = 1/2,
      N/T = 2 with P = 1.24 (lT)^{1/2}; 1.38 at alpha = 0.707, N/T = 8 with
      P = 15.7 (lT)^{1/2} (Table 4.1); 2.58 unselected. Corrigan-Gibbs-Kogan
      S T^2 = Omega~(eps N), tight (KN-LIT-013); rho with DPs at 0.886 sqrt(N)
      and O(1) memory (KN-TECH-001, KN-LIT-012); Kuhn-Struik batch rho at
      about sqrt(2 U N) total (retrieved summary; the paper quotes their
      Theta(L^{-1/2} l^{1/2}) per logarithm for L << l^{1/4}).
    hidden_overhead: >-
      The closed forms hide O(theta) Borel corrections and the cap/cycle
      losses; the online cost hides the restart scalar multiplications
      (O(log N) each) and lookups, which the paper also excludes. Bits per
      entry are not in T and are frozen and reported separately.
    tradeoff_note: >-
      The instrument maps the (P, L) curve at fixed T: coverage rises with
      N/T toward C_max(a), so P buys L, as the paper's Figure 4.3 shows.
      Parallelisation as van Oorschot-Wiener; the table is read-mostly and
      shared.

  dominated_by: >-
    n/a (no attack result claimed). Checked row by row for completeness:
    rho with DPs (KN-TECH-001) dominates on memory; the Bernstein-Lange
    published weight is the point being measured; Kuhn-Struik batch rho
    dominates on precomputation for U >= T; the CGK bound is the ceiling. The
    instrument produces numbers, not a point on the frontier.
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively the record
    predicts and measures a coverage ceiling C_max(1/4) = 0.39 and an oracle
    online constant 1.28 against the published 1.79 at N/T = 2 (a maximal
    redundancy factor 1.95 in T at fixed L, reachable only as P -> infinity)
    and 1.35/1.51 against the published 1.38/1.50 at N/T = 8 (within 2%,
    i.e. essentially no redundancy left at that precomputation).

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the basin-size body slope and the cutoff match Borel at
    N >= 2^24 for the generic instrument (the derivation is standard and the
    scratch share 0.637 versus model 0.66 is within the expected finite-size
    band). 0.75 that the curve walk with r >= 16 matches the generic
    instrument within CI. 0.7 that the published-weight arm reproduces Table
    4.1 within 0.10 on the first attempt. 0.6 that the closed forms (B1)-(B3)
    survive with errors below 10% without added corrections; the 2% agreement
    with the N/T = 8 rows raises this from the earlier draft's value but is
    not independent evidence until measured. 0.9 that the published rule's
    gap to the oracle closes monotonically with N/T. Whatever happens, the
    instrument delivers the constant the RQ says the program lacks.

