  title: >-
    THE BASIN-PARTITION COVERAGE INSTRUMENT: measure the coverage constant of a
    Bernstein-Lange distinguished-point table as a sum of disjoint basin sizes,
    against the Borel (Poisson Galton-Watson) prediction, with the oracle
    ceiling C_max(a), the unselected law 1 - (1 + 2a)^{-1/2}, a random-
    relabelling null and a noise-decay test, at N in [2^20, 2^40] -- with
    Bernstein-Lange's Table 4.1 as the primary-source fixture the model must
    reproduce
  class: measurement

  claim: >-
    (A) THE OBJECT. Fix a deterministic walk f on the group G of prime order N
    (an r-adding walk with known scalars) and a distinguishing predicate of
    density theta = 1/W. For every distinguished point (DP) d define its BASIN
    B(d) = the set of x in G whose forward f-orbit reaches d before any other
    DP. Because f is a function, the basins of distinct DPs are DISJOINT and
    their union is G minus the points on DP-free cycles. An online walk from a
    fresh random start Q + [c]P succeeds on table X exactly when its start lies
    in the union of the basins of X. Hence the single-walk hit probability
    ("coverage") of ANY stored set X is EXACTLY
      C(X) = sum_{d in X} |B(d)| / N   (minus the cycle mass),
    and, under the random-function heuristic H1 below, the number of steps of
    an online walk to its first DP is Geometric(theta) with mean (1-theta)/theta
    INDEPENDENTLY of which basin it is in (memorylessness), so the expected
    online cost per target is L = W / C(X) + O(W) for the final walk. The
    value of a stored DP is therefore ONE NUMBER, its basin size, and the
    question "how few DPs" at fixed (L, epsilon) is the question "how large a
    total basin mass can T entries carry, and how well can basin sizes be
    estimated with P = T_gen * W group operations of over-generation".
    Bernstein-Lange say exactly this in their own words (primary text, read
    2026-09-06): "The natural definition of 'most useful' is 'having the
    largest number of ancestors' ... the chance of a uniform random group
    element walking to this point is exactly the number of ancestors divided
    by l" -- their "ancestors" is B(d).
    (B) THE PREDICTED DISTRIBUTION (H1, H2). For a uniformly random DP, |B(d)|
    is the total progeny of a Galton-Watson process with Poisson(1 - theta)
    offspring, i.e. Borel(1 - theta): P(n) = e^{-(1-theta)n}((1-theta)n)^{n-1}/n!,
    asymptotically (2 pi)^{-1/2} n^{-3/2} exp(-n theta^2 / 2) for 1 << n and
    theta -> 0. A random-start walk lands in a basin of size n with the
    SIZE-BIASED probability proportional to n P(n). Writing x = n / W^2 and
    a = T W^2 / N, three closed forms follow by direct integration and are the
    instrument's predicted values:
      (B1) UNSELECTED LAW: the union of the basins of the DPs reached by m
           independent random-start walks (deduplicated) covers
           C_rand(a_m) = 1 - (1 + 2 a_m)^{-1/2}, a_m = m W^2 / N.
           At a_m = 1 this is 0.423.
      (B2) ORACLE CEILING: the T largest basins of the whole functional graph
           cover C_max(a) = erfc( sqrt(x*/2) ), where x* solves
           2 x*^{-1/2} e^{-x*/2} - sqrt(2 pi) erfc( sqrt(x*/2) ) = a sqrt(2 pi).
           Numerically: a = 1 gives x* = 0.19, C_max = 0.66; a = 1/2 gives
           x* = 0.40, C_max = 0.52; a = 1/4 gives x* = 0.74, C_max = 0.39;
           a = 1/8 gives x* = 1.2, C_max = 0.27. NO selection rule can exceed
           C_max at fixed (T, W), because coverage is a sum of disjoint basin
           sizes and the top-T basins maximise that sum.
      (B3) ORACLE ONLINE COST at T = N^{1/3}: L sqrt(T/N) = sqrt(a)/C_max(a)
           = 1.51 (a = 1), 1.35 (a = 1/2), 1.28 (a = 1/4), 1.30 (a = 1/8);
           minimum about 1.28 near a = 0.2 to 0.25. At fixed L the
           corresponding minimum table is T_oracle = 1.64 N / L^2.
    (C) THE PRIMARY-SOURCE FIXTURE, AND WHAT THE INSTRUMENT DECIDES.
    Bernstein-Lange's selection rule is the weight "total length of all walks
    reaching the point, plus 4W per walk" applied to a pool of N = (N/T) T
    generated DPs, keeping the T heaviest; walks are capped at 8W; their
    W = alpha (l/T)^{1/2}, so a = alpha^2. Their Table 4.1 (l about 2^48,
    W = 2^19, 2^20 experiments per cell, error below 0.02) gives the scaled
    main-computation cost per successful logarithm:
      N/T = 1: 2.14 (alpha = 0.707, a = 1/2) ... 2.01 (alpha = 1, a = 1);
      N/T = 2: 1.62 ... 1.62;
      N/T = 8: 1.38 ... 1.50;
    and the headline experiments at alpha = 1/2 (a = 1/4), N/T = 2 give 1.79
    (l/T)^{1/2} after 1.24 (lT)^{1/2} precomputation, with the unselected
    N = T table at 2.58. Against (B3): the model oracle is 1.35 at a = 1/2 and
    1.51 at a = 1, so THE PUBLISHED RULE AT N/T = 8 SITS WITHIN 2% OF THE
    MODEL CEILING (1.38 vs 1.35; 1.50 vs 1.51), while at N/T = 2 it sits
    1.20x and 1.07x above it and at the headline point (a = 1/4) 1.40x above
    (1.79 vs 1.28). This is the fixture: a model that reproduces those three
    rows from first principles is measuring the right constant, and the
    entire remaining redundancy in the published tables is the N/T = 2
    estimation loss plus cap and cycle losses, largest at small a. The claim
    under test is (i) that the basin-size empirical CDF follows Borel
    (1 - theta) with an n^{-3/2} body and an exp(-n theta^2/2) cutoff; (ii)
    that unselected coverage follows (B1); (iii) that the published weight's
    coverage lies below C_max(a) by an amount that shrinks with N/T and
    matches Table 4.1 within 0.10 when the paper's procedure (weight, cap,
    duplicate discarding) is reproduced; (iv) that every constant is
    N-independent across 2^20..2^40. THIS IS A CONSTANT-FACTOR QUESTION
    INSIDE THE GENERIC MODEL: the exponent 1/3 does not move (KN-LIT-013),
    and this record names no non-generic structure.

  mechanism: >-
    STEP 1 (exact basins, N in {2^20, 2^22, 2^24, 2^26}). Build the walk f as a
    keyed pseudo-random function on [0, N) (generic instrument) AND as an
    r-adding walk on a toy prime-order curve with r in {16, 32} (transfer
    arm). Compute, for every x in G, the first DP reached and its distance,
    by a vectorised forward iteration (NumPy, cap 8W to match the paper, with
    a 20W arm to measure the cap loss). Tabulate the exact basin size |B(d)|
    of every DP, the cycle mass, and the depth profile.
    STEP 2 (distribution check). Compare the empirical CDF of |B(d)| with
    Borel(1 - theta): log-log slope of the body (predicted -3/2), position of
    the exponential cutoff (predicted n theta^2 / 2 = 1 at n = 2 W^2), and the
    largest basin per seed against the order-statistic prediction from
    N/W samples of Borel(1 - theta). Compare the depth-to-root distribution of
    a random point in a size-n basin with the Rayleigh-type prediction of
    scale sqrt(n) (this feeds IDEA-20260906-05ffb8).
    STEP 3 (coverage laws). For m in T0 * {1/4, 1/2, 1, 2, 4, 8, 16} random-
    start generation walks, measure the deduplicated coverage against (B1);
    measure the top-T basins' share against (B2) at a in {1/8, 1/4, 1/2, 1}
    by varying W at fixed T = N^{1/3}.
    STEP 4 (selection rules at charged P). For N/T = r in {1, 2, 4, 8, 16}:
    rank the generated DPs by (i) the published Bernstein-Lange weight
    S_d + 4 W h_d (BASELINE), (ii) the count h_d alone, (iii) uniform random
    (unselected control), (iv) oracle true basin size restricted to the
    generated set, (v) global oracle. For r = 1 reproduce the paper's
    procedure (generate until T distinct DPs, discarding duplicates). Store
    the top T and measure coverage EXACTLY (sum of true basins) and
    EMPIRICALLY (M = 40000 online walks, cap 8W, Wilson intervals). Report
    the estimation-loss ratio C_rule / C_oracle(generated set) and the
    fraction of the gap to the global oracle due to basins never reached by
    T_gen walks.
    STEP 5 (fixture). Report the scaled main-computation cost of arm (i) at
    a in {1/2, 1}, r in {1, 2, 8} beside Table 4.1; agreement within 0.10 is
    the gate for every downstream comparison in this batch.
    STEP 6 (nulls and decay). Random-relabelling null: permute the ranking
    statistic among the generated DPs and re-select; coverage must equal the
    unselected control within CI. Decay: add Gaussian noise of standard
    deviation sigma * (statistic) for sigma in {0, 0.5, 1, 2, 4, 8}; coverage
    must fall monotonically from the rule value to the unselected value. A
    rule whose coverage does not fall as sigma grows is an artifact and voids
    the cell.
    STEP 7 (scale). Repeat steps 3-6 with sampled (not exact) basins at N in
    {2^30, 2^34, 2^40} (walks only, no enumeration), and test that every
    constant is N-independent within CI, as (B1)-(B3) predict. A constant
    that drifts with N is the tell that something other than the random-
    function structure is being measured.
    STEP 8 (transfer). Every toy-curve cell re-verifies each solved logarithm
    by an independent scalar multiplication (docs/claims-and-verification.md)
    and reports the generic-instrument and curve-walk constants side by side.

