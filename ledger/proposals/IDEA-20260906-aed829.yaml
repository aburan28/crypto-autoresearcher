  discriminated_from:
    - >-
      Bernstein-Lange (primary text, retrieved): supplies the object ("most
      useful" = most ancestors), the published weight, the parameters and
      Table 4.1; it does not model the basin law or bound selection by an
      oracle. This record measures what the paper estimates and predicts
      the paper's own table from a model.
    - >-
      IDEA-20260807-a127ab (RQ-MTGT-2cabee): transports a Bernstein-Lange table
      between isogenous curves and states its cost sits ON S*T^2 = N. It does
      not measure the constant, does not model basins, and does not shrink
      the table; this record measures the constant on one curve and does not
      transport anything.
    - >-
      IDEA-20260807-ea3915 (RQ-MTGT-2cabee): the M-group preprocessing model
      and a conjectured M-fold lower bound. Different axis (many groups); this
      record is one group, one table, U >= 1 targets.
    - >-
      IDEA-20260807-e0ddc6: the transport-compatibility dichotomy, which
      records that a distinguished-point store does NOT transport. Consistent
      with this record (the basin structure is a property of the encoding and
      the walk) and orthogonal to it.
    - >-
      IDEA-20260726-001 / H-MTIC-001: multi-target index calculus crossover
      charged against the preprocessing frontier. Uses the frontier as a
      comparator only.
    - >-
      IDEA-20260906-05ffb8 (this batch): modifications of the published
      weight, scored by this instrument. IDEA-20260906-a3d6ae uses the
      instrument's (B1) law for its batch recurrence. IDEA-20260906-cf3b76
      tests whether C_max is walk-rule invariant. IDEA-20260906-ac100b is the
      derivation of (B1)-(B3) as a proof-shaped claim.

  object_first_candidate:
    tracked_object: >-
      THE BASIN-SIZE MULTISET { |B(d)| : d a DP } and, per stored set X, the
      number C(X) = sum_{d in X} |B(d)|/N. Followed as T, W, T_gen and the
      selection rule vary.
    lossiness: >-
      GENUINELY LOSSY. The basin partition forgets the group law, the
      coordinates, the scalars, the walk's adding set and the DP predicate's
      bit pattern; it retains only "which start points end at which DP". The
      multiset of sizes forgets even the identity of the DPs.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED ALGEBRAICALLY. What the projection discards
      is discarded compatibly with the two operations the instrument uses:
      (i) adding an entry d to X adds exactly |B(d)|/N to C(X) (disjointness);
      (ii) running one more random-start walk lands in basin B(d) with
      probability |B(d)|/N. Both propagate deterministically from the multiset
      alone. The projection is not a change of coordinates: the walk cannot be
      reconstructed from the basin sizes.
    survival_score: >-
      Survives any change of curve, coordinates, walk adding-set and DP bit
      pattern at fixed theta (the multiset is re-drawn but its LAW is the
      same under H1). Dies when the walk stops being a function of the point
      alone (walk-history-dependent rules; IDEA-20260906-cf3b76 arm B) and
      when DP-free cycles carry non-negligible mass (W of order sqrt(N)).

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL 1 (relabelling): permute the ranking
    statistic among the generated DPs before selection; the resulting coverage
    must match the uniform-random selection within its Wilson interval, at
    every cell. NULL 2 (random function versus curve walk): the generic keyed
    pseudo-random-function instrument and the r-adding curve walk must give
    the same constants within CI; a difference is a Teske-type walk
    non-randomness finding, reported separately, never folded into a rule's
    gain. DECAY PARAMETER: noise level sigma injected into the ranking
    statistic; coverage must fall monotonically to the unselected level as
    sigma grows. A coverage curve flat in sigma voids the cell. STRUCTURAL
    TELL: the constants C_rule(a, r) must be N-independent across
    2^20..2^40; drift with N is the artifact signature. FIXTURE GATE: the
    published-weight arm must reproduce Table 4.1 within 0.10 (STEP 5)
    before any other arm is reported.

  assumptions:
    - >-
      Bernstein-Lange's constants, procedure and Table 4.1 are taken from the
      coordinator's plain-text copy of the paper and re-checked by grep by
      this session; the PDF was not opened by this session. The abstract-level
      figures also appear in KN-LIT-3060 (kb).
    - >-
      The closed forms (B1)-(B3) are derivations of this record from the Borel
      asymptotic (2 pi)^{-1/2} n^{-3/2} e^{-n theta^2/2}; they carry O(theta)
      and finite-N corrections that the instrument is meant to expose, and
      they are NOT to be cited as results until a validator re-derives them.
      Their agreement with Table 4.1 at N/T = 8 (1.35 vs 1.38; 1.51 vs 1.50)
      is a consistency observation of this record, not a validation.
    - >-
      Online cost is charged as W/C + W (final walk) group operations, walks
      capped at 8W; the paper likewise excludes the randomisation and
      double-check multiplications, and this record states the same
      exclusion.
    - >-
      Toy scale only (claim_tier: toy). N-independence across 2^20..2^40 is
      the transfer check; extrapolation to 2^256 is an assumption named in
      interpretation_limits.

