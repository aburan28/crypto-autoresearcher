idea:
  id: IDEA-20261007-c79278
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Translation correlation of χ(x(P)) and χ(x(P+T)) on
    y^2 = x^3 + 2x + 1 over F_61
  class: control
  claim: >-
    Let E be y^2 = x^3 + 2x + 1 over F_61. Let T be the affine point
    with the least nonnegative x-coordinate among points with y ≠ 0,
    and, if two points share that x, the one with the least
    nonnegative y. Let S be the affine points P such that x(P) ≠ 0,
    P+T is affine, and x(P+T) ≠ 0. Let χ be the quadratic character
    of F_61. Then the absolute value of the sum over P in S of
    χ(x(P)) χ(x(P+T)) is strictly below |S|/4. This is a product of
    two field characters under translation by one point. It is not
    the sum of χ(x(P)+x(2P)), not a fiber of a tangent slope, and
    not an image cardinality.
  mechanism: >-
    The representation is the pair of field elements (x(P), x(P+T)).
    Sigma is the singleton {translation by T}. The retained value is
    the product of quadratic characters. Translation by T is not a
    doubling, a rho step, or a factor-base relation. The product
    keeps one sign, so the projection is lossy once |S| > 2. The
    sign at P+T is not assumed to be a function of the sign at P.
    The priced number is the absolute sum. Families of endomorphism
    walks are not the lens. The discrete log is not an input.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question names mixed character sums of bounded-degree
        coordinate functions and marks the Weil-level bound recalled
        and unverified. A one-curve inequality does not discharge
        that bound.
      verified_by: ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A sub-square-root algorithm must exploit the representation.
        This proposal does not claim an algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Negation flips y and preserves x. Translation by T is not
        the negation map, and no iteration factor is claimed.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
  assumptions:
    - >-
      4·2^3 + 27·1^2 = 59, so the discriminant is -16·59 = -944 ≡ 32
      (mod 61), which is nonzero. The characteristic is not 2 or 3.
    - T is chosen by the least-x rule above. The rule does not look at the sum.
    - χ(0) is not used. Points with a zero coordinate in the product are outside S.
  predictions:
    - metric: >-
        the absolute sum of χ(x(P)) χ(x(P+T)), divided by |S|
      direction: lower
      minimum_effect: the ratio is strictly below 1/4
  minimal_test: >-
    Enumerate E(F_61). Choose T by the least-x rule. Build S.
    Sum the product of characters and compare the absolute value
    with |S|/4. A second enumeration in reverse x-order must
    produce the same T, the same S, and the same sum. A control
    that replaces the product by independent fair signs has mean
    square |S|. If 20 or more of 200 such signings meet |S|/4, the
    threshold is inside null noise.
  controls:
    - reverse-x enumeration agrees on T, on |S|, and on the signed sum
    - 200 uniform signings, with a void if 20 or more meet |S|/4
    - points with x(P) = 0 or x(P+T) = 0 are excluded
    - the discrete log is not an input to either character
  falsification_conditions:
    - >-
      The absolute sum is at least |S|/4, and the two enumerations
      agree. The strict upper bound is then false on this curve.
    - >-
      At least 20 of the 200 random signings also meet |S|/4. A pass
      of the inequality is then not a separation from the null.
  confounders:
    - Choosing T after seeing the sum would move the threshold.
    - Including a point with a zero coordinate maps χ(0) into the sum.
  interpretation_limits:
    - A ratio below 1/4 at p = 61 does not prove a Weil bound.
    - A ratio of at least 1/4 falsifies only this curve and this T-rule.
    - The rho exponent stays 1/2 either way.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A uniform random signing of |S| points has mean square |S|.
        The translation product is assumed, for this one curve, to
        sit below the constant-fraction line |S|/4, which is larger
        than a square-root scale when |S| is on the Hasse scale.
      rigorous_support: >-
        Independence gives the mean square for fair signs. No theorem
        is claimed for the curve sum. The Weil-level sentence in
        RQ-ECDLP-4fcbd3 is recalled there and was not opened as a
        paper.
      validation_plan: >-
        Compute the absolute sum and |S| on this curve. H1 fails if
        the ratio is at least 1/4 while the two enumerations agree.
        Sample size is the whole set S, plus 200 signings.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. A character product on one toy curve is not
      an exponent.
    memory_exponent: >-
      Unchanged. The census stores O(p) field elements at p = 61.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations. The
      file was opened for this proposal.
    hidden_overhead: >-
      No new o(1) cofactor is claimed. The census is one pass over
      F_61.
    tradeoff_note: >-
      No time-memory tradeoff. The census is a single pass.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
