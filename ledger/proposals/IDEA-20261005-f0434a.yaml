# IDEA-20261005-f0434a
# Class-number count for discriminants -2468 and -2500. Proposal only. Not approved.
idea:
  id: IDEA-20261005-f0434a
  question_id: RQ-JINV-8fc13a
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -2468 is 12 and of discriminant -2500 is 13
  class: measurement
  claim: >-
    Discriminant -2468 has 12 reduced binary quadratic forms.
    Discriminant -2500 has 13. Thirteen exceeds twelve by 1. The product of
    the two class numbers is 156. Their sum is 25. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -2468 has the forms with coefficients 1, 0, 617 and
    2, 2, 309 and 3, -2, 206 and 3, 2, 206 and 6, -2, 103 and 6, 2, 103
    and 9, -4, 69 and 9, 4, 69 and 18, -14, 37 and 18, 14, 37 and
    23, -4, 27 and 23, 4, 27. Discriminant -2500 has the forms with
    coefficients 1, 0, 625 and 2, 2, 313 and 5, 0, 125 and 10, 10, 65
    and 13, -10, 50 and 13, 10, 50 and 17, -4, 37 and 17, 4, 37 and
    25, -20, 29 and 25, -10, 26 and 25, 0, 25 and 25, 10, 26 and
    25, 20, 29. Two copies of class number 12 have gap 0. No curve
    is enumerated.
  novelty_status: unverified
