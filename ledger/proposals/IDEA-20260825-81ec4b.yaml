  batch: EC-STRUCTURE-20260825
  cluster: 'C2-noncommutativity: where the quaternion analogy dies'
  title: 'THE THETA (HEISENBERG) GROUP IS THE ONE CANONICAL NON-COMMUTATIVE OBJECT EVERY ELLIPTIC CURVE
    CARRIES, ORDINARY AND PRIME-FIELD INCLUDED -- AND ITS COMMUTATOR IS THE WEIL PAIRING, WHICH IS TRIVIAL
    ON EXACTLY THE SUBGROUP WE NEED: measure whether a non-isotropic level escapes the collapse at a price
    below rho'
  class: mechanism
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The theta group, its central extension structure, and the identification of its commutator
    with the Weil pairing are classical (Mumford) and recalled. The proposed contribution is the observation
    that this ledger's structural inventory omits it entirely, and the specific question of whether a
    non-isotropic level supplies usable non-commutativity.
  claim:
    semantic_part: For a line bundle of level l on E, the theta group is a central extension of E[l] by
      the multiplicative group whose commutator pairing is the Weil pairing e_l; the extension splits
      over any isotropic subgroup, and the rational prime-order subgroup G is isotropic for e_N, so the
      non-commutativity vanishes on precisely the object the ECDLP concerns.
    evaluator_part: 'Unestablished: whether the splitting over G is efficiently computable, and whether
      working at a level l coprime to N -- where G is not the whole story and the restriction need not
      split -- makes any usable non-commutative structure available at a price below matched rho.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - State the extension and its commutator identity, and confirm that G is isotropic for e_N because the
    Weil pairing is alternating and G is cyclic.
  - 'Consequence: the theta group restricted to G is commutative, so it is not a source of the structure
    KN-FIND-5c1a03 says is missing -- but the reason is isotropy, not absence, which is the same distinction
    drawn in IDEA-20260825-39511f for M_2(K) and suggests the two are instances of one pattern.'
  - 'Ask the escape question at level l coprime to N: E[l] is not contained in G, the restriction of the
    extension to a non-isotropic subgroup does not split, and theta coordinates of level l are computable.
    Does any function of the resulting non-commutative structure depend on k?'
  - 'Charge the price honestly: rational l-torsion generally requires an extension field, and the extension
    degree is the cost that must beat rho.'
  - 'Connect to the split-quotient framing: identifying the Lagrangian subgroup on which the extension
    splits IS the ECDLP-adjacent identification already recorded, so any progress must say what it adds
    to that.'
  lossy_projection_test:
    tracked_object: the class of the theta-group extension restricted to a subgroup
    what_is_discarded: the extension's cocycle up to coboundary; only the class survives
    propagation: restriction is functorial, so the class propagates under subgroup maps
    verdict: PASSES on the face of it -- the class is a genuine quotient and restriction is compatible
      -- but the class is trivial on every isotropic subgroup, which is where the object must be interrogated
      before any experiment.
  predictions:
  - id: P1
    status: established_formula
    statement: The commutator of the theta group of level l is e_l.
  - id: P2
    status: established_formula
    statement: G is isotropic for e_N, so the extension splits over G.
  - id: P3
    status: unestablished
    statement: For l coprime to N there exists a computable function of the level-l theta structure that
      depends on k.
  minimal_discriminating_test:
    status: specified_not_run
    test: At toy scale, construct level-4 theta coordinates on an ordinary curve, compute the restriction
      of the theta group to a non-isotropic subgroup, and test every low-degree function of the resulting
      data for dependence on k across many k with the curve held fixed.
    pass: Some computable function separates two values of k more often than the matched null.
    fail: All tested functions are independent of k, which closes the level-l cell for the tested l and
      function degree.
  controls:
  - 'The same measurement with k re-randomized under AGL(1, N) (per IDEA-20260825-b48ad8): any dependence
    that vanishes was presentation.'
  - 'A supersingular curve at the same level, where non-commutative structure is known to be rich: the
    positive control.'
  - A random central extension of the same shape as the shape-matched null.
  confounders:
  - Theta coordinates are defined up to scalars; a dependence on the choice of normalization can masquerade
    as a dependence on k.
  - Level structure over an extension field silently changes the cost model.
  - Level and subgroup order must be coprime or the restriction is degenerate for an uninteresting reason.
  falsification:
    semantic: A proof that every computable function of level-l theta structure factors through data independent
      of k closes the lane.
    evaluator: A normalization bug scopes out that run.
    not_falsification: Inability to construct theta coordinates at the desired level.
  why_this_is_not_a_variant: IDEA-20260808-fa1d80 tracks the split-quotient certificate and frames the
    ECDLP as identifying a Lagrangian subgroup. This record supplies the ambient non-commutative object
    whose splitting that certificate records, and asks the complementary question -- what happens OFF
    the Lagrangian -- which the certificate framing does not pose.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
