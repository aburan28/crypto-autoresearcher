idea:
  id: IDEA-20260901-d77aa8
  question_id: RQ-ECDLP-160d89
  goal_id: null
  added: '2026-09-01'
  title: >-
    THE CONCENTRATION ROW IS AN ADDITIVE-ENERGY ROW, AND ITS FOURIER DUAL
    CLOSES THE WHOLE gamma = 1 LINE AT ONCE: for a keyed leaf join the
    conditioned cross-collision probability of JPR-C4 equals the keyed
    additive energy of the fibre system over the total pair count squared,
    Parseval converts any concentration beyond uniform (s < 1) into a
    Fourier coefficient of some fibre indicator along a discrete-logarithm
    character of size at least N^{1 - s/2}, i.e. N^{(1-s)/2} above the Weil
    level, so coordinate-bucket keys have s = 1 - o(1) by a one-variable
    character-sum bound and any key with s < 1 is a learnable coarse-log
    predictor -- no soundness, no accepted set, and no bilinear sum needed
  class: mechanism

  claim: >-
    Setting. G = <P> of prime order N. A KEYED LEAF JOIN uses public maps
    alpha, beta from G to a key set of size K, fixed before the lists and
    independent of Q; it emits every pair (R, S) with alpha(R) = beta(S) by
    hashing, in O(L polylog + output) operations, so gamma = 1 by
    construction. Population fibres A_c = alpha^{-1}(c), B_c = beta^{-1}(c).
    This is the only join primitive that reaches JPR-C2/C3 without an order
    (IDEA-20260901-a66d70) or a polynomial relation (IDEA-20260901-730f23).
    Write M = sum_c |A_c||B_c| for the number of matched population pairs
    and r_c(g) for the number of (R, S) in A_c x B_c with R + S = g.

    (E1) THE ENERGY IDENTITY (exact). The emitted-sum distribution is
    p(g) = (1/M) sum_c r_c(g), and its collision probability is
        coll = sum_g p(g)^2 = E_key / M^2,   E_key = sum_g (sum_c r_c(g))^2,
    the KEYED ADDITIVE ENERGY of the fibre system. JPR-C4 -- conditioned
    cross-collision probability Theta(N^{-2/3}) -- is therefore the
    statement E_key >= M^2 N^{-2/3}, and more generally the Renyi-2 support
    exponent s of IDEA-20260829-3f0f4b is defined by E_key = M^2 N^{-s}.
    NO ACCEPTED SET APPEARS. The soundness hypothesis of
    IDEA-20260829-390ccc (A_c + B_c inside a predeclared D) is not needed to
    state the row, and this record never uses it.

    (E2) THE FOURIER DUAL (exact). Since the sum over c of the convolutions
    1_{A_c} * 1_{B_c} has Fourier transform sum_c Ahat_c Bhat_c, Parseval
    gives
        coll = 1/N + (1/(N M^2)) sum_{xi != 0} | sum_c Ahat_c(xi) Bhat_c(xi) |^2,
    with Ahat_c(xi) = sum_{R in A_c} e(xi log_P(R)/N) the transform along the
    characters of G. Bounding the inner sum by Cauchy-Schwarz and Parseval
    on the B side gives, for balanced fibres of size N/K,
        coll <= 1/N + tau_max^2 K^3 / N^3,   tau_max = max_{c, xi != 0} |Ahat_c(xi)|.
    Consequently, s < 1 (any concentration beyond uniform, up to the o(1))
    FORCES some fibre to have a Fourier coefficient
        tau_max >= N^{(3-s)/2} K^{-3/2},   equal to N^{1 - s/2} at K = N^{1/3},
    along a nontrivial character of G, which is a character of the
    discrete logarithm. The random level for a set of size N^{2/3} is
    N^{1/3}; the Weil level for a coordinate-defined set is N^{1/2+o(1)};
    the requirement is N^{(1-s)/2} above Weil and N^{2/3 - s/2} above
    random. At the Wagner corner s = 2/3 the fibre must correlate with a
    log character at CONSTANT relative level N^{1 - 1/3}/N^{2/3} = 1.

    (E3) COORDINATE-BUCKET KEYS ARE THE PAIR COIN. If alpha buckets a
    bounded-degree coordinate (x in an interval, quadratic character of x,
    any set cut from F_p by an interval or a multiplicative condition and
    pulled back to G), then by the recalled Kohel-Shparlinski / Lange-
    Shparlinski mixed character-sum bounds every fibre has
    tau_max = O(N^{1/2} log N), so coll <= 1/N + O(K^3 log^2 N / N^2), which
    at K = N^{1/3} is (1 + o(1))/N: s = 1 - o(1). The keyed leaf join with
    a coordinate-bucket key emits sums that are UNIFORM, its level-2
    cross-collision is at the ambient rate 1/N, and it is exactly the
    independent pair coin of JPR-REV-4 with expected time N. This is a
    rigorous statement modulo one recalled bound, and it holds at EVERY s,
    closing the coordinate-bucket family on the whole gamma = 1 line, not
    only at the corner.

    (E4) EVERY CONCENTRATING KEY IS A COARSE-LOG PREDICTOR, LEARNABLY. A
    fibre indicator 1_{A_c} is an efficiently computable function of the
    point (one evaluation of alpha). By (E2) it has a Fourier coefficient
    of relative size tau = tau_max / |A_c| >= N^{1/3 - s/2} at some
    frequency xi_0. The Akavia-Goldwasser-Safra sparse Fourier learner
    (recalled; the same cascade as IDEA-20260901-a66d70 T3) recovers a
    tau-heavy coefficient of t -> 1_{A_c}([t]P) and of t -> 1_{A_c}([t]Q)
    in poly(log N, 1/tau) queries, giving xi_0 and xi_0 x, hence x. At
    s = 2/3 this is polynomial time; at general s it is
    N^{c (s/2 - 1/3) + o(1)} for the learner's polynomial degree c in
    1/tau, which for every c < 3 is BELOW the four-list route's own
    per-attempt cost N^{max((2-s)/4, s/2)} throughout s in (2/3, 1). So a
    concentrating key is never used best by the four-list route.

    (E5) NOT CLAIMED. No key with s < 1 is exhibited or predicted; the
    record predicts none exists among coordinate keys and says nothing
    about keys computed by other means. No ECDLP speedup.

  mechanism: >-
    THE TRACKED OBJECT is the FIBRE INDICATOR 1_{A_c} of a key, viewed
    through its Fourier transform along the characters of G. The projection
    from the fibre (a set of N/K points) to its heaviest nontrivial Fourier
    coefficient discards everything except one correlation with one
    log-character; it retains exactly the quantity that (E2) shows bounds
    concentration. The discard is compatible with addition because
    convolution is multiplication on the Fourier side, which is why the
    energy of a SUM of fibre pairs is controlled by single-fibre
    coefficients: no bilinear estimate is needed, only Parseval and one
    Cauchy-Schwarz.

    WHY THE LANE DID NOT HAVE THIS. The lane's keys were placed on SUMS
    (K-EC-XINTERVAL-1 buckets x(R + S)), which is post-hoc and costs L^2;
    the analytic record IDEA-20260829-4b34c5 therefore reached for BILINEAR
    sums over the acceptance matrix chi(x(R_i + S_j)) and predicted their
    threshold exceeds N^{1/3}. A key that reaches gamma = 1 is a key on
    LEAVES, and for leaf keys the concentration row is a statement about
    single-fibre transforms, for which ONE-VARIABLE bounds at the Weil level
    suffice. Moving the key from sums to leaves is what makes the row
    provable, and it is forced anyway by JPR-C2.

    STAGE 0 (zero compute, HARD GATE). Check (E1) and (E2) on the object
    where the hoped-for negative conclusion must FAIL: F_2^{3m} with the
    m-bit prefix key. Fibres are cosets of the kernel subspace W of size
    2^{2m}; 1_{A_c} has Fourier mass concentrated on the annihilator of W,
    tau_max = |A_c| exactly (a subgroup indicator is maximally biased),
    coll = 1/|W| = 2^{-2m}, s = 2/3 at K = 2^m. The identity must return
    these values exactly; if it does not, the derivation is wrong. Second
    control, Z/N with the top-bits-of-log key: fibres are log-intervals,
    tau_max about |A_c|/pi at frequency 1, coll about 1/|A_c|, s = 2/3.
    Third, the null: a uniformly random key, tau_max = O(sqrt(N/K) log N),
    s = 1 - o(1).

    STAGE 1 (symbolic). Write (E2) with constants, including the
    Cauchy-Schwarz loss K in the cross-fibre sum, and derive the tau_max
    threshold as a function of (s, K). Record the balanced-fibre assumption
    and what changes for unbalanced fibres (the bound becomes a weighted
    one; the record predicts the same exponent).

    STAGE 2 (literature extraction). Fetch the Kohel-Shparlinski and
    Lange-Shparlinski statements and record EXACTLY which mixed sums over G
    they bound: the sum over R in G of e_p(a x(R)) chi(R) for chi a
    character of G, or only pure sums over subgroups. (E3) needs the mixed
    form; if only the pure form is available, (E3) is downgraded to a
    heuristic with the pure bound as its rigorous half and the record says
    so. Then derive tau_max for x^{-1}(I) by expanding 1_I in additive
    characters of F_p (L^1 norm O(p log p)) and applying the mixed bound.

    STAGE 3 (symbolic). Write (E4) with the learner's cost as a stated
    polynomial in 1/tau and compare against N^{max((2-s)/4, s/2)} over
    s in (2/3, 1); record the range of c for which the cascade beats the
    four-list route (all c < 3) and note the comparison is a same-key
    control in the sense of IDEA-20260901-a31b94.

    STAGE 4 (the instrument, FUTURE only). Note for a successor: E_key and
    tau_max are computable EXACTLY at toy scale by an FFT over the log
    coordinate once logarithms are known by construction, in O(N log N),
    with no join ever run; this makes s measurable for ANY candidate key at
    24 to 34 bits at negligible cost, which is the cheapest instrument the
    lane has been offered and is NOT requested here.

