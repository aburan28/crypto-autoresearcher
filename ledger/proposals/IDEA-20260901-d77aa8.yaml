  assumptions:
    - A1. N prime; characters of G are R -> e(xi log_P(R)/N).
    - >-
      A2. Keys are fixed before the lists and independent of Q; fibres are
      population sets, and sampled lists are uniform, so sampled emitted
      sums are samples from p(g) (H1).
    - >-
      A3. Balanced fibres |A_c| = |B_c| = N/K in the displayed bound; the
      unbalanced case changes constants, not the exponent (proof obligation).
    - >-
      A4. The two sides use keys alpha, beta with the same fibre-size
      profile; the negated side (needed for zero relations) has the same
      transform up to conjugation.
    - A5. No exact nontrivial quotient of G is assumed; (E2) is a bound, not a structure claim.

  proof_search_map:
    bottleneck: >-
      The concentration row has been a heuristic (H-COND-FLAT, B64-DER-4)
      because it was posed for a key on SUMS. Posed for a key on LEAVES it
      is an energy, whose Fourier dual is a single-fibre statement. That
      re-posing is the decision-changing step.
    baseline_embedding:
      parameter_slice: >-
        F_2^{3m} with the prefix key: (E1)-(E2) must return coll = 2^{-2m},
        s = 2/3, tau_max = |A_c|, reproducing Wagner's corner exactly. Z/N
        with the top-bits-of-log key: coll about 1/|A_c|, s = 2/3. A
        uniformly random key: coll = (1 + o(1))/N, s = 1.
      reproduction_check: >-
        Symbolic on all three; frozen fixture (FUTURE, separate authority):
        N = 2^{11} - ish prime, K = 8, exact FFT computation of E_key for
        the log-bucket key and for a random key, asserting the two s
        values to three decimals.
    observation_collision:
      observable: The Renyi-2 support exponent s of the emitted sums.
      distinct_preimage_search: >-
        Two keys can share s = 1 - o(1) for different reasons: a coordinate
        bucket key (Weil-level bias, no structure) and a random key (random-
        level bias). They are distinguished by tau_max: N^{1/2} versus
        N^{1/3}. Since neither reaches N^{1 - s/2} for any s < 1, the
        collision is harmless for the conclusion but must be reported so
        that 'Weil level' is not misread as 'structure'.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the concentration row from a distributional statement about
          sums to the Fourier side, where it is an inequality between one
          number (tau_max) and one function of (s, K).
        predicted_gain: >-
          Converts H-COND-FLAT from 'no rigorous support' to 'rigorous
          modulo one one-variable character-sum bound', and closes every
          coordinate-bucket leaf key at all s < 1 at zero compute.
      - transform: stronger_invariant
        proposed_object: >-
          Track the full Fourier profile max over xi of |Ahat_c(xi)| per
          fibre rather than the scalar s; the profile is what survives the
          k-tree recursion (convolution multiplies transforms).
        predicted_gain: >-
          Level-by-level control of concentration in a 2^t-tree with no
          new heuristic per level.
    quantifier_order: >-
      (E2): FOR ALL prime N, FOR ALL public keys alpha, beta with K keys and
      balanced fibres, IF the emitted-sum collision probability is N^{-s}
      THEN THERE EXISTS a fibre c and a nontrivial xi with
      |Ahat_c(xi)| >= N^{(3-s)/2} K^{-3/2}. (E3): FOR ALL coordinate-bucket
      keys of bounded degree, FOR ALL c and xi != 0, |Ahat_c(xi)| =
      O(N^{1/2} log N) (conditional on the recalled bound), hence s >= 1 - o(1).
      No witness depends on the lists or on Q. NOT CLAIMED: (E3) for keys
      not cut from a bounded-degree coordinate by an interval or
      multiplicative condition.
    method_ceiling:
      strongest_certifiable_claim: >-
        For keyed leaf joins: an exact identity, a necessary condition
        (tau_max threshold) for any s < 1, and the closure of the
        coordinate-bucket family at s = 1 - o(1). It can NEVER certify that
        no key with large tau_max exists (that is (E4)'s cascade, which
        makes such a key a DLP oracle rather than impossible), nor anything
        about joins that are not keyed leaf joins.
      nearby_object_control: >-
        Where the negative conclusion FAILS: F_2^{3m} with the prefix key,
        tau_max maximal because fibres are cosets of a subgroup; and Z/N
        with the log-bucket key, tau_max about |A_c|/pi because fibres are
        log-intervals. Both are reproduced as positive controls, and the
        argument must return s = 2/3 on both or it is wrong. The
        load-bearing structure is that on a prime-order EC group no
        coordinate-defined set has Fourier bias above the Weil level.
    proof_obligations:
      - claim: coll = E_key / M^2 with E_key the keyed additive energy (E1).
        responsibility: correctness
      - claim: >-
          The Parseval expansion of coll and the Cauchy-Schwarz bound
          coll <= 1/N + tau_max^2 K^3/N^3 for balanced fibres (E2).
        responsibility: correctness
      - claim: The unbalanced-fibre version has the same exponent.
        responsibility: size
      - claim: >-
          For x^{-1}(I), expanding 1_I in additive characters of F_p and
          applying a mixed sum bound of order p^{1/2} gives tau_max =
          O(N^{1/2} log N) (E3).
        responsibility: feasibility
      - claim: >-
          The Fourier coefficient of 1_{A_c} at xi_0 transfers to
          t -> 1_{A_c}([t]P) and t -> 1_{A_c}([t]Q) at xi_0 and xi_0 x.
        responsibility: interface
      - claim: >-
          The learner's cost N^{c(s/2 - 1/3)} is below N^{max((2-s)/4, s/2)}
          for s in (2/3, 1) whenever c < 3.
        responsibility: runtime
      - claim: Both positive controls return s = 2/3 exactly; the random null returns s = 1 - o(1).
        responsibility: baseline
      - claim: The argument is silent on F_2^n and on subgroup-defined sets.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The heaviest nontrivial Fourier coefficient of a key's fibre
      indicator along the characters of G.
    lossiness: >-
      Genuinely lossy: one complex number retained from a set of N/K
      points. Compatible with the join's operation because the transform
      of a convolution is the product of transforms, so the retained
      quantity of a fibre PAIR is determined by the retained quantities of
      the fibres. Passes the lossy-projection test non-vacuously.
    propagation: >-
      Exact under convolution (pair sums), which is the level-1 operation;
      under further k-tree levels the profile multiplies, so concentration
      can only decay unless every level's fibres are biased, which is the
      stronger-invariant transform above.
    survival_score: >-
      Survives every level. The record's use is negative: it survives so
      well that it certifies, at level 1 already, that coordinate keys do
      not concentrate.

  null_object_control: >-
    NULL-1 (zero compute): a uniformly random key with K = N^{1/3};
    tau_max = O(sqrt(N/K) log N) = O(N^{1/3} log N), s = 1 - o(1); this is
    the record's floor and any coordinate key must sit between it and the
    Weil level N^{1/2}. NULL-2: the independent per-pair coin of JPR-REV-4,
    which is not a keyed join but has s = 1, expected time N; (E3) says the
    coordinate-bucket keyed join IS this object. POSITIVE CONTROLS
    (blocking): F_2^{3m} prefix key and Z/N log-bucket key, s = 2/3 exactly.
    DECAY PARAMETER (FUTURE): field bits; a measured s below 1 for a
    coordinate key at toy scale that does not persist as p grows is a
    small-field artifact (the Weil level N^{1/2} and the fibre size N^{2/3}
    are too close at 24 bits to separate cleanly), and the record predicts
    exactly that difficulty rather than a signal.

  discriminated_from:
    - >-
      IDEA-20260829-390ccc. NEAREST STRUCTURAL RECORD. It assumes SOUNDNESS
      (A_c + B_c inside D) and derives AP structure by Cauchy-Davenport and
      Vosper, at the corner only. EXACT DELTA: this record assumes NO
      accepted set and NO soundness, uses Parseval instead of sumset
      growth, reaches a quantitative Fourier-bias conclusion at EVERY
      s < 1 rather than structure at s = 2/3, and covers the two-sided-
      error classes (b) and (c) that 390ccc lists as open. At the corner
      the two agree: constant relative Fourier bias is the analytic face of
      AP structure.
    - >-
      IDEA-20260829-4b34c5. NEAREST ANALYTIC RECORD. It targets a SUM-key
      and needs BILINEAR bounds whose threshold it predicts exceeds
      N^{1/3}. EXACT DELTA: for LEAF keys, which are the only ones with
      gamma = 1, the concentration row needs only ONE-VARIABLE bounds at
      the Weil level, which are available at every list length; the
      bilinear obstacle was an artifact of keying on sums.
    - >-
      IDEA-20260829-3f0f4b. Treats s as a measured coordinate and asks
      which (gamma, s) points are occupied; this record derives a
      necessary condition on the KEY for any s < 1 and shows the
      coordinate-bucket family occupies only s = 1 - o(1) on the gamma = 1
      line. It also supplies the FFT instrument that would measure s
      without running a join.
    - >-
      IDEA-20260823-cab6c6. H-COND-FLAT is stated for a sum-key with no
      rigorous support; (E1)-(E3) is the leaf-key version with rigorous
      support modulo one recalled bound.
    - >-
      IDEA-20260901-a66d70 (this session). Shares the SFT cascade for the
      final step only; its object is an ORDER and its identity is
      approximate additivity, while this record's object is a FIBRE and
      its identity is energy. Independent up to the shared corollary.

  predictions:
    - metric: M1 -- s returned by (E1)-(E2) on the F_2^{3m} prefix key and on the Z/N log-bucket key
      direction: different
      minimum_effect: FORCED, exactly 2/3 on both; any deviation voids the record.
    - metric: M2 -- the tau_max threshold at K = N^{1/3} as a function of s
      direction: different
      minimum_effect: >-
        Exactly N^{1 - s/2} up to constants; at s = 2/3 relative bias
        Theta(1), at s = 1 the Weil level N^{1/2}. A derivation giving a
        threshold BELOW the Weil level at some s < 1 has an error, because
        it would let coordinate keys concentrate.
    - metric: M3 -- s for the x-interval bucket leaf key, conditional on the recalled mixed bound
      direction: higher
      minimum_effect: >-
        s >= 1 - O(log log N / log N). If the extracted bound is only the
        pure-subgroup form, this prediction is downgraded to a heuristic and
        the record says so.
    - metric: >-
        M4 -- exact s for the x-interval bucket key at 24 to 34 bits by FFT
        over the log coordinate (FUTURE, separate authority)
      direction: higher
      minimum_effect: >-
        Indistinguishable from the random-key null within its spread at
        every tested size; a measured s below 0.9 persisting across three
        field sizes would falsify (E3) and would be an exponent-relevant
        lead routed to review-breakthrough.

  minimal_test:
    design: >-
      STATIC AND SYMBOLIC ONLY, zero runs, inside the RQ claim boundary.
      Step 1: derive (E1) and (E2) with constants; run the two positive
