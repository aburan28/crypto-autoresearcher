idea:
  id: IDEA-20260809-88708d
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: The inventor protocol names one rung of its validation ladder as 'the one this program
    most often skips' and nobody has ever counted how often -- 10 of 326 evidence records carry
    a reproduced_baseline and 10 of 459 proposals a matched_baseline, and the corpus contains
    scattered honest admissions of skipping it and no aggregate
  class: control
  claim: 'docs/inventor-protocol.md section 6 defines a four-rung validation ladder for claimed
    improvements that cannot be executed at the scale where they would matter -- ''the normal
    case here'' -- whose step 2 requires running the entire pipeline on a scaled-down instance
    and checking that the predicted improvement appears ''as a measured ratio against the baseline,
    not as an extrapolation''. The document then diagnoses itself: ''Step 2 is the one this program
    most often skips, and it is the one that converts a claimed speedup into an observed one.''
    THE RATE HAS NEVER BEEN COUNTED, and the field census says it is low: only 10 evidence records
    carry a reproduced_baseline and only 10 proposals a matched_baseline. The ladder is mentioned
    by name in exactly six records outside the protocol document, and two of those six are ADMISSIONS
    rather than uses -- EXP-WESO-f5166c''s specification says its work sits on the ladder ''explicitly
    not step 2'', and H-LPF-001 calls itself ''the smallest-scale rung of a validation ladder
    whose upper rungs do not yet exist'' -- while IDEA-20260805-411b0e cites section 6 to justify
    labelling a quantity a DERIVED CONSEQUENCE precisely because it ''cannot be measured directly
    at reachable scale''. So the corpus holds scattered honest admissions of skipping step 2 and
    no aggregate. The measurable question this makes available: over the evidence records that
    report or support a cost or exponent improvement, what fraction establish it as a head-to-head
    measured ratio against a matched baseline AT THE SAME PARAMETERS, versus by extrapolation
    from a fitted model?'
  mechanism: 'Score every evidence record whose direction is supports / supports_strongly / supports_scoped
    against the four rungs: rung 1 (assumptions isolated and measured separately), rung 2 (measured
    ratio against a matched baseline at the same parameters), rung 3 (real object with named cheats,
    each classified completeness-preserving or soundness-losing), rung 4 (reproducibility pointer
    rebuilt, not asserted). Report the distribution. TWO CONTROLS GUARD AGAINST THE AUDIT BEING
    A FATIGUE REPORT IN ITS OWN RIGHT: a forced-PASS set from the 10 records that already carry
    reproduced_baseline, and a forced-FAIL set from EXP-WESO-f5166c and H-LPF-001, which state
    on the record that they are not at rung 2. The likely and still-useful outcome is that most
    supporting evidence sits at rung 1 -- in which case the deliverable is the NAMED LIST of claims
    whose rung-2 check is both missing and cheap, since the matched controls (Pollard rho with
    distinguished points, BSGS) are already mandatory under several questions'' constraints and
    already implemented in harness/.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'The protocol document states the diagnosis as an IMPRESSION -- ''most often'' -- with no
      number behind it, which is exactly the kind of claim about the program''s own behaviour
      AGENTS.md rule 5 would not permit in an evidence record. The nearest proposal, IDEA-20260807-5a8d61,
      audits section 4 (the closure standard) over eight decisions from one series, BATCH-055..066
      of GOAL-ECDLP-001 on 2026-08-04; section 4 is about how a NEGATIVE result may be closed
      and section 6 about how a POSITIVE claim must be substantiated -- different sections, different
      records, disjoint failure modes. Verified: no proposal among 459 has the validation ladder
      as its subject; the three title-level hits are a full-round AES sensitivity ladder, a quotient
      ladder for End(E), and the AES localisation proposal.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: re-litigating any individual claim. The object
      is the VALIDATION LADDER RUNG each supporting evidence record actually reaches.'
    tracked_object: Per supporting evidence record, its highest satisfied rung of the four in
      docs/inventor-protocol.md section 6.
    one_step_propagation_rule: A record satisfies rung k only if it satisfies the evidence rung
      k names; the rungs are ordered and the assignment is exact given the criteria.
    newness_score: Nil as mathematics. The protocol says step 2 is 'the one this program most
      often skips' and nobody has ever counted -- so the program's own diagnosis of itself is
      an impression.
  lossy_projection_identifiability_audit:
    projection: an evidence record -> a rung number.
    what_is_discarded: The science; only the substantiation shape is retained.
    is_it_only_a_change_of_coordinates: 'NO -- the rung assignment does not exist. Honest caveat:
      an audit produces a histogram, not mathematics, and rung 1 evidence is legitimate evidence,
      not a failure.'
    mirror_failure_check: 'CHECKED. The audit must be able to assign high rungs: 10 evidence records
      carry a reproduced_baseline and are the forced-PASS set.'
  null_object_control:
    primary_null: 'FORCED-PASS: the 10 records carrying a reproduced_baseline must score at rung
      2 or above. FORCED-FAIL: EXP-WESO-f5166c and H-LPF-001, which state on the record that they
      are not at rung 2, must score below it. An audit failing either control is not an instrument.'
    secondary_nulls:
    - Score only records whose direction is supports / supports_strongly / supports_scoped --
      neutral and refuting records have no improvement to substantiate.
    - Publish the rung criteria before scoring.
  assumptions: []
  predictions:
  - metric: distribution of supporting evidence records across the four rungs
    direction: lower
    minimum_effect: Any concentration at rung 1 quantifies a claim the protocol currently makes
      as an impression. 10 of 326 records carry a reproduced_baseline and 10 of 459 proposals
      a matched_baseline.
  minimal_test:
    design: Score every supporting evidence record against the four rungs with criteria published
      first; run both control sets; report the distribution and, for rung-1 records, whether the
      rung-2 check is cheap given that matched rho and BSGS controls are already implemented in
      harness/.
    controls:
    - forced-PASS reproduced_baseline set
    - forced-FAIL self-declared non-rung-2 records
    - pre-published rung criteria
    required_metrics:
    - rung distribution
    - per-record rung with justification
    - named list of claims whose rung-2 check is missing and cheap
  falsification_conditions:
  - 'Most supporting evidence is already at rung 2: the protocol''s self-diagnosis is wrong and
    the program''s positive results are better substantiated than it believes.'
  - 'Either control set fails: the audit instrument does not discriminate and no distribution
    is admissible.'
  - 'Rung assignment is not decidable from committed records for most of them: the audit cannot
    be run as designed and the criteria need to be operationalised first.'
  confounders:
  - Rung 1 is legitimate and the audit must not read it as failure -- the deliverable is a list
    of cheap missing rung-2 checks, not a scorecard.
  - The rung criteria are qualitative and two auditors may differ; publishing them first is the
    mitigation.
  - An audit of an audit standard risks being a fatigue report in its own right, which is why
    both control sets are mandatory.
  interpretation_limits:
  - Scores substantiation shape, not correctness. A rung-1 record can be perfectly correct.
  - No hypothesis status changes.
  heuristic_assumptions:
  - id: HEUR-LADDR-1
    statement: Highest satisfied rung is a faithful summary of how well a claimed improvement
      is substantiated.
    rigorous_support: None; the protocol itself carries a provenance caveat and may not be cited
      as evidence that following it produces results.
    validation_plan: Publish the criteria and invite disagreement with the rubric as a first-class
      outcome.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a -- no attack
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no attack claimed)
  sota_delta: ZERO on every attack axis; no attack is proposed. docs/target-result-profile.md
    asks for exponent-moving results validated at scale, and section 6 is the program's own account
    of how a claim gets from toy measurement to a credible improvement. If step 2 is skipped at
    the rate the document suspects, the program has been accumulating rung-1 evidence and reading
    it as progress, and the fix is a per-claim list rather than a policy change. If it is not,
    that is the first defensible statement the program can make about the quality of its own positive
    results.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.9 that the audit is runnable on the supporting subset. 0.8 that
    the distribution concentrates at rung 1, confirming the protocol's suspicion with a number.
    0.5 that a useful list of cheap missing rung-2 checks falls out, which is the deliverable
    that would actually change anything.
