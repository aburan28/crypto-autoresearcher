idea:
  id: IDEA-20260921-4af08b
  id_allocation_provenance: >-
    Minted by the top-level coordinator session with `python3
    tools/allocate_id.py --next idea --date 20260921` and confirmed free
    with `--check` on 2026-09-21. Authored under the idea-generator role
    contract in the coordinator session (role-runtime outage; runtime
    substitution recorded per the interchangeable-runtimes clause, see
    DEC-20260921-4d1b40).
  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    THE CENSUS'S TRADEOFF MAY BE A THEOREM, NOT AN ACCIDENT: for SET
    statistics on P^1(F_p), lambda-level constancy across the PGL_2
    family may FORCE the Gauss-flat random level -- because spectral
    concentration implies additive (interval/AP-type) structure, whose
    PGL_2 images (arcs) are NOT additively structured, so a
    level-constant family can carry concentration only if every member's
    inversion image also concentrates, and the inversion image's
    transform is Kloosterman-governed with square-root cancellation that
    bounds concentration away -- the census's C03 deviations (intervals
    unstable, cosets flat-and-stable) are exactly the two sides of this
    mechanism, and a proof-shaped version of it would convert the census
    from a 12-row negative into a structural obstruction for the whole
    synthetic-statistic lane, with the multiplicative cosets as the
    EQUALITY CASE and a precisely stated escape hatch (non-set
    statistics: characters, multi-level partitions) that the lane's
    successor measurements are already positioned to test.
  class: mechanism
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): class R1 of
    RQ-ECDLP-623a32 (set statistics on the coordinate line), attack
    stage COLLISION STRUCTURE. CLAIM, stated as a proof obligation: for
    every family F of subsets of P^1(F_p) closed under PGL_2(F_p) and
    every A in F with |A| = theta(p) (balanced density), if the
    probability-normalised additive spectral norm lambda(1_A/|A|) is
    CONSTANT across F at scale p^{lambda_0} with lambda_0 < 1/2
    (spectrally concentrated: below the Gauss-flat random level 1/2,
    which Parseval/Cauchy-Schwarz makes the ceiling for balanced density
    on the census scale -- intervals 0.08, digit levels 0.38-0.42), then
    a contradiction is reachable through the
    three-step mechanism (concentration implies additive structure;
    PGL_2 images of additively structured sets are arcs; the inversion
    image's transform is Kloosterman-governed with cancellation that
    forbids the same concentration); the claim is that this obligation
    is provable at the derivation level or refutable by a constructed
    counterexample family, and either outcome reorganises the
    synthetic-statistic lane around a stated obstruction instead of a
    12-row table.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the set statistic's
    fibre under the branching operation (Class II branching,
    IDEA-20260806-c5d183), canonical probability normalisation
    (DEC-20260921-8e8086). THE THREE-STEP MECHANISM, each step with its
    known-cases: (1) CONCENTRATION-IMPLIES-STRUCTURE: a set whose
    indicator's Fourier mass concentrates (l1 << p, or a single heavy
    coefficient) has small doubling/additive energy -- the
    additive-combinatorial converse direction (Freiman-type), with the
    interval/AP case as the extremal example and the census's R01/R02
    (lambda 0.08, log-scale) as the measured instance. (2) THE FAMILY
    ARGUMENT: PGL_2 contains the inversion; if the family is
    level-constant, the inversion image of a structured member carries
    the same lambda, but the inversion image of an interval-like set is
    an arc, whose additive structure is that of {1/x : x in I} -- no
    additive structure in general. (3) THE CANCELLATION BOUND: the
    transform of a condition on 1/x is a Kloosterman/Salié-type sum
    whose coefficients sit at the p^{1/2} scale with pseudo-random
    phases (square-root cancellation), forcing the flat level 1/2 --
    with the multiplicative cosets as the EQUALITY CASE (their flatness
    is the pure Gauss case, and their stability is exactly the family
    closure {gH o M} = {multiplicative cosets of other generators}). The
    census's C03 battery readings are the two ends: R01 unstable
    (structure does not survive the family), R08 flat (flatness does).
    The obligation is to make the transitive chain rigorous at the
    derivation level, or to exhibit the counterexample family that
    breaks step (1) or (3) -- a set family that is PGL_2-closed with
    concentration that survives inversion.
  novelty_status: unverified
  citations:
    -
      ref: EV-ECDLP-81f4d4
      provenance: internal
      claim: >-
        The measured ends of the mechanism: R01/R02 lambda 0.0806 with
        Moebius deviation beyond 2SE; R06/R08 stable at 0.5013/0.5000
        (R08 exactly by the Gauss-sum derivation in analysis.md).
      verified_by: "coordinator session, authored and reviewed the record on 2026-09-21"
    -
      ref: IDEA-20260920-b6ad24
      provenance: internal
      claim: >-
        The Parseval/doubling machinery (energy, fourth-moment Parseval)
        that step (1) builds on, already committed in the lane.
      verified_by: "coordinator session, full read on 2026-09-21"
    -
      ref: Freiman/Ruzsa additive-structure converse direction
      provenance: recalled
      claim: >-
        Small-doubling/structure classification results that motivate
        step (1). RECALLED, NOT OPENED: the proof note must cite the
        exact form it uses after extraction; no support is claimed here.
    -
      ref: Kloosterman/Salié cancellation (Weil bound for twisted sums)
      provenance: recalled
      claim: >-
        Square-root cancellation for inversion-twisted character sums,
        motivating step (3). RECALLED, NOT OPENED: same status.
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: no attack family is used; this is a
      closure-standard proposal in the inventor protocol's sense -- a
      negative with a named obstruction, forward guidance, and a
      resource check.
  proof_search_map:
    bottleneck: >-
      The synthetic-statistic lane's search space: without a structural
      obstruction, every new statistic family is tried empirically; with
      one, the search reorganises around the stated escape hatch
      (non-set statistics).
    baseline_embedding:
      parameter_slice: >-
        The census's 12 rows at their measured primes are the baseline:
        any theorem must reproduce both ends (intervals unstable, cosets
        flat-equality) as instances.
      reproduction_check: >-
        The Gauss-sum derivation of lambda(R08) = 1/2 exactly (already
        blind-re-derived in the evidence round) is the equality-case
        check the proof must specialise to.
    observation_collision:
      observable: >-
        The pair (family lambda-constancy, member concentration) -- the
        theorem asserts their incompatibility below the flat level; a
        counterexample family makes both observable simultaneously.
      distinct_preimage_search: >-
        Candidate counterexample families to enumerate in the proof
        note: sets built from both additive and multiplicative structure
        simultaneously (e.g. {x in I : x is QR} for an interval I), whose
        inversion images swap the roles rather than destroying the
        structure -- the exact seam IDEA-20260921-3ecbe8 measures.
    constructive_transforms:
      -
        transform: observable_fiber
        proposed_object: >-
          The fiber of the sum-map over the inversion-twisted characters
          (the Kloosterman-type sums) as the object whose cancellation
          forces flatness.
        predicted_gain: >-
          Converts an empirical tradeoff into a scoped obstruction with
          an equality case.
    quantifier_order: >-
      FOR EVERY PGL_2-closed family F of balanced-density subsets, FOR
      EVERY A in F: constant lambda across F below the flat level leads
      to contradiction -- the family quantifier is universal, the member
      quantifier inside it; any counterexample is EXISTENTIAL and
      refutes the whole obligation.
    method_ceiling:
      strongest_certifiable_claim: >-
        A derivation-level theorem for SET statistics: PGL_2-closed
        families of balanced subsets have family-constant lambda only at
        the Gauss-flat level (or the precise weakened version the lemmas
        support); explicitly NOT covering non-set statistics
        (characters, multi-level partitions), for which the escape
        hatch is stated.
      nearby_object_control: >-
        PROVES-TOO-MUCH control (mandatory): run the argument against
        the multiplicative cosets -- the theorem must NOT exclude them
        (they are flat, so the theorem's conclusion holds for them at
        equality); if the argument as written excluded the cosets, it
        proves too much and is wrong. Second control: a family of
        random sets is NOT PGL_2-closed (its closure is all sets), so
        the theorem must say nothing about random sets' own lambda --
        the closure condition is load-bearing.
    proof_obligations:
      -
        claim: >-
          FEASIBILITY. Define "PGL_2-closed family" and
          "lambda-constant at scale p^{lambda_0}" precisely enough to
          quantify.
        responsibility: feasibility
      -
        claim: >-
          STEP 1. Concentration (l1 below the flat level) implies
          approximate additive structure at the census's measured
          scales, via energy/doubling in the b6ad24 machinery.
        responsibility: baseline
      -
        claim: >-
          STEP 2. The inversion image of an additively structured set is
          an arc with no comparable additive structure.
        responsibility: strictness
      -
        claim: >-
          STEP 3. The inversion-twisted transform is
          Kloosterman/Salié-governed with cancellation forbidding the
          same concentration, at the p^{1/2} scale.
        responsibility: size
      -
        claim: >-
          COMPOSITION. Steps 1-3 compose into the contradiction for
          lambda_0 < 1/2 under the family-constancy hypothesis.
        responsibility: correctness
      -
        claim: >-
          SCOPE. The theorem covers set statistics only; the escape
          hatch (characters, partitions) is stated, and the cosets are
          the equality case.
        responsibility: scope
      -
        claim: >-
          COUNTEREXAMPLE SEARCH. The both-structures families (interval
          cap coset, and IDEA-20260921-3ecbe8's cross-ratio QR) are
          enumerated and either fall under the theorem or expose the
          gap.
        responsibility: interface
    not_applicable_reason: null
  predictions:
    -
      metric: derivation-level proof note outcome
      direction: different
      minimum_effect: >-
        Either the three-step chain closes at derivation level (the
        obstruction stands and the lane reorganises around the escape
        hatch) or a step breaks -- most plausibly step (1), whose
        converse direction is the weakest link -- and the breaking step
        names the counterexample family the lane should measure next.
    -
      metric: the both-structures families' status
      direction: different
      minimum_effect: >-
        Each enumerated family is either inside the theorem's scope or
        the recorded gap; no family is left unclassified.
  minimal_test:
    design: >-
      Two-part, both cheap: (1) a derivation-level proof note carrying
      the six obligations with the recalled Kloosterman/Freiman forms
      extracted or explicitly flagged unextracted; (2) a toy
      verification harness run: the both-structures families (interval
      cap coset at matched sizes, the cross-ratio QR row of
      IDEA-20260921-3ecbe8) measured for (lambda, inversion-image
      lambda) at 4-6 primes -- the theorem predicts inversion-image
      lambda collapses toward the flat level for the structured member
      and stays flat for the coset member.
    controls:
      - R08 equality case (flat under inversion by the Gauss symmetry)
      - R01 (structured, inversion image expected flat-ward) as the
        positive instance of the mechanism
      - >-
        proves-too-much battery: >-
        the theorem statement specialises to
        the cosets without excluding them
    required_metrics:
      - per-family lambda and inversion-image lambda with 2SE tests
      - the proof note's obligation-by-obligation verdicts
  falsification_conditions:
    - >-
      A both-structures family measures level-constant lambda below the
      flat level across its PGL_2 sweep: the obligation is REFUTED by
      counterexample; the record promotes the family to the lane's
      measured successor and the "theorem" is withdrawn.
    - >-
      A proof step resists derivation: the claim is downgraded to the
      fragment the lemmas support with the open fragment named.
    - >-
      Toy disagreement with the derivation's prediction: the derivation
      is wrong somewhere nobody has read; both are recorded and the
      obligation is unresolved, not silently kept.
  confounders:
    - the recalled Kloosterman/Freiman forms are unextracted; the proof
      note must not silently rely on the exact constants
    - >-
      The phrase PGL_2-closed family admits degenerate readings (the
      family of ALL sets is closed and level-varying); the definition
      must exclude trivial closures or the theorem is vacuous -- the
      proof note's first obligation
    - concentration-vs-structure is a two-way street with quantitative
      losses at both ends; the toy run checks the composed claim, not
      the folklore
  interpretation_limits:
    - >-
      A proven obstruction closes ONLY the set-statistic lane below the
      flat level; it licenses no claim about non-set statistics, and
      the escape hatch is exactly where IDEA-20260921-1ec106 and the
      partition idea live.
    - >-
      Resource check (inventor protocol): the obstruction is the
      HYPOTHESIS of the escape-hatch search -- non-set statistics
      become the design target BECAUSE sets are obstructed; the
      measurement is an asset to that lane, not a dead end.
  heuristic_assumptions:
    -
      id: H1
      statement: >-
        NONE above derivation level in the theorem itself; the toy
        verification inherits the census's HEUR-1 ladder-extrapolation
        assumption only for its own readings.
      rigorous_support: the census's validated guards.
      validation_plan: >-
        The proof note's extraction obligations (Kloosterman, Freiman
        forms) are the validation for the theorem; the harness's
        existing checks for the toy run.
  target_complexity:
    time_exponent: >-
      The proof note is a derivation task; the toy verification is
      census-harness cost (O~(p) per cell, minutes). No attack
      exponent.
    memory_exponent: O(p) words, within cap.
    best_known: the flat level 1/2 as the obstruction's boundary.
    hidden_overhead: >-
      The recalled citations' extraction cost, stated as the proof
      note's first obligation.
    tradeoff_note: not applicable (no algorithm proposed).
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
