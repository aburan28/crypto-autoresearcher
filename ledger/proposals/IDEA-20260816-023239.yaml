idea:
  id: IDEA-20260816-023239
  question_id: RQ-MCE-e65b3c
  added: '2026-08-16'
  title: 'Stop reporting the square-code dimension defect as a difference of means and measure it
    as a per-key decision: build the full empirical distribution of the defect over hundreds of toy
    Goppa keys and matched random codes at identical length and dimension, and report the ROC curve,
    the equal-error rate and the overlap region instead of a gap between averages.'
  class: measurement
  claim: '(A) The square-code (Schur square) dimension defect D(C) = min(n, k(k+1)/2) - dim(C*C) is
    a per-key integer, not a population mean, and its usefulness as an instrument is entirely determined
    by the OVERLAP of its distribution under two families at the same (n, k). A reported gap between
    averages is compatible with an equal-error rate near one half, which is the same as no instrument
    at all. (B) On the toy fixture the ground truth is known by construction, so the full decision-theoretic
    characterisation is directly computable: sample 200 independent Goppa keys and 200 matched random
    binary codes per cell, compute D for each, and report the complete empirical distributions, the
    ROC curve, the area under it, the equal-error rate, and the exact count of overlapping values.
    A third arm of 200 random alternant codes with a uniform random multiplier at the same (n, k)
    is run identically, because a statistic that separates Goppa from random binary but not from random
    alternant is measuring alternant-ness, and that distinction is exactly the axis RQ-MCE-3f7c02''s
    corrected boundary turns on -- family, not rate. (C) NOT CLAIMED: this is not a distinguisher
    against Classic McEliece, not an attack, not a key recovery, and not a security consequence. Toy
    cells at m <= 6 are necessarily high-rate because k = n - mt and n <= 64, and high rate is precisely
    the regime where structural anomalies are easiest to see; that confound is fatal to any transfer
    claim and is stated here rather than buried. No number measured under this proposal may be quoted
    about any deployed parameter set. (D) The negative outcome is fully usable: if the three arms
    overlap substantially at every toy cell, the measurement establishes that this program''s toy
    scale cannot support decision-theoretic distinguisher claims at all, which retires an entire class
    of proposals cheaply and with a number attached.'
  mechanism: 'STAGE 1: consume the certified fixture from proposal 1 of this set; without it there
    is no Goppa arm and the whole measurement is vacuous, so the dependency is declared rather than
    assumed away. STAGE 2: implement the Schur product over GF(2). For a code with generator G of
    dimension k, form all k(k+1)/2 componentwise products of pairs of basis rows (including squares,
    which over GF(2) are the rows themselves), stack them, and row-reduce to get dim(C*C). At k <=
    40 that is at most 820 rows of length <= 64 held as Python ints, so elimination is trivial. STAGE
    3: build three arms at matched (n, k): Goppa keys from independent (L, g) draws; random binary
    codes from rank-rejected random parity checks; random alternant codes from a uniform random nonzero
    multiplier vector y and the same support, giving the alternant code with parity entries y_j a_j^i,
    trace-expanded identically. Matching on (n, k) is enforced after ranks are measured, and any arm
    whose realised k differs is resampled, because comparing at different dimensions would trivially
    separate. STAGE 4: compute D for every sample and store the raw per-sample values, never only
    summaries. STAGE 5: derive the full decision characterisation -- empirical CDFs, ROC over every
    integer threshold, AUC by the Mann-Whitney identity, equal-error rate, and the count of values
    attained by both arms. STAGE 6: repeat for every cell and report per cell, refusing to pool across
    cells, since (n, k) changes the support of D. STAGE 7: run the same-arm self-null: split the 200
    random codes into two halves of 100 and compute the ROC of one half against the other; a well-behaved
    instrument must give AUC near 0.5 there.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran grep -ril ''schur|square code|square-code'' over ledger/proposals/ and knowledge/
      (hits: IDEA-20260805-9704d9, IDEA-20260805-554b9d, IDEA-20260805-f58517, IDEA-20260807-9ecc6f,
      IDEA-20260808-b9a74c, IDEA-20260808-3d3be9, plus literature notes KN-LIT-d1a453, KN-LIT-1426,
      KN-LIT-2899, KN-LIT-148). Read the titles and classes of all twelve MCE-area proposals. Read
      the objective, what_this_is_not and claim_ceiling blocks of EXP-MCE-3ffdf9, which carries a
      square-code arm. Read RQ-MCE-e65b3c constraint 4 (distinguisher is not break) and RQ-MCE-3f7c02''s
      corrected_boundary. Read docs/inventor-protocol.md section 3.'
    results: IDEA-20260808-3d3be9 is the nearest neighbour and proposes evaluating the square-code
      dimension defect on real standardized public keys with matched random and alternant nulls, reporting
      a measured distance. It reports a DISTANCE, i.e. a difference of central values, and it needs
      standardized public keys this environment cannot obtain. IDEA-20260808-b9a74c proposes using
      the Schur-square defect to refine a support-splitting signature into a per-COORDINATE discriminator
      -- a different object (per coordinate, not per key) and it measures nothing. EXP-MCE-3ffdf9
      has a square-code arm but explicitly frames it as a tabulated observable with a generic reference
      column and states in what_this_is_not that measuring it is not distinguishing; it carries no
      error rate and no distribution. No record in the repository contains a ROC curve, an AUC, or
      an equal-error rate for any code-theoretic statistic.
    verdict: 'UNVERIFIED. The square code as a structural instrument is manifestly a known technique
      -- the repository holds literature notes referencing it -- and nothing here asserts what the
      published treatment of it contains or omits. What is claimed new is narrow and local: the move
      from a reported gap to a reported decision-error rate, the insistence on the third alternant
      arm as the discriminating control rather than as a second null, and the same-arm self-null that
      fixes the measurement''s own resolution. All three parts are standard statistics applied to
      a standard code invariant; the assembly''s only real content is refusing to accept a difference
      of means as evidence of an instrument.'
  object_first_candidate:
    tracked_object: The per-key integer D(C) = min(n, k(k+1)/2) - dim(C*C), carried as a full sample
      vector of 200 values per arm per cell rather than as a summary. The object followed through
      the computation is that empirical distribution and its support, and the derived decision function
      is a threshold on it.
    lossiness: 'Lossy, and the loss is severe and deliberate. An entire code -- a k-dimensional subspace
      of F_2^n, up to 2^40 codewords -- is projected onto one small non-negative integer. Everything
      about the code except the dimension of its Schur square is discarded: its weight distribution,
      its automorphisms, its hull, its coordinates. That is compatible with the operations that matter,
      because the Schur square dimension is invariant under the group the adversary can apply for
      free (invertible row operations preserve the code, hence C*C, hence D) and equivariant under
      column permutation (permuting coordinates permutes C*C and leaves its dimension fixed). So D
      is well-defined on the public object rather than on a presentation of it, which is exactly what
      makes it a candidate instrument.'
    propagation: 'One step of the target operation -- here shortening the public code at one coordinate
      -- acts on D as follows: the shortened code has dimension k-1 or k, its Schur square lives in
      F_2^(n-1), and D changes by an amount determined by whether the removed coordinate carried a
      dependency among the products. There is no general reason for the change to be zero, and measuring
      the step distribution of D under shortening is precisely what proposal 7 of this set does. For
      this proposal the relevant propagation is simpler: under the free adversary group (row operations,
      column permutation), D propagates as a fixed point -- it does not move at all. That invariance
      is the property being exploited, and it is checked directly as a control rather than assumed.'
    survival_score: 'D is informative only while k(k+1)/2 exceeds n, i.e. while the generic Schur
      square fills the ambient space and any deficiency is attributable to structure. At m=4, t=2,
      n=16, k=8: k(k+1)/2 = 36 > 16, so the generic value is 16 and a defect is visible. At m=6, t=4,
      n=64, k=40: 820 > 64, comfortably informative. The structure dissolves in the opposite direction,
      at low rate, where k(k+1)/2 < n and the generic Schur square is already deficient for counting
      reasons that have nothing to do with the family. Every toy cell in this bucket is on the informative
      side -- which is the confound named in the claim, not a convenience.'
  null_object_control: 'The null object is a matched random binary [n, k] code, sampled by drawing
    a uniformly random (n-k)-by-n GF(2) parity check and resampling on rank deficiency, with k taken
    from the Goppa arm''s MEASURED rank so the arms match exactly. Two hundred are drawn per cell
    and run through the identical Schur-square pipeline in the same invocation. For the signal arm
    to mean anything the null must show: (a) D concentrated at or very near zero, since a random code''s
    Schur square should fill; and (b) in the SAME-ARM self-null, where 100 random codes are scored
    against another 100 random codes, an AUC in [0.45, 0.55]. If the self-null is not near one half,
    the pipeline manufactures separation from nothing and every other number in the run is void. A
    third arm of 200 random alternant codes at the same (n, k) is the discriminating control: it is
    not a null but a competing explanation, and if the Goppa arm does not separate from it, the statistic
    is measuring alternant structure and must be reported as such.'
  discriminated_from:
  - 'IDEA-20260808-3d3be9: proposes the same invariant on REAL standardized public keys and reports
    a measured distance between central values. This proposal runs on a toy fixture whose ground truth
    is known, and reports a decision-error rate rather than a distance; a distance without an overlap
    count cannot establish that an instrument exists.'
  - 'IDEA-20260808-b9a74c: uses the Schur-square defect per COORDINATE to refine a support-splitting
    signature. Different object, different granularity, and unmeasured; this proposal is per key and
    its output is a ROC.'
  - 'EXP-MCE-3ffdf9: contains a square-code arm but declares it a tabulated observable with a generic
    reference column and explicitly not a distinguisher. It has no sample size, no distribution and
    no error rate; this proposal supplies exactly those and claims no more distinguishing power than
    the measured AUC.'
  - 'Proposal 7 of this set (shortening-chain persistence): same invariant, different object -- a
    chain of readings and its autocorrelation, not a single per-key value and its threshold.'
  - 'A published high-rate distinguisher: not asserted, not read, not characterised. The instrument
    implemented here is this program''s own construction of D and its claims are bounded by its own
    measured AUC at its own toy cells.'
  assumptions:
  - The certified fixture from proposal 1 of this set exists and passes its validity gate; without
    it there is no Goppa arm and this contract cannot run.
  - Matching on (n, k) after measuring realised rank is sufficient matching; matching on rate alone
    would not be, and matching on more (e.g. weight distribution) would over-condition and destroy
    the comparison.
  - 200 samples per arm per cell gives enough resolution to distinguish AUC 0.95 from AUC 1.0 at the
    reported confidence; the power calculation is part of the contract, not an afterthought.
  - The random alternant sampler produces codes that are genuinely non-Goppa with high probability
    at these sizes; the fraction that accidentally coincide with a Goppa code is small but is not
    zero at tiny n and must be measured, not assumed.
  predictions:
  - metric: AUC of D separating the Goppa arm from the matched random binary arm at m=5, t=3, n=32
    direction: higher
    minimum_effect: 0.9
  - metric: AUC of the same-arm self-null (100 random codes versus 100 random codes)
    direction: different
    minimum_effect: 'forced value: within [0.45, 0.55]. Outside that interval the pipeline manufactures
      separation and the run is void.'
  - metric: AUC of D separating the Goppa arm from the random alternant arm at the same cell
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a value. This is the number the proposal exists
      to learn: if it is near 0.5 the statistic measures alternant-ness, if it is high the statistic
      sees something Goppa-specific, and pre-committing either would be pretending to know the answer.'
  - metric: count of integer values of D attained by both the Goppa and the random binary arm at any
      cell
    direction: lower
    minimum_effect: 0
  minimal_test:
    design: 'One cell suffices to decide whether the measurement is worth scaling: m=4, t=2, n=16,
      k=8, where k(k+1)/2 = 36 exceeds n = 16 so the generic Schur square fills. Draw 200 independent
      Goppa keys with distinct (L, g) seeds, 200 matched random [16,8] codes, and 200 random alternant
      codes with the same support and uniform random multipliers. For each of the 600 codes form the
      36 pairwise componentwise products of the generator rows, row-reduce over GF(2), and record
      dim(C*C) as a small integer. Emit three raw sample vectors, not summaries. Compute the three
      pairwise ROCs and the same-arm self-null. Cost is a few minutes on one core with no dependency.
      The discrimination: if the Goppa and random binary distributions do not separate cleanly at
      the highest-rate, most favourable cell available, no larger cell will help and the whole distinguisher
      lane at toy scale is closed with a measured number rather than an opinion.'
    controls:
    - Matched random binary [n,k] arm at the Goppa arm's measured k, drawn in the same invocation.
    - 'Same-arm self-null: 100 random codes scored against 100 further random codes, AUC required
      near 0.5.'
    - Random alternant arm at the same (n,k) as the discriminating competing explanation.
    - 'Invariance control: apply a random invertible row operation and a random column permutation
      to each Goppa key and recompute D, which must be unchanged; any change is an implementation
      bug.'
    - 'Generic-value control: compute min(n, k(k+1)/2) explicitly per cell and report it, so that
      a defect is always read against the ceiling that defines it.'
    required_metrics:
    - raw per-sample D values for all three arms
    - empirical CDF per arm per cell
    - ROC and AUC for each arm pair
    - equal-error rate
    - count of D values attained by both arms
    - same-arm self-null AUC
    - realised k per sample and the resample count enforcing the match
  falsification_conditions:
  - 'Same-arm self-null AUC outside [0.45, 0.55] voids the run: the pipeline separates identical populations.'
  - D changing under a random row operation or column permutation falsifies the implementation.
  - Goppa-versus-random-binary AUC below 0.9 at the highest-rate cell closes the toy distinguisher
    lane with a measured number.
  - Complete overlap of the Goppa and random alternant distributions establishes that D measures alternant
    structure, and any Goppa-specific reading of it is thereby refuted.
  - A measured generic value min(n, k(k+1)/2) not attained by the random binary arm's mode indicates
    the arms are not matched and the comparison is invalid.
  confounders:
  - Toy cells are unavoidably high-rate because k = n - mt with n <= 64, and high rate is the regime
    most favourable to structural anomalies; this alone forbids any transfer reading.
  - Small n makes the support of D small, so ties are common and the ROC is coarse; the count of shared
    values is reported precisely to expose this.
  - The random alternant sampler could accidentally produce Goppa codes at tiny parameters, contaminating
    the discriminating arm.
  - Realised rank variation across arms, if not enforced by resampling, would separate the arms for
    reasons of dimension rather than structure.
  - 'Dependence on the fixture from proposal 1: a construction bug there would appear here as a spectacular
    and entirely spurious separation.'
  interpretation_limits:
  - An AUC measured at n <= 64 and high rate says nothing about any deployed parameter set and must
    never be quoted as a distinguisher against one.
  - A high AUC establishes a measurement instrument, not a key recovery; RQ-MCE-e65b3c constraint
    4 forbids promoting one to the other and this proposal endorses that.
  - 'Per-cell results may not be pooled: the support of D depends on (n, k) and pooling would create
    an artefact.'
  - A null-like result closes the toy lane for this statistic only, and says nothing about other statistics.
  target_complexity:
    time_exponent: No attack exponent is claimed. Computing D costs O(k^2 n) bit operations per code
      plus elimination, which is negligible at these sizes; no adversary is constructed and no problem
      is solved.
    memory_exponent: No attack memory exponent is claimed. Peak memory is k(k+1)/2 rows of n bits
      per code, at most 820 * 64 bits.
    best_known: The incumbent for structural detection on this family is the published high-rate distinguisher
      line, which this program has recorded but not read and about which it asserts nothing. Within
      this repository the incumbent is EXP-MCE-3ffdf9's tabulated square-code observable, which carries
      no sample size and no error rate.
    hidden_overhead: 'Hidden in the sampling, not the arithmetic: enforcing an exact (n, k) match
      across three arms requires resampling, and the resample rate is itself an unreported cost in
      most such comparisons. Hidden in the human cost: the temptation to pool cells to get a nicer
      AUC, which the contract forbids explicitly because the support of D changes with (n, k).'
  dominated_by: 'n/a (no result claimed) as an attack; as a measurement it is dominated by any measurement
    of the same invariant at larger n, which this environment cannot perform. The Pareto check across
    time, memory and data was made in the only applicable sense: no adversary is constructed, so no
    frontier row exists to compare against. Stating a dominating attack here would be a fabrication.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The quantitative delta is: zero
    measured decision-error rates for any code-theoretic statistic in this repository before, one
    full ROC family with equal-error rates and overlap counts across up to nine toy cells after, including
    a same-arm self-null that fixes the measurement''s resolution.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'P(the Schur-square pipeline is implemented correctly and passes the invariance
    control) = 0.85; the arithmetic is easy and the row-operation control catches most bugs. P(the
    Goppa arm separates from matched random binary with AUC >= 0.9 at the highest-rate cell) = 0.7;
    the generic Schur square should fill and a structured code''s should not, but at n=16 the integers
    involved are small and ties may blunt the ROC. P(the Goppa arm separates from the random ALTERNANT
    arm at all) = 0.3, and this is the interesting number: the honest expectation is that the statistic
    largely measures alternant structure, which would make the negative outcome the informative one.
    P(the same-arm self-null lands in [0.45, 0.55]) = 0.9. P(the whole contract can run at all) =
    the probability that proposal 1 delivers a fixture, which is the binding dependency.'
