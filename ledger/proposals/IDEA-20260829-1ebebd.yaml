  assumptions:
    - >-
      The DEP slope law is stated for module-BKZ on module lattices over the
      ring of integers of K. It is assumed to apply to the ML-KEM primal lattice
      viewed as a module over O_K, and to the tensored lattice viewed as a
      module over O_K tensor O_F. The second application is the weaker one and
      is an explicit proof obligation, not an assumption to be waved through.
    - >-
      The auxiliary field F is chosen with disc(F) coprime to 2, so that
      O_(K.F) = O_K tensor_Z O_F and the compositum discriminant formula
      applies. Fields ramified at 2 require a separate, strictly worse,
      accounting and are excluded from the primary claim.
    - >-
      Root-Hermite-factor bookkeeping uses the standard 2016 primal-uSVP
      estimate and the GSA. The proposal does NOT assume these are accurate
      predictors of concrete attack cost; it assumes only that they are applied
      identically to the baseline and to every tensored variant, so that the
      comparison is matched.
    - >-
      Q(zeta_512) has degree 256 over Q and rho_K = 256 exactly. This is
      arithmetic, recomputed this session, not an assumption.

  proof_search_map:
    bottleneck: >-
      The single step whose removal would change the theorem is the conversion
      of a smaller root-discriminant ratio rho/d into a smaller SVP-oracle
      dimension WITHOUT paying for the rank inflation that realizing that ratio
      requires. Every other step (the DEP law itself, the compositum
      discriminant formula, the tensor covolume formula) is settled arithmetic.
    baseline_embedding:
      parameter_slice: >-
        F = Q, f = 1, rho_F = 1. The construction must reduce EXACTLY to
        unstructured BKZ on L at blocksize beta, with zero gain and zero loss,
        and the DEP term must be exactly log(rho_K / d) * beta / log beta = 0
        for K = Q(zeta_512). This is the null-object control and it is
        symbolic, not graphical.
      reproduction_check: >-
        Symbolic: substitute f = 1 into every formula in the derivation and
        check that beta_mod = beta identically and that the Hermite quality
        ratio multiplier sqrt(rho_F / f) equals 1. A frozen fixture records the
        substituted expressions.
    observation_collision:
      observable: >-
        The scalar rho_K / d (equivalently log(|Delta_K| / d^d) / d), which is
        the only field-dependent quantity the DEP law consumes.
      distinct_preimage_search: >-
        The observable is deliberately many-to-one and the collision is the
        point of the audit. Q(zeta_512) (d = 256, rho = 256) and Q(zeta_8)
        (d = 4, rho = 4) have the SAME observable value 1 but very different
        residual penalties d - 1 = 255 versus 3, so the observable alone does
        not carry the conclusion and the residual term must be tracked
        separately. This is a genuine identifiability failure of the
        first-order law and it is why claim (C) must quote the residual, not
        just the first-order term. A second collision to search for: two fields
        with equal rho_F / f but different Galois structure over Q - if the
        derived criterion separates them, the criterion is smuggling in
        structure the DEP law does not contain, which is a falsifier of the
        derivation.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The lattice L tensor_Z O_F with multiplier order O_K tensor O_F, in
          which the hypothesis "the base field has small root discriminant"
          becomes an exact arithmetic condition rho_F < f rather than a
          qualitative structural wish.
        predicted_gain: >-
          First-order DEP gain of log(f / rho_F) * beta / log beta blocksize
          units, up to about 96 units at beta = 623 for Martinet-type F, which
          would be a 2^28 classical core-SVP speedup - offset, per the
          prediction, by a strictly larger loss.
      - transform: boundary_lift
        proposed_object: >-
          The subfield tower of Q(zeta_512) as an enlarged certificate family:
          instead of proving module-BKZ fails at the top field, prove it fails
          at every rung, with a strict inward statement (rho/d >= 1 everywhere,
          equality only on cyclotomic rungs).
        predicted_gain: >-
          Converts DEP's single-field observation into a closure over an entire
          lattice of base orders at zero compute cost.
    quantifier_order: >-
      The claim to be decided is: EXISTS a number field F (degree f, disc
      coprime to 2) SUCH THAT FOR ALL ML-KEM parameter sets in {512, 768, 1024}
      and for the published attack blocksize beta of that set, the module-BKZ
      SVP-oracle dimension on L tensor O_F over O_K tensor O_F is strictly less
      than beta. The predicted answer is that no such F exists. Note the
      quantifier order matters and is easy to get wrong: F is NOT allowed to
      depend on the instance (it may depend on the parameter set, which is
      public), and beta is fixed by the parameter set, not chosen to make the
      inequality true. A witness F that depends on the public key would be a
      different and weaker claim and must be labeled as such.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is a statement about the
        SVP-ORACLE DIMENSION required by module-BKZ under the DEP slope law and
        the GSA. It cannot certify anything about the cost of the SVP oracle
        itself, about non-BKZ reduction strategies, about attacks that do not
        proceed by basis reduction at all, or about the accuracy of the GSA at
        ML-KEM parameters. A negative outcome closes base-order arbitrage FOR
        MODULE-BKZ UNDER THE DEP LAW and nothing wider.
    nearby_object_control: >-
      Apply the identical accounting to a non-power-of-two cyclotomic ring where
      DEP report a genuine gain - the natural nearby object is a scheme over
      Q(zeta_3^j) or Q(zeta_p) of comparable degree. If the derived criterion
      also says "no gain" there, the criterion contradicts DEP's own published
      conclusion and the derivation is wrong. This control is what separates a
      real accounting from an accounting that always returns "no".
    proof_obligations:
      - claim: >-
          covol(L tensor_Z O_F) = covol(L)^f * |Delta_F|^(D/2) and
          ||v tensor 1|| = ||v|| sqrt(f) in the canonical embedding, hence the
          Hermite quality ratio vol^(1/dim)/||target|| is multiplied by exactly
          sqrt(rho_F / f).
        responsibility: size
      - claim: >-
          rho_(K.F) = rho_K * rho_F when disc(K) and disc(F) are coprime, hence
          rho_(K.F) / (d f) = rho_F / f for power-of-two cyclotomic K.
        responsibility: size
      - claim: >-
          The unstructured blocksize required on L tensor O_F to recover the
          tensored target is beta' = c(f) * beta with c(f) to be derived; the
          rough step c(f) ~ f used in the prediction is an obligation, not a
          result, and its failure is the proposal's live positive branch.
        responsibility: correctness
      - claim: >-
          Net gain holds if and only if f / rho_F > (f beta)^((f-1)/f), and this
          fails for every number field F at every ML-KEM blocksize, with minimum
          deficit at f = 2.
        responsibility: strictness
      - claim: >-
          Every subfield K' of Q(zeta_512) satisfies rho_(K') >= d', with
          equality exactly on the cyclotomic rungs; hence descent never yields a
          first-order gain.
        responsibility: baseline
      - claim: >-
          The f = 1 slice reproduces unstructured BKZ identically.
        responsibility: interface

  predictions:
    - metric: >-
        first-order DEP term log(rho_K'/d') for every subfield K' of
        Q(zeta_512), evaluated exactly
      direction: higher
      minimum_effect: >-
        Greater than or equal to 0 for every one of the subfields, with the real
        subfields Q(zeta_2^m)^+ strictly positive at log 2 - 2^(2-m) log 2,
        i.e. at least 0.60 nats for m >= 4, equivalently a loss of at least 56
        blocksize units at beta = 623.
    - metric: >-
        net module-BKZ SVP-oracle dimension beta_mod on L tensor O_F, minimized
        over a table of minimal-root-discriminant fields F of degree
        f in {2,...,64} plus Martinet-tower entries
      direction: higher
      minimum_effect: >-
        beta_mod / beta >= 1.5 for every F in the table; predicted best case is
        f = 2 with F = Q(sqrt -3) giving beta_mod / beta about 1.94, i.e. a
        SLOWDOWN of at least 2^(0.292 * 0.5 * 623) = 2^91, not a speedup.
    - metric: >-
        the ratio (left-hand side) / (right-hand side) of the decision criterion
        f / rho_F > (f beta)^((f-1)/f), minimized over the same table
      direction: lower
      minimum_effect: >-
        Below 1 for every F, with the maximum over the table at most 1/25; a
        value above 1 for any single F falsifies the closure and opens the lane.
    - metric: >-
        residual (non-first-order) module-BKZ blocksize penalty at the top
        field, d - 1
      direction: higher
      minimum_effect: >-
        Exactly 255 for Q(zeta_512) if DEP's asymptotic residual is taken at
        face value; this alone is a 2^74.5 core-SVP slowdown and is a
        sufficient closure of the descent direction even if the first-order
        analysis were wrong.

  minimal_test:
    design: >-
      Pure symbolic and numeric derivation, zero lattice compute, executable in
      a single short session. Step 1 - enumerate the complete subfield lattice
      of Q(zeta_512) (Galois group Z/2 x Z/128, so the subfields are indexed by
      subgroups) and tabulate (d', |Delta_K'|, rho_K', rho_K'/d', residual
      d'-1) for every rung, using the two cyclotomic discriminant formulas and
      cross-checking each entry against an independent computation of the
      discriminant in Pari/GP or Sage. Step 2 - carry out the tensor-ascent
      derivation in full: covolume of L tensor O_F, norm of v tensor 1, the
      resulting Hermite quality multiplier, the required unstructured blocksize
      beta' on the tensored instance under the 2016 primal-uSVP estimate, and
      the DEP-corrected module-BKZ oracle dimension. Do NOT assume beta' ~ f
      beta; derive c(f). Step 3 - evaluate the resulting criterion over a table
      of minimal-root-discriminant fields F of each degree f in {2,...,64},
      taken from LMFDB's minimum-discriminant tables, plus the best known
      asymptotic Martinet-tower root discriminant, at the exact beta of each
      ML-KEM parameter set. Step 4 - run the two controls below. Step 5 -
      report the criterion's value for every F, not just the best one.
    controls:
      - >-
        NULL OBJECT (f = 1, F = Q). The whole pipeline must return beta_mod =
        beta exactly and gain 0. Any nonzero output here is an accounting bug
        and invalidates the run.
      - >-
        NEARBY OBJECT WHERE THE ANSWER IS KNOWN POSITIVE. Apply the identical
        pipeline to a hypothetical module-lattice scheme over a non-power-of-two
        cyclotomic field of comparable degree, where DEP report a genuine
        sublinear gain. The pipeline must reproduce a gain there. A pipeline
        that returns "no gain" for every input has not tested anything.
      - >-
        SIGN CONTROL. Apply the pipeline to a field F with rho_F > f
        deliberately (an easy choice: any real quadratic field, rho = sqrt(8) >
        2). The predicted output is a strictly larger loss than the f = 1 case,
        monotone in log(rho_F / f). Non-monotonicity indicates a derivation
        error.
      - >-
        MATCHED ACCOUNTING. Baseline and every variant must use the same
        primal-uSVP estimate, the same GSA, the same q, sigma, k, and the same
        sample count. Any variant scored under a different estimator is void.
    required_metrics:
      - rho_K'/d' and residual d'-1 for every subfield of Q(zeta_512)
      - derived c(f) with its derivation steps recorded symbolically
      - the criterion value f/rho_F divided by (f beta)^((f-1)/f) for every F in the table
      - beta_mod/beta for every F, at each of ML-KEM-512, -768, -1024
      - the f = 1 null-control output (must be exactly 1.0)
      - the non-power-of-two positive control output (must exceed 1.0 in gain)

  falsification_conditions:
    - >-
      A single number field F, with disc coprime to 2 and degree f >= 2, for
      which the fully derived criterion yields beta_mod < beta at any ML-KEM
      parameter set, falsifies claim (D)/(E) and opens the base-order lane.
    - >-
      Any subfield K' of Q(zeta_512) with rho_K' < d' falsifies claim (C). This
      is a pure arithmetic falsifier and is decided by a discriminant
      computation.
    - >-
      If the careful derivation of c(f) yields c(f) = o(f) - in particular if
      the tensored instance's uSVP gap improves rather than degrades - then the
      predicted linear-versus-logarithmic mismatch that carries the closure does
      not hold, and the closure argument is void even if the numeric table still
      shows no gain.
    - >-
      If the null control (f = 1) returns anything other than beta_mod = beta,
      or the non-power-of-two positive control fails to reproduce a gain, the
      instrument is broken and NO conclusion of either sign may be drawn from
      the run.
    - >-
      If DEP's law is found (on reading the paper body, which was not read this
      session) to be stated only for FREE modules, or only for rank tending to
      infinity, or with a hypothesis ML-KEM's rank-(k+1) module violates, the
      entire pricing is inapplicable and both the closure and its positive
      branch are withdrawn.

  confounders:
    - >-
      Residual versus first-order confusion. DEP's d - 1 + o(1) residual is a
      SEPARATE term from the first-order log(rho/d) term. A table that reports
      only the first-order term will score the whole subfield tower as
      "neutral" and miss that every rung is strictly worse than Z. Both terms
      must be carried.
    - >-
      Asymptotic regime. The DEP law is asymptotic in beta. ML-KEM has
      beta/d about 2.4, so the module-BKZ blocks have rank 2 or 3 and the
      asymptotic in beta is not obviously reached. This confounder is severe
      enough that it is proposed separately as IDEA-20260829-353361; results
      here inherit that record's caveat and must not be reported as concrete
      predictions until it is resolved.
    - >-
      Choice of primal-uSVP estimator. The 2016 estimate, the leaky-LWE
      estimate, and the MATZOV refinement give different beta for the same
      instance. The criterion involves beta only inside a logarithm, so the
      conclusion should be robust, but the robustness must be demonstrated by
      re-running the table at the extreme beta values rather than assumed.
    - >-
      Normalization of the canonical embedding. Complex places may be counted
      once with weight 2 or twice with weight 1. The factor sqrt(f) in
      ||v tensor 1|| and the |Delta_F|^(D/2) in the covolume must use the SAME
      convention. A mismatch produces a spurious gain or loss of exactly
      2^(D/2) and would be the single most likely way to manufacture a false
      positive here.
    - >-
      Non-maximal orders. O_K tensor O_F is the maximal order only when the
      discriminants are coprime. Using a non-maximal order changes
      |Delta| upward and can only make the accounting worse, but it changes it,
      and a table that silently mixes orders is not matched.

  interpretation_limits:
    - >-
      Only the ABSTRACTS of the DEP paper were read this session, via WebFetch
      of the eprint and arXiv landing pages. The paper body may already contain
      the ML-KEM instantiation, the subfield-tower enumeration, or the
      tensor-ascent argument, in which case this proposal reduces to
      reproducing published work and its novelty status drops to known. Reading
      the body is a prerequisite to any claim of priority and costs one fetch.
    - >-
      A negative outcome closes base-order arbitrage FOR MODULE-BKZ UNDER THE
      DEP SLOPE LAW ONLY. It says nothing about non-BKZ algebraic reduction,
      about sieving that exploits the ring automorphisms inside a block, about
      the class-group route (IDEA-20260829-f21416), or about any attack that
      does not proceed by basis reduction.
    - >-
      No claim here is an impossibility claim about ML-KEM. The scope is the
      exact parameter sets, the exact base orders tabulated, the exact
      estimator, and the DEP law as stated.
    - >-
      The corollary about attacker-visible constant factors - that partial
      descent to a small subfield such as Q(zeta_8) costs only d'-1 = 3
      blocksize units while permitting an automorphism-quotient sieve saving of
      about |mu_8| = 8 - is a CONSTANT-FACTOR observation of a few bits, is not
      target-class under docs/target-result-profile.md A1, and is recorded here
      as a by-product rather than promoted.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Algebraic GSA transfer.) For the ML-KEM primal lattice L over
        O_K with K = Q(zeta_512), and for L tensor_Z O_F over O_K tensor O_F
        with F of degree f and disc(F) coprime to 2, the log-profile produced by
        module-BKZ at SVP-oracle dimension beta_mod is, up to an additive
        o(beta/log beta) per coordinate, the straight line predicted by DEP's
        algebraic Geometric Series Assumption with slope determined by
        rho / (degree). Formally: for all f <= 64 and all beta in
        [300, 1200], the empirical mean log-profile slope deviates from the DEP
        prediction by at most 5 percent in relative terms.
      rigorous_support: >-
        Pairs the RIGOROUS content of the DEP result - the worst-case module-LLL
        and module-block-reduction guarantees of Lee-Pellet-Mary-Stehle-Wallet
        (ASIACRYPT 2019) and Mukherjee-Stephens-Davidowitz (CRYPTO 2020), which
        DEP cite as establishing existence of the algorithms - with the
        classical distribution statement it imitates, namely the ordinary
        Geometric Series Assumption for unstructured BKZ, whose average-case
        accuracy is the standard basis of every published lattice estimate. The
        heuristic asks only that the algebraic profile behaves like the
        unstructured profile of a random lattice of the same covolume and
        dimension, with the discriminant entering as DEP derive.
      validation_plan: >-
        Sample at reachable scale via the field, not the parameter set: run
        DEP's released module-BKZ implementation over cyclotomic fields of
        degree d in {4, 8, 16, 32} at module ranks r in {2, 3, 4, 5}, on random
        q-ary module lattices with q = 3329 and CBD-like planted secrets, 200
        instances per (d, r) cell with recorded seeds. Compare the empirical
        mean log-profile against the DEP algebraic-GSA prediction (the
        comparison distribution), reporting the slope residual and its
        bootstrap confidence interval. Tail check: the 5 percent of instances
        with the flattest and steepest observed profiles must still lie within
        the DEP prediction's stated o(beta/log beta) band, since it is the tail
        instances, not the mean, that a best-of-many attacker would use.
        Transfer assumption, stated explicitly: results at d <= 32 are
        extrapolated to d = 256 by fitting the residual as a function of
        beta/d and evaluating at beta/d = 2.4; this extrapolation is the
        weakest link and is exactly what IDEA-20260829-353361 is for.
    - id: H2
      statement: >-
        (Tensor-lattice genericity.) For a random q-ary module lattice L of the
        ML-KEM shape and a number field F of degree f with disc(F) coprime to 2,
        the lattice L tensor_Z O_F has no short vectors other than those of the
        form (short vector of L) tensor (small element of O_F); formally,
        lambda_1(L tensor O_F) = lambda_1(L) * lambda_1(O_F) * (1 + o(1)) and no
        unplanted vector of norm below GH(L tensor O_F) exists, with probability
        1 - o(1) over L.
      rigorous_support: >-
        Imitates the classical fact that the minimum of a tensor product of
        lattices is at most the product of the minima, together with the
        Gaussian heuristic for the number of lattice points of a random lattice
        in a ball - the same random-lattice distribution statement that
        underwrites every primal-attack estimate. The rigorous half is the
        upper bound lambda_1(L tensor M) <= lambda_1(L) lambda_1(M); the
        heuristic half is that no strictly shorter vector appears, which is
        known to FAIL for adversarially chosen L and M and is therefore the
        assumption most likely to break.
      validation_plan: >-
        Sample at small scale where lambda_1 is computable exactly: L a random
        q-ary lattice of Z-rank 40-60 with q = 3329 and a planted CBD secret,
        F ranging over the minimal-discriminant fields of degree 2 and 3, so
        that L tensor O_F has Z-rank 80-180. Enumerate or sieve for lambda_1
        exactly (rank <= 100) or with a fixed high-quality budget above that,
        1000 instances per cell. Compare the empirical distribution of
        lambda_1(L tensor O_F) / (lambda_1(L) lambda_1(O_F)) against the
        prediction 1 + o(1), and separately compare the count of lattice points
        below GH against the Gaussian-heuristic prediction. Tail check: the
        single smallest observed ratio over all instances is the statistic that
        matters, because a rare tensor-induced short vector would be an ATTACK,
        not a nuisance - if any instance yields a ratio materially below 1, that
        instance is itself the positive result and must be reported as such.
        Transfer assumption: rank 40-180 results are extrapolated to ML-KEM's
        rank 1536-3584 with no claim beyond the tested range.

  target_complexity:
    time_exponent: >-
      Classical core-SVP 2^(0.292 * beta_mod) with beta_mod = f * c * beta *
      (1 - log(f/rho_F)/log(f beta)). Predicted outcome beta_mod/beta >= 1.94,
      i.e. a SLOWDOWN of at least 2^91 at ML-KEM-768, and therefore no claimed
      improvement. Live positive branch, if the derivation of c(f) overturns
      the rough step: beta_mod = beta - Theta(beta/log beta), up to about 96
      blocksize units at beta = 623, giving 2^(0.292 * 96) = 2^28 classical and
      2^(0.265 * 96) = 2^25 quantum speedup.
    memory_exponent: >-
      2^(0.2075 * beta_mod) under the same accounting, i.e. memory moves with
      the blocksize in lockstep. Under the positive branch, 2^(0.2075 * 96) =
      2^20 memory saving alongside the time saving; under the predicted branch,
      a 2^65 memory INCREASE. Memory is not traded here - both exponents move
      the same way, which is the honest and unusual feature of a blocksize-level
      result.
    best_known: >-
      ML-KEM-768 primal/dual lattice attack, classical core-SVP about
      2^(0.292 * 623) = 2^182 time and 2^(0.2075 * 623) = 2^129 memory
      (blocksize 623 recalled from the Kyber round-3 submission, to be
      recomputed by the lattice estimator in the test rather than trusted).
      ML-KEM-512 about beta 406, ML-KEM-1024 about beta 873.
    hidden_overhead: >-
      Two superpolynomial-scale honesty items. First, DEP's o(beta/log beta)
      is not characterized in the abstract that was read, and at
      beta/d about 2.4 the "asymptotic" terms may dominate the ones being
      compared - the entire quantitative content could be inside the o().
      Second, module-BKZ's SVP oracle acts on blocks whose dimension is a
      MULTIPLE of d = 256, so the granularity penalty d - 1 = 255 is not a
      lower-order correction at these parameters; it is by far the largest term
      in the whole accounting and it points the wrong way.
    tradeoff_note: >-
      No time-memory tradeoff is introduced by this proposal: it moves the
      blocksize, and every point on the existing sieve/enumeration tradeoff
      curve moves with it. Parallelization position is inherited unchanged from
      whichever SVP oracle is plugged in. This is a deliberate design feature -
      a blocksize-level result cascades to every cost model rather than
      competing with one, so if the positive branch ever fires it applies
      simultaneously to the classical sieve, the quantum sieve of
      IDEA-20260828-411711, and the memory-charged model of
      IDEA-20260805-cdc87d without re-derivation.

  dominated_by: >-
    Dominated on every axis by the standard ML-KEM-768 primal lattice attack at
    core-SVP 2^182 time / 2^129 memory / 768 samples, under the predicted
    outcome. Checked against the frontier rows this corpus tracks: classical
    sieve core-SVP (2^0.292 beta), classical enumeration (superexponential but
    polynomial memory, relevant only under the memory-charged model of
    IDEA-20260805-cdc87d), quantum sieve at 2^0.2653 beta and the October-2025
    quantum 3-tuple point at 2^0.2846 d time / 2^0.1887 d memory recorded in
    IDEA-20260828-411711, dual/MATZOV variants, and the algebraic
    rank-reduction lane of IDEA-20260805-e805b6 / IDEA-20260828-e4fee5. This
    proposal beats none of them under its predicted outcome. Under its live
    positive branch it would dominate ALL of them simultaneously by the same
    factor 2^28, because it moves beta rather than the oracle.
  sota_delta: >-
    Predicted: beta_mod/beta >= 1.94, i.e. 0.292 * 623 * 0.94 = +171 bits of
    cost, a strict regression - the deliverable is a closure, not an attack.
    Positive branch: -96 blocksize units, i.e. -28 bits classical, -25 bits
    quantum, -20 bits memory at ML-KEM-768, with proportional effects at 512 and
    1024. No intermediate outcome is expected; the criterion is a strict
    inequality and lands on one side.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
