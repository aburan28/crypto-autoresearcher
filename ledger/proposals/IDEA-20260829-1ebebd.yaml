idea:
  id: IDEA-20260829-1ebebd
  question_id: RQ-MLKEM-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed

  title: >-
    Base-order arbitrage against the Ducas-Engelberts-de Perthuis module-BKZ
    blocksize law: the tracked object is the ORDER acting on the ML-KEM lattice,
    not the lattice; power-of-two cyclotomics sit exactly at the law's neutral
    point rho_K = d, every subfield of Q(zeta_512) is neutral-or-worse, and the
    only remaining move is tensor ascent into a small-root-discriminant field,
    where a single closed-form inequality decides whether the discriminant gain
    can ever outrun the volume it costs

  class: composition

  claim: >-
    (A) THE OBJECT. Fix the ML-KEM primal attack lattice L (Z-rank D). Every
    attack in this corpus tracks a vector, a coordinate, a slot, or a profile.
    This proposal tracks a different thing entirely - the ORDER O with O.L
    contained in L, i.e. the multiplier ring the reduction algorithm is allowed
    to be linear over. The choice of O is a free parameter of the attacker, not
    a property of the scheme, and it is the parameter that the October-2025
    Ducas-Engelberts-de Perthuis (DEP) module-BKZ law prices.
    (B) THE LAW, RETRIEVED VERBATIM. DEP (eprint 2025/1904, arXiv 2510.10540,
    rev. 2026-02) prove that module-BKZ over a number field K of degree d needs
    an SVP oracle of dimension
    "beta + log(|Delta_K| / d^d) * beta / (d log beta) + o(beta / log beta)"
    to reach the same slope as unstructured BKZ at blocksize beta. Writing
    rho_K = |Delta_K|^(1/d) for the root discriminant, log(|Delta_K|/d^d) =
    d * log(rho_K / d), so the oracle dimension is
    beta_mod = beta + log(rho_K / d) * beta / log beta + o(beta / log beta),
    and module-BKZ GAINS exactly when rho_K < d. DEP state that for power-of-two
    cyclotomic fields |Delta_K| = d^d, i.e. rho_K = d exactly, so the
    first-order term VANISHES and the residual is a loss of d - 1 + o(1).
    (C) THE FIRST FALSIFIABLE STATEMENT - THE SUBFIELD TOWER IS CLOSED. ML-KEM's
    ring is Z[zeta_512], d = 256, and rho_K = 256 exactly (arithmetic recomputed
    this session: disc(Q(zeta_2^m)) = 2^(d(m-1)) with d = 2^(m-1), so rho = d).
    The attacker may descend to any subfield. The claim is that EVERY subfield
    of Q(zeta_512) is neutral-or-worse under the DEP law, with no exception:
    the 2-power cyclotomic subfields Q(zeta_2^j) all satisfy rho = d' exactly
    (first-order term 0, residual loss d' - 1), and every maximal real subfield
    Q(zeta_2^m)^+ satisfies disc = 2^((m-1) 2^(m-2) - 1) - verified this session
    against the known value disc(Q(sqrt 2)) = 8 - hence rho^+ / d^+ =
    2^(1 - 2^(2-m)), which is approximately 2 and STRICTLY GREATER THAN 1, a
    first-order LOSS of log(2) * beta / log beta blocksize units (about 65 units
    at beta = 623). Therefore the DEP-optimal base order over the whole subfield
    lattice of Q(zeta_512) is Z itself, i.e. plain unstructured BKZ, and the
    module structure of ML-KEM is a strict liability to module-BKZ at every rung
    of its own tower. This answers Kyber's own question Q8 negatively over the
    entire descent direction, not just at the top field.
    (D) THE SECOND FALSIFIABLE STATEMENT - THE ASCENT DIRECTION AND ITS ONE-LINE
    CRITERION. Descent is closed, so the only remaining move is ASCENT: replace
    L by L tensor_Z O_F for an auxiliary field F of degree f whose discriminant
    is coprime to 2, making the new multiplier order O_K tensor O_F, whose field
    K.F has rho_(K.F) = rho_K * rho_F and degree d * f, so
    rho_(K.F) / (d f) = rho_F / f. Fields with rho_F < f exist at every degree
    f >= 2 (Q(sqrt -3): f = 2, rho = 1.732; the cubic field of discriminant -23:
    rho = 2.844; and Martinet-type towers give rho_F about 92 at arbitrarily
    large f), so the DEP first-order term becomes a genuine GAIN of
    log(f / rho_F) * beta / log beta. The claim is that this gain is
    structurally unable to pay for itself, and that the exact accounting is a
    single inequality. Tensoring multiplies the Z-rank by f and multiplies the
    instance's Hermite quality ratio vol^(1/dim) / ||target|| by exactly
    sqrt(rho_F / f) - the SAME quantity that produced the gain, appearing under
    a square root as a loss (covol(L tensor O_F) = covol(L)^f |Delta_F|^(D/2)
    and ||v tensor 1|| = ||v|| sqrt f in the canonical embedding). The predicted
    decision criterion, to be derived carefully rather than asserted, is
    f / rho_F > (f beta)^((f-1)/f); a net gain exists if and only if it holds.
    (E) WHAT EACH OUTCOME MEANS. If the criterion fails for every number field F
    - the predicted outcome, whose smallest deficit is at f = 2 where
    f / rho_F <= 1.155 against a right-hand side of about 34.6 at beta = 623 -
    then the entire base-order lane closes with a named mechanism: the
    discriminant gain is Theta(beta / log beta) in the blocksize while the price
    of realizing a smaller root discriminant is Theta(f beta), so a SUBLINEAR
    gain is being asked to pay a LINEAR bill, and no choice of F can win. If the
    careful derivation instead shows the dimension-inflation term is smaller
    than the rough beta' ~ f beta step used above, the lane is live and the
    residual is worth up to Theta(beta / log beta) = about 96 blocksize units at
    beta = 623, i.e. a 2^28 classical speedup on ML-KEM-768 with no new
    cryptanalytic primitive at all.

  mechanism: >-
    LOSSY-PROJECTION TEST, APPLIED BEFORE ANY EXPERIMENT. The tracked object is
    the pair (multiplier order O, the O-module structure of L). The projection
    L |-> (O, L-as-O-module) discards the entire geometry of L - all Gram data,
    all successive minima, the target vector, the profile - retaining only which
    ring acts and how. It is therefore massively lossy, not a change of
    coordinates. It is discarded COMPATIBLY with the target's operations,
    because module-BKZ performs only O-linear basis transformations, so the
    retained structure propagates deterministically through every step of the
    computation: an O-module basis stays an O-module basis. This is precisely
    the property that makes DEP's slope law well-posed and it is what
    distinguishes this object from a coordinate change. Contrast the failing
    case: tracking the Hermitian Gram matrix h(x, y) over R instead of the
    Z-Gram matrix loses NOTHING (the trace form recovers the Z-Gram exactly), so
    that is a change of coordinates and is not a new object.
    WHY THE ARITHMETIC HAS TEETH. The DEP law is monotone in the single scalar
    rho_K / d. Power-of-two cyclotomic fields sit exactly at rho_K / d = 1 - the
    boundary between gain and loss - which is why the first-order term vanishes
    for ML-KEM and why the entire question reduces to whether the attacker can
    move that ratio below 1. Two and only two moves exist. Descent moves inside
    the subfield lattice of Q(zeta_512), where the ratio is 1 (cyclotomic rungs)
    or about 2 (real rungs), so it cannot go below 1; the loss is then purely
    the residual d' - 1 and is minimized at d' = 1. Ascent moves outside, and
    the compositum formula disc(K.F) = disc(K)^f disc(F)^d for coprime
    discriminants makes the new ratio exactly rho_F / f, which CAN go below 1.
    The mechanism of the predicted closure is a conservation-style mismatch, not
    an exact cancellation: rho_F / f enters the DEP gain inside a logarithm
    divided by log beta, and enters the cost through the f-fold rank inflation
    linearly. A logarithm cannot pay a linear bill, and that asymmetry - not any
    property of ML-KEM - is what closes the lane. Stating it as an inequality
    rather than as a verdict is the point: the inequality is checkable in one
    page and evaluable over a complete table of minimal-root-discriminant fields.
    WHY THIS IS NOT A RENAMED KNOWN APPROACH. The corpus's module-structure
    proposals (IDEA-20260805-e805b6, IDEA-20260828-e4fee5) ask whether the
    ML-KEM module can be REDUCED IN RANK to an ideal lattice over a bigger ring,
    an existence question about A. IDEA-20260821-003cb0 prices the
    Albrecht-Deo MLWE-to-RLWE REDUCTION in modulus-to-noise bits. This proposal
    changes neither the rank nor the instance: the lattice is untouched, the
    module rank is untouched, the modulus-to-noise ratio is untouched, and the
    only thing varied is which ring the reduction algorithm is linear over. It
    is priced by a law published after every one of those records was written.

  novelty_status: speculative

