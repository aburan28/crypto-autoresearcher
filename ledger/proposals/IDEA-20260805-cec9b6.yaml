    - >-
      NOT READ, relayed via the session scout brief and used for nothing:
      ePrint 2025/1895 (differential fault attacks on MQOM), ePrint 2026/1506.

  lossy_projection_identifiability_audit:
    projection: >-
      Full signing transcript and key material --> the triple (number of
      lambda-bit secrets published, number of distinct domain separators
      protecting them, number of signatures over which a separator repeats).
    what_is_discarded: >-
      The MQ instance, the witness, the PIOP, the field arithmetic, the
      commitments' contents, and the actual bit values of every seed. Only
      counts and separator multiplicities are retained.
    why_genuinely_lossy: >-
      Irreversibly: from (132, 1, 1) nothing about the signature is
      recoverable, and the fibre contains every MPCitH scheme with those counts.
    why_compatible_with_the_operations: >-
      Compatible because the operations that matter for this object are
      counting and birthday arithmetic, both of which read only the retained
      coordinates, and because domain separation is exactly a statement about
      separator multiplicity.
    is_it_only_a_change_of_coordinates: >-
      NO -- counts cannot reconstruct a transcript. THE FAILURE MODE CHECKED FOR
      IS THE MIRROR ONE, constancy: does the triple vary across the eighteen
      published instances, or is it the same everywhere? IT VARIES, and the
      variation is computable before any work: published node seeds per
      signature are 132 for the short Category I sets, 136 for the fast Category
      I sets, 198 / 216 at Category III and 275 / 288 at Category V, while the
      salt-margin coordinate takes three distinct values (2^0.5, 2^32.5,
      2^64.5). Nonzero comparator spread on both coordinates, checked before the
      proposal was written.

  assumptions:
    - >-
      That salt is drawn uniformly and independently per signature and is
      lambda bits. Read from Algorithm 3 line 4 of the extracted text; stage 0
      re-verifies. If the salt is 2*lambda bits, Forced Value 1 evaporates and
      the proposal loses its cheapest half -- that outcome is explicitly welcome
      and is the fastest available falsification.
    - >-
      That the recalled 2^64 signing limit is the applicable bound. Checked in
      stage 0 against the primary call document, never assumed.
    - >-
      NO ASSUMPTION that a salt collision is exploitable. The record states the
      budget and stops there; the exploitability question is named as open and
      handed forward.

  predictions:
    - metric: salt_bit_length read from the rendered specification
      direction: different
      minimum_effect: >-
        EXACTLY lambda (128 / 192 / 256). Any other value falsifies Forced
        Value 1 as stated and the record is superseded rather than patched.
    - metric: >-
        salt_margin_bits: log2(Q_collision) - log2(Q_allowed) per category,
        where Q_collision = 2^((lambda+1)/2)
      direction: different
      minimum_effect: >-
        EXACTLY 0.5 at Category I, 32.5 at III, 64.5 at V, conditional on the
        stage-0 reading of Q_allowed = 2^64. Derived here in exact arithmetic.
    - metric: >-
        published_node_seeds_per_signature = tau * log2(N), per instance
      direction: different
      minimum_effect: >-
        EXACTLY 132, 136, 198, 216, 275, 288 for the six distinct proof-system
        rows (short/fast at Categories I, III, V). Derived from Table 6.
    - metric: >-
        salt_widening_cost: signature-size increase in bytes if salt is widened
        from lambda to 2*lambda bits
      direction: different
      minimum_effect: >-
        EXACTLY 16 / 24 / 32 bytes at Categories I / III / V, i.e. 0.56 per cent
        of the 2868-byte MQOM2-L1-gf2-short-3r signature. Derived from the
        published size formula; independently checkable against Table 7.
    - metric: >-
        variant_change_list: number of distinct scheme changes required by
        2026/629's two proved variants, each with a derived byte or cycle cost
        or an explicit "cost not derivable without the PDF body"
      direction: higher
      minimum_effect: >-
        AT LEAST 3 changes enumerated, EACH with one of the two markers. A list
        with unmarked entries is incomplete and may not be summed.
    - metric: >-
        source_retrieval: whether the body of ePrint 2026/629 was obtained
      direction: different
      minimum_effect: >-
        REPORTED, NOT PREDICTED. The declared source order is: eprint abstract
        page (already 200), eprint PDF (403 expected), arXiv, author homepages
        (NTT and TII), a conference version, and the pqc-forum archive. A
        recorded failure after exhausting that order is a legitimate outcome and
        caps the deliverable at Forced Values 1, 2 and change (a).

  minimal_test:
    design: >-
      Three stages, cheapest first, the first decisive.
      STAGE 0 (reading, zero compute): re-verify the salt length, Algorithm 3,
      the Davies-Meyer construction, the salt sentence, the deferred-proof
      sentence and the signature-size formula against the rendered PDF; retrieve
      the NIST call document and read the per-key signing limit. IF THE SALT IS
      NOT lambda BITS, OR THE SIGNING LIMIT IS NOT 2^64, STOP AND RESTATE.
      STAGE 1 (arithmetic, zero compute): compute the salt budget, the
      multi-target ledger and the salt-widening cost for all eighteen instances;
      run the NULL arm first.
      STAGE 2 (reading, bounded): attempt the 2026/629 body through the declared
      source order; on success, enumerate the variant changes and price each;
      on failure, record the exhausted order and deliver stages 0-1 only.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, forced value derived before the run, able
        to fail: apply the identical salt-budget computation to schemes whose
        salt does NOT scale with lambda and to a hypothetical MQOM with a
        2*lambda-bit salt. FORCED VALUES: a 2*lambda-bit salt gives margin
        2^64.5 / 2^96.5 / 2^128.5 at the three categories, i.e. the tight cell
        disappears entirely; a fixed 128-bit salt at Category V would give
        margin 2^0.5 there instead. If the computation returns the same margin
        for all three salt policies, it is not reading the salt length, the
        instrument is broken, and nothing may be reported.
      - >-
        POSITIVE CONTROL where the effect MUST appear: MQOM2-L5-gf256-fast has
        tau = 36 and log2 N = 8, the largest published node-seed count (288),
        and MQOM2-L1-gf2-short has the smallest (132). The ledger must return
        those two numbers exactly from Table 6 without being told them. If it
        does not reproduce two hand-computable table entries, no ledger number
        may be reported.
      - >-
        GRADED CONTROL, four interior points, monotonicity reported: sweep the
        salt length s over {64, 96, 128, 160, 192, 256} bits at Category I and
        report the margin log2(2^((s+1)/2)) - 64. Prediction derived before the
        run: the margin is strictly increasing in s with slope exactly 1/2, and
        crosses zero at s = 127. A non-monotone or wrong-slope response
        localises an arithmetic bug rather than leaving "it did not work".
      - >-
        VERDICT-ON-THE-NULL-FIRST: the decision rule ("is the salt budget tight
        at this category?") is executed and committed on the 2*lambda-bit
        hypothetical before the published parameters are read.
      - >-
        ARCHIVE CHECK: no archived measurement of this observable exists in this
        corpus. Recorded as unavailable, not as a passed check.
    required_metrics:
      - verbatim salt line and deferred-proof sentence with page references from the rendered PDF, or recorded failure
      - the retrieved NIST signing limit with its source, or recorded failure
      - the eighteen-instance salt-budget and node-seed ledger
      - the graded salt-length sweep with slope reported
      - the variant change list with every entry marked priced or unpriceable
      - the exhausted source-retrieval order for 2026/629

  falsification_conditions:
    - Salt is not lambda bits. Forced Value 1 is void as stated.
    - The applicable signing limit is not 2^64. The half-bit headline is void and must be restated at the true limit.
    - The positive control failing to reproduce 132 and 288 from Table 6. Nothing may be reported.
    - >-
      The graded sweep not showing slope 1/2. The birthday arithmetic is
      mis-implemented and every number is void.
    - >-
      Reading 2026/629 and finding that its "minor change to salts" is not a
      length change at all but a domain-separation change costing zero bytes. In
      that case change (a) prices at zero, the tweak recommendation collapses to
      a specification edit, and that is a complete and useful result.

  confounders:
    - >-
      SECOND-HAND SOURCE. The entire dependency-loop framing rests on an
      abstract. Stage 2 exists to remove this and the record must not present
      any statement about the loop as established without the body.
    - EXTRACTION FIDELITY of the specification, removed by stage 0 or the audit halts.
    - >-
      BIRTHDAY-TO-ATTACK GAP. A collision budget is not an attack. Conflating
      "salts collide at 2^64.5 signatures" with "MQOM is broken at 2^64.5
      signatures" would be exactly the overclaim this program exists to prevent,
      and the record forbids it explicitly.
    - >-
      DEADLINE PRESSURE. The 2026-08-14 tweak deadline is a reason to work
      quickly and is not a reason to lower the evidence bar. No recommendation
      may be issued from an unpriced change list.

  interpretation_limits:
    - >-
      NO ATTACK IS CLAIMED, NO FORGERY IS CONSTRUCTED, NO KEY IS RECOVERED, AND
      NO SECURITY LEVEL IS DISPUTED. The deliverable is a budget and a cost
      table.
    - >-
      The dependency loop is 2026/629's result, not this program's, and every
      downstream citation must attribute it there.
    - >-
      Nothing here is a QROM statement. 2026/629's variant one is described as
      proved in the quantum random oracle model; MQOM v2.1's own statement is
      ROM plus ICM; this record makes no quantum claim.
    - Scoped to MQOM v2.1. The Round-3 specification does not exist as of this session.

  heuristic_assumptions:
    - id: HEUR-MQOM-GGM-1
      statement: >-
        NONE LOAD-BEARING FOR FORCED VALUES 1-2. The salt budget is a birthday
        computation over a uniform lambda-bit variable and the node-seed counts
        are products of two published integers. Both are proved by evaluation.
      rigorous_support: >-
        E[collisions] = C(Q,2) * 2^(-lambda) for Q uniform independent draws
        from a set of size 2^lambda; elementary and exact.
      validation_plan: >-
        Recompute in-harness with a receipt after stage 0 confirms the salt
        length. Not a distributional claim and not presented as one.
    - id: HEUR-MQOM-GGM-2
      statement: >-
        LOAD-BEARING FOR THE MOTIVATION ONLY: that a same-salt pair of MQOM
        signatures is a security-relevant event rather than a harmless
        coincidence, because the salt keys the Davies-Meyer seed derivation and
        the tree root is correlated with the secret key.
      rigorous_support: >-
        NONE. This is a conjecture about exploitability and it is the weakest
        statement in the record. The specification's own text asserts the
        opposite direction (the salt exists to prevent exactly this), and no
        attack is exhibited here. The honest position is that the specification
        quantifies nothing and the quantity it should have quantified is tight
        at one category.
      validation_plan: >-
        NOT VALIDATED BY THIS PROPOSAL. Named as the forward-guidance question
        handed to whatever succeeds this batch, with the concrete first step:
        determine from the specification whether SeedDerive's domain separation
        within a signature also separates ACROSS signatures with equal salts.
        If it does, the budget question closes and that closure is the result.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED. The quantities are a query budget (2^64.5 signatures
      at Category I) and a byte cost (16 / 24 / 32 bytes for a salt widening).
      Stated plainly because refusing to state it, or dressing a byte count as
      an exponent result, are both forbidden by the target-result profile.
    memory_exponent: n/a.
    best_known: >-
      No published attack on MQOM's GGM tree or salt is known to this record.
      That absence reflects this corpus's coverage and a single abstract, not
      the state of the literature.
    hidden_overhead: >-
      The whole proposal is a hidden-overhead accounting: the cost of a proof,
      in bytes and cycles, that the specification defers and does not price.
    tradeoff_note: >-
      Change (b) is a pure performance trade the designers already declared:
      block-cipher-based hashing was chosen over XOF "for performance reasons"
      to use AES hardware instructions, and 2026/629's variant one reverses it.
      The published benchmark table makes that trade measurable.

  dominated_by: >-
    n/a (no result claimed). No attack and no cost point is produced, so nothing
    can dominate it. Rows checked, per the inventor protocol: TIME axis -- the
    only competing claim on MQOM's unforgeability is the designers' 2^lambda,
    and this record produces no competing number; MEMORY axis -- nothing is
    computed, so no memory point exists; DATA/QUERIES axis -- this is the ONLY
    one of the four MQOM proposals of this session that lives on the query axis
    at all, and its content is precisely a query budget (2^64.5 signatures),
    against which the incumbent statement is the specification's unquantified
    "the salt mitigates the risk". That comparison is the deliverable.
  sota_delta: >-
    Quantitatively: converts an unquantified assurance into three exact numbers
    (2^64.5 / 2^96.5 / 2^128.5 signatures to an expected salt collision, against
