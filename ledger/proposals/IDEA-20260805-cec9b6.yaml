idea:
  id: IDEA-20260805-cec9b6
  question_id: RQ-MQOM-001
  added: '2026-08-05'
  title: >-
    The dependency loop, costed: MQOM's specification defers its EUF-CMA proof
    to a future version and an independent 2026 preprint says standard MPCitH
    templates do not apply to its secret-key-root correlated GGM tree -- so
    derive what the unmodified scheme actually pays, starting from the
    lambda-bit salt whose birthday budget sits within half a bit of the signing
    limit at Category I
  class: mechanism

  claim: >-
    TWO PRIMARY-SOURCE FACTS, both READ this session. (1) MQOM v2.1, Section
    4.1: "The formal EUF-CMA security proof of MQOM will be added to a future
    version of the specification." There is no proof document for the submitted
    scheme. (2) ePrint 2026/629 (Kosuge and Xagawa, "Towards Formal Security
    Proofs of MQOM", received 2026-03-31; ABSTRACT READ, PDF BODY NOT READ)
    states that the secret-key-root correlated GGM tree "introduces a dependency
    loop in the proof" -- "the transcript we would like to randomize for
    simulation is generated by expanding a GGM tree from a root that is part of
    the secret key, so this randomization must be justified via a reduction to
    the hardness of recovering the secret key. However, the hiding of the secret
    key relies on masking randomness that is a part of the transcript derived
    from the same GGM tree" -- and that "standard MPCitH proof templates do not
    apply directly". Their resolution is to prove TWO MODIFIED VARIANTS, not the
    submitted one.
    THE CLAIM: the gap between "MQOM v2.1 as submitted" and "an MQOM variant
    with a proof" is a FINITE, ENUMERABLE LIST OF SCHEME CHANGES with a
    computable cost in signature bytes and security bits, and nobody in this
    corpus has written that list down. Deriving it is directly actionable
    against the Round-3 tweak deadline of 2026-08-14. Its cheapest independent
    entry point, derivable without the gated PDF, is the SALT BUDGET: MQOM
    samples salt uniformly from {0,1}^lambda per signature and the specification
    justifies the salt by saying it "mitigates the risk of collisions in tree
    derivation and prevents accelerated exhaustive searches for hidden seeds",
    with no quantification. DERIVED HERE: the expected number of same-salt
    signature pairs after Q signatures is C(Q,2) * 2^(-lambda), which reaches 1
    at Q = 2^((lambda+1)/2), i.e. Q = 2^64.5 at Category I against a signing
    budget of 2^64 signatures per key -- a margin of HALF A BIT. That is the
    same knife-edge structure IDEA-20260805-7abf04 finds in the Fiat-Shamir
    inequality, appearing independently in the symmetric layer, and it is
    derivable in one line.

  object_first_candidate:
    tracked_object: >-
      THE INFORMATION CHANNEL FROM THE SECRET KEY INTO PUBLISHED TREE MATERIAL,
      followed as a graph: secret x -> BLC:Commit(mseed, salt, x) -> correlated
      GGM tree root -> leaf seeds -> the tau * log2(N) sibling-path seeds
      actually published in each signature. The tracked quantity at each node is
      (number of lambda-bit values published, number of distinct domain
      separators protecting them, number of signatures over which a separator
      repeats). The object propagates deterministically because the derivation
      graph is fully specified by Algorithms 3 and 4 and the SeedDerive /
      SeedCommit / PRG definitions.
    established_families_off_limits: >-
      Off-limits as the primary lens: MQ algebraic solving of every kind; the
      Fiat-Shamir soundness inequality (IDEA-20260805-7abf04); cost-model and
      memory accounting (IDEA-20260805-be7738); side-channel and fault attacks
      (2025/1895 is relayed and not used); and -- important -- ATTEMPTING TO
      REPAIR THE PROOF. This proposal does not propose to prove MQOM secure. It
      proposes to price the gap.
    newness_score: >-
      New in this corpus with certainty: no record here mentions the correlated
      GGM tree, the salt, or 2026/629. Externally, 2026/629 has already done the
      hard proof-theoretic work and this proposal explicitly builds on it rather
      than claiming to precede it; what appears to be genuinely unwritten is the
      CONCRETE COST TABLE of the changes their variants require, and the salt
      budget arithmetic, which the specification does not perform.
    testability_score: >-
      The salt half is pen-and-paper and decisive. The variant-cost half depends
      on obtaining the body of 2026/629; eprint.iacr.org PDF endpoints return
      403 from this harness (abstract pages return 200, measured this session),
      so a fallback source order is declared in the contract and a null result
      ("the body could not be obtained") is a legitimate, reportable outcome.
    survival_score: >-
      The salt arithmetic survives completely -- it is a birthday bound. The
      variant-cost table survives exactly as far as the source does. The
      dependency-loop analysis itself is NOT re-derived here and is not claimed:
      it is cited to its authors.

  mechanism: >-
    PROVENANCE. MQOM v2.1 read this session from https://mqom.org/docs/mqom-v2.1.pdf
    (HTTP 200) via a lossy zlib text extractor; every quotation is to be
    re-verified against the rendered PDF as stage 0. ePrint 2026/629 abstract
    page read this session (https://eprint.iacr.org/2026/629, HTTP 200); THE PDF
    BODY WAS NOT READ and no theorem, lemma, bound or parameter from it is
    asserted anywhere in this record.

    THE STRUCTURE, from the specification. Signing (Algorithm 3) draws
    mseed <- {0,1}^lambda and salt <- {0,1}^lambda, then calls
    BLC:Commit(mseed, salt, x) -- note that the secret solution x is an INPUT to
    the commitment that generates the tree, which is the correlation 2026/629
    names. The opening published in the signature is
    (path, out_ls_com, Delta x_0). Seed derivation and commitment are built from
    a block cipher Enc: {0,1}^lambda x {0,1}^lambda -> {0,1}^lambda,
    instantiated as AES-128 for lambda = 128 and Rijndael-256-256 for
    lambda = 192 and 256, in a Davies-Meyer construction in which THE SALT ACTS
    AS THE KEY and the seed is the plaintext. The specification's own
    justification for the salt is quoted verbatim: "Since seeds are only lambda
    bits long, using this salt mitigates the risk of collisions in tree
    derivation and prevents accelerated exhaustive searches for hidden seeds.
    Additionally, this salt is modified to enforce domain separation between
    different calls to SeedDerive and SeedCommit within a single signature
    computation." No number accompanies that sentence anywhere in the extracted
    text.

    FORCED VALUE 1 -- THE SALT BIRTHDAY BUDGET, DERIVED HERE IN ONE LINE. With
    salt uniform on {0,1}^lambda and one salt per signature, the expected number
    of unordered signature pairs sharing a salt after Q signatures is
    E[pairs] = C(Q,2) * 2^(-lambda), and Pr[at least one collision] is about
    1 - exp(-C(Q,2) * 2^(-lambda)). E[pairs] = 1 at Q = 2^((lambda+1)/2)
    approximately: Q = 2^64.5 for lambda = 128, 2^96.5 for lambda = 192,
    2^128.5 for lambda = 256. The NIST call for additional signatures states a
    per-key signing limit of 2^64 signatures (RECALLED, UNVERIFIED -- the call
    document's URL appears in the specification's own bibliography and reading
    it is stage 0 of the experiment, not an assumption here). If that recalled
    figure is right, Category I sits at Q_collision / Q_allowed = 2^0.5 = 1.41,
    i.e. HALF A BIT of margin, and at the allowed limit E[pairs] = 2^(-1),
    Pr[collision] about 0.39. Categories III and V have 2^32.5 and 2^64.5 of
    margin respectively and are not close. THE ASYMMETRY IS THE FINDING SHAPE:
    the salt length scales with lambda while the signing budget does not, so
    Category I is the only tight cell, and it is tight by construction rather
    than by accident.
    WHAT A COLLISION BUYS IS NOT DERIVED HERE AND IS THE RESEARCH QUESTION. Two
    signatures sharing a salt share the Davies-Meyer KEY, so SeedDerive and
    SeedCommit are the same function on both. Whether that composes with the
    secret-key-root correlation into anything usable is exactly the question
    2026/629's dependency loop is about, and this record makes no claim that it
    does. The honest statement is: the specification asserts the salt removes a
    risk, it quantifies nothing, and the quantity it should have quantified is
    within half a bit of the signing budget at Category I.

    FORCED VALUE 2 -- THE MULTI-TARGET LEDGER. Per signature the opening
    publishes tau sibling paths of length log2(N), i.e. tau * log2(N) node
    seeds of lambda bits, and HIDES exactly tau leaf seeds. Derived counts at
    Category I: MQOM2-L1-*-short has tau = 12, log2 N = 11, so 132 published
    node seeds and 12 hidden leaf seeds per signature; the fast sets have
    tau = 17, log2 N = 8, so 136 published and 17 hidden. Over Q signatures the
    number of hidden lambda-bit targets is Q * tau, which at Q = 2^64 is 2^67.6
    for the short sets. A generic multi-target exhaustive search over T targets
    costs 2^lambda / T IF the targets share a derivation function; the salt is
    precisely what forbids that, so the derived speedup is 1 while salts are
    distinct and the whole question reduces to Forced Value 1. Writing that
    reduction down explicitly is the point: it converts the specification's
    unquantified assurance into a derived statement with a named failure
    condition.

    FORCED VALUE 3 -- THE VARIANT COST TABLE. 2026/629's abstract describes its
    two proved variants as follows (quoted): variant one "makes a minor change
    to salts and replaces blockcipher-based hash functions in the GGM trees with
    random functions", proved EUF-CMA in the (quantum) random oracle model under
    partial-domain one-wayness or slightly stronger one-wayness assumptions;
    variant two "also makes a minor change to salts and adjusts security
    parameters to admit a proof under standard one-wayness in the ideal-cipher
    and random-oracle models", via an H-coefficient argument. EACH OF THOSE
    PHRASES HAS A PRICE IN THIS SCHEME AND THE PRICE IS COMPUTABLE FROM THE
    SPECIFICATION ALONE:
    (a) "a minor change to salts" -- if the salt grows from lambda to 2*lambda
    bits, the signature grows by lambda/8 bytes: 16 bytes at Category I (0.56
    per cent of the 2868-byte L1-gf2-short signature), 24 at III, 32 at V, and
    Forced Value 1's margin goes from half a bit to 2^64.5 signatures of slack.
    That is a derived, exact trade and it is the single cheapest candidate tweak
    available before 2026-08-14.
    (b) "replaces blockcipher-based hash functions in the GGM trees with random
    functions" -- the specification states plainly that it "changed for mainly
    using a block cipher in MQOM v2 for performance reasons ... to leverage the
    AES hardware instructions", so this change is a pure performance cost, and
    its size is measurable from the published benchmark table already fetched
    from mqom.org (for example MQOM2-L1-gf2-short-3r at 6.24M signing cycles).
    (c) "adjusts security parameters" -- an unspecified parameter increase whose
    cost is exactly the derivative of the signature-size formula
    |sigma| = 4 + tau*(n + eta*mu)/8 + (5*lambda + tau*lambda*(log2 N + 1))/8
    bytes with respect to tau, which is computable per parameter set from
    Table 6 and requires nothing from the gated PDF.
    THE DELIVERABLE IS THAT TABLE: for each of the eighteen published instances,
    the byte and cycle cost of each candidate change, so that a reader can see
    what a proof would cost. It needs the PDF body only for (c)'s magnitude, and
    (a) and (b) are derivable without it.

    QUANTIFIER-ORDER OBSERVATION, ZERO COMPUTE, RECORDED FOR THE EXPERIMENT TO
    TEST. The dependency loop as described is a quantifier-order failure of a
    specific kind: the simulator's randomization requires a reduction to
    key-recovery hardness, and that reduction's hiding argument requires the
    randomization. Written with explicit quantifiers, a working proof needs
    THERE EXISTS a simulator such that FOR ALL adversaries the transcript is
    indistinguishable, whereas the looped argument yields at best FOR ALL
    adversaries THERE EXISTS a simulator depending on the adversary's own
    success -- which is not a simulator. Whether that is the actual shape of the
    obstruction is a question for the PDF body, and it is listed as a reading
    task, not asserted.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped: [ledger/, knowledge/, docs/, experiments/]
    grep_results:
      - No record in this corpus mentions MQOM's GGM tree, its salt, or ePrint 2026/629.
      - >-
        IDEA-20260805-38048d (written this session for GOAL-FAEST-001) attacks a
        DIFFERENT tree-related object -- FAEST's bAVC opening-size filter
        conditioning the Fiat-Shamir challenge -- and the two do not overlap,
        though both live in the GGM/VOLE layer the scout brief names as the
        cross-family target.
    conclusion: >-
      New in this corpus. NOT new externally in the essential respect: 2026/629
      identified and analysed the dependency loop first and this record says so
      in its title. The unwritten part is the concrete cost table and the salt
      arithmetic.

  literature_context:
    - >-
      READ (primary, lossy extraction): MQOM v2.1 Sections 2.4.2, 2.5, 4.1, 5.4
      and Tables 6 and 7. Sources of Algorithm 3, the Davies-Meyer construction,
      the salt sentence, the signature-size formula and the deferred-proof
      sentence.
    - >-
      READ (abstract page only, https://eprint.iacr.org/2026/629): Kosuge and
      Xagawa, "Towards Formal Security Proofs of MQOM". PDF BODY NOT READ --
      eprint.iacr.org/YYYY/NNNN.pdf returns 403 from this harness while abstract
      pages return 200. Every phrase attributed to it here is quoted from the
      abstract. NO THEOREM NUMBER, BOUND, PAGE OR PARAMETER FROM THIS PAPER IS
      CITED ANYWHERE IN THIS RECORD.
    - >-
      READ (primary): https://mqom.org/ benchmark table (signing and
      verification cycles per instance) and https://mqom.org/resources.html
      (v2.1 of 2025-09-22 is the latest specification; NO ROUND-3 SPECIFICATION
