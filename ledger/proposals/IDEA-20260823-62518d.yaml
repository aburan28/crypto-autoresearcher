idea:
  id: IDEA-20260823-62518d
  record_type: research_idea
  schema_version: "1.0"
  added: "2026-08-23"
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-b1bfda
  task_id: TASK-20260823-03d4d2
  title: Representation-scoped coordinate obstruction for shared common-norm location
  class: algorithm
  novelty_status: unverified
  claim_ceiling: unverified_representation_scoped_obstruction
  authority:
    changes_hypothesis_status: false
    approves_experiment: false
    assigns_executor: false
  claim:
    statement: >-
      For the frozen ECDLP-IDEA-121 input family, every audited route that first
      translates the shared B^2-leaf circuit into either (i) explicit unary
      norms, (ii) a fixed public quotient large enough to retain arbitrary
      degree-B common factors, (iii) a primitive or Kronecker coordinate
      algebra, or (iv) full power-projection data, exposes Theta(B^3)
      base-field coordinates or operations before G is known. This exceeds the
      frozen B^(9/4+o(1)) campaign and B^(5/4+o(1)) fresh-target gates.
    scope: >-
      Only the listed representation classes and their coefficient-complete
      interfaces. This is not a lower bound for arbitrary circuits, adaptive
      nonlinear sketches, or direct shared-leaf elimination.
    not_claimed:
      - impossibility of an output-sensitive common-norm locator
      - impossibility of a structured elliptic-product recurrence
      - impossibility for all arithmetic circuits or all quotient choices
      - mathematical closure of ECDLP-IDEA-121
  mechanism:
    summary: >-
      Track every standard representation down to K-coordinates. The residue
      ring K[U]/(T) has dimension Theta(B); retaining the B^2 W-direction of H
      therefore yields Theta(B^3) K-coordinates. A degree-q triangular quotient
      has dimension Theta(Bq); q=Theta(B^2) again yields B^3, while q=Theta(B)
      is useful only if its modulus already contains the unknown G. Explicit
      norms have degree Theta(B^3), and coefficient-input shallow-GCD results
      start after that expansion.
    obstruction_quantity:
      name: exposed_base_field_coordinates
      measured_value: Theta(B^3)
      units: K-elements_or_K-operations
      error_bars: asymptotic_exact_up_to_constant_and_polylog_factors
      source: coordinate_dimension_derivation_zero_runs
      scope: audited_standard_representations_only
    resource_check:
      examined: true
      reading: >-
        The shared-leaf structure discarded by unary conversion is the resource:
        a surviving method must couple T and F before either norm or a selector
        algebra is formed, and must preserve occurrence labels through the same
        nonlinear recurrence.
  non_duplicate_rationale: >-
    ECDLP-IDEA-121 left a mechanism-new direct locator open. This record does
    not rename the missing operation; it isolates the exact K-coordinate lift
    incurred by four concrete representations, adds coefficient-input controls
    for the 2024-2025 shallow-GCD literature, and states a falsifiable escape
    interface that acts before unary norm formation.
  predictions:
    - id: P1
      statement: Any implementation of an audited route will allocate, emit, or algebraically process Omega(B^3) K-coordinate slots before recovering G.
    - id: P2
      statement: A claimed q=Theta(B) quotient route will require a modulus C known to be divisible by G, making G part of the input or moving the locator elsewhere.
    - id: P3
      statement: A valid escape will consume the original leaf parameters and T,F together and will not expose either norm coefficient vector or a B^3 selector state.
  observables:
    - maximum live K-coordinate count
    - total K-operation count before first coefficient of G is certified
    - degree and construction provenance of every quotient modulus
    - whether any input already contains G or its roots
    - source labels retained per recurrence state
  minimal_discriminating_test:
    type: proof_audit_no_experiment
    procedure: >-
      Type every intermediate of a proposed recurrence over K; expand extension
      and quotient elements into K-coordinate dimension; identify the first
      state sufficient to separate the fixed-jet collision pair; reject this
      obstruction if a coefficient-complete direct recurrence has o(B^(9/4))
      campaign time and memory, o(B^(5/4)) fresh-target time and memory, and no
      hidden G-dependent modulus.
    experiment_runs: 0
  controls:
    - id: C_BASELINE
      statement: Reproduce explicit norm degrees deg Res_U(T,H)=deg Res_U(F,H)=Theta(B^3).
    - id: C_COLLISION
      statement: For k<D compare (W^D,W^D) with (W^D,W^D+W^k); identical data modulo W^k can have gcd W^D versus W^k.
    - id: C_AW_2024
      statement: Treat the shallow-GCD theorem as a control whose explicit input is coefficients of univariate f,g of degree at most d; do not count it as constructing selector resultants from H.
      citation: CIT-AW-2024
    - id: C_BKRRSS_2025
      statement: Treat the finite-field constant-depth GCD result as coefficient-vector and degree-polynomial control, not as a direct shared-circuit selector.
      citation: CIT-BKRRSS-2025
    - id: C_KRSV_2024
      statement: Treat list-factor output, factor-size promises, and unary D dependence as explicit costs and completeness limits.
      citation: CIT-KRSV-2024
    - id: C_AKR_2025
      statement: Treat near-linear border circuits as applying to explicit univariate GCD over infinite fields, not as a finite-field selector-elimination oracle.
      citation: CIT-AKR-2025
    - id: C_NEARBY
      statement: Apply the same coordinate audit to an instance where G is supplied; the marker/source reduction then has B^2 dimension and must not be misreported as a locator.
  confounders:
    - special algebraic dependencies among elliptic leaves may shrink the reachable image below generic coordinate dimension
    - an adaptive nonlinear observation map may evade fixed-jet and linear-coordinate interfaces
    - multiplicity or chart promises may reduce a restricted instance without solving all strata
    - hidden preprocessing may move B^3 work outside the reported query cost
  falsifiers:
    - id: F1
      statement: A base-field-typed recurrence from T,F and the B^2 leaf parameters to coefficient-complete G whose audited total campaign cost is B^(9/4+o(1)) or less and which forms no B^3 state.
    - id: F2
      statement: A target-independent quotient or sketch of o(B^(9/4)) K-coordinates proven injective on the full reachable norm-pair image and sufficient for multiplicity-complete G.
    - id: F3
      statement: A fully charged all-strata marked recurrence that simultaneously locates G and replays labelled sources without post-hoc B^3 inversion.
  surviving_escape_class:
    name: direct_pre_elimination_shared_leaf_transducer
    input_type: >-
      K; coefficients of T,F in K[U]; and B^2 constant-degree leaf coefficient
      tuples P_ij in K[U,W] with signed occurrence codes and complete-chart tags.
    output_type: >-
      squarefree factor list and multiplicities for G in K[W], plus labelled
      signed source jets/unranking records for every supported stratum.
    required_properties:
      - couples T and F before forming either resultant
      - nonlinear and adaptive over the reachable elliptic-product image
      - state dimension O(B^(9/4+o(1))) for the full campaign
      - fresh masked-target update O(B^(5/4+o(1)))
      - proves image separation rather than assuming short data suffice
      - propagates occurrence markers and chart/local-parameter lineage natively
  costs:
    parameterization:
      B: N^(1/5)
      n: Theta(B^2)
    baselines:
      rho_time: B^(5/2+o(1)) = N^(1/2+o(1))
      bsgs_time: B^(5/2+o(1)) = N^(1/2+o(1))
      bsgs_memory: B^(5/2+o(1)) = N^(1/2+o(1))
      shared_input: B^(2+o(1)) = N^(0.4+o(1))
      expected_output: Theta(B) = N^(0.2)
    frozen_gates:
      full_campaign_time_and_memory: B^(9/4+o(1)) = N^(0.45+o(1))
      fresh_masked_target_time_and_memory: B^(5/4+o(1)) = N^(0.25+o(1))
    audited_routes:
      explicit_unary_norms: B^(3+o(1)) = N^(0.6+o(1))
      triangular_q_B2: B^(3+o(1)) = N^(0.6+o(1))
      primitive_or_kronecker: B^(3+o(1)) = N^(0.6+o(1))
      full_power_projection: B^(3+o(1)) = N^(0.6+o(1))
      post_hoc_source_replay: B^(3+o(1)) = N^(0.6+o(1))
      conditional_decode_given_G: B^(2+o(1)) = N^(0.4+o(1))
  assumptions:
    - id: A1
      statement: deg T=deg F=Theta(B), H has exactly B^2 constant-degree leaves, and both norms have degree Theta(B^3).
      status: frozen_interface
    - id: A2
      statement: G is an unknown squarefree common factor with multiplicity data and expected degree Theta(B).
      status: frozen_target
    - id: A3
      statement: Costs are counted in base-field coordinates and operations, including preprocessing, marker construction, factorization, and source inversion.
      status: accounting_rule
  proof_search_map_ref: coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/proof-search-map.yaml
