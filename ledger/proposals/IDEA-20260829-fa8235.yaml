  assumptions:
    - >-
      The elimination cost model "XOR count proportional to (rows reduced) x
      (pivots available) x (columns/64)" is the right first-order model for the
      in-tree bitset eliminator EXP-SBRG-60c55e specifies. If the implementation
      uses Method-of-Four-Russians blocking, the model acquires a log factor that
      applies to BOTH arms and cancels in the ratio to first order; this is
      checked by measuring the baseline arm's XOR count against the model.
    - >-
      The batch schedule is "reduce S_struct once to a carrier, then reduce each
      target block against the carrier". A different schedule (for example
      interleaving) has a different ceiling and the derivation does not apply to
      it. The schedule is frozen before any cell runs.
    - >-
      r_struct/r_full is MEASURED, not assumed. The formula in (B) is stated with
      it as a variable and the point predictions in (C) are quoted at the
      measured value, not at 1.
    - >-
      Reuse acts on D and on nothing else. This is not a modelling choice, it is
      forced by KN-FIND-007 -- mean yield is a geometry-independent double count,
      so no preprocessing can change it, and the linear-algebra term is a
      function of B alone.
    - >-
      The composition in (D) inherits IDEA-20260829-b5a2c8's two-term model in
      full, including its unreviewed status. If that model is wrong, part (D) is
      wrong and parts (A)-(C) survive unchanged as a statement about the
      instrument.

  proof_search_map:
    bottleneck: >-
      The online per-target elimination cost. Everything the reuse mechanism can
      possibly do lands there, and the exact step whose removal would change the
      answer is "reduce the target-derived Macaulay rows against the fixed
      carrier". If those rows could be skipped entirely the ceiling would not
      exist; the claim is that they cannot, because they are the only rows
      carrying the target.
    baseline_embedding:
      parameter_slice: >-
        The direct_t3 representation, where target_independent_groups = 0 and the
        formula returns rho_D = 1 and speedup ceiling exactly 1.00 for every K
        and every D. This is the specification's own declared control and the
        derivation must reproduce its stated expectation ("no batching benefit is
        expected") as a number rather than as a sentence.
      reproduction_check: >-
        Symbolic identity check plus a frozen fixture. Symbolically, setting the
        structural generator count to zero must give speedup(K) = 1 identically.
        As a fixture, at K = 1 the formula must give speedup(1) = 1 for every
        representation -- a single-target batch can amortize nothing -- and any
        implementation reporting speedup above 1 at K = 1 is measuring a
        different quantity and halts the line.
    observation_collision:
      observable: >-
        The single number xor_speedup for an 8-target batch.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is exactly why the ceiling
        matters. Two entirely different situations produce xor_speedup near 1.8
        at t=3: (i) pure bookkeeping reuse at rho_D = 1/2 with no structural
        content whatsoever, and (ii) a partially dependent target block at a
        LARGER rho_D whose online rank is sublinear. They are separated only by
        also reporting rows_targ, r_full - r_struct and the measured degree
        histogram, so those three are required metrics and a bare xor_speedup is
        prohibited by this record. A degree-profile-matched planted Boolean
        control reproduces case (i) exactly and is the null.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "how much can batch reuse save" by the row bipartition and its
          four counts, so the question becomes one ratio of binomial sums with no
          solver in it. Obligations kept separate -- encoding (the partition is
          determined by generator provenance), completeness (every row belongs to
          exactly one part), soundness (the batched schedule respects the
          partition), transfer (fails when degree profiles differ, and fails in
          the direction that lowers the ceiling), cost loss (none, the reduction
          is free).
        predicted_gain: >-
          Converts an open empirical gate into a two-sided point prediction at
          zero compute, and supplies the number the specification's control arm
          was written to expect. NO ATTACK EXPONENT IS MOVED IN EITHER DIRECTION.
      - transform: boundary_lift
        proposed_object: >-
          Take K to infinity -- an infinitely amortized precomputation, better
          than anything achievable -- and read off 1/rho_D. This bounds the whole
          family from inside and is robust to every future improvement in how the
          precomputation is done.
        predicted_gain: >-
          A ceiling that no engineering can breach without breaching the row
          partition, which is a structural statement rather than a measurement of
          today's code.
    quantifier_order: >-
      CLAIMED. FORALL n, FORALL Macaulay degrees D, FORALL field bases, FORALL
      factor-base orientations, FORALL chain topologies with t-1 summation
      constraints of which exactly one contains the target, FORALL batch sizes K,
      under the stated elimination cost model and the stated batch schedule, the
      measured xor_speedup satisfies speedup <= 1/rho_D <= t-1.
      NOT CLAIMED, and the distinction is load-bearing. FORALL cost models -- the
      bound is relative to the stated model and a model with superlinear pivot
      cost or with fill-in growth can violate it in EITHER direction. FORALL
      reuse mechanisms -- this bounds row-space reuse, not reuse by any other
      object, and IDEA-20260829-66a876 and IDEA-20260829-57b1eb are filed
      precisely because other objects are not covered.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the stated elimination cost model and batch schedule, batch reuse
        of a target-independent Macaulay row space in a chained descended Semaev
        system cannot exceed a factor t-1, and the fully charged end-to-end gain
        cannot exceed (t-1)^{2/(m+1)}." It can NEVER certify anything about
        wall-clock solver time, about the Groebner solving degree, about
        reuse mechanisms based on other objects, or about the ECDLP.
      nearby_object_control: >-
        THE DEGREE-PROFILE-MATCHED PLANTED BOOLEAN CONTROL, which
        EXP-SBRG-60c55e already specifies as CTRL-SBRG-DEGREE-PROFILE, and it is
        blocking. A random Boolean system with the identical degree profile and
        the identical bipartition MUST show the same xor_speedup, because the
        ceiling is a count and knows nothing about Semaev. If the control shows a
        DIFFERENT speedup, the cost model is wrong or the implementation is
        sensitive to something the count does not see, and no conclusion may be
        drawn. If the control shows the same speedup and the real system exceeds
        it, that excess -- not the raw speedup -- is the structural signal.
    proof_obligations:
      - claim: >-
          A t-chain has t-1 summation constraints of which exactly one contains
          the target.
        responsibility: baseline
      - claim: >-
          Row count at layer D is sum over generators of binom(v, D-d_i).
        responsibility: correctness
      - claim: >-
          rho_D = 1/(t-1) under a matched degree profile, and rho_D >= 1/(t-1)
          in general.
        responsibility: strictness
      - claim: >-
          speedup(K) = 1/(rho_D + (1-rho_D)(r_struct/r_full)/K), with limit
          1/rho_D.
        responsibility: size
      - claim: >-
          speedup(1) = 1 identically, and direct_t3 gives 1.00 at every K.
        responsibility: baseline
      - claim: >-
          A factor f in D becomes f^{2/(m+1)} end to end under the two-term
          optimum.
        responsibility: interface
      - claim: >-
          The degree-profile-matched control reproduces the same ceiling.
        responsibility: scope
      - claim: >-
          Measured XOR counts in the baseline arm track the cost model within a
          stated tolerance, or the model is reported as not applicable.
        responsibility: feasibility

  predictions:
    - metric: >-
        measured xor_speedup for an 8-target batch, chain_t3 representation,
        against the derived formula at the measured r_struct/r_full
      direction: different
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION 1.78, acceptance band [1.55, 2.00]. The
        upper end of the band is the K-to-infinity ceiling 2.00, which must NOT
        be exceeded. A measured value above 2.00 falsifies the ceiling and is the
        most valuable outcome in this record. A measured value below 1.55
        falsifies the cost model, most plausibly through density growth in the
        online arm, which the specification already flags with its 4x
        sparse_density caveat.
    - metric: >-
        measured xor_speedup for an 8-target batch, chain_t4 and balanced_t4
      direction: different
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION 2.40, acceptance band [2.00, 3.00], with
        3.00 the ceiling that must not be exceeded. The t=4 and t=3 arms must
        also satisfy the ORDERING speedup(t=4) > speedup(t=3) in every seed; an
        inversion falsifies the partition account even if both land in band,
        because the ordering follows from the counts alone.
    - metric: >-
        measured xor_speedup for direct_t3, at every D and every K
      direction: different
      minimum_effect: >-
        FORCED 1.00, tolerance 0.05 in either direction. This representation has
        no target-independent generator group, so any reported reuse is an
        instrument artifact and halts the line. This is the cheapest single
        integrity check in the proposal and it costs one cell.
    - metric: >-
        rho_D computed from the measured degree histograms, versus 1/(t-1)
      direction: different
      minimum_effect: >-
        PREDICTED at or ABOVE 1/(t-1), never below, because substituting the
        target as a constant can only lower Boolean degrees and lowering d raises
        binom(v, D-d). A measured rho_D BELOW 1/(t-1) at any cell means the
        target block has HIGHER degree than the structural blocks, which
        contradicts the substitution argument and must be hand-derived before
        anything else is reported.
    - metric: >-
        excess xor_speedup, defined as the real system's speedup minus the
        degree-profile-matched planted control's speedup at the identical
        bipartition, D, n and K
      direction: different
      minimum_effect: >-
        PREDICTED 0 within 0.10. This is the null-object control of the inventor
        protocol section 3 and it is the ONLY quantity in this record that could
        carry Semaev-specific content. A positive excess above 0.10 that persists
        over at least three increasing n and two master seeds is a genuine
        reusable structural dependency and breaks the ceiling account; a zero
        excess means the measured speedup is bookkeeping and the lane's value is
        the derived constant and nothing more.
    - metric: >-
        end-to-end charged gain, computed as (measured f)^{2/(m+1)} with f the
        measured reuse factor, reported alongside a matched Pollard rho operation
        count on the same instances
      direction: different
      minimum_effect: >-
        PREDICTED at most 1.6x and therefore exponent-neutral. Recorded in
        advance so that no downstream summary can quote an XOR speedup as an
        ECDLP speedup. A charged gain above 2.0x at any cell would mean the
        composition through the two-term model is wrong and requires its own
        record.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, one page, HARD GATE). Derive rho_D for every cell of
      the EXP-SBRG-60c55e Phase-A grid from the generator counts and the measured
      degree histograms, and derive speedup(K) symbolically. Check the two
      boundary cases by hand -- speedup(1) = 1 for every representation, and
      direct_t3 = 1.00 for every K. If either fails, stop; the formula is wrong.
      STAGE 1 (zero compute, minutes). Instantiate the composition through
      IDEA-20260829-b5a2c8's optimum and emit the end-to-end ceiling
      (t-1)^{2/(m+1)} at t = 3..8, verified numerically to 1e-12 against the
      closed form. Also instantiate the extension-field form t! q D + c_LA q^2
      and record the q at which reuse stops buying anything.
      STAGE 2 (low compute, the measurement). Run the smallest feasible slice of
      the Phase-A grid -- n in {8, 10, 12}, t in {3, 4}, all four
      representations, both field bases, both orientations, 3 master seeds,
      8 targets per cell -- at Macaulay degrees restricted to the cells that
      IDEA-20260829-cb4fd5's feasibility table admits. Record, per cell,
      rows_struct, rows_targ, r_struct, r_full, the degree histogram, the
      baseline XOR count, the offline XOR count, the online XOR count, peak RSS,
      and sparse_density in both arms.
      STAGE 3 (low compute, BLOCKING NULL). The degree-profile-matched planted
      Boolean control at the identical bipartition and identical counts. Report
      excess xor_speedup, never raw xor_speedup alone.
      STAGE 4 (zero compute). Compare measured against predicted; report the
      charged gain alongside a matched rho count; and if the ceiling holds, file
      the constant-factor characterisation of this lane as a proposal for the
      Coordinator, with the forward guidance naming the object classes the
      ceiling does NOT cover.
      MEMORY DISCIPLINE, STATED BECAUSE THE PROGRAM HAS A LIVE MEMORY WALL. The
      2026-08-28 GOAL-DREG-001 n=15 D=6 attempt terminated as resource_exhaustion
