  falsification_conditions:
    - >-
      Measured xor_speedup exceeds 1/rho_D at any cell where the fixed
      fingerprint holds. The ceiling is false, the reuse is not the row
      partition, and the surviving mechanism -- online rank sublinear in
      rows_targ -- is a genuine reusable syzygy and is worth far more than this
      record. This is the outcome the proposal most wants to be wrong about.
    - >-
      direct_t3 reports reuse above 1.05. The instrument is measuring something
      other than the bipartition and everything downstream is void.
    - >-
      speedup at K = 1 differs from 1.00. Same conclusion, cheaper cell.
    - >-
      Measured rho_D falls below 1/(t-1) at any cell. The degree-substitution
      argument is wrong and the ceiling must be rederived before use.
    - >-
      The degree-profile-matched control shows a materially different speedup
      from the real system with the same counts. Either the cost model is wrong
      or there is Semaev-specific content; the excess is then the finding and the
      raw number is not.
    - >-
      Measured xor_speedup falls below 1.10 everywhere, which is
      EXP-SBRG-60c55e's own stop gate. The cost model's linear pivot charge is
      wrong, most plausibly through online density growth, and the lane's reuse
      is worth less than the derivation says rather than more.
    - >-
      Everything holds. RQ-SBRG-f31cb2 acquires a derived ceiling for
      row-space reuse, the lane is characterised as constant-factor and
      exponent-neutral with the constant computed, EXP-SBRG-60c55e's 1.25x gate
      is replaced by a two-sided prediction, and the forward guidance names the
      object classes the ceiling does not cover.

  confounders:
    - >-
      FILL-IN AND DENSITY GROWTH. The online arm reduces against a DENSE carrier,
      while the baseline arm may exploit sparsity early. If online density grows
      faster, the measured speedup falls below the ceiling for a reason that has
      nothing to do with the partition. sparse_density is a required metric in
      BOTH arms and the specification's own 4x density caveat applies.
    - >-
      RANK SATURATION. speedup(K) depends on r_struct/r_full. If the target block
      is nearly rank-independent of the fixed space, that ratio is small and the
      finite-K prediction shifts even though the ceiling does not. This is why
      r_struct and r_full are reported per cell and the point predictions are
      quoted at the measured ratio.
    - >-
      OPERATION-COUNTING CONVENTION. XOR counts, word operations and group
      operations are not interchangeable. The charged comparison against rho in
      Stage 4 requires one declared conversion frozen before any cell runs;
      counting rho in group operations and the reuse arm in XORs would
      manufacture a factor of order n^{1.6} in either direction.
    - >-
      DEGREE-PROFILE ASYMMETRY. The target block has x_R substituted as a
      constant and may have a strictly lower degree profile, moving rho_D up. The
      histogram is measured per cell rather than assumed, and the derivation is
      quoted at the measured rho_D, not at 1/(t-1).
    - >-
      IMPLEMENTATION QUALITY. A slow online arm against a tuned baseline arm
      measures programming effort. The reported quantity is a RATIO of XOR
      counts, which are deterministic and implementation-defined but
      machine-independent, and no wall-clock claim is made -- exactly the
      restriction EXP-SBRG-60c55e already states for its XOR metrics.
    - >-
      SCOPE LEAKAGE TO PRIME FIELDS. IDEA-20260829-bdca13 argues that the toy
      prime-field S_3 Groebner quotient is a product of fields and therefore
      radical, so its observables are functions of a grid incidence set. That
      argument is about a DIFFERENT encoding -- prime field, m = 2, membership by
      a squarefree split polynomial -- and says nothing about the Boolean chained
      systems here, which impose membership by a choice of variable domain. The
      transfer is not made and a reader tempted to make it is reading beyond both
      records.

  interpretation_limits:
    - >-
      THIS IS A CEILING ON ONE REUSE MECHANISM UNDER ONE COST MODEL, not a
      closure of RQ-SBRG-f31cb2. It bounds reuse of the Macaulay ROW SPACE. It
      says nothing about reuse of the projected variety
      (IDEA-20260829-66a876), of a compressed low-degree filter
      (IDEA-20260829-57b1eb), of Frobenius orbit structure, or of any object not
      yet enumerated -- and this program has NO written object enumeration for
      the ECDLP, which is KN-OPEN-019.
    - >-
      NO ECDLP CLAIM, NO EXPONENT, NO ATTACK. The derived end-to-end ceiling of
      about 1.6x is a constant and is explicitly non-target-class under
      docs/target-result-profile.md. Its priority rests on being a cheap
      pre-compute gate on an existing draft experiment, not on being an advance.
    - >-
      The composition in part (D) is only as good as IDEA-20260829-b5a2c8, which
      is an unreviewed proposal with novelty_status unverified and whose own
      extension-field nearby-object control has not been run.
    - >-
      Scoped to Weil-descended chained S_3 systems over ordinary binary curves at
      n <= 12 in the measured arm. Nothing transfers to prime fields, to
      non-chained topologies, or to cryptographic scale.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was grepped and the nearest records
      read in full; the external literature was searched but Semaev
      arXiv:1504.01175 -- the single most likely location of prior art for the
      target-independence observation -- was NOT opened. Honest status
      unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the descended chained system at Macaulay layer D, the number of
        linearly independent rows contributed by the structural block, r_struct,
        satisfies r_struct / r_full = 1 - Theta(rows_targ / rows_full) up to
        o(1); equivalently, the target block contributes independent rows in
        proportion to its row count, so the Macaulay rows behave like generic
        rows of their degree with respect to independence.
      rigorous_support: >-
        The RIGOROUS ingredient is the exact row count sum over generators of
        binom(v, D-d_i), which is a definition of the Macaulay layer and not an
        estimate, together with the trivial bound r <= min(rows, cols) and the
        fact that at the parameters considered rows is far below cols, so the
        rank is row-limited rather than column-limited. The CLASSICAL STATEMENT
        IMITATED is the generic-independence heuristic underlying every
        degree-of-regularity computation for semi-regular sequences -- that rows
        of a Macaulay matrix are independent until the Hilbert series forces a
        dependency. THE GAP is exactly the content of this question -- if
        Semaev systems have EXTRA dependencies, H1 fails, and it fails in the
        direction that BREAKS the ceiling, which is why the record treats a
        broken ceiling as its most valuable outcome rather than as a
        disappointment.
      validation_plan: >-
        SAMPLE. Every cell of the Stage 2 slice -- n in {8,10,12}, t in {3,4},
        4 representations, 2 bases, 2 orientations, 3 master seeds, 8 targets --
        measuring r_struct and r_full directly by exact GF(2) rank, never
        inferred. COMPARISON. The generic prediction r_full = min(rows_full,
        cols) and r_struct = min(rows_struct, cols), i.e. full row rank, which is
        the semi-regular expectation at these under-determined parameters;
        the deficit rows - rank is exactly EXP-SBRG-60c55e's syzygy_dim and is
        already a specified metric. NULL COMPARISON. The identical statistic on
        the degree-profile-matched planted control, whose deficit is the generic
        count; the EXCESS deficit is the reportable quantity. TAIL CHECK. The
        largest observed excess deficit over all cells, reported individually
        rather than averaged, and the cell at the largest n reported separately
        because a signal that only appears at the smallest n is a small-parameter
        artifact. SAMPLED PARAMETERS RECORDED. n, t, representation, basis,
        orientation, seed, factor-base dimension, D, v, rows per block, cols.
        TRANSFER. NONE. Nothing above n = 12 is claimed and no extrapolation to
        cryptographic scale is performed or licensed.
    - id: H2
      statement: >-
        The XOR count of reducing R rows against a carrier holding r pivots over
        C columns is c * R * r * C / 64 for a constant c in [0.25, 1] that
        depends only on the eliminator and not on n, t, D or the representation,
        so that the ratio of two XOR counts under the same eliminator is
        independent of c.
      rigorous_support: >-
        The RIGOROUS ingredient is that reducing one dense row against r pivots
        performs at most r word-XOR sweeps of C/64 words each, giving the upper
        bound with c = 1, and at least the number of pivots actually hit, giving
        a lower bound with c the expected pivot-hit rate. Over GF(2) with dense
        rows that rate is 1/2 in expectation, which fixes c near 0.5. The
        CLASSICAL STATEMENT IMITATED is the standard dense-elimination operation
        count, and the imitation is exact rather than approximate because the
        eliminator EXP-SBRG-60c55e specifies is a deterministic bitset routine
        whose XOR count is reproducible bit for bit. THE GAP is sparsity -- early
        rows are sparse and may skip whole words, which lowers c in the baseline
        arm more than in the online arm and biases the measured speedup DOWNWARD,
        i.e. away from the ceiling and in the safe direction.
      validation_plan: >-
        SAMPLE. Every Stage 2 cell, recording the measured baseline XOR count and
        the model prediction c * rows_full * r_full * cols / 64 with c fitted
        once across the whole grid and then FROZEN. COMPARISON. The fitted c must
        lie in [0.25, 1] and its residuals must be within 25 percent across at
        least a 20x range of rows*rank*cols; a c outside the interval or
        residuals outside the band mean the model is not describing the
        eliminator and the ceiling must be restated as a row-count bound only.
        TAIL CHECK. The largest cell, reported separately, because the constant
        is most likely to drift where sparsity is highest. SAMPLED PARAMETERS
        RECORDED. Eliminator commit, word width, rows, rank, cols, measured and
        predicted XOR counts per cell. TRANSFER. None; c is a property of one
        implementation and is not carried to any other.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The quantity this record bounds is
      the reuse factor f applied to the per-trial decomposition cost D, and the
      bound is f <= t-1, a constant at fixed arity. Composed through
      IDEA-20260829-b5a2c8's optimum T* = Theta((N D)^{2/(m+1)}), the end-to-end
      charged effect is a factor (t-1)^{2/(m+1)}, i.e. 2^{1/2} = 1.414 at
      m = t = 3 and 3^{2/5} = 1.552 at m = t = 4. In the extension-field regime
      with the factor base forced to B = q and total t! q D + c_LA q^2, the gain
      is at most min(t-1, 1 + c_LA q/(t! D)) and is exactly 1 once relation
      collection ceases to dominate.
    memory_exponent: >-
      The precomputation is a carrier of r_struct pivots over C columns, i.e.
      r_struct * C bits, which at the feasible cells of this record is under
      110 MB. Asymptotically it is Theta(rank * columns) and it is the reason the
      ladder terminates -- see IDEA-20260829-cb4fd5. In the charged attack model
      the memory term is unchanged from the baseline: reuse adds a carrier but
      does not change the Theta(B) factor base or the Theta(B) relation matrix,
      so the memory exponent of the attack is untouched.
    best_known: >-
      For binary-field ECDLP by point decomposition, the standing positions are
      Gaudry-style and Diem-style index calculus over extension fields
      (recalled, not verified this session) and, inside this program,
      KN-FIND-8f2c90's measured 1.5-1.7x BKK constant, which is explicitly "not
      exponent-moving". For generic ECDLP the frontier is Pollard rho at
      0.886*sqrt(N) group operations with O(1) memory. This record improves
      none of them and claims no improvement.
    hidden_overhead: >-
      DISCLOSED IN FULL. (i) The ceiling is relative to one elimination cost
      model, and H2's constant c is fitted rather than derived. (ii) The
      composition in part (D) inherits an unreviewed two-term model whose own
      extension-field control has not been run. (iii) The precomputation is
      treated as free because it amortizes over a number of trials that is
      exponential in the security parameter, which is TRUE in the asymptotic
      accounting and FALSE at the 8-target batch actually measured -- the
      finite-K formula is quoted precisely so that gap is visible rather than
      hidden. (iv) "Constant at fixed arity" hides that t itself grows in the
      extension-field regime, where t = n; the ceiling n-1 is then a polylog
      factor in N, and a polylog factor is still not an exponent.
    tradeoff_note: >-
      The reuse mechanism is a preprocessing scheme and therefore occupies a
      point on a space-time tradeoff curve. It buys a factor at most t-1 in
      online time for a carrier of r_struct * C bits, which is a WORSE trade than
      the table route of IDEA-20260829-66a876 whenever the carrier exceeds the
      table -- a comparison that record makes explicitly and that this one defers
      to. Parallelisation: the offline carrier build is a single elimination with
      the usual Amdahl-limited pivot dependence; the online arm is embarrassingly
      parallel across the K targets with linear speedup on 14 cores, which is the
      one place where batching helps for a reason the ceiling does not bound,
      and which must therefore be excluded from the measured XOR ratio.

  dominated_by: >-
    CHECKED ROW BY ROW, ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK this
    record mounts none, so it is dominated by every frontier row -- Pollard rho
    (N^{1/2}, O(1)), multi-target rho (sqrt(KN) total, O(1)), BSGS (N^{1/2},
    N^{1/2}), van Oorschot-Wiener golden collision (sqrt(A^3/w), w), the generic
    preprocessing frontier S*T^2 = Omega-tilde(N) recorded in KN-TECH-005,
    algebra-free meet-in-the-middle index calculus, the two-term index-calculus
    optimum ((m!ND)^{2/(m+1)}, N^{1/(m+1)}) of IDEA-20260829-b5a2c8, and the
    reusable-table frontier (N^{k/(2k-1)}, N^{k/(2k-1)}) derived in
    IDEA-20260829-66a876. As a STATEMENT ABOUT REUSE it is dominated by nothing
    in this corpus, because no prior record prices batch reuse at all -- but it
    may well be dominated by external literature this session did not open,
    Semaev arXiv:1504.01175 above all. As an INSTRUMENT RESULT it is dominated by
    any measurement that breaks the ceiling, which is why breaking it is the
    record's preferred outcome. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent moved in either
    direction. Quantified deliverable. (i) A derived ceiling on batch reuse of
    1/rho_D = t-1, i.e. 2.00 at t=3 and 3.00 at t=4, and exactly 1.00 for
    direct_t3, where EXP-SBRG-60c55e currently states only that no benefit "is
    expected". (ii) A replacement of that specification's one-sided 1.25x
    advance gate by two-sided point predictions of 1.78 and 2.40 at its own
    8-target batch size, with bands whose upper ends are the ceilings. (iii) The
    first end-to-end charged number for this lane -- at most 1.6x, computed as
    (t-1)^{2/(m+1)} -- which converts "does reuse reduce the fully charged cost"
    from an open question into a bounded one for this object, at zero compute.
    (iv) A pre-registered structural discriminator: excess speedup over the
    degree-profile-matched control above 0.10, persisting over three increasing n
    and two seeds, would be the first Semaev-specific reuse signal this program
    has, and its absence closes row-space reuse with an argument rather than a
    fatigue report.

