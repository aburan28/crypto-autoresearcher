idea:
  id: IDEA-20260829-fa8235
  question_id: RQ-SBRG-f31cb2
  added: '2026-08-29'
  title: >-
    THE REUSE CEILING IS THE ROW PARTITION, AND IT IS t-1: batch reuse of a
    target-independent Macaulay row space cannot exceed the reciprocal of the
    target-dependent row fraction, which for a chain of t-1 descended S_3
    equations is exactly 1/(t-1) at every Macaulay degree with a matched degree
    profile -- so the fully charged end-to-end gain, composed through
    IDEA-20260829-b5a2c8's two-term optimum, is at most (t-1)^{2/(t+1)}, i.e.
    1.41x at t=3 and 1.55x at t=4, and EXP-SBRG-60c55e's advance gate of 1.25x
    sits inside a ceiling this record derives with zero compute and turns into a
    sharp point prediction of 1.78x and 2.40x at its own 8-target batch size

  class: mechanism

  claim: >-
    (A) THE ROW PARTITION IS FIXED BEFORE ANY ARITHMETIC. In the Weil-descended
    chained system of EXP-SBRG-60c55e, the generators split into S_struct (all
    S_3 constraints not involving the target x-coordinate x_R) and P_R (the final
    target-specialized block). Over F_{2^n} a chain with t summands has t-1
    summation constraints, each descending to n Boolean equations, of which
    exactly n belong to P_R and (t-2)n belong to S_struct. At Macaulay layer D
    the row count of a generator of Boolean degree d is the number of squarefree
    multipliers of degree D-d, i.e. binom(v, D-d) with v the Boolean variable
    count. Hence the target-dependent row fraction is
    rho_D = sum over P_R generators of binom(v, D-d_i), divided by the same sum
    over all generators. When the descended degree profile of the final block
    matches that of the structural blocks -- which it does, because all t-1
    blocks are descents of the SAME summation polynomial S_3 -- this collapses to
    the pure count rho_D = 1/(t-1), independent of D, of n, of the field basis,
    of the factor-base orientation, and of the curve.
    (B) THE CEILING. Under the elimination cost model "XOR count = (rows
    reduced) x (pivots available) x (columns/64)", the fully amortized batch
    speedup over a batch of K targets is
    speedup(K) = 1 / ( rho_D + (1 - rho_D) * (r_struct/r_full) / K ),
    which increases monotonically in K to the limit 1/rho_D = t-1. THE LIMIT IS
    A CEILING, NOT AN ESTIMATE, under the stated cost model: the online arm must
    still reduce every target-derived row, and there are rho_D of them.
    Consequences, each a falsifiable number: direct_t3 has rho_D = 1 and
    therefore a ceiling of EXACTLY 1.00, i.e. no reuse is possible at all -- the
    specification lists direct_t3 as a control expecting "no batching benefit"
    and this record supplies the derivation and the number. chain_t3 has ceiling
    2.00, chain_t4 and balanced_t4 have ceiling 3.00.
    (C) THE SHARP POINT PREDICTION AT THE SPECIFICATION'S OWN BATCH SIZE. At
    K = 8 targets per cell (EXP-SBRG-60c55e phase_a targets_per_cell) and with
    r_struct/r_full measured (predicted near 1 because S_struct supplies (t-2)/(t-1)
    of the rows), the formula gives xor_speedup = 1.78 at t=3 and 2.40 at t=4.
    These replace the specification's threshold "xor_speedup >= 1.25" with a
    two-sided prediction that can fail in either direction, which a threshold
    cannot.
    (D) THE FULLY CHARGED COMPOSITION, WHICH IS WHAT RQ-SBRG-f31cb2 ACTUALLY
    ASKS. A reuse factor f applies to D, the per-trial decomposition cost, and to
    nothing else. Through IDEA-20260829-b5a2c8's two-term optimum
    T* = Theta((N D)^{2/(m+1)}), a factor f in D becomes a factor f^{2/(m+1)}
    end to end. At m = t = 3 the ceiling f = 2 gives 2^{1/2} = 1.414; at
    m = t = 4 the ceiling f = 3 gives 3^{2/5} = 1.552. In the extension-field
    regime where the factor base is forced to B = q and the total reads
    t! q D + c_LA q^2, the gain is weaker still and vanishes outright once
    t! q D falls below c_LA q^2 -- reuse buys nothing once relation collection
    is not the bottleneck. THE HONEST HEADLINE IS THEREFORE THAT THIS LANE, AT
    ITS DERIVED CEILING AND WITH A FREE PRECOMPUTATION, IS WORTH AT MOST ABOUT
    1.6x FULLY CHARGED AND MOVES NO EXPONENT.
    (E) AND YET THE MEASUREMENT IS WORTH RUNNING, BECAUSE EXCEEDING THE CEILING
    IS THE INTERESTING OUTCOME. If measured xor_speedup exceeds 1/rho_D, the row
    partition is not what is producing the reuse: the target block must be
    largely DEPENDENT on the fixed row space, so its online rank contribution is
    sublinear in its row count. That is a genuine reusable syzygy in the sense of
    this question's title, it is not bounded by the partition, and it would be
    the first evidence in this program that Semaev structure -- rather than
    bookkeeping -- is being reused. The two explanations make opposite
    predictions on one measured number.

  mechanism: >-
    THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY
    EXPERIMENT. The tracked object is the BIPARTITION OF THE MACAULAY ROW SET
    into target-independent and target-dependent rows, together with the four
    integers (rows_struct, rows_targ, r_struct, r_full). This is a genuinely
    lossy projection of the computation: it discards every coefficient, every
    monomial label, the curve, the field basis, the factor-base orientation, the
    addition-tree topology and the target itself, retaining a partition of an
    index set and four counts. Vastly many distinct systems share them.
    It is lossy COMPATIBLY with the operations of the target, which is the
    load-bearing half. The partition is determined by which generator produced
    each row, hence fixed before any arithmetic; Gaussian elimination is linear
    and the batched schedule -- reduce all structural rows once, then stream each
    target block against the resulting carrier -- respects the partition
    exactly. So the retained counts propagate deterministically through the
    operation the algorithm performs, and the XOR cost is a function of them
    alone under the stated model. The projection that FAILS the test, and is
    deliberately not used, is the Macaulay matrix M_D itself, which loses nothing
    and is a change of storage layout rather than a new object.
    WHY THE COUNT IS FORCED AND NOT A MODELLING CHOICE. Three inputs, each
    checkable without compute. (i) A chain of t summands built from S_3 has
    exactly t-1 summation constraints -- this is the definition of the
    representation in EXP-SBRG-60c55e, where chain_t3 is "two chained S_3
    equations" and chain_t4 is "a left-associated chain of three S_3 equations".
    (ii) Exactly one of those constraints contains x_R, because the target enters
    the chain only at the root -- the specification states this as its own
    mechanism, "S_struct contains all S_3 constraints independent of the target
    x(R)". (iii) Weil descent of one F_{2^n} equation gives exactly n Boolean
    equations, the same n for every block. So the generator counts are
    (t-2)n and n with no free parameter, and the multiplier count binom(v, D-d)
    depends on the block only through d, which is common to all blocks because
    they descend the same polynomial.
    WHERE THE ARGUMENT STOPS, STATED HERE AND NOT HIDDEN. It stops if the
    descended degree profiles of the structural and target blocks differ -- which
    they can, because the target block has x_R substituted as a CONSTANT, and
    substituting a constant can only LOWER Boolean degrees. A lower d on the
    target block RAISES binom(v, D-d) and therefore RAISES rho_D, which lowers
    the ceiling further. So the degree asymmetry moves the conclusion in the safe
    direction for a ceiling, and the exact rho_D is a measured degree histogram
    away, which the specification already collects. It also stops for
    representations with target_independent_groups = 0, where rho_D = 1 by
    definition and the ceiling is 1.00.

  novelty_status: unverified

  citations:
