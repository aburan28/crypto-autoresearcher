    controls:
      - >-
        DEGREE-PROFILE-MATCHED PLANTED BOOLEAN CONTROL (blocking, the null
        object): identical bipartition, identical degree histogram, planted
        Boolean root. The ceiling is a count and must reproduce there. Only the
        EXCESS over this control may be described as structural.
      - >-
        direct_t3 ZERO-REUSE CONTROL (blocking): must return 1.00 within 0.05.
      - >-
        K = 1 DEGENERATE CONTROL (blocking): a one-target batch must return
        exactly 1.00, since nothing can be amortized over one target.
      - >-
        FIXED-FINGERPRINT INVARIANT, which EXP-SBRG-60c55e already specifies as
        CTRL-SBRG-FIXED-FINGERPRINT with failure_effect harness_void. If S_struct
        is not bit-identical across the targets of a batch, the bipartition does
        not exist and no number from that cell means anything.
      - >-
        KNOWN-DECOMPOSITION CORRECTNESS ARM, EXP-SBRG-60c55e's
        CTRL-SBRG-KNOWN-DECOMPOSITION: a planted decomposable target must satisfy
        every descended equation, or the harness is void.
      - >-
        MATCHED POLLARD RHO on the same instances, counted under one frozen
        operation convention declared before any cell runs, so the charged gain
        in Stage 4 is a ratio of comparable quantities.
      - >-
        BASIS AND ORIENTATION NULLS: rho_D and the ceiling are basis- and
        orientation-free by derivation, so the predicted speedup must be
        invariant across power/normal bases and prefix/random orientations. Any
