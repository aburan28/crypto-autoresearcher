    required_metrics:
      - 'rows_struct, rows_targ, r_struct, r_full per cell'
      - 'measured Boolean degree histogram per generator block'
      - 'rho_D computed from the histogram, and 1/(t-1) alongside it'
      - 'baseline, offline and online XOR counts, separately, per cell'
      - 'xor_speedup at K in {1, 2, 4, 8} so the K-dependence can be fitted'
      - 'excess xor_speedup against the degree-profile-matched control'
      - 'sparse_density in the baseline and online arms'
      - 'peak RSS and wall time per cell, against the predicted 1 GiB bound'
