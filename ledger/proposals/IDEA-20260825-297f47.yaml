  batch: EC-STRUCTURE-20260825
  cluster: 'C7-targets: what structure the real curves actually carry'
  title: 'MEASURE THE BASELINE BEFORE MEASURING ANYTHING AGAINST IT: a fully charged measurement of the
    realized rho constant on j = 0, j = 1728 and generic curves, with the automorphism quotient and its
    fruitless-cycle penalty both charged, so that every constant-factor claim in this batch and elsewhere
    becomes checkable'
  class: control
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: 'The sqrt(|Aut|) automorphism speedup and the fruitless-cycle problem are published and
    recalled. The proposed contribution is none at all mathematically: this is the baseline measurement
    the ledger records as never having been made here, and several ideas in this very batch would be uninterpretable
    without it.'
  claim:
    semantic_part: Quotienting the rho walk by Aut(E) and by inversion gives at most a sqrt(|Aut(E)|)
      factor, partially cancelled by the cost of detecting and escaping fruitless cycles; the realized
      constant is a measurable quantity that this program compares against but has never measured.
    evaluator_part: 'Unestablished: the realized constants. That is what the measurement is for; no value
      is asserted here.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Implement r-adding and tag-tracing walks with and without the automorphism quotient, on curves with
    |Aut| in {2, 4, 6}.
  - 'Charge everything in a single unit: group operations including the quotient''s normalization, cycle
    detection, escape steps, and distinguished-point overhead.'
  - Measure the realized expected step count against the theoretical sqrt(pi N / 2) / sqrt(|Aut|), and
    report the ratio with its variance across many instances and seeds.
  - Publish the constants as the program's reference baseline, with the exact code and seeds, so that
    later comparisons are against a measured number rather than a formula.
  lossy_projection_test:
    tracked_object: the walk state modulo the automorphism group
    what_is_discarded: the representative within the orbit
    propagation: deterministic on orbits, which is exactly why the quotient works and also why fruitless
      cycles appear
    verdict: PASSES; this is the textbook example of a useful lossy projection and is included as the
      batch's calibration point.
  predictions:
  - id: P1
    status: established_formula
    statement: The expected step count of rho on a group of order N is sqrt(pi N / 2) up to lower-order
      terms.
  - id: P2
    status: unestablished
    statement: The realized quotient gain is strictly below sqrt(|Aut|) once fruitless-cycle handling
      is charged.
  - id: P3
    status: unestablished
    statement: The realized constant is stable across curves of the same |Aut| to within the measured
      band.
  minimal_discriminating_test:
    status: specified_not_run
    test: Many toy instances per curve class, many seeds, both walk variants, all costs in one unit; report
      the constants with confidence intervals.
    pass: Constants are stable and reproducible from the published seeds.
    fail: High variance across instances of the same class is itself the finding and must be reported
      rather than averaged away.
  controls:
  - A generic curve with |Aut| = 2 as the reference class.
  - The unquotiented walk on the same curves as the direct comparison.
  - A random-mapping simulation of the same state-space size as the theoretical null, to separate walk-design
    effects from group effects.
  confounders:
  - Wall clock is not a unit; the ledger already records that as a decision criterion to retire, and this
    measurement must use charged operations.
  - Fruitless-cycle mitigation strategies differ; the strategy must be fixed and declared, since the constant
    depends on it.
  - Toy N makes lower-order terms significant; sizes must be swept.
  falsification:
    semantic: A realized gain exceeding sqrt(|Aut|) would falsify the theoretical bound and would need
      immediate independent replication.
    evaluator: A charging error scopes out that cell.
    not_falsification: High variance; that is a result.
  why_this_is_not_a_variant: IDEA-20260815-3c9919 records that rho's constant has never been measured
    in this program and proposes measuring it. This record narrows that to the automorphism-quotient question
    specifically, because that is the constant every endomorphism- and automorphism-based claim in the
    ledger is implicitly compared against, and it is the one this batch's cluster 2 needs.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No improvement. Baseline calibration; its absence is why several existing constant-factor readings
      cannot currently be checked.
    dominated_by:
    - Pollard rho on every realized end-to-end ECDLP cost in this ledger
    axes:
    - time
    - memory
    - preprocessing
    - queries
  estimated_cost: toy scale; moderate, dominated by replication count
