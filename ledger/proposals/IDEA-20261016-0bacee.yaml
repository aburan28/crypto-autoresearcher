idea:
  id: IDEA-20261016-0bacee
  question_id: RQ-CZLIFT-b9f765
  added: '2026-10-16'
  title: >-
    Break-even line for full-value section predictors: Smart-ratio success rate
    rho beats the rho algorithm only above c/sqrt(n), where the Weil allowance
    does not exclude it
  class: control
  claim: >-
    O = any cheap procedure outputting one candidate for dlog_P(R) (the lane's
    Smart ratio), success rate rho over uniform R. (A) Under H1 (wrong outputs
    near-uniform, independent): draw m random e, query R_i=Q+e_i*P, keep c_i-e_i,
    output a value seen twice. Succeeds w.p. >=1/2 once m>=2/rho and m^2/(2n)<=1/4,
    i.e. rho>=2*sqrt(2/n), at cost 2*T_O/rho. Break-even: rho*=max(1.9*T_O/T_add,
    2.8)/sqrt(n), the 1.9 taken against the measured toy prime baseline
    (negation-map BSGS 1.160 x sqrt(pi/4) sqrt(n) = 1.03 sqrt(n) additions at 0.50
    sqrt(n) memory, KR-RHO-cd0049; rho.negation 1.30 sqrt(n) would give 1.5); the
    draft constant 1.6 used the textbook 1.25 sqrt(n). Toy tier (log2 n 17.7-24),
    constant level only. (B) The bit-predictor line of IDEA-20260905-b6154d is
    eps*=n^(-1/4); a full-value event has no small L1 character norm, and the Weil
    ceiling for a degree-k defect function, rho_W~C*k*log n/sqrt(p) (recalled
    Kohel-Shparlinski form, unopened), has the SAME order as rho*: Weil does not
    exclude a break-even section; exact behaviour must (IDEA-20261016-8961d2). (C) The lane's
    ~1/p sections sit a factor ~sqrt(p)/C below the line; the amplifier on their
    real outputs recovers d at the oracle's own rate.
  mechanism: >-
    PAIR: representation = candidate-valued predictor; Sigma = random
    self-reduction R->R+eP (translation by a known multiple: BRANCHING, which
    turns probability rho per query into a collision test). TRICHOTOMY:
    branching; (L,b): L=1-rho per query, b=m candidates. LOSSY TEST: one value of
    Z/n per query kept; compatible with Sigma since translation shifts the truth
    by e, undone by subtracting e. PRICE: m*(T_O+O(1)), hash of m values.
    Birthday collision of KR-RHO-6239aa on predictor outputs; cannot beat
    sqrt(n) unless rho>1/sqrt(n), consistent with KR-RHO-13bf67 (the predictor
    reads coordinates, so is non-generic). Memory m~sqrt(n) is comparable to
    BSGS, so BSGS is the fair constant baseline.
