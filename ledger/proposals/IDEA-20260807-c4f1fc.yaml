idea:
  id: IDEA-20260807-c4f1fc
  question_id: RQ-SLHDSA-001
  added: '2026-08-07'
  title: The hash and permutation primitives underneath SLH-DSA -- and under every standardized
    scheme in this corpus -- are modelled as IDEAL OBJECTS in every record and probed in none;
    seven catalogued symmetric-cryptanalysis techniques sit unused while the one scheme whose
    security rests entirely on hash properties has four targets, none of which is the hash
  class: mechanism
  claim: 'RQ-SLHDSA-001 states the scheme''s assumption is ''properties of the underlying hash
    function only (no structured algebraic assumption)'' -- and then lists four targets, NONE
    of which is the hash function: bound tightness, concrete multi-target FORS cost, the quantum
    cost convention, and fault chains. All four proposals under it (IDEA-20260801-009, IDEA-20260805-fbe36a
    on the occupancy moment, IDEA-20260805-705614 on quantifier order, IDEA-20260805-88ecef on
    the cost-convention register) and H-SLHDSA-3a403a treat F, H, T_l and PRF as black boxes.
    The single mention of Keccak anywhere in the ledger, in IDEA-20260805-5194f9, is the explicit
    statement that it is ''modelled as a random oracle throughout and no property of Keccak is
    used''. In EXP-FAEST-51f781 and EXP-FAEST-ae5d9f, SHAKE256 appears only as a source of randomness
    for drawing toy instances. NO RQ, GOAL, HYPOTHESIS, PROPOSAL OR EXPERIMENT IN THE REPOSITORY
    TREATS A HASH FUNCTION OR UNKEYED PERMUTATION AS A CRYPTANALYTIC TARGET. KN-TECH-066 (differential
    cryptanalysis of hash functions and permutations -- message modification, rebound, internal
    differentials) is cited by zero ledger and zero experiment records; KN-TECH-073 (cube attacks)
    and KN-TECH-074 (division property) are cited once and twice, both only on the AES side.'
  mechanism: 'Do NOT open a generic Keccak cryptanalysis lane -- that is a large field with a
    large literature and this program has no comparative advantage in it. Instead take the STRUCTURED-INPUT
    AXIS THAT IS SPECIFIC TO SLH-DSA: its tweakable hash is evaluated on ADRS-domain-separated
    inputs under ONE FIXED PUBLIC SEED over a PUBLICLY COMPUTABLE index set of size 2^h, so the
    reachable input set is neither random nor attacker-free. Ask whether the multi-target advantage
    that the interleaved-target bound charges GENERICALLY is enlarged, or provably not enlarged,
    by that deterministic structure. That is a question about the CONSTRUCTION''S USE of the hash
    rather than about the hash, it is answerable at reduced output sizes with a certificate, and
    it is where a scheme-specific result could exist that the general literature would not contain.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - No record treats a hash or unkeyed permutation as a cryptanalytic target.
    - The AES campaigns study a KEYED block cipher under chosen-plaintext and adaptive access
      with a secret key. A sponge permutation with a public, attacker-chosen internal state is
      a different threat model with a different tool set -- the rebound and internal-differential
      family of KN-TECH-066 exists precisely because the keyed tools do not transfer. Nothing
      in the AES campaigns' completion criteria, stated in round counts and key sizes, reaches
      an unkeyed permutation.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: generic Keccak/SHA-3 cryptanalysis,
      and the four existing SLH-DSA targets (bound tightness, FORS multi-target cost, quantum
      convention, fault chains). The object is the REACHABLE INPUT SET induced by ADRS domain
      separation under a fixed seed.'
    tracked_object: The reachable tweakable-hash input set as a subset of the domain, tracked
      by its size, its structure under the ADRS encoding, and the collision probability restricted
      to it.
    one_step_propagation_rule: Each additional signature extends the reachable index set by a
      publicly computable amount; the restricted collision probability updates deterministically
      given the set.
    newness_score: 'Generic hash cryptanalysis: nil, and deliberately avoided. The construction-specific
      reachable-set question: not framed anywhere in this corpus and plausibly not the subject
      of the general literature either.'
  lossy_projection_identifiability_audit:
    projection: the full hash domain -> the ADRS-reachable subset under one public seed.
    what_is_discarded: Every input the construction cannot reach, which is almost all of them.
    is_it_only_a_change_of_coordinates: 'NO -- the reachable set is a vanishing fraction of the
      domain and its structure is dictated by the ADRS encoding, which is public and rigid. Honest
      caveat: if the ADRS encoding behaves like a random injection on the index set, the restricted
      collision probability is the generic one and the answer is a forced value.'
    mirror_failure_check: 'CHECKED. The failure would be a restricted probability that equals
      the generic one by construction under any encoding. It does not: a deliberately degenerate
      ADRS encoding (constant in some field) would raise it, which gives the instrument a control
      that must fire.'
  null_object_control:
    primary_null: 'A RANDOMIZED-ADRS VARIANT: replace the deterministic ADRS encoding by a random
      injection into the same index set and measure the same restricted collision statistic. If
      the deterministic and randomized encodings agree, the structure buys the attacker nothing
      and the generic multi-target bound is not enlarged -- a clean forced-value closure.'
    secondary_nulls:
    - 'DEGENERATE-ADRS POSITIVE CONTROL: an encoding constant in one field MUST raise the restricted
      collision probability measurably, or the instrument cannot detect the effect it is looking
      for.'
    - 'REDUCED-OUTPUT CERTIFICATE: at reduced output sizes every claimed collision is exhibited
      and re-verified independently, per docs/claims-and-verification.md.'
  assumptions: []
  predictions:
  - metric: restricted multi-target collision probability under the deterministic ADRS encoding
      versus the randomized-injection null
    direction: different
    minimum_effect: Any ratio bounded away from 1 at reduced output sizes, replicated across seeds.
  minimal_test:
    design: At reduced tweakable-hash output sizes (small enough that the multi-target search
      is exhaustive and certifiable), enumerate the ADRS-reachable input set for a small h, measure
      the restricted multi-target collision probability, and compare against the randomized-ADRS
      null and the degenerate-ADRS positive control. Every collision carries a certificate the
      wrapper re-verifies.
    controls:
    - randomized-ADRS injection null
    - degenerate-ADRS positive control
    - independent certificate re-verification
    required_metrics:
    - restricted collision probability per encoding per output size
    - ratio to the randomized null with CI
    - reachable-set size and structure summary
  falsification_conditions:
  - 'Deterministic and randomized encodings agree: the ADRS structure provably does not enlarge
    the multi-target advantage, which is a durable positive statement about the standard and exactly
    the kind of result RQ-SLHDSA-001''s ''slack measurement is the durable output'' framing wants.'
  - 'They differ: the interleaved-target bound is charged generically where the construction is
    not generic, which would be a real finding about FIPS 205''s analysis and would need immediate
    red-teaming.'
  - 'The degenerate-ADRS control does not fire: the instrument cannot see the effect and no reading
    is admissible.'
  confounders:
  - Reduced output sizes change the collision regime; the extrapolation to full sizes must be
    stated as extrapolation and is the main limit.
  - The reachable set depends on h and on the tree parameters; report per parameter set.
  - A random injection is not the same null as a random oracle; state which is used and why.
  interpretation_limits:
  - Reduced-output results do not transfer to FIPS 205 parameters without a stated argument.
  - This is a question about the CONSTRUCTION's use of the hash, not about SHA-3 or SHAKE.
  - SLH-DSA is the standardized set's fallback and RQ-SLHDSA-001 argues its assumption is 'the
    one this program has the least reason to doubt'; nothing here disputes that.
  heuristic_assumptions:
  - id: HEUR-SLHADRS-1
    statement: Restricted collision behaviour at reduced output sizes is directionally representative
      at full output sizes.
    rigorous_support: None. This is the standard reduced-round/reduced-width caveat.
    validation_plan: Measure at three output sizes and report the trend rather than a point.
  target_complexity:
    time_exponent: The interleaved-target bound's exponent; this record measures whether the construction's
      structure changes the constant in front of it.
    memory_exponent: Multi-target search memory, reported per experiment.
    best_known: The FIPS 205 interleaved-target bound as published.
    hidden_overhead: The reachable-set enumeration cost, charged explicitly.
    tradeoff_note: A structure that does NOT enlarge the advantage is the expected outcome and
      is the more likely durable contribution.
  dominated_by: 'The published FIPS 205 analysis dominates; no attack is proposed. Rows checked:
    generic multi-target preimage search, the interleaved-target bound, and Grover-accelerated
    search under the stated quantum convention.'
  sota_delta: ZERO. Would give the corpus its first use of seven catalogued symmetric-cryptanalysis
    techniques, and puts a measurement behind the one axis of the standardized set's fallback
    scheme that no record examines.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that the reduced-size measurement is executable with certificates.
    0.75 that the deterministic and randomized encodings agree, i.e. the structure buys nothing
    -- the modal and still-valuable outcome. 0.1 that they differ measurably. 0.02 that any difference
    survives extrapolation to FIPS 205 parameters.
