  assumptions:
    - A degree-2 map E -> P^1 over K is f_D, D in Pic^2(E)(K) = E(K) after choosing O; translation by Q in E(K) identifies T and T + 2Q.
  proof_search_map:
    bottleneck: the floor was computed over x only; other degree-2 functions are unexamined
    baseline_embedding:
      parameter_slice: T = 0, n = 3 (q = 5, 7), n = 5 (q = 3) records
      reproduction_check: extended tool reproduces every sibling record at T = 0
    observation_collision:
      observable: cycle type of B_T under Frobenius
      distinct_preimage_search: two E with equal cycle type and different genus; expected via the orbit position of B_T
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: enumerate K-stable 4-sets of type (2,2) / (4) directly and read the curve off the cross-ratio
        predicted_gain: avoids the structure scan, as the n = 5 study's next step did for T = 0
    quantifier_order: for all E/K with j not in F_q, for all T in E(K)/2E(K), for all structures tau
    method_ceiling:
      strongest_certifiable_claim: the T != 0 genus spectrum and the min over all degree-2 functions
      nearby_object_control: odd-order curves, where only T = 0 exists
    proof_obligations:
      - claim: torsor Frobenius type from H^1 and the three orbit cases
        responsibility: correctness
  predictions:
    - metric: cycle type of B_T per (E(K)[2] type, T)
      direction: equals
      minimum_effect: "table above, exact on every curve of the fixtures"
    - metric: smallest nontrivial T != 0 genus at n = 3, 5, 7
      direction: equals
      minimum_effect: "3, 25, 161"
    - metric: split n = 3 curves whose minimum drops once T != 0 is allowed (q = 5, 7, 11)
      direction: higher
      minimum_effect: "> 0; every Type 2 curve has (Z/2)^2 torsion"
    - metric: n = 5, q = 3 curves whose minimum drops with T != 0
      direction: equals
      minimum_effect: "0 of 488"
  minimal_test:
    design: >-
      (0) Write the torsor and orbit derivation, including n = 7. (1) Extend cover_census_n.rs with a base
      branch-set argument; at T = 0 reproduce every n = 3 (q = 5, 7) and n = 5 (q = 3) record exactly. (2) For
      T != 0 enumerate K-stable (2,2) and (4) 4-sets up to PGL2(F_q), form the curve from the cross-ratio, record
      (m, r, g) and the 2-torsion type. (3) Compare, per curve, the minimum over T. (4) Second implementation,
      written blind, recounts a subset.
    controls:
      - "Positive: T = 0 records of the sibling census reproduced exactly; Joux-Vitse hyperelliptic genus-3 count at q = 7."
      - "Negative: odd-order curves have no T != 0, so the extended minimum equals the sibling minimum on all of them."
      - "Nearby object: the 3+3 type (m,r) = (2,6) from the x-line, to separate it from the single 6-orbit."
    required_metrics: [q, n, "E(K)[2] type", T class, cycle type, "(m, r, g)", minimum by T, coverage]
  falsification_conditions:
    - A (2,2) or (4) configuration with genus outside the listed sets refutes the orbit analysis.
    - A K-rational branch point for T != 0 refutes the torsor-type table.
    - No n = 3 curve gains genus 3 from T != 0 (G = 0) refutes the identification of Type 2 with T != 0.
  confounders:
    - Characteristic 3 at q = 3; use q >= 5 for n = 3. Curves with j in F_q give g = 1 (descended); separate rows.
  interpretation_limits:
    - Genus only; descent to F_q and transfer injectivity of a T != 0 cover are open. Bounded q.
  heuristic_assumptions:
