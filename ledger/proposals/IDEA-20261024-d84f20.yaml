      statement: The map from shared-orbit (2,2) configurations to j is equidistributed on the split locus with fibre at most 24.
      rigorous_support: degree of the cross-ratio map; count ~ q^(2n)/(q^3 n) against q^n curves
      validation_plan: compare configuration and curve counts at n = 3, q = 5, 7, 11, 13 and the ratio to the split share.
