idea:
  id: IDEA-20260815-86b09c
  question_id: RQ-SSIQ-9702af
  added: '2026-08-15'
  title: >-
    THE CLAW-FINDING TABLE IS KEYED AND ITS COLLISION BEHAVIOUR DETERMINES
    THE ALGORITHM'S SUCCESS: measure the table's actual key collision rate
    at toy primes against the uniform-hashing assumption
  class: measurement

  claim: >-
    The p^(1/3) algorithm builds a keyed table of smooth-degree isogenies
    and finds claws by matching keys. Its size and runtime bounds assume the
    keys behave like uniform hashes. Isogeny codomains are algebraic objects
    with real structure, and if their keys collide more than uniformly the
    table is smaller than the bound assumes and the success probability
    changes.

  mechanism: >-
    At toy supersingular primes, build the table as specified and measure
    the actual distribution of key collisions against the uniform-hashing
    prediction. Report the deviation and its trend in the table size.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of the algorithm's Lemma 3.2 table-size bound and Algorithm 1;
      grep 'claw finding', 'keyed table', 'collision rate'.
    results: >-
      The table bound is recorded; no record measures the key collision
      behaviour it assumes.
    verdict: >-
      UNVERIFIED. Table construction is specified in the source and
      hashing assumptions are standard; whether the collision behaviour
      has been measured for this specific table is the stage-one
      literature question.

  object_first_candidate:
    tracked_object: >-
      THE KEY COLLISION DISTRIBUTION of the claw-finding table, against
      the uniform-hashing prediction.
    lossiness: >-
      The table-size bound projects the table's structure onto a count,
      which is accurate only if keys distribute as assumed.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at toy primes where the table is fully constructible; table
      size grows with the prime and bounds the reachable range sharply.

  null_object_control: >-
    NULL 1 -- random keys of the same length and count, giving the uniform
    prediction directly. NULL 2 -- a deliberately colliding key function,
    which must show excess collisions; a measurement insensitive to that
    detects nothing.

  discriminated_from:
    - >-
        The exponent-factor ranking record in this series, which idealises
        the table-size factor; this measures whether the factor's premise
        holds.
    - >-
        The tail-resampling record in this series, which concerns the
        smoothness heuristic; the table's collision behaviour is an
        independent assumption.

  assumptions:
    - >-
        The table is fully constructible at toy primes, which requires the
        smooth-degree isogeny enumeration to be feasible there.
    - >-
        The key function is specified precisely enough in the source to
        implement faithfully; an approximated key function would measure
        the approximation.

  predictions:
    - metric: >-
        random-key null
      direction: different
      minimum_effect: >-
        FORCED to match the uniform prediction, calibrating the
        measurement.
    - metric: >-
        deliberately colliding key null
      direction: different
      minimum_effect: >-
        FORCED excess collisions detected.
    - metric: >-
        measured collision rate against uniform prediction
      direction: different
      minimum_effect: >-
        The measurement; excess collisions mean the effective table is
        smaller than the bound assumes.
    - metric: >-
        deviation trend in table size
      direction: different
      minimum_effect: >-
        A deviation that grows with table size matters at scale; one
        that shrinks is a small-table artifact.

  minimal_test:
    design: >-
      Two toy primes, full table construction, both nulls.
    controls:
      - >-
          Random-key uniform calibration.
      - >-
          Deliberately colliding key sensitivity null.
      - >-
          Key function implemented from the source specification, with
          any approximation recorded.
      - >-
          Table size and prime reported together, since the deviation
          trend is what transfers.
    required_metrics:
      - >-
          Collision distribution per prime against the uniform
          prediction.
      - >-
          Deviation trend in table size.
      - >-
          Both null outcomes.
      - >-
          Any approximation in the key function, recorded.

  falsification_conditions:
    - >-
        A null misbehaves. Measurement wrong.
    - >-
        Collisions match the uniform prediction. The table bound's premise
        holds at toy scale, which is worth establishing since the exponent
        depends on it.
    - >-
        Excess collisions that grow with table size. The effective table
        is smaller than the bound assumes and the algorithm's success
        probability analysis needs revisiting, which would be a
        substantive finding about a result this program treats as its
        exemplar.
    - >-
        The key function cannot be implemented from the specification. The
        measurement is not possible and that gap in the source should be
        recorded.

  confounders:
    - >-
        SMALL-TABLE ARTIFACTS: at toy primes the table is small and
        collision statistics are noisy, so only a trend across sizes is
        interpretable.
    - >-
        KEY-FUNCTION APPROXIMATION: implementing a slightly different key
        function than specified would measure the approximation rather
        than the algorithm.

  interpretation_limits:
    - >-
        Measures one assumption of a published algorithm at toy scale;
        makes no claim about the algorithm's correctness.
    - >-
        Scoped to the tested primes and the implemented key function.
    - >-
        An excess-collision finding at toy scale does not transfer to
        cryptographic primes without the trend supporting it.

  heuristic_assumptions:
    - id: HEUR-SSIQ-KEY-1
      statement: >-
        The claw-finding table's keys collide as uniform hashes of the
        same length would.
      rigorous_support: >-
        Rigorous ingredient: the table-size bound of Lemma 3.2 counts
        entries and is exact; the runtime analysis then assumes lookups
        behave as hash lookups. THE GAP: the keys are derived from
        isogeny codomains, which are j-invariants in a structured set
        rather than random values, and no argument in the source
        establishes that the derived keys are uniform -- which is
        exactly the assumption being tested.
      falsification_condition: >-
        A collision rate exceeding the uniform prediction with a
        deviation that grows in table size.
      validation_plan: >-
        SAMPLE: >= 2 primes with full table construction, plus random-
        key controls at matched size. COMPARISON: collision distribution
        against the uniform prediction, per size. TAIL CHECK: the most-
        collided keys, reported with their j-invariants to check for
        structural clustering. TRANSFER: only the trend transfers, and
        it is stated as such.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is full table construction plus collision
      counting per prime.
    memory_exponent: >-
      The table itself, which is the binding constraint on reachable
      primes.
    best_known: >-
      The incumbent is the published algorithm and its table-size bound,
      whose hashing premise this measures rather than improving.
    hidden_overhead: >-
      Table size grows with the prime, so full construction caps the
      reachable range far below anything cryptographic.
    tradeoff_note: >-
      Larger primes give more meaningful statistics and grow the table
      beyond memory; the record reports the trend it can reach.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As an algorithm: dominated by the published
    source. As a measurement of its hashing premise: none exists here. Not
    null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: measured key collision
    behaviour for the claw-finding table at toy primes against the uniform-
    hashing prediction the algorithm's analysis assumes, with a size trend
    that says whether any deviation matters at scale.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.6 that the table is fully constructible at two toy primes. 0.7 that
    the key function is implementable faithfully from the source. 0.2 that
    excess collisions appear with a growing trend, which would be a
    substantive finding about this program's exemplar result.

  status: proposed
