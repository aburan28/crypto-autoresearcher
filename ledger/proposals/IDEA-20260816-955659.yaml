idea:
  id: IDEA-20260816-955659
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: 'Write the module-LIP to nrd-PIP to subfield chain with explicit quantifier order and run
    the method-ceiling audit: does any witness depend on the instance in a way the uniform conclusion
    forbids, and what could the representation search prove even with density one?'
  class: theory
  claim: '(A) The route this corpus records is a chain: HAWK''s rank-2 module-LIP instance, a reduction
    to nrd-PIP, a re-randomisation over representations, and a subfield solve on whichever representation
    turns out tractable. KN-OPEN-028 records that the reduction is real and was used offensively,
    that the re-randomisation mechanism survives, and that the density estimate failed. What no record
    contains is the chain written with explicit universal and existential quantifiers in order. Under
    docs/inventor-protocol.md section 8 items 3 and 4 that is a required pre-compute audit for any
    reduction or asymptotic claim, and it has never been run on this chain. (B) The claim is that
    the audit is performable from committed records alone and produces two concrete outputs. Output
    one, the quantifier trace: for each link, whether the witness (the reduction''s auxiliary data,
    the conjugating matrix, the subfield) is allowed to depend on the instance, on the parameter,
    on a random seed, or on nothing - and whether any link''s uniform-sounding statement conceals
    a witness that varies where the composed conclusion needs it fixed. Output two, the method ceiling:
    assume the failed density heuristic had held perfectly, i.e. set the easy-instance density to
    1, and ask what the chain would then prove. If the ceiling under that maximally generous assumption
    is still bounded away from the composed conclusion by some other link, then the density was never
    the binding constraint and the recorded failure was diagnosing the wrong link - which would be
    a substantive and cheap finding. If the ceiling is exactly the composed conclusion, then density
    was the sole binding constraint, which confirms the recorded diagnosis and sharpens it. (C) The
    claim is that the audit also supplies the nearby-object control section 8 item 4 requires: apply
    the same chain to the closest object where the desired conclusion should fail - a plain (non-module)
    LIP instance of the same dimension - and check whether the chain distinguishes them; a chain that
    does not has not identified the load-bearing structure. (D) NOT CLAIMED: that any link is wrong;
    that the recorded diagnosis of Heuristic 4''s failure is mistaken - EV-HAWK-c99848 identifies
    the omission of fractional ideals precisely and is consumed here as settled; that KN-OPEN-028
    is reopened; that any attack, improvement or security consequence follows; and no statement about
    HAWK''s security in either direction.'
  mechanism: 'Stage 1 writes each link as a formal statement with its quantifiers explicit and its
    witness named: for all instances of shape S there exists auxiliary data A such that property P
    holds; or for all instances there exists a conjugator U such that the attached instance is easy
    - and it is precisely at this second one that the order matters, because ''for all G there exists
    U'' is compatible with U depending on G in an uncomputable way, while the algorithm needs U to
    be FOUND by sampling, which is a strictly stronger requirement with a different quantifier shape.
    Stage 2 composes the links and checks whether the composition''s quantifier order is derivable
    from the parts or whether it requires a swap - an exists-forall to forall-exists exchange being
    the classic invalid step, and the audit''s first target. Stage 3 runs the method ceiling: replace
    the failed density heuristic with the most generous possible assumption (density 1, every conjugate
    easy) and recompute what the chain concludes, link by link, keeping every other stated cost. Whatever
    bound survives that substitution is the method''s ceiling, and comparing it to the composed conclusion
    says whether density was the binding link. Stage 4 runs the nearby-object control: instantiate
    the chain''s first link on a plain LIP instance of matched dimension, and determine at which link
    the chain fails to apply - a chain failing only at the last link would mean the module structure
    is doing less work than the route''s framing suggests. Stage 5 runs the observation-collision
    audit of section 8 item 2 on the chain''s observable, which is the conjugated Gram matrix''s attached
    nrd-PIP instance: search symbolically for two distinct secret bases producing the same attached
    instance, since a collision falsifies identifiability unless a further condition separates them.
    Stage 6 emits the quantifier trace, the ceiling, the nearby-object failure point and the collision
    result, and asserts nothing beyond them.'
  novelty_status: unverified
  novelty_screen:
    method: Read docs/inventor-protocol.md section 8 in full (baseline reproduction, observation collision,
      quantifier order, method ceiling and nearby-object control, plus the constructive transform
      list). Read knowledge/open-problems/KN-OPEN-028.md in full including all three closure blocks
      and the live-surface route table; read KN-OPEN-027.md in full. Read ledger/evidence/EV-HAWK-c99848.yaml
      and EV-HAWK-21edba.yaml in full. Read knowledge/techniques/KN-TECH-081.md in full including
      the three-settings table and the two-stage discipline. Grep -ril 'hawk|module-lip|nrd-pip|nrdpip|lattice
      isomorphism' over ledger/proposals/ (11 files, all titles read). Read ledger/questions/RQ-HAWK-001.yaml
      in full.
    results: Nothing in the 11 HAWK-touching proposals performs a quantifier-order or method-ceiling
      audit; they divide into the tau-cocycle and involution lattice constructions (IDEA-20260805-6eac55,
      IDEA-20260805-128f35, IDEA-20260808-b1358c), cost-model audits (IDEA-20260805-3a855d, IDEA-20260807-90479e),
      an attack reimplementation (IDEA-20260801-019), cross-scheme transfers (IDEA-20260805-f58517)
      and isogeny-side records. CLAUDE.md records that section 8's proof_search_map is required of
      any proof-oriented proposal, reduction or closure argument BEFORE the coordinator approves implementation
      or expensive experiments - so this audit is arguably owed on the whole route and has not been
      filed. KN-TECH-081 supplies the material the nearby-object control needs by separating the commutative,
      rank-1 non-commutative and rank-2 non-commutative PIP settings and warning that conflating them
      is the easiest way for this program to make a false hardness call. KN-OPEN-028's Q3 closure
      records that the reduction remains valid and that KN-OPEN-024 is unaffected, which bounds what
      the audit may conclude about the reduction link.
    verdict: 'UNVERIFIED. Claimed new: applying section 8''s quantifier-order and method-ceiling audits
      to this specific chain, and in particular the density-equals-one substitution as a way of testing
      whether the recorded failed link was the binding one. Assembled from known parts: the four audits
      are docs/inventor-protocol.md section 8 verbatim and are program policy, not an invention; the
      chain''s links are entirely as recorded in KN-OPEN-027, KN-OPEN-028 and the evidence records;
      the nearby-object control''s target (plain LIP) is the same matched pair another entry in this
      batch measures, used here symbolically rather than empirically. The novelty is the application
      and the ceiling substitution, not the method. This program cannot read external literature and
      asserts nothing about what exists outside.'
  object_first_candidate:
    tracked_object: 'The quantifier trace of the chain: an ordered list, one entry per link, recording
      the link''s quantifier prefix, the identity of its witness, and what that witness is permitted
      to depend on. What is followed through the computation is how this trace behaves under composition
      and under the density-equals-one substitution.'
    lossiness: 'Genuinely lossy. The trace discards every quantitative content of every link - all
      costs, all bounds, all constants - and retains only quantifier prefixes and dependency permissions.
      This is compatible with the operation of interest because composition of reductions acts on
      quantifier structure independently of the constants: an invalid quantifier exchange is invalid
      whatever the bounds are, and a valid one stays valid. What does not survive: any statement about
      how expensive anything is, which is why the ceiling stage must reintroduce the costs explicitly
      and separately rather than reading them off the trace. That two-part structure is deliberate
      and is stated rather than blurred.'
    propagation: 'One step of the target operation is composing two adjacent links. Under composition,
      quantifier prefixes concatenate and the composed witness''s dependency set is the union of the
      parts'' dependency sets - unless an exchange is performed, in which case the composition is
      invalid and the step is flagged. Propagation is therefore deterministic and locally checkable,
      which is what makes the audit finite: with four links there are three compositions to check
      and each check is mechanical once the prefixes are written.'
    survival_score: The trace survives all three compositions if and only if no exchange is required;
      the audit's output is exactly the composition index at which an exchange first appears, or the
      statement that none does. Concretely the structure is expected to survive links one and two
      (the reduction) and to come under pressure at link three, where 'there exists a conjugator making
      the instance easy' must be strengthened to 'a sampled conjugator makes it easy with non-negligible
      probability' - a strengthening that is a quantifier change disguised as a probability statement,
      and locating it precisely is the deliverable.
  null_object_control: 'The null object is a chain of the SAME SHAPE that is known to be sound: a
    short, uncontroversial reduction chain from elsewhere in this corpus - for example the two-stage
    PIP structure recorded in KN-TECH-081, where stage one (find a generator) and stage two (shorten
    it) compose in a way the entry states explicitly - written out in the identical quantifier notation
    by the identical procedure and audited by the identical checks in the same working session. For
    the audit to mean anything, the null chain must PASS: no exchange flagged, ceiling equal to its
    stated conclusion, nearby-object control failing where it should. If the audit flags problems
    in a chain known to be sound, the audit procedure itself is too aggressive and every flag it raises
    on the target chain is void. A second null is the trivial chain of one link, which must produce
    an empty composition check.'
  discriminated_from:
  - 'The heuristic-dependency-graph entry elsewhere in this batch: that tracks which heuristics have
    live consumers after a deletion. This tracks quantifier prefixes and witness dependencies across
    links, and its central move - the density-equals-one substitution - has no counterpart there.
    The two are complementary and could contradict each other, which would itself be informative.'
  - 'EV-HAWK-c99848''s Case C derivation: that identifies the arithmetic cause of the density failure.
    This audit takes that as settled and asks the orthogonal question of whether density was the binding
    link at all, by assuming it away.'
  - 'IDEA-20260805-3a855d and IDEA-20260807-90479e (cost-model audits): those charge concrete factors
    and gates in a cost model. This audit discards all costs at stage 1 by design and reintroduces
    them only in the ceiling stage; it is a logical audit, not an accounting one.'
  - 'KN-OPEN-028''s Q3 closure (the reduction remains valid, KN-OPEN-024 unaffected): the audit does
    not test the reduction''s validity, which that closure settles; it tests the quantifier shape
    of the composition, which the closure does not address.'
  - 'A generic proof-reading exercise: what makes this a contract rather than a reading is the density-equals-one
    ceiling substitution and the requirement that the whole procedure first pass on a null chain known
    to be sound, without which any flag raised is uninterpretable.'
  assumptions:
  - The links are statable from committed records at the granularity a quantifier trace needs; where
    a link's statement is held only in paraphrase, the trace entry is marked provisional and provisional
    entries cannot carry a flag.
  - An exchange, if present, is detectable by mechanical inspection of the prefixes rather than requiring
    the full proofs - true for the classic exists-forall swap and false for subtler dependencies,
    which is stated as a limit rather than assumed away.
  - Setting the density to 1 leaves every other link's stated cost intact and does not silently change
    another link's applicability; if it does, that coupling is itself the audit's finding.
  - A null chain known to be sound is available in this corpus at comparable granularity; KN-TECH-081's
    two-stage structure is proposed and must be approved as adequate.
  predictions:
  - metric: composition index at which a quantifier exchange is first flagged
    direction: different
    minimum_effect: 'forced value: link 3, the re-randomisation, where an existential over conjugators
      must become a probabilistic statement about sampled ones. A flag at link 1 or 2 would contradict
      KN-OPEN-028''s Q3 closure and would require re-derivation before reporting'
  - metric: method ceiling under density equals 1, compared to the chain's composed conclusion
    direction: different
    minimum_effect: 'forced value: equal. Predicted that with density 1 the chain does reach its stated
      conclusion, confirming density as the binding link; a ceiling strictly weaker than the conclusion
      would mean another link binds and would be the surprising and more valuable outcome'
  - metric: link index at which the chain fails to apply to a plain (non-module) LIP instance of matched
      dimension
    direction: different
    minimum_effect: 'forced value: link 1, the reduction, which should require module structure. Failure
      only at a later link would mean the module structure does less work than the framing suggests'
  - metric: number of flags raised on the null chain known to be sound
    direction: lower
    minimum_effect: 'forced value: 0. Any flag voids every flag raised on the target chain'
  - metric: number of distinct secret bases found producing the same attached nrd-PIP instance (observation
      collision)
    direction: different
    minimum_effect: 'refusal to pre-commit: a collision count depends on the attaching map''s fibres,
      which this corpus does not describe in enough detail to predict, and inventing a number would
      be a fabricated expectation'
  minimal_test:
    design: 'Zero compute. The entire contract is symbolic and its cost is human reasoning plus a
      text artifact. Write the four links with explicit quantifier prefixes and named witnesses; perform
      the three composition checks; perform the density-equals-one substitution and recompute the
      ceiling; instantiate the chain''s first link on a plain LIP instance and record the failure
      link; attempt the observation collision symbolically on the attaching map. Before any of that,
      run the identical procedure end to end on the null chain (KN-TECH-081''s two-stage PIP structure)
      and confirm it raises zero flags - this ordering is mandatory and is what makes the target-chain
      output interpretable. The discriminating outputs are four small values: the first-exchange composition
      index, the ceiling-versus-conclusion comparison, the nearby-object failure link, and the null
      chain''s flag count. If the null chain raises any flag, the run stops and reports the procedure
      as too aggressive, which is a complete result.'
    controls:
    - Null chain known to be sound (KN-TECH-081's two-stage PIP structure), audited first by the identical
      procedure, which must raise zero flags.
    - Single-link trivial chain, which must produce an empty composition check.
    - 'Provisional-entry rule: any link statable only from paraphrase is marked provisional and is
      barred from carrying a flag, so no flag rests on a paraphrase.'
    - Nearby-object control on a plain LIP instance of matched dimension, per section 8 item 4.
    - 'Independent re-statement: the four links are written out twice, once from KN-OPEN-027 and once
      from KN-OPEN-028 plus the evidence records, and disagreements between the two statements are
      reported rather than reconciled silently.'
    required_metrics:
    - quantifier prefix and named witness per link, with dependency permissions
    - composition index of the first flagged exchange, or none
    - method ceiling under density equals 1, stated as a formal conclusion, compared to the chain's
      composed conclusion
    - nearby-object failure link index for plain LIP
    - null chain flag count
    - count of provisional (paraphrase-only) link statements
    - disagreement count between the two independent link re-statements
  falsification_conditions:
  - 'The null chain raises any flag: the audit procedure is too aggressive and every target-chain
    flag is void.'
  - More than one of the four links is provisional, so the trace rests mostly on paraphrase and no
    flag may be raised at all.
  - The two independent re-statements of the links disagree materially, meaning the corpus does not
    determine the chain and the audit's output is that indeterminacy.
  - A flag is raised at link 1 or 2, contradicting KN-OPEN-028's Q3 closure that the reduction remains
    valid - which requires re-derivation before any reporting rather than publication.
  - The nearby-object control shows the chain applying to plain LIP through link 1, meaning module
    structure is not load-bearing where the route's framing places it.
  - The density-equals-one ceiling cannot be computed because another link's cost is not stated anywhere
    in the corpus, in which case the contract reports the missing cost as its output.
  confounders:
  - 'Every link statement is second-hand: this corpus records the route from an abstract, a 30/06
    update and a body reading by another session, and a quantifier detail can easily be lost in relay
    - which is why provisional entries cannot carry flags.'
  - The auditor writes both the trace and the prediction, so a flag can be manufactured by a slanted
    statement of a link; the two-independent-restatements control is the only defence and it is imperfect
    since the same agent performs both.
  - Setting density to 1 may be incoherent with other links (a density of 1 might contradict a counting
    statement elsewhere), and such incoherence would look like a ceiling finding; it must be checked
    and reported separately.
  - The null chain is chosen by the auditor, so an easy null makes the procedure look calibrated when
    it is not; the null must be of comparable link count and comparable statement granularity, and
    its selection is recorded in the specification.
  - Quantifier notation choices can hide dependencies inside a definition; the contract requires every
    witness's dependency set to be listed explicitly rather than implied by its symbol.
  interpretation_limits:
  - A quantifier flag is a statement about the chain AS THIS CORPUS RECORDS IT, not about the route
    as its authors would state it, and that gap cannot be closed without the source.
  - A method ceiling equal to the composed conclusion confirms density as the binding link under the
    recorded statements; it does not verify the underlying mathematics of any link.
  - Nothing here weakens or reopens KN-OPEN-028's closures, and in particular Q3's finding that the
    reduction remains valid bounds what this audit may conclude about links 1 and 2.
  - No attack, improvement, cost or security consequence follows from any output; this is a logical
    audit with no computational content.
  target_complexity:
    time_exponent: 'No attack exponent is claimed and none can be produced: the contract discards
      all costs at stage 1 by design and reintroduces them only as stated quantities in the ceiling
      stage, without deriving any new one.'
    memory_exponent: No attack memory exponent is claimed. The artifact is a few pages of text.
    best_known: The incumbent for HAWK-shaped key recovery in this corpus is Straznickas-Weis, unconditional,
      2^{(n/2+1)+o(n)} (KN-LIT-7592). This audit produces no attack and no bound, and does not enter
      that comparison. For the specific question of the chain's quantifier structure, the corpus records
      nothing at all, which is the gap.
    hidden_overhead: Essentially all of the cost is careful human reasoning, and essentially all of
      the risk is that the auditor writes a link in the shape that produces the predicted flag. The
      null-chain-first ordering and the two-restatement control exist to make that failure visible,
      but neither is airtight, and the honest position is that this contract's output should be independently
      re-audited by a different session before anything is built on it.
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    2^{(n/2+1)+o(n)} (KN-LIT-7592); nrd-PIP super-polynomial, underived (KN-LIT-7674); definite/indefinite
    LIP reporting HAWK unaffected (KN-LIT-7648); the SLIP AM-intersect-coAM ceiling (KN-LIT-7671)
    - plus generic lattice reduction on the 2n-dimensional lattice. This is a zero-compute logical
    audit claiming no result on any cost axis: n/a (no result claimed).'
  sota_delta: 'No attack; conceptual and audit contribution only. The quantities moved are four small
    values that currently do not exist anywhere in this corpus: the first-exchange composition index,
    the method ceiling under density one compared to the composed conclusion, the nearby-object failure
    link, and a null-calibrated flag count. Section 8 of docs/inventor-protocol.md requires exactly
    these before expensive experiments on a reduction, and none has been filed for this route.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (B), that the four links are statable from committed records at
    trace granularity with at most one provisional: 0.5 - the corpus is unusually explicit for this
    program but is still relaying a paper body read by another session. Part (B), that an exchange
    is flagged at link 3 specifically: 0.55, since the strengthening from ''there exists a good conjugator''
    to ''sampling finds one'' is exactly the kind of step that hides in a probability statement, but
    it may already be stated correctly. Part (B)''s ceiling half, that density equals one restores
    the composed conclusion (confirming density as the binding link): 0.7, with the 0.3 complement
    being the more valuable outcome. Part (C), that the nearby-object control fails at link 1 as expected:
    0.75. Probability the whole audit is void because the null chain flags: 0.2, and that outcome
    is reported as a procedure failure rather than buried.'
