  title: |-
    Small-root threshold for size-constrained decomposition (Coppersmith on S_3, S_4)
  class: measurement
  claim: |-
    The empirical 50%-recovery threshold beta* for S_3 is well below 1/2 and degrades further for S_4. Falsified if beta* >= 1/2 for S_3 or >= 1/3 for S_4 at any tested size.
  mechanism: |-
    Factor base F_beta = {P : x(P) < p^beta}. A relation R = P_1 + P_2 is a root (x_1, x_2) of S_3(x_1, x_2, x_R) = 0 mod p with |x_i| < p^beta. Bivariate Coppersmith / Howgrave-Graham lattices find such roots only when X*Y is small relative to p and the per-variable degree; S_4 is worse (degree 4 per variable, three variables, needs beta = 1/3).
  novelty_status: unverified
  citations:
  - ref: KN-LIT-037
    source_text: Coppersmith 1996
    provenance: kb
    claim: |-
      small modular roots recoverable up to N^{1/d} by LLL on a shifted-polynomial lattice; bivariate extension heuristic
    verified_by: intake-session-20261009 (coordinator role) opened KN-LIT-037
  - ref: Howgrave-Graham 1997
    source_text: Howgrave-Graham 1997
    provenance: recalled
    claim: dual lattice formulation of Coppersmith's method
    verified_by: null
  - ref: Jochemsz-May 2006
    source_text: Jochemsz-May 2006
    provenance: recalled
    claim: general strategy for multivariate small-root lattices and their bounds
    verified_by: null
  assumptions:
  - Coppersmith heuristics (algebraic independence of short lattice vectors)
  - |-
    Batch claim boundary: Every experiment is a bounded mathematical measurement on synthetic or known-answer instances at small p. No private-key recovery, no attack on deployed curves or keys. A working toy-p prototype is "finite control", never "subexponential ECDLP". Theorem-closed items can produce receipts, never results.
