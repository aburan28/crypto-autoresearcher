  falsification_conditions:
  - |-
    beta* >= 1/2 for S_3 or beta* >= 1/3 for S_4 at any tested size with planted roots and the linear-bivariate calibration passing.
  - |-
    A lattice code that fails the known linear-bivariate bound invalidates the run (instrument failure, not evidence).
  confounders:
  - |-
    BKZ block size and lattice dimension trade recovery for time; report beta* at the dimension sweep maximum and the dimension at first success.
  - |-
    Planted roots with structure (small y) could flatter recovery; roots are drawn uniformly in F_beta.
  interpretation_limits:
  - |-
    a low beta* is a negative result on this method, not a statement about prime-field ECDLP
  - |-
    Source status 'negative-control (live only if the threshold reaches beta >= 1/2)': expected negative with a quantitative output worth archiving (tables, exponents, thresholds)
  - Negative evidence closes only the exact tested scope (AGENTS.md rule 6).
