  predictions:
  - metric: beta_star_50pct_recovery_S3
    direction: lower
    minimum_effect: beta* < 1/2 at 40, 60 and 80 bits; beta* >= 1/2 at any size falsifies
  - metric: beta_star_50pct_recovery_S4
    direction: lower
    minimum_effect: beta* < 1/3 at every size; beta* >= 1/3 falsifies
  minimal_test:
    design: |-
      1. For p of 40, 60, 80 bits and random curves, plant known roots (P_1, P_2 in F_beta, R = P_1 + P_2).
      2. Run Coppersmith lattices (dimension sweep to ~200, LLL then BKZ-20) for beta in {0.10, 0.15, ..., 0.50}; record recovery rate.
      3. Repeat for S_4 with beta in {0.10, ..., 0.34}.
    controls:
    - |-
      planted roots (known answer); chance-level baseline with random roots; the same lattice code must first reproduce the known bound for a linear bivariate modular polynomial before S_3 numbers are trusted.
    required_metrics:
    - recovery rate vs beta
    - lattice dimension at first success
    - time per attempt
    - beta* (50% recovery) per polynomial and p-size
    stopping_rule: |-
      >= 30 instances per (p-size, beta); end a beta sweep after two consecutive beta with recovery < 5%
    replication:
      seed_policy: |-
        campaign-unique; derivation in coordination/intakes/20261009-snfs-ecdlp-ledger/manifest.yaml
      seed_base: 1917913400
