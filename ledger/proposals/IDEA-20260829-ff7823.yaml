idea:
  id: IDEA-20260829-ff7823
  question_id: RQ-SCURVE-6a4cd3
  goal_id: GOAL-SCURVE-cef9f7
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE SEED CHAIN IS NOT A SEQUENCE OF INDEPENDENT DRAWS - at l = 384 the NIST
    procedure has v = 2, so consecutive seeds share two of their three hash
    blocks. Track the BLOCK DECOMPOSITION of c rather than its integer value,
    derive the exact shift identity c(s) mod 2^160 = floor(c(s+1)/2^160) mod 2^160
    with no hashing at all, and settle whether the sharing makes the acceptance
    events along a seed scan dependent - which is the assumption every
    manipulation cost model in this family silently makes.
  class: mechanism

  claim: >-
    NIST P-384 is the only one of this program's three NIST rows with
    v = floor((l-1)/160) = 2, so its hash chain has THREE blocks where P-224 and
    P-256 have two. That is not a size detail; it changes the structure of the
    seed-to-curve map along the seed-increment direction, which is exactly the
    direction the SafeCurves manipulation model searches in. Four separable
    claims.

    (C1) AN EXACT IDENTITY, PROVED, NO HEURISTIC, NO HASHING NEEDED TO STATE IT.
    Write c(s) in blocks as specified by SP 800-186 C.3.1 with l = 384, hdigest =
    160, v = 2, w = 384 - 320 - 1 = 63:
      c(s) = h0(s) * 2^320 + H(s+1) * 2^160 + H(s+2),
    where H is SHA-1 as an integer, h0(s) is the 63 rightmost bits of H(s), and
    the seed increment is mod 2^160. Then for EVERY seed s,
      c(s) mod 2^160 = H(s+2) = floor(c(s+1) / 2^160) mod 2^160,
    and additionally
      floor(c(s+1) / 2^320) = h0(s+1) = H(s+1) mod 2^63
                            = (floor(c(s) / 2^160) mod 2^160) mod 2^63.
    THE SECOND RELATION IS THE INTERESTING ONE: the 63-bit top block of c(s+1) is
    the low 63 bits of the MIDDLE block of c(s). So consecutive c values agree in
    160 + 63 = 223 of their 383 bits, at shifted positions. This is a theorem about
    the standard's own text, it costs zero compute to check, and it is checkable
    against the published P-384 c by computing c(s+1) once.

    (C2) A RIGOROUS COST CONSEQUENCE, AND IT IS ONLY A CONSTANT FACTOR - SAID
    PLAINLY. A generator scanning consecutive seeds recomputes only ONE new SHA-1
    per candidate, not v + 1 = 3, because H(s+1) and H(s+2) are already in hand
    from the previous step. The hash stage of a P-384 seed scan therefore costs a
    factor of 3 less than the naive count. THIS IS A CONSTANT FACTOR AND IT DOES
    NOT MOVE ANY EXPONENT. It is also, per IDEA-20260829-0656b1, not the dominant
    cost - the point count is - so its practical significance is small. It is
    reported because it is exactly true and because a cost model that gets it wrong
    by 3x on the wrong term is a cost model nobody checked.

    (C3) THE FALSIFIABLE STRUCTURAL HYPOTHESIS, WHICH IS THE ACTUAL EXPERIMENT.
    Two theories of what the block sharing does to a seed scan, and they predict
    different measurements.
    THEORY A, COSMETIC SHARING. The map from c to b (via b^2 congruent -27/c) and
    thence to #E destroys the block alignment completely, so the acceptance events
    I(s), I(s+1), I(s+2), ... along a consecutive-seed scan are statistically
    independent Bernoulli(rho) draws. PREDICTED OBSERVABLE: the number of
    acceptances in a window of W consecutive seeds is Binomial(W, rho); the
    variance-to-mean ratio of window counts is 1 - rho, indistinguishable from the
    independent-seed control.
    THEORY B, PROPAGATING SHARING. The 223 shared bits induce measurable dependence
    in the acceptance events - most plausibly through I_qr, since the Legendre
    symbol of -27/c(s) and of -27/c(s+1) are symbols of two integers agreeing in
    223 of 383 bits. PREDICTED OBSERVABLE: overdispersion or underdispersion of
    window counts relative to Binomial(W, rho), detectable at W = 1000 and
    10^4 windows.
    THE MEASUREMENT SEPARATES THEM DIRECTLY AND EITHER OUTCOME IS A NUMBER THIS
    PROGRAM DOES NOT HAVE. Theory B, if true, means every manipulation cost model
    that treats a seed scan as independent draws - including the one implicit in
    the SafeCurves rigid page and the one in IDEA-20260829-0656b1 - is using the
    wrong variance, and the correction is measurable.

    (C4) A SHARPER AND CHEAPER PROBE OF THE SAME QUESTION, RUN FIRST. Before any
    curve is built, measure the correlation of the LEGENDRE SYMBOL alone:
    chi(-27/c(s)) versus chi(-27/c(s+1)) over 10^6 consecutive seeds, against the
    same over 10^6 independent seed pairs. PREDICTED correlation indistinguishable
    from zero in both, with the consecutive case bounded by Weil-type
    equidistribution. A nonzero correlation in the consecutive case ONLY would
    localise the dependence to the residuosity stage, which is the cheapest
    possible localisation and needs no point counting whatever.

  mechanism: >-
    THE TRACKED OBJECT is the BLOCK DECOMPOSITION VECTOR of c, that is the tuple
    B(s) = (h0(s), H(s+1), H(s+2)) of block contents together with their bit
    widths (63, 160, 160), rather than the integer c(s) they assemble to.

    LOSSY-PROJECTION TEST, applied BEFORE any experiment, and it is the reason
    this object is worth tracking rather than the integer.
    WHAT IS DISCARDED. The integer c is DISCARDED as an integer: its arithmetic
    meaning, its residue class, its size relative to p, and everything the
    subsequent b^2 congruent -27/c step does with it. Also discarded are 97 of the
    160 bits of H(s), since only the low 63 survive into h0. So a 480-bit hash
    triple plus a 384-bit assembly collapses to a labelled 383-bit string that
    remembers WHERE its blocks came from and forgets what they mean.
    IS IT A CHANGE OF COORDINATES? No, and the argument is exact rather than
    heuristic. From B(s) one cannot recover s: h0(s) is a 63-bit truncation of a
    160-bit digest, so at least 2^97 seeds share any given h0 by counting alone,
    and inverting SHA-1 on the other blocks is not available. From B(s) one also
    cannot recover the curve, since b requires a square root that may not exist.
    The fibre is enormous and the projection is genuinely one-way.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? THIS IS THE WHOLE POINT AND IT
    IS WHY THE BLOCK OBJECT IS THE RIGHT ONE. Under the operation that matters -
    SEED INCREMENT s -> s+1 - the block vector propagates by a SHIFT-AND-REPLACE
    that is deterministic and costs one hash:
      B(s+1) = (H(s+1) mod 2^63, H(s+2), H(s+3)),
    where the first two entries are computable from B(s) alone once H(s+1) is
    retained at full width, and only H(s+3) is new. The INTEGER c has no such
    one-step propagation - c(s+1) is not a function of c(s) - so the integer view
    literally cannot see this structure, and that asymmetry is the concrete sense
    in which the block object is new rather than a renaming. Under the second
    operation, ASSEMBLY to an integer, the projection is deterministic but
    IRREVERSIBLE at the block boundaries once w is not a multiple of 4, which at
    l = 384 it is not (w = 63). PASSES on both operations.
    WHERE IT DISSOLVES. At the square root. Once b is extracted from c the block
    boundaries are destroyed - b's bits are not a function of c's blocks in any
    aligned way - and the object stops propagating. THAT DISSOLUTION POINT IS
    EXACTLY THEORY A, AND THE EXPERIMENT MEASURES WHETHER IT IS TOTAL OR PARTIAL.
    The object's survival distance is therefore not a guess: it is the measured
    quantity.

    WHY 384 AND NOT 224 OR 256. At l = 224 and l = 256 we have v = 1, so
    c(s) = h0(s) * 2^160 + H(s+1) and c(s+1) = h0(s+1) * 2^160 + H(s+2). The
    sharing between consecutive c values is then only the 63 or 95 bits of
    h0(s+1) = H(s+1) mod 2^w, which are already inside c(s)'s low block - one
    relation, not two, and only w bits, not 160 + w. AT l = 384 THE SHARING IS
    223 BITS ACROSS TWO RELATIONS AND INCLUDES A FULL 160-BIT BLOCK. P-384 is
    therefore the only row in this program's NIST set where the phenomenon is
    large enough to be worth measuring, and the record's title claim that this is
    a P-384-specific structure is a claim about v, checkable in one line.

    WHY THIS IS NOT IDEA-20260829-bba3a8 OR IDEA-20260829-0656b1. bba3a8 verifies a
    single seed against a single coefficient and counts what the predicate binds; it
    never looks at two seeds. 0656b1 measures a MARGINAL acceptance rate from
    INDEPENDENT seeds and explicitly assumes independence when it reports binomial
    intervals. THIS RECORD ATTACKS THAT ASSUMPTION, and if Theory B holds then
    0656b1's confidence intervals are wrong and must be widened. The three records
    are a chain, not a repetition, and this one is the only one that can falsify a
    premise of another.

    EXECUTION. Step 1, prove C1 symbolically from the C.3.1 text and freeze it as a
    unit test on synthetic hash outputs, with NO real seed involved - the identity is
    about the assembly rule, not about SHA-1. Step 2, verify C1 on the real P-384
    seed by computing c(s) and c(s+1) and checking both relations exactly. Step 3,
    run C4's Legendre-correlation probe, which needs no curves. Step 4, run C3's
    window-dispersion measurement at reduced sizes chosen so that v = 2 is preserved
    (see the assumptions - this requires scaling hdigest, and the choice is
    load-bearing). Step 5, the independent-seed control and the synthetic-hash null.

  novelty_status: unverified
  novelty_rationale: >-
    The identity C1 is an immediate consequence of the published assembly rule and
    is almost certainly `known` to anyone who has implemented the procedure; the
    analogous overlap in the Brainpool curves is publicly documented (see
    IDEA-20260829-b70376 and IDEA-20260829-494a63, and the BADA55 mirror page read
    this session). What I could not check is whether the DEPENDENCE QUESTION of C3
    has been asked or answered for the NIST chain. The label is `unverified` because
    NO WEB SEARCH WAS PERFORMED THIS SESSION and the BADA55 paper itself was not
    opened; per agents/idea-generator.md that is the honest label. A reviewer with
    retrieval should check BADA55 Section 5 and the ANSI X9.62 rationale first.
  novelty_screen:
    method: >-
      Run 2026-08-29. Same corpus screen as IDEA-20260829-bba3a8. Additional
      targeted reads: SP 800-186 C.3.1 and C.3.2 in full;
      inputs/SAFECURVES-20260825/specs/bada55-brainpool.html lines 60-134, which
      documents the analogous Brainpool overlap; inputs/SAFECURVES-20260825/
      pages/rigid.txt in full.
    results: >-
      No record in ledger/ or knowledge/ contains any block-decomposition analysis,
      any seed-chain correlation measurement, or any dispersion statistic for a
      curve-generation pipeline. The four prior SafeCurves proposals do not
      consider two seeds at once. The Brainpool overlap is documented publicly and
      is the nearest known analogue; whether the same has been written down for the
      NIST chain, where v = 2 only at 384 and 521 bits, I do not know and did not
      check.

