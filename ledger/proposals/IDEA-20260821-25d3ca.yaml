  assumptions:
    - >-
      The pinned implementations expose a modulus check that can be located in source and, where a
      planted variant is needed, patched in a laboratory build. A build that cannot be patched is
      reported as unmeasurable, never as complete.
    - >-
      The comparison length and stride at the check site are readable by the same static method the
      sibling record freezes (IDEA-20260821-121612's v2 extractor). Where the reading is ambiguous,
      the cell is reported ambiguous, and the blindness result is then stated only for the strides
      that were actually determined.
    - >-
      Fibre members at Hamming weight 1 in lift-space suffice to map the site's silent set at byte
      granularity. THIS IS ONE-SIDED: a detection at weight 1 localises the silent set exactly; the
      absence of detection at weight 1 across a single key does NOT show completeness, because one
      key reaches only about 29% of the coefficient positions. Coverage is obtained by
      re-randomising over keys and is reported as measured positional coverage, never assumed.
    - >-
      No conclusion transfers beyond the builds, versions, flags, parameter sets and sampled keys
      actually used. Laboratory conformance evidence is never crypto-scale or MLWE evidence.

  predictions:
    - metric: >-
        deficit_partition: the counts of (w, k) cells over w in {1,2,4,8,16,32,64,128,256,512} and
        k in {2,3,4} whose modulus-check coverage deficit is EMPTY, NON-EMPTY BUT DISJOINT FROM
        [0, 384k), and INTERSECTING [0, 384k), recomputed under the frozen S0 script
      direction: different
      minimum_effect: >-
        EXACTLY 18 / 9 / 3, with the three intersecting cells being (w=256, k=3) at [1024, 1152),
        (w=512, k=2) at [512, 768) and (w=512, k=3) at [1024, 1152). No tolerance. Any other
        partition means the hand arithmetic in claim (B) is wrong and the blindness result is
        withdrawn or restated with the corrected table.
    - metric: >-
        blindness_confirmation: detections by the fibre generator against planted checks whose
        deficit lies in the rho tail, over the largest affordable probe budget
      direction: lower
      minimum_effect: >-
        EXACTLY 0, with no tolerance, jointly with NULL-3 firing at 100%. Zero detections WITHOUT
        NULL-3 firing is not a confirmation, it is a blind harness, and must be reported as such.
    - metric: >-
        shared_routine_fraction: the fraction of pinned implementations in which the modulus check
        and the decapsulation re-encryption comparison call the same symbol, or two routines of the
        same mechanism class, recorded with both symbol names quoted from source
      direction: different
      minimum_effect: >-
        No number is predicted, and the refusal is deliberate: this is the discriminator and both
        answers are complete. 1.0 means the lane's existing decapsulation-site evidence transitively
        covers the encapsulation site and the harbour is harmless. 0.0 means every implementation
        contains a bounded comparison this program has never probed and cannot probe from outside
        at any stride <= 128. Intermediate values name which implementations are which.
    - metric: >-
        liftable_residue_count: |{c in [0, 3329) : c + 3329 <= 4095}|, recomputed under the frozen
        script
      direction: different
      minimum_effect: >-
        EXACTLY 767. Any other value means the generator's support law in S1 is wrong and every
        positional-reach number with it.
    - metric: >-
        positional_reach: the measured fraction of coefficient-region byte positions reachable by
        weight-1 lifts for a freshly generated key, over 10^3 keys per parameter set
      direction: different
      minimum_effect: >-
        Within 3 binomial standard errors of the derived (2p + 1 - (1-p)^2)/3 = 0.290 at
        p = 767/3329. A departure falsifies H1 (the liftable-count distribution) or the packing
        rule in S1, and is itself a finding about t-hat's coefficient distribution.
    - metric: >-
        NULL-4 corpus pattern: detection by the CCTV `modulus/` subset against each planted check
      direction: different
      minimum_effect: >-
        Detection in exactly the three observable cells and in none of the nine unobservable ones,
        plus rejection on every unmodified conformant build. A detection in an unobservable cell
        falsifies the blindness result outright and is the single most informative negative this
        record can return.

  minimal_test:
    design: >-
      Six stages, cheapest and most decisive first, on laboratory builds from public source only.
      S0 (minutes, zero risk, NO BUILD): recompute the residue and deficit table under a frozen
      script, run NULL-5's reproduction fixture, and read FIPS 203 to confirm the key layout and
      the packing rule. THIS STAGE ALONE PRODUCES THE RECORD'S HEADLINE and can withdraw it.
      S1 (minutes): implement the fibre enumerator, score NULL-1, and measure positional_reach over
      10^3 keys per parameter set against the derived 0.290. Still no library build.
      S2 (hours, reading not running): the site census over the pinned implementations -- presence,
      form, length, stride, and the shared-routine question -- with symbol names quoted. THIS IS
      THE DISCRIMINATOR and it needs no execution at all.
      S3 (bounded): planted checks at the enumerated cells, driven by the fibre generator; score
      NULL-2 (forced zero) and NULL-3 (forced 100%) BEFORE reading any candidate build.
      S4 (bounded): the CCTV subset against the same planted checks, for the measured corpus bound.
      S5 (bounded, subsidiary): the hash-fixed arm and the implicit-rejection consequence check.
      Total compute is minutes on one core; the real cost is reading source and patching builds,
      which is why implementation is rated medium and compute low.
    controls:
      - NULL-5, the arithmetic anchor reproducing a committed residue table; zero compute; run first.
      - NULL-1, the empty fibre; forced zero enumerated members; voids S1-S4 if it fails.
      - NULL-2, the forced-zero rho-tail cell; forced zero detections; a detection voids the matrix.
      - NULL-3, the must-fire arm at the (w=256, k=3) deficit; forced 100% detection; without it no zero means anything.
      - NULL-4, the CCTV corpus cross-check; forced rejection on conformant builds and the named detection pattern on planted ones.
      - >-
        GRADED INTERIOR: planted deficits of 8, 16, 32, 64 and 128 bytes inside the coefficient
        region, with the measured rate scored against the derived P_hit = Pr[D contained in S] at
        each; monotonicity is derived (increasing in |S|), not assumed.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST FAIL: a build whose modulus check is a
        per-coefficient range test over a length that is not statically determined. The byte-space
        projection does not apply there without an explicit remapping, and the pipeline must report
        the cell as out of the method's domain rather than assigning it a byte-space silent set.
      - >-
        ORDERING AND PROVENANCE: the deficit table, all forced values, the planting patch diffs,
        the build flags, the pinned commits and the frozen script hashes are committed before S3,
        so no arm can be adjusted after a number is seen.
    required_metrics:
      - the recomputed residue and deficit table with the 18 / 9 / 3 partition and the script hash
      - the three observable cells with their exact byte intervals
      - >-
        the site census table -- presence, form, comparison length, stride, and the shared-routine
        verdict, with both symbol names quoted from source
      - NULL-1 through NULL-5 verdicts, emitted before any candidate or planted-cell number
      - detections per planted cell for the fibre generator and for the CCTV subset, side by side
      - measured positional_reach per parameter set against the derived 0.290
      - every patch diff, build configuration and pinned commit

  falsification_conditions:
    - >-
      The frozen script's deficit partition is not 18 / 9 / 3, or FIPS 203's key layout does not
      place a 32-byte non-coefficient tail at the end of ek. The blindness result is wrong or void
      and THE PROPOSAL IS WITHDRAWN IN THAT PART, with the corrected table published.
    - >-
      Any detection in an unobservable planted cell, by the fibre generator or by the CCTV subset.
      The blindness derivation is FALSE -- most likely because the compared buffers are not
      identical on the tail in that build, or the deficit is not where it was planted -- and the
      record's headline is refuted in the most useful possible way.
    - >-
      NULL-3 fires below 100%. The harness cannot see a detection it is constructed to see; NO
      zero-detection result is interpretable and the arm is redesigned before anything else.
    - >-
      NULL-1 emits a member, or NULL-5 fails to reproduce the committed residue table. Enumerator
      or arithmetic-layer failure; nothing is reportable.
    - >-
      shared_routine_fraction = 1.0 across every pinned implementation. The harbour is harmless
      because the shared routine is tested where its deficit is observable, this record's practical
      significance collapses to the arithmetic, and that is a clean negative which STRENGTHENS the
      lane's existing decapsulation-site evidence by widening what it covers.
    - >-
      liftable_residue_count != 767 or positional_reach outside 3 standard errors of 0.290. The
      generator's support law is wrong; S3 and S4 are re-derived before use.
    - >-
      Builds cannot be patched, or a library cannot be built. INFRASTRUCTURE outcome under
      AGENTS.md rule 3, never evidence about that implementation.

  confounders:
    - >-
      THE DIRECTION OF THE CONTAINMENT IS INHERITED, NOT RE-DERIVED. Every forced value here rests
      on "the check accepts iff D is contained in S", taken from IDEA-20260821-13b667 as repaired.
      That record had the containment INVERTED in its first version, and an inversion here would
      swap NULL-2 and NULL-3's forced values exactly as it did there. The mitigation is that
      NULL-3's forced value is independently anchored to the physical question -- a check that
      never reads [1024, 1152) cannot notice a difference confined to it -- and to CCTV's declared
      expected outcome for its own vectors, which is external to both records.
    - >-
      IMPLEMENTATION FORM. A per-coefficient range test has its own completeness question in
      COEFFICIENT space, and the byte-space blindness result does not transfer to it verbatim: the
      coefficient loop's tail is the last 256k mod w' coefficients, a different arithmetic. The
      census records the form precisely so the right space is used, and a build whose form cannot
      be determined is reported as such.
    - >-
      TAIL EQUALITY IS AN IMPLEMENTATION FACT, NOT ONLY A SPEC FACT. The claim that the compared
      buffers are identical on the rho tail assumes the build re-encodes into a buffer that carries
      rho through unchanged. A build that re-encodes into a fresh zeroed buffer and compares
      384k+32 bytes would DIFFER on the tail for every input, i.e. would reject every key -- an
      absurd behaviour that NULL-4 would expose immediately -- but intermediate variants exist and
      the patch-level reading in S2 is what settles it per build.
    - >-
      SUB-SAMPLING IS ONE-SIDED. One key reaches about 29% of coefficient positions; a silent-set
      map from a single key is a lower bound on completeness and must be phrased that way. Coverage
      is a measured quantity here, not an assumption.
    - >-
      REACHABILITY IS NOT PRESENCE, AND UNOBSERVABILITY IS NOT SAFETY. A deficit that is
      unobservable at this site is harmless AT THIS SITE; the entire practical content of the
      record is that the same routine may be used elsewhere, and that is a census question, not an
      inference.
    - >-
      SPEC PROVENANCE. The load-bearing external input -- the key layout -- is RECALLED, not
      verified, because a PDF fetch failed. Every downstream number carries that label until S0
      replaces it.
    - >-
      REFERENCE-IMPLEMENTATION BIAS IN H1. The keys are drawn from whichever implementation's
      KeyGen is used; a biased sampler would bias the liftable counts and the positional reach.
      Drawing from two independent implementations and comparing the empirical distributions is the
      cheap guard and is part of S1.

