idea:
  id: IDEA-20260821-25d3ca
  question_id: RQ-MLKEM-002
  added: '2026-08-21'
  title: >-
    What a skipped modulus check costs, counted exactly: the ByteDecode_12 fibre over an
    ML-KEM encapsulation key has expected size 2^118 / 2^177 / 2^236, and whether an
    implementation's ciphertext varies along that fibre WITH THE H(ek) CHANNEL HELD FIXED
    separates "the check guards arithmetic" from "the check guards encoding canonicity"
  class: mechanism

  claim: >-
    (A) THE OBJECT, AND WHY IT IS COUNTABLE. FIPS 203 requires ML-KEM.Encaps to perform a
    "modulus check" on the encapsulation key: the key must satisfy
    ByteEncode_12(ByteDecode_12(ek)) == ek. That predicate is exactly the statement that ek is
    the CANONICAL member of its decode fibre. The fibre is countable because ByteDecode_12
    reduces each 12-bit field modulo q = 3329: a field value v in [0, 4096) decodes to
    v mod q, so a canonical coefficient c has a second preimage c + q precisely when
    c + 3329 <= 4095, i.e. when c <= 766. Exactly 767 of the 3329 residues are LIFTABLE, and
    the fibre of a key with m liftable coefficients has size exactly 2^m. Under the
    distributional assumption H1 below, the expected liftable count is
    256*k*767/3329 = 117.96 (k=2), 176.95 (k=3), 235.93 (k=4), so a typical ML-KEM-512
    encapsulation key is ONE of roughly 2^118 byte strings that decode to the same key, and
    the modulus check is exactly the predicate selecting that one. These numbers are derived
    here by hand from a recalled specification rule, and re-deriving them under a frozen
    script and checking the rule against FIPS 203 is stage S0 of the test.
    (B) THE CLAIM THAT CAN COME OUT NEGATIVE. For an implementation that omits the modulus
    check, hold the H(ek) input to G fixed at the canonical key's hash in a laboratory build,
    and encapsulate against fibre members. Either (E-BIND) the ciphertext is BYTE-IDENTICAL to
    the canonical-key ciphertext for every fibre member -- the decode reduces, the arithmetic
    never sees an out-of-range representative, and the check's entire function is encoding
    canonicity and the binding of the shared secret to the key BYTES -- or (E-ARITH) the
    ciphertext differs for some fibre member, meaning an unreduced representative reaches the
    NTT or the compression step and the check is also guarding arithmetic. THE TWO ANSWERS
    HAVE DIFFERENT CONSEQUENCES: under E-BIND the cost of a skipped check is uniform across
    implementations and is entirely an interoperability-and-binding cost; under E-ARITH the
    cost is implementation-specific and depends on the internal representation, which is
    exactly the kind of variation the isolation-versus-systemic question exists to measure.
    (C) THE FORCED VALUE THAT KILLS THE NAIVE EXPERIMENT, DERIVED BEFORE ANY RUN. Without the
    hash channel held fixed, the experiment carries ZERO information. FIPS 203's Encaps derives
    (K, r) from G(m || H(ek)), so a fibre member ek' != ek gives H(ek') != H(ek), hence
    different coins, hence a different ciphertext AND a different shared secret, in EVERY
    implementation, unconditionally. "Do outputs differ along the fibre?" is therefore forced
    to answer YES by the construction of the standard, and would be an instance of
    KN-TECH-1a5b7e mode 3 -- the contrast whose sign was fixed before the data existed. The
    entire design of this proposal follows from noticing that, and the discriminating arm is
    the one where the forced channel is closed.
    (D) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no attack-cost
    estimate, no timing/power/EM/cache/fault measurement, no statement about MLWE hardness or
    about ML-KEM's security at any parameter set. A fibre of size 2^118 IS NOT A WORK FACTOR
    and must never be read as one: it is a count of byte strings, every one of which encodes a
    PUBLIC key that is already public, and knowing them yields nothing about any secret. This
    is not a restatement of any binding result; see the discrimination against
    eprint 2024/523 below. The C2SP/CCTV corpus already publishes exhaustive invalid-key
    vectors for the REJECT half of this question, and this record explicitly does not
    re-litigate that half. Any newly observed conformance defect escalates to the coordinator
    per RQ-MLKEM-002 and is published by no agent.

  mechanism: >-
    S0 -- CHECK THE ARITHMETIC AND THE SPEC RULE. Recompute, under a frozen script: the
    liftable-residue count (predicted exactly 767, being |{c in [0,q) : c + q <= 4095}|); the
    expected liftable-coefficient counts per parameter set; and the encapsulation-key length
    384k + 32. Independently, obtain FIPS 203 and confirm that ByteDecode_12 reduces mod q and
    that the Encaps input validation is the type check plus the modulus check as stated. IF THE
    DECODE DOES NOT REDUCE MOD q, the fibre is trivial and this proposal is withdrawn in full.
    S1 -- ENUMERATE FIBRE MEMBERS AT DECLARED WEIGHTS. For a sampled canonical ek, compute the
    liftable position set P. Generate fibre members at Hamming weight 1 (|P| of them), weight 2
    (a declared random subsample), and a declared set of random weights up to 8. THE FULL FIBRE
    IS NOT ENUMERABLE and no attempt is made to enumerate it; the sub-sampling and its transfer
    assumption are recorded explicitly.
    S2 -- THE FORCED ARM, RUN FIRST AND REPORTED AS FORCED. Encapsulate against fibre members
    with the ordinary code path. Prediction: ciphertext and shared secret differ, always, for
    every non-canonical member, in every build that does not reject. This arm is run because it
    is the arm a naive design would have reported as a finding, and running it makes the forced
    value visible in the artifact rather than in an argument.
    S3 -- THE DISCRIMINATING ARM. In a laboratory build, replace the hashed key material fed to
    G by the canonical H(ek) while leaving the decoded key material to flow from ek' as usual.
    Now the only channel by which ek' can influence the ciphertext is the arithmetic. Compare
    ciphertexts byte-for-byte against the canonical-key ciphertext under the same m.
    E-BIND predicts identity, exactly, for every member; E-ARITH predicts a difference for at
    least one.
    S4 -- LOCALISE ANY DIFFERENCE. Where S3 shows a difference, instrument the decode and record
    the decoded coefficient values: a coefficient >= q at any point after decode identifies the
    build as one that does not reduce, and the first differing ciphertext byte identifies
    whether the divergence enters at the NTT or at the Compress step (the two have different
    signatures: an NTT-entering difference perturbs the whole polynomial, a Compress-entering
    difference perturbs only the coefficients that were lifted).
    S5 -- THE INTEROP CONSEQUENCE, DERIVED AND THEN CHECKED. Under E-BIND the derived
    consequence is exact: the ciphertext produced under ek' is decapsulated by the legitimate
    key holder, whose dk carries h = H(canonical ek), so the re-derived coins differ, the
    re-encryption comparison fails, and decapsulation returns the implicit-rejection value. The
    two parties end with different shared secrets and neither learns anything about the other's.
    That is a self-inflicted interoperability failure and is what the modulus check prevents.
    Checking it costs one decapsulation per member and its failure would mean the E-BIND account
    is incomplete.
    WHY THIS IS A MECHANISM PROPOSAL AND NOT A CONFORMANCE SWEEP. The deliverable is not "which
    libraries check". It is a statement about WHAT THE CHECK IS FOR, decided by an observable
    that separates two mechanisms, with the confounding channel closed by construction.

