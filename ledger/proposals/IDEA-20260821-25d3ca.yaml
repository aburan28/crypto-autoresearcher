      ByteDecode12 input validation` -> 9 links; the synthesised summary asserted that
      ByteDecode12 "converts each 12-bit segment ... into an integer modulo 2^12 = 4096, and
      then reduces the result modulo q", that this "is no longer a one-to-one operation", and
