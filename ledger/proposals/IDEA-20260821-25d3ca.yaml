      READ; it quotes the spec phrase "all encoded polynomial coefficients are reduced modulo
      the field prime (the '_Modulus check_')" and documents a `modulus/` vector folder giving
      invalid ML-KEM.Encaps inputs in which "every value in the range q to 2^12-1 and every
      position in the key is tested individually". (W3) WebSearch `ML-KEM non-canonical public
      key encoding malleability binding MAL-BIND Kyber` -> 9 links. (W4) WebFetch
      https://eprint.iacr.org/2024/523 -> RETRIEVED AND READ (Schmieg). (W5) WebFetch of
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.203.ipd.pdf FAILED: the converter
      returned unreadable binary. This is an INFRASTRUCTURE outcome under AGENTS.md rule 3, it
      is why the key-layout rule remains recalled rather than verified, and it is why S0
      carries a spec-reading stage that can withdraw the proposal.
    results: >-
      Inside this repository, no record treats the modulus check as a COMPARISON SITE, and no
      record asks whether any comparison routine is shared between the encapsulation and
      decapsulation boundaries. The lane's five proposals are entirely about the re-encryption
      comparison: its silent set, its stride arithmetic, its lane coverage, its periodicity and the
      adequacy of the gate that probes it. IDEA-20260805-3c957e performs the same residue analysis
      this record performs, but for CIPHERTEXT lengths (768, 1088, 1568) and it does not consider a
      length with a non-comparable tail; its five reachable cells are a different table.
      EV-MLKEM-159715 (GOAL-MLKEM-005, a different question) states that ByteEncode12/ByteDecode12
      is "a lossless integer-mod-q encoding ... injective by pigeonhole (2^12=4096 > q=3329)",
      which is correct for the ENCODE direction; the decode direction used here is not injective
      and the two statements are consistent and about different maps.
      Outside, the CCTV corpus is exhaustive over out-of-range values at every coefficient position
      and is used here as an INSTRUMENT and as the object of the S4 bound, not as a competitor;
      nothing found states that its coverage of a fixed-tail key layout has a structural blind
      spot. Schmieg 2024/523 concerns binding notions and malformed private keys, a different
      object with a different adversary model.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: the modulus check as a member of the
      lane's defect-mechanism neighbourhood; the derived blindness result (for every w <= 128 and
      every parameter set the deficit lies in bytes that cannot differ, so no input can detect it),
      with its 18 / 9 / 3 partition and its three named observable cells; the exact
      observable-difference support (two adjacent bytes per lift, 0.290 expected positional reach
      per key); and the shared-routine census as the discriminator. ASSEMBLED FROM KNOWN PARTS: the
      C-COV mechanism and the accumulate/reduce/finalize anatomy are IDEA-20260805-ee2018's; the
      residue-arithmetic method is IDEA-20260805-3c957e's, applied to a new length; the detection
      condition D contained in S is IDEA-20260821-13b667's as repaired; the modulus check and the
      key layout are FIPS 203's; the invalid-key corpus is CCTV's; the forced-channel discipline is
      KN-TECH-1a5b7e's. No external novelty is claimed and no academic search for prior work on
      encoding-tail blind spots was performed.

  object_first_candidate:
    tracked_object: >-
      THE OBSERVABLE-DIFFERENCE SUPPORT AT THE MODULUS-CHECK SITE: for an encapsulation key ek and
      a candidate non-canonical re-encoding ek', the set
      D = { i : ByteEncode_12(ByteDecode_12(ek))[i] != ek[i] }, followed from the fibre member that
      induces it, through the check's accumulate step, to the single bit "did this build ACCEPT a
      key a conformant build rejects"; and, alongside it, the check's silent set S. What is tracked
      is a subset of byte positions and the indicator 1{D contained in S}, exactly as in the
      sibling record, transported to a second site.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens, per inventor-protocol section
      1: (a) the DECAPSULATION comparison tail in every phrasing -- coverage, bound-literal,
      reduction deficit, periodicity -- which is the whole content of the lane's five existing
      proposals and appears here only as the OTHER END of the shared-routine question; (b) the
      differential mutation gate's adequacy controls; (c) the ciphertext-length residue table,
      which is IDEA-20260805-3c957e's and is not recomputed; (d) all cryptanalytic and physical
      side-channel lenses, excluded by RQ-MLKEM-002; (e) the decode fibre as an input-validation
      object in its own right, which is what the predecessor of this record tracked and what the
      red-team screen found mis-filed -- it survives here only as the law generating D.
    lossiness: >-
      Genuinely lossy and the discard is compatible with the site's operation. The full state is a
      384k+32-byte key; the projection keeps a set of byte positions, discarding every coefficient
      value, the seed, the key's algebraic content and the magnitude of each byte change. The fibre
      over a given D is large and non-singleton -- many liftable configurations and many keys
      induce the same two-byte footprint at a given index pair -- so this is not a change of
      coordinates. COMPATIBILITY: the check's accumulate is an equality test over positions, so
      whether it accepts depends on the pair only through which positions differ, and the retained
      part propagates deterministically; INCOMPATIBILITY, stated in advance: if a build implements
      the check as a per-coefficient range test rather than a byte comparison, the natural position
      space is coefficient indices rather than byte indices, and the projection must be recomputed
      in that space (the map is explicit -- coefficient j covers bytes 3*floor(j/2) + {0,1} or
      {1,2}) or the cell reported as out of the method's domain. THE ONE THING THE PROJECTION MUST
      NOT DISCARD, AND DOES NOT, IS THE BOUNDARY AT 384k: the whole result rests on D being
      contained in [0, 384k) while a small-stride S is contained in [384k, L_ek).
    propagation: >-
      One step of the target operation is one block of the check's accumulate. The law is the same
      one line as at the decapsulation site: the check ACCEPTS iff every differing position is
      invisible to it, i.e. iff D is contained in S. Composed over the whole buffer, the site's
      verdict is a deterministic function of (D, S). The probability enters only through the law of
      D, which is the fibre generator's support law derived exactly in S1, and through the key,
      which is re-randomised.
    survival_score: >-
      Survives two steps and dies at the third, and the death is where the record stops. Step 1,
      the check's accumulate: survives. Step 2, the check's verdict: survives, and yields the
      blindness theorem, because D and a small-stride S are disjoint by the key layout. Step 3, ANY
      STATEMENT ABOUT THE REST OF ENCAPSULATION: DIES, because the moment a non-canonical key is
      accepted, H(ek) reads the bytes and the object does not propagate past the hash -- which is
      exactly the forced channel derived in S5 and the reason the primary observable of this record
      is the check's verdict and not the ciphertext.

  null_object_control: >-
    FIVE controls on the identical harness path, forced values derived BEFORE any run from the
    physical question "does this build ACCEPT a key that a conformant build REJECTS?", and each
    able to fail. The nulls are scored and committed first (KN-TECH-1a5b7e, null-first rule).
    NULL-1, THE EMPTY FIBRE (enumerator control). A SYNTHETIC key whose 256k coefficients are all
    >= 767, so no coefficient is liftable and the fibre has size exactly 1. FORCED: the enumerator
    emits ZERO non-canonical members. It can fail -- an enumerator that lifts a non-liftable
    coefficient produces a 12-bit field value >= 4096, which is impossible, so any emitted member
    proves the enumerator writes outside its field and voids S1 through S4. Such a key is
    astronomically unlikely from KeyGen (about (2562/3329)^{256k}) and must be constructed; that is
    legitimate because NULL-1 controls the ENUMERATOR, not the cryptography.
    NULL-2, THE FORCED-ZERO CELL, WHICH IS THIS RECORD'S CENTRAL PREDICTION AS A CONTROL. The fibre
    generator against a planted check with a declared deficit contained in the rho tail. FORCED:
    ZERO detections at every budget, because D is contained in [0, 384k) and S is contained in
    [384k, L_ek), so D contained in S is impossible for non-empty D. It can fail, and a failure is
    diagnostic rather than merely negative: a detection means either the enumerator wrote outside
    the coefficient region, or the planted deficit is not where it was declared, or the build's
    check reads something other than the two buffers -- and in every case no cell is reportable.
    NULL-3, THE MUST-FIRE ARM (sensitivity). The same generator against a planted check with the
    (w = 256, k = 3) deficit [1024, 1152), restricted to fibre members whose two-byte footprint
    lies inside that interval. FORCED: detection on 100% of such probes. WITHOUT THIS ARM, "zero
    detections everywhere" is indistinguishable from a harness that never detects anything --
    KN-TECH-1a5b7e mode 2 -- and since this record's headline is a NEGATIVE (nothing is
    observable at w <= 128), the must-fire arm is the control that makes the negative mean
    something. A graded interior is available by planting deficits of 8, 16, 32, 64 and 128 bytes
    inside the coefficient region and reporting the detection rate against the derived
    P_hit = Pr[D contained in S] at each; monotonicity is DERIVED (increasing in |S|), not assumed.
    NULL-4, THE PUBLISHED-CORPUS CROSS-CHECK. A subset of the CCTV `modulus/` vectors against
    unmodified builds. FORCED for a conformant build: rejection. It can fail, and a disagreement
    between a build and a public corpus is an instrument or build finding that must be resolved
    before any S2/S3 number is read. Against the PLANTED checks it doubles as the S4 measurement,
    with its own forced pattern: detection in the three observable cells, no detection in the nine
    unobservable ones.
    NULL-5, THE ARITHMETIC ANCHOR (zero compute, run first). The frozen script must reproduce, from
    the key layout alone, the archived residue facts of a NEIGHBOURING record as a sanity check on
    its arithmetic layer: IDEA-20260805-3c957e's five reachable ciphertext cells ((64,1024),
    (128,768), (128,1024), (256,768), (256,1024)). A script that cannot reproduce a committed
    residue table is not trusted to produce a new one, and this arm costs nothing.

  discriminated_from:
    - >-
      The five existing RQ-MLKEM-002 proposals (IDEA-20260724-001, -002, IDEA-20260805-1beeca,
      -3c957e, -ee2018) all concern the re-encryption comparison at DECAPSULATION. This record
      concerns a different site with a different buffer length and a different, structurally
      special layout (a 32-byte tail that cannot differ), and its deliverable is a blindness
      theorem plus a shared-routine census, neither of which any of them can produce. The contact
      point is deliberate and is the record's reason to exist: if the routine is shared, their
      results transfer to this site; if not, this site is untested.
    - >-
      IDEA-20260805-3c957e performs residue arithmetic on CIPHERTEXT lengths and concludes that
      the coverage-deficit region is empty for w dividing 32. This record performs the analogous
      arithmetic on KEY lengths and reaches a different and stronger conclusion for a different
      reason: not that the deficit is empty, but that where non-empty at w <= 128 it lies in bytes
      that cannot differ. Emptiness and inertness are different obstructions; the second is
      invisible to the first record's method because that method never asks which positions can
      differ.
    - >-
      IDEA-20260821-13b667 computes the per-probe power of a mutation generator against a silent
      set at the decapsulation site and derives forced-zero cells there. This record USES its
      containment law rather than re-deriving it, and applies it to a generator whose support law
      is not chosen but IMPOSED by an encoding (two adjacent bytes per lift, 0.290 positional reach
      per key). The forced-zero cell here is not a design choice to be avoided but a structural
      fact about ML-KEM's key layout.
    - >-
      The C2SP/CCTV `modulus/` corpus tests WHETHER an implementation rejects invalid encapsulation
      keys, exhaustively over out-of-range values at every coefficient position. This record uses
      that corpus as an instrument, does not duplicate it, and adds the one thing an exhaustive
      corpus cannot supply: a proof of what NO input to that site can detect, and therefore what a
      null from that corpus does and does not license.
    - >-
      Schmieg, "Unbindable Kemmy Schmidt" (eprint 2024/523, retrieved), shows ML-KEM is neither
      MAL-BIND-K-CT nor MAL-BIND-K-PK via an adversary producing malformed PRIVATE keys. That is a
      security-notion result about an adversary who controls the decapsulation key. This record has
      no adversary, controls no key, constructs no attack, and measures the completeness of a
      checking loop.

