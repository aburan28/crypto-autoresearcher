  object_first_candidate:
    tracked_object: >-
      THE DECODE FIBRE of an encapsulation key:
      F(ek) = { ek' : ByteDecode_12(ek'[0:384k]) = ByteDecode_12(ek[0:384k]) and
      ek'[384k:] = ek[384k:] }, together with the induced partition of an implementation's
      OUTPUT (accept/reject, ciphertext bytes, shared secret) along that fibre. What is
      followed through the computation is a set of byte strings that are equal downstream of
      decode and unequal upstream of it -- and the question is where in the pipeline that
      equality is lost.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens for this record: (a) the
      comparison tail and its silent set in every phrasing -- coverage, bound-literal,
      reduction deficit, periodicity -- which is the whole content of the lane's five existing
      proposals; (b) the differential mutation gate and its adequacy controls; (c) stride and
      ciphertext-length arithmetic; (d) all cryptanalytic and physical-side-channel lenses,
      excluded by RQ-MLKEM-002. This record touches the DECAPSULATION comparison only once, in
      S5, and only to check a derived consequence, never as the object.
    lossiness: >-
      The projection is ek' -> ByteDecode_12(ek'), and it is lossy by an exactly known amount:
      384k bytes in, 256k coefficients over Z_q out, with 2^m preimages for a key with m
      liftable coefficients, m ~ 118 / 177 / 236 in expectation. It is not a change of
      coordinates -- the discarded information (which liftable positions were lifted) is
      provably unrecoverable from the decoded key, since every fibre member decodes to the
      identical coefficient vector by definition. WHAT IS DISCARDED AND WHETHER IT IS DISCARDED
      COMPATIBLY IS THE ENTIRE EXPERIMENTAL QUESTION, and that is unusual enough to state
      plainly: under E-BIND the discard is compatible with everything downstream of decode --
      the retained coefficient vector propagates deterministically through the NTT, the
      arithmetic and the compression, so all fibre members produce one ciphertext -- and it is
      INCOMPATIBLE with exactly one operation, the hash H(ek), which reads the bytes and not
      the coefficients. Under E-ARITH the discard is incompatible with the arithmetic too. So
      the lossy-projection test here does not merely certify the object as new; its two
      possible answers ARE the two hypotheses.
    propagation: >-
      One step of the target operation is one stage of Encaps. Decode: the fibre collapses to a
      point, by definition. NTT and matrix-vector arithmetic: the point propagates
      deterministically IF the decode reduced, and does not if it did not. Compress: the
      compression map is applied to a representative, and a representative >= q compresses
      differently from its canonical form, which is the second place E-ARITH can enter. Hash:
      the fibre does NOT collapse -- H is injective on distinct byte strings for any practical
      purpose -- and this is the one operation under which the object provably fails to
      propagate, which is why the discriminating arm must close it.
    survival_score: >-
      Survives exactly as far as the first operation that reads bytes rather than coefficients,
      and that operation is H(ek), which occurs immediately. The honest survival score is
      therefore ZERO STEPS in the standard pipeline -- and the proposal's design is a direct
      consequence: the only way to give the object more than zero steps is to close the hash
      channel by construction in a laboratory build, which is what S3 does and what makes the
      arm a laboratory arm that cannot be run against a deployed system and is not proposed to
      be.

  null_object_control: >-
    FOUR controls, all on the identical harness path, forced values derived before any run, and
    each able to fail. The order is fixed and the nulls are scored first (KN-TECH-1a5b7e,
    null-first rule).
    NULL-1, DETERMINISM. The canonical ek, the same m, the same build, encapsulated twice.
    FORCED: byte-identical ciphertext and identical shared secret. It can fail -- if the
    harness admits any entropy beyond m, every "identical" result in S3 is meaningless and no
    E-BIND verdict is reportable.
    NULL-2, THE EMPTY FIBRE. A SYNTHETIC key whose 256k coefficients are all >= 767, so no
    coefficient is liftable and the fibre has size exactly 1. FORCED: the enumerator emits ZERO
    non-canonical members. It can fail -- an enumerator that lifts a non-liftable coefficient
    produces a byte string with a field value >= 4096, which is impossible in 12 bits, so any
    emitted member proves the enumerator is writing outside its field and voids S1 through S5.
    Note that such a key is astronomically unlikely to arise from KeyGen (probability about
    (2562/3329)^{256k}), so it must be constructed; that is legitimate because NULL-2 is a
    control on the ENUMERATOR, not on the cryptography, and the record says so.
    NULL-3, THE MUST-MOVE SENSITIVITY CONTROL, WHICH IS THE ONE THAT MATTERS. A CANONICAL
    single-coefficient perturbation -- change one coefficient by +1 while staying in [0, q) --
    fed through the IDENTICAL hash-fixed path of S3. FORCED: the ciphertext MUST differ,
    because the decoded key genuinely changed. Comparator named: the canonical-key ciphertext
    under the same m, the same arm the E-BIND null is about. Threshold numeric: the ciphertext
    must differ in at least one byte, on 100% of trials. WITHOUT THIS CONTROL, "all fibre
    members give identical ciphertexts" is indistinguishable from "the harness always returns
    the same ciphertext", which is KN-TECH-1a5b7e mode 2 -- the statistic that never reads the
    object. Dynamic range is exhibited at both ends by NULL-3 (must differ) and NULL-1 (must
    not differ), and a graded interior is available by perturbing 1, 2, 4, 8, 16 canonical
    coefficients; monotonicity is NOT claimed, and the reported quantity is the differing-byte
    count, whose relation to the perturbation weight is measured rather than assumed.
    NULL-4, THE PUBLISHED-CORPUS CROSS-CHECK. A subset of the CCTV `modulus/` vectors, whose
    correct outcome (reject) is externally declared. FORCED for a conformant build: rejection.
    It can fail, and if a build under test disagrees with a public corpus the discrepancy is an
    instrument or build finding that must be resolved before any S3 number is read.

  discriminated_from:
    - >-
      All five existing RQ-MLKEM-002 proposals (IDEA-20260724-001, -002, IDEA-20260805-1beeca,
      -3c957e, -ee2018) concern the re-encryption COMPARISON at decapsulation: its silent set,
      its stride arithmetic, its lane coverage, its periodicity, and the adequacy of the gate
      that probes it. This record concerns an input-validation predicate at ENCAPSULATION, a
      different algorithm, a different input, a different failure mode, and an object (a decode
      fibre) that has no counterpart in any of them. The only contact point is S5, where a
      derived consequence happens to be observed at the comparison, and S5 asserts nothing
      about the comparison's implementation.
    - >-
      The C2SP/CCTV `modulus/` corpus tests WHETHER an implementation rejects invalid
      encapsulation keys, exhaustively over every out-of-range value at every position. This
      record does not re-run that test as its deliverable and claims no novelty for it; its
      object is what a NON-rejecting implementation OUTPUTS, restricted to the sub-family of
      invalid keys that decode to the same key as a valid one -- a subset CCTV's corpus
      contains at Hamming weight 1 but does not distinguish, because rejection is the same
      verdict for all invalid keys regardless of what they decode to.
    - >-
      Schmieg, "Unbindable Kemmy Schmidt" (eprint 2024/523, retrieved), shows ML-KEM is neither
      MAL-BIND-K-CT nor MAL-BIND-K-PK, via an adversary producing MALFORMED PRIVATE KEYS. That
      is a security-notion result about an adversary who controls the decapsulation key. This
      record has no adversary, controls no key, constructs no attack, and concerns non-canonical
      PUBLIC key encodings and their functional consequence in a laboratory build. The two share
      only the theme that ML-KEM's hashing choices make key ENCODINGS matter, and that shared
      theme is why 2024/523 is cited as context and not as support.
    - >-
      EV-MLKEM-159715 (GOAL-MLKEM-005) states that ByteEncode12/ByteDecode12 is "injective by
      pigeonhole (2^12=4096 > q=3329)". That is a statement about the ENCODE direction, where it
      is correct. This record is about the DECODE direction, where the same inequality forces
      NON-injectivity: 4096 field values onto 3329 residues, with exactly 767 residues having
      two preimages. The two statements are consistent and are about different maps, and no
      correction to that record is proposed or implied.
    - >-
      A conformance sweep counting which libraries implement which FIPS 203 checks would be a
      census. This is a two-hypothesis mechanism experiment with a forced-value derivation, a
      channel closed by construction, and four nulls, and it would be run even if every library
      implemented every check -- because the question "what is this check for" is answered by
      the hash-fixed arm on a laboratory build with the check deliberately disabled.

