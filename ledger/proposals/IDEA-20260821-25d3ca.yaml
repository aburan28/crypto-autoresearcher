  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS IMPLIED; RQ-MLKEM-002 forbids attack-cost
      estimation and no algorithm against any cryptographic problem is proposed. The exponents
      that appear -- fibre sizes of about 2^118, 2^177 and 2^236 -- are COMBINATORIAL COUNTS OF
      BYTE STRINGS ENCODING A PUBLIC KEY and are explicitly not work factors, not entropies and
      not security parameters. Instrument cost: the headline (S0) is 30 cells of integer
      arithmetic; the discriminator (S2) is source reading; the confirmation (S1, S3, S4) is
      10^3 keygens per parameter set plus a few thousand check invocations, i.e. minutes on one
      core. The interesting cost asymmetry is that the strongest statement in the record -- the
      blindness theorem -- costs nothing to derive and cannot be obtained by any amount of probing.
    memory_exponent: >-
      n/a as an attack quantity. Storage is the sampled fibre members, their supports and the
      per-cell verdicts, O(n * (384k + 32)) bytes; at n = 10^4 this is well under a gigabyte. The
      full fibre is NOT stored, NOT enumerated, and cannot be.
    best_known: >-
      No incumbent inside this repository for this site: nothing examines the modulus check as a
      comparison, and nothing asks whether any comparison routine is shared across sites. Outside,
      the C2SP/CCTV `modulus/` corpus is the incumbent instrument for the reject observable and is
      exhaustive over single-position invalid values; this record does not attempt to match it,
      uses it, and adds the statement of what it structurally cannot reach.
    hidden_overhead: >-
      Three honest overheads. First, the load-bearing key-layout rule is RECALLED because a PDF
      fetch failed, so the headline is one spec-reading away from withdrawal. Second, the stride
      grid is a convenience and understates observable cells if a real body has a non-power-of-two
      stride, which the sibling record's extractor may well find. Third, the blindness result is an
      exact observational-equivalence claim, and exact claims of that shape are brittle to
      implementation detail: one build that constructs its comparison buffer differently is outside
      the result's domain, and only reading each build settles which are inside.
    tradeoff_note: >-
      No time-memory tradeoff arises. The tradeoff that does arise is between key count and
      positional coverage: one key reaches about 29% of coefficient positions, so mapping a silent
      set to byte granularity costs roughly 1/0.29 = 3.5 keys per position in expectation with a
      coupon-collector tail, i.e. a few tens of keys for near-complete coverage. Weight-1 probes
      maximise localisation per probe and the design spends its budget there; higher weights are a
      cheap hedge only, and they LOWER detection probability against a narrow silent set by the
      containment law, exactly as the sibling record derives.

