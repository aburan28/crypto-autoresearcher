idea:
  id: IDEA-20260821-25d3ca
  question_id: RQ-MLKEM-002
  added: '2026-08-21'
  title: >-
    A SILENT HARBOUR FOR THE LANE'S OWN DEFECT CLASS. ML-KEM's encapsulation key ends in a 32-byte
    rho tail that the modulus check compares against itself, so for every stride w <= 128 and every
    parameter set a coverage-deficit silent set at that site lies entirely inside bytes that CANNOT
    DIFFER -- making the defect undetectable there by any input, including CCTV's exhaustive
    modulus corpus. Whether that matters is decided by one census question the lane has never
    asked: is the byte-comparison routine SHARED with the decapsulation re-encryption comparison?
  class: mechanism

  claim: >-
    (0) REVISION NOTICE. This record is a repaired revision filed under its own identifier after a
    red-team screen on 2026-08-21 found it FILED UNDER A QUESTION IT STATED IT DID NOT SERVE: its
    predecessor tracked the ByteDecode_12 fibre as an input-validation question at encapsulation
    and wrote in its own sota_delta that "against the lane's decision target the delta is honestly
    zero". A record that contributes nothing to the lane's decision target should not sit in the
    lane's proposal inventory competing with records that do. The repair is not a re-filing under
    another question -- this session cannot mint one and would not be the authority to -- but a
    change of object: the tracked object is now the COMPARISON/CHECKING TAIL at the encapsulation
    boundary and its relationship to the decapsulation comparison tail, which is the lane's own
    defect-mechanism neighbourhood, reached at a site the lane has never examined. The fibre
    arithmetic is retained only where it is load-bearing for that object, as the exact
    characterisation of which byte positions the two compared buffers can differ at. The
    predecessor's E-BIND/E-ARITH pair is demoted to a subsidiary consequence arm (S5).
    (A) THE OBJECT, AND WHY IT IS IN THIS LANE. FIPS 203's ML-KEM.Encaps performs a modulus check
    on the encapsulation key, requiring ByteEncode_12(ByteDecode_12(ek)) == ek. However an
    implementation realises it -- as a re-encode plus a byte-array equality comparison, or as a
    bounded loop testing each decoded coefficient against q -- IT IS A BOUNDED CHECKING LOOP OVER A
    FIXED-LENGTH BUFFER, which is exactly the defect-mechanism neighbourhood
    (accumulate / reduce / finalize over a length, per IDEA-20260805-ee2018) that GOAL-MLKEM-002
    has been unable to find a second instance of at the decapsulation site. There is one such site
    in EVERY ML-KEM implementation, including every library EXP-MLKEM-009 rejected for having a
    length-parameterized re-encryption compare. That is why this object belongs to RQ-MLKEM-002
    and not beside it.
    (B) THE DERIVED RESULT, AND IT IS AN OBSTRUCTION WITH EXACTLY THREE HOLES. Write
    L_ek = 384k + 32 for the encapsulation key length (800, 1184, 1568 at k = 2, 3, 4), with the
    encoded coefficients occupying [0, 384k) and the seed rho occupying the trailing 32 bytes.
    THE TWO BUFFERS THE MODULUS CHECK COMPARES ARE IDENTICAL ON THE RHO TAIL BY CONSTRUCTION: rho
    passes through the re-encode unchanged, so the only positions at which the compared buffers can
    EVER differ are inside [0, 384k). Now take the lane's C-COV(w) mechanism -- a body that covers
    floor(L/w) blocks with a missing or mis-bounded remainder path, silent set
    S = [w*floor(L/w), L). Since 384 = 6*64 = 3*128, we have 384k = 0 mod 64 and mod 128 for every
    k, hence L_ek = 32 mod 64 and 32 mod 128 for EVERY parameter set: the deficit is exactly the
    32-byte rho tail. And for w in {1,2,4,8,16,32} the deficit is empty, since 32 divides every
    L_ek. THEREFORE, FOR EVERY w <= 128 AND EVERY PARAMETER SET, A COVERAGE DEFICIT AT THIS SITE IS
    EITHER EMPTY OR CONTAINED IN BYTES THAT CANNOT DIFFER. By the containment law of
    IDEA-20260821-13b667 -- a defective comparison is exposed by an input iff the input's
    difference support D is contained in the silent set S -- and since every realisable D is
    contained in [0, 384k) while S is contained in [384k, L_ek), detection is IMPOSSIBLE: no input
    to this site distinguishes a stride-w-deficient check from a complete one for any w <= 128.
    That includes the C2SP/CCTV `modulus/` corpus, which is exhaustive over out-of-range values at
    every COEFFICIENT position and therefore cannot reach the tail either.
    THE THREE HOLES, enumerated over w in {1,2,4,8,16,32,64,128,256,512} x k in {2,3,4}: 18 cells
    have an empty deficit; 9 have a non-empty but UNOBSERVABLE deficit (w = 64 and w = 128 at every
    k, plus w = 256 at k = 2 and k = 4, plus w = 512 at k = 4); and exactly 3 have a deficit that
    intersects the coefficient region and is therefore observable -- (w = 256, k = 3) with 128
    observable bytes at [1024, 1152); (w = 512, k = 2) with 256 observable bytes at [512, 768); and
    (w = 512, k = 3) with 128 observable bytes at [1024, 1152). If the implementation compares only
    the 384k-byte coefficient region rather than the whole key, the table changes but the
    conclusion does not: 384k mod w = 0 for all w <= 128, and the only non-empty deficit over the
    same grid is again at k = 3 with w in {256, 512}, namely [1024, 1152). ALL OF THIS IS
    ELEMENTARY ARITHMETIC DERIVED BY HAND IN THIS RECORD; S0 recomputes it under a frozen script
    and the record is withdrawn in that part if the script disagrees.
    (C) THE DISCRIMINATING QUESTION, WHICH IS A CENSUS AND HAS TWO OUTCOMES WITH OPPOSITE
    CONSEQUENCES. If the defect is unobservable at this site, does it matter? It matters exactly
    when the routine that carries it is not confined to this site. So the question is:
    IN EACH PINNED IMPLEMENTATION, IS THE BYTE-COMPARISON (OR BOUNDED-CHECK) ROUTINE USED BY THE
    MODULUS CHECK THE SAME ROUTINE, OR A ROUTINE OF THE SAME MECHANISM CLASS, AS THE ONE USED BY
    THE DECAPSULATION RE-ENCRYPTION COMPARISON?
    SHARED: the lane's decapsulation-site gate transitively covers the encapsulation site, the
    isolation-versus-systemic question gains a second observation point per implementation at zero
    additional instrument cost, and the harbour is harmless because the shared routine is tested
    where its deficit IS observable (ciphertext lengths 1088 and 1568 both have non-empty deficits
    at w = 64, per IDEA-20260805-3c957e).
    NOT SHARED: there is a bounded comparison in every ML-KEM implementation at which this defect
    class is untestable from outside for every mainstream stride, and which no instrument in this
    program has ever probed. Naming that site, with the arithmetic that makes it blind, is the
    finding, and it is a statement about the lane's own coverage rather than about any
    implementation.
    (D) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no attack-cost estimate,
    no timing/power/EM/cache/fault measurement, no statement about MLWE hardness or about ML-KEM's
    security at any parameter set. No claim that any implementation has an incomplete modulus
    check. AN UNOBSERVABLE DEFICIT AT THIS SITE IS NOT A VULNERABILITY: the bytes it fails to read
    are bytes that cannot differ, so a check carrying it still rejects every key the complete check
    rejects. The fibre sizes quoted in S1 are combinatorial counts of byte strings encoding a
    PUBLIC key and are never work factors. Any newly observed conformance defect escalates to the
    coordinator per RQ-MLKEM-002 and is published by no agent.

  mechanism: >-
    S0 -- RECOMPUTE THE ARITHMETIC AND CHECK THE SPEC RULE. Under a frozen script, recompute:
    L_ek = 384k + 32 at k = 2, 3, 4; the residues L_ek mod w and 384k mod w over
    w in {1,2,4,8,16,32,64,128,256,512}; the deficit interval per cell; its intersection with
    [0, 384k); and the resulting 18 / 9 / 3 partition into empty, unobservable and observable
    cells. Independently obtain FIPS 203 and confirm that ek = ByteEncode_12(t-hat) || rho with
    |rho| = 32, that ByteDecode_12 reduces mod q, and that the Encaps input validation is the type
    check plus the modulus check. IF THE KEY LAYOUT DOES NOT PLACE A 32-BYTE NON-COEFFICIENT TAIL
    AT THE END, THE BLINDNESS RESULT IS VOID AND THIS PROPOSAL IS WITHDRAWN IN FULL.
    S1 -- CHARACTERISE THE OBSERVABLE-DIFFERENCE SUPPORT EXACTLY. The set of positions at which the
    two compared buffers can differ is the set of byte positions affected by a non-canonical
    coefficient encoding. ByteDecode_12 reduces each 12-bit field mod q = 3329, so a canonical
    coefficient c has a second 12-bit preimage c + q exactly when c + 3329 <= 4095, i.e. c <= 766:
    exactly 767 of the 3329 residues are LIFTABLE, and a key with M liftable coefficients has a
    decode fibre of size exactly 2^M (expected M = 256*k*767/3329 = 117.96, 176.95, 235.93 under
    H1 -- combinatorial counts, not work factors). FIPS 203 packs two coefficients per three bytes
    (b0 = a0 & 0xFF, b1 = (a0 >> 8) | ((a1 & 0xF) << 4), b2 = a1 >> 4), and adding 3329 = 0xD01 to
    a coefficient changes BOTH of its bytes with certainty (the low byte by +1 mod 256 or the low
    nibble by +1 mod 16, and the high part by 0xD or 0xE mod 16, none of which is zero). So a
    weight-1 lift has a difference support of exactly two adjacent byte positions, computable in
    closed form from the coefficient index, and the positions reachable for a GIVEN key are the
    union of those footprints over its liftable coefficients -- an expected fraction
    (2p + 1 - (1-p)^2)/3 = 0.290 of the coefficient region at p = 767/3329, so ONE key reaches
    under a third of the positions and the generator must re-randomise over keys. This is the
    generator's support law, it is exact, and it is what makes "observable" concrete.
    S2 -- THE SITE CENSUS, WHICH IS THE CHEAP DECISIVE PART AND NEEDS NO EXECUTION. For each pinned
    implementation, read the source and record five facts: (i) is the modulus check present at all;
    (ii) its implementation form -- re-encode plus byte comparison, per-coefficient range test, or
    other; (iii) the comparison length it uses (384k, 384k+32, or 256k coefficients); (iv) the
    stride of the loop as written and as compiled (the extractor of IDEA-20260821-121612 is reused
    here rather than reinvented); (v) WHETHER THE ROUTINE IS THE SAME SYMBOL, OR THE SAME MECHANISM
    CLASS, AS THE ONE THE DECAPSULATION RE-ENCRYPTION COMPARISON CALLS. Fact (v) is the
    discriminator of claim (C) and is answered by reading the call graph, with the symbol names
    quoted in the report.
    S3 -- INSTRUMENTED CONFIRMATION OF THE BLINDNESS RESULT, ON PLANTED CHECKS. In a laboratory
    build, plant a modulus check with a declared C-COV(w) deficit at each of the enumerated cells,
    and drive it with fibre members at weight 1 whose difference support is known exactly. FORCED
    BY THE DERIVATION: zero detections in every unobservable cell, for every probe budget, because
    D is contained in [0, 384k) and S is contained in [384k, L_ek); and detection on 100% of probes
    whose support lies inside the deficit in the three observable cells. Both directions are
    measured, and the second is what proves the harness is not simply blind.
    S4 -- THE PUBLISHED-CORPUS BOUND, MEASURED RATHER THAN ASSERTED. Run a subset of the C2SP/CCTV
    `modulus/` vectors against the same planted checks. PREDICTED: the corpus detects the deficit
    in the three observable cells and NOT in the nine unobservable ones -- not because the corpus is
    weak but because no input can. This converts "CCTV dominates this record on the reject
    observable" into a measured statement with a named exception, which is the honest form.
    S5 -- SUBSIDIARY CONSEQUENCE ARM: WHAT AN ACCEPTED NON-CANONICAL KEY COSTS. Retained from the
    predecessor because its forced-value derivation is the reason the primary observable of this
    record is the check's ACCEPT/REJECT verdict and not the ciphertext. FIPS 203 derives
    (K, r) = G(m || H(ek)), so a fibre member ek' != ek gives H(ek') != H(ek), hence different
    coins, hence a different ciphertext and shared secret in EVERY implementation,
    unconditionally: "do outputs differ along the fibre?" is FORCED to YES and carries zero
    information (KN-TECH-1a5b7e mode 3). Only with the hash channel closed by construction in a
    laboratory build does the ciphertext observable say anything, and then it separates E-BIND (the
    decode reduces; the check guards encoding canonicity and key-byte binding only) from E-ARITH
    (an unreduced representative reaches the NTT or Compress). This arm is run last, is reported as
    subsidiary, and its negative direction is permanently bounded by the sampled fibre weights.
    The derived interop consequence under E-BIND is exact and cheap to check: the legitimate key
    holder's dk carries h = H(canonical ek), so the re-derived coins differ, the re-encryption
    comparison fails, and decapsulation returns the implicit-rejection value -- a self-inflicted
    interoperability failure by a party who chose a non-canonical encoding, transferring no
    advantage to anyone.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant; it
      answers nothing). Retrieval was the Grep tool (ripgrep) over
      /home/user/crypto-autoresearcher plus WebSearch/WebFetch, both of which work here.
      Commands and results as run: (G1) pattern `modulus check|ByteDecode|ByteEncode|
      non-canonical|noncanonical`, -i, over **/*.{yaml,md}, files_with_matches -> 229 files,
      overwhelmingly ECDLP records matching on unrelated uses of "canonical"; the ML-KEM
      matches were IDEA-20260805-3c957e, IDEA-20260805-1beeca, H-MLKEM-d9062d,
      EV-MLKEM-159715. (G2) pattern `ByteDecode|ByteEncode|modulus check|canonical encoding|
      3329`, -i, over ledger/, content mode, first 40 matching lines inspected -> the only
      ByteEncode/ByteDecode hit in the whole ledger is EV-MLKEM-159715 line 420-423.
      (G3) pattern `input validation|implicit rejection|domain separation`, -i, over ledger/,
      files_with_matches -> 25 files, of which the ML-KEM ones are IDEA-20260806-7c1ae4,
      IDEA-20260808-95a21c, IDEA-20260807-1f5f89, IDEA-20260805-cec9b6 and H-MLKEM-232843, all
      under RQ-MLKEM-001 or later ML-KEM questions and none under RQ-MLKEM-002.
      (G4) pattern `strcmp|CCTV|C2SP|MAL-BIND|Kemmy`, -i, over **/*.{yaml,md}, count mode ->
      8 occurrences across 5 files, NONE under RQ-MLKEM-002 and none about ML-KEM key encoding.
      (G5) targeted read of EV-MLKEM-159715 lines 405-439.
      Read in full or in relevant part: RQ-MLKEM-002; the lane's five-proposal inventory;
      IDEA-20260805-3c957e and IDEA-20260805-ee2018 in full; IDEA-20260805-1beeca's claim block;
      IDEA-20260724-002's head; GOAL-MLKEM-002's status and checkpoints;
      knowledge/techniques/KN-TECH-1a5b7e.md in full; docs/inventor-protocol.md;
