    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST ESTIMATE, NOT A
      STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY PARAMETER SET. An unobservable
      deficit at this site is not a vulnerability: the bytes unread cannot differ. RQ-MLKEM-002's
      constraints bind unchanged; any newly observed conformance defect escalates to the
      coordinator and is published by no agent.
    - >-
      SCOPE FIT, STATED PLAINLY BECAUSE THE PREDECESSOR OF THIS RECORD GOT IT WRONG. This record's
      object is a bounded comparison/checking tail in the same defect-mechanism neighbourhood as
      the lane's, reached at the encapsulation boundary, and it bears directly on RQ-MLKEM-002's
      decision target by supplying additional comparison routines -- one per implementation,
      including implementations rejected at the decapsulation site -- and by deciding whether the
      lane's existing evidence covers them. It is covered by RQ-MLKEM-002's scope methods
      "multi-class mutation generators" and, on a broad reading, "cross-implementation comparison
      of fixed-bound vector comparison tails". IT IS NOT covered by "differential conformance
      testing of re-encryption comparison" or by "Algorithm-18 decapsulation-boundary attestation".
      IF THE COORDINATOR READS THE FOURTH METHOD NARROWLY AS THE RE-ENCRYPTION SITE ONLY, this
      record needs a scope amendment or a new question before dispatch -- but unlike its
      predecessor its delta against the lane's decision target is not zero, and the routing choice
      is the Coordinator's alone.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, EV-MLKEM-159715, IDEA-20260805-3c957e or any
      hypothesis, evidence or decision record.
    - >-
      THIS RECORD IS A REPAIRED REVISION AND ITS PREDECESSOR'S OBJECT IS WITHDRAWN: the decode
      fibre as an input-validation question, the E-BIND/E-ARITH pair as the headline, and the
      statement "this record does not answer RQ-MLKEM-002's comparison question" are all replaced.
      No experiment was run under the previous text.
    - >-
      Claim tier laboratory/toy, not raisable by citation. A conclusion is scoped to the sampled
      keys, the planted cells, the patched builds and the parameter sets actually run; the
      arithmetic in claim (B) is scoped to the enumerated w grid and says nothing about strides
      outside it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        LIFTABLE-COUNT DISTRIBUTION. FOR A FRESHLY GENERATED ML-KEM encapsulation key at
        parameter k, the number M of coefficients of t-hat lying in [0, 767) is distributed as
        Binomial(256k, 767/3329); consequently the decode fibre has size 2^M with
        E[M] = 256*k*767/3329 = 117.96, 176.95, 235.93 for k = 2, 3, 4, and the expected fraction
        of coefficient-region byte positions reachable by weight-1 lifts is
        (2p + 1 - (1-p)^2)/3 = 0.290 at p = 767/3329.
      rigorous_support: >-
        Pairs a rigorous structural fact with a classical distributional statement. RIGOROUS PART:
        the packing rule fixes each lift's two-byte footprint exactly, and t-hat = A-hat * s-hat +
        e-hat where A-hat is sampled by FIPS 203's rejection sampler from a XOF whose
        per-candidate acceptance probability is exactly 3329/4096 -- a quantity this repository
        already treats as exact in H-MLKEM-34e22e -- so A-hat is uniform over Z_q by construction.
        DISTRIBUTIONAL PART: the assumption imitates the standard decision-MLWE statement that
        (A-hat, t-hat) is indistinguishable from uniform, i.e. that t-hat behaves like a uniform
        element of Z_q^{256k} with respect to any efficiently computable statistic, of which the
        liftable-count is one. IT IS A HEURISTIC AND NOT A THEOREM.
      validation_plan: >-
        Sample 10^3 keys per parameter set from a reference implementation and 10^3 more from a
        second independent implementation as a sampler-bias guard. Count M per key and compare
        against Binomial(256k, 767/3329) by: mean against 117.96 / 176.95 / 235.93 within 3
        standard errors; variance against 256k*p*(1-p); a chi-square over bins of one standard
        deviation; and TAIL CONSISTENCY against the binomial's 1/10^3 quantiles. Separately measure
        positional_reach against the derived 0.290. Sampled parameters and implementations are
        recorded; no transfer to any other key distribution is claimed.
    - id: H2
      statement: >-
        TAIL EQUALITY. FOR ALL implementations under test, the buffer the modulus check compares
        against ek agrees with ek on the trailing 32 bytes by construction, so the
        observable-difference support is contained in [0, 384k).
      rigorous_support: >-
        Rigorous given the specified check (ByteEncode_12(ByteDecode_12(ek)) == ek operates on the
        coefficient field and rho is carried through) and given the recalled key layout. NOT
        rigorous per implementation: a build that constructs its comparison buffer differently, or
        that compares a length other than 384k or 384k+32, breaks it. THE ENTIRE BLINDNESS RESULT
        RESTS ON THIS ASSUMPTION, which is why it is stated as an assumption and not as a fact.
      validation_plan: >-
        Per build, instrument the check to dump both compared buffers on a canonical key and on a
        weight-1 fibre member, and record the exact set of positions at which they differ. Predicted
        for every build: the empty set on a canonical key, and exactly the derived two-byte
        footprint on a weight-1 member. THE PREDICTION IS MADE PER BUILD BEFORE ITS DETECTION
        NUMBERS ARE READ, so H2 is not fitted after the fact, and a build that fails it is reported
        as outside the result's domain rather than folded into the average.
    - id: H3
      statement: >-
        STRIDE GRID SUFFICIENCY. The grid w in {1,2,4,8,16,32,64,128,256,512} contains every stride
        a mainstream ML-KEM comparison body plausibly exhibits.
      rigorous_support: >-
        None; it is a convenience grid inherited from IDEA-20260805-3c957e and extended by one
        power of two. Non-power-of-two strides (a 48-byte body, a 96-byte unrolled body) are NOT in
        the grid and their residues differ; nothing in the derivation requires a power of two, so
        the grid can be extended at zero cost, and the record states its conclusion over the grid
        rather than over all strides. THIS IS THE ASSUMPTION MOST LIKELY TO UNDERSTATE THE NUMBER
        OF OBSERVABLE CELLS.
      validation_plan: >-
        Take the strides actually measured by the sibling record's extractor on real builds
        (IDEA-20260821-121612) and check each against the grid; any measured stride outside it is
        added as a row and its cell computed, before any detection number is read. Report the
        deficit table over the union.

  proof_search_map:
    bottleneck: >-
      The step from "an ML-KEM implementation contains a second bounded comparison" to "and
      therefore the lane can observe it". Everything else -- the residue arithmetic, the
      containment law, the generator's support law -- is closed form. This step is where the key
      layout enters, and it is the only place where the answer could have been either way.
    baseline_embedding:
      parameter_slice: >-
        Restrict this proposal to the accept/reject observable at weight 1 over coefficient
        positions and it reduces exactly to running the published C2SP/CCTV `modulus/` corpus,
        which is the incumbent instrument for this site. The proposal is therefore a family
        extension along two axes: from "does the build reject invalid keys" to "which positions can
        a deficit hide at", and from one site to the relation between two sites.
      reproduction_check: >-
        Two frozen fixtures, both run before anything new is read: NULL-4 must reproduce the CCTV
        corpus's declared expected outcome (rejection) on unmodified conformant builds, and NULL-5
        must reproduce IDEA-20260805-3c957e's five reachable ciphertext cells from the same
        arithmetic layer. A failure of either halts the run.
    observation_collision:
      observable: >-
        The check's accept/reject verdict on a non-canonical encapsulation key.
      distinct_preimage_search: >-
        The collision is exhibited and it is the record's content: "the check is complete" and "the
        check has a deficit contained in the rho tail" produce the IDENTICAL verdict on every
        possible input to this site -- an exact observational equivalence, not a statistical one,
        and it holds for every w <= 128 at every parameter set. The additional structure that
        separates them is not another input but a different kind of evidence: the static reading of
        the routine, and the call-graph fact of whether the routine is shared with a site where the
        deficit IS observable. Naming an equivalence that no input can break, and then naming the
        non-input evidence that breaks it, is what this proposal contributes.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the check's verdict) fixed and vary the forgotten structure (the
          check's silent set). The fibre over "reject everything invalid" contains the complete
          check AND every rho-tail-deficient check; the intrinsic invariant separating them is the
          set of positions the routine reads, which no input to this site can expose.
        predicted_gain: >-
          Converts a compliance question with a known answer into a statement about the LIMITS of
          conformance testing at a named site, with an exact boundary (w <= 128 blind, three named
          observable cells) and a concrete follow-up that does not need a better input.
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure "positions at which the compared buffers can differ" as a
          per-key quantity, realise it by specialising to the FIPS 203 key layout, and charge the
          deficit only against the coefficient region rather than the whole buffer.
        predicted_gain: >-
          An exact disjointness argument instead of a probabilistic one: detection is impossible
          rather than unlikely, which is a strictly stronger and cheaper statement.
    quantifier_order: >-
      What a conformance null at this site appears to say: FOR ALL invalid keys, the build rejects,
      THEREFORE the check is complete. What it supports: FOR ALL invalid keys ek' REACHABLE BY THE
      CORPUS, i.e. differing from the canonical re-encoding only inside [0, 384k), the build
      rejected -- and there EXISTS a family of incomplete checks (any C-COV(w) with w <= 128) for
      which no reachable ek' exists at all. The witness is allowed to depend on the stride, and for
      every stride in a large class the witness set is EMPTY, which is exactly what makes the
      universally-quantified conclusion unavailable. Writing the order out is the argument for the
      census.
