  assumptions:
    - >-
      A laboratory build can be produced in which the value hashed into G is forced to the
      canonical H(ek) while the decoded key material still flows from ek'. If it cannot for a
      given implementation, that implementation is reported as unmeasurable, not as E-BIND.
    - >-
      The modulus check can be disabled in a laboratory build without disturbing anything else
      on the path. A disable that also changes decode behaviour would confound E-ARITH and
      E-BIND, and the diff of the disabling patch is a required artifact for exactly this reason.
    - >-
      The sub-sampled fibre members at weights 1, 2 and up to 8 are representative of the whole
      fibre for the purpose of detecting arithmetic divergence. THIS IS A TRANSFER ASSUMPTION
      AND IT IS ONE-SIDED: finding a divergence at low weight proves E-ARITH; finding none at
      low weight does NOT prove E-BIND over the full 2^118-member fibre, and the record must
      state its conclusion as "no divergence at the sampled weights" and never more.
    - >-
      Everything is scoped to the builds, versions, flags, parameter sets and sampled keys
      actually used. Laboratory conformance evidence is never crypto-scale or MLWE evidence.

  predictions:
    - metric: >-
        liftable_residue_count: |{c in [0, 3329) : c + 3329 <= 4095}|, recomputed under the
        frozen script
      direction: different
      minimum_effect: >-
        EXACTLY 767, with no tolerance. Any other value means the arithmetic in claim (A) is
        wrong and every downstream number with it.
    - metric: >-
        mean_liftable_coefficients: the sample mean, over 10^4 freshly generated keys per
        parameter set, of the number of coefficients c with c <= 766
      direction: different
      minimum_effect: >-
        Within 3 binomial standard errors of 256*k*767/3329, i.e. of 117.96 (k=2), 176.95
        (k=3), 235.93 (k=4). At 10^4 samples the standard error is about 0.10 for k=2, so the
        window is roughly +-0.29. A departure falsifies H1 and is itself a finding about the
        distribution of t-hat coefficients.
    - metric: >-
        forced_arm_divergence: the fraction of non-canonical fibre members whose ciphertext
        differs from the canonical-key ciphertext under the ORDINARY code path (S2)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0, and this is declared as a FORCED value carrying no information about
        E-BIND versus E-ARITH. It is predicted so that the artifact records the forced value
        explicitly. Anything other than 1.0 would mean the H(ek) channel is not what the recalled
        specification says it is, which would be a spec-reading failure and would halt the run.
    - metric: >-
        hash_fixed_divergence: the fraction of sampled non-canonical fibre members whose
        ciphertext differs from the canonical-key ciphertext under the S3 hash-fixed path, per
        build
      direction: different
      minimum_effect: >-
        The discriminator. EXACTLY 0.0 for a build is E-BIND at the sampled weights: the check's
        function there is encoding canonicity and binding, nothing else. Strictly above 0.0 is
        E-ARITH for that build, and the record names the first differing byte and the decoded
        coefficient values from S4. Both outcomes are reachable and both are complete answers.
    - metric: >-
        NULL-3 sensitivity: the fraction of canonical single-coefficient perturbations whose
        ciphertext differs under the identical S3 path
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0. Below 1.0 the ciphertext observable does not read the key through the
        hash-fixed path and NO E-BIND conclusion may be drawn from a zero divergence.
    - metric: >-
        implicit_rejection_rate: the fraction of ciphertexts produced under a non-canonical
        fibre member (ordinary path) that the legitimate key holder's decapsulation implicitly
        rejects
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0 under the E-BIND account. A value below 1.0 means the derived interop
        consequence in S5 is incomplete and the account must be revised before it is reported.

  minimal_test:
    design: >-
      Six stages, cheapest and most decisive first, on laboratory builds from public source
      only. S0 (minutes, zero risk): recompute 767 and the three expected liftable counts under
      a frozen script, and read FIPS 203 to confirm the ByteDecode_12 mod-q rule and the Encaps
      input checks; a failure to obtain the standard is recorded as infrastructure and the
      recalled label stays. S1 (minutes): generate 10^4 keys per parameter set with a reference
      implementation, count liftable coefficients, and score H1 against Binomial(256k,
      767/3329) with a chi-square on binned counts plus min/max tail checks. THIS STAGE ALONE
      IS THE CHEAP DECISIVE PART and needs no lab build at all. S2 (minutes): score NULL-1,
      NULL-2, NULL-3 and NULL-4 and commit their verdicts BEFORE any fibre member is scored.
      S3 (bounded): the forced arm, run and reported as forced. S4 (bounded): the hash-fixed
      discriminating arm over sampled fibre members at weights 1, 2 and up to 8, on each
      laboratory build. S5 (bounded): decode instrumentation where a divergence appears, and the
      implicit-rejection consequence check. Total compute is dominated by 10^4 keygens per
      parameter set plus a few thousand encapsulations -- minutes on one core; the real cost is
      building and patching the implementations, which is why implementation is rated medium.
    controls:
      - NULL-1 determinism; forced identical; voids S3/S4 if it fails.
      - NULL-2 the empty fibre; forced zero enumerated members; voids S1 if it fails.
      - NULL-3 the canonical-perturbation sensitivity control; forced 100% divergence; without it no E-BIND reading is admissible.
      - NULL-4 the CCTV corpus cross-check on unmodified builds; forced rejection for a conformant build.
      - >-
        GRADED INTERIOR: canonical perturbations of weight 1, 2, 4, 8, 16 through the same path,
        with the differing-byte count reported at each; monotonicity is measured, not assumed.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE CONCLUSION MUST FAIL: a genuinely DIFFERENT canonical
        key. The E-BIND prediction "identical ciphertexts along the fibre" must NOT extend to
        it; if the harness reports identity there, it is comparing the wrong things and every
        identity result is void.
      - >-
        ORDERING AND PROVENANCE: the disabling patch diff, the hash-fixing patch diff, the build
        flags, the pinned commits and the frozen script hashes are all committed before S3, so
        no arm can be adjusted after a number is seen.
    required_metrics:
      - the recomputed liftable-residue count and the three expected fibre exponents, with the script hash
      - the empirical liftable-count distribution per parameter set against the binomial prediction, with chi-square and tail checks
      - NULL-1 through NULL-4 verdicts, emitted before any fibre arm
      - forced-arm divergence fraction (S2), reported as forced
      - hash-fixed divergence fraction per build per weight (S3), with the sampled member count
      - for any divergence: the first differing ciphertext byte, the decoded coefficient values, and whether the divergence entered at the NTT or at Compress
      - implicit-rejection rate from S5
      - every patch diff, build configuration and pinned commit

  falsification_conditions:
    - >-
      liftable_residue_count != 767, or FIPS 203's ByteDecode_12 does not reduce mod q. The
      fibre is trivial or miscounted and THE PROPOSAL IS WITHDRAWN IN FULL.
    - >-
      mean_liftable_coefficients outside 3 standard errors of the binomial prediction at any
      parameter set. H1 fails; the expected fibre sizes are wrong and are replaced by the
      measured distribution, with the departure reported as its own finding.
    - >-
      NULL-3 below 1.0. The ciphertext observable is blind through the hash-fixed path; NO
      E-BIND verdict may be reported from a zero divergence, and the arm must be redesigned.
    - >-
      NULL-1 fails or NULL-2 emits a member. Harness or enumerator failure; nothing is
      reportable.
    - >-
      hash_fixed_divergence = 0 at every sampled weight in every build. E-ARITH is not
      supported at the sampled weights and the check's measured function on this population is
      canonicity and binding. THIS IS THE EXPECTED-TO-BE-COMMON OUTCOME, it is a negative for
      the E-ARITH hypothesis, and it is a complete deliverable -- it must be reported as "no
      divergence at weights 1, 2 and <= 8 over n sampled members", never as "the fibre is
      inert".
    - >-
      Builds cannot be patched, or a library cannot be built. INFRASTRUCTURE outcome under
      AGENTS.md rule 3, never evidence about that implementation.

  confounders:
    - >-
      THE FORCED HASH CHANNEL. Stated in claim (C) and designed around, but it will re-enter
      anywhere the harness accidentally lets ek' bytes reach a hash: a build that hashes ek
      inside its own KeyGen-derived context, or that stores H(ek) alongside the key, can leak
      the channel back in. The S4 decode instrumentation and the NULL-3 control together are
      what would expose it; a divergence that disappears when the hash is re-fixed more
      thoroughly is a harness artifact and must be reported as one.
    - >-
      THE DISABLING PATCH ITSELF. Removing the modulus check may in some codebases also remove a
      reduction that happens to be adjacent, manufacturing an E-ARITH result out of the patch
      rather than the implementation. The patch diff is a required artifact and a reviewer must
      be able to see that only the check was removed.
    - >-
      SUB-SAMPLING IS ONE-SIDED. The fibre has about 2^118 members at ML-KEM-512 and the
      experiment sees a few thousand. A positive (divergence found) is conclusive for that
      build; a negative is bounded by the sampled weights and must be phrased that way every
      time it is restated.
    - >-
      2^118 IS NOT A SECURITY PARAMETER. Every fibre member encodes the same PUBLIC key, and the
      count is a combinatorial fact about an encoding, not a work factor, not an entropy, and
      not a bound on anything an adversary must do. Any restatement of it as a cost is a
      category error and is forbidden by this record's interpretation limits.
    - >-
      REFERENCE-IMPLEMENTATION BIAS IN H1. The 10^4 keys are drawn from whichever
      implementation's KeyGen is used; a biased sampler would bias the liftable counts. Drawing
      from two independent implementations and comparing the two empirical distributions is the
      cheap guard and is part of S1.
    - >-
      SPEC PROVENANCE. The single load-bearing external input is recalled, not verified, because
      a PDF fetch failed. Every downstream number carries that label until S0 replaces it.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST ESTIMATE, NOT A
      STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY PARAMETER SET. The only derived
      consequence, S5's implicit rejection, is a self-inflicted interoperability failure by a
      party who chose a non-canonical key encoding, and it transfers no advantage to anyone.
      RQ-MLKEM-002's constraints bind unchanged; any newly observed conformance defect escalates
      to the coordinator and is published by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, EV-MLKEM-159715, or any hypothesis,
      evidence or decision record. The encode-direction statement in EV-MLKEM-159715 is correct
      and is not corrected here.
    - >-
      This record does NOT answer RQ-MLKEM-002's comparison question and does not transfer to
      it. It applies the isolation-versus-systemic METHOD to a second, independently reachable
      conformance object; a result about the modulus check says nothing about a comparison tail,
      and the reverse.
    - >-
      Claim tier laboratory/toy, not raisable by citation. A conclusion is scoped to the sampled
      keys, the sampled fibre weights, the patched builds and the parameter sets actually run.

  heuristic_assumptions:
    - id: H1
      statement: >-
        LIFTABLE-COUNT DISTRIBUTION. FOR A FRESHLY GENERATED ML-KEM encapsulation key at
        parameter k, the number M of coefficients of t-hat lying in [0, 767) is distributed as
        Binomial(256k, 767/3329); consequently the decode fibre has size 2^M with
        E[M] = 256*k*767/3329 = 117.96, 176.95, 235.93 for k = 2, 3, 4.
      rigorous_support: >-
        Pairs a rigorous structural fact with a classical distributional statement, in the
        exemplar's shape. RIGOROUS PART: t-hat = A-hat * s-hat + e-hat where A-hat is sampled by
        FIPS 203's rejection sampler from a XOF, whose per-candidate acceptance probability is
        exactly 3329/4096 -- a quantity this repository already treats as exact in
        H-MLKEM-34e22e -- so A-hat is uniform over Z_q by construction. DISTRIBUTIONAL PART: the
        assumption imitates the standard decision-MLWE statement that (A-hat, t-hat) is
        indistinguishable from uniform, i.e. that t-hat behaves like a uniform element of
        Z_q^{256k} with respect to any efficiently computable statistic, of which the
        liftable-count is one. IT IS A HEURISTIC AND NOT A THEOREM: uniformity of t-hat is not
        proved, only assumed to hold for this statistic, and the assumption is stated rather
        than smuggled in.
      validation_plan: >-
        Sample 10^4 keys per parameter set (ML-KEM-512, -768, -1024) from a reference
        implementation, and 10^4 more from a second independent implementation as a
        sampler-bias guard. For each key count M. Compare the empirical distribution of M
        against Binomial(256k, 767/3329) by: mean against the predicted 117.96 / 176.95 /
        235.93 within 3 standard errors; variance against 256k*p*(1-p); a chi-square over bins
        of width one standard deviation; and TAIL CONSISTENCY, comparing the minimum and
        maximum M observed in 10^4 draws against the binomial's 1/10^4 quantiles. Sampled
        parameters and the exact implementations are recorded; no transfer to any other key
        distribution is claimed.
    - id: H2
      statement: >-
        DECODE REDUCTION. FOR ALL implementations under test, ByteDecode_12 as implemented
        yields coefficients in [0, q); equivalently no representative >= q reaches the NTT or
        the compression step.
      rigorous_support: >-
        Specified behaviour under the recalled FIPS 203 rule, corroborated by a fetched
        secondary source (the CCTV README's quotation of the modulus-check phrasing). NOT
        rigorous per implementation: masking a 12-bit field without a subsequent conditional
        subtraction is a plausible optimisation, and where it occurs H2 is false for that build
        by construction.
      validation_plan: >-
        Instrument the decode in each laboratory build and record the maximum decoded
        coefficient over all fibre members fed. A build whose maximum is < q satisfies H2 and
        its hash-fixed divergence is predicted to be exactly 0; a build whose maximum is >= q
        violates H2 and is predicted to diverge unless a later reduction absorbs it. THE TWO
        PREDICTIONS ARE MADE PER BUILD BEFORE ITS DIVERGENCE IS MEASURED, so H2 is not fitted
        after the fact.
    - id: H3
      statement: >-
        WEIGHT SUFFICIENCY. IF a build's arithmetic diverges anywhere on the fibre, it diverges
        at some member of Hamming weight <= 8 in lift-space.
      rigorous_support: >-
        None. It is a sampling convenience with a plausible but unproved monotonicity intuition
        (a single lifted coefficient already places an out-of-range value into the pipeline), and
        it is the assumption that makes a 2^118-member object affordable. It is stated as an
        assumption because a negative result depends on it entirely.
      validation_plan: >-
        Where any divergence is found, record the MINIMUM weight at which it appears; if that
        minimum is 1 in every diverging build, H3 is corroborated on those builds. Where no
        divergence is found, H3 is UNVALIDATED and the negative is reported as bounded by the
        sampled weights, explicitly, in the same sentence as the number.

  proof_search_map:
    bottleneck: >-
      The step from "the modulus check was omitted" to "and therefore X". FIPS 203 mandates the
      check; no record in this program, and nothing found in the sources fetched this session,
      states what an omission functionally COSTS beyond rejection failure. Supplying that step
      is what changes the statement from a compliance item into a mechanism.
    baseline_embedding:
      parameter_slice: >-
        The C2SP/CCTV `modulus/` corpus is the exact boundary case: restrict this proposal to
        the pass/fail observable and to Hamming weight 1 in lift-space, and it reduces to that
        published corpus's test. The proposal is therefore a family extension along two axes --
        the observable (from accept/reject to ciphertext bytes) and the weight (from 1 to <= 8).
      reproduction_check: >-
        Frozen fixture: a subset of the CCTV `modulus/` vectors is run against every unmodified
        build and must produce rejection, before any patched build is touched (NULL-4). A
        failure to reproduce the public corpus's expected outcome halts the run.
    observation_collision:
      observable: >-
        The ciphertext bytes emitted by Encaps under the hash-fixed path.
      distinct_preimage_search: >-
        The collision is not merely present, IT IS THE E-BIND HYPOTHESIS: under E-BIND all 2^M
        distinct fibre members produce the identical observable, a fibre of size 2^118 over one
        observation. This is stated up front so no reader treats it as a hidden falsifier. What
        makes the design sound despite the collision is that the conclusion does not require
        recovering ek' from the observable; it requires distinguishing "collision" from
        "no collision", and NULL-3 supplies the object -- a canonical perturbation -- on which
        the collision must NOT occur. Without NULL-3 the collision would be indistinguishable
        from a blind instrument, which is precisely mode 2.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the ciphertext) fixed and vary the forgotten structure (which
          liftable positions were lifted). The intrinsic invariant distinguishing the resulting
          objects is H(ek) -- the one function in the pipeline that reads bytes rather than
          coefficients -- and the experiment's whole design is closing that invariant off to
          see whether anything else distinguishes them.
        predicted_gain: >-
          Converts a compliance question with a known answer into a two-hypothesis experiment
          with a forced channel identified and closed, which is the difference between a test
          and a measurement.
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure "number of liftable coefficients M" as a per-key quantity,
          realise it by specialising to freshly generated keys, and charge fibre size only over
          the provably disjoint blocks of independent coefficient positions -- which is what
          makes the fibre size exactly 2^M rather than an estimate.
        predicted_gain: >-
          An exact count instead of a bound, and a per-key quantity that can be sampled and
          tested against a named distribution, which is what H1's validation plan does.
    quantifier_order: >-
      The claim is: FOR ALL builds b in the tested set, FOR ALL sampled fibre members ek' of
      FOR ALL sampled keys ek, EXISTS an outcome in {identical, differing} such that the
      hash-fixed ciphertext under b relates to the canonical ciphertext that way; and the
      hypothesis E-BIND asserts the outcome is `identical` UNIFORMLY in ek' while E-ARITH
      asserts it is `differing` for SOME ek'. The asymmetry matters: E-ARITH needs one witness
      and is therefore cheaply provable; E-BIND is universally quantified over an object of
      size 2^118 and is therefore NEVER provable by this experiment, only supported over the
      sampled weights. That asymmetry is the reason H3 exists and the reason every negative is
      phrased as bounded.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For build b, at parameter set P, over n sampled fibre members of Hamming weight <= 8
        in lift-space, the hash-fixed ciphertext was byte-identical to the canonical-key
        ciphertext in all n cases, on an instrument whose sensitivity control fired at 100%."
        It cannot certify anything about the unsampled 2^118 - n members, about other builds,
        about other parameter sets, or about any deployed system.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion FAILS is a genuinely different
        canonical key: it must produce a different ciphertext through the identical hash-fixed
        path. A method that reported identity there would be measuring the harness and not the
        pipeline. The graded canonical perturbations at weights 1, 2, 4, 8, 16 interpolate
        between the two and are reported as a table.
    proof_obligations:
      - claim: Exactly 767 residues in [0, q) admit a second 12-bit preimage.
        responsibility: size
      - claim: Fibre size is exactly 2^M for a key with M liftable coefficients.
        responsibility: size
      - claim: M is distributed Binomial(256k, 767/3329) for freshly generated keys.
        responsibility: success_probability
      - claim: Under the ordinary path, divergence along the fibre is forced by the H(ek) channel.
        responsibility: baseline
      - claim: The hash-fixed path removes that channel and no other channel replaces it.
        responsibility: correctness
      - claim: The ciphertext observable moves when the decoded key genuinely moves.
        responsibility: strictness
      - claim: A negative is bounded by the sampled weights and never restated as a fibre-wide claim.
        responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS IMPLIED; RQ-MLKEM-002 forbids attack-cost
      estimation and no algorithm against any cryptographic problem is proposed. The exponents
      that DO appear -- fibre sizes of about 2^118, 2^177 and 2^236 -- are COMBINATORIAL COUNTS
      OF BYTE STRINGS ENCODING A PUBLIC KEY and are explicitly not work factors, not entropies,
      and not security parameters. Measurement cost: 3 x 10^4 keygens plus a few thousand
      encapsulations and decapsulations, i.e. minutes on one core.
    memory_exponent: >-
      n/a as an attack quantity. Storage is the sampled fibre members and their ciphertexts,
      O(n * (384k + 32 + L)) bytes; at n = 10^4 this is well under a gigabyte. The full fibre is
      NOT stored, NOT enumerated, and cannot be.
    best_known: >-
      No incumbent inside this repository: nothing computes a decode-side fibre or measures
      output variation along one. Outside, the C2SP/CCTV `modulus/` corpus is the incumbent for
      the REJECT observable and is exhaustive over single-position invalid values, which this
      proposal does not attempt to match and explicitly defers to.
    hidden_overhead: >-
      Two honest overheads. First, the load-bearing specification rule is RECALLED because a PDF
      fetch failed, so the whole record is one spec-reading away from withdrawal, and that is
      stated in the claim rather than in a footnote. Second, the E-BIND direction is universally
      quantified over an object of size 2^118 and the experiment sees O(10^3) of it; no amount
      of compute available to this program changes that, so the negative direction is
      permanently bounded by H3 and by the sampled weights.
    tradeoff_note: >-
      The only tradeoff is sample weight versus coverage: higher lift-weights explore more of
      the fibre per member but are less likely to isolate WHERE a divergence enters, since a
      weight-1 member names the responsible coefficient outright. The design therefore spends
      most of its budget at weight 1, which maximises localisation per probe, and uses higher
      weights only as a cheap hedge against a divergence that requires several lifts to appear.
      Parallelisation is trivial across members and across builds.

  dominated_by: >-
    n/a (no result claimed; no attack, no algorithm, no cost triple across time, memory or
    data/queries, hence no Pareto row). Rows checked on 2026-08-21. INSIDE the repository: all
    five RQ-MLKEM-002 proposals; GOAL-MLKEM-002 and its checkpoints; EV-MLKEM-159715; the ML-KEM
    files returned by greps G1, G2 and G3. None computes a decode fibre, a liftable-residue
    count, or any consequence of omitting an input-validation check; nothing dominates and
    nothing is dominated. OUTSIDE: exactly two rows were checked, both fetched. The C2SP/CCTV
    `modulus/` corpus DOMINATES this proposal on the reject observable -- it is exhaustive over
    every out-of-range value at every position, it is public, and it already exists -- and does
    not address the output observable at all; that domination is real and is why this record
    defers that half entirely. Schmieg eprint 2024/523 dominates on the binding question, which
    this record does not enter. No further external search was performed and no external novelty
    is claimed; absence of a search result is not evidence of absence.
  sota_delta: >-
    No attack; mechanism and measurement contribution only. Quantitatively against this
    repository's state: the corpus currently contains zero statements about ML-KEM
    input-validation checks and one statement about ByteEncode12/ByteDecode12 that concerns the
    encode direction; this adds an exact decode-side count (767 liftable residues), three exact
    fibre-size exponents, a distributional prediction with a validation plan, and a two-outcome
    experiment for what an omitted check costs. Against the public CCTV corpus the delta is the
    observable: from accept/reject to ciphertext bytes under a closed hash channel, which the
    corpus cannot express because rejection is the same verdict for every invalid key regardless
    of what it decodes to. Against the lane's decision target the delta is honestly zero: this
    answers nothing about the comparison-defect class, and it says so.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That ByteDecode_12 reduces mod q and the liftable count is exactly 767: ~0.9 --
    the arithmetic is elementary and two independent secondary sources corroborate the mod-q
    rule, but the primary source could not be fetched this session and one wrong recollection
    takes the whole record with it. (ii) That H1's binomial prediction survives 10^4 samples per
    parameter set: ~0.85; t-hat's uniformity is a standard working assumption and the statistic
    is coarse. (iii) That NULL-3 fires at 100%, licensing the instrument: ~0.85. (iv) That at
    least one build under test shows E-ARITH, i.e. hash-fixed divergence: ~0.3, AND I WOULD BET
    AGAINST IT -- correct implementations reduce on decode, and the likeliest outcome is a clean
    E-BIND result across every build, which is a negative for the more dramatic hypothesis and a
    complete answer to the question "what is this check for". (v) That the S5 implicit-rejection
    consequence is observed at 100% where E-BIND holds: ~0.9. (vi) That the whole thing is
    delivered with the forced-value derivation visible in the artifact rather than buried: ~0.95,
    since that derivation is the reason the design exists.

