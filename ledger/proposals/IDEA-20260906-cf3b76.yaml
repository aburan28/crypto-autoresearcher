    in-session handoff TASK-20260906-ideation-RQ-ECDLP-78dbc5. Not derived by
    scanning state.
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-06'

  title: >-
    THE OFFSPRING-VARIANCE INVARIANCE CONTROL: every point-local
    distinguishing rule at fixed expected walk length W (in-degree-gated,
    parent-gated, two-class theta by a point bit) and every continue-through /
    chained-DP walk semantics is predicted to leave the basin-size cutoff
    2 W^2, the oracle ceiling C_max(a) and the online cost per unit coverage
    unchanged to O(1/W) -- so the "non-uniform theta" and "chained DP"
    directions of the handoff are predicted to buy ZERO, and a CI-separated
    positive on any arm is the first sign of room below the Borel ceiling
  class: control

  claim: >-
    (A) THE ARGUMENT (derivation of this record, to be re-derived by a
    validator). Under H1 of IDEA-20260906-aed829 the walk's functional graph
    has in-degrees k ~ Poisson(1). Let a distinguishing rule cut a point x
    with probability c(x) depending only on x's hash bits and its O(1)
    neighbourhood in the functional graph (its own in-degree k, its parent's
    mark, a bit of x). A walk ARRIVES at a point through an in-edge, so the
    expected walk length is W = 1/theta_eff with theta_eff = E[k c(k)] (the
    in-degree-weighted cut rate), which need not equal the point density
    theta_d = E[c(k)]. The basin of a DP is the tree of surviving (uncut)
    ancestors. For a surviving node the expected number of surviving
    children is E[k | survived] * (1 - theta_d) with
    E[k | survived] = E[k (1 - c(k))]/(1 - theta_d) = (1 - theta_eff)/(1 - theta_d),
    hence EXACTLY 1 - theta_eff = 1 - 1/W for every such rule, and the
    variance of the surviving-children count is Var(k | survived) + O(theta)
    = 1 + O(1/W). The total-progeny cutoff of a near-critical branching
    process with offspring mean 1 - delta and variance sigma^2 is
    2 sigma^2/delta^2 (singularity of the progeny generating function at
    z_c - 1 = delta^2/(2 sigma^2)); therefore the cutoff is 2 W^2 (1 + O(1/W))
    for EVERY point-local rule at fixed W, the body exponent -3/2 is
    unchanged, and so are C_max(a), the unselected law 1 - (1 + 2a)^{-1/2},
    and the size-biased basin mean 0.886 W^2. Worked cases: UNIFORM (c = theta)
    is the reference; IN1 (cut iff hash passes and k = 1) has theta_d =
    theta_eff and E[k | surv] = 1; HUB (cut iff hash passes and k >= 2) has
    theta_eff = 2.39 theta_d, i.e. it is the SAME as uniform at fixed W but
    looks 2.4x better if one wrongly normalises by point density; SIB (x cut
    iff f(x) is marked) kills all siblings together and has variance
    1 - theta^2; TWO-CLASS (theta_1 on points with a chosen bit 0, theta_2 on
    bit 1) is an independent thinning with mean (theta_1 + theta_2)/2. NONE
    changes sigma^2 at leading order. The only ways to change sigma^2 are to
    change the walk's in-degree law (a non-injective step, which on a
    prime-order group means an automorphism quotient -- known, charged on
    both sides) or to make the cut depend on walk HISTORY, which leaves the
    functional-graph model and is the forward direction this record names.
    (B) CONTINUE-THROUGH / CHAINED DPs. If online walks pass through unstored
    DPs and precomputation walks store only the last of h DPs visited (or all
    h), the DP-level graph is itself random-function-like; each hop costs W
    and samples a basin that is, to leading order in h W/sqrt(N W), fresh, so
    P(hit within h hops) = 1 - (1 - C)^h -- identical to h restarts at the
    same cost. Storing all h chained DPs stores h size-biased basins at cost
    h W, identical to h independent walks. Prediction: no change in L at
    fixed T, in T at fixed L, or in coverage per unit P.
    (C) WHY THIS IS A CONTROL AND NOT A CLOSURE. A zero prediction with a
    named mechanism (sigma^2 = 1 + O(1/W); hop freshness) is falsifiable at
    toy scale for a few CPU-hours; a CI-separated positive on any arm would
    mean the Borel ceiling is not walk-invariant and would redirect the whole
    lane. The record therefore discriminates between explanation Z (the
    ceiling is rule-invariant; only estimation, W, and batch reuse remain)
    and explanation NZ (some point-local rule or chained semantics moves the
    ceiling), and states in advance that Z is expected.

  mechanism: >-
    STEP 1. Implement the rules UNIFORM, IN1, HUB, LEAF-AVOID (cut iff hash
    and k >= 1), SIB, TWO-CLASS (theta_1 = theta/2, theta_2 = 3 theta/2) on the
    generic instrument of IDEA-20260906-aed829, each CALIBRATED TO THE SAME
    MEASURED W (mean walk length) by adjusting the hash threshold, since the
    claim is at fixed W. In-degree is computed from the inverse map at toy
    scale; on the curve arm it is computed as #{j : h(x - M_j) = j} at r
    group operations per candidate, charged, and applied only after a cheap
    hash pre-test so the amortised extra cost is r/W per step.
    STEP 2. For each rule: exact basins at N in {2^22, 2^24, 2^26}; the body
    slope, the cutoff, the largest basin, the unselected law and the
    top-T share at a in {1/4, 1}; 5 seeds.
    STEP 3. Chained semantics: (i) continue-through online walks with hop
    budget h in {1, 2, 4, 8} against restarts with the same total budget;
    (ii) precomputation walks of length h W storing the last DP only, and
    storing all h DPs, against h independent walks, at equal P and equal T.
    STEP 4. Report every arm's C_max(a), unselected coverage and L at fixed T
    beside UNIFORM with CIs; the deliverable is the table of differences.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus and web search as in IDEA-20260906-aed829; WebSearch for
      non-uniform / variable distinguished-point probability found Hong-
      Jeong-Kwon-Lee-Ma, Variants of the distinguished point method for
      cryptanalytic time memory trade-offs, ISPEC 2008 (eprint 2008/054),
      which introduces a "variable DP (VDP)" technique; the eprint page was
      blocked and the paper was not read, so whether VDP varies theta by
      chain position (walk history) or by point is UNKNOWN to this record.
    results: >-
      No corpus record states the invariance or tests a non-uniform DP rule
      for DLP tables. The offspring-variance argument is elementary
      branching-process theory (recalled: Otter-Dwass / Lagrange inversion
      for total progeny) applied to a thinned random mapping; it is not
      claimed as new mathematics. The handoff lists non-uniform theta and
      chained DPs as directions to evaluate; this record evaluates them by
      predicting their failure with a mechanism and a test.
    verdict: >-
      UNVERIFIED as to whether the invariance is published (likely folklore
      in the TMTO literature for chain-length variants; VDP not read). The
      program-level contribution is the control itself.

  discriminated_from:
    - >-
      IDEA-20260906-aed829: the instrument; this record adds rule arms to it
      and predicts they coincide.
    - >-
      IDEA-20260906-05ffb8: changes the SELECTION statistic at fixed walk;
      this record changes the WALK/RULE at fixed selection and predicts no
      change in the ceiling.
    - >-
      Hong et al. VDP (retrieved listing, not read): if VDP varies theta with
      chain position, it is a walk-HISTORY rule outside this record's
      hypothesis and is the named forward direction, not a duplicate.
    - >-
      Negation map / automorphism quotients (KN-TECH-018, KN-LIT-097): change
      N, not sigma^2; charged on both sides; used as a matched control only.

  object_first_candidate:
    tracked_object: >-
      THE SURVIVING-OFFSPRING LAW (mean, variance) of the DP-thinned
      functional graph, followed across distinguishing rules at fixed W.
    lossiness: >-
      GENUINELY LOSSY: two numbers summarise the rule; the hash bits, the
      in-degree gate and the bit class are forgotten.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED: the basin-size cutoff and body exponent
      are functions of (mean, variance) alone by the progeny singularity
      argument; changing the rule within the point-local class propagates
      through the two numbers deterministically. Not a change of
      coordinates: the rule is not recoverable from the two numbers, which
      is the point.
    survival_score: >-
      Survives every point-local rule and every O(1)-neighbourhood gate.
      Dies for walk-history-dependent rules (the object is no longer
      defined) and for non-injective steps (in-degree law changes).

  null_object_control: >-
    THE RECORD IS ITSELF A CONTROL. Its own nulls: (1) MIS-NORMALISATION
    CHECK: run HUB normalised by point density instead of W; it must then
    appear 2.4x better on cutoff and worse on walk length, which audits that
    the fixed-W calibration is what removes the apparent gain. (2)
    RELABELLING: permute the in-degree labels among points before applying
    IN1/HUB; the rules must collapse to UNIFORM exactly. DECAY PARAMETER:
    interpolate c(k) = theta (1 + lambda (g(k) - 1)) between UNIFORM
    (lambda = 0) and the gated rule (lambda = 1) at fixed W; every reported
    statistic must be flat in lambda within CI. A statistic that MOVES with
    lambda is the positive result this control is designed to catch.

  assumptions:
    - >-
      H1 of IDEA-20260906-aed829 (random-function heuristic) and the
      Poisson(1) in-degree law of r-adding walks.
    - >-
      The progeny-cutoff formula 2 sigma^2/delta^2 for near-critical
      branching processes (recalled standard result; the derivation is in
      IDEA-20260906-ac100b's obligations).
    - >-
      In-degree computation on the curve arm costs r group operations per
      candidate and is charged; it is applied after a hash pre-test.
    - >-
      Fixed W is the correct normalisation because the online cost per walk
      is W; a rule compared at fixed point density is mis-normalised.

  proof_search_map:
    bottleneck: >-
      The claim that the surviving-offspring variance is 1 + O(1/W) for
      every point-local rule; the mean identity 1 - theta_eff is exact, the
      variance statement is the step a validator must check for rules with
      correlated sibling cuts.
    baseline_embedding:
      parameter_slice: >-
        c(k) = theta constant: reproduces the uniform Bernstein-Lange walk
        with Poisson(1 - theta) offspring and cutoff 2 W^2 exactly.
      reproduction_check: >-
        Symbolic: substitute c = theta into E[k | survived] and the variance
        expression and confirm Poisson(1 - theta) mean and variance; then
        the exact-basin cutoff at N = 2^26 must sit at n theta^2/2 = 1
        within a factor 1.3.
    observation_collision:
      observable: The pair (body exponent, cutoff) of the basin-size law.
      distinct_preimage_search: >-
        EXPECTED TO SUCCEED, and that is the claim: UNIFORM, IN1, HUB (at
        fixed W), SIB and TWO-CLASS are distinct rules with the same
        observable. The collision is the result, not a defect; what it shows
        is that the observable measures (mean, variance) and not the rule.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track (mean, variance) of surviving offspring instead of the rule;
          the whole class collapses to one point.
        predicted_gain: >-
          A closure of the point-local non-uniform-theta direction with a
          named mechanism, plus the precise statement of what escapes it.
      - transform: observable_fiber
        proposed_object: >-
          Hold (mean, variance) fixed and vary the rule to find one that
          changes a DIFFERENT statistic the table cares about (e.g. the
          depth law H3 of IDEA-20260906-05ffb8).
        predicted_gain: >-
          If a rule leaves the cutoff fixed but changes depth-versus-size,
          it changes the length-estimator's power without changing the
          ceiling; this is the one non-zero effect the control could find.
    quantifier_order: >-
      FORALL point-local rules c with theta_eff = 1/W (fixed W), FORALL
      a = T W^2/N in [1/8, 1], the top-T basin share equals C_max(a) (1 + O(1/W)).
      NOT claimed: for rules depending on walk history or on global
      structure. The witness rule is chosen before any measurement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At toy scale, the six named rules and the two chained semantics
        give the same coverage ceiling and online cost within CI." It
        cannot certify the invariance for ALL rules, only for the tested
        class, and it cannot certify anything about history-dependent walks.
      nearby_object_control: >-
        A NON-INJECTIVE step (the negation-map quotient walk): the in-degree
        law changes (points identified in pairs), N halves, and the cutoff
        in the quotient is 2 W^2 with the ceiling now over N/2. The control
        must show the KNOWN factor-2 shift there and none for the point-local
        rules, otherwise it cannot tell the two mechanisms apart.
    proof_obligations:
      - claim: theta_eff = E[k c(k)] is the reciprocal of the expected walk length.
        responsibility: correctness
      - claim: E[surviving children | survived] = 1 - theta_eff exactly for every point-local rule.
        responsibility: correctness
      - claim: Var(surviving children | survived) = 1 + O(theta) including sibling-correlated rules.
        responsibility: strictness
      - claim: The total-progeny cutoff is 2 sigma^2/delta^2 (1 + o(1)) for the resulting branching process.
        responsibility: size
      - claim: Continue-through hops sample fresh basins to leading order for h W << sqrt(N W).
        responsibility: success_probability
      - claim: Every arm is calibrated to the same measured W before comparison.
        responsibility: interface

  predictions:
    - metric: basin-size cutoff (n at which the survival function drops below e^{-1} of its power-law extrapolation) per rule, divided by 2 W^2
      direction: different
      minimum_effect: >-
        All rules within a factor 1.25 of each other and of UNIFORM at
        N = 2^26, 5 seeds; HUB normalised by point density must instead show
        a factor about 2.4 (mis-normalisation check).
    - metric: C_max(a) per rule minus C_max(a) for UNIFORM, at a in {1/4, 1}
      direction: different
      minimum_effect: Zero within CI (exact coverage, seed bootstrap half-width about 0.01).
    - metric: L at fixed T per rule divided by L for UNIFORM
      direction: different
      minimum_effect: In [0.97, 1.03] for every rule, charging the in-degree test.
    - metric: continue-through success at hop budget h versus restart success at budget h W
      direction: different
      minimum_effect: Equal within CI at h in {1, 2, 4, 8}.
    - metric: coverage per unit P of chained-DP precomputation versus independent walks
      direction: different
      minimum_effect: Equal within CI at h in {2, 4, 8}.
    - metric: any statistic as a function of lambda
      direction: different
      minimum_effect: Flat within CI; a monotone trend with CI-separated ends is the positive result.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): a validator re-derives the mean
      identity and the variance bound of claim (A); if the variance bound
      fails for sibling-correlated rules the prediction for SIB is withdrawn
      before any run.
      STAGE 1 (minutes, THE CHEAPEST VALID DISCRIMINATOR): N = 2^22, one
      seed, exact basins for UNIFORM, IN1 and HUB calibrated to equal W;
      cutoff and top-T share at a = 1/4. Three array passes. Separates
      "rule-invariant ceiling" from "the ceiling moves" at once, and the
      HUB mis-normalisation check falls out of the same data.
      STAGE 2 (about two hours): all six rules and both chained semantics at
      N in {2^22, 2^24, 2^26}, 5 seeds, both a values, the lambda sweep,
      the negation-map nearby-object control.
      STAGE 3 (hours): curve arm at N about 2^24 with the charged in-degree
      test, certificates on every solved logarithm.
    controls:
      - UNIFORM rule at identical measured W (reference)
      - HUB normalised by point density (mis-normalisation check, must differ)
      - in-degree relabelling null (gated rules must collapse to UNIFORM)
      - lambda interpolation sweep
      - negation-map quotient walk (known factor-2 shift must appear)
      - restart semantics at equal budget for the continue-through arm
      - independent walks at equal P for the chained-DP arm
    required_metrics:
      - measured W per rule after calibration
      - exact basin-size multiset per rule and seed; body slope; cutoff; max basin
      - C_max(a) and unselected coverage per rule with CIs
      - L at fixed T per rule, charging the in-degree test in group operations
      - success versus budget for continue-through and restart arms
      - coverage per unit P for chained and independent precomputation
      - certificate pass count on the curve arm

  falsification_conditions:
    - >-
      A point-local rule shows a CI-separated cutoff or C_max shift at
      fixed W at N >= 2^24 that survives the relabelling null and the lambda
      sweep: the variance argument is wrong and the ceiling is NOT rule-
      invariant -- the most valuable outcome, to be routed to review as a
      contradiction of the model, not promoted on Executor authority.
    - >-
      Continue-through beats restarts at equal budget with CI separation:
      hop freshness fails; the DP-level graph has exploitable structure.
    - >-
      HUB at point-density normalisation does NOT show the predicted 2.4x
      apparent shift: the calibration machinery is broken; invalid run set.
    - >-
      The negation-map control shows no factor-2 shift: the instrument
      cannot see a known effect; invalid.

  confounders:
    - >-
      Calibration to fixed W is the whole comparison; a rule compared at
      fixed hash threshold will look better or worse by its theta_eff/theta_d
      ratio alone.
    - >-
      In-degree on the curve arm requires r subtractions per candidate; at
      W = 2^8 and r = 32 the amortised cost r/W is 12% and must be charged.
    - >-
      Toy N makes O(1/W) corrections visible at N = 2^22 (W = 2^7); the
      N sweep separates them from a real shift.
    - >-
      Continue-through walks can enter DP-free cycles at the DP level for
      large h; the cap and cycle mass must be reported.

  interpretation_limits:
    - >-
      A zero result closes the POINT-LOCAL class at toy scale with a named
      mechanism; it does not close walk-history-dependent rules, non-
      injective steps, or non-generic structure, which are the forward
      directions.
    - >-
      Toy scale, claim_tier toy; the invariance is stated to O(1/W) and the
      corrections at cryptographic W are an extrapolation.

  heuristic_assumptions:
    - id: H5
      statement: >-
        THINNED-MAPPING BRANCHING LAW. For every point-local rule at fixed
        W, the surviving-offspring count of a surviving node in the DP-
        thinned random mapping has mean 1 - 1/W and variance 1 + O(1/W),
        and the basin-size law is that of the total progeny of the
        corresponding branching process, uniformly for N in [2^20, 2^40].
      rigorous_support: >-
        Mean: exact algebra given Poisson(1) in-degrees. Variance: Poisson
        tilt bound. Progeny law: Otter-Dwass / Lagrange inversion for
        branching-process total progeny (recalled); the imitated classical
        statement is the Borel law for the uniform rule.
      validation_plan: >-
        Sample: exact surviving-offspring counts of every surviving node at
        N = 2^24 per rule (available from the inverse map), 5 seeds;
        compare mean and variance with 1 - 1/W and 1 within bootstrap CIs;
        compare the basin-size CDF per rule with the UNIFORM CDF by a
        two-sample KS statistic at alpha = 0.01; tail check: max basin per
        rule and seed within the UNIFORM 99% band. Transfer: same law at
        cryptographic N, not tested.
    - id: H6
      statement: >-
        HOP FRESHNESS. In continue-through semantics, successive DPs visited
        by an online walk lie in basins whose sizes are independent size-
        biased draws, up to relative error h W / sqrt(N W), for h <= 8.
      rigorous_support: >-
        Imitates the rho-length statistics of a random mapping on N/W DP
        nodes (Flajolet-Odlyzko, recalled): collisions among h hops occur
        with probability of order h^2 W/N.
      validation_plan: >-
        Sample: at N = 2^24, 40000 continue-through walks with h = 8,
        record the basin sizes of the visited DPs; test lag-1 correlation of
        successive sizes (predicted zero within CI) and compare the marginal
        with the size-biased Borel law; tail check: repeat visits to the
        same DP within a walk at rate h^2 W/N.

  target_complexity:
    time_exponent: >-
      Predicted unchanged: online 1/3 in N with the SAME constant as the
      uniform rule at fixed T; precomputation 2/3 unchanged.
    memory_exponent: Predicted unchanged, 1/3 with the same constant.
    best_known: >-
      Bernstein-Lange selected table (KN-LIT-3060); the oracle ceiling of
      IDEA-20260906-aed829. This record predicts neither moves.
    hidden_overhead: >-
      The in-degree test's r/W per step on the curve arm; the O(1/W)
      corrections to the invariance.
    tradeoff_note: >-
      No movement on any axis is predicted; the record's value is the
      closure of two handoff directions with a mechanism, or their surprise
      reopening.

  dominated_by: >-
    n/a (no result claimed; the prediction is zero delta). Checked for
    completeness against Bernstein-Lange, rho, Kuhn-Struik, CGK and the
    negation-map quotient: the record does not claim to move relative to any
    of them.
  sota_delta: >-
    Predicted zero: every point-local rule and chained semantics gives the
    same C_max(a), the same L at fixed T and the same coverage per unit P as
    the uniform Bernstein-Lange walk within CI. A measured non-zero is the
    reportable outcome and would be the first evidence of room below the
    Borel ceiling.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that all six point-local rules coincide within CI at fixed W
    (the mean identity is exact and the variance argument is elementary).
    0.8 that continue-through equals restarts. 0.9 that HUB mis-normalised
    shows the predicted 2.4x apparent shift (which is a check on the
    instrument, not on the world). 0.1 that any arm shows a real shift; if
    it does, the lane's priorities change and this record's low compute
    will have been the cheapest possible way to learn it.

