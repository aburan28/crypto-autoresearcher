      direction: different
      minimum_effect: Twenty exceeds nineteen by 1.
  minimal_test:
    design: >-
      Read the bits of 1048575 and count doublings and additions. Do not
      add a curve point.
    controls:
      - Two readings of the addition count, whose gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
      - the product
  falsification_conditions:
    - The addition count is not 19.
    - The product of 20, 19, and 19 is not 7220.
  confounders:
    - The integer 524287 has bit length 19 and eighteen additions.
  interpretation_limits:
    - A digit count is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the count triple 19, 18, and 18 of the integer 524287.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen integer 1048575 has bit length 20, 19 doublings, and
