idea:
  id: IDEA-20261006-5db10b
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: Doubling-sum character sum on one prime-field curve exceeds one quarter of its support
  class: control
  claim: >-
    Let E be y^2 = x^3 + x + 3 over F_47, let s(P) = x(P) + x(2P) for affine
    points with y(P) ≠ 0 and s(P) ≠ 0, let N be the number of such points, and
    let χ be the quadratic character of F_47. Then |∑ χ(s(P))| ≥ N/4.
  mechanism: >-
    Object frame. The representation is the R1 value s(P) = x(P) + x(2P) in
    the pinned chart (A, B) = (1, 3), followed by χ(s(P)). Duplication gives
    x(2P) = λ(P)^2 − 2x(P), so s(P) = λ(P)^2 − x(P). Sigma is the singleton
    {doubling map [2]}, not the full translation action. Trichotomy class:
    branching. Lossy-projection test against Sigma: χ keeps only a sign, so
    the projection is lossy on any curve with N > 2. The sign does not
    propagate deterministically: χ(s(2P)) is not a function of χ(s(P)). The
    priced numbers are the loss and branch of IDEA-20260802-002, measured
    rather than asserted: L is the fraction of domain points distinguished by
    the full point but not by the sign, and b is the number of distinct
    successor signs χ(s(2P)) observed among points with a fixed χ(s(P)).
    Families F1–F7 are not the lens. Doubling is the operation in the
    definition of s, not a rho step, a factor-base relation, or an
    endomorphism-orbit walk. The sum is a control distinguishing a
    constant-fraction bias from a mean-zero signing. It is not a claim that
    the bias is a discrete-log character.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question names a Weil-level bound c·deg·√p for mixed character
        sums of bounded-degree coordinate functions, and it marks that bound
        recalled and unverified in this program. A constant-fraction sum at
        one toy prime does not discharge that bound.
      verified_by: idea-generator
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        The negation map gives a √2 iteration factor with fruitless cycles.
        s(−P) = s(P) because x is even, so the sum is unchanged by negation,
        and no √2 walk is claimed.
      verified_by: idea-generator
    - ref: KR-RHO-fbd582
      provenance: internal
      claim: >-
        x(P−Q) is nearly free given x(P+Q). The quantity here is x(P)+x(2P),
        which is a different rational function, and no subtraction shortcut
        is claimed.
      verified_by: idea-generator
    - ref: docs/object-frame-ideation.md
      provenance: internal
      claim: >-
        Branching objects are those whose retained value propagates only
        probabilistically under the named operation set, and they are priced
        by a measured loss and branch.
      verified_by: idea-generator
  assumptions:
    - The model is fixed as y^2 = x^3 + x + 3 over F_47. Discriminant −16(4 + 27·9) = −16·247 ≠ 0.
    - χ(0) is not used. Points with s(P) = 0, y(P) = 0, or P at infinity are excluded from N and from the sum.
    - The discrete log is tabulated only if a later spectral check is run. It is not an input to χ(s(P)).
  proof_search_map:
    bottleneck: >-
      The absolute value of one character sum at p = 47. If that value is
      below N/4, the constant-fraction reading of this coordinate is false
      on this curve.
    baseline_embedding:
      parameter_slice: >-
        The same points with χ(s(P)) replaced by independent uniform signs.
        That null has mean 0 and mean square N.
      reproduction_check: >-
        Recompute s(P) from λ^2 − x and from x + x(2P) on every domain point.
        Any disagreement voids the sum.
    observation_collision:
      observable: the integer ∑ χ(s(P))
      distinct_preimage_search: >-
        Two different subsets of the domain with the same character sum are
        not distinguished by this observable. Record the subset of points
        with χ(s(P)) = 1 so a second implementation can recompute the integer
        without reusing the first code path.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the single integer ∑ χ(s(P)) at (A, B, p) = (1, 3, 47)
        predicted_gain: >-
          Packs the bias question into one comparison with N/4, which either
          holds or fails.
    quantifier_order: >-
      For this one curve, |∑ χ(s(P))| ≥ N/4. There is no universal quantifier
      over curves or over p.
    method_ceiling:
      strongest_certifiable_claim: >-
        A lower bound on one character sum at p = 47. The method cannot
        certify a bias that stays a constant fraction as p grows, and it
        cannot certify a discrete-log correlation.
      nearby_object_control: >-
        The same sum for χ(x(P)) on this curve, and the same sum for s on
        the quadratic twist y^2 = 2(x^3 + x + 3) if that model is nonsingular
        over F_47. If χ(x) already meets N/4, the doubling in s is not the
        source. If a random signing meets N/4 as often as the curve, the
        instrument is void.
    proof_obligations:
      - claim: The random-sign null has mean square N.
        responsibility: baseline
      - claim: "|∑ χ(s(P))| is computed exactly in F_47 arithmetic."
        responsibility: correctness
      - claim: The inequality is only at p = 47 for this (A, B).
        responsibility: scope
  predictions:
    - metric: absolute character sum |∑ χ(s(P))| divided by N
      direction: higher
      minimum_effect: the ratio is at least 1/4
  minimal_test:
    design: >-
      Enumerate the domain on E(F_47), evaluate s two ways, sum χ(s(P)), and
      compare the absolute value with N/4. On the same points, draw 200
      independent uniform signings and record how often their absolute sums
      meet N/4.
    controls:
      - The two formulas s = x + x(2P) and s = λ^2 − x agree on every domain point.
      - Two hundred random signings of the same N points. If 10 percent or more of them meet N/4, the threshold is inside null noise at this N and the curve sum is not yet a signal.
      - The identical sum on χ(x(P)) for the same curve, as the nearby coordinate.
      - Instrument check required by RQ-ECDLP-4fcbd3: on a separate even-order curve over a prime field with exactly one rational point of order 2, the nontrivial character of the index-2 subgroup must produce a spike of absolute size at least half the number of rational points. If that spike is missed, the p = 47 sum is not admissible.
    required_metrics:
      - N
      - the signed sum ∑ χ(s(P))
      - the fraction of 200 random signings whose absolute sum is at least N/4
      - the number of domain points with s(P) = 0, reported separately and not added into the sum
      - the branch count b of successor signs under one doubling
  falsification_conditions:
    - "|∑ χ(s(P))| < N/4. The constant-fraction claim is then false on this curve."
    - At least 20 of the 200 random signings also meet N/4. The threshold does not separate the curve from the null at this sample size, so a pass of the inequality is not evidence of structure.
  confounders:
    - Points with s(P) = 0 shrink N and make N/4 easier. They must be counted and excluded, not mapped to χ = 1.
    - Negation preserves s, so summing over both P and −P double-counts each term. The sum must be over points, with that double-counting disclosed, or over a set of representatives, with the choice fixed before the sum is read. The pre-registered choice is to sum over all domain points, including both P and −P.
    - Using the discrete log to build the predicate would violate the question constraint. χ(s(P)) uses only field arithmetic.
  interpretation_limits:
    - A sum at least N/4 at p = 47 does not change the rho exponent 1/2. The question's own break-even bias against rho is on the order p^{−1/4}, and only after a decay test in p.
    - One prime is not a concentration result. Toy output from this question does not satisfy GOAL-ECDLP-001 or GOAL-CRYPTO-001.
    - If the sum is large only because both P and −P are included, the per-orbit sum is the quantity that must be reported beside it. The claim as written includes both.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A uniform random signing of N domain points has mean 0 and mean square
        N, by expanding the square and using independence. The curve sum is
        assumed, for the validation sample, to be comparable to a character
        sum of a degree-at-most-4 map E → P^1, whose typical size is on the
        order of √p rather than a constant fraction of N. The p = 47 claim is
        the statement that this particular sum is atypically large relative to
        the random signing.
      rigorous_support: >-
        Independence gives the mean square N for fair signs. The degree bound
        is elementary: x(2P) is a degree-4 rational function of P, so s has
        degree at most 4 as a map to the line. The Weil-type estimate
        c·deg·√p is the bound named and marked unverified in RQ-ECDLP-4fcbd3.
        It is not used as a proof that the p = 47 sum is small.
      validation_plan: >-
        Sampling route: the same pinned coefficients (A, B) = (1, 3) reduced
        modulo each prime p from 47 to 150 at which the curve stays
        nonsingular, skipping characteristics 2 and 3. Direct enumeration, no
        correspondence. Comparison: |∑ χ(s(P))| / √p against the constant
        (N/4)/√p evaluated at p = 47, and against the random-sign scale 1 in
        units of √N. Refutation: the p = 47 sum is already below N/4, or
        |∑ χ(s(P))| / √p at the largest enumerated prime is less than half its
        value at p = 47 while N stays on the Hasse scale. Either observation
        kills the reading that a constant fraction persists.
  target_complexity:
    time_exponent: >-
      1/2, unchanged. A passing sum is not an algorithm and does not move the
      generic rho exponent.
    memory_exponent: >-
      0 in the security parameter. The p = 47 sum stores the rational points
      once.
    best_known: >-
      Generic discrete log on a prime-order subgroup is Ω(√|G|) group
      operations, and rho meets Θ(√|G|) up to a √(log) factor. Negation and
      automorphisms improve constants only. None of those costs is claimed
      to move.
    hidden_overhead: >-
      No o(1) term is introduced. If someone later modelled an attack from a
      constant-fraction bias, the question already records that Θ(ε^{−2})
      samples at ε = p^{−1/2} are worse than rho. That model is not claimed
      here.
    tradeoff_note: >-
      No time–memory tradeoff. The control is a full enumeration at 6-bit
      field size.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-fb88e6
      - KR-RHO-fbd582
      - KR-RHO-cd86f5
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-93979e
      - KR-RHO-53c89f
      - KR-IC-5931ee
      - KR-IC-f5c584
    nearest:
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: adjacent
        delta: >-
          Negation identifies s(P) with s(−P) and prices a √2 walk. This claim
          is an inequality |sum| ≥ N/4, a factor √N/4 above a random signing's
          root-mean-square √N, and it takes no iteration factor.
        verified_by: idea-generator
      - ref: KR-RHO-fbd582
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a cost for x(P−Q). The gap here is N/4 against a smaller
          sum, not a saving in inversions.
        verified_by: idea-generator
    searched:
      corpus_grep: []
      web: []
      blocked:
        - The Weil-level character-sum bound was read only as the recalled sentence inside RQ-ECDLP-4fcbd3. The papers named there were not opened.
  dominated_by: >-
    Checked every pasted index-calculus row and every pasted generic-rho row.
    None states this character sum. KR-RHO-fb88e6 does not dominate: it
    dominates a negation-walk cost, and this idea claims no walk cost.
    KR-RHO-13bf67 dominates any generic algorithm faster than square root,
    which is not proposed.
  sota_delta: >-
    Threshold N/4 versus the random-sign root-mean-square √N, a factor √N/4.
    On a Hasse-sized domain N ≈ p = 47 that factor is √47/4 ≈ 1.71. The
    failure side is any sum strictly below N/4.
