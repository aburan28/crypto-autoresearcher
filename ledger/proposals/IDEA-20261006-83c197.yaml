idea:
  id: IDEA-20261006-83c197
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Degree of one descended system from a dimension-2 quotient at the first
    prime the written Couveignes-Lercier conditions exclude
  class: mechanism
  claim: >-
    Let n be the smallest prime that fails both dimension-1 conditions
    recorded in KN-OPEN-095df5 over F_2 (n does not divide q+1, and n lies
    outside the elliptic Hasse interval). That prime is predicted to be 7,
    and the reproduction check below recomputes it. There is at least one
    abelian-surface isogeny class over F_2 with n dividing the number of
    rational points, and every explicit quotient by a rational cyclic
    subgroup of order n produces a Galois-invariant subset of F_{2^n} whose
    single Weil-descended S_3 system has total degree strictly higher than
    the total degree of one S_3 system on an F_2-subspace factor base of the
    same cardinality. Representation class R3 (a point of an auxiliary
    commutative algebraic group, not a function on the target curve). Attack
    stage charged: factor-base membership, plus the degree of one
    decomposition system. No ECDLP exponent improvement is claimed. If no
    explicit quotient is written, the degree clause is not a success.
  mechanism: >-
    PAIR. Representation: a field element of F_{2^n} is represented, when it
    lies in the subset, by a rational point of an auxiliary commutative
    algebraic group G over F_2 (R3, non-function). Operation set Sigma:
    translation on G by a fixed rational cyclic subgroup T of order n, the
    kernel of the quotient isogeny G to G/T. Sigma is not translation on the
    prime-order subgroup of the target elliptic curve.
    TRICHOTOMY. Partial-action. The image in G/T is constant on T-cosets, so
    the quotient map is the block system of the group generated by Sigma. It
    does not propagate under translation on the target curve.
    LOSSY-PROJECTION TEST. The projection sends a rational point of G to its
    image in G/T, and then to the field element cut out by an affine
    coordinate of that image. It discards the T-coset representative, n
    distinct preimages when the point is in the image of multiplication by
    the order of T. The discard is compatible with Sigma because translation
    by T does not change the image. It is lossy because those n preimages are
    distinct as points of G, so the map on rational points is not injective
    and is not a change of coordinates. This is not a Kummer line and not a
    degree-d function on the target curve E.
    OFF-LIMITS. F3 (isogeny) is a component, and only as the quotient isogeny
    of the auxiliary group G, not as a path in the isogeny graph of the
    target curve. F2 is a component limited to one S_3 system used as a
    degree meter. What is added is the degree comparison, at this excluded
    prime, between that invariant set and a matched subspace. The factor base
    is the high-degree class of KN-OPEN-020: the membership polynomial's
    degree is the charged description cost, not an assumed bounded degree.
    Costs charged: description degree, membership-evaluation cost, and the
    degree of one S_3 system. Relation collection, descent, and a discrete-log
    solve are not run; the proposal stops there. F1, F4, F5, F6 and F7 are
    not used.
    This is not a restatement of a Frobenius-orbit symmetry factor, of a
    trace or norm branching count, of a chord slope, or of a shift-invariant
    dimension. The observable is a system degree. It is not KR-IC-f5c584:
    the trace morphism E to F_2, which forces first fall degree 2 for Weil
    descent of S_3 on ordinary binary curves, is not the quotient G to G/T,
    and first fall degree 2 is not the total-degree gap priced here.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-095df5
      provenance: internal
      claim: >-
        Both written dimension-1 Couveignes-Lercier constructions are
        excluded at n = 131 over F_2 by their stated conditions; no abelian
        variety over F_2 of dimension at most 4 has 131 dividing its point
        count; the degree of a descended system for any surviving group is
        the open half. The elliptic Hasse interval at q = 2 is recorded as
        (0.17, 5.83).
      verified_by: knowledge/open-problems/KN-OPEN-095df5.md
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Frobenius-invariant factor bases reduce the number of systems to
        solve by up to 1/n, called best possible there, and speed linear
        algebra by n^2.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        In binary-field point decomposition the factor base is the set of
        points with x-coordinate in an F_2-subspace V, and choosing V to
        shrink product-space dimension lowers degree after Weil descent.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        The Weil descent to F_2 of S_3 on ordinary binary curves has first
        fall degree 2 because the trace of x is a group morphism onto F_2,
        and that first fall degree is bounded independently of n under the
        stated conditions.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        On a Koblitz curve over F_{2^m}, walking on classes of the group
        generated by Frobenius and negation reduces parallel rho by sqrt(2m).
        The gain is a constant factor on the square-root exponent.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        High-degree interpolation descriptions are one of the three classes
        left open by the bounded-degree factor-base obstruction.
      verified_by: knowledge/open-problems/KN-OPEN-020.md
    - ref: >-
        Couveignes-Lercier quotient construction, as a named framework, not
        as a paper read in this session
      provenance: recalled
      claim: >-
        A commutative algebraic group with a rational subgroup of order n can
        be quotiented by that subgroup to name a Galois-invariant subset.
        This session did not open the paper. The checked source for the
        exclusion conditions is KN-OPEN-095df5.
      verified_by: null
  assumptions:
    - >-
      F3 enters only as the quotient isogeny of the auxiliary group. It is
      not an attack path on the target curve.
    - >-
      F2 enters only as one S_3 degree measurement. No relation matrix is
      built.
    - >-
      The membership description is high-degree in the sense of KN-OPEN-020.
      If its degree is at least the cardinality of the set, listing the set
      is cheaper and the description stops.
    - >-
      A missing explicit addition law is a failed success condition, not
      evidence that the degree is high.
  proof_search_map:
    bottleneck: >-
      Writing a Galois-invariant subset whose descended summation system has
      degree no higher than a subspace base of the same size, at a prime n
      where the written dimension-1 constructions are excluded. The 1/n
      symmetry gain of KR-IC-b0fcda is already best possible for orbit
      folding and is not this bottleneck.
    baseline_embedding:
      parameter_slice: >-
        An F_2-subspace factor base of the same cardinality, as in
        KR-IC-73db3f, and the dimension-1 elliptic quotient at the largest
        prime that still lies in the q = 2 Hasse interval, as the place the
        written construction is not excluded.
      reproduction_check: >-
        Recompute the smallest excluded prime from the two conditions in
        KN-OPEN-095df5 (divisibility of q+1, and membership in the Hasse
        interval) before using n = 7. On the dimension-1 control, the
        instrument must return a numeric S_3 degree. If it cannot, the
        dimension-2 measurement is void.
    observation_collision:
      observable: >-
        The total degree of one Weil-descended S_3 system built from the
        invariant set. Two subsets with the same degree are not distinguished
        by this observable.
      distinct_preimage_search: >-
        Search the T-coset: n preimages in G of one image point. Also search
        for two non-isogenous surfaces with the same rational point count
        divisible by n. Either pair shows the observable is coarser than the
        group.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The quotient G to G/T for an abelian surface over F_2 with a
          rational point of order n, with one affine coordinate used as a
          membership predicate on F_{2^n}.
        predicted_gain: >-
          A numeric degree, predicted to be strictly higher than the matched
          subspace system's degree. No exponent change is predicted.
    quantifier_order: >-
      There exists an abelian-surface isogeny class over F_2 whose rational
      point count is divisible by the smallest excluded prime n, and for
      every explicit model of a quotient by a rational subgroup of order n
      the descended S_3 degree is strictly greater than the degree of one
      S_3 system on a matched-cardinality subspace base.
    method_ceiling:
      strongest_certifiable_claim: >-
        A comparison of two toy degrees at n equal to the smallest excluded
        prime. The method cannot certify non-existence of a useful group at
        n = 131, and it cannot certify a descent exponent.
      nearby_object_control: >-
        The dimension-1 elliptic quotient at a prime inside the q = 2 Hasse
        interval, where a higher degree than the subspace is the known
        discouraging shape relayed in KN-OPEN-095df5 (degree at most 9
        against 6 at m = 3, in that source's account of an example that is
        not Galois-invariant). If the dimension-2 quotient is not higher
        than the subspace while the dimension-1 control is higher, the
        ceiling has been beaten and the claim is false.
    proof_obligations:
      - claim: >-
          The smallest excluded prime matches the two arithmetic conditions
          quoted from KN-OPEN-095df5.
        responsibility: baseline
      - claim: >-
          A Weil polynomial produced by the census is genuinely divisible by
          that prime and satisfies the Weil bounds.
        responsibility: correctness
      - claim: >-
          The membership polynomial degree and one S_3 degree are both
          charged, and no further pipeline is run.
        responsibility: scope
      - claim: >-
          The subspace system of matched cardinality is built and its degree
          computed on the same instrument.
        responsibility: baseline
      - claim: >-
          Absence of an explicit model does not count as a high degree.
        responsibility: feasibility
    not_applicable_reason: >-
      No subfield is inapplicable. The census half is exact integer
      arithmetic on Weil polynomials; the degree half is one Gröbner degree.
      Neither is omitted.
  predictions:
    - metric: >-
        Number of abelian-surface isogeny classes over F_2 whose rational
        point count is divisible by the smallest excluded prime.
      direction: different
      minimum_effect: >-
        Different from the dimension-1 count at that same prime, which is 0
        by the Hasse bound.
    - metric: >-
        Total degree of one descended S_3 system on the quotient set, minus
        the total degree of one S_3 system on a matched-cardinality subspace
        base, when an explicit quotient exists.
      direction: higher
      minimum_effect: ">= 1"
  minimal_test:
    design: >-
      From the two conditions in KN-OPEN-095df5, recompute the smallest prime
      n over F_2 that fails both. Enumerate Weil polynomials of abelian
      surfaces over F_2 and count how many have rational point count
      divisible by n. If the count is positive, attempt one explicit model
      and one quotient coordinate, build one S_3 system on the resulting
      subset of F_{2^n}, and build one S_3 system on a subspace of the same
      cardinality. Record both degrees. If the count is zero, stop and record
      non-existence at dimension 2; do not treat it as a degree. Do not run a
      relation collection. The curve y^2 = x^3 + x + 1 is not used. Point
      counts of that curve are not the metric.
    controls:
      - dimension-1 elliptic quotient at a prime inside the q = 2 Hasse interval, same degree instrument
      - matched-cardinality F_2-subspace factor base
      - the n = 131 dimension-at-most-4 emptiness result is not re-run; it is the nearby large object this toy does not claim to decide
    required_metrics:
      - identity of the smallest excluded prime
      - number of dimension-2 Weil classes with n dividing the point count
      - degree of the membership polynomial, or an explicit statement that no model was written
      - total degree of one S_3 system on each side, when a model exists
      - cardinality of the two factor bases being compared
  falsification_conditions:
    - >-
      The dimension-2 count at the smallest excluded prime is 0. The
      existence half of the claim is then false.
    - >-
      A class exists and an explicit quotient is written, and the descended
      S_3 degree is less than or equal to the matched subspace degree.
    - >-
      The recomputed smallest excluded prime is not 7. The parameter slice
      is then wrong and the claim as stated is false until restated.
    - >-
      A class exists but no explicit quotient is written. The degree clause
      is untested and is not counted as support.
  confounders:
    - >-
      A subspace that is not Galois-invariant can have a lower degree for
      reasons of linear algebra rather than of the quotient.
    - >-
      An S_3 system on a set of size 1 or 0 is degenerate and its degree is
      not comparable.
    - >-
      Weil-polynomial existence does not supply an explicit group law. Those
      are different outcomes and must not be merged.
    - >-
      The degree comparison at this n does not transfer to n = 131.
  interpretation_limits:
    - >-
      No ECDLP exponent improvement is claimed. KR-IC-b0fcda already states
      the 1/n reduction in the number of systems as best possible for
      Frobenius-orbit folding, and KR-RHO-037e22 leaves the rho exponent at
      1/2 with a sqrt(2m) constant. This test prices a Weil-class count and,
      if a model exists, one polynomial degree.
    - >-
      A positive degree gap at n = 7 is not evidence about n = 131. The
      transfer is refused in H2.
    - >-
      Non-existence at dimension 2 does not extend the dimension-4 census of
      KN-OPEN-095df5 to a theorem.
    - >-
      The high-degree factor-base class is charged and then the proposal
      stops. A low degree would still not be an algorithm.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For q = 2 and g = 2, the integer point counts inside the Weil
        interval that are divisible by the smallest excluded prime behave, as
        candidates, like the multiples one would list for a uniform integer
        in that interval, and the census decides each candidate exactly
        rather than by a density estimate.
      rigorous_support: >-
        The Weil bound #A(F_q) <= (1 + sqrt(q))^{2g} is the rigorous size
        constraint. H1 imitates it the way a Hasse interval imitates the
        support of a point-count distribution, and then replaces the
        distribution by an exact Weil-polynomial check. No smoothness law is
        assumed.
      validation_plan: >-
        Enumerate the dimension-2 Weil polynomials over F_2 exactly. Compare
        the set of point counts divisible by n to the set of multiples of n
        inside the Weil interval, and record which multiples occur. Repeat
        the same exact check at the next prime that fails both dimension-1
        conditions, as a one-step replication, still over F_2 and g = 2. No
        sampling and no transfer to dimension 48 or to n = 131.
    - id: H2
      statement: >-
        The total degree of one descended S_3 system grows at least linearly
        with the order n of T when an explicit quotient exists. This is a
        statement about the toy ladder only.
      rigorous_support: >-
        A quotient by a cyclic group of order n has kernel size n, so the
        isogeny degree is exactly n when the isogeny is separable. H2 asks
        whether the descended summation degree tracks that isogeny degree the
        way a generic eliminant degree tracks the input degree. The isogeny
        degree itself is rigorous; the summation degree is not.
      validation_plan: >-
        If explicit models exist at two excluded primes, compare the two S_3
        degrees to the two kernel orders. If the ratio of degrees is not at
        least the ratio of the kernel orders, H2 fails. If only one model
        exists, H2 is untested and is not used in the claim.
  target_complexity:
    time_exponent: >-
      Unchanged. Subfield-curve index calculus keeps the exponent of the
      pipeline it already has; rho on the Koblitz curve keeps exponent 1/2
      with the sqrt(2m) factor of KR-RHO-037e22. The test prices a degree,
      not a new exponent. Bookkeeping: one system, one degree, no
      success-probability multiplier, because no search is repeated.
    memory_exponent: >-
      Unchanged. One S_3 basis at field size 2^n with n the smallest
      excluded prime is bounded by the monomials in a fixed number of
      variables up to that degree.
    best_known: >-
      KR-IC-b0fcda for the Frobenius-invariant factor base (systems reduced
      by at most 1/n, linear algebra by n^2) and KR-IC-73db3f for
      degree-lowering via the subspace V. KR-RHO-037e22 is the rho baseline
      the index-calculus pipeline would have to beat, and this proposal does
      not beat it.
    hidden_overhead: >-
      No o(1) term is introduced. The degree, if high, is the overhead, and
      it is reported as an integer rather than hidden.
    tradeoff_note: >-
      No time-memory tradeoff. Stopping after one system means there is no
      linear-algebra stage to trade against.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-b0fcda
      - KR-IC-73db3f
      - KR-RHO-037e22
      - KR-IC-5ea2f8
      - KR-IC-f5c584
    nearest:
      - ref: KR-IC-b0fcda
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
        relation: adjacent
        delta: >-
          The row claims Frobenius-invariant factor bases reduce the number
          of systems by up to 1/n (best possible) and speed linear algebra by
          n^2. This proposal does not re-derive that factor. It asks whether
          a dimension-2 quotient, at the smallest prime the written
          dimension-1 conditions exclude, gives an invariant set whose one
          S_3 degree beats a subspace.
      - ref: KR-IC-73db3f
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
        relation: adjacent
        delta: >-
          The row claims that choosing the subspace V lowers degree and
          variable count after Weil descent. That subspace system is the
          baseline this proposal must beat on degree. The predicted direction
          is that the quotient does not beat it.
      - ref: KR-IC-5ea2f8
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
        relation: orthogonal
        delta: >-
          The row claims GHS Weil descent maps the ECDLP to a hyperelliptic
          Jacobian and is effective only for special fields and curves. This
          proposal does not descend the target curve. It uses an auxiliary
          group to name a subset of the field.
      - ref: KR-IC-f5c584
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        relation: orthogonal
        delta: >-
          The row claims that Weil descent to F_2 of S_3 on ordinary binary
          curves has first fall degree 2, because the trace of x is a group
          morphism onto F_2, and that this first fall degree is bounded
          independently of n. This proposal prices a total-degree gap of at
          least 1 against a matched subspace system, at the smallest excluded
          prime, for a quotient G to G/T. First fall degree 2 and a
          total-degree gap of at least 1 are different integers, and the
          trace map is not that quotient. The exponent stays 1/2 and the
          symmetry factor stays 1/n.
  dominated_by: >-
    KR-IC-b0fcda dominates the symmetry gain it already calls best possible
    (factor 1/n on the number of systems, n^2 on linear algebra), and
    KR-IC-73db3f dominates degree reduction by subspace choice. KR-RHO-037e22
    dominates the generic side at exponent 1/2 with a sqrt(2m) constant. The
    gap that remains is the membership and one-system degree of a
    higher-dimension invariant set at primes where the written dimension-1
    constructions are excluded. This proposal prices that degree at one toy
    prime and does not close the gap.
  sota_delta: >-
    Zero change to the exponent 1/2 and zero change to the factor 1/n. The
    integers measured are a Weil-class count at dimension 2 and, if a model
    exists, one S_3 degree. The distance from that toy degree to a
    subexponential algorithm at extension degree 131 is not estimated and is
    not claimed to shrink.
