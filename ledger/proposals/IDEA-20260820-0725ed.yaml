idea:
  id: IDEA-20260820-0725ed
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Renyi-Chernoff coverage certificate for finite SQIsign ideal lists
  class: conditional theorem proposal
  claim: >-
    For a fixed finite ideal candidate set and an explicitly verified
    candidate-conditioned score model, a Renyi or Chernoff tail argument may
    convert q transcript scores into a finite list-size versus coverage bound.
    The proposed theorem is conditional on its distributional premises and is
    not evidence that SQIsign transcripts carry candidate information.
  corrects: IDEA-20260820-9ad2a8
  supersedes: null
  correction: >-
    Preserves the predecessor's finite-q tail theorem and certified-list
    objective while adding complete verified_by metadata and removing an
    unsupported GRH attachment. KN-TECH-058 contributes inherited and unverified
    reduction caveats, not a verified GRH premise for this proposal.
  mechanism: >-
    Fix N candidates and scores Z_t(I) before observation. For every false I,
    bound the cumulant-generating function of the score gap relative to the
    target using a stated Renyi order alpha > 1. Apply a Chernoff bound and a
    union bound over candidates to choose a threshold tau(q, delta). Output all
    ideals whose cumulative score lies within tau of the maximum and attach a
    public-curve reproduction witness. A theorem attempt must state whether its
    guarantee is pointwise, average-case, or under a prior; these quantifiers may
    not be exchanged after seeing data.
  novelty_status: unverified
  status: proposed
