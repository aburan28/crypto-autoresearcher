  predictions:
    - id: P1
      statement: >-
        For synthetic score gaps with exactly known cumulant-generating
        functions, the proved 1-delta list-coverage bound contains the planted
        ideal in at least 0.95 of trials at delta = 0.05.
      metric: planted-ideal list coverage
      threshold: lower endpoint of reported 95 percent interval is at least 0.95
      test_boundary: N <= 4096, q <= 512, preregistered synthetic laws
    - id: P2
      statement: >-
        When planted mean separation is 0.08 with fixed sub-Gaussian proxy 1,
        median certified list size falls by at least a factor of 2 between
        q = 64 and q = 256.
      metric: median certified list-size ratio
      threshold: L_256 / L_64 <= 0.50
      test_boundary: calibrated planted positive family
    - id: P3
      statement: >-
        Under genuine-simulator candidate exchangeability, the certificate does
        not report persistent contraction below 0.90 N as q grows from 64 to 512.
      metric: median certified list size divided by N
      threshold: '>= 0.90 at every q'
      test_boundary: true-simulator null
  controls:
    - genuine-simulator null with a preregistered candidate-label permutation test
    - planted positive with separation continuously varied from 0 to 0.08
    - exact finite-distribution Chernoff calculation as the baseline
    - deliberately heavy-tailed scores violating the moment premise
    - nearby object with the same N and marginals but candidate labels resampled each transcript
    - public-curve reproduction check for every listed ideal
  falsification_conditions:
    - empirical coverage below the stated 1-delta guarantee on an in-premise law
    - theorem proof uses a data-dependent Renyi order without paying selection cost
    - null contraction persists rather than decays under stronger randomization
    - list witnesses fail public-curve reproduction
  confounders:
    - estimating a moment bound on the evaluation transcripts
    - treating dependent transcripts as independent
    - omitting a candidate from the finite set
    - confusing prior-average coverage with pointwise coverage
  interpretation_limits:
    - no verified score law for production SQIsign is asserted
    - no practical list-size or key-recovery claim
    - no SSI hard-problem conclusion
    - KN-TECH-058 supplies no verified GRH support for this theorem card
  heuristic_assumptions:
    - target is inside the fixed finite candidate set
    - the declared moment bound holds uniformly over its stated candidate quantifier
    - transcript dependence is either excluded or charged in the bound
  target_complexity:
    baseline: list of all N candidates with coverage 1
    proposed: conditional finite-q upper bound on list size at coverage 1-delta
    success_probability: theorem parameter 1-delta, calibrated independently
  cost_model:
    time: O(N q) scoring plus moment-bound evaluation
    memory: O(N) cumulative scores and list witnesses
    data: q evaluation transcripts plus independent calibration data
    preprocessing: candidate enumeration and distributional calibration
    oracle_access: public transcripts only; no timing or secret-state oracle
    verification: coverage simulation, exact-law baseline, and curve reproduction
  proof_search_map:
    baseline_reproduction: recover the exact finite-law Chernoff bound before using estimates
    observation_collision_search: find candidates with identical score laws and confirm neither is excluded
    quantifier_order: fix alpha, delta, N, q, and calibration sample before evaluation
    method_ceiling: construct zero-divergence candidates forcing list size N
    nearby_object_control: apply the derivation to relabelled candidates where contraction is known false
  nearest_neighbors:
