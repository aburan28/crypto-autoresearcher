idea:
  id: IDEA-20260805-818196
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-05'
  title: >-
    The fault-proof boundary is a RANK, not an argument: every published ML-DSA
    fault attack induces an affine constraint system on the secret whose rank
    per faulty signature is derivable, and the single-signature full-recovery
    claim FORCES its injection site to be the commitment randomness -- which
    places it outside any proof whose fault model is internal function
    boundaries, and does so by arithmetic instead of by adjudication
  class: mechanism

  claim: >-
    GOAL-MLDSA-001's second completion criterion asks for "a stated boundary for
    the fault-security proof placing each published fault attack inside or
    outside it". The obstacle is that this program has not obtained the proof --
    the five entries filed by BATCH-001 are four implementation papers and one
    standard whose body was not read, and NONE of them is the fault-security
    proof the research question's motivation names. THIS PROPOSAL MAKES THE
    CLASSIFICATION DERIVABLE WITHOUT THE PROOF, by replacing "argue about which
    faults it covers" with an invariant computed from the scheme's own dataflow.
    For a fault F, define its CONSTRAINT RANK r(F): the number of independent
    F_q-linear functionals of the secret (s1, s2) that one faulty signature
    makes computable from public data. r(F) is a property of Algorithm 7's
    dataflow and of the fault's effect, not of any hardware, and it is derivable
    on paper. Three consequences, each a forced value.
    (1) FAULT COST IS r-DETERMINED. The number of faulty signatures needed to
    determine s1 by linear algebra alone is N_LA = ceil(256*l / r), and the
    information-theoretic floor allowing the norm bound ||s1||_inf <= eta to be
    used is N_IT = ceil(256*l*log2(2*eta+1) / (r*log2 q)). Every published attack
    lands in the bracket [N_IT, N_LA] and the bracket is computable before the
    paper is read.
    (2) THE SINGLE-SIGNATURE CLAIM IS A CONSTRAINT ON THE INJECTION SITE. A
    reported full-key recovery from ONE faulty signature forces r = 256*l, i.e.
    the fault must make the ENTIRE commitment randomness y computable, because
    z = y + c*s1 is the only place the secret meets public data in a single
    signature and c is invertible in R_q with probability at least
    1 - 256/q = 1 - 3.05e-5. So the site is the y-generation path (ExpandMask
    and the hedged seed rho'), NOT an internal function boundary of the NTT or
    of the polynomial arithmetic. THE CLASSIFICATION IS THEREFORE FORCED BY THE
    REPORTED SUCCESS COUNT ALONE, before any fault model is read.
    (3) THE 58.2 PER CENT IS NOT ALGEBRA. The canonical success probability
    recorded by DEC-20260805-0d59ff for the Jendral 2024 attack (KN-LIT-4f3b80)
    is 0.582. The algebraic step of the y-known recovery succeeds with
    probability at least 1 - 3.05e-5. Therefore 0.582 is a HARDWARE
    fault-landing probability and carries no information about MLWE, MSIS or
    SelfTargetMSIS. Saying so precisely, with the arithmetic, is the rule-7
    discipline GOAL-MLDSA-001's own next_action demands, and it converts a
    number that currently sits in the ledger as an attack statistic into a
    number correctly attributed to an implementation.
    NOTHING HERE IS AN ATTACK, A FAULT INJECTION, OR A BREAK OF ANY MATHEMATICAL
    ASSUMPTION, AND NOTHING HERE MAY BE SCORED AS ONE.

  object_first_candidate:
    tracked_object: >-
      The AFFINE CONSTRAINT SYSTEM ON (s1, s2) induced by a fault -- a subspace
      of the dual of R_q^(l+k) together with a right-hand side -- followed from
      the injection site, through the dataflow of Algorithm 7, to the verifier's
      public equation, and out as a single integer: its rank. The tracked object
      is a system of linear functionals. It is deliberately NOT the faulty
      signature, NOT the glitch waveform and NOT the device: those vary by
      hardware and the rank does not.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens: (1) performing or simulating any physical
      fault injection, glitching, EM or power analysis -- this proposal injects
      nothing and needs no device; (2) lattice cryptanalysis of MLWE / MSIS /
      SelfTargetMSIS (that is IDEA-20260805-591f9d and -5194f9's lane, and the
      two must never be combined into a joint claim); (3) countermeasure design
      -- proposing a fix is not classifying a boundary; (4) the signing-only
      rejection predicates and the t0-secrecy claim, which belong to
      GOAL-MLDSA-002 (records IDEA-20260805-630606 / -031ce2 / -bb52fa,
      H-MLDSA-2ae88d / -2d4123) and are not touched here; (5) formal-methods
      work on the Lean development of KN-LIT-8ce0b5 -- its rank bound is
      CONSUMED as a relayed claim to be checked, not reproduced.
    newness_score: >-
      Rank counting for fault attacks is standard practice inside individual
      papers; what does not exist in this corpus is the rank as a
      CROSS-ATTACK INVARIANT used to partition a proof's guarantee. Checked:
      knowledge/techniques KN-TECH-047 (lattice attacks with side information)
      has never been applied to any signature scheme here; there is no MLDSA
      experiment, hypothesis on RQ-MLDSA-001, or evidence record; and the four
      implementation KN-LIT entries filed by BATCH-001 are each summarised as a
      key_claim with no quantitative common coordinate. The move -- classify by
      a computed invariant so the classification survives not having read the
      proof -- is the identifiability/quantifier-order template applied to a
      security argument rather than to a theorem.
    testability_score: >-
      High and nearly free for the derivations; genuinely uncertain for the
      relayed inputs. r, N_LA and N_IT are pen-and-paper for each fault class.
      What cannot be done cheaply is confirming what each published attack
      ACTUALLY does, because only abstracts have been read (every one of
      KN-LIT-340675, -4f3b80, -180ad5, -8ce0b5 records
      "Abstract read from primary ePrint page. Full text not obtained").
      The design therefore separates the derivable taxonomy, which stands alone,
      from the placement of specific papers into it, which is explicitly
      conditional and is labelled per row.
    survival_score: >-
      The rank arithmetic survives -- it is linear algebra over a field.
      What may not survive is the CLASSIFICATION step: if the fault-security
      proof, once obtained, partitions faults by something other than injection
      site (for example by which algorithm's postcondition is violated), the
      rank invariant is still correct but is not the coordinate the proof uses,
      and the taxonomy becomes a useful auxiliary rather than the boundary. That
      outcome is anticipated, is a falsification condition, and is still worth
      the cost.

  mechanism: >-
    DERIVED HERE. Algorithm structure is RECALLED-UNVERIFIED (no FIPS 204 body
    has been read; KN-LIT-4dadec records the gap and DEC-20260805-0d59ff gate 1
    permits ideation on that basis). Every algebraic step below is derived, not
    recalled, GIVEN that structure.

    (0) THE SIGNING DATAFLOW, as assumed. Sample y with ||y||_inf < gamma1;
    w = A*y; w1 = HighBits(w); c = SampleInBall(H(mu, w1)); z = y + c*s1;
    reject unless ||z||_inf < gamma1 - beta and ||LowBits(A*y - c*s2)||_inf <
    gamma2 - beta; emit (c-tilde, z, h). Public data per signature: c (from
    c-tilde), z, h, and the public key (A, t1).

    (1) WHERE THE SECRET MEETS PUBLIC DATA. In an unfaulted signature the only
    equation linking s1 to published values is z = y + c*s1, and y is uniform on
    a box of size 2*gamma1 - 1 per coefficient and never published; rejection
    sampling makes the distribution of z independent of s1, which is why the
    unfaulted transcript yields rank ZERO on the secret. EVERY FAULT ATTACK IS
    THEREFORE A METHOD OF LEARNING SOME OF y, or of moving the secret into a
    place the transcript exposes. This single observation is what makes rank the
    right coordinate.

    (2) RANK FROM PARTIAL KNOWLEDGE OF y. Suppose a fault makes w of the
    256*l coefficients of y computable from public data. Since R_q =
    Z_q[X]/(X^256 + 1) with q = 8380417 and 512 | q - 1, the ring splits
    completely and c*s1 is an F_q-linear function of s1. Restricting
    z - y = c*s1 to the w known coordinates yields exactly w F_q-linear
    functionals of s1, generically independent. Hence
      r = w  per faulty signature,
    and over N signatures with independent challenges the ranks add until
    saturation, giving
      N_LA = ceil(256*l / w)
    for recovery by linear algebra alone. Using in addition ||s1||_inf <= eta
    (each coefficient carries log2(2*eta+1) bits while each F_q equation carries
    log2 q = 22.9986 bits) gives the information-theoretic floor
      N_IT = ceil( 256*l*log2(2*eta+1) / (w*log2 q) ).
    Both are exact given w. SCOUT-COMPUTED, ML-DSA-44 (l = 4, eta = 2,
    256*l = 1024, secret-s1 entropy 2377.6 bits):
      w = 1    -> N_LA = 1024, N_IT = 104
      w = 8    -> N_LA = 128,  N_IT = 13
      w = 64   -> N_LA = 16,   N_IT = 2
      w = 256  -> N_LA = 4,    N_IT = 1
      w = 1024 -> N_LA = 1,    N_IT = 1.
    BEFORE ROUNDING, the ratio of the two counts is EXACTLY
    log2 q / log2(2*eta+1) = 22.9986 / 2.321928 = 9.9050, INDEPENDENT OF w and
    of l, because both counts scale as 1/w and both carry the same 256*l. That
    invariance is a forced structural fact and is the arithmetic's own check.
    After the ceilings it is only approximately 9.9 -- at w = 64 the rounded
    pair is 16 and 2, ratio 8 -- so the invariance is asserted for the unrounded
    quantities and the rounded table is reported as computed. The ratio is
    exactly the room a side-information lattice attack (KN-TECH-047) has to work
    in, and at eta = 2 it is the same 9.9050 at ML-DSA-44 and ML-DSA-87 while at
    eta = 4 (ML-DSA-65) it drops to 22.9986 / 3.169925 = 7.2554.

    (3) THE SINGLE-SIGNATURE FORCING ARGUMENT. Set N = 1 in (2): recovery of all
    of s1 from ONE faulty signature requires w = 256*l, i.e. the whole of y
    computable. The only alternative would be a fault that exposes s1 through a
    different equation, but in Algorithm 7 s1 appears only in c*s1 and nowhere
    else, and s2 appears only inside LowBits(A*y - c*s2), whose value is not
    published. Hence a reported single-faulty-signature full recovery of s1
    FORCES the fault to render y computable in full. Sites that can do this:
    the seed rho' from which ExpandMask derives y, the ExpandMask expansion
    itself, or the RNG in hedged mode. Sites that CANNOT: a twiddle-factor fault
    inside an NTT butterfly, which perturbs a bounded number of coefficients of
    one transform and therefore has bounded r by construction -- which is
    precisely the shape of the machine-checked bound KN-LIT-8ce0b5 reports
    (RELAYED, abstract only, the bound's value is NOT known to this program and
    is a checkable input, not an assumption).
    CONSEQUENCE FOR THE BOUNDARY: if the fault-security proof's model is
    "faults at internal function boundaries" as the research question's
    motivation relays, then the y-generation site is a MODEL INPUT (the seed and
    the sampler's output are the algorithm's inputs, not an internal boundary of
    it), and the single-signature attack lies OUTSIDE the guarantee for a reason
    that is arithmetic rather than interpretive. THAT CONDITIONAL IS THE
    DELIVERABLE. Its antecedent is relayed and unverified, and it is written as
    a conditional for that reason.

    (4) THE 58.2 PER CENT SEPARATION. Under (3) the algebraic step is
    s1 = c^{-1}(z - y), which fails only if c is not invertible in R_q. c has
    256 NTT coefficients; a coefficient vanishes with probability about 1/q, so
    by a union bound c is invertible with probability at least
    1 - 256/q = 1 - 3.0547e-5. Since 0.582 is nowhere near 1 - 3.05e-5, the
    reported success probability is dominated by the physical fault landing
    where intended. FORCED CONCLUSION: 0.582 is an implementation statistic. It
    bounds nothing about MLWE, MSIS or SelfTargetMSIS in either direction, and a
    record that lets it do so is defective under AGENTS.md rule 7.

    (5) THE TAXONOMY. Each published attack gets one row:
    (site in the dataflow DAG; what the fault makes computable; w; r; N_LA;
    N_IT; whether the site is an algorithm INPUT, an INTERNAL FUNCTION BOUNDARY,
    or an INTRA-FUNCTION datapath; provenance class of each cell). The rows for
    which the site is not determinable from an abstract are marked UNDETERMINED
    and stay undetermined; they are not guessed. A taxonomy with three
    determined rows and two undetermined rows is a result. A taxonomy with five
    rows of which two are invented is a fabrication.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/proposals
      - ledger/hypotheses
      - ledger/evidence
      - ledger/decisions
      - knowledge/literature
      - knowledge/techniques
      - knowledge/open-problems
      - experiments
    grep_results:
      - >-
        No fault taxonomy, rank count, or faulty-signature bracket exists for
        any scheme anywhere in this corpus; no MLDSA experiment or evidence
        record exists at all.
      - >-
        KN-TECH-047 (lattice attacks with side information) is present and has
        never been applied to any signature scheme here.
      - >-
        The four filed implementation entries (KN-LIT-340675, -4f3b80, -180ad5,
        -8ce0b5) carry key_claim prose and share no quantitative coordinate;
        each records "Full text not obtained".
      - >-
        NO KN-LIT ENTRY CORRESPONDS TO THE FAULT-SECURITY PROOF that
        RQ-MLDSA-001's motivation names. KN-LIT-8ce0b5 is a machine-checked rank
        bound for one fault class, a different object. This absence is itself a
        finding about GOAL-MLDSA-001's second completion criterion.
    conclusion: >-
      Mechanism/taxonomy proposal. Rank counting inside a single fault paper is
      standard and no novelty is claimed for it; the claim of newness is
      restricted to using the rank as a CROSS-ATTACK invariant that partitions a
      proof's guarantee, and to the forcing argument that derives an injection
      site from a reported signature count. UNVERIFIED externally and discounted
      for the reason KN-OPEN-3f7a21 records.

  lossy_projection_identifiability_audit:
    projection: >-
      (fault attack: device, injection technique, timing, waveform, target
      implementation, measured success rate) --> (site class, w, r) --> N_LA,
      N_IT.
    what_is_discarded: >-
      The device, the injection technique, the countermeasures present or
      absent, the measured success rate, the implementation's language and
      target, and the entire physical layer.
    why_genuinely_lossy: >-
      Very lossy: an infinite family of physical attacks maps to the same
      (site, w, r). That is the intended property -- the invariant is meant to
      be hardware-independent so that two attacks on different devices become
      comparable.
    why_compatible_with_the_operations: >-
      Compatible because the retained part propagates deterministically through
      the only operation the classification performs: rank accumulation over
      independent signatures, which depends on w and on the independence of
      challenges and on nothing else. The discarded physical layer affects HOW
      OFTEN a fault lands, never WHAT it constrains once it has landed -- and
      section (4) of the mechanism is the explicit demonstration that those two
      quantities separate.
    is_it_only_a_change_of_coordinates: >-
      NO, checked in the forward direction: the device and waveform cannot be
      recovered from (site, w, r), so this is not the char-2
      (Delta, Pi) = (x xor y, x*y) failure in which nothing is discarded.
      MIRROR FAILURE CHECKED, AND IT IS THE REAL RISK HERE: is (site, w, r)
      constant across the attacks being classified, giving zero comparator
      spread? Derived answer, before any run: NO, and the spread is large and
      structured. The y-known class has w = 256*l = 1024 at ML-DSA-44; an NTT
      twiddle class has w bounded by the number of coefficients one butterfly
      contaminates, which is orders of magnitude smaller; and the rank-0 null
      class (a fault on the message digest) has w = 0. Three attacks span
      w in {0, small, 1024} and N_LA in {infinity, large, 1}. If, when the
      papers are actually read, every attack turns out to be the SAME class,
      the invariant is constant across the population, the taxonomy has no
      discriminating power, and the honest report is exactly that -- which is
      itself a finding, since it would mean the published fault literature
      against ML-DSA attacks one site.

  proof_search_map_ref: H-MLDSA-acac6d

  assumptions:
    - >-
      The Algorithm 7 dataflow in mechanism (0). RECALLED-UNVERIFIED. If the
      structure differs, the rank arithmetic is unchanged in form but its
      instantiation changes; the derivation is written so that substituting a
      sourced algorithm re-derives it mechanically.
    - >-
      q = 8380417 and 512 | q - 1, so X^256 + 1 splits into 256 linear factors
      mod q, R_q is isomorphic to F_q^256, and c is invertible exactly when none
      of its 256 NTT coefficients vanishes. The modulus itself is RECALLED, but
      the divisibility is SELF-CHECKING and was checked here:
      q - 1 = 8380416 = 2^13 * 1023 = 2^13 * 3 * 11 * 31, so 2^9 = 512 divides
      q - 1 with room to spare. STAGE 1 RE-RUNS THIS IN-HARNESS RATHER THAN
      INHERITING IT. If the sourced q differs and 512 does not divide q - 1, the
      splitting claim is withdrawn and the invertibility bound is recomputed
      from the actual factorisation of X^256 + 1 mod q.
    - >-
      That each published attack's site is determinable. FREQUENTLY FALSE from
      an abstract. Undetermined rows stay undetermined.
    - >-
      Independence of challenges across signatures, so ranks add. Standard, and
      violated only if the attacker cannot choose or does not receive fresh
      messages; the taxonomy states the assumption per row.

  predictions:
    - metric: >-
        ring_split_check: whether 512 divides q - 1 for q = 8380417
      direction: different
      minimum_effect: >-
        Pre-registered YES. This is one modulus operation and it is the cheapest
        gate in the proposal. If NO, the invertibility bound in mechanism (4)
        is withdrawn and recomputed from the true factorisation of X^256 + 1.
    - metric: >-
        c_invertibility_floor = 1 - 256/q
      direction: higher
      minimum_effect: >-
        EXACTLY 1 - 3.0547e-5 = 0.99996945 (to eight places), pre-registered.
        The forced comparison against the canonical 0.582 follows immediately
        and is the separation in mechanism (4).
    - metric: >-
        N_LA and N_IT as functions of w at ML-DSA-44, over the graded ladder
        w in {1, 8, 64, 256, 1024}
      direction: lower
      minimum_effect: >-
        EXACTLY N_LA = 1024 / 128 / 16 / 4 / 1 and N_IT = 104 / 13 / 2 / 1 / 1,
        pre-registered, strictly non-increasing in w. The UNROUNDED ratio must
        equal 9.9050 at every w (it is log2 q / log2(2*eta+1) and depends on
        neither w nor l); the ROUNDED ratio is not constant and at w = 64 is 8,
        which is a ceiling effect and not a fault. A non-monotone sequence, or
        an unrounded ratio that departs from 9.9050, is an arithmetic fault.
    - metric: >-
        single_signature_forcing: the value of w forced by a reported N = 1
        full-s1 recovery
      direction: different
      minimum_effect: >-
        EXACTLY 256*l, i.e. 1024 / 1280 / 1792 at ML-DSA-44 / -65 / -87. This is
        the proposal's headline forced value and it is derived before any paper
        is read. If a published attack reports N = 1 with a site that
        demonstrably contaminates fewer than 256*l coefficients of y, the
        forcing argument is WRONG and there is a second path from s1 to the
        transcript that this derivation has missed -- which would be a far more
        valuable finding than the taxonomy.
    - metric: >-
        taxonomy_determined_fraction: rows whose site class is determinable from
        the sources actually obtained
      direction: higher
      minimum_effect: >-
        No threshold is pre-registered and none may be, because it depends on
        what can be fetched. The pre-registered RULE is: undetermined rows are
        reported as undetermined and the fraction is published. A taxonomy is
        not permitted to reach 100 per cent by inference.

  minimal_test:
    design: >-
      Four stages, cheapest-first; Stages 1 and 2 are pen-and-paper and either
      can end the line. STAGE 1 (minutes, pure arithmetic): the ring-split
      check, the invertibility floor, and the full (w, r, N_LA, N_IT) ladder at
      all three parameter sets. STAGE 2 (pen and paper, zero compute): write the
      single-signature forcing argument formally and have it attacked -- its
      only content is that s1 appears exactly once in the dataflow, and that is
      the claim a reviewer should try to break. If a second appearance exists,
      STOP and report it; it is the more important result. STAGE 3 (reading;
      bounded, and may fail under the network policy): obtain full texts for the
      four filed implementation entries and, separately, ATTEMPT TO IDENTIFY AND
      OBTAIN THE FAULT-SECURITY PROOF ITSELF, which the corpus does not have --
      no KN-LIT entry for it exists. Fill the taxonomy; leave undetermined rows
      undetermined. STAGE 4 (only if Stage 3 obtained the proof): state the
      boundary and place each row inside or outside it. If Stage 3 fails to
      obtain the proof, the deliverable is the taxonomy plus a NAMED GAP -- and
      that gap is a finding about GOAL-MLDSA-001's own completion criterion,
      which currently cannot be met from the filed corpus.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL): the
        MESSAGE-DIGEST FAULT. Corrupt mu before the challenge is computed. The
        result is a syntactically valid signature on a different message; s1 and
        s2 appear in it exactly as they do in an honest signature, and the
        transcript's distribution is unchanged by rejection sampling. FORCED
        VALUE: w = 0, r = 0, N_LA = infinity, N_IT = infinity. This null can
        genuinely fail: a rank-counting procedure that counts equations rather
        than INDEPENDENT equations, or that forgets that y is unknown, will
        assign this fault a positive rank. If it does, every other row is void.
      - >-
        SECOND NULL, DIFFERENT SHAPE: the UNFAULTED transcript. Forced value
        r = 0 by rejection sampling. Any procedure that extracts positive rank
        from honest signatures has reproduced a break of the scheme by
        bookkeeping error and must be stopped immediately.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT (the effect MUST appear or no negative
        may be reported): the Y-KNOWN fault. Forced value w = 256*l, r = 256*l,
        N_LA = 1, N_IT = 1, and an explicit recovery s1 = c^{-1}(z - y). If the
        procedure does not return N = 1 here, it cannot detect a full-rank
        constraint system and no statement of the form "attack X needs many
        signatures" may be made.
      - >-
        GRADED CONTROL, 5 interior points, monotonicity reported: the ladder
        w in {1, 8, 64, 256, 1024} with its pre-registered N_LA and N_IT above.
        Report monotonicity AND the constancy of N_LA/N_IT. This localises an
        arithmetic fault to either the linear-algebra count or the entropy count
        rather than leaving "the numbers look wrong".
      - >-
        RULE-7 SEPARATION CONTROL (zero compute, and it is a control on the
        WRITE-UP rather than on the arithmetic). For every sentence in the
        deliverable, check that it does not license an inference about MLWE,
        MSIS or SelfTargetMSIS. The mechanism-(4) separation is the instrument:
        any success probability appearing in the taxonomy must be attributed
        either to hardware or to algebra, with the algebraic floor computed.
      - >-
        ARCHIVE CHECK (zero compute): prior fault taxonomies or rank counts in
        this corpus. Recorded in advance: NONE. KN-TECH-047 exists and has never
        been applied to a signature scheme; the four implementation KN-LIT
        entries carry key_claim prose and no common coordinate. Recorded as an
        absence, not as a passed check.
    required_metrics:
      - the ring-split check result and the invertibility floor to eight places
      - the full (w, r, N_LA, N_IT) table at all three parameter sets, as exact integers
      - the forcing argument written out, with the enumeration of every occurrence of s1 and s2 in the dataflow
      - the taxonomy with one provenance class per cell and undetermined rows marked
      - a statement of whether the fault-security proof was obtained, and if not, exactly what was tried

  falsification_conditions:
    - >-
      A second occurrence of s1 (or of s2) in the published transcript is
      exhibited. The single-signature forcing argument collapses, and locating
      that second channel becomes the finding. This is the strongest available
      falsifier and Stage 2 exists to invite it.
    - >-
      512 does not divide q - 1. The invertibility floor is withdrawn and
      recomputed.
    - >-
      The null object (message-digest fault) is assigned positive rank by the
      procedure. Every row is void until the procedure is repaired.
    - >-
      The positive control does not return N = 1. Nothing negative may be
      reported.
    - >-
      A published attack reports N = 1 full recovery from a site that
      contaminates fewer than 256*l coefficients of y. The forcing argument is
      wrong; report it as wrong.
    - >-
      Every obtained attack lands in the same site class. The invariant does not
      discriminate over the actual population and the taxonomy's value is
      reported as nil, with the observation that the published fault literature
      concentrates on one site.
    - >-
      The fault-security proof, once obtained, partitions faults by a coordinate
      other than injection site. The rank invariant is then an auxiliary and the
      boundary statement must be rebuilt on the proof's own coordinate.

  confounders:
    - >-
      ABSTRACT-ONLY SOURCES. All four implementation entries record "Full text
      not obtained". Every site assignment made from an abstract is a guess and
      is marked undetermined rather than entered.
    - >-
      THE PROOF IS NOT IN THE CORPUS. RQ-MLDSA-001's motivation names "a formal
      proof covering only a specific class of faults at internal function
      boundaries" but no KN-LIT entry corresponds to it; KN-LIT-8ce0b5 is a
      machine-checked RANK BOUND for one fault class, which is a different
      object. The antecedent of the boundary conditional is therefore currently
      unsourced and the conditional is written as one.
    - >-
      GENERIC INDEPENDENCE. r = w assumes the w restricted functionals of s1 are
      independent, which is generic but not automatic; degenerate challenges
      reduce it. The taxonomy reports r as an upper bound with the genericity
      assumption named.
    - >-
      COUNTERMEASURES. A deployed implementation with fault detection changes
      the landing probability, not the rank. The taxonomy is therefore about
      what a landed fault constrains and says so, and it may not be read as a
      statement about any fielded product.

  interpretation_limits:
    - >-
      THIS IS AN IMPLEMENTATION-LEVEL RECORD. Under AGENTS.md rule 7 no result
      here is evidence about MLWE, MSIS or SelfTargetMSIS in either direction --
      not as a weakening, and equally not as a reassurance. The record declares,
      as GOAL-MLDSA-001's next_action requires, that it attacks the
      IMPLEMENTATION and not the mathematics.
    - >-
      NO FAULT IS INJECTED, SIMULATED OR ENABLED. No attack is improved. The
      deliverable is a classification of published work by a computed invariant.
    - >-
      A row placing an attack OUTSIDE the proof's guarantee is not a criticism
      of the proof. A proof that covers one fault class and says so is doing its
      job; the point of the boundary is that it should be stated, not that it
      should be wider.
    - >-
      Claim tier: the arithmetic runs at the real parameter sets and is exact,
      so N_LA and N_IT are not toy quantities. But the taxonomy's ROWS inherit
      the provenance of their sources, and a row built on an abstract is
      reported at the strength of an abstract.

  heuristic_assumptions:
    - id: HEUR-RANK-1
      statement: >-
        For a fault making w coefficients of y computable, the w induced
        F_q-linear functionals of s1 are independent, so the rank contribution
        of one faulty signature is exactly w, and over N signatures with
        independently sampled challenges the total rank is min(N*w, 256*l).
      rigorous_support: >-
        Derived, not recalled. c*s1 is F_q-linear in s1 and, in the completely
        split NTT basis, multiplication by c is a diagonal invertible map when
        c is invertible; restricting an invertible linear map to w coordinates
        gives rank exactly w. Independence across signatures is the statement
        that the restricted row spaces for independent c are in general
        position, which is generic over F_q and fails on a set of challenges of
        density O(1/q) per collision.
      validation_plan: >-
        The graded ladder is the test: N_LA must follow ceil(256*l / w) exactly
        at five points. A departure at any point refutes the independence claim
        at that w and the row is reported with a measured rank instead of a
        derived one.
    - id: HEUR-RANK-2
      statement: >-
        The information-theoretic floor N_IT = ceil(256*l*log2(2*eta+1) /
        (w*log2 q)) is attainable in principle by an attacker exploiting the
        norm bound, so every published attack's signature count lies in
        [N_IT, N_LA].
      rigorous_support: >-
        The counting is exact; ATTAINABILITY IS NOT PROVED AND IS NOT CLAIMED.
        N_IT is a floor by information theory alone, and no algorithm reaching
        it is exhibited. This is the weakest link in the proposal and is
        recorded as such rather than smoothed over: the bracket's lower end is a
        floor, not a prediction, and a published attack sitting near N_LA is not
        evidence of inefficiency.
      validation_plan: >-
        Report the bracket, and for each published attack whose signature count
        is known, report where in the bracket it lies. Do not report a
        deficiency for an attack near N_LA.

  target_complexity:
    time_exponent: >-
      n/a -- NO EXPONENT IS MOVED AND NONE IS CLAIMED. This proposal produces a
      classification and a set of exact integer counts. It is worth running
      because GOAL-MLDSA-001's second completion criterion cannot be met from
      the currently filed corpus at all, and this is the cheapest route to the
      largest fraction of it that IS reachable.
    memory_exponent: n/a -- no algorithm is proposed.
    best_known: >-
      The published fault attacks themselves (KN-LIT-340675, -4f3b80, -180ad5,
      -8ce0b5), all abstract-only, and the unlocated fault-security proof.
    hidden_overhead: >-
      The gap between N_IT and N_LA (about 9.9x at eta = 2) is exactly the
      unquantified room a side-information lattice attack could occupy; this
      proposal measures the room and does not fill it.
    tradeoff_note: n/a.

  dominated_by: null
  dominated_by_check: >-
    NULL CLAIMED ONLY AFTER LISTING THE ROWS CHECKED. No attack is proposed, so
    no frontier point is occupied; null here means no prior record supplies this
    classification. Checked 2026-08-05. TIME axis: ledger/proposals --
    IDEA-20260801-008 is a cost audit of SelfTargetMSIS and touches no fault;
    the sibling goal's IDEA-20260805-630606 / -031ce2 / -bb52fa are conformance
    and t0-secrecy records that inject nothing. MEMORY axis: not applicable, no
    algorithm; the taxonomy stores one row per attack. DATA / QUERY axis: THIS
    IS THE AXIS THE PROPOSAL LIVES ON -- N_LA and N_IT are query counts (faulty
    signatures), and no record in this corpus charges a query count for any
    fault attack on any scheme. Also checked: knowledge/techniques KN-TECH-047
    (lattice attacks with side information), present and never applied to a
    signature scheme; the four filed implementation entries, which report
    success probabilities and no signature-count bracket; and ledger/evidence,
    which contains no MLDSA record of any kind. Absence here is not evidence of
    absence in the literature -- individual papers certainly count their own
    ranks -- and the claim is only that no CROSS-ATTACK invariant exists in this
    corpus.
  sota_delta: >-
    QUANTITATIVE AND NOT AN ATTACK DELTA. (1) A signature-count bracket
    [N_IT, N_LA] for each fault class, currently absent everywhere in this
    program: at ML-DSA-44 the ladder is N_LA = 1024 / 128 / 16 / 4 / 1 against
    N_IT = 104 / 13 / 2 / 1 / 1 for w = 1 / 8 / 64 / 256 / 1024, with the ratio
    pinned at about 9.9. (2) One forced classification: a reported
    single-faulty-signature full-s1 recovery forces w = 1024 / 1280 / 1792 and
    therefore forces the injection site to be the y-generation path -- derived
    before reading any paper. (3) One correction of attribution: the canonical
    0.582 is separated from an algebraic floor of 1 - 3.0547e-5, showing it to
    be a hardware statistic. (4) One gap named: the fault-security proof is not
    in the corpus, so the goal's second completion criterion is currently
    unreachable and this record says so with the search recorded.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the derivable half -- the ring-split check, the invertibility
    floor, the (w, r, N_LA, N_IT) ladder, the forcing argument, and the 0.582
    separation -- survives independent review intact. NOT HIGHER because the
    Algorithm 7 dataflow is recalled rather than read, and a single structural
    error there (for example a second published quantity depending on s2) would
    break the forcing argument; and because the independence claim HEUR-RANK-1,
    though generic, is asserted rather than measured. NOT LOWER because every
    step is linear algebra over a field with an exact count, because the
    forcing argument depends on a single structural fact that a reviewer can
    check in one reading, and because the two null objects are constructed to
    fail loudly if the rank procedure is miscounting.
    0.35 that the full boundary statement -- criterion 2 of GOAL-MLDSA-001 --
    is reachable this campaign, because the fault-security proof is not in the
    corpus, no KN-LIT entry corresponds to it, and the goal's own pause
    condition contemplates primary sources being unobtainable. That number is
    deliberately low and the design is written so that a failure to obtain the
    proof still yields the taxonomy and a named gap rather than nothing.
