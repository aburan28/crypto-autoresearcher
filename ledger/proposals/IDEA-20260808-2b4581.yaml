idea:
  id: IDEA-20260808-2b4581
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: 'The structure-discount ledger: for each UOV-descended scheme, compute the cost of
    a matched plain UOV at its FLATTENED (N, M, O) and subtract the best-known attack -- SNOVA''s
    discount is the largest object in the slice by orders of magnitude, and the ledger turns
    four separate neutrality questions into one Pareto table of discount versus key size'
  class: composition
  claim: 'DEFINE, for any UOV-descended scheme, the flattened triple (N, M, O) = (F_q-dimension
    of the variable space, of the equation space, of the oil object) and the NOMINAL cost
    C_nom = the published plain-UOV key-recovery cost formula evaluated at (N, M, O) under
    one fixed convention. DEFINE the STRUCTURE DISCOUNT D = log2 C_nom - log2 C_best, where
    C_best is the best-known attack cost at the real scheme. CLAIM: (i) D is computable for
    all four UOV-descended schemes from published data plus one shared convention, and is
    exactly the quantity every "is the structural addition security-neutral" question is asking
    for; (ii) at RECALLED SNOVA-I the flattened triple is (464, 80, 80), for which the plain-UOV
    guessing exponent q^{N-2O} = 16^{304} is astronomically above SNOVA''s claimed level,
    so D is the largest in the slice by a wide margin -- and D is paid for a public key roughly
    three orders of magnitude smaller than the matched plain UOV''s; (iii) plotting D against
    public-key bytes gives the Pareto statement GOAL-SNOVA-001 explicitly asks for ("whether
    any surviving parameter choice keeps SNOVA''s size advantage over matched UOV variants"),
    and the same plot answers the same question for MAYO and QR-UOV at once. The discriminating
    content: a scheme whose D is small has bought its compression for free; a scheme whose
    D is large has traded a measurable amount of nominal hardness for size, and the ledger
    says how much.'
  mechanism: Every scheme in the family is a plain UOV with a constraint on the key space.
    The constraint buys key size and costs whatever the best attack exploits. D is precisely
    the exchange rate, and it has never been computed in this program because each goal asks
    its own neutrality question against its own baseline. One convention, one table, four
    answers.
  why_not_a_renamed_known_approach: 'Nearest known method: per-scheme security claims against
    per-scheme baselines, which is what every specification does. The difference is a single
    shared yardstick applied to all four, which makes the numbers comparable for the first
    time. Nearest internal record: IDEA-20260807-b63f08 observes that four goals declare a
    shared plain-UOV accounting basis a prerequisite, that the KN-TECH entry does not exist,
    and that three hypotheses have each derived their own -- that record diagnoses the divergence
    and asks for the shared entry; this record supplies the specific quantity the shared entry
    should carry and the table it produces.'
  predictions:
  - observable: D for UOV (trivially 0 by construction), MAYO, QR-UOV, SNOVA
    metric: bits
    predicted: Ordering D(SNOVA) > D(QR-UOV) > D(MAYO) > D(UOV) = 0, with D(SNOVA) in the
      hundreds to thousands of bits and D(MAYO) small. A different ordering is informative
      and is the point.
  - observable: public-key bytes for each scheme and for its matched flattened plain UOV
    metric: bytes, ratio
    predicted: Compression ratios of order ell for QR-UOV, of order ell^2 for SNOVA, and of
      order (m/o)^2-ish for MAYO. Computed exactly from the key formats, not estimated.
  - observable: the (D, key-size) Pareto front -- does any scheme dominate another on both
      axes
    metric: dominance relation
    predicted: No total order; at least one genuine tradeoff pair. If one scheme dominates
      all others on both axes, that is a strong and reportable Pareto statement.
  - observable: sensitivity of D to the cost convention (guessing exponent vs solving-degree
      model, omega = 2 vs 2.81, memory charged vs not)
    metric: spread in bits across conventions
    predicted: Large -- hundreds of bits. This is the honest headline risk and the reason
      the table reports a BAND per scheme rather than a number.
  minimal_test: 'Zero compute, one convention document. (1) Fix the convention: state the
    flattening rule for each scheme (SNOVA by ell^2, QR-UOV by ell, MAYO by nothing), the
    plain-UOV cost formula used for C_nom (both the guessing exponent q^{N-2O} and a solving-degree
    model, reported separately), omega, and whether memory is charged. (2) Tabulate (N, M,
    O), C_nom, C_best, D and public-key bytes for every published parameter set of all four
    schemes. (3) Plot D against key size and state the Pareto relations. (4) Repeat the whole
    table under the alternative conventions and report the band. Every input is a published
    integer or a formula; no run, no solver.'
  controls:
  - 'SELF-CONSISTENCY: for plain UOV the ledger must return D = 0 exactly, since the scheme
    IS its own matched baseline. A nonzero D there means the convention is inconsistent.'
  - 'CONVENTION-SWEEP: the whole table under at least three conventions. A conclusion that
    survives only one convention is reported as convention-dependent, not as a finding.'
  - 'FLATTENING-SWEEP: SNOVA and QR-UOV flattened over F_q AND over their coefficient algebra
    A. The two flattenings give different (N, M, O) and possibly different orderings; both
    are reported, and the difference between them is itself the measurement M1-05 supplies.'
  - 'C_best PROVENANCE CONTROL: every C_best must carry its source. Where this program has
    not read the source -- which is the case for every reported SNOVA attack -- the cell is
    marked UNAVAILABLE rather than filled from secondhand figures, per GOAL-SNOVA-001''s explicit
    instruction.'
  confounders:
  - C_best for SNOVA is unavailable to this program (the attack papers are unread and their
    figures must not be restated), so D(SNOVA) can only be bounded below by using the scheme's
    CLAIMED level in place of C_best. That substitution changes D's meaning and must be labelled
    in the table, not silently made.
  - Flattening is a modelling choice and the ordering can depend on it.
  - C_nom uses a plain-UOV formula outside the parameter regime it was fitted in (N/O = 5.8
    for SNOVA is far from UOV's 2.55), so C_nom is an extrapolation of a cost model, not a
    measured cost. This is the ledger's central weakness and is stated in its header.
  - Key sizes depend on compression choices (seed expansion) that are orthogonal to the algebraic
    structure; both compressed and expanded sizes are reported.
  falsification_conditions:
  - The plain-UOV self-consistency check does not return D = 0.
  - The ordering of D reverses between two defensible conventions, in which case the ledger
    reports "no convention-independent ordering exists" -- a complete and useful answer.
  - Every C_best cell for a scheme is UNAVAILABLE, in which case that scheme's row is a bound
    and is labelled as one.
  interpretation_limits: D is an exchange rate between a cost MODEL and a claimed level, not
    between two measured attacks. A large D does not mean a scheme is weak; it means its security
    rests entirely on the structure being un-exploitable, which is a statement about where
    the risk sits. The ledger's value is comparative and its numbers must never be quoted
    as attack costs. No secondhand attack figure is entered anywhere.
  assumptions:
  - Published parameter sets and key formats are readable from the specifications.
  - One flattening convention can be stated that applies to all four schemes.
  heuristic_assumptions:
  - id: HA-1
    statement: The plain-UOV key-recovery cost formula, evaluated at flattened parameters
      far outside the regime where it was calibrated (N/O up to 6 rather than 2.5), remains
      the right functional form up to a multiplicative constant in the exponent.
    rigorous_ingredient: The guessing exponent q^{N-2O} has a rigorous combinatorial meaning
      (the probability that a random subspace of the right dimension meets the oil space)
      that holds at any N/O, so at least one of the two C_nom variants is on solid ground;
      the solving-degree variant is the heuristic one.
    distribution_imitated: '"The derived systems at unusual N/O behave semi-regularly" --
      the family''s universal assumption, here explicitly flagged as extrapolated.'
    validation_route: At toy flattened parameters spanning N/O from 2.5 to 6, measure the
      actual key-recovery cost and compare against both C_nom variants. TOY SCALE, explicitly,
      and this is exactly M1-03's experiment reused, which is why the two records should share
      an instrument.
    tail_checks: Report the largest deviation between measured and predicted cost across the
      N/O sweep; a deviation growing with N/O invalidates the ledger's use of C_nom at SNOVA's
      N/O = 5.8 and must be propagated into the table as a widened band.
  target_complexity:
    time_exponent: No attack. D is itself an exponent difference in bits and is the record's
      output.
    memory_exponent: The ledger reports memory for both C_nom and C_best in every cell; a
      discount computed with one side's memory uncharged is void, and the convention document
      says so.
    best_known_baseline: 'Per scheme: its own published claimed level, plus any attack this
      program has actually read. Unread attacks are UNAVAILABLE cells, never estimates.'
    hidden_overhead_disclosure: C_nom is an extrapolated cost model, not a measurement; the
      band across conventions is reported precisely so the reader sees the size of that overhead.
    time_memory_tradeoff: Reported per cell where the underlying attack has one (guessing
      is low-memory, solving-degree models are memory-heavy); the ledger's two C_nom variants
      sit at opposite ends of that tradeoff by construction, which is why both are kept.
  sota_delta: No attack. The deliverable is the first convention-fixed, cross-scheme comparison
    in this program, with an explicit band, explicit UNAVAILABLE cells, and a Pareto plot
    that answers a question three separate goals ask independently.
  dominated_by: 'n/a (no result claimed). Frontier rows checked across all four schemes: guessing/Kipnis-Shamir
    (time, negligible memory), reconciliation (time, Macaulay memory), intersection (time,
    memory), direct/forgery (time, memory), plus the corpus rows IDEA-20260807-b63f08 (shared
    basis diagnosis), -8d9ac0, -69af7c, -74349c, -70aa6e, -258212. None produces a cross-scheme
    discount.'
  estimated_cost: 'Implementation low: a spreadsheet-grade calculator plus the convention
    document. Compute negligible. The real cost is four specification reads, which four other
    records in this slice already require.'
  recommended_priority: high
  honest_prior_of_survival: 'That the ledger can be built with the stated conventions: ~0.85.
    That its ordering is convention-independent: ~0.4 -- and a convention-dependent ordering
    is still a publishable finding about the family''s cost models. That it changes a goal''s
    disposition: ~0.5. Its main risk is that too many C_best cells are UNAVAILABLE, which
    would leave a table of bounds; that outcome is acceptable and is stated in advance.'
  novelty_status: unverified
  novelty_screen: EXISTING_PROPOSALS.txt (all 24 MQ rows plus IDEA-20260807-b63f08 read at
    claim level), EXISTING_HYPOTHESES.txt (all eight MQ hypotheses), REJECTED_TITLES.txt,
    DEFERRED_TITLES.txt, CATALOGUE_TITLES.txt, KNOWLEDGE_BARRIERS.txt, and this slice's own
    M1.yaml. No corpus record computes a cross-scheme discount or a (discount, key-size) Pareto
    front. WEB NOT CHECKED.
  discriminated_from: 'IDEA-20260807-b63f08: diagnoses that the shared plain-UOV KN-TECH basis
    does not exist and that three hypotheses diverged; it asks for the entry, this record
    specifies the quantity and the table the entry should carry. IDEA-20260805-8d9ac0: QR-UOV-only
    ell-cancellation. IDEA-20260805-70aa6e: SNOVA-only object counting with a stated non-binding
    ceiling. IDEA-20260805-258212: MAYO-only dilation identities.'
  source_refs:
  - UOV, MAYO, QR-UOV, SNOVA specifications -- REQUIRED READS, NOT YET READ.
  - KN-LIT-7620 (NIST IR 8610) -- Round-3 roster only.
  - GOAL-SNOVA-001's explicit instruction that the secondhand attack figures in RQ-SNOVA-001
    must not be restated until reproduced -- honoured by the UNAVAILABLE-cell rule.
