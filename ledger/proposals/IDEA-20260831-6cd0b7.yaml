idea:
  id: IDEA-20260831-6cd0b7
  question_id: RQ-MONO-001
  added: '2026-08-31'
  title: >-
    The untested literal N5: does the base-change-ladder protocol still
    correctly refuse to certify fullness (UNDECIDED at every k) on a
    genuinely large, many-class object with a fibre size closer to what a
    real higher-m Semaev cover would need, or does its refusal discipline
    only work at the small toy scales already tested?

  class: control

  claim: >-
    H-MONO-59f6a6 (status: supported) validated a five-step base-change-
    ladder protocol for certifying geometric monodromy on a six-object
    battery at p=211. Its own text records that the literal N5 object its
    source proposal specified -- "a degree-100, ~100 realized classes each
    of density ~1/100" object -- was NOT tested: it was scoped down to a
    uniformly random monic quintic (S_5, order 120, fibre size 5) because a
    group of order ~100 cannot act faithfully on a fibre of size <=8, which
    conflicted with the tested battery's uniform small-fibre design. That
    scoping-down is explicitly named as a Coordinator decision, disclosed
    rather than silently substituted, with "the idea's literal N5 remains
    untested and is named as future work."
    This idea proposes the literal test: a construction with a LARGE fibre
    (order ~100, matching the "~100 realized classes each of density ~1/100"
    specification) rather than a small fibre with a large abstract group
    order. Concretely: a uniformly random monic polynomial of degree n=10
    over F_p, whose generic Galois group is S_10 (order 3,628,800) -- too
    large to realize even a small fraction of classes at toy sample budgets
    -- is the wrong object for this test; what the source proposal's own
    numbers actually ask for is a TRANSITIVE group of order roughly 100-200
    acting on a fibre of size roughly 10-20, so that a toy-scale census can
    plausibly realize on the order of 100 distinct permutations, each near
    density 1/(group order), stressing the SAMPLING requirement (coupon-
    collector time over ~100 classes) in a regime none of the six tested
    battery members approach (their orders are at most 120, acting on
    fibres of size at most 5). A concrete candidate satisfying this: a
    degree-10 polynomial constructed to have Galois group PGL(2,9) (order
    720, acting 2-transitively on 10 points) is still too large for a toy
    census to realize a useful fraction of classes; a better-scaled
    candidate is the dihedral group D_50 (order 100) acting regularly on
    itself when realized as a degree-100 permutation representation is
    exactly what the original literal specification asked for and what this
    idea's `minimal_test` constructs directly as an ABSTRACT permutation
    group (not derived from a polynomial's splitting field at all), sidestepping
    the polynomial-construction cost entirely: sample Frobenius-like group
    elements directly from D_100 (order 200, acting on 100 points by its
    defining regular-adjacent action) via a fixed, disclosed pseudo-Frobenius
    rule, exactly mirroring how the existing battery's N3/N5 members already
    treat "realized subgroup order" as a comparator against a KNOWN density
    law rather than a literal generated-subgroup computation on a fixed
    fibre (H-MONO-59f6a6's own STEP 3 disclosed convention for N3/N5).
    DISCRIMINATION. The protocol's Step 5 verdict discipline predicts
    UNDECIDED at every tested k for this object, REGARDLESS of how closely
    the observed class-density histogram matches D_100's known law, because
    no independent inertia-derived lower bound L is available for an
    abstractly-sampled group with no algebro-geometric cover behind it (this
    is a stronger, more adversarial test of the "abstract object with no
    structural lower bound" case than the smaller-order N5 already tested,
    because with ~100 classes to realize, a naive observer could be tempted
    to read "we saw close to 100 distinct classes at close to uniform
    density" as evidence of fullness). CONFIRMS the protocol: UNDECIDED at
    every k, both bounds (U=order of the ambient permutation group on 100
    points, L=1) reported, even after the realized-class count and density
    histogram look convincingly complete. FALSIFIES the protocol (the
    single most consequential outcome, exactly as the smaller N5's own
    falsification condition was framed): a DECIDED verdict at any k --
    overclaiming, rejected outright regardless of how well the census
    performs otherwise.

  mechanism: >-
    Reuses H-MONO-59f6a6's own five-step protocol (STEP 1 structural upper
    bound; STEP 2 inertia lower bound, deliberately NOT derived here, exactly
    as for the existing N5, and recorded as trivial L=1 by design; STEP 3
    realized-class census; STEP 4 base-change ladder; STEP 5 verdict
    discipline) unmodified. The only new content is the object itself and the
    sampling convention needed to reach a genuinely large class count at toy
    compute.
    THE OBJECT. Fix an abstract transitive permutation group G acting on a
    set of size n=100 (candidate: the dihedral group of order 200 acting on
    its own 100-element "vertex" set via the standard degree-100
    representation, or -- more directly matching the "~100 classes each near
    density 1/100" language -- the REGULAR representation of a group of
    order 100, e.g. Z/100 or a non-abelian group of order 100, acting on
    itself by left multiplication, so that a census over G's own elements
    IS a census over its 100 realized permutations at density exactly 1/100
    each). Rather than deriving this group from a polynomial's Galois action
    (H-MONO-59f6a6's own STEP 1-4 pattern, which requires an inertia/
    branch-locus derivation this record deliberately declines, exactly as
    the tested N5 declined it), this record samples PSEUDO-FROBENIUS
    elements directly and deterministically from a fixed, disclosed rule
    (e.g., a linear congruential or modular-exponentiation map parametrized
    by a base-point index, chosen so the induced distribution over group
    elements is provably uniform by construction -- e.g. Frob(j) = g^j for a
    generator g of a cyclic group of order 100, or Frob(j) = the j-th element
    in a fixed enumeration of a non-abelian order-100 group under a
    disclosed multiplication table) -- so that the STRUCTURAL upper bound
    U is the full group of order 100 (or 200, whichever G is used) BY
    CONSTRUCTION, but NO inertia-derived independent lower bound is
    supplied, matching the existing N5's own design: the census can realize
    every class yet the protocol must still refuse to certify fullness,
    because "realizing many classes is never by itself a certificate of
    fullness" (H-MONO-59f6a6's own O5 obligation).
    THE COMPARATOR LAW. The predicted class-density histogram (uniform 1/100
    per class for the regular-representation choice, or the conjugacy-class-
    size law for a non-regular choice) is stated in closed form before any
    sample is drawn, exactly as N3/N5's Chebotarev-style comparator laws are
    in the parent record.
    WHY THIS IS A STRONGER TEST THAN THE ALREADY-TESTED N5. The existing N5
    (S_5, order 120, fibre size 5) has U/fibre-size = 24; a naive census
    realizing 5 distinct cycle types (the coarsest observable) could look
    complete quickly. This object has order-100-to-200 with 100 realized
    PERMUTATIONS as the observable granularity itself (not cycle types on a
    small fibre but distinct GROUP ELEMENTS on a 100-point set), so a
    coupon-collector argument requires materially more draws before every
    class is seen even once, and the temptation to read "we saw close to 100
    distinct outcomes, evenly spread" as completeness is stronger and more
    realistic than anything the existing battery tests.

  novelty_status: adaptation
  novelty_status_note: >-
    Grepped ledger/hypotheses/ and ledger/proposals/ for "literal N5" and
    "degree-100"; both hits are H-MONO-59f6a6 itself and its own source
    proposal IDEA-20260830-8a767e, neither of which executes this test (both
    explicitly name it as untested future work). The protocol, verdict
    discipline, and comparator-law convention are entirely inherited from
    H-MONO-59f6a6; this idea's only new content is the concrete abstract-
    group construction that reaches the literal ~100-class scale without
    requiring a polynomial/inertia derivation, and the argument for why this
    is a materially stronger adversarial test than the already-tested
    scoped-down substitute. Labelled `adaptation`.

  citations:
    - ref: H-MONO-59f6a6
      provenance: internal
      claim: >-
        Names the literal N5 ("a degree-100 sparse-class control... any
        construction with ~100 realized classes each of density ~1/100") as
        explicitly untested, scoped down for this session's battery to a
        uniformly random monic quintic (S_5, order 120) for a stated,
        disclosed feasibility reason (a group of order ~100 cannot act
        faithfully on a fibre of size <=8); states the O5 obligation that
        realizing many classes is never by itself a certificate of fullness;
        supplies the five-step protocol and Step 5 verdict discipline
        (DECIDED only when L=R_stab=U or R_stab=U outright; UNDECIDED
        otherwise, regardless of how well the census matches a plausible
        density law).
      verified_by: idea-generator (this session, read in full)
    - ref: IDEA-20260830-8a767e
      provenance: internal
      claim: >-
        Source proposal specifying the literal N5 object and its predicted
        density profile.
      verified_by: idea-generator (this session, read via H-MONO-59f6a6's
        own quotation of it; the source proposal file itself was not
        separately reopened this session)

  assumptions:
    - >-
      An abstractly-sampled permutation group (no polynomial or curve behind
      it) is an admissible battery member for THIS protocol, exactly as
      N3/N5 in the parent record already treat "realized subgroup order" as
      a comparator against a known density law rather than a literal
      generated-subgroup computation on a fixed labelled fibre.
    - >-
      The pseudo-Frobenius sampling rule (a disclosed deterministic map from
      a base-point index to a group element) produces a provably uniform
      distribution over the chosen group by construction, checkable
      symbolically before any sampling is interpreted.
    - >-
      p=211 (or any convenient toy prime) is used only to index the sampling
      rule if a modular map is chosen; the group being tested is abstract
      and does not depend on any elliptic curve or Semaev cover.

  proof_search_map:
    bottleneck: >-
      Whether the protocol's refusal discipline (Step 5) generalizes from
      the small, already-tested battery (max order 120, max fibre 5) to a
      genuinely larger, many-class object where the temptation to overclaim
      completeness from a dense-looking census is realistic rather than
      obviously premature.
    baseline_embedding:
      parameter_slice: >-
        The already-tested N5 (S_5, order 120) is the parameter slice this
        record must not contradict: both must return UNDECIDED at every k,
        by the identical Step 5 logic, with only the group order and fibre
        interpretation differing.
      reproduction_check: >-
        Re-run H-MONO-59f6a6's own N5 cell (the scoped-down S_5 quintic) as
        a hard gate before the new large-order object is interpreted; a
        mismatch with the already-committed UNDECIDED verdict means the
        protocol implementation, not the new object, has changed.
    observation_collision:
      observable: >-
        The realized-class density histogram as a function of sample size,
        for a group with no independently derivable inertia lower bound.
      distinct_preimage_search: >-
        FOUND, and it is the point: a dense, near-uniform histogram over
        ~100 classes is consistent BOTH with "this is the whole group and no
        larger structure exists" (which cannot be certified without an
        independent L) and with "this is a proper subgroup of some much
        larger ambient structure that a small sample cannot distinguish
        from completeness" -- the two are observationally identical at any
        finite sample size without an independent structural bound, which is
        exactly why the protocol must refuse rather than infer.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          An abstract, disclosed pseudo-Frobenius sampling rule over a
          group of order ~100-200, replacing a polynomial/inertia derivation
          entirely.
        predicted_gain: >-
          Reaches the literal ~100-class scale the source proposal specified
          at zero polynomial-construction cost, isolating the sampling/
          refusal-discipline question from the algebro-geometric derivation
          question the smaller battery members also test.
    quantifier_order: >-
      FOR this one large-order object and FOR EVERY tested k, THE PROTOCOL
      RETURNS UNDECIDED with both bounds reported, REGARDLESS of how densely
      the observed histogram matches the group's own known law. A single
      DECIDED verdict at any k falsifies the protocol outright, exactly as
      the smaller N5's own falsification condition states.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the protocol's refusal discipline holds on an object whose
        realized-class count is an order of magnitude larger than anything
        previously tested in this lane. Cannot certify anything about a
        genuine algebro-geometric cover of this size (no such cover is
        constructed here); cannot certify the protocol's behavior at group
        orders beyond a few hundred, where sampling cost itself becomes the
        binding constraint.
      nearby_object_control: >-
        The already-tested, smaller N5 (S_5, order 120) is the nearby-object
        control: both must return UNDECIDED under the identical Step 5
        logic, and any divergence in verdict between them (with everything
        else held constant) indicates the new object's scale, not the
        protocol's logic, is doing the work -- which would need to be
        reported and investigated rather than absorbed.
    proof_obligations:
      - claim: >-
          The pseudo-Frobenius sampling rule produces a provably uniform
          distribution over the chosen group.
        responsibility: correctness
      - claim: >-
          The already-tested S_5 N5 cell reproduces its committed UNDECIDED
          verdict under the same implementation.
        responsibility: baseline
      - claim: >-
          No inertia-derived lower bound is available or used for the new
          object (L=1 by design, exactly as for the existing N5).
        responsibility: strictness
      - claim: >-
          The protocol returns UNDECIDED at every tested k for the new
          object, regardless of realized-class density.
        responsibility: interface

  predictions:
    - metric: >-
        protocol verdict on the ~100-class object at every tested k
      direction: different
      minimum_effect: >-
        UNDECIDED at every k, with both bounds (U = the full ambient group
        order, L=1) reported. A DECIDED verdict at any k is overclaiming and
        must be rejected outright, regardless of the protocol's performance
        elsewhere -- this is the identical falsification standard the
        smaller N5 already carries.
    - metric: >-
        realized-class count and density spread as a function of sample
        size (coupon-collector curve)
      direction: higher
      minimum_effect: >-
        Materially slower convergence to "most classes seen" than any of
        the six already-tested battery members, quantitatively confirming
        this object stresses the sampling requirement in a regime the
        existing battery does not reach.
    - metric: >-
        reproduction of the already-committed S_5 N5 UNDECIDED verdict under
        the same implementation
      direction: same
      minimum_effect: >-
        Exact reproduction; any mismatch means the protocol implementation
        itself has drifted and the new object's result is uninterpretable
        until fixed.

  minimal_test:
    design: >-
      Stage 0 (zero compute): fix the abstract group (recommend the cyclic
      group Z/100 under its regular representation for the cleanest closed-
      form comparator: 100 realized elements, each density exactly 1/100,
      structural upper bound U=100), fix the deterministic pseudo-Frobenius
      sampling rule, and state the closed-form comparator law.
      Stage 1 (reproduction gate): re-run the existing S_5 N5 cell under the
      same protocol implementation and require exact reproduction of its
      committed UNDECIDED verdict.
      Stage 2 (the new measurement): sample pseudo-Frobenius elements at
      k=1..4 "ladder levels" (reusing the parent protocol's base-change-
      ladder framing even though no genuine field extension is involved --
      disclosed explicitly as a repurposing of the ladder machinery to a
      non-field-theoretic setting, which is itself checked for coherence in
      Stage 0) at sample sizes S in {200, 1000, 5000, 20000}, recording
      realized-class count and density spread at each S.
      Stage 3 (verdict): apply Step 5 exactly; report UNDECIDED with both
      bounds at every k/S combination.
      Stage 4 (sensitivity control): confirm the realized-class count at
      S=20000 sample size does not change if S is tripled (a stability
      check analogous to H-MONO-59f6a6's own tenfold-sample-size control).
    controls:
      - "Stage 1 reproduction gate (hard, must pass before Stage 2 is read)."
      - >-
        DECIDED-verdict tripwire: any DECIDED output at any stage
        immediately voids the record regardless of other results.
      - "Sample-size stability control (Stage 4)."
    required_metrics:
      - realized-class count and density histogram per sample size
      - protocol verdict (DECIDED/UNDECIDED) with both bounds, every k/S cell
      - reproduction result for the existing S_5 N5 cell

  falsification_conditions:
    - "A DECIDED verdict at any k or sample size for the new large-order object -- overclaiming, rejected outright."
    - "The existing S_5 N5 cell failing to reproduce its committed UNDECIDED verdict under the same implementation."
    - "The realized-class count at the largest tested sample size changing materially when the sample size is tripled (sampling instability, voids the stability reading)."

  confounders:
    - >-
      THE LADDER MACHINERY IS REPURPOSED, NOT GENUINE. No field extension
      exists behind this abstract object; the "k" levels are a disclosed
      relabelling of increasing sample-size tiers, not genuine base-change
      steps. This must not be mistaken for a field-theoretic result and is
      stated as a repurposing, not a discovery, in every report.
    - >-
      GROUP CHOICE IS ARBITRARY. Z/100's regular representation is the
      cleanest choice for a closed-form comparator but is not the only
      construction matching the source proposal's "~100 classes, density
      ~1/100" language; a non-abelian order-100 or order-200 group would
      also qualify and might behave differently under sampling. This idea
      tests one concrete instantiation, not the whole family.
    - >-
      SAMPLING COST GROWS WITH GROUP ORDER. At order ~100-200 the coupon-
      collector requirement is already materially larger than the existing
      battery; scaling this construction further (toward literal
      cryptographic-scale monodromy groups) would require sample sizes this
      toy-scale design does not test.

  interpretation_limits:
    - "TOOLING/PROTOCOL claim only; no curve, monodromy, or relation-rate content."
    - "NO ECDLP CLAIM OF ANY KIND, in either direction."
    - >-
      Passing this test does not certify the protocol at cryptographic-scale
      group orders (thousands to millions of classes); it only extends the
      tested range from ~120 to ~100-200 with a materially larger observable
      granularity.
    - "NO STATUS CHANGE to H-MONO-59f6a6 or any other record is proposed or implied (Coordinator authority alone, AGENTS.md rule 1)."

  heuristic_assumptions:
    - id: H1
      statement: >-
        The disclosed pseudo-Frobenius sampling rule produces i.i.d. uniform
        draws over the chosen group's elements, so the realized-class
        density histogram converges to the group's own known law as sample
        size grows.
      rigorous_support: >-
        For the recommended construction (Z/100 under g^j for a generator g
        and j drawn uniformly from a large index range reduced mod 100),
        uniformity is exact by elementary group theory (a generator's powers
        cycle through every element exactly once per period), not merely
        heuristic; stated as a heuristic assumption only because the
        SAMPLING of the index j itself (e.g. via a linear congruential
        generator) must be checked for statistical uniformity mod 100,
        which is the actual gap.
      validation_plan: >-
        Chi-square goodness-of-fit test of the realized-class histogram
        against the uniform law at each sample size in {200,1000,5000,20000};
        tail check on the single least-realized class at the largest sample
        size.
      falsification_condition: >-
        A chi-square test rejecting uniformity at the 1% level at the
        largest tested sample size, indicating the sampling rule itself is
        biased.

  target_complexity:
    time_exponent: "NOT APPLICABLE; no algorithm or attack is proposed."
    memory_exponent: "O(1) beyond a 100-200 entry class-count table."
    best_known: "Not applicable; no ECDLP complexity claim of any kind."
    hidden_overhead: "None; sampling cost is stated explicitly per stage."
    tradeoff_note: not applicable.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: low

  priority_rationale: >-
    Purely a tooling/protocol validation extension, not exponent-moving and
    not curve-specific; explicitly lower priority than the p=1009 census
    extension and the Fisher-combined sensitivity control, both of which
    bear more directly on already-`supported` substantive claims. Retained
    as a proposal because it closes a specifically-named, cheap, previously-
    deferred backlog item and its failure mode (a DECIDED verdict on a
    large-order object) would be a serious, immediately actionable finding
    about the protocol's own soundness.

