  question_id: RQ-MLKEM-001
  added: '2026-08-07'
  title: 'Seven lattice goals rest on MLWE hardness and none prices the quantum reduction route:
    KN-OPEN-8a5965''s Q2 -- does the DCP -> LWE chain REACH concrete Module-LWE parameters --
    is answerable from Regev, BKSW and IP-M-EDCP independently of whether Simon''s proof stands,
    and no record frames it'
  class: cost-model
  claim: 'KN-OPEN-8a5965 (added 2026-08-06) records Simon''s claimed polynomial-time DCP algorithm
    and splits it into Q1 (is the proof correct -- six enumerated checkable sub-questions, Lemma
    3''s signed-amplitude cancellation being load-bearing) and Q2 (does the consequence reach
    ML-KEM / ML-DSA). Its own ''Why it matters'' states that GOAL-MLKEM-001..005 and GOAL-MLDSA-001..002
    all rest on MLWE hardness and this is the first claim since Chen 2024 that would change their
    threat model at the root. It is referenced by ZERO ledger records; KN-TECH-d1bc4f (dihedral
    coset problem as the quantum route to lattices, noise tolerance) is cited by zero ledger records;
    and a keyword search of all 278 IDEA-* records for ''dihedral'' or ''DCP'' returns nothing.
    Q2 IS A REDUCTION-REACH QUESTION INDEPENDENT OF Q1 and nobody has framed it. The entry itself
    flags three specific gaps: the stated ''alpha = sqrt(n) polylog(n)'' does not parse in the
    convention where alpha is a ratio in (0,1) so ''the LWE regime actually covered is unknown'';
    the bridge from unstructured LWE to Module-LWE at fixed small rank runs through IP-M-EDCP
    and ''is unaddressed''; and Q = k*n^{c+1} with c >= 12 is simultaneously polynomial and astronomically
    impractical.'
  mechanism: Pin down, from Regev 2004 (KN-LIT-21383c), BKSW (KN-LIT-4706) and IP-M-EDCP (KN-LIT-1744)
    DIRECTLY and independently of Simon's correctness, what LWE regime the DCP -> LWE reduction
    chain delivers under each normalisation convention, and whether it passes through MODULE structure
    at rank k = 2, 3, 4 with q = 3329. The deliverable is a statement of the form 'even granting
    the claim, the reached regime is X and FIPS 203 sits at Y' -- a CONDITIONAL REACH MAP, not
    a verdict on the preprint.
