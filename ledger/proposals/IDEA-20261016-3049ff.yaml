idea:
  id: IDEA-20261016-3049ff
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Generator-parametrized finder for exact dependent lifts: search the point
    H with (P,Q)=(bH,-aH) instead of the pair, and price integrality of
    multiples
  class: algorithm
  claim: >-
    For a live arm (IDEA-20261016-6ad2a5) and admissible coprime (a,b) with aP^+bQ^=O, every
    exact torsion-free dependent lift (aP+bQ=O in E(Q), integral model) has
    (P,Q)=(bH,-aH) with H=vP-uQ (bv+au=1), H integral, and H reduces to the
    UNIQUE point H^=v*P^-u*Q^ of E^(F_p). The dependent set is therefore the
    image of a 3-parameter family (x_H=x^+p*i, y_H=y^+p*j, A=-1+p*k; B fixed
    by the curve equation when x_H | y_H^2) rather than the 4-parameter pair
    family (s,t,w,z) of the frozen design. P,Q integral forces H, aH, bH
    integral: dependence in an integer box is exactly the phenomenon of an
    integral point with integral multiples, which Ingram's theorem makes
    sparse (for minimal models, at most one integral [n]H with n>C(Tamagawa)).
    Prediction: the finder reproduces every dependent cell that exhaustive
    pair enumeration finds on a common sub-box, at >=100x fewer evaluations
    per cell found; it is a witness search, not a nonexistence proof.
  mechanism: >-
    PAIR: representation = generator coordinates H (a lift of a known F_p
    point) instead of pair coordinates; operation set = [b] and [-a] on E(Q),
    exact rational arithmetic. TRICHOTOMY: branching-free partial-action
    (H^ determined; only the integral lifts of H^ branch). LOSSY-PROJECTION
    TEST: (P,Q)->H is lossy only by the common factor (gcd=1 so none): this is
    a change of coordinates on the dependent locus, which is exactly why it
    prunes the search; the loss is in the box, not the object. Heights:
    h(P)=b^2 h^(H) + O(1), so a box for P of side X corresponds to a smaller
    box for H, but the O(1) is curve dependent (coefficients up to ~1e7), so
    the H-box (I,J,K) is a frozen cap, not a derived bound.
