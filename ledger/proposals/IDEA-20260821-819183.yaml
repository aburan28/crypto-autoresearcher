  assumptions:
    - >-
      That SPEC Eq. (13) can be re-read from the primary PDF and image-verified.
      If it cannot, S2 and S3 are not computable and Stage 4 returns
      BRANCH-BLOCKED. This is an infrastructure outcome under AGENTS.md rule 3
      and is never reported as a mathematical finding.
    - >-
      That |k| and |salt| are readable from SPEC. |k| IS THE DETERMINING INPUT:
      the repair of 2026-08-24 shows k_dom is affine in |k| with slope -1, so a
      128-bit change in |k| is a 128-bit change in the headline. |salt| in
      particular is a 2025-revision quantity this program has never transcribed,
      and it enters only T1, which the repair shows is never the maximum for
      q_RO >= 1.
    - >-
      That the four summands of Eq. (13) are the complete right-hand side. If
      the extraction-damaged rendering omitted a term, every S2/S3 number is
      void and the gate is Stage 0.
    - >-
      That T4, the DQCSD term, has no numeric value available to this program.
      It is carried symbolically and excluded from every ordering. THE
      CONSEQUENCE IS STATED RATHER THAN HIDDEN: every k_dom and k_vac here is a
      statement about the COMPUTABLE part of Theorem 6.3, and T4 could exceed
      all three computable terms without this method seeing it.
    - >-
      That evaluating a published bound is not the same as endorsing its
      tightness. No claim is made that Theorem 6.3 is tight; a loose bound with
      a large k_dom is exactly as much a reason to deprioritise the DFR lane
      under THAT bound, and exactly as little a statement about HQC's real
      security, and both halves of that sentence are reported.
    - >-
      That the (q_RO, q_D) grid is declared before Stage 3 runs and is reported
      in full including cells where nothing interesting happens - while
      acknowledging, per the repair, that the grid moves k_vac and the
      T3-versus-T1 comparison but moves k_dom by under one bit.

