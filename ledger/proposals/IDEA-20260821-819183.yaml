      record asserted that no such computation existed, which was false and was
      contradicted by a record its own novelty screen had listed.
    - >-
      coordination/goals/GOAL-HQC-001/batches/BATCH-002/tasks/TASK-20260802-15971b/a17_sensitivity.yaml
      ALREADY CONTAINS the X1/X3 fork sensitivity this record proposed to carry:
      the Prop 6.1.3-versus-6.1.4 gap at 10.61 / 7.96 / 16.79 bits, and the
      statement that A17 enters Theorem 6.3 transitively and LINEARLY through
      (q_RO + q_D) * delta. What it does NOT contain is the comparison of that
      term against T1 and T2, i.e. k_dom, nor k_vac. ADDED BY REPAIR 2026-08-24.
    - >-
      IDEA-20260801-011 measures the DFR at reduced parameters against the
      model's prediction. That answers "is the model right". This answers "how
      wrong may it be before anything downstream changes", which is a different
      question with a different answer, is computable without any measurement,
      and is a PRECONDITION for pricing 011's result: a measured discrepancy of
      j bits means nothing until k_dom is known.
    - >-
      IDEA-20260805-15258a predicts per-key DFR dispersion driven by the secret
      support's additive energy, and observes that Theorem 6.3 multiplies a
      single averaged delta by (q_RO + q_D). It proposes to measure the
      dispersion. This proposal evaluates the bound and does not measure
      anything; it is silent about per-key structure and would be run unchanged
      if the per-key spread were exactly zero. The two compose: 15258a supplies a
      candidate magnitude for one model error, and this supplies the threshold
      that magnitude must clear.
    - >-
      IDEA-20260808-d21021 defines alpha(beta), the ratio between the worst-case
      correctness the HHK argument wants and the average section 6.1 computes,
      and proposes an adversarially steerable ciphertext dial that raises the
      conditional failure rate. That is a claim about the NUMERATOR delta. This
      is a claim about the DENOMINATOR - the margin the bound has - and the two
      multiply rather than overlap. d21021's alpha is exactly one of the named
      model errors Stage 4 sets against k_dom.
    - >-
      IDEA-20260816-3949c8 tracks the whole map from message to failure
      probability and measures its spread, using a Frodo-shaped unstructured
      encoding where translation invariance predicts a flat map. Its object is a
      MAP and its instrument is a measurement in a different scheme's geometry;
      this object is a three-term inequality at HQC's own parameters and its
      instrument is exact rational arithmetic. Neither can substitute for the
      other.
    - >-
      IDEA-20260808-9f9ed8 produces a two-sided BRACKET on delta and states that
      its value enters through (q_RO + q_D) . delta. A bracket's WIDTH and a
      bound's SLACK are different quantities: a 3-bit bracket is decisive if
      k_dom is 1 bit and irrelevant if k_dom is 60. 9f9ed8 does not compute
      k_dom, and this does not compute a bracket.
    - >-
      IDEA-20260808-5d8b39 factorises the 3.4e41-trial measurement barrier into
      factors measurable at deployed parameters. That is an instrument-design
      claim about how to MEASURE the DFR. This is an arithmetic claim about what
      the measured value would be worth.

