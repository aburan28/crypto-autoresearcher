    results: >-
      IN-CORPUS, CORRECTED BY REPAIR 2026-08-24. THE ORIGINAL PARAGRAPH SAID, IN
      CAPITALS, "NO RECORD IN THIS REPOSITORY COMPUTES THEOREM 6.1'S BOUND
      VALUE, ITS SLACK AGAINST THE DESIGN TARGET, OR WHICH SUMMAND OF THEOREM
      6.3 DOMINATES AT HQC'S PARAMETERS". THE FIRST TWO THIRDS OF THAT SENTENCE
      ARE FALSE and the record's own screen had returned the refuting evidence.
      WHAT ACTUALLY EXISTS: (i) ledger/evidence/EV-HQC-9906b9.yaml observation
      O-3 records "Theorem 6.1 yields 2^-132.86 / 2^-193.88 / 2^-260.51 against
      targets 2^-128 / 2^-192 / 2^-256", from TASK-20260802-73a352's
      exact-rational recomputation of the full chain - that is S1's bound value
      beside the design target at all three levels, with the slack one
      subtraction away (4.86 / 1.88 / 4.51 bits); (ii)
      coordination/goals/GOAL-HQC-001/batches/BATCH-002/tasks/TASK-20260802-15971b/a17_sensitivity.yaml,
      headed "DUTY 3 -- sensitivity of HQC's published DFR bound to a failure of
      assumption A17", carries Theorem 6.1 at all three levels, gives the
      Prop 6.1.3-versus-6.1.4 fork gap as 10.61 / 7.96 / 16.79 bits at
      HQC-1/3/5, and states that the dependence propagates into "SPEC Theorem
      6.3 (IND-CCA2) -- transitively and LINEARLY, through the additive term
      (q_RO + q_D) * delta".
      WHAT REMAINS ABSENT, AND IS THE REDUCED CONTRIBUTION: no record computes
      the TERM ORDERING of Theorem 6.3 (k_dom) or the distance to vacuity
      (k_vac), and no record records |k| or |salt|.
      The six records that touch (q_RO + q_D) . delta still evaluate none of it.
      IDEA-20260805-15258a observes that Definition 6.2.1 takes an expectation
      over keys and that reading the result as a per-key guarantee needs an
      unstated assumption A24; it computes no term. IDEA-20260808-d21021 defines
      alpha(beta) as the ratio between the worst-case-over-messages delta the
      HHK bound wants and the average delta section 6.1 computes; it computes no
      term either, and its "best_known_baseline" quotes the DESIGN TARGETS
      2^-128/-192/-256 rather than Theorem 6.1's actual bound value.
      IDEA-20260808-9f9ed8 and IDEA-20260808-cbb848 mention the term only in
      target_complexity prose, to say that their bracket or sign enters through
      it. IDEA-20260816-3949c8 tracks the whole map from message to failure
      probability and measures its SPREAD in a Frodo-shaped encoding - a
      different object (dispersion of a map) in a different scheme's geometry.
      IDEA-20260801-011 contains none of the sensitivity vocabulary at all.
      EXTERNAL. Two 2025-2026 results bear directly on the model errors this
      proposal prices, and both were found and read at abstract level this
      session: Bombar-Resch-Wiedijk (arXiv:2501.02626) "uncover cases where this
      modeling fails" for the coordinate-independence assumption; Annechini-
      Barenghi-Pelosi (eprint 2026/795) report a closed-form DFR model with the
      independence assumption removed and conclude "HQC's current decoding
      failure rates are lower than the required ones". NEITHER computes the
      sensitivity of the IND-CCA2 bound to a wrong delta, on the evidence
      available to this session - but this session read only abstracts and
      landing pages, so that statement is a statement about what I read, not
      about what those papers contain.
    verdict: >-
      UNVERIFIED, and that is the honest label rather than a hedge: no full text
      of any external paper was read. CLAIMED NEW RELATIVE TO THIS REPOSITORY,
      RE-SCOPED BY REPAIR 2026-08-24: k_dom and k_vac and the frozen decision
      rule that reads them - THAT IS ALL. s(L) IS NOT CLAIMED: it exists at
      EV-HQC-9906b9 O-3 via TASK-20260802-73a352, and the X1/X3 fork gap exists
      at TASK-20260802-15971b. ASSEMBLED FROM KNOWN PARTS AND CLAIMED NOVEL IN
      NONE OF THEM: Theorem 6.1 and Theorem 6.3 are SPEC's; the numbered
      assumptions and anomalies are the BATCH-001 transcription's; evaluating a
      published bound on a grid is not an invention. A FURTHER HONEST REDUCTION,
      RECORDED IN THE REPAIR: k_dom turns out to be an affine function of |k|
      with slope -1 and an intercept fixed by the committed delta, and that
      function is now WRITTEN OUT in claim (B), so the remaining computational
      content of S2 is a fixture check on an identity plus Stage 0's reading of
      |k| and |salt|. The genuinely open computation is k_vac.
      EXPOSURE: the single most likely way this is already known is that HQC's
      designers performed exactly this sensitivity analysis when choosing
      parameters and simply did not print it, in which case the deliverable is a
      reproduction - which is still the number RQ-HQC-001 asks for and still
      does not exist here.

  object_first_candidate:
    tracked_object: >-
      The TERM VECTOR of Theorem 6.3 evaluated at a given (level, |k|, q_RO,
      q_D) - CORRECTED BY REPAIR 2026-08-24 from an ordered 4-tuple, one of
      whose coordinates has no numeric value, to an ordered TRIPLE OF COMPUTABLE
      RATIONALS (T1, T2, T3) CARRIED ALONGSIDE A DECLARED SYMBOLIC SLOT T4 that
      is never evaluated and never enters an ordering. The object followed
      through the computation is not the DFR and not the advantage, but the
      DECOMPOSITION of the computable part: which of T1, T2, T3 carries it, and
      how far T3 is from carrying it. The symbolic slot is retained rather than
      dropped because dropping it would let a reader mistake "T3 dominates the
      computable terms" for "T3 dominates the bound", which is the error the
      exclusion is recorded to prevent.
    lossiness: >-
      GENUINELY AND SEVERELY LOSSY, in the direction that matters. The
      underlying state is the entire IND-CCA2 security game - an adversary, a
      key, a query transcript, a reduction. The projection keeps three rational
      numbers and one symbol, and discards the adversary, the reduction's
      tightness, the game's structure, and every property of HQC except five
      integers per level. What it discards is discarded COMPATIBLY with the
      operation the object must survive, namely "delta changes": each computable
      summand is either constant in delta (T1, T2) or linear in delta (T3), so
      the whole triple propagates deterministically under a perturbation of
      delta, and the ordering of the computable terms - which is the retained
      content - propagates with it. T4 propagates too, trivially: it is constant
      in delta, which is exactly why excluding it costs nothing for the
      PROPAGATION and everything for the INTERPRETATION. That is precisely the
      lossy-projection test of inventor-protocol section 2: the projection is
      not a change of coordinates, because the triple cannot be inverted to
      recover the bound's proof, the scheme, or the adversary, and yet the
      question asked ("how far can delta move before the ordering of the
      computable terms changes") is answerable entirely inside the projection.
    propagation: >-
      One step of the target operation is "multiply delta by 2^j". Under it, T3
      scales by 2^j and T1, T2, T4 are fixed, so the term vector's trajectory is
      an explicit line in log coordinates and the crossing point with each other
      computable term is a closed-form j - written out in claim (B) as
      k_dom = c(q) - |k| - log2 delta(L). The one-step propagation law is
      therefore exactly writable and exactly measurable, which is what inventor-
      protocol section 1 demands of a candidate object. The crossing with T4 is
      NOT writable, and that is the boundary of the object.
    survival_score: >-
      Survives exactly as far as Theorem 6.3 is the operative statement and as
      far as T4 can be left symbolic, and no further. It dissolves the moment the
      question becomes per-key, worst-case-over-messages, or multi-target,
      because those are quantities Theorem 6.3 does not contain - and naming that
      dissolution point is half the deliverable, because it says where
      IDEA-20260805-15258a's and IDEA-20260808-d21021's objects take over from
      this one. It dissolves a second time, and sooner, if T4 is ever large: the
      triple then describes a strict subset of the bound and its ordering is not
      the bound's ordering.

  null_object_control: >-
    TWO DEGENERATE ARMS WITH FORCED VALUES DERIVED BEFORE THE RUN, A GRADED
    LADDER WITH A FORCED SIGN CHANGE, AND A NULL-FIRST VERDICT, per
    KN-TECH-1a5b7e - REVISED BY REPAIR 2026-08-24 BECAUSE THE ORIGINAL PAIR DOES
    NOT DISCRIMINATE AT THE LIKELY |k|.
    NULL-DEG-A: set delta_e := n_e (the outer code corrects every symbol).
    Theorem 6.1's tail sum_{l=n_e+1}^{n_e} is EMPTY, so the bound is EXACTLY 0
    and s(L) must be reported as +infinity, k_dom as +infinity, and T3 must
    vanish for every (q_RO, q_D). FORCED VALUE: 0, exactly, in rationals. THIS
    IS THE ARM THAT CARRIES THE CONTRAST, because it is forced to BRANCH-CLOSE
    whatever |k| turns out to be.
    NULL-DEG-B: set delta_e := 0. The bound is EXACTLY 1 - (1 - p_i)^{n_e},
    which at HQC-1's p_i is of order n_e . p_i, i.e. about 2^{-5.3} using Table
    11's -10.79 and n_e = 46, so s(L) must be large and negative and T3 must
    dominate T1 and T2 at every grid cell. FORCED VALUE: computable in closed
    form and written down before the run; under the affine law of claim (B),
    k_dom(NULL-DEG-B, HQC-1) = c(q) - |k| + 5.3, i.e. about -249 bits at
    |k| = 256. DISCLOSED LIMITATION, FOUND IN REPAIR: at |k| >= 135 the REAL
    HQC-1 cells also have k_dom < 0 (about -122 at |k| = 256), so NULL-DEG-B and
    the real cells receive the SAME BRANCH and this arm discriminates on
    MAGNITUDE only, not on branch. The two are separated by about 127 bits and
    that separation is what is reported; the branch verdict is NOT read off this
    arm alone.
    GRADED ARM WITH A FORCED SIGN CHANGE (the arm that supplies direction):
    delta_e over {0, 4, 8, 12, 15, 20, 30, n_e}. k_dom is strictly increasing in
    delta_e, runs from about -249 bits at delta_e = 0 to +infinity at
    delta_e = n_e, and must therefore cross zero EXACTLY ONCE, at a point
    delta_e*(L, |k|) the package reports. Zero crossings, more than one
    crossing, or non-monotonicity is an arithmetic defect and never a finding.
    THIS ARM CAN FAIL in three distinct ways and its failure localises the fault
    to the summation limits, the log conversion, or the affine law.
    WHY THESE CAN FAIL, WHICH IS THE POINT: all arms are evaluated by the SAME
    code path as the real cells, with only delta_e changed. An off-by-one in the
    summation limit, a floating-point substitution for exact rationals, a
    mis-transcribed n_e, or a sign error in the log conversion each produces a
    wrong value on at least one arm. A pipeline that returns anything other than
    exactly 0 on NULL-DEG-A is not evaluating Theorem 6.1.
    COMPARATOR SPREAD IS NOT ZERO: the two degenerate arms differ from each
    other by the entire dynamic range of the statistic (from +infinity to about
    -249 bits), so the statistic provably moves when the object is removed -
    obligation 3 is met with both ends of the range exhibited, and the delta_e
    ladder supplies at least three interior points so that MONOTONICITY IN
    delta_e is reported rather than assumed.
    NULL-FIRST VERDICT: the frozen four-branch decision rule of Stage 4 is
    emitted on NULL-DEG-A and NULL-DEG-B before any real cell is read. If it
    emits the same branch on BOTH degenerate arms as on the real cells, it
    discriminates nothing and is rewritten. The repair records in advance that
    NULL-DEG-B alone is expected to share the real cells' branch, so the check
    is passed by NULL-DEG-A and by the crossing point, not by NULL-DEG-B.

