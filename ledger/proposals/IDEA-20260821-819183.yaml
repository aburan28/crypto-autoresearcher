idea:
  id: IDEA-20260821-819183
  question_id: RQ-HQC-001
  added: '2026-08-21'
  title: >-
    How many orders of magnitude may HQC's decoding failure rate be wrong before
    ANYTHING in its IND-CCA2 bound moves? Compute Theorem 6.3 term by term and
    Theorem 6.1's slack against its own design target at HQC-1/3/5, in exact
    rationals, and let the answer decide whether this lane can produce a
    security-relevant result at all - with the closure written either way
  class: control

  claim: >-
    (A) THE NUMBER THE RESEARCH QUESTION ASKS FOR DOES NOT EXIST. RQ-HQC-001
    names as its second target "sensitivity of the IND-CCA argument to a DFR
    that is wrong by k orders of magnitude". After six closed batches
    (BATCH-001, 002, 003, 6fddee, c5703d, 0a65c0) plus BATCH-91929e and
    BATCH-dd0901, and after twenty filed proposals in this lane, THIS CORPUS
    CONTAINS NO VALUE OF k. Every DFR record in the lane measures or brackets
    delta; none asks how much delta must move before the bound it feeds
    changes. That is not a hard question - it is a few lines of exact
    arithmetic on quantities the BATCH-001 transcription already carries - and
    the fact that it has not been asked is the reason a lane with eighteen
    DFR-side proposals still cannot say whether its own headline matters.

    (B) THE THREE QUANTITIES, MADE CONCRETE. All are exact rationals computable
    from SPEC's own formulas as transcribed in
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md.
    S1, MODEL SLACK: s(L) = log2(2^{-lambda(L)}) - log2(DFR_bound(L)) at each
    security level L, where DFR_bound is Theorem 6.1's binomial tail
    sum_{l=delta_e+1}^{n_e} C(n_e,l) p_i^l (1-p_i)^{n_e-l} evaluated with p_i
    from Prop 6.1.3 (and separately 6.1.4) at that level's p*, and lambda(L) is
    the level's declared DFR exponent from SPEC Table 5 (128 / 192 / 256). s(L)
    is the number of bits of pure model error the DESIGN TARGET absorbs before
    the design target itself is violated.
    S2, TERM DOMINANCE: Theorem 6.3 bounds the IND-CCA2 advantage by a sum of
    four terms - 1/(2^{|k|} 2^{|salt|}), 3 q_RO / 2^{|k|}, (q_RO + q_D) . delta,
    and 2(Adv_2-DQCSD-P + Adv_3-DQCSD-PT). For each level and each (q_RO, q_D)
    on a declared grid spanning the query budgets NIST's security categories
    admit, compute WHICH SUMMAND IS LARGEST and by how many bits delta must
    grow before (q_RO + q_D) . delta overtakes the largest generic term. Call
    that k_dom(L, q_RO, q_D).
    S3, VACUITY: how many bits delta must grow before the whole right-hand side
    of Theorem 6.3 exceeds a declared threshold - reported at 2^-64, 2^-32 and
    1. Call that k_vac(L, q_RO, q_D).

    (C) THE DECISION CONTENT, DECLARED BEFORE THE ARITHMETIC. Set beside
    k_dom and k_vac the plausible magnitude of every named model error this
    program and the external literature have identified: A5's coordinate
    independence (Bombar-Resch-Wiedijk 2025 exhibit cases where it fails;
    Annechini-Barenghi-Pelosi 2026 report a closed-form independence-free model
    concluding HQC's DFRs are LOWER than required), A17's block independence
    (EV-HQC-b71230 measured anti-correlation at every order 2..18 on one
    reduced parameter set), the union-bound slack in Prop 6.1.3 (SPEC Table 11
    reports predicted -10.79 against observed -10.96 at NIST-1, i.e. about 0.17
    bits), and the deployed biased sampler (SPEC section 6.2.3's (tau^{w_r}_max)^3
    with tau_max = 1.00015 at NIST-1). IF NO NAMED ERROR'S PLAUSIBLE RANGE
    REACHES k_dom AT ANY LEVEL, this proposal delivers a CLOSURE at the
    inventor-protocol section 4 standard: a named obstruction (the FO bound's
    generic terms dominate the DFR term by k_dom bits), an argument (the
    arithmetic, in exact rationals, reproducible), and forward guidance (the
    lane's remaining value is in per-key and worst-case-over-messages
    quantities, which are NOT the delta Theorem 6.3 consumes, and in the ISD
    flank). IF s(HQC-1) IS SMALL - a handful of bits - the opposite conclusion
    follows with equal force and the DFR flank is the highest-value lane in
    this program, which is also a result and is also decided by the same
    arithmetic.

    (D) WHAT IS NOT CLAIMED. No attack. No statement that Theorem 6.3 is wrong,
    loose, or tight - it is evaluated, not audited. No statement that HQC is
    weak or strong. No measurement of any DFR. The output is a table of
    exponents and a decision rule applied to it. Nothing here is a statement
    about a standardized parameter set's security; it is a statement about the
    arithmetic of a published bound at published parameters, which is a MODEL
    claim and carries RQ-HQC-001's toy claim-tier ceiling unchanged.

  mechanism: >-
    STAGE 0 (READING, ZERO COMPUTE). Re-read SPEC Table 5 and SPEC Eq. (13)
    from the primary PDF. Eq. (13) is marked [EXTRACTION-DAMAGED] in the
    BATCH-001 transcription and was never image-verified; every S2 and S3
    number depends on its term structure and on |k| and |salt|, so nothing
    downstream may be computed until it is read from a rendered page. RECORD
    |salt| EXPLICITLY: it is a 2025-revision quantity (the salted SFO^perp_m
    transform), it appears in the first summand, and this program has never
    transcribed its value. Also resolve anomaly X3 (three inconsistent
    cross-references to whether p_i is Prop 6.1.3's or 6.1.4's) by carrying
    BOTH readings as declared forks, exactly as IDEA-20260805-baa4da carries
    the W = 2w / W = w fork.

    STAGE 1 (FIXTURE, SECONDS). Re-derive p_tilde from Prop 6.1.1 and p* from
    Prop 6.1.2 in exact rationals at all three levels, from the parameter
    triples, WITHOUT reading Table 9's printed 0.3398. Then evaluate Prop 6.1.3
    and Prop 6.1.4 and require them to reproduce SPEC Table 11's -10.79 /
    -14.14 / -11.30 to within the rounding of the printed p* values. THIS IS A
    HARD GATE: if the fixture does not reproduce, no S1/S2/S3 number is
    reported in either direction, because the pipeline is then not evaluating
    the published model. The corpus already carries one printed-value defect in
    the neighbouring table (RS-S3's minimum distance, CORR-20260802-3ae664),
    which is why the re-derivation is from definitions and not from print.

    STAGE 2 (S1, SECONDS). Evaluate Theorem 6.1's tail in exact rationals at
    all three levels under both X1 readings of Prop 6.1.3's exponent and under
    both p_i sources. Report s(L) as a table with one row per (level, reading,
    p_i source). The tail is dominated by its first term l = delta_e + 1, so
    also report the first-term-only value and the ratio to the full tail: if
    the ratio is essentially 1, then HQC's entire DFR budget at that level
    rests on the probability that a SPECIFIC set of delta_e + 1 inner blocks
    all fail, and that sentence - with its number - is itself a deliverable
    that reframes what the lane's joint-moment work is measuring.

    STAGE 3 (S2 AND S3, SECONDS). Evaluate the four summands of Eq. (13) over a
    declared grid of (q_RO, q_D). The grid is fixed before the run and is
    reported in full, because a sensitivity table evaluated on a grid chosen
    after seeing which cells are interesting is a fit. Report k_dom and k_vac
    per cell. Report ALSO the value of the bound at delta as published, so a
    reader can see what Theorem 6.3 actually guarantees at HQC's parameters
    rather than what the parameter names suggest.

    STAGE 4 (THE DECISION, WRITTEN BEFORE STAGE 3 RUNS). A frozen rule with
    four branches and an explicit NEITHER, applied first to the null arm of
    Stage 5. BRANCH-CLOSE: every named model error's plausible range is below
    k_dom at every level and every grid cell - record the closure with its
    obstruction block. BRANCH-LIVE: some named error's range reaches k_dom at
    some level - name the level, the error, and the margin, and the lane
    continues with a target. BRANCH-SPLIT: the answer differs across levels
    (the likely case, since NIST-5's inner DFR is reported WORSE than NIST-3's
    at -11.30 against -14.14 while its budget is 64 bits smaller) - report per
    level and do not average. BRANCH-BLOCKED: Stage 0 cannot resolve Eq. (13)
    or |salt| from the primary source - an infrastructure outcome under
    AGENTS.md rule 3, never a mathematical one, and the package reports S1 only.

    STAGE 5 (THE NULL, RUN AND READ FIRST). Two degenerate parameter sets whose
    answers are forced: delta_e := n_e, where Theorem 6.1's tail is EXACTLY 0
    and s(L) must be reported as +infinity; and delta_e := 0, where the tail is
    exactly 1 - (1 - p_i)^{n_e} and s(L) must be large and NEGATIVE. A pipeline
    that does not return those two values exactly is arithmetically broken and
    no other cell is reportable. The frozen decision rule is emitted on both
    degenerate cells before any real cell is read; if it emits the same branch
    on a degenerate cell as on a real one, the rule discriminates nothing and
    is rewritten before the real arm is looked at (KN-TECH-1a5b7e mode 4,
    null-first check).

