idea:
  id: IDEA-20260821-819183
  question_id: RQ-HQC-001
  added: '2026-08-21'
  title: >-
    How many orders of magnitude may HQC's decoding failure rate be wrong before
    ANYTHING in its IND-CCA2 bound moves? Compute Theorem 6.3 term by term and
    Theorem 6.1's slack against its own design target at HQC-1/3/5, in exact
    rationals, and let the answer decide whether this lane can produce a
    security-relevant result at all - with the closure written either way
  class: control

  claim: >-
    (A) WHAT THE RESEARCH QUESTION ASKS FOR, AND WHAT THIS CORPUS ALREADY HAS.
    RQ-HQC-001 names as its second target "sensitivity of the IND-CCA argument
    to a DFR that is wrong by k orders of magnitude".
    CORRECTED BY REPAIR (2026-08-24), BECAUSE THIS RECORD ORIGINALLY ASSERTED
    THE OPPOSITE: S1 BELOW IS NOT NEW AND THIS RECORD MAY NOT CLAIM IT.
    ledger/evidence/EV-HQC-9906b9.yaml observation O-3 already records, from
    TASK-20260802-73a352's exact-rational recomputation, that "Theorem 6.1
    yields 2^-132.86 / 2^-193.88 / 2^-260.51 against targets 2^-128 / 2^-192 /
    2^-256" - the bound value beside the design target at all three levels,
    with the slack s(L) = 4.86 / 1.88 / 4.51 bits one subtraction away. The
    X1/X3 fork this record proposed to carry also already exists:
    coordination/goals/GOAL-HQC-001/batches/BATCH-002/tasks/TASK-20260802-15971b/a17_sensitivity.yaml
    ("DUTY 3 -- sensitivity of HQC's published DFR bound") records the Prop
    6.1.3-versus-6.1.4 gap as 10.61 / 7.96 / 16.79 bits at HQC-1/3/5 and states
    that A17 propagates into "SPEC Theorem 6.3 (IND-CCA2) -- transitively and
    LINEARLY, through the additive term (q_RO + q_D) * delta". Those two records
    were returned by this record's OWN novelty screen and were mis-summarised.
    WHAT DOES NOT EXIST IN THIS CORPUS, AND IS THE REDUCED CONTRIBUTION CLAIMED
    HERE: a value of k_dom (which summand of Theorem 6.3 carries the bound, and
    how far the DFR term is from carrying it) or of k_vac (how far it is from
    vacuity). S1 is retained as a REPRODUCTION and as a hard fixture, not as a
    contribution. Note also, against this record's original framing, that the
    pre-existing s(L) values of 4.86 / 1.88 / 4.51 bits are SMALL, which raises
    rather than lowers this lane's interest.

    (B) THE THREE QUANTITIES, MADE CONCRETE. All are exact rationals computable
    from SPEC's own formulas as transcribed in
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md.
    S1, MODEL SLACK - A REPRODUCTION, NOT A CONTRIBUTION: s(L) =
    log2(2^{-lambda(L)}) - log2(DFR_bound(L)) at each security level L, where
    DFR_bound is Theorem 6.1's binomial tail
    sum_{l=delta_e+1}^{n_e} C(n_e,l) p_i^l (1-p_i)^{n_e-l} evaluated with p_i
    from Prop 6.1.3 (and separately 6.1.4) at that level's p*, and lambda(L) is
    the level's declared DFR exponent from SPEC Table 5 (128 / 192 / 256). s(L)
    is the number of bits of pure model error the DESIGN TARGET absorbs before
    the design target itself is violated. ITS COMMITTED VALUES ARE ALREADY
    4.86 / 1.88 / 4.51 BITS (EV-HQC-9906b9 O-3 via TASK-20260802-73a352), and
    re-deriving them here serves only as the pipeline's fixture.
    S2, TERM DOMINANCE, WITH THE COMPARISON SET NOW STATED EXPLICITLY BECAUSE
    THE ORIGINAL RECORD LEFT IT UNDEFINED. Theorem 6.3 bounds the IND-CCA2
    advantage by a sum of four terms:
      T1 = 1/(2^{|k|} 2^{|salt|});
      T2 = 3 q_RO / 2^{|k|};
      T3 = (q_RO + q_D) . delta;
      T4 = 2(Adv_2-DQCSD-P(B1) + Adv_3-DQCSD-PT(B2)).
    T4 IS NOT A NUMBER. It is an adversary's advantage against the underlying
    assumption, and neither SPEC nor this corpus assigns it a value. IT IS
    THEREFORE EXCLUDED FROM THE COMPARISON SET, EXPLICITLY, AND THE CONSEQUENCE
    IS RECORDED RATHER THAN HIDDEN: k_dom compares T3 against max(T1, T2) ONLY,
    so a LARGE k_dom says nothing about which term binds in reality - T4 may
    exceed all three computable terms and this method cannot see it. Define
      k_dom(L, |k|, q_RO, q_D) := log2(max(T1, T2)) - log2(T3)
    evaluated at the published delta, i.e. the number of bits delta must grow
    before T3 overtakes the larger COMPUTABLE generic term.
    THE HEADLINE IS AN AFFINE FUNCTION OF AN INTEGER THIS RECORD NEVER READ,
    AND THE REPAIR DERIVES IT RATHER THAN LEAVING IT A SCALAR. For q_RO >= 1,
    T2/T1 = 3 q_RO 2^{|salt|} >= 1, so max(T1, T2) = T2 at every cell of any
    declared grid with q_RO >= 1, and therefore
      k_dom(L, |k|, q_RO, q_D) = c(q) - |k| - log2 delta(L),
      c(q) := log2( 3 q_RO / (q_RO + q_D) ),
    with c(q) = 1.585 when q_D << q_RO, c(q) = 0.585 when q_D = q_RO, hence
    c(q) in [0.585, 1.585] over any grid with q_D <= q_RO. SUBSTITUTING THE
    COMMITTED delta VALUES OF EV-HQC-9906b9 O-3 (Prop 6.1.4 reading):
      k_dom(HQC-1) = 132.86 + c(q) - |k|,
      k_dom(HQC-3) = 193.88 + c(q) - |k|,
      k_dom(HQC-5) = 260.51 + c(q) - |k|.
    So k_dom is POSITIVE at HQC-1 iff |k| < 133.4 to 134.4, and at |k| = 128 it
    is +5.5 to +6.5 bits while at |k| = 256 it is -122.6 to -121.6 bits - a
    128-bit swing on the one integer this record concedes has never been
    transcribed. k_dom IS THEREFORE REPORTED AS A FUNCTION OF |k| OVER THE
    DECLARED CANDIDATE VALUES {128, 192, 256, 512} AND AS THE CLOSED-FORM
    AFFINE LAW ABOVE, never as a scalar, so that Stage 0's reading of |k|
    substitutes into a published function rather than deciding a headline after
    the fact. [DERIVED IN REPAIR 2026-08-24 from committed inputs; Stage 1
    re-derives it and the package halts if it cannot.]
    WHICH COMPARISONS THE (q_RO, q_D) GRID ACTUALLY MOVES, STATED BECAUSE THE
    ORIGINAL RECORD ADVERTISED THE GRID AS REMOVING "the analyst's freedom to
    choose a cell": the T3-versus-T1 comparison moves with the grid, at
    -log2(q_RO + q_D) per cell; k_vac moves with the grid, since T2 and T3 both
    grow with the budget; and the T3-versus-T2 comparison - WHICH IS THE ONE
    THAT DETERMINES k_dom, since T2 >= T1 at every cell with q_RO >= 1 - moves
    only through c(q), i.e. by under one bit across any grid with q_D <= q_RO.
    THE GRID DOES NOT MOVE THE HEADLINE STATISTIC. |k| does.
    S3, VACUITY: how many bits delta must grow before the sum of the COMPUTABLE
    terms T1 + T2 + T3 exceeds a declared threshold - reported at 2^-64, 2^-32
    and 1. Call that k_vac(L, |k|, q_RO, q_D). T4 is excluded here too, with the
    same consequence: k_vac is an UPPER bound on the distance to vacuity of the
    computable part of the bound, and the true bound may be vacuous already
    through T4 without this method seeing it.

    (C) THE DECISION CONTENT, DECLARED BEFORE THE ARITHMETIC. Set beside
    k_dom and k_vac the plausible magnitude of every named model error this
    program and the external literature have identified: A5's coordinate
    independence (Bombar-Resch-Wiedijk 2025 exhibit cases where it fails;
    Annechini-Barenghi-Pelosi 2026 report a closed-form independence-free model
    concluding HQC's DFRs are LOWER than required), A17's block independence
    (EV-HQC-b71230 measured anti-correlation at every order 2..18 on one
    reduced parameter set), the union-bound slack in Prop 6.1.3 (SPEC Table 11
    reports predicted -10.79 against observed -10.96 at NIST-1, i.e. about 0.17
    bits), the Prop 6.1.3-versus-6.1.4 fork already measured at 10.61 / 7.96 /
    16.79 bits (TASK-20260802-15971b), and the deployed biased sampler (SPEC
    section 6.2.3's (tau^{w_r}_max)^3 with tau_max = 1.00015 at NIST-1). IF NO
    NAMED ERROR'S PLAUSIBLE RANGE REACHES k_dom AT ANY LEVEL, this proposal
    delivers a CLOSURE at the inventor-protocol section 4 standard: a named
    obstruction (the FO bound's computable generic terms dominate the DFR term
    by k_dom bits), an argument (the arithmetic, in exact rationals,
    reproducible), and forward guidance (the lane's remaining value is in
    per-key and worst-case-over-messages quantities, which are NOT the delta
    Theorem 6.3 consumes, and in the ISD flank). IF k_dom IS NEGATIVE - which
    the affine law of (B) says it is at HQC-1 for any |k| >= 135 - the opposite
    conclusion follows with equal force: the DFR term ALREADY exceeds the larger
    computable generic term at the published delta, no model error at all is
    needed to make it the binding computable term, and the DFR flank is live.
    THAT IS THE OUTCOME THIS RECORD NOW EXPECTS, and it is the reverse of what
    the record originally pre-registered.

    (D) WHAT IS NOT CLAIMED. No attack. No statement that Theorem 6.3 is wrong,
    loose, or tight - it is evaluated, not audited. No statement that HQC is
    weak or strong. No measurement of any DFR. No statement about T4, the DQCSD
    term, which is excluded from every comparison here. The output is a table of
    exponents and a decision rule applied to it. Nothing here is a statement
    about a standardized parameter set's security; it is a statement about the
    arithmetic of a published bound at published parameters, which is a MODEL
    claim and carries RQ-HQC-001's toy claim-tier ceiling unchanged.

  mechanism: >-
    STAGE 0 (READING, ZERO COMPUTE). Re-read SPEC Table 5 and SPEC Eq. (13)
    from the primary PDF. Eq. (13) is marked [EXTRACTION-DAMAGED] in the
    BATCH-001 transcription and was never image-verified; every S2 and S3
    number depends on its term structure and on |k| and |salt|, so nothing
    downstream may be computed until it is read from a rendered page. RECORD
    |k| AND |salt| EXPLICITLY AND FIRST: the repair of 2026-08-24 shows k_dom is
    an affine function of |k| with slope -1, so |k| is the single determining
    input and this record's original failure was to pre-register a sign for a
    statistic whose determining input it had declared unread. |salt| is a
    2025-revision quantity (the salted SFO^perp_m transform), it appears in T1,
    and this program has never transcribed its value. Also resolve anomaly X3
    (three inconsistent cross-references to whether p_i is Prop 6.1.3's or
    6.1.4's) by carrying BOTH readings as declared forks, exactly as
    IDEA-20260805-baa4da carries the W = 2w / W = w fork - noting that the
    resulting gap is ALREADY COMPUTED at 10.61 / 7.96 / 16.79 bits in
    TASK-20260802-15971b and that this stage reproduces rather than discovers
    it.

    STAGE 1 (FIXTURE, SECONDS). Re-derive p_tilde from Prop 6.1.1 and p* from
    Prop 6.1.2 in exact rationals at all three levels, from the parameter
    triples, WITHOUT reading Table 9's printed 0.3398. Then evaluate Prop 6.1.3
    and Prop 6.1.4 and require them to reproduce SPEC Table 11's -10.79 /
    -14.14 / -11.30 to within the rounding of the printed p* values, AND require
    Theorem 6.1's tail to reproduce EV-HQC-9906b9 O-3's committed
    2^-132.86 / 2^-193.88 / 2^-260.51 to within 0.05 bits. THIS IS A HARD GATE:
    if the fixture does not reproduce, no S2/S3 number is reported in either
    direction, because the pipeline is then not evaluating the published model.
    The corpus already carries one printed-value defect in the neighbouring
    table (RS-S3's minimum distance, CORR-20260802-3ae664), which is why the
    re-derivation is from definitions and not from print. NOTE THE CHANGED
    STATUS OF THIS STAGE AFTER REPAIR: it is now a REGRESSION CHECK against a
    committed evidence record, not a new computation.

    STAGE 2 (S1, SECONDS - A REPRODUCTION). Evaluate Theorem 6.1's tail in exact
    rationals at all three levels under both X1 readings of Prop 6.1.3's
    exponent and under both p_i sources. Report s(L) as a table with one row per
    (level, reading, p_i source), with EV-HQC-9906b9 O-3's committed values
    printed beside each row and any disagreement recorded rather than
    reconciled. The tail is dominated by its first term l = delta_e + 1, so
    also report the first-term-only value and the ratio to the full tail: if
    the ratio is essentially 1, then HQC's entire DFR budget at that level
    rests on the probability that a SPECIFIC set of delta_e + 1 inner blocks
    all fail, and that sentence - with its number - is the one part of S1 that
    the committed records do not already carry.

    STAGE 3 (S2 AND S3, SECONDS). Evaluate T1, T2 and T3 of Eq. (13) over a
    declared grid of (q_RO, q_D), carrying T4 SYMBOLICALLY and never as a
    number. The grid is fixed before the run and is reported in full, because a
    sensitivity table evaluated on a grid chosen after seeing which cells are
    interesting is a fit - BUT the repair records that this grid moves k_vac and
    the T3-versus-T1 comparison and moves k_dom by under one bit, so the grid is
    a completeness device here and not the discriminating axis. Report k_dom as
    the affine function of |k| derived in claim (B), evaluated at the candidate
    values {128, 192, 256, 512} AND at the value Stage 0 actually read, with the
    read value marked. Report k_vac per cell. Report ALSO the value of the
    computable part of the bound at delta as published, so a reader can see what
    Theorem 6.3's computable terms actually guarantee at HQC's parameters
    rather than what the parameter names suggest.

    STAGE 4 (THE DECISION, WRITTEN BEFORE STAGE 3 RUNS). A frozen rule with
    four branches and an explicit NEITHER, applied first to the null arms of
    Stage 5. BRANCH-CLOSE: k_dom > 0 at every level and every candidate |k|, and
    every named model error's plausible range is below k_dom - record the
    closure with its obstruction block. BRANCH-LIVE: k_dom <= 0 at some level
    and the read |k|, or some named error's range reaches k_dom - name the
    level, the error, and the margin, and the lane continues with a target.
    BRANCH-SPLIT: the answer differs across levels (possible, since NIST-5's
    inner DFR is reported WORSE than NIST-3's at -11.30 against -14.14 while
    its budget is 64 bits smaller) - report per level and do not average.
    BRANCH-BLOCKED: Stage 0 cannot resolve Eq. (13), |k| or |salt| from the
    primary source - an infrastructure outcome under AGENTS.md rule 3, never a
    mathematical one, and the package reports S1 only.
    THE RULE'S DISCRIMINATION IS NOW EXPLICITLY LIMITED, AS THE REPAIR FOUND:
    at |k| >= 135 the affine law puts BOTH the real HQC-1 cells AND the
    degenerate arm NULL-DEG-B in the k_dom < 0 regime, so those two receive the
    SAME branch and NULL-DEG-B alone does not discriminate. NULL-DEG-A (forced
    to BRANCH-CLOSE, k_dom = +infinity) is what supplies the contrast, and the
    graded delta_e ladder of Stage 5 - which must contain the crossing point
    delta_e* where k_dom changes sign - is what supplies the direction. A rule
    resting on NULL-DEG-B alone would be a KN-TECH-1a5b7e mode-4 failure and is
    not used.

    STAGE 5 (THE NULL, RUN AND READ FIRST). Two degenerate parameter sets whose
    answers are forced: delta_e := n_e, where Theorem 6.1's tail is EXACTLY 0
    and s(L) must be reported as +infinity and k_dom as +infinity; and
    delta_e := 0, where the tail is exactly 1 - (1 - p_i)^{n_e} and s(L) must be
    large and NEGATIVE. A pipeline that does not return those two values exactly
    is arithmetically broken and no other cell is reportable. In addition, the
    delta_e ladder {0, 4, 8, 12, 15, 20, 30, n_e} must exhibit EXACTLY ONE sign
    change of k_dom, at a crossing point delta_e*(L, |k|) reported explicitly;
    zero crossings or more than one is an arithmetic defect, since k_dom is
    strictly increasing in delta_e (a larger correction radius cannot raise a
    failure probability) and runs from a large negative value to +infinity. The
    frozen decision rule is emitted on both degenerate cells before any real
    cell is read; if it emits the same branch on BOTH degenerate cells as on a
    real one, it discriminates nothing and is rewritten before the real arm is
    looked at (KN-TECH-1a5b7e mode 4, null-first check).

