  repair_provenance: >-
    REPAIRED 2026-08-24 by idea-generator, in response to an independent
    red-team screen against lane HQC-001 (findings BLOCKING 3 and BLOCKING 4
    against this record). Identifiers, question_id, class, status,
    novelty_status and proposed_at are unchanged. The record is repaired in
    place rather than superseded because the repair was directed at these
    files; a Coordinator who prefers supersession should mint a successor id.
    BLOCKING 3 (k_dom undefined; predictions pre-registered on an unread
    parameter). CLEARED. (a) The comparison set is now stated explicitly in
    claim (B): k_dom compares T3 against max(T1, T2), the two COMPUTABLE generic
    summands, and T4 (the DQCSD advantage) is excluded by name with the
    consequence recorded in claim (B), (D), assumptions, confounders,
    interpretation_limits, method_ceiling and a dedicated T4 exclusion control.
    (b) The derivation was REDONE rather than the prose softened: for q_RO >= 1,
    T2 >= T1, so k_dom = log2(3 q_RO/(q_RO + q_D)) - |k| - log2 delta(L), an
    affine function of |k| with slope -1. Substituting the committed delta of
    EV-HQC-9906b9 O-3 gives k_dom(HQC-1) = 132.86 + c(q) - |k| with c(q) in
