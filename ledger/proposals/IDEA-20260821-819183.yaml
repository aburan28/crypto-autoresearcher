      verified_by: 'read in full, idea-generator@2026-08-21'

  assumptions:
    - >-
      That SPEC Eq. (13) can be re-read from the primary PDF and image-verified.
      If it cannot, S2 and S3 are not computable and Stage 4 returns
      BRANCH-BLOCKED. This is an infrastructure outcome under AGENTS.md rule 3
      and is never reported as a mathematical finding.
    - >-
      That |k| and |salt| are readable from SPEC. |salt| in particular is a
      2025-revision quantity this program has never transcribed.
    - >-
      That the four summands of Eq. (13) are the complete right-hand side. If
      the extraction-damaged rendering omitted a term, every S2/S3 number is
      void and the gate is Stage 0.
    - >-
      That evaluating a published bound is not the same as endorsing its
      tightness. No claim is made that Theorem 6.3 is tight; a loose bound with
      a large k_dom is exactly as much a reason to deprioritise the DFR lane
      under THAT bound, and exactly as little a statement about HQC's real
      security, and both halves of that sentence are reported.
    - >-
      That the (q_RO, q_D) grid is declared before Stage 3 runs and is reported
      in full including cells where nothing interesting happens.

  predictions:
    - metric: >-
        Reproduction of SPEC Table 11 from re-derived p* via Prop 6.1.3 and
        6.1.4, in bits
      direction: different
      minimum_effect: >-
        Agreement with -10.79 / -14.14 / -11.30 to within 0.05 bits under at
        least one of the declared X1/X3 readings. A hard gate: failure stops the
        package and no S1/S2/S3 value is reported.
    - metric: 's(L), the slack of Theorem 6.1''s bound against 2^{-lambda(L)}, in bits, at HQC-1/3/5'
      direction: different
      minimum_effect: >-
        NO VALUE IS PREDICTED AND THAT IS DELIBERATE - pre-registering a number
        here would be a fit, since the whole content is the arithmetic. What IS
        pre-registered is the SIGN: s(L) >= 0 at every level under at least one
        declared reading, because the parameters were chosen to satisfy the
        target. s(L) < 0 at any level under EVERY reading would mean either the
        transcription is wrong or the published parameters do not meet their own
        printed target under their own formula, and the package must report
        which of those it is and must not report the second without a second
        independent re-derivation.
    - metric: >-
        Ratio of Theorem 6.1's full tail to its first term l = delta_e + 1
      direction: different
      minimum_effect: >-
        Pre-registered as within a factor 2 of 1 at all three levels, because
        p_i is small and n_e is small so the tail is first-term-dominated. A
        ratio far from 1 would mean the tail is not concentrated on its first
        term and would change what the lane's joint-moment measurements are
        measurements OF.
    - metric: 'k_dom(L, q_RO, q_D), in bits'
      direction: higher
      minimum_effect: >-
        Pre-registered as STRICTLY POSITIVE at every grid cell, i.e. the DFR term
        is not already the dominant summand at the published delta. k_dom <= 0
        at any cell would mean the DFR term ALREADY carries Theorem 6.3's bound
        at that query budget, which would make the DFR flank the highest-priority
        object in this program and must be independently re-derived before it is
        said out loud.
    - metric: >-
        Spread of k_dom across the three security levels, in bits
      direction: different
      minimum_effect: >-
        At least 8 bits of spread, pre-registered on the structural ground that
        the three levels' inner DFRs are NOT monotone in the security level
        (Table 11 gives -10.79, -14.14, -11.30 for NIST-1/3/5) while the budgets
        are 128 / 192 / 256. If the spread is under 8 bits the levels behave
        alike and the per-level reporting collapses to one number - which is a
        simpler and equally reportable outcome.
    - metric: >-
        Verdict of the frozen four-branch rule on NULL-DEG-A and NULL-DEG-B
      direction: different
      minimum_effect: >-
        The two degenerate arms MUST receive different branches from each other
        and at least one must differ from whatever the real cells receive. Same
        branch everywhere is KN-TECH-1a5b7e mode 4 and voids the rule.

  minimal_test:
    design: >-
      One script, exact rationals throughout (Python's fractions and integers -
      no numpy, no scipy, none of which this container reliably has), five
      stages as in the mechanism, under 300 lines. Stage 0 is reading and is the
      only stage that can block. Stages 1-5 together run in seconds on one core.
      THE DISCRIMINATION: the three named branches of Stage 4 correspond to three
      different states of the world - the DFR flank is closed under Theorem 6.3
      (BRANCH-CLOSE), it is live at a named level with a named error
      (BRANCH-LIVE), or it splits across levels (BRANCH-SPLIT) - and the
      arithmetic selects among them mechanically. It is cheap enough to be
      decided inside an hour of single-core compute INCLUDING the degenerate
      arms and the grid, and the only expensive input is Stage 0's reading.
    controls:
      - >-
        TRANSCRIPTION CONTROL: p_tilde and p* re-derived from Prop 6.1.1 and
        6.1.2 in exact rationals rather than read from Table 9's printed 0.3398,
        with the printed value reported beside the derived one and any
        disagreement recorded rather than reconciled.
      - >-
        FROZEN FIXTURE: SPEC Table 11's three values reproduced before anything
        else is computed, as a hard gate.
      - >-
        NULL-DEG-A and NULL-DEG-B, forced values written down before the run,
        run on the identical code path, verdict emitted on them FIRST.
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS: delta_e over
        {0, 4, 8, 12, 15, 20, 30, n_e}, with monotonicity of s(L) in delta_e
        reported explicitly. Two ends do not give a direction (KN-TECH-1a5b7e's
        refinement); the interior points do.
      - >-
        FORK CONTROL: every table reported under BOTH X1 readings of Prop
        6.1.3's exponent and under BOTH p_i sources (6.1.3 and 6.1.4), because
        X3 records three inconsistent cross-references in the source and picking
        one silently would make the headline an artifact of the choice.
      - >-
        INDEPENDENT RE-DERIVATION REQUIRED BEFORE ANY BRANCH-LIVE OR NEGATIVE-s
        FINDING IS STATED: those are the two outcomes with consequences, and the
        producer's own arithmetic does not establish them.
    required_metrics:
      - 'p_tilde and p* in exact rationals at all three levels, derived not read'
      - 'Prop 6.1.3 and Prop 6.1.4 values in log2, against Table 11, per reading'
      - 'Theorem 6.1 tail in log2, full tail and first term, and their ratio'
      - 's(L) per (level, reading, p_i source)'
      - 'the four summands of Eq. (13) per (level, q_RO, q_D) grid cell'
      - 'k_dom and k_vac per grid cell, at thresholds 2^-64, 2^-32 and 1'
      - 'the declared (q_RO, q_D) grid, reported in full including dull cells'
      - 'NULL-DEG-A and NULL-DEG-B values and the rule''s verdict on each'
      - 's(L) monotonicity verdict across the delta_e ladder'
      - 'the transcribed values of |k| and |salt| with their source page'

  falsification_conditions:
    - >-
      The Table 11 fixture does not reproduce under any declared reading. The
      pipeline is not evaluating the published model; no S1/S2/S3 number is
      reported in either direction and the package reports a transcription or
      derivation defect.
    - >-
      NULL-DEG-A returns anything other than exactly 0. The arithmetic is
      broken; package void.
    - >-
      s(L) is not monotone increasing in delta_e across the ladder. Feasibility
      is nested (a larger correction radius cannot raise a failure probability),
      so non-monotonicity is an implementation defect and never a finding.
    - >-
      Stage 0 cannot resolve Eq. (13), |k| or |salt| from the primary PDF. The
      package reports S1 only, marks S2/S3 BLOCKED, and records this as an
      infrastructure outcome under AGENTS.md rule 3.
    - >-
      k_dom turns out enormous at every level and every grid cell - say above 60
      bits - and no named model error's plausible range comes within 40 bits of
      it. THEN THE HONEST DELIVERABLE IS THAT NEGATIVE, written as a closure at
      the inventor-protocol section 4 standard with its obstruction block: the
      quantity, its value in bits with the reading it was computed under, the
      runs it is read from, and the scope. It does NOT close RQ-HQC-001 and it
      does NOT declare any direction impossible: it says that under Theorem 6.3
      as published, at these query budgets, the DFR term is not the binding one,
      and it names what remains open (per-key delta, worst-case-over-messages
      delta, multi-target settings, and the entire ISD flank) exactly as section
      4 requires.
    - >-
      k_dom turns out small - under about 10 bits - at any level. Then the DFR
      lane is live with a named target, and the package must say so with equal
      clarity and must NOT be quietly softened, per AGENTS.md rule 9.

  confounders:
    - >-
      EXTRACTION DAMAGE IS THE LARGEST ONE AND IT IS NAMED IN THE SOURCE. SPEC
      Eq. (13) was transcribed from the text layer only and explicitly carries
      no claim. Building S2 and S3 on it without re-reading would be building on
      a rendering the program's own transcription disowns.
    - >-
      THE THREE CROSS-REFERENCES DISAGREE (anomaly X3): section 6.1.3's lead-in
      points at 6.1.2, Theorem 6.1 names 6.1.3, Table 11's header names 6.1.4.
      Which p_i Theorem 6.1 is "really" using changes the bound by the gap
      between the two propositions, and no reading may be adopted silently.
    - >-
      THE EXPONENT ANOMALY X1 - (1-p)^{d_i - j} in the proposition statement
      against (1-p)^{n-j} in its own proof - changes Prop 6.1.3's value
      materially. Both readings are carried.
    - >-
      Q_RO AND Q_D ARE NOT PROPERTIES OF HQC. They are properties of the
      security model, and choosing them generously or stingily moves k_dom
      directly. The grid is declared in advance and reported in full precisely
      so that the headline cannot be produced by choosing a cell.
    - >-
      A LOOSE BOUND CAN MAKE A REAL PROBLEM INVISIBLE. If Theorem 6.3 is loose
      by many bits in its generic terms, a large k_dom reflects the reduction's
      slack rather than HQC's safety. This proposal cannot distinguish those and
      says so; distinguishing them would need a tightness analysis of HHK-style
      reductions, which is named here as forward guidance and not attempted.
    - >-
      REPORTING THE DESIGN TARGET INSTEAD OF THE BOUND. Table 5's "< 2^-128"
      column is a target, not a computed value; a package that quietly uses the
      target as delta would compute s(L) = 0 by construction, which is
      KN-TECH-1a5b7e mode 1 - a statistic that is a constant of the apparatus.
      The gate against this is that s(L) is defined from the COMPUTED tail.

  interpretation_limits:
    - >-
      This is arithmetic on a published bound at published parameters. It is a
      MODEL claim, not a measurement, and RQ-HQC-001's toy claim-tier ceiling
      applies unchanged. Nothing is executed at HQC's parameters; expressions
      are evaluated at them, which is the same distinction
      IDEA-20260805-baa4da's interpretation_limits draws, and it is the failure
      mode KN-FIND-f8c290 and KN-FIND-2a8b7e record.
    - >-
      A large k_dom does not mean HQC is safe. It means the DFR term is not what
      binds THIS bound at THESE query budgets. Security is not the same object
      as a bound.
    - >-
      A small k_dom does not mean HQC is broken. It means a measured DFR
      discrepancy of that size would change which term dominates a bound.
    - >-
      The named model errors set against k_dom are drawn from what this session
      could read: two external abstracts and this program's own toy-scale
      measurement. The list is not exhaustive and its incompleteness is the
      strongest argument against reading a BRANCH-CLOSE verdict as final.
    - >-
      Nothing here bears on the implementation-attack claim class (timing,
      power, single-trace) that RQ-HQC-001 separates out.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE OF THE THREE HEADLINE QUANTITIES IS HEURISTIC-CONDITIONAL, and this
        entry exists to say so explicitly rather than leave it implied. s(L),
        k_dom and k_vac are exact rational functions of published integers under
        a declared reading of the source; they involve no distributional
        assumption, no sampling, and no extrapolation. What IS conditional is
        the INTERPRETATION in Stage 4, which sets them against the plausible
        magnitude of named model errors - and that step is explicitly a judgement
        made from a named, incomplete list, not a computation.
      rigorous_support: >-
        Exact evaluation of a finite sum of binomial terms in rational
        arithmetic. Theorem 6.1's tail has at most n_e - delta_e terms (31, 40
        and 61 at HQC-1/3/5), each a product of an integer binomial coefficient
        and rational powers, so exactness is trivially achievable and floating
        point is unnecessary and forbidden here.
      validation_plan: >-
        SAMPLE: not applicable - there is nothing to sample. VALIDATION ROUTE
        INSTEAD: (i) the Table 11 fixture, which is an independent published
        evaluation of the same formulas at the same parameters and therefore
        functions as ground truth; (ii) the two degenerate arms, whose values
        are forced in closed form; (iii) recomputation of at least one cell per
        level by a reader who is not the producer, in a different language or by
        hand, since the arithmetic is small enough for that to be feasible.
        TAIL CHECK: the ratio of the full tail to its first term, which must
        stay near 1 if the tail is genuinely concentrated; a departure localises
        an error in the summation limits.
    - id: H2
      statement: >-
        FOR THE STAGE 4 INTERPRETATION ONLY. The plausible magnitude of each
        named model error is bounded by the largest value any source this
        program has read reports for it: at most about 0.2 bits for the Prop
        6.1.3 union-bound slack (SPEC Table 11's own predicted-versus-observed
        gap at NIST-1), at most a factor (1.00015)^3 for the deployed sampler
        (SPEC Table 12 at NIST-1), and UNBOUNDED-IN-EITHER-DIRECTION for A5 and
        A17, whose external treatments this session read only at abstract level.
      rigorous_support: >-
        None. This is a judgement about an incomplete literature, stated as a
        numbered assumption precisely so that a reviewer can attack it, and it
        is the reason a BRANCH-CLOSE verdict is scoped to "the named errors" and
        never to "all errors".
      validation_plan: >-
        Obtain and read in full eprint 2026/795 and arXiv:2501.02626 - neither
        was read beyond its abstract in this session - and replace the
        UNBOUNDED entries with the magnitudes those papers report at HQC's
        parameters. Until that is done, Stage 4 may emit BRANCH-CLOSE only with
        an explicit "conditional on H2" tag carried into every downstream
        citation, exactly as the target-result-profile requires conditional
        phrasing to propagate.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the lane's cost structure is not a
      mathematical step at all: it is the missing evaluation of a published
      inequality. Everything the DFR flank has spent six batches on feeds
      Theorem 6.3 through a single linear term, and the coefficient of that term
      relative to its neighbours has never been computed. That coefficient is
      the bottleneck for PRIORITISATION, not for any theorem.
    baseline_embedding:
      parameter_slice: >-
        Setting delta to SPEC's own design target 2^{-lambda(L)} and q_RO = q_D
        = 0 recovers the trivial statement that the bound is the sum of its
        generic terms; setting delta_e := n_e recovers the zero-DFR boundary.
        The published state of knowledge is the boundary case q_RO, q_D
        unspecified, at which no term ordering exists - which is exactly why
        this is a family extension rather than a new object.
      reproduction_check: >-
        FROZEN FIXTURE: SPEC Table 11's -10.79 / -14.14 / -11.30 reproduced from
        re-derived p* under a declared reading, checked symbolically in exact
        rationals rather than by curve similarity.
    observation_collision:
      observable: >-
        The scalar k_dom, and the branch label the frozen rule emits from it.
      distinct_preimage_search: >-
        A REAL COLLISION EXISTS AND IS NAMED. Two very different worlds produce
        the same large k_dom: (i) HQC's DFR genuinely has enormous margin, and
        (ii) Theorem 6.3's GENERIC terms are loose by many bits, so the DFR term
        is dominated by slack rather than by security. The observable cannot
        separate them. THE ADDITIONAL CONDITION THAT WOULD SEPARATE THEM is a
        tightness analysis of the HHK-style reduction at HQC's parameters, which
        this proposal does not attempt and names as forward guidance. Because
        the collision is unresolved, a BRANCH-CLOSE verdict is scoped to "under
        Theorem 6.3 as published" and may not be restated as a statement about
        HQC.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The (level, reading, p_i source, q_RO, q_D) grid as an explicit
          product of declared, disjoint specialisations, with every cell
          reported rather than a minimum or maximum over cells.
        predicted_gain: >-
          Converts a single contestable headline number into a surface whose
          shape is itself the finding, and removes the analyst's freedom to
          choose a cell after seeing the numbers.
    quantifier_order: >-
      FOR ALL levels L in {HQC-1, HQC-3, HQC-5}, FOR ALL readings r of anomalies
      X1 and X3, FOR ALL (q_RO, q_D) in the declared grid, THERE EXISTS an exact
      rational k_dom(L, r, q_RO, q_D) such that multiplying delta by 2^j leaves
      the term ordering of Theorem 6.3 unchanged for all j < k_dom and changes it
      for j >= k_dom. THE QUANTIFIER ON THE READING IS DELIBERATELY UNIVERSAL AND
      DELIBERATELY NOT EXISTENTIAL: a k_dom that holds only under a favourable
      reading of a documented source anomaly is not a result.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under SPEC's Theorem 6.3 as published and read under declared reading r,
        at query budget (q_RO, q_D), the decoding-failure term is smaller than
        the largest generic term by k_dom bits." It can NEVER certify that HQC's
        DFR is correct, that HQC is secure, that Theorem 6.3 is tight, or that
        any model error is bounded - all four are outside the method.
      nearby_object_control: >-
        A KEM whose FO bound has a delta term that IS known to bind - the
        degenerate arm NULL-DEG-B is exactly such an object, constructed by
        setting delta_e := 0 so the DFR is large. The method must distinguish it
        from the real cells; if it emits the same branch on both, it has not
        identified the load-bearing structure and is rewritten.
    proof_obligations:
      - claim: 'Theorem 6.1''s tail is evaluated exactly, with correct summation limits'
        responsibility: correctness
      - claim: 'The re-derived p* reproduces Table 11 under a declared reading'
        responsibility: baseline
      - claim: 'k_dom is the exact crossing exponent of two explicit affine functions of log2 delta'
        responsibility: correctness
      - claim: 'The degenerate arms return their forced values'
        responsibility: feasibility
      - claim: 'The frozen rule''s branches exhaust the space of mechanisms, not merely of statistic values'
        responsibility: scope
      - claim: 'The whole package runs in seconds on one core with no external solver'
        responsibility: runtime
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD FOLLOW. The COMPUTATION costs
      O(sum over the grid of (n_e - delta_e) exact-rational binomial terms), i.e.
      well under 10^6 arbitrary-precision operations in total, seconds on one
      core. What the result can move is not an exponent but a PRIORITY: which of
      this program's two HQC flanks is worth compute.
    memory_exponent: >-
      Negligible - a table of a few hundred rationals, under a megabyte. Stated
      beside the time cost because docs/claims-and-verification.md requires
      memory beside time always, and because the program-wide census found 82 of
      229 evidence records violating that.
    best_known: >-
      There is no incumbent. This repository contains no evaluation of Theorem
      6.1's bound value, no slack against the design target, and no term
      ordering for Theorem 6.3. Externally, the honest statement is that this
      session did not read the full text of any paper and therefore cannot say
      whether HQC's designers or a third party have published this sensitivity
      analysis; if they have, the deliverable is a reproduction, which is still
      the number RQ-HQC-001 asks for and still absent here.
    hidden_overhead: >-
      There is no o(1) to hide anything in, and that is worth stating because
      most records in this lane have one. The genuinely hidden cost is HUMAN AND
      IT IS STAGE 0: re-reading and image-verifying Eq. (13), |k| and |salt| from
      a 51-page PDF. That is where the package can stall, and it is disclosed as
      the binding constraint rather than discovered later.
    tradeoff_note: >-
      Not applicable - no memory-limited search, no parallelisation question.
      The only tradeoff is grid density against reporting volume, and it is
      resolved by declaring the grid in advance.

  dominated_by: >-
    n/a (no result claimed on any attack axis). Frontier rows checked before
    writing that, across all three axes the inventor protocol section 5 names.
    TIME: the audit costs seconds of integer arithmetic and no cheaper route to
    the quantity exists in this corpus, because no route exists at all. MEMORY:
    under a megabyte. DATA/QUERIES: zero - nothing is sampled, no oracle is
    called, no ciphertext is generated. ON THE QUESTION AUDITED there is no
    incumbent to dominate: the nearest in-corpus objects are
    IDEA-20260808-9f9ed8's bracket WIDTH and IDEA-20260805-15258a's per-key
    DISPERSION, and neither is a slack or a term ordering, so neither dominates
    and neither is dominated. Against the EXTERNAL state of the art, zero delta
    on every attack axis: no attack, no algorithm, no cost improvement.
  sota_delta: >-
    No attack; conceptual and accounting contribution only. QUANTITATIVELY:
    values of s(L) in this repository before, 0; after, 3 levels x 4 readings.
    Values of k_dom before, 0; after, one per declared grid cell. RQ-HQC-001's
    second declared target has had no numeric answer for 23 days across eight
    batches and twenty proposals; this supplies one at a cost of seconds. The
    delta is the creation of a first number and its degenerate-arm calibration,
    not an improvement on an existing one - and if the number turns out large
    and dull, the delta is a closure, which the inventor protocol treats as a
    first-class deliverable and this program has repeatedly failed to produce at
    that standard.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    BY PART, because a single number here would hide the structure.
    (i) That Stage 0 resolves Eq. (13), |k| and |salt| from the primary PDF:
    ~0.7. The PDF was obtained once before by TASK-20260802-6344ed with a
    recorded sha256, so the route exists; the risk is that this session's
    successors also lack a PDF renderer, which is exactly what blocked me today.
    (ii) That the Table 11 fixture reproduces under at least one declared
    reading: ~0.85. The formulas are image-verified and the parameters are
    transcribed; the residual risk is the X1 exponent ambiguity.
    (iii) That the degenerate arms return their forced values on the first
    correct implementation: ~0.95.
    (iv) That k_dom comes out LARGE (above 40 bits) at every level, i.e. that
    the honest verdict is BRANCH-CLOSE: ~0.6. This is the outcome I would bet
    on, and I am proposing the experiment anyway, because a 0.6-probability
    closure obtained in seconds is a better use of this lane's next hour than a
    nineteenth DFR measurement - and because the 0.4 tail contains the outcome
    that would make this program's HQC work matter.
    (v) That the package produces a defensible table in either branch: ~0.9.

