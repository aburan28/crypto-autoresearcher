    cost to this program; and the X1/X3 fork slice is dominated by
    TASK-20260802-15971b, which computes the gap at 10.61 / 7.96 / 16.79 bits.
    This record does not improve on either and reproduces both only as fixtures.
    Frontier rows checked across all three axes the inventor protocol section 5
    names, for the parts NOT dominated. TIME: the k_dom/k_vac audit costs seconds
    of integer arithmetic and no cheaper route to those quantities exists in this
