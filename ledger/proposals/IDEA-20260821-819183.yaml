  sota_delta: >-
    No attack; conceptual and accounting contribution only. CORRECTED BY REPAIR
    2026-08-24; the original sentence "values of s(L) in this repository before,
    0" was FALSE. QUANTITATIVELY: values of Theorem 6.1's bound beside the design
