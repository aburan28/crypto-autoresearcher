  object_first_candidate:
    tracked_object: >-
      The TERM VECTOR of Theorem 6.3 - the ordered 4-tuple of its summands
      evaluated at a given (level, q_RO, q_D) - together with the scalar slack
      s(L) of Theorem 6.1's bound against its own design target. The object
      followed through the computation is not the DFR and not the advantage, but
      the DECOMPOSITION: which term carries the bound, and how far the DFR term
      is from carrying it.
    lossiness: >-
      GENUINELY AND SEVERELY LOSSY, in the direction that matters. The
      underlying state is the entire IND-CCA2 security game - an adversary, a
      key, a query transcript, a reduction. The projection keeps four rational
      numbers and discards the adversary, the reduction's tightness, the game's
      structure, and every property of HQC except five integers per level. What
      it discards is discarded COMPATIBLY with the operation the object must
      survive, namely "delta changes": each summand is either constant in delta
      or linear in delta, so the whole 4-tuple propagates deterministically
      under a perturbation of delta, and the ordering of the terms - which is
      the retained content - propagates with it. That is precisely the
      lossy-projection test of inventor-protocol section 2: the projection is
      not a change of coordinates, because the 4-tuple cannot be inverted to
      recover the bound's proof, the scheme, or the adversary, and yet the
      question asked ("how far can delta move before the ordering changes") is
      answerable entirely inside the projection.
    propagation: >-
      One step of the target operation is "multiply delta by 2^j". Under it, the
      DFR term scales by 2^j and the other three are fixed, so the term vector's
      trajectory is an explicit line in log coordinates and the crossing point
      with each other term is a closed-form j. The one-step propagation law is
      therefore exactly writable and exactly measurable, which is what inventor-
      protocol section 1 demands of a candidate object.
    survival_score: >-
      Survives exactly as far as Theorem 6.3 is the operative statement, and no
      further. It dissolves the moment the question becomes per-key, worst-case-
      over-messages, or multi-target, because those are quantities Theorem 6.3
      does not contain - and naming that dissolution point is half the
      deliverable, because it says where IDEA-20260805-15258a's and
      IDEA-20260808-d21021's objects take over from this one.

  null_object_control: >-
    TWO DEGENERATE ARMS WITH FORCED VALUES DERIVED BEFORE THE RUN, PLUS A
    NULL-FIRST VERDICT, per KN-TECH-1a5b7e.
    NULL-DEG-A: set delta_e := n_e (the outer code corrects every symbol).
    Theorem 6.1's tail sum_{l=n_e+1}^{n_e} is EMPTY, so the bound is EXACTLY 0
    and s(L) must be reported as +infinity, and the DFR term of Theorem 6.3 must
    vanish for every (q_RO, q_D). FORCED VALUE: 0, exactly, in rationals.
    NULL-DEG-B: set delta_e := 0. The bound is EXACTLY 1 - (1 - p_i)^{n_e},
    which at HQC-1's p_i is of order n_e . p_i, so s(L) must be large and
    negative and the DFR term must dominate every other summand at every grid
    cell. FORCED VALUE: computable in closed form and written down before the
    run.
    WHY THESE CAN FAIL, WHICH IS THE POINT: both are evaluated by the SAME code
    path as the real cells, with only delta_e changed. An off-by-one in the
    summation limit, a floating-point substitution for exact rationals, a
    mis-transcribed n_e, or a sign error in the log conversion each produces a
    wrong value on at least one degenerate arm. A pipeline that returns anything
    other than exactly 0 on NULL-DEG-A is not evaluating Theorem 6.1.
    COMPARATOR SPREAD IS NOT ZERO: the two degenerate arms differ from each
    other by the entire dynamic range of the statistic (from +infinity to a
    large negative number), so the statistic provably moves when the object is
    removed - obligation 3 is met with both ends of the range exhibited, and the
    grid over delta_e in {0, 4, 8, 12, 15, 20, 30, n_e} supplies at least three
    interior points so that MONOTONICITY IN delta_e is reported rather than
    assumed.
    NULL-FIRST VERDICT: the frozen four-branch decision rule of Stage 4 is
    emitted on NULL-DEG-A and NULL-DEG-B before any real cell is read. If it
    emits the same branch on a degenerate arm as it would on a real one, it
    discriminates nothing and is rewritten.

  discriminated_from:
    - >-
      IDEA-20260801-011 measures the DFR at reduced parameters against the
      model's prediction. That answers "is the model right". This answers "how
      wrong may it be before anything downstream changes", which is a different
      question with a different answer, is computable without any measurement,
      and is a PRECONDITION for pricing 011's result: a measured discrepancy of
      j bits means nothing until k_dom is known.
    - >-
      IDEA-20260805-15258a predicts per-key DFR dispersion driven by the secret
      support's additive energy, and observes that Theorem 6.3 multiplies a
      single averaged delta by (q_RO + q_D). It proposes to measure the
      dispersion. This proposal evaluates the bound and does not measure
      anything; it is silent about per-key structure and would be run unchanged
      if the per-key spread were exactly zero. The two compose: 15258a supplies a
      candidate magnitude for one model error, and this supplies the threshold
      that magnitude must clear.
    - >-
      IDEA-20260808-d21021 defines alpha(beta), the ratio between the worst-case
      correctness the HHK argument wants and the average section 6.1 computes,
      and proposes an adversarially steerable ciphertext dial that raises the
      conditional failure rate. That is a claim about the NUMERATOR delta. This
      is a claim about the DENOMINATOR - the margin the bound has - and the two
      multiply rather than overlap. d21021's alpha is exactly one of the named
      model errors Stage 4 sets against k_dom.
    - >-
      IDEA-20260816-3949c8 tracks the whole map from message to failure
      probability and measures its spread, using a Frodo-shaped unstructured
      encoding where translation invariance predicts a flat map. Its object is a
      MAP and its instrument is a measurement in a different scheme's geometry;
      this object is a four-term inequality at HQC's own parameters and its
      instrument is exact rational arithmetic. Neither can substitute for the
      other.
    - >-
      IDEA-20260808-9f9ed8 produces a two-sided BRACKET on delta and states that
      its value enters through (q_RO + q_D) . delta. A bracket's WIDTH and a
      bound's SLACK are different quantities: a 3-bit bracket is decisive if
      k_dom is 1 bit and irrelevant if k_dom is 60. 9f9ed8 does not compute
      k_dom, and this does not compute a bracket.
    - >-
      IDEA-20260808-5d8b39 factorises the 3.4e41-trial measurement barrier into
      factors measurable at deployed parameters. That is an instrument-design
      claim about how to MEASURE the DFR. This is an arithmetic claim about what
      the measured value would be worth.

