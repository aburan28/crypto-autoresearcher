  minimal_test:
    design: >-
      One script, exact rationals throughout (Python's fractions and integers -
      no numpy, no scipy, none of which this container reliably has), five
      stages as in the mechanism, under 300 lines. Stage 0 is reading and is the
      only stage that can block, AND IT IS NOW THE DECISIVE STAGE: the repair
      reduced S2 to an affine function of |k|, so the reading of |k| and |salt|
      carries the result and the arithmetic carries the check. Stages 1-5
      together run in seconds on one core.
      THE DISCRIMINATION: the named branches of Stage 4 correspond to different
      states of the world - the DFR term is dominated by the larger computable
      generic term by k_dom bits (BRANCH-CLOSE), it already exceeds it
      (BRANCH-LIVE), or the answer splits across levels (BRANCH-SPLIT) - and the
      arithmetic plus the read |k| selects among them mechanically. It is cheap
      enough to be decided inside an hour of single-core compute INCLUDING the
      degenerate arms and the grid.
      WHAT THE REPAIR REMOVED FROM THIS TEST: S1 is no longer a deliverable, only
      a fixture, because EV-HQC-9906b9 O-3 already carries it; and k_dom is no
      longer a discovery, only an evaluation of a written-down identity at a read
      integer. WHAT REMAINS GENUINELY UNCOMPUTED: k_vac at every grid cell, the
      full-tail-to-first-term ratio, the crossing point delta_e*, and |k| and
      |salt| themselves.
    controls:
      - >-
        TRANSCRIPTION CONTROL: p_tilde and p* re-derived from Prop 6.1.1 and
        6.1.2 in exact rationals rather than read from Table 9's printed 0.3398,
        with the printed value reported beside the derived one and any
        disagreement recorded rather than reconciled.
      - >-
        FROZEN FIXTURE: SPEC Table 11's three values AND EV-HQC-9906b9 O-3's
        three Theorem 6.1 values reproduced before anything else is computed, as
        a hard gate.
      - >-
        NULL-DEG-A and NULL-DEG-B, forced values written down before the run,
        run on the identical code path, verdict emitted on them FIRST, with
        NULL-DEG-B scored on magnitude rather than on branch.
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS AND A FORCED SIGN CHANGE:
        delta_e over {0, 4, 8, 12, 15, 20, 30, n_e}, with monotonicity of s(L)
        and of k_dom in delta_e reported explicitly and the unique crossing
        delta_e* located. Two ends do not give a direction (KN-TECH-1a5b7e's
        refinement); the interior points and the crossing do.
      - >-
        FORK CONTROL: every table reported under BOTH X1 readings of Prop
        6.1.3's exponent and under BOTH p_i sources (6.1.3 and 6.1.4), because
        X3 records three inconsistent cross-references in the source and picking
        one silently would make the headline an artifact of the choice. The fork
        gap is already recorded at 10.61 / 7.96 / 16.79 bits in
        TASK-20260802-15971b and this control reproduces it.
      - >-
        |k| CONTROL: k_dom reported at every candidate |k| in {128, 192, 256,
        512} as well as at the value Stage 0 read, so that a reader can see the
        headline's entire dependence on the determining input rather than a
        single cell of it.
      - >-
        T4 EXCLUSION CONTROL: every table carries a column stating that T4 is
        symbolic and unevaluated, and every headline sentence carries the
        qualifier "among the computable terms". A package that reports a term
        ordering without that column is reporting a subset as if it were the sum.
      - >-
        INDEPENDENT RE-DERIVATION REQUIRED BEFORE ANY BRANCH-LIVE OR NEGATIVE-s
        FINDING IS STATED: those are the two outcomes with consequences, and the
        producer's own arithmetic does not establish them.
    required_metrics:
      - 'p_tilde and p* in exact rationals at all three levels, derived not read'
      - 'Prop 6.1.3 and Prop 6.1.4 values in log2, against Table 11, per reading'
      - 'Theorem 6.1 tail in log2, against EV-HQC-9906b9 O-3, full tail and first term, and their ratio'
      - 's(L) per (level, reading, p_i source), reported as a reproduction with the committed values beside it'
      - 'T1, T2 and T3 per (level, |k|, q_RO, q_D) grid cell, with T4 marked symbolic and unevaluated'
      - 'k_dom per cell AND as the affine function of |k|, at |k| in {128, 192, 256, 512} and at the read value'
      - 'k_vac per grid cell, at thresholds 2^-64, 2^-32 and 1, computed on T1 + T2 + T3 only'
      - 'the declared (q_RO, q_D) grid, reported in full including dull cells, with a note of which comparisons it moves'
      - 'NULL-DEG-A and NULL-DEG-B values and the rule''s verdict on each'
      - 's(L) and k_dom monotonicity verdicts across the delta_e ladder, and the unique crossing delta_e*'
      - 'the transcribed values of |k| and |salt| with their source page'

  falsification_conditions:
    - >-
      The Table 11 fixture or the EV-HQC-9906b9 O-3 fixture does not reproduce
      under any declared reading. The pipeline is not evaluating the published
      model; no S2/S3 number is reported in either direction and the package
      reports a transcription or derivation defect - or, if the defect is in the
      committed record rather than here, a correction request against it.
    - >-
      NULL-DEG-A returns anything other than exactly 0. The arithmetic is
      broken; package void.
    - >-
      Reported k_dom departs from c(q) - |k| - log2 delta(L) by more than 0.05
      bits at any cell. The identity is forced; a departure is an arithmetic
      defect and never a finding.
    - >-
      s(L) or k_dom is not monotone increasing in delta_e across the ladder, or
      k_dom crosses zero zero times or more than once. Feasibility is nested (a
      larger correction radius cannot raise a failure probability), so all three
      are implementation defects and never findings.
    - >-
      Stage 0 cannot resolve Eq. (13), |k| or |salt| from the primary PDF. The
      package reports the S1 reproduction only, marks S2/S3 BLOCKED, and records
      this as an infrastructure outcome under AGENTS.md rule 3.
    - >-
      k_dom comes out LARGE AND POSITIVE at every level under the read |k| - say
      above 60 bits, which by the affine law requires |k| < 73 at HQC-1 - and no
      named model error's plausible range comes within 40 bits of it. THEN THE
      HONEST DELIVERABLE IS THAT NEGATIVE, written as a closure at the
      inventor-protocol section 4 standard with its obstruction block: the
      quantity, its value in bits with the reading and the |k| it was computed
      under, the records it is read from, and the scope. It does NOT close
      RQ-HQC-001 and it does NOT declare any direction impossible: it says that
      under Theorem 6.3's computable terms as published, at these query budgets
      and this |k|, the DFR term is not the binding computable one, and it names
      what remains open (T4, per-key delta, worst-case-over-messages delta,
      multi-target settings, and the entire ISD flank) exactly as section 4
      requires.
    - >-
      k_dom comes out NEGATIVE at any level under the read |k| - which the
      affine law says happens at HQC-1 for any |k| >= 135, and which this record
      now EXPECTS. Then the DFR term already exceeds the larger computable
      generic term at the published delta, no model error is needed to make the
      DFR flank the binding computable term, and the lane is live with a named
      target. The package must say so with equal clarity, must NOT be quietly
      softened (AGENTS.md rule 9), and must NOT be stated before an independent
      re-derivation - and must carry the T4 qualifier, because "binding among
      the computable terms" is not "binding".

  confounders:
    - >-
      EXTRACTION DAMAGE IS THE LARGEST ONE AND IT IS NAMED IN THE SOURCE. SPEC
      Eq. (13) was transcribed from the text layer only and explicitly carries
      no claim. Building S2 and S3 on it without re-reading would be building on
      a rendering the program's own transcription disowns.
    - >-
      |k| IS UNREAD AND IT IS THE DETERMINING INPUT. This is the confounder the
      original record did not name and pre-registered a sign against anyway. The
      affine law makes the dependence explicit rather than latent, but it does
      not supply the integer, and until Stage 0 reads it every k_dom here is a
      function and not a number.
    - >-
      T4 IS EXCLUDED AND ITS EXCLUSION IS NOT NEUTRAL. Every ordering here is an
      ordering of a strict subset of Theorem 6.3's right-hand side. If T4
      dominates, the whole term-dominance question is answered elsewhere and
      this package's headline is about a subset. The package cannot detect that
      and says so.
    - >-
      THE THREE CROSS-REFERENCES DISAGREE (anomaly X3): section 6.1.3's lead-in
      points at 6.1.2, Theorem 6.1 names 6.1.3, Table 11's header names 6.1.4.
      Which p_i Theorem 6.1 is "really" using changes the bound by the gap
      between the two propositions - already measured at 10.61 / 7.96 / 16.79
      bits in TASK-20260802-15971b - and no reading may be adopted silently.
    - >-
      THE EXPONENT ANOMALY X1 - (1-p)^{d_i - j} in the proposition statement
      against (1-p)^{n-j} in its own proof - changes Prop 6.1.3's value
      materially. Both readings are carried.
    - >-
      Q_RO AND Q_D ARE NOT PROPERTIES OF HQC. They are properties of the
      security model. The repair records what the grid does and does not do: it
      moves k_vac and the T3-versus-T1 comparison, and it moves k_dom by under
      one bit for q_D <= q_RO. The grid is declared in advance and reported in
      full, but it is NOT the guard against a chosen headline; the |k| control
      is.
    - >-
      A LOOSE BOUND CAN MAKE A REAL PROBLEM INVISIBLE. If Theorem 6.3 is loose
      by many bits in its generic terms, a large k_dom reflects the reduction's
      slack rather than HQC's safety. This proposal cannot distinguish those and
      says so; distinguishing them would need a tightness analysis of HHK-style
      reductions, which is named here as forward guidance and not attempted.
    - >-
      REPORTING THE DESIGN TARGET INSTEAD OF THE BOUND. Table 5's "< 2^-128"
      column is a target, not a computed value; a package that quietly uses the
      target as delta would compute s(L) = 0 by construction, which is
      KN-TECH-1a5b7e mode 1 - a statistic that is a constant of the apparatus.
      The gate against this is that s(L) is defined from the COMPUTED tail, and
      the computed tail is now pinned to a committed evidence record.

  interpretation_limits:
    - >-
      This is arithmetic on a published bound at published parameters. It is a
      MODEL claim, not a measurement, and RQ-HQC-001's toy claim-tier ceiling
      applies unchanged. Nothing is executed at HQC's parameters; expressions
      are evaluated at them, which is the same distinction
      IDEA-20260805-baa4da's interpretation_limits draws, and it is the failure
      mode KN-FIND-f8c290 and KN-FIND-2a8b7e record.
    - >-
      EVERY TERM-ORDERING STATEMENT HERE IS ABOUT THE COMPUTABLE TERMS T1, T2,
      T3 ONLY. T4, the DQCSD advantage, has no value and is excluded. "The DFR
      term dominates" means "dominates the computable generic terms" and may
      never be restated without that qualifier.
    - >-
      A large k_dom does not mean HQC is safe. It means the DFR term is not what
      binds THIS bound's computable part at THESE query budgets and THIS |k|.
      Security is not the same object as a bound.
    - >-
      A small or negative k_dom does not mean HQC is broken. It means the DFR
      term is the largest computable term of a published bound, which is a
      statement about the bound's shape and not about any attack.
    - >-
      S1 IS A REPRODUCTION. Its values belong to EV-HQC-9906b9 O-3 and
      TASK-20260802-73a352, and any downstream citation must attribute them
      there and not here.
    - >-
      The named model errors set against k_dom are drawn from what this session
      could read: two external abstracts, this program's own toy-scale
      measurement, and two committed internal records. The list is not
      exhaustive and its incompleteness is the strongest argument against
      reading a BRANCH-CLOSE verdict as final.
    - >-
      Nothing here bears on the implementation-attack claim class (timing,
      power, single-trace) that RQ-HQC-001 separates out.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE OF THE THREE HEADLINE QUANTITIES IS HEURISTIC-CONDITIONAL, and this
        entry exists to say so explicitly rather than leave it implied. s(L),
        k_dom and k_vac are exact rational functions of published integers under
        a declared reading of the source and under the DECLARED EXCLUSION of T4;
        they involve no distributional assumption, no sampling, and no
        extrapolation. What IS conditional is the INTERPRETATION in Stage 4,
        which sets them against the plausible magnitude of named model errors -
        and that step is explicitly a judgement made from a named, incomplete
        list, not a computation.
      rigorous_support: >-
        Exact evaluation of a finite sum of binomial terms in rational
        arithmetic. Theorem 6.1's tail has at most n_e - delta_e terms (31, 40
        and 61 at HQC-1/3/5), each a product of an integer binomial coefficient
        and rational powers, so exactness is trivially achievable and floating
        point is unnecessary and forbidden here. The k_dom law is an identity
        between logarithms of two closed-form expressions.
      validation_plan: >-
        SAMPLE: not applicable - there is nothing to sample. VALIDATION ROUTE
        INSTEAD: (i) the Table 11 fixture and the EV-HQC-9906b9 O-3 fixture,
        which are independent evaluations of the same formulas at the same
        parameters - one published, one committed and independently recounted -
        and therefore function as ground truth; (ii) the two degenerate arms,
        whose values are forced in closed form; (iii) the affine identity for
        k_dom, which must hold at every cell to 0.05 bits; (iv) recomputation of
        at least one cell per level by a reader who is not the producer, in a
        different language or by hand, since the arithmetic is small enough for
        that to be feasible.
        TAIL CHECK: the ratio of the full tail to its first term, which must
        stay near 1 if the tail is genuinely concentrated; a departure localises
        an error in the summation limits.
    - id: H2
      statement: >-
        FOR THE STAGE 4 INTERPRETATION ONLY. The plausible magnitude of each
        named model error is bounded by the largest value any source this
        program has read reports for it: at most about 0.2 bits for the Prop
        6.1.3 union-bound slack (SPEC Table 11's own predicted-versus-observed
        gap at NIST-1), 10.61 / 7.96 / 16.79 bits for the Prop 6.1.3-versus-
        6.1.4 fork (TASK-20260802-15971b, exact arithmetic), at most a factor
        (1.00015)^3 for the deployed sampler (SPEC Table 12 at NIST-1), and
        UNBOUNDED-IN-EITHER-DIRECTION for A5 and A17, whose external treatments
        this session read only at abstract level.
      rigorous_support: >-
        None for the UNBOUNDED entries. The fork entry is exact arithmetic in a
        committed internal artifact. This is otherwise a judgement about an
        incomplete literature, stated as a numbered assumption precisely so that
        a reviewer can attack it, and it is the reason a BRANCH-CLOSE verdict is
        scoped to "the named errors" and never to "all errors".
      validation_plan: >-
        Obtain and read in full eprint 2026/795 and arXiv:2501.02626 - neither
        was read beyond its abstract in this session - and replace the
        UNBOUNDED entries with the magnitudes those papers report at HQC's
        parameters. Until that is done, Stage 4 may emit BRANCH-CLOSE only with
        an explicit "conditional on H2" tag carried into every downstream
        citation, exactly as the target-result-profile requires conditional
        phrasing to propagate.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the lane's cost structure is not a
      mathematical step at all: it is the missing evaluation of a published
      inequality's TERM ORDERING. Everything the DFR flank has spent six batches
      on feeds Theorem 6.3 through a single linear term, and the coefficient of
      that term relative to its computable neighbours has never been computed.
      That coefficient is the bottleneck for PRIORITISATION, not for any
      theorem. THE REPAIR NARROWS THE BOTTLENECK FURTHER: the coefficient is an
      affine function of |k|, so the real bottleneck is a READING of |k| and
      |salt| from a rendered page.
    baseline_embedding:
      parameter_slice: >-
        Setting delta to SPEC's own design target 2^{-lambda(L)} and q_RO = q_D
        = 0 recovers the trivial statement that the bound is the sum of its
        generic terms; setting delta_e := n_e recovers the zero-DFR boundary.
        The published state of knowledge is the boundary case q_RO, q_D
        unspecified, at which no term ordering exists - which is exactly why
        this is a family extension rather than a new object. The in-corpus
        baseline is EV-HQC-9906b9 O-3, which is the delta axis of this object
        with the ordering axis absent.
      reproduction_check: >-
        FROZEN FIXTURE: SPEC Table 11's -10.79 / -14.14 / -11.30 and
        EV-HQC-9906b9 O-3's 2^-132.86 / 2^-193.88 / 2^-260.51 reproduced from
        re-derived p* under a declared reading, checked symbolically in exact
        rationals rather than by curve similarity.
    observation_collision:
      observable: >-
        The scalar k_dom at a given |k|, and the branch label the frozen rule
        emits from it.
      distinct_preimage_search: >-
        TWO REAL COLLISIONS EXIST AND BOTH ARE NAMED. FIRST: two very different
        worlds produce the same large k_dom - (i) HQC's DFR genuinely has
        enormous margin, and (ii) Theorem 6.3's generic terms are loose by many
        bits, so the DFR term is dominated by slack rather than by security. The
        observable cannot separate them. THE ADDITIONAL CONDITION THAT WOULD
        SEPARATE THEM is a tightness analysis of the HHK-style reduction at
        HQC's parameters, which this proposal does not attempt and names as
        forward guidance. SECOND, FOUND IN REPAIR: two different worlds produce
        the same NEGATIVE k_dom - (i) the DFR term genuinely carries the bound,
        and (ii) T4 is larger than everything and the computable ordering is
        irrelevant. The observable cannot separate those either, because T4 has
        no value. Because both collisions are unresolved, every verdict is
        scoped to "under Theorem 6.3's computable terms as published, at this
        |k|" and may not be restated as a statement about HQC.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The (level, reading, p_i source, |k|, q_RO, q_D) grid as an explicit
          product of declared, disjoint specialisations, with every cell
          reported rather than a minimum or maximum over cells. |k| IS ADDED AS A
          SPECIALISATION AXIS BY THE REPAIR, because it is the axis that moves
          the headline and the original pack omitted it.
        predicted_gain: >-
          Converts a single contestable headline number into a surface whose
          shape is itself the finding, and removes the analyst's freedom to
          choose a cell after seeing the numbers - including the freedom to
          choose |k|, which the original pack left open.
    quantifier_order: >-
      FOR ALL levels L in {HQC-1, HQC-3, HQC-5}, FOR ALL readings r of anomalies
      X1 and X3, FOR ALL candidate |k|, FOR ALL (q_RO, q_D) in the declared
      grid, THERE EXISTS an exact rational k_dom(L, r, |k|, q_RO, q_D) such that
      multiplying delta by 2^j leaves the ordering of the COMPUTABLE terms of
      Theorem 6.3 unchanged for all j < k_dom and changes it for j >= k_dom.
      THE QUANTIFIER ON THE READING AND ON |k| IS DELIBERATELY UNIVERSAL AND
      DELIBERATELY NOT EXISTENTIAL: a k_dom that holds only under a favourable
      reading of a documented source anomaly, or only at a favourable |k|, is not
      a result. The original record quantified over the reading but silently
      existentially over |k|, which is the defect the repair removes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under SPEC's Theorem 6.3 as published and read under declared reading r,
        at shared-secret length |k| and query budget (q_RO, q_D), the
        decoding-failure term differs from the larger of the two COMPUTABLE
        generic terms by k_dom bits." It can NEVER certify that HQC's DFR is
        correct, that HQC is secure, that Theorem 6.3 is tight, that any model
        error is bounded, or anything whatsoever about the DQCSD term T4 - all
        five are outside the method.
      nearby_object_control: >-
        A KEM whose FO bound has a delta term that IS known to bind - the
        degenerate arm NULL-DEG-B is exactly such an object, constructed by
        setting delta_e := 0 so the DFR is large. The method must distinguish it
        from the real cells; the repair records that at |k| >= 135 it
        distinguishes them by MAGNITUDE (about 127 bits) and not by branch, and
        that NULL-DEG-A is the arm carrying the branch contrast.
    proof_obligations:
      - claim: 'Theorem 6.1''s tail is evaluated exactly, with correct summation limits'
        responsibility: correctness
      - claim: 'The re-derived p* reproduces Table 11 and the tail reproduces EV-HQC-9906b9 O-3'
        responsibility: baseline
      - claim: 'k_dom is the exact crossing exponent of two explicit affine functions of log2 delta, over the DECLARED COMPUTABLE comparison set {T1, T2}'
        responsibility: correctness
      - claim: 'max(T1, T2) = T2 at every cell with q_RO >= 1, so the comparison set reduces to T2'
        responsibility: correctness
      - claim: 'The degenerate arms return their forced values, and the delta_e ladder has exactly one k_dom sign change'
        responsibility: feasibility
      - claim: 'The frozen rule''s branches exhaust the space of mechanisms, not merely of statistic values, and NULL-DEG-A carries the branch contrast'
        responsibility: scope
      - claim: 'No statement is made about T4 or about the full right-hand side of Theorem 6.3'
        responsibility: scope
      - claim: 'The whole package runs in seconds on one core with no external solver'
        responsibility: runtime
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD FOLLOW. The COMPUTATION costs
      O(sum over the grid of (n_e - delta_e) exact-rational binomial terms), i.e.
      well under 10^6 arbitrary-precision operations in total, seconds on one
      core. What the result can move is not an exponent but a PRIORITY: which of
      this program's two HQC flanks is worth compute.
    memory_exponent: >-
      Negligible - a table of a few hundred rationals, under a megabyte. Stated
      beside the time cost because docs/claims-and-verification.md requires
      memory beside time always, and because the program-wide census found 82 of
      229 evidence records violating that.
    best_known: >-
      CORRECTED BY REPAIR 2026-08-24. There IS an incumbent for S1: EV-HQC-9906b9
      observation O-3, via TASK-20260802-73a352, computes Theorem 6.1's bound
      value against the design target at all three levels in exact rationals,
      and TASK-20260802-15971b computes the X1/X3 fork gap. There is no
      incumbent for the TERM ORDERING (k_dom) or the distance to vacuity
      (k_vac), and none for |k| or |salt|. Externally, the honest statement is
      that this session did not read the full text of any paper and therefore
      cannot say whether HQC's designers or a third party have published this
      sensitivity analysis; if they have, the deliverable is a reproduction.
    hidden_overhead: >-
      There is no o(1) to hide anything in, and that is worth stating because
      most records in this lane have one. The genuinely hidden cost is HUMAN AND
      IT IS STAGE 0: re-reading and image-verifying Eq. (13), |k| and |salt| from
      a 51-page PDF. That is where the package can stall, and after the repair it
      is not merely the binding constraint but the DECISIVE input, since k_dom is
      affine in |k| with slope -1.
    tradeoff_note: >-
      Not applicable - no memory-limited search, no parallelisation question.
      The only tradeoff is grid density against reporting volume, and it is
      resolved by declaring the grid in advance. The repair records that grid
      density buys little here: the grid moves k_vac, not k_dom.

  dominated_by: >-
    n/a for the term-ordering claim (no result claimed on any attack axis) - BUT
    NOT n/a FOR S1, AND THE ORIGINAL RECORD WAS WRONG TO WRITE IT SO. CORRECTED
    BY REPAIR 2026-08-24. THE S1 SLICE IS DOMINATED by ledger/evidence/
    EV-HQC-9906b9.yaml observation O-3 (via TASK-20260802-73a352), which already
    computes Theorem 6.1's bound value against the design target at all three
