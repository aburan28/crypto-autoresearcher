idea:
  id: IDEA-20260806-e4f96e
  question_id: RQ-ECDLP-001
  added: '2026-08-06'
  title: >-
    A DIFFERENT COMPUTATIONAL MODEL FOR THE COST THIS PROGRAM ALREADY MEASURES:
    the polynomial-calculus refutation degree of the Semaev decomposition system
    is an UNCONDITIONAL lower bound on the solving degree of every Groebner-order
    solver, so computing it by rank on the Macaulay matrix either promotes the
    program's heuristic degree-of-regularity meters to theorems or exposes an
    exact gap that is itself the algorithmic target
  class: measurement

  claim: >-
    (A) WHAT THE PROGRAM MEASURES TODAY, AND WHY IT IS NOT A BOUND.
    KN-TECH-004 and KN-TECH-011 record the program's cost indicators for
    point-decomposition index calculus: the degree of regularity and the
    first-fall degree, measured through F4/F5 behaviour. Both are HEURISTIC
    indicators of one algorithm's behaviour on one monomial order. Neither
    excludes a cheaper algebraic route, and the DREG lane
    (RQ-DREG-001, GOAL-DREG-001) has been spending budget measuring their growth
    without any statement of the form "no algebraic method can do better".

    (B) THE SUBSTITUTION, AND IT IS A THEOREM NOT A METRIC. Proof complexity
    supplies degree measures that are properties of the SYSTEM, not of a solver:
    the Nullstellensatz degree NS(F) and the polynomial calculus / PCR
    refutation degree PC(F) of an unsatisfiable system F over F_p. The
    load-bearing relation, which is the reason this is worth doing:
      A Groebner basis computation that terminates having considered no
      polynomial of degree above D yields a degree-D polynomial calculus
      refutation of F. Contrapositively, PC(F) > D implies EVERY Groebner-order
      solver -- every monomial order, every selection strategy, F4, F5, XL,
      BooleanSolve, and any future variant in the same model -- must reach
      degree at least PC(F).
    So PC(F) is an UNCONDITIONAL lower bound where the degree of regularity is a
    heuristic estimate, and it is a lower bound over the whole class of solvers
    the program has been benchmarking one at a time.

    (C) THE OBJECT. Fix a prime-field curve E/F_p, a factor base F given by a
    vanishing condition, a target point R, and an arity m. The system
    F(E, F, R, m) is the Semaev summation polynomial S_m(x_1, ..., x_m, x(R))
    together with the factor-base membership equations for each x_i and the
    field equations x_i^p - x_i. For a target R with NO m-decomposition over F,
    this system is unsatisfiable over F_p, and PC(F) is defined. The claim to
    measure: PC(F) as a function of (m, log p, factor-base density).

    (D) THE TWO OUTCOMES, AND BOTH ARE DELIVERABLES. This is the property that
    makes the experiment worth running rather than a fishing trip:
      OUTCOME 1 -- PC degree matches the measured F4 solving degree. Then the
        program's heuristic meters were tracking a real obstruction, and the
        degree-of-regularity results already in the ledger are promoted from
        "this solver's behaviour" to "no solver in this model does better". That
        is a closure at the docs/inventor-protocol.md section 4 standard: a
        NAMED OBSTRUCTION (the refutation degree of the decomposition system),
        an ARGUMENT (the Groebner-to-PC simulation), and FORWARD GUIDANCE (only
        non-algebraic solvers, or a different encoding, remain open).
      OUTCOME 2 -- PC degree is materially BELOW the measured F4 solving degree.
        Then a low-degree algebraic refutation EXISTS that F4 does not find, and
        the size of the gap is an explicit, quantified algorithmic target: the
        program would be looking at a concrete inefficiency in its own solver
        rather than at a property of the problem. This is the constructive
        branch and it is the more valuable one.
      There is no outcome in which the measurement means nothing, which is the
      quality bar in agents/idea-generator.md.

    (E) WHAT THIS IS NOT. It is NOT a lower bound on the ECDLP. It bounds one
    step -- relation collection by algebraic decomposition -- inside one attack
    family, in one encoding, in one proof system. It says nothing about rho,
    nothing about non-algebraic decomposition, and nothing about a different
    encoding of the same mathematics: proof-complexity degree is
    ENCODING-SENSITIVE, which is simultaneously the technique's main weakness
    and the reason a measured gap between encodings would itself be a result.

  discriminated_from:
    - >-
      KN-TECH-004 and KN-TECH-011 (degree of regularity, first-fall degree,
      F4/F5). Those are properties of a solver's execution. PC degree is a
      property of the system, quantified over solvers. The relation between them
      is the simulation in (B), and establishing that relation concretely at toy
      scale is part of this proposal's deliverable rather than assumed.
    - >-
      IDEA-20260805-2afd22, which is the only record in this repository
      mentioning Nullstellensatz. That proposal uses a degree-bounded
      Nullstellensatz representation as a CERTIFICATE, to make a failed
      decomposition attempt cheaply re-verifiable, and its metrics are
      certificate size and verification time. This proposal uses the MINIMUM
      DEGREE at which such a certificate can exist as a COMPLEXITY LOWER BOUND,
      and its metric is that degree. Same classical theorem in the background,
      opposite use: one wants a small witness, the other wants to prove no small
      witness exists. Where they touch is a consistency check this record owes:
      2afd22's extracted witness degree is an UPPER bound on NS degree and must
      never be reported below this proposal's measured lower bound.
    - >-
      "polynomial calculus" returns ZERO hits across ledger/, knowledge/ and
      docs/ as of merge-base 0c856274. The proof system itself is absent from
      the program's 88 recorded techniques.

  object_first_candidate:
    tracked_object: >-
      THE REFUTATION DEGREE of the decomposition system: the least D such that
      the unsatisfiability of {S_m = 0, factor-base membership, field equations}
      is derivable by polynomial calculus using only polynomials of degree <= D.
      It is followed as (m, p, factor-base density) vary.
    lossiness: >-
      LOSSY, and in the strong sense: the whole system collapses to one integer.
      Every solver, every monomial order and every strategy is forgotten. What
      is retained is a quantity that lower-bounds all of them.
    propagation: >-
      Deterministic under the operations of the proof system by definition
      (that is what a proof system is), and monotone under adding equations.
      Under a change of ENCODING it does NOT propagate, and that is the honest
      Class III coordinate-dependence of this object in the
      IDEA-20260806-c5d183 trichotomy: PC degree is a function of the
      presentation, not of the underlying variety, and the record says so rather
      than hiding it.
    survival_score: >-
      Survives arbitrary solver changes -- that is the point. Dies at a change
      of encoding, which is why the experiment measures at least three declared
      encodings and reports the spread rather than a single number.

  mechanism: >-
    STEP 1 -- THE SIMULATION, MADE CONCRETE BEFORE ANY BOUND IS QUOTED. The
    statement "a degree-D Groebner computation yields a degree-D PC refutation"
    is standard but its exact form depends on the variant (PC over F_p, PCR with
    dual variables, and whether the field equations are counted as axioms). At
    toy scale this is CHECKABLE rather than quotable: run F4 on a small
    unsatisfiable instance, log every polynomial it considers with its degree,
    and mechanically extract a PC refutation of the same degree. Doing this once
    at m = 3 and a 10-bit prime converts a cited claim into a verified
    construction, and if the extraction fails the proposal ends there.

    STEP 2 -- COMPUTING PC DEGREE IS LINEAR ALGEBRA, WHICH IS WHY THIS IS CHEAP.
    For a fixed degree bound D, "does a degree-D PC refutation exist" is decided
    by rank on the degree-D Macaulay matrix: build all products of axioms by
    monomials up to degree D, and ask whether 1 is in the row space. PC(F) is
    the least D for which the answer is yes, found by binary search on D. This
    program already has Macaulay machinery in the BKK and DREG lanes, so the
    marginal implementation cost is a rank computation and a search loop.
    NS degree is the same computation with linear-combination-only derivations,
    giving NS(F) >= PC(F) and a second, weaker but even cheaper number.

    STEP 3 -- THE ENCODING SWEEP, WHICH IS NOT OPTIONAL. Because PC degree is
    encoding-sensitive, at least three encodings are measured and reported side
    by side: (E1) Semaev S_m in the x-coordinates with field equations;
    (E2) the same with the factor base given by an explicit vanishing
    polynomial rather than by membership constraints; (E3) the Weil-restriction
    -style expansion this program uses in the DREG lane. A single number from a
    single encoding is not a result and must not be reported as one.

    STEP 4 -- THE NULL, DERIVED BEFORE MEASUREMENT. Build a random polynomial
    system matched to S_m on every declared structural feature -- number of
    variables, total degree, degree in each variable, support size, Newton
    polytope where the BKK lane already computes it -- and measure its PC degree
    on the identical pipeline. Semaev's summation polynomials have a very
    specific structure (KN-FIND-a1f3c2 records their monodromy is C_2^{m-2}
    universally; KN-FIND-c41ea9 records the m = 3 cycle type), and the question
    the null answers is whether ANY of that structure shows up in the refutation
    degree or whether the degree is a function of the shape alone. If matched
    random systems give the same PC degree, then the measured number says
    nothing about Semaev and everything about sparse systems of that shape --
    and reporting it as a Semaev result would be exactly the artifact the
    inventor protocol section 3 forbids.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "polynomial calculus",
      "proof complexity", "Nullstellensatz", "refutation degree",
      "sum-of-squares", "Macaulay", performed 2026-08-06 against merge-base
      0c856274.
    results: >-
      "polynomial calculus": ZERO hits anywhere. "proof complexity": one hit, in
      knowledge/literature/KN-LIT-5666.md, where it means the size of a
      cryptographic accumulator proof and is unrelated. "Nullstellensatz": two
      records, H-SDEG-3acfcf and IDEA-20260805-2afd22, both using it as a
      certificate device rather than a lower-bound measure. "sum-of-squares":
      five hits, all lattice-side. No record in this repository states a solver-
      independent algebraic lower bound for the decomposition system.
    verdict: >-
      ADAPTATION -- a standard technique from a field adjacent to this program,
      applied here for the first time. Proof complexity's degree lower bounds
      are textbook material and nothing about them is claimed as new. What is
      new to this program is the application, and specifically the observation
      that it converts DREG-lane measurements from solver behaviour into
      solver-independent statements. No claim of novelty against the external
      literature is made; a Stage-0 literature check for existing PC-degree
      results on summation-polynomial systems is part of the design, and a
      positive hit there would be a valuable ingredient rather than a
      disappointment.

  null_object_control: >-
    MANDATORY AND BLOCKING: matched random systems (Step 4) run on the identical
    pipeline. Match on variables, total degree, per-variable degree, support
    size and Newton polytope. If PC degree agrees within one, the measurement is
    a shape measurement and no Semaev-specific claim may be made. SECOND NULL:
    a SATISFIABLE instance -- a target R that DOES decompose. The pipeline must
    report "no refutation exists at any degree" there; an instrument that
    returns a finite refutation degree for a satisfiable system is broken and
    the line halts before anything is reported.

  assumptions:
    - >-
      The Groebner-to-PC simulation holds in the exact variant used. Verified
      constructively at toy scale in Step 1 rather than assumed; failure ends
      the line.
    - >-
      Toy scale (p <= 2^16, m in {3, 4}) is where exact rank computations on the
      degree-D Macaulay matrix are feasible. Everything reported is scoped
      there. No extrapolation to crypto-scale degrees is performed, and the
      record does not license one.
    - >-
      The factor base is the one already frozen in the program's toy Semaev
      protocols, so the measured numbers are comparable with existing DREG-lane
      records rather than describing a fresh setup.

  proof_search_map:
    bottleneck: >-
      The rank computation on the degree-D Macaulay matrix, whose size grows as
      binomial(n + D, D) in the number of variables n. This is the exact step
      whose feasibility determines the largest (m, p) reachable, and it is also
      the step whose cost the whole proposal is spent on.
    baseline_embedding:
      parameter_slice: >-
        m = 3, smallest declared prime, encoding E1. This slice must reproduce
        the degree-of-regularity value already recorded in the DREG lane for the
        same instance, or the two meters are not measuring comparable things and
        the comparison in Outcome 1/2 is meaningless.
      reproduction_check: >-
        Frozen regression fixture: the exact instance, seed, factor base and
        target already used in an existing DREG run record, re-run through both
        meters. Exact integer comparison of the recorded degree of regularity
        with the newly measured F4 maximum degree. Any mismatch is an
        instrument-comparability failure and halts the line.
    observation_collision:
      observable: >-
        The integer PC(F).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the null is blocking:
        find two systems with the same PC degree, one Semaev and one matched
        random. That collision does not falsify the measurement, it CALIBRATES
        it -- it establishes that PC degree at this scale is a function of shape
        rather than of summation-polynomial structure, and it bounds what any
        conclusion drawn from the number may say. Reporting a Semaev PC degree
        without having run this search is prohibited.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "how hard is decomposition for algebraic solvers" into the proof
          system, where it becomes the exact condition "1 is in the row space of
          the degree-D Macaulay matrix" -- a rank condition, with separate
          encoding, completeness, soundness, transfer and cost-loss obligations
          listed below.
        predicted_gain: >-
          Converts a per-solver empirical curve into one integer per instance
          that bounds all of them. The gain is in the STRENGTH OF THE STATEMENT,
          not in attack cost.
      - transform: stronger_invariant
        proposed_object: >-
          The full rank profile of the Macaulay matrix as a function of D, not
          only the threshold D at which 1 appears. The profile preserves more
          state than the threshold and is what would survive a change of arity.
        predicted_gain: >-
          A curve rather than a point, giving a shape that can be compared
          across m and against the null with far more resolution than a single
          crossing point.
    quantifier_order: >-
      Intended: FORALL encodings in the declared set, FORALL instances F in the
      declared toy family, EXISTS an integer PC(F) such that FORALL
      Groebner-order solvers S in the declared model, the maximum degree reached
      by S on F is at least PC(F).
      The dangerous weaker reading, which is NOT claimed: FORALL S EXISTS a
      degree bound -- letting the bound depend on the solver, which is exactly
      what the degree of regularity already is and would make this proposal
      redundant. The audit obligation is to check that the simulation in Step 1
      is uniform over solvers in the model and does not use any property of a
      particular strategy.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No Groebner-order solver, in this encoding, on this instance family,
        at this scale, reaches a solution below degree PC(F)." It can NEVER
        certify anything about non-algebraic algorithms, about a different
        encoding, or about the ECDLP itself. Any summary that drops one of those
        four qualifiers is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        The DECOMPOSABLE instance -- the same curve, factor base and arity with
        a target that DOES decompose. The method must fail to produce a
        refutation there. A method that cannot distinguish the decomposable from
        the undecomposable instance has not identified the load-bearing
        structure and is measuring the encoding's shape only.
    proof_obligations:
      - claim: The Groebner-to-PC simulation holds in the variant used.
        responsibility: correctness
      - claim: PC(F) computed by Macaulay rank equals the definition.
        responsibility: correctness
      - claim: Binary search on D terminates and finds the least such D.
        responsibility: runtime
      - claim: The satisfiable control yields no refutation at any tested D.
        responsibility: soundness
      - claim: Reported degrees name their encoding.
        responsibility: scope
      - claim: >-
          The measured F4 maximum degree reproduces the recorded DREG-lane
          degree of regularity on the frozen fixture.
        responsibility: baseline

  predictions:
    - metric: >-
        PC refutation degree of the Semaev decomposition system at m = 3, 4
        versus the measured maximum degree reached by F4 on the same instance
      direction: different
      minimum_effect: >-
        Two-branch pre-registration, committed before running: if the two agree
        within 1, record Outcome 1 (heuristic meters promoted to bounds); if PC
        degree is at least 2 below the F4 maximum, record Outcome 2 (an
        exploitable solver gap of that exact size). A difference of exactly 1 is
        declared INCONCLUSIVE in advance so that neither branch can be reached
        by rounding.
    - metric: >-
        PC degree of Semaev systems versus matched random systems
      direction: different
      minimum_effect: >-
        A gap of at least 2 is required before any Semaev-specific statement is
        made. Predicted outcome is NO gap -- i.e. the null matches -- and that
        prediction is recorded here so that a match is a confirmed control
        rather than a disappointment.
    - metric: >-
        spread of PC degree across the three declared encodings E1, E2, E3 on
        the same instance
      direction: different
      minimum_effect: >-
        Report the full spread. A spread of 3 or more means the number is
        primarily an encoding artifact, which bounds every conclusion drawn from
        it and must be stated in the same sentence as any reported degree.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): literature check for existing PC/NS degree results
      on summation-polynomial or elliptic-curve decomposition systems; write
      whatever is found into knowledge/techniques. A positive hit is an
      ingredient, not a reason to stop.
      STAGE 1 (hours, HARD GATE): run F4 on one small unsatisfiable instance,
      log every polynomial considered with its degree, and mechanically extract
      a PC refutation of the same degree. If the extraction fails, the whole
      proposal ends here.
      STAGE 2 (hours): implement PC degree by Macaulay rank with binary search
      on D; validate on textbook instances with known refutation degree before
      touching a Semaev system.
      STAGE 3 (HARD GATE): run the satisfiable control. Must report no
      refutation.
      STAGE 4 (hours to days): measure PC and NS degree for the frozen toy
      Semaev family at m = 3, 4 across the three encodings, alongside the
      matched-random null on the identical pipeline.
      STAGE 5 (zero compute): compare with the recorded DREG-lane degree-of-
      regularity values on the frozen fixture and record Outcome 1 or 2 per the
      pre-registered rule.
    controls:
      - >-
        satisfiable instance -- must yield no refutation at any tested degree
      - >-
        matched random systems -- same variables, total degree, per-variable
        degree, support size and Newton polytope
      - >-
        textbook instances of known refutation degree, to validate the
        implementation before any Semaev number is produced
      - >-
        frozen DREG fixture, to establish that the two meters are comparable
    required_metrics:
      - PC degree and NS degree per (m, p, encoding, instance)
      - full Macaulay rank profile as a function of D, not only the threshold
      - maximum degree reached by F4 on the identical instance
      - matched-random null degrees on the identical pipeline
      - Macaulay matrix dimensions, rank-computation wall-clock and peak memory
      - pass/fail of every gate control

  falsification_conditions:
    - >-
      Stage 1's extraction fails: a degree-D F4 run does not yield a degree-D PC
      refutation in the variant used. The load-bearing relation is false as
      stated and the record is superseded rather than amended.
    - >-
      The satisfiable control returns a finite refutation degree. Instrument
      broken; nothing is reported.
    - >-
      Textbook validation instances give the wrong known degree. Same
      disposition.
    - >-
      Matched random systems give the same PC degree as Semaev systems. No
      Semaev-specific conclusion may be drawn; the honest report is that PC
      degree at this scale measures shape, and that IS the result.
    - >-
      Macaulay matrices at m = 4 exceed the memory budget before any degree is
      resolved. That is an INFRASTRUCTURE outcome under AGENTS.md rule 5, is
      recorded as such, and is not evidence about refutation degree.

  confounders:
    - >-
      Encoding sensitivity. PC degree is not an invariant of the variety. Three
      encodings are measured for exactly this reason and every reported number
      names its encoding.
    - >-
      Field-equation accounting. Whether x^p - x is an axiom or is built into
      the ambient ring changes the degree materially. The convention must be
      frozen before Stage 4 and reported with every number.
    - >-
      Solver-model drift. "Groebner-order solver" must be pinned to a stated
      model. XL and BooleanSolve are inside it; a hypothetical solver that
      manipulates polynomials in a factored or straight-line representation is
      NOT, and the bound says nothing about it. This limit is a feature of the
      model and must appear in the write-up, not only here.
    - >-
      Small-p artifacts. At p ~ 2^10 the field equations are cheap and can
      dominate the degree, producing behaviour that vanishes at larger p. The
      prime ladder must span enough range to see whether the measured degree
      depends on p at all.

  interpretation_limits:
    - >-
      Bounds one step of one attack family in one encoding in one proof system,
      at toy scale. Not a statement about the ECDLP.
    - >-
      Outcome 1 does not make index calculus infeasible; it makes the existing
      degree measurements solver-independent within the stated model.
    - >-
      Outcome 2 is not an attack. It is a quantified inefficiency in the
      program's own solver, and converting it into an algorithm is separate work
      with its own record.
    - >-
      Nothing here interacts with the GGM lower bound (KN-TECH-005): that bounds
      generic algorithms, this bounds algebraic solvers on a specific encoding.
      They are different models and neither implies the other.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the frozen toy Semaev family, the PC refutation degree measured at
        m = 3, 4 and p <= 2^16 is a monotone non-decreasing function of m at
        fixed p, and its dependence on p is o(log p).
      rigorous_support: >-
        Monotonicity in m is expected because the arity-m system contains the
        arity-(m-1) structure after specialisation; the p-dependence claim
        imitates the standard expectation that refutation degree of an algebraic
        system is governed by its combinatorial shape rather than by the field
        size once the field is large enough to avoid degenerate coincidences.
        Neither half is a theorem quoted here, and H1 is refutable on its own
        terms.
      validation_plan: >-
        Measure PC degree across the full declared (m, p) grid rather than at
        one cell, and fit the p-dependence. Comparison distribution: the matched
        random null measured on the identical grid, so the p-dependence of the
        Semaev family is read against the p-dependence of shape alone rather
        than against zero. Tail check: the largest single-cell deviation from
        the fitted surface. Toy scale only, and labelled so; H1 is NOT validated
        at cryptographic scale by this or any part of this proposal.
    - id: H2
      statement: >-
        The maximum degree reached by the specific F4 implementation used is a
        faithful proxy for "the degree a Groebner-order solver reaches" in the
        declared model.
      rigorous_support: >-
        The simulation in (B) is what makes any Groebner run yield a PC
        refutation; H2 is the narrower claim that the particular implementation's
        instrumentation reports that degree correctly, which is an
        implementation property rather than a mathematical one.
      validation_plan: >-
        Two independent solver implementations on frozen seeds must report the
        same maximum degree on the same instances before any Outcome 1/2 verdict
        is recorded. A disagreement is an instrument failure, not a finding.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The proposal produces lower bounds on one
      step, not an algorithm. If Outcome 2 fires, the gap it exposes would be
      the input to a separate algorithmic proposal that would carry its own
      exponent claim, heuristics and cost table.
    memory_exponent: >-
      The rank computation is the memory-dominant step: the degree-D Macaulay
      matrix has binomial(n + D, D) columns. Peak memory is measured and
      reported per cell, and it is the binding constraint on how far the
      (m, p) grid can go.
    best_known: >-
      For prime-field ECDLP, rho at p^{1/2} with O(1) memory (KN-TECH-001,
      KN-TECH-006). For the decomposition step specifically, the standing
      program results are KN-FIND-f8c290 (Semaev index-calculus complexity tight
      at toy scale) and the BKK speedup findings KN-FIND-2a8b7e / KN-FIND-c7d31e.
      This proposal changes none of them; it changes what kind of statement the
      DREG measurements support.
    hidden_overhead: >-
      The entire result hides inside "in this encoding". That qualifier is not a
      technicality: a different encoding of the same mathematics can have a
      different PC degree, and no bound proved here transfers across the
      encoding sweep automatically. Disclosed here and required in every
      downstream summary.
    tradeoff_note: >-
      Not applicable -- no algorithm is produced. The rank computation's own
      time-memory behaviour is measured for feasibility bookkeeping only and is
      not a cryptanalytic tradeoff.

  dominated_by: >-
    As an ATTACK: mounts none, so it is dominated by every row of the
    prime-field frontier on every axis -- rho at p^{1/2} time and O(1) memory
    (KN-TECH-001, KN-TECH-006), BSGS at p^{1/2} time and memory (KN-TECH-031),
    and every recorded index-calculus variant. Checked across time, memory and
    data/query.
    As a COST-MODEL INSTRUMENT for the decomposition step: the incumbents are
    the degree of regularity and first-fall degree (KN-TECH-004, KN-TECH-011).
    This proposal dominates them on STRENGTH OF STATEMENT (solver-independent
    versus solver-specific) and is dominated by them on SCALE and on maturity --
    they are measured today across the DREG grid, this is feasible only at
    m in {3, 4} and small p, and its whole value depends on that comparison
    being made on identical instances.
  sota_delta: >-
    Zero speedup against any attack baseline. Instrument delta, stated as
    numbers: converts N solver-specific degree measurements into 1
    solver-independent bound per instance, over the solver class {F4, F5, XL,
    BooleanSolve, any Groebner-order variant}; costs one Macaulay rank
    computation of dimension binomial(n + D, D) per (instance, D); is feasible
    only at m in {3, 4}, p <= 2^16; and reports a per-instance integer gap
    against the measured F4 degree whose pre-registered decision thresholds are
    "agree within 1" versus "at least 2 apart".

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.75 that Stage 1's extraction succeeds -- the simulation is standard, and
    the risk is variant mismatch rather than falsity. 0.55 that PC degree is
    computable at m = 4 within a reasonable memory budget; m = 3 is near
    certain. 0.5 / 0.35 / 0.15 split across Outcome 1 / Outcome 2 / inconclusive.
    Crucially, the matched-random null is EXPECTED to match, so the most likely
    honest headline is "at toy scale the refutation degree of the decomposition
    system is a function of its shape" -- a controlled null, and a real result
    under docs/inventor-protocol.md section 3.

  id_allocation_provenance: >-
