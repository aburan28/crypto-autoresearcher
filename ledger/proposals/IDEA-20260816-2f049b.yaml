idea:
  id: IDEA-20260816-2f049b
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-16'
  title: 'Before trusting any leak detector, measure its detection power as a surface: plant leaks
    of graded magnitude into an otherwise branch-free routine, sweep the plant size and the trace
    count, and report the minimum detectable leak curve together with the false-positive rate on an
    unplanted matched null.'
  class: control
  claim: '(A) THE OBJECT IS THE DETECTOR, NOT THE CODE. A leak detector -- static, dynamic, or statistical
    -- is a decision function D(artifact, budget) returning fire or not-fire. Its usable content is
    not its verdict on any one artifact but its DETECTION POWER SURFACE: the probability that it fires,
    as a joint function of the magnitude of a planted leak and the observation budget. This proposal
    claims that surface is measurable in this environment for a dynamic trace-based detector, at low
    cost, and that without it no leak-detection verdict in this portfolio is interpretable in either
    direction. (B) THE GRADING. Leak magnitude is graded concretely, not qualitatively: a planted
    leak of grade (m, w) executes m secret-dependent branch events per invocation, each carrying w
    bits of the secret, inside a routine that is otherwise branch-free by construction. Grade (0,
    0) is the unplanted null. The grades form a lattice and the detector''s fire-rate is measured
    at each cell. (C) THE TWO NUMBERS THAT MATTER. From the surface, two derived quantities: the MINIMUM
    DETECTABLE LEAK at a given budget -- the smallest (m, w) whose fire-rate reaches 0.8 -- and the
    FALSE-POSITIVE RATE at grade (0,0), measured over independent seeds rather than assumed to be
    the nominal alpha. (D) WHAT IS NOT CLAIMED. No claim that any real implementation leaks; no claim
    about physical channels; no claim that a detector validated here is valid on compiled code, on
    a different language, or against an adversary with a different observation. The surface is a property
    of ONE detector on ONE family of artifacts in ONE environment. A detector that passes this calibration
    is licensed only to report ''no leak above the measured minimum detectable grade'', which is a
    weaker and more useful statement than ''constant-time''. (E) WHY THE NEGATIVE IS USABLE. If the
    surface shows the detector cannot reach small grades at any affordable budget, that is a measured
    obstruction with a number attached: it tells every later record exactly what class of leak this
    program is blind to, which is precisely the honest content of a leakage claim made in an environment
    with no physical measurement capability.'
  mechanism: 'STAGE 1: build a branch-free base routine whose control flow provably does not depend
    on its secret argument -- a fixed-length arithmetic pipeline with no conditionals and no secret-indexed
    subscripts. Verify by inspection of its disassembly, then by the determinism of its traced event
    string across secrets. STAGE 2: build a planting harness that injects, at a chosen point, m occurrences
    of a conditional whose predicate is a w-bit function of the secret, with the taken and not-taken
    sides doing observationally distinct but arithmetically irrelevant work. The plant is parameterised,
    so grade is a dial rather than a rewrite. STAGE 3: for each grade cell (m in {0,1,2,4,8,16}, w
    in {1,2,3}) and each budget (trace count N in {100, 400, 1600, 6400}), run the detector R independent
    times with independent seeds and record fire or not-fire. STAGE 4: the fire-rate per cell, with
    a binomial confidence interval, is the surface. STAGE 5: read off the minimum detectable grade
    per budget and the (0,0) false-positive rate. STAGE 6: check monotonicity -- fire-rate must be
    non-decreasing in m, in w and in N. A surface that is non-monotone is evidence the detector is
    responding to something other than the plant, and the run reports that rather than the surface.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-INSTR-f8faa0 in full, whose decision_target is exactly 'an instrument that cannot
      detect a planted signal cannot support a negative, and one that fires on a matched null cannot
      support a positive'. Grepped ledger/proposals/ and ledger/hypotheses/ for 'constant-time', 'leak',
      'detector', 'planted', 'fault grade', 'success rate per fault', 'granularity', 'taint'. Read
      titles of IDEA-20260816-50d270, IDEA-20260816-967721, IDEA-20260813-945a67, IDEA-20260816-b6de60.
      Listed ledger/hypotheses/ for H-INSTR-* records.
    results: The planted-signal-plus-matched-null discipline is the explicit charter of RQ-INSTR-f8faa0
      and appears throughout the portfolio; H-INSTR-444c7b and H-INSTR-fffbfb exist as instrument
      hypotheses. IDEA-20260816-50d270 applies calibrated seeded mutations to a decoder implementation,
      which is the same calibration philosophy on a different instrument. 'fault grade' and 'success
      rate per fault' return zero hits. No record was found that treats a LEAK DETECTOR as the object
      and measures its power surface; the existing instrument-validity work in this repository targets
      solvers, decoders and statistical estimators, not detectors of secret-dependence.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Assembled from known parts:
      power-surface calibration of a detector by planted signals of graded magnitude is standard experimental
      method and is already this repository''s stated instrument policy (RQ-INSTR-f8faa0); seeded-mutation
      calibration is already used in IDEA-20260816-50d270. Claimed new only within this repository:
      making a secret-dependence detector itself the tracked object and reporting a two-dimensional
      minimum-detectable-leak surface rather than a pass/fail verdict.'
  object_first_candidate:
    tracked_object: The detector's fire-indicator F(grade, budget, seed) in {0,1}, followed across
      the grade lattice and the budget ladder. The object is a function on a product of two small
      finite sets, and the measurement is its expectation on each cell.
    lossiness: 'Genuinely lossy with respect to the artifact: everything about the planted routine
      except the pair (m, w) is discarded -- the arithmetic it computes, the values it moves, the
      order of its instructions. What is retained is the grade coordinate. The projection is compatible
      with the operation being studied because the detector''s input is derived from execution events,
      and the plant was constructed so that (m, w) is exactly the parameter controlling how many secret-dependent
      events occur and how much secret each carries. Two artifacts with the same grade but different
      arithmetic should therefore produce the same fire-rate; that this holds is itself a checkable
      prediction and is included as a control.'
    propagation: Increasing m by one adds one secret-dependent branch event to every traced invocation,
      which under an additive-information model adds w bits of the secret to the observation, up to
      saturation at the secret's own entropy. Increasing the budget N by a factor of four halves the
      estimator's floor in the standard root-N regime. One step of either dial therefore acts on the
      detector's input in a stated, predicted way, and the run checks whether it does.
    survival_score: Stated as the smallest grade whose fire-rate stays at or above 0.8 -- the point
      at which the object still registers -- and the largest grade at which the fire-rate is indistinguishable
      from the (0,0) null, which is where the structure dissolves. The gap between those two grades
      is the detector's blind band and is the number this proposal exists to produce.
  null_object_control: 'The grade-(0,0) cell IS the null object: the identical branch-free routine,
    run through the identical detector at the identical budget with the identical seeds, with no plant
    inserted. Executed in the same invocation as every signal cell, interleaved rather than batched,
    so that any environment drift affects both arms equally. For the surface to mean anything the
    null must show a fire-rate consistent with the detector''s nominal false-positive rate -- pre-registered
    at 0.05 -- with its binomial interval containing that value. A null cell that fires at 0.3 makes
    every signal cell uninterpretable, and the run reports the detector as uncalibrated rather than
    reporting a surface. A second null arm swaps the secret argument for a public constant, so that
    grade and secret-dependence are dissociated.'
  discriminated_from:
  - 'IDEA-20260816-50d270 (independent second decoder implementation cross-checked bit-for-bit, calibrated
    by seeded mutations with predicted effect sizes): same calibration logic, different instrument
    and different failure mode -- that proposal calibrates AGREEMENT between two implementations,
    this one calibrates the DETECTION POWER of a single decision function, and its output is a surface
    rather than a cross-check.'
  - 'The execution-trace mutual-information estimator proposed elsewhere in this batch: that proposal
    estimates a quantity on real routines; this one measures whether any such estimator, used as a
    detector with a threshold, has usable power, and would be run BEFORE trusting the other''s negatives.'
  - 'The 15+ existing RQ-INSTR-f8faa0 proposals on machine variance and single-machine timing cost:
    this measures no time and its statistic is deterministic given inputs, so machine variance is
    not a component of its error.'
  - 'Static constant-time checkers as a category: a static checker''s power surface is not measured
    by trace count and its false positives arise from over-approximation, not from sampling; the method
    here is specific to sampling detectors and does not transfer to a static tool without redefinition
    of ''budget''.'
  assumptions:
  - A planted conditional of grade (m, w) is a faithful stand-in for the class of real secret-dependent
    branches the detector would face; a real leak with different structure could sit outside the measured
    surface.
  - The base routine is genuinely branch-free at the level the detector observes, verified by disassembly
    and by trace determinism rather than asserted.
  - Fire-rate at a cell is stationary across the R independent seeds, so a binomial model of the cell
    is appropriate.
  - The detector's threshold is fixed before the surface is measured and not tuned to the results.
  - Monotonicity in m, w and N is the correct expected behaviour; a detector could legitimately be
    non-monotone in w and the run must be able to say so.
  predictions:
  - metric: fire-rate at the grade-(0,0) null cell
    direction: lower
    minimum_effect: forced value 0.05, the pre-registered nominal false-positive rate, with the binomial
      95 percent interval over R=200 seeds required to contain it
  - metric: fire-rate at grade (16, 3) with budget N=6400
    direction: higher
    minimum_effect: 0.95
  - metric: minimum detectable m at w=1 and N=1600, defined as the smallest m with fire-rate at or
      above 0.8
    direction: different
    minimum_effect: 'no pre-commitment: this is the number the experiment exists to produce, and pre-committing
      it would make the run confirmatory rather than calibrating'
  - metric: monotonicity of fire-rate in N at fixed grade
    direction: higher
    minimum_effect: 'forced: non-decreasing across the four budgets at every grade with m>0, within
      binomial error'
  minimal_test:
    design: 'Fix one branch-free base routine, one detector with one frozen threshold, and one plant
      generator. Sweep m in {0, 1, 4, 16} and w in {1, 3} -- eight cells including two null cells
      -- at budgets N in {400, 6400}, with R=200 independent seeds per cell. That is 3200 detector
      invocations, each cheap because the base routine is a few hundred operations. Interleave null
      and signal cells so drift is shared. The discriminating output is the pair (null fire-rate,
      minimum detectable m at N=6400): if the null fires at nominal and m=1 is already detected at
      N=6400, the detector is strong and a full surface is worth measuring; if the null fires at nominal
      but even m=16 is missed, that is the measured obstruction and the full surface is not worth
      its cost. Either outcome is a completed deliverable at a few core-minutes.'
    controls:
    - Grade-(0,0) unplanted null, interleaved with signal cells and sharing seeds.
    - 'Public-constant-secret null: plant present at grade (m,w) but the branch predicate reads a
      public constant, so grade and secret-dependence are dissociated.'
    - 'Arithmetic-invariance control: two plants at the same grade with different irrelevant arithmetic
      must yield fire-rates whose intervals overlap.'
    - 'Threshold-freeze control: the detector threshold is recorded before any cell is run and its
      hash is stored in the run record.'
    - 'Seed-independence control: the R seeds are drawn from a recorded master seed and the fire-indicator
      series is checked for autocorrelation.'
    required_metrics:
    - fire-rate per (grade, budget) cell with binomial 95 percent interval
    - false-positive rate at grade (0,0)
    - minimum detectable m per (w, budget)
    - 'blind-band width: largest grade indistinguishable from null minus smallest reliably detected
      grade'
    - monotonicity violations count across the surface
    - per-cell wall time, reported as cost only
  falsification_conditions:
  - 'The grade-(0,0) null fires at a rate whose interval excludes the nominal 0.05: the detector is
    uncalibrated and no surface is reportable.'
  - The public-constant-secret null fires at the same rate as the matched signal cell, showing the
    detector responds to the plant's presence rather than to secret-dependence.
  - Fire-rate is non-monotone in N at more than one cell beyond binomial error.
  - Two plants at the same grade with different arithmetic give non-overlapping fire-rate intervals,
    showing grade is not the controlling coordinate.
  - The detector fires at 1.0 on every cell including the null, indicating a degenerate threshold.
  confounders:
  - The plant may change execution time or trace length in ways the detector keys on incidentally,
    rather than through the secret dependence.
  - A base routine believed branch-free may contain a hidden conditional in an interpreter fast path,
    making the null cell not actually null.
  - Seeds shared between arms reduce variance but can create correlated failures that a binomial interval
    understates.
  - 'Saturation: once w bits exceed the label''s entropy, further increases in w change nothing, which
    can look like non-monotonicity.'
  - Choosing the threshold to make the null fire at 0.05 and then reporting the null fire-rate as
    0.05 is circular; the threshold must come from an independent rule.
  interpretation_limits:
  - The surface characterises one detector on one artifact family in one environment; it does not
    transfer to compiled code or to a different observation model.
  - A detector that passes calibration is licensed to report 'no leak above the measured minimum detectable
    grade', never 'constant-time'.
  - Planted leaks are constructed and may be systematically easier or harder than naturally occurring
    ones; the surface is an estimate on a synthetic family.
  - No statement about any deployed implementation follows from any cell of this surface.
  target_complexity:
    time_exponent: No attack exponent is claimed. This measures a detector, not an algorithm against
      a cryptosystem.
    memory_exponent: No attack exponent is claimed. The surface itself is a table of at most a few
      dozen cells.
    best_known: 'Within this repository, the incumbent is the general planted-signal-and-matched-null
      policy stated in RQ-INSTR-f8faa0 and instantiated for solvers and decoders (for example the
      seeded-mutation calibration in IDEA-20260816-50d270). The incumbent for LEAK detectors specifically
      is: nothing, since the portfolio survey found no contract measuring any side channel at all.'
    hidden_overhead: 'The dominant hidden cost is the construction of a genuinely branch-free base
      routine: it is easy to write something that looks branch-free and is not, and the effort of
      verifying it dwarfs the compute. A second hidden cost is that the surface is only as meaningful
      as the plant family is representative, and representativeness cannot be measured from inside
      the experiment.'
  dominated_by: n/a (no result claimed). No attack cost is produced. Every frontier axis -- time,
    memory, data/queries -- was considered and none applies, because the output is a detector power
    surface and not a point in an attack cost space. The nearest cost-bearing object in this repository
    is the nonce-leakage frontier of IDEA-20260815-1ac849, which this neither joins nor competes with.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the deliverable
    replaces an unquantified detector verdict with a measured false-positive rate and a minimum-detectable-grade
    number, moving from an unstated power to a number with a binomial confidence interval at a stated
    budget. No attack timing, memory or query count changes.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the grade-(0,0) null fires at approximately nominal, i.e. the detector
    is not grossly miscalibrated: 0.7, because a threshold chosen by an independent rule on a deterministic
    statistic ought to behave, but featureisation artifacts are a real risk. That the surface is monotone
    in m and N: 0.8, since the plant adds events additively by construction. That a small grade (m=1,
    w=1) is detectable at an affordable budget: 0.35, because one extra branch event per invocation
    is a very small perturbation of a fixed-width feature vector and the estimator floor may swamp
    it. That the resulting numbers are actually used to qualify a later leakage claim in this portfolio
    rather than being filed and forgotten: 0.4.'
