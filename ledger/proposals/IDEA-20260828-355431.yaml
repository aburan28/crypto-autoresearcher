  assumptions:
    - >-
      That a toy AES-shaped SPN (Rijndael-structured layers over a small
      field, e.g. GF(2^4) with a 2x2 or similar nibble grid) can be
      implemented as a bijection for every key without touching the pinned
      FIPS-197 ground truth; it is a separate code path.
    - >-
      That N = 2^n for the chosen n (<= ~24) is exhaustible within the
      measured resource envelope for the required number of keys (hundreds to
      low thousands); this is a budget question the rank-3 measured-envelope
      receipt (named in RQ-AES-002's constraint block) must confirm before a
      large n is attempted.

  proof_search_map:
    not_applicable_reason: >-
      This is an empirical, toy-scale statistical measurement against an
      exact combinatorial null, not an asymptotic complexity claim, a
      certificate family, a reduction, or a closure argument about full-round
      AES. No proof_search_map audit is applicable; the "proof" content here
      is the exact Cauchy-formula derivation stated in the mechanism, which is
      checkable by hand and is not the subject of a quantifier or
      baseline-embedding audit in the KN-TECH-080 sense.

  predictions:
    - metric: mean_fixed_point_count (over >= 1000 independent keys, full round count)
      direction: different
      minimum_effect: >-
        NULL VALUE EXACTLY 1.0 for any N (forced, not asymptotic). A
        measured mean outside a pre-registered +/- 3-standard-error band
        (band width depends on N and sample count, computed before the run)
        is the signal.
    - metric: mean_longest_cycle_fraction (over >= 1000 independent keys, full round count)
      direction: different
      minimum_effect: >-
        PREDICTED approx 0.62433 (Golomb-Dickman constant), converging as N
        grows; reported alongside its known finite-N correction if derivable,
        or flagged as an asymptotic-only prediction if not.
    - metric: chi_square_statistic_vs_exact_Ewens_cycle_count_distribution (per round, per n)
      direction: lower
      minimum_effect: >-
        Predicted NOT to exceed its chi-square critical value at the chosen
        significance level, at the full round count, for a PRP-consistent
        object. Any round at which it DOES exceed the critical value,
        replicated on an independent key batch, is the candidate signal.
    - metric: round_count_decay_of_deviation (graded ladder r = 1..R)
      direction: lower
      minimum_effect: >-
        NO NUMERIC VALUE PRE-REGISTERED (pre-registering a guessed death round
        would invite fitting); the pre-registered SHAPE is that deviation from
        the exact null is monotone non-increasing in r once it begins to
        fall. A non-monotone profile is the canonical artifact tell
        (docs/inventor-protocol.md section 3) and halts interpretation.
    - metric: xor_involution_positive_control_cycle_type (E_K(x) = x XOR K, K != 0)
      direction: different
      minimum_effect: >-
        FORCED EXACTLY: every cycle has length exactly 2 (a fixed-point-free
        involution), i.e. N/2 two-cycles and zero cycles of any other length.
        This is maximally far from the random-permutation null (which has
        E[2-cycles] = 1/2, not N/2) and MUST be detected; failure to detect it
        means the instrument is broken and no other reading may be reported.

  minimal_test:
    design: >-
      Five stages, cheapest first, each able to terminate the line. STAGE 0
      (seconds, can end the line): implement the toy SPN as a separate code
      path; verify it is a bijection for every tested key by exhaustive
      enumeration at the smallest n; re-run the pinned FIPS-197 known-answer
      vectors afterward to confirm no contamination. STAGE 1 (seconds): the
      XOR-involution positive control (forced 2-cycle-only structure) and a
      TRUE random-permutation calibration (a Fisher-Yates-shuffled table,
      independent of any cipher) checked against the exact Cauchy formula -
      both must pass before anything else is read. STAGE 2 (minutes): the
      round-count ladder r = 1..R at n = 16 (Mini-AES-shaped grid, N =
      65,536), >= 1000 keys per round, recording fixed-point count, k-cycle
      counts for small k, longest-cycle fraction, and the chi-square
      statistic against the exact null. STAGE 3 (as budget permits): repeat
      at a second, larger n if the measured envelope receipt licenses it.
      STAGE 4 (paper): write the scoped validation/barrier statement.
    controls:
      - >-
        POSITIVE CONTROL THAT MUST FIRE: the XOR-involution E_K(x) = x xor K,
        forced to exactly N/2 two-cycles and nothing else. If the instrument
        does not detect this as maximally non-random, it is broken and no
        negative result may be reported.
      - >-
        NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL: a genuine
        Fisher-Yates-shuffled random permutation on the same N, read through
        the identical cycle-tracing code. Forced value: exact Cauchy-formula
        agreement. If the null itself does not match its own exact formula,
        the cycle-tracing code is wrong and nothing downstream may be
        trusted.
      - >-
        SIBLING NULL THAT ISOLATES THE PROPERTY: the SAME toy SPN with its
        S-box replaced by a uniformly random bijection on the small field,
        everything else identical (mirrors EV-AES-005's and
        IDEA-20260805-62359f's sibling-null practice). If this reproduces the
        AES-shaped S-box's profile exactly, any observed statistic is a
        property of the ROUND GEOMETRY, not of the specific S-box, and every
        sentence about the result must say so.
      - >-
        GRADED CONTROL, round ladder r = 1..R with monotonicity reported, per
        RQ-AES-002's mandatory round-count decay check.
      - >-
        ORDERING CONTROL: positive control and null-object readings are
        computed and hash-committed BEFORE the treatment (real toy-SPN)
        readings are looked at.
      - >-
        ARCHIVE CHECK (zero compute): no prior record in this repository
        measures a cycle-type statistic for any AES-shaped object; recorded as
        unavailable rather than claimed as a passed check.
    required_metrics: [exact chi-square / KS statistic vs the Cauchy/Ewens null per round per n, fixed-point count distribution mean and variance per round, longest-cycle-fraction mean per round vs the Golomb-Dickman constant, positive-control and null-object readings committed before treatment, sibling-null random S-box comparison, monotonicity verdict of the round-count ladder]

  falsification_conditions:
    - >-
      The true-random-permutation calibration does not match the exact Cauchy
      formula. The cycle-tracing implementation is wrong; nothing downstream
      stands.
    - >-
      The XOR-involution positive control is not detected as maximally
      non-random. Instrument broken; no negative result may be reported.
    - >-
      Deviation from the null is non-monotone in the round-count ladder. The
      canonical artifact tell has fired; halt and report as an artifact.
    - >-
      The sibling null (random S-box) reproduces the AES-shaped S-box's
      profile exactly at every round; whatever is measured is then a property
      of round geometry, not of the S-box, and must be stated as such
      everywhere the reading appears.
    - >-
      A replicated, statistically significant deviation from the exact null
      persists at the full round count after all controls pass. This is the
      candidate signal; it is reported as a TOY-SCALE anomaly only, is
      explicitly NOT a claim about real AES at any round count, and per
      AGENTS.md rule 12 a claim framed as contradicting the PRP design goal
      routes to independent xhigh/breakthrough-tier review before any stronger
      language is used.

  confounders:
    - >-
      SMALL-SCALE ARTIFACT RISK. Small-scale AES-shaped variants are known in
      the algebraic-cryptanalysis literature (Cid-Murphy-Robshaw small-scale
      Rijndael, recalled_unverified as prior art for the general construction
      style, not for this specific use) to sometimes carry structural
      relations absent at full block size purely because the field/grid is
      small. A toy-scale deviation could therefore be an artifact of scale
      rather than a property that would recur at n = 128, and this is stated
      as a hard interpretation limit, not resolved by this experiment.
    - >-
      FINITE-N VS ASYMPTOTIC CONFUSION. The Cauchy formula used for k-cycle
      means is EXACT at finite N; the Golomb-Dickman constant is an
      asymptotic (N -> infinity) limit. Reports must not present the second as
      exact at small N; the finite-N correction, if used, must be derived and
      cited separately.
    - >-
      SAMPLE REUSE / SEED CORRELATION across round counts or block sizes.
      Declared pre-run: independent seed streams per (round, n, arm) cell.
    - >-
      COMPUTE COST GROWTH IN n. Doubling n roughly doubles memory and can more
      than double time depending on the permutation-following implementation;
      the largest n attempted is gated by the measured-envelope receipt, not
      by ambition.

  interpretation_limits:
    - >-
      TOY TIER ONLY, unconditionally (RQ-AES-002 R7). No statement here is a
      statement about AES-128/192/256 at 10/12/14 rounds. A clean pass
      licenses exactly one sentence: "this toy AES-shaped SPN's full-round
      keyed permutation is statistically consistent with a Haar-random
      permutation on cycle-type statistics, at the tested n and key sample
      size." Nothing more.
    - >-
      A negative closes ONLY the named object class: "cycle-type deviation
      from the exact Cauchy/Ewens null, this SPN family, this n, this round
      range, this instrument, this budget." It is not a universal
      impossibility claim (forbidden outright by RQ-AES-002 R7) and names
      forward guidance: larger n if budget permits; the Courtois-Bard-Ault
      ITERATED-cipher mechanism as a genuinely different next instrument that
      this proposal does not attempt; and per-key-class (weak-key) breakdowns
      of the same statistics, which this proposal averages over and does not
      isolate.
    - >-
      A positive (replicated deviation) is a toy-scale anomaly requiring its
      own investigation before any stronger language; it is explicitly not
      converted into a distinguisher or key-recovery claim by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For K drawn uniformly from the key space of the toy SPN, and for the
        SPN run at its full round count, the cycle type of E_K is distributed
        (over the randomness of K, in aggregate across many keys) consistently
        with the exact Cauchy/Ewens-theta=1 distribution for a uniform random
        element of Sym({0,1}^n), on the specific statistics measured (k-cycle
        counts for small k, fixed-point count, longest-cycle fraction).
      rigorous_support: >-
        The NULL side is exact and proved (Cauchy's formula, an exact
        combinatorial identity, not an approximation). The heuristic content
        is entirely on the CIPHER side: that a specific, structured,
        key-parameterized permutation (drawn from a vanishingly small subset
        of Sym(N)) behaves like a Haar-random draw on these particular
        statistics. This is exactly the classical PRP/ideal-cipher heuristic
        underlying block cipher design, restated as a concrete numeric
        prediction rather than asserted qualitatively.
      validation_plan: >-
        Exhaustive enumeration of the FULL domain (N = 2^n, n <= ~24) for each
        of >= 1000 independent keys per round count r = 1..R, at a toy
        AES-shaped SPN built for this purpose; comparison of the empirical
        distribution of small-k cycle counts, fixed-point count, and
        longest-cycle fraction against the exact Cauchy/Ewens predictions via
        chi-square/KS tests; tail check on the single most extreme sample
        (e.g. the key whose permutation has the most fixed points, compared
        against its exact tail probability under the null). Transfer
        assumption stated explicitly: NONE of this transfers to n = 128
        without further argument, and none is claimed.

  target_complexity:
    time_exponent: >-
      NOT AN ATTACK; no exponent against exhaustive key search is claimed or
      moved. Reading the cycle type of one key's permutation costs EXACTLY N =
      2^n permutation evaluations (visiting every domain point once), which at
      n = 128 (real AES) is >= 2^128 - at or above the definitional
      exhaustive-key-search reference itself, so this instrument can never be
      competitive as an attack and is not proposed as one.
    memory_exponent: >-
      O(2^n) bits minimum, to mark visited points; negligible at the toy n
      used here (n <= ~24, at most a few MB) and explicitly INFEASIBLE at n =
      128, stated beside time as required.
    best_known: >-
      For AES, the reference remains exhaustive key search at the stated key
      size under the frozen cost model CM-1, and the published state of the
      art is UNADJUDICABLE in this environment, asserted in neither direction.
      For this toy instrument there is no "best known" competitor; it is a
      validation/measurement tool, not an attack.
    hidden_overhead: >-
      None hidden: the O(2^n) cost is stated exactly and is the entire cost of
      a reading; there is no asymptotic notation hiding anything further.
    tradeoff_note: >-
      None applicable in the time-memory-tradeoff sense of an attack; the
      instrument has no data axis either (it consumes the entire codebook by
      construction, at whatever n is chosen), which is precisely why it can
      only ever be a toy-scale artifact and never a cryptographic-scale one.

  dominated_by: >-
    "unresolvable in this environment: no primary source reachable; every
    recalled frontier row is unverified-from-memory". Set to this string and
    NEVER to null, per RQ-AES-002 claim_tier_ceiling R5. Rows checked INSIDE
    this repository, across time, memory and data/queries: EV-AES-001..005,
    EV-AES-d33b1c, EV-AES-d8a13e; KN-FIND-028, KN-FIND-029; KN-TECH-063/069/
    070/071/074/075/079; the five prior RQ-AES-002 proposals
    (IDEA-20260805-8053e1, -62359f, -4bd60c, -01dfba, IDEA-20260808-ddb522);
    the experiment index (no AES-prefixed experiment exists). None measures a
    cycle-type statistic of any AES-shaped keyed permutation. NOTE, RECORDED
    HONESTLY: unlike prior RQ-AES-002 sessions, this session's WebSearch/
    WebFetch tools DID reach arxiv.org (both 2506.23050 and 0905.3682 were
    fetched at the abstract level), which appears to contradict RQ-AES-002's
    provenance claim that eprint/arxiv are unreachable under "this harness's
    network policy" - this is flagged to the Coordinator as a possible R6(i)
    opening (a primary source becoming readable) rather than acted on here,
    since neither fetch was hashed and archived under inputs/<ID>/ as R6(i)
    requires, and neither result is used in any comparison against the AES
    definitional reference or any recalled SOTA figure.
  sota_delta: >-
    DEFINITIONAL-REFERENCE DELTA: ZERO. This proposal claims no attack and no
    margin of any kind against exhaustive key search at any key size under
    CM-1, and the published-state-of-the-art comparison is UNADJUDICABLE in
    this environment and is asserted in neither direction (R5 clause, same
    sentence). The quantitative contribution, if the experiment runs, is a
    validated (or falsified) toy-scale PRP-consistency instrument with exact
    calibration against the Cauchy/Ewens null - a control artifact, not a
    margin.

