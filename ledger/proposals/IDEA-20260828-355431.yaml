idea:
  id: IDEA-20260828-355431
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  title: >-
    The full-round-count cycle-type of the keyed permutation on toy-scale
    AES-shaped SPNs, tested against the EXACT Cauchy/Ewens null for a uniform
    random permutation - a whole-permutation instrument orthogonal to every
    off-limits family, distinct from Courtois-Bard-Ault's iterated-cipher
    periodicity attack, and honestly bounded to a toy tier it cannot escape.
  class: control

  claim: >-
    For a "toy" AES-shaped SPN (SubBytes/ShiftRows/MixColumns/AddRoundKey with
    a Rijndael-structured key schedule, all instantiated over a small field
    GF(2^4) or a small nibble/byte grid so the WHOLE state space of size
    N = 2^n is exhaustible on this machine, n <= ~24), run at its OWN full
    round count for a graded sequence of round counts r = 1..R, the CYCLE TYPE
    of the fixed-key permutation E_K: {0,1}^n -> {0,1}^n - the multiset of
    cycle lengths obtained by following every point to its orbit - has an
    EXACT null distribution when E_K is modeled as a uniform random element of
    Sym({0,1}^n): the Cauchy/Ewens-theta=1 formula P(cycle type
    (a_1,...,a_N)) = 1 / prod_k (k^{a_k} a_k!) for sum k a_k = N, which gives
    EXACT (not asymptotic) values for the number of k-cycles (mean exactly
    1/k for every k <= N), the fixed-point count (mean exactly 1, Poisson(1)
    in the N -> infinity limit), and the longest-cycle fraction (mean
    converging to the Golomb-Dickman constant approx 0.62433, itself governed
    by the Dickman rho function - the same classical object the target
    profile's exemplar heuristic is built on). CLAIM: measuring these
    statistics over many random keys, at the SPN's full round count and at a
    graded ladder of smaller round counts, discriminates between (H_a) "the
    keyed permutation is statistically indistinguishable from a Haar-random
    permutation on cycle-type statistics at the full round count" (the
    expected, PRP-consistent outcome, itself only a toy-scale corroboration of
    the standing security assumption) and (H_b) "a detectable, replicated
    deviation from the exact null persists at the full round count" (a
    structural anomaly requiring escalation). NEITHER outcome is a statement
    about real AES-128/192/256; the object exists only at toy block sizes and
    the transfer gap is stated explicitly below.

  object_first_candidate:
    tracked_object: >-
      The CYCLE TYPE of the whole keyed permutation E_K on its full domain
      {0,1}^n, for a fixed key K and a fixed round count r - a single global,
      order-forgetting statistic (a partition of N = 2^n) obtained only after
      the ENTIRE permutation has been traced. This is not a per-round,
      per-pair, or per-coset object followed through partial encryption; it is
      a whole-map invariant computed once E_K is fully specified.
    established_families_off_limits: >-
      All twelve families in RQ-AES-002's objects_declared_off_limits_as_the_primary_lens
      are off-limits as the primary lens and none is used: differential and
      truncated differential; linear and multidimensional linear; integral /
      square / division property; impossible differential; meet-in-the-middle
      and Demirci-Selcuk; boomerang and retracing boomerang; biclique;
      algebraic (XSL-family) and Groebner-basis; yoyo; mixture differential /
      exchange-attack; subspace trail; partial sums. Cycle type of the FULL
      permutation is none of these: it is not a pair-difference, not a parity
      bit, not a balance/degree statistic on a subset, not a table-keyed
      collision search, not a polynomial-system variable, not a coset
      subspace, and it requires no chosen-plaintext structure at all - it
      requires the WHOLE codebook for one key, which is exactly why it can
      only ever be a toy-scale instrument. THE NEAREST NON-OFF-LIST PRIOR
      ART, actively searched and found this session: Courtois, Bard and Ault,
      "Statistics of Random Permutations and the Cryptanalysis of Periodic
      Block Ciphers" (arXiv:0905.3682 / eprint 2009/186), which uses the
      Strong Cycle Structure Theorem to build a distinguishing/key-recovery
      attack against ITERATED application of a cipher (E_K composed with
      itself on the order of a million times, with the iteration count chosen
      highly composite) - a fundamentally different mechanism from a
      single-application cycle-type reading, confirmed by direct query of
      that paper's abstract this session (WebFetch, 2026-08-28): "the paper
      does not study single full-round cycle statistics directly... it
      analyzes the cumulative cycle behavior of ITERATED applications." This
      proposal deliberately does NOT iterate the cipher; it reads the cycle
      type of ONE application at the SPN's own full round count, which
      Courtois-Bard-Ault's mechanism does not measure and does not need.
    newness_score: >-
      The GENERAL TOOL - permutation cycle statistics as a cryptanalytic
      instrument - is known and cited above; this is therefore an
      ADAPTATION, not a genuinely new conjecture, and is labeled as such. What
      is not found in this repository or in the searched literature is the
      specific application: a single-application, full-round-count,
      EXACT-Cauchy-formula calibrated cycle-type reading used as a PRP-
      consistency validation instrument for AES-shaped toy SPNs, feeding a
      C3-style scoped statement. External literature was actively searched
      this session (WebSearch + WebFetch); novelty against it beyond the one
      found paper is UNRESOLVED and is not claimed in either direction.
    testability_score: >-
      High at the chosen scale. Tracing the full cycle decomposition of a
      permutation on N = 2^n points costs exactly N permutation evaluations
      (each point visited once) plus O(N) bits of visited-marking memory; at
      n = 16 (a 2x2-nibble, GF(2^4) Mini-AES-shaped grid, N = 65,536) this is
      trivial, and at n up to about 24 (16.7 million points, at most a few MB
      of marking memory) it remains comfortably inside the declared 15 GB / 4
      core envelope for hundreds of keys. The positive control (a
      deliberately non-PRP object, see below) is exact and cheap.
    survival_score: >-
      Expected LOW for finding a genuine deviation, stated honestly rather
      than discovered later: a well-designed full-round SPN, even a toy one,
      is exactly what the PRP paradigm predicts should pass this test. The
      instrument is valuable primarily as a validated NULL-MODEL / positive-
      control artifact (in the spirit of IDEA-20260805-4bd60c's ladder and
      IDEA-20260805-01dfba's verifier audit, both already filed against this
      question) and only secondarily as a candidate distinguisher.

  mechanism: >-
    THE EXACT NULL, DERIVED, NOT ASSUMED. For sigma drawn uniformly from
    Sym(N), the classical Cauchy formula gives the exact distribution of
    cycle type: P(a_1,...,a_N) = 1 / prod_{k=1}^{N} k^{a_k} a_k!, subject to
    sum k a_k = N. Two exact corollaries used as the primary readings: (i) for
    every k <= N, E[number of k-cycles] = 1/k EXACTLY (not asymptotically -
    this is a finite-N identity, provable by a direct symmetry/orbit-counting
    argument, e.g. via the Ewens sampling formula with theta = 1); in
    particular E[fixed points] = 1 exactly for every N >= 1. (ii) The fraction
    of N occupied by the longest cycle converges, as N -> infinity, to the
    Golomb-Dickman constant integral_0^1 exp(integral_x^1 (1/t) dt) dx approx
    0.62433, itself expressible via the Dickman rho function - the identical
    special function underlying the target profile's canonical exemplar
    heuristic, giving this toy instrument a structural family resemblance to
    the profile's preferred validation style even though no smoothness
    problem is involved here.

    THE HEURISTIC BEING PROBED IS EXACTLY "AES IS A GOOD PRP", RESTATED IN
    PERMUTATION-CYCLE LANGUAGE. A block cipher restricted to one key is a
    SPECIFIC permutation chosen from only 2^(key bits) of the 2^n! possible
    permutations on {0,1}^n - a vanishingly small subset. The claim that its
    cycle-type statistics, averaged over keys, match those of a Haar-random
    permutation is not automatic from that fact alone; it is precisely the
    empirical content of the PRP design goal, made into a concrete,
    forced-value, falsifiable numeric prediction rather than a slogan.

    WHY THIS OBJECT CANNOT SCALE TO REAL AES, STATED BEFORE ANY EXPERIMENT.
    Tracing the cycle type of a permutation on {0,1}^128 costs >= 2^128
    encryptions - identical in order to exhaustive key search's WORST case and
    vastly worse than its average case, so this instrument NEVER competes with
    or approaches the definitional exhaustive-key-search reference and is not
    an attack candidate at cryptographic scale under any circumstance. Its
    entire value is as a toy-scale, exactly-calibrated validation instrument,
    exactly the kind of forward guidance docs/inventor-protocol.md section 4
    requires a closure to name.

  novelty_status: unverified

