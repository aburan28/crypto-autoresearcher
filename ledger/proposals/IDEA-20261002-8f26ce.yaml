      verified_by: null
  assumptions:
    - >-
      Only odd-degree f are in scope. Equivalence f ~ f + h^2 + h is
      quotiented out by fixing a normal form before counting, so the hit
      count is a number of normal forms.
    - >-
      A zero hit count is evidence about this family only. Non-Artin-Schreier
      Jacobians and non-Jacobian abelian varieties stay in the census column.
  proof_search_map:
    bottleneck: >-
      Whether P(1) for the Artin-Schreier L-polynomial is 0 mod 131 at
      genus 5 or 6, and, on the ladder, the degree of the eliminant onto x.
    baseline_embedding:
      parameter_slice: >-
        Genus 1: every f of degree 3. The point counts N_1 must lie in
        {1, 2, 3, 4, 5}, the five elliptic classes named by
        IDEA-20260926-80209d. A count outside that set stops the run.
      reproduction_check: >-
        For one retained ladder model, recompute N_1 and N_2 by enumerating
        the field and solving y^2 + y = f(x), and check P(1) against the
        order of the divisor class group on a set of random degree-1 divisors
        closed under the group law, at genus 2 only (the group is small).
    observation_collision:
      observable: the pair (f, P(1) mod 131), and the eliminant in x
      distinct_preimage_search: >-
        Two normal forms with the same P(1) and different eliminant degrees
        are a collision: the Weil polynomial does not determine the degree.
        That collision is the reason an explicit model is a different object
        from a census hit.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The Artin-Schreier subfamily inside the set of genus-5 and genus-6
          curves over F_2, packed with the x-quotient by tau.
        predicted_gain: >-
          A model given by a single polynomial f, in place of a Weil
          polynomial with no equations, plus one eliminant degree on the
          ladder.
    quantifier_order: >-
      Exists f of degree 11 or 13 with 131 dividing P(1), or for all such
      f the residue is nonzero. Separately, for all ladder hits, the
      eliminant degree differs from 6. No claim for a general curve of
      genus 5.
    method_ceiling:
      strongest_certifiable_claim: >-
        A hit or a zero inside this normal-form family, and a degree at one
        ladder prime. The method cannot certify emptiness of all abelian
        varieties of dimension 5 or 6.
      nearby_object_control: >-
        A hyperelliptic model with the same genus and a non-constant h,
        when one exists at the same n, and a random subset of equal
        cardinality. The degree gap has to be absent on the random subset.
    proof_obligations:
      - claim: Genus-1 counts land in {1, 2, 3, 4, 5} before any genus-5 count is kept.
        responsibility: baseline
      - claim: P(1) mod 131 is an exact integer, not a floating Weil estimate.
        responsibility: correctness
      - claim: A zero hit is scoped to odd-degree Artin-Schreier normal forms.
        responsibility: scope
      - claim: The eliminant degree is compared with the subspace arm at equal cardinality.
        responsibility: strictness
    not_applicable_reason: >-
      None. Bottleneck, baseline, collision, transform, quantifier order,
      and ceiling all apply.
  predictions:
    - metric: number of odd-degree Artin-Schreier normal forms of genus 5 or 6 over F_2 with 131 dividing #Jac(F_2)
      direction: different
      minimum_effect: the count is 0 or at least 1, and those two outcomes are different explanations
    - metric: eliminant degree onto x, minus 6, on the first ladder hit
      direction: different
      minimum_effect: absolute difference at least 1
  minimal_test:
    design: >-
      Arithmetic table, allowed at n=131, with no attack: every odd-degree
      f of degree 11 and every odd-degree f of degree 13 over F_2, reduced
      to a frozen normal form under f -> f + h^2 + h and under x -> x + b.
      For each, compute point counts over F_{2^k} for k <= genus by solving
      y^2 + y = f(x), build P(1), and test divisibility by 131. Ladder arm,
      toy only: the same family at the smallest genus whose order is
      divisible by n in {19, 23, 31, 41}, then one fibre elimination onto x
      at m=3. Elliptic target: deterministic Koblitz recipe, output records
      (a, b). Seeds: none. Instrument path: to be written. Null curve over
      F_{2^n} not defined over F_2, equal factor-base size.
    controls:
      - Genus-1 degree-3 census against counts {1, 2, 3, 4, 5}.
      - A second point-count implementation on five fixed polynomials, compared integer-for-integer.
      - Equal-cardinality subspace arm at the ladder n.
      - Random subset of equal cardinality.
      - Null curve.
      - Tau-orbit canonicalisation timed as a single y-addition, predicted cost one field addition.
    required_metrics:
      - hit count at genus 5 (integer)
      - hit count at genus 6 (integer)
      - eliminant degree on the first ladder hit (integer, or unmeasured)
      - first-fall degree (integer, or unmeasured)
      - tau canonicalisation cost (field additions)
    outcomes:
      positive: >-
        The hit count at genus 5 or 6 is at least 1 and the polynomial f is
        written out, or a ladder hit has eliminant degree differing from the
        subspace arm by at least 1 with the random subset showing no such gap.
      negative: >-
        Both hit counts are 0, and every ladder hit that does exist has
        eliminant degree 6. The family supplies neither an order-131 model
        nor a degree gap. Non-Artin-Schreier groups remain open.
      artifact: >-
        The genus-1 check leaves {1, 2, 3, 4, 5}, or the two point-count
        implementations disagree, or no ladder prime divides any order in
        the family. A failed genus-1 check voids the table.
  falsification_conditions:
    - Genus-1 counts escape {1, 2, 3, 4, 5}, voiding the genus formula in this instrument.
    - A reported hit fails the second point-count implementation.
    - A ladder eliminant has degree 6 and the same variable count as the subspace arm.
    - The degree gap appears on the random subset.
  confounders:
    - Normal-form incompleteness can double-count or drop a hit. The normal form is frozen and the genus-1 check has a known image.
    - Point counts over F_{32} and F_{64} are the whole cost; a bug in field arithmetic is the confounder the second implementation exists to catch.
    - Divisibility of #Jac(F_2) by 131 is weaker than an F_2-rational point of order 131 when the group is non-cyclic. The ladder arm checks the order of an explicit divisor class, not only P(1).
  interpretation_limits:
    - A zero is not an emptiness certificate for dimension 5 or 6. That certificate is the census IDEA-20260926-5c26f9.
    - KN-OPEN-020 class: high-degree or implicit-membership. All six costs are charged on the ladder arm. The n=131 arm is a count of models, not a decomposition.
    - The factor-2 tau symmetry is a constant and is not an exponent improvement.
  heuristic_assumptions:
    - id: H1
      statement: >-
        P(1) mod 131 for this family behaves like a uniform random residue
        as f varies over normal forms, so a zero hit count is informative
        about the family and a positive hit has the same chance as 1/131
        per independent normal form.
      rigorous_support: >-
        The Weil bound caps P(1). Uniformity is not proved. The classical
        pattern imitated is equidistribution of character sums in a box,
        in the shape of a Weil-sum angle being uniform on the circle, which
        is false for very small fields and is only a comparison model here.
      validation_plan: >-
        At genus 2, where the group order is at most 33, compare the
        histogram of P(1) over all odd-degree f of degree 5 with the
        achievable-count list of IDEA-20260926-80209d. Tail check: every
        value lies inside the Weil ceiling 33. Transfer of uniformity to
        genus 6 is not assumed; the genus-6 output is the exact count.
  target_complexity:
    time_exponent: >-
      n/2, unchanged by a model count. A ladder degree gap of 1 does not
      change 2^{n/2} / n^{1/2}.
    memory_exponent: >-
      The n=131 arm stores one integer P(1) per normal form. Rho memory is
      unchanged.
    best_known: >-
      Pollard rho ~ 2^{n/2} / n^{1/2} on Koblitz, 2^60.9 at n=131. Index
      calculus has no better proven exponent on prime-degree binary curves
      (KR-IC-9e610d, KR-IC-1fcdbc). Hyperelliptic index calculus
      (KR-IC-a4dd54) is a different discrete log.
    hidden_overhead: >-
      The tau canonicalisation is a factor 2, constant. The Frobenius 1/n
      factor is polynomial in n. Neither is hidden inside o(1).
    tradeoff_note: >-
      No new time-memory tradeoff. The family search is a finite table of
      size 2^{O(g)} normal forms at g <= 6.
