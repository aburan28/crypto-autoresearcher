  title: >-
    Artin-Schreier curves of genus 5 and 6 over F_2 as the explicit-model
    column of the order-131 question, with the x-line eliminant degree on
    the first ladder Jacobian in that family.
  class: measurement
  claim: >-
    The Artin-Schreier family y^2 + y = f(x) over F_2, f of odd degree 11
    or 13, either contains a curve whose Jacobian order is divisible by
    131, in which case the model is an explicit equation the Weil-polynomial
    census does not return, or it contains none. On the first curve in the
    same family whose Jacobian order is divisible by a ladder prime n in
    {19, 23, 31, 41}, the eliminant of the Couveignes fibre onto the
    Artin-Schreier x-coordinate has degree different from 6. The target
    stays in R1. The stage is decomposition. A hit count of zero does not
    exclude non-Artin-Schreier Jacobians.
  mechanism: >-
    Meeting: algebraic number theory (the L-polynomial of an Artin-Schreier
    curve, computed from point counts that are character sums of f) and
    algebraic geometry (the x-projection of the curve, quotient by the
    automorphism y -> y+1).
    OBJECT FRAME. Representation of the elliptic point: R1 x-coordinate in
    F_{2^n}. Representation of the auxiliary point: (x, y) on the
    Artin-Schreier curve, then the Mumford image of its divisor class.
    Operation set Sigma: the Artin-Schreier translation tau(x, y) = (x, y+1),
    order 2, together with translation by an order-n class t on the
    Jacobian. Sigma is not full translation on the target elliptic curve.
    TRICHOTOMY. Partial-action. Reason: the x-coordinate is constant on
    tau-orbits and is a block system of <tau>, and it does not propagate
    under a general Jacobian translation.
    LOSSY-PROJECTION TEST against Sigma = <tau>. Discarded: y. Compatible:
    the fibres of x are the orbits of tau, a block system of <tau>. Lossy:
    a general x has two points, y and y+1, so the projection is not a
    coordinate change.
    PRICE. Quotient canonicalisation of a tau-orbit: one addition of 1 in
    y, a factor 2. That factor does not move the exponent n/2. The open
    number beside it is the eliminant degree onto x.
    OFF-LIMITS COMPONENT. F2 supplies the Semaev stage. Linearized
    quasi-subfield polynomials are not the lens; f here is the curve
    equation, not a splitter in F_2[Galois]. Added: an explicit model at
    genus 5 or 6 when the character sums are divisible by 131, and a degree
    on the ladder. The full Weil census remains the complementary column.
    GHS does not apply: prime n has no intermediate subfield, and this
    curve is not a cover of the target (KR-IC-5ea2f8). The Jacobian
    discrete-log exponent of KR-IC-a4dd54 is not claimed for E.
    FACTOR-BASE ESCAPE. KN-OPEN-020 class: high-degree once the eliminant
    is written, implicit-membership until then. Charges: description is f
    and t; membership is the eliminant; relation is S_3; descent is Weil
    descent to F_2; time and memory are the m=3 Groebner cost against the
    null curve.
    REPRESENTATION CLASS. R1 on the target. The auxiliary curve is R3
    relative to E. Stage: decomposition.
  novelty_status: unverified
