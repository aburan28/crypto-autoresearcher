idea:
  id: IDEA-20260816-03a2f5
  question_id: RQ-NTRU-9015ee
  added: '2026-08-16'
  title: Locate the overstretched transition per instance and without any lattice reduction, as the
    modulus at which the argmax over sublattice rank of the covolume-density advantage function jumps
    from rank one to rank greater than one for the actually sampled key
  class: theory
  claim: '(A) For an NTRU instance with secret (f,g) in a ring R of Z-rank n, modulus q, and lattice
    Lambda_h = {(u,v) in R^2 : v = u h mod q} of dimension 2n and determinant q^n, define for each
    k in 1..n the sublattice L_k generated by the first k rotations {x^i (f,g)}, i = 0..k-1, and the
    covolume-density advantage A(k) = (k/2n) log det(Lambda_h) - log covol(L_k). A(k) > 0 says L_k
    is denser than a balanced primitive rank-k sublattice of a lattice with the same determinant and
    dimension. Every quantity in A(k) is an exact integer determinant of a k x 2n integer matrix''s
    Gram matrix, computable by Bareiss elimination in milliseconds at the dimensions this program
    can reach.

    (B) The claim under test is that k* = argmax_k A(k) is a step function of q with a single jump
    from k* = 1 to k* > 1, that the jump location q_jump is defined per sampled key rather than per
    parameter set, and that the distribution of q_jump over resampled keys at fixed (n, ring, secret
    distribution) is a computable object whose median and interquartile range are candidate zero-compute
    predictors of a measured recovery transition.

    (C) What is NOT claimed: no attack, no speedup, and no security statement about any parameter
    set, deployed or otherwise. A(k) is a heuristic comparator against a balanced-covolume baseline,
    not a theorem about reduction behaviour; whether k* predicts anything about a reduction algorithm''s
    output is exactly what the paired experiment measures, and the honest default is that it does
    not. It is not claimed that q_jump equals any published fatigue point, that a published fatigue
    point exists in any particular form, or that a rank jump implies recoverability. It is also not
    claimed that consecutive rotations are the densest rank-k sub-orbit; that restriction is a stated
    approximation whose cost is measured in (D).

    (D) A secondary claim: the gap between max over consecutive-rotation sub-orbits and max over a
    random sample of k-subsets of all n rotations is small enough (to be measured, no value pre-committed)
    that the cheap canonical choice does not change q_jump by more than one grid step in log q.'
  mechanism: 'Stage 1 is symbolic and costs nothing: write covol(L_k)^2 = det(B_k B_k^T) where B_k
    is the k x 2n integer matrix of rotations of (f,g). For a circulant ring this Gram matrix is the
    k x k autocorrelation matrix of the pair (f,g), so its entries are integer inner products computable
    directly from the coefficient vectors, and its determinant is exact.

    Stage 2 sweeps q on a log grid at fixed n and fixed secret distribution, recomputing A(k) for
    k = 1..n at every grid point. Note that (f,g) does not depend on q, so covol(L_k) is q-independent
    and only the (k/2n) log q^n term moves: A(k) is affine in log q with slope k/2, which means k*
    is determined by an upper envelope of n lines and q_jump is the abscissa of an explicit line crossing.
    This makes the whole object solvable in closed form per key rather than by a grid sweep, and the
    grid sweep becomes a check of the closed form.

    Stage 3 repeats the identical computation on the two matched controls, which is where the claim
    can die: if the independent-plant control produces the same envelope crossing, then q_jump measures
    planted rank rather than ring structure.

    Stage 4 confronts q_jump with recovery. At toy n only, run a bounded reduction at moduli straddling
    the per-key median q_jump and record whether recovery frequency changes across it. Refutation
    is a q_jump whose sign of association with recovery frequency is zero or inverted, and that refutation
    is itself a usable measured obstruction: it says the covolume comparator is not the right locator,
    with a number attached.'
  novelty_status: unverified
  novelty_screen:
    method: Read ledger/questions/RQ-NTRU-9015ee.yaml and knowledge/open-problems/KN-OPEN-026.md in
      full. Listed every proposal with question_id RQ-NTRU-9015ee (grep -l 'RQ-NTRU-9015ee' ledger/proposals/*.yaml)
      and read the title and class of all nine. Ran grep -ril for 'overstretched', 'dense sublattice',
      'fatigue', 'determinant ratio', 'Gram-Schmidt', 'gaussian heuristic', 'unstructured control',
      'matched lattice' over ledger/proposals/ and ledger/hypotheses/. Read docs/inventor-protocol.md
      sections 1-5 and 8.
    results: Nine proposals sit under RQ-NTRU-9015ee. IDEA-20260809-24eec3 detects the dense-sublattice
      event from the post-reduction Gram-Schmidt profile; IDEA-20260809-26de01 measures the transition
      width by recovery sweep; IDEA-20260809-28289c proposes the matched-random and planted-sublattice
      nulls; IDEA-20260809-263751 asks whether the exponent transfers across ring shapes; IDEA-20260809-2b4624
      varies the secret distribution; IDEA-20260809-2976d8 scores the estimator; IDEA-20260809-2d4427
      specifies a recovery certificate; IDEA-20260809-2866e0 covers module and matrix NTRU; IDEA-20260809-2e974b
      plots the correctness-versus-fatigue window. 'determinant ratio' matched only IDEA-20260808-cb0828,
      which is an FN-DSA keygen-rejection proposal under RQ-FNDSA-001 and concerns the conditional
      second moment of a rejected Gaussian, not a rank envelope. No proposal found that computes a
      per-instance rank argmax or an affine-in-log-q envelope crossing.
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      what is published; covolume comparisons against a balanced baseline are elementary and may well
      be standard. What is claimed new relative to this repository is the specific reduction of the
      transition to an upper envelope of n affine functions of log q whose crossing abscissa is a
      per-key scalar, and the treatment of that scalar''s distribution over resampled keys as the
      located quantity. Assembled from known parts: the q-ary NTRU lattice, the rotation orbit, exact
      integer Gram determinants, and the matched controls already proposed in IDEA-20260809-28289c.'
  object_first_candidate:
    tracked_object: The advantage vector A = (A(1), ..., A(n)) attached to one sampled key, together
      with its argmax index k*. Followed through the operation of increasing log q, under which A
      moves as n affine functions with slopes k/2 and fixed intercepts -log covol(L_k).
    lossiness: 'Genuinely lossy, and the loss is stated: A(k) retains only n scalars from a 2n x 2n
      integer basis, discarding all directional information, the entire Gram-Schmidt profile, every
      automorphism relation among the rotations beyond what shows in the determinants, and the identity
      of the secret itself. Many distinct keys map to the same A. The retained part propagates deterministically
      under the one operation that matters here, changing q, because the intercepts are q-independent
      by construction and only the determinant term moves. It does not propagate under lattice reduction:
      reduction does not change A at all, since A is a function of the lattice and the planted orbit,
      not of the basis. That is the design point and also the limitation.'
    propagation: One step of the target operation is a multiplicative step in q on the log grid, log
      q -> log q + delta. Under it A(k) -> A(k) + (k/2) delta exactly, for every k, with no error
      term. Hence the envelope max_k A(k) is convex piecewise-linear in log q and k* is non-decreasing
      in q. The jump is therefore a crossing of two lines, and its abscissa is (2/(k2 - k1)) (log
      covol(L_k2) - log covol(L_k1)) for the two ranks in play.
    survival_score: 'The structure survives exactly as far as the affine model holds, which is all
      q, since it is an identity rather than an approximation. It dissolves at the interface with
      reduction: nothing in A predicts a block size, and the empirical association between k* and
      recovery is expected to survive only in the toy window n <= 40 where recovery can be observed
      at all. The honest survival statement is: exact and unlimited as an identity, unknown and probably
      weak as a predictor beyond the measured window.'
  null_object_control: 'Two nulls, both computed by the identical A(k) code path in the same invocation.
    NULL-1, unplanted: a q-ary lattice Lambda_H from a uniform random n x n matrix H mod q, same dimension
    2n, same determinant q^n, with L_k generated by k vectors drawn from the same distribution as
    the secret and force-embedded by construction of H. NULL-2, independent-plant: the same construction
    but with n planted vectors that are independent samples of the secret distribution rather than
    rotations of one, matching dimension, determinant, planted rank and per-vector norm exactly, so
    the sole difference is ring structure. For the signal arm to mean anything about NTRU rather than
    about planted rank, NULL-2 must produce either no envelope crossing in the swept range or a crossing
    displaced from the NTRU one by more than the per-key interquartile range. If NULL-2 crosses at
    the same place, the correct record is a controlled null: the locator measures planted rank, not
    the ring.'
  discriminated_from:
  - IDEA-20260809-24eec3 reads the dense-sublattice event off the post-reduction profile, which requires
    running reduction and therefore observes rather than predicts; A(k) is a function of the lattice
    alone and is computed before any reduction, so the two can disagree and the disagreement is measurable.
  - IDEA-20260809-26de01 measures the transition width from recovery frequency across q; this entry
    produces a width from the spread of a per-key scalar with no recovery runs at all, so it is a
    different estimator of a related quantity and the two widths can be compared.
  - IDEA-20260809-28289c proposes the two null lattices; this entry consumes them rather than proposing
    them, and adds the requirement that NULL-2 match planted rank and per-vector norm, not only dimension
    and determinant.
  - IDEA-20260808-cb0828 computes a conditional second moment for FN-DSA keygen rejection under RQ-FNDSA-001;
    that is a distributional statement about a rejection rule, not a rank envelope, and it does not
    compare sublattice covolumes at multiple ranks.
  - A generic Gaussian-heuristic sanity check on the secret's norm compares only k = 1; the entire
    content here is that the comparison is taken over all k and that the argmax moves.
  assumptions:
  - The balanced baseline det(Lambda)^{k/2n} is the right null covolume for a primitive rank-k sublattice;
    this is a heuristic, is flagged as a derivation gap, and its failure would shift q_jump by an
    amount computable from whatever the correct baseline is.
  - Consecutive rotations are a fair proxy for the densest rank-k sub-orbit, an approximation whose
    cost is measured rather than assumed.
  - Exact integer arithmetic is available and Bareiss elimination on k x k autocorrelation matrices
    is affordable up to n = 64, so no floating-point conditioning question enters the primary quantity.
  - The secret (f,g) is available in the clear, which is true by construction because the program
    generates its own instances and never attacks a real key.
  predictions:
  - metric: fraction of sampled keys for which the upper envelope of the n affine functions has exactly
      one crossing in the swept log q range
    direction: higher
    minimum_effect: 0.9
  - metric: interquartile range of q_jump over 200 resampled keys, in log2 q units, at fixed n
    direction: different
    minimum_effect: 'no pre-commitment: this is the quantity being measured for the first time in
      this repository and pre-committing a width would be inventing a number'
  - metric: displacement between median q_jump for the NTRU arm and for the independent-plant NULL-2
      arm, in log2 q
    direction: different
    minimum_effect: 0.5
  - metric: shift in median q_jump when the densest rank-k sub-orbit is taken over 1000 random k-subsets
      instead of consecutive rotations, in log2 q grid steps
    direction: lower
    minimum_effect: 1
  minimal_test:
    design: 'One invocation, no reduction. Fix n = 32 in Z[x]/(x^n - 1) and a ternary fixed-weight
      secret distribution. Sample 200 keys. For each key build the n x 2n integer rotation matrix,
      form its Gram matrix exactly, and compute the n leading principal minors by Bareiss elimination,
      giving log covol(L_k) for all k at once. From the n intercepts and the fixed slopes k/2, solve
      the upper envelope in closed form and record k*(q) and q_jump. Repeat the identical code path
      on 200 NULL-1 and 200 NULL-2 instances constructed to match dimension, determinant, planted
      rank and per-vector norm. Report the three q_jump distributions with bootstrap confidence intervals
      on their medians. The discriminating comparison is NTRU against NULL-2: a displacement larger
      than the pooled interquartile range says the locator sees the ring; an overlap says it sees
      planted rank. Total cost is minutes of integer arithmetic and no lattice reduction, which is
      the point.'
    controls:
    - NULL-1 unplanted matched q-ary lattice, identical dimension, determinant and modulus.
    - NULL-2 independent-plant matched lattice, additionally matched on planted rank and per-vector
      Frobenius norm, isolating ring structure as the sole difference.
    - 'Sub-orbit selection control: consecutive-rotation choice versus 1000 random k-subsets, run
      on the same keys.'
    - 'Arithmetic control: recompute 20 randomly chosen covolumes with an independent determinant
      routine (fraction-free versus modular CRT) and require exact agreement, so the primary quantity
      is not a floating-point artifact.'
    - 'Degenerate-key control: keys with non-invertible f mod q are recorded and excluded by a rule
      fixed before the sweep, not after.'
    required_metrics:
    - log covol(L_k) for k = 1..n, exact
    - k*(q) as a step function on the log q grid
    - q_jump per key in log2 q
    - median and interquartile range of q_jump per arm
    - fraction of keys with zero or multiple envelope crossings
    - displacement between NTRU and NULL-2 medians with bootstrap CI
  falsification_conditions:
  - The upper envelope has no crossing, or more than one, for more than 10 percent of sampled keys,
    which falsifies the single-jump form of the claim.
  - The NULL-2 arm reproduces the NTRU q_jump distribution within the pooled interquartile range,
    which falsifies the attribution to ring structure and records a controlled null.
  - Switching from consecutive rotations to sampled k-subsets moves the median q_jump by more than
    one grid step, which falsifies the cheap canonical choice.
  - The independent determinant routine disagrees with Bareiss on any instance, which invalidates
    the measurement rather than producing a result.
  - In the toy recovery check, recovery frequency shows no monotone association with the sign of q
    - q_jump, which falsifies the predictive claim (C) while leaving the identity in (A) intact.
  confounders:
  - 'Secret invertibility: keys with f non-invertible mod q change the lattice''s structure and must
    be handled by a pre-registered rule.'
  - 'Ring choice: x^n - 1 has the trivial factor x - 1 and hence an all-ones eigenvector that inflates
    one autocorrelation eigenvalue; comparing across rings without accounting for this would attribute
    a coordinate effect to structure.'
  - The balanced-covolume baseline is itself q-dependent through det(Lambda) = q^n, so an error in
    the baseline exponent is indistinguishable from a shift in q_jump unless the baseline is derived
    independently.
  - Fixed-weight secrets have exactly determined norm, so covol(L_1) has no spread; any observed q_jump
    spread then comes entirely from higher ranks, which must be stated when comparing to Gaussian
    secrets.
  interpretation_limits:
  - A located q_jump is a property of a comparator, not of any algorithm; nothing about attack cost
    follows.
  - 'Toy n does not transfer: no statement about deployed parameters, sntrup761 included, is admissible
    from this measurement in either direction.'
  - A null result is a statement about this comparator only and leaves every other locator open.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement itself costs O(n^3) exact-integer
      operations per key for the Bareiss pass plus O(n log n) for the envelope.
    memory_exponent: No attack memory exponent is claimed. The measurement stores O(n^2) integers
      of size O(n log q) bits per key.
    best_known: The incumbent locator inside this repository is the recovery-frequency sweep proposed
      in IDEA-20260809-26de01 and the post-reduction profile reading in IDEA-20260809-24eec3; both
      require running reduction. Outside the repository this program cannot adjudicate incumbency
      and does not assert any.
    hidden_overhead: The balanced-covolume baseline hides a derivation the Coordinator must supply;
      if it is wrong the whole q_jump scale shifts. The human cost is in the matched-control construction,
      which is where every lattice comparison of this kind actually fails, and in the pre-registration
      of the degenerate-key rule.
  dominated_by: 'n/a (no attack result claimed). Pareto check performed against the only frontier
    this entry could sit on, which is predictors of the transition inside this repository: on time
    it dominates both reduction-based locators by orders of magnitude, on memory it is trivial, and
    on data it needs only the generated key, but its predictive validity is unmeasured, so it is dominated
    on the axis that matters until the toy recovery check reports.'
  sota_delta: 'No attack; measurement contribution only. Against the in-repository reduction-based
    locators the delta is compute: milliseconds of integer arithmetic per key versus a reduction run
    per grid cell, at the cost of an unvalidated comparator. No bit, block-size, or exponent improvement
    is claimed against anything.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), the affine identity and the closed-form envelope crossing:
    0.9, because it is algebra and the only failure mode is a bookkeeping error in the baseline. Part
    (B), that q_jump has a usably narrow distribution over keys at fixed parameters: 0.5, because
    fixed-weight secrets constrain rank 1 tightly but higher-rank covolumes may be broad. Part (C),
    that q_jump associates with measured recovery in the toy window: 0.25, because the comparator
    ignores the profile entirely and reduction behaviour is profile-driven. Part (D), that consecutive
    rotations suffice: 0.6. The joint prior that all four hold is well under 0.15, and the entry is
    still worth running because the (A)-plus-null result is publishable inside this program regardless
    of (C).'
