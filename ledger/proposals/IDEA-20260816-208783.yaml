  object_first_candidate:
    tracked_object: The pairwise occupancy covariance of a sampled input vector, Cov(1_i, 1_j), followed
      from the sampler through the ring product and the truncation into the joint block-failure moments
      mubar_k. The sampler is the independent variable; the covariance is what is tracked; log2 A-hat_k
      is where it is read out.
    lossiness: 'LOSSY. The full sampler law over C(n, w) supports is projected onto its second-order
      occupancy structure - one number by symmetry, since the law is exchangeable - discarding every
      higher-order dependency and the entire support geometry. The discard is compatible with the
      target operation for the specific readout used: mubar_2 is a second moment, so second-order
      input structure is exactly the order that propagates into it linearly, while higher orders enter
      only through the decoder''s nonlinearity. That compatibility is why the k = 2 prediction is
      sharp and the large-k predictions are weaker, and the proposal says so rather than claiming
      uniform strength.'
    propagation: One step of the target operation is one ring product plus truncation. Negative pairwise
      occupancy covariance in an input propagates to negative pairwise covariance among coordinates
      of e-tilde at the second-moment level, because the coefficient of e'' at position k is a sum
      over pairs and its covariance structure is a bilinear functional of the input covariances. The
      inner decoder then thresholds blocks of coordinates, converting coordinate-level negative covariance
      into block-level negative association of the F_j, which is exactly what log2 A-hat_k < 0 reads.
      Each of these three links is stated as a direction, not as a magnitude, and the experiment measures
      the magnitudes.
    survival_score: 'Three links, and the proposal predicts the object survives all three in SIGN
      and degrades in MAGNITUDE at each. Concretely: sampler covariance is exactly -w(n-w)/(n^2(n-1));
      after the ring product and truncation the coordinate covariance of e-tilde is smaller in magnitude
      by a factor the run measures; after block thresholding the surviving quantity is log2 A-hat_2.
      The survival score is the measured ratio of the third to the first, and a value indistinguishable
      from zero would mean the object dissolves at the decoder - a clean, usable result.'
  null_object_control: 'The null object is the Bernoulli(w/n) arm: the same n, the same expected weights,
    the same ring, truncation, decoder, tie rule, estimator and frozen intervals, with i.i.d. coordinates
    and therefore EXACTLY zero sampler covariance by construction. It runs in the same invocation
    off the same seed ladder. FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW: (i) q = E[S]/n_e
    agreeing between arms within Monte-Carlo error, since the coordinate marginal is w/n in both -
    a q difference means the ablation changed the operating point and the comparison is void; (ii)
    the estimator''s own bias behaviour unchanged, verified by re-running the committed INV-NULL bit-identity
    check; and (iii) if the mechanism claim is right, log2 A-hat_k in the Bernoulli arm lying inside
    the frozen independence intervals at most orders. A Bernoulli arm that still shows a large deficit
    is not a failure of the experiment - it is the exoneration outcome and it redirects the mechanism
    search.'
  discriminated_from:
  - IDEA-20260808-cbb848 signs A17 by an analytic negative-association sandwich with an exactly computable
    mixture term. That is a proof-shaped deliverable about a bound; this is an ablation that attributes
    a MEASURED magnitude to a specific pipeline component. If cbb848 succeeds it predicts the sign;
    it cannot say what fraction of the observed -0.866 at k = 17 the sampler owns, which is the only
    number this produces.
  - EXP-HQC-982268 and EV-HQC-b71230 measure log2 A-hat_k inside the fixed-weight sampler and compare
    it to an independence null. The sampler is a constant there and the independent variable here;
    no cell of that experiment answers the attribution question.
  - DEC-20260815-176614's named follow-up is a confound-breaking design plus a null-object control
    on the local-exponent diagnostic. That targets the diagnostic's validity; this targets the physical
    origin of the effect the diagnostic measured. They are complementary and neither substitutes for
    the other.
  - IDEA-20260805-15258a attributes DFR variation to the additive energy of the SECRET support, a
    per-key quantity. This attributes joint-moment deficit to the sampler's shell constraint, a quantity
    identical for every key, so the two mechanisms are distinguishable by whether the effect varies
    across keys - which the partial-ablation ladder also measures.
  - A generic 'rerun the DFR measurement' proposal would change trial counts or parameters. This changes
    exactly one component and reuses the frozen thresholds so the comparison is against committed
    numbers rather than against a fresh baseline.
  assumptions:
  - The existing harness's sampler is separable behind an interface so that only the sampler changes;
    if it is not, the ablation is not clean and the run must report that rather than proceed.
  - The discard-prefix comparability discipline already used by TASK-20260814-8bbdd2 and TASK-20260815-e61cca
    reproduces committed per-trial S arrays bit-identically in the fixed-weight arm; this is checked,
    not assumed.
  - 'Bernoulli(w/n) is the correct matched null for a weight-w shell: it matches the coordinate marginal
    exactly and the total weight only in expectation, and the weight-variance difference is itself
    a confound listed below.'
  - The frozen intervals from the existing amendment remain valid estimator calibration under the
    Bernoulli arm; this is checked by the INV-NULL bit-identity re-run rather than assumed.
  - No conclusion transfers to deployed parameters.
  predictions:
  - metric: '|log2 A-hat_2| in the Bernoulli arm versus the committed fixed-weight value 6.031e-03'
    direction: lower
    minimum_effect: 0.5
  - metric: '|log2 A-hat_17| in the Bernoulli arm versus the committed fixed-weight value 8.657e-01'
    direction: lower
    minimum_effect: 0.5
  - metric: q = E[S]/n_e, Bernoulli arm minus fixed-weight arm
    direction: different
    minimum_effect: 0.0
  - metric: number of the 17 pre-specified cells whose Bernoulli-arm value lies inside the frozen
      independence interval
    direction: higher
    minimum_effect: 9
  minimal_test:
    design: 'Only the k = 2 cell is needed to discriminate, and it is the cheapest. Run the existing
      harness at the existing reduced parameter set twice in one invocation - fixed-weight sampler
      and Bernoulli(w/n) sampler - at T = 10^6, computing mubar_2, q and log2 A-hat_2 with the committed
      estimator and the committed frozen interval. Gate on q agreeing between arms. If the Bernoulli
      arm''s |log2 A-hat_2| is at least halved, the sampler owns a measurable share of the deficit
      and the full k-ladder and the per-input partial ablation are justified. If it is unchanged,
      the sampler is exonerated at k = 2 and the mechanism search redirects, which is equally publishable
      as a recorded obstruction. Cost: one run, single core, minutes, no new estimator code.'
    controls:
    - Bernoulli(w/n) null arm in the same invocation, same seed ladder, same estimator, same frozen
      intervals.
    - q-agreement gate between arms; failure voids the comparison as a changed operating point.
    - Discard-prefix bit-identity check reproducing committed per-trial S arrays in the fixed-weight
      arm.
    - INV-NULL estimator bit-identity re-run under the Bernoulli arm.
    - 'Per-input partial ablation (one input Bernoulli-ised at a time) as an internal consistency
      check: the single-input effects should compose roughly additively at k = 2 if the mechanism
      is second-order.'
    - A fixed-total-weight Bernoulli variant (conditioned on the realised weight) as a second null
      separating shell-constraint from weight-variance effects.
    required_metrics:
    - log2 A-hat_k for k = 2..18 in both arms with confidence intervals
    - q per arm and the arm difference with its Monte-Carlo error
    - attribution fraction (Bernoulli deficit)/(fixed-weight deficit) per k
    - count of cells inside the frozen independence interval per arm
    - per-input partial-ablation deficits at k = 2
    - discard-prefix and INV-NULL bit-identity pass counts
  falsification_conditions:
  - 'The Bernoulli arm reproduces the fixed-weight deficit at every k: the sampler is exonerated,
    the attribution fraction is bounded near zero, and the mechanism search redirects to the code
    and the decoder.'
  - 'The q-agreement gate fails: the ablation changed the operating point and no attribution is reportable.'
  - 'The discard-prefix bit-identity check fails: the harness is not reproducing committed data and
    nothing may be compared to it.'
  - 'The per-input partial ablations do not compose even roughly additively at k = 2: the second-order
    propagation story is wrong even if the total effect is real, and that is recorded.'
  - 'The fixed-total-weight Bernoulli variant behaves like the fixed-weight arm rather than the free
    Bernoulli arm: the effect is a total-weight-variance artefact rather than a shell-constraint effect,
    and the attribution is reassigned.'
  confounders:
  - 'Weight variance: free Bernoulli sampling lets the realised weight fluctuate, which changes the
    failure-rate distribution for reasons unrelated to pairwise covariance - addressed by the fixed-total-weight
    Bernoulli second null.'
  - 'Operating-point drift: even a small q difference between arms changes A-hat_k nonlinearly, which
    is why q agreement is a gate rather than a reported metric.'
  - Estimator bias at large k, where C(S,k) is supported on few trials and the plug-in estimator is
    noisiest.
  - Shared-seed coupling between arms shrinking the apparent variance of the arm difference.
  - Batch-size and transition-regime effects, already named as a live confound in EV-HQC-927899's
    red-team observations, which could interact with an arm swap.
  interpretation_limits:
  - Anti-correlated block failures make a binomial tail conservative, so no outcome of this run is
    a step toward an attack and none may be reported as one.
  - A non-zero residual after ablation says only that the sampler does not own it; it does not identify
    what does.
  - The result is scoped to the executed reduced parameter set and the executed estimator, with no
    transfer to deployed parameters.
  - Bernoulli sampling is not an HQC variant and no conclusion about a Bernoulli-sampled scheme is
    intended; it is a null object.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement is O(T * n_e * 2^m * m) per arm,
      identical to the committed runs, so it inherits their measured throughput.
    memory_exponent: No attack memory exponent is claimed. Storage is the per-trial S array plus the
      joint-moment accumulators, i.e. tens of megabytes at T = 10^7.
    best_known: 'The incumbent is EV-HQC-b71230 itself: log2 A-hat_2 = -6.031e-03 at -244.1 null SD
      and log2 A-hat_18 = -9.813e-01 at -32.4 SD, at T = 1e7, with NULL-P firing 0 of 17 cells and
      validator-certified exact-rational recomputation to 3.7e-15 bits. That is the number this proposal
      seeks to attribute, not to beat.'
    hidden_overhead: The separability of the sampler behind an interface is assumed and may not hold
      in the existing harness; making it hold without perturbing the committed code path is the real
      cost and it is engineering, not compute. A second hidden cost is that reusing frozen intervals
      across an arm swap needs a written argument that the calibration still applies, and writing
      that argument honestly may be harder than running the arm.
  dominated_by: n/a (no result claimed). No attack cost triple exists here, so no Pareto frontier
    row applies and 'null' would be a fabrication. On the measurement axis EV-HQC-b71230 dominates
    on trial count and certification depth and does not address attribution at all; this proposal
    is strictly downstream of it and does not compete with it.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the repository
    holds the deficit (-6.031e-03 at k = 2, -8.657e-01 at k = 17) with no attribution; this run produces
    the attribution fraction for each of those same 17 cells, a number that currently does not exist
    rather than one that is improved.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. (i) That the sampler is cleanly separable in the existing harness:
    ~0.6, unknown until opened, and the run reports honestly if it is not. (ii) That fixed-weight
    sampling contributes a MEASURABLE share of the k = 2 deficit: ~0.8 - the covariance is exactly
    negative and the propagation to second moments is close to linear, so this is close to arithmetic.
    (iii) That it accounts for MOST of the deficit at large k: ~0.4 - the C(k,2) shape already recorded
    is consistent with a purely pairwise source, which supports it, but the decoder nonlinearity could
    easily dominate. (iv) That the per-input partial ablations compose additively: ~0.35. (v) That
    the run produces a usable attribution number either way: ~0.9.'
