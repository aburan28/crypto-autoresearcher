idea:
  id: IDEA-20260816-208783
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: EV-HQC-b71230 measured HQC's inner-block joint failure moments falling below the independence
    prediction at every order from k equals 2 to 18; propose the cheapest candidate mechanism - fixed-weight
    rather than Bernoulli sampling of the five inputs - and test it by ablating only the sampler in
    the same harness, leaving code, estimator and thresholds untouched
  class: mechanism
  claim: '(A) THE MEASURED FACT THIS ADDRESSES. EV-HQC-b71230 reports log2 A-hat_k negative at every
    tested order, from -6.031e-03 at k = 2 to -9.813e-01 at k = 18, with the pre-specified k = m =
    17 cell at -42.7 null standard deviations and a matched independence null (NULL-P) that fired
    0 of 17 cells. The sign is anti-correlation. That measurement has a direction but, in the committed
    record, no mechanism. (B) THE CANDIDATE MECHANISM. All five HQC inputs - x, y, r_1, r_2, e - are
    drawn uniformly from FIXED-WEIGHT shells, not as i.i.d. Bernoulli vectors. For a uniformly random
    weight-w subset of n coordinates the pairwise occupancy covariance is exactly Cov(1_i, 1_j) =
    w(w-1)/(n(n-1)) - (w/n)^2 = -w(n-w)/(n^2(n-1)) < 0. Negative association is therefore built into
    the sampler, before any code, any ring and any decoder is involved. The claim is that this sampler-level
    negativity propagates through the pipeline and accounts for a QUANTIFIABLE FRACTION of the measured
    deficit. (C) THE ABLATION THAT TESTS IT. Replace each fixed-weight draw by an i.i.d. Bernoulli(w/n)
    draw of the same expected weight, change nothing else - same ring, same truncation, same decoder,
    same tie rule, same estimator, same frozen thresholds - and re-measure log2 A-hat_k for k = 2..18.
    Prediction, signed in advance: |log2 A-hat_k| shrinks toward zero in the Bernoulli arm at every
    k. The RESIDUAL is the measured quantity: whatever deficit survives the ablation is not attributable
    to the sampler. (D) WHAT IS NOT CLAIMED. It is not claimed that fixed-weight sampling accounts
    for ALL of the deficit; the residual is the point. It is not claimed that the residual, if non-zero,
    is a code effect - only that it is not a sampler effect. And there is NO security consequence
    in either direction: anti-correlated block failures make a binomial tail CONSERVATIVE rather than
    optimistic, so this measurement, whichever way it lands, is not a step toward any attack and must
    not be reported as one. No attack, break, speedup or security consequence is claimed here or would
    follow from a run. No statement is made about what the published literature does or does not contain;
    this environment cannot reach external literature. No direction is declared impossible.'
  mechanism: 'STAGE 1, zero compute: derive the exact sampler covariance above and the exact analogous
    expression for the Bernoulli arm (zero covariance by construction), and state the resulting prediction
    on q = E[S]/n_e - which must move only within its own Monte-Carlo error between arms, because
    the coordinate marginal is w/n in both. That gives a fail-closed gate: an arm difference in q
    is a mis-specified ablation, not a result. STAGE 2: implement the Bernoulli sampler as a drop-in
    behind the existing sampler interface and run a bit-identity check confirming that with the fixed-weight
    sampler selected, the harness reproduces the committed per-trial S arrays of the existing runs
    exactly - the same discard-prefix discipline TASK-20260814-8bbdd2 and TASK-20260815-e61cca already
    used, which makes the ablation arm comparable to committed data rather than to a fresh reimplementation.
    STAGE 3: measure log2 A-hat_k for k = 2..18 in both arms at matched T, with the frozen intervals
    reused verbatim, and report the per-k ratio (Bernoulli deficit)/(fixed-weight deficit) as the
    attribution fraction. STAGE 4: a partial-ablation ladder - Bernoulli-ise the inputs one at a time
    - which localises the effect to specific inputs and would show, for instance, whether the error
    vector e or the pair (r_1, r_2) carries it. Refutation: if the Bernoulli arm reproduces the fixed-weight
    deficit, the sampler is exonerated and the mechanism search moves to the code and the decoder,
    which is a useful redirection.'
