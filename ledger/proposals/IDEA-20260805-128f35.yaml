idea:
  id: IDEA-20260805-128f35
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  added: '2026-08-05'
  title: >-
    The involution budget of a cyclotomic conductor: an exact census of every
    order-2 Galois symmetry available to a module-LIP attack, the third cocycle
    lattice nobody has looked at, and a derived evasion map for HAWK's Round-3
    conductor choice
  class: mechanism

  claim: >-
    The engine of the disclosed HAWK attack (KN-LIT-7592) is stated by its own
    entry as "the object hiding the secret admits more than one order-2 symmetry,
    and the whole prior literature used only one of them". That sentence is a
    COUNTING STATEMENT, and the count is exactly computable: for K = Q(zeta_m)
    the number of order-2 elements of Gal(K/Q) = (Z/m)^x is 2^{r+delta} - 1,
    where r is the number of distinct odd primes dividing m and delta is 0, 1 or
    2 according as v_2(m) is <= 1, = 2, or >= 3. Three consequences follow, and
    the first two are derivations that cost no compute:
    (A) FOR HAWK'S OWN FIELDS (m = 2^ell, ell >= 3) THE COUNT IS EXACTLY THREE:
    complex conjugation c, the attack's tau : zeta -> -zeta, and their product
    c*tau. The symmetry budget of a 2-power cyclotomic field is therefore
    EXHAUSTED at three, and the literature has used one (c) and the attack has
    used a second (tau). THE THIRD, c*tau, HAS NEVER BEEN EXAMINED IN THIS
    CORPUS, and this record derives that its cocycle lattice is equally publicly
    computable, carries the SAME length form Tr_{F/Q}(det Y), and has the SAME
    upper bound lambda_1^2 <= n/4 -- while its SHAPE, which is what sets the
    SVP dimension, is unknown.
    (B) THE EVASION SET IS DERIVABLE AND IS NOT THE SET THE CONSTRUCTION NEEDS.
    A conductor has a unique involution iff m is in {4, p^k, 2p^k}, p odd --
    which reproduces the paper's reported evasion criterion. But the attack's
    tau = sigma_{1+m/2} exists only when 4 | m. THE TWO SETS DIFFER, and the
    difference is exactly the odd composite conductors and their doubles
    (m = 15, 21, 30, 33, 35, ...), which have a second involution but NOT tau.
    Whether the construction transfers there is open, and this record says so
    instead of guessing.
    (C) NECESSARY IS NOT SUFFICIENT. Having a second involution buys the generic
    half of the argument -- det V = 1 forces lambda_1^2 <= [F:Q] = n/4 -- and
    NOT the 2-power-specific half, the exact orthogonal splitting of
    Proposition 4.5 that gives Ducas's provable solver dimension n/2 + 1. The
    proposal is to separate those halves by DERIVATION and then to MEASURE the
    second half at the closest conductors where it is expected to fail
    (m = 4p: 12, 20, 28, 36, 44), which is the nearby-object control that
    inventor-protocol section 8 audit 4 asks for and that nobody has run.

  object_first_candidate:
    tracked_object: >-
      The 2-TORSION SUBGROUP of Gal(K_m/Q) = (Z/m)^x, taken as a set of
      candidate LENSES rather than as a group -- and, for each involution
      sigma in it, the cocycle V_sigma = B^{-1} sigma(B) together with the
      rank-n integer lattice Lambda_B^(sigma) it inhabits. What is followed
      through the computation is a THREE-ELEMENT SET for HAWK's fields
      ({c, tau, c*tau}), its cardinality as a function of the conductor, and the
      Gram matrix produced by each of its elements. The object is the SYMMETRY
      BUDGET, and the point of tracking it is that it is finite, exactly
      countable, and -- for a 2-power conductor -- now provably two-thirds
      spent.
    established_families_off_limits: >-
      Off-limits as the primary lens: (a) complex conjugation and every
      totally-real-subfield argument built on it, i.e. all pre-2026 module-LIP
      cryptanalysis -- using c as the lens is precisely the move this proposal
      exists to count rather than repeat; (b) BKZ blocksize estimation,
      core-SVP, AGPS20 gate counting and every solver-side cost argument;
      (c) the nrd-PIP / principal-ideal / class-group family of KN-OPEN-028;
      (d) primal and dual lattice attacks on the underlying module problem;
      (e) unit-group and log-embedding attacks. Note (a) especially: the
      temptation with a "census of symmetries" is to rediscover the
      conjugation-based literature in new notation, and declaring it off-limits
      is what prevents that.
    newness_score: >-
      The involution COUNT is elementary number theory and certainly known; no
      novelty is claimed for it. Three things are, at descending confidence.
      (1) THE THIRD COCYCLE: no record in this corpus mentions c*tau, and this
      record derives its defining system and its length form. Whether the
      external literature has examined it is UNKNOWN and unscreenable from here.
      (2) THE SEPARATION of the evasion criterion "(Z/m)^x cyclic" from the
      construction requirement "4 | m", which the corpus records only as a
      single relayed sentence and which this record shows are different sets.
      (3) THE EXHAUSTION STATEMENT: for m = 2^ell the budget is three and no
      fourth involution exists -- a closure at the inventor-protocol section 4
      standard (named obstruction, argument, forward guidance) rather than a
      fatigue report.
    testability_score: >-
      The census half is testable at zero compute and is decidable by hand. The
      cocycle-shape half reuses the instrument of the sibling proposal
      IDEA-20260805-6eac55 with two parameters changed (which involution, which
      conductor), so its marginal cost is small and its dependency is explicit.
    survival_score: >-
      The census survives completely -- it is a theorem of elementary group
      theory. The cocycle-shape question is where the structure may dissolve,
      and the honest expectation is that it dissolves off the 2-power
      conductors, which is exactly why those conductors are the control arm and
      not the treatment arm.

  mechanism: >-
    DERIVED IN THIS RECORD. Only the two-sentence characterisations in
    KN-LIT-7592 and the verbatim fragments in the BATCH-001 transcription were
    available; the paper's Appendix on conductor evasion was NOT read.

    (E1) THE COUNT. By CRT, for m = 2^{e} p_1^{e_1} ... p_r^{e_r},
    (Z/m)^x = (Z/2^e)^x x prod_i (Z/p_i^{e_i})^x. Each odd factor is cyclic of
    even order phi(p_i^{e_i}) = p_i^{e_i - 1}(p_i - 1), contributing exactly one
    element of order 2. (Z/2^e)^x is trivial for e <= 1, is C_2 for e = 2, and
    is C_2 x C_{2^{e-2}} for e >= 3. Hence
      #{t in (Z/m)^x : t^2 = 1} = 2^{r + delta},
      delta = 0 (e <= 1), 1 (e = 2), 2 (e >= 3),
    and the number of INVOLUTIONS (order exactly 2) is 2^{r+delta} - 1. Verified
    by direct enumeration in this session for
    m in {3,4,5,6,8,9,10,12,15,16,20,21,24,25,28,32,36,40,64,1024}; every value
    matched the formula.
      m = 2^ell, ell >= 3: r = 0, delta = 2, so THREE involutions.
      m = 4: r = 0, delta = 1, so ONE.
      m = p^k or 2p^k: r = 1, delta = 0, so ONE.
      m = odd composite or twice one: r >= 2, delta = 0, so >= 3.
    UNIQUE INVOLUTION <=> r + delta = 1 <=> m in {4, p^k, 2p^k}. That is exactly
    the reported evasion set, RE-DERIVED here rather than taken on trust.

    (E2) WHICH INVOLUTION IS tau. -zeta_m = zeta_m^{1 + m/2}, so
    tau = sigma_{1+m/2}. It is a unit mod m for every even m with 4 | m (if an
    odd prime p divides m then p | m/2, so 1 + m/2 == 1 mod p; and 1 + m/2 is
    odd exactly when 4 | m). Its square is 1 + m + m^2/4 == 1 mod m iff 4 | m.
    It equals c = sigma_{-1} iff m | m/2 + 2, i.e. only for m = 4. Therefore:
      **tau is an order-2 automorphism distinct from c <=> 4 | m and m > 4.**
    Consequence, and the point of (B): {m : 4 | m, m > 4} is a PROPER SUBSET of
    {m : at least two involutions}. The complement inside the latter is
      {m odd composite} union {2 * (odd composite)},
    e.g. m = 15, 21, 30, 33, 35, 45, 105. Those conductors have a second
    involution sigma' (for m = 15, sigma_4, since 4^2 = 16 == 1 mod 15) but no
    tau of the form zeta -> -zeta. WHETHER THE CONSTRUCTION RUNS ON sigma' THERE
    IS OPEN. This record does not assert it does or does not; it names the set.

    (E3) THE GENERIC HALF OF THE ARGUMENT, VALID FOR ANY SECOND INVOLUTION.
    Let sigma be any involution with sigma != c and sigma != 1, so
    G := <c, sigma> is Klein four and F := K^G has degree n/4 (so 4 | n is
    required, which holds for every m with at least two involutions and
    phi(m) divisible by 4). Put V_sigma = B^{-1} sigma(B) for B in SL_2(R).
    Then sigma(V_sigma) = sigma(B)^{-1} B = V_sigma^{-1}, and
    det V_sigma = det(B)^{-1} sigma(det B) = 1. So V_sigma^{-1} = adj(V_sigma)
    and the adj-pattern conditions
      sigma(a) = d, sigma(d) = a, sigma(b) = -b, sigma(c) = -c
    hold, all Z-linear. The public-key condition linearises the same way as in
    IDEA-20260805-6eac55 (D2): sigma(Q) = V_sigma* Q V_sigma, and
    (V_sigma*)^{-1} = ((c sigma)(V_sigma))^T, so
      Q V_sigma = ((c sigma)(V_sigma))^T sigma(Q),
    Z-linear with public coefficients. And, granting det Y in F,
      Q^(sigma)(V_sigma) = Tr_{F/Q}(1) = [F : Q] = n/4.
    HENCE lambda_1(Lambda_B^(sigma))^2 <= n/4 FOR EVERY SECOND INVOLUTION AND
    EVERY CONDUCTOR WITH ONE. This is the generic half and it is derived, not
    assumed. NOTE WHAT IT DOES NOT GIVE: an upper bound on lambda_1 does not
    bound the SVP dimension. Ducas's block reduction needs the lattice to be
    (near-)hypercubic -- the ORTHOGONAL SPLITTING of Proposition 4.5 -- and that
    is the 2-power-specific half, which this derivation does not reach.

    (E4) THE THIRD COCYCLE, AND WHY IT IS NOT A REPACKAGING. For m = 2^ell the
    three involutions are c = sigma_{-1}, tau = sigma_{1+m/2}, and
    c*tau = sigma_{m/2-1}. Applying (E3) with sigma = c*tau gives a lattice
    Lambda_B^(c tau) that is (i) publicly computable from Q by the same recipe,
    (ii) equipped with the SAME length form, because <c, c*tau> = <c, tau> so
    the fixed field F is identical, and (iii) subject to the same bound
    lambda_1^2 <= n/4. Its SHAPE IS UNKNOWN AND IS THE QUESTION. Two structural
    facts make the question live rather than idle:
      - THE THREE COCYCLES ARE RELATED, NOT INDEPENDENT:
        V_{c tau} = B^{-1} (c tau)(B) = B^{-1} c(B) * c(B)^{-1} c(tau(B))
                  = V_c * c(V_tau),
        where V_c = B^{-1} c(B) is the conjugation cocycle the pre-2026
        literature used. So the three lattices are tied by a cocycle identity,
        and a shortest vector of any ONE of them plus the identity constrains
        the others. Whether that coupling can be used to CUT the SVP dimension
        below n/2 + 1 -- by intersecting constraints rather than solving one
        lattice -- is the exponent-relevant question and it is open.
      - c*tau is the involution whose fixed field is NEITHER totally real
        (that is K^c) NOR the smaller cyclotomic field (that is K^tau). It is
        the one subfield of index 2 that neither prior lens sees.
    A NECESSARY HONESTY: if Lambda_B^(c tau) turns out isometric to
    Lambda_B^(tau) by a trivial relabelling, this is a change of coordinates and
    nothing was gained. That is precisely the (Delta, Pi) failure of
    KN-LIT-7595 and the identifiability audit below says how it is detected.

    (E5) THE EXHAUSTION STATEMENT, AT THE CLOSURE STANDARD. Named obstruction:
    Gal(Q(zeta_{2^ell})/Q) = C_2 x C_{2^{ell-2}} has exactly three elements of
    order 2, by (E1). Argument: any order-2 lens of this construction is an
    involution of the Galois group, and there are no others. Forward guidance,
    naming what remains open rather than declaring anything impossible:
    (i) the c*tau lattice, unexamined; (ii) NON-INVOLUTIVE lenses -- an element
    sigma of order 4 gives a cocycle satisfying the LENGTH-4 relation
    V sigma(V) sigma^2(V) sigma^3(V) = I, which is not equivalent to an
    adj-pattern and so is a genuinely different construction, not covered by
    this census and not attempted anywhere in this corpus; (iii) the
    non-Galois-theoretic symmetries of the module (automorphisms of R^2 as an
    R-module, i.e. the unit group), which this census does not touch;
    (iv) conductors in the gap set of (E2).

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    what_the_screen_could_see: >-
      The complete HAWK lane of this corpus, read in full (goal, question,
      evidence, two corrections, one decision, KN-OPEN-027/028, KN-LIT-7592,
      7670, 7671, 7675, both BATCH directories and all three BATCH-001
      transcription artifacts), plus a corpus-wide grep for cocycle, involution,
      and Galois in the HAWK context. IT COULD NOT SEE the body or appendices of
      the disclosed attack, iacr:2026/1318, iacr:2026/1560, or the HAWK Round-3
      specification. Per KN-OPEN-3f7a21, corpus `citation_verified` fields are
      unreliable at scale, so this screen is weak by construction.
    result: >-
      No record in this corpus mentions c*tau, the involution count, or the
      distinction between "(Z/m)^x cyclic" and "4 | m". The single relayed
      sentence in KN-LIT-7592 -- "Conductors m in {p^k, 2p^k} for odd prime p
      -- i.e. the m > 4 with cyclic (Z/m)^x -- evade it, because they have no
      second involution to use; the authors expect many other composite
      conductors do not evade it" -- is the entirety of the corpus's holding on
      this question, and it is relayed, not derived.
    conclusion: >-
      Novel within this corpus. Against the external literature the census is
      standard mathematics and the third cocycle is very plausibly known to the
      paper's authors (their Appendix on conductors was not read); this record
      claims priority on nothing and its value is that the derivation is
      LOCAL, CHECKABLE and DOES NOT DEPEND ON A GATED SOURCE.

  literature_context:
    - >-
      KN-LIT-7592 (Straznickas-Weis). READ AT ABSTRACT/INTRODUCTION LEVEL ONLY
      by an earlier session; its own body lists the conductor-based evasion
      criterion under "NOT verified here". The sentence quoted above under
      novelty_screen.result is the load-bearing relay and this proposal's
      (E1)-(E2) are an independent re-derivation of it.
    - >-
      The paper's own statement, as relayed by KN-LIT-7592, that "the authors
      expect many other composite conductors do not evade it" is an EXPECTATION,
      explicitly not a theorem, and is the open question this proposal converts
      into a measurable census with a named control set.
    - >-
      RELAYED, NOT READ: this session's scouting brief reports that
      iacr:2026/1560 (Mureau, Pellet-Mary) claims dimension 3m/8 + 1 and credits
      m/2 + 1 to Ducas'23, and that a pqc-forum post by Hengyi Luo reports a
      concurrent independent attack reaching 3n/4. Neither was read by this
      session. They bear on the sibling proposal IDEA-20260805-3a855d.
    - >-
      CORPUS DEFECT NOTED WHILE WRITING: KN-LIT-7673 and KN-LIT-7674, cited by
      GOAL-HAWK-001, EV-HAWK-001, KN-OPEN-028 and CORR-20260802-bc9e33, have NO
      corresponding files under knowledge/literature/ on this branch. Reported,
      not repaired. Nothing in this proposal depends on either.

  lossy_projection_identifiability_audit:
    projection: >-
      Two projections are in play and they must not be conflated.
      P1 (the census): conductor m --> the multiset of involutions of
      (Z/m)^x --> its cardinality 2^{r+delta} - 1.
      P2 (the cocycle): secret B --> public Q --> for each involution sigma, the
      Gram matrix of Q^(sigma) on Lambda_B^(sigma) up to GL_n(Z).
    what_is_discarded: >-
      P1 discards the entire arithmetic of the field except the 2-torsion of its
      Galois group -- everything about ramification, class number, unit rank and
      the ring's geometry. P2 discards the secret and, if the near-hypercubic
      claim holds, essentially everything else.
    why_genuinely_lossy: >-
      P1 is extremely lossy and that is its virtue: it reduces a question about
      attack applicability to a single integer computable from the factorisation
      of m. P2 is lossy in the strong sense discussed at length in the sibling
      proposal.
    why_compatible_with_the_operations: >-
      P1 is compatible because the construction's only use of the field's
      structure at the lens-selection step IS the existence of an order-2
      automorphism; nothing downstream of that step can create a lens that P1
      does not count. P2 is compatible by the Galois-equivariance derived in
      (E3).
    is_it_only_a_change_of_coordinates: >-
      THE DANGEROUS CASE, NAMED AND TESTED. For P2 applied to sigma = c*tau the
      honest worry is exactly the KN-LIT-7595 failure: if Lambda_B^(c tau) is
      carried to Lambda_B^(tau) by an obvious relabelling (for instance by
      applying c to every entry), then the third lens is a change of coordinates
      on the second and NOTHING IS GAINED. The record does not assume otherwise.
      The test is explicit and cheap: compute both Gram matrices at n = 8 and 16
      and decide GL_n(Z)-equivalence by comparing rank, determinant and the
      first three theta coefficients; a full match at every n is strong evidence
      of a coordinate change and the honest disposition is then to record a
      NULL RESULT and say the budget is two, not three. A mismatch in any theta
      coefficient is a genuinely different object.
    which_failure_was_checked_for: >-
      BOTH. Change-of-coordinates: the primary risk for the c*tau arm, tested as
      above, and the design pre-commits to reporting "coordinate change, budget
      is two" as a legitimate and publishable outcome. Constant-across-instances
      (the mirror failure): P1's output depends only on m and not on the key at
      all, so P1 IS constant across keys BY DESIGN -- it is a statement about
      the field, not the instance, and it may never be cited as instance
      information. That is stated here so no downstream record misreads a
      conductor census as a key-dependent measurement.

  assumptions:
    - >-
      That the construction's lens must be an involution of the Galois group.
      Justified for the construction AS DERIVED in (E3) -- the adj-pattern comes
      from sigma^2 = 1 -- and explicitly NOT justified for the wider class of
      order-4 lenses, which (E5)(ii) names as open.
    - >-
      That det Y lies in F for Y in the lattice, so that the length form is
      Tr_{F/Q}(det Y). Same assumption as the sibling proposal's H3; checked by
      the same instrument self-test, not assumed.
    - >-
      That 4 | phi(m) whenever the census is applied, so that [F : Q] = n/4 is
      an integer. True for every conductor in the declared census set; checked
      per conductor rather than assumed globally.
    - >-
      That the sibling instrument (IDEA-20260805-6eac55 / EXP-HAWK-a2f34a)
      passes its positive control. IF IT DOES NOT, the cocycle-shape arms of
      this proposal cannot run and only the zero-compute census survives. That
      dependency is declared rather than hidden.

  proof_search_map_note: >-
    A filled proof_search_map is carried by the paired hypothesis
    H-HAWK-a28be6, as required for a proposal with a derivation-tier claim.

  predictions:
    - metric: >-
        C1: number of involutions of (Z/m)^x, computed by direct enumeration,
        against the closed form 2^{r+delta} - 1, over a declared census set of
        at least 200 conductors m <= 2000
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT at 200/200. Derived before any run. A single mismatch
        refutes (E1) and the whole census. Free.
    - metric: >-
        C2: the set {m <= 2000 : exactly one involution}, compared against
        {4} union {p^k} union {2p^k}
      direction: different
      minimum_effect: >-
        SET EQUALITY, exactly. This is the re-derivation of the paper's reported
        evasion criterion and it must reproduce it with no exceptions.
    - metric: >-
        C3: the gap set {m <= 2000 : >= 2 involutions and 4 does not divide m},
        i.e. conductors where a second involution exists but tau does not
      direction: higher
      minimum_effect: >-
        NON-EMPTY, and predicted to be exactly the odd composites and their
        doubles, with 15 as the smallest element. If this set is empty the
        distinction drawn in (E2) is vacuous and claim (B) is withdrawn.
    - metric: >-
        C4: for m = 2^ell, ell = 4, 5, 6 (n = 8, 16, 32), the number of
        involutions and their explicit residues
      direction: different
      minimum_effect: >-
        EXACTLY 3, namely {m-1, m/2+1, m/2-1}. This is the EXHAUSTION claim and
        it is the one this proposal most wants on the record.
    - metric: >-
        C5: is Lambda_B^(c tau) GL_n(Z)-equivalent to Lambda_B^(tau)? Compared
        by (rank, Gram determinant, theta coefficients at n/4, n/2, 3n/4) at
        n = 8 and 16
      direction: different
      minimum_effect: >-
        NO PRE-REGISTERED DIRECTION IS CLAIMED, and that is deliberate: this
        record does not know the answer and refuses to guess. What IS
        pre-registered is the decision rule. FULL AGREEMENT on all five
        invariants at both n => report "coordinate change, symmetry budget is
        effectively two, the third lens is spent"; this is a NULL RESULT and is
        a legitimate deliverable. DISAGREEMENT in any invariant => the third
        lattice is a genuinely distinct object and the record states the
        observed shape and what it would take to price its SVP dimension. The
        rule is frozen before the computation so that neither outcome can be
        rationalised after the fact.
    - metric: >-
        C6 (NEARBY-OBJECT CONTROL): at conductors m = 12, 20, 28, 36, 44
        (n = 4, 8, 12, 12, 20), do the four forced values of
        IDEA-20260805-6eac55 (rank n, determinant (n/4)^{n/2+1}(n/2)^{n/2-1},
        theta_{n/4} = n+2, theta_{n/2} = n^2/2+2n-2) still hold?
      direction: lower
      minimum_effect: >-
        AT MOST ONE of the four holds at each such m, and specifically the
        DETERMINANT and both THETA coefficients are predicted to FAIL while the
        rank may survive, because the rank is generic (E3) and the splitting is
        not. If ALL FOUR hold at m = 12 and m = 20, the near-hypercubic
        structure is not 2-power-specific, the paper's conductor scope statement
        is broader than reported, and that is a materially more interesting
        result than the expected one.
    - metric: >-
        C7 (GRADED, >= 3 interior points): lambda_1^2 of Lambda_B^(sigma)
        measured at m = 16, 32, 64 (n = 8, 16, 32), against the derived upper
        bound n/4
      direction: different
      minimum_effect: >-
        EXACTLY n/4 at all three, i.e. 2, 4, 8, with the bound attained rather
        than merely respected. A value strictly below n/4 would mean the
        cocycle is not a shortest vector and the selection step of the attack
        needs re-examination; a value above n/4 is impossible and would indict
        the instrument.

  minimal_test:
    design: >-
      Three stages, cheapest-first, and STAGE 1 ALONE CAN TERMINATE OR VINDICATE
      THE CENSUS HALF AT ZERO COMPUTE COST.
      STAGE 1 (seconds, pure Python, no dependencies): C1-C4. Enumerate
      involutions by brute force over (Z/m)^x for all m <= 2000, compare against
      the closed form, extract the unique-involution set, the gap set, and the
      2-power triples. This stage needs no lattice, no key, and no external
      source; it is decidable and it either confirms or destroys (E1) and (E2).
      STAGE 2 (minutes, depends on EXP-HAWK-a2f34a's instrument passing PC-1):
      C5 and C7 -- build Lambda_B^(c tau) and Lambda_B^(tau) at n = 8, 16 (and
      32 best-effort), compare the five invariants, measure lambda_1^2.
      STAGE 3 (minutes, same dependency): C6 -- run the identical instrument at
      m = 12, 20, 28, 36, 44 and report which of the four forced values survive.
    controls:
      - >-
        NULL-A (matched null for the census, forced value derived pre-run, CAN
        FAIL). Run the identical involution enumeration on the ADDITIVE group
        Z/m instead of (Z/m)^x. FORCED VALUE: the number of solutions of
        2t == 0 mod m is exactly gcd(2, m), i.e. 1 for odd m and 2 for even m,
        with NO dependence on the number of odd prime factors. If the
        enumeration code returns 2^{r+delta} on the additive group too, the code
        is not computing what it claims and the census is void. This null can
        genuinely fail and its purpose is to prove the counter is sensitive to
        the group and not to m alone.
      - >-
        POSITIVE CONTROL PC-A (must fire). m = 8, 16, 32: the residues
        {m-1, m/2+1, m/2-1} must each square to 1 mod m, be pairwise distinct,
        be units, and be the complete list. If the enumerator misses any of the
        three, the instrument is broken and no census may be reported.
      - >-
        POSITIVE CONTROL PC-B (the effect MUST appear). At m = 2^ell, the tau
        arm of the sibling instrument must reproduce all four forced values --
        i.e. this proposal inherits EXP-HAWK-a2f34a's own positive control as a
        precondition. IF IT FAILS, NO NEGATIVE RESULT ABOUT ANY OTHER CONDUCTOR
        OR ANY OTHER INVOLUTION MAY BE REPORTED, because a failure at m = 4p
        would then be indistinguishable from an instrument fault.
      - >-
        GRADED CONTROL (C7 and C6 together give >= 3 interior points in two
        different directions). C7 grades by n at fixed conductor family and
        expects the bound n/4 to be attained at every point -- a quantity that
        must SCALE, and whose failure to scale is diagnostic. C6 grades by
        conductor family away from 2-powers and expects a monotone loss of
        structure; the report must say WHICH forced value fails FIRST, because
        that localises the obstruction to determinant (covolume) versus theta
        (splitting).
      - >-
        VERDICT-ON-THE-NULL-FIRST. The C5 decision rule is stated above and
        frozen; it is applied to the pair (Lambda^(tau), Lambda^(tau)) -- i.e.
        the object against ITSELF, recomputed from an independently generated
        key -- before it is applied to (Lambda^(tau), Lambda^(c tau)). Applied
        to the self-pair it MUST return "equivalent"; if it does not, the
        comparison is measuring key-to-key noise and cannot decide C5.
      - >-
        ARCHIVE CHECK (zero compute). No prior measurement of any of C1-C7
        exists in this program; GOAL-HAWK-001 has run zero experiments. Recorded
        as unavailable rather than as a passed check.
    required_metrics:
      - the involution count per conductor for the whole census set, and the closed-form comparison
      - the explicit unique-involution set and gap set as sorted integer lists
      - the five invariants of Lambda^(tau) and Lambda^(c tau) at n = 8, 16
      - lambda_1^2 per (m, involution) with the enumeration node count
      - per-conductor pass/fail of each of the four forced values at m = 12, 20, 28, 36, 44
      - the C5 self-pair control result, reported before the cross-pair result

  falsification_conditions:
    - >-
      C1 mismatches at any conductor. (E1) is wrong, the census is void, and
      claims (A) and (B) fall with it. Cost of finding out: seconds.
    - >-
      C2 does not reproduce {4, p^k, 2p^k}. Either the derivation or the relayed
      evasion criterion is wrong; the record must say which before saying
      anything else.
    - >-
      C3 is empty. The distinction between "second involution exists" and "tau
      exists" is vacuous and claim (B) is withdrawn.
    - >-
      C5 returns full agreement on all five invariants at both n. The third
      cocycle is a change of coordinates, the symmetry budget is effectively
      two, and claim (A)'s forward-looking half is closed -- with an obstruction
      and an argument, which is the closure standard, and with (E5)(ii)'s
      order-4 lenses named as what remains open.
    - >-
      PC-B fails. Nothing negative may be reported from Stage 2 or Stage 3 at
      all.
    - >-
      C7 returns lambda_1^2 != n/4 at any tested point. The derived bound in
      (E3) is wrong or the instrument is, and both the census's downstream half
      and the sibling proposal need re-derivation.

  confounders:
    - >-
      CENSUS-VERSUS-CONSTRUCTION CONFLATION. The whole risk of this proposal is
      concluding, from "m has a second involution", that "the attack applies to
      m". It does not follow -- (E3) gives only the generic half -- and every
      output of Stage 1 must be reported with that caveat attached, or the
      record will be misread as an applicability map when it is a
      NECESSARY-CONDITION map.
    - >-
      SMALL-n DEGENERACY. At n = 4 the field F is Q and Tr_{F/Q}(1) = 1, so
      several quantities collapse. m = 12 (n = 4) is retained as a control but
      its result may not be extrapolated, and the contract says so.
    - >-
      INSTRUMENT INHERITANCE. Stages 2 and 3 inherit every risk of
      EXP-HAWK-a2f34a, including the possibility that the derived defining
      system is not the paper's lattice. The dependency is declared as a hard
      precondition, not a caveat.
    - >-
      RAMIFICATION AT m = 4p. The conductors 12, 20, 28, 36, 44 are not "HAWK
      with a different m" -- HAWK is defined only over 2-power cyclotomics, and
      no HAWK parameter set uses them. They are NEARBY OBJECTS chosen because
      the hoped-for conclusion is expected to fail there. Nothing measured at
      them is a statement about HAWK.
    - >-
      AUTHORSHIP ASYMMETRY. A census is cheap to produce and reads as rigour.
      The design's answer is C5 and C6, which can both come out against the
      proposal, and the pre-frozen null disposition for C5.

  interpretation_limits:
    - >-
      NO ASSESSMENT OF HAWK'S SECURITY IS MADE IN EITHER DIRECTION, AND NO
      ATTACK IS PROPOSED. The census is a statement about Galois groups. The
      c*tau arm is an exploratory measurement of a lattice's invariants.
    - >-
      A NON-EMPTY GAP SET IS NOT AN ATTACK ON THOSE CONDUCTORS. It says only
      that the paper's evasion criterion and the paper's construction are
      different sets, so a conductor outside the evasion set is not thereby
      shown vulnerable.
    - >-
      NOTHING HERE RECOMMENDS A ROUND-3 PARAMETER CHANGE. HAWK's tweak deadline
      of 2026-08-14 is recorded in KN-OPEN-028 and is the reason the question is
      timely, not a licence to issue advice on the basis of an unrun contract.
    - >-
      The exhaustion statement (C4) is about ORDER-2 GALOIS LENSES ONLY. It does
      not say the field has no other exploitable structure, and (E5) names three
      classes it does not cover.
    - >-
      Claim tier toy throughout. n <= 32; deployed HAWK has n in {256, 512,
      1024}. The census half is n-independent and is a statement about
      conductors, which is a different kind of scope limitation and is stated
      separately rather than folded in.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE IS LOAD-BEARING FOR THE CENSUS. C1-C4 are consequences of the CRT
        decomposition of (Z/m)^x and of the structure of (Z/2^e)^x, both
        standard theorems, and every predicted value is checked by exhaustive
        enumeration rather than sampled. There is no distributional claim, no
        asymptotic, and no random model anywhere in Stage 1.
      rigorous_support: >-
        (Z/m)^x = prod (Z/p_i^{e_i})^x by CRT; each odd factor cyclic of even
        order hence exactly one involution; (Z/2^e)^x trivial / C_2 /
        C_2 x C_{2^{e-2}} for e <= 1 / = 2 / >= 3. The 2-torsion of a product is
        the product of the 2-torsions.
      validation_plan: >-
        Exhaustive enumeration for every m <= 2000 against the closed form, plus
        the NULL-A additive-group control that proves the enumerator is
        sensitive to the group law.
    - id: H2
      statement: >-
        Every lens usable by this construction is an involution of Gal(K/Q), so
        the census is complete for the construction.
      rigorous_support: >-
        Derived in (E3): the adj-pattern conditions come from sigma(V) = V^{-1},
        which comes from sigma^2 = 1. NOT derived, and explicitly flagged: that
        no OTHER construction using a non-involutive automorphism could work.
        (E5)(ii) states the order-4 alternative and names it open. This is the
        weakest link in the exhaustion claim and it bounds the claim rather than
        undermining it.
      validation_plan: >-
        Not experimentally validatable; it is a scope statement. It is
        discharged by writing the limitation into C4's interpretation, which
        interpretation_limits does.
    - id: H3
      statement: >-
        det Y in F for Y in Lambda_B^(sigma), so Q^(sigma) is well defined.
      rigorous_support: >-
        sigma-invariance derived; c-invariance assumed. Identical to
        IDEA-20260805-6eac55 H3.
      validation_plan: >-
        Inherited instrument self-test CHK-3 in EXP-HAWK-a2f34a, run per
        conductor and per involution rather than once.

  target_complexity:
    time_exponent: >-
      THIS PROPOSAL MOVES NO EXPONENT, and the honest statement of why is
      specific rather than generic: the census is a decidability map, and the
      c*tau arm MEASURES a lattice's invariants without pricing any solver on
      it. The only route by which this line could touch an exponent is the one
      named in (E4): if the cocycle identity V_{c tau} = V_c * c(V_tau) lets two
      lattices be intersected to produce an SVP instance in dimension BELOW
      n/2 + 1. That is a speculative step, it is NOT proposed for execution
      here, and it is not attempted before C5 answers whether the two lattices
      are even distinct. Stating the route without proposing it is the honest
      position; proposing it before C5 would be the premature step.
    memory_exponent: >-
      n/a. The census is O(m) integers; the lattice arms are under 1 GB at
      n <= 32.
    best_known: >-
      For HAWK key recovery: oracle dimension n/2 + 1 as reported by
      KN-LIT-7592 and NOT verified here, contested by a relayed 3m/8 + 1 from
      iacr:2026/1560 whose normalisation is unresolved (see
      IDEA-20260805-3a855d). For the census question there is no "best known" --
      it is a computation, not a competition.
    hidden_overhead: >-
      None in Stage 1. In Stages 2-3, the enumeration node count, reported.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no attack, no cost claim, no Pareto point). Rows checked before setting
    this: the entire HAWK lane of this corpus (enumerated in
    novelty_screen.what_the_screen_could_see) holds no computed quantity on any
    axis, so there is nothing to be dominated BY within the program; and on the
    external frontier this proposal offers no time, memory or query figure to
    compare, which is why the field is n/a and not null. Explicitly NOT checked,
    and stated as unchecked: whether the disclosed attack's own appendix already
    contains the involution census (its body was never read), and whether
    iacr:2026/1560 does.
  sota_delta: >-
    Zero on every attack axis; no attack is proposed. Quantitatively, on the
    axes this proposal does move: the corpus's holding on conductor evasion goes
    from ONE relayed sentence with no derivation to a checked closed form
    2^{r+delta} - 1 validated at 200+ conductors, an explicit unique-involution
    set, an explicit non-empty gap set that the relayed sentence does not
    distinguish, and an exhaustion statement (exactly three lenses for m = 2^ell)
    that no record currently holds. The c*tau arm converts an unasked question
    into either a distinct measured object or a recorded coordinate-change null.
    Cost: seconds for the census, minutes for the rest, no external source, no
    solver.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.95 that the census half (C1-C4) is confirmed exactly. It is elementary
    group theory, it was spot-checked in this session by direct enumeration at
    twenty conductors, and every predicted value matched. It is not 1.00 because
    the closed form is stated here from a derivation performed in this session
    rather than quoted from a text, and because delta's three-case definition is
    the kind of detail that is easy to state one case wrong.
    0.35 that the c*tau lattice (C5) is a genuinely distinct object rather than
    a relabelling of the tau lattice. Not higher because both lenses have the
    SAME fixed field F and therefore the same length form, which is a strong
    hint that the two objects are related by an obvious symmetry; not lower
    because the two involutions have DIFFERENT degree-n/2 fixed fields
    (K^tau is the smaller cyclotomic field, K^{c tau} is neither that nor the
    totally real field), because the cocycle identity V_{c tau} = V_c c(V_tau)
    relates them through V_c rather than mapping one to the other, and because
    the disclosed attack's own lesson -- recorded verbatim in KN-LIT-7592 -- is
    that "a symmetry being well known to exist is not the same as its
    consequences having been worked out".
    0.15 that all four forced values survive at m = 4p (C6). Low because
    Proposition 4.5's proof is reported to use the 2-power structure and because
    ramification at p changes the trace form; a survival would be the surprise
    of the batch and is the reason C6 is run rather than assumed.
