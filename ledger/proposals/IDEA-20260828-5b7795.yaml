idea:
  id: IDEA-20260828-5b7795
  question_id: RQ-MLKEM-003
  added: '2026-08-28'
  title: >-
    RQ-MLKEM-003's target #4 (decapsulation-failure and FO-transform assumptions as a separate
    flank from lattice cost) is the only one of the RQ's four declared targets untouched by any of
    the 25 filed proposals: audit whether the FO-transform's QROM security bound's WORST-CASE
    correctness-error requirement, honestly evaluated, is negligible or comparable to the smallest
    committed core-SVP margin this program already holds (EV-MLKEM-020, +1.276377 bits at
    ML-KEM-1024) — a term nobody in this program has sized against a term everyone has
  class: control
  claim: >-
    (A) THE GAP. RQ-MLKEM-003 names, as its fourth scope target, "decapsulation-failure and
    FO-transform assumptions as a separate flank from the lattice cost." Of the 25 proposals filed
    against this RQ, none mentions the Fujisaki-Okamoto transform, HHK, decryption-failure
    correctness bounds, or any FO-transform proof variant. GOAL-MLKEM-001 (closed at budget)
    investigated ML-KEM's re-encryption COMPARISON as a code-level, timing-adjacent conformance
    question (a byte-complete differential gate distinguishing incomplete comparisons,
    KN-FIND-001) — an implementation object, not a security-proof object. Target #4's actual
    subject — the correctness-error term IN THE SECURITY PROOF — has never been touched.
    (B) THE SPECIFIC GAP IN THE PROOF, GROUNDED IN LITERATURE RETRIEVED THIS SESSION. The generic
    FO-transform QROM security theorem (Hofheinz-Hövelmanns-Kiltz, TCC 2017 / ePrint 2017/604,
    with published errata correcting the bound's coefficient to 8*(q_G+q_P+1)^2*delta) requires a
    bound delta on decryption failure that must hold UNIFORMLY over all keys and all
    (possibly adversarially chosen) plaintexts and randomness — a WORST-CASE quantity, call it
    delta_1. What FIPS 203 / the Kyber submission computes and reports is the AVERAGE-CASE failure
    probability delta over honestly-generated keys and uniformly random plaintexts (recalled this
    session via web search as roughly 2^-139 to 2^-174 across the three parameter sets, "below
    2^-138 for every parameter set" — UNVERIFIED, pending a primary-source read in Stage 0). A
    directly on-topic paper retrieved and read this session, Hövelmanns-Hülsing-Majenz, "Failing
    gracefully: Decryption failures and the Fujisaki-Okamoto transform" (ASIACRYPT 2022 / ePrint
    2022/365 / arXiv:2203.10182), states in substance exactly this gap: security proofs require
    the worst-case delta_1, deployed schemes report the average-case delta, and "these are
    fundamentally different metrics." A second, more recent line (Barbosa-Hülsing, ePrint 2023/755,
    "The security of Kyber's FO-transform," following Maram-Xagawa PKC'23) gives DIRECT proofs for
    Kyber's specific FO variant that may sidestep the delta_1 requirement altogether via a
    differently-formulated failure-finding game — meaning "the correctness-error term" is not one
    well-defined number until a specific proof variant is named, and this program has never named
    one.
    (C) THE CLAIM, FALSIFIABLE. At each FIPS 203 parameter set, and under a stated query-budget
    surrogate for NIST's classical-security-category definition, EITHER (i) the correctness-error
    term is negligible under every enumerated reading (naive worst-case union-bound surrogate for
    delta_1, and the modern reformulated non-delta_1-requiring bound) relative to the smallest
    committed core-SVP margin this program holds (+1.276377 bits, ML-KEM-1024, EV-MLKEM-020) — a
    clean closure of target #4 with a computed number instead of silence — OR (ii) under at least
    one reading it is comparable to or exceeds that margin, meaning this program's 12+-batch
    treatment of the lattice term as the whole security-margin story has an unexamined, potentially
    decisive, second term.
    (D) WHAT IS NOT CLAIMED. No attack. No statement that ML-KEM is insecure. No claim about
    Guo-Johansson-style failure-BOOSTING attacks (an active adversary hunting for failing
    ciphertexts, already partially represented via KN-OPEN-016) — this record concerns the STATIC
    SIZE of a term in an already-published proof, not a search for failures.
  mechanism: >-
    STAGE 0 (reading, zero compute). (0a) Fetch and READ, not summarize-from-search, HHK's ePrint
    2017/604 including its errata, for the exact FO^perp_m QROM bound and its coefficient and
    query-term structure. (0b) Re-fetch and confirm the arXiv 2203.10182 (Hövelmanns-Hülsing-Majenz)
    analysis already retrieved this session, plus attempt Barbosa-Hülsing ePrint 2023/755 again (two
    WebFetch attempts this session both returned HTTP 429; a fresh session or a mirror should
    retry) and the paper this session's search surfaced under the title "A Note on Failing
    Gracefully: Completing the Picture for Explicitly Rejecting Fujisaki-Okamoto Transforms Using
    Worst-Case Correctness" (authors/venue not yet confirmed), for the modern non-delta_1
    reformulation(s). (0c) Locate FIPS 203's own per-parameter-set average-case delta from a
    primary or vendored source — note explicitly that csrc.nist.gov/nist.gov are reported
    unreachable from this harness (per RQ-MLKEM-003's own provenance field), so Stage 0 must check
    for a vendored copy under inputs/ or a non-NIST-domain mirror (e.g. the pq-crystals Kyber
    specification PDF) before falling back to secondary reporting, and must flag whichever route is
    used. (0d) Read FIPS 203 / SP 800-208-adjacent category definitions for a per-category query
    budget on (q_G, q_P, q_D); if no such per-scheme cap is published, use the category's own
    claimed classical-security exponent (e.g. 2^143) as a stated, flagged modeling surrogate for a
    query-count ceiling.
    STAGE 1 (arithmetic). Evaluate three READINGS of the correctness-error term per parameter set:
    (i) the naive worst-case union-bound surrogate delta_1_upper_bound <= 256*k_rank *
    delta_max_coeff (an explicit, admittedly crude, upper bound built from delta and the number of
    ciphertext coefficients an adversary could in principle target); (ii) FIPS 203's own reported
    average-case delta substituted directly into HHK's coefficient (the reading the community
    treats as adequate in practice); (iii) the modern reformulated bound from whichever of the
    Stage-0(b) papers is successfully read. Compute all three at all three parameter sets and at
    the Stage-0(d) query-budget surrogate.
    STAGE 2 (comparison). Report the signed difference of each reading against EV-MLKEM-020's
    committed core-SVP margins (+2.800527 / +6.041285 / +1.276377 bits), per parameter set, side by
    side, with no reading silently preferred.
    STAGE 3 (null check). Apply the identical Stage-1 arithmetic to a hypothetical scheme whose
    average-case delta is inflated by 2^60 (a deliberately badly-correctness-parameterized scheme).
    The naive worst-case term MUST then visibly dominate any plausible margin; if it does not, the
    arithmetic pipeline is broken and no real-parameter number is reported.
  novelty_status: unverified
  citations:
    - ref: 'Hofheinz, Hövelmanns, Kiltz, "A Modular Analysis of the Fujisaki-Okamoto Transformation", TCC 2017 / ePrint 2017/604 (with published errata)'
      provenance: recalled
      claim: >-
        QROM IND-CCA bound for FO^perp_m includes an additive term 8*(q_G+q_P+1)^2*delta (corrected
        from an earlier 8*(q_G+1)^2*delta), where delta must be a bound uniform over all keys and
        plaintexts (worst-case). Surfaced via WebSearch synthesis this session; direct WebFetch of
        the PDF returned HTTP 429 and could not be independently confirmed. Stage 0 must re-fetch
        and read before this coefficient is trusted.
      verified_by: null
    - ref: 'Hövelmanns, Hülsing, Majenz, "Failing gracefully: Decryption failures and the Fujisaki-Okamoto transform", ASIACRYPT 2022 / ePrint 2022/365 / arXiv:2203.10182'
      provenance: retrieved
      claim: >-
        States that FO-transform security proofs require bounding the worst-case decryption
        failure probability (delta_1) while Kyber-family implementations report the average-case
        failure probability (delta); these are stated as fundamentally different metrics, with
        reported average-case rates significantly lower than the worst-case bound the generic proof
        needs. The paper's own contribution reformulates the proof via two new security games
        (public-key-dependent failure finding; statistical random-oracle failure finding) rather
        than requiring a single worst-case delta_1.
      verified_by: "idea-generator subagent (WebFetch, this session, 2026-08-28)"
    - ref: "Barbosa, Hülsing, \"The security of Kyber's FO-transform\", ePrint 2023/755"
      provenance: recalled
      claim: >-
        Gives a direct QROM proof for Kyber's specific FO variant (following Maram-Xagawa, PKC'23),
        avoiding indirection through generic FO-with-explicit-rejection. Surfaced via WebSearch
        synthesis only; two WebFetch attempts this session both returned HTTP 429. Whether this
        proof still requires a worst-case delta_1-like quantity is UNCONFIRMED.
      verified_by: null
    - ref: >-
        "A Note on Failing Gracefully: Completing the Picture for Explicitly Rejecting
        Fujisaki-Okamoto Transforms Using Worst-Case Correctness" (Springer chapter, exact authors
        and year not confirmed this session)
      provenance: recalled
      claim: >-
        Title alone (surfaced via WebSearch) indicates this paper directly targets worst-case
        correctness for explicitly-rejecting FO transforms, which is precisely this record's
        subject; content unread.
      verified_by: null
    - ref: 'FIPS 203 / Kyber decryption-failure probability values (approx. 2^-139 to 2^-174 across parameter sets, "below 2^-138 for every parameter set")'
      provenance: recalled
      claim: >-
        Average-case decryption failure probabilities per ML-KEM parameter set, order-of-magnitude.
        Surfaced via WebSearch synthesis, not a direct primary fetch (NIST domains are reported
        unreachable from this harness per RQ-MLKEM-003's own provenance note). Stage 0 must locate a
        vendored or mirrored primary source before these numbers are load-bearing.
      verified_by: null
    - ref: EV-MLKEM-020 (committed evidence record, this repository)
      provenance: internal
      claim: >-
        Committed primal_bdd/RC.MATZOV margins against NIST classical cutoffs: +2.800527 /
        +6.041285 / +1.276377 bits at ML-KEM-512/768/1024.
      verified_by: >-
        Not independently opened this session; transcribed from verbatim quotations inside
        IDEA-20260821-374af4 and IDEA-20260821-46c09f, both read in full this session. Stage 0 must
        re-verify directly against ledger/evidence/EV-MLKEM-020.yaml.
    - ref: RQ-MLKEM-003 (this repository)
      provenance: internal
      claim: >-
        Names "decapsulation-failure and FO-transform assumptions as a separate flank from the
        lattice cost" as an explicit scope target (target 4).
      verified_by: "idea-generator subagent (read in full, ledger/questions/RQ-MLKEM-003.yaml)"
  assumptions:
    - "The three enumerated readings (naive worst-case union bound, average-case as reported, modern reformulated bound) are the operative candidates for \"the correctness-error term\"; a fourth reading this record has not found could change the comparison."
    - "NIST's category definitions imply some translatable bound on adversarial query counts; if no such translation is defensible, Stage 0 must say so and the record's query-budget surrogate is flagged as a declared, disputable modeling choice rather than a fact."
  proof_search_map:
    bottleneck: >-
      The generic HHK-style FO-to-CCA QROM reduction requires a decryption-failure bound uniform
      over all keys and all (possibly adversarially chosen) plaintexts — a worst-case quantity
      delta_1 — while FIPS 203/Kyber computes and reports only the average-case failure probability
      delta over honestly generated keys and uniformly random plaintexts. This substitution is the
      step whose scope this record measures.
    baseline_embedding:
      parameter_slice: >-
        HHK's own Theorem/Corollary for FO^perp_m (ePrint 2017/604 with errata), instantiated at
        delta = delta_1 exactly as the theorem literally requires, is the exact old-method boundary.
      reproduction_check: >-
        Symbolic re-derivation of the bound's dependence on delta from the primary theorem text
        (not a summary), confirmed against the corrected coefficient, before any numeric evaluation.
    observation_collision:
      observable: "The additive correctness-error term, e.g. 8*(q_G+q_P+1)^2*delta, as a function of query budget and delta."
      distinct_preimage_search: >-
        For a FIXED average-case delta, at least two distinct "preimages" exist for what the
        theorem's delta parameter should be substituted with: (a) a naive union-bound worst-case
        surrogate delta_1 <= 256*k_rank*delta_max_coeff, which could be dramatically larger than
        delta if an adversarially chosen plaintext/randomness pair can force much higher per-
        coefficient failure than the "typical" case FIPS 203 averages over; and (b) the modern
        reformulated bound (Hövelmanns-Hülsing-Majenz / Maram-Xagawa / Barbosa-Hülsing), which
        sidesteps the uniform worst-case requirement via a differently defined, computationally
        bounded failure-finding game. These two preimages give different sizes for "the
        correctness-error term," and which this program should use is exactly what target #4 asks.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the single implicit "delta is negligible" assumption with a named triple: (i)
          FIPS 203's reported average-case delta, (ii) a rigorously derived worst-case upper bound
          via union bound, (iii) the term as it appears in a modern reformulated proof.
        predicted_gain: >-
          Not a complexity gain: a scope-clarification gain establishing whether target #4's flank
          is closed (negligible under all readings) or open (comparable to margin under at least
          one reading).
    quantifier_order: >-
      FOR the three FIPS 203 parameter sets, FOR the query-budget surrogate Stage 0(d) derives, DOES
      THERE EXIST a reading of "the correctness-error term" under which that term exceeds the
      committed core-SVP margin (smallest: +1.276377 bits, ML-KEM-1024)? An existence question over
      a small enumerated set of readings, not a claim uniform over all possible reductions.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under reading X of the FO-transform's correctness-error term and query-budget surrogate Y,
        the additive correctness contribution to insecurity is Z bits, versus a core-SVP margin of
        W bits" — a scoped numeric comparison, never a statement that ML-KEM is or is not IND-CCA
        secure.
      nearby_object_control: >-
        A hypothetical ML-KEM variant with a much larger CBD eta (hence much larger average delta)
        is the nearby object where the naive worst-case reading should clearly dominate the lattice
        margin; the pipeline must show this or it is broken (Stage 3's null check).
    proof_obligations:
      - claim: "The exact HHK-style coefficient and query terms are transcribed from primary/corrected source text, not from a summary."
        responsibility: baseline
      - claim: "NIST's per-category query budget is read from a primary source or its absence is stated, not silently assumed."
        responsibility: scope
      - claim: "All three readings of the correctness-error term are computed and reported side by side, none silently preferred."
        responsibility: interface
      - claim: "The comparison against EV-MLKEM-020's margins uses the same parameter sets and cited, not recomputed, committed numbers."
        responsibility: baseline
    not_applicable_reason: null
  predictions:
    - metric: >-
        naive worst-case union-bound correctness term (bits) minus EV-MLKEM-020's committed margin
        (bits), at ML-KEM-1024 (smallest margin, +1.276377 bits) under NIST's implied classical
        Category-5 query-budget surrogate
      direction: different
      minimum_effect: 1.276377
    - metric: "same signed difference evaluated under the modern reformulated (non-delta_1-requiring) proof's bound instead of the naive worst-case union bound"
      direction: different
      minimum_effect: 1.276377
    - metric: "ratio, in bits, between the naive worst-case reading and the modern reformulated reading, at matched query budget and parameter set"
      direction: higher
      minimum_effect: 10
    - metric: >-
        FIPS 203's reported average-case delta per parameter set (primary-source-verified) versus
        the recalled/search-derived values used at filing (~2^-139/-164/-174)
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Stage 0 (reading only): fetch/read HHK's corrected bound, at least one modern reformulated
      proof, and FIPS 203's own per-parameter-set delta (or its best available non-NIST-domain
      mirror), plus a category-to-query-budget translation or its documented absence. Stage 1-2
      (arithmetic): evaluate all three readings at all three parameter sets and compare against
      EV-MLKEM-020's committed margins. No code execution beyond closed-form evaluation is required.
    controls:
      - "Recompute the naive worst-case reading with at least two candidate per-coefficient failure models (a probability-generating-function convolution if FIPS 203's own script is read, versus a cruder Chernoff-style bound) to check the reading isn't a union-bound artifact."
      - "Cross-check the transcribed HHK coefficient against at least one independent secondary source (e.g. the Kyber round-3 submission's own proof appendix) before trusting either."
      - "Stage 3's null check (a hypothetical scheme with delta inflated by 2^60) run before any real-parameter number is trusted."
    required_metrics:
      - "log2(delta) per parameter set, average-case as reported"
      - "log2(delta_1_upper_bound) per parameter set, naive worst-case union bound"
      - "the correctness-error term in bits under each reading, per parameter set, per query-budget surrogate"
      - "the signed difference against EV-MLKEM-020's committed margins"
  falsification_conditions:
    - "If, under every reading and every plausible query-budget surrogate, the term is more than 20 bits below the smallest committed margin at all three parameter sets, target #4's FO-transform flank is closed as negligible — a clean, reportable negative, not a null failure."
    - "If the naive worst-case reading and the modern reformulated reading disagree by less than 1 bit at every parameter set, the record's ratio-metric prediction is falsified and \"which proof variant\" is not decision-relevant for this program."
    - "If a primary read of FIPS 203's own text shows delta is already reported as a worst-case (not average-case) bound for this specific standardized document — as opposed to the generic academic HHK theorem — then part (B)'s premise is wrong and the record must say so rather than salvage it."
  confounders:
    - "NIST's category definitions may bound total adversary running time, not oracle query count directly; converting a time budget into a query-count ceiling requires a stated modeling choice that could itself move the term's size by many bits."
    - "FIPS 203/Kyber's reported average-case delta is computed by convolving per-coefficient failure probabilities via a probability-generating function (accounting for CBD/compression correlations within one ciphertext), not a naive independence assumption across 256k coefficients — so the naive union-bound surrogate for delta_1 may itself be a poor model of the true worst case, and Stage 0 must read the actual method before trusting either bound."
    - "Different FO-transform proof variants (implicit vs explicit rejection, ML-KEM's exact tweaked variant) may not share coefficients verbatim; Stage 0 must confirm which variant FIPS 203 actually specifies before importing any theorem's constants."
  interpretation_limits:
    - "This audits an EXISTING, already-published proof's bound tightness; it is not a new attack and not a claim that ML-KEM is insecure. A finding that the term is comparable to the margin says the category-assignment ARGUMENT has an unexamined term, not that a concrete attack exists."
    - "No claim is made about which category ML-KEM \"really\" belongs to; any finding is scoped to the specific proof variant, query-budget surrogate, and delta reading used."
    - "This does not evaluate active failure-boosting attacks (Guo-Johansson-style); those are a different flank, already partially represented via KN-OPEN-016."
  heuristic_assumptions:
    - id: H1
      statement: >-
        The per-parameter-set average-case decryption failure probability delta can be converted
        into a naive worst-case surrogate delta_1_upper_bound via a union bound over the 256*k_rank
        ciphertext coefficients an adversary could target, i.e. delta_1_upper_bound <=
        256*k_rank*delta_max_coeff, treating a single coefficient's failure as if an adversary could
        freely choose the other coefficients' contributions within their support.
      rigorous_support: >-
        The union bound itself is a rigorous (if loose) inequality; what is UNPROVEN is that this
        quantity actually upper-bounds the true delta_1 the HHK theorem needs (a worst case over
        adversarially chosen plaintexts AND randomness, not just over which coefficient fails) —
        recorded as the single largest open gap in this heuristic, not hidden.
      validation_plan: >-
        At toy scale (n=32-64, k=1-2, identical CBD/compression/NTT structure), compute both the
        TRUE worst-case failure probability by exhaustive or extensive randomized search over
        adversarially chosen message/randomness pairs (efficiently checkable: encrypt, decrypt,
        compare) and the union-bound surrogate. Compare at 3+ toy scales and report whether the
        ratio (true worst-case)/(union-bound surrogate) grows, shrinks, or stabilizes with
        dimension, as the explicit, stated extrapolation basis to FIPS 203 scale.
  target_complexity:
    time_exponent: >-
      N/A — no new attack algorithm is proposed. Framed as a computation, evaluating the
      correctness-error term given delta and query-count inputs is O(1) closed-form arithmetic.
    memory_exponent: N/A for the same reason.
    best_known: >-
      The committed core-SVP-based margins in EV-MLKEM-020 (+2.800527 / +6.041285 / +1.276377 bits)
      are what this proposal's derived term is measured AGAINST, not an attack this idea improves.
    hidden_overhead: >-
      "The correctness-error term" is not a single well-defined number: which FO-transform proof
      variant is cited (FO^perp with implicit/explicit rejection, the direct Maram-Xagawa/
      Barbosa-Hülsing proofs, the Hövelmanns-Hülsing-Majenz two-game reformulation) changes both the
      coefficient and whether a worst-case delta_1 is needed at all. The record must fix and name
      one reading per computation rather than blend them.
    tradeoff_note: "N/A — a scalar comparison of two additive bound components, not a time-memory tradeoff."
  dominated_by: >-
    n/a (no attack or complexity-improving result claimed; this audits an existing security-proof
    bound's magnitude against this program's own committed core-SVP margins)
  sota_delta: >-
    None claimed in advance. If Stage 0 finds the correctness-error term negligible under every
    reading, sota_delta is exactly 0 (existing conclusions stand, now with one previously-unexamined
    term ruled out explicitly, closing target #4). If comparable to or exceeding the smallest
    committed margin under at least one reading, sota_delta is a margin-accounting correction whose
    size is read directly off the computed term — reported quantitatively either way, never assumed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
