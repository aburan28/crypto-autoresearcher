idea:
  id: IDEA-20261001-5e859e
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    CALIBRATE THE F2 MITT SUCCESS PROBABILITY ON BINARY KOBLITZ: does
    P(random R decomposes as P+Q with P,Q in a size-N uniform pool) match
    N^2/(2|G|) within sampling error, or is the program-standard
    |F|^m/(m!|G|) formula misspecified for mitt search on E(F_{2^n})?

  class: instrument_calibration

  claim: >-
    EV-BINSTD-8edd9b measured uniform-arm mitt relation count 38 vs modeled
    E≈8.80 (relative error ≈3.32) at n=17, N=96, attempts=250 on
    Y^2+XY=X^3+1, blocking any HEUR-H1 reading of DP-pool yield ratios.
    CLAIM (measurement). On the same curve family at n in {17,23,31}, for
    pool sizes N spanning expected counts from ~1 to ~50, measure the
    empirical success probability p_hat that a uniform random curve point R
    admits at least one decomposition R=P+Q with P,Q in a size-N uniform
    pool (mitt search; certificate.kind=decomposition), and compare against
    three modeled columns written BEFORE measurement: (M1) unordered
    N(N-1)/(2|G|); (M2) ordered N^2/|G|; (M3) 1-exp(-N^2/|G|). Report which
    model (if any) stays within a pre-registered relative-error band across
    cells. CLAIM TIER: observational / instrument. NO exponent. NO break.
    NO n=131 transfer. Does not revive HEUR-H1; it supplies the missing
    calibration so a later HEUR-H1 re-test can trust its uniform arm.

  mechanism: >-
    OBJECT FRAME. Representation R1: curve points on binary Koblitz analog
    E: Y^2+XY=X^3+1 over F_{2^n}. Operation set Sigma: translation by pool
    elements only (Class I partial-action — identical to F2 mitt
    decomposition). Trichotomy: Class I. Lossy-projection test: not
    applicable (no new projection; calibrates an existing F2 meter).
    OFF-LIMITS: F2 is the instrument under calibration, named as component;
    F1 not used. KN-OPEN-020: not proposing a new factor base class.
    WHAT IS NEW: an explicit three-model bake-off for the mitt success
    probability that EV-BINSTD-8edd9b showed is load-bearing and currently
    wrong under M1-as-used in EXP-BINSTD-a3cfee Stage 0.

