  assumptions:
    - >-
      Toy Koblitz analog Y^2+XY=X^3+1 over F_{2^n} is an admissible
      instrument for mitt calibration; transfer to ECC2K-130 constants is
      NOT claimed.
    - >-
      Certificate.kind=decomposition with independent schoolbook re-verify
