    - OFF-LIMITS F2 named as the meter; no new Sigma.

  heuristic_assumptions:
    - id: HEUR-BINSTD-5e859e-H1
      formal_statement: >-
        FORALL tested (n,N) with E_M2 = attempts·N^2/|G| in [5,50]: the
        empirical p_hat satisfies |p_hat - p_M*| / p_M* ≤ 0.25 for exactly
        one of {M1,M2,M3} consistently across ≥3 cells (the winning model).
      random_model_justification: >-
        Rigorous ingredient: for a fixed pool of N points, the number of
        ordered pairs (P,Q) is N^2; if sums were uniform in a group of
        order |G|, P(R hit) ≈ 1-exp(-N^2/|G|). Classical distribution:
        birthday / occupancy for random maps G×G → G. Transfer to curve
        points on E(F_{2^n}) is the heuristic under test.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        No model stays within 25% relative error on ≥3 cells, OR two models
        tie within 5% on every cell (inconclusive bake-off), OR any
        certificate_pass_rate < 1.0.

  predictions:
    - metric: uniform_mitt_relative_error_vs_winning_model
      direction: lower
      minimum_effect: '≤0.25 on ≥3 cells for exactly one of M1/M2/M3'
    - metric: certificate_pass_rate
      direction: higher
      minimum_effect: '1.0'

  minimal_test: >-
