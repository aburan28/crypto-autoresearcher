idea:
  id: IDEA-20260807-394cf4
  question_id: RQ-EQJ-001
  added: '2026-08-07'
  title: EV-EQJ-001 measured a relation module collapsing to 11-15 DISTINCT coefficient rows and
    a per-block mass profile 7.5 to 152 standard deviations outside the random-subset null; DEC-20260718-006
    logged both 'for the idea pool' and the idea pool never received them
  class: measurement
  claim: 'EV-EQJ-001 rejected the isotypic linear-algebra mechanism cleanly -- exactly 4 of 10
    isotypes carry mass, every surviving block has r_lambda = r_full so rank never splits, and
    sum r_lambda^3 = 4 r_full^3, a 4x LOSS. But the NEGATIVE CONTROL DID NOT FIRE: ''the EC per-block
    profile lies outside the 8-draw random-subset null envelope for all 10 blocks at all 9 cells
    (|z| = 7.5..152)'', and DEC-20260718-006 states the consequence explicitly: ''the kill is
    no asymptotic gain, not not-EC-specific''. Separately the record documents fiber relations
    collapsing to 64-67, 12 and 11-15 distinct coefficient rows at p = 211, 1009, 4099, with rank_full
    ~ #distinct rows. DEC-20260718-006''s next_actions say: ''The distinct-row collapse observation
    is logged for the idea pool (relation-module compressibility), detached from the isotypic
    mechanism.'' A grep for ''distinct-row'' or ''relation-module compressibility'' across ledger/,
    knowledge/ and experiments/ returns only EV-EQJ-001, DEC-20260718-006, the EXP-EQJ-001 analysis
    and two run manifests. Forward guidance naming no record is guidance nobody can follow.'
  mechanism: 'Two cheap measurements on artifacts EXP-EQJ-001 already produced. (i) Extend the
    distinct-row census to larger k/p ratios and to m = 5, testing whether #distinct rows / #relations
    keeps collapsing. EV-EQJ-001''s own unresolved_confound says the collapse is what forced r_full
    < k and ''could mask block-rank arrival that only appears at much larger k/p ratios'', so
    this is simultaneously the RETEST of the isotypic kill and the compressibility measurement.
    (ii) Treat the per-block mass vector w_lambda as a CURVE INVARIANT and test whether it varies
    across curves of the same order -- EV-EQJ-001 tested one curve per size and flags ''curve-to-curve
    variation untested''. That decides whether the |z| = 152 signal carries curve-distinguishing
    bits or is a fixed consequence of S_3-invariance.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - knowledge
    grep_results:
    - The three ledger proposals mentioning 'isotypic' (IDEA-20260805-4ed1b1, IDEA-20260805-74e78c,
      IDEA-20260805-54723a) are in the xedni/E8, MAYO and SNOVA lanes; none concerns the ECDLP
      relation module.
    - KN-TECH-012 (isotypic/equivariant decomposition of symmetric relation systems) is cited
      by no ledger or experiment record at all.
    conclusion: Both observations are orphaned. External novelty unverified.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: the isotypic LINEAR-ALGEBRA
      COST mechanism, which EV-EQJ-001 killed and which this record does not revive. The objects
      here are the distinct-row count and the block-mass vector.'
    tracked_object: The pair (number of distinct coefficient rows, per-block mass vector w_lambda)
      of the relation module.
    one_step_propagation_rule: Adding a relation either adds a new distinct row or does not, and
      updates w_lambda by its projection onto each isotype -- both deterministic given the relation.
    newness_score: As mathematics, low. As a measurement, w_lambda has never been treated as a
      curve invariant by anyone, and a 152-sigma departure from a matched null was filed as not-the-kill
      and dropped.
  lossy_projection_identifiability_audit:
    projection: the relation module -> (distinct-row count, block-mass vector).
    what_is_discarded: Which relations produced which rows; the module is not recoverable.
    is_it_only_a_change_of_coordinates: 'NO. w_lambda is a 10-vector summarising a module of dimension
      in the hundreds. Honest caveat: 4 of the 10 entries are exactly zero for representation-theoretic
      reasons, so the free part is a 4-vector and the object is weak.'
    mirror_failure_check: CHECKED and this is the crux. If w_lambda is FORCED by S_3-invariance
      alone it is constant across curves and carries nothing -- that is exactly what measurement
      (ii) tests, and a constant value is a clean forced-value closure rather than a finding.
  null_object_control:
    primary_null: 'The 8-draw random-subset null EV-EQJ-001 already implements, extended to the
      new cells. For measurement (ii) the null is a second curve of the SAME ORDER: if w_lambda
      is identical across same-order curves it is not a curve invariant.'
    secondary_nulls:
    - 'REGRESSION: reproduce the committed |z| range and the 11-15 distinct-row counts at p =
      4099 before extending.'
    - 'FORCED-ZERO GATE: the 6 representation-theoretically zero isotypes must remain exactly
      zero in every new cell; a nonzero value means the projection is wrong.'
  assumptions:
  - EXP-EQJ-001's artifacts and harness support larger k/p and m = 5 without redesign.
  - Multiple curves of the same order are constructible at p = 1009 and p = 4099.
  predictions:
  - metric: '#distinct coefficient rows / #relations as k/p grows'
    direction: lower
    minimum_effect: Continued decline at two larger k/p ratios, i.e. the collapse is not an artifact
      of the tested range.
  - metric: variation of w_lambda across same-order curves
    direction: different
    minimum_effect: Between-curve spread exceeding the within-curve null spread at any block.
  minimal_test:
    design: Extend the census to two larger k/p ratios and to m = 5 at p = 1009 and 4099; and
      compute w_lambda on three distinct curves of each order, reporting between-curve spread
      against the 8-draw null.
    controls:
    - 8-draw random-subset null
    - same-order second curve
    - forced-zero isotype gate
    - committed-value regression
    required_metrics:
    - distinct-row ratio per cell
    - w_lambda per curve
    - between-curve spread versus null envelope
    - r_full and k
  falsification_conditions:
  - 'The distinct-row ratio stops falling at larger k/p: the collapse is a small-sample artifact
    and the isotypic kill stands unqualified.'
  - 'w_lambda is identical across same-order curves: it is forced by S_3-invariance, carries no
    curve-distinguishing bits, and the |z| = 152 signal closes as a forced value.'
  - 'The forced-zero isotypes are nonzero anywhere: the projection is misimplemented and no reading
    is admissible.'
  confounders:
  - Larger k/p changes r_full mechanically; report the ratio, not the count.
  - Curves of the same order may be isogenous, which is not independence; report the isogeny class
    of each.
  - The 8-draw null is small; widen it before reading a between-curve spread.
  interpretation_limits:
  - Toy scale, p <= 4099. No cryptographic-scale claim.
  - Relation-module compressibility bears on the LINEAR-ALGEBRA stage, a different cost driver
    from the solving degree; it is not an exponent claim.
  - EV-EQJ-001's kill of the isotypic cost mechanism is not disputed.
  heuristic_assumptions:
  - id: HEUR-EQJ2-1
    statement: Distinct-row collapse at p <= 4099 is indicative of behaviour at larger p.
    rigorous_support: None.
    validation_plan: Report per-p, refuse to pool, and extend to a fourth p if the trend is ambiguous.
  target_complexity:
    time_exponent: n/a -- measurement
    memory_exponent: Compressibility bears on matrix memory; measured, not claimed.
    best_known: Pollard rho at exponent 1/2
    hidden_overhead: n/a
    tradeoff_note: No exponent claim.
  dominated_by: 'Pollard rho at exponent 1/2. Rows checked across time, memory and data/queries
    before writing: Pollard rho (p^{1/2}, O(1) memory); BSGS (p^{1/2}, p^{1/2}); vOW parallel
    rho (p^{1/2}/w); Semaev index calculus at ~2.05 per target (FINDING-PF-IC-001, toy). Queries
    0 on every row. No row added.'
  sota_delta: ZERO. Deliverable is either a measured non-generic curve invariant or a clean forced
    value that closes the isotypic lane properly instead of by fatigue.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 0.7 that the distinct-row collapse persists at larger k/p. 0.35 that
    w_lambda varies across same-order curves -- S_3-invariance plausibly forces it entirely, which
    is the modal outcome and is a legitimate closure. 0.05 that any of this reaches a cost statement.
