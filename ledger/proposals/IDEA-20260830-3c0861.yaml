  confounders:
    - >-
      UNIT SLIPPAGE BETWEEN q AND N. The single most dangerous error available here:
      2-2/n in q is N^{(2n-2)/n^2} in N, and at n = 2 that is N^{1/2} while the model's
      4/3 in q is N^{2/3}. Every row carries both columns for this reason and a row
      with one column is inadmissible.
    - >-
      OBJECT CONFLATION. Genus-g class groups, Weil restrictions of degree n, trace
      zero varieties and cover-and-decompose attacks all appear in the same search
      results with the same symbolic exponent and different meanings for the index.
    - >-
      VALIDITY RANGE. Several statements in this area are asserted for fixed n with q
      growing, others for n growing, others only for n above a threshold. Evaluating a
      threshold-restricted claim below its threshold manufactures a false result.
    - >-
      SEARCH-SUMMARY LAUNDERING. The summaries obtained this session are
      model-generated syntheses of snippets, not sources. Every claim in this record
      that leans on one is marked recalled with verified_by null, and the record's
      novelty_status is unverified for exactly that reason. A later reader must not
      promote a recalled line to retrieved because it appears in a committed record.
    - >-
      THE PRIME-FIELD TRANSFER IS NOT TESTED BY THIS GATE AT ALL. The gate tests a
      shared formula at a point where the answer is known. It does not test whether the
      formula applies where the answer is unknown, and every deliverable must say so.

