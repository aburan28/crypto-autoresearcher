  heuristic_assumptions:
    - id: H1
      statement: >-
        The two-term charge's extension-field instantiation with a polylog oracle is
        the correct reading of the algorithm the transcribed source analyses -- i.e.
        the source's algorithm uses a subfield-line factor base of size Theta(q), an
        arity equal to the extension degree, and a decomposition solve whose cost is
        q^{o(1)} at fixed n.
      rigorous_support: >-
        The internal cross-check is exact and requires no source: KN-FIND-007's
        conservation identity at B = q, N = q^n, m = n returns exactly the 1/n!
        decomposition probability that the extension-field literature uses, which
        confirms that the yield limb of the instantiation matches. The imitated
        classical statement is the standard fixed-n asymptotic convention in which the
        Groebner solve of a bounded-size system is polylog in q. What is assumed is
        only that the source's algorithm matches this instantiation in its factor-base
        size and arity -- checkable directly from the source and therefore not a
        permanent assumption but a transcription obligation.
      validation_plan: >-
        SAMPLE. Not a sampling assumption; it is validated by reading the source's own
        algorithm description and recording the factor-base size, arity, and solve
        cost verbatim. COMPARISON. Each of the three quantities against the
        instantiation above, one row each, PASS or FAIL. TAIL CHECK. If the source's
        factor base is a REDUCED subfield line of size q^{1-1/n} rather than Theta(q),
        the instantiation is different and fa9839's observation collision already
        predicts the model's relation term dominates at that base -- which must then be
        recorded as the resolution rather than treated as a model failure. TRANSFER.
        None; the assumption is discharged by reading, not by extrapolation.
    - id: H2
      statement: >-
        The signed discrepancy is a stable function of n over the transcribed range,
        i.e. the two exponent expressions being compared refer to the same algorithmic
        object at every n in that range, so the trajectory 2/(n(n+1)) is a meaningful
        prediction rather than a comparison of different algorithms at different n.
      rigorous_support: >-
        Rigorous for the arithmetic: 2n/(n+1) - (2 - 2/n) = 2/(n(n+1)) is an identity.
        Heuristic only in the object-stability clause, which the observation collision
        above shows is exactly where this comparison has failed three times in this
        lane. The classical practice it imitates is the ordinary convention that a
        complexity stated at fixed n for a named algorithm describes one algorithm
        family across n.
      validation_plan: >-
        SAMPLE. Every transcribed row. COMPARISON. The object label recorded per row
        must be identical across the range; a range spanning two object labels is split
        into two tables and never fitted jointly. TAIL CHECK. The n = 2 and the largest
        transcribed n are the two rows most likely to come from different objects, and
        each must carry its own verbatim excerpt rather than being inferred from a
        general statement elsewhere in the source.

