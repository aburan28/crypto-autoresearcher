idea:
  id: IDEA-20260830-3c0861
  question_id: RQ-ICEX-001
  added: '2026-08-30'
  title: >-
    THE ONE KNOWN-ANSWER POINT THIS LANE HAS SITS AT EXACTLY ARITY 2, AND NOBODY HAS
    EVER EVALUATED THE GATE THERE. IDEA-20260803-fa9839 declared the primary-source
    transcription of the extension-field exponent a BLOCKING subtask and it was never
    run; IDEA-20260808-2ef5c8 inherited it unweakened; IDEA-20260829-b5a2c8 weakened
    it to a sign check its own model passes vacuously. Sharpen it to an EXPONENT check
    at n = 2, where the two-term model predicts q^{4/3} = N^{2/3} and the recalled
    literature exponent 2-2/n predicts q^1 = N^{1/2} -- a gap of exactly the N^{1/6}
    that b5a2c8 quotes as its headline shortfall. Whichever way the transcription
    falls, the m=2 verdict of every two-term record in this lane is decided by it.
  class: control

  claim: >-
    (A) THE GATE, STATED PRECISELY AND FOR THE FIRST TIME AT THE ARITY THAT MATTERS.
    The two-term point-decomposition charge used by IDEA-20260803-fa9839,
    IDEA-20260808-2ef5c8 and IDEA-20260829-b5a2c8 predicts, instantiated at
    N = q^n with arity m = n, a subfield-line factor base and a polylog decomposition
    oracle, the exponent q^{2n/(n+1)}. At n = 2 that is q^{4/3} = N^{2/3} -- numerically
    identical to b5a2c8's m = 2 free-oracle floor, and this is not a coincidence: the
    prime-field m = 2 case and the extension-field n = 2 case are the SAME slice of
    the same formula. The extension-field case has an externally known answer and the
    prime-field case does not. THEREFORE THE ONE ARITY AT WHICH THIS LANE CAN CHECK
    ITS MODEL AGAINST AN ANSWER IT DID NOT CHOOSE IS PRECISELY THE ARITY ITS DECISION
    TARGET LIVES AT.
    (B) THE TWO PRE-REGISTERED OUTCOMES, EACH DECISIVE, NEITHER AVAILABLE TODAY.
    (B1) If a transcribed primary source gives Otilde(q^{2-2/n}) valid at n = 2, i.e.
    Otilde(q) = Otilde(N^{1/2}), then the two-term full-relation-only charge
    OVERCHARGES the known case by exactly q^{1/3} = N^{1/6} AT ARITY 2. Its m = 2
    prime-field readings -- b5a2c8's Omega(N^{2/3}) floor above all -- may not be
    cited as no-gos, because the model is measurably wrong at that arity by the same
    amount as the gap it asserts.
    (B2) If the transcribed source restricts q^{2-2/n} to n >= 3 and reports nothing
    at n = 2 better than q^{4/3}, then the two-term model receives its FIRST
    known-answer corroboration at arity 2 and b5a2c8's m = 2 negative acquires real
    external support rather than resting on internal arithmetic alone.
    (C) THE SECOND, INDEPENDENT LIMB. A WebSearch summary obtained this session states
    that the naive Semaev index calculus method "cannot be more efficient than the rho
    method over an arbitrary finite field", attributed to a published complexity-bounds
    paper (DOI 10.1515/jmc-2019-0029). If that is accurate, it may SUBSUME the
    mathematical content of b5a2c8's part (B) and of much of this lane, and the honest
    contribution of every internal two-term record collapses to the audit and the toy
    discriminator. THE PAPER WAS NOT OPENED -- the publisher page returned HTTP 405 to
    WebFetch this session -- so this is recorded as a lead, and establishing whether
    it subsumes the lane is the second deliverable of this gate.
    (D) WHAT IS CLAIMED HERE, EXACTLY. Not that the model is wrong, and not that it is
    right. CLAIMED: that the gate is decidable at bibliographic cost, that it has never
    been evaluated at n = 2, that both of its outcomes change what this question may
    conclude, and that no m = 2 no-go from any two-term record in this lane should be
    quoted until it has been evaluated. Also CLAIMED, and checkable with zero external
    input: the identity 2n/(n+1) - (2 - 2/n) = 2/(n(n+1)), which at n = 2 equals
    exactly 1/3 in units of q and 1/6 in units of N.

  mechanism: >-
    THE TRACKED OBJECT AND ITS LOSSY-PROJECTION STATUS. The object followed is the
    SIGNED EXPONENT DISCREPANCY between a cost model's prediction and a transcribed
    external result, as a function of the one externally controllable knob the
    comparison has -- the extension degree n. It is a genuinely lossy projection of
    the pair (model, algorithm): it discards the algorithms entirely, the field
    representation, the solver, the constants and every constant-factor claim,
    retaining a single rational number per n. It is lossy COMPATIBLY because the
    retained quantity propagates deterministically under the only operation applied to
    it -- varying n -- with a predicted trajectory 2/(n(n+1)) that falls from 0.3333
    at n = 2 to 0.0476 at n = 6. That predicted trajectory is what makes it a
    measurement rather than a single anecdote: an instrument that does not track its
    own predicted response to the knob it claims to model is not measuring.
    Contrast the projection that FAILS the test and is exactly what
    IDEA-20260829-b5a2c8 uses: the SIGN of the verdict ("does the accounting return
    worse-than-rho at every n"). That projection is so coarse that both a correct model
    and a model wrong by N^{1/6} pass it identically at n = 2 -- IC does not beat rho
    at n = 2 under either reading -- so it discards precisely the information the gate
    exists to extract. A gate that a broken model passes is not a control.
    WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR IN THE LANE. Everything else in this
    question requires implementing a pipeline, freezing a charging convention, and
    reproducing rho's constant before a single ratio means anything. This requires
    opening a paper. Three separate records in this lane have deferred it, and the
    deferral is the reason the lane's central verdict rests on internal arithmetic that
    has never been checked against anything external at the arity it decides.
    WHY THE n = 2 CELL IS SPECIAL AND NOT JUST CONVENIENT. At n = 2 the Weil
    restriction of E/F_{q^2} is an abelian surface and the decomposition is into two
    subfield-line points -- structurally the same two-summand problem as prime-field
    m = 2, with the one difference that the extension case has an algebraic solve of
    polylog cost while the prime-field case has only the Theta(B) sweep. That single
    structural difference is the entire content of the prime-field question, and the
    n = 2 gate isolates it: if the two-term model is right at n = 2, the difference is
    fully captured by the oracle cost D and the prime-field no-go follows; if it is
    wrong at n = 2 by N^{1/6}, then something OTHER than D is missing from the charge,
    and IDEA-20260803-fa9839 already named the candidate -- partial-relation harvesting
    -- which IDEA-20260830-f2e5b7 independently derives as worth exactly that N^{1/6}
    in the prime-field case. THE GATE THEREFORE ADJUDICATES BETWEEN TWO LIVE INTERNAL
    PROPOSALS AND NOT MERELY BETWEEN A MODEL AND A PAPER.

  novelty_status: unverified

