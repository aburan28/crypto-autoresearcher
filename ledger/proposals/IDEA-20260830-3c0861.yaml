  assumptions:
    - >-
      The two-term model's extension-field instantiation is N = q^n, m = n, factor
      base the subfield line of size Theta(q), decomposition oracle of cost q^{o(1)},
      linear algebra c_LA*B^2. This is fa9839's own instantiation and is adopted
      unchanged so the gate tests the model that this lane actually uses.
    - >-
      Exponents on both sides are compared in the SAME UNIT, stated explicitly on
      every row: exponent of q, and separately exponent of N = q^n. Half the risk in
      this gate is a unit slip, and the deliverable table carries both columns for
      that reason.
    - >-
      The comparison is at FIXED n with q growing. A source whose exponent is stated
      for n growing with q, or with an o(1) that is uniform only in one variable, is
      NOT a valid gate input and must be reported as such rather than forced into the
      table.
    - >-
      No claim is made that the extension-field setting is a model of the prime-field
      setting. It is a known-answer test of a SHARED FORMULA, and the transfer
      limitation is stated in interpretation_limits.

  proof_search_map:
    bottleneck: >-
      The transcription itself. The exact step whose absence changes every downstream
      verdict is "read, from a primary source, the exponent claimed for index calculus
      on the Weil restriction of E/F_{q^n} at fixed n, with its stated validity range
      in n, and quote it with a hash".
    baseline_embedding:
      parameter_slice: >-
        n = 2, m = 2, B = Theta(q), D = q^{o(1)}. This is simultaneously the
        extension-field known-answer slice AND the arity of this question's decision
        target, which is why the gate is placed here rather than at n = 3.
      reproduction_check: >-
        Two checks that require no external source at all and must both pass before
        any transcription is attempted. (i) The conservation cross-check: the
        KN-FIND-007 identity at B = q, N = q^n, m = n must return exactly 1/n! for
        n = 2..8. (ii) The discrepancy identity 2n/(n+1) - (2 - 2/n) = 2/(n(n+1)),
        verified symbolically and numerically to 1e-12 at n = 2..8, with the n = 2
        value equal to exactly 1/3 in q and 1/6 in N. A failure of either is an
        internal algebra error and halts the gate before any bibliographic effort.
    observation_collision:
      observable: >-
        The single number "the extension-field exponent", quoted without its unit and
        without its validity range in n.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, AND IT IS WHY THIS GATE KEEPS FAILING TO BE RUN. The
        string "2 - 2/n" has at least three distinct preimages in the adjacent
        literature that a search summary does not separate: the fixed-genus class-group
        complexity Otilde(q^{2-2/g}) for curves of genus g; the abelian-variety /
        Weil-restriction exponent for the decomposition attack at extension degree n;
        and the double-large-prime variant's exponent, which is the one that actually
        beats generic methods at small n. These agree symbolically and differ in what
        n means, in the validity range, and in whether large primes are used. A
        transcription that does not record WHICH object and WHICH range is not a gate
        input, and this record's required_metrics enforce that.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the reported exponent expression fixed and vary the forgotten structure
          -- the object it describes (genus versus extension degree), the validity
          range in n, and whether partial relations are used -- to see which preimage
          the primary source actually asserts.
        predicted_gain: >-
          Converts an unusable recollection into a gate input, or establishes that no
          valid gate input exists at n = 2, which is itself a complete and reportable
          answer.
      - transform: baseline_lift
        proposed_object: >-
          Replace the sign-valued gate (does the model return worse-than-rho) with the
          rational-valued signed discrepancy as a function of n, whose predicted
          trajectory 2/(n(n+1)) is itself falsifiable.
        predicted_gain: >-
          A gate that a model wrong by N^{1/6} at n = 2 can actually fail, which the
          incumbent sign gate cannot.
    quantifier_order: >-
      CLAIMED. FOR the specific instantiation (N = q^n, m = n, subfield-line base,
      polylog oracle), FOR EACH n in the transcribed validity range, THERE EXISTS a
      signed rational discrepancy between the two-term model exponent and the
      transcribed exponent, and the model PREDICTS that discrepancy to equal
      2/(n(n+1)) exactly. The quantifier that matters and that a search summary
      destroys is the range of n over which the transcribed exponent is asserted: a
      result stated FOR ALL n >= 3 says nothing at n = 2, and reading it as if it did
      is the single most likely way this gate is mis-evaluated.
      NOT CLAIMED: anything about prime fields. The gate tests a formula, not a
      transfer.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The two-term charge, instantiated at the extension-field known-answer point,
        differs from the transcribed primary-source exponent by the signed amount X(n)
        at each n in the transcribed range." It can NEVER certify that the model is
        correct for prime fields, that any prime-field exponent is achievable, or that
        the prime-field and extension-field settings are equivalent.
      nearby_object_control: >-
        THE BINARY-FIELD SLICE, which is the closest object where the desired
        conclusion is known to fail differently. Over F_{2^n} the same decomposition
        attack has a substantially better-studied and different solving-degree
        behaviour (this corpus's KN-OPEN-002 records that the low-degree-of-regularity
        heuristic and the d_ff proxy are studied mostly over binary fields and are NOT
        settled over prime fields). If the transcribed exponent for the binary slice
        is fed through the same model and the discrepancy does NOT follow the same
        2/(n(n+1)) trajectory, then the discrepancy is not a property of the two-term
        charge at all but of the field, and the gate's diagnostic value collapses.
        That is a real way for this record to fail and it is stated here.
    proof_obligations:
      - claim: >-
          The conservation cross-check returns exactly 1/n! at n = 2..8.
        responsibility: baseline
      - claim: >-
          The discrepancy identity equals 2/(n(n+1)), with 1/3 in q at n = 2.
        responsibility: correctness
      - claim: >-
          A primary source is obtained, quoted, hashed, and its validity range in n
          recorded, OR the gate is reported UNRUN.
        responsibility: interface
      - claim: >-
          The transcribed object is identified as class-group genus, Weil-restriction
          degree, or large-prime variant, and not conflated.
        responsibility: scope
      - claim: >-
          The n = 2 cell is evaluated explicitly, or its absence from the source's
          validity range is recorded explicitly.
        responsibility: strictness

  predictions:
    - metric: >-
        signed discrepancy (model exponent in q) minus (transcribed exponent in q), at
        each n in the transcribed validity range
      direction: different
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION. Equal to 2/(n(n+1)) to within 1e-12 at every
        transcribed n, i.e. 0.3333 at n = 2, 0.1667 at n = 3, 0.1000 at n = 4,
        0.0667 at n = 5, 0.0476 at n = 6. A discrepancy that does not track that
        curve means the model is not responding to the one knob it claims to model,
        and its prime-field readings are unusable.
    - metric: >-
        the n = 2 cell specifically, in units of N
      direction: different
      minimum_effect: >-
        BINARY PRE-REGISTERED OUTCOME. Either the transcribed exponent at n = 2 is
        N^{1/2} (a tie with rho), in which case the two-term model overcharges by
        N^{1/6} AT ARITY 2 and no m = 2 prime-field no-go from it may be quoted; or it
        is N^{2/3} or worse, in which case the model is corroborated at arity 2. A
        source that does not cover n = 2 forces the third outcome: GATE UNRUN AT THE
        DECISION ARITY, which must be reported as such and is itself decision-relevant
        because it means this lane has no known-answer check at m = 2 at all.
    - metric: >-
        conservation cross-check, decomposition probability at B = q, N = q^n, m = n
      direction: different
      minimum_effect: >-
        FORCED EXACT. 1/n! for n = 2..8, requiring no external source. This is the
        only limb that survives a total failure of retrieval, and a failure here
        routes to a correction record against KN-FIND-007 rather than being absorbed.
    - metric: >-
        subsumption assessment of DOI 10.1515/jmc-2019-0029 against
        IDEA-20260829-b5a2c8 part (B)
      direction: different
      minimum_effect: >-
        A written verdict with a quoted excerpt and a hash: SUBSUMES, PARTIALLY
        SUBSUMES with the delta stated, or DOES NOT SUBSUME. If it subsumes, the
        honest contribution of every internal two-term m=2 record in this lane is the
        audit and the toy discriminator, not the inequality, and that must be recorded
        against each of them.
    - metric: >-
        object-identification of the transcribed exponent
      direction: different
      minimum_effect: >-
        Each transcribed exponent labelled as class-group genus g, Weil-restriction
        extension degree n, or double-large-prime variant, with the source's own
        wording quoted. An unlabelled exponent is not admissible as a gate input, and
        recording that no admissible input was obtained is a complete answer.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, minutes, HARD GATE, no external input). Run the two
      internal reproduction checks: the 1/n! conservation cross-check at n = 2..8, and
      the discrepancy identity 2n/(n+1) - (2-2/n) = 2/(n(n+1)) symbolically and
      numerically to 1e-12. A failure here is an internal algebra error and halts the
      gate before any bibliographic effort is spent.
      STAGE 1 (retrieval, the whole cost of the proposal). Obtain primary sources in
      this order, because it is the order of accessibility observed this session:
      (i) eprint.iacr.org/2010/157 and eprint.iacr.org/2017/609, both openly hosted;
      (ii) the arXiv full text of 1405.1059, whose analysis section compares against
      the Gaudry algorithm; (iii) the Gaudry JSC article; (iv) DOI
      10.1515/jmc-2019-0029. For each, extract the exponent, its unit, its validity
      range in n or g, whether large primes are used, and a verbatim quoted excerpt
      with a content hash. RECORD FAILURES AS FAILURES: this session obtained HTTP 403
      from ScienceDirect, HTTP 405 from the de Gruyter page, a 303 authorization
      redirect from SpringerLink, and undecoded binary from a PDF fetch. Those are
      infrastructure outcomes under AGENTS.md rule 3 and are not evidence about the
      mathematics.
      STAGE 2 (zero compute). Build the gate table: one row per (source, object, n),
      columns = model exponent in q, transcribed exponent in q, signed discrepancy,
      predicted 2/(n(n+1)), both exponents restated in units of N, and the validity
      range. The n = 2 row is the deliverable; every other row is a consistency check
      on the instrument.
      STAGE 3 (zero compute). Evaluate the binary outcome at n = 2 and write the
      consequence for each of IDEA-20260803-fa9839, IDEA-20260808-2ef5c8,
      IDEA-20260829-b5a2c8 and IDEA-20260830-f2e5b7 explicitly, one line each, as a
      proposal to the Coordinator and never as a status change.
      STAGE 4 (zero compute). Write the subsumption verdict on DOI
      10.1515/jmc-2019-0029, and file a knowledge/literature note per source actually
      opened, marking every unverified claim as such.
      NO COMPUTE IS REQUIRED AT ANY STAGE. The entire cost is retrieval, which three
      consecutive records in this lane have deferred.
    controls:
      - >-
        INTERNAL-ONLY CONTROL (blocking, runs first): the 1/n! cross-check and the
        discrepancy identity, neither of which needs an external source. If the gate
        cannot pass its own internal checks, no transcription is attempted.
      - >-
        UNIT CONTROL: every exponent recorded in BOTH q and N units, with the
        conversion shown. A gate evaluated in mixed units is void, and this is the
        most likely failure mode of the whole exercise.
      - >-
        OBJECT-IDENTIFICATION CONTROL: genus g versus extension degree n versus
        large-prime variant, labelled per row from the source's own wording. The
        observation collision above shows all three produce the same symbolic string.
      - >-
        VALIDITY-RANGE CONTROL: a source asserting its exponent only for n >= 3 may
        NOT be evaluated at n = 2. Doing so is the single most likely way to
        manufacture a false falsification of the two-term model, and it is forbidden
        in writing here.
      - >-
        NEGATIVE-RETRIEVAL CONTROL: every failed fetch recorded with its status code
        and URL, so a later session does not repeat it and does not mistake absence of
        transcription for absence of a result.
      - >-
        BINARY-FIELD NEARBY-OBJECT CONTROL: if a binary-field exponent is
        transcribable, feed it through the same model and check whether the
        discrepancy follows the same trajectory.
    required_metrics:
      - 'conservation cross-check values against 1/n! at n = 2..8, residuals to 1e-12'
      - 'discrepancy identity residuals at n = 2..8'
      - 'per source: verbatim quoted excerpt, content hash, URL, retrieval status'
      - 'per row: object label, exponent in q, exponent in N, validity range in n'
      - 'signed discrepancy per n against the predicted 2/(n(n+1))'
      - 'the n = 2 cell verdict, one of THREE declared outcomes'
      - 'subsumption verdict on DOI 10.1515/jmc-2019-0029 with excerpt'
      - 'the list of failed retrievals with status codes'

  falsification_conditions:
    - >-
      The internal discrepancy identity or the 1/n! cross-check fails. Internal
      algebra error; the gate is not run and the failure routes to a correction record.
    - >-
      A transcribed source valid at n = 2 gives N^{1/2}. The two-term
      full-relation-only model is falsified AT THE DECISION ARITY by exactly N^{1/6},
      and IDEA-20260829-b5a2c8's m = 2 floor may not be cited as a no-go. This record
      predicts nothing about which way this falls and gains nothing from either.
    - >-
      A transcribed source valid at n = 2 gives N^{2/3} or worse. The two-term model
      is corroborated at the decision arity and IDEA-20260830-f2e5b7's competing
      partial-relation derivation is placed under immediate suspicion, since it claims
      exactly the amount the gate would then have excluded.
    - >-
      No source covers n = 2. GATE UNRUN AT THE DECISION ARITY. This is a complete,
      honest and reportable outcome, and it establishes that this lane has never had a
      known-answer check at the arity it decides -- which is itself the strongest
      argument against quoting any two-term m = 2 no-go.
    - >-
      The discrepancy across n >= 3 does not track 2/(n(n+1)). The model does not
