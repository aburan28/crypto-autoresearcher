  assumptions:
    - >-
      Ordinary, prime-order, non-anomalous curves over F_p with declared
      embedding degree and twist rows (RQ scope, KN-TECH-034 screens).
      Primality of N is load-bearing: it makes the scalar map O -> Z/N well
      defined on G with pi acting as 1, which is what gives lambda_alpha.
    - >-
      c_0 and c_step are MEASURED in a single frozen cost model, not assumed.
      Every threshold in (C) is a function of their measured ratio and is
      reported as such; the numbers 10 and 32 in (C) are illustrative
      substitutions and are labelled as such wherever they appear.
    - >-
      The corrected cost Otilde(c_0 B Omega(n)) is a LOWER bound on the true
      cost: it ignores the cost of finding each kernel, of the modular
      polynomial or eigenvalue computation, and of storing the path. Using a
      lower bound makes the closure conservative, which is the intended
      direction and is stated rather than hidden.
    - >-
      Canonicalisation requires the WHOLE orbit. Using a sub-orbit of order
      m dividing h does not help: the generator of the order-m subgroup is
      alpha^{h/m}, evaluable in (h/m) applications, so the canonicalisation
      cost is m*(h/m) = h applications regardless of m, while the gain falls to
      sqrt(m). This is proved in STAGE 0 and is why h is not a free parameter.
    - >-
      No uncharged precomputation: any table of precomputed alpha-images is
      charged at build and at storage, and the record reports the ceiling both
      with and without such a table.

  object_first_candidate:
    tracked_object: >-
      The smoothness profile of the endomorphism norm,
      (P^+(N(alpha)), Omega(N(alpha)), split-fraction), together with the
      induced application cost gamma = C(alpha)/c_step.
    lossiness: >-
      GENUINELY LOSSY. The profile retains three small integers and discards
      alpha itself, its ideal, the curve, the class, the scalar lambda_alpha
      and the order h. Its fibres are huge - every alpha with the same
      factorisation shape shares it - and nothing is recoverable, so it is not
      a change of coordinates. COMPATIBILITY WITH THE OPERATIONS USED. The
      operations are composition in O and evaluation on points. Under
      composition the profile propagates deterministically in the direction the
      record needs: norms multiply, so Omega adds and P^+ takes the maximum,
      hence C(alpha beta) <= C(alpha) + C(beta) - a subadditivity that is
      exactly what makes the cost model a valid bound under the orbit
      enumeration. Under evaluation it is defined by construction. It is NOT
      compatible with F_p-isogeny to another curve (the target has a different
      order and a different O) and the record never transports it.
      DISTINCTION FROM IDEA-20260901-6b63a4'S OBJECT, WHICH IS THE POINT: that
      record tracks (N(alpha), ord_N(lambda_alpha)) - a norm and an ORDER. This
      record tracks a norm's FACTORISATION SHAPE and no order at all. The two
      projections are incomparable: neither determines the other, and the
      closure needs both, which is why this record composes rather than repeats.
    propagation: >-
      One-step propagation is defined and measurable: extend alpha by one
      split prime ideal of norm ell; Omega increments by one, P^+ becomes
      max(P^+, ell), and the measured application cost increases by exactly one
      measured c_velu(ell). STAGE 1 measures that increment directly and it is
      a blocking control.
    survival_score: >-
      Survives as long as alpha remains an endomorphism with a split
      factorisation, and dies exactly where the ideal has an inert or ramified
      factor - at which point the alpha is not a composition of F_p-rational
      isogenies and the corrected cost model does not apply. That boundary is
      measured, not assumed, as the split-fraction column.

  null_object_control: >-
    NULL-1, RANDOM-INTEGER SMOOTHNESS NULL (blocking, primary). For each
    (Delta_O, X), draw the same number of uniformly random integers of the same
    size and compute the same P^+ statistics. The elliptic norm-form values
    must differ from this null ONLY in the way genus theory predicts (the
    inert-prime factor of one half); a larger deviation means the norm form is
    not behaving as H1 assumes and the heuristic fails in the informative
    direction.
    NULL-2, INERT-ONLY alpha. Endomorphisms whose norm has an inert prime
    factor: the corrected cost model must NOT be applied to them and the
    pipeline must fall back to Otilde(n). A pipeline that quotes the smooth
    cost for an inert alpha is measuring nothing.
    POSITIVE CONTROL A (blocking): THE UNIT CASE. gamma_aut measured at j = 0
    and j = 1728 must give G(6, gamma_aut) and G(4, gamma_aut) consistent with
    EV-ENDO-10109d's measured ratio-to-ceiling means 1.0043 and 1.0442 within
    their sd 0.11. A ceiling formula that cannot reproduce the one case the
    program has measured is void.
    POSITIVE CONTROL B (blocking): PLANTED CHEAP MAP. Inject a synthetic,
    fully charged "endomorphism" whose application cost is set by hand to
    gamma = 0.05, 0.10, 0.20, 0.50 and 1.00 with a synthetic orbit of order
    h = 1/gamma, and verify the measured net gain tracks
    G_max = 1/(2 sqrt gamma) within 15 percent. This calibrates the ceiling
    formula against a dial with a known answer and is the instrument's proof of
    sensitivity.
    NEGATIVE CONTROL: gamma = 1.00 (a map as expensive as a group addition)
    must show a measured net LOSS at every h.
    MATCHED PARETO ROWS: charged rho (KN-TECH-006) and charged BSGS with memory
    (KN-TECH-031) on every curve.
    DECAY PARAMETER: N. The modelled gamma lower bound
    c_0 B log N/(c_step h log B) must GROW with N at fixed h, so the lane must
    get worse with scale. A gamma bound flat in N means the model is wrong.

  relation_to_prior:
    - >-
      IDEA-20260901-6b63a4 (NEAREST, and on a different RQ). It proves T1 and
      converts it to C1 through the step "evaluating an endomorphism of degree
      n costs Omega(n)". EXACT DELTA: this record shows that step is false for
      smooth alpha, supplies the corrected cost Otilde(c_0 B Omega(n)),
      re-derives the closure under the corrected model, and reduces the whole
      lane to one measurable inequality gamma < 1/4 with the closed-form
      ceiling 1/(2 sqrt gamma). T1 is USED, not duplicated: it is what bounds
      Omega(n) from below via n >= N^{1/h}. Their tracked objects are
      incomparable - an order versus a factorisation shape - and their
      conclusions agree, which is the point: the closure now survives its own
      best-case cost model.
    - >-
      IDEA-20260901-3e68ad. Closes ORIGIN-MOVING symmetry groups of one curve
      by H^1 = 0 and states the symmetry column's ceiling is sqrt(|Aut|/2).
      EXACT DELTA: that record's quantifier is over finite subgroups of
      Aut_var(E), all of which are FREE to apply; this record's quantifier is
      over End(E), most of whose elements are not, and its content is entirely
      the COST of applying them. 3e68ad says no other symmetry exists; this
      record says the non-symmetry maps that do exist are too expensive, and
      gives the exact price.
    - >-
      IDEA-20260829-2dc43c. Counts the unit cell and derives the population
      discount 1 + 3.02/p. EXACT DELTA: that is a POPULATION statement about
      which curves have a free map; this record is a COST statement about what
      a non-free map would have to cost to be worth using, and it applies to
      every curve including the 2p - 10 that 2dc43c's cell excludes.
    - >-
      IDEA-20260829-172151. Its Rayleigh derivation supplies sd(log T) = 0.6413
      and is used here only to size the microbenchmark's seed count; the two
      records measure different quantities (Type II error of a decision rule
      versus a cost ratio).
    - >-
      IDEA-20260829-34f3ed. Calibrates finite-size bias in N of the baseline
      residual. This record's decisive quantity gamma is a RATIO of two costs
      measured in the same run at the same N, so the finite-size offset cancels
      and no calibration constant is needed - stated explicitly so the two are
      not confused.
    - >-
      IDEA-20260901-753636, IDEA-20260829-20b05f, IDEA-20260901-e3ffc2. The
      aperture, the class column set, and the population transfer reading
      respectively. None measures an endomorphism application cost.

  proof_search_map:
    bottleneck: >-
      The step "apply a non-trivial endomorphism to a walk state". Every
      orbit-quotient proposal in this RQ and in GOAL-ENDO-001 passes through
      it; the program's current closure prices it at Omega(n) and this record
      shows the correct price is Otilde(P^+ * Omega) and then re-closes.
    baseline_embedding:
      parameter_slice: >-
        alpha a unit: n = 1, Omega = 0, C(alpha) = one field multiplication,
        gamma = gamma_aut, h in {2, 4, 6}. The corrected model must return
        G(2, gamma_aut) ~ 1.29, G(4, .) ~ 1.43 and G(6, .) ~ 1.53 at
        gamma_aut = 0.1, i.e. the KN-TECH-018 family net of canonicalisation,
        and the 0.886 convention must be recovered at h = 2.
      reproduction_check: >-
        Symbolic: substitute h = 2 and the negation map into G and recover the
        sqrt(2) already inside the 0.886 convention of KN-TECH-006, so the
        formula does not double-count. Frozen fixture: at p = 100057, j = 0 and
        j = 1728, the measured net gain must reproduce EV-ENDO-10109d's
        ratio-to-ceiling means 1.0043 and 1.0442 within their reported sd 0.11
        under the same seed count.
    observation_collision:
      observable: >-
        the cost ratio gamma and the derived ceiling G_max = 1/(2 sqrt gamma)
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. A measured gamma near 0.1 is produced
        BOTH by a genuinely free automorphism AND by an instrument that charges
        the automorphism but not the re-canonicalisation comparison that
        follows it (the min over the orbit). Those are different quantities and
        the second is what the walk actually pays. SEPARATING CONDITION,
        BLOCKING: gamma is measured as the difference of two END-TO-END charged
        walk costs at matched seeds, quotient arm minus base arm, divided by
        h - never as an isolated map timing. Second collision, in the other
        direction and equally expected: G_max near 1 is produced both by a
        genuinely marginal map and by a cost model in which c_step is
        overstated; c_step is therefore reported in raw field operations
        alongside every gamma.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "is there an exploitable endomorphism on this curve" by the
          single scalar inequality gamma < 1/4, with gamma a measured cost
          ratio.
        predicted_gain: >-
          Reduces an open-ended search over End(E) - infinite, and over every
          curve in the census - to one microbenchmark per curve, and gives the
          lane a closed-form ceiling 1/(2 sqrt gamma) that holds for every h.
      - transform: stronger_invariant
        proposed_object: >-
          Track the norm's factorisation shape (P^+, Omega, split-fraction)
          rather than the norm, because the shape is what determines cost and
          the norm is not.
        predicted_gain: >-
          Preserves exactly the extra state that survives composition in O
          (Omega adds, P^+ maximises), which is what makes the cost bound
          subadditive and therefore usable inside the orbit enumeration.
    quantifier_order: >-
      CLAIMED (B): FOR ALL curves in scope, FOR ALL alpha in End(E) and FOR ALL
      orbit orders h, the net gain of orbit-canonicalised rho is at most
      1/(2 sqrt(gamma_alpha)) where gamma_alpha is that alpha's measured
      application cost ratio. CLAIMED (C): FOR ALL non-unit alpha, THERE EXISTS
      a threshold N_0(c_0, c_step) above which the gain is below 1, and N_0 is
      computed from the measured constants. EXPLICITLY NOT CLAIMED: that Velu
      composition is the optimal evaluation - a faster evaluation would lower
      gamma and raise the ceiling, and the record states this as its own method
      ceiling rather than assuming it away. ALSO NOT CLAIMED: anything about
      maps that are not endomorphisms.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested curves and cost model, the cheapest applicable non-unit
        endomorphism has gamma_min = g +/- CI, so no orbit-quotient rho variant
        built from it can gain more than 1/(2 sqrt g), and at the measured
        (c_0, c_step) the non-unit branch is below break-even for every group
        order above N_0." It can NEVER certify that no faster evaluation of
        endomorphisms exists, that no non-orbit mechanism uses End(E), or
        anything about the exponent.
      nearby_object_control: >-
        THE SUPERSINGULAR CURVE OVER F_{p^2}, where End is a maximal order in a
        quaternion algebra, the unit group can be larger, and cheap non-scalar
        endomorphisms genuinely exist. The method must show gamma_min DROPPING
        there while staying above 1/4 over F_p. A method reporting the same
        gamma_min on both has not identified the load-bearing structure
        (commutativity and rank 2 of the ordinary endomorphism ring), and its
        closure is void.
    proof_obligations:
      - claim: "A smooth split-ideal alpha of norm n is evaluable in Otilde(c_0 P^+ Omega(n))."
        responsibility: runtime
      - claim: "G(h, gamma) = sqrt(h)/(1 + h gamma) and G_max = 1/(2 sqrt gamma)."
        responsibility: correctness
      - claim: "Sub-orbits do not reduce the canonicalisation cost below h applications."
        responsibility: strictness
      - claim: "T1 gives Omega(n) at least log N/(h log B), hence the break-even c_step log B >= c_0 B log N."
        responsibility: size
      - claim: "The unit slice reproduces KN-TECH-018 and EV-ENDO-10109d."
        responsibility: baseline
      - claim: "gamma is measured end-to-end at matched seeds, not as an isolated map timing."
        responsibility: interface
      - claim: "The supersingular control shows gamma_min dropping."
        responsibility: strictness
      - claim: "No claim about faster evaluations or non-orbit mechanisms."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        M1 -- gamma_min, the measured end-to-end application cost of the
        cheapest applicable non-unit endomorphism, in charged
        group-addition units, per curve and per bit size
      direction: higher
      minimum_effect: >-
        Predicted gamma_min at least 1.0 at every declared bit size, i.e. at
        least four times the 1/4 break-even. A measured gamma_min below 0.25 on
        any curve is READING 2 and escalates immediately to independent
        validation.
    - metric: >-
        M2 -- gamma_aut, the same quantity for the F_p-rational automorphism at
        j = 0 and j = 1728
      direction: lower
      minimum_effect: >-
        Predicted in [0.03, 0.20], giving G(6, gamma_aut) in [1.35, 1.72] and
        G(4, .) in [1.28, 1.60]. Must be consistent with EV-ENDO-10109d's
        ratio-to-ceiling means 1.0043 and 1.0442 within sd 0.11. A gamma_aut
        that cannot reproduce them voids the ceiling formula.
    - metric: >-
        M3 -- planted-dial tracking: measured net gain versus the predicted
        1/(2 sqrt gamma) over gamma in {0.05, 0.10, 0.20, 0.50, 1.00}
      direction: different
      minimum_effect: >-
        Agreement within 15 percent at every dial setting, with the gamma = 1.00
        setting showing a net LOSS. Failure means the ceiling formula is the
        wrong model and only the empirical dial curve survives as the
        deliverable.
    - metric: >-
        M4 -- fraction of alpha with N(alpha) <= X whose ideal factors entirely
        into SPLIT primes of norm at most B, at B in {10^2, 10^3, 10^4}, over
        the census curves
      direction: different
      minimum_effect: >-
        Predicted to match the Dickman-de Bruijn rho(u) prediction with the
        genus-theory one-half correction, within the binomial error of the
        sample. A fraction indistinguishable from ZERO means the corrected cost
        model is VACUOUS - the smooth branch is never available - which would
        make 6b63a4's C1 correct as written and is a clean, reportable outcome
        that strengthens the existing closure rather than this record.
    - metric: >-
        M5 -- the threshold N_0 solving c_step log B = c_0 B log N at the
        measured constants and B = 2
      direction: different
      minimum_effect: >-
        Predicted below 2^16, i.e. below every declared census bit size. An
        N_0 above 2^36 means the non-unit branch is NOT closed inside the RQ's
        declared range and the census must test it directly.
    - metric: >-
        M6 -- Kolmogorov-Smirnov distance between the empirical CDF of
        log P^+(N(alpha))/log X at a 256-bit discriminant and the
        Dickman-corrected prediction, 10^5 samples
      direction: different
      minimum_effect: >-
        Predicted below the 95th percentile of the KS null at that sample size.
        A larger distance falsifies H1 at cryptographic scale, which is
        reportable in its own right and would bound the corrected cost model's
        applicability.

  minimal_test:
    design: >-
      STAGE A (zero compute, hours): the derivations (A)-(C), the sub-orbit
      argument, and the unit-slice reproduction check. Settles the ceiling
      formula and is reviewable with no runs.
      STAGE B (minutes to hours, THE CHEAPEST VALID DISCRIMINATOR): the
      microbenchmark of STAGE 1 at 16 and 20 bits plus POSITIVE CONTROL A (the
      unit case against EV-ENDO-10109d) and POSITIVE CONTROL B (the planted
      dial at five settings, 200 replicates each). ONE MICROBENCHMARK AND ONE
      DIAL DECIDE THE WHOLE LANE, because the lane's ceiling is a function of a
      single measured ratio. Estimated wall clock: under one hour at 16-20
      bits; memory megabytes.
      STAGE C (low compute): the smoothness census of STAGE 2 at 16, 20, 24 and
      28 bits, X declared, factoring trivial at these sizes. Hours; memory
      megabytes.
      STAGE D (low-medium compute, THE SCALE RUNG): STAGE 3's norm-form
      sampling at one declared 256-bit discriminant, 10^5 samples, trial
      division to 10^6 then ECM to 10^{12}. This is the only rung with
      nontrivial cost and it needs NO curve, NO point counting and NO isogeny;
      estimated single-digit CPU-hours, memory megabytes. If STAGE B's dial
      fails, STOP and report the empirical curve instead of the formula.
    controls:
      - unit-case positive control against EV-ENDO-10109d's measured means (blocking)
      - planted-gamma dial at five settings with a known predicted gain (blocking)
      - gamma equal to 1.00 negative control showing a net loss (blocking)
      - inert-factor alpha, corrected model must NOT be applied (blocking)
      - random-integer smoothness null at matched size (blocking)
      - end-to-end matched-seed measurement of gamma, never an isolated map timing (blocking)
      - supersingular nearby-object control showing gamma_min dropping
      - frozen cost-model hash asserted identical across all stages
      - matched charged rho and BSGS rows (KN-TECH-006, KN-TECH-031)
      - KN-TECH-034 screens on every curve
    required_metrics:
      - c_step, c_aut, c_velu(ell) in raw field operations with CIs
      - gamma_aut and gamma_min per curve per bit size with bootstrap CIs
      - measured net gain versus predicted 1/(2 sqrt gamma) per dial setting
      - per alpha - N(alpha), P^+, Omega, split-fraction, h, modelled gamma, modelled G
      - smooth-fraction per B per bit size against the Dickman-corrected prediction
      - the 256-bit norm-form empirical CDF, KS statistic, and the smoothest sample versus its predicted rate
      - N_0 at the measured constants, with CI
      - pass or fail of every blocking control; wall clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. Any curve shows a non-unit endomorphism with measured gamma < 0.25.
      READING 2; a live cell exists, the closure is refuted, and the finding
      goes to independent validation and red-team review before any use.
    - >-
      F2. The planted dial does not track 1/(2 sqrt gamma) within 15 percent.
      The ceiling formula is the wrong model; only the empirical dial curve
      survives and every closed-form number is withdrawn.
    - >-
      F3. The unit-case control cannot reproduce EV-ENDO-10109d's measured
      ratio-to-ceiling means. The instrument contradicts a replicated internal
      measurement; halt and reconcile before reporting anything.
    - >-
      F4. The smooth-split fraction is indistinguishable from zero at every B.
      The correction is vacuous, IDEA-20260901-6b63a4's C1 stands as written,
      and this record's contribution reduces to a negative note - which is
      stated in advance so the dependency is honest.
    - >-
      F5. N_0 measured above 2^36. The non-unit branch is not closed inside the
      RQ's declared bit range and the census must test it directly rather than
      inherit the closure.
    - >-
      F6. The supersingular control shows the same gamma_min as the ordinary
      case. The method proves too much and its closure is void.
    - >-
      F7. All controls pass and gamma_min is at least 1.0 at every bit size.
      The endomorphism-orbit lane is CLOSED with a mechanism, a measured
      obstruction and forward guidance, at the section-4 standard.

  confounders:
    - >-
      MEASURING THE MAP INSTEAD OF THE WALK. An isolated timing of alpha omits
      the orbit comparison, the re-canonicalisation and the fruitless-cycle
      handling that KN-TECH-018 names for negation walks. gamma must be a
      difference of end-to-end charged walk costs at matched seeds, divided by
      h. This is the single most likely way to manufacture a false READING 2.
    - >-
      COST-MODEL DRIFT between the microbenchmark and the walk. The frozen hash
      check is blocking; a change in what is charged is indistinguishable from
      a change in gamma.
    - >-
      KERNEL-FINDING COST IS NOT IN THE MODEL. The corrected bound counts Velu
      evaluations and not the eigenvalue or modular-polynomial work needed to
      identify each kernel. That omission makes the model favour the lane, so a
      closure under it is conservative - but a READING 2 under it would be
      OPTIMISTIC and must be re-measured with kernel cost charged before any
      escalation. Stated in advance.
    - >-
      SMOOTHNESS AT TOY SCALE IS NOT SMOOTHNESS AT SCALE. At 16-28 bits almost
      every N(alpha) is smooth by any reasonable B; the smooth-fraction column
      is only informative at the 256-bit rung, and the toy columns are reported
      as instrument checks, not as evidence for H1.
    - >-
      h IS NOT A FREE PARAMETER. Every quotation of G_max = 1/(2 sqrt gamma)
      must be accompanied by the actual h available, since the optimum
      h = 1/gamma is generally not attainable; the record reports G(h_actual,
      gamma) alongside the ceiling.
    - >-
      READING A CLOSURE AS A THEOREM ABOUT THE PROBLEM. It closes orbit
      quotients built from endomorphisms under a measured cost model. It says
      nothing about other uses of End(E), and IDEA-20260901-863e36's arithmetic
      selectors remain outside it.

  interpretation_limits:
    - >-
      "claim_tier: toy for every measured number (16-28 bits) except the
      256-bit norm-form heuristic validation, which is a HEURISTIC-VALIDATION
      artifact per docs/target-result-profile.md Part D and carries its
      sampling method and transfer assumptions. The derivations (B) and (C) are
      size-independent algebra and are labelled derivation, never proved."
    - >-
      Scoped to orbit-canonicalisation rho variants built from F_p-rational
      endomorphisms of ordinary prime-order curves. Isogeny transport, index
      calculus and non-morphism selectors are outside it.
    - >-
      The corrected cost is a LOWER bound and the ceiling therefore an UPPER
      bound on the lane. A faster evaluation of endomorphisms would raise the
      ceiling, and the record names that as its own method ceiling rather than
      excluding it.
    - >-
      No exponent moves in any outcome. The best case is a constant factor and
      the record refuses to be quoted otherwise.
    - >-
      Per KN-OPEN-001 no prime-field advantage over sqrt(p) is known and per
      KN-OPEN-019 there is no ECDLP object enumeration; closing one lane closes
      neither question.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NORM-FORM SMOOTHNESS. Let O be an imaginary quadratic order of
        discriminant Delta and Q its principal norm form. For alpha drawn
        uniformly from the set of alpha in O with N(alpha) <= X, the integer
        N(alpha) behaves, with respect to B-smoothness, like a uniformly random
        integer of size X conditioned on the genus-theory local conditions of Q
        - namely that every rational prime inert in O divides N(alpha) to an
        even power and every split prime is unconstrained. Formally,
        Pr[N(alpha) is B-smooth and all its prime factors split]
            = (1/2 + o(1))^{Omega} * u^{-u(1+o(1))},  u = log X / log B,
        uniformly for (log X)^{eps} < u < (log X)^{1-eps}.
      rigorous_support: >-
        Pairs (i) the rigorous structural fact from genus theory that the norm
        form of O represents exactly the integers whose factorisation satisfies
        the stated local splitting conditions, together with the rigorous
        lattice-point count for the number of alpha with N(alpha) <= X, namely
        2*pi*X/sqrt(|Delta|) + O(sqrt(X/|Delta|)) (Gauss circle problem for a
        positive definite binary form), with (ii) the classical distribution
        theorem it imitates, Canfield-Erdos-Pomerance / Dickman-de Bruijn,
        Psi(X, B) = X * u^{-u(1+o(1))} uniformly in the stated u-range. The
        heuristic step is only that the VALUES of this particular quadratic
        form imitate random integers of their size for smoothness once the
        local conditions are imposed - exactly the shape of the exemplar's
        Heuristic 1 (a rigorous size or structure bound composed with a
        classical distribution theorem), and exactly the step that can fail.
      validation_plan: >-
        SAMPLING METHOD AND THE SHORTCUT THAT REACHES SCALE. No curve is
        needed: fix Delta = t^2 - 4p for one declared 256-bit prime p and one
        declared admissible trace t, and sample 10^5 pairs (x, y) uniformly in
        the ellipse Q(x, y) <= X with X declared. The norm form is the sampling
        oracle here in exactly the role the Deuring correspondence plays in the
        exemplar's section 4.2 - it lets the heuristic be tested at
        cryptographic parameters without constructing any object of that size.
        Repeat at a 384-bit discriminant with 10^4 samples.
        SCALE AND SAMPLE SIZES. 16, 20, 24, 28 bits: exhaustive over the ball
        (thousands to millions of alpha), factorisation by trial division.
        256 bits: 10^5 samples, B-smoothness by trial division to 10^6 then ECM
        to 10^{12}, P^+ recorded exactly where fully resolved and as a lower
        bound otherwise, with the resolved fraction reported.
        COMPARISON DISTRIBUTION. Empirical CDF of log P^+(N(alpha)) / log X
        against the Dickman-de Bruijn rho(u) prediction with the genus-theory
        one-half split correction applied per prime factor; Kolmogorov-Smirnov
        per (Delta, X) cell.
        TAIL CONSISTENCY CHECKS. The smoothest sample of the 10^5 at 256 bits
        against its predicted rate rho(u) - the exemplar's own tail check - and
        the largest P^+ against the predicted maximum of 10^5 draws.
        NEGATIVE CONTROL. The same statistics on 10^5 uniformly random integers
        of the same size (NULL-1); the elliptic values must deviate ONLY by the
        predicted genus-theory factor.
        SAMPLED PARAMETERS RECORDED. p, t, Delta, X, B, sample counts, RNG
        seeds, the ECM parameters and the resolved fraction, harness commit.
        TRANSFER ASSUMPTION, STATED. The heuristic is validated at the sampled
        (Delta, X) only. Nothing transfers to other discriminants, and the
        toy-scale columns are instrument checks rather than evidence for H1,
        because at 16-28 bits almost every N(alpha) is smooth for any
        reasonable B.
    - id: H2
      statement: >-
        COST ADDITIVITY OF COMPOSITION. For alpha with a split B-smooth ideal
        factorisation, the measured end-to-end charged cost of evaluating alpha
        on a point equals the sum over the Omega(N(alpha)) steps of the
        measured c_velu(ell_i), up to a multiplicative factor in [0.8, 1.5],
        uniformly over the tested curves and paths.
      rigorous_support: >-
        The rigorous ingredient is that the composition of isogenies is a
        composition of maps, so the evaluation cost is the sum of the step costs
        plus bookkeeping - there is no asymptotic content, only the claim that
        bookkeeping does not dominate. The classical statement imitated is the
        standard smooth-isogeny evaluation accounting of isogeny cryptography.
        The heuristic step is that per-step overhead (curve-parameter updates,
        coordinate normalisation) stays a bounded fraction.
      validation_plan: >-
        SAMPLE: 200 declared paths per bit size with Omega between 1 and 12 and
        ell in {2,3,5,7,11,13}, each evaluated end to end on 50 points.
        COMPARISON: measured total against the sum of independently measured
        per-step c_velu(ell), reported as a ratio with bootstrap CI; the
        one-step increment control of `object_first_candidate` is the
        Omega = 1 slice and is blocking. TAIL CHECK: the longest path's ratio
        against the shortest's; a ratio growing with Omega means bookkeeping
        dominates and the corrected cost model must be restated with that term.
        SAMPLED PARAMETERS RECORDED: path lists, ell multisets, point counts,
        cost-model hash. TRANSFER: none beyond the tested Omega range, and the
        256-bit rung uses H2 only to convert a measured smoothness profile into
        a modelled cost, never into a measured one - stated so the two are not
        confused.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED, and the record's content is why no orbit-quotient variant
      can change it. The quantitative claim is a CONSTANT-FACTOR CEILING:
      G_max = 1/(2*sqrt(gamma_min)), attained only at h = 1/gamma_min, which
      for non-unit endomorphisms is below 1 for every group order above a
      measured N_0. Per the search heuristics this is explicitly a low-ambition
      building block offered as a closure, not as an advance.
    memory_exponent: >-
      O(1) for rho, unchanged. The orbit canonicalisation stores h points
      transiently; the smoothness census stores O(X/sqrt|Delta|) rows at toy
      scale and O(10^5) rows at the 256-bit rung. No attack memory is claimed.
    best_known: >-
      Parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-006);
      automorphism-discounted rho, factor at most sqrt(6) and measured as
      attained (KN-TECH-018, EV-ENDO-10109d); BSGS at 2*sqrt(n) time, sqrt(n)
      memory, n^{2/3+o(1)} full cost (KN-TECH-031); generic lower bound
      Omega(sqrt p) (KN-TECH-005). For the closure itself the incumbent is
      IDEA-20260901-6b63a4's C1.
    hidden_overhead: >-
      Disclosed in both directions. FAVOURING THE LANE: the corrected cost
      omits kernel-finding, modular-polynomial and path-storage costs, so
      gamma is understated and the ceiling overstated - a READING 2 under this
      model must be re-measured with those charged before escalation.
      FAVOURING THE CLOSURE: Velu may not be optimal, and a faster evaluation
      would lower gamma; the record names that as its method ceiling.
      The o(1) in the Otilde hides the per-step bookkeeping that H2 measures.
    tradeoff_note: >-
      No time-memory tradeoff is introduced; the quotient walk stays at the
      O(1)-memory corner of the van Oorschot-Wiener surface exactly where
      KN-TECH-018 places it, so the ceiling is a pure constant on that corner
      and does not interact with the S*T^2 = Omega~(n) preprocessing frontier
      of KN-TECH-005. Canonicalisation is embarrassingly parallel over (curve,
      seed) and does not change the parallel speedup.

  dominated_by: >-
    AS AN ATTACK: none is proposed; every Pareto row checked individually.
    TIME - parallel rho at 0.886*sqrt(N) (KN-TECH-006) dominates.
    MEMORY - rho at O(1) dominates; nothing here stores.
    DATA/QUERIES - none consumed.
    CM-SPECIFIC - automorphism-discounted rho (KN-TECH-018) dominates and is
    shown here to be the ONLY live member of its own family; it is the
    incumbent, not a competitor.
    MEMORY-RICH - BSGS (KN-TECH-031), untouched and gaining nothing from
    quotients by that record's own statement.
    SPECIAL-FAMILY - anomalous transfer (KN-TECH-033) and MOV (KN-TECH-032)
    dominate on their families, excluded from primary cells by the RQ.
    LOWER BOUND - KN-TECH-005's Omega(sqrt p) is untouched.
    All rows checked; none beaten.
    AS A CLOSURE: dominated by IDEA-20260901-6b63a4 on the norm-order theorem
    itself, which this record uses and does not reprove; this record dominates
    it on the COST half of its C1, which it shows to be false as stated for
    smooth alpha and then re-derives correctly. Externally, the standard
    smooth-isogeny evaluation accounting dominates the cost fact and no
    priority is claimed for it; novelty_status is unverified because no
    external search for the ceiling formula was made.

  sota_delta: >-
    ECDLP time exponent delta 0; memory exponent delta 0; data/query delta 0;
    security bits reduced 0; constant-factor delta 0 (the live ceiling remains
    KN-TECH-018's sqrt(|Aut|)). NON-ZERO DELTAS, QUANTIFIED.
    (i) COST MODEL: the evaluation cost of a census-relevant endomorphism goes
    from Omega(n) to Otilde(c_0 * P^+ * Omega(n)). For n = N^{1/2} at
    N = 2^256 with B = 2^10 that is 2^128 versus roughly 13 * 2^10 ~ 2^{13.7}
    charged operations - a correction of about 114 bits in the quantity an
    existing closure rests on.
    (ii) CLOSURE STRENGTH: the lane is re-closed under the corrected model with
    an explicit inequality c_step*log B >= c_0*B*log N and a measured threshold
    N_0, replacing a closure that would have been void had the correction gone
    the other way. Under docs/inventor-protocol.md section 4 this converts a
    verdict into a measurement.
    (iii) DECISION TARGET: reduces the entire endomorphism-orbit lane to one
    microbenchmark, gamma_min, obtainable in under an hour at 16-20 bits, with
    a closed-form ceiling 1/(2*sqrt(gamma_min)) - cheaper and sharper than
    running the lane's pre-registered eight-pair design, whose power
    IDEA-20260829-172151 computes at about 0.032 at the pre-registered effect.
    (iv) HEURISTIC EVIDENCE: supplies this RQ's first heuristic-validation
    artifact at cryptographic parameters (256- and 384-bit discriminants),
    reached by a sampling shortcut that needs no curve.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the ceiling formula G_max = 1/(2*sqrt(gamma)) tracks the planted
    dial within 15 percent. 0.9 that gamma_min is at least 1.0 on every tested
    non-unit endomorphism (so 0.1 on the escalation branch). 0.6 that the
    smooth-split fraction at the 256-bit rung is materially non-zero, i.e. that
    the correction is not vacuous - and F4 is written so that a vacuous
    correction is still a clean reportable outcome. Most likely honest
    headline: "the endomorphism-orbit lane is closed by a measured cost
    inequality gamma_min far above 1/4, under the most favourable evaluation
    model available, with the automorphism case identified as the unique
    exception and the reason named."

