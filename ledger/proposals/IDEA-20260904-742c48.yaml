idea:
  id: IDEA-20260904-742c48
  id_allocation_provenance: >-
    Token minted by the coordinator with
    `python3 tools/allocate_id.py --next idea --date 20260904` and confirmed
    free with `--check` (0 occurrences across 11563 identifier-bearing paths),
    relayed to this session 2026-09-04. Not derived by scanning state.
  question_id: RQ-ECDLP-165d4b
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-165d4b has no bound GOAL record visible to this session. Left null
    deliberately, not omitted.
  added: '2026-09-04'
  title: >-
    THE ENDOMORPHISM-ORBIT LANE IS CLOSED BY A COST INEQUALITY, NOT BY A NORM
    BOUND, AND THE PROGRAM'S CURRENT CLOSURE USES THE WRONG COST MODEL: an
    endomorphism of degree n is evaluated in Otilde(P^+(n) * Omega(n)) field
    operations when its ideal factors into split primes, NOT in Omega(n), so
    the correct ceiling of every orbit-quotient rho variant is
    G_max = 1/(2*sqrt(gamma_min)) with gamma_min the MEASURED cost of the
    cheapest applicable non-unit endomorphism in group-addition units --
    derive the corrected break-even c_step*log B >= c_0*B*log N, measure
    gamma_min in minutes, and validate the smoothness heuristic the corrected
    model needs at 256-bit discriminants by sampling the norm form directly
  class: mechanism

  claim: >-
    (A) THE COST CLAIM BEING CORRECTED. IDEA-20260901-6b63a4 proves the
    norm-order tradeoff T1 - for alpha in End(E) of norm n >= 2 acting on the
    prime-order subgroup G as a scalar of multiplicative order h,
    n^h >= (sqrt N - 1)^2 - and converts it into the closure C1 by the step
    "evaluating an endomorphism of degree n as a rational map costs Omega(n)
    field operations". THAT STEP IS FALSE FOR SMOOTH alpha. If the ideal
    (alpha) factors in O as a product of prime ideals of norm at most B lying
    over split rational primes, then alpha is the composition of Omega(n)
    Velu isogenies of degree at most B, each returning to a curve of the same
    class, and evaluating alpha on a point costs
        C(alpha) = Otilde( c_0 * B * Omega(n) ) = Otilde( c_0 * B * log n / log B )
    field operations, which for B = polylog(n) is EXPONENTIALLY smaller than n.
    The corrected model is strictly more favourable to the lane the closure
    closes, so re-deriving the closure under it makes the closure STRONGER, not
    weaker. That is why this record is worth running: a closure that survives
    its own best-case cost model is a closure; one that rests on an overstated
    cost is a fatigue report in the sense of docs/inventor-protocol.md section 4.

    (B) THE CORRECTED CEILING, IN CLOSED FORM, ZERO COMPUTE. Let a rho variant
    canonicalise walk states over the orbit of the cyclic group generated by
    lambda_alpha, of order h. The search space shrinks by h, so the expected
    step count shrinks by sqrt(h); the per-step cost rises by the cost of
    computing the orbit, which is h applications of alpha. Writing
    gamma = C(alpha)/c_step for the cost of ONE application in units of one
    charged group addition,
        G(h, gamma) = sqrt(h) / (1 + h*gamma),
        dG/dh = 0 at h = 1/gamma,   G_max = 1 / (2*sqrt(gamma)).
    THEREFORE THE ENTIRE ORBIT LANE IS LIVE IF AND ONLY IF gamma < 1/4: a
    non-trivial map must be applicable in less than a quarter of a group
    addition. This single inequality is the lane's ceiling, it holds for every
    curve, every endomorphism and every h, and gamma is a microbenchmark.
    CONSISTENCY WITH THE KNOWN CASE, WHICH IS THE BASELINE EMBEDDING: for a
    UNIT alpha the map is (x, y) -> (zeta x, y), one field multiplication,
    gamma ~ 0.1 against a charged group addition of order ten multiplications;
    h = 6 is below the optimum 1/gamma = 10, and
    G(6, 0.1) = sqrt(6)/1.6 = 1.53 -- live, and consistent with KN-TECH-018's
    sqrt(|Aut|) and with EV-ENDO-10109d's measured attainment of the ceiling.

    (C) THE CLOSURE, RE-DERIVED UNDER THE CORRECTED MODEL. Compose (B) with
    T1. A non-unit alpha with orbit order h has n >= N^{1/h}, hence
    Omega(n) >= log N / (h log B), hence
        gamma >= c_0 * B * log N / (c_step * h * log B).
    At the optimum h = 1/gamma this gives the necessary condition
        c_step * log B  >=  c_0 * B * log N.
    The left side grows like log B, the right side like B: the inequality is
    tightest at B = 2 and fails for every larger B. With c_0 the field
    operations per unit of isogeny degree (order 1) and c_step the field
    operations per charged group addition (order 10), the condition at B = 2
    reads 10 * log 2 >= 2 * log N, i.e. N <= e^{3.47} ~ 32.
    SO, UNDER THE MOST FAVOURABLE COST MODEL AVAILABLE, NO NON-UNIT
    ENDOMORPHISM CAN PRODUCE AN ORBIT DISCOUNT ON ANY GROUP OF ORDER ABOVE A
    SMALL CONSTANT -- and the constant is a function of two MEASURABLE ratios,
    c_0 and c_step, which this record measures instead of assuming. That is a
    named obstruction, an argument, and a number, which is the closure standard
    of docs/inventor-protocol.md section 4.

    (D) THE DISCRIMINATION. Two mutually exclusive readings, decided by one
    microbenchmark plus one smoothness census.
      READING 1 -- CLOSURE CONFIRMED AND STRENGTHENED. The measured gamma_min
      over every applicable non-unit endomorphism on the census's own curves
      exceeds 1/4 at every declared bit size, the measured (c_0, c_step) make
      the break-even threshold of (C) fall below 2^16, and the smoothness
      census shows that the smooth branch is available for a measurable
      fraction of alpha (so the correction is real, not vacuous). Then the
      endomorphism-orbit lane is closed with a mechanism that survives the best
      cost model, the RQ's decision target loses one of its two candidates on
      an argument rather than on a null, and the surviving statement is
      "the lane is exactly the automorphism case, for the exact reason that
      units are the only maps applicable below a quarter of a group addition".
      READING 2 -- A LIVE CELL. Some (curve, alpha) with alpha a non-unit has
      measured gamma < 1/4, or the measured (c_0, c_step) satisfy
      c_step log B >= c_0 B log N at a declared bit size. Then a genuine
      constant-factor non-generic discount beyond sqrt(|Aut|) exists on a named
      cell, the RQ's decision target resolves toward the orbit lane, and the
      result requires independent validation and red-team review before any use.

    (E) WHAT IS NOT CLAIMED. No exponent moves in either reading; the best
    outcome is a constant factor G_max. No claim is made that Velu is the
    optimal evaluation strategy - the corrected model is a LOWER bound on cost
    and an UPPER bound on the lane, and a better evaluation would move the
    threshold, which is stated as the record's own ceiling.

  mechanism: >-
    THE TRACKED OBJECT is the SMOOTHNESS PROFILE OF THE ENDOMORPHISM NORM:
    the pair (P^+(N(alpha)), Omega(N(alpha))) restricted to alpha whose ideal
    factors into split primes, together with its induced cost gamma. Its
    lossy-projection test is in `object_first_candidate`.

    STAGE 0 (zero compute, HARD GATE). Write (A), (B) and (C) with the
    optimisation done by hand; state the necessary condition
    c_step log B >= c_0 B log N; verify the unit case reproduces
    G(6, 0.1) = 1.53 and G(2, 0.1) = 1.29, i.e. the sqrt(|Aut|) family of
    KN-TECH-018 net of canonicalisation. Reviewable before any run.

    STAGE 1 (minutes, THE MICROBENCHMARK, and it is the decisive measurement).
    On declared census curves at 16, 20, 24 and 28 bits, measure in the frozen
    cost model: (i) c_step, the charged cost of one r-adding walk step in field
    operations; (ii) c_aut, the cost of applying an F_p-rational automorphism
    at j = 0 and j = 1728; (iii) c_velu(ell), the cost of evaluating one Velu
    isogeny of degree ell for ell in {2,3,5,7,11,13}; (iv) for each curve, the
    cheapest applicable non-unit endomorphism found by the norm-form search of
    STAGE 2 and its measured application cost. Emit gamma_aut and gamma_min
    with CIs. THE LANE'S ENTIRE CEILING IS 1/(2 sqrt(gamma_min)) AND THIS STAGE
    PRODUCES IT.

    STAGE 2 (low compute, THE SMOOTHNESS CENSUS). For each census curve,
    compute Delta_O and enumerate alpha = x + y*omega with N(alpha) <= X for a
    declared X; for each, factor N(alpha) (trivial at toy scale), record
    P^+(N(alpha)) and Omega(N(alpha)), check the split condition at every prime
    factor (Kronecker symbol (Delta_O / ell) = +1, which is what makes the
    factor an F_p-rational isogeny step), and record the multiplicative order
    h = ord_N(lambda_alpha) with lambda_alpha = the image of alpha under the
    ring map O -> Z/N sending pi to 1. Emit the empirical joint distribution of
    (N(alpha), P^+, Omega, split-fraction, h) and, for each alpha, the modelled
    gamma and the resulting G(h, gamma).

    STAGE 3 (low compute, THE CRYPTOGRAPHIC-SCALE HEURISTIC VALIDATION). The
    smoothness heuristic that makes the corrected cost model non-vacuous can be
    validated at cryptographic size WITHOUT any curve, because the norm form is
    all that is needed. Fix Delta_O = t^2 - 4p for p a declared 256-bit prime
    and a declared trace; sample 10^5 pairs (x, y) uniformly in the norm ball
    N(alpha) <= X; test B-smoothness of N(alpha) by trial division to 10^6
    followed by ECM for factors up to 10^{12} and a primality test on the
    cofactor, recording P^+ where fully resolved and a lower bound otherwise;
    compare the empirical CDF of log P^+ / log X against the Dickman-de Bruijn
    rho(u) prediction with u = log X / log B, corrected for the genus-theory
    local conditions (a prime inert in O divides N(alpha) only to even powers,
    so the effective density of usable primes is one half). THIS IS THE
    EXEMPLAR'S SECTION 4.2 MOVE TRANSPLANTED: the norm form plays the role the
    Deuring correspondence plays there, letting the heuristic be tested at
    SQIsign-sized parameters without any object of that size being constructed.

    STAGE 4 (zero compute, THE VERDICT AND THE OBSTRUCTION RECORD). Report
    gamma_min, the threshold N_0 solving c_step log B = c_0 B log N at the
    measured constants, and G_max. Emit gamma_min as an obstruction record with
    units, error bars, the runs it is read from and the scope, so that the
    quantity is available to every other goal - and take the section-4 second
    reading explicitly: gamma_min is the hypothesis of the statement "only
    units are free", and any future mechanism that needs a cheap non-scalar map
    is bounded by it.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval NOT called. Direct reading 2026-09-04 of all seven
      prior RQ-ECDLP-165d4b proposals in full, IDEA-20260901-6b63a4 lines
      1-120 plus targeted greps of its remainder for 'smooth', KN-TECH-018,
      KN-TECH-005, KN-TECH-031, KN-OPEN-001. Greps over knowledge/ and ledger/
      for 'smooth endomorphism', 'smallest non-scalar', 'cheapest
      endomorphism', 'Dickman', 'multiplicative order', 'roots of unity'.
      External: one WebSearch on endomorphism evaluation cost versus Pollard
      rho equivalence classes, which returned only the standard statement that
      equivalence-class approaches are "in general less effective than the
      standard Pollard-rho method due to complexity of calculation of an
      endomorphism" and that the GLS endomorphism "usually involves one
      multiplication by a fixed constant". No paper was opened.
    results: >-
      IDEA-20260901-6b63a4's only uses of the word "smooth" are (i) a control
      note that a quantity decaying smoothly with n measures evaluation cost
      rather than degree and (ii) a confound note on the divisor structure of
      N - 1. IT DOES NOT USE SMOOTHNESS OF N(alpha) TO EVALUATE alpha, and its
      C1 states the Omega(n) evaluation cost as a flat assertion. No record in
      this corpus states the corrected cost Otilde(P^+ * Omega), the ceiling
      G_max = 1/(2 sqrt gamma), or the break-even c_step log B >= c_0 B log N.
      Externally the composition of small-degree isogenies to evaluate a smooth
      one is standard practice in isogeny cryptography and this record claims no
      novelty for it; the claim is its use to CORRECT AND STRENGTHEN an existing
      closure and the resulting closed-form ceiling.
    verdict: >-
      UNVERIFIED. The cost fact is standard (adaptation); the ceiling formula
      and the break-even inequality have no located precedent in this corpus and
      no external search was made for them.

  citations:
    - ref: IDEA-20260901-6b63a4
      provenance: internal
      claim: >-
        T1 (norm-order tradeoff): for alpha in End(E) with norm n >= 2 acting on
        the prime-order subgroup as lambda of order h, n^h >= (sqrt N - 1)^2,
        equivalently n >= N^{1/h}(1 - o(1)); proof by G contained in
        ker(alpha^h - 1) and the fact that the kernel size is at most the
        degree. C1: "evaluating an endomorphism of degree n as a rational map
        costs Omega(n) field operations, so the per-step canonicalisation cost
        is Omega(h N^{1/h})", hence the cheap-and-short configuration exists
        only at n = 1. Also its multi-generator extension: if H is generated by
        lambda_1 ... lambda_r and has order h then every ord(lambda_i) divides
        h and T1 applies to each generator.
      verified_by: >-
        this session, 2026-09-04, lines 1-120 read in full (object,
