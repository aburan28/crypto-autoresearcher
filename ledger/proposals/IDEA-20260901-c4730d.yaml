  id: IDEA-20260901-c4730d
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  class: measurement

  title: >-
    THE GROUP ORDER OF EVERY ORDINARY CURVE IS A VALUE OF ITS OWN CM FORM -
    4 #E = (t-2)^2 + |D_0| f^2 - so every prime divisor of #E splits in Q(sqrt(D_0)) on
    EVERY curve, and the allowed prime set has density exactly 1/2 whatever |D_0| is.
    Special j is therefore not distinguished by HAVING a constraint but by WHICH half it
    excludes, and the one exclusion with real arithmetic weight is small - a j = 0 curve
    with conductor 1 has ODD order because 2 is inert in Q(sqrt(-3)), and a j = 1728 curve
    with conductor 1 has #E = m^2 + 1 with every odd divisor congruent to 1 mod 4.
    Measure whether that shifts the B-smooth part of #E against a matched random curve,
    and whether it survives a matched-|Aut| control at D_0 in {-7, -8, -11}.

  object: >-
    TRACKED OBJECT - THE SPLITTING-AND-VALUATION PROFILE of the group order,
    Pi_B(E) = ( ( (D_0 / q), v_q(#E) ) : q prime, q <= B ),
    a vector of about pi(B) pairs, each pair being a Kronecker symbol in {-1, 0, +1} and a
    small non-negative valuation. The curve equation, the j-invariant, the points, the
    endomorphism ring as a ring, the isogeny class structure and every coordinate are
    discarded; a short integer vector is retained.
    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS, per
    docs/inventor-protocol.md section 1, for a target the corpus reports as heavily mined:
    the automorphism-order function and the sqrt(|Aut|) discount (KN-TECH-018,
    H-JINV-db2776); Semaev support and degeneration screens (H-JINV-0e8819 and the
    2026-08-11 batch); the relation-collection density battery (H-JINV-5a0b9e); the
    Cl(O)-orbit crater cardinality (IDEA-20260826-d61c49); genus-theoretic ambiguous
    classes (IDEA-20260828-f3c50e); the incidence-deviation statistic
    (IDEA-20260826-4bc5d2); the orbit-label morphism (IDEA-20260811-332ce9); and volcano
    DEPTH, which is RQ-VOLC-f6253b's and is worked concurrently.
    CANDIDATES ENUMERATED AND SCORED on (genuinely new here / one-step propagation
    definable and measurable / survival depth):
    (a) #E itself - not lossy in any useful sense relative to the question and already the
        campaign's universally reported covariate; a repackaging;
    (b) the fundamental discriminant D_0 alone - H-JINV-db2776's object, known, and it is
        the INPUT to this record rather than its object;
    (c) the class group Cl(D_0) or its 2-torsion - IDEA-20260826-d61c49's and
        IDEA-20260828-f3c50e's objects; already owned;
    (d) the SPLITTING-AND-VALUATION PROFILE Pi_B - new in this corpus as far as this
        session could check; its one-step propagation is exact and unusually strong, since
        t, D, D_0 and #E are all constant on an F_p-isogeny class, so Pi_B is an
        ISOGENY-CLASS INVARIANT and propagates through every horizontal and vertical step
        without change; it survives the whole isogeny class and dissolves only when p
        changes, which is the boundary the record states;
    (e) the full factorisation of #E - carries strictly more, is not computable at
        cryptographic scale without factoring, and its small-prime shadow is exactly (d).
    (d) is adopted. KN-OPEN-019 applies: this scoring is a sketch, not a taxonomy.

  lossy_projection_test: >-
    Pi_B discards the curve, the points, the ring and every prime above B, keeping a short
    vector of small integers. The fibres are enormous - every curve in an F_p-isogeny
    class has the SAME Pi_B, and so does every curve over every other p with the same
    D_0 and the same small-prime valuations - so nothing about the instance is
    recoverable. It is not a change of coordinates.
    COMPATIBILITY WITH THE OPERATIONS THE RECORD USES IT UNDER, WHICH IS THE PART THAT
    HAS TO BE CHECKED AND IS THE STRONGEST FEATURE OF THIS OBJECT. The operations are
    F_p-isogeny and quadratic twist. Under F_p-isogeny, Tate's theorem gives equal
    Frobenius characteristic polynomials, hence equal t, equal D, equal D_0 and equal #E,
    so Pi_B is EXACTLY INVARIANT and propagates deterministically - which is what makes it
    a property of the class rather than of a representative, and therefore a property no
    attacker action can change. Under quadratic twist, t maps to -t and #E maps to
    p + 1 + t, so Pi_B is NOT invariant, and the record never pools a class with its
    twist; the twist is used as a control instead.
    IT IS NOT COMPATIBLE with the group law - Pi_B says nothing about individual points -
    and it is never used under it.

  claim: >-
    Five statements. U is the universality identity, S1 and S2 are the two exact
    special-j consequences, M is the measurement, and X is the scope limit that keeps the
    record honest.

    (U) THE UNIVERSALITY IDENTITY. Let E/F_p be ordinary, p > 3, with trace t, Frobenius
    discriminant D = t^2 - 4p = D_0 f^2 < 0, and #E = p + 1 - t. Then
        4 #E = (t - 2)^2 - D = (t - 2)^2 + |D_0| f^2.
    Consequently, for every prime q dividing #E with q not dividing 2D,
        D is congruent to (t-2)^2 modulo q,
    so D is a quadratic residue mod q and (D_0 / q) = +1 - i.e. EVERY PRIME DIVISOR OF THE
    GROUP ORDER SPLITS IN Q(sqrt(D_0)), ON EVERY ORDINARY CURVE. The set of primes q with
    (D_0/q) = +1 has natural density exactly 1/2 for every non-square D_0, by Chebotarev
    or elementarily by quadratic reciprocity. THEREFORE THE EXISTENCE OF THE CONSTRAINT IS
    NOT A SPECIAL-j PHENOMENON AND ITS DENSITY IS |D_0|-INDEPENDENT. The lane's recurring
    intuition that "small discriminant makes the group order arithmetically special" is
    wrong in the form it is usually stated, and this is the record's first deliverable,
    obtained at zero compute. DISCLOSURE OF PRIOR OVERLAP - the identity itself is already
    committed to this program in rearranged form as D = (t - 2)^2 - 4N, where
    H-JINV-5a0b9e uses it as the DESIGN DEVICE that annihilates the #E confound in the
    matched-order family. This record claims no novelty for the identity; it claims the
    arithmetic consequence, which that record does not draw.

    (S1) THE j = 0 CONSEQUENCE, EXACT. For D_0 = -3 and conductor f = 1,
    4 #E = (t-2)^2 + 3. Reduction modulo 8 forces t - 2 odd, an odd square is 1 modulo 8,
    so (t-2)^2 + 3 is 4 modulo 8 and #E IS ODD. A conductor-1 j = 0 curve therefore has NO
    RATIONAL 2-TORSION and its cofactor is odd. Moreover 2 is inert in Q(sqrt(-3)) because
    -3 is 5 modulo 8, which is the structural statement behind the congruence computation,
    and more generally every prime q dividing #E with q not 3 satisfies q congruent to 1
    modulo 3.

    (S2) THE j = 1728 CONSEQUENCE, EXACT. For D_0 = -4 and f = 1, 4 #E = (t-2)^2 + 4, so
    t is even and, writing m = (t-2)/2,
        #E = m^2 + 1.
    Hence every ODD prime divisor of #E is congruent to 1 modulo 4, and the 2-adic
    valuation of #E is AT MOST 1, since m^2 + 1 is 1 or 2 modulo 4.

    (M) THE MEASUREMENT AND ITS TWO RIVAL EXPLANATIONS, AT MATCHED p. Define the B-smooth
    part Sm_B(E) = product over q <= B of q^{v_q(#E)}, and the small-factor count
    Om_B(E) = sum over q <= B of v_q(#E). Compare special-j curves against a MATCHED
    RANDOM NULL - curves drawn uniformly at the same p, with the same #E bit length -
    and against a MATCHED-|Aut| control at D_0 in {-7, -8, -11}, where |D_0| is small but
    |Aut| = 2.
      (H-null, UNIVERSALITY) log Sm_B and Om_B have the same distribution for special-j
      and matched-random curves at the same p, because both are constrained to a
      density-1/2 prime set and the doubled divisibility probability on the allowed half
      compensates the zeroed probability on the forbidden half. Under this reading the
      only difference is WHICH half, which is public in both cases since D_0 is computable
      from (p, t), so no attacker-usable information exists and the RQ's answer on this
      axis is exactly +0 beyond sqrt(|Aut|).
      (H-bias, EXCLUSION-DOMINATED) log Sm_B is systematically SMALLER for D_0 = -3
      because the exclusion of 2 - by far the largest single contributor to the smooth
      part of a random integer - is not compensated by the doubling on the allowed odd
      primes. Under this reading special-j curves are systematically ROUGHER, i.e. LESS
      likely to have a Pohlig-Hellman-exploitable order, so special j would be SAFER on
      this axis, not weaker. This is a directional claim that cannot trip
      GOAL-ENDO-001 pause condition P3 and that is the honest expectation.
      (H-weak, THE ONE THAT WOULD MATTER) log Sm_B is systematically LARGER for small
      |D_0| at matched p, so small-|D_0| curve generation produces weak orders at a higher
      rate. That is an advantage beyond sqrt(|Aut|) on the data axis and it would trigger
      P3 before any description.

    (X) WHAT IS NOT CLAIMED, STATED BEFORE THE MEASUREMENT. Nothing here is an ECDLP
    speedup on a fixed instance. In deployment #E is N times a tiny cofactor with N prime,
    and on a prime-order subgroup the entire content of Pi_B is the single statement
    (D_0/N) = +1, which is equivalent to the existence of the GLV eigenvalue and is
    therefore the sqrt(|Aut|) NULL restated - the record says so explicitly rather than
    letting it be discovered later. The axis this record can move is the DENSITY OF WEAK
    INSTANCES in curve generation, which is a data-axis statement about a population, not
    a time-axis statement about an instance. sota_delta on time and memory is zero.

  mechanism: >-
    Frobenius satisfies pi^2 - t pi + p = 0 and #E = deg(pi - 1) = N(pi - 1), so the group
    order is the value of the norm form of the CM order at the specific element pi - 1.
    That is why 4 #E = (t-2)^2 + |D| is an identity and not a coincidence, and it is why
    the arithmetic of #E is governed by the splitting behaviour of Q(sqrt(D_0)): an
    integer represented by a binary quadratic form of discriminant D can only have prime
    divisors at which D is a square. The mistake the lane is at risk of making - and the
    one this record removes - is inferring from "small |D_0| gives a strong constraint"
    that special j is arithmetically distinguished. Every ordinary curve carries the same
    strength of constraint, because the density of the split primes is 1/2 for every
    non-square discriminant. What small |D_0| changes is only that the excluded half is a
    SHORT, FIXED, SMALL-MODULUS congruence condition rather than an unstructured one, and
    the only place a fixed condition has arithmetic weight is at the very smallest primes,
    where individual primes carry non-negligible mass. Hence S1 and S2, which are exactly
    the statements at q = 2, and hence a measurement targeted at the small-prime end of
    the profile rather than at its density.

