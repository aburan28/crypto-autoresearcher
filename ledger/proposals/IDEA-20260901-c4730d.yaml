  proof_search_map:
    bottleneck: >-
      Not an algorithmic bottleneck but an inferential one. The lane repeatedly reasons
      from "small |D_0| constrains the arithmetic" to "special j is arithmetically
      distinguished", and no record has stated the constraint precisely enough to see that
      its strength is |D_0|-independent. The bottleneck removed is the missing precise
      statement, and removing it costs one identity.
    baseline_embedding:
      parameter_slice: >-
        |D_0| generic, of order 4p. There U says the constraint still holds and still has
        density 1/2, and the measured smooth-part distribution must reproduce the standard
        random-integer-in-the-Hasse-interval behaviour that the campaign already assumes.
        A record that found special behaviour in this slice would be measuring its own
        instrument.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, BLOCKING. Over all curves at three committed toy primes,
        the measured Pr[q divides #E] for q in {2, 3, 5, 7, 11} pooled over ALL curves must
        agree with the standard heuristic q/(q^2 - 1) to within the exact binomial
        interval. This checks the enumeration and the divisibility accounting before any
        special-j cell is compared, and it is a quantity no arm of this record disputes.
    observation_collision:
      observable: >-
        The splitting-and-valuation profile Pi_B(E), and the derived scalars log Sm_B and
        Om_B.
      distinct_preimage_search: >-
        REQUIRED, AND TWO COLLISIONS ARE IDENTIFIED IN ADVANCE. (i) EXPECTED AND
        INFORMATIVE - every curve in an F_p-isogeny class has the SAME Pi_B, so the
        observable identifies a CLASS and never a curve; any per-curve claim made from it
        would be wrong by construction, and the design therefore reports per class.
        (ii) THE DANGEROUS ONE, which is the record's own claim U - a j = 0 curve and a
        generic-D_0 curve at the same p can have the same Om_B and the same log Sm_B for
        entirely different reasons, one because 2 is excluded and the odd primes are
        doubled and the other because every prime is at its unconditional rate. Exhibiting
        that collision at a rate consistent with H-null IS the deliverable, and a record
        reporting a special-j smooth-part effect WITHOUT running this search would be
        reporting the constraint and calling it a bias.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The matched-p family - at each toy prime p, the set of ALL isogeny classes,
          labelled by D_0 and by |Aut|, so that special j, small |D_0| with |Aut| = 2, and
          generic D_0 are three cells of one exhaustive enumeration rather than three
          separately drawn samples.
        predicted_gain: >-
          Encoding is exact, since the enumeration is complete at each p and no sampling
          is involved. Completeness - every class at every tested p. Soundness - each
          class certified against the Hurwitz-Kronecker mass formula using the campaign's
          existing census capability. Transfer - DECLARED UNMET beyond the tested p range;
          nothing about smooth parts at 2^32 transfers to cryptographic p except through
          heuristic H1.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "the group order is constrained to a density-1/2 prime set"
          fixed and vary the forgotten structure, namely |D_0|. The intrinsic invariant
          distinguishing the resulting objects is the SIZE OF THE SMALLEST EXCLUDED PRIME,
          which is 2 for D_0 = -3 and is typically large and unpredictable for generic
          D_0. That is the record's answer to why the effect, if any, lives at q = 2 and
          nowhere else.
        predicted_gain: >-
          Relocates the whole question from the density of the constraint - where there is
          nothing to find - to the smallest excluded prime, where there is an exact and
          checkable statement.
    quantifier_order: >-
      CLAIMED IN THIS ORDER FOR U. FOR ALL primes p > 3, FOR ALL ordinary E/F_p, FOR ALL
      primes q dividing #E with q not dividing 2D: (D_0/q) = +1. The universal quantifier
      over q comes last and is the content.
      FOR S1 - FOR ALL primes p > 3 with p congruent to 1 mod 3, FOR ALL ordinary E/F_p
      with D_0 = -3 AND conductor f = 1: #E is odd. The conductor hypothesis is part of
      the quantifier and dropping it makes the statement false, which is why the f arm is
      separate.
      THE WEAKER READING EXPLICITLY NOT CLAIMED - "for every special-j curve there EXISTS
      a small prime that does not divide #E", which is vacuous.
      THE STRONGER READING EXPLICITLY NOT CLAIMED - any statement that the smooth-part
      distributions differ. That is measured, not claimed, and H-null is the
      pre-registered expectation.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested primes, over the complete enumeration of ordinary isogeny classes,
        the group orders of special-j classes do or do not differ from matched
        generic-D_0 classes in B-smooth part and small-factor count, with the difference
        attributable to the smallest excluded prime and not to the density of the
        constraint; and every conductor-1 D_0 = -3 class has odd order." IT CAN NEVER
        CERTIFY - anything about a fixed prime-order instance, anything about the exponent,
        anything about relation collection or the automorphism discount, anything about
        cryptographic p, and nothing about the hardness of the ECDLP.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS - D_0 = -163, a class-number-one
        discriminant that is SMALL in the sense the lane usually means (h = 1, the curve
        is a reduction of a fixed global CM curve) but for which |D_0| is large enough
        that the excluded prime set is not a short congruence condition and 2 is NOT
        inert: -163 is 5 modulo 8, so 2 is inert there too - which makes -163 an
        exceptionally good control because it shares S1's mechanism while having
        |Aut| = 2 and h = 1. A method that reports a special-j effect at D_0 = -3 but not
        at D_0 = -163 is detecting the automorphism, not the arithmetic; a method that
        reports it at both is detecting the excluded prime. The pair separates the two
        hypotheses and it costs nothing.
    proof_obligations:
      - claim: '4 #E = (t-2)^2 + |D_0| f^2 for every ordinary curve.'
        responsibility: correctness
      - claim: 'q divides #E and q does not divide 2D implies (D_0/q) = +1.'
        responsibility: correctness
      - claim: 'The split-prime set has density exactly 1/2 for every non-square D_0.'
        responsibility: baseline
      - claim: 'D_0 = -3 with f = 1 forces #E odd.'
        responsibility: strictness
      - claim: 'D_0 = -4 with f = 1 forces #E = m^2 + 1 and v_2(#E) at most 1.'
        responsibility: strictness
      - claim: 'Pi_B is constant on an F_p-isogeny class, so the unit of analysis is the class.'
        responsibility: interface
      - claim: >-
          On a prime-order subgroup the entire content of Pi_B is (D_0/N) = +1, which is
          the existence of the GLV eigenvalue and therefore the sqrt(|Aut|) null restated.
        responsibility: scope
      - claim: >-
          Any measured effect is on the density of weak instances in curve GENERATION, not
          on the cost of a fixed instance.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        fraction of prime divisors q of #E, over the complete class enumeration at each
        tested p, with (D_0/q) = +1, excluding q dividing 2D
      direction: different
      minimum_effect: >-
        Exactly 1.000, on every class, with zero exceptions. Any exception falsifies U and
        first indicts the implementation, since U is an identity plus one congruence.
    - metric: >-
        v_2(#E) over conductor-1 D_0 = -3 classes
      direction: lower
      minimum_effect: >-
        Exactly 0 on every such class. A single even order among them falsifies S1.
    - metric: >-
        v_2(#E) over conductor-1 D_0 = -4 classes, and the indicator that #E - 1 is a
        perfect square
      direction: lower
      minimum_effect: >-
        v_2 at most 1 on every such class, and #E - 1 a perfect square on every such class.
        A single violation falsifies S2.
    - metric: >-
        mean of log Sm_B over special-j classes minus the same over matched generic-D_0
        classes at the same p, with B = 10^3, reported with an exact permutation
        distribution over class labels
      direction: lower
      minimum_effect: >-
        THE PRE-REGISTERED EXPECTATION IS H-bias, i.e. a NEGATIVE difference of magnitude
        about log 2 - the expected 2-part of a random integer - attenuated by the doubling
        on the allowed odd primes; the design does not invent a sharper number because no
        model in the corpus supplies one, and the exact predicted value is computed in
        Stage 0 from the constrained-Lenstra model before any data is read. A difference of
        the opposite sign, i.e. special-j classes SMOOTHER, is H-weak and triggers
        GOAL-ENDO-001 pause condition P3 before any description.
    - metric: >-
        the same difference computed for the matched-|Aut| control, D_0 in {-7, -8, -11,
        -163} against generic, all with |Aut| = 2
      direction: different
      minimum_effect: >-
        If the D_0 = -3 effect is arithmetic it must ALSO appear at every small |D_0| whose
        smallest excluded prime is 2, in particular at -163; if it appears only at -3 and
        -4 it is tracking the automorphism group and the arithmetic reading is void. This
        is the single most informative cell in the design and it is free.
    - metric: >-
        Om_B, the small-factor count, split by whether the smallest excluded prime is 2
      direction: different
      minimum_effect: >-
        A step at the smallest-excluded-prime axis, not a smooth trend in |D_0|. The
        predicted SHAPE is stated in advance: a quantity that instead decays smoothly with
        |D_0| is measuring class-number or conductor effects, not exclusion, and the
        interpretation must change accordingly.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is most of the deliverable): derive U, S1 and S2;
      compute the constrained-Lenstra prediction for E[log Sm_B] under "q divides #E with
      probability 2q/(q^2-1) if (D_0/q) = +1 and 0 otherwise", for D_0 = -3, -4, -7, -8,
      -11, -163 and for the unconditional model, at B = 10^3; write the predicted
      differences down BEFORE any data is read.
      STAGE 1 (baseline reproduction, BLOCKING): at three committed toy primes, enumerate
      every ordinary isogeny class, certify each against the Hurwitz-Kronecker mass
      formula with the Deuring weighting honoured at D_0 in {-3, -4}, and check the pooled
      Pr[q divides #E] against q/(q^2-1) for q in {2, 3, 5, 7, 11}.
      STAGE 2 (the exact arms): verify U, S1 and S2 by complete enumeration - every class,
      every p in the range, factor #E outright, record Pi_B, v_2, and the perfect-square
      indicator for #E - 1 on the D_0 = -4 arm.
      STAGE 3 (the distributional arm): compute log Sm_B and Om_B per class, compare
      special-j against matched generic-D_0 at the SAME p with an exact permutation test
      over class labels, and run the matched-|Aut| control at D_0 in {-7, -8, -11, -163}.
      REPORT PER CLASS, NEVER PER CURVE, since Pi_B is a class invariant.
    controls:
      - >-
        MATCHED RANDOM NULL OBJECT, BLOCKING - generic-D_0 classes at the SAME p and the
        same #E bit length, measured through the identical code path. Without it any
        special-j number is an artifact.
      - >-
        SQRT(|Aut|) BASELINE AS THE NULL HYPOTHESIS, per RQ-JINV-8fc13a's decision_target.
        The record must state, and the design must enforce, that on a prime-order subgroup
        the whole of Pi_B reduces to (D_0/N) = +1, which is the GLV eigenvalue and hence
        the null itself. Any reported effect must be shown to live in the COFACTOR, not in
        N.
      - >-
        MATCHED-|Aut| CONTROL, the design's discriminating cell - D_0 in {-7, -8, -11,
        -163}, small |D_0| with |Aut| = 2, exactly the replacement null
        IDEA-20260829-a250ee R3(b) names and exactly the nearby object H-JINV-db2776 uses.
        It separates "small |D_0|" from "|Aut| > 2", which no other control in this record
        does.
      - >-
        DECAY PARAMETER - the smallest excluded prime, swept by choosing D_0 with 2 inert
        (-3, -163), 2 split (-7, since -7 is 1 mod 8) and 2 ramified (-4, -8). The
        predicted shape is a STEP on this axis and FLAT in |D_0| at fixed smallest-excluded
        prime. A quantity that fails to move when the smallest excluded prime moves is the
        canonical artifact tell (docs/inventor-protocol.md section 3).
      - >-
        SECOND DECAY PARAMETER - the conductor f. S1 and S2 are stated for f = 1 only and
        must FAIL at f > 1 in the predicted way; a statement that survived every f would
        indicate the arm is not computing the conductor at all.
      - >-
        TWIST CONTROL - the quadratic twist has trace -t and a different #E while sharing
        j, D_0 and |Aut|. Pi_B must DIFFER between a class and its twist. If it does not,
        the instrument is reading j rather than the order and every number is void.
      - >-
        CLASS-COMPLETENESS CERTIFICATE - every enumerated class certified against the
        Hurwitz-Kronecker mass formula, with the Deuring weighting of 1/3 at j = 0 and 1/2
        at j = 1728 honoured, per H-JINV-5a0b9e STEP 2.
    required_metrics:
      - per class - p, t, #E, D, D_0, f, h(D_0), |Aut|, class size, Deuring weighting flag
      - Pi_B per class for B = 10^3, and the full factorisation of #E at toy scale
      - v_2(#E), and the perfect-square indicator for #E - 1 on the D_0 = -4 arm
      - log Sm_B and Om_B per class, with exact permutation distributions over class labels
      - the Stage 0 constrained-Lenstra predictions, recorded before the data
      - pooled Pr[q divides #E] against q/(q^2-1), the Stage 1 fixture
      - the matched-|Aut| control table and the smallest-excluded-prime sweep

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY). A prime q dividing #E with q not dividing 2D and
      (D_0/q) = -1. U is false, which contradicts an identity plus one congruence, so the
      implementation is indicted first and independent review is required.
    - >-
      F2. An even #E on a conductor-1 D_0 = -3 class, or an #E - 1 that is not a perfect
      square on a conductor-1 D_0 = -4 class. S1 or S2 is false as stated and is withdrawn
      by a superseding record.
    - >-
      F3 (THE INTERESTING FALSIFIER, AND THE ONLY OUTCOME THAT COULD MATTER). log Sm_B
      systematically LARGER on special-j classes than on matched generic-D_0 classes at
      the same p, surviving the permutation test and the matched-|Aut| control. Special-j
      curve generation would then produce weak orders at a higher rate - an advantage
      beyond sqrt(|Aut|) on the data axis. GOAL-ENDO-001 pause condition P3 fires and work
      stops for independent review before any record states it.
    - >-
      F4 (THE MAIN NEGATIVE AND THE INTENDED DELIVERABLE). No difference beyond the
      Stage 0 constrained-Lenstra prediction, and any difference that does appear tracking
      the SMALLEST EXCLUDED PRIME rather than |D_0| and appearing equally at D_0 = -163
      where |Aut| = 2. Then the lane's "small discriminant means arithmetically special"
      intuition is closed with a named obstruction - the density of the split-prime
      constraint is 1/2 for every non-square D_0 - and the record must name its successors
      or it has not finished (docs/inventor-protocol.md section 4).
    - >-
      F5. The twist control fails, i.e. Pi_B is equal for a class and its twist. The
      instrument is reading j or D_0 rather than #E and every number is void in both
      directions.
    - >-
      F6. The Stage 1 fixture fails, i.e. pooled small-prime divisibility does not match
      q/(q^2-1). The enumeration or the factorisation is wrong; the line halts before any
      special-j cell is compared.
    - >-
      NOT A FALSIFICATION - factorisation of #E timing out at the largest p. That is an
      infrastructure outcome under AGENTS.md rule 5, reported with the largest p reached,
      and never evidence about smooth parts.

  confounders:
    - >-
      THE UNIT OF ANALYSIS IS THE CLASS, NOT THE CURVE. Pi_B is an isogeny-class invariant,
      so treating the roughly 2 sqrt(p) curves of a class as independent observations
      would inflate every sample size by the class size and manufacture significance from
      nothing. This is the dominant statistical confound and the design forbids per-curve
      pooling outright.
    - >-
      SPECIAL-j CLASSES ARE FEW. At each p there is at most one D_0 = -3 class and one
      D_0 = -4 class, so the special-j arm has n = 1 per prime and its power comes only
      from sweeping p. This is the same n = 1 failure mode that made EXP-MONO-64aaa4
      inconclusive at p = 0.066 (DEC-20260831-7b44fe), and the design's answer is to
      pre-register the FULL set of primes in the range before any measurement and report
      the distribution over primes, not a single cell. See IDEA-20260901-054dd4 for the
      general form of that fix.
    - >-
      #E AND p ARE LINKED. Comparing classes at the same p still leaves #E varying across
      the Hasse interval, and the smooth part depends on the size of #E. The design
      matches on #E bit length and reports the residual dependence explicitly.
    - >-
      D_0 = -3 AND |Aut| = 6 ARE PERFECTLY CONFOUNDED ACROSS CLASSES, exactly as
      H-JINV-5a0b9e's T4 records. The matched-|Aut| control at D_0 = -163 is the only
      available separation on this axis and it is why -163 was chosen rather than a
      generic small discriminant: -163 is 5 modulo 8, so 2 is inert there as it is at -3,
      giving S1's mechanism with |Aut| = 2.
    - >-
      THE CONSTRAINED-LENSTRA MODEL IS A HEURISTIC, NOT A THEOREM, and it is the reference
      the measured difference is scored against. If the model is wrong the difference is
      still measured correctly but its interpretation changes; the model's own fit is
      checked by the Stage 1 fixture in the unconditional case first.
    - >-
      SMALL B MAKES Sm_B NOISY AND LARGE B MAKES IT ESSENTIALLY #E. B = 10^3 is declared
      in advance and the whole analysis is repeated at B = 10^2 and B = 10^4 as a
      robustness sweep, with all three reported.

  interpretation_limits:
    - >-
      claim_tier toy. Complete enumeration at p up to about 2^32 and nothing beyond; no
      statement about any cryptographic parameter. U, S1 and S2 are DERIVATIONS under
      docs/claims-and-verification.md and the enumeration verifies the implementation over
      a finite range, not the statements.
    - >-
      NO ECDLP SPEEDUP OF ANY KIND, AND THE HONEST CEILING IS STATED PLAINLY. On a
      prime-order subgroup the entire content of the tracked object is (D_0/N) = +1, which
      is the existence of the GLV eigenvalue and is therefore the sqrt(|Aut|) NULL. The
      only axis this record can move is the density of weak instances in curve GENERATION,
      a data-axis population statement. sota_delta on time and memory is exactly zero and
      that is the expected answer.
    - >-
      WHY IT IS WORTH A TEST ANYWAY, STATED RATHER THAN ASSUMED. The lane's recurring
      "small discriminant means weaker" intuition is explicitly named and refuted for
      automorphisms by H-JINV-db2776 S2 but has never been tested on the arithmetic of the
      group order itself, which is where a reader would naturally look next; the test is a
      complete enumeration rather than a sample, so its negative is exact rather than
      statistical; and the j = 0 family includes deployed curves, so a positive on the
      weak-instance-density axis would be reportable.
    - >-
      SCOPED TO ORDINARY PRIME-FIELD CURVES WITH p > 3, CONDUCTOR 1 FOR S1 AND S2, AND THE
      TESTED PRIME RANGE. Supersingular curves are out of RQ-JINV-8fc13a's scope; extension
      fields carry more structure and every number here would have to be recomputed.
    - >-
      NOTHING HERE BEARS ON VOLCANO DEPTH, which is RQ-VOLC-f6253b's subject and is worked
      concurrently; the conductor appears only as a control that S1 and S2 must fail at
      f > 1.
    - >-
      H-ENDO-001 is the admissibility filter and is not retested; nothing here bears on
      H-STR-002, so pause condition P2 is not engaged.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        CONSTRAINED-LENSTRA DIVISIBILITY. For a small prime q and an ordinary isogeny class
        drawn uniformly at a fixed p, conditional on the fundamental discriminant D_0,
        Pr[ q divides #E ] = 0 + O(1/q^2) if (D_0/q) = -1, and
        Pr[ q divides #E ] = 2 q / (q^2 - 1) + o(1) if (D_0/q) = +1,
        the two averaging over D_0 to the unconditional q/(q^2 - 1); and conditional on
        D_0 the events for distinct q are asymptotically independent, so log Sm_B has the
        sum-of-independent-terms law that the Stage 0 prediction uses.
      rigorous_support: >-
        RIGOROUS PART. The vanishing half is not heuristic at all: (D_0/q) = -1 together
        with the identity U FORCES q not to divide #E unless q divides 2D, so the first
        line is a theorem with an explicitly enumerable exceptional set. What is heuristic
        is the DOUBLING on the split half and the independence across q.
        DISTRIBUTION IMITATED. The classical statement being imitated is Lenstra's
        heuristic that group orders behave like random integers in the Hasse interval with
        the class-number weighting, restricted to the residue classes the discriminant
        permits - the same move by which Dickman-de Bruijn is applied to algebraically
        produced integers.
        WHY IT COULD FAIL, STATED HONESTLY. #E is a value of a quadratic form, not a random
        integer, and values of quadratic forms have genuine biases in their divisor counts
        driven by the class group of the form; at small |D_0| with h(D_0) = 1 every split
        prime is a norm of a principal ideal while at larger h only about 1/h of them are,
        which is a real |D_0|-dependent effect on the DIVISOR STRUCTURE that H1 does not
        model and that the measurement may see.
      validation_plan: >-
        WHAT TO SAMPLE - the COMPLETE enumeration of ordinary isogeny classes at every
        prime p in a declared range up to about 2^32, with #E factored outright, so v_q is
        exact for every q and the reported divisibility rates are not estimates. WHICH
        SHORTCUT MAKES SAMPLING FEASIBLE AT LARGER PARAMETERS - the profile Pi_B depends on
        the class only through (p, t), so for larger p the arm can enumerate (p, t) pairs
        and compute #E and D_0 arithmetically WITHOUT constructing any curve, which pushes
        the distributional arm several orders of magnitude past the arm that needs curves;
        the transfer assumption is that curve-free (p, t) enumeration is the same
        population as class enumeration up to the Hurwitz weighting, and it is declared
        rather than assumed.
        AGAINST WHICH PREDICTED DISTRIBUTION - the empirical distribution of log Sm_B
        against the Stage 0 constrained-Lenstra prediction, and separately against the
        Dickman-de Bruijn rho(u) curve for the FULL smooth part, reported as an empirical
        CDF per D_0 cell with the unconditional curve overlaid.
        TAIL CONSISTENCY CHECKS - the smoothest observed #E in each cell against the
        predicted rho(u) tail, and the count of classes whose #E is 10^3-smooth, which
        under the model should be equal across cells up to the exclusion effect. A cell
        with a heavier smooth tail than predicted is the interesting event and is reported
        as a finding, never absorbed as noise.
        SAMPLED PARAMETERS RECORDED - the prime range, every (p, t), D, D_0, f, h(D_0),
        |Aut|, class size and Deuring flag.
      falsification_condition: >-
        Measured Pr[q divides #E] on the split half differing from 2q/(q^2-1) by more than
        3 binomial standard errors, pooled over the complete enumeration, for any q in
        {3, 5, 7, 11, 13}. H1 is refuted, the Stage 0 predictions are void, and the
        distributional arm reports raw comparisons only.
    - id: H2
      statement: >-
        CLASS-NUMBER NEUTRALITY OF THE DIVISOR STRUCTURE. Conditional on the splitting
        profile, the number of prime divisors of #E below B does not depend on h(D_0) -
        i.e. the fact that at h(D_0) = 1 every split prime is the norm of a principal ideal
        while at h > 1 only a 1/h fraction is has no measurable effect on how often such
        primes actually divide #E.
      rigorous_support: >-
        RIGOROUS PART - none; this is the record's weakest assumption and it is stated as
        such. It is the one place where h(D_0), and therefore genuinely |D_0|-dependent
        class-group structure, could enter the arithmetic of #E, and it is precisely the
        axis IDEA-20260826-d61c49 and IDEA-20260828-f3c50e measure on OTHER functionals.
        DISTRIBUTION IMITATED - none. It is a null hypothesis, offered so that its failure
        is a finding rather than a surprise.
      validation_plan: >-
        WHAT TO SAMPLE - the complete enumeration again, now stratified by h(D_0) at
        matched splitting profile, which the matched-p design supplies for free.
        AGAINST WHICH PREDICTION - zero difference in Om_B across h strata, with an exact
        permutation distribution. TAIL CHECK - the h = 1 stratum reported separately in
        full, since it contains D_0 = -3 and -4 and is where any effect would be largest.
        TRANSFER - none claimed; this is a toy-scale statement about the tested range.
      falsification_condition: >-
        A monotone association between Om_B and h(D_0) at matched splitting profile. H2 is
        refuted, and the finding is that class-group SIZE, not discriminant size, is the
        operative variable on this axis - which would be a genuine result for the lane and
        must be routed to IDEA-20260826-d61c49's and IDEA-20260828-f3c50e's authors as a
        cross-record observation.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED, AND NO ALGORITHM IS PROPOSED. This record's honest ceiling is a
      CONSTANT, and in fact on a prime-order instance it is exactly ZERO - the RQ is about
      a constant-factor null and this axis of it collapses to the null identically. What
      the record can move is a DATA-AXIS quantity, the density of B-smooth group orders in
      a curve-generation population, for which the relevant baseline is not rho at all but
      Pohlig-Hellman plus rho on the largest prime factor, at
      sum over q^e || #E of e * 0.886 * sqrt(q) operations. If a special-j population had
      a systematically larger smooth part, its expected attack cost would fall by the
      corresponding factor - which is a statement about a distribution of instances and is
      recorded as such, never as an exponent.
    memory_exponent: >-
      O(1) for the rho baseline, unchanged. The measurement itself stores one profile
      vector per class, O(pi(B)) integers, which is negligible.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) on the largest prime
      factor, with Pohlig-Hellman on the rest (KN-TECH-001, KN-TECH-006); the
      automorphism-discounted CM variant at 1.2533*sqrt(N/|Aut|) (KN-TECH-018); BSGS at
      sqrt(N)/sqrt(N). For the population statement, the relevant known baseline is the
      standard smoothness heuristic for group orders in the Hasse interval, which this
      record's H1 refines rather than replaces.
    hidden_overhead: >-
      Disclosed in three places. (a) The density-1/2 statement is asymptotic in q and the
      measurement is over a finite prime range, so the effective density in any tested
      window can deviate; the window is reported. (b) The constrained-Lenstra doubling
      2q/(q^2-1) is heuristic H1, not a theorem, while the VANISHING on the inert half is a
      theorem - the asymmetry in rigour between the two halves is the single most important
      thing a reader must carry away and it is stated in H1 rather than buried. (c) No o(1)
      is claimed anywhere; every statement is either exact or explicitly heuristic.
    tradeoff_note: >-
      No time-memory tradeoff arises. The one tradeoff worth stating is EVIDENTIAL: the
      complete enumeration makes the negative exact over its range but the range is small,
      and the curve-free (p, t) arm extends the range at the cost of the Hurwitz-weighting
      transfer assumption. Both are reported and neither is presented as the other.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, so this is not a bare null.
    TIME - parallel rho at 0.886*sqrt(N) dominates; no algorithm is proposed here at all.
    MEMORY - rho at O(1) dominates. TIME AND MEMORY JOINTLY - van Oorschot-Wiener's
    sqrt(N^3/w) curve dominates. CM-SPECIFIC - automorphism-discounted rho at
    1.2533*sqrt(N/|Aut|) (KN-TECH-018) dominates on the j = 0 and j = 1728 families and
    is the null this record is measured against. COMPOSITE-ORDER - Pohlig-Hellman
    dominates whenever #E is smooth, which is exactly the population this record
    characterises rather than attacks. MULTI-TARGET - Kuhn-Struik at sqrt(LN) dominates in
    its regime. DATA/QUERIES - no queries are consumed and no query advantage is claimed;
    the data-axis statement is about a population of curves, not about oracle access.
    GENERIC LOWER BOUND - Shoup's Omega(sqrt(N)) is not competed with. Every row dominates
    trivially because no algorithm is proposed, so `null` is not available and is not
    written.
  sota_delta:
    time_exponent: '0 (no change)'
    memory_exponent: '0 (no change)'
    data_or_query_exponent: >-
      0 on a fixed instance; the only axis in play is the DENSITY of B-smooth group orders
      in a generation population, whose measured shift is the deliverable and is not yet a
      number
    note: >-
      ZERO on time and memory, and on a prime-order instance zero on every axis, which is
      the historically expected answer for this research question and is not inflated
      here. The structural delta that exists is exact and countable. (i) The lane's
      recurring "small discriminant makes the group order arithmetically special"
      intuition is refuted in the form it is usually stated, by an identity plus a
      density-1/2 argument, at zero compute - the constraint exists on EVERY ordinary
      curve and has the same strength everywhere. (ii) Two exact special-j consequences,
      #E odd at D_0 = -3 with f = 1 and #E = m^2 + 1 at D_0 = -4 with f = 1, are stated
      with their conductor hypotheses and are checkable by complete enumeration.
      (iii) The question is relocated from |D_0| to the SMALLEST EXCLUDED PRIME, which is
      a different variable and which the matched-|Aut| control at D_0 = -163 can separate
      from the automorphism group - a separation H-JINV-db2776's nearby-object control
      already uses on a different functional and that this record extends to the arithmetic
      of the order.

  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Stage 0 needs no machine and produces the pre-registered predictions. Stages 1 and 2
    are complete enumerations of ordinary classes at toy primes with #E factored outright,
    which is seconds per prime below 2^24 and minutes per prime near 2^32. The curve-free
    (p, t) arm for H1 needs no curve construction at all and can sweep many orders of
    magnitude more primes at the same cost. This is the cheapest record in this batch.
  recommended_priority: medium

  relation_to_existing_records:
    shares_an_identity_with: >-
      H-JINV-5a0b9e, which uses D = (t-2)^2 - 4N as its confound-annihilating design
      device. No novelty is claimed for the identity; only for its arithmetic consequence.
    reaches_the_same_conclusion_by_a_disjoint_route_as: >-
      H-JINV-db2776 S2. That record argues small |D_0| confers no discount from the
      automorphism classification; this one argues small |D_0| does not make the group
      order arithmetically special, from a density argument. Each is a check on the other.
    hands_a_control_to: >-
      IDEA-20260829-a250ee R3(b), whose D_K in {-7, -8, -11} replacement null is reused
      here and extended with D_0 = -163, chosen because 2 is inert there as at -3, which
      gives S1's mechanism at |Aut| = 2.
    does_not_touch: >-
      RQ-VOLC-f6253b (volcano depth, worked concurrently), H-STR-002 and any factor base,
      and the Semaev and relation-density instruments.

  id_allocation_provenance: >-
    Pre-allocated by the orchestrating session as one of five reserved identifiers,
    declared verified-free. Not minted by this agent and not confirmed with
    tools/allocate_id.py --check, which this agent could not run.

  yaml_parse_disclosure: >-
    THIS AGENT DID NOT MACHINE-PARSE THIS FILE - no interpreter was available. It was
    written to the stated hygiene rules; the orchestrator must run the strict parse and
    tools/validate_ledger.py before the record is relied on.

  source_refs:
    - RQ-JINV-8fc13a
    - GOAL-ENDO-001
    - H-ENDO-001
    - H-JINV-5a0b9e
