idea:
  id: IDEA-20260829-f924c8
  question_id: RQ-MLDSA-ffa0f5
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'
  title: >-
    RQ-MLDSA-ffa0f5 names two things FIPS 204 asserts without deriving and the
    lane has spent twelve proposals on those two. Treat "assertion without
    derivation" as a POPULATION rather than two anecdotes - enumerate every one
    by a declared syntactic rule, attach to each an executable re-derivation
    that emits DERIVABLE, HEURISTIC-CONDITIONAL or NOT-DERIVABLE with its
    numeric residual, and prove the auditor can fail by feeding it five BLINDED
    PLANTED assertions, three of them false, that it must not certify.
  class: measurement

  claim: >-
    (A) THE OBJECT, AND WHY IT IS A POPULATION. RQ-MLDSA-ffa0f5's second half
    asks what FIPS 204 asserts without deriving. Twelve filed proposals answer
    it for exactly two assertions - the ct0 signing-only rejection and the
    t0-secrecy sentence - both inherited from the question record itself. NO
    RECORD IN THIS CORPUS HAS ASKED WHETHER THOSE TWO ARE TYPICAL OR
    EXCEPTIONAL, and the answer determines whether this lane should keep mining
    two seams or open a survey. The tracked object is therefore the ASSERTION
    itself, enumerated over the whole document by a declared rule and classified
    by whether a script can re-derive it from the document's own definitions.

    (B) THE CLASSIFICATION, WHICH IS THE DELIVERABLE. Each enumerated assertion
    lands in exactly one of three classes.
    CLASS A, DERIVABLE - a script re-derives it from the standard's own
    definitions, tables and algorithm listings, with zero residual or with an
    exactly reproduced value. Example predicted in advance: the annotation that
    the decoded t0 is always in the correct range, which follows from the
    encoding width alone.
    CLASS B, HEURISTIC-CONDITIONAL - re-derivable only after adopting a named
    distributional assumption, which the derivation script must declare as a
    parameter. Example predicted in advance: the expected-repetition column,
    which IDEA-20260805-bb52fa and IDEA-20260805-031ce2 both recompute to
    4.297 / 5.118 / 3.875 under the standard uniformity heuristic against a
    published 4.25 / 5.1 / 3.85, a same-sign residual of +1.1 / +0.35 / +0.65
    per cent.
    CLASS C, NOT DERIVABLE FROM THE DOCUMENT - the assertion depends on an
    external result, on a policy judgement, or on nothing stated. Example
    predicted in advance: that the low-order bits of t can be reconstructed from
    "a small number of signatures", for which IDEA-20260805-630606 shows the
    document supplies no number and an information floor is obtainable only from
    outside it.

    (C) THE FALSIFIABLE PREDICTIONS, FIXED BEFORE THE DOCUMENT IS OPENED. The
    enumerated population has at least 25 members. At least 2 land in class C.
    At least 1 lands in class B with a NON-ZERO residual, and the record
    pre-registers which one and what residual - the repetition column, at
    +1.1 / +0.35 / +0.65 per cent with a common sign. The five pre-registered
    anchor rows must land in their predicted classes. E1, THE TWO ARE
    EXCEPTIONAL: class C is at most 3 of at least 25, the standard is
    substantially self-derivable, and the lane's existing two seams are the
    right ones to keep mining. E2, THE TWO ARE TYPICAL: class C exceeds 15 per
    cent of the population, and the lane has been working two instances of a
    common pattern while leaving the rest unexamined - in which case the census
    itself names the successors.

    (D) THE POSITIVE CONTROL, WHICH IS WHAT MAKES A CLASS-A VERDICT MEAN
    ANYTHING. An auditor that certifies everything it is shown as derivable has
    demonstrated nothing, and a census is the single easiest deliverable in this
    program to produce and the single hardest to falsify. So five PLANTED
    assertions are inserted into the queue by a second party, blind to the
    auditor - three of them FALSE and two of them TRUE-BUT-ABSENT-FROM-THE-
    DOCUMENT - and the auditor's classification of them is scored before any
    genuine row is read. THE FALSE PLANTS ARE PRE-SPECIFIED IN KIND: a sup-norm
    envelope stated a factor of two too tight, a parameter-table entry with one
    digit changed, and a range annotation asserted for the wrong vector. THE
    AUDITOR MUST CLASSIFY ALL THREE AS NOT-DERIVABLE. If it certifies any of
    them as class A, the census has no power, no class-A row is reportable, and
    the outcome is an instrument statement rather than a finding.

    (E) THE ARTIFACT. The deliverable is not a table of verdicts but a manifest:
    for each assertion, the verbatim quotation with its page, the class, the
    executable re-derivation with its content hash, the numeric residual where
    one exists, and the named heuristic where class B applies. A second party
    re-runs the manifest and reproduces every verdict without reading a word of
    this record's prose.

    THIS IS A CLAIM ABOUT A DOCUMENT. "FIPS 204 asserts X without deriving it"
    is checkable by reading FIPS 204. "X is false" is a different and much
    stronger claim that this record does not make about any genuine row and
    makes only about the three planted ones, which were constructed false on
    purpose. Nothing here bears on MLWE, MSIS or SelfTargetMSIS in any
    direction.

  mechanism: >-
    (1) THE ENUMERATION RULE, DECLARED BEFORE THE DOCUMENT IS OPENED SO THE
    POPULATION IS NOT CHOSEN TO SUIT THE ANSWER. An assertion is any of:
    (i) every annotation appearing inside an algorithm listing, of the form
    "this is always in the correct range" or "this may lie outside ... if input
    is malformed"; (ii) every sentence of the normative and explanatory text
    containing one of the fixed markers - "ensures", "guarantees", "is always",
    "cannot", "need not", "it follows that", "is sufficient", "small number",
    "negligible", "with overwhelming probability", "for correctness",
    "for security"; (iii) every numeric entry of the parameter tables that is
    a DERIVED quantity rather than a chosen one, which the rule identifies as
    any entry expressible as a function of the others. The rule is fixed in
    advance, applied mechanically, and its output is the population. A rule
    changed after seeing the document produces a population chosen to suit the
    conclusion, which is the specific way this design can lie.

    (2) THE TWO-ANNOTATOR CHECK, BECAUSE THE RULE IS NOT SELF-EXECUTING.
    Sentence-level marker matching is mechanical, but deciding whether a matched
    sentence states one assertion or three is a judgement. Two annotators apply
    the rule independently to a 20 per cent sample and their agreement is
    measured by Cohen's kappa. A kappa below 0.7 means the population is not
    well defined, the rule is rewritten and re-applied from scratch, and no
    census fraction is reported from the first pass. WITHOUT THIS, "at least 25
    assertions" is a number the auditor could produce at will.

    (3) THE DERIVATION HARNESS. Each assertion gets one script that takes the
    document's declared constants as inputs and returns a verdict plus a
    residual. A class-A script must reproduce the asserted value exactly in
    integer or rational arithmetic - a float within a tolerance is class B in
    disguise and is recorded as such. A class-B script must name its heuristic
    as a declared parameter, so that the same script with the heuristic switched
    off returns NOT-DERIVABLE, which is a built-in per-row control. A class-C
    row has no script and instead records what external ingredient the assertion
    needs; where this corpus already supplies that ingredient - the information
    floor of IDEA-20260805-630606, the envelope theorem of
    IDEA-20260805-bb52fa - the row cites it and marks the assertion as
    derivable-from-outside rather than as unsupported.

    (4) THE LOSSY PROJECTION, AND WHY IT IS NOT A CHANGE OF COORDINATES. The
    projection sends a whole standards document - definitions, algorithms,
    tables, prose - to a list of triples (quotation, class, residual).
    Everything else is discarded: the algorithm bodies, the rationale, the
    formatting, the ordering. The fibre over any observed triple list is
    enormous, since many different documents would project to the same census.
    The discard is COMPATIBLE with the target's operations in the sense the test
    requires, because the operation being tracked is DERIVATION, and a
    derivation consumes exactly the declared constants and definitions the
    scripts take as inputs - so the retained part propagates deterministically:
    given the triple, a second party re-runs the script and reproduces the
    verdict without the document. THE MIRROR FAILURE - a projection so lossy it
    is constant - was checked and does NOT occur, because the projection takes
    at least three distinct values by construction and the census's whole
    content is the DISTRIBUTION of those values, which is not fixed in advance.
    But note the honest weakness: the projection is constant on any document
    whose assertions are all derivable, so a census returning all class A is
    exactly the degenerate case, and that is why the planted-false control is
    not optional.

    (5) WHY THIS IS NOT IDEA-20260805-031ce2 IN NEW NOTATION. That record
    censuses the FOUR REJECTION PREDICATES of one algorithm along the axis
    (reachable, verifier-observable, consequence of omission). This record
    censuses ASSERTIONS OF THE DOCUMENT along the axis (derivable,
    heuristic-conditional, not derivable). Different population - four items
    against at least twenty-five - different classification axis, and different
    failure mode: 031ce2's census can be wrong about a predicate's consequence,
    while this one can be wrong about the population itself, which is why the
    two-annotator check has no analogue there and is mandatory here. 031ce2's
    own confounder list names "a census is comfortable" and answers it with a
    positive control on one row; this design answers it with three blinded false
    plants across the whole queue.

    (6) WHAT THE RESULT CHANGES. If E1, the lane's next batches should go deeper
    on the two known seams and the census's value is a bounded closure - the
    standard is substantially self-derivable and the two exceptions are
    exceptions, recorded with the enumeration that establishes it. If E2, the
    census hands the coordinator a ranked list of unexamined class-C assertions,
    each with its quotation and its missing ingredient, which is a generator of
    successors rather than a verdict. Either way the manifest outlives the
    verdict, which is the durable-object standard docs/inventor-protocol.md
    section 4 sets.

  novelty_status: unverified

  citations:
    - ref: "FIPS 204, Module-Lattice-Based Digital Signature Standard, NIST, 2024-08-13"
      provenance: recalled
      claim: >-
        NOT FETCHED THIS SESSION. The entire population this record proposes to
        enumerate lives in a document this session has not read. Every anchor
        row below is therefore predicted from this corpus's own transcriptions
        and from memory, and the record's central numbers - the population size,
        the class fractions - are PRE-REGISTERED PREDICTIONS and not results.
        That is the honest position and it is why the design's first stage is a
        fetch under a run record.
      verified_by: null
    - ref: IDEA-20260805-bb52fa
      provenance: internal
      claim: >-
        Records a fetch receipt for FIPS 204 dated 2026-08-06 with a stated
        byte count and sha256, transcribes the parameter table and several
        algorithm annotations, and recomputes the repetition column to
        4.297 / 5.118 / 3.875 against a published 4.25 / 5.1 / 3.85. That
        recomputation is this record's pre-registered class-B anchor with a
        non-zero residual, and the fetch receipt is the reproduction target for
        Stage 0.
      verified_by: "idea-generator, 2026-08-29, full read of all 619 lines."
    - ref: IDEA-20260805-630606
      provenance: internal
      claim: >-
        Quotes the t0-secrecy sentence and establishes that the document
        supplies no number for "a small number of signatures", while deriving
        floors of 34 / 60 / 58 from an argument that uses the document's
        encoding constraints plus information theory from outside it. This is
        the pre-registered class-C anchor and the template for the
        derivable-from-outside sub-label.
      verified_by: "idea-generator, 2026-08-29, full read of all 556 lines."
    - ref: IDEA-20260805-031ce2
      provenance: internal
      claim: >-
        Censuses the four Algorithm 7 rejection predicates on a different axis
        and independently reproduces the repetition-column residual. Cited as
        the nearest in-corpus record and as the source of the confounder this
        design is built against - that a tidy table reads as rigour and costs
        nothing.
      verified_by: "idea-generator, 2026-08-29, full read of all 586 lines."
    - ref: >-
        draft-connolly-cfrg-ml-dsa-security-considerations-02, IETF
        Internet-Draft
      provenance: retrieved
      claim: >-
        An external, independently authored document that states security
        considerations FIPS 204 does not, including that the seed signing-key
        format "makes it impossible to create a malformed key" while the
        expanded format "admits the possibility of malformed keys", and that
        implementations "should not impose a fixed upper bound on the number of
        signing loop iterations". Cited here as a CROSS-CHECK CORPUS: every
        consideration this draft raises that FIPS 204 does not state is a
        candidate class-C row, so the draft gives the census an external
        completeness probe it would otherwise lack.
      verified_by: >-
        idea-generator, 2026-08-29, WebFetch of
        https://www.ietf.org/archive/id/draft-connolly-cfrg-ml-dsa-security-considerations-02.html
        against a targeted extraction prompt; not a full linear read.
    - ref: "docs/inventor-protocol.md section 4 and KN-TECH-056"
      provenance: internal
      claim: >-
        Sets the closure standard this record's E1 outcome must meet - a named
        obstruction, an argument and forward guidance - and states that a count
        of screened items is a fatigue report whose honest status is unverified.
        The census is designed so that an E1 outcome is a closure with an
        enumeration behind it rather than a fatigue report.
      verified_by: "idea-generator, 2026-08-29, full read of the document."

  assumptions:
    - >-
      That FIPS 204 can be re-obtained and its text extracted. This corpus
      records the fetch succeeding once, on 2026-08-06, by an unusual extraction
      route; if it fails, the census cannot be run and that is an infrastructure
      outcome under AGENTS.md rule 3, never a statement about the standard.
    - >-
      That the enumeration rule can be applied mechanically enough for two
      annotators to agree. The kappa check is the gate; a low kappa means the
      population is ill-defined and no fraction is reported.
    - >-
      That a second party is available to plant the five blinded assertions and
      to score them. A census whose planted controls were placed by the same
      agent that classifies them is self-confirming and its verdicts are void.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the classification of a
      single assertion as DERIVABLE. Everything else - the counts, the fractions,
      the E1/E2 split - is arithmetic on those classifications. The bottleneck is
      therefore the derivation harness's soundness: whether a script that returns
      DERIVABLE has actually derived the assertion or has merely restated it
      with the asserted value substituted in. That is exactly the failure the
      planted-false rows hunt.
    baseline_embedding:
      parameter_slice: >-
        The old-method boundary is the two assertions the question record
        already names. The census must reproduce the lane's existing verdicts on
        them - the ct0 rejection's reachability as class A via the envelope
        argument, and the t0-secrecy sentence as class C - without being told
        them. A census that reclassifies either has either found something or
        broken something, and deciding which comes first.
      reproduction_check: >-
        A frozen fixture of five anchor rows with pre-registered classes, run
        before the full population is enumerated. If the harness misses an
        anchor, the harness is fixed before the census proceeds, and the fix is
        recorded so that it cannot be mistaken for a finding.
    observation_collision:
      observable: >-
        The certificate is the pair (class, residual) plus the derivation
        script's content hash.
      distinct_preimage_search: >-
        Two distinct ground-truth situations with the same observable were
        searched for and one was found, and it is the design's central threat: a
        TRUE assertion with a sound derivation, and a FALSE assertion with a
        circular derivation that reads its own conclusion from the document's
        stated value. Both emit class A with residual zero. THE SEPARATOR IS THE
        PLANTED-FALSE ROW, which is constructed so that a sound derivation must
        return a non-zero residual and a circular one returns zero. This is the
        one place the census can be decisively shown to be worthless, and the
        design puts it before every genuine row.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (class A, residual zero) fixed and vary the
          forgotten structure - whether the assertion is true. The intrinsic
          invariant distinguishing the two resulting objects is whether the
          derivation script consumes the asserted value as an input, which is
          decidable by static inspection of the script and is recorded as a
          per-row flag.
        predicted_gain: >-
          Turns "is this census sound" from an appeal to care into a mechanical
          per-row property that a second party checks from the manifest alone.
      - transform: specialization_pack
        proposed_object: >-
          Build a per-row resource measure - the set of document constants each
          derivation consumes - and add rows only over disjoint constant sets
          when reporting independence. Two rows that consume the same three
          table entries are not two independent confirmations of anything.
        predicted_gain: >-
          Prevents the census from reporting internal consistency as external
          corroboration, which is the specific error IDEA-20260805-bb52fa flags
          in its own confounder list.
    quantifier_order: >-
      FOR ALL assertions in the population produced by the declared rule, THERE
      EXISTS a class and a derivation script such that a second party re-running
      the script reproduces the class - note the script is quantified AFTER the
      assertion, so a script may be assertion-specific, which is what makes the
      census executable. What is NOT claimed, and would be a different and
      stronger statement, is that THERE EXISTS a single uniform procedure that
      classifies all assertions; no such procedure is proposed and none is
      implied.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is that a given assertion
        is or is not re-derivable from the document's own declared constants and
        definitions by a stated script, and the distribution of that property
        over a declared population. It cannot certify that a class-C assertion
        is FALSE, it cannot certify that a class-A assertion is important, and it
        cannot certify that the population is complete - only that it is what
        the declared rule produces.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a
        specification that is fully self-derivable and yet still load-bearing in
        the way this lane cares about - for example one whose every assertion
        follows from its own definitions while its PARAMETER CHOICES rest
        entirely on external cryptanalysis. A census of such a document returns
        all class A and says nothing useful. That object is not hypothetical; it
        is the likely E1 outcome, and the design handles it by reporting the
        class-A rows' EXTERNAL dependencies as a fourth column rather than
        declaring the document self-supporting.
    proof_obligations:
      - claim: "the declared enumeration rule produces a population two annotators agree on at kappa at least 0.7"
        responsibility: interface
      - claim: "no derivation script that returns class A consumes the asserted value as an input"
        responsibility: correctness
      - claim: "all three planted-false assertions are classified NOT-DERIVABLE"
        responsibility: feasibility
      - claim: "the five anchor rows land in their pre-registered classes"
        responsibility: baseline
      - claim: "the repetition-column row reproduces the residual +1.1 / +0.35 / +0.65 per cent with a common sign"
        responsibility: strictness
    not_applicable_reason: null

  predictions:
    - metric: "size of the enumerated assertion population under the declared rule"
      direction: higher
      minimum_effect: >-
        At least 25. Fewer than 25 means either the rule is too narrow, in which
        case it is reported as such and the census is not run, or the document
        is far more sparing than expected, which is itself the result and is
        reported with the rule that produced it.
    - metric: "number of class-C (not derivable from the document) assertions"
      direction: higher
      minimum_effect: >-
        At least 2, and the E1/E2 split is pre-registered at 15 per cent of the
        population. The t0-secrecy sentence is a forced class-C anchor; a census
        that classifies it otherwise has misapplied the rule.
    - metric: >-
        classification of the three blinded planted-FALSE assertions
      direction: different
      minimum_effect: >-
        ALL THREE must be classified NOT-DERIVABLE. Certifying any one as
        class A voids every class-A verdict in the package. This is the
        instrument-fires condition and it is checked before any genuine row is
        read.
    - metric: >-
        classification of the two blinded planted-TRUE-BUT-ABSENT assertions
      direction: different
      minimum_effect: >-
        Both must be classified as derivable-from-outside rather than as class A,
        since the document does not contain them. Certifying either as class A
        means the harness is reading its inputs from somewhere other than the
        document.
    - metric: >-
        residual of the repetition-column re-derivation against the published
        column
      direction: different
      minimum_effect: >-
        +1.1 / +0.35 / +0.65 per cent with a common sign at all three parameter
        sets, reproducing IDEA-20260805-bb52fa and IDEA-20260805-031ce2
        independently. A residual of zero would mean one of those two records is
        wrong or a convention has been found that closes the gap - either is a
        reportable outcome and the latter is the better one.
    - metric: "Cohen's kappa between two independent annotators on a 20 per cent sample"
      direction: higher
      minimum_effect: >-
        At least 0.7. Below that the population is not well defined, the rule is
        rewritten, and NO fraction from the first pass is reported.
    - metric: >-
        number of security considerations raised by the external IETF draft that
        correspond to no assertion in FIPS 204 at all
      direction: higher
      minimum_effect: >-
        At least 3, from the completeness probe. Each such item is a candidate
        the census's own rule cannot see, because the rule enumerates what the
        document SAYS and not what it OMITS, and reporting that gap is what
        keeps the census from claiming a completeness it does not have.

  minimal_test:
    design: >-
      FOUR STAGES, CHEAPEST FIRST, EACH ABLE TO TERMINATE THE LINE. TOTAL
      COMPUTE IS NEGLIGIBLE; THE COST IS READING AND SCRIPTING.
      STAGE 0 (fetch and rule freeze, TERMINATING). Freeze the enumeration rule
      and the five anchor predictions in a committed file BEFORE re-obtaining
      FIPS 204. Re-obtain it under a run record, reproducing the byte count and
      sha256 IDEA-20260805-bb52fa records. If the document cannot be obtained,
      STOP and report an infrastructure outcome.
      STAGE 1 (planted controls, before anything genuine). A second party
      constructs five planted assertions - three false, two true-but-absent -
      and interleaves them into the queue. The auditor classifies them blind.
      Score. IF ANY FALSE PLANT IS CERTIFIED CLASS A, STOP; the harness is fixed
      and the whole stage repeated with fresh plants.
      STAGE 2 (enumeration and agreement). Apply the frozen rule; two annotators
      independently classify a 20 per cent sample; compute kappa. If kappa is
      below 0.7, rewrite the rule and return to Stage 0's freeze step, recording
      that the first pass produced no reportable fraction.
      STAGE 3 (derivation and manifest). Write one script per assertion; run;
      emit the manifest with quotations, pages, classes, residuals, named
      heuristics, script hashes, consumed-constant sets, and the per-row
      circularity flag. Run the IETF-draft completeness probe as a separate
      column. Have a second party re-run the manifest end to end.
      WHAT DISCRIMINATES. Stage 1 decides whether the auditor can fail. Stage 2
      decides whether the population is a population. Stage 3's class-C count
      against the pre-registered 15 per cent separates E1 from E2, and the
      completeness probe bounds how much the rule cannot see.
    controls:
      - >-
        BLINDED PLANTED-FALSE POSITIVE CONTROL, MANDATORY, MUST FIRE. Three
        false assertions, placed by a second party, of pre-specified kinds - an
        envelope stated a factor of two too tight, a table entry with one digit
        changed, a range annotation attributed to the wrong vector. All three
        must be classified NOT-DERIVABLE. This is the answer to "has this audit
        ever been shown to trigger".
      - >-
        PLANTED-TRUE-BUT-ABSENT CONTROL. Two assertions that are true of ML-DSA
        and absent from FIPS 204. Both must be classified derivable-from-outside,
        not class A. This catches a harness that consults its own knowledge
        rather than the document.
      - >-
        CIRCULARITY FLAG, PER ROW, STATIC. No class-A derivation may consume the
        asserted value as an input. The flag is set by static inspection of the
        script and is part of the manifest, so a second party checks it without
        re-reading the standard.
      - >-
        ANCHOR FIXTURE, FIVE ROWS, PRE-REGISTERED CLASSES, RUN BEFORE THE FULL
        POPULATION. A harness that misses an anchor is fixed before the census
        proceeds and the fix is recorded.
      - >-
        TWO-ANNOTATOR AGREEMENT on a 20 per cent sample, with kappa reported and
        a hard gate at 0.7.
      - >-
        EXTERNAL COMPLETENESS PROBE against the IETF security-considerations
        draft, reported as a separate column, because the rule enumerates what
        the document says and is structurally blind to what it omits.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Record that no prior record in this corpus
        enumerates assertions as a population, as an ABSENCE and not a passed
        check.
    required_metrics:
      - the frozen enumeration rule and the five anchor predictions, committed before the fetch
      - the fetch receipt with byte count and sha256 against the recorded 2026-08-06 values
      - the planted-control scoreboard, committed before any genuine row
      - Cohen's kappa on the 20 per cent sample
      - the population size and the class-A / class-B / class-C counts and fractions
      - per row - verbatim quotation with page, class, script hash, residual, named heuristic, consumed constants, circularity flag
      - the repetition-column residual against +1.1 / +0.35 / +0.65 per cent
      - the completeness-probe column with its count of externally raised items absent from the document

  falsification_conditions:
    - >-
      Any planted-false assertion is certified class A. The census has no power;
      no class-A verdict is reportable; the outcome is an instrument statement
      under AGENTS.md rule 3 and never a statement about the standard.
    - >-
      Cohen's kappa is below 0.7. The population is ill-defined and no fraction
      is reported from that pass.
    - >-
      The population has fewer than 25 members under the frozen rule. Either the
      rule is too narrow, which is reported, or the document is unusually
      sparing, which is the result.
    - >-
      Fewer than 2 class-C assertions. The premise of RQ-MLDSA-ffa0f5's second
      half is weaker than the question record states, which is a legitimate and
      reportable outcome that would argue for narrowing the lane rather than
      widening it.
    - >-
      The repetition-column residual does not reproduce with a common sign. One
      of IDEA-20260805-bb52fa or IDEA-20260805-031ce2 is wrong, or a convention
      closes the gap; deciding which comes before anything else is written.
    - >-
      An anchor row lands outside its pre-registered class. The harness or the
      prediction is wrong; the fix is recorded and cannot be reported as a
      finding.

  confounders:
    - >-
      A CENSUS IS THE MOST COMFORTABLE DELIVERABLE IN THIS PROGRAM. It always
      produces a table, the table always reads as rigour, and nothing in it can
      fail unless the design makes it able to. Three blinded false plants, a
      per-row circularity flag, a kappa gate and an external completeness probe
      are all there for that single reason, and a census run without them is a
      fatigue report whose honest status is unverified.
    - >-
      THE RULE CAN BE TUNED TO THE ANSWER. Freezing it in a committed file
      before the document is opened is the only defence, and the design makes
      the freeze a checkable artifact rather than a promise.
    - >-
      CLASS A IS NOT THE SAME AS SOUND. An assertion can be derivable from the
      document's own constants and still rest entirely on external cryptanalysis
      that chose those constants. The consumed-constant column exists so that a
      class-A verdict cannot be read as self-sufficiency.
    - >-
      THE RULE IS BLIND TO OMISSIONS. Everything this lane most cares about
      might be a thing the document does not say at all, which no enumeration of
      what it does say can find. The IETF completeness probe bounds that blind
      spot and does not remove it, and the record must state the bound rather
      than the reassurance.
    - >-
      ONE READING OF ONE DOCUMENT. Every class in the census comes from a single
      extraction of a single PDF by a route this corpus records as fragile.
      Internal agreement among rows is not independent confirmation.

  interpretation_limits:
    - >-
      THIS RECORD MAKES CLAIMS ABOUT A DOCUMENT, NOT ABOUT MATHEMATICS. A
      class-C verdict says the document does not derive the assertion. It does
      NOT say the assertion is false, unsupported in the literature, or unwise,
      and any downstream sentence that reads that way is defective regardless of
      what the census found.
    - >-
      NOT A BREAK AND NOT A CONFORMANCE VERDICT ON ANY IMPLEMENTATION. Nothing
      here bears on MLWE, MSIS or SelfTargetMSIS in any direction and no
      signature or key is produced.
    - >-
      The population is what the frozen rule produces and nothing more. A
      completeness claim is not made, and the completeness probe measures the
      blind spot rather than closing it.
    - >-
      An E1 outcome is a closure only if it meets docs/inventor-protocol.md
      section 4 - a named obstruction, an argument and forward guidance. "We
      enumerated 27 assertions and 25 were derivable" without the enumeration
      rule, the planted-control scoreboard and the successor list is a fatigue
      report and must be labelled unverified.
    - >-
      NO STATUS CHANGE to any record is proposed or implied, and the census does
      not adjudicate any prior proposal's correctness; where it reproduces one,
      it says so, and where it disagrees, it reports the disagreement rather
      than resolving it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING FOR ANY INDIVIDUAL VERDICT. Each row's class is
        decided by a deterministic script over exactly stated inputs; no
        distributional assumption enters the classification of any assertion.
        This entry records that the record's per-row output is unconditional and
        that its only assumptions are evidentiary - that the document is
        transcribed correctly and that the rule was frozen before the reading.
      rigorous_support: >-
        Determinism of the derivation scripts; the committed-before-fetch freeze
        of the rule; the content hash of each script in the manifest.
      validation_plan: >-
        End-to-end re-run of the manifest by a second party from the hashes
        alone, plus the anchor fixture, plus the static circularity inspection
        of every class-A script.
    - id: H2
      statement: >-
        The enumerated population is representative of the document's assertions
        in the sense that the class fractions measured on it would not change
        materially under a reasonable variation of the enumeration rule - which
        is what licenses the E1/E2 split being read as a statement about the
        DOCUMENT rather than about the rule. This is a sampling assumption and
        it is the record's one genuine heuristic.
      rigorous_support: >-
        No theorem is available. The classical statement imitated is
        inter-rater reliability in content analysis, where a coding scheme is
        treated as measuring the corpus rather than the coder once agreement
        exceeds a declared threshold. The rigorous ingredient is only that the
        rule is mechanical on markers (i) and (iii) and judgemental on (ii), so
        the heuristic is confined to one of three enumeration branches.
      validation_plan: >-
        Run the census a second time under a DELIBERATELY WIDENED rule - the
        marker list extended by five further terms - on a 30 per cent sample,
        and report how the class fractions move. If the class-C fraction moves
        across the pre-registered 15 per cent split under that widening, the
        E1/E2 verdict is not robust to the rule and the record reports the
        interval rather than the verdict. Sampled parameters, both marker lists
        and both fractions are recorded; no transfer to any other standards
        document is claimed or implied.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED, and for this record the honest
      statement is stronger than usual - the deliverable is a census of a
      document, so an asymptotic framing would be meaningless rather than merely
      absent. The cost is linear in the population: one script per assertion,
      each running in milliseconds over integer arithmetic, plus one document
      read and one 20 per cent double-annotation pass. Total compute is
      negligible; total human-equivalent effort is the binding cost and it is
      the reason this record is ranked below the three measurement proposals
      filed alongside it.
    memory_exponent: >-
      Negligible - the manifest is a few hundred rows of text and the scripts
      hold at most a few dozen integers each.
    best_known: >-
      IN CORPUS - nothing enumerates assertions as a population;
      IDEA-20260805-031ce2 censuses four predicates on a different axis and is
      the nearest. EXTERNAL - the IETF security-considerations draft is the
      closest thing to a systematic external commentary on FIPS 204 known to
      this session, and it is a considerations document rather than a
      derivability audit; whether a published formal-methods or specification-
      audit paper on FIPS 204 exists was NOT searched this session and is the
      most likely route by which this record is dominated.
    hidden_overhead: >-
      The overhead that would be easiest to hide is the enumeration rule's
      judgement branch, which is where the population size is really decided.
      The kappa gate makes it visible and the widened-rule replication in H2's
      validation plan prices it. Second: this record's own central numbers are
      predictions about a document it has not read, and no amount of design
      quality changes that until Stage 0 runs.
    tradeoff_note: >-
      The trade is breadth against depth, and it is declared. Twelve prior
      proposals go deep on two assertions; this one goes shallow on at least
      twenty-five and returns a ranked successor list rather than a result about
      any single one. If E1 obtains, the breadth was the wrong purchase and the
      record says so; that possibility is exactly why it is ranked last of the
      four filed today.

  dominated_by: >-
    n/a (no attack, no cost triple, no Pareto point claimed). ROWS ACTUALLY
    CHECKED BEFORE WRITING. (i) All twelve RQ-MLDSA-ffa0f5 proposals, read in
    full or in large part this session. IDEA-20260805-031ce2 dominates this
    record ON ITS OWN FOUR ROWS - its predicate census is deeper and already
    done - and this record consumes rather than repeats it; nothing dominates on
    the population axis because no record forms a population. (ii) The sibling
    RQ-MLDSA-001, whose scope is assumption calibration and fault classes,
    neither of which the census adjudicates; where a class-C row concerns an
    assumption estimate, the census records the row and hands it off rather than
    evaluating it. (iii) The three cost axes - TIME (negligible compute; the
    binding cost is one document read), MEMORY (negligible), DATA/QUERIES (zero
    signatures, zero keys). NOT CHECKED, AND SAID SO - the external
    formal-methods and specification-audit literature on FIPS 204, which was not
    searched this session; a published machine-checked specification of ML-DSA
    would dominate the class-A half of this census outright and the record would
    reduce to the class-B and class-C rows.
  sota_delta: >-
    no attack; specification-audit and measurement contribution only.
    Quantitatively, it replaces two anecdotes with a population: a class count
    over at least 25 enumerated assertions, a pre-registered class-C fraction
    split at 15 per cent, an executable manifest with one derivation per row and
    its residual, and a planted-control scoreboard that makes the class-A rows
    mean something. Against the external state of the art the delta is a method
    applied to a document rather than an improvement to any algorithm, and no
    exponent of any hard problem moves.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    BY PART. (i) That the population exceeds 25 under a mechanically applied
    rule, about 0.8 - a standards document of this size with three enumeration
    branches will almost certainly clear it, and the residual risk is that the
    rule as frozen turns out too narrow. (ii) That at least 2 class-C rows
    survive independent classification, about 0.85 - the t0-secrecy sentence is
    close to forced and the IETF probe suggests more. (iii) That the E1/E2 split
    is robust to the widened rule, about 0.5, which is the honest weak point and
    is why H2's replication is part of the design rather than an afterthought.
    (iv) That all three planted-false rows are correctly rejected, about 0.8 -
    and if they are not, that failure is more valuable to this program than any
    census would have been, because it would show that an auditing pattern this
    program uses widely can certify a falsehood. (v) That the census as a whole
    changes what the lane does next, about 0.4 - it is a survey, its value is
    conditional on E2, and I would not rank it above the three measurement
    proposals filed alongside it.
