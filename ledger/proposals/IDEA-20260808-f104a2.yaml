idea:
  id: IDEA-20260808-f104a2
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MAYO-001
  goal_id: GOAL-MAYO-001
  title: MAYO forgery is a matrix-variable trace system tr(C_r X M_r X^T) = t_r in a k x n
    unknown matrix, not a generic quadratic system in kn scalars -- so its Macaulay matrix
    is a sum of k(k+1)/2 Kronecker blocks and its rank at each degree must fall below the
    matched random null by a computable amount
  class: representation
  claim: 'Continuing the eigenbasis of M1-01: writing the k whipped blocks as the rows of
    an unknown matrix X in F_q^{k x n}, the r-th whipped equation over the splitting field
    becomes tr(C_r X M_r X^T) = t_r, where C_r = C(theta_r) is k x k and M_r is the n x n
    polar matrix of the r-th underlying eigen-form. TWO CONSEQUENCES, BOTH MEASURABLE. (A)
    DEGREE-D MACAULAY RANK DEFICIT. Every whipped equation is built from the SAME underlying
    key through only k(k+1)/2 emulsifier slots, so the degree-D Macaulay matrix of the whipped
    system is a sum of k(k+1)/2 Kronecker-structured blocks and its rank is bounded above
    by k(k+1)/2 times the rank contributed by the underlying map''s degree-D pieces. CLAIM:
    at every degree D >= 2 the whipped system''s Macaulay rank is strictly below that of a
    uniformly random quadratic system with the same (kn, m, q, D), and the deficit is a function
    of k alone. (B) BILINEAR REMODELLING. Substituting X = U G with U in F_q^{k x k} and G
    in F_q^{k x n} makes the system BILINEAR in (U, G) at the cost of k^2 extra unknowns;
    bilinear systems have degrees of regularity governed by the bihomogeneous Hilbert series
    rather than the semi-regular one. CLAIM: the bigraded solving degree of the (U, G) system
    is strictly below the singly-graded solving degree of the original whipped system at matched
    parameters. The two claims discriminate opposite readings of the same structure: (A) says
    the structure REMOVES usable equations, which makes forgery HARDER than the random null
    and means MAYO''s direct-attack estimate is pessimistic in the defender''s favour; (B)
    says the structure ADDS a solving route, which makes forgery EASIER. Both can be true
    simultaneously and the experiment measures which dominates, in units of solving degree.'
  mechanism: 'A generic system of m quadratics in N = kn variables has, at degree D, roughly
    m * binom(N + D - 3, D - 2) independent rows in its Macaulay matrix until syzygies bite.
    The whipped system''s rows are not independent in that way: every row is a monomial multiple
    of an equation that factors through the k(k+1)/2-dimensional emulsifier slot structure,
    so the row space lies inside a subspace determined by the underlying map. This is a hard,
    countable constraint, not a heuristic. On the other side, the substitution X = U G is
    the standard route by which a quadratic form in a matrix variable becomes bilinear --
    exactly the move that support-minors modelling makes for MinRank -- and the reason it
    can pay is that bilinear systems reach a solution at a degree governed by min(k, n)-type
    bounds rather than by the semi-regular first-fall.'
  why_not_a_renamed_known_approach: 'Nearest known method: the direct/hybrid Groebner attack
    on MAYO''s whipped system, which is how MAYO''s own direct-attack level is computed, and
    Thomae-Wolf-style underdetermined solving, which exploits kn >> m by fixing variables.
    Both treat the whipped system as a generic underdetermined quadratic system in kn scalar
    variables. This record refuses that reading: the unknown is a k x n MATRIX and the equations
    are trace forms, so the natural object is the pair (row space of X, coordinates within
    it), and the natural modelling is bilinear. Nearest internal record: IDEA-20260805-977e16
    re-accounts the underdetermination ratio alpha* = kn/m and enumerates k admissible operating
    points -- it re-prices the SAME generic reading; this record changes the reading. IDEA-20260805-74e78c
    derives a slice-restricted polar-value factorisation, which is a statement about linear
    slices of the argument space, not about the Macaulay rank at degree D nor about a bilinear
    remodelling.'
  object_first:
    established_families_named_off_limits: 'Off-limits as primary lens: direct/hybrid Groebner
      on the flat kn-variable system, Thomae-Wolf/Furue underdetermined reduction, Kipnis-Shamir,
      reconciliation, intersection.'
    tracked_object: The row space of the unknown matrix X in Gr(k, n) -- i.e. the k-dimensional
      subspace of F_q^n spanned by the k whipped blocks -- with the coordinates within that
      subspace tracked separately as U.
    lossy_projection_test: 'PASSES. The projection X -> rowspace(X) discards the GL_k(F_q)
      worth of internal coordinates (k^2 log q bits) and keeps a point of Gr(k, n). It is
      lossy: |GL_k(F_q)| distinct X have the same image. It is discarded COMPATIBLY because
      the trace equations transform covariantly, tr(C X M X^T) with X -> U X becomes tr(U^T
      C U * X M X^T), i.e. the emulsifier side absorbs the discarded GL_k action exactly;
      so the retained part (the subspace) still propagates deterministically under the target''s
      operations. It is not a change of coordinates because rowspace(X) cannot reconstruct
      X.'
    survival_depth: Survives as long as the equations are trace forms with the SAME X on both
      sides, which is exactly as long as whipping reuses one underlying map. It dissolves
      if a future tweak gives each block its own underlying map (k independent keys), because
      then the covariance above fails and rowspace(X) stops propagating.
  predictions:
  - observable: rank of the degree-3 Macaulay matrix of the whipped system at toy (q, n, m,
      o, k) = (16, 10, 6, 2, 3), (16, 12, 8, 3, 4), (16, 12, 8, 3, 5)
    metric: exact rank over F_q, and the ratio to the rank of a matched random system
    predicted: 'Strictly lower for the whipped system at every cell, ratio bounded away from
      1 and DECREASING in k. Direction stated explicitly: lower, by at least 1 percent at
      k = 3 and by more at k = 5. A ratio of exactly 1 falsifies claim (A).'
  - observable: measured solving degree (first degree at which the system is solved) for the
      flat whipped system versus the bilinear (U, G) remodelling, same instances
    metric: integer solving degree, and total field operations to solution
    predicted: The bilinear remodelling reaches a solution at a strictly lower degree at every
      toy cell with k >= 3. If it does not, claim (B) is falsified and the record's honest
      conclusion is that the matrix structure is not exploitable by remodelling.
  - observable: the deficit as a function of k with (n, m, o) held fixed
    metric: rank deficit divided by matched-random rank, as a curve in k
    predicted: 'Monotone increasing in k. THIS IS THE ARTIFACT TELL: the deficit must GROW
      with the parameter that adds structure. A deficit that is constant in k is the signature
      of a measurement artifact and must be reported as such rather than as a finding.'
  minimal_test: 'Toy, exact linear algebra, no solver heuristics. Build matched pairs at (q,
    n, m, o, k) in {(16,10,6,2,3), (16,10,6,2,5), (16,12,8,3,4), (16,12,8,3,6)}: arm A is
    a genuine MAYO-shaped whipped key; arm B is a uniformly random system of m quadratics
    in kn variables over F_q. Compute the exact rank of the degree-3 Macaulay matrix for both,
    then the degree-4 rank if degree 3 is uninformative. Separately, on arm A only, run the
    flat system and the (U, G) bilinear remodelling to solution and record the solving degree
    and operation count for each. Everything is exact F_q linear algebra; no floating point,
    no timing-based inference.'
  controls:
  - MATCHED RANDOM NULL at identical (kn, m, q, D) -- the primary control, run first.
  - 'PLANTED-STRUCTURE NULL: a random system of m quadratics in kn variables constructed to
    vanish on a random ko-dimensional subspace (so it has the same isotropy as the whipped
    system) but with NO emulsifier structure. This separates "deficit caused by whipping"
    from "deficit caused by having a big totally isotropic subspace".'
  - 'k = 1 CONTROL: at k = 1 the whipped system IS the underlying UOV system and the deficit
    must be zero relative to a matched random system with a planted oil space. Nonzero deficit
    at k = 1 is a bug.'
  - 'SEED CONTROL: 20 independent seeds per cell, report the full distribution of the rank
    deficit rather than one number, since Macaulay ranks over small fields fluctuate.'
  confounders:
  - 'Small-field rank fluctuation: over F_16 at toy sizes, random Macaulay ranks are not deterministic
    and a 1 percent deficit may be within the noise band. The 20-seed distribution and a stated
    significance rule fix this in advance.'
  - The degree-3 Macaulay matrix may already be full rank for both arms at small toy sizes,
    making the measurement vacuous. The pre-registered escape is to move to degree 4 and to
    increase kn until neither arm is saturated.
  - The (U, G) remodelling adds k^2 variables, so a lower solving degree does not by itself
    mean lower total cost; operation count must be reported alongside degree, and a lower
    degree with a higher cost is a negative result for claim (B).
  - Toy k values (3-6) may not reach the regime of the published k (RECALLED 4-12), and the
    deficit curve's shape may not extrapolate. Stated as a limit, not designed away.
  falsification_conditions:
  - Whipped and matched-random Macaulay ranks agree within the seed-noise band at every cell
    and every degree tested. Claim (A) dies.
  - The planted-structure null shows the same deficit as the whipped arm. Then the deficit
    is caused by the isotropic subspace, not by whipping, and the record's conclusion is a
    controlled null -- the correct outcome to report.
  - The bilinear remodelling's solving degree is greater than or equal to the flat system's
    at every cell. Claim (B) dies.
  - The deficit fails to grow with k. Under the inventor protocol's artifact tell this is
    recorded as evidence the measurement is broken, not as evidence about MAYO.
  interpretation_limits: Everything measured here is toy-scale and is reported as toy-scale
    (AGENTS.md rule 7). A Macaulay rank deficit at (kn, m) around 50 x 8 says nothing directly
    about 594 x 78. The deliverable is the SHAPE of the deficit as a function of k and its
    separation from the two nulls, not an extrapolated attack cost. No forgery is claimed.
  assumptions:
  - The whipped map has the bilinear-in-polar-values form used in M1-01 (definitional).
  - Exact F_q linear algebra is available at the toy sizes (it is; these are small matrices).
  - MAYO's published k lies in a range where the toy trend is at least qualitatively relevant.
  heuristic_assumptions:
  - id: HA-1
    statement: For a uniformly random system of m quadratic forms in N variables over F_q
      with m << binom(N+1, 2), the degree-D Macaulay matrix has rank equal to the semi-regular
      prediction min(m * binom(N + D - 3, D - 2), binom(N + D - 1, D)) minus the Koszul syzygy
      correction, up to a fluctuation of O(sqrt(rank)) over F_q.
    rigorous_ingredient: The Macaulay-matrix rank is bounded above by the semi-regular count
      exactly (the count is a dimension of a space of rows), so only the lower bound is heuristic.
      Fro"berg's conjecture supplies the equality in the generic case and is proven in several
      ranges.
    distribution_imitated: '"A random system behaves like a semi-regular sequence" -- the
      standard Fro"berg / Bardet-Faugere-Salvy model.'
    validation_route: Compute exact degree-3 and degree-4 Macaulay ranks for 200 uniformly
      random systems at each toy (N, m, q) and compare the empirical distribution against
      the semi-regular prediction. TOY SCALE, explicitly. Report the empirical fluctuation
      band; that band IS the significance rule for the main measurement.
    tail_checks: Record the minimum observed random rank across all 200 samples. If the whipped
      arm's rank is not below that minimum, the claimed deficit is inside the null's own tail
      and must not be reported as a finding.
  - id: HA-2
    statement: The bigraded Hilbert series of a generic bilinear system of m equations in
      (k^2, kn) bidegree-(1,1) variables predicts its solving degree, uniformly for k >= 3
      and n >= 3k.
    rigorous_ingredient: Faug`ere-Safey el Din-Spaenlehauer's bounds for bilinear systems
      give the degree of regularity of a generic bilinear system as min(n_x, n_y) + 1-type
      expressions, proven for generic bilinear systems.
    distribution_imitated: '"The remodelled system behaves like a generic bilinear system
      of its bidegree" -- the same imitation support-minors modelling makes for MinRank.'
    validation_route: 'Compare the measured solving degree of the (U, G) system against the
      bigraded prediction at every toy cell, and against the SAME prediction applied to a
      random bilinear system of matched bidegree. TOY SCALE. Two-sided: a measured degree
      below the generic bilinear prediction means the whipped structure helps beyond bilinearity;
      above means the remodelling is worse than generic.'
    tail_checks: Across 20 seeds per cell, check that the measured degree is constant (bilinear
      solving degrees are usually rigid); seed-dependence indicates the instance is not in
      the generic regime and the prediction does not apply.
  target_complexity:
    time_exponent: No attack claimed. If claim (B) holds at scale, the direct-attack cost
      on MAYO's whipped system would move from binom(kn + d_flat, d_flat)^{omega} to the bigraded
      cost of the (U, G) system, i.e. from a singly-graded solving degree d_flat to a bigraded
      d_bi; the exponent moved is the SOLVING DEGREE, and the delta must be reported as (d_flat
      - d_bi) in the exponent of binom(kn + d, d).
    memory_exponent: 'Equal to the Macaulay matrix size in both readings: binom(kn + d, d)
      field elements. Memory is the binding cost for both and must be charged at parity; this
      record does not propose a low-memory variant.'
    best_known_baseline: MAYO's own direct-attack estimate on the whipped system (RECALLED
      as a hybrid/Groebner cost; must be read from the spec), and IDEA-20260805-977e16's re-accounting
      of the same.
    hidden_overhead_disclosure: The bigraded prediction hides the standard "generic bilinear"
      assumption, which is precisely what a structured instance may violate; and the k^2 added
      variables are a real cost that a solving-degree comparison alone conceals.
    time_memory_tradeoff: The hybrid variant (fix j of the kn variables, solve the rest) interpolates
      for both readings; the correct comparison fixes j and compares at matched j, which the
      experiment does by reporting operation counts rather than degrees alone.
  sota_delta: No attack, no delta yet. The measurable delta is stated as a solving-degree
    difference at toy parameters with two matched nulls, and the record commits in advance
    to reporting a zero delta as the result rather than raising the degree until something
    moves.
  dominated_by: 'As an attack: dominated by MAYO''s published direct-attack cost, since no
    cost below it is claimed. As an instrument: nothing in the corpus measures Macaulay rank
    deficit of a whipped system against BOTH a random null and a planted-isotropy null. Frontier
    rows checked: MAYO direct/hybrid (time, memory), Thomae-Wolf underdetermined reduction
    (time), IDEA-20260805-977e16 (time), IDEA-20260805-74e78c (equation count), IDEA-20260801-013
    (toy comparison, no rank object), IDEA-20260805-258212 (parameter identities, no measurement).
    Undominated as an instrument, dominated as an attack.'
  estimated_cost: 'Implementation medium: a Macaulay-matrix builder over F_q, a bilinear remodeller,
    and the two null generators. Compute medium: exact ranks at degree 3-4 on systems with
    kn up to ~70 variables are seconds to minutes each, times 4 cells times 3 arms times 20
    seeds.'
  recommended_priority: medium
  honest_prior_of_survival: 'Claim (A) surviving as a measurable, k-growing deficit: ~0.55
    -- the counting argument is sound but the deficit may be swamped by the planted-isotropy
    null, which would make it a controlled null rather than a finding. Claim (B) surviving:
    ~0.3 -- bilinear remodelling through an over-parameterisation often loses more to the
    added variables than it gains in degree. Probability the record yields a usable instrument
    regardless: ~0.85.'
  novelty_status: unverified
  novelty_screen: Same corpus screen as M1-01, plus reading IDEA-20260805-977e16's title/class
    head and IDEA-20260805-74e78c lines 1-80 in full. No corpus record contains a matrix-variable
    trace formulation of MAYO or a Macaulay-rank-deficit measurement of a whipped system.
    WEB NOT CHECKED (tooling failed).
  discriminated_from: 'IDEA-20260805-977e16: re-prices the same generic flat system by choosing
    among k operating points; makes no claim about Macaulay rank and proposes no remodelling.
    IDEA-20260805-74e78c: linear-slice polar factorisation, equation-count consequence. IDEA-20260801-013:
    toy whipped-vs-plain comparison without a named algebraic observable. M1-01 (this slice):
    same eigenbasis, different question -- M1-01 asks whether a low-rank element EXISTS, M1-02
    asks what the structure does to the SOLVING process regardless.'
  source_refs:
  - MAYO specification -- REQUIRED READ, NOT YET READ.
  - Faug`ere, Safey el Din, Spaenlehauer, "Groebner bases of bihomogeneous ideals generated
    by polynomials of bidegree (1,1)" -- RECALLED, exact statement to be confirmed; this is
    the source of the bigraded degree-of-regularity prediction used in HA-2.
  - KN-TECH-011, KN-TECH-004 (internal: solving degree, first-fall degree, F4/F5).
  proof_search_map:
    bottleneck: The solving degree of MAYO's whipped forgery system. It is the sole quantity
      in MAYO's direct-attack cost that is not fixed by parameter counting.
    baseline_embedding:
      parameter_slice: 'k = 1: the whipped system degenerates to the underlying UOV system
        and the bilinear remodelling degenerates to a scalar rescaling. Both claims must return
        "no deficit, no gain" there.'
      reproduction_check: 'Frozen fixture: a k = 1 instance whose Macaulay rank at degree
        3 must equal that of the planted-isotropy null within the seed band.'
    observation_collision:
      observable: Macaulay rank at degree D, and measured solving degree.
      distinct_preimage_search: 'COLLISION FOUND IN ADVANCE, and it is the reason the second
        null exists: a random system with a planted ko-dimensional isotropic subspace and
        a genuine whipped system can share the same degree-3 Macaulay rank. The planted-isotropy
        null is the additional condition that separates them; without it the observable is
        not identifying.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: The unknown as a k x n matrix X with trace-form equations, and the
        factorisation X = U G moving the hypothesis into an exact bidegree condition.
      predicted_gain: Solving degree governed by the bigraded rather than the singly-graded
        Hilbert series.
    - transform: observable_fiber
      proposed_object: Hold the Macaulay rank fixed and vary the hidden structure (whipped
        vs planted isotropy vs random) to find an intrinsic invariant that separates the fibre.
      predicted_gain: Either a separating invariant, or the honest conclusion that Macaulay
        rank does not see whipping.
    quantifier_order: FORALL toy cells in the declared set, THERE EXISTS a seed-independent
      gap between the whipped arm's degree-D Macaulay rank and BOTH nulls' ranks. Note that
      the gap is allowed to depend on the cell; no uniform-in-(n, m, k) law is claimed.
    method_ceiling:
      strongest_certifiable_claim: '"At the tested toy parameters the whipped system''s degree-D
        Macaulay rank differs from both nulls by X, and its bigraded solving degree is Y."
        It cannot certify anything about published parameters.'
      nearby_object_control: A whipped system built from k INDEPENDENT underlying keys (one
        per block). There the rank-deficit mechanism must vanish, since the deficit's cause
        is key reuse. A method that still reports a deficit there has not identified the load-bearing
        structure.
    proof_obligations:
    - claim: The whipped Macaulay row space lies in the stated Kronecker-structured subspace.
      responsibility: correctness
    - claim: The deficit grows with k.
      responsibility: strictness
    - claim: The bigraded prediction applies to the remodelled system.
      responsibility: feasibility
    - claim: Operation counts, not degrees alone, decide claim (B).
      responsibility: runtime
    - claim: Toy results do not transfer to published parameters.
      responsibility: scope
    not_applicable_reason: null
