idea:
  id: IDEA-20260809-ac5947
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    Run the tradeoff attack at the recommended parameters and report the achieved
    reduction as a computation-memory pair, not a factor
  class: algorithm
  claim: >-
    The published tradeoff attacks against data-independent memory-hard functions
    are usually stated asymptotically. The claim is that implementing the attack
    and running it at the RFC's recommended parameter sets gives a concrete
    achieved reduction, that the reduction is best expressed as a
    (computation, memory) pair rather than a single AT factor, and that the pair
    reveals a tradeoff shape a single factor hides.
  mechanism: >-
    Implement the ranking-based strategy: store a subset of blocks, recompute the
    rest on demand using the graph structure from IDEA-20260809-a915ea, and
    measure the resulting computation increase and memory decrease against the
    honest evaluation.
  why_not_a_renamed_known_approach: >-
    The attack is published. Running it at standardized parameters with per-pair
    reporting, on the same harness as the graph measurement, is the contribution —
    and it is the only way to say what the recommendation actually buys.
  predictions:
  - observable: achieved (computation, memory) pairs at recommended parameters
    metric: pair per storage fraction
    predicted: A curve rather than a point, with memory falling faster than computation rises over part of the range; the region where that holds is where the attack pays.
  - observable: achieved AT reduction at the best point
    metric: factor
    predicted: >-
      Greater than one for the data-independent variant and near one for the
      data-dependent one. No reduction anywhere would falsify the transfer of the
      published attack to these parameters and is worth knowing.
  minimal_test: >-
    Implement the attack, sweep the storage fraction at one recommended parameter
    set per variant, and report the pair curve plus the best AT factor with the
    machine model declared.
  controls:
  - 'CORRECTNESS CONTROL: the attacked evaluation must produce the same output as the honest one on every trial; an attack that computes a different function is not an attack.'
  - 'HONEST-BASELINE-IN-RUN: the honest evaluation is measured in the same run on the same machine.'
  falsification_conditions:
  - The attacked evaluation produces incorrect outputs.
  - No storage fraction yields an AT reduction, contradicting the published transfer.
  interpretation_limits: >-
    Measured on one machine with one implementation quality; constant factors may
    reflect engineering effort rather than the design, and no parameter set is
    declared unsafe.
  sota_delta: 'No new attack. Delta: concrete pairs at standardized parameters where the literature gives asymptotic factors.'
  dominated_by: Externally dominated by the original attack papers, stated plainly. Downstream of IDEA-20260809-a915ea.
  estimated_cost: Implementation medium; compute high at recommended memory sizes.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep: no memory-hard-function records. WEB NOT CHECKED.'
  source_refs:
  - Tradeoff-attack references for data-independent memory-hard functions -- RECALLED, REQUIRED READS.
