idea:
  id: IDEA-20260906-dfdeee
  question_id: RQ-MLKEM-001
  added: '2026-09-06'
  title: >-
    The negacyclic rotation group gives the PRIMAL attack 2n = 512 BDD targets
    inside ONE lattice under ONE reduced basis, at the cost of 512 lifts and
    zero extra reduction - an M that is algebraically free, unlike the
    deployment-limited M of IDEA-20260814-10e5e1. Whether that M behaves like
    512 independent draws or like one is decided by an exact conservation law
    nobody in this lane has written down: the orbit sum of the projected error
    energy equals tr(P C_e), the trace of the basis tail projector against the
    NEGACYCLIC AUTOCORRELATION matrix of the error. Measure M_eff
  class: composition

  claim: >-
    (A) THE FREE TARGETS, AND WHY THEY ARE FREE. The ML-KEM primal instance is a
    BDD problem: the q-ary module lattice L generated by A over R_q = Z_q[X] /
    (X^256 + 1), with target b = A s + e. Multiplication by X is an ISOMETRY OF
    L, because A (X s) = X (A s), so L is X-invariant while the target moves:
    X^i b = A (X^i s) + X^i e for i = 0 .. 2n-1, where n = 256 and X^n = -1
    gives 2n = 512 distinct signed rotations. Each X^i b is a DIFFERENT BDD
    target in the SAME lattice with an error of the SAME norm. An attacker
    therefore reduces ONE basis - the exponential cost, 2^{0.292 beta} - and
    then runs the lifting step (Babai, or pruned enumeration in the last block)
    2n times, at polynomial cost. Success on ANY rotation recovers X^i s, and s
    follows by multiplying back by X^{-i}. So M = 512 is available for free, in
    the strict sense that the dominant cost term does not change.
    (B) WHY THIS IS NOT AUTOMATICALLY A GAIN, AND WHERE THE REAL QUESTION IS.
    The 2n targets are deterministically related, so the naive fear is that they
    all succeed or all fail together. They do not: the reduced basis B is NOT
    X-adapted - reduction breaks the symmetry - so lifting X^i b tests the SAME
    error vector against 2n DIFFERENT rotated Gram-Schmidt frames, and the
    outcomes differ. But they are not independent either, and the exact
    constraint is computable. Writing P for the orthogonal projector onto the
    last-beta block of the reduced basis, the orbit sum obeys
    sum_{i=0}^{2n-1} ||P X^i e||^2 = tr(P C_e), where
    C_e = sum_i (X^i e)(X^i e)^T is the NEGACYCLIC AUTOCORRELATION MATRIX of e,
    a matrix in the negacyclic algebra with tr(C_e) = 2n ||e||^2 exactly. The
    orbit's mean projected energy is therefore PINNED by the alignment of the
    reduced basis's tail projector with the negacyclic Fourier eigenbasis of e,
    not free. THE CLAIM: the orbit-minimum of the projected-error ratio behaves
    like the minimum of M_eff independent draws from the
    Beta(beta/2, (d-beta)/2) law that this program has already adopted for this
    exact quantity (IDEA-20260805-3d71ca H1), with M_eff a measurable number
    strictly between 1 and 512, and M_eff is determined by the spectral
    alignment above rather than by the orbit size.
    (C) WHAT DISCRIMINATES, AND BOTH OUTCOMES CLOSE SOMETHING. EXPLANATION A,
    NEAR-INDEPENDENT ORBIT - M_eff is within a factor of four of 512; then the
    primal attack has an algebraically free best-of-512 selection that no cost
    model in this program charges, its blocksize saving follows immediately from
    H-MLKEM-dc51f5 Part C's GAIN(u) balance functional evaluated at M = M_eff,
    and the ring gives the PRIMAL attack a discount of the same kind
    KN-LIT-7663 and KN-LIT-7667 report for the HYBRID attack. EXPLANATION B,
    THROTTLED ORBIT - M_eff is O(1); then the conservation law is binding, the
    primal-side isometry lane closes with a MECHANISM rather than a fatigue
    report (namely: the orbit cannot buy independence it does not have, because
    its total projected energy is pinned by tr(P C_e)), and that closure extends
    the operation-DAG ceiling IDEA-20260805-690de8 established on the dual side
    to the primal side by a completely different argument.
    (D) WHAT IS NOT CLAIMED. No exponent change: the best case here is a
    blocksize saving of order log2(512) divided by a slope, which is bits, not
    exponents, and the record says so up front. No claim that the rotation trick
    is unknown - the dual-side version of the same identity is already in this
    corpus (IDEA-20260805-690de8), and the primal-side version may well be
    folklore. No claim about ML-KEM's security level. No status change to any
    committed record.

  mechanism: >-
    STAGE 0, THE ALGEBRAIC CHECK, ZERO COMPUTE, AND IT CAN KILL THE RECORD.
    Verify symbolically, at small n, three statements: (i) X-invariance of the
    q-ary module lattice built from an R_q-matrix; (ii) that X^i b is the BDD
    target of the instance with secret X^i s and error X^i e; (iii) the orbit
    identity sum_i ||P X^i e||^2 = tr(P C_e) with tr(C_e) = 2n ||e||^2. All
    three are one-line linear algebra and any of them failing ends the record.
    Do this in exact arithmetic at n = 4, 8, 16 before any lattice is reduced.
    STAGE 1, THE ORBIT ORDER STATISTIC AT REDUCED DIMENSION. On ML-KEM-shaped
    q-ary module lattices at d in {96, 128, 160} with ring degree n = d / (2k)
    and k = 2, reduce ONE basis per instance with a frozen, CONTENT-PINNED BKZ
    strategies file at beta in {25, 35, 45}, then compute for that single basis
    the 2n values R_i = ||P X^i e||^2 / ||e||^2. Record the whole orbit, not
    just its minimum, because the shape of the orbit distribution is what
    separates the two explanations. Repeat over at least 200 independent
    instances per cell.
    STAGE 2, FIT M_eff. For each cell, fit M_eff by matching the empirical
    distribution of min_i R_i against the minimum of M i.i.d.
    Beta(beta/2, (d-beta)/2) draws, by maximum likelihood over M treated as a
    continuous parameter. Report M_eff with a confidence interval and beside it
    the ratio M_eff / 2n. Also report the empirical orbit sum against tr(P C_e)
    computed directly - a forced identity the data must satisfy exactly, which
    doubles as the harness check.
    STAGE 3, THE SPECTRAL EXPLANATION. Decompose C_e in the negacyclic Fourier
    basis and compute the alignment coefficients of P against it. The prediction
    is that M_eff is a decreasing function of alignment - that a tail projector
    close to a span of negacyclic Fourier directions throttles the orbit, while
    a generic one does not. This is the mechanism half of the record and it is
    what makes the result transferable to FIPS 203 dimensions as an argument
    rather than as an extrapolated number.
    STAGE 4, THE BIT CONVERSION, USING THIS PROGRAM'S OWN MACHINERY AND NOT A
    NEW ONE. Feed M_eff into H-MLKEM-dc51f5 Part C's balance functional
    GAIN(u) = (c_T gamma / 2) u + log2 p(u), with p(u) the Beta order statistic
    that IDEA-20260805-3d71ca supplies for this exact projected-error object,
    and report the implied blocksize saving dbeta and the implied bit saving
    0.292 dbeta at each FIPS 203 parameter set, with the f''-curvature
    sensitivity table that GOAL-MLKEM-005's C1 criterion requires. State
    explicitly that this conversion is an extrapolation from d <= 160 to
    d >= 1000 and carries every transfer assumption H2 lists.

