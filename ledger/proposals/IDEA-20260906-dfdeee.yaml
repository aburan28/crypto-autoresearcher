  assumptions:
    - >-
      The ML-KEM primal lattice is X-invariant and the rotated targets are valid
      BDD targets with equal-norm errors. Checked symbolically at Stage 0; if it
      fails the record ends there.
    - >-
      The lifting step's cost is polynomial relative to the reduction, so 2n
      lifts do not change the dominant cost term. At beta near 400-900 and
      2n = 512 this is generous but must be stated; if the lifting step is a
      pruned enumeration in the last block rather than plain Babai, the 512
      repetitions are NOT free and the record must recost them.
    - >-
      Success of the attack on rotation i is determined by the projected-error
      condition the Beta law describes. This is the same modelling assumption
      IDEA-20260805-3d71ca and EXP-MLKEM-42ea04 already carry, and this record
      inherits it rather than re-deriving it.
    - >-
      The reduced basis is not X-adapted. If a reduction procedure happened to
      produce an X-invariant basis, the orbit would collapse to a single
      outcome; the record must check this rather than assume it, and the check
      is cheap (compare B with X B up to unimodular equivalence).
    - >-
      No cell of any experiment reports or depends on a BKZ tour count, and
      every cell pins its strategies file BY CONTENT HASH - because this program
      has measured that a path-pinned strategies file silently changed a d = 64
      reduction from 9 tours to 26, that svp_preprocessing recurses into
      self.tour without opening a context so a per-call tour count is wrong from
      block size 46 up, and that tour count to completion is not derivable from
      what the instrument currently records.

  predictions:
    - metric: >-
        M_eff, the fitted effective independent sample size of the 2n-point
        rotation orbit, at each (d, beta) cell
      direction: different
      minimum_effect: >-
        The two explanations separate at M_eff = 2n / 4 = 128. Above it,
        near-independent orbit; below about 4, throttled orbit. Anything in
        between is reported as the measured value with its interval and the lane
        is characterised rather than closed.
    - metric: >-
        ratio of the empirical orbit minimum's mean to the mean minimum of 2n
        i.i.d. Beta draws (NULL-IID), per cell
      direction: higher
      minimum_effect: >-
        1.0 means the orbit is as good as independence. A ratio above 1.05 is
        evidence of throttling and is the direction the conservation law
        predicts.
    - metric: >-
        agreement between the orbit statistic and NULL-ORTH, measured by a
        two-sample Kolmogorov-Smirnov statistic on the minima
      direction: different
      minimum_effect: >-
        If the orbit and NULL-ORTH agree while both differ from NULL-IID, the
        effect is generic to isometric images and NOT a ring effect, which
        refutes this record's framing while leaving the measurement useful.
    - metric: >-
        implied blocksize saving dbeta at FIPS 203 parameters from GAIN(u)
        evaluated at M = M_eff, with its f''-curvature sensitivity band
      direction: higher
      minimum_effect: >-
        The lane's own materiality bar, declared by IDEA-20260722-001 and reused
        by IDEA-20260805-690de8, is 2 bits, i.e. dbeta of about 6.85 at
        c_T = 0.292. Below that the result is a characterisation, not a
        discount, and must be reported as one.

  minimal_test:
    design: >-
      STAGE 0 PLUS ONE CELL OF STAGE 1 IS THE MINIMAL DISCRIMINATOR. Stage 0 is
      exact symbolic linear algebra at n = 4, 8, 16 and costs minutes; it
      verifies X-invariance, the rotated-target identity, and the conservation
      identity, and any failure ends the record before a single lattice is
      reduced. Then ONE cell - d = 128, beta = 35, k = 2, 200 instances, one
      frozen content-pinned reduction per instance, 2n = 128 rotations per
      instance - suffices to fit M_eff with a usable interval and to run
      NULL-IID and NULL-ORTH on the same bases at no extra reduction cost, since
      all three share the reduction. This is deliberately far below the
      dimensions where this program's instrument has failed: a d = 512 /
      beta = 55 / mpfr = 100 cell ran at least 14448 s without completing, so no
      cell here goes above d = 160, no cell needs a tour count, and every cell
      pins its strategies file by content hash.
    controls:
      - NULL-IID, 2n independent fresh errors through the same basis - the independence endpoint.
      - NULL-ORTH, 2n random orthogonal images - separates ring from generic isometry, and is the decisive control.
      - NULL-RING, the ring-deleted unstructured lattice, which must return not-applicable rather than a number.
      - NULL-SUM, the conservation anchor - measured orbit sum must equal tr(P C_e) exactly.
      - NULL-BETA, the marginal anchor against IDEA-20260805-3d71ca H1 and EXP-MLKEM-42ea04.
      - Basis-symmetry check - confirm the reduced basis is not X-adapted, which would collapse the orbit trivially.
    required_metrics:
      - fitted M_eff with confidence interval, per (d, beta, k) cell
      - full orbit distribution of R_i, not only its minimum, per instance
      - measured orbit sum against tr(P C_e), per instance, as an exact residual
      - Kolmogorov-Smirnov statistics of orbit minima against NULL-IID and against NULL-ORTH
      - spectral alignment coefficients of P against the negacyclic Fourier basis of C_e
      - implied dbeta and bit saving at FIPS 203 parameters, with the f'' sensitivity table and the transfer assumptions named
      - content hash of the BKZ strategies file used in every cell

  falsification_conditions:
    - >-
      If Stage 0's symbolic checks fail - if the lattice is not X-invariant in
      the formulation used, or if the conservation identity does not hold - the
      record is REFUTED before any lattice work, at a cost of minutes.
    - >-
      If M_eff is measured at O(1) across all cells, the free-M gain is refuted
      and the primal isometry lane closes WITH A MECHANISM (the orbit's
      projected energy is pinned by tr(P C_e), so its minimum cannot behave like
      an independent sample), which is a first-class deliverable under
      docs/inventor-protocol.md section 4 and is the outcome I consider more
      likely.
    - >-
      If NULL-ORTH matches the orbit while both differ from NULL-IID, the effect
      is not a ring effect and this record's framing is refuted; the correct
      report is that isometric images of one error are correlated through a
      fixed basis for reasons having nothing to do with the cyclotomic
      structure.
    - >-
      If the implied dbeta is below the lane's declared 2-bit materiality bar
      even at the near-independence endpoint M_eff = 2n, then the whole lane is
      foreclosed by arithmetic regardless of the measurement, and the record
      should be closed on that ground rather than run. THIS CHECK IS FREE AND
      MUST BE DONE FIRST.
    - >-
      If the lifting step at ML-KEM blocksizes is a pruned enumeration whose
      512-fold repetition is NOT polynomially negligible against the reduction,
      the "free" premise fails and the gain must be recosted net of that, which
      may well erase it.

  confounders:
    - >-
      The reduced basis is shared across the whole orbit BY DESIGN, so the 2n
      samples are correlated through the basis as well as through the group.
      NULL-IID uses the same basis precisely to hold that constant; without it,
      a basis effect would be misread as an orbit effect.
    - >-
      The step-function question. If the primal attack's success is effectively
      deterministic at the operative blocksize (IDEA-20260829-247e35's subject),
      a best-of-M gain is real but invisible to every cost model in this lane,
      and a positive M_eff would then have no cost consequence. This is a
      confounder for the BIT CONVERSION, not for the measurement.
    - >-
      The Beta law itself is contested at the tail in this program
      (IDEA-20260808-90632c on CBD excess kurtosis, IDEA-20260814-8f8f45 on the
      order-statistic floor, IDEA-20260831-ae480e on left-tail fattening). A
      fitted M_eff inherits every one of those disputes, since the fit is
      against the Beta order statistic. NULL-BETA exists to make that inheritance
      visible rather than silent.
    - >-
      Small ring degree at reduced dimension. At d = 128 with k = 2 the ring
      degree is 32 and the orbit is 64, not 512; the fitted M_eff must therefore
      be reported as a RATIO to the orbit size, and the extrapolation to 512
      assumes the ratio is degree-stable, which Stage 3's spectral argument is
      supposed to justify and may not.
    - >-
      Fitting M as a continuous parameter of an order statistic is unstable in
      the far tail, where the data are thinnest and exactly where the attack
      lives. The record must report the fit's sensitivity to the tail cut and
      must not quote an M_eff derived only from the extreme order statistic.

  interpretation_limits:
    - >-
      Toy tier. Every measured number is at d <= 160 and transfers to FIPS 203
      dimensions by assumption only; the SPECTRAL ARGUMENT of Stage 3 is the
      only part intended to transfer, and it transfers as an argument, not as a
      number.
    - >-
      The best possible outcome is a blocksize saving of a few bits, not an
      exponent change. Against docs/target-result-profile.md this is explicitly
      NON-target-class, and the record's justification for existing is that it
      is a cheap building block that either supplies a free multiplier to every
      primal cost in the lane or closes a symmetry lane with a mechanism.
    - >-
      No claim is made about ML-KEM's security level, about any category, or
      about whether the ring helps overall. KN-OPEN-026 records the ring
      discount at 1-3 bits from two external mechanisms and this record is a
      third, independent question that may compose with them or overlap them;
      which of those it does is not determined here.
    - >-
      If IDEA-20260829-db9f2b's module Kannan route succeeds, this record is
      likely superseded and should be re-read as a special case rather than
      defended.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a BKZ-reduced basis of an ML-KEM-shaped q-ary module lattice of
        dimension d with last block of size beta, and for e drawn from the
        CBD(eta) law, the marginal law of R_i = ||P X^i e||^2 / ||e||^2 is
        Beta(beta/2, (d - beta)/2) up to the corrections this program has
        already measured, uniformly over i in [0, 2n) and over the cells
        d in {96, 128, 160}, beta in {25, 35, 45}.
      rigorous_support: >-
        Rigorous for a uniformly random direction in R^d and a fixed
        beta-dimensional subspace: the squared projection ratio is exactly
        Beta(beta/2, (d-beta)/2). The heuristic is that a CBD error behaves like
        a uniformly random direction with respect to a BKZ-reduced basis's tail
        projector - the same assumption IDEA-20260805-3d71ca H1 already adopts
        and EXP-MLKEM-42ea04 already tests, and which IDEA-20260808-90632c
        predicts fails specifically through CBD's excess kurtosis where the tail
        block is coordinate-aligned. This record does not re-litigate that; it
        inherits the law and its known failure mode.
      validation_plan: >-
        Sample: 200 instances per (d, beta) cell, 2n rotations each, giving at
        least 12800 marginal observations per cell. Compare the pooled empirical
        CDF of R_i against the Beta CDF by Kolmogorov-Smirnov and by a
        quantile-quantile plot restricted to the lower decile, which is the
        region the attack uses. Tail check: the smallest observed R across the
        cell must be consistent with the Beta minimum-order-statistic
        probability for the total sample count, in the same style
        docs/target-result-profile.md A7 prescribes. Cross-check against
        EXP-MLKEM-42ea04's committed measurements at whatever cells overlap;
        disagreement is reported and resolved in that record's favour, since it
        is the frozen contract. Transfer assumption, explicit: agreement at
        d <= 160 is transferred to FIPS 203 dimensions by assumption only, and
        every downstream bit figure carries that label.
    - id: H2
      statement: >-
        The orbit minimum min_i R_i is distributed as the minimum of M_eff
        i.i.d. draws from the H1 law, with M_eff = 2n * phi(alpha) where alpha
        is the spectral alignment of the tail projector P with the negacyclic
        Fourier eigenbasis of C_e, and phi is a decreasing function with
        phi(0) = 1 (generic projector, full independence) and phi(1) = 1 / (2n)
        (perfectly aligned projector, complete throttling). Uniformity claimed
        only over the tested cells.
      rigorous_support: >-
        The rigorous ingredient is the exact conservation identity
        sum_i ||P X^i e||^2 = tr(P C_e) with tr(C_e) = 2n ||e||^2, which pins
        the orbit's first moment and therefore bounds how many of the 2n values
        can be simultaneously small - this is an exact linear-algebraic
        constraint, not an assumption, and it plays the role the rigorous size
        bound plays in the exemplar profile. The classical distribution
        statement it is composed with is the extreme-value law for the minimum
        of M i.i.d. Beta variates. What is HEURISTIC is the existence of a
        single scalar alignment parameter alpha summarising the interaction, and
        the functional form of phi; both are proposed as fitted objects, not
        derived ones, and the record says so.
      validation_plan: >-
        Sample: the same 200 instances per cell, with alpha computed directly
        from the eigendecomposition of C_e and the projector P. Fit phi
        nonparametrically against alpha across cells and test monotonicity by a
        rank correlation. Compare the fitted M_eff against the two forced
        endpoints - NULL-IID must fit M_eff = 2n within its interval, and a
        deliberately constructed X-adapted basis must fit M_eff = 1, a case that
        can be built exactly by reducing with an X-equivariant procedure and
        which serves as the phi(1) anchor. Tail check: the fitted M_eff must
        reproduce the observed frequency of orbit minima below the first
        percentile of the marginal law, computed independently of the fit.
        Transfer assumption, explicit: alpha is a property of the reduction
        procedure and the dimension, so its FIPS 203 value is unmeasured and the
        record must not extrapolate M_eff without measuring alpha at a
        dimension where reduction is feasible and arguing its scaling
        separately.

  target_complexity:
    time_exponent: >-
      2^{c_T (beta - dbeta)} against the baseline 2^{c_T beta}, with
      c_T = 0.292 as this lane pins it, and dbeta derived from M_eff through the
      GAIN(u) balance. THIS IS EXPLICITLY NOT AN EXPONENT MOVE: dbeta is O(1) in
      the security parameter, bounded above by log2(2n) divided by the local
      slope of the success probability in beta, so the best conceivable outcome
      is a constant additive shift in the exponent's argument - a bit-level
      discount, in the class docs/target-result-profile.md A1 calls
      cofactor-level and explicitly non-target-class. It is proposed as a
      building block and as a lane closure, and it is ranked accordingly.
    memory_exponent: >-
      Unchanged, 2^{0.2075 beta + o(beta)}. The 2n lifts add O(2n * d) words,
      which is negligible at every parameter set. No memory tradeoff is created
      or consumed, which is unusual in this lane and is worth stating.
    best_known: >-
      EV-MLKEM-020's primal_bdd under RC.MATZOV at 140.1994731076207 /
      200.9587149140538 / 270.7236234535225 log2 rop is the baseline this dbeta
      would be subtracted from. The lane's materiality bar for a discount of
      this kind is 2 bits, declared by IDEA-20260722-001 and reused by
      IDEA-20260805-690de8.
    hidden_overhead: >-
      Understated here: the 2n lifting repetitions are charged as polynomial and
      not counted, which is generous if the lift is a pruned enumeration rather
      than plain Babai - flagged in the assumptions and required to be recosted
      if so. The f''-curvature sensitivity of the GAIN(u) conversion is a real
      band and not a point. Overstated here: nothing; the record claims no
      saving until M_eff is measured. Inherited: the o(beta) in the sieve
      exponent, recorded in EV-MLKEM-020 as unbounded by anything this program
      holds.
    tradeoff_note: >-
      No time-memory tradeoff is introduced. The relevant tradeoff is
      TIME AGAINST SUCCESS PROBABILITY: 2n free targets buy probability at fixed
      reduction cost, which is the only axis on which the ring is being asked to
      pay here. Parallelisation is trivial across the 2n lifts and irrelevant,
      since the reduction dominates.

  dominated_by: >-
    DOMINATED, at best partially, and the honest statement is that the best case
    here is a few bits off a figure that is already below its cutoff. Pareto
    check performed against every row this program holds on the relevant
    frontier: EV-MLKEM-020's committed primal_bdd triple and its eighteen
    enumeration-costed cells; EV-MLKEM-015's pinned-estimator figures;
    IDEA-20260805-690de8's dual-side ceiling, which bounds a DIFFERENT
    component and therefore does not dominate this one; IDEA-20260814-10e5e1's
    census-M best-of-M evaluation, which this record strictly extends by
    supplying a larger M at the same cost and therefore DOMINATES on the M axis
    while inheriting its entire conversion machinery; IDEA-20260829-db9f2b's
    module-Kannan route, which if successful would dominate this record
    outright; and the external ring-discount points KN-LIT-7663 and KN-LIT-7667
    at 1-3 bits for ML-KEM, which are the same order of magnitude as this
    record's best case and may or may not compose with it - KN-OPEN-026's
    resolution step 2 asks exactly that question and it is not answered here.
    NOT checked and named as such: any published measurement of orbit
    correlation in primal BDD lifting, which is where this record is most likely
    to be pre-empted.
  sota_delta: >-
    Best case, if M_eff is near 2n and the step-function question resolves in
    favour of probabilistic success: dbeta of order log2(512) / slope, giving a
    bit saving of 0.292 * dbeta, which the lane's own materiality bar puts at
    "matters if it exceeds 2 bits". I do not predict it exceeds 2 bits.
    Expected case, if M_eff is O(1): delta exactly zero, and the deliverable is
    a mechanism-backed closure of the primal-side isometry lane plus a measured
    constraint (the conservation identity and the alignment parameter) that
    IDEA-20260829-db9f2b and any future symmetry proposal inherit.
    On memory and data axes: delta zero, unconditionally.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: low
  honest_prior_of_survival: >-
    0.15. Decomposed: P(Stage 0's algebra checks out) about 0.95 - it is
    elementary and I have checked the identities by hand. P(M_eff is materially
    above O(1), i.e. the orbit is not throttled) about 0.35 - the conservation
    law pins the first moment and my instinct is that a generic tail projector
    leaves substantial freedom, but the lane's history with this symmetry is
    three ceilings in a row and I weight that heavily. P(the resulting dbeta
    clears the lane's 2-bit materiality bar, given a good M_eff) about 0.3.
    P(this is not folklore already measured somewhere) about 0.4. The product is
    well under 0.1 for the exciting reading; I put 0.15 overall because the
    THROTTLED outcome is itself a publishable closure under this program's own
    protocol, and because the free arithmetic check in the fourth falsification
    condition may foreclose the whole lane at zero cost, which is a good return
    on a low-priority record.
