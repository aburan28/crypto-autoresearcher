    results: >-
      The negacyclic isometry family is heavily worked in this corpus, and this
      record deliberately declares it NOT off-limits while declaring the primal
      family off-limits - the inverse of the usual arrangement - because the
      contribution is the CROSSING of the two. Nearest four:
      IDEA-20260805-690de8 proves the DUAL-side identity - the 2n scores of a
      dual vector against its orbit are the 2n coefficients of one negacyclic
      ring product - and derives an arithmetic ceiling on what orbit batching
      can buy. That is the dual side, it is an ARITHMETIC cost argument, and its
      quantity is the score-evaluation share f of an optimised total. This
      record is the primal side and its quantity is a SUCCESS PROBABILITY.
      IDEA-20260814-10e5e1 evaluates best-of-M at the REAL M from a deployment
      census, explicitly at M = 1 for normatively single-use rows. Its M is a
      deployment fact; this record's M = 512 is an algebraic fact available at
      every single instance, including the M = 1 rows, which is precisely the
      case 10e5e1 records as buying nothing.
      IDEA-20260829-db9f2b exposes a dense rank-1 SUBMODULE via a module Kannan
      embedding - the HOMOGENEOUS form of the same symmetry, where the rotations
      become short lattice VECTORS and change the uSVP success condition. This
      record uses the INHOMOGENEOUS BDD form, where the rotations become
      TARGETS and change the lifting success probability. Same symmetry, two
      genuinely different consequences, and the overlap is acknowledged rather
      than minimised.
      IDEA-20260805-3d71ca and IDEA-20260814-8f8f45 own the projected-error
      ratio and its Beta law and its left tail; EXP-MLKEM-42ea04 is the frozen
      contract that measures it. This record consumes that law as its NULL and
      contributes the orbit structure it does not contain.
      Externally, KN-OPEN-026 records that the 2026 ring-structure discount
      mechanisms attack the HYBRID attack; the merged CRYPTO 2026 article
      surfaced by WebSearch this session reports "around 1 bit" for
      Kyber/ML-KEM, while this corpus's KN-OPEN-026 relays 2-3 bits from the
      2026/279 abstract. That discrepancy is flagged here and is worth a
      literature correction independently of this record.
    verdict: >-
      UNVERIFIED. No paper was fetched, the kb index was down, and the corpus
      grep hit its file cap. Claimed new RELATIVE TO THIS REPOSITORY: (i) the
      orbit as a free M on the PRIMAL lifting side, (ii) M_eff as a measurable
      object, (iii) the orbit conservation identity sum_i ||P X^i e||^2 =
      tr(P C_e) as the forced constraint that decides it, and (iv) the spectral
      alignment explanation. I expect the underlying rotation trick to be
      folklore in the lattice community and I say so; what I have not been able
      to check is whether M_eff has ever been measured.

  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: the PRIMAL family itself as
      ordinarily framed - blocksize laws, GSA and simulator fidelity, module-BKZ
      rank effects (IDEA-20260829-353361, -1ebebd, -db9f2b, IDEA-20260814-137f68);
      the dual family entire (IDEA-20260722-001, -20260805-690de8,
      IDEA-20260808-0eb075, IDEA-20260901-2f778b); hybrid and MITM splits
      (IDEA-20260901-67f498, -7eb9e1); decryption failure and failure boosting;
      algebraic attacks; cost-model auditing, which is where most of this
      session's other proposals live; implementation side channels. The
      negacyclic isometry family is deliberately NOT off-limits, for the reason
      IDEA-20260805-690de8 gives for the same choice: this record advances no
      new attack inside it, it measures a success statistic of a symmetry
      already in the corpus, on a side of the attack where the corpus has never
      applied it.
    tracked_object: >-
      THE ORBIT ORDER STATISTIC - the multiset {R_i}_{i=0}^{2n-1} of projected
      error-energy ratios R_i = ||P X^i e||^2 / ||e||^2 taken over the negacyclic
      rotation orbit of ONE error under ONE fixed reduced basis, summarised by
      its minimum and by the fitted effective sample size M_eff. Not the error,
      not the basis, not the lattice, not the cost: a 512-point sample of one
      scalar functional, generated by a group action that costs nothing to
      apply.
    lossiness: >-
      LOSSY, and the test is passed at two levels. Level one: R_i discards
      everything about X^i e except one scalar - the direction inside the tail
      block, the head-block coordinates, and the sign pattern all vanish. Two
      errors with the same projected energy ratio are the same object here.
      Level two, and this is the one that matters: the ORBIT is a lossy
      projection of the instance, because the map e -> {R_i} factors through the
      negacyclic autocorrelation C_e - by the identity in claim (B), the orbit's
      total is tr(P C_e), so all information in e beyond its autocorrelation
      structure and its alignment with P is discarded. NOT A CHANGE OF
      COORDINATES: many distinct errors share an autocorrelation matrix (any
      signed rotation of e has exactly the same C_e), and the fibre is at least
      the orbit itself, size 2n.
      THE COMPATIBILITY CONDITION, checked explicitly. The operation the object
      must survive is the group action itself, and the retained coordinate is
      by construction equivariant: applying X to the instance permutes the
      multiset {R_i} cyclically and leaves the minimum EXACTLY invariant. So the
      discarded structure is discarded compatibly with the operation, and the
      retained statistic propagates deterministically under it. This is the
      strongest form of the condition available, and it is the reason the orbit
      minimum - and not, say, R_0 alone - is the right object.
    propagation: >-
      One step is one rotation, i -> i + 1, which is a signed cyclic shift of
      the error's coefficients, computable in O(d) and requiring no lattice
      operation at all. Deterministic and exactly countable. The cheap internal
      falsifier is the conservation identity: the measured sum over the full
      orbit must equal tr(P C_e) to machine precision at every cell. If it does
      not, the projector, the rotation action, or the arithmetic is wrong, and
      no fitted M_eff is reportable.
    survival_score: >-
      Survives the full orbit exactly, and survives the lifting step exactly,
      which is as far as the attack goes on this branch. It dissolves at three
      named places: (i) at the transition from a lifting success probability to
      a blocksize saving, which needs the GAIN(u) balance and inherits its
      f''-curvature sensitivity; (ii) at the extrapolation from d <= 160 to FIPS
      203 dimensions, where only the spectral ARGUMENT transfers and the fitted
      number does not; and (iii) at the question of whether the primal attack's
      success is probabilistic at the operative blocksize at all - if
      IDEA-20260829-247e35 is right that the core-SVP convention treats success
      as a step function, then a best-of-M gain exists in reality but is
      invisible to every cost model in this lane, and the record must report
      that as its own ceiling rather than as a discount.

  null_object_control: >-
    NULL-IID, THE INDEPENDENCE NULL AND THE PRIMARY COMPARATOR. Replace the
    orbit by 2n INDEPENDENT fresh errors drawn from the same CBD law, projected
    through the SAME reduced basis. This is the M_eff = 2n endpoint by
    construction. OBJECT REMOVED: the deterministic relation among the targets.
    OBJECT PRESERVED: the basis, the projector, the error law, the count.
    NULL-ORTH, THE ISOMETRY-NOT-ROTATION NULL. Replace X^i by 2n uniformly
    random orthogonal maps of the ambient space applied to e. This isolates
    "the targets are isometric images" from "the isometries form the negacyclic
    group": if NULL-ORTH matches the orbit, the ring is doing nothing and the
    effect is generic; if it matches NULL-IID instead, the ring is doing all of
    it. THIS IS THE CONTROL THAT DECIDES WHETHER THE RESULT IS ABOUT ML-KEM'S
    RING AT ALL.
    NULL-RING, THE RING-DELETED NULL. Run the identical pipeline on an
    unstructured q-ary lattice of the same dimension, determinant and error law,
    where no rotation isometry exists, using the instrument
    IDEA-20260805-530869 specifies for exactly this purpose. The orbit is
    undefined there, so the pipeline must report "not applicable" rather than a
    number; a pipeline that returns a number on a ringless instance is reading
    something other than the ring.
    NULL-SUM, THE CONSERVATION ANCHOR. The measured orbit sum must equal
    tr(P C_e) exactly at every cell. This cannot fail unless the harness is
    wrong, which is precisely why it is the harness check.
    NULL-BETA, THE MARGINAL ANCHOR. The marginal distribution of a single R_i
    must reproduce the Beta(beta/2, (d-beta)/2) law that
    IDEA-20260805-3d71ca H1 and EXP-MLKEM-42ea04 already measure, within their
    stated agreement. If the marginal does not match, this record's fit is
    measuring a departure those records own, not an orbit effect.
    FORCED VALUES DECLARED BEFORE MEASUREMENT: (1) M_eff lies in [1, 2n] by
    construction and the endpoints are the two nulls, so only the interior
    carries information; (2) the orbit minimum is invariant under rotating the
    instance, so any dependence of the fitted M_eff on the starting index is a
    harness artifact; (3) the orbit sum is pinned - a large minimum and a small
    minimum cannot both be common, and the record must not report the pinning
    itself as a discovery.

  discriminated_from:
    - >-
      IDEA-20260805-690de8 establishes the DUAL-side orbit identity and converts
      it into an ARITHMETIC ceiling: the 2n scores are the coefficients of one
      negacyclic product, giving a Theta(n / log n) arithmetic saving that
      cannot move an optimised total by two bits unless the score-evaluation
      share f exceeds 0.75. That record's quantity is a cost share. This
      record's quantity is an effective sample size in a success probability, on
      the primal side, where no arithmetic saving is claimed at all - the 512
      lifts are simply performed.
    - >-
      IDEA-20260814-10e5e1 evaluates the best-of-M blocksize saving at the M
      values a deployment census actually supplies, reporting M = 1 for
      normatively single-use rows. This record supplies an M that is present at
      EVERY instance including those rows, because it comes from the ring rather
      than from the deployment, and it therefore answers the same C1 criterion
      at a value 10e5e1's census cannot reach.
    - >-
      IDEA-20260829-db9f2b exposes the rotations as a dense rank-1 SUBMODULE
      visible to a module Kannan embedding, changing the uSVP success condition
      in the HOMOGENEOUS formulation. This record keeps the INHOMOGENEOUS BDD
      formulation where the rotations are TARGETS and the effect appears in the
      lifting step. If db9f2b's dense-sublattice route works, it likely
      SUPERSEDES this record; if it fails because the whole lattice is a module
      and the sublattice is not relatively dense, this record's effect survives
      independently. They should be run as a pair and their outcomes read
      jointly.
    - >-
      IDEA-20260805-3d71ca and IDEA-20260814-8f8f45 own the projected-error
      ratio's law and its left tail, and EXP-MLKEM-42ea04 is the frozen contract
      measuring it. This record uses that law as its NULL-BETA anchor and
      measures a structure ACROSS an orbit that those records measure only
      marginally; it adds no claim about the marginal law and defers to them
      entirely where they disagree with it.
    - >-
      IDEA-20260829-247e35 asks whether the core-SVP convention's step-function
      success model is right. This record's gain EXISTS ONLY IF success is
      probabilistic at the operative blocksize, so 247e35 is a strict logical
      prerequisite, not a competitor; the record names it as such and states
      that a step-function world caps this record's deliverable at "a real
      effect no cost model can see".

