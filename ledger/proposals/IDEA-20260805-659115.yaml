idea:
  id: IDEA-20260805-659115
  question_id: RQ-ECDSA-87625f
  added: '2026-08-05'
  title: >-
    The nonce-leakage frontier has a fourth axis nobody plotted: signature
    ACQUISITION, whose stored volume already exceeds the quoted peak memory of
    the low-leakage record row, and whose crossover rate rho* inverts the
    published ordering by five orders of magnitude
  class: cost_model_audit_of_the_goal_s_own_premise

  claim: >-
    GOAL-ECDSA-001 asserts that the missing work is a memory-charged comparison
    of the lattice and Fourier families. This proposal audits that premise
    before the goal spends six batches on it, and asserts something sharper and
    cheaper: MEMORY IS NOT THE AXIS THAT MOVES THE ORDERING -- SAMPLE COUNT IS,
    and it moves it much further. Two arithmetic facts, both derivable from
    numbers the goal record already quotes, decide this at zero compute.
    (1) VOLUME. A row quoted at 2^36 signatures stores, at the minimum 40-byte
    encoding of a P-160 (r, s) pair, 2.75 TB = 2560 GiB of input -- 3.01x the
    850 GiB peak RAM quoted for that same row (4.82x at a realistic 64-byte
    record). The input to the attack is larger than the attack's reported
    memory. So the two published rows are not measuring the same quantity, and
    a "memory-charged frontier" built by placing 1939 GiB beside 850 GiB is a
    category error before any charging convention is chosen.
    (2) ORDERING. Charging the signatures as ORACLE QUERIES against the victim,
    at an acquisition rate rho signatures per second, the end-to-end wall clock
    of the two quoted rows crosses at exactly
      rho* = (2^36 - 2^25) / (824 - 279) / 60 = 2.1005e6 signatures/second.
    Below rho* the row reported as 2.95x FASTER is slower end-to-end; at a
    plausible rho = 10^3 signatures/second it is 828x slower, and under an
    area-time-squared charge 3.0e5 times more expensive. A defender reading
    "1-bit leakage is broken at 160 bits" cannot see any of this in the
    literature's per-paper reporting, which is precisely the gap this goal
    exists to close.
    The deliverable is a frontier under FIVE declared charging conventions with
    ORDERING STABILITY as the reported statistic, plus a matched null that says
    how often random rows disagree across conventions, so that "memory charging
    changes the answer" becomes a measured claim rather than an assumption.

  object_first_candidate:
    tracked_object: >-
      The ORDERING RELATION on the set of published rows, followed as the
      charging convention varies. Not the cost of any row: the PERMUTATION the
      convention induces. The observable is the number of pairwise inversions
      between the ordering under convention X and the ordering under convention
      Y, and the reported quantity is which pairs are ORDER-STABLE across all
      five conventions. A pair that keeps its order under every convention is a
      real Pareto fact; a pair that flips is a fact about the convention, and
      the literature reports only one convention.
    established_families_off_limits: >-
      Off-limits as the primary lens: the lattice family, the
      predicate/sieving family, the Fourier/Bleichenbacher family, nonce reuse,
      and side-channel acquisition mechanics. This proposal does not run,
      improve, or analyse any attack. It analyses the COST MODEL under which
      attacks in those families are compared, which is the one move that does
      not require choosing a family. Also off-limits: any statement about
      ECDLP (GOAL-ECDSA-001.non_duplication; KN-OPEN-011 owns that question).
    newness_score: >-
      Charging memory is not new -- KN-TECH-035 and the Wiener full-cost line
      are already in this corpus, and GOAL-RSA-001 was opened in the same batch
      with the same discipline. What is new here, and what the ANGLE-BRIEF
      records as a never-attempted transfer for this goal (F2, device D5), is
      pointing full cost at THIS family's frontier, and specifically the
      observation that the binding axis is queries rather than memory. The
      volume inequality (2560 GiB of input against an 850 GiB peak) is one line
      of arithmetic that, as far as this session can tell, nothing in this
      corpus has written down. Whether the external literature states it is
      UNVERIFIED and is stage 0 of the paired experiment.
    testability_score: >-
      Maximal. Every quantity is arithmetic on a published table. The entire
      analysis runs in seconds once the table is obtained, and the hard part is
      obtaining the table honestly, which is exactly what the goal's
      next_action asks the first batch to do first.
    survival_score: >-
      The ordering relation survives every convention by construction, which is
      the point: it is the only thing that CAN be compared across conventions.
      It dissolves the moment the rows stop being comparable at all -- which is
      what fact (1) claims already happened -- and detecting that dissolution
      is the primary deliverable.

  mechanism: >-
    THE FOUR COST AXES. Every published nonce-leakage recovery has at least
    four resource coordinates and the literature reports at most three:
      T  compute wall clock,
      M  peak working memory,
      Q  number of signatures consumed (an ORACLE QUERY count against the
         victim's key -- not a free parameter, and not a compute cost),
      V  storage volume of those Q signatures = Q * b bytes.
    b is 40 bytes for a raw (r, s) pair at 160-bit order and 64 bytes for a
    (r, s, h) record; at 256-bit order b is 64 and 96. V is a MEMORY cost that
    the reported M may or may not include, and no published figure this session
    has seen states which.

    FORCED VALUE 1 (VOLUME), COMPUTED, ZERO COMPUTE, DECISIVE.
    Using the two rows quoted in RQ-ECDSA-87625f.provenance for secp160r1 at
    1-bit leakage -- and those figures are RELAYED FROM A REPOSITORY README
    READ IN EXCERPT, ARE NOT THIS PROGRAM'S, AND ARE UNVERIFIED, exactly as
    that record states:
      Row L: Q = 2^25, T = 824 min, M = 1939 GiB
      Row F: Q = 2^36, T = 279 min, M = 850 GiB
    then at b = 40 bytes,
      V(L) = 2^25 * 40 = 1.342e9 B = 1.250 GiB  -> V/M = 0.00064
      V(F) = 2^36 * 40 = 2.749e12 B = 2560 GiB  -> V/M = 3.01
    and at b = 64 bytes, V(F) = 4096 GiB, V/M = 4.82.
    So Row F's input alone is three to five times its reported peak memory,
    while Row L's is a rounding error. EITHER the reported M excludes streamed
    input (in which case M is not a comparable quantity between the rows and
    the goal's premise as literally stated cannot be executed without a
    convention that says so), OR one of the figures is wrong. Both outcomes are
    deliverables and both are cheap. This is the observation-collision audit in
    its most elementary form: two rows presented as points of one frontier
    whose "memory" coordinate does not denote the same thing.

    FORCED VALUE 2 (ORDERING), COMPUTED, ZERO COMPUTE.
    Charge acquisition at rate rho signatures/second. End-to-end wall clock
      T_tot(row) = T + Q / rho.
    Setting T_tot(L) = T_tot(F):
      rho* = (Q_F - Q_L) / (T_L - T_F)
           = (68719476736 - 33554432) / (49440 - 16740) s
           = 68685922304 / 32700 = 2.1005e6 signatures per second.
    Evaluated:
      rho = 1e3:  T_L = 8.299e4 s, T_F = 6.874e7 s, T_F/T_L = 828
      rho = 1e4:  T_F/T_L = 130.5
      rho = 1e6:  T_F/T_L = 1.727
      rho = 2.1e6: T_F/T_L = 1.000 (by construction)
      rho = 1e8:  T_F/T_L = 0.353
    Under an area-time-squared charge M*T_tot^2 the inversion is far larger:
    compute-only, M*T^2 gives L/F = 19.90 (F cheaper); at rho = 1e3 it gives
    F/L = 3.007e5 (L cheaper by five and a half orders of magnitude). The
    ORDERING IS NOT A PROPERTY OF THE ATTACKS. It is a property of rho, and rho
    is a deployment fact about the victim that no paper states because no paper
    is obliged to.

    THE FIVE DECLARED CONVENTIONS (frozen before any table is read):
      K1  T only                          (what most papers report)
      K2  M only
      K3  A*T   with A = max(M, V)        (area-time)
      K4  A*T^2 with A = max(M, V)        (Wiener/Brent-Kung style full cost;
                                           KN-TECH-035 lineage, NOT READ here)
      K5  T + Q/rho, evaluated at rho in {1e2, 1e3, 1e4, 1e6, 1e8}
          (acquisition-charged end-to-end)
    A = max(M, V) is a DECLARED CHOICE and a conservative one: it charges the
    larger of working memory and stored input and never both. It is declared
    rather than derived, and the sensitivity of every conclusion to replacing
    it by M + V is reported.

    THE REPORTED STATISTIC. For each ordered pair of rows (i, j), record the
    sign of cost_i - cost_j under each convention. Define
      stable(i,j) = 1 if the sign is identical under all conventions
    and report (a) the fraction of pairs that are stable, (b) the explicit list
    of unstable pairs with the convention that flips them, and (c) for each
    unstable pair, the crossover parameter value (rho*, or the b at which V
    overtakes M). ONLY STABLE PAIRS MAY BE STATED AS PARETO FACTS. That rule is
    the deliverable, it is what makes "one frontier or two" answerable, and it
    is what GOAL-RSA-001 can bind to.

    WHY THIS IS NOT DOMINATED BY SIMPLY REPORTING MEMORY. Reporting memory
    beside time gives one more column and a second ordering; it does not say
    which orderings SURVIVE, and it silently keeps the query axis free. The
    query axis is the one on which the two families differ by eleven binary
    orders of magnitude (2^25 against 2^36), which is larger than their memory
    ratio (2.3x) and their time ratio (3.0x) combined by a factor of about
    2^34. A frontier that charges memory and not queries has charged the small
    difference and left the large one free.

    RELATION TO GOAL-RSA-001. GOAL-ECDSA-001.non_duplication requires whichever
    of the two goals runs second to bind to the other's memory-charging
    convention or record why it cannot. K1-K5 above, with A = max(M, V)
    declared and the M + V sensitivity reported, is offered as that convention,
    stated in scheme-neutral terms so the RSA lane can adopt it unchanged. Its
    query axis instantiates there as relation-collection sieving output rather
    than as signatures, and the record says so rather than assuming the
    transfer.

  novelty_status: unverified

  literature_context:
    - >-
      EVERY RESOURCE FIGURE USED ABOVE IS RELAYED AND UNVERIFIED. The values
      2^25 / 824 min / 1939 GiB and 2^36 / 279 min / 850 GiB appear in
      RQ-ECDSA-87625f.provenance, which states in terms that they "come from a
      repository README table read in excerpt and are RESEARCH TARGETS TO BE
      RE-READ". This proposal treats them as INPUTS TO A SENSITIVITY ANALYSIS,
      never as measurements. NOT READ -- relayed claim, and stage 0 of the
      paired experiment is to obtain the primary table.
    - >-
      The primary sources named there -- ePrint 2024/296 with its released code
      and stored instances, the TCHES 2023(2) sieving-with-predicate paper, and
      Albrecht-Heninger's predicate lattice work -- were NOT READ by this
      session. The session ANGLE-BRIEF records, as a measurement on this
      network, that eprint.iacr.org abstract pages return 200 while
      eprint.iacr.org/YYYY/NNNN.pdf returns 403 and that raw.githubusercontent
      returns 200. So the README table itself is likely obtainable and the PDF
      bodies likely are not; the contract says what to do in each case.
    - >-
      KN-TECH-035 is cited in this corpus as the Wiener full-cost lineage
      (session ANGLE-BRIEF, device D5). NOT READ by this session; the A*T^2
      form used above is the standard area-time-squared measure as this record
      states it, and reconciling it with KN-TECH-035's exact formulation is a
      stage-0 task. No claim is made that KN-TECH-035 says what this record
      says.
    - >-
      The ANGLE-BRIEF section T-D records the program-wide state this proposal
      sits in: of 229 evidence records, 131 make a cost claim, 75 charge
      wall-clock only, 82 never mention memory, and dominated_by is absent from
      95 of the 131. The charging vehicle GOAL-ICEX-001 is active and has never
      executed. Those counts are the brief's, not this session's, and are
      relayed.

  lossy_projection_identifiability_audit:
    projection: >-
      A published attack row (algorithm, curve, leakage level, error rate,
      implementation, hardware, Q, T, M) --> the sign vector of its pairwise
      cost comparisons against every other row, under five conventions.
    what_is_discarded: >-
      Every magnitude. Only the ORDER survives, and only the part of the order
      that is convention-independent is finally reported.
    why_genuinely_lossy: >-
      Severely lossy and deliberately so: the map from a row to its comparison
      signs is many-to-one by a wide margin, and rows differing by orders of
      magnitude in every coordinate can share a sign vector. It is emphatically
      not a change of coordinates: the magnitudes cannot be recovered.
    why_compatible_with_the_operations: >-
      Compatible with the only operation that matters here, which is
      COMPARISON. A Pareto frontier is defined entirely by the order relation,
      so a projection that keeps the order and discards the magnitudes retains
      exactly the structure the deliverable is about, and it propagates
      deterministically: composing conventions composes sign vectors.
    is_it_only_a_change_of_coordinates: >-
      No, and the mirror failure -- constancy -- IS THE PROPOSAL'S PRIMARY RISK
      AND IS TESTED HEAD-ON. If every pair turns out order-stable under all
      five conventions, the projection is constant across conventions, the
      statistic has zero spread, and the honest conclusion is that CHARGING
      CHANGES NOTHING for this family -- which weakens GOAL-ECDSA-001's own
      premise and is a first-class deliverable, not a failure. The matched null
      exists precisely to say how much instability random rows would show, so
      that a measured instability can be compared against it rather than
      admired.

  assumptions:
    - >-
      That signature acquisition is serial at a rate rho and is not free. If
      an attacker holds an offline corpus of the victim's signatures, rho is
      effectively infinite for that corpus and only the volume term V binds.
      Both regimes are reported; neither is assumed.
    - >-
      That b (bytes per stored signature) is between 40 and 96 depending on
      curve order and record format. Both endpoints are evaluated; no single
      value is asserted.
    - >-
      That A = max(M, V) is a defensible area proxy. Declared, not derived; the
      M + V alternative is reported alongside.

  predictions:
    - metric: >-
        V(row)/M(row) for the highest-Q published row in the assembled table,
        at b = 40 bytes
      direction: higher
      minimum_effect: >-
        STRICTLY GREATER THAN 1. Predicted 3.01 for the specific row quoted in
        RQ-ECDSA-87625f (2^36 samples, 850 GiB). If the re-read primary table
        gives V/M <= 1 for every row, fact (1) is FALSE, the volume objection
        is withdrawn, and the goal's memory-only premise survives that
        challenge. The prediction is a ratio computed from the table's own two
        columns and cannot be tuned.
    - metric: >-
        Acquisition crossover rate rho* between the two 1-bit secp160r1 rows
      direction: different
      minimum_effect: >-
        2.1005e6 signatures/second, stated to five significant figures BEFORE
        the primary table is read, from the relayed numbers. If the re-read
        numbers differ, rho* is recomputed by the SAME frozen formula
        rho* = (Q_F - Q_L)/(T_L - T_F) and the new value is reported beside
        this one. The formula, not the number, is what is pre-registered.
    - metric: >-
        Ordering-stability fraction: fraction of row pairs whose sign is
        identical under all five conventions
      direction: lower
      minimum_effect: >-
        Strictly below the matched-null fraction (see controls) by at least
        0.15. If the published rows are no less order-stable than random rows
        of the same marginal spread, then charging conventions do not
        discriminate this family and the deliverable is that negative.
    - metric: >-
        Number of published rows that are DOMINATED (worse in every one of T,
        M, Q simultaneously) by another row in the assembled table
      direction: higher
      minimum_effect: >-
        At least 1, or an explicit statement that none is. This is the single
        cheapest honest output of the whole goal: a published point that is
        Pareto-dominated once all three axes are shown together has never been
        so labelled in the per-paper reporting, and labelling it is a result.
    - metric: >-
        Fraction of assembled rows for which the primary source states whether
        the reported peak memory includes the input signature volume
      direction: lower
      minimum_effect: >-
        Reported as measured, with no predicted value. This is a documentation
        census; a low number is the justification for the convention, and a
        high number would mean the volume objection is already handled in the
        literature and this proposal's fact (1) is a misreading.

  minimal_test:
    design: >-
      Three stages, all cheap, the first two decisive. S0: obtain the primary
      tables (README, then abstract pages, then author copies), transcribe
      every row with its provenance label, and record what could not be
      obtained. S1: zero compute -- evaluate the frozen formulas (V/M, rho*,
      the five conventions) on whatever rows exist, including the relayed ones
      clearly labelled as such. S2: the null and positive controls, and the
      stability statistic. Full contract:
      experiments/EXP-ECDSA-dad4fd/specification.yaml.
    controls:
      - >-
        MATCHED NULL (same shape, forced value derivable pre-run, CAN FAIL).
        Generate R synthetic rows whose (T, M, Q) are drawn independently with
        the SAME per-axis log-range as the published rows, and compute the
        ordering-stability fraction. FORCED VALUE, DERIVED BEFORE THE RUN: for
        rows drawn independently, K1 and K2 orderings are independent, so a
        random pair is K1/K2-stable with probability 1/2, and stability across
        all five conventions is bounded above by 1/2. Any measured null
        stability materially above 0.5 means the synthetic rows are correlated
        by construction and the null is invalid. This null CAN fail and its
        failure is diagnostic of the generator, not of the attacks.
      - >-
        SECOND NULL, CORRELATED (the harder one). Generate R rows from a single
        time-memory tradeoff curve M*T = const with Q fixed. FORCED VALUE:
        stability under {K1, K2, K3} is 0 for K1-vs-K2 (a tradeoff curve
        inverts by construction) and 1.0 under K3 (A*T is constant along the
        curve, so all pairs tie). This distinguishes "the conventions
        disagree because the rows trade off" from "the conventions disagree
        because the rows are incomparable", which is exactly the question
        RQ-ECDSA-87625f.decision_target asks.
      - >-
        POSITIVE CONTROL (the instrument MUST fire; if it does not, no negative
        may be reported). Insert one synthetic pair constructed to invert:
        row P (T = 100, M = 1, Q = 2^20) and row P' (T = 50, M = 1000,
        Q = 2^20). K1 ranks P' first; K2 and K3 and K4 rank P first. The
        stability detector MUST flag this pair as unstable. If it does not, the
        detector is broken and every stability number in the run is void.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. Sweep rho
        over {1e2, 1e3, 1e4, 1e5, 1e6, 1e7, 1e8} and report the number of
        inverted pairs as a function of rho. The FORCED SHAPE is monotone
        non-increasing in rho (higher acquisition rate means the query term
        matters less, so the ordering must converge to the compute-only
        ordering). A non-monotone curve means the evaluator is wrong, not the
        attacks; this is the canonical artifact tell applied to a cost model.
      - >-
        PROVENANCE CONTROL. Every row carries a label in
        {primary-read, README-relayed, secondary-relayed, this-program-measured}
        and every reported statistic is recomputed with the relayed rows
        EXCLUDED. If a conclusion survives only with relayed rows included, it
        is reported as resting on unverified figures, in the sentence that
        states it.
      - >-
        ARCHIVE CHECK (zero compute). No prior record in this corpus in area
        ECDSA; recorded as an absence, not as a passed check.
    required_metrics:
      - the assembled row table with every axis and a provenance label per row
      - V/M per row at b in {40, 64, 96}
      - the five cost values per row and the full pairwise sign matrix
      - ordering-stability fraction, treatment vs both nulls
      - the explicit unstable-pair list with each pair's crossover parameter
      - the list of rows dominated on all of (T, M, Q) simultaneously

  falsification_conditions:
    - >-
      V/M <= 1 for every row in the re-read primary table at every b in
      {40, 64, 96}. Fact (1) is then wrong and must be withdrawn as a
      superseding record.
    - >-
      Ordering-stability of the published rows is at or above the matched-null
      value. Charging conventions do not discriminate this family; the
      proposal's headline is refuted and the negative is the deliverable.
    - >-
      The primary sources state explicitly that reported memory includes input
      volume, for the rows in question. The category-error claim collapses to a
      misreading and is recorded as one.
    - >-
      The positive control pair is not flagged. Nothing in the run may be
      reported.

  confounders:
    - >-
      HETEROGENEOUS HARDWARE. Published rows come from different machines,
      different years, different GPU counts. Comparing their wall clocks at all
      is already questionable, and this proposal makes that worse by squaring
      the time. Mitigation: every conclusion is stated as a statement about the
      REPORTED numbers under a declared convention, never as a statement about
      the algorithms' intrinsic costs, and the hardware description is carried
      per row.
    - >-
      CONVENTION SHOPPING. Five conventions and a free parameter rho give ample
      room to find an inversion. This is why the deliverable is
      ORDERING STABILITY (which punishes convention shopping) rather than a
      preferred convention, why the conventions are frozen before any table is
      read, and why the null exists.
    - >-
      b IS A GUESS. 40/64/96 bytes per signature are reasoned from field sizes,
      not read from an implementation. If the released code stores signatures
      in a compressed or derived form, V changes. Stage 0 reads the storage
      format if the code is obtainable.
    - >-
      rho IS NOT A PROPERTY OF THE ATTACK. Charging queries at a rate imports
      a deployment assumption. That is exactly the point -- the reported
      ordering already imports the assumption rho = infinity silently -- but a
      reader could reasonably call the choice arbitrary, so both endpoints
      (rho finite, rho infinite) are always reported together.
    - >-
      SMALL n. If only a handful of rows can be obtained, the stability
      fraction has enormous sampling error. The contract reports the row count
      with every fraction and refuses to state a stability conclusion below a
      declared minimum row count.

  interpretation_limits:
    - >-
      THIS IS A COST-MODEL AUDIT, NOT AN ATTACK RESULT. It does not recover a
      key, does not improve any attack, and does not claim any attack is
      weaker or stronger than reported. It claims that the published rows are
      being COMPARED on axes that do not carry the difference.
    - >-
      Any conclusion drawn from relayed numbers is a conclusion about those
      numbers. The primary tables are unverified until re-read and the record
      states so in the same sentence as any figure.
    - >-
      SAYS NOTHING ABOUT ECDLP. Every row concerns key recovery GIVEN ASSUMED
      NONCE LEAKAGE. GOAL-ECDSA-001.non_duplication and KN-OPEN-011 govern;
      that question stays with GOAL-ECDLP-001 and GOAL-PATH-001.
    - >-
      A finding that a published row is Pareto-dominated is a finding about the
      row as reported, not an allegation about the paper. Papers optimise the
      axis they declare; the point is that a defender reads the frontier, not
      the declaration.

  heuristic_assumptions:
    - id: HEUR-EC-3
      statement: >-
        (Comparability.) For rows drawn from different papers and hardware,
        the reported wall clock and peak memory are on a common enough scale
        that their ORDER carries information about the algorithms, even though
        their magnitudes do not.
      rigorous_support: >-
        None. This is the weakest assumption in the proposal and it is the one
        the literature already makes implicitly whenever a frontier is drawn.
        Stating it as a numbered heuristic is half the contribution.
      validation_plan: >-
        Where two rows come from the SAME paper and hardware, their pair is
        labelled homogeneous. Report the stability fraction separately for
        homogeneous and heterogeneous pairs. If the two fractions differ
        materially, the heuristic is doing work and the heterogeneous
        conclusions are downgraded accordingly.
      falsification_condition: >-
        Homogeneous-pair stability and heterogeneous-pair stability differ by
        more than 0.25. Heterogeneous comparisons are then reported as
        uninterpretable rather than as frontier points.
    - id: HEUR-EC-4
      statement: >-
        (Acquisition serialization.) Signature acquisition against a single
        victim key is serial at a bounded rate rho, so Q signatures cost Q/rho
        seconds of wall clock that cannot be parallelised away by the attacker.
      rigorous_support: >-
        Follows from the leakage model itself: the side channel is attached to
        the victim's signing operation, so signatures arrive at the victim's
        signing rate. It fails if the attacker can induce signing at will or
        holds an archive.
      validation_plan: >-
        Report every conclusion at both rho = infinity (archive regime, only V
        binds) and finite rho, and state which regime each published row
        implicitly assumes. No experiment is needed; the check is that both
        regimes appear in the deliverable.
      falsification_condition: >-
        Not falsifiable by measurement -- it is a scoping assumption, and it is
        recorded as such rather than dressed as an empirical claim. Its content
        is that the goal must report both regimes, and the falsifier of that is
        a deliverable that reports only one.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED and none is claimed. What this changes is which
      cost is compared, not what any cost is. Stated plainly per the generation
      contract: this proposal moves no exponent. It is proposed because the
      goal's completion criterion 2 cannot be met without a charging convention,
      because the convention is currently unstated, and because the arithmetic
      that decides whether the convention matters costs an afternoon.
    memory_exponent: >-
      n/a as a claim. Memory enters as a MEASURED axis and as one of the four
      charged coordinates.
    best_known: >-
      For the frontier itself: the per-paper reporting described in
      RQ-ECDSA-87625f, which is the incumbent and which this proposal does not
      claim to beat on any attack axis.
    hidden_overhead: >-
      The whole proposal is about a hidden overhead -- input volume and
      acquisition time -- so nothing is hidden by it; the numbers are its
      output.
    tradeoff_note: >-
      The correlated null (rows from one M*T = const curve) is the explicit
      tradeoff case and it is used to separate "tradeoff" from "incomparable",
      which is RQ-ECDSA-87625f's literal decision target.

  dominated_by: >-
    n/a (no attack result claimed). On the deliverable itself -- a
    query-and-memory-charged ordering-stability analysis of this family's
    published frontier -- rows checked before writing this field: (a) TIME:
    no record in this corpus reports HNP attack wall clock at all (area ECDSA
    is empty per the goal brief); (b) MEMORY: none reports HNP peak memory;
    (c) DATA/QUERIES: none charges signature count; (d) the corpus's own
    charging vehicles -- GOAL-ICEX-001 (active, never executed per the session
    ANGLE-BRIEF) and GOAL-RSA-001 (draft, zero evidence) -- have produced no
    frontier to be dominated by; (e) KN-TECH-035's full-cost lineage is cited
    in this corpus but was NOT READ by this session and may already contain a
    stronger convention, which is recorded here as an open possibility rather
    than excluded. The EXTERNAL literature was not read, so "no one has done
    this" is NOT asserted; novelty_status is unverified and the screen's power
    is explicitly weak (see literature_context).
  sota_delta: >-
    Quantitative, and stated against the relayed figures it audits: the
    reported ordering of the two 1-bit secp160r1 rows is 2.95x on time and
    2.28x on memory in the SAME direction; charging queries at rho = 10^3
    signatures/second reverses it to 828x on end-to-end time and 3.0e5 under
    A*T^2. The delta this proposal claims is therefore not an attack speedup
    but a measured 8.8e5-fold swing in the comparison the literature reports as
    a 3x gap, conditional on the relayed inputs and on rho. Additionally: a
    row whose stored input is 3.01x its reported peak memory is identified as
    non-comparable on the memory axis, which removes a point from the frontier
    rather than adding one.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that at least one published row pair is order-unstable across the
    five conventions once the primary table is obtained. It is not higher
    because the whole analysis depends on obtaining a table with more than two
    usable rows, and the ANGLE-BRIEF measures ePrint PDF bodies as 403 on this
    network, so the row count may be too small to state anything; and because
    the relayed numbers may be misread from the excerpt. It is not lower
    because the arithmetic on the two rows already quoted produces an inversion
    at every rho below 2.1e6, and because an eleven-binary-order-of-magnitude
    spread on the query axis against a 1.2-order spread on memory makes
    stability across a query-charging convention arithmetically unlikely.
    Separately: 0.55 that the primary tables are obtainable at all under the
    measured network policy, which is why stage 0's failure disposition is
    written before stage 0 runs.
