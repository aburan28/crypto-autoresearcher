idea:
  id: IDEA-20260807-7424a9
  question_id: RQ-SSIQ-9702af
  added: '2026-08-07'
  title: Levers L2 and L3 -- the QUADRATIC list factor F3 and the collision mechanism it feeds
    -- are recorded OPEN and unchanged in all thirteen GOAL-SSIQ-001 checkpoints, while thirteen
    batches of compute went to L4 at a single prime; L2 is the only lever that moves TIME AND
    MEMORY TOGETHER and its cheap pre-compute test has never been designed
  class: measurement
  claim: 'GOAL-SSIQ-001''s exponent budget identifies F3 (|L(E,X,B)| = X^{2+o(1)}) as ''THE QUADRATIC
    FACTOR and the reason memory equals time''. L2 targets F3 and its named obstruction says the
    cheap pre-compute test is ''a toy measurement of that exchange rate, not an argument about
    it''. L3 targets the collision mechanism. Every checkpoint shard BATCH-001 through BATCH-013
    records L2 and L3 as state: OPEN, changed_this_batch: false. Thirteen batches went into L4''s
    measurement instrument for delta_E at the single prime p = 2437, and DEC-20260806-f96efd''s
    resume_action is another truncation-budget run at the same prime. The L2 exchange-rate measurement
    -- enumerate a natural restricted family F contained in L(E,X,B), measure |F|/|L| against
    the measured hit probability, and see whether the ratio is 1:1 -- has never been designed,
    frozen or run, and no IDEA-* frames it. GOAL-SSIQ-001 names L4 as ''the only lever whose ceiling
    meets this goal''s target'', which is why L2/L3 were never scheduled -- but L2 additionally
    shrinks MEMORY, and memory is precisely the term EV-SSI-59f7a2 identifies as making the attack
    physically impossible (2^{92.5} entries).'
  mechanism: A toy-scale exchange-rate measurement at log2(p) in [20,40]. For two or three explicitly
    named restrictions of L(E,X,B) -- fixed kernel-Frobenius type, fixed degree-residue class,
    fixed small-prime support pattern -- measure |F|/|L| and the empirical probability that the
    required psi survives the restriction, and report the exponent delta in |F| = X^{2-delta}
    beside the log-probability loss. A 1:1 exchange rate at every restriction is the named obstruction
    that would close L2 properly; anything else is the first sub-quadratic list.
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/goals/GOAL-SSIQ-001
    - ledger/proposals
    - experiments
    grep_results:
    - L2 and L3 are OPEN with changed_this_batch false in all 13 checkpoint shards.
    - H-SSIQ-36e970 and EXP-SSIQ-a85692 are the delta_E truncation-sweep instrument -- entirely
      L4 (subfield descent / distance to the F_p locus), self-labelled 'infrastructure/mechanism-diagnostic
      progress on L4'. Nothing in it measures list cardinality against hit probability, and nothing
      touches the claw step.
    conclusion: No record frames the L2 exchange-rate measurement.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: L4 subfield descent and
      the delta_E instrument, which owns thirteen batches. The object here is the LIST and its
      restrictions.'
    tracked_object: The pair (|F|/|L|, Pr[psi survives the restriction]) for each named restriction
      of L(E,X,B).
    one_step_propagation_rule: Imposing an additional independent restriction multiplies both
      components; the exchange rate is their log-ratio and composes additively.
    newness_score: As mathematics, modest -- it is a counting measurement. As a lever it is the
      only one that shrinks memory, which is the term that makes the incumbent unimplementable.
  lossy_projection_identifiability_audit:
    projection: L(E,X,B) -> a restricted sublist F.
    what_is_discarded: Every element failing the restriction.
    is_it_only_a_change_of_coordinates: NO -- the restriction is genuinely lossy by construction;
      the whole question is whether what it discards is disproportionately the USELESS part. If
      the exchange rate is exactly 1:1 the restriction is information-neutral and worthless, which
      is the expected and still-useful outcome.
    mirror_failure_check: CHECKED. A restriction that keeps everything has ratio 1 and zero probability
      loss -- a degenerate case the design excludes by requiring |F|/|L| bounded away from 1.
      The empty restriction is the other degenerate case and is excluded likewise.
  null_object_control:
    primary_null: A RANDOM SUBLIST of the same cardinality. Its probability loss must equal its
      cardinality loss exactly (a 1:1 exchange), by definition of uniform sampling. Every structured
      restriction is reported as a DEVIATION FROM THAT NULL. Without this null a measured 1:1
      rate cannot be distinguished from a bug.
    secondary_nulls:
    - 'DEGENERACY GATES: reject restrictions with |F|/|L| above 0.9 or below 1/|L|.'
    - 'REGRESSION: reproduce the committed |L(E,X,B)| cardinality scaling before measuring any
      restriction.'
  assumptions:
  - L(E,X,B) is enumerable at log2(p) in [20,40], which the existing SSIQ instruments suggest
    at p = 2437 and must be confirmed upward.
  - The named restrictions are computable without solving the underlying problem.
  predictions:
  - metric: exchange rate (log probability loss) / (log cardinality loss) per restriction
    direction: different
    minimum_effect: Any value bounded away from 1 that survives the random-sublist null at two
      primes.
  minimal_test:
    design: At three primes in [2^20, 2^40], enumerate L(E,X,B); apply three named restrictions;
      measure |F|/|L| and the survival probability; report the exchange rate against the random-sublist
      null.
    controls:
    - random sublist of matched size
    - degeneracy gates
    - cardinality-scaling regression
    required_metrics:
    - '|F|/|L| and survival probability per restriction per prime'
    - fitted delta in |F| = X^{2-delta}
    - exchange rate with CI
  falsification_conditions:
  - 'Every restriction gives a 1:1 exchange rate within the null envelope: L2 closes with a MEASURED
    obstruction, which would be GOAL-SSIQ-001''s first closure that is measured rather than derived.'
  - 'A restriction beats 1:1 and replicates: the first sub-quadratic list, which attacks the exact
    term making the p^{1/3} attack unimplementable and demands immediate red-teaming.'
  - 'L(E,X,B) is not enumerable above p = 2437: recorded as an instrumentation limit, and the
    measurement is scoped to where it is.'
  confounders:
  - Restrictions may be correlated with the target's own structure, which would manufacture a
    favourable rate; state independence explicitly per restriction.
  - Small p makes X small and the exponent fit poorly resolved; report ratios.
  interpretation_limits:
  - Toy scale. A favourable exchange rate at 2^40 is not a cryptographic claim.
  - This is a measurement of a lever, not an algorithm.
  heuristic_assumptions:
  - id: HEUR-SSIQ-L2
    statement: The exchange rate measured at toy p is indicative at cryptographic p.
    rigorous_support: None. GOAL-SSIQ-001's own L2 obstruction text says the toy measurement is
      'not an argument about it'.
    validation_plan: Report at three primes and give the trend, not a point value.
  target_complexity:
    time_exponent: F3 contributes X^{2+o(1)}; a delta > 0 lowers both time and memory. No claim
      that delta > 0.
    memory_exponent: Same delta applies; this is the lever's distinguishing feature.
    best_known: Wesolowski 2026 p^{1/3+o(1)} time = memory.
    hidden_overhead: Cost of testing the restriction per element.
    tradeoff_note: A restriction that costs more per element than it saves in cardinality is a
      loss and must be charged.
  dominated_by: 'Wesolowski 2026. Rows checked across time, memory and data/queries: Wesolowski
    2026 p^{1/3+o(1)} time and memory; Delfs-Galbraith p^{1/2}(log p)^{O(1)} at poly memory; vOW
    p^{1/2+o(1)}/w^{1/2} at memory w; MITM p^{1/2} at p^{1/2}; Kohel p(log p)^{O(1)}. Queries
    0 on every row.'
  sota_delta: ZERO claimed. Deliverable is a measured exchange rate for the lever that moves time
    and memory together, on which thirteen batches have produced nothing.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 0.85 that the measurement is executable at 2^20-2^30. 0.75 that every
    restriction comes out at 1:1, which is the modal and still-valuable outcome. 0.10 that any
    restriction beats 1:1 and replicates. 0.03 that the effect is large enough to matter at cryptographic
    scale.
