idea:
  id: IDEA-20260922-8ac1ea
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    sect163k1 AND sect163r2 ARE THE SAME FIELD, THE SAME REDUCTION POLYNOMIAL,
    THE SAME COFACTOR, THE SAME a = 1 AND THE SAME ORDER BIT-LENGTH, AND THEY
    DIFFER IN EXACTLY ONE COEFFICIENT: b. That makes K-163/B-163 the only
    single-variable matched pair at deployed parameters anywhere in the
    standardized binary population, and it turns "what does Koblitz-ness buy an
    index calculus" into a three-factor factorial -- S_3 reads only b,
    E-membership and the E/2E class read only a, and the Frobenius exists only
    when BOTH lie in F_2 -- whose four cells are separately buildable at n <= 41
    and whose deployed instances the FIPS list supplies for free.
  class: control
  claim: >-
    R1 representation (field representation of the coordinates, in the FIPS
    reduction basis); the attack stage whose charged cost is under test is
    RELATION DECOMPOSITION -- per-instance decomposition cost and relation yield.

    The claim is an identification claim, not a cost claim. On a binary curve
    E_{a,b}: y^2 + xy = x^3 + a x^2 + b over F_{2^m}, the curve enters the
    decomposition pipeline at exactly three separable places:
      (P1) the summation polynomial
           S_3(x1,x2,x3) = (x1x2 + x1x3 + x2x3)^2 + x1x2x3 + b
           reads the curve ONLY through b, and not at all through a
           (RQ-SEMBIN-9e8f82 scope block);
      (P2) E-side membership, x in x(E) iff Tr(x + a + b/x^2) = 0, and with it
           the class map P -> Tr(x_P) + Tr(a) computing E -> E/2E
           (H-SEMBIN-83a856, supported), read a and b;
      (P3) tau is an endomorphism of E if and only if a AND b both lie in F_2.
    Therefore a 2x2 factorial in (b in F_2 ?) x (a in F_2 ?) over ONE field
    separates the three, and it is the only design that can: a single-curve
    experiment cannot see (P1)-(P3) at all, and the program's one existing
    comparison of this kind (IDEA-20260915-8fe0ef) varies the FACTOR BASE V on a
    single curve, which holds the curve fixed by construction.

    The deployed population hands this design its instances. Read off
    analysis/binstd-curve-audit/binary-curve-params.txt: sect163k1 has
    A = 1, B = 1, cofactor 2, field polynomial x^163 + x^7 + x^6 + x^3 + 1,
    order of bit-length 163; sect163r2 has A = 1, B = a 163-bit pseudorandom
    value, cofactor 2, the SAME field polynomial, order of the same bit-length.
    They differ in b and in nothing else that any filed cost law reads. The other
    four FIPS pairs are two-variable: K-233/283/409/571 have a = 0 and h = 4
    while B-233/283/409/571 have a = 1 and h = 2, so those pairs vary a, b and
    the cofactor together and cannot separate (P1) from (P2) by themselves.

    WHAT THE PAIR IDENTIFIES THAT NEITHER CURVE ALONE CAN: the CURVE-COEFFICIENT
    RESIDUAL -- the part of any measured index-calculus cost difference that is
    not explained by the field, the factor base, the arity or the solver. Three
    explanations are currently live in this program's corpus and no filed record
    separates them:
      (E1) FROBENIUS-ONLY. Koblitz-ness buys exactly the orbit quotient --
           relation count divided by m, linear algebra by m^2 -- and the
           per-instance algebra is curve-blind (IDEA-20260906-a77711 arm A,
           KN-LIT-796). Prediction: the 2x2's three non-Koblitz cells cost the
           same per instance, within noise, at equal (V, m_a).
      (E2) SPARSE-CONSTANT. b = 1 additionally makes the descended system
           cheaper per instance. In the polynomial basis the coordinate vector
           of b = 1 is e_0 (Hamming weight 1), so EXACTLY ONE of the m descended
           F_2-equations carries a constant, against about m/2 for a generic b.
           Prediction: the two b = 1 cells are cheaper than the two b-generic
           cells by a measurable factor at equal (V, m_a), independently of a.
      (E3) CLASS-STRUCTURE. a moves the yield through Tr(a) and the admissible
           arity: on Tr(a) = 1 curves a factor base inside ker Tr has F1 = 0 and
           odd arities yield exactly zero G-decompositions (IDEA-20260915-8fe0ef
           S2). Prediction: the two a in F_2 cells differ from the a-generic
           cells in lambda_x and in nothing else.
    These predict DIFFERENT, non-overlapping patterns across the four cells, so
    one 2x2 at one toy n decides among them; and the cheapest arm of it, the
    constant-weight count, is arithmetic with no solver at all.
  mechanism: >-
    OBJECT FRAME, STATED HONESTLY. This record proposes NO new tracked object.
    Its object is the standard index-calculus relation vector over the factor
    base: representation R1 (coordinates of x in the F_2-basis fixed by the
    curve's own reduction polynomial), operation set Sigma = translation by
    factor-base elements ONLY, trichotomy class PARTIAL-ACTION (Class I of
    IDEA-20260806-c5d183) because the vector propagates when a factor-base point
    is added and under nothing else. LOSSY-PROJECTION TEST against that Sigma:
    the projection discards the group element and retains only its expression
    over Fb; the discard is Sigma-compatible because adding a factor-base element
    adds a basis vector to the retained part; it is lossy in the representation
    actually used whenever |Fb|^{m_a} > r, which every cell of the design
    satisfies by construction. DECLARED OFF-LIMITS COMPONENT: F2 (factor-base
    decomposition) of IDEA-20260802-002, used as the component, as the question
    requires. WHAT IS ADDED BEYOND F2: not a mechanism but a nearby-object
    control design -- the null objects that docs/inventor-protocol.md requires
    BEFORE belief, supplied at deployed parameters by the standard itself. The
    "price the one open number" obligation is discharged by the two numbers the
    design measures, the per-instance cost ratio and the yield ratio across
    cells, each against three named controls.

    THE FOUR CELLS, AND WHY ALL FOUR ARE REAL CURVES. Over a fixed F_{2^n} with
    n prime, 17 <= n <= 41, and a fixed reduction polynomial:
      C-KK: a in F_2, b = 1        -- a Koblitz curve; tau is an endomorphism;
                                      the deployed analogue is K-163 (a = 1) and
                                      K-233..571 (a = 0).
      C-GK: a generic, b = 1       -- NOT defined over F_2, so no tau, but S_3 is
                                      the same sparse polynomial as C-KK. This
                                      cell exists nowhere in the standardized
                                      population and is the null object that
                                      separates (P1) from (P3).
      C-KG: a in F_2, b generic    -- the deployed B-curves exactly (a = 1);
                                      dense S_3, no tau, same class structure as
                                      a Koblitz curve with the same a.
      C-GG: a generic, b generic   -- the fully generic binary curve.
    All four are non-singular for b != 0 (the curve y^2 + xy = x^3 + a x^2 + b is
    non-singular iff b != 0), so the design has no degenerate cell, and the
    isomorphism class of C-KG is what an implementer meets on B-163.

    WHY C-GK IS THE LOAD-BEARING CELL. It is the only place where "the descended
    system is sparse" is separated from "the curve has an endomorphism". Every
    existing statement in this corpus about Koblitz curves bundles the two. If
    C-GK measures like C-KK per instance, (E2) is alive and the b = 1 sparsity is
    a per-instance saving that the GGMP orbit accounting does not contain; if
    C-GK measures like C-GG, (E1) stands and the ONLY thing b = 1 buys is that it
    lets tau exist.

    WHAT IS MEASURED IN EACH CELL, at fixed V and m_a:
      (M1) weight(constant vector) -- the number of inhomogeneous descended
           equations. Arithmetic, no solver. Predicted 1 in the b = 1 cells and
           Binomial(n, 1/2)-distributed in the b-generic cells.
      (M2) |Fb_E ∩ V| and the exhaustive yield lambda_x for the chosen m_a,
           by full enumeration of V (2^l membership tests) and of V^{m_a}
           modulo S_{m_a} where that is affordable.
      (M3) the degree-by-degree Macaulay rank profile of the descended
           decomposition system and the first fall degree, on matched instances.
      (M4) WDSat conflict counts, median and IQR, on >= 20 certified-UNSAT and
           >= 20 certified-SAT instances per cell, stratified by satisfiability
           per IDEA-20260913-191ed2's finding that Assumption-1 validation is
           mostly done on the arm that cannot fail it.
      (M5) on C-KK only: the <tau,-1> orbit count, U = |Fb_E|/(2n), and the
           relation count against the negation-only row.
    (M3) is the discriminator the record most wants: the top-degree part of the
    descended system is IDENTICAL across all four cells by (P1), since b enters
    only the constant. If the first fall degree or the rank profile moves with b,
    then a degree bound derived on one curve does not transfer to another over
    the same field, which is a scope limit on every filed Assumption-1 statement
    and is reported as such rather than as a cost result.

    THE THREE CONTROLS, AND WHY EACH IS NEEDED.
      (N1) IDENTITY: the same curve, the same V, the same instances, run twice
           through the pipeline with different seeds -- the noise floor against
           which any cell-to-cell difference must be read.
      (N2) TRANSPORTED-CURVE NULL: C-KG and a second, independently drawn
           b-generic curve over the same field. Two curves in the SAME cell must
           agree within the (N1) noise floor; if they do not, the design's unit
           of comparison is the curve and not the cell, and the 2x2 cannot be
           read.
      (N3) GENERIC-GROUP CONTROL: the same relation-collection bookkeeping run on
           a relabelled Z/rZ with a random-labelled "factor base" of the same
           size, per IDEA-20260802-002's control set, to confirm that the
           measured yield in (M2) is a property of the curve and not of the
           counting.
  novelty_status: unverified
  origin:
    kind: idea-generator lane B (FIPS 186-4 binary curves), batch of 2026-09-22
    date: '2026-09-22'
    scope: >-
      Executable at toy binary curves n <= 41 only. Deployed curves appear as the
      source of the design's configuration (which (a, b) patterns the standard
      actually ships) and in no run.
    overlap_review: >-
      (1) IDEA-20260915-8fe0ef is the nearest record. It compares a tau-stable V
      against a random V of the same dimension ON ONE CURVE, and its outcome B
      ("c differs by > 25% between stable and random V") is a statement about the
      FACTOR BASE. This record holds V fixed and varies the CURVE, which is the
      orthogonal arm of the same question and which that record's design cannot
      reach. Its TWIST control (the same V on y^2+xy=x^3+1 versus a=1) is the
      closest thing in the corpus to cell C-KG versus C-KK, but both of its
      curves are Koblitz, so it never leaves the tau-bearing column and can never
      produce C-GK.
      (2) IDEA-20260913-cedd2f owns trace-parity confinement (the P -> Tr(x)+Tr(a)
      class map). This record does not re-derive it; it uses it to PREDICT the
      (E3) pattern and cites it.
      (3) IDEA-20260815-b751cf asks whether solving degree is a curve-MODEL
      invariant (Weierstrass/Edwards/Montgomery/Hessian of the SAME curve). That
      is a model question over prime fields; this is a COEFFICIENT question over
      one binary field, and the two are complementary: b751cf varies the
      presentation of one curve, this varies the curve at one presentation.
      (4) IDEA-20260815-e46bf8 measures curve-to-curve variance of the syzygy
      cascade. That record asks how noisy a statistic is across curves; this asks
      which structured coefficient pattern moves it, with the pattern read off
      FIPS.
      (5) IDEA-20260922-1a081a (sibling, same batch) states the curve-blindness
      indexing theorem and leaves lambda_x as its one free scalar; this record is
      the measurement that fills it. The two are complementary and each cites the
      other; neither restates the other's content.
      No record in the 164-proposal dedup surface contains a K/B comparison at
      equal m, and none names sect163r2.
