idea:
  id: IDEA-20260805-977e16
  question_id: RQ-MAYO-001
  added: '2026-08-05'
  title: >-
    Charge the whipped underdetermination at the right alpha: the attacker
    chooses r and buys variables in free units of n, so MAYO's direct-attack
    accounting has k admissible operating points and only one of them is the
    published one
  class: cost-model-audit

  claim: >-
    MAYO's direct (forgery) attack is a system of m quadratic equations in
    k n variables, and its underdetermination ratio alpha* = k n / m is the one
    parameter whipping moves in the attacker's favour (IDEA-20260805-258212,
    Identity 4). This proposal makes the accounting concrete and auditable and
    adds a structural observation that is not in the corpus: BECAUSE THE
    WHIPPED MAP IS BUILT FROM k COPIES OF ONE UNDERLYING MAP, THE ATTACKER CAN
    RESTRICT TO AN r-BLOCK LINEAR SLICE FOR ANY r IN 1..k AND OBTAIN A SYSTEM
    WITH THE SAME m EQUATIONS AND EXACTLY r n VARIABLES -- so the whipped
    instance is not one point on the underdetermination axis but a LADDER of k
    points, alpha_r = r n / m, whose ends are the underlying UOV map
    (r = 1, alpha_1 = n/m, about 1.03 at the recalled MAYO Level I parameters)
    and the full whipped map (r = k, alpha_k = about 9.28). Every published
    underdetermined-MQ technique consumes alpha, so the attacker's cost is the
    MINIMUM over the ladder, and a security estimate that evaluates the direct
    attack at a single alpha has assumed rather than shown that the endpoint is
    optimal. The audit is three numbers per parameter set and no compute: which
    alpha the specification's own estimate charges, what the best-known
    underdetermined reduction removes at each rung of the ladder, and what the
    same accounting gives for a matched plain-UOV parameter set at the same
    claimed level. THIS PROPOSAL PROPOSES NO ATTACK AND CLAIMS NO BITS; it
    supplies the charging convention without which any later MAYO-versus-UOV
    comparison in this program is arithmetic performed on incomparable objects.

  object_first_candidate:
    tracked_object: >-
      The admissible-operating-point ladder {(m, r n) : r = 1..k} of the
      whipped system -- i.e. the (equations, variables) pair followed as the
      attacker moves through slice dimensions -- together with the number of
      equations a published underdetermined-MQ reduction removes at each rung.
      The object is the LADDER, not any single system: the corpus and (RECALLED,
      UNVERIFIED) the published analyses treat the whipped system as one
      instance, and treating it as k instances with a free choice is the
      contribution.
    established_families_off_limits: >-
      Off-limits as the primary lens: Kipnis-Shamir, reconciliation, the
      intersection attack, MinRank and rectangular MinRank, and all
      implementation/fault routes. NOT off-limits, deliberately: the
      underdetermined-MQ family itself (Kipnis-Patarin-Goubin, Thomae-Wolf,
      Hashimoto, and the pseudo-oil reinterpretation reported in KN-LIT-1818).
      This proposal does not invent a member of that family -- it AUDITS THE
      ARGUMENT the family is fed, which is the one move the off-limits rule
      permits and the move the session generation contract ranks first
      ('attack the measurement, not the target').
    newness_score: >-
      The ladder observation is elementary and follows in one line from the
      slice identity of IDEA-20260805-74e78c. It is nevertheless absent from
      this corpus in any form, and its consequence -- that the direct-attack
      cost is a minimum over k operating points rather than a single evaluation
      -- is a checkable claim about how a published estimate was computed.
      Whether the MAYO team already performs the minimisation is UNKNOWN TO
      THIS SESSION and is exactly what Stage 0 reads.
    testability_score: >-
      High and free. Every quantity is integer arithmetic on published
      parameters. The only hard part is obtaining the specification and the
      exact reduction formula, both of which are reading tasks with a declared
      source-preference order.
    survival_score: >-
      The ladder is exact at all parameters. The COST statement attached to it
      survives only as far as the substituted underdetermined-MQ cost model
      does, and that model is not this program's and has not been verified
      here.

  mechanism: >-
    DERIVED, EXCEPT WHERE MARKED. No MAYO document and no underdetermined-MQ
    paper has been read in this session.

    THE LADDER (DERIVED). From the slice identity of IDEA-20260805-74e78c: for
    C in F_q^{k x r} the whipped map restricted to x_i = sum_a c_{ia} y_a is
      P*(C y) = sum_a D_a(C) P(y_a) + sum_{a<b} F_ab(C) P'(y_a, y_b),
    a system of m quadratic equations in the r n coordinates of (y_1..y_r).
    Provided the emulsifier defect delta(C) is 0 -- which IDEA-20260805-74e78c
    predicts as a forced value and makes its whole object -- the equation count
    stays m at every r. So the attacker faces, for free and by choice, any of
      (equations, variables) = (m, n), (m, 2n), ..., (m, k n),
    i.e. alpha_r = r n / m for r = 1..k. The r = 1 rung IS the underlying UOV
    map composed with an invertible matrix (D_1(C) = sum_i c_{i1}^2 E_ii, which
    is invertible for a field-based emulsifier), so the ladder's bottom rung is
    literally the plain-UOV direct attack and its top rung is the whipped one.
    The attacker's cost is min over r, and the security estimate must be the
    same minimum.

    THE ACCOUNTING TO AUDIT (RECALLED, UNVERIFIED -- this is the load-bearing
    recalled item and the audit's first job is to replace it with the real
    formula). The Thomae-Wolf reduction for underdetermined MQ is recalled as:
    given m quadratic equations in n = alpha m variables over F_q, one reduces
    to solving a system of about m - floor(alpha) + 1 equations in as many
    variables. Hashimoto's algorithm and the pseudo-oil generalisation of
    KN-LIT-1818 are recalled as improving the trade in some ranges. TAKING THE
    RECALLED FORM ONLY AS AN ILLUSTRATION OF THE SHAPE, the removable-equation
    count R(alpha) = floor(alpha) - 1 gives, on the recalled parameters:
      plain UOV Level I (q = 256, n = 112, m = 44): alpha = 2.55, R = 1,
        reduced system about 43 equations;
      MAYO Level I (q = 16, n = 66, m = 64, k = 9): the ladder is
        alpha_r = 66 r / 64 = 1.03 r, so R(alpha_r) = floor(1.03 r) - 1 =
        0, 1, 2, 3, 4, 5, 6, 7, 8 for r = 1..9, and the top rung removes 8
        equations, reducing 64 to 56.
    THE STAIRCASE R(alpha_r) = floor(r n / m) - 1 IS THE FORCED VALUE OF THIS
    PROPOSAL: it is derived before any run, it is monotone non-decreasing in r,
    its step positions are determined by n/m alone, and it can be wrong in a
    visible way.

    AN EXPLICIT TRAP, NAMED SO THAT NOBODY IN THIS PROGRAM WALKS INTO IT. The
    recalled staircase's top value is 8 EQUATIONS, and KN-LIT-1818 reports a
    reduction of 8 BITS against MAYO Level I. THESE ARE DIFFERENT QUANTITIES
    AND THEIR NUMERICAL COINCIDENCE UNDER RECALLED PARAMETERS MEANS NOTHING. An
    equation removed from an MQ system is worth many bits or few depending
    entirely on the solver's cost model; equating them would be a fabrication
    under AGENTS.md rule 5. Any record that cites both numbers must state this
    sentence.

    WHY THE LADDER MIGHT NOT BE FREE, AND HOW TO TELL (DERIVED). Three ways the
    r < k rungs could fail to be genuine operating points, all cheap to check:
    (i) DEFECT. If delta(C) > 0 the rung has fewer than m equations, which
    helps the attacker further and is IDEA-20260805-74e78c's object.
    (ii) STRUCTURE. The rung's system is not a generic MQ system -- its m
    equations are built from r(r+1)/2 shared polar values of ONE underlying
    map, compressed by r(r+1)/2 fixed matrices. A generic-system reduction
    whose derivation assumes independent coefficients may not apply verbatim.
    THIS CUTS BOTH WAYS and the record refuses to guess which: the structure
    could obstruct the reduction (making the published estimate conservative)
    or could supply exactly the partial linearity such reductions look for
    (making it optimistic). Deciding it is a reading-plus-derivation task, and
    it is the single most valuable thing in this proposal.
    (iii) FORGERY VERSUS RECOVERY. The direct attack must hit a target t, not
    zero. On a slice the reachable targets are the image of the slice map; if
    that image is a proper subspace of F_q^m the attacker grinds the salt, and
    the grinding factor must be charged. At delta = 0 with r large the image is
    expected to be everything and the factor is 1, but 'expected' is a
    heuristic and it is named as HEUR-MAYO-ALPHA-2 rather than assumed.

    WHAT THE AUDIT PRODUCES. A table, per MAYO parameter set and per matched
    plain-UOV parameter set at the same claimed level, with columns: q, n, m,
    o, k; alpha_1..alpha_k; R(alpha_r) under each named reduction; the alpha at
    which the specification's own published estimate was computed (quoted);
    the argmin rung; and a MEMORY column, because the session ANGLE-BRIEF
    measures 82 of 229 evidence records in this corpus never mentioning memory
    and the house exemplar is a memory-Pareto-incomparable result. If the
    specification already charges the argmin rung, the audit closes with 'the
    published accounting is correct and here is the derivation that shows it',
    which is a real deliverable for a goal whose first completion horn is a
    matched baseline.

  novelty_status: unverified

  literature_context:
    - >-
      KN-LIT-1818 (Ostuzzi, iacr:2026/1122). NOT READ -- corpus entry read,
      paper not. Relayed: MAYO and QR-UOV security rests on underdetermined MQ;
      the work reinterprets Hashimoto's algorithm as computing a pseudo-oil
      subspace, distributes work across more than two Groebner steps, and
      lowers the Level I direct attack by 8 bits (MAYO) and 10 bits (QR-UOV).
      The entry is bulk-seeded, its own body disclaims verification, and its
      'Relevance to this program' section is boilerplate about MOV/Frey-Ruck
      and GLV/GLS that does not describe the paper. USED HERE ONLY TO ESTABLISH
      THAT THE UNDERDETERMINED FAMILY IS THE LIVE ONE, never for a number.
    - >-
      Thomae-Wolf and Kipnis-Patarin-Goubin underdetermined-MQ reductions, and
      Hashimoto's algorithm: RECALLED, UNVERIFIED. No paper read. The recalled
      form m - floor(alpha) + 1 is a CANDIDATE TO CHECK and its verification is
      Stage 0 step 2. If it is wrong the staircase changes shape but the
      ladder observation is unaffected, because the ladder is about which
      systems are admissible, not about how they are solved.
    - >-
      MAYO Round-3 specification: NOT OBTAINED, NOT READ. Round-3 tweaks
      recorded as due 2026-08-14 (GOAL-MAYO-001 scheme_context). Every
      parameter figure here is RECALLED, UNVERIFIED.
    - >-
      GOAL-UOV-001 owns the plain-UOV cost calibration and explicitly warns
      that three independently derived UOV cost conventions would make the
      dependent goals' Pareto comparisons meaningless. This proposal therefore
      fixes NO cost convention of its own: it reports R(alpha) under whichever
      named conventions are available and shows whether the verdict depends on
      the choice.

  lossy_projection_identifiability_audit:
    projection: >-
      The whipped public map and a chosen slice --> the pair
      (equations, variables) = (m, r n), and thence to the single integer
      R(alpha_r).
    what_is_discarded: >-
      Everything except two integers per rung. The coefficients, the field
      structure, the emulsifier, and the oil space are all discarded.
    why_genuinely_lossy: >-
      Maximally lossy. The fibre over a rung is the entire space of MQ systems
      with that shape.
    why_compatible_with_the_operations: >-
      Compatible in the only sense the cost question needs: published
      underdetermined-MQ complexity statements are themselves functions of
      (equations, variables, q) alone, so the projection is exactly the
      argument those statements take. It propagates deterministically because
      slicing acts on the pair by (m, rn) -> (m, r'n) with no residual.
    is_it_only_a_change_of_coordinates: >-
      No, and the failure mode CHECKED FOR here is the mirror one -- a
      projection so lossy it is CONSTANT across the objects compared. IT IS NOT
      CONSTANT, and the comparator spread is the entire deliverable: the
      staircase R(alpha_r) takes 9 distinct values across the recalled MAYO
      Level I ladder and a different value for matched plain UOV. The residual
      danger, stated plainly, is the OPPOSITE of constancy: this projection
      cannot see whether the rung's system is generic, so it will happily
      report a rung that no solver can actually attack at the quoted cost.
      That blindness is why confounder (ii) in the mechanism is elevated to a
      named heuristic rather than left as a caveat.

  assumptions:
    - >-
      That the emulsifier defect is 0, so every rung really carries m
      equations. This is IDEA-20260805-74e78c's forced value and is assumed
      here; if it fails, the ladder is even more favourable to the attacker and
      this proposal's numbers are conservative.
    - >-
      That restricting to a slice costs the attacker nothing beyond the lost
      variables. No search over C is needed -- any C of rank r will do for the
      counting -- so the restriction is free by construction.
    - >-
      That a published security estimate can be checked against the ladder,
      i.e. that the specification states which system it costed. If it does
      not, the audit's finding is that the accounting is not reconstructible,
      which is itself a reportable result about a Round-3 submission.

  predictions:
    - metric: >-
        R_staircase: the removable-equation count R(alpha_r) as a function of
        r = 1..k, computed from the published parameters under each named
        underdetermined-MQ reduction
      direction: higher
      minimum_effect: >-
        MONOTONE NON-DECREASING in r, with step positions at the integers of
        r n / m. Under the recalled MAYO Level I parameters the predicted
        sequence is exactly 0, 1, 2, 3, 4, 5, 6, 7, 8 for r = 1..9. A measured
        staircase that is not monotone, or whose steps fall elsewhere, refutes
        the recalled reduction formula and sends the audit back to Stage 0.
    - metric: >-
        argmin_rung: the r minimising the substituted cost model
      direction: different
      minimum_effect: >-
        PREDICTED r = k (the full whipped system) under any cost model monotone
        in alpha. An argmin strictly inside 1 < r < k would mean the cost model
        is non-monotone in alpha, which is a finding about the cost model and
        must be reported before any MAYO conclusion is drawn.
    - metric: >-
        spec_charged_alpha: the alpha at which the MAYO specification's own
        direct-attack estimate is computed, read and quoted
      direction: different
      minimum_effect: >-
        PREDICTED alpha_k = k n / m, i.e. the specification already charges the
        top rung and the audit confirms the accounting. If the quoted estimate
        is computed at any smaller alpha, the published direct-attack figure is
        evaluated at a non-optimal operating point and the gap is quantifiable
        -- which would be the interesting outcome and is why the audit is worth
        running despite the confirmatory prediction.
    - metric: >-
        matched_level_ratio: alpha_k(MAYO) / alpha(plain UOV) at the same NIST
        level
      direction: higher
      minimum_effect: >-
        PREDICTED about 3.6 at Level I under recalled parameters (9.28 / 2.55).
        Below 1.5 would mean whipping does not materially change the
        underdetermination exposure and this proposal's premise is wrong.
    - metric: >-
        convention_dependence: whether the argmin rung and the MAYO-vs-UOV
        ordering change between at least two named cost conventions
      direction: different
      minimum_effect: >-
        Reported either way. A verdict that flips between conventions is a
        result about the conventions and must be published as one rather than
        resolved by picking a favourite (AGENTS.md retrieval policy item 7).

  minimal_test:
    design: >-
      Entirely pen-and-paper plus integer arithmetic; no solver, no field
      arithmetic, no MQ run. Three stages, and stage 1 can end the line.
      STAGE 0 (reading): obtain (a) the MAYO Round-3 specification's parameter
      table AND its direct-attack security estimate, quoting which system it
      costs; (b) the exact statement of at least one underdetermined-MQ
      reduction, from the primary source or from KN-LIT-1818's own text; (c) a
      matched plain-UOV parameter set at the same claimed level. Record
      precisely which sources were tried and what each returned; ePrint
      abstract pages were measured at HTTP 200 and ePrint PDF bodies at 403 by
      the session literature sweep, so partial success is expected and must be
      logged rather than smoothed over.
      STAGE 1 (arithmetic, minutes): build the ladder and the staircase; locate
      the argmin; compare against the quoted spec estimate. If the spec charges
      the argmin rung, the audit CLOSES with a confirmation and the derivation
      that justifies it.
      STAGE 2 (structure check, pen and paper): take the named reduction's
      requirement on its input system (which coefficients must be generic, what
      change of variables is applied) and check it against the whipped system's
      actual shape from the slice identity. Report whether the reduction is
      applicable verbatim, applicable with modification, or blocked.
    controls:
      - >-
        NULL OBJECT WITH A FORCED VALUE THAT CAN FAIL: a SQUARE system,
        alpha = 1 exactly. Every underdetermined reduction must remove ZERO
        equations there, R(1) = 0, because there is no excess to trade. If the
        implemented staircase returns a positive value at alpha = 1 the formula
        as transcribed is wrong and no number downstream is usable. This costs
        one line and it is the cheapest possible check on the transcription.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: a
        massively underdetermined system at alpha >= m, where the recalled
        polynomial-time regime is reached and the reduction must remove enough
        equations to trivialise the system. If the staircase does not show the
        known easy regime at large alpha, the instrument does not reproduce the
        baseline and NO conclusion about MAYO may be drawn (inventor protocol
        section 8, audit 1).
      - >-
        SECOND POSITIVE CONTROL, EXTERNAL AND INDEPENDENT: QR-UOV, for which
        KN-LIT-1818 relays a 10-bit reduction against Level I. The same
        accounting applied to QR-UOV's parameters must place it on the same
        side of the comparison as MAYO. If the accounting says QR-UOV is not
        underdetermined at all, the accounting is wrong, because the relayed
        source says the same technique moved both.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS: the ladder itself is the graded
        control. r = 1..k gives k rungs with a predicted monotone staircase and
        predicted step positions; a non-monotone or mis-stepped measurement
        localises the error in the transcribed formula rather than leaving a
        bare disagreement.
      - >-
        ARCHIVE CHECK: no prior cost accounting for MAYO exists in this corpus
        on any axis. Recorded as unavailable rather than as a passed check.
    required_metrics:
      - the quoted specification parameter table and direct-attack estimate, with source and version
      - the quoted reduction statement, with source
      - the full ladder and staircase per parameter set
      - the argmin rung and the spec-charged rung side by side
      - a memory column for every cost cell, or an explicit statement that the source gives none
      - the alpha = 1 null and large-alpha positive control outputs

  falsification_conditions:
    - >-
      The specification's estimate is already computed at the argmin rung. The
      audit's premise that a rung might be missed is refuted and the deliverable
      becomes a confirmation -- which is a legitimate and useful outcome, not a
      failure, and must not be dressed as a finding.
    - >-
      The r < k rungs are not admissible, because the slice-restricted system
      loses equations, gains constraints, or falls outside the reduction's
      hypotheses. The ladder collapses to a single point and the proposal's
      structural observation is wrong.
    - >-
      R(1) > 0 in the transcribed formula. The transcription is wrong.
    - >-
      The recalled reduction formula does not survive Stage 0. The staircase's
      numbers are void; the ladder survives.

  confounders:
    - >-
      THE NUMERAL 8. The recalled staircase's top value (8 equations) and
      KN-LIT-1818's relayed figure (8 bits) are different quantities under
      different units and their agreement is a coincidence of recalled
      parameters. Stated in the mechanism and repeated here because it is the
      most likely way this record gets misread.
    - >-
      RECALLED EVERYTHING. Parameters, the reduction formula, and the matched
      UOV parameter set are all from memory. The record is structured so that
      the LADDER (derived) survives any correction to them and only the
      STAIRCASE (recalled) is at risk.
    - >-
      GENERIC-SYSTEM ASSUMPTION. Every underdetermined-MQ complexity statement
      known to this session is derived for generic systems, and the whipped
      system is not generic. This is the same semi-regularity exposure the
      session ANGLE-BRIEF measures across 24 files of this corpus, and it is
      named as HEUR-MAYO-ALPHA-1 rather than inherited quietly.
    - >-
      A CONFIRMATORY AUDIT IS CHEAP TO PRODUCE. The predicted outcome is that
      the specification is right. The null and both positive controls exist so
      that a confirmation has to survive an instrument that could have
      disagreed.

  interpretation_limits:
    - >-
      NO ATTACK, NO BITS, NO EXPONENT CLAIMED. This is a charging convention
      and a table. Any bit figure appearing in a downstream record must come
      from a named, verified cost model and must cite it.
    - >-
      The audit says nothing about whether the underdetermined-MQ techniques
      are correct. It says only which system they should be pointed at.
    - >-
      Claim tier: theory/derivation for the ladder; anything drawn from the
      substituted cost model inherits that model's tier, which for
      KN-LIT-1818's figures is RELAYED AND UNVERIFIED and therefore below
      anything this program may assert.

  heuristic_assumptions:
    - id: HEUR-MAYO-ALPHA-1
      statement: >-
        LOAD-BEARING. FORALL r in 1..k and FORALL C of rank r, the
        slice-restricted whipped system behaves, for the purposes of a published
        underdetermined-MQ complexity statement, like a generic system of m
        quadratic equations in r n variables over F_q.
      random_model_justification: >-
        The usual justification is that the public key of a UOV-type scheme is
        designed to be indistinguishable from a random quadratic map, so
        generic-system complexity applies. THAT ARGUMENT IS WEAKER HERE THAN
        USUAL AND THE RECORD SAYS SO: the slice system's m equations are built
        from only r(r+1)/2 shared polar values of ONE underlying map, compressed
        by r(r+1)/2 fixed public matrices, so its coefficients satisfy exact
        algebraic relations that a generic system does not. Indistinguishability
        of the public key does not imply genericity of a structured restriction
        of it.
      supporting_results: >-
        None cited; none read. The session ANGLE-BRIEF records semi-regularity
        as the standout unvalidated assumption of this corpus (24 files, 13
        experiment contracts) and as exactly the assumption known to fail for
        structured systems.
      validation_experiment_ids: []
      falsification_condition: >-
        Stage 2's structure check finds the reduction's genericity hypotheses
        violated by the slice system. The staircase is then not a cost statement
        for MAYO at all, and reporting it as one would be the error this
        heuristic exists to prevent.
    - id: HEUR-MAYO-ALPHA-2
      statement: >-
        The image of the slice-restricted whipped map is all of F_q^m, so a
        forger on a rung pays no salt-grinding penalty.
      random_model_justification: >-
        Expected for a surjective-looking quadratic map with r n >> m, but
        'expected' is not derived, and at small r it is plainly false in the
        interesting cases -- if the emulsifier defect is nonzero the image is a
        proper subspace by construction (IDEA-20260805-74e78c). The two
        heuristics are therefore coupled and must be reported together.
      supporting_results: >-
        None.
      validation_experiment_ids: []
      falsification_condition: >-
        A toy computation of the image dimension of the slice map at small
        (q, n, m, k) showing a proper subspace at any rung with delta = 0.

  target_complexity:
    time_exponent: >-
      No exponent is claimed or moved. The audit fixes WHICH system's exponent
      is the MAYO direct-attack exponent: m equations in k n variables, not m
      in n. If the specification already charges that system, the audit moves
      nothing and says so.
    memory_exponent: >-
      Not derived here, and its ABSENCE from the sources is part of what the
      audit reports. Underdetermined-MQ reductions feed a Groebner or
      hybrid solver whose memory is frequently the binding constraint, and a
      direct-attack figure quoted without memory is incomplete under
      docs/target-result-profile.md. The audit table carries a memory column
      even when the only honest entry is 'source states none'.
    best_known: >-
      MAYO Level I direct attack, 8 bits below the published figure, per
      KN-LIT-1818 -- RELAYED, UNVERIFIED, and not a number this program may
      assert.
    hidden_overhead: >-
      The rung choice hides nothing (slicing is free), but the reduction's own
      cofactors and the solver's constants are entirely hidden in this
      accounting and are not estimated.
    tradeoff_note: >-
      Equations against variables, monotone along the ladder. The whole point
      of tabulating the ladder is that the trade is explicit rather than
      implicit in a single quoted figure.

  dominated_by: >-
    n/a (no attack, no Pareto point offered). The frontier this audit describes
    is the best-known direct attack on MAYO, whose only in-corpus statement is
    KN-LIT-1818's relayed 8 bits. Rows checked: ledger/proposals (all MAYO/UOV
    records IDEA-20260801-013..018 -- none costs anything), ledger/questions
    RQ-MAYO-001 and RQ-UOV-001, ledger/goals GOAL-MAYO-001 and GOAL-UOV-001,
    the three corpus literature entries mentioning MAYO, and
    knowledge/techniques (no UOV or MAYO entry). Axes checked: time (no
    in-corpus figure), memory (no in-corpus figure, and none in the relayed
    external entry either), data/queries (not applicable to a key-only direct
    attack; the signature-count axis belongs to IDEA-20260805-19990a). The
    frontier is EMPTY IN THIS CORPUS and that emptiness is the reason
    GOAL-MAYO-001's next_action demands a baseline before anything else.
  sota_delta: >-
    Zero on every attack axis. The quantitative deliverable is the ladder
    {alpha_r = r n / m : r = 1..k} and the staircase R(alpha_r), predicted as
    0,1,2,...,8 at MAYO Level I under recalled parameters, set beside plain
    UOV's single value (R = 1 at alpha = 2.55) at the same claimed level -- a
    ratio of about 3.6 in alpha and a difference of about 7 removable
    equations, both derived at zero compute and both currently absent from the
    corpus.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.20 that the audit finds the specification charging a non-optimal rung.
    Not lower: the ladder observation is not obvious, no in-corpus record makes
    it, and a submission's security analysis is written against the attacks its
    authors enumerate rather than against a free-choice argument nobody stated.
    Not higher: MAYO's designers chose k deliberately and the direct-attack
    estimate at k n variables is the obvious thing to compute, so the most
    likely outcome by a wide margin is confirmation. 0.85 that the audit
    reaches a decisive reading, limited only by whether the Round-3
    specification can be obtained -- which is a declared pause condition of the
    goal and must be reported as infrastructure signal, never as a
    mathematical result (AGENTS.md rule 5).
