# IDEA-20261003-8b842f
# Doubling-count for the integer 8. Proposal only. Not approved.
idea:
  id: IDEA-20261003-8b842f
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The integer 8 has bit length 4 and is reached by 3 doublings
  class: measurement
  claim: >-
    The integer 8 has bit length 4. It is reached from 1 by 3
    doublings and 0 additions. Four exceeds three by 1. The product
    of the bit length and the doubling count is 12. The sum of the
    bit length, the doubling count, and the addition count is 7.
    These are writing counts, not an ECDLP exponent.
  mechanism: >-
    The object is the binary writing of 8, which is the bits 1, 0,
    0, 0. Each step from 1 to 2 to 4 to 8 is a doubling. No bit
    after the leading 1 is set, so the addition count is 0. Two
    readings of 8 have the same doubling count, so that gap is 0.
    No scalar is recovered.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group lower bound is a different object from a bit length.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The integer 8 is frozen before the count.
    - No curve point is doubled.
  proof_search_map:
    bottleneck: The excess 1 of the bit length over the doubling count.
    baseline_embedding:
      parameter_slice: The integer 8, the length 4, and the doublings 3.
      reproduction_check: >-
        Two readers must agree that the bit length is 4 and the
        doubling count is 3.
    observation_collision:
      observable: The length 4 and the doubling count 3.
      distinct_preimage_search: >-
        Reporting the bit length as 3 drops the excess 1. Two
        readings of 8 have doubling gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The integer 8.
        predicted_gain: Integer counts. No walk.
    quantifier_order: >-
      The integer is fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The length 4 and the doubling count 3. Not a scalar
        multiplication.
      nearby_object_control: >-
        Two readings of 8. Both have 3 doublings, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 8 is 4.
        responsibility: size
      - claim: The doubling count from 1 to 8 is 3.
        responsibility: size
      - claim: The addition count is 0.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: length_gap
      direction: different
      minimum_effect: Four exceeds three by 1.
  minimal_test:
    design: >-
      Count the bits of 8 and the doublings from 1 to 8. Do not
      double a curve point.
    controls:
      - Two readings of 8, whose doubling gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
  falsification_conditions:
    - The bit length is not 4.
    - The doubling count is not 3.
  confounders:
    - A different binary convention that drops the leading 1 changes the length.
  interpretation_limits:
    - A doubling count is not a walk length.
    - No transfer to a cryptographic scalar.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen writing of 8 is four bits, and the frozen chain
        from 1 to 8 is three doublings and no addition.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: A different addition chain can use more additions.
    tradeoff_note: Fewer additions on this integer is not a shorter discrete-log walk.
