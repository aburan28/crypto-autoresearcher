idea:
  id: IDEA-20261007-1f3eaf
  question_id: RQ-JINV-8fc13a
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    The j=1728 map on y^2 = x^3 + 11x over F_37 squares to negation
  class: control
  claim: >-
    Let E be y^2 = x^3 + 11x over F_37. If the discriminant is 0 the
    model is singular and the run is an invalid setup. Otherwise let
    i be the least integer in {1, ..., 36} with i^2 congruent to -1
    modulo 37. If no such i exists, the setup is invalid. Define
    phi(x, y) = (-x, i*y). For every affine point P = (x, y) with y
    different from 0, phi(phi(P)) equals (x, -y). The number of
    failures is exactly 0. One failure is a negative. This is the
    relation phi^2 = [-1]. It does not count the automorphism group,
    it does not run a walk, and it does not restate a denominator
    comparison. No discrete logarithm is computed, and the
    generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the affine
    point and Sigma is the coordinate map phi. Explanation A: phi^2
    equals [-1] on this model, so the formula is the known order-4
    automorphism and the exponent stays 1/2. Explanation B: at least
    one scored point fails, so this formula is not that automorphism.
    KR-RHO-0528e7, opened, prices j = 1728 as the constant sqrt(4).
    This check does not measure a walk.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m gives rho a constant factor
        sqrt(m). For j = 1728 the factor is sqrt(4). The exponent
        stays 1/2.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. This relation check does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether special j-invariants confer an
        ECDLP advantage beyond the automorphism-quotient constant.
      verified_by: ledger/questions/RQ-JINV-8fc13a.yaml
  assumptions:
    - The map is the coordinate formula above. A different endomorphism is out of scope.
    - Points with y = 0 are 2-torsion and are not scored as failures of phi^2 = [-1].
    - If the model is singular, or if -1 is not a square modulo 37, the setup is invalid.
  proof_search_map:
    bottleneck: >-
      Whether phi composed with itself is negation on every affine
      point with nonzero y.
    baseline_embedding:
      parameter_slice: one short-Weierstrass model at p = 37 with B = 0
      reproduction_check: >-
        phi(phi(P)) is computed from the field operations only. A
        second implementation that disagrees voids the count.
    observation_collision:
      observable: the number of affine points with y nonzero and phi(phi(P)) different from -P
      distinct_preimage_search: >-
        The relation can hold for every scored point or fail for one.
        One failure kills explanation A.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the single model y^2 = x^3 + 11x over F_37
        predicted_gain: a failure count of 0. No exponent.
    quantifier_order: >-
      On this one model, for every scored point, the relation holds.
      This is not every j = 1728 curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        The formula squares to negation on this model, or it fails
        for at least one scored point.
      nearby_object_control: >-
        A point with y = 0 is recorded and not entered in the failure
        count. If every affine point has y = 0, the setup is invalid.
    proof_obligations:
      - claim: the model is nonsingular and -1 is a square
        responsibility: baseline
      - claim: the failure count is 0
        responsibility: strictness
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this model.
  predictions:
    - metric: number of scored points with phi(phi(P)) different from -P
      direction: lower
      minimum_effect: exactly 0
    - metric: number of scored points
      direction: higher
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Enumerate x in 0 through 36. Keep both square roots of
      x^3 + 11x when they exist. Skip y = 0. Apply phi twice and
      compare with (x, -y). Count disagreements. Check the
      discriminant and the existence of i before scoring. Do not run
      a walk and do not build a factor base.
    controls:
      - The discriminant is nonzero. Otherwise the setup is invalid.
      - i exists and i^2 is congruent to -1 modulo 37.
      - At least one scored point exists. Otherwise the setup is invalid.
      - A point with y = 0 is not counted as a failure.
    required_metrics:
      - failure_count
      - scored_point_count
      - i
      - discriminant
  falsification_conditions:
    - The model is nonsingular, i exists, at least one point is scored, and the failure count is at least 1.
    - The model is singular, or -1 is not a square, or no point is scored. That run is an invalid setup and is not the negative.
  confounders:
    - The choice of the least positive i, rather than -i, changes the sign of phi and not phi^2.
    - Reduction modulo 37 of a global CM endomorphism can fail on a singular model. The singular case is refused.
  interpretation_limits:
    - A failure count of 0 does not lower the exponent below 1/2.
    - The scope is this one model at p = 37.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On y^2 = x^3 + A x over a prime p congruent to 1 modulo 4,
        with nonzero discriminant, (x, y) -> (-x, i y) satisfies
        phi^2 = [-1] on every affine point with y nonzero. This
        imitates the j = 1728 automorphism. It is not a walk length.
      rigorous_support: >-
        KR-RHO-0528e7, opened, states the constant-factor gain for
        j = 1728 and does not evaluate this map at p = 37.
      validation_plan: >-
        At this one model, record the failure count. If it is at
        least 1, H1 is false here. If the setup is invalid, refuse
        the comparison. No second prime.
  target_complexity:
    time_exponent: >-
      One pass over 37 field elements. The generic-group exponent
      1/2 is unchanged.
    memory_exponent: O(1) field elements
    best_known: >-
      KR-RHO-0528e7, opened, gives a constant factor sqrt(4) and
      leaves the exponent at 1/2. KR-RHO-13bf67, opened, gives the
      square-root generic bound. This relation beats neither.
    hidden_overhead: >-
      The check does not implement a walk. That gap is stated in the
      claim and is not hidden in an o(1) term.
    tradeoff_note: >-
      No time-memory tradeoff. No rho iteration is counted.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row says the j = 1728 advantage is the constant
          sqrt(4). This idea adds one failure count, predicted
          exactly 0, for phi^2 = [-1] on y^2 = x^3 + 11x over F_37.
          The square-root exponent is unchanged.
  dominated_by: >-
    KR-RHO-0528e7 dominates any reading of this relation as a
    speedup, because the opened row already prices the j = 1728
    automorphism as a constant factor. Pollard rho, at the
    square-root exponent in KR-RHO-13bf67, dominates the same
    reading. The relation does not beat either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the failure
    count, predicted exactly 0, at the prime 37. The generic-group
    exponent stays 1/2.
