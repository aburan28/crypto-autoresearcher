idea:
  id: IDEA-20260816-dd425d
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: Restate SNFS trapdoor detection as a decision problem over the hypothesis class C(d,H) of
    primes admitting a degree-d integer polynomial with coefficients bounded by H, and measure the
    power-lattice shortest-vector detector ROC against random primes of identical bit length
  class: measurement
  claim: '(A) FIX THE CLASS. Define C(d,H,n) as the set of n-bit primes p for which there exist an
    integer m and a polynomial f in Z[x] of degree exactly d with max coefficient magnitude at most
    H such that f(m) = p. This is a hypothesis class an experimenter can both sample from and test
    membership in, which is what the RQ-SNFS-005666 headline phrase lacks. (B) FIX THE DETECTOR. For
    a candidate base m, let L(p,m) be the rank-(d+1) integer lattice of coefficient vectors a with
    sum a_i m^i congruent to 0 mod p. Its determinant is p whenever m generates, so the Gaussian heuristic
    gives an expected first minimum of about sqrt((d+1)/(2 pi e)) times p^(1/(d+1)). If p lies in
    C(d,H) with witness (f,m), then f itself lies in L(p,m) with norm at most sqrt(d+1) H, which for
    H much below p^(1/(d+1)) is anomalously short. The detector statistic is D(p) = min over m in
    a declared grid of log2 of the ratio between the LLL-reduced first basis vector norm and the Gaussian-heuristic
    value. (C) THE MEASURABLE. The deliverable is a full ROC of D over matched arms: planted primes
    drawn from C(d,H) with recorded seeds, and random n-bit primes of the same length, with false-positive
    rate read off the null arm rather than assumed. (D) THE PROPAGATION LAW, which is the part that
    makes this more than curve fitting. The substitution x maps to x+1 carries L(p,m+1) onto L(p,m)
    by the Pascal matrix, which is unimodular with operator norm at most 2^d. Hence log2 of the first
    minimum is 2^d-Lipschitz per unit step in m, the anomaly survives a window of about (log2(p^(1/(d+1))/H))/d
    grid steps around the true m, and a grid of stride s cannot certify absence unless s is inside
    that window. (E) WHAT IS NOT CLAIMED. No attack, no factorization, no discrete logarithm, and
    no statement about any published, deployed or real parameter set. A positive detection on a self-planted
    prime is a statement about a self-planted prime. A non-detection is a statement about this grid,
    this reduction budget and this class, never about detectability in general and never about any
    prime this program did not itself generate.'
  mechanism: 'STAGE ONE, symbolic and free: derive the Gaussian-heuristic normalisation for det L(p,m)
    = p at rank d+1, and derive the Pascal-matrix Lipschitz constant 2^d, both checked against exact
    integer computation on ten hand-built cases. STAGE TWO: implement the class sampler. Draw f with
    coefficients uniform in [-H,H] and leading coefficient nonzero, draw m in the interval where f(m)
    has n bits, test f(m) for primality by Miller-Rabin with fixed witness set, and retain the pair
    with its seed. Ground truth is the recorded witness (f,m), so membership is never inferred. STAGE
    THREE: implement the null sampler, uniform n-bit primes from the same primality routine, so that
    any difference in primality testing cancels. STAGE FOUR: implement an exact-arithmetic LLL over
    fractions.Fraction on the basis {(p,0,...,0), (-m,1,0,...), (0,-m,1,...), ...} and compute D(p)
    on both arms over an identical m-grid with an identical per-prime call budget. STAGE FIVE: sweep
    the grid stride and read the measured detection window against the predicted (log2(p^(1/(d+1))/H))/d.
    The claim is established if the ROC on the planted arm separates at a threshold the null arm does
    not reach and the measured window matches the derived law within a stated factor; it is refuted
    if the null arm reaches the same D values at comparable rate, which would mean the statistic measures
    lattice reduction behaviour rather than planted structure, or if the window does not track the
    derived law, which would mean the Pascal bound is not the operative constraint.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: ledger/questions/RQ-SNFS-005666.yaml, ledger/questions/RQ-RSA-afe33c.yaml,
      ledger/questions/RQ-RSA-d46f02.yaml, ledger/goals/GOAL-SNFS-001.yaml, docs/inventor-protocol.md.
      Greps run from the repository root: grep -ril SNFS over ledger/ knowledge/ docs/; grep -ril
      -E ''trapdoor|SNFS|special number field'' ledger/proposals/; grep -ril -E ''base-m|power lattice|f\(m\)
      = p'' ledger/proposals/; grep -ril -E ''special.form|SNFS'' ledger/hypotheses/; grep -ril -E
      ''detectab'' ledger/proposals/ ledger/hypotheses/. Headers inspected for the near hits: IDEA-20260814-c3af09,
      IDEA-20260807-070d03, IDEA-20260815-8dcde2, IDEA-20260809-1d1734, IDEA-20260808-0cdd09, IDEA-20260805-1775f2.'
    results: RQ-SNFS-005666 carries zero proposals. The hypotheses directory returned zero files matching
      SNFS or special form, so no hypothesis in the ledger touches this object. The proposals grep
      for power lattice and base-m returned IDEA-20260814-c3af09 and IDEA-20260807-070d03, both under
      ECDLP questions and both about Semaev decomposition and factor-base oracles rather than integer
      moduli. IDEA-20260809-1d1734 is the only record about special-form primes as such and it measures
      what the special form gives the SIEVE for pairing-friendly primes under RQ-PAIR-f2e31f, with
      its own novelty screen recording that the corpus grep for special form returned only GOAL-SNFS-001.
      IDEA-20260808-0cdd09 and IDEA-20260805-1775f2 are the GNFS cost-model lane under RQ-RSA-afe33c
      and neither defines a classifier. IDEA-20260815-8dcde2 is the nearest trapdoor-shaped record
      and it derives an advantage inequality for secret isogeny chains under RQ-ECTD-001, a different
      object entirely.
    verdict: 'UNVERIFIED. No agent in this environment can read external literature, so nothing here
      asserts what is or is not published. Claimed new relative to this repository: the specific pairing
      of the class C(d,H) with a normalised power-lattice first-minimum statistic and a measured ROC
      against a matched random-prime null, plus the Pascal-matrix Lipschitz bound used to derive a
      predicted detection window in the base grid. Assembled from known parts: lattice reduction,
      the Gaussian heuristic, and the observation that a short vector in a modular lattice encodes
      a small-coefficient relation are all standard machinery, and the base-m construction of a number-field-sieve
      polynomial is the textbook construction that GOAL-SNFS-001 already names. The assembly, not
      the parts, is what is offered.'
  object_first_candidate:
    tracked_object: 'The normalised first-minimum profile of the power lattice: the function m maps
      to log2(lambda_1(L(p,m)) / GH(d+1,p)) evaluated over a declared grid of bases m, where GH is
      the Gaussian-heuristic value for a rank-(d+1) lattice of determinant p. The object followed
      through the computation is this real-valued profile, not the prime and not the polynomial.'
    lossiness: 'Genuinely lossy. The profile discards which polynomial realises the minimum, all d+1
      of its coefficients, the residues of p modulo anything, and the identity of p itself; what survives
      is one real number per base. Many distinct witnesses (f,m) with the same coefficient norm project
      to the same profile value, so the fibres of the projection are large and the map is far from
      injective. The retained scalar still propagates because the operations that move the computation
      forward, namely changing the base m and changing the reduction budget, act on lattice geometry
      and therefore on lambda_1 directly, without needing the discarded coefficients. This is not
      merely a change of coordinates: from the profile one cannot reconstruct the polynomial, which
      is precisely why the detector can be run on a prime whose witness is unknown.'
    propagation: One step of the target operation is m maps to m+1. Substituting x maps to x+1 sends
      any a in L(p,m+1) to the polynomial a(x+1) in L(p,m), and the coefficient map is the Pascal
      matrix P_d, which is unimodular with entries the binomial coefficients, so its operator norm
      on the Euclidean norm is at most 2^d. Therefore lambda_1(L(p,m)) lies between 2^(-d) and 2^d
      times lambda_1(L(p,m+1)), and log2 of the normalised profile changes by at most d per unit step
      in the base. Over a stride of s steps the bound compounds to d times s. The determinant is invariant
      at p throughout, so the normalisation itself does not move.
    survival_score: The planted anomaly survives a base window of predicted half-width W = (log2(GH(d+1,p))
      - log2(sqrt(d+1) H)) / d steps around the true base m0, after which the Lipschitz bound permits
      the profile to return to null levels and the structure dissolves. For n = 64, d = 3 and H =
      64 this is about (14.2 - 8) / 3, roughly two steps, so the structure is extremely local in the
      base and the detector is a needle search rather than a broad signal. That number is the concrete
      survival statement and it is directly measurable by walking the grid outward from a known m0.
  null_object_control: 'Uniform random n-bit primes generated by the identical Miller-Rabin routine,
    scored by the identical detector over the identical base grid with the identical per-prime LLL
    call budget, in the same invocation and the same process, with only the sampler swapped. The null
    must show two things for the signal arm to mean anything: first, that the normalised profile on
    random primes concentrates near zero with a spread that does not widen as n grows, so the normalisation
    is doing its job rather than absorbing a size effect; and second, that the fraction of null primes
    whose grid minimum falls below the detection threshold is small and is consistent with the independently
    measured base rate of accidental membership in C(d,H). If the null arm reaches the same minima
    at comparable rate, the result is a controlled null and no detection is recorded.'
  discriminated_from:
  - 'IDEA-20260809-1d1734, pairing-friendly primes as polynomials in a seed: that record asks what
    the special form gives the SIEVE and whether a deployed cost estimate accounts for it. This record
    never runs a sieve and asks only whether the form is visible from p alone.'
  - 'IDEA-20260808-0cdd09 and IDEA-20260805-1775f2, the NFS cost-model lane under RQ-RSA-afe33c: those
    validate a cost model against record computations. Nothing here predicts a running time or reproduces
    a record; the output is a classifier ROC.'
  - 'IDEA-20260815-8dcde2 under RQ-ECTD-001, the trapdoor advantage inequality for secret isogeny
    chains: same shape of question, entirely different object. GOAL-SNFS-001 explicitly partitions
    curve trapdoors to GOAL-ECTD-001 and integer parameter structure here.'
  - 'RQ-RSA-d46f02 and its Coppersmith lattice lane: there the campaign supplies itself known leakage
    and the lattice RECOVERS a factorization. Here nothing is leaked, nothing is factored, and the
    lattice is used only as a measuring instrument on a public value.'
  - 'Generic small-root or short-vector proposals in the corpus: those seek a solution vector. This
    seeks a normalised length statistic and discards the vector, which is why it has a null distribution
    at all.'
  assumptions:
  - The Gaussian heuristic is an adequate normalisation for random lattices of rank d+1 and determinant
    p at the small ranks tested; this is checked empirically on the null arm rather than assumed to
    hold.
  - Exact-arithmetic LLL with a fixed delta returns a first vector within a bounded factor of lambda_1
    at rank at most 8; the achieved factor is measured and reported rather than taken from theory.
  - A planted witness (f,m) recorded at generation time is ground truth for membership in C(d,H);
    this is true by construction and needs no inference.
  - Miller-Rabin with a fixed witness set is adequate for primality at the bit sizes tested, and the
    identical routine is used on both arms so any error cancels between them.
  - The base grid can be centred without cheating in the calibration phase but must be blind in the
    scored phase; the two phases are reported separately.
  predictions:
  - metric: grid-minimum normalised profile, log2 units, planted arm minus null arm median
    direction: lower
    minimum_effect: at least 4.0 log2 units lower on the planted arm at n=64, d=3, H=64
  - metric: area under the ROC curve for D at n=64, d=3, H=64 with the true base inside the grid
    direction: higher
    minimum_effect: 0.95
  - metric: measured detection window half-width in base steps, against the predicted (log2(GH) -
      log2(sqrt(d+1) H)) / d
    direction: different
    minimum_effect: measured within a factor of 2 of the prediction for d in {2,3,4}
  - metric: false-positive rate of D on the null arm at the threshold that gives 90 percent true-positive
      rate on the planted arm
    direction: lower
    minimum_effect: 'no pre-commitment: the floor is set by the accidental-membership base rate, which
      this program has not yet measured, so committing a number here would be inventing it'
  minimal_test:
    design: 'One process, two arms, one scoring function. Generate 200 planted primes at n = 64, d
      = 3, H = 64 with recorded seeds and witnesses, and 200 uniform 64-bit primes from the same primality
      routine. For every prime in both arms, evaluate D over the identical base grid consisting of
      2001 consecutive integers centred on the integer nearest p^(1/3), using an exact LLL at delta
      = 0.99 with a hard cap of 2001 reductions per prime. Emit for each prime its grid minimum, the
      argmin base, the achieved reduction factor, and the wall-clock cost. Compute the ROC directly
      from the two score vectors. The discrimination is immediate: if the planted arm minima sit several
      log2 units below the null arm minima the detector works at this setting, and if they overlap
      it does not, with no modelling step in between. Cost is dominated by 400 times 2001 exact LLL
      calls at rank 4, which is minutes of pure-Python time and no memory beyond a few megabytes.'
    controls:
    - The random-prime null arm, run in the same invocation with only the sampler swapped.
    - 'A shuffled-label control: recompute the ROC after permuting the arm labels, which must return
      an area under the curve of about 0.5.'
    - 'A witness-removed control: score planted primes with the true base excluded from the grid,
      isolating how much of the signal requires hitting the exact base.'
    - 'A reduction-budget control: rerun at LLL delta = 0.75 to show whether the statistic is reduction-quality
      dependent.'
    - A size control at n = 48 and n = 80 with d and H fixed, to check that the normalisation is not
      absorbing a bit-length effect.
    required_metrics:
    - grid-minimum normalised log2 profile per prime, both arms
    - argmin base and its distance from the recorded witness base on the planted arm
    - ROC area under the curve with a bootstrap confidence interval
    - false-positive rate at the 90 percent true-positive threshold
    - measured detection window half-width in base steps
    - achieved LLL approximation factor per call
    - wall-clock seconds and peak resident memory per prime
  falsification_conditions:
  - The null arm reaches the same grid minima at comparable rate, so the statistic is measuring lattice
    reduction behaviour and not planted structure.
  - The shuffled-label control returns an area under the curve materially above 0.5, indicating the
    scoring pipeline leaks the label.
  - The measured detection window does not track (log2(GH) - log2(sqrt(d+1) H)) / d across d in {2,3,4},
    refuting the Pascal-matrix propagation law as the operative constraint.
  - The separation disappears when the true base is excluded from the grid AND the grid is widened,
    showing the detector only works when told the answer.
  - The normalised profile drifts systematically with n on the null arm, showing the Gaussian-heuristic
    normalisation is wrong at these ranks.
  - Achieved LLL approximation factors are so poor that the planted vector is not returned even when
    it is present, making the negative result an instrument outcome rather than a mathematical one.
  confounders:
  - The planted sampler and the null sampler could differ in the distribution of p modulo small primes,
    producing a separation that has nothing to do with the lattice.
  - Grid centring at the integer nearest p^(1/3) is a hint the detector would not have in a blind
    setting; the argmin distance metric exists to expose how much it matters.
  - Exact-arithmetic LLL cost grows with coefficient size, so wall-clock time itself could correlate
    with the arm and leak the label into any timing-derived metric.
  - Small n makes the Gaussian heuristic a poor model, so an apparent null-arm anomaly may be a rank
    and size artifact rather than structure.
  - Fixed Miller-Rabin witnesses could interact with the planted polynomial family if f(m) values
    are constrained modulo the witness primes.
  interpretation_limits:
  - A positive detection is a statement about primes this program planted, at these parameters, and
    about nothing else.
  - A non-detection is scoped to this class, this grid, this stride and this reduction budget, and
    is not evidence that special-form primes are undetectable at any other setting.
  - Nothing here licenses any statement about a published, standardised or deployed parameter set,
    and no record derived from this may name one.
  - The detector cost at cryptographic n is governed by the base-grid size and is not measured here;
    extrapolating the ROC to larger n without the cost accounting would be meaningless.
  target_complexity:
    time_exponent: No attack exponent is claimed. As a detector, the cost is one exact LLL call at
      rank d+1 per grid base, and a complete base sweep for a fixed d has grid size of order p^(1/d),
      so the detection cost exponent is 1/d in log p. At the tested sizes the sweep is enumerated
      exhaustively and the exponent is measured rather than assumed.
    memory_exponent: No attack memory exponent is claimed. The detector holds one rank-(d+1) integer
      basis, so peak memory is O(d^2 log p) bits, about a few kilobytes at every size tested, with
      total process memory dominated by result accumulation at O(number of primes).
    best_known: The incumbent is the inherited, unquantified statement carried in the RQ-SNFS-005666
      headline that detecting the trapdoor seems out of reach. This program holds no detector for
      special-form integers of any kind, so within this repository there is no numerical incumbent
      to beat, and no external baseline may be asserted from here.
    hidden_overhead: 'The grid size hides the whole problem: p^(1/d) bases at d = 6 and n = 1024 is
      an astronomically large sweep, and the toy measurement says nothing about affording it. Exact-arithmetic
      LLL in pure Python is orders of magnitude slower than a compiled floating-point implementation,
      so the wall-clock figures are instrument figures and not algorithmic ones. The human cost is
      in freezing the grid and threshold before scoring, which is the only thing preventing the statistic
      from being tuned into significance.'
  dominated_by: 'n/a for attack claims, since none is made. As a detector, I checked the frontier
    rows this repository actually contains: there is no competing SNFS-form detector in ledger/proposals,
    ledger/hypotheses or knowledge/, so the classifier frontier is empty rather than null. Against
    certainty rather than classification, the detector is dominated by simply attempting the factorization
    or the discrete logarithm at the toy sizes tested, which decides far more than membership and
    at 64 bits costs less than the 2001-base sweep; that row is checked and stated rather than hidden.'
  sota_delta: 'No attack; measurement and instrument contribution only. Quantitatively, the contribution
    is a first number where the program has none: a measured false-positive rate at a fixed true-positive
    rate for a named class, against a prior state in which the only recorded value is a quoted English
    phrase. The cost comparison against the trivial alternative is explicit: at n = 64 a full factorization
    decides everything in well under the sweep cost, so the detector is interesting only as a scaling
    object, and its scaling exponent 1/d is reported, not improved.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part B, that the planted arm separates from the null arm at n=64, d=3,
    H=64 with the true base in the grid: about 0.9, because the planted vector is provably in the
    lattice and provably shorter than the heuristic, so failure would mean the reduction is not finding
    it. Part D, that the measured detection window matches the Pascal-derived law within a factor
    of two across d in {2,3,4}: about 0.5, since the bound is worst-case and the typical behaviour
    may be much tighter. That the detector remains meaningful once the base grid is blind and the
    accidental-membership base rate is charged as the false-positive floor: about 0.3, and this is
    the part most likely to convert the result into a measured obstruction rather than a detector.
    That anything here transfers to cryptographic sizes: not claimed, and the cost accounting suggests
    it does not.'
