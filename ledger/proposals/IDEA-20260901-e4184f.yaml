  title: >-
    THE ENDOMORPHISM CLAW, PRICED BY A COVOLUME IDENTITY. Small |D_0| supplies about
    sqrt(p/|D_0|) times MORE endomorphisms per norm bound than a generic curve, which is
    the largest |D_0|-dependent resource this lane has named - and it buys exactly
    nothing, because the meet-in-the-middle that would consume it runs on the rank-4
    lattice Lambda_k of pairs (alpha, beta) with alpha P = beta Q, whose covolume is
    N * covol(O)^2 with the |D| factors cancelling EXACTLY, so both sides must enumerate
    Theta(sqrt(N)) elements at every |D_0|. Predicted position - sqrt(N) time AND sqrt(N)
    memory, i.e. plain BSGS, strictly Pareto-dominated by rho. Measure the collision
    radius against |D_0| at matched N and find out.

  object: >-
    TRACKED OBJECT - THE CLAW PAIR (alpha, beta) in O x O, projected to the single
    residue lambda(alpha) - k lambda(beta) mod N. What is retained per pair is ONE
    element of Z/N; the two endomorphisms, their kernels, their rational maps, the curve
    and the points are all discarded. The set of pairs whose residue is zero is the
    lattice Lambda_k, and the object this record actually measures is a geometric
    invariant of that lattice - its covolume and its successive minima - together with
    the aspect ratio of the enumeration box in the basis (1, omega) of O.
    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS, per
    docs/inventor-protocol.md section 1, for a target the corpus reports as heavily
    mined (56 proposals under RQ-JINV-8fc13a): the automorphism-order function and the
    sqrt(|Aut|) rho discount (KN-TECH-018, H-JINV-db2776); Semaev support and
    degeneration screens (H-JINV-0e8819 and the 2026-08-11 batch); relation-collection
    density (H-JINV-5a0b9e); the Cl(O)-orbit curve identity and crater cardinality
    (IDEA-20260826-d61c49); the orbit-label morphism (IDEA-20260811-332ce9); and volcano
    DEPTH, which belongs to RQ-VOLC-f6253b and is worked concurrently.
    CANDIDATES ENUMERATED AND SCORED on (genuinely new here / one-step propagation
    definable and measurable / survival depth):
    (a) the endomorphism SUPPLY COUNT #{alpha : N(alpha) <= X} - this is essentially
        IDEA-20260811-c72830's Delta(E) = N sqrt(|disc End|)/(2 pi) read as a density;
        a repackaging, and it measures a resource without pricing its consumer;
    (b) the single GLV eigenvalue lambda - IDEA-20260807-778375's object, known;
    (c) the pair (alpha, beta) modulo the claw congruence - new in this corpus as far as
        this session could check; its one-step propagation is exact and linear, since
        lambda is a ring homomorphism so the residue of a sum of pairs is the sum of the
        residues, which is what makes Lambda_k a LATTICE rather than an unstructured set;
        it survives until one asks how to FIND a short vector without knowing k, which is
        where it dissolves and which is the record's own named boundary;
    (d) the ideal class of alpha in Cl(O) - already owned by IDEA-20260826-228fa6 and
        IDEA-20260826-d61c49, and it discards the size information this record needs.
    (c) is adopted. KN-OPEN-019 applies: no written ECDLP object enumeration exists in
    this program, so this scoring is a sketch and not a taxonomy.

  lossy_projection_test: >-
    The projection (alpha, beta) -> lambda(alpha) - k lambda(beta) mod N sends a pair of
    algebraic integers to one residue class. It is genuinely lossy: the fibre over each
    residue is an infinite coset of Lambda_k, and from the residue nothing about the
    degrees, kernels or ideal classes of alpha and beta is recoverable.
    COMPATIBILITY WITH THE OPERATIONS THE RECORD USES IT UNDER. The operations are
    addition in O x O and the action on G. lambda is a ring homomorphism onto Z/N
    (H-ENDO-001), so the projection is Z-LINEAR in (alpha, beta) - the retained residue of
    a sum is the sum of the retained residues - and it therefore propagates
    deterministically under exactly the operation the enumeration uses, incrementally
    stepping a and b by one. That linearity is what makes the whole record possible and
    it is the reason the object is a lattice.
    IT IS NOT COMPATIBLE with multiplication in O in any useful way (the residue of a
    product is not a function of the two residues once k is in the expression) and it is
    not compatible with isogeny to another curve. Both incompatibilities are stated here
    rather than discovered later, and neither operation is used.
    IT IS NOT A CHANGE OF COORDINATES. The strongest reason: the projection is exactly
    the composition of the GLV decomposition with reduction, and the standard objection
    to calling GLV a new object - that it is a basis change - is met here because the
    object retained is not the pair of GLV coefficients but the SINGLE residue, from
    which the coefficients cannot be recovered.

  claim: >-
    Five statements. A is the construction, B is the covolume identity that is the whole
    content, C is the cost, D is the honest reason it is not an algorithm, and E is the
    measurement.

    (A) THE CLAW. Let E/F_p be ordinary, O = End_{F_p}(E) of discriminant D = D_0 f^2,
    G <= E(F_p) of prime order N, P a generator, Q = kP. By H-ENDO-001 the action map
    lambda : O -> Z/N is a surjective ring homomorphism. For (alpha, beta) in O x O,
        alpha(P) = beta(Q)   if and only if   lambda(alpha) - k lambda(beta) = 0 in Z/N.
    Define Lambda_k = { (alpha, beta) in O x O : lambda(alpha) = k lambda(beta) in Z/N }.
    Any nonzero element of Lambda_k with lambda(beta) invertible yields
    k = lambda(alpha) / lambda(beta) mod N, i.e. SOLVES the instance. Elements of O x O
    are enumerated as alpha = a1 + a2 omega, beta = b1 + b2 omega for a fixed basis
    (1, omega) of O, and alpha(P) is computed as a1 P + a2 P' with P' = omega(P) computed
    ONCE, so each successive candidate costs one group addition and no isogeny
    evaluation.

    (B) THE COVOLUME IDENTITY - THE CLAIM THIS RECORD EXISTS FOR. Lambda_k has index
    exactly N in O x O, because (alpha, beta) -> lambda(alpha) - k lambda(beta) is onto
    Z/N. Embedding O in C with the norm form, covol(O) = sqrt(|D|)/2, so
        covol(O x O) = |D| / 4   and   covol(Lambda_k) = N |D| / 4.
    Two consequences that pull in opposite directions and cancel EXACTLY.
      (B1) SUPPLY. #{ alpha in O : N(alpha) <= X } = 2 pi X / sqrt(|D|) + O(sqrt(X)),
           so at a fixed norm budget X a small-|D_0| curve at f = 1 supplies about
           sqrt(|D_generic| / |D_0|) = Theta(sqrt(p / |D_0|)) times more endomorphisms
           than a generic curve. This is the largest |D_0|-dependent resource named
           anywhere in this lane and it looks like an exponent-scale advantage.
      (B2) DEMAND. By Minkowski applied to the rank-4 lattice Lambda_k, a nonzero
           solution with N(alpha) + N(beta) = O(sqrt(N |D|)) exists, and no smaller
           bound is available in general because the covolume is what it is.
      (B3) THE CANCELLATION. The number of candidates each side must enumerate to reach
           the guaranteed radius is
               X * 2 pi / sqrt(|D|) with X = Theta(sqrt(N |D|)), i.e. Theta(sqrt(N)),
           in which every |D| cancels. THE SUPPLY ADVANTAGE OF SMALL |D_0| IS EXACTLY
           ANNIHILATED BY THE LARGER RADIUS THE SAME LATTICE REQUIRES. The invariant
           carrying this is the NORMALISED CLAW COVOLUME
               covol(Lambda_k) / covol(O x O) = N,   independent of D, of D_0, of f, of
           j and of |Aut|.

    (C) THE COST POSITION, STATED WITH EXPONENTS. Time Theta(sqrt(N)) group operations,
    memory Theta(sqrt(N)) stored points, success probability 1 (it is an exhaustive
    two-sided enumeration, not a birthday search). That is exactly BSGS. Against the
    program's frontier it is matched on time by parallel rho at 0.886*sqrt(N) and
    strictly beaten on memory, which rho holds at O(1); against the
    automorphism-discounted CM baseline at 1.2533*sqrt(N/|Aut|) it is beaten on both.
    A low-memory Gaudry-Schost variant on the two-dimensional box would cost a constant
    times sqrt(N) with a constant recalled to be near 2.4, i.e. worse than rho's 0.886.
    NO EXPONENT MOVES IN ANY VARIANT and none is claimed.

    (D) WHY THIS IS NOT SECRETLY AN ALGORITHM, STATED BEFORE ANYONE IS TEMPTED. Lambda_k
    is a rank-4 lattice and shortest-vector problems in rank 4 are solvable in polynomial
    time, so a reader may conclude that lattice reduction breaks the ECDLP here. IT DOES
    NOT, and the reason is that BUILDING Lambda_k REQUIRES k. The lattice is defined by
    the very congruence the instance withholds. What remains is enumeration, and
    enumeration is the sqrt(N) barrier. This record pre-registers that refutation of its
    own most attractive misreading, which is the cheapest useful thing it does.

    (E) THE MEASUREMENT AND ITS TWO RIVAL EXPLANATIONS, AT MATCHED N AND MATCHED p.
    Define the empirical claw radius R(E) = min { N(alpha) + N(beta) : (alpha, beta) in
    Lambda_k nonzero }, computed at toy scale where k is known by construction, and the
    BOX ASPECT RATIO rho_box(E) = (range of a1) / (range of a2) at the guaranteed radius.
    (H-null) R(E) / sqrt(N |D|) is a curve-independent constant and the candidate count
    Theta(sqrt(N)) is |D_0|-independent - the supply advantage is annihilated exactly as
    B3 predicts, and the correct reading of small |D_0| is that the claw becomes
    genuinely TWO-DIMENSIONAL (rho_box near 1) while for generic |D| ~ 4p it DEGENERATES
    to one dimension (rho_box ~ sqrt(N), a2 confined to O(1) values), i.e. to ordinary
    BSGS - a change in shape with no change in cost.
    (H-signal) R(E) scales with |D_0| in a way that leaves the candidate count DECREASING
    in |D_0|, so small-|D_0| curves admit a claw with strictly fewer than Theta(sqrt(N))
    candidates per side. That would be an advantage beyond sqrt(|Aut|) and, if the
    scaling were a power of N rather than a constant, an exponent event. It contradicts
    B3, so observing it first indicts the covolume computation.

    (WHAT IS NOT CLAIMED) No exponent. No attack. No advantage over the
    automorphism-discounted rho baseline in any direction; sota_delta zero on every axis.
    Under GOAL-ENDO-001 pause condition P3, H-signal is proposed strictly as a test to
    run: if the measured candidate count falls below the predicted Theta(sqrt(N)), the
    work STOPS and independent review is requested before any sentence asserts an excess.

  mechanism: >-
    Every meet-in-the-middle against a discrete logarithm is the same shape: a set of
    cheaply computable maps applied to P, a set applied to Q, and one linear constraint
    modulo N that a collision satisfies. The CM structure changes only the first two
    sets - it enlarges the supply of cheap maps from the integers to a rank-2 ring - and
    leaves the constraint untouched, because the action map lambda is a homomorphism ONTO
    Z/N whatever O is. A single constraint modulo N cuts out a sublattice of index exactly
    N, so the candidate space must contain at least N points before a solution is
    guaranteed and each side must therefore hold at least sqrt(N) of them. That is the
    birthday barrier restated as a covolume, and it is completely insensitive to the shape
    of O. What the shape of O does change is the GEOMETRY of the enumeration box - round
    for small |D_0|, degenerate to a line for |D| ~ 4p - and the geometry is exactly what
    the supply count B1 measures. The record's content is that geometry and covolume are
    different invariants, that the lane has been reading the first as if it were the
    second, and that the identity covol(Lambda_k)/covol(O x O) = N settles which one the
    cost depends on.
    THE GENERALISATION, WHICH IS THE CLOSURE. For any r >= 2 slots, a claw built from
    r-tuples of cheap endomorphisms subject to ONE congruence modulo N gives a lattice of
    index N in O^r, so the candidate space still needs N points and a balanced split still
    needs sqrt(N) per side. Adding endomorphism slots cannot break the barrier; only
    adding CONSTRAINTS can, and the only source of extra constraints is extra instances,
    which is the multi-target regime where the frontier is already sqrt(LN)
    (Kuhn-Struik).

