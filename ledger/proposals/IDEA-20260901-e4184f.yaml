  assumptions:
    - >-
      [fact] E/F_p ordinary, p > 3, N prime, N does not divide the norms used, and
      lambda : O -> Z/N is a surjective ring homomorphism (H-ENDO-001, used as the
      admissibility filter and not retested).
    - >-
      [fact] O is an order of discriminant D < 0 in an imaginary quadratic field with
      covol(O) = sqrt(|D|)/2 under the norm form, and the count of elements of norm at
      most X is 2 pi X / sqrt(|D|) + O(sqrt(X)) by the Gauss circle argument applied to
      the norm ellipse. The error term is the only analytic input and it is negligible in
      the regime used.
    - >-
      [fact] The map (alpha, beta) -> lambda(alpha) - k lambda(beta) is onto Z/N, so
      [O x O : Lambda_k] = N exactly. This is the load-bearing step and it needs only
      surjectivity of lambda.
    - >-
      [cost model] alpha(P) for alpha = a1 + a2 omega is computed as a1 P + a2 P' with
      P' = omega(P) precomputed once, so the marginal cost per enumerated candidate is one
      group addition. This is the ONLY cost model used and it deliberately gives the claw
      its best case; if it were false the claw would be worse, never better.
    - >-
      [scope] Toy scale, p up to about 2^24 with k known by construction so the empirical
      claw radius can be computed at all. Claim tier toy. Lawful defensive cryptanalysis
      on public constructions and toy benchmarks only.

  proof_search_map:
    bottleneck: >-
      The candidate count per side of any endomorphism-based meet-in-the-middle. It is
      the only quantity that decides whether the small-|D_0| supply advantage is
      convertible, and every other cost in the construction is a constant times it.
    baseline_embedding:
      parameter_slice: >-
        O = Z, i.e. a generic curve with no small-norm endomorphism beyond the integers.
        Then omega is absent, the enumeration collapses to alpha = a1 and beta = b1, and
        the claw is EXACTLY baby-step giant-step at sqrt(N) time and memory. The covolume
        identity must reproduce this: with |D| replaced by the rank-1 covolume, the index
        is still N and the count is still sqrt(N). A construction that beat BSGS in this
        slice would be a proves-too-much failure and would indict the argument.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, BLOCKING. On a committed toy curve with |D| about 4p,
        run the claw and require the measured candidate count per side to agree with
        plain BSGS at sqrt(N) to within the enumeration tolerance, and require the box
        aspect ratio to come out degenerate (a2 confined to O(1) values). Failure halts
        the line before any small-|D_0| cell is run.
    observation_collision:
      observable: >-
        The candidate count per side at the first collision, and the normalised claw
        covolume covol(Lambda_k)/covol(O x O).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, WHICH IS THE RESULT RATHER THAN A FALSIFIER. A
        small-|D_0| curve and a generic-|D_0| curve at the SAME N are two distinct
        ground-truth objects with the SAME observable, namely normalised covolume N and
        candidate count Theta(sqrt(N)). Exhibiting that collision is exactly the claim
        that the supply advantage is not convertible, and a record that reported a
        small-|D_0| claw advantage WITHOUT running this collision search would be
        reporting the supply and calling it a cost. A SECOND, DANGEROUS collision to hunt:
        two curves with different N but the same candidate count, which would mean the
        instrument is counting box points rather than group operations.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the ECDLP from the group G to the rank-4 lattice Lambda_k inside O x O,
          where the hypothesis alpha(P) = beta(Q) becomes an exact congruence rather than
          an equality of points. Encoding is exact; completeness holds because every k
          admits a short pair by Minkowski; soundness holds because a collision with
          lambda(beta) invertible determines k uniquely.
        predicted_gain: >-
          ZERO, and identifying the zero is the deliverable. The transfer obligation is
          where it dies: the reduction produces a lattice that cannot be written down
          without k, so the polynomial-time rank-4 SVP that the new model would offer is
          unreachable. Cost loss - none; cost gain - none.
      - transform: specialization_pack
        proposed_object: >-
          The matched-N family with |D_0| swept, so that N, hence the lattice index, is
          literally the same integer while covol(O) sweeps two orders of magnitude. This
          is the only design in which the covolume cancellation can be observed rather
          than argued.
        predicted_gain: >-
          Isolates the |D| dependence of the claw radius from N, which a single curve
          cannot do at all.
    quantifier_order: >-
      CLAIMED IN THIS ORDER. FOR ALL ordinary E/F_p with p > 3, FOR ALL prime N dividing
      #E(F_p) with N > 2, FOR ALL k in (Z/N)^*: the lattice Lambda_k has index EXACTLY N
      in O x O, hence covolume N |D| / 4, hence a balanced two-sided enumeration reaching
      the Minkowski radius holds Theta(sqrt(N)) candidates per side WITH THE IMPLIED
      CONSTANT INDEPENDENT OF D.
      THE WEAKER READING EXPLICITLY NOT CLAIMED - "for every curve there EXISTS a k for
      which the count is sqrt(N)", which would let k be chosen per curve and is vacuous.
      THE STRONGER READING EXPLICITLY NOT CLAIMED - any statement about the count needed
      to find the short vector WITHOUT knowing k, which is not a lattice question at all.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For every ordinary prime-field curve, the endomorphism claw solves the ECDLP in
        Theta(sqrt(N)) group operations and Theta(sqrt(N)) memory with the constant
        independent of the CM discriminant; equivalently, the sqrt(p/|D_0|)-fold
        endomorphism supply advantage of small |D_0| is annihilated exactly by the
        covolume of the claw lattice." IT CAN NEVER CERTIFY - anything about claws that
        transport the instance along an isogeny (IDEA-20260826-d61c49's territory),
        anything about multi-target regimes, anything about relation collection or
        incidence, anything about supersingular or extension-field curves, and nothing
        about the hardness of the ECDLP.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS: a curve with a genuinely
        two-dimensional cheap-map structure that DOES beat sqrt(N) - none exists over
        F_p, so the honest control is the closest available, namely the SUBFIELD or
        Koblitz curve over F_{2^m} where Frobenius supplies a cheap map of order m and the
        claw becomes m-dimensional. There the count is still sqrt(N) and the known gain is
        still only sqrt(m) from orbit collapse, so the method must NOT report an advantage
        there either. If it does, it is counting box volume rather than candidates. This
        control is outside RQ-JINV-8fc13a's prime-field scope and is proposed as an
        ANALYTIC check only, computed and not run.
    proof_obligations:
      - claim: 'lambda : O -> Z/N is surjective, so [O x O : Lambda_k] = N.'
        responsibility: correctness
      - claim: 'covol(O) = sqrt(|D|)/2 and covol(Lambda_k) = N |D| / 4.'
        responsibility: size
      - claim: 'Minkowski gives a nonzero pair of squared length O(sqrt(N |D|)).'
        responsibility: feasibility
      - claim: >-
          The candidate count 2 pi X / sqrt(|D|) at X = Theta(sqrt(N |D|)) is
          Theta(sqrt(N)) with a D-independent constant.
        responsibility: runtime
      - claim: 'A collision with lambda(beta) invertible determines k uniquely.'
        responsibility: correctness
      - claim: 'Memory is Theta(sqrt(N)) stored points, strictly worse than rho.'
        responsibility: memory
      - claim: 'Lambda_k cannot be constructed without k, so SVP is unreachable.'
        responsibility: interface
      - claim: >-
          The O = Z slice reproduces BSGS and the construction beats nothing there.
        responsibility: baseline
      - claim: >-
          No exponent, no attack, no advantage over the automorphism-discounted baseline.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        normalised claw covolume covol(Lambda_k)/covol(O x O), computed exactly per curve
        from the enumerated lattice basis
      direction: different
      minimum_effect: >-
        Exactly N, on every curve, with zero exceptions and no dependence on D, D_0, f, j
        or |Aut|. Any other value falsifies the index computation, which is the record's
        load-bearing step.
    - metric: >-
        candidate count per side at the first collision, at MATCHED N across the |D_0|
        ladder
      direction: different
      minimum_effect: >-
        FLAT in |D_0|, within the enumeration's own variance, and equal to the BSGS count
        at sqrt(N) within a factor 2. A monotone decrease with decreasing |D_0| is the
        H-signal outcome and triggers GOAL-ENDO-001 pause condition P3 before any
        description.
    - metric: >-
        box aspect ratio rho_box = (range of a1)/(range of a2) at the guaranteed radius
      direction: lower
      minimum_effect: >-
        Near 1 at |D_0| = 3 or 4 and growing like sqrt(N/|D|) toward the generic end,
        reaching a degenerate regime where a2 takes O(1) values at |D| comparable to 4p.
        THIS IS THE ONE QUANTITY PREDICTED TO MOVE WITH |D_0|, and it moving while the
        candidate count does not is the record's whole point. A flat aspect ratio means
        the box is being built wrong and the arm is void.
    - metric: >-
        empirical claw radius R(E) divided by sqrt(N |D|)
      direction: different
      minimum_effect: >-
        A curve-independent constant within a factor 4, consistent with Minkowski and with
        the Gauss circle count. A systematic |D_0| trend in this ratio would mean the
        successive minima of Lambda_k depend on the shape of O in a way the covolume does
        not capture, which is a genuine structural finding and is reported as one whether
        or not it changes the count.
    - metric: >-
        measured wall-clock group-operation count of the claw against measured parallel
        rho with distinguished points, on the same curves and the same instances
      direction: higher
      minimum_effect: >-
        The claw is SLOWER by at least the factor 1/0.886 and uses at least sqrt(N)
        memory against rho's O(1). Predicting the proposed construction to LOSE is
        deliberate: a construction that unexpectedly won at toy scale would indicate a
        measurement error before it indicated a discovery.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is most of the deliverable): compute the index
      [O x O : Lambda_k] = N, the covolume N|D|/4, the Minkowski radius, the Gauss circle
      count and the cancellation B3 symbolically; tabulate the predicted candidate count
      and box aspect ratio at |D_0| = 3, 4, 7, 11, 163 and generic, for N of 14, 24 and
      256 bits. Nothing here needs a machine and the whole pricing argument is decided
      here.
      STAGE 1 (baseline reproduction, BLOCKING): on a committed toy curve with |D| about
      4p, run the claw and require the candidate count to match BSGS at sqrt(N) and the
      box to come out degenerate.
      STAGE 2 (the arm): on a matched-N toy family sweeping |D_0|, with k drawn at random
      and KNOWN so the radius can be computed, build (1, omega), precompute P' = omega(P),
      enumerate both sides by increasing norm, record the first collision, the candidate
      count, the radius and the aspect ratio; verify every claimed solve by an independent
      certificate check that k P = Q, re-verified by code sharing no state with the
      producer (docs/claims-and-verification.md).
      STAGE 3 (nulls, mandatory): the same instances solved by (a) plain BSGS, (b)
      parallel rho with distinguished points, (c) the automorphism-discounted rho variant
      on the |Aut| > 2 members, with all four cost curves reported on one axis.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, BLOCKING - the O = Z claw, i.e. plain BSGS, run
        through the IDENTICAL code path with omega disabled. If the endomorphism claw does
        not beat it, the supply advantage is confirmed non-convertible; if it does beat
        it, the covolume computation is wrong and the run is a defect report.
      - >-
        SQRT(|Aut|) BASELINE AS THE NULL HYPOTHESIS, per RQ-JINV-8fc13a's decision_target
        - every measured ratio is expressed against the automorphism-discounted rho
        baseline (KN-TECH-018) and a factor at or below sqrt(6) is recorded as baseline
        calibration, never as an attack.
      - >-
        DECAY PARAMETER - |D_0| swept from 3 to generic at matched N. The predicted decay
        is in the ASPECT RATIO only; the candidate count is predicted FLAT. A quantity
        that fails to move when |D_0| moves is the canonical artifact tell
        (docs/inventor-protocol.md section 3), so the design pre-registers WHICH quantity
        must move and which must not, and reports both.
      - >-
        SECOND DECAY PARAMETER - the conductor f within one class, which changes |D| by
        f^2 while D_0, N, p and t are fixed. Predicted: aspect ratio moves, candidate
        count does not. This control separates D_0 from D and is free inside a class that
        the campaign already enumerates.
      - >-
        CERTIFICATE CONTROL - every claimed solve re-verified independently as kP = Q.
        Verification fraction must be 1.0, per RQ-JINV-8fc13a's constraints.
      - >-
        TRACE-PAIR REPLICATION - two classes with the same D_0 and different t at the
        same N must give the same candidate count. A difference means the count is not a
        function of the CM order and the object is mis-specified.
    required_metrics:
      - per curve - p, a, b, j, t, N, D, D_0, f, |Aut|, basis (1, omega)
      - normalised claw covolume, computed from the enumerated basis, required exactly N
      - candidate count per side at first collision, per instance and per seed
      - empirical claw radius R(E) and R(E)/sqrt(N |D|)
      - box aspect ratio rho_box at the guaranteed radius
      - measured group operations and peak memory for claw, BSGS, rho and discounted rho
      - certificate verification fraction, required 1.0

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY). The index [O x O : Lambda_k] is not N, or the covolume
      is not N|D|/4. The record's load-bearing step is wrong and it is withdrawn by a
      superseding proposal.
    - >-
      F2 (THE INTERESTING FALSIFIER AND THE ONLY POSITIVE OUTCOME AVAILABLE). Measured
      candidate count per side decreasing with |D_0| at matched N, beyond the enumeration
      variance. Small |D_0| would then supply a claw cheaper than BSGS, an advantage
      beyond sqrt(|Aut|). Work STOPS for an independent review-adversarial session under
      GOAL-ENDO-001 pause condition P3, and the covolume computation is re-derived blind
      before anything is described.
    - >-
      F3. The O = Z baseline slice does NOT reproduce BSGS. Proves-too-much failure; the
      construction is measuring box volume rather than candidates and every number is
      void.
    - >-
      F4 (THE MAIN NEGATIVE AND THE INTENDED DELIVERABLE). Normalised covolume exactly N
      everywhere, candidate count flat in |D_0| and equal to BSGS, aspect ratio moving as
      predicted, claw slower than rho with worse memory. Then the lane's largest named
      |D_0|-dependent resource is measured to be non-convertible by the claw family, with
      the obstruction recorded as the exact number covol(Lambda_k)/covol(O x O) = N over
      the scope "all ordinary prime-field curves", and the record must name its successors
      or it has not finished (docs/inventor-protocol.md section 4).
    - >-
      F5. The aspect ratio does NOT move with |D_0|. The box construction is wrong and the
      arm is void in both directions; it is returned to the executor as a defect and never
      reported as a null.
    - >-
      NOT A FALSIFICATION - the claw exceeding the memory budget at the largest toy N.
      That is an infrastructure outcome under AGENTS.md rule 5, reported with the largest
      N reached, and never evidence about covolumes.

  confounders:
    - >-
      READING THE SUPPLY AS THE COST is the confound the whole record exists to prevent,
      and it is easy to fall into because the supply genuinely varies by sqrt(p/|D_0|)
      inside a class (IDEA-20260811-c72830's own headline). The design requires the
      candidate COUNT AT COLLISION to be reported next to the supply density in every
      table so the two can never be conflated in a summary.
    - >-
      k IS KNOWN BY CONSTRUCTION in the toy arm, which is what makes R(E) computable at
      all. Every reported radius is therefore an ORACLE quantity and is not available to
      an attacker. No cost claim may be derived from R(E) alone; only the candidate count
      of the enumeration, which does not use k, is a cost.
    - >-
      THE GAUSS CIRCLE ERROR TERM O(sqrt(X)) IS NOT NEGLIGIBLE AT TOY SCALE. At N about
      2^14 and small |D| the predicted count 2 pi X / sqrt(|D|) can be off by tens of
      percent. The design compares measured against predicted counts with that error term
      carried explicitly rather than reporting a clean ratio.
    - >-
      OMEGA'S NORM ENTERS THE BOX SHAPE, NOT JUST |D|. For D congruent to 0 or 1 modulo 4
      the standard generator differs, and using the wrong one changes the aspect ratio by
      a factor 2 while leaving the covolume alone. The basis is reported per curve.
    - >-
      MEASURING GROUP OPERATIONS RATHER THAN WALL CLOCK is required, because the claw's
      inner loop is one addition while rho's is one addition plus a hash, and a wall-clock
      comparison would silently price the implementation rather than the algorithm.

  interpretation_limits:
    - >-
      claim_tier toy. p up to about 2^24 and N up to about 2^24; nothing here is a
      statement about any cryptographic parameter, and the covolume identity, which is the
      part that is scale-free, is a DERIVATION and not a measurement.
    - >-
      NO EXPONENT MOVES AND NO ATTACK IS PROPOSED. The construction's honest ceiling is
      BSGS, which the program already has, and its honest position is strictly Pareto
      dominated by rho. It is worth building anyway because it is the cheapest way to
      settle whether the lane's largest |D_0|-dependent resource is convertible, and
      because the negative comes with an exact obstruction number rather than a verdict.
    - >-
      THE CLOSURE IS OVER THE CLAW FAMILY ONLY. What remains open and is named here so
      the next session does not have to rederive it - (i) claws whose constraint is not a
      single congruence modulo N, in particular the multi-target regime where L instances
      give L constraints and the frontier is sqrt(LN); (ii) claws that transport the
      instance along isogenies rather than staying on one curve, which is
      IDEA-20260826-d61c49's and IDEA-20260811-b3a355's territory and is priced there;
      (iii) low-memory Gaudry-Schost variants on the two-dimensional box, where only the
      CONSTANT is in play and the honest question is whether it can be pushed below rho's
      0.886, which this record believes it cannot but does not prove; (iv) subfield and
      extension-field curves, where Frobenius adds dimensions and the covolume argument
      must be re-run.
    - >-
      SCOPED TO ORDINARY PRIME-FIELD CURVES WITH A PRIME-ORDER SUBGROUP. H-ENDO-001 is
      the admissibility filter and is not retested; KN-FIND-b7e091's generic-group closure
      is treated as binding; nothing here bears on H-STR-002 so pause condition P2 is not
      engaged.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        LATTICE-POINT REGULARITY OF Lambda_k. For k drawn uniformly from (Z/N)^*, the
        number of nonzero (alpha, beta) in Lambda_k with N(alpha) + N(beta) <= R is
        (pi^2 / 4) R^2 / covol(Lambda_k) + o(R^2) = pi^2 R^2 / (N |D|) + o(R^2), i.e.
        Lambda_k behaves like a random lattice of its covolume with no systematic
        deficiency in small balls, so the first collision occurs at
        R = Theta(sqrt(N |D|)) with a k-independent and D-independent implied constant.
      rigorous_support: >-
        RIGOROUS PART - the covolume is EXACTLY N |D| / 4 by the index computation, which
        needs no heuristic, and Minkowski gives an unconditional UPPER bound
        R <= gamma_4 (N|D|/4)^{1/2} on the shortest vector. What is heuristic is only the
        MATCHING LOWER bound, i.e. that Lambda_k has no unusually short vector for most k.
        DISTRIBUTION IMITATED - the standard Gaussian-heuristic count of lattice points in
        a ball, in the same role that Dickman-de Bruijn plays for smoothness of
        algebraically produced integers.
        WHY IT COULD FAIL, STATED HONESTLY - Lambda_k is not a random lattice. It contains
        the sublattice { (alpha, beta) : lambda(alpha) = lambda(beta) = 0 }, i.e. the
        square of the prime ideal above N, whose vectors have norm about N; and for
        special k, for instance k congruent to lambda(omega), it contains the very short
        vector (omega, 1). The existence of short vectors at special k is a REAL
        phenomenon and the design measures it rather than assuming it away - it is the
        GLV decomposition itself.
      validation_plan: >-
        WHAT TO SAMPLE - at least 200 uniformly drawn k per curve, over a matched-N family
        sweeping |D_0| from 3 to generic, at N between 2^14 and 2^24, with the empirical
        R(E, k) computed exactly by enumeration. WHICH SHORTCUT MAKES IT FEASIBLE - the
        lattice basis of Lambda_k is written down directly from k and a basis of O, so no
        curve arithmetic is needed for the geometric arm; the curve is needed only for the
        certificate control, which makes the larger-parameter arm cheap.
        AGAINST WHICH PREDICTED DISTRIBUTION - the empirical distribution of
        R(E, k)/sqrt(N|D|) against the Gaussian-heuristic prediction for a random rank-4
        lattice of the same covolume, reported as an empirical CDF with the Minkowski
        bound marked.
        TAIL CONSISTENCY CHECKS - report the SMALLEST observed R over all k and all
        curves, and the fraction of k with R below half the Gaussian-heuristic median.
        The known special k with very short vectors must appear in that tail and be
        identified by name rather than discarded; if they do not appear, the enumeration
        is not reaching small radii and the arm is void.
        SAMPLED PARAMETERS AND TRANSFER - record p, a, b, N, t, D, D_0, f, the basis
        (1, omega), and every k. TRANSFER ASSUMPTION, DECLARED - nothing measured at
        N about 2^24 transfers to cryptographic N except through H1 itself, and the
        covolume identity, which is exact and scale-free, is the only part of the record
        that transfers unconditionally.
      falsification_condition: >-
        A curve family in which R(E, k)/sqrt(N|D|) decreases systematically with |D_0|
        over uniformly drawn k. H1 is refuted, B3's cancellation does not hold at the
        level of achieved minima even though it holds at the level of covolume, and the
        record must be re-derived before any use.
    - id: H2
      statement: >-
        ENUMERATION-COST ADEQUACY. Enumerating candidates alpha = a1 + a2 omega in order
        of increasing norm costs O(1) amortised group operations per candidate, using
        incremental addition of P and P' and no isogeny evaluation, and the memory to
        store one side is Theta(1) points per candidate.
      rigorous_support: >-
        RIGOROUS PART - alpha(P) = a1 P + a2 P' is an identity, and a lattice-ordered
        enumeration of a two-dimensional box admits an incremental traversal in which
        consecutive candidates differ by one basis vector. DISTRIBUTION IMITATED - none;
        this is an implementation-adequacy assumption of the same kind as a regression
        fixture, and it is stated separately so that a cost-model objection cannot be
        confused with an objection to the covolume identity.
      validation_plan: >-
        WHAT TO SAMPLE - measured group-operation counts and peak memory for the claw at
        five N spanning the toy range, against the analytic prediction. AGAINST WHICH
        PREDICTION - a linear fit of operations against candidate count with slope 1
        within 20 percent. TAIL CHECK - the largest N at which the linear model holds.
        TRANSFER - only the shape, never the constant.
      falsification_condition: >-
        Measured operations per candidate growing with N. The enumeration is not
        incremental, the cost model is wrong in the direction that makes the claw look
        better than it is, and every comparison against rho must be redone.

  target_complexity:
    time_exponent: >-
      N^{1/2}, i.e. exponent 1/2 UNCHANGED - specifically Theta(sqrt(N)) group operations
      with a constant independent of |D_0|, against the best known 0.886*sqrt(N) for
      parallel rho with distinguished points and 1.2533*sqrt(N/|Aut|) for its
      automorphism-discounted CM variant. The proposed construction is therefore SLOWER
      than the baseline by a constant and is proposed as a measurement, not as an
      improvement.
    memory_exponent: >-
      N^{1/2} stored points for the two-sided table, against rho's O(1). This is the axis
      on which the construction is strictly dominated and it is stated first rather than
      buried. A Gaudry-Schost variant would trade the table for a low-memory
      pseudorandom walk over the two-dimensional box at a recalled constant near 2.4, so
      still worse than 0.886 on time and equal on memory.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886*sqrt(N) group operations, O(1)
      memory per processor plus a distinguished-point table (KN-TECH-001, KN-TECH-006);
      automorphism-discounted CM variant 1.2533*sqrt(N/|Aut|) (KN-TECH-018); BSGS at
      sqrt(N) time and sqrt(N) memory (KN-TECH-031); van Oorschot-Wiener at sqrt(N^3/w)
      with memory w; multi-target Kuhn-Struik at sqrt(LN); generic lower bound
      Omega(sqrt(N)) (Shoup).
    hidden_overhead: >-
      Disclosed in four places. (a) The Theta(sqrt(N)) count hides the Gauss circle error
      O(sqrt(X)), which at toy N is tens of percent and is carried explicitly rather than
      absorbed. (b) Minkowski gives an upper bound on the shortest vector, not a matching
      lower bound; the claim that the count is not SMALLER than sqrt(N) for typical k is
      heuristic H1, not a theorem. (c) The O(1)-per-candidate cost assumes the incremental
      enumeration of H2 and would be violated by a naive implementation that evaluates an
      isogeny per candidate, which would cost Omega(N(alpha)) each. (d) No o(1) is claimed
      anywhere and none is hiding: every exponent here is exact.
    tradeoff_note: >-
      The construction sits at the BSGS corner of the frontier, sqrt(N) time and sqrt(N)
      memory, which van Oorschot-Wiener already dominates by interpolating to sqrt(N^3/w)
      at memory w with w = sqrt(N) giving sqrt(N) time - so the claw is at best on the
      existing curve and never inside it. Parallelisation is embarrassing on both sides of
      the claw but the collision detection requires the shared table, so it parallelises
      strictly worse than rho with distinguished points, which needs only a
      distinguished-point stream. This is the honest position and it is stated as a
      disadvantage.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. TIME - parallel rho at
    0.886*sqrt(N) dominates the claw's Theta(sqrt(N)) with a worse constant.
    MEMORY - rho at O(1) per processor strictly dominates the claw's Theta(sqrt(N)).
    TIME AND MEMORY JOINTLY - van Oorschot-Wiener's sqrt(N^3/w) curve passes through the
    claw's point and dominates everywhere else on it. CM-SPECIFIC - the
    automorphism-discounted rho variant at 1.2533*sqrt(N/|Aut|) (KN-TECH-018) dominates on
    j = 0 and j = 1728, which are exactly the curves this record is about.
    MEMORY-RICH - BSGS at sqrt(N)/sqrt(N) MATCHES the claw exactly, which is the record's
    own conclusion, so BSGS is the tight dominator rather than a loose one.
    MULTI-TARGET - Kuhn-Struik at sqrt(LN) dominates in its own regime; the claw is
    single-target. DATA/QUERIES - no query advantage is claimed and none is consumed.
    GENERIC LOWER BOUND - Shoup's Omega(sqrt(N)) is not competed with. `null` is not
    available and is not written; the tight dominator is BSGS.
  sota_delta:
    time_exponent: '0 (no change); constant strictly worse than rho, 1.0 versus 0.886'
    memory_exponent: '+1/2 (strictly worse than rho, matching BSGS)'
    data_or_query_exponent: '0 (no queries)'
    note: >-
      NEGATIVE ON MEMORY, ZERO ON TIME EXPONENT, WORSE ON THE TIME CONSTANT. The
      construction is proposed as a measurement and is expected to lose, and that
      expectation is pre-registered so that a surprising win would be treated as a defect
      report first. The structural delta that exists is exact and countable: the lane's
      largest named |D_0|-dependent resource, a supply advantage of up to
      2 sqrt(p/|D_0|) inside one class, acquires a PRICE - zero - by an exact covolume
      identity covol(Lambda_k)/covol(O x O) = N, which holds for every ordinary
      prime-field curve and is independent of D_0, f, j and |Aut|. The lane previously had
      the supply measured and the consumer unpriced.

  estimated_cost:
    implementation: medium
    compute: medium
  compute_budget_note: >-
    Stage 0 needs no machine and decides the pricing argument. Stage 1 and Stage 2 are
    dominated by two sqrt(N)-sized tables; at N about 2^24 that is roughly 4096 stored
    points per side per instance, seconds each, and 200 instances per curve over a
    50-curve family is minutes to a small number of hours on one core. The H1 geometric
    arm needs no curve arithmetic at all and runs at any N in seconds, which is why it can
    be pushed well past the arm that needs certificates.
  recommended_priority: medium

  relation_to_existing_records:
    prices: >-
      IDEA-20260811-c72830's supply functional, by exhibiting a consumer for it and
      computing that the consumer's cost is |D|-independent. Does not contradict that
      record, whose measurement stands.
    distinct_from: >-
      IDEA-20260826-d61c49 and IDEA-20260811-b3a355, both of which claw over the ISOGENY
      CLASS. This record never leaves the curve and never transports an instance, so its
      supply and its obstruction are disjoint from theirs.
    does_not_touch: >-
      RQ-VOLC-f6253b (volcano depth, worked concurrently), H-STR-002 and any factor base,
      and the Semaev and relation-density instruments of H-JINV-0e8819 and H-JINV-5a0b9e.

