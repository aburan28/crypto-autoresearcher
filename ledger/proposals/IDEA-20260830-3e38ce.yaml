  heuristic_assumptions:
    - id: H1
      statement: >-
        ENCODING-EQUIDISTRIBUTION UNDER ISOGENY. Let phi be an F_p-isogeny of prime
        degree ell >= 2 with gcd(ell, N) = 1, and let R be uniform in the
        prime-order subgroup G of E. Then the distribution of the low d bits of
        x(phi(R)) is within statistical distance o(1) of uniform on {0,1}^d for
        d = O(log log p), so the probability that a transported entry satisfies the
        distinguishedness predicate is 2^{-d}(1 + o(1)), and conditioned on failing
        it, phi(R) is distributed as a uniform non-distinguished element of G' --
        which is exactly the conditional distribution of a fresh random known-log
        start that has not yet been accepted.
      rigorous_support: >-
        The rigorous ingredient is that x(phi(R)) = f_phi(x(R)) for a rational
        function of degree ell, so the map on x-coordinates is ell-to-1 and
        algebraic, and Weil-type character-sum bounds give equidistribution of
        values of a fixed rational function along a subgroup only when the subgroup
        is large enough relative to p -- which HOLDS here since N is comparable to
        p. The heuristic step is the passage from equidistribution in F_p to
        equidistribution of the LOW d BITS of the integer representative, which is
        the standard bit-extraction idealisation. The classical distribution
        theorem it imitates is the equidistribution of x-coordinates underlying the
        0.886 rho constant (KN-TECH-006) and the distinguished-point analysis of
        van Oorschot-Wiener, which assume exactly this bit-level uniformity.
      validation_plan: >-
        SAMPLE: at p in {50021, 60013} and one larger prime near 2^{20}, for ell in
        {3, 5, 7, 11, 17, 31} and d in {4, 5, 6}, transport S = 2000 uniformly
        drawn subgroup elements and record (i) the empirical retention rate of the
        d-bit predicate and (ii) the full empirical distribution of the low d bits
        of x(phi(R)). PREDICTED DISTRIBUTION: retention 2^{-d}, and the d-bit
        histogram uniform, tested by a chi-squared goodness-of-fit at 2^d cells
        with the p-value reported rather than thresholded. TAIL CONSISTENCY CHECK:
        the maximum over the 2^d cells of the observed count, against the predicted
        maximum of 2^d multinomial cells -- a heavy single cell would indicate an
        algebraic obstruction in f_phi rather than noise, and is the interesting
        failure. SECOND CHECK, WHICH IS THE ONE THAT MATTERS FOR (C)(iii):
        conditioned on non-distinguishedness, compare the empirical walk-length
        distribution from transported starts against that from fresh random starts
        by a two-sample Kolmogorov-Smirnov test, 200 walks per arm, and report the
        KS statistic with its p-value. SAMPLED PARAMETERS RECORDED: p, N, ell, d,
        S, seeds, harness commit, predicate definition. TRANSFER ASSUMPTION: none
        beyond the sampled p; no cryptographic-scale claim about equidistribution
        is made or licensed.
    - id: H2
      statement: >-
        CHAIN-BUILDABILITY OF PAIRING-VALUED PREPROCESSING. If the value of a
        preprocessing object depends only on the set of (group element, logarithm)
        pairs and not on their encodings, then for the purpose that object serves,
        any size-S known-log set performs within a 1 + o(1) factor of any other; in
        particular the arithmetic progression {[c]P, [2c]P, ..., [Sc]P} performs as
        well as S uniformly random known-log points, and is buildable with S - 1
        group additions after one scalar multiplication.
      rigorous_support: >-
        Rigorous half: the build cost of the arithmetic progression is exactly
        S - 1 additions plus one scalar multiplication. Heuristic half: that a
        pseudorandom walk on G' hits an arbitrary fixed set of size S with the same
        per-step probability S/N as it hits a uniformly random set of size S. This
        is the standard rho idealisation -- the walk is modelled as a uniformly
        random function of the encoding, under which the algebraic structure of the
        target set is irrelevant -- and it is the same idealisation that underwrites
        the 0.886 constant (KN-TECH-006) and Teske's measured r-adding walk
        quality. It is refutable on its own terms.
      validation_plan: >-
        SAMPLE: at p in {50021, 60013}, run 200 seeded walks against (a) an
        arithmetic-progression marked set and (b) a uniformly-random-log marked
        set, both of size S in {100, 400, 1600}. PREDICTED DISTRIBUTION: hitting
        time geometric with mean N/S in both arms; compare the two empirical
        distributions by a two-sample KS test and report the statistic. TAIL CHECK:
        the 95th percentile hitting time against the geometric prediction, since a
        heavy tail on the progression arm would indicate the walk correlates with
        the progression's additive structure -- the one way H2 could fail, and the
        informative failure. DECAY PARAMETER: S; the two arms must agree at every
        S. TRANSFER ASSUMPTION: none beyond the sampled p and S.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. What is fixed is the OFFLINE
      accounting: building a Bernstein-Lange table on E' costs 1.24*N^{2/3}
      multiplications whether it is built fresh or transported-and-repaired, the
      two differing by O(S*log N) = O(N^{1/3} log N) in the transport's favour and
      by Theta(S*ell) field operations against it. The online exponent stays 1/3.
    memory_exponent: >-
      1/3 in N, identical in both arms. Transport introduces no new store; the
      repair walks are O(1) memory each and embarrassingly parallel across entries,
      which is the one place the transported arm is not worse.
    best_known: >-
      Bernstein-Lange: table N^{1/3}, precomputation 1.24*N^{2/3} multiplications,
      online 1.77*N^{1/3} (retrieved this session). Corrigan-Gibbs--Kogan frontier
      S*T^2 = Omega~(N) (KN-TECH-005, KN-LIT-013). Parallel rho at 0.886*sqrt(N),
      O(1) memory (KN-TECH-001, KN-TECH-006). BSGS at sqrt(N)/sqrt(N), full cost
      N^{2/3+o(1)} (KN-TECH-031, KN-TECH-035). Kuhn-Struik multi-target rho at
      sqrt(M*N). THE RQ'S SECOND NAMED BASELINE, "Mihailescu", HAS ZERO RECORDS IN
      THIS CORPUS and a web search this session surfaced only MIHALCIK (2010),
      cited in the preprocessing literature alongside Bernstein-Lange; the RQ's
      decision_target may therefore name a baseline that does not exist under that
      spelling, which is reported here as a defect to be adjudicated and is NOT
      relied on by any claim in this record.
    hidden_overhead: >-
      Disclosed. (1) The closure's central structural fact about Bernstein-Lange's
      entry construction is RECALLED and unverified; if false the horn collapses.
      (2) Horn 1's margin is a field-ops-per-group-op constant and shrinks under
      sqrt-Velu from ell to sqrt(ell)*polylog. (3) The O(log N) seeding saving is
      real but vanishing; quoting it as "transport saves the seeding cost" without
      the N^{1/3} denominator would be exactly the mis-scoring this record exists
      to prevent. (4) Horn 1 is stated in the work model and is NOT robust to
      IDEA-20260830-da8950's AT^2 recharge; Horn 2 is.
    tradeoff_note: >-
      No time-memory tradeoff is introduced and none is claimed. The record is a
      statement about where on the existing S*T^2 = Omega~(N) frontier the two
      construction routes land, and the answer is the same point. Parallelization
      position: both the fresh build and the transport-plus-repair are
      embarrassingly parallel across entries with O(1) memory per worker, so the
      comparison is unaffected by parallelisation in the work model -- which is
      precisely why Horn 2 survives the AT^2 recharge that Horn 1 does not.

