  confounders:
    - >-
      TOY DISTINGUISHEDNESS RATE. If d is small, mean walk length 2^d is a handful
      of steps and the repair/fresh comparison has almost no dynamic range; if d is
      large, few entries are produced within budget. The d sweep with mean walk
      length between 16 and 64 is the only workable window at these primes and is
      the binding power constraint on the whole record.
    - >-
      THE COMMITTED RUN'S OBJECT IS NOT THIS OBJECT. EV-ENDO-10109d transported a
      consecutive-multiples table; this record's Horn 2 concerns a
      distinguished-point table that has never been built in this harness. No
      number from the committed runs may be reused for Horn 2, and this record does
      not reuse one.
    - >-
      FIELD VERSUS GROUP OPERATIONS. Horn 1's margin is Theta(ell) field operations
      against one group operation and therefore depends on the measured field-ops
      per group-op constant. It must be measured per bit size on the same machine,
      and Horn 1's conclusion must be checked to survive a factor-2 perturbation.
      Horn 2's conclusion does not depend on that constant and says so.
    - >-
      THE WALK'S DEPENDENCE ON ITS START. If the walk function is implemented so
      that the first step depends only on a counter rather than on the point, the
      two arms are equal for a trivial reason. The deliberately-distinguished-start
      control exists to catch exactly this and is blocking.
    - >-
      CONFLATING THE CLOSURE WITH ITS MEASUREMENT. (C) and (D) are arguments; STAGE
      1-3 are consistency checks. A passing measurement does not prove the closure
      and a failing one indicts the measurement first. That ordering must appear in
