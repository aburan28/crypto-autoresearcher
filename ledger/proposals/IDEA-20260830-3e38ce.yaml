idea:
  id: IDEA-20260830-3e38ce
  question_id: RQ-MTGT-2cabee
  added: '2026-08-30'
  title: >-
    THE RE-DISTINGUISHING OBSTRUCTION CLOSES THE LANE FOR THE RQ'S OWN NAMED
    BASELINE AT EVERY ell AND EVERY p WITHOUT A SINGLE FURTHER RUN: a genuine
    Bernstein-Lange table costs 1.24*N^{2/3} multiplications for N^{1/3} entries,
    i.e. Theta(N^{1/3}) PER ENTRY, because each entry is the distinguished
    endpoint of a walk -- and a transported entry lands on E' as a uniformly
    distributed NON-distinguished point, statistically identical to a fresh random
    start, so repairing the predicate costs exactly a fresh entry and transport
    saves only the O(log N) seeding scalar multiplication out of Theta(N^{1/3});
    composed with the opposite horn (a table with no encoding predicate is
    rebuildable at ONE group operation per entry, which is what EV-ENDO-10109d
    actually measured) this is a pincer with no gap, and the surviving escape is
    named
  class: mechanism

  claim: >-
    (A) THE OBJECT EV-ENDO-10109d MEASURED IS NOT THE OBJECT THE RQ NAMES. The
    committed sweep fixes `table_size` at 400 and charges the rebuild at
    `rebuild_incremental`, one addition per consecutive multiple -- i.e. the table
    {[1]P, ..., [400]P}. The RQ's decision_target names the BERNSTEIN-LANGE
    preprocessing bound. Bernstein-Lange (retrieved this session) is a table of
    size N^{1/3} precomputed with 1.24*N^{2/3} multiplications for online
    1.77*N^{1/3}. Dividing, THE BERNSTEIN-LANGE PER-ENTRY CONSTRUCTION COST IS
    1.24*N^{1/3} MULTIPLICATIONS, not one addition. The two objects differ in
    per-entry rebuild cost by a factor Theta(N^{1/3}). The committed negative was
    therefore measured on the object with the CHEAPEST POSSIBLE REBUILD in the
    whole lane, which is exactly the object against which transport has the least
    chance -- and that is a scope fact about the evidence, not an error in it.

    (B) SO THE OBVIOUS HOPE. Against a rebuild costing Theta(N^{1/3}) per entry, a
    transport costing Theta(ell) field operations per entry should win by
    N^{1/3}/ell, an enormous margin at any cryptographic size. This record's
    content is that THE HOPE FAILS, and fails for a reason that is derivable at
    zero compute and holds at every ell and every p.

    (C) THE RE-DISTINGUISHING OBSTRUCTION -- THE NAMED OBSTRUCTION. The
    Bernstein-Lange per-entry cost is Theta(N^{1/3}) BECAUSE each entry is the
    endpoint of a pseudorandom walk run until it hits a DISTINGUISHED point; the
    entries are pinned by a predicate on the ENCODING, which is
    IDEA-20260807-e0ddc6's Class II. Let phi be an F_p-isogeny with
    gcd(deg phi, N) = 1, and let A = {(R_i, r_i)} be such a table on E. Then:
      (i) phi_*(A) = {(phi(R_i), r_i)} is a valid known-log set on E' -- the
          logarithms survive exactly (T1). This is the Class I half and it is not
          in dispute.
      (ii) The predicate does not survive. Distinguishedness is a condition on the
          bits of x(R'), and x(phi(R)) = f_phi(x(R)) for a rational function of
          degree deg phi. Under the standard encoding heuristic the transported
          x-coordinates are indistinguishable from uniform, so the expected number
          of transported entries that remain distinguished is S*2^{-d}, the chance
          rate -- exactly e0ddc6's Class II prediction.
      (iii) AND HERE IS THE STEP NO RECORD IN THIS CORPUS TAKES: REPAIRING THE
          PREDICATE COSTS EXACTLY AS MUCH AS BUILDING A FRESH ENTRY. To turn
          (phi(R_i), r_i) into a usable Bernstein-Lange entry on E' one walks from
          phi(R_i) with the known-log walk until a distinguished point is reached.
          But from E''s point of view phi(R_i) is a uniformly distributed,
          non-distinguished group element with a known logarithm -- which is
          PRECISELY the distribution of the fresh random start g^y that
          Bernstein-Lange's own precomputation uses. The two walks are
          statistically identical, so the repair walk has the same expected length
          as a fresh build walk, Theta(N^{1/3}) group operations.
      (iv) THEREFORE THE ONLY THING TRANSPORT SAVES IS THE SEEDING SCALAR
          MULTIPLICATION [y]P, which costs O(log N) group operations, out of a
          per-entry cost of Theta(N^{1/3}). THE SAVING FRACTION IS
          O(log N / N^{1/3}), WHICH TENDS TO ZERO. Meanwhile transport PAYS
          Theta(ell) field operations per entry. Net per-entry balance:
          pay Theta(ell) field ops, save O(log N) group ops out of Theta(N^{1/3}).
          FOR EVERY ell >= 3 AND EVERY p THE TRANSPORT ARM IS NET-NEGATIVE FOR
          THE BERNSTEIN-LANGE OBJECT, asymptotically and concretely, and no
          crossover exists in ell, in p, or in S.

    (D) THE OTHER HORN, WHICH IS THE COMMITTED MEASUREMENT. Suppose instead the
    preprocessing object has NO encoding predicate -- its value is a function of
    the (point, logarithm) pairing alone (e0ddc6 Class I). Then its entries are
    free to be ANY size-S known-log set, and any such set is buildable by a chain
    R_{i+1} = R_i + P at ONE group operation per entry (work Theta(S)). Transport
    costs Theta(ell) field operations per entry against a rebuild of one group
    operation per entry, so transport loses by Theta(ell) with no crossover. THAT
    IS EXACTLY EV-ENDO-10109d's MEASUREMENT, and this derivation removes its
    qualifiers: the committed "no crossover for ell in [3,31] at p in {50021,
    60013}" becomes "no crossover at any ell, any p, any S" for the Class I horn.

    (E) THE PINCER, AND WHY THERE IS NO THIRD CASE. A preprocessing object either
    requires its entries' encodings or it does not.
      -- If it does NOT (Class I): the entry set is re-choosable, the rebuild is
         one group operation per entry, transport loses by Theta(ell). [Horn 1,
         (D), measured by EV-ENDO-10109d.]
      -- If it DOES (Class II, which includes the RQ's own Bernstein-Lange
         baseline): the rebuild is expensive PRECISELY BECAUSE the predicate must
         be hit, transport does not deliver the predicate, and repairing it costs a
         fresh build. Transport loses. [Horn 2, (C), derived here.]
      THE EXPENSE OF THE REBUILD AND THE UNTRANSPORTABILITY OF THE OBJECT HAVE THE
      SAME CAUSE. That is the obstruction, and it is a no-free-lunch statement, not
      a coincidence: cheap-to-rebuild and transport-preserved are the same
      property, and expensive-to-rebuild and encoding-pinned are the same property.

    (F) FORWARD GUIDANCE -- WHAT SURVIVES, NAMED, WITH THE STEP THAT FAILS. This
    is a closure at the docs/inventor-protocol.md section 4 standard, so it says
    where it stops.
      OPEN-1. LOG-PINNED OBJECTS. An object whose entry set is pinned by the
        LOGARITHMS rather than the encodings -- auxiliary-input tables of the form
        {[d^i]P}, Cheon-style structures, any table whose entry set is specified in
        advance and may not be re-chosen. Step (D)'s "the entry set is
        re-choosable" fails; step (C)(ii)'s "the predicate dies" also fails,
        because logarithms transport exactly. Both horns miss it. This is the live
        cell and it is filed separately as IDEA-20260830-4a88d9.
      OPEN-2. sqrt-VELU. If per-point evaluation is O~(sqrt(ell)) rather than
        Theta(ell), Horn 1's loss factor drops from ell to sqrt(ell)*polylog but
        remains above the one group operation per entry that the chain rebuild
        costs, so Horn 1 stands with a smaller margin. Horn 2 is untouched, since
        its balance is O(log N) saved against Theta(N^{1/3}) and does not involve
        ell at all. Stated because the margin, not the sign, is what changes.
      OPEN-3. MODE B. This record is about moving the TABLE. Moving the TARGETS
        (IDEA-20260807-a127ab Mode B) costs 2*c_eval independent of S and is NOT
        closed here; its accounting is the M-curve family amortisation with a
        measured single-instance delta of zero.
      OPEN-4. THE AT^2 RECHARGE. Horn 1's Theta(ell)-versus-one-group-operation
        comparison is a WORK comparison. IDEA-20260830-da8950 argues the same two
        arms have different DEPTHS and that an area-optimised AT^2 charge reverses
        the sign. Horn 2 is robust to that -- a repair walk of expected length
        Theta(N^{1/3}) is a sequential walk with depth Theta(N^{1/3}), so the
        depth argument does not rescue it -- but Horn 1 is NOT, and this record
        does not claim it is.
      OPEN-5. NON-CLASSICAL AND NON-F_p SETTINGS. Nothing here applies to quantum
        models, to extension fields, or to supersingular classes.

  mechanism: >-
    STEP 1 (zero compute, and it is the whole result). Write (C) out as a formal
    argument: state the Bernstein-Lange entry construction, state the transported
    point's distribution on E', state the equality of the two expected walk
    lengths, and derive the O(log N / N^{1/3}) saving fraction. Write (D)
    symmetrically. Write (E) as the dichotomy with its no-third-case argument.
    STEP 2 (zero compute, BLOCKING NEARBY-OBJECT CONTROL). Apply the IDENTICAL
    argument to a LOG-PINNED object, {[d^i]P} for fixed d. THE ARGUMENT MUST FAIL:
    there the entry set is not re-choosable (so Horn 1's chain does not apply) and
    the predicate is on logarithms, which transport preserves (so Horn 2's repair
    step does not apply). If the argument appears to close the log-pinned object
    too, it proves too much and this record is void rather than strengthened.
    STEP 3 (zero compute, SECOND BLOCKING CONTROL). Apply the argument to Mode B.
    IT MUST FAIL THERE TOO -- Mode B moves two points, not S entries, and no
    predicate is involved. An argument that also closes Mode B has smuggled in a
    quantifier over transport modes that it does not have.
    STEP 4 (minutes, the empirical consistency check, which is a CHECK AND NOT A
    PROOF). On one toy class, build a genuine distinguished-point table on E,
    transport it, and measure: the fraction of transported entries still
    distinguished on E' (predicted 2^{-d}, the chance rate); the expected repair
    walk length from a transported entry versus from a fresh random start
    (predicted equal within seed noise); and the resulting per-entry cost ratio
    (predicted 1 + O(log N / N^{1/3})).
    STEP 5 (minutes, POSITIVE CONTROL). The same measurement at ell = 1 with phi
    an F_p-isomorphism. An isomorphism of short Weierstrass curves acts by
    x -> u^2 x, so a low-bits distinguishedness predicate is STILL destroyed while
    a dilation-invariant predicate is preserved -- e0ddc6's recorded asymmetry.
    The instrument must reproduce it, or it is not measuring the predicate.
    STEP 6 (zero compute). Emit the closure with OPEN-1 through OPEN-5 in a form
    the Coordinator can route, and file a KN-LIT record for Bernstein-Lange, which
    this corpus does not have.

  novelty_status: unverified

