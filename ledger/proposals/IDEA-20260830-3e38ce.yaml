  assumptions:
    - >-
      gcd(deg phi, N) = 1, so phi restricted to the prime-order subgroup is an
      injective homomorphism and logarithms transport exactly. This is the exact
      hypothesis under which the Class I half holds and the exact place it fails.
    - >-
      The encoding heuristic: for deg phi >= 2 the transported x-coordinates
      x(phi(R_i)) are indistinguishable from uniform in F_p with respect to the
      distinguishedness predicate. Stated as heuristic H1 below with its own
      validation route.
    - >-
      The Bernstein-Lange entry construction is "walk from a random known-log
      start until distinguished". RELAYED AND NOT VERIFIED AGAINST THE PAPER BODY.
      If it is false the whole of claim (C) must be re-derived; the record says so
      rather than burying it.
    - >-
      A group operation on E' costs Theta(1) field operations with the constant
      measured in-harness, and a Velu evaluation costs Theta(ell) field operations
      (relayed at second hand). Horn 1's margin depends on both constants; Horn 2's
      does not.
    - >-
      Horn 1's "any size-S known-log set is as good as any other" holds for
      objects whose value is the pairing alone. Where the SPECIFIC set matters the
      object is by definition not Class I and falls under Horn 2 or OPEN-1.

  proof_search_map:
    bottleneck: >-
      Step (C)(iii): the assertion that a transported entry is, from E''s point of
      view, statistically identical to a fresh random start, so that the repair
      walk and the build walk have the same expected length. Everything else in
      the closure is bookkeeping. Every objection will attack this step, and it is
      the step heuristic H1 exists to validate.
    baseline_embedding:
      parameter_slice: >-
        ell = 1 with phi the identity map. Transport is a copy, the predicate is
        preserved exactly, the repair cost is zero, and the saving is the entire
        build cost -- i.e. the argument must degenerate to "transporting a table to
        the curve it is already on is free", which is trivially true and is the
        estimator's zero point.
      reproduction_check: >-
        The measured retention at phi = identity must be exactly 1.000 (400 of 400
        still distinguished) and the measured repair walk length exactly 0. A
        pipeline reporting a nonzero repair cost at the identity is charging its
        own overhead and every repair figure it produces is inflated. Additionally,
        at ell = 1 with a NON-identity F_p-isomorphism (u not equal to 1) the
        retention must FALL to the chance rate for a low-bits predicate and stay at
        1.000 for a dilation-invariant predicate, reproducing e0ddc6's recorded
        asymmetry.
    observation_collision:
      observable: "expected repair walk length equals expected fresh build walk length"
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Two walks of equal expected length are
        also produced when the walk implementation is insensitive to its starting
        point for a trivial reason -- for instance if the walk's first step
        re-randomises unconditionally, or if the distinguishedness rate is so high
        at toy scale that every walk terminates in one or two steps. Both would
        give equality with nothing to do with the argument. The disambiguators are
        (a) a DELIBERATELY DISTINGUISHED start, from which the repair walk must
        have length 0 while a fresh start does not, and (b) the distinguishedness
        parameter d swept so that the mean walk length 2^d is resolvable well above
        1. Reporting the equality without both is prohibited by this record.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The pair (per-entry rebuild cost, encoding-dependence of the value
          predicate) as a single two-coordinate invariant of a preprocessing
          object, replacing the one-dimensional question "does the table
          transport".
        predicted_gain: >-
          Turns a per-object measurement into a two-case derivation covering all
          objects in the plane, which is what makes the closure exhaustive rather
          than a list. No attack gain; zero.
      - transform: observable_fiber
        proposed_object: >-
          The fibre "known-log sets of size S on E'", inside which the specific set
          is free for Class I objects and pinned for Class II objects. The
          per-entry rebuild cost is exactly the price of the pinning.
        predicted_gain: >-
          Exhibits the no-free-lunch coupling as an identity rather than a
          coincidence, so the closure does not depend on which objects happened to
          be enumerated.
    quantifier_order: >-
      CLAIMED: FORALL preprocessing objects A whose value predicate is a function
      of the encoding, and FORALL F_p-isogenies phi with gcd(deg phi, N)=1, the
      expected per-entry cost of repairing phi_*(A) on E' equals the expected
      per-entry cost of building a fresh entry, up to the O(log N) seeding term.
      AND: FORALL objects whose value predicate is a function of the pairing
      alone, EXISTS a rebuild at one group operation per entry.
      EXPLICITLY NOT CLAIMED: FORALL objects -- the log-pinned class of OPEN-1
      satisfies neither antecedent, and the closure does not reach it. The audit
      obligation is that the two antecedents are not exhaustive over ALL objects,
      only over objects whose entry set is either free or encoding-pinned, and the
      record names the remainder rather than assuming it away.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For preprocessing objects that are either encoding-pinned or
        pairing-valued, isogeny transport of the TABLE is net-negative against a
        correctly costed rebuild at every ell >= 3 and every p, in the sequential
        work model." It can NEVER certify anything about log-pinned objects, about
        Mode B, about the AT^2 recharge of Horn 1, about quantum models, or about
        the online phase. Any summary dropping "in the sequential work model" or
        "transport of the table" is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE LOG-PINNED TABLE {[d^i]P}, per STEP 2. The argument MUST fail there.
        This control is what distinguishes a closure from a slogan and it is
        blocking; a version of this argument that also closes the log-pinned object
        proves too much and voids the record.
    proof_obligations:
      - claim: "Bernstein-Lange per-entry construction cost is Theta(N^{1/3}) multiplications."
        responsibility: correctness
      - claim: "A transported entry is non-distinguished on E' with probability 1 - 2^{-d}."
        responsibility: correctness
      - claim: "The repair walk and the fresh build walk have equal expected length."
        responsibility: correctness
      - claim: "Any size-S known-log set is chain-buildable at one group operation per entry."
        responsibility: correctness
      - claim: "The argument FAILS on the log-pinned nearby object."
        responsibility: soundness
      - claim: "The argument FAILS on Mode B."
        responsibility: soundness
      - claim: "The identity arm reports retention 1.000 and repair cost 0."
        responsibility: baseline
      - claim: "No claim is made outside the sequential work model."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        fraction of transported Bernstein-Lange-style entries that remain
        distinguished on E' under the same predicate
      direction: lower
      minimum_effect: >-
        At the chance rate 2^{-d} for every ell >= 2, within binomial noise at
        S = 400. A retention materially above chance at any ell >= 2 refutes
        heuristic H1, refutes e0ddc6's Class II prediction, and requires
        independent replication before any interpretation.
    - metric: >-
        ratio (expected repair walk length from a transported entry) / (expected
        walk length from a fresh random known-log start)
      direction: different
      minimum_effect: >-
        1.00 +/- 0.10 over at least 200 walks per arm. A ratio materially BELOW 1
        is the falsifier that reopens the lane -- it would mean transported points
        are systematically closer to distinguishedness than fresh ones, which
        contradicts H1 and would be the lane's first live target in this horn.
    - metric: >-
        per-entry cost ratio (transport plus repair) / (fresh Bernstein-Lange
        build), at fixed d and S
      direction: higher
      minimum_effect: >-
        At least 1.00, predicted 1 + Theta(ell*c_F/N^{1/3}) - O(log N/N^{1/3}),
        i.e. never below 1 at any tested ell or p. A measured value below 0.9 at
        any cell falsifies the closure.
    - metric: >-
        applicability of the closure argument to the log-pinned object {[d^i]P}
      direction: different
      minimum_effect: >-
        MUST FAIL, at both horns, with the failing step named explicitly. An
        argument that appears to extend to the log-pinned object is a falsification
        of this record and the record is superseded rather than amended.
    - metric: >-
        applicability of the closure argument to Mode B (pull the two target
        points)
      direction: different
      minimum_effect: >-
        MUST FAIL. Mode B moves 2 points and involves no predicate; an argument
        that closes it has an illegitimate quantifier over transport modes.
    - metric: >-
        retention at ell=1 under a non-identity F_p-isomorphism, low-bits predicate
        versus dilation-invariant predicate
      direction: different
      minimum_effect: >-
        Chance rate for the low-bits predicate and 1.000 for the dilation-invariant
        predicate, reproducing e0ddc6's recorded asymmetry. Failure to reproduce it
        means the instrument is not measuring the predicate at all.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, AND IT IS THE DELIVERABLE): STEP 1's written argument
      plus STEP 2 and STEP 3's two blocking nearby-object controls. A closure is a
      written argument; if it does not survive review here there is nothing to run,
      and if either control fails the record is void rather than weakened. THIS
      STAGE ALONE ANSWERS THE RQ FOR THE BERNSTEIN-LANGE OBJECT AND COSTS NOTHING.
      STAGE 1 (minutes, THE CHEAPEST VALID EMPIRICAL DISCRIMINATOR): on one toy
      class at p=50021, build a distinguished-point table with d chosen so the mean
      walk length 2^d is between 16 and 64, transport it at ell=3, and measure the
      two numbers that decide claim (C): retention (predicted 2^{-d}) and the
      repair/fresh walk-length ratio (predicted 1.00 +/- 0.10, over 200 walks per
      arm). Everything else in the record is arithmetic around those two numbers.
      STAGE 2 (minutes): the identity arm, the deliberately-distinguished-start
      arm, and the dilation-invariant-predicate arm.
      STAGE 3 (low hours): sweep ell in {3, 5, 7, 11, 17, 31}, d in {4, 5, 6}, and
      both committed primes; report the per-entry cost ratio per cell.
      STAGE 4 (zero compute): write the closure with OPEN-1..OPEN-5 and file the
      Bernstein-Lange KN-LIT record the corpus lacks.
    controls:
      - >-
        IDENTITY ARM phi = id: retention 1.000, repair cost exactly 0. BLOCKING.
      - >-
        NON-IDENTITY F_p-ISOMORPHISM at ell=1: low-bits predicate at chance,
        dilation-invariant predicate at 1.000 (e0ddc6's asymmetry reproduced).
      - >-
        DELIBERATELY DISTINGUISHED START: repair walk length 0, against a fresh
        start's 2^d. This is the observation-collision disambiguator and it is
        blocking.
      - >-
        LOG-PINNED NEARBY OBJECT {[d^i]P}: the argument must fail. BLOCKING.
      - >-
        MODE B: the argument must fail. BLOCKING.
      - >-
        RANDOM-RELABELLING NULL of identical size: log certificates at 1/N, so the
        transported set is shown to be a genuine transport and not a shuffle.
      - >-
        d SWEEP as the decay parameter: the repair/fresh ratio must stay at 1 while
        the absolute walk lengths scale as 2^d. A ratio that drifts with d means
        the walks are not comparable and the arm is void.
      - >-
        Matched Pollard rho and BSGS rows on the same instances, per the RQ.
    required_metrics:
      - per cell, retention of the distinguishedness predicate after transport
      - per cell, mean and distribution of repair walk length from transported entries
      - per cell, mean and distribution of walk length from fresh random known-log starts
      - the ratio of the two with a confidence interval, over at least 200 walks per arm
      - per-entry field-operation cost of transport, measured not assumed
      - per-entry group-operation cost of a fresh Bernstein-Lange entry, measured
      - the combined per-entry cost ratio, per cell
      - pass/fail of every control, with the failing step named for the two nearby objects
      - per-entry log certificates [r_i]phi(P) == phi(R_i), 400 of 400

