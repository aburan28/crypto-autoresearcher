  assumptions:
    - >-
      lambda in F_2[X] is chosen per cell as the polynomial with the LARGEST
      F_{2^n}-root count found by IDEA-20260916-3f7a1c's toy sweep at that
      (n, n'), so that T has solutions on some attempts; where every lambda
      gives |V| <= 2, the cell measures S's cost with T almost always empty
      and says so (UNSAT-like instances are reported separately, per
      RQ-ICPERF-94c86e).
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 is the algorithm; the Weil-descent
      Semaev system used as the control is the SEMBIN/DREG object and is
      built only to be compared against, at the same (n, m) with V a
      subspace of dimension n' = ceil(n/m), never re-proposed.
    - >-
      The engine is named and versioned in every cell; a cell that exceeds
      the memory envelope or the wall-clock pre-flight is censored, never a
      cost observation (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      The decomposition cost C(q, n, m, n') of Theorem 2.1, which the paper
      bounds by Rojas and this program has never measured for the
      no-Weil-descent chain. Its measured growth in m and d is the only
      thing that could move H1 of IDEA-20260916-5c9d6e or the pricing of
      IDEA-20260916-a17f43.
    baseline_embedding:
      parameter_slice: >-
        d = 1, lambda = X, n' | n (n composite, e.g. n = 33, n' = 11, m = 3):
        the chain becomes the Galois-conjugate system of the Diem/Gaudry
        subfield case, where Rojas' bound reads n^{5.188} 3^{4.876 n^2} yet
        the system is known to be solvable by Weil descent to F_{2^{n'}}.
        This slice is where the paper's own model is most obviously an
        overestimate and is the calibration point: measured D_S there
        against M(E) = 2^{m(m-1)}.
      reproduction_check: >-
        At (n, m, d) = (33, 3, 1): D_S must equal the number of closure
        solutions of the Galois-conjugate system, which is also computable by
        Weil descent (a frozen fixture from the control arm). Agreement of
        the two engines' solution counts on the same instance is the
        reproduction check.
    observation_collision:
      observable: >-
        D_S per cell (the ideal degree) and the measured time per attempt.
      distinct_preimage_search: >-
        Two systems with the same D_S but very different solve times exist
        whenever the engine's strategy differs (F4 with a good selection
        strategy versus resultants); so time alone identifies nothing and
        D_S alone identifies nothing about time. Both are reported, and the
        comparison to M(E) is made on D_S, the engine-independent number.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Split the per-attempt cost into engine-independent (D_S, the
          eliminant degree) and engine-dependent (time, memory, max degree)
          charges, and compare the paper's floor only with the former.
        predicted_gain: >-
          Makes the H1 validation immune to engine artefacts.
    quantifier_order: >-
      FORALL cells (n, m, d) in the ladder, FORALL sampled targets: D_S is
      measured; the record claims EXISTS a growth law in m at fixed d fitted
      over the cells run, and nothing at cells not run. No transfer to
      n = 131 is claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At the listed cells, with the named engines, D_S = ... and the
        per-attempt time is ...; the ratio D_S / M(E) is ...; the relaxation
        slack is ...'. It cannot certify Rojas' exponent (no toric-resultant
        implementation exists here), cannot reach (4, 3) without the
        pre-flight passing, and cannot say anything about n = 131.
      nearby_object_control: >-
        The Weil-descent Semaev system at the same (n, m) with a subspace
        factor base of dimension ceil(n/m), solved by the same Groebner
        engine over ZZ/2: the object where the conclusion 'cost is governed
        by M(E) of the chain' is KNOWN NOT TO APPLY, because it has no chain
        and its cost is governed by the first-fall/solving-degree debate
        (KN-LIT-fa346d lineage). A measurement that cannot tell the two
        systems apart at (n, m) = (23, 3) has not measured the chain.
    proof_obligations:
      - claim: The chain builder reproduces S^{(k)} per-variable degrees d^k 2^{m-1}.
        responsibility: correctness
      - claim: D_S is computed by an engine-independent method (Groebner staircase count or eliminant degree) and agrees between two engines at m <= 3.
        responsibility: baseline
      - claim: Every reported relation (solution of T with y_i in K) is re-verified by curve arithmetic.
        responsibility: correctness
      - claim: The (4, 3) cell is attempted only after a monomial-count pre-flight bounds the Macaulay matrix within the memory envelope.
        responsibility: memory
      - claim: Censored cells are labelled censored and excluded from fits.
        responsibility: scope

  predictions:
    - metric: D_S / M(E) at (m, d) in {(2,2), (2,3), (3,2), (3,3)}, n in {17, 23, 29, 41}
      direction: different
      minimum_effect: >-
        Reported as a ratio with its spread over targets. Under the paper's
        model the ratio is <= 1 and near 1; a ratio below 1/4 at m = 3 that
        shrinks further at (4, 2) is the 'degenerate chain' outcome and is
        the informative one. Either outcome is recorded; no direction is
        promised.
    - metric: relaxation slack D_S / #Z(T) per cell
      direction: higher
      minimum_effect: >-
        >= 10 at every cell with m >= 3 (the relaxation is expected to be
        loose by at least an order of magnitude). A slack near 1 would mean
        S is nearly exact, which would contradict the paper's own remark
        that S may have more solutions than T.
    - metric: fitted growth exponent of log2(time) in m at fixed d = 2 over m = 2, 3, 4
      direction: lower
      minimum_effect: >-
        Below Rojas' 4.876 * log2(3d) per unit m^2 (which is 12.6 at d = 2)
        by at least a factor 2; the measured exponent, not the direction, is
        the deliverable.
    - metric: Weil-descent control time at (23, 3) versus chain time at (23, 3)
      direction: different
      minimum_effect: >-
        Reported as a ratio; no direction predicted. The control exists to
        show the instrument distinguishes the objects.

  minimal_test:
    design: >-
      STAGE 0 - ENGINE CHECK, MINUTES. Confirm Macaulay2 accepts
      toField(ZZ/2[a]/(f_17)) and solves a 2-variable toy; confirm the
      bit-packed F_{2^n} arithmetic and Sylvester resultant code reproduce
      each other's eliminant at (17, 2, 2). If no engine works over
      F_{2^41}, record the impediment and run the ladder at n in {17, 23}.
      STAGE 1 - BUILDER. Implement S_{m+1} for y^2 + xy = x^3 + 1 (the
      ECC2K-130 shape, toy n) and the chain S^{(k)} = phi(S^{(k-1)}); verify
      degrees and the identity f^{2^{n'}} = phi(f) mod L on random f.
      STAGE 2 - LADDER. Cells (n, m, d) with n in {17, 23, 29, 41},
      m in {2, 3}, d in {2, 3}, then (4, 2) under pre-flight, then (4, 3)
      under pre-flight; n' = ceil(n/m); lambda per cell from the toy census;
      >= 50 targets per cell; record D_S, #Z(T), relations found and verified,
      time, memory, max degree; SAT and UNSAT attempts reported separately.
      STAGE 3 - CONTROLS. Weil-descent Semaev system at (23, 3) and (29, 3)
      through the same Groebner engine over ZZ/2; the d = 1 subfield
      calibration slice at (33, 3, 1); an enumeration-over-V^m solve of T at
      every cell as the trivial floor.
      STAGE 4 - REPORT. Ratios, fits, censored cells, the M(E) discrepancy
      with the measured D_S beside both formulas, and the exact scope.
    controls:
      - 'Weil-descent Semaev system at the same (n, m): the nearby object where M(E) does not govern.'
      - 'd = 1, n'' | n subfield slice: calibration where Rojas is a known overestimate.'
      - 'Enumeration over V^m of T: the trivial floor, which by IDEA-20260916-3f7a1c is tiny at every prime-n cell.'
      - 'Two engines at m <= 3 must agree on D_S.'
      - 'Censoring discipline for memory/time.'
    required_metrics:
      - 'D_S, #Z(T), verified relations, per cell and per attempt'
      - 'time, peak RSS, max degree, engine name and version'
      - 'D_S / M(E) under both M(E) formulas'
      - 'control-arm numbers at the same cells'

  falsification_conditions:
    - 'Two engines disagree on D_S at a cell: the instrument is invalid there until localised.'
    - 'The builder fails the phi identity check: no cell may be reported.'
    - 'Relaxation slack < 2 at all m >= 3 cells: the record''s expectation about the relaxation is wrong (informative, not fatal).'
    - 'D_S > M(E) (paper formula) at any cell: the paper''s M(E) is not an upper bound for the ideal degree as read here, and the reading of Appendix A.1 must be re-examined.'

  confounders:
    - >-
      Engine strategy dominates time at small cells; only D_S is compared
      with the floor.
    - >-
      Multiplicities inflate D_S when S has non-reduced components; report
      the radical's degree as well where the engine can compute it.
    - >-
      The choice of lambda per cell affects #Z(T) but not D_S much; the
      dependence is measured by running two lambdas at one cell.
    - >-
      At n = 131 nothing here transfers; the record is explicit that its use
      is H1 validation and calibration of the layered-system cost for
      IDEA-20260916-a17f43.

  interpretation_limits:
    - >-
      A measurement at n <= 41 of a system whose factor base does not exist
      at cryptographic size (IDEA-20260916-3f7a1c). No attack, no exponent.
    - >-
      Scoped to the named engines, cells and targets; a censored cell is not
      a number.
    - >-
      KN-OPEN-020 class: implicit-membership factor base, inherited from the
      QSP construction; nothing here changes its class.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (The paper's Appendix B assumption, made measurable.) For a random
        target x_R, the ideal (S) is zero-dimensional with probability
        >= 0.95 at every cell of the ladder.
      rigorous_support: >-
        Rigorous ingredient: Theorem B.3 of KN-LIT-0a321c characterises
        dimension 0 through phi-chains of prime ideals; classical statement
        imitated: a system of m generic polynomials in m variables with
        given supports is zero-dimensional with exactly the BKK number of
        solutions.
      validation_plan: >-
        SAMPLE - 50 targets per cell; COMPARISON - the fraction of targets
        with dim (S) = 0 against 0.95; TAIL - list every positive-dimensional
        instance with its target; TRANSFER - none.
    - id: H2
      statement: >-
        D_S is within a constant factor (between 1/8 and 1) of the paper's
        M(E) = 2^{m(m-1)} d^{m(m-1)/2} at every zero-dimensional instance.
      rigorous_support: >-
        Rigorous ingredient: Bernstein's theorem bounds the number of
        isolated torus solutions by the mixed volume of the Newton
        polytopes, and the hypercube M(E) is an upper bound on that mixed
        volume; classical statement imitated: generic systems attain the
        mixed volume.
      validation_plan: >-
        SAMPLE - the ladder; COMPARISON - the distribution of D_S / M(E)
        per cell against [1/8, 1]; TAIL - the smallest ratio seen and the
        cell it occurs at; TRANSFER - none beyond the ladder.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The measurement's own cost is
      dominated by Groebner computations with quotient dimension up to 2^18
      (cell (4, 2)) over a 41-bit field -- hours per attempt at the top of
      the ladder, seconds at m <= 3.
    memory_exponent: >-
      Up to the machine envelope at (4, 2); GB-scale. (4, 3) at 2^21.5
      standard monomials is beyond a Groebner engine's memory here and is
      declared so.
    best_known: >-
      For the quantity: no measurement of the chain system exists in this
      program or, as far as the two frozen papers say, in the literature
      (KN-LIT-0a321c reports no implementation). For the ECDLP: rho at
      2^60.9.
    hidden_overhead: >-
      The engine-availability question over F_{2^41} is unresolved and may
      confine the ladder to n <= 23.
    tradeoff_note: Not applicable; trivially parallel over targets and cells.

  dominated_by: >-
    CHECKED. As an ECDLP result: n/a. As a measurement: no prior measurement
    of this object exists in the corpus (grep for quasi-subfield finds only
    the frozen-paper records, the analysis note and this task); the
    ICPERF/SEMBIN/DREG instruments measure Weil-descent systems and are used
    here as the control, not as competitors. Dominated on informativeness by
    a toric-resultant implementation that would measure Rojas' exponent
    directly, which does not exist here.
  sota_delta: >-
    Zero on every ECDLP cost axis. Produces the first measured D_S and
    per-attempt cost of the no-Weil-descent chain system at any cell, the
    first measured relaxation slack, and a numerical adjudication of the
    M(E) exponent discrepancy (2^{21.5} versus 2^{31.0} at (4, 3)) by direct
    count at smaller cells.

  estimated_cost:
    implementation: high
    compute: medium
    basis: >-
      A chain builder over bit-packed F_{2^n}, a Macaulay2 driver over
      toField(...) whose viability is unverified, a resultant engine for
      m <= 3, a Weil-descent control builder, and the certificate
      re-verification. Compute: seconds per attempt at m <= 3, hours at
      (4, 2), (4, 3) only under pre-flight.

  recommended_priority: low

  discriminated_from: >-
    IDEA-20260913-9ba7fc and the SEMBIN/DREG lane measure the solving degree
    of Weil-descended Semaev systems over F_2; this measures the ideal degree
    and cost of the paper's chain system over K with no descent, using the
    former as a control. IDEA-20260916-3f7a1c and -5c9d6e settle the factor
    base; this settles nothing and calibrates H1 and the successor system's
    cost model.

