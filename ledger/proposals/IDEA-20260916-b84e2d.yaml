idea:
  id: IDEA-20260916-b84e2d
  question_id: RQ-QSP-f9bbdb
  added: '2026-09-16'
  proposed_by: idea-generator
  session: TASK-20260916-a93a2a
  status: proposed
  title: >-
    ITEM (ii) MEASURED HONESTLY: the per-attempt cost, ideal degree and
    spurious-solution rate of the no-Weil-descent chain system
    S^{(k)} = phi(S^{(k-1)}) at executable cells (n <= 41, m in {2, 3, 4},
    d in {2, 3}) against the paper's own univariate floor
    M(E) = 2^{m(m-1)} d^{m(m-1)/2}, Rojas' 3^{kappa m^2} law, the enumeration
    floor |V|^m, and a Weil-descent Semaev system of the same (n, m) as the
    nearby-object control -- with the card's cell (m = 4, d = 3) priced at
    M(E) = 2^21.5 and declared reachable only through a memory pre-flight,
    and with a recorded discrepancy between the analysis note's M(E) exponent
    and Appendix A.1 of the frozen paper
  class: measurement

  claim: >-
    (A) WHAT IS MEASURED. For the chain system S = {S^{(0)}, ..., S^{(m-1)}}
    of KN-LIT-0a321c Section 3.1 over K = F_{2^n} with lambda in F_2[X] of
    degree d, the record measures per (n, m, d): (i) the vector-space
    dimension D_S of K[X_1..X_m]/(S) (the number of closure solutions with
    multiplicity), (ii) the number of solutions of the true system
    T = S union {L(X_i)} and the number with all y_i in K (actual relations),
    (iii) wall time, peak memory and the maximum degree reached by the
    engine, per attempt, over >= 50 random targets x_R per cell. The
    relaxation slack is D_S / #Z(T), the quantity Appendix B's
    zero-dimensionality heuristic leaves unpriced.
    (B) THE FLOOR IT IS COMPARED WITH, AND A DISCREPANCY. Appendix A.1 of the
    frozen paper gives M(E) = prod_{k=1}^m lambda_k with lambda_k =
    d^{k-1} 2^{m-1}, i.e. M(E) = 2^{m(m-1)} d^{m(m-1)/2}; at (m, d) = (4, 3)
    that is 2^{12} * 3^6 = 2^{21.5}. analysis/qsp-ecc2k130/qsp_ecc2k130.py
    encodes log2_ME = m(m-1)(1 + log2 d), i.e. 2^{m(m-1)} d^{m(m-1)}, which is
    2^{31.0} at the same cell, a factor 3^6 = 2^{9.5} larger. The record does
    NOT adjudicate (the note is outside its write scope); it reports both and
    measures D_S, which is the quantity both formulas are trying to predict.
    If the paper's formula is the right one, table.md's row (33, 3, 4, 131)
    has floor max(29.6 + 21.5, 53.9) = 53.9 rather than 60.6 -- which would
    have put the paper's floor BELOW rho had the factor base existed; by
    IDEA-20260916-3f7a1c it does not, so the correction changes no
    conclusion, but the row should carry the right number.
    (C) WHY THIS IS STILL WORTH MEASURING AFTER IDEA-20260916-5c9d6e. Three
    reasons, in decreasing weight. (1) It validates heuristic H1 of that
    record -- that the per-attempt cost really grows like M(E) in d -- which
    is the scoping assumption of its 'cannot beat generic' corollary. (2) The
    chain construction (Frobenius twists of one summation polynomial, linked
    by a low-degree substitution, no Weil descent) is exactly the component
    reused by the successor object of IDEA-20260916-a17f43, whose viability
    turns on whether the measured cost of such a layered system is far below
    its Bezout number. (3) The card asks for it. It is filed at LOW priority
    with that reasoning stated, not at high priority with the reasoning
    hidden.
    (D) WHAT EACH OUTCOME MEANS. D_S ~ M(E) across cells: the paper's floor
    model is right, H1 holds, and the chain system has no hidden structure a
    solver could exploit beyond generic BKK -- which also prices
    IDEA-20260916-a17f43's system at its mixed volume. D_S << M(E) (by a
    factor growing with m): the chain system is degenerate in a way the
    hypercube mixed-volume count misses; the deficit is the resource the
    successor object would want, and is reported as such. Measured time
    growing in m faster than any polynomial in M(E): the engine, not the
    object, is the bottleneck, and the cell is reported as an engine
    limit, never as evidence about cost.

  mechanism: >-
    OBJECT FRAME. Representation: x-coordinates in K = F_{2^n} directly, no
    descent (R1 class). Operation set Sigma = {phi}, the single map
    f -> F^{n'}(f)(lambda(X_1), ..., lambda(X_m)), under which the tracked
    object -- the ideal generated by the chain -- is closed by construction
    (phi(S^{(k)}) = S^{(k+1)}). Attack stage: relation decomposition.
    Trichotomy: Class I partial-action (index calculus); what this record
    measures is the branching of the relaxation, i.e. how many closure
    solutions of S are not solutions of T.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The object is the ideal (S), the
    projection of the true ideal (T) = (S) + (L(X_1), ..., L(X_m)) that
    DISCARDS the membership polynomials. Sigma-compatible: phi maps (S) into
    itself and the identity f^{2^{n'}} = phi(f) mod (L(X_i)) is what makes
    the discard consistent with T. Lossy: Z(S) contains Z(T) and, generically,
    much more -- the paper says 'the system S might have more solutions than
    T' and filters them. The loss is what (A)(i)-(ii) measure. This is a
    measurement of a known object's branching (L, b) in the sense of
    IDEA-20260802-002, not a new object.
    WHY THE CELL (4, 3) IS THE HARD ONE. S^{(k)} has degree d^k 2^{m-1} in
    each variable: at (4, 3) the four equations have per-variable degrees
    8, 24, 72, 216 and the quotient algebra has dimension about M(E) =
    2^{21.5} ~ 3 * 10^6 if the paper's count is right. A Groebner engine
    must hold a basis whose staircase has that many standard monomials over
    a 41-bit field: tens of GB. So (4, 3) is reachable only through a
    memory pre-flight and is otherwise recorded as censored. (3, 3) has
    M(E) = 2^6 * 3^3 = 1728, (3, 2) has 512, (4, 2) has 2^{18} = 262144 (the
    stretch cell), (2, d) is trivial. The ladder m = 2 -> 3 -> 4 at fixed d
    is what estimates the growth law, and the (4, 3) point is desirable but
    not load-bearing.
    ENGINES, STATED WITH THEIR LIMITS. Macaulay2 F4 over
    toField(ZZ/2[a]/(f_n)) for n in {17, 23, 29, 41} -- to be verified as
    working in this container before any cell is trusted; Singular's
    table-based GF(2^n) is limited to small n and is not an option at
    n = 41; msolve is prime-field only and is not an option; Sage is absent
    (IDEA-20260913-9ba7fc). A second, independent route for m in {2, 3}:
    resultant elimination (Sylvester resultants in K[X] implemented over
    bit-packed F_{2^n}) giving the univariate eliminant whose degree is
    compared with M(E) directly. If neither engine works at a cell, the cell
    is an impediment, not a number.

