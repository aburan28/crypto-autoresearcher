  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers and a BPSW or Miller-Rabin primality routine. No SEA, Sage or
      PARI backend is assumed anywhere; C3 and C4 are constructed to need
      none.
    - >-
      Primality in C3 is asserted at the PROBABLE-PRIME tier unless a
      certificate is produced. "Probable prime" may never be written as
      "prime" in the deliverable, and the six-element list is reproduced at
      whatever tier the routine actually reaches, stated per element.
    - >-
      Curve parameters are taken from the question record's intake and
      cross-checked against the mirror's equation and field tables before use.
      No parameter is typed from memory.
    - >-
      IDEA-20260829-b41d39's C2 and C3 have passed their own exhaustive toy
      census. Otherwise C4's cheap filter is two unvalidated symbol tests and
      the reported rank means nothing.
    - >-
      SafeCurves' rigidity comment is treated as a CLAIM TO BE TESTED, never
      as evidence. The question record declares every SafeCurves cell
      unverified intake and a comparison target only, and a prose comment on a
      criterion page is weaker than a cell, not stronger.

  proof_search_map:
    bottleneck: >-
      The `rigid` criterion is the one SafeCurves column that IDEA-20260829-f5bcff
      declares structurally un-invertible, describing it as a property of a
      design process that no computation can decide, and the archived audit
      plan's closure argument agrees. That conclusion is correct about
      RECOVERING a rigidity verdict from measurements and WRONG about
      EXECUTING a published recipe - when the recipe is fully stated, as it is
      for exactly this row, checking it is an ordinary finite computation. The
      bottleneck removed here is the belief that the rigid column is
      untouchable.
    baseline_embedding:
      parameter_slice: >-
        Restricted to its third cheap filter alone, C4 reduces exactly to
        IDEA-20260829-b41d39's C2 applied to a single d, and must reproduce
        that record's chi(1 - d) verdict bit for bit on d = -1174. Restricted
        to C1's conclusion alone, this record reduces to b41d39's completeness
        test and must agree with it on the same input.
      reproduction_check: >-
        A frozen fixture asserting that this record's completeness verdict for
        Curve1174 is bit-identical to b41d39's, and that the two independent
        derivations of it - one by evaluating chi(-1174) directly and one by
        evaluating chi(-1) via the Elligator shape - agree. Those two routes
        share only p, so agreement is a genuine cross-check of C1 and not a
        tautology.
    observation_collision:
      observable: >-
        The completeness bit chi(d), which is what C1 claims is determined,
        and the shape witness (s, c), which is what C1 claims determines it.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS THE EXPERIMENT. Search for two parameters
        over the SAME p = 3 mod 4 prime, both of the Elligator-1 shape, with
        DIFFERENT completeness verdicts. C1 says none exists and the search
        must be exhaustive at toy scale to be worth anything. PREDICTED - zero
        found over p = 3 mod 4, and, in the mirror-image search, EVERY shaped
        parameter over a p = 1 mod 4 prime is non-complete, so the shape class
        is a perfect predictor in both directions with opposite signs. A
        SECOND AND SHARPER COLLISION, WHICH IS THE ONE THAT WOULD HURT - two
        parameters with the SAME completeness verdict, one shaped and one not.
        These certainly exist and are abundant, which is the honest statement
        of C1's direction - the shape implies completeness and completeness
        does NOT imply the shape, so the two criteria are dependent but not
        equivalent, and the deliverable must say "implies" and never
        "equals".
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "is this 251-bit curve complete", answered by a
          modular exponentiation, by the question "is chi(-1) equal to -1",
          answered by reading one bit of p. The shape hypothesis is what
          licenses the replacement.
        predicted_gain: >-
          Completeness for Curve1174 at zero field operations rather than one
          modular exponentiation, which is a negligible cost saving and is NOT
          the point; the point is that a criterion cell is shown to be
          determined by another cell, which is an information statement rather
          than a cost statement.
      - transform: observable_fiber
        proposed_object: >-
          Hold the published output d = -1174 fixed and vary the forgotten
          structure - which subset of the stated conditions was actually
          binding - by enumerating the cheaply-qualifying candidates below it.
          The fibre's SIZE is the deliverable.
        predicted_gain: >-
          Converts "SafeCurves says this curve is fully rigid" into "of the
          about 10.2 bits of choice in an integer below 1174 in absolute
          value, about 3 are explained by conditions this environment can
          verify and about 7.2 by a prime-order condition it cannot",
          which is a quantitative statement about rigidity where the program
          currently has none.
    quantifier_order: >-
      C1 IS CLAIMED UNIFORMLY. FOR ALL primes p = 3 mod 4 and FOR ALL c in F_p
      with c not in {0, 1, -1} such that 2/c is a square, the parameter
      d = -(c+1)^2/(c-1)^2 satisfies chi(d) = -1 and E_d is a complete Edwards
      curve. No witness depends on the instance.
      C2 IS CLAIMED UNIFORMLY IN THE OPPOSITE DIRECTION. FOR ALL p = 1 mod 4
      and all such c, chi(d) = +1 and E_d is NOT complete.
      C3 IS CLAIMED EXISTENTIALLY AND FINITELY. THERE EXISTS a reading of
      "within 32" under which the set of primes 3 mod 4 in that window for
      e between 200 and 300 is EXACTLY the published six-element list. NOT
      CLAIMED - that SafeCurves intended that reading.
      C4 IS CLAIMED EXISTENTIALLY AND WITH AN EXPLICIT WITNESS. THERE EXISTS
      (s, c) over p = 2^251 - 9 with c = 2/s^2 and -(c+1)^2/(c-1)^2 = -1174,
      exhibited. NOT CLAIMED - that -1174 is the smallest qualifying value,
      since the prime-order condition cannot be verified for the rejected
      candidates in this environment. The rank is reported as an upper bound
      on how much the cheap conditions explain, and NEVER as a verification of
      minimality.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Curve1174's d has the published Elligator-1 shape, with witness s
        exhibited; over a prime 3 mod 4 that shape forces completeness, so the
        `complete` cell is implied by the `ind` and `field` cells; the
        published prime list is or is not reproducible under a stated reading;
        and 1174 has rank r among the cheaply-qualifying parameters." It
        certifies NOTHING about whether SafeCurves' generation process was
        actually followed, nothing about the designers' intent, nothing about
        the odd part of any order, and nothing about safety. A rigidity
        transcript that checks out is consistent with a manipulated curve
        whose manipulation happened to land on a reproducible recipe, and the
        deliverable must say so.
      nearby_object_control: >-
        THE OTHER FIVE EDWARDS ROWS ARE THE CONTROL AND THEY ARE SHARP,
        BECAUSE SAFECURVES CLAIMS THE ELLIGATOR SHAPE ONLY FOR THIS ONE. Test
        whether d = 160102 for E-222, d = -67254 for E-382, d = 3617 for
        Curve41417, d = -39081 for Ed448-Goldilocks and d = -376014 for E-521
        have the Elligator-1 shape over their own primes. PREDICTED - at most
        by coincidence, since the shape has density about one quarter and five
        independent draws give about a 24 percent chance that at least one
        lands in it. A shaped parameter found on a row where SafeCurves does
        not claim it is a NEW observation about the family and must be
        reported as a coincidence unless the row's own transcript supports it.
        The sharpest single control is CURVE41417, whose published cofactor is
        2^3 while every Elligator-1 curve over a 3 mod 4 prime is complete
        with no constraint at all on the depth - so the shape predicts
        completeness and predicts NOTHING about the cofactor, and an
        instrument that appears to predict the cofactor from the shape has
        fitted noise.
    proof_obligations:
      - claim: >-
          d = -(c+1)^2/(c-1)^2 equals -k^2 with k = (c+1)/(c-1), hence
          chi(d) = chi(-1), for every c not in {0, 1, -1}.
        responsibility: correctness
      - claim: 'chi(-1) = -1 exactly when p = 3 mod 4.'
        responsibility: correctness
      - claim: >-
          d a non-square implies E_d is a complete Edwards curve, by the
          Bernstein-Lange criterion, restated and census-validated rather than
          cited.
        responsibility: baseline
      - claim: >-
          The prime sweep of C3 is EXHAUSTIVE over the stated window and
          exponent range, not a sample, and reports its primality tier.
        responsibility: scope
      - claim: >-
          The shape witness (s, c) for d = -1174 verifies by exact field
          equality at 251 bits.
        responsibility: interface
      - claim: >-
          The cheap filter of C4 is applied identically to every candidate,
          with no special-casing of 1174.
        responsibility: strictness
      - claim: >-
          The reported rank is an upper bound on the explanatory power of the
          cheap conditions and is NOT a minimality verification.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        fraction of Elligator-1-shaped parameters over exhaustively enumerated
        p = 3 mod 4 toy primes for which the curve is complete
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 - 100 percent, exhaustive census, zero
        exceptions. Anything below 1.000 falsifies C1, which is presented as a
        theorem, so the derivation contains an error and the dependence claim
        is withdrawn.
    - metric: >-
        the same fraction over exhaustively enumerated p = 1 mod 4 toy primes
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0.000. THIS IS THE CONTROL THAT MAKES C1
        NON-VACUOUS. A value near 0.5 would mean the shape does not determine
        the square class at all and C1 is simply wrong; a value near 1.000
        would mean the shape forces completeness independently of the residue
        class, which would be a DIFFERENT and stronger theorem than C1 and
        would have to be re-derived before anything is claimed.
    - metric: 'chi(-1174) for p = 2^251 - 9, computed directly'
      direction: different
      minimum_effect: >-
        PREDICTED -1, that is Curve1174 IS complete, matching the mirror's
        complete cell. It must also equal chi(-1) computed from p mod 4 alone,
        which is the C1 cross-check. Disagreement between the two routes
        refutes C1 for this instance.
    - metric: >-
        existence and exhibition of s and c over p = 2^251 - 9 with c = 2/s^2
        and -(c+1)^2/(c-1)^2 = -1174
      direction: different
      minimum_effect: >-
        PREDICTED to exist, with the witness emitted and re-verifiable in
        about three field operations. NON-EXISTENCE would mean SafeCurves'
        published rigidity comment is FALSE on a checkable point for this
        curve, which is a material finding about a published specification and
        must not leave the repository before independent review.
    - metric: >-
        the set of primes 3 mod 4 in the stated window for e between 200 and
        300, under each of the two readings of "within 32"
      direction: different
      minimum_effect: >-
        PREDICTED that the one-sided reading 2^e - 32 to 2^e reproduces the
        published six-element list EXACTLY, and that the two-sided reading
        produces a strict superset. THE TWO OUTCOMES MEAN DIFFERENT THINGS -
        exact reproduction under some reading confirms the recipe and recovers
        its predicate form; failure under BOTH readings means either the
        published list is incomplete or the window is something else entirely,
        and the record must then report the discrepancy as a fact about the
        published transcript, listing the extra or missing primes explicitly.
    - metric: >-
        rank of 1174 among integers of absolute value below 1174 passing the
        three cheap conditions
      direction: different
      minimum_effect: >-
        PREDICTED between 100 and 220, centred near 147, from the derivation
        that three roughly independent symbol conditions of density one half
        each retain about one eighth of 1173 candidates. A rank of 0 would
        mean the expensive prime-order condition was never binding and the
        recipe is fully cheaply reproducible - a strictly stronger rigidity
        result and a genuine surprise. A rank far above 220 would mean the
        three conditions are positively correlated, which is itself a
        structural observation about the shape variety worth reporting.
    - metric: 'chi(1 - d) = chi(1175) for p = 2^251 - 9, and the derived twist 2-part'
      direction: different
      minimum_effect: >-
        PREDICTED -1, hence v_2(#E) = 2, hence cofactor 2-part exactly 4;
        and since s = 1 + v_2(2^251 - 8) = 1 + 3 = 4 and 2 is less than 4, the
        forcing theorem gives v_2(#E^t) = 2, hence twist cofactor 2-part
        exactly 4. Both match the mirror's published 2^2 and 2^2. A value of
        +1 contradicts a published cofactor; halt and escalate.
    - metric: >-
        number of the other five Edwards rows whose d has the Elligator-1
        shape over its own prime
      direction: different
      minimum_effect: >-
        REPORTED AS A COUNT WITH NO TARGET, but PRE-REGISTERED so the outcome
        is controlled rather than rationalised - the shape has density about
        one quarter, so the expected count over five rows is about 1.25 and
        observing one or two is unremarkable coincidence. Observing four or
        five would suggest the shape is a family-wide design constraint that
        SafeCurves documents for only one row, which would be a genuine and
        reportable observation about the family's rigidity transcripts.

  minimal_test:
    design: >-
      STAGE 0, zero compute, and it is the cheapest possible falsification of
      the record's central claim. Write out C1's two lines and C2's mirror
      image. If d = -(c+1)^2/(c-1)^2 is not minus a square, or chi(-1) is not
      -1 for p = 3 mod 4, the record dies at no machine cost.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR WITH COMPUTE, seconds, and it
      is C3 rather than anything about the curve. Run the prime sweep - for
      e from 200 to 300 and every offset in each of the two candidate windows,
      test primality and the residue 3 mod 4, and compare the resulting set
      against the published six-element list. This needs about 6600 BPSW tests
      on 200 to 300 bit numbers, uses no curve arithmetic at all, and either
      reproduces a published claim exactly or exhibits a specific
      discrepancy. Nothing else in this record is as cheap or as decisive.
      STAGE 2, seconds. The shape certificate for d = -1174 at 251 bits, and
      the two independent routes to the completeness bit.
      STAGE 3, minutes. The two-branch exhaustive toy census of C1 and C2, at
      four toy primes, two in each residue class, enumerating every admissible
      c.
      STAGE 4, seconds. The rank measurement of C4 over 1173 candidates, about
      3500 modular exponentiations at 251 bits.
      STAGE 5, seconds. The five-row family sweep for the shape.
    controls:
      - >-
        BLOCKING TWO-BRANCH CONTROL - the p = 1 mod 4 census of C2, which must
        return 0.000 where the p = 3 mod 4 census returns 1.000, through the
        identical code path. A census returning the same fraction on both
        branches has no resolving power and voids C1's claim of dependence.
      - >-
        POSITIVE, SAME-p, NEEDING NO EXTERNAL DATA - construct d from a
        randomly chosen s at the real 251-bit prime by the published formula.
        The instrument must report it complete, BY CONSTRUCTION, giving one
        full-size input whose answer is known without any transcription.
      - >-
        NEGATIVE, PARAMETER-MATCHED - d' = -1174 + k for the smallest k
        making chi(d') = +1 over the same p. Same field, same model, same code
        path, predicted NOT complete and predicted NOT of the shape.
      - >-
        REFUSAL CONTROL - the degenerate shape parameters c = 1, c = -1 and
        s = 0. The shape routine must refuse rather than return a value, and a
        division by zero that is silently caught and reported as "not shaped"
        is a different and worse failure than an explicit refusal.
      - >-
        NULL, SAME SHAPE - 10^4 uniformly random d at the real p through the
        identical three-filter code path, whose pass rate must be near 1/8
        with 3-sigma half-width about 0.010. A pass rate near 0 or near 1
        means a filter is inverted or degenerate and voids the rank
        measurement.
      - >-
        CROSS-IMPLEMENTATION - every Legendre symbol computed twice, by
        Euler's criterion and by the binary Jacobi recursion; every primality
        verdict in C3 computed twice, by BPSW and by 64 rounds of
        Miller-Rabin with recorded bases. Disagreement anywhere voids the run.
      - >-
        MIRROR-INTEGRITY CONTROL - recompute the sha256 of every mirror file
        read and compare against source_record_addendum_01.yaml. A mismatch
        means the mirror has drifted and every table-valued statement in this
        record is suspended.
    required_metrics:
      - 'the two-branch census fractions, exhaustive, per toy prime, per residue class'
      - 'the exhibited shape witness (s, c) for d = -1174 with its verification transcript'
      - 'the two independent completeness bits for Curve1174 and whether they agree'
      - 'the full prime sweep output per reading, with the published list diffed against it'
      - 'the primality tier reached per prime in the sweep'
      - 'the rank of 1174 and the full list of cheaply-qualifying smaller candidates'
      - 'chi(1175), s = 1 + v_2(p + 1), and the derived curve and twist 2-parts'
      - 'per other Edwards row, whether d has the shape, with witness or refusal'
      - 'the null pass rate over 10^4 random d, and the sha256 of every mirror file read'

  falsification_conditions:
    - >-
      Any Elligator-1-shaped parameter over a p = 3 mod 4 prime in the
      exhaustive toy census whose curve is not complete. C1 is refuted, the
      dependence claim is withdrawn, and the counterexample is reported as a
      refutation artifact per docs/claims-and-verification.md.
    - >-
      The p = 1 mod 4 census returns a nonzero completeness fraction. C2 is
      refuted and, since C1 and C2 are the same one-line computation with
      opposite signs, C1 is thrown into doubt with it.
    - >-
      No (s, c) exists over p = 2^251 - 9 with the published shape yielding
      d = -1174. SafeCurves' rigidity comment is FALSE on a checkable point.
      Halt, re-read the raw rigid.html rather than the tsv to exclude a
      table-extraction defect of the MIRROR-DEF-1 kind, and escalate to
      independent review before any statement leaves the repository.
    - >-
      Neither reading of "within 32" reproduces the published six-element
      prime list. The published transcript is not executable as written; the
      record reports the exact set found under each reading and makes no claim
      about which is intended.
    - >-
      chi(-1174) computed directly disagrees with chi(-1) computed from
      p mod 4. Since C1 makes them equal, this is an implementation failure or
      an algebra error; nothing is reported until it is found.
    - >-
      chi(1175) = +1, contradicting the mirror's published cofactor 2^2 for
      Curve1174. A transcription or algebra error is far likelier than a
      finding and must be excluded first.
    - >-
      The null pass rate of the three-filter chain is not near 1/8. A filter
      is inverted or degenerate and the rank measurement is void.
    - >-
      Any disagreement between the two Legendre implementations or the two
      primality routines. Implementation failure; nothing is reported.

  confounders:
    - >-
      IMPLICATION IS NOT EQUIVALENCE. The shape implies completeness; the
      converse is false and abundantly so, since about half of all parameters
      are non-squares and only about a quarter are shaped. A deliverable that
      writes "the complete cell equals the ind cell" has overstated C1. The
      correct statement is that the complete cell is REDUNDANT GIVEN the ind
      and field cells, for rows where the shape holds, and for no other row.
    - >-
      WHICH DIRECTION THE ind CELL RUNS. SafeCurves' `ind` criterion is about
      indistinguishability, which Elligator provides; the shape is a
      SUFFICIENT condition for Elligator-1 compatibility as SafeCurves
      describes it, and whether it is NECESSARY is not established here. If
      the `ind` cell can be satisfied by a different construction, then a True
      in that cell does not imply the shape and C1's dependence does not
      apply to that row. The dependence is claimed for rows whose transcript
      states the shape, which as of this reading is exactly one row.
    - >-
      A PROSE COMMENT IS WEAKER THAN A CELL. The rigidity transcript is a
      free-text comment on a criterion page, not a machine-readable
      specification, and MIRROR-DEF-1 documents a confirmed instance of
      exactly such a comment being mis-attributable across rows. Every quoted
      phrase must be re-read from pages/rigid.html and not only from the tsv
      before it is relied on.
    - >-
      SELECTION IN THE RANK MEASUREMENT. The three cheap conditions are
      applied to candidates ordered by absolute value, but SafeCurves' phrase
      is "smallest qualifying integer in absolute value" without stating a
      sign convention or whether 0 and 1 are excluded. The enumeration order
      and exclusions must be stated explicitly and the rank recomputed under
      each plausible convention, since a different convention changes the rank
      and could change it a lot.
    - >-
      PROBABLE PRIMES IN C3. A prime list reproduced with BPSW is a
      probable-prime list. The six published values are small enough to
      certify properly if a certificate routine is available, and the tier
      reached must be stated per element rather than assumed uniform.
    - >-
      HEURISTIC INDEPENDENCE OF THE THREE FILTERS. The predicted rank of about
      147 assumes the three symbol conditions are independent. They are
      conditions on chi(-d), chi(2/c) and chi(1 - d), which are symbols of
      algebraically related quantities, so correlation is possible and the
      measured pass rate on the null is the check. A measured rate far from
      1/8 invalidates the predicted rank interval but not the measured rank.

  interpretation_limits:
    - >-
      NOTHING HERE IS A SECURITY STATEMENT. A criterion dependence is a fact
      about the SafeCurves table's information structure. A reproducible
      generation recipe is evidence about a design process, not about the
      hardness of any discrete logarithm, and the question record's claim
      boundaries state that a failure of rigidity is not by itself an ECDLP
      break - the converse holds equally, and a success of rigidity is not
      security.
    - >-
      C1 and C2 are proved; C3 is an exhaustive finite computation whose
      result is whatever it is; C4's shape half is a certificate and its rank
      half is a MEASUREMENT OF EXPLANATORY POWER and explicitly not a
      minimality verification.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) C1's THEOREM
      transfers FULLY to any curve whose parameter has the Elligator-1 shape
      over a 3 mod 4 prime, on any row and in any family; its APPLICABILITY as
      of this reading is exactly one row, Curve1174, because that is the only
      row whose published transcript states the shape. The five-row sweep
      measures whether that applicability is wider by accident. (b) C2
      transfers fully and is a statement about primes, not curves. (c) C3's
      METHOD - execute a published transcript by exhaustive finite
      enumeration - transfers to every row that HAS a transcript, which the
      mirror's rigidity table shows is a minority; E-222, E-382, M-383 and
      E-521 carry an EMPTY comments cell and are therefore rated fully rigid
      with no published recipe at all, which is the observation
      IDEA-20260829-a40979 is built on. Curve25519, Curve41417,
      Ed448-Goldilocks, M-221, Curve383187, M-511, Anomalous and BN(2,254)
      carry transcripts of varying completeness and are candidates for the
      same treatment. (d) NO TRANSFER of the rank number itself to any other
      row, since it depends on that row's own filters and conventions.
    - >-
      The mirror is a dated snapshot with recorded hashes, not the live site,
      and its own addendum documents a defect in one of its derived views.
      Agreement with the mirror is agreement with that snapshot.
    - >-
      A criterion dependence found on one row does not license treating the
      eleven columns as dependent in general. IDEA-20260829-f5bcff's null
      computation must be corrected only for the pair and the rows where the
      dependence is demonstrated, and the correction must be stated at that
      size and no larger.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The three cheap qualifying conditions - chi(-d) = +1 for the shape's
        square-root step, chi(2/c) = +1 for the c = 2/s^2 step, and
        chi(1 - d) = -1 for the cofactor 2-part being exactly 4 - behave as
        independent Bernoulli events of probability one half each as d ranges
        over the integers of absolute value below 1174 reduced mod p; hence
        the number of qualifying candidates below 1174 is binomial with mean
        about 1173/8, that is about 147.
      rigorous_support: >-
        The RIGOROUS half is Weil's bound on character sums - each individual
        symbol is equidistributed over d with density 1/2 + O(p^{-1/2}), and
        the JOINT distribution of a fixed finite set of multiplicative
        characters evaluated at distinct non-proportional polynomial arguments
        is also equidistributed by the same bound, with error O(p^{-1/2}) per
        pattern. What is NOT rigorous is that the arguments here are not
        obviously non-proportional - chi(-d) and chi(1 - d) are symbols of
        linearly related quantities and chi(2/c) is a symbol of a rational
        function of d, so the applicable form of the bound must be checked
        rather than assumed. The classical statement being imitated is the
        standard heuristic that the square classes of a small fixed set of
        algebraically independent quantities behave like independent fair
        coins.
      validation_plan: >-
        SAMPLING - 10^4 uniformly random d at the real 251-bit prime through
        the identical three-filter code path, seeds recorded, plus the
        EXHAUSTIVE population of all 1173 candidates below 1174, which is a
        complete census at the actual parameter scale and not an
        extrapolation. COMPARISON DISTRIBUTION - the observed joint frequency
        of the eight sign patterns against the uniform 1/8, by an exact
        chi-square test on eight cells with expected counts stated in advance;
        and each marginal against the RIGOROUS interval
        1/2 plus or minus 2 p^{-1/2}, which is a proved bound rather than a
        modelled one. TAIL CHECK - the longest observed run of consecutive
        non-qualifying d, compared against the geometric prediction of about
        one run of length 8 or more in 1173 draws; an anomalously long run
        indicates correlation. TRANSFER - none. The census runs at the real
        prime on the real candidate range, so no size extrapolation enters
        this heuristic at all, which makes it the strongest-validated
        assumption in this batch.
    - id: H2
      statement: >-
        The repository mirror inputs/SAFECURVES-20260825/ faithfully reproduces
        the SafeCurves rigidity page as published; that is, the quoted
        generation transcript for Curve1174 is what the site says.
      rigorous_support: >-
        NONE as to fidelity to the live site, and the record says so plainly.
        What IS available is stronger than usual for this kind of assumption -
        the addendum records per-file sha256 values, so drift within the
        repository is detectable exactly, and it records a KNOWN DEFECT class
        in the derived text views together with the remedy this record
        follows. That is a bounded and audited snapshot, not an unverified
        transcription, but it is still a snapshot.
      validation_plan: >-
        PARTIAL AND INDIRECT ONLY, and it is a provenance exercise rather than
        a measurement. (i) Recompute every file's sha256 and compare against
        the addendum. (ii) Re-read the Curve1174 comments cell from
        pages/rigid.html directly, not from tables/rigid.tsv, and require the
        two to agree character for character on the quoted phrases, which is
        the exact check MIRROR-DEF-1 says is necessary. (iii) Attempt one live
        fetch of safecurves.cr.yp.to/rigid.html and record the outcome
        whatever it is; a success settles H2 outright and a failure is an
        operational observation, never mathematical evidence, per AGENTS.md
        rule 3. (iv) If the live fetch fails, note that C3's outcome is
        SELF-VALIDATING in one direction - if the six-element prime list
        reproduces exactly from an independent computation, that is strong
        evidence the transcript was transcribed correctly, since a corrupted
        list would be very unlikely to reproduce.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. Audit cost, itemised. C1 and C2 are zero
      compute. C3 is about 6600 BPSW primality tests on 200 to 300 bit
      integers, that is O(log^4 p) bit operations each with a small constant -
      seconds in Python. C4's shape certificate is one square root and three
      symbols, about four modular exponentiations at 251 bits; its rank
      measurement is about 3500 exponentiations, milliseconds to seconds. The
      two-branch toy census is O(p) per curve and O(p^2) per prime summed over
      parameters, minutes at p near 2^13 to 2^15 across 14 cores.
      Verification of the shape certificate by a second implementation is
      about three field operations - genuinely succinct.
    memory_exponent: >-
      O(log p) working memory throughout; the whole deliverable is a few
      kilobytes plus the candidate list. The 48 GB envelope is not a binding
      constraint anywhere and the 14 cores matter only for the toy census.
    best_known: >-
      For the prime list of C3, no incumbent computation exists inside this
      program and the incumbent OUTSIDE it is SafeCurves' own published list,
      which dominates on cost, being free, and is exactly what is being
      tested. For the completeness bit, the incumbent is
      IDEA-20260829-b41d39's single Legendre symbol, which this record
      reproduces at zero field operations under the shape hypothesis - a
      constant-factor improvement of no importance, disclosed as such. For the
      rank, no incumbent exists anywhere located. Against the ECDLP attack
      frontier - KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031,
      KN-TECH-032, KN-TECH-033, KN-TECH-035 - this record is dominated by
      every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. The honest hidden costs are three.
      (i) The rank measurement is an UPPER BOUND on explanatory power dressed
      in a precise-looking integer; presenting it as a minimality verification
      would be the central dishonesty available here and the record
      pre-commits against it. (ii) C1's applicability rests on a prose comment
      whose fidelity is heuristic H2 and cannot be discharged without
      retrieval. (iii) The predicted rank interval rests on heuristic H1's
      independence assumption, which is only partly supported by Weil's bound
      because the three arguments are algebraically related.
    tradeoff_note: >-
      The tradeoff is between WHAT CAN BE CHECKED and WHAT IS WORTH CHECKING,
      and it is unusual. The prime-selection claim is fully decidable and
      almost free but says little about the curve; the parameter-selection
      claim is what actually determines the curve and is only partly decidable
      without a point-counting backend. Spending compute on the decidable half
      buys certainty about the wrong half. The record's response is to report
      the decidable half exactly and the undecidable half as a measured
      bit-count, rather than to pretend the second is settled. No time-memory
      tradeoff exists and parallelisation is irrelevant outside the toy
      census.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. AS AN ATTACK
    it is dominated by rho (KN-TECH-001, KN-TECH-006), automorphism-discounted
    rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
    (KN-TECH-032) and the trace-one transfer (KN-TECH-033) simultaneously on
    time, memory and data, because it is not an attack. AS A COMPLETENESS TEST
    it is dominated by IDEA-20260829-b41d39, which decides completeness for
    ANY Edwards parameter in one symbol while this record decides it only for
    shaped parameters; this record dominates b41d39 on nothing computational
    and on exactly one epistemic axis, that it explains why the answer could
    not have been otherwise. AS A SOURCE OF THE PRIME LIST it is dominated by
    the mirror, which publishes the list at zero cost and is the object under
    test. AS A MEASUREMENT OF CRITERION DEPENDENCE, no incumbent inside or
    outside this program has been located that reports any logical dependence
    among the SafeCurves columns, and IDEA-20260829-f5bcff explicitly models
    them as independent; that specific output is not dominated because no
    competing row producing it was found. This is a narrow non-domination and
    it is stated narrowly. AS A RIGIDITY VERDICT it is dominated by SafeCurves
    itself on authority and would be dominated by any Sage session on
    convenience.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS INFORMATION
    STRUCTURE, WHICH IS THE PRINCIPAL DELTA - IDEA-20260829-f5bcff computes
    its null significance as 21 of 2^20 per criterion under the assumption
    that the eleven columns are independent monotone predicates. C1 exhibits
    a pair of columns for which that assumption is FALSE on at least one row,
    which means the family's 11 by 20 verdict table carries strictly fewer
    than 220 bits of independent information, and this record measures the
    first known unit of that redundancy exactly. The program currently holds
    ZERO statements of dependence among the criteria. AS EXECUTED RIGIDITY -
    the program currently holds ZERO executions of any published generation
    transcript, and IDEA-20260829-f5bcff and the archived audit plan both
    conclude that the rigid column cannot be touched by computation; this
    record executes one transcript end to end for the prime-selection half and
    reports a measured explanatory bit-count for the parameter-selection half,
    which converts "untouchable" into "decidable in part, with the
    undecidable remainder quantified at about 7.2 bits". AS PROCESS - the
    campaign's declared blocker OR-2 is contradicted by a repository mirror
    that four proposals filed today did not know existed, and this record's
    entire input is that mirror, which is a concrete demonstration of what the
    mirror makes possible.
