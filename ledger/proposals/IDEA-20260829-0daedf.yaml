idea:
  id: IDEA-20260829-0daedf
  question_id: RQ-SCURVE-8ee4ea
  goal_id: GOAL-SCURVE-9eb661
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    CRITERION DEPENDENCE - prove that Curve1174's `complete` cell is a LOGICAL
    CONSEQUENCE of its `ind` cell, because the Elligator-1 parameter shape
    d = -(c+1)^2/(c-1)^2 forces d to be minus a square and p = 3 mod 4 forces
    minus a square to be a non-square; then execute SafeCurves' own published
    rigidity transcript for this curve, which is the only fully specified
    generation recipe in the family that is decidable end to end without point
    counting
  class: mechanism

  claim: >-
    Curve1174 is x^2 + y^2 = 1 - 1174 x^2 y^2 over p = 2^251 - 9. SafeCurves'
    rigidity page, retrieved from the repository mirror, publishes a
    complete generation transcript for this row and for almost no other. Four
    separable sub-claims, of decreasing rigour.

    (C1) THE DEPENDENCE THEOREM. RIGOROUS, ZERO COMPUTE, AND IT IS THE POINT
    OF THE RECORD. SafeCurves states that Curve1174's d was "chosen to have
    the form -(c+1)^2/(c-1)^2 with c = 2/s^2 for compatibility with Elligator
    1". Any d of that form satisfies d = -k^2 with k = (c + 1)/(c - 1) in
    F_p, provided c is not 1 and k is not 0. Hence
    chi(d) = chi(-1) chi(k)^2 = chi(-1). SafeCurves also states that the prime
    was "chosen 3 mod 4 for compatibility with Elligator 1", and for
    p = 3 mod 4 one has chi(-1) = -1. THEREFORE chi(d) = -1, THEREFORE d is a
    non-square, THEREFORE by the Bernstein-Lange criterion the curve is a
    complete Edwards curve. THE `complete` CELL IS IMPLIED BY THE `ind` CELL
    TOGETHER WITH THE RESIDUE CLASS OF THE PRIME. It is not an independent
    design constraint and it carries ZERO independent information about this
    curve once Elligator-1 compatibility and p = 3 mod 4 are known. This is a
    statement about the SafeCurves criterion table's internal structure, not
    about Curve1174's safety, and it is falsifiable in one line - exhibit an
    Elligator-1-shaped d over a p = 3 mod 4 prime that is a square.

    (C2) THE IMPLICATION IS NOT VACUOUS, AND THAT IS THE CONTROL. Over
    p = 1 mod 4 one has chi(-1) = +1, so an Elligator-1-shaped d is a SQUARE
    and the curve is NOT complete. The implication therefore reverses
    completely with the residue class, which proves the residue class is
    load-bearing rather than decorative. PREDICTED - over p = 3 mod 4, 100
    percent of Elligator-1-shaped d give complete curves; over p = 1 mod 4,
    0 percent do. Two exhaustive toy censuses, opposite answers, same code
    path. An instrument that returns the same fraction on both branches is
    broken, and a mathematics that predicts the same fraction on both is
    wrong.

    (C3) THE PRIME-SELECTION CLAIM IS DECIDABLE END TO END, WITH NO POINT
    COUNTING AND NO EXTERNAL DATA. SafeCurves states verbatim that "The only
    primes 3 mod 4 within 32 of 2^e for e between 200 and 300 are 2^206-5,
    2^212-29, 2^226-5, 2^243-9, 2^251-9, 2^285-9; first four rejected for
    security level, and last rejected for efficiency, producing 2^251-9". That
    is a finite, fully specified, machine-checkable assertion - at most 101
    exponents times at most 65 offsets, so at most about 6600 primality tests
    on numbers of 200 to 300 bits, which is seconds. THE PREDICATE FORM IS
    AMBIGUOUS AND THAT AMBIGUITY IS ITSELF A MEASUREMENT - "within 32" could
    mean the two-sided window 2^e - 32 to 2^e + 32 or, given the surrounding
    text "very close to, but not above, a power of 2", the one-sided window
    2^e - 32 to 2^e. The experiment runs BOTH readings and reports which one,
    if either, reproduces the published six-element list exactly. Recovering
    the predicate form from the published output is the same move
    IDEA-20260829-f5bcff makes for thresholds, applied here to a GENERATION
    RULE rather than to a criterion threshold, and unlike that record's case
    this one is exactly decidable.

    (C4) THE PARAMETER-SELECTION CLAIM IS DECIDABLE ONLY IN PART, AND THE
    UNDECIDED PART IS QUANTIFIED RATHER THAN GUESSED. SafeCurves states
    "d = -1174 is smallest qualifying integer in absolute value", where
    qualifying means the Elligator-1 shape, completeness, and curve and twist
    orders both of the form 4 times a prime. Three of those four conditions
    are cheap - the Elligator shape is two Legendre symbols and one square
    root, completeness is one symbol, and the 2-part of both cofactors being
    exactly 4 is one symbol by IDEA-20260829-b41d39's C2 and C3. The
    PRIMALITY of the odd parts is expensive and needs a group order this
    environment cannot compute. So the experiment enumerates every d with
    absolute value below 1174, applies the three cheap conditions, and reports
    the RANK of 1174 in the cheaply-qualifying list. PRE-REGISTERED
    PREDICTION, WITH ITS DERIVATION SO IT IS CHECKABLE - the three cheap
    conditions are heuristically independent symbol conditions of density
    about one half each, so about one eighth of candidates survive and the
    predicted rank is about 147, that is between 100 and 220 at three sigma.
    THE CONSEQUENCE - about 3 bits of the choice of 1174 are explained by
    conditions this environment can verify, and about 7.2 bits are explained
    only by the prime-order condition it cannot. A rank of 0, meaning 1174 is
    the smallest cheaply-qualifying value, would mean the expensive condition
    was never binding and the whole recipe is cheaply reproducible, which
    would be a genuine surprise and a much stronger rigidity result.

  mechanism: >-
    THE TRACKED OBJECT is the SQUARE CLASS OF THE EDWARDS PARAMETER,
    chi(d) in {+1, -1}, together with the WITNESS OF ITS SHAPE - the pair
    (s, c) with c = 2/s^2 and d = -(c+1)^2/(c-1)^2, when one exists. One bit
    plus a short certificate, extracted from a 251-bit tuple.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied
    BEFORE any compute.
    WHAT IS DISCARDED. Everything about d except its square class and its
    membership in the Elligator-1 shape variety - the value of d, the group
    order, the base point, the entire odd part, the discriminant. The
    251-bit tuple collapses to one bit plus a witness.
    IS IT A CHANGE OF COORDINATES? No. The fibre of chi over a sign is half
    the field, of size Theta(p), and nothing about d is recoverable from the
    sign. The witness (s, c) is recoverable-from but does not recover the
    curve, since many d share a shape class.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Three
    operations, three answers, all deterministic. (i) THE COMPLETENESS
    PREDICATE is by definition a function of chi(d) alone, so it propagates
    exactly - this is what makes the object the right one rather than a
    proxy. (ii) THE ELLIGATOR-1 SHAPE PREDICATE is a function of the witness
    alone, and, crucially, the shape DETERMINES the square class via
    chi(d) = chi(-1), so the projection is not merely compatible with both
    operations, it makes one a FUNCTION of the other. That is the entire
    content of C1 and it is why the two criteria are dependent. (iii) THE
    RESIDUE CLASS of p acts on the object by flipping chi(-1), and hence
    flips the completeness verdict of every shaped d simultaneously. The
    retained part propagates deterministically under all three.
    WHERE THE STRUCTURE DISSOLVES, MEASURED AND STATED. At the degenerate
    parameters c = 1, c = -1 and s = 0, where k is undefined or zero and the
    shape map is not defined; and at any d NOT of the Elligator-1 shape, where
    chi(d) is unconstrained and C1 says nothing at all - about one half of all
    parameters. The object's reach is the shape variety and no further, and
    that is a genuine restriction rather than a technicality, because
    Curve25519's d, Ed448's d and Curve41417's d are not claimed by SafeCurves
    to have this shape.

    WHY THIS IS NOT IDEA-20260829-f5bcff. That record INVERTS a published
    verdict table to recover unknown thresholds and reports that the recovered
    intervals are enormously wide. This record does the opposite - it takes a
    published GENERATION TRANSCRIPT that is fully stated and EXECUTES it, and
    it establishes a LOGICAL DEPENDENCE between two criterion columns rather
    than a numeric bound on one. The two are complementary and neither
    subsumes the other. f5bcff measures how much the table pins its own
    thresholds; this measures how much of the table is redundant. Note also
    that f5bcff's central premise, that the SafeCurves pages are unreachable,
    is contradicted by the repository mirror located in this session, which
    that record's author did not know existed.

    WHY THIS IS NOT IDEA-20260829-b41d39. That record derives the general
    Edwards criteria chi(A^2 - 4) = chi(d) and the chi(1 - d) 8-divisibility
    test and applies them across the family. This record USES b41d39's C2 and
    C3 as one of three cheap filters and adds something b41d39 does not
    contain - the observation that for THIS curve the completeness symbol is
    not a free parameter at all but is forced by a different criterion, plus
    the execution of a published recipe. b41d39 asks what the symbol IS; this
    asks why it COULD NOT HAVE BEEN OTHERWISE.

    EXECUTION. Step 1, zero compute - re-derive C1 and C2 symbolically. Step
    2, THE PRIME SWEEP of C3, seconds, needing only a BPSW primality routine.
    Step 3, THE SHAPE CERTIFICATE - exhibit s and c for d = -1174 at 251 bits
    and verify -(c+1)^2/(c-1)^2 equals -1174 exactly in F_p. Step 4, THE RANK
    MEASUREMENT of C4 over all d with absolute value below 1174. Step 5, THE
    TWO-BRANCH TOY CENSUS of C2, exhaustive at small p in both residue
    classes. Step 6, the family sweep - test which of the other five Edwards
    rows have Elligator-1-shaped d, since SafeCurves claims the shape only for
    Curve1174 and a shape found elsewhere would be a new observation about the
    family.

