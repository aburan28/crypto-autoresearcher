    The mathematics of C1 is a one-line square-class computation and would
    honestly be labelled `known` if any source stating it had been opened. The
    Elligator-1 construction is 2013 Bernstein-Hamburg-Krasnova-Lange, which
    is also the stated origin of Curve1174 in the question record's intake,
    and it is entirely plausible that the dependence is remarked upon in that
    paper. NO EXTERNAL PAPER WAS OPENED IN THIS SESSION and my live fetch of
    safecurves.cr.yp.to failed, so per agents/idea-generator.md the label is
    `unverified`. THE RECORD'S NOVELTY CLAIM IS DELIBERATELY NARROW - what is
    asserted as absent is any statement, anywhere in this program's corpus or
    ledger, that two SafeCurves criterion columns are logically dependent, and
    any execution of any SafeCurves generation transcript.
