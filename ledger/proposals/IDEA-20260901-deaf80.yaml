  assumptions:
    - N is squarefree and coprime to p, so the Eichler order is well behaved and
      the Atkin-Lehner group is elementary abelian of the stated rank.
    - The supersingular locus of X_0(N) in characteristic p is connected under
      small-ell isogenies and mixes in O(log pN) steps.
    - Forgetting the level structure at the end yields an endomorphism of E, so
      no new reduction is needed to reach the original problem.

  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: the single-conjugate ball table read as an
      attack, Delfs-Galbraith subfield descent, orientation and class-group
      vectorisation, Kani and torsion-image embeddings, CSIDH hidden shift,
      principal-ideal and Morita ascent, and the FC0 collimation formalism.
    tracked_object: >-
      The canonical target set of an instance, with its cardinality k and the
      determinant Delta of the associated traceless Hom lattice.
    newness_score: >-
      New in this corpus. No record varies the target set at all; every record
      either keeps the single Frobenius conjugate or moves to the F_p locus.
      IDEA-20260821-f48215 enlarges a STORED table around the F_p locus, which is
      preprocessing and not a canonical target set.
    testability_score: >-
      High. One-step propagation is defined (the target set of a neighbour is the
      image of the target set under the same involutions) and the two observables
      k and Delta are both directly measurable at toy scale.
    survival_score: >-
      The object survives while N stays squarefree and coprime to p and while the
      level graph stays connected. It dissolves when N approaches p, at which
      point the level structure is not auxiliary but the whole instance; that
      boundary is stated and the measurement stays well inside it.

  proof_search_map:
    bottleneck: >-
      The algorithm saturates because a single target makes the sublevel
      probability reach 1 at degree p^{1/3}, and paying more degree buys nothing.
      Enlarging the target set is the only step whose removal of that saturation
      would change the exponent, and the level-N discriminant growth is the exact
      price charged for it.
    baseline_embedding:
      parameter_slice: >-
        N = 1. Then omega(N) = 0, k = 2 (identity and w_p, i.e. the Frobenius
        conjugate), Delta = p, D_eff = p^{1/3} times a constant, and the cost is
        p^{1/3+o(1)} -- Theorem 1.1 recovered exactly. The k = 2 rather than k = 1
        at N = 1 is precisely the factor Remark 1 of the frozen source describes
        as absorbed in the hidden term, which is a second, independent
        confirmation that the parametrisation is the right one.
      reproduction_check: >-
        Symbolic at N = 1 against Theorem 1.1, plus a frozen fixture requiring
        that the level-N cost formula returns the published Section 4.1 rows at
        N = 1 before any N > 1 number is quoted.
    observation_collision:
      observable: >-
        The effective minimal degree D_eff over the target set.
      distinct_preimage_search: >-
        Two different (k, Delta) pairs with the same Delta^{1/3} k^{-2/3} give the
        same D_eff, for example (k, Delta) = (2, p) and (k, Delta) = (2 t^2, p t^2)
        for any t. THIS COLLISION IS THE CONTENT OF THE INEQUALITY IN (C) and is
        the reason the record reports k and Delta SEPARATELY and never reports
        D_eff alone. A run that reported only D_eff would have collapsed exactly
        the fibre that decides the question.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from single-conjugate isogenies to
          Atkin-Lehner-orbit isogenies at level N, with N = 1 recovered as the
          boundary case, and attempt a STRICT inward improvement in D_eff rather
          than merely showing the larger family is nonempty.
        predicted_gain: >-
          Predicted to be a bounded constant of about 18 percent in D_eff under
          the assumed determinant scaling, and unbounded (exponent-moving) if the
          determinant slope is measured at zero. The transform is selected
          because its boundary case is the incumbent exactly, which is what makes
          strictness testable rather than rhetorical.
      - transform: specialization_pack
        proposed_object: >-
          A resource measure equal to D_eff, realised by specialising to toy
          primes and small squarefree N, with charges added over the disjoint
          blocks (target construction k times N, ball, lookup).
        predicted_gain: >-
          Turns the trade between k and Delta into two separately measured
          exponents rather than one asserted verdict.
    quantifier_order: >-
      for all p, exists a squarefree N coprime to p with N = p^{o(1)}, for all
      supersingular E over F_{p^2} and all cyclic C of order N, the effective
      minimal degree over the Atkin-Lehner orbit of (E, C) is at most
      c (pN)^{1/3} 2^{-2(omega(N)+1)/3} for a distribution-level constant c. Note
      that N is chosen before E, so N may not depend on the instance; a
      construction that needed an instance-dependent N would be an advice claim
      and belongs to IDEA-20260806-9c2f80.
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor improvement in D_eff, hence in time and memory, for
        OneEnd over F_{p^2}, conditional on H1 and H2, at a stated N. The method
        CANNOT certify an exponent improvement while the determinant slope is 1,
        because 2^{omega(N)} <= N is an identity and not an accident.
      nearby_object_control: >-
        Apply the identical construction with the Atkin-Lehner orbit replaced by
        2^{omega(N)+1} UNIFORMLY RANDOM targets in the level-N graph, where a
        rigorous minimal-degree bound is known FALSE (a random target sits at
        degree p^{1/2}). The method must return the random-target law and must
        NOT return a p^{1/3}-scale D_eff there. If it does, it proves too much
        and the arithmetic of the orbit is not doing the work the record claims.
    proof_obligations:
      - claim: The two-sided ideal class group of a level-N Eichler order has order 2^{omega(N)+1}.
        responsibility: interface
      - claim: The traceless Hom lattice for the level-N problem has determinant (pN)^{1+o(1)}.
        responsibility: size
      - claim: The minimum over k independent targets is Delta^{1/3} k^{-2/3} under H1.
        responsibility: success_probability
      - claim: Cost is proportional to D_eff by the law of IDEA-20260901-65c009.
        responsibility: runtime
      - claim: 2^{omega(N)} <= N for every squarefree N, with the maximum of 4^{omega+1}/N finite.
        responsibility: strictness
      - claim: Forgetting the level structure returns a non-scalar endomorphism of E.
        responsibility: correctness
      - claim: Target construction costs k times N, which must remain below the table size.
        responsibility: interface
      - claim: Scope is OneEnd over F_{p^2} at squarefree level coprime to p.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        slope of log(determinant of the traceless Hom lattice at level N) against
        log N, at fixed toy p
      direction: higher
      minimum_effect: >-
        Predicted 1.0 within [0.85, 1.15]. A measured slope below 0.3 is the
        outcome that opens the exponent branch and is the single most valuable
        reading in this record
    - metric: >-
        measured D_eff over the Atkin-Lehner orbit, divided by the predicted
        (pN)^{1/3} 2^{-2(omega(N)+1)/3}
      direction: different
      minimum_effect: >-
        Predicted ratio in [0.5, 2.0] across all tested N. Outside that band the
        independence assumption H2 across orbit members is refuted and the k^{-2/3}
        law does not hold
    - metric: >-
        measured D_eff over the Atkin-Lehner orbit divided by measured D_eff over
        the same number of uniformly random level-N targets
      direction: lower
      minimum_effect: >-
        Predicted to be at most 0.7, i.e. the orbit must beat random targets of
        the same count. If the ratio is 1.0 within interval, the orbit carries no
        arithmetic advantage and the whole construction is a controlled null
    - metric: >-
        the exact value of max over squarefree N of 4^{omega(N)+1} / N, computed
        by enumeration up to 10^6
      direction: different
      minimum_effect: >-
        Predicted to be attained near N = 2310 and to be finite and below 8. If
        it were unbounded the closure in (C) would be wrong; this is a
        zero-compute arithmetic check and must be run first
    - metric: >-
        overhead ratio (k times N) divided by table size at the tested parameters
      direction: lower
      minimum_effect: >-
        Must stay below 0.01 or the target-construction cost is not negligible
        and the cost law must be restated with that term

  minimal_test:
    design: >-
      Stage 0, zero compute, one hour. Enumerate squarefree N up to 10^6, compute
      4^{omega(N)+1} / N, and report the maximum and the argmax. Verify the N = 1
      slice reproduces Theorem 1.1 and the Section 4.1 rows. If the maximum is
      unbounded or the slice fails, stop and file that. Stage 1, the determinant
      slope. At three toy primes and for squarefree N in {1, 2, 6, 30, 210, 2310},
      construct the Eichler orders of level N attached to sampled supersingular
      curves with level structure, compute the traceless Hom lattice attached to
      the relevant two-sided ideal, compute its Gram determinant exactly, and fit
      log Delta against log N. Stage 2, the effective minimum. For the same
      instances, compute the exact minimal degree to every Atkin-Lehner target by
      breadth-first search over smooth-degree isogenies on the level-N graph, take
      the minimum over the orbit, and compare against the predicted law. Stage 3,
      the null arms, run identically.
    controls:
      - >-
        NULL OBJECT ONE, random targets. Replace the Atkin-Lehner orbit by the
        same number of uniformly random level-N targets and re-run stage 2
        unchanged. The measured D_eff must be substantially larger, at the
        random-target scale. If the two arms agree, the orbit contributes nothing
        and the result is a controlled null rather than a finding.
      - >-
        NULL OBJECT TWO, shuffled orbit labels. Keep the same target multiset but
        permute which target is attached to which instance. The k^{-2/3} law
        should survive (it is a counting statement) while any instance-specific
        arithmetic advantage should vanish. This separates the counting effect
        from the arithmetic effect, which the two are otherwise confounded.
      - >-
        CALIBRATION ARM, N = 1. The measured D_eff must reproduce p^{1/3} and the
        measured determinant must reproduce p, before any N > 1 number is quoted.
      - >-
        DECAY CHECK. D_eff must DECREASE as k increases at fixed N and must
        INCREASE as N increases at fixed omega(N) (for instance N = 2310 against
        N = 2*3*5*7*13 = 2730, same omega, larger N). A quantity that fails to
        move with the parameter meant to move it is the artifact tell of
        docs/inventor-protocol.md section 3 and the run is rejected.
    required_metrics:
      - the exact maximum and argmax of 4^{omega(N)+1}/N over squarefree N <= 10^6
      - fitted slope of log Delta against log N with confidence interval, per prime
      - measured D_eff per (p, N) arm, with the number of instances sampled
      - ratio of measured D_eff to the predicted law, per arm
      - measured D_eff for the random-target and shuffled-label nulls
      - target construction cost k times N, and the table size, at each point

  falsification_conditions:
    - >-
      The determinant slope is measured at 1.0 within interval AND the D_eff law
      holds. The family is then CLOSED with a named obstruction -- 2^{omega(N)}
      is at most N for every squarefree N, with equality nowhere above 1 -- an
      argument (count against discriminant, both entering D_eff with exponents
      2/3 and 1/3), and forward guidance: only a canonical target family whose
      cardinality grows faster than its discriminant can move the exponent, and
      Atkin-Lehner provably is not one. The obstruction block records the
      measured slope with its interval and the measured maximum of the ratio.
    - >-
      The determinant slope is measured below 0.3 with the interval excluding 1.
      The exponent branch OPENS, and under AGENTS.md rule 12 the resulting claim
      goes to independent review-breakthrough at max effort before anything else.
    - >-
      The measured D_eff over the orbit equals the random-target null within
      interval. The arithmetic of the orbit contributes nothing, the k^{-2/3} law
      is not the operative mechanism, and the record is superseded.
    - >-
      D_eff fails to decrease with k, or fails to increase with N at fixed
      omega(N). Artifact tell; the measurement is rejected and re-run before any
      reading.
    - >-
      The N = 1 calibration does not reproduce p^{1/3} and the published rows.
      Nothing in this record may be quoted.

  confounders:
    - >-
      At toy primes, N cannot be taken large without N approaching p, at which
      point the level structure dominates the instance and the asymptotic reading
      is meaningless. The design caps N at p^{1/4} and reports the cap.
    - >-
      omega(N) and N are strongly correlated over any small enumeration, so a
      naive fit cannot separate the k effect from the Delta effect. The design
      breaks the correlation deliberately by including same-omega different-N
      pairs (2310 against 2730) and same-N different-structure pairs.
    - >-
      Supersingular points of X_0(N) include those where C is not stable under
      anything, and those where E has extra automorphisms (j = 0, 1728). Both are
      a large fraction of a toy graph and every figure is reported with and
      without them.
    - >-
      The Atkin-Lehner targets are not independent as lattices, so the k^{-2/3}
      law assumes an independence that is certainly false in detail. H2 states it
      and the measured ratio in prediction two is exactly the test of it.

  interpretation_limits:
    - >-
      NO SUB-p^{1/3} ALGORITHM IS EXHIBITED OR CLAIMED. The exponent branch is
      conditional on a determinant slope this record predicts is 1.
    - >-
      The best case actually predicted is a CONSTANT FACTOR of about 18 percent in
      D_eff at N = 2310, which is a cofactor-level result and must be presented as
      one. Per the search heuristics of agents/idea-generator.md this is stated
      explicitly and the record does not ask to be ranked as an exponent result.
    - >-
      Scope is OneEnd over F_{p^2} with squarefree level coprime to p. Nothing is
      claimed at non-squarefree level, at level divisible by p, or for the
      oriented and F_p-rational settings.
    - >-
      Every exponent is conditional on H1 and inherits its status.
    - >-
      Academic and defensive analysis only, per RQ-SSI-001 constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random supersingular pair (E, C) of level N and a fixed
        canonical target T in its Atkin-Lehner orbit, the probability that the
        minimal degree of a level-preserving isogeny (E, C) -> T is at most Y is
        Y^{3/2} Delta_N^{-1/2 + o(1)}, where Delta_N is the determinant of the
        traceless part of the corresponding Hom lattice, uniformly in the range
        N^{eps} <= Y <= Delta_N^{1/3}.
      rigorous_support: >-
        Rigorous side: at N = 1 this is anchored by Theorem 1.5 of the frozen
        source (READ), which pins the first minimum at p^{1/3} and hence
        Delta_1 = p^{1+o(1)}; the Hom lattice is a rank-4 module over the Eichler
        order whose traceless part is rank 3. Classical side: the Gauss-circle
        count for a positive rank-3 quadratic lattice of determinant Delta gives
        #{v : Q(v) <= Y} = Y^{3/2} Delta^{-1/2} + O(Y). H1 asks only that the
        specific level-N lattice behaves like a random rank-3 lattice of its
        determinant with respect to that count.
      validation_plan: >-
        Sampling. Two routes, and the record uses both because they fail
        differently. Route A, direct, at toy primes: enumerate the level-N graph,
        compute minimal degrees exhaustively, and build the empirical sublevel
        CDF. Route B, Deuring-style, at cryptographic scale: sample random
        Eichler orders of level N in B_{p,infinity} up to conjugation, compute the
        relevant two-sided ideal, and take the shortest vector norm -- the exact
        analogue of Section 4.2 of the frozen source, at p = 5*2^248 - 1 with
        10^5 samples for N in {1, 2, 6, 30}, which also RE-VALIDATES the source's
        own N = 1 experiment as a by-product. Comparison. Empirical CDF against
        Y^{3/2} Delta_N^{-1/2} on log-log axes with a fitted slope and interval.
        Tail check. The smallest observed minimal degree across all samples must
        be consistent with the fitted sublevel probability at that value.
        Transfer assumption recorded. Route B samples orders rather than pairs
        and identifies them only up to conjugation, exactly as the source does;
        that assumption is carried unchanged and stated.
    - id: H2
      statement: >-
        The k = 2^{omega(N)+1} Atkin-Lehner targets of a random level-N instance
        behave, with respect to the sublevel event of H1, as k independent draws,
        so that the minimum over the orbit satisfies
        Pr[min <= Y] = k Y^{3/2} Delta_N^{-1/2 + o(1)} while that quantity is
        below 1.
      rigorous_support: >-
        NONE beyond the observation that the Atkin-Lehner involutions generate a
        group acting freely on generic instances, so the targets are distinct
        curves. Independence of their Hom lattices is NOT justified and is the
        weakest link in the record; it is isolated here so it can be rejected
        without touching H1 or the inequality in (C).
      validation_plan: >-
        Measure the joint distribution directly at toy scale. For each instance,
        record the full vector of minimal degrees to all k targets, and test
        pairwise independence by comparing the empirical distribution of the
        minimum against the k-fold independent prediction with a Kolmogorov
        statistic. Report the measured effective number of independent targets
        k_eff, defined by fitting Pr[min <= Y] = k_eff Y^{3/2} Delta^{-1/2}, and
        use k_eff rather than k in every downstream number. If k_eff is close to
        1 the entire construction collapses and that is the result.
    - id: H3
      statement: >-
        Walks on the supersingular locus of X_0(N) in characteristic p mix in
        O(log(pN)) steps, so the re-randomisation of Algorithm 3 transfers to the
        level-N setting with the same asymptotic walk length.
      rigorous_support: >-
        The Ramanujan property of the level-N Brandt graphs, recalled from the
        same source family (reference [37] of the frozen source) that justifies
        the N = 1 case. RECALLED, not verified here.
      validation_plan: >-
        Compute the second eigenvalue of the level-N adjacency operator at toy
        primes and compare against the Ramanujan bound, deriving the mixing time
        and comparing it against the walk length used. This is the same
        measurement IDEA-20260815-1cc763 proposes at N = 1; if that record runs
        first, this arm is a strict extension of it and should reuse its code.

  target_complexity:
    time_exponent: >-
      p^{1/3+o(1)} with a constant-factor reduction of the leading term by
      max over N of 2^{2(omega(N)+1)/3} / N^{1/3}, predicted to be about 1.22 in
      cost (an 18 percent reduction in D_eff), under the predicted determinant
      slope 1. Conditional branch: if the determinant slope is 0, the exponent
      becomes 1/3 - eps for an eps determined by how large omega(N) may be taken
      at N = p^{o(1)}, which for omega(N) ~ log p / (log log p)^2 is o(1) and for
      larger omega is a genuine exponent gain -- the record does NOT assert that
      branch and files it as the falsifier.
    memory_exponent: >-
      Same as time and reduced by the same constant factor, since the object
      stored is still the ball. The k targets add k lookup keys, not k tables.
    best_known: >-
      p^{1/3+o(1)} time and memory (frozen source Theorem 1.1, conditional on its
      Heuristic 1); p^{1/2}(log p)^{O(1)} time at polynomial memory
      (Delfs-Galbraith, reference [21]).
    hidden_overhead: >-
      The smoothness factor rho^{-1} = p^{o(1)} is inherited unchanged. Two new
      charges are added and neither is waved through: target construction costs
      k times a polynomial in N and log p, which the minimal test requires to
      stay under one percent of the table, and the level-N graph has N times more
      vertices, which increases the per-step modular-polynomial work by a
      polynomial factor in N. Both are polynomial and neither touches the
      exponent, but both eat the 18 percent unless N stays small -- which is
      precisely why the predicted best point sits at N = 2310 and not higher.
    tradeoff_note: >-
      The ball stage remains a claw search, so van Oorschot-Wiener applies
      unchanged at time N_ball^{3/2}/w^{1/2} with N_ball = D_eff. Because the
      construction reduces D_eff by a constant, it shifts the whole tradeoff
      curve inward by that constant at every w without changing its shape. The
      scheme parallelises exactly as the incumbent does.

  estimated_cost:
    implementation: medium
    compute: low
    detail: >-
      Stage 0 is minutes. Stage 1 needs Eichler order construction and Gram
      determinant computation, which is standard quaternion arithmetic available
      in SageMath and is the same toolchain the frozen source Section 4.2 uses.
      Stage 2 needs a level-N isogeny graph builder, an extension of the existing
      dimension-1 tooling rather than new machinery. Hours to a day per prime
      band. Route B of the H1 validation reuses the source recipe at NIST-I scale
      and is the only crypto-scale arm.

  deduplication:
    closest_existing:
      - id: IDEA-20260821-f48215
        difference: >-
          f48215 builds a STORED PRECOMPUTED table around the F_p-rational locus
          and charges it on a batch frontier (per-instance time times storage
          equals p). That is preprocessing with advice, is explicitly not a
          single-instance improvement, and its target set is not canonical -- it
          must be built and stored. This record's target set is CANONICAL and
          COMPUTED FROM THE INSTANCE in polynomial time, costs no storage, and is
          a single-instance construction. The two differ on the axis f48215
          itself declares binding.
      - id: IDEA-20260829-980192
        difference: >-
          980192 uses the F_p-rational locus as a midpoint predicate, i.e. a
          restriction of the SEARCH SPACE, priced at p^{2 beta} with polynomial
          memory. This record enlarges the TARGET SET while leaving the search
          space alone, and its cost law is D_eff rather than a midpoint exponent.
          The F_p locus is not an Atkin-Lehner orbit and does not appear here.
      - id: IDEA-20260806-b7fdc3
        difference: >-
          b7fdc3 uses the oriented self-pairing of Castryck-Houben-Merz as a
          zero-compute admissibility screen over assumptions. It is an
          orientation invariant used as a filter over schemes. This record uses
          level structure to add targets inside one algorithm, and never
          evaluates a pairing.
      - id: IDEA-20260806-a3ef00
        difference: >-
          a3ef00 decomposes EndRing information into genus, spinor and global
          bits on the Gross lattice at level 1. This record does not decompose
          information at all; it changes the level and prices the target count
          against the discriminant. The only shared vocabulary is quaternion
          orders.
      - id: IDEA-SSI-EXP-003 (BATCH-046 artifact, not a ledger proposal)
        difference: >-
          EXP-003 proposes an Eichler-order FACTOR BASE for index calculus and is
          closed as circular because relation finding reduces to the full problem.
          This record uses Eichler orders for their two-sided ideal classes, does
          no relation collection, and has no circularity -- the targets are
          computed from the instance by an N-isogeny, with no endomorphism ring
          required at any point.
      - id: IDEA-20260901-65c009
        difference: >-
          Sibling record filed the same session. 65c009 gates the re-randomisation
          loop with a cheap detector, leaving the target set at k = 1. This record
          leaves the loop alone and enlarges the target set. They compose: a
          detector at cost p^c combined with k targets gives
          p^{(1+2c)/5} times k^{-2/5}, which is stated here only to record that
          the two are compatible and are not the same lever.
    not_a_restatement_of: >-
      Not a restatement of the twelve BATCH-046 closures. Every one of them holds
      the instance fixed at level 1 and asks how to search faster. The parameter
      varied here -- the level of the auxiliary structure attached to the instance
      -- appears in none of them, and the rank-3 Minkowski barrier they name is
      exactly the quantity this record proposes to MEASURE as a function of N
      rather than to accept at N = 1.

  dominated_by: >-
    Wesolowski 2026, p^{1/3+o(1)} time and memory, dominates this record in the
    Pareto sense under the predicted determinant slope, because a constant-factor
    reduction does not move any exponent and the record is on the same time and
    memory exponents with a slightly better constant. Checked against each
    frontier row known to this program: (i) p^{1/3+o(1)} time and memory -- tied
    on exponents, better by a predicted constant of about 1.22 in time and memory,
    so NOT strictly dominated on that row but not an exponent improvement either;
    (ii) Delfs-Galbraith p^{1/2}(log p)^{O(1)} time at polynomial memory --
    dominates this record on the memory axis at every p, as it does the incumbent;
    (iii) van Oorschot-Wiener p^{1/2+o(1)}/w^{1/2} at memory w -- this record
    shifts that curve inward by the same constant and is not beaten by it at
    w = D_eff. No data or query axis applies. dominated_by is therefore not null.
  sota_delta: >-
    Exponent delta +0 under the predicted determinant slope. Constant-factor
    delta: D_eff reduced by a predicted factor max over squarefree N of
    2^{2(omega(N)+1)/3} N^{-1/3}, attained near N = 2310 at a value of about 1.22,
    i.e. about 0.28 bits of time and memory at any p -- a genuinely small number,
    stated so it cannot be inflated. Conditional branch, filed as a falsifier and
    not as a claim: a measured determinant slope of 0 would make the delta
    unbounded in the exponent, at 2 omega(N) / (3 log_2 p) per instance.

  recommended_priority: medium
