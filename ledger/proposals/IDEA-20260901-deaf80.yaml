idea:
  id: IDEA-20260901-deaf80
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-09-01'
  status: proposed
  proposed_by: idea-generator

  title: >-
    THE ALGORITHM HAS EXACTLY ONE CANONICAL TARGET AND LEVEL STRUCTURE OFFERS
    MORE. Adding a level N to the instance replaces the single Frobenius
    conjugate by an Atkin-Lehner orbit of 2^{omega(N)+1} canonically computable
    targets, and the whole family is decided by one exact inequality between
    2^{omega(N)} and N -- which caps the gain at a bounded constant if the Hom
    lattice determinant scales like pN, and does NOT cap it if the determinant is
    N-independent. That scaling exponent is a single measurable number

  class: composition

  claim: >-
    (A) THE STRUCTURE THE INCUMBENT DOES NOT USE. The frozen source
    (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ IN FULL) targets exactly
    one curve, E^{(p)}, because Theorem 1.5 bounds the minimal degree to that one
    target and because the Frobenius composition is guaranteed non-scalar. Under
    the rank-3 sublevel law (H1 below), the cost of the whole algorithm is
    p^{1/2+o(1)} / Y^{1/2} where Y is the largest degree the ball covers, and the
    only reason Y cannot exceed p^{1/3} is that ONE target saturates there. WITH
    k INDEPENDENT TARGETS the saturation moves: the sublevel probability becomes
    k Y^{3/2} Delta^{-1/2}, so the minimal degree over the target set drops to
    Delta^{1/3} k^{-2/3} and the cost drops with it.

    (B) WHERE k COMES FROM, WITH NO NEW MATHEMATICS. Attach to E a cyclic
    subgroup C of order N, squarefree and coprime to p -- a point of X_0(N) in
    the supersingular locus, whose endomorphism object is an Eichler order of
    level N. The two-sided ideal classes of that order give the Atkin-Lehner
    involutions w_q for q dividing pN, a group of order 2^{omega(N)+1}, each of
    which sends (E, C) to a canonically COMPUTABLE pair -- w_N sends (E, C) to
    (E/C, E[N]/C), computable in time polynomial in N and log p. So the target
    set has k = 2^{omega(N)+1} members, every one of them free to write down.

    (C) THE EXACT INEQUALITY THAT DECIDES THE FAMILY. If the traceless Hom
    lattice attached to an Eichler order of level N has determinant
    Delta = (pN)^{1+o(1)}, then the effective minimal degree over the orbit is
        D_eff = (pN)^{1/3} k^{-2/3} = (pN)^{1/3} 2^{-2(omega(N)+1)/3},
    and the cost, which the sibling record IDEA-20260901-65c009 derives as
    proportional to D_eff, beats p^{1/3} exactly when N < 4^{omega(N)+1}. But
    N is squarefree with omega(N) distinct prime factors, so N is at least the
    omega(N)-th primorial, and the primorial overtakes 4^{omega+1} at omega = 6
    (30030 against 16384). THE MAXIMUM OF 4^{omega(N)+1} / N OVER SQUAREFREE N IS
    THEREFORE FINITE AND SMALL, so the entire family buys a BOUNDED CONSTANT
    FACTOR and no exponent. The best point is near omega(N) = 5, N = 2310, where
    D_eff is about 0.82 times p^{1/3} -- a real but constant improvement of order
    18 percent, which this record files as a constant-factor result and not as an
    exponent result.

    (D) THE BRANCH THAT IS NOT CLOSED, AND IT IS THE WHOLE POINT OF RUNNING
    ANYTHING. The inequality in (C) is entirely a consequence of the assumed
    determinant scaling Delta ~ pN. THAT SCALING IS AN ASSUMPTION OF THIS
    RECORD AND IS NOT DERIVED HERE. If instead the relevant traceless Hom lattice
    for the level-N problem has determinant p^{1+o(1)} independent of N, then
    D_eff = p^{1/3} 2^{-2(omega+1)/3} and the exponent moves: choosing
    omega(N) ~ eps log p / log log p gives an unbounded gain and an exponent
    strictly below 1/3. The single measurable number that decides between a
    bounded constant and a moved exponent is the slope of log Delta against
    log N, and it is measurable exactly at toy scale.

    (E) WHAT IS NOT CLAIMED. NO SUB-p^{1/3} ALGORITHM IS EXHIBITED. The expected
    outcome is the closure of (C) with an exact inequality and a measured
    determinant slope, which under docs/inventor-protocol.md section 4 is a
    closure with a named obstruction, an argument, and forward guidance naming
    what remains (target families whose count grows faster than their
    discriminant, which Atkin-Lehner provably is not).

  mechanism: >-
    TRACKED OBJECT. The CANONICAL TARGET SET of an instance -- the finite set of
    curves, or level-structure pairs, that are computable from the instance in
    polynomial time and to which a rigorous minimal-degree bound applies -- with
    its two attached numbers, its cardinality k and the determinant Delta of the
    associated Hom lattice. The object is followed as the level structure is
    enriched, and the observable is the pair (k, Delta).

    WHY THIS IS THE RIGHT OBJECT. Every algorithm in this lane, from Kohel
    through Delfs-Galbraith to the incumbent, is a search for a path to a
    DISTINGUISHED SET, and the exponent is set by how large that set is relative
    to how far away it is. Delfs-Galbraith takes the F_p-rational locus, large
    (p^{1/2}) and far. The incumbent takes the single Frobenius conjugate, tiny
    (k = 1) and near (p^{1/3}). Nobody in this corpus has asked what the
    trade-off curve between those two extremes looks like, and level structure is
    the one lever that moves k without moving to a different problem.

    LOSSY-PROJECTION TEST (algebraic, zero compute). The projection sends an
    instance to its canonical target set, discarding the instance itself and
    retaining a finite labelled set. It is lossy: many instances share the same
    abstract orbit structure, and the orbit does not determine E. It is
    compatible with the operation applied -- Atkin-Lehner involutions and
    Frobenius commute with the isogeny adjacency operators on X_0(N) in
    characteristic p, being induced by the normaliser of the Eichler order -- so
    the retained set propagates deterministically along an isogeny step: the
    target set of a neighbour is the image of the target set under the same
    involutions. It is not a change of coordinates because the set has bounded
    size while the instance space has size proportional to p N.

    THE CONVERSION INTO AN ALGORITHM. Replace step 4 of Algorithm 2 by a lookup
    against 2^{omega(N)+1} keys instead of one, at a cost multiplied by k which
    is negligible against the table. Replace the walk of Algorithm 3 by a walk on
    X_0(N) in characteristic p, whose mixing follows from the same Ramanujan
    property with the level-N Brandt matrices. On success, compose as before and
    strip the level structure by forgetting C, obtaining an endomorphism of E.
    Every step is an existing operation; the only new content is the choice of
    target set and its arithmetic.

