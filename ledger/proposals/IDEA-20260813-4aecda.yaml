idea:
  id: IDEA-20260813-4aecda
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QALG-457b41
  goal_id: GOAL-QALG-001
  title: >-
    Small-n classical audit of Simon 2026's Lemma 3 no-catastrophic-cancellation
    certificate, instrumented with module-structured correlated noise
  class: control
  claim: >-
    Simon 2026 (KN-LIT-e204ab, eprint 2026/1591, unrefereed, every substantive
    lemma labelled "(Sketch)") claims a polynomial-time quantum algorithm for
    the Dihedral Coset Problem tolerating a faulty-sample rate 1/O(log n).
    Composed with Regev's reduction as tightened by Brakerski-Kirshanova-
    Stehle-Wen (KN-LIT-4706), the paper's own stated consequence is
    polynomial-time quantum SVP/LWE at approximation factor sqrt(n)*polylog(n)
    -- an exponent-CLASS change against the best currently known QUANTUM
    MSVP/MLWE attack (Grover/quantum-walk-amplified sieving, heuristically
    2^(0.2653 d + o(d)) time in the QRAM model per Laarhoven's thesis result
    reported in KN-LIT-703), not a constant-factor or log-cofactor gain. The
    program's own open-problem record (KN-OPEN-8a5965) identifies the single
    load-bearing gap: Lemma 3's claim that the signed sum
    S = sum_z* (|A_(0,z*)| - |A_(1,z*)|) * C_z* does not suffer catastrophic
    cancellation between the signed C_z* terms. This proposal claims that
    exact classical computation of S (and its null-object control) on small
    dihedral instances -- both under Simon's assumed i.i.d.-faulty-sample
    model and under a correlated, module-structured noise model approximating
    the IP-M-EDCP superposition of KN-LIT-1744 -- discriminates between two
    explanations for what would happen at cryptographic scale: (a) S
    concentrates near the "no cancellation" scale of a random-sign null,
    consistent with Lemma 3 surviving and this DCP route remaining a live
    candidate exponent-moving mechanism against Grover-only MLWE attacks; or
    (b) S sits systematically and non-shrinking-ly closer to zero than the
    null across the tested range, which is the signature of the same failure
    mode (Step 9 of Chen 2024, KN-LIT-52ce4c) that has already sunk one
    claim of this exact shape, and would be a scoped, honest obstruction to
    this specific mechanism.
  mechanism: >-
    Tracked object: the finite signed sum S(d) defined in Lemma 3 of Simon
    2026, for a fixed secret d in a dihedral group of order 2N = 2 * 2^n. Every
    quantity S depends on (the counts |A_(0,z*)|, |A_(1,z*)| of all-zero-group
    subset sums, and the signed phase-cost coefficients C_z*) is defined by
    finite sums and counts over a classically enumerable sample space at small
    n -- no quantum device is needed to compute it exactly, only to sample
    from the induced distribution over d, the group secret, and the faulty-bit
    pattern per sample. The module-structured extension replaces Simon's
    assumed i.i.d.-per-sample faulty-bit model with a block-correlated model:
    k in {2,3,4} samples share a single correlated fault draw before
    Hadamard-erasure, approximating (at small toy ring degree, not at
    cryptographic ring degree 256) the IP-M-EDCP superposition KN-LIT-1744
    describes as ranging over an exponential-in-ring-degree set of
    possibilities. This is the cheapest concrete surrogate this program can
    build for the currently open "does the module structure admit the
    analogous EDCP form" question in KN-OPEN-8a5965, without presupposing an
    answer. The lossy-projection test: tracking S(d) alone (rather than the
    full quantum state) discards every part of the computation the actual
    algorithm needs except the one signed sum the correctness argument
    isolates as load-bearing; this projection composes compatibly with the
    group's own arithmetic (subset-sum and Hadamard-erasure structure) because
    S is exactly the quantity Lemma 3 states its bound about, not a proxy for
    it -- so nothing is lost that the proof itself does not also discard.
  novelty_status: unverified
  novelty_screen:
    local_kb_status: >-
      crypto-kb MCP search_knowledge/get_context/find_related tools were not
      present in this session's tool surface (the server is declared in
      .mcp.json but did not expose callable tools here); per task instruction
      this is stated plainly rather than silently skipped. Substituted with
      direct grep of the committed knowledge/ and ledger/ trees at snapshot
      commit 083ca0026281c05e85570e5bddf90adbd4954d69. See
      coordination/goals/GOAL-QALG-001/batches/BATCH-d4b33f/tasks/TASK-20260813-5bfa22/retrieval-screen.yaml.
    screened_proposals: >-
      grep of ledger/proposals/ for RQ-QALG-457b41 returned zero prior
      filings (this is the first batch to open the question). No earlier
      QALG proposal exists to compare against for duplication.
    adjacent_corpus:
      - KN-LIT-e204ab
      - KN-OPEN-8a5965
      - KN-TECH-d1bc4f
      - KN-LIT-21383c
      - KN-LIT-2c8264
      - KN-LIT-4706
      - KN-LIT-1744
      - KN-LIT-52ce4c
      - KN-LIT-703
    external_screen: >-
      No live web search was available in this session (WebSearch tool
      errored on model selection). Novelty is therefore assessed against the
      committed corpus only, which is exactly what makes this an audit of an
      already-flagged open problem rather than a fresh literature find; the
      genuinely new content here is the proposed AUDIT METHOD (small-n exact
      cancellation test plus module-correlated-noise variant plus null-object
      sign-shuffle control), not the underlying claim, which is already
      recorded and open. Kept unverified because primary-literature
      verification of the underlying DCP paper itself has not been performed
      by this program.
    nearest_neighbors: []
  assumptions:
    - >-
      The small-n classical audit (n up to roughly 20-22, chosen so the full
      or a large uniform subsample of the relevant event space is exactly
      enumerable on ordinary hardware within the task budget) is not a proof
      or disproof of the asymptotic claim; it is a discriminator between two
      qualitative behaviours the paper's own proof strategy predicts.
    - >-
      This is not a re-derivation of GOAL-MLKEM-005's classical block-size
      work; it operates entirely on Simon's quantum DCP construction and its
      classical-arithmetic skeleton, never on ML-KEM ciphertexts or bases.
    - >-
      No claim about ML-KEM's concrete security follows from this proposal
      even in the positive case; reaching concrete Module-LWE parameters is
      the separate, harder Q2 question in KN-OPEN-8a5965, addressed by
      IDEA-20260813-0cf345 and IDEA-20260813-02479f, not by this proposal.
  proof_search_map:
    bottleneck: >-
      Lemma 3 of Simon 2026: whether the signed sum S(d) avoids catastrophic
      cancellation between its signed C_z* terms. Per KN-OPEN-8a5965 this is
      explicitly the single most load-bearing, least-complete step in the
      entire draft, and the removal or confirmation of this bottleneck is what
      changes whether the DCP route to a poly-time quantum MSVP/MLWE
      algorithm is alive at all.
    baseline_embedding:
      parameter_slice: >-
        Setting the block-correlation parameter k=1 (no module correlation)
        exactly reproduces Simon's own assumed i.i.d.-faulty-sample model;
        this is the parameter slice that must reproduce the paper's own
        stated arithmetic (Lemma 1's sample-budget count and Lemma 4's
        balls-in-bins accounting, both independently re-derived and found
        internally consistent in KN-LIT-e204ab's own review notes) before any
        module-correlated variant is trusted.
      reproduction_check: >-
        A frozen symbolic/arithmetic fixture reproducing KN-LIT-e204ab's own
        "What was actually checked here" re-derivations (Lemma 1's
        (k/c)*(n/log n) expected all-zero-group count; Lemma 4's balls-in-bins
        mean/sd/Chebyshev bound) at k=1, matching those closed-form
        expressions exactly before any numerical audit is trusted.
    observation_collision:
      observable: >-
        The signed sum S(d) itself, and its magnitude relative to the
        random-sign null sum S_null(d) built from the same |C_z*| magnitudes
        with independently randomized signs.
      distinct_preimage_search: >-
        Search small dihedral secrets d (and small module-correlation
        patterns) for cases where S(d) and S_null(d) are numerically close
        despite d taking genuinely different values -- i.e. whether the
        observable S is even sensitive to d at this scale, or saturates. If S
        fails to discriminate distinct secrets d already at small n, the
        observable itself is not yet identifying at any scale this audit can
        reach, and the audit's negative result would be inconclusive rather
        than a genuine falsifier.
    constructive_transforms:
      - transform: observable_fiber_counterexample
        proposed_object: >-
          Fix the observable (the magnitude ratio |S(d)| / sum|C_z*(d)|) and
          vary the forgotten structure (the specific faulty-bit pattern and
          module-correlation model) to find whether an intrinsic invariant
          (systematic sign correlation among the C_z*) distinguishes the
          i.i.d. and module-correlated regimes.
        predicted_gain: >-
          Either regime concentrates near the null (no distinguishing
          invariant found, Lemma 3's qualitative shape survives at this
          scale) or one regime shows a measurable, non-shrinking gap from the
          null across the tested n range (an intrinsic invariant is found,
          falsifying Lemma 3's "well-behaved" assumption at least in that
          regime).
    quantifier_order: >-
      Simon's theorem is stated as: for all n (asymptotically), there exists
      a choice of parameters (c>=12, k>c, Q=k*n^(c+1)) such that, for a
      random secret d, the algorithm recovers d with probability
      significantly greater than 1/2. This audit tests, for small fixed n
      (not asymptotically) and a fixed, non-random enumeration or large
      uniform sample of secrets d, whether the intermediate quantity S(d) that
      the "exists parameters" clause depends on behaves as the sketch needs.
      A witness (a small-n instance where cancellation IS catastrophic) would
      falsify the universal "for all n" claim only if the failure mode does
      not shrink as n grows across the tested range -- a growing failure at
      small n that shrinks toward larger n would not falsify the asymptotic
      claim, and this distinction is recorded explicitly as an
      interpretation limit below.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, this audit can show that Lemma 3's qualitative claim
        (no catastrophic cancellation) is CONSISTENT with small-n exact
        computation and a null-object control, which is evidence for taking
        the claim seriously, not a proof it holds asymptotically; or it can
        show a genuine, non-shrinking small-n counterexample, which is a
        concrete, checkable obstruction worth escalating to a full symbolic
        review of Lemma 3's sketch.
      nearby_object_control: >-
        The random-sign-shuffle null (same |C_z*| magnitudes, independently
        randomized signs) is the nearby object on which the hoped-for
        "no cancellation" conclusion is engineered to hold by construction
        (a random-sign sum of M terms concentrates near sqrt(M) times the
        typical magnitude by a standard random-walk/Khintchine-type
        argument); comparing the true, deterministically-signed S(d) against
        this null is exactly the docs/inventor-protocol.md section 3
        null-object-control discipline applied to a proof sketch instead of
        an empirical attack signal.
    proof_obligations:
      - claim: >-
          The k=1 parameter slice reproduces Simon's own stated Lemma 1 and
          Lemma 4 arithmetic exactly.
        responsibility: baseline
      - claim: >-
          S(d) and S_null(d) are computable exactly (or by large uniform
          subsampling with a stated confidence interval) at the declared
          small-n scale within the task's compute budget.
        responsibility: feasibility
      - claim: >-
          The observable S(d) is sensitive to distinct secrets d at the
          tested scale (the observation-collision check above passes).
        responsibility: correctness
      - claim: >-
          Any observed cancellation gap between S(d) and S_null(d) is
          reported with its trend across the tested n range, distinguishing
          a shrinking (asymptotically harmless) from a non-shrinking
          (asymptotically threatening) gap.
        responsibility: success_probability
      - claim: >-
          The module-correlated variant's departure, if any, from the k=1
          baseline is reported separately from any i.i.d.-model cancellation
          finding, so the two questions (Lemma 3 correctness; module
          compatibility) are not conflated into one verdict.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: cancellation_ratio_k1
      direction: different
      minimum_effect: >-
        |S(d)| / S_null_median(d) computed over the enumerated or sampled
        secrets at each tested n; "different" because either a near-1 ratio
        (survives) or a systematically-below-1, non-shrinking ratio
        (falsifies) is informative, and the proposal does not predict which.
    - metric: cancellation_ratio_trend_over_n
      direction: different
      minimum_effect: >-
        The slope of the cancellation ratio across the tested n range
        (8 through the largest exactly-or-confidently-enumerable n); a flat
        or worsening trend is the signature the inventor protocol's section 3
        calls out as diagnostic of a real (non-decaying) structural effect
        rather than small-sample noise.
    - metric: module_correlated_vs_iid_divergence
      direction: different
      minimum_effect: >-
        Whether the k in {2,3,4} block-correlated model's cancellation ratio
        differs measurably (more than the k=1 model's own seed-to-seed
        variance) from the i.i.d. model at matched n; a null result here
        (no measurable divergence) is itself informative about whether
        module structure changes the picture at all at this toy scale.
  minimal_test:
    design: >-
      (1) Implement Simon's Algorithm 1-3 arithmetic skeleton (group-based
      subset-sum partitioning, all-zero-group selection, balls-in-bins
      accounting) exactly in a classical script, parameterised by n, c, k
      (paper's block-count parameter), and a module-correlation flag. (2) For
      n = 8, 10, 12, ..., up to the largest n where either exact enumeration
      or a large (>= 10^6) uniform Monte Carlo sample with reported confidence
      intervals is feasible within budget, compute S(d) for a representative
      set of secrets d (exhaustive for small n, random sample for larger n).
      (3) Compute the matched null S_null(d) by independently randomizing the
      sign of each C_z* term while preserving magnitudes, repeated over many
      sign draws to get a null distribution. (4) Repeat steps 2-3 under the
      module-correlated noise variant (k in {2,3,4} samples sharing one fault
      draw). (5) Report the cancellation ratio and its trend across n for
      both models, plus the observation-collision check (does S(d) actually
      vary with d at this scale). This record authorizes no execution; it is
      a design for the Coordinator to approve and hand to the Executor.
    controls:
      - >-
        Random-sign-shuffle null on the true |C_z*| magnitudes (per docs/
        inventor-protocol.md section 3): the canonical "is this a real
        structural effect or an artifact" control for a signed-sum
        cancellation claim.
      - >-
        k=1 (no module correlation) baseline reproducing Simon's own assumed
        model exactly, verified against the paper's own re-derived Lemma 1
        and Lemma 4 arithmetic before any k>1 variant is trusted.
      - >-
        Trend-across-n check: per docs/inventor-protocol.md section 3, "ask
        what the measured quantity should do as the parameter that is
        supposed to destroy it increases" -- a cancellation effect that does
        not shrink with n is the tell, not one that is merely present at
        small n.
    required_metrics:
      - S(d) and S_null(d) distributions per tested n and correlation model
      - cancellation_ratio = |S(d)| / typical |S_null(d)|, with its trend
        across n
      - observation-collision rate (fraction of distinct d pairs with
        indistinguishable S(d) at the tested scale)
      - wall-clock and memory used per n, to bound how far this audit can be
        pushed before exact/Monte-Carlo enumeration becomes infeasible
  falsification_conditions:
    - >-
      The cancellation ratio is systematically and measurably below the null
      distribution's typical value at every tested n, AND the gap does not
      shrink (is flat or grows) as n increases across the tested range: this
      falsifies Lemma 3's qualitative "well-behaved" claim within the tested
      regime and is recorded as a scoped, named obstruction to this specific
      mechanism, not a claim about the asymptotic theorem's truth beyond the
      tested n.
    - >-
      The observation-collision check finds that S(d) does not distinguish
      distinct secrets d already at the smallest tested n: this makes the
      audit itself inconclusive (not a falsifier of Simon's claim, but a
      falsifier of this proposal's chosen observable at this scale), and the
      minimal test design must be revised before drawing any conclusion.
  confounders:
    - >-
      Confusing a shrinking small-n cancellation gap (asymptotically
      harmless, expected finite-size effect) with a non-shrinking one
      (asymptotically threatening); the trend, not the presence, of
      cancellation is the discriminator.
    - >-
      Monte Carlo sampling noise at larger n masquerading as a genuine
      cancellation signal; reported confidence intervals on S_null and S must
      be wide enough to rule this out before any falsification claim is made.
    - >-
      Treating a positive (no-cancellation) small-n result as evidence that
      the FULL Simon 2026 proof is correct: Lemma 3 is only one of five
      identified gaps in KN-OPEN-8a5965 (conditioning survival, corollary
      rescaling, bias quantification, recursion), none of which this audit
      touches.
    - >-
      Treating the module-correlated variant's result as resolving whether
      IP-M-EDCP (KN-LIT-1744) genuinely admits the needed noise-tolerant DCP
      form at cryptographic ring degree 256; the toy-scale approximation used
      here cannot reach that regime and this limitation must be stated
      alongside any result.
  interpretation_limits:
    - >-
      No result from this audit, positive or negative, is evidence about
      ML-KEM's actual security. It bears only on the internal consistency of
      one unrefereed external preprint's proof sketch, at toy scale.
    - >-
      A positive (no-cancellation) result at small n does not imply Simon's
      theorem is correct; four other open sub-questions in KN-OPEN-8a5965
      remain untouched by this proposal.
    - >-
      A negative (cancellation) result at small n does not by itself refute
      the asymptotic theorem unless the trend across the tested n range is
      also non-shrinking; this distinction must be preserved in any
      downstream evidence record.
    - >-
      This proposal does not transfer to RQ-QALG-122b59 (HQC) or
      RQ-QALG-74bf20 (CSIDH); the CSIDH lane's own dihedral-HSP baseline is
      the noise-FREE Kuperberg regime (KN-TECH-d1bc4f), where this specific
      noise-tolerance mechanism is not the relevant axis, per GOAL-QALG-001's
      own non_duplication note.
  heuristic_assumptions:
    - id: H1-small-n-representativeness
      statement: >-
        The relative order of magnitude between the true signed sum S(d) and
        its random-sign null S_null(d), and in particular the SIGN and TREND
        of any gap between them, is a meaningful (though not asymptotically
        conclusive) proxy for whether the same qualitative phenomenon
        persists at cryptographic-scale n, provided the trend is measured
        across a range of n wide enough to distinguish a shrinking from a
        non-shrinking effect.
      rigorous_support: >-
        Imitates the classical fact that a sum of M independent, mean-zero,
        bounded signed terms concentrates near its typical scale
        (sqrt(M) times the per-term magnitude) by a Khintchine-type
        inequality; the null-object control directly instantiates this
        classical "generic signed sum" behaviour so that any measured
        departure of the true S(d) from it is attributable to genuine
        structure in the C_z* signs rather than to sum-of-random-terms
        concentration alone.
      validation_plan: >-
        Sample n in {8,10,12,14,16,18,20,22} (or as far as compute budget
        allows with reported confidence intervals beyond exact
        enumerability), each with at least 200 distinct secrets d (exhaustive
        below full enumerability, uniform random above it) and at least 200
        independent null sign-shuffles per secret; report the empirical
        distribution of the cancellation ratio at each n, its trend line
        across n, and a tail check comparing the single most-cancelled
        observed instance against the null's own predicted extreme-value
        tail (analogous in spirit to the Wesolowski exemplar's smoothest-
        sample tail check, A7).
    - id: H2-module-correlation-toy-transfer
      statement: >-
        A block-correlated noise model at toy ring degree (e.g. degree 4-16,
        far below ML-KEM's degree 256) that shares one fault draw across
        k in {2,3,4} samples is a structurally honest, if quantitatively
        non-transferable, proxy for the qualitative shape of the IP-M-EDCP
        correlation KN-LIT-1744 describes, sufficient to detect whether
        module correlation changes the cancellation picture at all in this
        toy regime.
      rigorous_support: >-
        No rigorous bound is claimed here; this is explicitly the weakest,
        most exploratory heuristic in this proposal, imitating only the
        qualitative structural claim in KN-LIT-1744 ("an IP-M-EDCP state
        forms a superposition over an exponential (in ring degree) number of
        possibilities") without any quantitative transfer assumption from
        toy ring degree to 256.
      validation_plan: >-
        Read KN-LIT-1744 (currently only abstract-verified, "Upgrade to a
        fully verified entry after a careful read") in full before running
        any module-correlated variant, to confirm the toy block-correlation
        model used here is even a qualitatively faithful miniature of
        IP-M-EDCP's actual construction; if the full text shows the toy model
        is not faithful, this heuristic and its associated prediction are
        withdrawn rather than run.
  target_complexity:
    time_exponent: >-
      Not claimed by this proposal. If Simon 2026's theorem is correct and
      reaches Module-LWE at ML-KEM's parameters (a separate, unaddressed
      question here), the implied time exponent would be polynomial in the
      lattice dimension n, i.e. a genuine exponent-class change from
      exponential to polynomial. This proposal itself claims nothing about
      that; it only tests one internal-consistency gate.
    memory_exponent: >-
      Not claimed. Simon's own stated sample requirement is
      Q = k*n^(c+1) with c >= 12, i.e. superpolynomial-looking but formally
      polynomial in n; see IDEA-20260813-02479f for a dedicated audit of
      whether that sample count is realizable from ML-KEM's bounded public
      material.
    best_known: >-
      2^(0.2653 d + o(d)) time in the QRAM model, the best-known quantum
      attack figure recorded in this corpus for lattice sieving (Laarhoven's
      thesis result, KN-LIT-703), matching the RQ's own stated Grover-only
      baseline description.
    hidden_overhead: >-
      This proposal's own audit cost is small-n classical computation, not a
      cryptanalytic runtime; there is no o(1) term to disclose because no
      complexity claim is made. If the underlying Simon 2026 claim survives
      and reaches ML-KEM parameters, its own hidden overhead would be the gap
      between "polynomial in n" and the concrete Q = k*n^(c+1), c>=12 sample
      count, which KN-OPEN-8a5965 already flags as "polynomial and
      astronomically impractical simultaneously" -- disclosed there, not
      re-derived here.
    tradeoff_note: >-
      Not applicable; this proposal is an internal-consistency audit, not an
      algorithm with a time-memory tradeoff of its own.
  estimated_cost:
    implementation: low
    compute: low
    note: >-
      Pure classical arithmetic simulation at small n; no quantum hardware,
      no ML-KEM implementation, no lattice reduction software required.
  dominated_by: >-
    n/a (no attack or algorithm result claimed by this proposal). Against the
    RQ's own decision target, the currently undominated best-known QUANTUM
    MSVP/MLWE attack remains Grover/quantum-walk-amplified sieving at
    2^(0.2653 d + o(d)) time in the QRAM model (KN-LIT-703, Laarhoven); this
    proposal's own deliverable (an internal-consistency verdict on Simon
    2026's Lemma 3) does not itself move that baseline in either direction
    and is not compared against it directly. Checked against every row on
    the frontier this program's corpus records for quantum MSVP/MLWE: the
    Grover-only figure above (established), the quantum k-Sieve QRAM figure
    of 2^(0.2989 d + o(d)) time / 2^(0.1395 d + o(d)) memory (KN-LIT-703,
    Kirshanova-Martensson-Postlethwaite), and the unverified polynomial-time
    claim under audit here (Simon 2026 composed with BKSW, KN-LIT-e204ab);
    none is displaced by this control proposal.
  sota_delta: >-
    Zero, quantitatively. This proposal claims no speedup and no exponent
    change; it is a falsification/verification aid targeting one lemma of an
    external, already-unverified claim. If the audit returns a clean
    positive (no-cancellation) signal with a shrinking trend, the sota_delta
    remains zero until the four other open sub-questions in KN-OPEN-8a5965
    and the reach question (Q2) are separately resolved. If the audit returns
    a non-shrinking cancellation signal, the sota_delta remains zero and this
    specific mechanism is recorded as closed with a named obstruction (the
    signed-sum cancellation), narrowing but not exhausting the DCP-route
    search space per docs/inventor-protocol.md section 4.
  recommended_priority: high
  source_refs:
    - https://eprint.iacr.org/2026/1591
    - https://eprint.iacr.org/2026/155
    - https://eprint.iacr.org/2019/101
    - knowledge/literature/KN-LIT-e204ab.md
    - knowledge/open-problems/KN-OPEN-8a5965.md
    - knowledge/techniques/KN-TECH-d1bc4f.md
    - knowledge/literature/KN-LIT-21383c.md
    - knowledge/literature/KN-LIT-4706.md
    - knowledge/literature/KN-LIT-1744.md
    - knowledge/literature/KN-LIT-703.md
  enumerated_closures: []
  open_directions:
    - >-
      If the small-n audit is inconclusive (observation-collision failure),
      redesign the observable before attempting any larger-n run.
    - >-
      A full symbolic review of Lemma 3's independence-under-conditioning
      concern (KN-OPEN-8a5965 sub-question 2) is a natural follow-on this
      proposal does not attempt.
    - >-
      If this audit survives, the natural next gate is IDEA-20260813-0cf345
      (reduction-side noise budget at ML-KEM's fixed rank) and
      IDEA-20260813-02479f (sample-access-model realizability), both of which
      are independent of Lemma 3's correctness and can be run in parallel
      regardless of this audit's outcome.
