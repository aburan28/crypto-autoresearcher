      An independent factorisation of T^n - 1 at any odd prime n disagrees with
      the table's f, subspace count, or dimension set: (B) is false and the
      record is withdrawn, not patched.
    - >-
      A Frobenius-stable F_2-subspace of F_(2^131) of dimension in [2, 129] is
      exhibited: (C) is false, and so is Proposition 2 of KN-LIT-4fe9d2.
    - >-
