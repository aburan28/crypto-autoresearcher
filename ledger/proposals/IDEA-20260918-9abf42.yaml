  assumptions:
    - >-
      n is an odd prime. Used for squarefreeness of T^n - 1 and for the factor
      shape (T-1) . Phi_n with Phi_n splitting into equal-degree factors. At
      composite n the count is a product over the divisors of n (one cyclotomic
      factor per divisor, each splitting according to ord_d(2)), which is a
      different and messier formula and is NOT claimed here.
    - >-
      The normal basis theorem over F_2 for every n, which is classical.
    - >-
      "Frobenius-stable subspace" means an F_2-subspace closed under x -> x^2.
      The correspondence is with F_2-subspaces specifically; stability over a
      larger base field is a different lattice.
    - >-
      That an index calculus wants a factor base of dimension about n/m. This is
      the standard sizing and is where the "useful range 33..66 at n = 131" comes
      from; it is a design heuristic of the method, not a theorem, and a method
      wanting a different dimension would read the table differently.

  proof_search_map:
    bottleneck: >-
      The FROB line's central question is whether a Frobenius-invariant factor
      base lowers a charged stage cost. Every attempt to answer it empirically
      has first to CONSTRUCT such a factor base at a useful dimension -- and
      whether one exists at all has never been checked before the measurement was
      designed. The count in (B) answers the existence question in closed form,
      before any compute, at every n at once.
    baseline_embedding:
      parameter_slice: >-
        Proposition 2 of KN-LIT-4fe9d2 at n = 131, whose answer (exactly two
        nontrivial F_2-coefficient linearized QSPs, at n' = 1 and n' = 130) must
        be reproduced exactly by the count in (C).
      reproduction_check: >-
        SYMBOLIC AND ARITHMETIC, ZERO COMPUTE, THREE PARTS. (i) At n = 131 the
        formula must return f = 2 and dimensions {0, 1, 130, 131} -- matching
        Proposition 2's two nontrivial cases plus the two trivial ones. (ii) At
        every row of the table above, the dimension set must equal the subset
        sums of the factor degrees of T^n - 1 computed independently by
        distinct-degree factorisation; this was done at n = 7, 31 and 41 in this
        session and must be redone by the reviewer at at least two rows it did
        not check, n = 23 and n = 43 being the most informative because they are
        the rows whose f is neither 2 nor maximal. (iii) The trivial sanity
        anchor: for every n the count must include dimensions 0 and n (the ideals
        (T^n - 1) and (1)) and dimension 1 (the ideal generated by the norm
        element, i.e. F_2 itself, corresponding to g = Phi_n); a formula missing
        any of the three is wrong.
    observation_collision:
      observable: >-
        The pair (number of stable subspaces, set of their dimensions) at a given
        n -- an integer 2^f and a subset of {0, ..., n}.
      distinct_preimage_search: >-
        The observable depends on n only through ord_n(2), so many different n
        share an observable shape (every n with 2 a primitive root gives
        (4; {0,1,n-1,n})). That collision is DELIBERATE and is the basis of the
        poor arm: those n are interchangeable for this purpose, which is what
        makes a matched ladder possible. The dangerous collision is the reverse
        one: a rich n whose intermediate stable subspace is, for an unrelated
        reason, also a subfield -- at n prime there are no proper subfields, so
        this cannot occur, and that is exactly why the ladder is restricted to
        prime n.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "does a Frobenius-invariant factor base help?" by the sharper
          pair "does one EXIST at dimension about n/m (answered in closed form by
          the divisor lattice), and IF SO does it change a charged cost (answered
          only by measurement)". The first question was never separated from the
          second, which is why nulls at poor n were read as evidence about the
          second.
        predicted_gain: >-
          Removes a confound from every past and future FROB measurement at zero
          cost, and supplies the rich/poor ladder that makes a null interpretable.
      - transform: specialization_pack
        proposed_object: >-
          The ladder itself: six rich n and six poor n, matched on field size
          band and on prime extension degree, differing in ord_n(2). Each cell
          carries the same instrument, the same metrics and a size-matched
          non-stable null object.
        predicted_gain: >-
          Converts "no gain observed at n = 131" -- which this record argues was
          forced -- into a measurement that can distinguish "Frobenius buys
          nothing" from "we looked where there was nothing to find".
    quantifier_order: >-
      FORALL odd primes n: the number of Frobenius-stable F_2-subspaces of
      F_(2^n) is EXACTLY 2^f with f = 1 + (n-1)/ord_n(2), and the set of their
      dimensions is EXACTLY {0,1} + ord_n(2).{0,...,(n-1)/ord_n(2)}. Both are
      equalities, not bounds, and neither has an existential witness: the
      bijection of (A) is explicit in both directions (a divisor gives an ideal
      gives a subspace; a stable subspace is an ideal and has a unique monic
      generator). No instance, seed, curve or parameter enters.
      SEPARATELY AND WITH A DIFFERENT QUANTIFIER ORDER, which must not be
      conflated with the above: the ladder's claim is EXISTS a cell (n = 7, arm
      A vs arm B) at which a difference in fall degree or rank series WOULD be
      observable if Frobenius stability mattered -- and the record PREDICTS that
      no such difference exists. The counting claim is a theorem; the ladder
      claim is a design.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For n an odd prime, F_(2^n) has exactly 2^(1 + (n-1)/ord_n(2))
        Frobenius-stable F_2-subspaces, with dimensions the subset sums of the
        degrees of the irreducible factors of T^n - 1; at n = 131 there are four,
        of dimensions 0, 1, 130, 131." That is the ceiling. It certifies NOTHING
        about: whether any of those subspaces yields a usable factor base;
        whether a usable factor base lowers any cost; composite n; subspaces
        stable under a proper power of Frobenius only (a different and larger
        lattice); factor bases that are not F_2-subspaces at all; or anything
        about any curve.
      nearby_object_control: >-
        TWO, AND BOTH ARE BLOCKING. (i) PROVES-TOO-MUCH: run the counting
        argument at n = 31, where ord_31(2) = 5 gives f = 7 and 128 stable
        subspaces spanning a 5-spaced dimension lattice. If the argument's
        conclusion is read as "Frobenius-stable factor bases of useful dimension
        do not exist", it is FALSE at n = 31 -- they exist there in quantity. An
        argument or a summary that closes the FROB lane by existence must fail
        loudly at n = 31, and any statement of this record that survives n = 31
        has proved too much. (ii) NULL OBJECT, for the ladder rather than the
        count: arm B, a size-matched non-stable dimension-4 subspace at n = 7. A
        difference between arms A and B that does not vanish when the stability
        property is destroyed is an artifact of the instrument, which is the
        canonical tell.
    proof_obligations:
      - claim: >-
          F_(2^n) is a free rank-one F_2[T]/(T^n - 1)-module with T = Frobenius
          (normal basis theorem).
        responsibility: correctness
      - claim: >-
          Frobenius-stable F_2-subspaces are exactly the R_n-submodules, i.e. the
          ideals of R_n, i.e. the monic divisors of T^n - 1; and
          dim (g) = n - deg g.
        responsibility: correctness
      - claim: >-
          T^n - 1 is squarefree over F_2 for n odd, and for n an odd prime
          factors as (T-1) times (n-1)/ord_n(2) distinct irreducibles of degree
          ord_n(2).
        responsibility: correctness
      - claim: f = 1 + (n-1)/ord_n(2) and the subspace count is 2^f.
        responsibility: size
      - claim: >-
          ord_131(2) = 130, hence exactly four stable subspaces at n = 131 of
          dimensions 0, 1, 130, 131.
        responsibility: correctness
      - claim: >-
          The count re-derives Proposition 2 of KN-LIT-4fe9d2 at n = 131.
        responsibility: baseline
      - claim: >-
          Every row of the verified table is reproduced by independent
          factorisation of T^n - 1.
        responsibility: baseline
      - claim: >-
          #E_0(F_(2^7)) = 116 = 4*29 and #E_1(F_(2^7)) = 142 = 2*71 for
          y^2 + xy = x^3 + a x^2 + 1.
        responsibility: feasibility
      - claim: >-
          The count implies nothing about solving-stage cost (the honest limit).
        responsibility: scope

  predictions:
    - metric: >-
        number and dimensions of Frobenius-stable F_2-subspaces of F_(2^n), n an
        odd prime, computed by independent factorisation of T^n - 1
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT with the table above at every row, and with 2^f /
        subset-sum formula at every odd prime tested. A single disagreement
        refutes (B).
    - metric: >-
        existence of a Frobenius-stable F_2-subspace of F_(2^131) of dimension in
        [2, 129]
      direction: lower
      minimum_effect: >-
        ZERO. Exhibiting one refutes (C) and, through the correspondence,
        Proposition 2 of KN-LIT-4fe9d2 as well -- which is why it will not
        happen, and why (C) is a cross-check rather than a discovery.
    - metric: >-
        first fall degree (M-1) and Macaulay rank series (M-3) at n = 7, m = 2,
        arm A (stable dim-4 subspace) against arm B (size-matched random dim-4
        subspace)
      direction: different
      minimum_effect: >-
        PREREGISTERED NEGATIVE PREDICTION: NO DIFFERENCE, in either metric,
        beyond the known n-fold relation multiplication which is charged
        separately and is not a solving-stage quantity. A DIFFERENCE in either
        metric, surviving the arm-B null, is the surprise this cell exists to
        detect and would be the first evidence in this program that Frobenius
        stability reaches the solving step. Registered BEFORE any measurement,
        in a record committed before any contract is designed.
    - metric: >-
        constructibility of a stable subspace of dimension in [2, 9] at n = 11
        and n = 13 (arm C)
      direction: lower
      minimum_effect: >-
        IMPOSSIBLE BY (B) -- f = 2 at both, so the only dimensions are
        0, 1, n-1, n. Arm C is a forced negative and is included as the
        demonstration that rich and poor are structurally different, not a
        relabelling. If a stable dim-4 subspace is somehow constructed at n = 11,
        (B) is refuted.

