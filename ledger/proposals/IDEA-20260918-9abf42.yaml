idea:
  id: IDEA-20260918-9abf42
  question_id: RQ-FROB-7d8dd4
  added: '2026-09-18'
  proposed_by: coordinator
  session: DEC-20260918-7e0865
  status: proposed
  title: >-
    THE CLOSED-FORM COUNT OF FROBENIUS-STABLE SUBSPACES, WHICH JOINS THE FROB
    STRUCTURAL LINE TO THE QSP LINE AND RE-DERIVES EULER-PETIT PROPOSITION 2 IN
    ONE LINE. By the normal basis theorem F_(2^n) is free of rank one over
    R_n = F_2[T]/(T^n - 1) with T acting as Frobenius, so Frobenius-stable
    F_2-subspaces correspond exactly to ideals of R_n, i.e. to monic divisors of
    T^n - 1 over F_2; for n prime there are exactly 2^f of them with
    f = 1 + (n-1)/ord_n(2), and their dimensions are the subset sums of the
    factor degrees. At n = 131 that is FOUR subspaces, of dimensions 0, 1, 130
    and 131 -- so no Frobenius-stable factor base of index-calculus dimension
    exists at the ECC2K-130 target for reasons having nothing to do with any
    degree bound, and this program's toy ladders have been measuring Frobenius
    structure at exactly the n where there is none
  class: mechanism

  mechanism: >-
    OBJECT FRAME. Representation: F_(2^n) viewed NOT as a field but as a
    module over the ring R_n = F_2[T]/(T^n - 1), with T acting as the
    2-Frobenius sigma. By the normal basis theorem the module is free of
    rank one, so it is isomorphic to R_n itself. Operation set
    Sigma = {sigma}. Attack stage: factor-base EXISTENCE and SELECTION --
    the mechanism enumerates the Frobenius-invariant factor bases available
    at a given n, before any membership, decomposition or linear-algebra
    cost is incurred.
    TRICHOTOMY PLACEMENT: Class I, a genuine invariant. The lattice of
    sigma-stable subspaces is determined by n alone, through the
    factorisation of T^n - 1 over F_2; it does not depend on the curve, the
    basis chosen to write field elements, or the solver.
    THE MECHANISM IN ONE LINE: sigma-stable subspaces correspond to ideals
    of R_n, hence to monic divisors of T^n - 1, hence for n prime to subsets
    of the 1 + (n-1)/ord_n(2) irreducible factors. The SIZE OF THE DESIGN
    SPACE is therefore 2^f, and its available DIMENSIONS are the subset sums
    of the factor degrees. Both are functions of ord_n(2) and nothing else,
    which is why n = 131 -- where 2 is a primitive root and f = 2 -- offers
    exactly four stable subspaces and none of index-calculus dimension.
    LOSSY-PROJECTION TEST against Sigma = {sigma}: the projection
    (a subspace) -> (the divisor of T^n - 1 that annihilates it) is lossy,
    discarding every vector, and the retained part propagates
    deterministically, since sigma acts as multiplication by T and the
    divisor is preserved. Both clauses of docs/inventor-protocol.md
    section 2 hold.
    WHAT THE MECHANISM CANNOT REACH, and this is the load-bearing limit: it
    counts which invariant factor bases EXIST. It says nothing whatever
    about whether any of them lowers a charged stage cost, and the standing
    prior from IDEA-20260906-a77711 is that none does, because Frobenius
    carries a decomposition of a target R to a decomposition of sigma(R)
    and so is an equivariance between the systems of conjugate targets, not
    an automorphism of the system of one fixed target. See honest_limit.

  claim: >-
    (A) THE CORRESPONDENCE. By the normal basis theorem there is alpha in
    F_(2^n) whose Frobenius conjugates alpha, alpha^2, ..., alpha^(2^(n-1)) form
    an F_2-basis of F_(2^n). Writing the Frobenius sigma : x -> x^2 as the
    action of an indeterminate T makes F_(2^n) a module over
    R_n = F_2[T]/(T^n - 1) -- the relation T^n = 1 is sigma^n = id -- and the
    normal basis says the module is FREE OF RANK ONE, i.e. F_(2^n) = R_n . alpha
    with R_n acting faithfully. An F_2-subspace is Frobenius-stable exactly when
    it is an R_n-submodule; the submodules of a free rank-one module are the
    IDEALS of R_n; and since F_2[T] is a principal ideal domain the ideals of
    R_n = F_2[T]/(T^n - 1) are exactly (g) for g a monic divisor of T^n - 1 over
    F_2. So
        {Frobenius-stable F_2-subspaces of F_(2^n)}  <->  {monic g | T^n - 1}
    is a bijection, and dim_F2 (g) = n - deg g.
    (B) THE COUNT FOR n PRIME. n odd makes T^n - 1 squarefree
    (gcd(T^n - 1, n T^(n-1)) = 1 since n is odd and T does not divide T^n - 1).
    For n an odd prime, T^n - 1 = (T - 1) . Phi_n(T) over F_2 and Phi_n factors
    into (n-1)/ord_n(2) distinct irreducibles each of degree ord_n(2). Hence the
    number of irreducible factors is
        f = 1 + (n - 1)/ord_n(2),
    there are exactly 2^f monic divisors, therefore EXACTLY 2^f Frobenius-stable
    subspaces, and the set of their dimensions is the set of SUBSET SUMS of the
    factor degrees {1, ord_n(2), ..., ord_n(2)} -- equivalently
    {0, 1} + ord_n(2) . {0, 1, ..., (n-1)/ord_n(2)}.
    (C) THE INSTANTIATION AT THE TARGET. At n = 131: ord_131(2) = 130 (131 is
    prime; 130 = 2.5.13 and the three maximal proper divisors fail --
    2^65 = 130 = -1, 2^26 = 53, 2^10 = 107, all mod 131). So
    f = 1 + 130/130 = 2, the factor degrees are {1, 130}, and there are EXACTLY
    FOUR Frobenius-stable F_2-subspaces of F_(2^131), of dimensions
        0, 1, 130, 131
    -- the zero space, F_2, the trace-zero hyperplane, and the whole field.

  baseline_reproduction: >-
    THIS RE-DERIVES A PUBLISHED CLASSIFICATION IN ONE LINE, AND THAT IS THE
    PROPOSAL'S PRIMARY SUPPORT.
    PROPOSITION 2 OF KN-LIT-4fe9d2 states that an F_2-coefficient LINEARIZED
    quasi-subfield polynomial splits completely over F_(2^n) exactly when its
    associated F_2-polynomial divides T^n - 1. A linearized polynomial's root set
    IS a Frobenius-stable F_2-subspace, and the association between linearized
    polynomials and elements of R_n is precisely the correspondence of (A). So
    Proposition 2 is (A) restated, and its content at n = 131 -- that the only
    F_2-coefficient linearized QSPs are the subfield F_2 (n' = 1) and Type 1bis
    L_Phi131 (n' = 130) -- is exactly the two NONTRIVIAL entries of the
    four-element list in (C). The count reproduces the classification; it does
    not contradict it, and an argument that returned a different number at
    n = 131 would be refuted by that proposition on sight.
    THE SECOND BASELINE, AND IT IS THE ONE THAT MATTERS FOR INDEX CALCULUS. A
    summation-polynomial index calculus over F_(2^n) with m variables needs a
    factor base of dimension n' about n/m, so at n = 131 the useful range is
    roughly n' in [33, 66] for m in [2, 4]. NO FROBENIUS-STABLE SUBSPACE OF ANY
    SUCH DIMENSION EXISTS -- the available dimensions are 0, 1, 130, 131 and
    nothing between. This is the same conclusion RQ-QSP-f9bbdb reached at the
    linearized cells by Theorem 1's beta >= 3/4 bound, reached here instead by
    counting, with no degree bound and no beta computation anywhere in the
    argument.
    VERIFIED TABLE, independently cross-checked by distinct-degree factorisation
    of T^n - 1 at n = 7, 31 and 41, and by hand computation of ord_n(2) at every
    row:
      n=7    ord 3    f=3    8 subspaces    dims 0,1,3,4,6,7
      n=11   ord 10   f=2    4 subspaces    dims 0,1,10,11
      n=13   ord 12   f=2    4 subspaces    dims 0,1,12,13
      n=17   ord 8    f=3    8 subspaces    dims 0,1,8,9,16,17
      n=19   ord 18   f=2    4 subspaces    dims 0,1,18,19
      n=23   ord 11   f=3    8 subspaces    dims 0,1,11,12,22,23
      n=29   ord 28   f=2    4 subspaces    dims 0,1,28,29
      n=31   ord 5    f=7  128 subspaces    dims 0,1,5,6,10,11,15,16,20,21,25,26,30,31
      n=37   ord 36   f=2    4 subspaces    dims 0,1,36,37
      n=41   ord 20   f=3    8 subspaces    dims 0,1,20,21,40,41
      n=43   ord 14   f=4   16 subspaces    dims 0,1,14,15,28,29,42,43
      n=131  ord 130  f=2    4 subspaces    dims 0,1,130,131
    Read off the table: RICH n (small ord_n(2), many factors, stable subspaces at
    many dimensions) and POOR n (2 a primitive root, ord_n(2) = n-1, f = 2, only
    dimensions 0, 1, n-1, n). n = 131 IS POOR, AND SO IS EVERY n IN
    {5, 11, 13, 19, 29, 37}.

  forward_content: >-
    THE LADDER, AND THIS IS THE PART THAT IS ACTIONABLE RATHER THAN RETROSPECTIVE.
    THIS PROGRAM'S TOY LADDERS DO NOT CONTROL FOR ord_n(2), WHICH IS THE
    PARAMETER GOVERNING THE ENTIRE DESIGN SPACE. Every Frobenius measurement
    taken at n = 131 or at n in {11, 13, 19, 29, 37} is taken where the space of
    Frobenius-stable subspaces is EMPTY BY CONSTRUCTION at every
    index-calculus-relevant dimension -- there is nothing to find, and a null
    result there is uninformative about Frobenius rather than informative about
    it. That is a design defect in the ladder, not a result about the mechanism,
    and it is invisible unless the count in (B) is written down.
    PROPOSED LADDER SPLIT, which is the experiment this proposal actually asks
    for:
      RICH ARM  n in {7, 17, 23, 31, 41, 43}  -- stable subspaces exist at
                  intermediate dimensions (4 at n=7; 8,9 at n=17; 11,12 at n=23;
                  the whole 5-spaced lattice at n=31; 20,21 at n=41; 14,15,28,29
                  at n=43)
      POOR ARM  n in {5, 11, 13, 19, 29, 37}  -- only dimensions 0, 1, n-1, n,
                  so no stable factor base of useful dimension exists at all
    WHY THE SPLIT IS WORTH MORE THAN ANOTHER MEASUREMENT AT n = 131, IN BOTH
    DIRECTIONS. A NULL RESULT ON THE RICH ARM -- stable factor bases available at
    the right dimension, and still no measurable gain over a size-matched
    non-stable control -- CLOSES THE FROBENIUS INDEX-CALCULUS LANE FOR EVERY n,
    because it removes the only remaining explanation for the observed nulls
    ("we looked where the structure was absent"). That is far stronger than
    closing it at one n, and it is a closure this program could actually defend
    under the inventor protocol's closure standard: a named obstruction (the
    stable lattice exists and buys nothing), measured, with the scope stated.
    A POSITIVE RESULT LOCATES THE CONDITION and says that n = 131 was the wrong
    target -- which is a redirection of the whole FROB line toward n with small
    ord_n(2), and a statement about which extension degrees are exposed.
    EITHER OUTCOME IS WORTH THE CELL. That is the property this proposal is
    selecting for.

  honest_limit: >-
    STATED AS PROMINENTLY AS THE CLAIM, AND THE PRIOR HERE IS NEGATIVE.
    A RICH STABLE LATTICE DOES NOT IMPLY A SOLVING-STEP GAIN. The count in (B)
    says which Frobenius-INVARIANT FACTOR BASES EXIST. It does not say that any
    of them changes a charged stage cost, and the program's own best argument
    says it should not.
    IDEA-20260906-a77711's "EQUIVARIANCE, NOT SYMMETRY" ARGUMENT STANDS AND IS
    NOT ANSWERED HERE. Frobenius carries a decomposition of a target R to a
    decomposition of sigma(R). For a FIXED target R the descended decomposition
    system is therefore NOT T-equivariant: the symmetry moves the instance, it
    does not act on the solution set of the instance you actually have. So the
    invariant-rewriting gain the FROB line hopes for does not follow from the
    lattice, and nothing in this record supplies it. What the lattice governs is
    membership and existence; what an attack needs is a change in the cost of
    the solving stage, and those are different quantities.
    WHAT THIS PROPOSAL THEREFORE IS: a statement that the FROB line's null
    results so far were taken where the null was FORCED, plus a cheap design
    that removes that confound. It is NOT an argument that Frobenius helps, and
    it must not be cited as one. The honest expectation is that the rich arm also
    comes back null -- and that is precisely why running it is worth doing, since
    a forced null and a measured null look identical in a report and differ
    entirely in what they license.
    IT ALSO SAYS NOTHING ABOUT THE TRIVIAL n-FOLD GAIN. A Frobenius-stable
    factor base multiplies each relation into n relations and shrinks the linear
    algebra by n; that is a constant factor, it is already in RQ-FROB-7d8dd4's
    framing as "the trivial n-fold symmetry", and it is not what either arm is
    measuring.

  cheapest_discriminating_cell: >-
    n = 7 IS THE SMALLEST n CARRYING A NONTRIVIAL STABLE SUBSPACE OF
    INDEX-CALCULUS DIMENSION, and it sits INSIDE the declared range of
    EXP-SEMBIN-4fa22c (n in 7..12, approved and never executed), so the cell
    reuses that contract's instrument and its M-1 first-fall-degree and M-3
    Macaulay-rank-series metrics rather than building anything.
    THE ARMS:
      ARM A (treatment). n = 7, the stable subspace of dimension 4 -- which is
        F_2 plus one degree-3 block, i.e. the ideal (g) for g the other degree-3
        factor of T^7 - 1 -- as the factor base, with m = 2, admissible because
        2 * 4 = 8 >= 7.
      ARM B (null object, size-matched). n = 7, a RANDOM F_2-subspace of
        dimension 4 that is NOT Frobenius-stable, same m = 2, same instrument,
        same metrics. This is "controls before belief": the identical measurement
        against an object of the same shape lacking the property under test.
      ARM C (structural control). n = 11 and n = 13, where NO stable subspace of
        any dimension in [2, 9] exists at all, so the treatment arm cannot be
        constructed. Arm C is the demonstration that the poor/rich distinction is
        real and not a relabelling.
    VERIFIED CURVE ORDERS FOR THE CELL, computed by hand in this session from the
    Koblitz trace recursion t_k = t_1 t_(k-1) - 2 t_(k-2) with t_0 = 2, for
    y^2 + xy = x^3 + a x^2 + 1 over F_2 and its extension F_(2^7):
      a = 0:  t_1 = -1, trace sequence -1, -3, 5, 1, -11, 9, 13;
              #E_0(F_(2^7)) = 128 + 1 - 13 = 116 = 4 * 29
      a = 1:  t_1 = 1,  trace sequence 1, -3, -5, 1, 11, 9, -13;
              #E_1(F_(2^7)) = 128 + 1 + 13 = 142 = 2 * 71
    Both give a prime-order subgroup of useful size (29 and 71) not contained in
    any proper subfield, which is what the cell needs; both orders are
    re-derivable in five lines and a reviewer should re-derive them rather than
    take them.
    PREREGISTER THE NEGATIVE PREDICTION BEFORE MEASURING, AND THIS IS BINDING:
    IDEA-20260906-a77711's equivariance argument implies NO DIFFERENCE BETWEEN
    ARMS A AND B in first-fall degree or in the Macaulay rank series -- only the
    known n-fold relation multiplication, which is not a solving-step quantity
    and is charged separately. That prediction is registered here, in a record
    committed before any run, precisely so that a null result reads as a
    CONFIRMED PREDICTION rather than as a disappointment, and so that a
    DIFFERENCE reads as a genuine surprise against a stated prior. A contract
    designed from this proposal must carry the prediction in its
    `preregistered_prediction` block, not in its prose.

  novelty_status: unverified

  novelty: >-
    STATED HONESTLY, AND THE THEOREM IS NOT MINE.
    THE MODULE/DIVISOR THEOREM IS STANDARD MATHEMATICS AND IS ALREADY IN THIS
    CORPUS -- in the FROB line only. It appears at H-FROB-d93575 lines 192-194,
    at IDEA-20260906-6da433 lines 36-39, in IDEA-20260906-a77711, and in
    IDEA-20260915-8fe0ef. This record CLAIMS NONE OF IT AS NEW, and a reviewer
    who finds the correspondence stated in any of those records has found prior
    art that this record has already conceded.
    WHAT IS ABSENT FROM EVERY RECORD, and what is therefore the only thing
    claimed here:
      (i)   the CLOSED-FORM COUNT 2^f with f = 1 + (n-1)/ord_n(2) for n prime,
            and the dimension set as subset sums of the factor degrees;
      (ii)  its INSTANTIATION AT n = 131 -- exactly four stable subspaces, of
            dimensions 0, 1, 130, 131;
      (iii) the observation that (i) RE-DERIVES Proposition 2 of KN-LIT-4fe9d2,
            i.e. that the FROB structural correspondence and the QSP
            classification are the same statement;
      (iv)  the LADDER CONSEQUENCE -- that ord_n(2) is an uncontrolled variable
            in this program's toy ladders and that every FROB measurement to
            date was taken at poor n.
    THE FROB AND QSP LINES ARE NOT CURRENTLY JOINED. No record in this program
    cites both H-FROB-d93575's module correspondence and KN-LIT-4fe9d2's
    Proposition 2, and the joining step is what this record contributes. Nothing
    else.
    AGAINST THE EXTERNAL LITERATURE: UNVERIFIED. The correspondence between
    Frobenius-stable subspaces and divisors of T^n - 1 is classical (it is the
    standard proof of the linearized-polynomial classification), and the count
    2^f is an immediate corollary that is very likely written down somewhere.
    This session had no shell and ran no retrieval query, so `unverified` is the
    honest label. A reviewer finding the count in the literature should say so;
    that would remove item (i) and leave (ii), (iii) and (iv), which is a smaller
    but still usable contribution.

