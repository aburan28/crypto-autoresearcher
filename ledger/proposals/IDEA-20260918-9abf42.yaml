      novelty_status moves toward `known` for that item, in a NEW record naming
      the agent that read the source.
    - >-
      Arms A and B at n = 7 differ in fall degree or rank series: the
      preregistered negative prediction is WRONG, which is the outcome worth the
      most and which would need independent review before it is stated anywhere.

