  assumptions:
    - >-
      The MD5 step form, schedule, rotation amounts and Davies-Meyer
      feed-forward are as recalled. R2 fails if the feed-forward is not an
      addition of the incoming chaining value.
    - >-
      The enumerated delta_m family is the one IDEA-20260829-c92c2f declares --
      support at most 2, each nonzero word difference a single signed power of
      two, about 4.9 times 10^5 vectors -- so that f(0, r) is directly
      comparable with that record's number. Using a different slice would make
      the comparison meaningless, and that is why the slice is inherited rather
      than chosen.
    - >-
      Target freedom is parameterised by Hamming weight of the terminal
      difference across the four registers. Other parameterisations exist (for
      instance modular difference magnitude, or a signed-digit weight) and the
      curve is reported per parameterisation, never pooled.
    - >-
      Mini-MD5 means the MD5 step structure with w-bit words for w in {4, 8},
      the same schedule and the same rotation pattern scaled to the width, at a
      declared reduced step count. It is a DIFFERENT PRIMITIVE and is used only
      as a control.

  proof_search_map:
    bottleneck: >-
      Whether a coverage statement about the MD5 message-difference space, built
      on a model-free terminal condition, says anything about the attack shape
      that exists. The bottleneck step is the terminal equality: it is the sole
      source of the screen's rigour, and nobody has measured what happens to it
      when the target stops being zero.
    baseline_embedding:
      parameter_slice: >-
        Setting k = 0, so that D_0 contains only the zero difference,
        reproduces IDEA-20260829-c92c2f's single-block screen EXACTLY. That
        record's predicted f(0, 64) below 0.05 is the boundary this record must
        recover.
      reproduction_check: >-
        Frozen fixture: run the k-parameterised screen at k = 0 and require its
        verdict vector to agree with an INDEPENDENT implementation of the
        single-block screen on 100 percent of the 4.9 times 10^5 enumerated
        vectors, object by object and not in aggregate. Any disagreement means
        the generalisation changed the k = 0 case and no curve from the run may
        be read.
    observation_collision:
      observable: >-
        The SURVIVES or EXCLUDED verdict as a function of k, and the depth at
        which exclusion first occurs.
      distinct_preimage_search: >-
        AGAINST GROUND TRUTH RATHER THAN AGAINST ANOTHER OBJECT, AND IN BOTH
        DIRECTIONS. (i) The decisive falsifier: a delta_m the screen EXCLUDES at
        a given k for which an exhaustive mini-MD5 search nevertheless produces
        a conforming multi-block pair whose terminal difference lies in D_k.
        That refutes the derivation or its implementation and is the single most
        valuable output. (ii) The dual -- a surviving delta_m with no pair found
        -- is NOT a falsifier, because a necessary condition is not sufficient,
        and any reading of it as one is wrong. (iii) A THIRD collision worth
        hunting: two different k values producing IDENTICAL verdict vectors over
        the whole slice, which would mean the screen is not reading its target
        set and the curve is an artifact.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "terminal difference exactly zero"
          to "terminal difference in a declared set D_k", and measure whether
          the inward improvement over the trivial screen is strict at each k
          rather than only at k = 0.
        predicted_gain: >-
          A measured domain of validity for a rigorous screen, replacing an
          untested claim that it "generalises directly".
      - transform: observable_fiber
        proposed_object: >-
          Hold the delta_m fixed and vary the terminal target set; the fibre is
          the family of screens and the intrinsic invariant distinguishing its
          members is the surviving fraction, whose decay rate in k is the
          quantity this record produces.
        predicted_gain: >-
          A single curve that decides whether the single-block result is a
          general fact about MD5 differences or a fact about a boundary case.
    quantifier_order: >-
      Claim A is a statement about the ABSENCE of a universally quantified
      constraint, and is argued rather than measured: for a free terminal
      target, no analogue of "FOR ALL pairs, the difference at t_last is zero"
      follows. Claim B R1 is "FOR ALL pairs and FOR ALL chaining values, IF the
      difference at t_last is zero THEN the output difference is zero" --
      universally quantified with no witness anywhere. Claim B R2 is an
      IMPLICATION between search problems, not an exclusion, and is stated as
      such. Claim C is a count over a declared finite set for each k, an
      estimate with no quantifier over all delta_m. THE FOUR SHAPES ARE REPORTED
      SEPARATELY AND NEVER MERGED INTO ONE SENTENCE.
    method_ceiling:
      strongest_certifiable_claim: >-
        The exact surviving fraction f(k, r) over a declared enumerated slice,
        for the declared target parameterisation, with the k = 0 column
        reproducing a sibling record's single-block screen; plus the rigorous
        facts R1 and R2 with R2 labelled a REDUCTION. IT CANNOT CERTIFY that any
        surviving delta_m admits a path, cannot certify anything outside the
        enumerated slice, cannot certify anything about published attacks
        because the census is readable-empty, and CANNOT CERTIFY that no
        multi-block screen exists -- only that the model-free tail cascade is
        not one.
      nearby_object_control: >-
        TWO, AND THE FIRST IS WHERE THE CONCLUSION MUST FAIL. (i) A modified MD5
        whose step replaces the modular addition of the message word by a
        NON-INJECTIVE operation: the bijectivity hypothesis is removed, so even
        the k = 0 screen must LOSE its exclusions. A screen still excluding
        there is not using bijectivity and its derivation is not the one
        claimed. (ii) MD4, where the round count and schedule differ so t_last
        and the tail length differ: the whole curve must MOVE. An implementation
        returning the same curve for MD4 and MD5 is reading the enumeration and
        not the schedule.
    proof_obligations:
      - claim: >-
          PO-0. The MD5 step form, round functions, rotation amounts, constants,
          word schedule and feed-forward are pinned from RFC 1321 primary text
          before any screen runs.
        responsibility: baseline
      - claim: >-
          PO-1. The fixed-message step map and the fixed-message compression map
          h maps to s(h, B) are verified bijective by explicit inverse and 10^6
          round-trips; R2 depends on the second, not merely the first.
        responsibility: correctness
      - claim: >-
          PO-2. The k = 0 column reproduces an independent single-block
          implementation object by object at 100 percent.
        responsibility: baseline
      - claim: >-
          PO-3. Model-free and modelled exclusions are counted in separate
          columns at every k and never summed, with the depth at which the
          screen ceases to be model-free reported per vector.
        responsibility: strictness
      - claim: >-
          PO-4. Every mini-MD5 collision claimed carries a literal message pair
          re-verified by an INDEPENDENT reference implementation of the same
          scaled-down primitive.
        responsibility: correctness
      - claim: >-
          PO-5. R2 is reported as a REDUCTION TO A FREE-START COLLISION SEARCH
          and never as an exclusion, and the count of fixed-message
          Davies-Meyer collisions measured at reduced width is printed beside
          it so no reader can promote it.
        responsibility: scope
      - claim: >-
          PO-6. A brute-force search that finds nothing is a budget outcome
          about a solver, with its declared budget printed.
        responsibility: scope

  predictions:
    - metric: >-
        f(0, 64) -- model-free surviving fraction at target freedom k = 0 and
        r = 64 over the inherited enumerated slice
      direction: lower
      minimum_effect: >-
        below 0.05, reproducing IDEA-20260829-c92c2f's prediction through an
        independent implementation. A materially different value means the two
        implementations disagree and that disagreement is reported before any
        curve.
    - metric: f(4, 64)
      direction: higher
      minimum_effect: >-
        above 0.9, that is at least a twenty-fold rise from f(0, 64). This is
        the claim the record lives or dies by. A value below 0.5 is the OPPOSITE
        result and is more valuable: it would mean a rigorous multi-block screen
        exists.
    - metric: >-
        power_half_life_k (the smallest k at which f(k, 64) exceeds one half)
      direction: lower
      minimum_effect: >-
        at most 4. A half-life above 16 means the screen degrades slowly and the
        multi-block lane is worth building out.
    - metric: >-
        curve_flatness_indicator (number of distinct k values in 0 to 32 whose
        verdict vectors over the whole slice are identical)
      direction: lower
      minimum_effect: >-
        at most 2. A curve identical across many k is the artifact tell of
        docs/inventor-protocol.md section 3 and voids the run.
    - metric: >-
        miniMD5_multiblock_certified_collisions (literal two-block collisions of
        the scaled-down primitive, found exhaustively and independently
        re-verified)
      direction: higher
      minimum_effect: >-
        at least 3 at w = 4 and at least 1 at w = 8. THE INSTRUMENT MUST BE
        SHOWN TO FIRE ON A REAL MULTI-BLOCK OBJECT. Zero certified collisions
        means no verdict about multi-block screening may be drawn from the run.
    - metric: >-
        power_gap_on_certified_objects (fraction of certified mini-MD5
        two-block collisions whose delta_m is classified SURVIVING by the
        multi-block screen at the observed terminal weight AND EXCLUDED by the
        k = 0 screen for at least one block)
      direction: higher
      minimum_effect: >-
        at least 0.5. This is the power gap demonstrated on certified real
        objects rather than argued, and a value of 0 would mean the two screens
        do not differ where it matters.
    - metric: >-
        soundness_violations (delta_m excluded at some k for which a certified
        mini-MD5 pair with terminal difference in D_k nevertheless exists)
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Any nonzero value falsifies R1 or the implementation and is
        the run's most important output.
    - metric: >-
        fixed_message_DM_collision_count at w = 4 and w = 8, over the whole
        chaining-value space for declared blocks B
      direction: higher
      minimum_effect: >-
        strictly greater than 0, which is what demonstrates that R2 is a
        REDUCTION and not an exclusion. A count of 0 at both widths would make
        R2 look like an exclusion at those widths and must be reported with the
        width dependence stated explicitly.
    - metric: >-
        md4_versus_md5_curve_distance (maximum absolute difference between the
        two f(k, r) curves at matched r)
      direction: higher
      minimum_effect: >-
        at least 0.1 at some k. Identical curves mean the screen is reading the
        enumeration and not the schedule.
    - metric: noninjective_variant_exclusion_count at k = 0
      direction: lower
      minimum_effect: >-
        must drop to 0 or near 0 on the non-injective control, since the
        bijectivity hypothesis is removed there.

  minimal_test:
    design: >-
      ONE EXECUTOR TASK, FIVE STAGES, WITH A HARD GATE AT STAGE 2 AND SHARED
      MACHINERY WITH IDEA-20260829-c92c2f WHERE THAT RECORD HAS ALREADY RUN.
      STAGE 0 pins RFC 1321 from primary text, implements MD5, its step inverse
      and the fixed-message compression map, and discharges PO-1 by round
      tripping 10^6 states through both. STAGE 1 implements the
      k-parameterised backward screen, enumerates the inherited delta_m slice,
      and reproduces the k = 0 column against an independent single-block
      implementation object by object (PO-2); a mismatch halts the run. STAGE 2
      IS THE POSITIVE CONTROL AND IT GATES EVERY MULTI-BLOCK CONCLUSION: build
      mini-MD5 at w = 4 and w = 8, exhaustively find literal TWO-BLOCK
      collisions, re-verify each with an independent implementation of the same
      scaled primitive, and record the certificates. Then measure the power gap
      on those certified objects. STAGE 3 measures the full curve f(k, r) for k
      in 0, 1, 2, 4, 8, 16, 32 and r in 16, 24, 32, 48, 64, emitting model-free
      and modelled columns separately and never summed, with unmeasured cells
      written as null rather than 0. STAGE 4 runs the soundness hunt against
      EXCLUDED vectors, the fixed-message Davies-Meyer collision count at both
      reduced widths, and the two nearby-object controls (MD4, and the
      non-injective step variant), plus the shuffled-schedule null.
    controls:
      - >-
        POSITIVE CONTROL, GATING, AND IT USES A CERTIFICATE RATHER THAN A
        CITATION, WHICH IS WHY IT WORKS WHILE THE ACQUISITION LANE IS BLOCKED:
        literal mini-MD5 two-block collisions, found exhaustively and
        independently re-verified. The multi-block screen must classify them
        SURVIVING. An instrument that has never classified a real multi-block
        object cannot certify that no multi-block screen has power.
      - >-
        BASELINE-REPRODUCTION CONTROL: the k = 0 column must match an
        independent single-block implementation on 100 percent of objects.
      - >-
        SOUNDNESS CONTROL: exhaustive mini-MD5 search against EXCLUDED delta_m
        must find nothing, with the asymmetry stated -- finding nothing is
        expected by theorem and is weak evidence, finding something is decisive.
      - >-
        NULL OBJECT 1: the identical screen run against a RANDOM permutation of
        the word schedule. The curve must change; an unchanged curve means the
        screen is not reading the schedule.
      - >-
        NULL OBJECT 2: the trivial screen that excludes nothing, whose curve is
        identically 1.0, run through the identical counting code so that the
        reported fractions have a demonstrated capacity to be 1.
      - >-
        FLATNESS CHECK: the verdict vectors at distinct k must differ. A
        quantity exactly flat in the parameter meant to modulate it is an
        artifact tell and is reported as one.
      - >-
        NEARBY-OBJECT CONTROLS: MD4 (curve must move) and the non-injective step
        variant (k = 0 exclusions must vanish).
      - >-
        R2 DISCIPLINE CONTROL: the measured count of fixed-message Davies-Meyer
        collisions is printed beside every statement of R2, so the reduction can
        never be read as an exclusion.
      - >-
        FIREWALL CONTROL: the task holds no read access to
        coordination/goals/GOAL-MD5-001/quarantine/** and its receipt records by
        MECHANISM, not by attestation, that no path under that directory was
        opened.
    required_metrics:
      - f(k, r) for every declared (k, r) cell, with numerator and denominator
      - the modelled column at every cell, reported separately and never summed
      - power_half_life_k and curve_flatness_indicator
      - the k = 0 agreement fraction against the independent implementation
      - miniMD5_multiblock_certified_collisions, each with its literal message
        pairs and its independent re-verification record
      - power_gap_on_certified_objects, with the per-object table
      - soundness_violations, with any witness printed in full
      - fixed_message_DM_collision_count at w = 4 and w = 8, with the blocks used
      - md4_versus_md5_curve_distance
      - noninjective_variant_exclusion_count
      - shuffled_schedule curve
      - brute_force_budget_spent and the declared ceiling for every search

  falsification_conditions:
    - >-
      A certified mini-MD5 multi-block collision whose delta_m the screen
      EXCLUDES at the observed terminal weight. R1 or its implementation is
      false; the record is superseded, not amended.
    - >-
      The k = 0 column disagrees with an independent single-block
      implementation on any object. The generalisation changed the base case and
      no curve may be read.
    - >-
      f(4, 64) comes out below 0.5. Claim C's predicted direction is wrong, the
      screen has real multi-block power, and the correct disposition is the
      opposite of this record's headline -- reported as such, with the curve, as
      a substantially more valuable outcome than the predicted one.
    - >-
      curve_flatness_indicator above 2, or the shuffled-schedule null gives the
      same curve. The implementation is not reading its inputs and no number
      from the run may be cited.
    - >-
      Zero certified mini-MD5 two-block collisions within the declared budget.
      The instrument never fired on a multi-block object; the curve is reported
      as UNINTERPRETED and the shortfall is recorded as a budget outcome.
    - >-
      The fixed-message compression map is measured NOT to be bijective. R2's
      derivation collapses and the claim is withdrawn rather than reinterpreted.
    - >-
      RFC 1321 primary text, once read, differs from the recalled step form,
      schedule, rotation amounts or feed-forward. Every number is about a
      primitive that is not MD5 and is withdrawn.

  confounders:
    - >-
      THE TARGET PARAMETERISATION IS A MODELLING CHOICE AND IT IS
      LOAD-BEARING. Hamming weight of the terminal difference is one way to
      measure target freedom; modular magnitude or signed-digit weight are
      others and would give different curves. Every figure names its
      parameterisation, and at least two are reported so the choice is visible.
    - >-
      MINI-MD5 IS NOT MD5, AND THE TRANSFER IS ASYMMETRIC. The structural facts
      (bijectivity, R1, R2, and the degeneracy of the cascade at free target)
      are width-independent and transfer exactly; every FRACTION and every COUNT
      is width-specific and transfers not at all. Reporting a mini-MD5 fraction
      as an MD5 fraction would be the central misreading and is why the two are
      never placed in the same column.
    - >-
      NECESSARY IS NOT SUFFICIENT, INHERITED FROM THE SIBLING RECORD. A
      SURVIVES verdict at any k means only that one obstruction does not apply.
      A rising curve does NOT mean multi-block attacks are easy; it means one
      particular screen stops constraining them.
    - >-
      R2 READS LIKE AN EXCLUSION AND IS NOT ONE. A reader who takes "the final
      block must carry a message difference" as a theorem about MD5 has dropped
      the antecedent that a free-start collision would suffice. The measured
      Davies-Meyer collision count is printed beside it for exactly this reason.
    - >-
      A PREDICTED-AND-OBSERVED COLLAPSE OF POWER IS THE CHEAP OUTCOME. "The
      screen has no multi-block power" is also what a broken screen reports.
      Only the gated mini-MD5 positive control and the k = 0 baseline
      reproduction separate the two, and neither may be omitted from any report
      that states the negative.
    - >-
      DOUBLE-COUNTING WITH IDEA-20260829-c92c2f. If that record has run, its
      k = 0 numbers are re-measured here by an independent implementation and
      the agreement is a control, not a saving; if it has not run, this record
      computes the k = 0 column itself and reports it as ITS OWN measurement,
      never citing a sibling proposal's prediction as a result.

  interpretation_limits:
    - >-
      NO PATH IS CLAIMED NEW, NO COLLISION OF FULL MD5 IS CLAIMED, no attack
      cost is claimed, and nothing is said about any deployed system. Claim tier
      ceiling `analyzed`, except that any mini-MD5 collision is a `certified`
      object in the narrow sense of docs/claims-and-verification.md and is
      nothing more. Mini-MD5 collisions are not MD5 collisions and no such
      result would be new.
    - >-
      A RISING CURVE IS A LIMIT ON A SCREEN, NOT A STATEMENT ABOUT MD5's
      SECURITY, and not a statement that the multi-block space is unlistable --
      only that this particular model-free condition does not list it.
    - >-
      Scoped to the inherited delta_m slice, to the pinned specification, to the
      target parameterisations reported, to the step counts and widths actually
      run, and to the exhaustive-search budget actually spent.
    - >-
      THE QUARANTINE IS NOT CROSSED AND IS NOT NEEDED. The honest cost of that
      independence is unchanged from the sibling record: nothing here can be
      compared to any published family until acquisition happens.

  heuristic_assumptions:
    - id: H1
      statement: >-
        MODELLED-DEPTH PROPAGATION, INHERITED AND SEPARATED. Beyond the depth at
        which every round-function input has zero difference, the screen uses a
        declared signed-modular difference model in which the set of output
        differences consistent with given input differences is exactly the set
        the model enumerates. This imitates the standard assumption throughout
        differential cryptanalysis of ARX designs that a difference distribution
        table over a chosen representation captures propagation faithfully.
      rigorous_support: >-
        Rigorous ONLY where every round-function input has zero difference, and
        in the multi-block setting that region is much smaller than in the
        single-block one -- which is claim A restated at the level of the model.
        Beyond it the model is an approximation with a known failure mode:
        modular and exclusive-or differences do not determine one another and
        carries make the modular model lossy at bit boundaries.
      validation_plan: >-
        Sample 10^5 (state difference, message difference, step index) triples
        under declared seeds; for each, enumerate the TRUE set of achievable
        output differences by exhaustive search over a randomly restricted state
        slice at reduced width, and compare against the model's prediction.
        Report the FALSE-EXCLUSION RATE -- the fraction of triples where the
        model forbids an output difference that actually occurs -- as the
        quantity deciding whether a modelled exclusion is admissible at all; any
        value above 0 demotes modelled exclusions to "flagged, not excluded".
        TAIL CHECK: the deepest modelled exclusion observed is re-checked
        individually by exhaustive mini-MD5 search. Sampled parameters: widths
        4, 8 and 32, all four round functions, rotation amounts as pinned.
        TRANSFER ASSUMPTION, STATED: no transfer of the false-exclusion rate
        across widths or across r is claimed, and the modelled column is
        reported per width and per r.
    - id: H2
      statement: >-
        SCALED-DOWN STRUCTURAL FIDELITY. A mini-MD5 with w-bit words, the same
        message schedule and the same rotation pattern preserves exactly the
        structural properties this record's rigorous claims use -- bijectivity
        of the step map with a fixed message word, bijectivity of the
        fixed-message compression map, R1, and the degeneracy of the backward
        cascade under a free terminal target -- while preserving NO fraction,
        count or probability. Formally: the claims quantified over all states
        transfer across widths; the claims quantified over a declared enumerated
        slice do not.
      rigorous_support: >-
        The structural half is provable rather than heuristic: injectivity of
        addition by a constant and of rotation holds at every width, so every
        bijectivity argument is width-independent, and R1's proof uses only that
        a function of three zero-difference inputs has zero output difference.
        The heuristic content is entirely in the belief that the mini-MD5
        control is DIAGNOSTIC for the full-width behaviour of the SCREEN, which
        it is not for any numeric value.
      validation_plan: >-
        Verify the structural facts explicitly at w = 4, 8, 16 and 32 by
        round-tripping 10^6 random states through the step inverse and the
        compression inverse at each width, and require success at 100 percent
        at every width; a failure at one width only would indicate an
        implementation bug rather than a mathematical fact. Then report every
        fraction PER WIDTH with the widths never pooled, and report the
        fixed-message Davies-Meyer collision count per width so that the
        width dependence of R2's practical force is visible rather than
        assumed. Sampled parameters: widths 4, 8, 16, 32; step counts 16 and 32;
        declared seeds. TAIL CHECK: the mini-MD5 two-block collisions with the
        largest terminal difference weight are inspected individually and their
        per-step difference traces printed. TRANSFER ASSUMPTION, STATED: no
        numeric result at reduced width is claimed to hold at width 32.

  target_complexity:
    time_exponent: >-
      No asymptotic parameter. The k-parameterised screen costs the same as the
      single-block one per (vector, k) cell -- about 4.9 times 10^5 vectors
      times 7 values of k times 5 values of r times depth 8, roughly 2^26 word
      operations. Step and compression inverse validation: 10^6 round-trips at
      four widths, about 2^28 operations. The dominant cost is the mini-MD5
      exhaustive control: at w = 4 the chaining-value space is 2^16 and full
      exhaustive two-block search is trivial; at w = 8 it is 2^32 and the search
      is capped by a declared budget of at most 2^34 compression evaluations.
      TOTAL below 2^35 operations under the declared cap.
    memory_exponent: >-
      Negligible for the screens: 4.9 times 10^5 records of a few words per
      (k, r) cell, under 200 MB in total with all verdicts retained. The w = 8
      mini-MD5 search may use a birthday table of up to 2^32 entries if run in
      that mode; the contract caps it at a declared memory ceiling and otherwise
      runs the memoryless variant, and which mode ran is a reported field.
    best_known: >-
      IN THIS PROGRAM: the multi-block surviving fraction has never been
      computed at any k, and the single-block value exists only as a sibling
      record's PREDICTION, not as a measurement. So the baseline is not a worse
      number, it is the absence of a number. IN THE LITERATURE: UNKNOWN, because
      no source was opened. The bijectivity of the MD5 step, the vanishing of
      the state difference after the last differing word, and the reduction of a
      difference-free final block to a free-start collision are ALMOST CERTAINLY
      STANDARD FOLKLORE among practitioners, and `novelty_status: unverified`
      reflects that expectation rather than hiding it. What is plausibly not
      standard is the parameterised decay curve with a certified multi-block
      positive control, and even that is unverified.
    hidden_overhead: >-
      No o(1). The real hidden cost is INTERPRETIVE and is stated in advance: a
      surviving fraction near 1 sounds like a null result and is in fact a
      measured limit on a sibling record's claim, while a surviving fraction
      that stays low is the larger result. Both readings are fixed here so
      neither can be presented later as a surprise.
    tradeoff_note: >-
      The screens are embarrassingly parallel and memory-free. The only real
      budget knob is the mini-MD5 exhaustive search at w = 8, which trades wall
      clock and memory against the number of certified collisions; that trade is
      reported per width with the budget and the mode spent, never as a single
      success count.

  dominated_by: >-
    PARETO CHECK, ROW BY ROW. (1) Against IDEA-20260829-c92c2f: NOT dominated
    and DELIBERATELY ADVERSARIAL -- that record produces a single-block
    surviving list, this one measures the domain over which such a list means
    anything, and the k = 0 column is a shared boundary each computes
    independently. Neither supersedes the other and both should run, in either
    order. (2) Against IDEA-20260828-400967 (template-density enumeration on
    reduced-round MD4/MD5): NOT dominated -- that measures a MODELLED
    condition-count density and returns a curve in condition count; this returns
    a curve in TARGET FREEDOM under a model-free condition. They share
    reduced-round MD4/MD5 machinery and would cross-validate. (3) Against the
    RQ-MDFIVE-6870c1 MITM and preimage line (IDEA-20260828-69bde4, -12ce12,
    -163513, -4d7330): NOT dominated and disjoint -- preimage architectures and
    differential probability models, not the reachability of message differences
    for multi-block collisions. (4) Against the published MD5 collision
    literature: STRICTLY DOMINATED ON COLLISION-FINDING, and this record makes
    no collision claim about MD5. Whether the multi-block degeneracy of the tail
    condition is published is UNKNOWN because no paper was opened; if it is
    folklore the contribution reduces to the measured curve and its certified
    control, which is a smaller but nonzero delta. THAT ROW IS OPEN. (5) Against
    the quarantined Wang characteristic: NOT COMPARABLE BY CONSTRUCTION -- it is
    referenced by digest only and is neither read nor needed. (6) Against the
    committed adjudicator and its four batches of control work: NOT dominated
    and not comparable -- that decides membership against a census, this
    measures a screen's power. (7) Against the pending roughly 2950-second
    selector-swap control: NOT dominated, cheaper, complementary, and it does
    not presuppose the funding decision. (8) Against IDEA-20260829-d81e3b,
    -a03f74, -f2ffc1, -ea385e and -9e6650: NOT dominated and disjoint -- all
    five are SHA-1 structure or verdict semantics, none touches MD5's terminal
    condition.
  sota_delta: >-
    QUANTITATIVELY, AGAINST THE PROGRAM'S OWN STATE. The number of MD5 message
    differences this program can exclude on rigorous grounds in the MULTI-BLOCK
    setting is currently ZERO out of an enumerated slice of about 4.9 times
    10^5, and the surviving fraction has never been computed at any target
    freedom. This record produces the full curve f(k, r) over 35 declared cells
    for under 2^35 operations, with the k = 0 column reproduced against an
    independent implementation and with at least one certified multi-block
    collision of a scaled-down primitive as the positive control. If the
    predicted decay holds, the delta is CATEGORICAL rather than numerical: a
    coverage claim that would have been filed as a statement about the MD5
    difference space becomes a statement about single-block attacks with a
    measured decay curve attached. NO CRYPTANALYTIC DELTA IS CLAIMED: no
    collision of MD5, no cost improvement, no statement about MD5's security,
    and no claim that any surviving difference is new.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation reuses IDEA-20260829-c92c2f's screen if that has run, plus
      a target-set parameter, a mini-MD5 with parameterised word width, and an
      exhaustive two-block search. Compute is minutes for every screen column
      and hours for the w = 8 mini-MD5 control under the declared cap; the w = 4
      control is seconds and is the one that gates the conclusion.

  recommended_priority: medium
