idea:
  id: IDEA-20260829-ef61f2
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE MD5 TAIL SCREEN IS A SINGLE-BLOCK PHENOMENON AND THE PUBLISHED LINEAGE
    IS MULTI-BLOCK -- generalise the terminal condition from "difference exactly
    zero" to "difference inside a declared near-collision target set D",
    MEASURE the surviving fraction as a continuous function of how much target
    freedom D allows, and settle before any coverage claim is filed whether the
    screen's power survives contact with the attack shape that actually exists
  class: measurement

  claim: >-
    IDEA-20260829-c92c2f proposes a model-free necessary condition for MD5: the
    step map with a fixed message word is a bijection, so for a SINGLE-BLOCK
    collision from a fixed chaining value the 128-bit state difference must be
    EXACTLY ZERO immediately after the last step consuming a differing message
    word, and that equality cascades backwards. FOUR CLAIMS.
    (A) RIGOROUS, AND IT IS A LIMIT ON THAT SCREEN RATHER THAN AN EXTENSION OF
    IT. In a multi-block attack an intermediate block is a NEAR-collision block:
    its required output difference is a nonzero value delta that the next block
    must cancel, not zero. The backward cascade in c92c2f derives its power
    entirely from propagating an EQUALITY-TO-ZERO through identical bijections,
    and a bijection applied to two unequal states yields unequal states with no
    further constraint. So with the terminal target free, the cascade
    degenerates at depth 0 and the model-free screen has NO multi-block analogue
    that excludes anything.
    (B) TWO RESIDUAL RIGOROUS FACTS SURVIVE, AND ONE OF THEM IS A REDUCTION AND
    NOT AN EXCLUSION -- STATED THAT WAY DELIBERATELY. (R1) A block whose state
    difference at its own last differing step is zero has output difference
    exactly zero, so a block intended to produce a nonzero near-collision
    difference must carry a nonzero difference at that step. (R2) A multi-block
    collision whose FINAL block carries no message difference at all requires a
    collision in the fixed-message Davies-Meyer map h maps to h + s(h, B), where
    s is the state after the last step; because h maps to s(h, B) is a bijection
    for fixed B, this is a free-start collision of the compression function.
    THAT IS A REDUCTION TO A DIFFERENT SEARCH PROBLEM AND NOT AN IMPOSSIBILITY:
    such collisions certainly exist by counting, and the experiment measures how
    many exist at reduced width precisely so that no reader can promote R2 into
    an exclusion.
    (C) THE MEASURABLE CLAIM, AND IT IS A CURVE RATHER THAN A POINT. Define the
    screen at target-freedom parameter k as: the terminal state difference must
    lie in the declared set D_k of differences of Hamming weight at most k
    across the four registers, with D_0 equal to the zero difference alone.
    Over the same enumerated signed low-weight delta_m slice c92c2f declares,
    the model-free surviving fraction f(k, r) is a well-defined number this
    program has never computed. THE PREDICTION IS THAT THE SCREEN'S POWER DIES
    ALMOST IMMEDIATELY: f(0, 64) below 0.05, reproducing c92c2f, and f(4, 64)
    above 0.9. IF INSTEAD f STAYS BELOW 0.5 OUT TO k = 32, the tail condition
    has real multi-block power, the MD5 delta_m space is listable for the attack
    shape that actually exists, and that is a substantially larger result than
    the single-block version.
    (D) THE CONSEQUENCE FOR COVERAGE, WHICH IS WHY THIS IS WORTH RUNNING BEFORE
    RATHER THAN AFTER. A coverage or listability statement derived from the
    single-block screen is scoped to single-block attacks. The published MD5
    lineage is, by recollection and not by any source this program has read,
    multi-block. If f rises as predicted, then the single-block screen's
    surviving list is a complete description of a class that may contain no
    published attack at all, and saying so in advance costs one small run
    instead of one retracted claim.
    NO PATH IS CLAIMED NEW, NO COLLISION OF FULL MD5 IS CLAIMED, AND NOTHING
    HERE READS OR RECONSTRUCTS ANY QUARANTINED MATERIAL.

  mechanism: >-
    THE STRUCTURAL POINT, AND IT IS ABOUT WHERE A THEOREM'S POWER COMES FROM.
    c92c2f's screen is rigorous because zero is a fixed point of every bijection
    in a very strong sense: equal states stay equal and unequal states stay
    unequal, so "the difference is zero at the end" pulls back to "the difference
    is zero at the last differing step" with no differential model at all. The
    entire power of the condition is the ZERO, not the bijection. Replace the
    terminal zero by a free target and the bijections stop constraining
    anything, because knowing the difference of two states says nothing about
    the difference of their images unless one of them is zero.
    WHY A CURVE AND NOT A YES-OR-NO. Between the two extremes -- terminal zero,
    and a completely free terminal difference -- there is a one-parameter family
    of screens indexed by how much target freedom is allowed, and the useful
    question is not whether the screen dies but HOW FAST. If the surviving
    fraction is already near 1 at k = 1, the single-block result is a fact about
    a measure-zero corner of the attack space. If it degrades slowly, there is a
    real multi-block screen to build. The curve also supplies an artifact tell
    that costs nothing: a surviving fraction EXACTLY FLAT in k would mean the
    implementation is not reading the target set at all, which is precisely the
    failure docs/inventor-protocol.md section 3 names.
    THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY COMPUTE. The tracked object is
    the triple (support of delta_m, last-differing-step index, terminal target
    set), which projects away the whole interior differential path, every
    sufficient bitcondition and the entire message-modification budget. The
    projection is genuinely lossy, and the retained part propagates
    deterministically ONLY in the k = 0 fibre, where a bijection carries equal
    states to equal states -- which is exactly why the object's power is
    concentrated at k = 0 and why measuring its decay in k is the honest test of
    whether the projection is compatible with the target's operations in the
    regime attacks actually live in. THIS RECORD THEREFORE DOES NOT CLAIM A NEW
    OBJECT; it claims that a sibling record's object has a measurable domain of
    validity and proposes to measure it.
    WHY THE POSITIVE CONTROL MUST BE A REAL TWO-BLOCK COLLISION AND NOT A
    SYNTHETIC ONE. An instrument never shown to fire cannot certify a negative,
    and the negative at stake here -- "the screen has no multi-block power" --
    is exactly the kind that a broken screen also produces. The control is
    therefore a LITERAL two-block collision of a scaled-down MD5 with w-bit
    words, found exhaustively, carrying its message pairs as a certificate. The
    multi-block screen must classify it SURVIVING and the single-block screen
    must EXCLUDE at least one of its blocks -- a power gap demonstrated on a
    certified real object rather than argued.

