idea:
  id: IDEA-20260813-1c08e4
  question_id: RQ-UOV-001
  added: '2026-08-13'
  title: >-
    THE MODEL IS QUOTED FOR A TYPICAL KEY AND THE PARAMETER IS SET FOR ALL KEYS:
    measure the weak-key density of UOV -- the fraction of honestly generated
    keys whose oil space is recoverable materially below the model's predicted
    cost -- with a matched random-map null, because a cost model calibrated on
    the median says nothing about the tail a real deployment samples from
  class: measurement

  claim: >-
    (A) THE GAP BETWEEN TWO QUANTITIES THAT ARE ROUTINELY CONFLATED. A
    concrete-security parameter is chosen so that the attack cost EXCEEDS a
    target for the keys a deployment will actually generate. An
    intersection-attack complexity model predicts a cost for a TYPICAL key. Those
    are different quantities, and the difference is the left tail of the cost
    distribution over honest key generation. RQ-UOV-001 asks whether the
    published plain-UOV model is calibrated by measurement at its own
    parameters; this record says the calibration is incomplete unless it reports
    a distribution rather than a point, and proposes measuring the tail.

    (B) WHY UOV SPECIFICALLY MIGHT HAVE ONE. Honest UOV key generation samples a
    random oil space and random vinegar structure. Nothing in that process
    excludes keys with accidental extra structure, and three concrete
    mechanisms are nameable in advance rather than fished for afterwards:
      W1 A component polar form of unusually low rank, which is what MinRank-
         style attacks consume; the rank distribution of random alternating
         matrices has a computable left tail and every draw is an independent
         chance at it.
      W2 A pencil {sum c_i P'_i} containing more low-rank members than typical,
         which is a joint property and is not excluded by any per-component check.
      W3 An oil space with a non-trivial intersection with a distinguished
         subspace fixed by the parameter choice (for instance when the
         specification fixes part of the key layout for compression), which
         would correlate structure across keys rather than across components.
    Each is a pre-registered hypothesis with its own statistic; the record does
    not permit adding a fourth after seeing data.

    (C) THE CLAIM AND ITS TWO BRANCHES, BOTH DELIVERABLES. Measure, at toy
    (q, v, m), the empirical distribution of oil-space recovery cost over many
    honestly generated keys, against the matched random-map null.
      BRANCH 1 -- the distribution is tight and matches the model's point
        prediction. Then the model's use as a parameter-setting quantity is
        supported at toy scale, the tail is bounded by measurement rather than
        by assumption, and that bound is the deliverable. This is a controlled
        confirmation and is the expected outcome.
      BRANCH 2 -- the distribution has a left tail heavier than the null's,
        localised to one of W1-W3. Then a stated fraction of honest keys is
        weaker than the headline, and the quantity a deployment needs is a
        quantile rather than a mean. The fraction and its mechanism are the
        deliverable.
    There is no outcome in which the measurement means nothing, which is the
    quality bar in agents/idea-generator.md.

    (D) WHAT THIS IS NOT. NOT a claimed attack and NOT a claim that weak UOV
    keys exist -- the honest prior is that they do not at any measurable rate.
    NOT a statement about deployed parameters: RQ-UOV-001.claim_tier_ceiling
    caps this at toy tier, and a tail measured at toy (q, v, m) does not
    transfer, which is stated as a limit rather than hedged.

  discriminated_from:
    - >-
      IDEA-20260801-014, which measures attack cost against the model's
      prediction at toy parameters. That record measures a cost; this one
      measures the DISTRIBUTION of that cost over key generation and reports a
      quantile. If 014 is run, its per-key numbers are the input to this record
      and the two should share a harness rather than duplicate one.
    - >-
      IDEA-20260805-74349c, the only UOV proposal mentioning weak keys, which
      tracks oil-space entropy through seed expansion in the COMPRESSED
      variants. That is a question about the key-derivation function; this is
      about the distribution of hardness over honestly generated PLAIN keys,
      and W3 is where the two touch.
    - >-
      IDEA-20260805-ca92fd, which measures the solving degree of the
      intersection system against a planted solution. Solving degree is one
      input to cost; this record measures end-to-end recovery cost over a key
      population and would consume that instrumentation.

  object_first_candidate:
    tracked_object: >-
      THE PER-KEY RECOVERY COST, as a random variable over honest key
      generation, together with the pre-registered structural statistics W1-W3
      that might explain its left tail.
    lossiness: >-
      A whole key collapses to one number, so the projection is lossy; the point
      of W1-W3 is that when the number is anomalous the record can say WHICH
      structure produced it rather than only that something did.
    propagation: >-
      Not a propagating object -- this is a population measurement, not a
      tracked-object proposal, and the record does not pretend otherwise.
    survival_score: Not applicable; population statistic.

  mechanism: >-
    STEP 0 -- ACQUISITION GATE. RQ-UOV-001.constraints forbids designing an
    experiment before primary sources are filed, and the Round-3 specification
    is unread. Stage 0 files the key-generation procedure from primary text: the
    weak-key question is meaningless without knowing exactly what the honest
    generator samples. If the generator cannot be read, the record halts at
    Stage 0 at zero compute.
    STEP 1 -- PRE-REGISTER W1-W3 AND THEIR STATISTICS before any key is
    generated, with the exact statistic and the exact threshold for each. A
    mechanism added after seeing the tail is a post-hoc explanation and is
    prohibited by this record's own falsification conditions.
    STEP 2 -- GENERATE AND MEASURE. Many honest keys per toy cell; recover the
    oil space by the same solver for each; record cost, the W1-W3 statistics,
    and the recovery certificate (a recovered oil space must annihilate the
    public map, per RQ-UOV-001.constraints, and the wrapper re-verifies it).
    STEP 3 -- THE NULL. Identical pipeline on random maps of the same shape with
    NO planted oil space, and on planted keys with a KNOWN oil space. The first
    gives the background cost distribution; the second proves the solver finds
    what is there.
    STEP 4 -- THE QUANTILE, NOT THE MEAN. Report the 1st and 0.1th percentile of
    recovery cost alongside the median, and the correlation of each with W1-W3.
    The headline number is the quantile; the mean is reported beside it and
    never instead of it.

  novelty_status: unverified
  novelty_screen:
    method: >-
      grep -ril for "weak key", "weak-key", "density", "quantile", "tail",
      "key generation", "rank distribution" over ledger/proposals and
      knowledge/, 2026-08-13 at 8e230f800, plus a sweep of the 14 RQ-UOV-001
      proposals.
    results: >-
      "weak key" appears in 5 proposals repository-wide and in exactly one of
      the 14 UOV proposals (IDEA-20260805-74349c, about seed-expansion entropy
      in compressed variants). No record measures a cost DISTRIBUTION over
      honest UOV key generation or reports a quantile.
    verdict: >-
      UNVERIFIED. Weak-key analysis is a standard cryptanalytic move and nothing
      about the idea is claimed as new in general. What is claimed is that this
      corpus has no per-key cost distribution for UOV, and that the model
      RQ-UOV-001 asks about is a point prediction. The published UOV literature
      has NOT been read by this program and may well already report a
      distribution; Stage 0 checks, and a hit there would supply the comparison
      rather than kill the record.

  null_object_control: >-
    (1) RANDOM-MAP NULL: maps of identical shape with no planted oil space, run
    through the identical solver. Gives the background cost distribution; any
    UOV tail must be read against it, not against zero.
    (2) PLANTED POSITIVE CONTROL, BLOCKING: keys with a known oil space that the
    solver must recover, with the certificate re-verified. A solver that cannot
    recover a planted space cannot be trusted to report that a key was hard.
    (3) SEEDED-TAIL POSITIVE CONTROL, BLOCKING AND THE ONE MOST LIKELY TO BE
    SKIPPED: deliberately construct keys with a low-rank component (mechanism
    W1) at a known rate, mix them into the population at a known fraction, and
    require the pipeline to recover that fraction within its stated error. A
    tail-detection instrument that has never detected a planted tail has not
    been shown able to.

  assumptions:
    - >-
      The honest key generator is as specified and samples the oil space
      uniformly. UNVERIFIED until Stage 0 files it; the whole record is about
      that generator's output distribution, so an unread generator makes the
      measurement meaningless rather than merely uncertain.
    - >-
      Recovery cost is measured end to end with memory charged, per
      RQ-UOV-001.constraints, not as a solving degree alone.
    - >-
      Toy (q, v, m) where full recovery is feasible for hundreds of keys. That
      is what makes a 1st-percentile estimate possible at all, and it is also
      why the result does not transfer.

  proof_search_map:
    bottleneck: >-
      Sample size. A 1st-percentile estimate needs hundreds of full recoveries
      per cell, and full recovery is the expensive step; this sets the toy grid
      and is the binding constraint on the whole record.
    baseline_embedding:
      parameter_slice: >-
        The median key, where the measured cost must reproduce the model's point
        prediction if the model is calibrated at all.
      reproduction_check: >-
        Frozen fixture: the median measured cost against the model's prediction
        at one toy cell, within a pre-registered band. If the median does not
        reproduce, the tail measurement is uninterpretable and the run halts.
    observation_collision:
      observable: per-key recovery cost
      distinct_preimage_search: >-
        Required and expected to succeed: two keys with the same recovery cost
        and different W1-W3 profiles. That collision bounds the attribution --
        it shows cost does not determine mechanism -- and it is why a tail must
        be attributed by correlating with a pre-registered statistic rather than
        by inspecting the cheap keys after the fact.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A cost measure charged over proved-disjoint blocks (solver work,
          memory traffic, certificate verification) so a tail can be attributed
          to a block rather than reported as an opaque anomaly.
        predicted_gain: attribution rather than an unexplained outlier
    quantifier_order: >-
      The distinction the record exists to make: the model states EXISTS a cost
      C such that FOR A TYPICAL key the attack costs about C. A parameter choice
      needs FOR ALL keys a deployment generates, the attack costs at least C',
      which is a statement about the infimum over the sampled population. The
      measurement estimates a low quantile as a proxy for that infimum and
      CANNOT establish the infimum itself -- stated here so the deliverable is
      not over-read.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these toy parameters, the 1st-percentile recovery cost is X, against
        a median of Y and a random-map null of Z." NEVER a statement about
        deployed keys, and never an infimum.
      nearby_object_control: >-
        A key family constructed to be weak by W1. The pipeline must find it
        cheaper. A pipeline reporting the same distribution for honest and
        deliberately weakened populations cannot measure a tail.
    proof_obligations:
      - claim: The median reproduces the model's prediction.
        responsibility: baseline
      - claim: Recovered oil spaces carry re-verified certificates.
        responsibility: correctness
      - claim: The seeded tail is recovered at its planted rate.
        responsibility: success_probability
      - claim: Quantiles are reported with sample-size-derived error.
        responsibility: interface
      - claim: Toy tier is not read as a deployed-parameter statement.
        responsibility: scope

  predictions:
    - metric: >-
        ratio of 1st-percentile to median recovery cost, per toy cell, UOV
        population versus random-map null
      direction: different
      minimum_effect: >-
        Predicted: the UOV ratio matches the null's within sampling error --
        i.e. no excess tail. A UOV ratio below the null's by more than the
        pre-registered band, reproduced at two cells, records a weak-key
        population and its fraction is the deliverable.
    - metric: correlation of recovery cost with each pre-registered statistic W1-W3
      direction: different
      minimum_effect: >-
        Any tail must correlate with at least one PRE-REGISTERED statistic. An
        uncorrelated tail is reported as unexplained and explicitly NOT
        attributed to a mechanism invented afterwards.
    - metric: seeded-tail recovery rate in the positive control
      direction: higher
      minimum_effect: >-
        The planted weak fraction must be recovered within its stated error, or
        no null result may be reported from this instrument.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): file the key-generation procedure from
      primary text; halt if unobtainable.
      STAGE 1 (zero compute): pre-register W1-W3, their exact statistics and
      thresholds, and the reporting quantiles.
      STAGE 2 (HARD GATE): planted positive control and seeded-tail positive
      control.
      STAGE 3 (hours to days): generate and fully recover hundreds of honest
      keys per toy cell, with certificates re-verified.
      STAGE 4: the random-map null on the identical pipeline.
      STAGE 5 (zero compute): quantiles, correlations, and the median-versus-
      model reproduction check.
    controls:
      - random-map null of matched shape
      - planted known oil space, certificate re-verified
      - seeded weak-key tail at a known fraction (BLOCKING)
      - median-versus-model reproduction at one cell
    required_metrics:
      - per-key end-to-end recovery cost with memory charged
      - 1st and 0.1th percentiles and the median, with sample-size error bars
      - W1-W3 statistics per key and their correlation with cost
      - certificate verification outcome per recovery
      - seeded-tail recovered fraction versus planted fraction
      - sample size per cell and the largest (q, v, m) reached

  falsification_conditions:
    - >-
      The median does not reproduce the model's prediction. The tail measurement
      is uninterpretable; halt and report the median discrepancy, which is
      itself a calibration finding.
    - >-
      The seeded-tail control is not recovered at its planted rate. The
      instrument cannot detect a tail and no null may be reported.
    - >-
      A recovered oil space fails certificate re-verification. Integrity
      failure; the run halts under RQ-UOV-001.constraints.
    - >-
      A left tail appears that correlates with NONE of W1-W3. Reported as
      unexplained, explicitly not attributed, and handed forward as the
      successor question -- inventing a fourth mechanism to fit it is prohibited.

  confounders:
    - >-
      Solver variance masquerading as key variance. The same key solved twice
      must cost the same within a tight band, or the distribution being measured
      is the solver's and not the population's. This is checked before Stage 3
      and is the most likely way the record produces a spurious tail.
    - >-
      Toy-scale degeneracy. At small (q, v, m) a non-trivial fraction of random
      draws is degenerate for reasons that vanish at deployed size, manufacturing
      a tail that is an artifact of smallness.
    - >-
      Quantile estimation from too few samples. A 1st percentile from 100 keys
      is one key; the error bars must come from the sample size and be reported
      with every quantile.
    - >-
      Reading a toy tail as a deployed weakness. Forbidden by the claim tier and
      repeated in interpretation_limits.

  interpretation_limits:
    - >-
      Toy tier only. A tail measured at toy (q, v, m) says nothing about
      deployed parameters, and the record does not license the extrapolation.
    - >-
      A quantile is not an infimum. The measurement bounds what was sampled, not
      what could be generated.
    - >-
      BRANCH 1 (no excess tail) is a controlled confirmation and a real result
      under docs/inventor-protocol.md section 3, not a failed experiment.

  heuristic_assumptions:
    - id: HEUR-UOVWK-1
      statement: >-
        End-to-end oil-space recovery cost over honest UOV key generation is
        concentrated: the ratio of the 1st percentile to the median is within a
        constant factor of the same ratio for random maps of identical shape,
        and that factor does not grow with (q, v, m) across the toy grid.
      rigorous_support: >-
        Rigorous: the rank distribution of random alternating matrices over F_q
        is exactly known, which bounds the W1 mechanism's contribution to the
        tail from above. Heuristic: that no OTHER mechanism contributes a
        heavier tail, which is precisely what the measurement tests and what
        W2-W3 are pre-registered to catch.
      validation_plan: >-
        Measure the percentile ratio for both populations across at least three
        toy cells spanning a range in q and in v/m, and fit its dependence on
        cell size. Comparison distribution: the random-map population measured
        on the identical pipeline, so the UOV ratio is read against shape rather
        than against zero. Tail check: the single cheapest key in each
        population, and whether it is cheaper than the null's cheapest by more
        than the sampling band. Toy scale only, labelled so, and explicitly not
        a crypto-scale validation.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. The output is a distribution and a quantile at
      toy parameters. If BRANCH 2 fires, the consequence is that the model's
      point prediction understates the risk for a stated fraction of keys --
      a calibration correction, not a new exponent, and it would need its own
      record with matched baselines.
    memory_exponent: >-
      Recovery memory is charged per key and is part of the reported cost, per
      RQ-UOV-001.constraints; it is also what caps the toy grid alongside sample
      size.
    best_known: >-
      Intersection attack, Kipnis-Shamir, reconciliation at identical
      parameters, per RQ-UOV-001.targets. The record measures against whichever
      solver is used and reports it by name; it does not claim to improve any.
    hidden_overhead: >-
      The sample size hides inside every quantile. A 1st percentile from a few
      hundred keys is a coarse estimate and its error bar is reported with it
      rather than in a footnote.
    tradeoff_note: Not applicable; no algorithm produced.

  dominated_by: >-
    As an ATTACK: mounts none; dominated on time, memory and data by every
    baseline in RQ-UOV-001.targets.
    As a CALIBRATION contribution: dominated by IDEA-20260801-014 on directness
    -- that record measures the cost the model predicts, which is the first
    thing to know -- and dominates it on one axis, reporting a distribution and
    a quantile where 014 reports a cost. The two share a harness and this record
    is the second half of that one, not a rival.
  sota_delta: >-
    Zero speedup. Deliverable as numbers: converts a point cost prediction into
    a measured distribution with 1st and 0.1th percentiles and sample-size error
    bars, over hundreds of honestly generated keys per cell, read against a
    matched random-map null; three mechanisms (W1-W3) pre-registered before any
    key is generated so a tail can be attributed rather than explained
    afterwards; and one seeded-tail positive control at a known planted
    fraction, without which a null result from this instrument is not
    admissible.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that no excess tail is found -- BRANCH 1, a controlled confirmation.
    0.1 that a tail appears and correlates with W1, the mechanism with a known
    computable rate. 0.05 that a tail appears uncorrelated with all three, which
    is the outcome the record is least able to act on and most obliged to report
    honestly. The durable value is the seeded-tail control and the quantile
    reporting convention, both reusable by the other UOV proposals.

  id_allocation_provenance: >-
    python3 tools/allocate_id.py --next idea --date 20260813, then --check
    IDEA-20260813-1c08e4 confirmed free before use.

