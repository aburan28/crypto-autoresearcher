# IDEA-20261004-ec7cf2
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-ec7cf2
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 15 has degree 225 and multiplication by 14 has degree 196
  class: measurement
  claim: >-
    Multiplication by 15 has degree 225. Multiplication by 14 has
    degree 196. Two hundred twenty-five exceeds one hundred ninety-six
    by 29. The product of the two degrees is 44100. Their sum is 421.
    The gap is a map degree, not an ECDLP exponent and not the degree
    pair 196 and 169.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Fifteen squared is 225. Fourteen squared is 196. Two maps of
    degree 196 have gap 0 and product 38416. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        Transfer attacks apply only to special curves, which is a
        different object from these two multiplication degrees.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The multipliers 15 and 14 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 29.
    baseline_embedding:
