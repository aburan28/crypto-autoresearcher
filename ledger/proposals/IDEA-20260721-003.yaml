idea:
  id: IDEA-20260721-003
  title: Batch / amortized prime-field index calculus vs BATCH Pollard rho
  class: algorithm
  claim: >-
    In the batch setting (T discrete logs on one random prime-field curve), a shared
    summation-polynomial factor base amortizes relation collection so per-target cost
    falls below Bernstein-Lange batch/multi-target rho once T grows past a crossover.
  mechanism: >-
    Factor-base logs are collected once and reused across all T targets; only the final
    descent is per-target. If collection dominates and amortizes over T, per-target cost
    drops -- but the honest baseline is BATCH rho, which also amortizes.
  novelty_status: adaptation
  assumptions:
    - relation collection can be shared across targets on one curve
    - a matched batch-rho baseline is implemented
  predictions:
    - metric: amortized per-target cost, index-calculus-batch vs batch-rho
      direction: lower
      minimum_effect: "a crossover T beyond which IC-batch per-target cost < batch-rho"
  minimal_test:
    design: >-
      Toy curve; collect shared factor base + logs once; solve T targets by descent;
      compare amortized per-target cost to batch-rho (distinguished points, T targets).
    controls: [batch rho at the same T; single-target rho for reference only]
    required_metrics: [per-target amortized group-op-equivalent cost vs T]
  falsification_conditions:
    - "IC-batch per-target cost >= batch-rho at all tested T (no amortization win)"
  confounders: [the KN-FIND yield barrier makes even amortized collection expensive; descent cost]
  interpretation_limits:
    - expected negative: the relation-collection yield barrier likely dominates
    - toy scale; batch rho is the correct, harder baseline
  estimated_cost: {implementation: medium, compute: medium}
  recommended_priority: medium
  proposed_by: idea-generator
