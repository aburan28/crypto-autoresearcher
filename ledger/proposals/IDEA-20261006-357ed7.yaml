idea:
  id: IDEA-20261006-357ed7
  question_id: RQ-ICINV-475b5e
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Factor-base hit gap of 4 between two order-58 curves over F_53
  class: measurement
  claim: >-
    Over F_53, E1: y^2 = x^3 + x + 1 and E2: y^2 = x^3 + 6x + 9 are
    both nonsingular and both have 58 points, counting infinity. Their
    j-invariants, computed as 1728*(4A)^3 times the inverse of
    Delta = -16*(4A^3+27B^2), are 1 and 43. Among the 57 affine points
    of each curve, the number whose x lies in {0,1,2,3,4} is 6 on E1
    and 10 on E2. The absolute gap of those two hit counts is 4. A
    recount that returns any other pair of hit counts is a negative.
    Counting E1 twice has gap 0.
  mechanism: >-
    The tracked object is membership of an affine x-coordinate in a
    frozen 5-element factor base, not a discrete logarithm. The
    representation is the curve equation. The operation set is
    enumeration of squares in F_53. Tate's theorem says the two curves
    are isogenous over F_53 because they have the same point count, so
    they sit in one isogeny class, while the j-invariants differ, so
    they are not the same labelled model. The hit count is a coordinate
    functional on that class. KR-RHO-755e35 says the group-structure
    class of weakness is shared across the class. It does not say this
    histogram is constant. A gap of 4 is a measured non-constancy of
    this one functional at this pin. It does not name a cheaper
    discrete logarithm.
  assumptions:
    - Both discriminants 4A^3+27B^2 are nonzero in F_53. This session computed 31 and 30.
    - Point counting includes the point at infinity exactly once.
    - A hit is an affine point, so a pair of opposite nonzero y-coordinates contributes two hits when x is in the factor base.
  predictions:
    - metric: hit_count_gap
      direction: different
      minimum_effect: >-
        The absolute difference of the two hit counts is 4.
    - metric: repeat_gap
      direction: lower
      minimum_effect: >-
        The absolute difference of two counts of E1 is 0.
  minimal_test:
    design: >-
      Enumerate affine points on both curves twice, with two counters.
      Count how many have x in {0,1,2,3,4}. Recompute both
      j-invariants. Record #E including infinity.
    controls:
      - The same counter on E1 a second time. The hit gap against itself is 0.
      - A singular model is not scored. Both discriminants must stay nonzero.
      - BSGS is not required. The control is the repeated enumeration.
    required_metrics:
      - hit count on E1 and on E2
      - point count of each curve, including infinity
      - both j-invariants
  falsification_conditions:
    - The two hit counts are anything other than 6 and 10.
    - The point counts are not both 58.
    - The j-invariants are equal, so the models were not distinct.
  confounders:
    - Counting only one y for each x halves both hit counts and can turn a gap of 4 into a gap of 2. The definition counts points, not x-classes.
    - A factor base of field elements is not a factor base of curve points of small height. The two notions are not interchangeable in this claim.
  interpretation_limits:
    - A hit-count gap of 4 does not make index calculus faster than rho and does not move the exponent 1/2.
    - Same point count is the Tate condition for isogeny over a finite field. This idea does not exhibit the isogeny map.
    - The test is one prime and one 5-element set. It does not transfer to a cryptographic factor base.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. Both hit counts are finite
        enumerations of squares in F_53.
      rigorous_support: >-
        The Legendre symbol decides square-ness, and the curve
        equation is a cubic. KR-RHO-755e35, opened this session,
        records that equal point counts are the isogeny invariant
        over a finite field. That row is not a distribution for the
        hit count.
      validation_plan: >-
        Two independent enumerations must return hit counts 6 and 10
        and point counts 58 and 58. A third pass over E1 must return
        6 again.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Enumeration at p=53 is O(p) field operations.
      This idea does not beat Pollard rho on a group of order 58.
    memory_exponent: >-
      Unchanged. The worksheet stores two integers.
    best_known: >-
      Rho at exponent 1/2, and the isogeny-invariance statement on
      KR-RHO-755e35. This histogram does not beat that exponent.
    hidden_overhead: >-
      No o(1) term is claimed.
    tradeoff_note: >-
      The measurement stores no distinguished-point table and does not
      move the van Oorschot-Wiener curve.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
  citations:
    - ref: ledger/questions/RQ-ICINV-475b5e.yaml
      provenance: internal
      claim: >-
        The question asks whether any prime-field attack-cost
        functional is non-constant across an F_p-isogeny class.
      verified_by: ledger/questions/RQ-ICINV-475b5e.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if they
        have the same number of points, and an isogeny walk does not
        reach a different group-structure class of weakness.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over prime fields does not beat
        generic methods under the stated statistical assumptions.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-IC-5931ee
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row says the group order, and therefore the generic
          discrete-log cost class, is constant on an isogeny class.
          This idea counts affine points with x in {0,1,2,3,4} and
          predicts the absolute gap 4 between two models of order 58
          at p=53 with j-invariants 1 and 43. The separator is that
          integer 4. The exponent movement is 0.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: orthogonal
        delta: >-
          That row bounds the cost of using a factor base to decompose
          points. This idea does not decompose a point. It only counts
          how many x-coordinates land in a 5-element set.
  dominated_by: >-
    Pollard rho on a group of order 58 already has exponent 1/2, and
    KR-RHO-755e35 already says the isogeny class does not change that
    group order. A hit-count gap of 4 does not beat rho in time,
    memory, or queries.
  sota_delta: >-
    The quantitative separator is an absolute gap of 4 hits out of 57
    affine points, against a repeated count of gap 0. The distance to
    a sub-square-root algorithm is the full exponent 1/2, and this
    idea moves that exponent by 0.
