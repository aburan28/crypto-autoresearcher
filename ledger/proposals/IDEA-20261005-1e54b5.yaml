      verified_by: idea-generator, this session, via ledger/proposals/IDEA-20260905-40aa90.yaml
    - ref: H-ECDLP-e26a57
      provenance: internal
      claim: >-
        The frozen fast-theta comparator is about expanded monomial
        support of a Rosenhain Jacobian, including a Z/5 chart. It does
        not count 2-torsion over F_8 on the order-19 class.
      verified_by: idea-generator, this session, via ledger/hypotheses/H-ECDLP-e26a57.yaml
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        A Frobenius-invariant factor base cuts the number of systems by
        at most 1/n and speeds linear algebra by n^2.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: "Mumford, Tata lectures on theta, level structures"
      provenance: recalled
      claim: >-
        Recalled pointer, text not opened: a level-2 theta structure
        on a principally polarized abelian surface uses a Lagrangian
        subgroup of A[2]. The count above is the field of that
        subgroup's geometric points, conditional on H1.
      verified_by: null
  assumptions:
    - >-
      The model enumeration is the 2048-pair search named in
      IDEA-20260926-80209d. This record adds n2 on the hits and does
      not rebuild the present/absent ladder.
    - >-
      H1 identifies the separable factor of P modulo 2 with the
      characteristic polynomial of Frobenius on A[2]^et. The counts
      are conditional on that identification.
    - >-
      A genus-2 Jacobian model supplies a principal polarization. If
      no model exists, the theta-chart degree is not measured.
  predictions:
    - metric: n2(F_2), n2(F_4), n2(F_8) on a Jacobian model of this P(T)
      direction: different
      minimum_effect: >-
        The triple equals (1, 1, 4). Any other triple on a model of
        this P(T) is the other outcome.
    - metric: number of genus-2 models over F_2 with N_1 = 6 and N_2 = 6
      direction: different
      minimum_effect: >-
        Either at least one model, in which case the triple above is
        read, or zero models, in which case the degree is unmeasured.
  minimal_test:
    design: >-
      Enumerate the 2048 pairs (h, f) over F_2. Keep those whose
      Jacobian has six rational points and six points over F_4, and
      whose characteristic polynomial equals P. On each hit, count
      points Q with [2]Q = 0 over F_2, F_4, and F_8 by enumerating
      the Jacobian (order about q^2, at most a few hundred points).
      Record the triple. If the hit list is empty, record that and
      stop. One enumeration, no solver.
    controls:
      - >-
        Even-order elliptic control. The five elliptic isogeny classes
        over F_2 have point counts in {1, 2, 3, 4, 5}. At least one
        even order must show n2(F_2) greater than 1. If every class
        shows n2(F_2) = 1, the counter is broken.
      - >-
        Odd-order elliptic control. A class with point count 1, 3, or
        5 must show n2(F_2) = 1. A larger count means the counter
        invents 2-torsion.
      - >-
        Polynomial control. P(1) is recomputed as 19, and P modulo 2
        is recomputed as T^2(T^2 + T + 1), before any curve is counted.
    required_metrics:
      - hit count of models with this P(T)
      - n2(F_2), n2(F_4), n2(F_8) on each hit
      - n2(F_2) on each of the five elliptic classes over F_2
  falsification_conditions:
    - >-
      A Jacobian model of this P(T) whose triple (n2(F_2), n2(F_4),
      n2(F_8)) is not (1, 1, 4). H1 is then false for this class, and
      the level-structure degree is the observed jump instead.
    - >-
      The even-order elliptic control reports n2(F_2) = 1. The
      instrument cannot see rational 2-torsion, and no surface count
      is read.
  confounders:
    - >-
      Several models can share P(T). The triple is required on every
      hit. A split across hits is reported as a split, and is itself
      the falsifying outcome.
    - >-
      Points of order 4 are not points of the kernel of [2]. The
      counter is kernel size, not the number of elements of order
      exactly 2, except that kernel size 4 is the identity plus three
      points of order 2.
    - >-
      A model defined only over an extension is outside the 2048-pair
      list. Absence from that list is outcome "no F_2 model", not a
      statement about twists.
  interpretation_limits:
    - >-
      Toy scope: one isogeny class over F_2, group order 19. No
      statement about order 131, about dimension 5 or 6, or about the
      norm-one torus of dimension 48.
    - >-
      The rho exponent on a binary elliptic curve stays 1/2. The
      Frobenius-invariant factor-base saving stays the factor in
      KR-IC-b0fcda. A level structure over F_8 does not change either
      number.
    - >-
      This record does not compute a Mumford eliminant and does not
      compute the degree of a Kummer ideal. Those are other proposals.
    - >-
      Fast-theta monomial support on a Rosenhain model in odd
      characteristic is H-ECDLP-e26a57. The metric here is a kernel
      count in characteristic 2.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For this ordinary surface, the characteristic polynomial of
        Frobenius on the etale group scheme A[2]^et of rank 2^2 is the
        separable factor T^2 + T + 1 of P(T) modulo 2. Equivalently,
        Frobenius acts on (Z/2)^2 by a matrix of order 3 with no
        eigenvalue 1.
      rigorous_support: >-
        p-rank is the rank of the largest etale quotient of A[p]. The
        Newton polygon of this P has slope 0 with multiplicity 2, which
        is the ordinary p-rank. For an ordinary abelian variety the
        unit-root factor of the characteristic polynomial modulo p is
        the characteristic polynomial of Frobenius on that etale
        quotient. The unit-root identification at p = 2 is the part
        treated as H1 rather than as a theorem checked in this session.
      validation_plan: >-
        Sample is the hit list of the 2048-pair enumeration, a complete
        finite set, not a random sample. Compare n2(F_2), n2(F_4),
        n2(F_8) with (1, 1, 4). Tail check: the same counter on the
        five elliptic classes over F_2, whose point counts are already
        listed as {1, 2, 3, 4, 5}. No transfer to dimension 5, to odd
        characteristic, or to order 131.
    - id: H2
      statement: >-
        Geometric points of A[2] are exactly the points of the etale
        quotient. The connected component of the identity in A[2]
        contributes the identity only.
      rigorous_support: >-
        A local finite group scheme over an algebraically closed field
        has a single point. This is the definition of local, applied
        to the connected kernel of A[2] -> A[2]^et.
      validation_plan: >-
        On each Jacobian hit, the kernel of [2] over F_{2^k} for
        k = 1, 2, 3 has size at most 4. A kernel of size greater than
        4 falsifies H2 on that model. The elliptic classes are the
        small-size check: their full rational groups have size at most
        5, so a reported kernel larger than the group is an instrument
        failure.
  target_complexity:
    time_exponent: >-
      Unchanged. Pollard rho remains Theta(N^{1/2}) group operations
      on a prime-order subgroup. This measurement does not state a
      new exponent.
    memory_exponent: >-
      Unchanged. The measurement stores one Jacobian up to a few
      hundred points. Rho memory stays the distinguished-point table.
    best_known: >-
      Pollard rho, exponent 1/2, and a Frobenius-invariant factor base
      that multiplies the number of systems by at most 1/n
      (KR-IC-b0fcda, opened). Characteristic-2 summation experiments
      remain slower than rho at the scales KR-IC-1fcdbc records.
    hidden_overhead: >-
      None in an o(1) term. The output is three kernel sizes and a
      hit count. No smoothness probability and no o(1) in an exponent.
    tradeoff_note: >-
      No time-memory tradeoff is claimed. Van Oorschot-Wiener
      interpolation is not used. The level-structure degree, if it
      equals 3, is an extension degree, not a memory exponent.
