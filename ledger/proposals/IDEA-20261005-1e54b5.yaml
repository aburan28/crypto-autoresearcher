idea:
  id: IDEA-20261005-1e54b5
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Field of definition of the etale 2-torsion on the order-19 abelian
    surface over F_2, the level structure a level-2 theta chart needs
  class: measurement
  claim: >-
    Let A be an abelian surface over F_2 in the isogeny class with
    Frobenius polynomial P(T) = T^4 + 3T^3 + 5T^2 + 6T + 4, so
    #A(F_2) = P(1) = 19. The Weil census through dimension 4 excludes
    rational points of order 131 and does not exclude this class.
    If a genus-2 model over F_2 realizes the class, the number n2(F_{2^d})
    of points Q with [2]Q = 0 is 1 over F_2, 1 over F_4, and 4 over F_8.
    Those four geometric points are the level structure a level-2 theta
    chart of a principal polarization asks for. A model search that
    returns no curve is a separate outcome: this class then has no
    genus-2 theta coordinates over F_2. No discrete-log exponent moves.
  mechanism: >-
    The named group is the g=2 class h = x^2 + 3x + 1, P(T) = T^4 +
    3T^3 + 5T^2 + 6T + 4, derived in IDEA-20260926-80209d as the unique
    ladder prime present at genus 2 over F_2. KN-OPEN-095df5 records
    that exact_targets.py finds no abelian variety over F_2 of dimension
    at most 4 whose point count is divisible by 131. Order 19 sits in
    the g=2 Weil range (ceiling 33) and is the survivor the order-131
    census did not rule out. Dimension 5 and 6 at order 131 are still
    unnamed polynomials; this class is a named group.
    Newton polygon of P, coefficients from the constant term, 2-adic
    valuations (2, 1, 0, 0, 0). The lower convex hull has a segment of
    slope -1 of horizontal length 2 and a segment of slope 0 of
    horizontal length 2, the ordinary slopes 0,0,1,1, so the p-rank is
    2. Reduction modulo 2 is T^2(T^2 + T + 1). The separable factor
    T^2 + T + 1 is the candidate characteristic polynomial of Frobenius
    on the etale quotient A[2]^et, a group scheme (Z/2)^2. Its companion
    in GL_2(F_2) satisfies F^2 = F + I and F^3 = I, and T = 1 is not a
    root (1+1+1 = 1 in F_2). So the only F_2-point and the only F_4-point
    of this (Z/2)^2 is the identity, and all four points are rational
    over F_8. Local group schemes contribute no further geometric points.
    A level-2 theta structure on a principally polarized surface needs a
    Lagrangian in the kernel of the polarization. For a principal
    polarization that kernel is A[2], and in characteristic 2 the
    geometric points of A[2] are exactly these etale points. The integer
    d where n2 jumps from 1 to 4 is the degree of that level structure.
    OBJECT FRAME. Representation of an elliptic point on a binary
    subfield curve stays the R1 x-coordinate. Representation of the
    auxiliary point is a level-2 theta coordinate of A, available over
    the field of the Lagrangian. Operation set Sigma is the Galois
    action of Frobenius on A[2]^et, together with translation by the
    order-19 point only as the Couveignes subgroup that makes the class
    relevant to RQ-FROB-7d8dd4. Sigma does not contain full translation
    on the target elliptic curve.
    TRICHOTOMY. Coordinate-dependent. The theta chart is defined over
    F_2 only when the Lagrangian is F_2-rational. The predicted counts
    say it is not.
    LOSSY-PROJECTION TEST against Sigma = <Frob> on A[2]^et. Discarded:
    the choice of basis of the three nonzero points. Retained: the orbit
    size, read as n2. The fibres of a point over its Frobenius orbit are
    a block system of <Frob>. Lossy: three distinct nonzero points share
    one orbit invariant. This is not a projection of the elliptic group
    under translation, and it is not the Kummer ideal degree.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-095df5
      provenance: internal
      claim: >-
        No abelian variety over F_2 of dimension 1 to 4 has 131 dividing
        its point count. The g=2 Weil ceiling stated there is 33.97.
        The dimension-48 norm-one torus is a different group and is not
        the object here.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-095df5.md
    - ref: IDEA-20260926-80209d
      provenance: internal
      claim: >-
        At genus 2 over F_2 the only ladder prime that occurs is 19,
        on the single class h = x^2 + 3x + 1, P(T) = T^4 + 3T^3 + 5T^2
        + 6T + 4, and a Jacobian model is decided by enumerating
        y^2 + h(x)y = f(x) with deg h <= 3 and deg f <= 6 (2048 pairs),
        selecting N_1 = 6 and N_2 = 6.
      verified_by: idea-generator, this session, via ledger/proposals/IDEA-20260926-80209d.yaml
    - ref: IDEA-20260905-40aa90
      provenance: internal
      claim: >-
        Fast-theta Kummer support for a genus-2 Jacobian in odd
        characteristic, owned with H-ECDLP-e26a57 by RQ-ECDLP-002.
