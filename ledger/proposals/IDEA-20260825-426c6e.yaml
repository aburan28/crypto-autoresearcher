  batch: EC-STRUCTURE-20260825
  cluster: 'C2-noncommutativity: where the quaternion analogy dies'
  title: 'NAME THE SUBPROBLEM INSTEAD OF THE BARRIER: define SECOND-EIGENSPACE-ACTION (given (E, P, kP)
    and a basis of E[M] for smooth M coprime to N, output kR), state the reduction ECDLP <= SECOND-EIGENSPACE-ACTION
    through the Kani/Robert embedding, and impose the interface condition that stops the reduction being
    circular'
  class: mechanism
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The SIDH-break machinery and its torsion-image input are published and recalled. The proposed
    contribution is the isolation of the torsion-ACTION deficit as a named subproblem with an anti-circularity
    interface, so the program has a concrete target with its own cost rather than a barrier.
  claim:
    semantic_part: The higher-dimensional isogeny toolbox recovers a secret isogeny from its action on
      a rank-2 torsion module of smooth order coprime to the degree; an ECDLP instance supplies the action
      of [k] on rank 1, so the exact missing input is the action on a second, independent torsion generator,
      and that input can be named, interfaced and costed as a subproblem.
    evaluator_part: 'Unestablished: that the reduction goes through as stated, that the interface condition
      is strong enough to prevent the trivial circular solution (compute k first, then kR), and that any
      nontrivial lower bound for the subproblem follows.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Define SECOND-EIGENSPACE-ACTION precisely, with M smooth, coprime to N, and with the field of definition
    of E[M] declared as part of the input size.
  - 'State the intended reduction: with kR and kS for a basis (R, S) of E[M], the map [k] is known on
    a rank-2 module, which is the shape the Kani/Robert embedding consumes; derive whether the embedding
    then yields k, and at what cost.'
  - 'Impose the anti-circularity interface: the subproblem solver receives (E, P, kP, R, S) and must output
    kR without ever being permitted to output k; any reduction that recovers k first is rejected as a
    non-reduction. Formalize this as an oracle-access restriction, not as a request.'
  - 'Cost the input honestly: E[M] rational only over an extension of degree depending on M, and the transport
    of the instance into that field, both charged before any comparison with rho.'
  - Report the outcome either as a genuine reduction with a stated cost, or as a proof that the interface
    cannot be satisfied -- which would be the sharpest form yet of the rank deficit.
  lossy_projection_test:
    tracked_object: the restriction of [k] to a torsion module of chosen rank
    what_is_discarded: the action of [k] on all other torsion
    propagation: deterministic and compatible with composition of isogenies
    verdict: 'PASSES: rank-2 restriction genuinely discards information about [k] elsewhere while remaining
      exactly propagable, which is why the toolbox can consume it.'
  predictions:
  - id: P1
    status: established_formula
    statement: '[k] acts on E[M] as the scalar k for every M, so the subproblem is well posed and its
      answer is unique.'
  - id: P2
    status: unestablished
    statement: Given kR and kS for a basis of E[M] with M smooth and coprime to N, the higher-dimensional
      embedding recovers k in time polynomial in log N and the input size.
  - id: P3
    status: unestablished
    statement: No solver satisfying the anti-circularity interface exists at cost below matched rho.
  minimal_discriminating_test:
    status: specified_not_run
    test: At toy scale with M = 2^a, supply kR and kS from a known k, run the embedding, and confirm k
      is recovered; then remove kS and confirm recovery fails, isolating the rank as the operative variable.
    pass: Recovery succeeds with rank 2 and fails with rank 1 across all tested instances.
    fail: Recovery succeeding with rank 1 would be a major positive and must be re-verified independently
      before any claim.
  controls:
  - Rank-1-only arm as the direct negative control (this is the actual ECDLP setting).
  - A random 'kR' not equal to the true one, to confirm the embedding rejects inconsistent torsion data
    rather than always succeeding.
  - An M sharing a factor with N, where the construction should degenerate.
  confounders:
  - Charging the extension degree of E[M] to nobody -- the commonest way this family is silently mispriced.
  - 'Circularity: a solver that internally computes k is not a solver.'
  - Smoothness of M interacts with the field of definition; the two cannot be chosen independently.
  falsification:
    semantic: A proof that any solver for the subproblem yields k, making the subproblem equivalent to
      ECDLP and the reduction vacuous.
    evaluator: An implementation error in the embedding scopes out that run only.
    not_falsification: Failure to implement the embedding.
  why_this_is_not_a_variant: 'IDEA-20260808-bba3dc budgets torsion RATIONALITY for this toolbox and IDEA-20260812-104e1a
    reports that the isogeny class supplies rank-2 rational N-torsion. Both concern which torsion is available.
    This record''s axis is different and orthogonal: what is known about the ACTION OF k on that torsion.
    Rational torsion the solver cannot evaluate k on does not feed the toolbox, which is why the two axes
    must be tracked separately.'
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No improvement. A named subproblem with an interface, which is a research target rather than
      a result.
    dominated_by:
    - Pollard rho on every realized end-to-end ECDLP cost in this ledger
    axes:
    - time
    - memory
    - preprocessing
    - queries
  estimated_cost: toy-scale embedding experiments; moderate implementation effort
