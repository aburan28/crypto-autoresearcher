idea:
  id: IDEA-20261006-783062
  question_id: RQ-ECTD-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The Vélu codomain of the unique rational 2-torsion keeps the
    point count and changes j
  class: control
  claim: >-
    Let E be y^2 = x^3 - 2x + 1. Let p be the smallest prime with
    p > 5 and p < 256 such that E is nonsingular over F_p and the
    cubic x^3 - 2x + 1 has exactly one root in F_p. Let T be the
    corresponding rational point of order 2. Let E2 be the codomain
    of the separable 2-isogeny with kernel {infinity, T}, given by
    Vélu's formulas. The claim is that #E2(F_p) equals #E(F_p) and
    that the j-invariant of E2 is not the j-invariant of E. No
    discrete logarithm is transferred. If no such prime exists below
    256, the claim is false.
  mechanism: >-
    The tracked object is the pair (group order, j-invariant) on E
    and on E2. The representation is the short-Weierstrass model.
    The operation is one Vélu 2-isogeny from the unique rational
    kernel, not a walk around an isogeny class. The pair is constant
    on isomorphic models of the same kernel. One-line reason: the
    kernel point determines the isogeny, and post-composing with an
    isomorphism does not change j or the group order. Lossy-projection
    test: the projection keeps two integers and one field element
    and discards the isogeny formula. This record asks whether the
    order is shared and whether j moves. It does not search for a
    secret endomorphism.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if
        they have the same number of points. This record checks
        that identity on one kernel.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs Omega of the square root of the
        group order. One isogeny is not a generic algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        Anomalous curves and small embedding degree are curve
        checks. This record does not classify either curve as weak.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
  assumptions:
    - Exactly one rational root of the cubic means exactly one rational point of order 2.
    - Vélu's formulas are applied to that kernel and to no other kernel.
    - The prime is greater than 3, so the short-Weierstrass model is separable.
  predictions:
    - metric: absolute difference of the two group orders
      direction: lower
      minimum_effect: exactly 0
    - metric: indicator that the two j-invariants differ
      direction: higher
      minimum_effect: exactly 1
  minimal_test:
    design: >-
      Search primes from 7 up to 255. Take the least p at which the
      cubic has exactly one root in F_p and the discriminant of E
      is nonzero. Build T. Apply Vélu's formulas. Point-count E and
      E2. Compare the orders and the j-invariants. Record p, the
      root, both orders, and both j-invariants.
    controls:
      - >-
        T has order 2: doubling T in the group law returns infinity.
        Any other result voids the kernel.
      - >-
        A prime whose cubic has three roots is not the instance.
        Scoring one voids the run.
      - >-
        The same Vélu formulas on a kernel point that is not 2-torsion
        must be refused. Silent acceptance voids the run.
    required_metrics:
      - p and the unique root
      - #E(F_p) and #E2(F_p)
      - j(E) and j(E2)
  falsification_conditions:
    - The instance exists and the two group orders differ.
    - The instance exists and the two j-invariants are equal.
    - No prime below 256 has exactly one rational root.
  confounders:
    - >-
      An isomorphic model of E2 with a different equation can look
      like a new j if j is computed from the wrong coefficients.
    - >-
      Using a 2-isogeny formula for a kernel of order ell > 2
      changes the codomain and is not this test.
    - >-
      Point-counting only E and copying the integer onto E2 makes
      the orders agree by construction and voids the comparison.
  interpretation_limits:
    - >-
      Equal orders at one prime do not produce a trapdoor and do
      not find a weaker curve. KR-RHO-755e35 already says the group
      order is an isogeny-class invariant.
    - >-
      A different j with the same order is still the same class.
      It is not an endpoint-specific weakness.
    - >-
      The rho exponent stays 1/2. No walk is timed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Vélu's formulas, applied to the unique rational point of
        order 2, produce a separable isogeny defined over F_p.
        The codomain then has the same number of rational points
        as E, and its j-invariant differs from j(E) at the least
        eligible prime. The second clause is the part that can
        fail when the isogeny is a loop in the volcano.
      rigorous_support: >-
        KR-RHO-755e35, opened in this session, states that isogenous
        curves share the group order. It does not compute this
        codomain. No file opened here proves that j moves at the
        prime the search returns. Vélu's formulas are recalled and
        are not a citation.
      validation_plan: >-
        The quantity sampled is the pair of orders and the pair of
        j-invariants at one prime, one kernel. The comparison is
        the order difference against 0 and the j-difference against
        inequality. The tail check is whether the absolute order
        difference exceeds 0. The parameter is p < 256. Transfer
        assumption: none.
  target_complexity:
    time_exponent: >-
      unchanged at 1/2, from KR-RHO-13bf67. One 2-isogeny does not
      change the generic cost of a discrete logarithm on either
      curve.
    memory_exponent: >-
      unchanged. The test stores two curve models and two group
      orders.
    best_known: >-
      KR-RHO-755e35, the shared group order of isogenous curves.
      That row is not improved.
    hidden_overhead: >-
      None. No o(1) in an exponent is claimed. Two integers and
      two j-invariants are not a complexity.
    tradeoff_note: >-
      No time-memory tradeoff. A shared order does not shrink a
      distinguished-point table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-RHO-53c89f
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          The row says isogenous curves share the group order and
          that a walk does not reach a different weakness class.
          This record checks one Vélu codomain at one prime below
          256 and also predicts that j changes. The exponent delta
          is zero.
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: orthogonal
        delta: >-
          The row classifies anomalous curves and small embedding
          degree as curve checks. This record does not compute an
          embedding degree and does not test trace one. The
          exponent delta is zero.
    searched:
      corpus_grep:
        - Vélu codomain
        - y^2 = x^3 - 2x + 1
        - question_id: RQ-ECTD-001
      web: []
      blocked: []
  dominated_by: >-
    Dominated as an algorithm by Pollard rho at exponent 1/2
    (KR-RHO-13bf67). KR-RHO-755e35 already identifies the shared
    group order. One codomain does not beat either row.
  sota_delta: >-
    Zero change to the 1/2 exponent. The predicted gap is an order
    difference of 0 together with unequal j-invariants, on one
    prime below 256.
  proof_search_map:
    not_applicable_reason: >-
      This is one isogeny at one prime. It does not propose a
      trapdoor theorem, a complexity bound, or a closure of
      isogeny-class invariants.
