idea:
  id: IDEA-20260905-4b801d
  title: Branch-stratum localization of exceptional relation multiplicity
  class: mechanism
  claim: 'An exceptional relation-rate effect can survive identical generic monodromy only if the chosen factor
    base meets branch or collision strata with a different weight. Conjecture: a stratified intersection certificate
    explains all low-arity excess in a declared family, or isolates a residual away from every named degeneracy.'
  mechanism: Monodromy controls fibers over an open base; relation samplers may concentrate on the removed divisor
    or on its intersections with coordinate constraints. Decompose the parameter space into smooth generic locus,
    simple branch locus, intersections and repeated-summand loci. Count relation multiplicity separately on each,
    with automorphism and rational 2-torsion data kept explicit. A putative CM exception then has to alter a certified
    stratum weight or exhibit a residual in the open locus. This converts exceptional-locus geometry into a resource
    map without treating generic fullness as a global impossibility statement.
  question_id: RQ-MONO-001
