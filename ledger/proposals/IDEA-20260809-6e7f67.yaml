idea:
  id: IDEA-20260809-6e7f67
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    Certified class group structure at small CSIDH-like parameters, because the
    models assume properties of a group nobody in this program has computed
  class: measurement
  claim: >-
    Every cost model here assumes structural facts about the acting class group —
    its order, its cyclicity or near-cyclicity, the distribution of exponent
    vectors representing its elements. The claim is that these can be computed
    exactly and certified at small parameters, that the computed structure can be
    compared against the models' assumptions, and that at least one commonly
    assumed property is only approximately true at reachable sizes, with a
    measurable deviation.
  mechanism: >-
    Compute the class group of the relevant imaginary quadratic order at small
    discriminants with a certified algorithm, emit generators and relations as a
    certificate, and compare the observed structure against each model's stated
    assumption.
  why_not_a_renamed_known_approach: >-
    Class group computation is classical and routine. Using it as an ASSUMPTION
    AUDIT for a quantum cost model — checking the model's structural premises
    rather than its arithmetic — is the transfer, and it is cheap.
  predictions:
  - observable: computed group structure versus assumed structure
    metric: categorical agreement per assumption, per parameter size
    predicted: >-
      Agreement on order-of-magnitude facts, deviation on at least one finer
      assumption such as exact cyclicity or exponent-vector distribution.
  - observable: certificate verification
    metric: independent checker accepts generators and relations
    predicted: Accepts; otherwise nothing is recorded.
  minimal_test: >-
    Three small discriminants, class groups computed and certified, structural
    quantities extracted and compared against the assumptions in the filed
    analyses.
  controls:
  - 'KNOWN-VALUE CONTROL: at discriminants with published class numbers, the computation must agree exactly.'
  - 'INDEPENDENT CERTIFICATE CHECK: relations verified by a checker sharing no code with the computation.'
  falsification_conditions:
  - Computed class numbers disagree with published values at control discriminants.
  - Model assumptions are stated too loosely in the filed text to be compared, which is recorded as undetermined.
  interpretation_limits: >-
    Structure at small discriminants need not hold at CSIDH parameters, and the
    record states the extrapolation gap explicitly rather than implying transfer.
  sota_delta: 'No verdict. Delta: an audited structural premise where the models state assumptions.'
  dominated_by: Not dominated by any corpus record; GOAL-CLGRP-001 computes class groups for a different question and its results may not be cited here as evidence.
  estimated_cost: Implementation medium; compute moderate.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for class group: GOAL-CLGRP-001 only, different question. WEB NOT CHECKED.'
  source_refs:
  - CSIDH specification and class group algorithm references -- REQUIRED READS.
