idea:
  id: IDEA-20260823-6284e8
  record_type: proposal
  added: "2026-08-23"
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-90fff7
  task_id: TASK-20260823-9ccc23
  role: idea-generator
  title: Elliptic-coordinate character windows as a lossy symbolic dynamical object
  class: mechanism
  claim: >-
    Conditional research proposal only; the exact possible bound and every
    unproved dependency remain solely those already stated in
    conditional_complexity_claim, and no algorithm or improvement is
    established.
  mechanism: >-
    The proposed mechanism is exactly the composition already specified by
    lossy_object, public_evaluation, one_step_propagation, and target_decoder;
    their existing current_gap and falsification fields remain controlling.
  proposal_status: unverified
  novelty_status: unverified
  novelty_note: >-
    No retrieved source establishes the proposed source-independent compressed
    locator or a sub-rho ECDLP decoder from this object. The closest retrieved
    literature concerns pseudorandomness measures of coordinate-character
    sequences, not the required locator theorem.
  claim_boundary:
    allowed: >-
      This record defines a falsifiable object-first research mechanism and cheap
      proof-search audits.
    disallowed:
      - implementation claim
      - experiment claim
      - asymptotic improvement claim
      - hypothesis status change
      - novelty claim
      - breakthrough claim
  problem:
    group: prime-order subgroup generated by P on an elliptic curve over a prime field
    order_symbol: N
    target: Q equals scalar multiplication of x and P, with x in integers modulo N
    excluded_lenses:
      - automorphism-orbit canonicalization
      - smoothness and index-calculus relations
      - interval-only discrete logarithm
      - classical Pollard rho and baby-step giant-step repackaging
      - hidden pairing or field-discrete-log transfer
  lossy_object:
    name: coordinate-character window
    definition: >-
      For a fixed public nonconstant rational function f on E, a public
      multiplicative character chi of the prime field, and a public window length
      m, define W_m(R) as the ordered tuple
      (chi(f(R)), chi(f(R+P)), ..., chi(f(R+(m-1)P))).
    parameter_range:
      window_length: polylogarithmic in N for the first audit
      rational_function_degree: fixed independently of N
      field: prime
    discarded_information: >-
      Each symbol retains only a character class of a coordinate-derived field
      value. Coordinates, signs beyond the selected character, and the scalar
      index of R are discarded. Many group points can share one window.
    lossiness_argument: >-
      The codomain has at most kappa^m symbols for a character of order kappa.
      For m below log base kappa of N, pigeonhole collisions are forced; for
      larger polylogarithmic m, collision behavior is an explicit audit rather
      than assumed injectivity.
  public_evaluation:
    inputs: [curve_parameters, P, R, f, chi, m]
    method: compute the m public translates and evaluate f and chi
    charged_cost:
      time: O(m) group additions plus O(m) field and character evaluations
      memory: O(m) symbols
      data_queries: m public evaluations
    forbidden_assistance:
      - scalar of R
      - DLP oracle
      - target-trained advice
      - precomputed table whose construction is not charged
  one_step_propagation:
    exact_relation: >-
      W_m(R+P) is the left shift of W_m(R) followed by the new boundary symbol
      chi(f(R+mP)).
    missing_state: >-
      The new boundary symbol is not determined by W_m(R) in general. A closed
      finite-state rule would require a source-independent grammar or bounded
      ambiguity theorem that is presently absent.
    collision_test: >-
      Search for R and R' with equal W_m values but different next boundary
      symbols. One such pair falsifies deterministic propagation at that m.
  target_decoder:
    required_statement: >-
      Given W_m(P) as the source signature and W_m(Q), locate x in Z/NZ with
      fewer than N^(1/2-o(1)) charged operations, without enumerating the orbit or
      using target-specific preprocessing.
    candidate_mechanism: >-
      A source-independent compressed substring locator for the cyclic symbolic
      word generated by j mapping to chi(f(jP)).
    current_gap: >-
      Exact target location from a generic cyclic word costs a full length-N
      index, a linear scan, or a generic collision search. No retrieved theorem
      supplies the required compressed locator.
    verification: verify the returned x by checking scalar multiplication of x and P equals Q
  conditional_complexity_claim:
    statement: >-
      If a public, source-independent grammar of size at most N^(1/3+o(1)) for
      the full cyclic word can be constructed in N^(1/3+o(1)) time and memory,
      and if arbitrary length-m substring locations can be recovered from it in
      N^(1/3+o(1)) time with constant success probability, then ECDLP admits the
      same conditional time and memory bound through this object.
    status: unverified
    heuristic_dependencies:
      - id: H-CW-1
        statement: the orbit word has a public grammar with the stated size and construction cost
        falsification: incompressibility lower bound or measured grammar size N^(1-o(1))
      - id: H-CW-2
        statement: the target window has a unique or bounded-size location list recoverable within the stated cost
        falsification: superpolynomial ambiguity in m or locator construction reverting to full enumeration
  predictions:
    - >-
      Exact next-symbol collisions will persist for short m unless the curve and
      f have a special finite-state factor.
    - >-
      Any valid sub-rho decoder must expose a reusable, source-independent
      compression theorem rather than a target-trained table.
  minimal_discriminating_tests:
    - id: CW-AUDIT-BASELINE
      type: static
      action: reproduce exact rho and BSGS accounting before comparing the candidate
      pass_condition: all preprocessing, retries, memory, and verification are charged
    - id: CW-AUDIT-COLLISION
      type: proposed_experiment
      action: enumerate small auditable groups and find equal windows with unequal successors
      control: random cyclic words with the same alphabet and length
      falsification: one observation collision refutes deterministic propagation at the tested parameters
    - id: CW-AUDIT-LOCATOR
      type: proof_search
      action: attempt a source-independent grammar and prove construction and query bounds
      falsification: construction requires Omega(N^(1/2)) time, memory, data, or target-specific advice
    - id: CW-AUDIT-NEARBY
      type: static_control
      action: apply the same proof outline to a random cyclic word where compression is known not to follow from group law
      falsification: an outline that still proves compression has hidden structure or an invalid inference
  falsification_criteria:
    mechanism:
      - deterministic propagation fails through an observation collision
      - the locator needs a full orbit table or generic collision search
      - the compressed index is target-trained
    conditional_claim:
      - either H-CW-1 or H-CW-2 fails
      - charged time or memory reaches N^(1/2-o(1))
  confounders:
    - character value at a pole or zero needs an explicit sentinel convention
    - short-period artifacts from exceptional curve or function choices
    - accidental automorphisms may make the object an excluded orbit quotient
    - target uniqueness on small groups may not transfer asymptotically
  interpretation_limits:
    - A failed short-window audit does not rule out longer windows or special public factors.
    - Passing small collision tests does not prove a grammar or a sub-rho decoder.
    - Character-sequence pseudorandomness results do not by themselves prove locator hardness.
    - This proposal is not evidence for an ECDLP improvement.
  cost_model:
    baseline:
      pollard_rho:
        time: N^(1/2+o(1)) group operations
        memory: O(1) serial state, with parallel coordination charged separately
        data_queries: none beyond public group operations
      baby_step_giant_step:
        time: N^(1/2+o(1)) group operations
        memory: N^(1/2+o(1)) stored group elements
        data_queries: none beyond public group operations
    candidate_charges:
      preprocessing: grammar or index construction, fully charged
      enumeration: every orbit or substring sample, fully charged
      linear_algebra: none currently specified; any later use is fully charged
      target_descent: substring-location recovery, fully charged
      retries: inverse success probability times per-attempt cost
      verification: one scalar multiplication and equality test per candidate
      memory: grammar, locator, collision lists, and working state
      data_queries: all character and group evaluations
      parallelism: total work and aggregate memory, not wall time alone
      multi_target: single-target is primary; amortization must disclose number and target independence
    present_bound: >-
      Public evaluation is polylogarithmic per point, but known exact location
      routes require N storage/scan or generic N^(1/2) collision work. Therefore
      no sub-rho end-to-end bound is established.
  pareto:
    comparison_axes: [time, memory, data_queries]
    dominated_by:
      - Pollard rho dominates the current full-index or linear-scan realization in time and memory.
      - BSGS dominates any N-by-N full target table at the single-target level.
    sota_delta:
      time_exponent: unknown
      memory_exponent: unknown
      data_query_exponent: unknown
      statement: >-
        The only potentially favorable point is conditional on two unproved
        compression and locator statements; unknown axes remain incomparable.
    checked_rows:
      - Pollard rho
      - baby-step giant-step
  proof_search_map:
    target_statement: >-
      A source-independent compressed locator for coordinate-character windows
      yields a sub-rho ECDLP decoder.
    lemma_dependencies:
      - id: CW-L1
        responsibility: lossiness and collision multiplicity of W_m
      - id: CW-L2
        responsibility: exact shift relation and boundary ambiguity
      - id: CW-L3
        responsibility: grammar construction size, runtime, and memory
      - id: CW-L4
        responsibility: target-location correctness and success probability
      - id: CW-L5
        responsibility: end-to-end cost equals per-attempt cost times inverse success probability
    audits:
      exact_baseline_reproduction:
        status: specified_not_run
        requirement: reproduce rho and BSGS with all charges
      observation_collision_search:
        status: specified_not_run
        requirement: equal W_m with different next symbol
      quantifier_order:
        status: specified_not_run
        statement: >-
          There exists one public preprocessing algorithm depending only on
          curve parameters, P, f, chi, and m such that for every target Q it
          returns the correct location list within the stated bound.
      method_ceiling:
        status: specified_not_run
        nearby_object_control: random cyclic word over the same alphabet
        ceiling: absent a grammar theorem, exact location reverts to scan, table, or generic collision search
  citations:
    - citation: >-
        V. Shoup, Lower Bounds for Discrete Logarithms and Related Problems,
        EUROCRYPT 1997.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://www.shoup.net/papers/dlbounds1.pdf
      supports: generic-group square-root baseline and the need for non-generic exploitable structure
    - citation: >-
        I. Shparlinski et al., On the Elliptic Curve Character Sequence and Its
        Pseudorandomness Measures, IACR ePrint 2007/275.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://eprint.iacr.org/2007/275.pdf
      supports: existence and studied distributional behavior of coordinate-character sequences
    - citation: >-
        J. H. Silverman, Common Divisors of Elliptic Divisibility Sequences over
        Function Fields, arXiv math/0404412.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://arxiv.org/abs/math/0404412
      supports: finite-field periodicity context for division-polynomial sequences, not this locator
  safety:
    defensive_purpose: assess whether prime-field ECDLP assumptions need revision
    implementation_created: false
    experiment_runs: 0
