idea:
  id: IDEA-20260805-bd8339
  question_id: RQ-QRUOV-001
  added: '2026-08-05'
  goal_id: GOAL-QRUOV-001
  title: >-
    The factorization type of the quotient polynomial IS the QR-UOV security
    exponent: a publicly computable CRT split of the block algebra, the exact
    rank spectrum it induces, and a closed-form weak-quotient-polynomial density
  class: mechanism

  claim: >-
    For a QR-UOV-shaped key over the quotient ring A = F_q[t]/(f), deg f = ell,
    the exponent of every structure-respecting key-recovery attack is governed
    not by ell but by d_max(f), the largest degree among the DISTINCT irreducible
    factors of f. Derivation below and machine-checked at toy sizes: the
    idempotents of A are computable from f alone -- f is a PUBLIC parameter --
    and the associated change of basis simultaneously block-diagonalises EVERY
    matrix of the block algebra A_f = W*phi(A) and, because the symmetriser W is
    the Gram matrix of an associative form, is orthogonal across CRT components.
    A QR-UOV instance with reducible f therefore splits, at cost O~(ell^2 + n^2)
    of public preprocessing, into one independent QR-UOV instance per irreducible
    factor, and the secret oil A-module splits with it. The Kipnis-Shamir /
    reconciliation exponent consequently falls from ell*(V-M) to d_max*(V-M).
    Two exact consequences, both computed before any run: (i) the density of
    monic degree-ell f that are NOT weak in this sense is exactly I_q(ell)/q^ell
    ~ 1/ell -- so a uniformly drawn quotient polynomial is weak with probability
    0.66669 at ell=3 and 0.80000 at ell=5 over q=127; (ii) under a uniform f the
    expected exponent factor E[d_max]/ell is 0.72090 at (q=127, ell=3) and
    0.68485 at (q=127, ell=5), i.e. ~28-32 per cent of the log_q attack exponent
    is lost on average. Separately derived and exhaustively checked: the
    symmetriser W EXISTS AND IS INVERTIBLE FOR EVERY monic f, including
    non-squarefree f, because F_q[t]/(f) is a Frobenius algebra. Nothing in the
    well-definedness of the compression rejects a weak f. Irreducibility, if the
    specification requires it, is therefore a LOAD-BEARING and separately
    enforced condition, not a convenience -- and a key generator that omits the
    test emits a fully functional, verifiable, weaker key.

  object_first_candidate:
    tracked_object: >-
      The CORANK of the multiplication operator: corank phi(a) = deg gcd(a, f),
      equivalently the lattice of ideals of the finite F_q-algebra A, carried as
      the multiset of local factors {(deg p_i, e_i)} of f. It is followed from
      the public parameter f, through the block algebra A_f inside
      Sym_ell(F_q), into every block of every public matrix, into the secret oil
      A-module, and out into the linear algebra of whatever key-recovery attack
      is run. It is a property of the REPRESENTATION, not of the key, which is
      why the attacker gets it for free.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens for this proposal: direct/Groebner attack on
      the public system; Kipnis-Shamir as a mechanism; reconciliation; Beullens'
      intersection attack; rectangular MinRank and support-minors modelling;
      quantum Grover/quantum-MinRank speedups; side-channel, fault and
      implementation attacks; lattice reduction of any kind. Kipnis-Shamir and
      reconciliation appear here ONLY as the cost yardstick against which the
      split is measured -- they are the denominator, never the mechanism. This
      restriction is what stops the proposal from regressing into "MinRank again,
      in new notation", which is the failure mode the inventor protocol section 1
      names.
    newness_score: >-
      The individual ingredients are elementary and certainly known to anyone who
      has thought about F_q[t]/(f): CRT, the Frobenius/residue pairing, and
      rank phi(a) = ell - deg gcd(a,f). What is not known to THIS corpus, and
      what is asserted to be assembled here for the first time in it, is the
      composite statement -- that the three together turn the factorization type
      of a public parameter into a security EXPONENT with an exactly computable
      density. The largest novelty risk is stated plainly under dominated_by: the
      QR-UOV papers have NOT been read by this program, and it is entirely
      possible their own security analysis says exactly this. Establishing that
      is stage 0 of the experiment, not an assumption of the proposal.
    testability_score: >-
      Very high and almost free. Two of the three lemmas were verified
      exhaustively by pure-Python enumeration while this record was written
      (414,582 (f, a) cells, zero failures; see mechanism). The remaining claim --
      that the split reduces measured attack cost -- is a toy-scale measurement at
      q in {7, 11}, ell <= 6, M in {2, 3}, V - M in {1, 2}, well inside a
      single-digit-minutes budget with no algebra system required.
    survival_score: >-
      The structural half survives to arbitrary parameters: CRT and the rank law
      are exact algebra with no size dependence, so if they hold at ell=4 they
      hold at ell=1024. The COST half survives only as far as the recalled
      Kipnis-Shamir exponent is correct and as far as the radical-lifting step for
      repeated factors is cheap -- the second of which is NOT derived here and is
      carried as an open proof obligation. The scope that survives to a deployed
      claim is narrower still and is bounded by whether the specification pins f.

  mechanism: >-
    NOTATION AND WHAT IS RECALLED. Write A = F_q[t]/(f) with f monic of degree
    ell, phi: A -> F_q^{ell x ell} the regular representation (multiplication
    matrices in the basis 1, t, ..., t^{ell-1}), N = V + M, n = N*ell, m = M*ell.
    The QR-UOV shape assumed throughout is: public matrices are n x n symmetric
    F_q-matrices partitioned into N x N blocks of size ell, every block lying in
    A_f = {W*phi(a) : a in A} for one fixed invertible symmetriser W; the secret
    oil space O is an A-submodule of A^N of A-rank M. THIS SHAPE IS RECALLED,
    UNVERIFIED. The QR-UOV specification has not been read by this program
    (RQ-QRUOV-001 records the same limitation), and pinning it down is stage 0 of
    the paired experiment. Everything below is stated as a theorem about the shape
    as just defined, and transfers to the submitted scheme only to the extent
    stage 0 confirms the shape.

    LEMMA 1 (the symmetriser exists for EVERY f; DERIVED HERE AND CHECKED).
    Define B(x, y) = the coefficient of t^{ell-1} in (x*y mod f). B is
    F_q-bilinear, symmetric, and ASSOCIATIVE in the sense B(a*x, y) = B(x, a*y),
    because it depends on the product x*y only. B is NONDEGENERATE for every
    monic f: given x != 0 of degree d < ell, take y = t^{ell-1-d}; then x*y has
    degree exactly ell-1, is already reduced, and its leading coefficient is that
    of x, so B(x, y) != 0. Let W be the Gram matrix of B, i.e.
    W_{ij} = coeff_{ell-1}(t^{i+j} mod f) -- a Hankel matrix. Then W is
    invertible, and W*phi(a) is the Gram matrix of (x, y) -> B(a*x, y), which is
    symmetric by symmetry plus associativity of B. CONSEQUENCE, AND THE POINT:
    the compression is well defined for EVERY monic f, squarefree or not,
    irreducible or not. This is not an accident of the construction; A is a
    complete intersection, hence Gorenstein, hence Frobenius, so a nondegenerate
    associative form always exists. WELL-DEFINEDNESS SELECTS NOTHING. Any
    protection against a weak f must be an explicit, separately enforced test.

    LEMMA 2 (rank law; DERIVED HERE AND CHECKED). rank_{F_q}(W*phi(a)) =
    ell - deg gcd(a, f). Proof: W is invertible so rank(W*phi(a)) = rank(phi(a));
    ker phi(a) = Ann_A(a) = {x : a*x = 0 mod f} = (f/g)*A with g = gcd(a, f),
    which is an F_q-space of dimension deg g. Counting corollary, exact: for each
    monic divisor g of f, #{a in A : gcd(a,f) = g} = Phi(f/g) :=
    |(A/(f/g))^x| = q^{deg(f/g)} * prod_{p | f/g} (1 - q^{-deg p}), and these sum
    to q^ell. Hence the RANK SPECTRUM of the block algebra A_f is determined by f
    alone. For f irreducible the spectrum is {0 once, ell everywhere else}: THERE
    ARE NO LOW-RANK ELEMENTS AT ALL. For f with an irreducible factor of degree
    d, A_f contains nonzero matrices of rank exactly d, publicly, for free, with
    no search. Whether a MinRank-style attack can consume them is a separate
    question this proposal does NOT claim to have answered; what is claimed is
    that their availability is a closed-form function of the factorization type.

    LEMMA 3 (the split; DERIVED HERE AND CHECKED). Let f = prod_i p_i^{e_i} with
    the p_i distinct irreducibles, and set f_i = p_i^{e_i}, ell_i = deg f_i. CRT
    gives A = (+)_i A_i with A_i = F_q[t]/(f_i), realised by idempotents e_i
    obtained from one extended-Euclid computation on f -- O~(ell^2) F_q-
    operations, from the PUBLIC parameter, before any key is seen. Two facts make
    the split total rather than partial. (a) The idempotents are central, so the
    change of basis C carrying the standard basis of A to a CRT-adapted basis
    conjugates every phi(a) into block-diagonal form simultaneously, for all a at
    once. (b) B is orthogonal across components: B(e_i*x, e_j*y) =
    coeff_{ell-1}(e_i*e_j*x*y mod f) = 0 for i != j, because e_i*e_j = 0. Hence
    C^T W C is block-diagonal as well, and therefore C^T (W phi(a)) C is
    block-diagonal for every a. Applying C blockwise, i.e. C^{(+)N}, to a public
    matrix carries it to a direct sum of matrices of the SAME QR-UOV shape with
    ell replaced by ell_i and (V, M) unchanged. Restricted to each summand the
    form B_i is again nondegenerate and associative, so each summand is a genuine
    QR-UOV instance over A_i and not a degenerate remnant.

    LEMMA 4 (the secret splits too). O is an A-submodule of A^N, so
    O = (+)_i e_i*O with e_i*O an A_i-submodule of A_i^N; and if O is free of
    A-rank M then e_i*O is free of A_i-rank M. Recovering O is therefore exactly
    the k independent problems of recovering e_i*O, with no coupling: the
    attacker solves them separately and reassembles by CRT. Isotropy transfers
    unchanged because the pairing decomposes orthogonally.

    COST BOOKKEEPING (per-attempt cost x inverse success probability). For a
    squarefree component (e_i = 1), A_i = F_{q^{ell_i}} is a field and the
    component is a UOV instance over F_{q^{ell_i}} with N variables and oil
    dimension M. RECALLED, UNVERIFIED: the Kipnis-Shamir / reconciliation
    key-recovery cost for UOV over a field F with n' variables and m' equations,
    n' >= 3m', is |F|^{n' - 2m'} times a polynomial factor. Here n' - 2m' =
    N - 2M = V - M, so the component costs q^{ell_i (V-M)} * poly. Total
    sum_i q^{ell_i (V-M)} = q^{d_max^{*}(V-M)} * (1 + o(1)) where d_max^{*} =
    max_i ell_i. For a repeated factor (e_i > 1), A_i is local with radical
    rad = (p_i)/(p_i^{e_i}); reduction mod rad is a further public linear map
    onto F_{q^{deg p_i}}, and recovering the image of e_i*O there costs
    q^{deg p_i (V-M)}. THE LIFT FROM MOD-RAD TO MOD-p_i^{e_i} IS NOT DERIVED
    HERE. It is plausibly a linear-algebraic Hensel step, and it is recorded as
    an open proof obligation rather than assumed, so the conservative statement
    of the mechanism uses d_max = max over DISTINCT irreducible factors only when
    that lift is confirmed cheap, and max_i ell_i (prime powers kept whole)
    otherwise. Both variants are pre-registered and the experiment reports which
    holds.

    FORCED VALUES, ALL COMPUTED BEFORE ANY RUN AND NONE OF THEM FITTED. Number of
    monic irreducibles I_q(ell) = (1/ell) sum_{d | ell} mu(d) q^{ell/d}. Density
    of non-weak (= irreducible) f is I_q(ell)/q^ell: 0.33331 at (q=127, ell=3),
    0.20000 at (127, 5), 0.16667 at (127, 6), 0.12500 at (127, 8); at q=256,
    0.33333 / 0.20000 / 0.16667 / 0.12500 for the same ell. Weak density is the
    complement: 0.66669, 0.80000, 0.83333, 0.87500. Expected exponent factor
    E[d_max]/ell under uniform monic f: 0.72090 at (127, 3), 0.69740 at (127, 4),
    0.68485 at (127, 5), 0.67381 at (127, 6), 0.66202 at (127, 8). Full
    distribution of d_max at (q=127, ell=5): P(1) = 0.0090, P(2) = 0.2077,
    P(3) = 0.3333, P(4) = 0.2500, P(5) = 0.2000. These come from an exact
    generating-function count, [z^ell] prod_{j <= d} (1 - z^j)^{-I_q(j)}, in
    integer arithmetic.

    PROVENANCE OF THE CHECKS RUN WHILE WRITING THIS RECORD. Lemmas 1 and 2 were
    verified by exhaustive pure-Python enumeration over q in {2, 3, 5} and
    ell in {2, 3, 4} with q^ell <= 700, ALL monic f of degree ell and ALL a in A:
    414,582 (f, a) cells, with zero failures of W-invertibility, zero failures of
    symmetry of W*phi(a), and zero failures of the rank law. Lemma 3 was verified
    at q=5, ell=4, f = (t^2+t+1)(t^2+2), over 200 random a: exact block
    diagonalisation in the idempotent-adapted basis, zero failures. THESE ARE
    GENERATION-SESSION COMPUTATIONS RUN OUTSIDE THE HARNESS, WITH NO RUN RECORD,
    NO MANIFEST AND NO SEED ARCHIVE. They are reported here as the reason the
    proposal is worth running, and they are NOT evidence. Re-running them
    in-harness with receipts is stage 1 of the paired experiment, and stage 1 is
    the cheapest gate that can terminate the whole line.

