idea:
  id: IDEA-20260926-d1adfc
  question_id: RQ-ICPERF-94c86e
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    PER-ATTEMPT COST DISTRIBUTION COLUMNS FOR THE BOUNDARY TABLE (CV,
    max/median, Hill tail index with interval, censored fraction, sat and
    unsat separately), populated first by zero-run re-analysis of committed
    rows: the 687 msolve per-target timings of engines-20260924 and the
    per-instance closure timings of RUN-CERTBIN-c417e0 and RUN-CERTBIN-a3fc60,
    with the Groebner sat/unsat asymmetry as the discriminating reading
  class: measurement

  claim: >-
    CEILING FIRST. No exponent, no attack. Representation R1; the attack
    stage is the PER-ATTEMPT DECOMPOSITION ORACLE; the quantity added is the
    SHAPE of its cost distribution, which every mean-based column in this
    program discards. Target arity: m in {2, 3} on the committed data; the
    columns are m-agnostic and cannot move a row.

    THE GAP. RQ-ICPERF-94c86e's constraints already require SAT and UNSAT
    reported separately and forbid reading a timeout as evidence, but its
    decision target asks only for "the measured cost of each phase" -- a
    location, not a distribution. The review of IDEA-20260922-793fd8 derived
    that a restart portfolio against rho can only pay if the per-attempt
    tail index alpha is at most 1 (infinite mean), not merely CV above 1,
    and closed the portfolio; its successor_seam asked that the boundary
    table carry per-attempt distribution columns "as bycatch of every cell,
    because a measured alpha <= 1 anywhere would matter to attempt-cap
    design (IDEA-20260805-45bf55)". IDEA-20260805-45bf55 showed that a fixed
    attempt cap drives a fitted exponent to 0 or 1 depending on which
    aggregate is charged when the censoring fraction is unreported. No cell
    in the corpus reports CV, a tail index or a censoring fraction. The
    columns are cheap and the data to populate them ALREADY EXISTS on main.

    THE COLUMNS, DEFINED. Per (cell, engine, arm in {sat, unsat}): (c1) CV =
    standard deviation over mean of the per-attempt cost in the cell's
    primary unit (or wall-clock where that is all that was archived, flagged
    secondary); (c2) max/median; (c3) alpha_Hill, the Hill estimator on the
    upper 20 percent order statistics, with a 10^4-resample bootstrap 95
    percent interval; (c4) censored fraction = attempts that hit a watchdog,
    a memory cap or a solver failure, NEVER placed in the denominator of a
    mean; when it is nonzero the mean is reported as a lower bound and the
    median only if the censored count is below half the sample. A pooled
    sat+unsat row is never emitted (composition artifact, per the question's
    own constraint).

    THE DATA THAT EXISTS, AND WHAT IT CAN DECIDE. ARM A (prime field, m = 2
    and 3, msolve 0.6.5): src/crypto_autoresearcher/index_calculus/results/
    engines-20260924.jsonl.gz, 687 per-target rows with fields msolve_seconds,
    msolve_net_seconds, msolve_status, enum_decomps, planted, fb, fb_size, m
    (field list from __main__.py _engines_task, read this session); README
    section 2 reports 417 targets with a decomposition and 2 censored at 900
    s. The sat arm is enum_decomps > 0, the unsat arm enum_decomps = 0,
    decided by exhaustive enumeration, never by the engine. ARM B (binary,
    m = 2, degree-4 closures): RUN-CERTBIN-c417e0 closures.jsonl.gz carries
    rec.wall_seconds per instance for W_4 and M_5 on U62, S62, C20 and the
    null sets (driver.py closure_set, read this session), and RUN-CERTBIN-
    a3fc60 carries the n = 19 analogue on 400 unsat, 300 sat and the null
    families. No operation counter was archived, so arm B's primary unit is
    wall-clock on the recorded host, flagged secondary; the word-operation
    unit of IDEA-20260926-c98e92 (this lane) is the successor.

    THE TWO DISCRIMINATING READINGS. (R1, tail) E-LIGHT: on every arm alpha_Hill
    exceeds 2 with the interval excluding 1, and CV is below 0.5 within a cell;
    per-attempt cost is size-determined and the restart-portfolio route stays
    closed with a number. E-HEAVY: some (cell, engine, arm) has alpha_Hill
    at most 1 with the interval excluding 1 and censored fraction below 5
    percent; then attempt-cap design (45bf55) must charge the cap, and the
    engine on that arm has a data-dependent blow-up worth a mechanism record.
    (R2, asymmetry) E-SYM: the Groebner engine's median cost on unsat targets
    is within [0.7, 1.5] of its median on sat targets at matched (m, fb,
    fb_size), because F4 computes the full basis either way; E-ASYM: the
    ratio lies outside that band. E-ASYM in the cheap direction (unsat
    cheaper) would mean a Groebner engine already exhibits the early-abort
    asymmetry that IDEA-20260926-89886c seeks from a mutant closure; in the
    expensive direction it would mean unsatisfiable systems are HARDER for
    F4, which bears on every "cheap refutation" lever. The record's prior is
    E-LIGHT and E-SYM on arm A, and E-LIGHT with a sat/unsat wall difference
    on arm B explained by the fixpoint iteration count (satisfiable systems
    run W_4 to the fixpoint, unsatisfiable ones are recorded at the first
    iteration containing 1 but the closure still ran to the fixpoint in RC-1;
    both readings are recorded per instance and the ratio is read against
    the iteration counts, not assumed).

  mechanism: >-
    OBJECT FRAME. Representation R1; Sigma = translation by factor-base
    elements (Class I), unchanged; no tracked object is added. TRICHOTOMY and
    LOSSY-PROJECTION TEST: not applicable to a statistic of an existing
    measurement, stated rather than omitted. THE ONE OPEN NUMBER is
    alpha_Hill per (cell, engine, arm), and the sat/unsat median ratio. WHY A
    DISTRIBUTION AND NOT A MEAN: the ECC2K-130 budget column is a per-attempt
    MEAN in group-op equivalents; an oracle whose mean meets the budget but
    whose tail has alpha near 1 has a mean dominated by rare attempts and a
    charged cap changes the exponent (45bf55); conversely an oracle with a
    heavy tail could be run with a cap and restarts at a cost the mean does
    not show. Either way the mean is not the number an attack pays, and the
    table should say which case it is in. WHY THE GROEBNER ASYMMETRY ROW:
    every cheap-refutation proposal in this lane compares itself to "the
    full solve"; whether the full solve is itself asymmetric on sat versus
    unsat inputs is a question the committed rows can already answer.
    OFF-LIMITS COMPONENTS: F2 only, as the family whose oracle is being
    described.

  novelty_status: unverified

