  assumptions:
    - >-
      The committed JSONL rows are read as literal inputs and their sha256
      recorded; no solver is run (msolve is not installed in this container
      and is not needed).
    - >-
      Arm B's unit is wall-clock seconds on the archived host, a secondary
      unit by RQ-ICPERF-94c86e's convention, flagged in every row; the
      operation-count successor is IDEA-20260926-c98e92.
    - >-
      Within a cell the attempts are exchangeable; the sat and unsat arms are
      never pooled.
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2 only.

  proof_search_map:
    bottleneck: >-
      Whether any measured decomposition engine in this program has a
      per-attempt cost tail heavy enough (alpha <= 1) to change what a
      budget MEAN means, and whether the Groebner full solve is itself
      asymmetric on sat versus unsat inputs.
    baseline_embedding:
      parameter_slice: >-
        The README's own per-cell medians (section 2 table: m = 2 small_x
        0.120 s at |F| = 104, 3.55 s at 258; m = 3 small_x 6.97 s at 25, 52.9
        s at 39) must be reproduced from the rows before any new column is
        read; for arm B the archived refutation counts and iteration counts.
      reproduction_check: >-
        Frozen fixture: the section-2 medians to three digits and the 685/2
        finished/censored split; the 62/62, 400/400 W_4 counts.
    observation_collision:
      observable: The tuple (CV, max/median, alpha_Hill, censored fraction) per (cell, engine, arm).
      distinct_preimage_search: >-
        A heavy Hill reading can come from (i) a genuine tail, (ii) a
        mixture of two sizes inside one cell (planted versus random targets,
        or two |F| pooled), or (iii) censored rows placed in the sample. (ii)
        is separated by stratifying on planted and fb_size before any
        statistic; (iii) by the censored-fraction column and by never
        including a censored row in the sample. The max/median row is the
        model-free cross-check on (i).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The four columns per (cell, engine, arm) added to the boundary
          table schema, with a censoring rule that keeps the censored count
          out of every denominator.
        predicted_gain: >-
          No cost gain; the table stops reporting a mean that a cap or a
          tail could invalidate without saying so.
    quantifier_order: >-
      FOR the committed cells and engines, the columns are as computed;
      E-HEAVY is EXISTS one (cell, engine, arm) with alpha <= 1 and interval
      excluding 1; E-LIGHT is FOR ALL of them alpha > 2 with interval
      excluding 1. Nothing is claimed for engines not in the data (WDSat,
      CaDiCaL, F4 in Macaulay2), which are named as missing arms.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the 687 msolve rows and the 268 + about 1300 closure instances,
        the distribution columns read [values]; the sat/unsat median ratio at
        matched cells is [values]." It certifies nothing about SAT engines,
        about m >= 4, or about any per-attempt cost at n = 131.
      nearby_object_control: >-
        Arm B's degree-4 closure, a fixed-shape linear-algebra pass, is the
        object where the tail MUST be light (CV near 0 up to the iteration
        count); if the Hill column reads heavy there, the estimator or the
        data handling is wrong before anything on arm A is believed.
    proof_obligations:
      - claim: The README medians and counts are reproduced from the rows.
        responsibility: baseline
      - claim: No censored row enters any mean, median or Hill sample.
        responsibility: correctness
      - claim: Planted and random targets, and distinct fb_size, are never pooled.
        responsibility: correctness
      - claim: Arm B reads light-tailed as the nearby-object control.
        responsibility: feasibility
      - claim: Every column carries its unit and its arm.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: alpha_Hill per (cell, engine, arm) with bootstrap 95 percent interval
      direction: higher
      minimum_effect: 'E-LIGHT iff above 2 with interval excluding 1 on every arm; E-HEAVY iff at most 1 with interval excluding 1 on any arm with censored fraction below 5 percent'
    - metric: cv_per_attempt within a (cell, engine, arm)
      direction: lower
      minimum_effect: 'below 0.5 on arm A cells with at least 12 finished targets; below 0.3 on arm B per set'
    - metric: sat_unsat_median_ratio (msolve, matched m, fb, fb_size)
      direction: same
      minimum_effect: 'E-SYM iff in [0.7, 1.5]; E-ASYM otherwise, direction reported'
    - metric: censored_fraction per cell
      direction: lower
      minimum_effect: 'arm A: 2 of 687 overall, concentrated in the m = 3 |F| = 64 cell (README: 1 of 3 finished); arm B: 0 except any W_5 UNDETERMINED(budget)'
    - metric: arm B sat/unsat wall ratio explained by iteration count
      direction: same
      minimum_effect: 'the ratio of per-set median wall_seconds tracks the ratio of median W_4 iterations to the fixpoint within a factor 2'

  minimal_test:
    design: >-
      DATA. Arm A: src/crypto_autoresearcher/index_calculus/results/
      engines-20260924.jsonl.gz (687 rows; sha256 recorded at step 1). Arm B:
      experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/closures.jsonl.gz
      (RC-1: n = 17, m = 2, l = 9, U62/S62/C20/N-AFF62/N-F262 under W_4 and
      M_5) and experiments/EXP-CERTBIN-060020/runs/RUN-CERTBIN-a3fc60/
      closures.jsonl.gz (n = 19, m = 2, l = 10, 400 unsat, 300 sat, null
      families), field wall_seconds per instance and the per-instance
      iteration and dimension records. CELLS. Arm A: every (m, fb, fb_size)
      with at least 12 finished targets, stratified by planted; arm B: every
      (closure, set). INSTRUMENT. A new analysis script of about 120 lines
      (Python, math and fractions for exact CP95 where counts are reported,
      a bootstrap for the Hill interval); no solver; nothing missing.
      PROCEDURE. (1) Hash the inputs; reproduce the README section-2 medians
      and the 685/2 split; reproduce the archived refutation counts. (2) For
      each cell and arm compute c1-c4 with the censoring rule. (3) Compute the
      sat/unsat median ratio at matched arm-A cells and the arm-B wall ratio
      beside the iteration-count ratio. (4) Emit the column table with units
      and arms, and the schema addition for the boundary table. SEEDS: one
      recorded seed for the bootstrap. METRICS (units): CV (dimensionless),
      max/median (dimensionless), alpha_Hill (dimensionless, with interval),
      censored fraction (count / count), medians (seconds, secondary).
      CONTROLS. Nearby-object control: arm B (fixed-shape elimination) must
      read light; null-object control: arm B's same-support null sets, whose
      W_4 runs to the fixpoint on every instance, give the tightest expected
      distribution; a synthetic heavy-tailed sample (Pareto alpha = 0.8, seed
      recorded) run through the same script must read alpha in [0.6, 1.0]
      (estimator positive control); a synthetic exponential sample must read
      alpha large (estimator negative control). No relabelled Z/NZ control:
      no group-structure claim. OUTCOME TABLE. POSITIVE (E-LIGHT and E-SYM,
      controls passing): the columns are filled for every committed cell, the
      restart-portfolio closure carries a number, and the schema addition is
      proposed to the boundary table; the Groebner full solve is recorded as
      symmetric on sat/unsat at toy scale. NEGATIVE, i.e. the interesting
      reading (E-HEAVY on any arm, or E-ASYM): a mechanism record is owed
      (which engine, which arm, which direction), attempt-cap design must
      charge the cap, and 89886c's comparator "the full solve" acquires the
      measured asymmetry. ARTIFACT (README medians not reproduced; arm B
      reading heavy; synthetic controls failing): the script is wrong;
      nothing is read. FALSIFICATION THRESHOLD, FIXED NOW: E-LIGHT is
      falsified by one (cell, engine, arm) with alpha_Hill <= 1, interval
      excluding 1, censored fraction below 5 percent and at least 12 finished
      attempts; E-SYM is falsified by a sat/unsat median ratio outside
      [0.7, 1.5] at two or more matched cells. COST (estimate): implementation
      low; compute seconds (zero solver runs).
    controls:
      - 'Reproduction of the README section-2 medians and the 685/2 split from the rows (blocking).'
      - 'Arm B fixed-shape closure as the light-tail nearby-object control (blocking).'
      - 'Synthetic Pareto (alpha 0.8) and exponential samples through the same script (estimator positive and negative controls).'
      - 'Censored rows counted in c4 and excluded from every other statistic; planted and random never pooled.'
    required_metrics:
      - 'c1-c4 per (cell, engine, arm) with units'
      - 'sat/unsat median ratio at matched arm-A cells'
      - 'arm-B wall ratio beside the iteration-count ratio'
      - 'input sha256 and row counts'
      - 'the schema addition text for the boundary table'

  falsification_conditions:
    - 'E-LIGHT falsified iff any qualifying (cell, engine, arm) reads alpha_Hill <= 1 with interval excluding 1.'
    - 'E-SYM falsified iff the msolve sat/unsat median ratio lies outside [0.7, 1.5] at two or more matched cells.'
    - 'The script is falsified (run void) iff the README medians are not reproduced or the synthetic controls misread.'

  confounders:
    - >-
      Arm A cells are small (12 targets per cell in the README's design), so
      Hill intervals will be wide; the record reports intervals and refuses a
      verdict on cells below 12 finished attempts.
    - >-
      msolve process start-up (about 4 ms) is subtracted in msolve_net_seconds;
      both columns are reported and the net one is primary.
    - >-
      Wall-clock on a shared host carries load noise; arm B rows are from a
      pinned single worker (RC-1 README), arm A from a 4-core container with
      3 workers, and neither is a hardware-independent unit; the unit is
      flagged secondary throughout.
    - >-
      The RC-1 W_4 ran to the fixpoint on every instance while recording the
      first iteration containing 1; a sat/unsat wall difference there is an
      iteration-count effect, not an early-abort effect, and is read as such.

  interpretation_limits:
    - 'Toy tier; committed data only; two engines (msolve 0.6.5 below 2^16, the pure-Python closure at n in {17, 19}); nothing about SAT engines or m >= 4.'
    - 'Wall-clock arms are secondary units; the operation-count successor is IDEA-20260926-c98e92.'
    - 'A light tail on these engines says nothing about a backtracking engine (the object 793fd8 was about), which stays a missing arm.'

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Exchangeability within a cell.) Per-attempt costs within one
        (cell, engine, arm) are exchangeable draws from one distribution, so
        CV and a tail index are meaningful summaries.
      rigorous_support: >-
        Holds by construction of the producing sweeps (targets drawn i.i.d.
        from a seeded stream at fixed curve and base); imitates the i.i.d.
        model of the restart-portfolio derivation.
      validation_plan: >-
        SAMPLE: the rows themselves. COMPARISON: a runs test on the
        target-order sequence of costs per cell against exchangeability. TAIL:
        the top order statistic against the fitted tail. TRANSFER: none.

  heuristic_note: >-
    The columns are descriptive statistics on committed data; H1 is the only
    modelling assumption and is testable on the same rows.

  target_complexity:
