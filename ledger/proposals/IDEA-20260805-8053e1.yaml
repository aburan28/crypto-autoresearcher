idea:
  id: IDEA-20260805-8053e1
  question_id: RQ-AES-002
  added: '2026-08-05'
  title: >-
    How much margin can CM-1 actually adjudicate? The unit-conversion resolution
    floor, and a reference-side amortisation audit showing the exhaustive-search
    reference is not cheapenable at the round level and is cheapenable by at most
    2 per cent at the key-schedule level
  class: control

  claim: >-
    RQ-AES-002 makes cost model CM-1 a hard pre-dispatch gate and requires it to
    fix six elements before any measurement. It does not require CM-1 to state
    what margin it can RESOLVE, and that omission is load-bearing, because the
    conversion between the two units CM-1 element (a) explicitly contemplates --
    "S-box lookups, table accesses, XORs or operations" versus "one full AES-k
    encryption" -- is worth log2(160) = 7.3219 bits for AES-128 encryption alone
    and log2(200) = 7.6439 bits once the key schedule is charged, while element
    (b)'s average-versus-worst-case choice is worth exactly 1 bit and element
    (a)'s "key schedule amortised or charged" choice is worth exactly
    log2(200/160) = 0.3219 bits. Any claimed margin below the declared conversion
    spread is a convention artifact rather than a result. Symmetrically, and
    against this campaign's own interest, the REFERENCE side must be audited too:
    the reference is 2^{k-1} full AES-k evaluations only if exhaustive search
    cannot be reorganised to spend less than one full evaluation per key, and
    this record DERIVES, and confirms by computation, that (i) two DISTINCT
    AES-128 keys share ZERO encryption rounds, because round key 0 is the master
    key, so the round-level shared-prefix depth of any key set is exactly 0; and
    (ii) across a key set varying one 32-bit master word, at most 1 of the 10
    key-schedule SubWord calls is shared, i.e. at most 4 of 200 charged S-box
    lookups, at most 2 per cent, at most 0.0291 bits. The deliverable is a
    resolution floor and a minimum adjudicable margin M_min, declared BEFORE any
    measurement, without which completion criterion C1 cannot be decided in
    either direction. Every margin sentence in this record names the reference as
    exhaustive key search at the stated key size under CM-1 and declares the
    published-state-of-the-art comparison UNADJUDICABLE in this environment.

  object_first_candidate:
    tracked_object: >-
      THE CHARGED COST OF ONE KEY TRIAL ON THE REFERENCE SIDE, followed through
      the whole conversion chain: primitive operations (S-box lookups, XORs,
      MixColumns column operations) -> one full AES-k evaluation -> 2^{k-1}
      evaluations -> the number CM-1 finally compares against. The object is the
      REFERENCE, not the attack, and that is the point: this campaign's entire
      adjudication rests on a number nobody in this repository has audited.
    established_families_off_limits: >-
      All thirteen families in RQ-AES-002
      objects_declared_off_limits_as_the_primary_lens are off-limits as the
      primary lens and none is used: differential and truncated differential;
      linear and multidimensional linear; integral / square / division property;
      impossible differential; meet-in-the-middle and Demirci-Selcuk; boomerang
      and retracing boomerang; biclique; algebraic (XSL-family) and Groebner;
      yoyo; mixture differential / exchange; subspace trail; partial sums as a
      cost reorganisation. ONE DECLARED ADJACENCY: the residual left open by the
      amortisation audit -- byte-level sharing of individual S-box calls across a
      key set, as opposed to round-level or SubWord-level sharing -- is precisely
      the accounting the biclique and partial-sums families perform, and this
      record NAMES that residual as belonging to those off-limits families rather
      than pursuing it. Naming a residual is not using a family as a lens.
    newness_score: >-
      The arithmetic is elementary and any careful cryptanalyst does it
      implicitly. What does not exist in this repository is the audit written
      down as a number with a declared resolution floor -- and DEC-20260731-011's
      striking of every recalled-baseline comparison, plus GOAL-AES-002's own
      note that GOAL-AES-001's first red-team pass destroyed its only cost model,
      are two independent indications that cost models are where this program
      loses arguments. Novelty against the external literature is unresolvable
      here and is claimed in neither direction.
    testability_score: >-
      Maximal. Every number in the claim is derivable on paper; the two
      confirmations quoted below were SESSION-COMPUTED in under a minute; and the
      one genuinely empirical component (measured throughput, both charged and
      amortised) is a stopwatch measurement.
    survival_score: >-
      Total, and trivially so: the object is the reference itself, which exists
      at every round count and every key size by definition. That is what makes
      it worth auditing before anything else is spent.

  mechanism: >-
    ALL FIGURES BELOW ARE DERIVED FROM THE DEFINITION OF AES-128 AND FROM
    ARITHMETIC. Nothing is cited from a document. Two structural counts were
    SESSION-COMPUTED on this machine outside the harness and are labelled; they
    are candidates to re-run in-harness, never run records.

    (A) THE UNIT AND ITS CONVERSION SPREAD.
    One full AES-128 encryption of one block performs 10 rounds, each applying
    SubBytes to all 16 state bytes: 160 S-box lookups. The AES-128 key schedule
    expands 4 words to 44 and applies SubWord at w[i-1] for i in {4,8,...,40}:
    10 SubWord calls, 4 S-box lookups each, 40 lookups. Therefore:
      unit with key schedule AMORTISED (encryption only):  160 lookups
      unit with key schedule CHARGED per key:              200 lookups
      log2(160) = 7.32193 bits
      log2(200) = 7.64386 bits
      log2(200/160) = log2(1.25) = 0.32193 bits
    CONSEQUENCE, STATED AS A FORCED VALUE: an attack whose work is reported in
    S-box lookups and compared against a reference reported in full AES-128
    evaluations acquires a phantom advantage of exactly 7.32193 or 7.64386 bits,
    depending on the amortisation convention, WITHOUT ANY CRYPTANALYSIS
    OCCURRING. RQ-AES-002 element (a) already anticipates this ("or the
    comparison is void"), but "void" is a verdict, not a resolution: what the
    campaign needs is the NUMBER, because it fixes how small a real margin can be
    and still be seen.

    (B) THE OTHER THREE RESOLUTION TERMS.
    Element (b), average-case 2^{k-1} versus worst-case 2^k, is EXACTLY 1 bit and
    must be applied to both sides or it manufactures that bit.
    Element (c), success-probability normalisation cost/p, is UNBOUNDED if p is
    assumed rather than measured, and is therefore not a resolution term but a
    gate: a margin computed with an assumed p is not a margin.
    Element (f), verification: the reference needs about two known pairs to make
    the key unique, and the expected number of surviving wrong keys after one
    128-bit pair is 2^128 * 2^{-128} = 1, so verification adds about one extra
    full evaluation per surviving candidate -- a term of order 2^{-126} relative
    to the search and therefore BELOW the resolution floor by more than 100 bits.
    That is worth recording precisely because it is the term most likely to be
    argued about, and the audit's job is to say which terms cannot matter.

    (C) THE REFERENCE-SIDE AMORTISATION AUDIT. This is the half that runs against
    this campaign's interest, and it is included for that reason: if the
    reference can be made cheaper, the bar for C1 RISES.
    (C1) ROUND-LEVEL SHARING IS EXACTLY ZERO. In AES-128 round key 0 IS the
    master key (w[0..3]). Two distinct master keys therefore differ in round key
    0, so the very first AddRoundKey already differs and NO encryption round can
    be shared between two distinct keys on the same plaintext. The shared-prefix
    depth of any AES-128 key set is 0 rounds. This is a one-line derivation and
    it is exact.
    (C2) KEY-SCHEDULE SHARING IS AT MOST ONE SubWord CALL. Suppose two master
    keys agree except in one 32-bit word w[c]. SESSION-COMPUTED on this machine,
    over the four choices of c: the number of the 44 expanded words that remain
    EQUAL is 3, 4, 5, 3 for c = 0, 1, 2, 3 respectively, and the number of the 10
    SubWord calls whose input is unchanged is 1, 1, 1, 0. Derivation matching the
    computation: the first SubWord acts on w[3]; if c != 3 that call is shared,
    but w[4] = w[0] xor SubWord(RotWord(w[3])) xor rcon then differs whenever
    c = 0, and w[5] = w[4] xor w[1] differs, and the difference propagates to
    every later word, so the SECOND SubWord (on w[7]) already differs. If c = 3
    even the first SubWord differs. HENCE at most 1 of 10 SubWord calls, i.e. at
    most 4 of 40 key-schedule lookups, i.e. at most 4 of the 200 charged lookups
    of a full evaluation: at most 2.00 per cent, i.e. at most
    log2(200/196) = 0.02914 bits of saving.
    (C3) THE RESIDUAL, NAMED AND NOT PURSUED. Sharing at the level of INDIVIDUAL
    S-box calls inside the encryption -- two keys whose partial state coincides
    at some byte position in some round -- is not bounded by (C1) or (C2), and
    that accounting is exactly what the biclique and partial-sums families
    perform. It is OFF-LIMITS as a primary lens here, it is NAMED AS OPEN AND
    UNATTEMPTED, and it is NEVER recorded as tried, screened or negative.

    (D) THE FLOOR, AND WHAT IT OBLIGES.
    Combining (A) and (B): unless CM-1 pins the unit exactly and applies the same
    convention on both sides, the adjudication resolution is bounded below by
    max(7.32193, 7.64386) bits from the unit alone, plus 1 bit from the success
    convention, i.e. a floor of order 2^7 to 2^8 in the multiplicative margin.
    Combining with (C): the reference cannot be cheapened by more than 0.02914
    bits by any amortisation this audit can see, so the floor is NOT an artifact
    of an unexamined reference -- it is entirely a property of the unit
    conversion. THE OBLIGATION THAT FOLLOWS: CM-1 must declare a MINIMUM
    ADJUDICABLE MARGIN M_min before any measurement, and any result whose claimed
    margin is below M_min is recorded as UNADJUDICABLE rather than as a margin.
    A campaign that cannot state M_min cannot decide C1 in either direction, and
    the honest consequence -- which this record states rather than hides -- is
    that effort should then be reallocated from C1 toward C3.

    (E) WHAT THIS AUDIT DOES NOT DO. It does not compute any attack's cost, does
    not compare against any published figure, and does not use any recalled
    number to size, screen, rank, promote or dismiss any candidate
    (RQ-AES-002 R3, both directions). It fixes the RESOLUTION of the comparison,
    not its outcome.

  novelty_status: unverified

  literature_context:
    - >-
      NO PRIMARY SOURCE WAS READ AND NONE IS CITED. All AES structural counts
      (10 rounds, 16 bytes, 10 SubWord calls, 44 expanded words) are derived from
      the cipher's definition and confirmed by local computation, which is the
      only grounding RQ-AES-002's provenance ruling permits.
    - >-
      RQ-AES-002 claim_tier_ceiling R3 records a Coordinator recollection of
      published full-AES figures and forbids its use in any comparison, in EITHER
      direction. THIS RECORD USES NO SUCH FIGURE. In particular it does not
      compare the derived resolution floor against any recalled margin, does not
      state that any recalled margin falls inside the floor, and does not use the
      floor to dismiss any candidate -- which would be the same fabrication as
      using it to promote one.
    - >-
      KN-TECH-035, KN-TECH-044, KN-TECH-050 and KN-TECH-057 (internal, named in
      this repository's cost-accounting lineage) hold the area-time / Wiener
      accounting this program uses elsewhere. NOT READ FOR THIS RECORD, and named
      only as the place a memory-side extension of this audit would begin. No
      claim from them is relied on here.

  lossy_projection_identifiability_audit:
    projection: >-
      The full cost of a key trial (instruction stream, cache behaviour, memory
      traffic, parallel structure) --> a single scalar in units of "full AES-k
      evaluations".
    what_is_discarded: >-
      Memory hierarchy, parallel structure, communication, and every
      implementation detail. The scalar retains only an operation count under a
      declared conversion.
    why_genuinely_lossy: >-
      Very lossy, and DELIBERATELY SO: a single scalar is exactly what CM-1
      demands, and the audit's whole content is the observation that the discard
      is not free -- the conversion that produces the scalar is itself worth
      7.32 bits, which is larger than many margins one might hope to claim.
    why_compatible_with_the_operations: >-
      Compatible in the only sense that matters: the conversion is a fixed
      positive constant per key trial, so it commutes with multiplication by the
      key-space size, which is why the ambiguity appears as an ADDITIVE constant
      in bits and does not grow or shrink with the exponent. That is precisely
      why it is a RESOLUTION FLOOR and not a scaling error.
    is_it_only_a_change_of_coordinates: >-
      BOTH FAILURES CHECKED. It is NOT the change-of-coordinates failure: the map
      from an instruction stream to an operation count is many-to-one and
      genuinely irreversible. It IS at risk of the mirror failure -- a cost
      scalar computed under a fixed convention is CONSTANT across attack
      instances if the convention is what determines it rather than the attack.
      THE CHECK RETURNED: the mirror failure is exactly what the audit
      DEMONSTRATES rather than suffers from. The comparator spread of the scalar
      under convention changes (7.32 bits) is measured against its spread under
      the attack changes the campaign could plausibly produce, and if the former
      dominates the latter the scalar is a constant of the apparatus. Naming that
      as the finding, rather than being caught by it, is the proposal.

  assumptions:
    - >-
      That CM-1 has not yet been committed. If a CM-1 artifact already exists
      when this is dispatched, the audit becomes a review of that artifact
      against the derived floor rather than an input to drafting it, and the
      record must be re-scoped accordingly. It is never an edit to a committed
      CM-1.
    - >-
      That "full AES-k evaluation" means the standard 10/12/14-round structure
      with the final round lacking MixColumns. Stated because the count 160
      depends on it.

  predictions:
    - metric: >-
        encryption_sbox_count: number of S-box applications in one full AES-128
        encryption, counted from the cipher definition
      direction: different
      minimum_effect: >-
        EXACTLY 160 (10 rounds x 16 bytes). Forced. AES-192: 12 x 16 = 192.
        AES-256: 14 x 16 = 224.
    - metric: >-
        key_schedule_sbox_count: number of S-box applications in the AES-128 key
        schedule
      direction: different
      minimum_effect: >-
        EXACTLY 40 (10 SubWord calls x 4 bytes). Forced. The AES-192 and AES-256
        counts are to be DERIVED IN THE EXPERIMENT and are deliberately NOT
        asserted here, because their key schedules have a different SubWord
        cadence and asserting a remembered number would be the exact failure this
        record exists to prevent.
    - metric: >-
        unit_conversion_spread_bits: log2 of the ratio between the two unit
        conventions CM-1 element (a) contemplates, for AES-128
      direction: different
      minimum_effect: >-
        EXACTLY 7.32193 bits (160 lookups per evaluation) or 7.64386 bits (200),
        and EXACTLY 0.32193 bits between the amortised and charged variants.
        These are the resolution-floor numbers and they are forced.
    - metric: >-
        round_level_shared_prefix_depth: the maximum number of leading encryption
        rounds two DISTINCT AES-128 keys can share on a common plaintext
      direction: different
      minimum_effect: >-
        EXACTLY 0. Forced, because round key 0 is the master key. If a run
        measures any positive value, the implementation is not AES-128 and the
        package is invalid.
    - metric: >-
        key_schedule_shared_subword_calls: over key pairs differing in exactly one
        32-bit master word, the number of the 10 SubWord calls with unchanged
        input
      direction: different
      minimum_effect: >-
        EXACTLY 1 for a difference in w[0], w[1] or w[2] and EXACTLY 0 for w[3];
        equivalently at most 4 of 200 charged lookups, at most 2.00 per cent, at
        most 0.02914 bits. SESSION-COMPUTED confirmation on this machine:
        equal expanded words 3, 4, 5, 3 of 44 and shared SubWord calls 1, 1, 1, 0
        for c = 0, 1, 2, 3.
    - metric: >-
        measured_throughput_ratio: measured AES-128 evaluations per second per
        core with the key schedule recomputed per key, divided by the same with
        the key schedule amortised
      direction: different
      minimum_effect: >-
        PREDICTED between 0.70 and 1.00, bracketing the derived operation-count
        ratio 160/200 = 0.80. This is the one genuinely empirical prediction here
        and it is a CHECK ON THE COST MODEL ITSELF: if the measured ratio falls
        outside the bracket, the operation count is not a faithful proxy for time
        on this machine, and CM-1 must say so instead of pretending it is.

  minimal_test:
    design: >-
      Four stages, cheapest first, terminating stage named. STAGE 0 (paper, zero
      compute, CAN END THE LINE): derive the counts and the spread; if the
      derivation disagrees with the numbers in this record, stop and correct the
      record before anything else. STAGE 1 (seconds): confirm the two structural
      counts by direct enumeration in code, including the AES-192 and AES-256
      key-schedule SubWord counts which this record deliberately does not assert.
      STAGE 2 (minutes): the amortisation audit -- enumerate key pairs differing
      in one master word, count equal expanded words and shared SubWord calls,
      and confirm the round-level depth is 0 by direct comparison of first-round
      states. STAGE 3 (minutes): the throughput measurement, both conventions,
      on the pinned implementation, with the measured seconds-per-evaluation and
      its variance reported, feeding the rank-3 measured-envelope receipt.
      STAGE 4 (paper): write M_min and the resolution-floor statement.
    controls:
      - >-
        POSITIVE CONTROL THAT MUST FIRE: deliberately construct a MIS-STATED
        comparison -- charge a synthetic "attack" in S-box lookups and the
        reference in full evaluations -- and confirm the audit reports a phantom
        margin of EXACTLY 7.32193 bits (or 7.64386 under the charged
        convention). If the audit does not flag it, the audit is not an audit and
        no conclusion may be drawn from it.
      - >-
        NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL: apply the identical
        conversion analysis to a 2-round AES-128 variant whose exhaustive key
        search over a restricted 24-bit key subspace is actually EXECUTABLE here.
        FORCED VALUE DERIVED BEFORE THE RUN: the measured ratio of
        (wall clock of the restricted exhaustive search) to
        (2^23 x measured seconds per 2-round evaluation) must be 1.00 within
        measurement error. If it is not, the operation-count model does not
        predict time even where time can be measured, and NO resolution floor
        derived from operation counts may be reported.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED: repeat the
        null at restricted key-space sizes 2^16, 2^20, 2^24 and report whether
        the predicted-to-measured ratio is constant in the exponent. A ratio that
        DRIFTS with the exponent means the conversion is not a constant per key
        trial, which would falsify the whole "additive constant in bits" framing
        and is the most informative failure available.
      - >-
        ARCHIVE CHECK (zero compute): list every archived cost model in this
        repository for AES. GOAL-AES-002's own record states that GOAL-AES-001's
        first red-team pass VOIDED that campaign's only cost model, and
        EV-AES-004 records that its n-interface cost table "is not usable and is
        not evidence of anything". So the archived state is: one cost model, and
        it was destroyed. Recorded as such rather than claimed as support.
    required_metrics:
      - the derived counts per key size, with the enumeration that produced them
      - the four resolution terms in bits, to five decimal places
      - shared expanded words and shared SubWord calls per differing master word
      - measured seconds per evaluation under both conventions, with variance and core count
      - the null's predicted-to-measured ratio at three key-space sizes
      - the declared M_min and the sentence that will be quoted whenever a margin is stated

  falsification_conditions:
    - >-
      The derived S-box counts are wrong. Everything downstream is void and the
      record is superseded.
    - >-
      The null's predicted-to-measured ratio is not 1.00 within error, or drifts
      with the key-space exponent. The operation-count conversion does not
      predict time, and the resolution floor may not be stated in time units.
    - >-
      Some key set is exhibited that shares one or more encryption ROUNDS across
      distinct AES-128 keys. The (C1) derivation is wrong and the reference is
      cheapenable in a way this audit missed.
    - >-
      Some key set is exhibited sharing more than one SubWord call while varying
      a full master word. The (C2) bound is wrong.
    - >-
      The positive control does not flag the deliberately mis-stated comparison.
      The instrument is broken and nothing may be reported.

  confounders:
    - >-
      AES-NI. A hardware AES round instruction makes the "S-box lookup" a
      fictitious unit on this machine, and the measured throughput ratio may
      reflect instruction latency rather than operation count. Declared pre-run:
      throughput is measured on BOTH the pinned reference implementation and an
      AES-NI path, and the two are reported separately and never merged.
    - >-
      CONTENDED CORES. GOAL-AES-002 shares four cores with GOAL-AES-001, and
      EV-AES-005 already records a producer/validator timing spread of 25.66 s
      versus 56.4 s "on 4 contended cores" for the same work. Every throughput
      figure must record the contention state or it is not a measurement.
    - >-
      SELF-SERVING DIRECTION. An audit that only tightens the ATTACK side would
      flatter the campaign. This record includes the reference-side amortisation
      audit specifically because its findings can only RAISE the bar, and the
      experiment reports both sides or neither.

  interpretation_limits:
    - >-
      NOTHING HERE IS A STATEMENT ABOUT AES SECURITY at any round count. No
      attack, no distinguisher, no barrier about the cipher. The subject is the
      measuring instrument.
    - >-
      The resolution floor is derived for the conversions CM-1 element (a)
      contemplates. It is NOT a claim that no cost model can resolve finer -- a
      model that pins the unit exactly and charges both sides identically can, and
      naming that route is the forward guidance a closure requires.
    - >-
      The reference-side amortisation bound covers ROUND-level and SubWord-level
      sharing only. Byte-level sharing inside the encryption is OPEN AND
      UNATTEMPTED and belongs to families off-limits here; it is never recorded
      as tried, screened or negative.
    - >-
      MEMORY IS NOT AUDITED HERE. The floor is a TIME-side result, and
      docs/claims-and-verification.md requires memory beside time always, so a
      memory-side companion (charging an attack's table under an area-time model
      while the reference's memory is negligible) is named as the immediate
      successor and is not claimed to have been done.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING ON THE COUNTS. 160, 40, 200, the four bit-figures, the
        zero round-level sharing depth and the at-most-one shared SubWord call are
        exact consequences of the AES-128 definition, not distributional claims.
      rigorous_support: >-
        Given in the mechanism. (C1) is one line. (C2) is a propagation argument
        confirmed by direct enumeration (SESSION-COMPUTED: equal expanded words
        3/4/5/3 of 44, shared SubWord calls 1/1/1/0).
      validation_plan: >-
        Stage 1 and stage 2 re-derive both by enumeration in-harness and report
        the enumeration, not a summary of it.
    - id: H2
      statement: >-
        OPERATION-COUNT FIDELITY. On the pinned implementation, wall-clock time
        per key trial is proportional to the charged operation count, with a
        constant of proportionality independent of the key-space size.
      rigorous_support: >-
        NOT DERIVABLE AND NOT ASSUMED SAFE -- this is the one genuinely empirical
        assumption in the record and it is the weakest link. Cache behaviour,
        branch prediction and AES-NI can all break proportionality, and a
        cost model that quietly assumes it is exactly the kind of artifact a red
        team destroys.
      validation_plan: >-
        The graded null at restricted key-space sizes 2^16, 2^20, 2^24 measures
        the constant of proportionality directly at three points and reports
        whether it drifts. A drift falsifies H2 and the floor may then be stated
        only in operation counts, never in seconds.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY THIS PROPOSAL, and it says so rather than dressing
      an audit as an exponent result. What it fixes is the RESOLUTION with which
      any exponent claim this campaign could make can be read: a floor of order
      7.32 to 7.64 bits from the unit conversion for AES-128, plus exactly 1 bit
      from the success convention if it is not applied symmetrically.
    memory_exponent: >-
      The reference's memory is negligible (a constant number of blocks), which
      is itself the strongest part of the reference and is stated beside time as
      required. The audit does not charge memory on the attack side; that is the
      named successor.
    best_known: >-
      The reference for this question is EXHAUSTIVE KEY SEARCH at the stated key
      size under CM-1, which is definitional and requires no literature; the
      published state of the art is UNADJUDICABLE in this environment and is
      asserted in neither direction.
    hidden_overhead: >-
      The audit's own overhead is minutes. The hidden overhead it EXPOSES is the
      conversion constant, which is the whole point.
    tradeoff_note: >-
      None on the reference side: exhaustive key search is embarrassingly
      parallel with negligible memory and about two known pairs of data, i.e. it
      sits at an extreme corner of the time/memory/data frontier, which is why
      any attack must be compared on the full frontier and not on a single scalar
      (RQ-AES-002 element (d)).

  dominated_by: >-
    "unresolvable in this environment: no primary source reachable; every
    recalled frontier row is unverified-from-memory". Set to this string and
    never to null, per RQ-AES-002 R5. Rows checked INSIDE this repository, across
    time, memory and data/queries: EV-AES-001..005 and the two EV-AES hex-suffixed
    records; EV-AES-004's section-5 n-interface cost table, which its own
    boundaries declare "not usable and not evidence of anything"; GOAL-AES-001's
    and GOAL-AES-002's budget and cost blocks; KN-TECH-035/044/050/057 as the
    named home of area-time accounting (not read for this record). No committed
    record in this repository states a resolution floor or a minimum adjudicable
    margin for an AES cost comparison. Absence of a search result is not evidence
    that it was not done elsewhere.
  sota_delta: >-
    DEFINITIONAL-REFERENCE DELTA: ZERO -- this proposal claims no attack and
    therefore no margin whatsoever against exhaustive key search at any key size
    under CM-1, and the published-state-of-the-art comparison is UNADJUDICABLE in
    this environment and is asserted in neither direction (R5 clause, same
    sentence). Quantitatively the contribution is four exact numbers the campaign
    does not currently have -- 7.32193, 7.64386, 0.32193 and 0.02914 bits -- plus
    a declared M_min without which criterion C1 is not decidable in either
    direction.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.75 that the derived floor exceeds the margin this campaign could plausibly
    demonstrate, and therefore that CM-1 must either pin the unit exactly or C1
    be recorded as unadjudicable. It is not higher because a CM-1 that fixes the
    unit to "full AES-k evaluations on the pinned implementation" on BOTH sides
    -- which RQ-AES-002 element (a) already tells it to do -- removes the 7.32-bit
    term entirely, in which case the floor collapses to the 1-bit success
    convention and the audit's verdict is a clean pass with four useful numbers
    banked. It is not lower because cost models are where this program has
