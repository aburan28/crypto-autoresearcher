idea:
  id: IDEA-20260807-5f5ace
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    THE HESSIAN MODEL SEPARATES "MODEL" FROM "COORDINATE" AND PROVES A COORDINATE
    CAN COST A FACTOR 2 - on x^3 + y^3 + 1 = 3dxy negation is (x,y) -> (y,x), so
    x alone is a DEGREE-3 NON-GALOIS coordinate with predicted per-variable
    summation degree EXACTLY 9 at m = 3, while the negation-invariant s = x + y
    is degree 2 with predicted degree EXACTLY 2; measuring both on ONE curve
    isolates the coordinate as the causal variable and predicts a Bezout ratio of
    exactly 2 at fixed factor-base size
  class: representation

  claim: >-
    (A) THE HESSIAN GEOMETRY, WORKED OUT BY HAND. Take the projective Hessian
    cubic X^3 + Y^3 + Z^3 = 3d XYZ with neutral element O = [1 : -1 : 0], for
    which the group law is "three collinear points sum to O" and negation is
    -(X : Y : Z) = (Y : X : Z), i.e. affinely -(x, y) = (y, x). Two consequences,
    both elementary and both decisive:
      (A1) The affine coordinate x is NOT negation-invariant. Its fibres are the
      intersections of E with the pencil of lines X = cZ, which pass through
      [0 : 1 : 0]. That point is NOT on the curve (0 + 1 + 0 != 0), so every line
      of the pencil meets E in 3 points and x : E -> P^1 has DEGREE 3. The fibre
      {P, P', P''} satisfies P + P' + P'' = O (collinearity) and is therefore NOT
      an orbit of any group of automorphisms - the map is non-Galois.
      (A2) The symmetric coordinate s = x + y IS negation-invariant. Its fibres
      are the intersections with the pencil X + Y = sZ, whose base point
      [1 : -1 : 0] IS on the curve, so each line meets E in the base point plus 2
      others and s : E -> P^1 has DEGREE 2. It is the Kummer coordinate.

    (B) THE TWO DEGREE PREDICTIONS, EXACT INTEGERS.
      (B1) For s = x + y: deck group {+-1}, so by the fibre count of
      IDEA-20260807-dadcd2 (L1), deg_{s_i} S_3^{Hess,s} = 2^(3-2) = 2 exactly,
      and deg_{s_i} S_m = 2^(m-2). IDENTICAL to short Weierstrass.
      (B2) For x: the deck group inside Aut(E,O) is TRIVIAL, so (L1) does not
      apply and only the general bound (L2) does. Fix x_1, x_2; each has 3
      preimages; x_3 = x(-(P_1 + P_2)) ranges over up to 3 x 3 = 9 values, with no
      diagonal quotient available because the fibre is not a group orbit. So
        deg_{x_i} S_3^{Hess,x} = 9 EXACTLY (generically),
      and deg_{x_i} S_m^{Hess,x} = 3^(m-1).

    (C) THE FACTOR-BASE TRADE, AND WHY IT LOSES BY EXACTLY 2. A membership
    polynomial of degree d in the coordinate x names 3d points, versus 2d in the
    coordinate s - the coarser coordinate is denser in points per coordinate
    value, which is the only reason anyone would try it. At FIXED rational
    factor-base size B the Bezout numbers are
      s-coordinate: 2^(m-2) (B/2)^(m-1) = B^(m-1)/2
      x-coordinate: 3^(m-1) (B/3)^(m-1) = B^(m-1)
    so the degree-3 coordinate is worse by EXACTLY a factor 2, independent of m
    and of B. The density gain and the degree loss cancel to first order and the
    residual is precisely the factor |Gamma_f| of the deck-group law. THIS IS THE
    LANE'S ONE CLEAN QUANTITATIVE DEMONSTRATION that "coordinate" is a real causal
    variable with a computable price, and it is a price, not a prize.

    (D) WHY THE HESSIAN AND NOT SOMETHING ELSE. Weierstrass, Montgomery, Edwards
    and the Kummer line all have a NEGATION-INVARIANT natural coordinate, so they
    are all Moebius-equivalent and can only differ in support. The Hessian is the
    only standard model in the brief's list whose natural affine coordinate is NOT
    negation-invariant, because Hessian negation SWAPS the two coordinates instead
    of fixing one. That makes the Hessian the only place in L11 where the
    coordinate degree can actually change, and therefore the only place where the
    two branches (L1) and (L2) of the deck-group law can be told apart
    experimentally on one curve.

    (E) THE THREE OUTCOMES.
      OUTCOME 1 - measured (2, 9). Both branches of the deck-group law are
        confirmed, the factor-2 Bezout ratio is confirmed, and L11 gains its one
        demonstrated coordinate effect - a negative one, with a named mechanism.
      OUTCOME 2 - measured x-degree is 3, not 9. Then the Hessian x-fibres do
        admit a diagonal quotient after all, meaning the three collinear points in
        a fibre form a structure I have not identified (a torsor under 3-torsion,
        say), and the deck-group law needs a third branch covering non-Galois maps
        with special fibre structure. That would be the more interesting outcome
        and it would REOPEN the search for coarse coordinates.
      OUTCOME 3 - measured s-degree is not 2. Falsifies (L1) at its most basic
        instance and invalidates every other L11 arm.

    (F) THE THIRD ARM THAT MAKES THIS A CONTROL AS WELL AS A MEASUREMENT. Both
    coordinates live on the SAME Hessian curve, with the SAME points and the SAME
    group. So "model" is held fixed and only "coordinate" varies. Comparing arm
    (B1) against Weierstrass on a birationally equivalent curve holds "coordinate
    type" fixed (degree 2, negation-invariant) and varies "model". The 2 x 2
    design separates the two factors that the phrase "curve model" conflates, and
    the corpus currently has no record that distinguishes them.

  resource_label: R2 (curve equation and model), with R1 for the coordinate values.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE. The resource is R2 - the model and the choice of coordinate
    function - which changes the polynomial system's coefficient ring and is not
    producible by the generic-group simulator of KN-FIND-b7e091. H-ENDO-001 does
    not bite: no endomorphism is applied to points of G. The prestated ceiling is
    that of IDEA-20260807-dadcd2 - the coordinate can only lose, and by exactly
    the factor computed in (C).

  discriminated_from:
    - >-
      IDEA-20260807-dadcd2, which states the law. This record supplies the only
      instance in the lane where its two branches give DIFFERENT answers on one
      curve, and therefore the only place the law is experimentally separable
      from "everything is 2".
    - >-
      IDEA-20260807-e6d79e and IDEA-20260807-78eafe, which vary the model while
      keeping a degree-2 negation-invariant coordinate. This record varies the
      COORDINATE DEGREE, which those cannot.
    - >-
      KN-LIT-1937 ("Tripling on Hessian curves via isogeny decomposition") and
      KN-LIT-3527 ("Efficient Arithmetic on Hessian Curves") and KN-LIT-7286
      ("Twisted Hessian curves") in the corpus index. Those are arithmetic-efficiency
      papers about scalar multiplication; none concerns summation polynomials or
      decomposition systems, and I have read only their titles in
      knowledge/SOURCES.md.
    - >-
      KN-FIND-a1f3c2, whose monodromy computation C_2^(m-2) is specific to the
      Weierstrass x-coordinate. The Hessian x, being non-Galois of degree 3, is
      outside its scope by construction, and the Galois group of S_3^{Hess,x} is a
      quantity nobody in this program has computed. Its measurement is a bonus
      deliverable here.

  object_first_candidate:
    tracked_object: >-
      THE FIBRE STRUCTURE OF THE COORDINATE MAP - not just its degree n but
      whether the n-element fibre is an orbit of a group of automorphisms of E.
      Tracked across coordinates on one fixed curve.
    established_families_off_limits: >-
      Off-limits as primary lens: rho, BSGS, Semaev-in-Weierstrass as an
      algorithm, Weil descent, pairing transfer, lattice/HNP, isogeny walks. The
      object is a property of a map between curves and lines.
    lossiness: >-
      LOSSY AND COMPATIBLY SO, and this record is where the compatibility
      condition actually BITES rather than being satisfied for free. The
      projection f : E -> P^1 forgets the fibre, retaining the coordinate value.
      For a Galois f whose deck group is inside Aut(E,O), the discard is
      compatible with the group operation - the sum of chosen preimages is
      determined up to the same group, so the retained part propagates
      deterministically with branching |Gamma|^(m-1) collapsing to |Gamma|^(m-2).
      For the Hessian x the discard is NOT compatible: the fibre {P, P', P''} is a
      collinear triple, not a group orbit, so no diagonal collapse occurs and the
      branching stays at 3^(m-1). Both are lossy; only one is compatibly lossy;
      and the price of incompatibility is exactly the factor in (C). This is the
      lossy-projection test doing real work at zero compute.
    propagation: >-
      One step - add a point - sends the Galois fibre Gamma P to a coset that is
      again a Gamma-orbit, and sends the collinear triple {P, P', P''} to
      {P + Q, P' + Q, P'' + Q}, which is collinear only if 3Q = O. So the Hessian
      x-fibre structure is preserved only under 3-torsion translation, which is a
      testable and falsifiable one-step statement in its own right.
    survival_score: >-
      Survives arbitrary Moebius reparametrisation of the target P^1 (degree and
      Galois-ness are intrinsic). Dies as soon as the curve has no rational point
      of order 3, because the Hessian model then does not exist - so the object,
      like the Edwards parity grading, is unavailable on prime-order curves.

  mechanism: >-
    STEP 1 - CONSTRUCT AND VERIFY. Build a toy Hessian curve
    x^3 + y^3 + 1 = 3dxy over a prime with 3 | p - 1 so the model is well
    populated, and its birational Weierstrass model. Verify with 200 random points
    that the map is a group homomorphism and that negation is (x, y) -> (y, x)
    and that O = [1 : -1 : 0] behaves as the identity. GATE.
    STEP 2 - CONFIRM THE COORDINATE DEGREES DIRECTLY, BEFORE ANY SUMMATION
    POLYNOMIAL. For 200 random values c, count |{P in E(Fbar_p) : x(P) = c}| by
    solving the curve equation, and likewise for s = x + y. Predicted: 3 and 2.
    This is cheap and it tests (A1)/(A2) independently of any elimination.
    STEP 3 - S_3 IN s. Eliminate to the reduced summation polynomial in
    s_1, s_2, s_3. Predicted per-variable degree 2, total degree 4. Cross-check
    against the Weierstrass S_3 via the explicit Moebius relation between s and
    the Weierstrass x - they must agree up to a scalar after substitution.
    STEP 4 - S_3 IN x. Eliminate to the reduced summation polynomial in
    x_1, x_2, x_3. Predicted per-variable degree 9. This is the expensive
    elimination and it is where the compute budget goes; if resultant swell makes
    it infeasible, that is an INFRASTRUCTURE outcome (AGENTS.md rule 5) and is
    reported as such, never as evidence about the degree.
    STEP 5 - THE INDEPENDENT DEGREE CHECK THAT DOES NOT NEED THE POLYNOMIAL. Even
    if Step 4 is infeasible symbolically, the per-variable degree is measurable
    NUMERICALLY: fix random x_1, x_2 in F_p, enumerate the 3 x 3 preimage pairs
    over an extension where they are all defined, compute x(-(P_1 + P_2)) for each,
    and count distinct values. Predicted 9. This is O(1) work per sample and it is
    the real minimal test of (B2).
    STEP 6 - THE BEZOUT COMPARISON. Build the arity-3 decomposition system in each
    coordinate with factor bases of the SAME RATIONAL SIZE B (so d = B/2 for s and
    d = B/3 for x), compute Bezout numbers and BKK mixed volumes, and verify the
    predicted ratio of exactly 2.
    STEP 7 - THE 2 x 2 DESIGN. Add the Weierstrass arm on the birationally
    equivalent curve so that (model, coordinate-type) is fully crossed, and report
    the two main effects separately.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for "Hessian" (2026-08-07). Full reads of
      KN-TECH-002, KN-TECH-007, KN-FIND-a1f3c2, KN-OPEN-003, KN-LIT-004,
      harness/semaev.py, harness/toycurve.py. Web search on summation polynomials
      across curve forms.
    results: >-
      INTERNAL - "Hessian" in knowledge/ resolves to KN-LIT-1313 ("The Hessian of
      elliptic curves"), KN-LIT-678 (Hessian MATRICES, unrelated), KN-LIT-3527,
      KN-LIT-7286, KN-LIT-1937 - all arithmetic-efficiency or unrelated, and all
      known to me only through knowledge/SOURCES.md title rows. ZERO records in
      ledger/ or knowledge/ concern a Hessian summation polynomial, a Hessian
      factor base, or the degree of the Hessian coordinate map. The observation
      that the Hessian x is non-Galois of degree 3 appears nowhere.
      EXTERNAL - Cheng-Kodera-Miyaji, IEICE Trans. Fundamentals E102-A(9)
      1061-1071, 2019, doi 10.1587/transfun.E102.A.1061, explicitly includes the
      Hessian form in its comparison. I have read only the abstract. If that paper
      already reports the degree-9 Hessian-x summation polynomial then (B2) is
      DUPLICATE external prior art and this record should be reclassified. That
      check is Stage 0 and it is a hard gate.
    verdict: adaptation

  null_object_control: >-
    MANDATORY. Matched null - a RANDOM DEGREE-3 RATIONAL FUNCTION on the same
    curve, of the form r(P) = (cubic in Weierstrass x and y)/(cubic), constructed
    to have degree 3 and no special fibre structure. It has the same shape as the
    Hessian x - same degree, same non-Galois-ness expected - so if the measured
    per-variable summation degree for the Hessian x matches the random degree-3
    function, then 9 is a property of "degree 3" and not of "Hessian", which is
    the honest reading and is what (B2) actually predicts. DECAY PARAMETER: the
    coordinate degree n itself, swept over n = 2, 3, 4 via explicit maps. The
    predicted per-variable summation degree must track n^(m-1) for non-Galois maps
    and n^(m-2) for Galois ones; a measured degree that does NOT grow with n is
    the canonical artifact tell and means the elimination is collapsing something.
    SECOND NULL - the negation-invariant s on the same Hessian curve, which is the
    within-model control that isolates coordinate from model.

  assumptions:
    - >-
      A Hessian model requires a rational point of order 3, so 3 | #E(F_p) and the
      curve has cofactor at least 3. Guaranteed by construction; fatal to any
      transport to prime-order curves.
    - >-
      "Generically" in (B2) excludes a proper closed subset of (x_1, x_2); the
      degree-9 claim is about the generic fibre.
    - >-
      The predicted 9 assumes the 9 values x(-(P_1 + P_2)) are pairwise distinct
      for generic parameters. If the collinear-triple structure forces
      coincidences, the true degree is lower and Outcome 2 fires. I have NOT
      proved distinctness and this is the weakest step in the record; it is marked
      [open] and it is what Step 5 measures.
    - >-
      p > 3 and the Hessian curve is non-singular, i.e. d^3 != 1.

  proof_search_map:
    bottleneck: >-
      The distinctness of the 9 values in (B2). Everything else is a pencil count.
      If they collide in a structured way the degree drops and the whole (C)
      trade-off changes sign.
    baseline_embedding:
      parameter_slice: >-
        The s-coordinate arm, which must reproduce the Weierstrass baseline
        exactly: per-variable degree 2, total degree 4, and after the explicit
        Moebius substitution, equality with s3_expr up to a scalar.
      reproduction_check: >-
        Symbolic equality of the substituted polynomials, plus the frozen
        harness/semaev.py fixture (per-variable degree 2, support 13). Exact, no
        tolerance.
    observation_collision:
      observable: The per-variable degree of the reduced summation polynomial.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: the Hessian s and the Weierstrass x
        must both give 2. That collision is the confirmation that the observable
        depends on the coordinate's deck group and not on the model's name. The
        search must also try to find a NON-Galois degree-2 map, which cannot exist
        (every degree-2 map is Galois), and recording that impossibility is part
        of why n = 2 is special.
    constructive_transforms:
      - >-
        transform: observable_fiber
        proposed_object: >-
        Instead of computing the summation polynomial and reading its degree,
        compute the FIBRE of the observable directly - enumerate the 9 candidate
        values numerically (Step 5). The fibre of the observable is cheap where
        the observable itself is expensive.
        predicted_gain: >-
        Turns an elimination that may be infeasible into O(1) arithmetic per
        sample, which is what makes (B2) testable at all.
      - >-
        transform: stronger_invariant
        proposed_object: >-
        The Galois group of S_3^{Hess,x} over the function field of the
        parameters, generalising KN-FIND-a1f3c2's C_2^(m-2) to the non-Galois
        coordinate case.
        predicted_gain: >-
        A structural quantity that would explain any collision found in Outcome
        2 rather than merely recording it.
    quantifier_order: >-
      CLAIMED - FORALL non-singular Hessian curves over F_p with p > 3 and
      3 | p - 1, deg_{s_i} S_3^{Hess,s} = 2 and, FOR GENERIC (x_1, x_2),
      #{x(-(P_1 + P_2))} = 9 so deg_{x_i} S_3^{Hess,x} = 9.
      NOT CLAIMED - the degree-9 statement for every (x_1, x_2) (it is generic),
      nor deg = 3^(m-1) for m > 3, which is an extrapolation of the same count and
      is marked [open].
    method_ceiling:
      strongest_certifiable_claim: >-
        "On a Hessian-admitting curve, the affine x-coordinate gives a summation
        polynomial of per-variable degree 9 at m = 3 and a decomposition system
        with Bezout number exactly twice that of any degree-2 coordinate at the
        same rational factor-base size." It can NEVER certify anything about
        prime-order curves (no Hessian model), about measured wall time, or about
        m > 3 without the corresponding elimination.
      nearby_object_control: >-
        The SAME Hessian curve with the coordinate s, where the desired conclusion
        (degree 9) must FAIL and give 2. A pipeline reporting 9 for s is measuring
        an elimination artifact.
    proof_obligations:
      - >-
        claim: Hessian negation is (x, y) -> (y, x) with O = [1 : -1 : 0].
        responsibility: correctness
      - >-
        claim: "[0 : 1 : 0] is not on the Hessian cubic, so deg(x) = 3."
        responsibility: correctness
      - >-
        claim: "[1 : -1 : 0] is on the cubic, so deg(x + y) = 2."
        responsibility: correctness
      - >-
        claim: The 9 values in (B2) are generically distinct.
        responsibility: strictness
      - >-
        claim: The Bezout ratio at fixed B is exactly 2.
        responsibility: size
      - >-
        claim: Infeasible elimination is reported as infrastructure, not degree.
        responsibility: scope

  predictions:
    - >-
      metric: degree of the coordinate map x on the Hessian curve
      direction: higher
      minimum_effect: EXACTLY 3, measured by fibre enumeration. Zero tolerance.
    - >-
      metric: degree of the coordinate map s = x + y on the Hessian curve
      direction: different
      minimum_effect: EXACTLY 2.
    - >-
      metric: per-variable degree of the reduced S_3 in the Hessian s
      direction: different
      minimum_effect: EXACTLY 2, matching short Weierstrass.
    - >-
      metric: >-
      number of distinct values of x(-(P_1 + P_2)) over the 9 preimage pairs,
      for generic x_1, x_2 (equivalently per-variable degree of S_3^{Hess,x})
      direction: higher
      minimum_effect: >-
      EXACTLY 9. Pre-registered branch rule: 9 confirms (B2); 3 or 6 fires
      Outcome 2 and REOPENS the coarse-coordinate search with a named structure
      to find; 2 falsifies the fibre count entirely.
    - >-
      metric: >-
      Bezout number ratio, Hessian-x system to Hessian-s system, at equal
      rational factor-base size B
      direction: higher
      minimum_effect: >-
      EXACTLY 2, independent of B and m. A ratio of 3 or 1 means the
      factor-base-size accounting in (C) is wrong.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, GATE): read Cheng-Kodera-Miyaji 2019 for an existing
      Hessian summation-polynomial degree. A hit reclassifies (B2) as duplicate.
      STAGE 1 (minutes, GATE): build and verify the Hessian curve and its
      birational Weierstrass model; confirm negation and the identity.
      STAGE 2 (minutes, THE CHEAPEST DECISIVE STEP): fibre enumeration for x and
      for s over 200 random values. This alone settles (A1) and (A2).
      STAGE 3 (minutes, THE SECOND CHEAPEST DECISIVE STEP): numerical count of
      distinct x(-(P_1 + P_2)) over 9 preimage pairs, 200 random (x_1, x_2). This
      alone settles (B2) without any symbolic elimination.
      STAGE 4 (minutes to hours): symbolic elimination of S_3 in s, then in x.
      Budgeted; a bust is an infrastructure report.
      STAGE 5 (minutes): Bezout and mixed volume in both coordinates at equal B.
      STAGE 6 (minutes): the random-degree-3 null and the n-sweep decay test.
    controls:
      - the s-coordinate on the same curve (within-model control)
      - the Weierstrass arm on the birationally equivalent curve (2 x 2 design)
      - a random degree-3 rational function as the matched null
      - the coordinate-degree sweep n = 2, 3, 4 as the decay test
      - >-
        deliberately mis-specified negation, to confirm the pipeline rejects a
        wrong group law rather than silently producing a degree
    required_metrics:
      - measured coordinate-map degree per coordinate
      - distinct-value count for x(-(P_1+P_2)) with its empirical distribution
      - per-variable and total degree of each reduced summation polynomial
      - support size and explicit support set per coordinate
      - Bezout, BKK mixed volume, and their ratio at equal B
      - elimination wall time and peak memory, with a declared budget

  falsification_conditions:
    - >-
      The measured degree of the Hessian x coordinate map is not 3. (A1) is false.
    - >-
      The measured degree of s is not 2. (A2) is false and the s arm cannot serve
      as a control.
    - >-
      The distinct-value count in Stage 3 is not 9. (B2) is false as stated;
      values 3 or 6 REOPEN the coarse-coordinate search and are the more valuable
      failure.
    - >-
      Per-variable degree of S_3 in s is not 2. Falsifies IDEA-20260807-dadcd2
      (L1) at its simplest instance.
    - >-
      The Bezout ratio at fixed B is not 2. The accounting in (C) is wrong.
    - >-
      The random degree-3 null gives a different count from the Hessian x. Then 9
      is Hessian-specific rather than degree-specific, which contradicts (B2)'s
      own reasoning and must be explained before anything is reported.
    - >-
      Symbolic elimination for the x arm exhausts its budget. INFRASTRUCTURE
      (AGENTS.md rule 5); Stage 3 still stands and is reported alone.

  confounders:
    - >-
      3 | #E(F_p) is required for a Hessian model, so every tested curve has
      cofactor at least 3 and is not a cryptographic curve.
    - >-
      Whether 3 | p - 1 changes how many of the 3-torsion points are rational and
      hence how much of the structure is visible over F_p. Both cases must be run
      and reported separately.
    - >-
      Resultant swell in Step 4 makes non-reduced output very likely; the
      squarefree gate is mandatory and a degree read from non-reduced output is
      meaningless.
    - >-
      The numerical count in Stage 3 needs an extension field where the preimages
      are defined; working over F_{p^k} for the count while claiming a degree over
      F_p is legitimate for a GEOMETRIC degree but must be labelled, and it does
      NOT license any statement about rational factor-base sizes, which is (L3) of
      IDEA-20260807-dadcd2 and is the exact place this program has previously
      confused geometric with rational counts.
    - >-
      "Hessian" in the corpus also means the Hessian MATRIX (KN-LIT-678); a
      literature search must not conflate the two.

  interpretation_limits:
    - >-
      ASYMPTOTIC CEILING, STATED AS THE BRIEF REQUIRES. NO exponent change is
      claimed, and the direction claimed is a LOSS. The per-variable degree
      3^(m-1) versus 2^(m-2) is a change in the BASE of a small-m expression that
      cancels against the factor-base density to leave a constant factor 2 - it is
      not an asymptotic improvement and it is not an asymptotic degradation of the
      ECDLP either, since nobody would use the losing coordinate. Diem's and
      Gaudry's asymptotics are model-agnostic and are untouched.
    - >-
      A Hessian model requires 3 | #E(F_p) and therefore does not exist on a
      prime-order curve. Nothing here transports.
    - >-
      The degree-9 claim is generic; special fibres are not counted.
    - >-
      Bezout is a proxy for solving cost (KN-TECH-011), not solving cost.
    - >-
      Toy scale, claim_tier toy (AGENTS.md rule 7).

  reachability_gate: >-
    TRIVIAL, AND STATED RATHER THAN LEFT BLANK. T5 gates movement between CURVES;
    this record moves between COORDINATES on one curve at the cost of a
    substitution, with probability 1 and no walk. Both coordinates x and s are
    available simultaneously on the same Hessian curve, which is what makes the
    within-model control free. The model-EXISTENCE condition (3 | #E(F_p)) is an
    arithmetic property, checkable for free, and unsatisfiable on a prime-order
    curve at any price - a fact about the curve, not a search cost, recorded here
    so it is not mistaken for one.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CHANGE CLAIMED; a constant-factor LOSS of exactly 2 is claimed
      for the degree-3 coordinate at fixed rational factor-base size, uniformly in
      m and B. The degree-2 coordinate ties exactly with short Weierstrass. ECDLP
      best-known exponents are untouched.
    memory_exponent: >-
      The degree-3 coordinate strictly increases the Macaulay matrix dimension at
      fixed variable count because the summation polynomial degree rises from
      2^(m-2) to 3^(m-1) (KN-TECH-011); that is a memory LOSS and is the practical
      reason the x arm's elimination may bust its budget.
    best_known: >-
      Rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); BSGS
      sqrt(N)/sqrt(N) (KN-TECH-031); automorphism-discounted rho (KN-TECH-018);
      Semaev index calculus exp(c sqrt(log N log log N)) (KN-FIND-f8c290) with BKK
      constants (KN-FIND-2a8b7e, KN-FIND-c7d31e).
    hidden_overhead: >-
