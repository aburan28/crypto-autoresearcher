idea:
  id: IDEA-20260809-2b4624
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Does the secret's distribution move the transition? Fixed-weight, ternary and
    small-Gaussian secrets at matched dimension and modulus
  class: measurement
  claim: >-
    Deployed NTRU variants differ in how the secret is sampled — fixed weight
    versus unconstrained ternary among them — and the fatigue law is stated in
    terms of (n, q) alone. The claim is that the transition location depends
    measurably on the secret distribution at matched (n, q), because the event
    depends on the secret's norm concentration, and that the dependence is large
    enough to matter relative to the law's fitted uncertainty.
  mechanism: >-
    Generate instances differing only in the secret's sampling rule, run the
    identical detector and recovery pipeline, and compare transitions. Norm
    statistics of the sampled secrets are recorded so any shift can be attributed
    to concentration rather than to an implementation difference.
  why_not_a_renamed_known_approach: >-
    Secret distribution is known to affect lattice attack difficulty generally.
    The specific question — does it move the OVERSTRETCHED TRANSITION, which is a
    structural event rather than a difficulty gradient — is not answered by that
    general knowledge and is what the experiment isolates.
  predictions:
  - observable: transition location per secret distribution at matched (n, q)
    metric: log q difference with interval
    predicted: >-
      Fixed-weight secrets shift the transition relative to unconstrained ternary,
      in the direction predicted by their norm concentration. No shift would mean
      the law's (n, q)-only form is adequate, which is a clean and useful result.
  - observable: correlation between secret norm and per-instance recovery
    metric: correlation coefficient within a cell
    predicted: Positive and material; absence of correlation within a cell would undermine the mechanism proposed for any observed shift.
  minimal_test: >-
    Three secret distributions at one dimension, q swept across the transition,
    twenty instances per cell, with per-instance norms recorded and both the
    across-cell shift and the within-cell correlation reported.
  controls:
  - 'SAMPLER VALIDATION: each sampler is validated against its specification''s expected weight or variance before use; a mis-specified sampler manufactures a distribution effect out of nothing.'
  - 'MATCHED PIPELINE: identical reduction parameters across distributions.'
  falsification_conditions:
  - No transition shift beyond the pre-declared threshold across distributions.
  - No within-cell norm correlation, removing the proposed mechanism for any shift observed.
  interpretation_limits: >-
    Toy dimension; a measured shift is a property of the event at those
    parameters and carries no verdict about deployed variants.
  sota_delta: 'No attack. Delta: a dependence the published law does not carry, measured at matched parameters.'
  dominated_by: Not dominated by any corpus record; complements IDEA-20260809-263751 (ring shape) by varying the other input.
  estimated_cost: Implementation small; compute moderate.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for fixed-weight secrets: no NTRU records. WEB NOT CHECKED.'
  source_refs:
  - NTRU and NTRU Prime submission specifications -- REQUIRED READS.
