idea:
  id: IDEA-20260820-cf1215
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Cross-domain transcript contraction under a domain-tag alias fault, provenance-corrected
  class: control
  corrects: IDEA-20260820-44fa5a
  supersedes: IDEA-20260820-44fa5a
  correction_scope: >-
    Preserves the predecessor's one-boundary tag-alias oracle, distance-contraction
    observables, and equal-length controls. It repairs citation provenance and
    replaces unsupported GRH language by the exact inherited-reduction caveat.
  claim: >-
    For two fixed public signing domains, aliasing the encoded domain tag at one
    declared hash or sampler boundary can contract their conditional public
    transcript laws if that boundary propagates to a published field. The claim is
    a bounded distributional test, not key recovery, forgery, timing, length, or SSI evidence.
  mechanism: >-
    O_tag_alias(d0,d1,b) replaces d1 by d0 only at boundary b, holding messages,
    public keys, serialization, and output shape fixed. Compare cross-domain MMD,
    domain-label AUC, labelled challenge collisions, and verifier-stratum
    transitions. A live aliased derivation may collapse part of the separation
    between P(T|d0) and P(T|d1).
  novelty_status: unverified
  status: proposed
  source_refs:
    - {id: RQ-SQISIGN-001, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-057, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-058, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: IDEA-20260820-44fa5a, provenance: internal, verified_by: TASK-20260820-922be8}
    - id: Fiat-Shamir domain-separation analyses, exact primary source not retrieved
      provenance: recalled
      verified_by: null
  novelty_screen:
    method: Screened 28 current direct-tree RQ-SQISIGN-001 proposals; persistent search_knowledge was unavailable.
    verdict: Unverified; direct-tree distinction cannot establish literature novelty.
  predictions:
    - metric: domain-label AUC distance from chance
      direction: lower
      minimum_effect: contraction >= 0.08 with 95% bootstrap confidence
    - metric: cross-domain MMD squared
      direction: lower
      minimum_effect: relative contraction >= 25% with corrected p < 0.01
    - metric: true-simulator no-fault null
      direction: different
      minimum_effect: remain inside the central 95% preregistered band
  minimal_test:
    design: >-
      Freeze two equal-length domain strings and one boundary; compare ordinary
      signing, O_tag_alias, a genuine simulator, and a positive that copies one
      labelled challenge field across domains in 20% of samples.
    controls:
      - True-simulator no-fault null with distinct public domains.
      - Real-signer no-fault null.
      - Equal-length nonaliasing replacement d1 to fresh d2.
      - Twenty-percent cross-domain copied-field positive.
    required_metrics: [domain_AUC, MMD_squared, collision_matrix, verifier_stratum_matrix]
  controls:
    - Genuine simulator matched in public inputs, shape, parsing, and sample count.
    - Planted alias strength swept from 0.02 through 0.20.
    - Second domain pair held out from feature selection.
    - No timing, retry, length, power, cache, or branch observation.
  falsification_conditions:
    - Neither AUC nor MMD contracts at the registered threshold while planted-positive power is >= 0.90.
    - Equal-length nonaliasing replacement produces an equal or larger effect.
    - Parser imbalance, shape mismatch, or true-simulator miscalibration invalidates the test.
  confounders:
    - Message-population imbalance can mimic domain separation.
    - Unequal encodings can leak the arm without changing semantics.
    - Acceptance conditioning can alter retained populations.
    - The selected tag may be overwritten downstream.
  interpretation_limits:
    - A contraction is not a nonce-reuse, recovery, or forgery result.
    - Only one boundary, implementation, and domain pair are tested.
    - GOAL-SSI-001 remains outside scope.
  fault_oracle:
    name: O_tag_alias
    intervention: Replace one domain-tag encoding by another at one declared derivation boundary.
    exposed: Published transcripts and ordinary verification/rejection.
    excluded: [time, retry_count, signature_length, internal_state, power, cache, branch_trace]
  heuristic_assumptions:
    - id: H1
      statement: The chosen boundary consumes two unambiguous distinct domain encodings and influences a published-field law.
      rigorous_support: Encoding distinctness is exactly checkable; public propagation is implementation-specific.
      validation_plan: Confirm declared public-dataflow reachability, then blind internal labels before statistics.
    - id: H2
      statement: Aliasing contracts at least one frozen public-transcript distance.
      rigorous_support: Exact only for the planted copied-field mixture.
      validation_plan: Calibrate AUC and MMD over mixture weights 0.02 through 0.20.
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known: Not a solver; KN-TECH-058 separates unconditional Fp2 p^(1/2)(log p)^O(1) time with polynomial memory from p^(1/3+o(1)) time and memory conditional on Heuristic 1.
    hidden_overhead: Linear MMD is O(Nd), exact MMD O(N^2); the conditional SSI tier hides superpolynomial overhead and has no concrete-performance conclusion.
    tradeoff_note: Feature dimension trades sample complexity against memory; the inherited reduction cascade is unverified here and no GRH claim is made.
  cost_model:
    time: O(Nd) linear-MMD audit, with O(N^2) confirmation only after survival
    memory: O(Nd) batch storage or O(d) streaming means
    data_or_queries: 4N transcripts per domain pair
    preprocessing: Freeze domains, boundary, parser, feature map, and held-out split
    oracle: One semantic tag replacement, exposing no side-channel or secret
    verification: O(N) standard verification plus independent metric recomputation
  proof_search_map:
    exact_baseline_reproduction: Reproduce no-fault domain separation and true-simulator calibration before fault-arm inspection.
    observation_collision_search: Test message imbalance, tag length, parser behavior, and acceptance conditioning for the same contraction.
    quantifier_order: For every fixed toy implementation, domain pair, boundary, feature map, and N, probability is over preregistered messages and seeds.
    method_ceiling: Can certify only response of the public law to this intervention.
    nearby_object_control: Replace d1 with equal-length d2 distinct from d0.
