idea:
  id: IDEA-20260809-58122c
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    A concurrency scheduler that explores interleavings adversarially, so that
    "we tested concurrent sessions" becomes a stateable coverage claim
  class: tooling
  claim: >-
    Attacks in this family depend on the ORDER in which sessions are opened,
    advanced and closed, and testing usually means running a few interleavings by
    hand. The claim is that the interleaving space for a bounded number of
    sessions and rounds is finite and enumerable, that a scheduler can explore it
    systematically, and that coverage of that space can be reported as a number —
    turning every negative result in this goal from anecdote into a bounded
    statement.
  mechanism: >-
    Model each session as a state machine and the adversary as a scheduler
    choosing which session advances. For small session and round counts the
    interleaving space is enumerable exhaustively; beyond that the scheduler
    samples with a declared strategy and reports the fraction covered.
  why_not_a_renamed_known_approach: >-
    Systematic concurrency testing is standard in distributed-systems engineering
    and essentially absent from cryptographic protocol experiments, where
    concurrency is usually simulated with a fixed script. The transfer is the
    idea; the deliverable is the coverage number attached to every negative.
  predictions:
  - observable: size of the interleaving space versus session and round counts
    metric: exact integer where enumerable
    predicted: Exhaustively enumerable for the small configurations the attacks need, which is what makes the coverage claim exact rather than statistical.
  - observable: whether any attack succeeds only under specific interleavings
    metric: fraction of interleavings under which each attack succeeds
    predicted: >-
      Yes for at least one attack -- and if an attack succeeds under only a
      narrow set of interleavings, that fraction is the honest statement of its
      reachability, which a scripted test would have reported as a plain success.
  minimal_test: >-
    Implement the scheduler, enumerate exhaustively for the smallest
    configuration, run each attack under every interleaving, and report per-attack
    success fractions plus the coverage figure for larger configurations.
  controls:
  - 'DETERMINISM CONTROL: every interleaving is reproducible from its schedule identifier, or coverage claims are not checkable.'
  - 'KNOWN-SUCCESS CONTROL: an attack known to succeed must be found by the scheduler, confirming the exploration reaches the relevant region.'
  falsification_conditions:
  - The interleaving space is not enumerable even at the smallest useful configuration, in which case coverage is statistical and must be reported as such.
  - The scheduler fails to rediscover a known success.
  interpretation_limits: >-
    Coverage is over a modelled interleaving space, not over real-world
    concurrency, which includes timing and network effects this model omits.
  sota_delta: 'No attack. Delta: bounded negatives, which this program''s rules require and which scripted concurrency tests cannot provide.'
  dominated_by: Not dominated by any corpus record; supports every attack record in the goal.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for interleaving/scheduler: no records. WEB NOT CHECKED.'
  source_refs:
  - Protocol specifications under test -- REQUIRED READS.
