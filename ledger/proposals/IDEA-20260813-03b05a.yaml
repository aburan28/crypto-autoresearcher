idea:
  id: IDEA-20260813-03b05a
  question_id: RQ-UOV-001
  added: '2026-08-13'
  title: >-
    A NIST SECURITY CATEGORY IS A QUANTUM STATEMENT AND EVERY UOV COST IN THIS
    CORPUS IS CLASSICAL: no record costs the intersection attack against a
    quantum adversary, so the program cannot presently check a category claim at
    all -- derive the quantum accounting, and find where Grover does and does
    not apply inside the attack's own stages
  class: cost-model

  claim: >-
    (A) THE UNIT MISMATCH. NIST's security categories are defined by the
    resources needed to attack a reference primitive -- category 1 by key search
    on a 128-bit block cipher, and so on -- and those reference attacks are
    stated for adversaries WITH quantum access. A parameter set claiming a
    category is therefore making a quantum-relative claim. Every UOV cost this
    program holds is classical: across the fourteen proposals citing RQ-UOV-001,
    "Grover" appears ZERO times, and the six that mention "quantum" do so in
    passing rather than costing anything. So this corpus cannot presently
    evaluate a UOV category claim in the units the claim is made in, and that is
    a gap in the calibration RQ-UOV-001 exists to perform, not a separate topic.

    (B) WHY THIS IS NOT JUST "DIVIDE THE EXPONENT BY TWO". The intersection
    attack is not one search. It is a pipeline -- build a system, solve it,
    recover the space, verify -- and Grover applies to some stages and not
    others:
      S1 EXHAUSTIVE SEARCH SUB-STEPS (guessing vinegar values, sampling
         candidate subspaces) are unstructured search and take the Grover
         square root, subject to the usual caveats about parallelisation, which
         is where a naive halving overstates the gain: Grover parallelises
         poorly, so P processors buy sqrt(P) rather than P.
      S2 LINEAR ALGEBRA over F_q has no generic quantum speedup of consequence;
         quantum linear-system algorithms carry conditions and output
         restrictions that do not match "recover this kernel explicitly".
      S3 GROEBNER / SOLVING-DEGREE STAGES are the ones with no accepted quantum
         accounting at all. Whether the solving stage admits any speedup is an
         open modelling question, and the honest treatment is a BRACKET -- cost
         it both with no speedup and with a stated optimistic assumption, and
         report both columns.
    So the deliverable is a per-stage table with the applicable model named per
    stage, not a single number, and the width of the bracket at S3 is itself
    the finding.

    (C) THE CLAIM. Under the standard quantum cost conventions this program
    already records for other primitives (KN-TECH-037 for elliptic curves,
    KN-TECH-051 for CSIDH, and the memory-charging discipline of KN-TECH-035),
    a per-stage quantum accounting of the intersection attack yields a category
    margin that differs materially from the classical margin, and the direction
    depends on which stage dominates. If S1 dominates classically, the quantum
    margin shrinks by close to a square root and the category claim is under
    more pressure than the classical number suggests. If S3 dominates, the
    margin barely moves and the classical number is nearly the right answer.
    WHICH STAGE DOMINATES IS MEASURABLE at toy scale from the classical profile
    already being gathered by IDEA-20260801-014 and IDEA-20260805-ca92fd, so
    this record consumes their output rather than requiring new solving runs.

    (D) THE DEPTH CONSTRAINT, WHICH IS WHERE MOST QUANTUM CLAIMS QUIETLY DIE.
    NIST's formulation includes a maximum-depth parameter, and a Grover speedup
    that needs depth beyond the limit does not deliver its nominal advantage:
    under a depth cap the effective gain degrades toward the classical figure.
    Any quantum UOV cost must therefore be reported at the declared depth caps,
    not only in the idealised unbounded-depth model. This program has the
    machinery in KN-TECH-051's resource-constrained dispute and has never
    pointed it at a multivariate scheme.

    (E) WHAT THIS IS NOT. NOT a claimed quantum attack, NOT a claim that UOV
    misses its categories, and NOT a new quantum algorithm. It is an accounting
    the corpus lacks, with an explicit bracket where the accounting is genuinely
    unknown. RQ-UOV-001.provenance records that the Round-3 specification and
    its category claims are UNREAD, so the target numbers themselves are
    research targets.

  discriminated_from:
    - >-
      IDEA-20260805-69af7c, which charges the memory the UOV key-recovery model
      never charges. Same spirit -- an uncharged axis -- on a different axis.
      This record adopts its charging discipline and extends it to the quantum
      column rather than duplicating it.
    - >-
      IDEA-20260801-014 and IDEA-20260805-ca92fd, which measure classical attack
      cost and solving degree. This record CONSUMES their stage profile to
      decide which stage dominates, and produces no new solving measurements of
      its own. If neither is run, this record cannot fill its S3 bracket and
      says so.
    - >-
      KN-TECH-037 (quantum ECDLP resource estimation) and KN-TECH-051 (quantum
      cost models for CSIDH, and the resource-constraint dispute). Both are
      quantum cost machinery this program already holds, for other primitives.
      This record is their first application to a multivariate scheme; the
      conventions are reused, not invented.
    - >-
      "Grover" returns ZERO hits among the 14 RQ-UOV-001 proposals and 11
      repository-wide, none multivariate.

  object_first_candidate:
    tracked_object: >-
      THE PER-STAGE COST VECTOR of the intersection attack: (S1 search, S2
      linear algebra, S3 solving), each with its applicable quantum model and
      its depth requirement.
    lossiness: >-
      The usual single-number summary collapses the vector to a scalar and
      discards exactly the information that decides the quantum answer -- which
      stage dominates. Keeping the vector is the record's methodological point.
    propagation: >-
      The vector propagates across parameter sets: the same stage decomposition
      applies at every (q, v, m), with only the weights changing. That is what
      makes a single table reusable across all declared parameter sets.
    survival_score: >-
      Survives every parameter change. Dies only if the attack pipeline itself
      is restructured, which is what a genuinely new attack would do.

  mechanism: >-
    STEP 0 -- ACQUISITION GATE. Two documents are needed: the Round-3
    specification with its category claims, and the NIST category definitions
    with their depth parameters. RQ-UOV-001.provenance records that NIST is
    unreachable from this harness (proxy CONNECT 403) and the bundle is unread.
    Without the category definitions there is no target to compare against and
    the record halts at Stage 0, at zero compute.
    STEP 1 -- STAGE DECOMPOSITION, WHICH NEEDS NO QUANTUM ANYTHING. Write the
    intersection attack as an explicit pipeline and assign each stage its
    classical cost from the profile IDEA-20260801-014 and IDEA-20260805-ca92fd
    produce. Identify the dominant stage per parameter set. This is where the
    answer is largely determined and it is classical work.
    STEP 2 -- ASSIGN A QUANTUM MODEL PER STAGE, with the convention named from
    KN-TECH-037 / KN-TECH-051, and with S3 left as an explicit BRACKET rather
    than a guess. A bracket reported as a bracket is honest; a bracket collapsed
    to its optimistic end is the failure mode this record exists to prevent.
    STEP 3 -- APPLY THE DEPTH CAP. Recompute S1's effective gain under each
    declared maximum depth. Report the idealised and depth-capped figures in
    separate columns, never combined.
    STEP 4 -- THE MARGIN TABLE. For each parameter set: classical cost, quantum
    cost at unbounded depth, quantum cost at each depth cap, the claimed
    category, and the margin under each. Every optimistic assumption listed with
    its direction of bias, per the cost-model discipline.

  novelty_status: unverified
  novelty_screen:
    method: >-
      grep -ril for "Grover", "quantum", "depth", "MAXDEPTH", "security
      category", "category 1" over ledger/proposals and knowledge/, 2026-08-13
      at 8e230f800, plus a targeted sweep of the 14 RQ-UOV-001 proposals.
    results: >-
      "Grover": ZERO among the 14 UOV proposals, 11 repository-wide and none
      multivariate. "quantum": 6 of the 14 mention it, none costs anything with
      it. Quantum cost machinery exists at KN-TECH-037 and KN-TECH-051 for
      elliptic-curve and isogeny primitives and has never been applied to a
      multivariate scheme in this corpus.
    verdict: >-
      UNVERIFIED. Grover, its parallelisation penalty, and the depth-cap
      critique are all standard, and NONE is claimed as new. The published UOV
      submissions certainly state quantum security arguments; this program has
      not read them, so no novelty against the literature is claimed. What is
      claimed is that this corpus cannot currently check a category claim for
      UOV because it holds no quantum accounting, which is a statement about
      this corpus and is verifiable by the grep above.

  null_object_control: >-
    (1) CLASSICAL-REPRODUCTION CONTROL, BLOCKING: setting every stage's quantum
    model to "no speedup" must reproduce the classical cost EXACTLY, per
    parameter set. If it does not, the stage decomposition does not sum to the
    cost it decomposes and the table is arithmetic fiction before any quantum
    factor is applied.
    (2) KNOWN-ANSWER CONTROL, BLOCKING: apply the identical machinery to a
    primitive whose quantum cost this program already records -- an
    elliptic-curve instance under KN-TECH-037, or CSIDH under KN-TECH-051 -- and
    require it to reproduce the recorded figure. A quantum-costing pipeline that
    cannot reproduce a cost the corpus already holds is not evidence about UOV.
    (3) DEPTH-LIMIT SANITY: as the depth cap tends to infinity the capped figure
    must converge to the unbounded figure, and as it tends to the classical
    depth it must converge to the classical cost. Both limits are derivable and
    a table that fails either is wrong.

  assumptions:
    - >-
      NIST category definitions and their depth parameters as commonly stated.
      UNVERIFIED -- NIST is unreachable from this harness per
      RQ-UOV-001.provenance -- and Stage 0 must obtain them or the record halts.
    - >-
      The intersection attack decomposes into the stages named. This is a
      modelling choice and a different decomposition gives a different table;
      the decomposition is declared and frozen before any number is computed.
    - >-
      Grover's parallelisation penalty (P processors buy sqrt(P)) applies to S1.
      Standard, recalled, and named as an assumption because dropping it is the
      most common way a quantum estimate is overstated.
    - >-
      S3 has no accepted quantum accounting. Stated as an open modelling
      question and carried as a bracket, never resolved by assumption.

  proof_search_map:
    bottleneck: >-
      Which stage dominates the classical cost at each parameter set. If S1
      dominates the quantum margin moves a lot; if S3 dominates it barely moves.
      That single fact determines the answer and it is classical, measurable,
      and already being gathered by two other proposals.
    baseline_embedding:
      parameter_slice: >-
        The no-speedup column, which must equal the classical cost exactly.
      reproduction_check: >-
        Exact arithmetic identity per parameter set, plus reproduction of a
        recorded quantum figure for a different primitive via the known-answer
        control.
    observation_collision:
      observable: the quantum cost figure for a parameter set
      distinct_preimage_search: >-
        Required and sharp: two different stage decompositions, or two different
        S3 bracket choices, producing the SAME headline figure. Such a collision
        shows the headline is insensitive to the modelling choice that is
        genuinely unknown -- which would be reassuring -- while its absence
        shows the figure is driven by the bracket, in which case the bracket
        width and not the figure is the honest deliverable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure charging each pipeline stage separately, with its
          own quantum model and depth requirement, summed only over
          proved-disjoint stages.
        predicted_gain: >-
          A table whose every entry is attributable, and a bracket that is visible
          rather than averaged into a single misleading number.
      - transform: boundary_lift
        proposed_object: >-
          Extend the classical cost model to a (depth cap, cost) frontier rather
          than a point, so the category comparison is made at the depth the
          category actually specifies.
        predicted_gain: >-
          Makes the comparison unit-correct, which is the whole point of (A).
    quantifier_order: >-
      The claim to be careful with: a category claim asserts FOR ALL adversaries
      within the stated resource bounds, the attack costs at least the reference.
      A quantum cost estimate establishes EXISTS an adversary costing this much
      -- an upper bound on the best attack, hence a lower bound on nothing. So
      this record can only ever PRESSURE a category claim, never confirm one,
      and the write-up must not invert that.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under these named conventions, at this depth cap, with S3 bracketed
        this way, the intersection attack costs X against a quantum adversary,
        versus a category target of Y." NEVER "UOV meets category N", which is a
        universal statement no cost estimate can establish.
      nearby_object_control: >-
        A primitive with a recorded quantum cost in this corpus. The machinery
        must reproduce it. This is the known-answer control and it is what
        separates a costing from an assertion.
    proof_obligations:
      - claim: The no-speedup column reproduces the classical cost exactly.
        responsibility: baseline
      - claim: The machinery reproduces a recorded quantum figure for another primitive.
        responsibility: correctness
      - claim: The depth-capped figure converges correctly in both limits.
        responsibility: correctness
      - claim: S3 is reported as a bracket, never a point.
        responsibility: interface
      - claim: A cost estimate is not reported as a category confirmation.
        responsibility: scope

  predictions:
    - metric: dominant stage of the classical intersection attack, per parameter set
      direction: different
      minimum_effect: >-
        A single stage accounting for more than half the classical cost at each
        set. If no stage dominates, the quantum margin is a blend and the
        bracket widens accordingly -- reported, not resolved.
    - metric: >-
        ratio of quantum to classical cost at unbounded depth, per parameter set
      direction: lower
      minimum_effect: >-
        Between the square root (S1 fully dominant, full Grover) and 1 (S3
        fully dominant, no speedup). Any figure outside that interval is an
        arithmetic error and halts the run, since the interval is forced by the
        stage model.
    - metric: >-
        width of the S3 bracket as a fraction of the headline figure
      direction: different
      minimum_effect: >-
        Reported explicitly at every parameter set. A bracket wider than the
        margin to the category target means the corpus cannot decide the
        category claim, and SAYING SO is the deliverable rather than picking an
        end of the bracket.
    - metric: known-answer control against a recorded quantum figure
      direction: different
      minimum_effect: >-
        Reproduced within the tolerance the source figure carries, or no UOV
        number may be reported.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): obtain NIST category definitions with
      depth parameters and the UOV category claims; file both as KN-LIT. Halt if
      unobtainable and report the halt, which is the same acquisition wall
      IDEA-20260807-f73d98 documents.
      STAGE 1 (zero compute): declare and freeze the stage decomposition;
      populate classical stage costs from IDEA-20260801-014 and
      IDEA-20260805-ca92fd, or record that they are unavailable and stop.
      STAGE 2 (HARD GATE): the classical-reproduction control and the
      known-answer control on a recorded primitive.
      STAGE 3 (zero compute): assign quantum models per stage; carry S3 as a
      bracket; apply Grover's parallelisation penalty explicitly.
      STAGE 4 (zero compute): depth-capped columns and the limit sanity checks.
      STAGE 5: the margin table, with every optimistic assumption listed with
      its direction of bias.
    controls:
      - no-speedup column must equal classical cost exactly (BLOCKING)
      - known-answer reproduction of a recorded quantum figure (BLOCKING)
      - depth-limit convergence in both directions
      - the frozen stage decomposition, declared before any number is computed
    required_metrics:
      - per-stage classical cost and the dominant stage, per parameter set
      - per-stage quantum model named, with its citation
      - quantum cost at unbounded depth and at each declared depth cap
      - S3 bracket endpoints and the bracket width as a fraction of the headline
      - margin to the claimed category under each column
      - the optimistic-assumption list with direction of bias

  falsification_conditions:
    - >-
      The no-speedup column does not reproduce the classical cost. The
      decomposition is wrong; nothing quantum may be reported.
    - >-
      The known-answer control fails. The machinery is not validated and no UOV
      figure is admissible.
    - >-
      A quantum-to-classical ratio falls outside [square root, 1]. Arithmetic
      error, forced by the stage model; halt.
    - >-
      The S3 bracket is wider than the margin to the category target. The corpus
      cannot decide the category claim with present knowledge, and that is the
      honest reported outcome rather than a reason to narrow the bracket by
      assumption.

  confounders:
    - >-
      Collapsing the S3 bracket to its optimistic end. The single most likely
      way this record produces an overstated result, and the reason S3 is
      carried as a bracket in every column.
    - >-
      Ignoring Grover's parallelisation penalty, which turns a realistic
      estimate into an idealised one and is the standard overstatement.
    - >-
      Comparing an unbounded-depth quantum figure against a category defined
      with a depth cap. That is the unit error the record exists to fix, and it
      would be self-defeating to commit it.
    - >-
      Treating an upper bound on attack cost as a confirmation of security. The
      quantifier note in the proof_search_map exists for this and it is repeated
      in interpretation_limits.

  interpretation_limits:
    - >-
      A cost estimate can pressure a category claim, never confirm one. No
      output of this record may be phrased as "UOV meets category N".
    - >-
      Every figure is conditional on the frozen stage decomposition and the
      named per-stage conventions; a different decomposition gives a different
      table and the record does not claim its own is canonical.
    - >-
      S3 has no accepted quantum accounting. Any headline number carries that
      bracket and is meaningless without it.
    - >-
      Category definitions and UOV's claims are unread until Stage 0; this is a
      proposal, not a finding.

  heuristic_assumptions:
    - id: HEUR-UOVQ-1
      statement: >-
        The unstructured-search sub-steps of the intersection attack (S1) admit
        a Grover speedup of exactly the square root in query count, degraded by
        sqrt(P) rather than P under P-fold parallelisation and further degraded
        under a maximum-depth cap D to a factor that interpolates monotonically
        between the square root at unbounded D and 1 at classical depth.
      rigorous_support: >-
        Rigorous: Grover's query optimality for unstructured search, and the
        known parallelisation penalty. Heuristic: that the attack's S1 sub-steps
        are genuinely unstructured from the quantum algorithm's perspective --
        if they carry structure, the speedup could be better or the oracle more
        expensive, and either breaks the clean square root.
      validation_plan: >-
        No quantum hardware is available and none is assumed. Validation is by
        CONSISTENCY rather than execution: reproduce, with the identical
        machinery and conventions, a quantum figure this corpus already records
        for another primitive (KN-TECH-037 elliptic-curve, or KN-TECH-051
        CSIDH), and check the depth-cap interpolation against the two derivable
        limits. Comparison: the recorded figure and its stated tolerance. Tail
        check: the depth cap at which the capped figure ceases to differ from
        classical, which is a derivable crossover and a strong check on the
        interpolation. Explicitly NOT an empirical validation of Grover's
        applicability, which this harness cannot perform, and that limit is
        stated in the deliverable.

  target_complexity:
    time_exponent: >-
      Bounded, by the stage model, between the classical exponent (S3 dominant,
      no speedup) and half of it (S1 dominant, full Grover at unbounded depth).
      The record's output is WHERE IN THAT INTERVAL each parameter set sits,
      with a bracket, not a new attack exponent -- and no attack is proposed.
    memory_exponent: >-
      Charged per stage under KN-TECH-035 discipline; the quantum column does
      not get to omit memory that the classical column charges, which is a
      common asymmetry in published comparisons and is prohibited here.
    best_known: >-
      Classical: the intersection-attack family per RQ-UOV-001.targets. Quantum:
      NOTHING IS RECORDED IN THIS CORPUS, which is the gap the record addresses;
      the published submissions state quantum arguments this program has not
      read.
    hidden_overhead: >-
      The S3 bracket and the depth cap. Both are disclosed as columns rather
      than folded into a headline, because folding them is exactly how a quantum
      margin gets overstated.
    tradeoff_note: >-
      The depth cap IS a tradeoff axis and is reported as one, with the capped
      and uncapped columns kept separate.

  dominated_by: >-
    As an ATTACK: mounts none; dominated on every axis by the classical
    baselines in RQ-UOV-001.targets, and by any published quantum analysis this
    program has not read.
    As a COST-MODEL contribution: dominated by IDEA-20260801-014 and
    IDEA-20260805-ca92fd on priority, since this record CONSUMES their stage
    profile and cannot be completed without it -- it should be scheduled after
    them, not instead of them. Dominates them on nothing except covering the
    unit in which category claims are actually stated.
  sota_delta: >-
    Zero speedup. Deliverable as numbers: the first quantum accounting of a
    multivariate attack in this corpus, where "Grover" currently returns zero
    hits across all fourteen UOV proposals; a per-stage table with the quantum
    model named and cited per stage; an explicit S3 bracket whose width is
    reported as a fraction of the margin, so the corpus can say when it CANNOT
    decide a category claim; and depth-capped columns, without which a category
    comparison is unit-incorrect.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.6 that Stage 0 can obtain the category definitions given the recorded
    proxy block on NIST -- this is the largest single risk and it is an
    acquisition risk, not a research one. 0.85, conditional on Stage 0, that the
    stage decomposition reproduces the classical cost and the known-answer
    control passes. 0.5 that the S3 bracket turns out narrower than the margin,
    i.e. that the corpus can actually decide the category question; if it is
    wider, saying so precisely is still the useful output and is the branch this
    record is designed to report honestly.

  id_allocation_provenance: >-
    python3 tools/allocate_id.py --next idea --date 20260813, then --check
