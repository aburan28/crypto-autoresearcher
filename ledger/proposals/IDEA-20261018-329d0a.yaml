idea:
  id: IDEA-20261018-329d0a
  question_id: RQ-KIC-7502b9
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Frobenius-stable multiplicative-subgroup bases (x^d = 1): an O(1)-description
    stable lane at prime degrees where the stable-subspace lane is empty
  class: representation
  claim: >-
    (A) For n prime and d dividing 2^n-1, S_d (the set of x with x^d = 1) is
    closed under squaring (tau) and, for b = 1, under x -> 1/x (translation by the
    2-torsion point); every non-identity orbit of <2,-1> on Z/d has size 2n. B_d
    (the points P of G with x(P) in S_d) is tau-stable, described by (n, modulus,
    d), tested by one exponentiation (Boolean degree = binary weight of d) and
    enumerated by powers of a generator at one multiplication per element.
    (B) Lane census (factorizations recalled, to verify): the subspace lane needs
    ord_n(2) < n-1, the mu_d lane needs 2^n-1 composite. n=7, 17: subspace only;
    n=11: mu only (d = 23, 89); n=13, 19: neither; n=23: both (47, 178481); n=29:
    mu only (233, 1103, 2089); n=131: d = 263 or a 123-bit cofactor, no balanced
    base; n=163: five prime factors of 17 to 65 bits, balanced bases exist where
    KN-FIND-b9a41d empties the subspace lane. (C) The G-filtered B_d has coverage
    equal to the IDEA-20261018-5f37a1 orbit-class null within 2 sd and to a
    random stable union of equal class count, so no yield is lost. (D) In
    S_3 = e2^2 + e3 + b the term e3 = x1 x2 x3 stays in S_d; a deviation beyond 3
    sd is a multiplicative-additive interaction this lane can detect.
  mechanism: >-
    OBJECT FRAME. Pair (R1 x-coordinates in a multiplicative subgroup; Sigma =
    <tau, T-translation> acting as multiplication by <2,-1> on Z/d). Class I
    partial-action. Lossy test against Sigma: P -> class of x(P) mod <2,-1>
    discards shift and sign (2n-to-1); compatible since tau and T act as x -> x^2
    and x -> 1/x; the logarithm in Z/d is never computed. Priced number:
    canonicalisation by minimal normal-basis rotation (O(n) word operations) plus
    description, membership, lift and enumeration costs against an explicit list
    of K*2n*n bits. G filter: Tr(x) = Tr(a) for h = 2; h = 4 uses the 4E
    criterion of IDEA-20261017-3db2a8. KN-OPEN-020 class: implicit membership
    (power test), high degree but binomial; no escape claimed. Descended SAT
    blocks have n bits, not l, so this lane serves meet-in-the-middle and table
    attacks. Stage: factor-base membership and description.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260930-bbef7f
      provenance: internal
      claim: Uses cosets c*mu_d at n=11, 23 with a slope join; stability, census and null not addressed.
      verified_by: idea-generator, record read in full
    - ref: IDEA-20261017-3db2a8
      provenance: internal
      claim: P in 4E iff Tr(u) = 0 for u^2 + x_P u + B = 0 on h = 4 curves.
      verified_by: idea-generator, grep excerpt only
    - ref: Cunningham tables of 2^n-1
      provenance: recalled
      claim: factorizations used in the census (2^163-1 has five prime factors)
      verified_by: null
  predictions:
    - metric: coverage z of B_d against the orbit-class null, n=23 and n=29 cells
      direction: different
      minimum_effect: "absolute value at most 2"
    - metric: coverage gap of B_d to a random stable union of equal class count
      direction: lower
      minimum_effect: "within 2 sd"
    - metric: description bytes and construction cost per accepted point against an explicit list
      direction: lower
      minimum_effect: "O(n) bytes against K*2n*n bits; cost within 2x of a random orbit seed"
  minimal_test:
    design: >-
      Stage 0 (no curve arithmetic): factor 2^n-1 for primes n <= 200, tabulate
      d, size, binary weight of d, ord_n(2), stable-subspace dimensions and
      balanced (m,d) with lam near 1; verify n=131, 163 by multiplication and
      primality test. Stage 1: exact enumeration at n=23 (m=2; mu_47 and
      mu_178481 against ker g(tau) of dimension 11, 12) and n=29 (m=3; d = 2089,
      1103): coverage against the null, a random stable union and an explicit
      list of equal class count. Stage 2: charged cost per base point.
    controls: [random stable union, explicit list, subspace lane at n=23, relabelled Z/r null]
  falsification_conditions:
    - "Coverage z beyond 3 for B_d but not for random stable unions: multiplicative closure biases S_3 solutions."
    - A census entry fails the multiplication or primality check.
    - Construction cost per accepted point (power step, trace test, lift) above 2x a random orbit seed.
  confounders: [n=11 has 45 target classes so saturation dominates, the G filter halves the S_d points, T-closure fails after the G filter (partner coset)]
  interpretation_limits: [toy cells, base sizes limited to divisors of 2^n-1, no SAT claim, no attack]
  heuristic_assumptions:
    - id: H1
      statement: >-
        The multiplicative index of x in S_d and the discrete log of P in G are
        independent modulo <lambda,-1>, so B_d behaves as a random stable union.
      rigorous_support: >-
        Character sums over multiplicative subgroups are small when d exceeds
        2^(n/2) (Shparlinski-type bounds, recalled); imitates uniform residues.
      validation_plan: >-
        Coverage z in 3 cells; E-side and Tr = 1 counts against binomial
        expectation; both tails. No transfer beyond n <= 29.
  target_complexity:
    time_exponent: None moves (rho r^(1/2)); a constant-factor description and membership lane only.
    memory_exponent: description O(n) bits instead of K*2n*n bits; tables unchanged
    best_known: matched signed-Frobenius rho (KR-RHO-482ed3)
    hidden_overhead: base sizes limited to divisors of 2^n-1; at n=131 none is balanced
    tradeoff_note: pool of at most 2^omega divisors, so selection bias is negligible
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
