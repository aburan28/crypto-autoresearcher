  id: IDEA-20261014-5a3847
  title: Completeness-aware conductor inference from Hom forms and product graphs
  question_id: RQ-ENDO-73c60f
  goal_id: GOAL-ENDO-001
  task_id: TASK-20261012-16a86e
  class: control
  claim: Complete Hom forms recover conductor products. Odd cycles give product-only uniqueness; bipartite fibers retain reciprocal
    scaling subject to integrality. Uniformly incomplete bases can pass product-only triangles while failing joint Delta/content
    checks.
  mechanism: Construct Hom independently by containment and norm/covolume; retain basis index and both invariants alongside
    inferred products. Pullback changes Delta by index squared; product consistency alone is not completeness.
  citations:
  - ref: https://doi.org/10.1007/s13348-010-0029-1
    provenance: retrieved
    claim: Corollary42 supplies full-Hom discriminant/content identities; authored text read via paperzz mirror.
    verified_by: /root/lattice_exploration, 2026-10-14; exploration.md receipt
  - ref: IDEA-20260807-3f5545
    provenance: internal
    claim: Conductor-stratification opening claim seen in generated index/adjacent intake; no result inferred.
    verified_by: /root/lattice_exploration, 2026-10-14; exploration.md receipt
  assumptions: [Same supplied K and actual O_f multiplier orders., Complete integral Hom bases and correct degree normalization
      before Kani inference., Product-only graph claims retain their loss of full-form information.]
  proof_search_map:
    bottleneck: Certify actual full Hom; graph consistency cannot do so.
    baseline_embedding:
      parameter_slice: Principal supplied Lambda_i=O_fi, full Hom basis, sublattice matrix I.
      reproduction_check: Derive alpha*Lambda_i subset Lambda_j independently; norm/covolume form must match both Kani invariants.
    observation_collision:
      observable: Pij=Delta/(D_K*content), with graph labels retained.
      distinct_preimage_search: Uniform m-scaled Hom bases yield m²P and recover mf consistently; path products12/18 fit (2,6,3)
        and (6,2,9).
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Store sublattice index, full form, discriminant, content, provenance and graph identifiability class.
      predicted_gain: Exact certificate discrimination; no measured performance gain.
    - transform: observable_fiber
      proposed_object: Bipartite reciprocal valuation shifts and uniformly scaled Hom triangles.
      predicted_gain: Scoped identifiability/collision lemmas for independent review.
    quantifier_order: For every complete edge the identities hold. Every consistent connected odd-cycle product graph has
      at most one positive assignment; bipartite integer fibers may be singleton. Uniqueness does not certify input completeness.
    method_ceiling:
      strongest_certifiable_claim: Supplied-order diagnostics and product-only fiber classification, without actual Hom acquisition.
      nearby_object_control: 'Doubled triangle: product acceptance, joint rejection. Bipartite singleton integer fiber must
        not be called ambiguous.'
    proof_obligations:
    - claim: Norm/covolume form matches independent containment basis and Kani normalization.
      responsibility: baseline
    - claim: Alternating-path valuation propagation and odd-cycle square/root compatibility are exact.
      responsibility: correctness
    - claim: Actual finite-field full Hom basis and actual conductors independently certified.
      responsibility: interface
    not_applicable_reason: null
  predictions:
  - metric: complete_basis_identity_mismatches
    direction: lower
    minimum_effect: exactly zero on valid full-basis fixtures
  - metric: scaled_triangle_joint_invariant_rejection
    direction: different
    minimum_effect: product-only acceptance and joint rejection for every m>1 fixture
  - metric: graph_solution_class
    direction: different
    minimum_effect: exact unique/ambiguous/inconsistent with explicit witnesses
  minimal_test:
    design: 'Frozen coordinator panel: eight D_K, conductors1..12, five basis matrices, triangle/path/even/odd cycles. Independently
      construct containment and norm/covolume; report incomplete inputs separately.'
    controls: [complete bases, unimodular shear, index-two anisotropic basis, uniform doubled basis triangle, non-bipartite
        graph, bipartite ambiguity witness, bipartite singleton boundary, contradictory cycle]
    required_metrics: [basis index, integral form coefficients, discriminant, content, Pij, inferred conductors, Delta/content
        residuals, solution-class witnesses, counted exact operations]
  falsification_conditions: [A complete independently certified basis violates either invariant with correct degree normalization.,
    A consistent odd-cycle product graph has two distinct positive assignments., A doubled-basis triangle passes the joint
      Delta/content test against reconstructed doubled conductors.]
  confounders: [incorrect degree normalization, rational/nonintegral basis mistaken for a Z-basis, forgetting edge completeness,
    labeling all bipartite integer fibers ambiguous]
