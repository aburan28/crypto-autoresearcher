idea:
  id: IDEA-20260815-711932
  question_id: RQ-MONO-001
  added: '2026-08-15'
  title: >-
    THE MONODROMY LANE'S CENSUS RESTS ON FROBENIUS CYCLE TYPES BEING
    ESTIMABLE FROM FINITELY MANY PRIMES: measure the census's own
    convergence before interpreting any monodromy verdict from it
  class: control

  claim: >-
    A Chebotarev-style census estimates a group from cycle-type frequencies
    over sampled primes. How many primes are needed before the estimate
    distinguishes the full symmetric group from a proper subgroup is a
    property of the census, not of the curve. Without it, a monodromy
    verdict may be reporting sampling noise, and the lane has already had
    one census rejected at scope.

  mechanism: >-
    Simulate censuses on covers with KNOWN monodromy groups -- full
    symmetric, a proper transitive subgroup, and an imprimitive one -- and
    measure how many primes are needed to separate them at a stated
    confidence. Compare against the prime counts the lane's protocol
    actually uses.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of DEC-20260810-2f86db and EV-MONO-a0a89c; grep 'Chebotarev',
      'census convergence', 'cycle type'.
    results: >-
      The lane has a census protocol and a scoped rejection; no record
      measures the census's own resolving power against known-monodromy
      covers.
    verdict: >-
      ADAPTATION. Convergence analysis for a Chebotarev census is
      standard; applying it to this lane's protocol before interpreting
      its verdicts is what is missing.

  object_first_candidate:
    tracked_object: >-
      THE CENSUS'S RESOLVING POWER, as the number of primes needed to
      separate candidate monodromy groups.
    lossiness: >-
      A monodromy verdict projects a whole cycle-type distribution to a
      group name, and the resolving power says whether that projection is
      supported by the sample.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives entirely in simulation on known-monodromy covers, so its
      conclusions are about the census rather than about any curve.

  null_object_control: >-
    NULL 1 -- two identical known groups, where no separation should ever be
    claimed; a census separating a group from itself has a false-positive
    problem. NULL 2 -- full symmetric against itself at different sample
    sizes, bounding the estimator's own variance.

  discriminated_from:
    - >-
        The lane's existing census protocol, whose resolving power this
        record measures rather than replacing.
    - >-
        The specialised-fibre record in this series, which changes the
        object censused; this one measures the census instrument
        regardless of object.

  assumptions:
    - >-
        Covers with known monodromy groups are constructible for
        simulation.
    - >-
        The simulated cycle-type sampling matches the lane's actual
        sampling procedure; if it does not, the measured resolving power
        does not apply to the lane.

  predictions:
    - metric: >-
        identical-group null
      direction: different
      minimum_effect: >-
        FORCED: no separation claimed. A separation here is a false
        positive and voids the census.
    - metric: >-
        primes needed to separate full symmetric from a proper
        transitive subgroup
      direction: different
      minimum_effect: >-
        The measurement; compared directly against the lane's actual
        prime counts.
    - metric: >-
        primes needed to detect imprimitivity
      direction: higher
      minimum_effect: >-
        Predicted higher than for the transitive case, since imprimitive
        groups share more cycle types with the full group.

  minimal_test:
    design: >-
      Simulation on three known-monodromy covers plus both nulls.
    controls:
      - >-
          Identical-group false-positive null.
      - >-
          Same-group variance null.
      - >-
          Simulated sampling matched to the lane's actual procedure,
          verified rather than assumed.
    required_metrics:
      - >-
          Primes needed per group-separation task at stated confidence.
      - >-
          False-positive rate under the identical-group null.
      - >-
          Comparison against the lane's actual prime counts.

  falsification_conditions:
    - >-
        The identical-group null yields separations. False-positive
        problem; the census's past verdicts are suspect.
    - >-
        The lane's prime counts fall below the measured requirement. Its
        census verdicts are under-powered and must be re-labelled.
    - >-
        The lane's counts suffice. The census is adequately powered and
        this record retires a worry cheaply.
    - >-
        Simulated sampling cannot be matched to the lane's procedure. The
        measurement does not apply and must say so.

  confounders:
    - >-
        SAMPLING MISMATCH: if the simulation's prime sampling differs from
        the lane's, the measured requirement is about a different census.
    - >-
        GROUP-PAIR SPECIFICITY: resolving power depends on which pair of
        groups is being separated, so a single number would be misleading
        and the results are reported per pair.

  interpretation_limits:
    - >-
        Measures an instrument; produces no monodromy verdict and no
        evidence about any curve.
    - >-
        Scoped to the simulated group pairs and the matched sampling
        procedure.
    - >-
        An adequate-power finding does not validate any past verdict, only
        the sample size behind it.

  heuristic_assumptions:
    - id: HEUR-MONO-CONV-1
      statement: >-
        Simulated cycle-type sampling on known-monodromy covers
        reproduces the statistical behaviour of the lane's Frobenius
        census on real curves.
      rigorous_support: >-
        Rigorous ingredient: the Chebotarev density theorem gives that
        Frobenius cycle types equidistribute according to the Galois
        group's conjugacy classes, which is exactly what the simulation
        samples. THE GAP: convergence is asymptotic in the prime bound,
        and effective error terms over a fixed small curve family are
        not available, so the simulation may converge faster than
        reality.
      falsification_condition: >-
        A real-curve census on a cover of known monodromy needing
        materially more primes than the simulation predicts.
      validation_plan: >-
        SAMPLE: >= 3 group pairs x >= 1000 simulated censuses each, plus
        at least one real-curve validation on a cover whose monodromy is
        known independently. TAIL CHECK: the group pair needing the most
        primes. TRANSFER: the real-curve validation is what makes the
        simulation applicable and is not optional.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Simulation only, plus one real-curve validation.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the lane's census protocol, whose resolving power
      is unmeasured; no convergence analysis exists here.
    hidden_overhead: >-
      Effective Chebotarev error terms over small families are
      unavailable, so the simulation's optimism is unquantified and the
      real-curve validation is the only check.
    tradeoff_note: >-
      More primes buys resolution and costs computation; the record prices
      that before the lane spends on a census whose verdict may not be
      supportable.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a monodromy result: nothing is claimed.
    As a census power analysis: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the number of primes the
    lane's census needs to separate candidate monodromy groups, measured
    against known-monodromy covers and compared with the counts its protocol
    actually uses, plus a false-positive rate for the census itself.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that known-monodromy covers are constructible for simulation. 0.6
    that the simulation's sampling can be matched to the lane's procedure,
    which is the applicability condition. 0.4 that the lane's prime counts
    turn out below the measured requirement, which would re-label its
    verdicts as under-powered.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-MONO-001
    - KN-OPEN-009
    - GOAL-MONO-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
    and verified free with `--check` before use; no state was scanned for a
    "next free number".
