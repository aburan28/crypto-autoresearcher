# IDEA-20261003-3d892e
# Digit-weight count for the integer 7. Proposal only. Not approved.
idea:
  id: IDEA-20261003-3d892e
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The integer 7 has binary weight 3 and non-adjacent weight 2
  class: measurement
  claim: >-
    The integer 7 has binary weight 3. Its non-adjacent digits,
    from low to high, are -1, 0, 0, 1, so that weight is 2. Three
    exceeds two by 1. The product of the two weights is 6. Their
    sum is 5. The gap is a digit weight, not an ECDLP exponent.
  mechanism: >-
    The object is the writing of 7. Binary digits are 1, 1, 1.
    The non-adjacent writing replaces that with -1, 0, 0, 1.
    The integer 1 has binary weight 1 and non-adjacent weight 1,
    so that gap is 0. No curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group lower bound is a different object from a digit weight.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The integer 7 is frozen before the weights are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The weight gap 1.
    baseline_embedding:
      parameter_slice: The integer 7 and the weights 3 and 2.
      reproduction_check: >-
        Two readers must agree that the binary weight is 3 and the
        non-adjacent weight is 2.
    observation_collision:
      observable: The weight gap and the product.
      distinct_preimage_search: >-
        Reporting both weights as 2 drops the gap. The integer 1
        makes that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The integer 7.
        predicted_gain: Integer weights. No addition chain on a curve.
    quantifier_order: >-
      The integer is fixed before the weights.
    method_ceiling:
      strongest_certifiable_claim: >-
        The weights 3 and 2. Not a scalar multiplication.
      nearby_object_control: >-
        The integer 1. Both weights are 1, and the gap is 0.
    proof_obligations:
      - claim: The binary weight of 7 is 3.
        responsibility: size
      - claim: The non-adjacent weight of 7 is 2.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: weight_gap
      direction: different
      minimum_effect: Three exceeds two by 1.
  minimal_test:
    design: >-
      Count the nonzero binary digits of 7 and the nonzero
      non-adjacent digits of 7. Do not add a curve point.
    controls:
      - The integer 1, whose two weights differ by 0.
      - An independent count.
    required_metrics:
      - both weights
      - the gap
      - the product
  falsification_conditions:
    - The binary weight is not 3.
    - The non-adjacent weight is not 2.
  confounders:
    - A different signed-digit convention can change the weight.
  interpretation_limits:
    - A digit weight is not a walk length.
    - No transfer to a cryptographic scalar.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen binary digits of 7 are 1, 1, 1, and the frozen
        non-adjacent digits from low to high are -1, 0, 0, 1.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
