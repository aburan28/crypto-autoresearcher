idea:
  id: IDEA-20260821-c037fc
  question_id: RQ-FRODO-3260cc
  added: '2026-08-21'
  title: >-
    GOAL-FRODO-001 lists "the exact convolution at Frodo's true dimensions exceeds the campaign
    budget" as a PAUSE CONDITION, i.e. it has pre-committed to possibly never doing the thing it
    exists to do - so settle that with an algorithm and a measurement instead of a budget: the
    2n-fold product-convolution is an integer polynomial power with a PROVED coefficient bound, so
    binary exponentiation under multi-modular CRT makes it exact at n = 1344 in gigabytes rather
    than in principle, and the exact-rational Chernoff bound with a RATIONAL base (no
    transcendentals anywhere) is a certified one-sided gate whose looseness against the exact
    answer is the number that decides whether the cheap gate can ever substitute for the run
  class: algorithm
  claim: >-
    (A) THE DISCRIMINATION, STATED FIRST BECAUSE IT IS THE POINT. Two explanations compete for why
    no one re-derives a published decryption failure rate. E1: the exact computation is genuinely
    infeasible in exact arithmetic at standardized dimensions, so floating point is forced and
    published DFRs are unauditable in principle. E2: it is feasible and has simply not been done,
    so the published figures are auditable and the barrier is effort, not mathematics. These
    predict opposite outcomes of a bounded, declared-budget attempt, and this record is designed to
    return whichever is true - including E1, which would be a MEASURED OBSTRUCTION with a number
    (peak memory, wall clock, coefficient bit-length at the halting step) and is a first-class
    deliverable under docs/inventor-protocol.md section 4.
    (B) THE ALGORITHM, WITH ITS SIZE LEMMA. The per-entry decryption error of FrodoKEM is a sum of
    2n independent products of two chi samples, plus one further chi sample; A does not appear.
    Let P(x) be the product distribution's pmf, shifted to non-negative exponents and scaled by
    2^32 so that it is an element of Z[x] with non-negative integer coefficients summing to exactly
    2^32. Then the 2n-fold convolution is exactly the polynomial power P(x)^(2n), and every
    coefficient of P(x)^m is at most (2^32)^m = 2^(32m) - a one-line size lemma, because the
    coefficients are non-negative and sum to exactly (2^32)^m. That bound is what makes a
    multi-modular NTT exact rather than approximate: reconstruct over
    ceil(32m / (prime bit-length - 1)) + 1 CRT primes and the answer is the true integer, with no
    rounding anywhere. Binary exponentiation gives ceil(log2 2n) squarings; at Frodo-1344 that is
    12. All arithmetic is over Z; nothing is floating point; nothing is approximated.
    (C) THE SIZES, DERIVED BY HAND IN THIS SESSION AND LABELLED AS SUCH - THESE ARE NOT MEASURED
    AND NO RUN RECORD IS CITED FOR THEM. With supports |z| <= 12 / 10 / 6 for
    Frodo-640 / -976 / -1344, the product support is [-144, 144] / [-100, 100] / [-36, 36] and the
    2n-fold support has 2*2n*d^2 + 1 = 368641 / 390401 / 193537 points. Coefficient bound
    2^(32*2n) = 2^40960 / 2^62464 / 2^86016 bits. Peak dense storage is therefore approximately
    1.9 / 3.0 / 2.1 gigabytes of exact integers, with 11 / 11 / 12 squarings. THE HEADLINE
    CONSEQUENCE OF THAT HAND ARITHMETIC: the object the goal treats as possibly unaffordable is a
    few gigabytes and a dozen big-polynomial squarings - large but not exotic, and squarely inside
    an ordinary workstation. If the executor's measurement contradicts this, the contradiction is
    the finding and E1 gains support.
    (D) THE CERTIFIED GATE, EXACT AND TRANSCENDENTAL-FREE. The usual Chernoff bound
    E[e^(theta S)] e^(-theta t) is useless for an exact-arithmetic lane because e^theta is
    irrational. Use a RATIONAL base instead: for any rational z > 1,
    Pr[S >= t] <= E[z^S] / z^t = (sum_k p_k z^k)^(2n) * (sum_k chi_k z^k) / z^t, and every factor
    is a rational number. This is a fully exact, rigorous, one-sided certificate costing one
    polynomial evaluation and one exponentiation of a rational, i.e. milliseconds, and it can be
    optimised over a rational grid in z. It is the cheap falsification gate GOAL-FRODO-001's pause
    condition asks for and did not name.
    (E) THE MEASUREMENT THAT DECIDES WHETHER THE GATE CAN EVER REPLACE THE RUN. Compute the exact
    tail and the optimised exact-rational Chernoff bound at the SAME threshold, and report their
    ratio in bits. That gap - call it the certificate slack - is a number nobody has for FrodoKEM,
    and it is the quantity that tells every future batch whether a millisecond gate suffices or a
    multi-gigabyte run is mandatory. A slack of a few bits makes the gate a usable substitute; a
    slack of tens of bits makes it decorative for this purpose, and saying which is the deliverable.
    (F) THE EXTERNAL CROSS-CHECK, AND IT IS INDEPENDENT. Nucci-style formal verification of
    lattice-KEM correctness bounds exists: eprint 2025/1562 (abstract page fetched 2026-08-21)
    formalises the statistical event used to approximate ML-KEM decryption errors in EasyCrypt and
    reports FrodoKEM as an additional example demonstrating verification of a correctness bound
    WITHOUT heuristic approximations. A verified BOUND and an exact VALUE are different objects,
    and they must be consistent: the exact value must lie on the correct side of the verified
    bound. That is a cross-artifact consistency check against a formally verified external
    artifact, which this program has essentially never had available, and it is a control that can
    fail loudly.
    (G) NOT CLAIMED. No attack, no exponent, no speedup against any adversary. No assertion that
    any published FrodoKEM failure rate is wrong - this record computes a number and compares it,
    and RQ-FRODO-3260cc.constraints[5] makes any discrepancy a documentation defect until costed.
    No claim about the joint failure event over the nbar x mbar block: this record computes the
    PER-ENTRY marginal exactly and stops there, because the entries are correlated through the
    shared key and that aggregation is a different object (see interpretation_limits).
  mechanism: >-
    STAGE 1 - THE PRODUCT PMF, EXACTLY. From the pushforward pmf of chi (IDEA-20260821-b19e5e
    Stage 1, or independently from the filed table), form the exact pmf of X*Y for independent
    X, Y ~ chi by direct enumeration over at most 25 x 25 = 625 pairs, with denominator 2^32 and
    integer numerators summing to exactly 2^32. Gate: the sum must be exactly 2^32 or the input pmf
    is wrong.
    STAGE 2 - THE CHEAP CERTIFIED GATE, RUN FIRST. Evaluate the exact-rational Chernoff bound at a
    grid of rational z and report the best bound in bits, for all three parameter sets, at the
    threshold derived from the filed q and B. From the fetched parameter table
    (q = 2^15 / 2^16 / 2^16, B = 2 / 3 / 4) the per-entry failure threshold q / 2^(B+1) is
    4096 / 4096 / 2048 - hand arithmetic, to be re-derived, and the exact boundary convention
    (>= versus >, and whether the published analysis uses q/2^(B+1) exactly) is a transcription
    target, not a settled fact. This stage costs milliseconds and already produces a rigorous
    one-sided statement about every published figure.
    STAGE 3 - REDUCED-DIMENSION LADDER BEFORE THE FULL RUN. Run the full exact pipeline at
    m = 2^j products for j = 4, 6, 8, 10 and record wall clock, peak memory and coefficient
    bit-length at each rung. Fit nothing; report the four points. This is validation-ladder step 2
    of docs/inventor-protocol.md section 6 - the step the protocol says this program most often
    skips - and it converts "we think n = 1344 is affordable" into a measured ratio against
    measured rungs. It also supplies the stopping rule: if a rung's peak memory exceeds the
    declared budget, the run halts THERE and the halting rung is the measured obstruction.
    STAGE 4 - THE FULL EXACT RUN. Binary exponentiation of P(x)^(2n) under multi-modular CRT with
    the prime count fixed by the size lemma, then convolution with the extra chi term, then the
    exact tail partial sum, then log2 of the exact rational by integer bit-length arithmetic.
    Output: an exact rational DFR per parameter set and its log2 to full precision.
    STAGE 5 - THE THREE CONSISTENCY CHECKS. (i) The exact value must be below the Stage 2 Chernoff
    bound; the ratio is the certificate slack. (ii) The exact value must be consistent with the
    externally verified bound of eprint 2025/1562 once that document is filed. (iii) The exact
    value at m = 2^j must agree with an independent double-and-add implementation using a different
    prime set, at every ladder rung - two implementations, different primes, bitwise identical
    integers, or the pipeline is void.
