      abandoned-probability criteria for r-fold convolutions computed by double-and-add;
      eprint 2026/1350 refines DFR evaluation for three other schemes. What none of the retrieved
      material states, on the evidence actually read this session, is (a) an exact integer-arithmetic
      method with a proved coefficient bound making multi-modular reconstruction exact at Frodo's
