  assumptions:
  - >-
    The error term is a sum of exactly 2n independent products of chi samples plus one chi sample,
    with all samples independent. This is the structural premise and it must be re-derived from the
    filed primary text; if the scheme's error expression differs (for instance if the salt or the
    encoding contributes a further term), the polynomial power changes and the size lemma changes
    with it.
  - >-
    Failure occurs when the per-entry error crosses q / 2^(B+1). The threshold values
    4096 / 4096 / 2048 are hand arithmetic from the fetched q and B and the exact boundary
    convention is a transcription target, not a settled fact. A one-unit error in the threshold
    can move the log2 DFR by a visible amount and would look exactly like a discrepancy.
  - >-
    All size figures in claim (C) are hand arithmetic performed by the proposing agent in this
    session. THEY ARE NOT MEASUREMENTS, no run record is cited for them, and no evidence record may
    treat them as observed. Stage 3's ladder exists to replace them with measured values.
  - >-
    Exact big-integer and multi-modular NTT arithmetic is available in the execution environment at
    the required sizes. If it is not, that is an infrastructure limitation and, per AGENTS.md
    rule 3, is never negative mathematical evidence about the feasibility question E1 versus E2.
  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the cost is the coefficient growth of P(x)^m: naive
      exact rational arithmetic carries denominators that double the work at every squaring, and
      naive floating point loses the tail entirely because the answer is near 2^-139. The size
      lemma removes the bottleneck by bounding coefficients a priori so that a fixed, computable
      number of CRT primes suffices for the whole exponentiation.
    baseline_embedding:
      parameter_slice: >-
        The baseline is the double-and-add floating-point convolution used in practice, of which
        the recalled Wang 2024 paper analyses the precision. It is reproduced as the exact
        pipeline's own output rounded to the working precision at each rung, so that the exact and
        the floating-point answers can be compared rung by rung and the precision loss MEASURED
        rather than argued.
      reproduction_check: >-
        Frozen fixture: the fair-coin binomial arm of NULL-1 at m = 2^j for j up to 10, checked as
        bitwise identical integers against binomial(m, k) computed independently.
    observation_collision:
      observable: >-
        The exact rational tail probability, reported as log2 to full precision.
      distinct_preimage_search: >-
        Two distinct chi tables can produce the same log2 DFR to any stated precision, so the DFR
        alone does not identify the table - which is exactly why RQ-FRODO-3260cc pairs the failure
        rate with the divergence and why IDEA-20260805-f16b44 separates scale from tail shape. The
        record therefore reports the full exact rational rather than a rounded log2, because the
        full rational is a much finer observable and shrinks the fibre enormously; and it declares
        that agreement in log2 alone is NOT a reproduction of the table.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move from "a convolution of probability distributions" to "a power of an integer polynomial
        with a proved coefficient bound", a model in which the correctness condition is an exact
        integer equality (the CRT reconstruction is exact when the modulus product exceeds twice
        the bound) rather than a precision estimate.
      predicted_gain: >-
        Exactness with a certificate, at a cost the size lemma predicts in advance. Encoding,
        completeness, soundness and cost-loss obligations are all discharged by the one lemma plus
        the CRT bound, which is why the decomposition is short.
    - transform: telescoping_potential
      proposed_object: >-
        The exact-rational Chernoff certificate with a rational base, which charges the whole tail
        to a single global moment functional evaluated once, rather than tracking the convolution
        step by step.
      predicted_gain: >-
        A rigorous one-sided bound in milliseconds; its slack against the exact answer is the
        record's measured deliverable (E) and determines whether this transform can ever replace
        the expensive one.
    quantifier_order: >-
      FOR EACH parameter set P, THERE EXISTS an exact rational r(P) computed by the stated
      algorithm such that r(P) is the per-entry decryption failure probability under the stated
      error model, AND FOR EVERY rational z > 1 the Chernoff expression is an upper bound on r(P).
      The second conjunct's "for every z" is what makes the certificate rigorous rather than tuned:
      optimising over z selects the best member of a family every one of whose members is valid, so
      no selection effect can make the bound unsound. Note what is NOT claimed: no uniform statement
      over parameter sets, and no statement of the form "for every error model".
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is an exact rational per-entry failure probability under a
        transcribed error model, with a machine-checkable certificate. The method CANNOT certify
        the per-ciphertext DFR, because the 64 entries are correlated; it cannot certify anything
        about the FO reduction, which is RQ-FRODO-a2dbe2's; and it cannot certify that the
        transcribed error model is FrodoKEM's, which is a reading question. An exact number computed
        for the wrong model is exactly as wrong as a floating-point number, and no amount of CRT
        fixes that.
      nearby_object_control: >-
        The nearby object on which the desired conclusion fails is the per-ciphertext failure
        event. Compute, alongside the exact per-entry marginal, the two naive aggregations
        64 * p and 1 - (1 - p)^64, and exhibit that they differ from each other by about 0.0 to
        0.1 bits while the TRUE correlated aggregation differs from both by an amount this method
        cannot compute. A pipeline that reports an aggregate without flagging that gap has crossed
        its own ceiling, and this control makes the crossing visible.
    proof_obligations:
    - claim: coefficients of P^m are non-negative and sum to exactly (2^32)^m, hence are <= 2^(32m)
      responsibility: size
    - claim: CRT reconstruction over the stated prime count is exact
      responsibility: correctness
    - claim: binary exponentiation costs ceil(log2 2n) squarings
      responsibility: runtime
    - claim: peak memory is bounded by support size times coefficient bit-length
      responsibility: memory
    - claim: E[z^S] / z^t upper-bounds the tail for every rational z > 1
      responsibility: correctness
    - claim: the per-entry marginal is not the per-ciphertext DFR
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: coefficient sum of P^m at every ladder rung
    direction: different
    minimum_effect: >-
      exactly (2^32)^m, a derived identity; any deviation at all is a bug and halts the run
  - metric: >-
      bitwise agreement between the two independent implementations (different prime sets) at every
      rung
    direction: different
    minimum_effect: >-
      exact bitwise identity required; a single differing bit voids the pipeline
  - metric: peak memory at the full Frodo-1344 run
    direction: lower
    minimum_effect: >-
      predicted by hand at approximately 2.1 GB; the falsifiable content is that it is below 32 GB,
      i.e. inside an ordinary workstation. Above that, explanation E1 gains support and the halting
      rung is the measured obstruction
  - metric: number of squarings at Frodo-1344
    direction: different
    minimum_effect: 'exactly 12 = ceil(log2 2688); a derived value, checked mechanically'
  - metric: certificate slack, exact log2 DFR minus exact-rational Chernoff log2 bound, in bits
    direction: different
    minimum_effect: >-
      any value is informative, but the decision threshold is declared in advance at 5 bits: below
      5 bits the millisecond gate is a usable substitute for the multi-gigabyte run in future
      batches, above it the gate is decorative for that purpose
  - metric: >-
      exact DFR response to a one-unit chi perturbation, versus H-FRODO-e0c651 part 2's predicted
      -0.167 bits at Frodo-640
    direction: different
    minimum_effect: >-
      agreement within 0.05 bits would corroborate that hypothesis's closed form; disagreement by
      more than 0.05 bits would show the Gaussian-style closed form is not adequate at this tail
      depth, which is a substantive finding for that hypothesis and is the record's most likely
      surprise
  minimal_test:
    design: >-
      STAGED WITH A CHEAP GATE AND A DECLARED HALTING RULE, so that a budget outcome is never
      confused with a mathematical one. (1) Build the exact chi and product pmfs; check the two
      derived identities (sum exactly 2^32, exact symmetry). (2) Evaluate the exact-rational
      Chernoff certificate at all three parameter sets - milliseconds - and report three rigorous
      upper bounds immediately. (3) Run the exact pipeline at m = 2^4, 2^6, 2^8, 2^10, recording
      wall clock, peak memory and coefficient bit-length at each, against the closed-form
      predictions, with the fair-coin binomial arm and the second implementation run at every rung.
      (4) If and only if the ladder's measured memory extrapolates below the declared budget,
      run the full 2n at all three parameter sets. (5) Report the exact rationals, the certificate
      slack, the perturbation response versus H-FRODO-e0c651's prediction, and the two naive
      aggregations with the correlated gap explicitly flagged as not computed.
      THIS DISCRIMINATES between E1 and E2 by measurement rather than by argument, and it CAN come
      out negative in three distinct ways, each with a defined meaning: the ladder halts on memory
      (E1 supported, obstruction recorded with its number), the two implementations disagree (no
      number is reported and the bug is the finding), or the exact value contradicts the certified
      bound (one of the two is wrong and the record says which arm failed rather than which paper).
      Note that stages 1-2 alone already produce three rigorous upper bounds for under a second of
      compute, so even a fully halted run leaves the lane better off than it started.
    controls:
    - fair-coin binomial closed-form arm, bitwise, at every ladder rung
    - second independent implementation with a different prime set, bitwise, at every rung
    - >-
      derived-identity arm (coefficient sum exactly (2^32)^m, exact symmetry), declared before the
      run so that its agreement is not read as evidence
    - >-
      five-point perturbation ladder with the comparator named as the unperturbed exact DFR, a
      threshold declared before the run, and monotonicity reported explicitly
    - >-
      floating-point shadow arm at each rung, so that the precision loss of the standard method is
      measured against the exact value rather than argued
    - >-
      external cross-check against the verified bound of eprint 2025/1562 once that document is
      filed as a KN-LIT entry
    - >-
      declared halting rule on peak memory, so that a budget stop is recorded as a budget stop and
      never as evidence about the number (AGENTS.md rule 3)
    required_metrics:
    - exact rational DFR per parameter set, numerator and denominator, plus log2 to full precision
    - exact-rational Chernoff bound per parameter set, and the optimising rational z
    - certificate slack in bits
    - wall clock, peak memory, coefficient bit-length and support width at every ladder rung
    - bitwise agreement flags for both independent implementations at every rung
    - coefficient sums and symmetry check at every rung
    - exact DFR under each of the five perturbation magnitudes, with a monotonicity flag
    - floating-point shadow value and its signed error against the exact value at every rung
    - the two naive aggregations, with the correlated gap flagged as not computed
  falsification_conditions:
  - >-
    A coefficient sum differs from (2^32)^m, or the coefficient vector is not exactly symmetric.
    A bug; the run halts and no number is reported.
  - >-
    The two independent implementations disagree at any rung. No number is reported until the
    disagreement is resolved, and the resolution is the deliverable.
  - >-
    The exact value exceeds the exact-rational Chernoff bound. A logical impossibility given a
    correct implementation, so one arm is wrong; the record identifies which arm failed and makes
    no statement about any published figure.
  - >-
    The ladder's measured memory or time extrapolates above the declared budget. Explanation E1 is
    supported at the tested rungs, the obstruction is recorded with its measured number, units and
    scope, and this is a BUDGET outcome about a computation, never evidence about the value being
    computed.
  - >-
    The measured perturbation response disagrees with H-FRODO-e0c651 part 2's -0.167 bits by more
    than 0.05 bits at Frodo-640. That closed form is not adequate at this tail depth, and the
    hypothesis's derived mutation magnitude must be recomputed exactly before it licenses anything.
  - >-
    The exact value contradicts the externally verified bound of eprint 2025/1562. Then either the
    transcribed error model differs from the one that paper verified - the most likely explanation
    and the first to test - or one of the two artifacts is wrong. No claim about the external paper
    is made without independent review.
  confounders:
  - >-
    THE ERROR MODEL IS THE BIGGEST ONE. An exact computation of the wrong sum is worthless and
    looks authoritative. Everything downstream is conditional on the transcription, and the record
    must publish the transcribed expression verbatim beside the number.
  - >-
    The failure-threshold boundary convention (>= versus >, and the exact form q/2^(B+1)). A
    one-unit shift changes the tail sum by one coefficient, which at these tail depths is not
    negligible and would present as a discrepancy.
  - >-
    Comparing a PER-ENTRY marginal against a PUBLISHED figure that may be per-ciphertext. A factor
    of 64 is 6 bits and would be read as a discrepancy where only a unit mismatch exists. The
    record must state its unit in the same sentence as its number, which is the
    ratio_denominator_named discipline of KN-TECH-1a5b7e.
  - >-
    Implementation sharing between the two arms. If both implementations import the same pmf
    builder or the same threshold constant, they are not independent and NULL-2 is decorative. The
    shared surface must be enumerated and minimised explicitly.
  - >-
    Optimising the Chernoff base z after seeing the exact answer. The bound is sound for every z,
    so this cannot make it unsound, but it can make the reported slack look artificially small; z
    must be optimised on a declared grid before the exact value is read.
  interpretation_limits:
  - >-
    NO ATTACK, NO BREAK, NO EXPONENT, NO SPEEDUP AGAINST ANY ADVERSARY. The algorithm speeds up an
    AUDIT, not an attack.
  - >-
    The computed quantity is the PER-ENTRY marginal. It is not the per-ciphertext DFR, because the
    64 entries are correlated through the shared key and encryptor error; the naive aggregations
    are reported only so that the gap is visible, and the correlated aggregation is explicitly not
    computed here.
  - >-
    A reproduction of a published figure verifies an arithmetic assertion and nothing more; a
    discrepancy is a documentation or analysis defect until costed, per
    RQ-FRODO-3260cc.constraints[5], and neither outcome is evidence about the hardness of LWE at
    Frodo's dimensions.
  - >-
    Scoped to the three standardized parameter sets, the transcribed error model, the transcribed
    threshold convention, and the rungs actually executed. A halted ladder speaks only for the rungs
    it reached.
  - >-
    Every size figure in claim (C) is hand arithmetic from this session and must not be cited as a
    measurement by any downstream record.
  heuristic_assumptions:
  - id: H1
    statement: >-
      NONE OF THE ARITHMETIC IS HEURISTIC. The size lemma (coefficients of P^m are non-negative and
      sum to exactly (2^32)^m, hence each is at most 2^(32m)), the exactness of CRT reconstruction
      above twice that bound, and the validity of E[z^S]/z^t as an upper bound for every rational
      z > 1 are all theorems, not assumptions. This record is therefore UNCONDITIONAL in its
      arithmetic, which is unusual in this program and is stated here so that no reader imports a
      conditionality that does not exist.
    rigorous_support: >-
      Non-negativity and the exact sum follow from P being a scaled probability mass function;
      CRT exactness is the Chinese remainder theorem with a two-sided range bound; the moment bound
      is Markov's inequality applied to z^S. All three are elementary and machine-checkable.
    validation_plan: >-
      Mechanical rather than statistical: check the coefficient sum and the symmetry at every rung
      (both derived identities), check CRT exactness by recomputing with one extra prime and
      requiring an identical result, and check the moment bound by evaluating it at several
      rational z and confirming it dominates the exact tail at every ladder rung where the exact
      tail is available. Sampled parameters: the ladder rungs m = 2^4, 2^6, 2^8, 2^10 and the full
      2n at each of the three standardized parameter sets. Transfer assumption: none for the
      arithmetic; the only transfer is from a halted ladder to a prediction about the full run, and
      that transfer is reported as an extrapolation and never as a result.
  - id: H2
    statement: >-
      The per-entry error is exactly a sum of 2n independent products of chi samples plus one
      independent chi sample. Formally: the entry (i,j) of E'S - S'E + E'' is
      sum_k E'[i,k] S[k,j] - sum_k S'[i,k] E[k,j] + E''[i,j], with all 4n+1 sampled variables
      independent and identically distributed as chi.
    rigorous_support: >-
      This is a structural fact about the scheme, not a distributional assumption, once the scheme
      is transcribed - so its "rigorous support" is the primary text and its risk is entirely
      transcription risk. It is listed as a heuristic assumption because the transcription has not
      been made and RQ-FRODO-3260cc.constraints[0] forbids assuming it.
    validation_plan: >-
      Two routes, both cheap. (i) Symbolic: derive the error expression from the transcribed
      KeyGen/Encaps/Decaps and check that A cancels. (ii) Empirical, at REDUCED dimension only:
      instantiate a small Frodo-shaped scheme (n = 32 or 64), sample 10^7 ciphertexts, and compare
      the empirical error histogram with the exact convolution at that n - which the pipeline
      computes in milliseconds. Agreement of an empirical histogram with an exact convolution at
      reduced n is a strong end-to-end check of the model with no extrapolation to the failure
      TAIL, and the transfer assumption is stated explicitly: it validates the MODEL, never the
      tail probability, because 10^7 samples cannot see a 2^-138 event.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED, and against docs/target-result-profile.md this record
      fails checklist item C1 outright: it is an audit tool, not a target-class result, and the
      Idea Generator contract requires that to be said rather than dressed up. Its priority is
      claimed as a BUILDING BLOCK in the sense that contract permits, and the justification is
      specific rather than rhetorical: GOAL-FRODO-001 has already pre-committed to pausing if this
      computation is unaffordable, so the goal's own completion criteria are gated on it.
      ALGORITHMIC COST, stated properly: with support width W = O(n d^2) and coefficient
      bit-length L = O(n log(1/precision-free)) = 32*2n, the exponentiation costs
      O(log n) multiplications of degree-W polynomials with L-bit coefficients, i.e.
      O(log n * W * L * log(W L)) bit operations under multi-modular NTT - quasi-linear in the
      output size, which is W*L bits.
    memory_exponent: >-
      Peak memory is Theta(W * L) bits = Theta(n^2 d^2) bits, i.e. quadratic in n. Hand-derived
      values: about 1.9 / 3.0 / 2.1 GB at Frodo-640 / -976 / -1344. This is the binding constraint
      and it is the quantity the Stage 3 ladder measures.
    best_known: >-
      The incumbent method, on the evidence retrieved this session, is a floating-point
      double-and-add convolution with a precision analysis (Wang 2024, recalled) or a verified
      BOUND rather than an exact value (eprint 2025/1562, abstract fetched). No exact value for
      FrodoKEM's DFR was found in this session's searches, and none exists in this repository. That
      is a negative search result and is not asserted as a fact about the literature.
    hidden_overhead: >-
      There is no o(1) to hide anything in, but three costs are easy to under-state and are named
      here. First, the CRT prime count grows LINEARLY in m, so the coefficient bit-length is not a
      constant and the "quasi-linear" claim is quasi-linear in an output that is itself quadratic
      in n. Second, the second independent implementation roughly doubles the whole cost and is not
      optional. Third, the human cost of transcribing the error model dominates everything and is
      not compute at all.
    tradeoff_note: >-
      Genuine and favourable. The multi-modular form is embarrassingly parallel across primes -
      about 1388 independent NTTs at Frodo-1344 by hand arithmetic - so wall clock divides by the
      processor count with no communication until the final CRT step, and memory per worker is
      W * 64 bits rather than W * L. That converts the 2-3 GB peak into a per-worker footprint of a
      few megabytes and is the single design choice that decides E1 versus E2 in practice. The
      opposite tradeoff also exists and should be reported: Kronecker substitution into one big
      integer is simpler and serial, and measuring both is what makes the second implementation
      genuinely independent rather than a copy.
  dominated_by: >-
    n/a (no attack result claimed) on the attack axis - this repository holds no time/memory/data
    frontier row for any FrodoKEM attack, and writing bare 'null' would assert a check against a
    row that does not exist (AGENTS.md rule 5). ON THE COMPUTATION AXIS, where a frontier DOES
    exist, this record is honestly positioned: the floating-point double-and-add method dominates it
    on time and memory by a wide margin, and the recalled Wang 2024 analysis gives criteria under
    which that cheaper method is adequate. This record does not claim to beat it on cost; it claims
    a different guarantee (exactness with a certificate) at a higher cost, and it MEASURES the
    certificate slack precisely so that a future reader can decide when the cheaper method suffices.
    The verified bound of eprint 2025/1562 dominates on rigour-per-effort for the BOUND question and
    does not answer the VALUE question.
  sota_delta: >-
    No attack; algorithmic and measurement contribution only. Quantitatively, against this
    repository: there is no exact FrodoKEM DFR, no certified bound, and no measured feasibility
    figure, and GOAL-FRODO-001 names the feasibility as a pause condition - so the delta is three
    rigorous upper bounds available within one second, plus either three exact rationals or a
    measured obstruction with units and scope. Against the literature reached this session: the
    delta is exactness with a machine-checkable certificate where the retrieved material offers a
    precision analysis of a floating-point method and a formally verified bound; the certificate
    slack in bits is a number that appears nowhere retrieved.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the size lemma and the CRT construction are correct as stated: ~0.97 - these
    are elementary and I would be surprised to be wrong. (ii) That the exact-rational Chernoff
    certificate with a rational base works and produces a usable bound in milliseconds: ~0.9.
    (iii) That the full Frodo-1344 run completes inside 32 GB, i.e. that E2 rather than E1 holds:
    ~0.75, with the hand arithmetic at about 2.1 GB and a factor of a few in reserve for
    implementation overhead. (iv) That the two independent implementations agree bitwise on the
    first attempt: ~0.35 - they usually do not, and the value of NULL-2 is precisely that.
    (v) That the certificate slack comes in under 5 bits, making the cheap gate a usable
    substitute: ~0.3 - Chernoff bounds on sums of bounded variables are typically loose by more
    than that at this tail depth, and I would bet against it. (vi) That the measured perturbation
    response matches H-FRODO-e0c651's -0.167 bits within 0.05 bits: ~0.5, and this is the
    coin-flip I would most like resolved. (vii) That the record produces either exact numbers or a
    properly recorded obstruction: ~0.9.
