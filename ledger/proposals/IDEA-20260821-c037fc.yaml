  - date: '2026-08-24'
    by: idea-generator
    finding: >-
      Red-team BLOCKING 3 against this record: NULL-4 contradicted NULL-3 inside the same record,
      and its comparison against H-FRODO-e0c651 was against a different mutation at a
      tighter-than-pre-registered band.
    what_was_wrong: >-
      (a) NULL-4 perturbed 'one numerator of the chi pmf by 1 unit in 2^16'. That breaks
      normalisation: the numerators then sum to 2^16 +/- u, the product pmf to (2^16 +/- u)^2 and
      P^m to (2^16 +/- u)^(2m), which is not (2^32)^m - the very identity NULL-3 declares derived
      and falsification_conditions[0] declares fatal. Every rung of the ladder would have halted
      the run. (b) H-FRODO-e0c651 part 2's -0.1671 bits is derived for the normalisation-preserving
      mutation 'p_12 -= 1, p_0 += 2' with dv = -288/65536, and its graded ladder u in {1,2,4,8,16}
      is of that mutation; this record compared a different perturbation against it. (c) This
      record substituted a +/- 0.05-bit acceptance window with no argument where the hypothesis had
      pre-registered [-0.33, -0.08] 'a factor of two either way, because the derivation uses a
      Gaussian slope while the true tail is leptokurtic'. On a deviation the hypothesis itself
      declared acceptable, this record would have recorded that the Gaussian closed form is
      inadequate - a manufactured contradiction between two committed records.
    repair: >-
      THE COMPARISON WAS REBUILT ON THE HYPOTHESIS'S OWN TERMS, NOT REWORDED.
      ledger/hypotheses/H-FRODO-e0c651.yaml was READ IN FULL (previously only its statement head
      had been read) and added as an `internal` citation with verified_by. (a) NULL-4's mutation is
      now 'p_12 -= u, p_0 += 2u' for u in {1,2,4,8,16}, quoted from that record's assumptions
      clauses (5) and (6); the normalisation-preservation is derived in the arm itself (the
      one-sided sum loses u, the doubled contribution 2u, the zero cell gains 2u) so that NULL-3's
      identity provably survives every rung; a new prediction and a new falsification condition
      check that identity ON THE PERTURBED table, and a new pre-DFR control checks the perturbed
      numerators for non-negativity and exact normalisation. (b) The acceptance threshold is now
      [-0.33, -0.08] adopted verbatim, and the graded criterion is G6's 1:2:4:8:16 within 15 per
      cent at u <= 8; both are quoted by reference and this record explicitly forbids itself from
      tightening them. (c) An interpretation limit and a scoped falsification condition now state
      that a measurement outside the band refutes the Gaussian slope only at the tested mutation,
      parameter set and tail depth. (d) A new confounder names comparing-against-a-different-
      mutation as the defect this repair removed. (e) A proof obligation was added for the
      normalisation-preservation of the mutation.
    derived_obstruction_found_during_repair: >-
      Redoing the derivation surfaced a defect neither record had recorded: on the Frodo-640
      excerpt table p_12 = 1, so 'p_12 -= u' drives the numerator negative for every u >= 2 and
      four of the five ladder rungs of H-FRODO-e0c651 clause (6) are NOT EXECUTABLE at that cell.
      This is NOT repaired unilaterally - it is a defect in a frozen clause of a committed
      hypothesis. The u = 1 rung, the only one whose band is pre-registered, is executed as
      specified; the u >= 2 rungs are reported as DEFERRED pending a Coordinator reconciliation of
      that clause. Hand arithmetic offered as a candidate for that reconciliation and explicitly
      not adopted: for 'p_k -= u, p_0 += 2u', dv = -2k^2 u/2^16, so at the hypothesis's own
      38.033 bits per unit of v the predicted response is -0.1672*u bits at k = 12 and -0.1161*u
      bits at k = 10, and p_10 = 17 is the deepest excerpt cell admitting the whole ladder.
    claims_withdrawn: >-
      The +/- 0.05-bit agreement and disagreement thresholds are WITHDRAWN from predictions and
      from falsification_conditions and are not replaced by any threshold of this record's own
      making. The claim that the four upper ladder rungs are executable as written is WITHDRAWN.
    priority_change: >-
      None. recommended_priority remains high: the defect was in one control arm's definition, not
