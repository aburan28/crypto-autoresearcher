      FAILED as unreadable compressed stream. The Wang 2024 IET paper was NOT fetched.
    results: >-
      IN THIS REPOSITORY: no record specifies an exact method for the 2n-fold convolution at
      Frodo's true dimensions. IDEA-20260805-411b60 and H-FRODO-e0c651 derive a mutation
      magnitude through a Gaussian-style closed form for the tail; IDEA-20260805-f16b44 separates
      scale from tail-shape error; IDEA-20260805-390957 checks table identities. All three
      PRESUPPOSE that some failure-rate number can be produced and none says how to produce it
      exactly. GOAL-FRODO-001 names the affordability of that computation as a pause condition,
      which is as close as the repository comes to acknowledging the gap.
      EXTERNALLY: the gap is much smaller than in-repository, which is why novelty_status is
      ADAPTATION and not speculative. Exact and near-exact DFR computation for lattice KEMs is an
      active literature: eprint 2025/1562 formally verifies correctness bounds in EasyCrypt and
      explicitly includes FrodoKEM; the Wang 2024 IET paper analyses floating-point precision and
      abandoned-probability criteria for r-fold convolutions computed by double-and-add;
      eprint 2026/1350 refines DFR evaluation for three other schemes. What none of the retrieved
      material states, on the evidence actually read this session, is (a) an exact integer-arithmetic
      method with a proved coefficient bound making multi-modular reconstruction exact at Frodo's
      dimensions, (b) an exact-rational Chernoff certificate with a rational base, or (c) the
      certificate slack as a measured number for FrodoKEM. Those three are the claimed increments,
      and the honest framing is that (a) is standard computer algebra applied to a target where it
      has not been reported, not an invention.
    verdict: >-
      ADAPTATION. A known technique family - integer polynomial exponentiation with multi-modular
      CRT, plus exponential-moment bounding - applied to a target where the retrieved literature
      shows bounds and floating-point analyses rather than exact values. The novelty claim is
      deliberately narrow and the record would still be worth running if it turned out that
      someone had computed the exact value already, because RQ-FRODO-3260cc's whole premise is
      INDEPENDENT re-derivation and a shared implementation is exactly the failure mode it exists
      to avoid. Two eprint abstract pages were read; no paper body was read; the Wang 2024 paper
      was not fetched at all and is cited as recalled-strength from a search summary.
      LABEL FORCED TO `unverified` BY RULE, NOT BY DOUBT: this record rests on citation(s) marked
      provenance `recalled`, and AGENTS.md rule 9 -- enforced by tools/validate_ledger.py
      check_citations -- requires novelty_status `unverified` until such a source is actually read.
      The crypto-kb retrieval index answers nothing this session (in-memory Qdrant), so no record in
      this batch may assert a checked literature negative. The substantive assessment above is
      unchanged.
  object_first_candidate:
    tracked_object: >-
      The EXACT INTEGER COEFFICIENT VECTOR of P(x)^m, the m-fold convolution power of the scaled
      product-distribution polynomial, followed through binary exponentiation from m = 1 to
      m = 2n, with the read-out quantity being its exact tail partial sum above the failure
      threshold.
    lossiness: >-
      GENUINELY LOSSY, in the strong sense. The underlying state is the joint law of
      (S, E, S', E', E'') - roughly 2*n*nbar + 2*nbar*n + nbar*nbar samples from chi. The tracked
      object is the marginal law of ONE entry's error sum. It discards which sample contributed
      which product, the joint structure across the 64 ciphertext entries, and the key entirely.
      The discard is compatible with the operation being tracked, because that operation is
      "add one more independent product", and the law of a sum of independent variables is
      determined by the marginals alone - so the retained part propagates deterministically and
      exactly. It is NOT a change of coordinates: the joint law is not recoverable from the
      marginal, and infinitely many joint laws share it. That non-recoverability is not a defect
      here, it is what makes the object cheap enough to compute exactly.
    propagation: >-
      One step is one polynomial multiplication, and the propagation law is exact: coefficients of
      P^(a+b) are the convolution of those of P^a and P^b, with the coefficient bound
      2^(32(a+b)) proved from non-negativity and the exact sum. The one-step behaviour is
      measurable at every rung of the Stage 3 ladder - support width, peak coefficient bit-length,
      wall clock, peak memory - and each is predicted in closed form before the rung is run, so a
      rung that deviates from its prediction exposes an implementation defect immediately rather
      than at the top of the ladder.
    survival_score: >-
      SURVIVES ALL 2n STEPS EXACTLY, AND THEN DISSOLVES AT A NAMED POINT. It dissolves at the
      aggregation from one entry to the nbar x mbar = 64-entry ciphertext block, because entries in
      the same row share the encryptor's error row and entries in the same column share the key
      column, so the 64 failure indicators are NOT independent and the per-ciphertext DFR is not
      1 - (1 - p)^64. This record computes the per-entry marginal exactly and STOPS at that
      boundary, naming it rather than crossing it - the correlated aggregation is
      IDEA-20260816-1418f4's object and, conditionally on the key, is governed by the Gram matrix
      S^T S + E^T E, which is a different computation with a different cost.
  null_object_control: >-
    FOUR ARMS, each able to fail, three of them with values derived before the run.
    NULL-1 (CLOSED-FORM ARM, and it can fail): run the identical pipeline on a distribution whose
    m-fold convolution tail is known exactly in closed form - the fair-coin walk, where the m-fold
    convolution of the uniform law on {-1, +1} has coefficients exactly binomial(m, k) and the tail
    is an exact partial binomial sum. Require BITWISE identical integers against a direct binomial
    computation at m = 2^j for j up to 10. An exact pipeline that disagrees with binomial
    coefficients has a CRT or a bound bug, and this catches it immediately.
    NULL-2 (TWO-IMPLEMENTATION ARM): a second, independent implementation using a DIFFERENT prime
    set and, ideally, a different multiplication strategy (Kronecker substitution into a single
    big integer versus multi-modular NTT), required to produce bitwise identical integers. This is
    the direct instantiation of RQ-FRODO-3260cc.methods' independence requirement at the level of
    the arithmetic rather than of the source text.
    NULL-3 (FORCED-VALUE ARM, derived before the run so agreement carries no information):
    the coefficient sum of P^m must equal exactly (2^32)^m at every rung, and the coefficient
    vector must be exactly symmetric about the origin, because the product of two symmetric
    distributions is symmetric. Both are derived identities; their agreement is not evidence, and
    their DISAGREEMENT is a decisive bug signal. Stating this explicitly is obligation 4 of
    KN-TECH-1a5b7e.
    NULL-4 (SENSITIVITY LADDER WITH A NAMED COMPARATOR AND A DECLARED THRESHOLD): perturb one
    numerator of the chi pmf by 1 unit in 2^16 and recompute the exact DFR at every rung, at
    perturbation magnitudes 1, 2, 4, 8, 16 units - five points, four interior - with the comparator
    NAMED as the unperturbed exact DFR, a numeric threshold declared before the run, and
    MONOTONICITY in the perturbation magnitude reported explicitly. H-FRODO-e0c651 part 2 predicts
    a magnitude for this response through a Gaussian-style closed form; comparing that PREDICTION
    with the EXACT response is a second deliverable and a direct test of that hypothesis's closed
    form, which may be the most interesting by-product of the whole record.
    CAN THIS NULL FAIL: yes at all four. NULL-1 and NULL-3 have concrete, common failure modes
    (insufficient primes, sign or shift errors in the exponent offset); NULL-2 is the only arm that
    catches a shared conceptual error, which is why it is not optional; NULL-4 fails if the
    response is non-monotone, in which case no magnitude may be signed.
  discriminated_from:
  - >-
    IDEA-20260805-411b60 and H-FRODO-e0c651 part 2 derive how far the DFR must move under a
    one-unit table perturbation, using a closed form in Var(chi). This record computes the DFR
    itself exactly and therefore MEASURES that response rather than predicting it; the two are in
    a predictor-and-measurement relationship, and NULL-4 is designed to score the prediction
    against the measurement. Neither substitutes for the other.
  - >-
    IDEA-20260805-f16b44 asks what a scale error versus a tail-shape error is worth in a failure
    rate. That is a sensitivity question about a number; this is an algorithm for producing the
    number exactly, and f16b44's analysis becomes sharper once an exact tail exists to differentiate.
  - >-
    IDEA-20260816-1418f4 measures the correlation among per-coordinate failure indicators. This
    record computes ONE coordinate's marginal exactly and explicitly stops at the aggregation
    boundary, naming 1418f4's object as what lies beyond it. There is no overlap and there is a
    clean handoff.
  - >-
    IDEA-20260821-b19e5e (this batch) computes the chi pushforward and the divergence conventions.
    That record supplies this one's Stage 1 input and nothing else; this record makes no divergence
    claim and b19e5e makes no convolution claim.
  - >-
    IDEA-20260808-2df781 solves a finite integer program over candidate tables for the divergence.
    This record convolves ONE table exactly for the failure rate. If both run, 2df781's candidate
    tables become inputs to this record's pipeline, which is a composition the Coordinator may
    choose to sequence.
