      IDEA-20260805-1d76e9, IDEA-20260805-031ce2, IDEA-20260805-bb52fa, EV-PEC-2e67ff, EV-AES-8b8dcf
      and several 2026-08-16 records. I read GOAL-FRODO-001 in full and confirmed the pause
      condition quoted in this record's title verbatim; I read the statement head of H-FRODO-e0c651,
      whose part 2 derives d log2 DFR / dv = (t^2 / (2 Var(X)^2 ln 2)) * (4 n v + 1) with
      Var(X) = 2 n v + v - i.e. it uses a GAUSSIAN-STYLE closed form for the tail, not an exact
      convolution, which is precisely the gap this record fills.
      (2) 'SampleFrodo|T_chi' -> ledger/ -> 2 files (RQ-FRODO-3260cc and an FN-DSA record).
      (3) 'Frodo' -i -> knowledge/ -> 9 files, none about exact convolution methods.
      READ IN FULL: the lane's 8 pre-extracted titles; RQ-FRODO-3260cc; GOAL-FRODO-001;
      docs/inventor-protocol.md (section 6's validation ladder is directly instantiated by Stage 3);
      knowledge/techniques/KN-TECH-1a5b7e.md.
      WEB SEARCH RUN (the one bearing on this record): 'exact computation decryption failure
      probability lattice KEM convolution rational arithmetic certified'. It returned
      eprint 2025/1562, eprint 2026/1350, the Wang 2024 IET paper 'On Accuracy of Testing
      Decryption Failure Rate for Encryption Schemes under the LWE Assumption', the PKC 2019
      D'Anvers et al. decryption-failure-attack paper, and several implementation papers.
      WEB FETCHES: https://eprint.iacr.org/2025/1562 SUCCEEDED - ML-KEM as the main example,
      FrodoKEM as an additional example of verifying a correctness bound without heuristic
      approximations, EasyCrypt, with the abstract page NOT specifying the arithmetic used.
      https://eprint.iacr.org/2026/1350 SUCCEEDED - 'Refined Evaluation Methods of Decryption
      Failure Rate in Lattice-Based Public-Key Encryption with Message Encoding', Zhou, Wang, Cao,
