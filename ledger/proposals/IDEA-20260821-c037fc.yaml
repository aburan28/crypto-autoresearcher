    verdict: >-
      ADAPTATION IN SUBSTANCE, LABELLED `unverified` BY RULE. A known technique family - integer
      polynomial exponentiation with multi-modular
      CRT, plus exponential-moment bounding - applied to a target where the retrieved literature
