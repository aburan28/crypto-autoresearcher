idea:
  id: IDEA-20260807-51675e
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    The affected-versus-safe scope audit for L3, built on the observation that
    deciding "is |D_0| one of the nine class-number-one discriminants" costs NINE
    INTEGER SQUARE TESTS and no factoring - producing a concrete bit-discount
    table in which secp256k1 and the BN/BLS12 pairing families are j=0 (D_0 = -3,
    |Aut| = 6, discount 0.79 bits) while the NIST and Brainpool pseudorandom
    families are |Aut| = 2 (discount 0.00 bits), and in which small |D_0| BY
    ITSELF confers nothing because only D_0 in {-3,-4} carries extra automorphisms
  class: measurement

  claim: >-
    (A) THE CHEAP EXACT TEST, WHICH IS THE TECHNICAL CONTENT. For E/F_p with
    #E(F_p) = p + 1 - t, the Frobenius discriminant is D = t^2 - 4p < 0 and the
    fundamental discriminant D_0 satisfies D = D_0 * f^2. Deciding whether D_0
    equals a SPECIFIC value d requires only checking that D/d is a perfect
    square - one exact integer square test. Therefore:
      "Is |D_0| one of the nine class-number-one discriminants
       {-3,-4,-7,-8,-11,-19,-43,-67,-163}?" costs NINE square tests.
      "Is |D_0| <= B?" costs B square tests.
    NO FACTORISATION OF t^2 - 4p IS REQUIRED. This matters because factoring a
    512-bit t^2 - 4p is not free, and the belief that a small-|D_0| audit needs
    it is the reason such audits are not routinely done. At B = 10^6 the audit of
    every standardised curve completes in well under a second.
    [derived in this record; elementary and mechanically verifiable.]

    (B) THE STRUCTURAL FACT THAT SHRINKS THE AFFECTED SET DRASTICALLY. Over F_p
    with p > 3, |Aut_{F_p}(E)| is 2, 4 or 6 and nothing else: 6 requires j = 0
    (hence D_0 = -3) and p congruent to 1 mod 3, 4 requires j = 1728 (hence
    D_0 = -4) and p congruent to 1 mod 4, and every other curve has |Aut| = 2.
    CONSEQUENCE, AND IT IS THE POINT OF THE AUDIT: a curve with D_0 = -163 is
    "small |D_0|", is a CM curve with class number one, has a computable Hilbert
    class polynomial - and has |Aut| = 2, hence ZERO automorphism discount. SMALL
    |D_0| BY ITSELF CONFERS NO RHO DISCOUNT. The affected set for the only
    established L3 effect is exactly {D_0 = -3, D_0 = -4} and it is not the
    small-|D_0| set. Every scope statement in this lane that says "small
    discriminant curves are affected" is wrong as written, and this record fixes
    it.

    (C) THE DISCOUNT, STATED AGAINST THE PROGRAM'S OWN BASELINE. The convention
    is 0.886*sqrt(N) group operations and KN-TECH-006 records that this ALREADY
    INCLUDES the sqrt(2) from negation. The EXTRA discount at special j is
    therefore sqrt(|Aut|/2):
      j = 0    : sqrt(3) = 1.732, i.e. log2(sqrt(3)) = 0.792 BITS.
      j = 1728 : sqrt(2) = 1.414, i.e. 0.500 BITS.
      all else : 1.000, i.e. 0.000 bits.
    For a 256-bit prime-order subgroup, a j=0 curve therefore offers about
    127.2 bits against parallel rho rather than 128.0. THAT IS THE ENTIRE
    ESTABLISHED EFFECT OF THIS LANE and it changes no parameter recommendation
    anywhere. Quoting sqrt(6) here would double-count negation and overstate the
    discount by 0.5 bits (see IDEA-20260807-a3d644 claim (D)).

    (D) THE FAMILIES, WITH THEIR VERIFICATION STATUS STATED HONESTLY.
      AFFECTED, j = 0, D_0 = -3, |Aut| = 6, 0.79 bits:
        - secp256k1: y^2 = x^3 + 7 over p = 2^256 - 2^32 - 977. a = 0 forces
          j = 0 by the definition j = 1728*4a^3/(4a^3 + 27b^2). PUBLIC AND
          DIRECTLY VERIFIABLE FROM THE PUBLISHED PARAMETERS. That this curve
          admits the standard GLV endomorphism is widely used in deployed
          implementations, which requires p congruent to 1 mod 3; the audit
          re-derives p mod 3 rather than relying on that.
        - BN and BLS12 pairing families (including BLS12-381, y^2 = x^3 + 4):
          constructed with CM discriminant -3 and curve equation y^2 = x^3 + b,
          hence j = 0. This is a property of the construction, stated in the
          families' definitions; the audit re-derives j from the published (a,b)
          rather than relying on the construction.
      AFFECTED, j = 1728, D_0 = -4, |Aut| = 4, 0.50 bits:
        - Curves of the form y^2 = x^3 + a x with p congruent to 1 mod 4. NO
          WIDELY DEPLOYED PRIME-FIELD SIGNATURE OR KEY-EXCHANGE CURVE IN THIS
          PROGRAM'S CORPUS IS KNOWN TO BE OF THIS SHAPE, and the audit's job is
          to confirm or refute that by running (A) over the full curve list
          rather than asserting it.
      SAFE, |Aut| = 2, 0.00 bits:
        - NIST P-256, P-384, P-521: a = -3 with b derived pseudorandomly from a
          published seed. j is generic and no small-|D_0| structure was designed
          in. THE EXACT D_0 IS NOT COMPUTED IN THIS RECORD; the claim is the
          weaker and exactly checkable one that D_0 is not among the nine, which
          test (A) settles in nine square tests. THE BRIEF'S OBSERVATION THAT
          P-256 DOES NOT HAVE SMALL |D_0| IS THEREFORE A CHECKABLE CLAIM AND THIS
          RECORD CHECKS IT RATHER THAN REPEATING IT.
        - Brainpool: verifiably pseudorandom by construction; same treatment.
      UNVERIFIED, MARKED [open]:
        - Curve25519 / Ed25519, and every other curve in the corpus not listed
          above. This record does NOT state their D_0. It states the test and
          requires the executor to run it. Asserting a discriminant from memory
          is exactly the fabrication AGENTS.md rule 9 forbids, and a table cell
          that reads "[open], test not yet run" is a correct entry while a
          guessed one is not.
      OUT OF SCOPE:
        - GLS and Q-curve constructions over F_{p^2}, and Koblitz curves over
          binary fields. Both carry larger exploitable endomorphism structure,
          both are outside this campaign's prime-field scope, and neither is
          covered by any number in this record.

    (E) WHAT IS CLAIMED BEYOND THE CONSTANT: NOTHING. The audit's entire output
    is a table whose largest entry is 0.79 bits. It is filed as scope and
    baseline calibration. Its value is that it makes every other L3 result
    reportable with a correct affected-versus-safe statement, which is checklist
    item C18-style scope honesty in docs/target-result-profile.md terms and is
    required of any asymptotic or concrete claim this campaign eventually makes.

  resource_label: >-
    "audit: consumes no resource". No attack is mounted and no R1-R8 resource is
    consumed; the record consumes only public curve parameters and integer
    arithmetic.

  admissibility: admissible
  admissibility_argument: >-
    A scope audit names no mechanism and therefore cannot be inadmissible. It
    does interact with the filter in one useful way: by establishing that the
    affected set is exactly {D_0 = -3, D_0 = -4} and that the effect there is
    0.79 and 0.50 bits, it bounds in advance what ANY admissible L3 mechanism
    could be worth on a deployed curve, which is the cheapest possible sanity
    frame for the rest of the lane.

  discriminated_from:
    - >-
      KN-TECH-018, which records the sqrt(|Aut|) discount and notes that
      "generic ordinary prime-field curves have |Aut| = 2" but does not enumerate
      deployed curves, does not give a bit table, does not resolve the baseline
      ambiguity of claim (C), and does not supply the cheap D_0 test of claim
      (A).
    - >-
      IDEA-20260807-a3d644 (this batch), which MEASURES the constant on toy
      curves with matched nulls. This record does not measure anything on a
      curve; it AUDITS which real curves the constant applies to. The two share
      claim (C)'s arithmetic and must report the same number.
    - >-
      IDEA-20260807-778375 (this batch), which asks what small |D_0| makes
      COMPUTABLE. This record asks which deployed curves HAVE small |D_0| - and
      supplies the surprising structural point (B) that the two questions have
      different answers, because seven of the nine class-number-one discriminants
      confer no automorphism at all.
    - >-
      Lane L8 (RQ-PAIR-21313f), which owns embedding degree and pairing-friendly
      families. The BN/BLS12 curves appear in both. There the question is
      k_emb and MOV transfer; here it is only j = 0 and |Aut| = 6. The two
      statements are independent and this record makes no claim about pairing
      security.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (D_0, |Aut|) of a deployed curve, computed from its published
      parameters, followed across the corpus of standardised curves.
    lossiness: >-
      EXTREMELY LOSSY: a 256-bit curve collapses to two small integers. Nothing
      about any point, key or logarithm is recoverable. The projection retains
      exactly the two quantities that determine this lane's entire effect and
      discards everything else.
    propagation: >-
      Deterministic and, notably, ISOGENY-INVARIANT: D_0 is a function of the
      trace and is therefore constant on an F_p-isogeny class (T4), and |Aut| is
      determined by j which is determined up to the finitely many curves in the
      class. So the object propagates through the one operation this campaign
      cares about - moving to an isogenous curve - by staying put. That is
      exactly why the audit is a permanent property of a curve family rather than
      something an attacker can improve.
    survival_score: >-
      Survives every isogeny in the class, every isomorphism, every change of
      model, every change of coordinates. Dies only at a change of base field
      (over F_{p^2} more automorphisms become rational, which is why GLS is out
      of scope). It is one of the most robust objects available in this campaign,
      and its robustness is precisely what makes the affected set unimprovable.

  mechanism: >-
    STEP 1 (implementation, low). Write the audit: given (p, a, b, #E) from
    published parameters, compute j = 1728*4a^3/(4a^3+27b^2) mod p, t = p+1-#E,
    D = t^2 - 4p, and run the nine square tests of claim (A) plus a sweep
    |D_0| <= 10^6. Emit (j, D_0 if found else "not small, |D_0| > 10^6",
    |Aut| from j and p mod 3 / p mod 4, extra discount sqrt(|Aut|/2), bits).

    STEP 2 (validation before use - MANDATORY). Validate the audit on toy curves
    where D_0 is computable by brute-force factoring of t^2 - 4p, at 16-24 bits,
    over at least 200 curves including deliberately constructed D_0 = -3 and
    D_0 = -4 instances. The square-test route and the factoring route must agree
    on 100 percent. A single disagreement halts the line: an audit tool that
    misclassifies a discriminant would put a wrong entry in a scope table, which
    is worse than having no table.

    STEP 3 (the corpus run). Run the audit over every prime-field curve the
    program's corpus names with published parameters. Emit the table. EVERY CELL
    IS EITHER A COMPUTED VALUE OR THE LITERAL STRING "[open], not computed" -
    never a remembered one.

    STEP 4 (the cross-check that catches the most likely error). For each curve
    the audit reports as j = 0, independently verify a = 0 in the published
    equation; for each reported j = 1728, verify b = 0. j is computed from (a,b)
    so this is nearly circular, but it catches transcription errors in p, a or b,
    which are the realistic failure mode of an audit like this.

    STEP 5 (the bit table). Combine with claim (C) to produce, per curve: subgroup
    bit size, generic rho cost 0.886*sqrt(N), discounted cost, and the bit
    difference. State plainly, in the table's own caption, that no entry moves any
    parameter recommendation and that the largest entry is 0.79 bits.

    STEP 6 (the negative deliverable, and it is the one most likely to be
    cited). Write the sentence this lane needs and currently lacks: "The L3
    effect is confined to curves with D_0 in {-3, -4}; it is at most 0.79 bits;
    it cannot be acquired by a curve that does not already have it, because by T4
    j = 0 requires D_0 = -3 and no isogeny walk changes D_0; and seven of the
    nine class-number-one discriminants confer none of it."

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) grep -ril "secp256k1" knowledge/ -> 7 files, all literature entries or
          the SOURCES index
      (2) read knowledge/techniques/KN-TECH-018.md in full
      (3) read knowledge/techniques/KN-TECH-006.md in full
      (4) grep -ril "small discriminant\|CM discriminant\|fundamental
          discriminant" knowledge/ -> 7 files, predominantly literature
      (5) read ledger/questions/RQ-JINV-8fc13a.yaml and DECOMPOSITION.md L3
    results: >-
      secp256k1 appears in the corpus only bibliographically; NO RECORD IN THIS
      REPOSITORY STATES ITS j-INVARIANT, ITS D_0, OR ITS AUTOMORPHISM DISCOUNT.
      KN-TECH-018 states the general sqrt(|Aut|) rule and the general remark that
      the program's target family "generally excludes" special structure, without
      naming a single deployed curve. No bit table exists anywhere in the corpus.
      No record contains the square-test observation of claim (A) or the
      structural point (B) that most small-|D_0| curves have |Aut| = 2.
    verdict: >-
      ADAPTATION. That secp256k1 is a j=0 GLV curve and that BN/BLS curves have
      CM discriminant -3 are widely known public facts and nothing about them is
      claimed as new. That |Aut| over prime fields is 2, 4 or 6 is textbook. What
      is new to this program is the audit itself, the square-test costing, point
      (B), and the baseline-anchored bit table. No novelty is claimed against the
      external literature.

  null_object_control: >-
    MANDATORY AND BLOCKING, and for an audit the null is a KNOWN-ANSWER SET.
    N1 KNOWN-POSITIVE SET: toy curves constructed deliberately with D_0 = -3
      (a = 0, p congruent to 1 mod 3) and D_0 = -4 (b = 0, p congruent to 1
      mod 4). The audit MUST classify 100 percent of them correctly.
    N2 KNOWN-NEGATIVE SET: toy curves with random (a,b), for which D_0 is
      computed independently by factoring t^2 - 4p. The audit must not report a
      small |D_0| for any curve whose factored D_0 is large. FALSE POSITIVES ARE
      THE DANGEROUS ERROR HERE, because a false positive would put a deployed
      curve in the affected column.
    N3 THE ISOGENY-INVARIANCE CHECK, which is the sharpest: enumerate a small
      toy isogeny class and confirm the audit returns the SAME D_0 for every
      curve in it, as T4 requires. An audit whose answer varies within an isogeny
      class is wrong, and this control catches errors the other two cannot.
    N4 THE TWIST CHECK: the six sextic twists of a j=0 curve all have j = 0 but
      lie in different isogeny classes with different traces. The audit must
      report j = 0 and D_0 = -3 for all six despite the differing t. If it does
      not, it is confusing the class with the curve.
    DECAY PARAMETER: |D_0| itself, swept from 3 upward. The reported discount
    must be 0.79 bits at |D_0| = 3, 0.50 at 4, and EXACTLY 0.00 at every larger
    |D_0| including 7, 8, 11, 19, 43, 67 and 163. A discount that decays
    gradually with |D_0| rather than dropping to zero immediately after 4 is
    wrong and indicates the tool is conflating "CM" with "extra automorphism" -
    which is precisely the error claim (B) exists to prevent.

  assumptions:
    - >-
      Published curve parameters are used as published; no parameter is
      recalled from memory. If a parameter is not in this repository's corpus,
      the audit cell reads "[open], parameters not in corpus" and the executor
      must obtain them from a cited source before filling it.
    - >-
      The formula j = 1728 * 4a^3 / (4a^3 + 27b^2) for short Weierstrass form.
      Curves given in Montgomery or Edwards form are converted to short
      Weierstrass first and the conversion is recorded, because j is a model
      invariant but a and b are not.
    - >-
      |Aut_{F_p}(E)| is 6 iff j=0 and p congruent to 1 mod 3, is 4 iff j=1728 and
      p congruent to 1 mod 4, and is 2 otherwise, for p > 3. Textbook; verified
      empirically on the toy known-answer sets in Step 2.
    - >-
      The nine class-number-one discriminants are exactly
      {-3,-4,-7,-8,-11,-19,-43,-67,-163} (Heegner-Stark-Baker). Cited as
      classical, not re-derived; nothing in the audit's correctness depends on
      the list being complete, since the sweep to |D_0| <= 10^6 does not use it.
    - >-
      This record makes NO security claim about any deployed system. The largest
      number it produces is 0.79 bits and it explicitly recommends no parameter
      change.

  proof_search_map:
    bottleneck: >-
      Deciding D_0 from D = t^2 - 4p without factoring. That is the only
      technical step and claim (A) resolves it: testing a candidate d requires
      one perfect-square test of D/d, so a bounded sweep is linear in the bound
      with no factorisation anywhere.
    baseline_embedding:
      parameter_slice: >-
        Toy curves at 16-24 bits, where t^2 - 4p is small enough to factor
        outright. The square-test audit must reproduce the factoring-based D_0
        exactly on every one.
      reproduction_check: >-
        Frozen fixture of 200 toy curves with D_0 computed both ways; exact
        integer equality required on 200 of 200. Any mismatch halts the line
        before any deployed curve is audited.
    observation_collision:
      observable: >-
        The pair (D_0, |Aut|).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED IN BOTH DIRECTIONS, and both collisions
        are informative.
        (i) Same (D_0, |Aut|) = (-3, 6), different curves: every j=0 curve over
        every p congruent to 1 mod 3 collides. So the observable identifies a
        FAMILY and not a curve, which is correct and is why the audit outputs a
        family classification rather than a per-curve security claim.
        (ii) Same |D_0| smallness, different |Aut|: D_0 = -163 and D_0 = -3 are
        both class-number-one CM discriminants but have |Aut| 2 and 6. This
        collision is claim (B) and it is the reason "small |D_0|" is the wrong
        column heading for the affected set.
    quantifier_order: >-
      Intended: FORALL prime-field curves E/F_p with p > 3 in the audited corpus,
      the extra rho discount over the negation-discounted baseline equals
      sqrt(|Aut_{F_p}(E)|/2), which is 1 unless j is 0 or 1728 with the
      corresponding congruence on p.
      The dangerous weaker reading, NOT claimed: FORALL E EXISTS a discount -
      which would suggest every CM curve gets something. It does not, and (B)
      says so. The audit obligation is that the table's "discount" column reads
      exactly 0.000 for every row with |Aut| = 2, including the small-|D_0| rows,
      and that no reader can infer otherwise from the layout.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Curve X has j-invariant j, fundamental discriminant D_0 (or |D_0| >
        10^6), automorphism group of order |Aut|, and therefore an extra rho
        discount of exactly sqrt(|Aut|/2) against this program's baseline
        convention." It can NEVER certify that curve X is secure, that no other
        structure exists, or that 0.79 bits is the total effect of all L3
        mechanisms - only that it is the total effect of the ESTABLISHED one.
      nearby_object_control: >-
        A CURVE WITH SMALL |D_0| BUT |Aut| = 2 - for instance a deliberately
        constructed D_0 = -7 or D_0 = -163 curve at toy scale. The hoped-for
        conclusion ("small discriminant means weaker") FAILS there, and the audit
        must report discount exactly 0.000. A tool that reports any discount for
        D_0 = -163 has not identified the load-bearing structure, which is the
        automorphism group and not the discriminant's size.
    proof_obligations:
      - claim: "D_0 = d iff D/d is a perfect square, for d fundamental."
        responsibility: correctness
      - claim: "|Aut| over F_p with p>3 is 2, 4 or 6, with the stated conditions."
        responsibility: correctness
      - claim: "Extra discount over the negation-discounted baseline is sqrt(|Aut|/2)."
        responsibility: correctness
      - claim: "The audit reproduces factoring-based D_0 on 200 of 200 toy curves."
        responsibility: baseline
      - claim: "D_0 is constant on an isogeny class (T4)."
        responsibility: soundness
      - claim: >-
          Every table cell is computed or explicitly marked [open]; none is
          recalled.
        responsibility: scope

  predictions:
    - metric: audit versus factoring agreement on the toy validation set
      direction: different
      minimum_effect: >-
        200 of 200 exact agreement. Anything less halts the line.
    - metric: secp256k1 classification
      direction: different
      minimum_effect: >-
        j = 0, D_0 = -3, |Aut| = 6, extra discount 0.792 bits. Any other result
        means either the published parameters in the corpus are wrong or the
        audit is, and must be resolved before the table is emitted.
    - metric: NIST P-256, P-384, P-521 classification
      direction: different
      minimum_effect: >-
        |D_0| > 10^6 and |Aut| = 2, extra discount exactly 0.000 bits. A small
        |D_0| for a NIST P-curve would be a significant and surprising finding
        requiring independent replication before any reporting.
    - metric: >-
        reported discount at |D_0| in {7, 8, 11, 19, 43, 67, 163}
      direction: different
      minimum_effect: >-
        Exactly 0.000 bits at every one. This is claim (B) and it is the audit's
        sharpest internal consistency check.
    - metric: D_0 across a toy isogeny class
      direction: different
      minimum_effect: >-
        Identical for every curve in the class, as T4 requires. Variation within
        a class means the audit is reading the curve rather than the class and
        is wrong.
    - metric: >-
        largest extra discount over the whole audited corpus, in bits
      direction: different
      minimum_effect: >-
        Predicted exactly 0.792. A larger value would exceed the |Aut| = 6
        ceiling, which is impossible over prime fields with p > 3, and therefore
        indicates a bug rather than a discovery.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR: STEP 2's VALIDATION SET PLUS THE THREE
      HEADLINE CURVES, AND IT COSTS UNDER A MINUTE OF COMPUTE. Run the nine
      square tests on secp256k1, on P-256 and on a deliberately constructed toy
      D_0 = -163 curve. The first must return -3 with a 0.792-bit discount, the
      second must return "not small" with 0.000, and the third must return -163
      with 0.000. Those three answers together verify the tool, verify claim (B),
      and produce the two most-cited rows of the table. Everything else is
      breadth.
    controls:
      - known-positive toy set with constructed D_0 = -3 and -4 (N1)
      - known-negative toy set with independently factored D_0 (N2)
      - isogeny-class invariance check (N3)
      - six sextic twists of one j=0 curve, all of which must report D_0 = -3 (N4)
      - >-
        nearby-object control: a D_0 = -163 curve, which must report a discount
        of exactly zero
      - >-
        transcription cross-check: reported j = 0 must coincide with a = 0 in the
        published equation
    required_metrics:
      - per curve: p, a, b, #E, N, cofactor, j, D_0 or "|D_0| > bound", |Aut|
      - per curve: extra discount as a ratio and in bits, against 0.886*sqrt(N)
      - the sweep bound used and the number of square tests performed
      - validation-set agreement rate, exact counts
      - pass/fail of N1-N4 and of the nearby-object control
      - explicit list of every cell marked [open] and why

  falsification_conditions:
    - >-
      The audit disagrees with factoring on any toy curve. The tool is wrong and
      no deployed curve is audited until it is fixed.
    - >-
      secp256k1 does not classify as j = 0, D_0 = -3. Either the corpus's
      parameters are wrong or the tool is; both must be resolved before anything
      is reported.
    - >-
      Any NIST or Brainpool curve classifies with |D_0| <= 10^6. Surprising,
      significant, and requires independent replication under AGENTS.md rule 12
      before it is reported, because it would be a claim about a standardised
      curve.
    - >-
      D_0 varies within a toy isogeny class. T4 is violated by the tool; every
      number void.
    - >-
      Any curve reports |Aut| outside {2,4,6}. Impossible over prime fields with
      p > 3; a bug.
    - >-
      A required curve's published parameters are not available in the corpus.
      That cell stays "[open]" - it is NOT filled from memory, and an audit with
      open cells is a correct audit while one with guessed cells is fabrication.

  confounders:
    - >-
      MODEL CONVERSION. Montgomery and Edwards curves must be converted to short
      Weierstrass before j is computed. A conversion error changes j and hence
      the classification, which is the single most likely way to get a wrong row.
    - >-
      COFACTOR AND SUBGROUP. The discount applies to rho on the prime-order
      subgroup G. Quoting it against the full group order rather than N would be
      an accounting error of up to log2(cofactor)/2 bits.
    - >-
      "SPECIAL" IS AMBIGUOUS AND THE AMBIGUITY IS THE LANE'S MAIN SCOPE HAZARD.
      A curve can be special by having small |D_0|, by having a special p (e.g. a
      pseudo-Mersenne prime), by being pairing-friendly, or by having extra
      automorphisms. Only the last confers the discount. The table has separate
      columns and no row may be summarised by a single word.
    - >-
      PAIRING-FRIENDLY IS A DIFFERENT AXIS. BN and BLS12 curves are affected here
      because they are j = 0, and separately have small embedding degree, which
      is lane L8's subject. Conflating the two would misstate both; this record
      makes no pairing claim.
    - >-
      THE SWEEP BOUND IS NOT INFINITY. "|D_0| > 10^6" is what the audit can
      certify; it is not "D_0 is large" in any stronger sense. Every negative
      cell names the bound that was actually swept.

  interpretation_limits:
    - >-
      No security claim about any deployed system. The largest number in the
      table is 0.79 bits and no parameter recommendation changes.
    - >-
      The table covers the ESTABLISHED L3 effect (the automorphism discount)
      only. If another L3 proposal in this batch finds anything, the table must
      be extended by a superseding record; it may not be read as an upper bound
      on all possible special-j effects.
    - >-
      Scoped to prime fields with p > 3. GLS/Q-curves over F_{p^2} and Koblitz
      curves over binary fields carry larger endomorphism structure and are
      outside every number here.
    - >-
