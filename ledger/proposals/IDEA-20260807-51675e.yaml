  reachability_gate: >-
    CENTRAL TO THIS RECORD AND STATED AS A HARD LIMIT. By T4, D_0 is an isogeny
    class invariant and j = 0 requires D_0 = -3, so a curve whose class does not
    contain a j = 0 curve CANNOT BE WALKED TO ONE AT ANY COST - not in
    polynomial time, not in exponential time, not at all, because the target does
    not exist in the class. The affected set is therefore FIXED AT CURVE
    GENERATION TIME and cannot be enlarged by any attacker action. Symmetrically,
    a curve that IS j = 0 cannot escape the discount. This makes the audit a
    permanent classification rather than a snapshot, and it is the strongest form
    the reachability gate takes anywhere in this batch: T5's cost question does
    not even arise, because the walk is not expensive - it is impossible.

