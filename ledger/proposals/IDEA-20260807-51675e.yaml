      at sqrt(N) time and memory, full cost N^{2/3+o(1)} (KN-TECH-031).
    hidden_overhead: >-
      Disclosed: the bit table charges ONLY the birthday-constant discount and
      does not charge the fruitless-cycle escape overhead at |Aut| = 6, which
      this program has not measured (IDEA-20260807-f00729 guidance G3,
      IDEA-20260807-a3d644 Step 5). The 0.79 bits is therefore an UPPER BOUND on
      the realised advantage and the table says so in its caption.
    tradeoff_note: >-
      Not applicable - no algorithm is proposed. The only tradeoff recorded is
