idea:
  id: IDEA-20260918-5a9a51
  question_id: RQ-ECDLP-002
  added: '2026-09-18'
  status: proposed
  approved_by: null
  title: Sarkar-Singh incidence plus function-first relation generator
  class: algorithm
  claim: >-
    A direct benchmark is missing between three related decomposition paradigms:
    Semaev summation-polynomial solving, the program's function-first support
    constraint H|L_V, and Sarkar-Singh-style geometric/incidence relation generation
    on special low-genus curves. The useful question is not whether incidence relations
    exist, but whether solving for a low-dimensional function/incidence object before
    extracting factor-base points lowers complete cost per verified relation on curve
    families where the construction applies.
  mechanism: >-
    Reverse the usual root-first decomposition order. Represent a candidate relation
    by coefficients of a low-degree line/function whose divisor or intersection is
    forced to lie in factor-base support. Solve the coefficient/support constraint
    first, then factor or extract intersection points and verify the divisor/group
    relation. This aligns with H|L_V and quotient-space rank testing: eliminate the
    fixed support span once, search in a small coefficient quotient, and extract points
    only after a valid function is found.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-18'
    scope: >-
      Triggered by Galbraith's slide pointing to Sarkar-Singh and by the existing
      function-first decomposition program. This is a comparison/composition study,
      not a claim that incidence relation generation is new.
    overlap_review: >-
      The repository contains Nagao/function-first work and Sarkar-Singh references,
      but the search did not locate a direct experiment implementing the Sarkar-Singh
      relation generator as a backend against both Semaev and the current H|L_V solver.
  citations:
    - ref: inputs/refs/research/PO_transfer_006_contract.md
      provenance: retrieved
      claim: The repository cites Sarkar and Singh, A New Method for Decomposition in the Jacobian of Small Genus Hyperelliptic Curves, ePrint 2014/815.
      verified_by: repository
    - ref: https://eprint.iacr.org/2015/179
      provenance: user_supplied_pointer_unverified
      claim: Galbraith's slide identifies Sarkar and Singh, A Simple Method for Obtaining Relations Among Factor Basis Elements for Special Hyperelliptic Curves, as a line/intersection relation-generation method; freeze/read before use.
      verified_by: null
    - ref: knowledge/literature/KN-LIT-ebd657.md
      provenance: retrieved
      claim: Nagao's Riemann-Roch formulation supplies nearby coefficient/function-first decomposition language and documents disjoint factor bases separately.
      verified_by: repository
  citation_note: The exact 2015/179 source is not frozen in this repository; primary-source retrieval is a hard precondition.
  assumptions:
    - First reproduce the published special-curve construction on generated toy instances before any elliptic or broader transfer.
    - Do not claim the hyperelliptic method applies generically to elliptic curves.
    - Semaev, function-first and incidence arms use matched support size, target semantics and relation verification where comparable.
    - Every relation is independently verified from recovered points or divisors.
    - Function factoring/root extraction, failed candidates and setup are fully charged.
  proof_search_map:
    bottleneck: Whether coefficient-first support enforcement reduces search dimension enough to offset function construction, factorization and special-family density.
    baseline_embedding:
      parameter_slice: Reproduce a published Sarkar-Singh special-curve example and the same relation set by brute-force intersection enumeration.
      reproduction_check: Exact recovered point/divisor sets and relation multiplicities must agree with exhaustive enumeration at the smallest cells.
    observation_collision:
      observable: Total work per independent verified relation split into setup, coefficient solve, extraction, verification and failures.
      distinct_preimage_search: Compare incidence coefficient-first, current H|L_V quotient-rank and Semaev on the same relation predicate wherever defined.
    constructive_transforms:
      - transform: coefficient_first_incidence
        proposed_object: Low-degree function or line coefficients with support constrained to the factor base.
        predicted_gain: Search a smaller coefficient space before committing to point roots.
      - transform: quotient_space_rank
        proposed_object: Support constraint projected modulo the fixed factor-base span.
        predicted_gain: Reuse one elimination of the fixed span across targets and test only a small target-dependent quotient.
    quantifier_order: Reproduce source special cases first; only then compare fresh targets or attempt generalization.
    method_ceiling:
      strongest_certifiable_claim: A scoped backend comparison on explicit special curve families plus a separate elliptic control.
      nearby_object_control: Plain line-through-two-points group-law evaluation is a control, not a new relation generator.
    proof_obligations:
      - claim: The coefficient predicate is equivalent to the intended support-constrained relation on each tested family.
        responsibility: correctness
      - claim: All intersection multiplicities and points at infinity are recovered.
        responsibility: correctness
      - claim: Function construction, factoring and failed candidates are charged.
        responsibility: runtime
      - claim: Special-family density is reported separately from per-instance solver cost.
        responsibility: scope
  predictions:
    - metric: complete_cost_per_verified_relation
      direction: lower
      minimum_effect: At least 20% lower complete cost than the strongest matched Semaev baseline at three increasing sizes on a valid source family.
    - metric: target_dependent_unknown_count
      direction: lower
      minimum_effect: Coefficient-first system uses strictly fewer target-dependent unknowns after fixed-span elimination than the direct root system.
  minimal_test:
    design: >-
      Phase 0 freezes and reads ePrint 2015/179 and nearest Sarkar-Singh/Nagao
      sources. Phase 1 reproduces at least two published or synthetic special
      hyperelliptic examples by exhaustive intersection enumeration. Phase 2
      implements three backends: incidence coefficient-first, current H|L_V
      quotient-space rank, and the strongest applicable Semaev/Nagao baseline.
      Phase 3 runs an increasing size ladder with identical support cardinality and
      fresh targets. Phase 4 runs an elliptic control where line intersections are
      compared to direct group-law/Semaev relations, with no assumption that the
      special hyperelliptic advantage transfers.
    controls:
      - Exhaustive brute-force relation census at the smallest size.
      - Independent divisor/group-law relation verifier.
      - Repeated-root and point-at-infinity cases retained.
      - Random coefficient systems with matched dimensions as solver nulls.
      - Root-first Semaev and current H|L_V backends on matched predicates.
      - Elliptic line-intersection control prevents rebranding the group law as a new mechanism.
    required_metrics:
      - target_dependent_unknown_count
      - fixed_preprocessing_cost
      - coefficient_solver_wall_seconds
      - quotient_rank_test_operations
      - factorization_and_root_extraction_seconds
      - failed_candidate_count
      - verified_relation_count
      - independent_relation_rank
      - total_cost_per_verified_relation
      - memory_peak
      - curve_family_applicability_density
  falsification_conditions:
    - The source construction cannot be reproduced exactly on its stated special family.
    - Coefficient-first search plus extraction is not cheaper than the matched baseline at any increasing size.
    - The apparent gain comes only from a narrower/easier factor base or selected targets.
    - Elliptic specialization collapses to ordinary group-law work with no support-search advantage.
    - Function-first and incidence predicates are not equivalent on claimed comparison cells.
  confounders:
    - Special hyperelliptic structure being mistaken for a generic solver improvement.
    - Different factor-base densities or support cardinalities.
    - Ignoring multiplicities or infinity in intersection extraction.
    - Charging successful coefficient solves but not failures.
    - Reusing preprocessing across one arm but not the others.
  interpretation_limits:
    - Proposal only; no source has been newly frozen and no experiment has run.
    - ePrint 2015/179 is a user-supplied pointer until primary retrieval is completed.
    - A result on special hyperelliptic curves does not imply a generic elliptic-curve result.
    - Constant-factor backend improvements do not imply sub-rho asymptotics.
  heuristic_assumptions: []
  heuristic_note: The first phase is exact reproduction; later distributional assumptions must be explicit and tested.
  target_complexity:
    time_exponent: Unknown.
    memory_exponent: Unknown.
    best_known: Strongest matched Semaev/Nagao/function-first backend on the same predicate.
    hidden_overhead: Source-family construction, fixed-span elimination, failures, factoring/extraction and verification.
    tradeoff_note: A smaller coefficient system can still lose if extraction or family-selection cost dominates.
  estimated_cost:
    implementation: medium
    compute: low_to_medium
    qualification: Literature freeze and a faithful small-case reproducer should precede larger solver engineering.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: Unmeasured.
  frontier_check:
    status: pending
    note: Requires direct read of 2015/179 and dedup against all Nagao/function-first experiment records before approval.
  recommended_priority: high
  priority_rationale: Concrete literature-anchored decomposition backend directly connected to current function-first work and cheaply falsifiable.
  first_deliverable: Frozen primary-source note plus a small exact reproducer matching exhaustive intersection enumeration.
  next_gate: Retrieve/freeze ePrint 2015/179, complete overlap review, then draft a three-backend immutable benchmark contract.
