# IDEA-20261003-51448c
# Square-root scale at order 101. Proposal only. Not approved.
idea:
  id: IDEA-20261003-51448c
  question_id: RQ-ECDLP-001
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    At order 101, 10 squared is 1 below the order and 11 squared exceeds it by 20
  class: measurement
  claim: >-
    For the frozen toy order 101, 10 times 10 is 100, which is 1 below
    101, and 11 times 11 is 121, which exceeds 101 by 20. A square-root
    budget that stops at 10 squared has not covered the order. The gap
    is a scale check, not an ECDLP algorithm.
  mechanism: >-
    The generic discrete-logarithm scale is the square root of the group
    order. This proposal freezes one prime order and checks the two
    consecutive squares around it. It does not run a walk.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-001
      provenance: internal
      claim: >-
        The question is the prime-field discrete logarithm, whose generic
        scale is the square root of the order.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic floor is the scope constraint for any exponent claim.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The order 101 is the frozen toy parameter.
    - No walk is run.
  proof_search_map:
    bottleneck: The gap between 101 and the two neighboring squares.
    baseline_embedding:
      parameter_slice: The order 101 and the integers 10 and 11.
      reproduction_check: >-
        Two readers compute 10 squared and 11 squared and must agree on
        the gaps 1 and 20.
    observation_collision:
      observable: The two gaps.
      distinct_preimage_search: >-
        Reporting 10 squared as equal to 101 drops the gap 1.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The order 101.
        predicted_gain: Two integer gaps. No walk.
    quantifier_order: >-
      The order is fixed before the squares are computed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The gaps 1 and 20 at this order. Not a rho run.
      nearby_object_control: >-
        The order 100, where 10 squared meets the order exactly.
    proof_obligations:
      - claim: 10 squared is 100, and 101 exceeds 100 by 1.
        responsibility: correctness
      - claim: 11 squared is 121, and 121 exceeds 101 by 20.
        responsibility: size
      - claim: The gaps are not an algorithm.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: square_gaps
      direction: different
      minimum_effect: 101 exceeds 100 by 1, and 121 exceeds 101 by 20.
  minimal_test:
    design: >-
      Compute the two squares. Subtract. Do not run a walk.
    controls:
      - The order 100, met by 10 squared.
      - An independent multiplication.
    required_metrics:
      - both squares
      - both gaps
  falsification_conditions:
    - 10 squared is not 100.
    - 11 squared does not exceed 101 by 20.
  confounders:
    - Using a real square-root approximation instead of the integer squares.
  interpretation_limits:
    - One order is not a complexity theorem.
    - No transfer to a cryptographic group order.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The generic scale at order 101 sits between the squares 100 and 121.
      rigorous_support: >-
        10 squared is 100 and 11 squared is 121, and 100 is less than 101
        which is less than 121. No distribution is assumed.
      validation_plan: >-
        Recompute the products. A mismatch voids the scale check.
  target_complexity:
    time_exponent: No exponent claimed. The generic reference remains 1/2.
    memory_exponent: O(1)
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Distinguished-point constants are not in this check.
    tradeoff_note: The check is arithmetic, not a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic floor is the exponent constraint. This record checks
          two squares at one toy order and claims no walk.
  dominated_by: >-
    No attack is claimed. Rho rows dominate any attack reading of a
    square-root scale check.
  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: One frozen order and two squares.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
