  assumptions:
    - >-
      That the list is regenerable at cost N per pass, i.e. that Algorithm 1's
      cost is dominated by the number of entries. This is Lemma 3.3 and is the
      basis of the shard accounting; a generator with a cheaper restart would
      change the S-factor and must be exhibited rather than assumed.
    - >-
      That the codomain map is essentially injective on L at these parameters,
      so |C(E)| = N^{1-o(1)}. Expected: collisions among N = p^{1/3} codomains
      in p/12 vertices number about N^2/p = p^{-1/3}, i.e. none. NOTE THE
      CONSEQUENCE, WHICH IS NOT AN ASSUMPTION BUT A FACT WORTH RECORDING: a
      codomain collision WITHIN the single list is itself a non-scalar
      endomorphism of E (compose one with the dual of the other), so the
      incumbent has a second success channel it never mentions -- and that
      channel's success probability is N^2/p = X^4/p, which equals 1 only at
      X = p^{1/4}, i.e. it is exactly the classical p^{1/2} meet-in-the-middle
      and contributes p^{-1/3} at the incumbent's parameters. It is recorded
      here so that a measured collision rate above N^2/p is recognised as either
      a bug or a discovery, and neither is silently absorbed.
    - >-
      That the shard partitions are balanced. Unbalanced partitions change the
      S accounting and are measured rather than assumed (required metric below).
    - >-
      That the recogniser reduction preserves correctness: streaming L and
      querying R at cod(psi)^{(p)} finds the claw whenever R has no false
      negatives on C(E). Immediate from Lemma 3.4, which guarantees both members
      are in L.

  proof_search_map:
    bottleneck: >-
      The claw step of Algorithm 2 and its table: the step that forces memory
      equal to time. Removing it -- achieving mu < 1 at alpha = 1 -- would move
      the frontier that VW currently owns and would answer the open problem the
      frozen source states at line 39.
    baseline_embedding:
      parameter_slice: >-
        S = 1 in the shard accounting reproduces the incumbent exactly:
        time N, memory N, 2*alpha + mu = 3. w = N in the VW formula reproduces
        the same point, which is the check that the two accountings agree at
        their common endpoint. The polynomial-memory endpoint w = poly(log p)
        reproduces p^{1/2+o(1)}, the unconditional tier.
      reproduction_check: >-
        SYMBOLIC AND FROZEN: a fixture evaluating (S*N)^2 * (N/S) and
        sqrt(N^3/w)^2 * w and asserting S*N^3 and N^3 respectively, plus the
        two endpoint values. Any candidate scheme is required to be evaluated by
        the same fixture, so that a scheme cannot be reported as an improvement
        without being placed on the same axis as VW.
    observation_collision:
      observable: >-
        The output of a candidate membership predicate on a curve j, i.e. the
        claimed certificate "j is in C(E)".
      distinct_preimage_search: >-
        THE COLLISION IS THE HEART OF THE DESIGN AND IS SEARCHED FOR BY
        CONSTRUCTION: C(E) and C(E'') for an independent random E'' are two
        distinct ground-truth objects, one on each side of the conclusion
        ("recognises this instance's codomain set" versus "recognises reachable
        sets in general"). A predicate that cannot separate them has collided
        and is disqualified as a recogniser even if it separates C(E) from a
        uniform random subset. This is why the shape-matched null is primary.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "reduce the memory of the claw" by the single decision problem
          "recognise membership in C(E) in sublinear memory", via the streaming
          reduction in claim (C).
        predicted_gain: >-
          No cost gain claimed. The gain is that the memory lever becomes one
          falsifiable object with a null and a calibration, instead of a family
          of schemes each of which must be refuted separately -- and (B) shows
          the family is already refuted wholesale by an S-factor.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (a candidate predicate's verdict) fixed and vary
          the forgotten structure (which curve E generated the set). The
          intrinsic invariant that must distinguish the resulting objects is
          E-dependence itself; a predicate with none is in the fibre and is
          useless.
        predicted_gain: >-
          A disqualification rule available before any compute, applied to every
          member of the pre-registered predicate family.
    quantifier_order: >-
      There EXISTS a recogniser family R_E, computable from E in time N and
      memory m(N), such that FOR ALL supersingular E and FOR ALL F, R_E(F)
      answers "F in C(E)" with no false negatives, in time c. THE ORDER IS THE
      TRAP: R is allowed to depend on E (it must -- that is the whole content),
      but its MEMORY m must be sublinear in N uniformly over E, and its
      preprocessing may not itself store the list. A "recogniser" whose
      preprocessing keeps N entries is the incumbent wearing a different name,
      and the quantifier order is where that substitution would hide.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No member of the pre-registered predicate family separates C(E) from
        C(E'') by more than the derived midpoint bias, at the tested primes and
        sample sizes." That is a statement about ONE finite family of cheap
        statistics of j at toy scale. It is NOT a statement that C(E) is
        incompressible, and it may never be cited as one. In particular it says
        nothing about recognisers using quaternion-side data.
      nearby_object_control: >-
        THE F_p LOCUS. For the sub-problem in which the target stratum is
        {delta = 1}, a perfect O(1)-memory recogniser DOES exist ("is j in
        F_p?"), so the hoped-for conclusion "no sublinear recogniser exists"
        is KNOWN FALSE at that nearby object. Any argument or measurement that
        cannot distinguish {delta = 1} from C(E) has not identified the
        load-bearing structure, and the battery must be run against the F_p
        locus as a POSITIVE control where a predicate must score AUC 1.0.
    proof_obligations:
      - claim: "Rebuild-and-shard has time^2 x memory = S N^3, hence 2 alpha + mu = 3 + log_N S."
        responsibility: memory
      - claim: "The claw's two members lie in the same shard for any Frobenius-invariant codomain predicate, and in a known shard PAIR for the degree predicate."
        responsibility: correctness
      - claim: "Streaming plus a false-negative-free recogniser R yields time N*c, memory m."
        responsibility: runtime
      - claim: "delta_{E'} <= delta_E for the true claw midpoint E'."
        responsibility: size
      - claim: "Under H1 the induced midpoint bias has magnitude (delta_E/(p/2)^{1/3})^{3/2}, a constant factor, not an exponent."
        responsibility: success_probability
      - claim: "The classification of admissible shard predicates covers predicates computable from the codomain j alone, and no others."
        responsibility: scope

  object_first_candidate:
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) parallel collision search as a thing
      to instantiate (IDEA-20260815-e94ea3 owns that, and this record's finding
      is that instantiating it is optimal within a family, not that it should be
      tried); (b) quantum claw and quantum memory models (IDEA-20260807-6c89a8
      owns them; this record is classical and says so); (c) list restriction as
      an exchange-rate measurement (IDEA-20260807-7424a9); (d) the auxiliary-
      target census. THE OBJECT HERE IS THE CODOMAIN SET AND ITS
      RECOGNISABILITY, which none of those tracks.
    tracked_object: >-
      C(E) = the SET OF CODOMAIN j-INVARIANTS of L(E,X,B), as a subset of the
      vertex set -- forgetting which isogeny produced each, forgetting the
      degrees, forgetting the kernels, keeping only the set.
    one_step_propagation_rule: >-
      Extending the radius from X to X' enlarges C(E) monotonically, and
      composing with Frobenius maps C(E) to C(E)^{(p)} = C(E^{(p)}) bijectively
      -- so the matching condition of Algorithm 2 is exactly the intersection
      C(E) cap C(E)^{(p)} being non-empty at a point carrying the planted split.
      Both operations are defined on the set alone, which is what makes the
      projection legitimate.
    newness_score: >-
      The SET is a genuinely different object from what the campaign tracks
      (isogenies, degrees, degree pairs, midpoint curves, Hecke operators). The
      shard accounting is elementary bookkeeping that nobody appears to have
      written down for this claw; the midpoint inequality delta_{E'} <= delta_E
      is derived here and is the only pre-run signal available; the recogniser
      reduction is the part that makes the memory lever a single object.
    testability_score: >-
      High: C(E) is directly enumerable at toy scale, the nulls are constructible
      at matched size, and every predicate in the family is cheap. The forced
      values (AUC 0.5 against the shape-matched null; AUC 1.0 for the F_p
      positive control; a factor-0.46 midpoint bias) are all available before
      the run.
    survival_score: >-
      The shard closure survives everything -- it is arithmetic. The measurement
      survives to whatever scale C(E) is enumerable, which is where the toy
      ceiling bites: at log2 p = 40, N is around 10^4-10^5 and an AUC advantage
      below about 0.02 is not resolvable, so the experiment can only exclude
      biases above a stated size, and the record must report that size rather
      than "no signal".

  lossy_projection_test:
    projection: "L(E,X,B) -> C(E), the set of codomain j-invariants."
    what_is_discarded: >-
      The isogeny attached to each codomain, its degree, its kernel, its smooth
      factorisation, and the multiplicity with which a codomain is reached. Only
      an unordered set of vertices remains.
    why_genuinely_lossy: >-
      Massively: N = p^{1/3} isogenies map to at most N codomains, and each
      codomain forgets a path of length Theta(log p) over an alphabet of size
      B. Recovering an element of L from its codomain is precisely a
      bounded-degree isogeny-finding problem, i.e. as hard as the step the
      algorithm is trying to perform. THE PROJECTION IS NOT INVERTIBLE, and the
      (Delta, Pi) failure mode of KN-TECH-056 -- where the discarded data is
      recoverable as the roots of a quadratic -- does not apply.
    why_compatible_with_the_operations: >-
      The algorithm's decision step reads ONLY the set: Algorithm 2 asks whether
      (E')^{(p)} is a key of the table, which is membership in C(E). Frobenius
      acts on the set (C(E)^{(p)} = C(E^{(p)})) and radius extension acts on the
      set (monotone union). So the retained part propagates deterministically
      through exactly the operations the target performs, which is the
      compatibility requirement.
    is_it_only_a_change_of_coordinates: >-
      NO on both failure modes. It is not invertible (above), and it is not
      constant across candidates: C(E) and C(E'') are different sets, and the
      whole measurement is whether anything cheap can tell them apart. ONE
      HONEST LIMITATION: the projection discards exactly the data a
      SUCCESS-CHANNEL analysis needs -- multiplicity. Because it forgets how
      many isogenies reach a codomain, it cannot see the second success channel
      recorded in the assumptions (a within-list codomain collision is itself an
      endomorphism), and any record using this projection must import that
      channel separately rather than concluding it does not exist.

  null_object_control:
    primary_null: >-
      SHAPE-MATCHED NULL: C(E'') for an independent uniformly random
      supersingular E'', at matched cardinality and matched degree profile
      (same B, same X, same smooth-degree multiset). This preserves everything
      about "being a smooth-reachable set" and destroys only the dependence on
      the specific E. FORCED VALUE: AUC = 0.5 for every predicate, because a
      recogniser for C(E) must use E. A predicate scoring above 0.5 here is a
      candidate; a predicate scoring 0.5 here but high against the secondary
      null has recognised reachable-set-ness and is disqualified.
    secondary_nulls:
      - >-
        UNIFORM RANDOM SUBSET of the vertex set at matched size. Diagnostic
        only: the instrument must score well ABOVE 0.5 here (C(E) really is
        structured), and a failure means the instrument is dead, so no negative
        may be read from it.
      - >-
        POSITIVE CONTROL WITH A KNOWN ANSWER: the F_p-rational locus, where the
        predicate "j in F_p" must score AUC 1.0. This is the nearby object where
        a sublinear recogniser is known to exist, and it calibrates the battery's
        power.
      - >-
        DERIVED-BIAS CALIBRATION: the true claw midpoint's delta-statistic,
        whose bias is predicted to be a factor about 0.46 in density and NOTHING
        MORE. The battery must recover a bias of that size on planted instances;
        if it cannot, it has no power to detect anything smaller and every
        negative it reports is bounded by its own resolution.
      - >-
        DECAY CONTROL: every advantage is measured at three list radii X. A
        genuine E-specific signal must decay as X grows (mixing); an advantage
        constant in X is recorded as an artifact per docs/inventor-protocol.md
        section 3.

  predictions:
    - metric: "invariant ratio (time^2 x memory) / N^3 for a rebuild-and-shard scheme at S shards"
      direction: higher
      minimum_effect: >-
        FORCED VALUE exactly S, for every S > 1, in a measured toy
        implementation as well as in the derivation. This is the closure's own
        calibration: if a measured implementation returns anything other than S,
        the accounting is wrong and the closure is withdrawn.
