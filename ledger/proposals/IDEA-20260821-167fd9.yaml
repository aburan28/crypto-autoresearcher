idea:
  id: IDEA-20260821-167fd9
  research_question: RQ-SSIQ-9702af
  question_id: RQ-SSIQ-9702af
  added: '2026-08-21'
  title: >-
    The memory lever is ONE object, not a family: every rebuild-and-shard
    reduction is dominated by van Oorschot-Wiener by exactly the shard count,
    so memory below p^{1/3} at time p^{1/3} requires a streaming RECOGNISER for
    the codomain set cod(L(E,X,B)) -- and the true claw midpoint carries a
    derived, computable bias (delta_{E'} <= delta_E) whose magnitude is a factor
    ~2, which is the calibrated yardstick against which any candidate
    recogniser must be measured
  class: measurement

  claim: >-
    SCOPE FIRST. No exponent is claimed to move, no algorithm is proposed, and
    nothing here states, implies, or is structured to suggest that a p^{1/4}
    algorithm over F_{p^2} exists, is likely, or is nearly obtained. The target
    is the MEMORY exponent at unchanged time, which the frozen source names as
    an open problem in its own words (line 39: "It is currently unclear how to
    reduce the memory cost without increasing the time").

    (A) THE ADMISSIBILITY INEQUALITY, AND WHY MEMORY IS A LIVE LEVER. Write
    N = p^{1/3+o(1)} for the claw size and let a candidate cost
    (time, memory) = (N^{alpha}, N^{mu}). Van Oorschot-Wiener golden-collision
    search, as the frozen source quotes it at line 39, costs sqrt(N^3/w) at
    memory w, i.e. it satisfies time^2 x memory = N^3. A candidate beats the
    entire VW family at its own memory IF AND ONLY IF 2*alpha + mu < 3. The
    incumbent has (alpha, mu) = (1, 1) and therefore sits EXACTLY ON the VW
    curve -- it is that curve's best-time endpoint, not a point above it. So
    mu < 1 at alpha = 1 is a genuine frontier move and not a consolation prize,
    and this record is about that move.

    (B) A CLOSURE WITH A NUMBER, AT ZERO COMPUTE. Call a memory reduction a
    REBUILD-AND-SHARD scheme if it partitions the list into S parts by some
    predicate and runs S passes, regenerating the list each pass and retaining
    only the current part. Its cost is time S*N*p^{o(1)}, memory (N/S)*p^{o(1)},
    hence 2*alpha + mu = 3 + log_N(S) > 3 for every S > 1. EVERY REBUILD-AND-
    SHARD SCHEME IS THEREFORE DOMINATED BY VAN OORSCHOT-WIENER, BY EXACTLY A
    FACTOR S IN THE INVARIANT time^2 x memory, with equality only at S = 1 (the
    incumbent). This covers both -- and, we argue, the only two -- shard
    predicates the object admits:
      (B1) THE MULTIPLICATIVE DEGREE, the unique group-valued invariant of an
           isogeny. It does not shard the two sides of the claw consistently,
           because the split (deg psi, deg chi) with deg psi * deg chi = delta_E
           is unknown; one must sweep S^2 shard PAIRS at N/S each, giving time
           S*N again.
      (B2) A FROBENIUS-EQUIVARIANT FUNCTION OF THE CODOMAIN, h with
           h(j^p) = h(j) -- concretely the F_p-coordinates of j, namely
           Tr(j) = j + j^p and Nm(j) = j^{1+p}. THIS IS THE ONE STRUCTURAL
           FEATURE OF THIS PARTICULAR CLAW THAT A GENERIC GOLDEN-COLLISION
           SEARCH DOES NOT USE, and it is recorded here because it is
           genuinely available: since the matching condition is
           cod(chi) = cod(psi)^{(p)}, both members of the true claw land in the
           SAME h-shard, so one pass per shard suffices and no pair sweep is
           needed. It still loses, and for a reason that is the whole point:
           GENERATION CANNOT BE RESTRICTED TO A SHARD. Algorithm 1 produces list
           elements by extension, not by address, so obtaining the elements of
           one shard costs a full regeneration.
    (C) CONSEQUENTLY THE MEMORY LEVER AND THE TIME LEVER ARE THE SAME OBJECT.
    If there is a streaming RECOGNISER R for the codomain set
    C(E) := { j(cod psi) : psi in L(E,X,B) } -- answering "is F in C(E)?" in
    time c and memory m after a preprocessing pass -- then the algorithm becomes:
    stream L once, query R at cod(psi)^{(p)}, stop at the first hit. Cost:
    time N*c, memory m, i.e. (alpha, mu) = (1 + log_N c, log_N m). So
    mu < 1 at alpha = 1 IS EXACTLY the existence of a sublinear-memory
    recogniser for C(E), and no other route to it survives (B). The same object
    also governs alpha through IDEA-20260821-e99afd's identity, so the lever map
    has one entry here, not two.

    (D) THE MEASUREMENT, WITH A DERIVED YARDSTICK RATHER THAN AN OPEN-ENDED
    FISHING TRIP. There is exactly one bias of the true claw midpoint that can
    be derived before any run, and it is derived here: if phi = eta o psi is the
    minimal conjugate isogeny split at E' = cod(psi), then
    psi^{(p)} o dual(eta) : E' -> E'^{(p)} has degree deg(eta)*deg(psi) =
    delta_E, so
                    delta_{E'}  <=  delta_E.
    THE MIDPOINT LIVES IN A STRATUM NO HIGHER THAN THE INSTANCE'S OWN. Under
    the density law (H1 of IDEA-20260821-e99afd) this is a bias of computable
    size and NOT an exponent: a generic curve satisfies delta <= delta_E with
    probability (delta_E / (p/2)^{1/3})^{3/2}, which for a typical instance
    (delta_E about 0.6 (p/2)^{1/3}) is about 0.46. A CONSTANT-FACTOR-2 BIAS,
    stated as such. The proposal is to pre-register that number as the
    instrument's CALIBRATION -- a signal of known size that a working detector
    must see -- and then ask whether any member of a pre-registered predicate
    family separates C(E) from a SHAPE-MATCHED null by more than that. Both
    outcomes are informative and neither is "try it and see": no separation
    beyond the derived bias is a measured obstruction closing recognition-based
    memory reduction within the tested family and leaving VW as the frontier;
    a separation whose density is N^{-Omega(1)} is the first candidate for
    mu < 1 and must immediately be scored against 2*alpha + mu < 3.

  mechanism: >-
    (1) THE SHARD ACCOUNTING, IN FULL. Let the list have N = Psi(X,B) X^{1+o(1)}
    entries and let D_1, ..., D_S partition the codomain space. Pass i
    regenerates the list (cost N, since Algorithm 1's cost is the number of
    entries it names, Lemma 3.3) and stores only entries with codomain in D_i
    (expected N/S entries if the partition is balanced). After S passes every
    entry has been in memory once and every pair within a shard has been
    compared. Time S*N, memory N/S, invariant (S N)^2 (N/S) = S N^3. VW achieves
    N^3. Dominated by S. The accounting is exact and needs no heuristic beyond
    balance of the partition, which is itself a measurable (see the required
    metrics).

    (2) WHY (B1) AND (B2) EXHAUST THE PREDICATES AVAILABLE WITHOUT SOLVING THE
    PROBLEM. A shard predicate must be evaluable on a list entry at unit cost
    and must be consistent across the two sides of the claw, i.e. it must not
    split the pair (psi, chi) into different shards. The claw's two members share
    (i) the product of their degrees, which is delta_E and is unknown -- hence
    (B1)'s pair sweep; and (ii) the Frobenius-orbit of their codomains, since
    cod(chi) = cod(psi)^{(p)} -- hence (B2). Any predicate depending on the
    codomain only through a Frobenius-invariant function is admissible; any
    other splits the pair with probability bounded away from zero and loses the
    guarantee. THIS IS A CLASSIFICATION OF THE AVAILABLE PREDICATES, NOT OF ALL
    CONCEIVABLE ONES: a predicate using E-dependent algebraic data not derivable
    from j alone is outside it, and that is the residual named in the forward
    guidance.

    (3) THE RECOGNISER REDUCTION, AND WHAT IT WOULD HAVE TO BEAT. C(E) is a set
    of N = p^{1/3+o(1)} vertices inside a graph of p/12 vertices, so a trivial
    recogniser stores it (m = N, the incumbent) and an information-theoretic
    floor for an exact recogniser is |C(E)| log(p/N) bits unless C(E) is
    compressible. THE QUESTION IS THEREFORE WHETHER C(E) IS COMPRESSIBLE, and
    it is a question about structure rather than about counting: C(E) is not a
    random set, it is the image of a ball-like algebraic construction. A ONE-
    SIDED filter suffices (false positives are cheap: each is resolved by
    recomputing a candidate path; false negatives are fatal, since the claw
    would be missed), which is exactly the regime in which a small measured bias
    can become an algorithmic saving -- and exactly the regime in which an
    uncontrolled bias becomes an artifact. Hence the null discipline in (4).

    (4) THE NULL THAT MATTERS IS THE SHAPE-MATCHED ONE, AND THIS IS WHERE MOST
    OF THE VALUE IS. Comparing C(E) with a uniformly random subset of the vertex
    set answers a different question -- "does C(E) have any structure at all?" --
    to which the answer is trivially yes, because C(E) is a smooth-degree
    reachable set. A recogniser must decide membership in C(E) FOR THE GIVEN E;
    a feature that separates C(E) from random but not from C(E'') for an
    independent random curve E'' recognises "reachable-set-ness" and is useless.
    THE PRIMARY NULL IS THEREFORE C(E'') AT MATCHED SIZE AND MATCHED DEGREE
    PROFILE, and the uniform-random subset is retained only as a secondary
    diagnostic that the instrument is alive. Getting this null right is the
    single design decision that separates this measurement from a
    "codomains-look-random" study.

    (5) THE STRUCTURAL TELL, PRE-COMMITTED. Any genuine E-specific signal must
    DECAY as the list radius X grows, because a longer smooth walk mixes and the
    codomain distribution approaches stationarity (the same Ramanujan mixing the
    frozen source invokes at line 193). A measured advantage that is constant in
    X is the canonical artifact signature named in docs/inventor-protocol.md
    section 3 and must be reported as an artifact, not a finding, unless a
    mechanism for its constancy is exhibited.

  novelty_status: unverified

