  confounders:
    - >-
      POINTWISE EVALUABILITY. Both the VW comparison and any streaming variant
      assume list elements can be produced from a short index without the table.
      They can -- decode an index to (smooth degree, path) and walk it -- but
      the per-element cost is then Theta(log X) modular-polynomial steps instead
      of the amortised Theta(1) that Algorithm 1 pays by EXTENDING stored
      entries. THIS IS A (log p)-COFACTOR, NOT AN EXPONENT, and it is stated
      rather than hidden: it multiplies the VW curve and every streaming variant
      alike, so it does not change which side of 2*alpha + mu = 3 anything falls
      on, but a concrete-cost table that omits it is wrong by that factor.
    - >-
      MULTIPLE COMPARISONS. Five predicate groups times three nulls times three
      primes times three radii is a large family; the AUC threshold must be
      corrected for it, pre-registered, and reported with the correction stated.
      Without this, a 0.55 will appear by chance.
    - >-
      SUPERVISED LEAKAGE. The learned baseline can trivially memorise C(E) if
      train and test sets overlap; the split must be by CURVE, not by sample,
      and the record must state that a memorising model is not a recogniser
      because storing the model is storing the set.
    - >-
      TOY-SCALE COINCIDENCE. At log2 p = 20 the vertex set has only a few
      hundred curves and C(E) may be most of it, making every AUC meaningless.
      A degeneracy gate requiring |C(E)| <= 0.1 * |V| is mandatory.
    - >-
      FULL-COST ASYMMETRY (KN-TECH-057). Under Wiener 3D wiring a shared table
      of S entries carries a clock-cycle penalty S^{1/3} that polynomial-memory
      algorithms do not pay. So the incumbent's true full cost is worse than its
      step count while VW's is not, which makes the memory lever MORE valuable
      than the step-count accounting above shows -- and means any candidate must
      be reported in both models, not just the step-count one.

  interpretation_limits:
    - >-
      NO EXPONENT IS CLAIMED TO MOVE, and nothing here suggests that a p^{1/4}
      algorithm over F_{p^2} exists, is likely, or is nearly obtained. The
      target is the memory exponent at unchanged time, and the record's modal
      expected outcome is a bounded negative.
    - >-
      THE CLOSURE IN (B) IS SCOPED TO REBUILD-AND-SHARD SCHEMES and to shard
      predicates computable from the codomain alone. It closes no other route,
      and its forward guidance is explicit: what remains open is (i) recognisers
      using E-dependent quaternion-side data rather than statistics of j,
      (ii) generators that can be restricted to a shard without regeneration,
      and (iii) any scheme in which the two claw sides are not both materialised.
    - >-
      TOY SCALE IS TOY SCALE. An AUC measured at 2^40 bounds nothing at 2^250;
      the deliverable is "no bias above resolution r at the tested primes", with
      r reported.
    - >-
      CONDITIONAL TIERS ARE INHERITED. The incumbent point (alpha, mu) = (1, 1)
      is conditional on Heuristic 1; the midpoint bias's magnitude is
      additionally conditional on H1 of IDEA-20260821-e99afd. The unconditional
      tier remains p^{1/2}(log p)^{O(1)} at polynomial memory, and beating only
      that tier is not an improvement.
    - >-
      A CONSTANT-FACTOR MEMORY SAVING IS NOT A MEMORY-EXPONENT IMPROVEMENT, and
      the pre-registered q-exponent test exists so that the two cannot be
      conflated later.

  heuristic_assumptions:
    - id: H1
      statement: >-
        CODOMAIN EQUIDISTRIBUTION (the assumption this record is designed to
        TEST rather than to rely on). For a uniformly random supersingular E and
        parameters (X, B) with |C(E)| <= |V|/10, the set C(E) is
        indistinguishable from a uniformly random subset of the same size of the
        supersingular vertex set, by any statistic computable from the
        j-invariants alone in time poly(log p) per element, up to the derived
        midpoint bias delta_{E'} <= delta_E.
      rigorous_support: >-
        (i) RIGOROUS SIDE: the supersingular ell-isogeny graph is Ramanujan
        (Pizer), so a non-backtracking walk of length Theta(log p) has
        total-variation distance o(1) from stationary -- the same fact the
        frozen source invokes at line 193 for its re-randomisation. C(E) is the
        set of endpoints of smooth walks of length Theta(log X), so for X large
        enough each individual endpoint is close to stationary. (ii) THE
        CLASSICAL DISTRIBUTION STATEMENT IT IMITATES: that a set of N such
        endpoints behaves like N independent uniform draws -- which is a
        pairwise-independence claim that mixing does NOT supply, and that is
        precisely the gap this record measures. The Pizer citation is RECALLED
        and unverified in this program; IDEA-20260815-1cc763 owns the spectral-
        gap question and this record defers to it rather than assuming a value.
      validation_plan: >-
        Direct, at three toy primes: enumerate C(E) exactly and run the
        pre-registered battery against the shape-matched null C(E'') (forced AUC
        0.5), the uniform null (instrument diagnostic), and the F_p positive
        control (forced AUC 1.0), at three list radii X, with the multiple-
        comparison correction fixed in advance. Report the resolution floor
        beside every negative. TRANSFER ASSUMPTIONS, RECORDED: (T1) an AUC
        measured at log2 p in [20, 40] bounds no AUC at cryptographic p and is
        reported as a toy-scale bound only; (T2) the battery covers statistics
        of j and NOT quaternion-side data, so a negative is scoped to that
        family; (T3) the shape-matched null shares the degree profile but not
        the curve, so it controls for reachable-set structure and for nothing
        else.
      falsification_condition: >-
        Any pre-registered predicate reaching corrected AUC >= 0.55 against the
        shape-matched null at three primes with a decaying-in-X advantage.
    - id: H2
      statement: >-
        MIDPOINT BIAS MAGNITUDE. Under the conjugate-degree density law
        (H1 of IDEA-20260821-e99afd), the probability that a generic curve
        satisfies delta <= delta_E equals (delta_E/(p/2)^{1/3})^{3/2}, so the
        derived midpoint constraint delta_{E'} <= delta_E confers an advantage
        of that size and no more.
      rigorous_support: >-
        The inequality delta_{E'} <= delta_E is RIGOROUS and derived in claim
        (D) by composition (psi^{(p)} o dual(eta) has degree delta_E). Only its
        MAGNITUDE as a discriminating advantage depends on the density law, and
        that law is the numbered heuristic of the companion record with its own
        validation route.
      validation_plan: >-
        Measure Pr[delta_{E'} <= delta_E] on planted claw midpoints (forced 1.00)
        and on generic list codomains (predicted about 0.46 at a typical
        instance) at three toy primes, and check the predicted dependence on
        delta_E/(p/2)^{1/3} across instances by binning instances by their
        delta_E.
      falsification_condition: >-
        A measured generic rate outside [0.35, 0.60] at typical delta_E with the
        density-law calibration passing, or any midpoint violating the
        inequality.

