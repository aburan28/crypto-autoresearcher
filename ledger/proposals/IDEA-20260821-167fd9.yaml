      No concrete-parameter conclusion is computed above the disclosed o(1).
    tradeoff_note: >-
      The entire content of this record is a tradeoff statement. The candidate
      set is the (alpha, mu) plane; the frontier is 2*alpha + mu = 3 (van
      Oorschot-Wiener); the incumbent is the endpoint (1, 1) ON that frontier;
      rebuild-and-shard schemes sit at 3 + log_N S, strictly outside;
      recogniser-based schemes sit at (1 + log_N c, log_N m) and are admissible
