idea:
  id: IDEA-20261007-d94783
  question_id: RQ-EWALK-8fa147
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Tangent doubling and the closed form agree on y^2 = x^3 + 9x + 4 over F_59
  class: control
  claim: >-
    Let E be y^2 = x^3 + 9x + 4 over F_59. If the discriminant is 0 the
    model is singular and the run is an invalid setup. Otherwise, for
    every affine point P = (x, y) with y different from 0, the
    x-coordinate of 2P from the tangent slope
    lambda = (3x^2 + 9) * (2y)^{-1} and x_3 = lambda^2 - 2x equals the
    closed form ((x^2 - 9)^2) * (4 y^2)^{-1} - 2x in F_59. The number
    of disagreements is exactly 0. One disagreement is a negative. This
    is not a census of scaling automorphisms and it does not restate a
    count of 6 against 2. No discrete logarithm is computed, and the
    generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is an affine point
    with nonzero y. Sigma is the doubling map, written two ways. The
    tangent formula and the closed form are the same rational function
    when 2y is invertible. The projection keeps the number of points
    where the two formulas disagree and discards the points. Explanation
    A: the two formulas agree everywhere they are both defined, so a
    walk that steps by doubling is using one map. Explanation B: they
    disagree at a point, so one formula is not the group law on this
    model. Agreement does not produce an automorphism larger than
    negation and does not exceed the sqrt(|Aut|) constant. No rho walk
    is run.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces rho iterations by
        sqrt(m). Doubling is not that automorphism. This idea does not
        exceed the constant.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. This idea does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-EWALK-8fa147
      provenance: internal
      claim: >-
        The question asks whether an endomorphism or automorphism
        speedup for random walks is bounded by sqrt(|Aut|) in practice,
        and whether anything exceeds it.
      verified_by: ledger/questions/RQ-EWALK-8fa147.yaml
  assumptions:
    - The prime is 59, so 2 is invertible.
    - Points with y = 0 are excluded. The doubling formulas above divide by y.
    - A singular model is an invalid setup, not the negative.
  predictions:
    - metric: number of affine points with y different from 0 at which the two doubling formulas disagree
      direction: lower
      minimum_effect: exactly 0
  minimal_test:
    design: >-
      Over F_59, compute the discriminant of y^2 = x^3 + 9x + 4. If it
      is 0, name the setup invalid and stop. Otherwise list every affine
      point with y different from 0 and evaluate both doubling formulas.
      Count disagreements. Do not run Pollard rho and do not enumerate
      scaling units.
    controls:
      - A point with y = 0 is listed and excluded, not scored as a disagreement.
      - Both formulas are evaluated in F_59, not in the integers.
      - The identity element is not an affine point and is not scored.
    required_metrics:
      - disagreement_count
      - eligible_point_count
      - discriminant
  falsification_conditions:
    - The model is nonsingular and disagreement_count is 1 or more.
  confounders:
    - Reducing the closed form in the integers before reducing modulo 59 can invent a disagreement. Both formulas are field operations.
    - Including a point with y = 0 makes the inverse undefined. Those points are excluded.
  interpretation_limits:
    - Agreement of the two formulas does not exceed sqrt(|Aut|) and does not change the exponent 1/2.
    - No discrete logarithm is computed.
    - The test is this one model at p = 59 only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Over a field of characteristic not 2, substituting
        lambda = (3x^2 + A) / (2y) into lambda^2 - 2x and clearing the
        denominator yields ((x^2 - A)^2) / (4 y^2) - 2x whenever
        y^2 = x^3 + A x + B. At A = 9 and p = 59 the two expressions
        therefore agree at every affine point with y different from 0.
      rigorous_support: >-
        The equality is polynomial arithmetic in the slope. KR-RHO-0528e7,
        opened, prices automorphism discounts and does not state this
        identity. No computer-algebra page was opened for the expansion
        in this session.
      validation_plan: >-
        At this single model, record the disagreement count. If it is
        not 0 while the discriminant is nonzero, H1 is false at p = 59.
        No second prime is claimed.
  target_complexity:
    time_exponent: >-
      One pass over the affine points of one curve at p = 59. The
      generic-group exponent 1/2 is unchanged.
    memory_exponent: O(1) field elements beyond the point list
    best_known: >-
      KR-RHO-13bf67, opened, gives the square-root generic bound.
      KR-RHO-0528e7, opened, prices sqrt(|Aut|). Formula agreement
      beats neither.
    hidden_overhead: >-
      No o(1) term. The test is one model at p = 59.
    tradeoff_note: >-
      No time-memory tradeoff. The scan is exhaustive in the affine points.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row bounds an automorphism speedup by sqrt(m).
          This idea adds a disagreement count, predicted 0, between two
          writings of doubling at p = 59, and does not change the
          exponent.
  dominated_by: >-
    The automorphism discount in KR-RHO-0528e7 dominates any reading of
    formula agreement as a faster walk. Pollard rho, at the square-root
    exponent in KR-RHO-13bf67, dominates the same reading. The
    disagreement count does not beat either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the integer
    disagreement_count, predicted 0, at the prime 59. The generic-group
    exponent stays 1/2.
