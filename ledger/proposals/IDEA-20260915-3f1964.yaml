idea:
  id: IDEA-20260915-3f1964
  title: >-
    Exhaustive side-classified decomposition table as the PDP row's ground truth:
    every F_q-rational root of the descended S_4 system is an all-E or an all-twist
    decomposition (mixed roots need a 2-torsion sub-sum), so one enumeration of
    V^3 per cell certifies UNSAT, classifies every solver answer, counts every
    solution, and replaces the generator's "random x_R" label
  class: measurement
  research_question_id: RQ-ICPERF-94c86e
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids: [GOAL-ICPERF-e6b6a4]
  status: proposed
  proposed_by: idea-generator
  task_id: TASK-20260915-5ba08b
  recorded_at: '2026-09-15'
  claim: >-
    Let E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, b != 0, and let x_1, x_2, x_3,
    x_R in F_q with no x_i or x_R equal to 0 (the 2-torsion x-coordinate). Then
    S_4(x_1, x_2, x_3, x_R) = 0 iff there are points P_i, R in E(F_{q^2}) with these
    x-coordinates and P_1 + P_2 + P_3 = +-R; every such point lies in E(F_q) (side 0,
    Tr(x + a + b/x^2) = 0) or in ker(sigma + 1) \ E(F_q) (side 1, the quadratic-twist
    image, Tr(x + a + b/x^2) = 1), where sigma is the q-power Frobenius. Applying
    sigma to the relation and subtracting gives 2 * (sum of side-1 points among
    {P_1, P_2, P_3, -+R}) = O; hence EITHER all four points have side 0 (an
    E-decomposition, x_R on E), OR all four have side 1 (a twist decomposition, x_R a
    twist x-coordinate), OR the side-1 points among them form a sub-sum in E[2] --
    a coincidence of measure about 2^{l-n} per triple that the enumeration counts
    exactly. Consequence for the instrument: (i) the side of x_R alone predicts the
    class of every solver answer; (ii) the complete relation set of a cell is the
    enumeration of all unordered triples of factor-base points on E (and separately
    on the twist E'), about C(|Fb|+2, 3) point additions, which is 1771 / 45760 /
    45760 at the shipped cells (15,5) / (17,6) / (19,6) -- milliseconds; (iii) a
    target absent from that table is CERTIFIED unsatisfiable by independent
    arithmetic, replacing the upstream generator's uncertified "U = random x_R"
    label (find_points.sage lines 61-67, read this session); (iv) run in
    all-solutions mode, a complete solver must return exactly the table's count
    times the m! = 6 orderings (fewer when x-values repeat), which is a
    completeness test of encoding plus solver that no first-solution run provides.
    Applied to RUN-ICPERF-305ca3 (unreviewed observations) the instrument would have
    reported the five n19l6-19-U answers as "twist decomposition of a twist-side
    target", not as a P1 failure, and would have reported for each of the 30
    shipped U targets its exact decomposition count -- which, under the
    "unfiltered random x_R" reading of the generator, this record's proposal-time
    enumeration predicts to be nonzero for 5.6 +- 2.2 of the 30 (see mechanism),
    against 1 observed SAT by every complete solver (unreviewed observation).
  mechanism: >-
    THE TRACKED OBJECT is the side bit s(x) = Tr(x + a + b/x^2) in {0, 1}, defined on
    F_q^*; s(x) = 0 iff x is the x-coordinate of a point of E(F_q). It is a
    genuinely lossy projection of the point (one bit of n) and it propagates
    deterministically under the only operation the PDP uses -- summation of the
    four points to O -- because side-1 points are exactly the F_{q^2}-points with
    sigma(P) = -P (from y^q = y + x when y is in F_{q^2} \ F_q, since -(x, y) =
    (x, x + y) on this model), so sigma acts as +1 on side-0 and -1 on side-1
    summands and the relation P_1 + P_2 + P_3 -+ R = O forces 2 * (side-1 sub-sum) =
    O. Away from E[2] = {O, (0, sqrt b)} that forces the side to be constant across
    the relation. This is the twist reading the Coordinator recorded as a PRIOR
    UNDER REVIEW in coordination/review/icperf-20260913-66fd51/review-plan.yaml
    (on_V1_the_P1_failure); this record upgrades it from a reading of one instance
    to a theorem about every root, states the 2-torsion exception, and turns it
    into a table.

    YIELD BOOKKEEPING THE TABLE MAKES EXACT. Let Fb_E = {P in E(F_q) : x_P in V},
    T_E = C(|Fb_E| + 2, 3) unordered triples with repetition. Triples come in
    negation pairs hitting one x-value each, so the expected number of
    decompositions of a side-0 x_R is lambda_E = T_E / #E(F_q), Poisson-shaped
    under the usual random-sum heuristic (eq. (11) of Semaev 2015/310 gives the
    idealised 2^{3l-n}/3! when |Fb_E| = 2^l), and P(decomposable) = 1 - e^{-lambda_E}.
    Identically on the twist with Fb_E' and #E'(F_q) = 2q + 2 - #E(F_q). PROPOSAL-TIME
    ALGEBRAIC CHECK BY THIS RECORD'S AUTHOR (independent GF(2^n) code written from
    the INFO-file moduli, /tmp only, not evidence about the research question):
    on the generator's curve a = b = 1 with V = {deg x < l}, |Fb_E| = 21 / 63 / 63
    and |Fb_E'| = 43 / 65 / 65 at (15,5) / (17,6) / (19,6); side-0 x-coordinates
    16247 / 65587 / 262543; decomposable side-0 fraction 0.0445 / 0.2751 / 0.0765
    (eq. (11) idealisation 0.154 / 0.284 / 0.080); decomposable side-1 fraction
    0.3327 / 0.2992 / 0.0833; so a uniformly random x_R in F_q is decomposable
    (either side) with probability 0.190 / 0.287 / 0.080, and 10 random targets per
    cell give 5.6 expected SAT among the 30 shipped U instances with P(at most 1) of
    about 0.015. The (15,5) cell is notable: only 10 of the 31 nonzero x in V lie on
    E (Binomial(31, 1/2) puts this about 2 sigma low), which quarters the E-side
    yield at that cell relative to eq. (11) and is exactly the kind of per-cell
    quantity the boundary table must carry rather than idealise. The review plan's
    rate 2^{3l-3}/(6 * 2^{n-1}) omits the four sign patterns of P_1 +- P_2 +- P_3 and
    is 4x below eq. (11); recorded here as a note on a prior under review, not as a
    finding.

    WHY THE TABLE IS THE RIGHT INSTRUMENT AND NOT AN ATTACK. At l <= 8 the table
    costs at most C(2^8 + 2, 3) ~ 2.8e6 additions per side per cell. It is exactly
    the "exhaustive / hybrid search as a floor" engine the research question lists
    under methods, and it is the point sampler objective (2) of GOAL-ICPERF-e6b6a4
    names as missing (S instances: pick a triple and read x_R; certified-U
    instances: pick x_R outside the table; the upstream Weil_descent C program then
    emits the ANF/CNF from (n, l, modulus, x_R) without Sage -- script_benchmarks.sh
    read this session). It says nothing about l where 2^{3l} is infeasible and
    claims no speedup.
  novelty_status: adaptation
  novelty_screen:
    what_is_not_new: >-
      That the Weil-descended S_{m+1} system has roots over the closure not
      corresponding to F_q-points is folklore; Galbraith-Gebregiyorgis ePrint
      2014/806 Section 4 (retrieved this session, passage on sys1) say explicitly
      that each candidate root must be checked for whether "each value t_j
      corresponds to an elliptic curve point". Exhaustive V^m enumeration as a
      yield ground truth is how RUN-SEMBIN-1b9afe (EXP-SEMBIN-354a75) already
      measures decomposition counts, and IDEA-20260913-191ed2 names "exhaustive
      enumeration over V^t" as its satisfiability oracle. The point-halving
      trace criterion is textbook (IDEA-20260913-cedd2f's retrieved sources).
    what_is_new: >-
      The dichotomy theorem (all-E or all-twist up to a 2-torsion sub-sum) as a
      classifier of SOLVER ANSWERS; using the table to certify the upstream
      benchmark's U labels and to test solver completeness in all-solutions mode;
      the per-cell |Fb_E| / |Fb_E'| split and the 4x correction to the review
      plan's rate; the observation that the table's total cost is a floor engine
      the boundary row must carry. No web hit for the classification (search
      terms in the report); absence of a hit is not evidence of absence.
    searched: >-
      rg over knowledge/ for twist, Frobenius, Koblitz, first fall degree, Gaudry,
      Diem, BRiAl, PolyBoRi (twist hits are all number-theory titles in
      sources.json, none on PDP roots); ledger/proposals IDEA-20260913-* and
      IDEA-20260914-* titles; WebSearch (summation polynomial, quadratic twist,
      Weil descent, factor base). The kb MCP index is not populated in this
      worktree; retrieval absence is not offered as evidence.
