  assumptions:
    - The shipped moduli (INFO files, little-endian coefficient strings) define the field in which x_R and the certificates are read; a modulus mismatch would make every side bit wrong (confounder below).
    - Factor-base points are sampled with repetition, as find_points.sage does, so triples are counted with repetition; a design that forbids repeats changes T_E by O(|Fb|^2) and must say so.
    - The Poisson shape of per-target counts is the comparison model only; the table reports exact counts and needs no shape assumption.
  proof_search_map:
    bottleneck: >-
      Certifying UNSAT and classifying roots without a Groebner engine; the
      enumeration replaces both at l <= 8.
    baseline_embedding:
      parameter_slice: >-
        The 60 shipped instances - the table must reproduce all 30 S certificates
        as members (x_R in table with the shipped triple among its preimages) and
        must agree with every complete solver's verdict on the 30 U instances.
      reproduction_check: >-
        30/30 S certificates found in the table; any disagreement between the table
        and a complete solver's UNSAT is a defect in one of the two named
        implementations, localised by evaluating the ANF at the table's triple.
    observation_collision:
      observable: the side bit s(x_R) and the table's count for x_R.
      distinct_preimage_search: >-
        Known-false objects - x_R replaced by x(R + T) with T the 2-torsion point
        (same side, generically different count), and x_R read under the other
        bit-order convention (a different field element; the table must not find
        it at the same count except by chance about 8%).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The relation set of a cell as a finite dictionary x_R -> multiset of
          triples, computed once, against which every solver answer is an exact
          membership test.
        predicted_gain: >-
          Certified U labels, exact per-target counts, a completeness test for the
          encoding, and the twist fraction, at negligible cost; no speedup claimed.
    quantifier_order: >-
      For every cell (n, l) with 2^{3l} enumerable and for every x_R in F_q^*, the
      count is exact and the class of every root is determined by s(x_R) up to the
      2-torsion sub-sum exception, which the table lists explicitly.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact relation yield and certified satisfiability for every target at every
        cell with l <= 8 on this host; nothing at any l where 2^{3l} point additions
        are infeasible.
      nearby_object_control: >-
        A random Boolean system of the same shape (the run's null objects) has no
        curve and no table; the theorem predicts nothing for it, and the SAT
        answers observed on four null objects (unreviewed) are correctly outside
        the instrument's scope.
    proof_obligations:
      - claim: sigma acts as -1 on side-1 points and +1 on side-0 points
        responsibility: correctness
      - claim: 2 * (side-1 sub-sum) = O forces constant side away from E[2]
        responsibility: correctness
      - claim: enumeration cost C(|Fb|+2, 3) additions per side per cell
        responsibility: runtime
      - claim: a target absent from the table has no F_q-rational root of the descended system
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: number of the 30 shipped S targets whose shipped triple is a preimage in the table
      direction: different
      minimum_effect: exactly 30
    - metric: fraction of the 30 shipped U targets with nonzero table count
      direction: different
      minimum_effect: >-
        under the unfiltered-random reading of find_points.sage the expected count
        is 5.6 (per-cell 1.9 / 2.9 / 0.8) with P(count <= 1) about 0.015; a count
        equal to the solvers' SAT count (1, unreviewed) is consistent with
        solver completeness AND with upstream screening not stated in the README,
        and is recorded as an unexpected observation about the benchmark's
        provenance, not about any curve.
    - metric: class of every SAT answer versus s(x_R)
      direction: different
      minimum_effect: >-
        100% agreement - all 200 verified answers (unreviewed) on side-0 targets,
        the five n19l6-19-U answers on a side-1 target; zero mixed roots on the 60
        instances (expected mixed count about 2^{l-n} per triple, under 1e-3 total).
    - metric: WDSat __FIND_ALL_SOLUTIONS__ count versus 6 x table count (corrected for repeated x-values)
      direction: different
      minimum_effect: exact equality on every S instance; any deficit is an incompleteness of solver or encoding
    - metric: WDSat median conflicts on side-1 (twist) U targets versus side-0 U targets at fixed cell
      direction: different
      minimum_effect: >-
        no prediction of direction; a ratio outside [0.5, 2] would mean the
        shipped U mix (about half twist-side) does not represent relation-search
        UNSAT instances, whose targets are all side-0 subgroup points.
  minimal_test:
    design: >-
      Write the enumerator (GF(2^n) from the INFO modulus, curve addition, side bit,
      twist curve a' with Tr(a') = Tr(a) + 1); for each shipped cell build the
      side-0 and side-1 tables; look up all 60 shipped x_R and all 205 recorded SAT
      x-sets from results.jsonl; then generate 20 certified-U and 20 S instances
      per cell through the vendored Weil_descent program and run WDSat default and
      all-solutions builds on them. Report exact counts, classes, completeness
      ratios, and side-stratified UNSAT conflicts.
    controls:
      - KNOWN-FALSE - every shipped certificate with one bit of x_1 flipped must be absent as a preimage (30/30).
      - KNOWN-FALSE - each x_R read under the opposite bit-order convention must fail the S-certificate membership (30/30 on the S set).
      - NULL - the table built for a random curve b' != 1 on the same field must not contain the shipped S certificates (predicted 0/30 hits).
      - RECONSTRUCTION - table count summed over side-0 targets must equal T_E (every triple hits exactly one x_R); the same on side 1.
      - INDEPENDENCE - the enumerator is written without reading binec.py, convert.py, semaev.c or Weil_descent.sage (the run's certificate checker is the blind comparator, not the reference).
    required_metrics:
      - per cell and side - |Fb|, #x-coordinates, table size, T, lambda, decomposable fraction
      - per shipped instance - side of x_R, exact count, agreement with each engine's verdict
      - per SAT answer - class in {E, twist, mixed_2T, non_root}
      - all-solutions count / (6 x table count) per S instance
      - UNSAT WDSat conflicts stratified by side of x_R
  falsification_conditions:
    - A shipped S certificate absent from the table, or a solver-verified E-decomposition whose x_R is side 1 - the theorem or the field reading is wrong; the record is withdrawn until the arithmetic is localised.
    - A mixed-side root whose side-1 sub-sum is not in E[2] - the dichotomy is false as stated.
    - A complete solver returning UNSAT on a target the table lists - the table or the encoding is wrong, and the boundary row's certificates are void until resolved.
    - An all-solutions count below 6 x table count on any S instance (after the repeated-x correction) - the encoding loses roots and every S timing in the table is on a different problem than stated.
  confounders:
    - Bit-order convention between the generator's coefficients(sparse=False) strings, the INFO file, the WDSat assignment bit-string and the table's integers; controlled by the known-false convention flip.
    - The x = 0 factor-base point (0, sqrt b) is on both sides (2-torsion); it is in V and is sampled by find_points.sage; the table must include it and the classifier must treat it separately.
    - Repetition of points in a triple and permutations inflate the all-solutions count by less than 6 for triples with equal x-values; the correction is exact and must be applied.
    - The twist a' is not unique; any a' with Tr(a') != Tr(a) gives an isomorphic E'(F_q) and the same side-1 x-set; the count is invariant but the point set differs.
  interpretation_limits:
    - An instrument at l <= 8. It claims no speedup, no exponent, nothing about any l where V^3 is not enumerable, and nothing about any curve's security.
    - Agreement with the solvers on the 30 U targets confirms completeness of the tested engines on those instances only; a count of 1 decomposable in 30 is a statement about the shipped benchmark's provenance, to be raised with the source, not a finding about Semaev's method.
    - The Poisson comparison is a model; the table's counts are the data and are reported as such.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random target on side s, the number of decompositions over
        Fb_s is Poisson with mean lambda_s = C(|Fb_s| + 2, 3) / #E_s(F_q), where
        E_0 = E and E_1 = E'.
      rigorous_support: >-
        The mean is exact by double counting (each negation pair of triples hits
        exactly one x-value). The Poisson shape imitates the classical
        occupancy/Poisson limit for T balls in M bins with T/M = O(1) (Semaev
        2015/310 eq. (11) uses the same idealisation with |Fb| = 2^l).
      validation_plan: >-
        The table gives the exact per-target count distribution at all three shipped
        cells and at l = 7, 8 (n up to 25); compare empirical count histograms with
        Poisson(lambda_s) by chi-square, per side, per cell; tail check - the
        maximum observed count versus the Poisson upper quantile at M targets;
        report the (15,5) side-0 cell separately because |Fb_E| = 21 is small.
        Transfer to cryptographic l is by the double-counting identity for the
        mean only; the shape is not extrapolated.
  target_complexity:
    time_exponent: not_applicable - instrument
    memory_exponent: not_applicable - instrument
    best_known: >-
      For the underlying PDP the relevant frontier rows are WDSat at about 2^{ml}
      conflicts per instance (unreviewed observation, see IDEA-20260915-0d8e90) and
      parallel rho at 0.886 * 2^{n/2} group operations; the table costs
      C(|Fb|+2, 3) ~ 2^{3l}/6 additions ONCE per cell and answers every target in
      O(1), so at l <= 8 it dominates any per-target solver as a relation collector
      by the number of targets - which is precisely why it is the floor row of the
      table and not a result.
    hidden_overhead: >-
      Memory 2^{3l}/6 entries per side (about 2.8e6 at l = 8); nothing hidden at the
      executable range; infeasible beyond it by construction.
    tradeoff_note: >-
      What the instrument changes - the PDP column gains certified U labels, exact
      yield per target, a completeness ratio, and a side-stratified UNSAT cost;
      the relation-yield column gains its first measured cell values instead of
      eq. (11) idealisations.
  dominated_by: >-
    n/a (no algorithmic result claimed). Frontier rows read for the floor
    statement - vOW/Pollard rho with negation at 0.886 * 2^{n/2} (KN-LIT-73f7e1,
    KN-TECH-018); exhaustive V^3 enumeration at 2^{3l}/6 additions per cell;
    WDSat at about 2^{3l} conflicts per target (unreviewed). The table is the
    second row and occupies no new point.
  sota_delta: >-
    instrument - none claimed. Quantitatively it replaces an uncertified label with
    a certificate on 100% of U instances at l <= 8, adds a classifier that is exact
    by theorem, and fixes a 4x error in a rate estimate under review.
  estimated_cost:
    implementation: low
    compute: low
    wall_clock_seconds: 3600
    memory_gb: 1
    note: >-
      Advisory. The proposal-time enumerator ran all six (cell, side) tables in
      130 s of pure Python on this host; a run with certified-U generation and
      all-solutions WDSat builds adds the Weil_descent compile and 120 solver
      invocations of seconds each.
  recommended_priority: high
  inference:
    policy: research-deep
    reasoning_effort: null
