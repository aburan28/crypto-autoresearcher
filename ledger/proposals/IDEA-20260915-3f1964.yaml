        Tr(a') = Tr(a) + 1 (its confounders list).
      verified_by: idea-generator TASK-20260913-335d65 (retrieved); re-read by TASK-20260915-5ba08b
    - ref: 'ePrint 2014/806, Galbraith-Gebregiyorgis, Summation polynomial algorithms for elliptic curves in characteristic two, Section 4 (sys1 passage)'
      provenance: retrieved
      claim: >-
        Candidate roots of the descended system must be checked for correspondence
        to curve points; the authors' overall conclusion is that Pollard rho remains
