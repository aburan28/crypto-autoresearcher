idea:
  id: IDEA-20260809-7ca867
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    Measure the grinding curve for a reference low-degree-test protocol against
    the bit level its parameters are chosen to deliver
  class: measurement
  claim: >-
    Parameters for proximity-test-based arguments are chosen from a formula giving
    a target soundness level, and the attack the formula defends against —
    grinding on the Fiat-Shamir challenges by re-randomizing prover messages — is
    rarely implemented. The claim is that implementing it gives a measured cost
    curve in the round count, challenge entropy and repetition parameter, and that
    the curve's implied bit level differs measurably from the formula's at some
    parameter settings.
  mechanism: >-
    Implement the protocol and a grinding prover that re-samples its messages to
    obtain favourable challenges; measure the expected number of attempts to
    produce an accepted proof of a false statement at each parameter setting;
    convert to bits.
  why_not_a_renamed_known_approach: >-
    Grinding is a known attack and proof systems include grinding-resistance
    parameters. Measuring the curve on a reference implementation and comparing it
    against the parameter formula, rather than trusting the formula, is the
    contribution and follows this program's practice of running the attack the
    parameters defend against.
  predictions:
  - observable: measured attempts to forge versus parameter setting
    metric: log2 attempts, per setting
    predicted: >-
      Tracks the formula at large parameters and deviates at small ones, where
      lower-order terms matter. A deviation at realistic settings would be the
      significant result.
  - observable: whether the deviation is conservative or optimistic
    metric: sign of the difference
    predicted: >-
      Unknown in advance, and this is why it is measured. An optimistic formula --
      one predicting more attacker work than measured -- requires careful
      re-verification before anything is recorded.
  minimal_test: >-
    A grid over round count and repetition parameter at reduced security levels
    where forgery is actually reachable, with declared seeds, measuring attempts
    to success and extrapolating the curve.
  controls:
  - 'TRUE-STATEMENT CONTROL: honest proofs must verify at every setting.'
  - 'REACHABILITY CONTROL: the grid is chosen so forgery is reachable, and the extrapolation to realistic parameters is stated as an extrapolation with its interval, never as a measurement.'
  falsification_conditions:
  - Measured attempts match the formula everywhere in the reachable grid.
  - No forgery is reachable anywhere in the grid within budget, in which case the curve is unavailable and the record reports the boundary.
  interpretation_limits: >-
    Measured at reduced parameters on a reference implementation and extrapolated.
    Nothing here is a statement about any deployed proof system, and none is
    examined.
  sota_delta: 'No attack on any system. Delta: a measured curve against a parameter formula that is normally applied without being tested.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate to high.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for grinding / proximity test: no records. WEB NOT CHECKED.'
  source_refs:
  - Low-degree test and grinding-resistance references -- RECALLED, REQUIRED READS.
