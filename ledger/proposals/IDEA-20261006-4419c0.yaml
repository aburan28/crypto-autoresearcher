idea:
  id: IDEA-20261006-4419c0
  title: >-
    The embedding degree of the large prime factor of y^2 = x^3 + 1 is
    at least 8 on the first eligible prime
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + 1. Let p be the smallest prime with
    23 ≤ p ≤ 90 and p ≡ 2 (mod 3) such that E over F_p is nonsingular,
    the integer t = #E(F_p)-(p+1) is not 0, and n, the largest prime
    factor of #E, satisfies n ≥ 11 and n ≠ p. Let k be the
    multiplicative order of p modulo n, the least integer k ≥ 1 with
    p^k ≡ 1 (mod n). The claim is k ≥ 8. A finished order with
    1 ≤ k ≤ 7 is the concrete negative. No prime in the interval
    meeting the filters is also a negative. The computation is the
    order of the field prime p modulo n. It does not evaluate a
    pairing, does not run a Frey–Rück or MOV reduction, and does not
    test whether the Frobenius trace satisfies π ≡ 1 (mod n). The
    exponent stays 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R7: the integer k, read as the
    multiplicative order of p modulo n. The curve is the j=0 model
    y^2 = x^3 + 1, restricted to primes p ≡ 2 (mod 3) so that a cube
    root of unity need not lie in F_p. Operation set Sigma is
    exponentiation of p in (Z/nZ)*, not a Miller loop. Trichotomy:
    coordinate-independent once n is known, because k is a property of
    the two integers p and n. LOSSY-PROJECTION TEST against the
    point-count map. Passing from the group order to its largest prime
    factor discards the cofactor, and passing from that prime to the
    order of p discards every other residue class. The image is one
    positive integer. The priced number is that integer on one prime.
    Off-limits families F1–F7 are not the lens. No pairing value is
    computed. A small k is the classical setting in which a transfer
    exists; this idea stops at the order and does not transfer the
    discrete logarithm.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: coordinator
  approved_by: null
  question_id: RQ-PAIR-21313f
  citations:
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        MOV/Frey–Rück reduce ECDLP to a finite-field discrete log when
        the embedding degree is small. This idea measures that degree
        as the order of p modulo n and does not run the reduction.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
        on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains Omega(√n). An embedding degree of
        8 or more on one toy subgroup does not change the prime-field
        exponent 1/2, and a smaller k is not scored here as an attack.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share their point count. This idea uses one
        curve and does not walk an isogeny class to change n.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
    - ref: embedding degree as the order of p modulo n
      provenance: recalled
      claim: >-
        Pointer only. The test defines k as the least positive integer
        with p^k ≡ 1 (mod n) and does not rely on an unread theorem
        for the value on this curve.
      verified_by: null
  assumptions:
    - >-
      n does not divide p, which is the filter n ≠ p, so p is a unit
      modulo n and the order exists and divides n-1.
    - >-
      #E includes the point at infinity. t = #E-(p+1). Ordinary means
      t ≠ 0.
    - >-
      The order is computed by testing k = 1, 2, ... until p^k ≡ 1
      (mod n), with multiplication modulo n. No floating point.
  proof_search_map:
    bottleneck: >-
      Whether the order of p modulo n is at least 8 on the first
      eligible prime, or is one of 1 through 7.
    baseline_embedding:
      parameter_slice: >-
        The transfer statement in KR-RHO-53c89f. This control does not
        reduce a discrete logarithm.
      reproduction_check: >-
        For the finished k, p^k ≡ 1 (mod n) and p^d ≢ 1 (mod n) for
        every proper divisor d of k.
    observation_collision:
      observable: the integer k
      distinct_preimage_search: >-
        A second computation of the order that returns a different k
        is an instrument collision. One finished k is the observation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The order of p in (Z/nZ)*, as the embedding degree of the
          subgroup of order n.
        predicted_gain: >-
          k at least 8, or a finished k of at most 7.
    quantifier_order: >-
      There exists a smallest prime p in 23..90 with p ≡ 2 (mod 3)
      meeting the filters, and for that p the order of p modulo n is
      at least 8.
    method_ceiling:
      strongest_certifiable_claim: >-
        One order on one curve at one prime at most 90. Not a transfer
        attack and not a statement past that prime.
      nearby_object_control: >-
        The same computation with the prime replaced by a primitive
        root modulo n, if one is found by a search from 2 upward. That
        order is n-1 or a large divisor, and it is a null for the
        arithmetic of the order routine. It is not a second embedding
        degree of E. If the routine cannot return the order of p, it
        also cannot be trusted on that null, and k is not scored.
    proof_obligations:
      - claim: k is the least positive integer with p^k ≡ 1 (mod n), checked on the divisors of k.
        responsibility: correctness
      - claim: Measuring k does not execute MOV or Frey–Rück.
        responsibility: scope
    not_applicable_reason: >-
      This is an order computation, not a theorem, bound, certificate,
      reduction, or closure.
  predictions:
    - metric: multiplicative order of p modulo n
      direction: higher
      minimum_effect: at least 8
  minimal_test:
    design: >-
      Scan primes from 23 through 90 with p ≡ 2 (mod 3). Keep the
      first prime where y^2 = x^3 + 1 is nonsingular and ordinary, n
      is the largest prime factor of the point count, n ≥ 11, and
      n ≠ p. Compute the order of p modulo n by successive
      multiplication. Do not score a later prime. Do not evaluate a
      pairing.
    controls:
      - >-
        Check p^k ≡ 1 (mod n) and that no proper divisor of k works.
        A failed check is an instrument row, not a k of 7 or less.
      - >-
        If n divides p, the prime is ineligible. The order is not
        reported as 0.
      - >-
        A trace of 0 drops the prime. Supersingularity is not an
        embedding degree.
    required_metrics:
      - selected prime, or none
      - n
      - k
      - whether p^k ≡ 1 (mod n)
  falsification_conditions:
    - The first eligible prime has 1 ≤ k ≤ 7.
    - No prime in 23..90 with p ≡ 2 (mod 3) meets the filters.
    - >-
      p^k ≡ 1 (mod n) fails for the reported k. The order was not
      computed, and the claim is not scored.
  confounders:
    - >-
      Using a cofactor in place of n changes the modulus. n is the
      largest prime factor of #E, not #E itself.
    - >-
      Testing π ≡ 1 (mod n) for a Frobenius eigenvalue is a different
      congruence. This claim uses the field prime p as the base.
    - >-
      p ≡ 1 (mod 3) would make the cube roots of unity rational and is
      a different family. Those primes are outside the scan.
  interpretation_limits:
    - >-
      k ≥ 8 on one toy subgroup is not a security proof. k ≤ 7 is the
      classical small-embedding-degree regime and is still not an
      executed MOV reduction in this idea.
    - One curve and one prime at most 90. No transfer to BLS12-381 or BN254.
    - >-
      Not a Frey–Rück pairing evaluation, and not the condition
      π ≡ 1 (mod n).
    - >-
      Not the doubling-slope character gap, and not a rho walk.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For an ordinary curve that is not constructed to be
        pairing-friendly, the order of p modulo the large prime factor
        n is not concentrated on {1, ..., 7}. This is a flag on one
        prime. The claim is the integer k, not a density.
      rigorous_support: >-
        KR-RHO-53c89f, opened in this session, states that generic
        curves have large embedding degree and that MOV/Frey–Rück
        apply only in the small-degree case. It does not give the
        distribution of k for y^2 = x^3 + 1 at the first prime in this
        interval. The integer k is computed directly, so the claim does
        not need the density.
      validation_plan: >-
        Compute k on the one eligible prime. Tail check: if k ≤ 7,
        record that finished order as the negative and do not replace
        it by a statement that generic curves have large k. If no
        prime is eligible, H1 is not evaluated.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: unchanged O(1); the order uses O(log n) multiplications modulo n
    best_known: >-
      prime-field rho at exponent 1/2 (KR-RHO-13bf67); a transfer
      exists only when the embedding degree is small and is not run
      here (KR-RHO-53c89f)
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No time-memory tradeoff. One order is computed at one prime.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    No opened row dominates the order computation. Rows opened and not
    dominating that integer: KR-RHO-53c89f (MOV/Frey–Rück apply when
    the degree is small; this idea does not run them), KR-RHO-13bf67
    (exponent 1/2), KR-RHO-755e35 (isogeny does not change the point
    count; this idea does not walk). KR-RHO-53c89f dominates any
    reading that would treat a computed k ≤ 7 as a completed transfer
    attack. KR-RHO-13bf67 dominates any reading that would treat
    k ≥ 8 as a change to exponent 1/2.
  sota_delta: >-
    Zero change to exponent 1/2. The new quantity is the multiplicative
    order k of p modulo n for y^2 = x^3 + 1 at the first eligible
    prime at most 90. The claimed order is at least 8. A finished
    order of at most 7 is the negative. No pairing is evaluated.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: adjacent
        delta: >-
          That row states that MOV/Frey–Rück reduce ECDLP when the
          embedding degree is small, and that generic curves have
          large embedding degree. This idea computes the order of p
          modulo n on one j=0 model and does not reduce a logarithm.
          The claimed threshold is k ≥ 8. A finished k ≤ 7 falsifies
          the claim without becoming an executed transfer.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The generic-group bound is Omega(√n) group operations. This
          measurement does not count group operations of a walk. The
          time exponent stays 1/2 whether k is at least 8 or at most 7.
    searched:
      corpus_grep:
        - >-
          origin/main ledger/proposals and PRs 1943 and 1940 for
          Frey-Rück executions, π ≡ 1 (mod n), and doubling-slope
          character gaps
      web: []
      blocked:
        - web search not run; novelty_status stays unverified
