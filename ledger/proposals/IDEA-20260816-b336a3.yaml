    results: 'The 15 ''mutual information'' matches are spread across IDEA-20260808-750ead, IDEA-20260807-cb672c,
      IDEA-20260811-b2806a, IDEA-20260805-6fedc7, IDEA-20260807-6c7540, IDEA-20260806-7c1ae4, IDEA-20260809-b17238,
      IDEA-20260805-c4ae3d, IDEA-20260805-630606, IDEA-20260726-011, IDEA-20260814-92f825, IDEA-20260813-d984ac,
      IDEA-20260809-9fc179, IDEA-20260811-10eacc and IDEA-20260807-413fcc - none under RQ-HQC-001.
      The seven ''failure boosting'' matches include IDEA-20260808-4854f8 (ML-KEM: the DFR is consumed
      in two places with opposite required directions) and IDEA-20260806-7c1ae4 (ML-KEM: four predicates
      a deployed failure oracle needs at once), both under RQ-MLKEM-001 and both about the REACHABILITY
      of a failure oracle rather than the information content of a failure. The HQC records - IDEA-20260805-15258a,
      IDEA-20260808-d21021, IDEA-20260808-cbb848, IDEA-20260808-9f9ed8, IDEA-20260808-5d8b39 - concern
      per-key DFR dispersion, steerable covariance, signing A17, a two-sided bracket and factorising
      the trial barrier. `grep -ril "reaction attack"` returns one file, not under RQ-HQC-001. No
      record counts bits per observed failure for any scheme.'
    verdict: 'UNVERIFIED. Nothing here asserts what the literature contains; this environment cannot
      read it. Claimed NEW relative to this repository: taking the failure PATTERN rather than the
      failure EVENT as the observable and reporting a bias-corrected bit count per observed failure,
      with a permutation null and a structural key-independent null both executed in the same invocation.
      ASSEMBLED FROM KNOWN PARTS: the block-failure vector F and its generating pipeline are H-HQC-18d1b4''s;
      Miller-Madow correction and permutation nulls are standard estimator hygiene rather than inventions;
      the observation that DFR dispersion across keys is the source of any such information is IDEA-20260805-15258a''s
      framing, and this proposal is downstream of it.'
  object_first_candidate:
    tracked_object: The conditional posterior over a declared low-dimensional key functional G(x,
      y) given the observed block-failure pattern F, followed from the sampling of the key, through
      the ring product, truncation and inner decoding, to the observation. What is tracked is the
      DIVERGENCE of that posterior from the prior, measured in bits.
    lossiness: 'LOSSY TWICE OVER, deliberately. First, the key (x, y) - roughly 2 * log2 C(n, w) bits
      - is projected onto G, a coarsened per-block secret-weight profile over a small alphabet, discarding
      position information entirely. Second, the state e-tilde is projected onto F, discarding within-block
      detail exactly as in the joint-moment work. Both discards are compatible with the readout: mutual
      information is monotone under both projections, so the measured value is a LOWER bound on I(key
      ; F) and an UPPER bound on nothing - which is the honest direction and is stated as such. A
      larger G would raise the estimate and worsen the bias; the alphabet size is therefore a declared
      tradeoff parameter, not a free choice made after seeing data.'
    propagation: 'One step of the target operation - one inner-block decode - writes one coordinate
      of F, and each such write is the only channel through which G can influence the observation.
      The propagation law of interest is therefore the conditional law P[F_j = 1 | G], and the measurement
      decomposes the total mutual information into the sum of per-block terms plus a residual capturing
      dependence between blocks. That decomposition is itself a reported quantity: if the total is
      close to the sum of the per-block terms, the pattern carries little more than the count S, and
      the whole reason for tracking the pattern rather than the scalar disappears - a clean, cheap
      internal falsifier.'
    survival_score: One step. The information about G survives exactly the inner-decode step and then,
      at the outer stage, collapses to whatever survives in the single bit 'decryption failed'. The
      proposal measures the ratio I(G ; F) / I(G ; 1{S > delta}) at the executed parameters, which
      is a concrete number expressing how much is lost by observing only the final failure bit. A
      ratio near 1 means the pattern adds nothing and the object dissolves immediately; a ratio well
      above 1 means it survives the step meaningfully. Either value is the deliverable.
  null_object_control: 'TWO nulls, both executed in the same invocation as the signal arm and both
    on the identical estimator code path. NULL-1, label permutation: recompute the identical estimate
    after randomly permuting which key produced which pattern, destroying the association while preserving
    both marginals exactly. Its true value is zero by construction, so its estimate is the estimator''s
    bias-plus-noise floor at this sample size. NULL-2, structural: generate F from a key-independent
    process matched to the measured per-block rates and pairwise structure, and estimate again. FOR
    THE SIGNAL ARM TO MEAN ANYTHING: NULL-1 and NULL-2 must agree with each other within their confidence
    intervals - if they do not, the estimator responds to something other than key dependence and
    no signal-arm number is reportable - and the signal arm must exceed both by more than the pre-declared
    minimum effect. A signal arm that sits on the null floor is reported as a measured upper bound
    on per-failure information at the executed sample size, which is a result and not a failure.'
  discriminated_from:
  - 'IDEA-20260805-15258a predicts that the DFR is a per-key quantity with measurable dispersion.
    Dispersion is a necessary condition for positive mutual information but is not the same object:
    a scheme can have large DFR dispersion and near-zero per-failure information if the pattern is
    uninformative about which key is which. This measures the bit count directly and would be run
    even if dispersion were exactly zero, because pattern shape can carry information the rate does
    not.'
  - IDEA-20260806-7c1ae4 and IDEA-20260808-4854f8 are ML-KEM records about whether a failure oracle
    is REACHABLE by a deployed adversary and about the opposite directions in which a DFR bound is
    consumed. Neither counts information, neither concerns HQC, and RQ-MLKEM-001's 26-proposal saturation
    is explicitly avoided here.
  - EV-HQC-b71230 and EXP-HQC-982268 measure the joint moments of F under an independence null. Mutual
    information with a key functional is a different functional of a different joint law; the committed
    runs do not record G at all, so their data cannot answer this even in principle.
  - A chosen-ciphertext or reaction-attack proposal would construct queries and count them. Nothing
    here constructs a query, an adversary or a procedure; the key is known to the instrument and the
    number produced is an information-theoretic bound, not an algorithm.
  - IDEA-20260808-d21021 concerns an adversarially steerable covariance in the ciphertext, i.e. what
    an attacker can DO to the error distribution. This measures what an observer LEARNS from an unsteered
    failure, with the steering dial fixed at zero.
  assumptions:
  - Parameters can be tuned so the per-trial failure probability is near 1e-2 while the block structure
    remains recognisably HQC-shaped; if they cannot, the conditioned sample size collapses and the
    measurement is not affordable.
  - The declared key functional G is fixed before data generation and never revised afterwards; a
    G chosen after seeing failure patterns would inflate the estimate arbitrarily.
  - Miller-Madow correction plus the permutation null adequately characterises the estimator's small-sample
    bias at the declared alphabet size; the ladder over T is what would expose it if not.
  - The key is sampled independently across trials, so trials are i.i.d. and the estimator's variance
    formula applies.
  - No conclusion transfers to deployed parameters, where the conditioned space cannot be sampled
    at all.
  predictions:
  - metric: bias-corrected I(G ; F | S > 0) in bits per observed failure, signal arm minus permutation
      null
    direction: higher
    minimum_effect: 0.01
  - metric: difference between the permutation null and the structural key-independent null
    direction: different
    minimum_effect: 0.0
  - metric: ratio I(G ; F) / I(G ; 1{S > delta})
    direction: higher
    minimum_effect: 1.0
  - metric: signal-arm estimate as the sample size T increases over the declared ladder
    direction: different
    minimum_effect: 'convergence rather than a magnitude: the estimate must change by less than its
      own confidence interval between the last two rungs, otherwise it is not an estimate and no value
      is reported.'
  minimal_test:
    design: 'One parameter set, three arms, one invocation, no ladder. Choose n = 227, RM(1,5) inner
      blocks, n_e = 7, weights tuned on a disjoint seed stream so the per-trial failure probability
      is near 1e-2. Draw T = 10^6 trials, recording the coarsened key functional G (per-block secret-weight
      profile over a 4-symbol alphabet) and the pattern F for each. Compute the bias-corrected mutual
      information on the conditioned subsample, then recompute on a label-permuted copy and on a key-independent
      synthetic copy. Report the three numbers and their intervals. This discriminates because the
      permutation null pins the estimator''s floor exactly and any excess above it is the quantity
      of interest; and because the structural null, agreeing or not with the permutation null, decides
      whether the instrument is measuring key dependence at all. Cost: minutes of single-core CPU.'
    controls:
    - Label-permutation null on the identical estimator, same invocation, multiple independent permutations
      to get its own confidence interval.
    - Structural key-independent null matched to the measured per-block rates and pairwise structure.
    - Sample-size ladder in T, with convergence as a reporting precondition.
    - 'Alphabet-size sensitivity: repeat at two coarsening levels, so a result that depends entirely
      on the alphabet is exposed.'
    - Pre-registration of G, the alphabet and the estimator before any data generation, verified by
      the design document predating the data.
    required_metrics:
    - bias-corrected I(G ; F | S > 0) in bits with confidence interval
    - permutation-null estimate and its confidence interval
    - structural-null estimate and its confidence interval
    - I(G ; 1{S > delta}) and the ratio to the pattern-based value
    - per-block mutual-information terms and their sum, versus the total
    - conditioned sample count actually achieved
  falsification_conditions:
  - 'The signal arm does not exceed the permutation null by the pre-declared 0.01 bits: the measured
    upper bound on per-failure information at this sample size is the recorded obstruction.'
  - 'The permutation and structural nulls disagree: the estimator responds to something other than
    key dependence and no number is reportable.'
  - 'The estimate does not converge across the T ladder: it is not an estimate and none is reported.'
  - 'The total mutual information equals the sum of per-block terms within error: the pattern carries
    nothing beyond the count and the pattern-based framing is withdrawn.'
  - 'The result flips sign or magnitude with the alphabet coarsening: the number is an artefact of
    the functional and not a property of the pipeline.'
  confounders:
  - Small-sample bias in mutual-information estimation, which is positive and can be large - the whole
    reason the permutation null is mandatory rather than advisory.
  - 'Conditioning on failure induces selection: keys with higher DFR contribute more conditioned samples,
    which is part of the intended signal but also inflates the estimate if the conditioning is applied
    inconsistently between arms.'
  - 'Alphabet-size dependence: a finer G raises both the true value and the bias, so cross-alphabet
    comparisons are not automatically meaningful.'
  - Weight tuning to reach a 1e-2 failure rate may push the parameter set into a regime whose block
    structure is unlike HQC's, making the number about the surrogate rather than about the scheme.
  - Correlated seeds across arms shrinking apparent variance in the arm differences.
  interpretation_limits:
  - A positive value is an information-theoretic bound on what any procedure could extract; it names
    no procedure, no query count and no attack, and must not be reported as one.
  - The value is a lower bound on I(key ; F) because of the two projections, so it cannot be used
    to argue that little information is present - only that at least this much is.
  - The measurement is confined to a regime where failures are common; deployed HQC is by design not
    in that regime and no extrapolation is offered.
  - The number depends on the declared functional G and is scoped to it.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs O(T * n_e * 2^m * m) for generation
      plus O(T) for the estimator; the permutation null adds O(T) per permutation.
    memory_exponent: No attack memory exponent is claimed. Storage is the (G, F) table, O(T * n_e)
      bits, i.e. under a gigabyte at T = 10^6 and n_e = 7.
    best_known: There is no incumbent in this repository for per-failure information content of any
      scheme. The nearest committed measured object is EV-HQC-b71230's joint-moment table, which measures
      a different functional of the same pipeline and cannot be re-read to answer this because G was
      never recorded.
    hidden_overhead: 'The hidden cost is the conditioned sample count: reaching enough failures to
      estimate a distribution over 2^{n_e} patterns rather than a rate forces the parameter set into
      a high-failure regime, and defending that regime as HQC-shaped is human argument, not compute.
      A second is that Miller-Madow is a first-order correction only; if the alphabet is even moderately
      large the residual bias can exceed the effect, which is why the permutation null and not the
      correction is the load-bearing control.'
  dominated_by: n/a (no result claimed). No attack cost triple exists, so no frontier row applies
    and recording 'null' would be a fabrication under AGENTS.md rule 5. On the measurement axis, nothing
    in the repository computes this quantity, so there is nothing to be dominated by; EV-HQC-b71230
    dominates on trial count and certification but measures a different functional.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the repository
    contains no value, no bound and no null floor for per-failure information in any scheme, so the
    delta is the creation of a first number with its null floor, not an improvement on an existing
    one.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. (i) That parameters exist with a near-1e-2 failure rate and
    recognisably HQC-shaped block structure: ~0.85. (ii) That the permutation and structural nulls
    agree, licensing the instrument: ~0.75. (iii) That the signal arm exceeds the null floor by at
    least 0.01 bits: ~0.55 - some key dependence is close to certain in principle, but at 10^4 conditioned
    samples the floor may sit above it. (iv) That the pattern carries meaningfully more than the count
    S: ~0.4, and this is the part I would bet against most readily. (v) That the run produces a defensible
    number or a defensible upper bound: ~0.9.'
