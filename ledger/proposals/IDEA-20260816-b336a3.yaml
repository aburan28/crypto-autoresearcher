idea:
  id: IDEA-20260816-b336a3
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: Count in bits how much information about the secret one observed HQC decoding failure carries,
    using the block-failure PATTERN vector rather than the scalar failure event, by bias-corrected
    empirical mutual-information estimation at reduced parameters, against a label-permutation null
    and a key-independent-failure null where the answer is forced to be zero
  class: measurement
  claim: '(A) THE OBJECT NOBODY HAS COUNTED. GOAL-HQC-001 has measured whether failures are independent
    across blocks and at what rate they occur. It has never measured the quantity that decides what
    a failure is WORTH as an observation: the mutual information, in bits, between a key statistic
    and the observed failure pattern. The scalar failure event carries at most one bit by definition;
    the PATTERN F in {0,1}^{n_e} carries up to n_e bits, and how many it actually carries is an empirical
    question with a definite answer at reduced parameters. (B) THE ESTIMAND, MADE CONCRETE. Fix a
    low-dimensional key functional G(x, y) declared before any data is seen - the per-block secret-weight
    profile coarsened to a small alphabet. Estimate I(G ; F | S > 0), the mutual information between
    the key functional and the failure pattern conditioned on a failure occurring, in bits per observed
    failure, with a Miller-Madow bias correction and the plug-in bias reported alongside. (C) WHY
    THE CONDITIONING MATTERS. Conditioning on failure is what makes the number operationally meaningful
    as ''per observed failure'' rather than ''per trial'', and it is also what makes the estimate
    hard: failures are rare, so the sample size in the conditioned space is the binding constraint
    and the parameters must be chosen so that failures are common enough to estimate a distribution
    over patterns, not merely a rate. (D) WHAT IS NOT CLAIMED. This is not a decryption-failure attack
    and produces no attack. A positive mutual information is an information-theoretic upper bound
    on what any procedure could extract; it names no procedure, gives no query count, and implies
    no key recovery. It says nothing about deployed parameters, where the failure rate is by design
    far too small for the conditioned space to be sampled at all - that gap is the reason the measurement
    is confined to reduced parameters and is not extrapolated. A near-zero result is equally informative
    and is the outcome the design is built to be able to report honestly. No attack, break, speedup
    or security consequence is claimed here or would follow from a run. No statement is made about
    what the published literature does or does not contain; this environment cannot reach external
    literature. No direction is declared impossible.'
  mechanism: 'STAGE 1: declare G, the coarsening alphabet and the estimator before any data exists,
    and compute the estimator''s plug-in bias as a function of alphabet size and sample count so that
    the bias is a known constant rather than a discovered surprise - this is the whole reason naive
    mutual-information estimates on small samples are untrustworthy and the reason the permutation
    null below is mandatory. STAGE 2: generate T trials at parameters tuned so the per-trial failure
    probability lands near 1e-2, giving roughly 1e4 conditioned samples at T = 1e6. Record (G, F)
    for every trial. STAGE 3: compute the bias-corrected mutual-information estimate, and in the SAME
    invocation compute it again after randomly permuting the association between keys and patterns.
    The permutation null has true mutual information exactly zero, so whatever the estimator returns
    there is its bias plus noise at this sample size; the reported signal is the difference. STAGE
    4: run a second, structural null in which failures are generated by a key-independent Bernoulli
    process at the measured per-block rate, which must return the same value as the permutation null
    - if it does not, the estimator is sensitive to something other than key dependence and the instrument
    is void. STAGE 5: a sample-size ladder, since a mutual-information estimate that does not converge
    as T grows is not an estimate. Refutation is clean: a signal indistinguishable from the permutation
    null at the largest T is a measured upper bound on the per-failure information, which is a usable
    obstruction.'
  novelty_status: unverified
  novelty_screen:
