idea:
  id: IDEA-20260807-413fcc
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    CLOSURE WITH A NAMED OBSTRUCTION -- the zero-information oracle class: any
    oracle whose answer is a function of the curve data and adversary-supplied
    field elements alone, taking no group handle as an argument, is simulable at
    ZERO group operations and carries exactly zero bits about k, because k is
    independent of the public curve data; this closes the j-invariant, volcano-
    level, class-group-action, curve-level torsion-structure, Hilbert-class-
    polynomial and summation-polynomial-evaluation oracles in one argument, and
    the forward guidance names precisely the point-dependent variants that escape
  class: mechanism

  claim: >-
    (A) THE CLASS, DEFINED SO MEMBERSHIP IS DECIDABLE BY INSPECTION. Call an
    oracle O CURVE-MEASURABLE if its signature takes NO group handle as an
    argument: O : (p, a, b, N ; field elements and integers supplied by the
    adversary) -> answer. Membership is decided by reading the signature. No
    analysis is required and no compute is spent.

    (B) THE OBSTRUCTION, NAMED. Fix the curve E/F_p and the generator P. The
    scalar k is drawn independently of (p, a, b, N) -- it is a property of the
    CHALLENGE, not of the curve. Any curve-measurable oracle's answer is a
    deterministic function of (p, a, b, N) and of arguments the adversary itself
    chose. Therefore the answer is measurable with respect to the sigma-algebra
    generated by the public curve data and the adversary's own randomness, and
    that sigma-algebra is independent of k. Hence
      I(O-answers ; k | p, a, b, N, P, Q) = 0
    exactly, not approximately and not heuristically. THE OBSTRUCTION IS THAT k
    IS INFORMATION ABOUT A POINT AND THESE ORACLES ARE FUNCTIONS OF A CURVE. This
    is the same obstruction DECOMPOSITION.md states for lane L7 ("k is
    information about a point, not about the curve; any curve-only statistic is
    k-independent by construction"), lifted from a lane-specific warning to a
    closure over an oracle class.

    (C) THE ARGUMENT, TWICE, BECAUSE ONE ROUTE IS STRONGER THAN THE OTHER.
      ROUTE 1 (simulation): the simulator answers a curve-measurable query by
        computing the same function, using only (p, a, b, N) which it has and the
        adversary's own arguments which it sees. T_sim = 0 GROUP OPERATIONS.
        Shoup (KN-TECH-005) applies verbatim to the simulated algorithm, so the
        augmented problem retains exponent 1/2 with NO loss whatsoever -- unlike
        every other simulability verdict in this campaign, this one has no T_sim
        caveat, which is why it is worth separating out.
      ROUTE 2 (information): even outside the generic model, where Shoup does not
        apply, the mutual-information identity in (B) holds. So a curve-
        measurable oracle cannot help ANY adversary, generic or not. This is
        strictly stronger than Route 1 and does not depend on the generic model
        at all. Route 2 is the reason this is a closure rather than a
        model-relative observation.

    (D) THE MEMBERS, WITH THEIR SIGNATURES, SO NOTHING IS CLOSED BY ASSERTION.
      j-invariant oracle:            (a, b) -> j = 1728*4a^3/(4a^3+27b^2). Member.
      volcano-level oracle:          (a, b, p, ell) -> level of E in the
                                     ell-volcano. Member.
      class-group-action oracle:     (a, b, p; ideal class c) -> the curve c * E.
                                     Member -- it returns a CURVE.
      curve-level torsion oracle:    (a, b, p, ell) -> the group structure of
                                     E[ell] as a Galois module, division-
                                     polynomial factorisation pattern,
                                     Elkies/Atkin type of ell. Member.
      Hilbert-class-polynomial /
      CM-discriminant oracle:        (a, b, p) -> D, D_0, h(O), H_D(X). Member.
      summation-polynomial oracle,
      EVALUATION form:               (a, b; x_1..x_m) -> S_m(x_1..x_m). Member --
                                     its arguments are FIELD ELEMENTS, not
                                     handles. (Its SEARCH form is NOT a member
                                     and is adjudicated in IDEA-20260807-7270d1.)
      embedding-degree oracle:       (p, N) -> least k with N | p^k - 1. Member.
      endomorphism-ring oracle:      (a, b, p) -> End_{F_p}(E) as an abstract
                                     order, its conductor, its class number.
                                     Member.
    Eight of the campaign's named oracle ideas, closed by reading their
    signatures.

    (E) THE FORWARD GUIDANCE, WHICH IS WHAT SEPARATES A CLOSURE FROM A FATIGUE
    REPORT. Exactly one syntactic feature lets an oracle escape: TAKING A GROUP
    HANDLE AS AN ARGUMENT. The escapes are therefore enumerable and are named
    here as the classes that remain open after this closure:
      E1. POINT-DEPENDENT CURVE CONSTRUCTIONS. "Given handle h, form the curve
          E_h by some construction depending on h, and return its j-invariant /
          volcano level / torsion structure." Not a member. Whether such a
          construction exists that is (i) computable without k and (ii) not a
          function of lambda(h) is OPEN and is the only interesting descendant of
          this closure. A concrete candidate to test: the curve obtained by
          Velu's formulas from the subgroup generated by h -- but h has prime
          order N, so that quotient is the trivial one and the construction
          degenerates. That degeneration is itself informative and is the first
          thing E1 should check.
      E2. COORDINATE-VALUED ORACLES. Anything returning x(h) or a function of it,
          including factor-base membership and model change. These are resource
          R1/R2 and are adjudicated in IDEA-20260807-070d03.
      E3. TRANSPORT ORACLES returning phi(h) on another curve. Resource R4;
          adjudicated in IDEA-20260807-d73e83 (also closed, by a different
          argument -- relabeling).
      E4. ORACLES INTO A DIFFERENT GROUP: pairings (R7), lifts (R6).
          Adjudicated in IDEA-20260807-569c82 and IDEA-20260807-fd2d89.
      E5. AMORTIZED / ADVICE ORACLES (R8) whose answer depends on many instances.
          Outside this argument's scope: the independence in (B) is per-instance.
    That five-item list is exhaustive over signatures, which is what makes this a
    closure at the docs/inventor-protocol.md section 4 standard: named
    obstruction (k is independent of curve data), argument (the two routes in
    (C)), forward guidance (E1-E5).

    (F) WHAT THIS DOES NOT CLOSE, STATED PLAINLY. It does NOT close lanes L2, L3,
    L10 or L7. Those lanes do not have to route their structure through an
    ORACLE: they may instead claim that curve-level structure changes the COST of
    a non-generic algorithm run on that curve -- e.g. that the Groebner solving
    degree of the Semaev system differs between two curves in one isogeny class.
    That is a claim about an algorithm's cost as a function of public curve data,
    which is not an oracle at all and is untouched by (B). This closure kills the
    ORACLE FRAMING of those lanes and leaves their COST-FUNCTIONAL framing
    entirely intact. Any reading of this record as "L2/L3/L10 are dead" is wrong
    and is the misreading this paragraph exists to prevent.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    Consumes no resource: it is an audit that adjudicates the resources claimed
    by others. Its VERDICT, however, is that the eight listed oracles are
    inadmissible_generic_group in the DECOMPOSITION.md section 2 sense -- they
    name resources R2, R3, R4, R5 but deliver those resources in a form that
    contains no information about k, so the resource label is nominal and the
    admissibility filter rejects them. That is the strongest form of the filter's
    verdict and it is reached without any measurement.

  discriminated_from:
    - >-
      KN-FIND-b7e091, which closes the incidence and endomorphism-IMAGE oracles.
      Both of those TAKE HANDLES and are closed by a lambda-factorisation
      argument. The class here takes NO handles and is closed by an independence
      argument. Disjoint classes, disjoint arguments; this record neither uses
      nor revisits that finding's verdicts.
    - >-
      H-ENDO-001, whose scalar-action fact closes handle-taking endomorphism
      oracles. Not used here: a curve-measurable oracle needs no scalar-action
      argument because it never touches G.
    - >-
      DECOMPOSITION.md lane L7's stated obstruction ("k is information about a
      point, not about the curve"). This record does not originate that
      observation; it generalizes it from one lane's warning to a closure over an
      oracle class defined by a syntactic criterion, adds the exact mutual-
      information statement, adds the two-route argument, and adds the
      exhaustive escape list. Credit for the observation belongs to the
      decomposition; the closure is what is being proposed.
    - >-
      IDEA-20260807-5876b8, in which this class is cell (a) with T_sim = 0. That
      record states a four-cell dichotomy; this one proves the strongest single
      cell and does not depend on the dichotomy being right. If the dichotomy is
      refuted, this closure stands.

  object_first_candidate:
    tracked_object: >-
      The conditional mutual information I(answers ; k | public curve data),
      measured in bits, attached to an oracle class rather than to an oracle.
    lossiness: >-
      EXTREMELY LOSSY: an entire oracle -- its mathematics, its cost, its
      motivation -- is projected onto one non-negative real number. What is
      retained is exactly the quantity that decides whether querying can ever
      help. The projection loses the oracle's IMPLEMENTATION COST entirely, which
      is why this object cannot adjudicate cell-(c) oracles and is not claimed
      to.
    propagation: >-
      Deterministic and monotone under the operations that matter:
      I = 0 is preserved under composing curve-measurable oracles with each other
      and with any function the adversary computes (data-processing inequality),
      and is preserved under repeating the query any number of times. It is NOT
      preserved under composing with a handle-taking oracle, which is exactly the
      escape boundary E1-E5. That the propagation fails precisely at the
      boundary the syntactic criterion draws is the consistency check that makes
      the criterion trustworthy.
    survival_score: >-
      Survives every curve, every field size, every model change, and the whole
      isogeny class. Survives outside the generic group model, which no other
      argument in this lane does. Dies at (i) any handle argument, (ii)
      multi-instance/advice settings where the independence in (B) is a joint
      statement over instances rather than a per-instance one, (iii) any setting
      where k is NOT drawn independently of the curve -- e.g. a protocol that
      derives k from the curve parameters, which is out of scope but is a real
      failure mode worth naming.

  mechanism: >-
    STEP 1 (zero compute) -- STATE THE INDEPENDENCE PRECISELY. Model the instance
    generation: E/F_p and P are fixed (public); k is drawn uniformly from
    [1, N-1] independently; Q = [k]P. Then for any deterministic function
    F(p, a, b, N, args) the random variables F and k are independent, so
    I(F ; k) = 0 and, conditioning on the public data, I(F ; k | public) = 0.
    Repeating over polynomially many queries with adaptively chosen args changes
    nothing, because the args are functions of the adversary's own view which is
    itself independent of k until a handle is touched -- and by hypothesis no
    handle is touched. Write this out; it is four lines and it is the whole
    theorem.

    STEP 2 (zero compute) -- STATE THE SIMULATOR. One line: the simulator
    computes F. T_sim = 0 group operations. Record it so the Shoup route is
    available independently of the information route.

    STEP 3 (zero compute) -- CLASSIFY BY SIGNATURE. For each of the eight named
    oracles, write the signature and check "no handle argument". Publish the
    table. This is clerical by design; a closure that requires cleverness per
    member is not reusable.

    STEP 4 (zero compute, THE PART THAT COULD FAIL) -- HUNT FOR A MEMBER THAT IS
    NOT REALLY A MEMBER. The failure mode is an oracle that LOOKS curve-
    measurable but smuggles a handle in through a field argument. Two concrete
    traps to check explicitly:
      TRAP 1: "S_m(x_1, ..., x_{m-1}, x(R))" -- if the adversary must supply
        x(R) for a handle R, then obtaining x(R) required a coordinate oracle,
        and the COMPOSITE is not curve-measurable even though S_m itself is. The
        record must state that the closure covers S_m evaluation at ADVERSARY-
        CHOSEN field elements and says nothing about where those field elements
        came from.
      TRAP 2: "the volcano level of the curve reached by walking from E in the
        direction determined by handle h". Handle argument, not a member, class
        E1.
    Any oracle that survives Step 4 is closed; any that does not is routed to its
    proper adjudication and this record names which.

    STEP 5 (bounded toy compute, <= 5 minutes, OPTIONAL AND ONLY AS AN
    INSTRUMENT CHECK) -- the empirical null. On toy curves at p <= 2^20, compute
    each of the eight oracle answers, then resample k 10^4 times with the CURVE
    AND P FIXED, and measure the empirical mutual information between the answer
    vector and k. It must be zero up to the estimator's finite-sample bias, and
    the bias must be reported by running the identical estimator on two
    independent uniform variables. THIS MEASURES NOTHING ABOUT MATHEMATICS -- the
    answer is forced by Step 1 -- IT TESTS THE INSTRUMENT, and it is the cheapest
    available check that the campaign's mutual-information estimator does not
    manufacture signal from independent variables. That is its only purpose and
    the record must not present it as evidence for the closure.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), 2026-08-07,
      over ledger/, knowledge/, docs/, analysis/. Patterns: "j-invariant";
      "volcano"; "class group action"; "curve-only|curve only|k-independent";
      "Oracle A|Oracle B|Oracle C|Oracle D|oracle class"; "simulab|simulator".
    results: >-
      The obstruction is stated once in the corpus, in
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md lane L7:
      "k is information about a point, not about the curve; any curve-only
      statistic is k-independent by construction". It is stated there as a lane
      warning, applied to one lane, with no oracle class, no simulator, no
      mutual-information statement and no escape enumeration. RQ-TORS-8c7b79
      repeats it for its own lane. No record generalizes it, and no record closes
      the j-invariant, volcano-level or class-group-action oracles.
      KN-FIND-b7e091's closed classes both take handles and are disjoint from
      this one.
    verdict: adaptation
  novelty_screen_note: >-
    ADAPTATION of an observation the campaign's own decomposition already makes
    for one lane. The generalization, the syntactic membership criterion, the
    two-route argument, and the exhaustive escape list are what is proposed. The
    underlying probability fact (a function of variables independent of k carries
    no information about k) is elementary and is not claimed as new mathematics.

  null_object_control: >-
    MANDATORY AND BLOCKING, in both directions, because Step 5 uses an estimator.
    NULL OBJECT: two independent uniform random variables of the same alphabet
    sizes as (answer vector, k). The mutual-information estimator run on them
    must return the same value it returns for the eight oracles, and that common
    value is the estimator's finite-sample bias, which must be reported rather
    than subtracted silently.
    PLANTED SIGNAL: a SHAM ORACLE that returns the low 8 bits of k. The estimator
    must report approximately 8 bits for it. An estimator that reports 0 for the
    planted oracle cannot detect information and every zero it reports elsewhere
    is void.
    DECAY PARAMETER: the number of leaked bits t in the planted oracle,
    t in {0, 1, 2, 4, 8, 16}. Measured mutual information must increase
    monotonically and approximately linearly in t and must return to the null
    level at t = 0. A measured quantity that does NOT fall to the null level at
    t = 0 is the canonical artifact tell and voids the instrument.
    SECOND DECAY PARAMETER: sample count n in {10^2, 10^3, 10^4}. Estimator bias
    must decay as n grows; bias that does not decay means the estimator is
    misconfigured.

  assumptions:
    - >-
      k is drawn independently of the curve parameters. This is the standard
      ECDLP instance model and it is where the argument would fail if a protocol
      derived k from the curve; that is out of scope and is named as a limit.
    - >-
      The oracle's signature is honest -- its field arguments are genuinely
      adversary-chosen and are not covertly derived from a handle. Step 4 exists
      to check this and it is the only place the closure can fail.
    - >-
      Single instance. The independence is per-instance and does not survive an
      amortized/advice model (escape class E5).
    - >-
      Curve parameters are public. If some curve datum were SECRET, an oracle
      revealing it would carry information -- about the curve, still not about k,
      but the model would no longer be the one analysed here.

  proof_search_map:
    bottleneck: >-
      Step 4, the smuggled-handle audit. The independence argument is four lines
      and cannot fail on its own terms; the ONLY way this closure is wrong is if
      an oracle that looks curve-measurable is not. That is the exact step whose
      failure changes the conclusion, it costs zero compute, and it is where a
      reviewer should spend all their attention.
    baseline_embedding:
      parameter_slice: >-
        The degenerate slice: an oracle with zero field arguments and zero handle
        arguments, i.e. the public-curve-data oracle () -> (a, b, p, N). This is
        H-GGM-001's own "public-curve control", for which the recorded expected
        verdict is SIMULABLE with overhead C = 0. The class here must reproduce
        that verdict exactly at that slice.
      reproduction_check: >-
        SYMBOLIC: the class's simulator specialises to the identity function at
        the degenerate slice, giving T_sim = 0, matching H-GGM-001's control
        prediction. Plus a frozen fixture: the public-curve-data oracle appears
        in the IDEA-20260807-5ddd98 control set with the pre-registered verdict
        SIM/T_sim = 0, and this class must agree with it.
    observation_collision:
      observable: >-
        I(answers ; k | public) = 0, together with the syntactic predicate "no
        handle argument".
      distinct_preimage_search: >-
        REQUIRED, AND IT SUCCEEDS, WHICH BOUNDS THE CLAIM. Two objects with the
        same observable and radically different status:
          (i) the j-invariant oracle -- I = 0, and useless;
          (ii) the ORACLE THAT RETURNS THE TRACE t of Frobenius -- also I = 0 by
               the same argument, also curve-measurable -- yet when t = 1 the
               curve is anomalous and the ECDLP is solvable in O(log p)
               (KN-TECH-033).
        Both have zero mutual information with k. One of them sits on a curve
        family where the problem is broken. The resolution, and it must be
        stated in the same breath as the closure: I = 0 means QUERYING DOES NOT
        HELP; it does NOT mean the curve is hard. Curve-level structure can
        determine that a fast algorithm EXISTS without any oracle carrying
        information about k. This collision is the precise reason paragraph (F)
        is in the claim, and it is the strongest single limit on this record.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable I = 0 fixed and vary the forgotten structure -- the
          curve family. The fiber contains both generic ordinary curves and
          anomalous curves; the intrinsic invariant distinguishing them is the
          trace t, which is itself curve-measurable. So the fiber is not
          separated by any oracle-level quantity, only by a curve-level one.
        predicted_gain: >-
          A sharp statement of what the closure may be used for: it bounds the
          value of QUERIES, never the hardness of the INSTANCE. This is a
          limiting result about the proposal's own observable and is the main
          intellectual output of the audit beyond the closure itself.
      - transform: stronger_invariant
        proposed_object: >-
          Carry (I, T_sim, handle-arity) rather than I alone. Handle-arity is the
          syntactic invariant that decides membership and is what survives
          composition; I alone does not tell you whether composing with another
          oracle preserves the verdict.
        predicted_gain: >-
          Makes the escape enumeration E1-E5 derivable from the invariant rather
          than assembled by hand, which is what makes the closure reusable by a
          later lane on an oracle nobody has thought of yet.
    quantifier_order: >-
      CLAIMED, AND THE ORDER IS THE WHOLE ARGUMENT:
        FORALL curves E/F_p in the declared family, FORALL generators P,
        FORALL curve-measurable oracles O (i.e. FORALL deterministic functions
        F of (p, a, b, N) and adversary-supplied arguments),
        FORALL adversaries A making any polynomial number of adaptive queries,
        we have I(A's oracle transcript ; k | p, a, b, N, P, Q) = 0,
        where k is drawn uniformly and INDEPENDENTLY OF THE CURVE.
      The universal quantifier over F comes BEFORE the choice of k, which is what
      makes the independence hold; that ordering is the entire content.
      THE DANGEROUS WEAKER READING, NOT CLAIMED: "FORALL O EXISTS a curve on
      which O is useless" -- a far weaker statement satisfiable by picking a bad
      curve for each oracle, and worthless.
      THE DANGEROUS STRONGER READING, ALSO NOT CLAIMED: "FORALL curve-measurable
      O, the ECDLP on E is hard". False, by the trace-one collision above. The
      claim is about queries, not about instances, and the two readings must
      never be merged.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No adversary, generic or not, gains any information about k by querying
        an oracle whose signature contains no group handle, in the
        single-instance model with k drawn independently of the curve." It can
        NEVER certify that a curve is hard, that a lane is closed, or that
        curve-level structure is irrelevant to attack cost -- only that it cannot
        be delivered THROUGH AN ORACLE INTERFACE.
      nearby_object_control: >-
        THE ANOMALOUS-CURVE TRACE ORACLE, as above: the closest object on which
        the hoped-for conclusion ("this curve-level structure is harmless")
        FAILS. The method assigns it I = 0 and is therefore unable to
        distinguish it from the j-invariant oracle. That the method cannot make
        the distinction is stated here as a ceiling, not discovered later as a
        surprise, and it is the reason the closure is scoped to queries.
        A SECOND nearby object: the advice oracle of lane L13, where I > 0 is
        possible across instances even though each per-instance answer is
        curve-measurable, because the ADVICE may have been computed with
        knowledge of many targets. Escape class E5.
    proof_obligations:
      - claim: >-
          I(F(public, args) ; k | public) = 0 for deterministic F and k drawn
          independently, under adaptive querying.
        responsibility: correctness
      - claim: The simulator has T_sim = 0 group operations.
        responsibility: runtime
      - claim: >-
          Each of the eight named oracles is curve-measurable by its signature,
          with no smuggled handle.
        responsibility: scope
      - claim: >-
          The escape list E1-E5 is exhaustive over signatures containing a handle
          argument.
        responsibility: correctness
      - claim: >-
          The degenerate slice reproduces H-GGM-001's public-curve control
          verdict.
        responsibility: baseline
      - claim: >-
          The mutual-information estimator used in Step 5 detects a planted t-bit
          leak and returns its bias level on independent variables.
        responsibility: interface

  predictions:
    - metric: >-
        number of the eight named oracles whose signature contains a group handle
      direction: different
      minimum_effect: >-
        0 of 8. Pre-registered. If any one of the eight turns out to require a
        handle argument to be useful as its lane intends, that oracle is NOT
        closed here and must be routed to E1-E5; the closure then covers seven or
        fewer and the record must say so rather than quietly redefining the
        oracle.
    - metric: >-
        empirical mutual information between each oracle's answer vector and k,
        with the curve and P fixed and k resampled 10^4 times, at p <= 2^20
      direction: different
      minimum_effect: >-
        Indistinguishable from the independent-variable null within the
        estimator's measured bias, for all eight. THIS IS AN INSTRUMENT CHECK,
        NOT EVIDENCE: the theoretical answer is exactly 0 and a nonzero
        measurement would indicate an estimator or implementation fault, not a
        mathematical discovery. Pre-registered as such so that a nonzero result
        cannot later be read as a finding.
    - metric: >-
        estimator response to the planted t-bit leak oracle, t in {0,1,2,4,8,16}
      direction: higher
      minimum_effect: >-
        Monotone increasing in t, approximately linear, within 20 percent of t
        bits at t = 8 and t = 16 at n = 10^4, and returning to the null level at
        t = 0. Failure of the t = 0 return is the canonical artifact tell and
        voids the instrument.
    - metric: >-
        number of lanes whose ORACLE framing is closed by this record
      direction: different
      minimum_effect: >-
        At least 4 (the oracle framings of L2 volcano, L3 j-invariant, L10
        class-group action, L7 curve-level torsion). Fewer than 4 means the
        syntactic criterion is not capturing what those lanes actually propose,
        which is a defect in this record and not in the lanes.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, 1 hour): write the independence argument and the
      simulator; classify the eight signatures; run the Step 4 smuggled-handle
      audit on each. This is the entire mathematical test.
      STAGE 1 (zero compute): check the degenerate-slice baseline against
      H-GGM-001's public-curve control verdict.
      STAGE 2 (toy compute, <= 5 minutes, INSTRUMENT ONLY): implement the
      mutual-information estimator; run it on the independent-variable null, on
      the planted t-bit leak ladder, and only then on the eight oracles at
      p <= 2^20 with 10^4 resamples of k at fixed curve and P.
      STAGE 3 (zero compute): publish the closure with its escape list, and file
      E1 (point-dependent curve constructions) as the one open descendant,
      including the Velu degeneration check named in (E).
    controls:
      - >-
        independent-variable null for the estimator (mandatory, blocking)
      - >-
        planted t-bit leak ladder, t in {0,1,2,4,8,16} (mandatory, blocking)
      - >-
        sample-count ladder n in {10^2, 10^3, 10^4} for bias decay
      - >-
        H-GGM-001 public-curve-data control as the degenerate-slice baseline
      - >-
        matched random curve at the same p, to confirm the measured value does
        not depend on the curve being structured
    required_metrics:
      - handle-arity of each of the eight signatures
      - T_sim per oracle (expected 0 group operations)
      - empirical mutual information per oracle, with the estimator's measured
        bias reported beside it
      - estimator response curve over the planted-leak ladder
      - the escape classification of any oracle that fails Step 4

  falsification_conditions:
    - >-
      Any of the eight oracles is found, in Step 4, to require a group handle to
      deliver what its lane wants. That oracle is not in the class; the closure
      covers fewer members; the record states the reduced list rather than
      redefining the oracle to fit.
    - >-
      The estimator returns nonzero mutual information for a curve-measurable
      oracle, beyond its measured bias, and the planted-leak control passed. The
      independence argument or the implementation is wrong; the closure is
      suspended and the discrepancy is investigated as a suspected implementation
      fault BEFORE it is reported as anything else, since the theoretical value
      is exactly zero.
    - >-
      The planted t-bit leak oracle is not detected. The estimator cannot see
      information and every zero it produced is void -- an instrument failure,
      not a mathematical result, per AGENTS.md rule 5 and RQ-INSTR-f8faa0.
    - >-
      Someone exhibits a handle-free oracle whose answers help an adversary. That
      contradicts the independence identity and would mean the instance model in
      the assumptions does not describe the setting; the model, not the theorem,
      is what would be wrong.
    - >-
      The escape list E1-E5 is shown non-exhaustive by an oracle taking a handle
      that fits none of the five. The closure survives (it is about handle-free
      oracles) but the forward guidance is incomplete and must be superseded.

  confounders:
    - >-
      SMUGGLED HANDLES, the dominant confounder and the reason for Step 4. An
      oracle stated as curve-measurable whose lane intends to feed it x(R) for a
      handle R is a composite, and the composite is not closed.
    - >-
      ESTIMATOR BIAS. Mutual-information estimators on finite samples return
      positive values for independent variables. The independent-variable null is
      mandatory and its value must be reported, never subtracted silently.
    - >-
      READING THE CLOSURE AS A HARDNESS CLAIM. The trace-one collision shows
      curve data can determine that a fast algorithm exists while carrying zero
      information about k. Paragraph (F) and the method ceiling exist to block
      this reading, and reviewers should check the write-up for it specifically.
    - >-
      SCOPE DRIFT TO MULTI-INSTANCE. The independence is per-instance. A record
      that cites this closure in an amortized setting is citing it outside its
      scope.

  interpretation_limits:
    - >-
      Closes an ORACLE CLASS, not a lane. L2, L3, L7 and L10 retain their
      cost-functional framings entirely; only their oracle framings are closed.
    - >-
      Says nothing about whether curve-level structure changes the cost of a
      non-generic algorithm. That is the gating question of L1 and is untouched.
    - >-
      Scoped to single instance, prime order, prime field, k independent of the
      curve, public curve parameters. Escape class E5 (advice) is explicitly
      outside.
    - >-
      The Stage 2 measurement is an instrument check at toy scale and is not
      evidence for the closure, whose support is the argument in (C). Presenting
      the measurement as toy-scale evidence for a scale-independent theorem would
      be a category error in the direction of understating it.
    - >-
      The record does not assert that the eight oracles are uninteresting. Some
      of them (the endomorphism-ring oracle, the class-group-action oracle) are
      central to other problems entirely. It asserts only that they cannot help
      recover k when queried.

  reachability_gate: >-
    APPLIES TO ONE MEMBER AND IS DISCHARGED BY THE CLOSURE. The class-group-
    action oracle proposes motion between curves and would ordinarily owe the T5
    reachability analysis: reaching a RANDOM curve in the class costs O(log p)
    isogeny steps under GRH; reaching a SPECIFIED one is vectorization at roughly
    p^{1/4} classically. This record makes that analysis MOOT for the oracle
    framing: since the oracle returns a CURVE and carries zero information about
    k, no reachability cost can be worth paying, at any price including zero. A
    good object is not merely unreachable here -- it does not exist. The
    reachability gate does still bind for the POINT-transport form of the same
    map, phi_c(P), which is a different oracle and is adjudicated in
    IDEA-20260807-d73e83.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING FOR THE CLOSURE. The
        independence identity in (B) is exact given the instance model, and the
        simulator in Route 1 is a construction. The one modelling assumption --
        that k is drawn uniformly and independently of the curve -- is a
        definition of the instance family, not a heuristic about a distribution
        that could turn out otherwise, and it is falsifiable only by changing the
        setting.
      rigorous_support: >-
        Elementary: for independent random variables X (curve) and k, and any
        deterministic F, I(F(X, args) ; k) = 0, with the adaptive case following
        by the data-processing inequality applied to the adversary's view. Shoup
        (KN-TECH-005) supplies the alternative Route 1 conclusion and is cited,
        not reproved.
      validation_plan: >-
        Not distributional. The check is Stage 0's argument plus Stage 1's
        baseline slice. Stage 2's empirical mutual information is an INSTRUMENT
        validation, labelled toy scale (p <= 2^20, 10^4 resamples), compared
        against the independent-variable null rather than against a theoretical
        distribution, with the planted-leak ladder as the tail/sensitivity check.
        It validates the estimator, not the theorem, and the record says so in
        three places because that distinction is the one most likely to be lost.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. What is claimed about exponents: for every
      member of the class, the exponent of the oracle-augmented ECDLP equals the
      exponent of the plain ECDLP, exactly and with no loss, because
      T_sim = 0 group operations. This is the tightest closure available in this
      lane -- every other simulability verdict carries a T_sim penalty and this
      one does not.
    memory_exponent: >-
      The simulator uses O(1) additional memory (it stores nothing; it evaluates
      a public function). The audit itself is pencil work plus, optionally, a
      10^4-sample estimator whose memory is negligible.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted on CM curves (KN-TECH-018); BSGS at sqrt(N) time and memory
      (KN-TECH-031). This record does not move any of them and does not claim to.
    hidden_overhead: >-
      Nothing hides in an o(1) here because no asymptotic algorithm is proposed.
      What DOES hide, and is disclosed: the word "oracle". The closure is about
      an INTERFACE. A lane can deliver the identical mathematics as an algorithm
      rather than an oracle and this record says nothing about it -- paragraph
      (F). That is the whole of the fine print and it is large.
    tradeoff_note: >-
      Not applicable: no attack, no table, no tradeoff. The incumbent rho keeps
      the O(1)-memory corner uncontested.

  dominated_by: >-
    AS AN ATTACK: none mounted. Dominated on every axis by every row of the
    prime-field frontier, checked individually: parallel rho with distinguished
    points (0.886*sqrt(N) time, O(1) memory, 0 queries) dominates on time, memory
    and queries; automorphism-discounted rho on CM curves (KN-TECH-018) dominates
    by a further factor up to sqrt(6) on time at equal memory; BSGS
    (KN-TECH-031) at sqrt(N) time and sqrt(N) memory dominates too, this record
    having no point on the frontier at all. `null` would be a fabrication.
    AS A CLOSURE: the incumbent is DECOMPOSITION.md's lane-L7 sentence, which
    covers one lane and states no oracle class. This record dominates it on scope
    (8 oracles, 5 escape classes, 4 lanes' oracle framings) and on argument
    strength (two independent routes, one of them model-free). It is dominated by
    that sentence on nothing except that the sentence is already in a frozen
    campaign document and this is a proposal.
  sota_delta: >-
    Zero speedup against any attack baseline: 0 on time, 0 on memory, 0 on
    queries. Closure delta in numbers: 8 named oracle classes closed by a
    signature check costing 0 compute-seconds each; T_sim = 0 group operations
    versus O(m) and O(log N) for the two classes KN-FIND-b7e091 closed, so this
    is a strictly tighter closure than the corpus's existing ones; the closure
    holds OUTSIDE the generic group model via the information route, which
    neither existing closure does; and it leaves exactly 5 enumerated escape
    classes, of which 1 (E1, point-dependent curve constructions) is genuinely
    open and 4 are routed to named sibling proposals.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the independence argument is correct -- it is elementary and I have
    written it out. 0.7 that all eight named oracles survive the Step 4
    smuggled-handle audit as genuine members; the summation-polynomial evaluation
    oracle is the one I would bet against, because the form its lane actually
    wants takes x(R) and is therefore a composite. 0.85 that the estimator passes
    both control directions. Overall the expected outcome is a clean closure over
    seven or eight oracles with one open descendant (E1), which is a closure at
    the section 4 standard rather than a fatigue report -- and the single most
    valuable line in it may be the trace-one collision, which limits what the
    closure means and is stated before anyone can be surprised by it.

