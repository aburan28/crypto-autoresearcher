  confounders:
    - The overlap term uses the measured p; p differs between bases and cells, so o_j is computed per arm, never copied.
    - At n = 17 the sumset is dense (about one decomposition per target), so rho_j has small absolute size and the exact error matters; n = 19 at l = 10 is the sparser replicate.
    - The 2-torsion and parity structure (cofactor 2 at K17, 4 at K19) changes which pair sums land in G; the census marks G directly and does not model it.
    - One V per cell; the random V' is one draw; conclusions are about the named bases.

  interpretation_limits:
    - Toy tier; m = 2; two Koblitz cells; nothing about m >= 3, about cost, or about ECC2K-130 beyond the overlap arithmetic and the constant inside the per-attempt budget.
    - Proposition T needs b in F_2; on ordinary curves the conjugate attempt lives on the conjugate curve and nothing here applies.
    - Proposition Sigma is stated for subspace bases at prime n; orbit-union bases have the orbit symmetry, priced cost-neutral by KN-FIND-47da4e at m = 2 (unverified) and not re-measured here.
    - KN-OPEN-020 class of V is the scoped-out linear-subspace class; not escaped.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Overlap equality.) Beyond the pairs with both legs in
        F_{V cap sigma^{-j} V}, membership of R in S and in sigma^{-j} S is
        independent, so rho_j equals the overlap term o_j.
      rigorous_support: >-
        The inclusion of the intersection sumset in both S and sigma^{-j} S is
        exact and gives the lower bound. The equality imitates the random-map
        model of Semaev 2015 section 4.3 (KN-LIT-fa346d) for the sumset, under
        which two sumsets over near-disjoint bases behave as independent
        random subsets of G.
      validation_plan: >-
        SAMPLE: all of G at both cells (no sampling); COMPARE rho_j to o_j
        with the exact binomial error; TAIL: the largest excess over all j and
        both cells, and the same statistic on V' and on the null curve.
        TRANSFER: the ECC2K-130 figure 2^{-64} is arithmetic under H1 at
        (4, 33) and is labelled so.

  heuristic_note: Propositions T and Sigma are exact; H1 is the equality half of a one-sided bound and is the object of the measurement.

