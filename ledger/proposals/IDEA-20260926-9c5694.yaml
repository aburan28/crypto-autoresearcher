  assumptions:
    - >-
      Koblitz siblings y^2 + xy = x^3 + a x^2 + 1 over F_2[t]/(t^17 + t^3 + 1)
      (a = 1, order 2 x 65587 per the 77bf31 review, re-counted in the run) and
      over F_2[t]/(t^19 + t^5 + t^2 + t + 1) (a = 0, order 4 x 130873,
      re-counted). The odd-order subgroup G has prime order r with n | r - 1
      (65586 = 17 x 3858; 130872 = 19 x 6888, checked by hand), so every
      nonzero orbit has exactly n points.
    - >-
      V = {deg < l} in the polynomial basis (NOT Frobenius-stable at either n
      for these l; at n = 17 a 9-dimensional stable V also exists and is the
      positive control of 917981, not used here). Frobenius conjugation of x_R
      is computed by field squaring; no normal basis is required by the census.
    - Satisfiability at m = 2 is decided by exhaustive sumset enumeration, never by a closure.
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; F6 only as the named operation
      set; V inside KN-OPEN-020's scoped-out class.

  proof_search_map:
    bottleneck: >-
      Whether the n conjugate attempts of one target over a non-stable V carry
      correlation beyond the base-intersection overlap term (E-EXTRA), which
      would be a Koblitz-specific coupling between attempts and the only thing
      on this seam that could be worth more than the known 1/n; and whether any
      elimination work is shareable across conjugates beyond the affine-family
      retention (T4 says no, by proposition).
    baseline_embedding:
      parameter_slice: >-
        The stable-V case (917981 Proposition F; GGMP 1/n) is the exact slice
        where T reduces to the known result: on V_S = F_2 + ker g(sigma) at
        n = 17 the census must return label vectors constant on every orbit
        (rho_j = 1 for all j). This is the positive control and must reproduce
        before any non-stable number is read.
      reproduction_check: >-
        (i) Stable-V arm: concordance exactly 1.000 on all 3858 orbits.
        (ii) Proposition T checked by construction: for 10^3 sampled (R, j),
        decompose sigma^j R over V by enumeration and R over sigma^{-j} V by
        enumeration; the certified solution sets must correspond under
        sigma^{-j} exactly (T1). (iii) Lemma A2 check: no tuple decomposes both
        R and sigma^j R for j != 0 over the same V.
    observation_collision:
      observable: The orbit label vector L(R) and the lag-j autocorrelation rho_j over all of G.
      distinct_preimage_search: >-
        A nonzero rho_j could come from (i) the base intersection (overlap
        term), (ii) a curve-and-base coincidence beyond it (E-EXTRA), or (iii)
        a size or parity artifact of the sumset. (i) is computed before the
        run from d_j; (iii) is separated by a random 9-dimensional V' (whose
        d_j are generically smaller and computed the same way) and by the
        ordinary-curve null where T fails; only (ii) survives both.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The same census on four bases (polynomial V, stable V_S, random V',
          and V on the ordinary curve with conjugate x_R as random-x targets);
          the fibre of rho_j over the overlap prediction.
        predicted_gain: Decides E-OVERLAP against E-EXTRA and confirms E-NULL; no cost gain.
      - transform: representation_reduction
        proposed_object: >-
          Replace "orbit system solved once" by "one target over n conjugate
          bases" (Proposition T), which reduces the sharing question to the
          affine-family retention already measured by 5d0b8e.
        predicted_gain: Zero beyond the known 1/n on a stable V; that is the content.
    quantifier_order: >-
      Proposition T: FORALL Koblitz E (b in F_2), FORALL V, FORALL x_R, FORALL
      j: exact. Proposition Sigma: FORALL prime n, FORALL subspace V of
      dimension between 2 and n - 2, FORALL R of prime order in G: the
      stabiliser is S_m. Empirical: FOR the two named cells and four bases, the
      rho_j are as measured (exact over all of G, no sampling).
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the n = 17 and n = 19 Koblitz siblings with V = {deg < l}, the
        conjugate attempts of every target have lag-j indicator correlation
        rho_j (exact), against overlap prediction o_j (computed), with
        concordance 1.000 on the stable control and rho_j = 0 within error on
        the ordinary-curve null; closure-label concordance along orbits as
        measured on 50 orbits." Nothing about m >= 3, about n = 131 beyond the
        2^{-64} overlap arithmetic, or about any cost.
      nearby_object_control: >-
        The ordinary RC-1 curve (A = 97044, B = 126251) where Proposition T
        fails (T3): conjugate x_R are targets on the wrong curve and rho_j must
        vanish; and the stable V_S where T collapses to the known 1/n.
    proof_obligations:
      - claim: Proposition T (F_2-coefficients of S_{m+1} for b in F_2; the recombination of equations is invertible).
        responsibility: correctness
      - claim: The overlap term is a lower bound on rho_j (pairs in the intersection base lie in both sumsets).
        responsibility: correctness
      - claim: Proposition Sigma (S_m is the full stabiliser at prime n on subspace bases).
        responsibility: strictness
      - claim: d_j computed by linear algebra agrees with the direct enumeration of V cap sigma^j V.
        responsibility: size
      - claim: The orders of both Koblitz siblings are re-counted in the run before use.
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: concordance of L(R) on the stable V_S at n = 17 (fraction of orbits with constant label)
      direction: same
      minimum_effect: 'exactly 1.000 (Proposition F / T2); any deviation voids the instrument.'
    - metric: rho_1 on V = {deg < 9}, n = 17 Koblitz a = 1, exact over G
