idea:
  id: IDEA-20260926-9c5694
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE 131 FROBENIUS CONJUGATES OF A TARGET OVER A NON-STABLE SUBSPACE V ARE
    131 ATTEMPTS OF ONE TARGET OVER 131 CONJUGATE BASES (Proposition T, Koblitz
    only): their decomposability indicators are correlated exactly through the
    overlap count 2^{2 dim(V cap sigma^j V) - 1}, nothing is shareable across
    them that is not shareable across random targets, and the sound symmetry
    group of one instance is S_m alone; an exhaustive orbit census on the n = 17
    and n = 19 Koblitz siblings with the ordinary curve as null
  class: control

  claim: >-
    CEILING FIRST. No arity row moves. The record bears on every arity only
    through the attempt generator (how targets are produced) and on ECC2K-130
    only as a constant inside the per-attempt budget of the product law
    (KN-FIND-aa2efc, unreviewed): the tau-conjugates of one target cost one
    normal-basis rotation each against one group addition for a W-translate
    walk, so at m = 4 they save at most about one group operation of a budget of
    about 2^4.4 (aa2efc) or about 2^11 (IDEA-20260926-4b65e3, a proposal), and
    the floors are untouched. Representation class R1 (the x-coordinate of the
    target and its normal-basis coordinate vector r); attack stage: relation
    collection, through the attempt mix and the attempt generator.

    PROPOSITION T (transport; exact, zero compute; needs b in F_2). Let E be
    y^2 + xy = x^3 + a x^2 + b with b in F_2 (a Koblitz sibling), V any
    F_2-subspace of F_{2^n}, sigma the 2-Frobenius, m arbitrary. Because
    S_{m+1} has F_2-coefficients, sigma^{-j}( S_{m+1}(x_1, ..., x_m, sigma^j x_R) )
    = S_{m+1}(sigma^{-j} x_1, ..., sigma^{-j} x_m, x_R). Hence the attempt
    "decompose sigma^j R over V" is, in the same Boolean coordinates v (read in
    the basis sigma^{-j}(basis of V) of sigma^{-j} V) and up to an invertible
    F_2-recombination of the n equations, the attempt "decompose R over
    sigma^{-j} V". CONSEQUENCES. (T1) The decomposability indicator satisfies
    chi_V(sigma^j R) = chi_{sigma^{-j} V}(R). (T2) On a Frobenius-stable V the
    n conjugate attempts are one attempt (the known GGMP 1/n, KN-LIT-0d9d28;
    IDEA-20260926-917981 Proposition F); on a non-stable V they are n attempts
    of ONE target over n DIFFERENT bases on the SAME curve. (T3) On an ordinary
    curve (b not in F_2) the same identity transports the attempt to the
    conjugate curve E^{(sigma^{-j})}, a different curve, which is why the
    ordinary curve is the null object here and why the RC-1 curve
    (B = 126251) cannot host a Frobenius test (review of IDEA-20260922-7ab503).
    (T4) Over a FIXED non-stable V, conjugate targets are just targets: the
    descended system is the affine family E(r) = E^0 + sum_j r_j E^j of
    IDEA-20260923-5d0b8e evaluated on the cyclic orbit of the coordinate vector
    r (a rotation in a normal basis), and any elimination work shareable across
    the n conjugates is shareable across any n targets; the retention that
    5d0b8e measures is the upper bound, and no orbit-specific sharing exists,
    because an automorphism of B carrying system(R) onto system(sigma R) exists
    iff sigma V = V (917981 Proposition B and F).

    PROPOSITION Sigma (the sound symmetry group; closes HOLD-R's lens at the
    proposition level). For R of prime order r > n in the odd-order subgroup,
    the stabiliser of ONE fixed-target instance inside the group generated by
    leg permutations, negation, and the Frobenius shift is exactly S_m: the
    shift is an equivariance (IDEA-20260906-a77711 Lemmas A1, A2, sigma R != R),
    negation is already quotiented by the x-only model, and translation of two
    legs by a rational 2-torsion point T preserves the base only if V is
    iota-stable, which at prime n holds for no subspace of index-calculus
    dimension (review of IDEA-20260922-29b1c5, ord_n(2) arithmetic). So the only
    equivariance-respecting symmetry breaking beyond m! is the orbit form, whose
    measured price is cost-neutral at m = 2 (KN-FIND-47da4e, unverified) and
    whose linear form is empty at n = 131 (IDEA-20260918-9abf42).

    THE ONE OPEN NUMBER, PRE-PRICED. Write S = (F_V + F_V) cap G for the m = 2
    sumset. By T1 the events {chi_V(sigma^j R)} over an orbit are the events
    {R in sigma^{-j} S}. Pairs with both legs in F_{V cap sigma^{-j} V} lie in
    both S and sigma^{-j} S, so the lag-j indicator autocorrelation along the
    orbit is bounded below by an OVERLAP TERM computable before any run:
    rho_j >= (2^{2 d_j - 1} / |G| - p^2) / (p (1 - p)) with d_j = dim(V cap
    sigma^j V) and p = |S| / |G| (H1 for the equality case). At n = 17, V =
    {deg < 9}, f = t^17 + t^3 + 1: sigma V = {q(t^2)} needs no reduction, so
    V cap sigma V = span{1, t^2, t^4, t^6, t^8} and d_1 = 5; the other d_j are
    linear algebra. At ECC2K-130 with V = {deg < 33} in the pentanomial basis,
    d_1 = 17 (no reduction below degree 131), and at m = 4 the overlap tuples
    2^{4 x 17} / 4! against |S| of order 2^{132} / 4! put the conjugate
    attempts' correlation near 2^{-64}: the free conjugates are independent
    attempts to that precision. THE THREE READINGS, decided by an exhaustive
    census. E-OVERLAP: measured rho_j equals the overlap term within its exact
    sampling error for every j (the base intersection is the whole
    correlation). E-EXTRA: rho_j exceeds the overlap term by more than 3 sigma
    at some j (curve structure beyond the base intersection couples conjugate
    attempts; the Koblitz-specific finding). E-NULL (ordinary curve, conjugate
    x_R on the wrong curve): rho_j within 3 sigma of 0 for all j.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x_R in F_{2^n}, its coordinate vector r in
    a normal basis, in which sigma is a rotation). Operation set Sigma = the
    cyclic group <sigma> acting on the odd-order subgroup G as the scalar mu of
    order n (a77711 setting; mu != 1 because G is not inside E(F_2)). TRACKED
    OBJECT: the orbit-indexed label vector L(R) = (chi_V(sigma^j R))_{j mod n},
    or its closure-label refinement (M_4 label, W_4 label)_j. TRICHOTOMY:
    PARTIAL-ACTION under Sigma. L propagates deterministically under sigma (a
    rotation of the vector) and under nothing else; it does not propagate under
    translation, and the record makes no translation claim. The block system of
    <sigma> on G is the set of orbits (IDEA-20260901-863e36), and L is a function
    on orbits up to rotation. LOSSY-PROJECTION TEST against Sigma: L discards
    everything about R except n bits (|G| / 2^n to one), the discard is
    Sigma-compatible (rotation), and it is lossy in the representation used (a
    normal-basis vector of n bits collapses to n indicator bits). It is not a
    change of coordinates because distinct orbits share label vectors. PRICE OF
    THE ONE OPEN NUMBER: canonicalising an orbit costs n rotations and a
    lexicographic minimum, the distinguished-point normalisation Bailey et al.
    already run (KN-LIT-661e97); the number priced here is the correlation
    rho_j, which sets the effective attempt count 1 / (1 - rho_1) that the
    review of IDEA-20260922-77bf31 names as the multiplier on the relation
    phase.
    WHY THE MEASUREMENT IS NOT A TAUTOLOGY. The overlap term is a lower bound
    derived from pairs inside V cap sigma^{-j} V; the census measures the whole
    correlation. The difference, if any, is carried by pairs (P_1, P_2) with
    legs in V whose conjugate sum also decomposes over V through legs NOT both
    in the intersection, a curve-and-base coincidence with no a-priori model,
    which is exactly what E-EXTRA would exhibit and E-OVERLAP would exclude.
    OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2): F2
    is the family; F6 (endomorphism orbit) is used as a component only as the
    named operation set; the factor base is the bounded-degree subspace inside
    KN-OPEN-020's scoped-out class, not escaped. What is added beyond F2 as
    filed: Proposition T with its b-in-F_2 hypothesis made explicit, the
    transport to conjugate bases as the reading of "what is shared" on a
    non-stable V, the pre-priced overlap correlation, and Proposition Sigma.

