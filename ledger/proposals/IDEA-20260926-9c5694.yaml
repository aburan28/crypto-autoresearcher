  citation_note: >-
    Propositions T and Sigma are this session's arguments assembled from the
    cited internal records; the only external pointer is recalled. d_1 = 5 at
    (n, l, f) = (17, 9, t^17 + t^3 + 1) and d_1 = 17 at (131, 33, pentanomial)
