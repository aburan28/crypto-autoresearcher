    - metric: rho_j for j = 2..8 against o_j from the computed d_j (both cells)
      direction: different
      minimum_effect: 'E-OVERLAP requires agreement at every j; a single j with excess > 3 sigma is E-EXTRA at that lag.'
    - metric: rho_j on the ordinary RC-1 curve with conjugate x_R as random-x targets
      direction: same
      minimum_effect: 'within 3 sigma of 0 for every j (E-NULL); a nonzero value is an artifact to localise before anything else is read.'
    - metric: M_4 and W_4 label concordance along orbits (50 orbits x n closures) on V, Koblitz n = 17
      direction: different
