      minimum_effect: 'of order 2^{-64}; a derived number labelled arithmetic, with d_1 = 17 re-derived in Stage 0.'

  minimal_test:
    design: >-
      CELLS. (K17) y^2 + xy = x^3 + x^2 + 1 over F_2[t]/(t^17 + t^3 + 1), G of
      order 65587, m = 2, l = 9, V = {deg < 9}; (K19) y^2 + xy = x^3 + 1 over
      F_2[t]/(t^19 + t^5 + t^2 + t + 1), G of order 130873, m = 2, l = 10,
      V = {deg < 10}. Both orders re-counted in the run. BASES per cell:
      polynomial V; stable V_S = F_2 + ker g(sigma) (n = 17 only, both octic
      factors of Phi_17); random V' of the same dimension (seeded); NULL CURVE:
      the RC-1 ordinary curve A = 97044, B = 126251 over the n = 17 field with
      the conjugates sigma^j(x_R) of its subgroup targets used as random-x
      targets. TARGETS: all of G (exhaustive; 3858 orbits at n = 17, 6888 at
      n = 19), no sampling. INSTRUMENT. experiments/EXP-CERTBIN-e94b27/impl/
      gf2n.py and curve.py (Field is fixed to n = 17 in gf2n.py; the n = 19
      modulus needs the constant parameterised, about 20 lines, as
      EXP-CERTBIN-060020 already did), oracles_rc1.py's oracle A generalised to
      the Koblitz coefficients, plus about 150 lines: the sumset census
      (enumerate F_V, all pair sums, mark G), orbit bookkeeping, d_j by linear
      algebra, and the exact autocorrelation. Optional closure arm: macaulay.py
      and closure.py on 50 orbits x 17 conjugates (M_4, W_4). Nothing
      `missing`; no external solver.
      PROCEDURE. (0) Zero-run: Propositions T and Sigma written out; d_j for
      j = 1..n-1 per base; the overlap prediction o_j as a function of the
      measured p; the ECC2K-130 overlap arithmetic at (4, 33). (1) Census of
      chi_V over G per base, per cell; label vectors per orbit. (2)
      Reproduction checks (stable arm concordance; T1 on 10^3 samples; Lemma A2
      on the same). (3) rho_j exact, compared with o_j; the null curve. (4)
      Optional: M_4 / W_4 per conjugate on 50 orbits, concordance. SEEDS: one
      recorded stream for V' and the closure-orbit subsample; everything else
      exhaustive. METRICS (units): concordance (fraction of orbits); rho_j
      (correlation coefficient, exact); o_j (predicted, dimensionless); d_j
      (dimension); p (fraction); closure-label concordance (fraction);
      certificate counts for any counted refutation. CONTROLS: stable V_S
      (positive control, concordance 1.000); random V' (shape null with its own
      d_j); ordinary-curve null (E-NULL); Lemma A2 check; no relabelled Z/NZ
      control because no group-structure claim beyond the scalar action of
      sigma is made, and that action is checked directly (T1). OUTCOME TABLE.
      POSITIVE (E-EXTRA on either Koblitz cell, absent on V' and on the null):
      conjugate attempts are coupled beyond the base intersection; the coupling
      is handed to a successor as the first Koblitz-specific attempt structure
      on a non-stable V, with review-adversarial before any cost reading.
      NEGATIVE (E-OVERLAP everywhere, E-NULL on the ordinary curve): the
      conjugates are independent attempts up to the computable overlap; the
      tau-generator is validated as a free, provably near-independent attempt
      generator; Proposition T's reading of "what is shared" (nothing beyond
      the affine family) stands; the seam item closes with a measured number.
      ARTIFACT (stable arm below 1.000, a T1 mismatch, a Lemma A2 violation, or
      an order re-count disagreeing): a proposition or the instrument is wrong;
      nothing else is read. FALSIFICATION THRESHOLD. E-OVERLAP falsified iff
      any rho_j - o_j > 3 sigma on a Koblitz cell; E-EXTRA falsified iff none
      does; E-NULL falsified iff the ordinary curve shows |rho_j| > 3 sigma.
      COST (estimate): implementation low to medium (about 170 lines plus the
      modulus parameterisation); compute minutes for both censuses (about
      2^17 pair sums per base), about 2 CPU-hours for the optional closure arm.
    controls:
      - Stable V_S positive control (concordance exactly 1.000).
      - Random V' of matched dimension with its own computed d_j (shape null).
      - Ordinary RC-1 curve with conjugate x_R as random-x targets (Proposition T fails there; E-NULL).
      - Proposition T checked on 10^3 (R, j) samples by two enumerations; Lemma A2 checked on the same.
      - Orders of both Koblitz siblings re-counted before use.
    required_metrics:
      - concordance per base and cell
      - rho_j exact, and o_j predicted, per base, cell and lag
      - d_j per base and lag; p per base and cell
      - closure-label concordance along orbits (optional arm), with certificate counts
