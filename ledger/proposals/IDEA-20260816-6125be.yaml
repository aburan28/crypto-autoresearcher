idea:
  id: IDEA-20260816-6125be
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: Are the two published measures actually one measure? Compute the rank correlation between
    the optimal-differential and optimal-linear orderings of the whole SIMON32 rotation-constant space,
    track how that correlation moves with round count, and isolate the triples the two measures disagree
    about most, since only there can jointly optimal be distinguished from optimal on two measures.
  class: measurement
  claim: '(A) The RQ poses jointly optimal versus optimal on the two published measures as two distinguishable
    hypotheses. That distinction is only meaningful if the measures are not redundant: if the differential
    ordering and the linear ordering of the constant space agree almost perfectly, then jointly optimal
    on both is nearly the same set as optimal on either, no evidence can separate the hypotheses,
    and the campaign should say so before spending compute on a third measure. (B) The claim is that
    measure redundancy is directly computable as a rank correlation over the constant space, that
    it is a function of round count rather than a single number, and that it must be reported before
    any joint-optimality claim is made. Concretely: compute Kendall tau between the differential ordering
    and the linear ordering of the orbit representatives at each round count r, producing a curve
    tau(r) rather than a scalar. (C) The claim predicts a specific shape rather than merely a value:
    tau(r) should be low at very small r, where both measures are dominated by local structure and
    ties are pervasive, rise as trails lengthen and the AND coupling geometry starts to dominate both,
    and then collapse toward undefined as r grows and both measures saturate at their ceilings with
    mass ties. The interesting region is the middle, and the deliverable is its location and width.
    (D) The claim further identifies the disagreement set: the triples with the largest absolute rank
    difference between the two orderings are the only points where a joint-optimality hypothesis has
    any leverage, and their identity, their count, and whether the standardized triple is among them
    are the operational outputs. (E) NOT CLAIMED: that either ordering is correct, which depends on
    the weight oracles validated elsewhere; that any triple is optimal or anomalous under either measure;
    that a high tau means the measures are the same measure, since two measures can agree on order
    and differ sharply on margin; any statement about what prior work computed; and no attack, distinguisher
    or security consequence.'
  mechanism: 'STAGE A, obtain orderings: for each orbit representative of the rotation-constant space
    at the chosen word size, compute the optimal differential trail weight and the optimal linear
    trail correlation weight at each round count r from 1 up to the largest r the budget reaches,
    using validated weight oracles and a Matsui-style depth-first search with a memoized per-round
    lower-bound table. Every cell is recorded as either an exact optimum or a censored lower bound
    with its budget, and censored cells are excluded from tau with the exclusion count reported, never
    silently imputed. STAGE B, compute tau: at each r, compute Kendall tau-b, which handles the heavy
    ties these integer-valued measures produce, between the differential and linear orderings over
    the uncensored representatives, with a bootstrap confidence interval over resampled representatives.
    STAGE C, shape fit: report tau(r) as a curve with its maximum, the r at which the maximum occurs,
    and the r at which the number of distinct values in either ordering falls below a declared resolution
    floor, marking where tau stops being meaningful. STAGE D, disagreement set: rank representatives
    by absolute rank difference between the two orderings, report the top decile explicitly, and record
    whether the standardized triple lies inside or outside it, with its exact rank difference. STAGE
    E, null arms in the same invocation: a label-shuffled null, where one ordering''s labels are permuted,
    giving the tau distribution under independence; and a random-constant-family null, where the identical
    pipeline runs on structurally matched ciphers with uniformly drawn triples, giving the tau the
    two measures produce when there is nothing designed to find.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments, returning nothing;
      grep -ril 'rank correlation' over ledger/proposals and knowledge, with the title blocks of IDEA-20260808-71c2b2,
      IDEA-20260807-dbb250 and IDEA-20260805-15258a inspected; grep -ril 'Kendall' over ledger; grep
      -ril 'division property|impossible differential' over ledger/proposals to map which areas own
      those measures; read RQ-SIMSPK-f6a6c0 and GOAL-SIMSPK-001 in full, both of which name jointly
      optimal versus optimal-on-two-measures as the target distinction; read KN-LIT-5292.
    results: 'No prior proposal under this question. The rank-correlation hits are all in other domains:
      IDEA-20260808-71c2b2 concerns overshooting the Aubry-Oyono-Vincent degree bound in an ECDLP
      context, and the other hits sit in the ECDLP and lattice areas; none computes a correlation
      between two cryptanalytic measures over a cipher parameter space. IDEA-20260815-ad4b55 is the
      closest methodological neighbour in spirit, measuring the spread of solving degree across monomial
      orders before fitting a scaling law to one of them, which is the same discipline of measuring
      instrument disagreement before trusting an ordering, applied to Groebner bases rather than to
      trail bounds. RQ-SIMSPK-f6a6c0 states the jointly-optimal distinction as a target but does not
      state how the two hypotheses would be separated, which is the gap this proposal fills.'
    verdict: 'UNVERIFIED. No claim is made about what any external publication computed. Assembled
      from known parts: Kendall tau-b is standard, Matsui-style trail search is standard, bootstrap
      confidence intervals are standard, and label-shuffled nulls are standard. Claimed new only as
      a combination and only as a precondition for this campaign: that measure redundancy across the
      constant space is computed and reported as a curve in round count before any joint-optimality
      claim is entertained, that the disagreement set is named explicitly as the only region where
      the two hypotheses can be separated, and that the resolution floor beyond which tau is meaningless
      is measured rather than assumed.'
  object_first_candidate:
    tracked_object: 'The rank pair of an orbit representative: the ordered couple (rank under the
      optimal differential measure at round r, rank under the optimal linear measure at round r),
      a point in the two-dimensional rank plane. What is followed is the DISAGREEMENT vector, that
      is the signed rank difference of each representative, and the object of interest is the joint
      distribution of those differences over the constant space rather than any single constant''s
      ranks.'
    lossiness: 'Genuinely lossy, and lossy in a specific way that matters. Passing from the pair of
      weights to the pair of ranks discards the margins entirely: two triples separated by one unit
      of weight and two separated by ten receive the same adjacent ranks. That discard is compatible
      with the operation of interest, which is comparing orderings, because Kendall tau is defined
      on orders and is invariant under any monotone transformation of either weight scale, so the
      projection loses precisely what an arbitrary choice of scale would have contributed and retains
      precisely what survives it. The cost is explicit and is stated in the interpretation limits:
      a high tau does not mean the measures agree on margin, only on order, and the campaign may not
      read one as the other.'
    propagation: 'The target operation here is not one cipher round but one increment of the round
      count r, and the object propagates under it: as r increases by one, each representative''s differential
      weight increases by at least the minimum single-round weight and its linear weight likewise,
      but not uniformly, so ranks reshuffle. One step of the operation therefore acts on the rank
      pair by a permutation whose deviation from the identity is the measurable quantity, and tau(r+1)
      versus tau(r) records how much of the ordering survived the increment. The mechanism producing
      the reshuffle is that long trails weight the AND coupling geometry differently from short ones,
      so triples whose advantage is local lose rank as r grows.'
    survival_score: 'Concretely: the rank-stability radius of a representative is the largest interval
      of consecutive round counts over which its differential rank stays within a declared band, and
      the aggregate survival score is the largest r_stable such that tau between the ordering at r
      and the ordering at r_stable exceeds 0.9. Beyond that the ordering computed at one round count
      carries no information about the ordering at another, and any campaign quoting a ranking must
      then state its round count as part of the claim rather than as a detail. The structure dissolves
      entirely at the resolution floor, the r at which the number of distinct weight values drops
      below a declared threshold and mass ties make tau undefined; that r is reported per measure
      per word size.'
  null_object_control: 'Two nulls, both run in the same invocation as the signal arm and through the
    identical pipeline. The primary null object is a family of structurally identical ciphers whose
    rotation triples are drawn uniformly at random from (Z/n)^3 with a recorded seed, scored by the
    same two oracles at the same round counts: this yields tau_null(r), the correlation the two measures
    exhibit when the constants carry nothing designed. For the signal arm to mean anything, tau_null(r)
    must be reported first and any claim about tau(r) must be stated as a difference from it, since
    a high tau on the real family is uninformative if the same tau appears on random constants. The
    secondary null is a label shuffle: permute the linear ordering''s labels within the real family,
    recompute tau over 1000 permutations, and report the resulting null band; the observed tau must
    lie outside that band for any statement of agreement to be made at all. If tau on the real family
    falls inside the shuffle band, the measures are uncorrelated at that round count and the joint-optimality
    distinction is maximally separable there, which is itself a positive and usable finding.'
  discriminated_from:
  - 'IDEA-20260815-ad4b55 measures the spread of Groebner solving degree across monomial orders before
    a scaling law is fitted to one of them. Same discipline of quantifying instrument disagreement
    before trusting a single ordering, different object entirely: monomial orders on polynomial systems
    versus two cryptanalytic measures on a cipher parameter space, and no rank correlation over a
    parameter space is computed there.'
  - IDEA-20260808-71c2b2 is an ECDLP degree-bound proposal that happens to match the rank-correlation
    grep; it shares no object, no operation and no instrument with this entry.
  - A plain ranking of constants under one measure, which is the incumbent practice this campaign
    would inherit, produces one ordering and no statement about whether a second ordering would agree.
    This entry's deliverable is the relationship between orderings and is empty if only one is computed.
  - Entry-level correlation between differential probability and linear correlation for a single fixed
    cipher, a standard textbook observation about duality of the two measures, concerns one function's
    tables. Here the correlation is taken across a parameter space at fixed round count, which is
    a different statistic with a different null.
  - KN-LIT-5292's recorded abstract mentions both differential and linear characteristics for SIMON
    variants but the record holds no numbers and does not state whether the two rankings were compared.
    This proposal makes no claim about that and treats any later recovery as a reproduction comparison.
  assumptions:
  - Validated weight oracles for both the differential and the linear measure exist before this contract
    runs; without them the orderings are orderings of oracle artifacts. This entry declares that dependency
    rather than assuming correctness.
  - Trail weights compose additively across rounds under the standard round-independence convention,
    which is carried as a named unverified convention and not tested here.
  - Kendall tau-b is the appropriate statistic given heavy ties in integer-valued weights; tau-a and
    Spearman rho are computed alongside as robustness checks rather than substituted.
  - Censored cells, where the search hit its budget, are missing not at random and are excluded rather
    than imputed, with the exclusion count and its correlation with weight reported.
  - Orbit representatives from the symmetry-quotient contract are used where available; if that contract
    has not run, the raw grid is used and the multiplicity distortion is named explicitly in the record.
  predictions:
  - metric: Kendall tau-b between the differential and linear orderings over uncensored orbit representatives,
      at the round count maximizing it
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a value: the campaign has no prior measurement
      of either ordering, so any number named now would be invented. What is pre-committed is that
      tau(r) is reported as a curve with a bootstrap interval at every r, that tau_null(r) from the
      random-constant family is reported first, and that only the difference tau minus tau_null is
      interpreted.'
  - metric: tau(r) on the real family minus tau_null(r) on the random-constant family, at the same
      r
    direction: different
    minimum_effect: 0
  - metric: position of the maximum of tau(r) in round count
    direction: different
    minimum_effect: 'forced shape prediction: tau(r) is predicted to be non-monotone, rising then
      falling, with its maximum strictly interior to the reachable round range. A monotone tau(r)
      across the whole reachable range falsifies the shape claim in part (C).'
  - metric: size of the disagreement set, defined as representatives in the top decile of absolute
      rank difference, and whether the standardized triple lies in it
    direction: different
    minimum_effect: 'forced reporting rule rather than an effect size: the set is reported by explicit
      membership list with the standardized triple''s exact rank difference stated, whatever it is,
      and no threshold for calling it notable is set after the fact.'
  minimal_test:
    design: 'The cheapest discriminating measurement drops the round count and the word size to where
      both trail searches complete exhaustively. Fix word size n = 8, giving 512 triples or roughly
      100 orbit representatives, and round counts r = 1 through 6. At n = 8 the optimal differential
      and optimal linear trail can be found by exhaustive dynamic programming over all 2^{2n} = 65536
      state differences per round rather than by branch and bound, so both orderings are exact with
      zero censoring and the entire confound of budget-induced censoring is removed by construction.
      Compute tau-b at each r with a 1000-resample bootstrap, run the 1000-permutation label-shuffle
      null, and run 200 random-constant families through the identical pipeline. Total cost is roughly
      100 representatives times 6 rounds times 65536 transitions per measure, a few hundred million
      elementary operations, which is tens of minutes in pure Python and can be cut by an order of
      magnitude by restricting to representatives. The single number that discriminates is tau minus
      tau_null at the interior maximum: near zero means the two measures are as redundant on designed
      constants as on random ones and the joint-optimality distinction has no leverage anywhere; clearly
      nonzero locates where it does.'
    controls:
    - Random-constant family null, 200 uniformly drawn triples through the identical pipeline, reported
      before the signal arm.
    - Label-shuffle null, 1000 permutations of one ordering, giving the independence band for tau.
    - Exhaustive-search arm at n = 8, where no cell is censored, used to calibrate how much of any
      tau measured under branch-and-bound censoring at larger n is censoring artifact.
    - 'Tie-structure control: the number of distinct weight values per measure per round is reported
      alongside tau, since tau computed over an ordering with three distinct values is not a correlation
      in any useful sense.'
    - Alternative statistics, Spearman rho and tau-a, computed on the same data as a robustness check
      without substituting for the preregistered tau-b.
    required_metrics:
    - tau_b(r) with bootstrap confidence interval, per round count, real family
    - tau_null(r) with the same interval, random-constant family
    - label-shuffle null band for tau at each r
    - count of censored cells per measure per round, and the correlation between censoring and weight
    - number of distinct weight values per measure per round, the resolution metric
    - membership list of the top-decile disagreement set and the standardized triple's signed rank
      difference
    - wall-clock seconds and peak resident memory per stage
  falsification_conditions:
  - tau(r) on the real family lies inside the label-shuffle band at every reachable r, meaning the
    two orderings are statistically indistinguishable from independent and the premise that they might
    be redundant is refuted.
  - tau(r) minus tau_null(r) is within bootstrap noise of zero at every r, meaning whatever agreement
    exists is a property of the measures rather than of designed constants, which refutes the operational
    value of the comparison while remaining a clean controlled null.
  - tau(r) is monotone across the entire reachable round range, falsifying the non-monotone shape
    predicted in part (C).
  - The number of distinct weight values falls below the declared resolution floor at every reachable
    r, meaning tau is undefined throughout and the measurement cannot be made at this scale.
  - Censoring rate exceeds a declared ceiling and correlates with weight, in which case the ordering
    is a ranking of what the solver found easy and no tau computed from it may be interpreted; this
    is a budget outcome, reported as such.
  - tau computed under exhaustive search at n = 8 differs materially from tau computed under branch-and-bound
    at the same n and round counts, which invalidates the larger-n instrument.
  confounders:
  - 'Budget-induced censoring is the dominant confounder: harder constants time out more often and
    are exactly the ones with better bounds, so excluding them biases the ordering. The n = 8 exhaustive
    arm exists to quantify this, and a separate contract addresses it directly.'
  - Heavy ties in integer-valued weights inflate or deflate tau depending on the tie correction used;
    tau-b is preregistered and the tie counts are reported so a reader can recompute.
  - Using the raw grid instead of orbit representatives double-counts symmetric duplicates and can
    manufacture correlation from multiplicity alone; representatives are used where the quotient contract
    has run and the distortion is named where it has not.
  - Both orderings derive from oracles built by the same author in the same session, so a shared modelling
    error, for example a shared rotation-direction convention bug, would produce spurious agreement;
    the reflection control and independent implementations partially guard this.
  - Round counts reachable at n = 8 may be far below those at n = 16 or n = 32, so the location of
    tau's maximum measured at toy scale may not transfer, which is the subject of a separate transfer
    contract and is named here rather than assumed away.
  interpretation_limits:
  - A high tau means the orderings agree, not that the measures agree. Two measures can produce identical
    orderings and wildly different margins, and a margin claim may never be read off a rank correlation.
  - tau is a property of the constant space at a fixed round count and word size; it does not transfer
    across either without the separate transfer measurement, and quoting it without both is incomplete.
  - Neither the existence nor the absence of a disagreement set says anything about whether any constant
    is good. It says only where the two hypotheses named in the RQ could in principle be separated.
  - All results are conditional on the two weight oracles being valid, on the additive round-independence
    convention, and on the censoring rate reported; none of the three is established by this contract.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost: exhaustive dynamic-programming
      trail search is O(r 2^{2n}) per constant per measure, that is about r times 2^{16} at n = 8;
      branch-and-bound at n = 16 has no useful worst-case bound and is governed by the declared per-cell
      budget, which is why censoring is a first-class metric here.'
    memory_exponent: No attack memory exponent is claimed. The exhaustive arm holds one weight vector
      of 2^{2n} entries, 65536 at n = 8, under one mebibyte; the branch-and-bound arm holds a per-round
      lower-bound table of size 2^n and a search stack of depth r.
    best_known: The incumbent is single-measure ranking of the constant space, which produces one
      ordering and is silent on redundancy. As the corpus records it, KN-LIT-5292's abstract reports
      scoring variants against differential and linear cryptanalysis; whether the two rankings were
      compared is not recorded, and this proposal asserts nothing about it. No algorithmic frontier
      is contested.
    hidden_overhead: 'The lower-order term that dominates in practice is censoring bookkeeping: every
      cell must carry its budget and its censoring flag or the tau is uninterpretable, and retrofitting
      that onto a search that returned bare numbers is more work than writing it in. The human overhead
      is the resolution floor: deciding in advance how few distinct values makes tau meaningless,
      and holding to it after seeing a tempting number.'
  dominated_by: 'n/a (no result claimed). A real Pareto check was run over time, memory and data/queries:
    no attack, distinguisher or query procedure is produced, so there is no frontier row on any axis.
    As an instrument, exhaustive dynamic programming dominates branch and bound on exactness at every
    size where it fits in memory and is dominated on reach at every larger size; that crossover is
    reported.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    the curve tau(r) with its bootstrap band, the same curve on the random-constant null, and the
    signed difference between them at each round count, together with the exact size of the top-decile
    disagreement set. No time, memory or data figure is compared against any cryptanalytic frontier
    because none is produced.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that redundancy must be measured before the joint-optimality
    distinction is meaningful: 0.9, since it is a logical precondition rather than an empirical guess.
    Part (B), that tau is computable with usable resolution at reachable word sizes and round counts:
    0.6, with the main risk being that integer weights produce so few distinct values at small r that
    tau is dominated by ties; the n = 8 exhaustive arm will reveal this early and cheaply. Part (C),
    the non-monotone rise-then-collapse shape: 0.4, this is the most speculative part and a monotone
    curve would falsify it without damaging parts (A) or (B). Part (D), that a nonempty disagreement
    set exists and is stable enough to name: 0.55, dependent entirely on resolution. Part (E), that
    the difference tau minus tau_null is measurably nonzero: 0.35, since it is entirely possible that
    the measures correlate identically on designed and random constants, which would be a clean controlled
    null and a complete answer.'
