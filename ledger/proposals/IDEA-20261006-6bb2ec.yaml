idea:
  id: IDEA-20261006-6bb2ec
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Peak nonzero count of the S_3 Macaulay matrix is the generator support,
    or row reduction multiplies it by at least two
  class: measurement
  claim: >-
    For the same F_61, B = 8, m = 3 Semaev systems as the hit/miss control,
    the peak number of nonzero entries stored during grevlex linear algebra
    either stays within a factor of 2 of the peak count of a support-matched
    random system of the same generator support, or it is at least twice
    that random peak. The first reading means the memory term of a charged
    decomposition is the monomial support of S_3 and of the degree-B
    membership polynomial. The second reading means reduction fill-in, not
    the generator support, sets the memory term. Separately, the Semaev peak
    is at most half the peak of a dense random system with the same number
    of rows and columns and no forced zeros; a ratio above 1/2 falsifies
    the sparse-memory reading against the dense column bound. Representation
    class R1; attack stage is the linear algebra inside relation
    decomposition. No exponent is moved.
  mechanism: >-
    The tracked object is the peak nonzero count of the Macaulay matrix
    during elimination, written peak_nnz. Representation: R1, the
    coefficient array of the S_3 generators and the membership polynomials.
    Operation set Sigma: row operations of the declared solver on that
    matrix. Sigma is not group translation. Trichotomy class:
    coordinate-dependent, because peak_nnz is a function of the polynomial
    representation and of the elimination order, not of the discrete log.
    Lossy projection against Sigma: peak_nnz discards which columns are
    occupied and keeps one integer. Distinct matrices share a count, so the
    projection is lossy. The discard is compatible with Sigma as an
    accounting invariant of the elimination transcript: it is the memory
    quantity a charged cost model would multiply by the cost of a field
    operation. It is not a block system of translation. The priced open
    number is the ratio of Semaev peak_nnz to support-matched peak_nnz, and
    the ratio of peak_nnz to the nonzero count of the matrix before
    elimination. F2 is the named component. A factor-of-two separator
    distinguishes support-priced memory from fill-in-priced memory.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-0acb8c
      provenance: internal
      claim: >-
        The opened file is a bibliographic summary of a probabilistic
        analysis of Macaulay matrices and Groebner cost for overdetermined
        systems. The full text was not read. This idea uses the matrix as
        an object whose nonzero count can be measured, and it does not use
        the relayed polynomial-time bound.
      verified_by: knowledge/literature/KN-LIT-0acb8c.md
    - ref: KR-IC-0d2021
      provenance: internal
      claim: >-
        Recent work refines degree-of-regularity and solving-degree
        predictions. That row does not state a peak-nonzero law for
        prime-field S_3.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-0d2021.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 has degree 2 in each variable. That degree pattern fixes the
        generator support this measurement compares with a random system.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev index calculus does not beat generic
        methods under the assumptions of that row. Baseline only.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: KN-LIT-6917
      provenance: internal
      claim: >-
        The opened entry, superseded by KN-LIT-bba0c6 in its own header,
        relays an abstract claim that symmetrized summation polynomials
        built from torsion are sparse, in an extension-field setting. This
        idea does not construct those polynomials. The file marks the
        abstract as unverified beyond a bulk seed.
      verified_by: knowledge/literature/KN-LIT-6917.md
  assumptions:
    - >-
      Peak_nnz counts entries the solver stores during linear algebra,
      including fill-in, and initial_nnz counts entries before the first
      row operation. Both definitions are frozen in the transcript.
    - >-
      The support-matched null uses exactly the monomials present in the
      Semaev generators and the membership polynomials, with fresh nonzero
      coefficients in F_61.
    - >-
      The dense null has the same row and column index sets at the same
      degree, with every structural zero of the Semaev support filled by a
      uniform random coefficient.
    - >-
      No symmetrized summation polynomial and no torsion coordinate is
      introduced. The generators are the ordinary S_3 system.
  predictions:
    - metric: >-
        median over the eight F_61 targets of peak_nnz(S_3) /
        peak_nnz(support-matched)
      direction: different
      minimum_effect: >-
        a ratio in the closed interval from 1/2 to 2 supports the
        support-priced reading; a ratio of at least 2 supports fill-in as
        the memory term. A ratio below 1/2 is a third outcome, extra
        sparsity beyond the support, and falsifies both named readings.
    - metric: >-
        median of peak_nnz(S_3) / peak_nnz(dense)
      direction: lower
      minimum_effect: >-
        at most 1/2. A median above 1/2 falsifies the claim that the
        Semaev matrix is the sparse one relative to the dense column bound.
  minimal_test:
    design: >-
      Reuse the F_61, B = 8, eight-target S_3 systems of the hit/miss
      control, hits and misses pooled. For each target record initial_nnz
      and peak_nnz under the frozen grevlex solver. Build one
      support-matched random system and one dense random system at the same
      degree, solve them with the same solver, and record the same two
      counts. Report the two ratios and the ratio peak_nnz/initial_nnz for
      S_3.
    controls:
      - >-
        Support-matched random system, one per target, same support.
      - >-
        Dense random system, same rows and columns, no structural zeros.
      - >-
        If median peak_nnz(S_3)/initial_nnz(S_3) is at least 2, the initial
        support does not price the peak, and the support-matched comparison
        is interpreted only through peak counts, never through initial
        counts.
    required_metrics:
      - initial_nnz and peak_nnz for S_3, support-matched, and dense
      - median peak ratio versus support-matched
      - median peak ratio versus dense
      - median peak_nnz/initial_nnz for S_3
  falsification_conditions:
    - >-
      The support-matched peak ratio is strictly below 1/2 or strictly
      between 2 and infinity is not the only failure: a ratio strictly less
      than 1/2 falsifies both the factor-of-two fill-in reading and the
      within-factor-two support reading.
    - >-
      The dense peak ratio exceeds 1/2. The sparse-memory reading against
      the dense bound is false on this cell.
    - >-
      Peak_nnz/initial_nnz has median at least 2 while the support-matched
      peak ratio stays inside [1/2, 2]. Then support matches at the peak,
      and the initial generator is the wrong object to price. That outcome
      retires initial_nnz as the memory coordinate and keeps the peak
      comparison.
  confounders:
    - >-
      A solver that densifies the matrix in a preprocessing step makes
      every arm look dense. The initial_nnz of the dense arm must exceed
      the initial_nnz of S_3; otherwise the dense control was not built.
    - >-
      Coefficient cancellations over F_61 can zero entries that are
      structurally present. The support-matched arm has the same field, so
      it shares that cancellation rate only if its coefficients are uniform.
    - >-
      Pooling hits and misses can hide a fill-in gap that exists in only
      one class. The ratio is therefore also reported split by the hit/miss
      label when both classes have at least four members.
  interpretation_limits:
    - >-
      One prime and B = 8. A factor-of-two statement here is not a memory
      exponent for cryptographic parameters.
    - >-
      Peak_nnz is an implementation count for the declared solver. A
      different linear-algebra kernel can change it. The second build in
      the hit/miss control must be repeated for these counts before any
      comparison across codebases.
    - >-
      This does not propose a sparse algorithm and does not claim the dense
      Macaulay bound is avoided at large degree.
    - >-
      Symmetrized and torsion-based summation polynomials are a different
      object, foreclosed as a proposal by KR-IC-955fd6. They are not
      constructed here.
    - >-
      The base stays set-theoretic of size B, in the scoped-out class of
      KN-OPEN-020.
    - >-
      This measurement is not a Boolean-system algorithm and does not
      instantiate the Crossbred algorithm recorded in KR-IC-e847d1.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For uniform random nonzero coefficients on a fixed monomial support,
        at p = 61, the median peak_nnz equals the Semaev peak_nnz up to a
        factor of 2, whenever the only structure in the Semaev matrix is
        that support.
      rigorous_support: >-
        On a fixed support, a uniform nonzero coefficient specialisation
        preserves the structural zeros and randomises the rest. The
        expected number of initial nonzeros then equals the support size
        times (1 - 1/p). Fill-in under elimination is not given by that
        count. The assumption imitates the model "peak memory is determined
        by support plus a field-independent fill-in factor" and pairs it
        with the elementary initial-nonzero expectation. KN-LIT-0acb8c's
        relayed time bound is not an input; only the opened bibliographic
        summary was read.
      validation_plan: >-
        Draw 20 support-matched systems at p = 61, B = 8, m = 3, record
        peak_nnz, and compare their median with the Semaev median. Tail
        check: the maximum peak_nnz among the 20 divided by the median.
        Parameters stop at this cell. No transfer to other primes.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. This measurement does not replace rho memory or the
      van Oorschot-Wiener interpolation. A factor-of-two change in a toy
      matrix count is not a memory exponent.
    best_known: >-
      Pollard rho at Theta(N^{1/2}); KR-IC-5931ee is the prime-field Semaev
      comparison under its stated assumptions.
    hidden_overhead: >-
      None claimed. Fill-in, if it dominates, is reported as a measured
      factor on one cell rather than folded into an o(1) term.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. The datum is a ratio of nonzero
      counts at toy size.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
