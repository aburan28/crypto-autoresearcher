  dominated_by: >-
    Pollard rho at Theta(N^{1/2}) group operations, checked against
    KR-IC-5931ee. No attack result is claimed. A factor-of-two matrix count
    does not change that baseline.
  sota_delta: >-
    Exponent delta is 0 against Theta(N^{1/2}) time and against polylog rho
    memory. The separator is a peak_nnz ratio inside [1/2, 2] versus a
    ratio of at least 2, against the support-matched arm, at p = 61, B = 8,
    m = 3, together with a dense-arm ratio at most 1/2.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        The support-matched peak_nnz is the baseline memory coordinate.
      reproduction_check: >-
        A second solver build reproduces peak_nnz on one frozen target.
    observation_collision:
      observable: peak_nnz
      distinct_preimage_search: >-
        Two targets may share a peak count. The collision is recorded and
        is not a discrete-log relation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: matrices with a given peak_nnz
        predicted_gain: none as an attack
    quantifier_order: >-
      Empirical median ratios on one declared cell. No attack quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this cell the median peak ratio lies in [1/2, 2], is at least 2,
        or is below 1/2.
      nearby_object_control: support-matched and dense random systems
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Memory-coordinate measurement. The two random matrices are the nearby
      objects.
