idea:
  id: IDEA-20260807-5126f4
  question_id: RQ-MONO-001
  added: '2026-08-07'
  title: DEC-20260804-4f37d5 proved the Semaev cover's monodromy is C_2^{m-2} -- much SMALLER
    than symmetric, which under KN-OPEN-009's own framing is the EXPLOITABLE branch -- then disposed
    of exploitability in one clause with no argument, no cost model and no measurement; price
    the multiquadratic resolvent as a factor-base membership TEST
  class: algorithm
  claim: 'DEC-20260804-4f37d5 records that the splitting field of S_m in x_1 over F_p(x_2..x_{m-1},
    c) has Galois group C_2^{m-2}, universally, with no exceptional locus, and sets kn_open_009_disposition:
    CLOSED. IDEA-20260805-cf2d5a states the same (Z/2)^{m-2} result independently. KN-OPEN-009
    is two-sided: a monodromy SMALLER than symmetric is ''a block system exploitable by resolvent
    decomposition''. The decision disposes of that branch in one clause -- ''mirrors the recursive
    resultant structure (already known), not a new exploitable block system'' -- carrying no evidence_refs,
    no experiment id and no run. Nobody has priced what a C_2^{m-2} cover BUYS. GOAL-MONO-001''s
    own committed next_action says the opposite of the closure: ''carry forward only its imprimitivity
    half, which at m >= 4 has deg_T = 2^{m-2} >= 4 and IS non-degenerate''. And knowledge/open-problems/KN-OPEN-009.md
    still reads status: open and still asserts ''Generic curves are EXPECTED to have full symmetric
    monodromy'', which the closure''s own result contradicts.'
  mechanism: 'A C_2^{m-2} Galois group means the degree-2^{m-2} root-finding problem for x_1 decomposes
    as a tower of m-2 quadratic extensions. On the PARTIAL LOCUS -- fix m-2 factor-base coordinates
    and leave one free, which is where relation search actually operates and where complete splitting
    by the group law does NOT apply -- deciding whether a root lies in the factor base may then
    reduce to m-2 quadratic-character (Legendre symbol) tests instead of a degree-2^{m-2} root-find.
    Legendre symbols cost O(log p) each. The question is a field-operation count: compare (a)
    the m-2 sign/quadratic-character conditions of the C_2^{m-2} descent against (b) the enumerate-and-test
    and Groebner formulations already costed in IDEA-20260806-9d47e2, on the same toy ladder.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/decisions
    - knowledge
    grep_results:
    - IDEA-20260805-cf2d5a establishes the group and stops there; it prices no algorithm.
    - DEC-20260804-4f37d5's two owed KN-FIND promotions were never made (recorded as owed_promotions
      after the DEC-20260805-7b3e91 repair).
    - EXP-MONO-12ce1c and EXP-MONO-c819ba are unrun; GOAL-MONO-001 is paused on exhausted budget.
    conclusion: No record prices the resolvent as a membership test.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: the RELATION-RATE half of
      KN-OPEN-009, which IDEA-20260805-a9a95d has already reframed as a character-bias question
      and which this record does not touch. The object here is the IMPRIMITIVITY half only.'
    tracked_object: The tower of m-2 quadratic conditions that a factor-base root must satisfy,
      tracked as a bit-vector in {0,1}^{m-2}.
    one_step_propagation_rule: Descending one level of the tower fixes one more quadratic character;
      the bit-vector extends by one entry, deterministically given the level's discriminant.
    newness_score: As mathematics, low -- multiquadratic descent is classical. As an algorithm
      in this corpus, the resolvent has never been costed as a membership predicate on the partial
      locus.
  lossy_projection_identifiability_audit:
    projection: the root x_1 -> its bit-vector of quadratic characters in the tower.
    what_is_discarded: The root's value; only its position in the C_2^{m-2} orbit is retained.
    is_it_only_a_change_of_coordinates: 'NO -- 2^{m-2} roots map to m-2 bits, and distinct roots
      share a bit-vector. Honest caveat: factor-base membership is a condition on the root''s
      VALUE (x < t), not on its Galois orbit, so the bit-vector can only ever be a FILTER, not
      a decision procedure. If the filter''s false-positive rate is not substantially below 1,
      it buys nothing, and that rate is the first thing to measure.'
    mirror_failure_check: CHECKED. The failure would be a filter that passes everything. On the
      FULL locus the fibre splits completely by the group law and every bit-vector is realised,
      so the filter is vacuous there -- which is why the record is scoped to the PARTIAL locus,
      and why the vacuity check on the full locus is the primary null.
  null_object_control:
    primary_null: THE FULL-LOCUS VACUITY CHECK. Run the same filter where the summation fibre
      splits completely; the false-positive rate MUST be ~1 and the filter MUST buy nothing. If
      it appears to help there, the implementation is wrong.
    secondary_nulls:
    - 'RANDOM-SUBSET NULL: a factor base defined by a random x-subset of the same size, on which
      the filter''s false-positive rate should match the interval factor base''s if the saving
      is generic.'
    - 'COST GATE: report the resolvent route''s total field operations INCLUDING computing the
      tower''s discriminants, not only the Legendre symbols.'
  assumptions:
  - The C_2^{m-2} tower is constructible explicitly at m = 4 and 5 on toy curves.
  - The partial locus is where relation search operates, as GOAL-MONO-001's next_action states.
  predictions:
  - metric: false-positive rate of the m-2 character filter on the partial locus
    direction: lower
    minimum_effect: Below 1/2 at m = 4, i.e. the filter removes at least half the candidates before
      any root-find.
  - metric: field operations per membership decision, resolvent versus enumerate-and-test
    direction: lower
    minimum_effect: A ratio below 1 at m = 4 and 5, reproduced at three primes.
  minimal_test:
    design: At m = 4 and 5 on toy prime-field curves at three primes, build the explicit quadratic
      tower, measure the filter's false-positive rate on the partial locus, and count field operations
      for the resolvent route against the enumerate-and-test and Groebner routes of IDEA-20260806-9d47e2.
      Run the full-locus vacuity check first.
    controls:
    - full-locus vacuity null
    - random-subset factor base
    - matched enumerate-and-test baseline
    required_metrics:
    - false-positive rate per m and per locus
    - field operations per decision per route
    - tower construction cost, charged separately
  falsification_conditions:
  - 'Filter false-positive rate is ~1 on the partial locus too: the imprimitivity buys nothing,
    and the program gets its first ARGUED (not asserted) closure of KN-OPEN-009''s second half.'
  - 'Resolvent field-operation count is at or above enumerate-and-test at every m: the decomposition
    is not a cheaper predicate.'
  - 'The full-locus vacuity check does not fire: the implementation is wrong and nothing is admissible.'
  confounders:
  - Tower construction cost can dominate at small m and must not be amortised away without stating
    the amortisation model.
  - Legendre-symbol cost is O(log p) but with a constant that matters at toy sizes.
  - The partial locus is parameterised by which m-2 coordinates are fixed; results may depend
    on that choice and must be reported per choice.
  interpretation_limits:
  - Toy scale, m <= 5. No cryptographic-scale claim.
  - A cheaper membership predicate affects the RELATION-COLLECTION constant, not the exponent.
    FINDING-PF-IC-001 says the linear-algebra stage dominates, so even a favourable result is
    a constant-factor claim.
  - This record does not change KN-OPEN-009's status; superseding that entry is a knowledge-curation
    act.
  heuristic_assumptions:
  - id: HEUR-MONOIMP-1
    statement: The false-positive rate measured at m = 4, 5 on toy primes is indicative at larger
      m and p.
    rigorous_support: None. The rate is in principle computable from the tower's structure and
      should be derived alongside the measurement.
    validation_plan: Derive the predicted rate in closed form and check the measurement against
      it; a mismatch is a result.
  target_complexity:
    time_exponent: No exponent claim. Targets the relation-collection constant.
    memory_exponent: Unchanged.
    best_known: Enumerate-and-test / Groebner membership as costed in IDEA-20260806-9d47e2.
    hidden_overhead: Tower construction and discriminant computation.
    tradeoff_note: A constant-factor win in a stage that does not dominate is explicitly low-leverage,
      and the record says so.
  dominated_by: 'Pollard rho at exponent 1/2 for the end-to-end problem. Rows checked across time,
    memory and data/queries before writing: Pollard rho (p^{1/2}, O(1) memory); BSGS (p^{1/2},
