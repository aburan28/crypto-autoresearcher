idea:
  id: IDEA-20260811-ae0f6f
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-c439c2
  axis: A4
  claim_tier: toy
  title: >-
    THE BEZOUT FIXED POINT -- the exact crossover inequality for prime-field
    index calculus, and it says the arity is a free parameter that changes
    NOTHING. Writing C(L,m) for the cost of one arity-m decomposition attempt
    over a base of size L, the known-log method costs
    T(L) = L + m!*N*C/L^m, minimised at Theta((N*C)^{1/(m+1)}), so it beats
    0.886*sqrt(N) IF AND ONLY IF C < N^{(m-1)/2}; and if C equals the search-space
    size L^{m-1} that IDEA-20260807-070d03's degree fact forces, the optimum
    lands at L = Theta(sqrt(N)) and T = Theta(sqrt(N)) EXACTLY, for every m >= 2.
    Prime-field index calculus therefore sits on rho as a FIXED POINT rather than
    below it, the exponent is independent of the arity, and the single measurable
    quantity that decides the campaign is the ratio rho(L,m) = C_measured /
    L^{m-1} and its SCALING IN N -- not its dependence on factor-base structure,
    which is a different and already-filed question
  class: mechanism

  claim: >-
    (A) THE COST MODEL, WRITTEN OUT SO EVERY TERM IS CHARGED. Prime N, G = <P>,
    Q = [k]P. Base B = {B_1..B_L}. Write
      P_dec(L,m) = min(1, binom(L,m)/N) -- the probability a uniformly random
        target decomposes into m base elements (HA-1 below);
      C(L,m) -- the cost, in group-operation-equivalent units, of ONE attempt to
        decide-and-find a decomposition of a given target.
    TWO VARIANTS, and the campaign has been conflating them.
      VARIANT K (KNOWN-LOG BASE). The adversary picks a_i uniformly and sets
        B_i = [a_i]P, costing L group operations. ONE successful decomposition of
        R = [a]P + [b]Q suffices, since a + b*k = sum a_{i_j} and b is
        invertible. No linear algebra at all.
          T_K(L) = L + C(L,m) / P_dec = L + m! * N * C(L,m) / L^m.
      VARIANT U (UNKNOWN-LOG BASE, the classical shape). The base is obtained
        without knowing the logarithms -- free, by IDEA-20260811-a28c44's
        Theorem FB-1 -- so L+1 relations are needed and a sparse linear system of
        dimension L with m nonzeros per row must be solved.
          T_U(L) = m! * N * C(L,m) / L^{m-1} + Theta(m * L^2).

    (B) THEOREM B-1, THE CROSSOVER INEQUALITIES. Treat m as a constant and
    optimise over L.
      VARIANT K: dT_K/dL = 0 at L* = (m * m! * N * C)^{1/(m+1)}, giving
        T_K(L*) = Theta( (N*C)^{1/(m+1)} ). Hence
          T_K beats N^{1/2}  <==>  C < N^{(m-1)/2}.
      VARIANT U: dT_U/dL = 0 at L* = ((m-1) m! N C / (2m))^{1/(m+1)}, giving
        T_U(L*) = Theta( (N*C)^{2/(m+1)} ). Hence
          T_U beats N^{1/2}  <==>  C < N^{(m-3)/4},
        with the optimal base size then L* = Theta(N^{1/4}) -- which is exactly
        the size at which the linear-algebra term Theta(L^2) reaches sqrt(N), a
        consistency check the derivation passes rather than assumes.
      IMMEDIATE CONSEQUENCE, AND IT IS NOT FOLKLORE IN THIS PROGRAM: THE
      KNOWN-LOG VARIANT IS STRICTLY EASIER, by a factor N^{(m-1)/2 - (m-3)/4} =
      N^{(m+1)/4} in the permitted decomposition cost. The campaign has been
      reasoning about Variant U by default. Variant K is the one to price first.

    (C) THEOREM B-2, THE FIXED POINT, AND IT IS THE HEADLINE. Suppose the
    decomposition attempt costs its SEARCH SPACE:
      C(L,m) = Theta(L^{m-1}),
    which is what the naive-and-currently-best prime-field method costs -- fix
    x_1..x_{m-1} ranging over B^{m-1}, solve the summation polynomial
    S_{m+1}(x_1,..,x_{m-1}, X, x(R)) = 0 of degree 2^{m-1} for X, test membership
    -- and which is the operational form of IDEA-20260807-070d03's degree fact
    (a nonzero polynomial over F_p vanishing on L points has degree at least L,
    so no prime-field membership condition linearises). Then in VARIANT K the
    stationarity condition L^{m+1} = m*m!*N*C = m*m!*N*L^{m-1} forces
      L* = Theta(sqrt(N)),   C(L*) = Theta(N^{(m-1)/2}),
      T_K(L*) = Theta(sqrt(N))   EXACTLY, FOR EVERY m >= 2.
    The permitted threshold in B-1 is C < N^{(m-1)/2} and the achieved cost is
    C = Theta(N^{(m-1)/2}): THE METHOD LANDS ON THE THRESHOLD WITH EQUALITY. Not
    above it, not below it -- ON it. In VARIANT U the same substitution gives
    T_U = Theta(m! N + m L^2) >= Theta(N), i.e. a factor sqrt(N) WORSE than rho.
    SO: prime-field index calculus at the naive decomposition cost is a FIXED
    POINT of the birthday bound in the known-log form and a strict loss in the
    unknown-log form, and in neither case does the arity m appear in the
    exponent. That is a quantitative explanation of the campaign's own repeated
    observation that nothing moves, and it is an explanation rather than a
    summary because it names the one quantity whose change would move it.

    (D) THE ONE MEASURABLE NUMBER THE CAMPAIGN SHOULD CHASE, WHICH IS THE POINT
    OF THIS RECORD. Define the SEARCH-SPACE EFFICIENCY
      rho(L, m, N) := C_measured(L, m, N) / L^{m-1}.
    B-1 and B-2 together say: prime-field index calculus beats rho (the
    algorithm) if and only if rho (the ratio) decays as a NEGATIVE POWER OF N at
    the optimal L. Precisely, in Variant K it beats 0.886*sqrt(N) iff
    rho(L*, m, N) <= N^{-epsilon} for some epsilon > 0 at L* = Theta(sqrt(N)).
    CONSEQUENCES FOR SPENDING, stated as instructions the Coordinator can act on:
      (i) Measuring whether the solving degree depends on FACTOR-BASE STRUCTURE
        at matched size -- IDEA-20260807-070d03's Arms A/B/C -- answers a
        DIFFERENT question, namely whether rho depends on the choice of B. Even a
        clean positive there is worth only a constant unless rho also decays in
        N. Both measurements are needed and only this one is decisive.
      (ii) Increasing the arity m is worthless by itself. B-2 shows the exponent
        is m-independent at the naive cost, so a campaign that spends on larger m
        without moving rho is spending on nothing. This is a falsifiable
        prediction about the program's own roadmap.
      (iii) The right experiment is a PRIME LADDER at fixed m, measuring the
        exponent of rho in N, with the search-space count L^{m-1} computed
        exactly as the denominator. That is cheap, it has a pre-registered null
        (rho constant in N), and it is decisive in both directions.

    (E) WHAT IS NOT CLAIMED, STATED BEFORE A REVIEWER HAS TO ASK. It is NOT
    claimed that C = Theta(L^{m-1}); that is a HYPOTHESIS whose status is exactly
    IDEA-20260807-070d03's open quantity, and B-2 is a conditional. It is NOT
    claimed that no prime-field method achieves rho < 1; that is the open
    question and this record's whole purpose is to give it a number. It is NOT
    claimed that Groebner methods cannot beat enumeration -- they routinely do on
    structured systems, which is precisely why the ratio must be MEASURED rather
    than assumed. And nothing here is an attack: every inequality in this record
    is a condition under which an attack would exist, and the condition is not
    known to hold.

  resource_label: >-
    R1 (x-coordinates as field elements). C(L,m) is the cost of solving a system
    in x-coordinates subject to a membership condition, which is the R1
    consumption in its purest form. R2 (curve model) enters only through the
    constant 2^{m-1} in the summation polynomial's degree and is explicitly not
    load-bearing here, which is itself a scoping statement about lane L11.
  admissibility: admissible
  admissibility_argument: >-
    Admissible. No endomorphism is applied to any point of G; H-ENDO-001 is not
    used and not tested. KN-FIND-b7e091 is not revisited: this record does not
    adjudicate any oracle's simulability at all, it prices an algorithm. It takes
    the decomposition oracle's non-closure as GIVEN from
    IDEA-20260807-7270d1 and IDEA-20260811-ad0ff7 and asks the only question that
    remains once an oracle is not closed, which is what it costs.

  object_first_candidate:
    tracked_object: >-
      THE SEARCH-SPACE EFFICIENCY rho(L, m, N) = C_measured / L^{m-1}: the ratio
      of the measured cost of one decomposition attempt to the exact size of the
      space that attempt is searching.
    lossiness: >-
      GENUINELY LOSSY. Discarded: the solver, the monomial order, the Macaulay
      matrix, the field, the curve, the specific base, the summation polynomial's
      coefficients, and every intermediate degree. Retained: one dimensionless
      real number per (L, m, N) cell. Enormously many distinct algorithmic
      situations share any given rho, so the projection is not invertible and is
      not a change of coordinates. It is more lossy than the solving degree,
      which retains an integer with a known relation to the Macaulay dimension;
      rho retains only the ratio to the trivial baseline.
    propagation: >-
      DETERMINISTIC UNDER THE OPERATION THAT MATTERS, which is scaling the
      problem. Under L -> lambda*L at fixed m and N, the denominator scales by
      lambda^{m-1} exactly (it is a combinatorial count, not an estimate), so any
      change in rho is a change in the solver's behaviour and nothing else. Under
      N -> N' at fixed m and fixed L/sqrt(N), the cost model's optimum tracks
      deterministically by B-1. What is discarded -- everything about how the
      solve is performed -- is discarded COMPATIBLY with these two scalings,
      because neither scaling consults it. That is the inventor-protocol section
      2 condition, and it is why rho is trackable while "wall-clock" is not.
    survival_score: >-
      Survives change of solver (the ratio is defined against an
      implementation-independent denominator), change of curve, change of base
      construction, and change of arity. Dies at (i) L so small that binom(L,m)
      is coarse and P_dec is not in the asymptotic regime -- the toy-scale
      failure mode; (ii) solvers whose cost is dominated by memory rather than
      operations, where a single scalar cost is the wrong summary; (iii) the
      extension-field case, where the membership condition linearises and
      L^{m-1} is no longer the search space -- so rho is a PRIME-FIELD object by
      construction and must never be quoted across the boundary.

  mechanism: >-
    STEP 1 (zero compute) -- DERIVE T_K and T_U as in (A), charging every stage:
    base construction, attempts, per-attempt cost, and for Variant U the sparse
    linear algebra at Theta(m L^2). The linear-algebra term is the one most often
    omitted and its omission is what makes Variant U look better than it is.
    STEP 2 (zero compute) -- OPTIMISE and obtain B-1's two crossover
    inequalities, C < N^{(m-1)/2} and C < N^{(m-3)/4}, with the optimal L in each
    case, and check the Variant U optimum L* = Theta(N^{1/4}) against the
    independent constraint L^2 <= sqrt(N). They agree; that agreement is a check
    the derivation must pass.
    STEP 3 (zero compute) -- SUBSTITUTE C = L^{m-1} and obtain B-2's fixed point.
    THIS STEP IS THE PROPOSAL. If the substitution does not give T_K = Theta(
    sqrt(N)) exactly, the record is arithmetically wrong and ends here, at the
    cost of twenty minutes.
    STEP 4 (zero compute) -- BASELINE CHECKS. At m = 1, Variant K must reproduce
    IDEA-20260807-070d03's arity-1 result (optimum at the whole group, cost
    sqrt(N)/2, no factor base). At m = 2, check T_K and T_U against rho directly.
    At the extension-field slice, where the membership condition becomes n-1
    LINEAR conditions after Weil restriction and the search space is NOT
    L^{m-1}, check that B-2's conclusion correctly FAILS -- it must, or the
    argument would prove that Gaudry/Diem index calculus does not work either,
    which would falsify it outright. THIS IS THE SHARPEST AVAILABLE FALSIFIER AND
    IT COSTS NOTHING.
    STEP 5 (zero compute) -- WRITE (D) as an explicit spending recommendation
    with its pre-registered null.
    STEP 6 (toy compute, the experiment) -- THE PRIME LADDER. At fixed m = 3 and
    fixed L/sqrt(N), measure C by counting solver operations, compute
    rho = C/L^{m-1}, and fit its exponent in N across p in {2^14, 2^16, 2^18,
    2^20, 2^22}. Report the fitted exponent with its confidence interval, beside
    the pre-registered null of zero.

  why_not_a_renamed_known_approach: >-
    The nearest KNOWN external object is the standard index-calculus cost
    balance (relation-collection time against linear-algebra time), which is
    classical and is not claimed as new. Three things are claimed and none of
    them is that.
    FIRST, THE KNOWN-LOG / UNKNOWN-LOG SPLIT AND ITS SIZE. Classical index
    calculus is analysed almost exclusively in the unknown-log form because in
    the multiplicative group one cannot choose base elements by their
    factorisation. On an elliptic curve the adversary CAN build a base with known
    logarithms, at the price of giving up any control over the base's
    x-coordinates -- and the degree fact says that control is worthless anyway.
    The resulting factor N^{(m+1)/4} in the permitted decomposition cost is, so
    far as this corpus shows, not written down anywhere in the program.
    SECOND, THE FIXED POINT. That substituting the naive cost gives EXACTLY
    sqrt(N), with equality and for every arity, is a specific arithmetic
    coincidence with an explanation, and it converts "prime-field index calculus
    does not seem to work" from an observation into a statement with a mechanism
    and a threshold.
    THIRD, THE REDUCTION OF THE CAMPAIGN TO ONE MEASURABLE SCALAR AND ITS
    SCALING. IDEA-20260807-070d03 states that C is the open quantity; this record
    says what value of C would matter, in which variant, at which L, and what to
    measure instead of C itself (the ratio, and its exponent in N).
    EXTERNAL NOVELTY IS NOT CLAIMED and web search was unavailable this session.
    A published statement of the same threshold would be an INGREDIENT, not a
    disappointment, and a literature scout for one is Stage 0 of the design.

  predictions:
  - observable: the fixed-point arithmetic
    metric: T_K(L*) under the substitution C = L^{m-1}, computed symbolically for
      m in {2,3,4,5,6}
    direction: different
    predicted: exactly Theta(sqrt(N)) with an m-independent exponent, and
      L* = Theta(sqrt(N)) in every case. Any m-dependence in the exponent means
      the derivation is wrong.
  - observable: the extension-field falsifier
    metric: the same derivation with the membership condition replaced by n-1
      linear conditions after Weil restriction over F_{q^n}, so that the search
      space is NOT L^{m-1}
    direction: lower
    predicted: T must come out BELOW sqrt(N) for suitable (q, n, m),
      qualitatively reproducing the known extension-field advantage. IF THE
      DERIVATION ALSO SAYS EXTENSION FIELDS FAIL, IT IS WRONG, and this is the
      cheapest way to find out.
  - observable: search-space efficiency, measured
    metric: rho = C_measured / L^{m-1} at fixed m = 3 and fixed L/sqrt(N), over
      p in {2^14, 2^16, 2^18, 2^20, 2^22}, five seeds per cell, with C counted in
      field multiplications
    direction: different
    predicted: NULL PREDICTION, PRE-REGISTERED -- the fitted exponent of rho in N
      is 0 within its confidence interval, i.e. the Groebner solve buys a
      constant factor over enumeration and not a power. A fitted exponent below
      -0.05 that survives the seed spread and the arity control is the campaign's
      single most valuable possible outcome and triggers pause condition P3
      handling below.
  - observable: arity irrelevance
    metric: the fitted exponent of T_K in N at m in {3,4,5} with C measured
      rather than assumed
    direction: different
    predicted: identical within confidence intervals across m, i.e. no arity
      dependence in the exponent. A clean arity dependence falsifies B-2's
      m-independence and would mean the naive cost model is not what the solver
      does.
  - observable: variant separation
    metric: measured T_K versus T_U at matched (m, L, N) with the same measured C
    direction: lower
    predicted: T_K below T_U by a growing factor, with the gap's fitted exponent
      near (m+1)/4 in the regime where both are optimised. A gap that does not
      grow means the linear-algebra term is mischarged.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, about ninety minutes, HARD GATE, AND IT IS THE
      CHEAPEST VALID DISCRIMINATOR). Do the algebra of (A)-(C) and then run the
      EXTENSION-FIELD FALSIFIER of Step 4: redo the identical derivation with the
      linearised membership condition and check the conclusion flips. A cost
      model that condemns prime fields must exonerate extension fields, or it is
      condemning arithmetic rather than prime fields. This single check costs
      nothing, needs no curve, no solver and no run, and it is the only step that
      can kill the record cleanly.
      STAGE 1 (zero compute, 30 minutes). The m = 1 baseline slice against
      IDEA-20260807-070d03's arity-1 result, and the m = 2 slice against rho.
      Both must reproduce.
      STAGE 2 (toy compute, hours, and only after Stages 0-1 pass). The prime
      ladder measurement of rho at m = 3, with the exact enumeration count
      L^{m-1} computed as the denominator and the enumeration itself RUN as the
      matched null.
      STAGE 3 (zero compute). The spending recommendation of (D), written as a
      recommendation to the Coordinator and changing no status.
    controls:
    - >-
      NULL OBJECT (matched, blocking): THE ENUMERATION ARM. For every cell, run
      the naive enumeration over B^{m-1} with the same summation-polynomial solve
      and count its operations. This is the denominator, MEASURED rather than
      assumed, and rho is the measured ratio of the two arms. A rho computed
      against a theoretical denominator would be measuring the theory; measuring
      both arms in the same units on the same instances is what makes the ratio
      mean anything.
    - >-
      PLANTED SIGNAL (blocking, opposite direction): the F_{q^2} subfield factor
      base at matched total field size, where rho MUST be small and decaying,
      because the membership condition linearises. OUT OF CAMPAIGN SCOPE and
      labelled as such -- it is a control on the instrument and may never appear
      in a conclusion about prime fields. An instrument that cannot see this
      cannot see a decaying rho at all and every prime-field null it produces is
      void rather than negative.
    - >-
      SECOND PLANTED CONTROL: a base containing a KNOWN decomposition of the
      target. The solver must find it; a solver that misses a planted solution is
      broken and nothing from it is reported.
    - >-
      DECAY PARAMETER: L on the ladder {N^{1/4}, N^{1/3}, N^{1/2}, N^{2/3}} at
      fixed N. B-2 predicts rho is flat in L. A putative advantage that does NOT
      persist across the ladder, or that appears only at the smallest L, is the
      canonical small-instance artifact.
    - >-
      Hygiene: N prime, factored group order and largest prime factor
      (KN-TECH-030), #E != p (KN-TECH-033), identical solver configuration and
      monomial order across all arms, recorded.
    required_metrics:
    - rho = C_measured / C_enumeration per cell, with both arms in field
      multiplications
    - fitted exponent of rho in N, with confidence interval, against the
      pre-registered null of 0
    - solving degree, first-fall degree and Macaulay dimension per cell,
      reported alongside but never instead of the operation counts
    - measured T_K and T_U at matched parameters, both against 0.886*sqrt(N)
    - pass/fail of the planted decomposition and of the F_{q^2} arm
    - the exact integer L^{m-1} used as the denominator in every cell

  controls:
  - >-
    NULL OBJECT: the measured enumeration arm, which is the denominator of rho.
    Blocking.
  - >-
    PLANTED SIGNAL: the F_{q^2} subfield base, which must show a small and
    decaying rho. Blocking, and explicitly out of campaign scope.
  - >-
    SECOND PLANTED CONTROL: a planted decomposition the solver must find.
  - >-
    DECAY LADDER in L at fixed N, as the artifact test.
  - >-
    Matched Pollard rho with negation and matched BSGS on the identical
    instances, counted in the same unit, so that every T is quoted against a
    measured baseline rather than a formula.

  confounders:
  - >-
    C IS NOT ONE NUMBER. The cost of a decomposition attempt depends on L, m, N,
    the solver, the monomial order and the model. Writing C(L,m) as a scalar is a
    modelling choice; the record's own remedy is that the DECISIVE quantity is
    the dimensionless ratio rho, which cancels the units and much of the solver
    dependence, and that both arms are measured on the same instances.
  - >-
    THE LINEAR-ALGEBRA TERM. Variant U's Theta(m L^2) assumes sparse
    Wiedemann/Lanczos. A dense solve at L^omega changes the U threshold and makes
    Variant U look even worse. Quoting Variant U without its linear algebra is
    the most common way this accounting is got wrong, and it is why the record
    charges it explicitly.
  - >-
    TOY-SCALE ASYMPTOTICS. At p <= 2^22 the quantity binom(L,3)/N is coarse and
    the "optimum L" is a few dozen elements; fitted exponents over a five-rung
    prime ladder have wide confidence intervals and MUST be reported with them. A
    fitted exponent quoted without its interval is not evidence.
  - >-
    ENUMERATION IS NOT ALWAYS THE RIGHT DENOMINATOR. For very small L the
    enumeration is faster than any algebraic method and rho > 1; that is a
    small-instance regime and not a refutation. The L ladder exists to separate
    the two.
  - >-
    SCOPE LEAKAGE FROM THE F_{q^2} ARM. It is over an extension field, outside
    this campaign's declared scope, and is a control on the instrument only. This
    is a documentation risk and it is the most likely way this record is misread.
  - >-
    ATTRIBUTION OF A MEASURED GAIN. A decaying rho could come from the solver
    exploiting the SUMMATION POLYNOMIAL'S structure (interesting) or from the
    solver exploiting a small-p degeneracy (not interesting). The prime ladder
    plus the seed spread is the only way to tell, and the record does not
    interpret a single cell.

  falsification_conditions:
  - >-
    THE EXTENSION-FIELD FALSIFIER FAILS -- the identical derivation with
    linearised membership conditions also condemns extension fields. The cost
    model is wrong and the record dies at Stage 0, for ninety minutes and no
    compute. THIS IS THE INTENDED CHEAP DEATH AND THE FIRST THING A REVIEWER
    SHOULD RUN.
  - >-
    The m = 1 slice does not reproduce IDEA-20260807-070d03's arity-1 result, or
    the m = 2 slice does not reproduce rho. The baseline embedding fails and the
    derivation is not a family extension of what the program already has.
  - >-
    The substitution C = L^{m-1} does not give T_K = Theta(sqrt(N)) exactly, or
    gives an m-dependent exponent. B-2 is arithmetically wrong.
  - >-
    Measured rho has a fitted exponent in N below -0.05, surviving the seed
    spread, the L ladder and the planted controls. THE CONDITIONAL IN B-1 IS
    SATISFIED AT TOY SCALE. GOAL-ENDO-001 PAUSE CONDITION P3 APPLIES: the excess
    is NOT to be stated in any record. Flag it, stop, and hand it to the
    Coordinator for an independent review-adversarial session. This record
    contains no such number and this clause exists so that a future one does not
    either.
  - >-
    The F_{q^2} planted arm shows no small or decaying rho. The instrument cannot
    see the effect it is looking for; every prime-field null it produces is VOID
    rather than negative (AGENTS.md rule 3, RQ-INSTR-f8faa0).
  - >-
    The planted decomposition is not found. Solver broken; nothing is reported.
  - >-
    Groebner computations exceed the time or memory budget before any cell
    resolves. INFRASTRUCTURE outcome under AGENTS.md rule 3, recorded as such and
    never as evidence about decomposition cost.

  interpretation_limits:
  - >-
    B-2 IS A CONDITIONAL. It assumes C = Theta(L^{m-1}), which is a hypothesis
    about solver behaviour, not a theorem. Anyone citing this record as "prime-
    field index calculus is proved to be no better than rho" has dropped the
    hypothesis and inverted the record's meaning.
  - >-
    Nothing here is an attack and no speedup is claimed. Every inequality is a
    CONDITION under which an attack would exist, and no condition is known to
    hold.
  - >-
    The record says nothing about phi-stable or otherwise structured factor
    bases. rho is defined for an ARBITRARY base and the derivation uses no
    property of B beyond its size, which is exactly the mechanism H-STR-002's
    weaken (DEC-20260727-009) did not touch: the weaken concerned equivariance of
    a structured base, and this record concerns the scaling of a solver cost
    against a combinatorial count for any base at all. THE RECORD IS THEREFORE
    NOT P2-ADJACENT IN THE AUTHOR'S JUDGEMENT, but because the object is a factor
    base the judgement is flagged for the Coordinator to route rather than
    assumed. DEFER-BATCH009-001 remains open and unretracted and nothing here
    discharges it.
  - >-
    Toy scale only for every measurement: p <= 2^22, m = 3 primarily, one solver,
    five seeds. Fitted exponents at that scale have wide intervals and license no
    extrapolation to cryptographic size.
  - >-
    The F_{q^2} arm establishes nothing about prime fields. It establishes that
    the instrument can see a decaying rho.
  - >-
    KN-FIND-b7e091 is not revisited. This record prices an algorithm and
    adjudicates no oracle.

  assumptions:
  - N prime, G = <P> of order N, Q = [k]P, k uniform.
  - >-
    In Variant K, b is invertible mod N, which holds for all but one value since
    N is prime.
  - >-
    m is treated as a constant in the Theta notation; the constants hidden are
    m!, m and 2^{m-1}, all of which are superpolynomial in m and are therefore
    disclosed rather than absorbed. A statement uniform in m would need them
    tracked and this record does not make one.
  - >-
    Variant U's linear algebra is sparse Wiedemann/Lanczos at Theta(m L^2). A
    dense solve is Theta(L^omega) and only worsens the U threshold.
  - >-
    "A nonzero polynomial over F_p vanishing on L points has degree at least L"
    -- elementary, used without proof, and taken from
    IDEA-20260807-070d03 where it is already stated.
  - >-
    The summation polynomial S_{m+1} has degree 2^{m-1} in each variable
    [recall-confident: Semaev, Summation polynomials and the discrete logarithm
    problem on elliptic curves, 2004; NOT re-verified this session, web search
    unavailable]. Only the CONSTANT depends on this, not the exponent.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      DECOMPOSITION OCCUPANCY. For a base of L elements with discrete logarithms
      uniform and independent in Z/N, a uniformly random target admits an
      m-element decomposition with probability
      1 - exp(-binom(L,m)/N), so P_dec = Theta(L^m/(m! N)) in the regime
      binom(L,m) = O(N).
    rigorous_ingredient: >-
      RIGOROUS PART: the EXPECTED number of decompositions is exactly
      binom(L,m)/N by linearity of expectation, needing no independence at all,
      since each fixed m-subset sums to a fixed target with probability exactly
      1/N for uniform independent logarithms. HA-1 supplies only the
      CONCENTRATION. If it fails, B-1's exponents are unchanged in form and only
      the constants and the location of L* move; the record's conclusions are
      exponent-level and therefore robust to it, which is why it is filed as HA-1
      rather than as an assumption.
    distribution_imitated: >-
      The classical occupancy / balls-in-bins limit, playing the role that
      Dickman-de Bruijn rho(u) plays for smoothness in the exemplar profile
      (inputs/P13-WESOLOWSKI-2026).
    validation_route: >-
      Direct sampling at toy scale where logarithms are computable: at
      p in {2^14, ..., 2^22}, N prime, m = 3, choose L to hit binom(L,m)/N in
      {2^-8, 2^-4, 2^-1, 1, 2, 8}, and measure the fraction of 200 uniformly
      random targets that decompose against 1 - exp(-binom(L,m)/N). TAIL CHECK:
      the 2^-8 rung, predicted about 0.4 percent, where a systematic excess would
      indicate dependence between base and targets -- prime-field structure the
      program has not identified, to be escalated rather than absorbed. SAMPLED
      PARAMETERS AND TRANSFER: validated at p <= 2^22 only; no transfer to
      cryptographic size is claimed or supported by anything here.
  - id: HA-2
    statement: >-
      COST-EXPONENT STABILITY. The exponent of rho(L, m, N) in N, fitted at
      p <= 2^22 with a fixed solver at fixed m and fixed L/sqrt(N), is the same
      exponent that would be fitted at cryptographic size with the same method.
    rigorous_ingredient: >-
      NONE, AND IT IS THE WEAKEST LINK IN THE ENTIRE DESIGN. Groebner-basis cost
      exponents are notoriously unstable between the small-instance regime and
      the asymptotic regime, and the program's own DREG-lane records
      (KN-TECH-004, KN-TECH-011, KN-FIND-f8c290) exist because of it. The rigorous
      statement it imitates is that the Macaulay matrix dimension at solving
      degree D is binomial(n+D, D), which is monotone in D at fixed n -- a
      monotonicity, not a scaling law.
    validation_route: >-
      Fit the exponent separately on the low half and the high half of the prime
      ladder and compare; a difference between the two halves exceeding their
      combined interval means HA-2 is not supported at the tested scale, and the
      measurement must be reported as descriptive rather than as an exponent.
      Additionally report the solving degree and Macaulay dimension per cell and
      their rank correlation with the operation count, so that a weak correlation
      is visible rather than assumed away. TRANSFER ASSUMPTION STATED EXPLICITLY:
      any statement about cryptographic-size rho rests on HA-2 and on nothing in
      this repository.

  proof_search_map:
    bottleneck: >-
      The value and scaling of C(L,m) -- the cost of ONE arity-m decomposition
      attempt over F_p. Every other quantity in this record is two lines of
      calculus or a combinatorial count. C is the single number whose value
      decides whether prime-field index calculus beats rho, it is the only thing
      the experiment measures, and its removal is exactly what would change the
      theorem. The record's contribution is not to determine C but to state, in
      closed form, the threshold C must cross.
    baseline_embedding:
      parameter_slice: >-
        THREE SLICES, all mandatory. (1) m = 1, where Variant K must degenerate
        to IDEA-20260807-070d03's arity-1 analysis: optimum at L = N, cost
        sqrt(N)/2 draws, no factor base. (2) m = 2, where L* = Theta(sqrt(N)) and
        the base construction alone already costs the birthday bound, so the
        method must tie rho and not beat it. (3) THE EXTENSION-FIELD SLICE
        F_{q^n}, where the membership condition becomes n-1 linear conditions
        after Weil restriction and the search space is NOT L^{m-1}; here B-2's
        conclusion must FAIL and the method must beat sqrt(N).
      reproduction_check: >-
        SYMBOLIC at all three, by substitution, recorded as frozen fixtures.
        Slice (3) is the decisive one and is described in falsification_conditions
        as the intended cheap death: a cost model that condemns prime fields must
        exonerate extension fields.
    observation_collision:
      observable: >-
        The dimensionless ratio rho = C_measured / L^{m-1}, and the derived total
        T against 0.886*sqrt(N).
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS IN BOTH DIRECTIONS. FIRST COLLISION: Variant K
        at (L = sqrt(N), C = L^{m-1}) and plain Pollard rho have the SAME
        observable T = Theta(sqrt(N)) while being completely different
        algorithms with completely different memory profiles -- so T alone does
        not identify the method, and the separating condition is memory, which is
        why the target_complexity block below reports both. SECOND COLLISION, and
        it is the one that constrains the record: two solvers with the same rho
        at one N can have different rho-exponents in N, so a single cell's rho
        does not identify the conclusion at all and only the LADDER does. That is
        why the design refuses to interpret any single cell and why a fitted
        exponent without its interval is declared not to be evidence.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        Build the problem-specific resource measure "search-space size of one
        decomposition attempt", realise it by the specialisation to F_{q^n} where
        the measure collapses because the membership condition linearises, and
        add charges only over the proved-disjoint blocks {membership conditions}
        and {summation polynomial}, whose degrees multiply in the search count
        rather than interacting.
      predicted_gain: >-
        Converts "prime fields are harder for index calculus" from folklore into
        a single dimensionless ratio with a pre-registered null (exponent 0) and
        a positive control (the subfield arm), measurable on a five-rung prime
        ladder.
    - transform: baseline_as_boundary_lift
      proposed_object: >-
        Treat 0.886*sqrt(N) not as a competitor but as the BOUNDARY of the family
        T_K(L) = L + m! N C / L^m, and prove that at C = L^{m-1} the family
        touches the boundary rather than crossing it -- a strict statement about
        the boundary's location, not a feasibility claim.
      predicted_gain: >-
        An exact equality (the fixed point) in place of a vague "does not seem to
        help", plus the exact epsilon by which C must beat its search space.
    quantifier_order: >-
      B-1: FORALL arities m >= 2, FORALL cost functions C, EXISTS an optimal base
        size L* such that T_K(L*) = Theta((N C)^{1/(m+1)}); hence FORALL C with
        C < N^{(m-1)/2} the method beats N^{1/2}, and FORALL C with
        C >= N^{(m-1)/2} it does not. The universal over C comes FIRST and the
        optimisation is inside it, which is what makes the threshold a genuine
        dichotomy rather than a statement about one algorithm.
      B-2: FORALL m >= 2, IF C = Theta(L^{m-1}) THEN T_K(L*) = Theta(N^{1/2})
        with L* = Theta(N^{1/2}). A CONDITIONAL, and the antecedent is a
        hypothesis about solvers, not a theorem -- stating it as an implication
        with the antecedent visible is the whole discipline of this record.
      NOT CLAIMED, AND IT IS THE CONVERSE: that C >= N^{(m-1)/2} for every
      prime-field method. That is the open question, and asserting it would be
      exactly the premature closure the inventor protocol forbids. The record
      says which measurement would settle it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under HA-1, and under the stated charging of base construction,
        attempts, and (for Variant U) sparse linear algebra, prime-field index
        calculus at arity m costs Theta((NC)^{1/(m+1)}) in the known-log variant
        and Theta((NC)^{2/(m+1)}) in the unknown-log variant, so it beats
        0.886*sqrt(N) iff C < N^{(m-1)/2} respectively C < N^{(m-3)/4}; and at
        C = Theta(L^{m-1}) the known-log variant equals Theta(sqrt(N))." It can
        NEVER certify a lower bound on C, that no prime-field factor base or
        solver does better, anything at cryptographic scale, or anything about
        extension fields beyond the control slice.
      nearby_object_control: >-
        THE EXTENSION-FIELD CASE F_{q^n} WITH A SUBFIELD FACTOR BASE is the
        nearest object on which the hoped-for conclusion MUST FAIL, and the
        record is designed around that: if the same derivation condemns it, the
        derivation is condemning arithmetic. A SECOND nearby object: the arity-1
        case, where the conclusion holds but for a completely different reason (a
        birthday collision, not a linear system), included so that agreement at
        m = 1 is not read as support for the mechanism at m >= 2.
    proof_obligations:
    - claim: T_K and T_U charge every stage, including base construction and
        linear algebra.
      responsibility: runtime
    - claim: The optima and the resulting Theta expressions are correct.
      responsibility: correctness
    - claim: >-
        Substituting C = L^{m-1} gives L* = Theta(sqrt(N)) and
        T_K = Theta(sqrt(N)) exactly, for every m >= 2.
      responsibility: strictness
    - claim: P_dec = Theta(L^m/(m! N)) in the stated regime (HA-1).
      responsibility: success_probability
    - claim: >-
        The m = 1 and m = 2 slices reproduce the program's existing results.
      responsibility: baseline
    - claim: >-
        The extension-field slice does NOT satisfy the fixed point, so the
        derivation distinguishes prime from extension fields.
      responsibility: scope
    - claim: >-
        Variant K's memory is Theta(L) = Theta(sqrt(N)) at the fixed point, so
        the tie with rho is a Pareto LOSS.
      responsibility: memory
    - claim: >-
        Measured rho is reported with both arms in the same units and with the
        exact integer denominator named.
      responsibility: interface
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT IS CLAIMED AND THE RECORD'S ARITHMETIC IS WHY. Known-log
      variant: Theta((N C)^{1/(m+1)}), which is exponent
      1/(m+1) + log_N(C)/(m+1) -- sub-birthday only if C < N^{(m-1)/2}, and
      EXACTLY N^{1/2} at the naive cost C = L^{m-1}. Unknown-log variant:
      Theta((N C)^{2/(m+1)}), sub-birthday only if C < N^{(m-3)/4}, and
      Theta(N) at the naive cost. The value of C is not claimed and is the open
      quantity. The exponent that MOVES if anything moves is entirely inside C.
    memory_exponent: >-
      Known-log variant at the fixed point: Theta(L*) = Theta(N^{1/2}) stored
      base labels -- the BSGS corner. So even the exact tie with rho on time is a
      STRICT PARETO LOSS, because rho with distinguished points uses O(1) memory.
      This extends IDEA-20260807-070d03's arity-1 observation ("a free
      non-simulable oracle buys a re-derivation of BSGS") to every arity, and it
      is the single most important sentence in this block. Unknown-log variant at
      its optimum: Theta(N^{1/4}) relation storage plus the linear-algebra
      working set.
    best_known_baseline: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); the automorphism-
      discounted variant on CM curves at a constant factor at most sqrt(6)
      (KN-TECH-018), which is BASELINE CALIBRATION and never an exponent; BSGS at
      sqrt(N) time and sqrt(N) memory (KN-TECH-031). For the decomposition step,
      KN-FIND-f8c290 and the DREG-lane solving-degree measurements.
    hidden_overhead_disclosure: >-
      FOUR DISCLOSURES, all material. (1) m is treated as constant and the hidden
      constants m!, m and 2^{m-1} are superpolynomial in m, so "the exponent is
      m-independent" is TRUE and simultaneously means large m is ruinous in
      practice -- the two statements are not in tension and quoting only the first
      would be dishonest. (2) The threshold C < N^{(m-1)/2} counts C in
      group-operation-equivalent units and hides the conversion between field
      multiplications and group operations, which is a constant times log p.
      (3) HA-2, the assumption that a toy-scale cost exponent is the asymptotic
      one, is unsupported and is the weakest link in the whole design.
      (4) The known-log variant's sqrt(N) MEMORY is invisible in the time
      exponent and turns an apparent tie into a loss; it is disclosed here and in
      memory_exponent rather than buried.
    time_memory_tradeoff: >-
      The family T_K(L) = L + m! N C / L^m IS a time-memory tradeoff curve, with
      memory Theta(L): small L means little memory and many attempts, large L
      means BSGS-scale memory and few attempts. At the naive cost the curve's
      minimum sits at (time sqrt(N), memory sqrt(N)) -- exactly BSGS, and strictly
      dominated by rho at (sqrt(N), O(1)). The van Oorschot-Wiener interpolation
      that rescues rho under memory constraints has no analogue here, because the
      memory is the factor base itself and shrinking it costs attempts
      superlinearly. Parallelisation: attempts are embarrassingly parallel and
      base construction is embarrassingly parallel, so the known-log variant
      parallelises as well as rho does; Variant U's linear algebra does not, and
      any concrete table must charge it.

  sota_delta: >-
    ZERO against every attack baseline: 0 time, 0 memory, 0 queries, 0 data. No
    attack is mounted and none is claimed; the record derives that the method it
    analyses TIES rho on time and LOSES to it on memory at the naive
    decomposition cost. QUANTITATIVE CONTENT: it supplies four exact numbers the
    campaign did not have -- the known-log threshold C < N^{(m-1)/2}, the
    unknown-log threshold C < N^{(m-3)/4}, the gap N^{(m+1)/4} between the two
    variants, and the required search-space efficiency rho <= N^{-epsilon} -- and
    it replaces "measure C" with "measure the exponent of C/L^{m-1} in N", which
    is a strictly cheaper and strictly more decisive experiment.
  dominated_by: >-
    AS AN ATTACK: dominated by every row of the prime-field frontier, checked one
    by one, and the record derives the domination rather than merely conceding
    it. Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
    operations and O(1) memory (KN-TECH-001, KN-TECH-006) TIES the known-log
    variant on time at the naive cost and STRICTLY DOMINATES it on memory, hence
    dominates in the Pareto sense; the automorphism-discounted variant on CM
    curves (KN-TECH-018) dominates by a further constant at most sqrt(6); BSGS at
    sqrt(N) time and sqrt(N) memory (KN-TECH-031) TIES the known-log variant on
    both axes, which is the sharpest available statement and means the whole
    construction re-derives BSGS. The unknown-log variant at the naive cost is
    dominated by all three by a factor sqrt(N) on time. `null` is not available
    anywhere here and would be a fabrication under AGENTS.md rule 5.
    AS A COST MODEL: the incumbent is the informal accounting used across the
    campaign's index-calculus records, which dominates on nothing and is
    dominated here on having explicit thresholds; and
    IDEA-20260807-070d03, which dominates this on the DEGREE argument (it proves
    the search space is L per variable) and is dominated by this on the COST
    ACCOUNTING (it leaves C undetermined without saying what value would matter).
    The two compose and neither is complete alone.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the B-1 optimisations are arithmetically correct -- they are
    single-variable calculus and I have done them, and the residual risk is a
    mischarged stage rather than an algebra slip. 0.80 that the B-2 fixed point
    survives the extension-field falsifier, which is the one check that could
    kill it cleanly and which I have not run symbolically end to end. 0.75 that
    the m = 1 and m = 2 baseline slices reproduce. 0.85 that measured rho has a
    fitted exponent statistically indistinguishable from 0 at toy scale -- the
    predicted and expected outcome, and a controlled null in the
    inventor-protocol sense. 0.15 that rho decays measurably, which is the
    campaign's entire upside and is where the 0.15 lives. 0.4 that HA-2 survives
    the split-half check, which is the reason the compute estimate is medium
    rather than low. HIGH priority because Stage 0 is ninety minutes with no
    compute, because the extension-field falsifier is the cheapest decisive check
    in this batch after IDEA-20260811-a343de's Stage 0, and because the record's
    output is a spending instruction the Coordinator can act on immediately
    whether the answer is positive or negative.

  novelty_status: adaptation
  novelty_screen: >-
    PERFORMED 2026-08-11 against ledger/proposals/ (146 committed records) with
    the harness Grep tool, and against analysis/endomorphism-isogeny-
    decomposition/DECOMPOSITION.md read in full.
    (1) `^  question_id: RQ-GGMB-6eaabc` -> 9 lane records;
    IDEA-20260807-070d03 read in full, and it is the direct antecedent: it states
    the degree fact (vanishing degree of a size-L subset of F_p is exactly L),
    derives the arity-1 cost N/(2 sqrt(L)) with optimum sqrt(N)/2, states the
    arity-m QUERY exponent 1/m, and explicitly leaves the charged exponent as
    "1/m + log_N(C)" with C undetermined. IT DOES NOT OPTIMISE OVER L, does not
    charge the linear algebra, does not distinguish known-log from unknown-log
    bases, and states no threshold for C. Those four gaps are what this record
    fills.
    (2) `interpolation|Winterhof|Shparlinski|Coppersmith|straight-line program|
    arithmetic circuit|generic ring` -> 72 files, none containing a crossover
    inequality for prime-field index calculus.
    (3) DECOMPOSITION.md section 4 lane L1 names "relation yield" and "solving
    degree" as functionals and section 5 pre-registers the expectation of zero
    within-class variance in relation yield; NO lane names a threshold on C, and
    the campaign's stated open quantity is C itself.
    (4) The classical relation-collection versus linear-algebra balance is
    standard in the index-calculus literature and is NOT claimed as new.
    EXTERNAL NOVELTY IS NOT ESTABLISHED: WebSearch and WebFetch both failed this
    session with a backend model error. A published statement of the same
    thresholds would be an ingredient and a Stage-0 literature scout for one is
    part of the design. novelty_status: `adaptation`.
  discriminated_from: >-
    IDEA-20260807-070d03 is the direct antecedent and the boundary between the
    two records is sharp. That record establishes (i) the arity-1 cost formula
    and its optimum, (ii) that every R1/R2 oracle factors through x, (iii) the
    DEGREE FACT that a size-L prime-field subset has vanishing degree exactly L,
    and (iv) a matched-size three-arm experiment testing whether decomposition
    cost depends on factor-base STRUCTURE. This record takes (iii) as given,
    takes (i) as its m = 1 baseline slice, does NOT re-derive either, and adds
    the thing -070d03 explicitly leaves open: what value of C would matter. Its
    experiment is also different in its independent variable -- -070d03 varies
    the factor base at fixed N, this record varies N at fixed base construction,
    and the two are complementary rather than competing. Conflating them would be
    the reviewer error to guard against, and the discriminator is: -070d03 asks
    "does structure change C?", this record asks "what would C have to be?".
    IDEA-20260807-7270d1 supplies the query-model statement that the
    decomposition oracle is not closed by the simulation argument, and its (D)
    witness is the known-log construction this record prices. It does not price
    anything and explicitly defers cost to -070d03.
    IDEA-20260811-ad0ff7 (this batch) weakens the oracle to one bit; that changes
    the query count and not the cost model, so this record's thresholds apply to
    it unchanged with C the cost of one DECIDE evaluation.
    IDEA-20260811-a343de (this batch) prices the oracle's INFORMATION; this one
    prices its WORK. Orthogonal coordinates on the same object, and both are
    needed before the decomposition oracle can be adjudicated at all.
    KN-FIND-5c1a03's "non-algebraic factor base forced by Bezout" is a
    convergence summary; this record does not restate it and cites -070d03's
    conversion of it into a degree fact.
    KN-FIND-b7e091 is binding and is not revisited; no oracle is adjudicated here.
