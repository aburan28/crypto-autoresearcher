      to an instrument audit rather than as measurements of a mathematical
      quantity. EV-SSIQ-f3ce32 is the evidence record that governs them and it
      is cited, not restated.
    - >-
      ledger/goals/GOAL-SSIQ-001/goal.yaml, blocks instrument_calibration,
      known_defects_of_this_record GD-8 and GD-9, and next_action -- READ IN
      FULL. GD-8 is the missing trapped-fraction filter; GD-9 is
      C-NULL-LABEL's comparison logic being initialised False and never
