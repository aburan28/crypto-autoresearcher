      a second estimator.
    - >-
      Pizer, "Ramanujan graphs and Hecke operators", the frozen source's
      reference [37], cited at line 193 for the mixing bound. NOT READ --
      relayed claim via the frozen source. The expander property is used here
      only to justify hitting time ~ 1/density, and the paired experiment
      REPLACES that citation with a direct exact computation of the hitting
      time from each graph's transition matrix, so no conclusion depends on the
      unread reference.
    - >-
      The class number formula giving h(-p) = p^{1/2+o(1)}, hence an F_p locus
      of size p^{1/2+o(1)}. RECALLED, UNVERIFIED. Replaced in the experiment by
      a direct count of F_p-rational vertices in each constructed graph, which
      is exact at these sizes; the recalled asymptotic is used only to say why
      the exponent 1/2 is the right anchor, and the measured counts test it.

  lossy_projection_identifiability_audit:
    projection: >-
      (graph, labelling, all start vertices, all descent trajectories) --> two
      real numbers, gamma_greedy and gamma_random, plus one fraction per prime.
    what_is_discarded: >-
      The trajectories, the basin structure, the per-start hitting times beyond
      their median, and the entire joint distribution. Four medians per arm are
      compressed into one slope.
    why_genuinely_lossy: >-
      Extremely lossy, and this is the concern rather than the design: a slope
      through four medians over a factor of three in N discards precisely the
      information that would reveal whether the slope is meaningful.
    why_compatible_with_the_operations: >-
      The exponent is the right observable IF the underlying law is a power
      law and the fit resolves it. The audit is about whether that IF holds,
      which is why the projection is applied to objects whose exponent is known.
    is_it_only_a_change_of_coordinates: >-
      NEITHER FAILURE MODE APPLIES CLEANLY, AND THE ONE THAT THREATENS IS THE
      MIRROR. Not the "nothing discarded" failure: a slope is not invertible.
      The mirror failure -- a projection so lossy it is constant across
      instances, with zero comparator spread -- IS THE LIVE RISK, and is the
      reason the audit is framed as it is: greedy_median takes the values 10,
      11, 12, 13 across the entire measured range, so the greedy arm's
      observable moves by one integer unit per prime. A statistic that barely
      varies across the objects it is meant to distinguish is the canonical
      artifact tell. The audit's job is to determine whether gamma_greedy has
      any comparator spread at all, and the null relabelling supplies the
      comparator.

  assumptions:
    - >-
      That the descent target set in the committed runs is the F_p-rational
      locus (delta_E = 1). This is the goal record's L4 framing and
      EXP-SSIQ-58b642's stated object, but it must be confirmed against
      descent_hitting_time.py before the forced value 1/2 is applied. IF THE
      TARGET IS A DIFFERENT SET, the forced value changes to
      1 - log_N(|target|) and the audit proceeds with that number instead --
      the anchor is recomputed, never abandoned.
    - >-
      That the four graphs are connected and 3-regular as their correctness
      gates report. The run's correctness_gates block records connectivity and
      degree_sequence checks for twelve primes; the audit re-reads them rather
      than assuming them.
    - >-
      That the estimator applied to the anchor is BIT-IDENTICAL to the one that
      produced gamma_greedy. GD-9's lesson is exactly that a control which was
      never wired produces a report block anyway; the audit therefore calls the
      same function object, and records the call site, rather than
      reimplementing the fit.

  heuristic_assumptions:
    - id: HEUR-SS-3
      statement: >-
        BIAS TRANSFER. The estimator's additive bias b(gamma_true, N-range) is a
        function of the true exponent and the fitting range alone, so that
        measuring b at >= 3 known exponents determines it at the greedy arm's
        operating point by interpolation.
      rigorous_support: >-
        NONE, AND THE PROPOSAL DEPENDS ON IT ONLY FOR ITS CORRECTION, NOT FOR
        ITS FINDING. The finding -- that a forced-value anchor exists and
        returns 0.4014 instead of 0.5 -- is unconditional. The correction of
        gamma_greedy is conditional on HEUR-SS-3, and if the ladder shows b
        depends on the labelling's structure rather than only on the exponent,
        the honest output is "the estimator is not correctable at this scale",
        which is itself a decisive result about the lane.
      validation_plan: >-
        Measure b at forced exponents 1/4, 1/3, 1/2 and 2/3 by constructing
        labellings on the SAME graphs whose hitting exponents are known: a
        labelling by graph distance to a planted target set of size N^{1-e}
        gives hitting exponent e under greedy descent (greedy follows the
        distance gradient and reaches the target in O(diameter) = O(log N)
        steps -- so this planted control also serves as the POSITIVE control,
        where the effect MUST appear), and a uniformly random labelling gives
        the random-walk exponent. Report b at every rung and its dependence on
        the rung.
      falsification_condition: >-
        b varies by more than 0.10 between two rungs with the same forced
        exponent but different labelling construction. HEUR-SS-3 is then false
        and no corrected gamma_greedy may be reported.

  predictions:
    - metric: >-
        anchor_residual = fitted gamma on a uniformly random labelling of the
        four committed graphs, minus the forced value 1/2
      direction: different
      minimum_effect: >-
        FORCED VALUE 0.000. Pre-registered tolerance: |residual| <= 0.03 means
        the estimator is fit for purpose at this scale and gamma_greedy may be
        read as measured. |residual| > 0.03 quantifies the bias and every
        greedy exponent must thereafter be reported with the residual attached.
        The committed run's own gamma_random of 0.4014 implies a residual of
        -0.0986 if the exact-hitting-time computation confirms the forced value,
        and the audit's first job is to confirm or refute that forced value
        exactly, by solving the hitting-time linear system on each graph.
    - metric: >-
        exact_hitting_exponent: the exponent of the EXACTLY computed mean
        hitting time of the F_p locus, from each graph's transition matrix, fit
        across the four primes
      direction: different
      minimum_effect: >-
        Predicted 0.500 +/- 0.05. This is the decisive stage and it costs an
        N x N linear solve at N <= 611. If the exact computation itself returns
        0.40, then the forced value is wrong at this scale (finite-size effects
        dominate) and the ANCHOR is what needs rescoping, not the greedy arm --
        a completely different and equally publishable outcome.
    - metric: >-
        trapped_fraction of the MATCHED null (random permutation of the same
        delta multiset on the same graph), per prime
      direction: higher
      minimum_effect: >-
        Predicted above the real arm at every one of the four primes, and
        predicted in [0.88, 0.98]. Derived before the run from the local-minimum
        count. If the matched null returns a trapped fraction indistinguishable
        from the real arm's 0.72-0.85, THE delta_E LABELLING CARRIES NO DESCENT
        SIGNAL AT ALL at this scale and lever L4's descent branch is closed at
        toy scale with a matched control -- the single most useful negative
        available in this lane.
    - metric: >-
        escape_ratio = (1 - trapped_real) / (1 - trapped_null_matched),
        per prime and fitted across primes
      direction: higher
      minimum_effect: >-
        Forced value 1.00 under the null. Interesting only if > 1 with a
        bootstrap CI excluding 1 at three of four primes. Pre-registered
        threshold: CI lower bound >= 1.2. Its GROWTH in N is the quantity that
        matters asymptotically and is reported as a separate exponent with its
        own anchor.
    - metric: >-
        c_null_label comparison verdict derived from a rule stated and frozen
        BEFORE the rule is evaluated on the existing null_by_prime data
      direction: different
      minimum_effect: >-
        The rule must be capable of both outcomes on the committed data. GD-9's
        finding is that the current control cannot fail; the pre-registered
        repair is that the rule is written, its two branches are exhibited on
        SYNTHETIC data where each is known to be correct, and only then is it
        run on the real null_by_prime medians. A rule that emits the same
        branch on both synthetic cases is rejected before the real data is
        touched.

  minimal_test:
    design: >-
      Stages, cheapest first, each able to terminate. STAGE 0 (zero compute):
      confirm from descent_hitting_time.py and the frozen spec text what the
      descent target set is and what the estimator's fitting rule is; recompute
      the forced value; record it. If the target is not the F_p locus, recompute
      the anchor and continue. STAGE 1 (seconds to minutes): rebuild the four
      graphs with the committed builder and seed, verify vertex counts against
      the committed N = 203, 324, 478, 611, and COUNT the F_p-rational vertices
      directly -- this replaces the recalled class-number asymptotic with a
      measurement. STAGE 2 (minutes): compute the EXACT mean hitting time of
      the target set on each graph by solving (I - P')h = 1 restricted to
      non-target vertices; fit its exponent. This is the forced-value check and
      it can end the audit either way. STAGE 3 (minutes): the bias ladder --
      run the frozen estimator on planted-distance labellings with forced
      exponents at >= 3 interior points and on the uniform-random labelling,
      and tabulate residuals. STAGE 4 (minutes): the matched null relabelling
      and the escape ratio. STAGE 5: apply the corrected reading to
      gamma_greedy and report it WITH the ladder, never alone.
    controls:
      - >-
        MATCHED NULL, SAME SHAPE, CAN FAIL: a uniformly random permutation of
        the committed delta_E multiset over the same vertex set of the same
        graph. Identical label distribution, identical graph, geometry
        destroyed. FORCED VALUES DERIVED BEFORE THE RUN: hitting exponent 1/2,
        trapped fraction 1 - Theta(N^{-1/2}) in [0.88, 0.98], m_gap 0.000.
        Every one of these can fail, and a null m_gap significantly different
        from 0 would indicate the estimator manufactures a gap from graph
        structure alone -- which would void the real arm outright.
      - >-
        POSITIVE CONTROL, THE EFFECT MUST APPEAR: planted-gradient labelling
        L(v) = graph distance from v to a planted target set of size
        ceil(N^{1/2}). Greedy descent on L reaches the target in at most
        diam(G) = O(log N) steps by construction, so gamma_greedy is forced to
        0 and m_gap is forced to 1/2. IF THE INSTRUMENT DOES NOT RETURN A LARGE
        POSITIVE m_gap HERE, IT CANNOT DETECT A DESCENT SIGNAL AND NO NEGATIVE
        RESULT MAY BE REPORTED FOR THE REAL ARM.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported: planted
        target sets of size N^{1-e} for e in {1/4, 1/3, 1/2, 2/3}, giving
        forced random-arm exponents e. Report fitted-versus-forced at each rung
        and the monotonicity of the residual in e. A failure localises whether
        the estimator breaks at small exponents (where hitting times are short
        and discreteness bites) or at large ones (where the fitting window
        saturates) -- which is exactly the decomposition this goal's
        instrument_calibration block already found for the OTHER estimator, and
        finding the same decomposition here would be strong corroboration.
      - >-
        ORDERING CONTROL: the null arm and the ladder are computed, committed,
        and hashed BEFORE the real arm's corrected reading is computed or
        looked at. The decision rule is executed on the null first.
      - >-
        DEAD-CONTROL CHECK (GD-9's standing repair, executed rather than
        promised): for every control this contract reuses, exhibit at least one
        synthetic input on which it FAILS and one on which it PASSES, before it
        is applied to real data. A control with no exhibited failing input is
        not a control.
      - >-
        ARCHIVE CHECK (zero compute): list every prior measurement in this
        corpus of a hitting-time estimator's residual against a forced value.
        NONE EXISTS for this estimator; the delta_E counting window's
        calibration (instrument_calibration) is a different estimator and is
        cited as precedent, not as a passed check.
    required_metrics:
      - the forced value, its derivation, and the exactly computed hitting exponent beside it
      - per-prime F_p-rational vertex count, measured not recalled
      - residual table over the graded ladder, with monotonicity
      - matched-null trapped fraction and m_gap beside the real arm's, as ratios
      - the frozen C-NULL-LABEL comparison rule, its two exhibited synthetic branches, and only then its verdict on the committed data

  falsification_conditions:
    - >-
      The exactly computed hitting exponent is 0.40 rather than 0.50 on these
      graphs. The forced value is then a large-N statement that does not apply
      at N <= 611, the anchor is void, and the correct conclusion is that NO
      exponent measured on graphs this small is interpretable -- including
      gamma_greedy. That is a harsher outcome for the lane than the one the
      proposal expects, and it is pre-registered as an admissible result.
    - >-
      The positive control fails to produce a large m_gap. Nothing negative may
      be reported about the real arm.
    - >-
      The matched null produces a trapped fraction indistinguishable from the
      real arm's. The delta_E label carries no descent advantage at toy scale;
      report it, and do not read it as a statement about crypto scale.
    - >-
      HEUR-SS-3 fails on the ladder. No corrected gamma_greedy may be reported,
      and the deliverable reduces to the uncorrected anchor residual plus the
      statement that the estimator is not correctable at this scale.
    - >-
      The descent target set turns out not to be the F_p locus, invalidating
      the specific forced value 1/2. The audit recomputes and continues; this
      is a correction, not a falsification.

  confounders:
    - >-
      FOUR POINTS. Every exponent in this lane, including the forced-value
      check, is fitted on four primes spanning a factor of three in N. That is
      the confounder, and it is why the audit's primary output is a RESIDUAL
      against a known answer rather than an exponent.
    - >-
      THE MATCHED NULL IS NOT UNIQUE. Permuting the delta multiset destroys
      geometry but also destroys the correlation between delta and the F_p
      locus, which is a definitional relationship (delta = 1 IS the locus), not
      an empirical one. The null must therefore permute labels while PINNING
      the delta = 1 vertices in place, or it changes the target set as well as
      the gradient. Both variants are run and reported; conflating them would
      be a design error and is named here so a reviewer can check it.
    - >-
      REUSE RISK. The audit deliberately calls the committed estimator rather
      than a reimplementation, which means an error in the estimator is
      measured rather than corrected. That is intended -- the object under
      study IS the committed estimator -- but it means a clean ladder does not
      certify the estimator is correct, only that it is unbiased on the ladder's
      objects.
    - >-
      CONFIRMATION PRESSURE IN THE OTHER DIRECTION. This proposal expects the
      correction to push gamma_greedy ABOVE 1/4, i.e. to weaken this campaign's
      most promising lever. That is a comfortable conclusion for a reviewer and
      an uncomfortable one for the campaign, and the reverse bias is as real as
      the usual one. The ordering control and the pre-registered forced values
      exist to make either outcome cost the same.

  interpretation_limits:
    - >-
      NOTHING HERE IS EVIDENCE ABOUT THE SUPERSINGULAR ISOGENY PROBLEM. It is
      evidence about an instrument. A corrected gamma_greedy above 1/4 does not
      close lever L4: it closes the claim that the CURRENT toy measurement
      shows the descent meeting its own ceiling, at N <= 611, on one estimator.
    - >-
      NO STATUS CHANGE to EV-SSIQ-f3ce32, to RUN-SSIQ-a85692-b, or to any
      hypothesis is proposed or implied. Those are Coordinator decisions.
      RUN-SSIQ-a85692-b's terminal CONTROL-FAILURE-VOID label stands and this
      proposal does not seek to lift it.
    - >-
      Toy tier throughout: log2 p <= 13, N <= 611, four primes. Any statement
      about cryptographic scale from this data would violate rule 7.
    - >-
      Even a fully repaired and favourable descent measurement does not yield
      an algorithm, because the descent must evaluate delta_E at every visited
      vertex and no cheap evaluation is known. That accounting is
      IDEA-20260805-250e50's and is cited here so the two are read together.

  proof_search_map_note: >-
    The paired hypothesis H-SSIQ-2efc5c carries the filled proof_search_map.
    This proposal is an instrument audit rather than a proof-oriented claim,
    and the map's method_ceiling and observation_collision audits are the two
    that carry content there.

  target_complexity:
    time_exponent: >-
      n/a for this audit -- no algorithm is proposed and no exponent is moved.
      The audit CONDITIONS the interpretation of gamma_greedy, which is the
      exponent lever L4's descent branch would have to deliver below 1/4.
    memory_exponent: >-
      n/a. The audit itself needs O(N^2) for the exact hitting-time solve at
      N <= 611, which is megabytes.
    best_known: >-
      Unchanged: p^{1/3+o(1)} time and memory under Heuristic 1 (and GRH for
      the isogeny problem, SC-1); p^{1/2}(log p)^{O(1)} unconditional.
    hidden_overhead: n/a for an instrument audit.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed, no algorithm proposed). Frontier rows checked
    before writing this: (i) the frozen source's Section 4.1 table at lines
    234-238, time and memory at five sizes; (ii) the goal record's
    incumbent_baselines including tradeoff_curve and both corrections;
    (iii) every EV-SSIQ-* record for a prior calibration of the hitting-time
    estimator -- none exists; (iv) instrument_calibration, which calibrates a
    DIFFERENT estimator and is the precedent this proposal extends;
    (v) data/query axis -- not applicable and recorded as such.
  sota_delta: >-
    ZERO on every attack axis. Quantitatively the audit delivers: one residual
    against a forced value of exactly 1/2; a bias table at >= 3 known
    exponents; a matched-null trapped fraction against a derived 0.88-0.98
    band; an escape ratio with forced null value 1.00; and a C-NULL-LABEL rule
    with both branches exhibited before use. If the corrected gamma_greedy
    crosses 1/4, the delta is that this campaign's single most promising lever
    is not currently at its ceiling and its next batch is aimed at the wrong
    repair. If it does not cross, the delta is that the campaign's headline
    number survives its first real calibration -- which is worth substantially
    more than the number was worth uncalibrated.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that gamma_random is genuinely forced to 1/2 asymptotically. Not
    higher because the density Theta(N^{-1/2}) rests on a recalled class-number
    asymptotic (replaced by a direct count in Stage 1) and because the expander
    hitting-time bound is quoted through the frozen source rather than read.
    Not lower because both ingredients are standard and both are replaced by
    exact computations at these sizes.
    0.55 that the exactly computed hitting exponent at N <= 611 lands within
    0.05 of 1/2 -- i.e. that the anchor is usable at the achievable scale. The
    remaining 0.45 is the outcome in which the finite-size regime swallows the
    anchor, which is itself decisive about the lane.
    0.35 that the corrected gamma_greedy exceeds 1/4. Not lower, because the
    random arm's own residual is ~0.10 and the greedy arm's dynamic range is
    four consecutive integers. Not higher, because a bias that arises from
    window saturation may genuinely not transfer to an arm whose values do not
    saturate, and because m_gap is a difference in which a common bias cancels.
    0.90 that the batch reaches a decisive reading, because every stage runs on
    committed data or on graphs the committed builder rebuilds in minutes.
