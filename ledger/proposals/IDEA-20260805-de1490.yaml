idea:
  id: IDEA-20260805-de1490
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-05'
  title: >-
    The random arm of lever L4's own instrument has a forced value of exactly
    1/2 and returned 0.4014: anchoring the descent estimator to a theorem it
    already contains, and deriving the trapped-fraction threshold this campaign
    is about to apply without ever calibrating it
  class: control

  claim: >-
    RUN-SSIQ-a85692-b CONTAINS ITS OWN CALIBRATION CHECK AND NOBODY RAN IT.
    The run reports gamma_random = 0.4013966802748042, the fitted growth
    exponent of the RANDOM-WALK hitting time of the descent target set, and
    gamma_greedy = 0.23353930498277403, with m_gap their difference
    0.16785737529203015 (CI [-0.4077, 1.3256]). The random arm is not a free
    parameter: the target set is the F_p-rational locus, of size Theta(sqrt(p))
    inside a graph of N ~ p/12 vertices, so its density is Theta(N^{-1/2}), and
    the hitting time of a density-d set by a random walk on an expander is
    Theta(1/d). THEREFORE gamma_random IS FORCED TO 1/2, EXACTLY, BEFORE ANY
    RUN. The instrument returned 0.4014. That is a shortfall of ~0.10 on a
    quantity whose true value is a theorem, and it is measured by the SAME
    estimator, on the SAME four graphs, in the SAME run, that produced the
    headline gamma_greedy = 0.2335 -- a number whose entire interest is that it
    sits 0.017 BELOW this goal's 1/4 target.
    THE PROPOSAL: (i) install gamma_random == 1/2 as a pre-registered
    instrument-fidelity anchor and report every greedy exponent beside the
    anchor's residual; (ii) measure how the estimator's bias depends on the
    true exponent, by running it on synthetic labellings of the SAME graphs
    whose hitting exponents are known by construction at >= 3 interior points;
    (iii) derive, before looking at anything, the NULL forced value of
    greedy_trapped_fraction -- for a random relabelling of a 3-regular graph
    the greedy walk terminates at a local minimum, of which there are
    Theta(N), and the target set has size Theta(N^{1/2}), so the null trapped
    fraction is 1 - Theta(N^{-1/2}), i.e. ~0.93 at N = 203 and ~0.96 at
    N = 611. THE FROZEN CONTRACT'S INHERITED EXCLUSION THRESHOLD IS 0.5. The
    four measured values are 0.837, 0.722, 0.820, 0.851. If the null forced
    value is what the derivation says, then the measured labels are far BETTER
    than a random labelling and the 0.5 cut sits below the null -- so applying
    it, as GOAL-SSIQ-001's next_action item (2) proposes, would discard data on
    a threshold that was never derived, and would report DATA-UNAVAILABLE on a
    signal.
    NOTHING HERE ASSERTS THAT L4 WORKS OR THAT IT FAILS. It asserts that the
    campaign's terminal readings rest on an estimator with an unexercised
    forced-value anchor and on a filter constant with no derivation, and that
    both are fixable at zero new search cost.

  object_first_candidate:
    tracked_object: >-
      THE ESTIMATOR ITSELF -- the map from (graph, labelling) to a fitted
      hitting-time exponent -- followed through objects whose exponent is known
      in advance. The tracked quantity is the RESIDUAL (fitted exponent minus
      forced exponent) as a function of the forced exponent and of N. This is
      an instrument object, not a mathematical object, and naming it as the
      tracked object is the point: three of this campaign's six batches have
      terminated on a defect of an instrument nobody looked at (GD-4, GD-8,
      GD-9), and the standing repairs adopted so far are procedural
      ("verify by direct code reading") rather than quantitative.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) proposing a better descent heuristic
      -- this proposal changes no search; (b) collecting new primes or new
      delta_E labels -- explicitly zero new search, per the goal's own deferral
      (i); (c) the WISDE / M-GRAD route, RETIRED by the goal record and not
      reopened here; (d) claw finding, list restriction, and every lever L1-L3
      and L5. The one family deliberately NOT off-limits is instrument
      auditing, because that is what this proposal is.
    newness_score: >-
      Auditing an estimator is not a new idea and this program has a standing
      practice requiring it (instrument_calibration, adopted after BATCH-002:
      "RUN THE FROZEN ESTIMATOR ON AN OBJECT WITH THE TARGET EXPONENT BEFORE
      FREEZING THE CONTRACT"). WHAT IS NEW IS THAT THE ANCHOR IS ALREADY INSIDE
      THE RUN. The calibration adopted in BATCH-002 was applied to a different
      estimator (the delta_E counting window) and was never applied to the
      hitting-time estimator; and the specific observation that gamma_random is
      a THEOREM rather than a measurement does not appear in any record of this
      campaign. The derived null value of greedy_trapped_fraction does not
      appear either -- GD-8 records the threshold as inherited prose from
      EXP-SSIQ-58b642 and notes only that it was never implemented.
    testability_score: >-
      Maximal. The anchor comparison is arithmetic on numbers already committed
      in experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/raw-result.json.
      The bias ladder and the null relabelling run on the four graphs
      EXP-SSIQ-58b642/implementation/build_isogeny_graph.py already builds, at
      N <= 611, in pure Python, in minutes.
    survival_score: >-
      The anchor observation survives regardless of outcome -- gamma_random is
      forced whether or not the estimator recovers it. What is at risk is the
      INFERENCE that the greedy arm inherits a comparable bias: the two arms
      have very different hitting-time magnitudes (greedy medians 10-13 versus
      random medians 22-36), so a bias that comes from finite-T discreteness
      need not transfer, and it might even be larger on the greedy arm. That
      is exactly what the ladder measures.

  mechanism: >-
    DERIVED HERE. Numbers quoted from committed artifacts are cited by path;
    nothing is re-measured in this record and no run is claimed.

    (A) THE FORCED VALUE OF THE RANDOM ARM.
    The supersingular 2-isogeny graph on F_{p^2}-curves has N = #SS(p) ~ p/12
    vertices and is 3-regular (each curve has exactly 3 outgoing 2-isogenies up
    to isomorphism; frozen source line 99: for any prime l there are l+1
    distinct l-isogenies with domain E). It is a Ramanujan expander (Pizer, the
    frozen source's reference [37]; CITED VIA THE FROZEN SOURCE, the Pizer
    paper itself NOT READ by this record). The descent target is the
    F_p-rational locus, which is exactly the set where E is isomorphic to
    E^{(p)}, i.e. delta_E = 1 -- the goal record's own L4 framing. Its
    cardinality is h(-p) + h(-4p) up to bounded factors, and h(-p) =
    p^{1/2+o(1)} by the class number formula (RECALLED, UNVERIFIED -- to be
    checked against the constructed graphs, where the F_p vertex count is
    directly countable). Hence density d = Theta(N^{-1/2}).
    For a random walk on an expander with spectral gap bounded away from zero,
    the hitting time of a set of density d is Theta(1/d) -- standard, and
    checkable directly on these graphs by computing the exact hitting time from
    the transition matrix at N <= 611 (an N x N linear solve, seconds).
    THEREFORE E[hitting time] = Theta(N^{1/2}) and gamma_random = 1/2 EXACTLY.
    Consistency of the committed data with the forced value, computed here from
    the run's own per_prime block and offered as motivation rather than as a
    result: random_median / sqrt(N) = 22/14.25 = 1.544, 20/18.00 = 1.111,
    24/21.86 = 1.098, 36/24.72 = 1.456 at N = 203, 324, 478, 611. A
    two-endpoint slope on the same four points is
    log(36/22)/log(611/203) = 0.446. The fitted value the run reports is
    0.4014. Both are below 1/2, and the ratios above are consistent with an
    exponent of 1/2 times a constant near 1.2-1.5 with visible noise at four
    points.

    (B) WHY THE SHORTFALL MATTERS FOR THE HEADLINE NUMBER.
    m_gap = gamma_random - gamma_greedy is a DIFFERENCE of two fitted
    exponents. If the estimator's bias were a pure additive constant it would
    cancel and m_gap would be unbiased -- but that is an assumption, not a
    fact, and it is the assumption on which the campaign's only real
    measurement rests. The two arms differ in exactly the way that makes a
    common bias implausible: this goal's own instrument_calibration block
    attributes its earlier -0.36 bias to "saturation inside the retained
    window (~-0.15) plus finite-T discreteness at T <= 45 (~-0.21)", and
    finite-T discreteness is magnitude-dependent. The greedy arm's medians are
    10, 11, 12, 13 -- four consecutive integers -- so its dynamic range across
    a factor of three in N is a single unit of discreteness, which is the
    regime where a log-log slope is least trustworthy. THE PROPOSAL DOES NOT
    ASSERT THAT gamma_greedy IS BIASED. It asserts that whether it is, and by
    how much, is measurable on synthetic labellings and has never been measured.

    (C) WHY THE DIRECTION IS DECISIVE FOR THE GOAL.
    The goal record's L4 correction states the lever's ceiling: if the descent
    is the whole cost, Delfs-Galbraith's F_p-restricted phase makes the ideal
    ceiling exactly p^{1/4}. In the same units, the descent must reach the
    F_p locus in N^{gamma_greedy} steps with gamma_greedy <= 1/4 for the route
    to meet its own ceiling. The committed 0.2335 clears 1/4 by 0.017. Adding
    back a bias of the size the random arm's residual suggests (~0.10) would
    put it at ~0.33, i.e. NOT below 1/4 and not even below 1/3. THE ENTIRE
    QUESTION OF WHETHER L4 IS NEAR ITS TARGET TURNS ON A CALIBRATION NOBODY
    PERFORMED. Note also the separate and larger caveat, priced in
    IDEA-20260805-250e50: the descent evaluates delta_E at every visited
    vertex, which at cryptographic scale is not free, so even a clean
    gamma_greedy < 1/4 does not by itself give an algorithm.

    (D) THE TRAPPED-FRACTION NULL, DERIVED BEFORE ANY RUN.
    Greedy descent on a labelling terminates when no neighbour has a strictly
    smaller label. For a UNIFORMLY RANDOM labelling of a 3-regular graph, a
    given vertex is a local minimum with probability 1/4 (it must beat its 3
    neighbours), so the expected number of local minima is N/4. Of these, the
    ones lying in the target set number at most |target| = Theta(N^{1/2}).
    Under the crude model that a greedy walk from a uniform start ends at a
    local minimum chosen with probability proportional to its basin size, and
    that basins are exchangeable under a random labelling, the probability of
    ending in the target is Theta(N^{-1/2}), so
      trapped_fraction_null = 1 - Theta(N^{-1/2}),
    which at N = 203, 324, 478, 611 is roughly 0.93, 0.94, 0.95, 0.96 with the
    implied constant equal to 1. THE COMMITTED MEASURED VALUES ARE 0.8374,
    0.7222, 0.8201, 0.8511. If the null forced value is anywhere near the
    derived one, the real delta_E labelling is doing measurably better than a
    random labelling of the same graph -- which is the first quantity in this
    lane that would be a signal rather than an instrument reading.
    THE MODEL ABOVE IS CRUDE ON PURPOSE AND ITS CRUDENESS IS THE REASON THE
    NULL IS MEASURED RATHER THAN ASSERTED: basin sizes under a random labelling
    are not exchangeable, and the correct comparison is a MATCHED null -- a
    random permutation of the SAME delta-value multiset over the SAME graph,
    which preserves the label distribution exactly and destroys only the
    geometry. That is the null arm of the paired experiment; the derived value
    above is its pre-registered prediction, and it can fail.

    (E) WHAT THE 0.5 THRESHOLD IS. GD-8 records that the M-GAMMA-GREEDY
    definition inherited from EXP-SSIQ-58b642 states a trapped_fraction > 0.5
    exclusion in prose, that no code path implements it, and that all four
    contributing primes exceed it. The threshold has no derivation anywhere in
    this campaign's records. If the null trapped fraction is ~0.95, then a
    0.5 cut excludes every prime whose labelling beats the null by less than a
    factor of 10 in escape probability -- which is to say, all of them,
    including any that carry real signal. The correct object is not a fixed
    threshold at all but the RATIO
      escape_ratio = (1 - trapped_real) / (1 - trapped_null_matched),
    which is scale-free, has forced value 1 under the null, and is directly
    computable from the two arms.

  novelty_status: unverified

  literature_context:
