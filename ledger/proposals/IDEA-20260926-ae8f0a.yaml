    hidden_overhead: The point-halving cost of the level-2 bit, O(1) per leg, MEASURED (not the free residue test a factoring sieve enjoys, IDEA-20260922-153a90 part C).
    tradeoff_note: Precompute filter, embarrassingly parallel across legs and attempts; no memory-time tradeoff.

