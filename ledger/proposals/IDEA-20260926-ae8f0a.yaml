idea:
  id: IDEA-20260926-ae8f0a
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE E -> E/2E -> E/4E QUOTIENT CHAIN AS A TWO-BIT LEG LABEL ON THE
    COFACTOR-4 GROUP: on ECC2K-130's cyclic 2-Sylow Z/4 the chain gives a Z/4
    coset label pi_4 on legs (never on the prime-order targets, where it is
    trivial by Lagrange), turning the per-attempt search into four
    sum-to-target parity cells; measured on a toy cofactor-4 Koblitz sibling as
    a refutation-share of the unsatisfiable column against a cofactor-1 null
  class: mechanism

  claim: >-
    CEILING FIRST. m = 2 at the toy cell where oracle A and rho dominate;
    sota_delta zero, no exponent moved. The record bears on the attempt mix at
    any arity through a two-bit leg label and on ECC2K-130 only via the product
    law: a label that partitions attempts into four parity cells removes at most
    a factor 4 (2 bits) of unsatisfiable-by-parity attempts, which against a
    60-bit gap is nothing, and the m = 3 free-oracle floor 2^68.58 stays above
    rho's 2^60.81 (KN-FIND-aa2efc). The deliverable is a corrected per-attempt
    cost law and the corrected structural reading HOLD-O demanded.

    THE CORRECTED STRUCTURE (HOLD-O). ECC2K-130 has group order 4l with l a
    129-bit prime, so E(F_{2^131}) = S x C with |S| = 4, |C| = l and
    gcd(4, l) = 1 (IDEA-20260922-e3048d part A). Bailey et al. and the seed
    scheme make the 2-Sylow S CYCLIC of order 4 (KN-LIT-661e97; the challenge's
    cofactor is 4 and the reduction is to the order-l subgroup). HOLD-O's
    correction to IDEA-20260922-e3048d is exactly that gcd(4, l) = 1 does NOT
    make every lossy quotient trivial: Z/4 has the proper quotient Z/4 -> Z/2
    (the E/2E map) AND the full Z/4 -> Z/4 label, so the 2-Sylow chain
    E -> E/2E -> E/4E must be ENUMERATED, not asserted trivial. The chain is:
    pi_2 : E -> E/2E = Z/2, the trace-parity map Tr(x) + Tr(a) of
    IDEA-20260913-cedd2f (kernel 2E); and pi_4 : E -> E/4E = Z/4 refining it,
    whose level-2 bit is computed by ONE point-halving step (the
    Fong-Hankerson-Lopez-Menezes / Pornin criterion relayed by cedd2f), so pi_4
    is an O(1)-per-point label, not free the way a residue is
    (IDEA-20260922-153a90 part C prices this at O(i) per point for depth i, here
    i = 2). On the PRIME-ORDER targets pi_4 is identically 0 (targets are in C,
    disjoint from S), so the label lives on LEGS only -- the leg-versus-target
    split that IDEA-20260922-153a90 proves is forced on every standardized
    curve.

    THE OBJECT AND WHAT IT BUYS. Label each factor-base leg P by
    pi_4(P) in Z/4. A decomposition R = P_1 + ... + P_m with R in C forces
    pi_4(P_1) + ... + pi_4(P_m) = 0 in Z/4 (because pi_4 is a group
    homomorphism and pi_4(R) = 0). So of the 4^m sign-and-coset patterns of leg
    labels, only those summing to 0 mod 4 can yield a relation: a 1/4 fraction
    at each fixed (m-1)-tuple. An attempt whose fixed legs already violate the
    Z/4 sum is unsatisfiable BY COSET and is refuted by reading two bits per
    leg, before any solve. THE TRACKED OBJECT is the Z/4 coset label of a leg
    (a lossy projection of the full group element onto S = Z/4); the retained
    two bits propagate deterministically under addition because pi_4 is a
    homomorphism. THE TWO READINGS. E-COSET: on the toy cofactor-4 Koblitz
    sibling the by-coset unsatisfiable share is a measurable near-3/4 of the
    attempts that fix legs violating the sum, and V's per-attempt mean cost
    drops by that share once the label filter is applied; on a cofactor-1 null
    curve (S trivial) the label is constant and the filter is a no-op (share 0
    exactly). E-SUBSUMED: the trace-parity map pi_2 (one bit, level 1) already
    captures all the removable structure and the level-2 refinement pi_4 adds
    nothing measurable, so the point-halving cost of the second bit is not
    repaid. Both are decidable from counts; the honest prior is that pi_2
    carries most of it and pi_4 adds at most the second bit's 1/2.
    Representation class R1; attack stage: relation collection and the
    per-attempt solve, through the attempt mix.

  mechanism: >-
    OBJECT FRAME. Representation R1 (curve point, and its Z/4 coset in the
    cyclic 2-Sylow). Operation set Sigma: translation by factor-base elements
    (Class I partial action) refined by the homomorphism pi_4 : E -> E/4E; this
    is a genuine group quotient of the COMPOSITE-order full group E(F_{2^n}),
    NOT of the prime-order target subgroup. TRICHOTOMY: PARTIAL-ACTION. pi_4 is
    a block system of the full translation action (IDEA-20260901-863e36: the
    lossy objects propagating under a group's regular action are the coset
    partitions of its subgroups; here the subgroup 2^i E), and it is exactly the
    composite-order case IDEA-20260922-153a90 part B identifies as the only side
    where a nontrivial translation-compatible lossy test exists -- the target
    side is closed by Lagrange (part A of 153a90), the leg side is open because
    4 is composite. LOSSY-PROJECTION TEST against Sigma = translation refined by
    pi_4: the projection P -> pi_4(P) in Z/4 discards everything but the 2-Sylow
    coset (l elements of C collapse to each coset representative); it is
    Sigma-compatible because pi_4 is a homomorphism (pi_4(P + Q) = pi_4(P) +
    pi_4(Q)); it is genuinely lossy (|C| = l elements per coset) and not a change
    of coordinates because the four cosets are not interchangeable by any
    factor-base translation staying in one coset. THE ONE OPEN NUMBER
    (docs/object-frame-ideation.md): the orbit/coset-canonicalisation cost is
    the point-halving cost of computing pi_4 -- O(1) for pi_2 (a trace) and O(1)
    for the pi_4 refinement (one halving), charged once per factor-base leg in a
    precompute pass, total O(|V|); and the measured by-coset unsatisfiable share
    it removes. WHY THIS IS NOT IDEA-20260922-e3048d. That record's part A
    CLOSES the group-homomorphism reading of "spend the cofactor" by Sylow
    coprimality and its part B asks a code-read question about whether builders
    already sample all cosets; HOLD-O returned it because it asserted the
    quotient chain trivial. This record ENUMERATES the chain (pi_2 then pi_4),
    prices the level-2 bit by point halving, and turns it into a measured
    leg-label filter with a cofactor-1 null -- the constructive object e3048d
    left for CERTBIN ("any ECC2K-130 measured part goes to CERTBIN", HOLD-O).
    WHY THIS IS NOT 1b16d7/cedd2f. Those use the level-1 bit pi_2 = Tr(x) +
    Tr(a) as a yield/confinement lever on ON-CURVE points; this record adds the
    level-2 bit pi_4 and the Z/4 sum constraint on legs, and states the
    subsumption question (E-SUBSUMED) explicitly rather than assuming the second
    bit helps.
    OFF-LIMITS COMPONENT (docs/object-frame-ideation.md section 2): F2 is the
    family; F6 (endomorphism/automorphism orbit) is used only insofar as pi_4 is
    a named quotient; no orbit representative is tracked as an attack object; the
    factor base is the standard subspace, inside KN-OPEN-020's
    implicit-membership class, not escaped.

  novelty_status: unverified

