  citation_note: >-
    The Z/4 sum constraint and the leg-label filter are this session's
    construction on cedd2f's pi_2 and 153a90's depth-i pricing. The
    point-halving cost is relayed (recalled) and is the one number this record
    does not itself verify; the minimal test measures it (metric below). No web
    search was run.

  assumptions:
    - >-
      Toy cofactor-4 Koblitz sibling: a curve y^2 + xy = x^3 + a x^2 + 1 over
      F_2[t]/(t^n + ...) with n prime and #E = 4 x (odd prime), 17 <= n <= 41,
      constructed and order-verified in-run (the RC-1 curve itself has h = 4 at
      n = 17, A = 97044, B = 126251, #E = 4 x 32603, and is the primary cell).
      A cofactor-1 curve of the same field size is the null.
    - >-
      The 2-Sylow is cyclic Z/4 (verified in-run by checking the 2-torsion
      structure: one rational point of order 2, so S = Z/4 not Z/2 x Z/2). If a
      sampled curve has S = Z/2 x Z/2 it is a separate, recorded stratum
      (IDEA-20260922-e3048d predicts the internal structure does not matter
      beyond |S|; that prediction is tested here).
    - pi_4 is computed by pi_2 (a trace) plus one point-halving step per leg,
      once per leg; the halving success/failure is recorded (some points are
      not halvable, IDEA-20260922-153a90 confounder).
    - Satisfiability decided by the enumeration/root-finding oracle, never by a closure.
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; F6 only as the named quotient
      pi_4; V inside KN-OPEN-020's implicit-membership class; not escaped.

  proof_search_map:
    bottleneck: >-
      Whether the level-2 refinement pi_4 (a Z/4 leg label costing one halving
      per leg) removes a by-coset unsatisfiable share beyond what the level-1
      bit pi_2 already removes, on a cofactor-4 curve, with a cofactor-1 null
      showing the filter is a no-op there.
    baseline_embedding:
      parameter_slice: >-
        The RC-1 curve (h = 4) is the exact primary cell; its archived
        U62/S62/C20 split and the pi_2 = Tr(x) + Tr(a) map are the baseline the
        pi_4 refinement is measured against.
      reproduction_check: >-
        Reproduce pi_2's coset assignment on the archived RC-1 targets and legs
        (it must match cedd2f's Tr(x) + Tr(a)); verify pi_4 refines it (pi_4 mod
        2 = pi_2) on 10^3 sampled points by direct group arithmetic ([2]P coset
        equals pi_2, [4]P = O structure), before any share is read.
    observation_collision:
      observable: The pair (pi_2 label, pi_4 label) per leg and per target; the by-coset unsat-reason class per attempt.
      distinct_preimage_search: >-
        A removed unsatisfiable share under pi_4 could come from (i) the genuine
        Z/4 sum constraint, (ii) pi_2 alone (level 1), or (iii) a size effect.
        Separated by three arms: filter by pi_2 only, by pi_4, and by a random
        two-bit leg label of the same marginal distribution; only (i) shows a
        share for pi_4 beyond pi_2 that the random label does not, and the
        cofactor-1 null must show 0 for all.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The Z/4 coset label pi_4(P) as a two-bit precomputed leg attribute;
          the per-attempt filter rejects any fixed (m-1)-tuple whose partial
          Z/4 sum cannot be completed to 0 by a single leg; completeness (every
          real relation survives, since pi_4(R) = 0) and soundness (rejected
          attempts provably have no relation) are exact.
        predicted_gain: >-
          On the cofactor-4 curve, removal of the by-coset unsatisfiable share
          (predicted up to 3/4 of the coset-violating attempts for pi_4, up to
          1/2 for pi_2 alone); 0 on the cofactor-1 null. No exponent; at most
          2 bits, disclosed as immaterial against rho.
      - transform: observable_fiber
        proposed_object: pi_4 filter, pi_2 filter, and a random two-bit label, on the cofactor-4 curve and the cofactor-1 null.
        predicted_gain: Separates the level-2 contribution from level 1 and from a size artifact, and confirms the null is a no-op.
    quantifier_order: >-
      pi_4 is a homomorphism (FORALL P, Q: pi_4(P + Q) = pi_4(P) + pi_4(Q)),
      exact. The Z/4 sum constraint (FORALL relations with target in C: the leg
      labels sum to 0 mod 4) is exact. Empirical: FOR the cofactor-4 cell and
      the cofactor-1 null, the by-coset shares and the point-halving cost are as
      measured with CP95.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the h = 4 cell, pi_4 removes a by-coset unsatisfiable share of
        phi_4 (measured), of which pi_2 alone removes phi_2, at a point-halving
        cost of c halvings per leg (measured); on the cofactor-1 null both are
        0; the removal is at most 2 bits and does not move rho." Nothing about
        m >= 3, F4, or cost on ECC2K-130 beyond the product-law statement.
      nearby_object_control: >-
        The cofactor-1 null curve (S trivial: the filter MUST be a no-op) and
        the random two-bit label (same marginal, no group meaning).
    proof_obligations:
      - claim: >-
          pi_4 from E to E/4E is a homomorphism and pi_4 mod 2 = pi_2
          (verified on sampled points by group arithmetic).
        responsibility: correctness
      - claim: For any relation with target in the odd-order subgroup, the leg Z/4 labels sum to 0 (pi_4(R) = 0 since R in C).
        responsibility: correctness
      - claim: The 2-Sylow of the primary curve is cyclic Z/4 (one rational 2-torsion point), verified in-run.
        responsibility: baseline
      - claim: The by-coset unsat-reason classifier is exact (an attempt is by-coset iff its fixed legs cannot complete the Z/4 sum), not inferred.
        responsibility: correctness
      - claim: The cofactor-1 null shows a by-coset share of exactly 0.
        responsibility: scope
      - claim: The point-halving cost per leg is measured (field operations, success rate), not assumed from the recalled O(1).
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: by-coset unsatisfiable share removed by pi_4 on the h = 4 cell (fraction of coset-relevant attempts, CP95)
      direction: different
      minimum_effect: >-
        E-COSET iff pi_4 removes a share whose CP95 lower bound exceeds pi_2's
        CP95 upper bound (the level-2 bit adds measurably); E-SUBSUMED iff the
        two intervals overlap (pi_2 already captures it).
    - metric: by-coset share on the cofactor-1 null and under the random two-bit label
      direction: same
      minimum_effect: 'exactly 0 on the null and within CP95 of 0 for the random label; any nonzero value is an instrument defect or a size artifact.'
    - metric: point-halving cost per leg (field operations, and halving success rate)
      direction: different
      minimum_effect: >-
        Reported as measured; the recalled O(1) is confirmed iff the cost does
        not grow with the field beyond per-operation scaling and the success
        rate is near 1/2 per level (halvable points).
    - metric: on-curve relations lost by the pi_4 filter (count)
      direction: same
      minimum_effect: 'exactly 0 (completeness, pi_4(R) = 0); any loss falsifies the filter.'

  minimal_test:
    design: >-
      CELLS. PRIMARY: the RC-1 curve (h = 4, n = 17, A = 97044, B = 126251,
      #E = 4 x 32603) with its cyclic Z/4 2-Sylow verified in-run; m = 2,
      l = 9, V = {deg < 9}. NULL: a cofactor-1 (prime-order) Koblitz-shaped
      curve over the same field, order-verified in-run. Optional second
      cofactor-4 curve with S = Z/2 x Z/2 if constructible, to test
      IDEA-20260922-e3048d's prediction that only |S| matters.
      Targets: 200 subgroup (odd-order) targets by the Stage-1 rule from a
      fresh seed. INSTRUMENT. experiments/EXP-CERTBIN-e94b27/impl/curve.py
      (group law, x-lift) extended with pi_2 (a trace) and pi_4 (pi_2 plus one
      point-halving step; halving via the standard half-trace/quadratic solve),
      oracles_rc1.py for satisfiability, a by-coset unsat-reason classifier, and
      verify by direct curve arithmetic. No closure is needed for the primary
      metric; nothing `missing`, no external solver.
      PROCEDURE. (0) Zero-run: the Z/4 sum constraint and the corrected HOLD-O
      structural reading (delivered here). (1) Verify pi_4 is a homomorphism and
      refines pi_2 on 10^3 sampled points. (2) Precompute pi_4 for every leg in
      V (cost recorded: halvings, success rate, field operations). (3) For each
      target, classify unsatisfiable attempts as by-coset (pi_4 sum cannot
      close), by-parity-only (pi_2 closes but not the level-2 bit), or
      by-non-target; record the shares removed by pi_2 alone and by pi_4. (4)
      Completeness: every satisfiable relation survives both filters, verified
      by curve arithmetic. (5) Repeat on the null and under the random two-bit
      label. SEEDS recorded; instance sets fixed by rule. METRICS (units):
      by-coset share removed by pi_2 and by pi_4 (fractions, CP95); point-halving
      cost per leg (field operations; success rate); on-curve relations lost
      (count); shares on the null and random-label arms. CONTROLS: cofactor-1
      null (filter must be a no-op); random two-bit label (same marginal, no
      group meaning); completeness/soundness by curve arithmetic on every
      counted relation; a RELABELLED Z/NZ generic-group control IS included here
      because a group-structure claim (pi_4 is a homomorphism whose sum
      constrains relations) IS made -- the same 200-attempt filter is run on an
      abstract Z/4 x Z/l group with random point labels, where the by-coset
      share must equal the curve's (the effect is the group structure, not the
      curve). OUTCOME TABLE. POSITIVE (E-COSET, pi_4 share above pi_2, null and
      random-label 0, generic-group control matches): the two-bit leg label is a
      real attempt-mix filter, the corrected cost law is handed forward, and
      HOLD-O's chain is enumerated with a measured level-2 contribution.
      NEGATIVE (E-SUBSUMED, pi_4 not above pi_2): the level-1 bit already
      captures the removable coset structure and the point-halving cost of the
      second bit is not repaid; recorded as a measured obstruction to deepening
      past pi_2 (answering IDEA-20260922-153a90 part C's open number at depth 2,
      cofactor 4). ARTIFACT (null nonzero, generic-group control disagreeing,
      any on-curve relation lost, pi_4 not a homomorphism): instrument or
      derivation broken; void. FALSIFICATION THRESHOLD. E-COSET falsified iff
      pi_4's by-coset share does not exceed pi_2's by more than CP95 width;
      the homomorphism/completeness claims falsified by any counterexample in
      steps 1/4. COST (estimate): implementation medium (pi_4, halving,
      classifier, generic-group control, about 250 lines); compute about 1-2
      CPU-hours (no closures required; group arithmetic on 200 attempts x
      several arms).
    controls:
      - >-
        Cofactor-1 null curve: the filter must be a no-op (share exactly 0).
      - >-
        Random two-bit leg label of matched marginal: no group-aligned removal.
      - >-
        Relabelled Z/4 x Z/l generic-group control: the by-coset share must
        match the curve (group-structure claim is made).
      - Completeness/soundness by curve arithmetic on every counted relation.
      - Second cofactor-4 curve with S = Z/2 x Z/2 if constructible (tests the |S|-only prediction).
    required_metrics:
      - by-coset share removed by pi_2 and by pi_4, per curve (CP95)
      - point-halving cost per leg (field operations; halving success rate)
      - on-curve relations lost by the filter (count)
      - shares on the null, random-label, and generic-group arms

  falsification_conditions:
    - 'E-COSET falsified iff pi_4''s by-coset removed share does not exceed pi_2''s by more than the CP95 width.'
    - 'E-SUBSUMED falsified iff pi_4 removes a share strictly above pi_2 (CP95-separated).'
    - 'The homomorphism claim falsified iff pi_4(P + Q) != pi_4(P) + pi_4(Q) on any sampled pair, or pi_4 mod 2 != pi_2.'
    - 'The filter falsified iff any on-curve relation is lost (completeness), or the cofactor-1 null shows a nonzero by-coset share.'
    - 'The group-structure reading falsified iff the relabelled Z/4 x Z/l control''s share disagrees with the curve''s beyond CP95.'

  confounders:
    - >-
      pi_2 (level 1) is the trace-parity map of cedd2f/1b16d7; the whole
      question is whether the level-2 bit pi_4 adds anything, so pi_2 and pi_4
      shares are always reported separately (the E-SUBSUMED risk).
    - >-
      Point halving fails on some points (IDEA-20260922-153a90 confounder); the
      success rate is recorded, and a failed halving leaves a leg's pi_4
      level-2 bit undetermined, handled as its own stratum, never counted as a
      refutation.
    - >-
      S = Z/4 versus Z/2 x Z/2 changes the label group (Z/4 versus Z/2 x Z/2);
      the primary curve is Z/4 (one rational 2-torsion point) and the internal
      structure is a recorded, tested variable.
    - >-
      A 2-bit removal is immaterial against rho's 60-bit gap; the record makes
      no attack claim and the share is a per-attempt-mix constant only.

  interpretation_limits:
    - Toy tier; one primary curve (h = 4), m = 2. Nothing about m >= 3, cost on ECC2K-130 beyond the product-law statement, or F4.
    - pi_4 is a leg-side quotient of the composite-order group; it is trivial on the prime-order targets (Lagrange, IDEA-20260922-153a90 part A) and makes no claim there.
    - The removal is at most 2 bits; explicitly not target-class under docs/target-result-profile.md and disclosed as immaterial against rho.
    - >-
      KN-OPEN-020 class: the factor base is the scoped-out linear subspace;
      pi_4 is a label on it, not a new factor base.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Coset equidistribution.) The factor-base legs are equidistributed over
        the four Z/4 cosets (up to o(1)), so a fixed (m-1)-tuple of legs
        completes the Z/4 sum to 0 for a 1/4 fraction of single legs, giving a
        by-coset unsatisfiable share of 3/4 of the coset-relevant attempts at
        the pi_4 level and 1/2 at the pi_2 level.
      rigorous_support: >-
        pi_4 is a surjective homomorphism onto Z/4, so its fibres in the full
        group have equal size l; the heuristic is only that the SUBSPACE V
        samples the cosets in near-equal proportion (checkable directly by
        labelling V without any target), imitating equidistribution of a
        homomorphism over a linear family.
      validation_plan: >-
        SAMPLE the pi_4 labels of all of V for l = 6..9 on the primary curve;
        COMPARE the four coset counts to |V|/4; TAIL: the largest deviation.
        TRANSFER: none to n = 131 (which has the same 4l structure but no toy
        access).

  heuristic_note: >-
    The homomorphism property and the Z/4 sum constraint are exact; the
    point-halving cost is relayed (recalled) and MEASURED here; H1 concerns
    only the coset balance of V, computable without targets.

