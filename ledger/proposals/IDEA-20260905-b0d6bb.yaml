    direction: different
    minimum_effect: Full-orbit divisors have the full torsion stabilizer; partial-orbit cases split according to
      their actual stabilizer, not the curve's splitting type alone.
  minimal_test:
    design: A symbolic divisor calculation for ell=2 and ell=3 on a self-generated nonsingular cubic; compare full
      torsion orbit, a proper Galois orbit and an arbitrary partial set. The test ends at factorization through
      quotient, with no pairing target-field computation.
    proposal_only: true
    controls:
