    - >-
      THE AUTOMORPHISM CONFOUND, THE MOST DANGEROUS ONE. On D_0 in {-3, -4} classes
      a degree-1 endomorphism exists. It represents a KNOWN scalar and not k, and it
      is worth exactly sqrt(|Aut|) <= sqrt(6) in the rho constant. Conflating "the
      order contains a short element" with "the coset A_k contains a short element"
      would manufacture a spurious break on exactly the curves the campaign cares
      most about. P5 exists solely to keep the two apart and is not optional.
    - >-
      LEVEL DEGENERACY. Delta is a function of the level alone, so all 72 floor
      curves at p = 4001 share one value. Delta therefore cannot support any
      statement about j-invariants, curve equations, or individual curves, and any
      record citing a Delta difference as a curve difference is making an
      unsupported inference.
    - >-
      THE eps IN THE COUNTING LEMMA. The degree floor is average-case in k. A
      specific instance may have a much shorter representative, and the record's
      cost statements are therefore statements about the typical instance. Every
      downstream use must carry the eps.
    - >-
      SKEWNESS OF n. The coset minimum is bounded below by the counting lemma but
      bounded above by the covering radius, which depends on the reduced binary
      quadratic form of n and can exceed the covolume by up to sqrt(|D_E|) when the
      form is skew. The record uses only the LOWER bound for its obstruction, which
      is the safe direction; any future use of the upper bound must redo the form
      reduction explicitly.
    - >-
      RELAYED EXTERNAL REQUIREMENT. O-EIGEN's quantitative form depends on the
      torsion-versus-degree requirement of the higher-dimensional machinery, which
      was NOT verified this session. Marked in assumptions, gated by Stage 5, and
      carried into F7.
    - >-
      f = 1 CLASSES HAVE NO VARIATION AT ALL. A campaign that measured Delta only on
      trivial-conductor classes would see exact invariance and would conclude the
      opposite of this record. The conductor ladder control exists to prevent that
      and the class's f must be reported with every Delta.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO SPEEDUP, sota_delta ZERO. The record's positive half
      is the EXISTENCE of a class-varying reachable functional; its negative half is
      that the functional is capped at the rho exponent by O-MINK and unusable at
      generic embedding degree by O-EIGEN. Neither half is a cryptanalytic claim.
    - >-
      claim_tier toy for every measured quantity. The (G)/P6 arm computes integers at
      256-bit N, which is a DISTRIBUTIONAL measurement of a multiplicative order and
      must never be described as crypto-scale cryptanalysis.
    - >-
      O-EIGEN IS CONDITIONAL on the relayed form of the external torsion requirement
      and is not settled until the Stage 5 literature check runs. Presenting it as
      unconditional is prohibited.
    - >-
      Delta is a functional of (N, disc End(E)) and of nothing else. It says nothing
      about solving degree, relation yield, factor-base decomposition, Groebner cost,
      or any quantity the ICINV lane has measured, and it neither confirms nor
      contradicts IDEA-20260807-0ff796's arity-2 mean invariance -- different objects.
    - >-
      H-ENDO-001 is USED as the admissibility filter and the reason lambda exists,
      and is NOT retested. KN-FIND-b7e091 is binding and is extended by the C3 audit
      above, not revisited. sqrt(6) remains baseline calibration and never an attack
      (KN-TECH-018).
    - >-
      Nothing here bears on H-STR-002 in either direction -- no factor base, no
      relation, no equivariance -- so GOAL-ENDO-001 pause condition P2 is not
      triggered. Nothing here presumes H-ICINV-6c7920 true or false; no target is
      sampled and no rate is computed, so criterion C4 does not gate this record
      (C4 governs instruments that estimate, and this one does not).

  heuristic_assumptions:
    - id: H1
      statement: >-
        (SHORT-REPRESENTATIVE DENSITY.) For an ordinary E/F_p with End(E) of
        discriminant D_E and prime subgroup order N, the scalars k in Z/N admitting
        an endomorphism alpha with lambda(alpha) = k and Nm(alpha) <= X are
        distributed over Z/N as X * 2 pi / sqrt(|D_E|) uniformly chosen residues:
        i.e. the map alpha |-> lambda(alpha) sends lattice points of bounded norm to
        residues with no bias beyond the counting bound, so
        #{k : deg_min(E, k) <= X} = min(N, 2 pi X / sqrt(|D_E|)) * (1 + o(1)).
      rigorous_support: >-
        RIGOROUS HALF: the UPPER bound #{k : deg_min <= X} <= #{alpha : Nm <= X}
        = 2 pi X / sqrt(|D_E|) + O(sqrt(X)/lambda_1 + 1) is the Gauss-circle count
        and needs no assumption at all; it is the only half the obstruction O-MINK
        uses, so the CLOSURE IS UNCONDITIONAL. The heuristic is the matching LOWER
        bound -- that short endomorphisms do not concentrate on few residues -- which
        imitates the classical equidistribution of lattice points of bounded norm in
        residue classes modulo a prime ideal, the same random model that underlies
        the Deuring correspondence's counting heuristics.
      validation_plan: >-
        WHAT IS SAMPLED: for each of at least 30 curves spanning every level of at
        least three enumerated classes, the EXACT function
        X |-> #{k : deg_min(E, k) <= X}, computed by enumerating all alpha in O_E of
        norm at most X (a Gauss-circle enumeration, trivially cheap at toy N) and
        binning their lambda values -- so H1 is measured directly and not inferred.
        AT WHAT SCALE: N up to ~2^20, where enumerating O(N) lattice points is
        seconds; the committed p = 4001 class as the anchor.
        SHORTCUT THAT MAKES SAMPLING FEASIBLE: no curve arithmetic is needed at all,
        because lambda(alpha) is an O(1) formula in the coordinates of alpha; the
        whole validation is integer arithmetic on a rank-2 lattice, which is why it
        can be pushed to N ~ 2^20 and beyond without a solver.
        PREDICTED DISTRIBUTION COMPARED AGAINST: the empirical count against
        min(N, 2 pi X / sqrt(|D_E|)), as a ratio across at least 20 values of X
        spanning X = N/100 to X = 10N; and the empirical distribution of lambda over
        residues against the uniform distribution on Z/N, by chi-square DISTANCE
        reported as a distance and not as a test.
        TAIL CONSISTENCY CHECKS: the SMALLEST observed deg_min over all k (the
        extreme that O-MINK's exceptional set is about) against the counting
        prediction that the minimum over N residues is ~sqrt(|D_E|)/(2 pi) times the
        smallest lattice norm; and the count of residues with deg_min below
        Delta/100, against the predicted N/100.
        SAMPLED PARAMETERS RECORDED: p, t, D, D_0, f, f_E, N, level, and the exact
        commit of the enumeration code.
        TRANSFER ASSUMPTION, STATED: the lower half of H1 is validated only at toy N;
        the UPPER half, which is the one the closure uses, is a theorem at every N
        and needs no transfer. That asymmetry is the reason the closure is stated as
        unconditional while H1 is still listed.
    - id: H2
      statement: >-
        (EMBEDDING-DEGREE GENERICITY, CONDITIONED ON SMALL |D_0|.) For (p, t, N)
        triples with 4p - t^2 = |D_0| f^2 and |D_0| in a fixed small set, the
        multiplicative order m = ord_N(t - 1) satisfies log m / log N -> 1 in the
        same sense and at the same rate as for the order of a uniformly random
        residue modulo N; i.e. conditioning on small |D_0| does not bias the
        embedding degree downward.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the identity m = ord_N(p) = ord_N(t - 1) with
        |t - 1| <= 2 sqrt(p) + 1 by Hasse, derived in IDEA-20260807-6c7540, so m is
        the order of a comparatively SMALL integer modulo a large prime. CLASSICAL
        DISTRIBUTION STATEMENT IMITATED: Erdos-Murty (1999), that the order of a
        fixed integer a modulo p exceeds p^{1/2 + eps(p)} for all but o(pi(x))
        primes -- cited here at second hand through IDEA-20260807-6c7540 and NOT
        independently verified this session. WHAT IS HEURISTIC: the conditioning on
        small |D_0|, which is a genuine restriction of the (p, t) sample and could in
        principle correlate with the factorisation of N - 1.
      validation_plan: >-
        WHAT IS SAMPLED: (p, t, N) triples generated directly, with NO CURVE
        CONSTRUCTED, by choosing |D_0| in {3, 4, 7, 8, 11}, choosing f, setting
        4p - t^2 = |D_0| f^2, and keeping cases where p + 1 - t has a large prime
        factor N. Existence of a curve for each admissible (p, t) is guaranteed by
        Deuring/Honda-Tate/Waterhouse, so the sampled triples are not fictional.
        AT WHAT SCALE: N of 128 and 256 bits -- CRYPTOGRAPHIC SIZE, which is possible
        here and for almost nothing else in this campaign, precisely because no curve
        is built. At least 10^4 triples per |D_0| stratum.
        SHORTCUT: IDEA-20260807-6c7540's pair-sampling shortcut, reused verbatim.
        PREDICTED DISTRIBUTION COMPARED AGAINST: the empirical CDF of log m / log N
        in each small-|D_0| stratum against (NULL A) the same statistic for
        ord_N(a) with a a uniformly random residue, and against (NULL B) the
        shuffled pairing ord_{N'}(t - 1) with N' an unrelated prime of the same size.
        TAIL CONSISTENCY CHECKS: the count of triples with m < N^{1/2} against the
        heuristic density, and the SMALLEST observed m per stratum against the
        smallest observed under each null at matched sample size -- the tail is the
        whole question, since a single family of small-m small-|D_0| classes is what
        F6 is about. Where N - 1 does not factor, a certified LOWER bound on m is
        recorded instead of a value and those cases are reported separately, never
        dropped.
        TRANSFER: the measurement IS at cryptographic size for the statistic
        measured; it transfers to no cryptanalytic claim and the record says so.

  reachability_gate: >-
    T5 IS EVALUATED IN FULL AND IT PASSES, WHICH IS WHY THE RECORD MATTERS.
    BRANCH (ii) LOCALITY: the minimiser is the crater; crater membership is decided
    by the count of F_p-rational ell-isogenies at the vertex, a purely local test
    (H-VOLC-dff1f8 HEUR-VOLC-1, contracted for measurement in EXP-VOLC-9f5571). No
    global address is needed, so the CSIDH vectorization problem does not arise.
    BRANCH (i) COST: the ascent from any vertex is v_ell(f_E) <= log_2 f = O(log p)
    ell-isogeny steps, each polynomial in log p; the walk length is reported as a
    DISTRIBUTION OVER VERTICES and never as a point estimate, discharging committed
    failure mode N5. Against the p^{1/2} rho baseline, O(log p) is free.
    IDEA-20260807-c36472's IDENTIFICATION barrier -- h ~ p^{1/2} functional
    evaluations to find the minimiser -- DOES NOT BIND, because Delta is predictable
    from a cheap vertex invariant (the level), which is precisely the third escape
    route that record names and the first time this campaign has a functional that
    uses it. IDEA-20260811-5e58dc's admission threshold is also cleared, at 1.53
    against 1. AND THE LANE STILL CLOSES, on O-MINK and O-EIGEN -- which is the
    record's actual content: this campaign's reachability gate was never the binding
    constraint for the right functional, and naming the constraint that IS binding
    is worth more than another functional that fails the gate.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT IS CLAIMED, AND THE RECORD'S CONTENT IS A DERIVED CAP.
      Stated exactly: the endomorphism-representation route, executed by
      meet-in-the-middle over the two halves of alpha, costs
      Theta(sqrt(Delta(E))) = Theta(sqrt(N sqrt(|D_E|))) group-and-isogeny
      operations. At the crater of a small-|D_0| class that is Theta(p^{1/2}); at
      the floor it is Theta(f^{1/2} p^{1/2}) = up to Theta(p^{3/4}). So class
      minimisation improves the route by the exponent-scale factor f^{1/2} -- up to
      p^{1/4} -- and lands EXACTLY on the rho exponent, never below it. The floor is
      set by the Gauss-circle counting lemma and is unconditional.
    memory_exponent: >-
      Theta(sqrt(Delta(E))) = Theta(p^{1/2}) at the crater for the claw table, against
      rho's O(1) per processor. THIS IS THE DECISIVE PARETO STATEMENT: the route
      ties rho on time at its very best and loses to it by p^{1/2} on memory, so it
      is strictly dominated at every parameter choice and there is no interpolation
      that rescues it. Stated here rather than buried, because a route that merely
      "ties" would still be interesting if it were memory-free, and this one is not.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory per processor (KN-TECH-001, KN-TECH-006), negation
      discount included; its automorphism-discounted variant on CM curves at a
      constant factor at most sqrt(6) (KN-TECH-018); BSGS at sqrt(N) time and
      sqrt(N) memory (KN-TECH-031). The proposed route ties (i) on time at best and
      is dominated by it on memory; it is dominated by (iii) on nothing but is not
      better than it either.
    hidden_overhead: >-
      Three things hide in the statement and all are disclosed. (1) The eps of the
      counting lemma: the degree floor is average-case in k, so the p^{1/2} cap is a
      typical-instance cap. (2) The "isogeny operation" in the claw is not a group
      operation: enumerating and evaluating isogenies of degree up to sqrt(Delta)
      carries a polynomial factor in log p and, for non-smooth degrees, a further
      cost that the smoothness-splitting template hides in o(1) and that this record
      does NOT assume away -- if the required degrees are not smooth, the route is
      worse than stated, never better. (3) O-EIGEN's quantitative form is relayed and
      is gated on the Stage 5 external check.
    tradeoff_note: >-
      The claw admits the van Oorschot-Wiener interpolation, giving time
      sqrt(Delta^3/w) with memory w; at w = 1 that is Delta^{3/2} ~ p^{3/2},
      catastrophically worse than rho, and at w = sqrt(Delta) ~ p^{1/2} it reaches
      the p^{1/2} tie. So THE ENTIRE TRADEOFF CURVE LIES ON OR ABOVE THE RHO CURVE,
      touching it only at the maximum-memory endpoint. Parallelisation does not
      change this: both parallelise linearly, so the deficit is invariant under
      adding processors.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW OF THE
    PRIME-FIELD FRONTIER, AND NOT LEFT NULL. (i) Parallel Pollard rho with
    distinguished points: 0.886 sqrt(N) time, O(1) memory per processor, linear
    parallel speedup (KN-TECH-001, KN-TECH-006). THE PROPOSED ROUTE TIES IT ON TIME
    AT THE CRATER OF A SMALL-|D_0| CLASS AND LOSES TO IT BY p^{1/2} ON MEMORY, hence
    is strictly Pareto-dominated. (ii) The automorphism-discounted variant on CM
    curves (KN-TECH-018): dominates likewise, and additionally supplies the sqrt(6)
    that this record must not double-count. (iii) BSGS at sqrt(N) time and sqrt(N)
    memory (KN-TECH-031): the proposed route ties BSGS on BOTH axes at the crater and
    is worse than it everywhere else in the class, which is the sharpest single
    domination statement available -- the route is, at its absolute best, BSGS with
    extra steps. (iv) On data/queries the route reads the full curve equation, the
    endomorphism ring and the volcano, where rho reads only the group. dominated_by
    is therefore NOT null and was not left null.
  sota_delta: >-
    ZERO on every attack axis: rho stays at 0.886 sqrt(N) with O(1) memory, BSGS
    stays at sqrt(N)/sqrt(N), the ECDLP exponent stays 1/2, and no route proposed
    here goes below any of them. The delta is a STRUCTURAL and CLOSURE delta and is
    stated quantitatively on four axes. (1) It exhibits the campaign's first
    within-class cost functional whose class range is a FACTOR OF f <= 2 sqrt(p/|D_0|)
    rather than O(N^{-1/2}) relative -- an exponent-scale variation where every prior
    candidate was a percent-scale one, with an exact five-valued multiset
    1 : 2 : 4 : 8 : 16 on the campaign's own committed class. (2) It is the first
    functional in this campaign to PASS the T5 reachability gate on both branches,
    at O(log p) ascent cost against a p^{1/2} baseline, and the first to clear the
    admission threshold of IDEA-20260811-5e58dc (1.53 against the required 1, versus
    0.26 for the campaign's headline functional). (3) It nevertheless closes, with
    two named obstructions and explicit deficits: O-MINK caps the associated
    meet-in-the-middle at exactly p^{1/2} time and p^{1/2} memory via an
    unconditional Gauss-circle bound, and O-EIGEN identifies the missing ingredient
    as the complementary Frobenius eigenspace, available only at embedding degree
    m = ord_N(t - 1) = O(polylog), a CLASS-INVARIANT quantity. (4) It supplies a
    discriminating measurement that runs at 128- and 256-bit N in seconds with no
    curve constructed, which almost nothing else in this campaign can do.

