  falsification_conditions:
    - >-
      F1 (GATE). P1 fails: lambda is not a homomorphism as implemented, or
      alpha(P) != [lambda(alpha)]P, or covol(n) disagrees with direct Gauss
      reduction. Implementation defect; the run is INVALID and returns to the
      executor. Not evidence about the functional.
    - >-
      F2 (THE IDENTITY FAILS). P2 does not return exactly five values in ratio
      1 : 2 : 4 : 8 : 16 with the committed multiplicities. Then either the
      committed level distribution is wrong -- which would be a defect in a
      certified artifact and is more important than anything else here -- or
      Delta is not the covolume the record says it is. Either way the record is
      SUPERSEDED, not amended, and the discrepancy is the finding.
    - >-
      F3 (THE FUNCTIONAL IS NOT WORTH ANYTHING EVEN ON ITS OWN TERMS). P3 returns a
      class extremal budget below 1. The record's central claim -- that Delta is the
      first functional to clear the admission threshold -- is false and the record is
      withdrawn.
    - >-
      F4 (A NULL FIRES). Any of the three forced-value nulls of P4 returns more than
      one Delta. The implementation is reading something other than the endomorphism
      ring and every class number is void.
    - >-
      F5 (THE NEARBY OBJECT BREAKS THE METHOD). P5 returns more than sqrt(|Aut|) on
      a j = 0 curve. GOAL-ENDO-001 pause condition P3 fires: work stops for an
      independent review-adversarial session before any record states the excess,
      and for review-breakthrough at max effort before any record calls it a break.
    - >-
      F6 (THE LANE OPENS, AND THIS IS THE OUTCOME WORTH THE MOST). P6 shows a
      systematic excess of small embedding degree in the small-|D_0| stratum against
      BOTH nulls. Then O-EIGEN's generic-case argument does not cover the very
      classes where O-MINK is weakest, the two obstructions fail together on an
      identifiable family, and the correct next action is a scoped contract on that
      family -- with the standing caveat that low-embedding-degree curves are
      already MOV-weak, so the finding would be about the SIZE of that family and
      not about a new attack.
    - >-
      F7 (THE EXTERNAL INGREDIENT IS MISSTATED). Stage 5 finds that some published
      higher-dimensional embedding requires torsion strictly below the isogeny
      degree, or requires only a rank-1 eigenspace. Then O-EIGEN as stated is wrong,
