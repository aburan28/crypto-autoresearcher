      STAGE 1 (MINUTES, HARD GATE). P1's symbolic and numeric agreement checks on
      >= 20 curves, reusing harness/isogeny_class.py and the Velu machinery
      EXP-VOLC-9f5571 already contracts.
      STAGE 2 (MINUTES, NULL-FIRST). P4: the f = 1 class, the gauge orbit and the
      horizontal walk, all three forced to a single Delta, written to the record
      before Stage 3 is read.
      STAGE 3 (MINUTES). P5: the j = 0 nearby-object control, with the sqrt(3)
      separation between "a short endomorphism exists" and "a short endomorphism
      representing k exists" made explicit in the run record.
      STAGE 4 (SECONDS, AND IT RUNS AT CRYPTOGRAPHIC SIZE). P6: sample (p, t, N)
      triples with 4p - t^2 = |D_0| f^2 for |D_0| in {3, 4, 7, 8, 11}, keep those
      with a large prime N | p + 1 - t, compute ord_N(t - 1) where N - 1 factors and
      a certified lower bound otherwise, and compare against both nulls. Integer
