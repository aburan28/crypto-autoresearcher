  novelty_screen:
    method: >-
      Repository greps run 2026-08-11 with the Grep tool: patterns
      "Kani|SIDH|Castryck|higher-dimensional|abelian surface|Zarhin|superspecial"
      repository-wide and restricted to ledger/proposals/IDEA-2026080[789]-*;
      "min.{0,20}deg.{0,20}(alpha|endomorphism)|minimal endomorphism|shortest
      vector.{0,30}End|closest vector|CVP|N\\(alpha_min\\)|alpha_min" over
      ledger/proposals; "multiplicative order|ord\\(lambda|GLV|Wiener|Zuccherato|
      canonical representative" over ledger/proposals; plus the nine
      RQ-EWALK-8fa147 proposals read by title. Full reads: IDEA-20260807-0ff796,
      IDEA-20260807-6c7540 (head), H-VOLC-dff1f8, H-ICINV-d5e351, DECOMPOSITION.md,
      KN-FIND-b7e091.
    grep_results: >-
      "Kani" appears in exactly one proposal, IDEA-20260807-7d8ba9, which is in the
      SUPERSINGULAR/SQISIGN lane and classifies published schemes by the auxiliary
      data they expose; it contains no ordinary curve, no ECDLP, no Frobenius
      eigenspace and no embedding degree. "alpha_min" appears only in H-VOLC-dff1f8's
      T4 assumption as N(alpha_min) ~ |D_0| f_E^2 / 4 -- the minimum of the norm form
      on the ORDER, separated above as a different quantity by a factor of N. "CVP"
      appears in IDEA-20260807-8cdc79 (the CSI-FiSh relation lattice, a class-group
      object, not End(E)) and IDEA-20260805-d66193 (a relayed external claim). The
      nine EWALK proposals all treat the endomorphism as a WALK SYMMETRY and are
      separated above. No record defines lambda : End(E) -> Z/N, the coset A_k, or
      any covolume of an ideal above N.
    external_check_not_done: >-
      NOT CHECKED AGAINST EXTERNAL LITERATURE THIS SESSION, AND THE RECORD IS
      CONDITIONAL ON THAT GAP. The crypto-kb MCP retrieval index is configured
      :memory: and empty; WebSearch and WebFetch resolve to a Bedrock-backed model
      and were REFUSED under AGENTS.md rule 16 rather than invoked. Nothing about
      Kani's criterion, the SIDH attacks, or Erdos-Murty was verified here, and every
      such statement in this record is marked RELAYED. Absence of a corpus hit is not
      evidence that something was not tried.
    specific_external_check_that_would_settle_it: >-
      THREE CHECKS, ALL BLOCKING BEFORE ANY WRITE-UP, ALL CHEAP.
      (1) The exact torsion requirement of Kani-style higher-dimensional embeddings:
      Castryck-Decru, Maino-Martindale, Robert (dimension 4/8 with Zarhin's trick),
      and any follow-up -- specifically whether ANY published embedding recovers an
      isogeny from its action on a CYCLIC subgroup of order below the degree, rather
      than on full N'-torsion above the degree. A positive hit REFUTES O-EIGEN as
      stated and reopens the crater of small-|D_0| classes; that is F7 and it would
      be the most valuable outcome of the check.
      (2) Whether the reformulation of ECDLP as "find a bounded-norm element of a
      coset of a norm-N ideal in an imaginary quadratic order" is published --
      keywords: "elliptic curve discrete logarithm endomorphism representation",
      "CM order coset short vector discrete logarithm", "Frobenius eigenspace
      reconstruction". A positive hit makes the reduction an ADAPTATION with a
      citable source and probably supplies a better analysis of the exceptional set.
      (3) Erdos-Murty as cited at second hand through IDEA-20260807-6c7540, needed
      for H2's comparison distribution.
      Whatever is found, positive or negative, is to be logged in
      knowledge/literature/ with precise citation and with unverified claims marked
      as such, per this session's write constraints being lifted.
    conclusion: >-
      UNVERIFIED. None of the ingredients is claimed novel: lambda is elementary,
      the covolume is elementary, Kani is external and relayed, the embedding-degree
      identity is this corpus's own. What is claimed is the ASSEMBLY -- Delta as a
      class-varying attack-cost functional with a passed T5 gate and two named
      obstructions -- and that claim rests on the greps above and on no external
      check at all.

  honest_prior_of_survival: >-
    0.95 that Stage 0's exact multiset prediction P2 holds (it is arithmetic on a
    committed level distribution and an elementary covolume). 0.9 that P1's algebra
    and geometry agree. 0.85 that the counting-lemma obstruction O-MINK survives
    adversarial review -- the residual risk is the skewness of n, which the record
    handles by using only the lower bound, and the smoothness of the claw degrees,
    which the record declines to assume. 0.6 that O-EIGEN survives Stage 5's
    literature check in the quantitative form stated; this is the lowest number in
    the record and it is deliberately low, because the external machinery has moved
    fast since 2022 and a requirement stated from memory is exactly the kind of
    thing that turns out to have been weakened. 0.1 that P6 shows a small-embedding-
    degree excess in the small-|D_0| stratum, which would be the branch worth the
    most and which the record is designed to detect rather than to explain away.

