idea:
  id: IDEA-20260811-c72830
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  title: >-
    THE ENDOMORPHISM-REPRESENTATION COST Delta(E) = N*sqrt(|disc End(E)|)/(2 pi):
    the campaign's FIRST class-varying cost functional that is exponent-scale
    (it varies by the full conductor f, up to 2 sqrt(p/|D_0|), inside one class),
    exactly computable from public data with no k and no sampling, minimised
    exactly at the crater, locally detectable and reachable in O(log p) ascending
    steps -- so T5 PASSES -- and NEVERTHELESS closed, by two independent named
    obstructions with a p^{1/2} and a p^{1/2}-scale deficit respectively: a
    rigorous Gauss-circle counting bound that pins Delta below by ~N sqrt(|D_E|)
    for all but an eps-fraction of scalars, capping every meet-in-the-middle
    endomorphism-reconstruction at exactly the rho exponent; and the fact that
    every Kani-style higher-dimensional reconstruction needs the FULL N-torsion
    while the k-dependent data lives only on the Frobenius eigenspace E[n], whose
    complement E[n-bar] is defined over F_{p^m} with m = ord_N(t-1) the embedding
    degree -- a CLASS-INVARIANT quantity, so the gate that would make the
    class-varying functional usable is exactly the one the class cannot move
  class: mechanism

  claim: >-
    (A) THE FUNCTIONAL, AND WHY IT IS THE RIGHT OBJECT. Let E/F_p be ordinary,
    G subset E(F_p) of prime order N, Q = [k]P, and O_E = End_{F_p}(E) an order of
    discriminant D_E = D_0 f_E^2 with f_E | f and D = D_0 f^2 = t^2 - 4p. Because
    Frobenius acts trivially on G, the map
        lambda : O_E -> Z/N,   determined by  pi |-> 1,
    is a surjective ring homomorphism with kernel a prime ideal n of norm N, and
    alpha in O_E acts on G as multiplication by lambda(alpha). THIS IS H-ENDO-001
    USED, NOT RETESTED: the scalar action is exactly what makes lambda(alpha)
    computable in O(1) from alpha's coordinates and the public data (t, p, N,
    D_0, f_E), with no discrete logarithm anywhere.
    Define the ENDOMORPHISM-REPRESENTATION COST
        Delta(E) := N * sqrt(|D_E|) / (2 pi) = N * f_E * sqrt(|D_0|) / (2 pi),
    equivalently  Delta(E) / N = sqrt(|disc End(E)|) / (2 pi).
    Delta is a functional of the CURVE alone: it contains no k, no target, no
    factor base, no sampler and no estimator, and it is computed by three integer
    operations once f_E is known.

    (B) WHAT Delta MEANS: A RIGOROUS LOWER BOUND ON REPRESENTING THE SECRET SCALAR
    BY AN ENDOMORPHISM. Write A_k := {alpha in O_E : lambda(alpha) = k}, a coset of
    n, and deg_min(E, k) := min{ Nm(alpha) : alpha in A_k, alpha != 0 }.
    COUNTING LEMMA (rigorous; Gauss circle in a rank-2 lattice of covolume
    sqrt(|D_E|)/2): #{alpha in O_E : Nm(alpha) <= X} = 2 pi X / sqrt(|D_E|)
    + O(sqrt(X) / lambda_1(O_E) + 1). Since each alpha represents exactly one
    scalar, the number of residues k in Z/N admitted by ANY alpha of norm at most
    X is at most that count. Hence FOR EVERY eps in (0, 1), FOR ALL BUT AT MOST
    eps*N SCALARS k,
        deg_min(E, k)  >=  eps * Delta(E) - O(error).
    So Delta is, up to the eps and the stated error term, the floor on the degree
    of any endomorphism that represents the secret scalar on this curve. Nothing
    in this lemma is heuristic and nothing in it uses k.

    (C) THE CLASS-VARIATION, WHICH IS THE CAMPAIGN'S TARGET SHAPE AND WHICH NO
    PRIOR RECORD EXHIBITS. Inside a fixed F_p-isogeny class, D_0 and N are fixed
    (T4) and f_E ranges over the divisors of f realised by the volcano levels. So
        Delta(crater) / Delta(floor) = 1 / f,   with  f <= 2 sqrt(p / |D_0|).
    Delta is therefore NON-CONSTANT across the class by a factor that is
    EXPONENT-SCALE -- up to p^{1/2} -- and it is minimised EXACTLY at the crater
    (f_E = 1, the maximal order). Every prior candidate this campaign has measured
    is an averaging functional whose class fluctuation is O(N^{-1/2}) relative;
    Delta's class fluctuation is a factor of f. Evaluated on the campaign's own
    committed p = 4001, t = 30 class (D = -59 * 16^2, f = 16, levels
    {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} so f_E = 2^level), Delta ranges over a factor
    of 16, its class coefficient of variation is 0.486, and its CLASS EXTREMAL
    BUDGET in the sense of IDEA-20260811-5e58dc is 0.486 * sqrt(2 ln 138) = 1.53,
    which CLEARS the admission threshold of 1 that the campaign's own
    decomposition-rate functional misses by a factor of ~6.

    (D) T5 PASSES, AND THIS IS THE FIRST TIME IT DOES. Both branches of the
    reachability gate are satisfied for Delta, and neither is assumed:
      BRANCH (ii), LOCAL DETECTABILITY. The minimiser is the crater, and crater
      membership is decided by the count of F_p-rational ell-isogenies from a
      vertex -- H-VOLC-dff1f8's HEUR-VOLC-1, whose measurement is already contracted
      in EXP-VOLC-9f5571. It is a purely local test at the vertex.
      BRANCH (i), CHEAP REACHING. Ascending from any vertex to the crater takes
      v_ell(f_E) <= log_2 f = O(log p) ell-isogeny steps, each polynomial. No
      vectorization instance arises, because the destination is characterised by a
      LOCAL PROPERTY (maximal order) rather than by a global address -- which is
      precisely the escape DECOMPOSITION.md T5 names and which no functional in
      this campaign has previously been able to use.
    So the campaign's target min_{E' ~ E} C(E') EXISTS, is exponent-scale, is
    identified without enumerating the class, and is reached in O(log p) steps.
    THE VARIANCE-AND-REACHABILITY QUESTION OF RQ-ICINV-475b5e IS ANSWERED
    AFFIRMATIVELY FOR THIS FUNCTIONAL. What follows is why that is still not an
    attack, stated with the same precision.

    (E) OBSTRUCTION O-MINK (THE DEGREE FLOOR CAPS EVERY MEET-IN-THE-MIDDLE AT
    EXACTLY THE RHO EXPONENT). The natural exponent-first attack on "find alpha in
    A_k of degree about d" is the Wesolowski template: split alpha = gamma . beta
    into two isogenies of degree about sqrt(d) each, enumerate both halves, and
    join by a codomain-keyed collision table (claw finding). The number of ideals
    of O_E of norm at most X is ~ X (up to the class-number density constant), so
    each half has ~ sqrt(d) candidates and the claw costs ~ sqrt(d) time and
    memory. By (B), d >= eps * Delta(E) >= eps * N * sqrt(|D_0|) / (2 pi) even at
    the crater, so sqrt(d) >= c * sqrt(N) = c * p^{1/2}. THE MEET-IN-THE-MIDDLE
    THEREFORE TIES POLLARD RHO AT p^{1/2} AND NEVER BEATS IT, with the additional
    penalty that it needs p^{1/2} memory where rho needs O(1) -- so it is strictly
    Pareto-dominated. The crater's factor-f improvement moves the constant, moves
    the cost from f * p^{1/2}-ish down to the p^{1/2} floor, and cannot go below
    it, because the floor is set by the covolume of an ideal of norm N in a rank-2
    lattice and no curve in any class has a smaller one. NAMED OBSTRUCTION: the
    coset of the scalar k in End(E) has covolume N sqrt(|D_E|)/2, so representing
    k by an endomorphism costs at least ~N in degree, and half of that in a
    meet-in-the-middle is exactly the birthday exponent.

    (F) OBSTRUCTION O-EIGEN (THE HIGHER-DIMENSIONAL MACHINERY CANNOT SEE k,
    AND THE REASON IS THE EMBEDDING DEGREE). Kani-style reconstruction -- the
    ingredient that took SIDH from p^{1/4} to polynomial time and is the single
    most exponent-moving external result in isogeny cryptanalysis since 2022 --
    recovers an isogeny of degree d from its action on E[N'] with N' > d, by
    building a maximal isotropic kernel {([a]R, phi(R)) : R in E[N']} of order
    N'^2 inside a product abelian surface. Applying it here fails for a reason
    that is structural rather than technical:
      (F1) The k-dependent data available is Q = [k]P, i.e. the action of the
      unknown endomorphism on G = E[n] ONLY. G is the Frobenius eigenspace for
      eigenvalue 1; it is cyclic of order N and is ISOTROPIC for the Weil pairing,
      so EVERY subgroup of G x G is isotropic and the isotropy condition -- the
      condition Kani's criterion uses to select a kernel -- is VACUOUS on this
      eigenspace and carries zero information about k. Moreover G x G itself is
      maximal isotropic in (E x E)[N] and is completely k-independent: naming it
      requires neither P nor Q. The k-dependent subgroup <(P, Q)> has order N,
      exactly half the rank needed for an (N, N)-isogeny of principally polarized
      abelian surfaces.
      (F2) Supplying the missing half requires E[n-bar], the complementary
      Frobenius eigenspace, on which pi acts as multiplication by p. E[n-bar] is
      defined over F_{p^m} with m = ord_N(p) = ord_N(t - 1) -- the EMBEDDING
      DEGREE, in the exact form IDEA-20260807-6c7540 derives. So the full N-torsion
      is computable only on low-embedding-degree curves, which are precisely the
      curves MOV/Frey-Ruck already breaks (lane L8), and the two routes coincide
      rather than compose.
      (F3) THE PUNCHLINE FOR THIS CAMPAIGN. m = ord_N(t - 1) depends only on
      (N, t), hence is EXACTLY CONSTANT ON THE ISOGENY CLASS. So the functional
      that varies within the class (Delta, by a factor f) and the gate that decides
      whether it can be used (the embedding degree) are ORTHOGONAL: the class can
      move the first by an exponent and cannot move the second at all. That
      separation is the cleanest statement this campaign can make about its own
      organising question, and it is derived rather than measured.

    (G) THE CHEAP, CRYPTO-SCALE-VALIDATABLE DISCRIMINATOR, WHICH IS THE POINT OF
    FILING RATHER THAN MERELY ARGUING. O-MINK and O-EIGEN would BOTH fail
    simultaneously exactly on a class with (i) |D_0| = O(1) -- so that the crater's
    Delta/N = sqrt(|D_0|)/(2 pi) is at or below the available torsion budget -- AND
    (ii) small embedding degree m = ord_N(t - 1). Whether such classes are rare at
    the rate a random model predicts, or over-represented, is DECIDABLE BY INTEGER
    ARITHMETIC ON (p, t, N) TRIPLES WITH NO CURVE CONSTRUCTED, using exactly the
    sampling shortcut IDEA-20260807-6c7540 establishes: choose p, choose t with
    4p - t^2 = |D_0| f^2 for |D_0| in a small set, keep the cases where p + 1 - t
    has a large prime factor N, and compute ord_N(t - 1). PREDICTED (and the
    prediction is the classical one this program has never checked here):
    ord_N(t - 1) is a large divisor of N - 1 for essentially all of them, in
    agreement with the Erdos-Murty regime for the order of a small integer modulo a
    large prime, so the two obstructions never fail together. OBSERVING A
    SYSTEMATIC EXCESS OF SMALL m AMONG SMALL-|D_0| DEEP-CONDUCTOR CLASSES WOULD
    OPEN THE LANE, and the record commits to reporting that branch. This test runs
    at 256-bit N and costs seconds.

  resource_label: >-
    R3 (End(E) as a ring: the lattice O_E, the ideal n, the norm form) as the
    functional's own resource; R5 (ell-torsion for ell != N as a Galois module) and
    R7 (pairings / embedding degree) as the resources the functional would NEED to
    become usable and which obstruction O-EIGEN shows are unavailable; R4 (the
    isogeny graph) only as the index set along which f_E varies and the ascent is
    performed.
  admissibility: >-
    admissible_as_a_functional_inadmissible_as_an_attack_and_the_record_says_which
  admissibility_argument: >-
    THE FILTER IS APPLIED HONESTLY AND IT CUTS. DECOMPOSITION.md section 2 records
    that a lane whose only use of phi is to apply it to points of G is inadmissible
    on its face, and that R3-only lanes sit on the wrong side of the filter by
    construction (L6). Delta itself is admissible as a MEASURED FUNCTIONAL: it is a
    property of the ring O_E and of the ideal n, invisible to any generic
    group-operation algorithm, and computable from public curve data. But the only
    known route from a small Delta to an ECDLP advantage passes through
    reconstructing alpha from its torsion action, which needs E[N] and therefore
    R5/R7 -- and O-EIGEN is exactly the statement that R5/R7 are unavailable at
    generic embedding degree. So the record's own conclusion is that the lane is
    admissible to MEASURE and closed to EXPLOIT, and the boundary between the two
    is the embedding degree.
    C3 AUDIT (RQ-GGMB-6eaabc), RUN HERE RATHER THAN DEFERRED. Two oracles could be
    read out of this record. (i) A DELTA ORACLE returning Delta(E): trivially
    simulable without any group access at all, since Delta is a function of public
    integers (N, D_0, f_E); it is closed and it is also useless, and this is stated
    so no downstream record mistakes a computable functional for an oracle
    advantage. (ii) A REPRESENTATION ORACLE returning alpha in A_k of minimal
    degree: NOT GGM-simulable and NOT closed by KN-FIND-b7e091 -- but it is
    EQUIVALENT TO ECDLP, in both directions and in polynomial time, because
    lambda(alpha) = k is computable from alpha in O(1) and, conversely, given k the
    minimal alpha is found by Gauss reduction of a rank-2 coset. That equivalence
    is the third obstruction and it is the reason (E)'s meet-in-the-middle is the
    only non-circular route: the representation oracle is not a new resource, it is
    the problem restated. KN-FIND-b7e091 is treated as binding and is extended, not
    revisited. H-ENDO-001 is USED as the reason lambda exists and is not retested.

  discriminated_from:
    - >-
      H-VOLC-dff1f8 assumption [fact] T4, which already records
      "N(alpha_min) ~ |D_0| f_E^2 / 4" as a within-class-varying quantity. THAT IS A
      DIFFERENT QUANTITY AND THE DIFFERENCE IS A FACTOR OF N. N(alpha_min) is the
      minimum of the norm form on the ORDER O_E itself -- the shortest nonzero
      endomorphism, which represents the scalar lambda(alpha_min) and NOT k.
      Delta(E) is the minimum over the COSET A_k of the scalar that actually
      matters, whose covolume is N times larger. The campaign has tracked the
      former as a covariate to regress relation density against; no record anywhere
      defines, computes, or uses the latter, and only the latter is a cost.
    - >-
      IDEA-20260807-ebcae6 (the sqrt(|Aut|) ceiling stated as a theorem: a rho walk
      can be quotiented only by a group with equal-size orbits AND an O(1) canonical
      representative, hence by the unit group of End(E), hence by at most 6) and
      IDEA-20260807-18d2f7 (the quotient ladder; canonicalisation costs h per step
      and binds at h > 6). Those close the ENDOMORPHISM-AS-WALK-SYMMETRY route, in
      which alpha is used to quotient the search space. This record uses alpha
      completely differently: not as a symmetry of a walk but as an OBJECT TO BE
      RECONSTRUCTED from torsion data. The two share only the word endomorphism;
      the unit group plays no role here, and Delta is nontrivial precisely on
      curves where Aut is trivial.
    - >-
      IDEA-20260807-5cabfc (a vertical ell-power isogeny is an isomorphism on the
      prime-order subgroup -- a closure). Correct and used here: it is why moving to
      the crater does not disturb the instance and why the ascent is free of
      transport loss. This record does not restate it; it exhibits a functional
      that changes under exactly the move that record shows leaves G alone. The
      two are consistent and complementary: the ascent is invisible ON G (5cabfc)
      and changes End(E) OFF G (this record), which is the whole content.
    - >-
      IDEA-20260808-4d77a6 (volcano level readable from public group structure),
      IDEA-20260807-3c6bd8 (v_ell(c) computable without the class),
      IDEA-20260807-3f5545 (level-vector stratification) and
      IDEA-20260807-bb03d3 (B-rough-conductor ascent normal form). Those establish
      that f_E is computable and that ascent is a well-defined normal form. This
      record CONSUMES those results as inputs -- they are what make Delta cheaply
      computable and the T5 local test available -- and adds the cost functional
      they were missing. None of them attaches a cost to a level; all of them
      stratify an existing measurement by it.
    - >-
      IDEA-20260807-7d8ba9 (the auxiliary-data / Kani template classification).
      That record is in the SUPERSINGULAR lane (RQ-SSI-001, GOAL-SQISIGN-002) and
      classifies which published schemes expose torsion images. It never mentions
      ordinary curves, prime-field ECDLP, the Frobenius eigenspace decomposition, or
      the embedding degree, and it draws no conclusion about any DLP. This record
      is the first to apply the template to ECDLP within an ordinary isogeny class
      and the first to identify the eigenspace/embedding-degree obstruction as the
      reason it fails.
    - >-
      IDEA-20260807-6c7540 (the embedding degree is ord_N(t - 1), samplable at
      cryptographic size without constructing a curve). This record CITES and REUSES
      that identity and that sampling shortcut for its crypto-scale arm; it does not
      restate them. What is new is the use of m as the GATE on a different lane's
      functional, and the joint condition (small |D_0| AND small m) that neither
      record examines.
    - >-
      IDEA-20260807-bbdcf3 and IDEA-20260808-5158fa (the class-group / CM-bridge
      size gap: h(O) ~ sqrt(p) against N ~ p, carrying at most half). Those price a
      bridge from Cl(O) to G and find it too small by a square root. This record
      does not use Cl(O) at all: lambda is a ring homomorphism from the ORDER, not a
      map from the class group, and the size accounting is a covolume computation in
      a rank-2 lattice rather than a class-number comparison. The p^{1/2} deficits
      in the two records have different sources and neither implies the other.

  object_first_candidate:
    established_families_off_limits: >-
      DECLARED OFF-LIMITS AS THE PRIMARY LENS, per docs/inventor-protocol.md
      section 1: (i) the per-curve scalar relation/solving-degree functional (the
      ICINV family as executed); (ii) the volcano level used as a STRATIFIER of
      such a functional (the VOLC family); (iii) the transported instance and the
      transport oracle (the transport family); (iv) the endomorphism as a WALK
      SYMMETRY on G (the EWALK family, closed by IDEA-20260807-ebcae6); (v) the
      phi-stable factor base (the EQIC family). This record's lens is none of
      those: the volcano level enters as an ARGUMENT OF A COST FUNCTION rather
      than as a stratifier, and the endomorphism is a reconstruction target rather
      than a symmetry.
    tracked_object: >-
      THE COSET A_k = {alpha in End_{F_p}(E) : alpha|_G = [k]} -- a coset of the
      norm-N ideal n inside the rank-2 lattice End_{F_p}(E) -- followed as E ranges
      over one F_p-isogeny class, and projected to the single geometric invariant
      Delta(E) = covolume(n) / pi = N sqrt(|D_E|) / (2 pi).
    one_step_propagation_rule: >-
      DEFINED, DETERMINISTIC AND EXACT, WHICH IS WHY THE OBJECT IS TESTABLE. One
      step is a VERTICAL ell-isogeny (ascending or descending). It multiplies or
      divides f_E by ell, hence multiplies or divides Delta(E) by exactly ell, and
      leaves N, D_0, the instance (P, Q) and the scalar k untouched
      (IDEA-20260807-5cabfc). A HORIZONTAL step leaves f_E and therefore Delta
      exactly unchanged. So the one-step propagation is the multiplicative map
      Delta -> ell^{+-1} Delta on vertical edges and the identity on horizontal
      edges -- a one-step autocorrelation of exactly 1 on the crater and a perfectly
      predictable gradient elsewhere. This is the sharpest possible answer to
      IDEA-20260807-c36472's demand for a one-step-autocorrelation measurement on
      candidate functionals, and it is derived rather than measured.
    newness_score: >-
      Genuinely new to this program as a cost functional; the ingredients
      (lambda : O -> Z/N with pi |-> 1, the covolume of a norm-N ideal, Kani's
      criterion, the embedding-degree identity) are all standard or already in this
      corpus, and none is claimed novel. What is claimed new is the assembly:
      Delta as a class-varying attack-cost functional, its T5 status, and the
      orthogonality of its within-class gradient to its class-invariant usability
      gate.
    survival_score: >-
      Survives: change of target, change of factor base, change of model, change of
      generator, all sampling disputes, the SR3 gate, and criterion C4 entirely (it
      estimates nothing). Dies at: supersingular curves (where End_{F_p} is an order
      in a quaternion algebra and lambda is not a map to Z/N); classes with f = 1
      (no volcano, so no within-class variation at all, and the record says so);
      and any attempt to read Delta as a measured speedup, which it is not.

  mechanism: >-
    THE CAUSAL CHAIN, FROM THE CAMPAIGN'S OWN ADMISSIBILITY FILTER TO AN
    EXPONENT-SCALE CLASS GRADIENT AND THEN TO TWO OBSTRUCTIONS.

    STEP 1 -- TURN H-ENDO-001 FROM A PROHIBITION INTO A CONSTRUCTION. The campaign
    uses "every endomorphism acts on G as a scalar" as a reason to reject lanes.
    Read the other way it is a canonical map: Frobenius fixes G pointwise, so
    reduction along pi |-> 1 gives a surjective ring homomorphism
    lambda : End_{F_p}(E) -> Z/N whose kernel n is a prime ideal of norm N. The
    action of any endomorphism on G is therefore computable in O(1) from its
    coordinates and the public integers (t, p, N, D_0, f_E), with no discrete
    logarithm. The scalar action is not an obstacle to computing lambda; it is
    what makes lambda exist.

    STEP 2 -- RESTATE THE SECRET AS A LATTICE-COSET MEMBERSHIP PROBLEM. "Represent
    the secret scalar k by an endomorphism" now means precisely: find a point of
    the coset A_k = lambda^{-1}(k), which is a coset of n inside the rank-2 lattice
    O_E. This is an exact, bidirectional reformulation -- lambda evaluates forward
    in O(1), and Gauss reduction inverts it given k -- and it is what exposes the
    problem to isogeny-theoretic machinery, because a point of A_k is an actual
    isogeny E -> E with a computable degree.

    STEP 3 -- THE COVOLUME IS THE COST, AND IT IS A LATTICE COMPUTATION. Under the
    norm form, O_E has covolume sqrt(|D_E|)/2 and n has index N, so
    covol(n) = N sqrt(|D_E|)/2. Counting lattice points of bounded norm (Gauss
    circle) gives at most 2 pi X / sqrt(|D_E|) endomorphisms of norm <= X, and each
    represents exactly ONE scalar, so bounded-degree endomorphisms can cover only a
    bounded fraction of the N residues. That is the causal link from a geometric
    quantity (covolume) to a cryptanalytic one (the degree an attacker must reach),
    and its useful half -- the upper bound on how many scalars are cheaply
    representable -- needs no assumption whatsoever.

    STEP 4 -- THE CONDUCTOR IS THE ONLY FREE PARAMETER, AND IT IS EXACTLY WHAT THE
    CLASS VARIES. Since |D_E| = |D_0| f_E^2, the cost Delta = N sqrt(|D_E|)/(2 pi)
    is LINEAR IN THE CONDUCTOR. Within one isogeny class T4 fixes N and D_0 and
    leaves f_E free over the divisors of f, and f_E is exactly the volcano level.
    So the class supplies a functional with an exact multiplicative gradient:
    Delta(floor)/Delta(crater) = f, up to 2 sqrt(p/|D_0|). This is why the object
    behaves so unlike every previous candidate. Averaging functionals vary by
    O(N^{-1/2}) across a class because they are means over ~N events; Delta varies
    by a factor of f because it is a lattice determinant and the lattice literally
    changes shape as you climb the volcano.

    STEP 5 -- THE GRADIENT IS ALSO THE T5 ESCAPE, WHICH IS WHY IT MATTERS. A
    vertical ell-step multiplies Delta by ell^{+-1}; a horizontal step fixes it. So
    the functional's minimiser is not a scattered global address but a
    LOCALLY-CHARACTERISED destination -- the maximal order at the crater --
    detectable at a vertex by counting rational ell-isogenies and reachable by
    ascending v_ell(f_E) = O(log p) steps. That is precisely T5's branch (ii), and
    it is available here for a structural reason rather than by luck: the gradient
    of Delta is aligned with the vertical direction of the volcano, and the vertical
    direction is exactly the one an attacker can see and walk.

    STEP 6 -- THE FIRST OBSTRUCTION IS THE SAME COVOLUME, READ AS A FLOOR. Even at
    the crater, Delta = N sqrt(|D_0|)/(2 pi) >= c N: the class gradient carries you
    down to the floor and cannot carry you through it, because the covolume of an
    ideal of norm N in a rank-2 lattice cannot be smaller than N times the order's
    own covolume. Halving the degree by a meet-in-the-middle -- the Wesolowski claw
    template -- therefore leaves ~sqrt(N) candidates on each side, i.e. p^{1/2}
    time AND p^{1/2} memory. Rho already achieves p^{1/2} time at O(1) memory, so
    the whole route is strictly Pareto-dominated, and it is dominated by a bound
    that is unconditional. The exponent-scale class gradient is real and lands
    exactly on the baseline.

    STEP 7 -- THE SECOND OBSTRUCTION IS AN EIGENSPACE MISMATCH, AND IT IS
    CLASS-INVARIANT. The only machinery that reconstructs an isogeny faster than
    searching its degree is the Kani-style higher-dimensional embedding, and it
    consumes the action of the unknown map on FULL torsion E[N'] with N' above the
    degree. The data an ECDLP instance provides is the action on G = E[n] alone --
    one Frobenius eigenspace, cyclic, and isotropic for the Weil pairing, so the
    isotropy condition that selects a Kani kernel says nothing about k there. The
    missing half is E[n-bar], on which Frobenius acts as p, so it lives over
    F_{p^m} with m = ord_N(p) = ord_N(t - 1): the embedding degree. And m depends
    only on (N, t), so it is EXACTLY CONSTANT ON THE CLASS.

    STEP 8 -- THE TWO STEPS ABOVE COMBINE INTO THE RECORD'S ACTUAL CONTENT, WHICH
    IS A SEPARATION. The quantity the class can move (Delta, by a factor of f) and
    the quantity that decides whether moving it buys anything (the embedding
    degree) are orthogonal: the isogeny class is exactly the set of curves with a
    given Frobenius, so it varies End(E) and cannot vary ord_N(t - 1) at all. A
    campaign asking "is any attack-cost functional non-constant across an isogeny
    class, and is a minimiser reachable" gets, here, YES and YES -- and then finds
    the usability gate sitting on the one axis the class holds fixed. That
    separation is derived, cheap, and falsifiable in the one place both
    obstructions could fail together, which is why (G)'s integer-arithmetic arm at
    128 and 256 bits is the record's discriminating measurement.

  lossy_projection_identifiability_audit:
    projection: >-
      (the curve E, its endomorphism ring O_E, and the full coset A_k of the secret
      scalar) -> (the ideal n and its covolume) -> the single real number
      Delta(E) = N sqrt(|D_E|) / (2 pi).
    what_is_discarded: >-
      The secret k entirely (Delta does not depend on it); WHICH endomorphism is
      minimal; the shape of the reduced binary quadratic form of n, hence the
      skewness of the coset and the exact value of deg_min for any particular k; the
      j-invariant; the Weierstrass model; and every point of E.
    is_it_only_a_change_of_coordinates: >-
      NO, AND THE LOSS IS EXACTLY WHAT MAKES THE OBJECT USABLE. The k-dependence is
      discarded, which is why Delta is publicly computable at all, and the discard
      is COMPATIBLE with the operation the attack would perform -- searching the
      coset for a short vector -- because the cost of that search is governed by the
      coset's covolume and by nothing else about which coset it is. That is the
      lossy-projection condition of docs/inventor-protocol.md section 2 in its
      precise form: the retained part (covolume) propagates deterministically under
      the operations the target performs (vertical isogeny steps multiply it by
      ell; horizontal steps fix it; searching it costs its square root), while the
      discarded part (which coset) cannot be recovered from it -- N cosets share one
      Delta. Contrast with the protocol's worked failure: there the discarded pair
      was recoverable as roots of a quadratic; here recovering the coset from Delta
      is recovering k from public data.
    mirror_failure_check: >-
      CHECKED, AND ONE REAL EXPOSURE IS RECORDED RATHER THAN SUPPRESSED. Delta is
      the TYPICAL coset minimum, not the minimum for a particular k: the counting
      lemma bounds deg_min from below only for all but an eps-fraction of scalars,
      and for the exceptional eps-fraction deg_min can be much smaller. So the
      projection is compatible with the search cost ON AVERAGE OVER k and not
      pointwise, and any statement about a SPECIFIC instance must carry the eps. The
      record states this in its quantifier order and its interpretation limits
      rather than burying it, and it is also a named forward direction: whether the
      exceptional scalars are identifiable without knowing k is a separate question
      the record does not answer and does not assume.

  null_object_control: >-
    MANDATORY AND ARITHMETIC. NULL 1 (THE f = 1 CLASS, the exact matched null): a
    class at the same p with trivial conductor has NO within-class level axis by
    construction, so Delta must be EXACTLY CONSTANT on it -- a forced value with
    zero spread. Running the pipeline there must return one distinct Delta; anything
    else is an implementation defect. This is the same null H-VOLC-dff1f8 already
    specifies for its own arm, reused. NULL 2 (THE GAUGE ORBIT): Delta depends only
    on (N, D_0, f_E) and is therefore EXACTLY gauge-invariant, so the gauge orbit
    must return one distinct value; a forced-value control that CAN fail, since a
    buggy conductor computation from a Weierstrass model would break it. NULL 3
    (THE HORIZONTAL WALK): a horizontal ell-isogeny walk at fixed level must leave
    Delta exactly constant while changing j at every step; a Delta that moves under
    a horizontal step is reading the j-invariant and not the endomorphism ring.
    NULL 4 (THE DECAY CONTROL, and it is the one that matters):
    Delta(crater)/Delta(floor) = 1/f must scale with the CONDUCTOR and with nothing
    else. Measured across classes with f = 1, 2, 4, 8, 16, ... the ratio must
    follow f exactly; a ratio that does not decay as f grows is the canonical
    artifact tell. NULL 5 (THE CRYPTO-SCALE NULL for the (G) arm): ord_{N'}(t - 1)
    for N' a random prime of the same size NOT arising as a divisor of p + 1 - t,
    which destroys the arithmetic relation while preserving both marginals -- the
    shuffled-pairing null IDEA-20260807-6c7540 already specifies, reused verbatim.

  assumptions:
    - >-
      [fact] pi acts as the identity on G, because G is contained in E(F_p). Hence
      the ring homomorphism lambda : O_E -> Z/N with pi |-> 1 exists, is surjective,
      and has kernel a prime ideal n of norm N. Elementary and re-derived by the run
      symbolically before anything else is computed.
    - >-
      [fact] H-ENDO-001: every endomorphism acts on the prime-order subgroup as
      multiplication by a scalar. USED as the reason lambda is well defined and
      O(1)-computable; NOT retested anywhere in this record.
    - >-
      [fact] O_E is a rank-2 lattice in C of covolume sqrt(|D_E|)/2 under the norm
      form, and n is a sublattice of index N, so covol(n) = N sqrt(|D_E|)/2.
      Elementary lattice arithmetic, re-derived by the run.
    - >-
      [fact] Gauss circle count in a rank-2 lattice, giving the counting lemma of
      (B) with an explicit error term. Rigorous; the error term is stated and
      carried, never dropped.
    - >-
      [fact] Deuring/Waterhouse: within an F_p-isogeny class, D_0 and f are fixed
      and End(E) has conductor f_E | f; the vertical ell-isogeny changes
      v_ell(f_E) by exactly one. This is T4 of DECOMPOSITION.md, used as the frame.
    - >-
      [fact, this corpus] The embedding degree identity m = ord_N(p) = ord_N(t - 1),
      derived in IDEA-20260807-6c7540 from p = t - 1 (mod N). Cited, not re-derived.
    - >-
      [external, RELAYED AND NOT INDEPENDENTLY VERIFIED THIS SESSION] Kani's
      criterion and the SIDH-attack requirement that the available torsion order
      exceed the isogeny degree. This record uses only the DIRECTION of that
      requirement (torsion must exceed degree, and the kernel must be maximal
      isotropic of full rank) and never a specific constant or theorem number. No
      external literature check was possible this session -- the crypto-kb index is
      empty and WebSearch/WebFetch resolve to a Bedrock-backed model, prohibited by
      AGENTS.md rule 16 -- so this assumption is marked RELAYED and the record's
      obstruction O-EIGEN is stated conditionally on it. THE NAMED CHECK THAT WOULD
      SETTLE IT IS IN THE NOVELTY SCREEN and must be run before any write-up.
    - >-
      [scope] Ordinary prime-field curves only. claim_tier toy for every MEASURED
      quantity; the (G) arm computes integers at 256-bit N but is a DISTRIBUTIONAL
      measurement of ord_N(t - 1) and not an attack, and its scale must not be read
      as a crypto-scale cryptanalytic claim.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal would change the theorem is the availability of
      the full N-torsion E[N]. Every Kani-style reconstruction needs a maximal
      isotropic kernel of order N'^2 inside a product surface; the k-dependent data
      Q = [k]P determines the unknown endomorphism only on the rank-1 Frobenius
      eigenspace G = E[n], of order N. If the complementary eigenspace E[n-bar] were
      computable, the reconstruction problem would become a bounded-degree
      endomorphism-recovery problem with torsion exceeding degree at the crater of a
      small-|D_0| class, which is exactly the regime the external machinery handles.
      Everything else in this record -- the covolume computation, the class
      variation, the T5 status -- is bookkeeping around that one step.
    baseline_embedding:
      parameter_slice: >-
        (i) f = 1 (no volcano). Then f_E = 1 forced, Delta is constant on the class,
        the within-class variation is exactly zero, and the record reduces to the
        known statement that a maximal-order class offers nothing to move -- the
        correct boundary value. (ii) D_0 = -3 or -4 at the crater, where
        Delta/N = sqrt(|D_0|)/(2 pi) is a small constant: the record must reproduce,
        at that slice, the ALREADY KNOWN fact that j = 0 and j = 1728 curves admit
        an O(1)-degree endomorphism (the automorphism), and must show that this
        endomorphism represents the scalar lambda(zeta) and NOT k -- i.e. that the
        known sqrt(|Aut|) discount (KN-TECH-018) is recovered and is not confused
        with a Delta statement. Failing to separate those two is the single most
        likely way to manufacture a fake result here.
      reproduction_check: >-
        FROZEN, SYMBOLIC, AND A HARD GATE COSTING MINUTES. On the committed
        p = 4001, t = 30, D = -59 * 16^2 class: (a) verify symbolically that
        lambda(pi) = 1 and that lambda is a ring homomorphism, on at least 20
        curves; (b) verify that for a KNOWN k and a randomly chosen alpha in A_k
        found by Gauss reduction, [lambda(alpha)]P equals alpha(P) computed by
        explicit isogeny evaluation -- the check that the algebra and the geometry
        agree; (c) verify covol(n) = N sqrt(|D_E|)/2 numerically against a direct
        Gauss reduction of the ideal, per level; (d) verify Delta(level+1)/Delta(level)
        = 2 exactly on every vertical edge of the committed 2-volcano. Any failure
        makes the run INVALID and is an implementation defect, never a mathematical
        result.
    observation_collision:
      observable: >-
        The real number Delta(E) = N sqrt(|D_E|) / (2 pi), equivalently the pair
        (N, disc End(E)).
      distinct_preimage_search: >-
        REQUIRED, AND THE COLLISIONS ARE REAL AND MUST BE STATED. (1) All curves at
        the SAME LEVEL of the volcano share one Delta exactly -- at p = 4001 that is
        72 distinct curves with 72 distinct j-invariants sharing one value. So Delta
        is blind to everything except the level, which is a FEATURE for computability
        and a LIMIT on what it can certify, and the record must never present a
        Delta difference as a j-invariant or curve difference. (2) Two curves in
        DIFFERENT classes with the same (N, D_E) also collide, so Delta is not even a
        class invariant in the strong sense -- it is a (order, N) invariant. (3) MOST
        IMPORTANTLY: N distinct scalars k share one Delta, which is precisely the
        statement that Delta leaks nothing about k and is why it is publicly
        computable; a version of Delta that separated scalars would BE an ECDLP
        oracle. The separating condition that must accompany any positive use of
        Delta is therefore an actual reconstruction procedure, and O-EIGEN is the
        statement that none is available.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the ECDLP from "find k in Z/N with Q = [k]P" to "find alpha in
          End_{F_p}(E) of degree at most Delta(E) with alpha(P) = Q", i.e. from a
          scalar-search problem in a cyclic group to a bounded-norm lattice-coset
          problem in a rank-2 order. The encoding is exact and both directions are
          polynomial (lambda evaluates in O(1); Gauss reduction inverts given k).
        predicted_gain: >-
          Encoding: exact and bidirectional. Completeness: every k has a
          representative. Soundness: lambda(alpha) = k is verifiable in O(1), so no
          false witness survives. Transfer: the reformulation is EXACT at every scale
          and is not a heuristic. COST-LOSS OBLIGATION, DISCHARGED NEGATIVELY AND
          THAT IS THE RESULT: the search space of bounded-norm coset elements has
          size ~N by the counting lemma, identical to the original scalar space, so
          the reduction is cost-neutral and buys nothing by itself. Its only value is
          that it exposes the object to isogeny-theoretic machinery, which O-EIGEN
          then shows cannot be applied. Recording a cost-neutral reduction WITH its
          named blocker is the deliverable.
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from "alpha is an endomorphism of E" to
          "alpha is an isogeny E -> E'' of degree at most sqrt(Delta) composed with
          one E'' -> E of the same size", i.e. the Wesolowski smoothness-splitting /
          claw decomposition, and ask for a STRICT inward improvement over rho.
        predicted_gain: >-
          DERIVED TO BE ZERO, AND THE DERIVATION IS THE OBSTRUCTION. Each half has
          ~sqrt(Delta) >= c sqrt(N) candidates, so the claw costs p^{1/2} time and
          p^{1/2} memory: it TIES rho on time and LOSES to it on memory, hence is
          strictly Pareto-dominated and is not an improvement at any parameter
          choice. Stated as a derived negative rather than left as an untried idea.
    quantifier_order: >-
      CLAIMED IN THIS ORDER, AND THE eps IS LOAD-BEARING. FORALL primes p, FORALL
      ordinary E/F_p with End_{F_p}(E) of discriminant D_E and prime subgroup order
      N, FORALL eps in (0, 1), FOR ALL BUT AT MOST eps*N SCALARS k in Z/N, FORALL
      alpha in End_{F_p}(E) with alpha|_G = [k] and alpha != 0:
      deg alpha >= eps * N sqrt(|D_E|) / (2 pi) - (stated error). Note that the
      exceptional set is quantified over k and depends on E, so the bound is
      average-case in k and worst-case in E; the stronger order (FORALL k) is NOT
      claimed and is FALSE, since the scalars represented by short endomorphisms are
      exactly the exceptional set. The class statement is separately: FORALL classes
      X with conductor f, FORALL E in X, Delta(E) = Delta(crater) * f_E, an exact
      identity quantified over every member with no exceptional set at all.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that Delta is an exactly computable, class-varying, crater-minimised
        functional whose within-class range is the factor f; that representing the
        secret scalar by an endomorphism costs at least ~eps*Delta in degree for all
        but an eps-fraction of scalars; that the associated meet-in-the-middle costs
        p^{1/2} time and p^{1/2} memory and is therefore Pareto-dominated by rho; and
        that the full N-torsion needed by any Kani-style reconstruction is
        inaccessible at generic embedding degree, which is a class invariant. It can
        NEVER certify that any reconstruction is impossible (only that the named
        routes are blocked), anything about supersingular curves, anything about
        solving degree or relation collection, any exponent improvement, or anything
        about the exceptional eps-fraction of scalars.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE HOPED-FOR CONCLUSION FAILS, AND IT MUST BE
        EXHIBITED: a j = 0 curve, where an endomorphism of degree 1 (the
        automorphism zeta_3) exists and is O(1)-evaluable. There the "short
        endomorphism" the whole record is about DOES exist, and it buys exactly
        sqrt(3) in the rho constant (KN-TECH-018) and nothing more -- because it
        represents lambda(zeta_3), a fixed known scalar, and NOT k. A method that
        could not distinguish "a short endomorphism exists" from "a short
        endomorphism representing k exists" would conclude that j = 0 curves are
        broken, which they are not, and would have failed to identify the
        load-bearing structure. Every arm of this record must reproduce the sqrt(3)
        and no more on that object.
    proof_obligations:
      - claim: lambda is a well-defined surjective ring homomorphism with pi |-> 1.
        responsibility: correctness
      - claim: covol(n) = N sqrt(|D_E|) / 2 and Delta(E) = covol(n)/pi.
        responsibility: size
      - claim: >-
          The Gauss-circle counting lemma with its stated error term yields the
          average-case-in-k lower bound of (B).
        responsibility: strictness
      - claim: >-
          Delta(E) = Delta(crater) * f_E exactly, and a vertical ell-step multiplies
          it by ell^{+-1} while a horizontal step fixes it.
        responsibility: baseline
      - claim: >-
          The claw decomposition costs p^{1/2} time and p^{1/2} memory and is
          Pareto-dominated by rho at O(1) memory.
        responsibility: runtime
      - claim: >-
          G is isotropic and cyclic, so isotropy is vacuous on G x G and carries no
          information about k; the k-dependent subgroup has order N, half the rank a
          Kani kernel needs.
        responsibility: feasibility
      - claim: >-
          E[n-bar] is defined over F_{p^m} with m = ord_N(t - 1), and m is a class
          invariant.
        responsibility: interface
      - claim: >-
          Nothing transfers to supersingular curves, to solving degree, to any
          exponent, or to the exceptional eps-fraction of scalars.
        responsibility: scope
    not_applicable_reason: null

