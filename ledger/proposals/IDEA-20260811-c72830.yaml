      THE RECORD IS EXPLICITLY CONDITIONAL ON THIS AND SAYS SO IN ITS ASSUMPTIONS.
    - >-
      F8 (PLANNED NEGATIVE, PRE-REGISTERED). If both obstructions hold, the record
      does not get to emit "the lane is closed" and stop. It must emit: the two named
      obstructions O-MINK and O-EIGEN with their arguments; the exact quantitative
