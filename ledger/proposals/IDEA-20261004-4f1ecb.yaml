# IDEA-20261004-4f1ecb
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-4f1ecb
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 14 has degree 196 and multiplication by 13 has degree 169
  class: measurement
  claim: >-
    Multiplication by 14 has degree 196. Multiplication by 13 has
    degree 169. One hundred ninety-six exceeds one hundred sixty-nine
    by 27. The product of the two degrees is 33124. Their sum is 365.
    The gap is a map degree, not an ECDLP exponent and not the degree
    pair 169 and 144.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Fourteen squared is 196. Thirteen squared is 169. Two maps of
    degree 169 have gap 0 and product 28561. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        Transfer attacks apply only to special curves, which is a
        different object from these two multiplication degrees.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The multipliers 14 and 13 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
