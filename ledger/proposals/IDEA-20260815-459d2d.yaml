idea:
  id: IDEA-20260815-459d2d
  question_id: RQ-ECTD-001
  added: '2026-08-15'
  title: >-
    A TESKE-STYLE TRAPDOOR NEEDS ITS ENDPOINT WEAKNESS TO BE INVISIBLE FROM
    THE PUBLIC CURVE; TEST INVISIBILITY DIRECTLY BY ASKING A BLINDED
    CLASSIFIER TO SEPARATE TRAPDOORED FROM RANDOM CURVES
  class: control

  claim: >-
    GOAL-ECTD-001 needs an endpoint weakness that is not a public isogeny-
    class invariant. Arguing invisibility case by case is endless. A direct
    test is to generate matched sets of trapdoored and random curves and ask
    whether any public statistic separates them, which converts an open-
    ended argument into a measurable detection rate.

  mechanism: >-
    Generate matched trapdoored and random curve sets. Compute every public
    invariant the program can cheaply extract and test separation with a
    blinded classifier under cross-validation, reporting AUC against the
    chance baseline.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-ECTD-001 objective and H-ECTD-001; grep 'detection',
      'invisibility', 'blinded classifier'.
    results: >-
      The goal requires detection to remain at least rho-hard; no record
      tests separability empirically with a blinded classifier over public
      invariants.
    verdict: >-
      UNVERIFIED. Classifier-based indistinguishability testing is
      standard elsewhere; applying it as the trapdoor-invisibility gate
      here appears absent.

  object_first_candidate:
    tracked_object: >-
      THE SEPARABILITY of trapdoored from random curves under all cheaply
      computable public invariants.
    lossiness: >-
      A single AUC discards which invariant separates, so per-invariant
      importance is reported alongside it.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while trapdoored curves are generable in quantity;
      separability found at toy scale need not persist at cryptographic
      scale, and the converse also fails, so both directions are scoped.

  null_object_control: >-
    NULL 1 -- two random curve sets with no trapdoor, where AUC must be at
    chance; above-chance there means the classifier is reading a generation
    artifact rather than the trapdoor. NULL 2 -- a deliberately visible
    trapdoor, which must be detected, proving the classifier can see what it
    is meant to see.

  discriminated_from:
    - >-
        The isogeny-class-invariant arguments in this lane, which reason
        about specific invariants; this tests all cheap invariants at once
        empirically.
    - >-
        IDEA-20260726-010 (hidden-CM curves and whether they are actually
        weaker), which asks about weakness rather than about
        detectability.

  assumptions:
    - >-
        Trapdoored curves are generable in quantity at toy scale.
    - >-
        Generation pipelines for the two sets are matched, since any
        pipeline difference is exactly what the classifier will find
        instead of the trapdoor.

  predictions:
    - metric: >-
        random-versus-random null
      direction: different
      minimum_effect: >-
        FORCED at chance; above-chance means a generation artifact and
        voids the run.
    - metric: >-
        visible-trapdoor control
      direction: different
      minimum_effect: >-
        FORCED detected; otherwise the classifier proves nothing by
        failing.
    - metric: >-
        AUC separating trapdoored from random curves
      direction: different
      minimum_effect: >-
        The measurement; any above-chance result identifies the
        invariant carrying the signal and blocks the trapdoor design.

  minimal_test:
    design: >-
      Two hundred curves per class at toy size, both nulls, cross-
      validated classifier over the cheap-invariant set.
    controls:
      - >-
          Random-versus-random null.
      - >-
          Visible-trapdoor positive control.
      - >-
          Matched generation pipelines, audited for incidental
          differences.
      - >-
          Cross-validation with the classifier blinded to labels during
          training.
    required_metrics:
      - >-
          AUC with confidence interval against chance.
      - >-
          Per-invariant importance ranking.
      - >-
          Both control outcomes.
      - >-
          Generation-pipeline diff audit.

  falsification_conditions:
    - >-
        The random-versus-random null exceeds chance. Generation artifact;
        all results void.
    - >-
        The visible-trapdoor control is missed. Classifier inadequate; no
        negative admissible.
    - >-
        AUC exceeds chance on real trapdoored curves. The trapdoor is
        detectable and the design is blocked at this scope, which is the
        cheapest possible way to learn it.
    - >-
        AUC at chance. Invisibility holds against cheap invariants at toy
        scale, which is necessary and far from sufficient.

  confounders:
    - >-
        GENERATION-PIPELINE LEAKAGE, the dominant risk: any incidental
        difference between how the two sets are made becomes the signal,
        and the random-versus-random null is the only defence.
    - >-
        TOY-SCALE NON-TRANSFER: separability at toy scale may vanish at
        cryptographic scale and vice versa, so neither outcome
        extrapolates.

  interpretation_limits:
    - >-
        Tests detectability against cheap public invariants only; a null
        result is not an invisibility proof.
    - >-
        Toy scale; no crypto-scale claim in either direction.
    - >-
        Detection remaining hard is one necessary condition among several
        for the trapdoor design.

  heuristic_assumptions:
    - id: HEUR-ECTD-INV-1
      statement: >-
        If no cheaply computable public invariant separates trapdoored
        from random curves at toy scale, none does at cryptographic
        scale.
      rigorous_support: >-
        Rigorous ingredient: the invariants tested are isogeny-class or
        curve-model quantities whose definitions do not depend on scale.
        THE GAP: their DISTRIBUTIONS depend heavily on scale, and a
        separation invisible in small samples at toy size can be sharp
        at cryptographic size, so this transfer is genuinely unjustified
        and is the record's weakest link.
      falsification_condition: >-
        A separation appearing at a larger scale that was absent at toy
        scale.
      validation_plan: >-
        SAMPLE: >= 200 curves per class at >= 2 scales, so the scale
        trend itself is observable. TAIL CHECK: invariants whose
        importance grows with scale, reported explicitly. TRANSFER
        ASSUMPTION: stated and unjustified.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is curve generation plus invariant extraction
      and classifier training.
    memory_exponent: >-
      Negligible at toy scale.
    best_known: >-
      The incumbent is the lane's per-invariant argumentation, which is
      deeper per invariant and does not test them jointly.
    hidden_overhead: >-
      Matching the two generation pipelines is the dominant effort and the
      dominant source of false positives.
    tradeoff_note: >-
      Testing many invariants jointly buys breadth and risks finding a
      pipeline artifact; the null is what separates the two.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a trapdoor design: nothing is
    constructed. As an invisibility test: none exists here. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an empirical detectability
    measurement for the lane's central invisibility requirement, with a
    generation-artifact null and a positive control, replacing per-invariant
    argument with a measured AUC.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that trapdoored curves are generable at toy scale. 0.5 that the two
    pipelines can be matched well enough for the null to sit at chance,
    which is the binding difficulty. 0.4 that some invariant separates,
    which would block the design cheaply.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
