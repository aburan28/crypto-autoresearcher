idea:
  id: IDEA-20260809-843eb6
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    A certified sweep of class group computations, so the cost curve behind
    deployed discriminant sizes is measured rather than translated
  class: measurement
  claim: >-
    Class group order and structure computations complete quickly at small
    discriminants and slow subexponentially. The claim is that a certified sweep
    across a declared range of discriminant sizes yields a measured cost curve
    with fitted parameters and residuals, that the fit is stable under
    leave-one-out resampling, and that this is the first anchor this program has
    for a parameter choice currently justified by analogy to a different problem.
  mechanism: >-
    Run a standard subexponential class group algorithm at increasing
    discriminant sizes, emitting generators, relations and a structure statement
    as a certificate at each; record operations and peak memory per phase; fit the
    curve with a declared model form.
  why_not_a_renamed_known_approach: >-
    Class group computation records exist. Running a controlled SWEEP with
    per-phase costs and certificates, specifically to fit a curve with intervals
    rather than to set a record, is a different experiment with a different
    output.
  predictions:
  - observable: cost versus discriminant size
    metric: operations and memory per size, per phase
    predicted: Subexponential growth consistent with the algorithm's stated complexity; a different growth shape indicates an implementation or parameter-tuning problem rather than a mathematical finding.
  - observable: fit stability under leave-one-out
    metric: parameter movement when each size is omitted
    predicted: Small movement if the sweep spans enough sizes; large movement means the sweep is too short to support extrapolation, which must then be stated.
  minimal_test: >-
    At least five discriminant sizes spanning a declared range, certificates at
    each, per-phase costs recorded, curve fitted with residuals and leave-one-out
    reported.
  controls:
  - 'KNOWN-VALUE CONTROL: at sizes with published class numbers the computation must agree exactly before its cost is used.'
  - 'PARAMETER-TUNING DISCLOSURE: algorithm parameters (factor base size, relation surplus) are declared per size, since tuning differences across sizes would distort the curve.'
  falsification_conditions:
  - Computed class numbers disagree with known values at control sizes.
  - The fit is unstable under leave-one-out, in which case no extrapolation is admissible from this sweep.
  interpretation_limits: >-
    Measured at the sizes actually run; the extrapolation and its interval are a
    separate record and never a security verdict.
  sota_delta: 'No attack. Delta: an owned cost curve with intervals where the parameter argument currently rests on analogy.'
  dominated_by: Not dominated by any corpus record; methodologically parallel to GOAL-PAIR-001's calibration and may cite it as method only.
  estimated_cost: Implementation medium; compute high at the top of the sweep.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for class group computation: no records. WEB NOT CHECKED.'
  source_refs:
  - Subexponential class group algorithm references -- RECALLED, REQUIRED READS.
