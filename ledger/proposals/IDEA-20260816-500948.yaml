idea:
  id: IDEA-20260816-500948
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: When v claims are batched into one check by powers of a single challenge rather than by v
    independent challenges, measure the exact soundness gap between the two batching schemes by enumerating
    every challenge and every adversary error pattern in a toy field, as a function of v and the field
    size
  class: mechanism
  claim: '(A) Batching is the routine move that makes argument systems cheap: v separate polynomial
    or vector identities are combined into one identity using a single verifier challenge z, with
    the i-th claim weighted by z to the i, and the combined check is made once. The alternative is
    v independent challenges, one per claim. Both are folded into soundness accounting through the
    same Schwartz-Zippel style term, and the two are not the same object. (B) For a toy field F_p
    and a false claim vector, the exact probability that the batched check passes is the fraction
    of z in F_p at which a fixed nonzero error polynomial of degree at most v minus 1 vanishes, which
    for a single adversary-chosen error pattern is at most (v minus 1)/p, whereas for v independent
    challenges the corresponding probability is a product term. The deliverable is the exactly enumerated
    maximum over adversary error patterns of the passing probability under each scheme, at named (p,
    v), reported as a ratio and as a bit difference, with the adversary-optimal pattern named. (C)
    The measurement is exhaustive on both axes at toy sizes: every z in F_p and every error pattern
    in a structured enumerated family, so the reported maximum is attained and not sampled, and the
    growth of the gap in v is fitted over the enumerable range. (D) NOT CLAIMED: nothing here is an
    attack on any batching scheme and no claim is made that powers-of-z batching is unsound, since
    a gap of a factor v against a bound of the same order is exactly what the accounting already budgets;
    no claim about any deployed or third-party system, none of which is examined; no claim that the
    enumerated error-pattern family is exhaustive over all adversary behaviours, only over the named
    family; and no security consequence for any parameter set.'
  mechanism: 'STAGE A: fix the batched check. Let there be v claims, each asserting that a named field
    element e_i equals zero, with the adversary controlling the vector e. The batched verifier draws
    z uniformly from F_p and accepts if the sum over i of e_i times z to the i is zero. The independent-challenge
    verifier draws z_1 through z_v and accepts if the sum of e_i times z_i is zero, or in the stricter
    variant checks each claim separately with its own challenge. STAGE B: enumerate. For each nonzero
    error vector e in the named family, count the number of z in F_p at which the batched check passes,
    which is the number of roots of the associated polynomial, and divide by p. Take the maximum over
    e; this is the attained batched soundness error. STAGE C: do the same for the independent-challenge
    scheme by enumerating over all tuples at small p and v, or by exact counting where the count factorises.
    STAGE D: form the ratio and the bit difference, sweep v from 2 to the largest enumerable value
    and p over a list of small primes, and fit the growth of the gap in v. STAGE E: verify the batched
    count against the closed form, namely that a nonzero polynomial of degree at most v minus 1 has
    at most v minus 1 roots, so the batched error is at most (v minus 1)/p and is attained exactly
    when the adversary can force a fully split polynomial with distinct roots; identify the error
    vectors that attain it, which is the interesting structural output. STAGE F: run the null arm
    with random error vectors rather than adversary-chosen ones, which measures the typical rather
    than the worst case and must show a much smaller passing probability.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for Schwartz-Zippel, union bound, challenge
      space, soundness error, quotient polynomial and folding. Read the titles of all thirteen RQ-WFS-e776b6
      proposals from a PyYAML scan. Read ledger/questions/RQ-WFS-e776b6.yaml. Inspected the titles
      of the 2026-08-16 records that hit soundness error and challenge space, namely IDEA-20260816-8ee18f,
      IDEA-20260816-2c83a3, IDEA-20260816-bbff88 and IDEA-20260816-b3a6f0, to confirm they sit on
      RQ-MQOM-001 and RQ-SDITH-001 rather than on batching.
    results: Schwartz-Zippel returns hits in IDEA-20260816-2c83a3, IDEA-20260808-70243a, IDEA-20260725-006,
      IDEA-20260808-ae175e and IDEA-20260811-d7856a; the 2026-08-16 one is an MPC-in-the-head enumeration
      on RQ-SDITH-001 and the others sit outside this question. Among RQ-WFS proposals none mentions
      batching, random linear combination, or powers of a single challenge; the closest is IDEA-20260809-82e7ba,
      which varies challenge-space size, and IDEA-20260809-792aca, which builds a reference sumcheck
      argument for omission classes. IDEA-20260816-8ee18f measures covariance between repetition-level
      success events under a shared salt, which is a dependence question about repetitions rather
      than about a batched identity check.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; the Schwartz-Zippel bound
      and powers-of-z batching are standard and treated as known here. What is claimed new is internal
      only: the exhaustive attainment analysis of which error vectors reach the (v minus 1)/p ceiling
      and the side-by-side exact comparison against an independent-challenge scheme at named toy parameters.
      The parts assembled are known: root counting for a univariate polynomial, the batching construction,
      and exhaustive enumeration.'
  object_first_candidate:
    tracked_object: 'The root set R(e) of the error polynomial E_e(z) equal to the sum of e_i times
      z to the i: the subset of F_p on which a fixed adversary error vector survives the batched check.
      The whole analysis follows the map e to R(e), and both soundness quantities are functionals
      of it.'
    lossiness: 'Genuinely lossy. The adversary''s full state is the error vector e in F_p to the v,
      which has p to the v values; R(e) keeps only a subset of F_p of size at most v minus 1, collapsing
      scaling classes and every error vector with the same roots into one object. The discard is compatible
      with the batched check because acceptance depends on e only through whether the drawn z lies
      in R(e); the coefficients themselves never reach the verifier''s decision. The retained set
      propagates deterministically: batching two independent claim groups multiplies polynomials and
      unions root sets, which is precisely the operation whose accounting is in question.'
    propagation: 'One step of the target operation is one batched verification. On the tracked object
      it acts as: draw z uniformly and accept exactly when z lies in R(e). Composing two batched checks
      with independent challenges intersects the two survival events, so the survival probability
      multiplies; composing them with a reused challenge intersects the events on the SAME z, so the
      probability becomes the density of the intersection of root sets, which can be far larger than
      the product. That contrast is the whole mechanism, and it propagates cleanly to any number of
      composed checks.'
    survival_score: The object survives while the error polynomial is univariate and its roots are
      countable, which is exact for every p and v representable, and while the enumeration over error
      vectors is feasible, which holds to about p to the v below 2 to the 26, meaning p equal to 251
      with v equal to 3 or p equal to 13 with v equal to 7. Beyond that the maximisation over e must
      be replaced by the structured family of fully split polynomials, which is a named restriction
      and not a sample. The object dissolves when the claims are not linear in the error, for example
      when the check involves products of prover-supplied values, since then acceptance is no longer
      determined by a root set.
  null_object_control: 'NULL OBJECT: random error vectors drawn uniformly from F_p to the v rather
    than adversary-chosen, pushed through the identical enumeration of z and the identical counting
    code in the same invocation. The null reports the TYPICAL passing probability, which for a uniformly
    random nonzero e is the expected root density, close to 1/p by the standard fact that a random
    polynomial has about one root on average. For the signal arm to mean anything the null must come
    out near 1/p and clearly below the adversary-optimal value; if the two agree, the enumeration
    is not finding adversary structure and the reported maximum is an artifact of the family being
    enumerated. A second null uses v equal to 1, where batching is vacuous and both schemes must return
    exactly 1/p times the number of roots, that is, exactly zero for a nonzero constant error.'
  discriminated_from:
  - IDEA-20260816-2c83a3 enumerates a toy MPC-in-the-head protocol's full challenge space against
    a per-repetition formula. That object is repetition structure in a proof paradigm owned by another
    bucket; this record's object is a univariate root set from a batched identity and involves no
    MPC, no parties and no seed trees.
  - IDEA-20260816-8ee18f measures covariance between repetition success events under a shared salt.
    Shared randomness there is across repeated instances of the same check; here it is across distinct
    claims inside one check, and the accounting term is different.
  - IDEA-20260809-82e7ba sweeps the size of the challenge space. Here the challenge space size is
    fixed and the number of batched claims v is the independent variable.
  - IDEA-20260809-792aca builds a reference sumcheck argument to enumerate omission classes; the transform
    there is deliberately weakened. This record leaves the transform intact and varies only how many
    claims are folded into one check.
  - 'A generic statement of the Schwartz-Zippel bound: that is an upper bound of (v minus 1)/p. This
    record measures which error vectors attain it and what the independent-challenge scheme costs
    at the same v, which the bound does not say.'
  assumptions:
  - The claims are linear in the adversary error, so acceptance is determined by root membership;
    nonlinear checks are outside scope and stated as such.
  - The enumerated error-pattern family, comprising all nonzero vectors at the smallest parameters
    and the fully split family at larger v, contains the maximiser; where only the structured family
    is enumerated the reported value is a lower bound on the attained maximum and is labelled so.
  - The independent-challenge scheme is implemented as the natural v-challenge analogue and its exact
    passing probability is computable by the same root-counting argument applied per claim.
  - Uniform challenge sampling with no reduction bias, so that this record measures batching alone;
    reduction bias is the separate object of a sibling record in this set.
  - Field arithmetic is exact integer arithmetic modulo p, with no floating point anywhere.
  predictions:
  - metric: attained maximum passing probability of the batched check at p equal to 251, v equal to
      3
    direction: higher
    minimum_effect: 'forced value: exactly 2/251, attained by an error polynomial with two distinct
      roots in F_p; any larger value is an instrument fault because a degree-2 polynomial cannot have
      three roots'
  - metric: ratio of batched to independent-challenge attained passing probability at fixed p, as
      v grows
    direction: higher
    minimum_effect: 2.0
  - metric: null-arm typical passing probability for uniformly random error vectors
    direction: lower
    minimum_effect: 'forced value: within counting error of 1/p, and at least a factor (v minus 1)
      below the adversary-optimal arm'
  - metric: growth exponent of the attained batched probability in v at fixed p over the enumerable
      range
    direction: higher
    minimum_effect: 'forced value: exactly linear, since the ceiling is (v minus 1)/p; a superlinear
      fit voids the enumeration'
  minimal_test:
    design: 'One script, minutes of compute. Take p equal to 251 and v in {2, 3, 4}, enumerating all
      p to the v minus 1 nonzero error vectors at v equal to 2 and 3 and the fully split structured
      family at v equal to 4 through 8. For each error vector count the z in F_p at which the batched
      sum vanishes by direct evaluation over all 251 challenges, which is 251 field operations per
      vector. Record the maximum, the argmax vector, and the histogram of root counts. Then compute
      the independent-challenge attained probability for the same claims. Then run the null arm with
      100000 uniformly random nonzero error vectors through the identical counting code, and the v
      equal to 1 degenerate control. The discriminating output is three numbers per (p, v): the attained
      batched probability, the attained independent-challenge probability, and their ratio in bits,
      alongside the null-arm typical value. If the ratio is exactly the Schwartz-Zippel factor and
      nothing more, that is the measured result and the accounting is confirmed tight at these parameters,
      which is a usable obstruction for any record hoping to find slack there.'
    controls:
    - Null arm of uniformly random error vectors through the identical counting code in the same invocation.
    - Degenerate control at v equal to 1 where batching is vacuous and the passing probability must
      be exactly zero for a nonzero constant error.
    - Zero-error control where every e_i is zero and the check must pass for every z, giving probability
      exactly one.
    - Independent recomputation of root counts by polynomial factorisation over F_p compared against
      the direct evaluation count.
    - Two distinct primes so the reported ratio is not a coincidence of one modulus.
    - Seed replay of the null arm reproducing the histogram exactly.
    required_metrics:
    - attained maximum passing probability of the batched check per (p, v)
    - the argmax error vector and its root set
    - attained maximum passing probability of the independent-challenge scheme per (p, v)
    - ratio and bit difference between the two schemes
    - histogram of root counts over the enumerated family
    - null-arm mean and maximum passing probability
    - number of error vectors enumerated and wall time
  falsification_conditions:
  - Any enumerated error vector shows more than v minus 1 roots, which is arithmetically impossible
    and voids the instrument.
  - The zero-error control does not pass for every z, or the v equal to 1 control does not return
    zero.
  - The null arm matches the adversary-optimal arm, showing the enumeration finds no structure and
    the maximum is an artifact.
  - The attained batched probability falls strictly below (v minus 1)/p at every enumerated v, which
    falsifies the conjecture that the Schwartz-Zippel ceiling is attainable in this construction and
    closes the record with the named obstruction that the error family cannot force a fully split
    polynomial.
  - Factorisation-based root counts disagree with direct evaluation counts.
  - The measured ratio between schemes is not monotone in v across the enumerable range, indicating
    the independent-challenge analogue was mis-specified.
  confounders:
  - Restricting the enumerated family at larger v silently converts an attained maximum into a lower
    bound; if this is not labelled, the ratio reads as tighter than it is.
  - Choosing p small enough to enumerate makes the 1/p terms large and can exaggerate the relative
    gap; two primes are needed to separate that.
  - The independent-challenge analogue admits more than one natural definition, and the ratio depends
    on which one is used; the definition must be frozen before the run.
  - A reduction-biased challenge sampler would contaminate both arms; uniform sampling over exactly
    F_p is required so that batching is the only varying factor.
  - Counting roots with multiplicity versus distinct roots changes the histogram but not the passing
    probability, and conflating them would corrupt the structural output.
  interpretation_limits:
  - Results are scoped to linear claims over the named toy primes and the named v range; nonlinear
    checks and cryptographic-size fields are not tested.
  - A measured gap of order v between the schemes is what the standard bound already budgets, so it
    is not evidence that batching is unsound.
  - Where only the structured error family is enumerated, the reported maximum is a lower bound on
    the true attained maximum.
  - No statement about any deployed, third-party or standardized argument system follows from any
    outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs O(p times |family|) field
      operations, which at the named parameters is under 2 to the 26.
    memory_exponent: No attack memory exponent is claimed. Memory is O(p) for the evaluation table
      plus O(v) per error vector.
    best_known: The incumbent is the Schwartz-Zippel accounting itself, namely that the batched check
      has soundness error at most (v minus 1)/p, together with the routine practice of preferring
      one challenge with powers over v independent challenges for efficiency. This record does not
      beat that accounting; it measures attainment and the cross-scheme ratio at named parameters.
    hidden_overhead: The human cost is in freezing a defensible definition of the independent-challenge
      comparator, which admits several variants that give different ratios, and in labelling honestly
      where the enumeration stops being exhaustive. In lower-order terms hide the multiplicity convention
      for root counting and the cost of factorisation cross-checks, which dominate wall time despite
      contributing no headline number.
  dominated_by: n/a (no result claimed). No solve, relation or cost improvement is proposed, so no
    time, memory or query frontier row exists to compare against; declaring null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is an attained-versus-bound
    comparison and a cross-scheme ratio at named toy parameters, with no cost claim against any algorithm.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that the batched attained maximum equals exactly (v minus 1)/p
    at the toy parameters where full enumeration is possible: about 0.8, the risk being that the constructed
    claim family cannot realise a fully split polynomial, which would itself be the interesting structural
    finding. Part B, that the cross-scheme ratio is cleanly measurable and monotone in v: about 0.75,
    with the main risk being the comparator definition rather than the arithmetic. Part C, that the
    measured ratio reveals anything the Schwartz-Zippel bound does not already predict: about 0.1,
    and I expect this to fail; the honest expectation is that the accounting is tight and the deliverable
    is a confirmed tightness at named parameters plus the argmax structure. Part D, that the argmax
    error-vector structure is reusable as a construction elsewhere in this question: about 0.4.'
