idea:
  id: IDEA-20260905-3c9712
  title: Pointed torsor holonomy as the missing reduction interface
  class: representation
  claim: Unpointed torsor endpoints omit the transport data required for a full point-fiber trivialization or a
    path-independent section through a prescribed nonzero marking. The proposed holonomy class is an interface obstruction
    only when it remains nontrivial after the explicitly declared ambiguity quotient; ordinary zero sections are
    not obstructed.
  mechanism: Fix fibers F_N, invertible edge maps and ambiguity A<=F_N^* with an explicit quotient action. A full
    trivialization demands path maps agree as fiber identifications modulo A; a marked-section demand fixes q!=0
    modulo its A-orbit and requires every loop to preserve that marking. Ordinary zero is always preserved by multiplier
    transport, regardless of the loop. For the formal F_11 triangle choose A={1}; if the edge product is u!=1, zero
    is compatible but a specified nonzero q fails because (u-1)q!=0, and the loop cannot define the identity full
    trivialization. For a nontrivial A, only u outside A obstructs the nonzero A-orbit marking; u in A is erased
    by that quotient. Gauge changes conjugate the loop action, so quotient validity and marking compatibility must
    be checked before treating it as an invariant. Trivial obstruction is only a necessary interface condition for
    any further efficient reduction.
