  assumptions:
  - Only invertible prime-to-N transports. Formal controls use A={1}; any extension names an ambiguity group acting
    on fibers and proves that the designated loop remains nontrivial on the marked orbit or full-trivialization
    quotient.
  - The bridge must be uniform in the curve pair and computable from its declared public data; hardwired paths are
    excluded.
  predictions:
  - metric: Loop transport cocycle, ambiguity subgroup and dependence on representative choice
    direction: different
    minimum_effect: Gauge changes alter edge labels but preserve the conjugacy class of loop obstruction; ignoring
      one edge permits a false bridge and is rejected by the loop test.
  minimal_test:
    design: Use a formal three-vertex groupoid whose fibers are copies of Z/11 and whose edge maps are visible nonzero
      multipliers. Compare trivial and nontrivial loop products; then ask whether a toy isogeny square has the same
      certificate shape.
    proposal_only: true
    controls:
    - type: matched_null
      description: Independent random fiber relabelings, compensated on both ends of every edge.
    - type: known_false
      description: The same multiplier triangle with u!=1 and A={1} permits the zero section but refuses a section
        through a prescribed nonzero q and refuses a full path-independent trivialization. If A contains u, the
        marked-orbit obstruction is deliberately erased and must not be reported.
    required_metrics:
    - Loop transport cocycle, ambiguity subgroup and dependence on representative choice
    - construction work, peak bytes, certificate size
    required_artifacts:
    - Exact fixtures
    - Independent certificates
    - Complete controlled outputs
    stopping_rule: First exact contradiction or stated finite panel; missing prerequisites and limits are inconclusive.
      No execution in this task.
  falsification_conditions:
  - The loop class depends on gauge after the declared quotient, or a nontrivial surviving loop is accepted on the
    prescribed nonzero marking/full trivialization.
  - Rejecting the zero section merely because u!=1 is a control-definition error, not evidence against the mechanism.
  confounders:
  - Hidden instance-dependent choices; omitted verification or representation costs.
  interpretation_limits:
