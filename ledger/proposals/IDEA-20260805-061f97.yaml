  sota_delta: >-
    Quantitative and small on the derived half: relation-collection row count
    multiplied by x_m = 0.9405 at m = 3 (a 5.95% reduction), 0.9802 at m = 4
    (1.98%), 0.9930 at m = 5 (0.70%). On the measured half the delta is
    UNKNOWN BY CONSTRUCTION -- the augmented-rank threshold under a realistic
    biased source has no prior value in this corpus at all, so the delta is
    "from no number to a number", which is stated that way rather than dressed
    as an improvement. On the attack frontier: sota_delta ZERO. No exponent, no
    memory exponent, no query advantage.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.85 that the uniform-source forced values (x_m and the T(B)/B value)
    reproduce within band. It is not higher because HEUR-RANK-1 is only
    partially supported -- at B = 512 and N = 2^18 the union bound over row
    subsets does not close, so rank could sit below the support bound for
    reasons this record has not derived, and that would move the primary
    threshold. It is not lower because Step 1's inequality rank <= |U(R)| is
    unconditional, because the fixed point x_m is a two-line calculus fact, and
    because the two positive controls have exactly-known integer answers that
    would expose an implementation fault before any interpretation. Separately:
    0.35 that the SECOND half (real relation streams show detectable usage
    bias) is ever measured under this goal's budget, because Stage 3 needs a
    real solve and this goal's next_action forbids runs. That asymmetry is the
    main reason the recommended priority is medium and not high.
