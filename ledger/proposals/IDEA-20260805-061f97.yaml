idea:
  id: IDEA-20260805-061f97
  question_id: RQ-RELN-001
  added: '2026-08-05'
  title: >-
    Relations needed is not B -- the left-kernel threshold is the fixed point of
    x = 1 - e^{-mx}, and the deviation of the touched-column curve from that
    forced value is the first measurement of relation independence this program
    would ever make
  class: mechanism

  claim: >-
    Every cost model in this program's index-calculus lane charges the
    relation-collection stage as "collect about B relations, then do linear
    algebra on a B x B sparse matrix". DEC-20260724-020 records, in its own
    limitations block, that "relation rank and independence were not measured;
    the metrics score a rank-deficient base as tied with a random base of the
    same size", and KN-FIND-007 says the same in its own words. That untested
    boundary hides an exactly derivable quantity. A relation is a weight-m row
    over B factor-base columns; a nonzero LEFT kernel -- which is all the
    attack needs -- exists as soon as the number of relations R exceeds the
    matrix rank, and the rank is at most the number of factor-base elements
    actually touched. For relations that are uniform random size-m multisets,
    the expected touched fraction is 1 - (1 - 1/B)^{mR} -> 1 - e^{-mR/B}, so
    the threshold R* = x_m * B where x_m is the unique positive root of
    x = 1 - e^{-mx}. FORCED VALUES, DERIVED BEFORE ANY RUN:
    x_2 = 0.796812, x_3 = 0.940480, x_4 = 0.980173, x_5 = 0.993023,
    x_6 = 0.997484, x_7 = 0.999082, x_8 = 0.999664. So the naive accounting
    OVERCHARGES relation collection by 20.3% at m = 2 and 5.95% at m = 3, and
    the overcharge vanishes as m grows. That is a constant factor and this
    record says so plainly -- it moves no exponent. The reason to run it is the
    SECOND half: real relations produced by an actual decomposition solve are
    not uniform random multisets, and the measured touched-column curve
    T(R)/B against the forced curve 1 - e^{-mR/B} is a matched null test of
    the relation SOURCE. If the solve is biased toward part of the factor base
    -- which every small-x, interval, or greedy geometry in this corpus makes
    plausible -- T(R) grows more slowly, the threshold moves the OTHER way, and
    the relation-collection stage is undercharged by a factor nobody has ever
    measured. The sign of the net correction is not predetermined, which is
    what makes it worth measuring rather than asserting.

  object_first_candidate:
    tracked_object: >-
      The COLUMN SUPPORT of the accumulating relation matrix -- i.e. the set
      U(R) of factor-base indices that appear in at least one of the first R
      relations -- followed through: base D -> target stream -> decomposition
      solve -> exponent row e in Z^B -> running support U(R) -> touched count
      T(R) = |U(R)| -> rank bound -> left-kernel emergence at the first R with
      R > rank. Note what is NOT tracked: the exponent VALUES, the targets, the
      curve. The support alone determines the threshold's upper bound, and that
      is why the object is cheap.
    established_families_off_limits: >-
      Off-limits as the primary lens: summation-polynomial and Groebner
      solving-degree instrumentation; Weil descent and extension-field index
      calculus; factor-base geometry optimized for mean yield or coverage
      (KN-FIND-007 settles the first, DEC-20260724-020 scopes the second);
      Pollard rho and two-table MITM cost algebra (R10); sparse linear-algebra
      ALGORITHMICS (Wiedemann, Lanczos, block variants) -- this proposal is
      about how many rows are needed, not how to eliminate them; isogeny and
      class-group structure (R1); spectral gap (R2); incidence and sum-product
      (THM_INCBARRIER1/2). The lens is coupon-collector combinatorics on the
      support of a sparse matrix, applied to a stage this corpus has costed
      but never measured.
    newness_score: >-
      The underlying combinatorics is elementary and the practice of pruning
      singleton columns before linear algebra is standard in the factoring and
      index-calculus literature (RECALLED, UNVERIFIED -- no citation is
      asserted, and confirming or refuting the attribution is Stage 0 of the
      paired experiment). What this corpus does not contain, as far as the
      screen below could see, is any statement of the threshold x_m, any
      measurement of relation rank or independence at all, and any null test of
      the relation SOURCE's column-usage distribution. Two of this program's
      own decisions say in terms that rank and independence were never
      measured. The novelty asserted is therefore narrow and internal.
    testability_score: >-
      High and cheap. The forced curve is a one-line closed form; the
      measurement is a set-union counter over simulated or real relation
      streams; no solver is required and none is available in this container
      (numpy present; sympy and Sage absent, verified this session).
    survival_score: >-
      The forced curve survives as a null by construction. What may not survive
      is the assumption that it describes the real relation stream -- and that
      is the measurement, not a risk to it.

  mechanism: >-
    DERIVED HERE, in full.

    SETUP. Index calculus over a group of prime order N with factor base
    D = {d_1, ..., d_B}. A relation is a triple (a_i, b_i, e_i) with
    a_i P + b_i Q = sum_j e_{ij} d_j, e_i in Z_{>=0}^B, sum_j e_{ij} = m. Write
    A for the R x B matrix of rows e_i over Z_N. The attack succeeds when a
    nonzero v in Z_N^R with v^T A = 0 is found such that
    (sum_i v_i a_i, sum_i v_i b_i) is not (0,0) mod N; then
    (sum v_i a_i) P + (sum v_i b_i) Q = 0 gives the logarithm.

    STEP 1 (THE THRESHOLD IS A SUPPORT THRESHOLD, NOT A COUNT THRESHOLD). A
    nonzero left kernel exists iff R > rank(A). Let U(R) be the set of columns
    with a nonzero entry among the first R rows and T(R) = |U(R)|. Columns
    outside U(R) are identically zero, so rank(A) <= T(R). Hence
      R > T(R)  ==>  the left kernel is nonzero.
    THE ATTACK NEVER NEEDS UNTOUCHED FACTOR-BASE ELEMENTS. This inverts the
    naive intuition -- an untouched column is not a coupon still to be
    collected, it is free rank deficiency -- and it is the reason the correct
    threshold is BELOW B rather than above it. It also disposes, at zero
    compute, of the coupon-collector objection that R must reach
    (B/m) ln B for all columns to be hit: that requirement belongs to a
    different problem (recovering every individual logarithm), not to solving
    one instance of the DLP.

    STEP 2 (THE FORCED CURVE). Model each relation as a uniform random size-m
    multiset from D. A given column is missed by one relation with probability
    (1 - 1/B)^m, so
      E[T(R)] = B (1 - (1 - 1/B)^{mR}),
    and as B grows with R/B fixed, E[T(R)]/B -> 1 - e^{-mR/B}. Writing
    R = xB, the sufficient condition R > T(R) becomes
      x > 1 - e^{-mx}.
    The map x -> 1 - e^{-mx} is concave, fixes 0, and has slope m > 1 at 0, so
    it lies above the diagonal on (0, x_m) and below it after; x_m is the
    UNIQUE positive fixed point. Solving numerically (bisection, 200 steps,
    double precision -- this is the one number in the record computed rather
    than reasoned, and it is reproducible in three lines of pure Python):
      m = 2: x_2 = 0.796812      m = 3: x_3 = 0.940480
      m = 4: x_4 = 0.980173      m = 5: x_5 = 0.993023
      m = 6: x_6 = 0.997484      m = 7: x_7 = 0.999082
      m = 8: x_8 = 0.999664
    The monotone approach of x_m to 1 from below is itself a graded prediction
    with five interior points, obtained for free.

    STEP 3 (WHY THE DISCOUNT IS SMALL AND WHY THAT IS THE HONEST HEADLINE).
    The saving over the naive R = B is (1 - x_m): 20.3% at m = 2, 5.95% at
    m = 3, 1.98% at m = 4, 0.70% at m = 5. Semaev-style prime-field
    decomposition uses m in {3, 4, 5}. So on the discount side alone this is a
    few per cent -- a constant factor, inside the o(1) of any asymptotic
    statement, and it is recorded as such. NO EXPONENT MOVES. A record that
    dressed this as an exponent result would be exactly the failure the
    generation contract forbids.

    STEP 4 (THE PART THAT CAN BE LARGE -- THE RELATION SOURCE'S USAGE
    DISTRIBUTION). Step 2 assumed uniform multisets. A real relation comes from
    whatever the decomposition solve happened to find. Let p_j be the
    probability that a random found relation uses factor-base element j (so
    sum_j p_j = m). Then
      E[T(R)] = sum_j (1 - (1 - p_j/m)^{... }) -- exactly,
      E[T(R)] = sum_j (1 - (1 - q_j)^{R}) with q_j = P[relation R uses j],
    and by concavity of t -> 1 - (1-t)^R in t together with Jensen, ANY
    non-uniformity strictly DECREASES E[T(R)] at fixed R. The threshold
    condition R > T(R) is therefore met EARLIER, not later -- i.e. bias in the
    solve is, on this axis alone, a further discount. THE COST APPEARS
    ELSEWHERE AND THIS IS THE SUBTLE POINT: a strongly biased source drives
    rank(A) far below T(R), so the left kernel found is likely to be a
    DEGENERATE one -- a dependency among rows that are near-duplicates,
    yielding (sum v_i a_i, sum v_i b_i) = (0,0) and no logarithm. The
    quantity that actually matters is therefore the rank of the AUGMENTED
    matrix [A | a | b] versus the rank of A, and the useful threshold is the
    first R with rank([A | a | b]) > rank(A). That quantity has never been
    measured in this corpus, its forced value under the uniform model is
    R* = x_m B + O(1), and the gap between the naive threshold, the
    support threshold, and the augmented-rank threshold is exactly the
    "relation independence" DEC-20260724-020 declares unmeasured.

    STEP 5 (WHAT THE MEASUREMENT COSTS). Simulating relation streams and
    running a set-union counter is linear in R and needs no linear algebra. The
    augmented-rank threshold needs an incremental rank over Z_N of a sparse
    R x (B+2) matrix; at B <= 512 that is a dense elimination over a prime
    field in pure Python and is seconds per cell. Nothing here needs Sage,
    Groebner, or a sparse-linear-algebra library.

    STEP 6 (WHERE THIS FEEDS). GOAL-RELN-001's declared purpose is to feed
    GOAL-ICEX-001's charged index-calculus-versus-rho comparison. That
    comparison multiplies (relations needed) by (cost per relation). This
    proposal supplies the first factor as a derived quantity with a measured
    correction, replacing an inherited convention. It says nothing about the
    second factor, which is the exponent-carrying one, and it does not pretend
    otherwise.

  novelty_status: unverified

  novelty_screen:
    corpus_checked:
      - ledger/decisions/DEC-20260724-020.yaml
      - knowledge/findings/KN-FIND-007.md
      - experiments/EXP-FB3-001/conservation.md
      - ledger/evidence/EV-FBG-001.yaml
      - ledger/evidence/EV-RELN-001.yaml
      - coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/TASK-20260725-661/decomp_probability_protocol.yaml
      - ledger/goals/GOAL-RELN-001.yaml
      - ledger/goals/GOAL-ICEX-001.yaml
      - ledger/questions/RQ-RELN-001.yaml
    method: >-
      Reading of the listed records plus the goal brief for GOAL-RELN-001,
      which lists zero prior ideas and zero prior experiments in this area. No
      web search. The screen is discounted exactly as in the companion record:
      KN-OPEN-3f7a21 shows the literature corpus's verification field is
      unreliable corpus-wide, so a corpus screen cannot establish external
      novelty. External novelty is NOT claimed; the standard practice of
      singleton pruning in sparse index-calculus linear algebra is explicitly
      flagged as RECALLED, UNVERIFIED prior art that Stage 0 must check.

  literature_context:
    - >-
      Structured Gaussian elimination / singleton column pruning in
      index-calculus and factoring implementations. RECALLED, UNVERIFIED. No
      author, venue, year, theorem, or page is asserted. This is a CANDIDATE TO
      CHECK and the check is Stage 0 of EXP-RELN-c17137's companion. If the
      threshold x_m or an equivalent is already standard, this record's
      contribution reduces to the SECOND half (the source-bias measurement),
      and the record must be rewritten to say so rather than quietly keeping
      the framing.
    - >-
      DEC-20260724-020 (READ) limitations: "Relation rank and independence were
      not measured; the metrics score a rank-deficient base as tied with a
      random base of the same size." This is the internal statement of the gap
      and it is quoted exactly.
    - >-
      KN-FIND-007 (READ): "Relation rank and independence are not captured: the
      mean scores a rank-deficient base as tied with a random base of the same
      size." Same gap, independently stated.
    - >-
      KN-LIT-009 and KN-LIT-025 are NOT READ (both corpus entries say so
      themselves) and nothing in this record depends on either.

  lossy_projection_identifiability_audit:
    projection: >-
      Full relation stream (a_i, b_i, e_i)_{i<=R} --> the running column
      support U(R), i.e. the 0/1 pattern of which factor-base elements have
      been used at all.
    what_is_discarded: >-
      The exponent multiplicities, the targets, the scalars a_i and b_i, the
      order in which columns were first touched, and everything about the
      curve. Only a growing subset of [B] is retained.
    why_genuinely_lossy: >-
      Massively lossy: the fibre over a given support set contains every
      relation stream that touched those columns, which is astronomically
      large. The discard is real, not cosmetic.
    why_compatible_with_the_operations: >-
      Compatible in the exact sense required: the retained part propagates
      DETERMINISTICALLY under the operation that the pipeline performs on
      relations, namely appending a row. U(R+1) = U(R) union supp(e_{R+1}) --
      the support is a monoid homomorphism from relation streams to subsets
      under union. And the retained part still bounds the quantity of interest,
      because rank(A) <= |U(R)| always. So this is a projection that loses
      almost everything and still controls the answer, which is the shape the
      inventor protocol asks for.
    is_it_only_a_change_of_coordinates: >-
      NO -- and the check is explicit. From U(R) one cannot recover the
      relations (the fibre is huge), so this is not the
      (Delta, Pi) = (x XOR y, x*y) char-2 failure where the pair is recoverable
      as the roots of t^2 + Delta t + Pi and nothing is gained. THE MIRROR
      FAILURE WAS ALSO CHECKED AND IS THE REAL RISK HERE: is T(R) constant
      across instances? It is NOT constant -- it is a random variable whose
      forced mean is B(1 - (1-1/B)^{mR}) and whose value provably separates a
      uniform source (T/B -> 1 - e^{-mR/B}) from a biased source (strictly
      smaller, by Jensen, with the gap growing in the dispersion of {q_j}).
      Nonzero comparator spread is therefore demonstrated by a derivation, not
      asserted. HONEST RESIDUAL: the support alone is NOT sufficient for the
      augmented-rank threshold of Step 4, and this record does not pretend it
      is -- Step 4 explicitly leaves the projection and works with the matrix.

  assumptions:
    - >-
      That a nonzero left-kernel vector generically yields a usable logarithm,
      i.e. that (sum v_i a_i, sum v_i b_i) is not (0,0). This fails exactly for
      degenerate dependencies and is the reason Step 4 promotes the augmented
      matrix to the primary object. It is stated, not assumed away.
    - >-
      That relations are collected sequentially and independently. Batched or
      sieve-like collection with reuse correlates rows and changes E[T(R)]; the
      contract measures the real stream rather than assuming this.
    - >-
      That m is fixed. The companion proposal IDEA-20260805-faad4b examines
      unbounded m, where the whole threshold analysis changes shape.

  predictions:
    - metric: >-
        Simulated left-kernel-emergence threshold R*/B under uniform random
        size-m multiset relations, B in {64, 128, 256, 512}, m in {2,3,4,5},
        200 independent streams per cell, reported as the median first R with
        R > T(R)
      direction: different
      minimum_effect: >-
        FORCED VALUES DERIVED PRE-RUN: 0.796812 (m=2), 0.940480 (m=3),
        0.980173 (m=4), 0.993023 (m=5), each with an O(1/B) finite-size
        correction that the contract derives explicitly before the run. PASS
        BAND: median R*/B within 3/sqrt(B) of x_m at every cell. This CAN fail
        -- a wrong threshold, a wrong concavity argument, or an implementation
        that requires all columns touched would all miss.
    - metric: Monotonicity of the measured R*/B in m
      direction: higher
      minimum_effect: >-
        Strictly increasing across m = 2,3,4,5 at every B, five graded points,
        approaching 1. A non-monotone result localizes the fault to a specific
        m rather than leaving a bare failure.
    - metric: >-
        Touched fraction T(R)/B at R = B, measured versus the forced
        1 - (1 - 1/B)^{mB}
      direction: different
      minimum_effect: >-
        At m = 3, B = 256: forced value 1 - (1 - 1/256)^{768} = 0.95098 to five
        places. Agreement to within 3 standard errors. This is a second,
        independent forced value on the same run and it costs nothing extra.
    - metric: >-
        Gap between the support threshold (first R with R > T(R)) and the
        AUGMENTED-RANK threshold (first R with rank([A|a|b]) > rank(A)), under
        the uniform source
      direction: different
      minimum_effect: >-
        Predicted 0 or 1 rows (the two thresholds coincide up to a single row
        for a uniform source). A gap of more than 2 rows at any cell means rank
        falls materially below the support bound even without bias, which would
        be a genuine and unexpected finding about sparse weight-m matrices over
        Z_N at these sizes and must be reported as such.
    - metric: >-
        Same gap under a DELIBERATELY BIASED source with column-usage
        probabilities following a power law q_j proportional to j^{-alpha},
        alpha in {0, 0.5, 1.0, 1.5, 2.0}
      direction: higher
      minimum_effect: >-
        Strictly increasing in alpha, with alpha = 0 reproducing the uniform
        cell exactly (that is the internal consistency check) and alpha = 2
        showing a gap of at least 10 rows at B = 256, m = 3. If the gap does
        NOT grow with alpha, the instrument cannot see bias at all and no
        conclusion about real relation sources may be drawn from it.

  minimal_test:
    design: >-
      Cheapest-first, four stages, each able to end the line. STAGE 0 (reading,
      zero compute): check whether the threshold x_m or singleton-pruning
      equivalent is standard prior art; record the finding either way, and
      restate the contribution accordingly. STAGE 1 (arithmetic, zero compute):
      derive x_m, verify the fixed-point uniqueness argument, and compute the
      finite-B corrections. If the fixed point is not unique or the concavity
      argument fails, the line stops here. STAGE 2 (simulation, seconds to
      minutes, pure Python plus numpy): the uniform arm, the graded m ladder,
      and the power-law bias ladder. STAGE 3 (bounded, optional): replay the
      same counters on any REAL relation stream this program can produce or
      has archived, and report the measured usage distribution {q_j}. Stage 3
      is explicitly not authorized by this record.
    controls:
      - >-
        NULL OBJECT (uniform-source relation stream at matched B, m, R). FORCED
        VALUE DERIVED PRE-RUN: R*/B = x_m and T(B)/B = 1 - (1-1/B)^{mB}. It CAN
        fail: any error in the concavity or independence argument shows up as a
        systematic offset.
      - >-
        POSITIVE CONTROL / PLANTED EFFECT (power-law biased source at
        alpha = 2). The instrument MUST detect a materially larger
        support-versus-augmented-rank gap here. If it does not, the instrument
        cannot see relation dependence and NO negative about real relation
        sources may be reported from it.
      - >-
        SECOND POSITIVE CONTROL, DEGENERATE BY CONSTRUCTION: a source that
        emits only rows drawn from a fixed sub-base of size B/4. The support
        saturates at B/4 and the left kernel appears at R = B/4 + 1 with the
        augmented rank stuck. Both thresholds are exact integers known before
        the run, so this control is a hard pass/fail.
      - >-
        GRADED CONTROL, two independent axes with >= 3 interior points each:
        m in {2,3,4,5} and alpha in {0, 0.5, 1.0, 1.5, 2.0}, monotonicity
        reported on both.
      - >-
        ORDERING CONTROL: the uniform arm is generated, measured and hashed
        before any biased arm is generated, and the decision rule is executed
        on it first.
      - >-
        ARCHIVE CHECK (zero compute). NOT AVAILABLE: no archived measurement of
        relation rank, relation independence, or column support exists in this
        corpus as far as the screen could see, and two decisions state so
        directly. The unavailability is recorded as an absence, not claimed as
        a passed check.
    required_metrics:
      - per-cell median and interquartile range of R*/B, with the forced value printed first in the same record
      - T(R)/B curve on a grid of R, with the forced curve overlaid and the residual reported
      - support threshold and augmented-rank threshold separately, and their gap
      - measured column-usage distribution {q_j} with its dispersion, per arm
      - seeds and the seed derivation rule for every stream

  falsification_conditions:
    - >-
      Measured median R*/B under the uniform source lies outside the derived
      band at any (B, m) cell. The threshold derivation is wrong; the record is
      withdrawn or corrected by a superseding record.
    - >-
      The support and augmented-rank thresholds differ by more than 2 rows
      under the uniform source. The support bound is then too weak to be the
      operative quantity even in the ideal case, and the framing must move
      entirely to the augmented rank.
    - >-
      The power-law positive control produces no growing gap. The instrument is
      blind to bias; no negative may be reported.
    - >-
      Stage 0 finds that x_m or an equivalent is standard published prior art
      AND that the source-bias measurement has also been done. The proposal is
      then a rediscovery and must be recorded as one.

  confounders:
    - >-
      MULTISET VERSUS SET AND SIGNS. A Semaev relation over x-coordinates is
      naturally signed and may repeat an element; the touched-column analysis
      is unaffected (support is support), but the count m and hence x_m must
      match the convention actually used. The contract fixes the convention
      before any arm runs.
    - >-
      FINITE B. The asymptotic 1 - e^{-mx} understates the exact
      1 - (1-1/B)^{mR} at small B. The exact form is used throughout and the
      asymptotic appears only as a label; conflating them would shift x_3 by
      roughly 1/B and could manufacture a false miss at B = 64.
    - >-
      RANK OVER Z_N VERSUS OVER A FIELD. N is prime in the tested cells so Z_N
      is a field and Gaussian elimination is valid. For composite N the rank is
      not well defined and the analysis must be redone; the contract restricts
      to prime N and says so.
    - >-
      THE DISCOUNT IS FLATTERING. A result of the form "the program has been
      overcharging" is the kind of finding an agent is tempted to inflate. It
      is at most 5.95% at m = 3 and the record states the number rather than
      the adjective.

  interpretation_limits:
    - >-
      MOVES NO EXPONENT. A few per cent on one stage of one cost model. Any
      citation that presents this as an asymptotic improvement is misusing it.
    - >-
      Nothing here says a decomposition is easier to FIND. The cost per
      relation is untouched and it is the exponent-carrying factor.
    - >-
      A measured bias in a real relation stream is a property of THAT solve on
      THOSE cells, not a property of index calculus. Toy tier, and the tier may
      not be raised downstream.
    - >-
      This does not overturn, weaken, or reinterpret DEC-20260724-020,
      KN-FIND-007, or EV-FBG-001. It occupies the boundary those records
      explicitly declare untested, which is the opposite of contradicting them.

  heuristic_assumptions:
    - id: HEUR-RANK-1
      statement: >-
        For a uniform random source, rank(A) equals the support size T(R) up to
        O(1) for the tested (B, m, R) ranges -- i.e. weight-m rows over Z_N
        touching T columns are in general position on those columns.
      rigorous_support: >-
        PARTIAL AND STATED AS SUCH. Over a field, R random weight-m vectors
        supported on T columns are linearly independent with probability
        approaching 1 when R < T and N is large, because a fixed nonzero
        combination vanishes with probability at most 1/N per constraint and
        the union bound over the 2^R sign patterns is not tight but is
        sufficient for N >> 2^R -- WHICH DOES NOT HOLD at B = 512, N = 2^18.
        THIS IS THE WEAKEST LINK IN THE RECORD and it is the reason the
        augmented rank is MEASURED rather than derived.
      validation_plan: >-
        Direct incremental rank computation over Z_N at every cell, reported
        alongside the support count. The gap IS the measurement.
    - id: HEUR-RANK-2
      statement: >-
        Relation streams from a real decomposition solve have column-usage
        probabilities {q_j} that depart from uniform by an amount detectable at
        B <= 512.
      rigorous_support: >-
        NONE. This is a conjecture about solver behaviour, motivated by the
        fact that every factor-base geometry in this corpus (small-x, interval,
        greedy) imposes structure the solver can see. It is not load-bearing
        for the forced values; it is the motivation for Stage 3, which this
        record does not authorize.
      validation_plan: >-
        Stage 3 only, under a separate Coordinator authorization, on archived
        or newly produced relation streams.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVED, stated plainly. The relation-collection stage's row
      count changes by a factor (1 - x_m), which is 0.203 at m = 2, 0.0595 at
      m = 3, 0.0198 at m = 4 and 0.0070 at m = 5 -- a constant factor that
      shrinks as m grows, i.e. it vanishes precisely in the regime any
      asymptotic argument would use. It is worth measuring because the SECOND
      half (source bias and augmented rank) has no derived bound and could move
      the row count in either direction by an unknown factor.
    memory_exponent: >-
      Unchanged. The linear-algebra stage still holds an R x B sparse matrix;
      reducing R by a few per cent reduces memory by the same few per cent.
    best_known: >-
      Pollard rho at N^{1/2} time, O(1) memory, remains the prime-field ECDLP
      baseline and is not approached here.
    hidden_overhead: >-
      The augmented-rank threshold requires incremental elimination, which
      costs more than a support counter; at B <= 512 this is seconds and is
      stated rather than hidden.
    tradeoff_note: >-
      Fewer rows is strictly better on time, memory and the elimination stage
      simultaneously, so there is no tradeoff to report on the discount side.
      On the bias side the tradeoff is real and unmeasured, which is the point.

  dominated_by: >-
    null, after checking the frontier, on the axis this proposal occupies
    (what is known about the number of relations required). Rows checked:
    (1) DEC-20260724-020 and EV-FB3-001 -- 288 cells, yield and coverage only,
    the decision's own limitations say rank and independence were not measured,
    so it does not dominate; (2) KN-FIND-007 -- first-moment theorem, states in
