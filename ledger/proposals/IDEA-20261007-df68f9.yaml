idea:
  id: IDEA-20261007-df68f9
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: Supersingular 3-isogeny graph at p = 23 has one component
  class: measurement
  claim: >-
    Let p = 23. Let J be the set of supersingular j-invariants in
    F_{p^2}. Let G be the undirected simple graph on J with an edge
    between distinct vertices when a cyclic isogeny of degree 3
    exists between curves of those j-invariants, duals counted once.
    Then G has exactly one connected component.
  mechanism: >-
    The object is the j-line with the degree-3 modular correspondence.
    Sigma is adjacency in G. The component count is invariant under
    renaming vertices. It is not the number of F_{p^2}-roots of a
    2-division cubic, not a character sum, and not a count of
    F_p-subset edges. One extra component falsifies the claim. No
    path-finding algorithm and no change to the p^{1/3+o(1)} bound
    is proposed.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves have the same number of points. That row
        does not state the number of components of the degree-3
        graph at p = 23.
      verified_by: coordinator
    - ref: RQ-SSI-001
      provenance: internal
      claim: >-
        Toy-scale auxiliary structure on surviving supersingular
        assumptions is in scope, and toy-only effects are
        hypothesis-generating only.
      verified_by: coordinator
  assumptions:
    - Vertices are supersingular j-invariants in F_{p^2}, one per j, not one per twist.
    - An edge exists only for a cyclic kernel of size 3. Inseparable isogenies are not edges.
    - Dual isogenies contribute one undirected edge.
  predictions:
    - metric: number of connected components of G
      direction: lower
      minimum_effect: The component count equals 1. A count of 2 or more is the negative.
  minimal_test:
    design: >-
      List supersingular j-invariants in F_{p^2} at p = 23, evaluate
      the degree-3 modular correspondence, and count connected
      components of the undirected graph. Before that count, the
      same correspondence routine must return an edge for a Vélu
      3-isogeny from a curve with a rational point of order 3, and
      must return no edge for the pair of j-invariants 0 and 1.
    controls:
      - A known cyclic 3-isogeny produces an edge, and the pair (0, 1) does not.
      - Isolated vertices are counted as components. Dropping them voids the count.
      - The graph is built on j-invariants, not on twists. Splitting one j into two vertices voids the run.
    required_metrics:
      - number of vertices
      - number of undirected edges
      - number of connected components
      - pass or fail of the Vélu edge check
  falsification_conditions:
    - The component count is 2 or more after the Vélu edge check passes.
    - The Vélu edge check fails. No component count from that run is admissible.
  confounders:
    - Counting directed duals as two edges does not change components, but dropping one direction of a bridge can.
    - Treating two twists of one j as two vertices inflates the vertex set.
  interpretation_limits:
    - One component at p = 23 does not change the supersingular isogeny exponents.
    - The claim says nothing about degree 2 and nothing about rational 2-torsion.
    - This is not a public-key construction and not a security claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The supersingular ell-isogeny graph is assumed connected at
        ell = 3 and p = 23. No expander or Ramanujan theorem was
        opened to force that connectivity.
      rigorous_support: >-
        A finite undirected graph has a well-defined component
        count. Transfer of a general connectivity statement onto
        this prime was not read from a paper in this session.
      validation_plan: >-
        Direct enumeration at p = 23, and the same graph at p = 19
        as a second scale. Comparison is the component count against
        1. Refutation is a count of at least 2 at either prime.
  target_complexity:
    time_exponent: >-
      Unchanged. The archived supersingular isogeny algorithm remains
      p^{1/3+o(1)} under its stated heuristic. This graph census
      moves no exponent.
    memory_exponent: >-
      Unchanged. The census stores the vertices at p = 23, which is
      a finite list, and does not touch the archived memory exponent.
    best_known: >-
      Surviving supersingular path-finding costs stay at the bounds
      named by RQ-SSI-001. KR-RHO-755e35 equates point counts and
      does not price this component count.
    hidden_overhead: >-
      No new o(1) is claimed. Building G at p = 23 contributes no
      asymptotic term.
    tradeoff_note: >-
      No time-memory tradeoff. The second prime p = 19 is a
      validation sample, not an attack.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      The claim is a component count of one toy graph. It is not a
      cost, algorithm, or exponent on the ECDLP frontier.
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row equates point counts inside an isogeny class. It
          does not state that the degree-3 graph at p = 23 has one
          component. The gap is 1 component versus 2 or more.
        verified_by: coordinator
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: orthogonal
        delta: >-
          MOV, Frey-Ruck, and anomalous attacks are curve checks.
          This idea does not restate them and does not propose a
          pairing transfer. The numerical gap remains one component
          versus two.
        verified_by: coordinator
    searched:
      corpus_grep:
        - origin/main ledger/proposals titles for RQ-SSI-001 dated 20261005 through 20261007
        - pull requests 1968 and 1969 idea claims
      web: []
  dominated_by: >-
    KR-RHO-755e35 was opened. It equates point counts and does not
    dominate a component count. KR-RHO-53c89f was opened. It does
    not state this graph. No opened row dominates the gap between
    1 component and 2 components.
  sota_delta: >-
    Claimed component count 1. A second component raises the count
    by at least 1. The comparison is that integer gap, not an
    exponent.
