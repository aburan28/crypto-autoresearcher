    - ref: IDEA-20260824-446c2e
      provenance: internal
      claim: >-
        PRIOR ART FOR THE ADJACENT INSTRUMENT AND EXPLICITLY NOT THE SAME ONE. Proposes the
        truncated Nagao sum S_X(E) = (1/X) * sum over p at most X of (-A_E(p) * log p) as an
        estimator of rank E(Q(t)) accurate to within plus or minus 1 at X = 2000 for
