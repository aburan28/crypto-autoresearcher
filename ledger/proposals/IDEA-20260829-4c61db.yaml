idea:
  id: IDEA-20260829-4c61db
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  goal_id_note: >-
    ROUTING ONLY. GOAL-ECQ-2298dc is `blocked`; filing a proposal is not a dispatch and does
    not resume it. Any run needs its own Coordinator decision meeting a resume condition of
    DEC-20260824-b7557b.

  title: >-
    This program has never held an UPPER bound on generic rank over Q(t): implement
    Gillibert-Levin p-descent for elliptic surfaces and measure the ARITHMETIC DEFECT against
    the Shioda-Tate geometric ceiling

  class: algorithm

  claim: >-
    Every ceiling this program has ever computed for a family over Q(t) is GEOMETRIC. The
    Shioda-Tate cap 10*chi - 2, the per-family value 18 - sum(m_v - 1) computed on 13,391
    Mestre families in KN-FIND-e1b836, and the exact 8 proved for the pencil in KN-FIND-6b3e17
    all bound rank MW over Qbar(t). None of them bounds rank MW over Q(t), which is what a
    specialisation actually inherits, and the ONLY upper bound this program has ever produced
    for an arithmetic rank over Q(t) is lane L5's "arithmetic 0" read off a 31-point
    specialisation sample with no committed run record -- a procedure DEC-20260825-a74c9e
    records as invalid in the form it was applied. THE CLAIM UNDER TEST: Gillibert and Levin's
    p-descent for elliptic surfaces (arXiv:1808.08938) yields, for a non-constant elliptic
    surface over Q of declared discriminant degree, an UNCONDITIONAL upper bound R_p(X) on
    rank MW(X over Q(t)), computable at a cost polynomial in the degree of the discriminant and
    the size of its coefficients; and the ARITHMETIC DEFECT A(X) = ST_geom(X) - R_2(X) is
    STRICTLY POSITIVE with median at least 2 across a declared census of at least 200 in-repo
    families of certified fibre configuration. TWO READINGS ARE PRE-DECLARED. If A is
    concentrated at 0 -- the geometric ceiling is essentially attained arithmetically -- then
    this program's existing family-selection gates (KN-FIND-e1b836's squarefree-discriminant
    pre-filter, KN-FIND-91f871's height-envelope gate) are correctly specified, the geometric
    budget is the real budget, and the base-rank lane can be planned on numbers already held.
    If A has median at least 2, then EVERY family census this program has run over-counted the
    available base rank by that amount, the 0.688 percent high-ceiling stratum of
    KN-FIND-e1b836 is a stratum of GEOMETRIC ceilings that arithmetic does not deliver, and the
    correct gate is arithmetic rather than geometric -- which reprices the base-rank lever with
    a number rather than a verdict.

  mechanism: >-
    The gap between geometric and arithmetic rank over Q(t) is the same Galois-descent loss
    that lane L5 measured at its extreme (geometric 15, arithmetic 0) and that
    DEC-20260824-b7557b's resource_check identified as the campaign's mis-tracked object. There
    are two ways to get at it and this program has neither. The FIRST is to compute the Galois
    action directly, which needs the field of definition of the Mordell-Weil group; that is
    IDEA-20260829-ece95f's route and its instrument is external, heavy and possibly
    Magma-bound. The SECOND, proposed here, sidesteps the Galois module entirely: a p-descent
    performed ON THE SURFACE rather than on a fibre bounds rank MW(X over Q(t)) from above by
    the F_p-dimension of a Selmer group, which is a cohomological object computed from the
    surface's own local data. This is the exact analogue of what 2-descent does for a curve
    over Q, transplanted one level up, and the transplant is what Gillibert-Levin supply: their
    abstract states that under mild hypotheses they obtain an upper bound for the rank of a
    non-constant elliptic surface over a perfect field of characteristic not 2 or 3, and that
    at p = 2 the bound is an ARITHMETIC REFINEMENT of the well-known geometric bound deduced
    from Igusa's inequality. "Arithmetic refinement of the geometric bound" is precisely the
    quantity this record calls A(X), named by its authors, and the entire proposal is to
    compute it at scale on objects this repository already owns and to see whether it is a
    rounding error or the binding constraint. Crucially the cost profile is the OPPOSITE of
    everything this program has measured: EV-ECQ-0d142e records descent cost driven by
    coefficient size with Spearman +0.765 between log|a6| and timeout, and 31 of 31 timeouts at
    a4 of order 1e19, because descent on a FIBRE sees the specialised integers. A descent on
    the SURFACE sees polynomials of degree at most 4d and 6d with small coefficients, and never
    specialises at all -- so the instrument's cost is decoupled from the exact parameter that
    kills the existing one.

  tracked_object:
    object: >-
      The p-Selmer group of the elliptic surface X over Q(t) -- a finite F_p-vector space built
      from the surface's local data at the places of Q(t) -- projected onto its F_p-dimension.
      NOT the Mordell-Weil group, NOT the sections, NOT any fibre, NOT any specialisation.
    lossy_projection_test: >-
      PASSES. The projection sends the surface, its Mordell-Weil group, every section, every
      fibre and every specialisation to a single non-negative integer. From that integer one
      cannot recover a point, cannot decide whether the bound is attained, cannot distinguish
      Mordell-Weil rank from Sha, and cannot reconstruct the surface. It is discarded
      COMPATIBLY with the operations the pipeline performs, and in a way the group itself is
      not: the Selmer group sits in an exact sequence functorial in the base, so a quadratic
      base change or a constant twist induces an explicit map on Selmer groups and the retained
      dimension propagates with a determined restriction-corestriction bound in one step,
      whereas the rank itself does not propagate at all without solving the same problem again.
      That asymmetry -- deterministic under base change and twist, blind to attainment -- is
      exactly what makes it a genuine object and not a change of coordinates on MW.
    what_the_loss_costs: >-
      The bound is an UPPER bound only. It exhibits no section, cannot certify any rank from
      below, and cannot distinguish a family of true arithmetic rank r from one of rank r - 2
      with a two-dimensional 2-part of Sha. Every use of it must keep the two roles apart: this
      instrument PRUNES a census and never certifies a family.

  novelty_status: unverified
  novelty_note: >-
    THE METHOD IS PUBLISHED AND IS NOT CLAIMED AS NEW. A WebSearch and a WebFetch this session
    confirmed the existence, authors, venue-independent arXiv identity and abstract of
    Gillibert and Levin, "Descent on elliptic surfaces and arithmetic bounds for the
    Mordell-Weil rank", arXiv:1808.08938, submitted 27 August 2018, final version 30 June 2021.
    WHAT IS NEW IS INTERNAL AND MEASURABLE: this repository has NO implementation of a
    surface-level descent, no upper bound on any arithmetic rank over Q(t) obtained by any
    valid route, and a documented instance (DEC-20260825-a74c9e) of the substitute procedure
    being applied invalidly. A corpus grep this session over ledger/ideas/ and
    knowledge/findings/ for "descent", "Selmer", "upper bound" and "Q(t)" found
    IDEA-20260824-446c2e proposing a NAGAO-SUM ORACLE for generic rank -- a heuristic estimator
    claimed accurate to plus or minus 1 at X = 2000, NOT an unconditional bound -- and no
    proposal tracking a surface-level Selmer group. Classified as an adaptation: a known
    technique in a setting where this program has only ever used the fibre-level one. External
    checking was PARTIAL -- abstract page only, no theorem read, no hypothesis list checked,
    and no search run for a competing surface-descent implementation -- so `unverified` is the
    required label and the phrase "mild hypotheses" in the authors' abstract is an UNRESOLVED
    dependency, not a checked condition.

  citations:
    - ref: "arXiv:1808.08938"
      provenance: retrieved
      claim: >-
        Jean Gillibert and Aaron Levin, "Descent on elliptic surfaces and arithmetic bounds for
        the Mordell-Weil rank", submitted 27 August 2018, final version 30 June 2021. ABSTRACT
        STATES: the authors introduce the use of p-descent techniques for elliptic surfaces
        over a perfect field of characteristic not 2 or 3, and under mild hypotheses obtain an
        UPPER BOUND for the rank of a non-constant elliptic surface; when p = 2 the bound is an
        arithmetic refinement of a well-known geometric bound for the rank deduced from Igusa's
        inequality; the results apply to elliptic surfaces over the rational numbers. The
        abstract page carries NO complexity statement, NO runtime bound and NO implementation
        reference, and this session found none.
      verified_by: >-
        idea-generator session 2026-08-29, WebFetch of the arXiv ABSTRACT PAGE for 1808.08938.
        The full text was not read. The phrase "mild hypotheses" is quoted from the abstract
        and its content is NOT known to this session; no theorem, hypothesis or bound from the
        paper is relied on as verified.
    - ref: KN-FIND-e1b836
      provenance: internal
      claim: >-
        The census this proposal consumes. Over an exhaustive census of 13,077 admissible
        canonical integer 6-tuples of spread at most 74 plus 314 further families, EVERY family
        of Mestre's rank-12 quartic construction carries a multiplicative fibre at T = infinity
        of type I_4 (13,352 of 13,391) or I_6 (39), so the construction's Shioda-Tate cap is 15
        and never 18; the per-family ceiling is exactly 18 - sum(m_v - 1) on 13,391 of 13,391
        families; only 90 of 13,077 (0.688 percent) reach ceiling at least 13. THESE ARE ALL
        GEOMETRIC CEILINGS, which is the gap this proposal targets. The free pre-filter is one
        resultant on a degree-20 polynomial.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-e1b836.md
    - ref: KN-FIND-6b3e17
      provenance: internal
      claim: >-
        The positive control with a two-sided known answer. The pencil-of-cubics surface has
        squarefree degree-12 discriminant, twelve irreducible I_1 fibres, geometric Mordell-Weil
        rank EXACTLY 8 by Shioda-Tate with nothing to subtract, and all eight sections
        Q-RATIONAL and verified as polynomial identities over Q(t). So its arithmetic rank over
        Q(t) is also exactly 8, and the instrument must return R_2 at least 8; returning less
        would contradict an exhibited-section certificate and voids the instrument.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-6b3e17.md
    - ref: DEC-20260824-b7557b
      provenance: internal
      claim: >-
        Lane L5 closes "substitute a published surface of high GEOMETRIC rank" on the measured
        quantity "arithmetic Mordell-Weil rank over Q(t), bounded ABOVE by the minimum
        specialisation rank", value geometric 15 against arithmetic 0 over 31 specialisations,
