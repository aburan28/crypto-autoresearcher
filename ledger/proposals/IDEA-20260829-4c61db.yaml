      verified_by: null

  assumptions:
    - >-
      The "mild hypotheses" of the authors' abstract are satisfiable by the families in the
      declared census, or the census is restricted to those where they are. This is UNCHECKED
      by this session because only the abstract was read, and resolving it is step 0 of the
      design; if the hypotheses exclude the Mestre quartic families the census changes and the
      proposal shrinks to the surfaces that qualify.
    - >-
      A correct implementation is possible from the published paper within the declared
      implementation budget. The paper carries no implementation reference that this session
      found, so this is a build-from-the-paper assumption and is the largest schedule risk.
    - >-
      The families in the census are NON-CONSTANT elliptic surfaces, which the abstract
      requires. Every family in KN-FIND-e1b836's census is non-isotrivial by construction, and
      the design re-checks non-constancy from each family's own j-map rather than assuming it.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the campaign's cost: deciding whether a candidate
      family can host the base rank its GEOMETRIC ceiling advertises, without spending descent
      on its specialisations. Today that decision is made on a geometric number, and the only
      arithmetic check available is to specialise and certify, which EV-ECQ-0d142e measures at
      about 7.5 s per completed descent with 60 percent censoring. A surface-level upper bound
      makes the decision once per family, on polynomial data, and never specialises.
    baseline_embedding:
      parameter_slice: >-
        The geometric bound itself. At p = 2 the authors' abstract states their bound is an
        arithmetic REFINEMENT of the geometric bound from Igusa's inequality, so the geometric
        bound is the exact parameter slice: the new bound must be at most the old one on every
        family, and A(X) = ST_geom - R_2 must be non-negative everywhere. A single negative A
        is an implementation error, not a discovery.
      reproduction_check: >-
        Frozen fixture with a committed ground truth. Recompute ST_geom = 18 - sum(m_v - 1) for
        all 13,391 families of KN-FIND-e1b836's census from each family's own discriminant, and
        require EXACT agreement with the committed deliverable on 13,391 of 13,391, with the
        Euler check sum(deg * v_disc) = 24 = 12d passing. A pipeline that cannot reproduce the
        committed geometric ceiling may not report an arithmetic one.
    observation_collision:
      observable: >-
        The integer R_p(X), and the defect A(X) = ST_geom(X) - R_2(X).
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE CENTRAL INTERPRETIVE DANGER. A large defect A has TWO
        distinct causes that the observable cannot separate: (a) genuine Galois descent loss,
        the mechanism this record is about; and (b) a nontrivial 2-part of the Tate-Shafarevich
        group of the surface, which inflates the Selmer dimension and therefore SHRINKS nothing
        -- note the direction: Sha makes R_2 LARGER, hence A SMALLER, so Sha cannot manufacture
        a large defect but can HIDE one. The dangerous direction is the reverse collision: a
        SMALL measured defect is equally produced by "descent loss is genuinely small" and by
        "Sha is large enough to fill the gap". Separation condition, declared in advance: on
        every family where an exhibited-section lower bound L(X) is also available, report the
        triple (L, R_2, ST_geom); families with L = R_2 have a SHARP bound and a defect
        attributable to descent, and only those enter the headline median. Families with
        L strictly below R_2 are reported separately as an interval and never collapsed.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the group-theoretic model (compute MW(X over Q(t)) or its Galois module) by
          the cohomological model (compute a Selmer dimension from local data), where the
          hypothesis becomes a finite F_p-linear algebra problem over the places of Q(t).
        predicted_gain: >-
          An upper bound this program has never had, at a cost decoupled from specialised
          coefficient size, which is the single variable EV-ECQ-0d142e identifies as driving
          every timeout it measured.
      - transform: boundary_lift
        proposed_object: >-
          The certificate family for a family-selection gate enlarges from "geometric ceiling"
          to "geometric ceiling AND arithmetic upper bound"; the strict inward improvement to
          be demonstrated is A(X) at least 1 on a positive fraction of the census.
        predicted_gain: >-
          Every family census this program holds gets an arithmetic column, retroactively, at
          no new descent cost.
      - transform: specialization_pack
        proposed_object: >-
          Charge the census cost per FAMILY over the pre-filtered 90-family high-ceiling
          stratum plus a matched random sample from the 12,987 remaining, which are disjoint
          blocks, rather than per specialisation.
        predicted_gain: >-
          A defect distribution over a stratified census whose denominators are declared before
          any family is measured.
    quantifier_order: >-
      DECLARED BEFORE THE CENSUS RUNS. FOR ALL families X in the declared census satisfying the
      authors' hypotheses, THERE EXISTS an integer R_2(X), computed from X's local data alone,
      such that FOR ALL sections P of X over Q(t) the rank of the group they generate is at
      most R_2(X). The bound is allowed to depend on X; it is NOT allowed to depend on any
      section, on any specialisation, or on anything measured after the family was selected.
      The census, the stratification and the denominators are frozen before the first family is
      measured, per RQ-ECQ-e9b361's constraint that every coverage figure is reported as
      numerator over denominator with the denominator recorded first.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this family, rank MW over Q(t) is at most R_2, unconditionally, given the paper's
        hypotheses hold for it." That is an upper bound on a base rank. It certifies no rank
        from below, exhibits no section, says nothing about any specialisation's rank over Q,
        and CANNOT show that any family reaches rank 32 -- the instrument's entire output is of
        the wrong sign for the objective. Its value is exclusively in pruning and in pricing.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion must FAIL: the in-repo pencil, whose
        arithmetic rank over Q(t) is exactly 8 with eight exhibited Q-rational sections. There
        A must be 0 and R_2 must be at least 8. If the instrument reports a positive defect on
        a family whose ceiling is provably attained arithmetically, it is not computing an
        upper bound and every defect it reports elsewhere is void.
    proof_obligations:
      - claim: R_p is an upper bound for rank MW over Q(t) under the paper's stated hypotheses.
        responsibility: correctness
      - claim: The hypotheses hold for each family entering the census, checked family by family.
        responsibility: scope
      - claim: A(X) is non-negative on every family, since R_2 refines the geometric bound.
        responsibility: strictness
      - claim: The committed 13,391-family geometric ceiling table is reproduced exactly first.
        responsibility: baseline
      - claim: R_2 is at least 8 on the pencil, where eight independent sections are exhibited.
        responsibility: baseline
      - claim: The census fits the declared budget at the declared stratification.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        geometric_reproduction -- families of KN-FIND-e1b836's census whose recomputed
        Shioda-Tate ceiling 18 - sum(m_v - 1) matches the committed deliverable
      direction: different
      minimum_effect: >-
        exactly 13,391 of 13,391, with the Euler check passing on every family checked. Any
        mismatch stops the experiment before an arithmetic number is produced.
    - metric: >-
        positive_control_bound -- R_2 on the in-repo pencil, whose arithmetic rank over Q(t) is
        exactly 8 with eight exhibited Q-rational sections
      direction: different
      minimum_effect: >-
        at least 8, and the defect A exactly 0. A returned R_2 below 8 contradicts an exhibited
        certificate and voids the instrument.
    - metric: >-
        arithmetic_defect_median -- the median of A(X) = ST_geom(X) - R_2(X) over the declared
        stratified census of at least 200 families
      direction: higher
      minimum_effect: >-
        at least 2, on families where the bound is sharp (exhibited lower bound equal to R_2).
        A median of 0 with an interquartile range excluding 2 is the pre-declared opposite
        reading and is equally reportable: the geometric ceiling is the real budget and this
        program's existing gates need no arithmetic column.
    - metric: >-
        high_ceiling_stratum_survival -- the fraction of KN-FIND-e1b836's 90 families of
        geometric ceiling at least 13 whose arithmetic bound R_2 is also at least 13
      direction: lower
      minimum_effect: >-
        at most 0.5. If fewer than half the high-ceiling families survive arithmetically, then
        the 0.688 percent stratum this program spent BATCH-8b08ef searching is smaller than it
        looked, by a measured factor, and the coverage figures of that batch acquire a second
        denominator.
    - metric: >-
        kloosterman_upper_bound -- R_2 on the transcribed geometric-rank-15 surface of lane L5,
        re-transcribed under the transcription-identity protocol
      direction: lower
      minimum_effect: >-
        at most 4. This would replace L5's sample-based "arithmetic 0" with an unconditional
        bound and retire the campaign's weakest-link closure. A returned R_2 of 15 says the
        instrument sees no arithmetic loss where a 31-point sample saw total loss, and that
        conflict is itself the reportable result.
    - metric: >-
        nagao_oracle_calibration -- the signed difference between IDEA-20260824-446c2e's
        Nagao-sum estimate and R_2, over the same census
      direction: different
      minimum_effect: >-
        reported as a distribution, not thresholded. The estimator claims plus or minus 1; any
        family where the estimate EXCEEDS the unconditional bound is a falsification of the
        estimator on that family and must be reported as such.

  minimal_test:
    design: >-
      STEP 0 (hypothesis audit, about 4 h, no compute). Read arXiv:1808.08938 AT FULL TEXT, not
      the abstract, and write down the "mild hypotheses" explicitly. Decide, family class by
      family class, which of this repository's censuses satisfy them. If the Mestre quartic
      families do not qualify, the census shrinks here and the proposal is re-scoped BEFORE any
      code is written. A finding that the hypotheses exclude everything this program owns is a
      complete and legitimate answer.
      STEP 1 (reproduction gate, about 1 CPU-hour). Recompute ST_geom on all 13,391 families of
      KN-FIND-e1b836 from their own discriminants and require exact agreement plus the Euler
      check. STOP CONDITION.
      STEP 2 (implementation and positive control, about 3 CPU-hours plus the implementation
      budget). Implement the p = 2 descent. Run on the in-repo pencil: require R_2 at least 8
      and A = 0. Run on the pencil twisted by a non-square, where the arithmetic rank should
      DROP while the geometric ceiling does not: require A strictly positive there. That pair
      is the differential control that separates an arithmetic instrument from a geometric one.
      STEP 3 (the census, about 8 to 20 CPU-hours). Freeze the stratification -- all 90
      high-ceiling families plus a matched random sample of at least 110 from the remaining
      12,987, denominators recorded first -- and compute R_2 on every family. Report A as a
      distribution, stratified, with the sharp and non-sharp subsets separated.
      STEP 4 (the two external re-measurements, about 4 CPU-hours). Re-transcribe Kloosterman's
      surface under the transcription-identity protocol and compute R_2. Run
      IDEA-20260824-446c2e's Nagao sum on the same census and report the signed difference
      against R_2.
    controls:
      - >-
        REPRODUCTION CONTROL: the committed 13,391-family geometric ceiling table must come
        back exactly. If it does not, nothing else runs.
      - >-
        POSITIVE CONTROL WITH A TWO-SIDED KNOWN ANSWER: the in-repo pencil, arithmetic rank
        exactly 8 by exhibited Q-rational sections and geometric ceiling exactly 8. Expected
        R_2 at least 8 and A = 0.
      - >-
        DIFFERENTIAL CONTROL: the SAME pencil twisted by a non-square d. Geometric ceiling
        unchanged at 8, arithmetic rank expected to drop. An instrument returning the same R_2
        on both is computing a geometric quantity under an arithmetic name.
      - >-
        SIGN CONTROL: A must be non-negative on every family, by the authors' own statement
        that p = 2 refines the geometric bound. Any negative A is an implementation error and
        halts the census.
      - >-
        SHARPNESS CONTROL: on every family where an exhibited-section lower bound exists,
        report the triple (lower bound, R_2, ST_geom). Only families with lower bound equal to
        R_2 enter the headline median; the rest are reported as intervals.
      - >-
        CORRUPTED-MODEL CONTROL: run the instrument on a family with one exponent deliberately
        altered. It must fail the transcription-identity check rather than return a plausible
        integer.
    required_metrics:
      - the paper's hypotheses as written down at full text, and per-family qualification
      - recomputed ST_geom for all 13,391 families with the Euler check outcome
      - R_2 per family with wall clock and the polynomial degrees and coefficient sizes involved
      - A = ST_geom - R_2 as a stratified distribution with declared denominators
      - the (lower bound, R_2, ST_geom) triple wherever a lower bound exists, and the sharp fraction
      - fraction of the 90 high-ceiling families surviving arithmetically
      - R_2 for Kloosterman's re-transcribed surface, with the transcription-identity outcome
      - the signed Nagao-oracle minus R_2 distribution
      - peak RSS and any failure, recorded as operational and never as a bound

  falsification_conditions:
    - >-
      If STEP 0 finds the paper's hypotheses exclude every family class this program owns, the
      proposal is falsified as an applicable instrument and the correct report is exactly that,
      with the hypotheses written down so the next reader does not repeat the check.
    - >-
      If the committed geometric ceiling table is not reproduced on 13,391 of 13,391, no
      arithmetic number may be reported.
    - >-
      If R_2 on the pencil comes back below 8, the implementation contradicts an exhibited
      certificate and every number from it is void.
    - >-
      If the pencil and its non-square twist return the same R_2, the instrument is blind to
      arithmetic and the mechanism is falsified as implemented.
    - >-
      If the median defect A over the sharp subset has a confidence interval containing 0 and
      excluding 2, the pre-declared "geometric ceiling is the real budget" reading is recorded
      as the result, with its own consequence: this program's existing family gates are
      confirmed and no arithmetic column is needed.
    - >-
      If A comes back negative on any family, the census halts as an implementation failure and
      no distribution is reported.
    - >-
      An implementation that cannot be completed within the declared budget is an OPERATIONAL
      outcome under AGENTS.md rule 3, reported as a build failure, and is never evidence about
      any family's arithmetic rank.

  confounders:
    - >-
      SHA HIDES DEFECTS, IT DOES NOT MANUFACTURE THEM. A nontrivial 2-part of the surface's
      Tate-Shafarevich group inflates the Selmer dimension and therefore makes A SMALLER, so
      the direction of the bias is toward the null. That is stated because it means a measured
      LARGE defect is robust to this confound while a measured SMALL defect is not, and the
      headline reading must be scoped accordingly.
    - >-
      HYPOTHESIS DRIFT. "Mild hypotheses" is the authors' phrase, read from an abstract. If the
      hypotheses are checked loosely, families that do not satisfy them will still produce
      integers, and those integers will not be bounds. Controlled by the per-family
      qualification record in STEP 0 and by excluding, not adjusting, non-qualifying families.
    - >-
      CENSUS MULTIPLICITY. KN-FIND-e1b836's families are indexed by canonical integer 6-tuples;
      distinct tuples can give isomorphic surfaces. A defect distribution over a multiset with
      unknown multiplicities is not a distribution. Controlled by publishing the
      canonicalisation rule that census already used and by reporting per-class multiplicity.
    - >-
      SELECTION BY THE PRE-FILTER. The 90 high-ceiling families were selected by a
      squarefree-discriminant pre-filter, which selects on the FIBRE CONFIGURATION -- the exact
      input to the geometric ceiling. Any defect measured on that stratum is conditional on
      that selection, and the matched random sample from the other 12,987 exists solely to
      break it.
    - >-
      IMPLEMENTATION QUALITY MASQUERADING AS ARITHMETIC. A descent that silently truncates a
      local computation returns a smaller Selmer dimension and therefore a LARGER apparent
      defect, in the direction of the hypothesis. Controlled by the sign control, the positive
      control and by re-running a random 10 percent at doubled precision and local-place bound,
      reporting how many change.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (BOUND SHARPNESS.) For at least 60 percent of the families in the declared census that
        satisfy the paper's hypotheses and for which an exhibited-section lower bound L(X) is
        available, R_2(X) = L(X), so the reported upper bound is attained and the defect
        A(X) = ST_geom(X) - R_2(X) is entirely attributable to Galois descent rather than to
        slack in the descent.
      rigorous_support: >-
        RIGOROUS PART: R_2 is an unconditional upper bound and L is an unconditional lower
        bound from exhibited sections verified as polynomial identities over Q(t), so the pair
        brackets the truth with no heuristic content whatever; the interval is real data. WHAT
        IS HEURISTIC is only that the interval COLLAPSES often enough for a headline median to
        be meaningful. DISTRIBUTION IMITATED: the empirical regime this program has already
        measured at the fibre level, where EV-ECQ-0d142e records certified rank equal to both
        the low and high ellrank bounds on all 54 completed descents -- 2-descent was sharp
        there, and the assumption is that the surface-level analogue behaves similarly. That is
        an analogy across a level change and is not evidence.
      validation_plan: >-
        Sample: every family in the census carrying an exhibited-section lower bound -- at
        minimum the in-repo pencil (L = 8), its declared quadratic twists, and every Mestre
        family whose rank-12 witness is committed in KN-FIND-e1b836's deliverable (worked
        instance: tuple (0, 20, 40, 45, 52, 77) at t = 23, minimal model
        [0, 0, 0, -75951713419, 5158556462007754], naive height 86.77369390941135, certified
        rank at least 12). Shortcut making this feasible: the lower bounds already exist as
        committed certificates, so no new section search is needed for most rows. Compare: the
        collapse rate against the 60 percent prediction, stratified by geometric ceiling and by
        discriminant degree. Tail check: report EVERY family whose interval stays open together
        with its width, and report the widest interval observed against the fitted collapse
        model; an open interval is published as an interval and never as either endpoint. If
        the collapse rate falls below 30 percent, H1 is falsified and the entire defect
        analysis becomes an analysis of intervals -- which weakens the headline but does not
        void the instrument. TRANSFER ASSUMPTION, STATED: nothing measured about sharpness on
        chi = 1 and chi = 2 families transfers to chi at least 3, which is exactly the class
        DEC-20260824-b7557b E4 identifies as needed for generic rank above 18 and as having
        unstudied descent behaviour here.
    - id: H2
      statement: >-
        (COST DECOUPLING.) For families in the declared census, the wall-clock cost of computing
        R_2 grows polynomially in the discriminant degree and in the bit-size of the family's
        polynomial coefficients, and is UNCORRELATED with the coefficient size of any
        specialisation -- so the Spearman correlation between log of the largest specialised
        |a6| in a family's declared T-box and the family's R_2 wall clock is at most 0.2 in
        absolute value.
      rigorous_support: >-
        RIGOROUS PART: the computation never specialises, so specialised coefficient size is
        not an input to it at all; the correlation should be zero by construction and any
        nonzero value indicates an implementation that specialises somewhere it should not.
        DISTRIBUTION IMITATED: none is needed; this is a falsifiable engineering prediction
        with a mechanistic reason, and it is stated as an assumption only because the
        implementation does not yet exist. It is included precisely because the OPPOSITE
        correlation, +0.765, is the single best-measured fact about this program's existing
        instrument (EV-ECQ-0d142e OBS-6).
      validation_plan: >-
        Sample: all families in the census, each with its committed T-box and the largest
        specialised |a6| in that box already computable at negligible cost. Compare: the
        measured Spearman correlation between log of that quantity and the R_2 wall clock,
        against the predicted 0 and against the +0.765 the fibre-level instrument exhibits.
        Tail check: the ten families with the largest specialised coefficients must not be
        over-represented among the ten slowest R_2 computations; report the overlap count
        against the 1-in-20 expected by chance. If the correlation exceeds 0.2, the
        implementation is leaking a specialisation and must be fixed before the census is
        interpreted. TRANSFER ASSUMPTION, STATED: a decoupled cost at discriminant degree 20 to
        24 says nothing about degree 360, which is the regime IDEA-20260829-ece95f's Shioda arm
        lives in.

  target_complexity:
    time_exponent: >-
      NO CRYPTOGRAPHIC EXPONENT IS CLAIMED OR MOVED. The relevant exponent is the campaign's
      own family-triage cost. CURRENT: deciding a family's usable base rank requires
      specialising and certifying, measured at about 7.5 s per completed descent with 60
      percent censoring, and the cost is driven by specialised coefficient size with Spearman
      +0.765 to timeout -- so the cost grows with the family's height slope, which
      KN-FIND-91f871 shows grows as 1.2(r+2) in the very rank the campaign wants. TARGET:
      polynomial in the discriminant degree (at most 12*chi) and in the family's own
      coefficient bit-size, with no dependence on any specialisation. Predicted per-family
      wall clock: seconds to minutes at chi = 1 and 2, TO BE MEASURED, not asserted.
    memory_exponent: >-
      Expected small and flat: local data at the places dividing the discriminant, an F_2 matrix
      of dimension at most a few times the geometric ceiling. Budget 2 GB peak RSS against the
      1.22 GB the predecessor campaign measured on the same class of box. Peak RSS is MEASURED,
      not asserted.
    best_known: >-
      PUBLISHED: Gillibert-Levin arXiv:1808.08938, an unconditional upper bound on the rank of
      a non-constant elliptic surface, with no implementation reference this session found. IN
      THIS REPOSITORY: no upper bound on any arithmetic rank over Q(t) has ever been computed
      by a valid method. The only attempt, lane L5's minimum-over-specialisations, was recorded
      by DEC-20260825-a74c9e as applying the argument in the wrong direction. The nearest
      in-repo instrument is IDEA-20260824-446c2e's unrun Nagao-sum estimator, which is heuristic
      and two-sided rather than an unconditional bound.
    hidden_overhead: >-
      Three things hide and all three are named. (1) The "mild hypotheses" are unread and may
      exclude the census; that is a total-loss risk on the headline and is why STEP 0 exists.
      (2) The bound has the WRONG SIGN for the objective: it can only ever say a family cannot
      reach 32, never that one can, so the best possible outcome of this instrument is a sharper
      negative. (3) Sha slack sits inside every R_2 and biases the measured defect toward zero,
      so a small measured defect is not evidence that descent loss is small.
    tradeoff_note: >-
      Not a time-memory problem. The real trade is CENSUS BREADTH against HYPOTHESIS RIGOUR:
      more families per hour if qualification is checked loosely, and a qualification checked
      loosely produces integers that are not bounds. Rigour is not tradeable, so qualification
      is checked per family and the census size absorbs whatever budget remains. Trivially
      parallel across families; the campaign's honest concurrency ceiling on this class of box
      is 2 producers (GOAL-ECQ-002 max_concurrent_basis).

  dominated_by: >-
    FRONTIER ROWS CHECKED ACROSS TIME, MEMORY AND DATA. (1) GILLIBERT AND LEVIN DOMINATE THE
    ALGORITHM ITSELF and nothing algorithmically new is claimed here; this program would be
    acquiring a published capability. (2) For families small enough to specialise and descend,
    PARI ellrank on a good fibre dominates on information -- it gives a two-sided answer per
    fibre -- and is dominated in turn on coefficient size, measured at 31 of 31 timeouts at a4
    of order 1e19 while a surface-level bound never sees a specialised coefficient at all. (3)
    IDEA-20260829-ece95f dominates on EXPLANATORY CONTENT: a Galois-module computation says WHY
    the arithmetic rank is smaller and prices every twist at once, where this instrument gives
    one number per surface and no reason; it is dominated in turn on cost and on tooling risk,
    since it may require Magma and this does not. (4) IDEA-20260824-446c2e dominates on speed
    -- under 10 CPU-seconds per family against minutes -- and is a heuristic estimator, not a
    bound, so it dominates only where an error bar is acceptable. (5) The geometric ceiling
    itself dominates on cost by orders of magnitude (one resultant on a degree-20 polynomial,
    per KN-FIND-e1b836) and answers a strictly weaker question. (6) Obtaining a published
    high-rank family (resume conditions R1, R2) dominates the whole lane and is blocked on
    actions this program cannot take. On the axis this record competes on -- an unconditional
    arithmetic upper bound over Q(t) computable without specialising -- no row in this
    repository dominates it, because no row exists.
  sota_delta: >-
    QUANTITATIVELY. Delta on rank over Q: ZERO. Delta on the world record: ZERO. Delta on
    generic rank over Q(t) held by this program: ZERO, and structurally so -- an upper bound
    cannot raise a rank, and the strongest thing this instrument can ever deliver is a sharper
    negative. WHAT MOVES: this program's best arithmetic-rank upper bound over Q(t) goes from
    "one value, 0, read off a 31-point sample on a transcribed model with no run record, by a
    procedure a later decision recorded as applied in the wrong direction" to "an unconditional
    integer per family over a stratified census of at least 200 families with declared
    denominators, a reproduction gate on 13,391 committed geometric ceilings, and a positive
    control whose answer is a theorem". The defect distribution is the deliverable and its
    predicted median of at least 2 is the number that would reprice the base-rank lane; a
    measured median of 0 confirms the existing gates and is equally reportable. Estimated cost
    roughly 16 to 32 CPU-hours plus a high implementation budget.

  estimated_cost:
    implementation: high
    compute: medium
    basis: >-
      Implementation is the dominant cost and the dominant risk: a surface-level p-descent
      built from a paper with no implementation reference located, plus a per-family hypothesis
      qualifier, plus the reproduction harness for the 13,391-family geometric table. Compute
      is roughly 16 to 32 CPU-hours across five steps, dominated by STEP 3, with STEP 0 a
      genuine stop-gate that costs no compute at all and can kill the proposal before a line is
      written -- which is the cheapest possible place for it to die.

  interpretation_limits:
    - >-
      THIS EXHIBITS NO CURVE, CERTIFIES NO RANK, AND CAN ONLY EVER PRODUCE A NEGATIVE. It
      cannot advance GOAL-ECQ-2298dc C1 by a single point; its output has the wrong sign for
      the objective by construction.
    - >-
      An upper bound is not a rank. R_2 may never be cited as a family's generic rank, and a
      family with R_2 = 13 has not been shown to have rank 13.
    - >-
      Scoped to the families in the declared census that satisfy the paper's hypotheses as
      written down in STEP 0, at p = 2, on the software stack actually used. It bounds no
      family outside that set, and nothing here transfers to chi at least 3, which is the class
      DEC-20260824-b7557b E4 says a generic rank above 18 requires.
    - >-
      A measured defect REPRICES the base-rank lane; it does not close it. A measured zero
      defect CONFIRMS existing practice rather than discovering anything, and must be reported
      at that strength.
    - >-
      Rank at least 31 over Q is a live claimed record held by others and nothing here touches
      it.

  recommended_priority: high
  recommended_priority_basis: >-
    High because STEP 0 is a zero-compute stop-gate that can kill or confirm the whole lane for
    the price of reading one paper, and because the instrument, if it exists, retroactively adds
    an arithmetic column to every family census this program already holds. Ranked below
    IDEA-20260829-073172 for FIRST TEST purely on implementation risk: the build is from a paper
    with no located implementation, and the output can only ever be a sharper negative.

