idea:
  id: IDEA-20260905-50b754
  title: Branch-incidence geometry of stacked bisections
  class: mechanism
  claim: The viability of stacking rational bisections is governed by the ramification of their joint squareclass
    cover, not the number of individually soluble conics; deliberately shared branch loci may keep the cover genus
    small while still yielding independently certifiable sections.
  mechanism: For bisection discriminants D_i(t), form the elementary-abelian cover defined by w_i squared equals
    D_i(t). Retain the squareclass span and, at each branch point including infinity, the inertia vector. Riemann-Hurwitz
    computes the genus of the connected normalization from those data. Generic disjoint branching rapidly raises
    genus and destroys the inference that independently parameterized conics share infinitely many rational parameters.
    Shared branching can lower genus, but may also make squareclasses dependent or collapse the added section lattice.
    The proposal searches for a favorable relation between branch-incidence rank and section independence, making
    both losses explicit before point searches.
