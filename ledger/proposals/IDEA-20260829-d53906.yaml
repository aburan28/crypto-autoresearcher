idea:
  id: IDEA-20260829-d53906
  question_id: RQ-ECRANK-27dcc5
  goal_id: GOAL-ECRANK-002
  goal_id_note: >-
    Named because GOAL-ECRANK-002 is the paused goal bound to this question and
    its resume_action is the natural home for this work. Naming a goal is not a
    dispatch, does not unpause anything, and does not authorize a run. Only a
    Coordinator decision does that.
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    Retire floating point from the rank ladder: certify WITHIN-CLASS
    multiplicities by exact F_l reduction instead of a Neron-Tate regulator, and
    test the recorded claim that any degree-8 rank-31 certificate must be weaker
    in kind

  class: composition

  claim: >-
    This program holds two instruments that have never been pointed at each
    other. (i) The eigenspace ladder of EV-ECRANK-b6c9b6 certifies rank over a
    multiquadratic field K as a sum over the square classes of V, and where a
    class carries MORE THAN ONE independent point the certificate falls back on a
    Neron-Tate height regulator computed at 64 digits - floating point, no
    rigorous error bound, and explicitly labelled the weaker artifact in that
    record's own boundaries. (ii) A separate lane built an exact, stdlib-only,
    descent-free independence certifier that establishes Z-independence modulo
    torsion by the F_l-rank of the stacked reduction matrix over a set of good
    primes, and used it to certify 31 jointly independent points on a curve with
    33-digit x-numerators in 1.831 seconds of part-A wall clock
    (RUN-ECQ-f5af06-v2-A-certify, l = 2, 45 good primes, max_prime 1500, torsion
    bound 1, peak RSS 23.2 MB, PARI not used anywhere).
    THE CLAIM IS THAT (ii) SUBSUMES THE REGULATOR STEP OF (i) ENTIRELY. Applying
    the F_l certifier per twist class, over Q, to the exhibited points of the
    committed degree-16 and degree-32 multiplicity certificates converts
    "rank >= 32 over a degree-16 field, regulator-assisted" and "rank >= 52 over
    a degree-32 field, regulator-assisted" into statements with NO floating point
    anywhere, and does so at a cost of seconds. A concrete, falsifiable
    consequence follows: H-ECRANK-f2a2f7's method_ceiling states that "ANY
    degree-8 result at rank 31 rests on within-class multiplicities and therefore
    on height regulators" and would be "strictly weaker in kind than the
    degree-32 exact one already held". If the F_l certifier reproduces the
    multiplicity counts, that clause is FALSE and the whole degree-lowering
    programme loses its recorded strength penalty.

  mechanism: >-
    Fix a base curve E/Q and a subgroup V of Q*/(Q*)^2 of order 2^k, K the
    corresponding multiquadratic field, G = Gal(K/Q) = (Z/2)^k. The exact
    decomposition rank E(K) = sum over d in V of rank E^(d)(Q) means the whole
    certificate factors through Q-arithmetic on 2^k separate curves, and the
    cross-class independence is already exact in EV-ECRANK-b6c9b6: points
    attached to distinct characters lie in distinct isotypic components of the
    Q[G]-module E(K) tensor Q, so the projector e_chi kills the others. The only
    inexact step is WITHIN one class, where several points on the same twist
    E^(d) must be shown Z-independent, and that is where the 64-digit regulator
    enters.
    Replace it as follows. Let P_1..P_m be the exhibited points on E^(d). Choose
    a prime l and a set S of primes p of good reduction for E^(d), p not
    dividing 2 l Delta. Reduction is a group homomorphism E^(d)(Q) -> E^(d)(F_p),
    so it descends to E^(d)(Q)/l -> E^(d)(F_p)/l E^(d)(F_p), an F_l-linear map.
    Stack these over p in S to get a matrix M over F_l with m columns. IF
    rank_{F_l} M = m THEN no nontrivial F_l-combination of the P_i is in
    l E^(d)(Q), hence no nontrivial Z-relation exists modulo torsion and modulo
    l-divisibility; combined with a torsion bound (the reduction E^(d)(Q)_tors ->
    E^(d)(F_p) is injective for p odd of good reduction, so the torsion order
    divides gcd over p in S of #E^(d)(F_p), and Mazur's theorem finishes it) the
    m points are independent modulo torsion. Every step is integer arithmetic:
    exact reduction of rational coordinates, group law mod p, order computation
    mod p, F_l Gaussian elimination.
    THE DIRECTION OF ERROR IS ONE-SIDED AND THAT IS THE POINT. rank_{F_l} M = m
    is SUFFICIENT for independence and never necessary: the certifier can
    under-report but can never over-report. A floating regulator has no such
    guarantee - it can be nonsingular to 64 digits for points that are dependent
    if the implementation transports a point onto the wrong model, which is
    exactly the failure EV-ECRANK-b6c9b6 records as having actually occurred
    (XOR cancellation in coset representatives put 16 points on an isomorphic but
    different curve). So the substitution moves the certificate from a
    two-sided-unsound instrument to a one-sided-sound one, and the price is
    measured incompleteness rather than unmeasured unsoundness.
    The tracked object is the STACKED REDUCTION VECTOR of a point: the tuple of
    its images in the F_l-spaces E^(d)(F_p)/l over p in S.

  lossy_projection_test: >-
    E^(d)(Q) -> prod over p in S of E^(d)(F_p)/l is massively lossy: it discards
    the archimedean size of the point entirely (a point of naive height 10^60 and
    one of naive height 10 can have identical images), discards the l'-part of
    everything, and has infinite kernel. What it discards is discarded
    COMPATIBLY with the operation the target cares about, because the projection
    is a group homomorphism composed with a quotient by a subgroup - addition of
    points commutes with it on the nose, which is precisely why a Z-relation
    among the points forces an F_l-relation among the images. This is not a
    change of coordinates: the regulator retains the archimedean metric and the
    reduction vector throws all of it away, and the two therefore fail on
    disjoint inputs. PASSES.

  novelty_status: unverified

  novelty_note: >-
    Corpus and ledger were grepped this session for prior art and duplicates:
    ledger/proposals (all IDEA-20260824-* and IDEA-20260829-* against RQ-ECQ-*
    read by title, class and claim), ledger/hypotheses/H-ECRANK-28dba7 and
    H-ECRANK-f2a2f7 (full read), ledger/evidence/EV-ECRANK-b6c9b6 and
    EV-ECQ-0d142e (full read), knowledge/findings KN-FIND-6b3e17, KN-FIND-e1b836,
    KN-FIND-91f871 (full read). NO record proposes this composition; the two
    instruments are committed under different goals and never cited by each
    other. The MATHEMATICS is classical - independence by reduction at good
    primes is textbook and this program already implements it - so the honest
    reading is `adaptation` of an in-repo instrument, not a new method. It is
    filed as `unverified` because the external literature on reduction-based
    independence certificates was NOT fetched this session, and novelty may not
    be claimed from memory.

  citations:
