  assumptions:
  - >-
    The exhibited points of the committed multiplicity certificates are
    recoverable from the committed certificate JSON files in exact rational
    coordinates. If a certificate stores only a regulator and not the points, the
    substitution cannot be attempted for that rung and that is reported as a
    missing input, not as a negative.
  - >-
    Every rank used anywhere is an UNCONDITIONAL LOWER BOUND from exhibited
    points. No analytic rank, no Selmer bound, no BSD, consistent with
    RQ-ECRANK-27dcc5 constraint 1.
  - >-
    A new implementation of the F_l certifier is written for this work, sharing
    no code with exact_certify.py, and the two are run against each other. The
    committed certifier is the PRODUCER side; agreement between two independent
    implementations is the evidence, not either one alone.

  proof_search_map:
    bottleneck: >-
      Within-class multiplicity. Cross-class independence is already exact by the
      character argument; the base-rank term is already exact by exhibited
      points; the ONLY inexact step in the entire committed ladder is showing
      that several points on the SAME twist are Z-independent. Remove that step
      and the ladder is float-free end to end.
    baseline_embedding:
      parameter_slice: >-
        The single-point-per-class configuration, i.e. every class contributing
        multiplicity exactly 1. There the regulator is a 1x1 matrix and the
        certificate degenerates to the eigenspace-only bound already committed at
        degree 32 (rank >= 32) and degree 64 (rank >= 64).
      reproduction_check: >-
        Symbolic and frozen. Run the new certifier on cert_deg32_eigenspace.json
        and cert_deg64_eigenspace.json and require it to return exactly 32 and
        exactly 64 with zero errors, matching the committed float-free rungs
        before any multiplicity rung is believed. A pipeline that returns more
        than 32 on the degree-32 eigenspace certificate has a bug that would
        manufacture the headline; this check runs FIRST and is a stop condition.
    observation_collision:
      observable: >-
        The integer rank_{F_l} M for a class, taken as the certified
        multiplicity.
      distinct_preimage_search: >-
        COLLISION EXISTS AND IS THE CENTRAL RISK, in the safe direction. Two
        genuinely different point sets - one independent of size m, one
        containing a relation but whose relation vector is l-divisible in a way
        the chosen S cannot see - can both produce rank_{F_l} M = m only if the
        relation vector maps to zero everywhere, which is impossible for a
        NONZERO F_l-relation because the map is linear and the rank is m. So
        false ACCEPT is excluded by the soundness lemma, and the surviving
        collision is false REJECT: an independent set with rank_{F_l} M < m,
        which happens when the exhibited lattice has index divisible by l, or
        when S is too small. Those two causes are separated experimentally by
        sweeping l over {2,3,5,7,11,13} at fixed S and sweeping |S| at fixed l -
        an index obstruction persists across |S| and moves with l; a budget
        shortfall moves with |S| and not with l.
    quantifier_order: >-
      FOR the named curve E, FOR the named subgroup V, FOR EACH class d in V,
      THERE EXIST a prime l and a finite set S of good primes such that
      rank_{F_l} M_d equals the claimed multiplicity m_d. The witness (l, S) is
      allowed to depend on the class - that dependence is legitimate because the
      certificate EXHIBITS (l, S) per class and the verifier recomputes with the
      exhibited values. Nothing is quantified over an infinite family and no
      uniformity in d is claimed. What may NOT be done, and is a pre-declared
      invalidation, is to search over (l, S) per class until one succeeds and
      then report only the successes as though a single uniform (l, S) had worked.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest statement this method can ever produce is a LOWER bound on
        rank E(K), equal to sum over d in V of rank_{F_l} M_d, with no upper
        bound of any kind. It can never certify exactness, never bound Sha,
        never say anything about rank over Q beyond the d = 1 term, and cannot
        raise any committed number - at best it re-certifies the same integers
        under a stronger artifact class. If it reproduces every multiplicity, the
        ladder's RANK column is unchanged and only its STRENGTH column moves.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion must FAIL is a
        deliberately DEPENDENT point set on the same twist - for instance the
        three-point set that DEV-A-01 of RUN-ECQ-f5af06-v2-A-certify records as
        having been supplied by transcription error, {(-1,3), (0,2), (2,0)} on
        Cremona 5077a1, whose sum is the point at infinity and on which the
        certifier correctly returned 2 rather than 3. Any run of this proposal
        that does not reproduce 2 on that exact input has an instrument defect
        and its other numbers may not be read.
    proof_obligations:
    - claim: each exhibited point lies on the stated twist in exact rational arithmetic
      responsibility: correctness
    - claim: the stacked F_l rank equals the claimed multiplicity, recomputed by a second implementation
      responsibility: correctness
    - claim: the torsion bound is exhibited and Mazur-compatible
      responsibility: correctness
    - claim: >-
        an under-report is reported as an under-report and never silently
        replaced by the regulator's number
      responsibility: strictness
    - claim: >-
        the reported strength upgrade is scoped to the exact rungs re-certified,
        and no un-attempted rung is described as upgraded
      responsibility: scope

  predictions:
  - id: P1
    metric: >-
      number of committed multiplicity-certificate rungs whose full certified
      rank is reproduced exactly by the F_l certifier with zero floating-point
      operations (rungs attempted - degree 16 rank >= 32, degree 32 rank >= 52,
      degree 64 rank >= 68)
    direction: >-
      at least 2 of 3 rungs reproduce exactly, with l drawn from {2,3,5,7,11,13}
      and |S| <= 250 good primes below 5000
    minimum_effect: >-
      2 of 3. One rung reproducing is consistent with luck on a small
      multiplicity; three is the clean result; zero or one falsifies P1.
  - id: P2
    metric: >-
      total verification wall clock for the largest rung (degree 64, claimed
      rank >= 68), single core, stdlib integer arithmetic
    direction: decrease relative to any descent-based route; absolute target
    minimum_effect: >-
      under 120 s. The committed anchor is 1.831 s for 31 points at 33-digit
      x-numerators with 45 primes; 68 points across 64 classes at similar
      coordinate size should stay within two orders of magnitude of that. Above
      600 s the "verification is free" premise of the whole ladder is wrong and
      that is itself the finding.
  - id: P3
    metric: >-
      the prime-budget law - smallest |S| at which the certifier first returns
      the full multiplicity, regressed against the multiplicity m
    direction: >-
      |S|_min grows at most linearly in m, i.e. fitted slope finite and
      intercept small
    minimum_effect: >-
      fitted slope below 4.0 primes per unit of rank with R^2 above 0.5. The
      committed anchor is 45 primes for m = 31, a slope of about 1.45. A slope
      above 4 or a superlinear fit means the certificate's size grows fast enough
      to matter at the top of the ladder and the "free" claim needs qualifying.
  - id: P4
    metric: >-
      truth value of H-ECRANK-f2a2f7's method_ceiling clause that any degree-8
      rank-31 certificate must rest on height regulators
    direction: >-
      falsified, i.e. at least one committed multiplicity rung is certified with
      no regulator anywhere
    minimum_effect: >-
      one rung. This is a binary and one exhibited float-free multiplicity
      certificate settles it.

  minimal_test:
    design: >-
      ZERO SEARCH, ZERO DESCENT, ALL INPUTS ALREADY COMMITTED. Step 1 - write a
      new independent F_l independence certifier from the mathematical statement
      alone, in exact integer arithmetic, without reading exact_certify.py, and
      freeze it. Step 2 - REGRESSION GATE: run it on
      experiments/EXP-ECRANK-e1e30e/certificates/cert_deg32_eigenspace.json and
      cert_deg64_eigenspace.json and require exactly 32 and exactly 64. Step 3 -
      NULL GATE: run it on the DEV-A-01 dependent triple {(-1,3), (0,2), (2,0)}
      on Cremona 5077a1 and require exactly 2, and on the empty and torsion-only
      point sets and require exactly 0. Step 4 - the measurement: for each of the
      three committed multiplicity certificates (deg16 rank >= 32, deg32
      rank >= 52, deg64 rank >= 68), extract the exhibited points class by class,
      run the certifier per class over an l-sweep {2,3,5,7,11,13} and a |S| sweep
      {10,20,45,90,180,250} with good primes below 5000, and record the per-class
      certified multiplicity, the (l, |S|) at which it first saturates, and the
      wall clock. Step 5 - cross-check every per-class number against
      exact_certify.py run as an independent second implementation; any
      disagreement is an instrument failure and stops the run. Step 6 - report
      the sum per rung beside the committed regulator-based number, with
      shortfalls reported as shortfalls.
    controls:
    - >-
      REGRESSION (step 2). The eigenspace-only rungs must return exactly their
      committed values. More is a bug; less is a bug.
    - >-
      NULL OBJECT (step 3). The dependent triple must return 2, the empty support
      0, and a torsion-only support 0 on a POSITIVE-rank curve so the 0 is not an
      artifact of a rankless curve. These are the controls EV-ECQ-0d142e records
      as having been run for the regulator instrument (OBS-8); the exact
      instrument owes the same battery.
    - >-
      PROVES-TOO-MUCH. Feed the certifier a point set containing a known
      duplicate (P and P again) and require the multiplicity to drop by one.
    - >-
      SECOND IMPLEMENTATION (step 5). exact_certify.py at the recorded sha256 is
      the second implementation. Agreement is required per class, not in the sum,
      because two per-class errors of opposite sign cancel in a sum.
    - >-
      NEARBY OBJECT. Re-run the whole battery on the k = 3 degree-8 control
      configuration (committed value 20) and require 20 or an explained shortfall.
      That rung is where a strength upgrade would matter most and where the
      committed number is lowest.
    required_metrics:
    - per-class certified multiplicity, per rung, per (l, |S|)
    - per-rung total, beside the committed regulator-based total
    - smallest saturating |S| per class and per l
    - wall clock and peak RSS per rung
    - count of disagreements between the two implementations (target 0)
    - count of floating-point operations in the verification path (target 0, by construction)

  falsification_conditions:
  - >-
    The regression gate fails - the new certifier does not return exactly 32 on
    cert_deg32_eigenspace.json or exactly 64 on cert_deg64_eigenspace.json. The
    proposal is dead until the instrument is fixed and nothing downstream may be
    read.
  - >-
    The null gate fails - the dependent triple returns 3, or an empty or
    torsion-only support returns nonzero. Same consequence.
  - >-
    P1 fails: at most one of the three multiplicity rungs is reproduced across
    the whole (l, |S|) sweep. Then the F_l route is materially incomplete on
    exactly the configurations the ladder needs, the regulator cannot be retired,
    and H-ECRANK-f2a2f7's method_ceiling clause STANDS with a measured basis it
    currently lacks.
  - >-
    P3 fails: |S|_min grows superlinearly in m, or the fitted slope exceeds 4.0.
    Then certification cost is not negligible at the top of the ladder and every
    downstream "certification is free" premise, including in the sibling
    proposals filed today, must be requalified.
  - >-
    The two implementations disagree on any class. That is an instrument failure
    and, per docs/claims-and-verification.md, an `invalid_measurement`, NOT a
    mathematical negative.

  confounders:
  - >-
    RECONSTRUCTION RISK. The exhibited points must be read out of committed JSON
    and re-attached to the correct twist model. EV-ECRANK-b6c9b6 records that
    exactly this step failed once - XOR cancellation among coset representatives
    put 16 points on an isomorphic but different model. Every point must be
    re-verified on the stated curve in exact rational arithmetic BEFORE any rank
    is computed, and the count of off-curve points is a required metric.
  - >-
    SELECTION OVER (l, S). Sweeping until something works and reporting only the
    winner inflates the apparent completeness. The sweep grid is frozen in
    advance, the FULL grid is reported, and the headline number is the one at a
    pre-declared default (l = 2, |S| = 45) with the sweep as supporting detail.
  - >-
    l-DIVISIBILITY OF THE EXHIBITED LATTICE. If the exhibited points generate a
    subgroup of index divisible by l, the F_l rank is genuinely below m for every
    S. This is a property of the point set, not of the budget, and the l-sweep is
    what separates it from a budget shortfall. It is a confounder for the
    INTERPRETATION of a shortfall, not for its measurement.
  - >-
    The committed regulator numbers may themselves be wrong in the permissive
    direction (a nonsingular determinant for dependent points transported onto a
    wrong model). A shortfall could therefore be the F_l instrument being
    incomplete OR the regulator instrument having over-counted. These are
    distinguished by the l-sweep plus a direct exact search for a relation among
    the offending points at small coefficients.

  interpretation_limits:
  - >-
    NOTHING HERE IS A CLAIM ABOUT RANK OVER Q. Every rung certified is a rank
    over a multiquadratic number field of degree 16, 32 or 64, where unbounded
    rank is classical. The content is the witness and the field degree, never the
    existence. Rank >= 32 over Q is a live external claim (ICARM no. 302) and is
    not this program's to restate.
  - >-
    A successful outcome moves the STRENGTH column of the ladder and not the RANK
    column. It certifies no new integer. Describing it as an improvement in
    certified rank would be a claim-tier violation.
  - >-
    Every bound remains a LOWER bound. The F_l certificate says nothing about
    exactness, about Sha, or about the minimality of the field degree.
  - >-
    Scoped to the exact curves, subgroups, primes and l values exhibited. No
    statement about other configurations, and in particular the prime-budget law
    of P3 is fitted on this program's own certificates and is not claimed for
    curves of other coefficient size.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      Let P_1..P_m in E^(d)(Q) be independent modulo torsion, let l be prime, and
      let p range over primes of good reduction for E^(d) with p not dividing
      2 l Delta and p <= X. Then the image vectors of P_1..P_m in the F_l-space
      E^(d)(F_p)/l E^(d)(F_p) are modelled as INDEPENDENT UNIFORM elements of
      that space, with dim_{F_l} E^(d)(F_p)/l in {0,1,2} distributed according to
      the splitting type of p in Q(E^(d)[l]). Consequently, for |S| = N primes,
      P(rank_{F_l} M < m) is modelled by the classical formula for N uniform
      vectors failing to span F_l^m, namely 1 - prod_{i=0}^{m-1}(1 - l^{i-N}).
    rigorous_support: >-
      PROVEN BOUND FIXING THE QUANTITY: reduction modulo a prime p of good
      reduction, p odd, is an injective group homomorphism on E^(d)(Q)_tors, and
      is a group homomorphism on all of E^(d)(Q), so a Z-relation among the P_i
      forces an F_l-relation among the images - this is the SOUNDNESS half and it
      is a theorem, not a heuristic. The distribution of dim_{F_l} E^(d)(F_p)/l
      is governed by the Chebotarev density theorem applied to the l-division
      field Q(E^(d)[l]), which is a classical theorem giving exact densities for
      each splitting type. CLASSICAL DISTRIBUTION THEOREM IMITATED: the
      Landsberg/q-binomial spanning probability for uniform vectors over a finite
      field, prod_{i=0}^{m-1}(1 - l^{i-N}), the same object that governs random
      matrix rank over F_l.
    validation_plan: >-
      SAMPLE: for each of the three committed multiplicity certificates and for
      the 137 certified fibres of EV-ECQ-0d142e's certified_curves.json plus the
      1,206-curve pool of highrank_pool.json, take every class or curve whose
      point set is exhibited, and for N in {5,10,20,45,90,180,250} record whether
      the stacked F_l rank equals m. SCALE: order 1,400 point sets, l in
      {2,3,5,7,11,13}, 7 values of N - a few tens of thousands of exact
      eliminations, minutes of compute. PREDICTED DISTRIBUTION: the empirical
      failure fraction at each (l, N, m) against 1 - prod_{i=0}^{m-1}(1-l^{i-N}).
      TAIL CHECK: the single worst case - the largest N at which any point set
      still fails - compared against the predicted probability at that N; a
      persistent failure at N where the model predicts probability below 10^-6 is
      an index obstruction, not sampling noise, and is reported as such.
      TRANSFER ASSUMPTION RECORDED: these curves have coefficients up to about
      10^28; nothing is transferred to the 10^100 regime of record curves.
  - id: HA-2
    statement: >-
      For a point set exhibited by a search, the index n of the subgroup it
      generates inside E^(d)(Q) modulo torsion is modelled as a random integer
      whose l-part follows a Cohen-Lenstra-type weighting, so
      P(l divides n) is modelled as of order 1/l for each prime l, independently
      across l. Consequently the probability that the F_l certificate
      under-reports for EVERY l in {2,3,5,7,11,13} simultaneously, at unbounded
      prime budget, is modelled as at most prod over those l of (1/l), about
      1/30030.
    rigorous_support: >-
      PROVEN BOUND: the failure is strictly one-sided - rank_{F_l} M <= m always,
      and rank_{F_l} M = m implies independence unconditionally. So HA-2 governs
      COMPLETENESS only and can never make a certified number wrong. Further
      proven: if P is not l-divisible in E^(d)(Q), then by Chebotarev applied to
      the field Q(E^(d)[l], (1/l)P) a positive density of primes has non-
      l-divisible reduction, so the certificate succeeds for SOME finite S
      whenever the exhibited lattice is l-saturated. CLASSICAL DISTRIBUTION
      THEOREM IMITATED: the Cohen-Lenstra measure on finite abelian l-groups,
      under which the probability that a random group has nontrivial l-part is of
      order 1/l.
    validation_plan: >-
      SAMPLE: the 54 committed completed descents of EV-ECQ-0d142e where PARI
      ellrank closed (certified rank = r_low = r_high), so the true rank is known
      independently of the F_l instrument. For each, run the certifier at every l
      in {2,3,5,7,11,13} and at |S| = 250 and record whether the true rank is
      attained. SCALE: 54 curves x 6 primes, seconds. PREDICTED DISTRIBUTION: the
      fraction of curves where l = 2 under-reports, against the modelled 1/2;
      where all six under-report, against the modelled 1/30030. TAIL CHECK: any
      curve failing at all six l is examined directly for an exact relation among
      its exhibited points; if a relation is found the point set was dependent
      and the instrument was right, which is a positive control on soundness
      rather than a failure of completeness.
  heuristic_assumptions_note: >-
    Neither heuristic is load-bearing for any CERTIFIED number. Both govern how
    OFTEN the instrument succeeds, never whether a success is valid. A certified
    multiplicity is unconditional; only the coverage figures P1 and P3 inherit
    the heuristics. That asymmetry is the reason this design was preferred over
    tightening the regulator, and it is stated here rather than left implicit.

  target_complexity:
    time_exponent: >-
      Verification: O(sum over classes of m_d^2 * |S| * M(log p)) bit operations,
      where M is integer multiplication and p is bounded by the exhibited prime
      bound, PLUS O(R * (log H)^2) for re-verifying R points of coefficient
      height H on their curves, PLUS O(|S| * p^{1/4}) for the group orders if
      they are recomputed rather than exhibited. Polynomial in every input,
      including in log H. Committed anchor: 1.831 s at m = 31, |S| = 45,
      p <= 1500, log_10 H about 33. Predicted for the degree-64 rung: under 120 s.
      BEST KNOWN, stated as the thing being replaced: the regulator route costs
      O(R^2) Neron-Tate local height evaluations at 64 digits and emits no
      rigorous error bound, so its output is not a certificate at all and its
      complexity is not comparable in kind. The genuine best-known ALTERNATIVE
      exact route is 2-descent (PARI ellrank), whose measured behaviour in this
      program is superpolynomial in log H - 84 of 140 attempted descents censored
      at an 8 s alarm, and 31 of 31 upper-bound descents timing out at a4 of
      order 1e19.
    memory_exponent: >-
      O(R * |S| * log l) bits for the stacked matrix - at R = 68, |S| = 250,
      l = 2 that is under 3 kilobytes - plus O(R * log H) for the points
      themselves. Committed anchor: peak RSS 23.2 MB for the whole process, which
      is interpreter overhead rather than the algorithm. Memory is NOT the
      binding resource here and the claim is made explicitly rather than by
      omission.
    best_known: >-
      For the same job (certify m exhibited points on one curve independent
      modulo torsion, with a witness a second implementation can check): the
      committed regulator route (float, no error bound, two-sided unsound) and
      PARI ellrank saturation (exact but calls the descent engine, which
      RQ-ECRANK-27dcc5 constraint 2 forbids the verifier from doing). The F_l
      route is the only committed instrument satisfying both constraints, and it
      is not new mathematics.
    hidden_overhead: >-
      DISCLOSED. (i) The o(1) hides the prime search: obtaining |S| good primes
      with known group order costs a point count per prime, O(p^{1/4}) by BSGS or
      O(log^k p) by exhibiting the order in the certificate; the honest design
      EXHIBITS #E^(d)(F_p) and a generator with its order in the witness, so the
      verifier checks rather than computes, but that inflates the witness by
      |S| group orders per class. (ii) The certificate must exhibit (l, S) per
      class, so witness size grows as O(sum_d (m_d * log H + |S_d| * log p)).
      (iii) The completeness of the method is heuristic (HA-1, HA-2) and a
      shortfall costs an unbounded re-sweep, which is where a superpolynomial
      surprise could hide - and P3 is the measurement that would expose it.
    tradeoff_note: >-
      TIME-MEMORY: none worth exploiting; memory is kilobytes. The real tradeoff
      is WITNESS SIZE against VERIFIER WORK - exhibiting group orders and
      generators per prime makes the verifier O(|S| log p) instead of
      O(|S| p^{1/4}) at the cost of a larger file, and this proposal takes the
      larger file because RQ-ECRANK-27dcc5 is a question about what a second
      implementation can check, not about producer cost. PARALLELIZATION: perfect
      and uninteresting - classes are independent, primes are independent, and
      the whole ladder is embarrassingly parallel at a total cost small enough
      that parallelizing it is not worth the code.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST EVERY RUNG ON THIS QUESTION'S FRONTIER; `null` is
    not asserted. The frontier is (certified rank R, field degree D, witness
    strength S). ROW 1 - EV-ECRANK-b6c9b6, D = 32, R = 32, S = float-free:
    DOMINATES this proposal on strength (equal) and is not beaten on rank,
    because this proposal certifies no new integer. ROW 2 - same record, D = 64,
    R = 64, float-free: dominates on rank at its degree. ROWS 3-5 - same record,
    D = 16 R = 32, D = 32 R = 52, D = 64 R = 68, regulator-assisted: these are
    the rows this proposal attacks; it does not beat them on rank (identical
    integers) and beats them ONLY on strength. ROW 6 - same record, D = 2,
    R = 31, relative to an external rank-30 input and regulator-assisted:
    dominates every rung here on field degree, and is untouched by this work.
    ROW 7 - EV-ECQ-0d142e, D = 1 (over Q), R = 12 exact: dominates on degree,
    dominated on rank. ROW 8 - RUN-ECQ-f5af06-v2-A-certify, D = 1, R = 31 as a
    float-free confirmation of an EXTERNAL curve: dominates on degree and on
    strength simultaneously and is the strongest single row in the repository;
    this proposal reuses its instrument and claims nothing against it. ROW 9 -
    the external world record, rank >= 31 over Q (ICARM no. 302, live and
    claimed): dominates everything here on degree and is not this program's.
    HONEST SUMMARY: on the (R, D) plane this proposal is dominated by rows 1, 2,
    6, 8 and 9 and ties rows 3-5. It is NOT dominated on the third axis, witness
    strength at fixed (R, D), which is the axis RQ-ECRANK-27dcc5 is actually
    about.
  sota_delta: >-
    QUANTITATIVELY, AND ZERO ON RANK. Certified rank delta: 0 at every degree.
    Field degree delta: 0. What moves: three committed rungs (D = 16 R >= 32,
    D = 32 R >= 52, D = 64 R >= 68) currently carry a certificate whose
    independence step is a 64-digit floating determinant with no rigorous error
    bound; after this work the target is that at least 2 of them carry a witness
    with ZERO floating-point operations, verifiable by a second implementation in
    under 120 s using integer arithmetic only. Second quantity: the count of
    rungs in this question's ladder whose witness contains no floating point
    moves from 2 of 6 to a target of 4 or 5 of 6. Third quantity, a deliverable
    number this repository does not currently have: the prime-budget law
    |S|_min(m), currently a single data point (45 primes at m = 31) and after
    this work a fitted line over m from 1 to about 13 with a stated slope and
    R^2. Fourth: a recorded truth value for H-ECRANK-f2a2f7's method_ceiling
    clause, currently asserted and unmeasured.

  estimated_cost:
    compute: >-
      Under 1 CPU-hour total for the measurement, dominated by the l x |S| sweep
      across roughly 1,400 point sets. No descent, no search, no PARI required
      for the certification path. Peak memory under 200 MB.
    wall_clock_seconds_estimate: 3600
    human_or_agent_effort: >-
      One Executor task to write and freeze the independent certifier plus run
      the six-step protocol; one Validator task for the regression, null and
      second-implementation gates. The certifier is a few hundred lines of exact
      integer arithmetic.
    inputs_required: >-
      All committed. experiments/EXP-ECRANK-e1e30e/certificates/*.json;
      coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/certified_curves.json;
      coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/highrank_pool.json;
      exact_certify.py at the recorded sha256. No new search and no network.
    risk_of_zero_information: >-
      Very low. Every branch is informative: reproduction upgrades the ladder's
      strength column and falsifies a committed method_ceiling clause; a
      shortfall measures the incompleteness of the exact route and tells the
      programme that the regulator cannot be retired, which is exactly the
      "where the method's reach ends" statement RQ-ECRANK-27dcc5 asks for.

  recommended_priority: high
