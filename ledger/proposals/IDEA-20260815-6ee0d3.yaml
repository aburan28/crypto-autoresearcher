idea:
  id: IDEA-20260815-6ee0d3
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE MULTIPLICATIVE ANALOGUE HAS NO ADDITIVE COUNTERPART AND THAT SHOULD
    BE A THEOREM, NOT FOLKLORE: state and test the exact obstruction to
    transplanting integer-lift smoothness from F_p^* to E(F_p)
  class: theory

  claim: >-
    Index calculus over F_p^* tracks smoothness of the integer lift of g^k,
    and relations compose because the lift is multiplicative while the group
    is multiplicative. On E(F_p) the natural lift of x(kP) to Z is available
    and smoothness of it is computable, but relations do not compose because
    the group law is additive on points while smoothness is multiplicative
    on coordinates. This mismatch is stated everywhere as folklore and
    nowhere as a theorem with quantifiers. The record states it precisely
    and tests the one thing folklore cannot settle: whether x-coordinate
    lifts nonetheless carry ANY exploitable smoothness correlation along an
    orbit.

  mechanism: >-
    Define the lift and the smoothness predicate explicitly. Derive the non-
    composition statement with quantifiers. Then measure, on toy curves, the
    smoothness statistics of x(kP) along orbits against matched random-
    integer nulls of the same size distribution, looking for correlation
    between smoothness of x(kP) and of x(jP) for related j, k.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep for 'smoothness on the curve' (0), 'no norm' (5), 'integer
      lift', 'multiplicative analogue'; read of KN-OPEN-001.
    results: >-
      The folklore appears repeatedly in motivation sections; no record
      states it with quantifiers or measures orbit smoothness correlation.
    verdict: >-
      UNVERIFIED and likely KNOWN IN SUBSTANCE externally; the measurement
      is this program's own and the Stage 1 literature check is blocking.

  object_first_candidate:
    tracked_object: >-
      SMOOTHNESS OF THE INTEGER LIFT of the x-coordinate along a scalar
      orbit.
    lossiness: >-
      Smoothness maps a field element to a bit and is drastically lossy;
      the rigidity theorem predicts it cannot propagate, and this record
      checks whether it correlates anyway.
    propagation: >-
      Predicted not to propagate under the group law; the measurement
      tests for residual correlation short of propagation.
    survival_score: >-
      Survives as a definition; expected to die at composition. Toy scale
      bounds the detectable correlation.

  null_object_control: >-
    NULL 1 -- random integers matched to the size distribution of x(kP),
    giving the baseline smoothness rate. NULL 2 -- a shuffled orbit,
    destroying the k-ordering while preserving the multiset, which isolates
    orbit structure from coordinate distribution. STRUCTURAL TELL: any
    correlation must decay as p grows; a flat correlation is an artifact.

  discriminated_from:
    - >-
        IDEA-20260815-3dc025 (CM-coordinate smoothness). DIFFERENT RING:
        that record derives smoothness from the endomorphism order's norm;
        this one from the naive integer lift of a coordinate. Both
        relocate the same folklore and should be read together.
    - >-
        The xedni lane. NOT A LIFT TO A GLOBAL CURVE: no Mordell-Weil
        group, no height, just an integer representative of a field
        element.

  assumptions:
    - >-
        The lift convention (least non-negative residue) is fixed and
        recorded; a different convention gives a different predicate.
    - >-
        Toy p is large enough for smoothness to be non-degenerate, which
        conflicts with exhaustive orbit enumeration and bounds the usable
        range.

  predictions:
    - metric: >-
        smoothness rate of x(kP) versus matched random integers
      direction: different
      minimum_effect: >-
        Predicted indistinguishable; a difference would be a genuine
        equidistribution failure.
    - metric: >-
        correlation between smoothness of x(kP) and x(2kP)
      direction: different
      minimum_effect: >-
        Predicted none beyond the shuffled-orbit null.
    - metric: >-
        any observed correlation as p grows
      direction: lower
      minimum_effect: >-
        Must decay; a flat correlation is recorded as an artifact, not a
        finding.

  minimal_test:
    design: >-
      Three toy curves, full orbit enumeration, smoothness bound swept,
      both nulls. Cheap and decides the residual-correlation question at
      the tested scale.
    controls:
      - >-
          Matched random-integer null.
      - >-
          Shuffled-orbit null.
      - >-
          Lift convention fixed and recorded.
      - >-
          Multiple smoothness bounds, since a single bound can hide a
          rate difference.
    required_metrics:
      - >-
          Smoothness rate per curve and bound, against both nulls.
      - >-
          Pairwise orbit correlations.
      - >-
          Decay of any correlation with p.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        Smoothness rate differs from the random-integer null.
        Equidistribution failure; a real finding needing its own proposal.
    - >-
        Orbit correlation exceeds the shuffled null and decays with p.
        Genuine but scoped structure.
    - >-
        Correlation is flat in p. Artifact; recorded as a controlled null.
    - >-
        No correlation at all. The folklore is confirmed at the tested
        scope, now with a measurement behind it.

  confounders:
    - >-
        SMOOTHNESS-BOUND SENSITIVITY: rates depend strongly on the bound
        and a single bound can manufacture or hide a difference.
    - >-
        SMALL-p DEGENERACY: at tiny p almost every integer is smooth and
        the predicate is vacuous.

  interpretation_limits:
    - >-
        Toy scale; no exponent, no attack, no crypto-scale claim.
    - >-
        A null result closes the naive-lift route at the tested scope and
        does not close index calculus.

  heuristic_assumptions:
    - id: HEUR-LIFT-1
      statement: >-
        The integer lifts of x(kP) along an orbit are distributed, with
        respect to smoothness, indistinguishably from uniform random
        integers of the same size.
      rigorous_support: >-
        The rigorous ingredient is the Weil bound giving square-root
        cancellation for character sums over curve points, which
        controls the distribution of x(kP) in intervals; the classical
        ingredient is the Dickman-de Bruijn smooth-number density. The
        composition is the assumption that interval-equidistribution
        implies smoothness-equidistribution, WHICH DOES NOT FOLLOW
        DIRECTLY since smoothness is not an interval condition.
      falsification_condition: >-
        A measured smoothness rate differing from the matched null
        beyond sampling noise, reproducibly across curves.
      validation_plan: >-
        SAMPLE: >= 3 curves, full orbits, >= 4 smoothness bounds.
        COMPARISON: paired rate against matched random integers. TAIL
        CHECK: the smoothest lifts, checked for small-x artifacts.
        TRANSFER: none beyond toy p.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one factorisation per orbit point at toy
      size.
    memory_exponent: >-
      Negligible.
    best_known: >-
      For F_p^* the incumbent is classical index calculus, which works;
      for E(F_p) there is no incumbent smoothness route, which is the
      folklore this record tests.
    hidden_overhead: >-
      Factoring every orbit point bounds p well below where smoothness
      statistics become realistic.
    tradeoff_note: >-
      Larger p gives realistic smoothness and forbids full orbit
      enumeration; the record takes small p and states the limitation.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed) --
    nothing is mounted, so no row of the ECDLP frontier dominates or is
    dominated. As a barrier statement: adjacent to IDEA-20260815-3dc025,
    neither dominating. As number theory: dominated by the classical smooth-
    number literature, used not extended. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a quantified statement of the
    additive/multiplicative mismatch with the first measurement of orbit
    smoothness statistics against matched nulls in this program.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the measurement runs. 0.85 that smoothness matches the random
    null, confirming folklore. 0.1 that any orbit correlation survives the
    shuffled null and the decay check.

  status: proposed
  proposed_by: claude-code-session
