idea:
  id: IDEA-20260816-74e42d
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: Exhibit an invertible change of basis on the message block that provably leaves every linear
    invariant of the expanded schedule fixed while changing the primitive, and then measure whether
    a frozen instrument reaches a different step count on the two, which is an identifiability falsifier
    against the whole deficit programme
  class: control
  claim: '(A) There is a one-line proof that the linear invariants proposed in this bucket cannot
    by themselves identify the frontier. Let A be any invertible 512 x 512 matrix over GF(2) and consider
    the primitive that first applies A to the message block and then runs SHA-256 unchanged. The carry-fixed
    expansion matrix becomes A_s composed with A, and for any support set S the rank of the selected
    rows is rank(P_S A_s A) = rank(P_S A_s), because right multiplication by an invertible matrix
    preserves the rank of every row subset. Surviving freedom, redundancy, the whole rank profile,
    and the row space''s dimension sequence are therefore EXACTLY invariant under the entire group
    GL(512, 2), which has astronomically many elements. (B) This is the observation collision that
    KN-TECH-080 audit 2 asks for, and it is free: an enormous family of distinct objects sharing the
    observable exactly. The empirical half of this contract is to ask whether they also share the
    frontier. Take a small sample of invertible A - identity, sparse involutions, random dense, and
    a permutation of message words - and measure the reachable step count of each composed primitive
    with a frozen instrument at a frozen budget. If the measured step counts differ materially across
    A while every rank invariant is provably identical, the observable does not identify the frontier
    and the predictive reading of the deficit programme is falsified as stated, which is the most
    useful thing this bucket can learn cheaply. (C) NOT CLAIMED: that this closes the deficit programme,
    since a refined observable that is not GL-invariant may still identify the frontier and the record''s
    job is to say so and name the escape; that any composed primitive is a real hash anyone deploys;
    that a measured difference in step count implies anything about SHA-256 itself; anything about
    full 64-step SHA-256, HMAC-SHA-256, or any deployed system.'
  mechanism: 'STAGE A. Prove and record the invariance symbolically: rank(P_S A_s A) = rank(P_S A_s)
    for invertible A, verified computationally as well by recomputing the full rank profile for every
    sampled A and asserting bitwise equality with the identity case. This costs seconds and is the
    zero-compute half. STAGE B. Sample A from four declared classes - identity, sparse involutions
    with a declared number of transvections, uniform invertible dense, and permutation matrices that
    permute whole message words - so that the sample spans from doing nothing to doing everything.
    STAGE C. Compose each A with a toy-width SHA-256 and encode the step-reduced search with the frozen
    encoder; the composition is one extra affine layer on the message variables and adds no structural
    difficulty to the encoding. STAGE D. Measure the reachable step count for each A at the frozen
    budget with replicate seeds and certificate verification. STAGE E. Report the rank-invariance
    assertion, which must hold exactly, alongside the spread of measured step counts across A, which
    is the falsifier. STAGE F. Refutation route in the other direction: if measured step counts do
    NOT differ across A, the observation collision is real but harmless at this resolution, and the
    record says the observable survives THIS collision, which strengthens rather than closes the deficit
    reading and names the next collision to try.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full and docs/inventor-protocol.md section 8, whose audit 2 (observation
      collision) and audit 3 (quantifier order) are the binding requirements this instantiates, and
      section 4 on the closure standard. Read KN-TECH-080's abstract of the same audits. Ran grep
      -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/ coordination/; grep -ril 'degrees of freedom'
      over ledger/proposals/ knowledge/; grep -ril 'message schedule|message-schedule' over ledger/proposals/
      ledger/hypotheses/ knowledge/.
    results: 'docs/inventor-protocol.md section 8 audit 2 states the requirement directly: name the
      observable supporting the conclusion, then search for distinct ground-truth objects with the
      same observable, preferably one on each side of the claimed conclusion, and treat a collision
      as a direct falsifier of identifiability unless an additional condition separates it. KN-TECH-080
      carries the same audits and appeared in the ''degrees of freedom'' grep alongside KN-TECH-066
      and twelve ECDLP-lane proposals whose bodies I did not read. No record in this repository applies
      an observation-collision audit to a hash message schedule, and RQ-SHATWO carries no proposals
      - the grep returns only the question, GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2. The task brief records
      the group-law rigidity theorem IDEA-20260807-df906f with its four escapes as an established
      internal result not to be re-derived; that result concerns elliptic-curve group laws and shares
      no object with a GF(2) basis change on a hash message block, though the SHAPE of the argument
      - an invariance that kills a family of observables, plus named escapes - is deliberately the
      same and is credited here rather than re-derived.'
    verdict: 'UNVERIFIED. No external literature is readable here and nothing is asserted about it.
      Claimed new: nothing mathematical whatsoever - that right multiplication by an invertible matrix
      preserves the rank of every row subset is elementary linear algebra, and saying otherwise would
      be absurd. What is claimed is the APPLICATION and its timing: naming GL(512, 2) as an exact
      observation collision for the deficit observable BEFORE the deficit programme is built out,
      and pairing the free symbolic half with a cheap empirical half that asks whether the collided
      objects also share the frontier. The record explicitly credits IDEA-20260807-df906f''s rigidity-plus-escapes
      shape as the template it follows rather than presenting that shape as new. Within this repository
      the verifiable facts are that no record applies this audit to a hash and RQ-SHATWO carries no
      proposals.'
  object_first_candidate:
    tracked_object: 'The fiber of the observable: the set of primitives {SHA-256 composed with A :
      A in GL(512, 2)} all of which share, exactly and provably, the same rank profile, surviving-freedom
      sequence and redundancy sequence of the carry-fixed expanded schedule - followed together with
      the ONE coordinate that is not shared, namely the reachable step count each of them yields under
      a frozen instrument at a frozen budget.'
    lossiness: This entry is the one place in the bucket where the lossiness question has a sharp
      answer, and the answer is that the OBSERVABLE is too lossy. The rank profile discards everything
      that a GL(512, 2) element can change, which is the entire linear structure of the message space,
      and that is an enormous amount of discarded information - the whole point of the audit is that
      the projection collapses a group's worth of distinct objects to one value. The tracked object
      of THIS record, by contrast, is the pair (invariant observable, measured step count), which
      is lossy in the first coordinate by construction and informative precisely because the second
      coordinate is not known to be. If the second coordinate turns out also to be constant across
      the fiber, then the fiber is genuinely a single object for all purposes tested, and the record
      says so.
    propagation: The iterated operation is composition with a group element. Moving from A to A' =
      A composed with a generator of GL(512, 2) - a single transvection, say - provably leaves every
      rank invariant fixed, by the same one-line argument, and changes the primitive. Each step therefore
      transports the first coordinate exactly and the second coordinate by an unknown amount, and
      the measured spread of the second coordinate along a walk through the group is exactly the falsifier.
      Sampling four classes rather than walking is the affordable approximation, with the identity
      and the dense random element as the two ends.
    survival_score: 'The symbolic half survives completely and unconditionally: the invariance is
      exact for every A in GL(512, 2), at every s, for every support set, in every carry class, with
      no sampling and no error bars. The empirical half survives only as far as the sampled A and
      the frozen budget reach, which is four classes at one toy width. The audit''s conclusion therefore
      has an asymmetric strength that the record must state: the collision is certain, and whether
      the collision is HARMFUL is measured on a small sample.'
  null_object_control: 'The identity element is the null object and it runs in the same invocation:
    A = I is a member of the sampled family, so the signal arm and the null arm are the same code
    path with one matrix differing, which is the strictest possible matching. For the empirical half
    to mean anything, the identity arm''s measured step count must be reproducible across its own
    replicate seeds to within less than the spread observed across the A classes; if seed noise alone
    equals the cross-A spread, the falsifier cannot fire and the run reports its resolution limit.
    A second null is the rank-invariance assertion itself, which is a control on the whole pipeline:
    if recomputing the rank profile under a sampled A does not reproduce the identity case bitwise,
    the linearizer or the composition is wrong and no measured step count means anything.'
  discriminated_from:
  - The rank-ledger entry in this bucket, whose observable this record attacks; that entry computes
    the integers and declines predictive claims, and this entry supplies the exact reason those claims
    would be hard to make, so they are complementary rather than competing.
  - The word-width scaling entry, which tests transfer of a predictive relation across widths; this
    tests identifiability of the observable at one width, which is logically prior - a non-identifying
    observable cannot transfer anything.
  - 'IDEA-20260807-df906f, the group-law rigidity theorem with its four escapes, recorded in the task
    brief as an established internal result: that concerns elliptic-curve group laws and shares no
    object with a GF(2) basis change on a hash message block; this record deliberately follows its
    rigidity-plus-named-escapes SHAPE and credits it rather than re-deriving it.'
  - KN-TECH-080 audit 2 in the abstract, which prescribes searching for observation collisions; here
    the collision is not searched for but exhibited in closed form as an entire group, which is a
    stronger form of the same audit and is why it costs nothing.
  - A generic complaint that linear invariants are weak, which is an opinion; this is a proof plus
    a measurement, and its negative outcome - collided objects sharing the frontier too - is equally
    reportable and would strengthen the deficit reading.
  assumptions:
  - Right multiplication by an invertible GF(2) matrix preserves the rank of every row subset; this
    is elementary and is additionally verified computationally by bitwise comparison of recomputed
    profiles.
  - Composing an affine layer onto the message variables is faithfully representable in the frozen
    CNF encoder without changing the search problem's meaning; this is checked by requiring that the
    identity composition reproduces the uncomposed instance exactly.
  - Four sampled classes of A - identity, sparse involution, dense random, word permutation - span
    enough of the group to reveal a spread if one exists; this is a sampling convention and a null
    result is scoped to it rather than to the whole group.
  - The frozen instrument has passed the planted-signal gate proposed separately in this bucket; without
    that licence the measured step counts are uninterpretable and this contract must not run its empirical
    half.
  predictions:
  - metric: bitwise agreement of the recomputed rank profile under every sampled A with the identity
      case
    direction: higher
    minimum_effect: 'forced value: exact agreement at every s, every support and every carry class;
      any deviation means the composition or the linearizer is wrong and voids the run'
  - metric: spread of measured reachable step count across the four A classes, relative to within-class
      seed spread
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit, because both outcomes are informative in opposite
      directions: a large spread falsifies identifiability of the observable, and a small spread says
      the collision is harmless at this resolution and strengthens the deficit reading. Preregistered
      rule instead: cross-class spread exceeding twice the within-class seed spread scores COLLISION
      HARMFUL; below that scores COLLISION HARMLESS AT THIS RESOLUTION'
  - metric: identity-composition instance versus uncomposed instance
    direction: different
    minimum_effect: 'forced: identical CNF after canonical re-sorting, proving the composition layer
      adds nothing when A is the identity'
  - metric: within-class seed spread of the measured step count in the identity arm
    direction: lower
    minimum_effect: must be strictly less than the cross-class spread for the decision rule to fire;
      if not, the run reports its resolution limit instead of a verdict
  minimal_test:
    design: 'The symbolic half is free and should be run first and alone: recompute the full rank
      profile under 20 sampled invertible A and assert bitwise equality with the identity case. That
      is seconds of CPU, requires no solver, and either confirms the collision computationally or
      exposes a pipeline bug, and it already delivers the audit that KN-TECH-080 requires before expensive
      experiments. The empirical half''s cheapest form is then four A - one per class - at one toy
      width and one step ladder with five seeds, which is twenty solver runs at the frozen budget
      plus five for the identity arm''s own spread. That is enough to score the preregistered rule,
      because the rule compares two spreads and both are estimable from five replicates. If the cross-class
      spread is large, the falsifier has fired for the cost of twenty runs; if it is small, the record
      says the collision is harmless at this resolution and names the resolution.'
    controls:
    - Identity element A = I as a member of the sampled family, same code path, same invocation.
    - Bitwise rank-profile invariance assertion under every sampled A, as a pipeline control on the
      whole construction.
    - Identity-composition CNF equality check against the uncomposed instance after canonical re-sorting.
    - Replicate seeds within every A class, with within-class spread reported and required to be below
      the cross-class spread.
    - Certificate verification of every returned assignment against an independently written implementation
      of the composed primitive.
    required_metrics:
    - bitwise rank-profile agreement flag per sampled A
    - measured reachable step count per A per seed
    - cross-class spread and within-class seed spread of the step count
    - COLLISION HARMFUL / HARMLESS AT THIS RESOLUTION score
    - CNF variable and clause counts per A
    - certificate verification rate per A
  falsification_conditions:
  - The recomputed rank profile under some sampled A differs from the identity case, falsifying the
    composition or the linearizer and voiding the run.
  - The identity-composition CNF differs from the uncomposed instance, falsifying the composition
    layer's neutrality.
  - Within-class seed spread equals or exceeds cross-class spread, so the decision rule cannot fire
    and the run reports a resolution limit rather than a verdict.
  - Any returned assignment fails independent certificate verification.
  - The companion planted-signal instrument gate has not passed, in which case the empirical half
    must not run.
  - Cross-class spread is large, which falsifies the identifiability of the rank observable as a frontier
    predictor - the outcome this contract is built to be able to report.
  confounders:
  - A dense random A vastly increases CNF size relative to the identity, so a measured step-count
    difference may track encoding size rather than the primitive; variable and clause counts per A
    are reported and the sparse-involution class exists precisely to separate this.
  - Word-permutation A may be absorbed by solver preprocessing, understating the spread; preprocessing
    configuration is frozen and its effect on clause counts is reported per A.
  - Four sampled classes are a small and non-uniform sample of an astronomically large group, so a
    HARMLESS score is scoped to the sample and not to GL(512, 2).
  - At toy width the group is GL(16k, 2) for the reduced block size rather than GL(512, 2), and the
    invariance argument is identical but the group is smaller; the record states the actual group
    at the tested width rather than quoting the full-width one.
  - Certificate verification requires an implementation of the composed primitive, and a bug there
    would look like a verification failure rather than a composition failure; the identity arm's verification
    anchors this.
  interpretation_limits:
  - A HARMFUL score falsifies the rank observable as a frontier predictor as stated; it does not close
    the deficit programme, because a refined non-GL-invariant observable may still identify the frontier,
    and naming that escape is part of the deliverable.
  - A HARMLESS score is scoped to four sampled A classes at one toy width and one budget, and is not
    a statement about the whole group.
  - The composed primitives are diagnostic constructions and no property of them transfers to SHA-256
    itself.
  - Nothing here is a statement about full 64-step SHA-256, HMAC-SHA-256, or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The symbolic half is seconds; the empirical half
      is at most a few dozen capped solver runs, which is the cheapest empirical arm in this bucket.
    memory_exponent: No attack memory exponent is claimed. Sub-megabyte matrices in the symbolic half;
      a declared and recorded per-run memory cap in the empirical half.
    best_known: 'No incumbent attack. The incumbent this improves on is the unaudited state of the
      deficit programme: KN-TECH-080 audit 2 requires an observation-collision search before expensive
      experiments, no record in this repository has run one for a hash observable, and RQ-SHATWO carries
      no proposals.'
    hidden_overhead: 'The hidden cost is that a HARMFUL outcome is organizationally expensive rather
      than computationally expensive: it falsifies the observable that three other contracts in this
      bucket are built on, and the honest response is to record the escape - a refined observable
      that is not GL-invariant - rather than to weaken the audit. A second hidden cost is that the
      composition layer must be implemented correctly in both the encoder and the verifier, and a
      bug there produces a spread that looks exactly like the falsifier firing, which is why the identity
      arm and the CNF equality check are mandatory rather than optional.'
  dominated_by: 'n/a (no result claimed). Pareto check across time, memory and data/queries: I checked
    every frontier row present in this repository and found none - no experiment directory, evidence
    record, proposal or hypothesis runs an observation-collision audit on any hash observable, and
    RQ-SHATWO carries no proposals - so there is no prior row to dominate this one. This repository
    cannot adjudicate against external work in either direction.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The delta is from an unaudited
    observable to an audited one: currently zero identifiability checks exist here for any hash observable,
    and a run would deliver an exact closed-form collision covering an entire matrix group, a computational
    verification of it across sampled elements, and a measured cross-element step-count spread scored
    against within-element seed noise.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part, and this record''s parts have unusually different priors. (1)
    That the symbolic invariance holds and verifies computationally: ~0.99, since it is elementary
    linear algebra and the only risk is a pipeline bug, which the bitwise check is designed to catch
    rather than to hide. (2) That the empirical half runs and the decision rule fires rather than
    returning a resolution limit: ~0.6, with seed noise on solver wall-clock the main threat. (3)
    That the score is COLLISION HARMFUL: ~0.65, and I state this above even deliberately, because
    a dense random change of basis genuinely changes the search problem while provably not changing
    any rank, and I expect the frontier to move; that expectation is exactly why this audit should
    run before, not after, the expensive contracts in this bucket. (4) That a HARMFUL score would
    be correctly handled - recorded as a falsification of the observable as stated, with the escape
    named, rather than as a closure of the whole direction: ~0.5, which is a statement about process
    rather than about mathematics, and is why the interpretation limits are written as firmly as they
    are.'
