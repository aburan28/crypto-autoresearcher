idea:
  id: IDEA-20260821-6d1b97
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-21'
  title: >-
    Stop reporting a zero count as a bound: exponentially tilt the CHALLENGE
    distribution around a REAL key's t0 and measure the ML-DSA-44 ct0 rejection
    rate directly at 1e-9, from about 1e5 tilted samples instead of the 1e9
    signatures the honest estimator needs - which is the only affordable test
    of IDEA-20260805-bb52fa's H1 AT THE QUANTILE WHERE H1 IS ACTUALLY USED, and
    which returns a PER-KEY rate rather than one number for the parameter set,
    scored against an ENSEMBLE null rather than a single synthetic t0
  class: measurement

  claim: >-
    (A) THE PROBLEM THIS SOLVES, STATED AS THIS QUESTION'S OWN CONSTRAINT.
    RQ-MLDSA-ffa0f5 requires that "a zero observed count is reported as an
    upper bound with its sample size, never as a measured rate of zero", and
    GOAL-MLDSA-002's first completion criterion asks for a measured rate with a
    confidence interval at each of ML-DSA-44 / -65 / -87. At ML-DSA-65 and -87
    that criterion is already met at zero compute by IDEA-20260805-bb52fa's
    envelope theorem (the rate is exactly 0 as arithmetic, not as a zero
    count). At ML-DSA-44 it is unreachable by honest sampling: the same record
    derives a rate of 7.34e-9 and prices a two-sided interval at of order 1e9
    signatures against a campaign budget of 10,800 wall-clock seconds, and
    states plainly that its own H1 "at 10^-12 is not validated by anything in
    the design and cannot be within budget". THIS PROPOSAL CLOSES THAT NAMED
    GAP.

    (B) THE MOVE. For a FIXED key, t0 is fixed and the only randomness in the
    Line-28 predicate is the challenge c, drawn by SampleInBall uniformly from
    B_tau (exactly tau coefficients in {-1,+1}). So the quantity
        p(sk) := Pr_{c <- B_tau}[ ||<<c t0>>||_inf >= gamma2 ]
    is a rare-event probability under a KNOWN, SAMPLEABLE distribution with a
    FIXED, KNOWN deterministic object t0 - the textbook setting for
    exponentially tilted importance sampling. Sample c from an Esscher-tilted
    law that pushes the signed sum toward the threshold, weight each sample by
    its exact likelihood ratio, and average. The estimator is UNBIASED, returns
    a positive number with a confidence interval, and needs a sample size that
    grows polynomially rather than as 1/p.

    (C) THE FALSIFIABLE CLAIM, WITH NUMBERS. From about 1e5 to 1e6 tilted
    challenge draws per key - minutes of single-core compute - the estimator
    returns p(sk) at ML-DSA-44 with relative standard error below 10%, against
    a naive requirement of order 1/p = 1.4e8 signing attempts for a single
    expected event and of order 1e9 for an interval. That is a reduction of
    roughly 1e3 in samples and, because a tilted challenge draw costs a
    polynomial multiplication rather than a full signing attempt, considerably
    more than that in wall clock. The claim is falsifiable in the ordinary way:
    if the tilted estimator's relative variance does not fall - importance
    sampling fails catastrophically when the tilt is misaimed, and a MAXIMUM
    over 256k coefficients is exactly the structure that can misaim it - the
    measurement stays out of budget and that is what gets reported.

    (D) THE DISCRIMINATION, WHICH IS THE POINT, AND ITS DECISION RULE - REBUILT
    2026-08-24 AGAINST THE RIGHT ENSEMBLE. IDEA-20260805-bb52fa's
    R_44 = 7.3376e-9 is derived under an assumption that the 256k coefficients
    of a REAL t0 behave as independent uniforms. Note the exact arithmetic:
    R_44 = 1024 * p_1 = 1024 * 7.1656e-12, so R_44 is a UNION over the 1024
    coefficients AND AN EXPECTATION OVER t0. It is therefore comparable to the
    sample MEAN of p(sk) over keys and NOT to the median, and the earlier
    version of this record compared it to the median - a comparison that a
    log-normal spread alone would have pushed past its own threshold while H1
    was true. The rule below fixes that.
    COMPARATOR: the sample MEAN of p(sk) over the real keys, with a bootstrap
    interval; the MEDIAN and the across-key log10 spread are reported
    separately with their own intervals and never substituted for the mean.
    FOUR BRANCHES, DISJOINT AND PRE-DECLARED.
    E1, H1 HOLDS IN AGGREGATE AND PER KEY: the mean agrees with 7.3376e-9
    within a factor of 2 AND the across-key log10 spread does not exceed the
    null ensemble's own spread s_0 (measured in the same run, see (E)) beyond
    its pre-declared bootstrap threshold. R_44 is upgraded from derived to
    measured and every downstream number that consumes it - IDEA-20260821-
    60ba98's crossover N* = 1.36e8, GOAL-MLDSA-002's sample sizing - is put on
    measured footing.
    E2, H1 FAILS IN THE TAIL: the mean differs from 7.3376e-9 by a factor of 10
    or more AND its bootstrap interval excludes the factor-2 band. R_44 is
    withdrawn, and the direction of the failure says which half of H1
    (uniformity or independence) is responsible, because the route-A/route-B
    contrast isolates them.
    E3, THE NEITHER BRANCH - H1 TRUE IN AGGREGATE, FALSE PER KEY: the mean
    agrees within a factor of 2 but the across-key spread exceeds the
    null-calibrated threshold. The rate is a PER-KEY quantity; R_44 survives as
    an average over keys and dies as a statement about any particular key, and
    the correct answer to the completion criterion is a distribution and not a
    number. This branch is invisible to any design that measures one pooled
    rate, and the corpus currently contains no per-key measurement of anything
    in this lane.
    E4, UNDERPOWERED: the bootstrap interval on the mean spans more than a
    factor of 3. This is not a fallback excuse but a derivable regime - for a
    log-normal p(sk) with spread s decades the relative standard error of the
    sample mean over n keys is sqrt(exp((s*ln10)^2)-1)/sqrt(n), which is 29% at
    s = 0.5 and n = 32 but 250% at s = 1.0 and n = 32, and reaches 100% already
    at s = 0.81. Beyond about 0.8 decades of spread, 32 keys cannot pin the
    mean at all. In this branch NO E1/E2 verdict is issued; the design
    reallocates its fixed draw budget toward more keys under the declared rule
    in (F) and, if the budget still cannot reach a factor-3 interval, reports
    UNDERPOWERED with the achieved interval - a budget outcome under AGENTS.md
    rule 3, never evidence about the rate.

    (E) THE NULL IS AN ENSEMBLE, NOT ONE VECTOR - REBUILT 2026-08-24. p_1 and
    R_44 are expectations over BOTH c and t0. Running the estimator on ONE
    synthetic t0 returns p(t0) for that vector, whose Monte-Carlo interval
    excludes the across-t0 component entirely, so scoring it against 7.1656e-12
    "to within its own interval" compares an ensemble mean against a single
    draw. Averaging over the 256k output coefficients does not repair it: all
    256 coefficients of one output polynomial are signed sums from the SAME
    256-coefficient t0 polynomial, so one key supplies only k = 4 / 6 / 8
    independent draws of the averaged object. The null is therefore run over
    M >= 256 INDEPENDENT synthetic t0 vectors and scored on the ensemble mean,
    with an interval that carries both variance components; and the same
    ensemble's histogram of log10 p(t0) IS the H1-true reference spread s_0
    that calibrates E3's threshold, which the earlier version of this record
    asserted at 0.5 decades with no basis.

    (F) THE ALLOCATION RULE, DERIVED RATHER THAN CHOSEN. With a fixed total
    draw budget D = n * m over n keys at m draws each, the variance of the
    sample mean is sigma_a^2/n + v/D, where sigma_a^2 is the across-key
    variance of p(sk) and v the per-draw variance scale. Only the FIRST term
    depends on the split, and it falls in n alone. So the design spends the
    minimum draws per key that clears NULL-4's effective-sample-size floor and
    puts every remaining draw into more keys. That is why the key count is a
    declared function of the measured spread and not a round number chosen in
    advance.

    NOT A BREAK. A rejection condition's firing rate is a conformance and
    correctness quantity. Nothing here bears on MLWE, MSIS or SelfTargetMSIS in
    any direction, no signature is forged, and every object is produced with
    the private key in hand.

  mechanism: >-
    (1) THE EVENT, EXACTLY. FIPS 204 Algorithm 7 Line 28 rejects when
    ||<<c t0>>||_inf >= gamma2 (or the hint weight exceeds omega, which is a
    different object and is measured separately here because it is common). In
    R_q = Z_q[X]/(X^256 + 1), coefficient j of c t0 is a signed sum of exactly
    tau distinct coefficients of t0, one per nonzero coefficient of c, with
    signs from c and from the negacyclic wrap. The event is a MAXIMUM over the
    256k coefficients of the vector, which matters for the tilt design and is
    where a naive scheme fails.

    (2) THE TILT. Fix the key, hence t0. For a target coefficient j, write the
    linear form as sum over the tau selected positions of eps_i * a_i where
    a_i is the relevant t0 coefficient and eps_i in {-1,+1}. Sample the support
    and signs SEQUENTIALLY with conditional probabilities proportional to
    exp(theta * eps_i * a_i), normalised exactly at each step over the
    remaining positions; the product of the realised conditional ratios against
    the uniform-over-B_tau conditionals is the exact likelihood ratio, so no
    approximation enters the estimator. Choose theta by the standard saddle-
    point condition that the tilted mean of the sum equals the threshold, i.e.
    tilted-E[sum] = gamma2; at ML-DSA-44 that is gamma2/tau = 95232/39 = 2441.8
    per summand against a t0 coefficient scale of 2^(d-1) = 4096, so the
    required tilt is moderate and the scheme is in its well-behaved regime.
    GENERATOR-COMPUTED, RE-DERIVATION REQUIRED.

    (3) HANDLING THE MAXIMUM OVER 256k COEFFICIENTS. Two routes, both run.
    ROUTE A (union, conservative and simple): estimate the per-coefficient
    exceedance probability p_1 for a stratified sample of coefficient positions
    j, and combine by inclusion-exclusion to first order. This is exactly the
    combination IDEA-20260805-bb52fa performs analytically (it reports union
    bound and independence approximation agreeing to six figures), so route A
    is directly comparable to that record and isolates whether any discrepancy
    lives in p_1 or in the combination.
    ROUTE B (direct, and the one that can surprise): tilt toward the maximum by
    sampling j itself from a distribution proportional to a cheap upper proxy
    for the per-coefficient exceedance, and correct by the likelihood ratio.
    Route B is sensitive to correlations ACROSS coefficients, which route A
    assumes away and which is precisely the half of H1 that is unproved. A
    material gap between route A and route B is therefore not an inconsistency
    to be reconciled - it is the measurement.

    (4) WHY THIS IS NOT JUST RECOMPUTING A KNOWN CONVOLUTION. If t0 were drawn
    synthetically as independent uniforms, tilting would only re-derive
    bb52fa's exact closed form more slowly, and the exercise would be
    pointless. The whole content is that t0 comes from
    ML-DSA.KeyGen_internal - t0 = Power2Round(A s1 + s2).low for a real seed -
    and is then held FIXED while the challenge is randomised. That is the
    quantity the standard's rejection condition actually faces, and it is not
    the convolution's quantity unless H1 is true. THE SYNTHETIC ARM IS
    THEREFORE NOT WASTED WORK BUT THE NULL: it is what the same estimator
    returns when H1 is true by construction, and after the 2026-08-24 repair it
    is run at ENSEMBLE scale precisely so that "what H1 predicts" includes the
    spread H1 predicts and not only the mean.

    (5) WHAT THE PER-KEY DISPERSION WOULD MEAN, AND HOW ITS THRESHOLD IS SET.
    p(sk) depends on t0 through quantities like the largest partial sums of its
    coefficients, which vary from key to key. Under H1 the across-key spread of
    log p(sk) is NOT zero and NOT a number this record may assert: it is
    whatever the null ensemble of (E) returns, s_0, measured in the same run
    from M >= 256 synthetic t0 vectors at the same draws-per-vector as the real
    arm, so that the Monte-Carlo component is matched and only the across-t0
    component differs. The E3 threshold is the upper end of the bootstrap
    distribution of the null's own sample spread at the real arm's key count -
    i.e. E3 fires when the real spread exceeds what H1 itself would produce at
    that sample size. THE 2026-08-21 VERSION ASSERTED 0.5 DECADES WITH NO
    BASIS; that value is withdrawn and replaced by this calibration. If the
    measured spread is materially larger than s_0, some keys sit at a rate
    orders of magnitude above the pooled one, which is a structural finding
    about the standard's own check and is available from this design at no
    extra cost because the estimator is per-key by construction.

    (6) WHY THE COMPARATOR IS A MEAN AND NOT A MEDIAN. R_44 = 1024 * p_1 is an
    expectation over t0, so the estimand it names is E_sk[p(sk)]. For a
    log-normal p(sk) with spread s decades the ratio mean/median is
    exp((s*ln10)^2/2), which is 1.94 at s = 0.5 and 14.2 at s = 1.0. So a
    median-versus-mean comparison at a factor-10 threshold is driven past that
    threshold by the very dispersion E3 exists to detect, WHILE H1 IS TRUE, and
    the run would report "H1 fails in the tail, R_44 withdrawn" as an artifact
    of the comparator. Deep-tail dependence on each polynomial's empirical
    coefficient distribution makes a spread of that order the default
    expectation rather than the exotic case, so the confound is not
    hypothetical. The mean is the matched estimand; the median and the spread
    are reported beside it as separate objects.

    (7) THE HINT-WEIGHT DISJUNCT IS MEASURED THE ORDINARY WAY, IN THE SAME RUN.
    IDEA-20260805-630606 derives expected hint weights 63.4 / 38.7 / 57.1 with
    standard deviations 7.71 / 6.14 / 7.45 against omega = 80 / 55 / 75, i.e.
    2.16 / 2.65 / 2.40 standard deviations of headroom, so that predicate fires
    at per-cent rates and needs no tilting at all. Measuring it beside the
    tilted arm is what keeps the record honest about which of the two Line-28
    disjuncts is rare: only one of them is.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb MCP index UNAVAILABLE this session (in-memory Qdrant per the
      operating brief); not called and nothing attributed to it.
      GREPS RUN WITH COUNTS: (i) -i "linear program|polytope|bounded noise|
      bounded-noise|Chebyshev center" over ledger/ -> 54 files, none in area
      MLDSA; (ii) -i "bit-plane|bit plane|per-key dispersion|ACVP|interoperab"
      over the repository -> 39 files, none under RQ-MLDSA-ffa0f5, and in
      particular NO record in this lane measures anything per key;
      (iii) "MLDSA" over ledger/hypotheses -> 8 files, two under this question.
      READ IN FULL: RQ-MLDSA-ffa0f5, GOAL-MLDSA-002, IDEA-20260805-bb52fa (all
      619 lines, including its Stage 3 design, its H1 statement and its
      explicit "neither validates the tail at 10^-12" admission),
      IDEA-20260805-630606; read in large part IDEA-20260805-031ce2,
      IDEA-20260808-4f83f6, IDEA-20260808-e5f947; read the lane's full 5-row
      proposal inventory and knowledge/techniques/KN-TECH-1a5b7e.md.
      WEB QUERIES RUN (6): S1 (eprint 2024/1373, 8 links); S2 (t0 recovery /
      bounded noise, 8); S3 (t0 attack method, 10); S4 (ACVP ML-DSA sigVer
      vectors, 9); S5 (per-bit-plane recovery cost, 8); S6 (ML-DSA differential
      testing and conformance, 10). NO SEARCH WAS RUN specifically on rare-event
      simulation for lattice-signature rejection rates, and that is a stated
      gap in this screen rather than an absence of prior art.
      FETCHED AND READ (LANDING/ABSTRACT PAGES ONLY): eprint.iacr.org/2026/1333
      (the paper RQ-MLDSA-ffa0f5 attributes the billion-signature observation
      to), eprint.iacr.org/2024/1373, eprint.iacr.org/2024/2046,
      eprint.iacr.org/2025/195. FETCH FAILURES RECORDED AS FAILURES: both
      eprint PDFs unparseable binary; the Springer chapter 303 to an
      authentication endpoint.
      NO NEW SCREEN WAS RUN AT THE 2026-08-24 REPAIR; that repair changes the
      null ensemble and the decision rule, adds no external claim, and leaves
      the screen above as the basis of the unverified verdict.
    results: >-
      IN-CORPUS: IDEA-20260805-bb52fa is the direct predecessor and this
      proposal exists because of one sentence in it - that its H1's tail
      behaviour at 1e-12 "is not validated by anything in the design and cannot
      be within budget". Its Stage 3 samples 1e6 (c, t0) pairs and compares
      empirical upper quantiles against the exact convolution, which tests H1
      at accessible quantiles and explicitly not at the one that matters. No
      corpus record uses importance sampling, exponential tilting or any
      rare-event technique, and no corpus record in any lane reports a per-key
      rate.
      EXTERNAL: the fetch of eprint 2026/1333 confirmed the paper's title,
      authors (Riou, Park, Anwar, Poschmann, Hutter) and that it is a
      benchmarking-methodology paper concerned with rejection-sampling-induced
      timing variability - but its "Pitfall 12" and the over-one-billion-
      signature observation that RQ-MLDSA-ffa0f5 attributes to it are NOT in
      the abstract and were NOT verified. That figure remains relayed.
    verdict: >-
      UNVERIFIED. Exponential tilting and Esscher transforms are classical
      rare-event machinery (Siegmund; Bucklew) and are NOT claimed as
      invention. What is claimed as new relative to this corpus: applying them
      to a fielded standard's own rejection predicate with the key FIXED and
      the challenge randomised; turning a zero count into an unbiased positive
      estimate with an interval; the route-A-versus-route-B contrast as a
      direct test of the cross-coefficient half of bb52fa's H1; the per-key
      rate as an object; and, after the 2026-08-24 repair, the use of the null
      ENSEMBLE's own across-t0 spread as the calibration of the per-key
      dispersion threshold rather than an asserted number. Whether anyone has
      estimated ML-DSA rejection rates by importance sampling in the literature
      was NOT searched and is recorded as an unchecked axis.

  object_first_candidate:
    tracked_object: >-
      THE TILTED MEASURE ON THE CHALLENGE SPACE B_tau - equivalently the
      likelihood-ratio process of that tilt against SampleInBall's uniform law -
      carried with the key's t0 held fixed. What is followed through the
      computation is not a signature and not a rejection, but the WEIGHT a
      sampled challenge carries. Established families declared off-limits as
      the primary lens: lattice reduction and estimator differencing; fault
      injection and physical side channels (GOAL-MLDSA-001's scope; nothing
      here glitches anything); nonce misuse and the HNP family; forgery search;
      and, specifically, decryption/verification-failure boosting, which is the
      family a reader will reach for because "steer the sampler toward a rare
      event" sounds like it - it is not, because nothing here is adversarially
      chosen or fed to an oracle, the key is known, and the output is an
      unbiased estimate of a probability rather than an event.
    lossiness: >-
      LOSSY, AND THE LOSS IS THE MECHANISM RATHER THAN A SIDE EFFECT. The
      projection sends the full signing state to the single scalar
      max_j |<<c t0>>_j| together with its importance weight, discarding the
      message, the nonce y, the commitment, s1, s2 and every emitted byte -
      indeed discarding the signature entirely, since no signature is ever
      produced. The discard is COMPATIBLE with the target's operation because
      the Line-28 predicate is a function of (c, t0) ALONE: everything
      discarded is provably irrelevant to the event being estimated, which is
      what makes the sampler able to skip signing altogether and is where the
      1e3-plus speedup actually comes from. It is not a change of coordinates:
      neither c nor t0 is recoverable from the scalar, and the fibre over a
      value is the whole of B_tau at that level set. THE MIRROR FAILURE - a
      projection so lossy it is constant - does not occur: the tracked scalar
      has a measurable spread across challenges and, per outcome E3, possibly
      across keys, and a measured across-key spread indistinguishable from the
      NULL ENSEMBLE's own spread s_0 is the pre-registered tell that the
      per-key refinement of the projection is uninformative. Note that "spread
      of exactly zero" would have been the wrong tell, because H1 itself
      predicts a nonzero across-t0 spread; the null ensemble is what supplies
      the right one.
    propagation: >-
      One step is one sequential coordinate decision in the tilted sampler, and
      its propagation law is exact: the conditional tilted probability of
      selecting position i with sign eps, normalised over the remaining
      positions, against the uniform-over-B_tau conditional. The product of
      those ratios is the sample's weight, so the object propagates
      deterministically and without approximation from the first coordinate to
      the tau-th. That the weights are EXACT rather than approximate is what
      keeps the estimator unbiased and is the property the design checks first.
    survival_score: >-
      Survives the whole estimation and is the answer. It dissolves at exactly
      one identified place, and the place is named rather than discovered: the
      MAXIMUM over 256k coefficients. A tilt aimed at one coefficient is a bad
      proposal distribution for the maximum, so the likelihood ratio's variance
      can blow up and the estimator silently degrades to worse than naive. The
      design detects this by monitoring the effective sample size and the
      weight-concentration ratio at every stage, and reports the estimate as
      unusable if the effective sample size falls below a pre-declared floor.

  null_object_control: >-
    NULL-1, THE ENSEMBLE NULL, REBUILT 2026-08-24 AFTER A RED-TEAM FINDING THAT
    ITS PREDECESSOR WAS AN ENSEMBLE-MEAN COMPARATOR READ AT n = 1
    (KN-TECH-1a5b7e mode 5). It has two arms over the SAME M >= 256
    independent synthetic t0 vectors, each drawn with i.i.d. coefficients
    uniform on [-2^(d-1)+1, 2^(d-1)] - the distribution H1 asserts for a real
    t0 - at the same draws-per-vector m as the real-key arm so the Monte-Carlo
    component is index-matched.
    NULL-1a, THE CLOSED-FORM CHECK: per-coefficient exceedance p_1(t0^(i))
    estimated for each of the M vectors; the reported statistic is the ENSEMBLE
    MEAN over i, and its interval is t * s / sqrt(M) with s the sample standard
    deviation of the M per-vector estimates - which contains BOTH the across-t0
    spread and the within-vector Monte-Carlo noise by construction. The two
    components are separated by replicating 8 seeds within a subsample of the
    vectors and reported separately. FORCED VALUE: 7.1656e-12, the exact
    rational IDEA-20260805-bb52fa computes in closed form by
    inclusion-exclusion (log2 = -37.02). This is the strongest control
    available anywhere in this lane, because it scores a Monte Carlo estimator
    against an exactly known answer at exactly the quantile of interest, and it
    now scores it against the ensemble the answer is an expectation over.
    NULL-1b, THE INDEX-MATCHED NULL AND E3's CALIBRATION: the SAME M vectors,
    but estimating the FULL object p(t0) = Pr_c[max over all 256k coefficients
    >= gamma2], i.e. the object the real-key arm measures. Its ensemble mean is
    scored against the union combination 7.3376e-9 = 1024 * 7.1656e-12, and the
    HISTOGRAM of log10 p(t0^(i)) is reported as s_0, the spread H1 itself
    predicts. E3's threshold is the upper end of the bootstrap distribution of
    the null's sample spread at the real arm's key count. WITHOUT THIS ARM E3
    HAS NO CALIBRATION AND ITS 2026-08-21 THRESHOLD OF 0.5 DECADES WAS AN
    ASSERTION.
    NULL-2, THE RQ-MANDATED RESAMPLED-t0 ARM, RUN AND CORRECTLY LABELLED: the
    same estimator on a t0 resampled independently of the key. Its answer is
    NULL-1's by construction, so under KN-TECH-1a5b7e it cannot fail as a test
    of any key-specific effect; it is reported as a plumbing check and never
    cited as evidence about the leak.
    NULL-3, CALIBRATION AGAINST NAIVE MONTE CARLO WHERE NAIVE STILL WORKS, WITH
    THREE INTERIOR POINTS: run both the tilted and the naive estimator at
    lowered thresholds gamma2' chosen so the true rate is near 1e-3, 1e-4 and
    1e-5. The two must agree at every point, and the ratio of their sample
    sizes at fixed relative error must GROW as the threshold rises - that
    growth is the efficiency claim, and it is what a single-threshold
    comparison cannot show. Monotonicity is reported explicitly.
    NULL-4, THE INSTRUMENT'S OWN FAILURE DETECTOR: effective sample size and
    the top-1% weight share reported at every cell, against pre-declared
    floors. An estimate produced below the floor is reported as unusable, not
    as a number with a wide interval. The floor also fixes m_min, the minimum
    draws per key, which the allocation rule of claim (F) needs.
    NULL-5, SEED REPLICATION, AND AN EXPLICIT STATEMENT OF WHICH INDEX IT
    REPLICATES: every cell is drawn at least 8 times with independent seeds and
    reported as an interval. THIS REPLICATES THE MONTE-CARLO INDEX ONLY. It
    cannot detect an across-t0 or across-key mismatch, and in the 2026-08-21
    version it was relied on as though it could - that was the mode-5 error the
    2026-08-24 repair corrects. The across-t0 index is replicated by NULL-1's
    M vectors and the across-key index by the real arm's n keys; all three
    indices are named in every reported interval.
    VERDICT-ON-THE-NULL-FIRST: NULL-1a's and NULL-1b's verdicts are computed
    and committed before any real-key estimate is examined.

  discriminated_from:
    - >-
      IDEA-20260805-bb52fa derives R_44 = 7.34e-9 analytically under H1 and
      proves the rate is exactly 0 at ML-DSA-65 and -87. Its Stage 3 samples
      1e6 (c, t0) pairs and compares ACCESSIBLE upper quantiles against the
      exact convolution. This proposal measures the event ITSELF, at the real
      threshold, on real keys, which that record states it cannot afford and
      names as an unclosed gap. The two also differ in what is random: bb52fa's
      Stage 3 randomises both c and t0 and compares against a model; this fixes
      t0 at a real key and randomises only c, which is what the signing loop
      actually does - and then restores the t0 randomisation ON PURPOSE in the
      null ensemble, where it is the object of interest rather than a nuisance.
    - >-
      IDEA-20260805-630606 derives hint weights and entropy floors. Its hint-
      weight numbers are consumed here as the non-rare arm's forced values and
      are not re-derived; its floors concern t0 recovery and are a different
      object entirely.
    - >-
      IDEA-20260808-4f83f6 measures a deviation in the accepted CHALLENGE law
      induced by conditioning on the ct0 predicate. That is the challenge law
      AFTER rejection under the true sampler; this proposal deliberately
      DISTORTS the challenge law and corrects by an exact weight, and estimates
      a probability rather than a deviation. The two are adjacent enough to be
      worth one sentence of separation and they share no statistic: 4f83f6's
      observable is a 256-bin histogram of accepted supports, this one's is a
      weighted mean of an indicator.
    - >-
      IDEA-20260821-60ba98 (this batch) uses p_R as an input to a security
      term. This proposal produces p_R. If this run returns E2, that record's
      crossover table is withdrawn; if it returns E3, the crossover table
