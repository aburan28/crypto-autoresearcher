    method: >-
      crypto-kb MCP index UNAVAILABLE this session (in-memory Qdrant per the
      operating brief); not called and nothing attributed to it.
      GREPS RUN WITH COUNTS: (i) -i "linear program|polytope|bounded noise|
      bounded-noise|Chebyshev center" over ledger/ -> 54 files, none in area
