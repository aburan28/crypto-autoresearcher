idea:
  id: IDEA-20260821-6d1b97
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-21'
  title: >-
    Stop reporting a zero count as a bound: exponentially tilt the CHALLENGE
    distribution around a REAL key's t0 and measure the ML-DSA-44 ct0 rejection
    rate directly at 1e-9, from about 1e5 tilted samples instead of the 1e9
    signatures the honest estimator needs - which is the only affordable test
    of IDEA-20260805-bb52fa's H1 AT THE QUANTILE WHERE H1 IS ACTUALLY USED, and
    which returns a PER-KEY rate rather than one number for the parameter set
  class: measurement

  claim: >-
    (A) THE PROBLEM THIS SOLVES, STATED AS THIS QUESTION'S OWN CONSTRAINT.
    RQ-MLDSA-ffa0f5 requires that "a zero observed count is reported as an
    upper bound with its sample size, never as a measured rate of zero", and
    GOAL-MLDSA-002's first completion criterion asks for a measured rate with a
    confidence interval at each of ML-DSA-44 / -65 / -87. At ML-DSA-65 and -87
    that criterion is already met at zero compute by IDEA-20260805-bb52fa's
    envelope theorem (the rate is exactly 0 as arithmetic, not as a zero
    count). At ML-DSA-44 it is unreachable by honest sampling: the same record
    derives a rate of 7.34e-9 and prices a two-sided interval at of order 1e9
    signatures against a campaign budget of 10,800 wall-clock seconds, and
    states plainly that its own H1 "at 10^-12 is not validated by anything in
    the design and cannot be within budget". THIS PROPOSAL CLOSES THAT NAMED
    GAP.

    (B) THE MOVE. For a FIXED key, t0 is fixed and the only randomness in the
    Line-28 predicate is the challenge c, drawn by SampleInBall uniformly from
    B_tau (exactly tau coefficients in {-1,+1}). So the quantity
        p(sk) := Pr_{c <- B_tau}[ ||<<c t0>>||_inf >= gamma2 ]
    is a rare-event probability under a KNOWN, SAMPLEABLE distribution with a
    FIXED, KNOWN deterministic object t0 - the textbook setting for
    exponentially tilted importance sampling. Sample c from an Esscher-tilted
    law that pushes the signed sum toward the threshold, weight each sample by
    its exact likelihood ratio, and average. The estimator is UNBIASED, returns
    a positive number with a confidence interval, and needs a sample size that
    grows polynomially rather than as 1/p.

    (C) THE FALSIFIABLE CLAIM, WITH NUMBERS. From about 1e5 to 1e6 tilted
    challenge draws per key - minutes of single-core compute - the estimator
    returns p(sk) at ML-DSA-44 with relative standard error below 10%, against
    a naive requirement of order 1/p = 1.4e8 signing attempts for a single
    expected event and of order 1e9 for an interval. That is a reduction of
    roughly 1e3 in samples and, because a tilted challenge draw costs a
    polynomial multiplication rather than a full signing attempt, considerably
    more than that in wall clock. The claim is falsifiable in the ordinary way:
    if the tilted estimator's relative variance does not fall - importance
    sampling fails catastrophically when the tilt is misaimed, and a MAXIMUM
    over 256k coefficients is exactly the structure that can misaim it - the
    measurement stays out of budget and that is what gets reported.

    (D) THE DISCRIMINATION, WHICH IS THE POINT. IDEA-20260805-bb52fa's
    R_44 = 7.34e-9 is derived under an assumption that the 256k coefficients of
    a REAL t0 behave as independent uniforms. This proposal measures the same
    quantity on REAL keys. THREE OUTCOMES, EACH WITH A DIFFERENT MEANING.
    E1, agreement within the interval: H1 holds in the tail where it is used,
    at the sampled keys; R_44 is upgraded from derived to measured and every
    downstream number that consumes it - IDEA-20260821-60ba98's crossover
    N* = 1.36e8, GOAL-MLDSA-002's sample sizing - is put on measured footing.
    E2, disagreement by an order of magnitude or more: H1 fails in the tail,
    R_44 is withdrawn, and the direction of the failure says which half of H1
    (uniformity or independence) is responsible, because the synthetic control
    isolates them.
    E3, large dispersion of p(sk) across keys: the rate is a PER-KEY quantity
    and no single number is a correct answer to the completion criterion. This
    outcome is invisible to any design that measures one pooled rate, and the
    corpus currently contains no per-key measurement of anything in this lane.

    NOT A BREAK. A rejection condition's firing rate is a conformance and
    correctness quantity. Nothing here bears on MLWE, MSIS or SelfTargetMSIS in
    any direction, no signature is forged, and every object is produced with
    the private key in hand.

  mechanism: >-
    (1) THE EVENT, EXACTLY. FIPS 204 Algorithm 7 Line 28 rejects when
    ||<<c t0>>||_inf >= gamma2 (or the hint weight exceeds omega, which is a
    different object and is measured separately here because it is common). In
    R_q = Z_q[X]/(X^256 + 1), coefficient j of c t0 is a signed sum of exactly
    tau distinct coefficients of t0, one per nonzero coefficient of c, with
    signs from c and from the negacyclic wrap. The event is a MAXIMUM over the
    256k coefficients of the vector, which matters for the tilt design and is
    where a naive scheme fails.

    (2) THE TILT. Fix the key, hence t0. For a target coefficient j, write the
    linear form as sum over the tau selected positions of eps_i * a_i where
    a_i is the relevant t0 coefficient and eps_i in {-1,+1}. Sample the support
    and signs SEQUENTIALLY with conditional probabilities proportional to
    exp(theta * eps_i * a_i), normalised exactly at each step over the
    remaining positions; the product of the realised conditional ratios against
    the uniform-over-B_tau conditionals is the exact likelihood ratio, so no
    approximation enters the estimator. Choose theta by the standard saddle-
    point condition that the tilted mean of the sum equals the threshold, i.e.
    tilted-E[sum] = gamma2; at ML-DSA-44 that is gamma2/tau = 95232/39 = 2441.8
    per summand against a t0 coefficient scale of 2^(d-1) = 4096, so the
    required tilt is moderate and the scheme is in its well-behaved regime.
    GENERATOR-COMPUTED, RE-DERIVATION REQUIRED.

    (3) HANDLING THE MAXIMUM OVER 256k COEFFICIENTS. Two routes, both run.
    ROUTE A (union, conservative and simple): estimate the per-coefficient
    exceedance probability p_1 for a stratified sample of coefficient positions
    j, and combine by inclusion-exclusion to first order. This is exactly the
    combination IDEA-20260805-bb52fa performs analytically (it reports union
    bound and independence approximation agreeing to six figures), so route A
    is directly comparable to that record and isolates whether any discrepancy
    lives in p_1 or in the combination.
    ROUTE B (direct, and the one that can surprise): tilt toward the maximum by
    sampling j itself from a distribution proportional to a cheap upper proxy
    for the per-coefficient exceedance, and correct by the likelihood ratio.
    Route B is sensitive to correlations ACROSS coefficients, which route A
    assumes away and which is precisely the half of H1 that is unproved. A
    material gap between route A and route B is therefore not an inconsistency
    to be reconciled - it is the measurement.

    (4) WHY THIS IS NOT JUST RECOMPUTING A KNOWN CONVOLUTION. If t0 were drawn
    synthetically as independent uniforms, tilting would only re-derive
    bb52fa's exact closed form more slowly, and the exercise would be
    pointless. The whole content is that t0 comes from
    ML-DSA.KeyGen_internal - t0 = Power2Round(A s1 + s2).low for a real seed -
    and is then held FIXED while the challenge is randomised. That is the
    quantity the standard's rejection condition actually faces, and it is not
    the convolution's quantity unless H1 is true.

    (5) WHAT THE PER-KEY DISPERSION WOULD MEAN, AND WHY IT IS NOT ASSUMED AWAY.
    p(sk) depends on t0 through quantities like the largest partial sums of its
    coefficients, which vary from key to key. Under H1 the across-key spread of
    log p(sk) is derivable and small; if the measured spread is materially
    larger, some keys sit at a rate orders of magnitude above the pooled one.
    That is a structural finding about the standard's own check - it would mean
    the correct answer to "measure the rate" is a distribution, not a number -
    and it is available from this design at no extra cost because the estimator
    is per-key by construction.

    (6) THE HINT-WEIGHT DISJUNCT IS MEASURED THE ORDINARY WAY, IN THE SAME RUN.
    IDEA-20260805-630606 derives expected hint weights 63.4 / 38.7 / 57.1 with
    standard deviations 7.71 / 6.14 / 7.45 against omega = 80 / 55 / 75, i.e.
    2.16 / 2.65 / 2.40 standard deviations of headroom, so that predicate fires
    at per-cent rates and needs no tilting at all. Measuring it beside the
    tilted arm is what keeps the record honest about which of the two Line-28
    disjuncts is rare: only one of them is.

  novelty_status: unverified

