    primary_null: 'A NON-SPARSE BASELINE: extract the shipped defaults for UNIFORM-secret modes
      of the same libraries. If the sparse and uniform envelopes coincide in (N, log q), then
      sparseness is the only variable and the comparison is clean; if not, the confound must be
      stated.'
    secondary_nulls:
