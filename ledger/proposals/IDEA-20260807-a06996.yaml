  class: measurement
  claim: 'RQ-FHE-001 (status active, created 2026-08-01) asks whether the sparse-secret Ring/Module-LWE
    parameter sets shipped by OpenFHE, Lattigo, TFHE-rs and HEaaN still meet their claimed level
    under the 2026 enhanced hybrid decoding attacks, and records a reported claim that 12 of 16
    recent published sparse Ring-LWE sets fall below 128 bits. It has no hypotheses, no proposals
    (a keyword search of all 278 IDEA-* records returns only IDEA-20260805-3d71ca and IDEA-20260805-2b94fe,
    both attached to RQ-MLKEM-001 and mentioning FHE in passing), and no evidence. KN-TECH-082
    -- ''Hybrid attacks on LWE: guessing/MITM over sparse secrets, and ring-structure acceleration''
    -- was written for exactly this and is cited by zero ledger records. The question''s constraints
    block experiment DESIGN until primary sources are filed, and its provenance block records
    eprint as unreachable. BUT THE SAME BLOCK STATES THAT raw.githubusercontent.com IS REACHABLE
    and was already used to verify the libraries'' operation surface -- and that their DEFAULT
    PARAMETERS ''have not been extracted''. That extraction is the question''s own fifth declared
    method, needs no eprint, needs no attack, and has never been done.'
  mechanism: Extract the shipped default sparse/ternary secret parameter sets -- ring degree N,
    modulus chain, Hamming weight h, error sigma -- from OpenFHE, Lattigo and TFHE-rs source at
    PINNED COMMITS, recorded verbatim with the commit sha. Then state, as a CENSUS CARRYING NO
    SECURITY CLAIM, which of the reported-at-risk published parameter sets fall inside or outside
    the shipped envelope. The tracked object is the tuple (N, log q, h) as a point in shipped-versus-published
    parameter space.
