idea:
  id: IDEA-20260929-688ea4
  id_provenance: >-
    Pre-minted and --check verified by the top-level session on 2026-09-29.
    This Coordinator holds no shell and minted nothing.
  question_id: RQ-DREG-bd6c86
  question_id_note: >-
    RQ-DREG-bd6c86 is the question research/FFD_SEMAEV_MEASUREMENT1.md was
    measured for. Its header says "theory/measurement track for
    RQ-DREG-bd6c86", and section 0 cites that question's support-matched null
    requirement. RQ-SEMBIN-9e8f82 (Nagao's coset-shift question) is related
    but is not the question the table answers. The goal lane is
    GOAL-SEMBIN-fcb7a2 because the re-measurement is ordered by
    DEC-20260929-d75c82 NA-3, which was issued under that goal.
  goal_id: GOAL-SEMBIN-fcb7a2
  added: '2026-09-29'
  status: proposed
  approved_by: null
  title: >-
    Re-measure the FFD_SEMAEV_MEASUREMENT1 section 2 table ("Semaev d_ff pinned
    at 2, support-matched null climbs with n'") with the corrected XOR
    Boolean-ring product. Use the same 8 cells, the same seeds and the same
    draw counts. Compute the observable under two named degree conventions,
    and use the superseded OR-row instrument only as a transcription control.
  class: measurement
  claim: >-
    MEASUREMENT1 section 2 made three claims on Weil-descended Semaev S_3
    2-decomposition systems over F_{2^n}, n in {4,5,6,7}, n' in {3,4}, N = 2n'.
    (P1) Semaev d_ff is pinned at 2 in every cell. (P2) The degree-profile-
    matched null's d_ff exceeds Semaev's, with a median deficit >= 1, in
    every cell except (7,3), where the deficit was 0. (P3) The null's d_ff
    rises with n'. All three were computed with the set-OR product that
    CORR-20260929-616d03 found defective. This proposal claims only that the
    three statements are now testable as preregistered predictions against
    the corrected instrument. It makes no claim that they hold.
  mechanism: >-
    The product error changes which rows m*f enter the degree-D Macaulay space
    whenever a multiplier m overlaps monomials of f. Under set-OR, colliding
    monomials merge. Under the true Boolean-ring product they cancel, so the
    product can have lower degree and a different support. Rows with
    non-constant m are therefore affected. The Semaev side has an independent
    reason to sit at 2: the section 3a trace witness is a constant-coefficient
    (m = 1) combination with zero degree-2 part whenever x_R != 0, and it
    involves no product. The null side has no such witness, and its falls come
    from products with non-constant m. That is exactly where the defect acts,
    so P2 and P3 are the claims at risk (CORR-20260929-616d03
    scope_of_effect.ffd_semaev_measurement1).
  novelty_status: unverified
  origin:
    kind: >-
      Corrective re-measurement ordered by DEC-20260929-d75c82 NA-3, recorded
      by the Coordinator on 2026-09-29 under the standing user authorization
      of AGENTS.md. The user said "continue" after being told this was the
      next step.
    date: '2026-09-29'
    parent_idea: >-
      IDEA-20260916-4b7c1e (the new_falls(D) fall-profile observable that
      MEASUREMENT1 implements). IDEA-20260916-9d2fa6 is the null tower whose
      block-multiaffine rung (MEASUREMENT1 N1) is NOT run here.
    instrument: >-
      experiments/EXP-SEMBIN-473340/src/ (boolean_macaulay.py, remeasure.py,
      test_boolean_macaulay.py, ffd_semaev_core_v1.py), committed at
      be6c822cb5 per the session.
  citations:
