    proof_obligations: []
    not_applicable_reason: >-
      Empirical re-measurement of a finite table on fixed seeded toy systems.
      No theorem, bound, reduction or complexity statement is claimed or
      tested. The section 3a derivation is cited for context and is not under
      test.
  predictions:
    - metric: Semaev median d_ff per cell, in each convention (reduced, formal)
      direction: different
      minimum_effect: equal to 2 in all 8 cells (P1)
    - metric: null median d_ff minus Semaev median d_ff per cell, in each convention
      direction: higher
      minimum_effect: '>= 1 in the 7 cells other than (7,3) (P2)'
    - metric: null median d_ff at n' = 4 versus n' = 3, per n, in each convention
      direction: higher
      minimum_effect: strictly greater for each n in {4,5,6,7} (P3)
  minimal_test: >-
    Run experiments/EXP-SEMBIN-473340/src/remeasure.py once under the frozen
    contract EXP-SEMBIN-473340. Scoring is by the contract's frozen rule,
    applied from results.json at evidence review.
  falsification_conditions:
    - >-
      Under a convention, P2 or P3 fails. The MEASUREMENT1 headline "null
      climbs while Semaev stays pinned" then does not hold for that observable
      on these systems.
    - Under a convention, P1 fails.
  interpretation_limits:
    - >-
      Toy tier, N <= 8, n <= 7. One curve shape (a2 = a6 = 1),
      characteristic 2, m = 2 summands. The null is matched on the degree
      profile only, and the block-multiaffine null (MEASUREMENT1 N1) is not
      run.
    - >-
      d_ff is not the solving degree (MEASUREMENT1 section 4). Nothing about
      subexponentiality, asymptotics or any curve's security.
    - >-
      Same seeds as MEASUREMENT1, so these are the same 80 Semaev and 200
      null systems, re-measured. The run re-computes the observable. It draws
      no fresh sample.
