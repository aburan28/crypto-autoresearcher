idea:
  id: IDEA-20260816-b3a6f0
  question_id: RQ-SDITH-001
  added: '2026-08-16'
  title: 'A zero-compute forced value and a quantifier-order audit for seed-tree opening size: derive
    the exact worst case and the exact expectation of revealed nodes for a punctured tree, then check
    whether a size claim is stated for all hidden sets or only for typical ones, with an incomplete-tree
    family as the nearby-object control.'
  class: theory
  claim: '(A) THE WORST CASE AND THE EXPECTATION ARE BOTH CLOSED FORMS AND THEY DIFFER. For a complete
    binary tree with L leaves and a hidden set of size t, the number of revealed nodes when the maximal
    disjoint subtrees are opened has an exact worst case, attained when the hidden leaves are maximally
    spread so their root paths share as few nodes as possible, and an exact expectation under a uniform
    hidden set. Part (A) claims both are closed forms in (L, t) derivable with zero compute, that
    the worst case equals t times log2(L) minus the exact overlap correction which is zero when t
    is at most L divided by 2 raised to the power ceil(log2 t), and that the expectation is strictly
    smaller than the worst case for every t at least 2 and every L at least 4. The gap between them
    is the forced value this record delivers. (B) THE SIZE CLAIM HAS A QUANTIFIER ORDER AND IT IS
    AUDITABLE WITHOUT ANY EXPERIMENT. A statement the opening is at most X bytes admits two readings:
    for all hidden sets, the opening is at most X; and there exists X such that for typical hidden
    sets the opening is at most X. Part (B) claims these two readings differ by exactly the worst-case-minus-expectation
    gap of part (A), that a size budget derived under the second reading and used under the first
    is off by that computable amount, and that which reading is intended is decidable from whether
    the accounting quotes an expectation or a maximum, without reading any specification. (C) THE
    NEARBY-OBJECT CONTROL IS AN INCOMPLETE TREE, WHERE THE HOPED-FOR CONCLUSION FAILS. For an incomplete
    or unbalanced tree with L leaves, the worst-case formula of part (A) is false, and part (C) claims
    the exact amount by which it fails is computable and is the method-ceiling check demanded by inventor-protocol
    section 8 audit 4: a derivation that cannot distinguish the complete from the incomplete case
    has not identified the load-bearing structure. (D) WHAT IS NOT CLAIMED. No forgery, no break,
    no speedup, no security consequence. It is NOT claimed that any scheme states its size claim under
    either reading, since no specification has been read; the audit is a decision procedure applied
    to a form of words, and the two readings are both stated as hypotheticals. It is NOT claimed that
    exceeding a size budget has any consequence, which is a design question this record does not touch.
    It is NOT claimed that the closed forms are new mathematics: they are elementary counting, and
    their value here is as a forced value available before any experiment is proposed.'
  mechanism: 'This is a zero-compute derivation with a small verification harness, in the sense of
    inventor-protocol section 2 and section 8. STAGE 1 derives the worst case: hiding t leaves reveals,
    for each hidden leaf, the siblings along its root path that are not themselves ancestors of another
    hidden leaf. Maximizing over hidden sets means minimizing path overlap, which is achieved by spreading
    hidden leaves across distinct subtrees at the shallowest level that can hold t of them, giving
    the stated form with an exact overlap correction. STAGE 2 derives the expectation by linearity
    over nodes: a node is revealed exactly when its subtree contains no hidden leaf and its parent''s
    subtree does, an event whose probability under a uniform hidden set of size t is a ratio of binomials,
    and summing over levels gives a closed form. STAGE 3 states both forms and computes their difference
    symbolically. STAGE 4 is the verification harness, and it exists because a derivation that is
    only prose fails the section-4 standard: exhaustive enumeration at L up to 64 and t up to 4 must
    reproduce both closed forms EXACTLY, and any mismatch is the result. STAGE 5 is the quantifier-order
    audit, written as a decision procedure with two inputs, whether the quoted number is a maximum
    or a mean and whether the budget is enforced per signature or on average, and four outputs, one
    per combination, each with the exact discrepancy from part (A) attached. STAGE 6 is the nearby-object
    control: apply the SAME derivation to an incomplete tree family and show it produces a false answer
    there, with the exact error, demonstrating the derivation is sensitive to the completeness hypothesis
    rather than being a formula that returns something plausible for any tree.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: seed tree, seed-tree, GGM tree, opening, puncturable,
      quantifier, worst case. Read titles and class of IDEA-20260805-38048d, IDEA-20260808-aa551f,
      IDEA-20260805-cbd93d, IDEA-20260805-bf6448, IDEA-20260813-2caec5. Read RQ-SDITH-001 in full
      and H-SDITH-d37289 in full, the latter specifically because it is the repository''s exemplar
      of a zero-compute exact-counting derivation and I needed to check its object was not this one.
      Read inventor-protocol sections 1 to 5 and 8.'
    results: 'H-SDITH-d37289 is the structural model but not the object: it derives an exact admissibility
      ratio and a closed form for the d-split ISD advantage, i.e. counting over the HARD PROBLEM''s
      search space, with a Vandermonde bound and a local-CLT closed form. This record''s object is
      the seed tree, which that hypothesis never touches. IDEA-20260805-cbd93d is likewise a zero-compute
      forced value for the d-split admissibility ratio. IDEA-20260805-38048d states an opening-size
      inequality as a filter but does not derive its worst case or expectation. IDEA-20260808-aa551f
      counts a challenge space. No record was found deriving worst-case or expected revealed-node
      counts, and none contains a quantifier-order audit of a size claim.'
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; counting revealed nodes
      in punctured GGM trees is elementary and very likely standard there. Assembled from known parts:
      linearity of expectation over nodes, maximal-spread worst-case arguments, and the quantifier-order
      audit prescribed by inventor-protocol section 8 audit 3 are all pre-existing methods, and H-SDITH-d37289
      and IDEA-20260805-cbd93d already establish the zero-compute forced-value pattern in this repository.
      Claimed new relative to THIS repository only: applying that pattern to the seed tree rather
      than the hard problem, pairing the two closed forms so their gap becomes the auditable quantity,
      and the incomplete-tree nearby-object control that makes the derivation falsifiable rather than
      merely stated.'
  object_first_candidate:
    tracked_object: The pair (worst-case revealed count, expected revealed count) as a function of
      (L, t), followed as t increases by one, with their difference retained as the object of interest.
    lossiness: 'Genuinely lossy. The pair discards the identity of the hidden set, the tree''s node
      values, the seeds, the hash and the per-level structure, retaining two integers per (L, t).
      It propagates because the size accounting is a linear functional of a revealed count, so the
      two extremes of that count bound every accounting statement that can be made. The discard is
      compatible because both quantities are determined by (L, t) and the completeness hypothesis
      alone, which is precisely what the nearby-object control tests: on an incomplete tree the retained
      pair no longer determines the count, and the projection stops propagating. If instead one tracked
      the full antichain, nothing would be discarded and the object would be a change of coordinates
      rather than a forced value.'
    propagation: One step of the target operation is hiding one more leaf. Under it the worst case
      increases by exactly log2(L) minus the depth at which the new leaf's path first meets an already-hidden
      leaf's path, and the expectation increases by a binomial-ratio increment computable in closed
      form. So the tracked pair advances by two explicit increments, and the derivation is exactly
      the statement that both increments have closed forms while the gap between them accumulates.
    survival_score: The closed forms survive for complete regular trees at every (L, t) with t at
      most L. They dissolve for incomplete trees, and the nearby-object control measures the exact
      size of that dissolution at a family of unbalanced trees. The survival number reported is the
      largest imbalance, measured as the difference between the deepest and shallowest leaf depth,
      at which the complete-tree worst-case formula remains correct, which is expected to be zero
      and is checked rather than assumed.
  null_object_control: 'NULL-INCOMPLETE-TREE: the identical derivation and the identical verification
    harness applied to a family of incomplete or unbalanced trees with the same leaf count, in the
    same invocation. The complete-tree closed forms must FAIL there by a computable amount. If they
    do not fail, the derivation is not using the completeness hypothesis and is returning a plausible
    number for any tree, which under inventor-protocol section 8 audit 4 means the load-bearing structure
    has not been identified and the forced value is not forced. A second null, NULL-RANDOM-ANTICHAIN,
    evaluates the size functional on a random antichain of the same cardinality with no hidden set
    behind it, confirming that the derived counts are not simply the generic antichain size.'
  discriminated_from:
  - 'H-SDITH-d37289 and IDEA-20260805-cbd93d, the d-split admissibility ratio forced values: same
    method, entirely different object. Those count the hard problem''s search space; this counts tree
    nodes and never touches syndrome decoding.'
  - 'IDEA-20260805-38048d, the bAVC opening-size filter: takes a size inequality as given and studies
    its effect on challenge selection. This derives the two extremal values that any such inequality
    must sit between.'
  - 'IDEA-20260808-aa551f, merged-tree challenge-space cardinality: counts challenges, not revealed
    nodes.'
  - 'The antichain-profile measurement record elsewhere in this bucket: that ENUMERATES distributions
    and fibre sizes empirically at L up to 1024. This DERIVES the two extremes in closed form with
    zero compute and uses enumeration only as a verification harness at L up to 64. The two are deliberately
    complementary and each is a check on the other; a disagreement between them at overlapping parameters
    would be a finding for both.'
  - A generic statement that opening size varies. That is an observation; this delivers two closed
    forms, their exact gap, and a decision procedure keyed to that gap.
  assumptions:
  - Complete regular trees under the maximal-disjoint-subtree puncturing rule. Every other rule and
    shape is out of scope and is named as such, with the incomplete-tree family serving as the nearby-object
    control rather than as an extension.
  - Uniform hidden sets for the expectation. A non-uniform hidden set induced by a real challenge
    derivation changes the expectation but not the worst case, and the record states which of its
    two forms survives that change.
  - Bytes are proportional to revealed-node count with a constant seed length. Where packing differs,
    the linear functional changes and both forms scale together, leaving the gap ratio invariant.
  - Elementary counting suffices and no asymptotic approximation is used anywhere; every stated form
    is exact, and the verification harness would catch a Stirling-style slip immediately.
  - The two readings of a size claim in part (B) exhaust the intended cases. If a third reading exists,
    the audit is incomplete and the record says so rather than forcing a classification.
  predictions:
  - metric: exhaustive-enumeration agreement with the worst-case closed form at L up to 64, t up to
      4
    direction: lower
    minimum_effect: 0
  - metric: exhaustive-enumeration agreement with the expectation closed form at the same range
    direction: lower
    minimum_effect: 0
  - metric: worst case minus expectation at L equal to 256, t equal to 4, in revealed nodes
    direction: higher
    minimum_effect: 1
  - metric: failure of the complete-tree worst-case formula on the incomplete-tree null
    direction: higher
    minimum_effect: 1
  minimal_test:
    design: Derive both closed forms on paper, with zero compute, and write them down before any code
      exists. Then write a 60-line harness that, for L in {4, 8, 16, 32, 64} and t in {1, 2, 3, 4},
      enumerates every hidden set, computes the revealed-node count by the maximal-disjoint-subtree
      rule, and reports the exhaustive maximum and the exhaustive mean. Require exact agreement with
      both closed forms at every cell; a single mismatch is the deliverable and localizes the error
      in the derivation. Then run the same harness on an incomplete-tree family, at matched leaf counts
      with declared imbalance, and record by how much the complete-tree formulas fail. Then run the
      random-antichain null to confirm the derived counts are not merely generic antichain sizes.
      Seconds of compute, no cryptography, no hash, and the output is a forced value with a demonstrated
      sensitivity to its own hypothesis.
    controls:
    - 'NULL-INCOMPLETE-TREE: the derivation must fail there by a computable amount.'
    - 'NULL-RANDOM-ANTICHAIN: generic antichain cardinality at matched size, confirming the derived
      counts are not generic.'
    - Exhaustive enumeration at L up to 64 as the verification harness for both closed forms.
    - t equal to 1, where the worst case and the expectation coincide exactly at the tree depth, a
      degenerate cell both forms must reproduce.
    - t equal to L, where the revealed count is exactly zero and both forms must vanish.
    required_metrics:
    - worst-case closed form value per (L, t)
    - expectation closed form value per (L, t)
    - their exact difference and ratio
    - exhaustive maximum and mean per (L, t) at L up to 64
    - signed mismatch between closed form and enumeration, required zero
    - failure magnitude of the complete-tree formula on each incomplete-tree family member
    - random-antichain cardinality at matched size
  falsification_conditions:
  - Exhaustive enumeration disagrees with the worst-case closed form at any cell, falsifying claim
    (A)'s worst-case half.
  - Exhaustive enumeration disagrees with the expectation closed form at any cell, falsifying the
    other half.
  - Worst case equals expectation for some t at least 2 and L at least 4, so there is no gap and the
    quantifier-order audit in claim (B) has nothing to measure.
  - The complete-tree formulas remain correct on the incomplete-tree null, showing the derivation
    does not use its own completeness hypothesis and the forced value is not forced.
  - The random-antichain null reproduces the derived counts, showing they are generic antichain sizes
    rather than puncturing quantities.
  - The degenerate cells t equal to 1 or t equal to L are not reproduced by the general forms.
  confounders:
  - A worst-case argument that quietly assumes t is a power of two, making the maximal-spread configuration
    available when it may not be. Mitigated by including non-power-of-two t in the verification harness
    and by stating the overlap correction's exact validity range.
  - An expectation derived by linearity that double counts nodes revealed for more than one reason.
    Mitigated by the exhaustive mean check, which would catch it immediately.
  - Choosing an incomplete-tree family so unbalanced that the failure is trivial and the control proves
    nothing. Mitigated by sweeping imbalance from one level upward and reporting the smallest imbalance
    at which the formula first fails.
  - 'Interpreting the quantifier-order audit as a statement about anyone''s specification. Prevented
    structurally: the audit takes a form of words as input and no specification is read anywhere.'
  interpretation_limits:
  - The closed forms hold for complete regular trees under the declared puncturing rule with uniform
    hidden sets, and demonstrably fail elsewhere, which is the point of the control rather than a
    caveat.
  - The quantifier-order audit classifies hypothetical statements. It makes no claim about what any
    scheme states, since no specification has been read.
  - The gap between worst case and expectation is an accounting quantity with no security content;
    exceeding a budget is not modelled as an event with any consequence.
  - Elementary counting is not novel mathematics, and the contribution is the availability of the
    forced value before an experiment is proposed, not the derivation itself.
  target_complexity:
    time_exponent: No attack exponent is claimed. The derivation is zero compute; the verification
      harness is O(C(L,t) times t times depth) at L up to 64.
    memory_exponent: No attack exponent is claimed. Memory is negligible.
    best_known: The incumbent is whatever fixed opening-size allowance an accounting assumes, which
      within this repository appears only as the filter inequality described in IDEA-20260805-38048d.
      No external incumbent is asserted.
    hidden_overhead: 'Hidden in the lower-order terms is the overlap correction: it is zero in a clean
      range and nonzero outside it, and an accounting that drops it is right until it suddenly is
      not. Human cost hides in the quantifier-order audit, which is a reading exercise that reviewers
      may reasonably regard as pedantry until the gap it measures is put next to it.'
  dominated_by: n/a (no result claimed). All frontier rows were checked; this record places no point
    on time, memory or queries, since it is a counting derivation with no attack and no instance.
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part (A), that both closed forms are correct and reproduce exhaustive
    enumeration exactly: 0.7 for the expectation, which is a routine linearity argument, and 0.55
    for the worst case, where the overlap correction is the likely place a slip hides and the harness
    is likely to catch one. Part (B), that the quantifier-order audit is decidable from whether a
    maximum or a mean is quoted: 0.6, since a third reading may exist. Part (C), that the incomplete-tree
    control makes the derivation fail by a computable amount: 0.8, near-structural. The whole record
    surviving with all three parts intact: roughly 0.3, and the most likely partial outcome is a corrected
    worst-case form after the harness disagrees.'
