idea:
  id: IDEA-20260807-1f5f89
  question_id: RQ-MLKEM-001
  added: '2026-08-07'
  title: >-
    The decapsulation-key field-integrity defect class and its forced two-bit
    signature: a key-mutation generator that reaches dk's H(ek) and z fields,
    which GOAL-MLKEM-002's ciphertext-only generator provably cannot
  class: control

  claim: >-
    FIPS 203's decapsulation key dk = dk_PKE || ek || H(ek) || z carries two
    fields -- the stored hash H(ek) (32 bytes) and the implicit-rejection seed
    z (32 bytes) -- that a ciphertext-mutation-only defect generator
    (GOAL-MLKEM-002's incumbent gate) cannot exercise, because their defects
    have an identically empty silent set under every ciphertext mutation. A
    key-mutation generator that flips one byte of dk at a time and records the
    2-bit signature (a_i = output changes on a valid ciphertext, r_i = output
    changes on an invalid ciphertext) is predicted to produce a forced,
    parameter-set-independent 4-row table: dk_PKE and the ek copy and H(ek)
    read (1,0) for every byte; z is the UNIQUE region reading (0,1), with
    cardinality exactly 32 at every ML-KEM parameter set. Consequently: a
    z-region reading (0,0) identifies a static-implicit-rejection defect
    class; an H(ek)-region reading (0,0) identifies a build that ignores the
    stored hash; and a (0,1)-count other than 32 identifies a field-offset
    error. This is a generator's power against a NAMED defect class with a
    closed-form forced signature; no production implementation is named, no
    defect is asserted to exist, and a null result is not a correctness
    proof. sota_delta 0.

  mechanism: >-
    GOAL-MLKEM-002's gate mutates the CIPHERTEXT, so a defect confined to
    key-material handling (a wrong dk offset, a recomputation that silently
    succeeds, a build that returns a constant on rejection, a build that never
    reads z) is invisible to it by construction -- a different defect
    mechanism class from re-encryption comparison completeness. Decapsulation
    reads H(ek) only inside (K-bar, r) = G(m' || h) and reads z only inside
    J(z || c) on implicit rejection; mutating the corresponding dk bytes and
    observing whether decapsulation output changes, separately on a valid and
    an invalid ciphertext, therefore forces the 2-bit signature per byte
    index. The theorem-level content is that the z region's cardinality (32)
    and its unique (0,1) signature are forced by the FIPS 203 definition, not
    fitted, so the census is a closed-form known-answer check rather than a
    statistical one.

  novelty_status: unverified

