  disposition: proposed
  disposition_note: >-
    Initial ledger recording of a proposal that already passed an internal,
    non-ledger idea-catalogue dedup pass and a red-team adversarial pass
    (REDTEAM.md section 4c, "STRONGEST -- entries I could not break", item 2;
    the forced 4-row table was independently re-derived there, including that
    the z-constant positive control is invisible to the incumbent ciphertext
    generator BY CONSTRUCTION, which is exactly what KN-TECH-054 requires).
    It has NOT yet had independent ledger-level review (VAL-*/RT-* against a
    committed run), so disposition is `proposed`, not accepted, and no
    experiment attached to it may execute until separately approved.

  interpretation_limits:
    - >-
      This delivers a generator's power against a named defect class with a
      forced closed-form signature; a null result (every conforming build
      reads the forced table) is not a correctness proof for any
      implementation, named or unnamed, and is never to be reported as one.
    - >-
      No attack, no key recovery, no timing channel, and no chosen-ciphertext
      oracle beyond the decapsulation interface FIPS 203 already exposes; the
      instrument is a mutation-and-observe harness over dk bytes, not a side
      channel.
    - >-
      This proposal does not touch and does not contradict GOAL-MLKEM-005's
      proven convexity ceiling G <= log2 M; it concerns implementation-level
      key-field integrity, a wholly different mechanism class from best-of-M
      lattice attacks, and claims no exponent-level or M-dependent gain.
    - >-
      Adequacy of the interposition instrument is admitted only under the
      already-committed discipline (GNU ld --wrap, linux/amd64), not dlopen
      and not a call-site macro (EV-MLKEM-010); a result obtained under a
      different interposition mechanism is out of scope for this record.

