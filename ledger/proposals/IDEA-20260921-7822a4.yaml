idea:
  id: IDEA-20260921-7822a4
  id_allocation_provenance: >-
    Minted by the top-level coordinator session with `python3
    tools/allocate_id.py --next idea --date 20260921` and confirmed free with
    `--check` on 2026-09-21. Not derived by scanning state. Authored under the
    idea-generator role contract (agents/idea-generator.md, read in full
    before generation) in the coordinator's session: the dedicated
    idea-generator runtime agent failed its environment bootstrap (AWS
    DescribeInstances AuthFailure) on three consecutive dispatch attempts and
    a general-runtime dispatch of the same handoff was cancelled before
    producing files. A runtime substitution under the interchangeable-runtimes
    clause of AGENTS.md, recorded here honestly; the handoff, objective,
    write scope, and object-frame constraints were TASK-20260921-IDEAS against
    RQ-CRYPTO-001 as dispatched.
  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    THE IMPLICIT-MEMBERSHIP CLASS CAN BE CLOSED BY CHARGING THE ORACLE: in
    the model where the factor base F subset of G is accessible ONLY through
    a membership oracle (one query = one charged membership test) alongside
    the generic group operations, any algorithm that solves a uniformly
    random ECDLP instance while using only Q oracle queries and T generic
    operations has success probability at most
    (Q choose m) * (m/n) + O(T^2/n^2) -- so beyond the generic rho floor
    T = Omega(n^{1/2}), an m-relation algorithm must pay
    Q = Omega((pn)^{1/m}) oracle queries, and since each query is a charged
    membership test this converts KN-OPEN-020's IMPLICIT-MEMBERSHIP open
    class from 'unpriced' into 'priced at max(n^{1/2} generic,
    (pn)^{1/m} charged tests)' -- the first closure of one of the three open
    classes, by a counting argument whose every constant is measurable on
    toys.
  class: mechanism
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): the representation is class R1
    of RQ-ECDLP-623a32 only in the trivial carrier sense (the group elements
    themselves; no coordinate structure is used -- the model is deliberately
    representation-free), and the attack stage whose charged cost it bounds
    is FACTOR-BASE MEMBERSHIP (the description/membership cost column of
    every index-calculus cost model). CLAIM: in the oracle-described factor
    base model -- F an arbitrary subset of the prime-order group G given
    only by a membership oracle, every query charged, generic group
    operations charged -- no algorithm solves a uniformly random instance
    with probability better than max over strategies of
    O((Q^m / n) + (T/n)^2) where Q is the number of membership queries and
    T the number of generic operations; consequently the implicit-membership
    class of KN-OPEN-020 admits no sub-rho algorithm unless the membership
    tests themselves are cheaper than generic operations by a factor that
    the model prices explicitly, and the class's charged-cost floor is
    stated as a theorem-shaped obligation with a complete proof search map.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the relation m-tuple over
    the oracle-described base F; the operation set Sigma it must survive is
    the union of the generic group operations and the membership oracle --
    a PARTIAL-ACTION frame exactly as index calculus is Class I of
    IDEA-20260806-c5d183: the relation vector is built from elements whose
    membership is oracle-verified, and nothing about the tuple propagates
    under translation beyond what the generic operations carry. What the
    model discards is ALL structure of F except its oracle: the theorem is
    blind to whether F is smooth-curve points, small-height points, or an
    adversarially structured set -- and that blindness is a FEATURE here,
    because it is what makes the bound uniform over the entire
    implicit-membership class.

    THE COUNTING ARGUMENT IN ONE PARAGRAPH. An m-relation for target Z is an
    m-tuple (f_1, ..., f_m) of F-elements with f_1 + ... + f_m = Z. The
    algorithm can only USE F-elements it has verified: each verified element
    costs at least one membership query, so after Q queries at most Q
    distinct F-elements are known (adversarially chosen, which the bound
    must survive). Every candidate m-tuple of known elements must be summed
    by m-1 generic operations and checked against Z, so T >= (number of
    tuples examined). The number of m-tuples from the known set that sum to
    the uniformly random Z is, in expectation over Z, at most
    (Q choose m)/n * (maximum multiplicity correction): for a FIXED known
    set A with |A| <= Q, the map tuple -> sum is at most |A|^m-to-1 onto its
    image, and the random Z hits the image of the sum-map with probability
    at most #sums(A)/n <= min(|A|^m, n)/n; conditioned on hitting, finding
    the tuple costs the generic search. The rho-style second term (T/n)^2
    covers collision-type strategies that bypass tuples. The bound is the
    sum. The proof obligations below decompose exactly this sketch into
    baseline, feasibility, strictness, runtime, memory, correctness, and
    success-probability lemmas.

    WHY THIS IS THE RIGHT NEXT STONE. KN-OPEN-020 scoped out bounded-degree
    algebraic descriptions and named three open classes: high-degree
    (IDEA-20260921-ffd330 tests its testable member), implicit-membership,
    and target-dependent. The ICEX lane's hypotheses already forbid
    'uncharged membership oracles' as a matter of contract hygiene; this
    record is the positive-complement move: CHARGE the oracle, and the class
    either closes or its escape is localised to the exact place a
    membership test can be cheaper than a generic operation -- which is
    itself a representation claim that RQ-ECDLP-623a32's audit battery then
    prices. The argument requires no unproved heuristic: it is a counting
    bound in an explicitly defined model, in the same tier as the bounded-
    degree theorem's tuple-image counting, and it composes with that theorem
    toward the universal statement KN-OPEN-020 asks for.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        The universal algebraic-factor-base no-go: bounded-degree plane
        polynomial predicates are scoped out with charged costs (Bezout
        factor-base bound 3d or Delta, tuple-image target bound B^m,
        charged-trial descent lower bound Omega(N/B^m)); the open classes
        are high-degree, implicit-membership, and target-dependent.
      verified_by: "coordinator session, read of the statement and the conditional-obstruction section on 2026-09-21"
    - ref: bounded_degree_factor_base_theorem (ideas/artifacts/IDEA-20260801-021)
      provenance: internal
      claim: >-
        The derivation-level obstruction this record's proof composes with:
        the counting architecture (Bezout bound on the base, tuple-image
        bound on reachable targets, charged-trial descent bound) whose
        oracle-model analogue is proposed here.
      verified_by: "coordinator session, cited via KN-OPEN-020's statement read on 2026-09-21; artifact not re-opened"
    - ref: H-ICEX-625baf
      provenance: internal
      claim: >-
        The ICEX lane's hypotheses forbid 'uncharged membership oracles' and
        free End(E) authority in any index-calculus exclusion claim; this
        record takes the charging obligation as its subject.
      verified_by: "coordinator session, grep-level read of the record's boundary list on 2026-09-21"
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        The I/II/III trichotomy; index calculus is Class I partial-action.
      verified_by: "coordinator session, cited via docs/object-frame-ideation.md section 1 read in full on 2026-09-21"
    - ref: Shoup 1997 (generic lower bound for discrete logs)
      provenance: recalled
      claim: >-
        The n^{1/2} generic-group lower bound whose model this record
        extends with a charged membership oracle. RECALLED, NOT OPENED: the
        program's own corpus states the generic bound in many records; a
        reviewer should chase the original only for the exact constant.
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: the model bounds family-F2 attacks
      (factor-base decomposition) in the membership-cost column; what is
      added is the oracle model itself and its counting bound, not a
      decomposition method. F7 (preprocessing advice listing F verbatim) is
      OUT of model scope by construction and is the named nearby-object
      control below.
    - >-
      The membership oracle answers truthfully and in unit charged cost;
      a lying or batched oracle is out of scope and is recorded as such
      rather than silently absorbed.
  proof_search_map:
    bottleneck: >-
      The implicit-membership class of KN-OPEN-020 is unpriced: no result
      bounds what an arbitrary oracle-described factor base can achieve once
      every membership test is charged. The bottleneck is exactly the
      absence of a charged-query lower bound to compose with the existing
      bounded-degree no-go.
    baseline_embedding:
      parameter_slice: >-
        With the oracle suppressed (Q = 0, F unused), the model must reduce
        to the classical generic group model and reproduce the standing
        rho floor T = Omega(n^{1/2}) as its second term -- the exact
        parameter slice the bound must embed.
      reproduction_check: >-
        Symbolic check: setting Q = 0 in the bound leaves
        O((T/n)^2) = Omega(1) at T = n^{1/2}, matching the generic floor;
        the proof note must show this substitution explicitly, and a small
        simulation must reproduce the (T/n)^2 curve for a pure-generic
        solver on relabelled Z/nZ at n = 2^{12}, 2^{14}.
    observation_collision:
      observable: >-
        The success probability of a Q-query, T-operation algorithm on a
        uniformly random instance, as a function of (Q, T, m).
      distinct_preimage_search: >-
        Two oracles describing DIFFERENT sets F, F' with |F| = |F'| = B must
        produce indistinguishable curves -- the bound is blind to F's
        structure by construction. The collision to search for is a
        STRUCTURED F whose verification cost is genuinely subunit (e.g.
        membership checkable in O(1) field operations by a closed
        predicate): such an F exits the oracle model through the pricing
        gap, and the proof must state this exit as the model's boundary,
        not as a failure of the bound.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The oracle-described factor-base attack reduced to a generic
          tuple-sum search over a Q-sized known set, so that the standing
          generic bounds apply verbatim once the reduction is stated.
        predicted_gain: >-
          Converts an unpriced open class into a priced one; no algorithmic
          gain claimed -- the gain is closure standard (inventor-protocol
          section 4).
      - transform: observable_fiber
        proposed_object: >-
          The fiber of the sum-map on m-tuples of the known set, whose
          expected occupancy on a random target is the success-probability
          term Q^m/n.
        predicted_gain: >-
          Gives the measurable constant: the tuple-sum hit rate on random
          targets, samplable on toys, which calibrates the hidden constant
          in the bound.
    quantifier_order: >-
      FOR EVERY algorithm A (deterministic or randomised, adaptive),
      FOR EVERY oracle-described F subset of G, FOR a uniformly random
      instance (P, Z): Pr[A solves] <= O((Q(A)^m / n) + (T(A)/n)^2), where
      Q(A), T(A) are A's charged query and operation counts. Note the order:
      the bound is uniform in F, which is what makes it a CLASS closure
      rather than a per-base statement; and the instance is randomised AFTER
      A and F are fixed, so adaptivity cannot precondition on Z.
    method_ceiling:
      strongest_certifiable_claim: >-
        The implicit-membership class of KN-OPEN-020, under the oracle model
        with unit-charged truthful membership tests, admits no algorithm
        beating max(n^{1/2} generic operations, (pn)^{1/m} charged
        membership tests) on random instances, with explicit constants. It
        does NOT cover: computable closed-form membership predicates (the
        bounded-degree and high-degree classes -- priced elsewhere),
        target-dependent descriptions, preprocessing advice, or oracles
        cheaper than unit cost. The universal statement remains open even
        if this closes.
      nearby_object_control: >-
        PROVES-TOO-MUCH control (mandatory): run the argument against the
        F7 advice object -- a precomputed string listing F verbatim, charged
        by length B. The argument must NOT close F7 below the existing
        tuple-image bound n/B^m: with the advice string, Q is replaced by B
        at zero per-element query cost, and the bound must degrade exactly
        to the KN-OPEN-020 counting statement, not below it. If the
        argument as written also killed F7 advice-based attacks at
        Q = 0, it proves too much and is wrong somewhere.
    proof_obligations:
      - claim: >-
          FEASIBILITY. The oracle model is well-defined: adaptive algorithms,
          truthful oracle, unit charge per query, generic operations charged,
          and the instance randomised after fixing A and F.
        responsibility: feasibility
      - claim: >-
          BASELINE. With Q = 0 the bound embeds the classical generic
          floor T = Omega(n^{1/2}) exactly.
        responsibility: baseline
      - claim: >-
          STRICTNESS. The known-set bound: after Q queries at most Q distinct
          F-elements are usable, and adaptive query choice cannot increase
          the usable set -- a counting lemma with an explicit multiplicity
          constant.
        responsibility: strictness
      - claim: >-
          SIZE. The tuple-fiber bound: for a fixed usable set A, |A| <= Q,
          the expected number of m-tuples summing to a uniform Z is at most
          C_m * |A|^m / n with C_m explicit (multiplicity of the sum-map).
        responsibility: size
      - claim: >-
          RUNTIME. The charge schedule: each examined tuple costs m-1
          generic operations, so tuple examination is subsumed in T; the
          bound's two terms are jointly exhaustive over tuple and
          collision strategies.
        responsibility: runtime
      - claim: >-
          MEMORY. Stored tuples and known elements are charged as memory,
          and the (T/n)^2 term already accounts for collision strategies
          that trade time for stored states (van Oorschot-Wiener shape); the
          memory-tradeoff interpolation is stated or the bound is
          memory-light only.
        responsibility: memory
      - claim: >-
          CORRECTNESS. A solver must output a relation or the discrete log;
          both forms reduce to the tuple-fiber or collision events bounded
          above (no third channel exists in the model).
        responsibility: correctness
      - claim: >-
          SUCCESS PROBABILITY. Union of the two event bounds gives the stated
          probability; the constant is calibrated by the toy simulation.
        responsibility: success_probability
      - claim: >-
          INTERFACE. Composes with the bounded-degree theorem: algebraic
          descriptions (computable membership) and oracle descriptions
          (charged membership) are disjoint class covers of explicit-cost
          membership; together they leave exactly the target-dependent
          class open.
        responsibility: interface
      - claim: >-
          SCOPE. The closure claims nothing about instances that are not
          uniformly random, and nothing about oracles with subunit or
          batched pricing.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        simulated success probability of a Q-query tuple solver on
        relabelled Z/nZ at n = 2^{12}-2^{16}
      direction: lower
      minimum_effect: >-
        Empirical curve matches C_m * Q^m/n + (T/n)^2 within sampling error,
        with the fitted C_m in a stated range; this is the constant's
        calibration, and a mismatch localises to the multiplicity lemma.
    - metric: Q = 0 pure-generic simulation curve
      direction: lower
      minimum_effect: >-
        Reproduces the classical (T/n)^2 generic-discrete-log success curve
        -- the baseline embedding made executable.
  minimal_test:
    design: >-
      Two-part: (1) a proof note (derivation-level artifact in the style of
      the bounded-degree theorem) carrying the nine obligations above as
      numbered lemmas with the Q = 0 substitution explicit; (2) a toy
      simulation: relabelled Z/nZ generic group at n in {2^{12}, 2^{14},
      2^{16}}, an oracle-described random F of size B = 2^{n/8}-scale, a
      Q-and-T-budgeted tuple solver and a collision solver, success
      probability over >= 10^4 random instances per (Q, T) grid point,
      fitted against the bound with C_m as the single free constant.
    controls:
      - Q = 0 slice (pure generic, baseline embedding)
      - >-
        F7 advice control: the same solver handed the F-listing verbatim at
        charged length B, which must reach the tuple-image rate ~ B^m/n and
        NOT be bounded below it -- the proves-too-much control
      - >-
        identity oracle (F = G): membership free in effect, bound must
        degrade to the generic statement
      - >-
        structured F (interval images under the labelling): must read
        indistinguishably from random F at equal B -- the bound's blindness
        verified rather than assumed
    required_metrics:
      - empirical success probability per (Q, T) grid point with 95%
        intervals
      - fitted C_m with confidence band
      - the advice-control's achieved rate vs B^m/n
  falsification_conditions:
    - >-
      The simulation finds a (Q, T)-budgeted strategy beating the bound
      beyond sampling error at any grid point: the counting argument has a
      hole (the most likely candidate is a batched-verification or
      amortised-membership channel), and the model or lemma at fault is
      named and the proposal is withdrawn or repaired in a superseding
      record.
    - >-
      The advice control is ALSO bounded by the oracle bound (the argument
      proves too much): the charge-schedule lemma is wrong as written; same
      consequence.
    - >-
      Any lemma resists derivation-level proof (the multiplicity lemma's
      constant is the likely one): the claim is downgraded to the fragment
      the lemmas support, with the open fragment named -- never silently
      retained at full strength.
  confounders:
    - >-
      amortised membership tests (one query verifying several candidate
      elements, e.g. by summing and testing the sum) -- the model must
      either forbid batch queries or price them; the proof note must pick
      and justify, and the simulation must implement the same choice
    - >-
      adaptivity: queries chosen in response to oracle answers could in
      principle concentrate the usable set's sum-fibre on the target; the
      strictness lemma exists to forbid exactly this, and the simulation's
      adaptive-solver row tests it
    - >-
      the random-instance quantifier: a fixed (worst-case) target voids the
      uniform-Z term, and the scope clause exists to prevent that silent
      generalisation
  interpretation_limits:
    - >-
      KN-OPEN-020 CLASS, DECLARED: implicit-membership, under a unit-charged
      truthful oracle. High-degree and target-dependent classes are NOT
      covered; computable closed-form membership is covered by the
      bounded-degree theorem and its open high-degree extension, not here.
    - >-
      This is a lower-bound / closure-standard contribution: it makes no
      attack faster, and a positive proof outcome closes a class rather
      than opening a lane. Its resource_check: the pricing gap it exposes
      -- membership tests cheaper than generic operations -- is exactly the
      hypothesis a closed-form-membership representation proposal
      (RQ-ECDLP-623a32 lane) should be read against; the obstruction is an
      asset to that lane.
    - >-
      The bound is over uniformly random instances only; worst-case-instance
      statements are explicitly out of scope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE REQUIRED ABOVE DERIVATION LEVEL. The bound is a counting
        statement in an explicitly defined model; the only probabilistic
        ingredient is the uniformity of the challenge instance, which is a
        definition, not an assumption. Listed here only to declare the
        absence: no distributional heuristic is imported, and the toy
        simulation calibrates a constant, it does not validate a heuristic.
      rigorous_support: >-
        The architecture is the same as the bounded-degree theorem's
        tuple-image counting (combinatorial, model-internal), extended with
        a charged oracle; the generic second term embeds the standing
        generic-group bound as its baseline.
      validation_plan: >-
        The minimal test's simulation is the validation: empirical curves
        against the closed-form bound with C_m fitted once and then
        PREDICTED (not refitted) on held-out grid points; tail check: the
        largest-Q grid point must not systematically overshoot the
        prediction.
  target_complexity:
    time_exponent: >-
      Not an algorithm: the result, if proved, is the charged floor
      max(n^{1/2} generic operations, (p*n)^{1/m} charged membership tests)
      for the implicit-membership class. The floor's own derivation and
      calibration cost: a proof note plus hours of single-core simulation.
    memory_exponent: >-
      Addressed as an obligation: the collision term is stated in
      van Oorschot-Wiener time-memory form or the bound is declared
      memory-light-only; the proof note must pick one and say so.
    best_known: >-
      Pollard rho n^{1/2} generic (the baseline the floor embeds); the
      bounded-degree no-go for algebraic bases (the interface partner).
    hidden_overhead: >-
      Constants C_m (sum-map multiplicity) and the collision constant are
      the entire hidden content -- both fitted, both stated, no o(1)
      language anywhere in the claim.
    tradeoff_note: >-
      The floor itself is a time-vs-query tradeoff frontier
      (Q vs T); mapping it is part of the deliverable, since the frontier's
      shape is what a would-be escape must beat.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
