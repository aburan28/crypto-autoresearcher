  assumptions:
  - G has prime order N; features and operation family are fixed without scalar-dependent advice.
  - State description, feature evaluation and conditional-kernel access are charged; average and worst-history defects
    are distinct.
  - The kernel laws nu and mu_l and private randomness are fixed before fixtures; the only history is the declared
    label/feature transcript. A complete state table is allowed for the finite audit and is charged; compactness
    beyond it remains unproved.
  predictions:
  - metric: Restricted-mixture delta; public per-operation maximum and public-label averaged defect; fiber sizes
      and description bits
    direction: different
    minimum_effect: Restricted-mixture delta may differ from the cell-size matched null. Hidden uniform translations
      force zero for every partition; all public translations force binary maximum 1 on nontrivial lossy prime-order
      partitions. No monotone increase of the hidden-mixture defect is predicted.
  minimal_test:
    design: 'Prospective finite-table diagnostic on supplied visible cyclic-group fixtures of orders 11 and 17 and
      cosets of Z/15: freeze t, labels nu and private mu_l before comparing partitions. Compare a restricted hidden
      translation mixture, singleton public operation labels and the hidden uniform full-translation boundary separately.
      No arbitrary adaptive-history grammar is certified and no experiment runs in this task.'
    proposal_only: true
    controls:
    - type: matched_null
      description: Random balanced partitions with identical cell sizes and operation count.
    - type: known_false
      description: A nontrivial coset quotient of Z/15 has exact propagation and must evade any prime-order rigidity
        conclusion.
    required_metrics:
    - Restricted-mixture delta; public per-operation maximum and public-label averaged defect; fiber sizes and description
      bits
    - construction work, peak bytes, certificate size
    required_artifacts:
    - Exact fixtures
    - Independent certificates
    - Complete controlled outputs
    stopping_rule: First exact contradiction or stated finite panel; missing prerequisites and limits are inconclusive.
      No execution in this task.
  falsification_conditions:
  - A collision inside a fiber yields contradictory next-feature laws after a permitted history, or kernel size
    grows to the complete state table.
  confounders:
  - Hidden instance-dependent choices; omitted verification or representation costs.
  interpretation_limits:
