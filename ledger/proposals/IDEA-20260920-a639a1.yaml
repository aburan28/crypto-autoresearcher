idea:
  id: IDEA-20260920-a639a1
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: Symmetrization-aware Gaudry cost audit of EcGFp5 and EcMasFp5 (n = 5, m = 5)
  class: measurement
  claim: >-
    The EcGFp5 design note's ">= 2^142" security floor against Gaudry's index
    calculus is computed for the RAW descended system (ideal degree D ~ 2^20,
    per-system floor D^2 ~ 2^40). The curve's own rational 2-torsion point enables
    the (Z/2)^4 x| S_5 symmetrization of FGHR/FHJRV, under which solutions form
    orbits of size 1920 ~ 2^10.9 and the symmetrized ideal degree is ~2^9. The
    corrected band is ~2^121 (D^2 floor) to ~2^132 (nominal 5*D^3 FGLM) for
    EcGFp5, and ~2^129 to ~2^144 for prime-order EcMasFp5 (S_5 only, |G| = 120).
    The 128-bit claim is inside the band for EcGFp5. This proposal measures D and
    the per-PDP operation count per arm at n = 5 on a toy-p ladder, verifies that
    D is p-independent, and reports the resulting concrete cost at p = 2^64 next to
    the design note's number. No break is claimed; "128 still holds, floor was
    loose by ~11 bits" is an admissible outcome.
  mechanism: >-
    Gaudry: factor base F = {P in E(F_{p^5}) : x(P) in F_p}; decompose R as a sum
    of 5 factor-base points by solving S_6(x(R), x_1..x_5) = 0 after Weil
    restriction to F_p (5 equations, 5 unknowns, degree 16 per variable). Arm (i)
    solves that system as is. Arm (ii) rewrites it in elementary symmetric
    functions of x_1..x_5 (S_5 acts on solutions; degree drops by 5!). Arm (iii),
    EcGFp5 only: translation by the 2-torsion point (0,0) on y^2 = x(x^2+2x+b) is
    x -> b/x; it commutes with negation, so the factor base is closed under it and
    the summation polynomial is a polynomial in t_i = x_i + b/x_i; an even number
    of translations fixes the sum, giving the extra (Z/2)^4. The ideal degree of
    the descended system is generically |G| times smaller, and FGLM cost scales
    with D^2 to D^3. D is a property of n and the symmetrization, not of p, so it
    is measured at toy p and carried to p = 2^64 by counting systems, not time.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: >-
      Opened from the Galbraith ECC-2015 slide review: the complement of "prime
      n > 160 is immune" is the deployed n = 5 regime. Lead identified in
      conversation 2026-09-20; arithmetic in
      research/gfp5_deployed_curves_20260920.md.
    overlap_review: >-
      RQ-ICPERF-94c86e already lists F_{p^n}, n in {2,3,5}, as a measurement
      family and owns the phase-table machinery; this proposal reuses that
      machinery but has a different decision target (a per-curve security claim
      on deployed parameters, per symmetrization arm) and a different scale
      transfer (D-flatness along p). IDEA-20260918-7a11c2 measures torsion
      quotient coordinates on prime-field toys; arm (iii) here is the n = 5
      extension-field instance of the same 2-torsion mechanism, not a new
      mechanism. No existing record names EcGFp5 or EcMasFp5.
  citations:
    - ref: https://eprint.iacr.org/2022/274.pdf
      provenance: recalled
      claim: >-
        Pornin, EcGFp5 (2022): with k = 5, Gaudry's attack entails ~p^{2-2/5} ~
        2^102.4 systems of 5 equations in 5 unknowns of degree 2^{k-1} = 16;
        FGLM at O(kD^3) with D ~ 2^{k(k-1)} = 2^20; "unlikely to go below O(D^2)
        ~ 2^40"; total "at least 2^142"; Joux-Vitse variant O(Cp^2) "again above
        128". Read in full this session; not yet frozen under inputs/.
    - ref: https://hackmd.io/@Wimet/S1R3RAY5yx
      provenance: recalled
      claim: >-
        Polygon Hermez (2025): EcMasFp5, y^2 = x^3 + 3x + 8z^4 over the same
        F_{p^5}, 320-bit prime order, cofactor 1, twist security 101.93 bits;
        "we inherit by default its security ... approximately 142-bit". Not yet
        frozen.
    - ref: https://eprint.iacr.org/2010/157
      provenance: recalled
      claim: >-
        Joux-Vitse, ECDLP over small degree extension fields: relations obtained
        on E(F_{p^5}); F4 variant removing reductions to zero; symmetrized
        systems via elementary symmetric functions. Not yet frozen.
    - ref: research/equation-schemes-20260905/retrieved-pages/hal-00935050.txt
      provenance: recalled
      claim: >-
        FHJRV, Symmetrized summation polynomials (EUROCRYPT 2014): 2-torsion
        focus, up to the 8th symmetrized summation polynomial computed, new
        relation timings at degree-5 extension fields. Text is already retrieved
        in the repository; the executor must read it before scoring the arm-(iii)
        prediction.
    - ref: Faugere-Gaudry-Huot-Renault, Using symmetries in the index calculus for elliptic curves DLP, J. Cryptology 2014
      provenance: recalled
      claim: >-
        The (Z/2)^{m-1} x| S_m action on decompositions and its effect on the
        Groebner step. Not frozen.
  citation_note: >-
    Every citation is recalled from this session's reading, so novelty_status is
    unverified and the first executor task is to freeze SRC-* packages for
    ePrint 2022/274, ePrint 2010/157, the FHJRV/FGHR pair and the Hermez note.
  assumptions:
    - Public parameters only; every DLP instance has a generator-known scalar.
    - Same targets, same solver (msolve or Macaulay2 F4 + FGLM over F_p) across arms.
    - D is p-independent for large p; verified, not assumed, across >= 3 toy primes spanning >= 12 bits.
    - Orbit non-freeness is measured: report D_sym * |G| / D_raw per arm and cell.
    - Per-PDP cost is charged as F_p operations including construction of symmetrized polynomials and lifting orbit representatives back to points.
    - Number of systems and linear-algebra size at p = 2^64 follow Gaudry's double-large-prime balancing as stated in the design note; any other balancing is a separate arm.
  proof_search_map:
    bottleneck: >-
      Whether the symmetrized ideal degree really falls by ~|G| at m = 5 and what
      the actual FGLM exponent (2 vs 3) is on these systems.
    baseline_embedding:
      parameter_slice: >-
        n = 3 and n = 4 first, where Joux-Vitse and FHJRV report timings, to
        reproduce a known relation rate before any n = 5 cell.
      reproduction_check: >-
        Reproduce one published n = 4 decomposition timing within 2x before
        trusting the n = 5 numbers.
    observation_collision:
      observable: >-
        D per arm (FGLM), F_p operation count per PDP, decomposition success rate
        vs 1/|G|-corrected expectation, and end-to-end cost at p = 2^64.
      distinct_preimage_search: >-
        Random curves with and without a rational 2-torsion point at the same p
        separate "the named curve" from "any curve of this shape".
    constructive_transforms:
      - transform: torsion_symmetrization
        proposed_object: S_6 rewritten in t_i = x_i + b/x_i, then in elementary symmetric functions of the t_i
        predicted_gain: D drops by ~2^10.9 on EcGFp5; per-PDP cost floor from 2^40 to ~2^18-2^30 F_p ops
      - transform: permutation_symmetrization
        proposed_object: S_6 in elementary symmetric functions of x_1..x_5 (EcMasFp5, no 2-torsion)
        predicted_gain: D drops by ~2^6.9; the prime-order curve retains ~4 bits the double-odd curve loses
    quantifier_order: >-
      There exists a preregistered toy-p ladder at n = 5 on which each arm's D
      and per-PDP cost are measured end to end on fresh targets.
    method_ceiling:
      strongest_certifiable_claim: >-
        A concrete cost band at p = 2^64 per curve under a named p-independence
        heuristic, with measured constants; no asymptotic statement.
      nearby_object_control: >-
        Random curves of both torsion types at the same p; n = 4 cells as the
        published-timing anchor.
    proof_obligations:
      - claim: Every accepted decomposition lifts to 5 verified factor-base points summing to R.
        responsibility: correctness
      - claim: D is flat along the toy-p ladder for each arm.
        responsibility: scope
      - claim: Symmetrized-polynomial construction and orbit lifting are charged.
        responsibility: runtime
      - claim: The number of systems and LA size at p = 2^64 are derived from the measured success rate, not from 1/m!.
        responsibility: cost-model
  predictions:
    - metric: ideal_degree_ratio_D_raw_over_D_sym
      direction: higher
      minimum_effect: At least 2^9 on the EcGFp5 arm (iii) and at least 2^6 on the S_5-only arm, in every toy-p cell.
    - metric: full_ecdlp_cost_band_bits_at_p_2_64
      direction: lower
      minimum_effect: Upper edge of the EcGFp5 band below 2^135; the design note's 2^142 floor shown loose by >= 8 bits.
    - metric: D_flatness_across_toy_ladder
      direction: flat
      minimum_effect: D varies by less than 10% across three primes spanning >= 12 bits.
  minimal_test:
    design: >-
      Toy primes p' ~ 2^12, 2^18, 2^24 (and 2^30 if FGLM completes), field
      F_{p'^5} with modulus z^5 - c irreducible. Curves: EcGFp5-shaped double-odd
      curve y^2 = x(x^2 + 2x + c z) with c chosen so the order is 2 * prime;
      EcMasFp5-shaped prime-order curve y^2 = x^3 + 3x + c z^4; one random curve of
      each torsion type. For each: build S_6 (or read it from the FHJRV data), the
      S_5-symmetrized and the (Z/2)^4 x| S_5-symmetrized descended systems; for
      20 fresh targets per cell run FGLM via msolve, record D, F_p operation
      count, success, lifted-and-verified points. Anchor with n = 4 cells against
      published timings. Then compute the p = 2^64 band per arm.
    controls:
      - n = 4 reproduction of a published Joux-Vitse / FHJRV timing within 2x.
      - Random-curve arms of both torsion types at every p'.
      - Degenerate symmetrization (identity) reproduces arm (i) exactly.
      - Orbit-lifting verifier rejects any solution not summing to R on the curve.
    required_metrics:
      - ideal_degree_D_per_arm
      - fp_operations_per_pdp
      - decomposition_success_rate
      - orbit_nonfreeness_ratio
      - D_variation_across_ladder
      - lifted_verified_points_per_success
      - projected_systems_at_p_2_64
      - projected_linear_algebra_cost_at_p_2_64
      - full_cost_band_bits_per_curve
  falsification_conditions:
    - D_sym on arm (iii) is not at least 2^9 below D_raw at every tested p'.
    - D depends on p' by more than 10% across the ladder (extrapolation void).
    - Per-PDP F_p operation count on arm (iii) stays above 2^36, leaving the design note's floor essentially intact.
    - The named curves behave measurably differently from random curves of the same torsion type (then the mechanism is not generic and the claim must be re-scoped).
  confounders:
    - Toy primes so small that the factor base saturates or F_{p'^5} has degenerate 2-torsion structure.
    - FGLM ordering effects; msolve vs Macaulay2 disagreement on D.
    - Counting solutions instead of orbits, or orbits instead of lifted points.
    - Using 1/m! as the success rate instead of the measured one.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - A band that contains 128 is not a break and is reported as "claim inside band".
    - Nothing about curves over other primes or other extension degrees.
  heuristic_assumptions:
    - HEUR-GFPN-DFLAT: the ideal degree of the descended n = 5 PDP system is independent of p for p above a small bound; tested on the ladder.
  heuristic_note: >-
    The whole transfer to p = 2^64 rests on HEUR-GFPN-DFLAT; it is the one thing
    the ladder must establish before any bit count is quoted.
  target_complexity:
    time_exponent: Unknown; the claim is a constant-factor correction of a floor, not an exponent.
    memory_exponent: Unknown; sparse LA at p^{2-2/5} entries is the memory term.
    best_known: Design note's ">= 2^142" (raw system); rho at 2^160.
    hidden_overhead: Symmetrized-polynomial construction, orbit lifting, LA at ~2^102 rows.
    tradeoff_note: A lower per-PDP cost does not change the LA term; the band's lower edge is set by LA once PDP is cheap.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: msolve or Macaulay2 must complete FGLM at m = 5, D ~ 2^13; otherwise the m = 4 fallback only.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured; expected to tighten a published floor, not beat rho.
    memory: Unmeasured.
    data_queries: Not applicable (full DLP).
  frontier_check:
    status: pending
    note: No published concrete estimate for these two curves located this session; a coordinator literature check for post-2022 analyses of EcGFp5 is required before approval.
  recommended_priority: high
  priority_rationale: >-
    Same Semaev/symmetrization/Groebner stack the program already runs, pointed
    at deployed parameters whose advertised margin rests on an uncorrected raw-
    system count; both outcomes are reportable.
  first_deliverable: >-
    Frozen SRC-* packages for the four cited sources, the n = 4 reproduction cell,
    and a three-prime n = 5 ladder contract with arms (i)-(iii).
  next_gate: Coordinator overlap review against RQ-ICPERF-94c86e cells and solver-capacity check at m = 5, then an immutable experiment contract.
