idea:
  id: IDEA-20260920-a639a1
  question_id: RQ-GFPN-4ab8c7
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    n = 5 PDP / symmetrization-arm cost ladder for EcGFp5 and EcMasFp5 against
    the design-note ≥2^142 Gaudry band
  class: algorithm
  claim: >-
    On a toy-p ladder at extension degree n = 5, measuring decomposition degree D
    and per-PDP cost for each named symmetrization arm decides whether each of
    EcGFp5 and EcMasFp5 sits inside or outside the design notes' Gaudry lower
    bound of ≥2^142 (KN-LIT-8aff72) when the same costing model is evaluated at
    the cryptographic p = 2^64 - 2^32 + 1. Provisional intake reading (not
    evidence): EcMasFp5 is the stronger curve under S_5-only symmetrization;
    EcGFp5's rational 2-torsion is what drops its band to meet p = 2^64 —
    confirm or falsify by matched measurement.
  mechanism: >-
    Build Gaudry/Semaev-style point-decomposition instances at n = 5 for both
    curve shapes on an increasing toy-p ladder. Arms: (i) no symmetrization,
    (ii) S_5 / summation-polynomial symmetry only, (iii) arms that exploit
    rational 2-torsion when present (EcGFp5). Record D, relation yield, solver
    degree/matrix size, and complete cost per verified relation. Extrapolate to
    cryptographic p only as arithmetic on a numbered model, never as a run.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: GFPN intake high priority; token a639a1 fixed by user.
    overlap_review: >-
      Distinct from IDEA-20260918-c05e71 (coset typing) and IDEA-20260918-7a11c2
      (torsion quotients): those are deliberately not reopened. This measures
      named symmetrization arms on the two Goldilocks-quintic curves only.
  citations:
    - ref: inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
      provenance: retrieved
      claim: Gaudry attack at k = 5 costed at total theoretical complexity ≥ 2^142.
      verified_by: KN-LIT-8aff72
    - ref: inputs/ECMASFP5-HACKMD-2025/note_fulltext.md
      provenance: retrieved
      claim: EcMasFp5 inherits the ~142-bit field-security claim over the same p^5.
      verified_by: KN-LIT-47d541
    - ref: research/gfpn_ecmas_ecgfp5_intake_20260920.md
      provenance: internal
      claim: Provisional intake band-at-p=2^64 reading and EcMas-stronger hypothesis.
      verified_by: intake note
  citation_note: >-
    The ≥2^142 figure is quotable from the frozen Pornin PDF. The provisional
    "band at p = 2^64" and "EcMas stronger / EcGFp5 2-torsion drops it" readings
    are intake hypotheses, not frozen-source claims.
  assumptions:
    - Generated/public parameters only; both design curves and toy-p analogues.
    - Symmetrization arms are named and identical across curves where defined.
    - Timeouts are infrastructure, not mathematical negatives.
    - Extrapolation to cryptographic p is model arithmetic with numbered assumptions.
  proof_search_map:
    bottleneck: Whether rational 2-torsion changes the n = 5 PDP band enough to meet p = 2^64.
    baseline_embedding:
      parameter_slice: Pornin Gaudry costing assumptions at k = 5.
      reproduction_check: Re-derive the ≥2^142 arithmetic from KN-LIT-8aff72 before new cells.
    observation_collision:
      observable: D and complete cost per verified PDP relation per arm.
      distinct_preimage_search: Matched S_5-only vs 2-torsion-aware arms on both curves plus a null curve without 2-torsion.
    constructive_transforms:
      - transform: symmetrization_arm
        proposed_object: Named symmetry reductions of the n = 5 decomposition system.
        predicted_gain: Lower D / cost; magnitude is the measurement.
    quantifier_order: For each ladder step, all arms are built before targets are drawn.
    method_ceiling:
      strongest_certifiable_claim: Scoped band location on the declared ladder and model; no asymptotic ECDLP claim.
      nearby_object_control: Same shape over a prime field (n = 1) as a null for extension-degree effects.
    proof_obligations:
      - claim: Every accepted relation verifies on the curve.
        responsibility: correctness
      - claim: Arms differ only by the declared symmetry.
        responsibility: scope
      - claim: Cryptographic-p comparison uses the same model as Pornin's ≥2^142 bound.
        responsibility: runtime
  predictions:
    - metric: pdp_band_log2_at_crypto_p
      direction: different
      minimum_effect: >-
        A preregistered comparison that places each curve's model band either
        strictly above 142, in [64, 142], or at/below 64 under the frozen costing
        assumptions — provisional intake expects EcGFp5 in-band and EcMasFp5 above.
    - metric: torsion_arm_delta
      direction: lower
      minimum_effect: >-
        On EcGFp5, the 2-torsion-aware arm reduces complete PDP cost by ≥20% vs
        S_5-only at three ladder sizes, or the delta is reported as absent.
  minimal_test:
    design: >-
      Toy-p ladder at n = 5 with at least three increasing p, both curve shapes,
      S_5-only and (where defined) 2-torsion arms, one Groebner and one SAT/XOR
      backend when both consume the same predicate. Re-derive Pornin's ≥2^142
      line as a fixture before scoring.
    controls:
      - EcMasFp5 shape has no rational 2-torsion arm; attempting one is a null.
      - Identical support cardinality after curve-membership filtering.
      - Independent group-law verifier on every accepted relation.
    required_metrics:
      - decomposition_degree_D
      - verified_relations_per_target
      - solver_degree_or_conflicts
      - total_cost_per_verified_relation
      - model_band_log2_at_crypto_p
  falsification_conditions:
    - Both curves' model bands stay ≥142 under every arm (provisional intake reading false).
    - EcMasFp5 band drops as far as EcGFp5 without a 2-torsion explanation.
    - Apparent gains disappear after rank accounting or on held-out targets.
  confounders:
    - Comparing raw relation count to independent rank.
    - Mixing Pornin's model constants with a different solver cost model.
    - Treating toy-p wins as cryptographic breaks.
  interpretation_limits:
    - Proposal only; no run or security claim is created here.
    - Provisional intake figures are not evidence.
  heuristic_assumptions:
    - Decomposition probability and solver-degree models match the frozen Gaudry costing up to named constants.
  heuristic_note: The open content is the measured band location, not a new asymptotic.
  target_complexity:
    time_exponent: Unknown; no improvement claimed a priori.
    memory_exponent: Unknown.
    best_known: Design-note Gaudry lower bound ≥2^142 (KN-LIT-8aff72).
    hidden_overhead: Symmetrization setup, membership filtering, extraction, verification.
    tradeoff_note: A torsion arm that lowers D may increase recovery multiplicity.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: Needs a working n = 5 PDP harness before approval.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: Unmeasured.
  frontier_check:
    status: pending
    note: Deduplicated against 2026-09-18 Galbraith openings; GFPN-specific curves only.
  recommended_priority: high
  priority_rationale: Directly tests the load-bearing security number both design notes advertise.
  first_deliverable: Frozen toy-p ladder contract with arm definitions and Pornin-bound fixture.
  next_gate: /design-experiment under Coordinator authority once Diem/Gaudry full texts needed for the fixture are frozen or the fixture is restricted to KN-LIT-8aff72 arithmetic.
