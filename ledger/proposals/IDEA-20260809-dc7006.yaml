    exact_planted_sampler:
      status: preserved_and_rebound
      probabilities:
        - {arm_id: 3, gamma_star: 1/6, d: 6, probability: K^(-1/6)}
        - {arm_id: 4, gamma_star: 5/18, d: 18, probability: K^(-1/18)}
        - {arm_id: 5, gamma_star: 3/10, d: 30, probability: K^(-1/30)}
      definition: >-
        For d in 6,18,30, p_d is the unique p in (0,1) satisfying K*p^d=1.
      draws:
        formula: 3*40960
        value: 122880
      chunks_per_draw: 8
      bits_per_chunk: 64
      bit_cap: 512
      xof_words:
        formula: 122880*8
        value: 983040
      xof_bytes:
        formula: 983040*8
        value: 7864320
      decision_rule: >-
        At t bits, use exact integer comparisons of K*m^d with 2^(t*d) to
        isolate p_d between adjacent dyadics. Emit the ideal Boolean 1[U<p_d]
        only when the uniform-prefix cell lies wholly below or wholly above the
        certified algebraic interval.
      exhaustion: >-
        If unresolved after 512 bits, emit EXHAUSTED, emit no Boolean, perform
        no rounding or reroll, mark the apparatus invalid, and require a
        separately reviewed successor cap.
      exactness: >-
        Every non-EXHAUSTED Boolean is exactly the ideal 1[U<p_d].
      per_draw_exhaustion_bound: at_most_2^(-511)
      schedule_union_bound: less_than_2^(-494)

