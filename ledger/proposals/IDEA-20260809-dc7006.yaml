  static_compiler:
    schema: crypto.autoresearch.zero_residual_schedule_compiler.v1
    status: prospective_not_approved_or_executed
    sole_source_of_truth: true
    arithmetic: unsigned_checked_128_bit_integers
    compile_rule: >-
      Recompute every declared count, product, total, cap, key cardinality,
      inherited path, and digest. Reject on an undefined field, duplicate
      domain, duplicate row id, overflow, stale literal, missing population,
      path mismatch, digest mismatch, nonzero residual, or unenumerated
      canonical point. The compiler must not repair an input silently.
    fixed_block_rule: >-
      Every capped generator owns its complete fixed block of XOF words.
      Every word in the block is charged even when an earlier word is accepted.
      EXHAUSTED emits no substitute value, causes apparatus invalidity, preserves
      all partial artifacts, and permits no reroll or favorable continuation.

    identifiers:
      gamma_id:
        encoding: u8
        values:
          treatment: 0
          coverage_0_over_1: 1
          coverage_5_over_18: 2
          coverage_3_over_10: 3
          coverage_1_over_3: 4
          selector_control: 5
          fixture: 6
        coverage_mapping:
          - {gamma_id: 1, numerator: 0, denominator: 1}
          - {gamma_id: 2, numerator: 5, denominator: 18}
          - {gamma_id: 3, numerator: 3, denominator: 10}
          - {gamma_id: 4, numerator: 1, denominator: 3}
      dataset_id:
        encoding: u32_big_endian
        coverage_range: [0, 511]
        treatment_sentinel: 4294967295
        selector_control_sentinel: 4294967294
        fixture_sentinel: 4294967293
        scoping_rule: >-
          A coverage dataset is identified by the pair gamma_id,dataset_id.
          Treatment, controls, and fixtures use their frozen sentinels. No key
          contains an undefined gamma_id or dataset_id.
      arm_id:
        encoding: u8
        values:
          signed_y_treatment: 0
          CTRL-BALANCED-ANTISYMMETRIC: 1
          CTRL-EXACT-QUOTIENT: 2
          CTRL-PLANTED-GAMMA-1-6: 3
          CTRL-PLANTED-GAMMA-5-18: 4
          CTRL-PLANTED-GAMMA-3-10: 5
      model_id:
        encoding: u8
        canonical: 0
        derived: [1, 2, 3]
        shared_root_exclusion: >-
          model_id is absent from treatment root and treatment list keys.
          All four models consume the same canonical root and four canonical
          lists. Derived models transform those rows without new scalar draws.

    encoding:
      tuple_encoding: >-
        Domain separators are literal ASCII. Each variable key is a
        length-prefixed tuple. Fixed-width integers use unsigned big-endian
        encoding. Signed eta uses i8 values -4, 0, and 4. Strings are UTF-8.
        SHAKE256 begins at byte offset zero for every complete key.
      xof: SHAKE256
      modulo_rule_64: >-
        For modulus m=N-1, accept a 64-bit word x only when
        x<floor(2^64/m)*m, then emit 1+(x mod m).
      modulo_rule_128: >-
        For modulus m=N-1, accept a 128-bit word x only when
        x<floor(2^128/m)*m, then emit 1+(x mod m).
      without_replacement_rule: >-
        A list candidate must also differ from every earlier accepted value in
        the same canonical root and list_id. Rejection never crosses list_id
        boundaries. Derived model lists are transformations of the accepted
        canonical list and perform no sampling.

    size_rows:
      row_schema:
        - bits
        - L
        - M
        - U
        - window_additions
        - canonical_roots
        - canonical_list_rows
        - derived_list_rows
        - treatment_model_list_rows
        - treatment_selected_pairs
      rows:
        - [18, 63, 63, 64, 4, 8192, 2064384, 6193152, 8257536, 16515072]
        - [21, 127, 127, 128, 5, 8192, 4161536, 12484608, 16646144, 33292288]
        - [24, 255, 255, 256, 5, 8192, 8355840, 25067520, 33423360, 66846720]
        - [27, 511, 511, 512, 6, 8192, 16744448, 50233344, 66977792, 133955584]
        - [30, 1023, 1023, 1024, 6, 8192, 33521664, 100564992, 134086656, 268173312]
      sums:
        L: 1979
        M: 1979
        U: 1984
        window_additions: 26
      quotient_invariant: L=M=U-1
      padding_rule: >-
        U-M is capacity only and creates no scalar, list row, label, bucket,
        join, selected pair, hash, candidate, transform, addition, or traffic
        event.

