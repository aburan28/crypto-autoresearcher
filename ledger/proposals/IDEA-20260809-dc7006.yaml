  mechanism: >-
    A declarative compiler treats every generator call, reused lookup, list
    row, selected pair, fit slot, fixture point, operation, and inherited
    subtree as a named finite population. Counts flow from one cardinality
    graph. Traffic rows are population cardinality times an explicit record
    width. Generator caps are fixed blocks whose unused words are still
    charged. Every inherited interface binds an immutable snapshot, an existing
    YAML key path, one canonical serialization, and SHA-256. The compiler
    rejects rather than repairing any nonzero residual.

  inheritance:
    policy: >-
      Inherited values are selected directly from the immutable mathematical
      source. No prose alias, transitive unresolved selector, YAML merge key,
      or implicit overlay is admissible.
    canonical_serialization:
      id: strict-yaml-sorted-json-v1
      steps:
        - Parse the snapshot file as strict YAML with duplicate keys rejected.
        - Select the exact value at the declared YAML key path.
        - Recursively sort every mapping by Unicode code-point key order.
        - Serialize as UTF-8 JSON with separators comma and colon.
        - Encode non-ASCII characters directly with ensure_ascii=false.
        - Emit no trailing newline.
        - Compute SHA-256 over exactly those UTF-8 bytes.
    digest_origin: >-
      The Coordinator supplied these digests from the immutable snapshot using
      strict-yaml-sorted-json-v1. They are inputs to this Idea Generator
      payload, not a claim that the Idea Generator ran a filesystem command.
