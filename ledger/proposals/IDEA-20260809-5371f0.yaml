idea:
  id: IDEA-20260809-5371f0
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    Deterministic nonce derivation is a single-signer safety property that
    becomes a multiparty hazard — measure how many sessions it takes to extract
    the share
  class: mechanism
  claim: >-
    Deriving nonces deterministically from the key and message is standard
    single-signer defensive practice. In a multiparty protocol where another
    participant influences what gets signed or which session proceeds, the same
    derivation lets an adversary obtain two different signing transcripts sharing
    a nonce. The claim is that this yields share extraction, and that the number
    of sessions required is small and measurable as a function of how much
    control the adversary has over the session's inputs.
  mechanism: >-
    Instantiate a reference threshold protocol with deterministic per-participant
    nonce derivation. An adversarial co-signer replays the first round with a
    changed second-round input; the honest participant's nonce repeats while the
    challenge differs, and two linear equations in the share follow.
  why_not_a_renamed_known_approach: >-
    That deterministic nonces are unsafe in multiparty settings is stated in the
    specifications this goal will file. The contribution is the measured
    SESSION-COUNT CURVE against adversary control, and a certificate: an extracted
    share verified by producing a valid partial signature.
  predictions:
  - observable: sessions required for share extraction versus adversary control level
    metric: session count at each of several declared control levels
    predicted: Two sessions at full control over second-round inputs; more as control is restricted. The curve locates which deployment shapes are exposed.
  - observable: whether any declared control level makes extraction impossible
    metric: boolean per level
    predicted: >-
      A level exists at which extraction fails within budget; identifying it is
      the useful design boundary, and a failure to find such a level would be a
      stronger negative result about deterministic derivation generally.
  minimal_test: >-
    Reference protocol with deterministic derivation, three declared adversary
    control levels, extraction attempted at each, certificates emitted and
    verified by producing a valid partial signature under the extracted share.
  controls:
  - 'RANDOM-NONCE CONTROL: with fresh random nonces, extraction must fail within the same budget at every control level; if it succeeds, the vulnerability is elsewhere and the attribution is wrong.'
  - 'HONEST-PATH CONTROL at every configuration.'
  falsification_conditions:
  - Extraction fails at full adversary control with deterministic derivation.
  - Extraction succeeds with random nonces, invalidating the attribution.
  interpretation_limits: >-
    Certificates are against a reference implementation configured with a
    derivation the specifications warn against; the record's title says so. This
    is not a claim about any deployed implementation, and no third-party system
    is examined.
  sota_delta: 'No attack on any deployed system. Delta: a measured session-count curve against adversary control for a hazard that is currently stated as a warning.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for deterministic nonce: ECDSA nonce records concern leakage, not multiparty replay. WEB NOT CHECKED.'
  source_refs:
  - Threshold Schnorr specifications and their nonce-generation guidance -- RECALLED, REQUIRED READS.
