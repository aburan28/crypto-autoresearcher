# =============================================================================
# IDEA-20261006-4e7025 — proposal only. No hypothesis and no experiment
# are created for this record in the filing pass. Novelty is unverified.
# =============================================================================
idea:
  id: IDEA-20261006-4e7025
  question_id: RQ-ECTD-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Some affine pair on y^2 = x^3 + x + 1 over F_89 has
    x(P+Q) = x(P)+x(Q)
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. The tracked label is the field element
    x(P)+x(Q)-x(P+Q). The stage is a public coordinate census on one
    model, not a search for a hidden isogeny. The discrete-log exponent
    versus Pollard rho stays 1/2. Let p=89 and let E be
    y^2 = x^3 + x + 1 over F_p. An eligible pair is an unordered pair
    of distinct affine points {P, Q} with P not equal to -Q, both
    y-coordinates nonzero, and P+Q not the point at infinity. Let W
    be the number of eligible pairs with x(P+Q) = x(P)+x(Q) in F_p.
    The claim is W>=1, after the model has been checked nonsingular
    and the point count has been checked different from p+1. The
    concrete negative is W=0 under those same checks. A singular model
    or a point count equal to p+1 leaves the census unmeasured. A
    positive W is a public relation on the published equation. It is
    not a hidden trapdoor endpoint, not an embedding-degree statement,
    and not the congruence of Frobenius to 1 modulo the group order.
    This is not a Phi_7 root count, not a cross product of hit counts,
    not a least-bit agreement, not a chord-slope Legendre bin, and not
    a degree-4 root count.
  mechanism: >-
    OBJECT FRAME. The representation is the affine x-coordinate. The
    operation set Sigma is addition of an eligible pair, a partial
    action on pairs rather than the full translation orbit of one
    point. Trichotomy: coordinate-dependent. The predicate
    x(P+Q)-x(P)-x(Q) = 0 is a function of coordinates. It is not a
    group homomorphism. LOSSY PROJECTION. The projection keeps one
    bit, whether the sum of x-coordinates is preserved, and discards
    y and both discrete logs. What is priced is the integer W. No
    factor base is proposed and no secret isogeny is built. F1 through
    F7 are not the lens. The nearly-free x(P-Q) trick is a fence. This
    census does not price a baby-step.
  novelty_status: unverified
  citations:
    - ref: RQ-ECTD-001
      provenance: internal
      claim: >-
        The question asks whether a secret isogeny can hide an
        endpoint-specific ECDLP weakness that is not a public
        isogeny-class invariant. This record asks a narrower public
        question and does not build that isogeny.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-ECTD-001.yaml
    - ref: KR-RHO-fbd582
      provenance: internal
      claim: >-
        With a shared inversion, x(P-Q) costs little extra once
        x(P+Q) is known, and that saving is used in baby-step
        giant-step. This record does not run baby-step giant-step.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd582.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        Pairing and anomalous attacks apply only on special traces.
        A coordinate sum is not an embedding degree.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
  assumptions:
    - p=89 is prime. The run recomputes this by trial division. This session checked that no prime at most 7 divides 89.
    - >-
      4 A^3 + 27 B^2 for A=1 and B=1 is 31, which is not 0 in F_89.
      The run recomputes it. A zero leaves the cell unmeasured.
    - P = -Q is not eligible. A pair with either y equal to 0 is not eligible. A pair with P+Q at infinity is not eligible.
    - The pair is unordered. Counting {P, Q} and {Q, P} as two would double W. The run counts each pair once.
  predictions:
    - metric: W
      direction: higher
      minimum_effect: W is at least 1
  minimal_test:
    design: >-
      Confirm 89 is prime. Recompute the discriminant and the point
      count. Enumerate eligible unordered pairs. Compute P+Q by the
      chord-and-tangent sum. Require that (P+Q)+(-Q) returns P. Count
      a pair when the computed x(P+Q) equals x(P)+x(Q).
    controls:
      - >-
        Nonsingularity and ordinary controls. A zero discriminant or
        a point count equal to 90 leaves the cell unmeasured.
      - >-
        Round trip. (P+Q)+(-Q) returns P on every pair that is scored
        and on one pair that is not scored, if a non-scored pair
        exists. One failure voids the instrument.
      - >-
        Label control. Permute field elements with s_0 = 5140517 and
        s_{k+1} = (1103515245 * s_k + 12345) mod 2^31, Fisher-Yates
        on 0 through 88. Score the same pairs with permuted labels in
        place of x, still using the true sum for the point addition.
        Report that count beside W. Do not write it into W.
    required_metrics:
      - W
      - the point count
      - the permuted-label count, reported beside W
      - one explicit pair if W is at least 1, or the statement that no pair exists
  falsification_conditions:
    - The instrument checks pass and W=0. That integer is the negative.
    - The model is singular, or the point count equals 90. The census is then unmeasured.
    - A round trip fails. The instrument is void.
  confounders:
    - The algebraic identity x(P+Q) = lambda^2 - x(P) - x(Q) makes the predicate equivalent to lambda^2 = 2(x(P)+x(Q)). The score uses the computed point, not a hand evaluation of that square. A run that skips the point addition and only tests the square is a different instrument.
    - Pairs on the same vertical line have P+Q at infinity and are excluded. Their absence is not a zero of W by itself.
  interpretation_limits:
    - A positive W is a public relation on one curve of 89 elements. It does not exhibit a secret isogeny, does not hide an endpoint, and does not lower the generic exponent 1/2.
    - KR-RHO-53c89f still confines pairing and anomalous attacks to special traces. This record does not compute an embedding degree and does not test trace one.
    - No factor base is defined. The permuted-label count is not substituted for W.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If lambda^2 - 2(x(P)+x(Q)) were uniform in F_p for eligible
        pairs and independent across pairs, the chance a given pair
        preserves the x-sum would be 1/p, and W would have mean equal
        to the number of eligible pairs divided by p. The pre-registered
        prediction is only W>=1. The uniform sentence is the
        distribution being imitated. It is not a theorem about this
        cubic.
      rigorous_support: >-
        The chord-and-tangent formula gives x(P+Q) as a rational
        function of the coordinates. That identity does not decide
        whether any eligible pair lands on the subvariety
        x(P+Q) = x(P)+x(Q).
      validation_plan: >-
        Compute W exactly at p=89. Report the permuted-label count
        beside it. If W=0, the prediction fails on this cell. If the
        permuted count is positive and W is 0, or the reverse, the
        cubic and the labels disagree and both integers stay in the
        artifact. No transfer to a larger prime is claimed.
  target_complexity:
    time_exponent: >-
      The census is quadratic in the number of affine points, which
      is O(p) at p=89. The discrete-log exponent stays 1/2. Delta
      versus Pollard rho is 0.
    memory_exponent: O(1) beyond the list of affine points.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) on this curve (KR-RHO-13bf67).
      The x(P-Q) saving (KR-RHO-fbd582) is a constant-factor device
      inside baby-step giant-step, not this count.
    hidden_overhead: No o(1) discrete-log term.
    tradeoff_note: No collision-search tradeoff. The output is one integer W.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As an ECDLP method, enumerating these pairs is dominated by
    Pollard rho on this curve. The rows read were KR-RHO-fbd582,
    KR-RHO-13bf67, and KR-RHO-53c89f. A nearly free second
    x-coordinate inside baby-step giant-step, the generic square-root
    bound, and pairing or anomalous attacks only on special traces.
    None of those rows defines W. They dominate any claim that W
    moves an exponent or hides a trapdoor.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. The
    integer added here is W at p=89. A positive W is not a speedup
    factor and is not a trapdoor.
  prior_art:
