        delta: >-
          The frontier match ranked the nearly free x(P-Q) row first.
          That row prices a second x-coordinate inside baby-step
          giant-step. This record counts pairs whose x-sum is
          preserved by addition. It does not run a search. The
          exponent delta is 0. The integer added is W.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The generic-group bound is Omega(sqrt(N)). This census does
          not beat it. W is not a group-operation count.
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: orthogonal
        delta: >-
          Pairing and anomalous attacks are curve checks on special
          traces. W is not an embedding degree and is not a trace.
          That row does not define W.
