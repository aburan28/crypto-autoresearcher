idea:
  id: IDEA-20260905-c6aae0
  title: Local-density corrected factorial moments for smooth primitive norm values
  class: mechanism
  claim: Conditioning smoothness on primitive norm representability requires a local-density correction and a dependence
    correction; separating them can falsify a random-integer heuristic without conflating congruence restrictions
    with an exponent change.
  mechanism: Retain the multiset of primitive norm values below a fixed radius, labeled by residue obstructions
    and by shared primitive vector directions. Define local admissibility weights from exact residue counts at a
    fixed finite prime set. Compare the first two factorial moments of the number of B-smooth admissible values
    with those of independently weighted integers. Agreement of the mean but disagreement of the second moment isolates
    clustering rather than local bias. The mechanism is a weighted point-process representation of possible witnesses;
    it does not construct an input-to-witness procedure. Spinor exceptions and repeated norms remain explicit candidate
    sources of nonlocal dependence, not effects assumed present.
  question_id: RQ-SSIQ-9702af
