    memory_exponent: O(V+k) words or O(k) streaming moments plus archived data.
    data_queries: V norm values, no external oracle.
    best_known: Conditional p^(1/3+o(1)) time and memory over F_p2; unconditional p^(1/2) polylog tier.
    hidden_overhead: Factoring and exact form enumeration are not polynomial-time assumptions.
    tradeoff_note: No movement from incumbent T=p^(1/2+o(1))/sqrt(w); this tests its probability inputs.
