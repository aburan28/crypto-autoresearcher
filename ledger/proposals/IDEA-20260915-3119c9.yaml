idea:
  id: IDEA-20260915-3119c9
  title: >-
    Factor-base design by counting: the G-landing triple count Lambda(V) =
    C(F1+2,3) + F1*C(F0+1,2) (F1 = E-side factor-base points in the odd-order
    class, F0 = outside it) is the yield quantity the boundary table should
    predict and check; class-aligning V inside {Tr(x) = Tr(a)} sets F0 = 0, and
    maximising F1 over K random affine subspaces adds the extreme-value factor
    (1 + sqrt(2 ln K)/2^{l/2})^3 - a relation-search gain of 4-8x at l = 6 capped
    at 8x for any V of dimension l, with no exponent moved
  class: mechanism
  research_question_id: RQ-ICPERF-94c86e
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids: [GOAL-ICPERF-e6b6a4]
  status: proposed
  proposed_by: idea-generator
  task_id: TASK-20260915-5ba08b
  recorded_at: '2026-09-15'
  claim: >-
    Let E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, n odd, #E = 2r with r odd,
    G = 2E the odd-order class, and let the attack's targets be R in G. For a
    factor base Fb_E = {P in E(F_q) : x(P) in V} split as F1 = #{P in Fb_E : P in
    G} = #{P : Tr(x(P)) = Tr(a)} (H-SEMBIN-83a856 criterion F2, status supported)
    and F0 = |Fb_E| - F1, the number of unordered point-triples from Fb_E whose sum
    lies in G is Lambda(V) = C(F1+2, 3) + F1 * C(F0+1, 2) (three G points, or one G
    point and two non-G points), so the expected number of decompositions of a
    uniformly random G-target x-coordinate is lambda_x(V) = 2 Lambda(V) / (r - 1)
    and the decomposable fraction is 1 - exp(-lambda_x) in the small-lambda regime.
    Two design rules follow and are stated as predictions. (R1, class alignment)
    Replace the Trimoska V = {deg x < l} by an affine slice V' = {x in W : Tr(x) =
    Tr(a)} for an (l+1)-dimensional linear W: then F0 = 0, 0 is excluded from V'
    automatically (Tr(0) = 0 != Tr(a) when Tr(a) = 1), every factor-base point lies
    in G, and Lambda(V') = C(2|V'_E| + 2, 3) where V'_E = V' ∩ x(E) - at equal
    |Fb_E| this is 2x the balanced-V value. (R2, E-side enrichment) Over K random
    affine slices of the same shape, |V'_E| is Binomial(2^l, 1/2)-distributed to
    within Weil-sum corrections, so the best of K has |V'_E| ~ 2^{l-1} (1 +
    sqrt(2 ln K)/2^{l/2}) and Lambda gains (1 + sqrt(2 ln K)/2^{l/2})^3 over the
    mean - 3.1-3.8x observed at K = 2000 in the proposal-time check below, 7-8x
    predicted at K = 10^4 relative to the SHIPPED Trimoska V at (17,6) and (19,6),
    decaying to the class factor 2 alone as l grows. The relation-search cost of
    an exhaustive-core PDP (IDEA-20260915-0d8e90) scales as N_rel/Lambda ~ |Fb_E|
    /Lambda, so the predicted T_rel gain over the shipped V is 4-5x at l = 6 and is
    CAPPED at 8x for any factor base of dimension l (F1 <= 2^{l+1}, which is
    2 * C(2^{l+1}+2, 3) / [C(2^l+2,3)] ~ 16 in Lambda against a doubled N_rel). This
    is a closed-form yield instrument first and a constant-factor mechanism second;
    the exponent 1 in n of the SAT pipeline and rho's 1/2 are untouched.
  mechanism: >-
    OBJECT TRACKED. The pair (side bit s(x), class bit Tr(x) + Tr(a)) of each
    factor-base x-coordinate. Under the operation set {form the sum of three
    factor-base points}, the class bit propagates deterministically (it is the
    homomorphism E -> E/2E = Z/2 of H-SEMBIN-83a856, so the class of a sum is the
    XOR of the classes) while the side bit is a precondition (only side-0 x are
    factor-base points at all). The lossy-projection test passes for the class
    bit exactly as in IDEA-20260913-cedd2f (it discards all but one bit of the
    point and propagates under addition); this record uses it to COUNT rather
    than to confine.

    THE COUNT. A G-target R decomposes as P1 + P2 + P3 (signs absorbed by taking
    both (x, y) and (x, x + y) in Fb_E) iff the class XOR of the three points is
    the class of G, i.e. an even number of the three lie outside G. Unordered
    multisets of size 3 from F1 G-points and F0 non-G points with an even number of
    non-G members number C(F1+2, 3) + F1 * C(F0+1, 2). Each such triple has a sum
    S in G and lands on the x-coordinate of S, shared with -S, so the expected count
    per G x-coordinate is 2 Lambda / (r - 1) (r - 1 affine points of G, (r-1)/2
    x-coordinates, each triple counted once).

    PROPOSAL-TIME CHECK (this session, /tmp script, NOT evidence). Exhaustive
    enumeration on y^2 + xy = x^3 + x^2 + 1 (the Trimoska curve, a = 1) gave #E =
    32494, 131174, 525086 at n = 15, 17, 19 (r = 16247 = 7 * 11 * 211, 65587 prime,
    262543 prime) and, for the shipped V = {deg x < l}: (15,5) |Fb_E| = 21, F1 = 14,
    F0 = 7, measured lambda_x = 0.117 against 2 Lambda/(r-1) = 0.099; (17,6) |Fb_E|
    = 63, F1 = 38, F0 = 25, measured 0.678 against 0.641; (19,6) |Fb_E| = 63, F1 =
    24, F0 = 39, measured 0.162 against 0.157. Agreement to 3-18%, with the residual
    in the direction of the multiset correction (points repeated in a triple). For
    the affine slice V' = {x in {deg x < l+1} : Tr(x) = 1}: (15,5) |Fb_E| = 36, all
    in G, lambda_x = 1.039 (8.9x the shipped V); (17,6) |Fb_E| = 72, lambda_x =
    1.977 (2.9x); (19,6) |Fb_E| = 46, lambda_x = 0.132 (0.81x - LOWER, because this
    particular slice has only 23 E-side x-coordinates out of 64, a 2.2-sigma low
    draw). That last cell is the point of rule R2: class alignment alone is a 2x
    at EQUAL |Fb_E| and can lose to a bad E-side draw, so the design rule is
    "maximise F1", of which class alignment is the deterministic half and
    enrichment the statistical half. The enrichment check over K = 2000 random
    l-dimensional linear subspaces gave mean |V_E| = 15.45, 31.44, 31.59 (predicted
    2^{l-1} = 16, 32, 32), s.d. 2.81, 3.99, 4.04 (binomial: 2.83, 4.0, 4.0), and
    maxima 24, 46, 44 against the crude Gumbel estimate 27.0, 47.6, 47.6 - the
    crude estimate overshoots by 4-11%, as the first-order sqrt(2 ln K) term does
    (the second-order Gumbel correction is negative); the measured (max/mean)^3
    was 3.75, 3.13, 2.70.

    WHY IT IS CAPPED. F1 <= 2 |V| = 2^{l+1} (every x in V E-side and in class,
    two points each). Lambda_max = C(2^{l+1}+2, 3) ~ 2^{3l+3}/6 against the
    balanced-V value ~ 2^{3l}/12 - a 16x ceiling on Lambda; N_rel ~ |Fb_E|/2
    doubles, so T_rel ~ N_rel/Lambda improves by at most 8x. Reaching the ceiling
    needs a subspace entirely inside x(E), whose probability under H1 is
    2^{-(2^l - 1)} per random subspace - unreachable by search for l >= 5, so the
    realistic gain is the extreme-value one, and it shrinks with l.

    WHAT THE TABLE GAINS. A yield row that is PREDICTED from (F1, F0, r) before
    any solver runs and CHECKED by the exhaustive table of IDEA-20260915-3f1964;
    a residual above 20% at any cell is a structural finding (2-torsion, a class
    criterion failure, or a sign-multiplicity effect). In RUN-ICPERF-305ca3 it
    would have predicted that at (19,6) only 7.5% of G-targets decompose (measured
    exhaustively here: 7.55%) against 27.7% at (17,6) - a 3.7x cell-to-cell yield
    difference at the SAME l that the unreviewed row's S/U labels and per-instance
    times cannot see, and that comes from F1 = 24 versus 38.
  novelty_status: unverified
  novelty_screen:
    status_note: >-
      Would be `adaptation` on the corpus reads recorded below; held at
      `unverified` because one supporting citation (the extreme-value law) is
      provenance `recalled` and the validator requires `unverified` until every
      recalled source is opened.
    what_is_not_new: >-
      The class criterion Tr(x) = Tr(a) for 2E and its confinement consequence
      (a V inside ker Tr gives half the targets zero decompositions) are
      H-SEMBIN-83a856 / IDEA-20260913-cedd2f (supported, this program). Semaev
      2015/310 eq. (11) gives the idealised yield 2^{mk-n}/m! with no class or
      side correction. The idea that the factor base should consist of points of
      the subgroup is standard in index calculus.
    what_is_new: >-
      The closed-form Lambda(V) with both corrections; the class-aligned affine
      slice as a constructive design rule with F0 = 0 and 0 excluded; the
      extreme-value enrichment law and its l-decay; the 8x cap; and the
      identification of F1 as the single design quantity. No corpus record states
      the count or the cap. Whether Semaev, Galbraith-Gebregiyorgis 2014/806 or
      the FGHR symmetry paper (KN-LIT-004) already choose V by a trace condition
      is UNCHECKED at the full-text level; KN-LIT-004 as recorded is about
      symmetries of the polynomial, not the factor-base class.
    searched: >-
      rg over knowledge/ and ledger/ for "Tr(x) = Tr(a)", "affine", "2E class",
      "reachable class", "Kloosterman", "yield formula" (hits: cedd2f,
      H-SEMBIN-83a856, none with the count); KN-LIT-004, KN-LIT-102cdb read;
      IDEA-20260913-cedd2f and H-SEMBIN-83a856 in full. No web search for this
      specific mechanism.
