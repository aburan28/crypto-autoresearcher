        Trace-parity confinement, status supported - Tr(x_P) + Tr(a) computes
        E/2E; a V inside ker Tr gives half the targets exactly zero decompositions.
      verified_by: coordinator decision cited in that record; re-read by TASK-20260915-5ba08b
    - ref: IDEA-20260913-cedd2f
      provenance: internal
      claim: Criterion (F2) P in 2E iff Tr(x) = Tr(a); its proposal-time verification at n = 7, 8, 9.
      verified_by: validator TASK-20260913-da3982 per that record; re-read by TASK-20260915-5ba08b
    - ref: IDEA-20260915-3f1964
      provenance: internal
      claim: Side dichotomy and the exhaustive decomposition table this record's yield row is checked against.
      verified_by: idea-generator TASK-20260915-5ba08b (same session)
    - ref: IDEA-20260915-0d8e90
      provenance: internal
      claim: T_rel ~ N_rel * C_U / p in the small-p regime, so T_rel ∝ |Fb_E| / Lambda at fixed per-instance cost.
      verified_by: idea-generator TASK-20260915-5ba08b (same session)
    - ref: inputs/SEMAEV-2015-310/paper_fulltext.md eq. (11)
      provenance: internal
      claim: Idealised yield 2^{mk-n}/m!, which Lambda(V) refines.
      verified_by: validator TASK-20260913-da3982 per IDEA-20260913-cedd2f; not re-opened this session
    - ref: experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/task-report.md
      provenance: internal
      claim: UNREVIEWED OBSERVATIONS - the row reports per-instance S/U labels and times, no yield quantity; 1 of 30 U-labelled instances SAT.
      verified_by: idea-generator TASK-20260915-5ba08b (read this session)
    - ref: 'Gumbel / Fisher-Tippett extreme-value law for maxima of i.i.d. binomial samples (standard reference, e.g. Leadbetter-Lindgren-Rootzen, Extremes and Related Properties of Random Sequences and Processes, 1983)'
      provenance: recalled
      claim: max of K i.i.d. N(mu, sigma^2) is mu + sigma sqrt(2 ln K) (1 + o(1)) with a negative second-order correction; pointer only, not opened.
      verified_by: null
  assumptions:
    - '#E = 2r with r odd (true at n = 15, 17, 19 for the Trimoska curve by the proposal-time count; r is prime at 17 and 19, composite at 15 - the design rule does not need r prime).'
    - The Weil-descent generator can emit an AFFINE factor-base slice x_i = v0 + sum_j bit_ij u_j with an arbitrary basis (u_j) and offset v0; the vendored Weil_descent.sage uses the monomial basis and needs a small generalisation (implementation, not a research assumption).
    - Targets are drawn in G; the count is for G-targets and is different (and stated) for non-G targets.
  proof_search_map:
    bottleneck: >-
      The relation-search yield - decompositions per target - which divides the
      per-instance PDP cost to give the relation-phase cost.
    baseline_embedding:
      parameter_slice: >-
        The three shipped cells with the shipped V; Lambda(V) from (F1, F0) must
        reproduce the exhaustive table's lambda_x within the multiset correction
        before any designed V is scored.
      reproduction_check: >-
        Recompute F1, F0, r for the shipped instances from the .in files and the
        curve; compare to 14/7, 38/25, 24/39 and #E = 32494, 131174, 525086.
    observation_collision:
      observable: lambda_x measured on the table for the designed V versus the shipped V.
      distinct_preimage_search: >-
        A yield gain of g is produced by (i) the class alignment (F0 -> 0), (ii) a
        lucky E-side draw (large |V'_E|), or (iii) a curve-specific structure of
        x(E) on affine slices. (i) and (ii) are separated by reporting F1, F0
        alongside lambda_x - the count predicts the gain from the pair; (iii) is
        detected when Lambda(V) mispredicts lambda_x by more than the multiset
        correction on the designed V but not on the shipped V.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The factor base as a pair of counts (F1, F0) rather than a set; the
          yield as a closed form in them.
        predicted_gain: >-
          A predicted yield row per cell; a design rule (maximise F1) with a
          quantitative ceiling.
    quantifier_order: >-
      For every cell (n, l) with l <= 8 and every affine slice V of dimension l,
      lambda_x(V) = 2 Lambda(V)/(r-1) up to the multiset correction (at most
      +25% at |Fb_E| >= 20) and 2-torsion coincidences; the extreme-value
      statement is about the distribution of |V_E| over uniformly random slices.
    method_ceiling:
      strongest_certifiable_claim: >-
        The count, the 8x cap, and the measured gain of the designed V at l <= 8
        on the Trimoska curve and on >= 2 further curves; a constant-factor
        statement about the relation-search phase of an exhaustive-core PDP.
      nearby_object_control: >-
        A V inside ker Tr when Tr(a) = 1 (the cedd2f confinement object, F1 = 0):
        Lambda = 0 and the table must show exactly zero G-target decompositions;
        and the quadratic twist E' (a' with Tr(a') != Tr(a)), on which the same
        slice V' has the OPPOSITE class and the count must be recomputed with
        F1' = # points of E' in 2E' - a slice tuned for E must not also be tuned
        for E'.
    proof_obligations:
      - claim: Lambda(V) reproduces the shipped cells' table yields
        responsibility: baseline
      - claim: class XOR rule for triples (E -> E/2E homomorphism)
        responsibility: correctness
      - claim: T_rel ∝ N_rel / Lambda at fixed per-instance cost
        responsibility: runtime
      - claim: extreme-value law for max_K |V_E|
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: '|lambda_x(table) / (2 Lambda(V)/(r-1)) - 1| on every V tested'
      direction: lower
      minimum_effect: '<= 0.25 at |Fb_E| >= 20 (multiset correction), <= 0.10 at |Fb_E| >= 60'
    - metric: F0 for the class-aligned slice V'
      direction: lower
      minimum_effect: exactly 0 on every cell (a single non-G factor-base point falsifies the criterion or the construction)
    - metric: max over K = 10^4 random class-aligned slices of |V'_E| at l = 6
      direction: higher
      minimum_effect: '>= 32 + 0.85 * 4 * sqrt(2 ln 10^4) = 46.6 (crude Gumbel minus 15%); reported with the full histogram'
    - metric: T_rel gain of the best designed V over the shipped V, computed as [|Fb_E|/Lambda]_shipped / [|Fb_E|/Lambda]_designed
      direction: higher
      minimum_effect: '>= 3 at (17,6) and (19,6) with K = 10^4; <= 8 at every cell (cap)'
    - metric: decay of the enrichment factor (max/mean)^3 from l = 6 to l = 8 at fixed K
      direction: lower
      minimum_effect: 'ratio of factors within 25% of [(1 + sqrt(2 ln K)/8)/(1 + sqrt(2 ln K)/16)]^3'
  minimal_test:
    design: >-
      For n in {17, 19, 21} and l in {6, 7, 8}: (1) compute #E, r, and the
      exhaustive table (3f1964) for the shipped V; record F1, F0, lambda_x; (2)
      sample K = 10^4 random class-aligned affine slices, record the |V'_E|
      histogram, keep the best; (3) build its table, record lambda_x, F1 = |Fb_E|,
      F0 = 0; (4) generate 20 certified-U and 20 S G-target instances for the
      designed V with the generalised descent, run WDSat default, and confirm the
      per-instance UNSAT cost is unchanged (c within 10% of the shipped V's) so the
      gain is yield-only; (5) report the T_rel gain per cell from measured
      quantities.
    controls:
      - NULL - random (non-aligned) slices of the same dimension: their F0 must be ~F1 and their lambda_x must follow the count with both terms.
      - KNOWN-FALSE - a slice inside ker Tr at a = 1 (F1 = 0): the table must show zero G-target decompositions (the cedd2f confinement).
      - TWIST CONTROL - recompute the count on E' for the same slice; the designed V's gain must not transfer to E' unless F1' happens to be large.
      - RECONSTRUCTION - shipped-cell F1/F0/lambda_x from the .in files.
    required_metrics:
      - '#E, r, F1, F0, |V_E|, Lambda(V), predicted and measured lambda_x per (cell, V)'
      - '|V_E| histogram over K slices with mean, s.d., max, and the Gumbel prediction'
      - WDSat conflicts per instance for the designed V (c must match the shipped V)
      - T_rel gain per cell with its two factors (class, enrichment) reported separately
  falsification_conditions:
    - Lambda(V) mispredicting lambda_x by more than 25% at |Fb_E| >= 20 on any V - the count is missing a term (sign multiplicity, 2-torsion, or a class-criterion failure); report which by inspecting the residual triples.
    - Any factor-base point of the class-aligned slice outside G - criterion (F2) or the construction is wrong; the record is withdrawn until resolved.
    - max over K = 10^4 slices of |V'_E| below 2^{l-1} + 0.6 * 2^{l/2-1} * sqrt(2 ln K) (below 42.3 at l = 6) - the maximum falls short of the extreme-value prediction by more than 40% of the excess, so |V_E| is not binomial over slices (a Kloosterman-sum structure on subspaces), which is itself a structural finding to be recorded.
    - WDSat's c on the designed V differing from the shipped V's by more than 25% - the design changes the per-instance cost and the gain is not yield-only; recompute T_rel with both factors.
    - A measured T_rel gain above 8 at any cell - the cap argument is wrong somewhere named.
  confounders:
    - The multiset correction (repeated points in a triple) is a few percent at |Fb_E| >= 60 but 20% at |Fb_E| ~ 20; use exact C(F1+2,3) and C(F0+1,2) rather than F^3/6 in every comparison.
    - Whether the odd-order class is G itself or contains G with index 2 (cofactor 4 curves, e.g. Koblitz a = 0): the count then gives the 2E-landing rate, and the G-landing rate is half of it; state which curve family is in play (IDEA-20260915-8fe0ef).
    - An affine slice changes the ANF of the descended system (constant terms in the linear relations); WDSat's core-first order is unaffected but MAX_ID sizing may change; conflicts are the unit of comparison.
    - Target sampling - uniform on x(G) versus uniform on G points (each x has two points): both give the same lambda_x by symmetry; state which is used.
  interpretation_limits:
    - A yield instrument and a constant-factor design rule for the relation-search phase; no exponent claim; nothing about the per-instance PDP cost (IDEA-20260915-0d8e90, -eee7e4) or about Groebner engines.
    - Scoped to binary curves with #E = 2r, m = 3 decompositions, l <= 8, and affine factor-base slices; the count changes for m = 4 (even number of non-G points condition becomes even for all-in-G targets) and is not stated here.
    - The 8x cap is for factor bases that are affine slices of dimension l; a non-affine V (union of slices) is a different object with a different cap and is out of scope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Over uniformly random affine slices V of dimension l inside {Tr(x) =
        Tr(a)}, |V ∩ x(E)| is Binomial(2^l, 1/2) to within a relative correction
        O(2^{-l/2} + 2^{l/2 - n/2}).
      rigorous_support: >-
        The E-side indicator is (1 + (-1)^{Tr(x + a + b/x^2)})/2; the sum of the
        character over an affine slice is a subspace Kloosterman sum; over the
        whole field |K| <= 2 sqrt(q) (Weil), and over a random subspace the second
        moment argument gives variance 2^{l-2} - the binomial variance - up to the
        correlation term bounded by the Weil bound. This imitates the classical
        equidistribution of Kloosterman sums; it is not proved for fixed slices.
      validation_plan: >-
        For n in {17, 19, 21} and l in {6, 7, 8}, sample 10^4 slices, record the
        |V_E| histogram, compare mean and s.d. to 2^{l-1} and 2^{l/2 - 1} and the
        upper tail to the binomial tail (fraction above 2^{l-1} + 2 s.d. must be
        0.023 +- 0.005); a heavier tail is reported as structure and would make the
        enrichment gain LARGER than predicted.
    - id: H2
      statement: >-
        The per-instance UNSAT cost of the exhaustive-core PDP does not depend on
        which affine slice V is used at fixed l (c within 10%).
      rigorous_support: >-
        The leaf count 2^{3l} is a property of the block sizes, not of the basis
        (IDEA-20260915-0d8e90 Proposition-1 reading); the ANF differs only in
        linear terms.
      validation_plan: >-
        Step (4) of the minimal test on >= 20 U instances per cell for the shipped
        and designed V; report c for both with IQRs.
  target_complexity:
    time_exponent: >-
      T_rel divided by a constant in [3, 8] at l = 6 (predicted 4-5 with K = 10^4),
      decaying toward 2 as l grows; exponent 1 in n of the SAT pipeline and 1/2 of
      rho unchanged.
    memory_exponent: Unchanged.
    best_known: >-
      Shipped Trimoska V with Lambda(V) from the balanced split; rho with negation
      0.886 2^{n/2} (KN-LIT-042 / KN-LIT-73f7e1).
    hidden_overhead: >-
      The one-off slice search costs K * 2^l trace evaluations (2.6e6 field
      operations at l = 8, K = 10^4), negligible; the descent generator must
      support affine slices.
    tradeoff_note: >-
      No memory traded; the gain is realised entirely in fewer targets per
      relation and is independent of the solver.
  dominated_by: >-
    rho with negation, 0.886 2^{n/2} group operations and O(w) memory (KN-LIT-042,
    KN-LIT-73f7e1); frontier rows checked - rho, exhaustive group search 2^n, the
    exhaustive V^3 table 2^{3l}/6 per cell, and the SAT pipeline 3 c 2^{n+l}
    (IDEA-20260915-0d8e90). The designed-V pipeline at T_rel/8 at best is still
    dominated on time by all of rho and exhaustive search at every n >= 8; this
    record moves a dominated row by a constant and adds a predicted yield column.
  sota_delta: >-
    Constant factor 3-8 on the relation-search phase (predicted 4-5 at l = 6,
    K = 10^4; cap 8), no exponent moved; plus a yield row predicted from (F1, F0,
    r) that would have shown a 3.7x cell-to-cell yield difference at fixed l = 6
    between (17,6) and (19,6) in RUN-ICPERF-305ca3 (proposal-time exhaustive
    count, not evidence).
  estimated_cost:
    implementation: medium
    compute: low
    wall_clock_seconds: 21600
    memory_gb: 1
    note: >-
      Advisory. The exhaustive tables at l <= 8 cost <= 2^24/6 additions per V;
      the slice search is negligible; the generator generalisation is the main
      implementation item; WDSat runs at 3 cells x 40 instances are minutes.
  recommended_priority: high
  inference:
    policy: research-deep
    reasoning_effort: null
