idea:
  id: IDEA-20260816-b7f4f7
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: 'Project the deviation onto its 320-bit column-parity vector: theta acts on that projection
    by an explicit fixed 320-by-320 matrix while rho destroys it, and the round constants inject asymmetry
    OUTSIDE the column-parity kernel, so theta amplifies it on the very next step -- all four facts
    computable with no search'
  class: representation
  claim: '(A) A GENUINELY LOSSY PROJECTION WITH AN EXACT PROPAGATION LAW. Define the column-parity
    map P : GF(2)^1600 -> GF(2)^320 by P(A)[x][z] = XOR over y of A[x][y][z]. This discards 1280 of
    1600 dimensions. Directly from the theta definition, and because each of the five lanes in a column
    receives the SAME correction D[x][z] and five is odd, the column parity after theta is P(theta(A))[x][z]
    = P(A)[x][z] XOR P(A)[x-1][z] XOR P(A)[x+1][z-1]. This is a self-contained 320x320 GF(2) map Theta_P
    that depends on nothing but P(A). The projection therefore propagates DETERMINISTICALLY through
    theta, which is the property inventor-protocol section 2 demands. (B) IT DIES AT RHO, AND THE
    DEATH IS MEASURABLE. rho rotates each lane by its own offset, so lanes within a column are rotated
    differently and the column parity after rho is not a function of the column parity before it.
    This contract measures the death rather than asserting it: for a fixed target value of P(A), sample
    many A in the fiber and record the entropy and support of P(rho(A)). That is exactly the observation-collision
    test of KN-TECH-080 audit 2 applied to this observable, and its answer is the survival score.
    (C) THE ROUND CONSTANTS SIT OUTSIDE THE KERNEL. The CP-kernel {A : P(A) = 0} has dimension 1280
    and theta acts as the identity on it. The asymmetry injected by iota lives entirely in lane (0,0),
    so its column parity is P(eps_i)[0][z] = eps_i[z], which is nonzero whenever eps_i is. The injected
    deviation is therefore NEVER in the CP-kernel, and theta amplifies it immediately at the next
    step. That is a sharp, forced, zero-search structural statement about the interaction of iota
    and theta that this repository has never recorded. (D) THE NEARBY-OBJECT CONTROL AND WHAT IS NOT
    CLAIMED. A design variant in which iota XORs the constant into all five lanes of column x = 0
    puts the injection INSIDE the CP-kernel, and the contract runs it as the nearby object. It is
    NOT claimed that the variant is weaker, stronger, or sensible; it is a control. No attack, no
    complexity, no claim that column parity is the right observable -- part (B) is designed to show
    it is not sufficient -- and nothing about full 24-round SHA-3.'
  mechanism: 'STAGE 1: build P as a 320x1600 GF(2) matrix and verify rank 320, so the projection is
    surjective and the CP-kernel has dimension exactly 1280. STAGE 2: build Theta_P as a 320x320 GF(2)
    matrix from the derived law and VERIFY it against the full permutation by checking P(theta(A))
    = Theta_P(P(A)) on 10^5 random A -- the derivation in claim (A) is a four-line argument and must
    be checked, not believed. STAGE 3: compute the rank, order and minimal polynomial of Theta_P,
    and the dimension of its kernel, which is the subspace of column-parity patterns theta annihilates.
    STAGE 4: quantify the death at rho. Fix 100 target values p in GF(2)^320; for each, sample 10^4
    states A with P(A) = p by drawing uniformly from the coset; compute P(rho(A)) and record the number
    of distinct values, the empirical entropy, and whether the fiber maps to a single value (which
    would falsify the death claim). STAGE 5: compute P(eps_i) for all 24 round constants and record
    whether it is ever zero. STAGE 6: run the whole pipeline on the all-column variant of iota as
    the nearby object, and on the null arms. REFUTATION: claim (A) is refuted if stage 2 finds any
    disagreement; claim (C) is refuted if P(eps_i) = 0 for some i, which would identify a round whose
    injection theta ignores -- an outcome more interesting than the claim itself.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/ docs/` from the
      repository root: four proposals (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc, IDEA-20260809-ce875b,
      IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), GOAL-SHA3-001 and five sibling goals,
      two decisions, and a block of KN-LIT files. Then per-noun counts over ledger/proposals/ and
      ledger/hypotheses/: translation-invariant (4, all ECDLP/AES), symmetry-decay (0), "internal
      differential" (0), sponge (2), "invariant subspace" (2), "chi step" (0), "rate/capacity" (0).
      Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001, KN-TECH-080 in full, docs/inventor-protocol.md
      sections 1-8, and headers of KN-TECH-066, KN-TECH-073, KN-TECH-074, KN-TECH-056. Additionally
      grepped ledger/proposals and ledger/hypotheses for `column parity`, `parity kernel`, `CP-kernel`
      and `projection` and inspected the hits.'
    results: Zero hits for column parity, parity kernel or CP-kernel anywhere in the ledger. `projection`
      hits are all about the lossy-projection test in the methodological sense (docs/inventor-protocol.md
      section 2, KN-TECH-056) and about projective coordinates on elliptic curves; none is a linear
      projection of a permutation state. The two `invariant subspace` hits are multivariate-signature
      objects (IDEA-20260813-c9bec2, IDEA-20260808-ae175e).
    verdict: 'UNVERIFIED. Nothing is asserted about external literature, where column parity is very
      likely a standard notion in the analysis of this permutation. NEW relative to this repository:
      no linear projection of a permutation state with a derived propagation law exists in any record.
      ASSEMBLED FROM KNOWN PARTS: the propagation law is a four-line consequence of the published
      theta definition and the parity of five; the fiber-entropy measurement is KN-TECH-080 audit
      2; the nearby-object variant is audit 4. The contribution claimed is the committed computation
      of Theta_P, its spectrum, the measured death at rho, and the forced fact that iota injects outside
      the kernel.'
  object_first_candidate:
    tracked_object: The column-parity vector P(D_r) in GF(2)^320 of the deviation, followed through
      the round function; and, at the point where it fails to propagate, the FIBER P^{-1}(p) whose
      spread under rho is the measured quantity.
    lossiness: 'P discards 1280 of 1600 dimensions -- a 5:1 collapse within each column, forgetting
      which of the five lanes carried a bit and keeping only the parity. The discard is compatible
      with theta because theta''s correction is constant across y within a column and five is odd,
      so the retained parity determines its own image. It is NOT compatible with rho, and that incompatibility
      is the entry''s central measurement rather than a hidden weakness. This is exactly the kind
      of object inventor-protocol section 2 asks for: something is genuinely thrown away, the remainder
      propagates deterministically through part of the round, and the point of dissolution is identified
      precisely.'
    propagation: P(theta(A)) = Theta_P(P(A)) exactly, where Theta_P[x][z] takes P(A)[x][z] XOR P(A)[x-1][z]
      XOR P(A)[x+1][z-1]. Through pi the parity vector permutes columns in a way that must be computed
      rather than assumed, since pi moves lanes between columns. Through chi the parity is not preserved
      because chi is nonlinear across the x-direction within a row. Through rho it dissolves. The
      entry's deliverable is the exact statement of which of these four steps preserve the projection
      and by what matrix.
    survival_score: 'One step. The projection survives theta exactly, is predicted to survive pi as
      a permutation of coordinates, and dissolves at rho and chi. The concrete number reported is
      the empirical entropy in bits of P(rho(A)) over a fixed fiber of P: zero bits would mean survival,
      and the prediction is above 100 bits, i.e. near-total dissolution. A survival score of one step
      is a modest result stated honestly, and it is precisely the kind of measured obstruction inventor-protocol
      section 4 asks for rather than a fatigue report.'
  null_object_control: 'NULL-RHO: replace the 25 rho offsets by uniformly random offsets, 1000 draws,
    and repeat the fiber-entropy measurement; the death at rho must occur for random offsets too,
    and if Keccak''s offsets give visibly LESS dissolution than random ones that is a specific measured
    property worth recording. NULL-PARITY: replace P by a random surjective 320x1600 GF(2) map and
    repeat stages 1-4; a random projection should NOT propagate through theta by any 320x320 matrix,
    and stage 2 must fail for it. That second null is the sharper one: it establishes that the propagation
    law in claim (A) is a fact about column parity specifically and not an artifact of projecting
    to 320 dimensions. Both nulls run in the same invocation by the same code path with only the projection
    or offsets swapped.'
  discriminated_from:
  - The companion active-row contract -- that one tracks the full 1600-bit deviation and never projects;
    this one is the only entry in the bucket that constructs a genuinely lossy intermediate representation
    with its own propagation law.
  - The chi-DDT contract -- that one studies row-local nonlinearity; this one studies a column-oriented
    linear projection and identifies rho, not chi, as the point of dissolution.
  - IDEA-20260808-ae175e (MAYO Kronecker factorisation) -- also a representation-change entry that
    yields an exact rank identity, but over quadratic forms in a signature scheme, with no permutation,
    no round function and no translation group.
  - Generic 'find an invariant' searches -- the projection here is written down first from the step
    definitions and then tested, and the entry's expected outcome is that it FAILS after one step,
    which is stated in advance rather than discovered and spun.
  assumptions:
  - The theta definition as transcribed, including the z-shift by one on the C[x+1] term, is correct;
    validated by hashlib digest reconstruction.
  - Five, the number of lanes per column, is odd -- which is what makes the parity self-propagating
    and is the load-bearing arithmetic fact.
  - Empirical entropy over 10^4 fiber samples is an adequate measure of dissolution at 320 output
    bits; it saturates well below the true entropy and is reported as a lower bound rather than an
    estimate.
  - pi's action on column parity is a coordinate permutation; verified in stage 2 rather than assumed.
  predictions:
  - metric: agreement of P(theta(A)) with Theta_P(P(A)) over 10^5 random states
    direction: higher
    minimum_effect: 1.0
  - metric: rank of Theta_P as a 320x320 GF(2) matrix
    direction: different
    minimum_effect: no pre-commitment on the exact value; the kernel dimension of Theta_P is the interesting
      unknown and pre-committing would prejudge whether theta annihilates any parity pattern
  - metric: number of rounds i in 0..23 with P(eps_i) = 0
    direction: lower
    minimum_effect: 0
  - metric: empirical entropy in bits of P(rho(A)) over a fixed fiber of P
    direction: higher
    minimum_effect: 100
  - metric: stage-2 agreement rate for the NULL-PARITY random projection
    direction: lower
    minimum_effect: 0.01
  minimal_test:
    design: Stages 1-3 and 5 discriminate and cost under ten minutes. Build P as a 320x1600 matrix
      and confirm rank 320. Build Theta_P from the derived law and test P(theta(A)) = Theta_P(P(A))
      on 10^5 uniform random states; a single disagreement kills claim (A) immediately and cheaply,
      and a clean pass establishes the propagation law as a checked fact of this repository rather
      than a four-line argument in a proposal. Compute rank, kernel dimension and minimal polynomial
      of Theta_P -- these are 320x320 operations and finish instantly, and the kernel dimension answers
      whether theta annihilates any column-parity pattern at all, which is the single most useful
      number this entry can produce. Then compute P(eps_i) for the 24 round constants by direct XOR
      and check whether any vanishes. If P(eps_i) is nonzero for all 24, claim (C) is established
      outright with no sampling anywhere. The fiber-entropy stage and the nulls add the dissolution
      measurement and cost an hour more.
    controls:
    - 'NULL-PARITY: a random surjective 320x1600 projection put through stages 1-4; stage 2 must fail
      for it.'
    - 'NULL-RHO: 1000 random offset sets, fiber-entropy measurement repeated.'
    - 'CP-kernel identity control: theta must act as the exact identity on 10^4 random states drawn
      from ker(P), by direct evaluation.'
    - 'All-column iota variant as the nearby object: injection inside the CP-kernel, whole pipeline
      rerun.'
    - 'Digest control: the transcribed theta must participate in a full permutation that reproduces
      hashlib digests before any projection is computed.'
    required_metrics:
    - rank of P and dimension of the CP-kernel
    - agreement rate of P(theta(A)) with Theta_P(P(A))
    - rank, kernel dimension, order and minimal polynomial of Theta_P
    - P(eps_i) and its weight for i = 0..23
    - empirical entropy and distinct-value count of P(rho(A)) over fixed fibers
    - theta-identity verdict on CP-kernel samples
    - NULL-PARITY stage-2 agreement rate and NULL-RHO entropy distribution
  falsification_conditions:
  - P(theta(A)) differs from Theta_P(P(A)) for any of 10^5 random states -- claim (A) is wrong and
    the representation has no propagation law.
  - theta fails to act as the identity on any state in ker(P) -- the kernel characterisation is wrong.
  - P(eps_i) = 0 for some round i, falsifying claim (C) and identifying a round whose injection theta
    ignores.
  - P(rho(A)) is constant over a fixed fiber of P, meaning the projection survives rho after all and
    the survival score is wrong in the favourable direction.
  - The NULL-PARITY random projection also satisfies a 320x320 propagation law, which would mean stage
    2 tests nothing.
  - rank(P) is less than 320, contradicting surjectivity of the column-parity map.
  confounders:
  - Empirical entropy over 10^4 samples saturates far below 320 bits, so 'more than 100 bits' is a
    resolution-limited statement and is reported as a lower bound with its saturation ceiling stated.
  - Drawing uniformly from a fiber of P requires a correct coset sampler; a biased sampler would understate
    dissolution, so the sampler is validated by checking that P(A) equals the target for every draw.
  - pi moves lanes between columns, so 'parity propagates through pi' is a claim about a coordinate
    permutation that must be computed; treating it as obvious is the likeliest silent error.
  - The nearby-object variant changes the permutation, so its digests do not match hashlib and it
    cannot be validated the same way; its correctness rests on code sharing rather than on an external
    oracle.
  interpretation_limits:
  - A survival score of one step means column parity is not a useful tracked object beyond theta;
    that is a measured obstruction about this observable and says nothing about SHA-3's security.
  - The fact that iota injects outside the CP-kernel is a structural statement about two step definitions
    and does not imply that the injection is exploitable or that a different injection would be safer.
  - Fiber-entropy figures are lower bounds limited by sample size, not estimates of true entropy.
  - Round-reduced structural analysis only; nothing bears on full 24-round SHA-3 or any deployed use.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. One 320x1600 and one 320x320 GF(2) matrix, 10^5
      permutation-step evaluations and 10^6 fiber samples: under 2^30 bit operations.'
    memory_exponent: No attack memory exponent is claimed. Matrices total well under one megabyte.
    best_known: No incumbent is challenged; no attack is produced. Within this repository the incumbent
      representation of the deviation is the raw 1600-bit vector used by the companion active-row
      contract, and this entry offers a 320-bit alternative that is shown to survive only one step
      -- which is a result about the representation, not about any frontier.
    hidden_overhead: The lower-order term is the fiber sampler and the entropy estimator, both of
      which can quietly produce a comforting number. The human cost is small; the risk is that a clean
      propagation law through one step reads as more progress than one step deserves, which is why
      the survival score is stated as 'one step' in the record's own headline.
  dominated_by: 'n/a (no result claimed). All frontier axes checked explicitly: no attack time, memory
    or data/query row is emitted. As an internal representation comparison, the 320-bit projection
    is strictly dominated by the raw 1600-bit deviation on informativeness beyond one step, and this
    record states that plainly rather than presenting the projection as an improvement.'
  sota_delta: no attack; conceptual/measurement contribution only. The numbers are matrix ranks, kernel
    dimensions and fiber entropies.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That P(theta(A)) = Theta_P(P(A)) holds exactly: 0.85, the derivation
    is short and rests on five being odd, but a z-shift transcription error is a live risk and stage
    2 exists to catch it. That theta acts as the identity on ker(P): 0.9, immediate from the definition.
    That P(eps_i) is nonzero for all 24 rounds: 0.9, since eps_i sits in a single lane and column
    parity of a single nonzero lane is that lane. That the projection dissolves at rho: 0.9 -- and
    this is the outcome I expect, meaning the entry''s most likely deliverable is a precisely measured
    one-step obstruction. That the object is useful beyond one step: 0.1.'
