      points from N odd. STAGE 1 (hours): construct C_+, C_- for 6 prime-order toy curves, verify #J and the basis,
      verify Phi(P, kP) = e_1 + k e_2 exhaustively at p about 2^10. STAGE 2 (minutes): the (L, b) meter on Phi and
      on the decomposition map with controls. STAGE 3 (hours): the split-probability and relation-graph comparison
      of (G4).'
    controls:
    - PGL_2 battery of IDEA-20260807-4fc635 on the x-coordinates of E before gluing; all counts invariant.
    - 'Translation-conjugate null: the instance (P + R, Q + kR) gives identical Stage 3 statistics after retargeting.'
    - Matched random prime-order curve at the same p.
    - Identity, random-label and generic-group (relabelled (Z/nZ)^2) controls of IDEA-20260802-002.
    - 'Known-false object on which the effect must vanish and the representation is a plain coordinate change: the
      split gluing psi = id (codomain E x E), whose factor base is pairs of points of E and whose statistics are
      E''s own.'
    - 'Planted control: line elements with k known, to verify the Mumford pipeline before any blind draw.'
    required_metrics:
    - gluing count and degeneracy flags per curve
    - order and structure of J(F_p) and basis verification
    - (L, b) of Phi and of the decomposition map with controls
    - split probability per arm with intervals; relation-graph degree distribution per arm
    - all control pass or fail
  falsification_conditions:
  - Gluing count not 2 - (G1) wrong.
  - Order of J(F_p) not N^2 or structure not (Z/N)^2 - construction wrong; nothing reported.
  - 'Line-arm statistics deviate persistently: E-A; a factor-restricted signal; independent review before any further
    claim.'
  - Infrastructure failure of genus-2 arithmetic - rule 5, not evidence.
  confounders:
  - At tiny p the degree-1 base is almost all of J and everything splits; keep p >= 2^10 and report coverage.
  - Degenerate gluings (kernel the graph of an automorphism) give a product, not a Jacobian; flag and exclude with
    a count.
  interpretation_limits:
  - 'Even E-A yields no attack: a signal in the degree-1 base must still be converted into a sub-N^{1/2} algorithm,
    which this record does not claim.'
  - 'KN-OPEN-020 CLASS: the degree-1 base on C is a BOUNDED-DEGREE algebraic description on a different group (J(C)(F_p),
    order N^2), inside the class KN-FIND-61347e scopes out. Charged: description O(1) (the curve C); membership
