idea:
  id: IDEA-20260905-0e0982
  title: THE PAIR (P, Q) AS ONE MUMFORD DIVISOR - on a prime-order curve Frobenius acts on E[2] as a 3-cycle, so
    EXACTLY TWO F_p-rational (2,2)-gluings of E with itself are Jacobians J(C_+), J(C_-), each with J(F_p) isomorphic
    to (Z/N)^2 and the ECDLP instance mapped to the line {e_1 + k e_2}; KN-FIND-61347e already closes full genus-2
    index calculus on this object at exponent 1 (a loss of N^{1/2}), so this record tests ONLY its named open forward
    direction - whether the ECDLP line leaves a trace in the degree-1 factor base C(F_p) - predicted none, with
    the (L, b) values of the isogeny projection stated in advance
  class: representation
  claim: 'REPRESENTATION CLASS AND STAGE (RQ-ECDLP-623a32): class R3 (E x E and Kummer-surface gluing - the pair
    as a Mumford divisor on a (2,2)-glued Jacobian); attack stages whose charged cost is addressed are relation
    decomposition (degree-1 factor base on C) and linear algebra over (Z/N)^2; the charged change is NEGATIVE (exponent
    1 versus 1/2) per KN-FIND-61347e, and the record claims only to test that finding''s open corner. Let E/F_p
    have prime order N (so E(F_p)[2] = 0 and Frobenius acts on E[2] as an element of order 3 in GL_2(F_2) = S_3).
    (G1) RATIONAL GLUINGS. A (2,2)-isogeny E x E -> A with kernel the graph of an anti-isometry psi : E[2] -> E[2]
    is F_p-rational iff psi commutes with Frobenius; the centraliser of a 3-cycle in S_3 is the cyclic group of
    order 3, so psi is the identity (split codomain, Kohel''s Montgomery endomorphism, KN-LIT-493) or one of two
    3-cycles, giving two F_p-rational surfaces J_+, J_-, Jacobians of genus-2 curves C_+, C_- whenever the gluing
    is non-degenerate. (G2) THE REPRESENTATION. Phi : E x E -> J is a degree-4 isogeny; N odd, so Phi is an isomorphism
    on F_p-points: J(F_p) = (Z/N)^2 with basis e_1 = Phi(P, O), e_2 = Phi(O, P), and (P, Q = kP) maps to D = e_1
    + k e_2, a Mumford divisor (u(x), v(x)) of degree at most 2 on C. (G3) THE DOMINATING CLOSURE, CITED. KN-FIND-61347e:
    genus-g index calculus on the ambient Jacobian costs O~(N^{2 - 2/g}) = O~(N) at g = 2, a factor N^{1/2} worse
    than rho; the finding names as open a factor-restricted algorithm scaling with N rather than N^2. (G4) THE ONE
    TEST. A divisor D'' splits over the degree-1 base as [R_1] + [R_2] - 2 infinity with R_i in C(F_p) iff u(x)
    splits over F_p, with probability about 1/2 for random D''. PREDICTION: for D'' drawn from the line {a e_1 +
    a k e_2} the split probability, the pair distribution and the relation-graph statistics equal those for uniform
    D'' within bands; the line is invisible to the degree-1 base (E-B). E-A: a persistent deviation - a factor-restricted
    signal, the only thing that could reopen (G3).'
  mechanism: 'OBJECT FRAME. The PAIR is (representation: the Mumford divisor D = Phi(P, Q) on J(C); operation set
    Sigma: the group law of J restricted to translation by degree-1 factor-base divisors [R] - [infinity], R in
    C(F_p), plus Cantor reduction). TRICHOTOMY CLASS: Class I, partial-action, reason: the tracked object is the
    degree-1 relation vector of D over C(F_p), which propagates deterministically only under translation by factor-base
    divisors (F2 on J, as a component); Sigma is not the full translation action of J(F_p). WHAT IS DISCARDED and
    its compatibility: (a) by Phi on GEOMETRIC pairs, the kernel coset (2 bits) - a block system of the translation
    action of E x E (coset partition of the order-4 subgroup {(T, psi(T))}), which is allowed because E x E is not
    of prime order; on RATIONAL pairs Phi discards nothing (a bijection), so in the representation actually used
    the isogeny is a change of coordinates and the record''s only lossy object is the relation vector; (b) by the
    degree-1 decomposition, everything about D'' except which two points of C(F_p) it is a sum of, defined only
    on the splitting half. The line {e_1 + k e_2} is a subgroup of order N in (Z/N)^2; a subgroup of index N meets
    a set of size about p in about one point, and u(x)''s splitting is governed by Frobenius on the two geometric
    points of D'', which depends on D'' through its class and not through the line it lies on unless the line is
    Galois-distinguished, which a subgroup of rational points is not. Forced value: no trace; measured because KN-FIND-61347e
    names exactly this as unclosed.'
  non_generic_operation:
    operation: Genus-2 Cantor/Mumford arithmetic and degree-1 decomposition on C, field-level operations on the
      glued Jacobian that E's group law does not expose; predicted to make no stage cheaper for the embedded instance.
    attack_stage: relation decomposition (degree-1 factor base) and linear algebra over (Z/N)^2
  object_first_candidate:
    tracked_object: The Mumford divisor D = Phi(P, Q) on J(C_+/-) and the line {e_1 + k e_2} it lies on.
    established_families_off_limits: The split-quotient Igusa certificate (IDEA-20260808-fa1d80) and isogeny-class
      transfer (F3, ISO/ICINV) are not the lens; F2 (on J) and F3 (the gluing isogeny) are COMPONENTS (see assumptions).
    lossy_projection_test: 'Phi is lossy (kernel of order 4) and compatible (homomorphism) geometrically, but bijective
      on rational pairs: meter values on rational pairs (L, b) = (0, 1) (a change of coordinates); on geometric
      pairs (2, 1). Stated so the pass is not misread as novelty.'
    survival: (G1) survives every prime-order curve (needs only N odd and E[2] irrational). The object dies as an
      attack at (G3); (G4) probes the corner.
