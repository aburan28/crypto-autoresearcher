  assumptions:
  - 'OFF-LIMITS COMPONENTS USED: F3 (the gluing isogeny Phi, an isogeny of abelian surfaces) and F2 (degree-1 factor-base
    decomposition on J); what is added is the rational-gluing count (G1), the explicit line representation (G2),
    and the line-versus-uniform test (G4).'
  - N prime and odd, E[2](F_p) = 0; the two 3-cycle gluings non-degenerate (checked per curve; a degenerate case
    is recorded, not skipped).
  - Genus-2 arithmetic available at toy scale with certificates.
