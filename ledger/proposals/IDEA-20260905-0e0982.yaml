    unnecessary (every class is a sum of at most 2 base elements); time O~(p^{2-2/g}) = O~(N) with the double-large-prime
    variation; memory about p = N for the base and relations. All charged; the exponent is 1, and the record claims
    nothing below it.'
  - H-ECDLP-f9a627's obstruction (ambient p^2 versus target n about p) covers this object; the record's (G4) arm
    is the same shape as f9a627's conorm arm and is a companion measurement, not an independent test of the barrier.
  - Toy tier; (G1)-(G2) are scale-free derivations flagged as such.
  heuristic_assumptions:
  - id: H1
    statement: For uniform D' in J(F_p), u(x) splits over F_p with probability 1/2 + O(p^{-1/2}); the same holds
      for D' uniform on the ECDLP line.
    rigorous_support: 'RIGOROUS: Chebotarev for the degree-2 cover of the symmetric square of C over J restricted
