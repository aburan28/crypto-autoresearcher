idea:
  id: IDEA-20260814-270e03
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-08-14'
  proposed_by: idea-generator
  status: proposed
  class: control

  title: >-
    Target-shift coordinate-word recurrence gate: require a collision-bounded
    companion-state decoder before treating low linear complexity as ECDLP leverage

  object: >-
    TRACKED OBJECT. Fix a public finite-alphabet predicate psi on x-coordinates and
    the scalar-orbit word s_i=psi(x([i]P)). For a live public target Q=[k]P, the
    queryable shifted word is s^(Q)_j=psi(x(Q+[j]P))=s_{k+j}. Track the linear-
    recurrence complexity of source and shifted windows, minimal-polynomial and
    companion states, state-collision fibers over all toy k, decoder candidates,
    group/predicate queries, arithmetic, memory, and certificates. The object is a
    genuinely lossy coordinate word, not an elliptic net, a full point sequence,
    or an assumed scalar oracle.

  lossy_projection_test: >-
    psi discards the y-coordinate, nearly all x-coordinate bits, and point identity;
    many scalars share each symbol. One symbol has no deterministic group-law
    update, and even a fitted recurrence can collide on finite windows. Only a
    bounded recurrence state propagates deterministically under its companion map.
    Therefore the test exhaustively measures distinct scalar positions producing
    the same source/target state and requires a decoder to enumerate that fiber.
    A short recurrence with an N-sized collision fiber, or a state inversion that
    is another order-N discrete logarithm, falsifies the algorithmic interface.

  claim: >-
    CONDITIONAL NECESSARY-CONDITION GATE, NOT A RESULT. There may exist a public
    coordinate predicate whose scalar-orbit word has recurrence-state length
    L=N^rho with rho<1/2 and whose live-target companion state can be inverted to a
    complete scalar candidate list in N^{1/2-epsilon+o(1)} total work. The minimal
    test expects the opposite from known large-linear-complexity results: it asks
    whether normalized linear complexity, state-collision exponent, and decoder
    cost decisively rule out this cheap-state mechanism on increasing toy sizes.
    No unconditional lower bound, ECDLP closure, short recurrence, or attack is
    claimed. A negative test closes only the frozen predicate and window family.

  mechanism: >-
    Public additions Q+[j]P expose a substring of the scalar-orbit coordinate word
    starting at the unknown index k. If the global word admits a compact linear
    recurrence, a window determines a companion state; if scalar positions map to
    a small state fiber and the companion orbit can be indexed without solving a
    generic finite-field or group DLP, that state could serve as a decoder bridge.
    The proposal makes all three gates explicit: recurrence compression, collision
    entropy, and state-index inversion. Berlekamp-Massey or a fast recurrence
    algorithm is a measurement primitive only. Random balanced words and salted
    predicates are same-shape controls, and spurious finite-window compression
    must disappear as window length increases.

  novelty_status: unverified
  novelty_note: >-
    COMPLETE REPOSITORY SCREEN. All 79 current RQ-ECDLP-002 proposals, all 795
    proposal files, and the 1,166-file legacy ideas tree were screened. The exact
    nearest legacy record is ECDLP-IDEA-006, which proposes a target-indexed rank-
    two elliptic net and Hankel/Toeplitz state compression for index recovery.
    ECDLP-IDEA-011 studies scalar-orbit elliptic-period descent, and
    IDEA-20260802-006 measures Fourier bias of scalar index sets. Static
    preprocessing lower-bound records ECDLP-IDEA-165, ECDLP-IDEA-374, and
    IDEA-20260807-3b91c7 made the initially considered generic cell-probe lane
    duplicative, so it was discarded. The delta here is a deliberately lossy
    finite-alphabet coordinate-predicate word, an exact live-target substring
    interface, exhaustive state-collision fibers, and a mandatory companion-state
    decoder audit. It does not revive the richer elliptic-net mechanism and is
    likely a cheap falsifier rather than a constructive attack. Novelty remains
    unverified.

  primary_sources_checked:
    - >-
      László Mérai and Arne Winterhof, On the linear complexity profile of some
      sequences derived from elliptic curves, arXiv:1509.06909,
      https://arxiv.org/abs/1509.06909. The paper proves large linear-complexity-
      profile bounds for certain functions evaluated on nG, making a cheap
      recurrence a hypothesis to falsify rather than assume.
    - >-
      Ahmadi and Shparlinski, Exponential Sums over Points of Elliptic Curves,
      arXiv:1302.4210, https://arxiv.org/abs/1302.4210. It supplies pseudorandomness
      context for elliptic-curve coordinate sequences, not a state-index decoder.

  assumptions:
    - >-
      E/F_p and the prime-order public subgroup G=<P> are fixed; psi, alphabet,
      coordinate model, window schedule, recurrence algorithm, and decoder audit
      are frozen before live-target shifts are sampled.
    - >-
      psi is public, target-independent, and evaluable from Q+[j]P without knowing
      k. Predicate search cost and rejected predicates are charged as setup/advice.
    - >-
      Exhaustive toy scalar enumeration is used only to establish ground-truth
      state collisions and candidate recall; it receives no online decoder credit.
    - >-
      Linear complexity over each declared alphabet field is reported separately;
      symbol encodings and field extensions are not silently optimized post hoc.
    - >-
      Known literature bounds apply only to their stated function and parameter
      families; the experiment neither generalizes them nor claims a lower bound.

  proof_search_map:
    bottleneck: >-
      Determine whether public target-shift coordinate symbols compress to a
      collision-bounded recurrence state whose orbit index can be recovered without
      reintroducing a square-root or order-N discrete logarithm.
    baseline_embedding:
      parameter_slice: >-
        A window too short to determine a recurrence returns all matching scalar
        positions. A recurrence of length at least half the observed window gives
        no compression over storing the window. Exhaustive state lookup is an
        N-entry baseline and receives no algorithmic credit.
      reproduction_check: >-
        Reconstruct every held-out symbol from the fitted recurrence where claimed,
        compare independent recurrence implementations on toy words, and verify
        that every exhaustive candidate state reproduces the live-target window.
    observation_collision:
      observable: >-
        The finite target window, fitted minimal polynomial, and companion state.
      distinct_preimage_search: >-
        Enumerate all toy scalar shifts and collect exact state collision buckets.
        Search for different words, gauges, and predicates with identical short
        recurrence profiles but different continuation or scalar fibers.
    constructive_transforms:
      - transform: target_substring_to_state
        proposed_object: >-
          Convert public symbols psi(x(Q+[j]P)) into a recurrence companion state.
        predicted_gain: >-
          Compress target-dependent observations to L field symbols if a genuine
          short recurrence exists.
      - transform: state_to_scalar_fiber
        proposed_object: >-
          Invert the companion orbit to all scalar positions sharing the live state.
        predicted_gain: >-
          Supply the mandatory candidate decoder and expose whether state indexing
          is merely another DLP.
    quantifier_order: >-
      THERE EXISTS one public target-independent predicate psi and recurrence/
      decoder pair such that FOR RANDOM live targets and FOR ALL target states in
      the declared family, the decoder returns the true scalar with bounded fiber
      and sub-square-root complete cost. psi may not be chosen after reading target
      windows or test-set linear complexities.
    method_ceiling:
      strongest_certifiable_claim: >-
        The proposed test can certify recurrence and collision profiles for frozen
        toy predicates, or falsify their cheap-state interface. It cannot prove an
        unconditional ECDLP lower bound, close recurrence methods generally, or
        establish a cryptographic attack.
      nearby_object_control: >-
        Random balanced cyclic words matched on length, alphabet frequencies,
        negation symmetry, window count, and hash representation. A low-complexity
        reading shared with this null is finite-window overfitting.
    proof_obligations:
      - claim: Live-target symbols are computed without k or source advice.
        responsibility: interface
      - claim: The recurrence reproduces held-out continuation symbols exactly.
        responsibility: correctness
      - claim: Exhaustive state fibers contain every true scalar shift.
        responsibility: correctness
      - claim: State inversion is not another generic DLP or exhaustive table.
        responsibility: interface
      - claim: Complexity and collision exponents are stable across window growth.
        responsibility: heuristic
      - claim: Predicate search, queries, arithmetic, retries, and output are charged.
        responsibility: runtime
      - claim: The conclusion stays conditional and predicate-local.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: normalized linear complexity L_w/w at growing window length w
      direction: higher
      minimum_effect: >-
        For the falsification-oriented default, at least 0.40 on each of the three
        largest windows and within 0.10 of the balanced-random-word null; a
        constructive exception must instead remain below N^0.49 in absolute L.
    - metric: exact held-out recurrence error
      direction: lower
      minimum_effect: >-
        Exactly zero for any state credited as a recurrence; fitted-window accuracy
        alone receives no credit.
    - metric: target-state candidate exponent u=log_N |C_state(Q)|
      direction: lower
      minimum_effect: >-
        A constructive survivor requires target-weighted u<0.49 on the three
        largest completed sizes with exhaustive recall 1.000000.
    - metric: complete state-index decoder exponent
      direction: lower
      minimum_effect: >-
        A constructive survivor requires measured time and memory slopes below
        0.49 without an N-entry table or another group/field DLP.
    - metric: spurious compression under window growth and predicate salting
      direction: lower
      minimum_effect: >-
        At least 75% of any initial gap from the random-word null must disappear
        when the predicate is fully salted or the credited recurrence is rejected.

  minimal_test:
    scope: >-
      Public generated prime-order toy subgroups from 12 through 26 bits; balanced
      one-bit, two-bit, and four-symbol public coordinate predicates; window lengths
      doubling from 32 to the smaller of N/4 and the budget cap; at least 200 live-
      target shifts per completed cell. Fit recurrences on one prefix, test exact
      continuation on a disjoint suffix, enumerate all scalar shifts to form exact
      state buckets, and attempt only preregistered companion-state index methods.
    metrics:
      - linear complexity profile and minimal-polynomial degree
      - held-out continuation errors and recurrence stability
      - state collision bucket sizes, exponent, and exhaustive recall
      - target queries, field/group operations, decoder work, peak bytes, and output
      - finite-field or group-DLP calls made by any state-index method
    controls:
      - >-
        Random balanced cyclic words matched on alphabet histogram, length,
        negation symmetry, and sampled windows.
      - >-
        Isomorphic curve models and coordinate gauges with the same predicate
        definition transported explicitly.
      - >-
        Random target-independent permutations of alphabet labels and salted
        coordinate hashes matched on balance.
      - >-
        Positive-control LFSR words with known recurrence, state orbit, collision
        fiber, and decoder.
      - >-
        The ECDLP-IDEA-006 richer elliptic-net observable as a labeled nearby-
        object control, not merged into this claim.
    decay_control: >-
      Increase both the held-out continuation length and the fraction of symbols
      replaced by a target-independent balanced salt at 0%, 25%, 50%, 75%, and
      100%. Finite-window accidental recurrences must lose exact continuation as
      length grows; algebraic signal attributed to psi must move monotonically to
      the matched random-word profile under salting. Failure to decay is an
      instrumentation or generic-word artifact.
    budget: >-
      At most 2^28 generated symbols in aggregate, 20 GB artifacts, 32 CPU-hours,
      and 16 GB peak RAM. Stop a predicate after two successive largest windows
      have L_w/w>=0.40 and no collision-bounded state, or when any decoder invokes
      an uncharged generic DLP.
    certificate: >-
      Retain curve/subgroup parameters, predicate and salt hashes, source and live-
      target windows, fitted minimal polynomials, held-out reproduction transcript,
      exact collision-bucket hash and true bucket, decoder trace, and [k]P=Q check.

  falsification_conditions:
    - >-
      A fitted recurrence fails to reproduce one held-out symbol while still being
      credited as a deterministic state.
    - >-
      Linear complexity grows proportionally to the window or matches the random-
      word null on the largest preregistered windows, eliminating the cheap-state
      premise for that predicate.
    - >-
      The true scalar is absent from a state collision bucket, or the bucket
      exponent remains at least 1/2.
    - >-
      State inversion needs an N-entry lookup, exhaustive orbit traversal, or a
      generic DLP whose complete cost is not below rho.
    - >-
      Apparent compression survives full predicate salting or disappears under an
      equivalent coordinate gauge without a declared scope restriction.

  confounders:
    - Berlekamp-Massey can overfit a short window
    - the alphabet embedding field can change measured complexity
    - x-coordinate negation symmetry creates deterministic collisions
    - a recurrence state can be compact while its orbit-index problem stays hard
    - predicate search over many masks creates multiple-testing bias
    - exhaustive toy state tables can be mistaken for a decoder
    - literature bounds for one rational function do not cover every predicate

  interpretation_limits:
    - >-
      This is a conditional model ceiling for a frozen lossy-word representation,
      not an unconditional ECDLP lower bound and not a closure of recurrence ideas.
    - >-
      A large measured linear complexity is evidence only for tested curves,
      predicates, windows, and symbol fields.
    - >-
      A short recurrence would still not be an attack until state collisions,
      indexing, retries, memory, advice, and final scalar verification are solved.
    - >-
      The richer elliptic-net lane may behave differently because it retains
      algebraic data intentionally discarded by psi.

  heuristic_assumptions:
    - id: H-WORD-1
      statement: >-
        The normalized linear-complexity profile of a frozen coordinate predicate
        stabilizes as subgroup and window sizes increase.
      random_model_justification: >-
        Balanced random words typically have linear complexity near half the
        observed length, while Mérai-Winterhof prove large profiles for specific
        elliptic-derived sequences; neither fact is a universal theorem for psi.
      validation_route: >-
        Report full profiles over nested windows, adjacent-size slopes, null
        quantiles, and exact held-out error on preregistered predicates.
      falsification_condition: >-
        Profile slopes oscillate, depend on post-hoc alphabet choice, or fail to
        stabilize within 0.10 on the largest two sizes.
    - id: H-WORD-2
      statement: >-
        Exact companion states with the same live-target window have a stable
        target-weighted collision exponent.
      random_model_justification: >-
        For random words, matching-window occupancy supplies a balls-into-bins
        null once overlaps are handled; real cyclic dependence is measured.
      validation_route: >-
        Exhaust every toy shift, report complete bucket distributions and overlap-
        adjusted nulls, and require true-state recall one.
      falsification_condition: >-
        Collision exponents drift by more than 0.10, or rare buckets dominate the
        target-weighted expectation.
    - id: H-WORD-3
      statement: >-
        If a compact recurrence exists, its companion-orbit index admits a public
        inversion whose cost is captured by the declared decoder audit.
      random_model_justification: >-
        No generic random-model theorem grants this; it is the explicit structural
        heuristic whose likely failure prevents a recurrence from becoming an
        ECDLP algorithm.
      validation_route: >-
        Decompose indexing into arithmetic primitives, identify any embedded
        finite-field/group DLP, measure full toy scaling, and verify every output.
      falsification_condition: >-
        Inversion is exhaustive, table-based at size N, invokes generic DLP, or has
        measured time or memory exponent at least 1/2.

  target_complexity:
    time: >-
      Symbol acquisition costs O(w) group additions and predicate evaluations;
      recurrence fitting costs O(w^2) naively or the declared fast alternative;
      candidate output, state indexing, verification, and retries are added. A
      future survivor needs the complete sum N^{1/2-epsilon+o(1)}. This proposal
      currently claims no improvement and expects a large-complexity control.
    memory: >-
      Charge source/target windows, recurrence coefficients, companion states,
      state-index structures, candidate buckets, and emitted certificates. An
      N-entry state table is Theta(N) memory/advice and is disqualifying.
    rho_baseline: >-
      Pollard rho gives expected N^{1/2+o(1)} time with constant stored group
      elements and a complete scalar decoder. It dominates any recurrence gate or
      state-index method at exponent at least 1/2.
    bsgs_baseline: >-
      BSGS gives N^{1/2+o(1)} time and memory with deterministic verification. A
      recurrence method must beat both its time and its relevant memory/data cost.

  complete_cost_boundary:
    preprocessing: >-
      Predicate search, curve-coordinate conversion, source-word construction,
      recurrence fitting, companion-orbit indexing, null calibration, and every
      rejected predicate. Report operations, wall time, and bytes.
    advice: >-
      Predicate definitions, symbol-field embeddings, recurrence coefficients,
      source states, index tables, hashes, and chosen windows. Any target-specific
      state or salt is online cost; an N-entry index is explicit linear advice.
    per_attempt: >-
      Live-target additions, predicate evaluations, recurrence-state recovery,
      collision-list generation, state-index inversion, candidate checks, and all
      failed windows or predicates used for that target.
    success_probability_and_retries: >-
      Report recurrence-existence, exact continuation, state-fiber inclusion,
      decoder emission, and final scalar-verification probabilities separately.
      Expected cost multiplies each retry branch and includes censored failures.
    data_and_output: >-
      Count word symbols, recurrence/state tables, collision buckets, candidates,
      salts, and certificates. Outputting a bucket of size N^u costs Omega(N^u).
    multi_target_amortization: >-
      Divide only frozen source-word and recurrence setup by a declared number T of
      targets on the identical curve. Charge each live-target window, state
      inversion, collision output, retry, and verification online; report break-
      even T and total advice.

  dominated_by:
    - method: Pollard rho
      reason: >-
        It already provides a complete generic decoder at square-root time without
        a recurrence assumption, source word, or state-index table.
    - method: baby-step giant-step
      reason: >-
        It directly indexes the scalar orbit at the square-root frontier; a
        recurrence state whose inversion costs as much gives no advantage.
    - method: ECDLP-IDEA-006 richer elliptic-net representation
      reason: >-
        If algebraic recurrence requires data discarded by psi, the richer net is
        a more informative research object, though it remains independently
        unverified as an ECDLP improvement.

  sota_delta: >-
    Quantitative survivor gate: exact held-out recurrence, candidate-state exponent
    u<0.49, and complete state-index time and memory slopes <0.49 on all three
    largest completed toy sizes, with no N-entry advice or generic DLP. Delta
    versus rho and BSGS today: 0 exponent bits and no algorithm; expected large
    linear complexity would be a predicate-local falsifier only.

  estimated_cost: low
  compute_budget_note: >-
    Generated/public toy groups only. The intended first outcome is a rigorous
    control on a lossy representation, not a claim about live cryptographic keys
    or an unconditional hardness theorem.
  recommended_priority: medium
