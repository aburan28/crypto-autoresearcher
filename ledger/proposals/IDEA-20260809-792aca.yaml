idea:
  id: IDEA-20260809-792aca
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    One forged proof per omission class in a reference sumcheck argument, as a
    complete enumeration rather than a sample
  class: measurement
  claim: >-
    In a multi-round public-coin argument the Fiat-Shamir challenge for round i
    must be derived from the statement, the public parameters, and every prior
    prover message. The omission classes are therefore enumerable: one per
    element that can be left out, plus their combinations. The claim is that for
    each single-element omission there is a CONSTRUCTIVE forgery — a proof of a
    FALSE statement accepted by the honest verifier — and that these can be
    produced in one batch against a small reference protocol.
  mechanism: >-
    Each omission makes some prover choice free after the challenge is fixed. If
    the statement is not hashed, the prover picks the statement last; if a prior
    message is not hashed, the prover rewinds and re-chooses it while keeping the
    challenge; if the round index is not separated, messages from different rounds
    can be transplanted. Each is a direct construction, not a search.
  why_not_a_renamed_known_approach: >-
    The weak-Fiat-Shamir failure mode is published and has been found repeatedly
    in practice. This record's content is the COMPLETE per-class enumeration with
    an artifact for each, produced inside this program, which is what the later
    decidability work is scored against.
  predictions:
  - observable: number of omission classes with a constructive forgery
    metric: count out of the enumerated classes
    predicted: >-
      All single-element omissions of statement or prior messages yield forgeries.
      A class with no forgery is the interesting case: it identifies an element
      that is not load-bearing in this protocol, and the reason must be stated.
  - observable: forgery construction time
    metric: seconds per class
    predicted: Seconds; these are constructions, not searches, and a class requiring search indicates the mechanism is different from the one claimed.
  minimal_test: >-
    Implement a three-to-four round sumcheck-style argument with a parameterized
    transform, enumerate omissions, construct forgeries, and verify each with an
    independently written honest verifier.
  controls:
  - 'COMPLETE-TRANSFORM CONTROL: with the full transcript hashed, no forgery may be constructible; if one is, the protocol implementation is broken independently of Fiat-Shamir.'
  - 'HONEST-PROOF CONTROL: honest proofs of true statements must verify at every omission setting, so that the omissions are invisible to functional testing -- which is the point.'
  falsification_conditions:
  - A forgery is constructible with the complete transform, indicating an unrelated implementation defect.
  - Some single-element omission admits no forgery and no explanation, meaning the enumeration's premise is incomplete.
  interpretation_limits: >-
    Every certificate is against this program's own reference implementation with
    a deliberately weakened transform, labelled as such in the record's title. No
    third-party proof system, library, circuit or deployment is examined or named.
  sota_delta: >-
    No new attack class. Delta: a complete, artifact-backed enumeration that
    serves as ground truth for the decidability question, which is where the
    goal's actual research content lies.
  dominated_by: Externally dominated by the published disclosures of this failure class, stated plainly; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep for Fiat-Shamir: no records. WEB NOT CHECKED.'
  source_refs:
  - Weak Fiat-Shamir disclosures and the sumcheck protocol -- RECALLED, REQUIRED READS.
