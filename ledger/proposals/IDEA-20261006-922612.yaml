idea:
  id: IDEA-20261006-922612
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Image size of Frobenius-chord slopes on y^2 = x^3 + x + 1 over F_7,
    against an equal sample of random chords.
  class: measurement
  claim: >-
    On E: y^2 = x^3 + x + 1 over F_7, let S be the set of points of
    E(F_{7^3}) whose x-coordinate does not lie in F_7, excluding the point
    at infinity. Let I_frob be the number of distinct chord slopes
    λ(P, π(P)) = (y(P)^7 - y(P)) / (x(P)^7 - x(P)) for P in S, and let
    I_rand be the number of distinct chord slopes on a frozen sample of
    exactly |S| ordered pairs of distinct points of E(F_{7^3}). The claim
    is I_frob <= floor(I_rand / 2). The representation is R1 affine
    coordinates. The stage is a coordinate filter in front of relation
    search. The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the affine point (x, y) on
    y^2 = x^3 + x + 1. Operation set Sigma: {π}, the coordinate 7-power
    map, which sends E to itself because the coefficients lie in F_7.
    Sigma is not the translation action. TRICHOTOMY. Coordinate-dependent.
    Reason: λ is a function of the affine chart (Class III of
    IDEA-20260806-c5d183); it is not a block system of a group of
    translations. LOSSY-PROJECTION TEST against Sigma. Discarded: the
    point P, keeping only the slope. Compatible with Sigma: π(P) and
    π^2(P) have slope λ^7, because (a/b)^7 = a^7/b^7 in the field, so the
    Frobenius orbit of the slope is a deterministic function of λ.
    Lossy: the test reports L = log2 of the mean fibre of P |-> λ(P, π(P));
    L >= 1 is required, otherwise the map is a coordinate change and the
    run is void. Priced pair: b = 1 under Sigma, and L is the measured
    fibre loss. Under addition, b is not claimed to be 1.
    OFF-LIMITS. F1-F7 are not the lens. F2 is named only as the stage a
    thin slope image would sit in front of; the measured object is the
    image of λ, not a relation vector. F6 is not the lens: π is the
    operation the slope must survive, not an orbit representative being
    stored. A factor-base reading would be the high-degree class of
    KN-OPEN-020 and is not proposed.
  novelty_status: unverified
  citations:
