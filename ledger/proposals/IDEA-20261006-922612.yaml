      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd7b1.yaml
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        A lossy map does not propagate deterministically under every
        translation. The slope is placed in the coordinate-dependent class.
      verified_by: idea-generator, 2026-10-06, opened ledger/proposals/IDEA-20260806-c5d183.yaml
    - ref: IDEA-20260802-002
      provenance: internal
      claim: >-
        L is log2 of the mean fibre size and b is the mean number of
        distinct images of a sum. Here b is predicted 1 only under {π}.
      verified_by: idea-generator, 2026-10-06, opened ledger/proposals/IDEA-20260802-002.yaml
    - ref: "Silverman, The Arithmetic of Elliptic Curves, chord-tangent group law"
      provenance: recalled
      claim: >-
        The chord through two distinct affine points has slope
        (y2-y1)/(x2-x1) when x2 ≠ x1. The source was not opened.
      verified_by: null
  assumptions:
    - >-
      Pairs with x2 = x1 are dropped from both arms. A sample that loses
      more than one tenth of its pairs on vertical chords is void.
    - >-
      F2 is not the lens. No summation polynomial is built. The group law
      is used only to know that both points lie on E.
    - >-
      The frozen random-chord sample is the first |S| ordered pairs in the
      lexicographic order of a fixed F_7-basis of F_{7^3}, skipping
      vertical pairs until |S| slopes are obtained or the pair list is
      exhausted.
