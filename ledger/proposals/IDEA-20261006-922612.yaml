        does not run that attack.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-1fcdbc.yaml
    - ref: KR-RHO-6239aa
      provenance: internal
      claim: >-
        van Oorschot–Wiener parallel rho needs about √(πn/2) iterations in
        total, with memory proportional to the number of stored
        distinguished points. This proposal does not change that count.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6239aa.yaml
    - ref: KR-RHO-cd86f5
      provenance: internal
      claim: >-
        Teske's r-adding walks with r about 16–20 are established practice
        for the walk constant. This proposal does not choose r.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-cd86f5.yaml
    - ref: KR-RHO-fbd7b1
      provenance: internal
      claim: >-
        Bernstein–Lange grumpy giants raises average-case success after
        1.5√l operations from 0.6753 (random walk) to 0.71875, at square-root
