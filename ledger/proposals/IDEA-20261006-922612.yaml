        For fixed n, Gaudry decomposition is Õ(q^{2-2/n}). This proposal
        does not change that exponent.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        Walking on Frobenius classes changes the constant in front of
        square-root rho, not the exponent 1/2.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: KR-IC-1fcdbc
      provenance: internal
      claim: >-
        Galbraith–Gebregiyorgis and Shantz–Teske conclude that
