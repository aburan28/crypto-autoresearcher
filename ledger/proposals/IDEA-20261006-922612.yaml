    hidden_overhead: >-
      No o(1) term. The comparison is an integer ratio on one extension of
      cardinality 343.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus Pollard
      rho is 0. No time-memory tradeoff is proposed.
