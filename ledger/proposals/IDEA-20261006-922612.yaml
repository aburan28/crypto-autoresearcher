  predictions:
    - metric: ratio of Frobenius-chord slope image size to random-chord slope image size
      direction: lower
      minimum_effect: "I_frob <= floor(I_rand / 2), with both counts taken on exactly |S| slopes"
  minimal_test:
    design: >-
      Curve E: y^2 = x^3 + x + 1 over F_7. Confirm 4*1^3+27*1^2 = 31 is
      nonzero in F_7 and stop if a later implementation gets zero.
      Enumerate E(F_{7^3}). Build S. Compute I_frob. Compute I_rand on the
      frozen pair list. Also compute I_tan, the image size of the tangent
      slopes (3x^2+1)/(2y) on S, as a reported control, not as the success
      test. Null arm: y^2 = x^3 + x + α over F_{7^3} with α^3+α+1 = 0
      (no root in F_7; the run rechecks), and count how many points P of
      the null curve have the coordinate 7-power of P still on the null
      curve. Toy scope is this one extension.
    controls:
      - Discriminant of E is rechecked nonzero before any slope is stored.
      - Identity of field Frobenius on 20 slopes: λ(π(P), π^2(P)) equals λ(P, π(P))^7.
      - Tangent-slope image I_tan is reported beside I_frob.
      - Null curve: the count of points whose coordinate 7-power stays on the null curve is 0.
      - A second slope implementation on the same 20 points, integer agreement required.
    required_metrics:
      - "|S| (integer)"
      - I_frob (integer)
      - I_rand (integer)
      - I_tan (integer)
      - L = log2 of the mean fibre of P |-> λ(P, π(P))
      - null-curve count of points fixed onto the curve by the coordinate 7-power (integer)
  falsification_conditions:
    - I_frob > floor(I_rand / 2).
    - L < 1, so the slope map is not lossy on this curve.
    - Any of the 20 Frobenius checks fails, or the two slope implementations disagree.
    - The null-curve count is positive, so the null curve was not outside every proper subfield.
    - "|S| < 20 or I_rand < 2, in which case the comparison is void rather than support."
  confounders:
    - Vertical chords removed from only one arm bias the image sizes. Both arms drop them and the drop fraction is recorded.
    - A low-degree function such as the tangent slope is also thin. I_tan is reported so a thin Frobenius image that is larger than the tangent image is not read as a special Frobenius constraint.
    - Conjugate slopes λ and λ^7 are distinct field elements, so an orbit of points need not shrink the slope image to one value.
  interpretation_limits:
    - Toy scope: one curve, one extension F_{7^3}. No transfer to cryptographic size is claimed.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0 even if the inequality holds.
    - A passed inequality does not define a factor base. KN-OPEN-020 high-degree membership is not claimed.
    - F1-F7 remain off-limits as the lens. The result is a cardinality, not a relation count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Slopes of chords through two uniformly chosen distinct points of
        E(F_{7^3}), conditional on the chord not being vertical, have an
        image of size at least half the sample whenever the sample size is
        at most half the field. This imitates a uniform draw from a set of
        size 7^3, whose image on m distinct draws is m, and it is not proved
        for the chord-slope rational function.
      rigorous_support: >-
        A uniform sample of m distinct elements of a finite set has image
        size m. KR-RHO-13bf67 bounds generic algorithms that see only the
        group law, not this coordinate function. No opened row proves the
        image size of λ(P, π(P)).
      validation_plan: >-
        On this same curve, draw a second frozen sample of |S| chords with
        the pair order reversed and compare its image size to I_rand. The
        tail check is the empty-bin count of each sample against
        343 * (1 - 1/343)^|S|. If the two samples differ by more than a
        factor of two, H1 is not used to interpret I_frob.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "O(1) field elements beyond the point list; exponent 0 in the group order"
    best_known: >-
      Pollard rho, discrete-log exponent 1/2, with a sqrt(n) class-walk
      constant on subfield curves (KR-RHO-037e22). Gaudry's Õ(q^{2-2/n})
