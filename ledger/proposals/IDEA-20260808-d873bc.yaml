idea:
  id: IDEA-20260808-d873bc
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: Under any memory charge SDitH's binding constraint may be the MPCitH forgery bound
    rather than syndrome decoding at all - compute the crossover memory M* and decide whether
    the d-split question is security-relevant before spending a campaign on it
  class: composition
  claim: 'A signature''s security is the minimum over attack routes, and SDitH has two with
    opposite memory profiles: key recovery by ISD (memory-hungry once advanced variants are
    used) and forgery by grinding the MPCitH transform (memory-free, embarrassingly parallel).
    Charging memory raises the first curve and leaves the second untouched. CLAIM: there is
    a memory budget M* such that for all adversary memory below M* the charged ISD cost at
    SDitH''s (n, k, w, q) exceeds the forgery cost, so the forgery bound BINDS and the entire
    d-split-versus-plain-SD question is security-irrelevant unless the d-split gain exceeds
    the margin between the curves. M* and that margin, in bits, are computable in closed form
    from published parameters and are the deliverable. This reframes GOAL-SDITH-001''s own
    completion criterion: it asks whether a d-split-aware decoder beats charged plain SD,
    and this says the answer only matters if the beat exceeds a computable number.'
  mechanism: Under the full-cost composition this program already applies elsewhere (KN-TECH-035,
    KN-TECH-044), an attack holding M bits of memory pays for it, so a variant with memory
    exponent mu has effective cost at least time times memory. Grinding a tau-fold parallel-repeated
    MPCitH transform costs the inverse of the best mixed cheating strategy's success probability
    with O(1) memory - IDEA-20260805-bf6448 derives that interior optimum. Plotting both against
    the adversary's memory budget gives an increasing-as-memory-shrinks ISD curve (the optimiser
    is pushed toward Prange, per C1-05) and a flat grinding curve. They cross at M*.
  why_not_a_renamed_known_approach: IDEA-20260805-bf6448 computes the grinding side alone;
    IDEA-20260805-43d6df and H-SDITH-d37289 build the ISD side alone. Nobody has put them
    on the same axis, and the axis carries the conclusion. It is not a costing convention
    (IDEA-20260807-c3267e) but a decision procedure that consumes one.
  predictions:
  - observable: Charged ISD cost at SDitH's parameters as a function of adversary memory M.
    metric: log2 operations with memory charged per KN-TECH-035.
    predicted: Monotone decreasing in M, flattening at the free-memory optimum.
  - observable: Forgery cost from the MPCitH two-strategy interior optimum.
    metric: log2 operations, memory O(1).
    predicted: Flat in M.
  - observable: M* and the margin at M = 2^60 and 2^80 bits.
    metric: Crossover memory in bits; margin in security bits.
    predicted: M* above 2^60 bits, so the forgery bound binds for any realistic adversary
      and the d-split gap must exceed the margin (my prior 5 to 20 bits) before it changes
      anything. A margin under 5 bits would mean the d-split question is live and the campaign
      correctly aimed.
  minimal_test: 'Closed-form evaluation, no experiment: instantiate the charged ISD curve
    from C1-05''s frontier at SDitH''s (R, omega) and the grinding curve from bf6448''s interior
    optimum at SDitH''s (tau, N, p), then read off M* and the margin at three memory budgets,
    in exact rationals. Budget under 100 core-seconds. Every input must be transcribed from
    the Round-3 specification, which this program has not read, so step one is obtaining it.'
  controls:
  - MATCHED-TARGET CONTROL - both curves evaluated against the same claimed security category
    and the same cost unit; mixing bit operations with hash calls is the standard way this
    comparison goes wrong.
  - FREE-MEMORY NULL - at M = infinity the ISD curve must reproduce the specification's own
    quoted estimate, else the transcription is wrong and the comparison is void.
  - MODEL-DEPENDENCE CONTROL - report the crossover under both the RAM model and full cost
    so the conclusion's dependence on the model choice is visible.
  confounders:
  - The specification may already charge memory or already state the binding route; reading
    it first prevents rediscovering its own statement.
  - Grinding cost depends on the exact soundness expression, which differs between SDitH's
    hypercube and threshold variants.
  - Round-3 tweaks were due 2026-08-14 and may move parameters; the analysis must name the
    specification version.
  falsification_conditions:
  - The margin favours ISD binding at all realistic M, so the d-split question is squarely
    security-relevant and this proposal simply confirms the campaign's aim.
  - M* falls below any plausible adversary memory, so charging memory does not change which
    route binds.
  - The specification already states which route binds, making the deliverable a transcription
    rather than a derivation.
  interpretation_limits: This decides RELEVANCE, not security. It cannot lower SDitH's security
    and must never be reported as doing so; a finding that the forgery bound binds is a statement
    about where analysis effort should go. Claim tier TOY.
  assumptions:
  - Both routes are quoted at the same security category in the specification.
  - The charged ISD curve from C1-05 is available or can be built.
  heuristic_assumptions:
  - id: HA-1
    statement: Full cost equals hardware quantity times time occupied (the Wiener composition),
      so an attack holding M bits for time T costs at least M T in the comparison.
    rigorous_ingredient: This is a model definition already adopted by this program for its
      ECDLP, lattice and isogeny work (KN-TECH-035, KN-TECH-044), not a claim about hardware.
    distribution_imitated: Not applicable; it is a model choice, and saying so explicitly
      is the point of this entry.
    validation_route: Report the comparison under both the RAM model and full cost, and report
      the memory budget at which the two models' conclusions diverge.
    tail_checks: Report the sensitivity of M* to a factor-of-4 change in the memory-access
      cost assumption.
  target_complexity:
    time_exponent: No new attack; the output is which of two known exponents binds, as a function
      of memory - a selection statement rather than an improvement.
    memory_exponent: The independent variable.
    best_known_baseline: The specification's own quoted security estimates for both routes.
    hidden_overhead_disclosure: Both curves inherit polynomial factors worth tens of bits
      at SDitH's sizes, which can move a 5-to-20-bit margin - the honest reason the conclusion
      may come out indeterminate.
    time_memory_tradeoff: The entire content of the idea.
  sota_delta: Costs under 100 core-seconds and can retarget or confirm a six-batch campaign
    before it starts. That ratio is the argument for running it first among the SDitH ideas.
  dominated_by: 'Nothing inside the corpus: bf6448 and 43d6df each build one curve and neither
    composes them. Externally, a specification that already states the binding route would
    dominate it completely, which is why step one is to read the specification and why this
    is scored medium rather than high.'
  estimated_cost: Implementation LOW. Compute LOW. Blocked on obtaining the Round-3 specification.
  recommended_priority: medium
  honest_prior_of_survival: About 0.9 that the computation completes; about 0.5 that it changes
    the campaign's aim; about 0.3 that the specification already answers it.
  novelty_status: unverified
  novelty_screen: Screened against IDEA-20260801-017, 7504c6, cbd93d, bf6448, 43d6df, H-SDITH-d37289,
    H-SDITH-f1acdd, IDEA-20260807-c3267e, KN-TECH-035, KN-TECH-044, KNOWLEDGE_BARRIERS.txt.
    External unscreened.
  discriminated_from: IDEA-20260805-bf6448 (grinding curve alone) and IDEA-20260805-43d6df
    / H-SDITH-d37289 (ISD curve alone); the composition and the crossover are the content.
  source_refs:
  - KN-TECH-035, KN-TECH-044 (full-cost accounting)
  - GOAL-SDITH-001 completion criteria and next_action ("the first deliverable is the memory-charged
    ISD baseline, not an attack")
