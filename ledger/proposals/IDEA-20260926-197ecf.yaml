  citation_note: >-
    No web search was run. The eigenvalue lambda and the identity x(tau P) =
    x(P)^2 are standard Koblitz facts (recalled) and are re-checked on the toy
    cell by the instrument before use. Every number in claim (D) is this
    session's hand arithmetic and must be recomputed in Python.

  assumptions:
    - >-
      The plain chain and the tau-Horner chain are compared at the SAME V, the
      same n, the same targets and the same closure code path (hash recorded).
    - >-
      Relations are counted as distinct coefficient vectors over F_V after
      identifying P and -P (the x-only base); sign bookkeeping is inherited
      from the CERTBIN instruments.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 (family), F6 (tau), the chain
      presentation. The subspace base is inside KN-OPEN-020's scoped class.
    - Arithmetic only at deployed parameters; executable cells at n in {17, 19}.

  proof_search_map:
    bottleneck: >-
      Whether the m! symmetry factor in the product law can be removed without
      changing the descended system's shape; every prior route (symmetrised
      polynomials, solver-side symmetry breaking) pays in degree, variables or
      solver constraints.
    baseline_embedding:
      parameter_slice: >-
        m = 2 on the Koblitz sibling: the tau-Horner chain is the single
        equation S_3(x_1^2, x_2, x_R) = 0, i.e. the pattern (1, 0) of
        KN-FIND-47da4e's orbit union; the plain chain is its pattern (0, 0).
        The record must reproduce at m = 2 a yield ratio of exactly 2 (= 2!)
        and equal closure work, and on RC-1 itself (ordinary) the plain arm
        must reproduce KN-FIND-5a8d3e's archived labels.
      reproduction_check: >-
        Frozen regression: 10 archived RC-1 U62 and 5 S62 systems through the
        plain-chain code path reproduce their archived W_4 labels; then the
        m = 2 Koblitz cell with exact enumeration of both maps.
    observation_collision:
      observable: >-
        The pair (distinct relations per target, closure work per attempt) for
        the two chains at fixed (n, m, l, V).
      distinct_preimage_search: >-
        A yield ratio near m! could arise from (i) the injectivity of the
        tau-Horner map (the claim) or (ii) a counting error that counts
        orderings as relations in the tau arm only. Separated by the
        relabelled Z/NZ control, where both maps are computed on integers with
        lambda replaced by a random scalar of order n: the ratio must be the
        same m!, showing it is a property of symmetric versus injective maps,
        and by re-verifying every relation as a group identity.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the plain chain link S_3(x(u_{k-1}), x_k, x(u_k)) by
          S_3(x(u_{k-1})^2, x_k, x(u_k)); in a normal basis this is a rotation
          of the node block. Completeness: every tau-Horner decomposition is
          a solution. Soundness: every solution is re-verified as a group
          identity with the coefficients lambda^{m-k}. Transfer: any subfield
          curve. Cost loss: none predicted (P2).
        predicted_gain: m! in relations per solved attempt; about 2 to 2.5 bits on the budget column.
    quantifier_order: >-
      FOR ALL Koblitz curves and subspace bases V, the descended tau-Horner
      chain is the descended plain chain with rotated node blocks
      (unconditional, by linearity of squaring). FOR the cells (n, m, l) =
      (17, 2, 8), (17, 3, 6), (19, 2, 9), (19, 3, 6): the yield ratio is
      PREDICTED m! within sampling error and the closure-work ratio 1 within
      1.2x. NOT CLAIMED: any per-attempt cost at n = 131.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the named toy Koblitz cells the tau-Horner chain yields m! times
        the distinct relations of the plain chain at closure work within
        [measured] of it; on the ordinary control the [2]-chain doubles the
        descended degree." It certifies nothing about solving cost at m >= 5
        or at n = 131 beyond the arithmetic in claim (D).
      nearby_object_control: >-
        The ordinary RC-1 curve with the [2]-Horner chain (symmetry broken,
        degree doubled) and with the plain chain; the relabelled Z/NZ
        generic control for the counting claim.
    proof_obligations:
      - claim: x(tau P) = x(P)^2 and tau acts on the prime-order subgroup as lambda with lambda^n = 1 (re-checked on the cell).
        responsibility: baseline
      - claim: The descended tau-Horner link is the plain link with the node block rotated (normal basis).
        responsibility: correctness
      - claim: Ordered solution counts of the two chains agree in expectation (KN-FIND-007), distinct-relation counts differ by m! (H1).
        responsibility: success_probability
      - claim: The corrected budget column of claim (D), recomputed in Python.
        responsibility: correctness
      - claim: Every relation is verified as a group identity with coefficients lambda^{m-k}.
        responsibility: correctness
      - claim: Nothing is asserted at n = 131 beyond arithmetic on published constants.
        responsibility: scope

  predictions:
    - metric: P1, yield ratio = (distinct relations per target, tau-Horner chain) / (distinct relations per target, plain chain), pooled over targets, per cell
      direction: higher
      minimum_effect: >-
        Within [0.8 m!, 1.2 m!] at every cell (2 at m = 2, 6 at m = 3); a ratio
        below 0.5 m! at any cell falsifies H1 there.
    - metric: P2, closure-work ratio (GF(2) row operations of W_4 on the tau-Horner descent) / (same on the plain descent), matched targets
      direction: same
      minimum_effect: >-
        Within [0.83, 1.2] on every cell; outside that band on two cells is
        outcome (ii) and is reported for review.
    - metric: P3, descended Boolean degree of one link, ordinary-curve [2]-chain control
      direction: higher
      minimum_effect: at least 5 against 3 for the plain link (measured from the ANF).
    - metric: P4, corrected per-attempt budget column at m = 5, 6, 8 under the producer's model
      direction: higher
      minimum_effect: about 2.3, 2.5, 2.7 bits above 2^13.96, 2^19.77, 2^27.37 (recomputed within 0.3 bit).

  minimal_test:
    design: >-
      CELLS. (a) Koblitz n = 17, y^2 + xy = x^3 + x^2 + 1 over F_2[t]/(t^17 +
      t^3 + 1), order 2 * 65587 (r = 65587 prime; from the review of
      IDEA-20260922-77bf31 and IDEA-20260926-89886c, recomputed at setup);
      (b) Koblitz n = 19, y^2 + xy = x^3 + 1 over t^19 + t^5 + t^2 + t + 1,
      order 4 * 130873 (IDEA-20260926-b48c9d's arithmetic, recomputed); (c)
      ordinary controls RC-1 (n = 17, A = 97044, B = 126251) and the n = 19
      cell (A = 46693, B = 306147). V = {deg < l} in polynomial basis converted
      to a normal basis for the rotation step (or, equivalently, the squaring
      map applied as a 17 x 17 F_2-matrix on the node block; both are
      implemented and must agree). m in {2, 3}, l in {8, 6} at n = 17 and
      {9, 6} at n = 19. Targets: 200 subgroup targets per cell from a recorded
      PCG64 stream, seeds 2026092701..04 one per cell.
      STAGE 0 (zero compute): recompute claim (D); re-check x(tau P) = x^2 and
      lambda on each Koblitz cell.
      STAGE 1 (exact yield, solver-free): for each target, enumerate all
      ordered tuples in F_V^m (2^{ml} <= 2^18 at these cells) and count
      solutions of R = sum P_k (plain) and R = sum tau^{m-k} P_k (tau-Horner);
      count distinct relation vectors for each; verify every relation as a
      group identity. Report P1. Repeat on the relabelled Z/NZ control with
      lambda replaced by a random element of order n.
      STAGE 2 (closure work): descend both chains at m = 3 (macaulay.py's S_3
      builder extended to a two-link chain with an optional rotation on the
      node block; about 150 lines) and run closure.py W_3 and W_4 on 40 matched
      targets per arm; report P2 and the first iteration containing 1.
      STAGE 3 (control): on RC-1 build the [2]-chain link S_3(x([2]u), x_k,
      x(u_k)) with x([2]u) = u^4 + b / u^2 written polynomially (multiply
      through by u^2) and measure its descended degree (P3).
      OUTCOME TABLE. POSITIVE: P1 in band, P2 in band, P3 >= 5, Z/NZ control
      reproduces P1 -- the m! is free on Koblitz curves; the budget column is
      corrected. NEGATIVE: P1 below 0.5 m! on a Koblitz cell with the Z/NZ
      control in band -- H1 fails on the curve (structural collisions of the
      tau-Horner map), mechanism withdrawn. ARTIFACT: the plain arm fails the
      RC-1 regression, any relation fails verification, or the Z/NZ control is
      out of band -- instrument defect, nothing read.
      FALSIFICATION THRESHOLD, fixed now: P1 < 0.5 m! or > 2 m! on any cell;
      P2 outside [0.5, 2] on two cells.
      COST (estimate, order of magnitude): implementation low to medium (a
      chain builder with a rotation option and the exact enumerator, about 250
      lines on gf2n.py, curve.py, macaulay.py, closure.py); compute low,
      minutes for Stage 1 and about 1 to 3 CPU-hours for Stage 2 W_4 at N = 35
      (KN-FIND-c3a917-scale instances). No external solver; nothing is missing.
    cell:
      curve: 'Koblitz n = 17 (a = 1, order 2 * 65587) and n = 19 (a = 0, order 4 * 130873); ordinary controls RC-1 and the n = 19 CERTBIN cell'
      m: 2 and 3
      l: '8 and 6 at n = 17; 9 and 6 at n = 19'
      factor_base: 'V = {deg < l}, polynomial basis, with the squaring matrix applied to node blocks'
      targets: 200 subgroup targets per cell for Stage 1; 40 matched per arm for Stage 2
      seeds: 'PCG64 streams 2026092701..04, recorded'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (general-n variant needed for n = 19, about 100 lines)
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py (group law, Frobenius as squaring)
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py (S_3 descent; NEW two-link chain builder with node rotation)
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py (W_D, certificates, unchanged)
      - 'NEW: exact ordered-tuple enumerator and relation-vector counter (about 60 lines); relabelled Z/NZ replica (about 40 lines)'
    procedure:
      - 1. Stage 0 arithmetic; curve orders recomputed and primality checked.
      - 2. RC-1 plain-arm regression against archived labels.
      - 3. Stage 1 exact yields on all cells and the Z/NZ control.
      - 4. Stage 2 closures on matched targets, certificates verified by the separate process.
      - 5. Stage 3 ordinary-curve [2]-chain degree.
      - 6. Three-row reading; corrected budget column written as an analysis note.
    metrics:
      - name: yield_ratio
        unit: dimensionless
        definition: distinct verified relations per target, tau-Horner over plain, pooled per cell
      - name: closure_work_ratio
        unit: dimensionless (GF(2) 64-bit-word XOR operations)
        definition: W_4 operations on the tau-Horner descent over the plain descent, matched targets
      - name: link_degree
        unit: integer
        definition: Boolean degree of the descended link equation per arm
      - name: certificate_pass_rate
        unit: fraction
        definition: verified relations and refutation certificates over submitted
    controls:
      - 'Plain chain on the same V and targets (the object with the m! symmetry).'
      - 'Ordinary curve (RC-1, n = 19 cell) with the [2]-Horner chain: symmetry broken at a degree cost (null object of the same shape without tau).'
      - 'Relabelled Z/NZ generic control for the counting claim (must reproduce the yield ratio exactly).'
      - 'RC-1 archived regression for the plain code path.'
      - 'Every relation verified as a group identity; every refutation certified.'
    outcomes:
      positive: P1 and P2 in band with controls in band; the m! is free on Koblitz curves and the budget column moves by about 2.3 bits at m = 5.
      negative: P1 fails on the curve with the Z/NZ control in band; H1 false at toy scale, mechanism withdrawn.
      artifact: regression, certificate or Z/NZ control failure; nothing read.
    falsification_threshold: 'P1 < 0.5 m! or > 2 m! on any cell; P2 outside [0.5, 2] on two cells.'
    estimated_cost:
      implementation: low
      compute: 'estimate: minutes (Stage 1), 1 to 3 CPU-hours (Stage 2 W_4), pure Python'
    required_metrics:
      - yield_ratio per cell with exact counts
      - closure_work_ratio and first-iteration-containing-1 per arm
      - link_degree on the ordinary control
      - certificate_pass_rate
