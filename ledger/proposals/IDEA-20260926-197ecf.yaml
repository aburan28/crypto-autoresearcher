      statement: >-
        (Injectivity of the tau-Horner map.) For V a subspace of dimension l
        with ml <= n and distinct P_k in F_V, the tuples (P_1, ..., P_m) and
        (P'_1, ..., P'_m) with sum tau^{m-k} P_k = sum tau^{m-k} P'_k coincide
        except for a fraction O(|F_V|^m / 2^n) of tuples; equivalently the
        map is injective up to the birthday error.
      rigorous_support: >-
        Rigorous ingredient: a collision is a relation sum tau^{m-k}(P_k - P'_k)
        = O among at most 2m base points with coefficients lambda^{m-k}, i.e.
        a nontrivial linear relation among the logs of base points with fixed
        coefficients; imitates the statement that the logs of |F_V| points are
        uniformly random in Z/N, under which such a relation holds with
        probability 1/N per tuple pair.
      validation_plan: >-
        SAMPLE: exact enumeration at the four cells (Stage 1), all tuples.
        COMPARISON: (distinct relations) / (ordered solutions) against 1 minus
        the birthday term |F_V|^m / 2^n. TAIL: the cell with the largest
        deficit; a deficit above 20 percent at any cell refutes H1 there.
        TRANSFER: at n = 131 the birthday term is below 2^-30 at every
        balanced l; the transfer assumption is that no structural collision
        family exists beyond the birthday count, which the Z/NZ control also
        tests.

