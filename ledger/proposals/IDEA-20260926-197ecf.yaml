idea:
  id: IDEA-20260926-197ecf
  question_id: RQ-FROB-7d8dd4
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE TAU-HORNER CHAIN KILLS THE m! AT ZERO DESCENDED-DEGREE COST ON A KOBLITZ
    CURVE: decomposing R = tau^{m-1}P_1 + ... + tau P_{m-1} + P_m over ONE subspace
    base is a chained-S_3 system of identical Boolean shape to the plain chain
    (squaring is a coordinate rotation), whose solutions are m! distinct relations
    instead of m! orderings of one; worth 2.1 to 2.5 bits on the m >= 5 per-attempt
    budget after re-balancing, measurable at n = 17 and 19
  class: mechanism

  claim: >-
    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, x-coordinates of a subspace
    factor base V of dimension l in a normal basis of F_{2^n}; the attack stage
    whose charged cost changes is RELATION COLLECTION (relations per solved
    attempt), with the per-attempt decomposition cost predicted UNCHANGED.
    TARGET ARITY AND BUDGET. m >= 5 on ECC2K-130; priced against the validator's
    re-derived per-attempt oracle budget under the producer's model N = 4r
    (BRIEF-ROUND2 section 1): 2^13.96 at m = 5, 2^19.77 at m = 6, 2^27.37 at
    m = 8. The cap-locus column of IDEA-20260926-4b65e3 (2^32.4, 2^37, 2^42; a
    proposal, unreviewed) is quoted as the alternative model. This record moves
    neither column by more than about 2.5 bits and says so.
    (A) THE OBJECT. On y^2 + xy = x^3 + a x^2 + 1 over F_{2^n} the 2-Frobenius
    tau is an endomorphism with x(tau P) = x(P)^2. Define the tau-Horner
    decomposition of a target R over F_V = {P : x(P) in V} as an ORDERED tuple
    (P_1, ..., P_m) in F_V^m with R = tau^{m-1}(P_1) + tau^{m-2}(P_2) + ... +
    P_m, i.e. the Horner recursion u_1 = P_1, u_k = tau(u_{k-1}) + P_k, R = u_m.
    Each link is the plain addition u_k = tau(u_{k-1}) + P_k, so the chained
    presentation of KN-TECH-b18366 applies verbatim with one change per link:
    S_3(x(u_{k-1})^2, x_k, x(u_k)) = 0 in place of S_3(x(u_{k-1}), x_k, x(u_k)) = 0.
    (B) THE SHAPE IS IDENTICAL AFTER DESCENT. Squaring is F_2-linear, and in a
    normal basis it is the cyclic shift of coordinates; so the Weil descent of
    the tau-Horner chain is the descent of the plain chain with the coordinate
    block of each node u_{k-1} rotated by one position in the link that consumes
    it. Same n(m-1) cubic Boolean equations, same (m-2)n + ml unknowns, same
    monomial support up to a permutation of variables within each node block.
    By IDEA-20260926-917981's Proposition B (closures depend on the set V and
    on x_R, not on the basis), the Macaulay and mutant-closure outcomes M_D and
    W_D of one link are the same; the record PREDICTS equal closure work per
    attempt for the two chains (falsifiable, prediction P2).
    (C) THE YIELD IS m! HIGHER. The plain sum (P_1, ..., P_m) -> P_1 + ... +
    P_m is m!-to-one on tuples with distinct entries and every ordering gives
    the SAME relation; the tau-Horner map (P_k) -> sum tau^{m-k} P_k is
    heuristically injective on tuples (H1), and each solution tuple gives the
    relation log R = sum_k lambda^{m-k} log P_k with lambda the Frobenius
    eigenvalue on the prime-order subgroup (mu of IDEA-20260926-b48c9d), a
    KNOWN scalar. So a target with s ordered solutions of the algebraic system
    yields s distinct relations on distinct supports under the tau-Horner
    chain and s/m! under the plain chain, with the same expected s = |F_V|^m /
    2^n (KN-FIND-007's conservation, which counts ordered tuples). Expected
    relations per attempt rise by m! (720 at m = 6) at identical system shape.
    (D) WHAT IT IS WORTH ON ECC2K-130, HONESTLY. Under the product-law model
    T(B) = m! 2^131 C / B^{m-1} + m B^2 the m! disappears from the first term;
    re-optimising B (my arithmetic, zero compute) moves the free-oracle floor
    from 2^48.44 to about 2^46.1 at m = 5 and the per-attempt budget at the new
    optimum from 2^13.96 to about 2^16.3; at m = 6 from 2^19.77 to about 2^22.3;
    under the cap model B_cap = 2^{131/m} and the budget rises by about 2.1
    bits at m = 5. A 2 to 2.5 bit constant. It is proposed because it is FREE
    (no new variables, no new degree, no shift bits), because it is
    Koblitz-specific (on an ordinary curve the only symmetry-breaking
    endomorphisms are integer multiples, whose x-coordinate maps have degree
    c^2 and double the descended degree, the control arm), and because every
    m >= 5 oracle this lane prices should be priced at the tau-Horner yield
    rather than the plain yield.
    (E) WHAT EACH OUTCOME MEANS. (i) P1 (yield ratio m! at n = 17, 19) and P2
    (closure work ratio 1) both hold, the ordinary-curve [2]-chain control shows
    the degree doubling, the relabelled Z/NZ control reproduces the yield ratio
    (it is a counting fact about a symmetric versus injective map): the m!
    is removed on Koblitz curves at zero per-attempt cost, and the corrected
    budget column is handed to RQ-CERTBIN-836ce2 and RQ-BINSTD-b6f698. (ii) P1
    holds and P2 fails (closure work materially different): Proposition B does
    not cover rotated node blocks as the record reads it, a genuine surprise
    about the closure's coordinate dependence, reported for review. (iii) P1
    fails (ratio far from m!): H1 fails at toy scale, i.e. the tau-Horner map
    has structural collisions on F_V^m, and the record's mechanism is wrong.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the subspace V in a normal basis (so tau
    is a rotation), with the chain nodes u_k as full field elements. Operation
    set Sigma: {translation by a factor-base element followed by tau on the
    running sum} -- the Horner step u -> tau(u) + P, P in F_V -- together with
    tau itself and negation. This is a proper sub-action (translation by
    factor-base elements composed with a fixed endomorphism), not the full
    translation action. TRICHOTOMY: Class I, partial-action, the same class as
    index calculus; the tracked object is the ordered relation vector
    (coefficients lambda^{m-k} on the P_k), which propagates deterministically
    under Sigma (one more Horner step appends a slot and multiplies every
    existing coefficient by lambda) and not under arbitrary translation.
    LOSSY-PROJECTION TEST against Sigma. Discarded: the point R itself and the
    intermediate nodes; retained: the relation vector over F_V. The discard is
    Sigma-compatible (a Horner step acts on the vector as described) and it is
    lossy in the representation used (many R share no relation vector at all;
    a relation vector determines R but R does not determine a vector). It is
    exactly the index-calculus object with the S_m symmetry removed, so it is
    not a change of coordinates on the plain object: the plain relation vector
    is a multiset, this one is a sequence.
    THE ONE OPEN NUMBER. For a Class I object the obligation is coverage
    (IDEA-20260806-c5d183); here it is the injectivity defect of the tau-Horner
    map on F_V^m, measured as the ratio (distinct relations) / (ordered
    solutions), predicted 1 (H1), against the plain chain's exact 1/m! and the
    controls.
    WHY THIS IS KOBLITZ-SPECIFIC. The map x -> x(tau P) = x^2 is the unique
    non-trivial endomorphism whose effect on the descended system is a
    permutation of Boolean variables. On the ordinary CERTBIN curves there is
    no tau; the [2]-Horner chain u_k = 2 u_{k-1} + P_k breaks the symmetry
    equally well as a counting matter but x([2]u) is a degree-4 rational
    function of x(u), so each link's descended equation has Boolean degree
    about twice the plain link's (measured, not assumed, in the control arm).
    OFF-LIMITS COMPONENTS USED, NAMED. F2 (factor-base decomposition) is the
    family; F6 (endomorphism orbit) supplies tau; KN-TECH-b18366's chain
    supplies the presentation. What is added beyond all three: the observation
    that the consecutive-shift pattern of an orbit-union decomposition can be
    written as a chain with rotated node blocks, the m! yield accounting for
    it, and its price on the ECC2K-130 budget column.
    RELATION TO THE ORBIT UNION. Over the orbit union S = union_j sigma^j(V)
    the decomposition into m summands has 131^{m-1} gauge-fixed shift patterns
    (KN-FIND-47da4e); the tau-Horner chain is the single pattern (m-1, m-2,
    ..., 1, 0) written without shift variables, and its relation set is the
    pattern's. It is the cheapest slice of the union, not the union.
    KN-OPEN-020 CLASS: the base is the scoped-out bounded-degree linear
    subspace; unchanged, not escaped.

  novelty_status: unverified

  origin:
    kind: generator_search
    date: '2026-09-26'
    scope: >-
      Generated under TASK-20260926-12a355 (seam S1, algebraic oracles with
      Koblitz structure at m >= 5), from the seam's item "Frobenius-twisted
      summation polynomials ... over an orbit-union base" read as a question
      about which single shift pattern is cheapest to write. OWNERSHIP
      (DEC-20260924-4f8a03 R2, BRIEF-ROUND2 section 2): a Frobenius MECHANISM
      belongs to RQ-FROB-7d8dd4, and the deliverable is a Frobenius-specific
      change to relation yield with a mandatory non-subfield null (the
      ordinary CERTBIN curve), which is that question's required design. The
      concrete cell reuses RQ-CERTBIN-836ce2's instruments and the corrected
      budget column is handed to RQ-CERTBIN-836ce2 and RQ-BINSTD-b6f698 as an
      input. The successor_seam of the review of IDEA-20260922-77bf31 ("tau as
      the free attempt generator on non-stable bases") is credited: this
      record is the tau-inside-the-chain counterpart of that tau-on-the-target
      reading.
    overlap_review: >-
      Grepped knowledge/ and ledger/ for "Horner", "tau-chain", "tau chain",
      "symmetry breaking", "symmetriz", "symmetris", "orbit union", "twisted",
      "S_5", "S_6", "Nagao", "Riemann-Roch", "coupled". Hits and
      discrimination: KN-LIT-796 / KN-LIT-0d9d28 (Galbraith-Granger-Merz-Petit,
      eprint 2020/1315) abstract says "use the Frobenius endomorphism to
      improve symmetry breaking for Koblitz curves" -- the NEAREST prior art;
      whether their construction is this chain could not be checked (abstract
      only, via the KN-LIT entries), so novelty stays unverified and a reviewer
      must read section 4 of that paper first. KN-LIT-92b022 (WDSat) removes
      the m! by symmetry-breaking CONSTRAINTS in the solver (fewer solutions at
      the same yield); this record keeps every solution and multiplies the
      yield. KN-FIND-47da4e prices the (representative, shift) encoding of
      ALL patterns with one-hot bits at m = 2; this record writes one pattern
      with no shift bits. IDEA-20260926-b48c9d's tau-adic object applies the
      shifts to ONE representative (a scalar multiple); here every summand is
      a different base point. IDEA-20260926-178821's base is the target's own
      conjugates; here the base is a fixed subspace. IDEA-20260906-a77711
      Lemma A2 (equivariance) is respected: the chain is one instance, and its
      131 conjugate instances are the images under sigma.

