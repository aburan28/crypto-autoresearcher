idea:
  id: IDEA-20260811-04a75a
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-5ff234
  axis: A1
  claim_tier: toy
  title: >-
    THE SEMAEV SURFACE IS A POINT COUNT, SO L1's CENTRAL PREDICTION IS A THEOREM AND
    NOT AN EXPECTATION: the number of F_p-solutions of S_3 = 0 equals
    p^2 - p + t^2 plus an explicitly enumerable 2-torsion boundary term, hence it is
    an EXACT integer isogeny-class invariant AND an exact quadratic-twist invariant,
    which (i) derives DECOMPOSITION section 5 prediction 1 instead of expecting it,
    (ii) predicts the all-E to all-E^d relation-yield ratio exactly as
    (p-t)(p-t-1)/((p+t)(p+t-1)), giving the gating lane a control with a COMPUTED
    effect size and zero measurement noise, and (iii) makes j = 0 and j = 1728 the
    predicted residual outliers because their sign fibres are larger
  class: measurement
  resource: >-
    R1 (x-coordinates as field elements) and R2 (the curve equation). The measured
    object is the F_p-point count of the summation-polynomial hypersurface, which is
    field data about the model and not a group-operation output.
  admissibility: >-
    Admissible. No endomorphism is applied to any point of G; the object is a
    variety in (A^1)^m and its rational-point count. KN-FIND-b7e091's simulability
    argument does not apply because no oracle returning group elements is proposed.
    The record is an INSTRUMENT and a DERIVATION for lane L1; it proposes no attack
    and claims no exponent.
  p2_p3_flags:
    p2_adjacent: false
    p3_triggered: false
    note: >-
      Factor bases appear only as uniformly random subsets of F_p used to convert a
      point count into an expected yield. No phi-stable factor base is proposed, so
      H-STR-002 and DEFER-BATCH009-001 are untouched in both directions. No quantity
      is compared against the automorphism-discounted rho baseline; the automorphism
      remark in (D) concerns the SIZE OF A FIBRE of the x-map, not a search speedup,
      and is explicitly flagged in interpretation_limits so it cannot be misread as
      a P3 event.

  claim: >-
    Let p > 3, E : y^2 = f(x) = x^3 + a x + b over F_p ordinary with trace t, let d
    be a non-square, E^d the quadratic twist, and let
      V_m(E) = {(x_1, ..., x_m) in F_p^m : S_m(x_1, ..., x_m) = 0},
      N_m(E) = #V_m(E),
    where S_m is Semaev's m-th summation polynomial in the short Weierstrass
    x-coordinate.

    (A) [fact] N_m IS A TWIST INVARIANT, EXACTLY. The F_pbar-isomorphism
        E -> E^d scales x by d, so the x-image variety of E^d is d times that of E
        and S_m^{E^d}(X) = c S_m^{E}(X/d) for a nonzero constant c. Since
        X -> X/d is a bijection of F_p^m, N_m(E^d) = N_m(E) for every m and every
        curve. This is an identity, it costs nothing to check, and it is the
        record's first and cheapest falsifier.

    (B) [open, derived here and to be verified] THE EXACT COUNT AT m = 3. Let
        a_1 = #E(F_p) - 1 = p - t and b_1 = #E^d(F_p) - 1 = p + t be the affine
        point counts. Every affine point of E(F_pbar) whose x lies in F_p satisfies
        pi(P) = +-P, hence lies in ker(pi - 1) = E(F_p) or in ker(pi + 1), the
        embedded twist. Counting triples summing to O:
          all three in E(F_p):        a_1 (a_1 - 1)
          all three in the twist:     b_1 (b_1 - 1)
          mixed:                      forced into E[2] by O-EIGENSPLIT
                                      (IDEA-20260811-01a208 claim (C)), hence
                                      counted by an explicit boundary term B(z)
                                      where z = #{roots of f in F_p} is 0, 1 or 3.
        The x-map is generically 2-to-1 on solution triples (a triple and its
        negation share an x-tuple), so
          N_3(E) = [a_1(a_1 - 1) + b_1(b_1 - 1)] / 2 + B(z, Aut)
                 = p^2 - p + t^2 + B(z, Aut),
        using (p-t)(p-t-1) + (p+t)(p+t-1) = 2p^2 + 2t^2 - 2p. THE RECORD CLAIMS THE
        MAIN TERM EXACTLY AND CLAIMS THAT B DEPENDS ONLY ON z AND ON |Aut(E)|; it
        does NOT claim a closed form for B, and determining B empirically per
        stratum is part of the minimal test rather than an assumption of it.

    (C) THE THREE CONSEQUENCES, IN ORDER OF VALUE TO THE CAMPAIGN.
        (C1) N_3 DEPENDS ON THE CURVE ONLY THROUGH t (and z, |Aut|). Since the
             isogeny class fixes t (DECOMPOSITION T4), N_3 is CONSTANT ON THE CLASS.
             DECOMPOSITION section 5 prediction 1 states, pre-registered, that L1 is
             expected to show ZERO within-class variance in relation YIELD. This
             record turns that expectation into a derivation and explains it: yield
             is a rational-point count on a variety whose point count is a function
             of t. It simultaneously explains why the Groebner-basis proxies are
             expected to show SMALL BUT NONZERO variance -- solving degree is not a
             function of a point count, and the varieties genuinely differ across
             the class even though their point counts do not.
        (C2) THE TWIST RATIO, WITH A COMPUTED EFFECT SIZE. For a factor base F
             chosen uniformly at random from F_p with |F| = n, the expected number
             of all-E relations is (n/p)^3 a_1(a_1 - 1)/2 and the expected number of
             all-E^d relations is (n/p)^3 b_1(b_1 - 1)/2, so
               yield_E / yield_{E^d} = (p - t)(p - t - 1) / ((p + t)(p + t - 1)),
             which at p = 2^14 and |t| near the Hasse bound is about 0.94, a six
             percent effect that is EXACTLY computable and, under exhaustive
             enumeration, measured with zero noise. This is the planted-signal
             control the gating lane has been missing: a second curve that fixes the
             x-line, fixes S_m as a polynomial (IDEA-20260811-01a208 claim (B)), and
             changes the class, with the predicted effect size known before the
             measurement.
        (D) THE PREDICTED OUTLIERS, STATED BEFORE MEASUREMENT SO THEY CANNOT BE
             FITTED AFTERWARDS. The 2-to-1 statement in (B) is the statement that
             the only automorphisms are +-1. For j = 0 (|Aut| = 6) and j = 1728
             (|Aut| = 4) the x-map has larger fibres over part of the variety, so
             those curves must appear as residual outliers with a residual whose
             SIGN and rough magnitude are predictable from |Aut|. If they do not
             appear as outliers, the fibre analysis in (B) is wrong. This is a
             built-in planted signal that costs nothing to include.

    (E) WHAT WOULD MAKE THIS INTERESTING RATHER THAN CONFIRMATORY. If, after
        stratifying by z and by |Aut|, the residual N_3 - (p^2 - p + t^2) is NOT
        constant within a stratum, then the Semaev surface sees something about the
        curve beyond its trace -- a curve-level invariant visible to index calculus
        and invisible to the isogeny class. That would be a genuine within-class
        signal in the gating lane, obtained from an EXACT INTEGER COUNT rather than
        from a noisy solver proxy, and it is the outcome that would move the
        campaign's centre of gravity to the reachability gate T5. The record states
        both branches in advance and prefers neither.

  mechanism: >-
    Semaev's variety is the x-image of the relation variety on the curve, and the
    x-map is a quotient by the sign. Rational-point counts pass through quotients by
    finite groups with an explicit fibre accounting, so the point count of the
    Semaev variety is the point count of the relation variety divided by the generic
    fibre size, corrected on the ramification. The relation variety is a translate of
    a product of point groups, so its rational-point count is a product of group
    orders -- and group orders over F_p are exactly what the trace fixes. The whole
    chain is therefore: trace fixes group order fixes relation count fixes Semaev
    point count fixes expected relation yield. Every arrow is exact. The twist enters
    because the x-map cannot distinguish the two Frobenius eigenspaces, so both group
    orders appear in the same count, symmetrically, which is why t enters only
    through t^2. That symmetry is not an accident to be checked empirically -- it is
    forced by (A), and the fact that (A) and (B) must agree is a free consistency
    check on the derivation.

  why_not_a_renamed_known_approach: >-
    The corpus contains no record that counts rational points on a summation-
    polynomial variety: greps for "point count of the summation", "Semaev variety",
    "number of solutions to S_", and "N_3" over ledger/proposals/ return nothing.
    The nearest neighbours are (i) IDEA-20260807-dadcd2, which computes the DEGREE of
    generalised summation polynomials from a deck group -- a degree is not a point
    count and the two are logically independent; (ii) KN-FIND-a1f3c2, which computes
    the monodromy/Galois group of S_m and concludes there is no exceptional curve --
    a Galois group is again not a point count, and this record's (E) branch is
    precisely the question of whether a curve-level distinction exists that the
    monodromy result does not see; (iii) DECOMPOSITION section 5 prediction 1, which
    ASSERTS zero within-class variance in relation yield as an expectation -- this
    record derives it, and a derivation of a pre-registered expectation is a
    different kind of object from the expectation. The relation-yield-as-density
    calculation in (C2) is standard index-calculus bookkeeping; what is not standard
    is applying it across a TWIST PAIR to obtain a control with a computed effect
    size, which requires IDEA-20260811-01a208 claim (B) to know the two counts live
    on the same variety.

  proof_search_map:
    bottleneck: >-
      The generic fibre size of the x-map on the relation variety. If it is 2, (B)
      holds with an O(p) boundary term; if it is larger on a positive-dimensional
      locus, the main term itself changes and the derivation fails.
    baseline_embedding:
      parameter_slice: >-
        Setting the twist contribution aside (formally, counting only solutions with
        all-+1 Legendre labels) recovers the classical index-calculus relation-density
        estimate n^3/p^3 * #E^2/2 that every Semaev-based analysis already uses. That
        classical estimate is the baseline this derivation must reproduce.
      reproduction_check: >-
        Symbolic: the all-E term of (B) divided by p^3 and multiplied by n^3 is the
        classical density. Frozen fixture: for one toy curve, the measured count of
        all-E solutions must equal a_1(a_1 - 1)/2 exactly, with a_1 obtained
        independently from harness point counting rather than from the formula being
        tested.
    observation_collision:
      observable: >-
        The integer N_3, and its stratified residual N_3 - (p^2 - p + t^2).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is the point. The observable collides
        by construction on (i) a curve and its quadratic twist, forced by (A); (ii)
        any two curves in the same isogeny class, predicted by (C1); (iii) two curves
        with traces t and -t in different classes. The record's entire value is that
        the SIZE of the collision class is the finding: if the collision class is
        exactly "same t^2, same z, same |Aut|", L1 is closed for this functional with
        a named mechanism; if it is strictly smaller, a curve-level invariant exists
        and L1 is live. A collision here is therefore not a falsifier of
        identifiability -- it is the measurement.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure "number of rational points of the summation
          variety", realise it by specialising to m = 3 where the variety is a
          quadric in each variable and hence exhaustively enumerable in O(p^2), and
          add charges only over the proved-disjoint strata all-E, all-twist, mixed.
        predicted_gain: >-
          Converts a solver-proxy measurement with unknown noise into an exact
          integer measurement with zero noise, at O(p^2) rather than the O(p^3) a
          naive enumeration would cost.
      - transform: stronger_invariant
        proposed_object: >-
          Track the labelled count (all-E, all-twist, mixed) rather than the total
          N_3. The total is twist-symmetric and therefore cannot see t; the labelled
          triple sees t linearly and is strictly more informative.
        predicted_gain: >-
          Recovers the sign of t, which the total loses, and supplies the (C2) ratio.
    quantifier_order: >-
      MAIN CLAIM: forall p > 3, forall ordinary E/F_p with f separable, exists an
      integer B depending ONLY on (z, |Aut(E)|, p) such that
      N_3(E) = p^2 - p + t^2 + B. The order is load-bearing: B is quantified AFTER
      p, z and |Aut| but BEFORE the curve, so B may NOT depend on (a, b) beyond those
      three. A B that varies with (a, b) inside a stratum is exactly the falsifier in
      (E), and it is stated this way so that outcome cannot be absorbed by widening
      the definition of B afterwards.
      SECONDARY CLAIM: forall E, N_3(E^d) = N_3(E), with no exceptions and no strata.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim the method can certify is that ONE cost functional --
        expected relation yield in the m = 3 decomposition over a uniformly random
        factor base -- is an isogeny-class invariant, with the mechanism named. It
        certifies nothing about solving degree, first-fall degree, Macaulay rank
        profile, or any functional that is not a rational-point count, and it must
        not be reported as closing L1 as a whole. L1 asks about five functionals;
        this record settles one of them.
      nearby_object_control: >-
        The closest object where the conclusion FAILS is the pair of curves with
        traces t and -t: they have the same N_3 but different group orders and
        different all-E yields. If a proposed L1 measurement cannot distinguish them,
        it is measuring the twist-symmetric part only, and the record's (C2) exists
        precisely to supply a measurement that does distinguish them.
    proof_obligations:
      - claim: an affine point of E(F_pbar) with x in F_p lies in ker(pi-1) or ker(pi+1).
        responsibility: correctness
      - claim: the count of E(F_p)-triples summing to O is a_1(a_1 - 1).
        responsibility: size
      - claim: mixed triples are confined to E[2] and are counted by B(z).
        responsibility: strictness
      - claim: the generic fibre of the x-map on solution triples has size 2.
        responsibility: correctness
      - claim: N_3(E^d) = N_3(E) exactly.
        responsibility: correctness
      - claim: expected yield over a random factor base is (n/p)^3 times the labelled count.
        responsibility: success_probability
      - claim: exhaustive enumeration of S_3 = 0 costs O(p^2) field operations.
        responsibility: runtime

  predictions:
    - observable: twist invariance of the total count
      metric: N_3(E) - N_3(E^d), computed by independent exhaustive enumeration on both curves
      direction: different
      predicted: >-
        exactly 0 for 100 percent of at least 300 curves at 12-14 bits. A single
        nonzero difference falsifies (A) or the enumeration code, and the two are
        separated by the d-square control.
    - observable: the stratified residual
      metric: >-
        R(E) = N_3(E) - (p^2 - p + t^2), tabulated by stratum (z, |Aut|) over a fully
        enumerated toy isogeny class and over matched random curves
      direction: different
      predicted: >-
        R is CONSTANT within each (z, |Aut|) stratum, with variance exactly 0 (these
        are exact integer counts, so there is no sampling error to absorb a
        deviation). Nonzero within-stratum variance is the (E) branch and is the
        single most consequential outcome available from this record.
    - observable: within-class variance of expected yield
      metric: >-
        the labelled all-E count, divided by p^3 and multiplied by n^3, for every
        curve in a fully enumerated toy isogeny class
      direction: different
      predicted: >-
        identical across the class, to the last integer, since the labelled all-E
        count is a_1(a_1 - 1)/2 and a_1 is class-fixed. This is DECOMPOSITION
        section 5 prediction 1, now with a predicted value rather than a predicted
        direction.
    - observable: the twist yield ratio
      metric: >-
        (all-E count) / (all-twist count), measured by exhaustive enumeration, against
        the predicted (p-t)(p-t-1)/((p+t)(p+t-1))
      direction: different
      predicted: >-
        agreement to the last integer after subtracting the boundary term. At
        p = 2^14 and t near the Hasse bound the ratio is about 0.94, so the effect is
        roughly six percent and is far outside any plausible boundary correction.
    - observable: the automorphism outliers
      metric: R(E) for curves with j = 0 and j = 1728, against R(E) for generic j
      direction: different
      predicted: >-
        j = 0 and j = 1728 curves fall in their own strata with a residual differing
        from the generic stratum, in a direction set by the larger x-map fibre. If
        their residual is indistinguishable from generic, the fibre analysis in (B)
        is wrong and the main term is not established.

  minimal_test:
    design: >-
      THIS IS THE CHEAPEST VALID DISCRIMINATOR IN THE BATCH AND IT IS RECOMMENDED
      FIRST. Three stages, all exhaustive rather than sampled, so every number is an
      exact integer and no statistical model is needed.
      STAGE 0 (zero compute). Verify (A) symbolically: expand S_3 for
      y^2 = x^3 + a x + b and for y^2 = x^3 + a d^2 x + b d^3 and check the
      substitution X -> X/d relates them up to a constant. If it does not, stop.
      STAGE 1 (one curve, minutes). Choose p = 4001 (already used by this campaign's
      calibration work, so the harness is known to run there). For every
      (x_1, x_2) in F_p^2, solve the quadratic S_3(x_1, x_2, X) = 0 for X and record
      every root in F_p. This enumerates V_3 in O(p^2) quadratic solves rather than
      O(p^3) evaluations. For each solution compute the Legendre label vector and
      bin into all-E, all-twist, mixed. Compare against
      a_1(a_1 - 1)/2, b_1(b_1 - 1)/2 and B, with a_1, b_1 obtained from an
      independent point count.
      STAGE 2 (one class plus controls, one core-hour at 12-14 bits). Enumerate a
      full toy ordinary isogeny class by small-ell isogeny walks; run stage 1 on
      every curve in the class, on every curve's quadratic twist, on a matched set of
      random curves of the same p with different traces, and on the null object
      below. Tabulate R(E) by stratum.
      No Groebner basis, no solver, no isogeny-graph construction beyond the class
      walk the lane already builds.
    controls:
      - >-
        NULL OBJECT, MATCHED IN SHAPE: a uniformly random polynomial of the same
        multidegree as S_3 -- degree 2 in each of three variables, symmetric -- over
        the same F_p. Enumerate its F_p-solutions identically. Its count must be
        p^2 + O(p^{3/2}) with NO twist symmetry, NO t^2 structure, and no
        Legendre-label structure. If the random polynomial also exhibits the twist
        symmetry, the symmetry is an artifact of the enumeration and every positive
        reading is void.
      - >-
        NULL OBJECT, MATCHED IN COUNT: a second curve of the same p with a DIFFERENT
        trace t'. Its N_3 must differ from E's by exactly t^2 - t'^2 within a
        stratum. This is the control that separates "N_3 sees the class" from
        "N_3 sees nothing".
      - >-
        PLANTED SIGNAL, BUILT IN: j = 0 and j = 1728 curves, whose residual must
        differ from the generic stratum by the automorphism-fibre argument in (D). A
        pipeline that cannot see them cannot see anything and its negatives are void.
      - >-
        INVERSION CONTROL: repeat stage 1 with d a nonzero SQUARE, so E^d is
        isomorphic to E over F_p. Every label must then be +1 or 0, the all-twist bin
        must be empty, and the yield ratio must be undefined rather than 0.94. This
        is the cheapest check that the labelling code is arithmetically correct.
      - >-
        INDEPENDENT POINT COUNT: a_1 and b_1 must come from the harness point counter,
        never from the formula under test, or the comparison is circular.
    required_metrics:
      - N_3 per curve, exact integer, per (p, a, b)
      - the labelled triple (all-E, all-twist, mixed) per curve, exact integers
      - z = #roots of f in F_p, and |Aut(E)|, per curve
      - R(E) = N_3 - (p^2 - p + t^2), tabulated by (z, |Aut|) stratum
      - within-class variance of N_3 and of the all-E count, which must be exactly 0
      - measured yield ratio versus predicted (p-t)(p-t-1)/((p+t)(p+t-1))
      - the same six metrics for the random-multidegree null and the d-square inversion
      - wall-clock and field-operation counts, for the O(p^2) claim

  controls:
    - >-
      Matched-shape null: a random symmetric polynomial of multidegree (2,2,2), which
      must show no twist symmetry and no t^2 structure.
    - >-
      Matched-count null: a curve with a different trace at the same p, whose N_3 must
      differ by exactly t^2 - t'^2.
    - >-
      Built-in planted signal: j = 0 and j = 1728 curves, which must be residual
      outliers in a predicted direction.
    - >-
      Inversion control: d square, under which the all-twist bin must be empty.
    - >-
      Circularity control: a_1 and b_1 from an independent point counter.

  confounders:
    - >-
      THE BOUNDARY TERM IS THE PRINCIPAL RISK. B is O(p) at m = 3 and t^2 is at most
      4p, so the two are the same order of magnitude and cannot be separated by
      magnitude alone. They are separated ONLY by stratification: within a fixed
      (z, |Aut|) stratum at fixed p, B is claimed constant and t^2 varies. Any
      analysis that does not stratify will report a spurious failure, and any
      analysis that lets B depend on (a, b) has absorbed the falsifier and must be
      rejected in review.
    - >-
      DEGENERATE SOLUTIONS. Tuples with a repeated coordinate, with a coordinate at a
      root of f, or with a coordinate where the sign fibre degenerates, all contribute
      to B. They must be counted and reported separately, not silently included.
    - >-
      SUPERSINGULAR CURVES have t = 0 and the twist in the same class; they are not
      counterexamples to (A) or (B) but they occupy a degenerate stratum and must be
      excluded from the ordinary tabulation.
    - >-
      m = 3 ONLY. The derivation is written for m = 3, where S_3 is a quadric in each
      variable and enumeration is O(p^2). At m = 4 the enumeration cost rises and the
      fibre analysis has more cases; the record does NOT claim the m = 4 formula and
      the extension is named as future work, not assumed.
    - >-
      OVER A PRIME FIELD, SEMAEV RELATIONS ARE AN INSTRUMENT, NOT AN ATTACK. There is
      no known subexponential prime-field index calculus. "Relation yield" here is a
      measured property of a variety, and calling it a yield must not be read as
      implying an algorithm that consumes it.

  falsification_conditions:
    - >-
      N_3(E) != N_3(E^d) on any curve. (A) is false or the enumeration is wrong; the
      d-square inversion control separates the two.
    - >-
      Nonzero within-stratum variance of R(E) at fixed p. THE MAIN CLAIM IS FALSE AND
      THE (E) BRANCH IS LIVE: the Semaev surface sees a curve-level invariant beyond
      the trace. This must be independently replicated before any interpretation, and
      it is the outcome that would reopen the gating lane.
    - >-
      Nonzero within-class variance of the all-E count. DECOMPOSITION section 5
      prediction 1 is false as an exact statement, which would be a genuine and
      citable negative against the campaign's own pre-registration.
    - >-
      The measured yield ratio does not match (p-t)(p-t-1)/((p+t)(p+t-1)) after the
      boundary term is subtracted. (C2) is false and the twist is not the control the
      record claims it is.
    - >-
      j = 0 and j = 1728 curves show no residual anomaly. The fibre analysis in (B) is
      wrong, so the main term's factor of 1/2 is unjustified.
    - >-
      The random-multidegree null exhibits twist symmetry. The instrument is measuring
      an artifact and every result is void in both directions.

  interpretation_limits:
    - >-
      Settles ONE of the five cost functionals L1 names (relation yield). Says nothing
      about solving degree, first-fall degree, factor-base decomposition probability
      as a solver-measured quantity, or Macaulay rank profile. Reporting this as
      "L1 is closed" would be a serious misreading.
    - >-
      m = 3, ordinary curves, prime fields, toy scale (12-14 bits). The identities are
      scale-free as mathematics; the enumerations are not.
    - >-
      NO EXPONENT MOVES AND NONE IS CLAIMED. The record is an instrument and a
      derivation.
    - >-
      THE AUTOMORPHISM REMARK IN (D) IS NOT A P3 EVENT. It concerns the size of a
      FIBRE of the x-map, which affects a point count, and it is not a search
      speedup, not a rho step-count claim, and not compared against the
      automorphism-discounted baseline. KN-TECH-018's sqrt(6) is baseline calibration
      and is not invoked anywhere in this record.
    - >-
      A confirmation is a NEGATIVE-THEORY result for the lane: it says the functional
      cannot vary within a class, with a mechanism. It is not evidence that ECDLP is
      hard and is not a lower bound.

  assumptions:
    - p > 3, E/F_p ordinary, f separable, N prime with G of order N inside E(F_p).
    - >-
      Semaev's S_3 as implemented by harness/semaev.py s3_expr is the reduced defining
      polynomial of the x-image of the relation variety (KN-TECH-002).
    - >-
      Hasse: #E(F_p) = p + 1 - t with |t| <= 2 sqrt(p); and #E + #E^d = 2p + 2.
    - >-
      O-EIGENSPLIT as derived in IDEA-20260811-01a208 claim (C): mixed-label solutions
      are confined to the 2-torsion. If that record's (C) fails, this record's boundary
      term is not O(p) and (B) must be redone.
    - >-
      The x-map on the relation variety has generic fibre of size 2 for |Aut| = 2.
      This is the assumption the j = 0 / j = 1728 outlier prediction tests.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Boundary-term stratification.) The correction B in claim (B) is a function of
        (p, z, |Aut(E)|) alone, where z = #{roots of f in F_p}; in particular it does
        not depend on (a, b) within a stratum, and it satisfies |B| = O(p).
      rigorous_support: >-
        The rigorous ingredient is that every contribution to B arises from a locus cut
        out by at least one additional equation -- a coordinate at a root of f, a
        degenerate sign fibre, or a mixed label forced into E[2] -- and each such locus
        is a variety of dimension at most 1 in (A^1)^3, so the Lang-Weil estimate gives
        O(p) rational points. The classical distribution statement imitated is
        Lang-Weil itself: the number of F_p-points of a geometrically irreducible
        variety of dimension r is p^r + O(p^{r - 1/2}).
      validation_plan: >-
        Sampled quantity: B(E) = N_3(E) - (p^2 - p + t^2), computed exactly by
        exhaustive enumeration. Shortcut making the sampling feasible: the O(p^2)
        quadratic-solve enumeration described in the minimal test, which replaces
        p^3 polynomial evaluations by p^2 quadratic root-findings and is what makes
        12-14 bit exhaustive work possible at all. Comparison: within each
        (p, z, |Aut|) stratum, the empirical SET of values of B must be a singleton.
        This is a sharper comparison than a distributional fit and admits no
        tolerance: these are exact integers. Tail check: the stratum with the largest
        |B|, which should be z = 3 with |Aut| = 6, checked against the direction
        predicted by the fibre argument. TRANSFER ASSUMPTION, EXPLICIT: validated at
        12-14 bits only; the record does not extrapolate B to crypto scale and has no
        need to, since B plays no role in any claim about attack cost.
    - id: H2
      statement: >-
        (Factor-base genericity.) For a factor base F chosen uniformly at random from
        F_p with |F| = n, the number of elements of V_3 lying in F^3 is distributed as
        a sum of indicators with mean (n/p)^3 N_3 and with correlations negligible at
        the resolution of the comparison, so the expected-yield formula in (C2) holds
        with relative error o(1).
      rigorous_support: >-
        The mean is EXACT by linearity of expectation and requires no heuristic at all;
        only the variance statement is heuristic. The classical statement imitated is
        the standard smoothness/decomposition heuristic used in every index-calculus
        analysis, namely that a random subset behaves like an independent Bernoulli
        sieve against a fixed variety.
      validation_plan: >-
        Sampled quantity: the count of V_3 points inside F^3 over 10^4 independent
        uniform factor bases at each of n/p in {0.1, 0.2, 0.4}, at p = 4001 and
        p = 2^13. Shortcut: V_3 is enumerated ONCE per curve and then intersected with
        each factor base, so the cost is one O(p^2) enumeration plus cheap set
        intersections rather than 10^4 enumerations. Comparison distribution: the
        empirical mean against the exact (n/p)^3 N_3, and the empirical variance
        against the binomial variance N_3 (n/p)^3 (1 - (n/p)^3). Tail check: the
        largest observed deviation in units of the binomial standard deviation, which
        must not exceed the usual extreme-value range for 10^4 draws; a systematic
        excess indicates correlations among V_3 points and would mean the yield
        formula needs a correction factor. TRANSFER ASSUMPTION: toy scale only.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. Instrument cost: exhaustive
      enumeration of V_3 costs O(p^2) field operations and O(p^2) quadratic
      root-findings, versus O(p^3) for naive evaluation over F_p^3 -- an instrument
      speedup of a factor p, which is disclosed as an INSTRUMENT cost and not as an
      attack cost. This is a building block for lane L1's measurement programme and is
      filed as such.
    memory_exponent: >-
      O(N_3) = O(p^2) integers if the solution set is stored, O(p) if the label
      histogram alone is accumulated streaming. The minimal test uses the streaming
      variant except where the factor-base intersection of H2 requires storage, and
      that is the memory-dominant step.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group operations
      and O(1) memory (KN-TECH-001, KN-TECH-006); the automorphism-discounted variant
      (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031). As an INSTRUMENT,
      the baseline is the lane's existing solver-proxy measurement of relation yield,
      which is a sampled quantity with sampling noise; this record's baseline-beating
      property is exactness, not speed.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic improvement is claimed. Honest
      disclosure in the other direction: the O(p^2) enumeration is exhaustive and
      therefore does NOT scale -- at 32 bits it is 2^64 operations and is out of the
      question. Everything measured here is a toy-scale exact computation whose
      purpose is to check a derivation, and the derivation, not the measurement, is
      what would carry to larger p.
    tradeoff_note: >-
      Not applicable to any attack. For the instrument, the tradeoff is exhaustive
      exactness at O(p^2) versus sampled estimation at O(n^3) for a factor base of
      size n; the record chooses exactness because the predicted effects (a six percent
      yield ratio, a zero-variance residual) are statements that sampling noise would
      obscure at exactly the sizes the campaign can afford.

  sota_delta: >-
    Zero against any attack. Against the lane's own instrument: an exact integer
    measurement replacing a sampled one at O(p^2) rather than O(p^3), and a derived
    prediction replacing a pre-registered expectation. No exponent moves.

  dominated_by: >-
    As an attack, dominated by everything, since it is not an attack. Checked against
    every row of the frontier the program maintains: parallel Pollard rho at
    0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N) time and memory
    (KN-TECH-031); the preprocessing frontier at N^{1/3} online with N^{1/3} advice
    (Corrigan-Gibbs-Kogan, charged in DEC-20260727-008). As an INSTRUMENT, dominated
    by nothing in this repository: no record and no code counts rational points on a
    summation-polynomial variety, established by the greps recorded in
    novelty_screen. Dominated on MATURITY by every existing L1 measurement, since
    those exist and this does not.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that (A) verifies exactly -- it is a substitution. 0.70 that (B)'s main term
    p^2 - p + t^2 verifies with a stratum-constant B on the first attempt; the
    residual risk is not in the group-theoretic count but in the fibre and boundary
    accounting, which is where a short derivation most often loses a factor. 0.85
    that within-class variance of the all-E count is exactly zero. 0.60 that the six
    percent twist ratio is confirmed to the last integer rather than approximately.
    0.10 that the (E) branch fires, i.e. that a curve-level invariant appears -- and
    that low prior is exactly why the measurement is worth running, since the outcome
    would be the campaign's most consequential in either direction. 0.00 that
    anything here moves an exponent.

  novelty_status: speculative

  novelty_screen: >-
    Performed 2026-08-11 against the committed corpus in this worktree. Greps over
    ledger/proposals/ (all records) and, for the first pattern, over the whole
    worktree: "point count of the summation|S_3 = 0|number of solutions to S_|zeta
    function of the summation|N_3" -- NO hits in any proposal, the only hits being
    unrelated uses of the token N_3 in GOAL-SSIQ-001 and an HQC run manifest;
    "relation yield|yield.{0,20}point count|summation polynomial variety|Semaev
    variety" (54 occurrences, 28 files, all of which use "relation yield" as a
    measured solver output rather than as a derived count); "Semaev";
    "quadratic twist|twist"; "kummer|x-line". Records read in full or in relevant
    part: IDEA-20260807-dadcd2 (generalised Semaev, deck group, DEGREE law -- the
    nearest neighbour and a different invariant), IDEA-20260807-e41559,
    IDEA-20260808-45af43, IDEA-20260727-005, DECOMPOSITION.md in full including
    section 5's pre-registered predictions. WEB SEARCH WAS NOT PERFORMED, so EXTERNAL
    novelty is NOT established: counting points on summation-polynomial varieties may
    well appear in the index-calculus literature, and the record does not claim to
    have invented the technique -- it claims the specific identity, the twist
    invariance, and the L1 consequence. novelty_status is speculative because claim
    (B) is a derivation performed in this session and not verified anywhere.

  discriminated_from: >-
    IDEA-20260807-dadcd2 -- NEAREST EXISTING PROPOSAL. It computes the DEGREE of a
    generalised summation polynomial as |Gamma_f|^{m-2} from the deck group of the
    coordinate map, varying the coordinate map with the curve fixed. This record
    computes the RATIONAL POINT COUNT of the standard summation polynomial, varying
    the curve with the coordinate map fixed. Degree and point count are logically
    independent invariants and neither determines the other; dadcd2's result would be
    unchanged if (B) were false and vice versa.
    KN-FIND-a1f3c2 (Semaev monodromy is C_2^{m-2} universally) -- a Galois-group
    statement asserting no exceptional CURVE exists for that invariant. This record's
    (E) branch asks whether an exceptional curve exists for a DIFFERENT invariant, so
    the monodromy finding neither implies nor excludes it. The relationship is
    disclosed rather than claimed as independent.
    DECOMPOSITION section 5 prediction 1 -- states zero within-class variance in
    relation yield as a pre-registered EXPECTATION. This record derives it, predicts
    its exact value, and names the mechanism, which is a different kind of record
    from an expectation and is filed as a derivation of the campaign's own
    pre-registration rather than as an independent discovery.
    IDEA-20260811-01a208 (this batch) -- supplies the structural facts (shared
    summation polynomial, O-EIGENSPLIT) that this record's boundary-term analysis
