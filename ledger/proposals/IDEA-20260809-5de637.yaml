idea:
  id: IDEA-20260809-5de637
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    Pre-register a tolerance, then try to reproduce two published totals from
    their own inputs — and report the miss if there is one
  class: control
  claim: >-
    A costing pipeline that cannot reproduce published totals from published
    inputs cannot support sensitivity claims. The claim is that reproduction is a
    decidable test with a pre-registered tolerance, that at least one published
    total will be reproducible and at least one will surface an input the paper
    does not fully specify, and that recording the second outcome honestly is more
    valuable than reporting only the first.
  mechanism: >-
    Extract each paper's input table, run the pipeline, compare totals against a
    tolerance committed in advance, and for any miss identify whether the cause is
    a missing input, a modelling difference, or an error on either side.
  why_not_a_renamed_known_approach: >-
    Reproduction is ordinary scientific practice and unusual in this specific
    literature, where estimates are typically compared rather than re-derived. The
    pre-registered tolerance is the part that makes the test falsifiable.
  predictions:
  - observable: reproduction outcome per paper
    metric: ratio of computed to published totals against the pre-registered tolerance
    predicted: >-
      At least one within tolerance and at least one outside it. Both inside
      would be a strong validation of the pipeline; both outside would mean the
      pipeline is wrong and nothing else in the goal may proceed.
  - observable: number of inputs that must be assumed rather than read
    metric: count per paper, listed
    predicted: Nonzero for at least one paper; the list is a reproducibility finding about the literature and is recorded as such.
  minimal_test: >-
    Two papers, input tables extracted with page references, tolerance committed
    in a prior record, pipeline run, and outcomes reported with the assumed-input
    list.
  controls:
  - 'PRE-REGISTRATION: the tolerance is committed in a separate record before the comparison runs; a tolerance set afterwards always passes and no later analysis undoes that.'
  - 'ASSUMED-INPUT DISCLOSURE: every input not read directly from the paper is listed with the value used and the reason.'
  falsification_conditions:
  - Both reproductions miss beyond tolerance, disqualifying the pipeline until repaired.
  - Input tables cannot be extracted from either paper, in which case the goal's reproduction criterion cannot be met and the pause condition applies.
  interpretation_limits: >-
    Successful reproduction validates arithmetic, not physics. A reproduced total
    is not thereby a correct prediction about any future machine.
  sota_delta: 'No feasibility claim. Delta: a decidable reproduction result, including the negative case, which the literature does not systematically report.'
  dominated_by: Not dominated by any corpus record; gates every sensitivity record in the goal.
  estimated_cost: Acquisition-dominated; implementation small.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for reproduction control: discipline exists in other goals, not for quantum costing. WEB NOT CHECKED.'
  source_refs:
  - Two published quantum resource estimation papers -- RECALLED, REQUIRED READS, NOT LOCATED.
