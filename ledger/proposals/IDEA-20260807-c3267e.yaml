idea:
  id: IDEA-20260807-c3267e
  question_id: RQ-MCE-e65b3c
  added: '2026-08-07'
  title: ISD-FC-2026 -- a complete, independently reviewed, genuinely scheme-independent code-based
    costing convention -- has no adopting decision, so three code-based goals cannot produce a
    cross-scheme-comparable ISD figure and one task already DECLINED to transcribe published data
    deferring to a binding that does not exist
  class: tooling
  claim: 'DEC-20260802-344883 D-6 states ''ISD-FC-2026 IS NOT ADOPTED... a usable draft, not a
    binding convention''. GOAL-HQC-001 carries the instruction ''DO NOT bind GOAL-SDITH-001 to
    ISD-FC-2026: it is reviewed but NOT ADOPTED''. DEC-20260803-a5b9b1 D-3 retracts GOAL-MCE-001''s
    claim that HQC and SDITH ''already bind to'' it, and its validator confirmed the document
    ''exists, is complete, is independently reviewed and IS genuinely scheme-independent -- but
    is status proposed''. The same decision records the concrete cost: ''TASK-20260803-f3aece
    read Esser-Bellini SEC Table 1 (three memory models x five parameter sets) and DELIBERATELY
    DECLINED to transcribe it, deferring to the non-existent binding.'' No decision anywhere adopts,
    supersedes, amends or rejects the convention, and no goal''s next_action names an adoption
    path. The document exists only at coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md,
    permanently `proposed`. Three code-based goals need it -- GOAL-HQC-001 (active), GOAL-MCE-001
    (active), GOAL-SDITH-001 (draft) -- and none can produce a cross-scheme-comparable ISD figure
    until it is adopted or replaced.'
  mechanism: 'A one-task Coordinator ADOPTION decision, or its honest alternative: a recorded
    finding that the convention should NOT be adopted, WITH THE REASON. Either way the blocked
    deliverable -- the Esser-Bellini SEC Table 1 transcription TASK-20260803-f3aece declined --
    becomes available, and IDEA-20260805-43d6df''s claim that naive charging of a published ISD
    cost is ''WRONG BY 6 TO 10 BITS in a single named direction'' becomes checkable against a
    stated basis. The technical content of the adoption task is small: re-read the convention,
    confirm the three memory models it declares are the ones the three goals need, and state the
    migration rule for figures already computed under private conventions.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - No decision adopts, supersedes, amends or rejects the convention.
    - 'DEC-20260803-a5b9b1 correctly diagnoses the failure and retracts the false binding, but
      its action is NEGATIVE ONLY: it names no successor act, no owner, and no condition under
      which adoption would occur. Under the inventor protocol''s section 4 a closure needs a named
      obstruction plus forward guidance, and here there is not even an obstruction -- the document
      passed its review; it simply has no adopting decision.'
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: proposing a new ISD variant or a new costing
      scheme. The convention already exists and is reviewed.'
    tracked_object: 'The costing convention as a binding artifact: the triple (what is counted,
      under which memory model, with what preprocessing charge).'
    one_step_propagation_rule: A scheme's ISD figure is comparable to another's iff both are expressed
      under the same triple; adoption makes the relation transitive across the three goals.
    newness_score: Zero. This is a procedural act whose absence blocks three goals, and the ledger
      already records it as the third occurrence of the same error family.
  lossy_projection_identifiability_audit:
    projection: an ISD attack -> its cost under a declared convention.
    what_is_discarded: The attack's internals.
    is_it_only_a_change_of_coordinates: 'NO in the sense that matters: two figures under DIFFERENT
      conventions are not comparable at all, so the convention is what creates the comparability.
      Honest caveat: adopting a convention creates no knowledge; it makes existing figures subtractable,
      and that is its entire value.'
    mirror_failure_check: CHECKED. The adoption decision must be able to come out NO. The validator
      already found the document complete and scheme-independent, so a NO would have to name a
      specific defect -- and naming it is as valuable as adoption.
  null_object_control:
    primary_null: 'THE MIGRATION CHECK: recompute one already-published figure under the adopted
      convention and under the private convention that produced it. If the two agree exactly,
      the convention is not doing any work and adoption is cosmetic. If they differ, the difference
      is the size of the comparability problem being fixed, and IDEA-20260805-43d6df predicts
      it is 6 to 10 bits.'
    secondary_nulls:
    - 'SCHEME-INDEPENDENCE GATE: the convention must be statable without naming HQC, McEliece
      or SDitH; the validator already confirmed this and the adoption must re-confirm it.'
    - 'TRANSITIVITY GATE: after adoption, two figures from different goals must be subtractable
      without further argument.'
  assumptions: []
  predictions:
  - metric: difference between a published ISD figure charged naively and charged under the adopted
      convention
    direction: different
    minimum_effect: IDEA-20260805-43d6df predicts 6 to 10 bits in a single named direction; any
      confirmed nonzero value establishes that the convention does real work.
  minimal_test:
    design: Re-read the convention; confirm the memory models against the three goals' needs;
      produce an adoption decision or a reasoned rejection; then transcribe Esser-Bellini SEC
      Table 1 under it and run the migration check on one figure.
    controls:
    - migration check against a private convention
    - scheme-independence gate
    - transitivity gate
    required_metrics:
    - adoption verdict with reasons
    - migrated figure pairs and their delta
    - the transcribed Table 1 under the adopted basis
  falsification_conditions:
  - 'The convention is adopted and the migration check shows a material delta: three goals become
    comparable and a recurring error family is closed.'
  - 'The migration check shows zero delta: adoption is cosmetic and should be recorded as such
    rather than celebrated.'
  - 'A specific defect is found: rejection with a named reason, which is equally valuable and
    is what the current limbo lacks.'
  confounders:
  - An adoption decision is a Coordinator act; a proposal cannot self-adopt.
  - Esser-Bellini Table 1 is a published source; transcription must record its provenance level.
  - The three goals may need different memory models, in which case the convention must declare
    all three as rows rather than pick one.
  interpretation_limits:
  - Adoption creates no new knowledge and no security claim.
  - This record proposes the act; only the Coordinator may take it (AGENTS.md rule 1).
  heuristic_assumptions:
  - id: HEUR-ISDFC-1
    statement: One convention can serve HQC, Classic McEliece and SDitH without per-scheme amendment.
    rigorous_support: The validator's scheme-independence finding, which is a review judgement
      rather than a proof.
    validation_plan: The transitivity gate tests it directly on two real figures.
  target_complexity:
    time_exponent: n/a -- convention
    memory_exponent: Declared as a row, which is the convention's central purpose.
    best_known: Published ISD complexities (Esser-Bellini and predecessors)
    hidden_overhead: Preprocessing and memory-access charges, which private conventions charge
      differently.
    tradeoff_note: A margin claim computed under two conventions is an artifact of the conventions.
  dominated_by: n/a (no attack claimed); procedural artifact.
  sota_delta: 'ZERO. Unblocks every cross-scheme code-based comparison in the program and removes
    a defect the ledger has already recorded as recurring: DEC-20260803-a5b9b1 calls it ''the
    THIRD occurrence of the error family'' and ''the first in the POSITIVE direction'' -- a goal
    asserting that a prior record supports it.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the convention survives re-reading and is adoptable. 0.8
    that the migration check shows a material delta, since IDEA-20260805-43d6df already prices
    it at 6-10 bits. 0.1 that a defect emerges warranting rejection, which would still resolve
    the limbo.
