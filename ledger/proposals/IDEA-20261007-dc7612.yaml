idea:
  id: IDEA-20261007-dc7612
  question_id: RQ-ECDLP-623a32
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Image size of y(P) + y(2P) on y^2 = x^3 + 6x + 1 over F_41
  class: measurement
  claim: >-
    On the nonsingular curve E: y^2 = x^3 + 6x + 1 over F_41, let D be
    the affine points with y(P) ≠ 0 and y(2P) ≠ 0. Let s(P) = y(P) + y(2P).
    The image |s(D)| is at least |D|/4. This is an R1 chart statistic
    on the integer field elements y(P) and y(2P). It does not count a
    tangent-slope fiber, and it does not change a charged attack-stage
    cost.
  mechanism: >-
    OBJECT FRAME. The representation is the field element s(P). Sigma
    is the singleton {[2]}. TRICHOTOMY. Coordinate-dependent: s(-P) =
    -s(P), and s(2P) is not claimed to be a function of s(P).
    LOSSY-PROJECTION TEST. The projection that keeps only s discards
    x. The image of s has size at most 41. The census records |D|.
    If |D| is at most |s(D)|, the projection did not lose a point on
    this curve, and the ratio test is still the priced number.
    The priced number is |s(D)| / |D|, not an orbit cost. Families
    F1–F7 are not the lens.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged stage
        cost. This proposal prices one chart statistic and claims no
        stage-cost change.
      verified_by: ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A sub-square-root algorithm must exploit the representation.
        This proposal does not claim to go under the bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Negation flips y. This proposal uses s(-P) = -s(P) and claims
        no iteration reduction.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
  assumptions:
    - >-
      4·6^3 + 27·1^2 = 891 ≡ 30 (mod 41), so the discriminant is
      nonzero and E is nonsingular. Characteristic is not 2 or 3.
    - Doubling uses the usual tangent slope. Points with y = 0 are outside D.
    - The curve y^2 = x^3 + x + 1 is not used.
  predictions:
    - metric: the ratio |s(D)| / |D|
      direction: higher
      minimum_effect: '>= 1/4'
  minimal_test: >-
    Enumerate E(F_41). Drop points with y = 0 or y(2P) = 0. Compute
    s(P) = y(P) + y(2P) and report |s(D)| and |D|. A second
    enumeration in reverse x-order must produce the same ratio. A
    control that replaces s by the constant 0 must report image size
    1. A control that replaces s by y(P) must report an image of size
    at least 2, or the point list is void.
  controls:
    - reverse-x enumeration agrees on |s(D)| and |D|
    - the constant-0 function has image size 1
    - the function y(P) has image size at least 2
    - points with y = 0 are excluded
    - y^2 = x^3 + x + 1 is not used
  falsification_conditions:
    - >-
      |s(D)| < |D|/4, and the two enumerations agree, and the
      constant-0 control has image size 1.
    - >-
      The two enumerations disagree, or the constant-0 control does
      not have image size 1. The counter is then void, and the ratio
      is not evidence.
  confounders:
    - >-
      Counting P and a second model of the same point after scaling
      (x, y) by a unit double-counts the chart.
    - >-
      Points at infinity are not in D. Folding one in would add a
      value that is not y(P) + y(2P).
  interpretation_limits:
    - >-
      A ratio of at least 1/4 does not change the rho exponent 1/2.
    - >-
      A ratio below 1/4 falsifies this claim on this one curve only.
    - >-
      This is not the tangent-slope fiber of IDEA-20261006-bc1250,
      not an x-rank overlap, and not a modular bucket of x.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On this curve, s(P) = y(P) + y(2P) takes at least |D|/4
        distinct values. A uniform random function from a set of size
        |D| to F_41 has expected image size 41·(1 - (1 - 1/41)^|D|),
        and |D|/4 is below that expectation for |D| near the Hasse
        count. H1 says this particular s meets the lower threshold.
      rigorous_support: >-
        No theorem is claimed. Negation gives s(-P) = -s(P), so the
        image is closed under negation, which caps the image by 40
        nonzero values plus possibly 0. The threshold 1/4 is the
        pre-registered comparison, not a character-sum bound.
      validation_plan: >-
        Compute |s(D)| and |D| on this curve. H1 fails if the ratio
        is strictly below 1/4 while the two enumerations agree and
        the constant-0 control has image size 1. Sample size is the
        whole domain D.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. An image size is not an exponent.
    memory_exponent: >-
      Unchanged. The census stores O(p) field elements at p = 41.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations. The
      file was opened for this proposal.
    hidden_overhead: >-
      No new o(1) cofactor is claimed. The census is one pass over
      F_41.
    tradeoff_note: >-
      No time-memory tradeoff. The census is a single pass.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
