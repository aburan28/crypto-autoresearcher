idea:
  id: IDEA-20260805-250e50
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-05'
  title: >-
    The screen-threshold cost identity: rewriting the p^{1/3+o(1)} exponent as
    E(theta, s, gamma) = (1/2 - 3theta/2)_+ + max(gamma, theta - s), which
    reproduces 1/3 exactly at the incumbent's parameters, returns 1/5 under a
    free exact delta_E threshold test, and converts lever L4 from "is there a
    gradient" into three numbers a run can measure
  class: theory

  claim: >-
    THE INCUMBENT EXPONENT 1/3 IS AN INTERIOR OPTIMUM OF A TWO-VARIABLE COST
    FUNCTION, ONE OF WHOSE VARIABLES THE ARCHIVED ALGORITHM NEVER USES. Run
    Algorithm 2 of the frozen source (inputs/P13-WESOLOWSKI-2026/
    paper_fulltext.md, lines 162-185) at a lowered degree threshold T = p^theta
    instead of the structural bound (p/2)^{1/3}. Lemma 3.4's proof goes through
    verbatim with X = (BT)^{1/2}, so one attempt costs |L| = X^{2+o(1)} =
    p^{theta+o(1)} in BOTH time and memory, and succeeds exactly when the
    sampled curve satisfies delta_{E'} <= T and the degree is B-smooth. Let a
    SCREEN be any predicate S on j-invariants, evaluable in p^{gamma}, that
    admits a p^{-s} fraction of supersingular curves while retaining a
    p^{-o(1)} fraction of those with delta_E <= T. Then the total time exponent
    is
      E(theta, s, gamma) = (1/2 - 3theta/2)_+ + max(gamma, theta - s),
    subject to 0 <= theta <= 1/3 and 0 <= s <= (1/2 - 3theta/2)_+.
    THREE CONSEQUENCES, ALL DERIVED BEFORE ANY RUN.
    (1) At (theta, s, gamma) = (1/3, 0, 1/3) -- which is the incumbent, because
    the incumbent's only delta-test IS building the list -- E = 0 + 1/3 = 1/3,
    reproducing the frozen source's exponent exactly, and at theta = 1/4 it
    returns 3/8, reproducing this campaign's own committed reading
    (coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/
    TASK-20260805-87e568/task_report.yaml, baseline_reproduction_check).
    (2) A screen that is FREE and EXACT (gamma = 0, s = 1/2 - 3theta/2) gives
    E = 1/5 at theta = 1/5 -- BELOW this goal's own stated target of 1/4. The
    p^{1/4} target is therefore not the barrier; the barrier is entirely the
    cost and selectivity of a delta_E screen.
    (3) The break-even is exactly gamma = 1/3: ANY screen strictly cheaper than
    a full list build improves the exponent. Reaching 1/4 requires
    max(gamma, theta - s) <= 3theta/2 - 1/4 for some theta in [1/6, 1/3];
    at theta = 1/4 that is gamma <= 1/8 together with a perfect screen
    (s = 1/8), and at theta = 1/6 it is gamma = 0 with s >= 1/6.
    NOTHING HERE IS AN ALGORITHM. No screen is exhibited. The identity is a
    cost accounting that says what a screen would have to be, and the paired
    experiment measures candidate screens against those numbers.

  object_first_candidate:
    tracked_object: >-
      THE ADMITTED DEGREE THRESHOLD theta = log_p T, treated as a free
      parameter, and its conjugate variable the screen selectivity s. The
      archived algorithm holds theta fixed at 1/3 because Theorem 1.5 makes
      that value free of charge; every candidate ever considered under this
      goal has inherited that choice. Following theta through Lemma 3.4, Lemma
      3.3, Lemma 3.5 and the proof of Theorem 1.1 -- rather than following a
      curve, a lattice vector, or an isogeny -- is the object choice, and it is
      what turns the exponent into a function instead of a constant.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS FOR THIS PROPOSAL: (a) meet-in-the-middle
      / claw finding as a thing to speed up -- the identity takes Algorithm 2's
      claw structure as given and unchanged; (b) van Oorschot-Wiener
      time-memory interpolation (lever L5) -- this proposal moves time, and its
      memory is reported beside it rather than traded; (c) improving the
      success probability P0 -- F4 carries no exponent and the goal record
      already refutes that family at the whiteboard; (d) structural degree
      bounds with exponent 1/4 (lever L1) -- CLOSED-IN-SCOPE by
      EV-SSIQ-e43afd, and this proposal does not reopen it: it accepts
      delta_E ~ p^{1/3} typically and asks about the rare tail instead;
      (e) restricted-family list constructions (lever L2) -- the goal record's
      corrected exchange rate applies to the list, not to the sampling stage
      this proposal touches.
    newness_score: >-
      The individual ingredients are NOT new: Lemma 3.4's proof is the frozen
      source's, the counting law Pr[delta_E <= T] << T^{3/2} p^{-1/2+o(1)} is
      this campaign's own derivation D1 (EV-SSIQ-e43afd O-5), and the one-
      variable curve p^{1/2-theta/2} is already in the BATCH-001 task report.
      WHAT IS NEW IS THE SECOND VARIABLE. BATCH-001's curve implicitly fixes
      gamma = theta -- it assumes the only way to learn delta_{E'} <= T is to
      run the list build that would have used it. Naming that assumption and
      releasing it is the whole proposal, and it is what makes lever L4
      quantitative for the first time.
    testability_score: >-
      The identity itself is pen-and-paper and checkable in an hour by anyone
      who reads Lemma 3.4. The screen quantities (s, gamma, recall) are
      measurable on data this campaign has already committed: the four
      supersingular 2-isogeny graphs with real in-session delta_E labels at
      p = 2437, 3889, 5737, 7333 in
      experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/raw-result.json.
    survival_score: >-
      The identity survives as arithmetic regardless of outcome. What is at
      risk is the screen: the honest expectation is that no evaluable screen
      with s > 0 and recall p^{-o(1)} exists, in which case the deliverable is
      a CLOSED branch of L4 with a number attached rather than a fatigue
      report.

  mechanism: >-
    DERIVED HERE FROM THE FROZEN SOURCE. Every step is either quoted from
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (line numbers given) or
    labelled as an in-record derivation.

    STEP 1 -- LEMMA 3.4 IS THRESHOLD-GENERIC. The source's Lemma 3.4 (line 160,
    proof lines 177-185) assumes deg(phi) <= (p/2)^{1/3} from Theorem 1.5, sets
    X = B^{1/2}(p/2)^{1/6}, and derives deg(eta) <= l_{k+1} deg(phi)/X <=
    B (p/2)^{1/3} / X = X. Replace the hypothesis "deg(phi) <= (p/2)^{1/3}" by
    "deg(phi) <= T" and set X = (BT)^{1/2}. The identical three-line chain
    gives deg(eta) <= B T / (BT)^{1/2} = (BT)^{1/2} = X. Nothing else in the
    proof uses the value of the bound: cyclicity comes from minimality, and the
    conjugation step chi = eta-hat^{(p)} is unchanged. SO ALGORITHM 2 AT
    THRESHOLD T IS CORRECT WHENEVER delta_{E'} <= T AND deg is B-smooth.
    Setting T = (p/2)^{1/3} returns X = B^{1/2}(p/2)^{1/6}, the source's own
    line 167, which is the baseline-reproduction check for this step.

    STEP 2 -- COST OF ONE ATTEMPT AT THRESHOLD T. Lemma 3.2 (line 133) bounds
    #L(E,X,B) <= Psi(X,B) X (log X + 2), and Lemma 3.3 (line 154) gives cost
    Psi(X,B) X^{1+o(1)} B^{O(1)}. With B = p^{o(1)} as at line 200, Psi(X,B) =
    X^{1+o(1)} whenever u = log X / log B is in the Theorem 1.4 range, so
    cost = X^{2+o(1)} = (BT)^{1+o(1)} = T p^{o(1)} = p^{theta + o(1)}.
    MEMORY IS THE SAME QUANTITY: the table is the algorithm's state, so memory
    exponent = theta exactly, not less. Both must be reported.

    STEP 3 -- THE BASE RATE. This campaign's derivation D1 (EV-SSIQ-e43afd
    O-5, produced by TASK-20260805-87e568 and independently confirmed by
    TASK-20260805-89a2e7) gives the fraction of supersingular curves with
    delta_E <= T as << T^{3/2} p^{-1/2+o(1)}. Write P(theta) =
    Pr[delta_E <= p^theta] = p^{3theta/2 - 1/2 + o(1)}. A second, independent
    route to the same exponent, derived here and offered for attack: the
    governing lattice is the rank-3 trace-zero sublattice of Hom(E, E^{(p)})
    of discriminant asymptotic to p (EV-SSIQ-e43afd O-6), and the number of its
    vectors of degree <= T is the volume of a ternary ball, ~ c T^{3/2}
    p^{-1/2}. The two routes agree, which is why the exponent 3/2 is treated
    here as structural rather than empirical. THE DIRECTION MATTERS AND IS
    DECLARED: D1 supplies an UPPER bound on P, and the identity's first term
    needs a matching LOWER bound. That gap is HEUR-SS-1 below, not a silent
    step.

    STEP 4 -- THE IDENTITY. Sample curves E' by the source's re-randomising
    walk (line 202, mixing at n = O(log p) per [6, Lemma 14], so each draw
    costs p^{o(1)} and the solution pulls back). Apply the screen S; on a
    curve that passes, run Algorithm 2 at threshold T.
      draws needed until one curve both passes S and has delta <= T:
        1 / Pr[S and delta <= T] = 1 / (r P) = p^{1/2 - 3theta/2 + o(1)}
        when the recall r = Pr[S | delta <= T] is p^{-o(1)};
      cost of the draw stage: p^{gamma} each, total p^{gamma + 1/2 - 3theta/2};
      curves that pass S along the way: (draws) x p^{-s};
      cost of the list stage: p^{theta} each, total
        p^{1/2 - 3theta/2 - s + theta}.
    Total exponent E = max of the two stages
      = (1/2 - 3theta/2) + max(gamma, theta - s),
    and for theta >= 1/3 the first term is 0 because P = 1 (Theorem 1.5), which
    is why it is written (1/2 - 3theta/2)_+.

    STEP 5 -- WHAT THE IDENTITY SAYS.
      (a) INCUMBENT. The archived algorithm has no screen and no separate
      delta-test: it learns delta_{E'} <= T only by building the list, i.e.
      s = 0 and gamma = theta. Then E = 1/2 - theta/2, minimised at the
      corner theta = 1/3 with value 1/3. THIS IS THE FROZEN SOURCE'S EXPONENT,
      recovered from an accounting that never mentions 1/3.
      (b) FREE EXACT SCREEN. gamma = 0, s = 1/2 - 3theta/2 gives
      E = (1/2 - 3theta/2) + max(0, 5theta/2 - 1/2), minimised at theta = 1/5
      with value 1/5.
      (c) BREAK-EVEN. Holding s = 0, E = 1/2 - 3theta/2 + max(gamma, theta) is
      below 1/3 for some theta as soon as gamma < 1/3. So a screen need not be
      cheap in absolute terms -- merely cheaper than the list it replaces.
      (d) THE 1/4 CONDITION, which is what completion criterion 1 asks for:
      E <= 1/4 requires theta >= 1/6 and max(gamma, theta - s) <= 3theta/2 -
      1/4. At theta = 1/4 this is gamma <= 1/8 with s = 1/8 (an exact screen);
      at theta = 1/6 it is gamma = 0 with s >= 1/6; at theta = 1/3 it is
      gamma <= 1/4 with s >= 1/12 -- and note that at theta = 1/3 the screen
      must select a p^{-1/12} fraction of curves while retaining almost all of
      those with delta_E <= p^{1/3}, which is EVERY curve. That last cell is
      therefore vacuous, and saying so is part of the map.

    STEP 6 -- WHERE THIS PUTS LEVER L4. L4 as this goal currently runs it asks
    whether greedy descent on delta_E beats a random walk. The identity says
    the descent's gradient is not the binding quantity: a descent needs to
    evaluate delta (or a proxy) at every visited vertex, so its per-step cost
    is gamma, and the campaign's toy runs supply that label by brute-force
    search, which at cryptographic scale is the original problem. Restated in
    the identity's variables, a descent that reaches the delta <= p^theta set
    in p^{d} steps gives E = (d + gamma) + theta at worst and
    max(d + gamma, theta) at best. The identity therefore does not replace the
    descent question; it prices it, and it says that a screen with s > 0 and
    gamma < 1/3 would beat 1/3 EVEN IF THE DESCENT HAS NO GRADIENT AT ALL.

