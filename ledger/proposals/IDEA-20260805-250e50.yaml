    - metric: >-
        Reproduction of the incumbent: the value of E(theta, s, gamma) at
        (theta, s, gamma) = (1/3, 0, 1/3), computed symbolically from the
        identity
      direction: different
      minimum_effect: >-
        EXACTLY 1/3. Any other value falsifies the identity outright and the
        line stops at Stage 0. This is a forced value derived before any run.
    - metric: >-
        Reproduction of this campaign's committed reading: E(1/4, 0, 1/4)
      direction: different
      minimum_effect: >-
        EXACTLY 3/8, matching TASK-20260805-87e568's baseline_reproduction_check
        verbatim. A mismatch means the identity is not an extension of the
        committed curve and must be withdrawn.
    - metric: >-
        Reproduction of the source's own parameter: X at threshold
        T = (p/2)^{1/3} under the generalised Lemma 3.4, X = (BT)^{1/2}
      direction: different
      minimum_effect: >-
        EXACTLY B^{1/2}(p/2)^{1/6}, which is line 167 of the frozen source
        character for character. A mismatch means STEP 1 is wrong.
    - metric: >-
        Best achievable E over the identity's admissible region with a free
        exact screen (gamma = 0, s at its maximum)
      direction: lower
      minimum_effect: >-
        EXACTLY 1/5, attained at theta = 1/5. Reported not as an achievable
        exponent but as the CEILING OF THE SCREEN FAMILY: no screen-based route
        of this shape can go below 1/5, and the goal's 1/4 target sits strictly
        inside the family rather than at its boundary.
    - metric: >-
        selectivity_exponent s of each pre-registered candidate screen,
        estimated as -log(admitted fraction)/log(N) across the four committed
        graphs
      direction: higher
      minimum_effect: >-
        A screen is INTERESTING only if s > 0 with a bootstrap CI excluding 0
        AND recall exponent indistinguishable from 0. The pre-registered
        threshold is s >= 0.05 with CI lower bound > 0. Anything below that is
        reported as a screen with no measurable selectivity, which closes that
        screen and not the family.
    - metric: >-
        recall of the graded screen "delta_E <= L" as a detector for
        "delta_E <= T", at L/T in {1/8, 1/4, 1/2}
      direction: different
      minimum_effect: >-
        FORCED VALUES, derived before the run from the counting law:
        (L/T)^{3/2}, i.e. 0.0442, 0.125, 0.354 respectively. Monotone
        increasing in L. Deviations above 0.15 in absolute recall at any of the
        three points, with the estimator anchored, falsify the counting law's
        applicability at the achievable scale and invalidate the base-rate term
        of the identity at that scale.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line. STAGE 0
      (zero compute, ~2 hours): re-read lines 154-185 and 193-220 of the frozen
      source and re-derive STEP 1 and STEP 2; compute E at the three
      reproduction points. IF THE IDENTITY DOES NOT RETURN 1/3, 3/8 AND
      B^{1/2}(p/2)^{1/6}, STOP -- the whole proposal is dead for the cost of an
      afternoon. STAGE 1 (zero compute): write out the admissible region and
      the 1/4 and 1/5 conditions; check the theta = 1/3 cell is vacuous
      (it is: at theta = 1/3 every curve qualifies, so no screen can have
      recall 1 and s > 0 simultaneously) and record that as part of the map
      rather than as a defect discovered later. STAGE 2 (minutes, pure Python):
      the estimator anchor -- run the exponent estimator on synthetic objects
      whose exponent is known by construction, per this goal's
      instrument_calibration standing practice, BEFORE touching real data.
      STAGE 3 (hours): the screen census on the four committed graphs.
    controls:
      - >-
        NULL SCREEN (matched, and it can fail). For each candidate screen with
        measured admitted fraction rho, draw a UNIFORMLY RANDOM subset of the
        same size from the same vertex set and measure its recall. FORCED VALUE
        DERIVED BEFORE THE RUN: recall = rho exactly, in expectation, with
        binomial spread. A candidate screen is a screen only if its recall
        exceeds the null's by more than the null's own spread. This null can
        fail in the informative direction -- if a candidate screen's recall
        equals rho, it carries no information about delta_E at all.
      - >-
        POSITIVE CONTROL (the instrument must fire). The EXACT screen
        S_exact(j) = [delta_j <= T], computed from the committed delta_E
        labels. Its recall is 1.000 by construction and its admitted fraction
        is the base rate. IF THE PIPELINE DOES NOT RETURN recall = 1.000 AND
        rho = base rate FOR S_exact, THE INSTRUMENT IS BROKEN AND NO NEGATIVE
        RESULT MAY BE REPORTED FOR ANY OTHER SCREEN.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. The family
        S_L(j) = [delta_j <= L] for L/T in {1/8, 1/4, 1/2, 3/4}. Forced recalls
        (L/T)^{3/2} = 0.0442, 0.125, 0.354, 0.650 derived before the run.
        Report measured-versus-forced at each point AND the monotonicity. A
        failure localises whether the counting law breaks at small L (rare-tail
        statistics) or at large L (saturation), instead of leaving "the law did
        not hold".
      - >-
        NEARBY-OBJECT CONTROL. Run the identical screen census with delta_E
        replaced by the SECOND successive minimum N_2 of the same lattice --
        an object with the same coarse statistics whose small values do NOT
        correspond to the F_p locus and do NOT make Lemma 3.4 apply. A screen
        that selects N_2-small curves as well as delta-small ones is
        responding to lattice size, not to the structure Lemma 3.4 uses.
        (Computing N_2 at toy scale requires the full lattice, not just its
        minimum; if the committed data does not carry it, this control is
        recorded as NOT RUN with the reason, never silently dropped.)
      - >-
        VERDICT-ON-THE-NULL-FIRST. The frozen decision rule is executed on the
        null screen before any candidate screen's numbers are looked at. If it
        emits the same label on both, it discriminates nothing and must be
        rewritten before the real arms are read.
      - >-
        ARCHIVE CHECK (zero compute). List every prior measurement in this
        corpus of a delta_E screen's selectivity or recall. NONE EXISTS -- the
        observable is new to this program, and that absence is recorded here
        rather than reported as a passed check.
    required_metrics:
      - symbolic value of E at the three reproduction points, with the derivation
      - per-screen (admitted fraction rho, recall r, evaluation cost) at each of the four primes
      - fitted exponents s and gamma in N with bootstrap CIs, and the anchor object's recovered exponent
      - forced-versus-measured table for the graded control, with monotonicity
      - the null screen's recall beside every candidate screen's recall, as a ratio

  falsification_conditions:
    - >-
      E(1/3, 0, 1/3) != 1/3, or E(1/4, 0, 1/4) != 3/8, or the generalised
      Lemma 3.4 fails to return X = B^{1/2}(p/2)^{1/6} at T = (p/2)^{1/3}. Any
      one kills the identity at zero compute.
    - >-
      A reader shows that Lemma 3.4's proof uses the value (p/2)^{1/3} anywhere
      beyond the two places identified in STEP 1. The generalisation is then
      unsound and the identity's domain shrinks to theta = 1/3, where it says
      nothing.
    - >-
      The positive control fails: the exact screen does not return recall
      1.000. No negative may then be reported about any candidate screen.
    - >-
      HEUR-SS-1's measured base-rate exponent lands materially below 3/2 with
      an anchored estimator. The identity is then optimistic and every E value
      in it is a lower bound rather than a value -- which must be stated on
      every citation, not repaired by refitting.
    - >-
      Every pre-registered candidate screen returns s indistinguishable from 0.
      This does NOT close lever L4 and must not be written as if it did: it
      closes the enumerated screen list, at toy scale, with the list stated,
      and the forward guidance is the residual -- screens using the curve's
      2-isogeny neighbourhood beyond radius 1, screens using modular
      polynomials at degrees the toy scale cannot reach, and the descent branch
      which this proposal prices but does not test.

  confounders:
    - >-
      SCALE. N ranges over 203 to 611 vertices. An exponent fit over a factor
      of three in N is weak, and this goal has already been burned twice by
      exponent estimators that could not resolve the quantity asked of them
      (GD-4, and the instrument_calibration block's ~-0.36 bias). Every
      exponent reported here must be accompanied by the anchor object's
      recovered exponent, or it is uninterpretable.
    - >-
      THE SCREEN CENSUS IS A MULTIPLE-COMPARISONS PROBLEM. Several candidate
      screens are tested; the best one will look good by chance. The candidate
      list is CLOSED BEFORE THE RUN and every member is reported, and the null
      screen's spread is the reference, not zero.
    - >-
      delta_E AT TOY SCALE MAY NOT BE delta_E ASYMPTOTICALLY. At N = 203 the
      whole graph is smaller than the constant in the counting law. A screen
      that works at N = 611 and not at N = 203 is a finite-size artifact until
      shown otherwise.
    - >-
      AUTHORSHIP ASYMMETRY. An identity that reproduces the incumbent exactly
      is satisfying and therefore suspect. STAGE 0 is designed so that the
      reproduction is a PASS/FAIL gate computed before anything else, not a
      confirmation found afterwards.

  interpretation_limits:
    - >-
      NO ALGORITHM IS PROPOSED AND NO EXPONENT IS CLAIMED. The identity is a
      cost accounting for a family of algorithms, one member of which is the
      archived one. The values 1/5 and 1/4 are CONDITIONS ON A SCREEN THAT DOES
      NOT EXIST, not achieved exponents, and no record may cite them otherwise.
    - >-
      Everything is conditional on Heuristic 1 of the frozen source AND, for
      the supersingular ISOGENY problem as opposed to OneEnd, on GRH via
      [35, Proposition 8.5] -- goal standing condition SC-1. Any candidate
      arising from this identity must also return log deg alpha = (log p)^{O(1)}
      (SC-2); the threshold-lowered Algorithm 2 does, since the returned
      endomorphism has degree p * deg(phi) * deg(omega)^2 with all three factors
      of polynomial bit length.
    - >-
      MEMORY IS NOT IMPROVED RELATIVE TO TIME. At every point of the identity
      the memory exponent equals theta, and at the 1/4 and 1/5 cells that is
      1/4 and 1/5 respectively. On the van Oorschot-Wiener curve the claw sets
      have size N = p^theta, so the interpolation reads p^{3theta/2}/w^{1/2}.
      A record citing the time exponent without this line is incomplete.
    - >-
      Toy tier. Everything measurable here is measured at log2 p <= 13. The
      identity is an asymptotic statement and the toy runs test its INPUTS
      (the base rate, a screen's selectivity), never its conclusion.

  proof_search_map_note: >-
    The paired hypothesis H-SSIQ-90e07b carries the filled proof_search_map for
    this proposal, per docs/inventor-protocol.md section 8. It is not
    duplicated here.

  target_complexity:
    time_exponent: >-
      The identity's value E(theta, s, gamma). Incumbent slice: 1/3.
      Screen-family ceiling: 1/5. Condition for this goal's 1/4 target:
      gamma <= 1/8 with s = 1/8 at theta = 1/4, or gamma = 0 with s >= 1/6 at
      theta = 1/6. NO VALUE BELOW 1/3 IS CLAIMED TO BE ATTAINED.
    memory_exponent: >-
      theta, exactly, at every point of the identity. Equal to the time
      exponent in the incumbent slice and in both target cells.
    best_known: >-
      p^{1/3+o(1)} time and memory conditional on Heuristic 1 (OneEnd/EndRing)
      and additionally on GRH for the isogeny problem (SC-1); p^{1/2}(log p)^{O(1)}
      unconditional at polynomial memory; the two joined by
      sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2}.
    hidden_overhead: >-
      Inherited unchanged and NOT assumed smaller: the source discloses a
      superpolynomial o(1). The identity adds two further p^{o(1)} factors of
      its own -- the walk length O(log p) per draw and the conditioned
      smoothness factor of HEUR-SS-2 -- and neither is assumed to be smaller
      than the incumbent's.
    tradeoff_note: >-
      At threshold theta the claw sets have size p^theta, so the van
      Oorschot-Wiener interpolation for one attempt is p^{3theta/2}/w^{1/2};
      the draw stage is polynomial-memory and does not participate.

  dominated_by: >-
    n/a for a cost identity -- no Pareto point is claimed because no algorithm
    is proposed. On the QUESTION it prices, the incumbent frontier is the
    p^{1/3+o(1)} time-and-memory point and the p^{1/2}(log p)^{O(1)}
    polynomial-memory point, joined by the van Oorschot-Wiener curve. ROWS
    CHECKED, and what was checked: (i) the frozen source's own comparison table
    at Section 4.1 lines 234-238, time and memory both, at five sizes;
    (ii) the goal record's incumbent_baselines block including the
    tradeoff_curve row and both 2026-08-05 corrections; (iii) all five
    EV-SSIQ-* evidence records for a prior sub-1/3 point -- none exists;
    (iv) the F_p-restricted Otilde(p^{1/4}) row, which is a different problem
    and is excluded by this question's own constraint; (v) data/query axis --
    not applicable, the problem takes no oracle and no samples, and that
    absence is recorded rather than left blank.
  sota_delta: >-
    ZERO on every axis as of this record: no attack, no exponent moved, no
    constant improved. Quantitatively, what the proposal DELIVERS is the
    conversion of one unquantified lever into three numbers -- the exponent is
    below 1/3 iff gamma < 1/3, reaches 1/4 iff (gamma, s, theta) satisfies
    max(gamma, theta - s) <= 3theta/2 - 1/4, and cannot go below 1/5 in this
    family -- plus a measured (s, gamma, recall) table for a closed list of
    candidate screens. If every screen returns s = 0, the delta is a closed
    branch with a stated boundary; if any returns s > 0 with gamma < 1/3, the
    delta is 1/3 - E > 0 and the result is routed to rule-12 review.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the identity itself survives Stage 0 -- it is arithmetic over a
    proof this session read line by line, and its two reproduction points are
    already committed by an independent task. It is not higher because STEP 1
    generalises someone else's lemma and a single unnoticed use of the value
    (p/2)^{1/3} would break it, and because HEUR-SS-1 supplies a bound in only
    one direction.
    0.10 that any pre-registered candidate screen shows s > 0 with recall
    p^{-o(1)} at toy scale. Not lower, because no such screen has ever been
    looked for in this corpus, because the campaign's own committed delta_E
    labels make the measurement nearly free, and because DEC-20260805-2be965
    records this goal's red team finding FOUR OF FIVE of its named obstructions
    defective on audit -- this program's priors about what is closed have a
    poor track record here. Not higher, because a p^{o(1)}-time predicate that
    detects a p^{-1/6}-rare arithmetic property of a j-invariant would be a
    substantial result on its own, and none is known.
    0.95 that the batch reaches a decisive reading either way, because Stage 0
    is pen-and-paper and Stage 3 runs on data already committed.
