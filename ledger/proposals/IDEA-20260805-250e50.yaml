  lossy_projection_identifiability_audit:
    projection: >-
      Full instance (E', its maximal order, its whole Hom(E', E'^{(p)}) lattice)
      --> the single bit [delta_{E'} <= T], and beneath it the single integer
      delta_{E'}.
    what_is_discarded: >-
      The lattice, the curve, the isogeny, the second and third successive
      minima, and every intermediate value of delta above T. Only one bit is
      retained per sampled curve.
    why_genuinely_lossy: >-
      Massively lossy: the fibre over the bit "1" has size p^{3theta/2 + 1/2},
      and over "0" essentially the whole curve set. The projection cannot be
      inverted and is not a change of coordinates -- unlike the canonical
      failure (Delta, Pi) = (x XOR y, x*y) in characteristic 2, where the
      unordered pair is recoverable as the roots of t^2 + Delta t + Pi, here
      nothing about E' is recoverable from the bit.
    why_compatible_with_the_operations: >-
      Because Lemma 3.4 is threshold-generic (STEP 1): the retained bit is
      exactly the precondition under which the algorithm's remaining operations
      -- list, key by codomain, conjugate, match -- are guaranteed to succeed.
      The discard is compatible with the target's operations in the strict
      sense that the retained part still propagates deterministically to the
      algorithm's output.
    is_it_only_a_change_of_coordinates: >-
      NO, and BOTH failure modes were checked. Not the "nothing discarded"
      failure, for the reason above. NOT THE MIRROR FAILURE EITHER, and this is
      the check that matters here: a projection so lossy that it is constant
      across instances has zero comparator spread and is worthless. The bit
      [delta_E <= p^theta] is NOT constant for theta < 1/3 -- its base rate is
      p^{3theta/2-1/2}, strictly between 0 and 1, and it is measurably variable
      on this campaign's own committed delta_E labels at four primes. IT IS
      CONSTANT AT theta = 1/3 (Theorem 1.5 makes it identically 1), which is
      precisely why the incumbent extracts no information from it and why the
      identity's screen term vanishes there. The mirror failure is therefore
      not avoided by luck: it is the boundary case, and the identity locates it.

  assumptions:
    - >-
      That the frozen in-repo transcription faithfully reproduces the archived
      result. Every quantitative step above is re-derived from that file's own
      statements rather than taken on the abstract's word, but a transcription
      error in Lemma 3.4's proof would change STEP 1. Stage 0 of the paired
      experiment re-reads those lines and records the check.
    - >-
      That "an attempt" may be charged as p^{theta+o(1)} in time and memory
      jointly. The source charges one F_{p^2}-operation per table entry in its
      own Section 4.1 and calls that optimistic; this proposal inherits the
      same optimism SYMMETRICALLY on both sides of every comparison, so it
      cancels in the exponent but not in any concrete-cost statement. No
      concrete-cost statement is made here (goal standing condition SC-3).
    - >-
      That the screened curve E' is still a legitimate re-randomisation, i.e.
      that conditioning on S does not break the pull-back at line 206. It does
      not: the walk omega is known and invertible independently of how E' was
      chosen. What conditioning CAN break is Heuristic 1, and that is
      IDEA-20260805-2d2c41's subject, carried here as HEUR-SS-2.

  heuristic_assumptions:
    - id: HEUR-SS-1
      statement: >-
        LOWER BOUND ON THE BASE RATE. There is a constant c > 0 such that for
        all theta in (0, 1/3) and all sufficiently large p,
        Pr_{E uniform supersingular over F_{p^2}}[delta_E <= p^theta] >=
        c p^{3theta/2 - 1/2 - o(1)}.
      rigorous_support: >-
        PARTIAL AND STATED AS SUCH. The matching UPPER bound is this
        campaign's derivation D1 (EV-SSIQ-e43afd O-5), which is a first-moment
        count of optimal embeddings and is therefore one-sided. A lower bound
        of the same order would follow from a second-moment or equidistribution
        argument on the same embedding count, or from AOV Conjecture 6.3 plus a
        uniformity statement; NEITHER IS IN HAND AND NEITHER IS ASSERTED. The
        heuristic is exactly the statement that the first-moment count is tight
        up to p^{o(1)}, which is the standard expectation for such counts and
        the standard place where such expectations fail.
      validation_plan: >-
        Directly measurable on the committed toy data: compute the empirical
        Pr[delta_E <= N^theta] over the four graphs at p = 2437, 3889, 5737,
        7333 (N = 203, 324, 478, 611 vertices) and fit its exponent in N at
        several theta. The estimator must first be shown to recover a known
        exponent on a synthetic object, per this goal's own
        instrument_calibration standing practice. A measured exponent
        materially below 3/2 falsifies the tightness and makes the identity
        OPTIMISTIC -- i.e. the true E is larger than stated -- which is the
        direction that matters and must be reported as such.
      falsification_condition: >-
        Empirical exponent of Pr[delta_E <= T] in T, measured with a
        calibration-anchored estimator, outside [1.35, 1.65] at the achievable
        range, with the anchor demonstrating the estimator recovers 3/2 on a
        synthetic ternary form of the same size.
    - id: HEUR-SS-2
      statement: >-
        CONDITIONED SMOOTHNESS. For E' drawn uniformly subject to
        delta_{E'} <= T = p^theta with theta < 1/3, the degree of the smallest
        isogeny E' -> E'^{(p)} is B-smooth with probability at least
        v^{-v(1+o(1))} where v = log T / log B -- i.e. Heuristic 1 of the frozen
        source (line 69) continues to hold after conditioning on a rare event
        of probability p^{3theta/2-1/2}.
      rigorous_support: >-
        NONE, AND THIS IS THE PROPOSAL'S MOST EXPOSED ASSUMPTION. Heuristic 1
        is stated for a UNIFORMLY RANDOM curve. Conditioning on delta_E <= T
        restricts to integers represented by a fixed ternary quadratic form with
        small value; such integers satisfy local conditions at the primes
        dividing the form's discriminant and are NOT drawn from the uniform
        distribution on integers of their size. The bias could go either way and
        the honest position is that it is unmeasured.
      validation_plan: >-
        Factor the committed delta_E values at the four toy primes, split by
        magnitude decile, and compare the smoothness profile of the small-delta
        stratum against (i) the Dickman prediction for uniform integers of the
        same size and (ii) a matched null of uniform integers drawn from the
        same range. This is IDEA-20260805-2d2c41's experiment and it is cited
        here rather than duplicated.
      falsification_condition: >-
        Smoothness probability of the small-delta stratum below the uniform-
        integer prediction by a factor that grows with p across the four
        primes. A bounded shortfall is an o(1) and does not falsify; a growing
        one converts the identity's p^{o(1)} success factor into a genuine
        exponent and must be added to E.

