idea:
  id: IDEA-20260816-efb9b3
  question_id: RQ-ALR-001
  added: '2026-08-16'
  title: 'Measure the only step that actually shrinks the represented body: the duplicate-multiplicity
    profile of the target divisor, its deduplication ratio and its induced chart count, swept across
    strided, uniform and opposite-point-rich constructions against a uniform-on-curve null at matched
    size'
  class: measurement
  claim: '(A) H-ALR-001 assumes public duplicate targets may be removed because only the zero union
    is required, and H-ALR-002 repeats it. That deduplication is the single operation in the whole
    ALR route that reduces N, and therefore the single operation that reduces the nN body, yet no
    record measures how much it removes. A cost claim whose only size-reducing step is unmeasured
    is incomplete. (B) The measurable is the multiplicity multiset of x-coordinates in the target
    divisor: the deduplication ratio N_dedup over N_raw, the maximum multiplicity, and the induced
    chart count, which is one when all x-coordinates are distinct and two once any x-fiber carries
    both of its points. (C) The claim under test is that these three quantities depend strongly on
    how the target divisor is constructed and only weakly on the curve, so that a strided divisor,
    a uniformly drawn divisor and an opposite-point-rich divisor sit at measurably different points,
    and the recorded ALR seeds sit at one of them rather than at a representative average. (D) The
    consequence is a correction term for the size ledger: the effective body is n times N_dedup times
    the chart count, not nN, and the entry reports the multiplicative correction per recorded seed.
    (E) NOT CLAIMED: no attack, no speedup, no claim that a favourable deduplication ratio can be
    arranged for a live target, and no claim that any adversary controls the target divisor. Deduplication
    removes public duplicates only, as H-ALR-001 states, and nothing here suggests it can be extended
    to non-duplicates. The entry measures a profile and supplies a correction factor; it does not
    improve any route, and a construction family that deduplicates well is a statement about a construction
    the experimenter chose.'
  mechanism: 'STAGE 1, define the three construction families exactly: strided, where target points
    are multiples of a fixed stride; uniform, where target abscissae are drawn from the curve''s x-coordinates
    uniformly; and opposite-rich, where a controlled fraction of points are paired with their negatives,
    which is the adversarial case H-ALR-001 already exercises with its duplicate-plus-opposite-point
    control. STAGE 2, for each family, each recorded curve family, and each N in a sweep, generate
    the target divisor with exact toy curve arithmetic, compute the multiset of x-coordinates, and
    record N_dedup, maximum multiplicity, and chart count. STAGE 3, repeat at many seeds per cell
    to get distributions rather than single values. STAGE 4, run the nulls: draw N x-values uniformly
    from F_p with no curve at all, giving the pure birthday baseline, and separately draw N points
    uniformly from the curve, which carries the x-fiber-of-size-two effect. STAGE 5, compare each
    family against the second null and report the deviation, since the first will deviate for a trivial
    reason. STAGE 6, apply the structural tell: the deduplication ratio for a uniform family should
    approach one as p grows at fixed N, because collisions become rare; a family whose ratio stays
    flat as p grows is either structured or is being generated with an unnoticed reuse, and the run
    distinguishes these by sweeping p. STAGE 7, feed the measured N_dedup and chart count back into
    the size ledger and report the corrected body per recorded seed.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/hypotheses/H-ALR-001.yaml, H-ALR-002.yaml, ledger/evidence/EV-ALR-001.yaml,
      EV-ALR-002.yaml, experiments/EXP-ALR-002/specification.yaml in full. Greps run: grep -ril ''deduplicat''
      ledger/proposals/ (6 hits: IDEA-20260815-a5a19f, IDEA-20260807-61049d, IDEA-20260813-945a67,
      IDEA-20260723-003, IDEA-20260808-917e63, IDEA-20260812-104e1a); grep -ril ''resultant'' ledger/proposals/;
      and inspection of the blacklist entry naming IDEA-20260815-fa56e7 for relation-collection duplicate
      accounting and IDEA-20260815-c13ef4 for designed versus sampled factor bases.'
    results: Six proposals mention deduplication. The blacklist explicitly names relation-collection
      duplicate accounting as owned by IDEA-20260815-fa56e7, and designed-versus-sampled factor bases
      as owned by IDEA-20260815-c13ef4 with the geometry question assigned to the FBG bucket. Neither
      concerns a target divisor's x-coordinate multiplicity multiset, and neither touches chart count.
      Within the ALR records, the duplicate-plus-opposite-point adversarial control appears in H-ALR-001's
      test boundary and in EV-ALR-001's observations as a single control instance, not as a swept
      measurement. RQ-ALR-001 carries zero proposals.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Assembled from known parts:
      birthday-model collision counting is elementary, the opposite-point construction is taken directly
      from the adversarial control H-ALR-001 already records, and the toy curve arithmetic is existing
      harness code. Claimed new only as a sweep: converting a single recorded adversarial control
      into a measured profile across three construction families with a uniform-on-curve null, and
      feeding the result back as a correction factor on the lane''s own body formula, which no record
      does.'
  object_first_candidate:
    tracked_object: 'The multiplicity multiset of x-coordinates in the target divisor: for each distinct
      abscissa appearing, how many target points share it. The object followed through the computation
      is this multiset of small integers, never the points themselves.'
    lossiness: 'The projection discards point identity entirely, discards the y-coordinates, and discards
      which abscissa carries which multiplicity, retaining only the multiset of counts. It is genuinely
      lossy: no target divisor can be reconstructed from its multiplicity multiset, and divisors with
      completely different support share the same profile. The retained multiset still propagates
      because the chart requirement and the deduplicated degree are functions of the multiset alone:
      N_dedup is the number of parts and the chart count is one if the maximum part is one and two
      otherwise, both determined without knowing any point. That is exactly why the profile is the
      right object for a size correction and the wrong object for anything else.'
    propagation: 'One step of the target operation, adjoining one more target point to the divisor,
      acts on the multiset by incrementing the part belonging to that point''s abscissa or creating
      a new part of size one. Deterministic, order-independent, and computable without curve arithmetic
      once the abscissa is known. Chart count propagates monotonically: it starts at one and moves
      to two at the first part reaching size two, and never moves back, which makes the first collision
      the only event that matters for chart structure.'
    survival_score: 'The multiset survives the entire divisor construction exactly and never dissolves,
      because it is defined by the construction. What has a survival boundary is its usefulness: the
      profile stops distinguishing families once N is large enough that every family saturates, since
      on an elliptic curve over F_p an x-fiber has at most two points and the multiset is bounded
      above by parts of size two. The entry therefore reports the N at which all three families reach
      maximum multiplicity two with probability above 0.99 and states that beyond that N the profile
      carries only the deduplication ratio and no chart information.'
  null_object_control: Draw N points uniformly at random from the curve itself, form the multiset
    of their abscissae, and compute the IDENTICAL three statistics by the IDENTICAL code path in the
    same invocation. This null already carries the x-fiber-of-size-two effect, so any residual deviation
    of a construction family is attributable to construction and nothing else. A second, cruder null
    draws N values uniformly from F_p with no curve, giving the pure birthday baseline against which
    the curve effect itself is visible. The signal arms mean something only if they deviate from the
    uniform-on-curve null beyond the reported error; deviation from the F_p null alone is expected
    and proves nothing.
  discriminated_from:
  - 'IDEA-20260815-fa56e7, named on the blacklist as owning relation-collection duplicate accounting:
    that record counts duplicate relations in index calculus, a different object in a different stage,
    and does not concern a target divisor''s abscissa multiplicities or chart count.'
  - 'IDEA-20260815-c13ef4, designed versus sampled factor bases, whose geometry question the blacklist
    assigns to the FBG bucket: this entry measures multiplicities of a target divisor, not the geometry
    or design of a factor base, and takes no position on interval structure or arithmetic-progression
    supports.'
  - H-ALR-001's duplicate-plus-opposite-point adversarial control, which is one instance establishing
    that two charts can be forced; this entry sweeps construction families, seeds and N to produce
    a distribution and a correction factor, which one control cannot provide.
  - The size ledger entry in this same batch, which prices the body at nN and treats N as given; this
    entry measures what N actually is after deduplication and supplies the correction, so the two
    compose rather than duplicate.
  - 'Generic birthday-collision analyses with no tracked object: the tracked object here is the multiplicity
    multiset and the deliverable is a correction factor on a specific committed body formula.'
  assumptions:
  - An elliptic x-fiber has at most two points, so multiplicities are bounded by two, as H-ALR-001
    states.
  - Public duplicates may be removed because only the zero union is required, as H-ALR-001 assumes;
    this entry measures the effect of that removal and does not re-derive its validity.
  - Toy curve arithmetic in harness/toycurve.py is exact and its point generation is unbiased for
    the uniform family.
  - The recorded seeds in EXP-ALR-001 and EXP-ALR-002 can be reproduced to regenerate their target
    divisors, or if not, the entry reports the sweep without the recorded-seed comparison rather than
    inventing it.
  - Chart count is determined by maximum multiplicity alone under the R181 chart conventions.
  predictions:
  - metric: deduplication_ratio_uniform_family_minus_uniform_on_curve_null
    direction: different
    minimum_effect: 0.02
  - metric: chart_count_probability_two_opposite_rich_family
    direction: higher
    minimum_effect: 0.9
  - metric: deduplication_ratio_strided_family_at_stride_sharing_a_factor_with_group_order
    direction: lower
    minimum_effect: 0.9
  - metric: corrected_body_factor_at_recorded_seeds
    direction: different
    minimum_effect: 'refuse to pre-commit: the recorded seeds were chosen for other reasons and may
      sit anywhere in the distribution, so predicting their position would be asserting a datum the
      sweep exists to produce'
  - metric: N_at_which_all_families_reach_maximum_multiplicity_two
    direction: different
    minimum_effect: 200
  minimal_test:
    design: 'One script over harness/toycurve.py. For each of the three recorded curve families, each
      construction family in strided, uniform and opposite-rich, and each N in 8, 16, 32, 64, 128,
      256, generate 200 target divisors at distinct seeds, compute the abscissa multiset, and record
      N_dedup, maximum multiplicity and chart count. In the same invocation compute both nulls: N
      values drawn uniformly from F_p, and N points drawn uniformly from the curve. Report per cell
      the mean and full distribution of the deduplication ratio and the fraction of divisors needing
      two charts, with the two null columns adjacent. Then evaluate the corrected body against nN
      per recorded seed. Eighteen cells per curve family at 200 seeds is a few minutes of toy curve
      arithmetic. It discriminates because the second null, uniform points on the curve, already carries
      the x-fiber-of-size-two effect, so any residual deviation is attributable to the construction
      family and nothing else.'
    controls:
    - Uniform-on-curve null, same invocation, isolating the x-fiber-of-size-two effect from construction
      structure.
    - Birthday null on F_p, same invocation, isolating pure collision counting so the curve effect
      itself is visible.
    - 'Stride control: sweep stride values including those sharing a factor with the group order and
      those coprime to it, since a stride sharing a factor collapses the divisor for an arithmetic
      reason.'
    - 'Curve-family control: all three recorded curve families, so any effect can be checked for curve
      dependence.'
    - 'Seed-count convergence check: report statistics at 50, 100 and 200 seeds and confirm they have
      stabilised.'
    required_metrics:
    - deduplication_ratio_distribution
    - maximum_multiplicity_distribution
    - chart_count_fraction_two
    - birthday_null_deduplication_ratio
    - uniform_on_curve_null_deduplication_ratio
    - corrected_body_factor_per_recorded_seed
    - N_at_saturation_of_maximum_multiplicity
  falsification_conditions:
  - All three construction families are indistinguishable from the uniform-on-curve null at every
    N, so construction does not affect the profile.
  - Maximum multiplicity exceeds two in any cell, contradicting the x-fiber assumption and indicating
    a fault in point generation.
  - The deduplication ratio for the uniform family does not approach one as p grows at fixed N, the
    structural tell that generation is reusing points.
  - Chart count is found not to be a function of maximum multiplicity under the R181 conventions,
    so the reported chart statistic is not the operative one.
  - The corrected body factor is exactly one at every recorded seed, meaning deduplication removes
    nothing at the lane's own parameters and the entry's correction is empty.
  - Statistics have not stabilised by 200 seeds, so no distribution may be reported.
  confounders:
  - Stride choices interacting with the group order, which can collapse a strided divisor for reasons
    of order arithmetic rather than of divisor structure; addressed by the stride control.
  - Point generation in the harness reusing an internal counter, which would manufacture duplicates
    in the uniform family and is exactly what the growing-p tell detects.
  - The opposite-rich family being parameterised by a fraction chosen by the experimenter, so its
    chart-count result is partly a restatement of that choice; the fraction is therefore swept and
    reported rather than fixed.
  - Recorded seeds being unreproducible, in which case the recorded-seed correction column is absent
    rather than estimated.
  - The chart-count statistic being a coarse binary that saturates quickly, so at large N it carries
    no information and the entry must not read a saturated statistic as a finding.
  interpretation_limits:
  - Deduplication removes public duplicates only; nothing here suggests any reduction beyond duplicates
    and no such extension is implied.
  - The correction factor applies to the body formula of the size ledger entry and inherits its charging
    model and its toy scope.
  - Construction families are experimenter-chosen and their differences describe those constructions,
    not any property a live target would have.
  - All statistics are scoped to the three recorded curve families and to N at most 256 on toy primes.
  target_complexity:
    time_exponent: No attack exponent is claimed. The run is toy curve arithmetic and the reported
      times are generation costs of the measurement itself.
    memory_exponent: No memory exponent is claimed. The reported memory-relevant quantity is the correction
      factor N_dedup times chart count over N applied to the nN body of the size ledger, an absolute
      multiplicative factor at the recorded parameters.
    best_known: The incumbent figure is the uncorrected nN body recorded in EV-ALR-001; the entry
      reports the corrected value and claims no route improvement, since correcting a size estimate
      is not an algorithmic gain.
    hidden_overhead: Hidden in the lower-order terms is the cost of performing the deduplication itself,
      which requires sorting or hashing N abscissae and is charged nowhere in the ALR records. The
      human cost hides in the construction families, which are chosen by the experimenter and can
      be tuned to produce any deduplication ratio desired, which is why the two nulls and the stride
      control are mandatory rather than optional.
  dominated_by: n/a (no result claimed). All frontier rows in this lane were checked, the B^(5/2)
    rho proxy and the five B^(7/2) represented routes of EV-ALR-001, and a multiplicity profile is
    not a point on any of them.
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively the deliverable
    is the deduplication ratio distribution per construction family against the uniform-on-curve null,
    and the multiplicative correction N_dedup times chart count over N applied to the recorded body
    figure at each recorded seed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the sweep runs and produces stable distributions: 0.9, since it
    is elementary toy curve arithmetic on existing harness code. That the opposite-rich family forces
    two charts with probability above 0.9: 0.85, essentially by construction, which is why that prediction
    is weak evidence of anything and is included as a sanity check rather than as a finding. That
    the uniform family deviates measurably from the uniform-on-curve null: 0.25, since with no structural
    reason to differ the honest expectation is that it does not, and a null result there is the useful
    outcome. That the corrected body factor differs from one at the recorded seeds: 0.45, depending
    entirely on whether those seeds happened to generate duplicate-rich divisors. That the deduplication
    cost, once charged, is negligible against the body: 0.7.'
