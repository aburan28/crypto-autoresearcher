idea:
  id: IDEA-20260809-1a5cb2
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    Charge the linear-algebra memory: state the relation matrix's dimension and
    weight at deployment parameters and report the bit level as an
    (operations, memory) pair
  class: measurement
  claim: >-
    The quoted security level for a pairing target field is an operation count
    with the memory of the linear-algebra phase unpriced. The claim is that the
    matrix dimension and weight implied by the model at deployment parameters
    can be stated exactly from the model's own smoothness bounds, that the
    resulting memory requirement is large enough to be a real constraint under
    any declared machine model, and that reporting the pair rather than the
    scalar moves the effective level by a stateable amount.
  mechanism: >-
    The factor base size and expected relation count follow from the smoothness
    bound; the matrix is that size with a weight determined by the relation
    structure. Block Wiedemann's memory profile is then computed under a declared
    machine model, exactly as GOAL-RSA-001 does for factoring, and the pair is
    reported.
  why_not_a_renamed_known_approach: >-
    Memory-charged NFS costing exists for factoring in this program's own
    roadmap. The transfer to a tower field is not automatic: the matrix arises
    over a different ring, the relation structure differs, and the deployed
    target is an extension field rather than a prime field. The record's content
    is the transferred computation and its differences, not the discipline.
  predictions:
  - observable: implied matrix dimension and average weight at deployment parameters
    metric: two integers with derivation
    predicted: Both computable in closed form from the model's smoothness bound; if they are not, the model is underspecified and that is the finding.
  - observable: movement in the effective level when memory is charged under a declared machine model
    metric: bits
    predicted: Nonzero and stateable. A movement of zero would mean memory is genuinely free at these sizes, which would be worth recording explicitly.
  minimal_test: >-
    Compute the matrix parameters at the calibration sizes, MEASURE the actual
    matrix produced by the runs of IDEA-20260809-15e1cd, compare predicted to
    measured dimension and weight, and only then extrapolate to deployment
    parameters with the interval carried through.
  controls:
  - 'MEASURED-VERSUS-PREDICTED CONTROL: the matrix parameters predicted at calibration sizes must match the matrices actually produced; a mismatch invalidates the extrapolation and is the point of running the check at small size first.'
  - 'MACHINE-MODEL CONTROL: the memory charge is reported under at least two declared machine models so that the charge is visibly a function of the model rather than a constant of nature.'
  falsification_conditions:
  - Predicted matrix parameters disagree with the measured ones at calibration sizes.
  - The memory charge is negligible under every declared machine model, falsifying the premise.
  interpretation_limits: >-
    An (operations, memory) pair at deployment parameters is an extrapolation,
    not a computation, and is never a security verdict about a deployed curve.
  sota_delta: 'No attack. Delta: a priced pair where the field quotes an unpriced scalar.'
  dominated_by: Method shared with GOAL-RSA-001, whose figures do not transfer; not dominated by any corpus record.
  estimated_cost: Implementation small on top of IDEA-20260809-15e1cd; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for memory charging: GOAL-RSA-001 owns the factoring case only. WEB NOT CHECKED.'
  source_refs:
  - Pairing key-size estimation references -- RECALLED, REQUIRED READS.
