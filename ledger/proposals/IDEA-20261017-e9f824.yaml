idea:
  id: IDEA-20261017-e9f824
  question_id: RQ-SEMBIN-ade131
  added: '2026-10-17'
  status: proposed
  approved_by:
  proposed_by: idea-generator
  title: >-
    Does the 18-22% t=2 yield deficit transfer to the cost-relevant linear regime?
    A mu dose-response at fixed |V| against the closed form (1+e^{-mu})/2
  class: control
  claim: >-
    SCOPE toy: E y^2+xy=x^3+aX^2+B over F_{2^n}, n<=29, t=2 (arm t=3 at |V|<=2^8),
    exhaustive all-target counts. No attack, no exponent, no curve-security claim.
    H-SEMBIN-83a856 (supported) attributes the 18-22% deficit of EV-SEMBIN-d40877 to
    trace-parity confinement: for V in ker(Tr) the per-target count is a 50/50 mixture
    of 0 and Poisson(2mu). With mu-hat the MEASURED mean this gives P=(1-e^{-2mu})/2
    and f_disp(mu-hat)=P/(1-e^{-mu-hat})=(1+e^{-mu-hat})/2: 0.803 at mu=.5 (recorded
    0.79-0.82), 0.941 at 2^-3, 0.985 at 2^-5, 0.996 at 2^-7 (1-mu/2 to first order).
    Unconfined V: f_disp=1+-0.003 at every mu. The rival reading, intrinsic clustering
    of solutions (compound Poisson, cluster mean kappa), predicts f_disp~1/kappa~0.80
    independent of mu. Every recorded t=2 cell has n=2k, i.e. mu~.5, so existing data
    cannot separate them. At the paper's optimum k=ceil(n/m) (Table 3 rows) mu<=0.006
    (6.7e-8 at n=571,m=12): the mixture reading makes the dispersion factor >=0.997,
    the clustering reading 0.32 bit. This test decides which transfers to eqs. (15)-(17).
  mechanism: >-
    Object: per-target count c(R) with class split pi(R)=Tr(x_R)+Tr(a) in E/2E.
    Representation R1. Operation set Sigma: the homomorphism E->E/2E composed with
    translation by factor-base points (Class I, partial action; a decomposition exists
    only if the summed class matches the target class). Lossy-projection test: pi keeps
    one bit of N points, and is compatible with Sigma since pi(P+Q)=pi(P)+pi(Q).
    Heterogeneity across classes costs P only at second order (E[1-e^{-mu_c}] =
    mean - E[mu_c^2]/2); clustering at one target costs P at first order. Mixture loss
    scales ~mu, clustering loss does not, so a sweep in mu separates them. Factor-base
    escape: not applicable (standard subspace V; KN-OPEN-020 untouched).
  novelty_status: unverified
  citations:
  - {ref: H-SEMBIN-83a856, provenance: internal, claim: "parity confinement and f_disp closed form (P6); nearest prior work: has the closed form but tests it only at mu~.5; this adds dose-response and a prime-n confined arm", verified_by: EV-SEMBIN-0c8bf4}
  - {ref: EV-SEMBIN-d40877, provenance: internal, claim: "t=2 deficit measured at mu~.5 only; nearest prior work: measured the deficit; every cell has n=2k", verified_by: DEC-20260913-3b51c8}
  - {ref: SRC-SEMAEV-2015-310, provenance: kb, claim: "eq. (11); Table 3 parameters", verified_by: tables.yaml}
  predictions:
  - {metric: "f_disp(mu-hat), confined V, mu-hat from .5 down to .0078", direction: higher, minimum_effect: "tracks (1+e^{-mu})/2 within .005; >=.98 at mu<=.04"}
  - {metric: "f_disp, unconfined random V, same n", direction: different, minimum_effect: "1.000+-.005 at every mu"}
  - {metric: "pi=1 class hits, confined V", direction: lower, minimum_effect: "exactly 0"}
  - {metric: "variance/mean inside pi=0 class", direction: different, minimum_effect: "1.00+-.03 at every mu"}
  minimal_test:
    design: >-
      Reuse EXP-SEMBIN-354a75 code read-only. k=10 (|V|=1024), t=2. For n=20..29 build
      E (Tr(a)=0 and 1; B=1 and random), enumerate V^2 once and push all pair-sums into
      a count array over x_R (2^n bytes, <=0.5 GB): c(R) exact for ALL targets at 2^20
      cost per cell, no sampling. Arms: V random inside ker Tr (any n, incl. prime
      n=23,29), unconfined random V, Semaev window (confined at even n only).
      Arm t=3: k=7,8, n=tk+4..tk-4.
    controls:
    - "curve-free symmetric random map through the same pushforward: f_disp=1"
    - "known-false split (unrelated bit of x_R) gives no empty class"
    - "first reproduce the mu~.5 cells of RUN-SEMBIN-8be036: must give .80"
    required_metrics: [f_disp with mu-hat per configuration, class-split mean and variance/mean, hit fraction by pi, max count vs Poisson tail]
  falsification_conditions:
  - "Confined f_disp at mu-hat<=.04 below .95 in >=2 cells: intrinsic clustering exists, first-order cost >=0.07 bit."
  - "Unconfined f_disp outside [.99,1.01] at mu-hat<=.05: the null object is not null."
  - "Inside-class variance/mean outside [.95,1.05] at mu-hat<=.04: H1 fails."
  confounders:
  - "f_base=(L/|V|)^t fluctuation: removed by scoring against mu-hat, not nominal 2^{tk-n}/t!."
  interpretation_limits:
  - "Toy scale; says nothing about Assumption 1/2, any degree, or any curve's security."
  - "A pass shows the t=2 deficit is a saturation artifact; it does not show t=m=12 is clustering-free (IDEA-20261017-3079bc)."
  heuristic_assumptions:
  - id: H1
    statement: "Inside the reachable class the count is Poisson with mean 2*mu-hat, independent of V-structure."
    rigorous_support: "Parity theorem (F1,F2) + exact conservation of multiset sums; classical Poisson limit of random-map occupancy."
    validation_plan: "Per-class chi-square and variance/mean at 8 mu-values x 4 arms; tail: max count vs Poisson tail over 2^{n-1} targets. Toy only, no transfer."
  - id: H2
    statement: "No intrinsic clustering: E[c(c-1)]=mu_class^2(1+o(1)) at t=2."
    rigorous_support: "E[c^2] is the additive energy of W (zeros of S_4 on V^4); only the trivial lower bound is proved."
    validation_plan: "Same enumeration; sum_R c(R)^2 read exactly."
  target_complexity:
    time_exponent: "unchanged (no algorithm)"
    memory_exponent: "unchanged"
    best_known: "eqs. (15)-(17): 2^{c sqrt(n ln n)}, c=1.6986"
    hidden_overhead: "mixture reading removes the 0.32-bit dispersion term from every transfer statement; clustering reading adds kappa~1.25 to stage 1 (cofactor, not exponent)"
    tradeoff_note: "n/a"
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
