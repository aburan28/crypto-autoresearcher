idea:
  id: IDEA-20260816-a96623
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'Before ranking anything, make the differential weight oracle earn its trust: re-derive the
    exact differential probability of the SIMON-like AND round as a function of the rotation triple,
    and verify it against a brute-force difference distribution table at word sizes where the whole
    table is computable, reporting the exact inputs where closed form and table disagree.'
  class: control
  claim: '(A) Every downstream claim this campaign can make about the rotation-constant space rests
    on a weight oracle: a function w(alpha, beta; a, b, c) returning minus the base-two logarithm
    of the probability that input difference alpha produces output difference beta through one SIMON-like
    round. If that oracle is wrong on any cell, every trail bound, every ranking and every distributional
    statement built on it inherits the error silently, because a trail search reports a number and
    not a proof. (B) The claim is that the oracle can be established as exactly correct, not approximately
    correct, by exhaustive comparison against a brute-force difference distribution table at word
    sizes 4 through 12, where the table has 2^{2n} cells and each cell is computed by iterating over
    all 2^n inputs. At n = 12 that is roughly 2^{36} elementary operations if done naively and roughly
    2^{24} per input difference if organized as one pass per alpha, which is reachable; at n = 16
    it is not, which is exactly why the closed form is needed and exactly why it must be validated
    below 16. (C) The claim is further that the oracle''s stated validity condition is itself measurable:
    the closed form is expected to be exact only under a condition on the rotation triple, such as
    a greatest-common-divisor condition relating a - b to n, and the deliverable is the exact set
    of triples where the closed form and the table disagree, characterized by that condition rather
    than reported as an error rate. (D) NOT CLAIMED: that any particular closed form is the one in
    the prior literature, which this program cannot check; that the standardized constants satisfy
    or fail the validity condition, which is measured rather than assumed; that the oracle validated
    at n <= 12 is correct at n = 16, 24, 32, 48 or 64, which is an extrapolation this proposal names
    rather than makes; and no attack, distinguisher or security consequence of any kind.'
  mechanism: 'STAGE A, brute-force ground truth: for each word size n in {4, 6, 8, 10, 12} and each
    rotation triple, build the exact difference distribution table of the round function f(x) = (S^a
    x AND S^b x) XOR S^c x by iterating x over all 2^n inputs and incrementing the counter for (alpha,
    f(x) XOR f(x XOR alpha)). The rotation and XOR parts are linear so they translate the table deterministically;
    the AND part is the only source of probability. STAGE B, independent re-derivation: derive a closed-form
    expression for the number of solutions x to (S^a x AND S^b x) XOR (S^a(x XOR alpha) AND S^b(x
    XOR alpha)) = gamma, from first principles, by writing the AND bitwise and identifying the bits
    whose value is forced by alpha, the bits that are free, and the bits that are pairwise coupled
    when a - b and n interact. Freeze the resulting formula in a preregistration file before STAGE
    C runs. STAGE C, cell-by-cell comparison: for every triple, every alpha and every beta, compare
    the closed-form weight with the table weight, treating impossible transitions as weight infinity,
    and record an exact integer count of disagreeing cells plus the full list of disagreeing triples.
    STAGE D, condition extraction: partition the disagreeing triples by candidate arithmetic conditions
    on (a, b, c, n) and report the smallest condition that exactly separates agreement from disagreement,
    or report that no tested condition separates them. STAGE E, null arm: replace the AND round function
    with a uniformly random balanced quadratic vectorial Boolean function of the same output size
    and the same number of quadratic terms, build its table by the identical brute force, and apply
    the identical closed form. The closed form must fail on the null.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments; grep -il 'simon|speck'
      over ledger/proposals/*.yaml with the matching lines inspected; grep -ril 'differential' restricted
      to ledger/proposals and cross-checked against the RQ area codes in the filenames; grep -ril
      'Matsui|branch-and-bound' over ledger and knowledge; read knowledge/literature/KN-LIT-5292.md
      in full; read the specification skeleton of experiments/EXP-AES-1b80e0/specification.yaml to
      match field shape and claim-ceiling conventions; checked this environment for numpy, z3, python-sat
      and pulp, all absent.
    results: 'No proposal in this repository targets RQ-SIMSPK-f6a6c0. The differential-cryptanalysis
      proposals that exist sit under the AES area, for example IDEA-20260807-bbefda and the IDEA-20260805
      series, and concern AES-specific counting models rather than a parameterized round function.
      The branch-and-bound hits are IDEA-20260813-fbedca, IDEA-20260814-8f8f45, IDEA-20260805-2b94fe
      and H-MLKEM-7d9bcc, all lattice or code-based. KN-LIT-5292''s recorded abstract states that
      the paper derives efficiently computable and easily implementable expressions for the exact
      differential and linear behaviour of SIMON-like round functions, but the entry is a two-page
      bulk-seeding stub at confidence: reported whose claims are explicitly relayed from the abstract
      without verification, and it does NOT record the expressions themselves. This proposal therefore
      has a named baseline to reproduce and no local text of it, which is precisely the situation
      KN-TECH-080 audit 1 is written for.'
    verdict: 'UNVERIFIED. No statement is made here about what any external publication contains;
      KN-LIT-5292 is cited only as this repository''s own stub record and its abstract-level claims
      are relayed as such. Assembled from known parts: brute-force difference distribution tables
      are elementary; validating a closed form against exhaustive ground truth at small sizes is standard
      practice and is the inventor protocol''s validation-ladder step 1. Claimed new only in combination
      and only locally: an independently re-derived weight oracle, frozen before comparison, validated
      cell by cell across the entire rotation-constant space rather than at the standardized triple
      alone, with the disagreement set characterized by an arithmetic condition and with a random-quadratic
      null that the oracle must fail.'
  object_first_candidate:
    tracked_object: 'The XOR difference of a plaintext pair, and more precisely the exact fibre structure
      of one AND round: for a fixed input difference alpha, the multiset of output differences beta
      together with their solution counts, that is one row of the difference distribution table of
      f_{a,b,c}. The object followed through the computation is that row, and the quantity carried
      is its weight profile rather than any individual pair.'
    lossiness: 'Genuinely lossy. Passing from a pair (x, x XOR alpha) to the difference alpha discards
      the absolute value x entirely, collapsing 2^n pairs onto one difference class. The discard is
      compatible with the round''s operations in the strong sense for the linear parts: rotation and
      XOR act on differences deterministically, S^c contributing an exact translation and the Feistel
      XOR an exact addition, so no information needed later is lost there. It is compatible only probabilistically
      at the AND, which is exactly where the weight appears, and the weight is the price of the projection.
      This is the textbook lossy projection, and this entry does not claim it as a new object; the
      entry''s contribution is that the price is computed exactly rather than estimated, and that
      the exactness is verified rather than asserted.'
    propagation: One round sends the difference pair (deltaL, deltaR) to (deltaR XOR f_{a,b,c}(x)
      XOR f_{a,b,c}(x XOR deltaL), deltaL). The key XOR cancels exactly, so the round key does not
      enter the difference propagation at all and the weight is key-independent under the standard
      independence convention. The AND contributes, for each bit position i, a dependence on the difference
      bits at positions i - a and i - b, so the coupling structure across bit positions is governed
      entirely by the arithmetic of a - b modulo n. That coupling is why the closed form has a validity
      condition, and why the condition is expected to be arithmetic in (a - b, n) rather than statistical.
    survival_score: The difference object survives, per triple, until the optimal accumulated trail
      weight over r rounds exceeds the block size 2n, at which point the trail is vacuous as a distinguisher
      and the object has dissolved for the purposes of this measure. The concrete number reported
      is r_vac(a,b,c) = the smallest r with optimal weight greater than 2n, computed exactly wherever
      the search completes and reported as an interval with a censoring flag wherever it does not.
      At the oracle-validation level, the object survives one round exactly, with the exact weight
      known and verified for every cell, which is the strongest survival statement available and is
      the only one this entry claims.
  null_object_control: 'Two null objects, both executed in the same invocation as the signal arm.
    First, a uniformly drawn balanced quadratic vectorial Boolean function g on n bits with the same
    number of quadratic monomials as the AND round, built from a seeded generator: its exact difference
    distribution table is computed by the identical brute force, and the closed-form oracle is applied
    to it unchanged. The oracle MUST fail on this null, with a disagreement count comparable to the
    number of cells, because a closed form that also fits a random quadratic map is not capturing
    the AND structure and is fitting something generic about quadratic maps instead. Second, a rotation
    triple drawn uniformly from (Z/n)^3, which the oracle must handle exactly as well as it handles
    the standardized triple; systematically worse agreement on random triples than on the standardized
    one would indicate the derivation was tuned to the standardized case. For the signal arm to mean
    anything the first null must show near-total disagreement and the second must show agreement statistically
    indistinguishable from the standardized triple''s.'
  discriminated_from:
  - KN-LIT-5292 is recorded in this corpus as reporting exact differential and linear expressions
    for SIMON-like round functions, but the record is an abstract-level stub and contains no expressions.
    This proposal does not restate, assume or contradict them; it derives a form locally, freezes
    it, and reports whether it matches exhaustive ground truth, so a later recovery of the primary
    text turns into a reproduction comparison rather than a correction.
  - IDEA-20260807-bbefda and the AES differential proposals reason about a fixed cipher's counting
    model and localisation claims. Here the cipher is a free parameter and the deliverable is an oracle's
    correctness across the whole parameter space, with no cipher-specific counting model at all.
  - Generic difference distribution table computation as taught for S-boxes computes one table for
    one fixed small function. The move here is that the table is computed for every point of a parameter
    space and used only as ground truth for a closed form, because at the sizes that matter the table
    is not computable and the closed form is the only instrument.
  - 'The AES r=5..7 measured effects with their null controls, which this program treats as established,
    concern a fixed cipher at fixed round counts with a structure-free sieve as null. The null here
    is a random quadratic map that the instrument must FAIL, which is the opposite polarity of control:
    it tests that the instrument is specific, not that the effect is absent.'
  assumptions:
  - The round function has the form f(x) = (S^a x AND S^b x) XOR S^c x, pinned in STAGE 0 against
    the specification and its test vectors rather than assumed from memory.
  - Round keys are XORed into the state, so they cancel in the difference and the one-round weight
    is key-independent. This is checked directly at n = 8 by computing tables under several fixed
    keys and confirming they coincide, rather than assumed.
  - Trail weights compose by addition under the standard round-independence convention. This proposal
    does NOT verify that convention; it verifies only the one-round oracle, and any multi-round number
    produced downstream inherits the convention as a named assumption.
  - Exhaustive tables at n <= 12 are computable within budget in pure Python; at n = 12 this is roughly
    2^{24} operations per input difference and the run declares a per-triple ceiling accordingly.
  - A disagreement between closed form and table is an error in the closed form, not in the table,
    because the table is definitional. This ordering is asserted and is what makes the comparison
    a validation.
  predictions:
  - metric: count of difference distribution table cells where the frozen closed form disagrees with
      brute force, over all triples at n in {4,6,8,10}
    direction: lower
    minimum_effect: forced to exactly 0 on the subset of triples satisfying the derived validity condition;
      on the complement the count is not pre-committed, and the deliverable there is the exact list
      of offending triples
  - metric: fraction of rotation triples for which the closed form is exact at every cell
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a fraction: it is a deterministic arithmetic property
      of (a, b, n) that STAGE B derives and STAGE D confirms, so naming a number before the derivation
      exists would be guessing. What is pre-committed is that the fraction is reported per word size
      and that the separating condition is stated or its absence recorded.'
  - metric: disagreement rate of the same closed form applied to a random balanced quadratic null
      function
    direction: higher
    minimum_effect: 0.5
  - metric: difference in per-cell agreement rate between the standardized triple and uniformly drawn
      triples satisfying the same validity condition
    direction: different
    minimum_effect: 0
  minimal_test:
    design: 'Fix n = 8. There are 512 triples, 256 input differences and 256 output differences, so
      the full difference distribution table for one triple costs 256 times 256 counter increments
      driven by one pass of 256 inputs per alpha, that is roughly 65536 evaluations per triple and
      33 million across the whole space, which is minutes in pure Python. Freeze the independently
      derived closed form in a preregistration file with a hash recorded before any comparison runs.
      Then compare every cell of every table against the closed form and emit three integers: total
      cells, disagreeing cells, and number of triples with any disagreement, plus the explicit list
      of those triples. In the same invocation, generate 32 random balanced quadratic maps on 8 bits
      with matched quadratic-term count and run the identical comparison; their disagreement rate
      is the null. This single run decides whether the oracle may be used at n = 16 and above at all,
      costs no solver and no dependency, and its negative outcome, a nonzero disagreement count on
      triples that were expected to be covered, is a precise and reusable statement about where the
      instrument is invalid.'
    controls:
    - Random balanced quadratic null function with matched quadratic-term count, on which the oracle
      must fail, run in the same invocation.
    - Uniformly drawn rotation triples compared against the standardized triple, to detect a derivation
      tuned to the standardized case.
    - 'Key-independence control: tables recomputed under several fixed nonzero round keys at n = 8
      and required to coincide exactly.'
    - 'Linear-part control: a degenerate triple making the AND vanish, for which the round is linear
      and every nonzero-probability cell must have weight exactly 0; failure indicates a table-construction
      fault.'
    - Preregistration hash of the closed form recorded before the first comparison, so the form cannot
      be adjusted to fit the tables.
    required_metrics:
    - total_cells_compared and disagreeing_cells, as exact integers per word size
    - list of triples with any disagreement, per word size
    - null_arm disagreement rate over the random quadratic family
    - per-cell agreement rate for the standardized triple versus uniformly drawn triples
    - r_vac(a,b,c), the smallest round count at which the optimal weight exceeds 2n, wherever the
      search completes, with a censoring flag otherwise
    - wall-clock seconds and peak resident memory per word size
  falsification_conditions:
  - Any disagreeing cell on a triple that the frozen validity condition claims to cover, which falsifies
    the derivation as frozen.
  - The random quadratic null showing a disagreement rate comparable to the signal arm's, which means
    the closed form is fitting genericity rather than AND structure and the instrument is not specific.
  - Tables under different fixed round keys failing to coincide, which falsifies the key-independence
    assumption and invalidates every weight computed key-independently.
  - No arithmetic condition on (a, b, c, n) separating agreement from disagreement, which leaves the
    oracle usable only on an enumerated list of triples and must be reported as such rather than smoothed
    over.
  - The degenerate linear-triple control producing any nonzero weight, indicating a table-construction
    fault that invalidates the ground truth itself.
  - Disagreement counts differing between two independent implementations of the brute force, which
    invalidates the ground truth.
  confounders:
  - An off-by-one in rotation direction, left versus right, is the single most likely defect and would
    produce a closed form that is exact on a reflected image of the constant space; the reflection
    control u = n - 1 and the test-vector pinning both guard it.
  - Small word sizes have many degenerate triples, for example a = b or c = 0, whose behaviour is
    atypical and can dominate an aggregate agreement rate; they are reported separately and never
    pooled.
  - A random quadratic null with too few quadratic terms behaves almost linearly and would trivially
    disagree with the oracle for the wrong reason; the term count is matched to the AND round explicitly.
  - Counting with a hash map versus an array can silently drop cells with zero count, turning impossible
    transitions into missing entries rather than weight infinity; both representations are built and
    compared.
  - Python integer bit operations on words wider than the machine word are exact but slow, and a per-triple
    timeout would censor the largest word sizes preferentially, which is a budget outcome and never
    a statement that the oracle failed there.
  interpretation_limits:
  - An oracle validated exhaustively at n <= 12 is not thereby proved correct at n = 16 or above.
    The validation supports the derivation; the extension to larger n rests on the derivation's algebraic
    argument, and that dependence is named in every downstream record.
  - Nothing here measures multi-round behaviour. Trail weights composed by addition inherit the round-independence
    convention, which this run does not test.
  - A correct oracle says nothing about whether any triple is good, bad, optimal or anomalous. It
    says only that the instrument used to ask is exact on the tested cells.
  - No statement about any published expression is made or implied, in either direction, since the
    corpus holds only an abstract-level stub.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: exhaustive table construction
      is O(n^3 2^{2n}) over the whole constant space at word size n, which is about 2^{25} at n =
      8 and about 2^{36} at n = 12 per full sweep, the latter requiring the declared per-triple sampling
      rule rather than exhaustion.'
    memory_exponent: No attack memory exponent is claimed. One table is 2^{2n} counters, 65536 at
      n = 8 and 16.7 million at n = 12, so the n = 12 arm streams one input difference at a time and
      holds O(2^n) counters, keeping peak memory under a few hundred mebibytes.
    best_known: The incumbent instrument is the closed-form differential expression for SIMON-like
      round functions that KN-LIT-5292's recorded abstract says exists, whose text this repository
      does not hold. The incumbent for ground truth is exhaustive difference distribution table computation,
      which is exact but limited to small n. This proposal contests neither; it measures the gap between
      them.
    hidden_overhead: 'The human cost of deriving the closed form correctly and freezing it before
      looking at the tables is the real expense, and the temptation to adjust it after seeing a disagreement
      is the failure mode the preregistration hash exists to block. Hidden in the lower-order terms:
      the n = 12 arm''s per-triple cost makes a full sweep of 1728 triples expensive enough that a
      sampling rule is needed, and the sampling rule must name the omitted region rather than quietly
      shrinking the sweep.'
  dominated_by: 'n/a (no result claimed). Pareto check performed across time, memory and data/queries:
    this proposal produces no attack and no distinguisher, so no frontier row exists on any axis.
    As an instrument, exhaustive table computation dominates the closed form on correctness at every
    n where it is computable and is dominated by it on time at every n where it is not, and that crossover,
    between n = 12 and n = 16 in this environment, is itself one of the reported numbers.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative content is the
    crossover word size at which exhaustive ground truth stops being computable in this environment,
    roughly n = 12 to 14 at a 3600-second budget in pure Python, and the exact integer disagreement
    count of the frozen closed form below it, predicted to be zero on the covered subset.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that every downstream ranking depends on the oracle and inherits
    its errors: 0.98, this is structural rather than empirical. Part (B), that an independently derived
    closed form matches brute force exactly on a large, arithmetically characterized subset of triples:
    0.6, because the derivation is nontrivial and the coupling structure across bit positions is exactly
    where a first attempt goes wrong; a first-pass failure here is expected and is cheap to iterate.
    Part (C), that a clean arithmetic condition separates the agreeing from the disagreeing triples:
    0.45, since the condition may be a conjunction of several cases rather than one greatest-common-divisor
    test, in which case the honest deliverable is the enumerated list. Part (D), that the random-quadratic
    null fails the oracle decisively: 0.85, since a closed form built from the AND coupling structure
    has no reason to fit an unrelated quadratic map, and the residual reflects the possibility that
    both are dominated by a shared weight-distribution shape at small n.'
