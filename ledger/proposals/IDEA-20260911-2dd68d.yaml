  assumptions:
    - >-
      Good ordinary reduction, gcd(n,p)=1, #E(F_p) != p at every tested
      instance, exactly as EXP-ECDLP-a26bde's scope; the new engineered
      curve's four reduction primes must be generated and filtered by the
      same seeded procedure (driver/curves.py) with the same criteria.
    - >-
      Reduction mod p^K commutes with the elliptic-curve group law (a
      standard ring-homomorphism fact about the group law's polynomial
      formulas, not a heuristic); this licenses computing [m]S mod p^K via
      padic.pmul for arbitrarily large integer m without ever forming the
      exact global rational m S^.
      NOTE (elementary, not a heuristic): Q's only roots of unity are +1 and
      -1 (any root of unity has |.|=1 in every archimedean embedding, and the
      only rationals of absolute value 1 are +-1); this is the sole basis for
      claiming the Teichmuller-lift degeneracy's exact set over Q is {+-1}
      and nothing else, for ANY coordinate or fixed-rational-multiple
      transform of it. No heuristic assumption is needed for this specific
      fact; only the cross-prime SCREEN used to detect it cheaply (H2 below)
      is heuristic.
    - >-
      KN-TECH-73630e's uniqueness theorem is taken as proven (not
      re-derived); it is what licenses treating s_x, s_y and s_rand as
      non-homomorphic without a separate homomorphism-failure proof for each,
      given each is already confirmed to diverge from t at generic m in the
      existing raw data.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is an empirical measurement/control experiment repairing an
      already-derived identity's contrast arm at toy scale; it proves no
      theorem and claims no complexity result. The relevant audit is the
      null-object control and resolution-matched statistic in minimal_test,
      not a proof architecture.
  predictions:
    - metric: teichmuller_x_pooled_rate_ratio (s_x, post m=1 and post cross-prime-degeneracy exclusion, pooled over 20 original + 4 positive-control instances)
      direction: different
      minimum_effect: >-
        95% CI for rho_hat_x contains 1.0 and its upper bound is strictly
        below 3.0 (indistinguishable from chance, inconsistent with any
        systematic effect at or above the original 3/p bound).
    - metric: teichmuller_y_pooled_rate_ratio (s_y, independently-realized construction, identical statistic)
      direction: different
      minimum_effect: >-
        Same band as s_x (CI contains 1.0, upper bound < 3.0), AND required
        to agree in verdict with rho_hat_x (both inside the band, or both
        outside it) -- a split verdict is reported as an open confound, not
        resolved by either reading alone.
    - metric: positive_control_screen_flag_rate (engineered curve, m=2, across its 4 reduction primes)
      direction: higher
      minimum_effect: >-
        Flagged as x-degenerate on 4/4 of the engineered curve's tested
        primes at m=2 (matching curve 2's pattern exactly); failure to flag
        on any of the 4 is an instrument defect in the screen itself, not a
        finding about claim (3).
    - metric: random_control_rate_ratio (s_rand, seeded pseudorandom-digit null object, same statistic, no exclusion needed)
      direction: different
      minimum_effect: >-
        95% CI for rho_hat_rand contains 1.0. A CI excluding 1.0 means the
        chance-level null model (Poisson at rate 1/p per trial) or the
        s_rand implementation itself is broken, and invalidates any reading
        of rho_hat_x / rho_hat_y until fixed.
  minimal_test:
    design: >-
      STAGE 0 (free, cross-validation, no new compute beyond a comparison).
      For the 20 existing instances, recompute [m]S mod p^K for m=2..256 via
      padic.pmul(m, S_mod_pK, A, N) and require EXACT agreement, at every m,
      with the already-committed reduce_point_mod(exactcurve.mul(A,B,m,
      S_exact), N, p) values in the existing raw-result.json files. This is
      the numerical confirmation of 2S^=(-1,-4) that DEC-20260911-74c9dc's
      next_actions (a) asked for, generalized to a full regression check
      that the new cheaper (pmul-based) computation path is faithful before
      it is trusted at m beyond 256.
      STAGE 1 (new curve). Generate one engineered positive-control curve
      with S^=(1, y0) and doubling slope lambda=(3+A)/(2 y0)=1 exactly (a
      concrete instance: A=5, B=10, (x0,y0)=(1,4): 4^2=16=1+5+10, and
      lambda=(3*1+5)/(2*4)=1, giving 2S^=(-1,-2)), then run the SAME seeded
      search (driver/curves.py) to find 4 reduction primes in the 10-14 bit
      range with good ordinary reduction and gcd(n,p)=1, exactly as the
      original five curves were selected.
      STAGE 2 (the amended ladder, per instance i with prime p_i). Compute
      N_i = ceil(20 * p_i) (mu_0_target=20; power calculation below). For
      m = 2 .. N_i+1 (skipping m with n | m as before): compute mS_mod_K via
      padic.pmul(m, S_mod_K_big, A, N_big) [replacing stage23.py's exact-
      Fraction path for this arm only]; verify mS_mod_K satisfies the curve
      equation mod p^K exactly (cheap on-curve sanity check against silent
      precision underflow at deep ladder depth, reusing split_point's
      margin-escalation pattern (40,60,75) on any failure); compute
      digit_of_point_minus_torsion as before (unchanged); compute s_x, s_y,
      s_rand and their defect digits against t(mS) (unchanged pattern,
      teichmuller_defect_digit-style). Flag m as x-degenerate if x(mS) mod
      p_i in {1, p_i-1} for EVERY prime of that curve simultaneously at that
      m (cross-prime screen); symmetric y-degenerate flag for s_y. Exclude
      flagged m from the primary statistic; report flagged m and their
      per-prime pattern separately.
      STAGE 3 (statistic). u_S/u_S_y/u_rand (the m=1 baselines) computed
      ONCE, outside and never re-entering the loop (removing the tautology).
      For each of s_x, s_y, s_rand: mu_0_i = n_i(after exclusion)/p_i;
      mu_0 = sum(mu_0_i); k = pooled agreement count; one-sided exact
      Poisson test of k against mu_0 at alpha=0.01; rho_hat = k/mu_0 with a
      95% CI (exact Poisson CI on k, divided by mu_0). Falsify "no systematic
      linearity" only if BOTH p < 0.01 AND rho_hat's point estimate >= 3 (a
      joint significance-and-effect-size bar, avoiding both a trivial-effect
      false alarm from huge N and a large-looking noise fluctuation).
      POWER JUSTIFICATION for mu_0_target=20: for a Poisson test at
      alpha=0.01 one-sided distinguishing mu_0=lambda (null, rate ~1/p) from
      3*lambda (alternative, rate ~3/p), the normal approximation gives
      power >= 0.90 once lambda >~ 5-6; lambda=20 gives SD(rho_hat)=
      sqrt(1/20)=0.224 under the null (95% CI approx [0.56,1.44], clearly
      excluding 3) and SD(rho_hat)=sqrt(3/20)=0.387 under a true 3x effect
      (95% CI approx [2.24,3.76], clearly excluding 1) -- comfortable
      separation with a 3-4x safety margin over the minimum resolvable
      lambda.
    controls:
      - >-
        s_rand: a seeded pseudorandom-digit section (x' = x0 + p * PRNG(seed,
        curve_idx, p, m) mod p^(K-1), y Hensel-lifted from x'), the null
        object per docs/inventor-protocol.md section 3: it is a valid
        on-curve point reducing correctly to R mod p, with NO relationship to
        the true global lift beyond the first digit and no possible +-1-type
        degeneracy by construction (its higher digits are pseudorandom
        noise, not a global rational value). Its rho_hat MUST read as chance
        (CI contains 1) or the statistic itself, not the mechanism, is
        broken.
      - >-
        Engineered positive-control curve, run through the IDENTICAL
        pipeline including the cross-prime screen: this discriminates
        "the corrected instrument is now blind to the coincidence too"
        (screen fails to flag m=2, an instrument defect) from "the corrected
        instrument correctly excludes only the named degeneracy and reports
        the REMAINING multiples honestly" (screen flags m=2 on 4/4 primes,
        AND the curve's own post-exclusion rho_hat over its other m behaves
        like an ordinary null instance).
      - >-
        Stage 0's pmul-vs-exact-Fraction regression check on the existing
        m=1..256 data (free, using already-committed raw-result.json values)
        as a validity control on the new, cheaper computation path before
        trusting it past m=256.
      - >-
        On-curve verification (y^2 == x^3+Ax+B mod p^K) for every pmul-
        computed mS_mod_K, guarding against silent precision underflow at
        ladder depths (log2(N_i) up to ~19-20 doublings) well beyond
        anything the original 68-value ladder exercised.
      - >-
        Reuse of the SAME torsion-section / formal-log machinery
        (split_point, digit_of_point_minus_torsion) unmodified from
        instrument.py, so any discrepancy against claim (1)'s
        already-`support`-ed 1360/1360 exact agreements on the reused
        prefix is itself a regression signal.
    required_metrics:
      - per-instance and pooled rho_hat_x, rho_hat_y, rho_hat_rand with 95% CIs and one-sided Poisson p-values
      - count and identity (curve, prime, m) of every cross-prime-flagged degenerate multiple, for both x- and y-screens
      - Stage 0 regression agreement count (pmul vs exact-Fraction on m=1..256, 20 instances): must be exact, 0 mismatches
      - positive-control curve: flag rate at m=2 across its 4 primes; post-exclusion rho_hat restricted to that curve alone
      - wall-clock and CPU time per instance, to calibrate the N_i-scaling estimate below against measured cost
  falsification_conditions:
    - >-
      rho_hat_x's or rho_hat_y's 95% CI has a lower bound >= 3 (systematic,
      resolvable excess over chance): claim (3) as amended is FALSE; the
      "never systematically" prediction is wrong and the digit dynamics of
      s_x/s_y need re-derivation. This is a real possible outcome, not
      excluded by design.
    - >-
      The cross-prime screen fails to flag the engineered positive control's
      known m=2 coincidence on any of its 4 primes: the corrected instrument
      is defective (blind to a coincidence it was built to catch), and no
      claim-3 verdict from this run is trustworthy until fixed.
    - >-
      s_rand's 95% CI excludes 1.0: the chance-level null model itself (or
      the s_rand implementation) is broken; nothing about claim (3) can be
      read from rho_hat_x/rho_hat_y until this is resolved.
    - >-
      Stage 0's pmul-vs-exact-Fraction regression shows any mismatch on the
      existing m=1..256 data: the new computation path is not faithful and
      the whole Stage 2/3 design must be re-derived before trusting results
      at m > 256.
    - "Crashes, timeouts, memory exhaustion at any stage: infrastructure, never negative mathematical evidence (AGENTS.md rule 5)."
  confounders:
    - >-
      mu_0_target=20 is a designed, not measured, choice; a reviewer could
      reasonably ask for more margin. Sensitivity is cheap to check by
      re-running the same statistic at mu_0_target=40 on a subset of
      instances and confirming the verdict is unchanged.
    - >-
      The "digit agreement is approximately Bernoulli(1/p), independent
      across m" null model (heuristic H1 below) is itself unverified beyond
      elementary plausibility; s_rand's own measured rate is the built-in
      check that this null model is not silently wrong before it is used to
      judge s_x/s_y.
    - >-
      The cross-prime screen (H2 below) is a necessary-but-not-provably-
      sufficient proxy for "x(mS^)=+-1 exactly over Q"; a value could in
      principle satisfy the screen at all tested primes without being
      exactly +-1 (an accidental multi-prime coincidence). The false-positive
      rate of this proxy is quantified as a named heuristic, not assumed
      away.
    - >-
      The engineered positive-control curve's OTHER (non-m=2) multiples
      might show their own unexpected quirks unrelated to the x0=1,
      lambda=1 construction; any such finding is reported on its own terms,
      not folded silently into either the pass or fail reading of the main
      claim.
    - >-
      Deep binary ladders (up to ~19-20 doublings for the largest N_i) create
      more opportunities for the redundant-p-factor precision issue noted in
      instrument.py's PRECISION_MARGIN docstring than the original m<=256
      ladder exercised; the on-curve verification control above is the
      designed defense, not a guarantee it will never fire.
  interpretation_limits:
    - >-
      Toy tier throughout, identical scope to H-ECDLP-6a9479: 5 (+1
      engineered) curves, primes in [2^10, 2^14), no transfer to
      cryptographic scale claimed or implied.
    - >-
      This does not re-litigate claims (1), (2) or (4) of H-ECDLP-6a9479,
      already `support`-ed at strength `strong`; scope is restricted to
      claim (3) alone.
    - >-
      A "supported" outcome (rho_hat consistent with chance on both s_x and
      s_y) is a toy-scale empirical measurement consistent with
      KN-TECH-73630e's uniqueness theorem, not a new proof of it; the
      theorem is assumed, not re-derived, throughout.
    - >-
      No attack and no exponent claim anywhere in this record: every
      multiple tested is generated from a global point whose scalar m is
      known to the generator (per RQ-ECDLP-c1b7b1's constraint); nothing
      here recovers an unknown discrete log.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a non-homomorphic contrast section s (s != t at generic points,
        by KN-TECH-73630e), the digit d(s(mS)) behaves, over the tested
        m-ladder, as an approximately uniform, approximately independent
        draw from Z/pZ, so P(d(s(mS)) = m*d(s(S)) mod p) ~= 1/p per
        non-degenerate trial.
      rigorous_support: >-
        None proven for this specific formal-group digit; this is the same
        "no structure, hence uniform" null used for unrelated pseudorandom
        functions/hash digests -- a modeling choice, not a theorem about
        elliptic curves.
      validation_plan: >-
        (a) s_rand's own measured rho_hat is the built-in tail check: it is
        engineered to have zero structure, so if its empirical rate departs
        from 1/p, H1 (or the statistic) is wrong, independent of anything
        about s_x/s_y. (b) For each instance, a chi-square goodness-of-fit
        test of the empirical distribution of d(s_x(mS)) and d(s_y(mS))
        against Uniform(Z/pZ) over the full (non-excluded) ladder, reported
        alongside the agreement-rate statistic. Sampled at the full N_i per
        instance already computed for the main test; no extra compute.
    - id: H2
      statement: >-
        A multiple m for which x(mS) mod p_i in {1, p_i-1} holds
        SIMULTANEOUSLY for every one of a curve's k (~4-8) tested primes has
        probability ~(2/p_avg)^(k-1) of being an accidental multi-prime
        coincidence rather than a genuine global rational identity
        x(mS^) = +-1 exactly; treated as negligible (e.g. ~10^-11 to 10^-16
        for the tested prime range) against the achieved sample sizes,
        i.e. the screen's false-positive rate is negligible over this run's
        total trial count.
      rigorous_support: >-
        Not a theorem; models residues of a fixed rational number modulo
        distinct, unrelated primes as behaving like independent draws for
        the purpose of this ensemble-level probability estimate (a standard
        CRT-flavored equidistribution heuristic for the FAMILY of tested m,
        not a claim about any single fixed rational). The complementary fact
        that x(mS^)=+-1 exactly DOES force agreement at every prime of good
        reduction is a theorem (roots of unity in Q are +-1, cited above
        under `assumptions`); H2 only concerns the converse direction (does
        multi-prime agreement imply the exact identity).
      validation_plan: >-
        Tabulate, on the ALREADY-COLLECTED EXP-ECDLP-a26bde raw data (free,
        1360 existing data points, no new compute), the empirical per-prime
        frequency of x(mS) mod p_i in {1,p_i-1} and confirm it is close to
        2/p_i (a direct binomial check of the per-prime base rate the
        (2/p_avg)^(k-1) estimate depends on); extend the same tabulation to
        the new large ladder as a built-in diagnostic; any m flagged by the
        screen that is computationally cheap to verify exactly (small
        height) is confirmed via exact Fraction arithmetic as a spot-check,
        with the size-law fit (claim 2, already validated, slope ~2.00)
        cited to argue any flagged m too large for exact verification has
        height far in excess of h(+-1)=0, making an accidental (non-exact)
        multi-prime match the only remaining explanation, consistent with
        the negligible-probability estimate above.
