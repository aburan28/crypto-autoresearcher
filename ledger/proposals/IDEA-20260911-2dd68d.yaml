idea:
  id: IDEA-20260911-2dd68d
  title: >-
    Resolution-matched, degeneracy-screened re-test of the Teichmuller
    non-homomorphic contrast (repairing H-ECDLP-6a9479 claim 3)
  class: control
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-c1b7b1
  goal_id: GOAL-ECDLP-001
  added: '2026-09-11'
  proposed_at: '2026-09-11'
  proposed_by: idea-generator
  derived_from:
    - H-ECDLP-6a9479
    - EXP-ECDLP-a26bde
    - IDEA-20260905-dacf4f
  derived_context: >-
    This is not a fresh idea unrelated to prior work: it is a designed,
    targeted follow-up to H-ECDLP-6a9479's claim (3) as scoped `refine` by
    DEC-20260911-74c9dc, and it extends EXP-ECDLP-a26bde's own instrument
    (driver/instrument.py, driver/stage23.py) rather than replacing it. It
    reuses the same five frozen curves, the same torsion-section/formal-log
    machinery, and adds one new curve plus a new statistical layer. Claims
    (1), (2) and (4) of H-ECDLP-6a9479 are out of scope here; they are
    already `support`-ed at strength `strong` and this proposal does not
    touch them.
  claim: >-
    After (i) excluding the m=1 entry as a mathematical tautology (never
    entering any agreement statistic), (ii) excluding any tested multiple m
    whose x-coordinate OR y-coordinate is flagged, by an explicit cross-prime
    screen, as coinciding with a global rational value of exactly +1 or -1
    (the only rational numbers that are (p-1)-th roots of unity for every odd
    prime, hence the only possible source of a prime-independent, recurring
    "free" agreement under a Teichmuller-style lift), and (iii) using a
    per-instance sample size N_i scaled so the chance-level expected
    agreement count mu_0_i = N_i / p_i >= 20 (making a 3x-chance systematic
    effect statistically resolvable, not merely "more than one hit in 68
    tries"), two INDEPENDENTLY REALIZED canonical non-homomorphic contrast
    sections -- s_x (Teichmuller-lift x, Hensel-lift y; the existing
    instrument.teichmuller_section) and s_y (Teichmuller-lift y, Hensel-lift
    x from the cubic; a new, symmetric construction) -- will each show a
    pooled post-exclusion agreement-rate ratio rho_hat = (observed
    agreements)/(mu_0) whose 95% CI is consistent with 1 and excludes any
    value >= 3, across the 20 original (curve,prime) instances of
    EXP-ECDLP-a26bde plus 4 new instances on a deliberately engineered
    positive-control curve (doubling slope exactly 1 at its frozen point, by
    construction). This makes claim (3) DECIDABLE at toy scale for the first
    time. Falsifiable both ways: rho_hat's CI could instead sit at or above 3
    on one or both sections (forcing re-derivation), or the positive-control
    curve's known m=2 coincidence could go undetected by the cross-prime
    screen (an instrument defect, not a mathematical finding).
  mechanism: >-
    THE ACTUAL CONTENT OF (c). I considered building a "safe" replacement
    section immune to the +-1 degeneracy and concluded, and state here
    explicitly, that no such construction exists among Teichmuller-style
    (multiplicative-root-of-unity) lifts of a rational coordinate: the
    reason ANY such lift can coincide with the true global reduction at
    EVERY prime simultaneously is that Q's only roots of unity are +1 and -1
    (elementary: a root of unity has absolute value 1, and the only rationals
    of absolute value 1 are +-1) -- so whichever coordinate (or fixed
    rational multiple/combination of coordinates) is Teichmuller-lifted, its
    universal-degeneracy set is always exactly {+1,-1} relabelled, never
    empty and never avoidable by choice of transform. The correct fix is
    therefore not a redesigned "safe" section but (1) a decidable,
    pre-registered EXCLUSION rule for this named, proven degeneracy class,
    and (2) at least one construction that is differently realized enough
    (different coordinate, different computation path, independently coded)
    that its own instance of the same degeneracy fires at a DIFFERENT,
    essentially disjoint set of m (verified per curve, not assumed) --
    giving cross-validation instead of false independence. s_x's degenerate
    set is {m : x(mS^) = +-1 exactly}; s_y's is {m : y(mS^) = +-1 exactly};
    a curve engineered to hit x=-1 at m=2 (as curve 2 does) generically does
    NOT also hit y=+-1 at m=2 (curve 2's y(2S^)=-4, not +-1), so s_y is a
    genuine independent check on the SAME curve, not a relabelling of the
    same accident.
    WHY EACH SECTION IS NON-HOMOMORPHIC (grounding, not assumption).
    KN-TECH-73630e proves that two sections of <S> -> E^(Q_p) differ by a
    homomorphism Z/nZ -> E_1(Q_p), and E_1 is pro-p and torsion-free, so any
    homomorphism from an order-n group (gcd(n,p)=1) into it is zero -- i.e.
    the torsion section t is the UNIQUE homomorphic section. Consequently
    any section s with s != t at even one point of <S> is automatically NOT
    a homomorphism (if it were, uniqueness forces s=t, contradiction). Since
    s_x and s_y are already confirmed, in the existing raw data, to diverge
    from t at generic m (e.g. RUN-ECDLP-a26bde-009, m=3: d_mS=5536 vs
    u_mS=4238), both are non-homomorphic by this theorem, with no separate
    proof needed per section -- exactly the citation the task asked for.
    THE CROSS-PRIME SCREEN. Rather than needing exact rational arithmetic to
    decide "is x(mS^) exactly +-1 over Q" at every tested m (infeasible at
    the scale this design needs -- see target_complexity/heuristic H2), the
    screen checks the CHEAP, purely modular necessary condition: does
    x(mS) mod p_i in {1, p_i-1} hold SIMULTANEOUSLY for every one of a
    curve's ~4-8 tested primes at the same m? Any exact rational identity
    x(mS^)=+-1 forces this for every prime of good reduction, so it is a
    valid (if not logically airtight without also bounding false positives
    from unrelated accidental matches -- named as heuristic H2 below) proxy,
    computable with zero exact-rational cost.
    THE EFFICIENCY GAIN THAT MAKES A LARGE LADDER CHEAP. Reduction mod p^K
    is a ring homomorphism and the elliptic-curve group law is polynomial,
    so [m]S^ mod p^K equals [m] applied to (S^ mod p^K) under the SAME group
    law computed entirely mod p^K (padic.pmul, already used inside
    instrument.split_point for [n]P) -- for ANY integer m, however large,
    with no dependence on m's magnitude beyond O(log2 m) point operations.
    This is a standard, non-heuristic fact (not the size-law heuristic),
    and it is what let the original stage23.py driver's exact-Fraction
    m S^ computation (capped near m~40000 by measured Fraction-arithmetic
    cost, per derivation_note.md's leak-arm note) be REPLACED, for this
    claim-3 arm only, by cheap modular scalar multiplication -- decoupling
    the achievable ladder length from the m^2 exact-height blowup that
    capped the original 68-value ladder at m<=256. The size-law arm (claim
    2) is untouched and still needs exact arithmetic; this idea does not
    touch it.
  novelty_status: adaptation
