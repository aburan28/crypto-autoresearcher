# IDEA-20261003-b4b1ab
# Order-4 orbit sizes. Proposal only. Not approved.
idea:
  id: IDEA-20261003-b4b1ab
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Order-4 automorphism orbits have size 1, 2, or 4
  class: measurement
  claim: >-
    On one frozen j=1728 curve over one frozen prime field, every
    rational point has orbit size 1, 2, or 4 under the order-4
    automorphism. The allowed sizes 1, 2, and 4 sum to 7 and multiply
    to 8. Four exceeds 2 by 2. An orbit of size other than 1, 2, or 4
    falsifies the claim. The sum 7 is not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R3 is the automorphism group of order 4, distinct
    from negation, whose orbits have size 1 or 2. The operation set is
    that automorphism on rational points. Orbit sizes divide the group
    order, so the measurable sizes on this curve are 1, 2, and 4.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        Endomorphism image and the automorphism discount are in scope,
        and a constant at or below the discount is not an attack.
      verified_by: coordinator session 2026-10-03, question file read
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic floor remains the exponent constraint.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The curve is frozen and has j=1728.
    - The prime field has odd characteristic.
  proof_search_map:
    bottleneck: The allowed orbit sizes 1, 2, and 4.
    baseline_embedding:
      parameter_slice: One j=1728 curve and its order-4 automorphism.
      reproduction_check: >-
        Two counters list orbits and must agree that every size is 1, 2,
        or 4.
    observation_collision:
      observable: The multiset of orbit sizes.
      distinct_preimage_search: >-
        An orbit of size 3 or 8 is not the order-4 automorphism.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: The set of orbits.
        predicted_gain: A size check. No exponent.
    quantifier_order: >-
      The curve is fixed before the orbits are listed.
    method_ceiling:
      strongest_certifiable_claim: >-
        Orbit sizes on that curve. Not a GLV speedup.
      nearby_object_control: >-
        Negation alone. Its orbits have size 1 or 2, never 4, unless the
        point is fixed by a further automorphism.
    proof_obligations:
      - claim: Every orbit size is 1, 2, or 4.
        responsibility: correctness
      - claim: The allowed sizes sum to 7 and multiply to 8.
        responsibility: size
      - claim: The sum is not an ECDLP exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: orbit_size
      direction: different
      minimum_effect: Every orbit has size 1, 2, or 4.
  minimal_test:
    design: >-
      Freeze the curve. Enumerate rational points. Group them by the
      order-4 automorphism.
    controls:
      - Negation alone, whose sizes lie in {1, 2}.
      - An independent grouping.
    required_metrics:
      - orbit sizes
      - the count of each size
  falsification_conditions:
    - An orbit has size other than 1, 2, or 4.
    - The allowed-size sum is reported as something other than 7.
  confounders:
    - Characteristic 2 makes the usual automorphism formulas the wrong chart.
    - The point at infinity is a size-1 orbit.
  interpretation_limits:
    - One curve is not a theorem about every endomorphism.
    - Orbit size 4 is not a GLV decomposition speedup.
    - No transfer to a cryptographic prime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        An automorphism of order 4 partitions the rational points into
        orbits of size 1, 2, or 4.
      rigorous_support: >-
        Orbit sizes under a group action divide the group order. Here the
        group order is 4, and the positive divisors are 1, 2, and 4.
      validation_plan: >-
        Enumerate orbits. Any other size falsifies the reading on that curve.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: O(p) for a toy enumeration.
    best_known: >-
      Automorphism-discounted rho. The factor sqrt(4) is 2, a constant,
      not an exponent.
    hidden_overhead: The point at infinity and the characteristic.
    tradeoff_note: Enumeration is the measurement, not an attack.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic floor forbids reading an orbit size as an exponent
          improvement. This record measures sizes only.
  dominated_by: >-
    No attack is claimed. Rho rows dominate any attack reading of an
    orbit size.
  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: One frozen curve and one order-4 automorphism.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
