idea:
  id: IDEA-20260722-002
  title: THE CRUX -- does S_{m+1} beat generic m-SUM-Indexing as a decomposition oracle?
  class: algorithm
  claim: >-
    The summation polynomial S_{m+1} admits an algebraic data structure answering
    decomposition-membership queries over a size-B factor base in preprocessing
    o(B^{2-eps}) and query o(B^{1-eps}), beating the 3SUM-Indexing barrier and
    (with the localization theorem) yielding a sub-rho prime-field ECDLP algorithm.
  mechanism: >-
    The factor-base points satisfy the low-degree constraint S_{m+1}(.,x_R)=0;
    multipoint-evaluation / resultant-tree preprocessing of this variety might
    answer membership faster than a generic sumset, unlike arbitrary 3SUM sets.
  novelty_status: speculative
  assumptions: ["S_{m+1} multipoint structure is exploitable beyond generic sumsets"]
  predictions:
    - metric: (preprocessing exponent, query exponent) for the S_4 (m=3) oracle
      direction: lower
      minimum_effect: "query exponent < 1 with setup exponent < 2 (beats MITM/3SUM-Indexing)"
  minimal_test:
    design: >-
      For m=3 (S_4 as a bivariate elimination), test whether Kedlaya-Umans-style
      multipoint evaluation of the summation variety answers membership sublinearly
      vs the pairwise-sum table, at toy B.
    controls: [MITM pairwise table baseline; random-set 3SUM baseline]
    required_metrics: [preprocessing time/space, per-query time, correctness]
  falsification_conditions:
    - "no setup/query pair beats MITM's (B^2, B) -> algebra gives nothing, no-go stands"
  confounders: [toy-scale constants hiding the asymptotic; hash vs field-op cost model]
  interpretation_limits:
    - POSITIVE resolution is the breakthrough; NEGATIVE completes the conditional no-go
    - the single load-bearing open sub-problem of the program
  estimated_cost: {implementation: high, compute: medium}
  recommended_priority: high
  proposed_by: idea-generator
