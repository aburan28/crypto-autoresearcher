  # =====================================================================
  # 0. THE MIRROR-IMAGE RISK, SETTLED FIRST -- IT DETERMINES THE DESIGN
  # =====================================================================
  mirror_image_risk_resolution:
    status: >-
      THE COORDINATOR'S READING HOLDS. Derived independently and symbolically
      in this session from the RFC 1320 / RFC 1321 Round-1 step table and the
      module's own return-tuple algebra. Option (b) -- "read backward_step's
      tuple position 0 instead of position 1" -- is INADMISSIBLE ON ITS OWN at
      a one-step-separated split, and this proposal does NOT adopt it.
    derivation_forward: >-
      forward_step((a,b,c,d), xk, s, t) returns (d, new_a, b, c) with
      new_a = rotl(a + F(b,c,d) + xk + t, s) (+ b for MD5). As a map on tuple
      POSITIONS: new position 0 = old position 3; new position 1 = new_a
      (depends on all of positions 0..3 and on xk); new position 2 = old
      position 1; new position 3 = old position 2. Propagating the set E_d of
      positions functionally reachable from a free word consumed d steps
      earlier: E_0 = {1}; E_1 = {1,2}; E_2 = {1,2,3}; E_d = {0,1,2,3} for
      d >= 3. So at d = 0 -- word8 consumed at step 9, boundary state read
      immediately after step 9 -- ONLY position 1 depends on word8. Confirms
      the first half of the coordinator's reading.
    derivation_backward: >-
      backward_step((a2,b2,c2,d2), xk, s, t) returns (old_a, old_b, old_c,
      old_d) = (old_a, c2, d2, a2) with old_a = rotr(rotated,s) -
      F(old_b,old_c,old_d) - xk - t, rotated derived from b2 (and c2 for MD5).
      As a map on POSITIONS: new position 0 = old_a (depends on all of
      positions 0..3 and on xk); new position 1 = old position 2; new position
      2 = old position 3; new position 3 = old position 0. Propagating the set
      D_r of positions reachable from a free word supplied r further backward
      steps ago: D_0 = {0}; D_1 = {0,3}; D_2 = {0,2,3}; D_r = {0,1,2,3} for
      r >= 3. So at r = 0 -- word9 consumed at step 10, boundary state read
      immediately after step 9 -- ONLY position 0 depends on word9. Confirms
      the second half.
    the_consequence_stated_plainly: >-
      At the batch-4 split (word8 at step 9, word9 at step 10, S = 9) the two
      free words influence DISJOINT components of the boundary state: word8
      reaches only position 1, word9 only position 0. E_0 INTERSECT D_0 =
      EMPTY. Therefore NO single-component matching quantity at that split is
      jointly discriminating, in EITHER position. A bare position-0 swap
      relocates the degeneracy onto word8 and reproduces ANOM-1 with the roles
      exchanged. The coordinator's pre-committed prior P-R1 came out TRUE and
      this proposal is built around that fact rather than against it.
    sharper_fact_this_derivation_adds: >-
      The obstruction is not about "position 0 versus position 1" at all; that
      framing is an artifact of one split. The governing quantity is the
      SEPARATION between the two free words in the schedule. Writing i for the
      step consuming the forward free word and j for the step consuming the
      backward free word, with the boundary state read after step S
      (i <= S < j), the forward reach is E_d with d = S - i and the backward
      reach is D_r with r = j - 1 - S, and d + r = j - i - 1 INDEPENDENT OF S.
      E_d INTERSECT D_r is non-empty exactly when d + r >= 3, i.e. when
      j - i >= 4. Batch 4 had j - i = 1. NO CHOICE OF S OR OF COMPONENT COULD
      HAVE SAVED IT. This is the first-order design rule and it is why this
      proposal changes the free words, not the tuple index.
    why_option_c_is_not_adopted: >-
      Option (c) -- match on a window on position 0 AND a window on position 1
      -- does technically make both free words influence the matched pair at
      the batch-4 split, and it would pass a naively-written two-directional
      check. It is rejected here on a derived ground, not on taste: at that
      split the position-0 condition reads
      v_backward = C - word9 (mod 2^32) with C independent of word9, while
      forward position 0 is CONSTANT in word8; and position 1 forward varies
      with word8 while backward position 1 is a pass-through constant. The
      "match" therefore FACTORIZES into two independent univariate equations
      -- one solved by a single modular subtraction for word9, one by a sweep
      for word8. There is no joint constraint, hence no matching-window
      collision distribution, hence nothing for HEUR-H1 to be tested on, which
      is the batch's actual open question (DEC-20260821-1215e5 F-3). It is
      also, honestly, CHEAPER than this proposal at the pure recovery task --
      recorded in `dominated_by`, not buried.
    provenance_of_this_resolution: internal (derived this session; symbolic, not measured)
    epistemic_limit_of_the_symbolic_half: >-
      This derivation proves INDEPENDENCE where independence holds (a position
      outside E_d or D_r cannot depend on the word -- a theorem). It does NOT
      prove DEPENDENCE where the position is inside the reachable set: syntactic
      reachability is an over-approximation and algebraic cancellation can still
      annihilate it. That gap is exactly the gap batch 4 fell into, and it is
      why the k1=k2=4 two-directional MEASUREMENT below is mandatory and is a
      hard stop rather than a formality.

  # =====================================================================
  # 1. THE ONE CORRECTED CONSTRUCTION
  # =====================================================================
  claim: >-
    Construction R1-SEP10, defined exactly as: MD4 Round 1 (steps 1-16, word k
    used at step k+1); FREE WORD A = word 2 (consumed at step 3); FREE WORD B =
    word 12 (consumed at step 13); SPLIT POINT S = 8 (chunk1 = steps 1-8
    forward from the standard IV over words 0-7; chunk2 = steps 9-16 inverted
    backward from the declared Round-1 output state Y over words 8-15);
    DECLARED MATCHING COMPONENT p = 3 of the boundary state after step 8, which
    in the module's rotating tuple convention is the register value produced at
    step 6 (write it v6) -- is a NON-DEGENERATE two-free-word splice-and-cut
    MITM: the declared matching observable (low m bits of v6) is a function of
    word2 on the forward side and of word12 on the backward side, with word2
    separated from v6 by three F-layers and word12 separated from v6 by three
    F-layers. Under HEUR-H1 it locates the planted (word2, word12) pair
    reproducing Y using (2^k1 + 2^k2) chunk evaluations -- a MODELED
    ~11.3 x 10^3 step-evaluations at the declared k1 = k2 = 10, m = 12, k = 20
    -- against a naive all-pairs baseline of 2^(k1+k2) pairs x 16 forward steps
    = 2^24 step-evaluations over the SAME restricted two-word space. The claim
    is falsifiable at the k1=k2=4 gate (both distinct-value counts must exceed
    1), at the k1=k2=6 brute-force control (certificate-verified MITM solution
    set must equal the independently-computed naive Y-reproducing set, AND the
    raw pre-certificate solution set must not be a full row or column), and at
    the H1 distribution check. It is a claim about a bounded Round-1 toy slice
    of MD4 -- 16 of 48 steps, 2 of 16 words, a 20-bit target -- and about
    NOTHING ELSE.

  mechanism: >-
    Round 1 of MD4 and MD5 consumes X[0..15] exactly once in index order, so
    any interior split S gives two disjoint word sets for free; that part was
    never the problem. What batch 4's construction lacked, and what R1-SEP10
    supplies, is INFLUENCE OVERLAP at the boundary. Section 0's propagation
    calculus gives the exact requirement: with the forward free word consumed
    at step i and the backward free word at step j, a single boundary component
    can carry both dependencies iff j - i >= 4. R1-SEP10 takes i = 3 (word2)
    and j = 13 (word12), separation 10, which is far past the threshold -- and
    deliberately so, for a second reason the threshold alone does not capture.
    Reachability is not enough: the Round-1 auxiliary function
    F(X,Y,Z) = (X AND Y) OR (NOT X AND Z) is BITWISE and SELECTING. A component
    only ONE F-layer away from a free word inherits that word only through the
    Y- or Z-branch, gated bit-by-bit by the X-register: output bit t moves with
    the word only where the gating bit permits it, so the low-m window can be
    partly -- in the extreme, entirely -- frozen by the fixed words alone.
    (Concretely, at the batch-4 split the backward-recovered position 0 is the
    bare affine map C - word9, and one step further back the recovered value is
    Const - F(v10, v9, C - word9): if v10's low m bits happen to be all 1, the
    low-m window is CONSTANT in word9 despite word9 being formally reachable.)
    At depth 2 and beyond, the free word enters BOTH the Y- and Z-branch of the
    same F, so no single gating register can annihilate it. R1-SEP10 therefore
    chooses the component that is depth 3 from BOTH free words. Enumerating the
    four boundary components of state8 by (forward depth from word2, backward
    depth from word12): position 0 = v5 is (2,4); position 1 = v8 is (5,1);
    position 2 = v7 is (4,2); position 3 = v6 is (3,3). Position 3 is the
    unique balanced maximum and is the declared choice. Note that tuple
    position 1 -- the position batch 4 read, and the position the module's own
    docstring advertises as "the value most recently computed" -- is depth 1 on
    the backward side even here, and would be the WORST of the four. The
    instrument is then the ordinary MITM: enumerate word2's k1-bit window
    forward from a once-computed state2 (6 steps each) into a hash table keyed
    on the low m bits of v6; enumerate word12's k2-bit window backward from a
    once-computed state13 (5 inversions each) and probe; promote an m-bit hit to
    a full k-bit hit only on exact equality; promote a full k-bit hit to a
    solution only when an independent straight-line 16-step forward
    recomputation reproduces Y exactly.

  construction_parameters:
    primitive_primary: md4
    round: 1
    word_schedule: word k used at step k+1, k = 0..15 (RFC 1320 sec 3.4 / RFC 1321 sec 3.4)
    free_word_A: 2
    free_word_A_consumed_at_step: 3
    free_word_B: 12
    free_word_B_consumed_at_step: 13
    separation_j_minus_i: 10
    separation_threshold_required: 4
    split_point_S: 8
    chunk1: steps 1-8 forward from the standard IV, words 0-7
    chunk2: steps 9-16 inverted backward from Y, words 8-15
    boundary_state: state8
    boundary_state_component_semantics: >-
      In the module's rotating convention, state_n = (v_{n-3}, v_n, v_{n-1},
      v_{n-2}) where v_t is the register value produced at step t. So
      state8 = (v5, v8, v7, v6): position 0 = v5, position 1 = v8,
      position 2 = v7, position 3 = v6.
    declared_matching_component_index: 3
    declared_matching_component_name: v6 (the register value produced at step 6)
    forward_F_depth_word2_to_v6: 3
    backward_F_depth_word12_to_v6: 3
    matching_window_m: 12
    full_target_k: 20 (low 20 bits of v6 on the true trajectory)
    declared_scale_k1: 10
    declared_scale_k2: 10
    gate_scale: k1 = k2 = 4
    brute_force_control_scale: k1 = k2 = 6
    fixed_words: the other 14 words (0,1,3,4,5,6,7,8,9,10,11,13,14,15), non-zero, from a pre-registered seed
    free_word_windows: low k1/k2 bits free, high (32-k) bits fixed from the same seeded generation
    per_candidate_cost_chunk1: 6 forward steps (steps 3-8), after a once-computed 2-step prefix
    per_candidate_cost_chunk2: 5 backward steps (invert 13,12,11,10,9), after a once-computed 3-inversion suffix
    target_Y: the full Round-1 output state after step 16 on the true trajectory
    certificate: >-
      an independent straight-line 16-step forward recomputation with the
      claimed (word2, word12) must reproduce Y exactly AND reproduce the
      declared low-20-bit target; only certificate-verified pairs are solutions
    module: >-
      A NEW SIBLING MODULE is required; harness/run_md4_ceiling.py is
      BATCH-af29f6's frozen instrument of record and is not to be edited. The
      new module's run manifest carries a `caveat_refs` field from the start
      (SC-5). Naming and authorization are the gate's call, not this record's.

  # =====================================================================
  # 2. OBJECT-FIRST ACCOUNTING (docs/inventor-protocol.md sections 1-2)
  # =====================================================================
  object_analysis:
    established_families_named: >-
      Splice-and-cut / chunk-separation MITM preimage attacks with neutral
      message words, initial structures, and partial matching (KN-LIT-4878
      unverified bulk-seed relay; KN-LIT-582d77 metadata-only; Aoki-Sasaki FSE
      2009, provenance `recalled`, no primary text read by any agent in this
      program). This target is NOT recorded by this corpus as heavily mined at
      the bounded-toy-slice level -- one prior instrument exists
      (EXP-MDFIVE-88f7d1) and it was degenerate -- so the off-limits-family
      declaration does not bind here; the enumeration below is done anyway
      because the previous batch failed for want of it.
    candidate_objects_enumerated:
      - object: the boundary register VALUE at the split (batch 4's object)
        new_or_repackaging: repackaging (the default object of every MITM writeup)
        testable: yes -- one-step propagation is the step function itself
        survives_until: >-
          dissolves immediately when the tracked register has not yet consumed a
          declared free word; that is ANOM-1. Scored and rejected as the PRIMARY
          lens.
      - object: >-
          the DEPENDENCE-SUPPORT of the boundary state -- the map (free word) ->
          (set of tuple positions functionally reachable from it), propagated
          one step at a time. CHOSEN as the primary lens.
        new_or_repackaging: >-
          not new as a general idea (it is ordinary syntactic dependence
          analysis); NOT WRITTEN DOWN ANYWHERE IN THIS CORPUS -- KN-TECH-bb7e9f
          states the design rule but gives no propagation calculus, and the
          literature's "partial fixing" technique plausibly encodes the same
          content (provenance `recalled`, unread). Honest label: unverified.
        testable: >-
          yes, and cheaply: the one-step propagation is the explicit pair of
          transition rules E and D derived in section 0, and its prediction --
          which components can discriminate which word -- is measured directly
          by distinct-value counts at k1=k2=4 and k1=k2=6.
        survives_until: >-
          depth 1. Syntactic reachability and actual variation agree at depth
          >= 2 and can diverge at depth 1, where F's bitwise selection lets a
          fixed gating register annihilate the dependence. The F-depth
          refinement (HEUR-H1b) is the first-order correction, and the point at
          which the object stops being trustworthy is named, not hidden.
      - object: the F-gating mask (which bits of a register are selected through)
        new_or_repackaging: >-
          this is very likely the object underlying the literature's
          partial-fixing / indirect-partial-matching techniques (`recalled`)
        testable: yes -- countable directly as distinct-value counts per bit
        survives_until: >-
          it is a refinement of the chosen object rather than a rival; folded in
          as HEUR-H1b instead of tracked separately
      - object: the fiber map wB -> {wA that m-bit-match it}
        new_or_repackaging: repackaging of the observation-collision fiber
        testable: yes, exhaustively at k1=k2=4 and k1=k2=6
        survives_until: >-
          used as the ANOM-1 operational detector (gate part iii), where a
          constant fiber map is the exact signature of a degenerate word channel
      - object: the boundary-state difference under a one-word perturbation (differential)
        new_or_repackaging: repackaging (this is differential cryptanalysis)
        testable: yes
        survives_until: >-
          not pursued: it is the collision-path lens, it is the lens the
          quarantined payload belongs to (SC-6), and it answers a different
          question than the MITM cost question this goal asks
    lossy_projection_test:
      tracked_object: dependence-support of the boundary state
      what_is_discarded: >-
        all register VALUES. The object retains only which positions are
        functionally reachable from which declared free word.
      is_it_lossy: >-
        YES, maximally so: a 128-bit state is projected onto a subset of
        {0,1,2,3} per free word. It is not a change of coordinates -- the values
        are not recoverable from the support, and the support is invariant under
        every choice of fixed-word seed.
      is_the_discard_compatible_with_the_operations: >-
        YES. The support propagates DETERMINISTICALLY under both the forward and
        the backward step map, by the explicit transition rules derived in
        section 0 (forward: pos0 <- pos3, pos1 <- everything, pos2 <- pos1,
        pos3 <- pos2; backward: pos0 <- everything, pos1 <- pos2, pos2 <- pos3,
        pos3 <- pos0). The retained part therefore propagates without consulting
        the discarded part, which is the criterion.
      in_which_direction_it_is_one_sided: >-
        The projection is an OVER-approximation: it is exact for proving
        independence and only suggestive for dependence. Stated as a limit of the
        object, not a defect to be argued away.
      the_secondary_projection_used_as_a_filter: >-
        The declared matching observable (low m bits of v6) is a SECOND, different
        lossy projection -- 12 of 128 bits. It does NOT propagate: v6 alone
        cannot be stepped. That is admitted openly: it is used as a one-way
        sieve, not as a state, and the 116 discarded bits are recovered by the
        certificate. Its adequacy is measured by audit 2, never asserted.

  novelty_status: unverified
  novelty_note: >-
    `unverified` is the honest label and is not a hedge. The splice-and-cut MITM
    family is published and known (KN-LIT-4878, KN-LIT-582d77, Aoki-Sasaki FSE
    2009 -- the last `recalled` only, no primary text read by any agent here).
    The specific content this record adds is (i) the separation threshold
    j - i >= 4 as a necessary condition for a single-component matching quantity
    in this schedule, derived from the return-tuple algebra, and (ii) the
    F-depth >= 2 refinement, which says reachability is insufficient because one
    F-layer is a bitwise selection. This session's WebSearch surfaced
    search-engine summaries indicating the published literature has a named
    "partial-fixing" / "indirect partial matching" technique built precisely on
    the fact that only some bits of a chaining variable depend on a neutral word
    -- which is the same phenomenon (ii) names. NO PRIMARY TEXT WAS READ, so no
    claim is made that (i) or (ii) is new; a session that reads Aoki-Sasaki FSE
    2009 or Zhong-Lai eprint 2010/583 could well downgrade this to `known` or
    `adaptation` in a new record, and that would be a normal outcome. Absence of
    a corpus hit licenses no inference (AGENTS.md knowledge retrieval policy).

