          NO single-component matching quantity is jointly discriminating at any
          split point when the two free words are separated by fewer than 4 steps
          in this schedule -- in particular at the batch-4 separation of 1,
          NEITHER tuple position 0 NOR position 1 NOR any other component works,
          for any choice of S.
        mechanism: >-
          The named obstruction is DISJOINT REACHABILITY. The forward reach E_d
          and backward reach D_r of the two free words at the boundary satisfy
          E_d INTERSECT D_r = EMPTY whenever d + r <= 2, and d + r = j - i - 1 is
          independent of the split point, so moving S cannot repair it. Derived
          symbolically in section 0 from the return-tuple algebra.
        scope: >-
          MD4/MD5 Round 1's sequential schedule and the module's rotating
          4-tuple step convention. NOT claimed for other schedules, other rounds,
          multi-word chunks, or multi-component matching.
        forward_guidance: >-
          The classes that remain OPEN and are NOT closed by this: (a) separation
          >= 4 with a single component -- what this record proposes; (b)
          multi-component matching, which does work at short separation but
          factorizes into decoupled univariate solves and is therefore a
          different (and cheaper -- see dominated_by row 1) instrument, not a
          joint MITM; (c) more than two free words per chunk, where the reach sets
          are unions and the analysis differs; (d) round-crossing chunks, which
          this family cannot reach at all because Round 1 uses every word exactly
          once.
      - closure: >-
          Reading "the register just updated" (tuple position 1) is a BAD default
          for a splice-and-cut matching quantity in this schedule, not a good one.
        mechanism: >-
          Position 1 is depth 0 from the forward free word and depth 1 or 0 from
          the backward free word at every separation -- it is the position most
          exposed to both the disjoint-reachability failure and the depth-1
          bit-selection failure. Derived, and directly contradicts
