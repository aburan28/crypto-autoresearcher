        consistent with, and possibly prior art for, this record's separation and
        F-depth statements.
      verified_by: null
      note: >-
        NO PRIMARY TEXT READ. Logged as the nearest external work a reviewer
        should chase before crediting anything in section 0 as new. This is the
        reason `novelty_status` is `unverified` rather than `adaptation`.

  assumptions:
    - >-
      A-1 (THE REPLACEMENT FOR BATCH 4'S FALSE BOTTLENECK CLAIM (b), STATED
      EXPLICITLY AS AN ASSUMPTION AND NOT AS A FACT): for the declared
      (word2, word12, S = 8, p = 3) and the declared fixed-word seed, the
      forward-computed low-m window of v6 takes more than one value as word2
      ranges over its window, AND the backward-computed low-m window of v6 takes
      more than one value as word12 ranges over its window. Section 0 proves only
      that neither is FORCED constant; actual variation is an empirical claim.
      DISCHARGED BY: proof obligation G-1 (the mandatory k1=k2=4 two-directional
      gate), and by nothing else. It is not discharged by the symbolic derivation,
      not by the RFC vectors, not by the H2 inversion fixture, and not by the
      brute-force control. Batch 4's analogous claim was asserted and unchecked
      and was false (red-team D1; DEC-20260821-1215e5 F-2).
    - >-
      A-2: the implementation masks every addition and rotation to 32 bits and
      selects add_b correctly per primitive (MD4 has NO "+= b"; MD5 does). This
      exact distinction was a caught bug in batch 4's own module (its docstring
      records a first draft failing all seven RFC 1320 A.5 vectors). Discharged
      by the RFC-vector self-check and the H2 fixture.
    - >-
      A-3: the 14 fixed words are pre-registered from a documented seed BEFORE
      any run and are non-zero (an all-zero fix can collapse F).
    - >-
      A-4: the target-generation stream and the search enumeration are
      independently seeded, and the search never reads the true words.
    - >-
      A-5: the declared window contains the planted pair by construction (the
      true words are drawn from the same declared low-bit window the search
      enumerates).

  # =====================================================================
  # 3. THE FOUR KN-TECH-080 AUDITS, RE-RUN AGAINST THE NEW OBJECT
  # =====================================================================
  proof_search_map:
    audit_rerun_attestation: >-
      All four audits below were RE-DERIVED against R1-SEP10 in this session.
      NONE of IDEA-20260821-e46061's audit text is carried forward. The two
      places where the previous record's conclusions are referenced -- the
      "no neutral word survives a full-round chunk" negative fact, and the
      Poisson lambda formula -- are referenced as PRIOR RESULTS with their
      source named, and both are re-stated in terms of the new object. Audit 1's
      bottleneck is a different bottleneck; audit 2's observable is a different
      observable; audit 3's quantifier statement adds a second claim the previous
      record did not make; audit 4's ceiling is a different and much sharper
      ceiling. Joint R2 of the review plan is invited to diff them.

    bottleneck: >-
      THE DECISION-CHANGING STEP IS THE CHOICE OF FREE-WORD SEPARATION, NOT THE
      CHOICE OF SPLIT POINT OR TUPLE INDEX. Precisely: the step whose removal
      changes the result is "place the two free words at schedule distance
      j - i >= 4 AND read a boundary component at F-depth >= 2 from BOTH". Remove
      the first half (take j - i <= 3) and E_d INTERSECT D_r is empty, so NO
      single-component matching quantity is jointly discriminating and the
      instrument degenerates to a one-free-word locator -- that is exactly
      ANOM-1, and it is now a derived prediction rather than a surprise. Remove
      the second half (keep the separation but read a depth-1 component, e.g.
      tuple position 1 = v8, which is depth 1 backward even at separation 10) and
      the free word survives into the observable only through one bitwise F
      selection, so the low-m window can be partially or wholly frozen by the
      fixed words -- a partial, seed-dependent degeneracy that a single lucky
      seed could hide. Both halves are load-bearing and both are measured, not
      assumed.
    bottleneck_contrast_with_batch_4: >-
      Batch 4's bottleneck claim (b) was "lands the matching point on a register
      that was just updated, so the comparison is meaningful". That claim is
      FALSE AS A DESIGN PRINCIPLE and this record inverts it: "just updated" is
      precisely tuple position 1, which is depth 0 forward and (at any useful
      separation) depth 1 or 0 backward -- the WORST component of the four, not
      the best. R1-SEP10 deliberately reads the OLDEST component of the boundary
      state that is still inside the backward free word's reach.

    baseline_embedding:
      parameter_slice: >-
        The batch-4 construction is an EXACT PARAMETER SLICE of R1-SEP10's
        parameter family: set free_word_A = 8, free_word_B = 9, S = 9,
        p = 1, k1 = k2 = 10, m = 12, k = 20. Same code path, same functions,
        same observable extractor -- only the four parameters differ.
      reproduction_check: >-
        A FROZEN REGRESSION FIXTURE, not a numerical resemblance, and it is a
        NEGATIVE fixture: at that slice the new module MUST REPRODUCE ANOM-1.
        Specifically the fixture asserts, through the same
        `chunk2_observable` function the declared-scale run calls, that the
        backward-side distinct-value count over the free-word-B window is
        EXACTLY 1 while the forward-side count over the free-word-A window
        EXCEEDS 1. If the new module does not reproduce ANOM-1 at the old
        parameters, the new module does not implement the old construction and
        no comparison between them means anything. This fixture doubles as the
        null-object control for the gate detector (proof obligation G-0) and is
        the strongest available answer to KN-TECH-9d21c4's "can this null fail"
        line: the detector is required to FAIL on an object where failure is
        already a proved fact.
      symbolic_half: >-
        Additionally checked symbolically this session: at (8,9,S=9) the
        propagation rules give E_0 = {1} and D_0 = {0}, disjoint -- so the
        fixture's expected outcome is derived in advance, not read off the run.
      carried_forward_prior_result: >-
        IDEA-20260821-e46061's negative baseline fact -- no neutral word survives
        a chunk spanning a full round, since Round 1 alone uses every word once
        -- still holds and still bounds any multi-round extension. Re-stated for
        the new object: R1-SEP10 needs BOTH free words strictly inside Round 1
        and at least 4 steps apart, which costs 10 of the 16 steps' worth of
        schedule distance here; a round-crossing instrument cannot be obtained by
        widening this one.

    observation_collision:
      observable: >-
        The low m = 12 bits of v6 (boundary component p = 3 of state8), computed
        forward from the IV as a function of word2 and computed backward from Y
        as a function of word12, compared for equality. The promotion condition
        is exact equality on the full k = 20 bits; the solution condition is the
        16-step certificate.
      distinct_preimage_search: >-
        COLLISIONS EXIST AND ARE PREDICTED IN ADVANCE, not argued away. Two
        distinct (word2, word12) pairs sharing the 12-bit observable while
        differing in the 20-bit target: expected count 2^(k1+k2-m) = 2^8 = 256
        per target at the declared scale. Two distinct pairs sharing the full
        20-bit target while only one reproduces Y -- i.e. one satisfying and one
        VIOLATING the target conclusion, which is the pair audit 2 actually asks
        for: expected count 2^(k1+k2-k) = 2^0 = 1 besides the planted pair.
        THEREFORE THE OBSERVABLE IS INSUFFICIENT ON ITS OWN and the separating
        condition is stated as part of the construction: the independent
        straight-line 16-step forward recomputation reproducing Y.
      the_search_itself_not_an_assertion: >-
        At k1 = k2 = 6 the pair space (4096) is exhaustively enumerable, so the
        collision search is RUN rather than reasoned about: enumerate all 4096
        pairs, report every pair whose low-20 bits agree, and report which of
        them reproduce Y. Expected: the planted pair, plus ~4096/2^20 = 0.004
        others, i.e. usually none. At the declared k1 = k2 = 10 the expected
        count of non-Y-reproducing full-target collisions is ~1 and MUST be
        reported as a number rather than assumed to be zero.
      structural_collision_family_check: >-
        Searched for symbolically and NOT FOUND: at depths (3,3) no forced
        collision family is visible, unlike the batch-4 slice where the entire
        word9 window is a forced collision family (the fiber map is constant --
        that IS a structural collision family, and it is what ANOM-1 is). A
        forced family here would show as a distinct-value count far below the
        sweep width; the gate and the k1=k2=6 control both report those counts as
        numbers, so a family would be detected rather than inferred. Reporting
        "none found symbolically" is not a claim that none exists.

    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the naive 2^(k1+k2)-pair full-recomputation search over the
          restricted two-word space with a hash table keyed on the 12-bit window
          of v6, built from chunk1's 2^k1 forward candidates (6 steps each after
          a shared 2-step prefix) and probed by chunk2's 2^k2 backward candidates
          (5 inversions each after a shared 3-inversion suffix).
        predicted_gain: >-
          MODELED at k1 = k2 = 10: 2^10 x 6 + 2^10 x 5 + 5 fixed = 11,269
          step-evaluations (~2^13.46) plus ~256 window probes and ~2 certificate
          checks of 16 steps each, versus 2^20 x 16 = 2^24 step-evaluations for
          the literal naive all-pairs baseline over the SAME restricted two-word
          space -- a modeled ratio of ~2^10.5 (~1490x). In the coarser
          "chunk evaluation" unit the ratio is (2^10 + 2^10) vs 2^20 = 512x.
          THAT 512x IS NUMERICALLY THE SAME AS BATCH 4'S HEADLINE AND MUST NOT BE
          CONFUSED WITH IT: batch 4's 512x was measured over a space the
          instrument searched as ONE effective free word (EV-MDFIVE-ab007d O-2;
          RUN-MDFIVE-primary-md4-v2; ANOM-1 caveat, KN-TECH-bb7e9f), so its
          denominator did not mean what it appeared to mean. Here the same ratio
          would be over a genuinely two-word space -- IF AND ONLY IF the G-1 gate
          passes. Modeled, not measured; nothing here is projected to any larger
          scale.
      - transform: observable_fiber
        proposed_object: >-
          The fiber map wB -> {wA : the m-bit windows agree}, enumerated
          exhaustively at k1 = k2 = 4 and k1 = k2 = 6.
        predicted_gain: >-
          Not a speedup -- a DETECTOR. A constant fiber map is the exact
          operational signature of ANOM-1 (batch 4's fiber map was the constant
          full window). Requiring the fiber map to be non-constant is gate part
          (iii) and catches the failure mode that per-side distinct-value counts
          alone can miss, including the decoupled option-(c) construction.
      - transform: not_selected
        proposed_object: null
        predicted_gain: >-
          boundary_lift, stronger_invariant, telescoping_potential and
          specialization_pack are NOT selected. R1-SEP10 is a bounded
          computational instrument, not a recursive proof (nothing composes over
          a recursion), not a rare-event/martingale argument (there is no
          conditioning cost to telescope), and not a packed lower-bound measure
          (there is no additivity to prove). Recorded as inapplicable rather than
          omitted.

    quantifier_order: >-
      CLAIM 1 (the search claim, EXISTENTIAL AND PER-TARGET). FOR the declared
      primitive P in {md4}, FOR the pre-registered fixed-word seed sigma, FOR
      each target t drawn from the declared seeded stream -- t fixing the planted
      pair (wA*, wB*) and hence Y(t) and target_low20(t) -- THERE EXIST
      (wA, wB) in W_A x W_B such that low_m(v6_fwd(wA)) = low_m(v6_bwd(wB, Y(t)))
      AND low_k(v6_fwd(wA)) = target_low20(t) AND the 16-step certificate
      verifies. The witness IS ALLOWED to depend on: t, sigma, P, and
      (k1,k2,m,k). The witness IS NOT ALLOWED to depend on (wA*, wB*): the search
      may not read the planted words, and the feasibility obligation -- not the
      search -- is what guarantees the space contains them. NOT CLAIMED: "for all
      targets, a match is found within the declared cost"; NOT CLAIMED: any
      statement quantified over fixed-word seeds.
      CLAIM 2 (the distributional claim, HEUR-H1, PER-DRAW RANDOM VARIABLE). FOR
      the declared sigma and P, the matching-window collision count C_t, as t
      ranges over N independent draws, is claimed to be distributed as
      Poisson(lambda = 2^(k1+k2-m)). This is a claim about a DISTRIBUTION over
      the draw, not a bound holding for every draw, and it is tested by a
      goodness-of-fit statistic with lambda FIXED a priori (no parameter
      estimated from the data, so df = bins - 1).
      CLAIM 3 (the gate claim, and the one whose quantifier order batch 4 got
      wrong by omission). What must be true is: FOR ALL held-fixed values of the
      other free word, the map (this free word) -> observable is non-constant.
      What the mandatory minimum gate actually tests is: FOR ONE held-fixed
      value. That is an EXISTENTIAL witness of non-degeneracy, strictly weaker
      than the universal statement, and this record says so rather than eliding
      it. The gate is therefore specified to sweep FOUR pre-registered held-fixed
      values per direction (64 evaluations per direction -- still trivial) and to
      require the non-constancy at EVERY one of them. That is still not the
      universal claim; it is a 4-fold-stronger existential, and it is labeled as
      such.

    method_ceiling:
      strongest_certifiable_claim: >-
        UNDER IDEAL TUNING, the very strongest thing R1-SEP10 could ever certify
        is: "for MD4's Round 1, with 14 message words fixed and words 2 and 12
        free, the planted pair reproducing a declared Round-1 output state Y is
        recovered by a two-chunk meet-in-the-middle search in (2^k1 + 2^k2) chunk
        evaluations rather than 2^(k1+k2), with the pair independently
        re-verified against a straight-line 16-step forward recomputation, and
        the matching-window collision counts either are or are not consistent
        with Poisson(2^(k1+k2-m))."
      hard_ceiling_derived_this_session: >-
        THE INSTRUMENT CAN ONLY EVER RECOVER A PLANTED PAIR; IT CAN NEVER INVERT
        AN ARBITRARY Y. Two free 32-bit words supply 64 bits of freedom against a
        128-bit Round-1 output state. For an arbitrary Y no solution exists with
        probability ~1 - 2^-64, so every "success" this instrument reports is
        conditioned on Y having been generated from a pair inside the declared
        window. This is a ceiling on the OBJECT, not on the tuning, and no choice
        of k1, k2, m, k, split point or component escapes it. Stating it here in
        advance is meant to make it impossible for any downstream record to read
        a successful run as a preimage result.
      free_word_capacity_ceiling: >-
        Within Round 1 at S = 8 and component v6, the F-depth >= 2 requirement
        admits forward free words only at steps i <= 4 (words 0-3) and backward
        free words only at steps j >= 12 (words 11-15): at most 4 + 5 = 9 free
        words, 288 bits of freedom, still filtered by a single 32-bit component.
        Matching on ALL FOUR boundary components (a full 128-bit Round-1
        connection) requires depth >= 2 on every component, i.e. i <= 3 and
        j >= 14 -- e.g. (word2, word13) -- which is reachable in this family and
        is named here as the natural next rung, NOT attempted this batch.
      nearby_object_control_1_known_to_fail: >-
        THE BATCH-4 SLICE (word8, word9, S = 9, p = 1) is a nearby object where
        the hoped-for conclusion is KNOWN FALSE -- proved false, four independent
        ways (EV-MDFIVE-ab007d strength_note). R1-SEP10's own gate is required to
        DISTINGUISH the pair: PASS on (2,12,S=8,p=3) and FAIL on (8,9,S=9,p=1),
        through the same code path. A method that cannot distinguish them has not
        identified the load-bearing structure (KN-TECH-080 audit 4's own words),
        and in this case would simply be a broken detector. This is the sharpest
        nearby-object control available anywhere in this goal, because the
        nearby object's verdict is not merely expected -- it is already proved.
      nearby_object_control_2_md5: >-
        MD5's Round 1 at the IDENTICAL parameters. PREDICTIONS STATED BEFORE ANY
        RUN: (i) the dependence structure is identical (both primitives share the
        word schedule and F), so the gate MUST pass for MD5 too; a gate that
        passes for MD4 and fails for MD5 indicates an implementation defect in
        the shift/constant/add_b substitution, NOT a structural finding, and is a
        STOP. (ii) The full-target-hit ratio R = MD5/MD4 is expected to be ~1 by
        birthday counting alone, for ANY non-degenerate instrument at these
        parameters, and is DECLARED IN ADVANCE TO CARRY ESSENTIALLY NO
        INFORMATION -- this is the pre-commitment that stops a repeat of
        EV-MDFIVE-ab007d O-4, where R = 1.0 was near-mechanically forced by the
        shared schedule. (iii) The INFORMATIVE comparison is the shape statistic:
        the chi-square p-value and the sample variance of the matching-window
        collision counts, where the two primitives' different shift tables and
        additive constants genuinely can differ (batch 4 already measured a 16x
        difference in raw matching_window_hits between arms -- ANOM-1 caveat
        applies to that figure). A distinguishing result there would be
        reportable only after a null-constant replication.

    proof_obligations:
      - claim: >-
          G-0 (DETECTOR NULL CONTROL -- RUNS FIRST, BEFORE G-1). Executed at
          k1 = k2 = 4 on the BATCH-4 PARAMETER SLICE (free words 8 and 9, S = 9,
          component p = 1) through the SAME functions the declared-scale run
          uses, the two-directional predicate must report FAIL, with
          distinct_bwd EXACTLY 1 and distinct_fwd > 1. PASS/FAIL PREDICATE: the
          obligation is discharged only if the predicate returns FAIL on this
          slice. If the predicate PASSES here, the detector cannot see a
          degeneracy that is already proved to exist, the whole gate is void, and
          the batch STOPS regardless of what R1-SEP10 does.
        responsibility: correctness
      - claim: >-
          G-1 (THE MANDATORY TWO-DIRECTIONAL DEPENDENCE GATE -- HARD STOP). See
          the fully specified `mandatory_dependence_gate` block below, which is
          the implementable form. Summary: at k1 = k2 = 4, on the SAME declared
          matching observable through the SAME code path the declared-scale run
          uses, (i) sweeping free word A over its 16 window values with free word
          B held fixed must yield distinct_fwd >= 2; (ii) sweeping free word B
          with A held fixed must yield distinct_bwd >= 2; (iii) the fiber map
          must be non-constant; (iv) a simultaneous both-word sweep DOES NOT
          DISCHARGE ANY OF THESE and must not be substituted. FAILURE IS A STOP:
          no declared-scale run happens, the batch reports the failure as a
          finding, and that is a complete and valuable outcome (SC-7, batch
          objective).
        responsibility: correctness
      - claim: >-
          C-1 (BASELINE / COMPLETENESS CONTROL, NON-VACUOUS BY CONSTRUCTION). At
          k1 = k2 = 6, the set of CERTIFICATE-VERIFIED MITM solutions equals the
          set found by a naive search that enumerates all 4096 pairs and, for
          each, runs an INDEPENDENT straight-line 16-step forward recomputation
          and compares the resulting Round-1 output state to Y. THE NAIVE SIDE
          NEVER CALLS backward_step, NEVER READS COMPONENT p, AND NEVER READS THE
          MATCHING WINDOW -- so the two sides do not read the same potentially
          degenerate quantity, which is precisely what made batch 4's k1=k2=6
          control vacuous (EV-MDFIVE-ab007d O-2). This control CAN fail: if the
          separation/depth algebra is wrong, the MITM misses the planted pair and
          the naive search still finds it.
          STATED LIMIT, HONESTLY: C-1 tests COMPLETENESS, NOT NON-DEGENERACY. A
          construction degenerate in one free word would emit every value of that
          word as a raw candidate, all but one would fail the certificate, and the
          surviving sets would still match. C-1 alone would therefore STILL pass
          vacuously against ANOM-1. That is why C-2 exists and why G-1 is the
          gate.
        responsibility: baseline
      - claim: >-
          C-2 (DEGENERACY CONTROL ON THE RAW SOLUTION SET -- THE CHECK BATCH 4
          DID NOT HAVE). At k1 = k2 = 6, the RAW pre-certificate MITM candidate
          set must satisfy BOTH: (a) |{distinct wA appearing}| < 2^k1 AND
          |{distinct wB appearing}| < 2^k2 -- i.e. neither projection covers its
          entire window; and (b) the raw candidate count is at most 4 (expected
          value 1 + 4096/2^20 ~= 1). Batch 4's raw solution set was exactly a full
          row -- one wA paired with all 1024 wB (EV-MDFIVE-ab007d O-1) -- and
          would have failed (a) immediately. FAIL on either part is a STOP.
        responsibility: correctness
      - claim: >-
          C-3 (FEASIBILITY). The declared window contains the planted pair by
          construction: the target generator draws the true low bits of words 2
          and 12 from the same declared k1/k2-bit window the search enumerates,
          and the certificate confirms the pair reproduces Y.
        responsibility: feasibility
      - claim: >-
          C-4 (EXACT INVERTIBILITY, HEUR-H2). backward_step composed with
          forward_step is the identity on >= 10,000 uniformly random
          (a,b,c,d,x,s,t) tuples, EXACTLY, for both add_b conventions. Already
          established for the batch-4 module (RUN-MDFIVE-buildcheck); must be
          re-established for the new sibling module because it is new code.
        responsibility: correctness
      - claim: >-
          C-5 (PRIMITIVE CORRECTNESS). The new module reproduces all seven RFC
          1320 Appendix A.5 MD4 test vectors and the RFC 1321 sec 3.4 sine
          definition of T[1..16].
        responsibility: correctness
      - claim: >-
          C-6 (SCOPE). Every result from this instrument is scoped to Round 1,
          two free words of sixteen, a 20-bit target, and the declared bounded
          k1/k2; it is not evidence about full 48-step MD4 or 64-step MD5, and
          the claim ceiling for this batch is `analyzed`, never `supported`.
        responsibility: scope
      - claim: >-
          C-7 (COST HONESTY). Every cost figure is labeled MODELED or MEASURED;
          no figure in this record or downstream from it projects toward the
          ~2^64-block instrument-class gap (SC-3, DEC-20260821-1215e5 F-8), and
          every BATCH-af29f6 raw metric cited carries the ANOM-1 caveat (SC-4).
        responsibility: scope
    not_applicable_reason: null

  # =====================================================================
  # 4. THE MANDATORY GATE, IN IMPLEMENTABLE FORM
  # =====================================================================
  mandatory_dependence_gate:
    id: G-1
    authority_note: >-
      Written to be frozen verbatim into EXP-MDFIVE-a8e71e as both a
      proof_obligation and a success_criterion by TASK-20260821-fad775. This
      record proposes it; it assigns nothing and approves nothing.
    when: >-
      FIRST executable action of the executor task, BEFORE any declared-scale
      run, and immediately after G-0 (the batch-4-slice detector null control).
    scale: k1 = k2 = 4 (16 values per free word; 256 pairs; expected runtime well under one second)
    observable_identity_requirement: >-
      The gate reads THE DECLARED MATCHING OBSERVABLE -- the low m = 12 bits of
      boundary component p = 3 of state8 -- through THE SAME two functions the
      declared-scale search calls (name them chunk1_observable(wA) and
      chunk2_observable(wB, Y)), with no reimplementation, no nearby quantity,
      and no convenience wrapper. The gate MUST additionally report the same
      counts at full 32-bit resolution, so that a window-only collapse is
      distinguishable from a value-level collapse.
    procedure:
      direction_A:
        what: >-
          Hold free word B fixed; sweep free word A over all 16 values of its
          k1 = 4 window; compute chunk1_observable(wA) for each; count distinct
          values.
        held_fixed_values: >-
          Repeat at FOUR pre-registered held-fixed values of free word B (window
          indices 0, 5, 10, 15) and require the criterion at every one. Recorded
          honesty: chunk1_observable structurally does not read free word B at
          all in this construction, so holding B fixed is automatic here; this is
          STATED rather than presented as a passed test, and the four repetitions
          exist so the procedure is identical in both directions and so the
          quantifier weakness named in audit 3 is 4-fold reduced rather than
          hidden.
        report: distinct_fwd_32bit and distinct_fwd_12bit, AS INTEGERS, for each held-fixed value
        criterion: distinct_fwd_32bit >= 2 AND distinct_fwd_12bit >= 2
      direction_B:
        what: >-
          Hold free word A fixed; sweep free word B over all 16 values of its
          k2 = 4 window; compute chunk2_observable(wB, Y) for each; count
          distinct values.
        held_fixed_values: >-
          Repeat at FOUR pre-registered held-fixed values of free word A (window
          indices 0, 5, 10, 15) and require the criterion at every one.
        report: distinct_bwd_32bit and distinct_bwd_12bit, AS INTEGERS, for each held-fixed value
        criterion: distinct_bwd_32bit >= 2 AND distinct_bwd_12bit >= 2
      direction_JOINT_fiber:
        what: >-
          For each of the 16 free-word-B values, compute the SET
          {wA : low_12(chunk1_observable(wA)) == low_12(chunk2_observable(wB,Y))}
          and count how many DISTINCT such sets occur across the 16 values of
          free word B.
        report: distinct_fiber_sets, AS AN INTEGER
        criterion: distinct_fiber_sets >= 2
        why: >-
          This is the operational signature of ANOM-1. Batch 4's fiber map was
          the constant map (every wB matched the same single wA), and it is also
          what a decoupled option-(c)-style construction would produce on this
          single-component observable. Per-side counts alone do not catch it.
      forbidden_substitution: >-
        A SIMULTANEOUS BOTH-WORD SWEEP DOES NOT DISCHARGE ANY PART OF THIS GATE
        and must not be reported in place of any part of it. A joint sweep passes
        cleanly on a construction degenerate in one word, because the other word
        supplies all the observed movement (KN-TECH-bb7e9f, part 4 of the cheap
        control). It may be reported as a SUPPLEMENT, clearly labeled.
    pass_predicate: >-
      PASS if and only if ALL of: G-0 returned FAIL on the batch-4 slice; AND
      direction_A's criterion holds at all four held-fixed values; AND
      direction_B's criterion holds at all four held-fixed values; AND
      distinct_fiber_sets >= 2. Any other outcome is FAIL.
    on_fail: >-
      STOP. NO DECLARED-SCALE RUN HAPPENS. The executor reports the measured
      distinct-value counts as integers, the batch records the failure as a
      genuine finding about the construction (a second, sharper measurement of
      the same obstruction), and the unspent budget is reported as unspent and
      never silently reallocated. This is an admissible and valuable batch
      outcome, not a batch failure (SC-7; batch objective; red-team D1).
    predicted_values_stated_before_any_run: >-
      distinct_fwd_32bit = 16 and distinct_bwd_32bit = 16 (both free words are
      depth 3 from v6, so no bit-selection collapse is expected); the 12-bit
      counts are predicted to be 16 as well, with 15 acceptable since two of 16
      values collide in a 4096-bin window with probability ~2.9%. On the batch-4
      slice under G-0: distinct_fwd = 16 and distinct_bwd = EXACTLY 1. These are
      PREDICTIONS recorded in advance so that a deviation is legible as a result
      rather than absorbed; they are not results and no run has occurred.

  # =====================================================================
  # 5. PREDICTIONS, TEST, FALSIFIERS
  # =====================================================================
  predictions:
    - metric: >-
        distinct_bwd_32bit -- number of distinct values of the declared matching
        observable as free word B sweeps its k2 = 4 window with A held fixed
      direction: higher
      minimum_effect: >-
        >= 2 (mandatory hard floor; anything less is a STOP). Predicted value 16.
        The same statistic on the batch-4 slice is predicted to be EXACTLY 1,
        which is the discriminating contrast: the two constructions must differ
        on this number or the detector is broken.
    - metric: >-
        distinct_fiber_sets -- number of distinct m-bit match sets induced across
        the free-word-B window
      direction: higher
      minimum_effect: >-
        >= 2 (mandatory). Predicted ~16. Predicted EXACTLY 1 on the batch-4 slice
        and EXACTLY 1 for any construction whose match condition factorizes.
    - metric: >-
        step-evaluations to recover the planted pair, MITM versus the naive
        all-pairs baseline over the SAME restricted two-word space
      direction: lower
      minimum_effect: >-
        at least 100x fewer (a conservative floor well below the modeled ~1490x,
        absorbing hash-table and interpreter overhead). MODELED, bounded scale
        only; no extrapolation to any larger k1/k2 and none to the ~2^64-block
        gap.
    - metric: >-
        chi-square goodness-of-fit of the matching-window collision counts across
        N independent targets against Poisson(lambda = 2^(k1+k2-m) = 256), lambda
        FIXED a priori
      direction: lower
      minimum_effect: >-
        p-value > 0.05 is the H1-consistent outcome; p <= 0.05 WITH a healthy
        sample variance is a genuine H1 falsification at this scale and is a
        reportable structural finding.
    - metric: >-
        sample variance of the matching-window collision counts across N targets
      direction: different
      minimum_effect: >-
        PRE-COMMITTED THREE-WAY SPLIT, declared before any run (SC-9): variance in
        [128, 512] (within 2x of lambda = 256) is the non-degenerate band;
        variance < 64 is classified as INSTRUMENT DEGENERACY (the ANOM-1
        signature -- batch 4 measured variance EXACTLY 0 across 1000 targets,
        ANOM-1 caveat) and is a STOP, NOT an H1 falsification; variance in the
        healthy band with chi-square p <= 0.05 is a genuine H1 falsification.
        These three outcomes mean three different things and the classification
        rule is frozen now, before any data exists.
    - metric: >-
        raw pre-certificate MITM candidate-set projection widths at k1 = k2 = 6
      direction: lower
      minimum_effect: >-
        strictly fewer than 64 distinct wA AND strictly fewer than 64 distinct wB
        in the raw set, with total raw candidates <= 4. Batch 4's analogous raw
        set covered its entire second-word window.
    - metric: >-
        MD5 arm (conditional): chi-square p-value and variance profile against
        the MD4 arm
      direction: different
      minimum_effect: >-
        A difference is credited only if one arm's p-value is > 0.05 and the
        other's <= 0.05 AND the difference survives a null-constant replication.
        R (the MD5/MD4 full-target-hit ratio) is DECLARED IN ADVANCE to carry
        essentially no information at these parameters and may not be reported as
        a finding in either direction.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS G-0 + G-1 AND NOTHING ELSE NEEDS TO RUN
      TO GET A RESULT. Implement the new sibling module (forward/backward Round-1
      steps for both primitives, the two observable extractors, the parameterized
      construction (a, b, S, p)); run G-0 on the batch-4 slice (must FAIL); run
      G-1 on R1-SEP10 at k1 = k2 = 4 (must PASS). 256 + 256 pair-equivalents of
      arithmetic, well under a second. ONLY ON PASS: the k1 = k2 = 6 controls
      (C-1 completeness against the independent naive Y-search, C-2 raw-set
      degeneracy, plus the exhaustive observation-collision enumeration), then
      the MD4 primary certificate run at k1 = k2 = 10, then HEUR-H1's FIRST
      GENUINE TEST over N independent targets, then -- only if the frozen
      contract names and identically bounds it -- the single MD5 arm.
    controls:
      - >-
        G-0, the detector null control on the batch-4 slice: the gate MUST FAIL
        on an object where failure is already a proved fact (EV-MDFIVE-ab007d).
        This is the "can this null fail" line of KN-TECH-9d21c4's checklist,
        answered by construction.
      - >-
        C-1, brute-force completeness at k1 = k2 = 6, against a naive baseline
        that reads ONLY the full 16-step forward output versus Y and never reads
        the matching observable -- explicitly NOT the vacuous batch-4 control.
      - >-
        C-2, raw-solution-set degeneracy check (projection widths and cardinality).
      - >-
        C-4/C-5, H2 inversion fixture and RFC 1320 A.5 vectors for the new module.
      - >-
        Nearby-object control 1: the batch-4 slice, verdict already known false.
      - >-
        Nearby-object control 2: MD5 Round 1 at identical bounded parameters,
        conditional on gate authorization, never larger than the MD4 arm.
    required_metrics:
      - distinct_fwd_32bit / distinct_fwd_12bit per held-fixed value (integers)
      - distinct_bwd_32bit / distinct_bwd_12bit per held-fixed value (integers)
      - distinct_fiber_sets (integer)
      - G-0's verdict on the batch-4 slice (must be FAIL) with its own counts
      - certificate-verified vs naive solution-set equality at k1 = k2 = 6 (boolean)
      - raw candidate count and both projection widths at k1 = k2 = 6 (integers)
      - full list of 20-bit-colliding non-Y-reproducing pairs at k1 = k2 = 6
      - step-evaluation and chunk-evaluation counts, and wrapper-measured wall clock
      - matching-window collision count per target; full-target hit count per target
      - chi-square statistic, p-value, sample variance, and the largest observed count with its Poisson tail p-value

  falsification_conditions:
    - >-
      G-1 fails in either direction (distinct_fwd or distinct_bwd equals 1) at
      any held-fixed value: the two-free-word construction is falsified AT THIS
      SEPARATION AND COMPONENT, the separation/F-depth reasoning of section 0 is
      shown to be an insufficient design criterion, and no declared-scale run
      happens. This is the single most informative possible negative outcome and
      it costs seconds.
    - >-
      distinct_fiber_sets = 1 while both per-side counts exceed 1: the match
      condition factorizes; the instrument is two decoupled univariate searches
      wearing a MITM costume; STOP.
    - >-
      G-0 PASSES on the batch-4 slice: the detector cannot see a proved
      degeneracy; the gate is void; the batch stops and reports a broken
      instrument rather than any mathematical result.
    - >-
      C-1 fails (certificate-verified MITM set != naive Y-reproducing set at
      k1 = k2 = 6): the construction or its implementation is wrong; in
      particular a MISS of the planted pair falsifies the claim that both free
      words' influence reaches component p.
    - >-
      C-2 fails (a raw projection covers its full window): a degenerate word
      channel survived the gate; STOP and report -- this would mean G-1's
      predicate is weaker than believed, which is itself a finding about the
      gate.
    - >-
      C-4 fails: exact invertibility broken in the new module; nothing downstream
      is trustworthy.
    - >-
      Matching-window collision variance < 64 across N targets: instrument
      degeneracy (ANOM-1 class), classified as a STOP and explicitly NOT as an H1
      falsification -- the classification is frozen here, before the data exists.
    - >-
      Chi-square p <= 0.05 with variance inside [128, 512]: HEUR-H1 is genuinely
      falsified at this bounded scale for this primitive. Reportable finding,
      not a defect.
    - >-
      Any MD5-versus-MD4 difference in the gate's verdict: implementation defect
      in the shift/constant/add_b substitution, STOP -- the schedule is shared, so
      the dependence structure cannot legitimately differ.

  confounders:
    - >-
      DEPTH-1 BIT SELECTION (the confounder this construction is designed around,
      named so it cannot be rediscovered as a surprise): F is bitwise and
      selecting, so a component one F-layer from a free word inherits it only
      through gated bits. If the gating register's low m bits are all 1 the
      window is frozen entirely; more commonly roughly half the bits are frozen,
      which would silently inflate collision counts and corrupt lambda. Mitigated
      by choosing depth 3 on both sides; MEASURED by the 32-bit-versus-12-bit
      distinct-count split in the gate and by HEUR-H1b's validation route.
    - >-
      All-zero or near-degenerate fixed words collapsing F. Mitigated by the
      pre-registered non-zero seeded fixed words (A-3).
    - >-
      32-bit masking errors and the MD4-versus-MD5 add_b distinction -- a
      documented real bug in this exact code family (harness/run_md4_ceiling.py's
      own docstring records a draft that failed all seven RFC 1320 vectors).
      Mitigated by C-4 and C-5.
    - >-
      Seed correlation between the target stream and the search enumeration
      inflating apparent success. Mitigated by independent declared seeds (A-4).
    - >-
      Component-index off-by-one in the rotating tuple convention: reading
      position 3 when the intent is v6 is only correct at S = 8 with this exact
      convention. Mitigated by requiring the module to assert the component's
      identity against the independent straight-line reference implementation
      (which tracks named registers, not tuple positions) before the gate runs.
    - >-
      A lucky fixed-word seed hiding a partial degeneracy. Partly mitigated by
      the four held-fixed values per direction; NOT fully mitigated, since the
      gate is not quantified over seeds (audit 3, claim 3). Stated, not solved.

  interpretation_limits:
    - >-
      Everything here is scoped to MD4 Round 1 (16 of 48 steps), two free words
      of sixteen, a 20-bit target, and the declared bounded k1/k2. Claim ceiling
      for this batch is `analyzed`, never `supported` (batch claim_ceiling;
      EV-MDFIVE-ab007d promotion_gate_assessment).
    - >-
      A PASSING gate proves only that the observable varies with each free word
      at k1 = k2 = 4 for the tested held-fixed values. It does not prove the
      construction is a good MITM, does not validate HEUR-H1, and does not make
      any statement about MD4's preimage resistance.
    - >-
      The instrument can only recover a PLANTED pair (64 bits of freedom against
      a 128-bit output). No run of it is a preimage of anything.
    - >-
      The literature figures 2^96 / 2^102 / 2^116.9 / 2^123.4 remain UNVERIFIED
      provenance in this corpus (bulk-seed relay and metadata-only respectively)
      and are cited only as distant reference points. Provenance is not upgraded
      by assertion.
    - >-
      Every BATCH-af29f6 raw metric appearing anywhere in this record carries the
      ANOM-1 caveat (SC-4). No figure in this record projects toward the
      ~2^64-block instrument-class gap, and none may be derived from it (SC-3).
    - >-
      Section 0's resolution of the mirror-image risk is SYMBOLIC and derived by
      one agent this session. It is offered for independent re-derivation by the
      review round (joint R2 / the blind re-derivation named in the batch's
      review architecture), not as a settled fact by assertion.

  heuristic_assumptions:
    - id: HEUR-H1
      status: >-
        OPEN -- neither validated nor falsified. Its batch-4 test was INVALIDATED
        by ANOM-1 (DEC-20260821-1215e5 F-3; EV-MDFIVE-ab007d O-3). This batch
        would be its FIRST GENUINE TEST. Restated below for the new construction;
        once frozen it may not be reinterpreted after outcomes are seen (SC-9).
      statement: >-
        For the declared fixed words and a fixed target, as free word A ranges
        uniformly over its k1-bit window and free word B independently over its
        k2-bit window, the m-bit values low_m(chunk1_observable(wA)) and
        low_m(chunk2_observable(wB, Y)) behave as independent uniform samples
        from {0,1}^m. Consequently the number of matching-window collisions among
        the 2^(k1+k2) candidate pairs is approximated by
        Poisson(lambda = 2^(k1+k2-m)), and the conditional probability that a
        matching-window hit also matches the remaining (k - m) target bits is
        approximated by 2^-(k-m).
      rigorous_support: >-
        RFC 1321 sec 3.4 states as a property of F that if the bits of X, Y and Z
        are independent and unbiased then each bit of F(X,Y,Z) is independent and
        unbiased -- a genuine single-step balance property. H1 extrapolates that
        one-step fact to an iterated composition (3 F-layers forward from word2 to
        v6, 3 backward from word12), imitating the classical move from "one mixing
        step is balanced" to "the iterate looks like a random function" that
        underlies every birthday argument. The extrapolation is NOT proved.
      falsification_condition: >-
        FROZEN, PRE-COMMITTED, AND CLASSIFICATION-SPLIT (this is the repair to the
        batch-4 statement, whose literal firing had to be dispositioned after the
        fact): over N >= 200 independently drawn targets at k1 = k2 = 10, m = 12,
        with lambda = 256 FIXED a priori and df = bins - 1, H1 is FALSIFIED at
        this scale iff the chi-square goodness-of-fit p-value <= 0.05 AND the
        sample variance lies in [128, 512]. If the sample variance is < 64 the
        outcome is classified as INSTRUMENT DEGENERACY and H1 is recorded as still
        OPEN -- not falsified -- because a near-deterministic observable cannot
        test a distributional claim. If the variance is > 512 with p <= 0.05 the
        outcome is an over-dispersed genuine falsification. The tail check is
        reported alongside: the Poisson survival probability of the single largest
        observed count.
      validation_plan: >-
        EXECUTABLE THIS BATCH, within the executor task's declared 300 s
        H1-validation ceiling. Draw N in [200, 2000] independent targets from a
        declared seed at k1 = k2 = 10, m = 12, k = 20; run the full MITM on each;
        record matching-window and full-target hit counts; compute the chi-square
        statistic against Poisson(256) with lambda fixed, the sample variance, and
        the largest-count tail p-value. Sampled parameters recorded explicitly:
        (md4, S = 8, free words 2 and 12, component 3, k1 = k2 = 10, m = 12,
        k = 20, N as achieved). TRANSFER ASSUMPTION STATED: none is made -- the
        result is claimed only at the sampled parameters.
    - id: HEUR-H1b
      status: NEW this record, declared before any run
      statement: >-
        An observable separated from a free word by at least TWO F-layers is
        functionally dependent on that word in every one of its 32 output bits,
        whereas an observable at exactly ONE F-layer inherits the word only
        through bits admitted by the gating register X, so its low-m window can be
        partly or entirely frozen by the fixed words alone. Formally: at depth 1
        the observable has the shape Const -/+ F(X, Y, Z) with exactly one of
        Y, Z carrying the word, so output bit t moves with the word only where the
        gating bit X_t selects that branch; at depth 2 BOTH the Y- and the
        Z-argument of the same F carry the word, so no single value of X can gate
        the dependence off.
      rigorous_support: >-
        A proved statement about which bits are syntactically reachable, derived
        from F(X,Y,Z) = (X AND Y) OR (NOT X AND Z) being bitwise, together with
        the E/D propagation rules of section 0. It imitates the classical
        "complete diffusion after r rounds" heuristic: syntactic reachability is
        proved, actual variation is assumed.
      falsification_condition: >-
        At k1 = k2 = 6, if the depth-3 component v6 shows fewer than 48 distinct
        32-bit values over a 64-value sweep on EITHER side, HEUR-H1b's "depth >= 2
        gives full-bit dependence" claim is falsified at these parameters and the
        component choice must be revisited before any statistical reading of the
        collision counts.
      validation_plan: >-
        EXECUTABLE THIS BATCH, cost negligible, and it is a genuine two-outcome
        contrast rather than a confirmation: sweep 64 values of each free word and
        report distinct 32-bit and 12-bit counts for the DEPTH-3 component (v6,
        position 3) AND, as the paired contrast, for the DEPTH-1 component (v8,
        position 1) on the backward side at the same separation. Predicted: v6
        near 64 distinct on both sides; v8 backward materially below 64 (a
        bit-selection collapse whose size depends on the gating register's fixed
        low bits). If BOTH are near 64 the depth refinement is not doing work at
        these parameters and should be recorded as such rather than retained as
        decoration; if v8 collapses, HEUR-H1b is supported at this scale and the
        component choice is vindicated by measurement rather than by argument.
    - id: HEUR-H2
      status: >-
        CARRIED FORWARD, CONFIRMED. A proved algebraic fact, not a distributional
        heuristic; already validated at >= 10,000 random tuples for both add_b
        conventions in RUN-MDFIVE-buildcheck (all_ok true), and independently
        re-derived by two reviewers at BATCH-af29f6.
      statement: >-
        The Round-1 step function is exactly invertible given all other inputs:
        old_a = rotr((new_a - old_b*), s) - F(old_b, old_c, old_d) - x - t
        (mod 2^32), where the "- old_b" term is present for MD5 and absent for
        MD4, and old_b, old_c, old_d are pass-throughs of the successor state.
      rigorous_support: >-
        Rotation by s is a bijection on Z/2^32 with inverse rotation by 32 - s;
        addition mod 2^32 is invertible by subtraction. No conjecture. It is
        numbered only because sign handling, rotation direction and masking break
        silently in practice.
      validation_plan: >-
        EXECUTABLE THIS BATCH: re-run the deterministic regression fixture against
        the NEW module (it is new code and inherits nothing), >= 10,000 uniformly
        random tuples per primitive, exact equality required, any single failure
        falsifies.
    - id: HEUR-H3
      status: >-
        CARRIED FORWARD, HONESTLY UNTESTED. Not validated in batch 4 and NOT
        validatable within this batch's budget.
      statement: >-
        H1's Poisson prediction, if it holds at k1 = k2 = 10, continues to hold
        with no new correlations emerging as k1 and k2 grow.
      rigorous_support: >-
        None beyond H1's own unproved extrapolation. H3 is a SECOND-ORDER
        extrapolation of an already-unproved heuristic and is strictly weaker
        than H1.
      validation_plan: >-
        NOT EXECUTED THIS BATCH and not proposed for it. The route, for a future
        batch, is to repeat H1's protocol at successive k1 = k2 checkpoints
        (10, 13, 16) and check the prediction holds as a MEASURED ratio rather
        than an extrapolated one. Recorded as an open direction, explicitly
        untested.

  # =====================================================================
  # 6. COMPLEXITY, COST, PARETO HONESTY
  # =====================================================================
  target_complexity:
    asymptotic_claim: null
    asymptotic_claim_note: >-
      NO ASYMPTOTIC CLAIM IS MADE. This is a bounded toy-scale instrument and it
      does not move the exponent of any hard problem. Per
      docs/target-result-profile.md it is NOT an exponent-moving proposal and is
      not offered as one; its priority rests on being the instrument-validity
      repair without which this goal's method-ceiling question cannot be
      measured at all.
    bounded_scale_this_batch:
      time_exponent: >-
        (2^k1 + 2^k2) chunk evaluations = 2^11 at k1 = k2 = 10; in
        step-evaluations, 2^10 x 6 (forward) + 2^10 x 5 (backward) + 5 fixed =
        11,269 ~= 2^13.46, plus ~2^8 window probes and ~2 certificate checks of
        16 steps. MODELED.
      memory_exponent: >-
        2^k1 = 2^10 table entries (12-bit keys, (word, 20-bit value) payload).
        Negligible against the 8 GB ceiling; no time-memory tradeoff is exercised
        at this scale.
      best_known_at_this_bounded_scale: >-
        2^(k1+k2) x 16 = 2^24 step-evaluations for the literal naive all-pairs
        search over the same restricted two-word space (this program's own
        baseline, reproduced as control C-1, not a literature figure). A
        prefix-caching naive variant costs 2^20 x 14 ~= 2^23.8, which is the
        fairer comparison and is the one to report alongside.
      modeled_ratio: >-
        ~2^10.5 (~1490x) in step-evaluations; 512x in the coarser chunk-evaluation
        unit. MODELED, NOT MEASURED, and true only at these parameters.
      hidden_overhead: >-
        The ratio is a function of (k1, k2, m, k) and of the per-candidate step
        counts (6 forward, 5 backward), which are themselves a function of the
        chosen separation and split. It does not extrapolate. Increasing the
        separation to get more F-depth INCREASES per-candidate cost, so depth and
        speed trade against each other -- a real cost of this design, stated.
      tradeoff_note: >-
        At this scale memory is free and the tradeoff is unexercised. Any real
        large-scale version of this instrument class would be table-bound and
        would need distinguished-point-style memory reduction; this record does
        NOT model that and does NOT compute any figure toward the ~2^64-block gap
        (SC-3, DEC-20260821-1215e5 F-8). Batch 4's measured throughput band
        (102899-289607 chunk-evals/sec, EV-MDFIVE-ab007d O-5, ANOM-1 CAVEAT) is
        used here for one purpose only -- confirming that an N = 1000-target H1
        run at ~2 x 10^6 chunk evaluations fits inside a 300 s ceiling with wide
        margin -- and for no projection of any kind.
    full_scale_literature_reference_points_UNVERIFIED:
      md4_compression_function: "2^96 (KN-LIT-4878, unverified bulk-seed relay)"
      md4_full: "2^102 (KN-LIT-4878, unverified bulk-seed relay)"
      md5_pseudo_preimage: "2^116.9 (KN-LIT-582d77, metadata-only provenance)"
      md5_preimage: "2^123.4 (KN-LIT-582d77, metadata-only provenance)"
      status: >-
        Reference points only, establishing the distance this program is not
        attempting to cross. Never verified, never upgraded by assertion, never a
        target of any run.

  estimated_cost:
    implementation: medium
    implementation_note: >-
      Higher than batch 4's because the construction must be PARAMETERIZED in
      (free_word_A, free_word_B, S, component_index) so that G-0 can run the
      batch-4 slice through the identical code path, and because the naive
      baseline must be a genuinely independent straight-line Y-comparison rather
      than a second reader of the same observable. Both are the point, not
      overhead.
    compute: low
    compute_note: >-
      G-0 + G-1 are ~512 pair-equivalents, sub-second. The k1=k2=6 controls are
      4096 pairs plus 4096 straight-line 16-step recomputations. The declared-scale
      primary run is ~2^11 chunk evaluations. The H1 run at N = 1000 is ~2 x 10^6
      chunk evaluations. All MODELED, all far inside the declared ceilings.

  md5_specific_step_decision:
    decision: NAMED
    statement: >-
      YES. The MD5-specific step is: run the IDENTICAL R1-SEP10 construction
      (free words 2 and 12, S = 8, component 3, k1 = k2 = 10, m = 12, k = 20,
      same fixed-word seed convention, same N) against MD5's own Round 1 --
      substituting only MD5's shifts (7,12,17,22), its per-step additive
      constants T[1..16], and add_b = true -- at IDENTICAL bounded scale, never
      larger, as a single nearby-object control run.
    justification: >-
      (1) It costs one constant-table swap in a code path already built for MD4.
      (2) The two substituted elements are exactly the two changes RFC 1321
      section 5 names as MD5's hardening over MD4, so the comparison is
      structurally motivated rather than arbitrary. (3) CRUCIALLY, the comparison
      quantity is CHANGED from batch 4's: R (the full-target-hit ratio) is
      declared in advance to be near-mechanically forced and uninformative
      (EV-MDFIVE-ab007d O-4), and the informative quantity is instead the
      distributional shape -- chi-square p-value and variance of the
      matching-window collision counts -- where the differing shift and constant
      tables genuinely can produce a difference (batch 4 already measured a 16x
      raw matching_window_hits difference between arms; ANOM-1 caveat applies).
      This is a nearby-object control that can actually come out two ways.
    predeclared_expectation: >-
      The gate must PASS identically for both primitives (shared schedule); a
      divergence there is an implementation defect and a STOP, not a finding.
      Both arms are expected to be H1-consistent; a divergence in chi-square
      verdict would be reportable only after a null-constant replication.
    gate_note: >-
      This record NAMES the step and its exact bounded parameters. Whether to
      authorize and spend it is TASK-20260821-fad775's authority alone, and SC-1
      binds: no MD5 computation at all unless the frozen contract explicitly names
      and identically bounds it.

