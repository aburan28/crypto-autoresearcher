idea:
  id: IDEA-20260806-3b91c7
  question_id: RQ-ECDLP-002
  added: '2026-08-06'
  title: >-
    The baseline this program compares against is off its own recorded frontier:
    rho at O(1) memory is the S = O(1) corner of a generic tradeoff whose
    achievable form is online time N^{(1-sigma)/2} at memory N^{sigma} on a
    FIXED curve, so every threshold in the ECDLP and ICEX lanes is too generous
    by N^{sigma/2}, and at the two-term optimum B = N^{1/(m+1)} the bar an
    attack must clear moves from N^{1/2} to N^{1/2 - 1/(2(m+1))}
  class: cost-model

  claim: >-
    THIS IS AN EXPONENT CORRECTION TO A COMPARATOR, NOT AN ATTACK. It makes every
    positive claim in this program HARDER, and that is why it is filed first.

    (A) THE MISMATCH, STATED EXACTLY. Every cost comparison in this corpus scores a
    candidate against Pollard rho at 0.886 sqrt(N) group operations with O(1)
    memory, while CHARGING the candidate its own memory. Prime-field index
    calculus is a large-memory algorithm: it stores a factor base of size B and a
    relation matrix with Theta(mB) nonzeros. Comparing a memory-N^{beta} algorithm
    against a memory-O(1) baseline on the time axis alone is not a Pareto
    comparison; it is a comparison against a point the baseline family does not
    have to occupy.

    (B) THE CORRECT BASELINE, DERIVED HERE IN HALF A PAGE. Fix E/F_p, a generator P
    of a prime-order subgroup of order N, and a public pseudorandom step function
    f: G -> {1..r} defining an r-adding walk with known scalar offsets. OFFLINE
    (target-independent, curve-specific, run once): pick a chain length L; run S
    deterministic walks of length L, each starting from a random KNOWN multiple of
    P; store only the S endpoints together with their known logs. ONLINE (per
    target Q): walk from Q + [r_0]P using the SAME f until L steps have elapsed;
    if the walk entered the region covered by the stored chains it merges into one
    and terminates at a stored endpoint, from which log Q follows by subtraction.
    Coverage is S*L points; a length-L online walk meets it with probability
    ~ S*L^2/N; distinct chains stop colliding with each other exactly at the
    matrix-stopping rule S*L^2 = N. At that boundary a SINGLE online walk succeeds
    with constant probability, so
        memory      S      = N/L^2
        online time T      = Theta(L)      = Theta(sqrt(N/S))
        offline time       = S*L           = Theta(sqrt(N*S)) = Theta(N/L)
    and therefore S*T^2 = Theta(N) EXACTLY.

    (C) THE CALIBRATION THAT MAKES (B) CHECKABLE FOR FREE. KN-TECH-005 records the
    committed generic LOWER bound S*T^2 = Omega~(n) (Corrigan-Gibbs-Kogan,
    KN-LIT-013), and records NO upper bound. The derivation in (B) lands on that
    lower bound and therefore CANNOT be improved without contradicting a committed
    theorem. If my arithmetic had produced S*T^2 = o(N) the derivation would be
    wrong, detectably, at zero cost. If it produced S*T^2 >> N the construction
    would be off-frontier and the claim would collapse. This is a two-sided,
    free, known-answer calibration edge, and it is the reason this proposal is
    ranked first.

    (D) WHAT IT DOES TO THE CORPUS'S THRESHOLDS, QUANTITATIVELY.
      - At sigma = 0 the formula returns T = N^{1/2}: it REPRODUCES rho. The
        correction is exactly zero where the corpus's convention is exactly right.
      - BSGS sits at (time, memory) = (N^{1/2}, N^{1/2}). At S = N^{1/2} the
        frontier gives T = N^{1/4}. BSGS is therefore dominated by a factor
        N^{1/4} on time at its own memory, and any table listing BSGS as a
        frontier row (catalogue A1-13's specified row list does) is missing the
        row that dominates it.
      - Two-term index calculus at its recorded optimum B* = N^{1/(m+1)} holds
        memory >= B*. The memory-matched generic baseline there is
        sqrt(N/B*) = N^{1/2 - 1/(2(m+1))}: at m = 3, N^{0.375}; m = 4, N^{0.4};
        m = 5, N^{5/12} = N^{0.4167}. The recorded bar is N^{0.5} in every case.
        At N = 2^256 and m = 4 that is a 25.6-bit over-statement of the room
        available to the attack.
      - Algebra-free meet-in-the-middle (catalogue A1-2) is stated at
        (N^{1/2+1/m}, N^{1/2}). At memory N^{1/2} it must beat N^{1/4}; it is
        therefore dominated by N^{1/4+1/m}, not by N^{1/m}.
      - FORCED CAP. Any index calculus must spend >= B time merely to touch its
        base, and holds >= B memory. Non-domination at matched memory requires
        B <= sqrt(N/B), i.e. B <= N^{1/3}. Factor bases above N^{1/3} are
        dominated by a generic algorithm with the same memory, before any
        decomposition oracle is costed.

    (E) THE HONEST DEBIT, STATED IN THE SAME BREATH. The offline stage costs
    Theta(sqrt(N*S)) = N^{(1+sigma)/2} >= N^{1/2}. Charged once, per instance,
    the total is NOT below N^{1/2} and NO exponent of the ECDLP is moved by
    anything in this record. The correction is legitimate only where the offline
    cost is genuinely amortized: ONE fixed standardized curve reused across many
    targets (P-256, secp256k1). This proposal therefore delivers an AMORTIZATION
    POLICY as much as a number, and the policy is the deliverable that the ICEX,
    SDEG, DREG and SIG lanes are missing.

  object_first_candidate:
    tracked_object: >-
      THE COST POINT ITSELF, projected to the exponent TRIPLE
      (sigma, tau_on, tau_off) = (log_N memory, log_N online time,
      log_N offline time) of an algorithm on a fixed curve. Every prior cost
      record in this corpus tracks a SCALAR - a time, a ratio, or a single
      exponent alpha - and the projection to a scalar is exactly where the
      offline/online split and the memory axis are destroyed.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record: Semaev and
      summation polynomials; Groebner solving-degree instrumentation;
      factor-base geometry; Weil descent and covers; isogeny and CM leverage;
      pairing transfer; lattice and Coppersmith methods; endomorphism orbits.
      NO cryptanalytic mechanism is proposed. The only family used is
      generic-algorithm cost accounting with an offline stage, and it is the
      object under audit rather than an attack.
    newness_score: >-
      The chain/table construction in (B) is elementary and is derived here
      rather than cited; I make no claim that it is new mathematics and the
      novelty_status is unverified. What the AUDIT (section 4 of
      duplication_audit.md) did not find in this corpus is any ACHIEVABILITY row
      for the preprocessing frontier: KN-TECH-005 records the lower bound and no
      upper bound; catalogue A1-4 and A1-13 both cite S*T^2 = Omega~(N) as a
      CONSTRAINT ON INDEX CALCULUS and A1-13's specified row list contains no
      achievable preprocessing algorithm; IDEA-20260805-c06631's rho rows assert
      group-operation exponent 1/2 at EVERY storage parameter theta. The
      direction of use - lower bound constrains the CANDIDATE, upper bound raises
      the BASELINE - is opposite, and only one direction is in the corpus.
    testability_score: >-
      Maximal for the derivation (exact arithmetic, no solver, no numpy) and high
      for the measurement: build the chain table on a toy curve at
      N in {2^18, 2^22, 2^26} in pure Python and measure online steps against
      sqrt(N/S) over a sweep of S. Both arms are cheap and both can fail.
    survival_score: >-
      The exponent statement survives to crypto scale because it is asymptotic
      arithmetic. The MEASURED confirmation survives only to the toy ladder and
      is labelled toy. The construction dissolves where the walk stops behaving
      like a random function - short cycles, a degenerate step function, or
      chain merging above the stopping rule - and locating that dissolution is
      exactly what the sweep measures.

  mechanism: >-
    DERIVED IN THIS RECORD. The only external input is the committed lower bound
    at KN-TECH-005, used solely as a calibration ceiling.

    WHY THE CHAIN STRUCTURE BEATS AN ISOLATED TABLE, AND WHY THAT IS THE WHOLE
    POINT. Store S isolated known-log points instead of S chain endpoints. An
    online walk of length T meets the stored SET with probability ~ T*S/N, giving
    T = N/S and S*T = N. That is strictly worse than S*T^2 = N for every S > 1,
    and it is the accounting a reader would reach for by default. The chain trick
    converts stored points into stored COVERAGE: because the online walk uses the
    same deterministic f, hitting any point of a stored chain is as good as
    hitting its endpoint. Coverage S*L against memory S is the leverage, and its
    ceiling is chain-chain merging at S*L^2 = N. Every quantity in (B) is forced
    by that single constraint.

    WHY THIS IS NOT VAN OORSCHOT-WIENER, WHICH THE CORPUS ALREADY HOLDS. vOW
    distributes ONE search across processors and stores distinguished points from
    THAT search; total group operations are invariant and only wall time falls -
    IDEA-20260805-c06631 states exactly this ("group_operations: 1/2 (total work
    is invariant; wall time falls)") and it is correct for vOW. The construction
    here is different in kind: the stored table is built from KNOWN logs BEFORE
    ANY TARGET EXISTS, is target-independent, and is reused. The online work for a
    single target genuinely falls to sqrt(N/S) TOTAL GROUP OPERATIONS, not merely
    in wall time. The two records therefore make numerically different predictions
    for the same measurable quantity, which is the discrimination.

    WHY IT IS NOT MULTI-TARGET AMORTIZATION, WHICH THE CORPUS ALSO HOLDS.
    IDEA-20260731-013 measures the exponent gamma of TOTAL work in the number of
    targets T for a shared distinguished-point table over T SIMULTANEOUSLY UNKNOWN
    targets. Here T = 1 and the amortized quantity is a KNOWN-LOG table. The two
    compose - S chains reused across T targets gives total
    Theta(sqrt(N*S)) + T*Theta(sqrt(N/S)) - and that composition is a stated
    deliverable below, but they are different exponents in different variables.

    THE CONSEQUENCE FOR THE FROZEN ICEX CONTRACT, STATED PLAINLY AND WITHOUT
    OVERREACH. EXP-ICEX-146ff5 is being frozen from IDEA-20260803-fa9839 in this
    same batch. Nothing in this record says that contract is wrong; fa9839
    compares against rho and computes a threshold, which is a coherent thing to
    do. What this record says is that the threshold is a threshold AGAINST THE
    S = O(1) CORNER, and that a second column - the threshold against the
    memory-matched baseline sqrt(N/B) at the arm's own B - is derivable from the
    same formula at zero additional cost and is strictly more informative. If
    the contract emits only the first column, a later reader will compare a
    memory-B algorithm against a memory-O(1) baseline and will over-read the
    result by N^{1/(2(m+1))}.

  novelty_status: unverified

  literature_context:
    - >-
      knowledge/techniques/KN-TECH-005.md READ IN FULL. It states
      "With preprocessing/advice (fixed curve), the tight generic tradeoff is
      S*T^2 = Omega~(n) (Corrigan-Gibbs-Kogan, KN-LIT-013), and it survives
      against non-uniform adversaries (Coretti-Dodis-Guo)." The word "tight"
      appears; no achieving algorithm is stated anywhere in the entry, and the
      entry's "Program usage" section reduces the whole technique to the
      convention "B = rho 1/2". KN-LIT-013 itself was NOT opened this session.
    - >-
      ideas/catalogue-20260805/A1-index-calculus.md READ IN FULL. A1-4 composes
      S*T^2 = Omega~(N) with index calculus to derive D >~ N^{1/3} and states in
      its own Ceiling that "S*T^2 = Omega~(N) is a generic-group preprocessing
      bound, and index calculus is precisely a non-generic algorithm, so the
      composition does not bind it" - the LOWER-bound direction, explicitly
      flagged as non-binding. A1-13's row list names "the preprocessing frontier
      S*T^2 = Omega~(N)" as a row but names no algorithm achieving it.
    - >-
      ledger/proposals/IDEA-20260805-c06631.yaml read to line 120. Its ROW 1 and
      ROW 2 give rho group_operations exponent 1/2 with peak_memory 0 and theta
      respectively. There is no offline/online split and no row in which memory
      buys a lower total-work exponent.
    - >-
      PRIMARY SOURCES ARE UNREACHABLE from this environment. Nothing here is
      claimed novel and nothing is dismissed as known. It is entirely possible
      that the construction in (B) is textbook; if a reviewer can transcribe a
      primary source stating it, this record's honest status becomes `known` and
      its VALUE IS UNCHANGED, because the finding is that the corpus's baseline
      convention does not use it.

  lossy_projection_identifiability_audit:
    projection: >-
      Full algorithm description -> (sigma, tau_on, tau_off) in R^3, the
      exponent triple of (memory, online time, offline time) in log_N units.
    what_is_discarded: >-
      Everything: the algorithm, its constants, its data structures, its success
      probability, its parallel structure. Only three real numbers are retained.
    why_genuinely_lossy: >-
      Maximally lossy. Infinitely many algorithms share a triple, and the fibre
      over (1/2, 1/4, 3/4) already contains at least two structurally unrelated
      constructions (the chain table above and any hypothetical index calculus at
      B = N^{1/2} with a N^{1/4} oracle). This is NOT the (Delta, Pi) failure of
      KN-LIT-7595, where the discarded pair was recoverable as roots of a
      quadratic; here nothing is recoverable.
    why_compatible_with_the_operations: >-
      The operation the triple must survive is COMPOSITION of algorithm stages,
      and it does so deterministically: sequential composition takes the
      coordinatewise max of time exponents and the max of memory exponents;
      running a stage k = N^{kappa} times adds kappa to its time exponent;
      offline stages accumulate into tau_off and never into tau_on. That is a
      complete, deterministic propagation rule on the retained triple alone, and
      it is the rule the whole proposal executes.
    is_it_only_a_change_of_coordinates: >-
      NO, and the audit records the honest weakness alongside. It is not a change
      of coordinates (the fibres are enormous). It is not constant across
      instances (rho, BSGS, MITM index calculus and the chain table occupy four
      distinct points). ITS WEAKNESS IS THAT IT IS BLIND TO CONSTANTS AND TO
      o(1) TERMS BY CONSTRUCTION, which is why the concrete-cost table at
      N = 2^256 is a required artifact and not an optional one: an exponent
      correction of 1/(2(m+1)) is 25.6 bits at m = 4 and 256 bits, and that
      number must be stated in bits, not only as an exponent.

  assumptions:
    - >-
      The r-adding walk defined by a public step function behaves, for the
      purpose of chain coverage and merging, like a random function on G. This
      is the standard rho heuristic and it is KNOWN to be imperfect for small r;
      the sweep in the minimal test measures the departure rather than assuming
      it away.
    - >-
      Memory is counted in group elements (or in words of log N bits) and the
      unit is declared before any row is filled. If memory is counted in bits the
      exponents are unchanged and the constants move; if it is counted in
      "table entries of unstated width" no comparison is licensed at all.
    - >-
      The offline stage is chargeable to a curve rather than to an instance. This
      is a POLICY, not a fact, and the proposal delivers the policy explicitly in
      three variants (per-instance, per-curve, per-parameter-set) rather than
      assuming one.

  predictions:
    - metric: >-
        Derived online-time exponent tau_on(sigma) for the chain construction,
        checked symbolically
      direction: different
      minimum_effect: >-
        EXACTLY tau_on = (1 - sigma)/2 for 0 <= sigma <= 1/3, with
        tau_off = (1 + sigma)/2, hence sigma + 2*tau_on = 1 identically. FORCED
        AND FALSIFIABLE: if the derivation yields sigma + 2*tau_on < 1 it
        CONTRADICTS the committed lower bound at KN-TECH-005 and the derivation
        is wrong; if it yields > 1 the construction is off-frontier and the
        headline claim fails. Both branches are reachable on paper.
    - metric: >-
        Measured online walk length to recovery, toy curves, N in
        {2^18, 2^22, 2^26}, S swept over {N^{0}, N^{1/6}, N^{1/4}, N^{1/3}},
        >= 200 targets per cell
      direction: lower
      minimum_effect: >-
        Median online steps must fall as S rises, and the fitted exponent of
        median-steps in N at fixed sigma must land within 0.05 of (1-sigma)/2.
        DECISIVE ALTERNATIVE: if median steps are FLAT in S, the chain coverage
        is not being realised (most likely because chains are merging above the
        stopping rule) and the construction does not achieve the frontier at any
        reachable size - which would refute (B) as an ACHIEVABILITY claim while
        leaving the mismatch in (A) standing as an open question.
    - metric: >-
        Recomputed threshold column for point-decomposition index calculus:
        required oracle-cost exponent to beat sqrt(N/B) at the arm's own B,
        versus to beat sqrt(N), at m = 3..10
      direction: different
      minimum_effect: >-
        The two columns must differ by exactly 1/(2(m+1)) in the time exponent.
        Reported also in bits at N = 2^256: 32.0 (m=3), 25.6 (m=4), 21.3 (m=5),
        18.3 (m=6), 16.0 (m=7). If the two columns agree at any m, the
        composition is wrong and the audit finding is void.
    - metric: >-
        Multi-target composition exponent: total cost for T targets on one fixed
        curve, Theta(N^{(1+sigma)/2}) + T*Theta(N^{(1-sigma)/2}), against the
        corpus's committed multi-target baseline sqrt(T*N)
      direction: different
      minimum_effect: >-
        FORCED CROSSOVER, stated before any run: the table-plus-online scheme
        beats sqrt(T*N) exactly when T > N^{sigma}, and the optimal sigma given
        T is sigma = log_N(T) capped at 1/3. At T = N^{1/3} both read N^{2/3}.
        This must reproduce IDEA-20260731-013's construction-A exponent
        (gamma = 1) at S = O(1), and must not claim to supersede that record's
        measurement of construction B.
    - metric: >-
        Domination verdict for BSGS under the corrected frontier
      direction: different
      minimum_effect: >-
        BSGS at (N^{1/2}, N^{1/2}) must be reported DOMINATED on time by
        N^{1/4} at equal memory. This is a point prediction about a textbook
        algorithm and it is the cheapest single check in the record: if the
        instrument reports BSGS as non-dominated, the instrument is wrong.

  minimal_test:
    design: >-
      Three stages, cheapest first; stage 0 alone can terminate the line.
      STAGE 0 (pen and paper, ZERO compute, ~1 hour). Derive (B). Check
      sigma + 2*tau_on = 1 against KN-TECH-005's committed lower bound. Emit the
      two-column threshold table for m = 3..10 in exponents AND in bits at
      N = 2^256. Emit the Pareto table with the missing achievable-preprocessing
      row inserted, and re-verdict BSGS, MITM index calculus and the two-term
      optimum. If stage 0's calibration fails, nothing else runs and the failure
      is the deliverable.
      STAGE 1 (pure Python, minutes, no numpy and no SageMath). Implement the
      chain table on generated prime-order toy curves at N ~ 2^18, 2^22, 2^26.
      Sweep S; measure median and mean online steps to recovery over >= 200
      targets per cell; report the fitted exponent with its interval and REFUSE
      the fit where three points cannot support it.
      STAGE 2 (pure Python, minutes). Compose with T targets and measure the
      crossover against T*0.886 sqrt(N) and against sqrt(T*N), reporting both
      amortization policies (offline charged once per curve; offline charged per
      instance) side by side and never as one number.
    controls:
      - >-
        KNOWN-ANSWER EDGE WITH NO HIDDEN COST (the calibration this instrument
        must pass first, and the reason it is ranked first). At S = 1 the
        construction degenerates to a single chain and the formula must return
        T = Theta(sqrt(N)) and offline Theta(sqrt(N)) - i.e. it must REPRODUCE
        POLLARD RHO, with correction exactly zero. An instrument built to find
        hidden memory costs will find them everywhere unless it returns ZERO
        correction here. CAN FAIL: a sign error or an off-by-one in the stopping
        rule shows up immediately as a nonzero correction at sigma = 0.
      - >-
        NULL OBJECT OF THE SAME SHAPE (CAN FAIL). Replace the elliptic curve by
        Z/N with a random relabelling into the same coordinate range, keep the
        identical walk, the identical chain builder and the identical online
        procedure. FORCED VALUE: the measured tau_on(sigma) curve must be
        IDENTICAL within noise, because the construction uses NOTHING elliptic -
        it is a generic-group algorithm. If the curve arm outperforms the null,
        the implementation is exploiting curve structure it does not declare and
        the measurement is void. This null is unusual in that its expected
        outcome is AGREEMENT; disagreement is the defect.
      - >-
        PLANTED POSITIVE (CAN FAIL). Plant a target whose log is a known
        multiple of a stored chain's start. Recovery must be exact, and the
        certificate [k]P = Q must be re-verified independently of the solver. An
        instrument that cannot recover a planted log has no power and no negative
        may be read from any other arm.
      - >-
        LOWER-BOUND TRIPWIRE (CAN FAIL, AND IS THE ONE THAT MATTERS). Compute
        sigma + 2*tau_on from the MEASURED numbers at every cell. Any cell
        returning < 1 by more than measurement error is either a measurement
        error or a contradiction of a committed generic lower bound; the run is
        halted and routed to review rather than reported. This control cannot be
        passed by construction - the measured quantity is free to come out below
        1 - and that is what makes it a control.
      - >-
        DEGENERATE-PARAMETER CHECK THAT MUST FAIL. Set L above the stopping rule
        (S*L^2 >> N). Chains must merge, coverage must SATURATE below S*L, and
        the measured online time must stop improving. If online time keeps
        falling past the stopping rule, the coverage model is wrong.
      - >-
        ARCHIVE CHECK (zero compute). Re-read IDEA-20260805-c06631's rho rows and
        IDEA-20260731-013's gamma definition and record, in the run artifact,
        the exact sentence in each that this record contradicts or does not
        contradict. Under AGENTS.md retrieval policy item 7 the disagreement is
        REPORTED, and no status change to either record is proposed.
    required_metrics:
      - derived (sigma, tau_on, tau_off) triple with sigma + 2*tau_on reported
      - median and mean online steps per (N, S) cell with sample size and interval
      - the same for the Z/N null arm, side by side
      - offline steps actually executed per cell, charged and reported separately
      - the two-column threshold table in exponents and in bits at N = 2^256
      - the Pareto table with an explicit DOMINATED / NOT-DOMINATED verdict per row
      - the amortization policy under which every reported number is valid

  falsification_conditions:
    - >-
      Stage 0's derivation yields sigma + 2*tau_on != 1. Either it contradicts
      KN-TECH-005's committed lower bound (derivation wrong) or it lands above
      the frontier (construction not achieving). Either kills the headline and
      the record is withdrawn rather than re-scoped.
    - >-
      Measured median online steps are flat in S across the whole sweep at all
      three sizes, with the planted positive passing. The chain construction does
      not realise coverage at reachable sizes; the ACHIEVABILITY claim fails and
      only the mismatch in (A) survives, as an open question rather than a
      correction.
    - >-
      The Z/N null arm differs materially from the curve arm. The implementation
      is not generic and the whole framing is void.
    - >-
      The recomputed two-column threshold table shows the columns agreeing at
      some m. The composition step is wrong and the quantified correction
      1/(2(m+1)) is not the right number.
    - >-
      A reviewer transcribes a primary source showing the corpus's rho baseline
      convention already INTENDS the amortized-preprocessing setting. Then there
      is no mismatch to correct, only a convention to document, and the record
      is downgraded to a documentation note.

  confounders:
    - >-
      THE OFFLINE COST IS REAL AND IS THE WHOLE DEBIT. sqrt(N*S) >= sqrt(N)
      always. Any presentation of the online exponent without the offline
      exponent beside it is exactly the inflation this batch's handoff names as
      the failure mode to avoid. Every table in this record carries three
      columns or it carries none.
    - >-
      Toy sizes make chain merging behave differently from crypto sizes: at
      N = 2^18 the stopping rule bites at L ~ 2^9 and constants dominate. The
      measured arm is toy-tier and the exponent statement rests on the
      derivation, not on the fit. Three sizes cannot support an exponent fit and
      the record must report it as unfitted if the interval is wide.
    - >-
      Memory unit ambiguity. If a competing record counts memory in bits and
      this one in group elements, the exponents agree but the crossover
      constants do not. The unit is declared in stage 0 and every comparison
      re-states it.
    - >-
      AUTHORSHIP ASYMMETRY, and it points the RIGHT way for once: this record
      makes every claim in this program harder to make, including claims a
      later record of mine might want. That is a reason to trust it less as
      rhetoric and more as arithmetic, and it is why stage 0's calibration at
      sigma = 0 is mandatory before any other cell is read.

  interpretation_limits:
    - >-
      NO ATTACK. NO EXPONENT OF THE ECDLP IS MOVED. Total cost (offline plus
      online) remains Theta(N^{1/2}) at every sigma. Nothing here bears on the
      security of any deployed curve, and nothing here says prime-field ECDLP is
      weakened. The only thing that moves is the number a CANDIDATE must beat.
    - >-
      TOY TIER for every measurement (N <= 2^26). The exponent statement is a
      derivation and is scale-independent; the confirmation is not.
    - >-
      It does not supersede IDEA-20260805-c06631, IDEA-20260731-013,
      IDEA-20260803-fa9839 or catalogue A1-4/A1-13. No status change to any
      record is proposed. The disagreement with c06631's rho rows is REPORTED,
      and c06631 is correct about vOW.
    - >-
      The amortization policy is a POLICY. This record supplies three variants
      and the arithmetic for each; choosing among them is a Coordinator
      decision, not a mathematical result.
    - >-
      Forward guidance, mandatory. What remains open regardless of outcome:
      (a) whether index calculus's own memory can be traded DOWN the same way -
      the relation matrix is not obviously chainable and nobody has tried;
      (b) whether the preprocessing lower bound binds index calculus at all,
      which A1-4 correctly flags as open because index calculus is non-generic
      and which this record does not touch; (c) the composition of a
      preprocessed baseline with the multi-target regime beyond the single
      crossover derived here.

  standing_screen_verdicts:
    kn_find_007_mean_yield:
      verdict: NOT APPLICABLE - PASSES
      reasoning: >-
        This record proposes no factor base, makes no claim about mean
        decomposition yield, and does not depend on factor-base geometry. The
        conservation identity C(B+m-1,m)/N enters only where I quote the
        corpus's own two-term optimum B* = N^{1/(m+1)}, and I quote it without
        modification. Nothing here promises higher mean yield at matched size.
    kn_find_c41ea9_generic_fibre:
