  heuristic_assumptions:
    - id: H1
      statement: >-
        MATRIX STOPPING RULE. For the r-adding walk on a prime-order subgroup of
        E(F_p) with a public step function, S deterministic chains of length L
        started at independent uniform points cover (1 - o(1))*S*L distinct group
        elements provided S*L^2 <= N, and coverage saturates for S*L^2 >> N.
      rigorous_support: >-
        The imitated classical statement is the birthday/occupancy bound for a
        uniformly random function on N points: two independent length-L
        trajectories of a random function collide with probability
        Theta(L^2/N), so S chains are pairwise disjoint with constant
        probability exactly when S^2*L^2/N = O(S), i.e. S*L^2 = O(N). The
        RIGOROUS half is the exact occupancy computation for a uniformly random
        function; the HEURISTIC half is that an r-adding walk on a group behaves
        like one. The latter is known to be imperfect for small r and is stated
        here as an assumption, not a fact.
      validation_plan: >-
        Sample directly at toy scale: at N in {2^18, 2^22, 2^26} and r in
        {8, 16, 32, 64, 256}, build S chains of length L and count DISTINCT
        covered elements exactly by exhaustive marking (feasible to 2^26 in pure
        Python with a bitset). Compare the empirical coverage ratio
        (distinct covered)/(S*L) against the predicted 1 - o(1) below the
        stopping rule and against the predicted saturation above it. TAIL CHECK:
        the largest observed chain-merge cluster size against the predicted
        Poisson tail. This is TOY-SCALE VALIDATION and is labelled as such; it
        is NOT crypto-scale validation, and the shortcut that would make
        crypto-scale sampling possible (an analogue of the Deuring
        correspondence) DOES NOT EXIST for this quantity, which is stated here
        rather than glossed.
    - id: H2
      statement: >-
        The online walk from a random target enters the covered region with
        probability (1 - o(1))*S*L^2/N for S*L^2 <= N, independently of the
        target.
      rigorous_support: >-
        Imitates the same random-function occupancy statement applied to one
        trajectory against a fixed set. Rigorous for a uniformly random
        function; heuristic for the r-adding walk. It is the SAME assumption as
        H1 applied in the other order, and its failure mode is different
        (target-dependent hit rates rather than chain merging), which is why it
        is numbered separately.
      validation_plan: >-
        Measure the empirical hit rate over >= 200 independent targets per cell
        and test uniformity across targets by a chi-square on the hit indicator
        binned by target x-coordinate residue class. TAIL CHECK: the observed
        maximum number of online walks required before a hit, against the
        geometric tail. Toy scale only, labelled as such.
    - id: H3
      statement: >-
        The offline stage is chargeable per curve rather than per instance in
        the deployed setting.
      rigorous_support: >-
        NONE. This is a modelling policy, not a mathematical statement, and it
        is the assumption that decides whether the correction applies at all.
        It is stated formally so that a reader can reject it explicitly rather
        than inherit it.
      validation_plan: >-
        Not empirically validatable. Discharged instead by reporting all three
        policies (per-instance, per-curve, per-parameter-set) as separate columns
        in every table, so that no reader is ever handed a single number whose
        validity depends on a policy they did not choose.

  target_complexity:
    time_exponent: >-
      THE BASELINE MOVES; THE ATTACK DOES NOT. For a fixed curve with memory
      N^{sigma} and an amortized offline stage, ONLINE time N^{(1-sigma)/2},
      OFFLINE time N^{(1+sigma)/2}. At sigma = 1/3 both are N^{1/3}, matching
      the frontier point. TOTAL time (offline + online) is N^{(1+sigma)/2} >=
      N^{1/2} at every sigma, so NO ECDLP exponent is improved by this record
      and none is claimed. The derived corrections to the corpus's thresholds:
      the bar for a memory-N^{beta} candidate moves from N^{1/2} to
      N^{1/2 - beta/2}; at the two-term index-calculus optimum
      beta = 1/(m+1) this is N^{1/2 - 1/(2(m+1))}, a 25.6-bit tightening at
      m = 4, N = 2^256.
    memory_exponent: >-
      sigma, freely chosen in [0, 1/3]. Above sigma = 1/3 the online time
      N^{(1-sigma)/2} falls below the offline time's own online-equivalent and
      the frontier point is no longer the binding one; the record caps the
      claimed range at 1/3 and says so. Memory is counted in group elements,
      declared before any row is filled.
    best_known: >-
      Pollard rho, 0.886*sqrt(N) group operations at O(1) memory, remains the
      best known single-shot prime-field ECDLP algorithm and is UNCHANGED by
      this record. BSGS at (N^{1/2} time, N^{1/2} memory). The generic
      preprocessing lower bound S*T^2 = Omega~(N) is recorded at KN-TECH-005 /
      KN-LIT-013; the achieving construction is derived here and is claimed
      novel by NOBODY - novelty_status is unverified.
    hidden_overhead: >-
      Three things hide in the o(1) and are disclosed. (1) The offline stage's
      constant is the chain-building constant and is at least 1 group operation
      per covered point; there is no known way to build coverage more cheaply
      than walking it. (2) The online walk must perform a table lookup per step
      or a distinguished-point test per step; charged as O(1) here, this is a
      real memory-bandwidth cost that the exponent hides and that the area-time
      accounting in KN-TECH-035 would charge differently. (3) The stopping-rule
      constant is heuristic (H1) and could be off by a constant factor in either
      direction, which moves the crossover in bits but not the exponent.
    tradeoff_note: >-
      The tradeoff IS the deliverable: sigma + 2*tau_on = 1, achieved and
      matched to the recorded lower bound. Parallelization: the offline stage is
      embarrassingly parallel (independent chains) with linear speedup; the
      online stage is a single walk and parallelizes only across targets or by
      vOW-style distinguished points on top, which composes multiplicatively
      with this tradeoff and is NOT double-counted here. Multi-target: for T
      targets on one curve the total is Theta(N^{(1+sigma)/2}) +
      T*Theta(N^{(1-sigma)/2}), which beats T*0.886*sqrt(N) for T > N^{sigma}
      and ties the committed sqrt(T*N) floor at T = N^{1/3}, sigma = 1/3.

  proof_search_map:
    bottleneck: >-
      The single step whose removal changes the comparison: the assumption that
      the baseline's memory is O(1). Every threshold in the ECDLP and ICEX lanes
      is an inequality of the form (candidate time) < 0.886*sqrt(N); the
      bottleneck is the right-hand side, not the left.
    baseline_embedding:
      parameter_slice: >-
        sigma = 0. The construction must degenerate to Pollard rho with
        online time Theta(sqrt(N)) and correction exactly zero.
      reproduction_check: >-
        Symbolic: substitute S = 1 into T = sqrt(N/S) and offline = sqrt(N*S)
        and check both return Theta(sqrt(N)). Frozen fixture: the measured
        median online steps at S = 1 must lie within 15 per cent of
        sqrt(pi*N/2) at all three toy sizes, which is the corpus's own rho
        convention.
    observation_collision:
      observable: >-
        The exponent triple (sigma, tau_on, tau_off).
      distinct_preimage_search: >-
        A collision is guaranteed and is stated rather than hidden: the chain
        table at sigma = 1/3 and a HYPOTHETICAL index calculus with
        B = N^{1/3} and an O(N^{1/3}) decomposition oracle would share
        (1/3, 1/3, 2/3). The triple therefore does NOT identify an algorithm and
        may never be used to argue that two algorithms are the same. The
        additional condition that separates them is the SOURCE of the memory
        (known-log chain endpoints versus a factor base with unknown logs), and
        every table row must name it.
    constructive_transforms:
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the baseline family from {rho, BSGS} to the one-parameter
          family {chain table at memory N^{sigma}} and prove a strict inward
          improvement (online exponent (1-sigma)/2 < 1/2 for sigma > 0), not
          merely feasibility.
        predicted_gain: >-
          The comparator's time exponent falls by sigma/2, hence every
          threshold tightens by exactly that amount. At the two-term optimum,
          1/(2(m+1)).
    quantifier_order: >-
      FOR ALL curves E/F_p with prime-order subgroup of order N, FOR ALL
      sigma in [0, 1/3], THERE EXISTS a generic algorithm A_sigma - whose
      offline stage may depend on (E, P) but NOT on the target - such that FOR
      ALL targets Q, A_sigma uses N^{sigma} memory and Theta(N^{(1-sigma)/2})
      online group operations in expectation, under H1 and H2. The exists is
      inside the curve quantifier and outside the target quantifier, which is
      exactly what "preprocessing per curve, reused across targets" means; if
      the exists had to be inside the target quantifier the whole construction
      would be vacuous, and checking that it is not is the point of writing the
      order down.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the corpus's comparator is off its own recorded frontier by
        N^{sigma/2} at memory N^{sigma}, and that every published threshold in
        the lane must be restated with a memory-matched column. It can NEVER
        certify that any ECDLP is easier than N^{1/2} in total cost, and it can
        never certify that index calculus does or does not beat the corrected
        baseline - only what the corrected baseline is.
    nearby_object_control: >-
      Apply the identical accounting to the EXTENSION-FIELD setting, where index
      calculus demonstrably works (Gaudry-Diem over F_{q^n}). The corrected
      baseline must NOT turn the known extension-field advantage into a
      non-advantage: at n >= 3 the recorded exponent (2-2/n)/n is below
      1/2 - beta/2 for the relevant beta, and if the correction were to close
      that gap the accounting would be wrong rather than the lane closed. This
      is the same nearby-object gate catalogue A1 applies to its whole batch B1
      and it is adopted here deliberately.
    proof_obligations:
      - claim: coverage S*L below the stopping rule
        responsibility: success_probability
      - claim: online hit probability S*L^2/N
        responsibility: success_probability
      - claim: online time Theta(L) and offline time Theta(S*L)
        responsibility: runtime
      - claim: memory Theta(S) group elements
        responsibility: memory
      - claim: recovered log verifies as [k]P = Q
        responsibility: correctness
      - claim: sigma = 0 reproduces rho
        responsibility: baseline
      - claim: total cost never below N^{1/2}
        responsibility: scope
    not_applicable_reason: null

  dominated_by: >-
    THIS RECORD CLAIMS A BASELINE POINT, SO THE FRONTIER MUST BE CHECKED ROW BY
    ROW AND IT WAS. TIME axis: Pollard rho 0.886*sqrt(N) - the chain table's
    TOTAL cost N^{(1+sigma)/2} is DOMINATED BY RHO for every sigma > 0, and ties
    it at sigma = 0; only the ONLINE component is smaller, and only under H3's
    amortization policy. BSGS (N^{1/2}, N^{1/2}) - the chain table at sigma = 1/2
    would dominate it on time, but sigma is capped at 1/3 here and the comparison
    is reported rather than claimed. MEMORY axis: rho at O(1) DOMINATES the chain
    table at every sigma > 0; this record never claims otherwise and the memory
    column is the debit. DATA/QUERIES: both are query-free on public parameters;
    the chain table consumes no target-dependent data, which is exactly what
    makes it preprocessing. PREPROCESSING frontier S*T^2 = Omega~(N)
    (KN-TECH-005 / KN-LIT-013): the construction SITS ON it, so it is not
    dominated there and cannot be improved there without contradicting a
    committed theorem. MULTI-TARGET frontier sqrt(T*N) (recorded as a floor in
    IDEA-20260731-013): the composed scheme ties at T = N^{1/3} and is dominated
    for larger T. No row was left as an unchecked null. The honest summary: on
    TOTAL cost this record is dominated by rho everywhere and equals it at one
    point; its content is entirely about which point the COMPARATOR occupies.
  sota_delta: >-
    ZERO on every ECDLP attack axis. No solve, no relation, no certificate, no
    algorithm faster than 0.886*sqrt(N) in total. The delta is quantitative and
    entirely in the comparator: (i) the online-time exponent of the generic
    baseline at memory N^{sigma} moves from 1/2 to (1-sigma)/2, a delta of
    -sigma/2; (ii) the bar for point-decomposition index calculus at its own
    recorded optimum B = N^{1/(m+1)} moves from N^{1/2} to
    N^{1/2 - 1/(2(m+1))}, which at N = 2^256 is 32.0 bits at m=3, 25.6 at m=4,
    21.3 at m=5, 18.3 at m=6, 16.0 at m=7; (iii) a forced cap B <= N^{1/3} on
    any non-dominated factor base at matched memory; (iv) BSGS re-verdicted as
    dominated by N^{1/4} on time at its own memory; (v) one missing row supplied
    for the lane's still-unbuilt Pareto table. THIS IS A TIGHTENING, NOT A
    SPEEDUP, AND IT MAKES THIS PROGRAM'S POSITIVE CLAIMS HARDER TO MAKE.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.93 that stage 0's derivation reproduces sigma + 2*tau_on = 1 and passes
    the sigma = 0 rho calibration, because both are elementary arithmetic
    performed in this record and the second is pinned by a committed convention.
    0.75 that the toy sweep confirms tau_on = (1-sigma)/2 within 0.05 at all
    three sizes - not higher, because the stopping-rule constant is heuristic
    (H1), three sizes barely support a fit, and chain merging at N = 2^18 with
    small r is the most likely place the construction underperforms. 0.60 that
    the corpus contains no achievability row anywhere I did not look; the
    duplication audit's E10 grep hit its cap at 40 files and a reviewer should
    re-run it uncapped before this record's "the corpus does not hold it"
    sentence is relied on. 0.99 that the two-column threshold arithmetic in (D)
    is correct, since it is one substitution.

