  title: |-
    Lifting to the SNFS number field K = Q(c^(1/d)) leaves the rank/height obstruction unchanged
  class: measurement
  claim: |-
    For small analogues p = 2^n - c (n <= 40, d in {2, 3}; d = 5 only for n <= 24), rank E(K) - rank E(Q) <= 2 on average, the minimal height of new K-points is >= c log p, and coverage of E(F_p) by K-points of height <= 20 log p is < 1%.
  mechanism: |-
    For p = 2^n - c, SNFS uses K = Q(alpha) with alpha^d = c and alpha -> 2^(n/d). E/K reduces to E/F_p at a degree-1 prime. The obstruction (bounded rank, heights >= c log p, polynomially many small points) lives in the group E(K), not in the field.
  novelty_status: unverified
  citations:
