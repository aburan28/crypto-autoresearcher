idea:
  id: IDEA-20261016-c6585c
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Three-stage exact certificate cascade for the box-8 relation question:
    signature, mod-q relation sieve, exact survivors (no heights, no ranks)
  class: tooling
  claim: >-
    "Is there an exact [a]P+[b]Q=O with gcd(a,b)=1, 0<|a|,|b|<=8?" is decided
    for every cell without ranks or Neron-Tate heights. Stage 0 (IDEA-20261016-bf8f49
    signature, isqrt only) certifies independence for ALL coefficients on the
    non-silent set. Stage 1 keeps a candidate vector only if aP_q+bQ_q=O in
    E(F_q) for every auxiliary good prime q tried (a true relation survives
    every q, so elimination is rigorous). Stage 2 checks survivors by exact
    rational group law. Stages 1+2 are complete for the box, so "unresolved"
    never occurs for box 8; unresolved arises only for the all-coefficient
    claim off the non-silent set. Predictions: median primes needed <=3 at q
    near 1e3; survivors after j primes follow prod(1/N_q); zero false
    eliminations on planted relations; wall time per cell below brute exact
    enumeration by >=10x on cells with coefficients above 1e12.
  mechanism: >-
    PAIR: representation = relation lattice L_q of the reductions; operation
    set = group law of small E(F_q). TRICHOTOMY: Class I partial-action, exact
    canonicalisation by table lookup in a group of order ~q. LOSSY-PROJECTION
    TEST: reduction mod q is a homomorphism whose retained relation lattice
    contains the Q-relation lattice, so L_q is a lossy but sound
    over-approximation; its failure mode (a vector surviving q) is priced
    by 1/N_q per prime. Cheon-Lee-Hahn-Chee Remark 3 already says
    dependence must persist mod every other prime q' and independence can be
    tested with small primes; this idea fixes the cascade order, the box
    semantics and the certificate record (per-cell prime list and survivor
    set), and removes the need for Neron-Tate heights.
