idea:
  id: IDEA-20260809-758a6a
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    Measure the classical constant-time evaluation cost of the action, because it
    bounds what the reversible version can possibly cost
  class: measurement
  claim: >-
    A reversible implementation of the group action cannot be cheaper than a good
    classical constant-time one in operation count, so the measured classical cost
    is a hard floor for the per-query factor in every quantum model. The claim is
    that measuring it here provides an independent sanity bound on the reversible
    counts, and that at least one published per-query figure sits close enough to
    that floor to be worth flagging as optimistic — or comfortably above it, which
    would validate the figures.
  mechanism: >-
    Implement or use a constant-time evaluation of the action at the deployed
    parameter set, count field operations exactly by instrumentation rather than
    timing, and compare against the reversible counts from IDEA-20260809-666d3d
    and against published per-query figures.
  why_not_a_renamed_known_approach: >-
    Constant-time CSIDH implementations exist and are benchmarked. Using their
    operation counts as a FLOOR CHECK on quantum per-query costs is the
    methodological move, and it is cheap because the classical side is directly
    measurable.
  predictions:
  - observable: classical field-operation count per action evaluation
    metric: exact count by instrumentation
    predicted: Stable across inputs for a constant-time implementation; input dependence would indicate the implementation is not constant time and invalidates its use as a floor.
  - observable: ratio of reversible to classical operation counts
    metric: ratio
    predicted: Greater than one, plausibly by a substantial factor because of uncomputation. A ratio below one is impossible and would indicate a counting error.
  minimal_test: >-
    Instrument a constant-time implementation, measure counts over many random
    inputs, and compare with the reversible counts and published figures.
  controls:
  - 'CONSTANT-TIME VERIFICATION: operation counts must be input-independent, checked over many inputs; otherwise the floor is not well defined.'
  - 'CORRECTNESS CONTROL: the implementation must agree with a reference on action evaluation before its counts are used.'
  falsification_conditions:
  - Operation counts vary with input, invalidating the floor.
  - The reversible-to-classical ratio is below one, indicating a counting error that must be resolved before anything is recorded.
  interpretation_limits: >-
    A floor is a floor. Nothing here says a published figure is wrong; it says
    whether it is above or below a bound this program measured.
  sota_delta: 'No verdict. Delta: an independent bound on the most-multiplied factor in the disputed models.'
  dominated_by: Complements IDEA-20260809-666d3d; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for constant-time isogeny evaluation: no records. WEB NOT CHECKED.'
  source_refs:
  - Constant-time CSIDH implementation references -- RECALLED, REQUIRED READS.
