idea:
  id: IDEA-20260921-da1896
  id_allocation_provenance: >-
    Minted by the top-level coordinator session with `python3
    tools/allocate_id.py --next idea --date 20260921` and confirmed free with
    `--check` on 2026-09-21. Not derived by scanning state. Authored under the
    idea-generator role contract (agents/idea-generator.md, read in full
    before generation) in the coordinator's session: the dedicated
    idea-generator runtime agent failed its environment bootstrap (AWS
    DescribeInstances AuthFailure) on three consecutive dispatch attempts and
    a general-runtime dispatch of the same handoff was cancelled before
    producing files. A runtime substitution under the interchangeable-runtimes
    clause of AGENTS.md, recorded here honestly; the handoff, objective,
    write scope, and object-frame constraints were TASK-20260921-IDEAS against
    RQ-CRYPTO-001 as dispatched.
  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    ONE METER FOR EVERY FACTOR-BASE SPECIFICATION: the program measures
    relation supply (EV-FB-001's yield-per-charged-second) and lossy
    projection (IDEA-20260802-002's L/b meter) in two different harnesses
    with different controls, so every new factor-base candidate -- and
    KN-OPEN-020's three open classes are exactly a backlog of such
    candidates -- pays a fresh integration cost and a fresh
    controls-matching risk; a single executable fb_meter with a frozen
    grammar of factor-base specifications (algebraic predicate /
    power-residue coset / oracle-described / target-dependent ball), the
    identity, random-label, generic-relabelled-Z/nZ, and matched-random
    controls hard-wired, and one emitted row per spec (yield per charged
    second, L, b, solving degree, engine, wall time) turns every open-class
    question -- including IDEA-20260921-ffd330's coset rows and any future
    implicit/oracle spec -- into one harness invocation whose controls
    cannot be forgotten, which is the instrument the closure standard for
    KN-OPEN-020 structurally requires and the program currently lacks.
  class: tooling
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): the meter is
    representation-agnostic by construction -- a factor-base specification
    declares its own R1/R2/R3 class and target attack stage, and the meter
    measures the two charged quantities every stage costs: RELATION
    DECOMPOSITION SUPPLY (yield per charged second) and the LOSSY-PROJECTION
    price (L and b of the induced bucket map, per IDEA-20260802-002). CLAIM:
    a single harness with a frozen spec grammar and hard-wired controls can
    measure yield, L, and b for any factor-base specification in the grammar
    at toy scale, such that (a) the EV-FB-001 slices reproduce within their
    recorded bands when run through the meter, (b) the random-label control
    reads L indistinguishable from the identity within metered error for
    every spec (the calibration invariant), and (c) the marginal cost of
    adding a new open-class spec is one adapter, not a new experiment
    design -- which is falsifiable as a software claim by the reproduction
    and calibration gates, and is the prerequisite instrument for pricing
    KN-OPEN-020's open classes at all.
  mechanism: >-
    PAIR AND OPERATION SET: the meter measures tracked objects of every
    trichotomy class -- for partial-action specs (Class I: relation vectors
    over the base) it measures supply; for branching specs it measures
    L and b against the named operation set Sigma the spec declares (the
    spec must declare Sigma, and the meter runs the lossy-projection test
    against THAT Sigma, per IDEA-20260901-863e36 -- never against
    translation, which the frame closes); coordinate-dependent specs are
    rejected at parse time with the reason. What the meter discards is
    nothing -- it is an instrument, not a tracked object -- and its own
    honesty is enforced by the controls battery, which is the point of the
    proposal: the controls are not per-experiment design work that can be
    forgotten, they are the meter's fixed overhead, run on every invocation.

    WHY THE LANE NEEDS THIS NOW. Three converging pressures: (1)
    KN-OPEN-020's open classes are a queue of unpriced factor-base
    candidates, and every one of them will need the same yield-plus-L/b
    measurement with the same controls; (2) EV-FB-001's yield measurement
    and IDEA-20260802-002's L/b meter were built separately, so a candidate
    that needs both (as IDEA-20260921-ffd330's coset bases do: supply
    anomaly AND the coset-label bucket's L/b) currently requires gluing two
    harnesses with hand-matched controls -- the exact integration seam
    where control-matching mistakes live; (3) the inventor protocol's
    'controls before belief' makes any reported signal an artifact until
    the identical measurement runs against a null object of the same shape
    -- which is only cheap if the null objects are built into the meter
    rather than re-designed per experiment. The meter composes the two
    existing instruments behind one frozen grammar; it invents no new
    measurement, and its reproduction gates are the existing records'
    own numbers.
  novelty_status: unverified
  citations:
    - ref: EV-FB-001
      provenance: internal
      claim: >-
        The yield measurement this meter must reproduce: structure-invariance
        across random/interval/AP bases at p ~ 2^14, m = 3, yields within
        1.1x of random, solve time ~ d^6 -- the meter's calibration target
        and its first reproduction gate.
      verified_by: "coordinator session, full read of the record on 2026-09-21"
    - ref: IDEA-20260802-002
      provenance: internal
      claim: >-
        The L/b meter for lossy projections: loss L(pi) and branching b(pi)
        as the two measured numbers that make the lossy-projection test a
        measurement, with the identity, random-label, and generic-group
        controls; the meter's second calibration target.
      verified_by: "coordinator session, cited via docs/object-frame-ideation.md section 1 read in full on 2026-09-21; record itself not re-opened"
    - ref: IDEA-20260901-863e36
      provenance: internal
      claim: >-
        Propagation is a property of a projection PAIRED with an operation
        set Sigma; the lossy objects that propagate under Sigma are exactly
        the block systems of <Sigma> -- the reason the meter runs its
        lossy-projection test against the spec's DECLARED Sigma.
      verified_by: "coordinator session, cited via docs/object-frame-ideation.md section 1 read in full on 2026-09-21"
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        The three open classes (high-degree, implicit-membership,
        target-dependent) that form the meter's spec-grammar backlog and the
        charged-cost columns (description, membership, relation, descent,
        time, memory) the meter's output rows must carry.
      verified_by: "coordinator session, read of the statement on 2026-09-21"
    - ref: docs/inventor-protocol.md
      provenance: internal
      claim: >-
        Controls before belief: any reported signal is an artifact until the
        identical measurement has been run against a null object of the same
        shape -- the design principle that makes the controls the meter's
        fixed overhead.
      verified_by: "coordinator session, section references read via agents/idea-generator.md and docs/object-frame-ideation.md on 2026-09-21"
    - ref: IDEA-20260921-ffd330
      provenance: internal
      claim: >-
        The first consumer: power-residue coset factor bases need supply AND
        L/b measurements under matched controls in one harness; its minimal
        test is exactly one meter invocation per (ell, g) row.
      verified_by: "coordinator session, authored in this same ideation session on 2026-09-21"
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: the meter serves F2-frame candidates
      (factor-base decomposition) and any spec's declared Sigma; it adds no
      attack and presumes no family. What is added is instrument uniformity,
      not a mechanism.
    - >-
      The two existing instruments' semantics are composable without
      redefinition: yield per charged second (EV-FB-001 semantics) and L/b
      (IDEA-20260802-002 semantics) measure the same objects when pointed at
      the same spec. If their definitions conflict, the conflict itself is
      the first finding the meter produces.
  proof_search_map:
    not_applicable_reason: >-
      Tooling, not a theorem: there is no proof target. The audits that DO
      transfer are implemented as the meter's own gates -- exact baseline
      reproduction (EV-FB-001's bands) stands in for baseline embedding, the
      hard-wired null battery stands in for the nearby-object control, and
      the calibration invariant (random-label L ~ identity L) stands in for
      the observation-collision check. Recorded here rather than silently
      omitted, per inventor-protocol section 8's 'an audit that does not
      apply records why'.
  predictions:
    - metric: EV-FB-001 slice reproduction through the unified meter
      direction: different
      minimum_effect: >-
        Random/interval/AP yield rows within the recorded 1.1x band and the
        d^6 solve-time law within fit error at the original parameters --
        the reproduction gate; failure means the meter's yield semantics
        drifted from EV-FB-001's and blocks release.
    - metric: random-label control loss L across all specs
      direction: lower
      minimum_effect: >-
        L(random-label) indistinguishable from L(identity) within metered
        error for every spec in the grammar -- the calibration invariant; a
        spec whose random-label control shows nonzero L has a
        meter-artifact, and its rows are voided.
    - metric: marginal integration cost of a new open-class spec
      direction: lower
      minimum_effect: >-
        One adapter file (spec grammar entry + membership closure), zero new
        control code, zero harness changes -- the software claim, testable
        by actually adding the coset adapter of IDEA-20260921-ffd330 as the
        first case study.
    - metric: >-
        L/b of the power-residue coset-label bucket against its declared
        Sigma
      direction: different
      minimum_effect: >-
        First live readout: the coset label chi_ell(x(R)) as a bucket map
        has measurable L and b at toy scale against the declared partial-
        action Sigma, with the generic-relabelled control -- the number
        IDEA-20260921-ffd330's frame needs and no existing instrument
        produces in the same run as its supply rows.
  minimal_test:
    design: >-
      Build the meter with the frozen grammar (four spec classes:
      algebraic-predicate, power-residue-coset, oracle-described,
      target-dependent-ball), the fixed controls battery, and the row
      emitter (yield per charged second, L, b, solving degree, engine,
      wall time, per-row charged-cost columns per KN-OPEN-020). Smoke run:
      the EV-FB-001 slice through the meter (reproduction gate), the
      random-label calibration sweep across all four spec classes, then the
      first live invocation -- the coset rows of IDEA-20260921-ffd330's
      minimal test -- as the case study that exercises a fresh adapter end
      to end.
    controls:
      - identity base (full group) at fixed engine settings
      - matched-size random-subset baseline per spec
      - random-label control (labels permuted) for every L/b measurement
      - generic relabelled-Z/nZ control for the yield meter
      - EV-FB-001's original parameter slice as the external reproduction
        anchor
    required_metrics:
      - >-
        per-row: yield per charged second with 95% interval, solving
        degree, engine name and version, wall time
      - >-
        per-row: L and b against the declared Sigma, with the control's
        reading beside it
      - calibration sweep report (random-label vs identity L, all specs)
      - reproduction report vs EV-FB-001's recorded bands
  falsification_conditions:
    - >-
      The reproduction gate fails (EV-FB-001 bands not reproduced through
      the unified semantics): the two instruments' semantics do not compose
      without redefinition -- recorded as the finding, with the conflicting
      definitions named, and the meter is not released for lane use.
    - >-
      The calibration invariant fails for any spec class: the meter itself
      is miscalibrated and every row it emits is void until repaired; the
      spec class where it fails is named (this is a tooling defect, not
      evidence about the spec).
    - >-
      The marginal-cost prediction fails (a new spec class requires harness
      changes): the grammar is not actually frozen; the claim is withdrawn
      to the spec classes that did integrate without changes.
  confounders:
    - >-
      engine drift between the original EV-FB-001 runs and the meter's
      engine pins (the reproduction gate must pin the engine version or the
      1.1x band comparison is across engines)
    - >-
      the L/b semantics of IDEA-20260802-002 are tied to ITS null battery;
      reimplementing them behind a unified harness risks silent
      redefinition -- the calibration sweep is the guard, and the meter must
      cite the source record's definitions verbatim in its docs
    - >-
      spec grammar scope creep: the grammar is frozen at four classes; a
      fifth class is a new proposal, not a patch
    - >-
      toy-scale-only rows inviting over-reading: every emitted row carries
      the toy-scope tier marker automatically, so no row can appear without
      its scope label
  interpretation_limits:
    - >-
      The meter claims NO mechanism, NO attack, and NO closure: it is an
      instrument. Every lane conclusion drawn from its rows carries the
      row's own scope (toy, declared Sigma, matched controls) and nothing
      more.
    - >-
      KN-OPEN-020 CLASS, DECLARED: the grammar covers all three open
      classes' toy-scale pricing needs (high-degree via the coset adapter,
      implicit-membership via the oracle adapter, target-dependent via the
      ball adapter); it does not price anything at medium or crypto scale,
      and says so on every row.
    - >-
      Resource check (inventor-protocol obligation): the obstruction this
      instrument reads as an asset is EV-FB-001's structure-invariance
      itself -- a measured invariance at degree <= 2 is the null hypothesis
      generator for every higher-degree spec the meter will ever run; the
      meter turns a negative into the control battery's calibration
      standard.
  heuristic_assumptions:
    - id: H1
      statement: >-
        SEMANTIC COMPOSABILITY. EV-FB-001's yield-per-charged-second and
        IDEA-20260802-002's L/b, pointed at the same factor-base spec and
        the same declared Sigma, measure compatible quantities -- a single
        object can carry both readings without either instrument's
        definition being bent.
      rigorous_support: >-
        Not distributional: both quantities are exact combinatorial
        measurements of explicitly constructed finite objects (solved
        systems; bucket maps), so composability is a definitional question,
        checkable by re-deriving both definitions on one fixed toy spec --
        the derivation is the validation, in the same tier as the blind
        re-derivation discipline for load-bearing quantities.
      validation_plan: >-
        The reproduction gate IS the plan: run EV-FB-001's slice through the
        unified semantics and hit its recorded bands; separately, pick one
        spec, re-derive both readings by hand from the two source records'
        definitions, and match the meter's output. Disagreement localises to
        one of the two definitions and is recorded as the finding. Tail
        check: the d^6 solve-time law must hold across the reproduction
        slice's d range, not just at one d.
  target_complexity:
    time_exponent: >-
      The meter's own cost: one Gröbner/SAT solve per trial plus O(|FB|)
      membership closures plus the L/b sweep, i.e. the existing
      instruments' cost -- hours of single-core time for a full toy grid.
      No attack exponent is claimed or implied.
    memory_exponent: O(|FB| + relation storage), the existing frames' own
      footprint.
    best_known: >-
      Not an attack: the reference is the two existing instruments run
      separately with hand-matched controls -- the meter's claim is
      uniformity and control-integrity, priced as engineering cost, not
      group operations.
    hidden_overhead: >-
      Engine pinning, per-row control overhead (the battery runs on every
      invocation -- deliberately not amortised away, since skipped controls
      are the failure mode this exists to prevent), and the toy-scope tier
      marker on every row. Nothing else hides.
    tradeoff_note: >-
      Per-row parallelism is flat (one spec-parameter-curve cell per
      worker); the controls battery is the fixed serial fraction, kept
      serial on purpose so its execution is visible in every receipt.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
