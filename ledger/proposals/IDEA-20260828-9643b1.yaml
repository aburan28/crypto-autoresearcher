  sota_delta: >-
    No attack; disclosure/calibration contribution only. If confirmed, the
    quantitative delta is GAP(k) itself in bits at each FIPS 204 category,
    against an implicit incumbent GAP of "unstated" (this program has never
    computed it). The smallest GAP(k) this record would consider worth
    reporting as a genuine calibration finding (as opposed to noise in the
    reduction's free constants) is 10 bits or outright vacuity.
