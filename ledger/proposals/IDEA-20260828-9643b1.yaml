idea:
  id: IDEA-20260828-9643b1
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Transcribe the worst-case-to-average-case Module-SIS/Module-LWE reduction
    loss at FIPS 204's exact (n=256, k, l, q) and report the bit-level gap
    between "SelfTargetMSIS is at least as hard as our best lattice attack
    says" (heuristic, what this program and the standard actually use) and
    "SelfTargetMSIS is at least as hard as worst-case ideal-lattice problems"
    (the provable claim the assumption's NAME invokes)
  class: measurement
  claim: >-
    (A) THE CALIBRATION QUESTION RQ-MLDSA-001 ASKS, RESTATED PRECISELY. The
    RQ's decision_target asks "whether ML-DSA's binding assumption is
    correctly identified and correctly costed." Every RQ-MLDSA-001 proposal
    to date costs MLWE, MSIS and SelfTargetMSIS the SAME way: run the best
    known lattice-reduction attack on the concrete average-case instance and
    report a core-SVP bit count (818196, 5a748c, 591f9d, 63427b, c1abd1,
    5194f9 all do exactly this, and none of them asks what EPISTEMIC STATUS
    that number carries). Module-SIS and Module-LWE were DEFINED, in Langlois
    and Stehle's "Worst-Case to Average-Case Reductions for Module Lattices"
    (ePrint 2012/090), specifically so that the average-case problem inherits
    a PROVABLE reduction from worst-case problems on module lattices — a
    reduction that Ring-SIS/Ring-LWE, by contrast, only inherit for a
    restricted ideal-lattice subclass. That reduction has a LOSS FACTOR
    (in approximation factor gamma, as a function of module rank d, ring
    degree n, and modulus q) that this program has never transcribed or
    evaluated at FIPS 204's actual parameters. Search this session (WebSearch
    synthesis, not yet a full-text read — see novelty_screen) surfaced a
    directly relevant secondary claim: "Evaluating the Security of
    CRYSTALS-Dilithium in the Quantum Random Oracle Model" reports that
    PROVABLY SECURE Dilithium parameters (i.e. parameters chosen so the
    worst-case-to-average-case reduction is non-vacuous at the target security
    level) require public keys approximately 11.4x and signatures
    approximately 3.2x larger than the standard, heuristically-chosen
    parameters — meaning the standard's parameters were NOT chosen to make
    the reduction non-vacuous, and the concrete bit-security number this
    program (and NIST) reports is a HEURISTIC estimate against best-known
    attacks, not a reduction-backed guarantee, at the actual deployed scale.
    (B) THE OBJECT. Define GAP(k) at each FIPS 204 category k: the difference,
    in bits, between (i) the heuristic concrete estimate B_heur(k) — the
    core-SVP bit count this program already computes for MSIS/MLWE at
    category k's (n=256, module rank, q) — and (ii) B_reduction(k), the
    largest bit-security level at which the Langlois-Stehle (or a stated
    successor, e.g. "Concrete Security from Worst-Case to Average-Case
    Lattice Reductions," ePrint 2023/947, surfaced by the same search and
    not yet read) reduction is NON-VACUOUS for FIPS 204's exact (n, module
    rank, q), i.e. the largest k' such that the reduction's own stated loss,
    evaluated at these parameters, still yields a meaningful worst-case
    hardness floor rather than a vacuous (negative-bits or trivial) one.
    (C) THE DISCRIMINATION. If B_reduction(k) is close to B_heur(k) (small
    GAP), the reduction is nearly tight at deployed scale and the heuristic
    number IS effectively reduction-backed — a strong, previously
    unestablished-in-this-ledger form of calibration confidence. If
    B_reduction(k) is far below B_heur(k), or the reduction is VACUOUS
    (B_reduction(k) <= 0, i.e. these parameters are literally outside the
    reduction's proven range) at FIPS 204 scale, then SelfTargetMSIS's
    (and MSIS's and MLWE's) "128/192/256-bit security" is, at the provable
    level, a claim about NOTHING — the entire security argument at that
    level rests on the heuristic estimate alone, which is exactly the
    calibration gap RQ-MLDSA-001 was opened to find, now stated as a NUMBER
    rather than an impression, consistent with the 11.4x/3.2x parameter-
    inflation figure already reported in the literature for this exact
    question, if that figure is confirmed on full-text read.
    (D) WHAT IS NOT CLAIMED. No attack, no forgery, no exponent improvement.
    This does not claim MLWE/MSIS/SelfTargetMSIS are broken or weaker than
    believed at the heuristic level — best-known-attack estimates are
    unaffected by anything here. It claims only that the EPISTEMIC BASIS for
    the number is narrower than the assumption's own name suggests, if the
    gap is large — a scoping and disclosure finding, not a hardness finding.
  mechanism: >-
    STAGE 0, TRANSCRIBE THE REDUCTION. Obtain and read the FULL TEXT (not
    abstract) of Langlois-Stehle (ePrint 2012/090) and, if it supersedes or
    tightens the bound, "Concrete Security from Worst-Case to Average-Case
    Lattice Reductions" (ePrint 2023/947). Extract the EXACT theorem
    statement: the approximation factor gamma achievable as a function of
    module rank d, ring degree n, modulus q, and number of samples m, and any
    stated concrete (non-asymptotic) polynomial bound. This session's own
    fetch attempts on both the eprint page and the PDF were rate-limited
    (HTTP 429) and on the raw PDF (unparseable stream); this stage is
    therefore NOT done by this record and is the literal first executable
    task for whichever session runs this design, exactly as
    IDEA-20260821-4d4e5f's R1 stage flagged for ePrint 2023/246 (a DIFFERENT,
    unrelated reduction — the CMA-to-NMA forgery-security proof, not the
    worst-case-to-average-case problem-hardness reduction this record is
    about; the two must not be conflated, see discriminated_from).
    STAGE 1, EVALUATE AT FIPS 204'S EXACT PARAMETERS. Substitute FIPS 204's
    n=256, and each category's (k,l) module rank and q=8380417 into the
    transcribed gamma(d, n, q, m) bound. Solve for the WORST-CASE approximate-
    SVP hardness this reduction actually certifies at these parameters (in
    the same core-SVP bit convention this ledger already uses for the
    heuristic estimate, so the two numbers are comparable), and separately
    check whether the reduction is VACUOUS here (the required gamma exceeds
    what any known worst-case-hardness estimate for approximate-SVP at that
    gamma and dimension is believed to guarantee any nontrivial bit count —
    stated as a heuristic-on-a-heuristic and flagged as such, since worst-
    case approximate-SVP hardness ITSELF has no unconditional lower bound
    either; the reduction is being audited for what floor it delivers GIVEN
    the standard's own belief about worst-case approximate-SVP hardness, not
    for closing that further regress).
    STAGE 2, THE 11.4x / 3.2x CROSS-CHECK. Independently verify (rather than
    inherit) the "provably secure parameters are ~11.4x/3.2x larger" figure
    by finding the specific provably-secure parameter set the QROM-Dilithium
    evaluation reports, computing ITS heuristic core-SVP bit count under this
    ledger's own pinned estimator (591f9d's/5a748c's convention), and
    checking that a parameter set THAT LARGE is indeed where the reduction
    stops being (nearly) vacuous under stage 1's transcribed bound. Agreement
    between an independently-reasoned stage-1 threshold and the literature's
    reported inflation factor is a real cross-check the record does not get
    for free.
    STAGE 3, REPORT GAP(k) for k in {44, 65, 87}, with the FIPS 204
    parameters' position relative to the vacuity threshold shown explicitly
    (below / at / above), and the sensitivity of GAP(k) to the one or two
    free constants in the reduction's stated bound (report a range, not a
    point, if the source states an unspecified polynomial constant).
  novelty_status: unverified
  novelty_screen:
    method: >-
      Corpus: grepped knowledge/ and ledger/ for "Langlois|worst-case to
      average|reduction loss|worst-case-to-average-case" (67 and 30 file
      hits respectively; on inspection none of the ledger hits and none of
      the knowledge/ hits concerns Module-SIS/Module-LWE worst-case-to-
      average-case reduction tightness specifically — the knowledge/ hits are
      an artefact of the broad OR-pattern matching unrelated "reduction"
      occurrences across the literature corpus). Read all 12 RQ-MLDSA-001
      proposals and all 7 H-MLDSA-* hypothesis headers this session (detailed
      above); none computes a reduction-loss/vacuity threshold for MSIS/MLWE
      at FIPS 204 parameters. IDEA-20260821-4d4e5f's route R1 concerns a
      DIFFERENT reduction (the CMA-to-NMA-to-SelfTargetMSIS SIGNATURE
      security proof's Q_S-dependence, ePrint 2023/246) — that is the
      forgery-security proof's tightness in the number of signing queries,
      not the underlying PROBLEM's own worst-case-to-average-case hardness
      reduction, which has no Q_S dependence at all (it is a statement about
      one static instance). Web: ran two searches this session; the first
      confirmed Langlois-Stehle (ePrint 2012/090) exists and states the
      module-lattice worst-case reduction with "an efficiency slowdown ...
      bounded by a constant factor when d = O(1)" (WebSearch synthesis of the
      ResearchGate/Semantic Scholar listing, not a full-text read); the
      second surfaced "Evaluating the Security of CRYSTALS-Dilithium in the
      Quantum Random Oracle Model" (ePrint 2023/1968) via WebSearch synthesis
      reporting the 11.4x/3.2x parameter-inflation figure, and "Concrete
      Security from Worst-Case to Average-Case Lattice Reductions" (ePrint
      2023/947) as a possibly tighter successor reduction, neither fetched.
      FOUR fetch attempts this session (eprint.iacr.org/2012/090,
      perso.ens-lyon.fr/.../MSIS.pdf, eprint.iacr.org/2023/1968.pdf, and a
      retry) either returned HTTP 429 or an unparseable PDF stream; NONE of
      the four reduction papers named in this record has had its theorem
      statement read by this session. Every numeric claim above the abstract/
      search-synthesis level is therefore explicitly unverified.
    results: >-
      The QUALITATIVE fact that a gap exists between Dilithium's heuristic
      parameters and reduction-backed "provably secure" parameters IS already
      published (the 11.4x/3.2x figure, reported via WebSearch synthesis of
      ePrint 2023/1968). This program has NO internal record computing that
      gap in bits at FIPS 204's exact parameters, checking whether FIPS 204
      falls inside or outside the reduction's non-vacuous range, or cross-
      checking the two independently. That computation, at these exact
      parameters, filed as a KN-LIT/measurement in this program's own ledger,
      is the part not found anywhere in this corpus.
    verdict: >-
      KNOWN for the qualitative existence of a heuristic-vs-provable
      parameter gap for Dilithium (per the WebSearch-surfaced ePrint
      2023/1968 finding, itself not yet independently read in full).
      UNVERIFIED for the specific numeric transcription and evaluation this
      record proposes to perform at FIPS 204's exact (n=256, k, l, q) and
      for the vacuity-threshold framing, which was not found in the corpus
      or in anything actually read (as opposed to searched) this session.
      This record's own novelty_status is therefore set to `unverified`
      rather than `adaptation`, per the task's provenance discipline, because
      its central numeric claim rests on a `retrieved`-via-search-synthesis
      citation that has not itself been fetched and read in full text.
  object_first_candidate:
    tracked_object: >-
      The EPISTEMIC TIER of a single number: SelfTargetMSIS's (and MSIS's and
      MLWE's) stated bit-security, followed from "best known attack cost"
      (what every other RQ-MLDSA-001 proposal computes) through the
      worst-case-to-average-case reduction to "the largest bit level at which
      a provable, reduction-backed floor still exists," and reported as a gap
      between the two.
    lossiness: >-
      Genuinely lossy: the reduction's own approximation-factor bound
      discards everything about the SPECIFIC lattice instance except its
      dimension, modulus, and rank, and returns only a WORST-CASE floor over
      an entire class of instances. That is exactly what a reduction is for,
      and exactly why the resulting floor is (typically, for these
      reductions) far weaker than any concrete best-known-attack estimate on
      a SPECIFIC average-case instance — the discard is compatible with the
      claim the reduction actually supports (a statement about the hardest
      instance in the class), which is a different, weaker claim than "this
      specific FIPS 204 instance is hard," and the gap between the two is the
      tracked quantity.
    propagation: >-
      One step is one substitution of (n, module rank, q) into the reduction's
      stated bound. The one-step observable is whether the resulting
      worst-case floor is above, at, or below zero (vacuous) at each
      successive parameter choice — exactly the threshold stage 1 and stage 2
      both compute, from two independent directions (direct substitution, and
      cross-check against the literature's reported inflation factor).
    survival_score: >-
      The object survives as long as the reduction's stated bound remains
      non-vacuous; it is EXPECTED, per the cross-check target itself, to
      dissolve well before FIPS 204's actual parameters (i.e. the reduction
      is expected to be vacuous or nearly so at deployed scale, consistent
      with the 11.4x/3.2x inflation figure) — reporting exactly WHERE it
      dissolves, in bits, is this record's deliverable.
  null_object_control: >-
    (1) SANITY BOUNDARY: evaluate the transcribed reduction at the "provably
    secure" parameter set the QROM-Dilithium evaluation itself reports (the
    ~11.4x/3.2x-larger set); the reduction MUST be non-vacuous there by
    construction, since that is the set the source paper presumably chose to
    make it so — a failure of this check means the transcription is wrong.
    (2) MONOTONICITY: the vacuity threshold, evaluated as a function of
    module rank at fixed n and q, must move monotonically with rank (more
    rank cannot make the reduction MORE vacuous, holding n and q fixed) — a
    non-monotone result is a transcription bug. (3) DERIVED-ZERO CONTROL:
    at n=1 (no ring structure, so Module-SIS/LWE degenerates toward plain
    SIS/LWE), the transcribed reduction should reduce to the ORIGINAL
    SIS/LWE worst-case reduction's own known loss factor (a textbook,
    citable quantity); a mismatch there is a transcription error, not a
    finding about modules specifically.
  discriminated_from:
    - >-
      IDEA-20260821-4d4e5f's route R1 (ePrint 2023/246, CMA-to-NMA reduction
      tightness) concerns the SIGNATURE FORGERY security proof's dependence on
      the number of signing queries Q_S. This record concerns a DIFFERENT,
      Q_S-independent reduction: the worst-case-to-average-case hardness of the
      underlying MSIS/MLWE PROBLEM itself, which exists and has a stated loss
      factor even for a single static instance with zero signing queries. The
      two reductions are composed in the full security argument but bound
      different things, and this record does not touch 4d4e5f's ledger, Q_S
      axis, or its SLH-DSA calibration.
    - >-
      IDEA-20260801-008's "full-cost metrical audit" and IDEA-20260805-5194f9's
      "which arm binds" both operate entirely within the heuristic
      best-known-attack estimate; neither asks what PROVABLE floor, if any,
      backs that estimate. This record's object (the provable-vs-heuristic
      gap) does not exist in either.
    - >-
      IDEA-20260808-c1abd1, -63427b, -5a748c and IDEA-20260821-5535fe all
      refine or decompose the HEURISTIC concrete cost model itself (claw
      interpolation, norm-budget accounting, t0 pricing, coordinate
      projection); none of them touches the worst-case reduction at all, and
      this record's finding (if the gap is large) would apply IDENTICALLY
      regardless of which of those refinements is adopted, since all of them
      stay inside the heuristic tier.
  citations:
    - ref: "IACR ePrint 2012/090 (Langlois, Stehle), \"Worst-Case to Average-Case Reductions for Module Lattices\""
      provenance: recalled
      claim: >-
        Defines Module-SIS and Module-LWE and proves a worst-case-to-average-
        case reduction from standard (module) lattice problems, reported via
        WebSearch synthesis as having "an efficiency slowdown... bounded by a
        constant factor when d = O(1)," and as "qualitatively sharp" (converse
        reductions exist) unlike Ring-SIS/Ring-LWE. NOT independently fetched
        or read in full text this session: two fetch attempts (the ePrint page
        and the PDF at perso.ens-lyon.fr) both failed (HTTP 429; unparseable
        PDF stream respectively). No exact theorem statement or polynomial loss
        bound is transcribed here.
      verified_by: null
    - ref: "IACR ePrint 2023/947, \"Concrete Security from Worst-Case to Average-Case Lattice Reductions\""
      provenance: recalled
      claim: >-
        Surfaced by search as a possible tighter/more concrete successor to
        Langlois-Stehle for the same reduction family. Title and existence seen
        in search results only; not fetched or read.
      verified_by: null
    - ref: "\"Evaluating the Security of CRYSTALS-Dilithium in the Quantum Random Oracle Model\" (IACR ePrint 2023/1968, also Springer 10.1007/978-3-031-58751-1_15)"
      provenance: recalled
      claim: >-
        Reported via WebSearch synthesis: provably secure Dilithium parameters
        require public keys approximately 11.4x and signatures approximately
        3.2x larger than the heuristic FIPS-204-lineage parameters, because
        "while provably secure parameters are based on conventional hardness
        assumptions for the MSIS and MLWE problems, the original Dilithium's
        parameters are based on highly heuristic reductions." NOT fetched this
        session (HTTP 429 on the PDF). This is the single most load-bearing
        citation in this record and is the first thing a follow-up session
        must independently confirm by reading the primary text before any
        number here is relied on.
      verified_by: null
    - ref: "NIST FIPS 204 initial public draft (ipd)"
      provenance: retrieved
      claim: >-
        n=256, q=8380417, and the (k,l) module ranks at ML-DSA-44/65/87, the
        exact parameters stage 1 substitutes into the transcribed reduction.
      verified_by: "idea-generator subagent (parameters as previously fetched and cross-checked across multiple RQ-MLDSA-001 records this batch; reused, not re-fetched, this session)"
    - ref: "docs/claims-and-verification.md"
      provenance: internal
      claim: >-
        Claim-tier discipline; this record's deliverable is a literature-
        arithmetic measurement carrying no certificate (kind: none), since
        nothing is solved or claimed as a break.
      verified_by: "idea-generator subagent (referenced)"
  assumptions:
    - >-
      A worst-case-to-average-case reduction for Module-SIS/Module-LWE with a
      concretely statable (not merely asymptotic) loss factor exists and is
      obtainable in full text by a session with working PDF/HTML retrieval;
      this session's own retrieval failures are logged as infrastructure
      facts about this moment, not as evidence the text is unobtainable in
      general.
    - >-
      The heuristic core-SVP bit convention already used elsewhere in this
      ledger (591f9d, 5a748c) is a legitimate common scale against which to
      express the reduction-backed floor, for comparison purposes only; the
      two numbers answer different questions and the record never conflates
      them beyond reporting their gap.
    - >-
      The 11.4x/3.2x figure, if confirmed on full-text read, refers to the
      SAME reduction family this record transcribes and not to a differently-
      scoped "provable security" notion (e.g. a tighter, non-worst-case
      argument); stage 2 exists precisely to check this rather than assume it.
  proof_search_map:
    bottleneck: >-
      The single substitution step where FIPS 204's (n, module rank, q) is
      plugged into the reduction's stated approximation-factor bound to
      determine whether the resulting worst-case floor is vacuous.
    baseline_embedding:
      parameter_slice: >-
        The "provably secure" parameter set reported by the QROM-Dilithium
        evaluation is the one point where the reduction is known (by
        construction of that source, pending its own full-text confirmation)
        to be non-vacuous; FIPS 204's own parameters are the point under
        audit.
      reproduction_check: >-
        NULL (1) above: the transcribed bound, evaluated at the "provably
        secure" parameter point, must return non-vacuous; failure means the
        transcription is wrong before FIPS 204's parameters are even
        evaluated.
    observation_collision:
      observable: "GAP(k) and the vacuity boolean at each FIPS 204 category."
      distinct_preimage_search: >-
        A large GAP(k) could mean either (i) the reduction is genuinely loose
        at these parameters (the intended reading) or (ii) the transcription
        or the heuristic-bit convention used for comparison is wrong. NULL
        (1) and (3) (the n=1 degenerate-case check against textbook SIS/LWE
        loss) are the additional conditions that separate them: both must
        pass before a large GAP(k) is reported as a finding about ML-DSA
        rather than about this record's own arithmetic.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The single scalar GAP(k), replacing two incommensurable claims
          (heuristic bit count; provable-reduction bit floor) with one
          comparable difference, on the SAME bit scale.
        predicted_gain: >-
          Diagnostic only. No attack, no speedup, no exponent. The predicted
          gain is disclosure: converting an argued impression ("the reduction
          is surely loose at deployed scale") into a checked number.
    quantifier_order: >-
      FOR the specific reduction theorem transcribed, FOR EACH FIPS 204
      category k, THERE EXISTS a computed vacuity boolean and (if
      non-vacuous) a floor B_reduction(k); the claim is about THIS named
      reduction as stated in THIS named source, not a universal claim that
      no tighter reduction could ever close the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At FIPS 204's exact parameters, the transcribed reduction [cite,
        version] yields a non-vacuous / vacuous worst-case floor of
        [B_reduction(k)] bits, against a heuristic estimate of
        [B_heur(k)] bits, a gap of GAP(k) bits." The method can never
        certify that no tighter reduction exists, and cannot certify
        anything about the heuristic estimate's own correctness (that is
        every OTHER RQ-MLDSA-001 record's job).
      nearby_object_control: >-
        The n=1 degenerate case (NULL 3), where the module reduction should
        collapse to the textbook plain-SIS/LWE worst-case reduction with its
        own well-known, independently citable loss factor. A transcription
        that does not recover that known case has not correctly captured the
        module reduction's structure.
    proof_obligations:
      - claim: "The transcribed reduction is non-vacuous at the literature-reported \"provably secure\" parameter point."
        responsibility: baseline
      - claim: "The vacuity threshold is monotone in module rank at fixed n, q."
        responsibility: correctness
      - claim: "The n=1 degenerate case recovers the textbook plain-SIS/LWE worst-case loss factor."
        responsibility: strictness
      - claim: "GAP(k) is reported on one consistent bit scale for both the heuristic and reduction-backed numbers."
        responsibility: scope
      - claim: "No claim is made that a tighter reduction cannot exist."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: "GAP(k) in bits, k in {44, 65, 87}: heuristic core-SVP estimate minus the reduction-backed floor"
      direction: higher
      minimum_effect: "predicted large (tens of bits or outright vacuity), consistent with the 11.4x/3.2x parameter-inflation figure if confirmed; a GAP(k) under 5 bits at every category would be the surprising, informative negative"
    - metric: "vacuity boolean at each FIPS 204 category"
      direction: different
      minimum_effect: "predicted vacuous (or nearly so) at all three; non-vacuous at all three would directly contradict the literature-reported parameter-inflation figure and would need reconciling before either number is trusted"
    - metric: "NULL (1): vacuity boolean at the literature-reported \"provably secure\" parameter point"
      direction: lower
      minimum_effect: "must be non-vacuous, or the transcription is wrong"
    - metric: "NULL (3): reduction loss factor at n=1 versus the textbook plain-SIS/LWE worst-case loss"
      direction: different
      minimum_effect: "must agree to within the stated constants of both sources, or the transcription is wrong"
  minimal_test:
    design: >-
      Pure literature transcription plus closed-form arithmetic; zero
      lattice reduction, zero signing, zero compute beyond evaluating a
      stated formula. Step 0: obtain full text of Langlois-Stehle (and, if
      it supersedes, ePrint 2023/947) and of the QROM-Dilithium evaluation
      (ePrint 2023/1968), by a session with working retrieval (this session's
      own attempts were rate-limited, not access-denied — re-probe before
      assuming a standing blocker). Step 1: transcribe the exact bound, with
      every symbol marked obtained or unobtained. Step 2: run NULL (1) and
      NULL (3) before touching FIPS 204's own parameters. Step 3: evaluate at
      FIPS 204's (n=256, k, l, q) for all three categories and report GAP(k).
      Step 4: independently verify the 11.4x/3.2x figure against stage 1's
      own threshold computation. THIS DISCRIMINATES because NULL (1) has a
      forced value known in advance from the source's own construction,
      because NULL (3) has a forced value from an independent, textbook
      quantity, and because stage 4 is a real cross-check the record does
      not get for free (an independently-derived threshold either agrees
      with the literature's reported inflation factor or it does not). Cost:
      under an hour once full text is obtained; the actual bottleneck is
      retrieval, not compute or implementation.
    controls:
      - "NULL (1): non-vacuous at the literature-reported provably-secure parameter point, forced."
      - "NULL (2): monotone vacuity threshold in module rank at fixed n, q."
      - "NULL (3): n=1 degenerate case recovers the textbook plain-SIS/LWE loss factor, forced."
      - "Independent cross-check of the 11.4x/3.2x figure against this record's own stage-1 threshold."
      - "Every unobtained symbol explicitly marked; no bound transcribed from a summary presented as if read in full."
    required_metrics:
      - "the transcribed reduction's exact stated bound, with source and version"
      - "GAP(k) at each FIPS 204 category, and the vacuity boolean"
      - "NULL (1) and NULL (3) outcomes"
      - "the cross-check agreement (or disagreement) between stage 1's threshold and the literature's 11.4x/3.2x figure"
      - "a probe record (URL, date, HTTP result) for every source declared unobtainable"
  falsification_conditions:
    - "NULL (1) fails (the transcribed bound is vacuous even at the literature's own provably-secure parameter point): the transcription is wrong and no GAP(k) is reportable."
    - "NULL (3) fails (the n=1 degenerate case does not recover the textbook SIS/LWE loss factor): the transcription mis-captures the module structure."
    - "GAP(k) is small (under 5 bits) at all three categories and the reduction is non-vacuous there: FIPS 204's heuristic estimate IS effectively reduction-backed, contradicting the surfaced 11.4x/3.2x figure and warranting a direct reconciliation before either number is used again in this program."
    - "GAP(k) is large or the reduction is vacuous at all three categories: consistent with the surfaced literature figure; recorded as a scoped calibration finding for RQ-MLDSA-001's decision_target, not as a hardness finding."
    - "The 11.4x/3.2x figure, on full-text read, turns out to describe a DIFFERENT notion of \"provable security\" than the worst-case-to-average-case reduction transcribed here: the cross-check in stage 4 fails, both numbers are reported separately, and no gap is claimed."
  confounders:
    - "Free/unstated constants in the reduction's polynomial loss bound; reported as a range, not a point, per stage 3."
    - "Conflating the worst-case-to-average-case PROBLEM reduction with the CMA-to-NMA SIGNATURE security proof (IDEA-20260821-4d4e5f's R1); the two are different theorems and this record's discriminated_from section exists specifically to prevent that conflation downstream."
    - "The heuristic core-SVP convention used for comparison is itself contested within this ledger (591f9d records this program's own instrument off by ~355 in beta against a recalled published value); GAP(k) inherits that convention uncertainty and must be reported alongside it."
    - "Search-synthesis citations (the 11.4x/3.2x figure) standing in for a full-text read; this record repeatedly flags which numbers are actually verified versus recalled-via-search."
  interpretation_limits:
    - "This is a literature-transcription and arithmetic exercise, not an attack, not a new theorem, and not a re-derivation of the reduction itself."
    - "A large GAP(k) or a vacuity finding does NOT mean SelfTargetMSIS/MSIS/MLWE are weaker against actual attacks than believed; best-known-attack estimates are entirely unaffected. It means the PROVABLE backing for the stated bit-security number is narrower than the assumption's name suggests."
    - "No claim tier above `toy`/literature-arithmetic is asserted; docs/claims-and-verification.md's certificate discipline does not apply (kind: none, nothing is solved)."
    - "This record does not establish whether a tighter reduction than Langlois-Stehle (e.g. ePrint 2023/947) closes the gap; that is stage 0's first task, not this record's conclusion."
  heuristic_assumptions:
    - id: H1
      statement: >-
        The worst-case-to-average-case reduction's stated loss, evaluated at
        FIPS 204's exact (n, module rank, q), degrades continuously and
        monotonically as module rank decreases at fixed n and q, so that the
        vacuity threshold is a single crossing point rather than a set with
        multiple components.
      rigorous_support: >-
        The rigorous ingredient is that these reductions are typically stated
        as a polynomial loss INCREASING as rank or dimension decreases (more
        module structure generally makes the reduction harder to run, all else
        fixed) — the classical analogue being that a reduction's black-box
        query/loss overhead is monotone in a natural hardness-related
        parameter, a standard (if reduction-specific) structural pattern
        rather than a universal theorem.
      validation_plan: >-
        Once the bound is transcribed, evaluate it on a fine grid of module
        rank at fixed n=256, q=8380417, spanning from FIPS 204's actual ranks
        down toward 1, and plot the vacuity margin. TAIL CHECK: confirm no
        sign change other than the single expected crossing; a second crossing
        would falsify the single-threshold framing and must be reported rather
        than averaged away. Sampled parameters: module rank on an integer grid
        from 1 to 8 at fixed n=256, q=8380417. TRANSFER ASSUMPTION: none beyond
        the reduction's own stated validity range — this is exact arithmetic on
        a transcribed formula, not an extrapolation.
  target_complexity:
    time_exponent: >-
      NOT APPLICABLE. No attack, no algorithm, no exponent. The deliverable
      is a bit-level gap between two existing accounting methods, not a new
      time complexity.
    memory_exponent: "not applicable (no attack)"
    best_known: >-
      The incumbent practice, in this program and in the standard itself, is
      to report ONLY the heuristic best-known-attack bit count and to invoke
      MSIS/MLWE's worst-case-hardness PROVENANCE informally (via the
      problems' names and their originating papers) without ever evaluating
      the reduction's own loss at deployed parameters. This record's
      contribution is to make that evaluation explicit.
    hidden_overhead: >-
      None in the usual sense (no attack, no o(1) hiding a superpolynomial
      cost); the analogous honesty obligation here is not to let "the
      reduction exists" stand in for "the reduction is non-vacuous at these
      parameters," which is exactly the conflation this record is designed
      to prevent.
    tradeoff_note: "not applicable (no attack, no time-memory tradeoff)"
  dominated_by: >-
    n/a (no attack result claimed; this is a calibration/disclosure
    measurement). Rows checked: (i) all 12 RQ-MLDSA-001 proposals, all of
