idea:
  id: IDEA-20260809-623d8d
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    Windowed arithmetic buys time with lookup tables — trace the tradeoff curve
    for the arithmetic layer instead of adopting one window size
  class: algorithm
  claim: >-
    Windowing techniques replace repeated arithmetic with table lookups, trading
    ancilla space and lookup cost for reduced gate depth, and the window size is a
    free parameter that published estimates fix. The claim is that the optimal
    window under one cost measure is not optimal under another (gate count versus
    depth versus space-time volume), that the difference is measurable, and that a
    published total is therefore optimized for a measure its readers may not share.
  mechanism: >-
    Parameterize the arithmetic layer by window size, count gates, depth and
    ancilla at each, and evaluate all three cost measures across the sweep with
    the optimum located under each.
  why_not_a_renamed_known_approach: >-
    Windowing and its tradeoffs are published techniques. Sweeping the parameter
    across three cost measures inside a reproduction pipeline, and reporting the
    divergence of optima, is what turns a technique into a stated dependency of
    the headline number.
  predictions:
  - observable: optimal window size under each cost measure
    metric: three integers
    predicted: They differ. Coincidence would mean the choice is robust, which would simplify every downstream estimate and is worth reporting.
  - observable: cost penalty from using the wrong measure's optimum
    metric: percentage penalty per measure pair
    predicted: Material at large problem sizes; negligible penalties would make the parameter uninteresting and that is a valid outcome.
  minimal_test: >-
    Sweep window size over a declared range at two problem sizes, count all three
    measures, locate optima and report the cross-penalties, validating the
    circuits by classical simulation at small width as in IDEA-20260809-593de3.
  controls:
  - 'SIMULATION VALIDATION at every window size, since a windowed circuit that computes the wrong function would otherwise look cheap.'
  - 'BASELINE CONTROL: window size one must reproduce the unwindowed counts exactly.'
  falsification_conditions:
  - Optima coincide under all measures across sizes.
  - Windowed circuits fail simulation validation at any window size.
  interpretation_limits: >-
    Counts and optima are model outputs at declared assumptions and are not
    predictions about any implementation.
  sota_delta: 'No feasibility claim. Delta: an explicit dependency of the headline number on a measure choice that is normally left implicit.'
  dominated_by: Downstream of IDEA-20260809-593de3; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for windowed arithmetic: no records. WEB NOT CHECKED.'
  source_refs:
  - Windowed arithmetic references -- RECALLED, REQUIRED READS.
