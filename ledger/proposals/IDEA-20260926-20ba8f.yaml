  heuristic_assumptions:
    - id: H1
      statement: >-
        UNIFORM TOUCHING. Relations touch factor-base columns like
        independent uniform draws, so the untouched fraction at R relations
        is e^{-mR/B} and a fresh target's decomposition is usable with
        probability (1 - e^{-mR/B})^m, about 1 - m e^{-m} at R = B.
      rigorous_support: >-
        The mean touched count is exact by linearity; the independence is
        the classical occupancy heuristic (IDEA-20260805-061f97's law); its
        failure mode is KN-FIND-007's coverage concentration.
      validation_plan: >-
        SAMPLE: 341 fresh targets per cell at R = B. COMPARISON: usable
        fraction against (1 - e^{-m})^m; retry count against the geometric
        law. TAIL: the maximum retries per target. TRANSFER: the mean
        transfers by arithmetic; concentration at n = 131 is not claimed.
    - id: H2
      statement: >-
        GENERIC LAWS. Multi-target rho costs sqrt(2 L N') times a constant
        near the single-target one, and the preprocessing frontier is
        S T^2 = N' up to polylog, on the effective group of size N' = r/262.
      rigorous_support: >-
        Kuhn-Struik (reported), Yun's lower bound and Corrigan-Gibbs-Kogan's
        bound (reported, KN-LIT-013); the reduction to N' by the symmetry
        classes is the same convention as the matched rho.
      validation_plan: >-
        SAMPLE: the multi-target rho harness at N about 2^24, 30 seeds, L up
        to 256. COMPARISON: total against sqrt(2 L N) with the pooling
        constant reported. TAIL: the largest seed against the single-target
        tail. TRANSFER: the law's form only.

  heuristic_note: >-
    (A) and (C)'s identities are arithmetic given the stated model; the
    per-target retry factor rests on H1 and the comparator on H2. The
    a-priori expectation, stated in advance: both exponents read as
    predicted, the usable fraction reads at its occupancy value, and the
    deliverable is the second budget column.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED FOR ANY ORACLE. The record states the
      preprocessing budget line log2 C_pre = (1/2)(1 - 1/m) n - const
      against the single-target line (1/2 - 1/m) n - const, a relaxation of
      n/(2m) bits; on ECC2K-130 the column is 2^43.5, 2^46.7, 2^48.8, 2^51.3,
      2^55.0 at m = 4, 5, 6, 8, 16. An oracle meeting it would put IC below
      the generic S T^2 = N' frontier on both online and precomputation
      axes at matched advice.
    memory_exponent: >-
      Advice S = B_cap words = N^{1/m} up to m!^{1/m}; 2^33.9 words at m = 4
      (about 580 GB at 17 bytes), 2^27.6 at m = 5 (3.4 GB); rho's table at
      the same online cost is the same S by construction of the comparison.
    best_known: >-
      Single target, matched rho 2^60.81; L targets, Kuhn-Struik about
      2^60.81 sqrt(L); with advice S, Bernstein-Lange at sqrt(N'/S) online
      after sqrt(N' S) precomputation (KR-RHO-ea34b8).
    hidden_overhead: >-
      The 1.58 kink factor and the retry factor (at most 1.04 at m = 5) are
      constants; CGK's polylog slack is inside the 0.5-bit tolerance.
    tradeoff_note: >-
      The preprocessing row is a point on the (S, T, P) surface; IC's point
      is (B_cap, 1.6 C, B_cap 1.6 C + m B_cap^2) and moves only through C.
      Relation collection is embarrassingly parallel; the LA is one-time
      and 2e2a58's floor applies to it once.

