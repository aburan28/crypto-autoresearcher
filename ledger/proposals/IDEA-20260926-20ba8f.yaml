  minimal_test:
    design: >-
      STAGE 0 (zero compute): recompute (B) and (C) in Python, including the
      m = 4 window left open above; commit the two columns. STAGE 1
      (instrument): extend linalg.py (or a new Wiedemann) to return the full
      log vector of touched columns; add a shared-table multi-target mode to
      rho.py (Kuhn-Struik: keep all DPs across targets); verify both on a
      relabelled Z/NZ group of about 2^20 with a random base of 2^7 elements
      and the enumeration oracle. STAGE 2 (the measurement): on the
      prime-field engine's cells (p about 2^20 to 2^24, m in {2, 3}, engine
      enumerate or mitm) and on the binary n = 19 CERTBIN cell and its
      Koblitz sibling (m = 2, oracle A), run IC once to a full log vector at
      R = B relations, then L in {1, 4, 16, 64, 256} fresh targets with
      certificates, counting shared and per-target operations separately;
      run multi-target rho on the same L targets with a shared DP table, 30
      seeds. Fit both exponents. STAGE 3 (zero compute): write the
      preprocessing column and the window into the ECC2K-130 table. No
      attack is run.
    cell:
      curve: >-
        PRIME-FIELD: the engine's own toy curves at p in [2^20, 2^24] with
        prime order (src/crypto_autoresearcher/index_calculus, engines
        enumerate and mitm). BINARY: the n = 19 CERTBIN cell (t^19 + t^5 +
        t^2 + t + 1, A = 46693, B = 306147, h = 2) and the Koblitz n = 19
        sibling (#E = 4 * 130873, recompute). GENERIC CONTROL: relabelled
        Z/NZ, N a prime near 2^20, random base of 2^7 elements.
      m: 2 and 3 (prime field), 2 (binary, oracle A); the deployed column is stated at m in {4, 5, 6, 8, 16}.
      l: B = 2^7 to 2^10 per cell, set so that mu is near 1 (cap locus) on each cell.
      factor_base: the engine's subspace or small-coordinate base; V = {deg < l} on the binary cells; a random subset on Z/NZ.
      targets: L in {1, 4, 16, 64, 256} fresh random subgroup targets, certificates on every log; 30 seeds for rho per L.
      seeds: enumerated 0..29, recorded.
    instrument:
      - src/crypto_autoresearcher/index_calculus/ (solver.py, decompose.py, rho.py, linalg.py; the sweep and engines subcommands)
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py, gf2n.py, oracles_rc1.py (binary m = 2 oracle A)
      - 'NEW: full-log-vector solve (about 80 lines on linalg.py, or a scalar Wiedemann about 150 lines); shared-table multi-target rho (about 60 lines on rho.py); per-target accounting and fits (about 100 lines)'
      - 'missing: none'
    procedure:
      - 1. Stage 0 recomputation; commit the columns and the window.
      - 2. Stage 1 gates on Z/NZ (both exponents must read within 0.1 of -1 and -0.5).
      - 3. Stage 2 on each cell; certificates on every log; usable fraction and retries recorded per target.
      - 4. Fit exponents with intervals; compare the rho pooling constant with 2e37b3's range.
      - 5. Write the three-row outcome and the deployed column.
    metrics:
      - name: shared_ops and per_target_ops
        unit: group operations and oracle calls, separately
        definition: operations before the first target's log versus the mean per additional target
      - name: exponent_ic and exponent_rho
        unit: dimensionless
        definition: least-squares slope of log2 per-target cost against log2 L with interval
      - name: usable_fraction
        unit: fraction
        definition: fresh-target decompositions whose legs all lie in touched columns
      - name: pooling_constant
        unit: dimensionless
        definition: multi-target rho total divided by sqrt(L) times the single-target mean
    controls:
      - RELABELLED Z/NZ with the enumeration oracle (blocking; both laws are group-generic there).
      - ORDINARY versus KOBLITZ n = 19 (must agree; no Frobenius is used).
      - CERTIFICATES on every recovered logarithm (docs/claims-and-verification.md).
      - SINGLE-TARGET REPRODUCTION at L = 1 against the engine's existing sweep numbers.
      - RHO POOLING CONSTANT against IDEA-20260920-2e37b3's toy range.
    outcomes:
      positive: >-
        (the record's expectation) IC's per-target marginal cost reads
        L^{-1} and rho's L^{-1/2} on every cell with the usable fraction at
        its predicted value; the preprocessing column is confirmed as the
        right second row of the table and the m = 4 closure is re-labelled
        single-target only.
      negative: >-
        IC's exponent is materially above -1 (say -0.5 or shallower) with
        the usable fraction well below prediction on real relation sets but
        not on Z/NZ: KN-FIND-007's coverage concentration bites the
        multi-target reading on subspace bases, the amortisation is weaker
        than L^{-1}, and the column must carry the measured exponent instead.
      artifact: >-
        the Z/NZ gate fails, or certificates fail, or the rho pooling
        constant is outside [0.5, 2]: instrument defect; nothing read.
    falsification_threshold: >-
      Stated before any run: the record's expectation holds iff exponent_ic
      is within [-1.1, -0.85] and exponent_rho within [-0.6, -0.4] on every
      cell with intervals excluding each other. A real-set usable fraction
      below 0.8 of the Z/NZ control's is the coverage reading.
    estimated_cost:
      implementation: low
      compute: >-
        ESTIMATE, order of magnitude: IC at B = 2^10 with the enumeration
        oracle is 2^20 to 2^30 operations per cell; 341 targets per cell;
        rho at N about 2^24 is 2^12 steps per solve times 30 seeds times 341
        targets, about 2^25; minutes to an hour per cell.
    required_metrics:
      - shared_ops, per_target_ops per cell and L
      - exponent_ic, exponent_rho with intervals
      - usable_fraction and retry count per target
      - pooling_constant; certificate pass rate; termination_reason

  falsification_conditions:
    - 'The recomputed preprocessing column differs from (C) by more than 0.5 bit at any m: arithmetic error, corrected before use.'
    - 'P_IC at C = T_gen differs from P_gen: the identity in (C) is wrong and the frontier statement is withdrawn.'
    - 'exponent_ic on the Z/NZ control is not within 0.1 of -1: the instrument does not realise the amortisation and nothing about curves is read.'
    - 'exponent_ic on real relation sets is shallower than -0.85 with the usable fraction below 0.8 of the control: the amortisation is coverage-limited on subspace bases; the column carries the measured law.'
    - 'A published ECDLP algorithm below the S T^2 = N line on any curve is found by a reviewer: the "first" clause in (C) is withdrawn; the column stands.'

  confounders:
    - >-
      COVERAGE CONCENTRATION (KN-FIND-007): a subspace base may leave more
      untouched columns than the random model predicts, raising retries;
      measured per target, never assumed.
    - >-
      TOY SETUP COSTS: at toy N the rho setup (rho.py's setup_ops) rivals
      the walk and flattens exponent fits; walk_ops and setup_ops are
      reported separately as rho.py already does.
    - >-
      UNIT MISMATCH between oracle calls and group operations; both are
      reported and the deployed column is in the unit of C.
    - >-
      THE GENERIC FRONTIER'S CONSTANT: CGK's bound is Omega~ with polylog
      slack and Bernstein-Lange's constants are 1.24 and 1.77; the column is
      stated to 0.5 bit and the constants are inside that.
    - >-
      KUHN-STRUIK VALIDITY: the sqrt(2 L N') law is recalled as valid for L
      below about N'^{1/4}; the window's upper end above 2^30 rests on the
      Bernstein-Lange table instead, disclosed.

  interpretation_limits:
    - >-
      NO ATTACK. No oracle is made cheaper; the record adds a second budget
