idea:
  id: IDEA-20260926-20ba8f
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    INDEX CALCULUS AMORTISES AS L^-1, RHO AS L^-1/2, SO THE PRODUCT LAW IS A
    SINGLE-TARGET VERDICT: on ECC2K-130 an arity-m oracle at the cap locus is
    priced against the generic preprocessing frontier S T^2 = N', which
    relaxes the per-attempt budget to 2^43.5, 2^46.7, 2^48.8, 2^51.3 at
    m = 4, 5, 6, 8, and an oracle up to 13 bits over the single-target
    budget beats Kuhn-Struik rho on a window of L in [2^(2g), 2^(57-2g)]
    targets

  class: mechanism

  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (x-coordinate subspace base
    at the cap locus); the attack stage whose charged cost changes is the
    SPLIT between the shared cost (relation collection plus linear algebra)
    and the per-target cost (one decomposition), which the product law does
    not separate.

    (A) THE PRODUCT LAW CHARGES RELATION COLLECTION AS IF IT WERE
    PER-TARGET. KN-FIND-aa2efc's relations x targets x oracle is the cost of
    obtaining the factor-base logarithms ONCE; the challenge's own logarithm
    is then one more decomposition (IDEA-20260922-77bf31: the individual
    logarithm is one expected successful decomposition, a fraction g/B of
    the relation phase). For ONE target that is the right total. For L
    targets on the same curve and the same subgroup (which the multi-target
    row of the frontier map, KR-RHO-46c2c6, and the preprocessing row,
    KR-RHO-ea34b8, both price for rho), the shared cost is paid once and
    each further logarithm costs one decomposition: at the cap locus
    (IDEA-20260926-4b65e3, mu = 1) that is 1.58 oracle calls at per-attempt
    cost C, plus a retry factor 1/(1 - m e^{-m R/B}) for decompositions that
    touch an untouched factor-base column (1.035 at m = 5, R = B). So
    IC(L) = T_shared + L * 1.6 C, i.e. per-target cost falling as L^{-1}
    until L about T_shared / C, then flat at 1.6 C. Generic multi-target
    rho (Kuhn-Struik, KR-RHO-46c2c6) costs about sqrt(2 L N') in total,
    per-target falling as L^{-1/2}; the Bernstein-Lange table
    (KR-RHO-ea34b8) at optimal table size gives the same L^{1/2} law for
    every L (the table of size S costs sqrt(N' S) and gives sqrt(N'/S) per
    target; at S about L the total is 2 sqrt(N' L)). So the seam's question
    "does index calculus amortise better than sqrt(L)" has an unconditional
    answer: yes, as L^{-1} against L^{-1/2}, and the whole content is at
    what L the crossing happens for a given oracle. N' = r/262 = 2^120.97 is
    the effective generic size (sqrt(pi N'/2) = 2^60.81, the matched rho).

    (B) THE CROSSING WINDOW, PRICED AT m = 5. Let the oracle miss the
    single-target cap budget 2^32.4 (4b65e3) by g bits, C = 2^{32.4 + g}.
    Then T_shared = B_cap * 1.58 * C + 5 B_cap^2 = 2^{60.81 + g} + 2^57.48
    and IC(L) < rho_KS(L) = 2^60.81 sqrt(L) reads, in s = sqrt(L) and
    dropping the 2^57.48 term, 2^{g - 28.4} s^2 - s + 2^g < 0. MY
    ARITHMETIC: real roots iff 2g < 26.4, i.e. g < 13.2; the roots are
    about s = 2^g and s = 2^{28.4 - g}, so the window is L in [2^{2g},
    2^{56.8 - 2g}]. An oracle 6 bits over budget beats generic multi-target
    rho for L between 2^12 and 2^44 targets; 10 bits over, between 2^20 and
    2^36; 13 bits over, never. Kuhn-Struik's law is usually stated for L
    below about N'^{1/4} = 2^30 (recalled), but the Bernstein-Lange table
    gives the same L^{1/2} law without that cap, so the upper end of the
    window is real. The same computation at m = 4 (plain base, sub-cap
    optimum B = 2^29.04, C_single = 2^11.0, T_shared = 2^60.8 at g = 0 with
    LA 2^59.6 inside it) gives the window's lower end 2^{2g} and upper end
    2^{2(29.04 + 11.0 - 32.4 ... )}, i.e. the upper root s = 2^{60.81 - 11.0
    - g - 29.04 + ...}; stated exactly in Stage 0 rather than here, since
    the m = 4 shared cost is LA-dominated and the window is narrower.

    (C) THE PREPROCESSING FRONTIER IS THE HONEST COMPARATOR, AND IT MOVES
    THE BUDGET COLUMN BY 9 TO 32 BITS. Corrigan-Gibbs-Kogan (KN-LIT-013,
    reported): every GENERIC algorithm with S bits of advice and online time
    T has S T^2 = Omega~(N'), tight (KR-RHO-ea34b8: Bernstein-Lange attains
    it). Index calculus at the cap locus IS a preprocessing algorithm: advice
    = the B_cap factor-base logarithms (S = B_cap words), online = one
    decomposition (T = 1.6 C), precomputation = B_cap * 1.58 C + m B_cap^2.
    The generic frontier at the SAME S is T_gen = sqrt(N'/S), P_gen =
    sqrt(N' S). MY ARITHMETIC (N' = 2^120.97): m = 4, S = 2^33.90, T_gen =
    2^43.54, P_gen = 2^77.44; m = 5, S = 2^27.58, T_gen = 2^46.70; m = 6,
    S = 2^23.42, T_gen = 2^48.78; m = 8, S = 2^18.29, T_gen = 2^51.34; m =
    16, S = 2^10.95, T_gen = 2^55.01. TWO IDENTITIES. First, IC's
    precomputation at C = T_gen equals P_gen exactly: B_cap * sqrt(N'/B_cap)
    = sqrt(N' B_cap), and the LA term is below it at every m >= 4 (2^69.8 at
    m = 4 against 2^77.4). So an arity-m oracle with per-attempt cost C
    below sqrt(N'/B_cap) beats the generic preprocessing frontier on BOTH the
    online and the precomputation axis at matched advice size, i.e. is the
    first ECDLP algorithm on any curve below the S T^2 = N' line, WHETHER OR
    NOT it beats single-target rho. Second, the resulting per-attempt budget
    column reads 2^43.5, 2^46.7, 2^48.8, 2^51.3, 2^55.0 at m = 4, 5, 6, 8, 16
    against 4b65e3's single-target 2^11.0, 2^32.4, 2^36.7, 2^42.2, 2^49.7: a
    relaxation of 32.5, 14.3, 12.1, 9.1, 5.3 bits. The m = 4 relaxation is
    the largest because the single-target row is LA-bound sub-cap while the
    preprocessing row is free to sit at the cap (the LA is one-time and far
    below P_gen). In exponent form, log2 T_gen(n, m) = (1/2)(1 - 1/m) n -
    (3 + log2 n + (log2 m!)/m)/2 for a cofactor-4 Koblitz curve, slope
    1/2 - 1/(2m) in n against 4b65e3's single-target slope 1/2 - 1/m: the
    preprocessing line is higher by n/(2m) bits, 16.4 at m = 4 on n = 131.

    (D) WHAT THIS DOES AND DOES NOT SAY. It does not make any oracle
    cheaper. It says the seam's budget has two rows, single-target and
    preprocessing/multi-target, and that the corpus has priced only the
    first. It says a Semaev or Riemann-Roch oracle that is "closed" at m = 4
    by 4b65e3's 2^11 is NOT closed as a preprocessing algorithm until it is
    shown above 2^43.5 per attempt. It says the arity lever's endpoint at
    m = 23 (IDEA-20260926-178821, budget the whole rho, zero relations) is
    the L = 1 limit of this row, not its optimum. And it says something the
    product law hides: relation collection at the cap is exactly B_cap
    decompositions, so the precomputation cost and the per-target cost are
    the SAME oracle at the SAME parameters, and the preprocessing row's
    entire content is C.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the factor-base logarithm vector as
    a stored ADVICE string of S = B_cap words, together with the subspace
    membership test that makes a fresh target decomposable. Operation set
    Sigma: {solve one more target using the stored logs; add one more target
    to the batch}. Sigma is not the translation action; it acts on the
    batch, not on points.

    TRICHOTOMY. Class III, coordinate-dependent, in the sense of
    IDEA-20260922-2e2a58's resource object: the tracked quantity (shared
    cost, per-target cost, advice size) is a property of the schedule, not
    of a group element. The per-target decomposition itself is F2's Class I
    object, unchanged.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The projection of a run onto
    (T_shared, C, S) discards every arithmetic detail and is lossy (two
    oracles with the same C are indistinguishable). It is Sigma-compatible:
    adding a target maps (T_shared, L) to (T_shared, L + 1) at cost 1.6 C
    without consulting anything discarded, and the generic frontier's
    S T^2 is a function of the triple alone. It is a block system of
    <Sigma> on schedules, not a change of coordinates (the full run is the
    change of coordinates).

    THE PRICED OPEN NUMBER. C, the per-attempt oracle cost at the cap locus,
    the same number every record on this seam prices; this record changes
    the line it is measured against. Secondary priced numbers, measured on
    toys: the usable-decomposition fraction (a fresh target's decomposition
    must avoid untouched columns), the retry factor, and the exponent of the
    per-target marginal cost in L for both algorithms.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 (decomposition) is the family; F7
    (preprocessing table) is the lens on the rho side, used as the
    comparator, and IC's stored logs are its analogue on the index-calculus
    side; F1 (rho) is the generic multi-target comparator. What is added
    beyond KR-IC-081a58 (Joux-Vitse's oracle-assisted static DH, which IS
    this amortisation on E(F_{p^5})): the pricing on ECC2K-130 against the
    S T^2 frontier at the cap locus, the per-m preprocessing budget column,
    the identity P_IC = P_gen at C = T_gen, and the crossing window in g.

    KN-OPEN-020 CLASS: subspace base, scoped class, inherited from 4b65e3.
    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1; attack stage the
    shared/per-target split.

