  citation_note: >-
    No web search was run. Kuhn-Struik's validity range (L below about
    n^{1/4}) is recalled and marked so; the argument does not depend on it
    because the Bernstein-Lange table gives the same L^{1/2} law at every L.
    All budget arithmetic is this session's hand arithmetic on 4b65e3's
    model with N' = 2^120.97, labelled for recomputation. The m = 4 window
    is deliberately left to Stage 0 rather than stated from a hand
    computation whose LA-dominated shared cost makes the algebra error-
    prone.

  assumptions:
    - >-
      The L targets are logarithms in the SAME prime-order subgroup of the
      SAME curve, so the stored factor-base logs are reusable; that is the
      multi-target setting of KR-RHO-46c2c6 and the fixed-curve advice
      setting of KN-LIT-013.
    - >-
      Per-target cost is 1.58 oracle calls at mu = 1 plus the retry factor;
      the target is re-randomised by a group operation per attempt.
    - >-
      Linear algebra returns the full log vector of the touched columns
      (Wiedemann does; the incremental elimination in linalg.py stops at the
      first row that pins the single target's k and must be extended).
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 (family), F7 (comparator and the
      stored-logs analogue), F1 (comparator).
    - Arithmetic only at deployed parameters; executable cells at toy sizes.

  proof_search_map:
    bottleneck: >-
      Whether an arity-m oracle at the cap locus has per-attempt cost C
      below sqrt(N'/B_cap); every other quantity in the preprocessing row is
      arithmetic. The lane's open question is unchanged (C), the line it is
      measured against is new.
    baseline_embedding:
      parameter_slice: >-
        L = 1 reproduces the product law's single-target verdict term for
        term (T_shared + 1.6 C against rho). C = sqrt(N'/B_cap) reproduces
        the generic frontier point exactly (P_IC = P_gen). m = 23 with
        B = 524 known-log points reproduces IDEA-20260926-178821's row as
        the L = 1, S = 524 endpoint.
      reproduction_check: >-
        Symbolic, zero compute: B_cap * sqrt(N'/B_cap) = sqrt(N' B_cap) is an
        identity; at g = 0 the window's lower root must be s = 1 (L = 1, the
        tie); the m = 5 budget at L = 1 must equal 4b65e3's 2^32.4. Frozen
        fixture: on the toy cells the measured per-target marginal cost of
        IC must fall as L^{-1} to within the fitted interval and rho's as
        L^{-1/2}, before any deployed row is quoted.
    observation_collision:
      observable: >-
        The pair (per-target marginal cost exponent in L, total cost at L)
        for IC and for multi-target rho on the same cell.
      distinct_preimage_search: >-
        An apparent L^{-1} law for IC has two preimages: (i) genuine
        amortisation of a reusable log vector, or (ii) a toy artefact where
        the relation set is so over-complete that every target decomposes
        over touched columns at first attempt while the shared cost is
        dominated by setup. Separated by reporting the usable-decomposition
        fraction and the retry count per target, and by the relabelled Z/NZ
        control with the enumeration oracle, where the L^{-1} law must hold
        for the same reason and the same fraction.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource triple (T_shared, C, S) at the cap locus for each m,
          added over the disjoint blocks (relation collection, LA, L
          descents), specialised against the two generic laws (Kuhn-Struik
          sqrt(2 L N'); Corrigan-Gibbs-Kogan S T^2 = N').
        predicted_gain: >-
          The preprocessing budget column and the crossing window in g;
          zero compute.
      - transform: boundary_lift
        proposed_object: >-
          Lift the single-target product law to L targets by charging the
          product's "targets" column once and the descent L times; the lift
          is exact under the stated assumptions.
        predicted_gain: >-
          Shows the product law is the L = 1 slice of a two-parameter cost
          and that the m = 4 closure does not transfer to the preprocessing
          row.
    quantifier_order: >-
      FOR ALL m >= 4 and FOR ALL oracles with per-attempt cost C at the cap
      locus, IC(L) = T_shared(C) + 1.6 L C under the assumptions, and
      IC beats the generic frontier at matched S iff C < sqrt(N'/B_cap). FOR
      ALL g < 13.2 THERE EXISTS a window of L where IC(L) < sqrt(2 L N') at
      m = 5. NOT CLAIMED: that any oracle has C below any of these budgets.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 the preprocessing budget column is [values]; the
        single-target column is 4b65e3's; an m = 5 oracle g < 13.2 bits over
        the single-target budget beats Kuhn-Struik rho for L in [2^{2g},
        2^{56.8-2g}]; on toy cells IC's per-target marginal cost scales as
        L^{-1 +/- delta} and rho's as L^{-1/2 +/- delta} with measured
        constants." It can NEVER certify C at n = 131 for any oracle.
      nearby_object_control: >-
        The relabelled Z/NZ group with a random base of the same size and
        the enumeration oracle: IC's L^{-1} law is group-generic and must
        reproduce there exactly; the ordinary n = 19 curve and the Koblitz
        n = 19 curve must give the same law (no Frobenius is used here).
        The rho side must reproduce 2e37b3's toy pooling constant range
        [0.8, 1.3] as a sanity check on the multi-target harness.
    proof_obligations:
      - claim: The preprocessing budget column at m in {4, 5, 6, 8, 16} and the m = 5 window, recomputed in Python.
        responsibility: correctness
      - claim: P_IC = P_gen at C = T_gen, and the LA term is below P_gen at every m >= 4.
        responsibility: correctness
      - claim: The toy pipeline's full-log-vector LA and multi-target rho harness reproduce the two exponents on Z/NZ before any curve cell is read.
        responsibility: baseline
      - claim: The usable-decomposition fraction and retry factor at R = B are measured and match 1/(1 - m e^{-m}) within 10 percent.
        responsibility: success_probability
      - claim: Nothing here lowers C for any oracle or claims a point below rho at L = 1.
        responsibility: scope

