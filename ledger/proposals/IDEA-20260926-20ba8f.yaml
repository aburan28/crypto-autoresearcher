    - >-
      FORWARD GUIDANCE: (i) every oracle record on this seam should carry
      both budget rows; (ii) the m = 4 preprocessing budget 2^43.5 is 32 bits
      above the single-target one, so the m = 4 CERTBIN ladder of 4b65e3 has
