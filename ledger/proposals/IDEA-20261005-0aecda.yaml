idea:
  id: IDEA-20261005-0aecda
  question_id: RQ-HYPER-7ca025
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Cantor doubling of one explicit quadratic factor on a degree-6 sextic
    over F_11, against a degree-5 null that must reject the same input.
  class: measurement
  claim: >-
    Let f = (x^2 + 1)(x^2 + x + 2)(x^2 + 2) over F_11, and let D be the
    Mumford divisor (u, v) = (x^2 + 1, 0) on y^2 = f. D is a valid
    Mumford representative, and one run of Cantor doubling in the
    degree-6 Jacobian returns the zero class. The same input on the
    degree-5 null y^2 = (x^2 + x + 2)(x^2 + 2)(x - 1) is rejected,
    because x^2 + 1 does not divide that quintic. The nontorsion control
    (u, v) = (x, 2) on y^2 = f doubles to a nonzero class. No Richelot
    codomain triple (U, V, W) is computed, and no Prym dimension is
    computed. No ECDLP exponent is in scope.
  mechanism: >-
    Two explanations are separated before the run. Order reading: the
    roots of one quadratic factor of a squarefree sextic are Weierstrass
    points, their Mumford sum has order 2, and doubling is the zero
    class. Invalid-input reading: the same pair of polynomials is not a
    divisor on a quintic that this quadratic does not divide, so a
    group-law step that returns zero there is not seeing a Jacobian.
    A third outcome, doubling of (x, 2) to zero, means every tested
    rational divisor looked like torsion and the order-2 signal is not
    distinguished. The codomain of a (2,2)-isogeny is not the object.
    LOSSY-PROJECTION TEST. The underlying group is the Jacobian of
    y^2 = f. Operation set Sigma is doubling, not translation on a
    prime-order elliptic subgroup. The projection keeps the class of D
    and discards the choice of Mumford representative. Compatible with
    Sigma: doubling is defined on classes. Lossy: more than one reduced
    representative can be written before reduction, and the zero class
    is a proper quotient of the set of representatives.
  novelty_status: unverified
