      verified_by: null
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml.
        The row claim is that Frobenius-invariant factor bases on
        subfield Koblitz curves cut the number of systems by up to 1/n
        and speed linear algebra by n^2. That is not one Cantor doubling,
        and those factors are not used.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
  assumptions:
    - The degree-6 model has two points at infinity, and the zero class is the identity of that Jacobian.
    - Mumford's congruence v^2 congruent to f modulo u is the acceptance test.
    - (x, 2) satisfies that congruence on f. This was checked as instance selection by evaluating f(0) = 4 = 2^2 in F_11. It is not a recorded run of Cantor doubling.
    - No formula from the unread PDFs is used.
  predictions:
    - metric: indicator that doubling (x^2 + 1, 0) on y^2 = f returns the zero class
      direction: higher
      minimum_effect: 1
    - metric: indicator that (x^2 + 1, 0) is rejected on the degree-5 null
      direction: higher
      minimum_effect: 1
    - metric: indicator that doubling (x, 2) on y^2 = f returns the zero class
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      Implement acceptance by the Mumford congruence and one Cantor
      doubling, and state which infinity convention is coded. On y^2 = f
      accept (x^2 + 1, 0), double it, and record whether the class is
      zero. On the quintic, record acceptance or rejection of the same
      pair and do not double a rejected input. On y^2 = f double (x, 2)
      and record whether that class is zero. Do not evaluate a Richelot
      triple and do not compute a Prym dimension.
    controls:
      - The degree-5 null is the same shape of input pair on a curve of the wrong degree. Acceptance there falsifies the guard.
      - (x, 2) is a rational divisor with nonzero v. Doubling it to zero means the order-2 outcome was not special to (x^2 + 1, 0).
      - A second implementation of the Mumford congruence, by polynomial remainder rather than by evaluation at the roots of u, must agree on acceptance. Disagreement is an implementation split, and the order claim is then unsigned.
    required_metrics:
      - order2_double_is_zero
      - degree5_rejected
      - nontorsion_double_is_zero
      - acceptance_implementations_agree
  falsification_conditions:
    - Doubling (x^2 + 1, 0) on y^2 = f does not return the zero class.
    - The degree-5 null accepts (x^2 + 1, 0).
    - Doubling (x, 2) returns the zero class.
    - The two acceptance implementations disagree on either curve.
  confounders:
    - An imaginary degree-5 Cantor implementation applied unchanged to a degree-6 polynomial can report a nonzero double because the points at infinity were mis-counted.
    - Reducing only the u-polynomial and skipping the class arithmetic can label a nonzero class as zero.
    - The repeated-factor sextic of the Richelot admissibility guard is a different control. It is not this quintic.
  interpretation_limits:
    - One sextic over F_11 and one quintic. No identity of Cantor doubling with a Richelot codomain is claimed.
    - A zero class here is not a count of the (2,2)-kernel and not a Prym dimension.
    - Not an attack claim. No ECDLP exponent is in scope.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a squarefree sextic over a field of odd characteristic, the
        Mumford class of one monic quadratic factor with v = 0 has
        order 2. This imitates the classical fact that a Weierstrass
        point on an odd-degree hyperelliptic curve has order 2, transferred
        to one even-degree model at q = 11 with no claim beyond that
        model. The degree-5 null is predicted to lie outside the domain.
      rigorous_support: >-
        The Mumford congruence for (x^2 + 1, 0) holds on f because
        x^2 + 1 divides f, and fails on the quintic because it does not.
        That divisibility was checked by expanding the named products.
        The order of the class under Cantor doubling was not run. The
        recalled order-2 statement is not opened. KN-LIT-1371 and
        KN-LIT-921 do not state it.
      validation_plan: >-
        Run one doubling on (x^2 + 1, 0), one rejection check on the
        quintic, and one doubling on (x, 2), all over F_11. Predicted
        indicators 1, 1, and 0. Any other triple falsifies HA-1 at this
        sextic. No second prime and no transfer to cryptographic genus-2
        parameters.
  target_complexity:
    time_exponent: >-
      Polynomial in q and in the input degree. Named values q = 11 and
      degree at most 6. No sub-rho claim.
    memory_exponent: >-
      A constant number of degree-6 polynomials over F_11.
    best_known: >-
      No ECDLP exponent is in scope. Opened baselines KN-LIT-1371 and
      KN-LIT-921 are title-level and give no Cantor output.
    hidden_overhead: None beyond one doubling and two congruence checks.
    tradeoff_note: No time-memory tradeoff. The instances are enumerated in full.
