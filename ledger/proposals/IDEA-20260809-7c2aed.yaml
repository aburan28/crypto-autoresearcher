idea:
  id: IDEA-20260809-7c2aed
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: 'The apparatus built to measure this harness has never produced a committed artifact
    -- no baseline has ever been pinned, so its tuning loop has never completed one cycle -- and
    the direction criterion bound into four role contracts is complied with as a disclosure rule
    and never as a selection rule: exactly one of 459 proposals positions itself as moving an
    exponent'
  class: tooling
  claim: 'Two unmeasured self-claims. (a) THE APPARATUS HAS NEVER BEEN KEPT. docs/measuring-the-harness.md
    specifies a two-axis programme (capability vs discipline, arithmetic graders, Wilson intervals,
    version fingerprints, pinned baselines, dev/held_out splits, a non-tradeable discipline-regression
    gate) and the code exists across nine orchestration/eval modules. Verified at HEAD: evals/results/
    is .gitignore''d at line 42 and has never existed in the tree; evals/baselines/ IS committed
    and contains ONLY its README, so NO BASELINE HAS EVER BEEN PINNED and the tuning loop the
    document describes -- change something, find out whether it helped -- has never completed
    a single cycle. Grep of ledger/, knowledge/, coordination/ and experiments/ for orchestration.eval,
    EVAL-CAP, EVAL-DISC, capability.yaml, discipline.yaml or measuring-the-harness returns nothing
    outside one unrelated proposal. All 66 research questions are about cryptographic objects;
    not one frames the program''s own method. The consequence is concrete: docs/novelty-screen-20260729.md
    calls its distribution ''a measured result about the harness rather than an assertion about
    it'', but it is a one-off count from 2026-07-29 against ~23 proposals; there are now 459 and
    nothing has re-measured it. (b) A1 IS SATISFIED BY DECLARING NON-COMPLIANCE. Counted over
    all 459: 408 carry target_complexity, and of those 214 contain an explicit self-declaration
    of the form ''no exponent is moved'' / ''no asymptotic claim is made'', often with ''and the
    record says so plainly''. Of 17 affirmative-language candidates, sixteen disclaim in the same
    field. EXACTLY ONE proposal asserts an exponent move as its purpose: IDEA-20260805-bd8339
    -- ''log_q of best structure-aware key recovery falls from ell*(V-M) to d_max(f)*(V-M). This
    IS an exponent statement, not a cofactor statement, and it is the exponent the proposal exists
    to move'' -- and its downstream state is H-QRUOV-677301 and H-QRUOV-e8ae3e both proposed,
    EXP-QRUOV-5b9038 and -5c1efb both review_required with zero runs, zero EV-QRUOV records, GOAL-QRUOV-001
    draft. On the coordinator side the profile is cited in 17 decisions and used exclusively as
    a negative label. DEC-20260730-014 issued the one corrective next_action on 2026-07-30 (''Prefer
    exponent-targeting ideation ... for the next BATCH''); in the 417 proposals added on or after
    2026-07-31 not one ECDLP-lane record targets an exponent.'
  mechanism: 'I ALREADY RAN THE FREE HALF: python3 -m orchestration.eval validate --suite evals/suites/discipline.yaml
    returns ''OK: 8 task(s) valid, fixtures build, policies resolve'' at HEAD, so the apparatus
    has NOT rotted and the only thing between this program and its first self-measurement is deciding
    to keep the output. So: run the discipline suite at an explicit --trials, pin the first baseline
    into evals/baselines/ so a Wilson interval on this harness''s refusal behaviour exists at
    all, and settle the two structural questions -- whether a run summary should be committed
    under evals/ (the README says results ''land here as immutable records'', which .gitignore
    currently prevents), and whether the four hand-written trap fixtures the document itself says
    ''cannot rotate this way and will decay fastest'' are still unfamiliar to the model running
    this harness. For the portfolio half: file the 459-proposal count as a measurement record
    with the classifier PINNED so it is reproducible per batch, then test the obvious intervention
    against its own null -- require one exponent-facing slot per ideation batch, run two batches
    with it and two without on the same question, and measure whether the slot produces genuine
    candidates, overclaims the red team must kill, or records satisfying the slot by declaring
    ''no exponent is moved'' in a longer sentence. THE THIRD OUTCOME IS THE EXPECTED ONE given
    214 precedents, and it would show A1 is unimplementable as a generation constraint and belongs
    in prioritization only -- which is where ROADMAP.md''s own wording puts it (''This criterion
    ranks directions'').'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'RQ-INSTR-f8faa0 (''Do the campaign''s instruments detect planted signals and reject matched
      nulls?'') scopes itself by curve families, field types and bit sizes, with methods ''audit
      lane: instrumentation, null objects, certificates'', and caps its own evidence at claim_tier:
      toy -- it is about the campaign''s EXPERIMENTAL measuring devices, not the agent loop, the
      dispatch chain or the discipline suites. IDEA-20260807-a4f5c5, filed under it, is fault-injection
      testing of the certificate and run-record pipeline: again an experimental instrument. docs/measuring-the-harness.md
      is a design document plus a CLI and is the thing that has never been exercised, so it cannot
      be the record covering the gap. DEC-20260730-014 is a one-line preference with no measurement
      attached, no counter named and no check that it fired. IDEA-20260807-b63f08 addresses one
      of GOAL-QRUOV-001''s blockers and says nothing about portfolio composition. Verified: zero
      proposals among 459 measure the portfolio, and zero mention evals/ or orchestration.eval.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any cryptographic claim. Two objects: the HARNESS''S
      OWN EVAL BASELINE, and the PORTFOLIO COMPOSITION of what the direction criterion produces.'
    tracked_object: For the first, the discipline suite's pass rate with a Wilson interval, pinned
      as a baseline. For the second, per proposal, whether target_complexity asserts an exponent
      move or declares non-compliance.
    one_step_propagation_rule: Each additional trial narrows the Wilson interval exactly; each
      additional proposal adds one classification. Both compose by counting.
    newness_score: Nil as mathematics. The content is that the apparatus built to measure this
      harness has never produced a committed artifact, and that a criterion bound into four role
      contracts is complied with by declaring non-compliance.
  lossy_projection_identifiability_audit:
    projection: the harness -> a pass rate; the proposal corpus -> a compliance histogram.
    what_is_discarded: Everything qualitative about either.
    is_it_only_a_change_of_coordinates: 'NO for the portfolio half -- the histogram does not exist.
      Honest caveat: both halves produce counts, and a count of self-declared non-compliance is
      not evidence that better candidates were available and suppressed.'
    mirror_failure_check: 'CHECKED. The portfolio classifier must be able to find exponent-facing
      records: it finds exactly one (IDEA-20260805-bd8339), so the class is non-empty and the
      count is not rigged.'
  null_object_control:
    primary_null: 'THE INTERVENTION MUST BE TESTED AGAINST ITS OWN NULL: require one exponent-facing
      slot per ideation batch, run two batches with it and two without on the same question, and
      measure whether the slot produces genuine candidates, overclaims the red team must kill,
      or records satisfying the slot by declaring ''no exponent is moved'' in a longer sentence.
      THE THIRD OUTCOME IS THE EXPECTED ONE given 214 precedents.'
    secondary_nulls:
    - Pin the classifier so the 459-proposal count is reproducible per batch rather than a one-off.
    - 'The eval apparatus was verified to validate OK at HEAD (''OK: 8 task(s) valid, fixtures
      build, policies resolve''), so a failure to run is a keeping decision, not rot.'
  assumptions: []
  predictions:
  - metric: discipline-suite pass rate with a Wilson interval, pinned as a baseline
    direction: different
    minimum_effect: Any pinned baseline at all; none has ever existed.
  - metric: proposals asserting an exponent move as their purpose
    direction: different
    minimum_effect: Exactly one of 459 at HEAD; the question is whether an intervention moves
      it.
  minimal_test:
    design: Run the discipline suite at an explicit --trials and pin the first baseline into evals/baselines/;
      settle whether a run summary should be committed given .gitignore line 42; file the 459-proposal
      portfolio count with the classifier pinned; then run the slot intervention against its null.
    controls:
    - slot-intervention null (two batches with, two without)
    - pinned reproducible classifier
    - apparatus-validates check
    required_metrics:
    - pass rate with Wilson interval
    - portfolio compliance histogram
    - per-arm outcome of the slot intervention
  falsification_conditions:
  - 'The slot produces genuine exponent-facing candidates: A1 is implementable as a generation
    constraint and the intervention should stand.'
  - 'The slot is satisfied by longer disclaimers: A1 is unimplementable as a generation constraint
    and belongs in prioritization only -- which is where ROADMAP.md''s own wording puts it (''This
    criterion ranks directions''). This is the expected outcome.'
  - 'The slot produces overclaims the red team kills: the criterion is actively harmful as a generation
    constraint, which is the most important thing to learn.'
  confounders:
  - A pass rate on eight hand-written trap fixtures is a narrow measure, and the design document
    itself says those fixtures 'cannot rotate this way and will decay fastest'.
  - The portfolio classifier's boundary (what counts as asserting an exponent move) does real
    work and must be pinned and published.
  - Two batches per arm is a small intervention; report it as indicative, not conclusive.
  interpretation_limits:
  - Measures the program, not any cryptographic object.
  - Committing eval results and changing .gitignore are Coordinator/harness acts.
  - A low exponent-facing count is not evidence that exponent-moving results were available.
  heuristic_assumptions:
  - id: HEUR-SELFM-1
    statement: Portfolio composition is a usable proxy for whether the direction criterion steers
      generation.
    rigorous_support: None; composition also reflects what is actually tractable, which is the
      charitable reading and may be the true one.
    validation_plan: The slot intervention distinguishes the two readings directly and is the
      reason it is included.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a -- no attack
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no attack claimed)
  sota_delta: ZERO on every attack axis; no attack is proposed. The program's entire justification
    for its rule set is that discipline is worth capability, and it has never measured either;
    every claim it makes about itself, including the novelty screen's 'the discipline working',
    currently rests on anecdote. docs/target-result-profile.md is bound into the coordinator,
    idea-generator, validator and red-team contracts, and whether it changes what gets GENERATED
    or only what gets DISCLAIMED is decidable from committed records at zero compute. Either answer
    changes how the program should spend its next 400 proposals.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.95 that the suite runs and a baseline can be pinned. 0.99 that the
    portfolio count reproduces (one of 459, verified). 0.7 that the slot intervention's third
    outcome obtains -- longer disclaimers -- given 214 precedents. 0.1 that it produces a genuine
    exponent-facing candidate.
