      (IDEA-20260916-3f7a1c/5c9d6e/a17f43/b84e2d, IDEA-20260918-6c07e1, all
      read in full this session) mentions the cofactor. What this record adds
      beyond all of the above: the Sylow-coprimality closure itself (novel
