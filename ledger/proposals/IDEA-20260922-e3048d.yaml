  citation_note: >-
    No literature outside this program's own corpus and no web search was
    checked this session. The Sylow-coprimality group theory used in part (A)
    is textbook and is derived inline rather than cited to a specific source.

  assumptions:
    - >-
      l is a 129-bit PRIME (stated by KN-LIT-661e97), hence odd, hence
      gcd(4,l)=1. If l were even this entire argument would need
      re-examination; primality of l (not merely oddness) is taken from the
      cited source and not re-verified here.
    - >-
      "Endomorphism of E(F_2^131) as an abstract abelian group" covers
      sigma (Frobenius) and [-1] (negation); this record uses only the
      ABSTRACT group structure (order, Sylow decomposition), not the curve's
      geometry, for part (A)'s argument -- deliberately, so the closure does
      not depend on any curve-specific fact beyond the group order.
    - >-
      OFF-LIMITS COMPONENTS DECLARED. F6 (endomorphism/automorphism orbit)
      is touched only insofar as sigma and [-1] are named endomorphisms in
      part (A)'s proof; no orbit representative is tracked as an attack
      object. F2 is the family whose builders part (B) audits; no new
      factor base is proposed.
    - >-
      Part (B)'s empirical claim (whether existing builders restrict to one
      cofactor coset) is currently UNCHECKED by this record -- it is stated
      as the discriminating question, not as a known fact in either
      direction, and Stage 0 of the minimal_test is exactly the check.

  proof_search_map:
    bottleneck: >-
      Whether this program's own decomposition builders already draw
      candidate x-coordinates from all cofactor cosets (in which case part B
      is closed too, with no residual lever) or restrict to one (in which
      case a real, free, constant-factor pool enlargement is sitting
      unexploited). This is decidable by reading code, not by new
      mathematics or new compute.
    baseline_embedding:
      parameter_slice: >-
        The rho baseline's own convention: KN-LIT-096's 2^60.9 already
        assumes the standard reduction to the l-order subgroup (the
        Frobenius and negation speedups are stated for that subgroup); part
        (A)'s closure shows this is the ONLY thing a full-translation
        quotient could ever buy, so the rho baseline is not being compared
        against an unfairly weakened alternative -- it already has what part
        (A) shows is available.
      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE. Take a toy abelian group of order 4l' with
        l' an odd prime (e.g. order 12 = 4*3): verify by direct enumeration
        that every subgroup is of the form (subgroup of the order-4 part) x
        (subgroup of the order-3 part), and that squaring (the order-2
        endomorphism analogue) maps the order-4 part to itself and the
        order-3 part to itself. A reviewer can do this on Z/12 in under a
        minute and should before trusting the general argument.
    observation_collision:
      observable: >-
        Part A: which subgroups of G = S x C exist (a finite, enumerable
        list once |S| and |C| are fixed). Part B: the measured yield ratio
        (relations found per attempt) between a factor base built with
        cofactor-coset-restricted candidates and one built without that
        restriction, on the SAME toy curve.
      distinct_preimage_search: >-
        Two toy curves with the same (n, cofactor) but different specific
        Sylow-2 structure (S cyclic of order 4 vs S = Z/2 x Z/2, both
        possible a priori for a cofactor-4 curve) could in principle show
        different part-B yield ratios if the specific 2-torsion geometry
        matters beyond the abstract order-4 count; part (A)'s argument uses
        only |S|=4, not its internal structure, so this record predicts NO
        such difference, and a measured difference would be informative
        about which part of the argument is incomplete.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the factor-base membership test from "is this x-coordinate's
          point, reduced to C, in the target range" to "does this
          x-coordinate satisfy the membership polynomial over the FULL
          curve", deferring the C-reduction to relation-verification time.
          Encoding: unchanged (same x-coordinates, same polynomial).
          Completeness: every C-relation found under the restricted
          convention is still found. Soundness: additional candidates
          admitted are exactly the up-to-3 extra cofactor-coset
          representatives per membership-polynomial root; each is verified
          by direct curve arithmetic before being counted, per
          docs/claims-and-verification.md. Transfer: to any cofactor-h
          curve with gcd(h,l)=1, not just h=4. Cost loss: none identified;
          the membership test's degree is unchanged.
        predicted_gain: >-
          Up to ~2x more valid candidate x-coordinates per membership-test
          evaluation (after negation's own 2x is already accounted for),
          IF and only if H_unspent holds; zero gain if H_spent holds, and
          this record predicts H_spent is the more likely outcome given
          that Frobenius-orbit and negation reductions are already routine
          practice in this corpus's builders.
    quantifier_order: >-
      Part A: FORALL finite abelian G with |G|=4l, l an odd prime, FORALL
      endomorphisms phi of G: phi preserves the Sylow-2 and Sylow-l parts,
      and every subgroup of G decomposes as (subgroup of S) x (subgroup of
      C). No witness depends on an instance; this is unconditional group
      theory. Part B: EXISTS a builder in this program's corpus whose
      candidate-generation step restricts to one cofactor coset -- an
      existential, empirical claim, decided by Stage 0 of the minimal_test,
      not asserted here either way.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For ANY curve with prime-cofactor-coprime order h*l, the only
        lossy quotient of the ambient group surviving full translation is
        the standard reduction to the l-order subgroup." It cannot certify
        anything about coordinate-dependent (non-group-homomorphism)
        objects, which is exactly why part B is left open rather than
        closed by the same argument.
      nearby_object_control: >-
        A cofactor-1 (h=1, prime-order) curve of the same field size as the
        null object for part B: there, no cofactor-coset enlargement is
        possible by construction (S is trivial), so the measured yield
        ratio must equal exactly 1; a measured ratio different from 1 on the
        null object is an instrument defect, not a finding.
    proof_obligations:
      - claim: gcd(4,l)=1 given l a 129-bit prime.
        responsibility: correctness
      - claim: Every finite abelian group of coprime order n1*n2 is the internal direct product of its Sylow subgroups.
        responsibility: correctness
      - claim: Any group endomorphism of G=S x C (coprime orders) maps S into S and C into C.
        responsibility: correctness
      - claim: Every subgroup H of S x C (coprime orders) satisfies H = (H cap S) x (H cap C).
        responsibility: correctness
      - claim: >-
          Whether this program's existing F2 builders restrict candidate
          x-coordinates to one cofactor coset is checked by reading their
          implementations, not asserted.
        responsibility: scope
      - claim: The cofactor-1 null curve shows a measured yield ratio of exactly 1.
        responsibility: baseline

  predictions:
    - metric: >-
        toy reproduction of the Sylow-decomposition fact on Z/12 (or any
        toy order-4l' abelian group)
      direction: same
      minimum_effect: >-
        EXACT agreement with the enumerated subgroup list and the
        endomorphism-preservation property; any disagreement voids the
        general argument until localised.
    - metric: >-
        whether this program's SEMBIN, DREG and QSP builder implementations
        restrict candidate x-coordinate generation to a single cofactor
        coset (a binary code-read finding, not a measured statistic)
      direction: different
      minimum_effect: >-
        Reported as a yes/no per builder, with the specific line of code or
        construction step cited; this record predicts "no restriction found"
        (H_spent) as the more likely outcome, stated so H_unspent, if found,
        is the surprising and more valuable result.
    - metric: >-
        measured relation-yield ratio (cofactor-coset-unrestricted factor
        base / cofactor-coset-restricted factor base) on a toy Koblitz
        curve, n<=41, cofactor 4, IF Stage 0 finds H_unspent in at least one
        builder
      direction: higher
      minimum_effect: >-
        Between 1 and 4 (bounded by |S|=4); predicted near 2, since negation
        already collapses x-coordinates within each cofactor coset by a
        factor of 2 before this enlargement would apply.
    - metric: >-
        the SAME yield ratio measured on the cofactor-1 null curve (matched
        field size, no 2-torsion structure beyond identity)
      direction: same
      minimum_effect: 'EXACTLY 1.000; any deviation is an instrument defect.'

  minimal_test:
    design: >-
      STAGE 0 (zero compute, cheapest in the lane): read the existing
      candidate-generation / factor-base construction code paths for the
      SEMBIN, DREG and QSP-chain builders already implemented or specified
      in this program's analysis/ and any executor artifacts, and record,
      per builder, whether membership testing is performed over the full
      curve or over a pre-reduced C-only representative set. Report the
      finding as a table (builder, restricted yes/no, code pointer).
      STAGE 1 (only if Stage 0 finds at least one H_unspent builder, toy
      compute): on a toy Koblitz curve of cofactor 4 (n prime <= 41,
      constructed to have the analogous S x C structure -- verified by
      direct order factorisation, not assumed), run that builder's
      decomposition search with and without the cofactor-coset restriction,
      holding arity m and every other parameter fixed, and measure the
      relation-yield ratio over >= 50 random targets.
      STAGE 2 (control, same compute budget as Stage 1): repeat on a
      cofactor-1 toy curve of matched field size, where the ratio must be
      exactly 1.
      STAGE 3: report the Sylow-decomposition reproduction check (zero
      compute, delivered symbolically in this record's proof_search_map)
      alongside Stages 0-2.
    controls:
      - 'Cofactor-1 null curve: the yield ratio must equal exactly 1 by construction.'
      - >-
        Every relation counted under the relaxed (unrestricted) convention
        is independently re-verified by direct curve arithmetic before being
        credited, per docs/claims-and-verification.md.
      - >-
        Toy curve's Sylow-2 structure (cyclic Z/4 vs Z/2 x Z/2) is recorded
        and varied if both are constructible at the chosen field size, to
        check the prediction that the internal structure of S does not
        matter beyond its order.
    required_metrics:
      - 'Stage 0 finding per builder, with code pointer'
      - 'relation-yield ratio, restricted vs unrestricted, per toy cell'
      - 'null-curve yield ratio'
      - 'certificate pass rate for every counted relation'

  falsification_conditions:
    - 'The Sylow-decomposition reproduction check fails on a toy group: the general argument is withdrawn.'
    - >-
      Stage 0 finds H_unspent in a builder AND Stage 1's measured yield
      ratio is not between 1 and 4: either the restriction identified in
      Stage 0 does not do what this record predicts, or the toy
      reconstruction is wrong; localised before any further claim.
    - 'The cofactor-1 null curve returns a yield ratio different from 1: instrument defect, not a finding.'

  confounders:
    - >-
      A builder might restrict to one cofactor coset for a REASON unrelated
      to yield (e.g. avoiding double-counting relations, or a
      representation convenience) -- Stage 0's code read must record the
      REASON if one is documented, not just the fact of restriction, since a
      deliberate, already-priced restriction is not the same finding as an
      accidental one.
    - >-
      Even if H_unspent holds and the yield ratio is measured near 2-4, the
      GAIN is confined to the factor-base/candidate-pool SIZE; it does not
      change the per-attempt solve cost or the attempts-column success
      probability formula, which this record does not re-derive.

  interpretation_limits:
    - >-
      Part (A) is a certificate-level closure of the GROUP-HOMOMORPHISM
      reading of "spend the cofactor on decomposition" only; it says nothing
      about engineering-level candidate-pool restrictions, which part (B)
      addresses separately and leaves genuinely open pending Stage 0.
    - >-
      At best a CONSTANT FACTOR (<=4x, likely <=2x) on the raw candidate
      pool size, never an exponent; explicitly not target-class under
      docs/target-result-profile.md on its own, and stated as such.
    - >-
      No attack, no curve solved, no relation to any deployed key. Scoped to
      ECC2K-130's own group order 4*l and to toy curves of matched Sylow
      structure.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Used only for the null-object prediction.) A toy curve's specific
        internal Sylow-2 structure (Z/4 vs Z/2 x Z/2) does not affect the
        measured yield ratio beyond what the abstract order |S|=4 already
        predicts.
      rigorous_support: >-
        Rigorous ingredient: part (A)'s proof uses only |S|, not its
        internal group structure. Classical statement imitated: none beyond
