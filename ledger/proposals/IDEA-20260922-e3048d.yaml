idea:
  id: IDEA-20260922-e3048d
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    SPENDING THE COFACTOR ON DECOMPOSITION: a Sylow-coprimality certificate
    showing gcd(4,l)=1 forces every GROUP-HOMOMORPHISM lossy quotient of
    ECC2K-130's ambient order-4l group through the same order-l projection
    rho already uses (closing that reading at zero compute), leaving open
    only a constant-factor (<=4x) raw-candidate-pool question about whether
    this program's own decomposition builders already draw factor-base and
    target x-coordinates from all four cofactor cosets or silently restrict
    to one -- a code-read discriminator, cheapest in the lane

  class: mechanism

  claim: >-
    (A) THE CLOSURE, CERTIFICATE-LEVEL, ZERO COMPUTE. ECC2K-130's group order
    is 4*l with l a 129-bit PRIME (KN-LIT-661e97), hence l is odd and
    gcd(4,l) = 1. By the fundamental theorem of finite abelian groups, any
    finite abelian group G of order 4l with gcd(4,l)=1 is the INTERNAL
    DIRECT PRODUCT of its (unique) Sylow-2 subgroup S, |S|=4, and its
    (unique) Sylow-l subgroup C, |C|=l: G = S x C. A standard, elementary
    fact used here without further citation (verifiable by anyone in three
    lines): for ANY group endomorphism phi of a finite abelian group
    G = S x C with gcd(|S|,|C|)=1, phi(S) subseteq S and phi(C) subseteq C,
    because S and C are respectively the sets of elements whose order
    divides |S| and |C|, and those sets are preserved by any endomorphism
    (if x^{|S|}=e then phi(x)^{|S|}=e). This applies to EVERY endomorphism of
    E(F_2^131) as an abstract abelian group, in particular to the q=2
    Frobenius sigma and to negation [-1]. A second standard fact: because
    gcd(|S|,|C|)=1, every subgroup H <= G decomposes as H = (H cap S) x
    (H cap C) (Goursat's lemma collapses to the trivial case when the orders
    are coprime, since any "twisted" diagonal subgroup would need an element
    of order dividing both |S| and |C|, forcing it trivial). CONSEQUENCE: the
    ONLY subgroup-quotient (block-system, in the sense of IDEA-20260901-863e36)
    objects of G that propagate deterministically under G's FULL translation
    action are combinations of a quotient of S and a quotient of C -- and
    since S has only 4 elements, its only quotients are trivial or all of S,
    neither of which carries any information about a target's discrete log
    IN C (the 129-bit prime-order part every DLP-relevant question in this
    program actually cares about). So the FULL-translation-closed reading of
    "spend the cofactor on the decomposition side" reduces, exactly and by
    elementary group theory, to the SAME reduction to the order-l subgroup
    that both the matched rho baseline (KN-LIT-096) and every filed
    decomposition line in this corpus already perform as a first step. This
    is a named obstruction (Sylow coprimality plus endomorphism-preserves-
    Sylow-subgroups), an argument (the two lemmas above), and forward
    guidance (part B below), meeting docs/inventor-protocol.md section 4's
    closure standard for this ONE reading of the seam.
    (B) WHAT (A) DOES NOT CLOSE, AND IS THE RECORD'S TESTABLE CONTENT. Index
    calculus does not use the FULL translation action as its operation set --
    it is Class I, PARTIAL action (translation by factor-base elements only,
    IDEA-20260806-c5d183) -- so (A)'s rigidity, which is about group
    HOMOMORPHISM quotients under full translation, does not by itself decide
    whether the RAW x-coordinate structure a decomposition attempt searches
    over is already exploiting the cofactor or is silently discarding it.
    Concretely: a Semaev summation polynomial S_{m+1}(x_1,...,x_m,x_R) = 0
    vanishes exactly when the corresponding points (up to sign) sum to O IN
    THE FULL AMBIENT GROUP G, not specifically to O in C. If a decomposition
    attempt's factor base V and target are built as x-coordinates satisfying
    a membership predicate evaluated over the WHOLE CURVE (the ordinary
    convention: V is a set of x-coordinates, not a set of pre-reduced C-only
    group elements), then a relation the solver finds in the full ambient
    group is automatically a valid relation in C too, once the found
    combination is reduced through the S-quotient (cheap: |S|=4, at most 2
    bits of bookkeeping, always available). Under that convention there is
    nothing extra to spend: the cofactor was never withheld. But IF, in this
    program's own decomposition builders (the SEMBIN/DREG boolean systems,
    the QSP chain builder, the plain point-decomposition instruments), the
    factor base or the target is instead constructed by first projecting
    onto (or sampling exclusively from) the reduced C-subgroup -- discarding,
    for every x-coordinate found, the up-to-4 cofactor-coset representatives
    that also satisfy the SAME low-degree membership polynomial -- then the
    RAW pool of candidate x-coordinates available to a decomposition attempt
    is being silently restricted to at most 1/4 (or 1/2, after accounting
    for the negation map's own factor-2 collapse of x-coordinates to
    {P,-P} pairs, which every line here already exploits) of what the SAME
    membership test would otherwise admit, for FREE, at zero extra
    per-attempt solve cost (the summation polynomial does not change; only
    which of its roots are retained as candidates changes). WHETHER this
    program's existing builders exhibit that restriction is an EMPIRICAL,
    UNCHECKED fact about code already written, not a new group-theory
    question, and is the record's falsifiable content.
    THE DISCRIMINATING TEST, STATED SO EACH OUTCOME MEANS SOMETHING.
    Outcome 1 (H_spent): every existing builder already samples/tests
    membership over the full curve and reduces relations through the
    S-quotient only at verification time -- the cofactor was already fully
    "spent" by ordinary practice, (A)'s closure is confirmed also at the
    engineering level, and this seam is closed with no residual lever.
    Outcome 2 (H_unspent): one or more builders restrict candidate
    generation to a single cofactor coset before the solve step -- a real,
    sitting-there constant-factor (up to ~2x, after negation is already
    accounted for) enlargement of the raw candidate pool is available by
    relaxing that restriction, priced and toy-tested against a matched
    cofactor-1 (odd-order, no 2-torsion structure beyond identity) null
    curve of the same field size, where no such enlargement is possible by
    construction and the measured yield ratio must equal 1.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the curve's x-coordinate, exactly as
    used by every filed F2 line in this corpus. Operation set Sigma (part A):
    the FULL translation action of the ambient group G = E(F_2^131), used
    ONLY to establish the closure of the group-homomorphism reading via the
    Sylow-coprimality lemma above -- this is the closed case of
    IDEA-20260806-c5d183 lifted from prime order to coprime-order composite
    G, by a DIFFERENT, elementary argument (Sylow decomposition) rather than
    the rigidity theorem itself, which applies only to prime-order groups.
    Operation set Sigma (part B, the live content): translation by
    factor-base elements only (Class I, partial action, standard index
    calculus), exactly as declared by every F2 line this program has filed;
    this record adds no new Sigma there.
    TRICHOTOMY. Part A's object (the full-translation block system of G) is
    Class I / partial-action in the degenerate closed sense: the only
    surviving quotients are the trivial S x C decomposition itself, which
    IDEA-20260806-c5d183's rigidity would call "constant or injective" if G
    were prime order; here, by Sylow coprimality, it is "the C-projection or
    nothing informative", the composite-order analogue. Part B's object (the
    raw x-coordinate candidate pool, pre-solve) is COORDINATE-DEPENDENT
    (Class III): whether a candidate is retained depends on how the builder
    represents membership, not on any intrinsic property of the group
    element.
    LOSSY-PROJECTION TEST AGAINST PART A'S SIGMA (full translation on G).
    Discards: which S-coset a group element lies in. Sigma-compatible:
    endomorphism-preserves-Sylow-subgroups (shown above) makes the discard
    consistent with sigma and [-1]. Genuinely lossy in the ambient
    representation: yes (|S|=4 elements are collapsed to one class). Not a
    new object: this IS the projection every rho and index-calculus line in
    this corpus already performs when it reduces to the l-order subgroup;
    (A)'s content is that NOTHING ELSE survives this Sigma, not that this
    one thing is new.
    LOSSY-PROJECTION TEST AGAINST PART B'S SIGMA (translation by factor-base
    elements). The raw x-coordinate pool restricted to one cofactor coset
    (if that is what a builder does) discards the other <=3 cosets'
    representatives. This discard is NOT obviously Sigma-compatible with
    partial translation by factor-base elements in the way (A)'s discard was
    Sigma-compatible with full translation -- it is a REPRESENTATION choice
    (which x-coordinates count as "in the factor base"), not a group
    quotient, which is exactly why part B is coordinate-dependent (Class III)
    rather than partial-action, and why (A)'s rigidity argument does not
    settle it.
    F2 DECLARATION. This record's live content (part B) is entirely a
    component-level question about F2 builders already filed elsewhere in
    this program (SEMBIN, DREG, QSP); no new factor base, relation
    mechanism, or algorithm is proposed. KN-OPEN-020 class: not applicable
    (no new factor base).
    RQ-FROB-7d8dd4 BOUNDARY. That question owns the Frobenius-exploitation
    MECHANISM for subfield curves E/F_q attacked over F_{q^n} (composite
    extension degree). ECC2K-130 has PRIME extension degree (n=131, no
    subfield); the cofactor structure this record studies is a property of
    the curve's OWN point group over its full field, unrelated to subfield
    descent, so this record does not re-litigate RQ-FROB-7d8dd4's mechanism
    -- it studies a different structural feature (the Sylow-2 part of the
    group order) that question's scope does not mention.

  novelty_status: unverified

  origin:
    kind: generator_search
    date: '2026-09-22'
    scope: >-
      Generated against the BINSTD-IDEATION-BRIEF's lane-A candidate seam
      "ECC2K-130 has a 4-cofactor and a Frobenius of order 131 acting on the
      curve. Both are usually spent on the rho side. What does spending them
      on the decomposition side cost and buy, charged against a rho baseline
      that keeps them?" The generator derived the Sylow-coprimality closure
      (part A) from scratch, using only ECC2K-130's group order 4*l and l's
      primality, and identified the residual, genuinely open, non-closed
      content (part B, whether this program's own builders already exploit
      the raw x-coordinate pool over all cofactor cosets) as an empirical
      code-read question rather than more group theory.
    overlap_review: >-
      Grepped ledger/proposals/ for "cofactor" (matches: none of the
      returned files, on inspection of the dedup-surface.md 164-title list
      specifically, discuss ECC2K-130's own cofactor as an attack-side
      resource; the broad grep across the whole 3000+-file corpus returned
      many false positives from unrelated schema boilerplate and was not
      further pursued as the canonical dedup surface). Nearest genuinely
      related filed record, read in full this session: RQ-FROB-7d8dd4, which
      owns the Frobenius-exploitation MECHANISM but scopes itself to SUBFIELD
      curves E/F_q attacked over F_{q^n} with composite extension degree n --
      structurally disjoint from ECC2K-130's prime extension degree (n=131,
      no subfield, per analysis/binstd-curve-audit/). IDEA-20260806-c5d183
      (read via docs/object-frame-ideation.md's table) supplies the
      prime-order rigidity theorem this record's Sylow argument is the
      composite-order analogue of, using a DIFFERENT elementary proof, not a
      restatement -- the rigidity theorem does not apply to ECC2K-130's
      composite-order (4l) ambient group at all, which is exactly why a new
