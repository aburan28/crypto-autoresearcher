# =============================================================================
# IDEA-20261006-4e827a — interval factor base versus a random factor base.
# Proposal only. No hypothesis and no experiment contract in this pass.
# Novelty is unverified. This session opened the named frontier rows
# and did not count a decomposition.
# =============================================================================
idea:
  id: IDEA-20261006-4e827a
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    An interval factor base yields at least four fewer hits than a
    random base on one F_73 cell
  class: measurement
  claim: >-
    On the first ordinary short-Weierstrass curve over F_73, with
    m = 3, thirty-six targets from the prime-order subgroup, and
    B = 6, the number of targets that decompose over an interval of
    six consecutive liftable abscissae is at least 4 smaller than
    the number that decompose over one random 6-subset of liftable
    abscissae. The same direction holds on a second ordinary curve
    over F_73. A finished interval count greater than or equal to
    the random count is the concrete negative. No exponent
    improvement is claimed. Representation class R1; attack stage
    relation collection, counted by exhaustive addition, not by a
    solving degree.
  mechanism: >-
    The tracked object is the hit count of one fixed target list
    under two factor bases of equal cardinality. The interval base
    is six liftable abscissae in arithmetic progression, the first
    such block in the natural order of the field. The random base
    is a seed-recorded 6-subset. A hit is an ordered triple of
    distinct lifted base points that sums to the target or its
    negative. The interval makes the three abscissae dependent as
    an arithmetic progression, so the summation condition is a
    thinner set than it is for a generic 6-subset. The lossy
    projection keeps the integer count and discards the triples.
    The priced number is random hits minus interval hits. A gap of
    at least 4 means the shape of the base changes the relation
    yield. A gap of 0 or less means the shape did not.
  novelty_status: unverified
  citations:
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        Factor-base choice in that row is an F_2-subspace V for
        binary-field decomposition. It is not an interval of
        liftable prime-field abscissae.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials cut out decompositions. They do not,
        in that row, compare an interval base with a random base.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev index calculus is recorded there as
        not beating generic methods under stated assumptions.
        Baseline only.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  assumptions:
    - >-
      Both bases have cardinality 6. The interval is the first six
      liftable abscissae that form an arithmetic progression of
      difference 1, wrapping not allowed. If no such block exists,
      the cell is inconclusive.
    - >-
      The thirty-six targets are identical for both bases. The
      labeler is point addition. A solver is not used.
    - >-
      Each abscissa is lifted to the affine point with the smaller
      y-coordinate. The same lift rule is used for both bases.
  predictions:
    - metric: >-
        hit count on the random 6-subset minus hit count on the
        interval, thirty-six targets, p = 73, and the same
        difference on a second ordinary curve
      direction: higher
      minimum_effect: >-
        at least 4 on both curves. A finished primary difference of
        0 or less is the concrete negative.
  minimal_test:
    design: >-
      Fix p = 73. Take the first two ordinary models, skipping
      singular and trace-zero curves. Draw thirty-six subgroup
      targets. Build the interval base and one seed-recorded random
      base of size 6. Label every target against each base by
      exhaustive addition of ordered triples of distinct points.
      Report the two hit counts and their difference.
    controls:
      - >-
        A second seed-recorded random base on the primary curve. If
        the two random hit counts differ by 4 or more, the interval
        gap is not distinguishable from base-draw noise, and a
        gap of at least 4 is not attributed to the interval.
      - >-
        The second curve must show a random-minus-interval
        difference of at least 4. One curve at least 4 and the
        other at most 0 falsifies a stable shape effect.
      - >-
        The primary labels are recomputed by a second implementation
        of the same addition. The two hit counts must match exactly.
    required_metrics:
      - interval hit count and random hit count on each curve
      - the difference on each curve
      - the hit count of the second random base
      - whether a consecutive block of length 6 existed
  falsification_conditions:
    - >-
      The primary random count minus the interval count is 0 or
      negative. The interval was not poorer.
    - >-
      The two random bases on the primary curve differ by 4 or more.
      The gap is then draw noise.
    - >-
      One curve has difference at least 4 and the other has
      difference at most 0. The shape effect is curve-dependent.
  confounders:
    - >-
      The interval may contain a 2-torsion abscissa, which collapses
      a point with its negative. The count of y = 0 abscissae in
      each base is reported beside the hit counts.
    - >-
      Thirty-six is a small sample. The threshold is four hits, not
      a fraction of a hit.
  interpretation_limits:
    - >-
      One prime and B = 6. A poorer interval here does not say how
      a factor base should be chosen at cryptographic size.
    - >-
      Hit counts are not solving degrees and are not a bit-security
      claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniform random 6-subset of liftable abscissae, the hit
        count on thirty-six uniform subgroup targets at p = 73 has
        expectation equal to the interval's hit count, up to a shift
        of 0, when both bases have the same cardinality.
      rigorous_support: >-
        No identity forces an arithmetic progression to decompose
        fewer targets. The assumption imitates a model in which each
        ordered triple falls uniformly in the group, so only the
        cardinality B enters the expectation. That model is the usual
        index-calculus counting heuristic and is not a theorem for an
        arithmetic progression. KR-IC-73db3f records subspace choices
        over binary fields and does not state this prime-field gap.
      validation_plan: >-
        The minimal test is the validation: one interval, two random
        bases, thirty-six targets, difference compared with 4, repeated
        on a second curve. Tail check: the maximum, over the thirty-six
        targets, of the number of witnessing triples on the interval
        base. Parameters are p = 73 and B = 6 only. No extrapolation.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. Rho memory and the van Oorschot-Wiener interpolation
      stay as they are.
    best_known: >-
      Pollard rho at Theta(N^{1/2}), with KR-IC-5931ee the prime-field
      Semaev negative under its stated assumptions.
    hidden_overhead: >-
      None. No attack formula is stated, so no o(1) term is concealed.
    tradeoff_note: >-
      No tradeoff is proposed. The output is a difference of two toy hit counts.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
