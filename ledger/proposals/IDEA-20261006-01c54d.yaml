      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
  assumptions:
    - ψ3 is 3x^4 + 6 A x^2 + 12 B x - A^2, reduced in F_5.
    - A root is an element of F_5. Roots in an extension are not counted.
    - Nonsingularity is 4 A^3 + 27 B^2 ≠ 0. Both named pairs pass.
    - No isogeny is evaluated and no discrete logarithm is computed.
