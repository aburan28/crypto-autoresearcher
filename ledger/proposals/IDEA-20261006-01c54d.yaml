idea:
  id: IDEA-20261006-01c54d
  question_id: RQ-VOLC-f6253b
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Root gap of the 3-division polynomial at (A, B) = (1, 0) and (1, 1) over F_5
  class: measurement
  claim: >-
    Over F_5, the polynomial ψ3 = 3x^4 + 6 A x^2 + 12 B x - A^2 has 0
    roots when (A, B) = (1, 0) and 2 roots when (A, B) = (1, 1). The
    absolute gap is 2. A recount that returns any other pair of root
    counts is a negative. The same polynomial compared with a second
    evaluation of itself has gap 0. Both curves y^2 = x^3 + A x + B
    are nonsingular because 4 A^3 + 27 B^2 is 4 and 1 in F_5. This gap
    is not an ECDLP operation count and it is not a count of rational
    2-torsion kernels.
  mechanism: >-
    ψ3 vanishes at the x-coordinates of the nonzero 3-torsion. Two
    rational roots and zero rational roots are different splitting
    types of that degree-4 polynomial at one prime. The question asks
    whether volcano depth changes an attack cost. This record measures
    the root gap only. A gap of 2 does not name a group operation and
    does not stratify a rho cost. The self-comparison is the nearby
    object on which the gap 2 is false. KR-RHO-755e35 states that
    isogenous curves are equally hard. This record does not claim they
    are not.
  novelty_status: unverified
  citations:
