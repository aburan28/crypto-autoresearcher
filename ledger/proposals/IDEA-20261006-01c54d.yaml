  predictions:
    - metric: absolute_gap_of_psi3_root_counts
      direction: different
      minimum_effect: >-
        Absolute difference 2, from root counts 0 and 2.
  minimal_test:
    design: >-
      Evaluate ψ3 at all five field elements for (A, B) = (1, 0) and
      for (A, B) = (1, 1). Record both root counts, the absolute gap,
      and the two discriminants 4 A^3 + 27 B^2. Evaluate (1, 0) twice
      and require the self-gap to be 0. Do not compute a discrete
      logarithm.
    controls:
      - The second evaluation of ψ3 at (A, B) = (1, 0) returns the same root count as the first. A disagreement voids the run.
      - Both discriminants are nonzero. A zero discriminant voids the run.
    required_metrics:
      - root count at (1, 0)
      - root count at (1, 1)
      - absolute gap
      - self-gap
      - both discriminants
  falsification_conditions:
    - Both evaluations finish, the discriminants are nonzero, the self-gap is 0, and the root counts are not 0 and 2.
    - A zero discriminant or a nonzero self-gap voids the run and is not a mathematical negative.
  confounders:
    - Counting roots in an extension, or using the 2-division polynomial instead of ψ3, changes the count.
    - IDEA-20261003-e31c6e, opening not used as a formula, discusses rational 2-torsion kernels. This record counts roots of ψ3.
    - Equal point counts on an isogeny class are the hardness statement in KR-RHO-755e35. They are not these root counts.
  interpretation_limits:
    - A root gap of 2 at p = 5 is not an attack-cost gap and does not move the exponent 1/2.
    - No transfer to a cryptographic prime is claimed.
    - KR-RHO-755e35 remains in force. This gap is not evidence that isogenous curves have different generic hardness.
    - Closing RQ-VOLC-f6253b is outside this claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A uniform random degree-4 polynomial over F_5 has expected
        root count 4/5. The two named polynomials are not a random
        sample. The exhaustive evaluation is the test. The uniform
        model is the null being compared, not a theorem about
        3-torsion.
      rigorous_support: >-
        A fixed nonzero value is a root with probability 1/5 if the
        polynomial were uniform, so the expected root count is 4/5.
        ψ3 is a specific polynomial, so the model is only a scale for
        the integer gap 2. KR-RHO-755e35 is the separate hardness
        statement. This heuristic does not replace it.
      validation_plan:
        sampling: >-
          Exhaustive evaluation at 5 field elements, twice for the
          self-check. No random sample.
        comparison: >-
          Root counts against 0 and 2, and the self-gap against 0.
        tail_check: >-
          Evaluate the same two coefficient pairs at p = 7 and record
          the two root counts. Those counts do not change the p = 5
          assignment. If both gaps are nonzero and the larger count
          switches side, record the direction as unstable and keep the
          claim scoped to p = 5.
        parameters: >-
          p = 5 for the claim. p = 7 for the direction check only.
          Pairs (A, B) = (1, 0) and (1, 1).
  target_complexity:
    time_exponent: >-
      No ECDLP exponent. Ten polynomial evaluations at p = 5, plus ten
