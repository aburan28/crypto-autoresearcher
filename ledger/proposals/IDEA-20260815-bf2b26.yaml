idea:
  id: IDEA-20260815-bf2b26
  question_id: RQ-SSI-001
  added: '2026-08-15'
  title: >-
    THE ENDOMORPHISM-RING PROBLEM AND THE ISOGENY PROBLEM ARE LINKED BY
    POLYNOMIAL REDUCTIONS THAT NOBODY IN THIS PROGRAM HAS COSTED: measure
    the reduction network's actual polynomial factors
  class: cost-model

  claim: >-
    Corollary-style results move hardness between OneEnd, EndRing and
    Isogeny by citing polynomial-time reductions. A polynomial factor can be
    large, and an attack that inherits a degree-six reduction is not the
    same threat as one that inherits a linear one. Measuring the concrete
    factors turns a qualitative network into a costed one.

  mechanism: >-
    Enumerate the reductions in the network. For each, extract or derive its
    concrete cost as a function of the security parameter. Compose along the
    paths actually used and report the accumulated factor per path.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of the reduction network cited in the p^(1/3) result; grep
      'reduction network', 'OneEnd', 'EndRing', 'polynomial-time
      reduction'.
    results: >-
      The network is cited as carrying results between problems; no record
      extracts the concrete factors or composes them along paths.
    verdict: >-
      ADAPTATION. The reductions are published; the contribution is
      extracting their concrete costs and composing them, which the
      qualitative citation hides.

  object_first_candidate:
    tracked_object: >-
      THE CONCRETE COST FACTOR of each reduction, and its composition
      along the paths this program's conclusions use.
    lossiness: >-
      Calling a reduction polynomial projects away its degree and
      constants, which is exactly what determines whether an inherited
      attack is practical.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the reductions' costs are extractable from their
      sources; reductions whose cost is stated only as polynomial are the
      enumeration's key gaps.

  null_object_control: >-
    NULL 1 -- a reduction with a known linear cost, which must extract
    correctly. NULL 2 -- the identity path from a problem to itself, whose
    composed factor must be one; a network computing otherwise has a
    composition error.

  discriminated_from:
    - >-
        The p^(1/3) exponent-factor records in this series, which concern
        the core algorithm; this concerns what the reductions carrying it
        to adjacent problems cost.
    - >-
        The Kani-surface audit records, which concern published data
        rather than reduction costs.

  assumptions:
    - >-
        Reduction costs are extractable from their sources or derivable
        from their constructions.
    - >-
        Composition along a path multiplies the factors, which holds for
        sequential reductions and must be checked where a reduction is
        used non-sequentially.

  predictions:
    - metric: >-
        known-linear reduction extraction
      direction: different
      minimum_effect: >-
        FORCED correct.
    - metric: >-
        identity-path composition
      direction: different
      minimum_effect: >-
        FORCED factor one; otherwise the composition is wrong.
    - metric: >-
        accumulated factor per path actually used
      direction: different
      minimum_effect: >-
        The deliverable; a large accumulated factor means an inherited
        result is much weaker in concrete terms than its asymptotic
        statement suggests.

  minimal_test:
    design: >-
      Two reduction paths this program actually cites, both nulls first.
    controls:
      - >-
          Known-linear extraction null.
      - >-
          Identity-path composition null.
      - >-
          Reductions stated only as polynomial listed as gaps rather
          than assigned a degree.
      - >-
          Non-sequential uses flagged, since composition by
          multiplication assumes sequential application.
    required_metrics:
      - >-
          Concrete cost per reduction with its source.
      - >-
          Accumulated factor per cited path.
      - >-
          List of reductions whose cost is not extractable.

  falsification_conditions:
    - >-
        A null misbehaves. The extraction or composition is wrong.
    - >-
        Most reduction costs are not extractable. The network cannot be
        costed and that is a finding about the literature's presentation.
    - >-
        An accumulated factor is large. Results inherited along that path
        are concretely much weaker than their asymptotic form, which
        matters for how this program describes them.
    - >-
        Factors are small throughout. Inherited results carry over
        cleanly, which is worth establishing rather than assuming.

  confounders:
    - >-
        POLYNOMIAL WITHOUT DEGREE: many reductions are stated as
        polynomial without a degree, and assigning one by inference would
        fabricate a number.
    - >-
        NON-SEQUENTIAL USE: if a reduction is invoked inside a loop rather
        than once, multiplying factors understates the cost substantially.

  interpretation_limits:
    - >-
        Costs published reductions; proves nothing new and improves no
        reduction.
    - >-
        Scoped to the enumerated paths and extractable factors.
    - >-
        A large factor weakens a concrete inherited claim without
        affecting the asymptotic statement.

  heuristic_assumptions:
    - id: HEUR-SSI-RED-1
      statement: >-
        Reduction costs compose multiplicatively along the paths this
        program cites.
      rigorous_support: >-
        Rigorous ingredient: for sequentially applied reductions, the
        cost of the composition is the product of the costs, which is
        immediate. THE GAP: several of these reductions invoke oracles
        for the target problem multiple times rather than once, in which
        case the composition is a product of costs times a query count
        that the qualitative citation never mentions.
      falsification_condition: >-
        A reduction invoking its target oracle more than once, making
        multiplicative composition an underestimate.
      validation_plan: >-
        SAMPLE: every reduction on the cited paths, with its oracle
        query count extracted alongside its cost. TAIL CHECK: the
        reduction with the highest query count, which dominates the
        path. TRANSFER: none; the costing binds the enumerated paths.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic extraction and composition; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbents are the published reductions themselves, costed here
      and not improved.
    hidden_overhead: >-
      Oracle query counts inside reductions are the term most often
      omitted from the qualitative citation and the one that can dominate.
    tradeoff_note: >-
      A costed network tells you which inherited results are concretely
      meaningful; a qualitative one treats all inheritance as free.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As reductions: entirely dominated by the
    published constructions. As a costed network in this program: none
    exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: concrete cost factors for the
    reductions this program relies on to carry isogeny results between
    problems, composed along the cited paths, with oracle query counts
    extracted and reductions whose cost cannot be extracted listed as gaps.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.5 that concrete factors are extractable for most reductions, since
    many are stated only as polynomial. 0.9 that the nulls behave. 0.4 that
    an accumulated factor turns out large enough to change how an inherited
    result should be described here.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-SSI-001
    - GOAL-SSI-001
