idea:
  id: IDEA-20260829-4b34c5
  question_id: RQ-ECDLP-160d89
  added: '2026-08-29'
  title: >-
    Replace the order-theoretic accepted set by a multiplicative subgroup of
    F_p*, and use bilinear character sums over elliptic curves to decide whether
    the resulting acceptance matrix is provably pseudorandom
  class: composition
  claim: >-
    TWO-SIDED CLAIM, both sides informative. POSITIVE SIDE. The accepted set
    D_chi, defined as the set of R in G with x(R) in H, where H is the
    multiplicative subgroup of F_p* of index L = N^(1/3), is a public, DLP-free,
    sign-invariant accepted set of density Theta(1/L) whose membership test is
    one exponentiation; and, unlike the x-coordinate interval of
    K-EC-XINTERVAL-1, it is defined by an ALGEBRAIC condition, namely
    chi(x(R)) = 1 for the L-th power residue characters, rather than by the order
    structure of the integer representative. Its survivor density and its
    cross-collision concentration are therefore, in principle, provable rather
    than assumed, which would convert JPR-C4 and H-COND-FLAT from a heuristic
    with no rigorous support presently known into a theorem. NEGATIVE SIDE. The
    same character machinery bounds the discrepancy of the acceptance matrix
    M[i][j] = chi(x(R_i + S_j)) via bilinear multiplicative character sums over
    elliptic curves. A nontrivial bilinear bound at list length L = N^(1/3)
    certifies that M is pseudorandom, which by a rectangle and discrepancy
    argument lower-bounds the join exponent gamma for the whole class of joins
    that are rectangle covers, closing the algebraic-key corner with a proof
    rather than a measurement. The decision-relevant deliverable either way is
    the THRESHOLD list length at which the cited bilinear bounds become
    nontrivial. If that threshold exceeds N^(1/3), neither side is available in
    the useful range and that boundary is itself the result.
  mechanism: >-
    Three steps. STEP 1, SET CONSTRUCTION. Let L divide p-1 and let H be the set
    of L-th powers in F_p*, of index L. Put D_chi = x^{-1}(H). Since
    x(-R) = x(R), D_chi is sign-closed automatically, which K-EC-XINTERVAL-1
    achieves only by a min and floor convention. Density, the number of points of
    E(F_p) whose x-coordinate is an L-th power residue is p/L plus an error term
    controlled by character sums over the curve. STEP 2, POSITIVE USE. The
    survivor pair-sums are exactly the points of D_chi reached, so their support
    is Theta(N/L) = Theta(N^(2/3)) BY CONSTRUCTION AND BY A CHARACTER-SUM
    ESTIMATE, not by an unproved flatness assumption; the cross-collision rate
    Theta(N^(-2/3)) then follows from an equidistribution statement rather than
    from H-COND-FLAT. That supplies the row B64-DER-4 records as unproved.
    STEP 3, NEGATIVE USE. The join asks for pairs (i,j) with
    chi(x(R_i + S_j)) = 1. Bilinear character sums over elliptic curves bound
    sums of the form sum over u in U and v in V of alpha_u * beta_v *
    chi(x(u+v)) for arbitrary point sets U and V and bounded weights. Such a
    bound is exactly a bound on the discrepancy, equivalently the cut norm, of
    the acceptance matrix. A matrix whose discrepancy matches the random
    prediction has no large near-monochromatic rectangles, and a rectangle-cover
    join cannot be output-sensitive on it. So the SAME external ingredient
    supplies the concentration row and forbids the enumeration row, and which one
    dominates is decided by the threshold at which the bound is nontrivial.
  novelty_status: unverified
  citations:
    - ref: >-
        I. E. Shparlinski, "Bilinear character sums over elliptic curves", Finite
        Fields and Their Applications, 2008
      provenance: recalled
      claim: >-
        Bounds character sums of the form sum over u in U and v in V of
        rho_u * theta_v * psi(x(u+v)) for arbitrary point sets U and V on an
        elliptic curve and bounded complex weights. The existence, title, journal
        and 2008 date were seen in a WebSearch result summary on 2026-08-29; the
        paper was NOT fetched and the exact bound and its range of nontriviality
        are UNVERIFIED. Extracting that exact range is the primary deliverable of
        this record.
      verified_by: null
    - ref: >-
        O. Ahmadi and I. E. Shparlinski, "Bilinear character sums and
        sum-product problems on elliptic curves"
      provenance: recalled
      claim: >-
        Multiplicative-character analogues of the above for point sets on
        elliptic curves. Title and authors seen in a Semantic Scholar search
        listing on 2026-08-29; a WebFetch of the Semantic Scholar page returned
        no content and the Macquarie research-portal page returned HTTP 403, so
        nothing beyond the bibliographic pointer is verified.
      verified_by: null
    - ref: >-
        J. Bourgain and M. Z. Garaev, "On a variant of sum-product estimates and
        explicit exponential sum bounds in prime fields", Math. Proc. Cambridge
        Philos. Soc., 2008
      provenance: recalled
      claim: >-
        Sum-product-based explicit exponential sum bounds in prime fields, the
        technique underlying the elliptic-curve bilinear bounds above.
        Bibliographic pointer seen in a WebSearch summary on 2026-08-29; not
        fetched.
      verified_by: null
    - ref: https://arxiv.org/abs/1302.4210
      provenance: recalled
      claim: >-
        Cited in IDEA-20260823-835868 as bilinear exponential-sum context for
        elliptic-curve coordinates, and explicitly NOT a source-resolved
        output-sensitive enumeration theorem. This record was not able to fetch
        it in this session and relies on the internal record's characterization.
      verified_by: null
    - ref: IDEA-20260823-cab6c6
      provenance: internal
      claim: >-
        H-COND-FLAT and H-BUCKET-FLAT are recorded with the statements that
        Cauchy-Schwarz supplies bounds from measured Renyi-2 mass but does not
        establish the required common support or independence, and that counting
        does not prove mixing of sums from finite random lists. Those are the
        exact gaps this record proposes to close analytically for a different
        accepted set.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-671cae.yaml
      provenance: internal
      claim: >-
        B64-DER-4, the favourable Theta(L) survivor and N^(-2/3) cross-mass
        calculation rests on iid-uniform, bucket-mass and anti-clustering
        premises that are not frozen or proved.
      verified_by: idea-generator, full read of the checkpoint on 2026-08-29
    - ref: IDEA-20260829-3f0f4b
      provenance: internal
      claim: >-
        The (gamma,s) cost surface, which supplies the exact target this record's
        negative side would exclude, namely gamma < 3/2 at s = 2/3.
      verified_by: idea-generator, authored in this session
  assumptions:
    - >-
      A1. L divides p-1, or L is replaced by the largest divisor of p-1 near
      N^(1/3). This constrains the curve family and must be declared, not assumed
      generic.
    - >-
      A2. Membership in H is tested by one exponentiation, costing O(log p) field
      multiplications. That is a polylog, not O(1), key evaluation, and it is
      charged as such.
    - >-
      A3. The character-sum bounds cited are for arbitrary point sets, so they
      apply to the actual leaf lists without an independence assumption. This is
      the reason the analytic route can replace a distributional heuristic.
    - >-
      A4. A discrepancy bound constrains rectangle-cover joins. It does NOT
      constrain algebraic joins such as resultants, root finding, or elliptic
      nets, nor joins with two-sided error, and those remain outside any
      conclusion drawn here.
    - >-
      A5. The subgroup H is a multiplicative object in the FIELD and is not a
      subgroup of the elliptic-curve group; no exact nontrivial quotient of G is
      assumed, per the RQ constraint.
  proof_search_map:
    bottleneck: >-
      Two bottlenecks, and the record's design is that one external ingredient
      addresses both. First, H-COND-FLAT has no rigorous support, so the
      concentration row of the certificate can never be discharged for an
      order-theoretic accepted set. Second, no argument exists that a coordinate
      key CANNOT admit a sub-quadratic join, only that none was supplied.
    baseline_embedding:
      parameter_slice: >-
        L = 2, so H is the set of quadratic residues and D_chi is the set of
        points whose x-coordinate is a square, an accepted set of density 1/2
        whose equidistribution over the curve is classical. This is the exact old
        boundary where the character-sum machinery is uncontroversial.
      reproduction_check: >-
        At L = 2 the survivor count must be L^2/2 and the cited bounds must be
        nontrivial for any list length growing with p. If the extracted bound is
        NOT nontrivial even at L = 2 and lists of size p^(1/2), the extraction is
        wrong and the record is void.
    observation_collision:
      observable: The empirical survivor density and cross-collision rate.
      distinct_preimage_search: >-
        D_chi and x^{-1}(interval) have the same density 1/L and the same support
        size Theta(N/L); they are therefore indistinguishable by every observable
        the lane currently records. They differ in exactly one place, whether the
        accepted set is cut out by characters or by the order of the integer
        representative, and only the first admits a bilinear character-sum
        treatment. That is the collision, and resolving it is the record's
        contribution, since the lane's observables cannot see the difference that
        matters.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the accepted set's defining condition from an order predicate
          on the integer representative of x to a multiplicative-character
          predicate on x.
        predicted_gain: >-
          Makes the survivor-density and equidistribution rows provable by
          existing analytic technology rather than assumed. Predicted gain on the
          exponent is ZERO. The gain is in what becomes a theorem, not in cost.
      - transform: observable_fiber
        proposed_object: >-
          The acceptance matrix chi(x(R_i + S_j)) and its discrepancy, used as a
          certificate that no large near-monochromatic rectangle exists.
        predicted_gain: >-
          Would exclude gamma < 2 - o(1) for rectangle-cover joins on this key,
          converting the lane's "no enumerator was supplied" into "no enumerator
          of this shape exists", for one concrete key.
    quantifier_order: >-
      Positive side, THERE EXISTS an explicit accepted set D_chi such that FOR
      ALL point sets U and V on E(F_p) with |U| and |V| at least a threshold
      T(p), the survivor count and the cross-collision rate satisfy the
      certificate's C4 row with an explicit error term. Negative side, FOR ALL
      rectangle-cover joins on D_chi and FOR ALL lists of length L at least
      T(p), the join cost is Omega(L^(2-o(1))). Both are quantified over
      ADVERSARIAL list sets, which is strictly stronger than the iid-uniform
      quantifier the lane has been using, and that strengthening is the whole
      reason to want an analytic route.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the single accepted set D_chi and list lengths above the extracted
        threshold T(p), a proved survivor density, a proved cross-collision rate,
        and a discrepancy-based exclusion of output-sensitive rectangle-cover
        joins. It can NEVER certify anything for list lengths below T(p), for
        accepted sets not cut out by characters, for algebraic joins such as
        resultant, root finding, or elliptic-net methods, or for randomized joins
        with two-sided error.
      nearby_object_control: >-
        The nearby object where the desired negative conclusion must FAIL is the
        log-interval key on Z/N with known logarithms, whose acceptance matrix is
        a shifted-interval matrix with maximal discrepancy deficiency and huge
        monochromatic rectangles. A discrepancy argument that also excluded that
        join would prove too much. A second control is Z/N with composite order
        and a subgroup accepted set, where the matrix is block-structured.
    proof_obligations:
      - claim: >-
          The size |x^{-1}(H)| equals 2p/L plus an explicit error term derived
          from curve character sums.
        responsibility: size
      - claim: >-
          The membership test costs O(log p) field multiplications and is
          target-independent and DLP-free.
        responsibility: interface
      - claim: >-
          The cited bilinear bounds apply to arbitrary point sets and are
          nontrivial for |U| = |V| = N^(1/3); or they are not, and the exact
          threshold is extracted.
        responsibility: feasibility
      - claim: >-
          A discrepancy bound on the acceptance matrix lower-bounds the cost of
          rectangle-cover joins.
        responsibility: strictness
      - claim: The argument is silent on the log-interval known-log control.
        responsibility: scope
      - claim: >-
          Source coefficients replay through D_chi exactly as through any other
          accepted set; the key does not touch replay.
        responsibility: correctness
      - claim: >-
          The exponentiation cost per key evaluation is charged into gamma and
          does not silently inflate the o(1).
        responsibility: runtime
    not_applicable_reason: null
  predictions:
    - metric: extracted_threshold_list_length_for_nontrivial_bilinear_bounds
      direction: higher
      minimum_effect: >-
        Predicted strictly above N^(1/3), stated as a falsifiable expectation.
        Bilinear sum-product-based bounds over prime fields typically require the
        product of the set sizes to exceed a positive power of p beyond p^(2/3),
        and L = N^(1/3) gives |U|*|V| = N^(2/3) exactly at or below that line. If
        the extracted threshold is at or below N^(1/3), BOTH sides of the claim
        become available and this record's priority rises sharply.
    - metric: accepted_set_density_of_D_chi
      direction: different
      minimum_effect: >-
        Forced value, 1/L with relative error O(p^(-1/2+o(1))). If the extracted
        error term is not o(1/L) the set is not usable at this density.
    - metric: key_evaluation_cost_exponent
      direction: higher
      minimum_effect: >-
        O(log p) field multiplications per evaluation versus O(1) for
        K-EC-XINTERVAL-1. This is a genuine and disclosed regression on the key
        row; it is a polylog cofactor, it must be charged, and it is the price of
        making the concentration row provable.
    - metric: discrepancy_of_the_acceptance_matrix_versus_random_prediction
      direction: different
      minimum_effect: >-
        Predicted to match the random prediction within a polylog factor above
        the threshold. A discrepancy materially BELOW the random prediction would
        mean the matrix has exploitable structure and inverts the record into a
        positive route.
    - metric: log_interval_control_discrepancy
      direction: lower
      minimum_effect: >-
        Forced, maximally deficient. If the argument reports the control as
        pseudorandom it proves too much and is void.
  minimal_test:
    design: >-
      LITERATURE EXTRACTION AND SYMBOLIC AUDIT, zero runs, inside the RQ claim
      boundary. Step 1, fetch the Shparlinski 2008 and Ahmadi-Shparlinski
      bilinear character sum papers and record their EXACT theorem statements,
      namely the sum bounded, the hypotheses on |U| and |V|, the curve hypotheses
      such as ordinary, supersingular, or prime order, and the exact bound.
      Step 2, substitute |U| = |V| = N^(1/3) with N about p and record whether
      the bound is nontrivial; if not, solve for the threshold T(p) at which it
      becomes nontrivial and report it as the headline number. Step 3, derive the
      density of x^{-1}(H) with an explicit error term from a curve character
      sum, at L = 2 first as the baseline slice and then at general L dividing
      p-1. Step 4, write the discrepancy-to-rectangle argument explicitly,
      stating precisely which class of joins it constrains, and run it on the
      log-interval known-log control, where it MUST fail. Step 5, record in
      knowledge/literature one KN-LIT entry per fetched paper with its exact
      statement and its threshold, marked verified or unverified per what was
      actually read. A later, separately authorized toy run could measure the
      empirical discrepancy against the extracted bound; that run is not proposed
      here.
    controls:
      - >-
        Baseline slice L = 2, the quadratic residues, where the analytic
        statements are classical and must come out right.
      - >-
        Proves-too-much control, the log-interval key on Z/N with known
        logarithms. The discrepancy argument must fail on it.
      - >-
        Proves-too-much control, composite order with a subgroup accepted set.
        The argument must fail there too.
      - >-
        Same-density control, K-EC-XINTERVAL-1 at density 1/L, which the analytic
        machinery must be shown NOT to cover, establishing that the two sets are
        genuinely different objects.
      - >-
        Curve-hypothesis control, if the cited bounds require ordinary curves or
        exclude small j-invariants, the excluded families must be listed rather
        than ignored.
      - Mandatory Pareto rows, Pollard rho and BSGS.
    required_metrics:
      - exact_theorem_statement_and_hypotheses_of_each_fetched_bilinear_bound
      - threshold_list_length_T_of_p_for_nontriviality
      - whether_that_threshold_is_at_or_below_N_to_the_one_third
      - explicit_error_term_in_the_density_of_x_inverse_of_H
      - key_evaluation_cost_in_field_multiplications
      - the_exact_join_class_constrained_by_the_discrepancy_argument
      - control_outcomes_on_the_two_proves_too_much_objects
  falsification_conditions:
    - >-
      The cited bilinear bounds do not apply to arbitrary point sets, or require
      curve hypotheses excluding prime-order prime-field curves. The whole
      analytic route is then unavailable and must be reported as such.
    - >-
      The extracted threshold T(p) exceeds N^(1/3) by a positive power. Then
      NEITHER side of the claim is available at the parameters this lane cares
      about, and the record's deliverable reduces to a boundary, which is still a
      result and must be published as a scoped negative.
    - >-
      The density of x^{-1}(H) has a relative error that is not o(1) at
      L = N^(1/3), so the accepted set does not have a usable density at the
      required index.
    - >-
      The discrepancy-to-rectangle argument also excludes the log-interval
      known-log join. That proves too much and the argument is void until
      repaired.
    - >-
      The L = 2 baseline slice does not come out classically, showing the
      extraction is wrong.
    - >-
      The exponentiation-based key evaluation, once charged, moves the family's
      position on the IDEA-20260829-3f0f4b surface by more than a polylog factor.
      The key would then be paying an exponent for its provability, which changes
      the trade.
  confounders:
    - >-
      L must divide p-1, so curves and primes satisfying that are a restricted
      family and any result is scoped to it. Reporting a general-curve conclusion
      from that family would be a scope error.
    - >-
      Since x(-R) = x(R), D_chi is automatically sign-closed, which changes
      constants relative to K-EC-XINTERVAL-1 and must not be silently reused.
    - >-
      Character-sum error terms often carry p^(1/2) factors that are harmless in
      equidistribution statements and fatal at density 1/L. The error must be
      compared against 1/L, not against 1.
    - >-
      A discrepancy bound constrains rectangle covers, not all algorithms.
      Treating it as a general lower bound would repeat exactly the scope error
      that IDEA-20260823-69a3a0 was careful to avoid for ST-EVR.
    - >-
      Points at infinity and the exceptional x = 0 case must be assigned
      explicitly, as they were in the frozen K-EC-XINTERVAL-1 convention.
    - >-
      My recollection of the SHAPE of these bounds may be wrong in a way that
      flatters the record. The extraction step exists precisely to catch that,
      and a mismatch must be reported as a correction to this record rather than
      absorbed.
  interpretation_limits:
    - >-
      Every bilinear-character-sum citation in this record is recalled and NOT
      fetched in this session; two fetch attempts failed, since Semantic Scholar
      returned no content and the Macquarie portal returned HTTP 403. Nothing
      analytic here is established.
    - Zero runs, no implementation, no curve generation, no ECDLP result.
    - >-
      A proved concentration row does not produce an attack. It discharges one
      certificate row and leaves the enumeration row exactly where B64-DER-2 left
      it.
    - >-
      A discrepancy-based exclusion would close one key for one join class. It is
      not an ECDLP lower bound and not a lane closure.
    - >-
      The positive and negative sides are in tension by construction. A reader
      must not take the positive framing as evidence for a route while the
      negative side is unresolved.
  heuristic_assumptions:
    - id: H1
      statement: >-
        SUBGROUP ACCEPTED-SET EQUIDISTRIBUTION. For E over F_p with prime order N
        and L dividing p-1, the set D_chi = x^{-1}(H) with H the set of L-th
        powers satisfies |D_chi| = 2p/L + O(p^(1/2) log p), and for the pair sums
        of arbitrary point sets U and V the acceptance rate is 1/L + o(1/L) once
        |U|*|V| exceeds a threshold T(p)^2. This imitates the classical
        Weil-bound-driven equidistribution of multiplicative characters of a
        non-constant rational function along the points of a curve, and it is the
        exact analogue of what the Dickman-de Bruijn law is for smoothness
        heuristics, namely a distribution theorem standing in for a
        hard-to-verify empirical claim.
      rigorous_support: >-
        The size estimate is a standard consequence of Weil-type character sum
        bounds over curves and is expected to be RIGOROUS once the exact
        statement is extracted. The uniform acceptance rate for ARBITRARY U and V
        is NOT rigorous below the threshold and is exactly what the bilinear
        bounds are needed for.
      validation_plan: >-
        Two routes. Analytic, extract the exact error term from the fetched
        sources and check it against 1/L at L = N^(1/3). Empirical, separately
        authorized and not requested here, at 24 <= log2 N <= 34 over at least 8
        curves with L dividing p-1, compute the exact count |x^{-1}(H)| by
        exhaustive enumeration and compare the empirical relative error against
        the predicted p^(-1/2) log p; and compute the empirical acceptance rate
        over random list pairs, comparing its empirical CDF against the predicted
        binomial with rate 1/L. Tail check, report the most extreme observed
        acceptance rate across all cells against the predicted binomial tail.
        Sampled parameters p, curve, L, and list seeds recorded per cell.
        Transfer assumption, the empirical route can only refute the error term
        at toy scale and cannot confirm the threshold, which is an asymptotic
        statement.
    - id: H2
      statement: >-
        DISCREPANCY-TO-JOIN TRANSFER. If the acceptance matrix M[i][j], the
        indicator that chi(x(R_i+S_j)) equals 1, has cut-norm discrepancy within
        a polylog factor of the random prediction, then every join that is a
        cover of the 1-set of M by combinatorial rectangles drawn from a
        predeclared family has cost Omega(L^(2-o(1))). This imitates the standard
        discrepancy lower bounds for deterministic communication and for
        near-monochromatic rectangle covers.
      rigorous_support: >-
        The discrepancy-to-rectangle-size implication is standard in spirit. The
        exact form needed here, covering the 1-set rather than approximating the
        whole matrix, with a predeclared rather than instance-chosen family, is
        NOT verified and is the argument's weakest joint. It is the same joint
        that IDEA-20260829-390ccc attacks by a completely different, additive
        route, which is why the two records are worth running in parallel, since
        an agreement between an additive and an analytic derivation is much
        stronger evidence than either alone.
      validation_plan: >-
        Symbolic only. State the implication with explicit constants and run it
        on the two proves-too-much controls, where it MUST fail. If it does not
        fail on the log-interval control, H2 as stated is false and must be
        weakened until it does.
  target_complexity:
    time_exponent: >-
      No speedup is claimed. Positive side, it does not move the exponent at all;
      it moves one certificate row from heuristic to proved, at the price of a
      log p cofactor in the key evaluation. Negative side, it would establish
      gamma at least 2 - o(1) for rectangle-cover joins on D_chi, which by the
      IDEA-20260829-3f0f4b surface pins that key at N^max(2*(2-s)/4, s/2) with
      s = 2/3, that is N^max(2/3, 1/3) = N^(2/3), strictly worse than rho,
      closing the key.
    memory_exponent: >-
      N^(1/3) at s = 2/3, unchanged from the rest of the family, plus O(log p)
      words of exponentiation state per evaluation. No memory improvement.
    best_known: >-
      Pollard rho at N^(1/2+o(1)) time and O(1) memory; BSGS at N^(1/2) time and
      memory; van Oorschot-Wiener total work N^(1/2).
    hidden_overhead: >-
      Honest disclosure. The key evaluation is O(log p) field multiplications,
      not O(1), so at gamma = 1 the o(1) would hide a genuine log p factor per
      list element per level. At list length N^(1/3) with log p about 256 that is
      a large constant, and it must be reported in operation counts, never
      absorbed. Additionally, the requirement that L divides p-1 restricts the
      curve family and that restriction is not an o(1), since it is a scope
      limit.
    tradeoff_note: >-
      This record does not move the family's time-memory position; it changes
      what is provable at a fixed position. If the negative side succeeds, the
      key is pinned at (T,M) = (N^(2/3), N^(1/3)), strictly dominated by Pollard
      rho on both axes, which is the honest reading of a successful closure.
  dominated_by: >-
    Dominated by Pollard rho, at N^(1/2+o(1)) time and O(1) memory, on both axes.
    The same twelve frontier rows enumerated in IDEA-20260829-390ccc were checked
    individually with identical verdicts; no row changes applicability because
    this record proposes no algorithm and no advice. On the positive side the
    record's realized delta as an attack is zero, so rho dominates trivially. On
    the negative side the object being closed is pinned at
    (N^(2/3), N^(1/3)), which rho dominates on both axes.
  sota_delta: >-
    Realized cryptanalytic delta is 0. Quantitative deliverable, a single number,
    the threshold list length T(p) at which the cited bilinear elliptic-curve
    character sum bounds become nontrivial, together with a yes or no on whether
    T(p) is at most N^(1/3). Static delta versus the current state, H-COND-FLAT
    and B64-DER-4 currently record no rigorous support presently known for the
    concentration row; a successful positive side would replace that with an
    explicit error term and, crucially, would hold for ADVERSARIAL rather than
    iid-uniform lists, a strictly stronger quantifier than anything in the lane.
    A successful negative side would move B64-DER-2's quantifier from supplied
    enumerators to all predeclared rectangle-cover joins on D_chi, via a route
    entirely independent of IDEA-20260829-390ccc's additive one.
  estimated_cost:
    implementation: none; zero code
    compute: >-
      Zero runs. The cost is one literature-extraction session covering four
      papers plus one symbolic audit.
