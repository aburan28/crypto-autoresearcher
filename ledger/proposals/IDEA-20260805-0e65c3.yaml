idea:
  id: IDEA-20260805-0e65c3
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-001
  added: '2026-08-05'
  title: >-
    What could the screen see? A sensitivity audit of the instrument that
    produced GOAL-MLKEM-001's "no mechanism found": every positive it ever
    returned was handed to it, and its demonstrated discovery rate on the other
    67 papers is 0 out of 67

  class: control

  claim: >-
    GOAL-MLKEM-001 closed at budget with the sentence "The campaign never
    reached a cryptanalytic mechanism". The instrument that licenses that
    sentence is a literature screen whose complete transcript is committed in
    this repository: 69 supplied ePrint identifiers, 69 screened, 2 classified
    direct-ML-KEM-claim-changing, 6 adjacent methodology, 1 pedagogical, 60
    irrelevant. READ THE TRANSCRIPT AND THE TWO POSITIVES DISSOLVE: both
    2026/1022 and 2026/1465 are recorded in the same file as
    "already_delegated_to_sibling", assigned by the Coordinator to full-text
    tasks TASK-20260723-213 and TASK-20260723-214 BEFORE the screen ran, and the
    screen's own summary says so in its own words -- "Beyond the two already
    delegated papers, 2026/1022 and 2026/1465, no supplied item changes the
    current ML-KEM research map at triage depth." So the screen's demonstrated
    ability to DISCOVER a lead it was not told about is 0 successes out of 67
    unassigned papers, and its ability to discover one has never been
    demonstrated at all. This is the exact failure mode KN-TECH-1a5b7e catalogues
    -- a control that passes without being able to fail -- transposed from a
    measurement to a literature screen, and it is load-bearing for a terminal
    goal status. The audit is cheap, has a derived null, and has a positive
    control that can genuinely fail: plant papers of known relevance into the
    same screen and measure recall. Under a null screen flagging at the observed
    base rate 9/69 = 0.130, recovering two planted positives has probability
    0.017, so a 2-of-2 recall is already a 1.7-per-cent-level result and a 0-of-2
    recall says the 60 exclusions carry no information about ML-KEM whatsoever.

  object_first_candidate:
    tracked_object: >-
      THE SCREEN AS A FUNCTION. The decision map S: (paper record at abstract
      depth) -> {claim_changing, adjacent, pedagogy, irrelevant}, followed
      through the 69 inputs it actually consumed, with its recall on known
      positives as the tracked quantity. Not the papers, not ML-KEM, not any
      attack: the instrument. This program has audited its measurement
      instruments (nulls, controls, estimators) and has never once audited the
      instrument that decides what enters the search at all.
    established_families_off_limits: >-
      Off-limits as the primary lens: every attack family, and also every
      literature-summary move that would have this record assert what a paper
      says. This proposal reads exactly one class of source -- committed in-repo
      transcripts -- and makes claims only about them.
    newness_score: >-
      No technique is claimed; recall-against-planted-positives is standard
      instrument validation. What is new here is the target. The session's own
      corpus-wide measurements say every novelty screen in this program is
      discounted (7,809 literature entries, 7,420 carrying a bulk-seed caveat,
      2,000 of 2,000 sampled asserting citation_verified: read while their own
      body says the claims are relayed unverified), and yet no record anywhere
      measures a screen's recall. This is the first.
    testability_score: >-
      The zero-compute half is decisive on its own: the transcript records, per
      item, a `verification` field and a `reason`, so the basis of every one of
      the 69 dispositions can be classified without running anything. The re-run
      half needs an independent screening session and network access to abstract
      pages, and its unavailability is an infrastructure outcome.
    survival_score: >-
      The object survives exactly as far as the transcript records its own
      basis. Where the transcript records only "primary_record_and_abstract_checked"
      the object degenerates to "an abstract was read", and that degeneration is
      itself the measurement.

  mechanism: >-
    DERIVED IN THIS RECORD from a transcript READ THIS SESSION:
    coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-215/triage_report.yaml.

    THE COUNTS, QUOTED. summary: direct_ml_kem_claim_changing: 2;
    adjacent_methodology: 6; background_pedagogy: 1; irrelevant: 60; total
    supplied_count 69, screened_count 69. The `deepened` list has 9 entries. Of
    those 9, three are prior or assigned knowledge: 2026/1022 ("basis: primary
    record plus Coordinator-assigned full-text sibling task TASK-20260723-213"),
    2026/1465 ("basis: primary record plus Coordinator-assigned full-text sibling
    task TASK-20260723-214"), and 2026/155 ("Already reviewed in BATCH-002"). The
    remaining six -- 2026/1098, 2026/026, 2026/1462, 2026/1467, 2026/1468,
    2026/1448 -- were deepened on the screen's own initiative and every one was
    classified NOT claim-changing, their recorded bases being of the form
    "targeted search confirming an AES-only application" and "targeted search
    confirming randomized-Dilithium scope".

    THE DERIVED QUANTITIES.
      Assigned positives: 2. Self-discovered positives: 0.
      Unassigned papers: 69 - 2 = 67.
      Demonstrated discovery rate on unassigned papers: 0/67.
      Demonstrated recall on known positives: UNDEFINED, not 2/2 -- the two
      positives were inputs to the screen's task description, not outputs of its
      judgement. A control that is told the answer has not been tested.
      Self-directed deepening rate: 6/67 = 0.0896.
      Overall deepening base rate: 9/69 = 0.1304.

    THE NULL, DERIVED BEFORE ANY RE-RUN. Model a null screen as one that deepens
    a paper independently with probability p = 9/69 = 0.1304 and finds a lead
    only among deepened papers. Then the probability that a null screen flags
    both members of a planted pair is p^2 = 0.01701, and the probability it flags
    at least one is 1 - (1 - p)^2 = 0.2438. THEREFORE: a re-run screen that
    recovers 2 of 2 planted positives beats the null at the 1.7 per cent level,
    which is a real if modest sensitivity demonstration; one that recovers 1 of 2
    is indistinguishable from the null; one that recovers 0 of 2 establishes that
    the instrument cannot see leads of the planted kind, and every one of the 60
    "irrelevant" dispositions then carries zero information about ML-KEM. All
    three outcomes are pre-declared usable, which is what makes this a control
    rather than a complaint.

    THE PLANTED POSITIVES, CHOSEN SO THEY CAN FAIL. The plant must be a paper
    whose ML-KEM relevance is established INDEPENDENTLY of the screen and whose
    abstract does not announce that relevance in the screen's own vocabulary --
    otherwise the control cannot fail. Two candidate classes, both available
    without asserting anything about an unread paper: (a) the two known leads
    themselves, re-presented WITHOUT the delegation annotation and shuffled into
    a fresh list, which tests whether the screen would have found them
    unprompted -- the single most direct test available and the cheapest;
    (b) papers whose relevance is established by a committed internal record
    rather than by their own abstract. Class (a) is the primary plant precisely
    because its ground truth is already committed and requires no new claim about
    any paper's contents.

    WHY THE ZERO-COMPUTE HALF IS ALREADY DECISIVE ABOUT SOMETHING. Independently
    of any re-run, the transcript's per-item `verification` field can be
    tabulated. If, as the sampled items suggest, the overwhelming majority read
    "primary_record_and_abstract_checked", then the 60 exclusions are exclusions
    AT ABSTRACT DEPTH -- and EV-MLKEM-003's own boundaries field already says
    what that means, in the campaign's own words: "Abstract-only exclusions are
    triage dispositions, not durable negative evidence." The corpus therefore
    already contains the sentence that limits its own screen, and the closure
    that followed did not carry it. Making the tabulation explicit converts a
    boundary sentence nobody applied into a number.

    WHAT THIS IS NOT. It is not a claim that any of the 60 papers contains an
    ML-KEM lead. No paper's contents are asserted anywhere in this record. It is
    a claim about what the screen's transcript demonstrates about the screen.

  novelty_status: unverified

  literature_context:
    - >-
      coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-215/triage_report.yaml,
      READ THIS SESSION (schema, method, classification_legend, summary,
      claim_changing_follow_ups, special_handling, and a sample of the items
      list). Every count and every quoted sentence above comes from it.
    - >-
      ledger/evidence/EV-MLKEM-003.yaml, READ: observations include "Of 69
      supplied papers, two were full-text ML-KEM leads, six were adjacent
      methodology, one was pedagogical, and 60 yielded no further lead at
      abstract-triage depth", and boundaries include "Abstract-only exclusions
      are triage dispositions, not durable negative evidence." The audit does not
      contradict this record; it takes its boundary sentence seriously and
      measures the consequence.
    - >-
      ledger/decisions/DEC-20260724-019, READ: the closing decision, whose
      honest_summary states "It did not find one, and it did not come close."
      That sentence rests, for the literature half of the search, on the screen
      audited here. The audit does not dispute the sentence; it asks what
      evidential weight the screen can bear.
    - >-
      THE 69 PAPERS THEMSELVES ARE NOT READ. Not one of them. This record
      asserts nothing about the contents of 2026/1022, 2026/1465, 2026/155,
      2026/1098, 2026/026, 2026/1462, 2026/1467, 2026/1468, 2026/1448 or any of
      the other sixty. Every statement is about the transcript.
    - >-
      RETRIEVAL ENDPOINT STATUS, relayed from this session's scouting brief and
      to be re-measured at stage 2 rather than assumed: ePrint ABSTRACT pages
      return 200 while eprint.iacr.org PDF bodies return 403. A re-run screen at
      abstract depth is therefore probably feasible; a re-run at full-text depth
      probably is not, and the audit must report which depth it achieved.

  lossy_projection_identifiability_audit:
    projection: >-
      (a paper: its full text, its results, its true bearing on ML-KEM) --> (its
      abstract and title) --> (a four-way class label).
    what_is_discarded: >-
      The entire body of the paper, and then all but two bits of the abstract.
    why_genuinely_lossy: >-
      Enormously lossy, and unlike most projections in this program the loss is
      not a design choice but a budget constraint. The fibre over "irrelevant"
      contains both papers with no ML-KEM bearing and papers whose bearing is
      stated only in section 5. THE AUDIT'S ENTIRE PURPOSE IS TO MEASURE THE
      SIZE OF THAT FIBRE, which is what recall against planted positives does.
    why_compatible_with_the_operations: >-
      Compatible in the operational sense that the label propagates
      deterministically into the campaign's next decision -- a paper labelled
      irrelevant is never read again -- which is precisely why an
      unmeasured-recall label is dangerous rather than merely lossy.
    is_it_only_a_change_of_coordinates: >-
      NO -- it discards nearly everything and nothing is recoverable. FAILURE
      MODE CHECKED FOR: the mirror failure, a projection so lossy it is constant
      across instances. IT NEARLY FIRES AND THAT IS THE FINDING: the screen
      returned "irrelevant" on 60 of 69, "adjacent" on 6, "pedagogy" on 1, and
      "claim-changing" on exactly the 2 it was handed. Comparator spread on the
      one class that matters is ZERO -- no unassigned input ever produced a
      positive. A statistic whose spread on the decisive class is zero is a
      constant of the apparatus, which is the tell KN-TECH-1a5b7e names
      mechanically. The audit's job is to determine whether the spread is zero
      because the input contained no positives or because the instrument cannot
      emit one.

  assumptions:
    - >-
      That the transcript faithfully records how the screen operated -- in
      particular that the `deepened` list is complete and that
      "already_delegated_to_sibling" means what it says. If the screen
      independently identified the two papers and the delegation annotation was
      added afterwards, the demonstrated discovery rate is 2/67 rather than
      0/67, and the audit's headline weakens substantially. THIS IS THE MOST
      LIKELY SINGLE FAILURE OF THE PROPOSAL and stage 1 must test it by checking
      the handoff and dispatch records for the timing of TASK-20260723-213 and
      -214 relative to TASK-20260723-215.
    - >-
      That recall on planted positives is a meaningful proxy for recall on real
      leads. It is an imperfect proxy and is declared as one: a plant drawn from
      the known positives is easier than an unknown lead, so measured recall is
      an UPPER BOUND on true recall. A low measured recall is therefore strong
      evidence; a high one is weak evidence, and the record must state the
      asymmetry wherever it reports the number.

  proof_search_map_note: >-
    Not proof-oriented: no theorem, bound, certificate family, reduction or
    closure argument is proposed, so inventor-protocol section 8 does not
    require a filled map. The reason is recorded rather than the field silently
    omitted. The one quantifier point worth stating explicitly is the audit's
    own: the claim is FOR THIS SCREEN, ON THIS INPUT LIST, AT THIS DEPTH -- not
    for literature screening in general, and not for any other campaign's screen.

  predictions:
    - metric: >-
        abstract_depth_exclusion_fraction: the fraction of the 60 "irrelevant"
        items whose recorded `verification` field indicates abstract-depth
        checking only
      direction: higher
      minimum_effect: >-
        >= 0.90, predicted from the sampled items before tabulation. If it comes
        out below 0.5 the transcript records deeper checking than sampling
        suggested and the audit's premise weakens; that would be a genuine and
        welcome falsification.
    - metric: >-
        self_discovered_positive_count: number of items classified
        direct_ml_kem_claim_changing whose recorded basis does NOT reference a
        prior Coordinator assignment or a prior batch
      direction: lower
      minimum_effect: >-
        EXACTLY 0, derived from the transcript this session and pre-registered.
        Any value >= 1 falsifies the headline and the record is corrected by
        supersession.
    - metric: >-
        null_screen_double_flag_probability: p^2 with p = 9/69
      direction: different
      minimum_effect: >-
        EXACTLY 0.01701 (and 1 - (1-p)^2 = 0.2438 for at least one). Computed
        this session; pre-registered so that any re-run's recall can be read
        against it without post hoc choice of a threshold.
    - metric: >-
        replant_recall: number of planted positives recovered by an independent
        re-run screen at abstract depth, out of the planted count
      direction: higher
      minimum_effect: >-
        NO VALUE PREDICTED -- this is the quantity being measured. The DECISION
        RULE is frozen here: recall of all plants supports the instrument and the
        60 exclusions retain their weight; recall of none establishes that the
        exclusions carry no ML-KEM information and the closure's literature half
        must be rescoped; partial recall is reported as indeterminate at this
        plant count, with the plant count named.
    - metric: >-
        assignment_timing_check: whether TASK-20260723-213 and TASK-20260723-214
        were dispatched before TASK-20260723-215
      direction: different
      minimum_effect: >-
        Binary, from the committed dispatch queue and handoff records. If the
        siblings were dispatched AFTER the screen, the delegation annotation is
        retrospective, the discovery rate is 2/67, and the proposal's headline is
        substantially wrong. This check costs minutes and is ordered first for
        exactly that reason.

  minimal_test:
    design: >-
      Three stages, cheapest first, and STAGE 1 CAN END THE LINE.
      STAGE 1 (zero compute, ~45 min, DECISIVE AGAINST THE PROPOSAL): check the
      assignment timing from committed dispatch and handoff records. If the
      siblings postdate the screen, report that, withdraw the headline, and stop.
      STAGE 2 (zero compute, ~1 h): tabulate all 69 items by class and by the
      recorded `verification` basis; compute the five derived quantities above;
      compute the null probabilities.
      STAGE 3 (infrastructure-gated, independent session): re-run the screen on
      a shuffled list containing the plants, at abstract depth, in a session that
      has not read the original transcript, and measure recall. Network
      unavailability, or inability to obtain an independent session, is an
      INFRASTRUCTURE OUTCOME and is never evidence about the screen or about
      ML-KEM (AGENTS.md rule 5).
    controls:
      - >-
        NULL OBJECT, THE SHUFFLED-LABEL SCREEN (same shape, can fail). Present
        the re-run screen with a list in which the plants are replaced by papers
        drawn from the same source distribution and known -- from the original
        transcript -- to have been classified irrelevant. FORCED VALUE DERIVED
        BEFORE THE RUN: the re-run must classify these as irrelevant too. If it
        flags them as claim-changing at a rate near the plant recall, the screen
        is not discriminating, it is flagging, and its positives mean nothing.
        This null CAN fail and its failure is more informative than its success.
      - >-
        POSITIVE CONTROL, THE UNAMBIGUOUS PLANT (the effect MUST appear). Include
        at least one item whose ML-KEM relevance is stated in its own title in
        the screen's own vocabulary. If the screen misses THAT, the instrument is
        broken and NO conclusion of any kind -- positive or negative -- may be
        drawn from stage 3.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. Grade the
        plants by how explicitly their titles and abstracts announce ML-KEM
        relevance: (i) named in the title, (ii) named in the abstract only,
        (iii) implied by a technique name only, (iv) relevant only via a body
        result recorded internally. Report recall at each level. Recall must
        decrease monotonically from (i) to (iv); if it does not, the screen is
        responding to something other than stated relevance and the audit has
        localised what.
      - >-
        ORDERING CONTROL. The null arm and the positive control are scored and
        hash-committed before the plant recall is read, and the frozen decision
        rule is executed on the null first.
      - >-
        ARCHIVE CHECK (zero compute). Enumerate every prior recall measurement of
        any literature screen in this corpus. Recorded expectation from this
        session's reading: none exists. Reported as an absence, never as a passed
        check.
    required_metrics:
      - the 69-item tabulation by class and by recorded verification basis
      - self_discovered_positive_count with the basis text quoted per positive
      - the assignment-timing finding with the records consulted
      - null probabilities p, p^2, 1-(1-p)^2 with p stated
      - stage-3 recall per graded level, plant count, and the session's
        independence attested
      - the endpoint and status code obtained for each abstract fetched

  falsification_conditions:
    - >-
      The dispatch records show TASK-20260723-213/-214 were created after
      TASK-20260723-215. The two positives were then self-discovered, the
      demonstrated discovery rate is 2/67, and the headline is withdrawn.
    - >-
      The tabulation shows most exclusions rest on more than abstract depth. The
      "abstract-only" framing is then wrong and the exclusions carry more weight
      than the proposal allows.
    - >-
      The positive control is missed in stage 3. Nothing may be reported.
    - >-
      The re-run recovers every plant including the level-(iv) ones. The screen
      is then demonstrably sensitive, the 60 exclusions retain their weight, and
      this proposal's suspicion is refuted -- an outcome that would strengthen
      DEC-20260724-019 rather than weaken it, and one the audit must report with
      the same emphasis as the opposite.

  confounders:
    - >-
      A RE-RUN IS NOT THE SAME INSTRUMENT. A different session, a different
      model, a different date, and different ePrint revisions all differ from
      the 2026-07-23 run. Stage 3 therefore measures the recall of a SCREEN OF
      THE SAME SHAPE, not of the historical screen, and every sentence citing it
      must say so. Stage 2, by contrast, measures the historical transcript
      directly and does not have this confounder.
    - >-
      PLANT LEAKAGE. If the re-run session can see the original transcript, the
      recall is meaningless. Independence must be attested, not assumed, and the
      attestation must name what the session was and was not given.
    - >-
      UPPER-BOUND ASYMMETRY. Plants drawn from known positives are easier than
      real leads, so measured recall over-estimates true recall. High recall is
      therefore weak evidence and low recall is strong; the record must carry
      that asymmetry at every citation.
    - >-
      AUDITING A CLOSURE IS CHEAP AND FLATTERING. Questioning a terminal status
      costs less than earning one. The positive control, the shuffled-label null
      and the pre-registered falsification branch that STRENGTHENS the closure
      exist so that the suspicious reading has to be earned.

  interpretation_limits:
    - >-
      NO PAPER'S CONTENTS ARE ASSERTED, ANYWHERE. Nothing here says any of the
      60 excluded papers contains an ML-KEM lead, and no future record may cite
      this one as evidence that one does.
    - >-
      NO STATUS CHANGE to GOAL-MLKEM-001, DEC-20260724-019, EV-MLKEM-003 or the
      triage transcript is proposed or implied. GOAL-MLKEM-001 is closed at
      budget; the audit bears on what its closure's literature half can be cited
      for, and any change is a Coordinator decision recorded in a new record.
    - >-
      The audit is scoped to ONE screen, ONE input list of 69 items, ONE date,
      and ONE depth. It says nothing about literature screening in this program
      generally, though the corpus-wide screen statistics recorded in this
      session's brief suggest the question generalises, and naming that as a
      question is the forward guidance, not a finding.
    - >-
      Claim tier: derivation for stage 2 (arithmetic on a committed transcript);
      for stage 3, whatever tier an independent screening session supports, which
      is at most preliminary.

  heuristic_assumptions:
    - id: H1
      statement: >-
        A screen that flags papers independently with probability p = 9/69
        provides the correct null for recall on planted positives.
      random_model_justification: >-
        Independence across items is the natural null for a screen that reads
        one abstract at a time with no cross-item state, and p is estimated from
        the screen's own deepening rate on its own input. The model is crude in
        one identified direction: real screens correlate across items through a
        shared prior about the list's provenance, which would RAISE the null's
        double-flag probability and make a 2-of-2 recall less impressive. That
        direction is conservative for the audit's negative conclusion and
        anti-conservative for its positive one, and the record must say so.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        The shuffled-label null arm flags known-irrelevant items at a rate
        materially above p. The independence null is then wrong and the
        significance calculation must be redone with the measured rate.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NO ATTACK IS PROPOSED. Stated plainly rather than
      dressed up. This proposal is a measurement of an instrument. Its worth is
      that the instrument's output is currently load-bearing for a terminal goal
      status and for the sentence "it did not come close", and that a 0-of-67
      demonstrated discovery rate is the kind of fact that decides whether a
      successor goal should re-screen the same 60 papers at greater depth or
      spend its budget elsewhere. That is a budget-allocation result, and for a
      goal that died of budget it is the relevant kind.
    memory_exponent: n/a.
    best_known: n/a; the object is a screen, not an algorithm.
    hidden_overhead: >-
      The audit's own hidden cost is the independent session required by stage 3,
      which is the scarce resource here rather than compute.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed, no attack proposed, no cost point occupied). ROWS
    CHECKED for something that already supplies this measurement: the corpus was
    searched this session for any prior recall or sensitivity measurement of a
    literature screen and none was found; the ML-KEM cost frontier is irrelevant
    to this object and is named here only to record that it was considered and
    is not a comparator -- an audit of a screen occupies no point on a
    time/memory/data frontier at all. Absence of a search result is not evidence
    that no such measurement exists (AGENTS.md retrieval policy), so
    novelty_status stays unverified.
  sota_delta: >-
    No attack; instrument-measurement contribution only. Quantitatively the
    zero-compute deliverable is already fixed: self-discovered positives 0 out
    of 67 unassigned papers; self-directed deepening 6 of 67 with 0 positives;
    null double-flag probability 0.01701. The stage-3 deliverable is a recall
    number where the corpus currently has none.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.80 that the headline survives stage 1, i.e. that the two positives really
    were assigned before the screen ran. It is that high because the transcript
    says so in three separate places (the `deepened` bases, the
    claim_changing_follow_ups statuses, and the summary sentence "Beyond the two
    already delegated papers"), and it is not higher because all three are the
    same author's account of its own task and none is a dispatch record. It is
    the cheapest thing in the proposal to check, which is why it is stage 1.
    Separately: 0.60 that stage 3 runs at all, because it needs both network
    access to abstract pages and a genuinely independent session, and 0.35 that
    a re-run screen recovers all graded plant levels -- a number this record
    states as its expectation while insisting the measurement, not the
    expectation, is the deliverable. This proposal is the weakest of the four
    filed under this goal today, and its weakness is named in
    self_critique terms here rather than left for a reviewer: it audits a
    process rather than a mechanism, and its stage-3 measurement is of a
    same-shaped instrument rather than of the historical one.
