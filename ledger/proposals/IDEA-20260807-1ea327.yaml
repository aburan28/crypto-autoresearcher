idea:
  id: IDEA-20260807-1ea327
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    THE SUMMATION-POLYNOMIAL SIDE, NOT THE FACTOR-BASE SIDE: rewrite the j = 0
    decomposition system in the mu_3-INVARIANT coordinate u = x^3, where the
    factor-base membership polynomial drops from degree 3m to degree m and the
    summation polynomial is replaced by its NORM, and measure whether the norm's
    degree inflation (bidegree (6,6) against (2,2)) exactly cancels the
    9-fold candidate-count deflation or leaves a net Groebner saving
  class: representation

  claim: >-
    (A) THE INVARIANT RING, EXACTLY. For E/F_p with j = 0, i.e. a = 0 and
    E : y^2 = x^3 + b with p = 1 mod 3, the automorphism phi(x, y) =
    (zeta_3 x, y) acts on the x-line as the linear mu_3-action x -> zeta_3 x.
    The invariant ring of that action is
      F_p[x]^{mu_3} = F_p[u],   u = x^3,
    a POLYNOMIAL ring in one variable, and the quotient map x -> u is 3-to-1
    away from x = 0. Nothing subtler is needed: mu_3 acts by scalars on a
    one-dimensional space, so the invariant ring is generated by the single
    element x^3 and the isotypic grading is by degree mod 3.

    (B) THE MEMBERSHIP DEGREE COLLAPSES, EXACTLY. Let V be a union of m
    phi-orbits, |V| = 3m, with orbit representatives x_1, ..., x_m and
    u_j = x_j^3. The factor-base membership polynomial factors:
      f_V(x) = prod_{v in V} (x - v) = prod_{j=1}^{m} (x^3 - u_j) = g(u),
      g(T) = prod_{j=1}^{m} (T - u_j),   deg g = m.
    So the constraint "x_i lies in a factor base of size 3m" is a degree-m
    equation in u_i instead of a degree-3m equation in x_i. This is exact, not
    heuristic, and it is the entire reason the reformulation is worth measuring.

    (C) THE SUMMATION POLYNOMIAL IS A RELATIVE INVARIANT, EXACTLY, AND ONLY
    WHEN a = 0. For y^2 = x^3 + a x + b,
      S_3(x1,x2,x3) = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
                      + ((x1 x2 - a)^2 - 4 b (x1+x2)).
    Setting a = 0 and grouping by total degree in (x1,x2,x3):
      (x1-x2)^2 x3^2                 -> total degree 4
      -2 (x1+x2) x1 x2 x3            -> total degree 4
      -4 b x3                        -> total degree 1
      (x1 x2)^2                      -> total degree 4
      -4 b (x1+x2)                   -> total degree 1
    EVERY monomial has total degree congruent to 1 mod 3, hence
      S_3(zeta x1, zeta x2, zeta x3) = zeta * S_3(x1, x2, x3):
    S_3 is a relative invariant of weight 1 for the diagonal mu_3-action. When
    a != 0 the extra terms -2a(x1+x2)x3 (total degree 3), -2a x1 x2 (degree 2)
    and a^2 (degree 0) appear and the congruence fails, so the weight-1
    semi-invariance holds IF AND ONLY IF a = 0. That biconditional is what makes
    a matched null available (see null_object_control).

    (D) THE NORM, AND THE THREE ENCODINGS WITH THEIR EXACT DEGREES. Fix the
    target x_R. Because a decomposition of phi^c(R) over V is as useful as a
    decomposition of R (it is one usable equation either way; see the relation
    arithmetic in (F)), the decomposition condition to test is
      EXISTS (c1, c2) in (Z/3)^2 : S_3(zeta^{c1} x1, zeta^{c2} x2, x_R) = 0.
    Three encodings express it:
      ENC-X   (the incumbent):  {S_3(x1,x2,x_R) = 0, f_V(x1) = 0, f_V(x2) = 0};
              bidegree (2,2) in (x1,x2); candidate count (3m)^2 = 9 m^2.
      ENC-ASYM: T_rel(u1, x2) = prod_{d in Z/3} S_3(zeta^d x1, x2, x_R), which
              is mu_3-invariant in x1 and hence lies in F_p[u1, x2] with
              deg_{u1} = 2 and deg_{x2} = 6; system
              {T_rel(u1,x2) = 0, g(u1) = 0, f_V(x2) = 0};
              candidate count m * 3m = 3 m^2.
      ENC-SYM: T(u1,u2) = prod_{(c1,c2) in (Z/3)^2} S_3(zeta^{c1}x1,
              zeta^{c2}x2, x_R), invariant in both, so in F_p[u1,u2] with
              bidegree (6,6) and total degree 12; system
              {T(u1,u2) = 0, g(u1) = 0, g(u2) = 0};
              candidate count m^2.
    Degrees: deg_{x_i} S_3 = 2 -> deg_{u_i} T = 6, an inflation of exactly
    r = 3 per variable; candidate count 9 m^2 -> m^2, a deflation of exactly
    r^2 = 9.

    (E) THE FALSIFIABLE QUESTION. Groebner cost is governed by the highest
    degree reached, roughly (n + D choose D)^omega with n variables
    (KN-TECH-011). ENC-SYM has smaller support and fewer solutions but higher
    input degree. THE CLAIM UNDER TEST: at arity 2 and matched |V| = 3m, the
    measured solving-degree proxy and Groebner wall time for ENC-SYM and
    ENC-ASYM are LOWER than for ENC-X by a factor of at least 2 at the largest
    affordable m. THE COMPETING EXPLANATION, pre-registered as the more likely
    one: the r-fold degree inflation and the r^2-fold candidate deflation cancel
    to within measurement noise, so the reformulation is a change of coordinates
    with no cost consequence -- which, under the lossy-projection test, is the
    verdict that the projection u = x^3 discards nothing the solver was using.

    (F) THE RELATION ARITHMETIC, STATED BECAUSE THIS IS WHERE THE NAIVE VERSION
    DIES. A solution (u1, u2) of ENC-SYM certifies that SOME conjugate pair
    (zeta^{c1} x1, zeta^{c2} x2) decomposes x_R, i.e.
    R = eps_1 phi^{c1}(P_1) + eps_2 phi^{c2}(P_2) after back-substitution of
    cube roots (9 candidate phase pairs, resolved in O(1) evaluations of S_3).
    Because phi acts on G as the scalar lambda with lambda^2 + lambda + 1 = 0
    mod N (H-ENDO-001), that decomposition contributes ONE equation
      a_R + b_R k = eps_1 lambda^{c1} l_1 + eps_2 lambda^{c2} l_2  (mod N)
    over the m REDUCED unknowns l_1, ..., l_m. The other 8 conjugate solutions
    of the same (u1,u2), and the images phi(R), phi^2(R), give equations that
    are lambda-multiples of this one: their rank increment is exactly ZERO. So
    ENC-SYM yields ONE INDEPENDENT RELATION per solved system, over m unknowns,
    exactly as ENC-X does over 3m unknowns. The reformulation does not
    manufacture relations; it changes the ALGEBRAIC COST of finding one. That is
    the only thing this proposal claims and the only thing it measures.

  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: >-
    R1: the object manipulated is the x-coordinate as a FIELD ELEMENT and the
    polynomial system over F_p -- summation-polynomial evaluations, norms,
    resultants, Groebner degrees. A generic-group simulator returns opaque
    handles and equality tests; it cannot evaluate S_3, cannot form a norm over
    a mu_3-action on the x-line, and cannot report a solving degree, so nothing
    here is simulable in the sense of KN-FIND-b7e091. R2: the reformulation is
    valid only for the curve EQUATION with a = 0, and the biconditional in
    claim (C) makes that dependence exact rather than incidental. This proposal
    never applies phi to a point of G to obtain new information -- claim (F)
    states positively that doing so yields rank increment zero -- so it does not
    fall under the admissibility filter of DECOMPOSITION.md section 2.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). Nothing
      here is asserted about H-STR-002 in either direction. H-STR-002 is a claim
      about the DISPLACEMENT RANK of a relation matrix and a consequent
      linear-algebra saving; this proposal touches no matrix, measures no
      displacement rank, constructs no phi-shift operator, and makes no
      linear-algebra cost claim at all. The mechanism the weaken did not touch
      -- explicitly recorded in DEC-20260727-009 as
      "THE MECHANISM IS UNTESTED, NOT REFUTED" and in
      what_this_transition_does_not_assert -- is the equivariance of the
      summation-polynomial system itself. This proposal works on that system,
      and it works on its ALGEBRAIC SOLVING COST, a quantity absent from
      H-STR-002, from EXP-STR-002, EXP-STR-003 and EXP-STR-004.
    - >-
      KN-LIT-004 (Faugere-Gaudry-Huot-Renault, "Using symmetries in the index
      calculus for elliptic curves discrete logarithm", J. Cryptology 27(4)
      2014). That work exploits the S_m PERMUTATION symmetry of S_{m+1} plus
      extra symmetries of Edwards and twisted Jacobi-intersection MODELS, over
      EXTENSION fields, rewriting in elementary symmetric functions. The group
      here is different (the CM automorphism mu_3, acting by scalars on the
      x-line, not by permuting variables), the invariant ring is different
      (F_p[x^3], not the symmetric functions), the field is a prime field, and
      the two symmetries are COMPOSABLE rather than competing -- ENC-SYM can be
      symmetrized in (u1,u2) on top of the mu_3 quotient. Composability is a
      prediction of this record, not an assumption.
    - >-
      Faugere-Huot-Joux-Renault-Vitse, "Symmetrized summation polynomials: using
      small order torsion points to speed up elliptic curve index calculus",
      EUROCRYPT 2014 (recorded in knowledge/SOURCES.md as
      faugere_huot_joux_renault_vitse_2014_symmetrized). That work uses
      TRANSLATION by small-order torsion points, which is not a curve
      automorphism fixing the origin and acts on x by a non-linear rational map.
      mu_3 here is an automorphism fixing the origin acting LINEARLY on x. The
      resulting invariant rings are not the same object.
    - >-
      Tsakou-Ionica, eprint 2021/721 / Trans. Math. Cryptology 1(2) 2022. Their
      abstract, fetched in this session, states they "exploit the endomorphism
      of the curve to REDUCE THE SIZE OF THE FACTORIZATION BASIS", over
      F_{q^n} with n > 1. That is the FACTOR-BASE side and it is the arithmetic
      of IDEA-20260807-b42544 claim (A), already the known baseline. This
      proposal is on the SUMMATION-POLYNOMIAL side -- it changes the polynomial
      system, not the base -- and it is over a PRIME field. Whether their paper
      also rewrites the polynomial system is not stated in the abstract and is a
      Stage-0 obligation before any novelty is asserted.
    - >-
      KN-TECH-012 (isotypic/character block decomposition). That splits a
      relation SPACE or a Macaulay matrix into isotypic blocks under a group
      action. This proposal takes the QUOTIENT to the invariant ring and works
      with the norm; it does not split anything into blocks. The graded sibling
      that does look at isotypic components is IDEA-20260807-eeb226, and the two
      are deliberately separate objects.

  object_first_candidate:
    tracked_object: >-
      THE mu_3-INVARIANT COORDINATE u = x^3 of a factor-base element, and the
      norm form T(u1, u2) that the decomposition condition becomes when both
      variables are pushed to the invariant line.
    lossiness: >-
      GENUINELY LOSSY at the level of the variable: u forgets the phase
      c in Z/3, i.e. which of the three cube roots x, zeta x, zeta^2 x is meant.
      The map is 3-to-1 away from 0. HONEST CAVEAT, stated here rather than
      discovered later: the phase is RECOVERABLE by back-substitution at O(1)
      cost (nine evaluations of S_3), so the projection is lossy for the SOLVER
      but not information-theoretically destructive. Under
      docs/inventor-protocol.md section 2 this is the risk case: if the solver's
      cost does not change, the reformulation is a change of coordinates and
      nothing was gained. That is precisely the pre-registered competing outcome
      in claim (E), and it is why the null in this record is not optional.
    propagation: >-
      Deterministic under the operation the target performs. The decomposition
      test is "does S_3 vanish at some conjugate tuple"; the norm T is exactly
      the product over the conjugates, so T(u1,u2) = 0 IF AND ONLY IF some
      conjugate tuple decomposes. What u discards -- the phase -- is discarded
      compatibly, because the mu_3-action permutes the factors of the norm.
      On-curve membership propagates too: for a = 0, x lies on E iff x^3 + b is
      a square, a condition on u alone (this is the theorem of
      IDEA-20260807-4d7e8e).
    survival_score: >-
      Survives: change of factor base, change of target, change of solver,
      change of monomial order, and composition with the S_m symmetrization of
      KN-LIT-004. Dies at: a != 0 (claim (C) biconditional, and the matched
      null); arity growth, where deg_{u} T_m = (2r)^{m-1} = 6^{m-1} against
      deg_{x} S_{m+1} = 2^{m-1} -- an inflation of 3^{m-1} that is measured
      against the r^m candidate deflation in IDEA-20260807-5ddccf.

  mechanism: >-
    STEP 1 -- SYMBOLIC VERIFICATION, ZERO COMPUTE, HARD GATE. With sympy over
    Q (not mod p), verify
      expand(S_3(z*x1, z*x2, z*x3) - z*S_3(x1,x2,x3)) == 0 modulo z^3 - 1
    for a = 0 symbolic b, and verify it FAILS for symbolic a != 0. If either
    check does not come out as claim (C) says, this record is wrong and the line
    ends here at a cost of minutes.

    STEP 2 -- BUILD THE NORMS. T_rel(u1, x2) := Res_{x1}(S_3(x1, x2, x_R),
    x1^3 - u1), which equals prod_{d} S_3(zeta^d x1, x2, x_R) up to the leading
    coefficient of x1^3 - u1, namely 1, so equality is exact. Then
    T(u1, u2) := Res_{x2}(T_rel(u1, x2), x2^3 - u2). Both are single resultants
    of small polynomials and are computed once per (curve, target) with
    sympy.resultant. VERIFY the declared degrees: deg_{u1} T_rel = 2,
    deg_{x2} T_rel = 6, deg_{u1} T = deg_{u2} T = 6, total degree of T = 12.
    A degree that disagrees with claim (D) falsifies the record's arithmetic and
    is reported as such.

    STEP 3 -- THE THREE SYSTEMS, ONE COMPARISON. On a fixed j = 0 instance with
    V a union of m phi-orbits, |V| = 3m, and a fixed stream of targets, solve
      ENC-X:    groebner([S_3(x1,x2,x_R), f_V(x1), f_V(x2)], x1, x2, modulus=p)
      ENC-ASYM: groebner([T_rel(u1,x2), g(u1), f_V(x2)], u1, x2, modulus=p)
      ENC-SYM:  groebner([T(u1,u2), g(u1), g(u2)], u1, u2, modulus=p)
    recording for each: wall time, basis size, maximum total degree of the
    reduced basis (the implementation-bound proxy KN-TECH-004 and
    harness/semaev.py already use and label as such), number of solutions, and
    whether the ideal is trivial. The three systems have the SAME solution
    content by construction, so any cost difference is attributable to the
    encoding alone -- this is the one-variable comparison, and the variable is
    the encoding.

    STEP 4 -- CERTIFY EVERY POSITIVE. For every (u1,u2) solution, back-substitute
    cube roots, resolve the phase pair by direct evaluation, lift to points, and
    hand the result to harness/semaev.py::verify_decomposition_certificate,
    which re-checks the point sum independently of the solver. An uncertified
    solution is discarded and counted.

    STEP 5 -- THE NULLS. Run STEP 3 unchanged on the two null objects specified
    in null_object_control. Report all three columns side by side. No cost claim
    is made before the nulls are in the same table.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'invariant ring|Molien|symmetric summation|elementary symmetric' over
      the repository, content mode;
      (2) 'Veronese|norm of the summation|cube substitution|u = x\^3|
      x\^3 invariant|mu_3' over the repository, content mode;
      (3) 'x\^3|cube root|zeta_3|zeta3' over ledger/, files_with_matches;
      (4) 'Faug|Huot|Renault|Using symmetries|symmetry.*index calculus' over
      knowledge/, content mode.
      External, run in this session: web search
      "summation polynomial index calculus complex multiplication automorphism
      j=0 invariant x^3 elliptic curve"; web search
      "Faugere Gaudry Huot Renault using symmetries index calculus summation
      polynomial factor base automorphism speedup"; and a fetch of
      https://eprint.iacr.org/2021/721 returning the exact abstract quoted in
      discriminated_from.
    results: >-
      Grep (2) returned about 30 content hits for mu_3 and NONE of them is in a
      summation-polynomial context: they are the XEDN canonical-lift lane
      (KN-FIND-003, EXP-XEDN-002/003/affa94, TASK-20260724-234/235), the HQC
      campaign's unrelated moment notation, and validation reports. Grep (1)
      returned about 40 hits, all concerning the S_m PERMUTATION symmetry and
      elementary symmetric functions of root multisets (H-SMTH-001, H-LPF-001,
      EXP-SMTH-*, inputs/refs/.../proofs_Dreg_conservation_weil_invariance.md,
      which states an S_m-equivariance hypothesis and the elementary-symmetric
      and power-sum changes of variable) -- a DIFFERENT group and a DIFFERENT
      invariant ring. Grep (3) returned 40 files at the head limit (a FLOOR, not
      a count), dominated by the XEDN lane and IDEA-20260805-*. No record in
      this repository contains the substitution u = x^3 applied to a summation
      polynomial, the norm form T, or the degree bookkeeping in claim (D).
      Externally the nearest prior art is KN-LIT-004 (S_m symmetry and curve
      models, extension fields), the FHJRV EUROCRYPT 2014 symmetrized summation
      polynomials (torsion translations), and Tsakou-Ionica (factor-base size
      reduction by an endomorphism, extension fields, abstract quoted above and
      silent on the polynomial system).
    verdict: >-
      ADAPTATION. The TECHNIQUE -- quotient a polynomial system by a group
      action and work in the invariant ring -- is textbook and is the explicit
      subject of KN-LIT-004. What is not found in this repository and is not
      stated in the abstracts checked is this SPECIFIC instantiation: the CM
      automorphism mu_3 on a prime-field j = 0 curve, the invariant ring
      F_p[x^3], the norm forms T_rel and T with the exact degrees (2,6) and
      (6,6), and the pre-registered cancellation question. NOVELTY AGAINST THE
      EXTERNAL LITERATURE IS NOT CLAIMED and cannot be from two abstracts and
      one search summary; full-text reads of KN-LIT-004, FHJRV and
      Tsakou-Ionica are Stage-0 obligations, and a hit there is an ingredient,
      not a disappointment.

  null_object_control: >-
    MANDATORY AND BLOCKING. TWO NULLS, and the first is the sharp one.
    NULL-1, THE FAKE-INVARIANT CURVE. Run the identical pipeline on a curve
    with a != 0, where by claim (C) the mu_3 semi-invariance FAILS and
    x -> zeta x is NOT an automorphism -- but where the substitution u = x^3
    and the resultant construction still formally go through and still produce a
    system with membership degree m and a norm of bidegree (6,6). If the
    measured Groebner saving is the SAME there, the saving is a property of the
    CUBE SUBSTITUTION (a change of variables that happens to lower the
    membership degree) and NOT of the endomorphism, and no phi-attributed claim
    may be made. This is the direct implementation of the lossy-projection test
    and it is the single most informative control in this record.
    NULL-2, THE CARDINALITY-MATCHED RANDOM BASE. ENC-X on a uniformly drawn base
    of the same cardinality 3m on the same curve, per IDEA-20260807-b42544.
    DECAY PARAMETER: epsilon, the fraction of orbits broken at fixed |V| = 3m.
    ENC-SYM is not even well posed at epsilon > 0 (a broken base is not a union
    of orbits, so f_V does not factor as g(x^3)); the required decay is
    therefore measured on ENC-ASYM's SOLVABLE FRACTION -- the fraction of
    collected decompositions whose x1 lies in a complete orbit -- which must
    fall to 0 as epsilon -> 1. A saving that persists at epsilon = 1 is an
    artifact.

  assumptions:
    - >-
      p = 1 mod 3 and a primitive cube root zeta_3 exists in F_p; supplied by
      harness/endomorphism_la.py::_find_zeta3 and re-verified per instance
      (zeta_3 != 1, zeta_3^3 = 1).
    - >-
      3 does not divide p, so u = x^3 is separable away from 0 and each nonzero
      cube has exactly three cube roots in F_p. Automatic for p > 3.
    - >-
      x = 0 is a fixed point of the mu_3-action (a degenerate orbit of size 1).
      It is EXCLUDED from every factor base in this record, and the exclusion is
      recorded per cell. Including it silently is the most likely way to get
      wrong degrees.
    - >-
      sympy's resultant and groebner over modulus = p are correct for these
      sizes. Checked in STEP 2 by verifying degrees against claim (D) and in
      STEP 4 by independent certificate re-verification of every positive.
    - >-
      Solving-degree proxies are IMPLEMENTATION-BOUND (KN-TECH-004,
      harness/semaev.py honesty note): sympy uses a Buchberger/F5-style routine,
      not an optimized F4. Only TRENDS across encodings on the identical solver
      are interpreted; absolute timings are never a crypto-scale claim.

  proof_search_map:
    bottleneck: >-
      The Groebner solve of the arity-2 decomposition system, which is the step
      whose cost (a) determines whether prime-field point-decomposition index
      calculus is viable at all (KN-LIT-006, KN-OPEN-001) and (b) is the only
      quantity this proposal proposes to change. Everything else in the pipeline
      -- base construction, certificate checking, linear algebra -- is held
      fixed across the three encodings by construction.
    baseline_embedding:
      parameter_slice: >-
        ENC-X at r = 1. Setting the automorphism order acting on the x-line to 1
        makes the norm a single factor, T = S_3, and g = f_V, so ENC-SYM
        degenerates EXACTLY to ENC-X. The claimed family therefore contains the
        incumbent as the r = 1 slice, symbolically and not merely
        approximately.
      reproduction_check: >-
        Frozen regression fixture: on a fixed instance and a fixed target,
        assert as an exact polynomial identity that T(u1,u2) built with the
        1-element conjugate set equals S_3(x1,x2,x_R) under u_i = x_i, and that
        the two Groebner runs return identical bases. A mismatch is an
        implementation defect in the norm construction and halts the line before
        any comparative number is produced.
    observation_collision:
      observable: >-
        The maximum total degree of the reduced Groebner basis and the wall time
        -- the pair carrying the cost conclusion.
      distinct_preimage_search: >-
        REQUIRED, and expected to succeed, which is why NULL-1 is blocking: find
        two systems with the same observable, one arising from a genuine mu_3
        automorphism (a = 0) and one from the formally identical cube
        substitution on a curve with a != 0 where no automorphism exists. A
        collision there does not falsify the measurement; it BOUNDS what the
        measurement may be attributed to, namely the substitution rather than
        the endomorphism. Reporting an ENC-SYM saving without having run this
        search is prohibited by this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the decomposition test from F_p[x1,x2] to the invariant subring
          F_p[u1,u2], where "x_i lies in the phi-stable base" becomes the exact
          degree-m condition g(u_i) = 0 and the decomposition condition becomes
          the exact vanishing of a norm. Encoding obligation: the norms are
          resultants, computed once per target. Completeness: T = 0 whenever
          some conjugate tuple decomposes. Soundness: every T-root is checked by
          back-substitution and by an independent point-sum certificate.
          Transfer: the recovered relation is one equation over the m reduced
          unknowns (claim (F)). Cost loss: the phase resolution costs 9 S_3
          evaluations per solution, and the norm construction costs two
          resultants per target.
        predicted_gain: >-
          Candidate count 9 m^2 -> m^2, at the price of per-variable degree
          2 -> 6. Whether the product of those two is below 1 is exactly the
          measurement, and both signs are pre-registered outcomes.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (solving degree, wall time) fixed and vary the
          forgotten structure: the same u-system arising from a = 0 (real
          automorphism) and from a != 0 (no automorphism). The intrinsic
          invariant distinguishing them is the weight-1 semi-invariance of
          claim (C), which is a symbolic identity, not a measurement.
        predicted_gain: >-
          Either the observable separates the two -- in which case the
          endomorphism is doing the work -- or it does not, in which case the
          honest headline is "the cube substitution lowers the membership
          degree and the endomorphism is irrelevant to the solver", which is a
          controlled null and a publishable-inside-this-program result.
    quantifier_order: >-
      Intended: FOR ALL j = 0 curves E/F_p in the declared toy family, FOR ALL
      phi-stable factor bases V of size 3m in the declared family, FOR ALL
      targets R in the declared stream, THERE EXISTS an encoding among
      {ENC-ASYM, ENC-SYM} whose measured solving-degree proxy on the declared
      solver is at most that of ENC-X.
      The dangerous weaker reading, NOT claimed: FOR ALL R THERE EXISTS an
      encoding -- letting the winning encoding depend on the target, which would
      make the result unusable in an algorithm because the choice cannot be made
      before solving. The audit obligation is to report, per cell, whether one
      encoding wins UNIFORMLY over the target stream or whether the winner
      varies; a varying winner is reported as such and downgrades the claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On j = 0 prime-field curves in this toy family, at arity 2, with this
        solver and this factor-base family, the invariant encoding reaches a
        solving-degree proxy lower by a measured factor F." It can NEVER
        certify: an exponent change (the relation-collection exponent is set by
        the arithmetic in target_complexity and is untouched); anything about
        a != 0 curves; anything at arity above the tested one; anything about an
        optimized F4/F5; or anything about the ECDLP.
      nearby_object_control: >-
        The a != 0 curve of NULL-1, which is the closest object on which the
        hoped-for conclusion (an ENDOMORPHISM-driven saving) must fail. A method
        that cannot distinguish it from a = 0 has not identified the
        load-bearing structure and is measuring the substitution.
    proof_obligations:
      - claim: S_3 is weight-1 mu_3-semi-invariant iff a = 0.
        responsibility: correctness
      - claim: f_V(x) = g(x^3) with deg g = m for a phi-stable V of size 3m.
        responsibility: correctness
      - claim: T_rel and T have the degrees stated in claim (D).
        responsibility: size
      - claim: T(u1,u2) = 0 iff some conjugate tuple decomposes x_R.
        responsibility: completeness
      - claim: every reported decomposition carries a re-verified certificate.
        responsibility: soundness
      - claim: ENC-SYM at r = 1 reproduces ENC-X as an exact identity.
        responsibility: baseline
      - claim: one solved system yields exactly one independent relation.
        responsibility: scope

  predictions:
    - metric: >-
        maximum total degree of the reduced Groebner basis, ENC-SYM against
        ENC-X, same instance, same target, |V| = 3m fixed
      direction: lower
      minimum_effect: >-
        A reduction of at least 2 in the degree proxy at the largest affordable
        m, sustained over at least 20 targets. A reduction of 0 or 1 is
        pre-registered as CANCELLATION, the competing explanation, and is
        recorded as a controlled null rather than as a weak positive.
    - metric: >-
        Groebner wall time ratio, ENC-X over ENC-SYM, and ENC-X over ENC-ASYM
      direction: higher
      minimum_effect: >-
        At least 2.0 at the largest affordable m for at least one of the two
        invariant encodings, with the ratio INCREASING in m. A ratio that is
        above 1 but flat in m is a fixed overhead difference, not a structural
        saving, and is reported as such.
    - metric: >-
        degrees of T_rel and T as constructed
      direction: different
      minimum_effect: >-
        Exactly deg_{u1} T_rel = 2, deg_{x2} T_rel = 6, deg_{u1} T =
        deg_{u2} T = 6, total degree of T = 12. These are arithmetic
        predictions of claim (D) with zero tolerance; any deviation falsifies
        the record's degree bookkeeping immediately and cheaply.
    - metric: >-
        NULL-1 separation: (ENC-X / ENC-SYM wall-time ratio at a = 0) minus
        (the same ratio at a != 0 with the formal cube substitution)
      direction: higher
      minimum_effect: >-
        At least 0.5. Below 0.5 means the endomorphism contributes nothing
        beyond the substitution, and the record's headline becomes the
        controlled null. THIS IS THE PREDICTION MOST LIKELY TO FAIL and it is
        listed as a first-class prediction for that reason.
    - metric: >-
        independent relations recovered per solved ENC-SYM system
      direction: different
      minimum_effect: >-
        Exactly 1.000. A value above 1 would contradict claim (F) and
        H-ENDO-001; a value below 1 means solutions are not being converted to
        relations and the pipeline is broken.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS STEP 1 PLUS STEP 2, AND IT COSTS
      MINUTES. Symbolically verify the weight-1 semi-invariance for a = 0 and
      its failure for a != 0, then build T_rel and T by two resultants and check
      the four declared degrees. Those two checks alone can kill the record
      before any curve is generated. Only if both pass: STAGE 3, the
      three-encoding comparison at field_bits in {12, 16, 20}, seeds {1, 2, 3},
      arity 2, |V| = 3m a multiple of 3 with 3m = ceil(sqrt(N)) rounded down,
      20 targets per cell, on harness/semaev.py's existing sympy.groebner call
      with the system swapped. STAGE 4, NULL-1 on a matched a != 0 curve at the
      same p and comparable N. STAGE 5, report the table; make no cost claim
      before NULL-1 is in it.
    controls:
      - >-
        NULL-1, the a != 0 curve with the formally identical cube substitution
        (blocking)
      - >-
        NULL-2, ENC-X on a cardinality-matched random base of size 3m
      - >-
        r = 1 degeneration fixture: ENC-SYM must reproduce ENC-X exactly
      - >-
        a satisfiable and an unsatisfiable target per cell, so that the trivial
        ideal branch is exercised in both encodings
      - >-
        independent certificate re-verification of every claimed decomposition
      - >-
        identical solver, monomial order (grevlex), modulus and machine across
        all three encodings
    required_metrics:
      - Groebner wall time, basis size, max total degree, per encoding per target
      - degrees of T_rel and T as actually constructed
      - number of solutions found and number certified per encoding
      - independent relations recovered per solved system
      - NULL-1 columns for every metric above
      - resultant construction time and memory (charged to the encoding)
      - sha256 of the factor base, of g, of T_rel and of T per cell

  falsification_conditions:
    - >-
      STEP 1 fails: S_3 at a = 0 is not weight-1 semi-invariant, or it IS
      semi-invariant at a != 0. Claim (C) is false and the record is superseded,
      not amended.
    - >-
      The constructed norms do not have the degrees in claim (D). The degree
      bookkeeping is wrong and every cost prediction built on it is void.
    - >-
      ENC-SYM at r = 1 does not reproduce ENC-X exactly. The norm construction
      is wrong and no comparative number may be reported.
    - >-
      NULL-1 shows the same saving at a != 0. No phi-attributed claim may be
      made; the honest result is that the cube substitution lowers membership
      degree and the endomorphism is not load-bearing. This is a controlled null
      and is a deliverable.
    - >-
      ENC-SYM's wall time exceeds ENC-X's at every tested m. The degree
      inflation dominates; the invariant encoding is worse at arity 2; the
      obstruction is named (r-fold per-variable degree inflation) and the
      forward pointer is IDEA-20260807-5ddccf's arity scaling.
    - >-
      Resultant construction or Groebner exceeds the memory budget. An
      INFRASTRUCTURE outcome under AGENTS.md rule 5, recorded as such, never as
      evidence about encodings.

  confounders:
    - >-
      SOLVER IDIOSYNCRASY. sympy's Buchberger/F5-style routine may respond to
      the encodings in ways an optimized F4 would not. The comparison is valid
      only WITHIN this solver, and the record must say so wherever a ratio
      appears. A second solver on frozen seeds is the mitigation and is listed
      as a follow-on, not as a claim.
    - >-
      RESULTANT COST CHARGED TO THE WRONG SIDE. T_rel and T are built once per
      target and that cost belongs to the invariant encodings. Amortizing it
      over many targets (T depends on x_R, so it cannot be amortized across
      targets, while g depends only on V and can) must be accounted exactly, or
      ENC-SYM is credited with a saving it did not make.
    - >-
      COEFFICIENT GROWTH. T has total degree 12 with coefficients that are
      polynomials in b and x_R; over F_p there is no growth, but the symbolic
      construction over Z before reduction can blow up. Reduce mod p before
      expanding.
    - >-
      THE x = 0 ORBIT. A degenerate mu_3-orbit of size 1 breaks f_V(x) = g(x^3);
      excluded by assumption and checked per cell.
    - >-
      TARGET-DEPENDENT WINNER. If the winning encoding varies with the target,
      the quantifier audit above downgrades the claim; averaging over targets
      would hide exactly this and is forbidden as the primary report.

  interpretation_limits:
    - >-
      NO EVIDENCE ABOUT H-STR-002 IS PRODUCED IN EITHER DIRECTION. No
      displacement rank, no relation matrix, no linear-algebra cost.
      DEFER-BATCH009-001 is untouched and remains open.
    - >-
      Toy tier, claim_tier toy, at p up to about 20 bits with pure Python. No
      crypto-scale statement of any kind.
    - >-
      Scoped to j = 0 (CM discriminant -3, p = 1 mod 3), a measure-zero curve
      family. No standardized curve in this program's target set has j = 0, and
      by T4 of DECOMPOSITION.md a j = 0 curve cannot be reached by walking from
      an isogeny class that does not already contain one.
    - >-
      A positive result is a CONSTANT-FACTOR improvement to one step of an
      attack that is already uncompetitive with rho over prime fields
      (KN-LIT-006). It is not an attack and does not become one.
    - >-
      Arity 2 only. The arity ceiling is a separate record
      (IDEA-20260807-5ddccf) and this one must not be read as covering it.

  reachability_gate: >-
    NOT APPLICABLE TO THE EXPERIMENT, BINDING ON THE INTERPRETATION. The
    experiment moves between no curves: each arm fixes one curve and varies the
    encoding. The a != 0 null curve is CONSTRUCTED, not reached by an isogeny
    walk, so T5 does not bind on the design. What binds is T4: the mechanism
    exists only on curves whose isogeny class has D_0 = -3, and those cannot be
    reached from a class that lacks them at any cost. So even a maximal positive
    result here has zero reach to a curve chosen adversarially or at random, and
    that limitation is structural rather than budgetary.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES, and the arithmetic is stated so this cannot be misread.
      At arity 2 over a prime field with base size B: success probability about
      B^2 / 2N, independent relations needed B / r, hence about 2N / (rB)
      searches at cost about c(B) each. With the exhaustive-pair search
      c(B) = O(B^2) this totals O(N B / r); with the standard quadratic-root
      search c(B) = O(B) it totals O(N / r) -- LINEAR in N either way. This
      proposal changes c(B) for the algebraic search, not the exponent. The only
      exponent-relevant lever in this lane is the arity-m Groebner cost, which
      is IDEA-20260807-e57607.
    memory_exponent: >-
      Groebner memory at arity 2 is the Macaulay-matrix dimension, roughly
      (2 + D choose D) for D the reached degree -- small at toy scale and
      measured per cell. Not a cryptanalytic memory term; the attack-side memory
      is the m x m relation matrix, unchanged by this proposal.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) group operations
      and O(1) memory (KN-TECH-001, KN-TECH-006); on j = 0 the
      automorphism-discounted variant at 0.886 sqrt(N)/sqrt(6) (KN-TECH-018);
      BSGS at sqrt(N) time and memory. For the decomposition step itself, the
      incumbent encoding is ENC-X as implemented in harness/semaev.py, and the
      external state of the art for symmetry exploitation is KN-LIT-004.
    hidden_overhead: >-
      Two things hide and both are disclosed. (i) The phase-resolution step:
      nine S_3 evaluations per solution, constant but real, and it is the reason
      the projection is not information-theoretically lossy. (ii) The norm
      construction: two resultants per TARGET, which cannot be amortized across
      targets because T depends on x_R. At small m this can exceed the Groebner
      saving outright, which would make the encoding a net loss for a reason
      that has nothing to do with degrees.
    tradeoff_note: >-
      No time-memory tradeoff is introduced: all three encodings solve a
      zero-dimensional system whose memory is set by the Macaulay dimension.
      Parallelization position is unchanged, since relation collection over
      distinct targets is embarrassingly parallel in every encoding.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK:
    dominated by parallel rho with distinguished points (0.886 sqrt(N) time,
    O(1) memory, KN-TECH-001/006) on both axes; by the automorphism-discounted
    rho on this exact curve family (0.886 sqrt(N)/sqrt(6), O(1) memory,
    KN-TECH-018), which is the tightest relevant row; by BSGS (sqrt(N) time,
    sqrt(N) memory) on time; and, at one further remove, prime-field
    point-decomposition index calculus is itself already dominated by all three
    (KN-TECH-003, KN-LIT-006), so this proposal improves one step of an
    already-dominated method. On data/queries no row is beaten either: the
    method consumes O(N/r) decomposition attempts against rho's O(sqrt(N))
    group operations. AS AN ENCODING for the decomposition step, the incumbent
    is ENC-X and the external comparator is KN-LIT-004's symmetric-function
    rewriting; this proposal is not known to dominate either, which is the
    question being asked.
  sota_delta: >-
    Zero speedup against any attack baseline; the best possible outcome is a
    constant-factor improvement to one step of a method that loses to rho by a
    factor of about sqrt(N) over prime fields. Quantitatively, the encoding
    delta being measured: candidate count 9 m^2 -> m^2 (a factor r^2 = 9 down),
    per-variable degree 2 -> 6 (a factor r = 3 up), membership degree 3m -> m (a
    factor r = 3 down), and one unresolved sign on the product of those three.
    Against KN-LIT-004's reported 2^{omega(n-1)} for extension-field curves with
    the relevant model symmetries, this proposal claims nothing comparable and
    operates in the prime-field regime where KN-LIT-006 records that no
    index-calculus advantage is known.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.90 that STEP 1 confirms the semi-invariance biconditional -- it is a
    hand-verified degree congruence and the risk is transcription, not
    mathematics. 0.80 that the constructed norms have exactly the degrees in
    claim (D). 0.35 that either invariant encoding beats ENC-X by the
    pre-registered factor of 2 at the largest affordable m; the dominant reason
    for the other 0.65 is that the r-fold degree inflation and the r^2-fold
    candidate deflation plausibly cancel, which is the pre-registered competing
    outcome. 0.25 that NULL-1 separates, i.e. that the saving (if any) is
    attributable to the endomorphism rather than to the cube substitution --
    this is the number the record is really about, and it is deliberately the
    lowest one here.

