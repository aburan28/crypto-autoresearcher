  assumptions:
  - The sieve can be instrumented to count vector-pair reduction attempts without changing its
    behaviour; if the instrumentation perturbs the schedule the counts are void.
  - The GOAL-MLKEM-004 instrument rebuilds (its own reproducibility_warning says it will not
    survive session end); a failed rebuild is infrastructure under AGENTS.md rule 5.
  - A full progressive schedule to beta = 85 fits in budget. The committed single-call datum
    (dim 70 bgj1, 335.2 s) does not establish this, because a schedule makes many calls, and the
    batch must therefore begin at beta = 50 and stop when the budget binds rather than promising
    beta = 85.
  - R is well defined only relative to a declared schedule; the schedule (blocksize ladder, jump
    value, tour count, preprocessing) is frozen before the run and reported with every number.
  - A BKZ profile simulator can be instantiated at all in this program. KN-TECH-041 records that
    "No basis profile has been computed in this repository", so Stage 0S is a first instantiation
    and may fail for tooling reasons; a failed instantiation is infrastructure under AGENTS.md
    rule 5 and leaves leg 1 open rather than refuted.
  - The cold floors of part (B) are computed inside the core-SVP convention with g6k's applied
    d4f rule. They are statements about the convention's arithmetic, not about a machine, and
    Stage 0S reproduces them programmatically before any branch uses them.
  proof_search_map:
    bottleneck: >-
      Not a proof-oriented proposal in the theorem sense; the map is filled because the claim is
      a quantitative cost-model statement. The bottleneck in the cost chain is the step from
      "cost of one SVP call at beta" to "cost of an attack requiring quality beta". CORRECTED ON
      REVIEW: that step is not "asserted rather than computed" in general - KN-LIT-101's simulator
      computes its call-count factor and KN-TECH-040 records a rival value for it. The part of it
      that is asserted rather than computed anywhere this record could find is the WORK-WEIGHTED
      reuse factor, and that is the bottleneck this record targets.
    baseline_embedding:
      parameter_slice: >-
        R = 1 with a single-call schedule reproduces the core-SVP convention exactly. That is the
        exact old-method boundary and it is a runnable configuration, not a limit. The SECOND
        boundary, added on review: charging every call at the final call's price and taking the
        call count from Stage 0S reproduces KN-TECH-040's `8d` convention, so the two incumbent
        conventions are both parameter slices of this record's accounting and must both be
        reproduced before any intermediate value is reported.
      reproduction_check: >-
        Running the schedule with the ladder truncated to the single blocksize beta must return
        R = 1.000 exactly and total work equal to the single-call work measured independently.
        Frozen fixture at beta = 60. Additionally, Stage 0S must reproduce the closed-form cold
        floors 9.149 / 10.390 (regime 1) and 5.857 (regime 2) from the clamped d4f rule before
        either is used as a branch boundary.
    observation_collision:
      observable: 'R, one positive real per (schedule, basis, beta).'
      distinct_preimage_search: >-
        COLLISION IDENTIFIED IN ADVANCE: a schedule with few expensive calls and a schedule with
        many cheap calls can share an R. R therefore does NOT identify the call count, and the
        record must report the call list alongside R or the number is ambiguous. This is why the
        per-call tuple list, not just R, is a required artifact. A second collision: R is
        invariant under uniform rescaling of the work unit, so it cannot distinguish an efficient
        implementation from an inefficient one - which is a feature here (hardware independence)
        and a limitation stated in interpretation_limits. A THIRD COLLISION, ADDED ON REVIEW AND
        the reason leg 1 and leg 2 are reported separately: total reuse over a long call list and
        no reuse over a short one give the same R, so an R quoted without its call list cannot
        distinguish Explanation 1 from Explanation 2 at all. Stage 0S's call list is what breaks
        that degeneracy, and it is required before any R is interpreted.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        Treat the pool's saturation deficit as a potential that each call reduces, and charge each
        call the deficit it removes. If reuse is real, the potential telescopes across the ladder
        and the sum collapses to the final call's deficit, giving R = O(1) structurally rather
        than empirically.
      predicted_gain: >-
        Converts a measured ratio into a derived bound. Predicted gain is not a speedup but a
        REASON: it would explain why R is small, which a measurement alone cannot. Failure of the
        telescoping (deficit not monotone across calls) is itself diagnostic and is checkable from
        the same per-call tuples at no extra compute. ADDED ON REVIEW: the saturation deficit is
        also the natural candidate for the missing state variable of a pool-aware simulator, which
        is the forward guidance H1 names.
    - transform: stronger_invariant
      proposed_object: >-
        Track pool-size-at-entry alongside blocksize, so the per-call work law can be regressed on
        both. Preserving more state than R requires is what makes the mechanism (not just the
        magnitude) testable, and it is exactly the state the profile-simulator family discards.
      predicted_gain: Separates the reuse mechanism from the blocksize mechanism within one run.
    quantifier_order: >-
      FOR ALL beta in the measured window, FOR ALL bases in the declared seed set, THERE EXISTS a
      schedule (the frozen pump-and-jump ladder) with log2 R(beta, basis) <= C(beta) - 1, where
      C(beta) is the executed cold arm's value at the same call list. NOTE THE ORDER: the
      schedule is FIXED IN ADVANCE and does not depend on the basis. A claim with the quantifiers
      the other way round - "for every basis there exists a schedule with small R" - would be much
      weaker and would be an attacker-optimisation claim, which this record does NOT make. Xia et
      al.'s 7.2-23.4x result and KN-LIT-4429's 50x both live in exactly that weaker quantifier
      order and are cited only as evidence of variability. NOTE ALSO, ADDED ON REVIEW, that the
      threshold is now RELATIVE to a measured cold arm rather than to the scalar 2^6, because the
      absolute threshold was in the wrong regime for the window it quantified over.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this schedule, this sieve kernel, this lattice family and beta in [50, 85], the
        work-weighted reuse factor is R/R_cold = ... +/- ..., measured in vector-pair reduction
        attempts, against a simulated call list of length ... at the same blocksizes." Nothing
        about FIPS 203 blocksizes, nothing about optimal schedules, nothing about other kernels,
        and nothing about the call count at beta = 400-900 beyond what Stage 0S's simulator emits
        under its own stated validity range (blocksize >= 50, KN-LIT-101, not proven).
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a schedule with a large jump value
        J, where consecutive calls share little of the block and reuse should be much weaker. If
        R is the same at J = 1 and at large J, the method is not reading reuse at all and has not
        identified the load-bearing structure. This control is cheap and is in the required list.
    proof_obligations:
    - claim: Single-blocksize schedule returns R = 1.000 and matches the independent single-call work.
      responsibility: baseline
    - claim: Stage 0S reproduces the closed-form cold floors and the beta = 74.1176 clamp crossover
        before either is used as a branch boundary.
      responsibility: baseline
    - claim: Executed cold work agrees with the closed-form cold prediction within tolerance.
      responsibility: correctness
    - claim: NULL-SIM shows the simulator reproduces the executed call list at reachable beta, or
        leg 1's transport to FIPS 203 blocksizes is declared unsupported.
      responsibility: interface
    - claim: R_warm/R_cold is reported with an interval over >= 8 bases.
      responsibility: success_probability
    - claim: Instrumentation does not change the schedule's trajectory.
      responsibility: interface
    - claim: No statement is made about beta > 85 except through H1, and H1 covers leg 2 only.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: 'log2 R(beta) at beta = 70 minus log2 R_cold(beta) at the same executed call list,
      warm progressive schedule, vector-pair reduction attempts'
    direction: lower
    minimum_effect: '-1.0 - i.e. warm must beat the executed cold arm by at least a factor 2.
      RESTATED ON RED-TEAM REVIEW: the filed prediction was the absolute threshold log2 R <= 6.0,
      which sits above the FORCED one-call-per-blocksize cold ceiling of 3.194-3.377 bits in this
      record''s own measurement window and therefore could not have fired against the no-reuse
      alternative there.'
  - metric: 'R_warm / R_cold at matched call list, beta = 70'
    direction: lower
    minimum_effect: 0.5
  - metric: 'slope of log2 R against log2(number of calls in the schedule), across schedules with
      1x, 2x and 4x the call count at fixed beta'
    direction: lower
    minimum_effect: '0.5 - a slope of 1 is the no-reuse prediction and a slope near 0 is total
      reuse; anything at or above 0.5 refutes the warm-start explanation'
  - metric: 'fraction of total work consumed by the final 10% of calls, W(1) - W(0.9)'
    direction: higher
    minimum_effect: 0.5
  - metric: 'R at jump J = 1 versus R at the largest jump run'
    direction: different
    minimum_effect: '0.3 in log2 R - if the two agree, the measurement is not reading reuse'
  - metric: 'ratio of seed-to-seed spread of R at fixed beta to beta-to-beta spread at fixed seed'
    direction: lower
    minimum_effect: '1.0 - at or above 1 the object is unstable and the NEITHER branch fires'
  - metric: 'Stage 0S simulated call count at the committed ML-KEM blocksizes, divided by
      KN-TECH-040''s `8d` with d taken from the pinned estimator output'
    direction: different
    minimum_effect: '2.0 - a ratio outside [0.5, 2.0] means the corpus''s simulator and the
      corpus''s `8d` convention disagree at ML-KEM parameters by more than a factor 2, which is a
      reportable finding about the cost-model zoo independent of anything g6k produces. This
      metric is ZERO COMPUTE and is the cheapest cell in the record.'
  - metric: 'NULL-SIM: per-call agreement between the simulated and executed call lists at
      beta = 50, 60, 70, as the fraction of calls whose (blocksize, position, tour) matches'
    direction: higher
    minimum_effect: '0.9 - below that the simulator has no standing to emit a call list at
      beta = 900 and leg 1''s transport is declared unsupported'
  minimal_test:
    design: >-
      LEG 1 FIRST, AND IT IS ZERO COMPUTE. Step 0S: instantiate a BKZ profile simulator
      (KN-LIT-101's, with KN-LIT-4429's and eprint 2022/1343's as alternates) on the committed
      ML-KEM primal bases; emit the call list and per-call blocksize ladder at the effective
      blocksizes implied by EV-MLKEM-020; compare the call count against KN-TECH-040's `8d` with d
      read from the pinned estimator output; and freeze the regime-dependent cold floors and the
      beta = 74.1176 clamp crossover. Report this before any g6k time is requested. THE BATCH MAY
      STOP HERE AND STILL HAVE A DELIVERABLE: a signed discrepancy between the corpus's two
      oracle-call conventions at ML-KEM parameters.
      LEG 2, AND ONLY IF LEG 1 REPORTED. Rebuild the instrument and reproduce the committed dim-70
      bgj1 database size (75511) as a gate. Freeze one pump-and-jump ladder, one kernel (bgj1),
      one preprocessing, one jump value J = 1. Beta in {50, 60, 70}, eight bases per beta. For
      each cell run four arms in the same invocation: WARM (the frozen ladder), NULL-C (same call
      list, pool discarded between calls), NULL-S (same call multiset, randomised order), and
      NULL-SIM (the simulator's predicted call list for the same basis, compared call for call).
      Emit per-call tuples throughout. Compute R and W(t) for each arm; emit the frozen four-branch
      rule on NULL-C first, then on WARM. Then two ablation cells at beta = 70 only: truncation
      fractions 10/40/70% for the monotonicity requirement, and one large-J cell for the
      nearby-object control.
      WHY THIS DISCRIMINATES: the two explanations of leg 2 differ in the SLOPE of log2 R against
      log2(call count), and that slope is measured directly by varying the tour count at FIXED
      beta - so the discrimination needs no extrapolation and no large blocksize. The smallest
      cell, beta = 50 with 1x/2x/4x tours, is on its own a complete discriminator for leg 2;
      everything above it is replication and scope. Leg 1 needs no compute at all.
      STOPPING RULE: if the beta = 50 slope cell already returns a slope outside [0, 0.5] with a
      non-overlapping interval over 8 bases, the headline is settled and the larger cells are
      replication only. If Stage 0S cannot instantiate any simulator, leg 1 is reported as
      UNSETTLED FOR TOOLING REASONS - never as absent - and leg 2 proceeds with its results
      explicitly uninterpretable at FIPS 203 blocksizes.
    controls:
    - 'NULL-C cold-restart arm, executed (not modelled), >= 8 bases, with its closed-form
      prediction derived before the run and compared'
    - 'NULL-S shuffled-order arm at matched call multiset'
    - 'NULL-SIM simulator cross-check: the simulated call list against the executed one at
      reachable beta, which can fail and whose failure voids leg 1''s transport'
    - 'single-blocksize baseline returning R = 1.000 exactly'
    - 'the `8d` baseline slice: every call charged at final-call price, which must reproduce
      KN-TECH-040''s convention'
    - 'pool-truncation ladder at 10/40/70% with monotonicity of R in the truncation fraction
      REPORTED, not assumed'
    - 'large-jump nearby-object control'
    - 'instrument rebuild gate reproducing db 75511 at dim 70 bgj1'
    - 'instrumentation-neutrality check: an uninstrumented run must reach the same final basis
      profile as an instrumented one on the same seed'
    - 'the frozen regime-dependent cold-floor table, so that no branch is decided against a
      constant computed in the wrong d4f regime'
    required_metrics:
    - Stage 0S simulated call list and per-call blocksize ladder at the committed ML-KEM
      blocksizes, with the simulator named and its stated validity range recorded
    - simulated call count against KN-TECH-040's `8d`, with d as read from the pinned estimator
    - the frozen cold-floor table per regime and per ladder, with the beta = 74.1176 crossover
    - per-call tuples (blocksize, position, tour, work units, pool size in, pool size out) for
      every call of every arm, archived
    - R per (arm, beta, basis) with interval over bases
    - W(t) curves, archived, for at least one basis per cell
    - R_warm / R_cold with interval
    - slope of log2 R against log2(call count) at fixed beta, with confidence interval
    - closed-form cold prediction and its signed discrepancy against executed cold work
    - NULL-SIM per-call agreement fraction
    - seed-to-seed and beta-to-beta spreads of R
    - wall-time and peak RSS per arm, plus the rebuild receipt
  falsification_conditions:
  - 'log2 R exceeds the executed cold arm''s value minus 1 and the slope against log2(call count)
    is at or above 0.5: the warm-start mechanism is refuted, core-SVP is conservative by roughly
    the call count, KN-TECH-040''s `8d` convention is the better reading, and the lane must record
    that every margin it has computed is understated by that amount. This is a clean refutation of
    the claim and is the most consequential outcome available.'
  - 'R_warm / R_cold >= 0.5: reuse buys less than a factor 2 and the mechanism is not doing the
    work attributed to it, whatever R''s absolute value is.'
  - 'NULL-S matches WARM: progressive ordering contributes nothing and the accrual shape is a
    property of the call multiset, not of the schedule.'
  - 'Executed cold work disagrees with the closed-form cold prediction beyond tolerance: the work
    counter is wrong; no R is reported and an instrumentation defect is recorded.'
  - 'R at J = 1 equals R at large J: the measurement is not reading reuse and the mechanism claim
    is unsupported regardless of R''s value.'
  - 'Seed-to-seed spread of R at fixed beta exceeds the beta-to-beta spread: R is not a property
    of the schedule; the NEITHER branch fires and nothing is reported.'
  - 'Instrumented and uninstrumented runs reach different bases on the same seed: the
    instrumentation perturbs the object and all counts are void.'
  - 'NULL-SIM agreement falls below 0.9 at reachable beta: the simulator cannot reproduce a call
    list it can observe, so its call list at beta = 900 is not evidence, and leg 1 is reported as
    unsettled rather than as settled by Stage 0S. ADDED ON RED-TEAM REVIEW; without this condition
    the new zero-compute arm would be an arm with no possible negative outcome.'
  - 'Stage 0S''s simulated call count agrees with `8d` to within a factor 2 AND leg 2''s measured
    R/R_cold is indistinguishable from 1: then BOTH corpus conventions are consistent with each
    other and with a no-reuse schedule, this record contributes only a confirmation, and its
    residual claim is empty.'
  confounders:
  - >-
    The work unit. Vector-pair reduction attempts and wall-time do not agree, because bucketing
    and near-neighbour filtering change the cost per attempt. R measured in attempts and R
    measured in seconds can differ materially; BOTH must be reported and the divergence between
    them is itself a datum.
  - >-
    Schedule choice is a free parameter and Xia et al.'s retrieved 7.2-23.4x spread and
    KN-LIT-4429's relayed 50x both prove it is a large one. R is scoped to the frozen ladder and
    is not a property of "progressive BKZ".
  - >-
    THE d4f REGIME, PROMOTED FROM ABSENT TO A CONTROLLED PARAMETER DURING THIS REPAIR. The g6k
    clamp puts this record's entire measurement window (beta = 50-85, crossover 74.1176) in a
    different cost regime from ML-KEM's blocksizes, with per-blocksize cost ratios 2^0.146 versus
    2^0.27010 and cold floors 10.390 versus 5.857. Any transport of a measured R from the window
    to FIPS 203 blocksizes crosses that regime boundary, and H1 must carry it explicitly rather
    than silently.
  - >-
    Preprocessing before the ladder can be charged to the ladder or excluded; the boundary is
    arbitrary and must be declared, because putting preprocessing inside R inflates it and putting
    it outside deflates it.
  - >-
    Memory pressure. At the largest reachable beta the pool may exceed cache or RAM and wall-time
    will jump for reasons that have nothing to do with reuse. This is exactly the effect
    IDEA-20260816-7bc28c owns; here it is a confounder to be excluded by reporting the
    hardware-independent unit as primary.
  - >-
    q-ary structure. At small beta the block still contains q-vectors and the sieve behaves
    atypically; the fit must exclude that range and say where it ends.
  - >-
    Kernel choice. bgj1, bdgl and hk3 have different reuse behaviour. R is scoped to bgj1 unless
    a second kernel is run.
  - >-
    SIMULATOR VALIDITY. KN-LIT-101's simulator is stated for blocksize >= 50 and its corpus entry
    records that "the claim that the simulator is accurate outside the experimentally tested range
    is not made by the paper and is not assumed here". Stage 0S runs it at beta = 400-900, far
    outside that range. NULL-SIM is the only check available and it checks only the reachable end.
  interpretation_limits:
  - Beta in [50, 85] is toy scale. Nothing here is a statement about FIPS 203, whose blocksizes
    are of order 400-900. For leg 2, H1 is the only bridge and it is an assumption, not a result.
    For leg 1 the bridge is a simulator run outside its stated validity range, which is a
    different and weaker kind of assumption, and it is labelled as such everywhere it is used.
  - R is a ratio inside a cost convention. It is not a lower bound on attack cost, not an upper
    bound, and not a physical quantity; an attacker with a better schedule gets a different R.
  - A small R does NOT mean attacks are cheaper than believed - it means core-SVP's neglect of
    the schedule is a small error. A large R means core-SVP is conservative. Neither direction is
    a security claim and neither is reported with adjectives.
  - R is invariant under uniform rescaling of the work unit, so it says nothing about
    implementation efficiency and cannot be compared against any wall-time-based figure.
  - Every number in parts (B) and (C) is a hand derivation performed during the 2026-08-24 repair
    from published constants and committed numbers. None is a measurement, no run record backs any
    of them, and Stage 0S must reproduce them programmatically before any is cited as a result.
  - The `8d` figure is taken from KN-TECH-040, whose own limits section says the catalogue of
    conventions is indicative rather than exhaustive and unchecked against an authoritative
    tabulation. It is an incumbent, not a datum.
  - AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004; no committed record's
    status is proposed to change.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (EXTRAPOLATION OF LEG 2 ONLY) Let s(beta) be the fitted slope of log2 R against
      log2(call count) at fixed beta, measured for beta in [50, 85] with the ladder, kernel and
      preprocessing frozen. H1 asserts that s(beta) does not increase with beta outside the
      measured window, uniformly for beta up to the estimator's largest selected blocksize (of
      order 900). H1 asserts nothing about the VALUE of R at those blocksizes, only about the sign
      of its dependence on schedule length. NARROWED ON RED-TEAM REVIEW: H1 no longer covers the
      CALL COUNT, which Stage 0S's simulator supplies directly at any blocksize; it covers only
      the work-weighted reuse factor, which is leg 2.
    rigorous_support: >-
      The rigorous ingredient is the exact geometric sum: under the core-SVP convention with the
      free-dimension rule g6k applies, one call at beta costs 2^(0.146*beta + 5.84) in regime 1
      (beta < 74.1176) and 2^(0.27010*beta - 3.358) in regime 2, so the one-call-per-blocksize
      total is at most 1/(1 - 2^-0.146) = 10.390 times the final call in regime 1 and
      1/(1 - 2^-0.27010) = 5.857 times in regime 2 - beta-INDEPENDENT constants within each
      regime. That is a theorem about the convention, not an assumption. The classical
      distributional statement H1 imitates is the standard renewal / geometric-series argument
      that a sum dominated by its largest term has a ratio to that term which converges as the
      number of terms grows: H1 asserts that the repeated-call structure obeys the same regime,
      i.e. that the extra calls at fixed blocksize behave like a bounded multiplicative overhead
      rather than an independent factor. CORRECTED ON REVIEW: the filed version quoted only the
      regime-2 constant 5.862 and applied it to a regime-1 window; both the value and the regime
      were wrong.
    validation_plan: >-
      SAMPLE: R at beta = 50, 60, 70 (and 80, 85 if budget allows), 8 bases per cell, with the
      call count varied 1x/2x/4x at each beta by changing the tour count only. SCALE justified by
      GOAL-MLKEM-004's committed dim-70 single-call timing of 335.2 s; a 4x-tour ladder to 70 is
      the budget-binding cell and the batch declares in advance that it stops there if needed.
      COMPARISON: s(beta) against 0 (total reuse) and against 1 (no reuse), and R against the
      exactly derived cold value in the CORRECT REGIME. TAIL CHECK: s at the largest reachable
      beta, taken alone, must agree in sign with the pooled fit; disagreement is reported as H1
      UNSUPPORTED at the top of its own window.
      THE SHORTCUT QUESTION, REWRITTEN ON RED-TEAM REVIEW. The filed version of this plan said:
      "there is no sampling shortcut for R at cryptographic blocksizes - no analogue of the Deuring
      correspondence exists here - so H1 cannot be validated where it is used". THAT SENTENCE IS
      WITHDRAWN. It was a closure without a named obstruction (docs/inventor-protocol.md section
      4), it was false for half the quantity, and it was load-bearing because it was the stated
      reason the whole design carried a high implementation and high compute cost.
      WHAT IS ACTUALLY TRUE, STATED AS A NAMED OBSTRUCTION WITH ITS SCOPE. A substitute-sampling
      device EXISTS for leg 1 and is in this corpus: KN-LIT-101's BKZ 2.0 simulator, stated for
      blocksize >= 50, and KN-LIT-4429's sharp progressive-BKZ simulator, either of which emits
      the call list and blocksize ladder at beta = 400-900 at zero compute; eprint 2022/1343 adds
      a third for jump J > 1. Leg 1 is therefore validatable where it is used, modulo NULL-SIM and
      modulo the simulators' own stated validity range. THE OBSTRUCTION IS CONFINED TO LEG 2 AND
      HAS A MECHANISM: every simulator in this corpus propagates the log Gram-Schmidt PROFILE -
      KN-TECH-041 states it as "lattice attack costs are not measured; they are predicted from the
      shape of the reduced basis" - and the sieve database is not a function of the profile. Two
      bases with identical profiles can hand the next call pools of different usefulness, so the
      simulator's state variable provably does not contain the quantity leg 2 needs, and running
      it at beta = 900 returns no information about reuse. That is why leg 2 has no shortcut
      TODAY; it is not a statement that none can exist.
      FORWARD GUIDANCE - THE CLASSES THAT REMAIN, NAMED SO THE NEXT SESSION CAN TAKE ONE. (a) A
      POOL-AWARE SIMULATOR: extend a profile simulator with one additional state variable, the
      pool saturation deficit at call entry (the telescoping_potential transform above), calibrate
      its one-step propagation at reachable beta, and run it forward. This is a proposal, not a
      result, and it is the direct route to closing leg 2's transport gap. (b) COMPOSITION:
      measure leg 2 at reachable beta with g6k, take leg 1 from the simulator at cryptographic
      beta, and report the product with both legs' scopes attached - which is what this record now
      does. (c) EXTERNAL SECOND OPINION: KN-LIT-4429's cost model for progressive BKZ is an
      existing whole-schedule model and should be READ from primary text before any g6k arm is
      funded, because if it already decomposes cost per call this record is demoted to a citation,
      which would be a good outcome. TRANSFER ASSUMPTION, STATED PLAINLY: leg 2 is validated only
      inside [50, 85] and only in d4f regime 1, and transporting it to ML-KEM blocksizes crosses
      the beta = 74.1176 regime boundary as well as the dimension gap. The external anchors
      available instead are a schedule-strategy comparison on real LWE Challenge instances (eprint
      2022/1343, 7.2-23.4x = 2.85-4.55 bits) and KN-LIT-4429's relayed 50x = 5.64 bits up to
      dimension 160, both of which bound how much schedule choice alone can move a comparable
      quantity at larger scale without supplying R.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and this record cannot produce one: R is a
      sub-exponential-in-beta multiplicative factor, not an exponent. Explicitly: the outcome
      changes an ADDITIVE bit term, not the 0.292 coefficient. The candidate range for that term
      is bounded below by the regime-2 cold floor 2.550 bits and above by KN-TECH-040's `8d`
      convention at log2(8d) in [13.00, 14.00], so the range is [2.55, 14.00] bits and the whole
      point is to narrow it. Under the exponent-first bias of docs/target-result-profile.md this
      record is therefore NOT target-class on axis A1, and it says so: it is a required building
      block, because every bit count this lane produces is the product of an exponent and this
      factor, and the factor is currently set to 1 by convention in eighteen committed batches
      while the corpus itself records a rival convention 13 to 14 bits away.
    memory_exponent: >-
      NO ATTACK MEMORY EXPONENT IS CLAIMED. R as defined is a TIME ratio. The memory analogue is
      already settled in the committed record and in the opposite structural direction:
      EV-MLKEM-020 states "eta+1 > beta on all three sets so the final BDD/SVP call sets peak
      memory", i.e. peak memory is set by ONE call regardless of the schedule, so the schedule
      term multiplies time and leaves peak memory alone. That asymmetry is itself a reportable
      consequence: charging the schedule makes attacks look worse in time at unchanged memory,
      which moves the time-memory position of every memory-charged margin in this lane.
      The measurement's own peak memory is one sieve pool, the same as a single call.
    best_known: >-
      CORRECTED ON RED-TEAM REVIEW; the filed assertion that "there is no incumbent value, bound,
      or null floor for R anywhere in this repository" is WITHDRAWN.
      THE INCUMBENT CONVENTIONS, both in this corpus. (1) R = 1, core-SVP, KN-LIT-107, executed
      inside EV-MLKEM-020's committed 140.20 / 200.96 / 270.72 bit figures. (2) `8d` oracle calls,
      KN-TECH-040, i.e. log2 R in [13.00, 14.00] at ML-KEM's lattice dimensions under the part-(B)
      bracket. The two differ by 13-14 bits and the corpus records the difference as a known
      feature of the cost-model zoo rather than as an open question.
      THE INCUMBENT INSTRUMENT for leg 1 is KN-LIT-101's BKZ 2.0 simulator, with KN-LIT-4429's
      progressive-BKZ simulator and eprint 2022/1343's jump-aware simulator as alternates; any
      claim this record makes about the CALL COUNT is dominated by them and it now uses them
      rather than competing with them.
      WHAT HAS NO INCUMBENT, in ledger, coordination or the five corpus entries read in full: a
      value, bound or null floor for the WORK-WEIGHTED REUSE FACTOR - what fraction of a call's
      work a warm-started pool actually saves. That is the whole of the residual claim, and
      "no incumbent" here is a statement about five of the corpus's forty-two BKZ entries, not
      about the corpus. Externally, no verified value is known to this record; eprint 2022/1343
      bounds schedule VARIABILITY at 7.2-23.4x and KN-LIT-4429 at 50x, and neither reports R.
    hidden_overhead: >-
      (i) The cold floors are derived inside the core-SVP convention using two constants (0.292
      and g6k's applied d4f rule) that are themselves asymptotic or fitted; they are statements
      about the convention's arithmetic, not about a machine. (ii) R measured in vector-pair
      attempts hides all bucketing and filtering overhead, which is where a real sieve spends much
      of its time; that overhead is exactly the o(1) the exponent hides and it is NOT captured
      here. (iii) The measured window is one sixth to one tenth of the blocksizes that matter, a
      larger extrapolation ratio than the exemplar profile's validation experiments, and it
      additionally sits in the WRONG d4f REGIME - the clamp crossover at beta = 74.1176 lies
      inside the window. (iv) The schedule is frozen, so nothing here bounds what an optimising
      attacker achieves - the quantifier-order note above is the honest statement of that limit.
      (v) ADDED ON REVIEW: Stage 0S runs a simulator outside its stated validity range, and
      NULL-SIM can check it only at the reachable end; the leg-1 number therefore carries an
      unquantified extrapolation error of its own, which is smaller than leg 2's but is not zero.
    tradeoff_note: >-
      Because the schedule multiplies time and leaves peak memory at the final call's level, R
      moves an attack's position along the TIME axis only. Any memory-priced crossover
      (IDEA-20260816-70e41d) and any frontier-geometry argument (IDEA-20260821-46c09f) that uses
      per-call sieve cost as the time coordinate is implicitly setting R = 1 and should carry R as
      an explicit multiplier once it is measured. Parallelisation position: the schedule is
      inherently SEQUENTIAL across blocksizes - call t+1 needs call t's pool - so R is a factor
      that parallelism across processors does NOT reduce, unlike the intra-call sieve work. That
      asymmetry is a further reason the term deserves a measured value rather than a convention,
      and it is also the reason leg 2 cannot be recovered from a profile simulator: the sequential
      dependency the parallelism argument turns on is a dependency between POOLS, and pools are
      exactly what the profile projection discards.
  dominated_by: >-
    n/a (no attack result claimed), stated after checking rather than asserted. No attack cost
    triple exists here: nothing is solved, nothing is recovered, no query is made, so no row of
    any attack frontier applies and writing `null` would be a fabrication under AGENTS.md rule 5.
    CORRECTED ON RED-TEAM REVIEW: the enumeration recorded at filing covered only ledger/
    measurement records, and knowledge/ appeared nowhere in it - which is where the rows that
    dominate parts of this record live. The rows now checked, by axis:
    (i) CORPUS ROWS ON THE ORACLE-CALL AXIS: KN-LIT-107 (names the polynomial call count and its
    deliberate neglect) - DOMINATES this record's "nobody names R" claim outright and withdrew it;
    KN-TECH-040 (`8d` oracle calls) - DOMINATES any claim that R has no incumbent value;
    KN-LIT-101 (BKZ 2.0 simulator, estimates the call count without running BKZ) - DOMINATES this
    record's leg 1 entirely, which is why leg 1 is now a citation and a zero-compute arm rather
    than a measurement; KN-LIT-4429 (progressive-BKZ cost model and sharp simulator) - dominates
    leg 1 as well and may dominate the composite if its primary text decomposes cost per call,
    which Stage 0S must find out; KN-TECH-041 (profile simulation as a technique) - dominates any
