    provenance: retrieved
    claim: >-
      Reports "improvements of 7.2 to 23.4 times over the heuristic strategy employed in G6K" on
      six TU Darmstadt LWE Challenge parameter sets, via a strategy search (PSSearch) and "the
      first tight simulation for BKZ that can jump by J > 1 blocks". The fetched summary
