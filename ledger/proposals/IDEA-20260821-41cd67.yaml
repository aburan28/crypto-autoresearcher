      dimension, and R is a property of the SEQUENCE of calls; 8fbc86's design produces no call
      list and no accrual curve, and its metrics (wall-time, peak db, peak RSS per run) cannot be
      re-read to recover R even in principle. GOAL-MLKEM-003 and GOAL-MLKEM-004 between them ran
      eighteen batches and, per 8fbc86's own reading of the closure records, every use of the
      core-SVP constants was relayed rather than measured; neither goal's completion criteria
      mention the number of SVP calls. EXTERNALLY: the 7.2-23.4x spread that Xia et al. report
      between two schedule strategies at fixed target is, converted, 2.85-4.55 bits of pure
      schedule choice, which independently establishes that the schedule term is neither
      negligible nor a constant - but their paper optimises the strategy, it does not decompose
