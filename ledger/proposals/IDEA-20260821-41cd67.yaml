idea:
  id: IDEA-20260821-41cd67
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    The schedule term R that core-SVP sets to 1 is NAMED by this corpus (KN-LIT-107 charges one
    oracle call and says so), ESTIMATED by an instrument this corpus already holds (KN-LIT-101's
    BKZ 2.0 simulator, KN-LIT-4429's sharp progressive-BKZ simulator), and given a rival VALUE by
    this corpus's own cost-model zoo (KN-TECH-040's `8d` oracle-call convention) - so the open
    question is not R but its second leg: split R into a CALL LIST, which a profile simulator
    emits at FIPS 203 blocksizes at zero compute, and a WORK-WEIGHTED REUSE FACTOR, which no
    profile simulator can emit because its state variable is the Gram-Schmidt profile and not the
    sieve database, and measure only the second on a warm-started progressive schedule against an
    executed cold-restart null whose value is forced and derivable before the run
  class: mechanism
  claim: >-
    (A) THE FUDGE, NAMED - AND IT WAS ALREADY NAMED IN THIS CORPUS. The core-SVP convention that
    fixed ML-KEM's parameters charges a single SVP oracle call at the required blocksize beta. A
    real primal attack runs a reduction schedule: many blocksizes, many tours, one SVP call per
    block position per tour. Define R(beta) = (total sieve work over the entire schedule that
    reaches quality beta) / (work of one sieve call at beta). Core-SVP asserts, in effect, that R
    may be set to 1.
    WHAT THE FILED VERSION OF THIS RECORD GOT WRONG, CORRECTED ON RED-TEAM REVIEW: it asserted
    that no record in this repository measures, models, or NAMES R, and that there is "no
    incumbent value, bound, or null floor for R anywhere in this repository". Both are false of
    the knowledge corpus, which the filed screen never searched. KN-LIT-107 (New Hope,
    citation_verified: read) states the convention in exactly these terms - "BKZ calls an SVP
    oracle in block dimension b a polynomial number of times; the paper deliberately ignores that
    polynomial factor and charges only one oracle call, which it states plainly is a pessimistic
    estimate from the defender's point of view" - so R is named, its neglect is deliberate, and
    its sign is asserted. KN-LIT-101 (BKZ 2.0, Chen-Nguyen, citation_verified: read) supplies a
    simulator that "models BKZ behaviour for block size >= 50 and predicts approximately both
    output quality and running time", and its corpus relevance section says in terms: "price the
    SVP oracle calls ... Contrast with the core-SVP convention (KN-LIT-107), which deliberately
    ignores the oracle-call count that this simulator estimates." KN-TECH-040 records a rival
    VALUE: "Core-SVP charges one; other estimates charge `8d` calls for embedding dimension `d`.
    That is a multiplicative factor, i.e. an additive shift in bits." KN-LIT-4429
    (Aono-Wang-Hayashi-Takagi, citation_verified: read, bulk-seeded) presents "a model for
    estimating the computational cost of the proposed progressive BKZ". So: R is named, an
    instrument that estimates its call-count leg is in the corpus, and an incumbent alternative
    convention with a value is in the corpus. The record's repository negative is withdrawn.
    (A2) WHAT SURVIVES, AND IT IS ONE LEG OF TWO. R factors, exactly and by definition, as
    R = (call count) x (mean per-call work / final-call work). LEG 1, THE CALL LIST - which
    blocksizes, how many tours, how many block positions - is emitted by a profile simulator at
    any blocksize, including beta = 400-900, at zero compute. It is NOT open and this record no
    longer proposes to measure it. LEG 2, THE WORK-WEIGHTED REUSE FACTOR - what fraction of call
    t+1's work is saved by inheriting call t's sieve pool - is what no record in ledger/,
    coordination/ or knowledge/ holds a value, a bound or a null floor for, and it is the whole of
    the residual claim. KN-TECH-041 states the reason a simulator cannot supply it, and that
    reason is a named obstruction rather than an absence: "Lattice attack costs are not measured;
    they are predicted from the shape of the reduced basis", i.e. the simulator's entire state
    variable is the log Gram-Schmidt profile. The sieve database is not a function of the profile -
    two bases with the same profile can hand the next call pools of different usefulness - so
    running KN-LIT-101's or KN-LIT-4429's simulator at beta = 900 returns exactly nothing about
    leg 2. That is the obstruction, it is stated with a mechanism, and forward guidance for
    getting past it is in H1's validation plan.
    (B) THE TWO EXPLANATIONS OF LEG 2, AND THE ARITHMETIC THAT SEPARATES THEM. ALL NUMBERS IN THIS
    PARAGRAPH ARE DERIVATIONS PERFORMED BY HAND DURING THIS REPAIR ON 2026-08-24 FROM PUBLISHED
    CONSTANTS AND COMMITTED NUMBERS. THEY ARE NOT MEASUREMENTS, NO RUN RECORD BACKS THEM, AND
    STAGE 0 MUST REPRODUCE THEM PROGRAMMATICALLY BEFORE ANY OF THEM IS CITED AS A RESULT.
    EXPLANATION 1, THE FULL-PRICE READING: every call in the schedule costs close to the final
    call's price, so R tracks the call count. THIS IS NOT A NEW READING - IT IS KN-TECH-040's `8d`
    CONVENTION. Under KN-LIT-107's own primal construction the lattice dimension is d = m+n+1 with
    n = 512 / 768 / 1024 for the three FIPS 203 sets and m numerically optimised; taking m = n as
    an order-of-magnitude bracket gives d in [1025, 2049] and 8d in [8200, 16392], i.e.
    log2 R in [13.00, 14.00]. THE BRACKET IS A BRACKET: the committed m is not read in this record
    and Stage 0 must take d from the pinned estimator's own output rather than from this
    substitution.
    EXPLANATION 2, THE WARM-START READING: cost is dominated by the last few calls, because a
    progressive schedule hands each sieve a pool already produced by the previous one and each
    smaller blocksize is exponentially cheaper. THE COLD FLOOR, DERIVED IN CLOSED FORM AND
    CORRECTED TWICE DURING THIS REPAIR. Under the core-SVP convention with the free-dimension rule
    g6k ACTUALLY APPLIES (see B2), one call at blocksize beta costs 2^(0.292*(beta - f_app(beta)))
    and consecutive blocksizes differ by a fixed factor, so a fully cold schedule that runs every
    blocksize once costs a bounded multiple of its final call. There are TWO regimes and the filed
    version of this record used only one of them:
    REGIME 2 (beta >= 74.1176, which is where ML-KEM lives): f_app = int(11.5 + 0.075*beta), sieve
    dimension 0.925*beta - 11.5, cost exponent 0.27010*beta - 3.358, per-blocksize ratio
    2^0.27010 = 1.20590, and sum_{k>=0} 2^(-0.27010k) = 1/(1 - 2^-0.27010) = 5.857, i.e. 2.550
    bits. THE FILED VALUE 5.862 / 2.552 BITS IS WITHDRAWN AS AN ARITHMETIC SLIP; the corrected
    value is 5.857 / 2.550 and no branch of this record turns on the difference.
    REGIME 1 (40 <= beta < 74.1176, which is where the ENTIRE MEASUREMENT WINDOW of this record
    lives): the clamp binds, f_app = int((beta-40)/2), sieve dimension (beta+40)/2, cost exponent
    0.146*beta + 5.84, per-blocksize ratio 2^0.146 = 1.10653, and 1/(1 - 2^-0.146) = 10.390, i.e.
    3.377 bits. A ladder stepping by 1 from beta = 50 to beta = 70 gives the finite sum
    (1 - 2^(-0.146*21))/(1 - 2^-0.146) = 9.149, i.e. 3.194 bits.
    THE CONSEQUENCE IS A BRANCH-BOUNDARY CORRECTION AND IT IS THE SAME CLASS OF DEFECT THE RED
    TEAM FOUND IN THE SIBLING RECORD: the filed Stage 4 branch (i) read "log2 R <= 2.6, i.e. R at
    or below the one-call-per-blocksize sum 5.862". At beta = 50, 60, 70 - every cell this record
    can actually execute - the cold one-call-per-blocksize sum is 9.15 to 10.39, not 5.86, so the
    filed boundary would have classified a schedule with NO REUSE AT ALL as evidence of near-total
    reuse. The branch boundary is now regime-dependent and is frozen per cell in Stage 0.
    (B2) THE FREE-DIMENSION RULE THIS DERIVATION USES IS THE ONE g6k APPLIES, NOT THE ONE IT
    DEFAULTS TO. CORRECTED DURING THIS REPAIR. g6k does not apply default_dim4free_fun directly.
    Fetched verbatim from g6k/algorithms/bkz.py at master on 2026-08-24:
    `def default_dim4free_fun(blocksize): ... return int(11.5 + 0.075*blocksize)` and
    `def dim4free_wrapper(dim4free_fun, blocksize): if blocksize < 40: return 0; dim4free =
    dim4free_fun(blocksize); return int(min((blocksize - 40)/2, dim4free))`, with naive_bkz_tour,
    pump_n_jump_bkz_tour and slide_tour all calling the WRAPPER. The clamp binds exactly when
    0.5*beta - 20 < 11.5 + 0.075*beta, i.e. for beta < 31.5/0.425 = 74.1176. The filed record's
    citation quoted only the default function, which is why its cold floor was computed in the
    wrong regime for its own measurement window.
    (C) WHY THE ANSWER MATTERS AT THIS EXACT SIZE, RESTATED WITH THE ARITHMETIC RATHER THAN THE
    RHETORIC. EV-MLKEM-020's committed observations put the free-memory margins at
    +2.800527 / +6.041285 / +1.276377 bits for the three FIPS 203 sets; their sum is 10.118189
    bits. The gap between Explanation 1 (log2 R in [13.00, 14.00], the `8d` convention) and
    Explanation 2's ML-KEM-regime cold floor (2.550 bits) is 10.45 to 11.45 bits. So the gap
    exceeds every individual margin and exceeds their sum, by 0.33 to 1.33 bits. That inequality
    is now a computed statement rather than an assertion, and it is stated with its inputs: it
    depends on the d bracket of part (B), which Stage 0 must replace with the committed value.
    (D) THE CLAIM PROPER, FALSIFIABLE, TWO-SIDED, AND NARROWED TO LEG 2. At blocksizes beta in
    [50, 85] on ML-KEM-shaped q-ary bases with q = 3329, measured R(beta) - total sieve work of a
    full pump-and-jump progressive schedule reaching beta, divided by the work of its own final
    call - satisfies log2 R(beta) <= log2 R_cold(beta) - 1, i.e. warm-started reuse buys at least
    a factor 2 against the executed cold-restart arm at the same call list, AND log2 R is not
    increasing in beta faster than log2 of the schedule's own call count. A measured log2 R that
    tracks log2(tours x positions) instead is the clean refutation and would mean core-SVP is
    conservative by roughly the call count, i.e. that KN-TECH-040's `8d` convention is closer to
    the truth than core-SVP's 1 - which is a defensible and reportable finding in the opposite
    direction, and one that would put a number on a divergence the corpus currently records only
    as a list of conventions.
    (E) WHAT IS NOT CLAIMED. No attack, no break, no exponent moved. R is a cost-accounting
    quantity inside a convention, not a physical bound. Measurements at beta <= 85 say nothing
    about beta ~ 400-900 except through numbered heuristic H1, and H1 now covers only leg 2
    because leg 1 has a simulator shortcut. This record proposes no change to any committed number
    and asserts nothing about EV-MLKEM-015, EV-MLKEM-020 or any other record; AGENTS.md rule 12 is
    UNMET and inherited. NO DIRECTION IS DECLARED IMPOSSIBLE: the obstruction stated in (A2) is a
    statement about what a profile simulator's state variable contains, not about what any future
    simulator could contain, and H1 names the classes that remain.
  mechanism: >-
    THE MECHANISM BEING TESTED, STATED AS A CAUSAL CLAIM RATHER THAN A CORRELATION: in a
    progressive sieve schedule the pool produced at blocksize beta' is not discarded; it is
    extended and re-sieved at beta' + 1. If reuse is effective, the marginal work of the
    (beta'+1)-th step is the work of REPAIRING a pool that is already mostly saturated, not of
    building one, so the schedule's total work is a small multiple of its last step's work and R
    is nearly independent of how many block positions and tours the schedule contains. If reuse
    is ineffective - because extending the pool by one dimension invalidates most of it, or
    because the jump strategy skips positions in a way that forces rebuilds - then each call pays
    close to full price and R grows like the call count. THESE TWO MECHANISMS PREDICT DIFFERENT
    SHAPES FOR THE SAME MEASURED CURVE, not merely different magnitudes, which is what makes the
    measurement discriminating rather than descriptive.
    STAGE 0S - THE SIMULATOR ARM. ZERO COMPUTE, NO g6k, NO INSTRUMENT, AND IT SETTLES LEG 1 AT
    FIPS 203 BLOCKSIZES. ADDED ON RED-TEAM REVIEW; the filed record had no such arm because it
    declared no shortcut existed. Instantiate a BKZ profile simulator - KN-LIT-101's BKZ 2.0
    simulator is the corpus's named instrument and is stated for blocksize >= 50, KN-LIT-4429's
    sharp progressive-BKZ simulator is the second - on the committed ML-KEM primal bases, and emit
    (i) the full CALL LIST for a schedule reaching each of the effective blocksizes implied by
    EV-MLKEM-020, i.e. one row per (blocksize, block position, tour); (ii) the per-call blocksize
    ladder; (iii) the resulting call count, against KN-TECH-040's `8d` convention and against the
    part-(B) bracket log2(8d) in [13.00, 14.00]. Report the signed discrepancy. THIS ARM CAN FAIL
    AND ITS FAILURE IS REPORTABLE: if the simulated call count disagrees with 8d by more than a
    factor 2, then the corpus's own two statements about the oracle-call count disagree with each
    other at ML-KEM parameters, which is a finding about the cost-model zoo and is worth more than
    anything the g6k arm can produce. If it agrees, Explanation 1's call-count leg is settled
    without instrumentation and the g6k arm is scoped to leg 2 alone. FREEZE IN THE SAME STEP the
    regime-dependent cold floor of part (B) - 3.377 bits (or the finite-ladder 3.194 bits) in
    regime 1 where the measurement lives, 2.550 bits in regime 2 where ML-KEM lives - and the
    beta = 74.1176 crossover, so that no branch is ever decided against the wrong regime's
    constant.
    STAGE 1 - INSTRUMENT AND WORK UNIT. Rebuild the GOAL-MLKEM-004 instrument per KN-TECH-14efa5
    and reproduce its committed check (g6k bgj1 dim 70, q = 3329 -> database 75511 vectors,
    335.2 s) before anything else is trusted. Instrument the sieve to count a HARDWARE-INDEPENDENT
    work unit - the number of vector-pair inner products (equivalently reduction attempts)
    performed - alongside wall-time and peak database size. The work unit is the primary metric
    precisely because wall-time is a property of the machine and the sibling record
    IDEA-20260807-8fbc86 already owns the wall-time axis. THIS STAGE IS GATED ON STAGE 0S: if the
    simulator arm has not run and been reported, no g6k time is spent, because the expensive arm
    answers only the leg the cheap arm cannot.
    STAGE 2 - THE TRACKED OBJECT. Run a full pump-and-jump progressive schedule on a fixed basis
    up to target blocksize beta. Emit, per SVP call, the tuple (blocksize at that call, block
    position, tour index, work units consumed, pool size at entry, pool size at exit). The tracked
    object is the CUMULATIVE WORK ACCRUAL CURVE W(t) = (work consumed by the first t calls) /
    (total work), a monotone curve on [0, 1] x [0, 1], together with the single scalar
    R = total work / work of the final call.
    STAGE 3 - THE FORCED VALUES, DERIVED BEFORE ANY RUN (KN-TECH-1a5b7e obligation 4). Three
    bounds are forced and must be computed and frozen first, because the informative content of
    the measurement is WHERE IN BETWEEN R falls, not which side of a threshold it is on.
    LOWER: R >= 1 trivially, with equality iff the schedule is a single call, which is the
    baseline slice. UPPER: R <= R_cold, where R_cold is computed in closed form from the measured
    single-call cost curve by summing full-price calls over the schedule's actual call list with
    no reuse. THIRD, ADDED ON REVIEW: the one-call-per-blocksize cold sum is itself forced by the
    convention and the clamp, at 9.149 (3.194 bits) for a 50-to-70 unit ladder and at most 10.390
    (3.377 bits) anywhere in regime 1 - so reporting "R is below 10.39" in the measured window
    carries ZERO information and is inadmissible as a headline. All three are derivable from data
    the batch already has, so a result reported as "warm beats cold" or as "R is below the cold
    floor" carries zero information and must not be the headline.
    STAGE 4 - WHAT EACH OUTCOME MEANS, DECLARED BEFORE THE RUN, WITH THE BOUNDARIES NOW SET PER
    REGIME AND PER LADDER RATHER THAN AGAINST A SINGLE SCALAR. Let C(beta) = log2 of the executed
    cold-restart arm's R at the same call list, and let C0(beta) be the frozen closed-form
    one-call-per-blocksize floor at that beta (3.194 bits for the 50-to-70 unit ladder; recomputed
    per ladder in Stage 0S). (i) log2 R <= C0(beta): reuse is near-total, the repeats are nearly
    free, core-SVP's neglect of the repeated calls is worth under C0 bits at the measured
    blocksizes, and Explanation 1 is refuted there. (ii) C0(beta) < log2 R <= C(beta) - 1: reuse
    is partial and the schedule term is a mid-size correction that should be carried explicitly in
    any memory-charged cost model. (iii) log2 R > C(beta) - 1 and growing with the call count:
    Explanation 2 is refuted, core-SVP is conservative by roughly the call count, KN-TECH-040's
    `8d` convention is the better reading, and every margin in this lane is understated by that
    much - which would be the single most consequential negative the lane could produce.
    (iv) NEITHER branch, declared in advance: R fails to stabilise across seeds or bases, in which
    case R is not a property of the schedule and nothing is reported. This branch exists because
    GOAL-MLKEM-004 batch 4 emitted C_NEITHER on a two-outcome rule and reporting it honestly was
    the right move; the rule here carries the branch from the start.
