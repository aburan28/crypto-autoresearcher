    results: >-
      CORRECTED ON RED-TEAM REVIEW. The filed version of this field asserted "NO record in this
      repository measures, models, or names the schedule term R". THAT IS FALSE, and the falsity
      is in knowledge/, which the filed screen never searched.
      WHAT THE CORPUS ACTUALLY HOLDS ON THIS EXACT QUANTITY. (1) KN-LIT-107 NAMES R and its
      neglect: core-SVP "deliberately ignores that polynomial factor and charges only one oracle
      call, which it states plainly is a pessimistic estimate from the defender's point of view."
      (2) KN-LIT-101 supplies an INSTRUMENT that estimates R's call-count leg without running BKZ,
      for blocksize >= 50, and its corpus entry states the contrast with core-SVP in exactly those
      words. (3) KN-TECH-040 records an incumbent rival VALUE - the `8d` oracle-call convention -
      and characterises the difference as "a multiplicative factor, i.e. an additive shift in
      bits". (4) KN-TECH-041 records that lattice attack costs "are not measured; they are
      predicted from the shape of the reduced basis", which is both why a simulator can supply
      leg 1 and why it cannot supply leg 2. (5) KN-LIT-4429 presents an external cost MODEL for
      progressive BKZ specifically, and reports its variant "approximately 50 times faster than
      BKZ 2.0 ... up to 160 dimensions", i.e. 5.64 bits of schedule-and-algorithm choice at
      dimensions far above this record's window. (6) KN-LIT-7662 records that the corpus holds 42
      BKZ entries and 3 on progressive BKZ, of which this screen read five in full.
      WHAT SURVIVES AS A REPOSITORY NEGATIVE, AND IT IS NARROWER AND IS THE WHOLE RESIDUAL CLAIM:
      nothing in ledger/, coordination/ or knowledge/ holds a value, a bound, or a null floor for
      LEG 2 - the work-weighted saving a warm-started sieve pool buys over a cold restart at a
      matched call list. KN-TECH-041's own closing line, "No basis profile has been computed in
      this repository", is the corpus's statement that even leg 1 has never been INSTANTIATED here
      although its instrument is recorded; leg 2 has neither instrument nor value.
      IN-LANE, UNCHANGED: the nearest record is IDEA-20260807-8fbc86, which fits (c_T, c_M) from
      wall-time and peak database size across dimensions 50-85 - that is the cost of ONE call as a
      function of its dimension, and R is a property of the SEQUENCE of calls; 8fbc86's design
      produces no call list and no accrual curve, and its metrics cannot be re-read to recover R
      even in principle. Neither GOAL-MLKEM-003's nor GOAL-MLKEM-004's completion criteria mention
      the number of SVP calls.
      EXTERNALLY: Xia et al.'s 7.2-23.4x spread between two schedule strategies at fixed target
      is, converted, 2.85-4.55 bits of pure schedule choice, and KN-LIT-4429's 50x is 5.64 bits of
      schedule-plus-algorithm choice - which independently establishes that the schedule term is
      neither negligible nor a constant. Neither decomposes where the cost lands, and the
      2022/1343 fetch confirmed the abstract makes no per-tour statement.
    verdict: >-
      UNVERIFIED, AND NARROWED ON REVIEW. One external citation is retrieved and re-readable
      (eprint 2022/1343), one source file was fetched verbatim twice (g6k bkz.py), and five corpus
      entries were read in full during the repair; the rest of the external picture is recalled and
      flagged as such. This record asserts NOTHING about whether the sieving literature has
      measured leg 2 - the quantity is natural enough that implementers plausibly track it, and no
      claim of external novelty is made. Five of the corpus's forty-two BKZ entries were read, so
      the in-corpus negative is a screen result and not a closure.
      CLAIMED NEW RELATIVE TO THIS REPOSITORY, AFTER THE CORRECTION: (i) the factorisation of R
      into a simulator-supplied call list and a work-weighted reuse factor, with the named
      obstruction (KN-TECH-041's profile-only state variable) that separates them; (ii) leg 2 as a
      tracked object with an executed cold-restart null whose value is forced and derived before
      the run; (iii) the regime-dependent closed-form cold floors 10.390 / 3.377 bits (regime 1,
      the measurement window) and 5.857 / 2.550 bits (regime 2, ML-KEM), which required the g6k
      clamp of part (B2) and which no record in this program carries; (iv) the observation that
      the corpus's own two oracle-call conventions differ by 10.45-11.45 bits against committed
      margins summing to 10.118189 bits.
      EXPLICITLY WITHDRAWN AS NOVELTY CLAIMS: (a) that no record in this repository measures,
      models or names R - KN-LIT-107 names it, KN-LIT-101 estimates it, KN-TECH-040 values it;
      (b) that there is no incumbent value, bound or null floor for R - `8d` is one; (c) the
      closed form "1/(1 - 2^-0.27010) = 5.862", both because 5.862 is arithmetically wrong (5.857)
      and because it is the wrong regime for this record's own measurement window; (d) that
      Explanation 1's order-2^13 figure is a reading of this record's - it is KN-TECH-040's `8d`
      convention arrived at by a different route.
      ASSEMBLED FROM KNOWN PARTS: the instrument is GOAL-MLKEM-004's, the margins are
      EV-MLKEM-020's, the simulator is KN-LIT-101's, progressive BKZ and pump-and-jump are
      standard, and the null discipline is KN-TECH-1a5b7e's.
  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record: dual-attack score geometry (six
      GOAL-MLKEM-004 batches plus eight in-lane proposals), estimator-arithmetic differencing
      (twelve GOAL-MLKEM-003 batches), the module-structure discount (four in-lane proposals),
      and single-call resource fitting (IDEA-20260807-8fbc86). ADDED ON REVIEW, a fifth family
      that the filed record failed to declare because it did not know the corpus held it: BASIS
      PROFILE SIMULATION (KN-LIT-101, KN-LIT-4429, KN-TECH-041). That family IS used here, but
      only as a zero-compute instrument for leg 1, and explicitly NOT as the lens - the lens is
      the SIEVE POOL'S SURVIVAL ACROSS CALLS, which is precisely the state variable the profile
      family discards.
    tracked_object: >-
      W(t), the cumulative fraction of total sieve work consumed by the first t calls of a
      reduction schedule, plus the derived scalar R = total work / final-call work. Work is
      counted in vector-pair reduction attempts, a hardware-independent unit. The object is
      carried alongside pool-size-at-entry per call, which is what makes the REUSE mechanism
      (leg 2) separable from the blocksize mechanism (leg 1) inside one run.
    lossiness: >-
      LOSSY AND ALGEBRAICALLY SO. The full state of a reduction schedule is the entire sequence
      of bases, pools and Gram-Schmidt profiles - at the committed dim-70 scale that is 75511
      vectors PER CALL, and a schedule makes hundreds of calls. The projection retains a monotone
      scalar curve. It discards every vector, every basis, every profile, the identity of which
      block position was reduced, and all geometry. This is emphatically not a change of
      coordinates: from W(t) one cannot recover a single basis vector, and two schedules with
      completely different geometric behaviour can have identical W. THE COMPATIBILITY CONDITION
      that makes it a legitimate object rather than a summary statistic: work is ADDITIVE over
      calls and a schedule is a SEQUENCE of calls, so the target's own composition operation
      (append one call) acts on W by appending one increment - the retained part propagates
      deterministically under the operation that defines the target. Nothing about the discarded
      geometry is needed to predict the next value of W given the next call's work.
      THE CONTRAST THAT MAKES THIS OBJECT DIFFERENT FROM THE CORPUS'S EXISTING ONE, ADDED ON
      REVIEW: a profile simulator (KN-LIT-101, KN-TECH-041) projects the same underlying state
      onto the log Gram-Schmidt profile. That projection is ALSO lossy and ALSO compatible with
      the operation it models (BKZ's action on the profile), which is why it works for leg 1. It
      is NOT compatible with the operation leg 2 models, because the sieve database is not a
      function of the profile. The two objects are lossy in different directions, which is the
      cleanest available statement that this record is not a repackaging of BKZ simulation.
    propagation: >-
      One step is one SVP call. W(t+1) = W(t) + w_{t+1}/W_total, deterministic given the call's
      work. The interesting propagation law is the one being MEASURED: how w_{t+1} depends on the
      pool inherited from call t. Under total reuse, w_{t+1} is small whenever the blocksize did
      not increase; under no reuse, w_{t+1} depends only on the blocksize. Those two laws are
      distinguishable from the emitted per-call tuples with no additional experiment, which is the
      cheap internal falsifier: regress w on (blocksize, pool-size-at-entry) and see which
      predictor carries the variance.
    survival_score: >-
      Survives the entire schedule by construction - the object is defined on the whole run and
      does not dissolve. What CAN dissolve is its stability: if R varies more across seeds and
      bases than it does across blocksizes, then R is not a property of the schedule and the
      object is useless. That instability is the pre-declared NEITHER branch and is reported as
      the seed-to-seed spread of R at fixed beta, against the beta-to-beta spread at fixed seed.
      Reported as a ratio of those two spreads; a ratio near or above 1 means the object dissolved
      at step one. SECOND DISSOLUTION POINT, ADDED ON REVIEW: the object survives transport to
      beta = 400-900 only through H1, and H1 now covers leg 2 alone because leg 1 has a simulator
      shortcut - so the transport gap is narrower than the filed record claimed but is not closed.
  null_object_control: >-
    Structured on KN-TECH-1a5b7e's checklist, with obligation 4 done first because this design is
    at high risk of a forced contrast.
    FORCED VALUE DERIVATION, BEFORE ANY RUN, NOW WITH THREE ITEMS. (1) Warm-start work is bounded
    above by cold-restart work call for call, because the warm sieve begins from a superset of
    what the cold sieve begins from. THEREFORE "WARM BEATS COLD" IS FORCED AND CARRIES NO
    INFORMATION, and any report whose headline is that inequality is inadmissible. The informative
    quantity is the RATIO R_warm / R_cold in [0, 1], and its value is not forced. (2) ADDED ON
    REVIEW: in the measured window the g6k clamp forces the per-blocksize cost ratio to 2^0.146,
    hence a one-call-per-blocksize cold sum of at most 10.390 (3.377 bits) and 9.149 (3.194 bits)
    for a 50-to-70 unit ladder. Reporting "log2 R is below 3.4 at beta = 70" is therefore a FORCED
    fact about the convention and the clamp, not a finding about reuse, and it is inadmissible as
    a headline - the filed record's branch (i) would have reported exactly that. (3) R >= 1 with
    equality iff the schedule is a single call, which is the baseline slice.
    NULL-C, THE COLD-RESTART SCHEDULE: execute the identical call list with the pool discarded and
    rebuilt between every call. This is a real run, not a model. Its expected value is separately
    DERIVABLE in closed form from the measured single-call cost curve, so the run doubles as a
    consistency check on the instrument: if executed cold work disagrees with the closed-form cold
    prediction by more than the declared tolerance, the work counter is wrong and nothing is
    reported. CAN IT FAIL: yes, in two ways - the derivation may disagree with the execution, and
    R_warm/R_cold may come back at 1.0, meaning reuse buys nothing and the whole mechanism is
    refuted.
    NULL-S, THE SHUFFLED-SCHEDULE CONTROL: execute the same MULTISET of calls in a randomised
    blocksize order, destroying the progressive structure while preserving the call count, the
    blocksizes and the total nominal work. Progressive structure must beat shuffled structure; if
    it does not, "progressive" contributes nothing and the accrual shape is an artefact of the
    call multiset. CAN IT FAIL: yes - and if it does not fail, the object is about the multiset,
    not the schedule.
    NULL-SIM, THE SIMULATOR CROSS-CHECK, ADDED ON RED-TEAM REVIEW AND THE ONLY CONTROL HERE WHOSE
    ANSWER KEY IS NOT THIS PROGRAM'S. Run Stage 0S's profile simulator on the SAME reachable
    bases the g6k arm uses and compare its emitted call list against the executed one, call for
    call. CAN IT FAIL: yes, and its failure is the more interesting outcome - a simulator that
    cannot reproduce the executed call list at beta = 50-70 has no standing to emit one at
    beta = 900, which voids Stage 0S's transport of leg 1 and is reported as such. A simulator
    that does reproduce it is the only evidence in this design that leg 1 transports at all.
    SENSITIVITY DEMONSTRATION, COMPARATOR NAMED, THRESHOLD PRE-DECLARED: the comparator is NULL-C
    (the arm the null is about, not whichever arm looks best). The statistic must separate the two
    by at least a factor 2 in R at beta = 70, declared before the run; the dynamic range is
    exhibited at both ends by a deliberately crippled reuse mode (pool truncated to 10% between
    calls) and by full reuse. MONOTONICITY: at least three interior truncation fractions
    (10%, 40%, 70%) are run and monotonicity of R in the truncation fraction is REPORTED, not
    assumed - KN-TECH-1a5b7e's refinement is explicit that two endpoints do not establish a
    direction.
    COMPARATOR N_DRAWS: NULL-C and NULL-S are executed on at least 8 independent bases each and
    reported as intervals; a residual read against one draw is not reportable (mode 5).
    VERDICT ON THE NULL ARM FIRST: the four-branch rule of Stage 4, with its regime-correct
    boundaries, is emitted on NULL-C before the warm arm is read. If it emits the same branch on
    both, the rule discriminates nothing and must be rewritten.
  discriminated_from:
  - >-
    KN-LIT-101 (BKZ 2.0) and KN-LIT-4429 (sharp progressive-BKZ simulator) are the corpus's
    instruments for the CALL-COUNT leg, and KN-TECH-041 is the technique entry that describes what
    they propagate. ADDED ON RED-TEAM REVIEW; the filed record did not know they were here and
