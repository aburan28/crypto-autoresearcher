idea:
  id: IDEA-20260821-41cd67
  question_id: RQ-MLKEM-003
  added: '2026-08-21'
  title: >-
    Core-SVP charges ONE sieve call where a real reduction makes thousands, and the standard
    defence is that this is conservative - but nobody in this program has measured by how much,
    and the mechanism that could make it nearly free (warm-started pool reuse across blocksizes)
    predicts a factor an order of magnitude smaller than the naive tour count: track the
    CUMULATIVE WORK ACCRUAL CURVE across a whole progressive reduction schedule, normalised by
    its own final call, against a cold-restart null whose value is forced and derivable before
    the run
  class: mechanism
  claim: >-
    (A) THE FUDGE, NAMED AND SIZED. The core-SVP convention that fixed ML-KEM's parameters
    charges a single SVP oracle call at the required blocksize beta. A real primal attack runs a
    reduction schedule: many blocksizes, many tours, one SVP call per block position per tour.
    Define R(beta) = (total sieve work over the entire schedule that reaches quality beta) /
    (work of one sieve call at beta). Core-SVP asserts, in effect, that R may be set to 1 and
    that doing so is conservative. TWO QUANTITATIVELY INCOMPATIBLE EXPLANATIONS OF R ARE BOTH
    CURRENTLY DEFENSIBLE IN THIS PROGRAM, AND NEITHER HAS BEEN MEASURED HERE.
    EXPLANATION 1, THE TOUR-COUNT READING: R is of order (number of tours) x (lattice dimension
    minus beta), because that is how many SVP calls a BKZ schedule makes. At ML-KEM-shaped
    dimensions with a handful of tours that is of order 2^13, i.e. core-SVP understates real
    attack cost by roughly 13 bits.
    EXPLANATION 2, THE WARM-START READING: cost is dominated by the last few calls, because a
    progressive schedule hands each sieve a pool already produced by the previous one and each
    smaller blocksize is exponentially cheaper. DERIVATION, ARITHMETIC ONLY, NOT A MEASUREMENT:
    under the core-SVP convention itself, with the g6k default free-dimension rule
    f(beta) = 11.5 + 0.075*beta, one call at blocksize beta costs 2^(0.292*(beta - f(beta))) =
    2^(0.27010*beta - 3.358), so consecutive blocksizes differ by a factor 2^0.27010 = 1.2058 and
    the sum over ALL blocksizes up to beta, WITH NO REUSE AT ALL, is 1/(1 - 2^-0.27010) = 5.862
    times the final call, i.e. 2.552 bits. So even a fully cold progressive schedule that runs
    every blocksize once costs only 2.55 bits more than core-SVP; the 13 bits of Explanation 1
    live entirely in the REPEATED CALLS AT FIXED BLOCKSIZE across block positions and tours, and
    whether those repeats cost full price or are amortised by pool reuse is an empirical question
    with a definite answer at blocksizes this program can execute.
    (B) WHY THE ANSWER MATTERS AT THIS EXACT SIZE. EV-MLKEM-020's committed observations put the
    free-memory margins at +2.800527 / +6.041285 / +1.276377 bits for the three FIPS 203 sets.
    The gap between the two explanations of R is roughly 10 bits. THE UNMEASURED SCHEDULE TERM IS
    LARGER THAN EVERY MARGIN THIS LANE HAS ARGUED ABOUT, ADDED TOGETHER, AND IT POINTS IN THE
    DIRECTION THAT MAKES ML-KEM SAFER, WHICH IS PRECISELY WHY NOBODY CHECKS IT.
    (C) THE CLAIM PROPER, FALSIFIABLE, TWO-SIDED. At blocksizes beta in [50, 85] on ML-KEM-shaped
    q-ary bases with q = 3329, measured R(beta) - total sieve work of a full pump-and-jump
    progressive schedule reaching beta, divided by the work of its own final call - satisfies
    log2 R(beta) <= 6, i.e. warm-started reuse holds the schedule term at least 7 bits below the
    naive tour-count reading, AND log2 R is not increasing in beta faster than log2 of the
    schedule's own call count. A measured log2 R that tracks log2(tours x positions) instead is
    the clean refutation and would mean core-SVP is conservative by roughly the tour count, which
    is a defensible and reportable finding in the opposite direction.
    (D) WHAT IS NOT CLAIMED. No attack, no break, no exponent moved. R is a cost-accounting
    quantity inside a convention, not a physical bound. Measurements at beta <= 85 say nothing
    about beta ~ 400-900 except through numbered heuristic H1. This record proposes no change to
    any committed number and asserts nothing about EV-MLKEM-015, EV-MLKEM-020 or any other
    record; AGENTS.md rule 12 is UNMET and inherited.
  mechanism: >-
    THE MECHANISM BEING TESTED, STATED AS A CAUSAL CLAIM RATHER THAN A CORRELATION: in a
    progressive sieve schedule the pool produced at blocksize beta' is not discarded; it is
    extended and re-sieved at beta' + 1. If reuse is effective, the marginal work of the
    (beta'+1)-th step is the work of REPAIRING a pool that is already mostly saturated, not of
    building one, so the schedule's total work is a small multiple of its last step's work and R
    is nearly independent of how many block positions and tours the schedule contains. If reuse
    is ineffective - because extending the pool by one dimension invalidates most of it, or
    because the jump strategy skips positions in a way that forces rebuilds - then each call pays
    close to full price and R grows like the call count. THESE TWO MECHANISMS PREDICT DIFFERENT
    SHAPES FOR THE SAME MEASURED CURVE, not merely different magnitudes, which is what makes the
    measurement discriminating rather than descriptive.
    STAGE 1 - INSTRUMENT AND WORK UNIT. Rebuild the GOAL-MLKEM-004 instrument per KN-TECH-14efa5
    and reproduce its committed check (g6k bgj1 dim 70, q = 3329 -> database 75511 vectors,
    335.2 s) before anything else is trusted. Instrument the sieve to count a HARDWARE-INDEPENDENT
    work unit - the number of vector-pair inner products (equivalently reduction attempts)
    performed - alongside wall-time and peak database size. The work unit is the primary metric
    precisely because wall-time is a property of the machine and the sibling record
    IDEA-20260807-8fbc86 already owns the wall-time axis.
    STAGE 2 - THE TRACKED OBJECT. Run a full pump-and-jump progressive schedule on a fixed basis
    up to target blocksize beta. Emit, per SVP call, the tuple (blocksize at that call, block
    position, tour index, work units consumed, pool size at entry, pool size at exit). The tracked
    object is the CUMULATIVE WORK ACCRUAL CURVE W(t) = (work consumed by the first t calls) /
    (total work), a monotone curve on [0, 1] x [0, 1], together with the single scalar
    R = total work / work of the final call.
    STAGE 3 - THE FORCED VALUES, DERIVED BEFORE ANY RUN (KN-TECH-1a5b7e obligation 4). Two bounds
    are forced and must be computed and frozen first, because the informative content of the
    measurement is WHERE IN BETWEEN R falls, not which side of a threshold it is on.
    LOWER: R >= 1 trivially. UPPER: R <= R_cold, where R_cold is computed in closed form from the
    measured single-call cost curve by summing full-price calls over the schedule's actual call
    list with no reuse. Both are derivable from data the batch already has, so a result reported
    as "warm beats cold" carries zero information and must not be the headline.
    STAGE 4 - WHAT EACH OUTCOME MEANS, DECLARED BEFORE THE RUN. (i) log2 R <= 2.6, i.e. R at or
    below the one-call-per-blocksize sum 5.862: reuse is near-total, the repeats are nearly free,
    core-SVP's neglect of the schedule is worth under 3 bits, and Explanation 1 is refuted at the
    measured blocksizes. (ii) 2.6 < log2 R <= 6: reuse is partial and the schedule term is a
    mid-size correction that should be carried explicitly in any memory-charged cost model.
    (iii) log2 R > 6 and growing with the call count: Explanation 2 is refuted, core-SVP is
    conservative by roughly the call count, and every margin in this lane is understated by that
    much - which would be the single most consequential negative the lane could produce.
    (iv) NEITHER branch, declared in advance: R fails to stabilise across seeds or bases, in which
    case R is not a property of the schedule and nothing is reported. This branch exists because
    GOAL-MLKEM-004 batch 4 emitted C_NEITHER on a two-outcome rule and reporting it honestly was
    the right move; the rule here carries the branch from the start.
