    at all here, given KN-TECH-041's "No basis profile has been computed in this repository": ~0.7
    - it is standard tooling but it is new to this program. (ii) That Stage 0S's call count and
    KN-TECH-040's `8d` agree within a factor 2: ~0.6, and a disagreement is the more interesting
    outcome. (iii) That the instrument rebuilds and the sieve can be instrumented for pair counts
    without perturbing the schedule: ~0.6 - g6k's counters may not be exposed and adding them is
    the main implementation risk, and this is the single most likely reason the leg-2 arm returns
    nothing. (iv) That a full ladder to beta = 70 with 4x tours fits the budget on eight bases:
    ~0.6, extrapolating from the committed 335.2 s single call. (v) That the executed cold arm
    matches its closed-form regime-1 prediction within tolerance: ~0.75. (vi) That R_warm/R_cold
    comes in below 0.5 at beta = 70: ~0.6 - I lean toward the warm-start explanation but the jump
    strategy could easily force rebuilds I am not modelling. (vii) That the slope against call
    count separates from both 0 and 1 with non-overlapping intervals: ~0.5. (viii) That the batch
    produces a defensible leg-1 answer, or a defensible statement that the simulator could not be
    instantiated: ~0.85 - this is now the highest-probability deliverable in the record and it
    costs no compute. (ix) That it also produces a defensible leg-2 R with an interval: ~0.6.
    I would bet against (iii) more readily than against any mathematical part, which is a
    statement about tooling risk and is why the sibling IDEA-20260821-46c09f is the cheaper first
    move.
  repair_provenance: >-
    Repaired 2026-08-24 by the idea-generator against BLOCKING 4 of the independent red-team screen
    for RQ-MLKEM-003. WHAT THE FINDING SAID: the record's repository negative was contradicted by
    KN-LIT-101, whose corpus entry names the oracle-call count and names an instrument that
    estimates it; every grep in the novelty screen was scoped to ledger/proposals/ and knowledge/
    was never searched; and H1's "there is no sampling shortcut for R at cryptographic blocksizes"
    was a closure without a named obstruction, load-bearing because it justified the high
    implementation and compute cost. WHAT WAS DONE, in the order the finding asked for it:
    (1) READ IN FULL: knowledge/literature/KN-LIT-101.md, knowledge/literature/KN-LIT-107.md,
    knowledge/techniques/KN-TECH-040.md, knowledge/techniques/KN-TECH-041.md,
    knowledge/literature/KN-LIT-4429.md. Re-ran the novelty screen over knowledge/ with a pattern
    matching oracle-call, simulator, tour and progressive-BKZ phrasing; the actual pattern and its
    returns are recorded in novelty_screen.method.
    (2) CORRECTED novelty_screen.results, target_complexity.best_known and dominated_by against
    what those five entries contain. The assertions "NO record in this repository measures, models,
    or names the schedule term R" and "no incumbent value, bound, or null floor for R anywhere in
    this repository" are withdrawn in place, with the superseding facts named: KN-LIT-107 names it,
    KN-LIT-101 estimates it, KN-TECH-040 values it at `8d`.
    (3) ADDED THE ZERO-COMPUTE SIMULATOR ARM (mechanism STAGE 0S, minimal_test LEG 1) that emits
    the call list and per-call blocksize ladder at FIPS 203 blocksizes and compares the count
    against `8d`, so the call-count leg is settled without g6k instrumentation; and added NULL-SIM
    plus a falsification condition so that the new arm has a possible negative outcome rather than
    being an arm that cannot fail.
    (4) WITHDREW the "no sampling shortcut exists" sentence in H1.validation_plan and replaced it
    with a named obstruction (KN-TECH-041: a profile simulator's state variable is the log
    Gram-Schmidt profile, and the sieve database is not a function of the profile, so the shortcut
    that exists for leg 1 provably does not extend to leg 2) plus forward guidance naming three
    classes that remain: a pool-aware simulator, composition of a measured leg 2 with a simulated
    leg 1, and reading KN-LIT-4429's progressive-BKZ cost model from primary text first.
    (5) REDID TWO DERIVATIONS RATHER THAN SOFTENING THEM, both found during the repair and neither
    named in the finding. First, the g6k free-dimension rule: I independently re-fetched
    g6k/algorithms/bkz.py on 2026-08-24 and confirmed dim4free_wrapper's min((beta-40)/2, .) clamp
    and its three callers, so the filed citation's claim field is corrected. Second, the cold-floor
    closed form: 1/(1 - 2^-0.27010) is 5.857 (2.550 bits), not the filed 5.862 (2.552 bits), AND
    that constant is the wrong regime for this record's own measurement window - under the clamp,
    beta in [50, 74.1176) gives per-blocksize ratio 2^0.146 and a floor of 10.390 (3.377 bits),
    9.149 (3.194 bits) for a 50-to-70 unit ladder. The filed Stage 4 branch (i) at log2 R <= 2.6
    therefore sat BELOW the forced no-reuse floor in its own window and would have classified a
    schedule with no reuse at all as near-total reuse. Every branch boundary and the first
    prediction are restated relative to the executed cold arm and to a frozen regime-dependent
    table.
    (6) LOWERED recommended_priority from high to medium. Reason, stated because a downgrade is a
    result: the record's headline repository negative was false, its most consequential leg
    (Explanation 1's 13 bits) turns out to be KN-TECH-040's already-recorded `8d` convention
    rather than a discovery, and the cheap zero-compute leg is now separable from the expensive
    g6k leg - so the high-implementation, high-compute arm should not be prioritised before the
    cheap arm reports. The residual leg-2 claim is real and unmeasured and the record is not
    withdrawn.
