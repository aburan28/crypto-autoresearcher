    do not carry the sieve database. KN-TECH-041 states the projection explicitly - costs "are
    predicted from the shape of the reduced basis" - and the shape does not determine how much of
    call t's pool survives into call t+1. This record USES them for leg 1 (Stage 0S) and measures
    only leg 2, so the relationship is composition, not competition. If a simulator with a pool
    state variable is ever built, it dominates this record's g6k arm outright and this record says
    so in dominated_by.
  - >-
    KN-TECH-040's `8d` oracle-call convention is the incumbent VALUE for leg 1 and is now cited
    rather than rediscovered. ADDED ON REVIEW. That convention asserts a call COUNT; R weights
    calls by WORK. The two coincide only if every call costs the final call's price, which is
    exactly the no-reuse reading this record is testing - so `8d` is best read as the upper end of
    R's range under Explanation 1, and this record's residual contribution is the fraction of that
    range that warm-starting actually removes. Nothing here proposes that KN-TECH-040 is wrong.
  - >-
    IDEA-20260807-8fbc86 measures (c_T, c_M) by fitting wall-time and peak database size against
    dimension for single sieve runs, and anchors the instrument on an LWE Challenge. It is a
    per-call cost curve. R is a functional of the SEQUENCE of calls and is invariant to a uniform
    rescaling of the per-call curve - so 8fbc86 could be completely right about c_T and this
    record's answer would be unchanged, and vice versa. Its metric list contains no call list and
    no accrual curve; its data cannot yield R.
  - >-
    IDEA-20260805-f7c912 measures delta(beta), the root-Hermite factor produced by a reduction.
    That is the QUALITY the schedule achieves. R is the COST of achieving it. A schedule can hit
    the target delta at any R; the two are independent axes and both are needed to price an
    attack.
  - >-
    IDEA-20260821-374af4 (this session's sibling) measures the free-dimension count, i.e. the
    dimension at which each call is made. It changes the per-call cost and leaves R structurally
    untouched, because R is a ratio of works within the same schedule and the d4f rule appears in
    numerator and denominator. The two records are multiplicative and non-overlapping. ONE
    COUPLING, ADDED ON REVIEW AND LOAD-BEARING: the d4f rule does NOT cancel out of the
    closed-form COLD FLOOR, which is a ratio across DIFFERENT blocksizes, and the g6k clamp that
    374af4 identifies is what puts this record's own measurement window in regime 1 rather than
    regime 2. 374af4's Stage-0 clamp table is therefore an input to this record's Stage 0S freeze.
  - >-
    IDEA-20260816-70e41d prices memory to locate an enumeration/sieving crossover. No memory price
    appears here and no enumeration is run; R is a pure work-accounting ratio inside the sieve
    family.
  - >-
    Every dual-attack record in this lane (08eda1, 725f05, ba5bd8, 5a4409, a102ec, bb7668,
    522b48, 8fbc86 in part) concerns the distinguisher and its score statistics. This record never
    scores a candidate, never builds a dual lattice, and never computes an advantage.
