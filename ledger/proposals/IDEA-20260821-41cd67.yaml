  assumptions:
  - The sieve can be instrumented to count vector-pair reduction attempts without changing its
    behaviour; if the instrumentation perturbs the schedule the counts are void.
  - The GOAL-MLKEM-004 instrument rebuilds (its own reproducibility_warning says it will not
    survive session end); a failed rebuild is infrastructure under AGENTS.md rule 5.
  - A full progressive schedule to beta = 85 fits in budget. The committed single-call datum
    (dim 70 bgj1, 335.2 s) does not establish this, because a schedule makes many calls, and the
    batch must therefore begin at beta = 50 and stop when the budget binds rather than promising
    beta = 85.
  - R is well defined only relative to a declared schedule; the schedule (blocksize ladder, jump
    value, tour count, preprocessing) is frozen before the run and reported with every number.
  proof_search_map:
    bottleneck: >-
      Not a proof-oriented proposal in the theorem sense; the map is filled because the claim is
      a quantitative cost-model statement. The bottleneck in the cost chain is the step from
      "cost of one SVP call at beta" to "cost of an attack requiring quality beta" - the only step
      in the whole core-SVP convention that is asserted rather than computed.
    baseline_embedding:
      parameter_slice: >-
        R = 1 with a single-call schedule reproduces the core-SVP convention exactly. That is the
        exact old-method boundary and it is a runnable configuration, not a limit.
      reproduction_check: >-
        Running the schedule with the ladder truncated to the single blocksize beta must return
        R = 1.000 exactly and total work equal to the single-call work measured independently.
        Frozen fixture at beta = 60.
    observation_collision:
      observable: 'R, one positive real per (schedule, basis, beta).'
      distinct_preimage_search: >-
        COLLISION IDENTIFIED IN ADVANCE: a schedule with few expensive calls and a schedule with
        many cheap calls can share an R. R therefore does NOT identify the call count, and the
        record must report the call list alongside R or the number is ambiguous. This is why the
        per-call tuple list, not just R, is a required artifact. A second collision: R is
        invariant under uniform rescaling of the work unit, so it cannot distinguish an efficient
        implementation from an inefficient one - which is a feature here (hardware independence)
        and a limitation stated in interpretation_limits.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        Treat the pool's saturation deficit as a potential that each call reduces, and charge each
        call the deficit it removes. If reuse is real, the potential telescopes across the ladder
        and the sum collapses to the final call's deficit, giving R = O(1) structurally rather
        than empirically.
      predicted_gain: >-
        Converts a measured ratio into a derived bound. Predicted gain is not a speedup but a
        REASON: it would explain why R is small, which a measurement alone cannot. Failure of the
        telescoping (deficit not monotone across calls) is itself diagnostic and is checkable from
        the same per-call tuples at no extra compute.
    - transform: stronger_invariant
      proposed_object: >-
        Track pool-size-at-entry alongside blocksize, so the per-call work law can be regressed on
        both. Preserving more state than R requires is what makes the mechanism (not just the
        magnitude) testable.
      predicted_gain: Separates the reuse mechanism from the blocksize mechanism within one run.
    quantifier_order: >-
      FOR ALL beta in the measured window, FOR ALL bases in the declared seed set, THERE EXISTS a
      schedule (the frozen pump-and-jump ladder) with R(beta, basis) <= 2^6. NOTE THE ORDER: the
      schedule is FIXED IN ADVANCE and does not depend on the basis. A claim with the quantifiers
      the other way round - "for every basis there exists a schedule with small R" - would be much
      weaker and would be an attacker-optimisation claim, which this record does NOT make. Xia et
      al.'s 7.2-23.4x result lives in exactly that weaker quantifier order and is cited only as
      evidence of variability.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this schedule, this sieve kernel, this lattice family and beta in [50, 85], the
        schedule term is R = ... +/- ..., measured in vector-pair reduction attempts." Nothing
        about FIPS 203 blocksizes, nothing about optimal schedules, nothing about other kernels.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a schedule with a large jump value
        J, where consecutive calls share little of the block and reuse should be much weaker. If
        R is the same at J = 1 and at large J, the method is not reading reuse at all and has not
        identified the load-bearing structure. This control is cheap and is in the required list.
    proof_obligations:
    - claim: Single-blocksize schedule returns R = 1.000 and matches the independent single-call work.
      responsibility: baseline
    - claim: Executed cold work agrees with the closed-form cold prediction within tolerance.
      responsibility: correctness
    - claim: R_warm/R_cold is reported with an interval over >= 8 bases.
      responsibility: success_probability
    - claim: Instrumentation does not change the schedule's trajectory.
      responsibility: interface
    - claim: No statement is made about beta > 85 except through H1.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: 'log2 R(beta) at beta = 70, warm progressive schedule, vector-pair reduction attempts'
    direction: lower
    minimum_effect: '6.0 - i.e. R below 64, at least 7 bits below the naive tour-count reading'
  - metric: 'R_warm / R_cold at matched call list, beta = 70'
    direction: lower
    minimum_effect: 0.5
  - metric: 'slope of log2 R against log2(number of calls in the schedule), across schedules with
      1x, 2x and 4x the call count at fixed beta'
    direction: lower
    minimum_effect: '0.5 - a slope of 1 is the no-reuse prediction and a slope near 0 is total
      reuse; anything at or above 0.5 refutes the warm-start explanation'
  - metric: 'fraction of total work consumed by the final 10% of calls, W(1) - W(0.9)'
    direction: higher
    minimum_effect: 0.5
  - metric: 'R at jump J = 1 versus R at the largest jump run'
    direction: different
    minimum_effect: '0.3 in log2 R - if the two agree, the measurement is not reading reuse'
  - metric: 'ratio of seed-to-seed spread of R at fixed beta to beta-to-beta spread at fixed seed'
    direction: lower
    minimum_effect: '1.0 - at or above 1 the object is unstable and the NEITHER branch fires'
  minimal_test:
    design: >-
      Rebuild the instrument and reproduce the committed dim-70 bgj1 database size (75511) as a
      gate. Freeze one pump-and-jump ladder, one kernel (bgj1), one preprocessing, one jump value
      J = 1. Beta in {50, 60, 70}, eight bases per beta. For each cell run three arms in the same
      invocation: WARM (the frozen ladder), NULL-C (same call list, pool discarded between calls),
      NULL-S (same call multiset, randomised order). Emit per-call tuples throughout. Compute R
      and W(t) for each arm; emit the frozen four-branch rule on NULL-C first, then on WARM.
      Then two ablation cells at beta = 70 only: truncation fractions 10/40/70% for the
      monotonicity requirement, and one large-J cell for the nearby-object control.
      WHY THIS DISCRIMINATES: the two explanations of R differ in the SLOPE of log2 R against
      log2(call count), and that slope is measured directly by varying the tour count at FIXED
      beta - so the discrimination needs no extrapolation and no large blocksize. The smallest
      cell, beta = 50 with 1x/2x/4x tours, is on its own a complete discriminator; everything
      above it is replication and scope.
      STOPPING RULE: if the beta = 50 slope cell already returns a slope outside [0, 0.5] with a
      non-overlapping interval over 8 bases, the headline is settled and the larger cells are
      replication only.
    controls:
    - 'NULL-C cold-restart arm, executed (not modelled), >= 8 bases, with its closed-form
      prediction derived before the run and compared'
    - 'NULL-S shuffled-order arm at matched call multiset'
    - 'single-blocksize baseline returning R = 1.000 exactly'
    - 'pool-truncation ladder at 10/40/70% with monotonicity of R in the truncation fraction
      REPORTED, not assumed'
    - 'large-jump nearby-object control'
    - 'instrument rebuild gate reproducing db 75511 at dim 70 bgj1'
    - 'instrumentation-neutrality check: an uninstrumented run must reach the same final basis
      profile as an instrumented one on the same seed'
    required_metrics:
    - per-call tuples (blocksize, position, tour, work units, pool size in, pool size out) for
      every call of every arm, archived
    - R per (arm, beta, basis) with interval over bases
    - W(t) curves, archived, for at least one basis per cell
    - R_warm / R_cold with interval
    - slope of log2 R against log2(call count) at fixed beta, with confidence interval
    - closed-form cold prediction and its signed discrepancy against executed cold work
    - seed-to-seed and beta-to-beta spreads of R
    - wall-time and peak RSS per arm, plus the rebuild receipt
  falsification_conditions:
  - 'log2 R > 6 and the slope against log2(call count) is at or above 0.5: the warm-start
    mechanism is refuted, core-SVP is conservative by roughly the call count, and the lane must
    record that every margin it has computed is understated by that amount. This is a clean
    refutation of the claim and is the most consequential outcome available.'
  - 'R_warm / R_cold >= 0.5: reuse buys less than a factor 2 and the mechanism is not doing the
    work attributed to it, whatever R''s absolute value is.'
  - 'NULL-S matches WARM: progressive ordering contributes nothing and the accrual shape is a
    property of the call multiset, not of the schedule.'
  - 'Executed cold work disagrees with the closed-form cold prediction beyond tolerance: the work
    counter is wrong; no R is reported and an instrumentation defect is recorded.'
  - 'R at J = 1 equals R at large J: the measurement is not reading reuse and the mechanism claim
    is unsupported regardless of R''s value.'
  - 'Seed-to-seed spread of R at fixed beta exceeds the beta-to-beta spread: R is not a property
    of the schedule; the NEITHER branch fires and nothing is reported.'
  - 'Instrumented and uninstrumented runs reach different bases on the same seed: the
    instrumentation perturbs the object and all counts are void.'
  confounders:
  - >-
    The work unit. Vector-pair reduction attempts and wall-time do not agree, because bucketing
    and near-neighbour filtering change the cost per attempt. R measured in attempts and R
    measured in seconds can differ materially; BOTH must be reported and the divergence between
    them is itself a datum.
  - >-
    Schedule choice is a free parameter and Xia et al.'s retrieved 7.2-23.4x spread proves it is
    a large one. R is scoped to the frozen ladder and is not a property of "progressive BKZ".
  - >-
    Preprocessing before the ladder can be charged to the ladder or excluded; the boundary is
    arbitrary and must be declared, because putting preprocessing inside R inflates it and putting
    it outside deflates it.
  - >-
    Memory pressure. At the largest reachable beta the pool may exceed cache or RAM and wall-time
    will jump for reasons that have nothing to do with reuse. This is exactly the effect
    IDEA-20260816-7bc28c owns; here it is a confounder to be excluded by reporting the
    hardware-independent unit as primary.
  - >-
    q-ary structure. At small beta the block still contains q-vectors and the sieve behaves
    atypically; the fit must exclude that range and say where it ends.
  - >-
    Kernel choice. bgj1, bdgl and hk3 have different reuse behaviour. R is scoped to bgj1 unless
    a second kernel is run.
  interpretation_limits:
  - Beta in [50, 85] is toy scale. Nothing here is a statement about FIPS 203, whose blocksizes
    are of order 400-900. H1 is the only bridge and it is an assumption, not a result.
  - R is a ratio inside a cost convention. It is not a lower bound on attack cost, not an upper
    bound, and not a physical quantity; an attacker with a better schedule gets a different R.
  - A small R does NOT mean attacks are cheaper than believed - it means core-SVP's neglect of
    the schedule is a small error. A large R means core-SVP is conservative. Neither direction is
    a security claim and neither is reported with adjectives.
  - R is invariant under uniform rescaling of the work unit, so it says nothing about
    implementation efficiency and cannot be compared against any wall-time-based figure.
  - AGENTS.md rule 12 is UNMET and inherited from GOAL-MLKEM-003/004; no committed record's
    status is proposed to change.
  heuristic_assumptions:
  - id: H1
    statement: >-
      (EXTRAPOLATION) Let s(beta) be the fitted slope of log2 R against log2(call count) at fixed
      beta, measured for beta in [50, 85] with the ladder, kernel and preprocessing frozen. H1
      asserts that s(beta) does not increase with beta outside the measured window, uniformly for
      beta up to the estimator's largest selected blocksize (of order 900). H1 asserts nothing
      about the VALUE of R at those blocksizes, only about the sign of its dependence on schedule
      length.
    rigorous_support: >-
      The rigorous ingredient is the exact geometric sum: under the core-SVP convention with the
      g6k free-dimension rule, one call at beta costs 2^(0.27010*beta - 3.358), so the
      one-call-per-blocksize total is exactly 1/(1 - 2^-0.27010) = 5.862 times the final call for
      every beta - a beta-INDEPENDENT constant. That is a theorem about the convention, not an
      assumption. The classical distributional statement H1 imitates is the standard renewal /
      geometric-series argument that a sum dominated by its largest term has a ratio to that term
      which converges as the number of terms grows: H1 asserts that the repeated-call structure
      obeys the same regime, i.e. that the extra calls at fixed blocksize behave like a bounded
      multiplicative overhead rather than an independent factor.
    validation_plan: >-
      SAMPLE: R at beta = 50, 60, 70 (and 80, 85 if budget allows), 8 bases per cell, with the
      call count varied 1x/2x/4x at each beta by changing the tour count only. SCALE justified by
      GOAL-MLKEM-004's committed dim-70 single-call timing of 335.2 s; a 4x-tour ladder to 70 is
      the budget-binding cell and the batch declares in advance that it stops there if needed.
      COMPARISON: s(beta) against 0 (total reuse) and against 1 (no reuse), and R against the
      exactly derived cold value. TAIL CHECK: s at the largest reachable beta, taken alone, must
      agree in sign with the pooled fit; disagreement is reported as H1 UNSUPPORTED at the top of
      its own window. TRANSFER ASSUMPTION, STATED PLAINLY: there is no sampling shortcut for R at
      cryptographic blocksizes - no analogue of the Deuring correspondence exists here - so H1
      cannot be validated where it is used, and that is the honest ceiling of this design. The
      external anchor available instead is a schedule-strategy comparison on real LWE Challenge
      instances (eprint 2022/1343), whose 7.2-23.4x spread bounds how much schedule choice alone
      can move a comparable quantity at larger scale.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and this record cannot produce one: R is a
      sub-exponential-in-beta multiplicative factor, not an exponent. Explicitly: the outcome
      changes an ADDITIVE bit term, not the 0.292 coefficient. The candidate range for that term
      is [0, 13] bits and the whole point is to narrow it. Under the exponent-first bias of
      docs/target-result-profile.md this record is therefore NOT target-class on axis A1, and it
      says so: it is a required building block, because every bit count this lane produces is the
      product of an exponent and this factor, and the factor is currently set to 1 by convention
      with no measurement anywhere in eighteen committed batches.
    memory_exponent: >-
      NO ATTACK MEMORY EXPONENT IS CLAIMED. R as defined is a TIME ratio. The memory analogue is
      already settled in the committed record and in the opposite structural direction:
      EV-MLKEM-020 states "eta+1 > beta on all three sets so the final BDD/SVP call sets peak
      memory", i.e. peak memory is set by ONE call regardless of the schedule, so the schedule
      term multiplies time and leaves peak memory alone. That asymmetry is itself a reportable
      consequence: charging the schedule makes attacks look worse in time at unchanged memory,
      which moves the time-memory position of every memory-charged margin in this lane.
      The measurement's own peak memory is one sieve pool, the same as a single call.
    best_known: >-
      There is no incumbent value, bound, or null floor for R anywhere in this repository - the
      greps above returned zero proposals concerning schedules, tours, or reuse. The incumbent
      CONVENTION is R = 1, executed inside EV-MLKEM-020's committed 140.20 / 200.96 / 270.72 bit
      figures. Externally, no verified value is known to this record; eprint 2022/1343 bounds
      schedule VARIABILITY at 7.2-23.4x but reports no R.
    hidden_overhead: >-
      (i) The 5.862 cold floor is derived inside the core-SVP convention using two constants
      (0.292 and the g6k linear d4f rule) that are themselves asymptotic or fitted; it is a
      statement about the convention's arithmetic, not about a machine. (ii) R measured in
      vector-pair attempts hides all bucketing and filtering overhead, which is where a real sieve
      spends much of its time; that overhead is exactly the o(1) the exponent hides and it is NOT
      captured here. (iii) The measured window is one sixth to one tenth of the blocksizes that
      matter, a larger extrapolation ratio than the exemplar profile's validation experiments.
      (iv) The schedule is frozen, so nothing here bounds what an optimising attacker achieves -
      the quantifier-order note above is the honest statement of that limit.
    tradeoff_note: >-
      Because the schedule multiplies time and leaves peak memory at the final call's level, R
      moves an attack's position along the TIME axis only. Any memory-priced crossover
      (IDEA-20260816-70e41d) and any frontier-geometry argument (IDEA-20260821-46c09f) that uses
      per-call sieve cost as the time coordinate is implicitly setting R = 1 and should carry R as
      an explicit multiplier once it is measured. Parallelisation position: the schedule is
      inherently SEQUENTIAL across blocksizes - call t+1 needs call t's pool - so R is a factor
      that parallelism across processors does NOT reduce, unlike the intra-call sieve work. That
      asymmetry is a further reason the term deserves a measured value rather than a convention.
  dominated_by: >-
    n/a (no attack result claimed), stated after checking rather than asserted. No attack cost
    triple exists here: nothing is solved, nothing is recovered, no query is made, so no row of
    any attack frontier applies and writing `null` would be a fabrication under AGENTS.md rule 5.
    On the MEASUREMENT axis the rows I checked in this repository are IDEA-20260807-8fbc86
    (per-call wall-time and peak database size), IDEA-20260805-f7c912 (delta(beta)),
    IDEA-20260805-fc6361 (saturation-ball census), IDEA-20260816-70e41d (memory-priced crossover)
    and the six committed GOAL-MLKEM-004 evidence records; none produces a call list, an accrual
    curve, or R, so none dominates. Externally I did not verify whether a published measurement of
    R exists; if one does it dominates the measurement outright, and the design's forced-value
    derivation and null structure would still be a separate contribution.
  sota_delta: >-
    No attack; measurement and mechanism contribution only. Quantitatively: this repository holds
    ZERO values for the schedule term and eighteen committed batches that set it to 1 by
    convention. The two live explanations of it differ by about 10 bits, against committed
    free-memory margins of 2.800527 / 6.041285 / 1.276377 bits - so the unmeasured term is larger
    than the entire quantity the lane has spent two closed goals arguing about. The delta is the
    creation of a first measured value with a forced-value derivation, an executed cold null, and
    a slope test that separates the two explanations without extrapolation.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the instrument rebuilds and the sieve can be instrumented for pair counts
    without perturbing the schedule: ~0.6 - g6k's counters may not be exposed and adding them is
    the main implementation risk, and this is the single most likely reason the batch returns
    nothing. (ii) That a full ladder to beta = 70 with 4x tours fits the budget on eight bases:
    ~0.6, extrapolating from the committed 335.2 s single call. (iii) That the executed cold arm
    matches its closed-form prediction within tolerance: ~0.75. (iv) That R comes in below 2^6 at
    beta = 70: ~0.6 - I lean toward the warm-start explanation but the jump strategy could easily
    force rebuilds I am not modelling. (v) That the slope against call count separates from both
    0 and 1 with non-overlapping intervals: ~0.5. (vi) That the batch produces a defensible R with
    an interval, or a defensible statement that R is unstable: ~0.8. I would bet against (i) more
    readily than against any mathematical part, which is a statement about tooling risk and is why
    the sibling record IDEA-20260821-46c09f is the cheaper first move.
