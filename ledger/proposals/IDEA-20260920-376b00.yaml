  assumptions:
    - >-
      B1 IS THE LOAD-BEARING IDENTIFICATION AND IT IS NOT YET RIGOROUS HERE: it
      asserts that the only Sigma-compatible function of the group element
      carried by the cubical lift is the n-th power class. The precise
      formulation requires care about WHICH biextension (E x Ehat versus a
      symmetric line bundle on E), about the restriction to the prime-order
      subgroup, and about whether the theta-group extension of E[n] by G_m --
      which is a DIFFERENT object from an extension of <g> by G_m -- is being
      conflated with it. THIS IS THE STEP MOST LIKELY TO BE IMPRECISE AND IT IS
      NAMED AS THE BOTTLENECK RATHER THAN ASSERTED.
    - >-
      E is ordinary with prime-order subgroup of order n and embedding degree
      k > 1. Both hypotheses are load-bearing and both fail on the nearby-object
      control by design.
    - >-
      Off-limits component used: F4 (pairing transfer), as the family the
      surviving invariant belongs to. Declared above.
    - >-
      "Model lever 1" is used in the sense of RQ-ECDLP-623a32: a representation
      change that alters a charged attack-stage cost, as opposed to lever 0, a
      constant-factor arithmetic speedup.

  proof_search_map:
    bottleneck: >-
      B1. Identifying the Sigma-compatible invariants of the cubical lift with
      the Tate pairing class, correctly and without conflating the theta group
      of E[n] (a central extension of E[n] by G_m, which DOES exist and is
      non-trivial) with a central extension of <g> by G_m (which is what the
      naive reading suggests and which is NOT the right object, since E is not
      an extension of a group scheme by G_m). If B1 is wrong -- if the cubical
      lift carries a Sigma-compatible invariant beyond the pairing class -- the
      entire closure fails and the object is genuinely open, which would be the
      more valuable outcome.
    baseline_embedding:
      parameter_slice: >-
        Embedding degree k = 1, i.e. n | p - 1. The argument must FAIL there and
        must reproduce the MOV/Frey-Ruck transfer as the surviving object:
        F_p^*/(F_p^*)^n is then cyclic of order n and the invariant is a
        non-trivial injective-on-the-relevant-part map, giving a genuine omega.
      reproduction_check: >-
        Frozen toy fixture, exact arithmetic: generate a toy curve with n | p-1
        (embedding degree 1) and verify that the computed invariant separates
        points with distinct logs, and that it yields log_g Q via a DLP in
        F_p^*; then generate a matched toy curve with k > 1 and verify the
        invariant is CONSTANT across all n points of the subgroup, by exhaustive
        enumeration. Two exact integer answers -- "number of distinct invariant
        values" must be n in the first case and 1 in the second. Not a ratio,
        not a statistic.
    observation_collision:
      observable: "The n-th power class of the cubical lift, i.e. the Tate pairing class."
      distinct_preimage_search: >-
        THE COLLISION IS TOTAL AND IS THE RESULT: when gcd(n, p-1) = 1 ALL n
        points of <g> share the same observable value. That is the maximal
        possible observation collision, it is a direct falsifier of
        identifiability, and no additional condition separates it, which is
        exactly why the closure holds. The converse search -- for a Sigma-
        compatible observable NOT collapsing this way -- is the record's
        positive branch and is what Stage 1 looks for.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from "does the cubical representation help" to "what is the image
          of the cubical lift's invariant functor", where the hypothesis becomes
          an exact vanishing condition (triviality of F_p^*/(F_p^*)^n).
          ENCODING: cubical lift -> pairing class, exact. COMPLETENESS: every
          Sigma-compatible group-element function factors through it, IF B1
          holds. SOUNDNESS: conditional on B1. TRANSFER: the vanishing condition
          is gcd(n, p-1) = 1, checkable in O(1) from public parameters. COST
          LOSS: none -- the transform removes compute.
        predicted_gain: >-
          Closes one named-open R3 entry at model lever 1 with a mechanism and a
          nearby-object control, at zero compute, and adds a third independent
          instance to the section 7 duality.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the pairing class) fixed at its trivial value and
          vary the forgotten structure -- gcd(n, p-1). The intrinsic invariant
          distinguishing the resulting objects is the embedding degree.
        predicted_gain: "Shows the closure is a statement about embedding degree and not about elliptic curves generally."
    quantifier_order: >-
      FOR ALL ordinary E/F_p with prime-order subgroup <g> of order n and
      embedding degree k > 1, FOR ALL cubical/biextension lifts L of <g> in the
      stated sense, FOR ALL functions phi of L that are Sigma-compatible AND
      factor through the group element: phi is constant. THE WITNESS IS NOT
      ALLOWED TO DEPEND ON THE POINT -- a "phi" varying with the torsor choice
      does not factor through the group element and is outside the quantifier,
      which is exactly the Class III residue B3 names and does not close.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "on a curve of embedding degree > 1, the Sigma-compatible
        group-element-valued content of the cubical/biextension lift is trivial,
        so this representation changes no charged attack-stage cost at model
        lever 1, and it lands on the invertible-not-recognizable side of the
        duality." IT CANNOT CERTIFY: that cubical arithmetic gives no
        constant-factor gain (lever 0); anything about E x E, Kummer surfaces,
        or extension fields; anything about cubical arithmetic used inside
        isogeny computations; or that the Class III residue B3 is useless -- that
        residue still owes a KN-FIND-002 simulability screen.
      nearby_object_control: >-
        EMBEDDING DEGREE 1 (n | p - 1), where the conclusion MUST fail and the
        same object becomes the MOV/Frey-Ruck attack. Also supersingular curves
        over F_p, where k = 2 and the invariant is again non-trivial over
        F_{p^2}. A method that reports triviality on those has not identified
        gcd(n, p^k - 1) as the load-bearing structure.
    proof_obligations:
      - claim: "B1: Sigma-compatible group-element functions of the cubical lift factor through the n-th power class (the named bottleneck)"
        responsibility: correctness
      - claim: "B2: n prime, n ~ p, n | p-1 forces p-1 = n, hence embedding degree 1"
        responsibility: correctness
      - claim: "B3: the residual cubical coordinate is a coboundary and carries no log information"
        responsibility: correctness
      - claim: "canonicalisation of a Sigma-orbit costs Otilde(log n) F_p operations and yields a quotient of size 1"
        responsibility: runtime
      - claim: "embedding-degree-1 slice reproduces MOV/Frey-Ruck"
        responsibility: baseline
      - claim: "scope: the closure does not cover E x E, Kummer surfaces, extension fields, or isogeny use"
        responsibility: scope

  predictions:
    - metric: >-
        Number of distinct values taken by the cubical lift's n-th power class
        across all n points of <g>, on toy curves with embedding degree k > 1,
        by exhaustive enumeration
      direction: lower
      minimum_effect: >-
        FORCED EXACTLY 1, at every tested curve. A value above 1 refutes B1 or
        B2 and is the record's positive branch -- a Sigma-compatible invariant
        with non-trivial image on a curve of embedding degree > 1 would be a
        genuinely new object and would reopen the R3 entry.
    - metric: The same count on a toy curve with embedding degree 1
      direction: higher
      minimum_effect: "FORCED EXACTLY n. A count below n means the instrument cannot see the invariant it claims to compute and voids every other reading."
    - metric: >-
        Mutual information between the residual (non-invariant) cubical
        coordinate and log_g Q, on toy curves with k > 1, against a matched
        random-relabelled null
      direction: lower
      minimum_effect: >-
        FORCED AT THE NULL within fluctuation, with a decay test in n. This is
        B3's check. A non-decaying excess refutes B3 and routes the residual to
        a KN-FIND-002 simulability screen rather than to a closure. NOTE: this
        arm uses a coordinate-statistic instrument owned by RQ-ECDLP-4fcbd3 as a
        borrowed component and produces no bias or bit-security claim.
    - metric: >-
        Measured F_p-operation count of cubical canonicalisation per point
        versus the Miller-loop baseline
      direction: lower
      minimum_effect: >-
        Whatever it is, it is a LEVER 0 number and must be reported in a column
        explicitly labelled as such, never compared against a charged attack
        stage. A constant-factor gain here is expected and is not a result for
        this question.

  minimal_test:
    design: >-
      STAGE 0 (PAPER, ZERO COMPUTE, THE DELIVERABLE). Write B1 correctly, with
      the theta-group-versus-biextension distinction carried explicitly and the
      restriction to <g> spelled out. IF B1 DOES NOT CLOSE, SAY SO AND STOP AND
      REPORT THE OBJECT AS OPEN -- an honestly-open R3 entry is worth more than
      a closure resting on a conflation, and this is the single most likely way
      this record is wrong while reading as right.
      STAGE 1 (TOY CURVES, EXHAUSTIVE, MINUTES). Self-generated curves with
      prime-order subgroups n ~ 2^10 to 2^18: (i) >= 5 ordinary curves with
      embedding degree k > 4; (ii) >= 2 curves with embedding degree exactly 1;
      (iii) >= 2 supersingular curves over F_p (k = 2); (iv) matched
      random-relabelled Z/nZ nulls. For each point of <g>, compute the cubical
      lift by Robert's ladder, its n-th power class, and the residual
      coordinate. Count distinct invariant values exactly. Measure the residual's
      relation to the tabulated log, with the log used ONLY to compute the
      observable and never as an input to any predicate.
      STAGE 2 (LEVER AUDIT, cheap). Measure the F_p-operation count of cubical
      canonicalisation against a Miller-loop baseline on the same curves, and
      report it in a separately labelled lever-0 column.
    controls:
      - "EMBEDDING DEGREE 1 POSITIVE CONTROL, and it is the one that matters: forced exactly n distinct invariant values. An instrument that cannot exhibit the object that provably exists has no power to assert its absence."
      - "SUPERSINGULAR k = 2 control over F_{p^2}: forced non-trivial, a second independent positive."
      - "RANDOM-RELABELLED Z/nZ NULL (a literal generic group) for the residual-coordinate arm."
      - "TORSOR-CHOICE RANDOMISATION: recompute every lift with independently randomised fibre choices; the invariant must be UNCHANGED and the residual must change. A residual that does not change is not the residual and the decomposition is wrong."
      - "x(-Q) = x(Q) and beta-orbit quotients applied before any claim, with the un-quotiented run reported so the known constants are visibly recovered."
      - "DECAY TEST IN n on the residual arm across the >= 6x range."
      - "ARCHIVE CHECK, zero compute: record that this closes an entry listed as open in docs/object-frame-ideation.md section 1 and proposes NO status change to RQ-ECDLP-623a32 or KN-OPEN-003, which is a Coordinator act."
    required_metrics:
      - "exact count of distinct n-th power class values per curve, per embedding degree"
      - "forced values: 1 at k > 1, n at k = 1, non-trivial at supersingular k = 2"
      - "residual-coordinate statistic versus matched null, with confidence interval and fitted decay exponent in n"
      - "invariance of the invariant and variance of the residual under torsor-choice randomisation"
      - "canonicalisation cost in F_p operations, in a column labelled lever 0"
      - "recovered sign factor 2 and beta-orbit factor 3 where applicable"
      - "artifact manifest with hashes and a from-scratch rebuild receipt"

  falsification_conditions:
    - >-
      More than one distinct invariant value on a curve of embedding degree
      k > 1. B1 or B2 is wrong; the R3 entry is REOPENED and this is the
      outcome that would matter most.
    - >-
      Fewer than n distinct values on the embedding-degree-1 control.
      Instrument broken; all numbers void.
    - >-
      The residual coordinate shows a non-decaying relation to the log against
      the matched null. B3 fails; the residual routes to a KN-FIND-002
      simulability screen and the closure is narrowed to the invariant part only.
    - >-
      The invariant changes under torsor-choice randomisation. The
      invariant/residual decomposition is misimplemented and nothing may be read.
    - >-
      Stage 0 finds B1 rests on conflating the theta group of E[n] with an
      extension of <g>. THE CLOSURE IS WITHDRAWN BEFORE STAGE 1 IS
      INTERPRETED and the record reports the R3 entry as open, with the
      conflation named so the next agent does not repeat it.

  confounders:
    - >-
      THETA-GROUP / BIEXTENSION CONFLATION, THE DOMINANT RISK. The theta group
      G(L) is a non-trivial central extension of E[n] by G_m and EXISTS; an
      argument that silently uses it in place of a (non-existent) extension of
      <g> by G_m would reach a plausible-sounding but wrong conclusion in either
      direction. Stage 0 exists for this and the record should be disbelieved
      until Stage 0 is written.
    - >-
      NORMALISATION ARTIFACTS. Cubical coordinates are defined up to choices;
      a fixed normalisation convention can manufacture apparent structure in the
      residual that is an artifact of the convention. The torsor-randomisation
      control is the direct test.
    - >-
      LEVER CONFUSION. Cubical arithmetic genuinely is faster than Miller for
      pairings. Reporting that as a result for THIS question would be a lever-0
      gain presented as lever 1, which is the exact error RQ-ECDLP-623a32
      exists to prevent. The separately labelled column is mandatory.
    - >-
      TOY CURVES WITH COMPOSITE SUBGROUP ORDER. Using the full group rather than
      a prime-order subgroup changes gcd(n, p-1) and would manufacture a
      spurious non-trivial invariant. Prime-order subgroups enforced.
    - >-
      SMALL-n DEGENERACY. At n ~ 2^10 the probability that gcd(n, p-1) > 1 by
      accident is not negligible for composite n; only prime n is used, and the
      gcd is computed and reported per curve rather than assumed.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, sota_delta zero on every ECDLP cost axis.
      The record closes a representation entry; it proposes no algorithm.
    - >-
      THE CLOSURE IS SCOPED to the bilinear-invariant use of the cubical
      structure on a SINGLE curve of embedding degree > 1. It does not cover
      E x E or Kummer-surface cubical structures, extension fields, isogeny
      applications, or lever-0 speedups, and it may not be quoted as closing
      R3 or KN-OPEN-003.
    - >-
      It proposes no status change to RQ-ECDLP-623a32, KN-OPEN-003 or
      docs/object-frame-ideation.md. Recording the entry as closed is a
      Coordinator act on evidence, not an act of this record.
    - >-
      The Class III residue B3 is NOT closed here; it owes a KN-FIND-002
      simulability screen, which is named as forward guidance.
    - >-
      No factor base appears, so KN-OPEN-020 is not engaged.
    - >-
      Toy scale; claim_tier toy. Stage 0 is a `derivation` artifact, never
      "proved".

  heuristic_assumptions:
    - id: H1
      statement: >-
        THE CENTRAL CLAIM IS NOT HEURISTIC AND THE ABSENCE IS RECORDED
        EXPLICITLY. B1-B4 are unconditional statements of algebraic geometry and
        elementary number theory with no distributional content: B2 is
        arithmetic, B4 follows from B1-B3. There is no smoothness assumption, no
        randomness assumption, and no uniformity range anywhere. This item exists
        so that no later reader may attribute a heuristic to the closure. WHAT
        IS UNCERTAIN IS CORRECTNESS, NOT PROBABILITY, and it is concentrated
        entirely in B1.
      rigorous_support: >-
        B2 is elementary. B3 is the standard fact that a coboundary carries no
        cohomological information. B1 is the biextension/Tate-pairing
        identification, which is classical IF stated correctly -- the risk is
        statement, not truth.
      validation_plan: >-
        SAMPLE: exhaustive enumeration of the full prime-order subgroup at
        n ~ 2^10 to 2^14 (complete verification at a size, which is stronger
        than any distributional check), extended by sampling >= 10^4 points at
        n ~ 2^18. COMPARISON: the forced integer counts -- 1 at k > 1, n at
        k = 1. TAIL CHECK: the curves with the SMALLEST embedding degree above 1
        and the smallest gcd margin, since a boundary failure would appear there
        first. TRANSFER ASSUMPTION: none -- the statement is algebraic and
        scale-independent, and the enumeration is a bug-check on the
        implementation, not evidence for the claim.
    - id: H2
      statement: >-
        RESIDUAL EMPTINESS. The non-invariant part of the cubical coordinate,
        after torsor-choice randomisation, is statistically independent of
        log_g Q to within the Weil scale O(n^{-1/2}), uniformly in n.
      rigorous_support: >-
        Composition, in the shape docs/target-result-profile.md A2 requires: the
        rigorous ingredient is that the residual is a coboundary, i.e. a
        function of the choice and of bounded-degree curve data; the
        distributional ingredient is the Weil/Bombieri square-root cancellation
        for character sums over the points of an elliptic curve
        (Kohel-Shparlinski, Lange-Winterhof lineage), to be cited exactly in
        Stage 0 rather than gestured at. THE COMPOSITION IS NOT YET WRITTEN.
      validation_plan: >-
        SAMPLE: >= 5 curves with k > 4 x >= 6 prime subgroup orders spanning a
        >= 6x range, >= 10^4 points each, against >= 200 matched
        random-relabelled nulls. COMPARISON: fitted decay exponent of the
        residual statistic against n, expected consistent with -1/2. TAIL CHECK:
        the 10 largest excesses, reported with whether they cluster on a curve,
        a prime, or a normalisation convention -- a clustering on convention is
        the artifact, not a finding. TRANSFER ASSUMPTION, STATED AND
        UNJUSTIFIED: that a toy-range fitted exponent describes cryptographic n.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT PROPOSED OR MOVED. The quantity the record prices is a
      CANONICALISATION COST: Otilde(log n) F_p operations per point to reduce a
      cubical lift to its Sigma-invariant, via Robert's ladder. That cost is
      cheap and irrelevant, because the resulting quotient has size 1 when
      gcd(n, p-1) = 1. Against Pollard rho at 0.886 sqrt(n) and BSGS at
      n^{1/2}, the delta is exactly zero.
    memory_exponent: >-
      O(1) F_p elements per cubical point; the Stage 1 enumeration uses O(n)
      words at n <= 2^18, an implementation detail and not a complexity claim.
      Against rho's O(1) and BSGS's n^{1/2}: not comparable, no algorithm.
    best_known: >-
      Pollard rho 0.886 sqrt(n), O(1) memory; BSGS (n^{1/2}, n^{1/2});
      automorphism-quotient rho sqrt(n/|Aut|); multi-target sqrt(u n);
      preprocessing frontier S T^2 = Omegatilde(n) at P T = n; prime-field index
      calculus with no known advantage (KN-OPEN-001). All untouched. For pairing
      COMPUTATION the incumbent is Miller's algorithm and cubical arithmetic is
      reported faster -- a lever-0 comparison recorded in its own column and not
      on any ECDLP axis.
    hidden_overhead: >-
      No asymptotic claim, so nothing hides in an o(1). What hides instead, and
      is disclosed: the closure's entire force rests on B1, whose correct
      statement is not yet written, and a reader who accepts B4 without Stage 0
      is accepting an unstated identification.
    tradeoff_note: >-
      Not applicable -- no algorithm, hence no time-memory tradeoff and no
      parallelisation position. Multi-target: not applicable for the same
      reason. Recorded explicitly rather than omitted.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
