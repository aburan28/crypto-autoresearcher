idea:
  id: IDEA-20260920-376b00
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py --next
    idea --date 20260920` and confirmed free with `--check` on 2026-09-20.
    Not derived by scanning state. Authored by the idea-generator subagent
    dispatched against RQ-ECDLP-bc7a54; filed unmodified except for this
    identifier block.
  proposed_by: idea-generator
  proposed_at: '2026-09-20'
  status: proposed
  question_id: RQ-ECDLP-bc7a54
  added: '2026-09-20'
  title: >-
    THE CUBICAL / BIEXTENSION LIFT LANDS ON THE INVERTIBLE SIDE OF THE DUALITY,
    AND THE REASON IS COHOMOLOGICAL: its only Sigma-compatible invariant is the
    Tate pairing class in F_p^* / (F_p^*)^n, which is TRIVIAL whenever
    gcd(n, p-1) = 1 -- i.e. on every curve of embedding degree > 1 -- so an
    explicitly-open R3 class of RQ-ECDLP-623a32 is closed at model lever 1 by
    a one-line argument whose nearby-object control is exactly the known-broken
    embedding-degree-1 case
  class: representation

  claim: >-
    (A) THE OBJECT AND WHY IT IS WORTH A RECORD. docs/object-frame-ideation.md
    section 1 lists R3 of RQ-ECDLP-623a32 as "non-function representations:
    elliptic nets, torsor and modular-curve coordinates, CUBICAL AND
    BIEXTENSION LIFTS, E x E and Kummer-surface gluings, Weil restriction,
    local rings", and records the Kummer-line and degree-d-function-on-E
    paradigms as CLOSED at model lever 1 while leaving cubical and biextension
    lifts OPEN. Robert's cubical arithmetic (ePrint 2024/517 lineage) makes
    this a live computational object with real recent momentum: it computes
    pairings and isogenies faster than Miller's algorithm, it is genuinely a
    different representation of a point (a point together with an element of a
    G_m-torsor fibre), and it propagates under a partial group law that is not
    the curve's addition. It is therefore exactly the kind of "recent external
    structural ingredient" search bias 2 asks for, and nobody in this corpus
    has priced it.
    (B) THE CLAIM. Let E/F_p be ordinary with prime-order subgroup <g> of order
    n, and let the tracked object be the biextension/cubical lift of a point:
    a point P together with a chosen element of the G_m-torsor fibre over it,
    with Sigma the CUBICAL PARTIAL ADDITION (the biextension's partial group
    laws in each variable, i.e. the operation Robert's ladder uses). Then:
      B1. The only Sigma-compatible invariant that is a function of the GROUP
          ELEMENT rather than of the torsor choice is the n-th power of the
          cubical coordinate, i.e. the Tate-Lichtenbaum pairing class in
          F_p^* / (F_p^*)^n.
      B2. gcd(n, p-1) = 1 on every curve whose embedding degree exceeds 1, for
          the elementary reason that n prime and n | p-1 with n ~ p forces
          p - 1 = n exactly, i.e. trace t = 2, i.e. embedding degree 1.
          Hence F_p^* / (F_p^*)^n is TRIVIAL and the invariant is CONSTANT.
      B3. The residual, non-invariant part of the cubical coordinate is a
          function of the torsor CHOICE -- a coboundary -- hence Class III
          coordinate-dependent, and it is computable from the coordinates
          WITHOUT any discrete-log information precisely because it carries
          none.
      B4. CONSEQUENTLY the cubical/biextension lift is an instance of the
          CONSTANT branch of IDEA-20260806-c5d183's theorem, not of a new
          cell, and it changes NO charged attack-stage cost on a curve of
          embedding degree > 1. It supplies a cheaper pairing, which is model
          lever 0 (a constant factor on a computation that is already trivial
          here because the pairing itself is trivial).
    (C) WHERE IT LANDS ON THE DUALITY, WHICH IS WHY IT BELONGS UNDER
    RQ-ECDLP-bc7a54 RATHER THAN ONLY UNDER RQ-ECDLP-623a32. The cubical
    coordinate of a point is computable along a ladder FROM A KNOWN EXPONENT --
    Robert's ladder takes k and P and produces the cubical data for kP -- and
    is NOT recoverable from the coordinates of an unknown-log point except
    through B3's information-free coboundary. It is therefore the D_w side of
    section 7's duality reached by a new road: INVERTIBLE (you built it from k)
    BUT NOT RECOGNIZABLE. That is the same verdict Route 2 receives for
    xedni lifts, obtained by a different mechanism, and it adds a THIRD
    independent instance to a duality that section 7 supports with two.
    (D) THE NEARBY-OBJECT CONTROL IS BUILT IN AND IS THE REASON TO BELIEVE THE
    ARGUMENT. Take gcd(n, p-1) > 1 -- embedding degree 1 -- and B2 fails, the
    invariant becomes non-trivial, and the object IMMEDIATELY becomes the
    MOV/Frey-Ruck transfer, i.e. a genuine omega and a genuine break. The
    argument therefore distinguishes the case where the conclusion should fail
    from the case where it should hold, by the exact hypothesis that does the
    work. An argument that could not tell those apart would not have found the
    load-bearing structure.
    (E) WHAT REMAINS OPEN, NAMED. The closure covers the BILINEAR-INVARIANT use
    of the cubical structure on a single curve of embedding degree > 1. It does
    NOT cover: (i) cubical arithmetic as a CONSTANT-FACTOR speedup of existing
    walks (model lever 0, possibly real, not measured here); (ii) cubical data
    on an EXTENSION field E(F_{p^k}) where gcd(n, p^k - 1) > 1 -- that is
    pairing transfer, family F4, already closed for large k; (iii) cubical
    structures on E x E or on a Kummer surface, which are a different R3 entry;
    (iv) the use of cubical arithmetic inside an ISOGENY computation (family
    F3). Those four are the forward guidance.

  mechanism: >-
    OBJECT FRAME. REPRESENTATION: the biextension / cubical lift of a point --
    a point of <g> together with an element of the fibre of a G_m-torsor over
    it. CLASS R3 of RQ-ECDLP-623a32 (non-function representations), explicitly
    named there and explicitly NOT among the closed entries. The Kummer line
    and degree-d-function-on-E representations are NOT used and their model
    lever 1 closure is not reopened.
    OPERATION SET SIGMA: the cubical partial addition -- the biextension's
    partial group laws in each variable, which is what Robert's ladder
    iterates. THIS IS NOT THE FULL TRANSLATION ACTION: the cubical law is
    defined only on compatible pairs of fibre elements, which is precisely why
    it escapes the c5d183 / KN-FIND-ffe1df Theorem C closure and why the object
    deserved a look rather than a dismissal.
    TRICHOTOMY: CLASS I, PARTIAL ACTION. One-line reason: the cubical
    coordinate propagates deterministically under the partial cubical law but
    not under arbitrary translation, since translating by an element with an
    incompatible fibre choice changes the coordinate by a cocycle factor.
    LOSSY-PROJECTION TEST AGAINST SIGMA. THE PROJECTION: cubical lift ->
    its n-th power class in F_p^* / (F_p^*)^n. DISCARDED: the entire torsor
    choice, log_2(p-1) - log_2 gcd(n, p-1) bits -- essentially everything.
    COMPATIBLE WITH SIGMA: yes, and this is the crux -- the n-th power class is
    bilinear under the cubical law, which is the defining property of the
    biextension, so the discard is exactly compatible with the named operation
    set and this is NOT a change of coordinates. LOSSY IN THE REPRESENTATION
    ACTUALLY USED: maximally so. AND THE PROJECTION'S IMAGE IS THE TRIVIAL
    GROUP when gcd(n, p-1) = 1, which places it in the CONSTANT branch that
    IDEA-20260806-c5d183 explicitly permits and explains.
    PRICED OPEN NUMBER: this is a quotient object, so the priced number is THE
    COST OF CANONICALISING A <Sigma>-ORBIT -- here, the cost of reducing a
    cubical lift to its Sigma-invariant. Charged end to end: Robert's ladder
    computes the n-th power in O(log n) cubical operations, each a constant
    number of F_p operations, so canonicalisation costs Otilde(log n) F_p
    operations per point. THE CANONICAL FORM IS THEN THE SAME VALUE (the
    identity class) FOR EVERY POINT, WHICH IS WHY THE PRICE IS IRRELEVANT: a
    canonicalisation that maps everything to one orbit representative has
    quotient of size 1 and provides no separation at any price.
    OFF-LIMITS COMPONENT USED, NAMED: F4 (pairing transfer) is the family the
    invariant belongs to. WHAT IS ADDED: F4 records treat the pairing as an
    attack to be applied; this treats the cubical lift as a REPRESENTATION
    question and shows the representation's only group-theoretic content is the
    F4 invariant, so the R3 entry is not independent of F4.

  novelty_status: unverified

