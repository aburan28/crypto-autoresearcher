idea:
  id: IDEA-20260902-c17bf6
  question_id: RQ-ECDLP-002
  added: '2026-09-02'
  title: >-
    THE DIGIT-STATISTIC CELL OF THE PROBABILISTIC REGIME, MEASURED ON THE
    OBSERVABLE THAT MATTERS: the Thue-Morse and Rudin-Shapiro signs of the
    integer lift of a coordinate are cheap, essentially balanced, and
    PROVABLY outside the bounded-spectral-norm class that the Weil pinning of
    IDEA-20260815-f558e4 covers -- the o2 sum-compatible-filter lane already
    measured their F_p spectral norm at about p^0.39 and their triple
    correlation at 101 times the Weil scale, then found the SUM-COMPATIBILITY
    signal to be a marginal-imbalance artifact -- so measure their majority
    advantage ALONG THE DISCRETE-LOG COORDINATE, the one observable f558e4
    says is exponent-relevant, with balance removing that artifact by
    construction and a planted digit-of-the-log positive calibrating the
    instrument at an intermediate scale n^{-0.21} rather than at 0.5
  class: control

  claim: >-
    Setting. E/F_p, P of prime order n, G = <P>, and for R in G write x(R)
    for its x-coordinate lifted to the integer interval [0, p). Define the
    THUE-MORSE statistic t(R) = (-1)^{s_2(x(R))}, s_2 the binary digit sum,
    and the RUDIN-SHAPIRO statistic r(R) = (-1)^{u(x(R))}, u the number of
    occurrences of the block 11 in the binary expansion. Both cost O(log p)
    bit operations, far less than one group operation. The observable is the
    one IDEA-20260815-f558e4 defines: the MAJORITY ADVANTAGE q_maj - 1/2 of
    the statistic under the group law on prime-order subgroups, together with
    its Fourier form, the largest coefficient
    A(v) = max over a in Z/n of |SUM_k v([k]P) e(ak/n)| / n
    of the statistic along the discrete-log coordinate. Four statements.

    (A) THE GAP, STATED IN THE CORPUS'S OWN NUMBERS. f558e4 sub-result (E)
    pins every efficiently computable coordinate-derived statistic at the
    1/s baseline within O(n^{-1/2}), 'up to the degree of the defining
    conditions'. The argument behind that phrase is a triangle inequality
    over the F_p-Fourier expansion of the statistic: if v(x) = SUM_xi
    v_hat(xi) e_p(xi x) then A(v) <= (SUM_xi |v_hat(xi)|) * max_xi |SUM_k
    e_p(xi x([k]P)) e(ak/n)| / n, and the inner hybrid sum is at the Weil
    scale sqrt(p) log p (Kohel-Shparlinski lineage, RECALLED). So the
    pinning reaches exactly the statistics whose F_p SPECTRAL NORM
    ||v_hat||_1 is polylog: intervals, bit windows, x mod m, characters,
    bounded-degree algebraic conditions. KN-FIND-ffe1df records, in the
    sum-compatible-filter lane, that popcount and digit-sum filters (its
    family I) are NOT in that class: 'measured L1 grows ~p^{0.39}, not
    O(log p)', with 9438 intervals per level set and a triple correlation
    max|T_t| = 0.395 = 101/sqrt(N) at p = 65539 -- and it marks family I
    NOT closed. For the Rudin-Shapiro sign the escape is maximal: its
    exponential sums are O(sqrt(N)) uniformly in the frequency (the root-N
    property of Salem's question, RECALLED, corroborated at search-snippet
    level only), which by Parseval forces a FLAT spectrum with ||r_hat||_1
    of order sqrt(p), so the pinning bound reads sqrt(p) * sqrt(p) log p / n
    = O(log p) -- vacuous. For Thue-Morse, Gelfond's bound sup_theta
    |SUM_{m<N} t(m) e(m theta)| << N^{log 3/log 4} (RECALLED, exponent
    approximately 0.79) gives ||t_hat||_1 up to p^{0.79} and again a vacuous
    composition. THE DIGIT FAMILY IS THEREFORE THE ONE CHEAP FAMILY FOR WHICH
    THE PROGRAM'S PROBABILISTIC-REGIME CLOSURE HAS NO PROOF AT ALL.

    (B) WHAT THE o2 LANE MEASURED, AND WHY IT IS NOT THIS OBSERVABLE. The o2
    lane measured the k-tree bucket gain G = M max_c pi_c(d), the
    SUM-COMPATIBILITY of a filter, and RT-EXP-1 found popcount and digit-sum
    tripping its refutation criterion (alpha = +0.125 and +0.495, CIs
    excluding 0) with the matched-marginal shuffle reproducing both
    (+0.135, +0.537): a false positive driven by the wildly unequal level
    sets of popcount mod 4 and decimal digit sum mod 4. Nobody has measured
    the DISCRETE-LOG-COORDINATE observable A(v) or q_maj for any digit
    statistic, and that is the observable f558e4 (F) identifies as the
    exponent-relevant one: an advantage that does not decay in n means the
    statistic approximates an arithmetic progression in the discrete-log
    coordinate, which localises k to a sub-interval at polynomial cost and
    is consumed by a kangaroo method directly.

    (C) THE DESIGN FIX THAT MAKES THE CELL MEASURABLE. Use +-1-valued
    statistics that are BALANCED over [0, p). The Thue-Morse partial sums
    SUM_{m<N} t(m) lie in {-1, 0, 1} for every N (elementary, from the
    substitution structure; RECALLED), so its marginal bias over [0, p) is
    at most 1/p, and the free marginal floor that produced RT-EXP-1's false
    positive is absent by construction. Rudin-Shapiro partial sums are
    O(sqrt(N)), a marginal bias at the Weil scale itself, which is why it is
    the secondary statistic and why every arm is ALSO run through the
    matched-marginal shuffle of the o2 lane. The residual marginal that
    matters is over x(G), not over [0, p): SUM_{R in G} t(x(R)) = (1/2)
    SUM_x t(x) (1 + chi(x^3 + ax + b)) up to the 2-torsion and cofactor
    corrections, whose nontrivial part is the mixed sum SUM_x t(x) chi(f(x))
    of a digit sign against a Legendre symbol of a cubic -- a sum for which
    this record knows no bound (heuristic H2 below) and which the run
    measures directly as the arm's own marginal.

    (D) THE CLAIM, STATED SO THAT EVERY OUTCOME IS A RESULT. For the
    statistics t and r on prime-order subgroups of toy curves with n
    spanning at least a 6x range, the advantage A(v) and q_maj - 1/2 decay
    like n^{-1/2} and match the keyed-random null and the x-top-bit
    comparator within the pre-registered band. THE CLOSURE READING: the
    Weil-scale ceiling of the probabilistic regime holds empirically for a
    family provably outside its proof reach, so in the tested scope 'Weil is
    the whole story' is a measured statement rather than a bounded one. THE
    LEAD READING: an advantage flat in n, surviving the shuffle and the
    null, on either statistic, which would be an efficiently computable
    approximate-AP statistic in the sense of f558e4 (F). THE INSTRUMENT
    READING: the planted positives fail to separate, and nothing is read.

  mechanism: >-
    THE TRACKED OBJECT is the digit sign of the coordinate's integer lift, a
    one-bit lossy projection of the point, followed through the group law in
    the PROBABILISTIC regime: it cannot propagate exactly (df906f), and the
    question is the size of its majority advantage and of its Fourier
    coefficient along the discrete-log coordinate. The lossy-projection test
    is passed non-vacuously (one bit retained of log2 n, and the discard is
    the whole point), and it is applied in the modified probabilistic form
    that f558e4 and IDEA-20260901-b4e6eb use, with the same estimator so the
    numbers are comparable across the three records.

    WHY THIS IS NOT b4e6eb OR 84755b OR THE o2 LANE IN NEW NOTATION.
    b4e6eb measures p-ADIC digits of the canonical lift, which are poly-time
    functions of the F_p point of UNKNOWN algebraic degree, and its principal
    weakness (its own H2) is that no degree bound is available. This record's
    statistics are BINARY digits of the plain integer representative, for
    which the failure of the pinning is not an unknown but a THEOREM (spectral
    norm p^{0.39} measured, sqrt(p) forced for Rudin-Shapiro). 84755b's panel
    has top bits, bottom bits and x mod m -- all bounded-spectral-norm, all
    inside the pinning -- and deliberately excludes digit sums. The o2 lane
    measured digit statistics on the sum-compatibility observable with
    unbalanced statistics and got a marginal artifact; this record measures
    the discrete-log observable with balanced statistics and carries the o2
    lane's shuffle control forward as a blocking arm.

    STAGE 0 (ZERO COMPUTE, HARD GATE). Write the triangle-inequality form of
    the pinning and show, with the recalled Gelfond and root-N facts marked
    as recalled, that it is vacuous for t and r. Then COMPUTE, not recall,
    the exact F_p spectral norms ||t_hat||_1 and ||r_hat||_1 over [0, p) for
    every toy prime in the ladder by one length-p FFT each; report them beside
    the x-top-bit comparator's O(log p) norm. If either digit norm is
    polylog rather than a power of p, claim (A) is wrong for that statistic
    and the record stops for it.

    STAGE 1 (INSTRUMENT). The estimator of f558e4: on a prime-order subgroup
    enumerated completely, compute q_maj exactly over all n^2 pairs and A(v)
    exactly by one length-n DFT along k. Prime orders: at least six, spanning
    a 6x range in the 16 to 30 bit band, curves excluded per KN-TECH-034
    (anomalous, smooth order; that record was not opened this session and
    the exclusion rule is taken as 863e36 and b4e6eb state it). Arms: T1
    Thue-Morse of x; T2 Thue-Morse of y; T3 Rudin-Shapiro of x; T4 popcount
    of x mod 4 (the o2 family-I member, unbalanced, kept for cross-lane
    comparability and expected to show the marginal artifact before
    shuffle); COMPARATOR the top bit of x (an interval statistic inside the
    pinning). If the RQ-PROP-24458b instrument of H-PROP-c95932 exists it is
    reused; otherwise the estimator is a day's work.

    STAGE 2 (CONTROLS, ALL BLOCKING). See null_object_control. The two
    planted positives are the design's contribution: the discrete-log
    interval bucket (advantage near 0.5, the o2 lane's P2-type control that
    calibrates only the maximal end) AND the Thue-Morse sign OF THE
    DISCRETE LOG ITSELF, t(k), computable only because k is known to the
    harness, whose Fourier coefficient along k is exactly the Thue-Morse
    spectrum and whose largest coefficient is therefore of order n^{-0.21}
    (Gelfond, RECALLED): an intermediate-scale planted signal that the
    instrument must resolve, exactly the sensitivity the o2 red team said the
    P2 control never established.

    STAGE 3 (THE MEASUREMENT). Per arm and per n: A(v), q_maj - 1/2, the
    arm's own marginal over x(G), and the same three numbers after the
    matched-marginal shuffle. Fit the decay exponent beta in A(v) ~ n^{-beta}
    per arm with a bootstrap interval.

    STAGE 4 (DECAY, THE ARTIFACT TELL). An advantage flat in n is the
    canonical artifact under docs/inventor-protocol.md section 3 unless it
    survives NULL-1, NULL-2 and the comparator, in which case it is the lead
    and is routed to independent review before any interpretation.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE CRYPTO-KB RETRIEVAL INDEX IS EMPTY IN THIS CONTAINER
      (CRYPTO_KB_QDRANT_URL is ':memory:'); search_knowledge was NOT called
      and its silence is not evidence. Greps run 2026-09-02 from the
      repository root: over ledger/ and knowledge/ for 'Thue|Morse|Rudin|
      Shapiro|sum.of.digits|digit.sum|Mauduit|Gelfond|Hamming weight of
      (the )?(x|coordinate)'; over analysis/ and ideas/ for the same plus
      'spectral norm|Fourier L1|Wiener norm'; over ledger/proposals for
      'spectral norm|Fourier L1|L1.norm.*Fourier|Wiener norm'. Records read
      IN FULL: KN-FIND-ffe1df, IDEA-20260901-b4e6eb, IDEA-20260901-133fd3,
      IDEA-20260901-863e36, KN-TECH-005, KN-TECH-006, KN-TECH-018,
      KN-TECH-030. Read IN PART: IDEA-20260815-f558e4 (lines 1-170),
      IDEA-20260817-84755b (1-140), IDEA-20260807-df906f (1-160),
      IDEA-20260802-006 (1-120), H-PROP-c95932 (1-70); the o2 lane's
      F1_sum_compatible_filter_search.md, REDTEAM.md and RT-EXP-1-RESULT.md
      via grep excerpts around 'popcount|digit' only. Three WebSearch calls
      (Gelfond sum-of-digits bound; Rudin-Shapiro root-N property; digit sums
      of x-coordinates of multiples on elliptic curves) and two WebFetch
      attempts (arXiv 2302.09436 abstract, which does not state the Gelfond
      bound; the EMS PDF of Mauduit-Rivat 2015, which could not be parsed).
      NO EXTERNAL SOURCE WAS READ; every external citation is recalled.
    results: >-
      The only corpus hits for digit statistics are in the o2
      sum-compatible-filter lane: KN-FIND-ffe1df family I (popcount, digit
      sums) NOT closed with measured L1 ~ p^{0.39}, family J refuted as
      stated with popcount as the explicit counterexample, and RT-EXP-1's
      popcount/digitsum false positives on the bucket-gain observable. No
      record measures a digit statistic on the discrete-log observable, no
      record uses a balanced digit sign, and no record uses a planted
      digit-of-the-log positive. 84755b's panel excludes digit sums by
      construction. The third WebSearch found no publication combining digit
      sums with elliptic-curve point sequences; the nearest recalled work is
      the pseudorandom-bits-from-elliptic-curve-points literature
      (Farashahi-Shparlinski lineage), which extracts BITS, i.e. interval
      statistics inside the pinning. Absence of a search hit is a floor.
    verdict: >-
      UNVERIFIED, and capped there by rule 9: the two load-bearing external
      facts (Gelfond's exponent for Thue-Morse sums; the root-N property of
      Rudin-Shapiro) are recalled and were not read, one search snippet
      corroborated the second, and no agent in this program has opened
      either source. On its internal content the record is an ADAPTATION of
      two existing instruments (f558e4's estimator, the o2 lane's shuffle
      control) to a family the corpus itself lists as uncovered, and that
      reading is stated here rather than claimed as a label.

