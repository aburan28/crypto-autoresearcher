  assumptions:
    - >-
      n prime and the subgroup completely enumerable, so q_maj and A(v) are
      computed EXACTLY and no estimator variance competes with the n^{-1/2}
      effect; this caps the ladder near 30 bits by design.
    - >-
      The integer lift is the canonical representative in [0, p); a
      different lift (balanced representatives in (-p/2, p/2)) changes the
      statistic and is a separate arm if run.
    - >-
      The scalar k is known to the harness for enumeration and for the
      planted t(k) positive, and is structurally withheld from every
      statistic code path; the static provenance check is blocking.
    - >-
      Toy tier throughout, p in the 16 to 30 bit band; nothing is claimed
      at cryptographic n.

  proof_search_map:
    bottleneck: >-
      Not the instrument, which exists in two prior records, but the absence
      of ANY bound for the digit family: the record's whole reason to exist
      is that the Weil composition is vacuous here and no replacement
      argument is known. A reviewer who supplies a bound on SUM_k t(x([k]P))
      e(ak/n) of the Weil scale converts this record from a measurement into
      a confirmation and should say so.
    baseline_embedding:
      parameter_slice: >-
        The COMPARATOR arm, the top bit of x, is an interval statistic with
        spectral norm O(log p) and is exactly the object f558e4 already
        measures at p about 100 (its committed q_maj values for the x-bucket)
        and b4e6eb adopts as its r = 1 shadow.
      reproduction_check: >-
        The comparator's q_maj at matched (p, s = 2) must reproduce f558e4's
        committed x-bucket numbers where the primes overlap, in exact
        arithmetic, read from that record's text; and its fitted decay beta
        must be consistent with 1/2. If the comparator misses, the estimator
        disagrees with the prior lane and no digit-arm number is reported.
    observation_collision:
      observable: >-
        The pair (A(v), q_maj - 1/2) at given n for a statistic v.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: the Thue-Morse arm and the
        comparator are predicted to give the SAME observable within the band
        although one is inside the pinning's proof and the other provably
        outside it. That collision is the closure reading, not a failure: it
        says the observable does not see the spectral norm. The collision
        that would be a FAILURE is the popcount-mod-4 arm matching the
        Thue-Morse arm BEFORE the shuffle, since the former carries a known
        marginal artifact and the latter is balanced; if they agree
        pre-shuffle the balance argument of claim (C) is not doing what it
        claims and the marginal must be measured directly.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the DL-coordinate advantage) fixed and vary
          the forgotten structure (the F_p spectral norm of the statistic,
          from O(log p) for the comparator through p^{0.39}-type for
          Thue-Morse to sqrt(p) for Rudin-Shapiro). If the advantage is
          independent of the spectral norm the pinning's proof hypothesis is
          not the load-bearing one; if it grows with the norm the hypothesis
          is real.
        predicted_gain: >-
          Turns 'does the degree gap matter' into a one-dimensional curve in
          the spectral norm with a predicted flat shape.
      - transform: representation_reduction
        proposed_object: >-
          Move the o2 lane's question from the sum-compatibility observable,
          where the marginal artifact lives, to the DL-coordinate observable,
          where f558e4 (F) says the exponent-relevant content lives.
          Encoding exact; the loss is that a sum-compatibility gain and a DL
          advantage are different quantities and neither implies the other,
          which is stated rather than assumed.
        predicted_gain: >-
          Closes, or opens, the cell the o2 lane left uncovered on the
          observable that would matter.
    quantifier_order: >-
      MEASUREMENT CLAIM: FOR ALL statistics in the DECLARED arm set {t of x,
      t of y, r of x}, FOR ALL tested prime orders n in the ladder, the
      advantage A(v) is at most the comparator's advantage plus the
      pre-registered band and its fitted decay exponent beta lies in
      [0.4, 0.6]. The quantifier is over the declared arms and the tested
      ladder only. THE STRONGER READING NOT CLAIMED: that every digit
      statistic, or every statistic of unbounded spectral norm, is pinned;
      the record measures three members and says so.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'on the tested toy family the declared digit statistics show
        no DL-coordinate advantage beyond the interval comparator, decaying
        like n^{-1/2}, with the marginal artifact of the o2 lane absent by
        balance and confirmed absent by shuffle'. It can NEVER certify that no
        unbounded-spectral-norm statistic helps, it certifies nothing at
        cryptographic n, and it proves no bound: the digit family remains
        without a theorem whatever the numbers say.
      nearby_object_control: >-
        The object where the hoped-for conclusion FAILS is the Thue-Morse
        sign of the DISCRETE LOG, t(k): computable only with k, provably
        carrying a Fourier coefficient along k of order n^{-0.21} that does
        NOT decay like n^{-1/2}. A pipeline that cannot see this planted
        signal at its known intermediate scale, while seeing the interval
        positive at 0.5, has not shown that it resolves the boundary where
        the closure is decided -- which is the o2 red team's own objection to
        its lane's P2 control, carried here as a design requirement.
    proof_obligations:
      - claim: >-
          The pinning bound is a triangle inequality over the F_p spectrum
          composed with a hybrid character-sum bound, and is vacuous when the
          spectral norm exceeds n / (sqrt(p) log p).
        responsibility: correctness
      - claim: >-
          The F_p spectral norms of t and r over [0, p) are powers of p and
          the comparator's is polylog, at every ladder prime, by direct
          computation.
        responsibility: size
      - claim: >-
          The Thue-Morse marginal over [0, p) is at most 1/p.
        responsibility: correctness
      - claim: >-
          The comparator reproduces f558e4's committed x-bucket values.
        responsibility: baseline
      - claim: >-
          No statistic code path reads k.
        responsibility: interface
      - claim: >-
          Every reported number names n, the statistic, the lift convention
          and the estimator.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The one-bit digit sign t(R) = (-1)^{s_2(x(R))} (and r(R), the
      Rudin-Shapiro sign) of the integer representative of a coordinate.
    lossiness: >-
      Genuinely lossy: one bit retained of log2 n, discarded compatibly with
      nothing in the exact regime (df906f), so the test is applied in its
      probabilistic form as f558e4 and b4e6eb apply it. It is NOT a change
      of coordinates: the bit cannot be inverted, and it is not a function
      of any bounded-degree algebraic datum of the point, which is the
      record's whole point.
    propagation: >-
      Probabilistic only. Predicted majority advantage at the n^{-1/2} scale
      by the random-model heuristic H1 -- a prediction with NO theorem behind
      it for this family, which is the difference from every other panel
      member the corpus has measured.
    survival_score: >-
      Predicted to die at the first group operation exactly as the interval
      comparator does; the measurement's job is to check that a statistic
      outside the proof behaves like the statistics inside it, or does not.

  null_object_control: >-
    NULL-1, THE KEYED RANDOM SIGN (blocking): a seeded PRF of the point
    encoding truncated to +-1, run through the identical estimator; its A(v)
    distribution over seeds is the reference for 'no structure' and its
    largest value over an equal number of replicates is the tail reference.
    NULL-2, THE MATCHED-MARGINAL SHUFFLE (blocking, inherited from the o2
    lane's RT-EXP-1): permute the statistic's values among the points of G
    preserving the multiset, so every marginal is kept and every dependence
    on the point is destroyed; each arm's advantage is reported beside its
    shuffled advantage, and an arm that matches its shuffle is reporting
    marginal imbalance and nothing else. THIS IS THE CONTROL THAT KILLED THE
    o2 LANE'S DIGIT SIGNALS AND IT IS CARRIED FORWARD UNCHANGED.
    COMPARATOR (blocking): the top bit of x, inside the pinning, at matched n.
    POSITIVE CONTROL A (blocking): the discrete-log interval bucket, whose
    advantage sits near 0.5 flat in n (f558e4's planted positive).
    POSITIVE CONTROL B (blocking, specific to this record): the Thue-Morse
    sign of the discrete log itself, t(k), whose largest Fourier coefficient
    along k is predicted at order n^{-0.21}; the instrument must resolve it
    as intermediate between the comparator and POSITIVE CONTROL A, and must
    show it NOT decaying like n^{-1/2}. Failing this, the run reports no digit
    number.
    CONTROL C (diagnostic): popcount of x mod 4, the o2 lane's unbalanced
    member; expected to show a pre-shuffle excess that the shuffle removes,
    reproducing the o2 lane's artifact as a known-answer calibration of the
    shuffle itself.

  discriminated_from:
    - >-
      KN-FIND-ffe1df and the o2 sum-compatible-filter lane (family 6,
      off-limits as a lens). That lane's observable is the k-tree bucket
      gain, a SUM-COMPATIBILITY quantity, and its digit-statistic result is
      a shuffle-explained false positive on unbalanced filters. This record
      uses a DIFFERENT observable (the DL-coordinate advantage), balanced
      statistics, and that lane's own shuffle as a control; it proposes no
      join, no tree and no filter, and it does not reopen the Lemma 5 hole.
      The operation-level difference: there the statistic is applied to
      P + Q and compared with f(h(P), h(Q)); here it is applied to [k]P and
      correlated with e(ak/n).
    - >-
      IDEA-20260815-f558e4. Supplies the estimator and the pinning. This
      record measures a family f558e4 (E) explicitly does NOT reach ('up to
      the degree of the defining conditions') and says why in numbers; if the
      closure reading obtains, f558e4's prediction is extended beyond its
      proof; if the lead reading obtains, f558e4 (F) is triggered.
    - >-
      IDEA-20260901-b4e6eb. Same shape (a statistic outside the bounded
      degree class, measured on f558e4's estimator with decay in n), different
      family: p-adic digits of the canonical lift, whose degree gap is an
      UNKNOWN, versus binary digits of the plain lift, whose spectral-norm
      gap is MEASURED and, for Rudin-Shapiro, forced. The two records are
      complementary panels and share the comparator.
    - >-
      IDEA-20260817-84755b. Its panel excludes digit sums by construction and
      measures conditional entropy in bits; this record measures the
      majority advantage and the Fourier coefficient, on a family that panel
      omits.
    - >-
      IDEA-20260901-133fd3 (family 8). Its low-Hamming-weight class is a
      promise on the SCALAR k; this record's statistic is a digit sign of a
      COORDINATE. The only contact is POSITIVE CONTROL B, which uses the digit
      sign of k as a planted signal precisely because it is uncomputable
      without k.
    - >-
      IDEA-20260802-006. Tracks the INDEX set with additive-character bias of
      x; this record tracks a coordinate statistic with its DL-coordinate
      bias. Same character-sum lineage, opposite direction of the Fourier
      transform.

  predictions:
    - metric: >-
        P1 -- A(v) and q_maj - 1/2 for T1, T2, T3 minus the same quantities
        for the comparator, at matched n, before and after NULL-2
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. Absolute difference at or below 0.01
        at every tested n, before and after shuffle, records the CLOSURE
        branch. A difference at or above 0.05, reproduced at three or more
        prime orders, NOT reproduced by NULL-2, and NOT decaying with n,
        records the LEAD branch and triggers independent review before any
        interpretation. Between is INCONCLUSIVE in advance. BASIS: the
        n^{-1/2} scale at the tested sizes and the bands b4e6eb uses, so the
        three panels remain comparable; untested expectations.
    - metric: >-
        P2 -- fitted decay exponent beta per arm in A(v) ~ n^{-beta} over at
        least six prime orders spanning 6x
      direction: lower
      minimum_effect: >-
        beta in [0.4, 0.6] for T1-T3 records closure; beta at or below 0.25
        surviving NULL-1 and NULL-2 records the lead. POSITIVE CONTROL B must
        return beta consistent with 0.21, and POSITIVE CONTROL A beta near 0.
    - metric: >-
        P3 -- the exact F_p spectral norms of t, r and the comparator at each
        ladder prime (Stage 0)
      direction: different
      minimum_effect: >-
        Digit norms growing as a power of p with fitted exponent at or above
        0.3 (Thue-Morse) and near 0.5 (Rudin-Shapiro); comparator norm
        growing at most like (log p)^2. If a digit norm is polylog the
        record's premise fails for that arm and the arm is dropped with the
        computed norm archived.
    - metric: >-
        P4 -- CONTROL C's pre-shuffle excess and post-shuffle residual
      direction: different
      minimum_effect: >-
        A pre-shuffle excess that the shuffle removes, reproducing the o2
        lane's artifact pattern. Known-answer calibration of NULL-2; if the
        shuffle does not remove it the control is not doing what the o2 lane
        reported and every digit number is void.
    - metric: >-
        P5 -- each arm's own marginal over x(G), i.e. the mixed sum of the
        digit sign against the curve's Legendre indicator, normalised
      direction: lower
      minimum_effect: >-
        At the n^{-1/2} scale and decaying (heuristic H2). A marginal flat in
        n is reported separately as a finding about the mixed sum SUM_x t(x)
        chi(x^3 + ax + b), independent of the DL question, and does NOT by
        itself constitute a lead.

  minimal_test:
    design: >-
      STAGE 0 (zero compute plus one FFT per prime, HARD GATE): the vacuity
      derivation and the computed spectral norms (P3). STAGE 1 (a day if the
      RQ-PROP instrument is not reusable, else hours): the exact estimator on
      six or more prime-order subgroups in the 16 to 30 bit band. STAGE 2
      (HARD GATE, minutes): comparator reproduces f558e4's fixture; POSITIVE
      CONTROL A at about 0.5; POSITIVE CONTROL B at the n^{-0.21} scale and
      non-decaying; CONTROL C shows the o2 artifact and its removal. STAGE 3
      (hours): P1, P2, P5 for T1-T4 with NULL-1 and NULL-2 on the identical
      estimator. STAGE 4 (only if the LEAD branch fires): re-run at two
      further primes, then stop and route to independent review. NO ATTACK is
      run, every instance is toy and self-generated, and no key is involved.
    controls:
      - NULL-1 keyed random sign of the point (blocking)
      - NULL-2 matched-marginal shuffle inherited from the o2 lane (blocking)
      - COMPARATOR top bit of x, inside the pinning, reproducing f558e4 (blocking)
      - POSITIVE CONTROL A discrete-log interval bucket near 0.5 (blocking)
      - POSITIVE CONTROL B Thue-Morse sign of the log at the n^{-0.21} scale (blocking)
      - CONTROL C popcount mod 4 reproducing the o2 artifact and its removal (diagnostic)
      - static check that no statistic code path reads k (blocking)
      - exclusion of anomalous and smooth-order toy curves per the KN-TECH-034 rule as 863e36 and b4e6eb state it
    required_metrics:
      - A(v) and q_maj per (arm, n), exact, before and after shuffle, with the estimator named
      - fitted beta per arm with bootstrap interval and residuals
      - computed F_p spectral norms per statistic per prime
      - each arm's marginal over x(G) per n
      - NULL-1 distribution and tail reference per n
      - pass or fail of every gate, wall-clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. Stage 0 finds a digit norm that is polylog in p. Claim (A) is wrong
      for that statistic; the arm is dropped and the computed norm archived.
    - >-
      F2. The comparator fails to reproduce f558e4's fixture, or POSITIVE
      CONTROL A or B fails to separate at its predicted scale. Instrument
      failure; nothing is reported.
    - >-
      F3. CONTROL C's excess survives the shuffle. NULL-2 is not the control
      the o2 lane reported; every digit number is void until resolved.
    - >-
      F4. A digit arm shows an advantage at or above 0.05 over the
      comparator, reproduced at three primes, surviving NULL-1 and NULL-2, not
      decaying in n. THE LEAD: an efficiently computable statistic outside
      the Weil class with a non-decaying DL-coordinate correlation, i.e. an
      approximate-AP primitive in the sense of f558e4 (F). Still no attack;
      conversion to key recovery needs its own proposal with exponents and a
      cost table.
    - >-
      F5. Every digit arm matches the comparator within 0.01 with beta in
      [0.4, 0.6]. The predicted outcome: the probabilistic-regime ceiling
      holds empirically for a family provably outside its proof, in the
      tested scope, and the honest headline is 'a measured extension of the
      Weil ceiling past its own reach, on three statistics, at toy scale,
      with the o2 artifact removed by balance and confirmed by shuffle'. It
      closes three arms, not the family, and proves no bound.
    - >-
      F6. Budget exhaustion before the ladder resolves. INFRASTRUCTURE
      outcome under AGENTS.md rule 5, never evidence about the statistics.

  confounders:
    - >-
      Marginal imbalance over x(G) rather than over [0, p). Balance over the
      interval does not imply balance over the half of it that is a
      coordinate; the arm's own marginal (P5) and NULL-2 exist for this and
      both are reported.
    - >-
      Toy-scale image ratio. A one-bit statistic on a 20-bit group is a far
      larger fraction of the group than at cryptographic size, biasing
      TOWARD apparent structure. Disclosed; the ladder is the only defence.
    - >-
      Lift convention. The integer representative in [0, p) versus a
      balanced one changes t and r; a run must fix the convention and name
      it.
    - >-
      Multiple testing across a in Z/n. A(v) is a maximum over n
      frequencies; its null distribution is an extreme-value law and NULL-1's
      empirical maximum, not 1/sqrt(n), is the reference.
    - >-
      Accidental smoothness of n and the anomalous case at toy scale,
      excluded per the KN-TECH-034 rule; the baseline must be charged against
      the prime subgroup order per KN-TECH-030.

  interpretation_limits:
    - >-
      No bound is proved in either branch. The closure branch is an
      empirical extension of a prediction beyond its proof, scoped to three
      statistics, six primes and one lift convention.
    - >-
      The lead branch is a distinguisher-scale statement and NOT an attack;
      the conversion to a solver is f558e4 (F)'s separate question.
    - >-
      Nothing here bears on the o2 lane's Lemma 5 hole or on any k-tree
      configuration; a DL-coordinate advantage and a sum-compatibility gain
      are different quantities.
    - >-
      Toy tier throughout; no transfer to cryptographic n is licensed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a prime-order subgroup <P> of a toy curve and v in {t, r} applied
        to x([k]P), the sequence (v([k]P))_{k in Z/n} behaves, with respect to
        its largest Fourier coefficient along k, like a uniformly random
        +-1 sequence: A(v) = O(sqrt(log n / n)), uniformly over the ladder.
      rigorous_support: >-
        The classical distribution statement imitated is the extreme value of
        the DFT of a Rademacher sequence, max over n frequencies of a sum of
        n independent signs, which is O(sqrt(n log n)) with high probability.
        THE RIGOROUS INGREDIENT THAT WOULD NORMALLY PAIR WITH IT -- square-root
        cancellation in hybrid sums over elliptic-curve points, composed over
        the statistic's F_p spectrum -- DOES NOT REACH THIS FAMILY, because
        the spectral norm of t and r is a power of p (KN-FIND-ffe1df's
        measurement for the digit-sum family; the recalled Gelfond and
        root-N facts). H1 is therefore a genuine heuristic with NO rigorous
        half, stated as such, and the record exists because of that.
      validation_plan: >-
        SAMPLE: complete enumeration of the subgroup at six or more prime
        orders spanning 6x in the 16 to 30 bit band, so A(v) is exact.
        SHORTCUT: none needed and none used; the cost of exactness is the
        30-bit cap, and the transfer to cryptographic n is an explicit
        unjustified extrapolation. COMPARISON DISTRIBUTION: the empirical
        distribution of A over NULL-1 seeds at the same n (an extreme-value
        law), and the fitted n^{-beta} against beta = 1/2. TAIL CHECK: the
        largest A observed over all digit arms and primes against the largest
        over an equal number of NULL-1 replicates; a real effect shifts the
        distribution, not one cell. SAMPLED PARAMETERS RECORDED: p, n, curve
        coefficients, lift convention, statistic id, seed.
    - id: H2
      statement: >-
        The marginal of v over the coordinates of G, (1/n) SUM_{R in G}
        v(x(R)), is O(n^{-1/2} log n); equivalently the mixed sum SUM_x v(x)
        chi(x^3 + ax + b) over F_p exhibits square-root cancellation.
      rigorous_support: >-
        NONE KNOWN TO THIS RECORD. The statement imitates the equidistribution
        of a digit sign against a multiplicative character, the shape of the
        Mauduit-Rivat results on digit sums along primes and squares
        (RECALLED), but no result for a Legendre symbol of a cubic is known
        to the author. H2 is measured directly (P5) and, whatever its value,
        NULL-2 removes its effect from the DL question by construction, so
        the record does not depend on it; it is stated because a flat
        marginal would be an independent finding worth its own record.
      validation_plan: >-
        SAMPLE: the same enumerations, reading the marginal per (arm, n).
        COMPARISON: the NULL-1 marginal distribution at the same n and the
        n^{-1/2} law. TAIL CHECK: the largest marginal over all arms and
        primes against the NULL-1 maximum. DECAY PARAMETER: n; a marginal
        flat in n is reported as a finding about the mixed sum, separately
        from any DL statement.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The predicted outcome is that the object
      supplies nothing beyond the interval comparator. The measurement costs
      O(n log n) bit operations per arm and prime by complete enumeration
      plus one DFT. IF the lead branch fired with an advantage eps(n) flat in
      n, the immediate consequence would be a distinguisher at cost
      eps^{-2} and, via f558e4 (F), the question whether the statistic
      localises k to a sub-interval consumable by kangaroo; no exponent is
      claimed for that and none can be until the conversion is written.
    memory_exponent: >-
      O(n) for the exact enumeration at toy scale, a property of the
      measurement and not of any algorithm. The object itself offers no
      table, no advice and no tradeoff axis.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map at
      about 0.886 sqrt(n) and small per-processor memory (KN-TECH-006, read
      in full this session; the convention includes negation per
      KN-TECH-018); BSGS at 2 sqrt(n) time and sqrt(n) memory; kangaroo at
      2 sqrt(L) on an interval; automorphism-discounted rho at sqrt(|Aut|),
      up to sqrt(6) (KN-TECH-018); Pohlig-Hellman (KN-TECH-030); generic
      preprocessing at S T^2 = Omega~(n) (KN-TECH-005). For the OBJECT
      question the incumbents are f558e4's ceiling and the o2 lane's family-I
      row, and this record is the measurement both leave owed.
    hidden_overhead: >-
      None hidden; the statistic costs O(log p) bit operations, cheaper than
      the group operation it would sit beside in any walk, and no
      o(1) appears anywhere.
    tradeoff_note: >-
      Not applicable to an attack. For the measurement, exactness is bought
      with enumeration and caps the ladder near 30 bits; sampling would
      extend it at the price of an estimator variance that would swamp the
      n^{-1/2} effect, which is why it is not used.

  dominated_by: >-
    AS AN ATTACK: mounts none, and is dominated on every axis by every row of
    the prime-field frontier, checked row by row. (1) Parallel rho with
    distinguished points and negation (KN-TECH-006): dominates on time, ties
    on memory. (2) BSGS: dominates on time, dominated on memory. (3)
    Kangaroo on an interval: not comparable, a promise problem -- and it is
    the consumer of the lead branch's hypothetical output, not a competitor.
    (4) Automorphism-discounted rho (KN-TECH-018): dominates. (5)
    Pohlig-Hellman (KN-TECH-030): not comparable. (6) Generic preprocessing
    at S T^2 = Omega~(n) (KN-TECH-005): dominates on online time, dominated
    on advice. Data and query axis: no oracle queries and no solve beyond toy
    calibration. AS A MEASUREMENT CONTRIBUTION the nearest incumbents are
    IDEA-20260815-f558e4 (dominates on the strength of its bound where the
    bound applies, dominated here on the family reached),
    IDEA-20260901-b4e6eb (same shape, different family, neither dominates),
    and KN-FIND-ffe1df / RT-EXP-1 (dominates on having RUN a digit
    measurement, dominated here on the observable measured and on the
    balance of the statistics).
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries, +0 on the constant factor.
    Quantified deltas actually claimed: (i) a zero-compute statement, with
    the corpus's own measured spectral norm, that the program's
    probabilistic-regime closure has no proof for the cheapest family
    outside its reach, and computed spectral norms per prime replacing the
    recalled bounds; (ii) an exactly computed advantage curve for three
    balanced digit statistics over six or more prime orders on the
    DL-coordinate observable, against two nulls, one comparator, two planted
    positives -- one at a novel intermediate scale n^{-0.21} -- and one
    diagnostic reproducing the o2 lane's artifact, at a few CPU-hours; (iii)
    as a by-product, the first measurement in this program of the mixed sum
    of a digit sign against the curve's Legendre indicator. No exponent moves
    and none is claimed.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    0.9 that claim (A)'s vacuity argument is correct as stated, the residual
    being the exact normalisation of the recalled Gelfond exponent, which
    Stage 0's computed norms make irrelevant. 0.85 that the balance claim
    (C) removes the marginal artifact as intended (H2's mixed sum is the
    residual risk, and NULL-2 covers it). OUTCOME split: 0.88 closure branch
    (advantage at the comparator's level, beta near 1/2), 0.03 lead branch,
    0.09 inconclusive on instrument or budget. The most likely honest
    headline is 'three statistics provably outside the Weil proof behave
    exactly like the statistics inside it, at toy scale, with the earlier
    digit-sum false positive reproduced and removed'. Priority is LOW
    because that outcome, while informative about the reach of the closure,
    moves no exponent and the lead probability is small; it is filed because
    the cell is the one the corpus lists as uncovered and because the
    intermediate-scale planted positive is a reusable instrument fix.

