idea:
  id: IDEA-20260901-c7d8f6
  question_id: RQ-RSA-d46f02
  research_question: RQ-RSA-d46f02
  goal_id: GOAL-RSA-002
  added: '2026-09-01'
  title: >-
    THE CROSS-SETTING CONTROL IS PREDICTED TO FAIL IN ONE DIRECTION, AND THE
    DIRECTION IS THE RESULT: the RSA small-root lattice and the ECDSA
    hidden-number lattice are not the same lattice question -- in the
    hidden-number lattice the secret is a COORDINATE VECTOR that must be the
    unique short vector, in the Coppersmith lattice the secret is a ROOT and
    any vector of the evaluation-kernel sublattice certifies it -- so a
    reduction-quality model expressed as an achieved root-Hermite factor
    delta(D) fitted on either setting is predicted to transfer to the other
    only in its Gram-Schmidt-profile form (the projected-target condition),
    not as delta alone; run both directions as pre-registered predictions,
    with a random q-ary lattice as the null object on which delta IS the
    reducer's, and report which invariant transfers
  class: control

  claim: >-
    FIVE SEPARABLE CLAIMS. (A) THE PREMISE BEING TESTED. RQ-RSA-d46f02 and
    GOAL-RSA-002 state that ECDSA nonce leakage and RSA partial key exposure
    are the same lattice question in two settings and that a reduction-
    quality model calibrated in one should predict the other. This record
    accepts the control and predicts its outcome: the two settings share a
    reducer and nothing else, and the transfer succeeds or fails depending on
    WHICH quantity is called reduction quality. (B) THE STRUCTURAL
    DIFFERENCE, STATED SO IT CAN BE WRONG. In the hidden-number lattice
    (Boneh-Venkatesan embedding with a Kannan row, as recalled) the target is
    the vector of nonce fragments, a specific short lattice vector whose
    coordinates are the secret; success is the unique-shortest-vector or
    bounded-distance event for that one vector, and the standard success
    condition compares the target's projection onto the last block against
    the reducer's Gram-Schmidt profile. In the Coppersmith lattice there is
    no secret vector: the secret is a root x0, and success is the event that
    SOME vector of the rank-(D-1) evaluation-kernel sublattice L0 of
    IDEA-20260901-c5e859 appears in the read-off window, which is a
    dense-sublattice event, not a unique-vector event. (C) THE PREDICTION.
    The achieved root-Hermite factor delta = (||b_1|| / det^{1/D})^{1/D}
    measured on a SUCCESSFUL Coppersmith lattice is not a property of the
    reducer but of the gap lambda_1(L)/det^{1/D}, which on these lattices is
    far below the Gaussian heuristic; so delta measured on RSA cells will be
    systematically LOWER than delta measured on hidden-number cells at equal
    D, will vary with the leakage fraction rather than with the reducer, and
    a delta(D) model fitted on hidden-number cells will mispredict the RSA
    success boundary by a margin of at least two bits of window, while the
    profile-form condition -- compare the relevant target quantity against
    the measured Gram-Schmidt profile of the reduced basis -- will predict
    both within the within-setting refit error. The competing explanation,
    which the same runs would show, is that delta transfers within tolerance
    in both directions; then the RQ's fourth target is met by the simple
    model and this record's structural argument is wrong in a measurable way.
    (D) THE NULL OBJECT. A random q-ary lattice of matched dimension and
    determinant has no planted short vector, so delta measured on it is the
    reducer's intrinsic quality. Both settings' delta values are reported as
    differences from that null; a setting whose delta equals the null's is
    one where the reducer is the binding constraint, and a setting whose
    delta sits below the null is one where the lattice's own gap is. (E)
    WHAT IS NOT CLAIMED. No attack on either primitive; no statement about
    any deployed key or signature implementation; no claim that either
    frontier is wrong; no claim about reducers not run. This is a control,
    and its deliverable is the identity of the transferable invariant, which
    GOAL-RSA-002's completion criterion 4 needs before it can be written.

  mechanism: >-
    A root-Hermite factor is defined relative to the determinant, and it
    measures the reducer only when the lattice's shortest vector is near the
    Gaussian heuristic, which is the situation on random lattices and, to
    good approximation, on the null q-ary object. On a lattice with a
    planted structure the reducer finds the planted vector or does not, and
    delta then records the planted vector's length, not the reducer's
    effort. The hidden-number lattice is planted with exactly one short
    vector (the secret) and is otherwise close to random, so its delta on
    success is the secret's length and on failure is near the null's; the
    2016-style condition captures this by comparing the secret's projected
    length against the profile rather than by quoting delta. The Coppersmith
    lattice is planted with an entire rank-(D-1) sublattice of certificates,
    many of which are short, so its delta on success is the shortest
    certificate's length, which depends on the leakage fraction through
    det(L0) and not on the reducer at all. A model that carries delta from
    one setting to the other therefore carries the wrong quantity, and the
    error is predicted to be largest where the RSA lattice is deepest inside
    its bound (shortest certificates, smallest delta) and smallest at the
    RSA frontier. The profile form transfers because it is a statement about
    the reducer's output basis -- the Gram-Schmidt norms it achieves for a
    given (D, block size, entry size) -- and that IS reducer-only, provided
    the entry sizes are matched, which the design enforces by choosing the
    ECDSA group size and the RSA modulus size so that the two lattices' entry
    bit-lengths agree at each D.

  novelty_status: unverified

