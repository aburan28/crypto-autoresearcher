  novelty_screen:
    method: >-
      Filesystem and ledger screening plus web. Grepped ledger/proposals for
      root-Hermite, uSVP, 2016 estimate, structured profile and hybrid; read
      the hits' lines; grepped the twenty-four proposals carrying RQ-ECDSA
      identifiers for Coppersmith, RSA partial, cross-setting, root-Hermite
      and GOAL-RSA-002 -- no hits; read GOAL-ECDSA-001's next_action; read
      the seven nearest RQ-RSA-d46f02 claim blocks. Web: searched for
      success prediction on Coppersmith lattices from Gram-Schmidt profiles
      and retrieved the AGVW 2017 abstract; attempted and failed to open the
      UCSD dissertation.
    results: >-
      The uSVP and profile-based estimates appear in this ledger only in the
      lattice-KEM and signature lanes (IDEA-20260805-1d76e9,
      IDEA-20260808-dd4d30, IDEA-20260829-247e35 and others), never in the
      RSA or ECDSA leakage lanes. No committed record proposes running the
      RSA-to-ECDSA reduction-quality transfer that GOAL-RSA-002's completion
      criterion 4 requires, and none predicts its direction. The observation
      that Coppersmith lattices have structured profiles is attributed to the
      unopened dissertation snippet and is unverified.
    verdict: >-
      UNVERIFIED. The control is prescribed by the RQ; what is new here is
      the pre-registered prediction of which invariant transfers and in
      which direction, the null q-ary object, and the entry-size matching
      that makes the comparison a comparison. The external structural
      observation is recalled from a snippet.

  object_first_candidate:
    tracked_object: >-
      THE REDUCER'S OUTPUT GRAM-SCHMIDT PROFILE (log ||b_i^*||)_i, followed
      across two lattice families and a null family at matched (D, entry
      size, block size), and compared against the two candidate success
      predictors -- delta alone, and the profile-form condition. Established
      families declared OFF-LIMITS as the primary lens: shift-set design on
      the RSA side, embedding design on the ECDSA side, and any tuning of
      either frontier. This record measures an instrument's portability.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The profile discards the basis
      vectors' directions and retains D scalars; delta discards all but one.
      Both are compatible with the reducer's operations in the sense that
      matters here -- the profile is what the reducer provably moves and what
      its guarantees are stated in -- and neither is a change of coordinates.
      The record's content is exactly that the coarser projection (delta)
      discards, on planted lattices, the one thing success depends on.
    propagation: >-
      ONE-STEP PROPAGATION: a BKZ tour at block size beta moves the profile
      in a way simulators predict; the record measures the profile after
      each rung of a block-size ladder on all three families and reports
      whether the RSA and ECDSA profiles at matched entry size move
      identically (reducer-only) or not (lattice-specific).
    survival_score: >-
      Survives at every D the campaign runs, since the profile is always
      available. Dissolves in two named places. (i) If entry sizes cannot be
      matched across settings at some D -- the RSA lattice has entries of
      m n bits, the hidden-number lattice of about the group size -- the
      comparison at that D is a comparison of reducers on different inputs
      and is dropped rather than fudged. (ii) On the Coppersmith side the
      'target' for the profile-form condition is not a single vector but the
      shortest certificate, so the condition must be stated with
      lambda_1(L0) in the target's place, which imports c5e859's H1 and is
      declared.

  proof_search_map:
    bottleneck: >-
      The identity of the quantity that GOAL-RSA-002 and GOAL-ECDSA-001 will
      each call reduction quality when they bind to a shared convention. If
      it is delta, this record predicts the cross-setting check fails and
      the shared convention is not a model; if it is the profile, the check
      is predicted to pass. Settling it before either goal writes its
      convention is the decision-changing step.
    baseline_embedding:
      parameter_slice: >-
        The null q-ary lattice family at each (D, entry size, block size) is
        the boundary case where delta and the profile-form condition are the
        same predictor, because there is no planted structure; on it both
        must agree with the reducer's intrinsic quality and with each other.
      reproduction_check: >-
        A frozen fixture of random q-ary lattices at D in {20, 40, 60} with
        entry sizes matched to the RSA cells, on which the measured delta
        lies in the literature-typical band for the reducer (band value
        RECALLED and to be replaced by the measured null itself) and the
        profile follows the geometric-series shape within the simulator's
        tolerance.
    observation_collision:
      observable: >-
        The success bit per cell and the two candidate predictors, delta and
        the profile-form condition.
      distinct_preimage_search: >-
        THE COLLISION IS THE HYPOTHESIS. Two cells -- one RSA, one ECDSA --
        with the same delta are predicted to have DIFFERENT success status,
        because delta on the RSA cell records the certificate's length and
        on the ECDSA cell records the reducer's. Exhibiting such a pair at
        matched D and entry size is the record's direct falsifier of delta
        as a transferable invariant, and finding none over the grid is the
        falsifier of the record.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold delta fixed and vary the forgotten structure (which setting
          the lattice came from, and on the RSA side the leakage fraction);
          the intrinsic invariant proposed to separate the fibre is the
          ratio lambda_1(L0)/det^{1/D} on the RSA side and the projected
          secret norm on the ECDSA side, each compared to the profile.
        predicted_gain: >-
          A transferable convention with a named invariant, or a measured
          demonstration that the two goals cannot share one and must say so.
      - transform: representation_reduction
        proposed_object: >-
          Restate both settings' success conditions in the single form
          'a lattice-specific target length against the reducer's profile',
          with the target length being the secret's projection on one side
          and lambda_1(L0) on the other; the interface obligations are the
          two target-length computations and the entry-size matching.
        predicted_gain: >-
          One model, two instantiations, and a stated loss (c5e859's H1) on
          the RSA side.
    quantifier_order: >-
      FOR ALL cells on the matched grid, THERE EXISTS a single reducer-only
      profile model (fitted on the null family) such that the profile-form
      condition predicts success in both settings within the declared
      tolerance; and THERE EXISTS at least one matched pair of cells with
      equal delta and different success. The witness pair may depend on the
      grid; the profile model may NOT depend on the setting, which is what
      makes it a transfer rather than two fits.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: on the tested grid, reducers and entry sizes, which of two
        named invariants predicts success across settings within a declared
        tolerance. It cannot certify a third invariant, cannot speak to
        reducers or dimensions not run, and moves no frontier.
      nearby_object_control: >-
        THE NULL q-ARY FAMILY is the object on which the conclusion 'delta
        does not transfer' is known false -- delta there is the reducer's and
        transfers trivially. A method that reports non-transfer on the null
        has not identified the planted structure as the cause and nothing
        may be read from it.
    proof_obligations:
      - claim: >-
          Entry sizes are matched across the three families at every D used
          in a comparison.
        responsibility: interface
      - claim: >-
          The null family's delta and profile agree with each other and with
          the reducer's intrinsic quality.
        responsibility: baseline
      - claim: >-
          The RSA-side target length is lambda_1(L0) and the ECDSA-side is
          the projected secret norm, each computed per instance.
        responsibility: correctness
      - claim: >-
          Predictions are made from one setting to the other with the model
          frozen before the other setting's cells are seen.
        responsibility: strictness
      - claim: >-
          Both goals' claim tiers -- leakage-model statements only -- are
          respected and no cross-primitive security statement is derived.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      Both the RSA small-root construction and the ECDSA hidden-number
      construction have been filed as KN-LIT from primary text per the two
      goals' next_action fields; this record designs the control and binds
      to whatever constructions those filings name.
    - >-
      The same reducer implementation, precision and block-size ladder are
      used on all three families; IDEA-20260816-7d747d's audit is the
      guarantee that the reducer itself is not the variable.
    - >-
      Known-answer instances on both sides with recorded seeds; the ECDSA
      side supplies its own signing key and nonces by construction, exactly
      as the RSA side supplies its factorisation.

  predictions:
    - metric: >-
        null_agreement: absolute difference between delta and the
        profile-implied delta on the null q-ary family, per cell
      direction: lower
      minimum_effect: >-
        Below 0.003 at every null cell. Larger means the two predictors are
        not equivalent even without planted structure and the design is
        mis-specified.
    - metric: >-
        rsa_delta_below_null: delta on successful RSA cells minus delta on
        the matched null cell
      direction: lower
      minimum_effect: >-
        At least 0.01 below the null on cells deep inside the bound,
        shrinking toward zero at the RSA frontier. A delta equal to the
        null's on successful deep cells falsifies the mechanism.
    - metric: >-
        ecdsa_delta_vs_null: delta on hidden-number cells minus the matched
        null delta
      direction: different
      minimum_effect: >-
        Within 0.003 of the null on FAILED cells; below the null on
        successful cells by an amount set by the secret's length. Reported,
        not thresholded, on success.
    - metric: >-
        delta_transfer_error: error in window bits of the RSA success
        boundary predicted from a delta(D) model fitted on ECDSA cells, and
        the reverse
      direction: higher
      minimum_effect: >-
        At least 2 bits in the ECDSA-to-RSA direction, against a
        within-setting refit error of at most 1 bit. Below 1 bit in both
        directions falsifies claim (C) and satisfies the RQ's control with
        the simple model.
    - metric: >-
        profile_transfer_error: the same two errors for the profile-form
        condition with the model fitted on the null family only
      direction: lower
      minimum_effect: >-
        At most 1 bit in both directions. Larger in either direction means
        neither candidate invariant transfers and the convention must say
        so.
    - metric: >-
        equal_delta_pair_count: number of matched RSA-ECDSA cell pairs with
        delta within 0.002 and different success status
      direction: higher
      minimum_effect: >-
        At least one exhibited pair with its two instances listed. Zero
        pairs over the grid is a falsifier of the record.

  minimal_test:
    design: >-
      SIX STEPS. STEP 0 (blocking): freeze the grid -- D in {20, 30, 40, 60},
      block-size ladder {2, 10, 20}, RSA modulus sizes and ECDSA group sizes
      chosen so that entry bit-lengths match at each D, leakage grids on both
      sides around their published reaches, ten seeds per cell, and the
      reducer -- in a committed file. STEP 1: build the null q-ary family at
      each (D, entry size); reduce; record delta and the profile; check
      null_agreement. STEP 2: build RSA cells (known-answer), reduce, record
      success, delta, profile, and lambda_1(L0) via c5e859's kernel. STEP 3:
      build ECDSA cells (known-answer hidden-number instances), reduce,
      record success, delta, profile, and the projected secret norm. STEP 4:
      fit delta(D, block size) on ECDSA cells alone, freeze, predict the RSA
      boundary, measure the error in window bits; then the reverse. STEP 5:
      fit the profile model on the null family alone, freeze, predict both
      settings with their own target lengths, measure both errors. STEP 6:
      search the matched grid for equal-delta pairs with different success
      and list them.
    controls:
      - >-
        NULL q-ARY FAMILY (blocking): delta and profile must agree, and
        delta must sit in a stable band across seeds.
      - >-
        ENTRY-SIZE MATCHING (blocking): no cross-setting comparison at any D
        where entry sizes differ by more than 5 percent.
      - >-
        FROZEN-MODEL RULE: every transfer prediction is made from a model
        frozen before the target setting's cells are examined; a refit after
        seeing the target is reported as exploratory, never as a transfer.
      - >-
        REDUCER INVARIANCE: IDEA-20260816-7d747d's audit, run on one cell
        from each family, to show the reducer is the same instrument on all
        three.
      - >-
        PRE-REGISTRATION: grid, ladder, seeds and tolerances frozen with hash
        before the first run.
    required_metrics:
      - null_agreement per null cell
      - delta, profile, success per cell in all three families, with wall time, peak memory and block size in the shared convention
      - lambda_1(L0) per RSA cell and projected secret norm per ECDSA cell
      - delta_transfer_error and profile_transfer_error in both directions with the frozen models' hashes
      - exhibited equal-delta pairs with instances
      - frozen protocol hash, seeds, artifact manifest with rebuild receipt

  falsification_conditions:
    - >-
      null_agreement fails. The two predictors differ even on unplanted
      lattices; the design is mis-specified and no transfer conclusion may
      be drawn.
    - >-
      delta transfers within 1 bit in both directions. Claim (C) is
      falsified; the RQ's cross-setting control passes with the simple model
      and this record's structural argument was wrong, which is reported as
      the finding.
    - >-
      Neither delta nor the profile form transfers within tolerance. The two
      settings do not share a reduction-quality model at these sizes and the
      shared convention must record that instead of a fit.
    - >-
      Successful deep RSA cells show delta equal to the null's. The
      mechanism's account of delta on planted lattices is wrong on these
      lattices.
    - >-
      Entry sizes cannot be matched at any tested D. The comparison cannot be
      run as designed; this is a design-feasibility outcome and is reported
      as such.

  confounders:
    - >-
      ENTRY-SIZE MISMATCH. The hidden-number lattice's entries are group-size
      integers; the Coppersmith lattice's are m n-bit integers. Unmatched
      entry sizes change reducer behaviour by themselves. MITIGATION: the
      matching rule and the 5 percent drop rule.
    - >-
      DIFFERENT EMBEDDINGS ON THE ECDSA SIDE. Kannan embedding versus
      closest-vector solvers change what 'success' means. MITIGATION: one
      embedding, declared, and success defined as the secret vector
      appearing in the read-off window.
    - >-
      BLOCK-SIZE LADDER TOO SHORT. At D <= 60 BKZ-20 may already be exact on
      both sides, hiding differences. MITIGATION: LLL-only rung included and
      the D = 60 cells given weight in the reporting.
    - >-
      LEAKAGE-FRACTION DEPENDENCE OF RSA delta. This is predicted and is part
      of the claim; MITIGATION is to report RSA delta as a curve over the
      leakage grid, not a scalar.
    - >-
      SEED VARIANCE. MITIGATION: ten seeds per cell with intervals; a
      transfer error is compared against the within-setting refit error, not
      against zero.

  interpretation_limits:
    - >-
      CLAIM TIER: statements about leakage models and lattice budgets on
      both sides, per RQ-RSA-d46f02 and GOAL-ECDSA-001's next_action. Nothing
      about any deployed key, signature implementation or device, and no
      cross-primitive security comparison.
    - >-
      The result names a transferable invariant on the tested grid; it does
      not certify that the invariant transfers at dimensions or block sizes
      not run.
    - >-
      GOAL-RSA-002's non-duplication clause forbids restating the ECDSA
      frontier as an RSA result and vice versa; this record produces no
      frontier on either side and consumes both goals' cells as inputs.
    - >-
      The external observation about structured profiles is recalled from a
      snippet; if the dissertation says otherwise, the mechanism's citation
      changes, the prediction does not.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NULL-FAMILY REDUCER MODEL. On random q-ary lattices of the tested
        (D, entry size, block size), the reducer's output profile follows a
        geometric series with a slope that is a function of block size alone
        to within the simulator's tolerance, and delta is stable across
        seeds to within 0.003.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the LLL and BKZ output guarantees bound the
        profile slope from above. CLASSICAL STATEMENT IMITATED: the geometric
        series assumption and the empirical root-Hermite behaviour of BKZ on
        random lattices, as reported in the estimator literature and
        RECALLED here, not read. THE GAP: at D <= 60 the asymptotic
        behaviour is not reached and the head and tail of the profile
        deviate; the null family measures the actual shape rather than
        assuming it.
      validation_plan: >-
        SAMPLE: ten seeds per null cell over the full (D, entry size, block
        size) grid. COMPARISON: measured profile against the geometric series
        at the fitted slope; measured delta spread against 0.003. TAIL CHECK:
        the worst-fitting cell reported with its residual. TRANSFER: the null
        model is used only at the (D, entry size, block size) triples where
        it was measured.
    - id: H2
      statement: >-
        RSA-SIDE TARGET LENGTH. On the Coppersmith side the profile-form
        condition uses lambda_1(L0) as the target length, and lambda_1(L0)
        lies within a factor 2 of the Gaussian heuristic on L0 (c5e859's H1)
        at dimensions where exact SVP is unavailable.
      rigorous_support: >-
        Identical to IDEA-20260901-c5e859 H1: Minkowski's bound as the
        rigorous ingredient, the Gaussian heuristic as the classical
        statement imitated, and the dense-sublattice phenomenon as the named
        gap.
      validation_plan: >-
        Inherited from c5e859 at D <= 40 by exact SVP; at D = 60 the record
        uses the heuristic value and labels every RSA-side prediction at
        that D as conditional on H2.
    - id: H3
      statement: >-
        ECDSA-SIDE SUCCESS CONDITION. On hidden-number lattices the secret
        vector is returned when its projection onto the last block of the
        reduced basis is shorter than the corresponding Gram-Schmidt norm,
        in the 2016-estimate form, to within the tolerance AGVW 2017 report.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the correctness of Babai-style lifting once the
        projected condition holds. CLASSICAL STATEMENT IMITATED: the 2016
