idea:
  id: IDEA-20260910-4b25eb
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-09-10'
  proposed_by: idea-generator
  status: proposed
  class: composition

  title: >-
    Six-round secret-key distinguisher attempt using friend-pair random
    suppression on exchange / re-boomerang / boomerang-chain ingredients,
    gated by small-AES (w=4) probability-model pilots and scored ONLY against
    GOAL-AES-003's own r=6 death-round measurements (C3-style)

  claim: >-
    TRACKED CLAIM (completion-criterion C3 style; REF-C primary). There exists
    a secret-key distinguisher object for AES-128 at r=6 — built by attaching
    Shin-style friend-pair random suppression (POINTER KN-LIT-1424) to an
    exchange, re-boomerang, or short boomerang-chain skeleton — such that
    measured ACCEPT rate at r=6 exceeds the matched 10-round AES control at
    identical data/kind with measured FPR, AND the object is ALIVE at r=6
    relative to THIS CAMPAIGN'S OWN measured death-round fixtures (yoyo /
    carrier lanes alive@5 dead@6; full-diagonal integral dead@5; REF-C rows in
    RQ-AES-003 R1). NO comparison to published 6-round distinguishers
    (exchange 2^88.2-style POINTER KN-LIT-6976; Yan 7-round POINTER
    KN-LIT-1848) as margins — R3 binds. Small-AES (w=4) pilots validate the
    probability model BEFORE AES-128 spend (methodological POINTER ePrint
    2026/1286, recalled). A clean negative — friend-pair-amplified exchange /
    boomerang-chain dies at the same r=6 wall as the campaign's yoyo fixtures
    under matched FPR discipline — is a measured bound for THIS object family,
    not a statement about the published frontier.

  object_first_candidate:
    tracked_object: >-
      THE r=6 FRIEND-AMPLIFIED EXCHANGE/BOOMERANG-CHAIN ACCEPT EVENT.
      Skeleton S is one of: (i) exchange-invariant set probe, (ii) retracing /
      re-boomerang adaptive pair, (iii) length-2 boomerang chain with named
      middle difference constraints. Amplifier A is a bounded friend-pair +
      inverse-diagonal exchange certificate. Readout: ACCEPT = S AND A at
      round count r, with primary adjudication at r=6 vs 10-round control.
    established_families_off_limits: >-
      Off-limits as sole primary lens: classical differential, linear,
      integral/square, impossible differential, MiTM, biclique, algebraic,
      yoyo-alone (campaign already measured), mixture/exchange-alone without
      friend amplifier, subspace trail. This object's primary lens is the
      COMPOSITION (skeleton AND friend amplifier) at the r=6 boundary.
    newness_score: >-
      Friend-pair suppression at r=6 on exchange/boomerang-chain skeletons is
      not present as a measured C3 attempt in the GOAL-AES-003 ledger screened
      this session (yoyo death@6 is a different object). Literature novelty
      unverified.
    testability_score: >-
      Small-AES (w=4) pilots make probability-model tests cheap; AES-128 r=6
      arms are expensive but binary against pre-registered FPR bands.
    survival_score: >-
      The entire point: survival past THIS PROGRAM's r=6 death fixtures for
      yoyo/carrier, with friend-pair amplification as the proposed lifeline.
      Prior of survival is low; information gain of a measured death is high.

  mechanism: >-
    GOAL-AES-003 has measured r=5 yoyo excess and r=6 death for that object
    family (internal receipts; REF-C / C3). Shin (KN-LIT-1424) reports friend
    pairs suppressing random fully-active/inactive patterns for 5-round
    exchanged boomerangs (recalled ACC POINTERS only). Exchange attacks
    (KN-LIT-6976 POINTER) and related-differential extensions (KN-LIT-1848
    POINTER) suggest skeletons that historically reach toward 6–7 rounds in
    the literature — UNADJUDICABLE here as margins.
    THIS MECHANISM: (1) pick one skeleton S implementable on the pinned
    FIPS-197 harness; (2) attach friend-pair amplifier A with frozen search
    budget; (3) SMALL-AES PILOT (w=4): validate that rate(A), rate(S),
    rate(S AND A) match the pre-registered rare-event model on a miniature
    AES-like SPN at reduced word size — reject the AES-128 spend if the pilot
    model fails; (4) measure AES-128 at r∈{5,6,7} and 10-round control under
    identical budgets; (5) C3 decision rule: at r=6, AES ACCEPT rate exceeds
    control with pre-registered significance AND measured FPR stated with
    resolution in bits; graded decay r=5→6→7→10 required. COST under CM-3
    recorded for any positive; negatives report the measured death round of
    THIS object with FPR.

  novelty_status: unverified

  literature_context:
    - ref: KN-LIT-1424
      provenance: kb
      claim: >-
        Friend-pair + exchanged boomerang at 5 rounds (Shin 2025/248);
        recalled ACC figures POINTER only; used here as amplifier ingredient
        for an r=6 attempt, not as a reproduction claim.
      verified_by: null
    - ref: KN-LIT-1848
      provenance: kb
      claim: >-
        Related-differential distinguishers up to 7 rounds (Yan 2026/1039);
        recalled ACP/7-round figures POINTER only — may seed alternate
        skeleton S, never a margin.
      verified_by: null
    - ref: KN-LIT-6976
      provenance: kb
      claim: Exchange attack distinguishing 6-round AES (abstract POINTER).
      verified_by: null
    - ref: KN-LIT-699
      provenance: kb
      claim: Practical 5-round adaptive distinguishers (POINTER).
      verified_by: null
    - ref: "eprint.iacr.org/2026/1286"
      provenance: recalled
      claim: Small-AES (w=4) validation of multiple-of / related-differential
        probability models — methodological POINTER for Stage 1 pilots.
      verified_by: null
    - ref: GOAL-AES-003 / RQ-AES-003 REF-C
      provenance: internal
      claim: >-
        Campaign measured death rounds (integral full-diagonal dead@5;
        yoyo/carrier alive@5 dead@6) — the ONLY r=6 bar this claim may clear.
      verified_by: idea-generator (read RQ-AES-003 claim_tier_ceiling and
        GOAL-AES-003 excerpts this session)

  lossy_projection_identifiability_audit:
    projection: >-
      Adaptive multi-query transcript at round count r → (S bit, A bit) →
      ACCEPT bit; compared across r.
    what_is_discarded: Witness identities, unused friend branches, raw bytes.
    why_genuinely_lossy: ACCEPT is one bit per trial schedule.
    why_compatible_with_the_operations: >-
      S is defined under exchange / boomerang adaptive operations; A is a
      predicate on inverse-diagonal exchanges; both are compatible with the
      named operation set (exchanges + adaptive encrypt/decrypt), not with
      unrestricted translation of the full codebook.
    is_it_only_a_change_of_coordinates: No — irreversible discard of witnesses.

  predictions:
    - metric: >-
        Small-AES (w=4) residual between measured rate(S AND A) and model
        prediction on a random-permutation-like null of the same width
      direction: lower
      minimum_effect: >-
        Residual inside pre-registered tolerance before any AES-128 r=6 arm
        is charged. Failure STOPS the AES-128 spend (pilot gate).
    - metric: >-
        AES-128 ACCEPT rate at r=6 minus 10-round control rate, matched budget
      direction: higher
      minimum_effect: >-
        C3 PRIMARY: significant excess at pre-registered α with control FPR
        and instrument resolution in bits in the same sentence. NULL
        prediction allowed and valuable: no excess ⇒ measured death@6 for
        this friend-amplified object, scoped.
    - metric: Graded excess at r∈{5,6,7,10}
      direction: lower
      minimum_effect: >-
        Monotone non-increase of AES−control gap as r grows (within error).
        Non-monotone gap voids the reading (artifact tell).

  minimal_test:
    design: >-
      STAGE 0: select skeleton S; implement friend amplifier A; freeze query
      schedule and ACCEPT rule digest.
      STAGE 1 (PILOT GATE): small-AES w=4 probability-model validation for
      S, A, and S∧A against a matched null; stop on failure.
      STAGE 2: AES-128 r=5 positive-control arm (expect excess if S is
      structurally alive at 5) + 10-round control.
      STAGE 3 (C3): AES-128 r=6 + control at matched cost; optional r=7 spot.
      Verdict-on-null-first: control arms hash-committed before AES r=6 read.
    controls:
      - 10-round AES matched control (mandatory FPR).
      - Small-AES null of same shape (pilot).
      - Misaligned exchange sibling (geometry isolation).
      - S without A ablation (is friend pair load-bearing at r=6?).
      - Campaign yoyo death@6 fixture as EXTERNAL REF-C comparator object
        (different object; cited as bar, not as shared code path).
    required_metrics:
      - pilot residuals and pass/fail
      - ACCEPT rates per r with CI
      - FPR + resolution in bits
      - ablation S vs S∧A at r=5 and r=6
      - CM-3 wall clock, RSS, queries
      - ACCEPT rule digest

  falsification_conditions:
    - Stage 1 pilot residual out of tolerance — do not charge AES-128 r=6.
    - >-
      r=6 AES−control gap insignificant at frozen budget — object dead@6;
      record measured bound; do not soft-pedal as "needs more data" without
      a pre-registered extension rule.
    - Gap non-monotone in r — artifact; void.
    - >-
      Excess at r=6 only when A is disabled — friend amplifier not the
      mechanism; reassign claim.
    - Any use of published 6-round figures as completion margins — R3 void.

  confounders:
    - >-
      Skeleton choice fishing: multiple S tested without correction will
      manufacture a r=6 hit; freeze S at Stage 0 from a declared shortlist.
    - >-
      Adaptive schedule leakage between r=5 tuning and r=6 test — separate
      key sets mandatory.
    - >-
      Small-AES (w=4) transfer: pilot pass does not prove AES-128 rates; it
      only validates model shape. State transfer assumptions explicitly.
    - AES-NI pinning: RQ-AES-003 forbids charging unpinned AES-NI paths.

  interpretation_limits:
    - Toy tier; reduced-round only; never full-round AES.
    - >-
      Clearing C3 is survival past THIS PROGRAM's death rounds, not a
      published-frontier claim (R3).
    - Related-key variants cannot complete.
    - >-
      Proposal only; Coordinator designs/approves experiments under standing
      authorisation.

  heuristic_assumptions:
    - id: HEUR-R61
      statement: >-
        Friend-pair certificate rates on a small-AES (w=4) null track the same
        functional form (up to a fitted scale) as on AES-128 10-round control,
        so pilot rejection correctly predicts AES-128 model failure.
      rigorous_support: >-
        Word-size reduction preserves exchange/diagonal combinatorics at the
        pattern level while shrinking byte alphabets; classical SPN toy-scale
        transfer used in 2026/1286 (POINTER, recalled).
      validation_plan: >-
        After a pilot PASS, run a cheap AES-128 control-only arm at reduced N
        and compare normalised A rates; large discrepancy falsifies transfer.
      falsification_condition: >-
        Normalised rate(A) on AES-128 control differs from w=4 pilot by more
        than the pre-registered factor — HEUR-R61 fails; reinterpret pilot.
    - id: HEUR-R62
      statement: >-
        Conditional on S being alive at r=5 under ablation, attaching A can
        preserve a detectable AES−control gap through one additional full
        round by suppressing control false ACCEPT more than AES true ACCEPT.
      rigorous_support: >-
        Analogical transfer of Shin's random-suppression POINTER from r=5
        exchanged boomerang; not a theorem at r=6.
      validation_plan: >-
        Stage 2–3 ablation tables; primary test is r=6 gap with A on.
      falsification_condition: >-
        A reduces AES and control rates proportionally at r=6 — amplifier
        non-discriminating; HEUR-R62 dead for chosen S.

  target_complexity:
    time_exponent: >-
      No asymptotic exponent. Target: measured CM-3 cost of an r=6 ACCEPT
      decision IF C3 clears; otherwise a measured death-round bound for this
      object. Compare only to REF-C (campaign death fixtures), REF-B
      (same S without A, measured), REF-A. Published 6-round costs are
      POINTERS only (e.g. KN-LIT-6976 abstract ~2^88.2 CP — recalled/kb,
      unadjudicable as margin).
    memory_exponent: Measured peak RSS under CM-3.
    best_known: >-
      Best known TO THIS PROGRAM at r=6 for friend-amplified exchange/
      boomerang-chain ACCEPT: none. Nearest REF-C bars are yoyo dead@6 and
      integral dead@5.
    hidden_overhead: >-
      Small-AES harness build and pilot compute are charged before AES-128;
      skeleton shortlist freezes are mandatory overhead.
    tradeoff_note: >-
      Friend amplifier raises adaptive query cost to buy FPR reduction; at
      r=6 the Pareto question is whether any LR remains after the extra round.

  dominated_by: >-
    If Stage 3 finds no r=6 gap, the object is dominated_by the campaign's
    existing r=6 death fixtures for practical ranking (do not keep spending
    without a new skeleton). If S without A already clears C3, adding A is
    dominated_by that simpler REF-B unless A improves FPR/cost Pareto.
    Published 6-round rows: unresolvable under R3.
  sota_delta: >-
    vs REF-C / C3: binary — survives r=6 with measured FPR, or measured dead
    at r=6 for this object. vs REF-B: ΔFPR and ΔCM-3 from adding A. vs REF-A:
    not the interesting axis for a distinguisher. Published delta:
    UNADJUDICABLE in both directions.

  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: high
  honest_prior_of_survival: >-
    ~0.55 that Stage 1 small-AES pilots can be made decisive for model shape;
    ~0.10 that AES-128 r=6 clears C3 for at least one frozen (S,A). Low r=6
    prior reflects the campaign's own measured wall for related adaptive
    objects; the IDEA is still high priority because a scoped death with
    friend-pair ablation is the cheapest honest C3-facing experiment seeded
    by Shin's amplifier that does not merely reproduce 5-round exchanged
    boomerang.
