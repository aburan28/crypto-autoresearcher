  assumptions:
    - >-
      The Boolean variable count is v = t*b + (t-2)*n with b = ceil(n/t) + 1,
      read off the specification's construction. If the driver introduces
      additional auxiliary variables -- slack bits, symmetrisation variables, or
      a different membership encoding -- v is larger and every column count in
      claim (A) is a LOWER bound, which strengthens the blocking conclusions and
      weakens none of them. Stage 0b reads the driver and settles it.
    - >-
      The instrument stores the Macaulay layer densely over the full monomial
      space. If it uses a sparse column representation, the guards should be
      restated in nonzeros and claim (C)'s 5 GB figure does not apply; this is a
      source-reading obligation, not an assumption to be carried.
    - >-
      Peak resident memory is the binding contract quantity. Page cache,
      temporary files and any SageMath TMPDIR behaviour can dominate, so peak
      RSS, peak virtual size and temporary disk are all reported.
    - >-
      No result of this record is mathematical evidence about reusable
      dependencies, about solving degree, or about the ECDLP. It produces a
      feasibility table, a memory formula, an occupancy measurement and a charge
      ledger. The measurements those enable are separate work under this
      question's own approval, which this record neither has nor requests.
    - >-
      The host is 14 cores and 48 GB and task contracts are 8 GiB. A cell that
      needs 10 GB is out of contract even though the host could hold it, which is
      why the diagnosis is about the formula and not about the machine.

  proof_search_map:
    bottleneck: >-
      The column space of the Macaulay layer. In this lane rows are far fewer
      than columns, so both the matrix term and the carrier term scale with the
      column count, and the exact step whose removal would change the ladder's
      reach is "carry the full degree-<=D monomial space".
    baseline_embedding:
      parameter_slice: >-
        chain_t3 at n=8, D=2, where v = 20 and the column count is
        1 + 20 + 190 = 211 -- small enough to enumerate the entire monomial space
        by hand and to check the driver's own reported column count against it
        exactly. Second slice: D = 0, where the layer is the generators
        themselves and the column count is 1.
      reproduction_check: >-
        Exact integer equality between the closed form sum_{i<=D} binom(v,i) and
        the driver's reported column count, on at least six cells spanning a 100x
        range, with ZERO tolerance. A mismatch means v is not what the
        specification implies and the entire feasibility table must be rebuilt
        against the driver's real variable set before any cell is scheduled.
    observation_collision:
      observable: >-
        Peak resident memory for a cell.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the formula rather than
        the number is the deliverable. A 6 GB peak is produced equally by a
        matrix-dominated cell (rows x cols large, rank small) and by a
        carrier-dominated cell (rank x cols large, rows small); the two demand
        opposite fixes -- streaming in the first case, a different rank method in
        the second, which is IDEA-20260829-cb2a65's lane. They are separated only
        by reporting rows, rank and occupied columns ALONGSIDE the peak, so those
        three are required metrics and a bare peak-RSS number is prohibited by
        this record.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Replace the two scalar resource guards by a problem-specific resource
          measure -- peak bits as an explicit function of rows, occupied columns,
          rank and streaming window -- realise it by instrumenting the run, and
          charge memory only over allocation blocks proved disjoint (layer
          storage, pivot carrier, multiplier index, output). Obligations kept
          separate: encoding (the closed-form column count), completeness (every
          allocation is attributed to a block), soundness (the formula must never
          underpredict), transfer (constants are per-implementation), cost loss
          (none; the formula is free).
        predicted_gain: >-
          Converts "will n=14 fit" from an experiment that consumes a twelve-hour
          budget into arithmetic answered in minutes, and converts a
          resource-guard skip -- which the contract itself rules is not evidence
          -- into a cell that was never scheduled. NO ATTACK EXPONENT IS MOVED.
      - transform: representation_reduction
        proposed_object: >-
          Restrict the column space to the columns actually occupied by some row,
          measured by streaming with no matrix allocation, and re-express both
          memory terms in the occupied count. Whether this is a reduction at all
          is the occupancy ratio, which is unmeasured and which the pre-registered
          rule in claim (D) decides.
        predicted_gain: >-
          If occupancy is at most 0.10, at least a factor 10 in both memory terms
          and two more ladder rungs; if at least 0.50, nothing, and the route is
          killed with a measured number attached.
    quantifier_order: >-
      CLAIMED. FORALL Phase-A cells (n, t, representation, D), the Macaulay
      column count equals sum_{i<=D} binom(v,i) with v determined by the
      construction, and THEREFORE the cells enumerated in claim (A) exceed the
      specification's max_columns guard. This is an arithmetic identity plus a
      comparison, with no experiment in it.
      SEPARATELY CLAIMED, and conditionally. FORALL cells, IF the measured
      occupancy is at most the pre-registered threshold, THEN THERE EXISTS a
      column-compressed layout whose peak resident memory is bounded by the
      fitted formula within a stated tolerance.
      NOT CLAIMED: that any of this bears on the mathematics. A feasibility table
      is not evidence about reusable dependencies and this record produces none.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the enumerated cells, the Macaulay column count is the stated
        integer and exceeds the declared guard, and peak resident memory is
        predicted by the fitted formula within the stated tolerance across the
        calibrated range." It can NEVER certify anything about solving degree,
        about reusable dependencies, about the ECDLP, or about cells outside the
        calibrated range -- and a formula fitted at one size predicts nothing at
        another, which is why the calibration must span at least a 100x range
        before any n=14 or n=16 prediction is quoted.
      nearby_object_control: >-
        A DENSE RANDOM SYSTEM at the identical (v, D, generator count and degree
        profile), where the occupancy must be visibly HIGHER and the compression
        route must be visibly WORSE. A layout that looks good on the dense
        control is not exploiting anything and its numbers on the real system are
        meaningless. Second nearby object: the direct_t3 representation, which
        has no auxiliary variables and hence a much smaller v at the same n, so
        the table must show it reaching HIGHER degrees within the same guard --
        198,440 columns at n=16 D=7 against 510,416 for chain_t3 at n=16 D=5. If
        the table does not reproduce that ordering, the variable count is wrong.
    proof_obligations:
      - claim: >-
          v = t*b + (t-2)*n with b = ceil(n/t)+1 for the specified constructions.
        responsibility: baseline
      - claim: >-
          Column count equals sum_{i<=D} binom(v,i) exactly, matching the driver.
        responsibility: correctness
      - claim: >-
          The enumerated cells exceed max_columns 200000.
        responsibility: size
      - claim: >-
          Two independent 200000 guards admit a 5.0 GB dense matrix plus up to a
          further 5.0 GB carrier.
        responsibility: memory
      - claim: >-
          Measured column occupancy per cell, by streaming, with no matrix
          allocated.
        responsibility: feasibility
      - claim: >-
          The fitted peak-memory formula predicts measured peaks within 25
          percent across a 100x range.
        responsibility: memory
      - claim: >-
          The charge ledger's conversion constants are frozen before any cell
          runs and reported with every derived figure.
        responsibility: interface
      - claim: >-
          The matched rho arm reproduces 0.886*sqrt(N) under the frozen
          convention.
        responsibility: baseline
      - claim: >-
          The dense nearby-object control shows higher occupancy and a worse
          compression outcome.
        responsibility: scope

  predictions:
    - metric: >-
        driver-reported Macaulay column count versus the closed form
        sum_{i<=D} binom(v,i), on at least six cells spanning a 100x range
      direction: different
      minimum_effect: >-
        FORCED EXACT, zero tolerance. A single mismatch means the variable count
        is not what the specification implies, the entire feasibility table is
        void, and the correct v is the finding. This is the cheapest and hardest
        gate in the record.
    - metric: >-
        number of Phase-A cells whose column count exceeds max_columns 200000
      direction: different
      minimum_effect: >-
        PREDICTED, cell by cell and stated in advance so it can be wrong:
        chain_t3 blocked at (n=14, D=5) and (n=16, D=5); chain_t4 and balanced_t4
        blocked at (n=10, D=5), (n=12, D=5), (n=14, D=5), (n=16, D=5),
        (n=14, D=4) and (n=16, D=4); direct_t3 blocked at (n=16, D=8) and
        (n=16, D=9). Any cell in that list that in fact runs to completion
        falsifies the variable count, and any cell NOT in the list that hits the
        guard falsifies it in the other direction.
    - metric: >-
        column occupancy, defined as distinct occupied columns divided by
        sum_{i<=D} binom(v,i), measured by streaming the generator with no matrix
        allocation
      direction: different
      minimum_effect: >-
        PRE-REGISTERED THREE-WAY DECISION RULE, COMMITTED BEFORE THE COUNT IS
        TAKEN: occupancy at most 0.10 means column compression buys at least 10x
        and the compressed layout is worth building; occupancy at least 0.50
        means it buys under 2x and the route is DEAD, with the occupancy recorded
        as a measured structural fact about descended Semaev Macaulay layers;
        between those, report the measured crossover and take no decision. The
        band is fixed here so that neither branch can be reached afterwards by
        moving the threshold.
    - metric: peak resident memory of the streaming occupancy count itself
      direction: lower
      minimum_effect: >-
        PREDICTED under 256 MB at every cell, since its only large allocation is
        a bitmap of sum_{i<=D} binom(v,i) bits -- 12.7 kB at the largest admitted
        cell -- plus one row at a time. If the count itself exhausts memory, the
        generator cannot be streamed, and that pipeline defect is a first-order
        finding that must be fixed before any Macaulay measurement is discussed.
    - metric: >-
        measured peak resident memory versus the fitted formula
        c1*rank*cols + c2*rows_resident*cols + c3*cols
      direction: different
      minimum_effect: >-
        Formula must predict the measured peak within 25 percent across a
        calibration set spanning at least a 100x range of rows times columns.
        Predictions for n=14 and n=16 are RECORDED BEFORE those cells are
