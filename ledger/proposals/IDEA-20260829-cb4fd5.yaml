idea:
  id: IDEA-20260829-cb4fd5
  question_id: RQ-SBRG-f31cb2
  added: '2026-08-29'
  title: >-
    SIZE THE LADDER BEFORE YOU CLIMB IT, AND CHARGE THE XORs BEFORE YOU QUOTE
    THEM: the Phase-A monomial counts of EXP-SBRG-60c55e are exact binomial sums
    computable with zero compute, and they say that chain_t3 at D=5 is
    guard-blocked for n >= 14 (242,825 columns at n=14) while chain_t4 at D=5 is
    guard-blocked from n=10 -- so the contract's own advance gate, which needs
    three increasing n at one degree, is reachable only at D <= 4; meanwhile its
    two independent 200,000 guards jointly permit a 5 GB dense matrix plus a 5 GB
    pivot carrier, which is precisely the 12 GiB envelope that stopped the
    GOAL-DREG-001 n=15 D=6 attempt, and no XOR count from any cell can answer a
    question with the words "fully charged" in it until a frozen conversion to
    the two-term model and a matched rho baseline exists

  class: tooling

  claim: >-
    (A) THE FEASIBILITY TABLE IS ARITHMETIC AND IT IS AVAILABLE NOW. The Macaulay
    column count at degree D over v Boolean variables is exactly
    C(v, D) := sum_{i <= D} binom(v, i). For EXP-SBRG-60c55e's chain_t3 the
    Boolean variable count is v = 3b + n with b = ceil(n/3) + 1 (three
    factor-base x-coordinates in a dimension-b subspace, one full-field auxiliary
    node); for chain_t4 and balanced_t4 it is v = 4b + 2n with b = ceil(n/4) + 1;
    for direct_t3 it is v = 3b with no auxiliary. Instantiating, and every number
    here is hand-checkable:
    chain_t3 at D=5 gives 21,700 columns at n=8, 68,406 at n=10, 101,584 at n=12,
    242,825 at n=14 and 510,416 at n=16 -- so n=14 and n=16 EXCEED the
    specification's own max_columns guard of 200,000. At D=4 the same cells give
    6,196 / 15,276 / 20,854 / 41,449 / 74,519 and all five fit.
    chain_t4 at D=5 gives 122,438 at n=8, 443,704 at n=10 and 760,099 at n=12 --
    blocked from n=10 upward. At D=4 it gives 24,158 / 66,712 / 102,091 at
    n=8/10/12 but 213,053 at n=14 and 294,204 at n=16 -- blocked from n=14. At
    D=3 all five fit.
    direct_t3 at n=16 has v=21, and D=9 gives 695,860 columns -- blocked -- while
    D=7 gives 198,440, just inside.
    (B) THE SCHEDULING CONSEQUENCE, WHICH IS THE POINT OF (A). The contract's
    advance gate requires "at least three increasing n values" showing the same
    DEGREE-RELATIVE signal. Under the guards as written, chain_t3 has three
    admissible n at D=5 (8, 10, 12) with no headroom, chain_t4 has ONE at D=5,
    and the only degree at which every representation has five admissible n is
    D=3. A twelve-hour Phase-A budget spent discovering this by resource-guard
    skips would produce, per the contract's own rule budget_skip_is_evidence
    false, no evidence at all. The table costs minutes and is producible before
    any code runs.
    (C) THE MEMORY DIAGNOSIS, AND IT IS THE SAME SHAPE AS THE FAILURE THIS
    PROGRAM ALREADY HAD. Two INDEPENDENT guards, max_rows 200,000 and
    max_columns 200,000, jointly admit a cell whose dense GF(2) matrix is
    200,000 x 200,000 bits = 5.0 GB, and whose echelon pivot carrier is a further
    rank x columns bits, up to another 5.0 GB. The specification budgets 16 GB
    and would survive; an 8 GiB task contract would not. That combination -- a
    guard on each dimension separately and none on the product, with a carrier
    whose size is rank times the full column space -- is exactly the structure
    IDEA-20260829-cb2a65 diagnoses for the chunked block-M4RI instrument, and it
    is the structure of the 2026-08-28 GOAL-DREG-001 n=15 D=6 attempt, which
    terminated as resource_exhaustion in 6 of 6 runs at about 12 GiB against an
    8 GiB contract with 768,212 columns and the rank kernel never invoked. THAT
    STOP WAS AN INFRASTRUCTURE FAILURE UNDER AGENTS.md RULE 3 AND IS NEVER
    NEGATIVE MATHEMATICAL EVIDENCE ABOUT ANYTHING; it is cited here only as a
    shape to avoid, and its figures are carried second-hand and are re-cited as a
    blocking verification obligation below.
    PROPOSED REPLACEMENT, stated as a formula rather than a number: guard the
    PRODUCT, peak_bits <= c1 * rank * cols + c2 * rows_resident * cols + c3 * cols
    with rows_resident the streaming window, fit c1..c3 on measured cells, and
    admit a cell only if the formula predicts under the contract. A contract that
    is an arithmetic expression turns "will n=16 fit" from an experiment into a
    question answered before any budget is spent.
    (D) THE COLUMN-OCCUPANCY PRE-TEST, WHICH IS THE CHEAPEST DISCRIMINATOR AND
    THE ACTUAL EXPERIMENT. C(v, D) counts EVERY monomial of degree at most D.
    The number actually OCCUPIED by some row is at most rows times the maximum
    per-row support, and a Macaulay row is one descended generator times one
    squarefree multiplier, Boolean-reduced -- and Boolean reduction can merge
    terms but never create them, so a row's support is bounded by the generator's
    term count. The occupancy ratio (distinct occupied columns) / C(v, D) is
    therefore an UNMEASURED NUMBER that decides whether a column-compressed
    representation buys ladder rungs. PRE-REGISTERED THREE-WAY DECISION RULE,
    COMMITTED BEFORE THE COUNT IS TAKEN: occupancy at most 0.10 means column
    compression buys at least a factor 10 in both memory terms and the blocked
    cells at n=14 and n=16 become reachable, so the compressed representation is
    worth building; occupancy at least 0.50 means compression buys under 2x and
    the guard-blocked cells stay blocked, which KILLS the compression route and
    records the occupancy as a measured structural fact about descended Semaev
    Macaulay layers that nobody currently has; between those the measured value
    is reported and no decision is taken. The count is obtained by STREAMING the
    generator and marking a bitmap of C(v,D) bits -- 12.7 kB at the largest
    admitted cell -- with no matrix ever allocated.
    (E) THE CHARGE LEDGER, WITHOUT WHICH THIS QUESTION CANNOT BE ANSWERED AT ALL.
    RQ-SBRG-f31cb2 asks about FULLY CHARGED cost. EXP-SBRG-60c55e's Phase-A
    observable is an XOR count, which its own text calls
    "deterministic implementation-level operation counts ... not
    machine-independent time bounds". This record supplies the missing mapping:
    a frozen conversion from XOR counts to the per-trial decomposition charge D,
    from D through IDEA-20260829-b5a2c8's optimum T* = Theta((N D)^{2/(m+1)}) to
    an end-to-end figure, and from there to a matched Pollard rho operation count
    under one declared convention. Every constant is pinned and reported before
    any cell runs. Without it a Phase-A number is uninterpretable with respect to
    this question, and with it every Phase-A number becomes interpretable
    immediately.

  mechanism: >-
    THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST. The tracked object is the
    RESOURCE SHAPE of a Macaulay layer -- the triple (rows, occupied columns,
    rank) together with the per-row support histogram -- with all coefficients,
    all monomial labels, the curve, the field basis and the target discarded.
    It is genuinely lossy: an enormous number of distinct systems share any given
    resource shape, and from the shape neither the matrix nor the ideal nor even
    the arity can be recovered. It is lossy COMPATIBLY with the operations of the
    target, which is the load-bearing half: elimination consumes rows, produces
    pivots and touches columns, and the peak resident memory and the XOR count
    are functions of the shape alone under the stated allocator model, so the
    retained triple propagates deterministically through exactly the operations
    the instrument performs. The projection that FAILS the test, and is
    deliberately not used, is the matrix itself, which loses nothing and is the
    object whose storage is the problem. THE REUSE IS DISCLOSED: this is
    catalogue object O5, the sparsity pattern, applied as an INSTRUMENT rather
    than as an attack, and IDEA-20260829-cb2a65 already applies the same object
    to a different lane. Nothing about the object is claimed as new; what is new
    here is the closed form for THIS grid and the occupancy question, which that
    record does not ask because its instrument is row-density bound and this
    one is column-space bound.
    WHY THE COLUMN COUNT IS AN IDENTITY AND NOT AN ESTIMATE. The Macaulay layer
    is DEFINED in EXP-SBRG-60c55e as the span of every squarefree multiplier of
    degree D - d_i times each generator, Boolean-reduced. The ambient monomial
    space of degree at most D in v Boolean variables has exactly
    sum_{i<=D} binom(v,i) elements, by definition of the Boolean ring
    F_2[z]/(z^2 - z). The variable count v is read off the construction: t
    factor-base x-coordinates each carrying b Boolean coordinates because the
    factor base is a dimension-b subspace, plus one full n-bit auxiliary per
    internal chain node, of which a t-chain has t-2. So v = t*b + (t-2)*n with
    b = ceil(n/t) + 1, which gives 3b + n at t=3 and 4b + 2n at t=4. No
    modelling choice enters anywhere.
    WHY THE OCCUPANCY QUESTION IS THE RIGHT ONE. In this lane the rows are far
    FEWER than the columns -- at chain_t3 n=12 D=5 the layer has of order 10^4
    rows against 1.0x10^5 columns -- so the system is massively underdetermined
    and the rank is row-limited. Memory is therefore driven by the COLUMN space,
    not by the rank, which is the opposite of the DREG lane's diagnosis and is
    why the same fix does not apply. The lever available here is to stop carrying
    columns nothing touches, and whether that lever has any length is exactly the
    occupancy ratio.
    WHERE THE ARGUMENT STOPS. It stops if the instrument uses a sparse column
    representation already, in which case the column count bounds nothing and the
    guards should be restated in nonzeros; that is a source-reading obligation
    discharged in Stage 0b before any number in claim (C) is quoted. It also
    stops at the fitted allocator constants, which are implementation properties
    and are not transferable to any other instrument.

  novelty_status: unverified

