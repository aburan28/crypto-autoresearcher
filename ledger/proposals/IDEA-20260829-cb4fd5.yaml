  heuristic_assumptions:
    - id: H1
      statement: >-
        The distinct columns occupied by the Macaulay layer at degree D number at
        most rows times tau, where tau is the maximum per-row support, and tau is
        bounded by the term count of the descended generators -- a quantity fixed
        by the construction and INDEPENDENT of the size of the degree-D monomial
        space; so occupancy is O(rows * tau / sum_{i<=D} binom(v,i)) rather than
        Theta(1).
      rigorous_support: >-
        The RIGOROUS ingredient is structural and elementary. A Macaulay row is a
        single generator multiplied by a single squarefree monomial and then
        Boolean-reduced; Boolean reduction (z^2 = z) can MERGE terms but never
        create them, so the row's support size is at most the generator's term
        count, before and after reduction. That bound is exact and needs no
        assumption. The CLASSICAL STATEMENT IMITATED is the sparsity assumption
        underlying every sparse-FGLM and block-Wiedemann application to
        polynomial system solving -- that Macaulay matrices inherit the sparsity
        of their generators. THE GAP, which is the whole risk, is that the
        descended chained Semaev generators may themselves be DENSE in the
        descent variables, in which case tau is comparable to the monomial space
        and occupancy is Theta(1); Stage 1 measures exactly that and the
        pre-registered kill rule fires on it.
      validation_plan: >-
        SAMPLE. Stream 100 percent of the rows -- an exhaustive count, not a
        sample -- of chain_t3 at (n,D) in {(8,5), (10,5), (12,5), (12,4)} and
        chain_t4 at {(8,5), (12,4)}, so occupancy is measured across at least a
        20x range of column counts and at two arities. COMPARISON. The generator
        term counts computed INDEPENDENTLY from the driver's own inputs; the
        measured per-row support must never exceed the generator term count, and
        a violation is an implementation defect rather than a finding. TAIL
        CHECKS. The MAXIMUM per-row support rather than the mean, since peak
        memory is driven by the tail; the upper decile of the support histogram
        reported separately, because a heavy tail defeats a mean-based contract;
        and the largest cell reported individually. SAMPLED PARAMETERS RECORDED.
        n, t, representation, D, v, b, field basis, orientation, seed, generator
        commit, rows, columns, occupied columns, support histogram. TRANSFER.
        NONE. No cell's occupancy is extrapolated to another and the memory
        formula's fitted range is stated with every prediction it is used for.
    - id: H2
      statement: >-
        Peak resident memory of a cell is c1*rank*cols + c2*rows_resident*cols +
        c3*cols bits for constants c1, c2, c3 that depend only on the
        implementation and the allocator, not on n, t, D or the representation,
        with rows_resident the streaming window size.
      rigorous_support: >-
        The RIGOROUS ingredient is that each of the three named allocation blocks
        has a size that is an exact product of measured integers -- the pivot
        carrier holds rank rows of cols bits, the resident window holds
        rows_resident rows of cols bits, and the multiplier and output indices
        are linear in cols -- so the formula is a sum of exact block sizes with
        multiplicative constants absorbing per-block overhead. The CLASSICAL
        STATEMENT IMITATED is the standard dense-linear-algebra memory account.
        THE GAP is everything the allocator does that is not a named block --
        temporaries, interpreter overhead, page cache, garbage-collection slack
        -- which is why the formula is FITTED and required never to underpredict,
        and why peak virtual size and temporary disk are reported alongside RSS.
      validation_plan: >-
        SAMPLE. Every admitted calibration cell, spanning at least a 100x range
        of rows times columns, with at least 3 repeats per cell to separate
        allocator noise from cell size. COMPARISON. Fitted c1, c2, c3 with
        residuals; the fit is FROZEN before any n=14 or n=16 prediction is made,
        and the predictions are recorded with a timestamp before the cells are
        attempted. Required accuracy 25 percent, with underprediction anywhere
        treated as failure regardless of magnitude. TAIL CHECKS. The largest
        cell and the cell with the highest rank-to-rows ratio reported
        individually, since those are where the two leading terms exchange
        dominance and where a single-term fit would look adequate and be wrong.
        TRANSFER. None; c1, c2, c3 are properties of one implementation on one
        host and are re-fitted after any change to either.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this is an instrument and it attacks
      nothing. Instrument complexity, stated exactly and comparatively for a
      Macaulay layer with R rows over C = sum_{i<=D} binom(v,i) columns and rank
      r over GF(2). Dense elimination costs Theta(R * r * C / 64) word
      operations; the streaming occupancy pre-test costs Theta(nnz) bit
      operations with no elimination at all, i.e. it is cheaper than one pass of
      the thing it decides. The charge ledger is arithmetic.
    memory_exponent: >-
      Dense as scheduled: Theta(R*C + r*C) bits, which at the guard boundary
      (R = C = 200,000) is up to 10.0 GB and exceeds an 8 GiB contract.
      Column-compressed, IF the occupancy is o: Theta(o * (R*C + r*C)) bits, a
      predicted factor 1/o. Streaming pre-test: Theta(C) bits for the occupancy
      bitmap, at most 64 kB anywhere on this grid. The whole of this record's
      value sits on this axis.
    best_known: >-
      For exact GF(2) rank and elimination of Macaulay layers the standing
      methods are dense M4RI elimination -- this program's current instrument in
      the sibling DREG lane, measured at about 7 GB peak at its n=12 D=6 cell --
      and black-box Krylov methods, which IDEA-20260829-cb2a65 proposes for that
      lane. This record proposes no new algorithm and claims no improvement over
      the published state of sparse linear algebra; it proposes sizing the grid
      before running it and charging the output afterwards.
    hidden_overhead: >-
      DISCLOSED. (i) The blocking conclusions rest on an INFERRED variable count;
      the driver was not opened and Stage 0b is blocking for that reason.
      (ii) The compression gain is entirely conditional on the unmeasured
      occupancy, and Stage 1 exists to kill the route if it is high. (iii) The
      memory formula's constants are fitted, not derived, and are valid only over
      the calibrated range and only for one implementation on one host. (iv) The
      charge ledger inherits IDEA-20260829-b5a2c8's unreviewed two-term model in
      full. (v) The GOAL-DREG-001 comparison figures were not read by this
      session.
    tradeoff_note: >-
      The only tradeoff this record touches is inside the instrument -- column
      compression buys memory and pays with an index lookup per column access,
      which slows the inner loop by a constant that must be measured before the
      compressed layout is adopted. Parallelisation: the occupancy count
      parallelises perfectly across rows with an OR-reduction of bitmaps, at
      near-linear speedup on 14 cores; the elimination it sizes is pivot-serial
      and its Amdahl ceiling is unchanged by anything here. NO ATTACK TRADEOFF
      EXISTS BECAUSE NO ATTACK IS PROPOSED.

  dominated_by: >-
    CHECKED ROW BY ROW, ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK:
    n/a (no result claimed) -- this record mounts none, so every ECDLP frontier
    row (Pollard rho, multi-target rho, BSGS, van Oorschot-Wiener, the generic
    preprocessing frontier of KN-TECH-005, meet-in-the-middle index calculus, the
