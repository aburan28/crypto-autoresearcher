      STAGE 0b (minutes, BLOCKING SOURCE READ). Open
      experiments/EXP-SBRG-60c55e/driver/run.sage, which THIS SESSION DID NOT
      OPEN, and confirm (i) the actual Boolean variable set, (ii) whether the
      layer is stored densely over the full monomial space or sparsely, and
      (iii) whether a persistent pivot carrier over the full column space exists.
      If the storage is sparse, claim (C)'s 5 GB arithmetic does not apply and
      the guards must be restated in nonzeros before anything else.
      STAGE 0c (minutes, VERIFICATION OBLIGATION). The GOAL-DREG-001 n=15 D=6
      figures quoted in claim (C) were NOT read by this session and are carried
      second-hand from the tasking Coordinator and from IDEA-20260829-cb2a65.
      They are reported to live on the unmerged branch
      goal-dreg-001-batch007-repair-20260828. Re-cite them by run id before they
      are quoted anywhere. No arithmetic in this record depends on them, so a
      discrepancy weakens only the rhetorical comparison, and the failure remains
      an infrastructure stop under AGENTS.md rule 3 regardless.
      STAGE 1 (minutes, the occupancy pre-test, THE ACTUAL EXPERIMENT). Stream
      the layer generator for chain_t3 at (n, D) in {(8,5), (10,5), (12,5),
      (12,4)} and for chain_t4 at {(8,5), (12,4)}, marking a bitmap of occupied
      columns. Allocate no matrix. Report occupancy, the per-row support
      histogram with its mean, median, maximum and upper decile, and apply the
      pre-registered three-way rule. IF OCCUPANCY IS ABOVE THE KILL THRESHOLD,
      STOP HERE: the deliverable is the measured occupancy, filed as an
      obstruction with value, units, run id and scope per the inventor protocol
      section 4 measurement standard.
      STAGE 2 (hours). Instrument the driver to report rows, occupied columns,
      rank, peak RSS, peak virtual size and temporary disk per cell. Fit
      c1, c2, c3 across the admitted cells, FREEZE them, then PREDICT the n=14
      and n=16 peaks and record the predictions before either is attempted.
      STAGE 3 (zero compute). Write the charge ledger -- the frozen XOR-to-D
      conversion, the D-to-total conversion through the two-term optimum, the
      operation convention for the rho arm, and the constant table -- and freeze
      it. Nothing in it is fitted after a measurement.
      STAGE 4 (NOT PART OF THIS PROPOSAL). Running the Phase-A grid is
      RQ-SBRG-f31cb2 work requiring this question's own Coordinator approval.
      This record delivers a feasibility table, a memory formula, one measured
      number and a charge ledger, and stops. Nothing here authorises a run, moves
      a hypothesis, or asserts anything about reusable dependencies.
      ENVELOPE. Stage 0 and Stage 3 are pencil and paper. Stage 1 is bounded by
      one generator row plus a bitmap of at most 510,416 bits, i.e. 64 kB, so its
      peak is dominated by the interpreter. Stage 2 runs only cells the Stage 0
      table admits, which by construction are those under the guards; the largest
      is chain_t3 n=12 D=5 at 101,584 columns and of order 10^4 rows, i.e. a
      dense layer of about 107 MB. THIS RECORD CANNOT REPRODUCE THE GOAL-DREG-001
      MEMORY WALL BECAUSE IT SCHEDULES NO CELL WHOSE PREDICTED PEAK EXCEEDS THE
      CONTRACT, and that is the entire point of it. Peak RSS is predicted below
      1 GiB throughout and is a required reported metric so the prediction can
      fail.
    controls:
      - >-
        CLOSED-FORM COLUMN-COUNT REGRESSION (blocking): driver-reported column
        counts must equal sum_{i<=D} binom(v,i) exactly on at least six cells
        spanning a 100x range.
      - >-
        HAND-CHECKED BOUNDARY CELLS (blocking): D=0 gives 1 column; chain_t3 n=8
        D=2 gives 211.
      - >-
        REPRESENTATION-ORDERING CONTROL: direct_t3, having no auxiliary
        variables, must reach strictly higher degrees within the same guard than
