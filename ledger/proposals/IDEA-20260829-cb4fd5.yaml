    RESOURCE-MODELLING RESEARCH it is fully dominated by the standard
    dense-linear-algebra memory account, from which nothing is claimed as new.
    As a FEASIBILITY TABLE for this grid, nothing exists to dominate it. Not null
    on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent, no mathematical
    result. Instrument delta, stated as numbers. (i) A pre-registered
    admitted-cell table for a grid the contract currently schedules blind, naming
    ten specific cells that exceed the declared 200,000-column guard -- chain_t3
    at (14,5) and (16,5), chain_t4 and balanced_t4 at (10,5), (12,5), (14,5),
