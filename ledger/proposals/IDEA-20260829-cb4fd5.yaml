  falsification_conditions:
    - >-
      Driver-reported column counts differ from the closed form on any
      calibration cell. The variable count is wrong, the feasibility table is
      void, and the correct v is the finding.
    - >-
      A cell on the predicted blocked list runs to completion within the guards,
      or a cell not on the list hits them. The table is wrong in a named
      direction and must be rebuilt against the driver's real variable set.
    - >-
      Stage 0b finds the layer stored sparsely or the carrier absent. Claim (C)'s
      memory arithmetic does not apply and the record must be rewritten around
      the real allocation structure before any guard is proposed.
    - >-
      Measured column occupancy at least 0.50. The column-compression route is
      DEAD, the guard-blocked rungs stay blocked, and the deliverable is the
      measured occupancy filed as an obstruction with value, units, runs and
      scope, plus forward guidance naming what remains -- symmetry reduction of
      the monomial space, degree-graded splitting, a different encoding, or a
      larger contract.
    - >-
      The streaming occupancy count cannot be run without materialising the
      layer. The generator is not streamable and that pipeline defect is the
      finding.
    - >-
      The fitted formula misses a measured peak by more than 25 percent anywhere
      in the calibration range, or underpredicts anywhere at all. The n=14 and
      n=16 feasibility predictions are withdrawn.
    - >-
      The matched rho arm does not reproduce 0.886*sqrt(N). The charge ledger's
      output is not a ratio of comparable quantities and no charged figure may be
      emitted.
    - >-
      Everything holds. RQ-SBRG-f31cb2 acquires a pre-registered admitted-cell
      table, a memory contract that is a formula rather than a number, one
      measured structural number nobody currently has, and the conversion without
      which the word "fully charged" in its own title cannot be honoured.

  confounders:
    - >-
      THE DRIVER WAS NOT READ. Every statement about how memory is allocated is
      an inference from the specification. Stage 0b is blocking for exactly this
      reason, and a session that skipped it would be building on a second-hand
      reading -- the failure mode IDEA-20260829-cb2a65 records for itself and
      which is repeated here rather than assumed away.
    - >-
      DEGREE PROFILE ENTERS THE ROWS BUT NOT THE COLUMNS. The row count
      sum_i binom(v, D-d_i) depends on the descended Boolean degrees d_i, which
      this session did not measure and could not derive without opening the
      Semaev literature. The COLUMN counts, which are the guard-binding
      quantity, are independent of d_i, which is why the blocking conclusions are
      stated on columns and the row statements are conditional.
    - >-
      OCCUPANCY IS CELL-DEPENDENT. Occupancy at (n=12, D=5) need not predict
      (n=16, D=5) or D=6. It is measured per cell, no cell's value is
      extrapolated, and the memory formula's calibrated range is stated with
      every prediction it is used for.
    - >-
      RSS IS NOT THE ONLY MEMORY. Page cache, temporary files and SageMath
      TMPDIR behaviour can dominate and have caused a host ENOSPC event elsewhere
      in this program. Peak RSS, peak virtual size and temporary disk are all
      required metrics.
    - >-
      A FEASIBILITY TABLE CAN DISCOURAGE A CELL THAT WOULD HAVE WORKED. If the
      inferred v is too large the table over-blocks and a real measurement is
      never taken -- which under rule 9 is a deprioritisation that must record
      its evidence and a revisit condition. The revisit condition is stated: any
      cell blocked ONLY by the inferred variable count is re-examined the moment
      Stage 0b or the calibration regression establishes the real v.
    - >-
      IMPLEMENTATION QUALITY CONFOUNDS THE CHARGE LEDGER. A conversion constant
      from XOR counts to group operations is a property of one implementation and
      one machine. It is frozen and reported with every derived figure, and no
      charged figure is quoted without it.

