    twelve-hour Phase-A budget whose own rule says a guard skip is not evidence.
    (ii) A memory contract that is a formula rather than two independent scalars,
    closing a gap in which the current guards jointly admit a 5.0 GB matrix plus
    up to a further 5.0 GB carrier, i.e. the shape of the 2026-08-28
    resource_exhaustion stop, under a nominal 16 GB budget that an 8 GiB task
    contract would not honour. (iii) One measured structural number nobody
    currently has -- the column occupancy of descended chained Semaev Macaulay
    layers -- with a pre-registered three-way rule that makes a clean negative
    the most likely single outcome and a filed obstruction either way.
    (iv) The frozen XOR-to-charged-cost conversion without which no Phase-A
    number can address the phrase "fully charged cost" in this question's own
    title, and with which IDEA-20260829-fa8235's predicted 1.78x and 2.40x
    become end-to-end figures on the day they are measured.

