idea:
  id: IDEA-20260815-cce6e2
  question_id: RQ-DREG-001
  added: '2026-08-15'
  title: >-
    THE DREG LADDER IS THE ONE LANE PATH SELECTED TO EXPAND AND ITS
    INSTRUMENT WAS ADMITTED UNDER A NAMED CONTROL: verify CTRL-B still
    discriminates at the ladder's next rung before the expansion spends
    anything
  class: control

  claim: >-
    DEC-20260810-2f92d8 selects expanding the GOAL-DREG-001 ladder under the
    admitted CTRL-B instrument as the next PATH batch. An instrument
    admitted at one rung is not automatically valid at the next, and
    expansion is exactly when instruments quietly stop discriminating. Re-
    running CTRL-B's discrimination check at the new rung before the
    expansion is cheap and is the difference between an expansion and an
    expansion nobody can interpret.

  mechanism: >-
    Identify CTRL-B's discrimination criterion as admitted. Construct the
    planted-positive and null instances at the ladder's next rung. Run
    CTRL-B and confirm it separates them at the same standard it met when
    admitted.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of DEC-20260810-2f92d8 and GOAL-DREG-001; grep 'CTRL-B',
      'degree of regularity' (44), 'instrument admission'.
    results: >-
      The decision selects the expansion under the admitted instrument; no
      record re-verifies the instrument at the new rung.
    verdict: >-
      ADAPTATION. Re-verifying an instrument before extending its range is
      standard practice; the contribution is doing it for the one lane the
      campaign has actually selected to expand.

  object_first_candidate:
    tracked_object: >-
      CTRL-B'S DISCRIMINATION POWER at the ladder's next rung, rather than
      at the rung where it was admitted.
    lossiness: >-
      An instrument's admission projects its behaviour at one rung onto
      all rungs, which is precisely the projection an expansion tests.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the planted positive and null are constructible at
      the new rung; if they are not, the instrument cannot be verified
      there and the expansion proceeds blind.

  null_object_control: >-
    NULL 1 -- the rung where CTRL-B was admitted, which must reproduce its
    admitted discrimination; failure means the instrument has drifted rather
    than the rung being hard. NULL 2 -- a rung beyond the next one, giving
    the trend in discrimination power rather than a single point.

  discriminated_from:
    - >-
        DEC-20260810-2f92d8, which selects the expansion; this record
        verifies its instrument first and does not contest the selection.
    - >-
        The screen-power audit in this series, which measures instrument
        error rates corpus-wide; this is the same discipline applied to
        one specific instrument at one specific rung.

  assumptions:
    - >-
        CTRL-B's discrimination criterion is stated precisely enough in
        its admission to be re-applied.
    - >-
        Planted positives and nulls are constructible at the next rung;
        construction difficulty at higher rungs is itself the expansion's
        binding constraint.

  predictions:
    - metric: >-
        admitted-rung reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce the admitted discrimination; failure means
        instrument drift, not rung difficulty.
    - metric: >-
        discrimination at the next rung
      direction: different
      minimum_effect: >-
        The measurement; failure means the expansion cannot be
        interpreted and should not proceed as planned.
    - metric: >-
        discrimination trend across rungs
      direction: different
      minimum_effect: >-
        Shows whether the instrument degrades gradually or fails
        sharply, which determines how far the ladder can go at all.

  minimal_test:
    design: >-
      The admitted rung plus the next one, planted positive and null at
      each.
    controls:
      - >-
          Admitted-rung reproduction.
      - >-
          One rung beyond, for the trend.
      - >-
          Criterion quoted verbatim from the admission so it cannot be
          relaxed.
      - >-
          Construction failures at higher rungs reported as the binding
          constraint.
    required_metrics:
      - >-
          Discrimination outcome per rung against the admitted
          criterion.
      - >-
          Trend across rungs.
      - >-
          Construction feasibility per rung.

  falsification_conditions:
    - >-
        The admitted rung does not reproduce. Instrument drift; resolve
        before any expansion.
    - >-
        Discrimination fails at the next rung. The expansion would produce
        uninterpretable results and must be redesigned rather than run.
    - >-
        Discrimination holds and the trend is flat. The expansion is sound
        and this record clears it cheaply.
    - >-
        Planted instances are not constructible at the next rung. The
        instrument cannot be verified there and the expansion proceeds
        without a validated instrument, which must be stated explicitly in
        the batch.

  confounders:
    - >-
        CRITERION RELAXATION: applying a looser standard than the
        admission used would clear the expansion falsely, which is why the
        criterion is quoted verbatim.
    - >-
        CONSTRUCTION DIFFICULTY MISREAD AS INSTRUMENT FAILURE: if planted
        instances are hard to build at the new rung, a failure may be
        about the construction rather than about CTRL-B.

  interpretation_limits:
    - >-
        Verifies an instrument; produces no lane result and does not
        contest the expansion decision.
    - >-
        Scoped to the tested rungs and the admitted criterion.
    - >-
        A pass clears the instrument, not the expansion's scientific
        value.

  heuristic_assumptions:
    - id: HEUR-DREG-CTRLB-1
      statement: >-
        CTRL-B's discrimination power at the rung where it was admitted
        predicts its power at the next rung.
      rigorous_support: >-
        Rigorous ingredient: the instrument's criterion is defined
        identically at every rung, so its definition does not degrade.
        THE GAP: discrimination depends on the separation between
        planted and null distributions, and that separation typically
        shrinks as the ladder ascends -- which is exactly why
        instruments fail on expansion rather than on admission.
      falsification_condition: >-
        Discrimination materially weaker at the next rung than at the
        admitted one.
      validation_plan: >-
        SAMPLE: >= 50 planted and >= 50 null instances per rung, at the
        admitted rung and the next two. COMPARISON: discrimination
        against the admitted standard, per rung. TAIL CHECK: the highest
        rung where construction succeeds, reported separately. TRANSFER:
        stated and unjustified beyond the tested rungs.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is planted and null instance construction
      plus CTRL-B runs at two or three rungs.
    memory_exponent: >-
      Same profile as the lane's existing runs.
    best_known: >-
      The incumbent is CTRL-B as admitted, whose range this record tests
      rather than improving.
    hidden_overhead: >-
      Planted-instance construction at higher rungs may cost more than the
      measurement itself and is the practical limit on how far the check
      reaches.
    tradeoff_note: >-
      Verifying before expanding costs one small batch and can prevent an
      entire expansion whose results nobody could interpret.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a lane result: nothing is produced. As
    instrument verification at the expansion rung: none exists. Not null on
    any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: CTRL-B's discrimination power
    re-measured at the rung the campaign has selected to expand into,
    against the criterion under which it was admitted, plus the trend
    showing how far the ladder can be pushed before the instrument stops
    discriminating.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that CTRL-B's criterion is precisely stated in its admission. 0.7
    that planted instances are constructible at the next rung. 0.35 that
    discrimination degrades materially there, which would stop an expansion
    the campaign has already selected.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-DREG-001
    - GOAL-DREG-001
    - GOAL-PATH-001
    - RQ-ECDLP-002
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
