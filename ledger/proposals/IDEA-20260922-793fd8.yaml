idea:
  id: IDEA-20260922-793fd8
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE ONLY WAY A HYBRID CAN BEAT PURE RHO IS A RESTART-PORTFOLIO EFFECT, NOT
    A BUDGET SPLIT, AND THE TWO NAMED CONDITIONS FOR IT TO WORK ARE BOTH
    CHECKABLE AT TOY SCALE. Running index calculus and rho concurrently and
    stopping at whichever finishes first can only beat pure rho if the IC
    decomposition-attempt cost distribution is genuinely heavy-tailed (Gomes-
    Selman-Crato) AND IC's own completion floor is not already far above rho's
    total budget -- both are named, both are measured, and the preregistered
    expectation, consistent with this program's own prior IC-vs-rho findings,
    is that the floor condition fails and the hybrid loses. Pricing that
    honestly, with a number, is this record's deliverable.
  class: composition

  claim: >-
    (A) THE STRUCTURAL FACT THAT MAKES A PORTFOLIO EVEN WORTH ASKING ABOUT.
    Every decomposition attempt in this lane's index-calculus pipeline is
    solved by a backtracking search engine -- WDSat, CryptoMiniSat, CaDiCaL,
    or Macaulay2's F4 over ZZ/2 (RQ-ICPERF-94c86e's engine roster).
    Backtracking-search runtimes are classically observed to be HEAVY-TAILED
    (Gomes, Selman and Crato, "Heavy-tailed distributions in combinatorial
    search," 1997 and follow-on work; RECALLED, not opened this session): a
    small fraction of seeds/instances take drastically longer than the median,
    often modelled with a power-law-like tail. This program has measured the
    MEAN decomposition-attempt cost C_att repeatedly (consumed as an input by
    IDEA-20260922-77bf31, IDEA-20260922-2e2a58 and IDEA-20260922-b19793 in
    this same lane) but has never measured the SHAPE of that cost
    distribution. Luby, Sinclair and Zuckerman ("Optimal speedup of Las Vegas
    algorithms," 1993; RECALLED, not opened this session) show that a Las
    Vegas algorithm with a heavy-tailed runtime has a restart schedule
    reducing its OWN expected cost, and -- the mechanism this record actually
    prices -- that running such an algorithm CONCURRENTLY with an independent
    alternative that has a well-behaved (light-tailed) completion-time
    distribution, stopping at whichever finishes first, can have positive
    expected value even when the heavy-tailed algorithm's MEAN cost is worse.
    (B) THE COMPOSITION, STATED PRECISELY. Fix one target DLP instance. RACER
    RHO: van Oorschot-Wiener rho with the curve's full symmetry (matched
    baseline, KN-LIT-012), whose completion-time distribution is modelled as
    approximately geometric/exponential by H-BINSTD-XOVER-1
    (IDEA-20260922-2e2a58, this lane, this day -- a rigorous consequence of
    the memoryless random-walk model, consumed here and not re-derived).
    RACER IC: the full Gaudry/Diem-style pipeline (relation collection to
    R_need relations over the standard-optimum factor base, linear algebra,
    descent), RESTARTED from a fresh seed on Luby's universal schedule
    (1,1,2,1,1,2,4,1,1,2,1,1,2,4,8,...) whenever a restart step's budget is
    exhausted without a full solve. PORTFOLIO(beta): total operation budget T,
    split so Racer IC's restart attempts and Racer rho's independent walks run
    concurrently, stopping the whole portfolio at the FIRST racer to produce a
    certificate-verified logarithm (per docs/claims-and-verification.md's
    claim-tier discipline -- a racer that merely "looks close" does not stop
    the portfolio).
    (C) THE HONEST PRICE, TWO NAMED CONDITIONS. Portfolio value
    V(beta) = E[T_rho_alone] - E[min(T_IC_portfolio(beta), T_rho_portfolio(beta))].
    PREREGISTERED CLAIM: V(beta) <= 0 for every beta > 0 at every toy cell
    tested UNLESS BOTH (i) IC's per-attempt/restart cost distribution is
    measurably heavy-tailed (coefficient of variation CV > 1, or a Hill-
    estimator tail index alpha_tail < 2) AND (ii) IC's own median full-
    pipeline completion cost is within roughly two orders of magnitude of
    rho's median -- because a portfolio wins only by finishing EARLY on a
    lucky tail draw, and if IC's FLOOR cost (dominated by the linear-algebra
    phase's B'^2-scale term, unaffected by how lucky any single decomposition
    attempt gets) already exceeds rho's entire budget, no tail luck reaches
    it. THESE TWO CONDITIONS ARE THE DISCRIMINATING PAIR: OUTCOME H_HELPS --
    both hold, an interior beta* > 0 has measurably positive value, a genuine
    and previously unexamined finding for this lane. OUTCOME H_DOMINATED --
    either condition fails (thin tail, or a floor too high for any tail draw
    to matter), the optimal split is the corner solution beta* = 0, and pure
    rho dominates in expectation -- matching every other IC-vs-rho comparison
    this program has run to date (RQ-ICEX-001's inconclusive-to-negative
    history; IDEA-20260815-47638d's optimistic-inputs go/no-go), now with a
    NUMBER and a NAMED MECHANISM for why, rather than left unexamined.
    (D) SCOPE-DECLARED, NOT TESTED HERE. The lane's alternative framing --
    using a PARTIAL factor base as the jump set for rho's own step function,
    replacing rho's usual small random jump table with factor-base adders to
    try to shorten collision-search walks -- is a distinct mechanism from (A)-
    (C) and is explicitly scoped OUT of this record. It would need
    IDEA-20260906-fc429b's Cayley-graph machinery (Cay(Z/N, factor-base
    generators)) repurposed from that record's RELATION-COLLECTION-phase
    decomposition-hit question to a COLLISION-SEARCH-phase mixing-time
    question -- a genuinely different observable (collision time, not a
    decomposability indicator) for a different phase. Attempting both in one
    record would dilute the proof burden on (A)-(C), which is this record's
    primary, better-grounded claim; (D) is named as forward guidance in
    interpretation_limits, not worked here.

  mechanism: >-
    OBJECT FRAME. Representation: R1 (RQ-ECDLP-623a32) x-coordinate points,
    UNCHANGED -- both racers use exactly the point representation their own
    owning records already use (rho: matched baseline per KN-LIT-012 and
    IDEA-20260922-2e2a58; IC: the Gaudry/Diem factor-base decomposition per
    RQ-RELN-001 and RQ-ICPERF-94c86e). This record introduces no new point
    representation and changes the charged cost of neither racer's own attack
    stage; it changes only the SCHEDULING layer above both.
    TRACKED OBJECT: the PAIR of completion-time random variables
    (T_rho, T_IC) under a fixed resource allocation, plus the scheduling rule
    (interleave, restart) applied to them -- the same style of object as
    IDEA-20260922-2e2a58's resource triple, one level up: that record tracks
    (critical-path length, peak words, max concurrency) for ONE algorithm's
    phase; this record tracks the JOINT distribution of two algorithms' total
    completion times under a stopping rule.
    OPERATION SET Sigma, NAMED AND NOT TRANSLATION. Sigma = {restart(racer) --
    abandon a racer's current attempt and begin a fresh one; interleave(beta)
    -- reallocate the fixed budget/processor share between racers;
    stop_at_first_certificate -- halt both racers when either produces a
    verified solve}. These are genuine scheduling operations available to an
    implementer, and Sigma is explicitly NOT the translation action on the
    group -- it acts on a SCHEDULE, not on a point, so the closure of
    IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C does not apply and is
    not being evaded, exactly as IDEA-20260922-2e2a58 already notes for its
    own schedule object of the same lane.
    TRICHOTOMY. CLASS III, COORDINATE-DEPENDENT, for the same reason
    IDEA-20260922-2e2a58's resource triple is: the tracked pair of
    distributions is a property of the IMPLEMENTATION and its scheduling
    policy, not of the group element or the curve, and the record says so
    rather than overclaiming a group-theoretic object.
    LOSSY-PROJECTION TEST, AGAINST THIS Sigma. What is discarded: every
    arithmetic detail of both racers -- field representation, solver engine,
    monomial order, curve equation, everything except two numbers (or two
    empirical distributions) per instance. LOSSY, NOT INJECTIVE: two
    completely different concrete implementations of "an algorithm with this
    completion-time distribution" are treated identically by any scheduling
    rule, and many distinct underlying algorithms could share a completion-
    time distribution -- both required properties of a genuine lossy
    projection. COMPATIBLE WITH Sigma, THE LOAD-BEARING CLAIM: Luby-Sinclair-
    Zuckerman's own theorem is precisely the statement that the OPTIMAL
    scheduling policy (restart schedule, and by extension the optimal
    portfolio-stopping value) is a function of the completion-time
    DISTRIBUTION ALONE, not of anything the projection discards -- so the
    discard is licensed by the exact theorem this record leans on, not merely
    asserted. A projection that lost nothing (e.g. tracking every solver
    internal state) would be a change of coordinates and would not license
    this record's use of the classical restart theorem at all.
    THE ONE OPEN NUMBER, PRICED. For a Class III schedule object, the priced
    quantity is the cost of REALISING the transformation -- here, the two
    named conditions of claim (C): the measured tail heaviness (CV or
    alpha_tail) of Racer IC's completion-cost distribution, and the measured
    ratio of IC's median floor cost to rho's median cost. Both are declared as
    measured quantities with explicit predictions and falsification bands
    below, never assumed.
    OFF-LIMITS COMPONENTS DECLARED. F1 (walk-collision, rho) and F2 (factor-
    base decomposition, IC) are BOTH used as COMPONENTS -- the two racers
    being scheduled -- and neither is the lens; the lens is the portfolio-
    scheduling object above, exactly the same declared structure
    IDEA-20260922-2e2a58 uses for its own crossover-region record in this
    lane. No new factor base is introduced (Racer IC reuses whichever base
    RQ-RELN-001/RQ-QSP-f9bbdb defines), so KN-OPEN-020 is not engaged. F7
    (preprocessing) is not used on either side; no precomputed table is
    charged.
    WHAT THIS RECORD DOES NOT DO. It does not compute C_att, p, R_need, B, the
    solving degree, or the wall-clock floor of the linear-algebra phase --
    those are inputs from RQ-SDEG-001, RQ-RELN-001, RQ-ICPERF-94c86e and
    IDEA-20260922-2e2a58, consumed and cited, not re-derived. It does not
    reopen the exponent estimator (RQ-ICEX-001's business). It does not build
    or measure a partial-factor-base rho-walk variant (limb D, explicitly
    scoped out).

