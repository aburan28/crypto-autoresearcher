  frontier_check:
    status: pending
    note: >-
      Gomes-Selman-Crato heavy-tailed search and Luby-Sinclair-Zuckerman
      optimal-restart theory are both well-established, well-known results in
      the SAT/CP and randomized-algorithms literatures respectively; this
      record's contribution, if any survives a broader literature check, is
      narrowly the APPLICATION of a restart-portfolio framing to an
      index-calculus-versus-rho comparison on this program's specific
      standardized binary population, not the underlying theory, which was
      not searched externally this session. What was searched in this corpus
      and not found: any prior measurement of decomposition-attempt cost
      DISTRIBUTION shape (as opposed to mean), any restart-portfolio framing
      of the IC-vs-rho comparison, and any citation of Gomes-Selman-Crato or
      Luby-Sinclair-Zuckerman anywhere in this program's ledger or knowledge
      corpus.
  recommended_priority: low
  priority_rationale: >-
    Best case is explicitly not an exponent, and the record's own primary
    preregistered expectation is a clean negative (V(beta*) <= 0 everywhere).
    Per the brief's own instruction that "the usual outcome is that it loses
    to pure rho, and establishing THAT with a number is a legitimate result,"
    this is exactly that kind of result -- valuable for closing a live
    question with a mechanism rather than leaving it unexamined, but not a
    building block for any exponent-moving line elsewhere in the program, and
    the record says so rather than inflating its own priority. It is
    RECOMMENDED LOW rather than MEDIUM because: its implementation cost
    (medium) is not shared with any other filed record's infrastructure plans
    the way IDEA-20260922-b19793's LA engine reuse is; its primary scientific
    payload -- the tail-shape measurement (H-BINSTD-COMP-1) -- is genuinely
    interesting but is BYCATCH of this record's design rather than its stated
    goal, and could be proposed as its own, cheaper, standalone measurement
    record without the portfolio-simulation machinery on top; and the
    preregistered expected answer, if it holds, closes a question nobody in
    this program had previously asked rather than sharpening one already
    central to the lane's decision target. The one circumstance that would
    change this ranking -- any toy cell with a bootstrap-confirmed positive
    V(beta*) -- is named explicitly as the single most valuable possible
    outcome and would warrant an immediate re-ranking by the Coordinator.
  first_deliverable: >-
    Stage 0's symbolic verification (V(0)=0, the CV->0 collapse) plus a
    standalone, cheaper first cut: measure CV and alpha_tail for ONE engine
