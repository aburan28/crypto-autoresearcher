    ONE toy cell, without yet building the full portfolio-simulation layer --
    answering H-BINSTD-COMP-1's question alone first, since it is this
    record's cheapest, most independently valuable, and least assumption-
    laden component, before committing to the fuller Stage 1-4 design.
