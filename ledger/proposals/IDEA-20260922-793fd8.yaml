  proof_search_map:
    bottleneck: >-
      The exact quantity whose value flips the verdict is whether BOTH named
      conditions in claim (C) hold simultaneously at a given cell: tail
      heaviness (CV > 1 or alpha_tail < 2) and floor comparability (IC's
      median within about two orders of magnitude of rho's median). Neither
      alone is sufficient -- a heavy tail on an algorithm whose floor already
      exceeds the budget helps nothing, and a comparable floor with a thin
      tail gives no portfolio advantage over simply running the cheaper of
      the two.
    baseline_embedding:
      parameter_slice: >-
        beta = 0 (no IC at all) collapses PORTFOLIO(beta) to pure rho exactly,
        V(0) = 0 by construction -- the incumbent strategy is the exact
        beta = 0 slice of this record's own formula, not a strawman built to
        lose. CV -> 0 (IC deterministic at its measured mean, which every
        prior ICEX/ICPERF finding places well above rho's) collapses V(beta)
        to strictly negative for beta > 0, reproducing the corpus's existing
        negative consensus exactly.
      reproduction_check: >-
        Symbolic, zero compute: confirm V(0) = 0 and the CV -> 0 negative
        limit algebraically before any measurement is trusted. Numeric, on
        toy cells: Racer rho's simulated completion-time distribution, drawn
        from the geometric model with the SAME parameters IDEA-20260922-2e2a58's
        own Stage 1 rho harness measures, must reproduce that record's own
        measured relative-overhead figures within its stated tolerance before
        this record's simulation is trusted to layer IC on top of it.
    observation_collision:
      observable: >-
        "A rho/IC hybrid beats pure rho on this curve," as a scalar verdict.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. The same scalar verdict "hybrid helps" could be
        produced by: (i) a genuine restart-portfolio effect (heavy tail, low
        floor) -- the only state this record's mechanism actually predicts
        can produce a real win; (ii) a measurement artifact from excluding
        infra failures non-uniformly (silently truncating IC's tail and
        understating its true cost, per IDEA-20260915-3476de); (iii) a
        mis-specified rho model (H-BINSTD-XOVER-1 not holding on the tested
        cell, understating rho's true cost); (iv) simple simulation noise at
        small sample size. The identifying tuple this record proposes every
        reported V(beta) carry is (CV, alpha_tail, floor ratio, infra-
        exclusion rate, bootstrap confidence interval on V), so a positive
        headline number is never reported without the means to tell which of
        the four produced it.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the scalar "hybrid helps / does not" verdict fixed and vary the
          hidden state, exhibiting the four preimages above.
        predicted_gain: >-
          Converts a possible positive V(beta) from a headline number into an
          attributed one, distinguishing a genuine mechanism from an
          artifact. NO ATTACK EXPONENT IS MOVED.
      - transform: specialization_pack
        proposed_object: >-
          The portfolio value V(beta) specialised across a synthetic sweep of
          (CV, floor ratio) pairs IMPOSED on a simulated (not measured) IC
          distribution, isolating which region of that two-parameter space
          the record's preregistered null actually occupies before comparing
          it to the real, measured toy-cell values.
        predicted_gain: >-
          Separates "does the mechanism work when conditions are favourable"
          (answerable by simulation alone, zero risk of measurement artifact)
          from "are conditions favourable here" (the real, riskier
          measurement), the same discriminating structure
          IDEA-20260922-b19793 uses for its own conditional speedup claim.
    quantifier_order: >-
      CLAIMED, DERIVED. FOR beta = 0, V(beta) = 0 exactly, by construction.
      CLAIMED, CONDITIONAL ON THE RECALLED HEAVY-TAIL PHENOMENON AND MEASURED
      IN THE TEST. FOR toy cells where CV > 1 AND the floor ratio is within
      two orders of magnitude, EXISTS beta* > 0 with V(beta*) > 0 (not
      proved analytically here -- estimated by bootstrap simulation from
      measured empirical distributions). PREREGISTERED AND FALSIFIABLE. FOR
      ALL tested toy cells, the primary EXPECTED finding is V(beta*) <= 0
      (the floor-ratio condition fails, consistent with this program's prior
      IC-vs-rho history). NOT CLAIMED: any statement about deployed curves.
      NOT CLAIMED: that Luby's universal restart schedule is exactly optimal
      for IC's true (unknown-in-closed-form) distribution -- only that its
      value is estimated directly from the empirical distribution, with the
      universal-schedule bound reported as a secondary, conservative check.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For each tested toy cell, and for the declared range of solver
        engines and restart schedules, the measured tail statistics (CV,
        alpha_tail), the measured floor ratio, and the bootstrap-estimated
        portfolio value V(beta*) as a fraction of pure rho's expected cost."
        It can NEVER certify that this transfers to any deployed curve, that
        the tail shape is stable across engines (it is reported PER ENGINE,
        never pooled, per RQ-ICPERF-94c86e's own discipline), or that a
        real-hardware implementation reaches the idealised V(beta) (the
        confounders block explicitly flags concurrent-execution overhead as
        unmodelled).
      nearby_object_control: >-
        THE NULL DISTRIBUTION IS THE ONE THAT MATTERS. Simulate PORTFOLIO
        value using a SYNTHETIC IC completion-time distribution drawn from an
        EXPONENTIAL (thin-tailed, matching Racer rho's own model class) with
        the SAME MEAN as the real measured IC data -- if this null-shape
        simulation ALSO produces a positive V(beta*), the positive result is
        an artifact of the mean/floor ratio alone and NOT of tail heaviness,
        and the record's attribution to the Gomes-Selman-Crato mechanism must
        be withdrawn; if the null-shape simulation gives V(beta*) <= 0 while
        the REAL measured distribution gives V(beta*) > 0, the tail shape is
        doing the work, exactly as claimed. SECOND CONTROL: Racer IC alone
        (no rho, self-restart only, Luby's original single-algorithm setting)
        -- its OWN restart-value is measured independently of any portfolio
        with rho, isolating "does restarting help IC at all" from "does
        racing IC against rho help," two logically separate questions this
        record's design keeps from being conflated.
    proof_obligations:
      - claim: >-
          V(0) = 0 and the CV -> 0 negative limit both verified symbolically
          before any simulation is trusted.
        responsibility: baseline
      - claim: >-
          The simulated Racer rho distribution reproduces IDEA-20260922-2e2a58's
          own measured relative-overhead figures within that record's stated
          tolerance, on the SAME toy cells.
        responsibility: baseline
      - claim: >-
          The exponential-null-shape control, run at the SAME measured mean as
          the real IC data, is computed and compared to the real-shape result
          for every reported positive V(beta*).
        responsibility: correctness
      - claim: >-
          Infra-failure exclusion rate from the tail-fit sample is reported
          for every cell and every engine, never silently absorbed into a
          "finished" sample.
        responsibility: memory
      - claim: >-
          Every result is reported per solver engine, never pooled across
          WDSat/CryptoMiniSat/CaDiCaL/Macaulay2.
        responsibility: scope

  predictions:
    - metric: >-
        Racer IC's decomposition-attempt/restart-to-completion cost
        coefficient of variation (CV), measured per solver engine on toy
        Koblitz cells n in {17,19,23,29,31,37,41}
      direction: different
      minimum_effect: >-
        Exploratory, no directional preregistration on CV itself; CV > 1 is
        the threshold that puts condition (i) of claim (C) in play, reported
        exactly regardless of outcome.
    - metric: >-
        Hill-estimator tail index alpha_tail for Racer IC's completion-cost
        distribution, per engine, with bootstrap confidence interval
      direction: lower
      minimum_effect: >-
        alpha_tail < 2 (infinite-variance regime) is a striking, independently
        valuable finding regardless of the portfolio verdict, since it would
        be the first measured statement in this corpus about the SHAPE
        (not just the mean) of a decomposition-attempt cost distribution.
    - metric: >-
        floor ratio -- Racer IC's median full-pipeline completion cost
        divided by Racer rho's median completion cost, per toy cell
      direction: lower
      minimum_effect: >-
        PREREGISTERED PRIMARY PREDICTION: floor ratio exceeds 100 (two orders
        of magnitude) at every tested toy cell, consistent with this
        program's prior IC-vs-rho findings, which would mean condition (ii) of
        claim (C) fails everywhere and closes the portfolio-value question
        cleanly regardless of the tail-shape result. A floor ratio below 100
        at ANY toy cell is the single most valuable outcome available in this
        record, since it puts condition (ii) genuinely in play.
    - metric: >-
        portfolio value V(beta*) as a fraction of pure rho's expected cost,
        bootstrap-estimated per toy cell and per engine, at the optimal beta*
      direction: higher
      minimum_effect: >-
        PREREGISTERED PRIMARY NULL: V(beta*) <= 0 at every tested toy cell.
        ANY toy cell with a bootstrap-confidence-interval lower bound above
        zero (i.e. V(beta*) > 0 with the interval excluding zero) falsifies
        the null and is this record's single most valuable possible finding,
        warranting a dedicated follow-on experiment design this record does
        not itself authorise.
    - metric: >-
        exponential-null-shape control's V(beta*), computed at the same
        measured mean as the real IC data
      direction: different
      minimum_effect: >-
        FORCED COMPARISON. If the real-shape V(beta*) is positive, the null-
        shape control's V(beta*) must be measurably lower (closer to or below
        zero) for the positive result to be attributed to tail heaviness
        rather than to the mean/floor ratio alone; if the two are
        indistinguishable, the attribution to Gomes-Selman-Crato is withdrawn.
    - metric: >-
        infra-failure exclusion rate from the completion-cost sample, per
        engine and per toy cell
      direction: different
      minimum_effect: >-
        No directional prediction; reported for every cell regardless of
        value, since even a rate of zero is informative (no infra exclusions
        needed at this toy scale) and a nonzero rate quantifies the risk this
        record's confounders block names.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate). Verify V(0) = 0 and the CV -> 0
      collapse symbolically; confirm the formula's structure matches claim
      (C) before any simulation is written.
      STAGE 1 (reuses existing/planned instrumentation, low compute). On toy
      binary Koblitz cells n in {17,19,23,29,31,37,41}, collect AT LEAST 100
      independent restart-to-completion samples of the FULL Racer IC pipeline
      (per engine in RQ-ICPERF-94c86e's roster, reusing that question's
      boundary-table harness rather than rebuilding it) and of Racer rho
      (reusing IDEA-20260922-2e2a58's planned matched-rho harness), on the
      SAME frozen paired instance set (IDEA-20260815-95fefb discipline),
      recording FULL empirical completion-cost distributions in CHARGED
      OPERATIONS alongside wall clock (IDEA-20260815-66496a). Infra failures
      (crashes, RLIMIT_AS aborts per IDEA-20260915-3476de) are excluded from
      the distribution per AGENTS.md rule 3 and their exclusion rate is
      logged separately, never silently folded into "did not finish quickly."
      STAGE 2 (low compute). Fit CV and Hill-estimator alpha_tail to each
      engine's IC completion-cost sample, with bootstrap confidence intervals;
      QQ-plot and Kolmogorov-Smirnov test against an exponential null at the
      same mean. Compute Racer IC's OWN Luby-optimal self-restart value
      (independent of any portfolio with rho, per the second nearby-object
      control) as a well-defined byproduct. Simulate PORTFOLIO(beta) via
      bootstrap resampling from the empirical (T_rho, T_IC) distributions
      across a beta grid, and separately from the exponential-null-shape
      control at the same mean, computing V(beta) for both.
      STAGE 3 (zero compute). Report V*(beta*) = max_beta V(beta) per toy
      cell and per engine, alongside the floor ratio, CV, alpha_tail, the
      null-shape control's V(beta*), and the infra-exclusion rate --
      the full identifying tuple from proof_search_map.observation_collision,
      never a bare number.
      STAGE 4 (zero compute). State explicitly, per cell, whether the primary
      preregistered null (floor ratio > 100, V(beta*) <= 0) holds, and if not,
      name which condition failed. No extrapolation to deployed rows is
      offered; the qualitative transfer question (does IC's tail shape at toy
      B sizes resemble its shape at deployed B sizes, where memory-pressure
      regimes may differ per IDEA-20260915-3476de) is flagged as the weakest
      link and left explicitly open, not answered.
      MEMORY DISCIPLINE. Largest objects are the same toy relation matrices
      and solver instances RQ-ICPERF-94c86e and IDEA-20260922-2e2a58 already
      build; this record adds only a completion-time LOGGER and a bootstrap
      simulation layer, both negligible in memory (a few hundred scalar
      samples per cell per engine).
    controls:
      - >-
        EXPONENTIAL-NULL-SHAPE CONTROL (blocking): same measured mean as real
        IC data, thin-tailed shape, run through the identical V(beta)
        simulation. No tail-attribution claim without it.
      - >-
        SELF-RESTART CONTROL (informative, not blocking): Racer IC's own
        Luby-optimal restart value with no rho involved at all, isolating
        "restarting helps IC" from "racing against rho helps."
      - >-
        PER-ENGINE, NEVER POOLED (blocking): every tail statistic and every
        V(beta*) reported separately for WDSat, CryptoMiniSat, CaDiCaL and
        Macaulay2 F4, per RQ-ICPERF-94c86e's own SAT/UNSAT-separation
        discipline extended to this record's engine dimension.
      - >-
        INFRA-EXCLUSION LOGGING (blocking): every excluded crash/timeout
        counted and reported per cell/engine, never silently dropped from
        the sample without disclosure.
      - >-
        PAIRED INSTANCE SET AND OPERATION-COUNT DISCIPLINE (IDEA-20260815-
        95fefb, IDEA-20260815-66496a): both racers measured on the same
        frozen instance set, operations alongside wall clock.
      - >-
        RHO-MODEL REPRODUCTION CHECK: Racer rho's simulated distribution must
        reproduce IDEA-20260922-2e2a58's own measured overhead figures within
        that record's stated tolerance before being layered into this
        record's portfolio simulation.
    required_metrics:
      - CV_and_alpha_tail_per_engine_per_cell_with_bootstrap_CI
      - floor_ratio_median_IC_over_median_rho_per_cell
      - V_beta_star_per_cell_per_engine_real_and_null_shape
      - self_restart_value_IC_alone
      - infra_exclusion_rate_per_cell_per_engine
      - rho_model_reproduction_check_against_2e2a58

  falsification_conditions:
    - >-
      Any toy cell/engine has bootstrap-CI-confirmed V(beta*) > 0. Falsifies
      the primary preregistered null; the most valuable single outcome
      available here, and NOT authorised by this record to be extrapolated
      further -- it would name a concrete follow-on experiment design, not be
      reported as a result about any deployed curve.
    - >-
      The floor ratio is below 100 at any toy cell. Condition (ii) of claim
      (C) is genuinely in play there, sharpening exactly which cells are
      worth the tail-shape measurement rather than which are not.
    - >-
      The exponential-null-shape control produces a V(beta*) statistically
      indistinguishable from the real-shape result wherever a positive V is
      observed. The Gomes-Selman-Crato tail-heaviness attribution is
      withdrawn; whatever positive value exists is a mean/floor-ratio effect,
      not a restart-portfolio effect, and the record is corrected accordingly.
    - >-
      The infra-exclusion rate exceeds roughly 10 percent of attempted samples
      at any cell/engine. The tail-fit sample is compromised by infrastructure
      rather than algorithmic behaviour (per AGENTS.md rule 3); that cell's
      tail statistics are reported as indeterminate rather than interpreted,
      and the infrastructure issue is reported as its own finding, distinct
      from this record's algorithmic question.
    - >-
      Racer rho's simulated distribution fails to reproduce
      IDEA-20260922-2e2a58's own measured figures within that record's
      tolerance. This record's simulation is not describing the same rho
      that record measured, and V(beta) is withdrawn until the reproduction
      check passes.
    - >-
      Everything holds as preregistered (floor ratio > 100 everywhere,
      V(beta*) <= 0 everywhere). Then the lane gains, for the first time, a
      NUMBER and a NAMED MECHANISM for why hybridising IC with rho does not
      help at these standardized curves' toy-scale analogues -- closing the
      "should we try hybridising" question with a measured floor-dominance
      explanation rather than leaving it unexamined, which is the legitimate
      and expected honest result this record exists to establish.

  confounders:
    - >-
      CONCURRENT-EXECUTION OVERHEAD IS NOT MODELLED. The idealised V(beta)
      formula assumes both racers run on cleanly separated resources; real
      shared-machine contention (memory bandwidth, cache pressure between a
      SAT solver and a rho kernel running simultaneously) could make a real
      deployment WORSE than the simulated value. Every reported V(beta*) is
      therefore an UPPER BOUND on achievable value, stated explicitly, never
      presented as an achievable number.
    - >-
      SMALL-SAMPLE TAIL-INDEX ESTIMATION IS UNSTABLE. The Hill estimator is
      known to be biased at small sample sizes; every alpha_tail is reported
      with a bootstrap confidence interval and flagged as indicative-only at
      these toy sample sizes (>=100 per cell/engine, still small by heavy-
      tail-estimation standards).
    - >-
      INFRA EXCLUSIONS COULD BIAS THE TAIL DOWNWARD IF NOT LOGGED. A crashed
      long-running attempt is exactly the kind of sample a naive "only count
      finished runs" protocol would drop, silently truncating the measured
      tail and understating CV/inflating apparent thin-tailedness -- this is
      why the exclusion rate is a required, reported metric, not an
      afterthought, following IDEA-20260915-3476de's documented precedent for
      this exact engine roster.
    - >-
      ENGINE HETEROGENEITY. WDSat, CryptoMiniSat, CaDiCaL and Macaulay2 F4
      have different search architectures and plausibly different tail
      behaviour; pooling across them would be a composition artifact exactly
      as RQ-ICPERF-94c86e already forbids for SAT/UNSAT pooling, and this
      record extends that same discipline to engine pooling.
    - >-
      QUANTIFYING BETA* BY SIMULATION, NOT BY A CLOSED-FORM SOLUTION.
      Luby-Sinclair-Zuckerman's theorem gives a closed-form OPTIMAL schedule
      for a KNOWN distribution and a competitive UNIVERSAL schedule for an
      unknown one; this record's V(beta*) is estimated by bootstrap
      simulation from the EMPIRICAL distribution directly (the primary
      estimate) with the universal-schedule bound reported only as a
      conservative secondary check, and the two are never conflated.
    - >-
      MODEL-RELATIVITY. Every prediction and every falsification threshold is
      correct within this record's declared cost-accounting convention
      (charged operations, per IDEA-20260815-66496a) and its declared toy
      scale; nothing here is a statement about wall-clock behaviour on any
      specific real machine, let alone a deployed curve.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED AND NO EXPONENT IS MOVED. The deliverable is a
      measured tail shape, a measured floor ratio, and a priced, bootstrap-
      estimated portfolio value against a preregistered null, whose expected
      and legitimate outcome is a clean negative with a named mechanism.
    - >-
      A positive V(beta*), if observed, authorises NOTHING beyond "this toy
      cell's restart-portfolio value warrants a dedicated follow-on
      experiment design" -- it is explicitly not a claim about any deployed
      curve, and this record does not propose or approve that follow-on
      experiment (outside this session's authority per AGENTS.md rule 1).
    - >-
      The toy measurement is at n <= 41; whether IC's tail SHAPE (not just its
      mean) persists at deployed B sizes is the single weakest, most
      explicitly disclosed extrapolation gap in this record, since solver
      behaviour under the memory-pressure regimes deployed-scale instances
      would create is qualitatively different territory (per
      IDEA-20260915-3476de's own documented infra failure at toy-adjacent
      scale already).
    - >-
      Limb (D) (partial factor base as rho's own jump-set generator) is
      explicitly NOT tested here and is distinguished from
      IDEA-20260906-fc429b's relation-collection-phase Cayley-walk
      machinery; it is named as forward guidance, not attempted or half-
      attempted in this record.
    - >-
      FORWARD GUIDANCE. Left open: whether limb (D)'s rho-jump-set variant, if
      built as a genuine successor to fc429b's instrument, changes this
      record's floor-ratio condition (a factor-base-assisted rho walk could
      in principle lower rho's OWN median, tightening rather than loosening
      the floor-ratio condition against a hybrid, an interesting and
      unexamined interaction); whether IC's self-restart value alone (the
      second nearby-object control) is worth feeding back to
      RQ-ICPERF-94c86e's boundary table as a candidate solver-side
      improvement independent of any hybrid with rho; and a genuine
      concurrent-hardware measurement of the overhead this record's
      idealised V(beta) explicitly does not model.

  heuristic_assumptions:
    - id: H-BINSTD-COMP-1
      statement: >-
        Racer IC's per-attempt/restart completion-cost distribution, for at
        least one of the engines in RQ-ICPERF-94c86e's roster, is measurably
        heavy-tailed (CV > 1 or alpha_tail < 2) on toy binary decomposition
        instances.
      rigorous_support: >-
        RIGOROUS INGREDIENT: none specific to THIS program's engines and
        instances -- this is precisely the thing being tested, not assumed.
        THE GAP AND ITS SOURCE: the Gomes-Selman-Crato phenomenon is
        well-documented for GENERIC backtracking search on combinatorial
        problems broadly, but whether it holds for THESE specific structured
        decomposition instances (Semaev summation polynomials with Weil
        descent, a highly structured algebraic system, not a generic random
        SAT instance) is untested anywhere in this corpus and is not a safe
        transfer from the general phenomenon. The classical distribution
        theorem this imitates is the empirical power-law/Pareto-tail
        characterisation of backtracking-search cost in the SAT/CP
        literature, RECALLED and explicitly not verified against a primary
        source this session.
      validation_plan: >-
        SAMPLE. >=100 independent restart-to-completion samples per engine
        per toy cell, n in {17,19,23,29,31,37,41}. COMPARISON DISTRIBUTION.
        Empirical CV and Hill-estimator alpha_tail against the exponential
        (thin-tailed) null at the same mean, via QQ-plot and Kolmogorov-
        Smirnov test. TAIL CHECKS. The maximum observed sample as a multiple
        of the median (a simple, robust heavy-tail signature independent of
        the Hill estimator's small-sample bias), reported alongside the
        formal tail-index estimate. TRANSFER. None claimed beyond n <= 41;
        explicitly the weakest link, per interpretation_limits.
    - id: H-BINSTD-COMP-2
      statement: >-
        Racer rho's completion time is adequately modelled as geometric/
        exponential, per H-BINSTD-XOVER-1 (IDEA-20260922-2e2a58, this lane).
      rigorous_support: >-
        Consumed, not re-derived: this record cites IDEA-20260922-2e2a58's own
        rigorous_support and validation_plan for this exact heuristic rather
        than duplicating them, and instead adds a REPRODUCTION CHECK (this
        record's Stage 1) confirming the simulated rho distribution matches
        that record's own measured figures on the same toy cells before this
        record's portfolio simulation trusts it. The classical distribution
        theorem is the same one 2e2a58 already names: the geometric/
        exponential inter-arrival law for a memoryless random-walk hitting
        time.
      validation_plan: >-
        SAMPLE and COMPARISON: identical to IDEA-20260922-2e2a58's own Stage 1
        design, reused rather than re-run independently; this record's ADDED
        check is the reproduction-check proof obligation above, confirming
        no drift between that record's measurement and this record's
        simulation input. TRANSFER: inherited from 2e2a58, not re-derived.
    - id: H-BINSTD-COMP-3
      statement: >-
        The empirically-estimated portfolio value V(beta*), computed by
        bootstrap resampling directly from the measured (T_rho, T_IC)
        distributions, is a reasonable ESTIMATE of the true achievable
        portfolio value, even though Luby-Sinclair-Zuckerman's closed-form
        optimality guarantee applies only to a KNOWN distribution and its
        universal-schedule bound is merely competitive (not exactly optimal)
        for an unknown one.
      rigorous_support: >-
        RIGOROUS INGREDIENT: bootstrap resampling from an empirical
        distribution converges to the true distribution's functional
        (including expected-minimum statistics) as sample size grows, a
        standard nonparametric-statistics fact. THE GAP: at the toy sample
        sizes here (>=100), bootstrap variance for a MINIMUM-of-two-
        distributions statistic (order-statistic-like, sensitive to tail
        behaviour) can be substantial, and the universal-schedule bound's
        O(log) competitive-ratio gap from Luby-Sinclair-Zuckerman is not
        itself estimated here, only reported as a secondary, conservative
        cross-check. The classical statement this imitates is the standard
        bootstrap-consistency theorem for smooth functionals, which a
        MINIMUM statistic is only boundary-case smooth for (sensitive to the
        tail, exactly where estimation is hardest) -- named as a genuine,
        disclosed weak point rather than glossed over.
      validation_plan: >-
        SAMPLE. The same >=100-per-cell-per-engine samples as H-BINSTD-COMP-1,
        resampled 10^4 times per bootstrap estimate. COMPARISON. Bootstrap
        confidence interval width for V(beta*) reported alongside every point
        estimate; any cell where the interval is wider than the point
        estimate itself is reported as indeterminate rather than interpreted.
        TAIL CHECK. Sensitivity of V(beta*) to the single largest observed
        IC sample (jackknife leave-one-out), which directly probes whether
        the bootstrap estimate is dominated by one extreme draw rather than a
        genuine distributional signal. TRANSFER. None; explicitly a toy-scale
        estimation-quality check, not a transfer claim.
  heuristic_note: >-
    H-BINSTD-COMP-1 is the record's highest-stakes and most genuinely
    untested heuristic: unlike H-BINSTD-COMP-2 (inherited, with a cheap
    reproduction check, from an already-argued sibling record), whether
    Semaev-decomposition solving is heavy-tailed AT ALL has never been
    measured in this corpus and could go either way. The preregistered
    primary prediction (floor ratio > 100, V(beta*) <= 0 everywhere) is
    stated as the EXPECTED outcome consistent with this program's history,
    precisely so that neither a confirming negative nor a surprising positive
    reads as chosen after the fact. H-BINSTD-COMP-3's estimation-quality
    caveat is disclosed because a MINIMUM-of-two-distributions statistic is
    exactly the kind of quantity where a hasty positive reading from bootstrap
    noise would be the most damaging possible error this record could make,
    and the jackknife sensitivity check exists specifically to catch it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The portfolio's expected time is
      bounded, by construction, at min(E[T_rho_alone], E[T_IC_alone]) in the
      IDEALISED (overhead-free) case -- it can never do WORSE than the better
      pure strategy in expectation under that idealisation, though real
      concurrent-execution overhead (confounders) can erode this bound. This
      record prices WHETHER that idealised floor translates into any
      measurable POSITIVE value over pure rho specifically, a strictly
      narrower and more honestly scoped claim than an exponent.
    memory_exponent: >-
      THE COMPOSITION'S DISCLOSED COST. Running both racers concurrently
      needs the SUM of both engines' peak memory footprints while both are
      active -- strictly worse than either pure strategy's memory alone. This
      is a real, disclosed memory cost never previously priced anywhere in
      this lane for a hybrid strategy, and is exactly the kind of memory-axis
      consideration IDEA-20260922-2e2a58 already flags as usually decisive in
      this population; this record extends that same discipline to the
      composition case specifically.
    best_known: >-
      Matched rho with the curve's own symmetries under van Oorschot-Wiener
      (KN-LIT-012), the beta=0 slice of this record's own formula, per
      baseline_embedding above.
    hidden_overhead: >-
      DISCLOSED IN FULL. (i) Concurrent-execution contention is not modelled;
      every V(beta*) is an upper bound. (ii) Tail-index estimation is unstable
      at toy sample sizes, mitigated but not eliminated by bootstrap
      intervals and the jackknife check. (iii) The universal-restart-schedule
      competitive-ratio gap from Luby-Sinclair-Zuckerman's exact theorem is
      not itself quantified; the empirical bootstrap estimate is primary.
      (iv) No transfer to deployed B sizes is claimed or attempted.
    tradeoff_note: >-
      THIS RECORD IS THE TRADEOFF STATEMENT for the composition case
      specifically. A portfolio trades EXTRA MEMORY (both engines' footprints
      summed) and EXTRA IMPLEMENTATION COMPLEXITY (a restart scheduler, a
      stopping-rule coordinator, per-certificate verification on two
      independent racers) for a POTENTIAL reduction in expected time that
      this record's own preregistered null expects to be zero or negative at
      every tested cell. Parallelisation position: Racer rho's own internal
      parallel walks and Racer IC's own internal relation-collection
      parallelism (per IDEA-20260922-2e2a58's own analysis of each phase) are
      UNCHANGED by this composition; the composition adds a coordination
      layer ABOVE both, not a new source of internal parallelism.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Stage 0 is symbolic, an hour. Stage 1 reuses RQ-ICPERF-94c86e's existing
      or planned engine-roster harness and IDEA-20260922-2e2a58's planned rho
      harness; this record adds only a completion-time LOGGER around each
      (roughly 100-150 lines) and a restart-orchestration wrapper for Racer IC
      (roughly 150-200 lines). Stage 2's tail-fitting and bootstrap simulation
      is standard statistical scaffolding, roughly 200-300 lines (Hill
      estimator, KS test, bootstrap resampling, jackknife). Single machine,
      the >=100-sample-per-cell-per-engine collection is the dominant cost and
      is bounded by whatever RQ-ICPERF-94c86e's own per-instance solve times
      already are, times roughly 100; hours, not days, at toy scale. Under
      200 MB peak, no new solver engine beyond what RQ-ICPERF-94c86e already
      installs.

  asymptotic_claim:
    problem: >-
      ECDLP on the standardized binary population of RQ-BINSTD-b6f698 -- the
      value, if any, of a restart-portfolio composition of index calculus and
      matched Pollard rho, as opposed to running either strategy alone
    prior_best: >-
      Matched rho with the curve's own symmetries, the beta=0 slice of this
      record's own formula, unchanged from every sibling record's baseline.
    time_exponent: >-
      Unchanged. This record adds no exponent claim on either side; it prices
      a SCHEDULING correction whose primary preregistered expectation is that
      it changes nothing (V(beta*) <= 0 everywhere tested).
    memory_exponent: >-
      Strictly WORSE than either pure strategy while both racers run
      concurrently (sum of footprints), a disclosed cost with no
      corresponding time benefit under the preregistered null.
    hidden_cofactor: >-
      The tail-index alpha_tail (currently unmeasured anywhere in this
      corpus for these specific engines and instances), the floor ratio
      (currently unmeasured as a DISTRIBUTIONAL quantity, only as a mean),
      and the unmodelled concurrent-execution contention overhead.
    claim_kind: cost_model_correction
  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW
    THIS QUESTION'S BASELINE CLAUSE ENUMERATES. As an ATTACK this record
    mounts none, and its OWN preregistered primary expectation is that it is
    dominated by pure rho at every tested cell: matched rho with negation and
    the Frobenius class reduction under van Oorschot-Wiener (2^60.9 iterations
    estimated for ECC2K-130, KN-LIT-096, memory-accounted per
    IDEA-20260922-2e2a58's Theta(P) floor); matched rho with negation alone
    on pseudorandom rows; BSGS at (N^{1/2}, N^{1/2}); multi-target pooled rho
    at sqrt(K N); the completed 117.35-bit binary record as the feasibility
    ceiling (KN-TECH-036). On the record's own axes it claims no point beyond
    a PRICED, BOOTSTRAP-ESTIMATED upper bound on a scheduling composition's
    value, whose primary preregistered expectation is zero or negative. NOT
    NULL ON ANY AXIS, since the record actively measures against and prices
    itself relative to matched rho.
  sota_delta:
    time: >-
      PREREGISTERED ZERO OR NEGATIVE at every tested toy cell. The quantified
      deliverable is a NUMBER (V(beta*), with a bootstrap confidence interval,
