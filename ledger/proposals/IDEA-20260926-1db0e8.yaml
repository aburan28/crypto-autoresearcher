    prior_best: matched rho 2^60.81; c2bbe6's j = 1 form at about sqrt(N B) (HOLD-Q A13, confirmed here with memory charged)
    time_exponent: unchanged; j = 1 at 2^59 sqrt(B) with 2^58 sqrt(B) memory; j = 2 at 2^124 C_2(B')/B'
