  minimal_test:
    design: >-
      STAGE 0 (zero compute): recompute (A), (B), (C) and the S_3 form; commit
      the table. STAGE 1 (instrument gate, minutes): implement the Artin-
      Schreier m = 2 oracle of (B1) and run it on the 468 archived RC-1
      instances (386 unsatisfiable, 82 certified) against oracle A's verdicts;
      exact agreement required. STAGE 2 (the measurement): on the RC-1 field
      and curve build the asymmetric descent S_3(x_1, x_2, c) with x_1 in V
      (dim d = 6) and x_2 in V' (dim d' in {6, 8, 10, 12}), V subset V', for
      40 subgroup targets each (20 planted satisfiable, 20 random), and
      measure the degree-D closure cost (columns, elimination operations,
      wall clock) and the M_D rank profile at D in {3, 4}; repeat on the
      same-support random-bilinear null. STAGE 3 (graph constant): build a
      toy large-prime graph from j = 1 relations on the n = 19 Koblitz cell
      with Frobenius-canonicalised vertices and measure cycles against edges
      versus the uncanonicalised random-graph prediction. No attack is run.
    cell:
      curve: >-
        RC-1: n = 17, F_2[t]/(t^17 + t^3 + 1), A = 97044, B = 126251, #E = 4 *
        32603, x(2E) subgroup targets (KN-FIND-5a8d3e, DEC-20260926-cb4487);
        Stage 3 on the n = 19 Koblitz cell y^2 + xy = x^3 + 1 over
        F_2[t]/(t^19 + t^5 + t^2 + t + 1), #E = 4 * 130873 (my arithmetic,
        recompute at setup). ORDINARY control is RC-1 itself (no Frobenius);
        Koblitz arm is Stage 3 only.
      m: 2 for the sub-oracle (blocks (d, d')); the large-prime rows priced at m = 8 (j = 2, B = 2^18) and m = 13 (j = 1, B = 2^8) on ECC2K-130.
      l: d = 6 small block, d' in {6, 8, 10, 12} large block (polynomial basis {deg < d}, {deg < d'}).
      factor_base: F = {x in V}, F' = {x in V'}, V subset V' nested polynomial-degree subspaces.
      targets: 40 per (d, d') cell (20 planted satisfiable with certificates, 20 random); 468 archived RC-1 instances for the gate.
      seeds: enumerated 0..39, recorded; the archived instances by their run ids.
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py, curve.py (RC-1 field and curve, unchanged)
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py, closure.py, elim.py (degree-D closure and certificates; the symmetric-block descent builder must be generalised to blocks (d, d'), NEW about 100 lines)
      - experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py (oracle A, the comparison arm)
      - experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/ (archived instance set for the gate)
      - 'NEW: Artin-Schreier m = 2 oracle (half-trace, quadratic root, linear membership), about 80 lines; toy large-prime graph builder with union-find, about 120 lines'
      - 'missing: none for Stages 1-3; a WDSat or msolve cross-check of the closure costs is desirable but not installed'
    procedure:
      - 1. Stage 0 table; commit.
      - 2. Stage 1 gate on the archived instances; stop on any disagreement.
      - 3. Stage 2 ladder in d' at fixed d, both arms, two degrees, with certificates on every refutation and every planted solve.
      - 4. Same-support random-bilinear null at each (d, d').
      - 5. Stage 3 graph constant on the Koblitz cell.
      - 6. Fit slopes; write the three-row outcome.
    metrics:
      - name: closure_cost
        unit: column-pass elimination operations (int32 log count) and wall-clock seconds
        definition: cost of M_D and W_D at D in {3, 4} per instance
      - name: rank_profile
        unit: integers
        definition: rank of M_D and dim(W_D cap B_{<= D-1}) per instance
      - name: slope_d_prime
        unit: dimensionless
        definition: least-squares slope of log2 closure_cost against d' at fixed d, per arm, per D
      - name: oracle_agreement
        unit: fraction
        definition: instances where the Artin-Schreier oracle's verdict equals oracle A's
      - name: cycles_per_edge
        unit: dimensionless
        definition: cyclomatic number divided by edges at matched vertex count, canonicalised versus not
    controls:
      - ORACLE-AGREEMENT GATE against oracle A on 468 archived instances (blocking).
      - SAME-SUPPORT RANDOM-BILINEAR NULL at every (d, d') (blocking for the reopening reading: cost must grow there).
      - TWO DEGREES D to separate instrument saturation from a genuine small-block-only cost.
      - CERTIFICATES on every refutation and planted solve (docs/claims-and-verification.md).
      - ORDINARY CURVE (RC-1) versus Koblitz (Stage 3) for the graph constant; the closure ladder is ordinary only, and a Koblitz repeat is named as follow-up.
    outcomes:
      positive: >-
        (the reopening reading) closure cost flat in d' at fixed d on the
        curve arms, at both degrees, while the random null grows: the descent
        oracle's cost is set by the small block, C_2(B')/B' can fall with d',
        and the j = 2 column reopens with (B)'s formula as its price; route
        to independent review.
      negative: >-
        closure cost grows with d' on every arm at the slope of the column
        count or faster; the Artin-Schreier oracle agrees with oracle A: the
        large-prime column on ECC2K-130 is CLOSED for subspace bases with the
        mechanism "no smoothness test on E; locating a large leg costs the
        large base", and c2bbe6's revision inherits (A) and (B) as its
        dominated_by.
      artifact: >-
        oracle disagreement, or a flat curve arm with a flat null (instrument
        saturation): reported as defect or saturation, nothing read.
    falsification_threshold: >-
      Stated before any run: the reopening reading requires slope_d_prime on
      the curve arms below 0.25 at both degrees with 95 percent intervals
      excluding the null's slope, on both SAT and UNSAT arms. Anything else is
      the negative or artifact row.
    estimated_cost:
      implementation: low
      compute: >-
        ESTIMATE, order of magnitude: 160 closures at up to 18 Boolean
        unknowns and D = 4 (about 4000 columns), seconds each in the existing
        numpy bit-packed pass; the gate is 468 O(n) oracle calls; the toy
        graph is 2^16 additions. Under an hour on one core.
    required_metrics:
      - closure_cost and rank_profile per instance, per arm, per D
      - slope_d_prime per arm per D with interval
      - oracle_agreement (must be 1.0)
      - cycles_per_edge canonicalised versus not
      - certificate pass rate; termination_reason

  falsification_conditions:
    - 'Recomputation of (A) or (B) disagrees by more than 1 bit: arithmetic error, corrected before use.'
    - 'The Artin-Schreier oracle disagrees with oracle A on any archived instance: (B1) is wrong as derived; Stage 2 is blocked.'
    - 'slope_d_prime below 0.25 on the curve arms with the null growing: the reopening reading; the closure in (B) is withdrawn for descent oracles.'
    - 'The tuple-supply constraint in (A2) is shown not to bind (a construction with fewer tuples than attempts): (A2) is wrong and (A) reverts to the sqrt(N B) reading with memory.'
    - 'The graph constant under canonicalisation deviates by more than a factor 2 from the random-graph value: H2 fails and every relation count in (B) moves by that factor (reported, not a reopening).'

  confounders:
    - >-
      DEGREE SATURATION. At small D the closure may not reach the large
      block's monomials at all, producing a spurious flatness; two degrees and
      the random null are the defence.
    - >-
      NESTED VERSUS DISJOINT SUBSPACES. V subset V' makes the small legs also
      large-eligible; the count of decompositions changes by a bounded
      factor, disclosed, and the ladder is run with V' strictly containing V.
    - >-
      ORDINARY-ONLY LADDER. Stage 2 uses RC-1 (ordinary); a Koblitz repeat
      could differ through the b = 1 constant and Frobenius symmetry; named
      as the first follow-up rather than assumed equal.
    - >-
      UNIT MISMATCH between closure operations and group operations; (B)'s
      C_2 is in group-op equivalents and the measurement's slope is what is
      transferred, never the absolute cost.

  interpretation_limits:
    - >-
      NO ATTACK. Three priced closures and one measurement; the predicted
      outcome is that the large-prime column of the ECC2K-130 table closes for
      subspace bases with a named mechanism.
    - >-
      KN-OPEN-020 CLASS: subspace bases (scoped class) throughout; a large
      base that is NOT a subspace (an orbit union, a target-dependent set)
      changes membership cost and is out of scope here.
    - >-
      The hyperelliptic GTTD result is not contested; the record says only
      that its oracle economics do not transplant to elliptic subspace bases.
    - >-
      Toy scale: the RC-1 field is 17 bits and the ladder spans d' from 6 to
      12; the slope, not the cost, is what transfers, under H3.
    - >-
      FORWARD GUIDANCE regardless of outcome: (i) a large base with a cheap
      LOCATING structure would be the object that reopens the column -- the
      conjugate base of IDEA-20260926-178821 has membership free and every
      element located, which is why its row has no large primes at all;
      (ii) a Koblitz repeat of the ladder; (iii) whether canonicalised
      large-prime graphs deviate from the random-graph model is a FROB
      question.

  heuristic_assumptions:
    - id: H1
      statement: >-
        UNIFORM RESIDUALS. The residuals R - sum P_i over (m-1)-tuples from F
        are distributed over E like uniform draws for the purpose of the
        birthday count in (A) and the membership rate B'/2^132.
      rigorous_support: >-
        The mean number of tuples per residual value is exact by double
        counting (KN-FIND-007); the birthday shape is the classical occupancy
        law; failure mode is concentration of the (m-1)-fold sumset of a
        subspace base, which c2bbe6's H-c2bbe6-0 also names.
      validation_plan: >-
        SAMPLE: on RC-1, all (m-1)-tuples at m = 3, d = 6 (2^11 pairs), the
        residual histogram. COMPARISON: chi-squared against uniform over the
        subgroup; matched pairs against r^2/(2 S). TAIL: the most-collided
        residual against the occupancy tail. TRANSFER: none beyond the count's
        mean, which is exact at n = 131.
    - id: H2
      statement: >-
        RANDOM GRAPH. The Frobenius-canonicalised large-prime graph with V'
        vertices and r edges has cyclomatic number r - V' + components with
        components as in G(V', r), so about 0.16 V' independent cycles at
        r = V'.
      rigorous_support: >-
        The Erdos-Renyi component counts (classical); the heuristic is that
        canonicalisation and the algebraic origin of edges do not correlate
        them.
      validation_plan: >-
        SAMPLE: Stage 3's toy graph on the n = 19 Koblitz cell, 2^12 vertices,
        edges to 2r = V'. COMPARISON: cyclomatic number against the G(V', r)
        prediction, canonicalised versus not. TAIL: the largest component's
        size. TRANSFER: a constant only; it moves (B) by that constant.
    - id: H3
      statement: >-
        SLOPE TRANSFER. The growth exponent of closure cost in d' at fixed d
        measured at d' in {6, ..., 12} on RC-1 is representative of the
        descent oracle's dependence on the large block at larger d'.
      rigorous_support: >-
        None rigorous; the Macaulay column count C(d + d', <= D) is exact and
        gives the floor slope; the actual solving degree's dependence on d' is
        the unknown, which is exactly KN-OPEN-3c8f51's persistence question in
        another coordinate.
      validation_plan: >-
        SAMPLE: the ladder itself at two degrees. COMPARISON: measured slope
        against the column-count slope. TAIL: the largest single-instance cost
        per cell. TRANSFER ASSUMPTION, stated: only the SIGN of the slope is
        transferred to n = 131, and only to say whether the column is closed
        for descent oracles at toy scale.

  heuristic_note: >-
    (A) and (B) are arithmetic under H1 and H2, whose means are exact; (B1)
    is a derivation; (D)'s prediction is the record's falsifiable content and
    rests on H3. A-priori expectation: closure cost grows with d' at the
    column-count slope or faster, the oracle agrees, and the column closes.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. j = 1: 2^59.0 sqrt(B) time at 2^58.0 sqrt(B) memory,
      feasible only at B >= 2^8, hence >= 2^63 time; j = 2: 2^124 C_2(B')/B',
      i.e. 2^124 O(n) for the natural oracle; both against rho's 2^60.81.
    memory_exponent: >-
      j = 1 needs >= 2^62 stored residuals, the dominant charge; j = 2 needs
      the graph, B'/262 vertices.
    best_known: matched rho, 2^60.81 at O(1) per walk (KN-FIND-aa2efc).
    hidden_overhead: >-
      The (m-2)! and 262 constants are carried explicitly; the O(n) of the
      Artin-Schreier oracle is a polynomial factor, not an o(1); the
      random-graph constant (H2) is a constant.
    tradeoff_note: >-
      The j = 1 form is a memory-for-nothing variant of collision search;
      the j = 2 form's memory is the graph; neither improves any point of the
      time-memory plane against rho under van Oorschot-Wiener.

  estimated_cost:
