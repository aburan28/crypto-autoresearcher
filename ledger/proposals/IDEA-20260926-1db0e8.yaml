    the constant term the place an error would hide). All counts are hand
    arithmetic.

  assumptions:
    - >-
      V subset V' are F_2-subspaces so that membership is linear and the
      free-leg test is one rank-d' projection; (A) additionally allows V' =
      the whole field.
    - >-
      Frobenius canonicalisation of large primes is exact and cheap
      (IDEA-20260922-6cf862); where the small base is a plain subspace the
      small unknowns are B/2, not B/262, and the numbers move by 2^7 at most.
    - OFF-LIMITS COMPONENTS DECLARED: F2, F1 in (A1), F6 for canonicalisation.
    - Arithmetic only at deployed parameters; executable cells at n <= 23.

  proof_search_map:
    bottleneck: >-
      Whether the per-target cost of locating j >= 2 large legs can be made
      independent of the large base's size, as polynomial factorisation makes
      it in the hyperelliptic setting; (B1) says the natural oracle cannot,
      and (D) measures the algebraic oracle's dependence on d'.
    baseline_embedding:
      parameter_slice: >-
        j = 0 reproduces KN-FIND-aa2efc's product law verbatim (set B' = B,
        r = B, p = B^m/(m! 2^131)); j = 1 with V' = V reproduces c2bbe6's
        birthday count with S = B; the hyperelliptic setting with a
        factorisation oracle (C_j independent of B') must reproduce a gain, so
        the argument is silent there by construction.
      reproduction_check: >-
        Symbolic, zero compute: (B)'s total at C_2 = B' must equal
        2^{132}/262 = 2^{124.0}, the free-leg identity; (A)'s attempts at
        B' = 2^131 must equal 2^59.0 sqrt(B). Frozen fixture: on the RC-1 cell
        the Artin-Schreier oracle of (B1) must return the SAME satisfiability
        verdicts as oracle A on all 386 + 82 archived instances.
    observation_collision:
      observable: >-
        The pair (closure cost, satisfiability) on the asymmetric S_3 cell as
        a function of d' at fixed d.
      distinct_preimage_search: >-
        A cost flat in d' could mean (i) the oracle's cost is set by the small
        block (the reopening reading) or (ii) the instrument saturates (the
        Macaulay matrix at degree D is dominated by the small block's columns
        only because D is too low to reach the large block). Separated by
        running the same ladder at two degrees D and on the same-support
        random-bilinear null of KN-FIND-5a8d3e, where cost must grow with d'.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The m = 2 subspace decomposition rewritten as an Artin-Schreier
          equation in v over an enumeration of u in V' (B1); encoding exact;
          completeness (every solution pair has u in V' with the trace
          condition) and soundness (every returned x_1 in V' gives a genuine
          pair) are proof obligations checked against oracle A on RC-1.
        predicted_gain: >-
          A closed form C_2(B') = (B'/2) * O(n) for the natural oracle, which
          closes (B) by 63 bits at every B'; and an O(n)-per-candidate oracle
          for any future m = 2 cell, reusable.
      - transform: observable_fiber
        proposed_object: >-
          Hold "j large primes at arity m" fixed and vary the oracle class:
          factorisation (hyperelliptic, gain), enumeration (elliptic subspace,
          no gain), descent with cost monotone in unknowns (no gain), descent
          with cost set by the small block (gain, hypothetical).
        predicted_gain: >-
          Localises the whole large-prime question in one measurable
          property of the descent oracle.
    quantifier_order: >-
      FOR ALL m >= 3, FOR ALL B <= B', FOR ALL j in {1, 2}: the j-large-prime
      composition on subspace bases costs at least the expressions in (A) and
      (B) under H1 and H2; the j = 2 bound holds FOR ALL sub-oracles with
      C_2(B') >= B' 2^{-63.2}, and (B1) exhibits the natural sub-oracle at
      C_2 = (B'/2) O(n). NOT CLAIMED: a bound for a sub-oracle whose cost is
      set by the small block, which is (D)'s measurement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 the j = 1 free-leg form costs >= 2^63 time and >= 2^62
        memory at every feasible cell; the j = 2 form costs 2^124 C_2(B')/B'
        and the natural sub-oracle has C_2 = (B'/2) O(n); on the RC-1 shape the
        degree-D closure cost grows with the large block's dimension at fixed
        small block." It can never certify that no sub-oracle with cost set by
        the small block exists.
      nearby_object_control: >-
        The same-support random bilinear null (KN-FIND-5a8d3e's N-AFF/N-F2
        constructions), where cost MUST grow with total unknowns; and the
        hyperelliptic toy (a genus-2 Jacobian over F_{2^k} with factorisation
        oracle), where large primes MUST pay -- named, not built here.
    proof_obligations:
      - claim: (A)'s attempt count and memory, and the tuple-supply constraint, recomputed.
        responsibility: runtime
      - claim: (B)'s cancellation to 2^124 C_2(B')/B'.
        responsibility: correctness
      - claim: The S_3 form and the Artin-Schreier reduction of (B1) on y^2 + xy = x^3 + 1, verified against oracle A on RC-1's archived instances.
        responsibility: correctness
      - claim: The random-graph edge-to-cycle constant under Frobenius canonicalisation (H2), measured on a toy graph.
        responsibility: success_probability
      - claim: Closure cost on the asymmetric cell grows with d' at fixed d, on SAT and UNSAT arms, at two degrees D.
        responsibility: feasibility
      - claim: Nothing here bounds a sub-oracle whose cost is set by the small block, or any non-subspace large base.
        responsibility: scope

