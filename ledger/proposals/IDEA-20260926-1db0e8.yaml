idea:
  id: IDEA-20260926-1db0e8
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    LARGE PRIMES ON SUBSPACE FACTOR BASES MOVE ARITY INTO THE LARGE-BASE
    ORACLE: on ECC2K-130 the single-large-prime free-leg form is a birthday
    search at about 2^59 * sqrt(B) time and 2^58 * sqrt(B) memory, the
    double-large-prime GTTD form costs 2^124 * C_2(B')/B', and the one live
    question is whether a descent oracle's cost is set by the small block alone

  class: control

  claim: >-
    SEAM AND WHY THIS IS NOT IDEA-20260922-c2bbe6. HOLD-Q returned c2bbe6 (the
    elliptic single-large-prime accumulator) for revision because, by the
    ranker's check A13, its form costs about sqrt(N B), above rho, and told it
    to adopt the GTTD double-large-prime form and fill dominated_by. This
    record does not revise c2bbe6. It prices EVERY j-large-prime composition
    on a subspace factor base against KN-FIND-aa2efc's product law with the
    large-prime ORACLE charged, derives that the GTTD gain is unavailable for
    a reason specific to elliptic subspace bases (the oracle must LOCATE the
    large legs, and there is no smoothness test), and names the single
    measurement that could reopen the column. c2bbe6's revision must cite the
    numbers below; it cannot reproduce them because it charges large-prime
    membership as free and never charges the j >= 2 sub-oracle.

    SETTING. E = ECC2K-130, #E = 2^131 (4l), matched rho 2^60.81
    (KN-FIND-aa2efc). Small base F = {P : x(P) in V}, |F| = B = 2^d; large
    base F' = {P : x(P) in V'}, V' a subspace containing V, |F'| = B' = 2^{d'}.
    Frobenius-orbit canonicalisation of large primes (IDEA-20260922-6cf862's
    O(k) word comparisons) reduces graph vertices to B'/262 and small unknowns
    to B/262 where the base is an orbit union; where V is a plain subspace the
    small unknowns are B/2. All arithmetic mine, zero compute, to be
    recomputed by a reviewer.

    (A) j = 1, THE FREE-LEG FORM (c2bbe6's construction), PRICED. An attempt is
    one (m-1)-tuple from F, computed incrementally at one group operation, with
    residual L = R - sum P_i tested for x(L) in V' by a linear test. Success
    per attempt about B'/2^132. With r partial relations, matched pairs number
    about r^2 / (2 B'/262), and B/262 combined relations need r about
    sqrt(2 B B')/262. Attempts = r / (B'/2^132) = 2^132.5 sqrt(B) / (262
    sqrt(B')), DECREASING in B', so the optimum is the whole group, V' =
    F_{2^131}, membership vacuous: attempts = 2^{132.5 - 65.5 - 8.03} sqrt(B) =
    2^59.0 sqrt(B), stored residuals r = 2^58.0 sqrt(B). Two consequences.
    (A1) At the whole-group large base the construction IS a birthday search
    among the values R - sum P_i, i.e. a memory-2^58 sqrt(B) variant of
    collision search, and Shoup's bound (KN-TECH-005 via IDEA-20260901-863e36
    C4) applies to it. (A2) The tuple supply B^{m-1}/(m-1)! must exceed the
    attempts: at B = 2^8 that forces m >= 13 (2^96/2^28.8 = 2^67 >= 2^63); at
    B = 2^3.6, where the time would tie rho, the supply peaks at 2^14 and
    never reaches 2^61. So every feasible cell has time >= 2^63 and memory
    >= 2^62 against rho's 2^60.81 at O(1) memory per walk. HOLD-Q's sqrt(N B)
    is confirmed and sharpened to a cell-by-cell closure with the memory
    charged.

    (B) j = 2, THE GTTD FORM, PRICED WITH THE SUB-ORACLE. A relation with two
    large primes needs, per TARGET, an oracle that finds an (m-2)-tuple from F
    and a PAIR from F' summing to R. Per-target success p_2 = (B^{m-2}/(m-2)!)
    (B'^2/2)/2^131; relations needed r about B'/262 (edges for the
    orbit-canonicalised graph to reach cyclomatic number about B/262, valid
    for B <= 0.16 B' under the random-graph heuristic H2). The oracle's cost
    per target is at least (B^{m-2}/(m-2)!) * C_2(B') by the free-leg loop
    over small tuples with a two-large-leg sub-oracle C_2 per residual (an
    algebraic solve of the whole (m-2)+2 system is bounded below by the same
    sub-problem). Total = (B'/262) * (1/p_2) * (B^{m-2}/(m-2)!) * C_2(B') =
    2^132 * C_2(B') / (262 * B') = 2^124.0 * C_2(B')/B'. INDEPENDENT OF B AND
    m: the small base cancels exactly as in IDEA-20260904-96c4f3's m 2^n
    identity, and the only lever left is the two-leg sub-oracle's cost RELATIVE
    to the large base. To tie rho it must satisfy C_2(B') <= B' * 2^{-63.2}.

    (B1) THE NATURAL m = 2 ORACLE OVER A SUBSPACE IS AN ENUMERATION, BY AN
    ARTIN-SCHREIER REDUCTION. On y^2 + xy = x^3 + 1, S_3(x_1, x_2, c) =
    (x_1 x_2)^2 + c^2 (x_1 + x_2)^2 + c x_1 x_2 + 1 (re-derive before use;
    the b = 1 constant term is ECC2K-130's). With u = x_1 + x_2 and v = x_1
    x_2 this is v^2 + c v = c^2 u^2 + 1, solvable in v iff Tr(u^2 + 1/c^2) =
    Tr(u) + Tr(1/c) = 0, and then v = c * z with z^2 + z = u^2 + 1/c^2 by
    half-trace in O(n) operations; x_1 is then a root of T^2 + u T + v, again
    O(n), and x_1 in V' is a linear test (x_2 = u + x_1 is in V' automatically
    since u in V'). So the sub-oracle over a subspace V' is: enumerate u in V'
    with Tr(u) = Tr(1/c) (B'/2 values), O(n) work each. C_2(B') = B' * O(n),
    which is exactly the shape of RC-1's oracle A (2^9 root findings per
    attempt at d = 9, KN-FIND-5a8d3e). The condition x_1 in V' is nonlinear
    in u, so nothing here enumerates only the good u. Under this oracle (B)
    reads 2^124 * O(n): closed by 63 bits.

    (C) j >= 3. The sub-oracle is an arity-j decomposition over F', whose
    per-target cost is at least the product law's own arity-j oracle on a base
    of size B' >= B, and the relations needed grow to about B'/262; so a
    j-large-prime row at arity m costs at least the plain row at arity j on the
    LARGER base, and by the m <= 3 closure of the product law the rows j <= 3
    are closed on their own, while j >= 4 is a plain arity-j index calculus
    with extra small legs that only lower the per-target probability. Under
    any solver whose cost is monotone in the total unknown count, the
    cap-locus row of IDEA-20260926-4b65e3 dominates every large-prime row: a
    large prime adds d' unknowns to the system and gives back only
    probability, which the cap-locus row already has at one attempt per
    target.

    (D) THE ONE LIVE QUESTION, STATED SO IT CAN FAIL. Every closure above uses
    "the oracle's cost grows with the large block". If a descent oracle's cost
    were set by the SMALL block alone (the large legs' unknowns being cheap
    because their equations are, say, nearly linear once the small legs are
    fixed), then C_2(B')/B' could fall with d' and (B) reopens. PREDICTION:
    on the RC-1 shape S_3(x_1, x_2, c) with x_1 in V (dim d) and x_2 in V'
    (dim d' >= d), the degree-D closure cost and the M_D rank profile grow
    with d' at fixed d, at least linearly in the number of columns C(d + d',
    <= D); a cost FLAT in d' at fixed d, on both the satisfiable and the
    refuted arms, is the falsifying reading and the only outcome that
    reopens the large-prime column.

    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, x-coordinates in a fixed
    polynomial basis; the attack stage whose charged cost changes is
    RELATION COLLECTION (relations needed, per-attempt oracle) and the merge
    step before linear algebra.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the (m-1)-tuple or (m-2)-tuple of small
    legs together with its residual point, and the residual's x-coordinate as
    an element of V' (or of the whole field). Operation set Sigma: subtraction
    of two partial relations sharing a canonicalised large prime (c2bbe6's
    Sigma), the cycle operation on the large-prime graph (GTTD's), and the
    Frobenius canonicalisation of large primes; Sigma is not the full
    translation action.

    TRICHOTOMY. Class I, partial-action: the partial relation propagates only
    under subtraction along shared large primes and along graph cycles; the
    residual's orbit label is a block system of <sigma> on F' (IDEA-20260901-
    863e36), which is why canonicalisation is a quotient and not a filter.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The projection (tuple,
    residual) -> canonical residual discards the tuple (fibre about B^{m-1}
    /(m-1)! per residual value) and is Sigma-compatible because two partial
    relations combine iff their projections agree; it is lossy in the
    representation used. It PASSES, exactly as c2bbe6 argues. What this
    record adds is that passing the test does not make the composition cheap:
    the cost sits in how many attempts a match costs (A) and in what locating
    two large legs costs per target (B), neither of which the projection sees.

    THE PRICED OPEN NUMBER. For (A), none is open: the birthday count is
    arithmetic under H1 and the memory is charged. For (B), the number is
    C_2(B')/B', predicted 2^{-0} * O(n) by (B1) for the natural oracle and
    measured in the minimal test as the growth of closure cost in d'. For
    the graph, the constant relating edges to cycles under Frobenius
    canonicalisation (H2) is a secondary measured number.

    WHY THE GTTD GAIN DOES NOT TRANSPLANT. In the hyperelliptic setting
    (KN-LIT-164, abstract-level in the corpus) the decomposition oracle is a
    polynomial factorisation whose cost does not depend on how many large
    primes are admitted, so enlarging the large base raises the relation rate
    at no oracle cost and the exponent falls from q^{2 - 2/(g + 1/2)} to
    q^{2 - 2/g} (recalled exponents, not load-bearing here). On an elliptic
    subspace base there is no factorisation: a large leg must be FOUND, and
    (B1) shows finding two of them costs the large base's size. That is the
    named mechanism, and it is a statement about the object (no smoothness
    test on E), not about the attempt.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 is the family; the large-prime
    graph is F2's own relation-collection accountancy. F1 appears in (A1)
    because the whole-group large base turns the construction into a
    collision search. F6 (Frobenius orbit) is the canonicalisation component.
    KN-OPEN-020 class: V and V' are F_2-subspaces (the scoped class,
    charged: description O(d'), membership one linear test); the whole-group
    large base of (A) has no description and no membership cost.

