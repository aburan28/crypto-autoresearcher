  object_first_candidate:
    tracked_object: >-
      THE PAIR OF OUTPUT LAWS (D_conf, D_omit) ON SIGNATURE SPACE, tracked as a
      single scalar - their total variation distance - through the signing
      loop. Not the signature, not the predicate, not the secret: the DISTANCE
      BETWEEN TWO SIGNERS. Established families declared off-limits as the
      primary lens for this proposal: lattice reduction and any estimator
      differencing; fault injection and physical side channels (GOAL-MLDSA-001
      owns those and RQ-MLDSA-ffa0f5's second constraint makes the separation
      binding - note that eprint 2025/195 realises the omission BY a fault and
      this proposal does not, it studies the omission itself); nonce misuse and
      the HNP family; forgery search of any kind. The lens actually used is
      elementary probability on conditioned laws, which is not an attack family.
    lossiness: >-
      MAXIMALLY LOSSY AND THAT IS THE POINT. The projection sends the entire
      pair of signing algorithms - keys, messages, randomness, every emitted
      byte - to one number in [0,1]. The fibre over an observed value is
      enormous. The discard is COMPATIBLE with the target's operations in the
      precise sense the lossy-projection test requires: total variation is
      monotone under any post-processing (data processing), so the scalar
      propagates through encoding, transmission, verification and any
      adversarial computation without ever needing to be recomputed - whatever
      an adversary does to the signature, the distance between what it sees in
      the two worlds is at most p_R. This is not a change of coordinates: p_R
      does not determine the signature law, and no pair of laws is recoverable
      from it. THE MIRROR FAILURE - a projection so lossy it is constant across
      instances - is checked and does NOT occur: p_R takes four materially
      different values across the four predicates and three parameter sets,
      ranging from exactly 0 to 0.804, and the pre-registered tell would be a
      projection returning the same value everywhere.
    propagation: >-
      One step of the target operation is one signing ATTEMPT, and the
      propagation law is exactly the conditioning step: D_omit = mu(.|Q),
      D_conf = D_omit(.|P_R). Across N queries the scalar composes by the
      hybrid bound, N*p_R, sub-additively and with no independence assumption
      beyond fresh y per attempt. Both one-step and N-step laws are measurable:
      the one-step law by counting predicate firings, the N-step law by running
      the explicit t0-holding detector and reading its ROC.
    survival_score: >-
      Survives to the end of the adversary's computation and beyond, because
      data processing cannot increase it - this is unusually far for a tracked
      object and is what makes the argument short. It DISSOLVES at exactly one
      place, and the proposal names it: the bound is over the emitted SIGNATURE
      only. It says nothing about a party that observes the signer's timing,
      power or memory, where the omission changes the attempt-count
      distribution and the tracked scalar is no longer the right object. That
      boundary is also this lane's scope boundary with GOAL-MLDSA-001, which is
      a convenient coincidence and not an argument.

  null_object_control: >-
    THREE ARMS, ALL EXECUTED ON THE IDENTICAL ESTIMATOR PATH, THE NULL FIRST.
    NULL-1 (can fail, and is the load-bearing one): TWO CONFORMING SIGNERS,
    different seeds, same key. The forced value of the estimated TV between
    them is 0, so whatever the estimator returns here is its finite-sample
    floor at the executed sample size. Because TV between empirical measures on
    a huge alphabet is BIASED UPWARD and can approach 1 at small samples, the
    estimator must be a declared low-dimensional statistic (the firing-
    indicator of each predicate, plus the verification-outcome indicator), not
    a plug-in TV on raw signatures - and NULL-1 is precisely the arm that
    exposes it if that discipline slips. If NULL-1's floor exceeds the p_R
    being estimated, NO measurement is reportable at that parameter set and the
    sample size, not the scheme, is what is reported.
    NULL-2 (structural, must AGREE with NULL-1): a conforming signer against a
    signer that omits a predicate DECLARED UNREACHABLE at that parameter set -
    the ct0 predicate at ML-DSA-65 or -87, where IDEA-20260805-bb52fa's
    envelope theorem forces p_R = 0 exactly. The two signers are then
    bit-for-bit identical on every input, so this arm's forced value is also 0.
    NULL-1 and NULL-2 must agree within their intervals; if they do not, the
    estimator responds to something other than the omission and no signal-arm
    number is reportable.
    POSITIVE ARM WITH A DERIVED, NON-ZERO FORCED VALUE (this is what makes the
    suite able to fail in the informative direction): a signer omitting the
    Line-23 conjunction, whose p_R is FIXED IN ADVANCE at 1 - 1/Repetitions =
    0.765 / 0.804 / 0.740 from FIPS 204 Table 1. The estimator must return
    those three numbers to within its interval. An estimator that cannot
    recover a TV of 0.765 has no power to certify anything about 7e-9 and the
    whole instrument is void.
    GRADED ARM, FOUR INTERIOR POINTS, MONOTONICITY REPORTED (KN-TECH-1a5b7e's
    refinement: two ends do not give a sign): a synthetic parameter cell with
    gamma2' swept over five values so that the ct0 predicate's rate runs
    through roughly 1e-1, 1e-2, 1e-3, 1e-4, 0. The estimated TV must track p_R
    monotonically and hit the floor at the last point. A statistic that does
    not decay as the threshold rises is the canonical artifact tell.

  discriminated_from:
    - >-
      IDEA-20260805-031ce2 censuses the four predicates into verifier-enforced
      / self-enforcing / unobservable and derives sigma ~ 0.991 for the
      unobservable one. It answers "does a violating signature verify". This
      answers "how much does the omitting SIGNER differ from the conforming one
      as a distribution", which 031ce2 never forms, and it consumes 031ce2's
      sigma only in the secondary ratio (4). If 031ce2 were withdrawn entirely
      the identity in (A) and the term in (B) would be unaffected.
    - >-
      IDEA-20260805-bb52fa computes the reachability envelope and the rate
      7.34e-9 / 0 / 0. That is the INPUT p_R to this proposal, not its content.
      bb52fa's own deliverable is a budget argument (do not buy a 1.4e8-
      signature campaign); this proposal's deliverable is what the rate MEANS
      once you have it, which bb52fa explicitly does not supply.
    - >-
      IDEA-20260808-4f83f6 partitions the predicates into public and secret via
      the identity w - c s2 = A z - c t and measures the accepted-CHALLENGE law
      deviation. That is a measurement of a specific channel's width. This is a
      theorem that CAPS every channel simultaneously, including 4f83f6's: since
      the accepted-challenge law is a function of the emitted signature, its
      deviation is bounded by p_R, which predicts 4f83f6's headline statistic
      is at most 7.3e-9 at ML-DSA-44 and exactly 0 at -65/-87. That is a
      falsifiable prediction ABOUT a sibling proposal and it is offered as one.
    - >-
      IDEA-20260808-e5f947 counts the verifier's accept fibre over byte
      strings. Different domain (octets vs. distributions), different question
      (strong unforgeability vs. signer conformance), no shared statistic.
    - >-
      IDEA-20260805-630606 bounds the number of signatures needed to
      reconstruct t0. Its object is a channel capacity toward t0; this
      proposal's object is a distance between signers, and it would be
      unchanged if t0 were published in the public key.

