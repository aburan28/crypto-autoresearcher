idea:
  id: IDEA-20260821-60ba98
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-21'
  title: >-
    What a non-conforming ML-DSA signer leaks is EXACTLY the firing rate of the
    check it omits: TV(D_conform, D_omit) = p_R identically, which turns
    "what does the security argument lose" into the named additive term N*p_R
    with crossover N* = 1/p_R, and reconciles in one formula the published
    half-hour secret-key recovery from omitting a rejection test (p ~ 0.76)
    with the essentially nil consequence of omitting the ct0 test
    (p <= 7.3e-9 at ML-DSA-44, 0 at -65/-87)
  class: mechanism

  claim: >-
    RQ-MLDSA-ffa0f5's third target asks what a signer that skips a signing-only
    rejection LEAKS and what the security argument LOSES, "stated as a named
    term". Both have an exact answer that needs no measurement of the leak
    itself, only of the rate.

    (A) THE IDENTITY. Let a conforming signer loop until predicates
    P = P_1 AND ... AND P_m all hold, and let a non-conforming signer omit
    exactly one predicate P_R, looping until the remaining conjunction
    Q = AND_{i != R} P_i holds. Write D_conf for the law of the emitted
    signature under the conforming signer and D_omit for the law under the
    omitting one. Then D_conf is D_omit further conditioned on P_R, so for
    p_R := Pr[NOT P_R | Q],
        TV(D_conf, D_omit) = p_R   EXACTLY, with the supremum attained on the
    event {NOT P_R} itself. No approximation, no heuristic, no scale limit.

    (B) THE NAMED TERM. By a standard hybrid over N signing queries, ANY
    adversary's advantage against the omitting signer exceeds its advantage
    against the conforming signer by at most N*p_R. So what the ML-DSA security
    argument loses when a signer omits P_R is an ADDITIVE N*p_R in every
    EUF-CMA / SUF-CMA statement about that signer, and nothing else: the term
    is named, it is linear in the query count, and it saturates at the
    crossover N* = 1/p_R, beyond which the argument transfers no guarantee at
    all. That sentence is the object RQ-MLDSA-ffa0f5 asks for and this corpus
    does not contain it.

    (C) THE BOUND IS TIGHT, NOT MERELY VALID, AND THE MATCHING DETECTOR IS
    CONCRETE. An observer holding t0 evaluates P_R = (||<<c t0>>||_inf <
    gamma2) on every signature it sees, so it distinguishes the two signers
    with advantage 1 - (1 - p_R)^N, which agrees with N*p_R to first order.
    Leak is therefore Theta(N*p_R): the rate is not an upper bound on the leak,
    it IS the leak.

    (D) WHAT THE FORMULA EXPLAINS, AND THIS IS THE DISCRIMINATING PAYLOAD.
    Two facts about omitted ML-DSA rejection tests sit in the literature
    looking contradictory. Azevedo-Oliveira, Calle Viera, Cogliati and Goubin
    (eprint 2025/195, PKC 2025) state, in an abstract this session read, that
    "an adversary with enough rejected signatures can recover Dilithium's
    secret key in less than half an hour on a desktop computer", obtained "by
    physically preventing one of the rejection sampling tests from happening".
    Meanwhile RQ-MLDSA-ffa0f5 records the ct0 test as unobserved over more than
    a billion signatures. Under (A)-(C) these are the same statement at two
    values of one parameter: the first-stage tests (Algorithm 7 Line 23) have
    p_R = 1 - 1/Repetitions = 0.765 / 0.804 / 0.740 at ML-DSA-44 / -65 / -87
    from FIPS 204 Table 1's 4.25 / 5.1 / 3.85, so N*p_R exceeds 1 at N = 2 and
    the argument transfers nothing; the Line-28 ct0 test has p_R <= 7.34e-9 at
    ML-DSA-44 and, by IDEA-20260805-bb52fa's envelope theorem, exactly 0 at
    ML-DSA-65 and ML-DSA-87, so N* = 1.36e8 and infinity respectively.
    THE PREDICATE'S DEPENDENCE ON THE SECRET IS IRRELEVANT; ONLY ITS RATE
    MATTERS. That is counterintuitive and it is the falsifiable content: a
    reader's default intuition is that omitting a t0-DEPENDENT test leaks t0 at
    a rate governed by that dependence, and (A) says it cannot.

    NOT A BREAK. Every signature here is produced by a party holding sk; no
    forgery is constructed; nothing is asserted about MLWE, MSIS or
    SelfTargetMSIS in any direction. The result is about a NON-CONFORMING
    implementation, and it says the standard's own check is worth exactly its
    firing rate - which at two of three parameter sets is worth nothing at all,
    and which is the honest reason a conformance test cannot find the defect.

  mechanism: >-
    (1) PROOF OF (A), THREE LINES. Let mu be the law of one signing ATTEMPT's
    output. D_omit = mu(. | Q); D_conf = mu(. | Q AND P_R) = D_omit(. | P_R).
    For any event S, D_conf(S) - D_omit(S) = D_omit(S AND P_R)/D_omit(P_R) -
    D_omit(S), which is maximised at S = P_R with value 1 - D_omit(P_R) = p_R,
    and no S exceeds it. Hence TV = p_R. The only structural fact used is that
    the conforming signer's accept set is a SUBSET of the omitting signer's,
    which is what "omits a rejection condition" means. It therefore applies to
    every one of the four predicates and to any conjunction of them, and it
    applies unchanged to the hedged and deterministic modes because it never
    touches how y is generated.

    (2) WHY THE HYBRID IS LEGITIMATE AND WHERE IT IS NOT. Signing queries are
    independent given sk only if y is freshly random per attempt. In the hedged
    mode this holds. In the deterministic mode (rnd = 0) repeated queries on
    the SAME message return the same signature, so the hybrid is over DISTINCT
    messages and N must be read as the number of distinct messages signed.
    Stating this is part of the deliverable, because "N signatures" and
    "N distinct messages" differ by an unbounded factor in a deployment that
    re-signs.

    (3) WHY THE LOWER BOUND MATTERS MORE THAN THE UPPER ONE. An upper bound of
    N*p_R alone would leave open that the true leak is far smaller, which is
    what a defender would like to argue. The t0-holding detector in (C) closes
    that: it is an explicit adversary achieving 1 - (1-p_R)^N. So the interval
    [1-(1-p_R)^N, min(1, N*p_R)] has ratio -> 1 as N*p_R -> 0, and the leak is
    pinned, not bracketed loosely.

    (4) THE TRANSCRIPT-VISIBLE PART IS SMALLER THAN THE LEAK, AND THE RATIO IS
    THE TESTABILITY OBSTRUCTION. An omitted ct0 test produces a signature
    violating the MakeHint/UseHint sufficient condition. IDEA-20260805-031ce2
    derives (generator-computed, re-derivation required) that such a signature
    STILL VERIFIES with probability sigma ~ 0.991 at ML-DSA-44. So the rate at
    which the omission is visible to a party that merely verifies is
    p_R*(1-sigma) ~ 6.6e-11, while the rate at which it leaks to a party
    holding t0 is p_R ~ 7.3e-9. The ratio 1/(1-sigma) ~ 110 is the price of not
    knowing t0, and it is why no amount of sign-verify testing finds the defect
    even at the parameter set where the defect is reachable.

    (5) THE EXPERIMENT IS ABOUT p_R, NOT ABOUT THE LEAK. Because (A) is a
    theorem, the only empirical content is the rate, and the only way the
    proposal can be WRONG in a way an experiment detects is if the identity's
    premise fails - i.e. if the omitting signer's output law is NOT the
    conditional law. That premise has one real failure mode, and the design
    hunts it: an implementation that omits P_R may also change the ATTEMPT
    COUNTER (FIPS 204 increments kappa by l per attempt), so the omitting
    signer draws y from a different ExpandMask index sequence than the
    conforming one would have at the same attempt. This does not change the law
    of a single attempt (ExpandMask outputs are modelled as independent across
    kappa), but it does mean the two signers' outputs are not COUPLED, so an
    empirical TV estimate compares two independent streams and its finite-
    sample floor must be derived before it is read.

