idea:
  id: IDEA-20260816-e5cedd
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: Write out the quantifier order of the divisor-parity claim and test the one direction that
    is actually valid, namely that a square over k(t) stays square under every regular specialization
    t to a, by measuring specialization agreement and by hunting an observation collision -- two tables
    with identical square-class certificates on opposite sides of realizability
  class: theory
  claim: '(A) IDEA-20260726-012 asks whether the obstruction is GENERIC or FIXTURE-SPECIFIC, and its
    own confounders block already states the correct asymmetry: a square rational function remains
    square at every specialization where its square root is defined, so a nonsquare at a regular valid
    specialization rules out a generically square identity on that component, while a nonsquare generically
    may still specialize to a square. That asymmetry is a quantifier-order fact and it is the only
    direction of specialization inference that is sound. (B) Section 8 of docs/inventor-protocol.md
    requires two cheap pre-compute audits this bucket has not run: quantifier order, and observation
    collision. This entry runs both against the divisor-parity gate. The quantifier-order audit rewrites
    the claim with explicit forall and exists over (constant field k, parameter assignment d, specialization
    point a, discriminant index) and checks whether any claimed uniform conclusion allows a witness
    to depend on an argument it must not. (C) The observation-collision audit is the sharper half:
    the gate''s OBSERVABLE is the square-class certificate. The audit searches for two prescribed
    tables with the IDENTICAL certificate where one is realizable and the other is not, which would
    be a direct falsifier of identifiability -- the certificate cannot classify what it cannot distinguish.
    Under the one-directional reading no collision is a problem; under H-PMA-001''s frozen exact-classifier
    reading a single collision is decisive. (D) The measurement is specialization agreement: for each
    table over k(t) and each regular specialization point a in k, compare the gate''s verdict over
    k(t) with the gate''s verdict on the specialized table over k, and tabulate the four agreement
    cells. Only one cell is a contradiction: generically square but specialized nonsquare at a regular
    point. (E) What is NOT claimed: that a disagreement in any other cell is an error. Generic nonsquare
    specializing to a square is expected and is not a defect. (F) No attack, speedup or security consequence
    is claimed.'
  mechanism: 'Stage 1 is pure writing and costs no compute: state the claim as an explicit quantifier
    string, enumerate every argument a witness could depend on, and mark each dependence as permitted
    or forbidden by the frozen statement of H-PMA-001. This produces a table that a reader can check
    against the frozen text, and it is a deliverable in its own right. Stage 2 implements the specialization
    map: for a in k not a pole and not a zero of any denominator involved, reduce every p_S and every
    reduced Delta modulo (t - a), and detect the exceptional points where the reduction is not regular,
    which are branched and excluded rather than counted. Stage 3 computes, per table, the verdict
    over k(t) and the verdict at every regular a in k, and fills a two-by-two agreement table, isolating
    the one contradictory cell. Stage 4 runs the collision hunt: hash each table''s full square-class
    certificate, group tables by certificate, and within each group of size at least 2 attempt to
    separate the members by any independently computable realizability signal available at that cost
    -- for finite constant fields, by the exhaustive image data of entries 1 and 2 of this bucket
    where the sizes permit. Stage 5 runs the null. The mechanism is refuted as an instrument if the
    specialization map is not verified to commute with the algebraic operations, which stage 2 checks
    directly on constructed identities.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/proposals/IDEA-20260726-012.yaml confounders and minimal_test blocks in full,
      ledger/hypotheses/H-PMA-001.yaml statement, assumptions and falsification_conditions in full,
      docs/inventor-protocol.md section 8 in full, knowledge/techniques/KN-TECH-080.md presence confirmed
      by listing. Grepped ledger/proposals/ and ledger/hypotheses/ for: specializ, generic, quantifier,
      observation collision, identifiab, proof_search_map.'
    results: IDEA-20260726-012 contains the specialization asymmetry verbatim in its confounders block
      and contains a reviewed_F_211_specialization_agreement prediction, but that prediction is about
      reproducing one specific frozen discriminant exactly (square denominator and a monic degree-10
      numerator factor with listed coefficients) and is a derivation-fidelity check against a single
      fixture whose supporting records H-PMA-001 states do not exist in this repository. It is not
      a measurement of specialization agreement across a grid, and it contains no quantifier analysis
      and no collision hunt. proof_search_map is required by docs/inventor-protocol.md section 8 for
      proof-oriented proposals; neither IDEA-20260726-012 (dated 2026-07-26, before the section-8
      adoption) nor H-PMA-001 carries one, so the four section-8 audits have never been run against
      this mechanism. No record in ledger/proposals/ or ledger/hypotheses/ pairs observation collision
      with a square-class certificate.
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository. Claimed new
      inside it: the explicit quantifier-order table for the divisor-parity claim, the specialization-agreement
      measurement across a grid rather than against one fixture, and the observation-collision hunt
      on square-class certificates. Assembled from known parts: the specialization asymmetry is stated
      in IDEA-20260726-012''s own confounders; the two audits are docs/inventor-protocol.md section
      8 items 2 and 3 applied to a mechanism that predates the section and therefore never received
      them.'
  object_first_candidate:
    tracked_object: 'The SQUARE CLASS UNDER SPECIALIZATION: the pair (class of Delta in k(t)-star
      modulo squares, class of Delta specialized at a in k-star modulo squares), followed as a function
      of the specialization point a. What propagates is the compatibility relation between the generic
      class and the family of specialized classes.'
    lossiness: 'Genuinely lossy in two stages, and the second loss is where the asymmetry lives. Delta
      is reduced first to its square class over k(t), discarding everything but parity data and a
      constant class; then specialization at a further collapses the whole divisor to a single constant
      class in k. The second projection is strictly lossy and NOT invertible, which is exactly why
      the inference runs one way: squareness survives specialization (a square root specializes to
      a square root wherever it is defined) but nonsquareness does not. The retained part propagates
      compatibly with multiplication and with the ring operations at regular points, which stage 2
      verifies rather than assumes.'
    propagation: One step of the target operation is moving the specialization point from a to a nearby
      a-prime. The generic square class is unchanged, by definition; the specialized class can flip.
      So the action on the tracked pair changes only the second coordinate, and the measurement is
      the profile of that second coordinate over all regular a in k, against a fixed first coordinate.
      For finite k this profile is a finite vector of length at most q minus the number of exceptional
      points, which is fully enumerable and is the concrete object the run produces.
    survival_score: 'The generic-to-specialized implication survives at every regular specialization
      point, by the standard argument, and that is total survival in the one valid direction. The
      reverse implication dissolves immediately: it fails at the first point where a nonsquare becomes
      a square, and the run measures how often that happens. Over F_q the specialized class group
      has order 2, so a random specialized class is square about half the time, and the reverse implication
      is worthless there in a quantifiable way -- which is the number this entry reports rather than
      asserts. The whole framework dissolves at the exceptional points, whose count is a measured
      quantity.'
  null_object_control: 'Two nulls in the same invocation. NULL 1 (validity of the specialization map):
    apply the identical specialization pipeline to CONSTRUCTED squares over k(t), that is functions
    built explicitly as h squared. At every regular a, the specialized value must be a square in k,
    with zero exceptions -- this is the one direction that must hold, and any violation means the
    specialization map or the square test is wrong, not that a theorem failed. NULL 2 (background
    collision rate): compute square-class certificates for uniformly sampled degree-matched rational-function
    tables and measure how often two distinct tables share a certificate, giving the collision rate
    expected from certificate coarseness alone. For a signal-arm collision to mean anything, it must
    occur at a rate distinguishable from NULL 2, or else be a single collision that is individually
    verified with realizability established on both sides.'
  discriminated_from:
  - 'IDEA-20260726-012''s reviewed_F_211_specialization_agreement prediction: a fidelity check that
    a symbolic derivation reproduces one frozen discriminant exactly, against a fixture whose supporting
    records H-PMA-001 says do not exist here. This entry never targets that fixture, measures a grid-wide
    agreement profile instead, and would run identically if the fixture never existed.'
  - 'Entry 5 of this bucket (component attribution): that decomposes the certificate at a fixed field.
    This entry holds the certificate whole and varies the specialization point, so the varied argument
    is different.'
  - 'Entry 4 of this bucket (anchor equivariance): varies the gauge and holds the table fixed. This
    varies the specialization and holds the gauge fixed.'
  - 'Entry 6 of this bucket (density against nulls): measures firing rates. This measures agreement
    between two verdicts on the same object at different levels of specialization, which is a relation
    rather than a rate.'
  - 'A generic sanity check that a symbolic result specializes correctly: the content here is the
    ASYMMETRY -- only one of the four agreement cells is a contradiction -- and the collision hunt,
    neither of which a fidelity check performs.'
  assumptions:
  - A square in k(t) specializes to a square in k at every point where the square root is regular
    and its denominator does not vanish; the converse fails. This is the load-bearing asymmetry, it
    is stated in IDEA-20260726-012's own confounders, and it is checked directly by NULL 1 rather
    than assumed.
  - 'Regular specialization points can be identified exactly: a is regular for a table when no denominator
    of any p_S, no denominator of any reduced Delta, and no relevant leading coefficient vanishes
    at a. Points failing this are exceptional, branched, and excluded from agreement scoring.'
  - Realizability over k(t) and realizability over k after specialization are different questions;
    the entry never infers one from the other and treats the specialized realizability as a separate,
    independently established fact wherever it is used in the collision hunt.
  - For finite k, the square test in k is exact by Euler's criterion or by table lookup; over Q it
    is exact by factorisation of the reduced rational value.
  predictions:
  - metric: constructed_square_specialization_violations
    direction: lower
    minimum_effect: exactly 0 across all constructed squares and all regular specialization points
      -- this is the one direction that must hold and any violation voids the instrument
  - metric: contradictory_cell_count
    direction: lower
    minimum_effect: exactly 0 -- no table may be generically square and specialize to a nonsquare
      at a regular point; a nonzero count means the generic computation or the specialization is wrong
  - metric: reverse_implication_failure_rate_over_F_q
    direction: higher
    minimum_effect: 'I refuse to pre-commit a number. Reason: this is the rate at which a generic
      nonsquare specializes to a square, which is the quantity the run exists to measure; a structureless
      argument suggests something near one half because the specialized class group has order 2, but
      pre-committing that would be asserting the null as a result.'
  - metric: signal_arm_certificate_collisions_with_opposite_realizability
    direction: different
    minimum_effect: any single verified instance is decisive against the exact-classifier framing
      of H-PMA-001; zero instances is the expected and equally reportable outcome and is not evidence
      of identifiability
  - metric: quantifier_audit_forbidden_dependences_found
    direction: different
    minimum_effect: no pre-commitment; the audit is enumerative and its output is a table, but every
      entry must be traceable to a quoted sentence of the frozen record
  minimal_test:
    design: 'Stage 1 alone costs ZERO compute and is worth running before anything else: write the
      claim of H-PMA-001 as an explicit quantifier string over (k, d, a, discriminant index, matrix),
      enumerate the dependences a witness is allowed, and mark each against the frozen text with the
      sentence it comes from. That table either surfaces a forbidden dependence, which is a finding
      reached for the price of an hour of reading, or it does not, in which case it is still the section-8
      audit the mechanism has never received. The cheapest compute-bearing discriminator is then NULL
      1 plus the contradictory-cell count on a small grid over one finite field: build 200 constructed
      squares, specialize each at every regular point, and confirm zero violations; then run the real
      grid and count contradictory cells. That is a few thousand exact square tests in a finite field,
      seconds of compute, and it decides whether the generic computation and the specialization agree
      in the only direction where agreement is compulsory. The collision hunt is a separate and larger
      stage and is not needed to reach that decision.'
    controls:
    - 'NULL 1: constructed squares over k(t) must specialize to squares at every regular point, zero
      exceptions, run through the identical specialization and square-test code path.'
    - 'Constructed-nonsquare control: functions built with a designed odd valuation must be certified
      nonsquare generically, so the generic test is exercised in both directions.'
    - 'Exceptional-point control: points where any relevant denominator or leading coefficient vanishes
      are detected, branched and excluded, with counts reported per table; never scored as disagreements.'
    - 'Ring-homomorphism control: for a sample, specialize the inputs first and recompute q_ij, c_ijk,
      Delta from the specialized data, then compare against specializing the generic Delta; these
      must agree at regular points, which checks that specialization commutes with the construction.'
    - 'NULL 2: background certificate-collision rate on degree-matched uniformly sampled tables.'
    - 'Collision verification control: any signal-arm collision is only reported if realizability
      is independently established on both sides by a source outside the gate.'
    required_metrics:
    - 'the quantifier-order table: each quantified argument, its scope, its permitted dependences,
      and the frozen sentence supporting each entry'
    - 'per table: the generic square-class verdict, the vector of specialized verdicts over all regular
      a, and the count of exceptional points'
    - the four-cell agreement table aggregated over the grid, with the contradictory cell isolated
    - 'reverse-implication failure rate: fraction of generic-nonsquare tables that specialize to a
      square, per regular point and aggregated'
    - constructed_square_specialization_violations and constructed_nonsquare generic misclassifications
    - ring-homomorphism control agreement rate
    - certificate collision groups in the signal arm and in NULL 2, with group sizes
    - for each verified signal-arm collision, both tables, the shared certificate, and the independent
      realizability evidence on each side
  falsification_conditions:
  - 'Any constructed square specializes to a nonsquare at a regular point: the specialization map
    or the square test is wrong and no agreement number may be reported.'
  - 'Any nonzero contradictory-cell count on the real grid: the generic square-class computation and
    the specialized one are inconsistent, which is an implementation defect rather than a mathematical
    result and must be repaired before anything else is read.'
  - 'The ring-homomorphism control fails: specialization does not commute with the construction of
    q_ij, c_ijk and Delta, so specialized verdicts are not comparable to generic ones.'
  - 'A verified certificate collision with opposite realizability is found: the square-class certificate
    does not identify realizability, which falsifies the exact-classifier framing frozen in H-PMA-001
    while leaving the one-directional obstruction reading of IDEA-20260726-012 intact. The record
    must state that distinction explicitly.'
  - 'The quantifier audit finds a witness permitted to depend on the parameter assignment or the characteristic
    where the frozen statement claims a uniform conclusion: the claim as frozen is stronger than its
    argument supports.'
  - 'Signal-arm collision groups occur at a rate indistinguishable from NULL 2''s: certificate coarseness
    explains them and no identifiability conclusion may be drawn either way.'
  confounders:
  - Exceptional points are numerous over small fields, so an agreement rate computed without excluding
    them is meaningless; the exclusion count must be printed beside every rate.
  - Over F_q with q small there are at most q specialization points, several of which are exceptional,
    so the specialized verdict vector is very short and its statistics are noisy; the record must
    report the vector length per table.
  - A collision in certificates could be an artifact of a coarse certificate hash rather than of genuinely
    equal certificates; certificates must be compared structurally, not by hash, before a collision
    is reported.
  - Realizability on both sides of a claimed collision must come from a source independent of the
    gate; using the gate to establish it would make the collision circular.
  - Specializing a table and specializing its discriminants are different operations that agree only
    at regular points; conflating them silently is the most likely source of a spurious contradictory
    cell, which is why the ring-homomorphism control exists.
  - Over Q there are infinitely many specialization points, so the specialized verdict vector is a
    sample rather than an enumeration, and its sampling rule is a choice that must be stated.
  interpretation_limits:
  - Only one of the four agreement cells is a contradiction. Generic nonsquare specializing to a square
    is expected behaviour and must never be reported as a disagreement or a defect.
  - A zero collision count is not evidence of identifiability; it is evidence that the search, at
    its stated size and over its stated family, found none. Reporting it as identifiability would
    be exactly the fatigue report docs/inventor-protocol.md section 4 forbids.
  - The quantifier table is a reading of a frozen text and is only as good as the sentences it quotes;
    it is not a proof about the mechanism.
  - Nothing here decides whether divisor parity obstructs PMA4. It decides whether the claim's quantifier
    structure is coherent and whether its observable identifies what it is claimed to identify, both
    within the tested scope.
  - Characteristic 2 is out of scope throughout, per RQ-PMA-001's constraints.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is one generic square-class certification plus
      at most q specialized square tests per table over F_q, and a stated sample of specialization
      points over Q.
    memory_exponent: No attack exponent is claimed. Memory is a certificate per table plus a verdict
      vector of length at most q.
    best_known: The incumbent is IDEA-20260726-012's own specialization prediction, which checks derivation
      fidelity against one frozen F_211 fixture whose supporting records H-PMA-001 records as absent
      from this repository. There is no other specialization analysis and no quantifier or collision
      audit anywhere in the repository to compare against.
    hidden_overhead: 'The quantifier table is cheap in compute and expensive in care: writing a quantifier
      string that faithfully reflects a frozen YAML block scalar, rather than a convenient paraphrase
      of it, is the whole difficulty, and a paraphrase that smuggles in a uniformity the text did
      not claim would manufacture a finding. The collision hunt hides a second cost: establishing
      realizability independently on both sides of a candidate collision is exactly the expensive
      existence problem this bucket otherwise avoids, so most candidate collisions will be unverifiable
      and must be reported as such rather than counted.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: no cryptanalytic
    quantity, no algorithm and no source-to-scalar candidate is produced, so no frontier row applies.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The internal comparison: the frozen
    design''s specialization evidence is a single fixture-fidelity check that cannot be loaded in
    this repository; this contract produces a grid-wide four-cell agreement table, a reverse-implication
    failure rate, and a quantifier audit, at a compute cost of seconds over a finite field. That is
    a coverage difference, not a performance comparison with any method.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A-B quantifier audit produces a checkable table: 0.9, because it
    is reading and writing with a fixed source text; the risk is that it produces a table with no
    forbidden dependence and therefore reads as empty, which is still the required section-8 audit
    but is a modest deliverable. Probability it finds an actual forbidden dependence: 0.3. Part D
    specialization agreement measured with zero contradictory cells: 0.8, since the compulsory direction
    is elementary; a nonzero count would most likely be an implementation defect and would be valuable
    precisely because it is findable. Part C collision hunt finding a verified collision with opposite
    realizability: 0.15 -- low, because verifying realizability on both sides is expensive and most
    candidates will be unverifiable, not because I think the certificate is identifying. Probability
    the hunt produces at least one UNVERIFIED candidate collision worth recording: 0.55. Part reverse-implication
    rate being measurable and stable: 0.7, with small-field vector lengths the main threat.'
