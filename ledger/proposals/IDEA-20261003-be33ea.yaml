# IDEA-20261003-be33ea
# Endomorphism rank count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-be33ea
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Supersingular endomorphisms have Z-rank 4 and ordinary ones have Z-rank 2
  class: measurement
  claim: >-
    Over an algebraic closure, a supersingular endomorphism ring has
    Z-rank 4 and an ordinary endomorphism ring has Z-rank 2. Four
    exceeds two by 2. The product of the two ranks is 8. Their sum
    is 6. The gap is a ring rank, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R3 is End(E) as a ring. The operation set is
    addition of endomorphisms, which makes the ring a Z-module.
    The two frozen ranks are the objects. No curve is enumerated
    and no endomorphism is computed. Two ordinary rings both have
    rank 2, so that gap is 0.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group lower bound is a different object from a ring rank.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two ranks are frozen before the subtraction.
    - No endomorphism ring is computed.
  proof_search_map:
    bottleneck: The rank gap 2.
    baseline_embedding:
      parameter_slice: The ranks 4 and 2.
      reproduction_check: >-
        Two readers subtract and must agree that 4 exceeds 2 by 2.
    observation_collision:
      observable: The rank gap and the product.
      distinct_preimage_search: >-
        Reporting both rings as rank 2 drops the gap. Two ordinary
        rings make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two frozen ranks.
        predicted_gain: Integer gap. No ring computation.
    quantifier_order: >-
      The ranks are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The rank gap 2. Not an attack.
      nearby_object_control: >-
        Two ordinary rings. Both have rank 2, and the gap is 0.
    proof_obligations:
      - claim: The supersingular rank in the frozen statement is 4.
        responsibility: size
      - claim: The ordinary rank in the frozen statement is 2.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: rank_gap
      direction: different
      minimum_effect: Four exceeds two by 2.
  minimal_test:
    design: >-
      Subtract the two frozen ranks. Do not compute an endomorphism ring.
    controls:
      - Two ordinary ranks, whose gap is 0.
      - An independent count.
    required_metrics:
      - both ranks
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 2.
    - The product of the two ranks is not 8.
  confounders:
    - Rational endomorphisms over the prime field can be a proper subring of the geometric endomorphism ring.
  interpretation_limits:
    - Rank is not runtime.
    - No transfer to a cryptographic curve.
    - This does not separate j=0 from j=1728.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen supersingular rank is 4 and the frozen ordinary
        rank is 2, both as Z-modules over an algebraic closure.
      rigorous_support: >-
        No Deuring theorem is re-proved here. The count is a reading
        of two frozen ranks.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: The base field can shrink the rational endomorphism ring.
    tradeoff_note: A larger rank is not a shorter walk.
