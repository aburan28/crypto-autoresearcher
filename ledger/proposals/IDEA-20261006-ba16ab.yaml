  dominated_by: >-
    Dominated as an algorithm by the archived Theorem 1.1 at
    p^{1/3+o(1)} time and memory. Compared with KR-RHO-13bf67
    (generic exponent 1/2, different problem) and KR-RHO-ea34b8
    (preprocessing, not a kernel count). No row measures I(d) at
    these four degrees on this model.
  sota_delta: >-
    Zero change to the 1/3 exponent. The numerical output is the
    minimum of four ratios I(d)/d against 1.
  proof_search_map:
