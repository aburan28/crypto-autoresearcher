idea:
  id: IDEA-20261006-ba16ab
  question_id: RQ-SSIQ-9702af
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The section 4.1 lower bound of d cyclic isogenies fails for some
    composite degree at most 9
  class: measurement
  claim: >-
    Let p = 47. Let E be the lexicographically first short-Weierstrass
    model over F_p whose j-invariant is supersingular and outside
    {0, 1728}. For each d in {4, 6, 8, 9}, let I(d) be the number of
    separable isogenies of degree d with cyclic kernel from E to any
    codomain, up to post-composition by an isomorphism. The claim is
    that the minimum of I(d)/d over those four degrees is strictly
    less than 1, that is, some d in the set has I(d) < d. A finished
    census with I(d) ≥ d for every such d is the concrete negative.
    The sentence under test is the archived Section 4.1 lower bound
    that the number of isogenies of degree d is at least d, restricted
    to these composite degrees. Prime degrees are the fence: the
    archived count ell+1 is at least ell, and they are not in the
    set. This is not a smoothness fraction of minimal conjugate
    degrees. The exponent stays p^{1/3+o(1)}. This record does not
    say that a p^{1/4} algorithm exists.
  mechanism: >-
    The tracked object is the integer I(d) for four composite
    degrees. Section 4.1 builds a table-size lower bound M = Ψ(X, B)*X
    from "the number of isogenies of degree d is at least d". Lemma
    3.2 gives an upper bound d*(log d + 2) instead. The representation
    is the cyclic kernel. The operation set is {compose on the left
    by an isomorphism}, which does not change the degree. Passing
    from the set of kernels to the integer I(d) is lossy. The priced
    number is the minimum of I(d)/d. If that minimum is below 1, the
    per-degree sentence in Section 4.1 is false at that d on this
    curve, which is a cost-model fact at one prime and not a new
    algorithm.
  novelty_status: unverified
  citations:
    - ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: retrieved
      claim: >-
        Section 4.1 says the number of isogenies of degree d is at
        least d, and sets M = Ψ(X, B)*X. Lemma 3.2 bounds the same
        count above by d*(log d + 2). Line 99 states ell+1 isogenies
        of prime degree ell. This idea tests the lower bound only at
        composite d.
      verified_by: >-
        design session opened
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, including lines
        99, 131-136, and 224-230, on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains a square-root exponent. A count
        I(d) below d does not change that exponent and is a different
        problem.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KN-TECH-055
      provenance: internal
      claim: >-
        The exemplar's memory is the list size. This idea asks
        whether one input to that size, the per-degree lower bound,
        holds at four composite degrees.
      verified_by: >-
        design session opened knowledge/techniques/KN-TECH-055.md
        on 2026-10-06
  assumptions:
    - >-
      p = 47 is rechecked by trial division up to 5, using 7^2 = 49.
      If 47 is not prime, the claim is not scored.
    - >-
      I(d) counts cyclic kernels only. The full d-torsion, when it is
      not cyclic, is not an element of I(d).
    - >-
      The four degrees are frozen. A later degree is a different test.
  predictions:
    - metric: minimum of I(d)/d over d in {4, 6, 8, 9}
      direction: lower
      minimum_effect: strictly less than 1
  minimal_test:
    design: >-
      Confirm 47 is prime and select the lex-first eligible
      supersingular model, skipping j in {0, 1728}. For each d in
      {4, 6, 8, 9}, count cyclic kernels of degree d via the modular
      polynomial and a cyclicity test. Record I(d). The claim holds
      when at least one I(d) is strictly less than d. Compare in
      integers. If no eligible model exists, do not score the claim.
    controls:
      - >-
        For the prime degree 2, the kernel count is 3. Any other
        count invalidates the enumerator. Degree 2 is not one of the
        four scored degrees.
      - >-
        For d = 4, the non-cyclic kernels, if any, are counted in a
        side column and are not added to I(4). Adding them voids the
        comparison.
      - >-
        Recompute 4, 6, 8, and 9 as composite by exhibiting a
        factorisation. If any of them is reported prime, the run is
        void.
    required_metrics:
      - I(4), I(6), I(8), I(9)
      - the minimum of I(d)/d
      - the degree-2 kernel count
  falsification_conditions:
    - >-
      I(d) ≥ d for every d in {4, 6, 8, 9}, on an eligible model,
      with the degree-2 count equal to 3. That finished minimum is
      the concrete negative.
    - No eligible supersingular model exists over F_47.
    - The degree-2 kernel count is not 3.
  confounders:
    - >-
      Counting non-cyclic kernels inside I(d) can push a true deficit
      up to d.
    - >-
      Counting two isomorphic post-compositions as two kernels
      inflates I(d).
    - >-
      A model with j in {0, 1728} has extra automorphisms. The
      selection rule excludes those j-invariants so the count is not
      an automorphism artefact of those two j's.
  interpretation_limits:
    - >-
      One composite d with I(d) < d, on one curve at p = 47, says the
      Section 4.1 sentence is false at that d. It does not replace
      M = Ψ(X, B)*X in the asymptotic, and it does not move the
      exponent.
    - >-
      I(d) ≥ d for all four degrees does not prove the sentence for
      every degree or every curve.
    - >-
      The upper bound in Lemma 3.2 is not the quantity under test.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Section 4.1 treats "at least d" as a uniform lower bound in
        d. The test asks whether that bound survives at four
        composite degrees on one supersingular curve. No Dickman
        probability is used.
      rigorous_support: >-
        Lemma 3.2 is an upper bound. The ell+1 count for prime ell
        is the degree-2 control. Neither result asserts I(d) ≥ d for
        composite d.
      validation_plan: >-
        The quantities are I(4), I(6), I(8), and I(9) on the selected
        model. The comparison is each I(d) against d. The tail check
        is the degree-2 count against 3. Transfer assumption: none.
  target_complexity:
    time_exponent: >-
      unchanged at p^{1/3+o(1)} under Heuristic 1. A lower bound that
      fails at one d is not a faster algorithm.
    memory_exponent: >-
      unchanged at p^{1/3+o(1)}. The toy count stores one kernel
      record per degree.
    best_known: >-
      Archived Theorem 1.1 for the supersingular endomorphism search.
      The Section 4.1 table size is a lower-bound estimate inside
      that algorithm, not a second algorithm.
    hidden_overhead: >-
      Section 4.1 already labels its one-operation-per-entry figure
      as an under-estimate. This idea does not reprice that figure.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. The output is four
      integers.
  estimated_cost:
    implementation: small
    compute: small
  recommended_priority: medium
