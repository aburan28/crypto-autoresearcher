idea:
  id: IDEA-20261006-9d9d22
  question_id: RQ-SSI-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    The smallest prime self-isogeny degree in {2, 3, 5, 7, 11} differs
    for the two lexicographically smallest supersingular j-invariants
    in F_{43^2}.
  class: measurement
  claim: >-
    Let F_{43^2} = F_43[α]/(α^2 - d) with d the smallest positive
    quadratic nonresidue modulo 43. Order elements a + b α by b, then
    a, with a, b in 0..42. Let j1 and j2 be the first two supersingular
    j-invariants in that order, tested by the trace of Frobenius of one
    short-Weierstrass model being divisible by 43. For a supersingular
    j and for ℓ in {2, 3, 5, 7, 11}, say that ℓ occurs at j when some
    cyclic kernel of order ℓ has Vélu codomain of the same j. Let λ(j)
    be the smallest occurring ℓ, or 0 if none of the five occur. The
    claim is λ(j1) ≠ λ(j2). This is a pair of bounded endomorphism-degree
    probes. It does not compute a maximal order, it does not run a
    quaternion path algorithm, and the exponent delta against the opened
    Õ(p^{1/4}) baseline is 0.
  mechanism: >-
    Equality of λ(j1) and λ(j2) means these two vertices are not
    separated by the smallest prime, inside a five-prime cap, at which
    a self-isogeny exists. Inequality means the cap sees different
    smallest primes. Either outcome is a toy gate on the endomorphism
    data that the opened Deuring note identifies with the hard ring.
    Neither outcome produces a connecting ideal.
    OBJECT FRAME. Representation: the j-invariant in F_{43^2}.
    Operation set Sigma: cyclic isogenies of degree ℓ for ℓ in
    {2, 3, 5, 7, 11} that return to the same j, i.e. loops of those
    degrees. Sigma is not translation on a prime-order subgroup.
    TRICHOTOMY: partial-action. Reason: Sigma tests only self-isogenies
    of five prime degrees and does not include isogenies to a different
    j. LOSSY-PROJECTION TEST against Sigma. Discarded: the kernel
    polynomials, the endomorphism ring, and every non-loop neighbor.
    Retained: one integer λ(j) in {0, 2, 3, 5, 7, 11}. Many rings can
    share one smallest loop prime, so the projection is lossy.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-028
      provenance: internal
      claim: >-
        The opened note states the Deuring dictionary between
        supersingular curves over F_{p^2} and maximal orders, and it
        states that KLPT finds an equivalent ell-power ideal in
        heuristic polynomial time once a connecting ideal is given.
        It gives no loop primes at p = 43.
      verified_by: idea-generator, this session, via knowledge/techniques/KN-TECH-028.md
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states that the supersingular ell-isogeny
        graph is (ell+1)-regular and that endpoint j-invariants leak
        no torsion data. A loop is an edge case of that graph. The
        note has no table of loops at p = 43.
      verified_by: idea-generator, this session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note says endomorphism-ring computation and
        isogeny path-finding are equivalent under GRH, and it reports
        no sub-p^{1/4} generic attack. This idea computes neither.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-013.md
  assumptions:
    - p = 43 is prime. The test checks that.
    - A j in F_{43^2} is supersingular when one short-Weierstrass model of that j has F_{43^2}-Frobenius trace divisible by 43.
    - For j not in {0, 1728}, the model is y^2 = x^3 + 3 k x + 2 k with k = j / (1728 - j). For j = 0 the model is y^2 = x^3 + 1. For j = 1728 the model is y^2 = x^3 + x. The rebuilt j must equal the input j.
    - λ uses only the five primes 2, 3, 5, 7, 11. A self-isogeny of some other degree is invisible and yields 0 if none of the five occur.
  predictions:
    - metric: absolute difference |λ(j1) - λ(j2)|
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Build F_{43^2} with the smallest positive quadratic nonresidue
      d modulo 43. Scan j = a + b α in order of b, then a. Keep the
      first two j that pass the trace test, as j1 and j2. If fewer
      than two exist, stop. For each kept j and for ℓ from the ordered
      list 2, 3, 5, 7, 11, compute the ℓ-division polynomial of the
      model over F_{43^2}, adjoin one root for each irreducible factor
      that can be an x-coordinate of a cyclic kernel of order ℓ, apply
      Vélu, and test whether the codomain j equals the source j. Set
      λ(j) to the smallest ℓ that passes, else 0. The division
      polynomial is used only to produce kernel x-coordinates. Record
      λ, not a root. Do not build a quaternion order.
    controls:
      - The model rebuilt from j has that same j. A mismatch invalidates λ for that vertex.
      - Two short-Weierstrass models of the same j, when a second model exists, yield the same λ.
      - Each accepted kernel has order ℓ, and the dual isogeny restores the source j. A failure invalidates that ℓ.
      - An ordinary j, the smallest a + b α that fails the trace test, is not assigned a λ. It only checks that the trace test can reject.
    required_metrics:
      - quadratic_nonresidue_d
      - supersingular_count_seen_before_j2
      - j1
      - j2
      - lambda_j1
      - lambda_j2
  falsification_conditions:
    - λ(j1) equals λ(j2), including the pair (0, 0).
    - Fewer than two supersingular j-invariants exist in F_{43^2}.
    - A rebuilt model does not reproduce its input j.
    - A kernel accepted as order ℓ fails the dual restoration check.
  confounders:
    - The cap {2, 3, 5, 7, 11} maps every other self-isogeny degree to 0. A shared 0 falsifies the inequality inside the cap and does not assert that the endomorphism rings are equal.
    - Twists and automorphisms do not change j. A self-isogeny up to automorphism counts as a loop. That is the graph definition used here.
    - Testing primes out of order, or skipping ℓ = 2, can change the minimum. The list order is fixed.
  interpretation_limits:
    - Two vertices at p = 43, five primes. No transfer to a SQIsign parameter set.
    - Equality inside the cap removes this separation for this pair. It does not say the endomorphism-ring problem is easy or hard.
    - Inequality is a difference of two integers in {0, 2, 3, 5, 7, 11}. It is not KLPT and it is not a path.
    - Exponent delta against Õ(p^{1/4}) is 0. KLPT's heuristic polynomial time, as stated in the opened note, applies only once a connecting ideal is already known. This test does not produce one.
    - Toy-only, as RQ-SSI-001 requires at this size.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p = 43, λ(j) for a supersingular j imitates the smallest
        prime norm of a non-scalar endomorphism, restricted to the
        set {2, 3, 5, 7, 11}, with 0 meaning the set misses. The
        imitation is not a theorem. The sample is two vertices and
        five primes. No transfer to another prime is claimed.
      rigorous_support: >-
        KN-TECH-028, opened, identifies the endomorphism ring with a
        maximal order under the Deuring correspondence, and KN-TECH-024,
        opened, makes self-isogenies edges of the isogeny graph. Neither
        note computes λ at p = 43. The test uses the observed Vélu
        codomain j-invariants.
      validation_plan: >-
        Compute λ(j1) and λ(j2) once. The consistency checks are
        reproduction of j by the model, agreement of λ across two
        models, order-ℓ verification, and dual restoration. Sample
        size two vertices has no distributional tail. No second prime
        is drawn.
  target_complexity:
    time_exponent: >-
      One scan of the 43^2 field elements for the trace test, then at
      most ten kernel searches for division polynomials of degree
      (ℓ^2 - 1)/2 with ℓ ≤ 11. Polynomial in the fixed p. No
      quaternion path search is run.
    memory_exponent: >-
      One extension of degree at most (ℓ^2 - 1)/2 over F_{43^2} per
      kernel, for ℓ ≤ 11. No p^{1/2}-sized table is stored.
    best_known: >-
      KN-LIT-078 via the opened KN-TECH-024 note: Õ(p^{1/2}) classically
      on the full graph and Õ(p^{1/4}) on the F_p subgraph. KLPT, in
      the opened KN-TECH-028 note, is heuristic polynomial time given
      a connecting ideal. None of these is claimed.
    hidden_overhead: >-
      No o(1) term. The field F_{43^2} and the prime cap 11 are
      explicit. The output is two integers in {0, 2, 3, 5, 7, 11}.
    tradeoff_note: >-
      No time-memory tradeoff, no ideal enumeration, and no parallel
      collision search. Two vertices.
