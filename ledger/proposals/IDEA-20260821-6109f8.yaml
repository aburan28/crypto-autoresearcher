idea:
  id: IDEA-20260821-6109f8
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-21'
  title: >-
    An ML-DSA signature hands the public an EXACT bounded-noise linear
    observation of t0 - u_j = (c t0)_j + r0_j with |r0_j| < gamma2 - beta, and
    the noise bound is tightened by the signer's own Line-23 rejection - so t0
    recovery is set-membership identification, whose error falls like 1/N and
    not like 1/sqrt(N); target 3e4 to 1.2e5 signatures against the published
    2e5 to 5e5, with a held-out-consistency certificate that needs no secret
  class: algorithm

  claim: >-
    (A) THE OBSERVATION MODEL, DERIVED NOT ASSUMED. For a valid ML-DSA
    signature the public can compute, for every one of the 256k coefficient
    positions j, the integer
        u_j := (A z - c t1 2^d)_j - w1'_j * 2 gamma2
    where w1' = UseHint(h, A z - c t1 2^d) is exactly what FIPS 204 Algorithm 8
    already computes. Substituting z = y + <<c s1>>, t = A s1 + s2 and
    t1 2^d = t - t0 gives A z - c t1 2^d = r + <<c t0>> with r := w - <<c s2>>,
    and the signer's own Line-23 check ||LowBits(w - c s2)||_inf < gamma2 -
    beta forces HighBits(r) = HighBits(w) = w1, so w1' = HighBits(r) and
        u_j = (c t0)_j + r0_j,  r0_j = LowBits(r)_j,  |r0_j| < gamma2 - beta.
    THIS IS AN EXACT IDENTITY, not a statistical statement: each signature
    yields 256k linear observations of t0 with KNOWN coefficients (the tau
    signed negacyclic shifts selected by c) and additive noise of KNOWN BOUNDED
    SUPPORT. The corpus does not contain it; IDEA-20260805-630606 derives that
    the hint is the only t0-bearing component and bounds its ENTROPY, which is
    a capacity statement about a channel whose actual output this identity
    writes down.

    (B) THE CONSEQUENCE THAT DECIDES THE COST. For additive noise with bounded
    support, the maximum-likelihood estimator is not a mean, it is the FEASIBLE
    SET - the polytope P_N = {x : |u_j^(i) - (c^(i) x)_j| < W for all i, j},
    W := gamma2 - beta - and its diameter shrinks like 1/N, whereas any
    averaging or least-squares estimator shrinks like 1/sqrt(N). GENERATOR-
    COMPUTED, OUTSIDE THE HARNESS, NO RUN RECORD, RE-DERIVATION REQUIRED, from
    FIPS 204 Table 1 with sigma_r0 = W/sqrt(3): the averaging estimator needs
    N = 4 sigma_r0^2 / tau = 3.10e8 / 1.86e9 / 1.52e9 signatures at ML-DSA-44 /
    -65 / -87 to reach per-coefficient error below 1/2, while the set-
    membership estimator needs N = Theta(W / (sqrt(tau) * epsilon)) with
    epsilon = 1/2, i.e. N in the band 3.0e4 to 1.2e5 at ML-DSA-44, 7.5e4 to
    3.0e5 at -65 and 6.8e4 to 2.7e5 at -87, the band width being an honest
    statement that the leading constant of the 1/N law is not pinned by this
    derivation.

    (C) THE FALSIFIABLE CLAIM. A set-membership decoder (interval constraint
    propagation, then a Chebyshev-centre linear program on the active
    constraints) recovers t0 EXACTLY at ML-DSA-44 from at most 1.2e5
    signatures, certified two ways, and the measured error-versus-N curve has
    log-log slope -1.0 +/- 0.15 rather than -0.5. The comparator is the
    relayed published figure of 200,000 to 500,000 signatures (eprint
    2024/1373, abstract page read this session, full text NOT read). If the
    decoder needs at least 2e5 the published figure is already at the geometry's
    limit and the honest deliverable is the confirmation plus the measured
    slope; if the slope is -0.5 the whole 1/N premise is wrong and the
    bounded-noise reading of the model is refuted.

    (D) THE TWO CERTIFICATES, ONE OF WHICH NEEDS NO SECRET. Ground truth:
    compare the recovered t0 coefficient-by-coefficient against the true t0
    from the keypair (RQ-MLDSA-ffa0f5's certificate-first requirement).
    Public: on a HELD-OUT block of signatures never used by the decoder, check
    that every one of the 256k residuals u_j - (c t0_hat)_j lies in (-W, W).
    A wrong t0 fails this at a rate that is computable in advance, so the
    public certificate is a real check and not a tautology.

    NOT A BREAK AND NOT A KEY RECOVERY. FIPS 204 declares t0 need not be
    regarded as secret and the security argument treats it as public; this
    proposal makes the standard's own sentence quantitative and says nothing
    about MLWE, MSIS or SelfTargetMSIS in any direction. It runs no lattice
    reduction and estimates no hardness parameter; a batch that finds itself
    doing either has crossed into RQ-MLDSA-001 and must hand off.

  mechanism: >-
    (1) WHERE THE IDENTITY COMES FROM, STEP BY STEP. FIPS 204 Algorithm 7 sets
    w = A y, w1 = HighBits(w), c~ = H(mu || w1Encode(w1)), z = y + <<c s1>>,
    and rejects unless ||LowBits(w - <<c s2>>)||_inf < gamma2 - beta. That last
    check is exactly what makes HighBits(w - <<c s2>>) = HighBits(w), because
    ||<<c s2>>||_inf <= beta. Algorithm 8 computes w'Approx = A z - c t1 2^d,
    which the algebra in claim (A) shows equals (w - <<c s2>>) + <<c t0>>, and
    accepts only if UseHint(h, w'Approx) hashes to c~ - i.e. only if the
    verifier's reconstruction equals the signer's w1. So for every ACCEPTED
    signature the public simultaneously knows the exact integer w'Approx_j and
    the exact high part of the unknown r_j. Subtracting recovers u_j. NOTE THE
    DIRECTION OF THE LINK BETWEEN THIS GOAL'S TWO OBJECTS: the signing-only
    Line-23 rejection is what narrows the noise support from 2 gamma2 to
    2(gamma2 - beta). A signer that omitted that check would leak LESS per
    signature, by a factor (gamma2)/(gamma2 - beta) in noise width. That is a
    small effect (0.08% at ML-DSA-44) but it is signed, derived in advance, and
    it is the only place in this lane where the two objects of
    RQ-MLDSA-ffa0f5 touch quantitatively.

    (2) WHY THE NOISE IS THE RIGHT SHAPE. r0 = LowBits(w - <<c s2>>) with w =
    A y and y fresh per attempt, so r0 is independent of t0 given c; and
    rejection sampling conditions it to the range (-(gamma2 - beta),
    gamma2 - beta). The classical rejection-sampling argument says the accepted
    r0 is (close to) uniform on that range. Uniform bounded noise is precisely
    the regime where the MLE is the feasible set and where the estimator's
    convergence rate is superefficient - the same phenomenon that makes the
    minimum of n uniform samples converge at rate 1/n rather than 1/sqrt(n).

    (3) WHY AVERAGING IS THE WRONG DECODER, WITH NUMBERS. Let c* denote the
    conjugate c(X^-1). Then E[c* c] = tau, so t0_hat = (1/(N tau)) sum_i c_i* u_i
    is unbiased with per-coefficient standard deviation sigma_r0 / sqrt(N tau),
    plus a self-interference term of size sigma_t0 / sqrt(N tau) which is
    smaller by sigma_r0/sigma_t0 = 23.2 at ML-DSA-44 and is therefore
    negligible. GENERATOR-COMPUTED: W = gamma2 - beta = 95154 / 261692 /
    261768; sigma_r0 = W/sqrt(3) = 54937.5 / 151088.6 / 151132.5; exact
    recovery needs sigma_r0/sqrt(N tau) < 1/2, i.e. N > 4 sigma_r0^2 / tau =
    3.0955e8 / 1.8635e9 / 1.5227e9. So plain averaging is three to four orders
    of magnitude WORSE than the published attack - which is itself a finding,
    because it means the published attack is already exploiting the bounded
    support in some form and the interesting question is how much of it.

    (4) THE DECODER, AS A THREE-RUNG LADDER, CHEAPEST FIRST. RUNG A (baseline,
    must be run): the averaging estimator above, whose error curve is a
    PREDICTED 1/sqrt(N) with a closed-form constant; it is the matched
    baseline every later rung is scored against. RUNG B (interval constraint
    propagation): maintain a box [lo, hi] containing t0; for each observation
    u_j with support set S_j (the tau signed shifts selected by c), tighten
    each coordinate by subtracting the current interval sums of the other
    tau - 1 terms. Cost O(tau) per observation, i.e. N * 256k * tau = 1.2e9
    integer operations per sweep at N = 3e4 and ML-DSA-44 - seconds per sweep
    in vectorised code, streaming, memory O(256k). RUNG C (Chebyshev centre):
    collect the constraints still active after rung B - a small fraction, since
    only near-boundary observations bind - and solve the linear program
    max{eps : |u - (c x)_j| <= W - eps} on that reduced system, then round.
    RUNG C is where the 1/N rate is actually realised; rung B is what makes
    rung C's constraint set small enough to solve.

    (5) WHAT SEPARATES THE TWO HYPOTHESES, AND THIS IS THE POINT OF THE
    DESIGN. E1 - THE GAP IS INTRINSIC: the published 2e5 to 5e5 is where the
    geometry puts the recovery threshold, the measured slope is -1.0, and the
    decoder lands at 2e5 or above. E2 - THE GAP IS SLACK: the decoder lands
    near 3e4 to 1e5, the slope is -1.0, and the published figure is a property
    of one algorithm rather than of the problem. E3 - THE MODEL IS WRONG: the
    slope is -0.5, meaning the effective noise is not bounded-support-uniform
    in the way (2) claims, most plausibly because the accepted r0's law is not
    uniform on the truncated range or because the special top cell of Decompose
    breaks the identity on a non-negligible fraction of coefficients. These
    three are distinguished by ONE curve, measured on ONE run, and the curve is
    cheap at small N.

    (6) HOW MUCH INFORMATION IS ACTUALLY THERE, AS A TARGET RATHER THAN A
    FLOOR. GENERATOR-COMPUTED: treating (c t0)_j as approximately Gaussian by
    the central limit theorem over its tau terms, with variance tau * 2^(2d)/12,
    against noise variance W^2/3, the per-coefficient signal-to-noise ratio is
    0.0723 / 0.0120 / 0.0147 and the Shannon lower bound (1/2)log2(1 + SNR)
    gives at least 0.0503 / 0.0086 / 0.0105 bits per coefficient, i.e. at least
    51.5 / 13.2 / 21.5 bits per signature. Since H(t0) <= 256 k d = 13312 /
    19968 / 26624 bits, roughly 259 / 1510 / 1236 signatures already carry as
    much information as t0 contains. THIS IS A SUFFICIENCY COUNT, NOT A FLOOR -
    the true floor is IDEA-20260805-630606's 34 / 60 / 58, and information
    sufficiency does not imply a decoder exists. It is recorded because it says
    where the ceiling of this line of work is: even a perfect set-membership
    decoder at 3e4 signatures would sit two orders of magnitude above the point
    where the information runs out, and naming that residual gap is more useful
    than pretending it is closed.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP INDEX WAS UNAVAILABLE (in-memory Qdrant per the
      operating brief); it was not called and nothing is attributed to it.
      GREPS RUN, WITH COUNTS: (i) -i "linear program|polytope|bounded noise|
      bounded-noise|Chebyshev center" over ledger/ -> 54 files, NONE of them
      any of the five RQ-MLDSA-ffa0f5 proposals and none in area MLDSA at all
      (the hits are ECDLP, multivariate and BKK records); (ii) -i "bit-plane|
      bit plane|per-key dispersion|ACVP|interoperab" over the repository
      (*.yaml, *.md) -> 39 files, none under RQ-MLDSA-ffa0f5; (iii) "MLDSA"
      over ledger/hypotheses -> 8 files, two under this question.
      READ IN FULL: RQ-MLDSA-ffa0f5, GOAL-MLDSA-002, the lane's 5-row proposal
      inventory, IDEA-20260805-bb52fa, IDEA-20260805-630606; read in large part
      IDEA-20260805-031ce2, IDEA-20260808-4f83f6, IDEA-20260808-e5f947.
      WEB QUERIES RUN (6): S1 '"Uncompressing Dilithium''s public key" eprint
      2024/1373 t0 recovery signatures' (8 links); S2 'Dilithium t0 recovery
      from signatures hint bits linear programming bounded noise' (8 links);
      S3 'Azevedo Oliveira Calle Viera Cogliati Goubin "Uncompressing
      Dilithium" method recover t0 maximum likelihood distribution hint' (10
      links); S4 ACVP ML-DSA sigVer test vectors (9 links); S5 'Dilithium t0
      recovery "least significant" bits harder more signatures per bit plane
      precision estimator' (8 links); S6 ML-DSA differential testing /
      conformance (10 links).
      FETCHED AND READ (LANDING/ABSTRACT PAGES ONLY): eprint.iacr.org/2024/1373,
      eprint.iacr.org/2024/2046, eprint.iacr.org/2025/195,
      eprint.iacr.org/2026/1333.
      FETCH FAILURES RECORDED AS FAILURES: eprint.iacr.org/2024/1373.pdf and
      eprint.iacr.org/2025/195.pdf both returned binary the fetch tool could
      not parse; link.springer.com/chapter/10.1007/978-3-032-01855-7_14
      returned 303 to an authentication endpoint. THE METHOD OF THE PUBLISHED
      t0 ATTACK IS THEREFORE UNKNOWN TO THIS SESSION.
    results: >-
      IN-CORPUS: no record contains the identity u_j = (c t0)_j + r0_j, no
      record contains an estimator for t0, and no record contains a
      convergence-rate claim of any kind. IDEA-20260805-630606 is the nearest:
      it proves h is the sole t0-bearing component and bounds H(h) by
      log2 sum_{i<=omega} C(256k, i) = 400.7 / 338.0 / 459.7 bits, giving the
      floors 34 / 60 / 58, and it explicitly names "whether the factor 10^3 to
      10^4 is intrinsic to that structure or is slack in the published
      algorithm" as the open question it creates and does not answer. This
      proposal is the direct successor to that sentence.
      EXTERNAL, AND THIS IS THE PART THAT SHOULD WORRY A REVIEWER: the same
      four authors as the t0 paper (Azevedo-Oliveira, Calle Viera, Cogliati,
      Goubin) published "Finding a polytope: A practical fault attack against
      Dilithium" (eprint 2025/195, PKC 2025), whose title alone establishes
      that they use polytope methods on Dilithium. It is therefore LIKELY that
      eprint 2024/1373 already uses a set-membership or polytope decoder, in
      which case this proposal's (B) and (C) are a reproduction rather than an
      improvement. This session could not read either full text to check, and
      that is why the first gate of the minimal test is acquisition, not
      compute.
    verdict: >-
      UNVERIFIED, and honestly at risk of being an ADAPTATION of published
      work. What is claimed as new relative to this corpus with confidence: the
      exact observation identity, its derivation from the Line-23 check, the
      1/N-versus-1/sqrt(N) discriminator, the closed-form averaging baseline
      3.10e8 / 1.86e9 / 1.52e9, the information-sufficiency counts 259 / 1510 /
      1236, and the secret-free held-out certificate. What is standard
      machinery and is not claimed as invention: set-membership identification,
      interval constraint propagation, Chebyshev centres, and the fact that
      bounded noise gives 1/N rates.

  object_first_candidate:
    tracked_object: >-
      THE FEASIBLE POLYTOPE P_N ⊂ R^{256k} of t0 candidates consistent with the
      first N transcripts - tracked as it shrinks, by its per-coordinate
      diameter, signature by signature. Not the signature, not the hint, not a
      statistic: the SET OF SURVIVING SECRETS. Established families declared
      off-limits as the primary lens: lattice reduction and BKZ-style estimator
      work of every kind (RQ-MLDSA-001 owns assumption estimation and this
      proposal must not drift into it); fault injection and physical side
      channels; nonce misuse and the HNP family; forgery search. Set-membership
      identification and interval arithmetic are the lens, and neither is an
      attack family.
    lossiness: >-
      GENUINELY LOSSY AND THE LOSS IS DERIVED, NOT ASSUMED. The projection
      sends a full signature (2420 to 4627 bytes) plus the public key to 256k
      integers u_j. What is discarded: c~ and z entirely, and the hint's
      positional detail after UseHint has been applied. That discard is
      COMPATIBLE with the target's operations because IDEA-20260805-630606
      establishes that c~ and z are functionally independent of t0 given the
      public key, so nothing about the tracked object is thrown away - the rare
      case where a lossy projection is provably SUFFICIENT for its target. It
      is emphatically NOT a change of coordinates: u determines neither z nor
      c~ nor the message, and the fibre over a given u is the whole space of
      (y, s1) consistent with it. THE MIRROR FAILURE - a projection constant
      across instances - does not occur: u varies with every signature and its
      spread is sigma_r0 = 54937.5 at ML-DSA-44, a pre-registered nonzero
      comparator spread.
    propagation: >-
      One step of the target operation is one signature, and its one-step
      propagation law is exact and measurable: P_{N+1} = P_N intersected with
      256k slabs of half-width W in directions given by the tau signed shifts
      of c. The measurable one-step quantity is the shrinkage of the box
      diameter per signature, which the design records as a curve rather than
      as an endpoint - so the object's behaviour is observed at every N, not
      only at the N where recovery succeeds or fails.
    survival_score: >-
      Survives the entire computation and is exactly the object the answer
      lives in - the polytope's collapse to a single integer point IS the
      recovery. It dissolves in one identified place: at the special top cell
      of FIPS 204's Decompose (where r+ - r0 = q - 1 forces r1 = 0 and
      r0 = r0 - 1), the relation r = w1 * 2 gamma2 + r0 fails and the slab for
      that coefficient is misplaced. The design measures the frequency of that
      cell rather than assuming it negligible, and drops the affected
      coefficients, because a single wrong slab makes the polytope EMPTY and
      turns a working decoder into a silent failure.

  null_object_control: >-
    NULL-1, THE ONE THE RQ MANDATES, AND ITS LIMITATION STATED PLAINLY:
    re-run the identical decoder against a transcript stream generated with t0
    resampled independently of the key. Its forced value is that recovery of
    the TRUE t0 fails and the residual distribution is that of an unrelated
    vector. UNDER KN-TECH-1a5b7e THIS ARM CANNOT FAIL AS A TEST OF THE LEAK -
    the answer is zero by construction - so it is run and reported as what it
    actually is: a test of the ESTIMATOR and the plumbing, able to catch a
    decoder that has been accidentally handed the true t0, and nothing more. It
    is not evidence about the leak and is never cited as such.
    NULL-2, THE ARM THAT CAN ACTUALLY FAIL AND THE ONE THE VERDICT RESTS ON:
    the HELD-OUT CONSISTENCY test. Take the decoder's output t0_hat, and on M
    signatures never seen by the decoder, count the residuals u_j - (c t0_hat)_j
    falling outside (-W, W). The forced value under a correct recovery is
    exactly 0 out of 256k*M; the forced value under a wrong recovery is
    derivable in advance from the residual's law and is a large fraction. This
    arm can fail, its two forced values are separated by orders of magnitude,
    and it uses no secret at all.
    NULL-3, GRADED, FOUR INTERIOR POINTS, MONOTONICITY REPORTED: corrupt a
    fraction f of t0's coefficients, f in {0, 0.05, 0.2, 0.5, 1}, and measure
    the held-out violation count. It must rise monotonically in f and the run
    must report whether it does; a non-monotone response means the certificate
    cannot be read directionally.
    NULL-4, THE COMPARATOR IS GENERATED SO IT NEEDS A SAMPLE SIZE (mode 5):
    the averaging baseline's error curve is itself a random quantity; draw it
    at least 8 times with independent seeds and report the interval, never a
    single curve, before any slope comparison is made.
    VERDICT-ON-THE-NULL-FIRST: the slope-estimation rule is executed and its
    verdict committed on the independently-resampled-t0 arm before the real arm
    is examined.

  discriminated_from:
    - >-
      IDEA-20260805-630606 bounds the hint's ENTROPY and derives the
      unconditional floors 34 / 60 / 58 and the conditional 39 / 77 / 71. It
      computes a bound on any decoder; this builds one. Its own record names
      the intrinsic-versus-slack question as the successor it does not answer,
      and this is that successor. The two also disagree usefully: this
      proposal's information-sufficiency count (259 / 1510 / 1236) is 4 to 25
      times LARGER than 630606's capacity floor, because capacity over-counts
      what a threshold channel with unknown offsets actually delivers, and
      reconciling the two numbers is an explicit deliverable.
    - >-
      IDEA-20260805-bb52fa computes the reachability envelope of the ct0
      predicate. Different object (an envelope, not a polytope), different
      target (a rejection rate, not t0), and its H1 is not used here - the
      noise law that matters in this proposal is r0's, not t0's.
    - >-
      IDEA-20260808-4f83f6 measures a t0-induced deviation in the accepted
      CHALLENGE law and states up front that it is "LIKELY DOMINATED" by the
      hint route on signature count. This proposal IS that hint route, made
      exact, and it supplies the number against which 4f83f6's channel should
      be scored.
    - >-
      IDEA-20260805-031ce2 and IDEA-20260808-e5f947 concern what the verifier
      accepts. Nothing here changes a verifier or mutates a signature; every
      transcript is emitted by a conforming signer and verifies.
    - >-
      IDEA-20260821-65739b (this batch) measures the per-BIT-PLANE price of t0
      using the same observation identity but the AVERAGING estimator only, and
      is a cheap, hour-scale test of that identity. It is deliberately the
      cheap sibling: it does not build a set-membership decoder and cannot
      recover t0, and this proposal should not be started before its identity
      check has passed.
    - >-
      IDEA-20260821-60ba98 (this batch) bounds what a NON-CONFORMING signer
      leaks. This proposal studies what a CONFORMING signer leaks, which is the
      standard's own claim, and the two share no statistic.

