idea:
  id: IDEA-20260906-476f20
  title: >-
    F_{p^2}-twist coset representation: E(F_{p^2}) = G (+) G' with G' the twist
    points, the coset P + G' is a block system of translation by G' and of
    Frobenius (a genuine partial action) but is injective on G, and every
    decomposition of a target in G over a subfield-cut factor base is a
    G-decomposition padded by cancelling twist pairs -- a forced yield-and-rank
    value that closes the Weil-restriction R3 class on prime-order curves with the
    E3 cost bound
  class: control
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  added: '2026-09-06'
  proposed_at: '2026-09-06'
  proposed_by: idea-generator
  claim: >-
    REPRESENTATION CLASS R3 (Weil restriction and F_{p^2}-twist decompositions).
    ATTACK STAGES examined: factor-base membership (a subfield condition on the
    coordinate) and relation decomposition (Semaev over F_{p^2} with Weil
    restriction). NON-GENERIC OPERATION it makes cheap: testing whether a point
    of E(F_{p^2}) has x-coordinate in F_p, i.e. Gaudry's extension-field factor
    base -- which reads the coordinate and is unavailable to a black-box encoding;
    the record's content is that on a prime-order target this operation buys
    exactly nothing, by a forced value.
    (A) THE DECOMPOSITION OF THE AMBIENT GROUP. E/F_p with #E(F_p) = N prime,
    E' the quadratic twist with N' = 2p + 2 - N, gcd(N, N') = 1 generically. Then
    #E(F_{p^2}) = N N' and E(F_{p^2}) = G (+) G' with G = E(F_p) and G' = {T :
    pi(T) = -T} the image of E'(F_p), G intersect G' = E(F_p)[2] = 0. The
    projection E(F_{p^2}) -> G along G' is lossy on the ambient group (log_2 N'
    bits), its fibres are the cosets of G', and it propagates deterministically
    under Sigma = {translation by G'} union {Frobenius pi} because both preserve
    cosets -- a block system of a proper sub-action, Class I of
    IDEA-20260806-c5d183. On the embedded G it is the identity: a change of
    coordinates, so it is NOT returned as a lossy object of G.
    (B) THE FACTOR BASE AND THE PADDING TAUTOLOGY. A point S of E(F_{p^2}) has
    x(S) in F_p iff S in G union G' (y^2 = f(x) in F_p forces y in F_p or in
    sqrt(nonresidue) F_p). So Gaudry's subfield factor base is G union G' and a
    windowed version is F_W = (G intersect x^(-1)(W)) union (G' intersect
    x^(-1)(W)) for W a subset of F_p. FORCED VALUE: for a target R in G, every
    arity-m decomposition R = S_1 + ... + S_m over F_W has G'-components summing
    to zero, and since the G'-part of F_W is symmetric under negation (x is even)
    the decompositions of R over F_W are exactly the arity-(m - 2j)
    decompositions of R over the G-part, padded by j cancelling pairs {T, -T}
    from the G'-part, for j = 0, ..., floor(m/2), plus the G'-relations among
    twist points that sum to zero, which say nothing about R. The relation matrix
    projected to the G-part has the same rank as the G-only relation matrix.
    (C) COST. The ambient index calculus is Gaudry's n = 2 extension-field
    algorithm at O~(p^(2 - 2/2)) = O~(p) on a group of order p^2, i.e. exit class
    E3 of IDEA-20260727-005 at O~(p^(2 - 2/g)) >= p^1 for g = 2, against rho at
    p^(1/2) on the target G; dominated by a factor p^(1/2) before the tautology
    is even counted. The trace map E(F_{p^k}) -> E(F_p) for k > 2 has fibres
    that are cosets of the trace-zero subvariety of order about p^(k-1); a base
    pushed forward by trace has implicit membership requiring a search of that
    size and is scoped out with that charge.
    (D) THE TWO OUTCOMES. FORCED: measured decomposition counts and projected
    rank match (B) exactly on every toy cell, and the R3 Weil-restriction class
    is closed with the padding mechanism and the E3 bound. FALSIFIER: a target in
    G with a decomposition over F_W whose G'-components do not cancel pairwise
    as described, or a projected rank exceeding the G-only rank -- either would
    mean the twist part carries information about G, contradicting
    G intersect G' = 0, and would be the record's most valuable outcome.
  mechanism: >-
    THE PAIR. Representation: the point P in G written as the coset P + G' in
    E(F_{p^2}), or as any representative P + T; the factor base cut by the
    subfield condition x in F_p (or x in a window W in F_p). Operation set
    Sigma: translation by G' and the Frobenius pi, a proper sub-action of the
    ambient translation group; NOT the full translation action of E(F_{p^2}),
    and not the full translation action of G either. Trichotomy: Class I,
    partial-action, one-line reason: the coset partition is a block system of
    <Sigma> and of nothing larger. As an object of G it is injective and
    therefore has no class; the record says so. F2 is used as a component
    (factor-base decomposition) and named; what is added is the exact accounting
    of what the twist half of the base contributes to a target in G.
    LOSSY-PROJECTION TEST AGAINST SIGMA. What is discarded: the G'-component,
    log_2 N' bits of the ambient point. Compatible with Sigma: yes, cosets of G'
    are preserved by translation by G' and by pi (pi acts as -1 on G' and as +1
    on G). Lossy in the representation used: on E(F_{p^2}), yes; on the
    embedded G, no -- the coset of P determines P. So the test is passed on the
    ambient group and fails on the target, which is exactly why the padding
    tautology follows: information about a G-target can only enter through the
    G-part of the base.
    PRICE OF THE OPEN NUMBER. For a Class I object the obligation is the
    conservation-mean coverage (KN-FIND-007) and the solve cost. Conservation on
    the ambient group of order N N' with base size about 2|W| gives mean yield
    C(2|W| + m - 1, m) / (N N') per ambient target, reproduced exactly by the
    padding count for targets in G; the solve cost is the Weil-restricted Semaev
    system, whose cost the record does not improve and charges at Gaudry's value.
    STAGE 0 (zero compute). Derive (A)-(B), including the negation symmetry of
    the G'-part and the exact padding count for m in {2, 3, 4}.
    STAGE 1 (minutes, gate). Build E(F_{p^2}) at p about 12 to 14 bits (ambient
    size up to about 2^28, enumerable through G x G'), verify #E(F_{p^2}) = N N'
    and the direct-sum decomposition, verify that x(S) in F_p iff S in G union G'
    exhaustively.
    STAGE 2 (an hour). For windows W of size |W| in {2^6, 2^8, 2^10} and
    m in {2, 3, 4}: count decompositions over F_W of (i) every target in G, (ii)
    a sample of targets in G', (iii) a sample of generic ambient targets; compare
    (i) with the padding formula and (iii) with the conservation mean; compute
    the rank of the projected relation matrix versus the G-only rank.
    STAGE 3. Controls below and the known-false window (W chosen so that the
    G'-part of F_W is empty, where the counts must equal the G-only counts
    exactly).
  novelty_status: unverified
  citations:
    - ref: knowledge/findings/KN-FIND-007.md
      provenance: internal
      claim: Mean decomposition yield is geometry-invariant at fixed base size; rank and coverage are the only free quantities. Used as the ambient-group calibration and as the reason the record measures rank.
      verified_by: TASK-20260906-f71aaa direct read 2026-09-06
    - ref: ledger/proposals/IDEA-20260807-dadcd2.yaml
      provenance: internal
      claim: >-
        Statement (L3): the factor base counts rational points, and a geometric
        fibre's irrational members do not enter it; the isogeny-pullback candidate
        died on rationality. The twist-coset padding is the same rationality
        obstruction seen from the extension field.
      verified_by: TASK-20260906-f71aaa direct read 2026-09-06
    - ref: knowledge/findings/KN-FIND-61347e.md
      provenance: internal
      claim: >-
        Cross-genus Poincare-factor embeddings cannot beat rho because Tate's
        theorem forces the complementary factor to have order Theta(N^(g-1));
        E(F_{p^2}) is the g = 2 instance with complementary factor G' of order
        about p. Quoted through KN-TECH-ee6696's F3 row; not re-read.
      verified_by: KN-TECH-ee6696 F3 row, read in full 2026-09-06 under TASK-20260906-f71aaa
    - ref: ledger/proposals/IDEA-20260727-005.yaml
      provenance: internal
      claim: 'Exit class E3 (abelian varieties) costs O~(p^(2 - 2/g)) >= p for g >= 2 over a prime field. Quoted through KN-TECH-ee6696; not re-read.'
      verified_by: KN-TECH-ee6696 F3 row, read in full 2026-09-06 under TASK-20260906-f71aaa
    - ref: >-
        P. Gaudry, 'Index calculus for abelian varieties of small dimension and
        the elliptic curve discrete logarithm problem', J. Symbolic Computation
        2009 (the n = 2 extension-field algorithm with factor base x in F_p)
      provenance: recalled
      claim: Index calculus on E(F_{p^n}) with the subfield factor base costs O~(p^(2 - 2/n)) for fixed small n. Recalled; the exact exponent statement should be checked against KN-LIT entries by a reviewer.
      verified_by: null
  assumptions:
    - Prime-order E/F_p with gcd(N, N') = 1; if gcd(N, N') > 1 the direct sum fails and the cell is excluded and reported.
    - >-
      Off-limits components used and named: F2 (factor-base decomposition,
      Gaudry's subfield base) and the F3 exit-class bound; what is added is the
      padding tautology and its forced value on a prime-order target.
    - Toy scale, p about 12 to 14 bits so that E(F_{p^2}) is enumerable; claim_tier toy.
    - No external literature opened this session.
  proof_search_map:
    bottleneck: >-
      G intersect G' = 0 together with the negation symmetry of the twist part of
      the base. Remove either (rational 2-torsion, or a base not symmetric under
      negation) and the padding count changes; the record's forced value rests on
      exactly these two facts.
    baseline_embedding:
      parameter_slice: >-
        W with empty G'-part (the known-false window), where the base is the
        ordinary windowed G-base and all counts reduce to the corpus's E1-01 /
        KN-FIND-007 values.
      reproduction_check: >-
        Exact equality of decomposition counts and rank with the G-only run on
        the same curve and window; any difference is an implementation fault.
    observation_collision:
      observable: The decomposition count of a target over F_W and the rank of the projected relation matrix.
      distinct_preimage_search: >-
        Expected and required: two windows W, W' with the same G-part and
        different G'-parts must give identical projected rank and counts differing
        only by the padding term; if they differ otherwise, the observable is
        carrying G'-information and (B) is wrong.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'index calculus on E(F_{p^2}) with a subfield base' by 'index
          calculus on G with the G-part of the base, plus tautological relations
          among twist pairs'; encoding exact, completeness exact, soundness exact
          by (B), cost loss the ambient Weil-restricted solve.
        predicted_gain: Zero on every axis; the transform is the closure.
    quantifier_order: >-
      FOR ALL prime-order E/F_p with gcd(N, N') = 1, FOR ALL W in F_p symmetric
      under the base's negation (automatic for x-windows), FOR ALL targets R in G
      and FOR ALL m: the decomposition count over F_W equals the padded G-count of
      (B), and the projected rank equals the G-only rank. NOT claimed: anything
      about targets outside G, about non-symmetric bases, or about k > 2 beyond
      the charged trace-fibre remark.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On prime-order prime-field curves the F_{p^2}-twist representation adds
        only tautological padding to relations for targets in G, and the ambient
        index calculus costs at least p, above rho's p^(1/2).' It can never
        certify anything about curves with rational 2-torsion or about targets
        genuinely in E(F_{p^2}).
      nearby_object_control: >-
        A curve with rational 2-torsion (composite order), where G intersect G'
        is nontrivial, the direct sum fails and the padding count must change;
        and generic ambient targets, where Gaudry's yield holds and the G-padding
        formula must NOT apply. A pipeline that reports the padding formula on
        both has not used G intersect G' = 0.
    proof_obligations:
      - claim: >-
          E(F_{p^2}) is the direct sum of G and the twist part G' when
          gcd(N, N') = 1.
        responsibility: correctness
      - claim: >-
          A point S of E(F_{p^2}) has x(S) in F_p if and only if S lies in
          G union G'.
        responsibility: correctness
      - claim: The padding count of (B) for m in {2, 3, 4}.
        responsibility: strictness
      - claim: Projected rank equals G-only rank.
        responsibility: correctness
      - claim: Ambient cost is Gaudry's O~(p), above p^(1/2).
        responsibility: runtime
      - claim: Scope excludes rational 2-torsion and ambient targets.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        order of E(F_{p^2}) versus N N', and exhaustive verification that x(S)
        lies in F_p if and only if S lies in G union G'
      direction: different
      minimum_effect: Exact on every cell; a failure is an implementation or gcd fault and halts the record.
    - metric: decomposition count of targets in G over F_W minus the padded G-count formula, per target, m in {2,3,4}
      direction: different
      minimum_effect: Exactly zero on every target and cell (forced value); one nonzero residual is the falsifier.
    - metric: rank of the relation matrix projected to G minus the G-only rank
      direction: different
      minimum_effect: Exactly zero on every cell.
    - metric: mean decomposition count of generic ambient targets versus C(|F_W| + m - 1, m) / (N N')
      direction: different
      minimum_effect: Equal in the mean (KN-FIND-007 calibration on the ambient group); deviation voids the run.
  minimal_test:
    design: >-
      Stages 0-3 of the mechanism in pure Python at p about 12 to 14 bits on
      three prime-order curves per size and one composite-order nearby object,
      with exhaustive enumeration of E(F_{p^2}) through G x G'; no attack and no
      scalar recovery; claim_tier toy.
    controls:
      - >-
        PGL_2(F_p) random-reparametrisation battery of IDEA-20260807-4fc635
        applied to the window coordinate; the padding structure (counts modulo
        the window's G-part) must be invariant across 30 draws.
      - Translation-conjugate null of IDEA-20260807-4fc635 with retargeting R - mD; exact reproduction required.
      - Matched random prime-order curve at the same p.
      - Pollard rho with distinguished points and BSGS on G as matched cost controls; the ambient index-calculus cost is reported against them and predicted to lose.
      - Known-false window with empty G'-part (counts must equal the G-only counts exactly).
      - Composite-order nearby object with rational 2-torsion (padding formula must fail).
    required_metrics:
      - direct-sum and subfield-membership verification per cell
      - per-target decomposition counts, G-part counts, padding term, residual
      - projected and G-only ranks per cell
      - ambient conservation mean versus measured mean
      - wall clock and peak memory per cell, rho and BSGS baselines on G
  falsification_conditions:
    - A target in G with a decomposition whose twist components do not cancel pairwise. (B) is false; the twist half carries G-information; supersede and escalate.
    - Projected rank exceeds the G-only rank on any cell. Same disposition.
    - The composite-order nearby object reproduces the padding formula. The derivation did not use G intersect G' = 0 and is void.
    - All forced values hold on all cells. Closure of the R3 Weil-restriction and twist class on prime-order curves with the padding mechanism and the E3 bound.
  confounders:
    - gcd(N, N') > 1 at toy sizes silently breaks the direct sum; check per curve and exclude with a record.
    - Small windows at small p make the G'-part empty by accident; the window size must be verified to contain twist points before the padding prediction is read.
    - Multiplicities at 2-torsion of the twist and at points with x(S) a root of f must be counted separately, not filtered.
  interpretation_limits:
    - No attack, no exponent. The record's deliverable is a forced value that closes one R3 class with a mechanism; a passing run says nothing about extension-field targets, which are Gaudry's setting and not this program's.
    - >-
      KN-OPEN-020 class of the factor base is the bounded-degree algebraic
      description (the subfield condition is degree 1 on the Weil restriction),
      inside the scoped-out class for the target G; the record therefore stops
      there and claims no escape.
    - Toy tier; the E3 cost statement is derived, not measured.
  heuristic_assumptions: []
  heuristic_assumptions_note: Exact counting; no distributional hypothesis is asserted. The ambient conservation mean is a calibration, not an assumption.
  target_complexity:
    time_exponent: 'No improvement; the ambient index calculus costs O~(p^1) against rho at p^(1/2) on G, a predicted loss of exponent 1/2.'
    memory_exponent: 'Ambient factor base of size about p, exponent 1, against O(1) for rho.'
    best_known: 'Pollard rho at 0.886 sqrt(N) and O(1) memory (KN-TECH-006); BSGS (KN-TECH-031); Gaudry n = 2 index calculus at O~(p) on E(F_{p^2}) for ambient targets (recalled).'
    hidden_overhead: None hidden; the Weil-restricted Semaev solve and the ambient linear algebra are the explicit cost.
    tradeoff_note: Not applicable.
  dominated_by: >-
    Dominated on time by a factor about p^(1/2) and on memory by a factor about p
    by Pollard rho (KN-TECH-006); also by BSGS (KN-TECH-031),
    automorphism-discounted rho (KN-TECH-018), multi-target, the preprocessing
    frontier, and the windowed prime-field index calculus of the E1-01 lane at
    matched base. Frontier checked row by row; no axis is escaped.
  sota_delta:
    time_exponent_improvement_claimed: 0
    memory_exponent_improvement_claimed: 0
    data_query_improvement_claimed: 0
    scope: >-
      Zero on every cost axis. Deliverable delta: the Weil-restriction and
      F_{p^2}-twist R3 class of RQ-ECDLP-623a32 gets a forced value (padding
      tautology, rank equality) and a cost bound (E3), closing it at the section 4
      standard for prime-order prime-field targets.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
