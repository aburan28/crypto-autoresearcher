idea:
  id: IDEA-20261017-078074
  question_id: RQ-PFDR-ae2fba
  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Dual sum-product probe: do log-domain GAP bases carry label-additive
    structure that a label predicate could test, at toy scale and on real curves
  class: measurement
  claim: >-
    R1 labels, stage factor-base membership. Let A = {c_1 P_1 + ... + c_r P_r :
    |c_i| <= T}, r in {1,2,3}, P_i points of a prime-order E/F_p, a = |A| in
    [2^6, 2^13]. Its label set X = x(A) has pair-sum coincidences
    (x_1+x_2=x_3+x_4 mod p, nontrivial) within 5% of the random-set value
    (about a^4/(2p) in order of magnitude), and |X+X| >= 0.9 of the random-set
    expectation. No label predicate of low complexity can therefore describe a
    log-GAP base, which is the unknown-sharing base of IDEA-20261017-bbc53e
    (kappa_eff = 2*c_0). On P-256 and secp256k1 with a <= 2^12 the expected
    number of nontrivial coincidences is ~2^-200, so the claim there is
    exactly zero.
  mechanism: >-
    Pair (R1 x-labels of points with known integer coefficients, Sigma =
    integer scaling and translation by known multiples). Trichotomy:
    coordinate-dependent. Label addition is not equivariant under the group law
    (S_3 intervenes), so the label sumset is a function of the representation.
    Lossy-projection test: |X+X| discards the group identity of the sums.
    Whether that discard is compatible with Sigma is the question measured.
    This is the dual of IDEA-20261017-077f12: that record asks whether a
    label-structured set (window/GAP) is group-additively structured; this one
    asks whether a group-structured set (log-GAP) is label-additively
    structured. Sum-product on E (Ahmadi-Shparlinski 2010, recalled) forbids
    both above ~p^(1/2); below it neither direction is proved. Costs only
    label additions plus a scalar multiplications, no logarithms, no tables, so
    it runs at cryptographic p. F2 is the lens; added: the log-GAP side of the
    dichotomy. KN-OPEN-020 class: implicit-membership (a label test for a
    shared-unknown base), the class this would open if it failed.
  novelty_status: unverified
  citations:
    - ref: arXiv:2510.03828
      provenance: retrieved
      claim: char-0 rigidity of x-label additive structure for rational points
      verified_by: idea-generator 2026-10-17, abstract fetched
    - ref: Ahmadi-Shparlinski, Proc. Edinburgh Math. Soc. (2010)
      provenance: recalled
      claim: sum-product phenomenon for points of E and their x-coordinates; pointer only
      verified_by: null
    - ref: IDEA-20260811-7734c5
      provenance: internal
      claim: group-side energy of a label-defined base
      verified_by: idea-generator 2026-10-17, file opened
  assumptions:
    - Labels of P_i are drawn uniformly among points with f(x) square.
    - Python big-integer label sums suffice at p = 2^256 for a <= 2^12.
  predictions:
    - metric: nontrivial label coincidences / random-set mean (toy p)
      direction: different
      minimum_effect: >-
        absolute deviation of the ratio from 1 at least 0.10 at z > 4 in some
        (p, r, a) cell
    - metric: nontrivial label coincidences on P-256 and secp256k1, a <= 2^12
      direction: higher
      minimum_effect: at least 1 verified coincidence (expected 2^-200)
  minimal_test:
    design: >-
      Toy p in {2^20, 2^24, 2^28}, r in {1,2,3}, a in {2^8,...,2^12}, 50 curves
      per cell, P_i uniform. Build A by scalar multiples, take labels, sort all
      a^2 pair sums mod p, count nontrivial coincidences (exclude reorderings
      and x-equal pairs from +-P). Null: random label sets of equal size from
      points with f(x) square. Repeat on P-256 and secp256k1 with
      G and with random P_i, a <= 2^12.
    controls:
      - Random label set of equal size (null).
      - Planted arm with labels from a true AP in F_p, which must read as a large excess.
      - secp256k1 beta-orbit sets {x, beta x, beta^2 x} are removed before counting.
    required_metrics: [coincidence count, null mean and sd, z, "|X+X| / expectation", p, r, a, curve]
  falsification_conditions:
    - Every toy cell within 5%, and zero coincidences on both real curves, closes label-describable log-GAPs at the tested sizes.
    - Any verified nontrivial coincidence on a real curve is a structural finding to re-derive before any reading.
    - A toy cell off by >= 10% at z > 4 on fresh P_i survives as structure.
  confounders:
    - The x-map is 2-to-1; +-P pairs give trivial label equalities, removed.
    - j=0 curves carry beta-orbits; removed for secp256k1 and flagged for toy j=0 curves.
  interpretation_limits:
    - A null does not exclude label structure for sets that are not log-GAPs.
    - Real-curve zero is a statement about a <= 2^12 and these P_i only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Labels x(cP), |c| <= T, behave as independent uniform elements of the
        square-class of F_p, so label coincidences follow the random-set law.
      rigorous_support: >-
        Equidistribution of x(cP) over short coefficient ranges is the type of
        result in Shparlinski's work on sequences of points (recalled);
        no bound at these sizes is claimed.
      validation_plan: >-
        Toy cells above with 50 curves; compare to the random-set null at 3
        primes; tail: count of cells with |z| > 3 against the expected 0.3%.
  target_complexity:
    time_exponent: no attack claimed
    memory_exponent: no attack claimed
    best_known: rho N^(1/2)
    hidden_overhead: n/a
    tradeoff_note: >-
      A label-describable log-GAP base would give kappa_eff = 2*c_0 with
      algebraic membership, which IDEA-20261017-bbc53e prices at tau
      (h/(2h-1))(1-gamma) and never below 1/2 unless kappa exceeds U.
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: medium
  prior_art:
