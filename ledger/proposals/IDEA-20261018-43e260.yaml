idea:
  id: IDEA-20261018-43e260
  question_id: RQ-DREG-d7b6d6
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Twist, Frobenius and Koblitz quotients: the F_4 class census is one system, Galois-matched pairs
    are an exact zero-gap positive control, and the order-noise floor is the bar for a class gap
  class: control
  claim: >-
    Hand-derived, nothing executed. (A) Over F_{2^N} the descended S_3 system depends on the curve only through
    b (a is absent), and Sigma(b;V,r) is F_2-linearly isomorphic to Sigma(b^2;V^2,r^2). (B) LADDER-W-v1 has 3
    systems (b in F_4*); its only 2-vertex class is the Galois pair {w,w^2} (#E 4 and 6), b=1 is a singleton
    Koblitz class (#E 8 and 2), and every degree-2 edge is a Galois shift. (C) For Galois-matched (V,r) the
    within-class range of r(d), first fall and last fall is 0 by theorem; a grevlex gap there is order noise.
    Matched pairs must give 0; unmatched pairs and random GL images give the floors a class gap must exceed.
  mechanism: >-
    PAIR. R3 (Weil-restricted bit coordinates); Sigma = {Frobenius/Verschiebung edges, twist a -> a+d,
    GL(2k,F_2)}, not translation. Trichotomy: coordinate-dependent. Lossy-projection test: the profile (r(d), falls)
    drops generators and points; a linear substitution is a filtered automorphism of F_2[z]/(z_i^2+z_i), so the
    discard commutes with Sigma; many ideals share a profile. An ordinary binary curve has one separable
    2-isogeny, E -> E^(1/2), so 2-isogenies are sigma-cycles and only ell >= 3 leaves an orbit; orbit
    canonicalisation is sigma^i, free. Factor base: standard subspace, KN-OPEN-020 not entered.
  novelty_status: unverified
  citations:
    - {ref: H-DREG-b6bfd1, provenance: internal, claim: "approved class census whose base class this audit shrinks", verified_by: idea-generator}
    - {ref: IDEA-20260922-881df9, provenance: internal, claim: "arm B asks for 8 non-isogenous F_4 curves", verified_by: idea-generator}
    - {ref: EXP-DREG-dd668d, provenance: internal, claim: "LADDER-W-v1 lexicographic base and degree-2 Velu edges", verified_by: idea-generator}
    - {ref: "Lachaud-Wolfmann 1990", provenance: recalled, claim: "Kloosterman values -1 mod 4 fill the Hasse range over F_{2^N}", verified_by: null}
  assumptions:
    - No shell this session. The F_4 point-count table is hand-computed and is Stage 0 of the test.
  proof_search_map:
    bottleneck: number of independent systems in a class, and what a zero range means
    method_ceiling: an exact zero-gap control; silent about gaps at unmatched (V,r)
  predictions:
    - metric: "max over d of abs(r_d difference) on Galois-matched pairs"
      direction: lower
      minimum_effect: "exactly 0, blocking"
    - metric: "same on unmatched pairs (same V and r; b versus b^2) at N 7 and 11"
      direction: higher
      minimum_effect: "at least 1 on some pair: factor-base position is a live confound"
    - metric: "range of grevlex solving degree over 8 random GL images of one system"
      direction: different
      minimum_effect: "range nu; a class gap of at most nu is order noise"
  minimal_test:
    design: >-
      Stage 0: machine-check the six F_4 point counts, classes, edge targets. Stage 1: Sigma(w) and Sigma(w^2) of
      LADDER-W at n=1,2, compare r(d), d <= 4. Stage 2: N in {7,11}, polynomial-basis V, 8 targets, pairs (b,b^2)
      matched and unmatched. Stage 3: GL floor and a T11 support-matched null.
    controls: [identity pair, random GL images, T11 null, b=1 arm labelled symmetric]
    required_metrics: [point counts, orbits per class, r(d), first and last fall, grevlex solving degree, nu]
  falsification_conditions:
    - A matched pair differs in r(d) or a fall. Theorem or code is wrong, stop.
    - Unmatched pairs agree at N 7 and 11. Position confound absent there, matching still required.
    - Machine class counts differ from the hand table.
  confounders:
    - The lexicographic base reads as b=1 or b=z; polynomial-basis reduction changes V under sigma.
    - The b=1 pair has an automorphism (Koblitz), not a plain coefficient control.
  interpretation_limits:
    - Tests neither condition; it fixes how many independent class members exist (precondition for condition 2).
    - Toy fields, no ECDLP exponent, timeouts are unmeasured.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The mean b-set per Kloosterman level has about 2^{N/2} members, so about 2^{N/2}/N independent orbits
        for prime N.
      rigorous_support: >-
        Derived count q+1+(-1)^{Tr a}K(sqrt b) and Lachaud-Wolfmann (recalled); imitates Sato-Tate equidistribution
        of K (Katz, recalled).
      validation_plan: >-
        Walsh transform gives exact level sets at N 9, 11, 13, 15; compare sizes with the semicircle, check tails.
  target_complexity:
    time_exponent: measurement only, Macaulay rank on at most 12 boolean variables, d <= 5
    memory_exponent: one 3300 x 1600 bit matrix
    best_known: Pollard rho about 2^{N/2}; no algorithm claimed
    hidden_overhead: none
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
