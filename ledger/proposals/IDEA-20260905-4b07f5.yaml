idea:
  id: IDEA-20260905-4b07f5
  title: Descent-cocycle obstruction as a compositional isogeny certificate
  class: representation
  claim: An isogeny representation equipped with explicit field-descent isomorphisms can certify exactly when independently
    valid local pieces glue to a morphism over the declared field; agreement of endpoint invariants alone cannot
    provide that certificate.
  mechanism: Represent a morphism by its source, target and transition isomorphisms under the field automorphisms,
    retaining the cocycle defect on overlaps. Composition transports those defects functorially. The proposed invariant
    forgets explicit point evaluations but preserves a necessary gluing equation. Its useful output is a nontrivial
    obstruction class or a checked trivialization for supplied morphisms. A degree label and an endpoint j-invariant
    can agree while the descent datum differs. The mathematical question is whether the defect can be carried in
    a bounded automorphism module throughout a reduction chain, rather than expanding to the entire morphism description.
