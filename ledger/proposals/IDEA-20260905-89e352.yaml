  minimal_test:
    status: proposal_only_unfrozen
    design: Propose one ordinary incomplete addition chart and one two-chart cover on symbolic toy curves; inspect
      the identity, diagonal and inverse-point strata explicitly. Bound the proposed witness degree at8 and stop
      unresolved if no identity is found. First audit the formal complementary-failure positive control and common-identity-omission
      negative control. These check the quantifier, separately from any elliptic formula identity, and are specified
      without evaluating curve arithmetic.
    controls:
    - kind: matched_null
      description: Apply an invertible coordinate change to both equations and formulas; coverage must remain identical.
    - kind: known_false
      description: A chart known to omit the identity must fail universal coverage even if it passes every generic-point
        substitution.
    - kind: positive_joint_cover
      description: 'Formal domain D with two nonempty disjoint failure loci B1 and B2: each chart is incomplete
        but B1 intersect B2 is empty, so joint coverage must pass. On P^1 use B1={[0:1]}, B2={[1:0]} as a set-theoretic
        quantifier control only; it asserts no elliptic addition identity.'
    - kind: common_omission
      description: A valid identity-pair component C contained in every B_i remains in their common intersection
        and must fail coverage. No saturation may discard it as a coordinate artifact.
