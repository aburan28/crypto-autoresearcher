idea:
  id: IDEA-20260816-1c2177
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-16'
  title: Reduce every leakage-or-fault assumption in this ledger to a five-slot predicate -- observable,
    granularity, error rate, observations per invocation, obtainability class -- write the machine
    checker for that normal form, and report the fraction of assumption-invoking records that currently
    instantiate all five slots, calibrated against records that invoke no such assumption.
  class: tooling
  claim: '(A) THE OBJECT. A leakage or fault assumption, wherever it appears in this ledger, is reducible
    to a five-slot tuple: OBSERVABLE (what function of the execution is seen), GRANULARITY (at what
    resolution -- a bit, a byte, a cache line, a loop-trip count, a branch outcome), ERROR RATE (with
    what probability the observation is wrong, including the value zero stated explicitly), MULTIPLICITY
    (how many observations per protocol invocation), and OBTAINABILITY (physical-access-required,
    co-resident-software, protocol-granted, or simulated-only). A record that fills all five states
    a PREDICATE: a statement that could in principle be true or false of a specific artifact and adversary.
    A record that fills fewer states a mood. (B) THE CLAIM. The reduction is well-defined enough to
    be machine-checked; a checker can be written against the existing record schemas in templates/research-records.md;
    and the fraction of assumption-invoking records that currently instantiate all five slots is a
    MEASURABLE PROPERTY OF THIS CORPUS with a value that can be reported with a confidence interval
    over a sampled and adjudicated subset. (C) THE DELIVERABLE IS A RATE AND A FORM, NOT A SURVEY.
    The output is (i) the normal form as a schema fragment, (ii) a checker that runs in CI, (iii)
    the measured instantiation rate with its interval, and (iv) the slot most often missing. This
    is deliberately not ''we screened N records and found nothing'': the number is the finding, and
    a high or low value is equally informative. (D) WHAT IS NOT CLAIMED. Nothing about whether any
    assumption is TRUE, realistic, or achievable. Nothing about whether any record is wrong. Nothing
    about what the published literature does or does not require. A record scoring zero slots may
    be entirely correct and simply not in this form; the rate measures form, not truth, and the report
    must say so in the same sentence as the number. (E) WHY IT IS WORTH HAVING. This bucket exists
    because leakage and fault assumptions are used throughout the portfolio and nowhere stated as
    measurable predicates. That is a claim about the corpus. Claims about the corpus should be measured,
    and this is the cheapest way to measure it.'
  mechanism: 'STAGE 1: define the five slots precisely, with a closed vocabulary for GRANULARITY and
    OBTAINABILITY and a numeric or explicitly-null field for ERROR RATE and MULTIPLICITY. Write them
    as a schema fragment compatible with the existing record templates. STAGE 2: build a two-stage
    detector for assumption-invoking records: a lexical pre-filter over a frozen keyword list, then
    a structured pass that extracts candidate slot fillers from the record''s own fields rather than
    from free prose where possible. STAGE 3: hand-adjudicate a random sample of records -- both pre-filter
    hits and pre-filter misses -- to measure the detector''s precision and recall, so the denominator
    of the rate is itself calibrated rather than assumed. STAGE 4: run the checker over the whole
    ledger and compute the instantiation rate per slot and jointly, with a Wilson interval from the
    adjudicated sample''s error rates propagated in. STAGE 5: report the rate, the per-slot missing-frequency,
    and the normal form. STAGE 6: ship the checker as a non-blocking CI advisory so future records
    can opt into the form; no existing record is modified, since records are immutable.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-INSTR-f8faa0. Grepped ledger/proposals/, ledger/hypotheses/ and knowledge/ for
      'leakage predicate', 'predicate normal form', 'granularity', 'obtainability', 'leakage model',
      'fault model', 'constant-time', 'taint'. Read the CLAUDE.md anti-duplication blacklist entries
      on cost-model audits and on citation_verified audits. Listed tools/ to see which checkers already
      exist (claim_class_audit.py, check_runtime_bindings.py, check_merge_hygiene.py, validate_ledger.py
      referenced in CLAUDE.md, obstruction_registry.py).
    results: '''leakage predicate'' and ''predicate normal form'' return zero hits across ledger/proposals/,
      ledger/hypotheses/ and knowledge/. ''granularity'' hits seven proposals in unrelated senses
      (measurement resolution of other quantities). tools/ already contains schema and policy checkers
      -- claim_class_audit.py, check_runtime_bindings.py, check_merge_hygiene.py, check_inference_cost_policy.py
      -- establishing that machine-checked corpus properties are an accepted artifact class here,
      and obstruction_registry.py establishes the precedent of deriving a standing set from committed
      records. No existing checker or proposal targets leakage or fault assumptions. The blacklist
      forbids re-auditing the cost model and the citation_verified markings; this audits neither.'
    verdict: 'UNVERIFIED. No claim about external literature. Assembled from known parts: normal forms
      and schema checkers are ordinary practice and this repository already has several (tools/claim_class_audit.py,
      tools/check_runtime_bindings.py); calibrating a detector against hand-adjudicated samples is
      standard. Claimed new only within this repository: the specific five-slot decomposition of a
      leakage/fault assumption, and reporting corpus conformance to it as a measured rate with a calibrated
      denominator rather than as a prose survey.'
  object_first_candidate:
    tracked_object: 'The assumption clause: the five-tuple (observable, granularity, error rate, multiplicity,
      obtainability) extracted from a record. Followed as records are read, as one record cites another,
      and as an assumption propagates from a question into a hypothesis into an experiment contract.'
    lossiness: 'Genuinely lossy. Everything a record says about motivation, scheme, history, provenance
      and justification is discarded; only the five slots survive. Two records with entirely different
      prose and different schemes map to the same tuple, which is the point -- it makes them comparable.
      The retained part propagates because the five slots are exactly what a downstream cost model
      consumes: a lattice attack that needs l bits at error rate e per signature reads MULTIPLICITY,
      GRANULARITY and ERROR RATE and nothing else. The discarded prose does not enter any downstream
      computation, which is why discarding it is compatible with the operation of citing an assumption
      forward.'
    propagation: 'One step of the target operation is ''record B cites record A''s assumption''. Under
      the normal form that step acts on the tuple as follows: B either inherits A''s tuple unchanged,
      refines exactly one slot (typically narrowing GRANULARITY or supplying an ERROR RATE that A
      left null), or contradicts a slot. Those three outcomes are decidable from the two tuples alone,
      which makes assumption drift across a citation chain a checkable property rather than a reading
      exercise.'
    survival_score: Stated as the citation depth at which the tuple stops being determinate -- the
      number of citation hops from an originating question before some slot becomes null or contradictory.
      Measured on the actual citation graph of the assumption-invoking records found. A depth of one
      would mean assumptions do not survive being cited at all; a depth of three or more would mean
      the corpus already carries them coherently and the checker is redundant. Either number is the
      deliverable.
  null_object_control: 'Run the IDENTICAL detector and the IDENTICAL slot extractor over a matched
    sample of records that invoke NO leakage or fault assumption -- for example records in the algebraic
    and lattice lanes selected to match the assumption-invoking sample on record type, area code and
    length. The null must show a near-zero rate of spurious slot instantiation: if the extractor finds
    an OBSERVABLE and a GRANULARITY in a record about Groebner basis degrees, the extractor is pattern-matching
    on generic vocabulary and its rate on the signal sample is meaningless. Pre-registered requirement:
    spurious full-tuple instantiation on the null sample below 0.02, and spurious single-slot instantiation
    below 0.10, both with Wilson intervals. Both arms are extracted in the same invocation of the
    same code with the same frozen vocabulary.'
  discriminated_from:
  - 'tools/claim_class_audit.py and the existing schema checkers: those check record structure and
    claim tiers against the record contract; this defines and checks a new content-level normal form
    that no schema currently expresses.'
  - 'The blacklisted audit of this program''s cost model, machine variance and single-machine timing
    (15+ proposals under RQ-INSTR-f8faa0): different object entirely -- cost models are about what
    a computation costs, this is about what an adversary is assumed to observe.'
  - 'The blacklisted audit of literature-corpus citation_verified markings owned by KN-OPEN-3f7a21:
    that audits provenance of citations; this audits the internal structure of assumptions and touches
    no citation marking.'
  - 'A prose survey of the form ''we screened N records and found nothing'', explicitly ruled out
    by docs/inventor-protocol.md section 4: the deliverable here is a rate with a calibrated denominator,
    a null arm, and a machine checker that outlives the run -- a survey produces none of those.'
  - 'tools/obstruction_registry.py, which derives a standing set of obstructions from committed records:
    same ''derive a corpus-level object from records'' pattern, but its object is a measured obstruction
    and its purpose is re-posing it at rerank; this object is an assumption clause and its purpose
    is making assumption drift checkable.'
  assumptions:
  - A leakage or fault assumption, as used in this corpus, actually decomposes into these five slots
    without a sixth that matters; a missing slot would make the form wrong rather than the corpus
    deficient.
  - The lexical pre-filter's recall is estimable from a hand-adjudicated sample of pre-filter MISSES,
    which requires that misses be findable at all.
  - Hand adjudication of the sample is reliable enough to serve as ground truth; a single adjudicator's
    judgments are a known weak point.
  - Records are immutable, so the measured rate is a property of a specific commit and must be reported
    with that commit's sha.
  - A record can be correct while scoring zero slots, so the rate must never be read as a quality
    score.
  predictions:
  - metric: fraction of assumption-invoking records instantiating all five slots
    direction: different
    minimum_effect: no pre-commitment on the value -- it is the quantity the run exists to measure,
      and pre-committing it would invite the analysis to be steered toward it; what IS pre-committed
      is that the interval will be reported and the per-slot breakdown given
  - metric: the most frequently missing slot
    direction: different
    minimum_effect: 'pre-committed prediction: ERROR RATE is the slot most often null, because stating
      a nonzero error rate forces a downstream cost recomputation that a qualitative assumption avoids;
      this is a falsifiable ordering claim over five categories'
  - metric: spurious full-tuple instantiation rate on the null (no-assumption) sample
    direction: lower
    minimum_effect: 0.02
  - metric: assumption-tuple survival depth across the citation graph
    direction: different
    minimum_effect: no pre-commitment; reported with its distribution
  minimal_test:
    design: 'Do not build the full checker first. Draw 40 records at random from the 158 that the
      leakage keyword pre-filter already hits, and 40 from records it does not hit, and hand-adjudicate
      all 80 against a written five-slot rubric fixed in advance. That single pass yields the pre-filter''s
      precision and recall, a first estimate of the full-tuple instantiation rate with a Wilson interval
      wide but usable at n=40, and -- critically -- the null arm''s spurious-instantiation rate. If
      the null arm shows the rubric can be ''filled'' from records about Groebner degrees, the whole
      idea is refuted for two hours of work and no code is written. If the null is clean and the signal
      rate is far from both zero and one, the full checker is worth building. Cost: one adjudication
      session, zero compute, no repository modification.'
    controls:
    - Matched no-assumption record sample, extracted by the identical code with the identical frozen
      vocabulary.
    - 'Blind adjudication: rubric fixed and recorded before any record is opened; record ids withheld
      from the adjudicator where feasible.'
    - 'Pre-filter recall control: adjudication of a random sample of pre-filter MISSES, not only of
      hits.'
    - 'Vocabulary-freeze control: the keyword list is hashed and recorded before the sample is drawn.'
    - 'Commit-pinning control: the measured rate is computed at one recorded commit sha and recomputed
      at a second later sha to check stability.'
    required_metrics:
    - full five-slot instantiation rate with Wilson interval
    - per-slot instantiation rate
    - pre-filter precision and recall from adjudication
    - null-sample spurious instantiation rate, full-tuple and single-slot
    - assumption-tuple survival depth distribution over the citation graph
    - count of assumption-invoking records at the pinned commit
  falsification_conditions:
  - 'The null sample''s full-tuple spurious instantiation rate exceeds 0.02: the rubric is not specific
    to leakage assumptions and the rate is uninterpretable.'
  - 'Pre-filter recall measured on adjudicated misses falls below 0.6: the denominator is unknowable
    and no corpus-level rate can be reported.'
  - 'Two independent adjudicators disagree on more than 25 percent of slot fillings: the rubric is
    not machine-implementable and the checker cannot be built.'
  - 'The five slots cannot accommodate a substantial class of encountered assumptions, requiring a
    sixth: the normal form is wrong and must be redesigned before any rate is reported.'
  - The measured rate changes by more than its interval width between two commits weeks apart with
    no relevant merges, showing the extractor is unstable.
  confounders:
  - Keyword pre-filtering biases the sample toward records that use side-channel vocabulary, while
    an assumption can be invoked without any of those words.
  - Record length correlates with slot instantiation trivially, so the matched null must control for
    length.
  - An adjudicator who wrote or read the sibling records is not blind and will over-fill slots from
    memory.
  - Immutability means older records were written before any such form existed, so the rate partly
    measures corpus age rather than corpus discipline; the report must stratify by record date.
  - Automated extraction from prose can pick up an observable named in a motivation section that the
    record does not actually assume.
  interpretation_limits:
  - The rate measures FORM, not truth or quality; a record with zero slots may be entirely correct.
  - It is a property of one commit of one corpus and transfers nowhere.
  - Nothing here says whether any assumption is achievable by any real adversary; OBTAINABILITY is
    a declared category, not a verified capability.
  - A low rate is not evidence of a defect in any individual record, and no record may be named as
    deficient on the basis of this rate alone.
  target_complexity:
    time_exponent: No attack exponent is claimed; the deliverable is a schema, a checker and a rate.
    memory_exponent: No attack exponent is claimed. The checker is linear in corpus size.
    best_known: 'Within this repository the incumbents are tools/claim_class_audit.py and the schema
      validators referenced in CLAUDE.md, which check record structure and claim tiers. For leakage
      and fault assumption structure specifically the incumbent is nothing: the portfolio survey that
      produced this bucket found no dedicated question and no contract measuring any side channel.'
    hidden_overhead: 'Almost all cost is human: writing a rubric precise enough for two adjudicators
      to agree on, and adjudicating enough records to give the denominator a usable interval. The
      CI checker adds permanent maintenance cost and, if it becomes blocking, would impose a form
      on future records that may not fit every case -- which is why it must ship advisory-only.'
  dominated_by: n/a (no result claimed). No attack is proposed, so there is no time/memory/data frontier
    row to occupy; every axis was considered and none applies. The nearest comparable artifact in
    this repository is tools/obstruction_registry.py, which is also a corpus-derived object rather
    than an attack, and this neither dominates nor is dominated by it -- they track different objects.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: replaces an unquantified
    assertion that leakage assumptions in this portfolio are not stated as predicates with a rate
    carrying a Wilson interval at a pinned commit, plus a per-slot breakdown over five categories
    and a calibrated detector precision and recall. No attack cost changes in any direction.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the five slots suffice for most encountered assumptions without
    needing a sixth: 0.6, because the decomposition was derived from four anchor records and not from
    a broad reading. That the null arm comes back clean, i.e. the rubric does not fill itself from
    unrelated records: 0.7, since GRANULARITY and OBTAINABILITY have closed vocabularies with little
    generic overlap. That two adjudicators reach acceptable agreement: 0.5, because slot extraction
    from prose is exactly where agreement usually fails. That the checker is adopted and actually
    changes how a later record is written: 0.3, since advisory CI checks are easy to ignore.'
