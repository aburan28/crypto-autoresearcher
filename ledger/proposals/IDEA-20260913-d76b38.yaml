  assumptions:
    - Odd prime p so that (p-1)/2 is an integer.
    - Public short-Weierstrass, prime-order subgroup, odd characteristic.
    - chi_2 is the power map x |-> x^{(p-1)/2} in F_p, not a residue symbol in a number field and not a pairing.
    - x=0 is a zero of chi_2 and is charged as a special fibre, not as a quadratic class.
    - No Miller/Tate/MOV computation is performed or assumed.
  predictions:
    - metric: quadratic_symbol_hold
      direction: different
      minimum_effect: >-
        REAL cell on P=(2,3)/F_19 equals the designed pair
        (chi_2(x), chi_2(x')) = (18, 1) in F_19. Known-false invariance
        chi_2(x')=18 fails. Null random {1,18} labels are not credited.
    - metric: unary_closure
      direction: different
      minimum_effect: >-
        Outcome A if chi_2(x') is a function of chi_2(x) on the frozen
        curve's affine census. Outcome B if any input class has two outputs.
    - metric: L_and_b
      direction: different
      minimum_effect: If Outcome B, measure L and b against identity, random {+/-1}, and relabelled Z/NZ.
  minimal_test:
    execution_status: design_only
    design: >-
      STAGE-0 FINITE EXACT IDENTITY (named). Freeze p=19, A=1, B=-1,
      P=(2,3), [2]P=(16,11). chi_2(u)=u^9 in F_19. REAL pair: 2^9 ≡ 18
      and 16^9 ≡ 1 (independently computed; 16=2^4 so 16^9=(2^4)^9=2^{36}
      =2^{36 mod 18} via Fermat is a second check, or stepwise
      16^2≡9, 16^4≡5, 16^8≡6, 16^9≡1). Known-false claim: chi_2(x')=18
      (invariance). Null object: an independent uniform element of
      {1, 18}. Invalid-input reject: x=0 must be flagged as the zero
      fibre. Nearby-object control: Q=(1,1), [2]Q=(2,16), pair (1, 18),
      which also separates chi_2(x) from chi_2(y) on that point.
      Unary-closure cell: census of (chi_2(x(R)), chi_2(x([2]R))) over
      affine non-singular R.
    matched_null: Independent uniform labels in {1, 18}.
    known_false: chi_2(x([2]P)) = 18 (wrong-value invariance) on the frozen REAL point.
    controls:
      - kind: matched_null
        design: Random {1, 18} labels.
      - kind: known_false
        design: Invariance claim output=18.
      - kind: invalid_input
        design: x=0 is the zero fibre, not a quadratic class.
      - kind: baseline
        design: Same power map applied to y (1eb65c-shape, quadratic not cubic) on the same census; 84755b P2 slice is the translation control.
      - kind: generic_group
        design: Relabelled Z/NZ with a random {+/-1} tag.
      - kind: nearby_object
        design: Q=(1,1) pair (1, 18); must not be pooled with P.
    required_metrics:
      - quadratic_symbol_hold
      - unary_closure
      - L_and_b
    decision_threshold: >-
      REAL pair (18, 1) must match independent recomputation of the two
      ninth powers. Known-false invariance must fail. Unary closure is a
      separate yes/no on this curve. No exponent claim and no pairing claim.
    stopping_rules:
      - Stop at the first failed exact identity or known-false control and classify it as a procedure defect.
      - No run is authorized here.
    required_artifacts:
      - frozen (p, A, B, P, [2]P, chi_2(x), chi_2(x')) manifest
      - REAL / known-false / null / invalid outcomes
      - optional full-curve 2-by-2 occupancy table
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: requires a new approved frozen handoff
  falsification_conditions:
    - Independent recomputation disagrees with 2^9 ≡ 18 or 16^9 ≡ 1 in F_19 (procedure defect; supersede).
    - Unary closure holds and the random-{+/-1} control shows the same function (artifact).
    - Scope is the frozen p=19 cell plus the optional Q=(1,1) nearby-object cell, not pooled.
  confounders:
    - Computing a pairing or an embedding-degree character instead of x^{(p-1)/2}.
    - Using y instead of x (then on P the pair coincides by chance; the object becomes a y-quadratic, not 1eb65c's cubic).
    - Treating family-C translation closure as already answering the {[2]} question.
    - Treating chi_2(0)=0 as an ordinary class in a 2-letter function.
  interpretation_limits:
    - Not F4, not Miller/Tate, not a factor base, not a Kummer-line coordinate.
    - A 2-valued label cannot be an exact sum-compatible bucket (Theorem C).
    - Family C's translation-filter closure does not decide doubling-compatibility.
    - Stage 0 is a calibrator. established_exponent_gain = 0.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-d76b38
      statement: >-
        For uniform non-2-torsion P with x != 0, chi_2(x(P)) is
        equidistributed on {1, p-1} up to O(p^{-1/2}) discrepancy.
        Imitates Weil's bound on quadratic-character sums of a
        non-constant regular function on E.
      rigorous_support: >-
        Weil bound |sum_P psi(x(P))| = O(sqrt(p)) for a nontrivial
        multiplicative character psi of F_p^* (recalled pointer to Weil
        1948; not opened). The quadratic character is such a psi.
      random_model_justification: >-
        Pair the Weil bound with the classical statement that a
        non-constant regular function behaves like a uniform F_p^*
        element versus multiplicative characters of bounded order.
        No smoothness law.
      validation_plan: >-
        Exact census on the frozen p=19 curve of chi_2(x) versus 1/2 on
        {1, 18}, excluding x=0. Tail check: list the two multiplicities.
        Nearby-object: Q=(1,1) cell, not pooled.
      falsification_condition: >-
        On the p=19 census, one quadratic class is empty or holds more
        than 3/4 of the x != 0 points (gross departure from 1/2).
    - id: H2-IDEA-20260913-d76b38
      statement: >-
        Predicted Outcome B: chi_2(x o [2]) is not a function of
        chi_2(x) on a generic ordinary prime-order curve, because x'
        depends on y through the doubling formula.
      rigorous_support: No theorem; the 2-by-2 occupancy table decides.
      random_model_justification: Exact finite table.
      validation_plan: Exhaustive (chi_2(x), chi_2(x')) table on p=19; a single input class with two outputs is Outcome B.
      falsification_condition: Each occupied input class has exactly one output (Outcome A on that toy).
