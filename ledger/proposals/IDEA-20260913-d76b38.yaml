idea:
  id: IDEA-20260913-d76b38
  title: Quadratic residue of affine x under doubling
  class: representation
  claim: >-
    The Legendre symbol chi_2(x(P)) = x^{(p-1)/2} in F_p is a lossy R1
    multiplicative-character projection of the affine point. Paired with
    Sigma={[2]}, either (A) chi_2(x([2]P)) is a function of chi_2(x(P)) on
    the two-letter alphabet {1, p-1} union {0}, or (B) it does not close
    and is priced by (L, b). KN-FIND-ffe1df family C closes quadratic
    characters as translation filters at level 1; 84755b P2 measures
    chi(x) under translation. This asks doubling-compatibility of
    chi_2(x). Stage-0 is a frozen two-value identity
    (chi_2(x), chi_2(x')) = (18, 1) on the named F_19 point. No pairing,
    Miller, or Tate. No exponent gain. Attack stage: collision structure.
  mechanism: >-
    Representation: R1 field representation — affine x in F_p, then the
    multiplicative character chi_2(x) = x^{(p-1)/2} (values in {0, 1, p-1}).
    Operation set Sigma = {[2]}, then recompute chi_2(x([2]P)). Trichotomy
    class: coordinate-dependent -- chi_2(x) is a function of the affine
    chart and of the quadratic character of F_p^*, not a homomorphism of
    the prime-order subgroup (Theorem C). One-line reason: a multiplicative
    character of one coordinate is not a class function of <P>. R1 class.
    Attack stage: collision structure (a 2-valued predicate), not
    factor-base membership and not pairing transfer.

    LOSSY-PROJECTION TEST against Sigma={[2]}. What is discarded: y, the
    magnitude of x beyond its quadratic class, and all other models.
    Lossy: alphabet size 3 (including 0) or 2 on F_p^*, so 1 < M << N.
    Discard compatibility: doubling produces x' as a rational function of
    (x, y); chi_2(x') is then well-defined. Unary closure of chi_2(x') as
    a function of chi_2(x) is Outcome A versus B. If A, the fibres are a
    block system of <[2]> and the open number is canonicalisation from a
    2-valued label (not a sum-compatible bucket). If B, measure (L, b)
    against identity, random {+/-1} labels, and relabelled Z/NZ.

    PAIR (representation, Sigma) = (affine x then chi_2, {[2]}).
    Not F4: this is not a pairing into F_{p^k}^*; it is a character of
    the base field applied to one affine coordinate. Miller and Tate are
    not used. Not 84755b P2 (chi(x) under translation). Not 1eb65c
    (cubic residue of y). Not family-C translation closure. Not a factor
    base (KN-OPEN-020 does not apply). Not cubical/biextension.

    STAGE-0 IDENTITY (independently computed on the frozen F_19 curve
    y^2=x^3+x-1, P=(2,3), [2]P=(16,11)): chi_2(u)=u^9 in F_19.
    2^9 ≡ 18 and 16^9 ≡ 1. Quadratic reciprocity (2/19)=-1 confirms
    the first value. Nearby-object control Q=(1,1) (on-curve:
    1=1+1-1), [2]Q=(2,16): chi_2(1)=1, chi_2(2)=18. On P the pair
    chi_2(y) happens to equal (18,1) as well; that is a coincidence of
    this one point and is not the object. Q separates them
    (chi_2(y(Q)), chi_2(y([2]Q))) = (1, 1).
