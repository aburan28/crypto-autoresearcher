# =============================================================================
# IDEA-20261006-6c27fc — lex versus grevlex on one toy S_4 cell.
# Proposal only. No hypothesis and no experiment contract in this pass.
# Novelty is unverified. This session opened the named frontier rows
# and did not run a solver.
# =============================================================================
idea:
  id: IDEA-20261006-6c27fc
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Lex mean exceeds grevlex mean by at least 2 on one F_17, B = 4 cell
  class: control
  claim: >-
    On the first ordinary short-Weierstrass curve over F_17, with
    m = 3 and one factor base of B = 4 x-coordinates, eight targets
    drawn from the prime-order subgroup, the mean lex solving degree
    of the eight S_4 systems exceeds the mean grevlex solving degree
    of the same eight systems by at least 2. The same gap of at least
    2 holds on a second ordinary curve over the same field. A finished
    primary difference of 0 or less is a negative: lex is not harder.
    A finished difference of 1 fails the minimum effect and is also a
    negative. No exponent improvement is claimed. Representation class
    R1; attack stage relation decomposition.
  mechanism: >-
    The tracked object is the integer difference of two means of
    d_solve on one fixed ideal, computed once under lex and once
    under grevlex. The generators do not change. Only the monomial
    order changes. Lex eliminates one variable at a time and can
    build higher-degree polynomials before the basis stabilizes.
    Grevlex spreads the degree across variables. The lossy
    projection keeps one integer per order and discards the basis.
    The priced number is the difference of the means. A gap of at
    least 2 means a degree table that names only grevlex does not
    describe lex. A difference of 0 or less means the order did not
    raise the degree on this cell.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials and the resultant recursion fix the
        generator. They do not, in that row, compare lex with grevlex.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-0d2021
      provenance: internal
      claim: >-
        Degree-of-regularity refinements for semi-regular sequences
        are recorded there. They are not a lex-minus-grevlex gap of 2
        on one prime-field cell.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-0d2021.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev index calculus is recorded there as
        not beating generic methods under stated assumptions. Baseline
        only.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  assumptions:
    - >-
      The same generators are solved under both orders. A change of
      polynomial, not only of order, voids the comparison.
    - >-
      Field equations are omitted on both orders. A basis element of
      total degree at least 17 voids that target on both orders.
    - >-
      Eight targets are scored on each curve. A short cell is
      inconclusive, not a difference of 0.
  predictions:
    - metric: >-
        mean lex d_solve minus mean grevlex d_solve, eight S_4
        systems, p = 17, B = 4, and the same difference on a second
        ordinary curve
      direction: higher
      minimum_effect: >-
        at least 2 on both curves. A finished primary difference of
        0 or less is the concrete negative. A finished difference of
        1 fails the minimum effect and is also a negative.
  minimal_test:
    design: >-
      Fix p = 17. Take the first two ordinary short-Weierstrass
      models in lexicographic coefficient order, skipping singular
      and trace-zero models. On each curve draw one seed-recorded
      factor base of four liftable abscissae and eight subgroup
      targets. Build S_4 by the resultant of two S_3 factors, one
      specialised at the target abscissa, plus the degree-4
      membership polynomials. Solve each system under lex and under
      grevlex with the same variable order x1 > x2 > x3. Report the
      two means and the integer comparison of their difference with
      2.
    controls:
      - >-
        Twelve support-matched random systems on the primary curve,
        solved under both orders. If their mean gap is also at least
        2, the order effect is not special to S_4. The random arm
        does not rewrite a finished S_4 difference of 0.
      - >-
        The second curve must show a gap of at least 2 as well. One
        curve at least 2 and the other at most 0 falsifies a stable
        order gap.
      - >-
        A second build of the same algorithm recomputes the eight
        primary grevlex degrees and must match exactly.
    required_metrics:
      - mean lex degree and mean grevlex degree on each curve
      - the difference on each curve
      - the random-arm difference
      - minimum and maximum degree under each order
  falsification_conditions:
    - >-
      The primary difference is 0 or negative on a complete cell of
      eight targets. Lex did not raise the degree.
    - >-
      The primary difference equals 1. The minimum effect of 2 failed.
    - >-
      One curve has difference at least 2 and the other has
      difference at most 0. The order gap is curve-dependent.
  confounders:
    - >-
      Lex and grevlex can report different degree transcripts for the
      same ideal because the solvers construct different intermediate
      polynomials. The definition of d_solve is frozen as the maximum
      total degree written in the transcript, on both orders.
    - >-
      A single hard target can move a mean of eight by a fraction.
      The threshold is 2, and the minima and maxima are reported.
  interpretation_limits:
    - >-
      One prime and B = 4. A gap here does not transfer to
      cryptographic p or to a larger base.
    - >-
      The comparison is not a bit-security claim and not a statement
      that grevlex beats Pollard rho.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For support-matched random systems of the same generator
        degrees, with field equations omitted, the mean lex solving
        degree exceeds the mean grevlex solving degree by at least 2
        at p = 17, on twelve replicates.
      rigorous_support: >-
        No identity forces lex to cost two extra degrees on summation
        polynomials. The assumption imitates the classical fact that
        lex Groebner bases can have doubly exponential degree while
        grevlex stays closer to the Macaulay bound, which is a
        worst-case statement for generic ideals and is not a theorem
        for these twelve random systems. KR-IC-0d2021 records
        refinements of degree-of-regularity estimates and does not
        state this gap.
      validation_plan: >-
        The twelve random systems are the validation. Compare their
        mean gap with 2. Tail check: the maximum lex degree minus the
        minimum grevlex degree on those twelve. Parameters are
        p = 17 and the S_4 generator degrees only. No extrapolation.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. Rho memory and the van Oorschot-Wiener interpolation
      stay as they are.
    best_known: >-
      Pollard rho at Theta(N^{1/2}), with KR-IC-5931ee the prime-field
      Semaev negative under its stated assumptions.
    hidden_overhead: >-
      None. No attack formula is stated, so no o(1) term is concealed.
    tradeoff_note: >-
      No tradeoff is proposed. The output is a difference of two toy means.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
