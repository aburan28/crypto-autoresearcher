idea:
  id: IDEA-20260816-1af57f
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: Decide computationally whether the bit-ordering change reported between the submission and
    SP 800-232 is a CONJUGATION of the permutation by a fixed bit-index permutation -- exhibiting
    the witness if it is -- because that single fact partitions every exploited property into re-indexable
    and re-derivable, and it can be settled without reading a single published attack
  class: representation
  claim: '(A) A change of bit or byte ordering is either a relabelling of state coordinates or it
    is a change of function. If there exists a fixed bit-index permutation P such that the standardized
    permutation equals P composed with the submission-convention permutation composed with P inverse
    -- that is, the two are CONJUGATE by a coordinate relabelling -- then every property invariant
    under coordinate relabelling transfers unchanged, and only positionally specified data (a specific
    trail mask, a specific cube index set, a specific constant''s byte position) needs re-indexing
    through P rather than re-derivation. If no such P exists, the ordering change is a genuine change
    of function and no property is entitled to transfer by relabelling alone. (B) This is a decidable
    computational question over a pinned pair of implementations, and it is answerable with no literature
    access whatsoever: search for P over the structured candidate space the specification itself suggests
    (byte reversal within words, bit reversal within bytes, word-order permutations and their compositions
    -- a space of modest size, not 320 factorial), verify a candidate by exhaustive agreement on a
    large random input sample and then by a structural check on the linear layer''s matrix, and report
    either the witness P or the exact candidate space in which no witness was found. (C) NOT CLAIMED:
    that a witness exists; that any published property is or is not relabelling-invariant; that the
    absence of a witness in the searched candidate space means no witness exists anywhere -- the searched
    space is declared and the unsearched remainder is named. NOT CLAIMED: any attack, any security
    consequence, any statement about literature. (D) The deliverable, either way, is a partition of
    property CLASSES into relabelling-invariant and positionally specified, which is a column of the
    applicability table that can be filled before any result is ever read.'
  mechanism: 'Stage one pins two implementations: the standardized convention and the other reported
    convention, both validated against whatever declared test vectors exist for each, since a wrong
    implementation here would answer a question about a fiction. Stage two enumerates the structured
    candidate space for P: the group generated by byte-reversal within 64-bit words, bit-reversal
    within bytes, bit-reversal within words, and permutations of the five state words, giving a few
    thousand candidates rather than an astronomical space. Stage three tests each candidate by checking
    the conjugation identity on a large random input sample at one round and, for survivors, at every
    round count from 1 to the full count -- a candidate that conjugates one round but not two is not
    a witness. Stage four, for any survivor, verifies the identity structurally: check that P maps
    the linear layer''s matrix to the other convention''s matrix exactly, and that P maps the round-constant
    schedule to the other schedule exactly, which turns a sampled agreement into an exact statement.
    Stage five, whether or not a witness is found, emits the property-class partition: which property
    classes are invariant under an arbitrary coordinate relabelling, which are positionally specified
    and re-indexable given P, and which are neither.'
  novelty_status: unverified
  novelty_screen:
    method: 'Shared repository screen: grep -ril ascon over ledger/proposals, ledger/hypotheses, ledger/evidence
      and experiments; grep -il little-endian and endian over ledger/proposals/*.yaml; grep -il for
      round constant and IV constant over the same; grep -il capacity over the same. Read: ledger/questions/RQ-ASCON-2dfd8b.yaml
      in full (its provenance block reports a switch to little-endian bit order as one of the differences
      and marks every figure UNVERIFIED), ledger/goals/GOAL-ASCON-001.yaml first 60 lines, docs/inventor-protocol.md
      sections 1 through 8 including the section 8 observation-collision and quantifier-order audits,
      and the header of knowledge/techniques/KN-TECH-066.md.'
    results: The endian grep returned ten proposal filenames before truncation -- IDEA-20260808-25fca0,
      IDEA-20260808-2fabbc, IDEA-20260808-917e63, IDEA-20260808-9d6677, IDEA-20260808-b16d04, IDEA-20260809-1b5b15,
      IDEA-20260809-2ba70c, IDEA-20260809-7f2d9c, IDEA-20260809-c4ecac and IDEA-20260809-ce875b --
      filenames seen, contents NOT read, and a Coordinator must read them before approval; that is
      filed as a derivation gap. The grep for round constant and IV constant over ledger/proposals/*.yaml
      returned ZERO files, so no proposal in this repository currently treats a constant schedule
      as an object. The ascon grep returned no ledger record at all. RQ-ASCON-2dfd8b's provenance
      block itself reports the endianness switch and simultaneously marks every reported figure UNVERIFIED,
      which is exactly the condition this record is built to work under.
    verdict: 'UNVERIFIED. Nothing here asserts what any external literature contains, and the record
      is constructed so that no such assertion is needed: the conjugation question is settled by computation
      over two pinned implementations. Claimed NEW relative to this repository: framing the reported
      ordering change as a conjugacy question with an explicit witness search over a structured candidate
      space, and deriving from its answer a partition of property classes into re-indexable and re-derivable
      that fills an applicability-table column before any result is read. ASSEMBLED FROM KNOWN PARTS:
      conjugation by a coordinate permutation is elementary; the observation-collision and quantifier-order
      audits are docs/inventor-protocol.md section 8; the requirement that the null run identically
      alongside the signal is section 3.'
  object_first_candidate:
    tracked_object: 'The candidate conjugation witness P: a permutation of the 320 state bit positions,
      drawn from the structured group the specification''s own conventions generate, carried through
      the conjugation identity at each round count. What is followed is the WITNESS, not the state
      -- each round of the two permutations is used only as a test the witness must pass.'
    lossiness: 'Genuinely lossy. Discarded: every state value, every round-constant value, every nonlinear
      detail -- the object retains only the index structure of the state, that is, which position
      goes where. The discard is compatible with the target operation because conjugation is exactly
      the operation that acts on index structure: if P conjugates the round function, it conjugates
      any composition of round functions, so the retained index data propagates deterministically
      without the values. Nothing about a state value can be reconstructed from P, and infinitely
      many pairs of functions share any given P as a non-witness, so this is not a change of coordinates
      in the pejorative sense -- although P IS literally a change of coordinates, which is the joke
      worth stating plainly: the object here is the change of coordinates itself, promoted from bookkeeping
      to the thing being measured.'
    propagation: One round acts on the candidate P by either preserving or destroying the conjugation
      identity. Concretely, P must simultaneously conjugate the substitution layer (which requires
      P to map the S-box's bit slices onto bit slices as whole units, a strong constraint), conjugate
      the linear diffusion layer (which requires P to map the layer's matrix to the other convention's
      matrix exactly), and map the round-constant schedule to the other schedule (which requires P
      to move constant bits to the positions the other convention puts them in). A candidate surviving
      one round need not survive two, because the constant schedule differs per round; so the propagation
      step is the accumulation of these three constraints across rounds, and the survival of P across
      all round counts is the property being measured.
    survival_score: Stated concretely as the largest round count at which each candidate P still satisfies
      the conjugation identity, reported as a histogram over the candidate space. A witness survives
      all round counts; a near-miss surviving the substitution and diffusion layers but dying at the
      constant schedule is itself an informative outcome, because it says the two conventions differ
      only in constant placement, which is a weaker and separately checkable difference. The object
      dissolves for candidates that fail at round one, which is expected for the overwhelming majority
      of the candidate space.
  null_object_control: 'RANDOM BIT-INDEX PERMUTATIONS of the same state size, drawn from a recorded
    seed in the same invocation, subjected to the IDENTICAL conjugation test at every round count.
    For a surviving structured candidate to mean anything, the random arm must show ZERO survivors
    past round one out of a large declared draw: if random relabellings conjugate the permutation,
    then the identity is not constraining and a structured survivor carries no information. A second
    null tests the structured candidates against a deliberately modified permutation (one round constant
    altered), where every candidate must die, confirming the test has teeth against a small perturbation
    rather than only against gross ones.'
  discriminated_from:
  - The ten proposals matched by the endian grep (IDEA-20260808-25fca0, 2fabbc, 917e63, 9d6677, b16d04,
    IDEA-20260809-1b5b15, 2ba70c, 7f2d9c, c4ecac, ce875b), seen by filename only. None can concern
    Ascon since grep -ril ascon returned no ledger record; a Coordinator must read them to confirm
    none already frames an ordering change as a conjugacy question, and that is a declared derivation
    gap rather than an assertion of clearance.
  - KN-TECH-066 (rebound, message modification, internal differentials). That technique constructs
    differences that survive a permutation; this record constructs no difference and evaluates the
    permutation only as an oracle a candidate relabelling must commute with.
  - A test-vector comparison between two implementations. That would establish only that two implementations
    differ; this establishes whether they differ BY A RELABELLING, which is a strictly stronger and
    structurally different statement, and it produces a witness rather than a mismatch.
  - The group-law rigidity theorem lane (IDEA-20260807-df906f), named in this session's briefing as
    an established internal result about the ECDLP. That work concerns rigidity of an algebraic group
    law under structure-preserving maps; this concerns conjugacy of a fixed bit permutation over a
    symmetric primitive, shares no object, and re-derives nothing from it.
  - IDEA-20260807-c4f1fc, which proposes a cryptanalytic lane against a construction's use of a hash.
    This record runs no cryptanalysis and produces no distinguisher; its output is a witness or a
    searched-space statement.
  assumptions:
  - Two implementations, one per reported convention, can be pinned from primary text and validated;
    without both, the conjugation question has only one side and is void.
  - The structured candidate space -- byte reversals, bit reversals, word permutations and their compositions
    -- is where a specification-level ordering witness would live if one exists; searching outside
    it is not attempted and the unsearched remainder is named explicitly rather than dismissed.
  - Sampled agreement on a large random input set, followed by an exact structural check of the linear
    layer and constant schedule, is sufficient to promote a candidate from probable to exact.
  - Property classes can be partitioned into relabelling-invariant and positionally specified by inspection
    of what each class quantifies over, without reference to any specific published result.
  - A near-miss candidate that conjugates the substitution and diffusion layers but not the constants
    is a meaningful intermediate outcome and not merely a failure, so the experiment records per-layer
    survival separately.
  predictions:
  - metric: number of random bit-index permutations surviving the conjugation identity past round
      one, out of 100000 draws
    direction: lower
    minimum_effect: exactly 0, a forced value; any survivor indicates the identity is not constraining
      and the whole test is void
  - metric: number of structured candidates surviving all round counts
    direction: different
    minimum_effect: 'no pre-commitment, and the refusal is deliberate: this program has not pinned
      either convention, so predicting whether a witness exists would be invention rather than prediction.
      Both 0 and 1 are fully reportable outcomes with different consequences for the property partition'
  - metric: number of structured candidates surviving the substitution and diffusion layers but failing
      the constant schedule
    direction: different
    minimum_effect: no pre-commitment; this near-miss count is the most informative secondary number
      and inventing a value for it would be dishonest
  - metric: structured candidates surviving against the deliberately constant-perturbed permutation
    direction: lower
    minimum_effect: exactly 0, a forced value confirming the test detects a single-constant change
  minimal_test:
    design: 'Implement both conventions as bitsliced permutations over a 320-bit state and validate
      each against its declared test vectors. Enumerate the structured candidate group -- byte reversal
      within words, bit reversal within bytes and within words, and the 120 word-order permutations,
      closed under composition, a few thousand elements. For each candidate P and each round count
      r from 1 to the full count, check the identity on 1000 random states: apply P, run r rounds
      of convention A, apply P inverse, and compare against r rounds of convention B. Record the largest
      surviving r per candidate and, separately, per-layer survival for the substitution layer, the
      diffusion layer and the constant schedule. In the same invocation, run the identical test over
      100000 random bit-index permutations, and run the structured candidates against a constant-perturbed
      permutation. Total cost: minutes of CPU. The discriminating output is one witness, or a candidate-space
      statement with the unsearched remainder named.'
    controls:
    - 'Random bit-index permutation null: 100000 uniform draws, identical test, same invocation, seeds
      recorded, expected zero survivors past round one.'
    - 'Constant-perturbed permutation control: the structured candidates tested against a permutation
      with one round constant altered, where every candidate must die.'
    - 'Identity-candidate positive control: P equal to the identity must conjugate a permutation with
      ITSELF at every round, confirming the test can return true at all.'
    - 'Per-layer decomposition: substitution, diffusion and constant schedule tested separately as
      well as jointly, so a near-miss is visible rather than collapsed into a failure.'
    - Test-vector gate on both implementations before any candidate is tested.
    - Exact structural verification of any sampled survivor against the linear-layer matrix and the
      constant schedule, so no witness is ever asserted from sampling alone.
    required_metrics:
    - per-candidate largest surviving round count, as a histogram over the structured candidate space
    - per-layer survival counts (substitution / diffusion / constant schedule) for the structured
      candidates
    - random-null survivor count past round one out of the declared draw
    - constant-perturbed control survivor count
    - exact structural verification outcome for each sampled survivor
    - test-vector agreement for both implementations
    - declared size of the searched candidate space and an explicit description of the unsearched
      remainder
  falsification_conditions:
  - Any random bit-index permutation survives past round one, showing the conjugation identity is
    not constraining and voiding the test.
  - The identity-candidate positive control fails, showing the test cannot return true.
  - Any structured candidate survives the sampled test but fails the exact structural verification,
    showing sampling was promoting false witnesses.
  - Any structured candidate survives against the constant-perturbed permutation, showing the test
    is insensitive to a single-constant change.
  - Either implementation fails its declared test vectors, voiding both sides of the identity.
  - The structured candidate space cannot be enumerated within budget, in which case the searched
    space is reported smaller and the unsearched remainder correspondingly larger -- a budget outcome,
    never mathematical evidence.
  confounders:
  - Both implementations are written by the same agent, so a shared misreading of a convention would
    produce a spurious witness or a spurious non-witness; the test-vector gate on each side separately
    is the only defence and it depends on vectors existing for both conventions.
  - A witness could exist outside the structured candidate space, so a null result is bounded by the
    space searched and must never be reported as no witness exists.
  - Sampled agreement on 1000 random states can pass by chance for a permutation with low effective
    diffusion at r=1, which is why survivors are promoted only by exact structural verification.
  - If the two conventions also differ in the IV or in the round-constant values -- which the RQ reports
    as separate differences -- then a failure of the conjugation test may be attributable to those
    rather than to ordering, and the per-layer decomposition is what separates the two.
  - The word-order permutation subgroup interacts with the diffusion layer's per-word rotations, so
    a candidate could conjugate diffusion for a reason unrelated to ordering; this shows up as a near-miss
    and must be reported rather than counted as a witness.
  interpretation_limits:
  - A witness P means positionally specified data can be re-indexed; it does NOT mean any particular
    published result transfers, because this program cannot read any published result and asserts
    nothing about them.
  - A null result within the searched space means no witness was found in that space, never that none
    exists.
  - The property-class partition is a taxonomy produced by this program and is a hypothesis about
    what re-indexing suffices for, not a proof.
  - 'Nothing here is a security statement of any kind, in either direction, and a witness in particular
    is neutral: it says a change was cosmetic in a precise technical sense, not that the design is
    strong.'
  target_complexity:
    time_exponent: No attack exponent is claimed. The search cost is the structured candidate-space
      size times the round count times the sample size, a few thousand times a dozen times a thousand
      permutation evaluations.
    memory_exponent: No attack exponent is claimed. Memory is the candidate list plus one state, negligible.
    best_known: The incumbent is the implicit assumption that a change of bit ordering is cosmetic
      and therefore harmless to existing analysis. That assumption is the thing this record proposes
      to convert into a checked statement with a witness, and within this repository it has no competitor
      -- the round-constant and IV-constant greps over ledger/proposals returned zero files.
    hidden_overhead: The hidden cost is entirely in obtaining and correctly implementing BOTH conventions
      with independent test vectors. Implementing the second convention is the harder half, since
      it is the older document and its vectors may be less accessible, and a program that implements
      it from a description rather than from vectors has manufactured its own answer. A second hidden
      cost is the property-class partition, which is human taxonomy work with no compute component
      and no obvious stopping point.
  dominated_by: 'n/a (no result claimed). Pareto check across all three axes explicitly: time -- no
    attack time is produced, so no frontier row exists; memory -- the search is memory-negligible
    and produces no attack memory figure; data/queries -- zero oracle queries, since both permutations
    are evaluated offline. Each axis was considered rather than the field being defaulted.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative delta is that
    an assumption currently carried in words is replaced by either an exhibited witness verified structurally
    against the linear layer and constant schedule, or a statement of a searched candidate space of
    declared size with its unsearched remainder named -- against a prior state of zero records in
    this repository treating a constant schedule or an ordering convention as an object.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separately: that both conventions can be pinned with independent test
    vectors in this environment, about 0.2, and this is the binding constraint on the whole record.
    That the random-permutation null returns zero survivors, above 0.98, since conjugating a nonlinear
    permutation by a random relabelling is overwhelmingly unlikely. That the structured candidate
    space is enumerable and testable within minutes, above 0.9. That a witness is found IF both conventions
    are pinned, about 0.5 -- a pure ordering change often is a conjugation, but a simultaneous change
    of constants would break the identity and the RQ reports both changes together, which is exactly
    why the per-layer decomposition exists. That the property-class partition survives Coordinator
    review as a usable applicability-table column, about 0.4, since taxonomy work of this kind is
    easy to write and hard to make load-bearing.'
