idea:
  id: IDEA-20260901-7b8856
  question_id: RQ-VOLC-f6253b
  research_question: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    DEPTH IS VISIBLE ON THE PRIME-ORDER SUBGROUP, AND IT IS VISIBLE AS EXACTLY ONE
    PUBLIC AFFINE SCALAR: the canonical generator of End(E) acts on G as
    lambda(f_E) = (1 - A) * f_E * f^{-1} mod N, computable in O(log p) bit
    operations with NO isogeny computation, so the endomorphism-image oracle is
    simulable with O(log p) overhead UNIFORMLY IN DEPTH and under the CORRECT
    premise End_{F_p}(E) = O_{f_E}, repairing the false premise recorded in
    KN-FIND-b7e091 while strengthening rather than weakening its closure -- and
    the accompanying zero-compute negative is that the characteristic congruence
    lambda must satisfy is provably LEVEL-BLIND, being equivalent to N dividing
    #E(F_p) and to nothing else
  class: mechanism

  claim: >-
    STATED AS FIVE SEPARABLE CLAIMS. A, B, C ARE DERIVATIONS COSTING NO COMPUTE.
    D IS THE CORRECTION THEY LICENSE. E IS THE MEASUREMENT THAT CAN FALSIFY THEM.
    NO ATTACK IS PROPOSED AND NO ECDLP EXPONENT MOVES.

    (A) THE SCALAR, DERIVED. Let E/F_p be ordinary with trace t, Frobenius pi,
    D = t^2 - 4p = f^2 D_0 with D_0 fundamental, End_{F_p}(E) = O_{f_E} for some
    f_E dividing f, and m := f / f_E. Write omega_K = (D_0 + sqrt(D_0))/2 when
    D_0 = 1 mod 4 and omega_K = sqrt(D_0)/2 when D_0 = 0 mod 4, so that
    O_{f_E} = Z[theta] with theta := f_E * omega_K. Then pi = A + m * theta with
    A = (t - f D_0)/2 in the first case and A = t/2 in the second, because
    pi = (t + f sqrt(D_0))/2 in both. Let G = <P> subset E(F_p) have PRIME order
    N with N not dividing m. Frobenius fixes every F_p-rational point, so
    pi restricted to G is the identity, i.e. the scalar 1 in Z/N. Applying the
    identity pi = A + m theta on G and solving for the scalar by which theta acts
    gives, EXACTLY,
      lambda(theta) = (1 - A) * m^{-1} = (1 - A) * f_E * f^{-1}  (mod N).
    Every phi in End_{F_p}(E) = Z + Z theta acts on G as the scalar
    a + b * lambda(theta) mod N, so the ENTIRE action of the endomorphism ring on
    the prime-order subgroup is determined by this one residue.

    (B) THE ACTION IS LINEAR IN THE LEVEL, AND THE LEVEL IS AN AFFINE LABEL.
    Write c := (1 - A) * f^{-1} mod N, a class-level constant fixed by (p, t, f,
    D_0) alone. Then lambda(theta) = c * f_E mod N. Since every candidate
    conductor f_E divides f and f <= 2 sqrt(p) < N for a prime-order curve, the
    map f_E |-> c * f_E mod N is INJECTIVE on the divisors of f. So the volcano
    position is not invisible on G at all: it is recorded on G exactly as a scalar
    on the arithmetic progression c * Z, and it is recoverable from that scalar in
    O(log p) bit operations as f_E = lambda * c^{-1} mod N. What is true, and is
    the sharper statement this record substitutes for "depth is invisible on G",
    is that NO SEQUENCE OF GROUP OPERATIONS ON G CAN DECIDE WHICH POINT OF THAT
    PROGRESSION IS THE TRUE ONE -- see (C).

    (C) THE ZERO-COMPUTE NEGATIVE: THE CHARACTERISTIC CONGRUENCE IS LEVEL-BLIND.
    A natural hope is that the true level is pinned down by requiring the scalar
    to satisfy theta's characteristic congruence. It is not. For D_0 = 0 mod 4 the
    congruence is lambda^2 = f_E^2 D_0 / 4 mod N; substituting lambda = c f_E and
    cancelling the invertible factor f_E^2 leaves c^2 = D_0/4 mod N, with NO f_E
    in it. For D_0 = 1 mod 4 the congruence is
    lambda^2 - f_E D_0 lambda - f_E^2 (D_0^2 - D_0)/4 = 0 mod N; the same
    substitution leaves c^2 - D_0 c - (D_0^2 - D_0)/4 = 0 mod N, again with no
    f_E. Moreover the surviving congruence is not new information: in the
    D_0 = 0 mod 4 case c = (2 - t)/(2f), so c^2 = D_0/4 unwinds to
    (2 - t)^2 = f^2 D_0 = t^2 - 4p mod N, i.e. to 4 - 4t = -4p, i.e. to
    p + 1 - t = 0 mod N, which is just the statement that N divides #E(F_p). THE
    CONGRUENCE TESTS THE CURVE ORDER AND NOTHING ELSE. Consequently, for every
    divisor d of f the map T_d : G -> G, P |-> [c d mod N] P is a well-defined
    endomorphism of G satisfying the level-d congruence, whether or not
    O_{f} / d is the true endomorphism ring; the false levels are
    OPERATIONALLY INDISTINGUISHABLE from the true one inside G. This is an
    observation collision in the sense of KN-TECH-080 audit 2, exhibited
    constructively rather than searched for.

    (D) THE CORRECTION TO THE ORACLE-D CLOSURE, WHICH STRENGTHENS IT.
    KN-FIND-b7e091 closes the endomorphism-image oracle at exponent 1/2 by the
    argument that for prime-order prime-field curves End_{F_p}(E) = Z, so every
    phi = [m'] and phi(Q) = [m']Q is computable in m' group operations. That
    premise is FALSE for every elliptic curve over a finite field: pi is an
    endomorphism of degree p and [m'] has degree m'^2, and a prime is never a
    square, so Z is never the whole F_p-rational endomorphism ring; and the
    quoted cost m' group operations is also wrong by an exponential, since [m']Q
    costs O(log m') by double-and-add. Claim (A) supplies the repair and the
    repair is stronger than the original: with the TRUE ring O_{f_E}, an
    Oracle-D simulator that is given the level computes lambda(theta) in O(log p)
    bit operations WITH NO ISOGENY COMPUTATION, WITH NO EVALUATION OF ANY
    ENDOMORPHISM, and with cost INDEPENDENT OF THE VOLCANO DEPTH -- even though
    the minimal non-scalar endomorphism has degree of order |D_0| f_E^2 / 4
    (IDEA-20260811-565915), which at the floor of a deep volcano is of order p and
    whose direct evaluation would cost about sqrt(p) field operations, i.e. the
    birthday bound itself. So the naive worry that the simulator becomes as
    expensive as the DLP at depth is answered in the negative, by an identity
    rather than by an appeal. The closure at exponent 1/2 stands, now on a true
    premise and uniformly over the volcano.

    (E) WHAT IS NOT CLAIMED. No ECDLP speedup, no exponent movement, no claim
    about any deployed curve, no claim that KN-FIND-b7e091 or KN-FIND-002 is
    wrong in its CONCLUSION. This record does not edit either finding and has no
    authority to; it supplies a derivation and a cheap test that the routed
    review-breakthrough round can use. Where the two records disagree about the
    incidence oracle this record takes no side, because nothing here depends on
    the incidence oracle; that dependency is stated rather than resolved.

  mechanism: >-
    The causal chain is short and entirely arithmetic. (1) Frobenius acts as the
    identity on F_p-rational points, so on the prime-order subgroup pi is the
    known scalar 1 -- this is the only input that is not formal. (2) The
    Deuring-Waterhouse sandwich Z[pi] subset End_{F_p}(E) subset O_K makes
    End_{F_p}(E) = Z[theta] a rank-2 order, and pi = A + m theta expresses
    Frobenius in that order with m = f/f_E the index [O_{f_E} : Z[pi]]. (3)
    Because the order is generated by one element over Z, the whole ring action on
    a prime-order subgroup is determined by one residue, and step (1) solves for
    it in closed form. (4) The level enters that residue only as the multiplier
    f_E, hence linearly, hence invertibly -- so the level is CARRIED by G but not
    CERTIFIABLE inside G, because the fake action T_d is computable for every
    candidate d without knowing anything. The mechanism therefore explains both
    halves of the RQ's decision target at once: why every depth-conditioned
    quantity vanishes when restricted to G (all candidate levels give valid group
    endomorphisms), and why the vanishing is not an information-theoretic
    emptiness of the kind KN-TECH-73630e proves for the prime-to-p torsion lift
    (there the lift is isomorphic to the original instance; here the level is
    genuinely present in the scalar and genuinely unverifiable from inside).

  novelty_status: unverified

