  object_first_candidate:
    tracked_object: >-
      THE SCALAR lambda IN Z/N BY WHICH THE CANONICAL GENERATOR theta = f_E
      omega_K OF End_{F_p}(E) ACTS ON THE PRIME-ORDER SUBGROUP G -- one residue
      class mod N, followed as the curve moves through the volcano. Established
      families in this lane declared OFF-LIMITS as the primary lens for this
      record: the level label v_ell(f_E) and the level vector; the conductor f_E
      as a regressor; the endomorphism DEGREE; the group-structure invariants n_1,
      n_2; the height process of a walk; per-curve cost batteries stratified by
      level. The object here is none of these: it lives in Z/N, not in the curve
      or the graph.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST, AND THE PROOF IS THE RECORD'S CLAIM (C).
      The projection (E, End(E), G) |-> lambda in Z/N discards the j-invariant,
      the curve equation, the isogeny graph position, the class-group element, the
      full torsion structure, and every non-scalar feature of the ring action --
      retaining one residue. It is emphatically not a change of coordinates: the
      fibre over a given lambda contains, for a fixed class, every curve whose
      conductor is the corresponding divisor, which is h(O_{f_E}) curves, an
      exponentially large set at cryptographic size. Compatibility with the
      target's operations holds and is exactly what makes the object usable: the
      retained scalar propagates DETERMINISTICALLY under the group law, since
      lambda is by construction the multiplier of a group endomorphism, and under
      an ell-isogeny with ell != N it propagates by the transport theorem T1
      composed with the level change, multiplying by ell or by 1/ell according to
      whether the step descends or ascends. What is discarded (everything outside
      G) is discarded compatibly because no group operation on G can see it. The
      canonical failure mode the protocol warns about -- a projection that loses
      nothing, like (x xor y, x*y) in characteristic 2 -- does not occur here, and
      claim (C) is the constructive demonstration: the fibre is not merely large,
      it is not even separable from inside, since T_d is computable for every
      candidate d.
    propagation: >-
      ONE-STEP PROPAGATION IS DEFINED AND MEASURABLE. Under a descending
      ell-isogeny phi : E -> E' (conductor multiplied by ell, so f_E' = ell f_E,
      m' = m/ell), the class constant c is unchanged because it depends only on
      (t, f, N), and lambda transforms as lambda' = ell * lambda mod N. Under an
      ascending step lambda' = lambda * ell^{-1} mod N. Under a horizontal step
      lambda is unchanged. These are three exact, testable rules with no free
      parameters, and they are checkable on any enumerated toy volcano by
      comparing the predicted lambda of each vertex against the vertex's
      independently assigned level. A single vertex violating them refutes the
      object.
    survival_score: >-
      SURVIVES AS FAR AS THE ORDINARY PRIME-ORDER-SUBGROUP SETTING GOES, WHICH IS
      THE WHOLE RQ SCOPE, AND DISSOLVES AT FOUR NAMED BOUNDARIES. It dissolves (i)
      when N divides m, so m is not invertible mod N -- excluded for prime-order
      curves since m <= f <= 2 sqrt(p) < N, but it must be checked, not assumed;
      (ii) when G is not of prime order, where End(G) is no longer Z/N and the
      action need not be scalar -- the object then becomes a matrix and the whole
      analysis changes; (iii) in the supersingular case, where End is an order in
      a quaternion algebra and is not generated by one element over Z, so no
      single lambda exists -- out of scope here and the reason the object does not
      transfer to the isogeny-based post-quantum setting; (iv) for endomorphisms
      not defined over F_p, which do not act on G at all.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the campaign's adjudication is the
      simulability argument for the endomorphism-image oracle. KN-FIND-b7e091's
      version rests on End_{F_p}(E) = Z, which is false, so as committed the
      closure has no proof; the entire Layer-0 admissibility filter of
      DECOMPOSITION.md section 2 -- which every lane in GOAL-ENDO-001 is required
      to pass -- currently leans on it. Removing the bottleneck means exhibiting a
      simulator whose overhead is polylogarithmic under the TRUE endomorphism
      ring and uniformly in the volcano depth. Claim (A) is that simulator.
    baseline_embedding:
      parameter_slice: >-
        The old argument is the exact parameter slice f_E = f, m = 1 of the new
        one: when Z[pi] is already the full endomorphism ring the generator is
        theta = f omega_K, m = 1, and lambda = 1 - A, which is the degenerate case
        in which no inversion mod N is needed. The claimed premise
        End_{F_p}(E) = Z is NOT a parameter slice of anything, because it is
        satisfied by no curve; the honest statement is that the old argument has
        no valid slice and the new one has the m = 1 slice as its boundary.
      reproduction_check: >-
        SYMBOLIC, AND CHEAP. On any toy curve, verify (i) lambda satisfies the
        characteristic congruence of theta mod N; (ii) A + m * lambda = 1 mod N,
        which is the defining relation and is a one-line check; (iii) at m = 1 the
        formula degenerates to lambda = 1 - A with no inversion. A frozen fixture
        of ten (p, t, f, f_E, N, lambda) tuples with all three checks passing is
        the regression artifact.
    observation_collision:
      observable: >-
        The observable carrying the conclusion is the pair (action of End(E) on G,
        transcript of group operations on G) -- i.e. everything an
        Oracle-D-augmented generic algorithm can see.
      distinct_preimage_search: >-
        A COLLISION IS EXHIBITED, NOT MERELY SEARCHED FOR, AND IT IS CLAIM (C).
        For every divisor d of f the scalar c*d defines a valid group endomorphism
        of G satisfying the level-d characteristic congruence, so a curve at true
        level f_E and the hypothetical level-d structure produce IDENTICAL
        observables inside G, for all d | f. The two sides of the claimed
        conclusion -- "the level is readable from G" and "it is not" -- are
        separated by this collision in favour of the second. The collision is
        broken only by an out-of-G evaluation of theta, whose cost is
        Theta(sqrt(deg theta)) = Theta(f_E sqrt(|D_0|)) field operations
        (IDEA-20260811-565915), which at the floor of a deep volcano is of order
        sqrt(p). That is the additional condition that separates the collision and
        it is named rather than hidden.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the ring End_{F_p}(E) acting on G, together with any oracle
          returning its images, by the single residue lambda = c f_E mod N and
          ordinary scalar multiplication. The hypothesis "phi is an endomorphism"
          becomes the exact equality A + m lambda = 1 in Z/N.
        predicted_gain: >-
          Encoding is exact and costs O(log p) bit operations; completeness holds
          because Z + Z theta is the whole ring; soundness is the observation that
          any scalar action is realizable, which is precisely what makes the
          closure hold; the transfer loss is zero and the cost loss is
          O(log p) per query, independent of depth. This converts an oracle-class
          closure argument that had a false premise into an identity.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the G-transcript) fixed and vary the forgotten
          structure (the true conductor f_E among the divisors of f), then ask for
          an intrinsic invariant distinguishing the resulting objects. The answer
          is the degree of theta, which is intrinsic and level-dependent but not
          computable inside G.
        predicted_gain: >-
          Localises exactly where depth information lives: not in the scalar's
          value, which is computable for a lie as easily as for the truth, but in
          the DEGREE of the map realizing it. That is a statement about which
          resource a depth-consuming lane must buy (R3 as a ring, not R3 as a
          scalar), and it is the record's forward guidance.
    quantifier_order: >-
      EXPLICIT. For all ordinary E/F_p, for all prime-order subgroups G = <P> of
      E(F_p) with N not dividing m, there EXISTS a residue lambda in Z/N,
      computable in O(log p) bit operations from (p, t, f, D_0, f_E, N) alone,
      such that for all phi in End_{F_p}(E) and for all R in G,
      phi(R) = [a_phi + b_phi lambda] R where (a_phi, b_phi) are the coordinates
      of phi in the Z-basis {1, theta}. Note the order carefully: lambda is
      allowed to depend on the curve and on the class, and it does; it is NOT
      claimed to be uniform in anything. The negative half has the opposite order:
      for all d dividing f there EXISTS a valid group endomorphism of G with
      multiplier c*d, so no algorithm restricted to G can, for all curves,
      identify the true d.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is: the endomorphism-image
        oracle for ordinary prime-field curves with prime-order G is simulable
        with O(log p) bit-operation overhead per query given the level, uniformly
        in the volcano depth, and the level itself is not certifiable from inside
        G. It CANNOT certify anything about non-scalar structure (composite-order
        subgroups), about supersingular curves, about oracles returning field
        elements rather than group elements (R1), or about the incidence oracle.
        It also cannot certify that Oracle D is useless -- only that it is
        simulable, which is what the Shoup bound needs.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS IS THE COMPOSITE-ORDER
        SUBGROUP. Take G' of order N_1 N_2 with N_1, N_2 distinct primes; then
        End(G') is Z/N_1 x Z/N_2 and theta acts by a PAIR of scalars, so the
        single-residue argument breaks and the level enters through two
        independent congruences. Any proof of claim (A) that still goes through
        verbatim on G' is wrong, because on G' the endomorphism genuinely supplies
        a second congruence. This is the proves-too-much control and it must be
        run: the test harness must confirm that the derivation's key step -- pi
        restricted to G is the scalar 1 and End(G) = Z/N -- is the step that fails
        for G'.
    proof_obligations:
      - claim: >-
          pi restricted to G is the identity map, hence the scalar 1 in Z/N.
        responsibility: correctness
      - claim: >-
          End_{F_p}(E) = Z[theta] with theta = f_E omega_K, and pi = A + m theta
          with the stated A.
        responsibility: baseline
      - claim: >-
          m is invertible mod N whenever G has prime order N > f.
        responsibility: feasibility
      - claim: >-
          lambda = (1 - A) m^{-1} mod N and every phi acts as a_phi + b_phi lambda.
        responsibility: correctness
      - claim: >-
          The characteristic congruence for lambda = c f_E is independent of f_E
          and is equivalent to N | (p + 1 - t).
        responsibility: strictness
      - claim: >-
          The simulator runs in O(log p) bit operations per query, independent of
          f_E, whereas direct evaluation of theta costs Theta(f_E sqrt(|D_0|))
          field operations.
        responsibility: runtime
      - claim: >-
          Scope: ordinary, prime-order G, F_p-rational endomorphisms only.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      E is ordinary over F_p with p > 3, so D = t^2 - 4p < 0 and the
      Deuring-Waterhouse sandwich applies. Supersingular curves are out of scope
      and the object does not survive there.
    - >-
      G has PRIME order N and N does not divide m = f/f_E. Both are checkable in
      O(log p) and both must be checked rather than assumed.
    - >-
      The level f_E is supplied as an input to the simulator. This record does NOT
      claim the level is cheaply computable; that is the subject of
      IDEA-20260901-c7e601, and claim (C) proves it cannot be obtained from inside
      G at any cost.

  predictions:
    - metric: >-
        defining_relation_residual: the value of (A + m * lambda - 1) mod N,
        computed on every curve of an enumerated toy isogeny class with an
        independently assigned level
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO on every curve, with zero tolerance -- this is an identity,
        not a statistic. A single non-zero residual on a correctly levelled curve
        refutes claim (A) outright and the record is withdrawn.
    - metric: >-
        anchor_agreement_j0: on a class containing j = 0 (D_0 = -3), the residual
        (lambda_zeta3 - 1 - c * f_E) mod N, where lambda_zeta3 is the scalar of
        the order-3 automorphism (x, y) |-> (zeta_3 x, y) obtained directly from
        the explicit automorphism, and c = (1 - A)/f
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO. This is the record's one anchor in which the endomorphism is
        evaluated HONESTLY, by applying an explicit rational map, rather than
        predicted; it is the only prediction that can fail for a reason other than
        a transcription error, since it tests the generator convention
        theta = f_E omega_K and the identification omega_K = zeta_3 - 1 at
        D_0 = -3. A non-zero residual localises the error to the convention rather
        than to the mechanism.
    - metric: >-
        false_level_indistinguishability: the number of divisors d of f for which
        the map T_d : P |-> [c d mod N] P is a well-defined endomorphism of G
        satisfying the level-d characteristic congruence
      direction: higher
      minimum_effect: >-
        ALL of them -- the count must equal the number of divisors of f, i.e.
        #div(f), which on the committed p = 4001, t = 30 class with f = 16 is 5.
        Any d that fails refutes claim (C) and would mean the level IS partially
        certifiable from inside G, which would be the far more interesting outcome
        and would open a lane rather than close one.
    - metric: >-
        random_scalar_rejection: the fraction of uniformly random lambda' in Z/N
        (not on the progression c*Z) that satisfy the characteristic congruence
      direction: lower
      minimum_effect: >-
        At most 2/N, i.e. zero in practice over 10^4 random draws. This is the
        NULL-OBJECT control: the congruence must have resolution -- it must reject
        scalars that are not endomorphism multipliers -- otherwise the previous
        prediction is vacuous. An instrument that accepts random scalars has no
        power and every other reading is void.
    - metric: >-
        simulator_cost_vs_level: measured bit operations of the O(log p) simulator
        as a function of f_E across all levels of the enumerated class, and,
        separately, measured field operations of a direct Velu evaluation of theta
        at each level
      direction: different
      minimum_effect: >-
        The simulator cost must be FLAT in f_E within a factor 2 (no depth
        dependence), while the direct evaluation must grow at least linearly in
        f_E, giving a measured ratio spanning at least a factor 16 across the five
        levels of the p = 4001 class. This is the record's decay test in reverse:
        the quantity that is supposed to be depth-independent must fail to grow
        when depth grows, and the quantity that is supposed to grow must grow. If
        BOTH are flat, the direct-evaluation instrument is broken and no
        conclusion may be drawn from either.

  minimal_test:
    design: >-
      FOUR STEPS, ALL AT TOY SCALE, ALL IN PURE PYTHON, NO SAGE, NO ISOGENY CODE
      REQUIRED FOR STEPS 1-3. STEP 1 (seconds; zero-compute in substance): on the
      committed p = 4001, t = 30 class (D = -15104 = -59 * 16^2, D_0 = -59,
      f = 16, five levels f_E in {1, 2, 4, 8, 16}; identification per
      IDEA-20260821-ad7c97 and H-VOLC-707f6c, which must be re-derived here and
      not taken on trust), compute A = (t - f D_0)/2, c = (1 - A) f^{-1} mod N for
      the largest prime factor N of #E, and lambda_d = c*d for every d | f; check
      the defining relation A + (f/d) lambda_d = 1 mod N and the level-d
      characteristic congruence for all five d. Emit the fixture. STEP 2
      (seconds): the null-object control -- draw 10^4 uniform lambda' in Z/N and
      record the fraction satisfying the level-d congruence for each d; it must be
      at most 2/N. STEP 3 (seconds): the composite-order proves-too-much control
      -- repeat STEP 1 verbatim on a subgroup of composite order N_1 N_2 of a curve
      chosen for the purpose, and confirm that the derivation FAILS there, i.e.
      that the single-scalar description is not consistent. An argument that still
      succeeds on the composite case is wrong somewhere. STEP 4 (minutes; the one
      honest anchor): on a small ordinary class with D_0 = -3 containing a j = 0
      curve, obtain lambda_zeta3 by applying the EXPLICIT automorphism
      (x, y) |-> (zeta_3 x, y) to a generator P of G and solving [lambda] P =
      phi(P) by BSGS in the toy-sized group, then check
      lambda_zeta3 - 1 = c * f_E mod N. Optionally extend to one non-crater curve
      of that class by composing with an explicit 2-isogeny if a certifier
      (IDEA-20260807-b1b604) is available; this is the only step needing isogeny
      code and it is not required for the primary claims.
    controls:
      - >-
        NULL OBJECT (mandatory, blocking): uniformly random scalars in Z/N must
        FAIL the characteristic congruence at rate 1 - O(1/N). Without this the
        all-divisors-pass result is uninterpretable, because a congruence
        satisfied by everything measures nothing.
      - >-
        PROVES-TOO-MUCH CONTROL (mandatory): the same derivation run on a
        COMPOSITE-order subgroup must fail. A derivation that succeeds where its
        conclusion is known false is wrong, per AGENTS.md review architecture.
      - >-
        LEVEL CROSS-CHECK: the level assigned to each curve must agree with an
        independent labeller -- the group-structure indicator n_1 = gcd(A - 1, m)
        of IDEA-20260808-4d77a6 on the 2-part, or an explicit 2-isogeny BFS. A
        disagreement is itself the finding and blocks the lambda reading.
      - >-
        DEPTH-0 CONTROL: a class with f = 1 (no volcano) where the divisor set is
        {1}, lambda is unique, and the indistinguishability claim is vacuously
        true. The instrument must report exactly one candidate there; reporting
        more means the divisor enumeration is wrong.
      - >-
        HONEST-EVALUATION ANCHOR: at least one point at which the scalar is
        obtained by APPLYING a real endomorphism rather than by the formula
        (STEP 4). Without it every check is internal to the algebra and could
        confirm a wrong convention self-consistently.
    required_metrics:
      - defining-relation residual per curve and per candidate level (must be 0)
      - characteristic-congruence residual per candidate level (must be 0)
      - random-scalar acceptance rate over 10^4 draws (must be <= 2/N)
      - composite-order control outcome (must be a failure of the derivation)
      - j = 0 anchor residual from an explicitly applied automorphism (must be 0)
      - simulator bit-operation count vs level, and Velu evaluation field-operation count vs level
      - artifact manifest with source hashes, seeds, and a rebuild receipt

  falsification_conditions:
    - >-
      Any curve of the enumerated class with a correctly assigned level on which
      A + m * lambda - 1 is not zero mod N. Claim (A) is refuted and the record is
      withdrawn; the Frobenius decomposition or the generator convention is wrong.
    - >-
      The j = 0 anchor residual is non-zero. Either theta is not f_E omega_K under
      the convention used, or omega_K is not zeta_3 - 1 at D_0 = -3, or the
      automorphism does not act as claimed. This localises the error to the
      convention and is the single most likely way this record fails.
    - >-
      Some divisor d of f fails the level-d congruence. Claim (C) is refuted, the
      level IS partially certifiable from inside G, and the correct follow-up is a
      new proposal exploiting that certifiability -- a strictly more interesting
      outcome than the expected one.
    - >-
      Random scalars pass the congruence at non-negligible rate. The instrument
      has no resolution; nothing in the record may be read either way until the
      congruence implementation is repaired.
    - >-
      The composite-order control succeeds where it must fail. The derivation
      proves too much and is wrong somewhere not yet read closely enough.

  confounders:
    - >-
      GENERATOR CONVENTION. omega_K, theta and A are convention-dependent, and a
      shifted generator theta' = theta + k changes lambda by k. MITIGATION: the
      convention is written into the record explicitly, the defining relation
      A + m lambda = 1 is convention-checking by construction, and the j = 0
      anchor tests the convention against an explicitly applied map.
    - >-
      LEVEL MISASSIGNMENT. The whole reading depends on knowing f_E per curve. If
      the census levels of IDEA-20260821-ad7c97 are wrong, every residual is
      meaningless. MITIGATION: two independent labellers must agree before the
      lambda check is read, and the disagreement rate is reported.
    - >-
      SIGN AND HALF-INTEGER TRAPS. A = (t - f D_0)/2 requires t and f D_0 to have
      the same parity; the D_0 = 0 mod 4 branch has A = t/2 and requires t even.
      Getting the branch wrong silently produces a consistent-looking but wrong A.
      MITIGATION: both branches are implemented, the branch is selected by
      D_0 mod 4 and asserted, and the parity precondition is checked.
    - >-
      TOY N IS SMALL. At p ~ 4000 the group order is a few thousand, so a random
      scalar passes a quadratic congruence with probability ~2/N ~ 5 * 10^{-4},
      which over 10^4 draws yields a handful of accidental passes. MITIGATION: the
      acceptance threshold is stated as a rate against 2/N with a binomial
      confidence interval, not as zero, and the control is repeated at a larger
      toy prime.
    - >-
      THIS IS ALGEBRA, NOT AN EXPERIMENT. Almost all of the test verifies an
      identity, and identities pass unless the implementation is wrong. The
      informative content is concentrated in STEP 4 and in the two controls; a
      report that emphasises the passing identities over those three would be
      overstating what was learned, and the analysis must say so.

  interpretation_limits:
    - >-
      CLAIM TIER TOY, per RQ-VOLC-f6253b. The identities are scale-independent
      derivations, but the verification is at p ~ 10^3 to 10^4 and no transfer to
      cryptographic scale is offered or needed for the claims made.
    - >-
      THIS DOES NOT MOVE ANY ECDLP EXPONENT AND DOES NOT CLAIM TO. It repairs the
      premise of a closure and makes the closure depth-uniform; the effect is on
      what the campaign may assert, not on what any algorithm costs.
    - >-
      THE RECORD DOES NOT EDIT, SUPERSEDE, OR ADJUDICATE KN-FIND-002 OR
      KN-FIND-b7e091, and has no authority to. It is input to the routed
      review-breakthrough round. Where those two records disagree about the
      INCIDENCE oracle, this record depends on neither reading and takes no side;
      any downstream use that needs the incidence reading must obtain it from the
      review, not from here.
    - >-
      SIMULABILITY IS NOT USELESSNESS AND NOT A LOWER BOUND. Showing Oracle D is
      cheaply simulable removes it as a route past Shoup's bound; it says nothing
      about oracles that return FIELD elements (R1), about the curve equation
      (R2), or about ell-torsion as a Galois module (R5), all of which remain the
      live channels for this lane.
    - >-
      THE LEVEL IS AN INPUT, NOT AN OUTPUT. Claim (D)'s simulator is given f_E.
      Claim (C) says it cannot get f_E from inside G. Obtaining it from outside G
      is a separate cost, addressed in IDEA-20260901-c7e601 and bounded below by
      nothing this record proves.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO HEURISTIC IS LOAD-BEARING FOR CLAIMS (A), (B), (C) OR (D). They are
        derivations from the Deuring-Waterhouse sandwich, the generator convention
        theta = f_E omega_K, and the fact that Frobenius fixes rational points.
        H1 is the one arithmetic SIDE CONDITION, stated formally so it is not
        silent: for a prime-order subgroup of an ordinary curve,
        N > 2 sqrt(p) + 1 > f >= m, hence gcd(m, N) = 1 and m^{-1} mod N exists.
      rigorous_support: >-
        RIGOROUS INGREDIENT: Hasse gives |t| <= 2 sqrt(p), so
        |D| = 4p - t^2 <= 4p and f = sqrt(|D|/|D_0|) <= 2 sqrt(p); for a
        prime-order curve N = p + 1 - t >= p + 1 - 2 sqrt(p) = (sqrt(p) - 1)^2,
        which exceeds 2 sqrt(p) for p >= 8. CLASSICAL STATEMENT IMITATED: none
        needed -- this is an inequality, not a distributional claim. THE GAP: for
        curves whose prime-order subgroup is a small factor of a composite group
        order the inequality can fail, which is why the condition is CHECKED per
        instance rather than assumed.
      falsification_condition: >-
        A tested instance with gcd(m, N) != 1. The formula for lambda is then
        undefined and the instance is excluded from the reading, with the
        exclusion rate reported.
      validation_plan: >-
        SAMPLE: every curve in the enumerated toy classes plus 10^3 randomly
        generated ordinary curves at p in {4001, 6007, 65537-range}. SHORTCUT:
        none needed; gcd is O(log p). COMPARISON: the predicted exclusion rate is
        exactly 0 for prime-order G. TAIL CHECK: deliberately include
        composite-order groups with a small prime factor to confirm the check
        FIRES, i.e. that the guard has power. TRANSFER: none claimed; the
        inequality is proved, not sampled, and sampling here tests the
        implementation of the guard rather than the mathematics.
    - id: H2
      statement: >-
        TRANSFER ASSUMPTION, STATED BECAUSE IT IS THE ONLY ONE. The verification
        at p ~ 4001 and p ~ 6007 is asserted to test the IMPLEMENTATION of
        identities whose validity is scale-independent, not to establish
        scale-dependent behaviour. Formally: for all ordinary E/F_p with
        prime-order G, the residuals of claim (A) vanish; the toy sample tests
        this universally quantified statement at two primes.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the derivation quantifies over all p and contains no
        step whose validity depends on the size of p. CLASSICAL STATEMENT
        IMITATED: none. THE GAP, STATED PLAINLY: a scale-independent derivation
        verified only at toy scale can still hide an implementation error that
        happens to cancel at small p -- for example a modular inverse that is
        correct only when f is small. The mitigation is the tail check below, not
        an appeal to the derivation.
      falsification_condition: >-
        A residual that is zero at p ~ 4001 but non-zero at a larger toy prime.
        That is an implementation-scale artifact and must be reported as such
        before any reading of the identities.
      validation_plan: >-
        SAMPLE: the two enumerated classes plus 10^3 random ordinary curves across
        at least four primes spanning 12 to 30 bits, with f ranging over at least
        three orders of magnitude so that m^{-1} mod N is exercised at varied
        sizes. SHORTCUT: no Deuring-correspondence-style shortcut is needed
        because no isogeny is computed for the primary claims; where the level is
        needed it comes from the divisor structure of f together with an
        independent labeller. COMPARISON: residuals against the predicted exact
        zero; the acceptance rate of random scalars against the predicted 2/N.
        TAIL CHECK: the largest f and the largest m in the sample must show the
        same exact-zero residual as the smallest. TRANSFER: the sampled parameters
        (p, t, f, f_E, N) are recorded in full and no extrapolation beyond them is
        made.

  target_complexity:
    time_exponent: >-
      NO ECDLP TIME EXPONENT IS CLAIMED OR MOVED; sota_delta is +0 and that is
      stated as the honest value, not as a hedge. The exponents this record does
      state, both of which are new to the campaign's records, are: (i) the
      Oracle-D SIMULATION overhead, O(log p) bit operations per query, uniformly
      over the volcano depth, replacing KN-FIND-b7e091's stated m group operations
      and its false premise; and (ii) the cost of the alternative route to the
      same scalar by direct evaluation of theta, Theta(f_E sqrt(|D_0|)) field
      operations with a BSGS evaluation of the rational map, which at the floor of
      a maximal-depth volcano (f_E = f ~ sqrt(4p/|D_0|)) is Theta(sqrt(p)) -- the
      birthday bound itself. The record's content is that route (i) exists, so the
      apparent depth-induced blow-up of route (ii) does not threaten the closure.
    memory_exponent: >-
      O(log p) bits for the simulator: it holds four residues. No table, no
      preprocessing, no time-memory tradeoff. Direct evaluation by BSGS on the
      rational map would need O(sqrt(deg theta)) memory, i.e. up to p^{1/4} at the
      floor; that is the route the record shows is unnecessary.
    best_known: >-
      For the ECDLP on these curves: parallel Pollard rho with the negation map,
      n^{1/2 + o(1)} group operations and O(1) memory per processor with
      distinguished points (~0.886 sqrt(pi N / 2) sequentially), and BSGS at
      n^{1/2} time and n^{1/2} memory; on CM curves the automorphism-discounted
      rho of KN-TECH-018 with its sqrt(|Aut|) <= sqrt(6) constant. None of these is
      challenged, approached, or claimed to be approached.
    hidden_overhead: >-
      NOTHING HIDES IN AN o(1) BECAUSE NO ASYMPTOTIC WITH AN o(1) IS CLAIMED. What
      IS disclosed: the O(log p) simulator cost EXCLUDES the cost of obtaining
      f_E, which is not O(log p) and is the subject of a separate proposal; and
      the Theta(f_E sqrt(|D_0|)) figure for direct evaluation is quoted from
      IDEA-20260811-565915's degree formula together with a standard
      BSGS-evaluation argument that this session did not verify against an
      implementation.
    tradeoff_note: >-
      The relevant tradeoff is between the two routes to lambda, not between time
      and memory for an attack. Route (i), the identity, is O(log p) time and
      O(log p) memory but requires the level as input. Route (ii), evaluation,
      needs no level input but costs up to sqrt(p) time and p^{1/4} memory and
      RECOVERS the level as a by-product via f_E = lambda c^{-1} mod N. That
      by-product is the only depth-reading channel this record identifies, and it
      is priced above the birthday bound at maximal depth, so it is not an attack
      route. Parallelization is irrelevant to route (i) and standard for route
      (ii).

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER BEFORE ANSWERING, ON TIME, MEMORY AND
    QUERIES. As an ECDLP attack: n/a (no result claimed) -- no time, memory, or
    query point is offered, so no frontier row applies and `null` would be
    dishonest. As a statement about the endomorphism action: dominated by the
    standard CM/GLV literature, in which the eigenvalue of an efficient
    endomorphism on a prime-order subgroup and its expression via Frobenius are
    routine -- RECALLED, not opened, so a reviewer may reclassify claims (A) and
    (B) as `known`; this record's contribution would then be (C) and (D) only, and
    it is written so that reclassification does not damage it. As a simulability
    result: it does not dominate KN-FIND-b7e091, it REPAIRS it -- the conclusion
    is the same closure at exponent 1/2, reached from a true premise and extended
    to be uniform in depth. As a level-detection method: strictly DOMINATED by
    IDEA-20260808-4d77a6's n_1 = gcd(A - 1, m) instrument, which reads part of the
    level in O(log p) group operations; this record's route (ii) costs up to
    sqrt(p) and is presented as a ceiling, not a method.
  sota_delta: >-
    +0 on every attack axis: time exponent unchanged at 1/2, memory unchanged,
    query model untouched, claim tier toy. Quantitatively, what changes is
    internal to the campaign and can be stated as numbers: the Oracle-D simulation
    overhead figure moves from "m group operations under End = Z" (a false premise
    with an exponentially wrong cost) to "O(log p) bit operations under
    End = O_{f_E}, uniform in depth"; and the number of candidate levels that a
    G-restricted algorithm can rule out moves from an unstated presumption to
    exactly zero out of #div(f).

  discriminated_from:
    - >-
      IDEA-20260808-4d77a6 shares the input pi = A + m theta and is the closest
      filed record. It extracts the SMITH NORMAL FORM invariant
      n_1 = gcd(A - 1, m) of E(F_p) and uses it as a partial, frequently vacuous
      LEVEL DETECTOR. This record extracts the SCALAR ACTION on a prime-order
      subgroup, which is never vacuous, and proves it cannot be used as a detector
      from inside G. Same starting identity, disjoint objects, opposite
      conclusions about detectability, and the two are complementary rather than
      competing: 4d77a6 supplies the independent level labeller this record's
      control requires.
    - >-
      IDEA-20260811-565915 derives the DEGREE of the minimal non-scalar
      endomorphism, |D_0| f_E^2/4, which grows with depth, and prices R3
      constructions by it. This record derives the SCALAR, whose cost is
      depth-independent. The pair is the record's claim (D): a quantity that
      explodes with depth and a quantity that does not, computing the same action.
    - >-
      IDEA-20260807-5cabfc closes vertical transport at the level of cost
      functionals, concluding invisibility. This record supplies the ring-level
      mechanism and reaches a strictly weaker and more precise conclusion --
      unverifiability from inside G, with the out-of-G price named -- which is a
      different statement and is testable where invisibility is not.
    - >-
      IDEA-20260807-4f43ac argues a LEVEL oracle is a curve-only constant and
      hence GGM-simulable. This record concerns the ENDOMORPHISM-IMAGE oracle,
      supplies the explicit simulator and its constant, and shows the simulator
      does not degrade with depth -- a quantitative statement 4f43ac does not
      make.
    - >-
      IDEA-20260826-f412a0 tracks the height process of a random walk; disjoint
      object, disjoint metric, no overlap.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.93 that the defining-relation and characteristic-congruence residuals are
    exactly zero on correctly levelled curves, since these are identities and the
    only risk is transcription. 0.75 that the j = 0 anchor passes on the first
    attempt -- the residual risk is entirely in the generator convention at
    D_0 = -3, which is the single most likely place for this record to fail and is
    why the anchor is in the minimal test rather than deferred. 0.9 that all
    #div(f) candidate levels pass the congruence, i.e. that claim (C) holds; the
    0.1 is the outcome that would OPEN a lane and is worth the test on its own.
    0.6 that the routed review-breakthrough round accepts claims (A) and (B) as
    `known` from the GLV literature while accepting (C) and (D) as new to this
    program, which is the outcome this record is written to survive.

