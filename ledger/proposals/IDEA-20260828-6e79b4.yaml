    rows computes E, so none dominates a measurement of it; two candidate
    rows (eprint 2024/138, eprint 2023/1796) could not be checked this
    session due to IACR rate limiting and are named as the first thing a
    follow-up must verify.
  sota_delta: >-
    No attack; margin-measurement contribution only. If E is measured near
    zero (additive), sota_delta = 0 beyond the sum of the two already-known
    individual prices, and 818196's rank-only fault boundary is confirmed
    adequate even once t0 is charged. If |E| is measured materially above
    zero at reduced scale (either sign), the quantitative delta reported is
    E itself in bits at the tested instance, with NO transfer asserted to
    FIPS 204 scale; the smallest change this record would flag as
    "interesting enough to warrant a scale-up study" is |E| exceeding the
    combined measurement noise by a factor of 3 across the >=10-instance
    ensemble.
