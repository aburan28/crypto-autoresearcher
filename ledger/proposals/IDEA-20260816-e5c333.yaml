idea:
  id: IDEA-20260816-e5c333
  question_id: RQ-FNDSA-001
  added: '2026-08-16'
  title: 'Count the decision flips instead of measuring the distribution: the divergence between a
    p-bit sampler and an exact one is carried entirely by the randomness tapes on which rounding changes
    a discrete decision, so the flip rate upper-bounds total variation and is countable at full 53-bit
    precision where the distance itself is unmeasurable.'
  class: mechanism
  claim: '(A) Run the exact-arithmetic sampler and the p-bit sampler on the SAME randomness tape.
    Both are deterministic functions of that tape. Define the FLIP SET as the set of tapes on which
    the two produce different outputs, and the flip rate f(p) as its probability under the tape measure.
    Then the total variation between the two output laws satisfies TV at most f(p), by the standard
    coupling inequality, with equality when flipped outputs land disjointly from unflipped ones. (B)
    The flip rate is CHEAPLY COUNTABLE at any precision, including 53, because detecting a flip needs
    only running both samplers on one tape and comparing, costing two sampler evaluations and no distributional
    estimation whatsoever. Measuring a TV of size t by sampling costs order t to the power minus 2
    signatures; measuring a flip rate of size f costs order f to the power minus 1 tapes, the square
    root of the work in the regime that matters. (C) The flip set has structure: a flip occurs only
    where a rounded quantity crosses a decision boundary, so the flip rate should be proportional
    to 2 to the power minus p times the density of the decision variable near its boundary, times
    the number of decisions per signature. This gives f(p) = K times L times 2 to the power minus
    p, with both K and L measurable. (D) WHAT IS NOT CLAIMED: f(p) is an UPPER bound on TV, never
    TV itself, and the gap can be arbitrary because a flip may move the output to a point the exact
    sampler reaches with nearly the same probability. No claim is made that a flip is exploitable,
    that the flip set is computable by an adversary who does not hold the tape, or that any of this
    bears on deployed parameters. (E) The negative outcome is usable: if f(53) at toy dimension is
    already below any resolvable threshold, that is a measured statement about how much headroom the
    coupling bound has, telling the other precision entries in this batch that the coupling route
    is exhausted there.'
  mechanism: 'STAGE ONE fixes a tape abstraction: the sampler consumes a stream of uniform bits, and
    both implementations are rewritten as pure functions of that stream so replay is exact. STAGE
    TWO defines a flip as the two implementations, fed the identical stream, emitting different integer
    vectors. Counting flips is then a Monte Carlo estimate of a PROBABILITY rather than of a distance,
    with relative error at n tapes of one over the square root of n times f, so resolving f = 1e-6
    needs order 10^7 tapes rather than the 10^12 signatures a direct TV estimate of the same size
    would need. STAGE THREE localizes flips: when one occurs, the harness records which decision in
    the recursion first diverged, giving a per-depth flip profile. STAGE FOUR tests the predicted
    law by sweeping p and by varying the decision count L through the lattice dimension, and separately
    estimates K from the empirical density of the decision variable near its boundary. The claim is
    established if the sweep reproduces the geometric law with a stable K, and refuted if f(p) decays
    faster than 2 to the power minus p, meaning flips are suppressed by a mechanism the model lacks,
    or slower, meaning flips are generated somewhere other than at decision boundaries.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FNDSA-001 in full and H-FNDSA-6a9cbb's statement, mechanism and assumptions blocks.
      Extracted the titles of all twelve RQ-FNDSA-001 proposals. Read the title and framing of IDEA-20260813-d50a10
      specifically because it mentions replaying two samplers on one randomness tape. Ran grep -ril
      for coupling, randomness tape, rejection, accept, flip and precision across ledger/proposals/.
    results: 'IDEA-20260813-d50a10 is the direct collision, titled first-disagreement coupling: replay
      exact and reformulated FN-DSA samplers on one randomness tape, locate the first rounding or
      rejection split, and bracket output distance by coupling mismatch and a public-output witness.
      That record owns the coupling construction and the first-disagreement localization. Nothing
      else among the twelve touches coupling. IDEA-20260813-aaf02e composes rounding into an interval-arithmetic
      budget, an analytic bound rather than a counted event. H-FNDSA-6a9cbb concerns the exact-arithmetic
      defect and explicitly excludes finite precision from its scope.'
    verdict: 'UNVERIFIED, and here the honest verdict is that MOST of this is already owned. Coupling
      two samplers on a shared tape and bracketing distance by mismatch is IDEA-20260813-d50a10''s
      construction and this record does not claim it. What is claimed new is narrower: the ESTIMATOR-COST
      argument that a flip rate costs order f to the power minus 1 tapes where a TV of the same size
      costs order t to the power minus 2 signatures, so the coupling route is the only one reaching
      p = 53; and the predicted law with K and L separately measurable, which turns the coupling bound
      from a bracket into a fitted model. If a Coordinator judges that too close to d50a10, the correct
      disposition is to fold this in as an amendment rather than file it as independent, and this
      record says so rather than pretending to more distance than it has.'
  object_first_candidate:
    tracked_object: 'The FLIP INDICATOR of a single randomness tape: the one bit saying whether the
      exact and the p-bit sampler, replayed on that tape, produce the same output vector. Followed
      through the recursion as the index of the first decision at which they diverge. Not the output,
      not its distribution, not a moment: a Bernoulli variable attached to a tape, plus the depth
      at which it fires.'
    lossiness: 'Massively lossy: the entire output vector, all coordinates and all their probabilities,
      collapses to one bit plus one integer depth. Two tapes flipping at the same depth into completely
      different outputs are identified. That discarding is compatible with the target operation because
      the coupling inequality needs only the PROBABILITY of the flip event, and probability is preserved
      by the collapse; nothing about which output was produced enters the bound. What is genuinely
      lost is the direction of the flip, and that loss is exactly why the object yields an upper bound
      rather than the distance, which this record states rather than hides.'
    propagation: One step is one decision inside the recursion, either a rounding of an intermediate
      quantity or a comparison against a threshold in the base sampler. Acting on the flip indicator,
      a decision either leaves it at zero, with probability one minus the local boundary-crossing
      probability, or sets it permanently to one and records the depth. The indicator is therefore
      a first-passage variable of an absorbing chain along the tree, and the flip rate is one minus
      the product of per-decision survival probabilities, which is what makes the predicted law multiplicative
      in the decision count and geometric in the precision.
    survival_score: 'The object survives to full deployed precision, which is the point of it. Concretely:
      at p = 53 a flip rate of order L times 2 to the power minus 53, with L of order 10^3 decisions,
      is about 1e-13, needing order 10^13 replays to see one flip and therefore out of reach; but
      at p between 20 and 32 the rate is 1e-3 to 1e-7 and is comfortably countable at 10^7 replays.
      So the object survives the precision sweep down to about p = 32 within a one-day budget and
      dissolves into unreachability below that. That crossover, p around 30 at 10^7 replays, is the
      honest survival score.'
  null_object_control: 'The null arm replays TWO INSTANCES OF THE SAME p-bit implementation on the
    same tapes, differing only in an irrelevant relabeling such as loop order over already-independent
    leaves. The measured flip rate must be exactly zero over all 10^7 tapes: any nonzero reading means
    the replay harness is not deterministic and every signal reading is an artifact of unrepeatable
    state. A second null replays exact against exact under two equivalent exact evaluation orders
    and must also read exactly zero. A positive control replays the p-bit implementation against a
    version with one decision threshold shifted by a known relative amount and must read a flip rate
    proportional to that shift.'
  discriminated_from:
  - IDEA-20260813-d50a10 owns the coupling replay and the first-disagreement localization outright.
    This record adds only the estimator-cost comparison and the fitted geometric law, and explicitly
    recommends folding into d50a10 if a Coordinator judges the addition insufficient.
  - IDEA-20260813-aaf02e bounds distance analytically with interval arithmetic. An interval bound
    is computed without running anything and is loose by an unmeasured factor; a flip rate is a measured
    probability whose looseness relative to TV is checkable at toy size against the enumeration entry
    in this batch.
  - The enumeration entry in this batch computes the exact pmf and gets TV itself, but only at d at
    most 8. This entry gets an upper bound on TV at any dimension, and the enumeration entry is what
    calibrates how loose that bound is.
  - IDEA-20260808-e7ba81 needs order D over eps squared signatures to see a spike of size eps. Flip
    counting needs order f to the power minus 1 tapes and requires holding the tape, so it is an INSTRUMENT
    for the designer, not a distinguisher for an adversary; that difference is why this is not a restatement
    of a detection threshold.
  assumptions:
  - Both implementations can be made pure functions of an explicit bit stream, which requires removing
    all ambient randomness and all nondeterministic iteration order.
  - The coupling inequality applies, which requires only that the two are driven by the same tape
    measure and is not an approximation.
  - The number of decisions per signature is well defined and countable, requiring the recursion depth
    and the base sampler's rejection loop to be instrumented rather than estimated.
  - Toy bases and widths are constructed in-run and are not claimed to be FN-DSA keys.
  - Flip events are rare enough that a Bernoulli estimate at 10^7 tapes has usable relative error
    at the swept precisions, which fails below about p = 32 and is reported as the reach limit rather
    than extrapolated past.
  predictions:
  - metric: flip rate f(p) at fixed dimension and width
    direction: lower
    minimum_effect: f halves for each additional mantissa bit over p = 12 to 28, that is a fitted
      slope of log2 f against p in the interval from -1.15 to -0.85
  - metric: flip rate at fixed p as lattice dimension doubles
    direction: higher
    minimum_effect: increases by a factor between 1.6 and 2.4, consistent with proportionality to
      the number of decisions
  - metric: flip rate in the null arm over 10^7 tapes
    direction: different
    minimum_effect: 0
  - metric: ratio of measured flip rate to enumerated total variation at d = 4, where both are available
    direction: higher
    minimum_effect: 'at least 1.0 by the coupling inequality, and no upper value is pre-committed.
      Refusal reason: the tightness of the coupling bound is what the comparison exists to discover,
      and naming a value would convert a measurement into a confirmation.'
  minimal_test:
    design: 'Take d = 4, sigma = 2, one toy basis, and 10^6 tapes. Replay exact against p = 16 and
      count flips; the expected rate at that precision is large enough that 10^6 tapes resolve it
      to a few percent. In the same invocation run both null arms over the same tapes and the positive
      control at a threshold shift of 1e-3. That single invocation discriminates what matters: a nonzero
      null kills the instrument immediately and cheaply; a zero flip rate at p = 16 means the decision
      structure is far less sensitive than the model predicts and the line needs rethinking; a flip
      rate near the predicted value licenses the full sweep. Only then extend to p in 12 through 32
      and to d in 2, 4, 8 and 16, since the flip-counting arm, unlike enumeration, is not limited
      to enumerable dimensions and d = 16 costs no more per tape than d = 4.'
    controls:
    - 'Null arm one: identical p-bit implementation against itself under leaf-order relabeling, must
      read exactly zero flips over all tapes.'
    - 'Null arm two: exact against exact under two equivalent exact evaluation orders, must read exactly
      zero.'
    - 'Positive control: one decision threshold shifted by a known amount, flip rate must be proportional
      to that shift across 1e-2, 1e-3 and 1e-4.'
    - 'Cross-instrument control at d = 4: compare the measured flip rate against the enumerated total
      variation from the companion entry and confirm the coupling inequality direction holds.'
    - 'Tape-reuse control: rerun a fixed subset of 10^5 tapes and confirm bitwise identical flip decisions,
      establishing replay determinism.'
    required_metrics:
    - flip rate with a Clopper-Pearson confidence interval
    - 'per-depth flip profile: fraction of flips whose first divergence occurred at each recursion
      level'
    - measured number of decisions per signature
    - fitted slope of log2 flip rate against mantissa width
    - fitted boundary-density constant
    - ratio of flip rate to enumerated total variation where both exist
  falsification_conditions:
  - Either null arm reports a nonzero flip, voiding replay determinism and every signal reading.
  - The positive control's flip rate is not proportional to the injected threshold shift within a
    factor of two.
  - The fitted slope of log2 f against p lies outside the interval from -1.15 to -0.85, falsifying
    the geometric model.
  - Flip rate does not grow with the number of decisions as dimension increases, falsifying the multiplicative
    model.
  - The measured flip rate at d = 4 is SMALLER than the enumerated total variation from the companion
    instrument, violating the coupling inequality and proving one of the two instruments wrong.
  - No flips at all are observed at p = 12 over 10^7 tapes, meaning the premise that rounding crosses
    decision boundaries at measurable rates is false at these parameters.
  confounders:
  - Nondeterministic replay from dictionary ordering, threading, or ambient entropy, which manufactures
    flips out of nothing; the tape-reuse control targets exactly this.
  - Ties at decision boundaries handled differently by the two implementations, producing a constant
    flip floor unrelated to precision.
  - Counting a flip in an intermediate value that never reaches the output, inflating the rate relative
    to the output-level definition the coupling inequality requires.
  - Correlated tapes from a weak pseudorandom generator, which biases the Bernoulli estimate.
  - Varying dimension changes both the decision count and the basis conditioning at once, so the dimension
    prediction confounds two mechanisms unless conditioning is held fixed.
  interpretation_limits:
  - The flip rate is an UPPER bound on total variation and never the distance itself; a small flip
    rate bounds divergence, a large one does not establish it.
  - The measurement requires holding the randomness tape, so it is available to a designer or auditor
    and not to an adversary observing signatures.
  - Results hold at the tested toy dimensions, widths and precisions and are not extrapolated to deployed
    parameters.
  - The per-depth flip profile describes the recursion implemented in this run and is not a statement
    about any released implementation's control flow.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: order one over f tape replays
      to resolve a flip rate f, each costing two sampler evaluations, so cost grows as 2 to the power
      p in the swept precision and only linearly in the lattice dimension.'
    memory_exponent: No attack memory exponent is claimed. Instrument memory is O(1) in the number
      of tapes since flips are counted in a streaming fashion, and linear in dimension plus decision
      count per replay.
    best_known: Inside this repository the incumbent is IDEA-20260813-d50a10, which proposes the same
      coupling replay, with IDEA-20260813-aaf02e's interval-arithmetic budget as the analytic alternative.
      No claim is made about anything outside this repository.
    hidden_overhead: 'Determinism is the hidden cost. Making two independently written samplers consume
      the same tape in the same order, and keeping them that way across edits, is a substantial and
      unglamorous engineering burden whose failure mode is silent: a harness that drifts out of lockstep
      reports a beautiful nonzero flip rate that is entirely artifact. The one-time human cost of
      the tape abstraction likely exceeds the total compute cost of the study.'
  dominated_by: 'n/a (no attack result claimed). Pareto check on the instrument axes, all three checked:
    against enumeration, dominated on exactness since it returns a bound rather than a value, dominating
    on dimension reach and on memory. Against interval-arithmetic bounding, dominated on compute since
    that method needs none, dominating on tightness since a counted rate is achievable while an interval
    bound is not. Against sampled goodness-of-fit it dominates on all three axes in the small-divergence
    regime because one over f beats one over t squared. No attack frontier is claimed to be touched.'
  sota_delta: 'No attack; measurement contribution only. Quantitatively: to resolve a divergence of
    size 1e-6, sampled distributional testing needs order 10^12 signatures and flip counting needs
    order 10^6 tape replays, a factor of about 10^6 in samples, at the cost of returning an upper
    bound rather than the distance and of requiring tape access.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Separate parts. That replay determinism is achieved and the nulls pass:
    about 0.7, this being engineering whose failure mode is common. That flips are observable at p
    between 12 and 28 at toy dimension: about 0.8, since rounding at 12 bits is coarse. That the fitted
    law is geometric with slope near -1 and multiplicative in the decision count: about 0.5, because
    tie-handling and boundary-density effects could easily produce a different exponent. That this
    record survives as INDEPENDENT of IDEA-20260813-d50a10 rather than being folded into it: about
    0.3, and that low number is the honest reading of the novelty screen.'
