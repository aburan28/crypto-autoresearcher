idea:
  id: IDEA-20261006-0fc353
  question_id: RQ-SSIQ-9702af
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Least prime from a supersingular j to its Frobenius conjugate versus
    one pinned non-conjugate, at p=19
  class: measurement
  claim: >-
    R2 j-line coordinate; no ECDLP attack stage is assigned a new charged
    cost. Let p=19. Let S be the set of supersingular j-invariants in
    F_{p^2} that do not lie in F_p. For j in S and for a prime ell in
    L={2,3,5,7,11,13}, write ell(j, j2) for the least ell in L such that
    the classical modular polynomial Phi_ell(j, j2) vanishes in F_{p^2},
    or for none when no such ell exists. The claim is that there exists
    at least one j in S and one supersingular j_star in F_{p^2}, with
    j_star outside {j, j^p}, such that ell(j, j^p) and ell(j, j_star) are
    both defined and ell(j, j^p) is strictly smaller than ell(j, j_star).
    A pass is one boolean at this prime. It does not establish a trapdoor,
    an isogeny algorithm, or any movement of the p^{1/3} exponent.
  mechanism: >-
    OBJECT FRAME. Representation of the point: the j-invariant, an element
    of F_{p^2}, which is an R2 moduli coordinate of the curve (a point of
    the j-line, not an affine point of E). Operation set Sigma: the single
    map j |-> j^p, the p-power Frobenius on that coordinate. Sigma does
    not contain translation on E. F3, an isogeny path, is a named
    component only: Phi_ell detects that some cyclic ell-isogeny exists,
    and the census does not walk the graph. The quantity added is the
    comparison of the least such prime toward the Frobenius conjugate
    against the least such prime toward one pinned non-conjugate.
    TRICHOTOMY. Partial-action. Reason: the least-prime label toward the
    conjugate is unchanged when j is replaced by j^p, because
    (j^p)^p = j for supersingular j in F_{p^2} and Phi_ell is symmetric,
    so the label propagates under the Frobenius pair and is not asked to
    propagate under translation.
    LOSSY-PROJECTION TEST. From a separable isogeny E -> E^{(p)}, discard
    the kernel subgroup and every prime factor of the degree except the
    least one, and retain that least prime when it lies in L. The discard
    is compatible with Sigma because Frobenius sends a kernel of degree
    ell to a kernel of degree ell. The projection is lossy in this
    representation: distinct kernels, and distinct composite degrees,
    share one least prime, and the j-coordinate has already discarded the
    affine point.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-055
      provenance: internal
      claim: >-
        The technique note records the exemplar pattern whose structural
        slot is a bound, stated there as the smallest isogeny E -> E^{(p)}
        having degree at most (p/2)^{1/3}, with smoothness and a
        meet-in-the-middle split stacked on that bound. This idea uses
        that note as the baseline it does not beat.
      verified_by: idea-generator, knowledge/techniques/KN-TECH-055.md
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C, as printed in that finding, says an exactly
        sum-compatible quasigroup index on E is a surjective homomorphism,
        impossible for prime group order and a nontrivial lossy quotient.
        Sigma here is Frobenius on j, which is why the label is not offered
        as a quotient of E(F_p).
      verified_by: idea-generator, knowledge/findings/KN-FIND-ffe1df.md
    - ref: KN-OPEN-019
      provenance: internal
      claim: >-
        The open problem states that this program has no closed
        object-indexed taxonomy of ECDLP attacks. The pair (j-coordinate,
        Frobenius) is a sketch against that gap, not a completed enumeration.
      verified_by: idea-generator, knowledge/open-problems/KN-OPEN-019.md
    - ref: "eprint 2026/1486"
      provenance: recalled
      claim: >-
        Pointer only. The question file names this eprint as the archived
        OneEnd/EndRing/Isogeny source. This session did not open the paper.
  assumptions:
    - >-
      Supersingularity of a j in F_{p^2} is decided by a complete census at
      p=19, not by a sampled search.
    - >-
      F3 is a component (existence via Phi_ell). The census stores no path.
    - >-
      If S is empty, or if no j_star exists outside {j, j^p}, the cell is
      inconclusive. That outcome is not a negative on the least-prime label.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: >-
        The least prime in L, a lossy label of an isogeny class under
        Frobenius.
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a finite boolean at one prime, not a proof. The strongest
      certified output is whether the two least primes differ for some
      pair at p=19. A nearby control is the same least-prime function
      with the conjugate replaced by j itself, which must return none
      inside L whenever j is not ell-isogenous to itself for ell in L;
      that self-comparison is an instrument check and is not the claim.
  predictions:
    - metric: >-
        least ell in L with Phi_ell(j, j^p)=0, minus the least ell in L
        with Phi_ell(j, j_star)=0, for the witnessing pair
      direction: lower
      minimum_effect: >-
        The conjugate-side prime is strictly smaller than the pinned-null
        prime, a gap of at least one step in L.
  minimal_test:
    design: >-
      Enumerate supersingular j in F_{361}. For each j outside F_19, choose
      j_star as the lexicographically smallest supersingular element outside
      {j, j^19}. Evaluate Phi_ell(j, j^19) and Phi_ell(j, j_star) for ell
      in L in increasing order and stop at the first root. Record both
      least primes, or none.
    controls:
      - >-
        Phi_ell(j, j) is the self-isogeny instrument check and is not the
        metric.
      - >-
        Repeat the conjugate evaluation after replacing j by j^19. The
        least prime must match, or the Frobenius symmetry of the instrument
        has failed.
      - >-
        A nonsupersingular j in F_19, the ordinary curve y^2=x^3+x+1 when
        it is nonsingular there, must not be admitted to S.
    required_metrics:
      - size of S
      - ell(j, j^p) and ell(j, j_star) for every admitted pair
      - boolean, whether any admitted pair has a strictly smaller conjugate-side prime
  falsification_conditions:
    - >-
      Every admitted pair has ell(j, j^p) equal to ell(j, j_star), including
      the case where both are none. The conjugate is then not separated by
      this least-prime label at p=19. That negative closes only this prime,
      this set L, and this choice of j_star.
    - >-
      The Frobenius symmetry check fails. The run is an instrument failure,
      not evidence about the primes.
  confounders:
    - >-
      L truncates the true least prime. A prime outside L can make both
      recorded values none even when a larger connecting prime exists.
    - >-
      Several supersingular j can share a Phi_ell root for reasons other
      than the Frobenius relation.
    - >-
      Lexicographic choice of j_star depends on the field-polynomial basis.
  interpretation_limits:
    - >-
      Exponent delta 0 against the p^{1/3+o(1)} time and memory figure
      recorded in KN-TECH-055. No p^{1/4} claim.
    - One prime, one bound on ell, one boolean.
    - >-
      A pass does not validate the degree bound, Heuristic 1, or smoothness.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For j in S at p=19, the least prime ell with Phi_ell(j, j^p)=0
        is stochastically smaller than the least prime with
        Phi_ell(j, j_star)=0, on the model that the conjugate degree
        behaves like a uniform positive integer at most (p/2)^{1/3}
        while the pinned null degree behaves like a uniform integer up
        to the product of the primes in L.
      rigorous_support: >-
        KN-TECH-055 states the exemplar structural bound as degree at most
        (p/2)^{1/3} for the smallest isogeny E -> E^{(p)}, and pairs it
        with a classical smoothness law. This session read that statement
        in the technique note and did not read a proof of the bound.
        (19/2)^{1/3} is about 2.1, so the toy reading of that bound is the
        prime 2.
      validation_plan: >-
        At p=19 only, compare the multiset of conjugate-side least primes
        with the multiset of null-side least primes, and with the single
        value 2. If any conjugate-side value is defined and greater than 2,
        record the count. No sample is transferred to a larger p.
  target_complexity:
    time_exponent: >-
      Exponent delta 0. Baseline not beaten: p^{1/3+o(1)} time as recorded
