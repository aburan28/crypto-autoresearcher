idea:
  id: IDEA-20261009-511c5c
  question_id: RQ-QLWE-9108dc
  added: '2026-10-09'
  status: proposed
  approved_by: null
  title: Log-S-unit lattice non-randomness score against the spherical model, per ring
  class: measurement
  claim: >-
    For prime-power cyclotomic fields with phi(m) <= 48 (frozen list, at
    most 12 rings), a normalised non-randomness score of the log-S-unit
    lattice — the log ratio of its successive-minima profile (or
    smoothing-parameter ratio) to the Gaussian-heuristic prediction for a
    random lattice of matched dimension and covolume — satisfies:
    score(random lattice) = 1 +/- 0.15 (the null), and either the
    cyclotomic scores deviate from 1 beyond the null band on at least half
    the rings and correlate with per-ring Twisted-PHS-style decoder gain at
    matched budget (Spearman >= 0.6), or the scores stay inside the band
    on every ring (the finding: the S-unit gain is decodability and
    advice, not distributional non-randomness). Either branch is the
    deliverable. No deployed parameter set is touched.
  mechanism: >-
    The object is the deviation of the log-S-unit lattice's geometry from
    the spherical model that structure-blind estimates assume. KN-LIT-5227
    reports S-unit lattices are non-random (qualitatively, from the
    spherical-model critique); KN-LIT-4775 reports explicit Stickelberger
    generators construct full-rank log-S-unit sublattices usable by
    Twisted-PHS. Neither records a measured, controlled, per-ring score.
    The instrument: compute the S-unit group (or the Stickelberger
    sublattice) exactly at small conductor, take the log-embedding
    lattice, and score its normalised minima and smoothing ratio against
    the Gaussian-heuristic prediction for matched dimension and covolume.
    Lossy projection: the score forgets the ring's arithmetic and retains
    only geometry — an advantage tracking the score uses distributional
    non-randomness; one surviving a flat score uses decodability
    (KN-LIT-115) instead. The null is the random-lattice score; the
    nearby-ring control is a non-cyclotomic monogenic field of the same
    degree.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-5227
      provenance: kb
      claim: >-
        S-unit lattices deviate from spherical models (reported
        qualitatively; no measured score exists there).
      verified_by: knowledge/literature/KN-LIT-5227.md
    - ref: KN-LIT-4775
      provenance: kb
      claim: >-
        Explicit Stickelberger generators construct full-rank log-S-unit
        sublattices serving as Twisted-PHS approximations, at cyclotomic
        degree up to 210.
      verified_by: knowledge/literature/KN-LIT-4775.md
    - ref: KN-LIT-2568
      provenance: kb
      claim: PHS query-phase cost and advice structure for ideal lattices.
      verified_by: knowledge/literature/KN-LIT-2568.md
  assumptions:
    - >-
      S-unit groups at the frozen conductor list are computable exactly with
      Sage/PARI within hours; Stickelberger sublattices substitute where
      the full group is out of reach, and the substitution is recorded per
      ring.
    - >-
      The Gaussian heuristic for random lattices of matched dimension and
      covolume is the correct structure-blind null model.
  predictions:
    - metric: null_score
      direction: different
      minimum_effect: >-
        Random-lattice scores equal 1 within +/- 0.15 over >= 100 draws
        per dimension; outside, the instrument is miscalibrated and every
        reading is blocked.
    - metric: cyclotomic_score_dispersion
      direction: different
      minimum_effect: >-
        Deviation beyond the null band on at least half the rings
        (non-randomness present) or inside the band on every ring
        (flat-score finding); both pre-registered, one is the outcome.
    - metric: score_gain_correlation
      direction: higher
      minimum_effect: >-
        Spearman >= 0.6 between score deviation and decoder gain at matched
        budget over off-null rings; or the correlation is measured and
        reported at whatever value with the flat-score branch
        pre-registered as expected.
  minimal_test:
    design: >-
      (1) Freeze the conductor list: every prime-power m with phi(m) <= 48,
      ascending, cap 12, plus one non-cyclotomic monogenic field of
      degree 8 (nearby control) and random lattices (null, 100 draws per
      dimension). (2) Per ring: compute the S-unit group (or recorded
      Stickelberger sublattice), form the log-embedding lattice, record
      dimension, covolume, successive minima, smoothing ratio. (3)
      Score against the Gaussian-heuristic prediction. (4) Where a
      planted short target exists: run the Twisted-PHS-style query phase at
      matched budget, record its achieved approximation factor versus
      matched BKZ. (5) Correlate score deviation with decoder gain.
    controls:
      - Random lattices of matched dimension and covolume (the null).
      - Non-cyclotomic monogenic field of the same degree.
      - One cyclotomic ring with the Stickelberger generator set withheld
        (random basis of the same sublattice) to separate basis effects
        from lattice geometry.
    required_metrics:
      - per-ring score with the substitution used recorded
      - random-lattice null band per dimension
      - per-ring decoder gain at matched budget
      - Spearman correlation with sample size and interval
  falsification_conditions:
    - >-
      The null band exceeds +/- 0.15 or is dimension-dependent beyond
      tolerance: the instrument is miscalibrated; no ring reading stands.
    - >-
      The withheld-basis control changes the score beyond the null band:
      the score measures basis presentation, not geometry.
    - >-
      Scores are off-null but uncorrelated with gain: the score is real
      geometry but not the attack's channel — recorded as the
      decodability obstruction with the measured correlation as its size.
  confounders:
    - >-
      S-unit computation is subexponential; a ring that does not finish is
      recorded not-computed (infrastructure), never as a zero score.
    - >-
      Stickelberger-sublattice substitution changes the object; the
      substitution is recorded per ring and kept distinct in every reading.
    - Multiple-testing across at most 12 rings is Holm-corrected in the
      correlation statement.
  interpretation_limits:
    - Toy degrees (phi(m) <= 48); no transfer to any deployed parameter
      set or statement about ML-KEM, ML-DSA, Falcon, Hawk, NTRU,
      FrodoKEM.
    - A flat score closes only the distributional-non-randomness channel on
      the tested rings; decodability (KN-LIT-115) and advice quality
      (KN-LIT-2568) stay open.
    - No quantum cost is exercised; the decoder gain is classical.
  proof_search_map:
    bottleneck: >-
      Whether the S-unit attack's per-ring gain is carried by distributional
      non-randomness of the log-S-unit lattice (KN-LIT-5227's report) or
      only by decodability and advice; measuring the score-gain link
      decides which channel future proposals target.
    baseline_embedding:
      parameter_slice: >-
        The null (random lattices, Gaussian heuristic) reproduces the
        structure-blind prediction exactly; the Stickelberger sublattice
        construction reproduces KN-LIT-4775's object at the smallest
        conductor.
      reproduction_check: >-
        The null band calibrates to 1 +/- 0.15 before ring readings; the
        smallest-conductor sublattice matches the recorded full-rank
        property.
    observation_collision:
      observable: the normalised score and the per-ring decoder gain.
      distinct_preimage_search: >-
        A random lattice perturbed to have one unusually short vector (same
        covolume) has a non-null score without ring structure: if decoder
        gain tracks score there too, the score channel is generic geometry,
        not S-unit structure.
    constructive_transforms:
      - transform: specialize_measure_pack
        proposed_object: >-
          The non-randomness score as a target-specific measure
          lower-bounding how much a structure-blind estimate misprices the
          S-unit lattice, packed per ring.
        predicted_gain: >-
          A per-ring instrument predicting where S-unit attacks pay, or the
          flat-score obstruction redirecting the lane to decodability.
    quantifier_order: >-
      For every ring in the frozen list (exists computation) the score is
      measured; the correlation statement is over tested rings only, never
      'for every number field'; the flat-score branch is pre-registered
      so it cannot be reinterpreted post hoc.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the frozen list, the log-S-unit score is (or is not) the
        channel carrying decoder gain, with the correlation and interval;
        nothing about untested rings or deployed parameters.
      nearby_object_control: >-
        The non-cyclotomic field and the perturbed-random lattice; a score
        not separating them measures generic geometry.
    proof_obligations:
      - claim: the null band calibrates before ring readings
        responsibility: baseline
      - claim: the score is basis-independent (withheld-basis control)
        responsibility: correctness
      - claim: the conductor list is frozen and committed before the run
        responsibility: scope
      - claim: substitutions are recorded per ring
        responsibility: interface
      - claim: the correlation carries multiple-testing correction
        responsibility: success_probability
  heuristic_assumptions:
    - id: H1
      statement: >-
        The Gaussian heuristic predicts the successive-minima profile of
        random lattices of matched dimension and covolume within the null
        band.
      rigorous_support: >-
        Classical random-lattice theory as summarised in KN-LIT-5227's
        spherical-model framing (reported; Gauss asymptotics).
      validation_plan: >-
        The null cell is the validation: 100 draws per dimension; band
        must calibrate to 1 +/- 0.15 or the run blocks.
    - id: H2
      statement: >-
        Per-ring decoder gain at matched budget is a sufficient statistic
        for 'the S-unit attack pays here', at toy scale.
      rigorous_support: >-
        The PHS/Twisted-PHS query-phase structure (KN-LIT-2568,
        KN-LIT-7288) makes the achieved approximation factor the operative
        quantity (reported).
      validation_plan: >-
        Matched-budget BKZ per ring as the structure-blind baseline; the
        gain must vanish against it where the score is null.
  target_complexity:
    time_exponent: >-
      No exponent claimed. S-unit computation is subexponential in the
      conductor (related recorded costs exp(O((log D)^{2/3})),
      KN-LIT-2568); the frozen list keeps every ring inside hours of exact
      arithmetic.
    memory_exponent: negligible at these degrees.
    best_known: >-
      The spherical model itself is the structure-blind baseline the
      instrument prices; no attack exponent is improved by this record.
    hidden_overhead: >-
      Stickelberger-sublattice substitution where full S-units are out of
      reach; recorded, not hidden.
    tradeoff_note: none proposed.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP question; the ECDLP map carries no lattice S-unit rows.
    nearest:
      - ref: KN-LIT-5227
        provenance: kb
        relation: same
        delta: >-
          The source reports S-unit non-randomness qualitatively; this idea
          supplies the measured, null-controlled per-ring score and its
          correlation with attack gain.
      - ref: KN-LIT-4775
        provenance: kb
        relation: adjacent
        delta: >-
          The source constructs Stickelberger sublattices for Twisted-PHS;
          this idea scores them as objects rather than improving them, and
          records the substitution per ring.
      - ref: KN-LIT-2568
        provenance: kb
        relation: adjacent
        delta: >-
          The source provides the query phase whose gain is the correlate;
          this idea adds the geometry instrument, not a new query phase.
  dominated_by: >-
    Baseline named: the spherical/Gaussian-heuristic model on random
    lattices (the null) and matched-budget BKZ per ring; Twisted-PHS is
    the decoder whose gain is measured. The instrument beats none of them
    and claims no attack.
  sota_delta: >-
    Not an attack claim. Separator: the per-ring score with its null band
    and Spearman correlation with decoder gain — the first controlled
    measurement separating distributional non-randomness from decodability
    as the S-unit attack's channel.
