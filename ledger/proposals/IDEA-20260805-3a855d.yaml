idea:
  id: IDEA-20260805-3a855d
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  added: '2026-08-05'
  title: >-
    Charge what nobody charged: the uncosted poly(n) oracle-call factor, the
    four relayed HAWK gate figures that no single affine cost model fits, the
    absent memory column, and the unreconciled n/2+1 versus 3m/8+1
    normalisation
  class: control

  claim: >-
    Every number this program holds about the disclosed HAWK attack is relayed,
    and four of them can be audited against each other and against elementary
    arithmetic AT ZERO COMPUTE. Four findings are pre-registered as the audit's
    targets, each with the derivation already performed in this record and each
    checkable by a reader with a calculator:
    (A1) THE poly(n) FACTOR IS NOT VISIBLY CHARGED. The reduction is reported to
    need O(n^2 log n) exact-SVP oracle calls, yet the headline figures 2^108 and
    2^182 are reported as costs. n^2 log2 n is 2^21.17 at n = 512 and 2^23.32 at
    n = 1024. If the oracle-call count is uncharged, the true figures are
    2^129.2 and 2^205.3 -- 21 and 23 bits, which is not a rounding error and is
    exactly the class of omission AGENTS.md rule 4 and KN-TECH-035 forbid.
    (A2) THE FOUR RELAYED GATE FIGURES ARE NOT JOINTLY CONSISTENT WITH ANY
    SINGLE AFFINE COST MODEL. Fitting C(beta) = s*beta + d to (452, 150) and
    (257, 108) gives s = 0.2154, d = 52.65; fitting it to (940, 288) and
    (513, 182) gives s = 0.2482, d = 54.65. Cross-predicting, fit A puts
    beta = 513 at 2^163.1 against a relayed 2^182, and beta = 940 at 2^255.1
    against a relayed 2^288; fit B puts beta = 257 at 2^118.4 against a relayed
    2^108 and beta = 452 at 2^166.9 against a relayed 2^150. Residuals of 10 to
    33 bits. Either the four figures come from more than one model, or the
    beta_key-to-parameter-set mapping assumed here is wrong, or a relayed number
    is wrong. All three possibilities are diagnostic and cheap to separate.
    (A3) NO MEMORY IS CHARGED ON EITHER SIDE. Under the standard sieve
    heuristic (RECALLED, UNVERIFIED: 2^{0.2075 beta} vectors) the ATTACK needs
    2^53.3 vectors at beta = 257 and 2^106.4 at beta = 513, while the SPEC
    BASELINE needs 2^93.8 at beta = 452 and 2^195.0 at beta = 940. Both sides
    are RAM-model figures with free memory, and the baseline's 2^195 is not a
    physically meaningful quantity. A comparison in which both endpoints are
    unreachable for memory reasons is not a comparison of attainable costs, and
    this program's own house exemplar is memory-Pareto-INCOMPARABLE for exactly
    this reason (docs/target-result-profile.md).
    (A4) THE COMPETING DIMENSION CLAIM IS NORMALISATION-AMBIGUOUS, AND THE
    AMBIGUITY IS DECIDABLE ON PAPER. Relayed, not read: iacr:2026/1560
    (Mureau, Pellet-Mary) claims 3m/8 + 1 and credits m/2 + 1 to Ducas'23. If m
    is the CONDUCTOR then m = 2n and 3m/8 + 1 = 3n/4 + 1, WORSE than n/2 + 1,
    while the credited m/2 + 1 = n + 1 is no reduction at all -- an incoherent
    reading. If m is the DEGREE then 3m/8 + 1 = 3n/8 + 1, BETTER than n/2 + 1,
    and the credited m/2 + 1 = n/2 + 1 is a PRIORITY CLAIM against the disclosed
    attack's headline. Only the second reading is internally coherent, and it
    inverts both the ranking and the attribution. This record does not assert
    it; it states that one page of arithmetic against the two abstracts settles
    it, and that nobody in this corpus has done that page.

  object_first_candidate:
    tracked_object: >-
      THE COST STATEMENT ITSELF, followed as an object: the ordered tuple
      (oracle dimension, number of oracle calls, gate count, memory, cost model,
      normalisation of n) attached to each of the two competing HAWK dimension
      claims and to HAWK's own specification baseline. What is tracked through
      the audit is that tuple's COMPLETENESS -- which slots are filled, which
      are empty, and which are filled from a different model than their
      neighbours. The object is not a lattice and not an algorithm; it is a row
      of a cost table, and the claim is that this program has been citing rows
      with empty columns.
    established_families_off_limits: >-
      Off-limits as the primary lens: (a) every actual attack on HAWK, including
      the tau-cocycle route -- this proposal does not attack anything and must
      not drift into doing so; (b) lattice-reduction simulation, BKZ profile
      prediction, and any attempt to re-derive beta_key from HAWK's own
      analysis, because that requires the Round-3 specification which is UNREAD;
      (c) quantum cost models, which multiply the number of conventions without
      touching the classical inconsistency that is the target here;
      (d) the nrd-PIP family. Point (b) is the important restraint: the honest
      audit compares relayed numbers against each other and against arithmetic,
      and does NOT pretend to recompute HAWK's own security analysis from a
      document it has not read.
    newness_score: >-
      No mathematical novelty is claimed and none exists: the arithmetic is
      addition and a two-point line fit. The novelty is entirely in the corpus:
      this program has cited 2^150 -> 2^108 and 2^288 -> 2^182 in three records
      (KN-LIT-7592, KN-OPEN-028, and the BATCH-001 transcription) without ever
      checking whether they are mutually consistent, and EV-HAWK-001 explicitly
      quarantines them ("are NOT adopted, repeated or relied on by this record")
      rather than auditing them. Quarantine is not an audit. This proposal is
      the audit, and it is the ANGLE-BRIEF's template T-D ("charge what nobody
      charged") and T-B ("the forced value") applied to the one lane of this
      goal that needs no gated source.
    testability_score: >-
      Maximal. A1, A2 and A4 are pen-and-paper and are already performed in this
      record; the experiment is to CHECK them against the primary text and to
      record which of the three explanations in A2 holds. A3 requires one
      recalled constant to be replaced by a read one.
    survival_score: >-
      The arithmetic survives completely -- it is reproduced above and can be
      re-derived by anyone. What may not survive is the INTERPRETATION: A1 and
      A2 both have an innocent explanation (the poly factor absorbed into the
      "at most"; the four numbers drawn from two different tables), and the
      audit's job is to find out which, not to prefer the incriminating reading.

  mechanism: >-
    THE INPUTS ARE RELAYED AND THE ARITHMETIC IS THIS SESSION'S. Every figure
    below is quoted from KN-LIT-7592 or from
    coordination/goals/GOAL-HAWK-001/batches/BATCH-001/tasks/TASK-20260802-004/
    disclosed_attack_transcription.md. KN-LIT-7592's own "Not verified here"
    section lists all of them as unverified, and EV-HAWK-001 states that this
    program does not adopt them. They are therefore CANDIDATES TO CHECK. All
    computation below was performed in this session in Python 3 and is
    reproducible from the stated inputs.

    (M0) THE INPUTS, WITH THEIR PROVENANCE.
      I1  "reduces key-recovery cost from 2^150 to at most 2^108 for HAWK-512
           and from 2^288 to at most 2^182 for HAWK-1024" -- KN-LIT-7592,
           attributed there to the AGPS20 gate model as used in HAWK spec 5.3.
      I2  "HAWK's designers had derived BKZ blocksizes beta_key in
           {211, 452, 940}" -- KN-LIT-7592. THE MAPPING OF THESE THREE VALUES TO
           HAWK-256 / 512 / 1024 IS AN INFERENCE MADE HERE FROM THEIR ORDER AND
           IS NOT A QUOTATION. If the mapping is wrong, A2 dissolves; checking
           it is stage 1 of the audit and it is the cheapest way to make A2 go
           away.
      I3  "poly(n) calls to an exact-SVP oracle in dimension n/2 + 1" and
           "O(n^2 log n) oracle calls suffice" -- KN-LIT-7592.
      I4  "With the provable sieve of [ADRS15] as the oracle this gives time
           2^{(n/2+1)+o(n)} unconditionally" and "Core-SVP is our conversion
           2^{0.292 beta}" -- transcription file, verbatim, with the note that
           the Core-SVP conversion is by the authors' own labelling HEURISTIC
           while the ADRS15 figure is unconditional.
      I5  "HAWK key sizes must roughly double for the claimed security levels"
           -- KN-LIT-7592, attributed there to the accompanying blog post.
      I6  RELAYED FROM THIS SESSION'S SCOUTING BRIEF ONLY, NOT READ:
           iacr:2026/1560 claims 3m/8 + 1 and credits m/2 + 1 to Ducas'23; a
           pqc-forum post reports a concurrent attack reaching 3n/4.

    (M1) THE ORACLE-CALL FACTOR (A1). n = 512: n^2 log2 n = 2359296 = 2^21.17.
    n = 1024: n^2 log2 n = 10485760 = 2^23.32. n = 256: 524288 = 2^19.00 exactly.
    If the reported 2^108 and 2^182 price ONE oracle call, total attack cost is
    at least 2^129.2 and 2^205.3 before any constant in the O(). If they price
    the whole attack, the per-call cost is 2^86.8 and 2^158.7 and the implied
    per-call model must be checked against I4's 0.292*beta = 75.0 and 149.8.
    NOTE THAT THE SECOND READING IS CLOSER: 86.8 versus 75.0 and 158.7 versus
    149.8 are gaps of 11.8 and 8.9 bits, plausible as the AGPS20-versus-CoreSVP
    difference, whereas 108 versus 75 and 182 versus 150 are gaps of 33 and 32
    bits. THIS IS EVIDENCE, DERIVED BEFORE ANY READING, THAT THE poly FACTOR IS
    PROBABLY ALREADY CHARGED -- and recording that is as much the point as the
    alternative would have been. The audit's job is to confirm it from the text,
    and A1's honest pre-registered expectation is therefore "probably charged,
    check it", not "uncharged".

    (M2) THE AFFINE-MODEL FIT (A2). A cost model of the form
    C(beta) = s*beta + d has two parameters and there are four relayed points,
    so consistency is a genuine two-degree-of-freedom test rather than a
    tautology. Fitting the HAWK-512 pair (452, 150), (257, 108):
    s = 42/195 = 0.21538, d = 52.646. Fitting the HAWK-1024 pair (940, 288),
    (513, 182): s = 106/427 = 0.24824, d = 54.651. The intercepts agree to
    2 bits; the SLOPES DIFFER BY 15 PER CENT. Cross-predictions, computed in
    this session: fit A at beta = 513 gives 163.1 (relayed 182, residual 18.9);
    fit A at beta = 940 gives 255.1 (relayed 288, residual 32.9); fit B at
    beta = 257 gives 118.4 (relayed 108, residual 10.4); fit B at beta = 452
    gives 166.9 (relayed 150, residual 16.9). NO SINGLE AFFINE MODEL FITS ALL
    FOUR. Three candidate explanations, all cheap to separate and all
    pre-registered here so that whichever holds cannot be presented as a
    discovery afterwards: (E-i) the spec figures 2^150 and 2^288 come from
    HAWK's own table and the attack figures from the authors' own conversion,
    i.e. two models -- most likely, and it would mean the "2^150 -> 2^108"
    arrow compares across models and should never be cited as a single-model
    ratio; (E-ii) the beta_key mapping inferred in I2 is wrong; (E-iii) a relayed
    number is wrong. The audit reports which, and if (E-i) holds it publishes
    the correction that a cross-model arrow is not a speedup figure.

    (M3) THE MEMORY COLUMN (A3). Under the recalled and UNVERIFIED sieve
    heuristic of 2^{0.2075 beta} vectors: beta = 129 -> 2^26.8; 211 -> 2^43.8;
    257 -> 2^53.3; 452 -> 2^93.8; 513 -> 2^106.4; 940 -> 2^195.0 vectors, each
    vector of size beta machine words. The attack's memory at HAWK-1024 is
    therefore of order 2^106 vectors, and the BASELINE it is compared against is
    of order 2^195 vectors. Two consequences. First, the improvement SURVIVES a
    memory charge in the ranking sense -- the attack is better on BOTH axes,
    which is a stronger statement than the paper's own and is worth recording as
    such rather than as a caveat. Second, and against the direction that would
    flatter the attack: both figures are physically unreachable, so the arrow
    2^288 -> 2^182 is an arrow between two unattainable points and its practical
    content is carried entirely by I5's "key sizes must roughly double", not by
    the gate ratio. THE 0.2075 CONSTANT IS RECALLED FROM MEMORY AND IS NOT
    VERIFIED; replacing it with a read value is step 1 of A3 and the audit must
    not report any memory figure until it is replaced.

    (M4) THE DOUBLING CHECK ON I5 (a forced value the relayed recommendation
    must satisfy). If HAWK-512's security target is the 2^150 its own analysis
    claimed, then restoring it against an attack at oracle dimension n/2 + 1
    requires n/2 + 1 = beta* where C(beta*) = 150. Under fit A, beta* = 452 and
    n = 902; under fit B, beta* = 384 and n = 766. BOTH ROUND UP TO THE NEXT
    POWER OF TWO, 1024, i.e. EXACTLY A DOUBLING. So I5's "roughly double" is
    arithmetically consistent with I1 under either fit, and that consistency is
    a genuine corroboration of a relayed claim derived here rather than taken on
    trust. It is also the clearest statement of what the attack costs HAWK:
    not a break, but the loss of the compactness that motivated the scheme.

    (M5) THE NORMALISATION RECONCILIATION (A4). For HAWK, K = Q(zeta_m) with
    m = 2^ell and ring degree n = phi(m) = m/2. Substituting into the relayed
    claim 3m/8 + 1:
      READING 1, m = conductor: 3m/8 + 1 = 3n/4 + 1. This is LARGER than
      n/2 + 1, so it would be a weaker result -- and it matches the relayed
      pqc-forum report of a concurrent attack reaching 3n/4, which is
      corroborating. But the same reading makes the credited m/2 + 1 equal to
      n + 1, which is the full rank of the cocycle lattice and therefore no
      reduction at all, so the credit sentence becomes meaningless.
      READING 2, m = degree: 3m/8 + 1 = 3n/8 + 1, SMALLER than n/2 + 1 and hence
      a strictly better result; and the credited m/2 + 1 = n/2 + 1 is exactly
      the disclosed attack's headline, making the sentence a PRIORITY CLAIM
      attributing it to Ducas'23.
    Reading 2 is the only one under which BOTH halves of the relayed sentence
    are meaningful, so it is the reading this record expects -- WITHOUT
    ASSERTING IT, because iacr:2026/1560 was not read and the relay itself came
    from a scouting document rather than from a source. The consequences if
    Reading 2 is right are large and belong in this goal's scope: the best known
    oracle dimension is 3n/8 + 1 rather than n/2 + 1 (a further factor 3/4 in
    the exponent, i.e. HAWK-512 at beta = 193 rather than 257), and the
    attribution of n/2 + 1 is contested. Settling it needs the two ABSTRACTS,
    which the literature sweep measured as reachable (ePrint abstract pages
    return 200; only the PDFs are Cloudflare-gated).

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    what_the_screen_could_see: >-
      Every record in this corpus that cites a HAWK cost figure: KN-LIT-7592,
      KN-OPEN-028, EV-HAWK-001, DEC-20260802-007, CORR-20260802-008,
      CORR-20260802-bc9e33, and the three BATCH-001 task artifacts. IT COULD NOT
      SEE the disclosed attack's Table 1 and its cost section, HAWK's Round-3
      specification tables 7 and 8, AGPS20, ADRS15, or iacr:2026/1560. Every
      cost constant used above is therefore either relayed or recalled, and each
      is labelled.
    result: >-
      No record in this corpus performs any arithmetic on the four gate figures.
      EV-HAWK-001 quarantines them; CORR-20260802-008 defect 2 records the
      RELATED but different observation that the disclosed attack and van
      Gent-Pulles "are quoted in different units ... and were never placed in a
      common cost unit", which is the same failure mode in a different pair and
      is cited here as precedent that the failure mode is real in this lane.
      Nothing addresses A1, A2, A3 or A4.
    conclusion: >-
      Novel within this corpus. Zero novelty is claimed against the external
      literature, where all four questions are presumably answered inside the
      papers themselves; the deliverable is that THIS PROGRAM stops citing
      unaudited numbers.

  literature_context:
    - >-
      KN-LIT-7592 supplies I1, I2, I3, I5. Its own body lists the gate-count
      conversions as NOT verified and states they "inherit every modelling
      assumption of [AGPS20] and of the HAWK specification's own cost model".
      That sentence is the licence for this audit.
    - >-
      The BATCH-001 transcription supplies I4 verbatim, together with the
      authors' own labelling of the Core-SVP conversion as heuristic and of the
      ADRS15 figure as unconditional -- a distinction this program has not
      carried into any downstream citation.
    - >-
      CORR-20260802-008 defect 2 is the precedent: two HAWK results already
      compared in incommensurable units inside this program's own records.
    - >-
      RELAYED, NOT READ, provenance is a scouting document and not a source:
      iacr:2026/1560 (I6), the pqc-forum 3n/4 report, and the reported NIST
      IR 8610 advancement and subsequent HAWK withdrawal, which the same
      document flags as relayed from journalism rather than from a NIST
      document. NONE OF THESE MAY BE CITED AS FACT and the audit's first stage
      is to replace each with a read abstract or to mark it permanently
      unverified.
    - >-
      KN-TECH-035 and the ANGLE-BRIEF template T-D supply the discipline:
      partial-cost reasoning is an error class this program has named, and
      docs/target-result-profile.md requires "memory complexity stated beside
      time, always".

  lossy_projection_identifiability_audit:
    projection: >-
      A complete attack, with its algorithm, its oracle, its call pattern, its
      working set and its parameter regime --> a single integer, the base-2
      logarithm of a gate count. That integer is what every downstream record
      cites and compares.
    what_is_discarded: >-
      The number of oracle calls; the memory footprint; the cost model's
      identity and its additive constant; whether the figure is a bound or an
      estimate; whether the two ends of an arrow come from the same model; and
      the normalisation of n. Six columns, all of which this record shows can
      change the comparison.
    why_genuinely_lossy: >-
      Extremely lossy, and it is the standard lossiness of the field. That is
      not by itself an objection.
    why_compatible_with_the_operations: >-
      It is NOT compatible, and demonstrating the incompatibility is the whole
      proposal. A cost exponent propagates deterministically through
      comparisons ONLY IF both endpoints are projections of the same model. A2
      shows that the four relayed points cannot all be projections of one affine
      model, so the arrow 2^150 -> 2^108 does not propagate as a ratio. This is
      the technical content of the objection and it is checkable.
    is_it_only_a_change_of_coordinates: >-
      No -- it discards genuinely, and it discards the wrong things. The mirror
      failure is the one that bites here and it is named explicitly: the
      projection to a single gate exponent is CONSTANT with respect to memory,
      call count and model identity, so those three cannot be recovered from any
      number of comparisons of exponents. A record that compares exponents can
      never detect a memory-dominated regime, which is why the audit adds the
      columns rather than re-analysing the numbers already present.
    which_failure_was_checked_for: >-
      Both. Change-of-coordinates: refuted (the projection loses six named
      columns). Constant-across-instances: CONFIRMED for the discarded columns
      and that is the finding -- a memory figure cannot be reconstructed from a
      gate figure, so the corpus's memory column is not merely missing, it is
      unrecoverable from what the corpus holds and must be obtained from source.

  assumptions:
    - >-
      That beta_key in {211, 452, 940} maps to HAWK-{256, 512, 1024} in that
      order. INFERRED FROM ORDER, NOT QUOTED. A2 depends on it entirely and
      checking it is the audit's cheapest first step.
    - >-
      That "2^150" and "2^288" are HAWK's own claimed key-recovery costs at
      those blocksizes and not something else. Relayed.
    - >-
      That the sieve memory exponent is 0.2075*beta vectors. RECALLED FROM
      MEMORY, UNVERIFIED, and no A3 figure may be published before it is
      replaced by a read value.
    - >-
      That the relay of iacr:2026/1560's abstract via a scouting document is
      accurate. It may not be, and A4's stage 1 is to fetch the abstract page
      directly rather than trust the relay.

  predictions:
    - metric: >-
        A1: is the O(n^2 log n) oracle-call factor included in the reported
        2^108 and 2^182, as determined by reading the disclosed attack's cost
        section?
      direction: different
      minimum_effect: >-
        PRE-REGISTERED EXPECTATION: YES, INCLUDED. Derived in (M1) from the
        residuals -- 2^108 minus 2^21.17 is 2^86.8 against a Core-SVP 2^75.0
        (gap 11.8 bits, the plausible AGPS20-versus-CoreSVP offset), whereas
        2^108 against 2^75.0 is a gap of 33 bits. This proposal therefore
        EXPECTS TO FIND NO DEFECT HERE, states so before looking, and records
        the expectation so that a confirmation cannot be dressed as a discovery.
        If instead the factor is uncharged, the corrected figures are 2^129.2
        and 2^205.3 and every citation of 2^108 in this corpus needs a
        superseding note.
    - metric: >-
        A2: does a single affine cost model C(beta) = s*beta + d reproduce all
        four relayed points to within 3 bits?
      direction: lower
      minimum_effect: >-
        NO -- residuals of at least 10 bits, computed in this session:
        18.9, 32.9, 10.4, 16.9. This is already established arithmetically from
        the relayed inputs; what the audit determines is WHICH of (E-i), (E-ii),
        (E-iii) explains it. The pre-registered expectation is (E-i), two
        different models, in which case the deliverable is the rule that the
        arrow may not be cited as a single-model ratio.
    - metric: >-
        A3: the memory requirement in vectors at each of beta = 129, 211, 257,
        452, 513, 940, computed with a READ sieve-memory exponent
      direction: different
      minimum_effect: >-
        The attack's memory must be STRICTLY BELOW the baseline's at both
        parameter sets, i.e. the improvement is Pareto-DOMINATING and not a
        trade. Predicted from the recalled constant: 2^53.3 vs 2^93.8 at
        HAWK-512 and 2^106.4 vs 2^195.0 at HAWK-1024. If the read constant
        overturns the ordering -- i.e. if the attack needs MORE memory than the
        baseline -- the result becomes a Pareto trade like the house exemplar
        and every citation must say so.
    - metric: >-
        A4: under which normalisation of m is iacr:2026/1560's pair of
        statements (3m/8 + 1 claimed, m/2 + 1 credited to Ducas'23) internally
        coherent?
      direction: different
      minimum_effect: >-
        EXACTLY ONE reading is coherent, and it is predicted to be m = DEGREE,
        giving 3n/8 + 1 as the claim and n/2 + 1 as the credited prior. If the
        conductor reading turns out to be the intended one, the credited
        m/2 + 1 = n + 1 is vacuous and the relay itself is defective; either
        outcome is a finding about the relay chain that this program depends on.
    - metric: >-
        A5 (forced value, corroborative): does I5's "key sizes must roughly
        double" follow arithmetically from I1 and the n/2 + 1 dimension?
      direction: different
      minimum_effect: >-
        YES. Derived in (M4): restoring 2^150 needs n = 902 under fit A or 766
        under fit B, both rounding to 1024. This is a FORCED VALUE the relayed
        recommendation must satisfy and it does. Recorded because a
        corroboration derived before reading is worth as much as a defect, and
        because a failure here would have indicted I1, I3 and I5 jointly.

  minimal_test:
    design: >-
      Four stages, all cheap, ordered so that the first can end the audit.
      STAGE 0 (zero compute, done): the arithmetic of (M1)-(M5), reproduced
      above and independently recomputable from the stated inputs alone.
      STAGE 1 (reading, no compute): confirm or refute the beta_key mapping of
      I2 from the disclosed attack's Table 1 and from HAWK's own tables 7/8 if
      obtainable. IF THE MAPPING IS WRONG, A2 DISSOLVES AND THE AUDIT SAYS SO
      AND STOPS ON THAT LIMB. The paper's PDF is already held at a recorded
      sha256 and was reachable from this harness on 2026-08-02; HAWK's Round-3
      specification is UNREAD and may be unobtainable, in which case that limb
      is recorded as blocked rather than guessed.
      STAGE 2 (reading, no compute): read the cost section for A1 and A3's
      memory constant. Replace every RECALLED constant with a read one or mark
      the corresponding figure permanently unpublished.
      STAGE 3 (network, minutes): fetch the ePrint ABSTRACT pages for
      iacr:2026/1560 and for the Ducas'23 reference it credits -- abstract
      pages, not PDFs, since the literature sweep measured abstracts at 200 and
      PDFs at 403 -- and settle A4 by substitution.
    controls:
      - >-
        NULL-C (matched null for the fit, forced value derived pre-run, CAN
        FAIL). Apply the identical two-point affine fit and cross-prediction
        procedure to FOUR POINTS KNOWN TO COME FROM ONE MODEL: the Core-SVP
        values 0.292*beta at beta = 257, 452, 513, 940, i.e. (257, 75.0),
        (452, 132.0), (513, 149.8), (940, 274.5). FORCED VALUE: residuals
        EXACTLY ZERO, because the model is affine with d = 0 by construction. If
        the procedure reports non-zero residuals on this null, the procedure is
        broken and A2 is void. This null can genuinely fail (a coding error, a
        rounding convention, a transposed pair) and it is the reason A2's
        residuals mean anything.
      - >-
        POSITIVE CONTROL PC-C (the effect MUST appear). Construct a synthetic
        four-point set from TWO deliberately different affine models -- e.g.
        s = 0.2925, d = 16.4 for one pair and s = 0.265, d = 0 for the other --
        and confirm the procedure flags them as jointly infeasible with
        residuals above 3 bits. If the procedure cannot detect a planted
        two-model inconsistency, its negative on the real data is worthless and
        NO conclusion may be drawn.
      - >-
        GRADED CONTROL (>= 3 interior points, monotonicity reported). Sweep the
        planted model separation delta_s in {0.00, 0.01, 0.02, 0.05, 0.10} and
        report the maximum cross-prediction residual as a function of delta_s.
        This calibrates the instrument: it says how big a model difference the
        observed 10-33 bit residuals correspond to, converting "inconsistent"
        into a NUMBER. A residual that does not grow with delta_s is the
        canonical artifact tell and voids A2.
      - >-
        VERDICT-ON-THE-NULL-FIRST. NULL-C and PC-C are run and their outputs
        hash-committed BEFORE the four relayed points are fitted.
      - >-
        ARCHIVE CHECK (zero compute). No prior cost audit of any HAWK figure
        exists in this program; CORR-20260802-008 defect 2 records the analogous
        unit-mismatch for a different pair and is cited as precedent, not as a
        prior measurement.
    required_metrics:
      - the beta_key-to-parameter-set mapping, quoted with its source location or marked unobtainable
      - whether the oracle-call factor is charged, quoted from the cost section
      - the read sieve-memory exponent, with its source, replacing the recalled 0.2075
      - the six memory figures in vectors and in bytes, with the vector-size convention stated
      - the four cross-prediction residuals, and the NULL-C and PC-C results reported first
      - the graded residual-versus-delta_s table, at least five points
      - the resolved normalisation of iacr:2026/1560, with the abstract quoted verbatim

  falsification_conditions:
    - >-
      NULL-C returns non-zero residuals. The fitting procedure is broken and A2
      is withdrawn entirely.
    - >-
      PC-C fails to flag a planted two-model set. The procedure has no power and
      no negative may be reported.
    - >-
      The beta_key mapping of I2 is wrong. A2 dissolves and the audit reports
      that its own inference, not the source, was the defect. This is the single
      most likely outcome for the A2 limb and is pre-registered as such.
    - >-
      A1's expected finding (factor already charged) is confirmed. The limb
      closes with no defect and the audit says so plainly; a confirmed
      no-defect is a deliverable and is not a failure of the proposal.
    - >-
      The read memory exponent overturns A3's predicted ordering. The disclosed
      attack becomes a Pareto TRADE rather than a domination, and every future
      citation in this program must carry both columns.
    - >-
      iacr:2026/1560's abstract is unreachable and no author copy exists. A4 is
      recorded as blocked. THIS IS AN INFRASTRUCTURE OUTCOME AND NOT EVIDENCE
      about either dimension claim (AGENTS.md rule 5).

  confounders:
    - >-
      RELAY DEPTH IS THE DOMINANT CONFOUNDER AND IT CUTS TOWARD FALSE POSITIVES.
      Every input is second-hand or third-hand. An inconsistency found among
      relayed numbers is far more likely to indict the relay than the paper, and
      the audit's reporting rule must state that ordering before it states the
      finding. This proposal is written so that its most probable deliverable is
      "the numbers are fine, our transcription and our inferred mapping were the
      weak links", and that outcome is a success.
    - >-
      AN "AT MOST" IS NOT AN EQUALITY. I1's figures are upper bounds. A2's fit
      treats them as points, which is the standard abuse; if the bounds are
      loose by different amounts the slopes will differ for an innocent reason.
      This is explanation (E-i)'s close cousin and the audit must distinguish
      them.
    - >-
      THE 0.2075 CONSTANT IS RECALLED. Publishing any A3 figure before replacing
      it would be exactly the fabrication AGENTS.md rule 9 forbids, and the
      stopping rule reflects that.
    - >-
      MODEL PROLIFERATION. AGPS20, Core-SVP, ADRS15 and HAWK's own table are
      four conventions, and the ANGLE-BRIEF records that a cross-family
      "quantum/classical cost-convention register" does not exist anywhere in
      this program. The audit must name its convention on every number it emits
      or it will reproduce the defect it is auditing.
    - >-
      AUTHORSHIP ASYMMETRY, INVERTED. Finding fault with a widely-praised result
      is cheap to produce and reads as rigour. The controls, the pre-registered
      expectation that A1 finds nothing, and the pre-registered ordering that
      the relay is indicted before the source, all exist to make a negative cost
      something to reach.

  interpretation_limits:
    - >-
      NOTHING HERE IS A CRITICISM OF THE DISCLOSED ATTACK. Every input is a
      relayed summary of a paper this program has read only in part; the target
      is this program's own citation practice.
    - >-
      NO CORRECTED SECURITY FIGURE FOR HAWK MAY BE PUBLISHED FROM THIS AUDIT.
      Even if A1 finds an uncharged factor, the corrected number would be an
      arithmetic adjustment of a relayed bound, not this program's own cost
      analysis, and RQ-HAWK-001's toy-tier ceiling is untouched.
    - >-
      A4's resolution, whichever way it goes, is a statement about two ABSTRACTS
      and about internal coherence -- not about which attack is correct, which
      would require reading two bodies this program cannot obtain.
    - >-
      NOTHING HERE BEARS ON HAWK'S ROUND-3 DECISION, and the 2026-08-14 deadline
      recorded in KN-OPEN-028 is a reason the question is timely rather than a
      licence to advise.
    - >-
      THE PROGRAM'S NON-DUPLICATION OBLIGATION: A2's residuals are already
      computed above, so an executor must not present recomputing them as the
      deliverable. The deliverable is stages 1-3, which are reading.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE IS LOAD-BEARING. Every quantity in (M1)-(M5) is exact arithmetic on
        stated inputs. The heuristics live entirely in the INPUTS -- AGPS20's
        model, Core-SVP's 0.292, the sieve's 0.2075, HAWK's own Table 8 success
        condition -- and the audit's purpose is to name them and attribute each
        figure to one, not to assume any.
      rigorous_support: >-
        A two-parameter affine model cannot fit four generic points; that is
        linear algebra, and the residuals quantify the failure. The doubling
        computation in (M4) is one division. The normalisation substitution in
        (M5) is one substitution of m = 2n.
      validation_plan: >-
        NULL-C (a four-point set known to come from one model, residuals forced
        to zero) and PC-C (a planted two-model set, residuals forced above the
        threshold), both run and committed before the real fit.
    - id: H2
      statement: >-
        The sieve memory requirement is 2^{0.2075 beta} vectors.
      rigorous_support: >-
        NONE OFFERED. This is RECALLED FROM MODEL MEMORY and is a candidate to
        check, never an authority. It is stated here only so that A3's
        prediction has a pre-registered value that a read constant can refute.
      validation_plan: >-
        Replace with a read constant in Stage 2. If no read constant can be
        obtained, A3 emits no figure at all and records the block.
    - id: H3
      statement: >-
        beta_key in {211, 452, 940} corresponds to HAWK-{256, 512, 1024}.
      rigorous_support: >-
        Inference from the ordering of a three-element list in a corpus entry.
        Weak, and named as the audit's most likely point of self-inflicted
        error.
      validation_plan: >-
        Stage 1, from the disclosed attack's Table 1 or HAWK's tables.

  target_complexity:
    time_exponent: >-
      THIS PROPOSAL MOVES NO EXPONENT AND PROPOSES NO ALGORITHM, and it is worth
      running anyway for a specific reason rather than a general one: it decides
      what the exponent this goal is chasing actually IS. If A4 resolves to the
      degree normalisation, the best-known oracle dimension is 3n/8 + 1 rather
      than n/2 + 1 -- HAWK-512 at beta = 193 instead of 257, a further 0.75
      factor in the exponent -- and this goal has been aimed at the second-best
      result. If A2 resolves to (E-i), the headline arrow 2^150 -> 2^108 is a
      cross-model comparison and its 42-bit ratio is not a single-model speedup.
      Both are statements about which exponent is the target, which is upstream
      of any attempt to move one.
    memory_exponent: >-
      Of the audit: negligible. Of the objects audited: 2^{0.2075 beta} vectors
      under a recalled constant, i.e. the exponent this program has never
      written down for HAWK at all -- see A3. That absence IS the proposal.
    best_known: >-
      Contested and unresolved, which is A4's point: n/2 + 1 (KN-LIT-7592, read
      in part) versus a relayed 3m/8 + 1 (iacr:2026/1560, NOT READ) whose
      normalisation is undetermined, versus a relayed pqc-forum report of 3n/4.
    hidden_overhead: >-
      The O(n^2 log n) oracle-call factor (A1), the memory (A3), and the model
      identity of each endpoint (A2). Naming all three is the deliverable.
    tradeoff_note: >-
      A3 determines whether the disclosed attack is a Pareto DOMINATION or a
      TRADE against HAWK's own baseline. The corpus currently records neither,
      and the house exemplar (Wesolowski, memory-Pareto-incomparable) is the
      standing reminder that the two are not the same result.

  dominated_by: >-
    n/a (no result claimed and no cost offered, so there is no Pareto point to
    dominate). Rows checked on the QUESTION of whether this audit already
    exists: all seven HAWK-citing records in this corpus, enumerated in
    novelty_screen.what_the_screen_could_see -- none performs arithmetic on the
    figures; CORR-20260802-008 defect 2, which records an analogous unit
    mismatch for a different pair and is the closest prior art; and
    GOAL-ICEX-001, this program's own designated cost-charging vehicle, which
    the ANGLE-BRIEF records as active and never executed, so it holds no
    charged frontier that could dominate anything here. NOT checked, and stated
    as unchecked: whether the disclosed attack's own Table 1 already carries a
    memory column (its cost section was not read).
  sota_delta: >-
    Zero on every attack axis. Quantitatively, on the axes the audit does move:
    this program currently holds four HAWK cost figures, zero of which have been
    checked against each other, zero of which carry a memory column, and one
    competing dimension claim whose normalisation is undetermined by a factor
    of two. The audit's output is a completed six-column table
    (dimension, calls, gates, memory, model, normalisation) for three claims,
    plus a resolution of A4 that decides whether the best-known exponent this
    goal targets is n/2 + 1 or 3n/8 + 1 -- a 0.75 factor in the exponent, i.e.
    64 bits at HAWK-512 under Core-SVP. Cost: a few hours, no compute, three
    abstract-page fetches.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that A2's arithmetic stands (the residuals are already computed and
    reproducible from the relayed inputs); but only 0.25 that it indicts the
    SOURCE rather than this program's own inferred beta_key mapping or the
    upper-bound-versus-equality abuse -- and the proposal is written expecting
    the latter.
    0.25 that A1 finds an uncharged factor, for the reason derived in (M1): the
    residual structure already suggests it is charged, and this is stated before
    reading precisely so that the expected null cannot be re-framed later.
    0.85 that A3 produces the first memory column this program has ever held for
    HAWK, conditional on a read sieve constant being obtainable; 0.75 that the
    ordering is a domination rather than a trade.
    0.60 that A4 resolves to the degree normalisation, and 0.80 that it resolves
    at all -- the ePrint abstract pages were measured reachable this session,
    the PDFs were not, and A4 needs only the abstracts.
    Overall this is the highest-probability, lowest-cost deliverable of the three
    proposals filed today and the least ambitious; that combination is why it is
    filed as a control rather than as a mechanism.
