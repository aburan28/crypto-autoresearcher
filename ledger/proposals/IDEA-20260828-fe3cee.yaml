idea:
  id: IDEA-20260828-fe3cee
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Complete the MAXDEPTH-and-memory-constrained crossover table between
    SelfTargetMSIS's lattice and hash arms — the table IDEA-20260805-5194f9
    explicitly names as missing — by applying NIST's depth cap SYMMETRICALLY
    to both arms instead of only to the hash arm, using the AGPS realistic
    quantum-sieve-depth analysis the corpus has never cited
  class: measurement
  claim: >-
    (A) WHAT 5194f9 ALREADY ESTABLISHED AND WHERE IT STOPPED. IDEA-20260805-
    5194f9 proves a non-reordering theorem for lattice-vs-lattice comparisons,
    computes the exact hash-arm size log2|B_tau| = 192.760/225.345/257.015,
    and sketches three conventions for the lattice-vs-hash comparison
    (classical memory-free, classical memory-charged, quantum). For the
    quantum row it states that unconstrained Grover gives Hsh =
    2^(log2|B_tau|/2), which is BELOW the recalled quantum lattice arm at
    every category and so reverses the classical ordering, and that "under
    MAXDEPTH D the Grover cost rises to about |B_tau|/D total gates, which
    for D = 2^40/2^64/2^96 moves the hash arm back up by 40/64/96 bits and
    can reverse the reversal" — and states explicitly: "the deliverable is
    the table of these rows with the crossovers, not a selection among
    them," a table that record does not itself produce. Two things are
    missing from that sketch, both concretely fillable: (i) the ACTUAL
    per-category numeric verdict at each of the three MAXDEPTH classes,
    which 5194f9 leaves as an unevaluated formula; and (ii), more
    importantly, 5194f9's depth cap is applied ONLY to the hash arm's Grover
    search — the recalled quantum lattice-sieve constant (2^(0.265*b)) is
    left untouched, as if the quantum sieve's own circuit depth were free.
    It is not: NIST introduced MAXDEPTH (2^40 to 2^96 logical gates, per its
    stated rationale of yearly-serial-gate-count-to-millennium-scale-serial-
    gate-count bounds, confirmed this session) to bound BOTH sides of every
    comparison it governs, and Albrecht-Gheorghiu-Postlethwaite-Schanck
    ("Estimating Quantum Speedups for Lattice Sieves," ASIACRYPT 2020 /
    ePrint 2019/1161 — the paper NIST's own PQC evaluation and the public
    lattice-estimator tool use for quantum sieve costs) reports, per its
    WebSearch-surfaced abstract, only "a SMALL quantum speedup in dimensions
    of cryptanalytic interest, [requiring] several optimistic physical and
    algorithmic assumptions" — i.e. the idealized quantum-sieve exponent
    5194f9 (and this program generally) treats as a given already assumes
    away realistic depth/architecture constraints on the LATTICE side, not
    just the hash side.
    (B) THE OBJECT. For each FIPS 204 category k and each declared MAXDEPTH
    class D in {2^40, 2^64, 2^96}, define TWO depth-adjusted costs under one
    pinned convention: Hsh(k, D) = max(sqrt(|B_tau(k)|), |B_tau(k)|/D) (the
    standard Grover-under-depth-cap formula, Zalka-style parallelization,
    forced boundary cases at D=1 and D>=sqrt(|B_tau|)); and Latt(k, D) = the
    quantum sieve cost EITHER at its idealized unconstrained exponent (if the
    sieve's own natural circuit depth is already <= D, in which case D does
    not bind the lattice arm and the idealized figure stands) OR at a
    depth-penalized cost if the sieve's natural depth EXCEEDS D — with the
    honest finding, if that second branch is reached, being that NO
    established formula for quantum-sieve cost under an enforced depth cap
    was found in the sources read this session, and that gap is reported by
    name rather than filled by an invented formula.
    (C) THE DISCRIMINATION. Two possible outcomes at each (k, D): (i) the
    quantum sieve's natural circuit depth at FIPS 204-relevant block sizes is
    ALREADY below every MAXDEPTH class considered — in which case 5194f9's
    asymmetric treatment (constrain the hash arm, leave the lattice arm
    idealized) was, after the fact, the CORRECT thing to do, and the full
    two-sided table collapses to 5194f9's own one-sided sketch, now with
    actual numbers filled in and a verified reason the asymmetry was safe;
    (ii) the sieve's natural depth EXCEEDS at least one MAXDEPTH class at
    FIPS 204-relevant block sizes — in which case 5194f9's quantum row
    silently overstates the lattice arm's advantage, the crossover point
    shifts further toward the hash arm than 5194f9's sketch shows, and this
    program has identified a genuine asymmetry in how it (and, per AGPS's
    own "optimistic assumptions" caveat, arguably the field) treats depth
    constraints across the two arms of the same assumption.
    (D) WHAT IS NOT CLAIMED. No attack, no forgery, no new algorithm. This
    is a completion of a table an existing corpus record explicitly says is
    needed, using one additional, previously uncited external ingredient
    (AGPS) for honesty about the lattice side. It does not certify that
    SelfTargetMSIS is weaker or stronger than believed; it certifies which
    of the two arms a fully depth-aware audit says binds, per category, per
    MAXDEPTH class, using the SAME recalled-unverified block-size inputs
    5194f9 already flags as the table's weakest link (crediting that flag
    rather than resolving it).
  mechanism: >-
    STAGE 0, VERIFY AND EXTEND THE HASH-ARM FORMULA. Confirm the standard
    Grover-under-depth-cap cost Hsh(k, D) = max(sqrt(|B_tau(k)|),
    |B_tau(k)|/D) against its two forced boundary cases (D=1 reduces to the
    classical |B_tau| search; D >= sqrt(|B_tau|) reduces to unconstrained
    Grover, reproducing 5194f9's sqrt(|B_tau|) figure exactly) before
    evaluating at any real D.
    STAGE 1, OBTAIN THE SIEVE DEPTH FIGURE. Read the full text (not
    abstract) of AGPS (ePrint 2019/1161) and, if it post-dates or refines
    AGPS's depth model, the arXiv:2105.05608 quantum-walk sieve improvement
    (2^(0.2570*d), fetched abstract this session — confirmed to give a TIME
    exponent only, with NO depth analysis in its abstract, so AGPS remains
    the load-bearing depth source pending a full-text check of both). Extract
    the reported circuit DEPTH (not gate count) as a function of block size
    b for AGPS's most performant near-neighbour variant, under its own
    named "optimistic" and "conservative" assumption sets, since the
    abstract's own hedge ("requires several optimistic ... assumptions")
    implies the paper itself reports more than one regime.
    STAGE 2, EVALUATE. At each FIPS 204 category's recalled block size
    (the same 123/182/252-quantum-bit-class figures 5194f9 already flags as
    RECALLED-UNVERIFIED and inherits unchanged, or the corrected figures if
    EXP-MLDSA-1c66ac's calibrated instrument has by then produced one — this
    record does not re-derive the block size itself), compute AGPS's stated
    circuit depth and compare it against each MAXDEPTH class. If depth <= D
    for all three classes, branch (i) of claim (C) is confirmed and the
    idealized quantum-sieve exponent is used unchanged. If depth > D for
    some class, branch (ii) applies and the record states plainly that no
    validated depth-penalized sieve cost formula was found, reporting the
    UNPENALIZED cost as an explicit LOWER BOUND on the true depth-constrained
    cost (i.e. the true lattice-arm cost under that MAXDEPTH class is AT
    LEAST this large, which if anything strengthens any "hash arm binds"
    conclusion drawn from it, and is flagged as conservative in that
    direction only).
    STAGE 3, TABULATE. Produce the 3 (category) x 3 (MAXDEPTH class) table
    of Hsh(k,D), Latt(k,D) (idealized, and depth-flagged where branch (ii)
    applies), the argmin, and the crossover MAXDEPTH value D*(k) at which
    the argmin flips, per category, closed-form from Hsh(k,D) = Latt(k)
    (unconstrained). Report this alongside the classical-arm rows 5194f9
    already computed, as one combined table.
    STAGE 4, PROPAGATE THE KNOWN CALIBRATION UNCERTAINTY. IDEA-20260805-
    591f9d records this program's own naive block-size instrument disagreeing
    with the recalled published lattice-arm block size by roughly 355 in
    beta at ML-DSA-44. Re-run stage 3 under BOTH the recalled block sizes AND
    591f9d's own re-derived ones, and report whether the argmin or D*(k)
    changes between the two — if it does, the crossover table's headline is
    a statement about which block-size convention is used, not about
    SelfTargetMSIS, and that is reported as the primary caveat rather than
    buried in a footnote.
  novelty_status: unverified
  novelty_screen:
    method: >-
      Read IDEA-20260805-5194f9 in full this session, including its
      lossy_projection_identifiability_audit and parameters_assumed blocks
      (both quoted above), and IDEA-20260805-591f9d's calibration-mismatch
      finding (~355 in beta at ML-DSA-44). Grepped knowledge/ and ledger/ for
      "MAXDEPTH|Grover|circuit depth" (part of the earlier 67/30-file OR-
      pattern searches this session, dominated by unrelated hits; no MLDSA-
      specific hit on a two-sided depth-constrained crossover table). Read
      all other 11 RQ-MLDSA-001 proposals and all 10 sibling RQ-MLDSA-ffa0f5
      proposal headers this session (summarized above); none touches quantum
      circuit depth on either arm. Web: confirmed NIST's MAXDEPTH parameter
      and its 2^40/2^96 rationale via WebSearch this session (not merely
      recalled); fetched arXiv:2105.05608's abstract verbatim (Chailloux-
      Loyer-style quantum-walk sieve improvement to 2^(0.2570*d) time, no
      depth analysis in the abstract); surfaced AGPS (ePrint 2019/1161,
      ASIACRYPT 2020) via WebSearch as the standard reference for realistic
      (non-asymptotic, circuit-level) quantum sieve cost estimation, but did
      NOT fetch or read its full text or abstract page directly this
      session — its content above is a WebSearch synthesis, not a read.
    results: >-
      5194f9 explicitly states the two-sided, MAXDEPTH-tabulated crossover
      is a needed deliverable ("the table nobody in this corpus has") but
      computes only the hash-arm side of it in closed form and leaves the
      lattice arm's quantum cost idealized and depth-unconstrained. No
      record in this corpus applies a depth cap to the quantum SIEVE side of
      any lattice comparison, and no record cites AGPS or any circuit-level
      quantum sieve cost source. This is confirmed by direct reading of
      5194f9, not by a title/count screen.
    verdict: >-
      ADAPTATION. This record is an explicit, named successor to
      IDEA-20260805-5194f9, completing exactly the gap that record's own
      text identifies and leaves open, using one external ingredient (AGPS)
      not previously cited in this program's ML-DSA lane. The general
      technique (depth-capped Grover; AGPS-style realistic quantum sieve
      costing) is well-established literature, not claimed as new
      mathematics. What is new to this program is the SYMMETRIC application
      of the depth cap to both arms and the resulting numeric table.
      External novelty for "has anyone already built exactly this two-sided
      MAXDEPTH crossover table for Dilithium/ML-DSA's SelfTargetMSIS
      specifically" is NOT established: the AGPS paper itself was not read
      beyond a WebSearch synthesis, and it or a later paper applying it to
      Dilithium specifically may already contain this table.
  object_first_candidate:
    tracked_object: >-
      The RESOURCE TUPLE (time, memory, depth) of each SelfTargetMSIS attack
      arm — the same tuple 5194f9's own lossy_projection_identifiability_audit
      names as the correct tracked object against the practice of collapsing
      it to time alone — followed through a DECLARED MAXDEPTH cap applied
      IDENTICALLY to both arms, to the point where the argmin over arms
      either does or does not flip.
    lossiness: >-
      5194f9 already establishes (and this record inherits, not re-derives)
      that the projection from the resource tuple to a scalar time figure is
      genuinely lossy: "the two arms have IDENTICAL first coordinates within
      five bits at ML-DSA-87 while differing in the memory coordinate by
      more than 350 bits." This record's own addition is narrower: it argues
      the DEPTH coordinate specifically has been discarded ASYMMETRICALLY —
      charged against the hash arm, left at its idealized value for the
      lattice arm — which is not a loss of information but a MIS-APPLIED
      symmetry in how the retained tuple is used, and the fix is to apply
      the same declared cap to both coordinates before taking the argmin.
    propagation: >-
      One step is one MAXDEPTH class evaluated. The hash arm's one-step law
      is the exact, closed-form Grover-parallelization formula (forced
      boundaries checked in stage 0). The lattice arm's one-step law is
      EITHER the idealized exponent (if AGPS's own reported depth is within
      budget) or an open modeling question (if not) — this asymmetry in how
      well-defined the two one-step laws are is itself reported as a finding.
    survival_score: >-
      The hash-arm formula survives exactly (it is closed-form and exact).
      The lattice-arm formula survives only as far as AGPS's own stated
      depth figure is trusted, and DISSOLVES at the point (if reached) where
      the required depth exceeds a MAXDEPTH class and no validated
      depth-penalty formula exists in the sources read this session — that
      dissolution point is reported explicitly as branch (ii) of claim (C),
      not smoothed over.
  null_object_control: >-
    (1) BOUNDARY REPRODUCTION: at D=1, Hsh(k,D) must equal the classical
    |B_tau| figure exactly; at D >= sqrt(|B_tau|), Hsh(k,D) must equal
    5194f9's own unconstrained sqrt(|B_tau|) figure exactly (192.76/2 etc.
    in bits) — both forced values checked before any MAXDEPTH class is
    evaluated. (2) MONOTONICITY: Hsh(k,D) must be non-increasing in D at
    fixed k; a violation is a formula bug. (3) SYMMETRY-STRIPPED NULL: recompute
    the table with BOTH arms left at their idealized, depth-unconstrained
    values (i.e. reproduce 5194f9's own quantum row exactly) as a fixture
    check that this record's stage-0/stage-3 code has not silently changed
    5194f9's own reported numbers before the new depth cap is applied.
    (4) CALIBRATION-SENSITIVITY CONTROL (stage 4): report whether the argmin
    changes between the recalled and the 591f9d-recomputed block sizes; a
    table whose headline flips under this known, already-documented
    uncertainty is reported as convention-dependent, not as a finding about
    SelfTargetMSIS.
  discriminated_from:
  - >-
    IDEA-20260805-5194f9 is this record's direct predecessor and is quoted
    verbatim above; this record does not recompute 5194f9's non-reordering
    theorem, its classical rows, or its exact hash-arm sizes — it imports all
    three and adds only the two-sided depth cap and the AGPS ingredient
    5194f9 does not cite. Null control (3) exists specifically to prove this
    record has not silently altered 5194f9's own reported numbers.
  - >-
    IDEA-20260805-591f9d's calibration-mismatch finding (~355 in beta) is
    imported as a KNOWN, documented uncertainty this record propagates
    through (stage 4 / control 4) rather than re-derives or resolves.
  - >-
    KN-OPEN-017 (cited inside 5194f9) concerns the enumeration/sieving
    CLASSICAL crossover under full cost, a different open question (no
    depth dimension) that this record does not address.
  - >-
    No RQ-MLDSA-001 or RQ-MLDSA-ffa0f5 proposal cites AGPS, Zalka-style
    Grover parallelization under a depth cap, or applies MAXDEPTH to a
    lattice sieve; this record is the first in this lane to do so, per the
    novelty_screen above.
  citations:
  - ref: IDEA-20260805-5194f9
    provenance: internal
    claim: >-
      log2|B_tau| = 192.760/225.345/257.015; the non-reordering theorem for
      lattice-vs-lattice comparisons; the three-convention lattice-vs-hash
      sketch including the unevaluated MAXDEPTH-adjusted Grover formula
      quoted verbatim in claim (A); recalled_lattice_bits_classical ~
      123/182/252 flagged there as "the weakest input to the margin table."
    verified_by: 'idea-generator subagent (read in full in repository, including its lossy_projection_identifiability_audit and parameters_assumed blocks)'
  - ref: IDEA-20260805-591f9d
    provenance: internal
    claim: >-
      This program's own naive block-size instrument gives b~778 at
      ML-DSA-44 against a recalled-unverified published figure of ~423, a
      gap of ~355 in beta (~104 bits classical core-SVP).
    verified_by: 'idea-generator subagent (read in full in repository)'
  - ref: 'NIST PQC standardization MAXDEPTH parameter'
    provenance: retrieved
    claim: >-
      NIST introduced MAXDEPTH to bound the circuit depth of any potential
      quantum attacker, with suggested values 2^40 to 2^96 logical gates:
      "2^40 is the approximate number of gates that presently envisioned
      quantum computing architectures are expected to serially perform in a
      year" and "2^96 is the approximate number of gates that atomic scale
      qubits with speed of light propagation times could perform in a
      millennium," per the WebSearch synthesis of NIST's own call-for-
      proposals language.
    verified_by: 'idea-generator subagent (WebSearch this session; synthesis of NIST''s stated rationale, not a direct fetch of the primary NIST document)'
  - ref: 'arXiv:2105.05608, "Lattice sieving via quantum random walks"'
    provenance: retrieved
    claim: >-
      Verbatim from the abstract: improves Laarhoven's 2^(0.2653*d) quantum
      SVP time to 2^(0.2570*d + o(d)) by replacing Grover's algorithm with a
      quantum random walk plus locality-sensitive filtering in the sieve's
      near-neighbour step, with stated time-memory tradeoffs. The abstract
      contains NO circuit-depth analysis or MAXDEPTH-style discussion.
    verified_by: 'idea-generator subagent (fetched https://arxiv.org/abs/2105.05608 and read the abstract verbatim)'
  - ref: 'IACR ePrint 2019/1161 (Albrecht, Gheorghiu, Postlethwaite, Schanck), "Estimating Quantum Speedups for Lattice Sieves," ASIACRYPT 2020'
    provenance: recalled
    claim: >-
      Reported via WebSearch synthesis (not fetched or read this session):
      a non-asymptotic, circuit-level analysis of quantum near-neighbour
      search for lattice sieves, finding "a small quantum speedup ...
      requir[ing] several optimistic physical and algorithmic assumptions."
      This is the load-bearing source for stage 1's depth figure and MUST be
      read in full text before this record's stage 2 evaluation is trusted.
    verified_by: null
  assumptions:
  - >-
    The standard Grover-under-depth-cap formula (max(sqrt(N), N/D)) applies
    to the hash-arm search over B_tau in the random-oracle model, inheriting
    5194f9's own random-oracle assumption for H.
  - >-
    AGPS's reported circuit depth for its most performant near-neighbour
    variant is the right quantity to compare against MAXDEPTH classes for
    the lattice sieve arm; if AGPS reports depth only under assumptions this
    program is not prepared to adopt (e.g. specific QRAM models), that
    caveat is carried into the table rather than silently dropped.
  - >-
    The recalled lattice-arm block sizes (123/182/252-bit quantum figures)
    inherited unchanged from 5194f9 are placeholders pending this program's
    own calibrated instrument (591f9d, EXP-MLDSA-1c66ac); stage 4 exists
    precisely because this assumption is known to be shaky.
  proof_search_map:
    bottleneck: >-
      The single step where a MAXDEPTH cap is applied to the QUANTUM SIEVE
      arm's own circuit depth (as opposed to only the hash arm's Grover
      search), which is the one place 5194f9's own sketch leaves the
      symmetry broken.
    baseline_embedding:
      parameter_slice: >-
        D -> infinity (no depth cap) on both arms must reproduce 5194f9's
        own unconstrained quantum row exactly, including its stated
        reversal of the classical ordering.
      reproduction_check: >-
        Frozen fixture: at D effectively unbounded, Hsh(k,D) and the
        idealized Latt(k) must equal 5194f9's own reported figures to
        within rounding; this is null control (3) restated as the formal
        baseline check.
    observation_collision:
      observable: >-
        The argmin over arms and the crossover D*(k), per category, per
        MAXDEPTH class.
      distinct_preimage_search: >-
        An argmin flip at some MAXDEPTH class could arise either from a
        genuine depth asymmetry between the two arms (the intended finding)
        or from an arithmetic error in extending 5194f9's formula. Null
        controls (1) and (2) (forced boundary values, monotonicity) are the
        additional conditions that separate them: both must pass before any
        flip is reported as a finding about SelfTargetMSIS.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The single 3x3 table (category x MAXDEPTH class) of argmins and
        crossover values, replacing 5194f9's qualitative "can reverse the
        reversal" sketch with exact numbers and an explicit per-category
        D*(k).
      predicted_gain: >-
        Diagnostic only; no attack, no speedup. Predicted deliverable is
        completion of a table an existing corpus record names as missing,
        with one honestly-flagged open modeling gap (branch (ii) of claim C)
        if AGPS's depth exceeds a MAXDEPTH class at FIPS 204-relevant block
        sizes.
    quantifier_order: >-
      FOR each FIPS 204 category k and each declared MAXDEPTH class D,
      THERE EXISTS a computed (Hsh(k,D), Latt(k,D)) pair under the declared,
      pinned formulas; the argmin claim is a statement about THESE named
      formulas and THESE recalled/re-derived block sizes, not a universal
      claim about the true cost of either arm.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the declared depth-cap formulas and the declared (recalled or
        591f9d-recomputed) block sizes, the argmin at category k under
        MAXDEPTH class D is [arm], with crossover D*(k) = [value]." The
        method can never certify the true circuit depth of an as-yet-
        unbuilt quantum sieve implementation, and cannot certify anything
        about the classical arms beyond what 5194f9 already established.
      nearby_object_control: >-
        Null control (3), the symmetry-stripped fixture reproducing 5194f9's
        own idealized quantum row exactly, is the nearby object on which
        this record's OWN new machinery must produce IDENTICAL output to the
        predecessor before the new depth cap is trusted to have been applied
        correctly elsewhere.
    proof_obligations:
    - claim: 'Hsh(k,D) reproduces the classical and unconstrained-Grover boundary cases exactly.'
      responsibility: baseline
    - claim: 'Hsh(k,D) is non-increasing in D at fixed k.'
      responsibility: correctness
    - claim: 'The D-> infinity fixture reproduces 5194f9''s own reported quantum row exactly.'
      responsibility: baseline
    - claim: 'Branch (ii) of claim (C), if reached, reports the unpenalized lattice cost as an explicit lower bound rather than inventing a depth-penalty formula.'
      responsibility: scope
    - claim: 'The calibration-sensitivity control (stage 4) is run and any argmin flip under it is reported as the headline caveat.'
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: 'argmin (lattice arm vs hash arm) at each of the 9 (category, MAXDEPTH class) cells'
    direction: different
    minimum_effect: 'a full 3x3 verdict table; a cell whose argmin differs from 5194f9''s own unconstrained-quantum verdict at the same category is the informative outcome'
  - metric: 'crossover MAXDEPTH value D*(k) at each category, closed-form from Hsh(k,D)=Latt(k)'
    direction: different
    minimum_effect: 'reported exactly; no minimum effect threshold applies to a closed-form crossing point'
  - metric: 'whether AGPS''s reported circuit depth at FIPS 204-relevant block sizes exceeds any of 2^40/2^64/2^96'
    direction: different
    minimum_effect: 'a boolean per (category, MAXDEPTH class); TRUE anywhere is the branch-(ii) finding that 5194f9''s asymmetric treatment was optimistic for the lattice arm'
  - metric: 'argmin sensitivity to the recalled-vs-591f9d-recomputed block size (stage 4 / control 4)'
    direction: different
    minimum_effect: 'any flip is reported as the headline caveat rather than a footnote'
  minimal_test:
    design: >-
      Pure closed-form arithmetic, zero lattice reduction, zero signing.
      Step 0: verify Hsh(k,D)'s two boundary cases and monotonicity. Step 1:
      run the symmetry-stripped null (control 3) to confirm exact
      reproduction of 5194f9's own quantum row. Step 2: obtain AGPS's full
      text and extract its stated circuit depth as a function of block size
      (the one genuine retrieval dependency, flagged and not assumed away).
      Step 3: evaluate the full 3x3 table under recalled block sizes; Step 4:
      re-evaluate under 591f9d's recomputed block sizes and diff the two
      argmin tables. THIS DISCRIMINATES because the two boundary cases and
      the D-> infinity fixture have forced values known in advance from
      5194f9's own text, because branch (i) vs (ii) of claim (C) is a
      genuine, pre-declared either/or with different downstream
      consequences, and because the calibration-sensitivity diff (step 4)
      can independently show the whole exercise is convention-bound even if
      steps 0-3 all pass cleanly. Cost: under an hour once AGPS's depth
      figure is obtained; the bottleneck is retrieval, not compute.
    controls:
    - 'Boundary reproduction: D=1 and D>=sqrt(|B_tau|) forced values (control 1).'
    - 'Monotonicity of Hsh(k,D) in D (control 2).'
    - 'Symmetry-stripped null reproducing 5194f9''s own quantum row exactly (control 3).'
    - 'Calibration-sensitivity control: recalled vs 591f9d block sizes (control 4).'
    - 'Explicit lower-bound flagging if AGPS''s depth figure cannot be obtained or does not resolve branch (i) vs (ii).'
    required_metrics:
    - 'the full 3x3 (category x MAXDEPTH class) table of Hsh(k,D), Latt(k,D), and argmin'
    - 'crossover D*(k) per category, closed-form'
    - 'AGPS-reported circuit depth per relevant block size, and the boolean comparison against each MAXDEPTH class'
    - 'the argmin diff between the recalled and 591f9d-recomputed block-size runs'
  falsification_conditions:
  - 'Either boundary-reproduction check (control 1) fails: the formula is wrong and no table is reportable.'
  - 'The symmetry-stripped null (control 3) does not exactly reproduce 5194f9''s own quantum row: this record''s extension code has altered the predecessor''s numbers, and nothing downstream is trusted until fixed.'
  - 'AGPS''s reported depth is within every MAXDEPTH class at every FIPS 204-relevant block size: branch (i) holds, 5194f9''s asymmetric treatment was safe, and the table reduces to filled-in numbers with no new qualitative finding — a complete, useful negative.'
  - 'AGPS''s reported depth exceeds at least one MAXDEPTH class at a relevant block size: branch (ii) holds, the lattice arm''s idealized cost is reported only as a lower bound under that class, and the crossover D*(k) is reported as an upper bound on the true crossover (since the true lattice cost is only larger) — a scoped, still-useful positive finding.'
  - 'The argmin flips between the recalled and 591f9d-recomputed block sizes (control 4): the table''s headline is convention-dependent, and that dependency is reported as the primary result rather than either individual table.'
  confounders:
  - 'AGPS''s reported depth figures may themselves depend on optimistic QRAM or connectivity assumptions the abstract itself flags; any depth figure used is reported alongside AGPS''s own stated assumption set, not stripped of it.'
  - 'The recalled quantum lattice-arm bit figures (123/182/252) are inherited from 5194f9, which itself flags them as the weakest input; this record does not independently verify them and inherits the flag unchanged.'
  - 'Grover-under-depth-cap parallelization for the HASH arm is well-established; the analogous formula for a DEPTH-PENALIZED quantum SIEVE is not established in the sources read this session, which is exactly branch (ii)''s honest gap rather than a confounder to paper over.'
  interpretation_limits:
  - 'No claim about FIPS 204 security at any tier. This is a cost-model table completion, not an attack, and inherits every scope limit 5194f9 already states for its own rows.'
  - 'A branch-(ii) finding (lattice arm depth-bound) does not mean SelfTargetMSIS is weaker than believed against classical adversaries; it means the specific IDEALIZED QUANTUM figure this program and 5194f9 use is optimistic once depth is charged honestly, which if anything makes the quantum lattice arm look WORSE for an attacker, strengthening (not weakening) any conclusion that the hash arm binds.'
  - 'This record does not resolve which block-size convention (recalled vs 591f9d-recomputed) is correct; control 4 only reports whether the table''s headline depends on that unresolved choice.'
  heuristic_assumptions:
  - id: H1
    statement: >-
      A quantum circuit performing amplitude amplification (Grover's search)
      over a search space of size N, when restricted to sequential depth at
      most D, achieves expected cost max(sqrt(N), N/D), by running D
      independent Grover instances in parallel, each searching N/D^2 of the
      space (the standard depth-restricted Grover parallelization result).
    rigorous_support: >-
      This is a proven, textbook result (Zalka-style parallel Grover
      analysis) for the HASH ARM specifically, not a heuristic; it is stated
      as a heuristic_assumption here only insofar as its APPLICATION to
      B_tau-sized search under the random-oracle model inherits 5194f9's own
      random-oracle assumption for H, not because the parallelization
      formula itself is in doubt.
    validation_plan: >-
      Verify the two forced boundary cases (D=1 collapses to N; D>=sqrt(N)
      collapses to sqrt(N)) symbolically before any numeric MAXDEPTH class is
      substituted — this is exact algebra, not sampling, and either passes
      or fails deterministically. No transfer assumption is needed for this
      half of the record since the formula is proven, not fit.
  - id: H2
    statement: >-
      AGPS's reported circuit depth for its most performant quantum
      near-neighbour sieve variant, evaluated at the block sizes relevant to
      FIPS 204's recalled lattice-arm figures, is representative of the
      depth any realistic implementation of that sieve would require — i.e.
      AGPS's own stated depth figure is not itself an optimistic idealization
      one further level down.
    rigorous_support: >-
      AGPS is explicitly a non-asymptotic, circuit-level cost analysis (per
      its own abstract, surfaced but not read in full this session) designed
      to be MORE realistic than the idealized 2^(0.265*b)/2^(0.257*b) time
      exponents this program currently uses uncritically; its own hedge
      ("requires several optimistic ... assumptions") is the classical
      caveat this heuristic assumption imitates — namely, that even a
      "realistic" circuit-level estimate can still be optimistic relative to
      an eventual physical implementation, a regress this record does not
      attempt to close and states so explicitly.
    validation_plan: >-
      Once AGPS's full text is read, extract depth figures under BOTH its
      "optimistic" and any "conservative" parameter regimes if both are
      reported, and evaluate branch (i)/(ii) of claim (C) under each
      separately rather than picking one; report the two resulting tables
      side by side if they disagree on any argmin. TAIL CHECK: at the
      largest FIPS 204-relevant block size (ML-DSA-87), report the depth
      figure under both regimes explicitly, since that is the category where
      5194f9's own classical margin was already thinnest (about 5 bits) and
      is therefore the cell most likely to flip under either regime.
      Sampled parameters: the three FIPS 204 categories' recalled and
      591f9d-recomputed block sizes; AGPS's optimistic and conservative
      regimes if both exist. TRANSFER ASSUMPTION, stated and not discharged:
      that AGPS's circuit model (as of its 2020 publication) still reflects
      the best available depth estimate; a more recent circuit-level
      analysis may supersede it and was not searched for exhaustively this
      session.
  target_complexity:
    time_exponent: >-
      No new attack exponent. The table reports, per cell, whichever of
      Hsh(k,D) = max(sqrt(|B_tau|), |B_tau|/D) or the (possibly
      depth-flagged) idealized quantum sieve exponent 2^(0.265*b) or
      2^(0.257*b) is smaller — both already-known exponents, recombined
      under a depth constraint neither has previously been jointly evaluated
      under in this program.
    memory_exponent: >-
      Hash arm: O(1), unaffected by D (per 5194f9). Lattice arm: whatever
      AGPS reports for its quantum memory / QRAM requirement at the
      relevant block size, carried through unchanged — this record adds no
      new memory cost of its own.
    best_known: >-
      5194f9's own one-sided sketch (depth cap on the hash arm only, lattice
      arm idealized) is the immediate incumbent; the classical-arm rows and
      the non-reordering theorem are unaffected incumbents from the same
      record.
    hidden_overhead: >-
      The largest hidden overhead is branch (ii)'s open modeling gap: if
      AGPS's depth exceeds a MAXDEPTH class, this record reports the
      idealized cost as a LOWER BOUND rather than computing the true
      depth-penalized cost, because no validated formula for that penalty
      was found in the sources read this session. That gap is disclosed by
      name, not hidden inside an o(1).
    tradeoff_note: >-
      This record is precisely a time-memory-DEPTH tradeoff completion: the
      whole point is that collapsing the tuple to time alone (the practice
      5194f9's own audit already names) additionally erases which arm's
      depth is actually charged, and this record's contribution is charging
      both arms' depth under the same declared cap before comparing.
  dominated_by: >-
    IDEA-20260805-5194f9 dominates this record on every row it itself
    computes (the classical arms, the non-reordering theorem, the exact hash-
    arm sizes) — this record does not attempt to improve on those and
    imports them unchanged. It does NOT dominate the two-sided, numerically-
    evaluated, AGPS-informed MAXDEPTH table, because it does not compute
    one; that is the explicit gap this record fills, named by 5194f9's own
    text. Rows checked beyond 5194f9: IDEA-20260805-591f9d (calibration
    uncertainty, imported via stage 4/control 4, does not itself address
    depth); IDEA-20260808-c1abd1, -63427b, -5a748c (all heuristic-tier,
    depth-agnostic); the 10 sibling RQ-MLDSA-ffa0f5 proposals (screened via
    citations gathered in this batch, none touches circuit depth).
  sota_delta: >-
    No attack; table-completion contribution only. Quantitatively: if branch
    (i) holds everywhere, sota_delta = 0 beyond filling in numbers 5194f9
    left symbolic. If branch (ii) is reached at any cell, the delta is the
    gap between 5194f9's idealized quantum-lattice figure and the (at least)
    lower-bounded, depth-honest figure at that cell — reported in bits, with
    no minimum-effect threshold, since even a small shift can move an
    already-thin margin (5 bits at ML-DSA-87, per 5194f9) across zero.
