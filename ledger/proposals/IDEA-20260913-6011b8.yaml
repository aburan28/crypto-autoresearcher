idea:
  id: IDEA-20260913-6011b8
  title: Two low bits of the integer lift of x under doubling
  class: representation
  claim: >-
    The two lowest bits of the unique integer representative of x(P) in
    {0,...,p-1} are an R1 digit projection. Paired with Sigma={[2]},
    either (A) those two bits of x([2]P) are a function of the two bits
    of x(P) (unary closure on a 4-letter alphabet), or (B) modular
    reduction by p mixes higher digits and the object is branching,
    priced by (L, b). KN-FIND-ffe1df leaves digit-sum/popcount filters
    open as translation filters; 84755b P5 is bottom bits of x under
    translation; fa01b7 is two bits of y under doubling. This asks
    doubling-compatibility of a 2-bit x-lift. Stage-0 is the frozen
    residue identity (x_Z mod 4, x'_Z mod 4) = (2, 0). No exponent
    gain. Attack stage: collision structure.
  mechanism: >-
    Representation: R1 digit representation — the integer lift
    x_Z in {0,...,p-1} of the affine x-coordinate, then the 2-bit
    residue r(P) = x_Z mod 4. Operation set Sigma = {[2]}, then
    re-extract r([2]P). Trichotomy class: coordinate-dependent -- r
    depends on the choice of integer lift of an F_p element and is
    not a function of the group element (a different complete set of
    residues, or a PGL_2 change of the x-chart, changes r). One-line
    reason: low bits of a lift are a property of the representative,
    not of the class in E(F_p). R1 class. Attack stage: collision
    structure (cheap 2-bit predicate), not factor-base membership.

    LOSSY-PROJECTION TEST against Sigma={[2]}. What is discarded: y,
    the higher bits of x_Z, and all other models of the point. Lossy:
    the alphabet has size 4, so 1 < 4 < N for any cryptographic N and
    already for the toy N of a p=19 curve. Discard compatibility:
    doubling gives x' as a rational function of (x, y); reducing the
    lift of x' modulo 4 is well-defined. Whether r([2]P) is determined
    by r(P) alone is Outcome A versus B. If A, the four fibres (when
    nonempty) are a block system of <[2]> on the points where r is
    defined, and the open number is the cost of using a 2-bit label as
    an orbit canonicalizer (Theorem C already forbids this as a
    sum-compatible bucket; the remaining question is
    doubling-compatibility only). If B, measure (L, b) against
    identity, random 2-bit labels, and relabelled Z/NZ.

    PAIR (representation, Sigma) = (complete-residue lift of affine x
    then mod 4, {[2]}). Not IDEA-20260913-fa01b7 (same extraction on
    y). Not 84755b P5 (x-bits under translation). Not nested LHW. Not
    steal-listed c37df9 (scalar-side carry transducers). No factor
    base (KN-OPEN-020 does not apply).

    STAGE-0 IDENTITY (independently computed on the frozen F_19 curve
    y^2=x^3+x-1, P=(2,3), [2]P=(16,11)): x_Z(P)=2 so r=2;
    x_Z([2]P)=16 so r'=0.
