  assumptions:
    - Odd prime p, short-Weierstrass, public prime-order subgroup.
    - Integer lift of x is the unique representative in {0,...,p-1}, not a Teichmuller lift and not a Hensel lift.
    - No secret scalars.
    - F1 may later consume a 2-bit predicate; it is not the primary lens.
  predictions:
    - metric: twobit_x_residue_hold
      direction: different
      minimum_effect: >-
        REAL cell r([2]P) equals the independently recomputed x([2]P) mod 4.
        On the frozen P=(2,3)/F_19 the designed value is r'=0. Known-false
        r'=2 (invariance) fails. Null random 2-bit labels are not credited.
    - metric: unary_closure
      direction: different
      minimum_effect: >-
        Outcome A if the 4-by-4 table r |-> r o [2] is a well-defined
        function on the frozen curve's affine census. Outcome B if any
        input residue has two outputs.
    - metric: L_and_b
      direction: different
      minimum_effect: If Outcome B, measure L and b against identity, random 2-bit labels, and relabelled Z/NZ.
  minimal_test:
    execution_status: design_only
    design: >-
      STAGE-0 FINITE EXACT IDENTITY (named). Freeze p=19, A=1, B=-1,
      P=(2,3) on y^2=x^3+x-1, [2]P=(16,11). REAL 2-bit residues:
      2 mod 4 = 2 and 16 mod 4 = 0. Known-false claim: r'=2
      (invariance). Null object: a uniform label in {0,1,2,3}
      independent of x. Invalid-input reject: the point at infinity
      has no affine x and must reject. Unary-closure cell: for every
      affine non-singular Q on this curve, record (x(Q) mod 4,
      x([2]Q) mod 4) and test functional dependence. Nearby-object:
      one additional p=17 curve (p=1 mod 4), not pooled with p=19
      (p=3 mod 4).
    matched_null: Uniform independent {0,1,2,3} labels, no group law.
    known_false: r([2]P) = 2 on the frozen REAL point (wrong-value invariance).
    controls:
      - kind: matched_null
        design: Random 2-bit labels.
      - kind: known_false
        design: Invariance claim r'=2 on P=(2,3).
      - kind: invalid_input
        design: Point at infinity has no affine x and rejects.
      - kind: baseline
        design: Same 2-bit extraction on y (fa01b7 slice) as a matched y-based control on the same census; 84755b P5 is the translation control.
      - kind: generic_group
        design: Relabelled Z/NZ with a random 2-bit tag.
    required_metrics:
      - twobit_x_residue_hold
      - unary_closure
      - L_and_b
    decision_threshold: >-
      REAL r'=0 must match independent recomputation of [2]P. Known-false
      r'=2 must fail. Unary closure is a separate yes/no on this curve.
      No exponent claim.
    stopping_rules:
      - Stop at the first failed exact identity or known-false control and classify it as a procedure defect.
      - No run is authorized here.
    required_artifacts:
      - frozen (p, A, B, P, [2]P, x_Z, r, r') manifest
      - REAL / known-false / null / invalid outcomes
      - optional full-curve 4-by-4 occupancy table
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: requires a new approved frozen handoff
  falsification_conditions:
    - Independent recomputation of [2]P disagrees with (16, 11) in F_19 (then the designed REAL value is a procedure defect and the record is superseded).
    - Unary closure holds and the generic-group random-tag control shows the same 4-by-4 function (artifact).
    - Scope is the frozen p=19 curve plus the optional p=17 nearby-object cell, not pooled.
  confounders:
    - Using a signed representative in {-(p-1)/2,...,(p-1)/2} instead of {0,...,p-1}.
    - Reducing x in F_p before lifting (the lift is of the field element, not of an intermediate unreduced integer).
    - Confusing this with fa01b7 (y-bits) or with scalar-side LHW carries (c37df9).
    - p=1 mod 4 versus p=3 mod 4 changing the distribution of quadratic residues among residue classes mod 4; the frozen p=19 is 3 mod 4 and is not a proxy for p=1 mod 4.
  interpretation_limits:
    - Not a factor base. Not nested LHW. Not 84755b P5. Not fa01b7.
    - A 2-bit label cannot be an exact sum-compatible bucket (Theorem C). Doubling-compatibility is a different property.
    - Stage 0 is a calibrator. established_exponent_gain = 0.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-6011b8
      statement: >-
        For uniform non-2-torsion P, r(P) = x_Z(P) mod 4 is
        equidistributed on {0,1,2,3} up to an O(p^{-1/2}) bias coming
        from x being a cubic-residue-related regular function.
        Imitates Weil equidistribution of the reduction of a regular
        function composed with a complete-residue lift. This is a
        heuristic: there is no classical theorem that low bits of the
        {0,...,p-1} lift of a polynomial function on E are uniform.
      rigorous_support: >-
        Weil bound controls character sums of x as an F_p-valued
        function, not the 2-adic digits of its lift. The rigorous
        ingredient is therefore only the bound on algebraic characters
        of x; the passage from F_p-valued x to x_Z mod 4 is the
        heuristic step (analogous to treating a structured integer as
        uniform of its size, as in the target-profile CEP pairing, but
        here the 'size' is 2 bits).
      random_model_justification: >-
        Comparison law is uniform on {0,1,2,3}. No Dickman-de Bruijn
        statement. The lift map F_p -> {0,...,p-1} is the standard
        complete residue system, not a random function.
      validation_plan: >-
        Exact census on the frozen p=19 curve of r(P) versus 1/4. Tail
        check: list the four multiplicities. Repeat the census on one
        additional frozen curve with p=17 (p=1 mod 4) as a
        nearby-object control; do not pool the two p-mod-4 classes.
      falsification_condition: >-
        On the p=19 census, some residue class is empty or holds more
        than half the affine non-singular points (gross departure from
        1/4, not a Weil-scale ripple).
    - id: H2-IDEA-20260913-6011b8
      statement: >-
        Predicted Outcome B: r o [2] is not a function of r on a
        generic ordinary prime-order curve, because x' depends on y
        and on high bits of x through reduction modulo p.
      rigorous_support: No theorem; the 4-by-4 occupancy table decides.
      random_model_justification: Exact finite table.
      validation_plan: Exhaustive (r, r o [2]) table on p=19 and p=17 frozen curves; a single input residue with two outputs is Outcome B.
      falsification_condition: Each occupied input residue has exactly one output on both frozen curves (Outcome A on those toys).
