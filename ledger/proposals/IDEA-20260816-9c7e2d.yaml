idea:
  id: IDEA-20260816-9c7e2d
  question_id: RQ-MCE-e65b3c
  added: '2026-08-16'
  title: 'A structural tell must persist under an operation that preserves the family: shorten the
    toy Goppa code one coordinate at a time and measure whether the square-code defect stays correlated
    down the chain while a random code''s defect re-draws at every step -- the AUTOCORRELATION along
    the chain, not the value at any one point, is the object.'
  class: mechanism
  claim: '(A) Binary Goppa codes are closed under shortening at a support coordinate: shortening Gamma(L,g)
    at a_j gives Gamma(L minus {a_j}, g). Therefore any structural anomaly of a Goppa code is a deterministic
    function along the entire shortening chain, and the chain of anomaly values is a single trajectory
    through a family, not a sequence of independent draws. A random binary code has no such closure:
    shortening it gives another random-looking code and each step''s anomaly is, to a first approximation,
    a fresh draw conditioned only on the previous step''s linear-algebraic constraint. (B) That difference
    is directly measurable and is a strictly stronger observable than the anomaly value itself, because
    it survives situations where the single-step values overlap. The tracked quantity is the chain
    (D_0, D_1, ..., D_J) of square-code defects along J successive single-coordinate shortenings,
    and the measured statistics are the lag-1 autocorrelation, the total variation sum of |D_{i+1}
    - D_i|, and the number of distinct values the chain visits. Docs/inventor-protocol.md section
    3 names the canonical structural tell as a quantity that should decay and does not; this is the
    same test run in the opposite direction -- a quantity that should be memoryless and is not. (C)
    NOT CLAIMED: no attack, no key recovery, no distinguisher against any deployed system, and no
    security consequence. Chain statistics at n <= 64 and high rate say nothing about any standardized
    parameter set, and the high-rate confound that afflicts every toy square-code measurement in this
    bucket afflicts this one identically and is not mitigated by moving to chains. (D) A specific
    negative outcome is valuable and likely enough to plan for: if the random arm''s chains are ALSO
    strongly autocorrelated -- which they may be, since successive shortenings of one code are not
    independent objects -- then chain autocorrelation is not a family tell at all, and the correct
    conclusion is that the shortening operation''s own linear-algebraic memory dominates, which retires
    a whole class of chain-based observables with a measured number.'
  mechanism: 'STAGE 1: consume the certified fixture from proposal 1 and the square-code routine from
    proposal 3; this proposal builds no new primitive and its novelty is entirely in the object it
    forms from them. STAGE 2: fix a shortening order. For the Goppa arm, shorten at support coordinates
    in a fixed random order drawn once per chain; for the random arm, shorten at coordinate indices
    in an order drawn identically from the same seeded stream, so the two arms traverse structurally
    matched positions. STAGE 3: at each step i, compute k_i, the generic ceiling min(n_i, k_i(k_i+1)/2),
    and D_i. Record the full chain, not a summary. STAGE 4: stop the chain when k_i drops to 2 or
    when k_i(k_i+1)/2 < n_i, whichever comes first, since below that the defect is deficient for counting
    reasons unrelated to structure; record the stopping index as a measured quantity. STAGE 5: derive
    three chain statistics -- lag-1 autocorrelation of the normalised defect, total variation sum,
    and number of distinct values -- and compute them per chain, never pooled across chains. STAGE
    6: the arms. GOPPA: 100 chains from 100 independent keys. RANDOM: 100 chains from 100 matched
    random codes. ALTERNANT: 100 chains from random alternant codes at matched (n,k), because if the
    alternant arm behaves like the Goppa arm, the chain statistic measures alternant closure and not
    Goppa closure. STAGE 7: the self-null. For each Goppa chain, build a SHUFFLED chain by taking
    the same multiset of defect values in random order and computing the same three statistics; comparing
    a real chain against its own shuffle isolates ordering from value distribution and is the control
    that decides whether the chain adds anything over proposal 3''s single-key measurement.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran grep -ril ''schur|square code|square-code'' and grep -ril ''shorten|puncture|punctured''
      over ledger/proposals/ and knowledge/. Read the titles and classes of the twelve MCE-area proposals.
      Read RQ-MCE-b38a8b''s methods block, which lists a ''structural feature panel: Schur-square
      and Schur-cube dimensions plus puncturing/shortening profiles'' among the quantities to report.
      Read the objective and claim_ceiling of EXP-MCE-3ffdf9. Read docs/inventor-protocol.md section
      3 in full, specifically the structural-tell criterion and the requirement that a quantity be
      asked what it SHOULD do as the destroying parameter increases.'
    results: RQ-MCE-b38a8b's methods list names 'puncturing/shortening profiles' as a panel item to
      be reported alongside Schur dimensions and automorphism statistics. That is a list of quantities
      to tabulate; it does not make the chain the object, it defines no autocorrelation, it states
      no null and it names no shuffle control. IDEA-20260808-3d3be9 evaluates a square-code defect
      on real keys as a single value with matched nulls. IDEA-20260808-b9a74c uses the defect per
      coordinate to refine a signature -- adjacent, since a per-coordinate refinement and a shortening
      chain both index by coordinate, but its object is a matching signature for equivalence testing
      and not a trajectory statistic. EXP-MCE-3ffdf9's square-code arm is a single tabulated observable
      per cell. No record in the repository computes an autocorrelation, a total variation along a
      chain, or any trajectory statistic for any code-theoretic quantity.
    verdict: 'UNVERIFIED. Shortening closure for Goppa codes is elementary and standard, and this
      record asserts nothing about what published work does with it. What is claimed new is local
      and specific: the repository lists shortening profiles as a panel item and never forms a trajectory
      from them, and the one design decision here that is not assembly -- comparing each real chain
      against a shuffle of its own values, so that ordering is isolated from the value distribution
      that proposal 3 already measures -- is a standard permutation-test move applied to a code-theoretic
      sequence. If the shuffle control shows no difference, this proposal adds nothing to proposal
      3 and should be recorded as subsumed by it.'
  object_first_candidate:
    tracked_object: 'The chain (D_0, D_1, ..., D_J) of square-code dimension defects along J successive
      single-coordinate shortenings of one public code, together with the matched chain of dimensions
      (k_0, ..., k_J) needed to normalise it. The object followed is the trajectory, and the reported
      statistics are functionals of it: lag-1 autocorrelation, total variation, and the count of distinct
      values visited.'
    lossiness: 'Lossy twice over, and the second projection is the one that matters. First, each code
      in the chain is projected to a single integer defect, discarding everything proposal 3 already
      discards. Second, the chain is projected to three scalar functionals, discarding the order-specific
      detail of which step moved and by how much. The residue still propagates because the operation
      of interest -- shortening -- acts on the chain by extension, and the functionals are computed
      from consecutive differences, which is exactly the quantity the operation produces. What is
      NOT discarded, and must not be, is the ordering: a chain and its shuffle have identical value
      multisets and different functionals, which is why the shuffle is the control that certifies
      the projection retained something proposal 3 did not.'
    propagation: 'One step of the target operation acts on the tracked object by appending a term:
      shortening the current code at the next coordinate gives a code of dimension k_i - 1 or k_i
      in ambient length n - i - 1, whose square-code defect is D_{i+1}. For the Goppa arm the new
      code is again Goppa with the SAME g on a smaller support, so D_{i+1} is a deterministic function
      of (L minus removed points, g) and inherits the algebraic cause of D_i; the chain is a trajectory
      of one algebraic object under support restriction. For the random arm the new code is the previous
      code intersected with a hyperplane condition, which is a linear-algebraic dependence, not a
      family closure; the chain retains whatever memory that intersection carries and nothing more.
      Distinguishing algebraic inheritance from linear-algebraic memory is precisely the measurement,
      and the random arm is the operationalisation of the second.'
    survival_score: The chain survives while k_i(k_i+1)/2 >= n_i, i.e. while the generic square code
      still fills the ambient space so that a defect is attributable to structure. Starting from m=6,
      t=4, n=64, k=40 the ceiling condition holds for many steps and the binding constraint is k_i
      >= 2. Starting from m=4, t=2, n=16, k=8 the chain has at most 6 usable steps before k drops
      to 2. The experiment reports the measured stopping index per chain rather than assuming the
      arithmetic bound, since realised ranks can drop faster than expected. Survival is therefore
      stated as a measured integer per chain and summarised as a distribution per cell.
  null_object_control: 'Three controls run in the same invocation, and the third is the decisive one.
    (1) MATCHED RANDOM ARM: 100 chains from random binary [n,k] codes at the Goppa arm''s measured
    k, shortened at the same coordinate index sequence from the same seeded stream. For the Goppa
    chains to mean anything the random arm must show measurably WEAKER lag-1 autocorrelation and larger
    total variation. (2) ALTERNANT ARM: 100 chains from random alternant codes at matched (n,k). Alternant
    codes are also closed under shortening, so if this arm behaves like the Goppa arm the statistic
    measures alternant closure, which is exactly the family axis RQ-MCE-3f7c02''s corrected boundary
    identifies as decisive and must be reported as such rather than as a Goppa result. (3) SHUFFLE
    SELF-NULL: for every chain in every arm, recompute the three functionals on a random permutation
    of that same chain''s values. The shuffle has the identical value multiset, so any difference
    between a chain and its shuffle is pure ordering. If Goppa chains do not differ from their own
    shuffles, this proposal measures nothing beyond proposal 3''s value distribution and is subsumed
    by it -- a clean, cheap self-refutation.'
  discriminated_from:
  - 'Proposal 3 of this set (per-key defect distribution and ROC): same invariant, different object.
    That one measures the distribution of a single value; this one measures the ordering of a sequence,
    and the shuffle self-null exists specifically to prove the difference is real rather than notational.'
  - 'RQ-MCE-b38a8b''s structural feature panel, which lists ''puncturing/shortening profiles'' as
    a quantity to tabulate: a panel entry is a list of numbers to report, not a trajectory statistic
    with a null and a shuffle control. This proposal takes the panel item and makes an object of it.'
  - 'IDEA-20260808-3d3be9: a single-value defect measured on real keys against matched nulls; no chain,
    no ordering, no autocorrelation.'
  - 'IDEA-20260808-b9a74c: a per-coordinate Schur-square refinement of an equivalence signature. Both
    index by coordinate, but that one builds a matching signature for equivalence testing and this
    one builds a time series under an operation; the outputs are not comparable objects.'
  - 'EXP-MCE-3ffdf9: one tabulated square-code observable per cell with a generic reference column,
    and explicitly not a distinguisher; no sequence of any kind.'
  assumptions:
  - The certified fixture from proposal 1 and the square-code routine from proposal 3 both exist and
    pass their own controls; this proposal introduces no new primitive and inherits both dependencies.
  - Shortening a Goppa code at a support coordinate yields a Goppa code on the restricted support
    with the same g. This closure is the mechanism's entire basis; it is treated as a prediction to
    be CHECKED on the fixture (by verifying the shortened code equals the code constructed directly
    from the restricted support) rather than as an imported fact.
  - Chains from the same starting code under different coordinate orders are treated as distinct chains
    and not as replicates, since the order is part of the object.
  - Lag-1 autocorrelation is meaningful on chains of length at least 6; cells whose measured stopping
    index falls below 6 are excluded from the autocorrelation comparison and reported as too short.
  predictions:
  - metric: lag-1 autocorrelation of the normalised defect along Goppa chains at m=6, t=4, n=64
    direction: higher
    minimum_effect: 0.7
  - metric: lag-1 autocorrelation along matched random-code chains at the same cell
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a value near zero: successive shortenings of one
      random code are not independent objects and may carry substantial linear-algebraic memory. The
      pre-registered claim is only the ORDERING, that the random arm''s autocorrelation is strictly
      below the Goppa arm''s, and a random arm as autocorrelated as the Goppa arm refutes the mechanism.'
  - metric: difference between a Goppa chain's total variation and the mean total variation of 100
      shuffles of that same chain
    direction: lower
    minimum_effect: 0.2
  - metric: verification rate of the closure check (shortened Goppa code equals the code built directly
      from the restricted support)
    direction: higher
    minimum_effect: 1.0
  minimal_test:
    design: 'The cheapest discriminating measurement is the closure check plus a single chain family
      at the longest available cell. Take m=6, t=4, n=64, k=40. Build 20 Goppa keys, 20 matched random
      codes and 20 random alternant codes. For each, shorten one coordinate at a time in a seeded
      order, recomputing dimension and square-code defect at every step, until k drops to 2 or the
      ceiling condition fails. First, on the Goppa arm only, verify at every step that the shortened
      code is exactly the code constructed directly from the restricted support with the same g --
      if that closure check fails, the mechanism has no basis and the proposal is dead before any
      statistic is computed, at a cost of minutes. Then compute lag-1 autocorrelation, total variation
      and distinct-value count for each of the 60 chains, and for 100 shuffles of each Goppa chain.
      Report the three arms and the shuffle null side by side. Cost is well under an hour on one core.
      The discrimination is doubled: closure failure kills it immediately, and a shuffle null indistinguishable
      from the real chain kills it a second way.'
    controls:
    - 'Closure verification on every Goppa chain step: the shortened code must equal the directly
      constructed code on the restricted support.'
    - Matched random binary arm, same coordinate index sequence from the same seeded stream, same
      invocation.
    - Random alternant arm at matched (n,k), as the competing family explanation.
    - 'Shuffle self-null: 100 permutations of each chain''s own values, isolating ordering from value
      distribution.'
    - 'Order-replication control: the same starting code shortened under three different coordinate
      orders, to measure how much of the chain statistic is order-specific.'
    required_metrics:
    - full chain (D_0..D_J) and (k_0..k_J) per code
    - lag-1 autocorrelation per chain
    - total variation per chain
    - distinct-value count per chain
    - measured stopping index per chain
    - shuffle-null distribution of each statistic per chain
    - closure-verification pass rate, required 1.0
  falsification_conditions:
  - Any closure-verification failure on the Goppa arm falsifies the mechanism outright, since the
    deterministic-inheritance argument rests entirely on it.
  - Goppa chains indistinguishable from their own shuffles on all three statistics shows the ordering
    carries nothing and this proposal is subsumed by proposal 3.
  - Random-arm autocorrelation greater than or equal to the Goppa arm's refutes the family-closure
    explanation and points to shortening's own linear-algebraic memory as the dominant cause.
  - Alternant chains statistically identical to Goppa chains establishes that the statistic measures
    alternant closure and forbids any Goppa-specific reading.
  - Measured stopping index below 6 in every chain of a cell makes that cell's autocorrelation uninterpretable
    and it must be reported as too short rather than analysed.
  confounders:
  - Successive shortenings of ONE code are inherently dependent for linear-algebraic reasons in every
    arm, so a nonzero random-arm autocorrelation is expected and the comparison is ordinal rather
    than absolute.
  - 'High rate again: every toy cell has k close to n, the regime most favourable to square-code anomalies,
    so nothing transfers.'
  - Chain length varies across codes because realised ranks vary, and comparing autocorrelations across
    chains of different lengths introduces a length bias that must be handled by restricting to a
    common prefix length.
  - The coordinate order is a free choice and part of the object; a fixed order shared across arms
    controls for it but also means results are order-conditional.
  - 'Two inherited dependencies: a bug in proposal 1''s construction or proposal 3''s Schur routine
    would propagate here as a spectacular and entirely spurious chain effect.'
  interpretation_limits:
  - Chain statistics at n <= 64 and high rate carry no implication for any deployed parameter set
    and no distinguisher claim is made.
  - A strong Goppa autocorrelation is a measurement of the family's shortening closure, which is a
    known algebraic property; observing it confirms the instrument, it does not discover the closure.
  - Results are conditional on the coordinate order used, which is part of the object rather than
    a nuisance to be averaged away.
  - If the alternant arm matches the Goppa arm, every number in the run is about alternant structure
    and must be labelled so on the face of every table.
  target_complexity:
    time_exponent: No attack exponent is claimed. Chain cost is J square-code computations, each O(k^2
      n) bit operations plus elimination, entirely negligible at these sizes.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one code's pairwise-product
      matrix, at most 820 rows of 64 bits.
    best_known: 'There is no incumbent within this repository: no trajectory statistic exists for
      any code-theoretic quantity. Outside it, structural analysis under shortening is established
      subject matter about which this record asserts nothing.'
    hidden_overhead: 'Hidden in the chain-length variation: comparing autocorrelations across chains
      of unequal length silently biases the comparison, and correcting it by restricting to a common
      prefix throws away the longest chains, which are the most informative. Hidden in the human cost:
      a strong Goppa autocorrelation is easy to over-read as a distinguisher when it is largely a
      restatement of a known closure property.'
  dominated_by: 'n/a (no result claimed). Pareto check applies vacuously: no adversary is constructed
    and no cost figure for any attack is produced, so no frontier row is occupied. As an observable
    it is dominated by proposal 3''s single-value measurement unless the shuffle self-null shows otherwise,
    which is exactly the check built into the design.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitative delta: zero trajectory
    statistics for any code-theoretic quantity in this repository before; after, per-chain autocorrelation,
    total variation and distinct-value counts across three arms with a shuffle self-null and a verified
    closure check.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'P(the closure check passes at 100 percent on the Goppa arm) = 0.85, conditional
    on proposal 1''s fixture being correct; failure here would indicate a construction bug rather
    than a mathematical surprise. P(Goppa chains differ measurably from their own shuffles) = 0.65;
    the ordering should carry something if the closure holds, but at short chain lengths the statistics
    are noisy. P(the random arm''s autocorrelation is strictly lower than the Goppa arm''s) = 0.5,
    and this is the number I am least confident about: successive shortenings of a single random code
    share most of their structure, so the random arm may be strongly autocorrelated too, which would
    be a clean refutation of the framing. P(the alternant arm is indistinguishable from the Goppa
    arm) = 0.6, meaning the most likely single outcome is that this measures alternant closure, which
    must then be reported as such.'
