idea:
  id: IDEA-20260809-228021
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    A pairing curve has two attack surfaces and one quoted number — produce the
    joint frontier over subgroup size and target-field cost
  class: composition
  claim: >-
    A pairing-friendly curve's security is the minimum of the elliptic-curve
    subgroup's generic hardness and the target field's index-calculus cost, but
    the two are estimated in different literatures with different conventions and
    then compared as if commensurable. The claim is that placing both on one
    frontier under a single declared cost convention — including memory —
    changes which side binds for at least one deployed parameter set.
  mechanism: >-
    Cost the curve side with the same machine model and memory charge used for
    the field side, rather than quoting the generic square-root bound as if it
    were free of memory and parallelism considerations, and plot both as
    functions of the security parameter to find the crossing.
  why_not_a_renamed_known_approach: >-
    Balancing the two sides is exactly what pairing-friendly curve construction
    does. The novelty claimed is narrow and specific: doing the balance under a
    SINGLE memory-charged convention, where the curve side's parallel collision
    search and the field side's linear algebra are priced by the same rules.
  predictions:
  - observable: which side binds at each deployed parameter set under the unified convention
    metric: categorical, with the margin in bits
    predicted: >-
      For at least one deployed set the binding side under a memory-charged
      convention differs from the side implied by the conventional figures. If
      neither changes, the conventional balance is robust, which is a clean
      positive result for the curve designers.
  - observable: sensitivity of the crossing point to the memory price
    metric: crossing shift in bits per order of magnitude of memory price
    predicted: Material, because the two sides have very different memory profiles -- which is the mechanism behind the claim.
  minimal_test: >-
    Implement both cost functions with a shared machine-model parameterization,
    evaluate at the deployed parameter sets, and sweep the memory price over a
    declared range recording the binding side at each point.
  controls:
  - 'CONVENTION CONTROL: reproduce the conventional figures by setting the memory price to zero; failure to recover the published balance means the cost functions are not comparable to the literature and nothing else in the record is interpretable.'
  - 'GENERIC-BOUND CONTROL: the curve side must reproduce the known generic complexity in the zero-memory-price limit.'
  falsification_conditions:
  - The binding side is invariant across the entire declared memory-price range.
  - The conventional figures cannot be recovered at zero memory price, indicating an incomparable cost function.
  interpretation_limits: >-
    A frontier under a declared convention is not a security verdict, and the
    curve side's generic bound is a lower bound on attack cost, not a proof of
    hardness.
  sota_delta: 'No attack. Delta: one frontier under one convention where the field currently compares two conventions.'
  dominated_by: Not dominated by any corpus record; depends on IDEA-20260809-1a5cb2 for the memory-charged field side.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for balanced security / pairing: no records. WEB NOT CHECKED.'
  source_refs:
  - Pairing-friendly curve construction and key-size references -- RECALLED, REQUIRED READS.
