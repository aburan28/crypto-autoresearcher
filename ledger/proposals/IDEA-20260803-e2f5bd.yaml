idea:
  id: IDEA-20260803-e2f5bd
  question_id: RQ-ECDLP-002
  title: >-
    Compose the Bezout bound with the arity threshold - the description-degree window, the
    exact solution-proportionality exponent theta*(m) that closes it, and the
    quadratic-residue base as the null object showing where it does not reach
  class: barrier
  claim: >-
    IDEA-20260801-021 PROVES |F_p| <= 3 d_p FOR A DEGREE-d_p ALGEBRAIC PREDICATE AND STOPS.
    IDEA-20260803-fa9839 FIXES THE COST THRESHOLD AND LEAVES D_trial FREE. COMPOSED, THEY
    CLOSE MOST OF THE GAP THAT KN-OPEN-020 NAMES, AND THE RESIDUE IS ONE SCALAR.
    THREE STATEMENTS, IN DECREASING UNCONDITIONALITY.
    (1) UNCONDITIONAL WITHIN THE TWO-TERM MODEL, NO HEURISTIC AT ALL: sparse linear algebra
    alone charges c_LA*B^2, so any factor base that beats rho at c_rho*sqrt(N) has
    B < (c_rho/c_LA)^(1/2) * N^(1/4). With Bezout that is
      d_p  <  (1/3) * (c_rho/c_LA)^(1/2) * N^(1/4).
    EVERY ALGEBRAIC FACTOR BASE THAT COULD POSSIBLY WIN HAS DESCRIPTION DEGREE BELOW
    N^(1/4) UP TO PINNED CONSTANTS. That is a hard two-sided window and it is derived from
    an intersection-theoretic bound and a linear-algebra charge, with no assumption about
    solvers.
    (2) CONDITIONAL ON ONE NUMBERED HEURISTIC, AND THE CONDITION IS A SINGLE SCALAR. The
    arity-m decomposition system - S_m(x_1,...,x_{m-1}, x(T)) = 0 together with the
    degree-d_p membership predicate on each x_i - has Bezout number
    Delta ~ 2^(m-2) * d_p^(m-1). Posit HEUR-BW-1(theta): deciding one target costs
    D_trial = Omega(Delta^theta). Then
      T(m,B) >= const * m! * N * B^(theta(m-1)) / B^(m-1) + c_LA * B^2,
    whose optimum sits at N^(2/(a+2)) with a = (1-theta)(m-1), so the construction beats
    rho IF AND ONLY IF theta < 1 - 2/(m-1). DEFINE theta*(m) := 1 - 2/(m-1). Then
      theta*(4) = 1/3,  theta*(5) = 1/2,  theta*(6) = 3/5,  theta*(m) -> 1.
    AT theta >= theta*(m) THE ENTIRE ALGEBRAIC-FACTOR-BASE CLASS IS EXCLUDED AT ARITY m.
    (3) At m <= 3 the exclusion is theta-FREE within the model: theta*(3) = 0, and the
    large-base regime is dead independently because B^2 >= (m! N)^(2/m) exceeds sqrt(N) for
    every m <= 4.
    THE POINT IS THE REDUCTION, NOT THE BOUND. KN-OPEN-020 currently reads as an open
    problem with no stated shape. This converts it into: HOW MUCH OF THE SOLUTION COUNT
    MUST A ROOT-FINDER PAY? A single exponent theta, against a table of thresholds
    theta*(m) that are small - one third at m = 4. FALSIFIED IF the composition does not
    reproduce IDEA-20260801-021's own Omega(N/B^m) charged-trial bound as a special case,
    if theta*(m) does not verify symbolically, or if a construction is exhibited with
    theta >= theta*(m) that nonetheless beats rho, which would refute the two-term charge
    itself.
  mechanism: >-
    WHY THIS COMPOSITION AND NOT ANOTHER. IDEA-20260801-021 is explicitly scoped as
    "SCOPED_NEGATIVE_BOUNDED_DEGREE_ALGEBRAIC_FACTOR_BASE__UNRESTRICTED_NO_GO_OPEN" and
    KN-OPEN-020 lists exactly what escapes it: high-degree interpolation descriptions,
    multiple constructible predicates, target-dependent descriptions, and implicit
    membership or source-recovery algorithms. What the existing theorem charges is
    COVERAGE - the sumset m_p F_p is too small to hit a random target. What it does not
    charge is the SOLVE. The threshold in IDEA-20260803-fa9839 charges exactly the solve
    and leaves the base free. Neither alone reaches a class statement; together they trap
    the base between a description bound above and a solve cost below, and the trap closes
    on a single exponent.
    THE NULL OBJECT IS THE PART THAT MAKES THIS HONEST, AND IT IS CONCRETE RATHER THAN
    HYPOTHETICAL. Take the quadratic-residue base F = { Q in G : chi(x(Q)) = 1 }. It is
    algebraically described - chi(x) = x^((p-1)/2) - and it has an O(log p) straight-line
    program for membership. Bezout is SATISFIED and VACUOUS: d_p ~ (p-1)/2, so
    3 d_p ~ 3p/2 exceeds |F| ~ N/2 with room to spare. THE BOUND HOLDS AND SAYS NOTHING.
    This is the precise sense in which the theorem does not reach SLP-described predicates,
    and it is a WITNESS rather than a worry.
    AND THE WITNESS THEN KILLS ITSELF, WHICH IS THE INFORMATIVE PART. The QR base has
    B ~ N/2, so linear algebra alone charges c_LA*N^2/4, catastrophically above sqrt(N).
    So the escape from Bezout is real as a DESCRIPTION and dead as an ALGORITHM. Reading
    the two together gives the two-sided picture that neither result gives alone:
    SMALL algebraic bases are killed by the solve cost their own description degree forces,
    LARGE ones by linear algebra, and the open region is the window in statement (1). That
    window - description degree below ~N^(1/4) - is where every future prime-field
    factor-base proposal must live, and it is a screening rule of the same kind
    KN-FIND-007 already supplies for mean yield.
    WHAT THETA IS AND WHY IT IS THE RIGHT RESIDUE. theta = 1 is "finding one root costs
    what enumerating all of them costs", which is false in general - root-finding is
    routinely sublinear in the solution count. theta = 0 is "one root is free regardless of
    how many there are", which is false for every known method on a zero-dimensional system
    of Bezout number Delta. The truth is a scalar in between, it is a question about
    polynomial system solving rather than about elliptic curves, and it is exactly the sort
    of question that has an answer in the literature this programme has not yet retrieved.
    theta*(4) = 1/3 is a LOW BAR: it asks only that finding one solution of a system with
    Delta solutions costs at least Delta^(1/3).
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-03'
    corpus_paths_grepped:
    - ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md
    - knowledge/open-problems/KN-OPEN-020.md
    - knowledge/open-problems/KN-OPEN-001.md
    - ledger/proposals
    grep_results:
    - >-
      IDEA-20260801-021 IS THE DIRECT PARENT AND IS NOT DUPLICATED. Its Theorem 1 supplies
      |F_p| <= 3 d_p and its algebraic-degree generalization supplies |F_p| <= Delta_p.
      Its charged-trial bound Omega(N/B^m) is a COVERAGE bound on a declared
      rerandomization interface. This record adds the SOLVE side, which that receipt
      explicitly does not charge, and requires reproducing its Omega(N/B^m) as a special
      case (theta = 0) as a correctness gate.
    - >-
      KN-OPEN-020 states the universal no-go is open and names four escapes. This record
      does not close it. It reduces one escape - "implicit membership solvers" - to a
      single exponent, and produces an explicit witness (the QR base) for another,
      "high-degree descriptions", showing that Bezout is satisfied-but-vacuous there
      rather than violated.
    - >-
      No corpus record contains theta*(m) = 1 - 2/(m-1), the description-degree window
      d < N^(1/4)/3, or the quadratic-residue base as a null object. Grep across
      ledger/proposals for "quadratic residue", "straight-line", "SLP" returned nothing.
    literature_verified: []
    literature_unverified:
    - >-
      Lower bounds on finding a single solution of a zero-dimensional polynomial system as
      a function of its Bezout number are the natural home for theta and ARE NOT RETRIEVED.
      Primary sources are unreachable from this environment. No value of theta may be
      asserted, quoted, or assumed from recollection; theta stays a free parameter and the
      deliverable is the threshold table, not a verdict.
    conclusion: >-
      Adaptation. Bezout bounds on plane-curve intersections and two-term index-calculus
      balancing are both standard. The contribution is the composition, the exact
      threshold function theta*(m) = 1 - 2/(m-1), the unconditional description-degree
      window, and the identification of one scalar as the residue of KN-OPEN-020's
      implicit-solver escape.
  assumptions:
  - >-
    HARD DEPENDENCY - the two-term charge of IDEA-20260803-fa9839 must have PASSED its
    baseline-reproduction gate. That proposal establishes on its own evidence that the
    two-term model is NOT TIGHT (it misses the known extension-field exponent by exactly
    2/(n(n+1))). Every statement here inherits that gap. IF fa9839's gate fails, THIS
    RECORD PRODUCES NOTHING and must be withdrawn rather than reinterpreted.
  - >-
    The membership predicate is fixed before and independently of the challenge and of any
    trial randomness, and its projective closure shares no component with E - the exact
    admissibility conditions of IDEA-20260801-021, carried verbatim and not weakened.
  - >-
    Delta ~ 2^(m-2) * d_p^(m-1) is used as an UPPER bound on the solution count and hence
    as a LOWER bound proxy inside HEUR-BW-1. Any tighter Bezout count for the specific
    Semaev-plus-predicate system LOWERS Delta and therefore RAISES theta*(m), weakening the
    exclusion. The direction of that sensitivity must be reported with every row.
  proof_search_map:
    bottleneck: >-
      The simultaneous constraint that the factor base be LARGE enough for the sumset to
      cover targets and SMALL enough for linear algebra, while its description degree
      forces the per-trial solve cost. The exact bottleneck claim is that these three are
      not independent: Bezout ties description degree to base size, which ties base size to
      both other terms.
    baseline_embedding:
      parameter_slice: >-
        theta = 0 with the solve granted free, which is precisely the regime
        IDEA-20260801-021 analyses.
      reproduction_check: >-
        At theta = 0 the composition must reproduce that receipt's charged-trial lower
        bound Omega(N/B^m) and its coverage cap Pr[T in m F] <= 2^C B^m / N, symbolically
        and exactly. A composition that cannot recover its own parent at the parent's
        parameter value is wrong and everything downstream is void.
    observation_collision: >-
      The observable is (|F|, description complexity). The QR base and a
      degree-N^(1/4) plane predicate can present COMPARABLE description complexity under an
      SLP measure while differing by a factor of N^(3/4) in |F|. That collision is the
      reason Bezout degree is not the right complexity measure for SLP-described
      predicates, and it is exactly KN-OPEN-020's open escape. The search for further
      preimages must cover: multiple simultaneous predicates, target-dependent
      descriptions, Frobenius/character-type predicates, and implicit membership by a
      decision procedure with no polynomial description at all.
    quantifier_order: >-
      For every fixed arity m >= 4 and every admissible algebraic predicate family
      {f_p} with intersection degree Delta_p, IF HEUR-BW-1(theta) holds with
      theta >= 1 - 2/(m-1), THEN no member of the class attains expected cost below
      c_rho*sqrt(N) in the two-term model. NOT "there exists a theta"; NOT "for every
      factor base there is a theta". theta is universally quantified over the class and
      fixed before the class is considered.
    method_ceiling: >-
      This method can NEVER exclude implicit membership solvers that have no algebraic
      description at all, nor any algorithm outside the point-decomposition shape (descent
      by other means, lattice methods, isogeny transfer). It also cannot exclude anything
      if theta turns out to be near 0. Its ceiling is one escape route of the four
      KN-OPEN-020 names, and it must be described that way rather than as progress toward
      a universal no-go.
    nearby_object_control: >-
      The nearby object is the SAME composition with the Semaev system replaced by an
      arbitrary degree-Delta zero-dimensional system unrelated to any curve. If theta*(m)
      is unchanged - and it should be, since nothing in the derivation uses the group law -
      then the result is a statement about polynomial system solving wearing an elliptic
      curve as decoration, and it must be reported as such rather than as an ECDLP-specific
      barrier. THIS CONTROL IS EXPECTED TO FIRE AND ITS FIRING IS INFORMATIVE.
  predictions:
  - metric: parent_reproduction_at_theta_zero
    direction: same
    minimum_effect: >-
      'At theta = 0 the composition returns IDEA-20260801-021''s Omega(N/B^m) charged-trial
      bound and its coverage cap exactly, verified symbolically. Any deviation voids the
      composition.'
  - metric: theta_star_closed_form
    direction: same
    minimum_effect: >-
      'theta*(m) = 1 - 2/(m-1) verified symbolically from the stationarity condition and
      numerically at m = 4..10 to 1e-12, with theta*(4) = 1/3, theta*(5) = 1/2,
      theta*(6) = 3/5 as committed point values.'
  - metric: description_degree_window
    direction: same
    minimum_effect: >-
      'The unconditional (theta-free) upper bound d_p < (1/3)(c_rho/c_LA)^(1/2) N^(1/4),
      emitted with pinned constants at N in {2^160, 2^224, 2^256, 2^384} - concretely, at
      N = 2^256 and unit constants, d_p < 2^64/3, i.e. any winning algebraic base has
      fewer than 2^64 elements.'
  - metric: qr_null_object_two_sided_kill
    direction: same
    minimum_effect: >-
      'For F = {chi(x(Q)) = 1}: Bezout is satisfied with 3 d_p ~ 3p/2 >= |F| ~ N/2 (the
      bound holds and is vacuous), AND the base is killed by linear algebra at
      c_LA*N^2/4 >> c_rho*sqrt(N). BOTH limbs must be exhibited; a null object that fails
      only one limb does not demonstrate the two-sided structure claimed.'
  - metric: nearby_object_control_outcome
    direction: same
    minimum_effect: >-
      'An explicit statement of whether theta*(m) changes when the Semaev system is
      replaced by a generic degree-Delta zero-dimensional system. PRE-REGISTERED
      EXPECTATION: it does not change, and the result is therefore not ECDLP-specific.
      Recording the expected outcome in advance is what stops it being spun either way.'
  minimal_test:
    design: >-
      ZERO COMPUTE. (1) Verify the parent reproduction at theta = 0 symbolically. (2)
      Derive theta*(m) from stationarity; verify symbolically and numerically at m = 4..10.
      (3) Enumerate BOTH regimes (coverage-limited and trial-limited) and take the correct
      max, showing explicitly that the large-base regime is dead for m <= 4 independently
      of theta. (4) Emit the unconditional description-degree window with pinned constants
      at four field sizes. (5) Construct the QR null object and verify both limbs
      numerically at three toy primes and symbolically in general. (6) Run the
      nearby-object control and record its outcome against the pre-registered expectation.
      (7) State plainly which of KN-OPEN-020's four named escapes this does and does not
      touch.
    controls:
    - >-
      PARENT-REPRODUCTION GATE at theta = 0, as a hard blocker on emitting anything else.
    - >-
      QUADRATIC-RESIDUE NULL OBJECT, required to exhibit BOTH limbs (Bezout vacuous, cost
      fatal). This is the control that prevents the record from reading as a stronger
      no-go than it is.
    - >-
      NEARBY-OBJECT CONTROL with its outcome PRE-REGISTERED as "expected not to change",
      so that a non-ECDLP-specific result is reported as such rather than dressed up.
    - >-
      DELTA-SENSITIVITY DIRECTION CHECK - confirm in writing that a tighter Delta raises
      theta*(m) and weakens the exclusion, and report theta*(m) under both the loose
      2^(m-2) d^(m-1) count and any tighter count used.
    required_metrics:
    - symbolic residuals for the theta = 0 parent reproduction
    - theta*(m) symbolic form plus numeric values at m = 4..10
    - the description-degree window at four field sizes with pinned constants
    - QR null object - both limbs, symbolic and at three toy primes
    - nearby-object control outcome against its pre-registered expectation
    - an explicit escape-coverage table against KN-OPEN-020's four named escapes
  falsification_conditions:
  - >-
    'F1 - the theta = 0 case does not reproduce IDEA-20260801-021: the composition is wrong
    and nothing may be emitted.'
  - >-
    'F2 - theta*(m) does not verify symbolically, or the two-regime max is taken
    incorrectly: algebra error, void.'
  - >-
    'F3 - the QR null object fails to exhibit both limbs: the two-sided structure is not
    demonstrated and the claim must be narrowed to the Bezout side alone.'
  - >-
    'F4 - fa9839''s baseline-reproduction gate fails: THIS RECORD IS WITHDRAWN, not
    reinterpreted. Recorded as a hard dependency precisely so that the failure mode is
    withdrawal rather than quiet rescoping.'
  - >-
    'F5 - a construction is exhibited with theta >= theta*(m) that nonetheless beats rho:
    the two-term charge is refuted and that is a far more valuable result than the
    barrier.'
  confounders:
  - >-
    THE BIGGEST ONE, STATED FIRST: theta is not retrieved and may be small. If the true
    solution-proportionality exponent for these systems is below 1/3, the composition
    excludes NOTHING at m = 4 and the record's value collapses to statement (1) alone. The
    deliverable is therefore written so that statement (1) - which needs no theta - stands
    on its own.
  - >-
    Delta ~ 2^(m-2) d^(m-1) counts solutions of the system over the algebraic closure. The
    RATIONAL solutions, which are what the descent needs, are far fewer. Using the closure
    count inside a lower-bound heuristic is the correct direction for an upper bound on
    Delta but the WRONG direction if a solver can restrict to rational points cheaply. This
    is a real gap and must be recorded, not argued away.
  - >-
    Pinned constants c_LA and c_rho carry the numeric window; the window's EXPONENT (1/4)
    does not depend on them and is the part that may be cited without them.
  interpretation_limits:
  - >-
    THIS IS NOT A PROOF THAT PRIME-FIELD INDEX CALCULUS FAILS. It excludes ONE class -
    algebraically described factor bases with charged intersection degree, inside a
    point-decomposition descent, inside a two-term cost model KNOWN NOT TO BE TIGHT -
    conditional on ONE unretrieved exponent. KN-OPEN-001 and KN-OPEN-020 both remain open.
  - >-
    The nearby-object control is expected to show the result is not ECDLP-specific. If so,
    it must be presented as a statement about point-decomposition descent with algebraic
    membership, not as a statement about elliptic curves.
  - >-
    Claim tier `toy`. No deployed curve or scheme is in scope, and no security consequence
    of any kind follows.
  heuristic_assumptions:
  - id: HEUR-BW-1
    statement: >-
      Deciding whether one target admits an arity-m decomposition over the algebraic factor
      base costs D_trial = Omega(Delta^theta) charged operations, where Delta is the Bezout
      number of the Semaev-plus-predicate system, for a fixed theta in [0,1] uniform over
      the class.
    rigorous_support: >-
      NONE IN THIS CORPUS, AND THAT IS THE POINT. theta = 1 corresponds to enumerating all
      solutions and is FALSE in general; theta = 0 corresponds to a free root and is false
      for every known method on a zero-dimensional system. The truth is a scalar strictly
      between, it is a question about polynomial system solving rather than about elliptic
      curves, and it is not retrieved.
    validation_plan: >-
      The deliverable is a table of theta*(m), NOT a verdict, so that any future retrieved
      or proved value of theta reads off its own consequence. Separately, MEASURE an
      empirical theta_hat at toy scale by timing single-solution recovery on
      Semaev-plus-predicate systems across a Delta ladder, and report it as a TOY-SCALE
      EMPIRICAL VALUE THAT IS NOT A LOWER BOUND - a measured cost cannot establish
      Omega(). That distinction must be stated wherever theta_hat appears.
  - id: HEUR-BW-2
    statement: >-
      The uniform-over-class quantifier on theta is legitimate - one exponent governs every
      admissible predicate family rather than each family having its own.
    rigorous_support: >-
      NOT SUPPORTED. A structured predicate could admit a much faster solver than a generic
      one of the same degree, which is exactly what a successful attack would look like.
    validation_plan: >-
      State the result as parameterized by theta(family) and emit theta*(m) as the
      per-family bar to clear, so a family-specific fast solver is a legitimate escape the
      record predicts rather than an oversight it hides.
  target_complexity:
    time_exponent: >-
      No algorithm proposed. The objects produced are theta*(m) = 1 - 2/(m-1) and the
      unconditional window exponent 1/4 on description degree.
    memory_exponent: >-
      B < N^(1/4) up to pinned constants is simultaneously the memory statement and the
      barrier, and must always be emitted with the time row.
    best_known: >-
      Pollard rho at c_rho*sqrt(N). No prime-field index-calculus advantage is known
      (KN-OPEN-001); this programme's single support verdict was retracted (EV-IC-002).
    hidden_overhead: >-
      Descent is not charged; relation rank is not charged; the closure-vs-rational
      solution-count gap is not charged. All three are recorded as gaps rather than
      resolved.
    tradeoff_note: >-
      The record IS the tradeoff: description degree bounds base size from above by Bezout,
      base size bounds linear algebra from below, and description degree bounds the solve
      from below through Delta. The window is what survives all three.
  dominated_by: >-
    Not applicable - no attack, no Pareto point. Written explicitly rather than left null.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against the prior barrier state: IDEA-20260801-021
    charges coverage only and grants the solve free; this adds the solve, produces an
    unconditional description-degree window that needs no heuristic, and reduces one of
    KN-OPEN-020's four named escapes to a single scalar with a small threshold
    (theta*(4) = 1/3). The other three escapes are untouched and the record says so.
  instrument_failure_guards:
    decision_variable: >-
      theta*(m) and the unconditional window exponent. Both are derived quantities and
      neither is a measurement, so the failure modes are algebraic rather than statistical.
    what_would_make_it_vary: >-
      The arity m, which is an externally chosen knob with a monotone predicted effect -
      theta*(m) must increase strictly in m from 1/3 at m = 4 toward 1, and the window
      exponent must NOT vary with m at all. A theta*(m) that is non-monotone, or a window
      that moves with m, is an algebra error.
    power_against: >-
      An incorrect composition of the two parents, a mis-taken max over the two cost
      regimes, and an overstated reach - the QR null object and the nearby-object control
      both exist to fire and both are expected to.
    no_power_against: >-
      The true value of theta, which is not retrieved and cannot be established here.
      Implicit membership solvers with no algebraic description. Any non-point-decomposition
      attack. The tightness of the two-term model itself, which is fa9839's problem and is
      known to fail by 2/(n(n+1)).
    demonstrated_movement: >-
      By the parent-reproduction gate at theta = 0, which is a known-answer case with a
      committed prior result, and by the QR null object, whose two limbs are checkable in
      closed form and at three toy primes.
    lessons_addressed: >-
      Addresses the pattern behind KN-FIND-007's own motivating failure - 24 CPU hours
      budgeted for a battery whose primary metric was vacuous by arithmetic - by putting
      the vacuity check (the QR object, where Bezout holds and says nothing) INSIDE the
      proposal instead of discovering it after the budget is spent.
  estimated_cost:
    implementation: low
    compute: none
  compute_budget_note: >-
    Symbolic derivation plus arithmetic at four field sizes and three toy primes. Under an
    hour. The optional toy theta_hat ladder, if the Coordinator authorizes it, is a
    separate and separately-scoped measurement that must not be folded into this record.
  recommended_priority: high
  dependencies:
  - >-
    BLOCKING - IDEA-20260803-fa9839 must pass its baseline-reproduction gate first. On
    failure this record is WITHDRAWN.
  - >-
    IDEA-20260801-021 must remain unsuperseded; its admissibility conditions are carried
    verbatim.
  - >-
    Feeds KN-OPEN-020 directly. Does NOT close it and the deliverable must say so in the
    same sentence in which it reports theta*(m).
