idea:
  id: IDEA-20260903-81a943
  question_id: RQ-ECDLP-002
  added: '2026-09-03'
  title: >-
    The lattice-describable factor base is closed: small-root reach and index-calculus
    demand are monotone in the same tree parameter and never cross, with a worst-case
    margin of -0.048 in the exponent
  class: measurement
  claim: >-
    For windowed (lattice-describable) prime-field factor bases attacked through a binary
    addition tree, define eps_available as the Jochemsz-May reach of the decomposition
    system and eps_required as the reach the index-calculus balance demands. Then for
    every arity m <= 32 and every number w of kept internal nodes,
    eps_available < eps_required, with maximum margin -0.0481 attained at (m,w) = (4,2).
    The mechanism is that the two exponents are monotone in the SAME parameter: reaching
    the degree-2 (all-S_3) configuration where eps_available peaks at 0.8408 requires the
    full tree w = m-2, where the accumulated window cost pushes eps_required to 8/9 =
    0.8889; releasing any window to recover yield forces a block of >= 3 inputs, whose
    per-variable degree doubles and whose reach falls to 0.4137 while eps_required stays
    above 1/2. The claim is falsified by exhibiting any (m, w, tree, window assignment)
    with eps_available > eps_required, or by a measured reach for S_3 above 0.8889.
  mechanism: >-
    (1) The algebraic no-go (IDEA-20260801-021 / IDEA-20260803-e2f5bd) leaves
    lattice-describable sets as the only remaining factor-base family, and their
    decomposition test is a multivariate small-root problem, so its cost is governed by
    the Coppersmith/Jochemsz-May reach rather than by the Groebner solving degree -- the
    obstruction measured in analysis/isogeny-dreg-search does not apply to it.
    (2) DEMAND: from yield (m*beta - 1 + sum(gamma_v - 1)), relation count p^beta, sparse
    linear algebra (2*beta < 1/2) and solvability, eliminating sum(gamma_v) gives
    eps_required(m,w) = (w + 1/2 + 1/(2(m-1)))/(w+1), which reduces at w=0 to the
    m/(2(m-1)) stated by IDEA-20260808-486ae2 and rises with w toward 1 because each kept
    window costs a factor p^(gamma-1) of yield.
    (3) SUPPLY: the JM shift lattice summed exactly over its monomials, extrapolated
    t -> infinity in 1/t, calibrated against Coppersmith's univariate theorem (reach
    exactly 1/d, reproduced to 1e-4 for d in {1,2,3,4,5,8,16}). For a full box [0,d]^n it
    gives the closed form 2n/(d(n+1)), which at fixed d = 2 rises toward 1 with n -- the
    reason the family was worth checking rather than dismissing.
    (4) THE COUPLING: a kept internal node's VALUE is an input to its parent's block, so
    the w+1 blocks consume m + w inputs and the worst block takes l = ceil((m+w)/(w+1)).
    Hence l = 2 forces w >= m-2, i.e. the degree-2 maximum-reach configuration is
    available ONLY on the full tree, which is exactly where the window cost is maximal.
    The levers are welded together and no interior optimum exists.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-09-03'
    corpus_paths_grepped:
    - ledger/proposals (coppersmith, small root, lattice, semaev, factor base)
    - ledger/hypotheses, ledger/evidence, ledger/decisions, experiments/ (EXP-COPP-*)
    - knowledge/techniques, knowledge/literature (Jochemsz-May)
    grep_results:
    - 'IDEA-20260808-486ae2 states the win condition eps > m/(2(m-1)) at w = 0 and asserts
      eps "is computable in closed form from the Newton polytope by the Jochemsz-May
      extended strategy, with zero compute". It is status: proposed. This record runs that
      computation, reproduces its w=0 inequality exactly as a check, and generalizes it to
      all w -- which the proposal did not do and which is what decides the family.'
    - 'IDEA-20260808-c31f1c (rank-r GAPs), IDEA-20260808-2e14f7 (coordinate-degree),
      IDEA-20260808-e2315e (superpolynomial dimension): all status: proposed, none
      executed. Its invariance lemma (affine substitution is polytope-neutral) is what
      lets this record cover every rank-1 AP by covering the interval; rank r >= 2 is
      explicitly left open as the live successor.'
    - 'No EXP-COPP-* directory exists on disk; no hypothesis, evidence or decision record
      cites any of the four proposals. Jochemsz-May appears only in knowledge/literature
      notes and two unrelated experiments pre-implementation reviews.'
    - 'analysis/isogeny-dreg-search (merged 2026-09-03) measured the Groebner-side
      obstruction d_ff = h+2 on a certified 2^40 isogeny class. That obstruction does not
      bind here, which is precisely why this family needed its own computation.'
    literature_verified: []
    conclusion: >-
      Marked unverified because the Jochemsz-May and Coppersmith citations are recalled
      rather than read in this session (validator rule); substantively the strategy is
      standard and the novelty is running it on the true summation-polynomial polytopes
      and comparing against the index-calculus demand curve, which no record in this
      corpus does.
  citations:
  - ref: IDEA-20260808-486ae2
    provenance: internal
    claim: classification of factor-base families and the w=0 win condition eps > m/(2(m-1))
    verified_by: this record -- read in full, and its inequality reproduced as a unit test
  - ref: IDEA-20260808-c31f1c
    provenance: internal
    claim: affine substitution is polytope-neutral, so all rank-1 APs are equivalent to intervals
    verified_by: this record -- read in full
  - ref: KN-TECH-015
    provenance: internal
    claim: Howgrave-Graham lemma and the completeness of small-root methods inside their bound
    verified_by: this record
  - ref: Coppersmith 1996 univariate small-root reach p^(1/d); Jochemsz-May Asiacrypt 2006 extended strategy
    provenance: recalled
    claim: the reach convention and shift-set construction; the univariate 1/d value is used as an EXTERNAL calibration target that the calculator must hit, so an error in the recollection would show up as a failed test rather than as a silent wrong answer
    verified_by: null
  assumptions:
  - Decomposition proceeds by elimination on a binary addition tree; non-tree strategies are out of scope.
  - The JM reach is heuristic: it assumes the recovered short vectors are algebraically independent. Real LLL frequently fails this, which lowers true reach and strengthens the closure.
  - Blocks are split as evenly as possible (the reach-maximising configuration) and blocks with l >= 4 receive a 1.15x sparsity allowance larger than the 1.12x measured at l = 2 and the 1.035x at l = 3. Every such choice over-credits the attack.
  predictions:
  - metric: eps_available - eps_required over all (m, w)
    direction: lower
    minimum_effect: strictly negative everywhere; falsified by any nonneg margin
  - metric: measured extended-strategy reach of S_3
    direction: different
    minimum_effect: 0.8408 +- 0.001 (t -> infinity extrapolations spanning 0.8407-0.8412)
  - metric: measured extended-strategy reach of S_4
    direction: different
    minimum_effect: 0.4137 +- 0.001, i.e. within 4% of the full-box 0.4000
  minimal_test:
    design: >-
      python3 tools/smallroot_reach.py --validate (calibration against Coppersmith 1/d),
      then --m 4,5,6,8,12,16,24,32 for the decision table. The S_4 polytope is recomputed
      from scratch as Res_Y(S_3(x1,x2,Y), S_3(x3,x4,Y)) rather than quoted.
    controls:
    - 'Calibration against a theorem: univariate reach must come out exactly 1/d.'
    - 'Full-box control: the extended-strategy code fed a full box must reproduce the basic closed form 2n/(d(n+1)).'
    - 'Reproduction control: eps_required at w=0 must equal the independently stated m/(2(m-1)).'
    - 'Direction-of-error control: every modelling choice must be checkable as over-crediting the attack.'
    required_metrics:
    - eps_available, eps_required, margin per (m,w); best margin overall
    - measured reach and support size per summation polynomial
  falsification_conditions:
  - Any (m, w, tree, window assignment) with eps_available >= eps_required.
  - A measured S_3 extended reach above 0.8889 (which would open m=4, w=2).
  - A rank-r >= 2 GAP substitution whose polytope lifts the reach past the demand curve.
  confounders:
  - The JM heuristic could be optimistic in either direction for a specific polytope; the univariate calibration bounds this only for n = 1.
  - The 1.15x allowance for l >= 4 is an extrapolation of a two-point trend.
  interpretation_limits:
  - This closes ONE factor-base family under ONE solver family. It is not a closure of prime-field ECDLP, and it says nothing about non-tree decomposition, rank-r >= 2 GAPs, or superpolynomial-dimension lattices.
  - Exponents only; no wall-clock claim, no crypto-scale claim, claim tier toy.
  heuristic_assumptions:
  - id: H1
    statement: >-
      The Jochemsz-May reach computed from the Newton polytope is attained by an actual
      LLL run, i.e. the short vectors returned are algebraically independent.
    rigorous_support: >-
      Howgrave-Graham's lemma is unconditional (a short enough vector yields an identity
      over Z); only the independence of several such identities is heuristic.
    validation_plan: >-
      --probe measures planted-root recovery against the univariate case where the reach
      is a theorem; a multivariate probe on S_3 would tighten the supply side and can only
      move it down.
  target_complexity:
    time_exponent: not_applicable (closure of a family; no algorithm claimed)
    memory_exponent: not_applicable
    best_known: p^{1/2} (Pollard rho)
    hidden_overhead: none claimed
    tradeoff_note: none
  dominated_by: Pollard rho at exponent 1/2; this record claims no attack and no exponent.
  sota_delta: >-
    No attack delta. Methodological delta: runs the reach computation that
    IDEA-20260808-486ae2 specified but never performed, on the true S_3 and S_4 Newton
    polytopes, and supplies the demand curve eps_required(m,w) for all w rather than only
    w = 0.
  obstruction_measured:
    statement: >-
      Small-root supply and index-calculus demand for windowed prime-field factor bases
      are monotone in the same tree parameter and never cross.
    quantity: eps_available - eps_required (exponents base p)
    value: -0.0481 at the optimum (m,w) = (4,2); <= -0.0481 for every m <= 32 and every w
    scope: >-
      binary addition trees, m <= 32, any w, any window sizes, any rank-1 GAP factor base,
      #equations = w+1, heuristic JM reach assuming algebraic independence
    resource_check:
      examined: true
      reading: >-
        The family lives at lattice density -> 1, the regime where low-density subset-sum
        attacks fail. That is reusable rather than merely negative: the windowed
        decomposition problem is a natural hard-instance generator in the density-1 regime,
        and any future improvement in density-1 lattice solving transfers here with a
        computable threshold. It also localises where NOT to look: improving Groebner
        solving degree cannot help this family, because the family never pays that cost.
  estimated_cost:
    implementation: low -- implemented in tools/smallroot_reach.py, 10 tests green
    compute: negligible (seconds; the promised "zero compute" closed form)
  recommended_priority: medium
  scope: >-
    Lattice-describable (windowed / rank-1 GAP) factor bases for prime-field ECDLP index
    calculus, attacked by tree elimination plus a Coppersmith-family small-root solver.
    Analysis note: analysis/smallroot-reach/CLOSURE.md.
