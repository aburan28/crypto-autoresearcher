idea:
  id: IDEA-20260820-4467d2
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Conversion-fibre syndrome list recovery with public ideal witnesses
  class: structural_list_recovery
  claim: >-
    If transcript conversion choices induce representation-invariant noisy
    constraints on a quotient presentation of the ideal fibre, an explicit
    list-recovery decoder might shrink the candidate set. The invariant, decoder,
    and cost advantage are all unverified; canonicalization or byte differences
    alone are not treated as evidence.
  mechanism: >-
    Present the public-curve-compatible ideal fibre as auditable quotient blocks
    and search for a transcript-derived symbol phi(tau) that is invariant under
    allowed encodings, automorphisms, and conversion tie breaks, yet has a
    candidate-dependent law. Interpret q symbols as a noisy syndrome word.
    Construct a list-recovery decoder whose output is a set of ideal classes,
    lift each class to an ideal representative, and attach a witness that its
    isogeny reproduces the public curve. The proof must lower-bound the
    observational collision class, and the cost comparison must include quotient
    presentation, symbol extraction, list recovery, lifting, oracle data, and
    witness verification. A failure to find a representation-invariant symbol is
    a useful falsification, not permission to use raw encodings.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: Defines conversion-choice scaling, genuine simulation, and the required ideal output.
    - id: IDEA-20260808-287361
      provenance: internal
      use: Posterior predecessor; this card requires an algebraic symbol map and constructive list-recovery certificate.
    - id: IDEA-20260808-19876e
      provenance: internal
      use: Distinguisher ceiling; a syndrome must localize ideal candidates rather than distinguish marginal transcripts.
    - id: KN-LIT-1248
      provenance: kb
      use: Unreviewed ideal-to-isogeny preprint pointer; no theorem or novelty claim is imported.
    - id: KN-TECH-058
      provenance: internal
      use: >-
        Charged Fp2 baselines: unconditional p^(1/2)(log p)^O(1) time and
        polynomial memory; conditional p^(1/3+o(1)) time and memory under
        Heuristic 1, hidden superpolynomial overhead, no concrete-cost conclusion,
        unverified reductions, and the GRH boundary.
    - id: KN-TECH-057
      provenance: internal
      use: Keeps all cost axes and the separate conditional Fp p^(1/4) mixing row.
  predictions:
    - id: P1
      statement: >-
        Under a planted symbol channel with alphabet size A and error rate epsilon,
        the decoder's log2 list shrinkage tracks q*(log2 A-h(epsilon)-epsilon*log2(A-1))
        minus quotient-collision and coverage slack.
    - id: P2
      statement: >-
        Under genuine simulation and representation randomization, the candidate
        mutual information of phi is zero within uncertainty and no certified shrinkage remains.
    - id: P3
      statement: >-
        Any useful symbol survives re-encoding, automorphism, and conversion-tie-break
        randomization while raw-byte and retry artifacts do not.
    - id: P4
      statement: >-
        End-to-end advantage exists only if quotient construction plus list recovery,
        lifting, and verification stays below the corresponding fully charged baseline row.
  controls:
    genuine_simulator_null: >-
      Use genuine simulated transcripts at matched keys, messages, q, conversions,
      retries, and encodings; apply identical symbol extraction, quotient blocks,
      decoder, lifting, and verification.
    planted_positive_control: >-
      Embed a known q-ary symmetric syndrome channel into simulated conversion
      choices without changing byte length or retry schedule; sweep epsilon to
      the random-channel limit and require the list curve to follow capacity.
    nearby_object_control: >-
      Randomize legal encodings, automorphisms, and tie breaks for the same ideal;
      phi must remain stable, while a raw-byte surrogate must fail.
  falsification_conditions:
    - No nonconstant transcript symbol survives all legal representation and conversion randomizations.
    - The symbol predicts only public strata or retry metadata and not ideal-fibre membership.
    - List recovery cannot retain the true ideal with probability at least 1-delta.
    - Quotient presentation, candidate lifting, or witness verification costs match or exceed the charged baseline.
    - Output classes cannot be lifted to ideals that independently reproduce the public curve.
  confounders:
    - Canonicalization can manufacture a stable symbol from implementation bytes.
    - Public curve strata may correlate with both transcript and fibre labels.
    - Automorphism or unit actions may merge purportedly distinct syndrome symbols.
    - Precomputing a quotient presentation may hide hard-problem-equivalent work.
  interpretation_limits:
    - A stable symbol without candidate list recovery is only a representation result.
    - A toy list decoder does not transfer to cryptographic p without an explicit scaling argument.
    - SSI hard-problem claims remain outside this goal and owned by GOAL-SSI-001.
    - Conditional KN-TECH-058 caveats, hidden overhead, reductions, and GRH boundary remain attached.
  heuristic_assumptions:
    - id: H1
      statement: The quotient presentation enumerates all declared public-curve-compatible ideal classes without secret-dependent preprocessing.
      falsification: Completeness fails or construction performs equivalent hard-problem work.
    - id: H2
      statement: Transcript symbols follow a channel with bounded dependence and declared error epsilon over q signatures.
      falsification: Dependence or adversarial noise exceeds the decoder radius.
  target_complexity:
    baseline: Preserve unconditional Fp2, conditional Fp2, and separate conditional Fp rows with all caveats.
    list_bound: >-
      log2 |L| <= log2 N-q*(log2 A-h(epsilon)-epsilon*log2(A-1))
      plus quotient-collision, dependence, and coverage slack.
    output: Ideal representatives with public-curve reproduction witnesses
    exponent_claim: none
  cost_model:
    time: T_quotient(p)+q*T_phi(p)+T_listrecover(p,q)+T_lift(p)+T_verify(p)
    memory: M_quotient(p)+M_symbols(p,q)+M_decoder(p,q)+M_output(p,q)
    data_queries: q signatures plus separate calibration and holdout sets, with retries included
    preprocessing: Quotient presentation, invariant proof, channel calibration, and decoder tables
    oracle: Every signer and genuine-simulator call, including conversion failures and adaptive messages
    verification: Re-encoding invariance checks plus independent public-curve reproduction for every output ideal
  proof_search_map:
    exact_baseline_reproduction:
      plan: Reproduce charged baseline rows and insert quotient, decoder, lift, and verification terms explicitly.
      pass_condition: No preprocessing or conditional overhead is amortized without a declared reuse model.
    observation_collision_search:
      plan: Compute or bound ideals sharing the same phi-law modulo automorphisms, units, and legal encodings.
      pass_condition: The maximal collision block appears as a lower bound on the output list.
    quantifier_order_statement:
      plan: Order pk, quotient presentation, representation randomization, planted channel, q transcripts, and decoder randomness.
      pass_condition: Invariance and coverage hold uniformly over legal representations before transcript sampling.
    method_ceiling:
      plan: Set epsilon to the random-channel limit and maximize the collision block.
      pass_condition: The bound yields zero shrinkage and no hard-problem conclusion.
    nearby_object_control:
      plan: Compare phi with a raw-byte symbol under repeated legal re-encodings of the same ideal.
      pass_condition: Only a proved invariant is admitted to the decoder.
  nearest_neighbors:
    - id: IDEA-20260808-287361
      discriminator: Supplies an explicit algebraic symbol, list-recovery decoder, ideal lift, and certificate instead of only posterior entropy.
    - id: IDEA-20260808-19876e
      discriminator: Requires localization inside the ideal fibre and capacity-scaled list shrinkage, not a constant transcript test.
    - id: KN-TECH-058
      discriminator: Fully charges structural preprocessing against the current hard-problem rows and does not claim to improve them.
  dominated_by: n/a (no result claimed)
  sota_delta: >-
    Proposed test: Delta_list=q*(log2 A-h(epsilon)-epsilon*log2(A-1))/log2 p
    minus collision and slack exponents; Delta_e2e is then recomputed after all
    six axes. Current measured delta is 0 because no invariant or decoder result exists.
  priority: medium_high
  cost: medium_high
  prior: 0.08
  provenance: agent_generated_under_TASK-20260820-a3c65a
