idea:
  id: IDEA-20260922-96289a
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Walk autocorrelation of a degree increment when the class is too large to enumerate
  class: measurement
  claim: >-
    Representation class R3 of RQ-ECDLP-623a32 (Weil restriction of a chained
    summation system), attack stage relation decomposition only. When an
    ordinary isogeny class is too large for the census of
    IDEA-20260922-805a59, sample a non-backtracking F_q-rational ell-isogeny
    walk and measure the lag-1 autocorrelation of one named proxy: the
    increment, from extension rung n=1 to rung n=2, of d_lf_obs from
    new_falls (IDEA-20260916-4b7c1e) on the chained system of length t=4.
    Two rungs and t=4 put the system off the closed prime-field m=3 floor;
    the observable is not m=3 d_reg. Two readings are registered before the
    run. (A) After a pre-registered number of steps the autocorrelation is
    consistent with zero: there is no smooth valley to walk toward, and a
    rare outlier, if it exists, is not locally detectable from this proxy.
    (B) The autocorrelation persists and is concentrated on vertical,
    conductor-changing steps: the proxy is a function of volcano level, not
    of a rare j. Horizontal-only persistence is recorded as the
    rare-endpoint reading and is not believed until the syzygy gate
    IDEA-20260922-f7de2a accepts a witnessed gap. The walk is not an attack.
  mechanism: >-
    Object frame. Representation: R3, the Weil-restriction coordinates of
    the chained t=4 system at two extension rungs. Attack stage: relation
    decomposition only. Operation set Sigma: non-backtracking steps along
    F_q-rational ell-isogenies, ell coprime to the group order. Sigma is
    not the translation action. Trichotomy class of IDEA-20260806-c5d183:
    coordinate-dependent, because the increment is a function of the model
    at the current vertex, not of a group element. The projection discards
    the curve, the generators, and the points, and retains the scalar
    increment at each measured vertex. Many models can share one integer,
    so the projection is lossy. The walk does not propagate that integer
    deterministically. A step whose matrix at either rung does not finish
    is dropped from the series. It is not coded as a large increment.
    Vertical means the two ends of the step have different endomorphism-ring
    conductors, computed at toy size. A step whose conductor is not computed
    is unlabeled and is excluded from reading B. Reading A uses every
    measured step. Reading B splits those steps into vertical and horizontal.
    The mixing comparison, number of steps against the log of the class
    size, is heuristic H1 and is recalled. Nothing in this record says the
    walk finds a low-degree curve.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        Defines new_falls and d_lf_obs as a certified lower bound on later
        falls inside a degree cap. The proxy is the rung increment of that
        integer. The definition is not restated.
      verified_by: idea-generator, lines 1-100 read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        Outcome O1 is a class-constant proxy. Reading A is the large-class
        version of that constancy along a walk. Unfinished matrices are
        not explosions.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: >-
        Requires a growing-degree system and forbids the prime-field m=3
        screen. The chained t=4 ladder with two rungs is the system used
        here. Volcano level is a covariate, not itself the attack cost.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: Coordinate-dependent trichotomy class.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R3 includes Weil restriction. The stage is relation decomposition.
      verified_by: idea-generator, title and scope opening read 2026-09-22
    - ref: IDEA-20260922-f7de2a
      provenance: internal
      claim: >-
        A scalar fall-profile gap is not accepted without an explicit
        syzygy witness. Horizontal-only persistence in this record is not
        accepted without that gate.
      verified_by: idea-generator, claim and mechanism opening read 2026-09-22
    - ref: IDEA-20260922-805a59
      provenance: internal
      claim: >-
        The full-class capped census. This walk is the substitute when
        that census does not finish. It does not replace a finished census.
      verified_by: idea-generator, claim and mechanism opening read 2026-09-22
    - ref: ordinary ell-isogeny volcano and walk mixing
      provenance: recalled
      claim: >-
        Kohel's volcano stratifies the ordinary ell-isogeny graph by
        endomorphism-ring conductor, and the horizontal graph at the
        crater is recalled to be a Cayley graph on the class group. The
        comparison of mixing time with the log of the class size imitates
        an expander mixing bound and was not opened. The ordinary graph
        is not claimed to be that expander.
      verified_by: null
  assumptions:
    - The proxy is the n=1 to n=2 increment of d_lf_obs on the chained t=4 system, one frozen monomial order, one frozen degree cap.
    - A vertex is measured only when both rungs finish with no gaps.
    - ell is coprime to the group order at every step that is kept.
  proof_search_map:
    bottleneck: >-
      Local detectability of the degree increment along the isogeny
      graph. If the increment mixes, no walk can steer toward a low
      value. The bottleneck is not an unread mixing theorem.
    baseline_embedding:
      parameter_slice: >-
        On one toy class small enough that every volcano level is known,
        the same autocorrelation is computed for the level function
        itself, which is locally structured, and for the degree increment.
      reproduction_check: >-
        The level function's lag-1 autocorrelation on vertical steps is
        nonzero on that known volcano. If that control is flat, the
        labeling of vertical steps is void and reading B is not issued.
    observation_collision:
      observable: >-
        The lag-1 sample autocorrelation of the increment, and the same
        statistic restricted to vertical steps and to horizontal steps.
      distinct_preimage_search: >-
        Two walks on the same class can share a lag-1 value. A value
        consistent with zero does not identify which curves were visited.
        That collision is reading A. A value that tracks the conductor
        and not the j-invariant is reading B.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of walks whose increment series has a given lag-1
          autocorrelation, split by vertical versus horizontal steps.
        predicted_gain: >-
          Separates a mixed proxy from a level function. No ECDLP
          exponent gain. Horizontal-only persistence is not a gain.
    quantifier_order: >-
      Reading A: for the pre-registered lag, the absolute sample
      autocorrelation on the measured series is at most the frozen null
      threshold. Reading B: there exists a positive autocorrelation on
      the vertical steps above that threshold, and the horizontal-step
      autocorrelation is at most the threshold. The rare-endpoint
      reading swaps those two restrictions. Steps with an unfinished
      matrix or an unlabeled conductor are outside the quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the tested toy walk, the increment is locally mixed, or it
        tracks volcano level, or it persists only horizontally. None of
        these is an algorithm that finds an outlier.
      nearby_object_control: >-
        The same walk statistic on the gauge orbit of one visited j,
        which is not an isogeny step. A nonzero autocorrelation produced
        by gauge changes is a coordinate artifact.
    proof_obligations:
      - claim: >-
          Unfinished rungs are dropped from the series and are not
          entered as large increments.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: lag1_autocorrelation_of_rung_increment
      direction: lower
      minimum_effect: >-
        Reading A: with at least 8 measured consecutive pairs, the
        absolute lag-1 autocorrelation is at most 2 over the square root
        of the number of pairs. Fewer than 8 pairs is unmeasured.
    - metric: vertical_versus_horizontal_autocorrelation
      direction: different
      minimum_effect: >-
        Reading B: the vertical-step lag-1 autocorrelation exceeds that
        same threshold and the horizontal-step value does not. The
        swapped pattern is recorded as horizontal-only and is not
        believed without IDEA-20260922-f7de2a.
  minimal_test:
    design: >-
      Use one toy ordinary class whose volcano levels are already known,
      so reading B has a ground-truth level function. Walk at least 8
      non-backtracking F_q-rational ell-isogeny steps, ell coprime to the
      group order. At each vertex whose chained t=4 matrices finish at
      both rungs, record the increment of d_lf_obs. Label each step
      vertical or horizontal from the conductors. Compute the three
      lag-1 autocorrelations. Assign A, B, horizontal-only, or unmeasured.
      Do not search for a minimum along the walk.
    controls:
      - Autocorrelation of the known volcano-level function on the same steps.
      - Gauge-orbit increments of one visited j, which must not be entered as walk steps.
      - One support-matched non-elliptic system at the start vertex, not walked.
    required_metrics:
      - increment of d_lf_obs at each measured vertex
      - number of dropped unfinished vertices
      - lag-1 autocorrelation overall, on vertical steps, and on horizontal steps
      - which reading was assigned
  falsification_conditions:
    - >-
      The level-function control is flat on a volcano that has at least
      two levels. Step labels are void and reading B is not issued.
    - >-
      Reading A holds on the measured series. There is no smooth valley
      for this proxy. That is a completed measurement.
    - >-
      Horizontal-only persistence is treated as an outlier without a
      passing run of IDEA-20260922-f7de2a. That belief is withdrawn.
    - >-
      An unfinished matrix is entered as a large increment. That series
      is void.
  confounders:
    - Backtracking, which confounds lag-1 autocorrelation with the inverse step.
    - Changing ell, the cap, or the monomial order along the walk.
    - Coding an unfinished rung as a high degree.
    - Calling every step vertical because the conductor was not computed.
    - A walk that stays on one volcano level and is then used to support reading B.
  interpretation_limits:
    - Toy tier only. The minimal test uses a class small enough that levels are known. A large-class walk uses the same statistic and still asserts nothing at cryptographic size.
    - >-
      d_lf_obs is not the last-fall degree and not the solving degree.
      A flat increment inside the cap does not prove the degree stays
      small above the cap.
    - >-
      ECDLP time exponent stays N^{1/2} and rho memory stays O(1). The
      walk is uncharged until an accepted outlier exists. This proposal
      does not produce one.
    - Reading A and reading B are complete results. They are not failed attacks.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A non-backtracking walk of length at least c times the log of the
        number of j-invariants in the class, for a frozen c recorded
        before the run, is far enough that the lag-1 autocorrelation of a
        function of a uniform random vertex is consistent with zero at the
        threshold 2 over the square root of the number of pairs. The
        ordinary isogeny graph is not assumed to be an expander. Vertical
        steps are assumed to change conductor in a way the level function
        detects.
      rigorous_support: >-
        none for this graph. H1 imitates the bound that a non-backtracking
        walk on a regular expander is close to uniform after O(log |V|)
        steps. That bound is recalled and was not opened. The volcano
        stratification is recalled from Kohel and was not opened.
      validation_plan: >-
        On one toy class with a known volcano of at least two levels,
        compare the lag at which the level function's autocorrelation
        falls to the threshold with c log |Cl|, and compare that lag with
        the lag of the degree increment. Parameters recorded: field order,
        ell, t=4, rungs n=1 and n=2, cap, c, and |Cl|. If the level
        function is already at the threshold in fewer steps than the
        depth, H1 is the wrong mixing model on that class and reading A
        is not interpreted as mixing. Tail check: a lag computed from
        fewer than 8 pairs is unmeasured. No transfer to a cryptographic
        class number.
    - id: H2
      statement: >-
        Inside the frozen cap, the rung increment of d_lf_obs tracks
        whether the chained system's consequences keep appearing at higher
        degree as n goes from 1 to 2. This is not the Petit-Quisquater
        first-fall assumption. An increment of 0 does not prove the
        solving degree is small above the cap.
      rigorous_support: >-
        none. It imitates the rank identity of IDEA-20260916-4b7c1e, which
        says a positive new_falls(D) is a new low-degree consequence at
        degree D, and it does not imitate a theorem equating the capped
        increment with the solving degree.
      validation_plan: >-
        At the start vertex, if a degree-by-degree elimination finishes
        at both rungs inside the cap, compare its degree increment with
        the d_lf_obs increment. A disagreement of at least 1 falsifies H2
        on that vertex. Parameters: one toy vertex, t=4, n=1 and n=2.
        Tail check: new_falls(D) = 0 on the capped range is not rewritten
        as new_falls(D) = 0 above the cap.
  target_complexity:
    time_exponent: >-
      N^{1/2} for the ECDLP, Pollard rho. No improvement is claimed.
    memory_exponent: >-
      O(1) for rho. Each measured vertex stores two capped Macaulay
      matrices.
    best_known: Pollard rho, time N^{1/2}, memory O(1), for the ECDLP.
    hidden_overhead: >-
      No attack exponent is claimed. The walk is uncharged until an
      accepted outlier exists, and this idea does not accept one.
    tradeoff_note: >-
      Vertices are independent given the walk. This is not a van
      Oorschot-Wiener tradeoff and it does not change rho.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time (N^{1/2}), memory
    (O(1)), and queries (one instance). No attack is claimed. As an
    instrument, the opened sibling proposals were checked. The class-wide
    census IDEA-20260922-805a59 dominates this walk whenever the census
    finishes, because a finished census determines every autocorrelation
    the walk could estimate. When the census does not finish, that
    dominance does not apply, and none of the other opened rows estimates
    this autocorrelation. Published mixing theorems were not opened, so
    they are not cited as dominating rows.
  sota_delta: >-
    ECDLP time-exponent delta 0 (remains 1/2). ECDLP memory-exponent
    delta 0. Query delta 0. The walk adds sampled increments and no
    attack cost.
  discriminated_from:
    - >-
      IDEA-20260922-805a59 enumerates a class and compares new_falls
      vectors. This record runs only when that census is not the dataset,
      and it reports an autocorrelation rather than a vector.
    - >-
      IDEA-20260922-221a70 compares a rebuilt system with a Vélu pullback
      on one edge. This record uses native systems at each vertex and
      does not pull a system back.
    - >-
      IDEA-20260922-fac3e7 compares one special-model curve with one
      generic classmate. This record does not single out a locus.
    - >-
      IDEA-20260922-f7de2a is the acceptance test for a real gap. This
      record does not run that test. Horizontal-only persistence waits
      for it.
    - >-
      IDEA-20260922-f1e5b7 censuses the same style of rung increment on
      one enumerated F_4 class. This record asks whether that increment
      is autocorrelated along a walk, which the census does not ask.
    - >-
      IDEA-20260922-9d808c tests rank profiles under linear substitutions.
      This record does not vary coordinates inside one ideal.
    - >-
      IDEA-20260922-881df9 attributes a gap to the class, the trace, or
      the support. This record attributes persistence to vertical steps
      or withdraws it. Different arms.
    - >-
      IDEA-20260922-469f79 compares a graph ideal with a native ideal.
      No graph ideal is built here.
    - >-
      IDEA-20260807-f6137c records that there is no true d_reg meter.
      The proxy here is a capped increment of d_lf_obs, not that meter.
    - >-
      IDEA-20260916-4b7c1e defines new_falls and d_lf_obs. This record
      uses the increment of d_lf_obs and does not redefine it.
    - >-
      IDEA-20260731-016 looks for a heavy-tailed rare endpoint inside an
      enumerated class. This record says a rare endpoint is not locally
      detectable when reading A holds, and it does not search for one.
