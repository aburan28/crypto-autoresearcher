  title: |-
    Rotation-class factor base control - multiplication by 2 is a bit rotation for Mersenne p and acts on nothing in E
  class: control
  claim: |-
    Pr[P + Q in D_rot | P, Q in D_rot] = |D_rot| / p within sampling error for m in {1, 2, 4, 8}, and the fraction of random targets decomposing over D_rot x D_rot equals the random-subset value; no gain at any (c, m).
  mechanism: |-
    For p = 2^c - 1, F_p = Z[x]/(x^c - 1, p) with x -> 2, and multiplication by 2 is a cyclic rotation of the c-bit representation: a cost-free Z/c action on coordinates. The scaling (x, y) -> (2x, 2^(3/2) y) maps E_(a,b) to the isomorphic E_(4a,8b) and the isomorphism back is the inverse scaling, so the action composes to the identity on E and respects nothing of the group law (HEUR-002 of H-ECDLP-bd1572). The factor base D_rot = {P : rotation-minimal representative of x(P) < 2^(c - m)} has size about p / 2^m and is a cheaply decidable candidate; the expected closure ratio is 1.
  novelty_status: known
  citations:
  - ref: KN-LIT-3833
    source_text: Granger-Scott 2015 Faster ECC over 2^521 - 1
    provenance: kb
    claim: |-
      P-521 arithmetic exploits the Mersenne form of the modulus; the form of p is a field-arithmetic fact, not a curve-structure fact
