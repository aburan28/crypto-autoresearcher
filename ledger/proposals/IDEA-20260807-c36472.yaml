idea:
  id: IDEA-20260807-c36472
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    THE T5 REACHABILITY GATE, RE-COSTED AND THEN MEASURED: transporting a
    specified class member is AFFORDABLE at Otilde(p^{1/4}), so T5 does not die
    on transport cost as DECOMPOSITION.md states -- it dies on IDENTIFICATION,
    which costs h ~ p^{1/2} functional evaluations unless goodness is common,
    locally detectable during an isogeny walk, or predictable from a cheap
    vertex invariant; and the decisive measurement is the one-step
    autocorrelation of every candidate functional along an ell-isogeny walk
  class: algorithm

  claim: >-
    (A) THE CORRECTION TO THE COST ACCOUNTING, AND IT CHANGES THE LANE'S
    CONCLUSION. DECOMPOSITION.md T5 states that reaching a SPECIFIED curve is
    the vectorization problem, "hard, ~sqrt(h) ~ p^{1/4} classically at best",
    and concludes "the lane dies on cost even if the variance is large". The
    second clause does not follow from the first. The baseline this campaign
    charges against is 0.886 sqrt(N) ~ p^{1/2} group operations (KN-TECH-001,
    KN-TECH-006). A transport cost of Otilde(p^{1/4}) is a SQUARE ROOT OF THE
    BASELINE -- asymptotically free. An attacker who knows the address of a good
    curve can pay p^{1/4} to get there and still be within o(1) of whatever the
    destination costs. THE TRANSPORT COST IS NOT THE BARRIER.

    (B) WHERE THE BARRIER ACTUALLY IS. The F_p-isogeny class has
    h ~ H(t^2 - 4p) ~ sqrt(|D|) ~ p^{1/2} members (the Kronecker class number).
    To find the MINIMISER of a cost functional C over the class by brute force
    costs h evaluations of C, i.e. at least p^{1/2} times the cost of one
    evaluation -- already at or above the rho baseline before a single relation
    is collected. So the live question is not "can I get there" but "can I FIND
    WHICH ONE without enumerating them all". Three escape routes exist and only
    three:
      (R-common) GOODNESS IS COMMON: a constant fraction of the class is within
        epsilon of the minimum. Then a random walk of O(log p) small-ell steps
        (rapid mixing of the Cl(O)-Cayley graph under GRH) lands on a good curve
        with constant probability, and the total cost is polylog.
      (R-local) GOODNESS IS LOCALLY DETECTABLE: C(E') is predictable from data
        computable at the current vertex in time polylog(p) -- e.g. from the
        number of rational ell-isogenies (the volcano level), the rational
        torsion structure, or C(E) itself plus the step. Then hill-climbing
        works and costs (walk length) x (local test).
      (R-address) GOODNESS HAS A CLOSED-FORM ADDRESS: the good curve is
        identifiable a priori, e.g. j = 0 when D_0 = -3. Then transport at
        Otilde(p^{1/4}) suffices and the gate is PASSED.
    If none of the three holds, the minimiser is unreachable and the lane dies
    -- on identification, not on transport.

    (C) THE FOURTH DIRECTION, WHICH IS FREE AND WHICH THE DECOMPOSITION DOES NOT
    LIST. The reachable set is not only the isogeny class. Applying an
    F_p-ISOMORPHISM costs O(log p) field operations: (a, b) -> (u^4 a, u^6 b)
    with (x, y) -> (u^2 x, u^3 y). This moves the coordinate-defined factor base
    by a dilation X_E -> u^2 X_E (IDEA-20260807-6eb96b) while changing nothing
    the class fixes. So THE GAUGE ORBIT IS REACHABLE AT ZERO COST and, unlike
    the class, needs no isogeny at all. If any cost functional's variance lives
    in the gauge direction, its minimiser is trivially reachable and T5 is
    irrelevant. This record therefore costs BOTH directions.

    (D) THE CEILING ON GAUGE OPTIMISATION, DERIVED BEFORE MEASUREMENT. For a
    window factor base X_E cap [0, W), the gauge orbit realises the counts
    |X_E cap u^{-2}[0, W)| over (p-1)/2 dilates. Each is W/2 + O(sqrt(p) log p)
    by Weil. Modelling the dilates as independent centred draws of scale
    sqrt(W)/2 gives a maximum of W/2 + sqrt(W log p / 2) (1 + o(1)), so the best
    achievable relative gain in factor-base size is
        1 + sqrt(2 log p / W) (1 + o(1)) -> 1,
    i.e. SUBCONSTANT, vanishing as W grows. And the SEARCH for the best dilate
    costs one multiplicative convolution over F_p^*, O(p log p) by FFT, which is
    p^{1/2} times the rho baseline. So gauge optimisation is doubly dominated:
    the prize vanishes and the search costs more than the attack. That is a
    quantitative closure of direction (C), stated before any run, and the
    experiment's job is to test whether the observed maximum matches the
    prediction (no structure) or exceeds it (structure in the dilation orbit,
    which would be the one interesting outcome and would connect to the
    multiplicative-energy questions in KN-TECH-016).

    (E) THE DECISIVE MEASUREMENT FOR (R-local), WHICH IS CHEAP AND WHICH NOBODY
    HAS RUN. Define, for a candidate functional C and a small prime ell, the
    ONE-STEP AUTOCORRELATION
        rho_ell(C) = corr( C(E), C(E') ) over F_p-rational ell-isogenies
                     phi : E -> E' inside one class.
    Hill-climbing is possible only if rho_ell is materially positive, or if some
    cheap vertex statistic predicts C. Three outcomes, all meaningful:
      rho_ell ~ 1: C is essentially constant along the walk -- consistent with
        class invariance (the L1 closure branch), and the walk buys nothing
        because there is nothing to climb.
      rho_ell ~ 0 with Var(C) > 0: C varies but is UNPREDICTABLE one step ahead.
        Then the class is a rugged landscape with no gradient, (R-local) fails,
        and the only surviving route is (R-common) -- which is then tested
        directly by asking what fraction of members lie within epsilon of the
        minimum.
      rho_ell materially positive with Var(C) > 0: a GRADIENT EXISTS.
        Hill-climbing is viable and the campaign has a target. This is the only
        branch in which L1 produces something an attacker could use, and it is
        the branch this measurement exists to detect.

  resource_label: >-
    R4 (the isogeny graph and the class-group action: the walk moves between
    curves, which is invisible to any oracle acting on G) + R2 (the curve
    equation, which is what the functional reads at each vertex).
  admissibility: admissible
  admissibility_argument: >-
    Walking the ell-isogeny graph changes the CURVE, not the points of G; a
    generic-group algorithm has no way to produce a different curve equation
    because the equation is not among its oracle outputs. This is exactly the
    R4 line of DECOMPOSITION.md section 2 and it escapes KN-FIND-b7e091, whose
    closed oracles (incidence, endomorphism-image) return group elements. It
    also escapes H-ENDO-001, which says every endomorphism acts on G as a
    scalar: true, and irrelevant here, because nothing in this record applies an
    endomorphism to a point of G in order to gain information. The instance is
    transported by T1 solely so that the SAME k can be attacked on a different
    equation. CAVEAT RECORDED HONESTLY: admissibility of the resource does not
    make the direction useful; (D) closes the free direction quantitatively and
    (B) shows the expensive direction is gated on identification.

  discriminated_from:
    - >-
      DECOMPOSITION.md T5 itself. This record does not restate T5; it CORRECTS
      its cost conclusion (transport at p^{1/4} against a p^{1/2} baseline is
      affordable, so "the lane dies on cost" is not supported by the p^{1/4}
      figure) and relocates the barrier to identification over h ~ p^{1/2}
      members. The correction makes the gate HARDER to pass in a different place
      and easier in the place T5 named, which is why it must be recorded rather
      than assumed.
    - >-
      RQ-VOLC-f6253b / L2, which asks whether volcano level changes anything
      measurable. This record does not measure level effects; it asks whether
      ANY functional has a usable GRADIENT along the walk, and it treats level
      as one candidate local predictor among several. If L2 finds a level
      effect, this record's (R-local) route is how that effect would become
      exploitable -- the two are complementary, not duplicative.
    - >-
      RQ-CLGP-b99df5 / L10, which asks for a reduction between Cl(O)-
      vectorization and ECDLP. This record needs no such reduction: it uses the
      class-group action only as a walk, and it charges the standard cost for
      finding a specified target rather than claiming a new algorithm for it.
    - >-
      KN-TECH-027 (CSIDH) and KN-TECH-029/KN-TECH-058 (supersingular
      path-finding). Those concern supersingular graphs over F_p^2 and the
      F_p-rational subgraph. The object here is the ORDINARY F_p-isogeny class
      with commutative End, whose crater is a Cl(O)-torsor; the p^{1/4} figure
      is quoted by the class-number-plus-collision-search accounting, not
      relayed from those entries, and its exact ordinary-case citation is marked
      [open].

  object_first_candidate:
    tracked_object: >-
      THE WALK TRAJECTORY of a cost functional: the sequence
      C(E_0), C(E_1), C(E_2), ... along a random ell-isogeny walk inside one
      F_p-isogeny class, together with the cheap vertex statistics
      (number of rational ell-isogenies, rational torsion structure, root count
      of f) computable at each step.
    lossiness: >-
      GENUINELY LOSSY. The trajectory forgets the curve equations, the
      j-invariants, the ideal classes, and the isogenies themselves; it retains
      one real number per vertex plus a handful of small integers. LOSSY-
      PROJECTION TEST APPLIED: what is discarded -- the global address of the
      vertex in Cl(O) -- is discarded COMPATIBLY with the operation the attacker
      can actually perform, because an attacker walking the graph likewise does
      not know its address; the retained part (the local value and its local
      predictors) is exactly what propagates deterministically under one
      isogeny step. A projection retaining the address would be a change of
      coordinates on Cl(O) and would smuggle in the very thing whose cost is at
      issue.
    propagation: >-
      One step of the walk is a well-defined map on curves; what is NOT defined
      is a map on the tracked value, and that is the whole question. If C(E')
      is determined by (C(E), ell, direction), the object propagates
      deterministically and hill-climbing works. If not, the object is a
      martingale-like sequence with no gradient. The measurement rho_ell(C) is
      precisely a test of which.
    survival_score: >-
      Survives changes of ell, of functional, and of starting vertex. Dies at
      the crater boundary (a walk that descends to the floor of an ell-volcano
      cannot continue in that ell), dies when the class is too small for a walk
      to mix (toy p), and dies if the functional is not defined at every vertex
      -- e.g. anything requiring a rational point of a specific order.

  mechanism: >-
    STEP 1 -- THE COST ACCOUNTING, ZERO COMPUTE, WRITTEN FIRST. Tabulate, for
    the ordinary F_p case: class size h ~ sqrt(|D|) ~ p^{1/2}; cost of one
    small-ell step (Velu on a rational ell-torsion kernel found from the
    division polynomial) as poly(ell, log p); cost of a uniformly random class
    member as O(log p) steps under GRH-conditional rapid mixing of the Cl(O)
    Cayley graph; cost of a SPECIFIED class member as Otilde(sqrt(h)) =
    Otilde(p^{1/4}) group-action evaluations by collision search, marked
    [open] pending re-verification against the archived primary source at
    inputs/ECTD-TESKE-20260731/sources/galbraith-iso.pdf; cost of the gauge
    orbit as O(log p) per element and O(p log p) to optimise over it by FFT.
    Compare every row against 0.886 sqrt(N). This table is the deliverable even
    if every measurement below returns null.

    STEP 2 -- BUILD THE WALK AT TOY SCALE. At p in [2^12, 2^14], enumerate a
    complete class (as in IDEA-20260807-0ff796 Step 2). For small ell in
    {2, 3, 5, 7}, build the ell-isogeny graph on the class by evaluating the
    classical modular polynomial Phi_ell(j, j') over F_p, or -- to avoid
    depending on stored modular polynomials -- by directly computing rational
    ell-isogenies with Velu from kernels obtained by factoring the ell-division
    polynomial. Both routes are pure-Python feasible at these p; the second is
    slower but self-contained and is the fallback.

    STEP 3 -- MEASURE rho_ell(C) FOR EVERY CANDIDATE FUNCTIONAL. Candidates:
    window relation yield; window solving-degree proxy from
    harness/semaev.py (Groebner basis size and maximum total degree, labelled as
    implementation-bound proxies exactly as that module requires); first-fall
    proxy; the H-PSEUDO flatness constant at a window
    (IDEA-20260807-692e9b); the rational-2-torsion stratum
    (IDEA-20260807-0a3272). For each, compute the Pearson and Spearman
    correlation of C over all rational ell-isogeny edges of the class, with the
    edge set enumerated exhaustively rather than sampled.

    STEP 4 -- MEASURE (R-common) DIRECTLY. For each functional, compute the full
    within-class distribution and report the fraction of members within epsilon
    of the minimum for epsilon in {1%, 5%, 10%} of the class range. If that
    fraction is a constant bounded away from zero and the class range itself is
    bounded away from zero after the gauge correction, (R-common) holds and a
    random walk suffices. This is a distribution question, not a search
    question, and it is answered by the same enumeration.

    STEP 5 -- MEASURE (R-local) BEYOND AUTOCORRELATION. Regress C on the cheap
    vertex statistics: number of rational ell-isogenies at the vertex (the
    volcano level indicator), #E[2](F_p), #E[3](F_p), the group structure
    invariant n_1 in E(F_p) ~= Z/n_1 x Z/n_2, and the root count of f. Report
    R^2. A local predictor with R^2 above 0.3 that is computable in polylog(p)
    is a PASSED (R-local) gate for that functional.

    STEP 6 -- THE GAUGE CEILING TEST. For >= 30 curves, compute the exact
    distribution of |X_E cap u^{-2}[0,W)| over ALL u by one multiplicative
    convolution (O(p log p) FFT), and compare the observed maximum against the
    derived prediction W/2 + sqrt(W log p / 2). Report the ratio. This is the
    forced-value check for direction (C) and it either confirms the closure in
    (D) or exposes structure.

    STEP 7 -- TRANSPORT CERTIFICATES THROUGHOUT. Every isogeny used must come
    with the re-verifiable certificate that the transported instance still
    satisfies Q' = [k] P' and that deg(phi) is coprime to N, checked
    independently in harness/toycurve.py. A transport that fails is an
    infrastructure failure under AGENTS.md rule 5.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07: pattern
      "Galbraith|Stolbunov|vectorization|p\\^\\{1/4\\}|isogeny path"
      (case-insensitive) over knowledge/; pattern "isogeny class" over the
      repository. Targeted reads of DECOMPOSITION.md T5, KN-OPEN-013,
      KN-TECH-027, KN-TECH-029, KN-TECH-050, KN-TECH-058, RQ-CLGP-b99df5,
      RQ-VOLC-f6253b.
    results: >-
      The p^{1/4} figure appears in KN-TECH-029 (Delfs-Galbraith, F_p-rational
      subgraph), KN-TECH-025, KN-TECH-050 and KN-OPEN-013 -- all for the
      SUPERSINGULAR problem, and KN-TECH-058 explicitly records the F_p figure
      as "contested across retrievals". No corpus record states the ORDINARY
      F_p-isogeny-class figure, and no record anywhere compares a transport cost
      against the ECDLP baseline to ask whether transport is affordable. Zero
      hits for any autocorrelation-along-an-isogeny-walk measurement. Zero hits
      for the gauge orbit as a reachable direction.
    verdict: >-
      ADAPTATION, with one genuinely new element. The p^{1/4}/h^{1/2} accounting
      is standard and is claimed as nothing else. What is new to this program is
      (i) the observation that this cost is BELOW the baseline it is being
      charged against, which reverses DECOMPOSITION.md T5's conclusion about
      where the lane dies, and (ii) the one-step autocorrelation rho_ell(C) as
      the decisive, cheap operationalisation of "locally detectable". The
      external literature has certainly studied isogeny-walk mixing; it is not
      known to this record whether anyone has measured the autocorrelation of an
      ECDLP cost functional along such a walk, and a Stage 0 check is required
      before any novelty language appears in a write-up.

  null_object_control: >-
    MANDATORY. THE MATCHED NULL FOR rho_ell IS A RANDOM REWIRING: keep the same
    class, the same multiset of C-values, and the same edge COUNT, but rewire
    the ell-isogeny edges uniformly at random. rho_ell on the rewired graph is
    the null distribution and it is a GENERATED comparator, so it is drawn
    >= 16 times and reported as an interval, never as a point (KN-TECH-1a5b7e
    mode 5). DECAY PARAMETER: the walk length. A genuine local gradient must
    DECAY with the number of steps -- corr(C(E_0), C(E_s)) must fall toward the
    rewired null as s grows, at a rate consistent with the mixing time. A
    correlation that does NOT decay with s is measuring a global property of the
    class (or a bug in the enumeration), not a local gradient, and is the
    canonical artifact tell. SECOND NULL, for Step 6: the observed maximum over
    dilates against the derived W/2 + sqrt(W log p / 2), with both arms scored
    against the reference model rather than against each other. THIRD NULL, for
    Step 5: regress C on a RANDOM permutation of the vertex statistics; the
    R^2 obtained there is the floor any claimed predictor must clear.

  assumptions:
    - >-
      [fact] T1 transport: an F_p-isogeny of degree coprime to N carries
      (E, P, Q, k) to (E', phi(P), phi(Q), k). Elementary; re-verified per
      transport by certificate.
    - >-
      [fact] The F_p-isogeny class has h = H(t^2 - 4p) members, the Kronecker
      class number, which is ~ sqrt(|D|) ~ p^{1/2} up to log factors.
    - >-
      [open] The Otilde(p^{1/4}) cost of finding a connecting isogeny between
      two SPECIFIED ordinary curves in one class. Carried here as the
      class-number-plus-collision-search accounting sqrt(h) ~ p^{1/4}, NOT as a
      relayed abstract. The exact ordinary-case reference must be re-read at
      inputs/ECTD-TESKE-20260731/sources/galbraith-iso.pdf and cited precisely
      before this figure appears in any write-up, and KN-TECH-058's warning that
      the corpus's F_p figures are contested applies.
    - >-
      [open, GRH-conditional] Rapid mixing of the Cl(O) Cayley graph on small-
      ell generators, which is what makes a UNIFORMLY RANDOM class member cost
      O(log p) steps. Cited, not proved, exactly as DECOMPOSITION.md T5 does.
    - >-
      [scope] At toy p the class has only tens of members, so "mixing time" and
      "autocorrelation decay" are measured on a graph too small to exhibit
      asymptotic behaviour. This is a real limit on Step 3 and is reported with
      every correlation, never hidden.

  proof_search_map:
    bottleneck: >-
      The IDENTIFICATION step: choosing which of the h ~ p^{1/2} class members
      to transport to. Every other cost in the accounting is polylog or
      p^{1/4}. If identification cannot be done in less than h evaluations, the
      whole direction is dominated regardless of how large the within-class
      variance is. That single step is what (R-common), (R-local) and
      (R-address) exist to bypass, and it is the exact step whose removal would
      change the conclusion.
    baseline_embedding:
      parameter_slice: >-
        The zero-step slice: the walk of length 0, where the "reachable set" is
        the starting curve alone and the cost functional is measured exactly
        once. At that slice the accounting must reproduce the standing baseline
        of the campaign -- 0.886 sqrt(N) group operations with O(1) memory --
        with no discount whatsoever, because no curve has been changed.
      reproduction_check: >-
        Frozen regression fixture: run harness/rho.py on the starting instance
        and confirm the measured step count is consistent with 0.886 sqrt(N)
        within the expected variance of the rho distribution over >= 20 seeds,
        BEFORE any transported instance is timed. A transported instance that
        appears cheaper than this baseline triggers GOAL-ENDO-001 pause
        condition P3 and an independent review, not a claim.
    observation_collision:
      observable: >-
        The pair (Var(C) over the class, rho_ell(C)).
      distinct_preimage_search: >-
        REQUIRED. Find two DIFFERENT situations with the same observable: a
        class with genuine local structure, and a class where C is pure noise
        but the graph enumeration double-counts edges (which inflates rho_ell
        mechanically). The second is an apparatus artifact and it produces the
        same observable as the first. The rewiring null separates them, and
        running the rule on the rewired arm FIRST is the mandated order.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Treat C along the walk as a potential function and ask whether the
          increments C(E_{i+1}) - C(E_i) telescope -- i.e. whether the total
          change over a path depends only on its endpoints. If they do, C is a
          function of the ideal class alone and hill-climbing is a shortest-path
          problem in Cl(O); if they do not, C has a genuine local component.
        predicted_gain: >-
          Converts "is goodness locally detectable" from a vague question into a
          path-independence test that is decided by comparing two paths between
          the same endpoints -- a check with an exact answer at toy scale.
      - transform: representation_reduction
        proposed_object: >-
          Replace the search over the isogeny class by the search over the gauge
          orbit, which is free to traverse. The transform succeeds only if the
          functional's variance lives in the gauge direction.
        predicted_gain: >-
          If it succeeded, T5 would be bypassed entirely. (D) derives that the
          prize is subconstant, 1 + sqrt(2 log p / W), so the transform is
          predicted to FAIL quantitatively, and that prediction is the record's
          own falsifier.
    quantifier_order: >-
      The claim being tested: EXISTS a cost functional C and EXISTS a constant
      c > 0 such that FORALL sufficiently large p, FORALL ordinary classes at
      that p, the minimiser of C over the class is reachable in time
      p^{1/4 + o(1)} AND satisfies C(min) <= (1 - c) C(typical). The dangerous
      weaker reading, NOT claimed: FORALL p EXISTS a good curve -- which is
      trivially true and useless, since existence without identification costs
      h. The audit obligation is that every reported reachability verdict names
      whether it establishes existence or identification; they are different
      quantifiers and the lane's whole conclusion turns on which.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At toy scale, for these functionals, on these classes, the one-step
        autocorrelation along ell-isogeny edges is [value] against a rewired
        null of [interval], and the fraction of members within 5% of the minimum
        is [value]." It can NEVER certify that no local predictor exists -- only
        that the ones tested do not predict. A negative here is a statement
        about a named finite list of predictors and must say so.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE DESIRED CONCLUSION FAILS: the volcano
        LEVEL itself, which IS locally detectable (count rational ell-isogenies
        at the vertex: 1, 2 or ell+1) and IS class-varying. If the pipeline
        reports rho_ell ~ 0 for the level indicator, the pipeline is broken,
        because level is strongly autocorrelated along a walk by construction.
        This control must PASS before any functional's rho_ell is believed.
    proof_obligations:
      - claim: h ~ p^{1/2} for the ordinary F_p-isogeny class.
        responsibility: size
      - claim: Transport of a specified member costs Otilde(p^{1/4}).
        responsibility: runtime
      - claim: A uniformly random member costs O(log p) steps under GRH.
        responsibility: runtime
      - claim: Gauge optimisation gains at most 1 + sqrt(2 log p / W).
        responsibility: strictness
      - claim: The volcano-level control shows strong autocorrelation.
        responsibility: interface
      - claim: Every transported instance carries a re-verified certificate.
        responsibility: correctness

  predictions:
    - metric: >-
        rho_ell(C), the one-step autocorrelation of each candidate functional
        over all rational ell-isogeny edges of a complete toy class, against a
        16-draw rewired-graph null interval
      direction: different
      minimum_effect: >-
        PRE-REGISTERED: rho_ell is inside the rewired null interval for the
        yield and Groebner-proxy functionals (no gradient), and OUTSIDE it, high,
        for the volcano-level indicator (the positive control). Any functional
        whose rho_ell exceeds the null interval's upper end by more than the
        interval's own width is a (R-local) candidate and triggers Step 5.
    - metric: >-
        fraction of class members within 5% of the class minimum of C, after
        subtracting the gauge component
      direction: different
      minimum_effect: >-
        (R-common) is PASSED only if this fraction is >= 0.05 AND the class
        range exceeds the gauge range. Predicted outcome: the class range is
        comparable to the gauge range, so "within 5% of the minimum" is a
        statement about equation choice and (R-common) is vacuous. That
        prediction is recorded now so a match is a control, not a surprise.
    - metric: >-
        observed max over gauge dilates of |X_E cap u^{-2}[0,W)| divided by the
        derived W/2 + sqrt(W log p / 2)
      direction: different
      minimum_effect: >-
        Predicted ratio 1.00 +- 0.05, i.e. no structure. A ratio above 1.2,
        reproduced across >= 30 curves and >= 3 primes, would mean the dilation
        orbit of X_E is structured, which is a genuinely new observation about
        the multiplicative behaviour of the on-curve set and would be worth its
        own record.
    - metric: >-
        the cost table of Step 1: transport exponent versus baseline exponent
      direction: lower
      minimum_effect: >-
        Transport at 1/4 against a baseline at 1/2: a factor p^{1/4} of
        headroom. The deliverable is the table itself, and it is a zero-compute
        correction to DECOMPOSITION.md T5's stated conclusion.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, THE PRIMARY DELIVERABLE): write the Step 1 cost
      table with every row cited or marked [open], and state explicitly whether
      transport or identification is the binding constraint. This alone
      discharges the lane's obligation to address T5 and costs nothing.
      STAGE 1 (hours): build one complete toy class at p ~ 2^13 and its
      ell-isogeny graph for ell in {2, 3}; run the VOLCANO-LEVEL POSITIVE
      CONTROL -- rho_ell(level) must be high. If it is not, the graph
      construction is wrong and nothing else is measured.
      STAGE 2 (hours): measure rho_ell for every candidate functional against
      the 16-draw rewired null; report intervals.
      STAGE 3 (hours): the distribution question of Step 4 and the local-
      predictor regression of Step 5, each against its own null.
      STAGE 4 (~1 hour): the gauge-ceiling forced-value check of Step 6 by FFT.
      STAGE 5 (zero compute): assemble the verdict per functional as
      (R-common | R-local | R-address | UNREACHABLE), with the identification
      cost stated for each.
      Stage 0 is free and is the item to run first; Stage 1's positive control
      is the cheapest way to discover the instrument does not work.
    controls:
      - volcano-level indicator as a POSITIVE control for rho_ell -- BLOCKING
      - rewired-graph null, >= 16 draws, reported as an interval
      - random-permutation null for the local-predictor regression
      - derived forced value W/2 + sqrt(W log p / 2) for the gauge maximum
      - rho baseline reproduction on the untransported instance
      - transport certificates on every edge used
    required_metrics:
      - rho_ell per (functional, ell), Pearson and Spearman, with the rewired interval
      - correlation decay corr(C(E_0), C(E_s)) versus walk length s
      - class-range and gauge-range of every functional, side by side
      - fraction within 1%, 5%, 10% of the class minimum
      - R^2 of the local-predictor regression and of its permuted null
      - observed/derived ratio of the gauge maximum
      - the Step 1 cost table with every exponent and its citation status

  falsification_conditions:
    - >-
      The volcano-level positive control shows rho_ell near the rewired null.
      The isogeny graph is wrong; nothing is measured and no verdict is issued.
    - >-
      Some functional shows rho_ell far above the rewired null AND a correlation
      that does not decay with walk length. That combination is the artifact
      tell, not a discovery, and it points at a bug in edge enumeration.
    - >-
      The gauge maximum exceeds the derived prediction by more than 20%,
      reproducibly. Then (D)'s independence model is wrong, the derived ceiling
      is void, and the gauge direction must be re-costed from scratch.
    - >-
      A local predictor with R^2 > 0.3 computable in polylog(p) is found. This
      is the branch that FALSIFIES the record's own expectation, passes the
      (R-local) gate, and hands the campaign a target. It also triggers
      GOAL-ENDO-001 pause condition P3 before anything is written down as a
      speedup.
    - >-
      The class at reachable p is too small (< 20 members) for any correlation
      to have power. SCOPE limitation, reported as such; not evidence of
      unreachability.
    - >-
      The [open] p^{1/4} transport figure fails re-verification against the
      archived source. Then (A)'s correction to T5 is withdrawn and the record
      is superseded; the identification argument in (B) survives independently,
      because it does not use the transport exponent at all.

  confounders:
    - >-
      DOUBLE-COUNTED EDGES. An ell-isogeny and its dual are two edges but one
      relation; counting both inflates rho_ell mechanically. Edge multiplicity
      must be declared and the rewired null must match it exactly.
    - >-
      SMALL CLASSES. At p = 2^12, h may be under 20; correlations then have
      enormous error bars and the rewired null is nearly as wide as the range.
      Class size is reported beside every correlation.
    - >-
      GAUGE LEAKAGE. If each class member is measured at an arbitrary gauge
      representative, gauge variance enters the class arm and depresses rho_ell.
      Every vertex must be measured at a CANONICAL representative (e.g. the
      lexicographically least (a, b) in its orbit) or averaged over >= 8 gauge
      draws, and which convention was used must be recorded.
    - >-
      MIXED ell. Pooling 2-isogeny and 3-isogeny edges mixes two different
      volcano structures. Correlations are reported per ell.
    - >-
      SOLVER NOISE. The Groebner proxies from harness/semaev.py are
      implementation-bound (that module says so explicitly) and their run-to-run
      variance may exceed any class effect. Repeat measurements per vertex and
      report the within-vertex variance before any between-vertex correlation.

  interpretation_limits:
    - >-
      The cost table is an ACCOUNTING, not a measurement, and its p^{1/4} row is
      [open] pending source re-verification. It licenses no claim that any
      transport was performed at that cost.
    - >-
      A measured rho_ell near zero at toy scale does not prove no gradient
      exists at crypto scale; it establishes that, on classes of a few tens of
      members at p <= 2^14, these named functionals show no gradient above a
      rewired null.
    - >-
      Passing the (R-local) gate for some functional would establish
      reachability, NOT an attack. The functional would still have to be a real
      cost and its minimum would still have to be materially better -- both
      separate questions owned by other records.
    - >-
      Nothing here bears on H-ENDO-001 or KN-FIND-b7e091: no endomorphism is
      applied to any point of G, and no oracle is introduced.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The Cl(O)-Cayley graph on small split primes ell is a rapid mixer: a
        walk of O(log p) steps lands within total-variation distance o(1) of
        uniform on the class.
      rigorous_support: >-
        Rigorous under GRH via the standard expansion estimates for the
        class-group Cayley graph on small split primes; it imitates the
        classical result that the ideal classes of small norm generate and
        equidistribute. Cited, not proved here, exactly as DECOMPOSITION.md T5
        does, and used only to justify the (R-common) cost row.
      validation_plan: >-
        At toy p, measure the empirical total-variation distance from uniform
        after s steps by exhaustive enumeration of the class (feasible: h ~ 100)
        for s = 1..10, and compare against the exponential decay predicted by
        the second eigenvalue of the measured graph, which is computable exactly
        at this size. Tail check: the least-visited vertex after s steps against
        the uniform prediction. TOY SCALE ONLY -- a class of 100 vertices cannot
        validate an asymptotic mixing statement and the record says so.
    - id: H2
      statement: >-
        The counts |X_E cap u^{-2}[0, W)| over the (p-1)/2 dilates behave as
        independent draws of scale sqrt(W)/2, so their maximum is
        W/2 + sqrt(W log p / 2)(1 + o(1)).
      rigorous_support: >-
        The rigorous half is Weil: each dilate's count is W/2 + O(sqrt(p) log p),
        so no dilate deviates by more than the Weil scale. The heuristic half is
        independence across dilates, imitating the classical model that
        incomplete character sums over distinct dilations behave like
        independent centred sums. The two halves point in the same direction:
        both cap the achievable gain, and H2 is the sharper of the two whenever
        W = o(p log^2 p).
      validation_plan: >-
        Exact computation of the full dilate distribution for >= 30 curves at
        p in {2003, 4001, 8191, 16381} by one O(p log p) multiplicative
        convolution per curve; empirical CDF against the binomial prediction;
        explicit tail check of the observed maximum against
        W/2 + sqrt(W log p / 2). This is a distribution-level comparison against
        a stated prediction, not a single summary statistic. TOY SCALE, labelled.
    - id: H3
      statement: >-
        Finding a connecting F_p-isogeny between two specified ordinary curves
        of the same class costs Otilde(sqrt(h)) = Otilde(p^{1/4}) evaluations of
        the class-group action.
      rigorous_support: >-
        Collision search in a group of size h costs sqrt(h) under the standard
        birthday accounting; h ~ sqrt(|D|) ~ p^{1/2} by the class-number
        formula. The heuristic is that the walk behaves like a random function
        on Cl(O), which is the same assumption the rho baseline itself makes.
      validation_plan: >-
        At toy scale, measure the actual number of action evaluations needed to
        connect random pairs in a fully enumerated class, over >= 100 pairs and
        >= 3 primes, and fit the exponent against h^{1/2}. A fitted exponent
        materially above 1/2 refutes H3 at this scale and must be reported. This
        is toy scale and does NOT validate the asymptotic claim; the asymptotic
        row of the cost table stays [open] regardless of the fit.

  reachability_gate: >-
    THIS RECORD IS THE REACHABILITY GATE. Its verdict per functional is one of:
    R-ADDRESS (the good curve has a closed-form address, e.g. j = 0 when
    D_0 = -3; transport at Otilde(p^{1/4}) suffices; GATE PASSED, and note that
    this is the branch IDEA-20260807-8b9486 lands in); R-COMMON (a constant
    fraction of the class is good; a polylog random walk suffices; GATE PASSED);
    R-LOCAL (a polylog-computable vertex statistic predicts C; hill-climbing
    works; GATE PASSED); R-GAUGE (the variance is in the free isomorphism
    direction; no isogeny needed at all; GATE PASSED but the prize is bounded by
    (D) at 1 + sqrt(2 log p / W), which is subconstant); or UNREACHABLE
    (identification costs h ~ p^{1/2} functional evaluations, which is at or
    above the 0.886 sqrt(N) baseline before a single relation is collected; GATE
    FAILED, with identification named as the obstruction rather than transport).
    The pre-registered expectation is UNREACHABLE for the yield and Groebner
    functionals, R-ADDRESS with a constant-factor prize for the j = 0 / j = 1728
    case, and R-GAUGE with a subconstant prize for the window functionals.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED, and the record's central content
      is precisely a cost accounting that explains why. If a functional passed
      the gate with a constant-factor prize c, the attack exponent would remain
      1/2 and only the constant would move -- which by KN-TECH-018's standard is
      baseline calibration, not an attack. An EXPONENT would require the class
      minimum to beat the typical value by a factor growing with p, which no
      mechanism in this record proposes and which the derived ceiling in (D)
      excludes for the gauge direction.
    memory_exponent: >-
      The measurement needs O(p) for character tables and O(h) for the class
      graph -- kilobytes at toy scale. A hypothetical attack using this
      direction would inherit rho's O(1) memory plus whatever the destination
      functional needs; no memory-heavy step is introduced.
    best_known: >-
      0.886 sqrt(N) group operations at O(1) memory with linear parallel
      speedup (KN-TECH-001, KN-TECH-006), including the negation discount
      (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031). The
      transport-cost comparison is against exactly these.
    hidden_overhead: >-
      Two places. First, the Otilde in Otilde(p^{1/4}) hides the cost of one
      class-group action evaluation, which is poly(ell, log p) per step and is
      not negligible in practice. Second, and larger, "identification" hides an
      entire functional evaluation per candidate curve -- if evaluating C costs
      p^{1/2} itself, then even a free identification oracle would not help.
      Both are stated in the cost table rather than absorbed into o(1).
    tradeoff_note: >-
      Time-memory: none introduced; the walk is O(1) memory. Parallelisation:
      identification over h members is embarrassingly parallel, which is exactly
      why quoting a serial identification cost would understate the danger -- so
      the table reports identification in TOTAL WORK, not wall clock, and
      compares it against rho's total work rather than against parallel rho's
      wall clock.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. (i) Parallel Pollard rho with
    distinguished points: 0.886 sqrt(N) total group operations, O(1) memory per
    processor, linear parallel speedup (KN-TECH-001, KN-TECH-006). (ii) The
    automorphism-discounted variant on CM curves: the same exponent with a
    constant at most sqrt(6) (KN-TECH-018). (iii) BSGS: sqrt(N) time and memory
    (KN-TECH-031). This record proposes NO attack, so it is dominated by all
    three on time and by (i)/(ii) on memory. The IDENTIFICATION step it costs is
    itself dominated: h ~ p^{1/2} functional evaluations is already >= the rho
    total work before any relation is collected, which is the record's own
    central finding. dominated_by is NOT null and was not left null.
  sota_delta: >-
    Zero speedup against any attack baseline. Two quantitative deltas, both to
    the campaign's own accounting rather than to the state of the art:
    (1) It relocates the T5 barrier: transport of a SPECIFIED class member costs
    Otilde(p^{1/4}) [open] against a p^{1/2} baseline -- a headroom factor of
    p^{1/4} -- so the barrier is IDENTIFICATION over h ~ p^{1/2} members, not
    transport. DECOMPOSITION.md T5 attributes the death of the lane to transport
    cost; on this accounting that attribution is unsupported and the correct
    obstruction has a different name.
    (2) It derives a ceiling on the free (gauge) direction: the best achievable
    relative gain in window factor-base size over all (p-1)/2 isomorphism
    representatives is 1 + sqrt(2 log p / W)(1 + o(1)), which tends to 1, while
    the search for the optimal representative costs O(p log p) = p^{1/2} times
    the baseline. Both numbers are derived before measurement and both are
    testable.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the Stage 0 cost table survives review as written, except for the
    [open] p^{1/4} row, which I put at 0.7 to survive source re-verification in
    the exact ordinary-F_p form. 0.9 that the volcano-level positive control
    passes and the instrument is fit. 0.15 that any functional shows rho_ell
    materially above the rewired null -- the pre-registered expectation is a
    rugged, gradientless landscape, and that expectation is what makes a
    positive worth acting on. 0.85 that the gauge-ceiling ratio comes in at
    1.00 +- 0.05, confirming (D). Overall: the most likely honest headline is
    "the T5 barrier is identification, not transport; no tested functional has a
    local gradient; the free direction's prize is subconstant" -- a closure with
    a named obstruction, and a different obstruction from the one the
    decomposition named.

