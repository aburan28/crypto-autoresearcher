  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-06'

  title: >-
    THE BOREL CEILING AS A DERIVATION: for a random-function walk with a
    uniform distinguishing rule of expected walk length W, prove (as a
    checkable derivation artifact, never "proved") that the top-T basins
    cover C_max(a) = erfc(sqrt(x*/2)) with a = T W^2/N, that the DPs of m
    random walks cover 1 - (1 + 2 m W^2/N)^{-1/2}, and that the oracle
    online cost at T = N^{1/3} is minimised near a = 1/4 at about
    1.28 N^{1/3} -- so that every selection-rule proposal on this question
    has a stated constant-factor ceiling of about 1.9 in T at fixed L, and
    the Bernstein-Lange constant 1.77 decomposes into oracle 1.28 times an
    estimation-and-cap loss of about 1.38 at T_gen/T = 2
  class: mechanism

  claim: >-
    (A) STATEMENTS TO DERIVE (single-responsibility lemmas, Part B of
    docs/target-result-profile.md). Let f be a uniformly random function on
    a set of size N and let each point be marked independently with
    probability theta = 1/W, W <= N^{1/3}. Define basins as in
    IDEA-20260906-aed829.
      LEMMA 1 (partition). Basins of distinct marked points are disjoint;
      their union is the set of points whose forward orbit meets a marked
      point; the complement (mark-free cycles and their trees) has expected
      mass O(W/sqrt(N)) * N ... to be made precise, and is o(N) for W <= N^{1/3}.
      LEMMA 2 (size law). The basin size of a uniformly random marked point
      is distributed as the total progeny of a Galton-Watson process with
      Poisson(1 - theta) offspring, i.e. Borel(1 - theta), up to a total-
      variation error that vanishes as N -> infinity at fixed theta and
      also along theta = N^{-1/3}. [Rigorous via Poisson approximation of
      in-degrees and the tree-exploration coupling; the one step that needs
      care is the N-dependence.]
      LEMMA 3 (size-biased sampling). A uniformly random point lies in a
      basin of size n with probability n P(n) / E[n]; the expected number
      of m independent uniform starts landing in a given basin of size n is
      m n / N. [Exact given Lemma 1.]
      LEMMA 4 (unselected law). The expected coverage of the union of basins
      hit by m independent uniform starts is
      1 - (1 + 2 a_m)^{-1/2} + O(theta), a_m = m W^2/N, by integrating
      (1 - e^{-m n/N}) n P(n) with the Borel asymptotic
      P(n) = (2 pi)^{-1/2} n^{-3/2} e^{-n theta^2/2} (1 + O(theta + 1/n)).
      LEMMA 5 (oracle ceiling). The expected total mass of the T largest
      basins is N C_max(a) with C_max(a) = erfc(sqrt(x*/2)) and x* the root
      of 2 x*^{-1/2} e^{-x*/2} - sqrt(2 pi) erfc(sqrt(x*/2)) = a sqrt(2 pi),
      plus O(theta) and a concentration error from the order statistics of
      N/W samples.
      LEMMA 6 (online cost). The number of steps of a uniform-start walk to
      its first marked point is Geometric(theta) independent of the basin
      it lies in; hence the expected online cost of a table of coverage C
      with restarts is W/C + O(W).
      ASSEMBLY. At T = N^{1/3}: L sqrt(T/N) = sqrt(a)/C_max(a), tabulated as
      1.51, 1.35, 1.28, 1.30 at a = 1, 1/2, 1/4, 1/8, with the minimum near
      a in [0.2, 0.25]; at fixed L the minimum table is 1.64 N/L^2.
    (B) WHAT THE DERIVATION BUYS. It converts "how much of the table is
    redundant" from an open measurement into a stated number with a stated
    error term, and it makes IDEA-20260906-cf3b76's invariance and
    IDEA-20260906-05ffb8's estimator ceiling corollaries of one object. It
    is deliberately positioned so that every empirical record in this batch
    tests one lemma: aed829 Step 2 tests Lemma 2, Step 3 tests Lemmas 4-5,
    the memorylessness check tests Lemma 6; cf3b76 tests the rule-invariance
    extension; 05ffb8 lives inside the gap between Lemma 5 and the count
    rule.
    (C) WHAT IT DOES NOT BUY. Nothing about the exponent (KN-LIT-013), nothing
    about the r-adding walk beyond H1, nothing about non-generic structure.
    The constant 1.28 is a MODEL value for the oracle; Bernstein-Lange's 1.77
    is a MEASUREMENT with finite T_gen/T = 2 and an 8W cap, and the record
    claims only that the ratio 1.38 is the sum of those losses, which aed829
    measures.

  mechanism: >-
    STEP 1. Write Lemmas 1-6 with explicit error terms as a derivation
    artifact (docs/claims-and-verification.md: labelled `derivation`, never
    "proved"), citing the random-mapping and branching-process results by
    name with provenance.
    STEP 2. Baseline embedding: check that at theta -> 0 with T W^2 = N the
    formulas reproduce the Bernstein-Lange heuristic that "T W^2 of order N
    gives constant success", and that Lemma 4 at m = T gives 0.42 at a = 1.
    STEP 3. Numerical verification of the assembly table by quadrature to
    four digits; publish the x*(a) and C_max(a) tables as an artifact.
    STEP 4. Cross-check every lemma against the exact enumeration of
    IDEA-20260906-aed829 at N in {2^20..2^26}: the O(theta) terms must be
    visible and shrink as N^{-1/3}.
    STEP 5. Record the nearby-object failure (an r = 2 adding walk, Teske-
    non-random) where Lemma 2 is expected to fail measurably.

  novelty_status: unverified

  novelty_screen:
    method: >-
      As in IDEA-20260906-aed829; additionally a WebSearch for Borel/Galton-
      Watson tree sizes in random mappings with distinguished points, which
      returned the Borel formula and the Aldous-Pitman size-biased identity
      as listings but no DLP-table application.
    results: >-
      The Borel law and size-biased identities are classical; the perfect-
      table TMTO literature (Hong-Moon, Lee-Hong, Avoine-Junod-Oechslin;
      listings only) computes coverage of DP tables by a different route
      (chain-length distributions and merge counting) and very likely
      contains Lemma 4 in its own notation. Lemma 5 (the oracle ceiling
      through order statistics of Borel basins) and the assembly numbers
      were not found. Corrigan-Gibbs-Kogan and Rotem-Segev give asymptotic
      constructions with no constants.
    verdict: >-
      UNVERIFIED: the mathematics is standard and the composition is likely
      folklore-adjacent in the TMTO literature; the primary texts were not
      opened. The program-level value is the explicit ceiling with error
      terms, which no corpus record has.

  discriminated_from:
    - >-
      IDEA-20260906-aed829: the measurement; this record is the derivation
      the measurement tests. Kept separate so the derivation can be refuted
      by a validator at zero compute without touching the instrument.
    - >-
      Bernstein-Lange (KN-LIT-3060): an algorithm with measured constants;
      this record supplies the model ceiling those constants sit above.
    - >-
      Rotem-Segev ITC 2022 (retrieved listing): a fully constructive
      preprocessing algorithm with an asymptotically optimal tradeoff; no
      constants; different aim (derandomisation).
    - >-
      IDEA-20260807-a2fb45: a closure on the isogeny-class invariance of the
      preprocessing frontier; different question.

  object_first_candidate:
    tracked_object: The basin-size law P(n) and its two integrals (Lemmas 4-5).
    lossiness: >-
      GENUINELY LOSSY: a one-parameter distribution summarises the walk.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED: adding entries and adding walks propagate
      through P(n) alone (Lemma 3). Not a change of coordinates.
    survival_score: >-
      Survives every uniform-rule walk satisfying H1; dies for non-functional
      walks and for W approaching sqrt(N) (cycle mass).

  null_object_control: >-
    For a derivation the null object is the NEARBY OBJECT on which the
    conclusion must fail: (1) an r = 2 adding walk (Teske) where the in-
    degree law is not Poisson(1) and Lemma 2 must fail measurably; (2) a
    random PERMUTATION instead of a random function, where there are no
    trees, every basin is a cycle segment of mean length W, the size law is
    Geometric rather than Borel, the size-biased mean is 2 W not 0.886 W^2,
    and the oracle ceiling collapses to about T W/N -- the derivation must
    predict that collapse, which aed829 can check in minutes. DECAY: the
    O(theta) error terms must shrink as N^{-1/3} across N = 2^20..2^26 in
    the exact enumeration; error terms that do not shrink mean a missing
    term in the derivation.

  assumptions:
    - >-
      H1 (random-function heuristic) of IDEA-20260906-aed829 for the transfer
      from random functions to r-adding walks; the lemmas themselves are
      about random functions and carry no heuristic.
    - >-
      The Borel asymptotic and the singularity analysis are recalled
      standard results; the record names them as obligations to be checked,
      not as cited theorems.

  proof_search_map:
    bottleneck: >-
      Lemma 2's N-dependence: coupling the exploration of a basin in a
      random function of size N with a Poisson(1 - theta) Galton-Watson
      tree while the basin size is of order W^2 = N^{2/3}, where the
      "with replacement" approximation has error of order (basin size)^2/N
      = N^{1/3}, which is NOT small in absolute terms but IS small relative
      to the tree size; the derivation must state the error in the right
      metric.
    baseline_embedding:
      parameter_slice: >-
        T W^2 = N (a = 1) and the count rule with T_gen -> infinity: the
        formulas must reproduce a coverage of order 1 and an online cost of
        order W, which is the Bernstein-Lange heuristic regime.
      reproduction_check: >-
        Symbolic: Lemma 4 at a_m = 1 gives 0.42; Lemma 5 at a = 1 gives
        0.66; both between 0 and 1 and ordered (selected above unselected).
        Frozen fixture: the coordinator's scratch value 0.637 at N = 2^21
        (internal, unverified) is within the expected O(theta) band of 0.66
        with theta = 1/128; the fixture is replaced by aed829's committed
        run when it exists.
    observation_collision:
      observable: The coverage C(X) of a stored set.
      distinct_preimage_search: >-
        Two different stored sets with the same total basin mass have the
        same coverage and the same expected online cost (Lemma 6): the
        observable does not identify WHICH basins were stored, only how
        much mass. This collision is benign for the ceiling claim and fatal
        for any claim that a particular rule is "better" for reasons other
        than mass -- e.g. depth -- which is why 05ffb8's claim is stated in
        mass.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource measure is basin mass; the specialisation is the
          Borel law; the packing is the order-statistic integral over
          proved-disjoint basins (Lemma 1).
        predicted_gain: >-
          A ceiling with an explicit constant and error term rather than a
          heuristic "T W^2 of order N".
      - transform: representation_reduction
        proposed_object: >-
          Replace "table of DPs" by "multiset of basin sizes"; the selection
          problem becomes a one-dimensional order-statistics problem.
        predicted_gain: >-
          Every selection rule is scored by one number; the oracle is trivial
          and the whole content is estimation.
    quantifier_order: >-
      FORALL N, FORALL theta = W^{-1} with W <= N^{1/3}, FOR a uniformly random
      function f and independent marks, FORALL T and FORALL stored sets X of
      size T, E[C(X)] <= C_max(T W^2/N) (1 + O(theta)) + (concentration term).
      The stored set may depend on f (it is chosen after seeing the walks);
      the bound is over the expectation of the maximum, which is what an
      oracle achieves. NOT claimed: for every f (no worst-case statement),
      nor for r-adding walks except through H1.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under H1, no selection rule at fixed (T, W) achieves expected
        coverage above C_max(a) (1 + o(1)), and the oracle online cost at
        T = N^{1/3} is 1.28 N^{1/3} (1 + o(1)) at a = 1/4." It cannot certify
        anything about the exponent, about non-uniform rules (cf3b76 extends
        it), or about non-functional walks.
      nearby_object_control: >-
        Random permutation walk (see null_object_control): the ceiling must
        collapse to order T W/N there. If the derivation does not predict
        the collapse it has not identified the load-bearing structure (the
        tree branching), and its numbers are not trustworthy.
    proof_obligations:
      - claim: Basins partition the set of points reaching a mark (Lemma 1).
        responsibility: correctness
      - claim: The basin-size law is Borel(1 - theta) up to a stated error along theta = N^{-1/3} (Lemma 2).
        responsibility: size
      - claim: Uniform starts are size-biased samples with the stated hit law (Lemma 3).
        responsibility: correctness
      - claim: Unselected coverage integral equals 1 - (1 + 2a)^{-1/2} + O(theta) (Lemma 4).
        responsibility: success_probability
      - claim: Top-T mass equals N C_max(a) with the stated root equation (Lemma 5).
        responsibility: size
      - claim: Walk length to first mark is Geometric(theta) independent of basin (Lemma 6).
        responsibility: runtime
      - claim: The assembly table (1.51, 1.35, 1.28, 1.30) is correct to two digits.
        responsibility: baseline
      - claim: The permutation nearby object collapses the ceiling to order T W/N.
        responsibility: scope

  predictions:
    - metric: sign and magnitude of the O(theta) residual between Lemma 4-5 values and exact enumeration
      direction: lower
      minimum_effect: >-
        Residual below 10% at N = 2^24 and shrinking by a factor about 1.6
        from N = 2^20 to 2^26 (N^{-1/3} scaling), in the aed829 data.
    - metric: oracle online cost at T = N^{1/3}, exact enumeration, versus 1.28 N^{1/3}
      direction: different
      minimum_effect: Within 10% at N = 2^26 with a = 1/4.
    - metric: random-permutation nearby object, top-T share
      direction: lower
      minimum_effect: Below 3 T W/N, i.e. the tree-driven ceiling collapses as predicted.
    - metric: outcome of the Stage 0 validator audit of Lemma 2
      direction: different
      minimum_effect: >-
        One of: derivation accepted with stated error; error term corrected;
        refuted with a counterexample. All three are deliverables.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): a validator reads Lemmas 1-6 and
      the quantifier statement and either accepts the error terms, corrects
      them, or refutes a lemma. THIS IS THE CHEAPEST VALID DISCRIMINATOR:
      the whole ceiling stands or falls on Lemma 2 and Lemma 5, and both are
      one-page arguments.
      STAGE 1 (minutes): the quadrature table and the permutation nearby
      object at N = 2^20 (one array pass).
      STAGE 2 (no new compute): read the residuals off IDEA-20260906-aed829's
      committed runs when they exist; the record makes no run of its own
      beyond Stage 1.
    controls:
      - random-permutation walk (ceiling must collapse)
      - r = 2 adding walk (Lemma 2 must fail measurably)
      - N sweep of residuals (must shrink as N^{-1/3})
    required_metrics:
      - the derivation artifact with every error term stated
      - the x*(a), C_max(a), sqrt(a)/C_max(a) tables to four digits
      - residuals per lemma per N from aed829's exact enumeration
      - the permutation-walk top-T share

  falsification_conditions:
    - >-
      Lemma 5's value differs from the exact top-T share by more than 15% at
      N = 2^26 with residuals not shrinking in N: the ceiling formula is
      wrong and is withdrawn; the exact enumeration replaces it.
    - >-
      Lemma 6 fails (walk length correlates with basin size beyond CI): the
      online cost is not W/C and every cost figure in this batch must be
      re-derived from the measured length-conditional law.
    - >-
      The permutation walk does NOT collapse the ceiling: the derivation
      has not identified the tree structure as load-bearing; its numbers are
      void.
    - >-
      A validator exhibits a stored set with expected coverage above
      C_max(a) (1 + o(1)) under H1: the record is refuted outright.

  confounders:
    - >-
      Mixing the point-density and walk-length normalisations of theta (see
      IDEA-20260906-cf3b76); the derivation uses theta = 1/W throughout.
    - >-
      The Borel asymptotic is poor for n < 10; Lemma 4-5 integrals must
      either start at n = 1 with the exact Borel mass or state the cutoff.
    - >-
      Cap and cycle mass in the exact enumeration are not in the model and
      must be removed before residuals are computed.

  interpretation_limits:
    - >-
      A derivation artifact, never a theorem; claim_tier per
      docs/claims-and-verification.md. It binds random functions; it binds
      r-adding walks only through H1.
    - >-
      The ceiling is at fixed (T, W); it is not a bound on the (P, S, L,
      epsilon, U) frontier, which the batch and the W-choice move along.

  heuristic_assumptions:
    - id: H1
      statement: Inherited from IDEA-20260906-aed829 (random-function heuristic), used only for transfer.
      rigorous_support: As in IDEA-20260906-aed829.
      validation_plan: As in IDEA-20260906-aed829.

  target_complexity:
    time_exponent: >-
      No algorithm; the record states the oracle constant 1.28 at exponent
      1/3 against the measured 1.77.
    memory_exponent: >-
      No algorithm; the record states the oracle floor 1.64 N/L^2 at
      exponent 1/3 against the measured 3.13 N/L^2.
    best_known: Bernstein-Lange selected table (KN-LIT-3060); CGK bound (KN-LIT-013).
    hidden_overhead: The O(theta) and concentration error terms; the cycle mass.
    tradeoff_note: Not applicable; a ceiling, not a construction.

  dominated_by: >-
    n/a (no result claimed; a derivation of a ceiling). Checked against
    Bernstein-Lange, rho, Kuhn-Struik, CGK, Rotem-Segev: the record is a
    bound on selection at fixed (T, W), not a point on the frontier.
  sota_delta: >-
    No attack; conceptual contribution: an explicit ceiling C_max(a) with a
    stated constant-factor gap of about 1.9 in T (or 1.38 in L at fixed T)
    between the reported Bernstein-Lange table and the oracle, decomposed
    into named losses that IDEA-20260906-aed829 measures.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that Lemmas 1, 3, 4, 6 survive validator audit unchanged. 0.6 that
    Lemma 2's error term is stated correctly on the first attempt along
    theta = N^{-1/3} (the coupling is the subtle step). 0.7 that Lemma 5's
    root equation is right (it was derived by an integration by parts that a
    validator can redo in ten lines). 0.5 that the whole is already in the
    TMTO perfect-table literature in another notation, which would make it
    `known` and still leave the DLP-table ceiling numbers as the
    contribution.

