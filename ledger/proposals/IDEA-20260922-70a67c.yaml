idea:
  id: IDEA-20260922-70a67c
  question_id: RQ-OAKLEY-264353
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE OAKLEY n = 5 GROEBNER QUESTION IS ONE q-INDEPENDENT CONSTANT, K_5, AND
    TWO THRESHOLDS: the S_5-symmetrised S_6 Weil restriction over F_q (5
    equations, 5 unknowns e_1..e_5, degree 16 in each) has ideal degree
    D = 2^{20} generically (JV 2010, frozen text), so its F4 + FGLM cost in
    F_q-operations, K_5, does not depend on q; the 2-torsion reduction to
    D/16 is UNAVAILABLE on both Oakley curves because sqrt(b) is not in F_{2^p}
    (exact arithmetic, this session); and the fully charged relation stage
    2^{p-1} . 5! . K_5 beats parallel rho at the 155-bit endpoint iff
    K_5 < 2^{38.9} and at the 185-bit endpoint iff K_5 < 2^{48.4}. Sparse FGLM
    alone is >= D^2 = 2^{40}, so the 155-bit endpoint is closed under the
    generic-degree heuristic and the 185-bit endpoint is OPEN, decided by
    whether the F4 phase of the symmetrised system fits under 2^{48}
    F_{2^{37}}-operations -- a constant this program can measure at p = 8 on any
    engine that does Groebner bases over F_{2^p}, which this machine lacks.
  class: mechanism

  claim: >-
    Setting: E/F_{q^5}, q = 2^p, V = F_q, five-point decomposition via the
    Semaev polynomial S_6(x_1,...,x_5, x_R), Weil-restricted along F_{q^5}/F_q
    into 5 equations over F_q and rewritten in the elementary symmetric
    functions e_1..e_5 of x_1..x_5 (degree <= 16 in each e_i).
    (A) D = deg of the zero-dimensional ideal is generically 2^{n(n-1)} = 2^{20}
    at n = 5 (KN-LIT-673219 / frozen JV 2010 section 2.4). D is a property of
    the polynomial system over the algebraic closure and does not depend on q;
    the F_q-rational solutions (the actual decompositions, ~ 1/5! of targets)
    are a vanishing fraction of the D closure points at large q.
    (B) The per-solve cost K_5 := (F4 to a degrevlex basis) + (FGLM to lex) +
    (root extraction), counted in F_q-operations, is therefore a constant of the
    n = 5 shape, up to polylog(q) factors in the root step. JV 2010's own F4'
    table for the FOUR-point system (3.98 s / 5.00 s / 8.50 s at |p| = 16 / 25 /
    32 bits) is the empirical face of this q-independence.
    (C) The 2-torsion symmetry used by FGHR to divide D by 2^{n-1} acts on x by
    x -> sqrt(b)/x (derived below from the group law) and preserves V = F_q iff
    sqrt(b) in F_q iff b in F_q. For both Oakley curves b^{2^p} != b (exact
    computation, this session), so the symmetry moves the factor base and the
    reduction is not available: D stays 2^{20}, not 2^{16}.
    (D) Fully charged relation stage with no large-prime rebalancing: relations
    ~ |F|/2 = 2^{p-1} (negation classes), attempts per relation 5! (H2 of
    IDEA-20260922-af7396), so T_rel = 2^{p-1} . 120 . K_5 = 2^{p+5.9} . K_5; sparse
    linear algebra 2^{2(p-1)} . 5 is 2^{62} / 2^{74}, negligible. Against rho
    2^{75.8} (p = 31) and 2^{91.3} (p = 37): the method wins iff
    K_5 < 2^{38.9} (155-bit) and iff K_5 < 2^{48.4} (185-bit).
    (E) Gaudry's q^{2-2/n} large-prime rebalancing multiplies the number of
    solves to 2^{1.6 p} = 2^{49.6} (p = 31): the method would then need
    K_5 < 2^{19.4}, below the FGLM floor, so rebalancing is counterproductive at
    n = 5 and is not charged.
    (F) Lower bound: FGLM on a shape-position ideal of degree D costs
    Omega(D^2) F_q-operations in the sparse variant, i.e. >= 2^{40}. Hence
    the 155-bit endpoint fails (D) under H1 (generic D), whatever F4 costs;
    the 185-bit endpoint is open and is decided by K_5 - 2^{40} <= 2^{48}
    of F4 work.

  mechanism: >-
    OBJECT FRAME. Representation: R1 -- the point's x-coordinate in F_q, with
    the five unknowns replaced by their elementary symmetric functions
    (quotient by S_5 in the coordinates, a change of variables that is
    injective on unordered 5-sets, hence NOT lossy and not claimed as a new
    object). Operation set Sigma = translation by factor-base points only.
    TRICHOTOMY: Class I, partial-action (index calculus); branching event =
    existence of a decomposition. LOSSY-PROJECTION TEST against Sigma: the
    tracked object is again the relation vector over F; passes as in
    IDEA-20260922-af7396. KN-OPEN-020: linear factor base, scoped-out class,
    nothing escapes. REPRESENTATION CLASS AND STAGE: R1, RELATION DECOMPOSITION.
    THE MECHANISM IS q-INDEPENDENCE. A zero-dimensional ideal's degree D, its
    Hilbert function, and the F4 degree sequence are properties of the
    polynomial system over the algebraic closure; changing q changes the
    coefficients' field but not the shape when the system is "generic" (H1).
    Consequently the whole Groebner phase can be MEASURED at p = 6..8 (q =
    2^6..2^8) with the same F_q-operation count it would have at p = 31, and the
    endpoint pricing is a finite computation: K_5 measured once, then (D).
    Nothing analogous holds for the SAT formulation (IDEA-20260922-af7396),
    whose cost is exponential in p by construction.
    THE 2-TORSION DERIVATION, in full so a reviewer can check it. For
    y^2 + xy = x^3 + b (a = 0 on both Oakley curves) the unique 2-torsion point
    is T = (0, sqrt b). For P = (x, y), the chord slope to T is
    lambda = (y + sqrt b)/x and x(P + T) = lambda^2 + lambda + x + 0 + a. Using
    (y + sqrt b)^2 = y^2 + b and y^2 + b = x^3 + xy (curve equation), one gets
    lambda^2 = x + y/x and lambda = y/x + sqrt(b)/x, so lambda^2 + lambda + x =
    sqrt(b)/x in characteristic 2. Thus x(P + T) = sqrt(b)/x. The FGHR reduction
    requires this involution to preserve the factor base; for V = F_q that is
    sqrt(b) in F_q, equivalently b in F_q, which fails on both curves.
    WHAT IS ADDED over the corpus: the reduction of the entire Groebner
    question to one measurable constant with two explicit thresholds; the
    observation that the 2-torsion trick is structurally blocked on these
    curves; the proof that large-prime rebalancing cannot help at n = 5; and
    the resulting split verdict (155-bit closed under H1, 185-bit open). The
    corpus holds the ingredients -- D = 2^{20} in KN-LIT-673219, the FGHR
    symmetry as recalled literature, the prime-field ladder EXP-GFPN-05ff43 --
    but assembles none of them on the binary tower.

  novelty_status: unverified

  citations:
    - ref: KN-LIT-673219
      provenance: retrieved
      claim: >-
        JV 2010 section 2.4 (frozen text lines 578-590): "the system arising
        from (4) has generically 2^{5(5-1)} ~ 10^6 solutions", "the degree of
        the ideal generated by the equations ... is generically 2^{n(n-1)}",
        the field equations e_i^q - e_i are "not practical for large q", and
        no complete relation search was achievable for memory. Section 2.1
        (lines 340-372): total first-step cost n! c(n,q) q/2, Diem's bound
        c(n,q) <= Poly(n! 2^{n(n-1)} log q), rebalancing to q^{2-2/n}.
        Section 3 table (lines 690-700): F4' 3.979 / 5.002 / 8.496 s at
        |p| = 16 / 25 / 32 bits on the 4-point system.
      verified_by: idea-generator, this session, frozen full text read at the cited lines
    - ref: "Faugere, Gaudry, Huot, Renault, 'Using symmetries in the index calculus for elliptic curves discrete logarithm', J. Cryptology 2014 (recalled)"
      provenance: recalled
      claim: >-
        Recalled, NOT opened: the 2-torsion (and higher small-torsion) action
        on binary/Edwards curves is used together with S_n to divide the ideal
        degree by a further 2^{n-1}, making n = 4 practical; the n = 5 case is
        recalled as remaining out of reach because of the F4 phase. The exact
        statements, the model used, and whether the symmetry is x -> sqrt(b)/x
        in Weierstrass form must be checked by a reviewer who opens the paper.
      verified_by: null
    - ref: EXP-GFPN-05ff43
      provenance: internal
      claim: >-
        The program's prime-field n = 5 ladder (EcGFp5): raw / S_5 /
        2-torsion x S_5 arms, ideal degree via FGLM, msolve or Macaulay2 as
        solver, FGLM exponent between 2 and 3 both edges reported. It is the
        prime-field twin of this record and its instrument does not run over
        F_{2^p}.
      verified_by: idea-generator, this session, specification.yaml grepped for solver and metrics
    - ref: SRC-RFC2409-OAKLEY-EC2N
      provenance: internal
      claim: a = 0 and b values for both groups; subgroup orders 152 and 183 bits.
      verified_by: idea-generator, this session, verify_params.out read
    - ref: IDEA-20260922-af7396
      provenance: internal
      claim: The SAT arm's exponent-in-q pricing and the crossover p* against K_5.
      verified_by: idea-generator, this session, sibling record of the same session

  assumptions:
    - >-
      Exact fact from this session: for both Oakley curves b^{2^p} != b and
      b^{2^5} != b; hence sqrt(b) is not in F_{2^p} and the 2-torsion
      translation does not preserve V = F_{2^p}.
    - >-
      "Generic" means the Weil-restricted symmetrised system has the same
      Hilbert function as a random system of its degree pattern; the Oakley
      b's are treated as generic (H1). A structured b could lower D; this is
      exactly what the measurement at p = 6..8 with the actual tower shape
      tests.
    - >-
      Sparse FGLM (Faugere-Mou style, recalled) costs Omega(D^2) and O(D^2 n)
      F_q-operations for a shape-position ideal; dense FGLM O(n D^3). The
      floor 2^{40} uses the sparse bound.
    - >-
      No engine on this machine computes Groebner bases over F_{2^p}: Sage,
      Magma, Macaulay2, Singular are absent; msolve is prime-field only. The
      minimal test therefore requires installing Macaulay2 or Singular (both
      support GF(2^p) for small p) or Magma, or a purpose-built F4 over
      F_{2^p} in C (high implementation cost).

  proof_search_map:
    bottleneck: >-
      The F4 phase of the symmetrised S_6 system: its degree of regularity and
      the Macaulay-matrix size at that degree. FGLM is bounded below at 2^{40}
      and above at ~2^{60}; F4 is unbounded in either direction by anything in
      the corpus. Whether F4 <= 2^{48} F_q-ops is the whole 185-bit question.
    baseline_embedding:
      parameter_slice: >-
        n = 4 (S_5, four points, degree 8): FGHR's practical case and the
        program's EXP-GFPN-05ff43 m = 4 fallback; the same engine must
        reproduce D_4 = 2^{12} generic (or 2^{12}/8 with 2-torsion where
        available) before the n = 5 cell is trusted.
      reproduction_check: >-
        Compute D at n = 3 (2^6) and n = 4 (2^{12}) on the binary tower at
        p = 5..7 and match JV's generic formula exactly; then n = 5 at p = 6.
        A D at n = 5 that differs from 2^{20} by more than the F_q-rational
        defect is the interesting event and is reported, not corrected.
    observation_collision:
      observable: >-
        K_5 in F_q-operations, decomposed into (F4 matrix sizes per degree,
        FGLM cost, root step) so that a total is never the only number.
      distinct_preimage_search: >-
        A small K_5 at p = 6 is produced both by "the shape is genuinely
        cheap" and by "at q = 64 the field equations are implicitly nearly
        satisfied and the engine exploits low-q coincidences". Discriminate by
        measuring at p = 6, 7, 8 and demanding q-independence of the operation
        count (not the wall time); a K_5 that rises with p is not the constant
        the record defines.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "is n = 5 Groebner decomposition feasible at Oakley?" by
          "measure the q-independent constant K_5 at p in 6..8 and compare to
          2^{38.9} and 2^{48.4}".
        predicted_gain: >-
          Turns an asymptotic argument into a finite measurement whose transfer
          to the endpoints rides on one named heuristic (H1).
      - transform: specialization_pack
        proposed_object: >-
          Second arm: the chained-S_3 five-point system Weil-restricted along
          F_{q^5}/F_q as a 20-equation, 20-unknown system over F_q of low
          degree (Semaev's degree bounds, GOAL-SEMBIN-*), measured on the same
          engine and cells for its own constant K_5^chain.
        predicted_gain: >-
          Decides whether Semaev's chain buys anything on the Groebner side at
          fixed n = 5, as a constant, without any first-fall-degree claim
          (KN-FIND-936151 forbids routing through d_F <= d'_F).
    quantifier_order: >-
      FORALL p >= 6, FORALL b in F_{2^{5p}} \ F_{2^p} generic in the sense of
      H1: K_5(p, b) = K_5 (1 + o(1)) in F_q-operations. The pricing (D) then
      holds FORALL such b at p = 31, 37 as a corollary. EXISTS b (structured,
      e.g. b in F_{2^p}) where the statement is false and D is smaller -- the
      Oakley b's are shown not to be of that kind.
    method_ceiling:
      strongest_certifiable_claim: >-
        "K_5 measured at p in 6..8 is q-independent to within a stated factor
        and equals X F_q-operations; therefore under H1 the n = 5 subfield
        index calculus costs 2^{p+5.9} X at the endpoints, which is
        above / below rho by Y bits." The method cannot certify anything about
        non-generic b, about factor bases other than F_q, or about any n != 5.
      nearby_object_control: >-
        PROVES-TOO-MUCH: the same pricing at n = 4 on E/F_{q^4} (D = 2^{12},
        relations 2^{p-1}, 4! attempts) must reproduce the KNOWN practicality
        of n = 4 (FGHR, recalled) at, say, q = 2^{32} -- if the formula says
        n = 4 is infeasible at 128 bits it is charging something wrong. NULL
        OBJECT: a random system of 5 equations of degree 16 in 5 variables over
        F_q with no S_5 origin; its D and K must be measured on the same engine
        so that "structured is cheaper than random" is a comparison, not a
        hope.
    proof_obligations:
      - claim: D = 2^{20} generically for the symmetrised n = 5 system (JV 2010, retrieved).
        responsibility: baseline
      - claim: x(P + T) = sqrt(b)/x for the 2-torsion point on y^2 + xy = x^3 + b.
        responsibility: correctness
      - claim: sqrt(b) not in F_{2^p} for both Oakley curves (exact arithmetic).
        responsibility: correctness
      - claim: K_5 is q-independent in F_q-operations under H1.
        responsibility: runtime
      - claim: Thresholds 2^{38.9} and 2^{48.4} from the charged relation stage against rho.
        responsibility: interface
      - claim: FGLM >= D^2 = 2^{40} closes the 155-bit endpoint under H1.
        responsibility: scope
      - claim: Large-prime rebalancing is counterproductive at n = 5.
        responsibility: scope

  predictions:
    - metric: ideal degree D of the symmetrised S_6 restriction at n = 5, p in 6..8, generic b
      direction: different
      minimum_effect: >-
        D = 2^{20} exactly (or 2^{20} minus a q-dependent rational defect
        < 1 % at p >= 6). D < 2^{19} is the surprise: some symmetry beyond S_5
        is acting and must be named.
    - metric: K_5 in F_q-operations at p = 6, 7, 8
      direction: different
      minimum_effect: >-
        Ratio K_5(8)/K_5(6) in [0.8, 1.5] (q-independence within the root
        step's polylog). Outside that band H1 fails and the endpoint transfer
        is void.
    - metric: F4 phase cost at n = 5 in F_q-operations
      direction: different
      minimum_effect: >-
        Registered as an open number: F4 < 2^{48} - 2^{40} keeps the 185-bit
        endpoint open in the method's favour; F4 > 2^{48} closes it. Either
        outcome satisfies the RQ's decision target (3)-(4).
    - metric: D on the n = 4 baseline slice at the same p
      direction: different
      minimum_effect: 2^{12} exactly; any other value invalidates the engine or the model, not the curve.

  minimal_test:
    design: >-
      Requires a Groebner engine over F_{2^p} (Macaulay2 or Singular via apt,
      or Magma). (1) Build E/F_{2^{5p}} siblings, p in {6, 7, 8}, random b not
      in F_{2^p}, a = 0. (2) Compute S_6 symbolically once (resultant of two S_4
      in a shared variable; ~17^6 monomials before symmetrisation, heavy but a
      one-off) or use the engine's resultant; rewrite in e_1..e_5; Weil-restrict
      along a tower basis of F_{q^5}/F_q into 5 equations over F_q. (3) For 5
      random targets per p: F4 (record degree sequence and matrix sizes), FGLM
      (record D and operation count), root extraction; K_5 as the sum in
      F_q-operations, with wall time and RSS charged alongside. (4) Same at
      n = 3 and n = 4 as baseline slices. (5) Second arm: the chained five-point
      system over F_q on the same cells. This machine CANNOT run steps 3-5: no
      engine. What it takes: `apt install macaulay2` or `singular` (network
      permitting) -- both handle GF(2^p) for p <= 8 -- or a C implementation of
      F4 over F_{2^p} (high). Memory: JV report the n = 5 system exceeded a
      2010 personal computer; 6 GB free may or may not suffice at p = 6 and the
      cap is machine protection, never evidence.
    controls:
      - baseline slices n = 3 (D = 2^6) and n = 4 (D = 2^{12}) on the same engine and cells
      - null object: random degree-16 system in 5 variables over F_q, same engine, same metrics
      - q-independence check: identical operation counts (not times) across p = 6, 7, 8
      - the chained five-point arm on identical targets (same decomposition, different presentation)
    required_metrics:
      - D (FGLM ideal degree) per cell
      - F4 degree sequence and Macaulay matrix dimensions per degree
      - FGLM operation count and the fitted exponent in D
      - K_5 total in F_q-operations, per p
      - wall-clock, peak RSS, solver identity and version

  falsification_conditions:
    - D at n = 5 measured below 2^{19} on generic b: an unnamed symmetry exists; the record's D-based floor is withdrawn and the symmetry is the new object.
    - K_5(8)/K_5(6) outside [0.8, 1.5]: q-independence (H1) fails; the endpoint transfer is void and the record is superseded by one with a q-dependent model.
    - The n = 4 baseline does not return D = 2^{12}: the engine or the restriction is wrong; no conclusion about n = 5.
    - Either Oakley b found in F_{2^p}: the 2-torsion reduction becomes available and the thresholds move by 4 bits in the method's favour.
    - F4 at n = 5 measured under 2^{48} - 2^{40}: the 185-bit endpoint is OPEN in the method's favour and the result requires independent review before any promotion.

  confounders:
    - Engine-specific F4 heuristics (selection strategy, linear algebra backend) change constants by orders of magnitude; K_5 must be reported per engine and the engine identity is part of the datum.
    - Wall time is q-dependent through field arithmetic; only operation counts test H1.
    - Memory exhaustion at p = 6 is an infrastructure fact (AGENTS.md rule 5).
    - The F_q-rational solution count (actual decompositions) is a random variable ~ Poisson(1/120); a target with zero rational solutions still has the full D over the closure and is the normal case.

  interpretation_limits:
    - Every number is at p <= 8 and transfers to p = 31, 37 only under H1, stated wherever quoted.
    - Closure of the 155-bit endpoint is conditional on H1 and on the sparse-FGLM floor; it is a closure of the five-point subfield index calculus, not of the curve (GHS, IDEA-20260922-2caba8, is a separate and stronger comparator).
    - Nothing here asserts anything about deployed-system security.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The Weil-restricted, S_5-symmetrised S_6 system for generic b has ideal
        degree exactly 2^{20} and an F4 degree sequence independent of q.
      rigorous_support: >-
        Bezout-type bound for the multidegree pattern (JV 2010 relays Diem's
        resultant bound c(n,q) <= Poly(n! 2^{n(n-1)} log q)); the "generic
        system of this degree pattern" model, imitating the uniform-random
        polynomial system whose Hilbert function is the generic one.
      validation_plan: >-
        Measure D and the F4 degree sequence at p = 6, 7, 8 for 5 random b each;
        compare with 2^{20} and with the null random system; tail check: the
        maximum deviation of D across b at fixed p must be below 1 %. Transfer
        to p = 31, 37 is an explicit extrapolation.
    - id: H2
      statement: >-
        Sparse FGLM on a shape-position ideal of degree D costs between D^2 and
        D^3 F_q-operations.
      rigorous_support: >-
        Recalled complexity statements for FGLM (dense O(n D^3)) and sparse
        FGLM (Faugere-Mou, ~O(D^2) for shape position); EXP-GFPN-05ff43 already
        measures the exponent "between 2 and 3" on the prime-field twin.
      validation_plan: >-
        Fit the FGLM operation count against D across n = 3, 4, 5 on the same
        engine; report both edges; the 2^{40} floor uses the exponent-2 edge
        and is the conservative choice for a closure.

  target_complexity:
    time_exponent: >-
      Relation stage 2^{p+5.9} . K_5, i.e. q^1 . K_5 with K_5 = q^0 (a constant
      >= 2^{40}); linear algebra q^2 . 5 (negligible at the endpoints).
      Compared with rho's q^{2.5}: the EXPONENT in q is already better (Gaudry);
      the constant decides, and the constant is the object of this record.
    memory_exponent: >-
      Groebner: Macaulay matrices of the F4 phase (unknown, the reason JV could
      not finish); relation matrix 2^{p-1} rows of weight 5.
    best_known: parallel rho 2^{75.8} / 2^{91.3} at the two subgroups; GHS descent as structural comparator.
    hidden_overhead: >-
      polylog(q) in the root-extraction step; engine constants of several
      orders of magnitude; all disclosed as measured per engine.
    tradeoff_note: >-
      Large-prime rebalancing (q^{2-2/n}) is shown counterproductive at n = 5.
      Parallel over targets. Memory is the unmeasured risk of the F4 phase.

  dominated_by: >-
    As an attack: none is claimed; rho and GHS remain the frontier rows. As an
    analysis: the corpus row closest is EXP-GFPN-05ff43 (prime-field n = 5
    ladder with FGLM degree as metric), which dominates this record on
    instrument readiness (it has an engine) and is dominated by it on object
    (it does not touch the binary tower, the 2-torsion obstruction, or the
    endpoint thresholds). JV 2010 dominates on having attempted the computation
    and is the source of D; it did not price the endpoints or split them.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against the program's prior state: the
    Oakley Groebner question is reduced to one constant with two thresholds
    (2^{38.9}, 2^{48.4}); the 155-bit endpoint is closed under H1 by the FGLM
    floor; the 185-bit endpoint is identified as the single live cell; and the
    2-torsion reduction is shown blocked by exact arithmetic on the frozen b.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
