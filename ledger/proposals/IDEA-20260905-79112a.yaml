    best_known: 96c4f3's rows; the batched row corrects the poly-memory row by m m!.
    hidden_overhead: Hash-set constant, the yield's Poisson half, and the free-target encoding's size.
    tradeoff_note: The batched row is a time-memory point at memory m! 2^l; the 2^{2l}-table row of 96c4f3 is another;
      rho dominates both.
