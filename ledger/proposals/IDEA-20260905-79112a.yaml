  novelty_screen: 'search_knowledge NOT available; Grep over ledger/ for incremental, assumption-based, learned
    clause reuse (58 hits, all unrelated on inspection by title: ML-KEM, ENDO, isogeny, coordination records). NEAREST
    INTERNAL WORK AND EXACT DIFFERENCES: GOAL-SATIC-c49b77 / BATCH-1a527c (goal record, contracts/design-intake.json,
    launch.md read; declared intake.md and benchmark-obligations.json absent from the tree at task time) - single-instance
    readiness fixtures and an obligation inventory that names "total cost accounting"; no multi-target protocol,
    no assumption-based solving, no batched row. IDEA-20260904-96c4f3 (per-target loop, row m 2^n, and the precomputed-table
    row D at 2^{2l} memory) - this record adds the batched row 2^n/m! at memory m! 2^l, which 96c4f3 does not state,
    and tests whether SAT learning finds it; IDEA-20260904-7fd218 (within-target learning toggle) - across-target
    learning is a different question; KN-FIND-007 (yield conservation) - supplies the double count the batched row
    rests on. EXTERNAL: IPASIR assumptions interface retrieved at snippet level (ipasir_assume, ipasir_failed);
    "Certifying incremental SAT solving" (LPAR 2024) seen as a search snippet only. No source applies incremental
    SAT across pdp targets; absence is a floor. The batched row is very likely folklore and no novelty is claimed
    for it. CRYPTO-KB NEAREST WORK (named by the Coordinator after a crypto-kb search, read in full after the screen
    above was written): IDEA-20260808-bfa0b9 batches T targets ALGEBRAICALLY by adjoining one variable y with g_T(y)
    = prod (y - x(R_j)) and measures the solving degree''s growth in T against two cost models, M1 (d_solve ~ T^{1/(m+1)})
    and M2 (d_solve ~ T), with a flat d_solve as its amortisation outcome, over F_p by exact graded rank; this record
    batches via CDCL ASSUMPTIONS (target bits as assumption literals, learned-clause reuse histogram) over F_2 and
    derives the combinatorial batched-enumeration row 2^n/m! at memory m! 2^l, which neither of bfa0b9''s cost models
    includes and which dominates both of them as well as this record''s SAT arm.'
