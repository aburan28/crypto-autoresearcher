  assumptions:
  - Assumptions are passed through IPASIR; learned clauses persist across solve calls with inprocessing disabled.
  - The free-target encoding's solution set equals the union over targets of the fixed-target solution sets (checked
    at l = 3).
  proof_search_map:
    bottleneck: Whether any work done on one target transfers to another; the amortised per-target cost.
    baseline_embedding:
      parameter_slice: 'T = 1: reproduces 3c7a91''s single-target count. The repeated-target control (T copies of
        one R) must cost about one search plus T - 1 immediate UNSAT answers from the learned full-length r-clause.'
      reproduction_check: Frozen fixture of 2^{ml}/|G| per target and of C(|B|+m-1, m) for the batched row at every
        cell.
    observation_collision:
      observable: Total conflicts over T targets and the assumption-dependence histogram.
      distinct_preimage_search: Real versus N0 (target bits randomly wired) predicted to collide; the non-collision
        searched for is per-target cost decreasing in T on the real system only.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: Charge relation collection as (multisets enumerated) + (hash lookups) over disjoint blocks.
      predicted_gain: The batched row, exact.
    quantifier_order: 'CLAIMED: FORALL T in the tested set and FORALL target sequences, total conflicts = T x single
      within 5 percent. The batched row is a derivation, unconditional except for the yield mean.'
    method_ceiling:
      strongest_certifiable_claim: Toy-tier zero-amortisation on tested solvers; the batched row as arithmetic.
      nearby_object_control: 'KNOWN-FALSE OBJECT: the same target repeated T times, where amortisation must be near-total
        (T - 1 immediate answers); and N0.'
    proof_obligations:
    - claim: The free-target encoding is correct at l = 3.
      responsibility: correctness
    - claim: The repeated-target control amortises.
      responsibility: feasibility
    - claim: The batched row's arithmetic and its yield dependence are stated.
      responsibility: baseline
    - claim: No transfer beyond tested T, l, solvers.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: UNSAT total_conflicts(T) / (T x single-target conflicts), T in {10, 100}, l in {4..7}
    direction: different
    minimum_effect: In [0.95, 1.05]; a value <= 0.8 is amortisation and the interesting outcome.
  - metric: r_free_clause_fraction among learned clauses
    direction: lower
    minimum_effect: <= 0.01.
  - metric: reuse_gain = 1 - conflicts(target t+1, warm) / conflicts(target t+1, fresh solver)
    direction: lower
    minimum_effect: <= 0.02.
  - metric: SAT planted-target conflicts, warm versus fresh
    direction: different
    minimum_effect: Ratio within [0.5, 2] with the usual position variance; reported separately.
  - metric: repeated_target_gain on the known-false object
    direction: higher
    minimum_effect: '>= 0.99 for targets 2..T.'
  - metric: batched_row_check = instrumented multisets enumerated / C(|B|+m-1, m)
    direction: different
    minimum_effect: In [0.99, 1.01], with all relations among the T targets found (checked against the per-target
      loop).
  minimal_test:
    design: STAGE 0. Commit per-target and batched integer tables. STAGE 1. Validate the free-target encoding at
      l = 3 against fixed-target instances; validate the assumption plumbing on the repeated-target control. STAGE
      2. l in {4..7}, T in {10, 100}, random target sequences, >= 3 seeds, warm versus fresh; histogram per run;
      SAT and UNSAT separately. STAGE 3. N0 null at l in {4,5}; batched enumerator on the same targets with certificate
      checks; prime-field arm at m = 2, s <= 6.
    controls:
    - SHAPE-MATCHED RANDOM NULL N0 with target bits wired randomly.
    - PLANTED-SATISFIABLE TARGETS in every sequence, certificates re-verified.
    - KNOWN-FALSE OBJECT (repeated target) on which amortisation must be near-total.
    - FRESH-SOLVER BASELINE for every warm run.
    required_metrics:
    - total_conflicts, per_target_conflicts, decisions, learned_clause_count
    - r_literal_histogram of learned clauses
    - reuse_gain, repeated_target_gain
    - batched_enumerator operations and relations found, certificate_verified
    - solver version, seed, cell parameters, termination_reason
  falsification_conditions:
  - 'F1. total_conflicts ratio <= 0.8 or reuse_gain >= 0.1 on the real system: amortisation exists; its learned
    clauses are exhibited and costed against the batched row.'
  - 'F2. The repeated-target control does not amortise: plumbing failure; no result.'
  - 'F3. The batched enumerator misses a relation the loop finds: bug; fixed before any row is stated.'
  - 'F4 (pre-registered negative). (A) holding: the deliverable is the batched row on the frontier and the zero
    with error bars.'
  confounders:
  - Restart and phase-saving state carry across solve calls and can change SAT-side counts without any learning;
    SAT is reported separately.
  - Clause deletion policies drop learned clauses; deletion is disabled or its count recorded.
  - The free-target encoding is larger than the fixed one; per-node cost differs and is not compared.
  interpretation_limits:
  - CLAIM TIER toy; the batched row is arithmetic and is not an attack.
  - No exponent moves; the batched row stays about 2^{n/2} above rho.
  heuristic_assumptions:
  - id: H1
    statement: TARGET-DEPENDENCE OF LEARNING. Under assumptions, at most 1 percent of learned clauses on UNSAT pdp
      targets are free of assumption literals.
    rigorous_support: 'RIGOROUS HALF: the curve-only clause set is satisfiable for every core assignment, so its
      consequences are trivial. IMITATED LAW: in assumption-based CDCL a conflict whose reason chain reaches the
      assumption levels yields a clause containing assumption literals; the assumption is that every conflict''s
      chain does.'
    validation_plan: 'Histogram at l in {4..7}; TAIL: the r-free clause of maximal length, exhibited and checked
      for triviality.'
  - id: H2
    statement: BATCHED-ROW YIELD. The number of multisets whose sum is among T random targets is T C(|B|+m-1,m)/N
      (1 + o(1)).
    rigorous_support: KN-FIND-007's exact mean; the Poisson half is the same as 96c4f3's H1.
    validation_plan: 'Exact count from the batched enumerator at l <= 8 against the mean; TAIL: the maximum multiplicity
      of any target.'
  target_complexity:
    time_exponent: 'NO EXPONENT IMPROVED. Per-target SAT: ml - log2 m! bits; enumeration bound (m-1)l bits per target
      (96c4f3); batched: 2^n/m! total for the whole relation phase at l = n/m, a factor m m! below 96c4f3''s m 2^n;
      rho 0.886 2^{n/2} dominates.'
    memory_exponent: SAT learned clauses up to T 2^{ml}/m!; batched m! 2^l (the target set), same order as the factor
