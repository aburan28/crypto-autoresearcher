idea:
  id: IDEA-20260811-10eacc
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  title: >-
    EXPAND THE COST FUNCTIONAL IN CHARACTERS OF Cl(O): a level of an ordinary
    isogeny class is a Cl(O)-torsor, so any functional C on it has a Fourier
    expansion whose coefficients propagate EXACTLY under the class-group action
    (C composed with a has coefficients Chat(chi) chi(a)) -- and the entire T5
    dichotomy is decided by where the spectrum sits: concentration on a low-order
    character means the good set is a coset of index O(1) and is therefore hit by
    a random walk in O(1) tries, while a flat spectrum means goodness is a
    p^{-1/2}-rare event with no structure to exploit
  class: measurement

  claim: >-
    (A) THE OBJECT. Fix a level of an ordinary F_p-isogeny class; Cl(O) acts
    simply transitively on it, so after choosing a base vertex E_0 the level is
    identified with Cl(O) and any functional C (relation density, Groebner time,
    a Semaev invariant, an evaluation cost) becomes a function on a finite
    abelian group. Its Fourier transform Chat(chi) = (1/h) sum_a C(a) conj(chi(a))
    over the h characters of Cl(O) is well defined, and translation by an ideal
    class acts on it by a pure phase: (C after acting by b)hat(chi) =
    Chat(chi) chi(b). This is an EXACT one-step propagation rule under the very
    operation the campaign uses to move around the class, which is what makes the
    spectrum a tracked object rather than a statistic.
    (B) THE DICHOTOMY THIS DECIDES, STATED AS A PRE-REGISTERED TRICHOTOMY.
    (i) SPECTRUM FLAT within the band of a random relabelling: C is structureless
    on the torsor. Then the minimiser is a single vertex out of h, identifiable
    only by evaluating C on essentially all h of them, and the class-search costs
    Theta(h) evaluations = p^{1/2+o(1)} -- comparable to the attack itself and
    justifiable only as amortised preprocessing.
    (ii) SPECTRUM CONCENTRATED ON A CHARACTER OF SMALL ORDER, in particular on a
    GENUS character (an element of the 2-torsion of the dual, corresponding to a
    factorisation of the discriminant): the good set is a union of genera, a coset
    of index at most 2^{omega(D) - 1} = |D|^{o(1)}. A random walk hits it in
    2^{omega(D)-1} = polylog-on-average tries, and each try is tested by
    evaluating C directly. T5 IS THEN SATISFIED THROUGH OPTION (i), COMMONNESS,
    and the reachability gate does not bind at all.
    (iii) SPECTRUM CONCENTRATED ON A CHARACTER OF LARGE ORDER: goodness is a
    coset of large index; hitting it by walking costs the index, and the record
    predicts this case is the rarest and reports it separately rather than
    merging it with (ii).
    (C) THE OBSERVATION THAT MAKES (B) CHEAP AND THAT THE CAMPAIGN HAS NOT
    RECORDED. T5's option (ii) -- goodness decided by a local test -- is
    automatically satisfied whenever C ITSELF is cheap to evaluate, because the
    walker can simply measure C at each vertex. So the reachability gate has
    content only when goodness is RARE, and the spectrum is exactly what
    distinguishes rare-and-structured from rare-and-structureless. This
    reframing costs nothing and it is what the record contributes to the T5
    discussion beyond the measurement.
    (D) THE FIRST INSTANCE TO RUN IT ON. The committed p = 4001, t = 30 class has
    a FLOOR of 72 curves, which is a Cl(O_{f=16})-torsor with h = 72 -- large
    enough for a spectrum and small enough to enumerate exactly. The crater has
    h = 3 and is useless for this. The transfer arm is the matched-order family's
    f = 1 classes, whose class numbers run into the hundreds.

  mechanism: >-
    The class group acts simply transitively on each volcano level, so the level
    has no distinguished point and every functional on it is a function on a
    torsor. Functions on a finite abelian group decompose into characters, and
    characters are exactly the objects that diagonalise the action. If a cost
    functional has any structure with respect to the isogeny action, that
    structure MUST appear as spectral concentration; if it has none, the spectrum
    is that of a random function. Genus characters matter specially because they
    are the only characters of Cl(O) that are computable from purely local data
    (Legendre symbols of the norm of a representing ideal), which is why
    concentration there converts into an exploitable, locally testable structure
    rather than a curiosity.

  tracked_object: >-
    The Fourier spectrum {|Chat(chi)|} of a cost functional on one volcano level,
    together with the order of each character carrying mass. Not the functional
    itself, and not a variance summary.

  resource: >-
    R3 and R4: the class group as a ring-theoretic object and its action on the
    isogeny graph. The functional C may be an R1 or R2 quantity; the object here
    is its behaviour under R4.

  lossy_projection_test: >-
    PASSES. The map C -> {|Chat(chi)|} discards all phase information and
    therefore the identity of the minimising vertex: h! relabellings share a
    spectrum modulo phases, and the whole point is that the spectrum cannot
    address a vertex. What is retained propagates deterministically under the
    class-group action -- translation multiplies each coefficient by a phase and
    leaves every modulus invariant -- so the retained part is exactly a set of
    invariants of the action, which is the two-clause test satisfied in the
    cleanest form available anywhere in this campaign. A caution the campaign has
    earned: an exact 30.8 percent structural reduction once moved a cost
    functional by -0.44 percent, so spectral concentration is NOT by itself
    evidence of an exploitable cost difference -- the magnitude of C's variation
    must be reported alongside its structure, and both are required before
    anything is claimed.

  t5_reachability: >-
    This record is a direct assault on the T5 gate and it is written so that both
    outcomes are informative. Under (ii) the gate does not bind: the good set is
    common and locally testable, walking is O(1) tries, and the campaign would
    for the first time have a variance result that survives reachability. Under
    (i) the gate binds in the form the DECOMPOSITION intends, and the honest
    successor question becomes whether a p^{1/2} class-search amortises across
    targets, which is priced in IDEA-20260811-b3a355. The record must not be read
    as claiming an attack in either branch: KN-TECH-018's sqrt(6) rule still
    applies to whatever magnitude C shows.

  null_object: >-
    A RANDOM RELABELLING of the measured values across the same torsor, repeated
    at least 10^4 times, giving the null distribution of max_chi |Chat(chi)| and
    of the top-k spectral mass. This is the correct null because it holds the
    value multiset fixed and destroys only the assignment to vertices -- exactly
    the structure being tested. A second null: the same functional measured on 72
    curves drawn from other traces, where no class-group action exists and the
    spectrum is undefined, used to confirm that the pipeline refuses to produce a
    spectrum where none is meaningful rather than producing noise.

  why_not_a_renamed_known_approach: >-
    The lane's committed proposals attempt REDUCTIONS between vectorization and
    ECDLP (IDEA-20260807-5d7606 forward, -1b7241 by simulator, -326442 by view
    counting) and one mutual-information bridge detector (-cb672c). None of them
    analyses a functional's behaviour under the group action itself. Fourier
    analysis on Cl(O) is standard mathematics; applying it as the decision
    procedure for the campaign's own reachability gate is, as far as this
    session's corpus screen shows, unrecorded here.

  novelty_status: unverified
  novelty_screen: >-
    Screened this session against the RQ-CLGP lane (IDEA-20260807-8cdc79,
    -cb672c, -326442, -5d7606, -1b7241, -0fafe8, -bbdcf3) and the T5 discussion
    in DECOMPOSITION.md, plus the RQ-EWALK mixing proposals. WEB SEARCH
    UNAVAILABLE this session; genus theory and character sums over class groups
    are classical and no novelty is claimed for the mathematics.

  discriminated_from: >-
    NOT IDEA-20260807-cb672c (mutual information between a class-group statistic
    and k), which asks whether the class group leaks the SECRET; this record
    assumes it does not -- H-ENDO-001 and the coprimality arguments make every
    curve-side quantity k-independent -- and asks instead whether a COST
    functional is structured with respect to the action. NOT IDEA-20260807-5d7606
    or -1b7241, which attempt or simulate reductions; no reduction is attempted
    here. NOT IDEA-20260807-3f5545 (variance decomposition by level vector),
    which is a between-stratum analysis; this is a within-stratum harmonic
    analysis and is only defined inside a single level.

  assumptions:
  - >-
    Cl(O_{f_E}) acts simply transitively on the corresponding volcano level
    (standard volcano structure; Kohel; Sutherland) [recall-confident, not
    verified this session].
  - >-
    The action can be computed explicitly at toy scale by small-ell horizontal
    isogenies with recorded ideal labels, so that each vertex acquires a
    Cl(O)-coordinate relative to a chosen base vertex. This is a REAL
    implementation dependency: the campaign's harness contains no isogeny code
    (per IDEA-20260807-d7a5d4's grep), so the transport instrument must exist
    first.
  - >-
    C is measured with enough precision that its measurement error is below the
    spectral null band; for sampling-based functionals this requires the seed
    budget to be set from the null band, not after it.

  proof_search_map:
    bottleneck: >-
      Assigning a Cl(O)-coordinate to each vertex. Without it there is no
      spectrum; with it the analysis is a single FFT over an abelian group of
      order h.
    baseline_embedding:
      parameter_slice: >-
        A constant functional C reproduces the zero spectrum apart from the
        trivial character, and a functional built as a single character
        reproduces a spectrum with one nonzero coefficient. Both are run as
        fixtures.
      reproduction_check: >-
        Frozen fixture: a synthetic C = Re chi_0 for a chosen character must be
        recovered with all mass on chi_0 to machine precision. A pipeline that
        cannot recover a planted character cannot report a flat spectrum.
    observation_collision:
      observable: The spectrum {|Chat(chi)|}.
      distinct_preimage_search: >-
        Deliberate: any two functionals differing by a translation of the torsor
        share a spectrum. This is a feature (it is the invariance) and it is also
        the exact limit of what the observable can certify -- it can never
        identify WHICH vertex is good, only whether goodness is structured.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        Restrict to the genus subgroup: measure the mass on the 2-torsion of the
        character group separately from the rest, since only that part converts
        into a locally computable test.
      predicted_gain: >-
        If genus mass exceeds the null band, the good set is a computable union
        of genera and T5 is satisfied by commonness; the predicted gain in
        ATTACK terms remains bounded by the magnitude of C's variation and by
        KN-TECH-018.
    - transform: observable_fiber
      proposed_object: >-
        Two functionals with the same spectrum but different minimisers, used to
        show the observable does not address a vertex.
      predicted_gain: None; this is the ceiling statement, not a gain.
    quantifier_order: >-
      For every level L of every ordinary class and every functional C on L,
      there EXISTS a spectrum, and for every ideal class b the translated
      functional has coefficients Chat(chi) chi(b) -- a universal statement with
      no instance-dependent witness. The empirical claim is existential and
      per-functional: there exists a functional in the campaign's panel whose
      spectrum leaves the null band, or there does not.
    method_ceiling:
      strongest_certifiable_claim: >-
        That a named functional, measured at a named precision on one level of
        one class at one p, has spectral mass outside a random-relabelling null
        band. It cannot certify an attack, cannot certify transfer to another
        class, and cannot by itself certify that the concentration is
        exploitable -- exploitation additionally requires the magnitude of C's
        variation to exceed sqrt(6) and the transport charge.
      nearby_object_control: >-
        A functional known a priori to be class-constant -- the embedding degree
        of IDEA-20260811-8783a5, or the group order -- whose spectrum MUST be a
        single trivial-character spike. A method that reports structure there is
        broken.
    proof_obligations:
    - claim: The action is computed correctly (each vertex's ideal coordinate).
      responsibility: correctness
    - claim: Spectral mass outside the null band is not a measurement artefact.
      responsibility: success_probability
    - claim: Genus characters are locally computable from the curve.
      responsibility: interface
    not_applicable_reason: null

  predictions:
  - metric: max_nontrivial_spectral_mass_versus_random_relabelling_null
    direction: different
    minimum_effect: >-
      PRE-REGISTERED PREDICTION: inside the null band, i.e. no concentration, for
      every functional currently in the campaign's panel. The prediction is that
      the campaign's cost functionals are STRUCTURELESS on the torsor. Mass
      exceeding the 99th percentile of the relabelling null on any functional
      falsifies it and is the outcome of highest value.
  - metric: genus_character_mass_share
    direction: different
    minimum_effect: >-
      Consistent with h_2/h under the null, where h_2 is the number of genus
      characters. An excess of a factor 2 or more on the genus subgroup
      specifically is the case that converts into a T5-passing structure and must
      be reported separately from generic concentration.
  - metric: planted_character_recovery
    direction: different
    minimum_effect: >-
      A planted single-character functional must be recovered with at least 95
      percent of its mass on the planted character; below that the instrument has
      insufficient resolution at h = 72 and the whole measurement is void.
  - metric: magnitude_of_C_variation_across_the_level
    direction: different
    minimum_effect: >-
      Reported alongside the spectrum in every case. Any spectral finding with a
      coefficient of variation below 1 percent is explicitly labelled as
      structure without consequence, per the campaign's own -0.44 percent lesson.

  minimal_test:
    design: >-
      On the committed p = 4001, t = 30 class: build the floor level (72 curves)
      by Velu with recorded small-ell ideal labels, assign each vertex a
      Cl(O)-coordinate relative to a fixed base vertex, verify the coordinate
      assignment is consistent (composition of labelled steps agrees with the
      group law in Cl(O)), then compute the spectrum of each functional in the
      panel: decomposition rate at m = 3 with targets_B sampling, an exact
      algebraic invariant such as the singular-locus degree, and the endomorphism
      evaluation cost of IDEA-20260811-565915. Compare against 10^4 random
      relabellings. Report per-functional spectra with the genus subgroup broken
      out.
    controls:
    - >-
      RANDOM RELABELLING null, 10^4 draws, per functional.
    - >-
      PLANTED CHARACTER positive control, and a planted CONSTANT negative
      control.
    - >-
      The class-constant functional (embedding degree or group order) as an
      external calibration that must show a single trivial spike.
    - >-
      SAMPLING DISCIPLINE for any stochastic functional. Use targets_B and NOT
      targets_uniform, whose disputed status under H-ICINV-6c7920 (`specified`,
      neither presumed true nor false) would otherwise mix two estimands; and
      sweep factor-base density rather than running the saturated row, since the
      campaign's committed over-dispersion decays from 2.04 to 0.93 as density
      falls.
    - >-
      NULL-DISTRIBUTION DISCIPLINE. The variance-ratio statistic, if used at all,
      must NOT be tested against a Gaussian null. It is a ratio of quadratic
      forms whose skewness under the campaign's own model is exactly 2 times the
      coefficient of variation, so the null is asymmetric by construction; use
      the permutation null above.
    required_metrics:
    - per_vertex_class_group_coordinate_with_consistency_check
    - per_functional_full_spectrum
    - genus_subgroup_mass_share
    - relabelling_null_quantiles
    - coefficient_of_variation_of_each_functional

  falsification_conditions:
  - >-
    Spectral mass outside the null band for any panel functional, reproduced on a
    second class. The campaign has a structured cost functional on the class
    group; route immediately to independent review, and price it against
    KN-TECH-018 before any word of it is called an advantage.
  - >-
    The planted character is not recovered. The instrument lacks resolution at
    this h and every flat spectrum it reported is void.
  - >-
    The class-constant calibration functional shows nontrivial mass. The
    coordinate assignment is wrong and nothing downstream is interpretable.
  - >-
    The coordinate assignment fails its own consistency check (labelled step
    composition disagreeing with Cl(O)). The transport instrument is wrong; this
    is an infrastructure outcome, never a mathematical one.

  confounders:
  - >-
    h = 72 gives 72 characters and a coarse null; a single functional's maximum
    coefficient over 72 characters has a wide null band, so multiplicity across
    functionals must be budgeted BEFORE the measurement (the campaign has already
    recorded a run with 37 unbudgeted verdicts).
  - >-
    Measurement noise in a sampled functional will appear as a flat spectral
    floor and can mask genuine low-amplitude concentration; the seed budget must
    be set so the noise floor is below the null band, and the achieved floor must
    be reported.
  - >-
    The base vertex is arbitrary; moduli are invariant to that choice but any
    reported phase is not, so phases must never be reported as findings.
  - >-
    If the small-ell ideals do not generate Cl(O), the assigned coordinates cover
    a subgroup and the spectrum is of a restricted function; the consistency
    check must include a generation test.

  interpretation_limits:
  - >-
    TOY SCALE, one class, one level, claim_tier toy. NO ATTACK, NO EXPONENT, NO
    SPEEDUP; sota_delta zero.
  - >-
    A concentrated spectrum is a statement about STRUCTURE, not about MAGNITUDE.
    Both are required before anything is an advantage, and any advantage at or
    below sqrt(6) is baseline calibration under KN-TECH-018.
  - >-
    H-ENDO-001 used, not retested. KN-FIND-b7e091 binding: a genus-character
    oracle is a curve-only quantity and is routed to RQ-GGMB-6eaabc through
    IDEA-20260811-b2806a, where the expected verdict is simulable and hence
    closed at exponent 1/2 for any algorithm that does not also consume R1/R2.
  - >-
    P2 respected: no equivariant factor base is constructed and no phi-stable
    structure is tested, so nothing bears on H-STR-002 in either direction.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      Under the hypothesis that a cost functional has no structure with respect
      to the class-group action, its Fourier coefficients behave like those of a
      uniformly random relabelling of its own value multiset, so
      max over nontrivial chi of |Chat(chi)| concentrates at
      sqrt(2 log h / h) times the standard deviation of C.
    rigorous_support: >-
      Rigorous ingredient: Parseval's identity fixes the total spectral mass to
      the variance of C exactly, so the null is a statement about how that fixed
      mass is distributed, not about how much there is. The classical
      distribution imitated is the maximum of h - 1 approximately Gaussian
      coefficients, the same extreme-value model used for random character sums.
    validation_plan: >-
      Empirically, in the same run and with no extra cost: 10^4 random
      relabellings of the observed multiset give the null distribution exactly,
      so the analytic form is used only as a sanity check on the simulation. Tail
      check: the observed maximum over relabellings against the Gumbel prediction
      for the maximum of h - 1 coefficients; a mismatch means the value multiset
      is heavy-tailed and the permutation null, not the analytic one, is
      authoritative.
  - id: HA-2
    statement: >-
      Genus characters of Cl(O) are computable at a vertex from local data --
      Legendre symbols of the norm of a small ideal representing the connecting
      class -- in (log p)^{O(1)} operations given the factorisation of D.
    rigorous_support: >-
      Classical genus theory: the genus characters are the assigned characters of
      the discriminant and are given by Legendre symbols of the represented
      values of the form [recall-confident, not verified this session]. What is
      assumed is that a vertex admits a cheaply computable representative ideal,
      which is exactly what the connecting-isogeny labelling supplies at toy
      scale and what is NOT available for free at crypto scale.
    validation_plan: >-
      On the 72-vertex floor, compute the genus of each vertex two ways -- from
      the labelled ideal coordinate and from Legendre symbols of a
      small-norm representative found by walking -- and require exact agreement
      on all 72. Disagreement localises whether HA-2's local computation is real
      or requires the global coordinate, which is the crux of whether a genus
      concentration would be exploitable at all.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. Analysis cost is O(h log h) per
      functional after the level is built; building the level dominates, at
      O(h) Velu steps. Under branch (ii) the record would imply a class-search
      cost of 2^{omega(D)} = |D|^{o(1)} tries instead of Theta(h) = p^{1/2+o(1)},
      which is an exponent statement about the SEARCH and not about the ECDLP.
    memory_exponent: >-
      O(h) values, i.e. p^{1/2+o(1)} if the whole level is stored at crypto
      scale, which is why branch (ii) matters: it removes the need to store the
      level at all.
    best_known: >-
      For the ECDLP, 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006).
      For locating a specified vertex, p^{1/4+o(1)} time and memory by
      meet-in-the-middle [recall-confident, not verified].
    hidden_overhead: >-
      Building an explicit class-group coordinate system requires the
      factorisation of D and a generating set of small primes; both are granted
      here and both are real costs at crypto scale. The o(1) in 2^{omega(D)}
      hides a quantity that is polylog on average and quasi-polynomial in the
      worst case, and the record reports omega(D) per instance rather than
      averaging it away.
    tradeoff_note: >-
      Branch (i) leaves the campaign on the Theta(h)-preprocessing curve priced
      in IDEA-20260811-b3a355; branch (ii) removes the search entirely and the
      tradeoff becomes irrelevant.

  dominated_by: >-
    As an attack: dominated by every frontier row, since no attack is proposed --
    parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). As an analysis of within-level structure: dominated by nothing
    committed in this repository; no record computes a class-group spectrum.
  sota_delta: >-
    Zero on every attack axis. Against the campaign's own T5 reasoning: replaces
    an untested assumption that within-class goodness is unstructured with a
    measurement that can refute it, at the cost of one level build plus an FFT.

  estimated_cost:
    implementation: high
    compute: medium

  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that every panel functional's spectrum is inside the null band, i.e. the
    pre-registered prediction holds and the record delivers a controlled null.
    0.15 that some concentration appears and turns out to be a measurement
    artefact or a level-labelling error. 0.05 that a genuine concentration
    survives replication, which would be the single most consequential
    measurement this campaign could make. Filed high because the implementation
    cost is dominated by a transport instrument the campaign needs anyway
    (IDEA-20260807-d7a5d4) and because both branches are publishable internally.

  source_refs:
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md (L10, T5)
  - analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
    (targets_B, density sweep, and the committed over-dispersion decay)
  - ledger/proposals/IDEA-20260807-d7a5d4.yaml (the missing transport instrument
    this record depends on)
  - ledger/hypotheses/H-ICINV-6c7920 (`specified`; the targets_uniform dispute
    that forces targets_B here)
  - knowledge/techniques/KN-TECH-018.md (automorphism discount; the sqrt(6) rule)
