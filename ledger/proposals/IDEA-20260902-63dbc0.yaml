      for 'Borel|2-transitiv|two-transitiv|\bAGL|doubly transitive|
      GL_2\(Z/n\)|GL_2\(F_n\)|GL_m|projective line P\^1\(Z/n\)'; over
      ledger/ and knowledge/ for '528b6e' and 'A3-6'; over ledger/hypotheses
      for 'f558e4|PROP-24458b|df906f|863e36|133fd3'. Records read IN FULL:
      IDEA-20260901-133fd3, IDEA-20260901-863e36, IDEA-20260901-b4e6eb,
      IDEA-20260815-528b6e, KN-FIND-ffe1df, KN-OPEN-019, KN-TECH-005,
      KN-TECH-006, KN-TECH-018, KN-TECH-030, the TASK-20260902-2fb7f8
      candidate-mechanisms.yaml and source-novelty-audit.yaml, and the
      compiled prior-proposal list of 156 RQ-ECDLP/RQ-CRYPTO-001 records.
      Records read IN PART: IDEA-20260807-df906f (lines 1-160),
      IDEA-20260806-c5d183 (lines 1-140 and 490-529), IDEA-20260815-f558e4
      (lines 1-170), IDEA-20260802-006 (1-120), IDEA-20260817-84755b (1-140),
      IDEA-20260802-002 (1-100), IDEA-20260808-fa1d80 (1-90),
