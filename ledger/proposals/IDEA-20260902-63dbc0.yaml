idea:
  id: IDEA-20260902-63dbc0
  question_id: RQ-ECDLP-002
  added: '2026-09-02'
  title: >-
    THE TUPLE CLOSURE: for any finite tuple of instance-derived points on a
    prime-order subgroup, the EXACT lossy objects under linear recombination
    are exactly the diagonal Gamma-quotients and the projective class; the
    projective class of a pair IS the discrete logarithm, and its
    canonicalisation cost sqrt(n) saturates the generic bound c_can =
    Omega(sqrt(|Gamma|)) at |Gamma| = n - 1, so Pollard rho is the
    canonicalisation of the maximal block; the affine action (recombination
    plus translation) admits NO lossy exact object because AGL_m(F_n) is
    2-transitive; translations alone admit only shorter tuples; hence no exact
    object on m >= 2 points has image size below n + 1 and the pairs cell that
    IDEA-20260815-528b6e left open is closed with a mechanism -- while the same
    construction on E[ell] returns the ell-isogeny kernels, which is why the
    theorem is not proving too much
  class: mechanism

  claim: >-
    Setting. E/F_p ordinary short-Weierstrass, P of PRIME order n, G = <P>,
    Q = [x]P. An INSTANCE-DERIVED m-TUPLE is R = (R_1, ..., R_m) with every
    R_i = [a_i]P + [b_i]Q for known (a_i, b_i), i.e. R = u.P with the vector
    u = (a_i + b_i x)_i in F_n^m. Three operation sets act on such tuples and
    every one is computable in O(m^2 log n) group operations WITHOUT knowing x:
      Sigma_lin, linear recombination R -> M.R for M in GL_m(F_n) (this
        includes all diagonal and non-diagonal scalings);
      Sigma_tr, coordinatewise translation R -> R + D by any tuple D of
        known-combination points (this is the regular action of G^m on
        itself and contains every walk step of every adding walk);
      Sigma_aff, both together, i.e. AGL_m(F_n) acting on F_n^m.
    A projection v from G^m to a set S PROPAGATES DETERMINISTICALLY under a
    set Sigma of operations if for each sigma in Sigma there is F_sigma with
    v(sigma R) = F_sigma(v(R)) for all R; F_sigma need not be computable.
    Five statements, in decreasing order of certainty, each falsifiable by an
    enumeration that takes minutes.

    (C1) THE BLOCK LEMMA (elementary; the verbatim generalisation of
    IDEA-20260901-863e36 statement C1 from one point to m points). v
    propagates deterministically under Sigma if and only if the fibre
    partition of v is invariant under the group <Sigma> generated by Sigma,
    i.e. is a system of blocks of that group's action on the nonzero vectors
    of F_n^m (the zero tuple is excluded exactly as the identity is excluded
    in 863e36). Forward direction: v(R) = v(R') implies v(sigma R) =
    F_sigma(v(R)) = F_sigma(v(R')) = v(sigma R'). Converse: define F_sigma on
    images by any fibre representative; invariance is well-definedness.

    (C2) THEOREM A, THE LINEAR ACTION. The block systems of GL_m(F_n) acting
    on F_n^m minus zero are EXACTLY: for each subgroup Gamma of F_n^*, the
    partition into Gamma-orbits {gamma.u : gamma in Gamma} (Gamma = {1} is the
    discrete partition; Gamma = F_n^* is the partition into projective points,
    i.e. P^{m-1}(F_n)); and the one-block partition. Nothing else. PROOF. The
    action is transitive on nonzero vectors, so block systems containing a
    fixed v correspond to subgroups H with Stab(v) <= H <= GL_m, the block
    being the orbit H.v, and H = {M : M.v in H.v}. The Stab(v)-orbits on
    nonzero vectors are the singletons {gamma.v}, gamma in F_n^*, and ONE
    further orbit consisting of every vector off the line F_n.v (given w, w'
    off the line, extend (v, w) and (v, w') to bases and map one to the
    other fixing v). So H.v is either Gamma.v for the subgroup Gamma =
    {gamma : gamma.v in H.v} of F_n^*, or contains a vector w off the line.
    In the second case H contains Stab(v) and M_0 with M_0 v = w, hence
    Stab(w) = M_0 Stab(v) M_0^{-1}, hence by transitivity of Stab(v) on
    off-line vectors the full stabiliser of EVERY vector off the line, hence
    H is transitive on nonzero vectors and contains a full point stabiliser,
    so |H| >= (n^m - 1) |Stab(v)| = |GL_m| and H = GL_m. QED. Consequently
    every exact Sigma_lin-object of an m-tuple is, up to relabelling the
    image, the DIAGONAL Gamma-quotient R ~ gamma.R for some Gamma <= F_n^*,
    or constant.

    (C3) THEOREM B, THE AFFINE ACTION. AGL_m(F_n) is 2-transitive on F_n^m
    (translations are transitive; the stabiliser of 0 is GL_m, transitive on
    nonzero vectors), and a 2-transitive action is primitive, so its only
    block systems are the trivial two. Hence every projection of an m-tuple
    that propagates deterministically under BOTH recombination and
    translation is constant or injective. At m = 1 this is the rigidity
    theorem of IDEA-20260807-df906f plus the scale action; for m >= 2 it is
    new to this corpus (screened, see novelty_screen) and it is the exact
    statement IDEA-20260815-528b6e asked for and did not derive.

    (C4) THEOREM C, TRANSLATIONS ALONE. The block systems of the regular
    action of G^m = F_n^m on itself are the coset partitions of subgroups K
    <= F_n^m, and the quotient map F_n^m -> F_n^m / K is F_n-linear, so every
    exact Sigma_tr-object of an m-tuple is a SHORTER TUPLE of
    known-combination points (a Z-linear image of R, e.g. R_1 - R_2)
    followed by an injective relabelling. The object is lossy as a map on
    G^m but discards only bookkeeping the algorithm already holds, so by the
    lossy-projection test of docs/inventor-protocol.md section 2 it is a
    change of coordinates, not a new object; whatever is then done with the
    shorter tuple is again governed by (C2)-(C4) or, at length one, by
    df906f.

    (C5) FOUR COROLLARIES, WHICH ARE THE POINT.
      (i) IMAGE FLOOR. For m >= 2 every lossy exact Sigma_lin-object has
        image size at least (n^m - 1)/(n - 1) >= n + 1, because a
        Gamma-orbit has at most n - 1 elements. So NO exact object on two
        or more points shrinks the search space below the single-point
        setting; going to pairs or tuples can only lose, in the exact
        regime. This is the closure of 528b6e's cell with a mechanism.
      (ii) THE DISCRETE LOG IS THE MAXIMAL BLOCK. For m = 2 and Gamma =
        F_n^*, the block of (P, Q) is the projective point [1 : x], i.e. the
        discrete logarithm; the object propagates under GL_2 with F_M the
        Moebius action of M on P^1(F_n) -- NOT the identity, which is
        863e36's C3 trap in its m = 2 form -- and it is exactly invariant,
        hence lossy and exactly propagating, and UNCOMPUTABLE at the price
        the problem sets. In 863e36's language its canonicalisation cost is
        c_can for the orbit of size r = n - 1 on pairs; rho computes that
        canonical form in about 0.886 sqrt(n) = Theta(sqrt(r)) operations
        (KN-TECH-006), which SATURATES 863e36's generic lower bound c_can =
        Omega(sqrt(r)), itself the Shoup bound of KN-TECH-005 in that
        record's reduction. So Pollard rho is, in this frame, the generic
        canonicalisation of the maximal block, running at the generic bound.
      (iii) RHO'S COLLISION OBJECT IS A CLASS-I OBJECT ON A LINEAR IMAGE.
        528b6e's NULL 2 asked that the framework express the collision
        indicator 1[R_1 = R_2]. It does: the indicator propagates
        deterministically only under the DIAGONAL translations (D, D), the
        coset partition of K = {(D, D)} is the difference R_1 - R_2 (Theorem
        C, a single known-combination point), and the indicator is the
        further lossy map 1[difference = O], which propagates under nothing
        else (df906f). Rho is therefore a partial-action object in
        IDEA-20260806-c5d183's Class I, with H = the diagonal, and its
        birthday cost is the price of that partiality.
      (iv) THE THEOREM DOES NOT PROVE TOO MUCH. Apply (C2) with m = 1 to the
        F_ell-vector space E[ell] = F_ell^2 instead of to G^2. The projective
        partition of E[ell] minus zero has ell + 1 blocks, the cyclic
        subgroups of order ell, which are the kernels of the ell-isogenies
        out of E -- a lossy, exactly propagating, CHEAPLY computable and
        historically productive object (isogeny graphs; df906f's escape E3).
        It is cheap there because Gamma = F_ell^* is small, so
        canonicalising an orbit costs ell operations. The identical
        construction on G^2 has Gamma = F_n^* and costs sqrt(n) generically.
        The dividing line between the productive and the hopeless instance
        of ONE theorem is |Gamma|, i.e. 863e36's c_can, and nothing else.

  mechanism: >-
    THE TRACKED OBJECT is an m-tuple of instance-derived points, followed
    through the three computable operation sets Sigma_lin, Sigma_tr,
    Sigma_aff, and the question asked of it is the exact-regime half of the
    lossy-projection test: which projections of the tuple discard something
    and still propagate deterministically. The corpus has answered this for
    m = 1 under translation (df906f), for m = 1 under scaling (863e36), and
    has ASKED it for m = 2 (528b6e) without answering. This record answers it
    for every m and all three operation sets in one page of finite group
    theory, and the whole value is in the corollaries: pairs and tuples buy
    nothing in the exact regime (C5.i), the discrete log is itself a block
    (C5.ii), rho is the generic canonicalisation of that block at the
    generic bound (C5.ii), the collision indicator is placed (C5.iii), and
    the theorem distinguishes the productive E[ell] instance from the
    hopeless G^2 instance by one number (C5.iv).

    WHY THIS IS NOT 863e36 OR df906f IN NEW NOTATION. Both prior records fix
    m = 1. The new content is what happens for m >= 2, where the block
    lattice is NOT the subgroup lattice of a cyclic group: G^m has n^{m-1}
    plus lower-order-many subgroups of order n, and 528b6e's own
    heuristic HEUR-PAIR-RIG-1 predicted that this richer subgroup structure
    might break the rigidity argument. Theorems A-C say precisely how it
    breaks and how it does not: under translations alone it breaks
    completely and harmlessly (linear images, C4); under recombination the
    only blocks are diagonal scalings and the projective class (C2); under
    both, nothing (C3). The GL_m classification is not in 863e36, which never
    leaves m = 1 and never meets the projective class; and the observation
    that rho saturates 863e36's own generic bound is a consequence 863e36 did
    not draw.

    STAGE 0 (ZERO COMPUTE, HARD GATE). Write (C1)-(C4) in full, including
    the two places where a slip would hide: the transitivity of Stab(v) on
    off-line vectors when m = 2 (there the off-line vectors are the n^2 - n
    vectors not on one line, and the argument needs only that (v, w) is a
    basis), and the counting step |H| >= (n^m - 1) |Stab(v)|, which uses
    that H contains the FULL stabiliser of some vector, not merely a
    conjugate of part of it.

    STAGE 1 (MINUTES, PURE PYTHON, THE DECIDING FIXTURE). Complete
    enumeration of invariant partitions:
      (a) GL_2(F_n) on F_n^2 minus zero at n in {5, 7, 11, 13}: the number of
        invariant partitions must be EXACTLY d(n - 1) + 1, where d counts
        divisors (one Gamma-orbit partition per subgroup Gamma of the cyclic
        group F_n^*, plus the one-block partition), and each nontrivial
        partition must have every block of the form Gamma.u.
      (b) AGL_2(F_n) at the same n: exactly 2 invariant partitions.
      (c) The image floor: the smallest nontrivial invariant partition of
        (a) must have exactly n + 1 blocks.
      (d) NEARBY OBJECT WHERE (C3) MUST FAIL: the same enumeration over
        Z/6 x Z/6 under AGL_2(Z/6) (matrices invertible mod 6) must return
        STRICTLY MORE than 2 invariant partitions, the reductions mod 2 and
        mod 3 among them. If the code cannot see the composite case it
        cannot be trusted on the prime case.
      (e) POSITIVE CONTROL, THE PRODUCTIVE INSTANCE: F_ell^2 under
        GL_2(F_ell) at ell in {3, 5, 7}: the projective partition must have
        ell + 1 blocks, matching the count of cyclic subgroups of E[ell] and
        of ell-isogenies from a curve, read from the standard fact rather
        than from a curve computation.
    Invariance is checked against a generating set (elementary matrices,
    one transvection, one diagonal, plus unit translations for AGL) and the
    orbit closure is taken explicitly, so the fixture exercises the
    generated group and not just the generators.

    STAGE 2 (OPTIONAL, HOURS). Place every m >= 2 object the corpus has
    proposed into the classification, by reading: the pair objects of
    528b6e, the four-list keys of the RQ-ECDLP-160d89 line (probabilistic,
    outside this record's scope, and family 6 -- placed as such and not
    adjudicated), the Lagrangian-line object of IDEA-20260808-fa1d80 (which
    is (C5.ii) verbatim: the N + 1 isotropic lines through (P, Q) are the
    projective points of P^1(F_n), with the graph line the DL). This stage
    produces a table and no number.

    NO EXPERIMENT ON A CURVE IS RUN under this record; the fixture is finite
    group theory over F_n with n at most 13. No scalar is recovered.

