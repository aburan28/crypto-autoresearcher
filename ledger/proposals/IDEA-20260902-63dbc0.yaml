      entry ideas/catalogue-20260805/A3-representations.md lines 400-451 via
      grep excerpt. No web search was run for this record; the group-theory
      facts used are textbook and are cited as recalled.
    results: >-
      The AGL and GL_m grep hits inside ledger/proposals are all non-ECDLP
      records (code equivalence, AES-side affine groups) except
      IDEA-20260806-c5d183, whose only AGL mention is its discrimination from
      catalogue A3-6. A3-6 states, for m = 1, that an object invariant under
      AGL(1, Z/n) acting on the INDEX across instances is constant, and
      enumerates the stabiliser lattice of AGL(1, Z/n); it never treats
      tuples, GL_m, or the projective class. IDEA-20260815-528b6e poses the
      pairs question, predicts that the product group's richer subgroup
      structure may break the argument, and stops; the four 2026-08-16
      records citing it are lattice-side screens that name it as owning the
      pairs cell and do not answer it. IDEA-20260808-fa1d80 uses the N + 1
      isotropic lines of (E x E)[N] through (P, Q) as its object without the
      block-system framing and without the cost identification of (C5.ii).
      No record states Theorem A, Theorem B for m >= 2, the image floor
      (C5.i), or the saturation observation (C5.ii). Absence of a grep hit
      is a floor, not a proof of absence, and the semantic index was
      unavailable.
    verdict: >-
      UNVERIFIED. The group theory is elementary and is claimed as a
      reindexing of known facts (block systems of a transitive action,
      2-transitivity of the affine group), not as new mathematics; the
      external status of the corollaries as statements about the ECDLP was
      not checked against literature, and the recalled group-theory sources
      were not opened. Within the corpus the pairs cell was open by the
      owning record's own statement.

