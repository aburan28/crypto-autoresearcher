  assumptions:
    - >-
      n prime and known. Load-bearing everywhere: F_n is a field, F_n^* is
      cyclic, Stab(v) acts transitively on off-line vectors, and Theorem B's
      2-transitivity all use it. The composite case is the nearby-object
      control and is where the conclusions FAIL.
    - >-
      Tuples are instance-derived: every coordinate is a known combination
      of P and Q. Objects built from other points (torsion points over
      extensions, points of other curves, lifts) are outside the scope and
      are named in interpretation_limits.
    - >-
      Deterministic propagation is required under a GENERATING set of the
      operation group; by (C1) that is equivalent to invariance under the
      generated group, so an object that propagates only under a proper
      subset (Class I of c5d183) is outside every theorem here and is not
      closed by them.
    - >-
      Nothing here concerns probabilistic propagation of tuple objects; the
      keyed-join records of RQ-ECDLP-160d89 own that cell and are declared
      off-limits as a lens (family 6).

  proof_search_map:
    bottleneck: >-
      There is no computational bottleneck; the deliverable is the
      classification. The only place the argument could be wrong is the
      overgroup step of Theorem A (that H.v off the line forces H = GL_m),
      and the enumeration fixture at n <= 13 is designed to catch exactly a
      missed intermediate subgroup.
    baseline_embedding:
      parameter_slice: >-
        m = 1. Theorem A at m = 1 reads: block systems of F_n^* acting on
        F_n minus zero are the Gamma-orbit partitions -- 863e36's C1/C3
        verbatim. Theorem C at m = 1 reads: block systems of the regular
        action of a prime-order group are trivial -- df906f's rigidity
        theorem verbatim. Theorem B at m = 1 is the AGL(1, Z/n) statement of
        catalogue A3-6's T1, within one instance rather than across
        instances.
      reproduction_check: >-
        The Stage 1 fixture run at m = 1 must return d(n - 1) + 1 invariant
        partitions under F_n^* and exactly 2 under the translations, matching
        863e36's and df906f's counts; and 863e36's own fixture (exactly 2 at
        n = 23 under translations, strictly more at n = 33) is reproduced as
        the m = 1, Sigma_tr slice.
    observation_collision:
      observable: >-
        The pair (lossy, propagates deterministically under Sigma) for a
        projection of G^m.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, in two forms, both named in the
        claim. First, 863e36's trap in its m = 2 form: the projective
        partition propagates under GL_2 with F_M a nontrivial Moebius
        permutation of the blocks, while a Gamma-orbit partition propagates
        with F = identity on blocks only for the diagonal scalings; both are
        'lossy and propagating' and only the Gamma-orbit form shrinks a
        search space, and NEITHER shrinks it below n + 1. Second, two
        objects with the same observable and opposite practical value: the
        projective class on G^2 (uncomputable at the price of the problem)
        and the projective class on E[ell] (cheap and productive). The
        separating datum is |Gamma|, and the record makes that explicit so
        that the observable is not mistaken for a verdict.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'is there a lossy exact object on pairs' by 'which
          subgroups lie between a vector stabiliser and GL_m', an exact
          encoding by (C1); completeness exact; soundness exact; cost loss
          none, because the answer is a finite list.
        predicted_gain: >-
          Closes the pairs cell of 528b6e and the tuple generalisation in
          one argument, and converts the DL itself into a named block whose
          canonicalisation cost is 863e36's c_can.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (lossy, exactly propagating projective class)
          fixed and vary the forgotten structure (the ambient vector space:
          G^2 over F_n versus E[ell] over F_ell). The intrinsic invariant
          distinguishing the two is |Gamma|.
        predicted_gain: >-
          Shows the theorem is not proving too much: it recovers a known
          productive object exactly where the canonicalisation is cheap.
    quantifier_order: >-
      THEOREM A: FOR ALL primes n, FOR ALL m >= 1, FOR ALL projections v of
      F_n^m minus zero, [THERE EXIST F_M for every M in GL_m with v(M.u) =
      F_M(v(u)) for all u] IF AND ONLY IF [THERE EXISTS a subgroup Gamma of
      F_n^* such that the fibres of v are the Gamma-orbits] OR v is constant.
      THEOREM B: same quantifiers with GL_m replaced by AGL_m and the right
      side replaced by 'v is injective or constant'. THEOREM C: same with the
      translation group and the right side 'THERE EXISTS a subgroup K of
      F_n^m such that the fibres are the cosets of K'. The existential on the
      F_M is unrestricted (no computability). THE WEAKER READING NOT CLAIMED:
      that no object on tuples propagates PROBABILISTICALLY with useful
      advantage; that is the family-6 question and is untouched.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'in the EXACT regime, for tuples of instance-derived points
        under recombination, translation, or both, the complete list of
        lossy propagating objects is [Theorems A-C], with image floor n + 1
        for m >= 2'. It certifies NOTHING about probabilistic propagation,
        about objects built from non-instance points, about curve-level or
        walk-level objects, or about the hardness of the ECDLP; and its one
        exponent statement (rho saturates the generic canonicalisation
        bound) is conditional on KN-TECH-005 exactly as 863e36's C4 is.
      nearby_object_control: >-
        Composite n (fixture (d)): the affine group over Z/6 has proper
        blocks (reduction mod 2 and mod 3), so Theorem B fails and the
        enumeration must show it, which is the Pohlig-Hellman cell
        (KN-TECH-030) in this frame. And E[ell] (fixture (e)): the object the
        theorem produces is productive there. A pipeline that reports
        'nothing' on either has not identified the load-bearing structure,
        which is primality of n and the size of Gamma respectively.
    proof_obligations:
      - claim: >-
          Deterministic propagation under Sigma is equivalent to invariance
          of the fibre partition under <Sigma>.
        responsibility: correctness
      - claim: >-
          Stab(v) in GL_m(F_n) has exactly n - 1 singleton orbits and one
          further orbit on nonzero vectors.
        responsibility: correctness
      - claim: >-
          A subgroup containing Stab(v) whose orbit of v leaves the line
          F_n.v is all of GL_m.
        responsibility: strictness
      - claim: >-
          AGL_m(F_n) is 2-transitive on F_n^m, hence primitive.
        responsibility: correctness
      - claim: >-
          Every Gamma-orbit partition at m >= 2 has at least n + 1 blocks.
        responsibility: size
      - claim: >-
          The m = 1 slices reproduce df906f, 863e36 and A3-6 T1 exactly.
        responsibility: baseline
      - claim: >-
          Rho's cost 0.886 sqrt(n) equals Theta(sqrt(|Gamma|)) for Gamma =
          F_n^* on pairs, conditional on KN-TECH-005 via 863e36 C4.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      An m-tuple of instance-derived points R = (a_i P + b_i Q)_i, projected
      to a set; concretely the diagonal Gamma-orbit label and the projective
      class [R_1 : ... : R_m].
    lossiness: >-
      The projective class discards exactly one scalar (log2(n - 1) bits from
      m log2(n)), compatibly with every recombination, so it PASSES the
      lossy-projection test non-vacuously -- and it is uncomputable at the
      price of the problem, because for m = 2 it IS the discrete logarithm.
      The Gamma-orbit labels discard log2(|Gamma|) bits compatibly with the
      diagonal scalings and with nothing else. The linear images of Theorem
      C discard only bookkeeping and FAIL the test as changes of coordinates.
      The record's finding is that this exhausts the exact regime on tuples.
    propagation: >-
      Exact by construction under the respective operation sets; under the
      walk step (a translation) the projective class and the Gamma labels do
      not propagate at all (Theorem B), which is why a walk on the
      Gamma-quotient of pairs would need re-canonicalisation at cost c_can
      exactly as in 863e36, on a quotient of size at least n + 1 -- worse
      than the single-point walk on every axis.
    survival_score: >-
      Survives all recombinations forever (invariant) and dies at the first
      translation. The interesting number is not survival depth but the
      image floor n + 1, which says the tuple setting cannot beat the point
      setting in this regime at all.

  null_object_control: >-
    NULL-1, THE COMPOSITE-ORDER GROUP (blocking, nearby object where the
    conclusion must FAIL): the Stage 1 fixture over Z/6 x Z/6 must return
    strictly more than 2 AGL-invariant partitions, with the reductions mod 2
    and mod 3 among them. If it returns 2 the code cannot see the case the
    theorem excludes and every prime-case count is void.
    NULL-2, THE RANDOM PARTITION (blocking): a uniformly random partition of
    F_n^2 minus zero into blocks of equal size must be reported NON-invariant
    under GL_2 by the invariance checker; a checker that accepts it is
    accepting everything.
    POSITIVE CONTROL A (blocking): the projective partition of F_n^2 minus
    zero, constructed directly as the lines through the origin, must be
    reported invariant under GL_2 and NOT invariant under any nonzero
    translation.
    POSITIVE CONTROL B (blocking, the productive instance): F_ell^2 at
    ell in {3, 5, 7} must return ell + 1 projective blocks.
    CONTROL C, THE m = 1 SLICE: counts must equal 863e36's and df906f's.
    A REPORTED FINDING IS NOTHING UNTIL ALL FIVE PASS; the record is
    otherwise a pen-and-paper derivation with no evidence status.

  discriminated_from:
    - >-
      IDEA-20260815-528b6e. That record ASKS whether the rigidity argument
      extends to pairs and predicts that the product group's subgroup
      structure is where it may fail. This record ANSWERS it: under
      translations it fails harmlessly (linear images), under recombination
      the only survivors are diagonal scalings and the projective class,
      under both it holds. Both of 528b6e's nulls are discharged: the
      difference map is Theorem C's simplest case and the collision
      indicator is placed in C5.iii. The operation-level difference is that
      528b6e never fixes an operation set for pairs; this record fixes three
      and proves a theorem for each.
    - >-
      IDEA-20260901-863e36. Same block lemma, m = 1 only, and its search
      object is the Gamma-orbit of ONE point. This record's new content is
      m >= 2: the projective class appears only at m >= 2, the image floor
      n + 1 is an m >= 2 statement, and the identification of rho as the
      canonicalisation of the maximal block at cost sqrt(|Gamma|) is a
      consequence 863e36 did not draw. The cost law and C4 are cited from
      863e36, not re-derived.
    - >-
      IDEA-20260807-df906f and IDEA-20260806-c5d183. Both are m = 1 under
      translation. Theorem C contains df906f as its m = 1 case; Theorem B
      contains c5d183's orbit argument as its m = 1, GL_1-trivial case.
      c5d183's trichotomy is used to PLACE rho's collision object (Class I
      with H the diagonal), not re-derived.
    - >-
      Catalogue A3-6. Its AGL(1, Z/n) acts on the INDEX across instances and
      its conclusion is about information content; this record's AGL_m acts
      on TUPLES within one instance and its conclusion is about
      deterministic propagation. They meet at m = 1, where T1 there and
      Theorem B here say the same thing in different quantifiers.
    - >-
      IDEA-20260808-fa1d80. Uses the N + 1 isotropic lines as a search space
      and asks for a propagation rule for an Igusa certificate along them.
      This record identifies those lines as the projective block system of
      GL_2 and prices canonicalising it at the generic bound; it does not
      address the Igusa certificate and does not contradict fa1d80 anywhere.
    - >-
      H-PROP-c95932. Bounds auxiliary state that is a function of ONE point
      and explicitly excludes pair-dependent state. Theorem C is the exact
      statement for state that is a second point: the pair (v(R), R') with
      R' a known-combination point is a linear image plus a single-point
      object, so the bound |S| |A| >= N transfers with A = G. Not claimed as
      part of that hypothesis; stated so the two records do not overlap.
    - >-
      IDEA-20260901-3e68ad. Its operation set is the curve's automorphism
      group (origin-moving symmetries of ONE point); this record's is the
      recombination group of a TUPLE. Both use 'gcd with N' style arguments
      to collapse a richer-looking symmetry to a known one; the objects and
      the groups are different and neither implies the other.
    - >-
      The RQ-ECDLP-160d89 four-list line (family 6, off-limits as a lens).
      That line is entirely in the PROBABILISTIC regime on pairs (keyed joins,
      additive energy). This record's theorems are exact-regime only and
      say nothing about it; C5.i is not a bound on any keyed join.

  predictions:
    - metric: >-
        M1 -- number of GL_2(F_n)-invariant partitions of F_n^2 minus zero,
        by complete enumeration, at n in {5, 7, 11, 13}
      direction: different
      minimum_effect: >-
        EXACTLY d(n - 1) + 1, i.e. 4, 5, 5, 7 respectively, with every
        nontrivial block a Gamma-orbit. This is a decision, not an estimate;
        any other count refutes Theorem A at that n and stops the record.
    - metric: >-
        M2 -- number of AGL_2(F_n)-invariant partitions at the same n
      direction: different
      minimum_effect: >-
        EXACTLY 2. Any other value refutes Theorem B.
    - metric: >-
        M3 -- number of blocks of the smallest nontrivial GL_2-invariant
        partition at each n
      direction: different
      minimum_effect: >-
        EXACTLY n + 1 (the projective line). This is the image floor C5.i
        at m = 2.
    - metric: >-
        M4 -- number of AGL_2(Z/6)-invariant partitions of (Z/6)^2 minus
        zero (nearby-object control)
      direction: higher
      minimum_effect: >-
        STRICTLY MORE THAN 2, with the mod-2 and mod-3 reduction partitions
        present. Equal to 2 means the checker is blind and everything is
        void.
    - metric: >-
        M5 -- number of projective blocks of F_ell^2 minus zero at ell in
        {3, 5, 7}
      direction: different
      minimum_effect: >-
        EXACTLY ell + 1, the count of ell-isogeny kernels. Known-answer
        positive control.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write Theorems A, B, C with the two
      named delicate steps spelled out. STAGE 1 (minutes, pure Python, no
      curve arithmetic): the five enumerations (a)-(e) of the mechanism, each
      invariance check run against a generating set with explicit orbit
      closure, reporting M1-M5. STAGE 2 (optional, reading only): the
      placement table of the corpus's m >= 2 objects. NO CURVE IS TOUCHED and
      no discrete logarithm is computed; the whole test is finite group
      theory at n <= 13 and ell <= 7.
    controls:
      - NULL-1 composite-order group Z/6 x Z/6 must show extra blocks (blocking)
      - NULL-2 random equal-block partition must be reported non-invariant (blocking)
      - POSITIVE CONTROL A projective partition invariant under GL_2 and not under translations (blocking)
      - POSITIVE CONTROL B F_ell^2 returns ell + 1 projective blocks (blocking)
      - CONTROL C m = 1 slice reproduces 863e36 and df906f counts (blocking)
      - invariance checked on the generated group via orbit closure, not on generators alone (instrument check)
    required_metrics:
      - M1 through M5 as exact integers per n and per ell
      - the list of blocks of every nontrivial invariant partition at n = 7, archived verbatim
      - pass or fail of every control
      - wall-clock per stage (expected seconds)

  falsification_conditions:
    - >-
      F1. The enumeration at some n <= 13 returns a GL_2-invariant partition
      whose blocks are not Gamma-orbits. Theorem A is false as stated; the
      record is superseded, and the exhibited partition is archived as the
      refutation artifact -- it would be a genuinely new exact object on
      pairs and the single most interesting outcome available here.
    - >-
      F2. M2 differs from 2 at some prime n. Theorem B is false; same
      disposition.
    - >-
      F3. M4 equals 2 or POSITIVE CONTROL A or B fails. The instrument is
      blind or broken; nothing is reported.
    - >-
      F4. M1, M2, M3 and M5 all match and the controls pass. The predicted
      outcome: the exact regime on tuples is CLOSED with a mechanism (block
      systems of GL_m and AGL_m), the pairs cell of 528b6e is answered, and
      the honest headline is 'tuples cannot beat points exactly, the DL is
      the maximal block, and rho canonicalises it at the generic bound'.
    - >-
      F5. A reviewer exhibits an instance-derived tuple object that
      propagates deterministically under a generating set of GL_m but whose
      fibres are not invariant under the generated group. This would refute
      the block lemma (C1), which is four lines; it is listed because the
      lemma is the one step every theorem here rests on.

  confounders:
    - >-
      Generators versus group. A checker that tests invariance only under
      the listed generators and not under products can accept partitions
      that are not blocks; the orbit-closure requirement exists for this.
    - >-
      The zero vector. Excluding the zero tuple is what makes GL_m
      transitive; a fixture that includes it will count one extra fixed
      block and every count shifts by one. Stated so a mismatch by exactly
      one is diagnosed rather than reported as a refutation.
    - >-
      Reading (C5.ii) as an attack statement. It is a cost IDENTIFICATION
      (rho's known cost equals the generic canonicalisation bound for the
      maximal block), conditional on KN-TECH-005, and it moves nothing.
    - >-
      Confusing the exact regime with the probabilistic one. Every theorem
      here is exact-regime; the four-list line lives in the other regime and
      is neither closed nor touched.

  interpretation_limits:
    - >-
      Exact regime only. Nothing here bounds probabilistic propagation of
      tuple objects, which is where family 6 works and where a real
      advantage, if any exists on pairs, would live.
    - >-
      Instance-derived tuples only. Objects built from torsion points over
      extensions (E[ell], where C5.iv shows the same theorem is productive),
      from other curves, from lifts, or from the curve as a whole are
      outside the scope and are the remaining exact-regime classes.
    - >-
      (C5.ii) is conditional on KN-TECH-005 exactly as 863e36's C4 is, and
      carries that record's caveat that the generic bound is a barrier and
      not a proof that no non-generic canonicalisation exists.
    - >-
      No attack, no exponent, no status change. The fixture is finite group
      theory at n <= 13 and licenses nothing at cryptographic n except by
      the proofs, which are the deliverable.

  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    NONE. Every load-bearing step (the block lemma, the orbit structure of a
    vector stabiliser, the counting argument for the overgroup, the
    2-transitivity of the affine group, the coset description of blocks of a
    regular action) is unconditional finite group theory over the field F_n
    with n prime, and the fixture decides each at small n exactly. The single
    conditional statement in the record, C5.ii's cost identification, inherits
    863e36's H1 and the KN-TECH-005 caveat and is labelled as conditional
    where it appears; it is not a heuristic of this record and no theorem here
    depends on it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and none can follow: the record's
      content is that the exact regime on tuples contains only objects
      strictly worse than the single-point Gamma-quotients of 863e36, whose
      own predicted outcome is c_can = Theta(r) and no gain. If one insisted
      on a conditional statement: a walk on the diagonal Gamma-quotient of
      pairs costs about 0.886 sqrt((n^2 - 1)/|Gamma|) (c_step + c_can) >=
      0.886 sqrt(n + 1) (c_step + c_can), i.e. exponent 1/2 at best and a
      constant WORSE than plain rho for every Gamma. The fixture itself costs
      seconds.
    memory_exponent: >-
      Negligible for the fixture. The conditional pair walk above is O(1)
      memory like rho and is dominated by rho on time, so no tradeoff
      position is claimed.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map at
      about 0.886 sqrt(n) group operations serial, about sqrt(n)/m wall clock
      on m processors, small per-processor memory (KN-TECH-006, read in full
      this session; the convention includes the sqrt(2) negation factor per
      KN-TECH-018); BSGS at 2 sqrt(n) time and sqrt(n) memory; kangaroo at
      2 sqrt(L) on an interval promise; automorphism-discounted rho at
      sqrt(|Aut|), i.e. up to sqrt(6) on j = 0 curves (KN-TECH-018);
      Pohlig-Hellman fixing which n is at issue (KN-TECH-030); generic
      preprocessing at S T^2 = Omega~(n) (KN-TECH-005).
    hidden_overhead: >-
      Nothing is hidden because nothing is claimed; the only o(1) in sight is
      863e36's canonicalisation polylog inside c_can, inherited only in the
      conditional pair-walk cost above, which is stated as worse than rho.
    tradeoff_note: >-
      Not applicable. The image floor C5.i is itself a tradeoff statement in
      the negative: enlarging the tuple enlarges the quotient, so the tuple
      axis trades nothing for anything.

  dominated_by: >-
    AS AN ATTACK: mounts none, and is dominated on every axis by every row of
    the prime-field frontier, checked row by row. (1) Parallel rho with
    distinguished points and negation, 0.886 sqrt(n) time, O(1) memory per
    processor, linear parallel speedup (KN-TECH-006): dominates on time and
    ties on memory against the conditional pair walk, which is worse by
    construction. (2) BSGS, 2 sqrt(n) time, sqrt(n) memory: dominates on
    time, dominated on memory. (3) Pollard kangaroo, 2 sqrt(L) on an interval
    promise: not comparable, solves a promise problem. (4) Automorphism-
    discounted rho, sqrt(|Aut|) up to sqrt(6) (KN-TECH-018): dominates, and
    is the Gamma inside Aut(E) special case of 863e36's family, which this
    record's pair version can only make worse. (5) Pohlig-Hellman
    (KN-TECH-030): not comparable, it fixes which n is at issue and is the
    composite-order control here. (6) Generic preprocessing at S T^2 =
    Omega~(n) (KN-TECH-005): dominates on online time, dominated on advice;
    generic, so (C5.ii)'s bound applies to it too. Data and query axis: no
    oracle queries and no solve. AS A STRUCTURAL CONTRIBUTION the nearest
    incumbents are IDEA-20260901-863e36 (dominates on the cost law and the
    measurement design, dominated here on the range m >= 2 and on the
    projective class) and IDEA-20260807-df906f (dominates on economy of its
    single theorem, dominated here on the operation sets covered).
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries, +0 on the constant factor.
    Quantified deltas actually claimed: (i) a complete classification of
    exact lossy objects on m-tuples under three operation sets, at zero
    compute, containing df906f, 863e36's C1/C3 and A3-6's T1 as its m = 1
    slices; (ii) the image floor n + 1 for m >= 2, which closes the pairs
    cell of 528b6e in the exact regime with a mechanism rather than a tally;
    (iii) the identification of the discrete log as the maximal block of the
    pair action and of rho's 0.886 sqrt(n) as Theta(sqrt(|Gamma|)) for
    |Gamma| = n - 1, saturating 863e36's generic canonicalisation bound;
    (iv) the E[ell] control showing the identical theorem produces a
    productive object where |Gamma| is small. No exponent moves and none is
    claimed.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that Theorems A-C are correct as stated; the residual is a missed
    intermediate subgroup in the overgroup step of Theorem A, which the
    n <= 13 fixture would expose. 0.9 that the corollaries survive review as
    stated, the residual being the exact conditional status of (C5.ii)
    inside KN-TECH-005's caveat. OUTCOME split on the fixture: 0.93 all
    counts match (closure branch F4), 0.02 a count mismatch that survives
    the off-by-one and generator confounders (a genuine refutation, F1 or
    F2), 0.05 an instrument failure caught by the controls. The most likely
    honest headline is 'the exact regime on tuples is closed by finite group
    theory, tuples cannot beat points, the discrete log is the maximal block,
    and rho is its canonicalisation at the generic bound'.

