idea:
  id: IDEA-20260807-146aa8
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    THE THREE-REGIME SCREEN FOR "ELL-TORSION LEAKS k": exactly three regimes exist
    at ell != N -- (i) the base point has composite order with an ell-part, which is
    Pohlig-Hellman and is a change of INSTANCE not of ALGORITHM; (ii) the adversary
    can make the secret act on attacker-chosen points outside G, which is the
    invalid-curve / small-subgroup family and needs an oracle the plain ECDLP does
    not provide; (iii) the pure prime-order instance, where nothing leaks by the
    coprimality theorem -- and every future L7 proposal must declare its regime
    before it is dispatched
  class: control

  claim: >-
    (A) THE TAXONOMY, EXHAUSTIVE OVER THE WAY ell-TORSION CAN TOUCH k. Fix a prime
    ell != N. There are exactly three ways ell-torsion data can be connected to the
    secret scalar, and they are distinguished by ONE question: what does the secret
    get applied to?
      REGIME (i) -- THE SECRET IS APPLIED TO A POINT WHOSE ORDER IS DIVISIBLE BY
        ell. This happens when the base point is not of prime order, e.g. a
        generator of the full group E(F_p) of order h*N with ell | h. Then the
        projection to the ell-part recovers the secret modulo ell, and CRT
        recombination across the prime factors of the order is Pohlig-Hellman
        (KN-TECH-030). THIS IS NOT NOVEL AND THIS RECORD DOES NOT PRESENT IT AS
        SUCH. It is also, importantly, NOT AN ALGORITHM IMPROVEMENT: it changes what
        "the instance" is, and KN-TECH-030's own framing is that Pohlig-Hellman
        fixes the effective problem size rather than beating rho. A proposal that
        arrives at "k mod ell is recoverable from the cofactor's ell-part" has
        arrived at regime (i) and has rediscovered Pohlig-Hellman; the correct
        disposition is to say so and stop.
      REGIME (ii) -- THE SECRET IS APPLIED TO AN ATTACKER-CHOSEN POINT OUTSIDE G.
        This requires an ORACLE that computes [k]R for an R the adversary supplies.
        Given such an oracle, ell-torsion at ell != N leaks k modulo ell in two
        classical ways: the small-subgroup confinement attack (Lim-Lee, KN-LIT-091
        as recorded in KN-TECH-034) supplies a low-order element of the same curve;
        the invalid-curve attack (Biehl-Meyer-Muller, KN-LIT-092; and the protocol
        variants of KN-LIT-7441 combining both ideas) supplies a point on a
        DIFFERENT curve E'' sharing the a-coefficient, whose order is smooth, so the
        device's arithmetic silently computes in E''(F_p) and leaks k modulo the
        small factors. THESE ARE REAL AND DEPLOYED-RELEVANT AND THEY ARE THE ONLY
        PLACE WHERE ell-TORSION AT ell != N DEMONSTRABLY LEAKS k. They are also
        outside the plain ECDLP model: KN-TECH-034 draws exactly this line -- "these
        attacks require an oracle, chosen inputs, a static reused secret, or fault
        injection; the program's target is the plain ECDLP: given E, P, Q, find k,
        with no interaction."
      REGIME (iii) -- THE PURE INSTANCE: (E, P, Q) with P of prime order N and no
        oracle. Then nothing leaks, and this is not an empirical observation but a
        theorem: IDEA-20260807-6eab6a shows every homomorphic ell-primary invariant
        vanishes identically on G, and IDEA-20260807-df906f shows every exactly
        propagating lossy projection on a prime-order group is injective or
        constant. The two together cover the homomorphic and the
        exactly-propagating-lossy families respectively.
    EXHAUSTIVENESS ARGUMENT, which is what makes this a taxonomy rather than a list:
    for ell-torsion data to depend on k at all, k must have acted on something. In
    the ECDLP setting k acts only on P and only through the given Q = [k]P. So
    either (a) the thing k acted on has ell in its order -- regime (i) -- or (b) the
    adversary can cause k to act on something else -- regime (ii) -- or (c) neither,
    which is regime (iii). There is no fourth branch, and the branch condition is
    decidable by inspection of the proposal.

    (B) THE CIRCULARITY GATE, WHICH IS THE OPERATIONAL DELIVERABLE. Every future L7
    proposal (and, this record argues, every proposal in this campaign that claims
    ANY k-dependence) must declare, before dispatch:
      D1 -- its REGIME, one of (i), (ii), (iii).
      D2 -- if (i): an explicit statement that this is Pohlig-Hellman, a citation of
        KN-TECH-030, and the resulting EFFECTIVE problem size, since the honest
        headline is a change of instance.
      D3 -- if (ii): the exact oracle assumed, its query model, and an explicit
        acknowledgement that the result lives in the leakage/chosen-input model and
        is not a mathematical advance on the ECDLP (KN-TECH-034's scope boundary,
        the same line KN-OPEN-011 draws for the Hidden Number Problem).
      D4 -- if (iii): the specific reason the coprimality theorem and the rigidity
        theorem do not apply -- i.e. the proposal must name which of the four
        escapes (probabilistic propagation, auxiliary state, objects on E[ell]
        rather than on G, objects not tracked under the group law) it is using.
      D5 -- A CIRCULARITY CHECK: does any step of the proposed computation require
        knowing k, or a discrete logarithm, or an eigenvalue obtainable only by
        solving one? H-ENDO-001's assumption list already excludes "any phi whose
        eigenvalue could only be obtained by solving a discrete logarithm... the
        exclusion is stated because it is exactly where circularity would otherwise
        enter." D5 generalises that exclusion to every L7 mechanism.
    A PROPOSAL THAT CANNOT FILL D1-D5 IS NOT REJECTED ON MERIT; IT IS RETURNED FOR
    COMPLETION. That distinction matters, because docs/inventor-protocol.md forbids
    declining to generate on saturation grounds, and this gate is a completeness
    requirement rather than a saturation argument.

    (C) THE TWO OUTCOMES OF APPLYING THE SCREEN, BOTH DELIVERABLES.
      OUTCOME 1 -- every existing and future L7 mechanism classifies into (i), (ii)
        or (iii) with the classification agreed by an independent reviewer. Then the
        taxonomy is a working screen, the lane has a cheap disposition rule, and the
        exhaustiveness argument in (A) is corroborated by use.
      OUTCOME 2 -- some mechanism resists classification. Then the exhaustiveness
        argument is wrong, there is a fourth way ell-torsion can touch k, and
        finding it would be the single most valuable result this lane could produce.
        This is the branch that makes the record falsifiable rather than definitional,
        and it is why the screen is proposed as a testable artifact and not as a
        rule.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE as an audit. It consumes no non-generic resource and mounts no
    attack. Its function is to classify OTHER proposals' resource use, which makes
    it a companion to the DECOMPOSITION.md section 2 admissibility filter rather
    than a competitor: the filter asks "which resource does this consume?" and this
    screen asks "in which regime does the claimed k-dependence live?". A proposal
    can pass the resource filter (its resource genuinely escapes the generic group
    model) and still be in regime (ii) and therefore outside the plain ECDLP -- that
    combination is exactly what an unscreened batch produces, and it is what this
    record exists to catch.

  discriminated_from:
    - >-
      KN-TECH-034 (curve and point validation). That entry already states the
      four validation checks, the attacks each blocks, and the scope boundary
      separating the chosen-input/fault model from the plain ECDLP. THIS RECORD'S
      REGIME (ii) DUPLICATES KN-TECH-034 AND SAYS SO -- no novelty is claimed there
      and none exists. What is new is (a) the three-regime EXHAUSTIVENESS argument,
      which KN-TECH-034 does not make, (b) regime (iii)'s theorem, which is new to
      this corpus via IDEA-20260807-6eab6a, and (c) the D1-D5 declaration gate,
      which turns the scope boundary into a pre-dispatch obligation instead of a
      post-hoc classification judgement.
    - >-
      KN-TECH-030 (Pohlig-Hellman). Regime (i) IS KN-TECH-030 and is cited as such.
      The addition is the explicit statement that arriving at regime (i) from an
      ell-torsion direction is a rediscovery and that its honest headline is a
      change of instance.
    - >-
      IDEA-20260807-6eab6a. That record proves regime (iii)'s vanishing theorem for
      homomorphic invariants. This record does not reprove it; it uses it as one of
      three branches and adds the branch structure and the gate.
    - >-
      KN-OPEN-011 (the Hidden Number Problem / leakage-model boundary, cited via
      KN-TECH-034's reference to it). The same line is drawn there for nonce
      leakage; this record draws it for torsion leakage and notes the parallel
      rather than claiming the line as new.

  object_first_candidate:
    tracked_object: >-
      THE REGIME LABEL of a proposed mechanism: which of the three ways the secret
      can have acted on ell-divisible data the mechanism relies on, together with
      the D1-D5 declarations.
    lossiness: >-
      Extremely lossy: an entire proposal collapses to one of three labels plus five
      declarations. It forgets the mathematics, the cost model, and the experimental
      design. What it retains is the only thing needed to decide whether a claimed
      k-dependence can exist at all.
    propagation: >-
      Propagates through composition in a specific and useful way: a mechanism built
      by composing a regime-(iii) step with a regime-(ii) step is regime (ii),
      because the weakest link determines the model the result lives in. This makes
      the label monotone under composition and prevents a leakage-model dependence
      from being laundered through a chain of pure-instance steps.
    survival_score: >-
      Survives as long as the exhaustiveness argument in (A) does. It dies the
      moment a mechanism is found that classifies into none of the three, which is
      OUTCOME 2 and would be a genuine discovery.

  mechanism: >-
    STEP 1 (zero compute) -- write the taxonomy and the exhaustiveness argument in
    the form of (A), with each regime's citation and each regime's honest headline.

    STEP 2 (zero compute) -- write the D1-D5 declaration block as a YAML fragment
    for inclusion in proposal records, and apply it retrospectively to every L7
    proposal in BATCH-cb71b5 as a worked classification. That retrospective pass IS
    the record's first test: if any of this batch's nine proposals cannot be
    classified, OUTCOME 2 has fired inside the batch that proposed the screen.

    STEP 3 (small compute, and the only compute in this proposal) -- a
    KNOWN-ANSWER DEMONSTRATION of each regime at toy scale, so the taxonomy is
    exhibited rather than asserted:
      3a. REGIME (i) demonstration: on a toy curve with #E(F_p) = h*N and a small
        prime ell | h, take a generator of the full group, form the analogue
        instance, and recover the secret modulo ell by projecting onto the ell-part.
        Verify against ground truth. Label the output "Pohlig-Hellman,
        KN-TECH-030" in the artifact itself.
      3b. REGIME (ii) demonstration, RUN ONLY AS A SIMULATED ORACLE ON THIS
        PROGRAM'S OWN TOY INSTANCES AND NEVER AGAINST ANY EXTERNAL SYSTEM: implement
        a deliberately non-validating scalar-multiplication routine, feed it a point
        of small order ell on a different curve sharing the a-coefficient, and
        confirm that the returned value determines k modulo ell. This is a
        reproduction of a published attack (KN-LIT-092 / KN-LIT-091 as recorded in
        KN-TECH-034) on a self-generated toy target, is lawful defensive
        cryptanalysis under RQ-TORS-8c7b79's constraints, and exists to fix the
        regime boundary empirically -- it demonstrates that the leak is real and
        that it requires the oracle, which is the whole point.
      3c. REGIME (iii) demonstration: the same ell, the same curve, the PRIME-ORDER
        base point, no oracle -- and the coprimality corollaries return their forced
        values (0 and 1), confirming no leak. Cross-referenced to
        IDEA-20260807-6eab6a's STAGE 1.
    THE THREE DEMONSTRATIONS TOGETHER ARE THE INSTRUMENT'S DYNAMIC RANGE: a leak
    that is present (3a, 3b) and a leak that is absent (3c), on the same curve, at
    the same ell, differing only in the regime condition. That is the graded control
    KN-TECH-1a5b7e's obligation 3 demands, realised as a three-point ladder rather
    than a two-end gate.

    STEP 4 (zero compute) -- forward guidance: name what remains open after the
    screen. Regime (iii)'s four escapes (from IDEA-20260807-df906f claim C), and
    the boundary case ell = N which no regime covers because the taxonomy is stated
    for ell != N -- at ell = N the relevant families are pairing transfers
    (KN-TECH-032) and, in the single coincidence ell = N = p, the anomalous break
    (KN-TECH-033).

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "invalid curve\|invalid-curve\|small subgroup\|small-subgroup" knowledge/ ledger/`;
      `grep -ril "Pohlig" knowledge/ ledger/ docs/`;
      `grep -n "scope boundary\|leakage model" knowledge/techniques/KN-TECH-034.md`;
      plus full reads of KN-TECH-030, KN-TECH-034, KN-TECH-033, and the header
      lines of KN-LIT-091, KN-LIT-092, KN-LIT-093, KN-LIT-7441 as they appear in
      KN-TECH-034's table and in the corpus index.
    results: >-
      KN-TECH-034 covers regime (ii) completely, including the scope boundary and
      the two-sided validation obligation from Biehl-Meyer-Muller. KN-TECH-030
      covers regime (i) completely. NEITHER states an exhaustiveness argument over
      the regimes, neither treats regime (iii) as a theorem, and NO record in
      ledger/ or knowledge/ contains a pre-dispatch declaration gate of the D1-D5
      shape. KN-LIT-091 (Lim-Lee small subgroup), KN-LIT-092 (Biehl-Meyer-Muller
      differential fault / invalid curve), KN-LIT-093 (twist security /
      Curve25519) and KN-LIT-7441 (protocol attacks combining small-subgroup and
      invalid-curve ideas) are present in the corpus; ALL FOUR are recorded at
      partial or abstract-level verification in their own `Not verified here`
      sections, and this record relays them at that level and does not upgrade them.
    verdict: >-
      ADAPTATION, with regime (ii) an explicit DUPLICATE of KN-TECH-034 that is
      filed anyway because a taxonomy with a hole is not a taxonomy. The new content
      is the exhaustiveness argument, regime (iii) as a theorem, the composition
      rule for the regime label, and the D1-D5 gate. External novelty UNVERIFIED --
      no web search was performed this session and the four cited papers were not
      read in full here.

  null_object_control: >-
    MANDATORY AND SUPPLIED, as a three-point dynamic range on ONE curve at ONE ell,
    which is what makes the taxonomy an instrument rather than a definition.
    MATCHED NULL OBJECT: demonstration 3c -- the same curve, the same ell, the same
    torsion computation, differing from 3a ONLY in that the base point has prime
    order, and from 3b ONLY in that no oracle is available. The null therefore
    removes exactly one thing (the regime condition) and preserves everything else:
    the curve, the field, the prime ell, the torsion structure, and the entire
    computation. KN-TECH-1a5b7e's `object_preserved` line is the one that matters
    here and it is long.
    DECAY PARAMETER: the ell-valuation of the order of the point the secret acts on.
    As v_ell(ord(point)) falls from >= 1 to 0, the recovered information about k
    modulo ell must fall from complete to nil. A recovered value that persists at
    v_ell = 0 is the canonical artifact tell and would mean the demonstration is
    leaking k through the harness rather than through the mathematics -- exactly the
    circularity D5 guards against, which is why the demonstrations must run under
    the redacted-instance guard of IDEA-20260807-bd5d91's G3.
    CAN THIS NULL FAIL? YES: 3c could return a non-trivial value, which would
    contradict the coprimality theorem and halt everything; or 3a/3b could fail to
    recover k modulo ell, which would mean the demonstrations are not exhibiting the
    regimes they claim.

  assumptions:
    - >-
      "The plain ECDLP" means: given (E, P, Q) with P of prime order N and
      Q = [k]P, find k, with no interaction and no oracle. This is the program's
      stated target (KN-TECH-034's scope boundary) and the taxonomy's regimes are
      defined relative to it.
    - >-
      Regime (ii)'s demonstrations are run against self-generated toy instances only.
      RQ-TORS-8c7b79's constraints forbid targeting live keys, wallets or deployed
      systems, and 3b is a reproduction of a published attack against this program's
      own deliberately non-validating routine.
    - >-
      The exhaustiveness argument assumes k acts only through the given Q in the
      plain model. If a future proposal introduces another way for k to act -- for
      example a multi-instance setting where several targets share k, or a
      preprocessing model -- the taxonomy must be re-examined, and that is a named
      revisit condition rather than a hidden assumption.
    - >-
      KN-LIT-091, 092, 093 and 7441 are relayed at the verification level recorded
      in their own entries (partial/abstract). No claim about their contents beyond
      what KN-TECH-034's table states is made here.

  proof_search_map:
    bottleneck: >-
      The exhaustiveness argument in (A) is the whole load-bearing step. Everything
      else is citation or demonstration. If exhaustiveness fails, the gate becomes a
      checklist rather than a screen and its disposition authority evaporates.
    baseline_embedding:
      parameter_slice: >-
        Regime (i) at ell | h with a full-group generator: the exact boundary where
        the taxonomy meets the textbook. At that slice the screen must reproduce
        Pohlig-Hellman's known answer -- k modulo ell recovered, effective problem
        size reduced to the largest prime factor.
      reproduction_check: >-
        Frozen fixture: one toy curve with a known factored order h*N, ell | h, the
        recovered residue compared by exact integer equality against ground truth,
        and the effective problem size reported as sqrt(N) rather than
        sqrt(h*N) per KN-TECH-030 obligation 1. A mismatch means the regime-(i)
        demonstration is not Pohlig-Hellman and the taxonomy's first branch is
        mislabelled.
    observation_collision:
      observable: >-
        The regime label assigned to a mechanism.
      distinct_preimage_search: >-
        REQUIRED, AND THE INTERESTING DIRECTION IS THE ONE THAT MUST NOT SUCCEED:
        find two mechanisms with the same regime label whose actual model
        assumptions differ materially -- for instance one requiring a static reused
        secret and one requiring only a single chosen input, both labelled (ii).
        Such a collision does not falsify the taxonomy but shows the label is too
        coarse for dispatch decisions, and the fix is D3's requirement to state the
        exact oracle and query model rather than only the regime. Recording that the
        label alone is insufficient, and that D3 carries the weight, is part of the
        audit.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "can this mechanism leak k?" into the single decidable question
          "what did k act on?", where the answer is a finite case split rather than
          an open-ended analysis. Encoding obligation: the proposal must state what
          k acts on. Soundness obligation: the case split must be exhaustive (the
          argument in (A)). Cost-loss obligation: the label is coarse and D3 must
          carry the model detail.
        predicted_gain: >-
          A pre-dispatch screen costing zero compute, replacing per-proposal
          case-by-case judgement. No attack gain.
    quantifier_order: >-
      Claimed: FORALL primes ell != N, FORALL mechanisms whose output depends on k,
      THERE EXISTS a regime label in {(i), (ii), (iii)} that the mechanism satisfies,
      and the label is determined by what k acted on. AND: FORALL mechanisms in
      regime (iii), FORALL homomorphic ell-primary invariants, the value is constant
      in k (by IDEA-20260807-6eab6a). The dangerous weaker reading NOT claimed:
      "for every mechanism there exists SOME regime in which it could leak", which
      would be vacuous because regime (ii) can be assumed into any setting by
      granting an oracle -- which is precisely why D3 requires the oracle to be
      stated explicitly rather than assumed silently.
    method_ceiling:
      strongest_certifiable_claim: >-
        "This mechanism's claimed k-dependence requires either a composite-order
        base point (Pohlig-Hellman) or an oracle applying k to attacker-chosen
        points (leakage model), or else it is inconsistent with the coprimality and
        rigidity theorems." It can NEVER certify that a mechanism in regime (iii)
        is impossible -- the theorems cover the homomorphic and exactly-propagating
        families, not everything -- and it can never certify anything at ell = N.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS is the anomalous curve
        (KN-TECH-033): there N = p, the coprimality hypothesis is void, and torsion
        at the group-order prime breaks the ECDLP outright in O(log p) field
        operations. A screen that could not distinguish the anomalous case from the
        general one would be claiming too much, and exhibiting that boundary is
        mandatory in the write-up.
    proof_obligations:
      - claim: The three regimes are exhaustive for ell != N in the plain model.
        responsibility: correctness
      - claim: Regime (i) reproduces Pohlig-Hellman on the frozen fixture.
        responsibility: baseline
      - claim: Regime (ii) requires an oracle and does not arise without one.
        responsibility: scope
      - claim: Regime (iii)'s no-leak statement is the cited theorem, not a measurement.
        responsibility: correctness
      - claim: The regime label is monotone under composition (weakest link wins).
        responsibility: correctness
      - claim: Every demonstration runs under the redacted-instance guard.
        responsibility: interface
      - claim: The anomalous boundary ell = N = p is excluded by the taxonomy's scope.
        responsibility: scope

  predictions:
    - metric: >-
        Regime (i) demonstration: recovered k modulo ell on a curve with ell | h,
        using a full-group generator
      direction: different
      minimum_effect: >-
        Exact match with ground truth on 100 percent of cells, and the reported
        effective problem size equal to sqrt(N) rather than sqrt(h*N). BASIS -
        KN-TECH-030, used as a KNOWN-ANSWER CALIBRATION; this campaign has not
        previously run it.
    - metric: >-
        Regime (ii) demonstration on a self-generated toy target with a deliberately
        non-validating routine
      direction: different
      minimum_effect: >-
        Exact recovery of k modulo the small factors of the invalid curve's order on
        100 percent of cells. BASIS - the published attacks relayed via KN-TECH-034
        (KN-LIT-091, KN-LIT-092); used as a KNOWN-ANSWER CALIBRATION and NOT as a
        new result.
    - metric: >-
        Regime (iii) demonstration: the same ell, the same curve, prime-order base
        point, no oracle
      direction: different
      minimum_effect: >-
        Forced values only (0 for the ell-primary homomorphic invariants, 1 for the
        pairings), and zero recovered information about k. A non-forced value
        contradicts IDEA-20260807-6eab6a and halts the line. BASIS - derivation
        there; UNTESTED.
    - metric: >-
        Classification coverage: fraction of this batch's nine L7 proposals that
        receive an agreed regime label under D1-D5
      direction: higher
      minimum_effect: >-
        100 percent, with an independent reviewer concurring on each label. Anything
        below 100 percent fires OUTCOME 2 and is the most interesting possible
        result of this record. BASIS - this is a pre-registered coverage target, not
        a measurement; the retrospective pass in STEP 2 is where it is tested.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the primary deliverable): the taxonomy, the
      exhaustiveness argument, the composition rule, and the D1-D5 block.
      STAGE 1 (zero compute): retrospective classification of all nine L7 proposals
      in BATCH-cb71b5, with an independent reviewer concurring. Any unclassifiable
      proposal fires OUTCOME 2.
      STAGE 2 (minutes): the three demonstrations 3a, 3b, 3c on ONE curve at ONE
      ell, under the redacted-instance guard, with the frozen regime-(i) fixture.
      STAGE 3 (zero compute): forward guidance -- regime (iii)'s four escapes and
      the ell = N boundary.
      BUDGET: minutes of compute. No division polynomials are needed -- ell-torsion
      points are found by multiplying random points by #E/ell -- so this proposal
      carries no ell <= 13 polynomial-degree constraint, only the requirement that
      ell divide the cofactor of a generated toy curve.
    controls:
      - regime (iii) as the matched null on the same curve and the same ell (blocking)
      - frozen Pohlig-Hellman fixture with exact residue comparison (blocking)
      - redacted-instance guard on every demonstration, per IDEA-20260807-bd5d91 G3 (blocking)
      - anomalous boundary exhibited (ell = N = p) as the method-ceiling control
      - independent reviewer concurrence on every regime label
    required_metrics:
      - recovered residue versus ground truth per regime demonstration
      - effective problem size reported per KN-TECH-030 obligation 1
      - forced values (0, 1) in regime (iii)
      - regime label per proposal, with reviewer concurrence flag
      - list of any proposal that could not be classified

  falsification_conditions:
    - >-
      A mechanism is exhibited that depends on k, uses ell-torsion at ell != N, and
      fits none of the three regimes. The exhaustiveness argument is FALSE, the
      taxonomy is withdrawn, and the mechanism becomes the lane's primary object of
      study. This is the outcome that would most justify the record's existence.
    - >-
      Regime (iii) demonstration returns a non-forced value. Contradicts
      IDEA-20260807-6eab6a; treat as a suspected implementation error and replicate
      independently before reporting.
    - >-
      Regime (i) demonstration fails to recover the residue. Pohlig-Hellman is
      textbook; a failure is an implementation error and blocks the fixture.
    - >-
      Regime (ii) demonstration recovers k WITHOUT the oracle. The regime boundary
      is wrong -- either the harness leaks or the attack does not need what
      KN-TECH-034 says it needs -- and either way the taxonomy is unusable until
      resolved.
    - >-
      Two independent reviewers assign different regime labels to the same proposal.
      The labels are not decidable by inspection, and D1-D5 must be sharpened before
      the gate is adopted.

  confounders:
    - >-
      Harness leakage. The toy harness stores k in ECDLPInstance; a demonstration
      that reads it would "recover" k in every regime. The redacted-instance guard
      is mandatory and blocking, and its absence is the single most likely way these
      demonstrations produce a false regime-(iii) leak.
    - >-
      Cofactor availability at toy scale. Regime (i) and (ii) demonstrations need a
      curve with a small prime in the cofactor; harness/toycurve.py selects the
      LARGEST prime factor as N and does not guarantee a usable ell in h. Curve
      selection for these demonstrations must be explicit and recorded, or the
      demonstrations will silently be run on unsuitable curves.
    - >-
      Label coarseness. Regime (ii) covers a wide range of oracle strengths, from a
      single chosen input to a static reused secret with fault injection. D3 carries
      that detail and the label alone must not be used for dispatch decisions -- the
      observation-collision audit above records exactly this limitation.
    - >-
      Scope creep into regime (ii) by assumption. Any proposal may make itself
      "work" by assuming an oracle. D3's requirement to state the oracle explicitly
      is the guard, and a reviewer must check that the oracle is not smuggled in as
      a modelling convenience.

  interpretation_limits:
    - >-
      The taxonomy is stated for ell != N. At ell = N it says nothing, and the
      relevant families there are pairing transfers (KN-TECH-032) and the anomalous
      break (KN-TECH-033).
    - >-
      Regime (ii) results are in the leakage/chosen-input model and are NOT
      mathematical advances on the ECDLP. This record restates KN-TECH-034's line
      and does not soften it.
    - >-
      Regime (iii)'s no-leak statement covers the homomorphic family
      (IDEA-20260807-6eab6a) and the exactly-propagating lossy family
      (IDEA-20260807-df906f). It does NOT cover the four named escapes, and citing
      this record as "regime (iii) is closed" would be an overclaim.
    - >-
      The demonstrations are toy scale; claim_tier capped at toy. The regime-(ii)
      demonstration reproduces published attacks on self-generated targets and
