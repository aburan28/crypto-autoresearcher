  reachability_gate: >-
    NOT APPLICABLE, and stated rather than omitted. The screen moves between no
    curves. One relevant note for lanes that do: the regime label is preserved by
    transport, because transport is injective on G (IDEA-20260807-053a55) and
    therefore does not change what k acted on. A proposal that transports an
    instance and then claims a different regime on the target curve has made an
    error, and the composition rule in object_first_candidate.propagation catches it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. Regime (i) is Pohlig-Hellman, whose cost
      KN-TECH-030 gives as O(sum_i e_i (log n + sqrt(p_i))), dominated by the
      largest prime factor -- i.e. it REDEFINES the exponent's base rather than
      lowering the exponent. Regime (ii) is polynomial in the oracle model but is
      not in the plain model at all. Regime (iii) yields nothing by theorem.
    memory_exponent: >-
      Negligible in all three regimes as demonstrated here; the demonstrations are
      minutes of toy-scale computation.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory per processor (KN-TECH-001, KN-TECH-006);
      automorphism-discounted on CM curves by at most sqrt(|Aut|) (KN-TECH-018);
      BSGS at 2*sqrt(N) time and sqrt(N) memory (KN-TECH-031); Pohlig-Hellman
      (KN-TECH-030) as the reduction that fixes N. This record moves none of them
      and its regime (i) IS one of them.
    hidden_overhead: >-
      The taxonomy's authority rests entirely on the exhaustiveness argument, which
      is a piece of reasoning and not a theorem with a proof of completeness over an
      enumerated space. That is disclosed here as the record's weakest joint, and
      OUTCOME 2 exists precisely to test it.
    tradeoff_note: >-
      Not applicable -- no algorithm is produced.

  dominated_by: >-
    AS AN ATTACK: mounts none. Dominated on every axis by every row of the
    prime-field frontier, checked individually: parallel rho with distinguished
    points (0.886*sqrt(N) group operations, O(1) memory per processor;
    KN-TECH-001, KN-TECH-006); automorphism-discounted rho on CM curves
    (KN-TECH-018); BSGS (2*sqrt(N) time, sqrt(N) memory; KN-TECH-031);
    Pohlig-Hellman (KN-TECH-030), which is literally regime (i) and therefore
    dominates that branch by identity. Data/query axis: regime (ii) consumes oracle
    queries and is dominated in the plain model by being outside it.
    AS A SCREEN: regime (ii) is DOMINATED BY KN-TECH-034, which states the same
    boundary with the same citations and more implementation detail. The record is
    filed anyway because a taxonomy missing a branch is not a screen, and because
    the exhaustiveness argument and the D1-D5 gate are not in KN-TECH-034.
  sota_delta: >-
    Zero speedup against any attack baseline; regime (i)'s "speedup" is
    Pohlig-Hellman and is a change of instance, and regime (ii)'s is outside the
    plain model. Screen delta, quantified: a three-branch pre-dispatch classification
    costing zero compute, with a three-point dynamic range demonstrated on ONE curve
    at ONE ell (leak present at v_ell(ord) >= 1, leak present under an oracle, leak
    absent in the pure instance), and a five-field declaration block whose
    retrospective application to nine proposals is the record's own first test. The
