# IDEA-20261003-09a306
# Curve-model point-count gap. Proposal only. Not approved.
idea:
  id: IDEA-20261003-09a306
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Short-Weierstrass versus Edwards rational-point gap at one frozen prime
  class: measurement
  claim: >-
    At one frozen prime and one frozen j-invariant, the rational-point
    counts of a short-Weierstrass model and an Edwards model differ by
    an element of {0, 1, 2, 4}. A larger gap is the surprising branch
    and is not by itself an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R2 is the curve model. The operation set is the
    rational-point predicate of that model. A model change can add or
    drop exceptional points and points at infinity. The group of the
    smooth projective model is the object being compared, not a new
    lossy projection of a prime-order subgroup.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        Factor-base choice is a different object from a model change.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - Both models are written before the count.
    - The prime is toy and public.
  proof_search_map:
    bottleneck: The rational-point gap between the two models.
    baseline_embedding:
      parameter_slice: One prime, one j, two models.
      reproduction_check: >-
        Two counters enumerate the same fields and must agree on both
        point counts.
    observation_collision:
      observable: The absolute gap between the two counts.
      distinct_preimage_search: >-
        A gap outside {0, 1, 2, 4} is not explained by the written
        exceptional budget.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The Edwards model of the same j.
        predicted_gain: A measured gap. No exponent.
    quantifier_order: >-
      The prime, j, and both equations are fixed before enumeration.
    method_ceiling:
      strongest_certifiable_claim: >-
        The gap at that prime. Not a statement for every prime.
      nearby_object_control: >-
        The same short-Weierstrass equation counted twice. The gap must
        be 0.
    proof_obligations:
      - claim: Both counts are complete over the frozen field.
        responsibility: correctness
      - claim: The gap is an integer in the reported set or outside it.
        responsibility: size
      - claim: The gap is not an ECDLP exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: model_point_gap
      direction: different
      minimum_effect: The gap lies in {0, 1, 2, 4}, or the run reports the outside branch.
  minimal_test:
    design: >-
      Freeze p, j, and both equations. Enumerate rational points.
      Report the gap.
    controls:
      - The same equation counted twice.
      - An independent enumeration.
    required_metrics:
      - both point counts
      - the absolute gap
  falsification_conditions:
    - The double count of one equation is not 0.
    - A point is accepted by an equation it does not satisfy.
  confounders:
    - Points at infinity and singular points move the count without changing the smooth group.
  interpretation_limits:
    - One prime is not a theorem.
    - No transfer to a cryptographic curve.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Exceptional points and points at infinity account for a gap of
        size at most 4 on the frozen pair of models.
      rigorous_support: >-
        No Hasse or transfer theorem is claimed by this proposal. The
        band is a pre-registered reading of a small exceptional budget.
      validation_plan: >-
        Enumerate both models. A gap outside the set is reported as the
        surprising branch, not repaired.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: O(p) for a toy enumeration.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Singular points and the point at infinity.
    tradeoff_note: Enumeration is the measurement, not an attack.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-IC-73db3f
        provenance: internal
        relation: adjacent
        delta: >-
          Factor-base dimension is a different lever. This record measures
          a model-change point gap and claims no factor base.
  dominated_by: >-
    No attack is claimed. Rho and index-calculus rows dominate any attack
    reading of a model gap.
  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: One frozen prime and two models.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
