  closure_section:
    carried_from: IDEA-20260922-153a90 (cited, not superseded)
    tripwire: >-
      T5 of DEC-20260924-99ce20 is KEPT: this section is reviewed at
      review-breakthrough, at max, when this record is designed. No sentence of
      this record states a closure as an outcome; Proposition C1 is stated as a
      proposition with its scope, for that review to rule on.
    sigma: >-
      Sigma_T = <S>: translation P -> P + S by ONE fixed point S != O of the
      prime-order target group G (order r), the operation a literal
      sieve-style walk over targets would use. Any operation set containing
      such a translation has a subset of <S>'s block systems, so C1 covers it;
      operation sets containing no translation of G are outside Sigma_T.
    proposition_C1: >-
      Every partition of G that is invariant under P -> P + S is either the
      partition into singletons or the one-block partition {G}. Equivalently,
      every map phi from G to a finite set with phi(P + S) determined by
      phi(P) is constant or injective.
    proposition_C1_proof: >-
      S != O has order r because r is prime, so <S> = G. A partition invariant
      under +S is invariant under +S^j for every j, hence under all of G
      (images of blocks are blocks: +S permutes the finite set G, a block maps
      into a block, and iterating r times returns to the start, so all blocks
      in an orbit have equal size and the inclusions are equalities). Let B be
      the block containing O. For P in B, B + P is the block containing
      O + P = P, which is B; so B is closed under addition by its own elements
      and, being finite and containing O, is a subgroup of G. By Lagrange B is
      {O} or G. For phi: if phi(P) = phi(P') then phi(P + S) = phi(P' + S), so
      the fibres of phi form an invariant partition. This argument re-derives,
      for the single-generator case, the block-system correspondence of
      IDEA-20260901-863e36 and the prime-order rigidity of IDEA-20260806-c5d183
      and KN-FIND-ffe1df Theorem C.
    what_C1_does_not_cover:
      - >-
        Incrementally updatable tests whose update needs more than the label
        (state carried along the walk, or a dependence on the step index):
        they are not of the form phi(P + S) = f(phi(P)) and C1 says nothing
        about them.
      - >-
        Translation by FACTOR-BASE elements, i.e. the Class I partial action in
        which index calculus itself lives: R = sum P_i gives R + S = sum P_i +
        S when S is in the factor base. This is not closed and is the live
        family.
      - >-
        Operation sets on G that contain no translation (the negation and
        Frobenius orbit quotients that rho already spends; isogenies; pairings).
      - >-
        The LEG side. Legs range over the composite-order E(F_q), whose
        translation action has the block systems of its subgroups; those
        trivial on G are the quotients of E/G, a group of order h (the
        cofactor). The 2-power part is computable by iterated halving (D2,
        D5); odd prime factors of h, where present, have no trace-type
        criterion derived here.
    struck_from_153a90_part_D: >-
      The sentence that the trace-parity quotient and the order-131 Frobenius
      class map "compose multiplicatively" as amortisations of rho is not
      carried. pi is identically 0 on G (D3), where rho walks, so it is not an
      amortisation of rho at all; it is a relation-yield label on legs. The
      Frobenius-class gain is rho's and is already inside the matched figure
      2^60.8090 (rho_convention). The source figure 2^60.9 of Bailey et al. may
      be quoted only as that source's rounding.
    part_C_repriced: >-
      The deeper 2-power label is repriced from the record's own derivation
      (D5): the depth-2 bit costs one root solve, one multiplication and one
      trace per factor-base point, once, in a precompute pass; depth i costs
      O(i) field operations per point. Its YIELD is priced under H-39014f-2:
      restricting the parity-aligned window to one depth-2 class by rejection
      keeps about half of its legs and doubles the class-sum success
      probability, giving 2^{1-m} times the parent window's decompositions per
      target (a loss for m >= 2 at the parent's coordinate count) and 2 times a
      size-matched window's (a gain realisable only through a membership
      predicate that D5 does not show to be affine). Ceiling, by the scaling
      that CORR-20260928-4cb669 states for a factor base restricted to the
      order-r subgroup (floor proportional to N^{2/(m+1)}): a parity-aligned
      window corresponds to the ambient N = 2r and a depth-2 class-pure window
      on a cofactor-4 row to N = r, lowering the free-oracle floor by 2/(m+1)
      and 4/(m+1) bits respectively against the N = 4r table. On ECC2K-130 at
      m = 3 that is 68.5850 - 0.5 = 68.0850 and 67.5850 bits, still 7.276 and
      6.776 bits above matched rho 2^60.8090 (arithmetic on the correction's
      cited values, worksheet A6; not recomputed by l-optimisation).
    cheap_test: >-
      The E/4E class census (minimal_test Stage 2): on the cofactor-4 Koblitz
      cell, the depth-2 class histogram of the parity-aligned window, the
      class-sum certificate on every counted decomposition, the class-restricted
      against parity-aligned and against size-matched yield ratios, an
      exhaustive affine-purity scan of the window's hyperplanes, a relabelled
      Z/(4 r') generic-group replica and the cofactor-2 sibling on which the
      bit must be reported undefined. Minutes, solver-free.
    obstruction_draft:
      status: >-
        Draft for the T5 round, in the form of templates/research-records.md
        "obstruction". Not filed as a closure by this record.
      statement: >-
        On a cyclic group of prime order r, translation by any fixed nonzero
        element admits no nontrivial invariant partition, so no lossy
        label of targets propagates deterministically along a single-step walk.
      quantity: number of nontrivial <S>-invariant partitions of G
      value: 0 (derived, Proposition C1; not a measurement)
      measured_by: []
      scope: >-
        G cyclic of prime order r, Sigma_T = <S> with S != O, labels of the
        form phi(P + S) = f(phi(P)). Nothing beyond what_C1_does_not_cover.
      resource_check:
        examined: true
        reading: >-
          The same Lagrange argument is the resource on the leg side: the
          composite order of E(F_q) is what makes pi (and, on a = 0 rows, the
          depth-2 label) exist, which is the reading this record and
          IDEA-20260926-ae8f0a take up.
        spawned_ids:
          - IDEA-20260926-ae8f0a

