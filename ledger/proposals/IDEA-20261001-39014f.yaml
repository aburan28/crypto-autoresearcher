  title: >-
    The trace-parity label on Semaev's polynomial-basis window, corrected: at
    odd n the half {c_0 = Tr(a)} of V = span{1, t, ..., t^{k-1}} carries the
    target class at EVERY arity m and its complement is EXACTLY empty for
    odd-order targets at odd m, so on the eleven FIPS/SEC prime-degree rows read
    from the primary standards the lever is one row-dependent choice of c_0 worth
    a factor of at most 2 (one bit) in decompositions per target at matched
    window size, at every m; carried with IDEA-20260922-153a90's sieve
    proposition reduced to its single-step Sigma and its leg-side E/4E class
    census as the cheap test
  class: mechanism

  claim: >-
    SETTING. E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, b != 0;
    Tr: F_q -> F_2 the absolute trace; G the odd-order subgroup containing the
    targets. All group-law facts used below are DERIVED in field
    derivations_from_the_group_law of this record (D1 to D6), not relayed.

    (A) THE PARITY LABEL (D1-D3). For affine P = (x, y), P is in 2E(F_q) iff
    Tr(x) = Tr(a). Hence pi(P) = Tr(x_P) + Tr(a) (pi(O) = 0) is the quotient
    map E -> E/2E = Z/2, a homomorphism; pi(-P) = pi(P); and pi is identically
    0 on G, because G = 2G is inside 2E.

    (B) THE WINDOW HALVES (D4). Let the field be F_2[t]/(f), f = t^n + t^s +
    (lower terms), s the largest exponent below n with nonzero coefficient.
    Then Tr(t^j) = 0 for 1 <= j <= n - s - 1 and Tr(1) = n mod 2. For a window
    V_k = span{1, t, ..., t^{k-1}} with k <= n - s, every x = sum c_j t^j in
    V_k has Tr(x) = c_0 (n mod 2). At ODD n this gives Tr(x) = c_0, so every
    leg P with x(P) in V_k has pi(P) = c_0 + Tr(a). Write V_k^(0) = {c_0 = 0}
    (the linear, constant-free half, which is the superseded record's V') and
    V_k^(1) = {c_0 = 1} (the affine half, 1 + V').

    (C) THE PARITY RULE, CORRECTED (the content of R1-a). A decomposition
    R = (+-)P_1 (+-) ... (+-)P_m of a target R in G forces
    pi(P_1) + ... + pi(P_m) = pi(R) = 0 in Z/2. On a window half in which every
    leg has the same label eps, the left side is m eps mod 2. Therefore, at odd
    n and for every m:
      (C1) the half {c_0 = Tr(a)} has eps = 0 and is ALIGNED at every m (no
           m-multiset is excluded by parity);
      (C2) the half {c_0 = 1 + Tr(a)} has eps = 1 and is EXACTLY EMPTY for
           targets in G at every ODD m (zero decompositions, a certificate),
           and aligned at every EVEN m.
    On a Tr(a) = 1 row the constant-free half V' = {c_0 = 0} is the (C2) half:
    EMPTY AT ODD m, aligned at even m; the affine half {c_0 = 1} is aligned at
    every m. On a Tr(a) = 0 row the roles exchange. The superseded record stated
    the Tr(a) = 1 emptiness at EVEN arity; that direction is reversed and is
    withdrawn here. No row is "structurally empty": every row has an aligned
    half at every m.

    (D) THE NET GAIN IS ONE BIT AT ANY m, AT MATCHED SIZE (conditional on
    heuristic H-39014f-1). If a fraction theta of a window's legs has pi = 1,
    the fraction of m-multisets satisfying the parity constraint is
    (1 + (1 - 2 theta)^m) / 2 (exact counting identity). Under H-39014f-1
    (admissible sums equidistribute on the coset 2E), the expected number of
    decompositions per target in G of an aligned window is
    2 / (1 + (1 - 2 theta)^m) times that of a window of the SAME SIZE whose
    legs have label fraction theta. For a balanced comparator (theta = 1/2:
    Semaev's full V_k splits its x-values exactly evenly at odd n by (B), and
    its legs approximately so; a random hyperplane of V_k is balanced in
    expectation) the factor is 2 at every m. The cleanest matched pair at
    deployed scale is the aligned affine slice A_k = {c_0 = Tr(a)} +
    span{t, ..., t^k} (needs k <= n - s - 1) against Semaev's V_k: both have
    2^k elements and k free F_2-coordinates per leg. The lever is therefore a
    factor <= 2 in decompositions per target at matched window size and matched
    coordinate count, at every m. It is NOT a free factor 2 on top of Semaev's
    full window at a fixed coordinate budget: against V_k the aligned half of
    V_k (k - 1 coordinates, half the size) yields 2^{1-m} as many
    decompositions per target, so it needs 2^{m-2} times as many attempts to
    fill a relation matrix of its own (half) size.

    (E) THE DEPLOYED PER-ROW RULE, READ FROM THE PRIMARY STANDARDS (field
    per_row_table). On the eleven prime-degree rows K-163, B-163, K-233, B-233,
    sect239k1, K-283, B-283, K-409, B-409, K-571, B-571 (field degrees 163, 233,
    239, 283, 409, 571, all odd), a is read from FIPS 186-4 Appendix D.1.3 and
    SEC 2 v2 section 3.4.1: a = 1 on K-163 and every B-curve (Tr(a) = 1, aligned
    half c_0 = 1); a = 0 on K-233, K-283, K-409, K-571 and sect239k1 (Tr(a) = 0,
    aligned half c_0 = 0). The rule holds for window dimension k <= n - s, with
    n - s = 156, 159, 81, 271, 322, 561 at n = 163, 233, 239, 283, 409, 571 read
    off the standards' field polynomials. This is a parameter rule (which half
    of a window carries the target class); it is not an attack, a cost, or a
    security verdict on any deployed curve. c2pnb208w1 is dropped from the
    census (field per_row_table.r1c_disposition).

    (F) CLOSURE SECTION, CARRIED REDUCED (field closure_section). For the
    single-step operation set Sigma_T = <S>, S a fixed nonzero point of a
    prime-order G acting by translation, every partition of G invariant under
    P -> P + S is trivial or total (Proposition C1, proved in the record). This
    record states C1 as a proposition with its scope and does not file it as a
    closure; whether it is filed as one is the business of the
    review-breakthrough round of tripwire T5. The leg-side reading (the E/4E
    chain on a = 0 rows) is what the cheap test, the E/4E class census,
    measures.

  mechanism: >-
    OBJECT FRAME. Representation (R1 class of RQ-ECDLP-623a32): the
    x-coordinate of a factor-base leg as an element of the F_2-space F_q,
    restricted to an F_2-affine window. Operation set Sigma: translation by
    factor-base elements (Class I, partial action, as for every index-calculus
    relation vector, IDEA-20260806-c5d183), refined by the quotient
    homomorphism pi: E(F_q) -> E/2E. Sigma is NOT the full translation action of
    the prime-order target group, on which pi is identically 0; pi is a block
    system of the translation action of the COMPOSITE-order group E(F_q)
    (index 2; IDEA-20260901-863e36's block-system correspondence, re-proved for
    the case used here in closure_section.proposition_C1_proof).

    TRICHOTOMY. Partial-action. The tracked object is the relation vector over
    the factor base; pi labels each LEG with one bit that propagates
    deterministically under the addition the relation search performs, because
    pi is a homomorphism (D3). Nothing is tracked on targets.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. P -> pi(P) discards all but one
    bit of the point (lossy: each fibre is a coset of 2E, of size #E/2), and
    what it discards is discarded compatibly with addition (pi(P + Q) =
    pi(P) + pi(Q)), so the retained bit propagates deterministically through
    any m-sum. On the window, pi becomes the affine function c_0 + Tr(a) of the
    coordinates (claim (B)), which is why the aligned set is an affine
    hyperplane of the window and costs nothing to impose. The depth-2 label of
    the closure section passes the same test against Sigma on a = 0 rows (a
    homomorphism E -> E/4E = Z/4 on the cyclic 2-Sylow, D5-D6) but is NOT shown
    to be affine in the window coordinates; that is the open number its census
    measures.

    WHAT IS NEW AND WHAT IS NOT. Stated plainly (correcting the superseded
    record's overlap claim): the aligned half is IDEA-20260915-3119c9's
    class-aligned affine slice R1 {x in W : Tr(x) = Tr(a)} realised in Semaev's
    canonical basis W = V_k with no search, and the parity mechanism is
    IDEA-20260913-cedd2f's. IDEA-20260915-8fe0ef (S2) already states the
    correct parity direction (zero decompositions at odd m) for Frobenius-stable
    windows inside ker Tr on Tr(a) = 1 curves. The residual content of this
    record is: (i) the odd-n vacuity of cedd2f's unmodified-window confinement
    on every FIPS/SEC prime-degree row; (ii) the per-row rule c_0 = Tr(a) with
    its window bound k <= n - s read from the primary standards; (iii) the
    all-m yield factor 2 / (1 + (1 - 2 theta)^m) and its comparator stated
    exactly; (iv) the halving criterion, the homomorphism and the depth-2
    formula derived in the record rather than relayed; (v) the closure section
    reduced to its Sigma with a solver-free census as its cheap test.

    KN-OPEN-020 CLASS DECLARATION. The window and its aligned half are
    F_2-affine subspaces: membership is one F_2-linear test (c_0 = Tr(a)) in
    the undescended and the descended model; the same class as Semaev's V,
    cedd2f's V and 3119c9's slices. Not escaped. Charged costs: description
    O(k) field elements; membership one linear test; relation, descent and
    linear-algebra costs inherited unchanged from the decomposition engine;
    the depth-2 class-pure window (closure_section) is the one candidate whose
    membership is not shown linear, and its membership cost is unpriced.

  derivations_from_the_group_law:
    note: >-
      Every group-law and trace statement the record relies on, derived here
      from the curve equation (RV-3 of TASK-20260929-322a64). Nothing is
      relayed from IDEA-20260922-1b16d7 or from a review report. Characteristic
      2 throughout; F(x, y) = y^2 + xy + x^3 + a x^2 + b.
    D1_doubling: >-
      Tangent slope at Q = (u, v), u != 0: dF/dx = y + x^2, dF/dy = x, so
      lambda = (v + u^2)/u = u + v/u. Substituting y = lambda x + c
      (c = v + lambda u) into F gives x^3 + (lambda^2 + lambda + a) x^2 + c x +
      (b + c^2) = 0; the root sum is lambda^2 + lambda + a = 2u + x_3 = x_3.
      Negation is -(x, y) = (x, x + y), so y(2Q) = lambda(x_3 + u) + v + x_3 =
      u^2 + (lambda + 1) x_3 (using lambda u + v = u^2). Hence
      x(2Q) = lambda^2 + lambda + a and y(2Q) = u^2 + (lambda + 1) x(2Q).
      If u = 0 then Q = (0, b^{1/2}) = T, the unique affine point with
      Q = -Q, and 2T = O.
    D2_halving_criterion: >-
      Claim: for affine P = (x, y) on E, P is in 2E(F_q) iff Tr(x) = Tr(a).
      Forward: P = 2Q with Q = (u, v), u != 0 (Q is neither O nor T, whose
      doubles are O), gives x = lambda^2 + lambda + a and
      Tr(lambda^2 + lambda) = 0, so Tr(x) = Tr(a). Converse: if Tr(x + a) = 0,
      the F_2-linear map z -> z^2 + z has kernel {0, 1} and image of size q/2
      contained in ker Tr, hence equal to ker Tr, so lambda^2 + lambda = x + a
      has two roots lambda, lambda + 1. Put w = y + (lambda + 1) x and
      u = w^{1/2} (squaring is bijective), v = u lambda + u^2. Then
      w^2 + x w + b = y^2 + xy + x^2 (lambda^2 + lambda) + b = y^2 + xy + x^3 +
      a x^2 + b = 0 (P is on E), which is exactly the condition
      v^2 + uv = u^3 + a u^2 + b for Q = (u, v) to lie on E; u != 0 since
      u = 0 would force b = 0; the slope at Q is u + v/u = lambda, so
      x(2Q) = x and y(2Q) = u^2 + (lambda + 1) x = y. So P = 2Q. No division
      by x is used, so the case x = 0 (P = T) is included: T is in 2E iff
      Tr(a) = 0. The two halves of P are Q and Q + T (from the roots lambda
      and lambda + 1).
    D3_homomorphism: >-
      E(F_q)[2] = {O, T} (D1), so for the finite abelian group E(F_q),
      |E/2E| = |E[2]| = 2 and 2E has index 2. By D2, pi(P) = Tr(x_P) + Tr(a),
      pi(O) = 0, is the indicator of the non-trivial coset of 2E, hence the
      quotient homomorphism E -> Z/2. pi(-P) = pi(P) (same x). G has odd order,
      so G = 2G is contained in 2E and pi vanishes on G. The 2-Sylow subgroup
      is cyclic (one element of order 2); it has order 2 when Tr(a) = 1 (T not
      in 2E) and order at least 4 when Tr(a) = 0 (T in 2E, so a point of
      order 4 exists).
    D4_trace_of_window: >-
      Let f(X) = X^n + f_{n-1} X^{n-1} + ... + f_0 be the irreducible field
      polynomial, alpha = t its root, conjugates alpha^{2^i}. The power sums
      p_j = sum_i (alpha^{2^i})^j equal Tr(alpha^j). Newton's identities
      p_j + f_{n-1} p_{j-1} + ... + f_{n-j+1} p_1 + j f_{n-j} = 0
      (1 <= j <= n) with f_{n-1} = ... = f_{s+1} = 0 give p_j = 0 for
      1 <= j <= n - s - 1 (every coefficient involved has index >= s + 1) and
      p_{n-s} = (n - s) mod 2. Tr(1) = n mod 2. Hence on V_k with k <= n - s,
      Tr(sum c_j t^j) = c_0 (n mod 2). In a NORMAL basis {beta^{2^i}}:
      Tr(beta) = sum of all basis elements, nonzero by linear independence,
      so Tr(beta) = 1 and Tr(x) is the Hamming weight of x's coordinate vector
      mod 2.
    D5_depth_two_bit: >-
      Suppose Tr(a) = 0 (so T is in 2E by D2) and P = (x, y) in 2E, P != O.
      Its halves are Q and Q + T (D2); since T is in 2E, Q is in 2E iff
      Q + T is, and P is in 4E iff Q is in 2E iff Tr(u) = Tr(a) = 0, where
      u = w^{1/2}, w = y + (lambda + 1) x. Since Tr(u) = Tr(u^2), the depth-2
      bit is beta_2(P) = Tr(y + (lambda + 1) x) with lambda any root of
      lambda^2 + lambda = x + a. It is independent of the root chosen (the two
      choices differ by Tr(x) = Tr(a) = 0) and of the sign of P (replacing y by
      x + y changes it by Tr(x) = 0), so on x(2E) it is a function of x alone.
      Cost per point: one solve of lambda^2 + lambda = x + a (a half-trace at
      odd n), one multiplication, one trace; no square root is needed for the
      bit itself. When Tr(a) = 1 the formula changes with the root chosen
      (Tr(x) = 1 on 2E) and the bit is undefined, matching a 2-Sylow of
      order 2. Depth i >= 3 needs the half-point coordinates (u, v) at each
      level, i.e. one root solve, one square root and a few multiplications
      per level: O(i) field operations per point. Whether beta_2 restricted to
      a window is an F_2-affine function of the window coordinates is NOT
      established here; the census measures it (prediction P-8).
    D6_E4E_on_cofactor_4: >-
      If #E = 4 r' with r' odd (cyclic 2-Sylow Z/4), then 4E is the odd-order
      subgroup, E/4E = Z/4, and for P in 2E: beta_2(P) = 0 iff P is in the
      odd-order subgroup. Every decomposition of a target in that subgroup has
      leg classes summing to 0 in Z/4 (homomorphism E -> E/4E).

