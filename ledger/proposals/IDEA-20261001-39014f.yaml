      Zero on every ECDLP axis. Within index calculus at matched factor-base
      size: a factor <= 2 (1 bit) in decompositions per target at every m,
      equivalently <= 2/(m+1) bits on the free-oracle floor by the cited scaling
      (0.5 bit at m = 3, 0.4 bit at m = 4), conditional on H-39014f-1. Against
      the superseded record: its "2-8x" for the Tr(a) = 0 rows (3119c9's
      enrichment search included) is withdrawn to <= 2x, and its "structural
      emptiness" of the Tr(a) = 1 rows is withdrawn (every row has an aligned
      half at every m).
    memory: Zero at matched size.
    data_queries: Not applicable; single-target design rule, no preprocessing.

