  assumptions:
    - Curves y^2 + xy = x^3 + a x^2 + b with b != 0 over F_{2^n}; true for every row (b = 1 on the Koblitz rows; B-curve b nonzero by the standards' form).
    - Windows are polynomial-basis windows V_k with k <= n - s unless the trace hyperplane is computed explicitly.
    - No new decomposition engine and no new relation-search algorithm is proposed; per-attempt cost is inherited and is not claimed equal across arms except under heuristic H-39014f-3.
    - Nothing is run at deployed parameters; the deployed rows enter only as arithmetic.

  proof_search_map:
    bottleneck: >-
      Which half of a polynomial-basis factor-base window carries the target
      class at each arity on each deployed row, and what that choice is worth at
      matched size; and, for the closure section, whether any label of targets
      can propagate along a single-step walk (C1 says no for Sigma_T) while the
      leg side admits the 2-power quotient chain.
    baseline_embedding:
      parameter_slice: >-
        Even n, where Tr(1) = 0 and Semaev's unmodified V_k is already inside
        one class (cedd2f's confined regime): the rule must reduce to "both
        halves identical", and the yield factor of a half against a random
        hyperplane of V_k must be 1. At odd n with theta = 1/2 the factor
        formula reproduces 3119c9's 2x class-alignment gain at m = 3.
      reproduction_check: >-
        Symbolic, zero compute: D4 at even n gives Tr(x) = 0 on V_k, so both
        halves carry pi = Tr(a) and 2 / (1 + (1 - 2 theta)^m) with theta in
        {0, 1} on both halves gives equal factors; at theta = 1/2, m = 3 the
        formula gives 2, matching 3119c9's equal-|Fb_E| doubling. A
        disagreement localises to D4 or to the counting identity.
    observation_collision:
      observable: >-
        Decompositions per target for each window half and for size-matched
        controls, at m = 2 and m = 3; the depth-2 class histogram of the aligned
        window.
      distinct_preimage_search: >-
        A zero at odd m for the complementary half could come from (i) parity
        (claimed), or (ii) a window too small to decompose anything. A yield
        ratio near 2 could come from (i) alignment, or (ii) a side-bit imbalance
        (one half having more abscissae). Separated by: the mirror targets in
        E \ 2E (for which the roles of the halves exchange exactly), a random
        hyperplane of V_k (same span, same size, theta near 1/2), a random
        linear subspace of the same dimension, and reporting F0, F1 (point
        counts) per window so the ratio is read against
        2 / (1 + (1 - 2 theta)^m) with the measured theta. A depth-2 class
        imbalance could come from structure or from window size; separated by
        the relabelled Z/(4 r') replica and a random-label null of the same
        marginal on the hyperplane scan.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The aligned half {c_0 = Tr(a)} of V_k (or the aligned affine slice
          A_k = {c_0 = Tr(a)} + span{t, ..., t^k} for the matched-size
          comparison), selected by one linear condition.
        predicted_gain: >-
          Factor 2 / (1 + (1 - 2 theta)^m), about 2, in decompositions per
          target at matched size, at every m; exact zero for the complementary
          half at odd m.
      - transform: observable_fiber
        proposed_object: >-
          Hold the parity label fixed (the aligned half) and vary the forgotten
          depth-2 class: class-0 and class-2 sub-windows on the cofactor-4 cell.
        predicted_gain: >-
          Yield ratio 2^{1-m} against the parent aligned window, 2 against a
          size-matched random half; no affine hyperplane of the aligned window
          is class-pure.
    quantifier_order: >-
      FOR EVERY curve of the stated form, EVERY odd n, EVERY k <= n - s, EVERY
      odd-order target R and EVERY odd m: the half {c_0 = 1 + Tr(a)} of V_k
      yields zero decompositions of R (exact, no witness depends on R). FOR
      EVERY prime-order G and EVERY S != O in G: no nontrivial <S>-invariant
      partition exists (C1). The yield factor 2 is a statement about the
      expectation over targets under H-39014f-1 and is NOT uniform per target.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At odd n, within the Newton bound, the half {c_0 = Tr(a)} of Semaev's
        polynomial-basis window is parity-aligned at every arity and its
        complement is exactly empty for odd-order targets at odd arity; on the
        eleven FIPS/SEC prime-degree rows the aligned half is c_0 = 1 on K-163
        and the B-curves and c_0 = 0 on K-233, K-283, K-409, K-571 and
        sect239k1; at matched window size the aligned half has about twice the
        decompositions per target (measured at n = 19, transferred under
        H-39014f-1)." It certifies nothing about per-attempt solver cost,
        solving degree, any total index-calculus cost, any comparison with rho,
        or any non-polynomial basis beyond the normal-basis weight statement.
      nearby_object_control: >-
        (i) Even-n window (both halves identical; the rule must have no
        content). (ii) Mirror targets in E \ 2E (the halves' roles exchange).
        (iii) The cofactor-2 sibling for the depth-2 label (undefined there).
        (iv) Relabelled generic-group replica (a group-structure claim must
        survive relabelling).
    proof_obligations:
      - claim: Halving criterion and pi a homomorphism with pi = 0 on G (D1-D3).
        responsibility: correctness
      - claim: Tr(t^j) = 0 for 1 <= j <= n - s - 1 and Tr(1) = n mod 2 (D4).
        responsibility: correctness
      - claim: Per-row a, n, f read from FIPS 186-4 and SEC 2 (per_row_table).
        responsibility: baseline
      - claim: Exact odd-m emptiness of the complementary half; aligned half admissible at every m.
        responsibility: correctness
      - claim: Yield factor 2 / (1 + (1 - 2 theta)^m) at matched size, under H-39014f-1.
        responsibility: success_probability
      - claim: Proposition C1 and its scope list.
        responsibility: scope
      - claim: Depth-2 bit formula and its definedness exactly when Tr(a) = 0 (D5, D6).
        responsibility: correctness
      - claim: Nothing here bounds solver cost, solving degree, or total cost against rho.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - id: P-1
      metric: parity_violations (counted decompositions with sum of leg labels != label of target), every cell, window and m
      direction: lower
      minimum_effect: exactly 0 (exact combinatorics, zero tolerance)
    - id: P-2
      metric: decompositions per odd-order target from the half {c_0 = 1 + Tr(a)} at m = 3
      direction: lower
      minimum_effect: exactly 0 on both the a = 0 and the a = 1 cell, while the same half is nonzero at m = 2
    - id: P-3
      metric: aligned_over_random_hyperplane_yield_ratio (mean decompositions per odd-order target, aligned half over a random hyperplane of V_k of equal size) at m = 2 and m = 3
      direction: higher
      minimum_effect: >-
        Within [0.71, 1.41] times 2 / (1 + (1 - 2 theta)^m) with theta the
        measured pi = 1 fraction of the control's legs (prediction about 2;
        band [1.4, 2.8] at theta = 1/2).
    - id: P-4
      metric: mirror-target yields (targets in E \ 2E)
      direction: different
      minimum_effect: The aligned half gives exactly 0 at every m; the complementary half is nonzero at odd m and exactly 0 at even m.
    - id: P-5
      metric: class_sum_violations on the cofactor-4 cell (leg Z/4 classes not summing to the target's class)
      direction: lower
      minimum_effect: exactly 0; and the formula class of every aligned-window point equals direct membership in the odd-order subgroup ([r']P = O)
    - id: P-6
      metric: depth-2 class histogram of the aligned window on the cofactor-4 cell
      direction: different
      minimum_effect: >-
        Balanced within 3 binomial standard deviations of 1/2 (H-39014f-2); an
        imbalance beyond that, not reproduced by the relabelled replica, is
        structure and is reported as a finding.
    - id: P-7
      metric: yield ratio of the class-0 sub-window over the parent aligned window, m = 2 and 3
      direction: lower
      minimum_effect: within [0.5, 2] times 2^{1-m} (0.5 at m = 2, 0.25 at m = 3); against a size-matched random half of the parent, within [0.5, 2] times 2
    - id: P-8
      metric: maximum class purity over all affine hyperplanes of the aligned window (exhaustive scan)
      direction: lower
      minimum_effect: >-
        No hyperplane is class-pure, and the maximum purity lies within the
        range of the same scan on a random label of equal marginal (the null);
        a class-pure or beyond-null hyperplane refutes "the depth-2 bit is not
        affine on this window".
    - id: P-9
      metric: curve_over_generic_ratio for every metric of Stage 2 (relabelled Z/(4 r') replica)
      direction: different
      minimum_effect: within [0.5, 2] on every metric

  minimal_test:
    design: >-
      STAGE 0 (zero compute; delivered in this record, rechecked at design).
      D1-D6, the per-row table, Proposition C1 and the yield identity are
      written above. Setup checks before any census: irreducibility and s of
      the toy field polynomial; Tr(t^j) for j < l; the toy group orders by the
      Frobenius-trace recurrence (worksheet A4 gives #E = 4 x 130873 for
      a = 0 and 2 x 262543 for a = 1 at n = 19, with 130873 prime by trial
      division; 262543 to be checked) and primality of the odd parts.

      STAGE 1 (parity census; minutes; no solver). CELLS: the Koblitz pair
      y^2 + xy = x^3 + a x^2 + 1 over F_2[t]/(f), n = 19, a in {0, 1} (the
      a = 1 curve is the quadratic twist of the a = 0 curve at odd n, so the
      pair realises Tr(a) = 0 and Tr(a) = 1 on one field with one instrument).
      f is an irreducible degree-19 polynomial with n - s >= 11, verified at
      setup (candidate t^19 + t^5 + t^2 + t + 1, n - s = 14). WINDOWS at
      l = 10: V = span{1, ..., t^9}; its halves V^(0) = {c_0 = 0} and
      V^(1) = {c_0 = 1} (512 x-values each); RH, a random hyperplane of V
      not equal to either half (random nonzero linear form other than c_0,
      seed recorded); RS, a random 9-dimensional linear subspace of F_q
      (seed recorded). TARGETS per cell: 40 odd-order targets and 20 mirror
      targets from E \ 2E, drawn from a recorded seed. ARITY: m = 2 and m = 3,
      exhaustive (m = 2 by hashing x(R - P1); m = 3 by enumerating pairs and
      testing x(R - P1 - P2) for window membership). RECORD per (cell, window,
      m, target class): decompositions per target, F0 and F1 point counts,
      parity pattern of every counted decomposition.

      STAGE 2 (E/4E class census, the closure section's cheap test; minutes).
      On the a = 0 cell only: compute beta_2 by D5 for every point of the
      aligned half V^(0); verify it against direct arithmetic (the half Q from
      D2 doubles to P; beta_2 = 0 iff [r']P = O) on every point; histogram.
      Sub-windows W_0 (class 0, i.e. points of the odd-order subgroup) and W_2
      (class 2), and WR, a random subset of V^(0)'s points of the size of W_0
      (seed recorded). m = 2 and 3 census of the 40 odd-order targets and 20
      class-2 targets of 2E. Exhaustive scan of the 2 x (2^9 - 1) affine
      hyperplanes of V^(0) for the maximum class purity, and the same scan
      under a random label of equal marginal. Relabelled replica: Z/(4 r') with
      labels by residue mod 4 and subsets of the same sizes. Control: on the
      a = 1 cell the instrument must report beta_2 undefined (root-choice
      dependent) on every point.

      OUTCOME TABLE. POSITIVE: P-1 to P-9 hold; the corrected per-row rule
      and the one-bit pricing stand at toy scale, and the depth-2 label is
      balanced and not affine on the window, so its yield is available only
      through a non-linear membership predicate whose cost is the open number.
      NEGATIVE (mechanism): a parity violation or an odd-m decomposition from
      the complementary half (D2 or D4 fails for this polynomial; the
      mechanism is withdrawn for that shape); a ratio outside the P-3 band
      (H-39014f-1 fails; the one-bit statement is withdrawn); a class-pure or
      beyond-null hyperplane (the depth-2 label is affine there: a positive
      surprise, reported as a finding and routed to review before any
      interpretation). ARTIFACT: RH or RS showing F0 = 0 or zero yield
      (window too small; cell excluded); a class bit reported on the a = 1
      cell; a replica disagreeing beyond P-9 (instrument defect). Nothing is
      read from an artifact outcome.
    controls:
      - id: C-twist
        text: The a = 0 and a = 1 curves on the same field; the halves' roles must exchange exactly.
      - id: C-mirror
        text: Targets in E \ 2E; the aligned half must give exactly 0 at every m.
      - id: C-hyperplane
        text: Random hyperplane RH of V (same span, same size, theta near 1/2); the yield comparator for P-3.
      - id: C-subspace
        text: Random 9-dimensional subspace RS; a second size-matched comparator outside the span.
      - id: C-cof2
        text: The a = 1 (cofactor 2) curve, on which beta_2 must be reported undefined.
      - id: C-replica
        text: Relabelled Z/(4 r') generic-group replica for every Stage 2 metric.
      - id: C-label-null
        text: Random label of equal marginal on the hyperplane scan (P-8).
      - id: C-even
        text: >-
          OPTIONAL. An even-n Koblitz window (irreducible f with n - s > l,
          chosen at setup) where both halves must be indistinguishable; the
          proves-too-much control for the parity rule and the place the dropped
          c2pnb208w1 row's case is tested.
    required_metrics:
      - parity_violations per (cell, window, m)
      - decompositions per target per (cell, window, m, target class), mean and max
      - F0 and F1 point counts per window
      - aligned_over_random_hyperplane and aligned_over_random_subspace yield ratios with measured theta
      - beta_2 agreement with direct subgroup membership (count of disagreements)
      - class histogram of V^(0); class_sum_violations
      - class-0 over parent and class-0 over size-matched yield ratios
      - maximum hyperplane class purity, curve and label-null
      - curve_over_generic_ratio per Stage 2 metric
    excluded:
      - Any solver-based per-attempt cost arm (heuristic H-39014f-3); deferred, needs a SAT or Groebner engine the review README records as not installed; an impediment, never evidence.
      - Any run at deployed parameters.

  falsification_conditions:
    - Any parity-violating decomposition (P-1) refutes D2/D3 or D4 for that field polynomial; the mechanism is withdrawn for that shape.
    - Any decomposition of an odd-order target from the half {c_0 = 1 + Tr(a)} at m = 3 refutes the corrected rule (C2).
    - An aligned/random-hyperplane ratio outside the P-3 band at m = 2 or m = 3 refutes H-39014f-1 at this cell and withdraws the one-bit pricing.
    - Any class-sum violation, or any disagreement between beta_2 and direct subgroup membership, refutes D5/D6.
    - A class-0/parent yield ratio outside [0.5, 2] x 2^{1-m} refutes H-39014f-2.
    - A class-pure, or beyond-null, affine hyperplane of the aligned window refutes prediction P-8 (the depth-2 label is affine on that window).
    - A relabelled-replica ratio outside [0.5, 2] on any Stage 2 metric refutes the purely group-theoretic reading.

  confounders:
    - >-
      Field-polynomial shape. The rule needs k <= n - s; the toy polynomial is
      checked at setup (n - s = 14 for the candidate, l = 10) and sect239k1's
      small n - s = 81 is flagged in the table.
    - >-
      Side bit. Only about half the x-values of a window are abscissae of the
      curve, and the a = 0 and a = 1 curves split each window's x-values between
      them (twists). Ratios are read with F0, F1 point counts and the measured
      theta, never with x-value counts.
    - >-
      Finite size. theta of a control is not exactly 1/2; the prediction is
      2 / (1 + (1 - 2 theta)^m) at the measured theta.
    - >-
      The 2-torsion point T = (0, 1) lies in V^(0); it is reported per arm and
      the census is repeated with it excluded.
    - >-
      Multiset and sign conventions (unordered legs, R and -R) are fixed once
      and are the same on every arm.
    - >-
      Basis dependence of per-attempt cost. The matched slice A_k = {c_0 =
      Tr(a)} + span{t, ..., t^k} has product space span{1, ..., t^{2k}}
      (dimension 2k + 1) against span{1, ..., t^{2k-2}} (dimension 2k - 1) for
      V_k; an algebraic oracle may price them differently. This is why the
      yield claim is stated at matched size and the cost equality is a
      separate heuristic (H-39014f-3) that this test does not measure.

  interpretation_limits:
    - Proposal only. No experiment, no run, no approval and no result exists here.
    - >-
      The per-row rule is exact arithmetic at deployed parameters; the yield
      factor is measured at n = 19 only and transfers to the deployed rows
      under H-39014f-1, a stated transfer assumption.
    - >-
      Nothing here is an attack, a cost, an exponent movement or a verdict on any
      deployed curve. The lever is at most a factor 2 in decompositions per
      target at matched size; on ECC2K-130 it moves no arity row across matched
      rho under the floors CORR-20260928-4cb669 records (worksheet A6).
    - >-
      The closure section is a proposition with a stated Sigma, not a filed
      closure; T5 decides its filing at review-breakthrough.
    - >-
      No per-orbit framing is used (CORR-20260925-649e25); no D1 quantity is
      used as a budget (CORR-20260928-4cb669).

  heuristic_assumptions:
    - id: H-39014f-0
      statement: >-
        None for D1-D6, the per-row rule, the odd-m emptiness and Proposition
        C1: these are unconditional finite group theory and field arithmetic.
        Recorded so the absence is explicit.
      rigorous_support: The derivations in derivations_from_the_group_law and closure_section.proposition_C1_proof.
      validation_plan: Stage 1 P-1, P-2, P-4 and Stage 2 P-5 are consistency checks with zero tolerance.
    - id: H-39014f-1
      statement: >-
        Coset equidistribution. For a window W of size N at matched size, the
        sums of parity-admissible m-multisets of factor-base legs are
        distributed on 2E as a uniform distribution up to relative error
        o(1), so the expected number of decompositions of a target in G is
        (number of admissible multisets) / |2E| up to the common sign factor.
      rigorous_support: >-
        The parity constraint itself is exact (D3); the uniformity within the
        coset imitates the standard index-calculus decomposition-probability
        model (a random element of a group of size M is hit with probability
        1/M), restricted to the coset fixed by an exact homomorphism. Not proved
        for fixed windows.
      validation_plan: >-
        Stage 1: mean decompositions per target against admissible/|2E| for
        every window and m at n = 19, l = 10; the per-target count histogram
        against Poisson with that mean; tail check, maximum count over the 40
        targets against the Poisson upper tail. Sampled parameters: n = 19,
        a in {0, 1}, l = 10, m in {2, 3}, 40 + 20 targets per cell. TRANSFER:
        to n >= 131 by assumption only.
    - id: H-39014f-2
      statement: >-
        Depth-2 balance and non-affinity. On the parity-aligned window of a
        cofactor-4 curve, beta_2 is equidistributed (fraction 1/2 + o(1)) and
        no affine hyperplane of the window is class-pure; class-restricted sums
        equidistribute on 4E as in H-39014f-1.
      rigorous_support: >-
        beta_2 is a homomorphism-derived label (D5-D6) whose fibres in 2E have
        equal size; balance on a linear window imitates equidistribution of a
        homomorphism over a linear family. Non-affinity is not proved; D5
        expresses beta_2 through a half-trace and a product, which is not
        shown to be F_2-affine in x.
      validation_plan: >-
        Stage 2: class histogram against binomial(|V^(0) points|, 1/2) with a
        3-sigma band; exhaustive hyperplane scan against the label null;
        yield ratios against 2^{1-m} and 2; the relabelled replica. Transfer
        to n = 131: none (stated).
    - id: H-39014f-3
      statement: >-
        Per-attempt cost separation (inherited, IDEA-20260915-3119c9 H2): at
        fixed l, the per-instance cost of an exhaustive-core decomposition does
        not depend on which affine slice of one span is used (V^(0) versus
        V^(1)), within 10 percent.
      rigorous_support: >-
        3119c9's reading of IDEA-20260915-0d8e90 Proposition 1 (leaf count is a
        property of block sizes; the ANF differs in linear terms). Adopted with
        credit, not re-derived.
      validation_plan: >-
        Not part of the minimal test (needs a solver). When an engine is
        available: V^(0) against V^(1) against RH at equal l, at least 20
        instances per arm per cell, conflict counts with IQRs. The
        V_k-versus-A_k comparison is a different (product-space) arm and is
        labelled so.
  heuristic_note: >-
    The parity rule and C1 carry no heuristic. The one-bit pricing rests on
    H-39014f-1, the depth-2 pricing on H-39014f-2, and any statement that the
    yield gain is not eaten by per-attempt cost on H-39014f-3, which this record
    does not test.

  target_complexity:
    time_exponent: >-
      No exponent moves. A factor-base design rule worth at most a factor 2 in
      decompositions per target at matched window size, at every m (under
      H-39014f-1). By the scaling CORR-20260928-4cb669 states, the free-oracle
      floor of an aligned window (ambient N = 2r) sits 2/(m+1) bits below the
      N = 4r table (worksheet A6); per-attempt solver cost is inherited.
    memory_exponent: Unchanged at matched size (same |F|, same relation matrix).
    best_known: >-
      Matched Pollard rho, sqrt(pi r / (4k)) (CORR-20260922-81aeab): 2^60.8090
      on ECC2K-130, 2^77.15 on K-163, 2^80.83 on B-163, 2^279.75 on K-571,
      2^284.83 on B-571 (rho_convention); other rows not computed here.
    hidden_overhead: >-
      Per-attempt decomposition cost is not estimated; if H-39014f-3 fails
      (or, for the A_k comparison, the larger product space costs more), the
      one-bit yield gain can be offset. The depth-2 label's membership cost is
      unpriced.
    tradeoff_note: >-
      No time-memory tradeoff; the label is a precompute filter, embarrassingly
      parallel over legs. At m >= 4 the per-attempt comparator is the D3 column
      of CORR-20260928-4cb669 (2^11.010251 at m = 4), never D1; this record does
      not recompute D3 under an aligned window and bounds the change by the
      factor-2 yield (at most +1 bit), conditional on H-39014f-1 and D3's own
      model.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Estimate. Stage 0 is hand arithmetic at setup (minutes). Stage 1: about
      |W|^2/2 group additions per target at m = 3 (about 1.3e5 at 512 points),
      40 + 20 targets x 4 windows x 2 cells x 2 arities, tens of CPU-minutes in
      pure Python, no solver. Stage 2: about 512 scalar multiplications for the
      membership check, the same census on three sub-windows, and a 1022-
      hyperplane scan; minutes. A self-contained scalar implementation needs no
      numpy.

  asymptotic_claim:
    problem: Relation yield of Semaev polynomial-basis windows on binary curves of odd degree, by the trace-parity label.
    prior_best: Semaev's V_k (balanced at odd n); IDEA-20260915-3119c9's searched class-aligned slices.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: per-attempt solver cost (inherited, H-39014f-3); depth-2 membership cost (unpriced)
    claim_kind: yield_design_rule_plus_scoped_proposition

  dominated_by: >-
    n/a (no attack result claimed). This record states no time, memory or
    data/query cost for any attack, so it neither dominates nor is compared
    against any frontier row on those axes; the comparator on every row is that
    row's matched Pollard rho (best_known). On ECC2K-130 the floors that
    CORR-20260928-4cb669 records stay above matched rho at m <= 3 under every
