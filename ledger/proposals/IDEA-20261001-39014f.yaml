  rho_convention:
    convention: >-
      CORR-20260922-81aeab: matched rho = sqrt(pi r / (4k)) group operations,
      negation counted once (inside the 4), k the order of the curve's
      Frobenius class map (k = n on Koblitz rows, k = 1 on the B-curves, which
      are not defined over F_2). The superseded record's form
      0.886 sqrt(r) / sqrt(2n) spends negation twice and is withdrawn.
    figures:
      - row: ECC2K-130
        log2_rho: 60.8090
        provenance: >-
          Re-derived in this task: log2 r = 129.0000 (r =
          680564733841876926932320129493409985129, r - 2^129 = 5.57e18), so
          log2 rho = 64.5 - 0.174252 (half of log2(pi/4)) - 3.516712 (half of
          log2 131) = 60.80904; agrees with CORR-20260922-81aeab and
          CORR-20260928-4cb669 (2^60.8090). Arithmetic check A1 of the worksheet.
      - row: K-571
        log2_rho: 279.75
