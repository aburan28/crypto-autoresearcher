  assumptions:
    - >-
      Single-block, same-chaining-value collisions. For a MULTI-BLOCK attack
      the final state difference of an intermediate block need not be zero, and
      the terminal condition becomes "equal to the target near-collision
      difference" instead of "zero". The screen generalises directly by
      substituting that target, but every number reported is scoped to the
      single-block case unless the multi-block variant is run explicitly.
    - >-
      The enumerated delta_m family is support size at most 2 with each nonzero
      word difference a single signed power of two. This is a DECLARED,
      ARBITRARY, AND ADMITTEDLY NARROW slice chosen because it is exhaustively
      enumerable; it is not claimed to contain any published family, and if a
      published family lies outside it the screen says nothing about that
      family.
    - >-
      Reduced-step MD5 means the first r entries of the standard schedule with
      the standard rotation amounts and constants, and the last-use step of a
      word is recomputed for each r. No other reduction is used.

  proof_search_map:
    bottleneck: >-
      The MD5 half of this question has no readable data and therefore no
      measurable quantity at all. Every existing route to one runs through
      acquisition, which is blocked. The bottleneck is the dependence of the
      measurement on the literature, and this proposal removes it rather than
      waiting it out.
    baseline_embedding:
      parameter_slice: >-
        Screen depth 0 with the trivial condition "the state difference after
        the last differing step is unconstrained" reproduces the current
        baseline exactly: every enumerated delta_m survives, surviving fraction
        1.0. That is the program's present state of knowledge about the MD5
        delta_m space, and it is the boundary the screen must strictly improve
        on to be worth anything.
      reproduction_check: >-
        Frozen fixture asserting surviving_fraction == 1.0 at depth 0 for every
        r, so that a screen which excludes something at depth 0 is caught as a
        bug rather than celebrated as power.
    observation_collision:
      observable: >-
        The boolean SURVIVES / EXCLUDED verdict on a delta_m, plus the depth at
        which exclusion first occurs.
      distinct_preimage_search: >-
        The decisive collision hunt is against GROUND TRUTH rather than against
        another object: at small r, brute-force search for a literal conforming
        message pair for delta_m vectors on BOTH sides of the verdict. A
        delta_m the screen EXCLUDES for which brute force finds a colliding
        pair is a DIRECT FALSIFIER of the derivation or its implementation and
        is the single most valuable outcome the experiment can produce. The
        dual -- a surviving delta_m for which brute force finds nothing --
        is NOT a falsifier, because a necessary condition is not sufficient,
        and any record that reads it as one is wrong.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "a full differential path with
          its condition set" to "a tail-feasibility certificate", and prove a
          strict inward improvement: the tail certificate excludes a nonempty
          set of delta_m that no condition count excludes, at a cost of
          O(depth) rather than O(steps * conditions).
        predicted_gain: >-
          A rigorous exclusion set obtainable in about 10^7 operations, versus
          no exclusion set at any cost today.
      - transform: representation_reduction
        proposed_object: >-
          Move from probabilistic differential propagation to an EXACT equality
          constraint by using the bijectivity of the step map, so that the tail
          is a linear-algebra-like question rather than a probability.
        predicted_gain: >-
          Eliminates the differential model entirely for the model-free depths,
          which is what makes the exclusions rigorous rather than heuristic.
    quantifier_order: >-
      "FOR ALL message pairs (M, M') with M' - M = delta_m and FOR ALL chaining
      values, IF the compression outputs are equal THEN the state difference
      after step t_last(delta_m) is zero." Universally quantified over pairs and
      chaining values with NO existential witness anywhere, which is exactly why
      it is a necessary condition and why its violation excludes delta_m
      outright. The measurable claim C is a different shape -- "the FRACTION of
      a declared finite enumerated set that survives" -- and is a count over a
      declared set, not a statement about all delta_m.
    method_ceiling:
      strongest_certifiable_claim: >-
        That a specific, explicitly listed set of low-weight signed delta_m
        vectors admits NO single-block collision path at a given step count,
        rigorously and with no differential model, plus the complementary
        explicit surviving list. IT CANNOT CERTIFY that a surviving delta_m
        admits a path (necessary is not sufficient), cannot certify anything
        about delta_m outside the enumerated slice, cannot certify anything
        about multi-block or chosen-prefix attacks without the substituted
        target difference, and CANNOT SAY WHETHER ANY SURVIVOR IS NEW, because
        the census is empty and this proposal does not populate it.
      nearby_object_control: >-
        MD4, where the hoped-for conclusion should CHANGE rather than fail: MD4
        has three rounds and a different word schedule, so t_last and the tail
        length differ, and the surviving fraction must differ measurably. An
        implementation returning the same surviving set for MD4 and MD5 is
        reading the enumeration and not the schedule. A SECOND nearby object
        where the conclusion genuinely FAILS: a modified MD5 whose step
        replaces the modular addition of the message word with a
        NON-INJECTIVE operation (for example AND with a constant). The step map
        is then not a bijection, claim A is false by construction, and the
        screen must be shown to LOSE its exclusions there. A screen that still
        excludes on the non-injective variant is not using bijectivity and its
        derivation is not the one claimed.
    proof_obligations:
      - claim: >-
          PO-0. The MD5 step form, round functions, rotation amounts, constants
          and word schedule are pinned from RFC 1321 primary text before any
          screen runs.
        responsibility: baseline
      - claim: >-
          PO-1. The step map with fixed message word is a bijection, verified
          BOTH symbolically and by an explicit inverse function tested on 10^6
          random states round-tripping to identity.
        responsibility: correctness
      - claim: >-
          PO-2. The last-use step t_last(j) is computed from the pinned
          schedule for every word and every r, and cross-checked against a
          direct scan of the schedule table rather than against a formula.
        responsibility: correctness
      - claim: >-
          PO-3. The depth at which the screen ceases to be model-free is
          computed per delta_m and reported; model-free and modelled exclusions
          are counted in separate columns and never summed.
        responsibility: strictness
      - claim: >-
          PO-4. Any claimed conforming pair carries a literal message pair
          re-verified by an INDEPENDENT reference MD5 implementation, per
          docs/claims-and-verification.md.
        responsibility: correctness
      - claim: >-
          PO-5. A brute-force search that finds nothing is reported as a BUDGET
          OUTCOME about a solver with its declared budget, never as evidence
          that no pair exists.
        responsibility: scope

  predictions:
    - metric: >-
        model_free_surviving_fraction at r = 64 over the enumerated signed
        low-weight delta_m set
      direction: lower
      minimum_effect: >-
        below 0.05, i.e. at least a 20-fold reduction from the depth-0
        baseline of 1.0. A value above 0.5 means the tail condition has
        essentially no power at full length and is a measured obstruction to be
        recorded as such.
    - metric: >-
        model_free_surviving_fraction as a function of r in {16, 24, 32, 48, 64}
      direction: lower
      minimum_effect: >-
        monotonically non-increasing in r, with the value at r = 64 at most
        half the value at r = 16. A NON-MONOTONE curve indicates a bug in the
        per-r recomputation of t_last, since a longer tail cannot admit more
        vectors.
    - metric: >-
        first_exclusion_depth distribution (the depth at which an excluded
        delta_m is first excluded)
      direction: lower
      minimum_effect: >-
        median at most 4. If most exclusions happen only at large depth, they
        are mostly MODELLED rather than model-free and the rigorous content of
        the result is smaller than the headline.
    - metric: >-
        brute_force_soundness_violations (excluded delta_m for which a
        conforming pair is nevertheless found at reduced r)
      direction: lower
      minimum_effect: >-
        exactly 0. Any nonzero value falsifies claim A or its implementation
        and is the run's most important output.
    - metric: >-
        positive_control_certified_pairs (surviving delta_m at reduced r for
        which a literal conforming message pair is found and re-verified
        independently)
      direction: higher
      minimum_effect: >-
        at least 1, and preferably at least 3 at r = 16. THE INSTRUMENT MUST BE
        SHOWN TO FIRE. Zero certified pairs means the screen's SURVIVES verdict
        has never been shown to correspond to anything real, and no coverage
        conclusion may be drawn from that run.
    - metric: >-
        md4_versus_md5_surviving_set_jaccard (overlap of the two surviving sets
        at matched r)
      direction: lower
      minimum_effect: >-
        below 0.9. Near-identical sets mean the screen is reading the
        enumeration rather than the schedule.
    - metric: noninjective_variant_exclusion_count
      direction: lower
      minimum_effect: >-
        must drop to 0 or near 0 on the non-injective control, since claim A's
        hypothesis is removed there.

  minimal_test:
    design: >-
      ONE EXECUTOR TASK, five stages, all cheap, with a hard gate at stage 3.
      STAGE 0 pins RFC 1321 from primary text, implements MD5 and its step
      inverse, and discharges PO-1 by round-tripping 10^6 random states.
      STAGE 1 enumerates the declared delta_m slice (support at most 2, each
      nonzero word difference a single signed power of two, about 4.9 * 10^5
      vectors) and computes t_last for each at every r in {16, 24, 32, 48, 64}.
      STAGE 2 applies the backward tail screen at increasing depth, recording
      per vector the verdict, the first exclusion depth, and whether that depth
      was model-free or modelled; emits two separate columns and never a sum.
      STAGE 3 IS THE POSITIVE CONTROL AND IT GATES THE CONCLUSION: at r = 16,
      pick surviving delta_m vectors and brute-force for a literal conforming
      message pair within a declared evaluation budget; every pair found is
      re-verified by an INDEPENDENT reference MD5 implementation and its
      certificate recorded. IF NO PAIR IS CERTIFIED, the coverage numbers are
      reported as UNINTERPRETED, because an instrument never shown to fire
      cannot certify a negative. STAGE 4 runs the soundness hunt (brute-force
      against EXCLUDED delta_m at r = 16 and r = 24 within the same budget) and
      the two nearby-object controls, MD4 and the non-injective variant.
    controls:
      - >-
        POSITIVE CONTROL, GATING: at least one literal conforming message pair
        for a surviving delta_m at reduced r, re-verified independently. This
        is the instrument firing, and it uses a CERTIFICATE rather than a
        citation, which is why it works while the acquisition lane is blocked.
      - >-
        SOUNDNESS CONTROL: brute force against EXCLUDED delta_m must find
        nothing. A hit falsifies the derivation. Note the asymmetry explicitly:
        finding nothing here is EXPECTED BY THEOREM and is therefore weak
        evidence, while finding something is decisive.
      - >-
        NULL OBJECT: run the identical screen against RANDOM delta_m vectors
        drawn outside the enumerated slice and against a random permutation of
        the word schedule. The surviving fraction must differ from the real
        schedule's; if a shuffled schedule gives the same answer, the screen is
        not reading the schedule.
      - >-
        DEPTH-0 REGRESSION FIXTURE: surviving fraction exactly 1.0 at depth 0
        for every r.
      - >-
        NEARBY-OBJECT CONTROLS: MD4 (conclusion must change) and the
        non-injective step variant (conclusion must fail).
      - >-
        MODEL-FREE VERSUS MODELLED SEPARATION, enforced in the emitted JSON as
        two columns with unmeasured cells written as null and never as 0.
      - >-
        FIREWALL CONTROL: the task holds no read access to
        coordination/goals/GOAL-MD5-001/quarantine/** and its receipt records
        that no path under that directory was opened, by mechanism rather than
        by attestation.
    required_metrics:
      - model_free_surviving_fraction per r, with numerator and denominator
      - modelled_surviving_fraction per r, reported in a separate column
      - first_exclusion_depth distribution, split model-free versus modelled
      - the explicit surviving list at r = 64, emitted as an artifact
      - brute_force_soundness_violations, with any witness printed in full
      - positive_control_certified_pairs, each with its literal message pair and
        independent re-verification record
      - brute_force_budget_spent and the declared ceiling, for every search
      - md4_versus_md5_surviving_set_jaccard
      - noninjective_variant_exclusion_count
      - shuffled_schedule_surviving_fraction

  falsification_conditions:
    - >-
      A literal conforming message pair is found for a delta_m the screen
      EXCLUDES. Claim A or its implementation is false; the record is
      superseded, not amended.
    - >-
      The step map is measured not to be a bijection under the pinned RFC 1321
      definition (round-trip failure on any of 10^6 states). Everything
      collapses.
    - >-
      model_free_surviving_fraction at r = 64 exceeds 0.5: the tail condition
      has no screening power at full length. This is a measured obstruction
      with a quantity attached and is recorded under the closure standard, with
      forward guidance naming what remains -- larger support, larger depth, the
      modelled screen, or the multi-block target difference.
    - >-
      The surviving fraction is NON-MONOTONE in r, or the shuffled-schedule
      control gives the same answer as the real schedule: the implementation is
      not reading the schedule and no number from the run may be cited.
    - >-
      Zero certified conforming pairs at stage 3 within the declared budget:
      the SURVIVES verdict is uncorroborated, the coverage figures are reported
      as uninterpreted, and the budget outcome is recorded as a budget outcome.
    - >-
      RFC 1321 primary text, once read, differs from the recalled step form,
      schedule or rotation amounts. Every number is then about a primitive that
      is not MD5 and is withdrawn.

  confounders:
    - >-
      NECESSARY IS NOT SUFFICIENT, AND THIS IS THE MOST LIKELY MISREADING. A
      SURVIVES verdict means only that one specific obstruction does not apply.
      A reader who takes the surviving list as a list of viable message
      differences has substituted sufficiency for necessity. Every emitted
      artifact must carry the word NECESSARY in its schema.
    - >-
      THE ENUMERATED SLICE IS NARROW AND ARBITRARY. Support at most 2 with
      single signed powers of two was chosen for enumerability. If real
      characteristics live at larger support, the whole measurement is about a
      corner of the space, and the surviving fraction is a fraction of that
      corner. This is disclosed in every figure caption, not in a footnote.
    - >-
      MODULAR VERSUS EXCLUSIVE-OR DIFFERENCES. The model-free levels use only
      the fact that a zero difference stays zero, which holds in both models.
      The moment a nonzero difference enters a round function the two models
      diverge and the screen becomes model-dependent. Reporting a single
      surviving fraction across the boundary would silently convert a theorem
      into a heuristic.
    - >-
      BRUTE-FORCE BUDGET AS A HIDDEN VARIABLE. At reduced r the search may
      succeed for easy delta_m and fail for hard ones purely on budget, so the
      set of certified pairs is biased toward low-condition vectors. The budget
      spent per vector is a required metric precisely so that this bias is
      visible.
    - >-
      REDUCED-STEP MD5 IS A DIFFERENT PRIMITIVE. Its collisions are not MD5
      collisions and are used here ONLY as instrument certificates. No result
      about reduced-step MD5 is claimed and no such result would be new.

  interpretation_limits:
    - >-
      NO PATH IS CLAIMED NEW. The census is readable-empty; this proposal
      neither populates it nor adjudicates against it. It produces a set that a
      later, acquisition-enabled task could locate published families inside.
    - >-
      NO COLLISION OF FULL MD5 IS CLAIMED, no attack cost is claimed, and
      nothing is said about any deployed system. Claim tier ceiling `analyzed`,
      except that any conforming pair at reduced steps is a `certified` object
      in the narrow sense of docs/claims-and-verification.md and is nothing
      more.
    - >-
      Scoped to single-block, same-chaining-value collisions, to the declared
      delta_m slice, to the pinned specification, to the step counts actually
      run, and to the brute-force budget actually spent.
    - >-
      THE QUARANTINE IS NOT CROSSED AND IS NOT NEEDED. The result's
      independence from the blocked acquisition lane is the point, and the
      honest cost of that independence is that the surviving list cannot be
      compared to any published family until acquisition happens.

  heuristic_assumptions:
    - id: H1
      statement: >-
        BEYOND THE MODEL-FREE DEPTH, the backward propagation uses a declared
        signed-modular difference model in which the round function's output
        difference is determined by its input differences. Formally: for the
        levels at which some round-function input carries a nonzero difference,
        the screen assumes that the set of output differences consistent with
        the given input differences is exactly the set the declared model
        enumerates. This imitates the classical assumption, standard throughout
        differential cryptanalysis of ARX designs, that a difference
        distribution table over a chosen difference representation captures
        propagation faithfully.
      rigorous_support: >-
        Rigorous ONLY at the levels where every round-function input has zero
        difference, where the output difference is exactly zero with no model.
        Beyond that the model is an approximation with a known failure mode:
        modular and exclusive-or differences do not determine one another, and
        carry behaviour makes the modular model lossy at bit boundaries. THE
        RECORD THEREFORE NEVER POOLS THE TWO REGIMES.
      validation_plan: >-
        Sample 10^5 (state difference, message difference, step index) triples
        under declared seeds; for each, enumerate the TRUE set of achievable
        output differences by exhaustive search over a randomly restricted
        state slice, and compare against the model's prediction. Report the
        false-exclusion rate -- the fraction of triples where the model
        forbids an output difference that actually occurs -- as the quantity
        that decides whether a modelled exclusion is admissible at all. A
        false-exclusion rate above 0 means MODELLED EXCLUSIONS ARE UNSOUND and
        must be demoted to "flagged, not excluded". Tail check: the deepest
        modelled exclusion observed is re-checked individually by brute force
        at reduced r. Sampled parameters: word width 32, all four round
        functions, rotation amounts as pinned. TRANSFER ASSUMPTION, STATED: no
        transfer of the false-exclusion rate from reduced r to full r is
        claimed, and the modelled column is reported per r.
    - id: H2
      statement: >-
        The enumerated slice -- support at most 2, each nonzero word difference
        a single signed power of two -- is representative enough of the
        low-weight delta_m space that the measured surviving FRACTION is
        informative about the low-weight space generally. This imitates the
        common practice of characterising a large structured space by its
        lowest-weight stratum.
      rigorous_support: >-
        NONE. It is a convenience slice chosen for exhaustive enumerability.
        The rigorous content is only that the screen's verdicts ON THE SLICE
        are exact.
      validation_plan: >-
        Extend to support 3 on a RANDOM SUBSAMPLE of 10^5 vectors (the full
        support-3 space is about 10^8 and is out of budget) and compare the
        surviving fraction to the support-2 value. A difference exceeding a
        factor of 2 falsifies representativeness and means every figure must be
        reported per support size with no aggregate. Second route: extend the
        per-word difference alphabet from single signed powers of two to sums
        of two signed powers on a subsample and repeat. Tail check: inspect the
        surviving vectors of largest support individually. Record the subsample
        seeds and sizes; state explicitly that no extrapolation to arbitrary
        support is claimed.

  target_complexity:
    time_exponent: >-
      Enumeration 4.9 * 10^5 vectors, each screened at depth up to 8 with O(1)
      word operations per level, about 2^23 operations total across all five
      step counts. Step-inverse round-trip validation 10^6 states, about 2^26
      operations. The dominant cost is the brute-force positive control at
      reduced r, capped by a declared evaluation budget of at most 2^32 MD5
      step evaluations, i.e. hours single-threaded and minutes on four cores.
      TOTAL: below 2^33 operations under the declared cap.
    memory_exponent: >-
      Negligible: the enumerated list is 4.9 * 10^5 records of a few words,
      under 50 MB including verdicts and per-vector metadata. No table, no
      birthday storage, no tradeoff.
    best_known: >-
      For "which low-weight MD5 message differences are excluded outright" this
      program holds NO method and NO number: the depth-0 baseline is that all
      of them survive. In the literature the position is UNKNOWN because no
      primary source was opened; the bijectivity of the MD5 step and the
      requirement that the state difference vanish after the last differing
      word are ALMOST CERTAINLY STANDARD FOLKLORE among practitioners, and
      `novelty_status: unverified` reflects that expectation honestly rather
      than hiding it. What is plausibly not standard is using it as an
      EXHAUSTIVE SCREEN over an enumerated slice with a certified positive
      control, and even that is unverified.
    hidden_overhead: >-
      No asymptotic parameter and no o(1). The real hidden cost is
      INTERPRETIVE, not computational: the surviving fraction is a fraction of
      a narrow declared slice under a necessary-only condition, so a small
      number is much weaker than it sounds and a large number is a clean
      obstruction. Both readings are stated in advance so neither can be
      presented as a surprise.
    tradeoff_note: >-
      The screen is embarrassingly parallel and memory-free. The brute-force
      control is the only place where budget matters, and it trades wall clock
      against the number of certified pairs; that trade is reported per vector
      with the budget spent, never as a single success count.

  dominated_by: >-
    PARETO CHECK ROW BY ROW. (1) Against this program's committed MD5 census
    and adjudicator: NOT dominated and not comparable -- the census is
    readable-empty and the adjudicator decides membership, while this produces
    an exclusion set from the primitive itself and needs no census. (2) Against
    IDEA-20260828-400967 (template-density enumeration on reduced-round
    MD4/MD5): NOT dominated -- that record measures a MODELLED condition-count
    density and returns a curve; this returns a MODEL-FREE exclusion set and an
    explicit list, at comparable or lower compute. They overlap in machinery and
    would cross-validate. (3) Against the RQ-MDFIVE-6870c1 MITM/preimage line
    (IDEA-20260828-69bde4, -12ce12, -163513, -4d7330): NOT dominated and
    disjoint -- those concern preimage architectures and differential
    probability models, not the reachability of message differences for
    collisions. (4) Against the published MD5 collision literature: STRICTLY
    DOMINATED ON COLLISION-FINDING and this record makes no collision claim.
    Whether the tail condition itself is published is UNKNOWN because no paper
    was opened; if it is folklore, the contribution reduces to the exhaustive
    screen and its controls, which is a smaller but still nonzero delta. THAT
    ROW IS OPEN AND IS NOT CLOSED HERE. (5) Against the quarantined Wang
    characteristic: NOT COMPARABLE BY CONSTRUCTION -- it is referenced by digest
    only and is neither read nor needed.
  sota_delta: >-
    QUANTITATIVELY, AGAINST THE PROGRAM'S OWN STATE. The number of low-weight
    signed MD5 message differences this program can currently exclude on
    rigorous grounds is ZERO, out of an enumerated slice of about 4.9 * 10^5.
    This proposal predicts that number rises to at least 95 percent of the
    slice at r = 64, at a cost below 2^33 operations, with the exclusions
    model-free and the SURVIVES side corroborated by at least one
    independently re-verified conforming message pair. Equivalently: the MD5
    lane moves from "blocked with no measurable quantity" to "one measured
    quantity with a stated scope", WITHOUT touching the blocked acquisition
    route. NO CRYPTANALYTIC DELTA IS CLAIMED: no collision, no cost improvement,
    no statement about MD5's security, and no claim that any surviving
    difference is new.

  estimated_cost:
    implementation: medium
    compute: medium

  recommended_priority: high
