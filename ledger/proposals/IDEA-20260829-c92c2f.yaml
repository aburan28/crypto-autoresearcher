idea:
  id: IDEA-20260829-c92c2f
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    A LITERATURE-FREE NECESSARY CONDITION FOR MD5, WHICH ROUTES AROUND THE
    BLOCKED ACQUISITION LANE ENTIRELY: the MD5 step is a bijection on the state
    once its message word is fixed, so the state difference must be EXACTLY
    ZERO from the last differing-word step onward -- screen the enumerable
    low-weight signed delta_m space against that tail condition and report the
    surviving set as a coverage measure with a brute-force conforming-pair
    positive control
  class: measurement

  claim: >-
    (A) RIGOROUS STRUCTURAL FACT, DERIVABLE FROM RFC 1321 ALONE AND FROM NO
    PAPER. One MD5 step maps the state tuple (a, b, c, d) to
    (d, b + ROTL_s(a + f(b,c,d) + m + K), b, c). With the message word m held
    fixed this map is a BIJECTION of the 128-bit state: from the output tuple
    one recovers d, b and c directly and then a by inverting the rotation and
    subtracting. Consequently, for two messages differing by delta_m and
    processed from the SAME chaining value, every step after the last step that
    consumes a differing message word applies the IDENTICAL bijection to both
    computations. Since a single-block collision requires equal outputs and the
    Davies-Meyer feed-forward adds back an equal chaining value, THE FULL
    128-BIT STATE DIFFERENCE MUST BE EXACTLY ZERO IMMEDIATELY AFTER THE LAST
    STEP CONSUMING A DIFFERING WORD. No probability, no path, no model.
    (B) THE TAIL CONDITION IS COMPUTABLE AND CASCADES BACKWARDS. Unwinding one
    step from the terminal zero forces, at that last differing step, the
    incoming modular difference of register a to equal minus the message-word
    difference and the other three registers to have zero difference -- again
    with no differential model, because a round function whose three inputs
    have zero difference has zero output difference exactly. Iterating the
    unwind to depth k yields a chain of necessary conditions; the first few
    levels are MODEL-FREE for the same reason, and the levels beyond the point
    where a round-function input first carries a nonzero difference are
    NECESSARY-UNDER-A-DECLARED-DIFFERENCE-MODEL and are reported separately and
    never pooled with the model-free ones.
    (C) THE MEASURABLE CLAIM. Over the exhaustively enumerable set of signed
    low-weight message differences -- support of size at most 2, each nonzero
    word difference a single signed power of two, about 4.9 * 10^5 vectors --
    the fraction surviving the model-free tail screen at full-length MD5 and at
    reduced step counts r in {16, 24, 32, 48, 64} is a well-defined number this
    program has never computed. THE PREDICTION IS THAT IT COLLAPSES: below 0.05
    at r = 64 under the model-free screen. IF IT COLLAPSES, the MD5 low-weight
    delta_m space is EXPLICITLY LISTABLE and the tiling question is decidable
    at that weight without reading a single paper. IF IT DOES NOT COLLAPSE, the
    tail condition has no screening power and that is a NAMED, MEASURED
    obstruction rather than a fatigue report.
    NO PATH IS CLAIMED NEW, NO COLLISION OF FULL MD5 IS CLAIMED, AND NOTHING
    HERE READS OR RECONSTRUCTS ANY QUARANTINED MATERIAL.

  mechanism: >-
    The MD5 half of this question is recorded as BLOCKED, not closed: the only
    MD5 path source in the corpus is behind another goal's firewall, eight
    further sources are an acquisition gap, and the readable census is size
    zero. Four batches of instrument work therefore produced an adjudicator
    that has never met a real MD5 characteristic, and every planted MD5 entry
    carries a weight-1 message difference that no real characteristic has.
    THE MECHANISM HERE IS TO STOP NEEDING THE LITERATURE. A necessary condition
    on delta_m derived from the primitive's own step function is a statement
    about the difference space that no census can contradict and no firewall
    can block. It measures the space directly instead of measuring the
    published description of it.
    WHY A TAIL CONDITION AND NOT A HEAD CONDITION. Differential-path search
    normally runs forward and pays for conditions as it goes, which is why
    condition counting is expensive and model-dependent. The tail runs the
    other way and is nearly free, because the step map with a fixed message
    word is a bijection: the constraint at the end is an EQUALITY, not a
    probability, and equalities propagate backwards without a differential
    model until the first step at which a round-function input actually carries
    a difference. The depth at which that happens is itself a measurable
    quantity and is the natural place to cut the rigorous screen from the
    modelled one.
    THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY COMPUTE. The tracked object is
    the pair (support of delta_m, terminal-tail feasibility), which projects
    away the entire interior differential path, all sufficient bitconditions,
    all signed-bit patterns and the whole message-modification budget. That is
    genuinely lossy -- an enormous quotient. It is discarded COMPATIBLY with
    MD5's operations for a precise reason: after the last differing step the
    retained part (zero versus nonzero state difference) propagates
    DETERMINISTICALLY under the step map, because a bijection applied to equal
    inputs gives equal outputs and applied to unequal inputs gives unequal
    outputs. The projection is therefore not a change of coordinates, and the
    retained part does propagate, which is exactly the pair of properties the
    inventor protocol section 2 requires.
    THE COVERAGE PAYOFF. A necessary condition partitions the enumerated
    delta_m space into EXCLUDED and SURVIVING. Excluded means no differential
    path of any kind exists for that delta_m at that step count -- a genuine
    negative about the object, not about a search. The surviving set is an
    explicit, listable upper bound on the reachable low-weight delta_m space,
    and the covering question for MD5 becomes "where do the published families
    sit inside THIS list", which is a question acquisition can answer later
    against a list that already exists.

