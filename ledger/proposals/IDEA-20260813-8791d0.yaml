idea:
  id: IDEA-20260813-8791d0
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: Hypercube face-spectrum concentration for split-aware joining
  class: representation
  claim: >-
    If the primary SDitH construction defines affine face or subcube relations
    among opened views, test whether the indicator or weight function of
    transcript-consistent split supports has statistically significant
    low-degree Walsh or Möbius spectral concentration that enables a fully
    charged meet-in-the-middle join below matched plain-random-SD ISD. No such
    relation, concentration, or speedup is asserted.
  mechanism: >-
    Linear rank can be full while the Boolean function marking admissible
    support assignments remains spectrally concentrated because the same
    source-defined face relations are reused across many coordinates. A sparse
    low-degree spectrum could provide a compact separator: enumerate partial
    block errors, map them to spectral signatures, and join only compatible
    buckets. The mechanism survives the failure of a raw rank-deficit test but
    must beat a density-, rank-, and degree-matched random-function null and pay
    for spectrum discovery and tables.
  why_not_a_renamed_known_approach: >-
    IDEA-20260813-2caec5 studies quotient linear rank and entropy; this proposal
    targets nonlinear concentration after rank is matched. IDEA-20260808-a7872e
    factors the error-locator ideal algebraically across blocks, while the
    proposed separator is a Fourier or Möbius representation of the
    transcript-consistency predicate and need not factor the ideal. cbd93d's
    admissibility ratio controls only total density, and 43d6df is the charged
    baseline. The proposal is not the continuous-d sweep of 7504c6.
  predictions:
    - metric: low-degree spectral mass above density-rank-matched null
      direction: higher
      minimum_effect: >-
        A preregistered spectral-mass excess outside the 99 percent null envelope
        on a source-valid toy slice, with all searched degrees included in correction.
    - metric: effective number of spectral join buckets
      direction: lower
      minimum_effect: >-
        At least a factor of 2 fewer fully populated buckets than the matched
        random predicate at equal false-negative probability.
    - metric: charged join work versus IDEA-20260813-27df0c
      direction: lower
      minimum_effect: >-
        At least 1 net work bit at a matched concrete instance; asymptotic
        relevance requires the useful spectral support exponent to be strictly
        below the plain-ISD work exponent after discovery cost.
    - metric: planted sparse-spectrum positive-control recovery
      direction: higher
      minimum_effect: Recover the planted characters and their designed join reduction.
  minimal_test:
    design: >-
      Without execution here, derive the exact source-defined transcript-
      consistency predicate for the smallest valid hypercube slice. Compute its
      complete spectrum where feasible, or certified low-degree coefficients,
      after fixing quotient rank and admissibility density. Compare with random
      predicates having identical domain, density, linear constraints, and
      coordinate degrees. Specify a spectral bucket join only after excess mass
      survives those nulls, then charge it against IDEA-20260813-27df0c.
    controls:
      - Fully charged IDEA-20260813-27df0c baseline before any advantage calculation.
      - Random predicates matched on domain, density, quotient rank, and coordinate degrees.
      - Phase-randomized spectrum preserving coefficient magnitudes but destroying useful character alignment.
      - Source-valid nearby hypercube slice with face labels independently permuted.
      - Planted low-degree sparse-spectrum predicate of known support.
      - Exact cbd93d admissibility count and 2caec5 rank profile as conditioned controls.
    required_metrics:
      - Full or certified low-degree spectral mass and tail under all nulls.
      - Spectrum discovery cost, coefficient storage, bucket occupancy, and collision rate.
      - Join success probability, false-negative probability, and verification cost.
      - Total time, peak memory, preprocessing, data, oracle, and amortization regime.
  controls:
    - certified_charged_isd_baseline
    - density_rank_degree_matched_random_predicate
    - phase_randomized_spectrum_null
    - planted_sparse_spectrum_positive_control
  confounders:
    - Spectral concentration forced only by public linear relations already charged in the rank quotient.
    - Searching many bases, degrees, or labelings without multiplicity correction.
    - Treating coefficient computation as free preprocessing.
    - Small hypercubes whose every predicate has a sparse spectrum.
    - A spectral statistic that cannot be evaluated from attacker-visible data.
    - Bucket imbalance increasing verification or memory beyond the baseline.
  falsification_conditions:
    - Spectral mass lies inside the density-rank-degree-matched null after correction while the planted control is recovered.
    - Excess concentration disappears after quotienting the 2caec5 linear relations or matching cbd93d density.
    - No separator converts the coefficients into at least 1 net charged work bit.
    - Spectrum discovery, storage, or false-negative amplification dominates the saved ISD work.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - Spectral concentration is an artifact until identical measurements pass the matched random-predicate null.
    - A sparse toy spectrum is not an asymptotic attack.
    - A compact separator is not a decoder until success, retries, memory, and verification are proved.
    - The MPCitH-versus-SD binding crossover remains governed separately by IDEA-20260808-d873bc.
  assumptions:
    - Primary sources expose a finite Boolean or field-valued transcript-consistency predicate over hypercube choices.
    - The predicate and chosen basis are attacker-computable without secret-only views.
    - A matched plain-SD and d-split cost frontier is frozen before comparison.
  heuristic_assumptions:
    - id: H-SPEC-1
      statement: >-
        Conditional on domain size, admissibility density, quotient linear rank,
        and coordinate-degree profile, a random predicate has the reference
        low-degree spectral tail used for the null.
      rigorous_support: >-
        Parseval identities and exact finite Fourier transforms fix total mass;
        the heuristic is the conditioned distribution of mass across characters.
      validation_plan: >-
        Enumerate the conditioned null at the smallest slice, sample it with
        fixed seeds at larger toy slices, report complete coefficient and maximum
        tails, and include phase-randomized and label-permuted controls.
    - id: H-SPEC-2
      statement: >-
        A family with useful spectral support of size 2^(sigma N), sigma below
        the matched plain-ISD exponent tau_plain, admits a bucket join whose
        total charged exponent is max(sigma, table, verification) below tau_plain.
      rigorous_support: >-
        Standard meet-in-the-middle accounting bounds enumeration by the larger
        side and bucket verification; applicability depends on the source
        predicate yielding a complete, low-false-negative separator.
      validation_plan: >-
        Implement no run here. A later approved plan must prove completeness on
        exact toy instances, compare predicted and observed bucket tails at at
        least three sizes, and reject exponent relevance when sigma approaches
        tau_plain or discovery cost dominates.
  proof_search_map:
    bottleneck: >-
      Show that source-defined nonlinear spectral concentration remains after
      matching density and quotient rank, then turn it into a complete decoder separator.
    baseline_embedding:
      parameter_slice: >-
        Exact IDEA-20260813-27df0c baseline row and the same frozen source-valid
        hypercube slice used for cbd93d density and 2caec5 rank controls.
      reproduction_check: >-
        Reproduce baseline work within 0.25 bit, predicate density exactly, and
        quotient rank before any spectrum is inspected.
    observation_collision:
      observable: Low-degree spectral mass and the set of largest characters.
      distinct_preimage_search: >-
        Find predicates with the same spectral mass but different join success,
        and predicates with different spectra but identical bucket partitions,
        to test sufficiency of the observable.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Spectrum conditioned on quotient rank, density, and stabilizer orbit.
        predicted_gain: Removes linear and counting effects already captured by prior ideas.
      - transform: boundary_lift
        proposed_object: Complete spectral separator with an explicit false-negative bound.
        predicted_gain: Converts a descriptive coefficient signal into a decoder interface.
    quantifier_order: >-
      Fix the basis, maximum degree, null ensemble, coefficient threshold,
      bucket construction, and cost regime before inspecting the source
      spectrum. Do not rotate bases until a sparse spectrum appears.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy source-gated bound on conditioned spectral mass and the charged
        work of one specified spectral join.
      nearby_object_control: >-
        A phase-randomized predicate with identical coefficient magnitudes but
        no source-aligned characters; the join advantage must disappear.
    proof_obligations:
      - claim: Reproduce the charged ISD baseline, density, and quotient-rank controls.
        responsibility: baseline
      - claim: Prove the transform basis and predicate are attacker-computable.
        responsibility: interface
      - claim: Bound all searched-character and searched-basis multiplicity.
        responsibility: success_probability
      - claim: Prove separator completeness and join correctness.
        responsibility: correctness
      - claim: Charge spectrum discovery, tables, false negatives, data, and verification.
        responsibility: runtime
      - claim: Require scaling before any exponent statement.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      Target tau_plain minus epsilon only if useful spectral support, discovery,
      joining, retries, and verification jointly have exponent below tau_plain;
      current established delta is zero.
    memory_exponent: At most the matched baseline cap; coefficient and bucket tables are fully charged.
    best_known: >-
      The fully charged, reoptimized plain-random-SD frontier reproduced by
      IDEA-20260813-27df0c from IDEA-20260805-43d6df.
    hidden_overhead: >-
      Basis search, coefficient computation, spectrum storage, bucket skew,
      false-negative amplification, data, and candidate verification are explicit.
    tradeoff_note: >-
      Truncating the spectrum reduces memory but may increase false negatives;
      storing more coefficients lowers online filtering only if preprocessing
      amortizes over the declared targets.
  sota_delta:
    claim: No current improvement; promotion requires a matched net gain and a scaling separator.
    current_net_work_delta_bits: 0.0
    current_time_exponent_delta: 0.0
    current_memory_exponent_delta: 0.0
    minimum_concrete_net_gain_bits: 1.0
    asymptotic_gate: 'charged max(spectrum discovery, join, verification) exponent < tau_plain'
    pareto_rows:
      time: Spectrum discovery, partial enumeration, joins, retries, and memory access are charged.
      memory: Coefficients, partial-error tables, and buckets count at peak occupancy.
      data: Every transcript or opened-view predicate evaluation is charged.
      preprocessing: Basis construction and spectral tables are separated into global and per-key work.
      oracle: No hidden-view, error-support, or decoding oracle is allowed.
      verification: Every joined candidate and spectral certificate is independently checked.
    frontier_check: >-
      All six rows are compared with the 27df0c frontier. A reduced bucket count
      that requires super-baseline coefficient storage or unavailable data is dominated.
