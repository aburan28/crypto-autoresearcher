idea:
  id: IDEA-20261018-f2cd4d
  question_id: RQ-KIC-7502b9
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Is the tau-Horner m! the symmetry-breaking m! in disguise? Cost per distinct
    relation of plain, symmetry-broken and Horner chains at matched core size
  class: control
  claim: >-
    In the exhaustive-core regime (conflicts per refutation c 2^(ml), expected
    solutions per target lam < 1) the cost per distinct relation is the same for
    (i) the plain chain with lex symmetry breaking (SB) and (ii) the tau-Horner
    chain of IDEA-20260926-197ecf. Plain+SB searches 2^(ml)/m! and has
    B^m/(m! r) unordered solutions; Horner searches 2^(ml) and has B^m/r ordered
    ones; both cost c 2^(ml) r/B^m per relation, an m! saving over plain. So the
    m! yield is the m! that WDSat symmetry breaking (KN-LIT-92b022) already
    removes, and the two do not compose: the Horner chain has no symmetric
    solutions left to break. Exact MITM analogue: table size times probes per
    relation is r for unordered tables C(B,h) and ordered tables B^h alike. Test
    cells (n,m,l) = (17,2,8), (19,2,9), (17,3,6), (19,3,6): conflicts per
    distinct relation Horner over (plain+SB) in [0.8, 1.25].
  mechanism: >-
    OBJECT FRAME. Pair (R1 chained S_3 over a subspace base, node blocks rotated
    for Horner; Sigma = permutations of the m summand slots for the plain chain,
    the Horner step u -> tau(u) + P for the other). Class I partial-action.
    Lossy test against Sigma: plain ordered tuple -> multiset is m!-to-one and
    Sigma-compatible (the sum is invariant), genuinely lossy; Horner tuple ->
    relation vector is injective (H2), a change of coordinates. Symmetry
    breaking performs on the plain side the quotient that Horner performs by
    construction. Priced number: conflicts (or probes) per distinct verified
    relation. KN-OPEN-020: scoped-out subspace base. Stage: relation
    decomposition. Nearest hypothesis H-FROB-855915 (RQ-FROB-7d8dd4) has no
    symmetry-broken arm.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260926-197ecf
      provenance: internal
      claim: Horner chain gives m! more distinct relations and is said to compose with WDSat symmetry breaking.
      verified_by: idea-generator, record read in full
    - ref: H-FROB-855915
      provenance: internal
      claim: Approved test of yield ratio P1 and closure-work ratio P2, plain versus Horner, no symmetry-broken arm.
      verified_by: idea-generator, statement and mechanism read
  assumptions:
    - Lex symmetry breaking is an exact comparator on core coordinates, checked by model counts.
  predictions:
    - metric: conflicts per distinct relation, Horner over plain+SB
      direction: different
      minimum_effect: "0.8 to 1.25; below 0.67 is a real Horner gain"
    - metric: conflicts per target, plain+SB over plain
      direction: lower
      minimum_effect: "about 1/m!; at least 0.5/m! if SB is effective"
    - metric: MITM table size times probes per relation, ordered over unordered
      direction: flat
      minimum_effect: "ratio 1.0 within 10 percent"
  minimal_test:
    design: >-
      Per cell, 200 targets from a recorded seed. Exact enumeration gives the
      distinct relations of plain (unordered) and Horner (ordered). Three arms on
      one CNF generator: plain, plain+lex SB, Horner. Solvers CaDiCaL and WDSat
      default; record conflicts per target, models verified by group replay.
      Metric: pooled conflicts over pooled distinct relations. MITM arm: table
      sizes and probe counts from the enumeration.
    controls: [SB model count against the binomial count, Z/NZ relabelled group with scalar of order n, ordinary-curve doubling chain]
  falsification_conditions:
    - "Horner cost per relation at most 0.67 of plain+SB at two cells: genuine structural gain, the IDEA-20260926-197ecf budget claim stands."
    - "SB reduces conflicts by less than 0.5 of 1/m!: the residual m!/(SB factor) gain is real and is reported."
    - "SB model count differs from the binomial count or any model fails group replay: arm invalid."
  confounders: [solver heuristics are not rotation invariant, lam near 1 at the cells so first-solution effects matter, comparator clauses are charged in conflicts]
  interpretation_limits: [toy cells n <= 19, conflicts are search work not a bound, qualifies a budget column not an exponent, cross-RQ with RQ-FROB-7d8dd4]
  heuristic_assumptions:
    - id: H1
      statement: Conflicts per refutation are c 2^(ml) with the same c in the three arms (exhaustive-core law).
      rigorous_support: >-
        Proposition 1 of KN-LIT-102cdb as relayed (assigning the ml core bits
        fixes the system).
      validation_plan: >-
        Conflicts against 2^(ml) at four cells and three arms; c within 25 percent
        across arms; both tails. No transfer to n = 131.
    - id: H2
      statement: The Horner map is injective on tuples up to the birthday term B^m/r.
      rigorous_support: A collision is a vanishing weighted relation among 2m base points (IDEA-20261018-d4cef4 floor).
      validation_plan: Exact enumeration of ordered solutions against distinct relation vectors.
  target_complexity:
    time_exponent: None moves. Qualifies the 2 to 2.5 bit budget gain of IDEA-20260926-197ecf as relative to an unbroken plain baseline, zero against a symmetry-broken one.
    memory_exponent: unchanged
    best_known: WDSat with symmetry breaking, m! saving per decomposition (KN-LIT-92b022); matched rho 2^60.8 on ECC2K-130
    hidden_overhead: comparator CNF and rotation setup, charged in conflicts
    tradeoff_note: table size times time per relation is invariant in the MITM analogue
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-IC-b0fcda, KR-IC-73db3f, KR-IC-5765d2, KR-IC-f5c584, KR-IC-1fcdbc, KR-IC-889857, KR-RHO-482ed3, KR-RHO-13bf67, KR-IC-955fd6, KR-IC-791cb7, KR-RHO-cd0049, KR-RHO-1c2928, KR-RHO-755e35, KR-IC-f3da82, KR-IC-e847d1]
    nearest:
      - ref: KR-IC-5765d2
        provenance: internal
        relation: adjacent
        delta: WDSat symmetry breaking gives m!; here it is the baseline Horner must beat.
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: adjacent
        delta: GGMP use Frobenius for symmetry breaking on Koblitz curves; the cost-per-relation identity is added.
      - ref: KR-IC-955fd6
        provenance: internal
