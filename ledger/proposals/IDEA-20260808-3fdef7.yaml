idea:
  id: IDEA-20260808-3fdef7
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FIND-001
  goal_id: GOAL-FIND-001
  title: 'Five of the fifty-seven durable barriers are INVISIBLE in the dedup corpus that
    every ideation session screens against: KNOWLEDGE_BARRIERS.txt renders KN-FIND-006, -720727,
    -860118, -a8990a with empty titles and KN-TECH-057 as the literal string ">-", because
    the extractor reads the line after "title:" rather than the YAML block scalar - the source
    records are intact, the BARRIER FUNCTION is not, and a barrier nobody can read is re-tread
    for free'
  class: tooling
  claim: '(A) THE OBSERVATION, VERIFIED IN THIS SESSION. The bulk-ideation dedup corpus file
    /tmp/ideas-ctx/KNOWLEDGE_BARRIERS.txt lists 57 KN-FIND entries. Five entries carry no
    readable content: KN-FIND-006, KN-FIND-720727, KN-FIND-860118, KN-FIND-a8990a are rendered
    with an empty title, and KN-TECH-057 is rendered as the literal two-character YAML block-scalar
    indicator ">-". Reading the source record knowledge/findings/KN-FIND-006.md shows the
    title is present and substantive ("The Semaev/Weil-descent Macaulay rank deficit is bounded
    structural syzygy content equal to 8*dim(V); the generic degree-4 baseline is exactly
    the classical trivial syzygies and the excess is a vanishing fraction"). So the source
    records are INTACT and the defect is in extraction: the extractor takes the text following
    "title:" on the same line, which for a YAML folded block scalar is ">-" and for some records
    is empty. (B) WHY THIS IS A RESEARCH DEFECT AND NOT A FORMATTING NUISANCE. The generator
    brief instructs every ideation session to "screen EVERY idea against these" files and
    states that "KN-FIND entries are settled results" that "close whole families of ideas".
    A barrier whose statement is not visible cannot perform that function. In the current
    bulk round, multiple slices screened against this same file. The failure mode is silent
    and asymmetric: it never produces a false rejection, only a false ACCEPTANCE of an idea
    the corpus already closed, and the resulting duplicate then consumes review and compute
    budget before anyone notices. (C) THE SPECIFIC EXPOSURE FOR THIS SLICE. KN-FIND-006''s
    actual content is about Semaev/Weil-descent Macaulay rank deficits and syzygy structure
    - directly adjacent to the equivariant-linear-algebra lane (RQ-EQLA-0d3f40) that this
    slice was asked to work in. An idea generator screening only the extracted list would
    have no way to know that. (D) WHAT IS PROPOSED. A barrier-integrity check with a binary,
    independently checkable criterion: for each KN-FIND and KN-TECH record, can an independent
    reader state the record''s claim and its claim boundary from the extracted dedup line
    alone? Records failing the check are re-extracted (reading the YAML front matter properly,
    including block scalars) and, where the SOURCE record is also deficient, superseded by
    a new record - never edited, per AGENTS.md rule 4. (E) PAUSE FLAG, STATED PLAINLY. GOAL-FIND-001
    is status: paused, and its own next_action says the promotion criterion appears met on
    the ledger and that no further FIND batch is required for the documentation gap. This
    record is therefore an IDEA against a paused goal, filed because it was requested and
    because the defect is live in the current round; it is not a request to resume the goal,
    and only the Coordinator may change any goal status.'
  mechanism: 'The dedup corpus is a derived artifact. Derived artifacts silently degrade when
    their extraction logic does not match the source format, and the degradation is invisible
    from the consumer side because the consumer sees a well-formed list with a few short entries.
    The corrective is the same one the program applies to measurements: a two-directional
    control - the extractor must reproduce known-good titles AND must fail loudly on records
    it cannot parse, rather than emitting an empty string.'
  why_not_a_renamed_known_approach: 'Nearest known: ordinary lint or schema validation, which
    tools/validate_ledger.py already performs on the ledger. That validates the SOURCE records,
    which are fine here. This check validates the DERIVED dedup corpus against the source,
    which is a different artifact with a different consumer, and the corpus''s failure is
    invisible to source-side validation by construction. Nearest corpus record: IDEA-20260807-e051e7
    enumerates the 28 KN-OPEN entries for coverage; that is an inventory of what exists, not
    a check that what exists is readable where it is consumed.'
  predictions:
  - observable: extraction failures across the whole corpus
    metric: count of KN-FIND / KN-TECH / KN-OPEN records whose extracted dedup line is empty,
      is a YAML indicator, or is a strict prefix of the source title
    predicted: at least the 5 already identified; the record predicts the true count is higher
      than 5 because truncation (entries ending mid-word, visible in many rows of the same
      file) is a second, separate defect of the same extractor and is not counted above
  - observable: whether truncation loses claim boundaries
    metric: for the truncated entries, whether the truncated text omits the scope qualifier
      (for example "at toy scale", "for prime fields", "constant factor")
    predicted: truncation removes a scope qualifier in a substantial fraction, which is the
      more dangerous defect because a scope-stripped barrier reads as STRONGER than it is
      and causes false rejection of legitimate ideas - the opposite error to (B) and equally
      bad
  - observable: downstream duplication
    metric: number of proposals in the current bulk round whose subject matter falls within
      one of the five invisible barriers
    predicted: greater than zero; this is checkable after the round and is the direct measure
      of the defect's cost
  minimal_test: 'Re-extract all KN-FIND/KN-TECH/KN-OPEN titles from the source records with
    a YAML parser rather than a line rule; diff against the current KNOWLEDGE_BARRIERS.txt;
    report the counts of empty, indicator-only, truncated, and scope-stripped entries. Then,
    for the five identified records, read the source and check by hand whether any proposal
    filed in this round falls inside them. Cost: under an hour, no compute.'
  controls:
  - 'POSITIVE CONTROL: the re-extraction must reproduce, byte-for-byte, the titles of records
    that currently render correctly. If it changes those, the new extractor is wrong.'
  - 'NEGATIVE CONTROL: inject a synthetic record with a block-scalar title into a scratch
    copy and confirm the OLD extractor blanks it and the NEW one does not. This demonstrates
    the mechanism rather than inferring it.'
  - Independent re-derivation of the failing set by a second person or session before any
    repair is committed.
  confounders:
  - Some records may legitimately have no title (a genuinely empty source field), which is
    a source defect rather than an extraction defect. The two must be separated in the report,
    because their repairs differ (re-extract versus supersede).
  - The dedup corpus files under /tmp/ideas-ctx/ are session scaffolding, not repository artifacts;
    a repair must be made in whatever generator produces them, and this record must not be
    read as claiming a defect in knowledge/findings/ itself. It explicitly claims the opposite.
  falsification_conditions:
  - 'A YAML-based re-extraction producing the same empty entries: then the source records
    really are missing titles and (A)''s diagnosis is wrong.'
  - 'No proposal in the current round falling within any of the five invisible barriers: the
    defect is real but had zero measured cost this round, which should be recorded as such
    and lowers the priority.'
  interpretation_limits: 'This is infrastructure, not mathematics. It moves no exponent, closes
    no family, and produces no evidence about ECDLP. Under AGENTS.md rule 5 an infrastructure
    failure is not evidence against any mathematical hypothesis, and the converse holds too:
    fixing it establishes nothing mathematical.'
  assumptions:
