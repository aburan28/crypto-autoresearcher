idea:
  id: IDEA-20260829-57b1eb
  question_id: RQ-SBRG-f31cb2
  added: '2026-08-29'
  title: >-
    THE ONLY REUSABLE DEPENDENCY THAT COULD MOVE AN EXPONENT IS ONE SMALLER THAN
    THE SET IT DESCRIBES: measure the degree-<=d part of the Boolean vanishing
    ideal of W, the set of descended x-coordinates reachable as chain partial
    sums of factor-base points, against a size-matched random subset of the
    rational-x locus whose excess dimension is provably 0 -- a nonzero excess is a
    target-independent one-sided membership FILTER costing n^d bits instead of the
    |W| = Theta(B^{t-1}) words that IDEA-20260829-66a876 proves every explicit
    representation needs, and a zero excess closes the compressed-representation
    class with a measured obstruction rather than a fatigue report

  class: mechanism

  claim: >-
    (A) THE OBJECT. Fix an ordinary curve E over F_{2^n}, a factor base of B
    points whose x-coordinates lie in a chosen F_2-subspace, and the chained
    representation of EXP-SBRG-60c55e. Let W be the image in F_2^n, under the
    fixed field basis, of the auxiliary chain-node x-coordinates
    x(eps_1 P_1 + ... + eps_{t-1} P_{t-1}) as the P_i range over the factor base
    and the signs over {+,-}. W is exactly the projection of the
    target-independent solution set, and by KN-FIND-a8990a Theorem C it is an
    EXACT enumeration -- the fibre over a good factor-base tuple is precisely the
    signed-sum set, verified on 16107 of 16107 good samples. Define
    L_d(W) = { g in F_2[z_1,...,z_n]/(z_i^2 - z_i) : deg g <= d, g vanishes on W }
    and s_d = dim L_d(W), and let M_d = sum_{i<=d} binom(n, i).
    (B) THE EXACT NULL, WHICH IS WHAT MAKES THIS MEASURABLE. For a UNIFORMLY
    RANDOM subset W' of the same cardinality, the M_d by |W'| evaluation matrix
    has full rank with overwhelming probability, so
    dim L_d(W') = max(0, M_d - |W'|) EXACTLY. Define
    excess_d = s_d - max(0, M_d - |W|). For a generic set excess_d = 0. THE NULL
    IS AN INTEGER AND IT IS ZERO, which is the strongest kind of control this
    program can have: no matched-control battery is needed to establish the
    baseline, only to establish that the instrument can see a deviation.
    (C) THE TWO EXPLANATIONS THIS DISCRIMINATES, STATED BEFORE THE MEASUREMENT.
    E1, INHERITED LOW DEGREE. The descended summation polynomial has low Boolean
    degree -- that is the whole content of the first-fall literature this program
    records in KN-OPEN-002 -- and W is the image of a low-degree map from a
    domain of only (t-1)*b Boolean coordinates into F_2^n with (t-1)*b < n.
    Images of low-degree maps from low-dimensional domains satisfy low-degree
    relations. E1 predicts excess_d > 0 at d as small as the descended Boolean
    degree of S_3, and predicts excess_d to GROW with n at fixed d.
    E2, DEGREE PSEUDORANDOMNESS. The x-map is a quotient by inversion and the
    group law is not compatible with the F_2-linear structure the descent
    imposes, so W behaves like a random subset of the rational-x locus with
    respect to low-degree algebraic conditions. E2 predicts excess_d = 0 exactly,
    at every d below the trivial threshold, at every n.
    (D) WHAT EACH OUTCOME IS WORTH, IN THE FULLY CHARGED MODEL. A nonzero
    excess_d gives s_d target-independent polynomials, computed ONCE, that
    certify NON-membership in W in n^d bit operations with M_d bits of storage.
    Its value is the FILTER POWER p = n - log2 |Z(L_d(W))|, where Z is the common
    zero set; the online per-trial charge of IDEA-20260829-66a876's scheme drops
    from Theta(B^{t-k}) to Theta(B^{t-k} * 2^{-p} + n^d), so a filter power
    growing linearly in n moves an exponent and a bounded filter power moves a
    constant. Both are reported; neither is assumed. A zero excess at every
    feasible (n, d) closes the compressed-representation class with a NAMED
    OBSTRUCTION (the reachable set is degree-pseudorandom at the tested scale),
    an ARGUMENT (the exact null of part (B)), and FORWARD GUIDANCE (the surviving
    classes are non-polynomial sketches, Frobenius-orbit structure, and objects
    not yet enumerated -- and this program has no written object enumeration for
    the ECDLP, which is KN-OPEN-019).
    (E) THE HONEST OVERHEAD, STATED IN THE CLAIM AND NOT IN A FOOTNOTE. COMPUTING
    L_d(W) REQUIRES ENUMERATING W, AT COST Theta(B^{t-1}) -- exactly the table
    cost this record is trying to avoid. So a positive measurement is a STRUCTURE
    PROBE and NOT AN ALGORITHM. A usable filter requires the vanishing
    polynomials to be DERIVED IN CLOSED FORM from the summation-polynomial
    recursion rather than computed from an enumeration, and that derivation is a
    separate obligation this record does not discharge. A negative measurement,
    by contrast, is immediately conclusive for the whole class and costs the
    same.

  mechanism: >-
    THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY
    EXPERIMENT. The tracked object is L_d(W) -- the low-degree part of the
    vanishing ideal of the reachable set -- and it is genuinely lossy. Its common
    zero set STRICTLY CONTAINS W whenever d is below the interpolation threshold,
    so W is not recoverable from it; it discards which tuple produced each
    element of W, the fibre multiplicities, the factor base, the curve
    coefficients and the field basis. Contrast the full vanishing ideal I(W),
    which loses NOTHING and is a change of coordinates on the table -- exactly the
    object IDEA-20260829-66a876 proves costs Theta(B^{t-1}), and exactly the
    projection this record refuses to use.
    IT IS LOSSY COMPATIBLY WITH THE OPERATIONS OF THE TARGET, WHICH IS THE
    LOAD-BEARING HALF. The final chain equation consults the structural part only
    through a membership question -- does the descended x-coordinate of the
    residual target lie in W -- and a vanishing polynomial answers a sound
    one-sided version of exactly that question: g(u) nonzero implies u not in W,
    with no false negatives ever. So what is retained propagates deterministically
    under precisely the operation the algorithm performs, and what is discarded
    (the fibres) is never consulted by it. That is the compatibility the inventor
    protocol section 2 demands, and it is why this is a new object rather than a
    re-encoding.
    WHY THE NULL IS EXACT AND NOT ESTIMATED. The evaluation map sending a
    Boolean polynomial of degree at most d to its value vector on a point set is
    LINEAR, so dim L_d(W) = M_d - rank(Ev_d(W)) is an integer identity, not a
    statistic. For a uniformly random point set of size at least M_d the matrix
    Ev_d has full column rank with probability 1 - O(2^{-(|W| - M_d)}), which at
    the proposed parameters (|W| at least ten times M_d) is astronomically close
    to 1. So excess_d = 0 is a prediction that can be stated to arbitrary
    precision without running a control battery, and the control battery exists
    only to demonstrate that the instrument has power.
    WHY THE OBSTRUCTION IS THE RIGHT ONE TO ATTACK. IDEA-20260829-66a876 proves
    that every EXPLICIT representation of the target-independent structure costs
    Omega(B^{t-1}) words, and IDEA-20260829-fa8235 proves that Macaulay row-space
    reuse is capped at a factor t-1. Between them the two records leave exactly
    one live class -- an object smaller than the set it describes. L_d(W) is the
    cheapest member of that class to test: it has an exact null, an exact
    dimension, a cost model, and a memory footprint of M_d squared bits.
    WHERE THE ARGUMENT STOPS, STATED HERE AND NOT HIDDEN. It stops at d for which
    M_d exceeds |W|, where a nonzero L_d exists for counting reasons alone and
    means nothing -- which is why excess_d subtracts max(0, M_d - |W|) and why
    cells are chosen with |W| at least 10 * M_d. It stops at representations
    other than Boolean polynomial degree: a set can be degree-pseudorandom and
    still be compressible by a different sketch, so a zero excess closes the
    LOW-DEGREE class and not the compression class in general. And it says
    nothing about prime fields, where there is no Boolean ring and the analogous
    object would have to be redefined.

  novelty_status: unverified

  citations:
    - ref: KN-FIND-a8990a
      provenance: internal
      claim: >-
        Theorem C -- if every coordinate is the x-coordinate of an F_q-rational
        point and the tuple is good, S_m splits completely over F_q at every m,
        with root set exactly the signed sums; verified on 16107 of 16107 good
        samples. This is what makes W an EXACT enumeration of the reachable
        chain-node coordinates rather than a subset. The record also states its
        own census obstruction -- any factorization-type statistic is identically
        constant on the factor-base locus -- and warns that complete splitting
        "gives that search no leverage whatsoever", which is why this record
        tracks a vanishing ideal and not a Frobenius statistic.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-a8990a.md, all 248 lines, including the
        verification table and the "Open, and honestly open" section recording
        that it has NO independent review and that novelty is NOT adjudicated.
    - ref: EXP-SBRG-60c55e
      provenance: internal
      claim: >-
        Defines the chained representations, the Boolean ring
        F_2[z_1,...,z_N]/(z_i^2 - z_i), the Weil-descent construction over
        F_{2^n} with n in {8,10,12,14,16}, t in {3,4}, both power and normal field
        bases, both prefix and random factor-base orientations, and the
        target-independent split I_R = <S_struct, P_R>. Its claim ceiling states
        that no result may be described as a faster ECDLP algorithm or a lower
        asymptotic exponent, which this record respects.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        experiments/EXP-SBRG-60c55e/specification.yaml, all 278 lines.
    - ref: IDEA-20260829-66a876
      provenance: internal
      claim: >-
        Derives that the target-independent part of a chained system cuts out a
        finite scheme of degree Theta(B^{t-1}), that every explicit representation
        therefore costs Omega(B^{t-1}) words, and that the resulting table family
        sits at (N^{k/(2k-1)}, N^{k/(2k-1)}) and is dominated by Pollard rho on
        both axes at every k -- with the surviving class named as implicit or
        compressed representations. This record is the cheapest probe of that
        surviving class and inherits its accounting.
      verified_by: >-
        Authored in this same session and unreviewed. Full text is the companion
        file ledger/proposals/IDEA-20260829-66a876.yaml.
    - ref: IDEA-20260829-fa8235
      provenance: internal
      claim: >-
        Derives that batch reuse of a target-independent Macaulay row space is
        capped at 1/rho_D = t-1 and that the fully charged composition through the
        two-term optimum is at most (t-1)^{2/(m+1)}, i.e. about 1.6x. Together
        with IDEA-20260829-66a876 this is what leaves compressed representation
        as the only live class.
      verified_by: >-
        Authored in this same session and unreviewed. Full text is the companion
        file ledger/proposals/IDEA-20260829-fa8235.yaml.
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        Records that the low-degree-of-regularity heuristic and the first-fall
