      verified_by: null

  assumptions:
    - >-
      The field basis is fixed before any cell runs and reported. W as a SUBSET
      of F_{2^n} is basis-free, but L_d(W) is NOT -- degree is a basis-dependent
      notion under Weil descent -- so both power and normal bases are measured
      and any basis-dependence is itself a reportable result rather than a
      nuisance.
    - >-
      Cells are chosen with |W| at least 10 * M_d, so that a nonzero L_d cannot
      arise for counting reasons. Cells violating this are excluded BEFORE the
      run, not explained after.
    - >-
      The factor-base x-coordinates lie in an F_2-subspace of dimension b, which
      is the construction EXP-SBRG-60c55e uses and which is the source of the
      dimension gap (t-1)*b < n that makes explanation E1 plausible at all. A
      factor base with no linear structure removes that gap and is measured as a
      separate arm.
    - >-
      W is computed by direct group arithmetic from the factor base, with NO
      summation polynomial used anywhere on that path. That independence is the
      whole value of the measurement and is enforced rather than assumed.
    - >-
      Nothing in this record is an algorithm. Part (E) states the enumeration
      cost that makes a positive result a probe rather than an attack, and no
      downstream summary may omit it.

  proof_search_map:
    bottleneck: >-
      The SIZE of the reusable object. IDEA-20260829-66a876 fixes the price of
      every explicit representation at Omega(B^{t-1}) words; the exact step whose
      removal would change the conclusion is "store or enumerate the reachable
      set". A low-degree filter removes it by answering the only question that is
      ever asked of the set without holding the set.
    baseline_embedding:
      parameter_slice: >-
        d at the interpolation threshold, where M_d exceeds |W|. There the
        formula must return s_d = M_d - |W| exactly and excess_d = 0, reproducing
        the trivial count. Second slice: t = 2, where W is just the set of
        factor-base x-coordinates, which by construction lies in an F_2-subspace
        and therefore satisfies n - b INDEPENDENT LINEAR relations. The
        instrument must report excess_1 = n - b exactly on that slice. This is a
        planted positive with a known integer answer and it is the reproduction
        check.
      reproduction_check: >-
        Exact integer equality on both slices, hand-derivable and hand-checkable.
        If the t = 2 planted slice does not return excess_1 = n - b, the
        instrument is not computing the vanishing dimension and the line halts
        before any real cell runs.
    observation_collision:
      observable: >-
        The single integer excess_d.
      distinct_preimage_search: >-
        REQUIRED. Two structurally different situations give excess_d > 0 --
        (i) genuine inherited low degree from the summation recursion, and
        (ii) an accidental linear or affine constraint imported by the FIELD
        BASIS or by the factor-base subspace, which is a coordinate artifact and
        not a property of the curve. They are separated by re-running at a
        different field basis and a different subspace and requiring the excess
        to PERSIST -- which is exactly the basis/orientation invariance
        EXP-SBRG-60c55e already demands of its own signals. A third preimage,
        the RATIONALITY CONDITION (W lies inside the set of x-coordinates
        admitting a rational point, a set of density about 1/2), is a KNOWN
        target-independent dependency and is measured separately as its own arm
        so it can be subtracted rather than mistaken for a discovery.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the reachable SET by the low-degree part of its vanishing
          ideal -- an object of size M_d bits describing a set of size
          Theta(B^{t-1}). Obligations kept separate: encoding (the evaluation map
          is linear so the dimension is exact), completeness (a vanishing
          polynomial never rejects a true member, so the filter is sound with no
          false negatives), soundness (its zero set may strictly contain W, so
          false positives are the only error and their rate is the measured
          filter power), size (M_d bits), transfer (basis-dependent, stated),
          cost loss (computing it costs an enumeration, disclosed in claim (E)).
        predicted_gain: >-
          If the excess is nonzero with filter power p, the online per-trial
          charge falls by 2^p at a storage cost of M_d bits instead of
          Theta(B^{t-1}) words. If p grows linearly in n this moves an exponent;
          if p is bounded it moves a constant. NEITHER IS ASSUMED and the
          predicted value is 0.
      - transform: observable_fiber
        proposed_object: >-
          Hold excess_d = 0 fixed and vary the forgotten structure -- curve,
          basis, subspace, t -- to check that the zero is uniform rather than an
          accident of one cell. A uniform zero over the whole grid is the
          measured obstruction; a zero that breaks somewhere localises where the
          structure lives.
        predicted_gain: >-
          A closure that names where it stops, which is the inventor protocol
          section 4 standard, instead of a count of failed cells.
    quantifier_order: >-
      CLAIMED, and stated in the direction the measurement can actually settle.
      FORALL n in the tested range, FORALL ordinary E over F_{2^n} in the tested
      sample, FORALL factor-base subspaces of the tested dimensions, FORALL field
      bases in {power, normal}, FORALL d with M_d <= |W|/10, EXISTS no nonzero
      Boolean polynomial of degree at most d vanishing on W beyond the trivial
      count -- i.e. excess_d = 0. This is the E2 prediction and it is what a
      negative result establishes over the tested cells and nothing more.
      NOT CLAIMED: FORALL n, i.e. any asymptotic statement. Four or five values of
      n cannot establish a growth law, and the record's negative is explicitly a
      scoped negative closing the tested cells, per RQ-SBRG-f31cb2's own decision
      target.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the tested curves, subspaces, bases and degrees, the reachable
        chain-node set carries no low-degree Boolean vanishing relations beyond
        the trivial count, so no degree-<=d filter of size M_d bits exists for
        it." It can NEVER certify that no compressed representation exists -- only
        that no LOW-DEGREE POLYNOMIAL one does -- and can never certify anything
        about prime fields, about untested n, or about the ECDLP.
      nearby_object_control: >-
        THE PLANTED-STRUCTURE POSITIVE CONTROL, and it is blocking. Replace W by
        a set that PROVABLY has low-degree relations -- the factor-base subspace
        itself, which satisfies exactly n - b independent linear relations, and a
        random affine-image set of matched size and known relation count. The
        instrument MUST recover those integers exactly. An instrument that cannot
        detect known structure has no power and its zero on the real object means
        nothing. Second nearby object: the RATIONALITY LOCUS, the set of x in
        F_{2^n} admitting a rational point, whose own low-degree vanishing
        dimension is measured and reported so that any excess found on W can be
        checked against it rather than double-counted.
    proof_obligations:
      - claim: >-
          dim L_d(W) = M_d - rank(Ev_d(W)) as an integer identity.
        responsibility: correctness
      - claim: >-
          For a uniformly random set of size at least M_d, excess_d = 0 with
          probability 1 - O(2^{-(|W| - M_d)}).
        responsibility: baseline
      - claim: >-
          The t = 2 planted slice returns excess_1 = n - b exactly.
        responsibility: baseline
      - claim: >-
          A vanishing polynomial gives a one-sided filter with no false
          negatives.
        responsibility: correctness
      - claim: >-
          Filter power p and the resulting online charge
          Theta(B^{t-k} 2^{-p} + n^d).
        responsibility: size
      - claim: >-
          Peak resident memory is bounded by M_d squared over 8 bytes plus the
          bitmap of W.
        responsibility: memory
      - claim: >-
          Any excess persists across field basis and subspace changes.
        responsibility: scope
      - claim: >-
          Computing L_d costs an enumeration of W, so a positive result is a
          probe and not an algorithm.
        responsibility: interface

  predictions:
    - metric: >-
        excess_d = dim L_d(W) - max(0, M_d - |W|), over the grid
        n in {16, 20, 24}, d in {2, 3, 4, 5}, t in {3, 4}, both field bases, at
        least 8 curves, at least 3 subspace seeds
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 0 in every cell (explanation E2). PRE-REGISTERED
        POSITIVE THRESHOLD: an excess of at least 1 that PERSISTS across both
        field bases, at least 3 subspace seeds and at least 3 increasing values
        of n is a confirmed target-independent low-degree dependency and
        constitutes explanation E1. An excess appearing in one basis only is
        recorded as a coordinate artifact, which is EXP-SBRG-60c55e's own
        invariance rule adopted verbatim.
    - metric: >-
        filter power p = n - log2 |Z(L_d(W))|, estimated by uniform sampling of
        F_2^n with at least 10^6 samples per cell, reported with a
        Clopper-Pearson interval
      direction: different
      minimum_effect: >-
        REPORTED ONLY WHEN excess_d >= 1, and then required to exceed 1.0 bit to
        be of any use, since a filter power below 1 bit cannot halve a candidate
        set. The IDEAL ceiling is n - log2 |W|, which at n = 24 with
        |W| = 2^19 is 5.0 bits; a measured p within 0.5 bits of that ceiling
        would mean the low-degree filter is a near-perfect membership oracle and
        is the single most consequential outcome available in this record.
    - metric: >-
        the t = 2 planted positive control, excess_1 for the factor-base subspace
        itself
      direction: different
      minimum_effect: >-
        FORCED EXACT n - b, in every cell, with zero tolerance. This is an
        integer the construction fixes in advance. A miss halts the line
        immediately and is an instrument defect, never a finding.
    - metric: >-
        excess_d for a uniformly random subset of the rational-x locus with the
        same cardinality as W
      direction: different
      minimum_effect: >-
        FORCED 0 in every cell. This is the null object and its value is
        predicted from linear algebra rather than measured; a nonzero value means
        the cells violate the |W| >= 10 * M_d screen or the rank routine is
        wrong, and either voids the battery.
    - metric: >-
        excess_d for the rationality locus itself, the set of x in F_{2^n}
        admitting a rational point
      direction: different
      minimum_effect: >-
        MEASURED AND REPORTED, with no prediction committed, because it is a
        KNOWN target-independent dependency whose Boolean degree this program has
        never measured. Whatever it is, it must be subtracted before any excess
        on W is attributed to the summation structure. Reporting an excess on W
        without this arm is prohibited by this record.
    - metric: >-
        peak resident memory per cell against the predicted M_d squared over 8
        bytes plus 2^n over 8 bytes
      direction: different
      minimum_effect: >-
        Formula must predict the measured peak within 25 percent across the whole
        grid, which spans a 600x range of M_d squared. PREDICTED MAXIMUM 384 MB
        at the largest admitted cell (n = 24, d = 5, M_5 = 55455). A cell
        exceeding 1 GiB means the streaming rank routine is materialising the
        evaluation matrix and must be fixed before the grid is extended.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, one page, HARD GATE). Write the linear-algebra
      identity dim L_d = M_d - rank(Ev_d) and the exact random null. Compute the
      feasibility table -- M_d for n in {16, 20, 24, 32} and d in {2, 3, 4, 5, 6},
      the carrier bytes M_d squared over 8, and the required |W| = 10 * M_d --
      and PRE-REGISTER the admitted cells. The arithmetic to be checked, and it
      is checkable by hand: M_3 = 697, M_4 = 2517, M_5 = 6885 at n = 16;
      M_3 = 1351, M_4 = 6196, M_5 = 21700 at n = 20; M_3 = 2325, M_4 = 12951,
      M_5 = 55455 at n = 24; and at n = 32, M_5 = 242825 giving a carrier of
      about 7.37 GB, which is EXCLUDED under an 8 GiB contract. Any arithmetic
      disagreement halts before any cell runs.
      STAGE 1 (minutes, PLANTED POSITIVE, BLOCKING). Run the instrument on the
      factor-base subspace itself and require excess_1 = n - b exactly, and on a
      random affine image with a known relation count. If either misses, stop.
      STAGE 2 (minutes, EXACT NULL, BLOCKING). Run on a uniformly random subset
      of the rational-x locus of matched cardinality and require excess_d = 0.
      STAGE 3 (minutes to an hour, the main grid). Build W by direct group
      arithmetic from the factor base -- signed sums of t-1 factor-base points,
      x-coordinates, deduplicated into a bitmap over F_2^n -- with NO summation
      polynomial anywhere on that path. For each admitted cell compute
      rank(Ev_d(W)) by STREAMING the |W| evaluation columns against an
      M_d by M_d echelon carrier, so the evaluation matrix is never
      materialised. Grid: n in {16, 20, 24}, d in {2, 3, 4, 5} subject to the
      Stage 0 screen, t in {3, 4}, 8 curves, 3 subspace seeds, both field bases.
      STAGE 4 (minutes). The rationality-locus arm, measured and reported
      separately so any excess on W can be checked against it.
      STAGE 5 (zero compute). If excess is zero everywhere, write the closure at
      the inventor protocol section 4 standard -- named obstruction, argument,
      forward guidance -- as a proposal for the Coordinator, never as a status
      change. If excess is nonzero and persistent, estimate the filter power,
      price it through IDEA-20260829-66a876's online charge, and state the
      remaining obligation: deriving the filter in closed form from the S_3
      recursion instead of from an enumeration.
      MEMORY DISCIPLINE, STATED BECAUSE THE PROGRAM HAS A LIVE MEMORY WALL. The
      largest object anywhere in this test is the M_d by M_d echelon carrier,
      which at the largest ADMITTED cell (n = 24, d = 5) is 55455 squared over 8,
      about 384 MB, plus a 2^24-bit bitmap of W at 2 MB. This test builds NO
      Macaulay matrix and NO Groebner basis, and its carrier is bounded by the
      MONOMIAL COUNT SQUARED rather than by rank times a monomial space, so it
      cannot reproduce the 2026-08-28 GOAL-DREG-001 n=15 D=6 stop -- 6 of 6 runs
      resource_exhaustion at about 12 GiB against an 8 GiB contract, 768,212
      columns, rank kernel never invoked. That stop was an INFRASTRUCTURE failure
      under AGENTS.md rule 3 and is never negative mathematical evidence about
      anything. Peak RSS here is predicted below 500 MB and is a required
      reported metric so the prediction can fail. On a 14-core, 48 GB host the
      grid runs comfortably inside one 8 GiB contract per cell.
    controls:
      - >-
        PLANTED POSITIVE (blocking): the factor-base subspace, excess_1 forced to
        n - b exactly. An instrument that cannot see known structure has no power
        and its zeros mean nothing.
      - >-
        EXACT RANDOM NULL (blocking): a uniformly random subset of the rational-x
        locus at matched cardinality, excess_d forced to 0.
      - >-
        RATIONALITY-LOCUS ARM (blocking before any attribution): the known
        target-independent dependency, measured so it can be subtracted rather
        than rediscovered.
      - >-
        BASIS AND SUBSPACE INVARIANCE (blocking for any positive): an excess must
        persist across power and normal bases and across at least 3 subspace
        seeds, or it is a coordinate artifact and is reported as one.
      - >-
        NO-SEMAEV INDEPENDENCE: W is built by group arithmetic only. If any code
        path touches a summation polynomial, the measurement is not independent
        of the object it is testing and the cell is void.
      - >-
        CARDINALITY SCREEN: |W| >= 10 * M_d enforced before the run, with the
        measured |W| reported per cell so the screen can be audited.
      - >-
        DEDUPLICATION AUDIT: |W| measured exactly against the predicted
        Theta(B^{t-1}) so that x-collisions and sign identifications are counted
        rather than assumed.
    required_metrics:
      - 'M_d, |W|, rank(Ev_d(W)), s_d and excess_d per cell'
      - 'excess_d on the planted positive and on the exact random null'
      - 'excess_d on the rationality locus, separately'
      - 'filter power p with a Clopper-Pearson interval, when excess >= 1'
      - 'per-cell field basis, subspace seed, curve coefficients and curve order'
      - 'measured |W| against the predicted cardinality, with the collision count'
      - 'peak RSS and wall time per cell against the M_d squared formula'
      - 'the pre-registered admitted-cell table, frozen before Stage 3'

  falsification_conditions:
    - >-
      The planted positive does not return excess_1 = n - b exactly. The
      instrument is broken; nothing is reported and no zero from it means
      anything.
    - >-
      The exact random null returns nonzero excess. Either the cardinality screen
      is violated or the rank routine is wrong; the battery is void.
    - >-
      excess_d >= 1 persists across both bases, three subspace seeds and three
      increasing n. Explanation E2 is FALSIFIED, a target-independent low-degree
      reusable dependency exists, and its filter power becomes the priority
      measurement. This is the outcome that would make RQ-SBRG-f31cb2 an exponent
      lane rather than a constant lane, and it is the reason the record is worth
      running.
    - >-
      excess_d >= 1 in one basis only. A coordinate artifact; recorded as such,
      and the basis-dependence is itself reportable because degree under Weil
      descent is basis-dependent and this program has never measured how much.
    - >-
      The rationality-locus arm shows a large low-degree vanishing dimension that
      accounts for any excess found on W. The excess is then a KNOWN dependency
      rediscovered, worth recording as an instrument calibration and nothing
      more.
    - >-
      Measured peak RSS exceeds the M_d squared formula by more than 25 percent.
      The rank routine is materialising the evaluation matrix; the grid is not
      extended until it is fixed.
    - >-
      excess_d = 0 everywhere on the admitted grid. The low-degree
      compressed-filter class is closed over the tested cells with a named
      obstruction, an exact argument and forward guidance -- and, combined with
      IDEA-20260829-fa8235 and IDEA-20260829-66a876, RQ-SBRG-f31cb2's decision
      target acquires a defensible answer on the attack axis with a total compute
      cost measured in core-hours.

  confounders:
    - >-
      BASIS DEPENDENCE OF DEGREE. Boolean degree is not a property of a subset of
      F_{2^n}; it is a property of the subset TOGETHER with the F_2-basis. Both
      bases are measured and any difference is reported rather than averaged.
      This is the single most likely source of a spurious positive.
    - >-
      THE SUBSPACE ITSELF. The factor base is chosen inside an F_2-subspace, so
      the factor-base coordinates satisfy linear relations by construction. Those
      relations are in the x_i variables and NOT in the auxiliary node variable
      that W lives in, but a bookkeeping error that mixes them would manufacture
      an excess of exactly n - b. The planted positive exists precisely so that
      number is recognisable when it appears in the wrong place.
    - >-
      THE RATIONALITY CONDITION. W lies inside the density-1/2 rational-x locus.
      If that locus itself has low-degree vanishing relations in the chosen
      basis, every subset of it inherits them, including a random one -- which is
      why the null is drawn from the LOCUS and not from F_2^n, and why the locus
      is measured separately.
    - >-
      CARDINALITY REGIME. Below |W| = M_d a nonzero L_d exists for counting
      reasons alone. The screen is enforced at a factor 10 rather than at 1 so
      the regime is not marginal, and the measured |W| is reported so the screen
      can be audited after the fact.
    - >-
      SMALL-n ARTIFACTS. At n = 16 with d = 5 the ratio |W|/M_5 is the tightest
      on the grid, and a signal that appears only there is a small-parameter
      artifact. Cells are reported individually and the largest-n cell is
      reported separately rather than pooled.
    - >-
      A POSITIVE IS NOT AN ALGORITHM. Computing L_d requires enumerating W at
      cost Theta(B^{t-1}). Any downstream reader tempted to read a positive as a
      speedup is reading past claim (E), which is stated in the claim precisely
      so it cannot be dropped in summary.

  interpretation_limits:
    - >-
      THIS IS A STRUCTURE PROBE, NOT AN ALGORITHM AND NOT AN ATTACK. No exponent
      is claimed in either direction, no ECDLP statement is made, and a positive
      result carries an explicitly named remaining obligation (closed-form
      derivation of the filters) before it could become an algorithm.
    - >-
      Scoped to ordinary binary curves, Weil descent, chained S_3 representations,
      subspace factor bases, Boolean polynomial degree, and n in {16, 20, 24}. It
      does not transfer to prime fields, to non-subspace factor bases, to other
      notions of compression, or to cryptographic scale.
    - >-
      A negative closes the LOW-DEGREE POLYNOMIAL compression class over the
      tested cells only. Premature closure is a failure mode symmetric with
      overclaiming (KN-TECH-056), so the closure is written with its named
      obstruction, its argument and its forward guidance, and never as "this
      target is exhausted".
    - >-
      The record depends on two companion proposals authored in the same session
      and unreviewed. If IDEA-20260829-66a876's degree bound Omega(B^{t-1}) is
      wrong, the motivation weakens although the measurement remains
      well-defined.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was grepped and the nearest records
      read in full; two WebSearches were run this session and returned titles and
      one-line summaries only. The first-fall papers listed in
      EXP-SBRG-60c55e's reference block and arXiv:1504.02347 are the most likely
      locations of prior art and none was opened. Honest status unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random subset W' of the rational-x locus of F_{2^n} with
        |W'| >= M_d, the evaluation matrix Ev_d(W') has full column rank M_d, so
        dim L_d(W') = 0, with failure probability at most 2^{-(|W'| - M_d + 1)};
        equivalently the reachable set behaves, with respect to low-degree
        Boolean conditions, like a uniformly random set of its cardinality.
      rigorous_support: >-
        The RIGOROUS half is exact and needs no assumption: dim L_d is the
        corank of a linear map, and for a set of points drawn uniformly at random
        the probability that a FIXED nonzero degree-<=d Boolean function vanishes
        on all of them is at most 2^{-|W'|} times the number of functions that
        could, giving the stated union bound; the standard Schwartz-Zippel
        statement over F_2 that a nonzero degree-d Boolean function is nonzero on
        at least a 2^{-d} fraction of points makes the bound explicit. The
        CLASSICAL DISTRIBUTION IMITATED is the uniform-random-set model for the
        image of an algebraic map -- the same imitation that underlies every
        "the descended system behaves like a random system" heuristic in the
        first-fall literature and the same one KN-FIND-007 records as making the
        Gaudry-Diem decomposition probability equal the conservation mean. THE
        GAP IS EXACTLY WHAT IS BEING MEASURED: W is the image of a low-degree map
        from a domain of (t-1)*b < n Boolean coordinates, and images of
        low-degree maps from low-dimensional domains are a classical source of
        low-degree relations. H1 is therefore the NULL HYPOTHESIS of the
        experiment, not a supporting assumption, and the experiment exists to try
        to break it.
      validation_plan: >-
        SAMPLE. For each admitted cell, 20 independent uniformly random subsets
        of the rational-x locus of cardinality exactly |W|, plus, at n = 16 and
        n = 20 where it is feasible, an EXHAUSTIVE enumeration of the rationality
        locus so the sampling universe is exact rather than approximated.
        COMPARISON DISTRIBUTION. The point prediction excess_d = 0 with the union
        bound above; the number of random draws showing any nonzero excess must
        be 0 out of 20 in every cell, and a single nonzero draw is investigated
        individually rather than averaged away. TAIL CHECKS. (a) The distribution
        of rank(Ev_d) over the 20 draws, which must be the constant M_d;
        (b) the tightest cell by |W|/M_d ratio, reported separately, since that
        is where the union bound is weakest; (c) the largest d admitted at each
        n, reported separately. SAMPLED PARAMETERS RECORDED. n, d, M_d, |W|,
        curve coefficients, curve order, trace, the exact size of the rationality
        locus, subspace dimension b, basis, seeds. TRANSFER ASSUMPTIONS. NONE.
        Nothing above n = 24 is measured and no growth law is fitted from three
        values of n; the negative is scoped to the tested cells exactly as
        RQ-SBRG-f31cb2's decision target requires.
    - id: H2
      statement: >-
        If s_d = dim L_d(W) is positive, the common zero set Z(L_d(W)) has size
        about 2^{n - s_d} -- i.e. the s_d vanishing conditions behave like
        independent constraints -- so the filter power is p = s_d bits up to the
        floor p <= n - log2 |W| imposed by the fact that Z contains W.
      rigorous_support: >-
        The RIGOROUS ingredients are two. Z(L_d(W)) contains W, so
        p <= n - log2|W| unconditionally -- the filter can never be more
        selective than the set it describes. And a single nonzero Boolean
        function of degree d has at least a 2^{-d} fraction of nonzeros, so one
        filter gives at least 2^{-d} of a bit of power in the worst case; the
        power is therefore bounded on both sides by quantities that need no
        assumption. The CLASSICAL STATEMENT IMITATED is the independence
        heuristic for the codimension of an intersection of hypersurfaces -- that
        s independent equations cut dimension by s -- which is exactly the
        semi-regularity imitation used throughout the degree-of-regularity
        literature. THE GAP is that the s_d polynomials are the low-degree part
        of one ideal and are highly non-generic if they exist at all, so the
        independence heuristic is the weakest link and p is therefore MEASURED by
        sampling rather than inferred from s_d.
      validation_plan: >-
        SAMPLE. Only in cells where excess_d >= 1. At least 10^6 uniform samples
        from F_2^n per cell, evaluating all s_d filters. COMPARISON. The measured
        rejection rate against the independence prediction 1 - 2^{-s_d}, with a
        Clopper-Pearson 95 percent interval; a measured rate materially below the
        prediction means the filters are dependent and p must be quoted at the
        MEASURED value, never at s_d. TAIL CHECKS. The measured rate against the
        ideal ceiling 1 - |W|/2^n, and the single most selective filter reported
        individually so a result driven by one polynomial is visible as such.
        TRANSFER. None; the filter power is a property of the tested cell and is
        not extrapolated to any other.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS MOUNTED AND NO EXPONENT IS CLAIMED. The conditional statement,
      stated so it can fail, is this. IF a degree-<=d filter with power p bits
      exists and can be DERIVED IN CLOSED FORM rather than enumerated, then the
      online per-trial charge of the k-fold-table scheme of IDEA-20260829-66a876
      falls from Theta(B^{t-k}) to Theta(B^{t-k} 2^{-p} + n^d), and the family's
      frontier moves from N^{k/(2k-1)} accordingly. A filter power p bounded by a
      constant moves a constant. A filter power growing linearly in n moves an
      exponent. THE PREDICTED VALUE OF p IS ZERO, because the predicted excess is
      zero, and no positive value is asserted anywhere in this record.
    memory_exponent: >-
      The reusable object is M_d = sum_{i<=d} binom(n,i) bits, i.e. n^{O(d)},
      against the Omega(B^{t-1}) words that IDEA-20260829-66a876 proves every
      explicit representation requires. THAT GAP IS THE ENTIRE POINT OF THE
      RECORD: at n = 24, d = 5 the filter is 55455 bits against a table of about
      2^19 words, a factor of about 75 in storage. Whether the gap is realisable
      is exactly what excess_d measures. The INSTRUMENT's own memory is
      M_d squared over 8 bytes, at most 384 MB on the admitted grid.
    best_known: >-
      For binary-field ECDLP the standing frontier is Pollard rho at
      0.886*sqrt(N) with O(1) memory, with the matching generic lower bound in
      KN-TECH-005; for extension-field point decomposition, Gaudry-style and
      Diem-style index calculus, recalled and not verified this session. For
      reusable target-independent structure specifically, the incumbents are this
      session's companion records -- IDEA-20260829-fa8235's ceiling of t-1 on
      row-space reuse and IDEA-20260829-66a876's frontier
      (N^{k/(2k-1)}, N^{k/(2k-1)}) for explicit representations -- and this record
      improves neither and claims neither.
    hidden_overhead: >-
      DISCLOSED IN FULL AND IN THE CLAIM ITSELF. (i) Computing L_d requires
      enumerating W at cost Theta(B^{t-1}), so a positive result is a structure
      probe and not an algorithm; a usable filter needs a closed-form derivation
      from the S_3 recursion that this record does not supply. (ii) Boolean
      degree is basis-dependent, so a positive result is a statement about a
      basis until it is shown invariant. (iii) The filter power p is bounded above
      by n - log2|W|, which at the tested parameters is only about 5 bits, so
      even a PERFECT low-degree filter at these cells saves a factor 32 and not
      an exponent -- the exponent question is whether p grows with n, and three
      values of n cannot settle it. (iv) The whole record is scoped to
      polynomial-degree compression and says nothing about other sketches.
    tradeoff_note: >-
      This is a storage-for-time trade in the reusable object: M_d bits buying a
      2^p reduction in the online charge, against a table's Theta(B^{t-1}) words
      buying a 2^{n - log2|W|} reduction. The table is the extreme point at
      maximum storage and maximum power; the filter, if it exists, is a point at
      minimum storage and measured power. Parallelisation: the rank computation
      streams |W| columns against a shared carrier and parallelises by chunking
      the column stream with a merge of partial echelon forms, with near-linear
      speedup on 14 cores; the filter-power sampling is embarrassingly parallel.
      None of this moves any exponent.

  dominated_by: >-
    CHECKED ROW BY ROW, ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK this
    record mounts none, so it is dominated by every frontier row -- Pollard rho
    (N^{1/2}, O(1)), multi-target rho, BSGS (N^{1/2}, N^{1/2}), van
    Oorschot-Wiener (sqrt(A^3/w), w), generic DLP with preprocessing at
    S*T^2 = O-tilde(N) per KN-TECH-005, algebra-free meet-in-the-middle index
    calculus, the two-term optimum of IDEA-20260829-b5a2c8, and the explicit-reuse
    frontier of IDEA-20260829-66a876. As a STRUCTURAL MEASUREMENT of the
    reachable set: no prior record in this corpus measures it, so nothing
    dominates it internally; externally it may well be dominated by the
    first-fall literature listed in EXP-SBRG-60c55e's own reference block, none
    of which this session opened, and by arXiv:1504.02347. As an INSTRUMENT it is
    dominated by any exact algebraic derivation of the low-degree part of I(W)
    from the summation recursion, which is precisely what its forward guidance
    asks for and what a positive result would make urgent. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent, no algorithm.
    Quantified deliverable. (i) The first measurement anywhere in this program of
    the low-degree algebraic structure of the descended reachable set, on a grid
    of about 300 cells whose largest memory footprint is 384 MB and whose total
    compute is core-hours. (ii) An EXACT integer null -- excess_d = 0 for a
    random set -- which is a stronger control than any matched-battery null this
    lane currently uses, because it is predicted from linear algebra rather than
    estimated from samples. (iii) A pre-registered two-sided discriminator
    between two named explanations, inherited low degree versus degree
    pseudorandomness, with a persistence rule across bases, seeds and n that a
    single-cell signal cannot satisfy. (iv) Either a target-independent
    membership filter costing n^{O(d)} bits against the Omega(B^{t-1}) words that
    IDEA-20260829-66a876 proves every explicit representation needs -- a storage
    ratio of about 75 at n = 24 -- with its power measured and its remaining
    derivation obligation named; or a measured obstruction closing the
    low-degree compressed-filter class over the tested cells, which together with
    the two companion records gives RQ-SBRG-f31cb2 a defensible answer on the
    attack axis and names what remains open.

