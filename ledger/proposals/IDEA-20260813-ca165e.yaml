idea:
  id: IDEA-20260813-ca165e
  question_id: RQ-UOV-001
  added: '2026-08-13'
  title: >-
    EVERY SINGLE-FORM INVARIANT OF A UOV PUBLIC KEY IS FORCED USELESS, AND THE
    ARGUMENT IS A COUNT: a quadratic form in n variables over F_q generically
    has Witt index about n/2, and UOV's o is far below that, so "this component
    admits a totally singular o-space" is satisfied by almost every form and
    distinguishes nothing -- which closes an entire family of proposed
    distinguishers at zero compute and localises the hardness in the JOINT
    condition
  class: control

  claim: >-
    (A) THE CLOSURE. A recurring shape of proposal against multivariate schemes
    is: compute a classical invariant of the public quadratic forms -- Witt
    index, Arf invariant, type (hyperbolic/elliptic), discriminant, rank
    profile -- and look for a deviation from random. This record argues that
    every such SINGLE-FORM invariant is forced uninformative for UOV, and gives
    the count rather than an intuition.
    A non-degenerate quadratic form in n variables over a finite field has Witt
    index (maximal totally singular subspace dimension) of floor(n/2) or
    floor(n/2) - 1 depending on type -- i.e. ABOUT n/2 for every form, not just
    UOV ones. The UOV trapdoor guarantees a common totally singular subspace of
    dimension o. Published UOV shapes have n/o around 2.5 (this program records
    n/o ~ 2.55 in IDEA-20260808-f0dd08), so o is approximately 0.39n, comfortably
    BELOW the generic Witt index n/2. THEREFORE: the existence of a totally
    singular o-space is a property almost every quadratic form in n variables
    already has, UOV or not. Observing it on one component conveys no
    information, and no function of one component form can separate a UOV key
    from a random map.

    (B) WHAT THAT LEAVES, WHICH IS THE POINT. The secret is not "each P_i has a
    totally singular o-space" -- that is free. The secret is that ALL m of them
    share ONE. The hardness is entirely in the JOINT condition, and the
    expected number of shared singular o-spaces for m INDEPENDENT random forms
    is the Gaussian binomial [n choose o]_q times q^{-m*o(o+1)/2}, which is
    astronomically below 1 at any sane parameter set. So a UOV key is
    distinguished from random not by any per-form invariant but by the presence
    of a coincidence that random maps do not have -- and finding that
    coincidence IS the oil-space problem. The closure and the hardness
    statement are two readings of the same count.

    (C) WHY THIS IS WORTH A RECORD RATHER THAN A REMARK. docs/inventor-protocol.md
    section 4 sets the closure standard: a named obstruction, an argument, and
    forward guidance naming what remains open. This supplies all three, at zero
    compute, for a family of ideas that is cheap to generate and expensive to
    screen one at a time. It also supplies the correct NULL for anyone who does
    measure an invariant: the comparison is not "UOV versus structureless", it
    is "UOV versus m independent random forms of the same size", and those two
    nulls give different answers.

    (D) FORWARD GUIDANCE -- WHAT IS NOT CLOSED. Three things survive and are
    named so the closure is not read wider than it is:
      - JOINT invariants of the m-tuple, e.g. of the pencil {sum c_i P'_i}. The
        pencil's rank distribution is a genuine m-tuple invariant and is the
        object MinRank-style attacks consume. NOT closed here.
      - Invariants sensitive to the DIAGONAL residue in characteristic 2, which
        the polar representation discards (IDEA-20260813-3686da). Witt index is
        computed from the quadratic form and does see the diagonal, so the
        interaction is real and unexamined.
      - Parameter regimes where o EXCEEDS the generic Witt index. If any
        Round-3 or compressed variant pushes o above n/2 - 1, the argument in
        (A) inverts and the invariant becomes maximally informative. Checking
        each declared parameter set against o < n/2 - 1 is a one-line arithmetic
        test and is the record's one concrete deliverable.

    (E) WHAT THIS IS NOT. NOT a hardness proof, NOT a claim that UOV is secure,
    and NOT a claim that no invariant-based attack exists -- (D) names three
    live openings. It closes exactly the single-form family, at the stated
    parameter condition.

  discriminated_from:
    - >-
      IDEA-20260801-014, which measures MinRank/oil-space attack cost against
      the model. MinRank consumes the PENCIL, an m-tuple invariant, which (D)
      explicitly leaves open. No overlap.
    - >-
      IDEA-20260808-f0dd08, which derives the component-dominance inequality
      n/o < 2 + (k-1)/2 and records n/o ~ 2.55. This record consumes that
      recorded ratio as the input to its own count and cites it rather than
      re-deriving it.
    - >-
      IDEA-20260813-3686da (this batch), which is about what the POLAR
      projection discards. That record and this one meet in (D)'s second
      opening and should be read together.
    - >-
      "Witt index", "Arf invariant" and "totally singular" return ZERO hits
      across ledger/proposals and knowledge/ at 8e230f800, so no record
      currently makes or refutes this argument.

  object_first_candidate:
    tracked_object: >-
      A SINGLE-FORM INVARIANT: any function of one component P_i alone (Witt
      index, type, Arf invariant, discriminant, rank).
    lossiness: >-
      Extremely lossy -- one form collapses to one small invariant -- and (A)
      argues the retained part is constant across the population, which is the
      degenerate corner of the inventor protocol's section 2 test: lossy and
      uninformative rather than lossy and propagating.
    propagation: >-
      Perfectly stable under the change of basis that hides the oil space,
      because Witt index and type are basis invariants. Perfect propagation,
      zero information -- the same degenerate endpoint IDEA-20260806-a3ef00
      records for genus symbols on the isogeny side, reached by a different
      route.
    survival_score: >-
      Survives every transformation. Carries nothing, at any parameter set
      satisfying o < n/2 - 1.

  mechanism: >-
    STEP 1 -- THE GENERIC WITT INDEX, STATED AND CHECKED. For a non-degenerate
    quadratic form in n variables over F_q the maximal totally singular subspace
    has dimension floor(n/2) (hyperbolic type) or floor(n/2) - 1 (elliptic
    type). This is classical and is RECALLED, not re-read; Stage 0 confirms the
    statement and its characteristic-2 form, where the theory is stated via the
    Arf invariant rather than the discriminant.
    STEP 2 -- THE COMPARISON. Check o against floor(n/2) - 1 for every declared
    UOV parameter set. If o is strictly below, (A) applies and every single-form
    invariant is uninformative. This is arithmetic on published numbers and
    costs nothing.
    STEP 3 -- THE JOINT COUNT. Compute the expected number of common totally
    singular o-spaces for m independent random forms, [n choose o]_q *
    q^{-m*o(o+1)/2}, and confirm it is far below 1 at each parameter set. That
    number is the quantitative statement of where the hardness sits, and it is
    the correct null for any joint-invariant measurement.
    STEP 4 -- THE EMPIRICAL CONFIRMATION, WHICH EXISTS TO CATCH A DERIVATION
    ERROR RATHER THAN TO DISCOVER ANYTHING. At toy (q, n, o), compute the Witt
    index of every component of many UOV keys and of many random maps, and
    confirm the two distributions are indistinguishable. A separation would
    refute (A) and would be far more interesting than the closure.

  novelty_status: unverified
  novelty_screen:
    method: >-
      grep -ril over ledger/proposals and knowledge/ for "Witt index", "Arf
      invariant", "totally singular", "hyperbolic", "elliptic type",
      "discriminant", "single-form", performed 2026-08-13 at 8e230f800, plus a
      sweep of the 14 proposals citing RQ-UOV-001.
    results: >-
      "Witt index", "Arf invariant", "totally singular": ZERO hits anywhere in
      the repository. No UOV proposal proposes or closes a single-form invariant
      family.
    verdict: >-
      UNVERIFIED. The Witt-index facts are classical finite-field quadratic-form
      theory and none is claimed as new; the parameter ratio is taken from this
      program's own IDEA-20260808-f0dd08. What is claimed is that the corpus
      contains neither the closure nor the family it closes, and that generating
      such proposals one at a time is exactly the fatigue-report failure mode
      the inventor protocol names. No novelty against the external literature is
      claimed and the Round-3 parameters remain unread (RQ-UOV-001.provenance).

  null_object_control: >-
    (1) RANDOM-MAP NULL: Witt-index and type distributions for m independent
    random quadratic forms of the same size, computed on the identical pipeline.
    (A) predicts the UOV distributions are indistinguishable from these; a
    separation refutes the closure.
    (2) INVERTED-PARAMETER POSITIVE CONTROL, BLOCKING: construct a toy instance
    with o ABOVE floor(n/2) - 1, where the argument in (A) inverts and the
    invariant MUST become informative. The pipeline has to detect the separation
    there. A pipeline that reports "no separation" for both the normal and the
    inverted regime cannot detect separation at all, and its null is worthless.
    (3) The o < n/2 - 1 arithmetic check is itself a control on the closure's
    own precondition and is run per parameter set rather than assumed.

  assumptions:
    - >-
      The public components are non-degenerate quadratic forms. Degenerate
      components would change the Witt-index statement; Stage 0 checks the
      specification and the toy generator both.
    - >-
      n/o is around 2.5 at deployed parameters, taken from IDEA-20260808-f0dd08.
      UNVERIFIED against the Round-3 specification, which this program has not
      read; the closure's precondition is re-checked per parameter set rather
      than inherited.
    - >-
      Characteristic 2 is the deployed case, where the classical theory runs
      through the Arf invariant. The odd-characteristic statement is different
      in form and identical in consequence.

  proof_search_map:
    bottleneck: >-
      Whether o < floor(n/2) - 1 holds at every declared parameter set,
      including compressed variants. The entire closure is conditional on it,
      and it is one line of arithmetic per set.
    baseline_embedding:
      parameter_slice: >-
        o = floor(n/2) - 1 exactly, the boundary at which the closure becomes
        vacuous.
      reproduction_check: >-
        Symbolic plus a toy instance at the boundary, where the invariant must
        begin to separate. This pins the closure's edge rather than asserting
        it holds everywhere.
    observation_collision:
      observable: a single-form invariant (Witt index, type, Arf invariant)
      distinct_preimage_search: >-
        EXPECTED TO SUCCEED TOTALLY AND THAT IS THE CLAIM: a UOV component and a
        random form sharing the same invariant should be the overwhelming norm.
        The audit is inverted -- the measurement must CONFIRM near-total
        collision, and any reliable separation refutes (A).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the single-form invariant fixed, vary the map, and ask what
          distinguishes a UOV component from a random form with the same
          invariant.
        predicted_gain: >-
          Predicted: nothing at the single-form level, by (A). The transform's
          value is that it forces the question to the joint level, which is
          where (D) says the openings are.
    quantifier_order: >-
      The closure, explicitly: FOR ALL parameter sets with o < floor(n/2) - 1,
      FOR ALL single-form invariants I, FOR ALL components P_i of a UOV key,
      the distribution of I(P_i) is indistinguishable from I on a uniformly
      random form of the same size. The quantifier over I is the strong part and
      it rests on the Witt-index count applying to every form, UOV or not; it is
      NOT a claim that has been checked for every conceivable I, and the
      measurement in Step 4 tests only the named ones. That limit is stated
      rather than glossed.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At parameter sets with o < floor(n/2) - 1, the named single-form
        invariants do not separate UOV components from random forms." NEVER
        "no invariant attack exists" -- (D) names three live openings.
      nearby_object_control: >-
        The inverted regime o > floor(n/2) - 1, where the conclusion must
        reverse. A closure that holds in both regimes has not used the count and
        is asserting rather than deriving.
    proof_obligations:
      - claim: Generic Witt index is about n/2 for every form.
        responsibility: baseline
      - claim: o < floor(n/2) - 1 at the declared parameter sets.
        responsibility: size
      - claim: Expected common singular o-spaces for random forms is far below 1.
        responsibility: size
      - claim: The inverted regime separates.
        responsibility: correctness
      - claim: The closure is stated only over the named invariants.
        responsibility: scope

  predictions:
    - metric: o versus floor(n/2) - 1 at every declared UOV parameter set
      direction: lower
      minimum_effect: >-
        o strictly below at every set. A set with o at or above inverts the
        closure and is a material finding about that parameter set.
    - metric: >-
        separation between UOV-component and random-form invariant
        distributions, toy scale
      direction: different
      minimum_effect: >-
        Indistinguishable within sampling error at every toy cell in the normal
        regime, AND clearly separated in the inverted-parameter control. Both
        halves required; the second is what shows the pipeline can separate.
    - metric: >-
        expected common totally singular o-spaces for m independent random forms
      direction: lower
      minimum_effect: >-
        Below 1 by many orders of magnitude at every declared set, computed
        exactly from the Gaussian binomial rather than estimated.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): confirm the classical Witt-index statement and its
      characteristic-2 form; file the source. Compute o versus floor(n/2) - 1
      for every parameter set this program has recorded, flagging any that are
      unread rather than assuming them.
      STAGE 1 (zero compute): the Gaussian-binomial joint count per set.
      STAGE 2 (minutes, HARD GATE): the inverted-parameter positive control --
      the pipeline must detect separation where the count says it should.
      STAGE 3 (minutes): invariant distributions for UOV components versus
      random forms across the toy grid, in the normal regime.
    controls:
      - random-map null at matched size
      - inverted-parameter control with o above the generic Witt index (BLOCKING)
      - the o < n/2 - 1 precondition check, per parameter set
    required_metrics:
      - o, n, floor(n/2) - 1 and the verdict, per parameter set
      - invariant distributions, UOV versus random, per toy cell
      - separation statistic and its value in the inverted control
      - exact Gaussian-binomial joint count per set

  falsification_conditions:
    - >-
      Any declared parameter set has o at or above floor(n/2) - 1. The closure's
      precondition fails there and the invariant becomes informative for that
      set -- a material finding, reported per set rather than averaged away.
    - >-
      The inverted-parameter control shows no separation. The pipeline cannot
      detect separation and no null result from it may be reported.
    - >-
      UOV-component invariants separate from random forms in the normal regime.
      (A) is refuted, which is far more interesting than the closure and becomes
      the successor proposal.

  confounders:
    - >-
      Degenerate components. A singular component form has a different Witt
      theory, and toy generators produce them more often than deployed
      parameters would. The rate must be measured and reported, not assumed
      negligible.
    - >-
      Characteristic-2 statement drift. The odd-characteristic theory uses the
      discriminant and the even case uses the Arf invariant; using the wrong one
      produces a confident wrong answer.
    - >-
      Reading the closure as covering joint invariants. (D) exists to prevent
      exactly that and is repeated in interpretation_limits.

  interpretation_limits:
    - >-
      Closes the SINGLE-FORM family only, at parameter sets satisfying
      o < floor(n/2) - 1, over the named invariants. Joint/pencil invariants,
      diagonal-sensitive invariants in char 2, and inverted parameter regimes
      all remain open and are named.
    - >-
      Not a hardness claim and not a security statement about UOV.
    - >-
      Toy tier for the empirical half, per RQ-UOV-001.claim_tier_ceiling; the
      derivation is what would carry, and a derivation error would not be caught
      at deployed size by anything here.

  heuristic_assumptions:
    - id: HEUR-UOVW-1
      statement: >-
        The number of common totally singular o-dimensional subspaces of m
        independent uniformly random quadratic forms on F_q^n has expectation
        [n choose o]_q * q^{-m*o(o+1)/2}, i.e. the m*o(o+1)/2 singularity
        conditions act as independent uniform constraints.
      rigorous_support: >-
        Rigorous: the Gaussian binomial counts o-subspaces exactly, and
        o(o+1)/2 is the exact number of singularity conditions per form.
        Heuristic: independence of those conditions across forms and subspaces,
        the same random-model assumption used throughout this program's
        algebraic counting and known to degrade near parameter degeneracies.
      validation_plan: >-
        Exhaustive enumeration at toy (q, n, o) where the Gaussian binomial is
        fully enumerable, so the comparison is exact rather than sampled.
        Compare empirical mean AND variance against the prediction -- an
        independence failure shows in the variance before the mean. Tail check:
        the maximum count observed against the predicted tail. Toy scale only
        and labelled so.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. This is a closure and a null, and its output is
      a family exclusion plus a correct comparison distribution. No cost against
      UOV is claimed or targeted.
    memory_exponent: >-
      Negligible; the toy enumerations are the only cost and they cap the grid.
    best_known: >-
      Intersection attack, Kipnis-Shamir, reconciliation, per RQ-UOV-001.targets.
      Unchanged and not compared against, since no attack is proposed.
    hidden_overhead: >-
      The closure's strength hides entirely in the precondition o < n/2 - 1. A
      parameter set violating it flips the conclusion, which is why the check is
      per-set and is the deliverable rather than a footnote.
    tradeoff_note: Not applicable; no algorithm produced.

  dominated_by: >-
    As an ATTACK: mounts none; dominated on time, memory and data by every
    baseline in RQ-UOV-001.targets.
    As a CLOSURE: nothing in this corpus dominates it, because no record makes
    the argument. It is dominated in reach by joint-invariant work such as
    IDEA-20260801-014's MinRank measurement, which addresses the family this
    record explicitly leaves open -- so the two are complementary and this one
    is the smaller of the pair.
  sota_delta: >-
    Zero speedup. Deliverable as counts: one family of candidate distinguishers
    excluded by a single arithmetic condition (o < floor(n/2) - 1), checkable
    per parameter set in one line; one exact joint-count expression
    ([n choose o]_q * q^{-m*o(o+1)/2}) supplying the correct null for any
    future joint-invariant measurement, replacing the wrong null
    ("UOV versus structureless"); and three named surviving openings so the
    closure cannot be read wider than it is.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the closure holds as stated at the deployed parameter sets, since
    n/o ~ 2.55 puts o well below n/2. 0.05 that some compressed or Round-3
    variant violates the precondition -- low, but that branch is the one worth
    the record, and it costs one line of arithmetic per set to check. The
    durable value is the correct null for joint-invariant work, which several
    existing UOV proposals will need.

  id_allocation_provenance: >-
    python3 tools/allocate_id.py --next idea --date 20260813, then --check
    IDEA-20260813-ca165e confirmed free before use.

