  claim: Primitive fi*omega transports with denominator fj/gcd(fi,fj). Bidirectional denominators identify ratios, requiring
    an absolute anchor. Nonprimitive maps can hide factors; rational coordinates require the actual module.
  mechanism: Build multiplication/isogeny matrices independently, conjugate rationally, check containment and kernel action.
    For a+b*fi*omega denominator=fj/gcd(b*fi,fj); edge valuation differences leave a common scale.
