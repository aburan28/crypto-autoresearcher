idea:
  id: IDEA-20260829-1859dd
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    THIS LANE BUYS DETECTION RESOLUTION AT THE EIGHTH POWER OF COMPUTE, AND
    NOBODY HAS WRITTEN THE EXPONENT DOWN: class size grows like p^{1/2} so the
    minimum detectable effect falls like p^{-1/4}, while complete class
    enumeration costs p^{2}, giving T proportional to (delta*/sigma)^{-8} --
    measure both exponents on a p-ladder, locate the budget ceiling p_max, and
    report the crossover curve p*(delta) that says which effect sizes this lane
    can ever see inside its own declared 32-bit scope

  class: measurement

  claim: >-
    (A) THE EXPONENT PAIR, DERIVED AND THEN MEASURED. Two quantities govern
    everything this lane can conclude and neither has ever been stated as an
    exponent in any committed record.
      GAMMA, THE DETECTION-FLOOR EXPONENT. The minimum detectable per-class effect
      in units of the within-class standard deviation scales as
      delta*/sigma = (z_{1-alpha/2} + z_{1-beta}) * sqrt(2/n) for a comparison at
      class size n, and n is the class size h(D) with D = t^2 - 4p of order -4p,
      which is |D|^{1/2 + o(1)} by Brauer-Siegel. Hence
      delta*/sigma = C * p^{-1/4 + o(1)}, i.e. gamma = 1/4.
      BETA, THE BUDGET EXPONENT. Complete enumeration of the isomorphism classes
      at p costs O(p^2) field operations in harness/isogeny_class.py, a figure
      IDEA-20260807-34754f and IDEA-20260807-f6137c both record and both name as
      the reason the lane lives at p of order 2^12 to 2^14. Hence beta = 2.
      THE COMPOSITION IS THE HEADLINE: T proportional to p^{beta} and
      delta*/sigma proportional to p^{-gamma} give
      T proportional to (delta*/sigma)^{-beta/gamma} = (delta*/sigma)^{-8}.
      HALVING THE SMALLEST DETECTABLE EFFECT COSTS 256 TIMES THE COMPUTE. That
      number does not appear in this repository and it is the single most
      consequential fact about what this campaign's negatives can ever exclude.

    (B) THE ARITHMETIC AT THIS CAMPAIGN'S OWN COMMITTED PARAMETERS, STATED AS A
    MODEL COMPUTATION PERFORMED THIS SESSION AND TO BE RE-DERIVED, NEVER AS A
    MEASUREMENT. At p = 4001 the committed target class has n = 138 curves (quoted
    at second hand from IDEA-20260807-34754f, read in full). With alpha = 0.05 and
    power 0.8, z_{0.975} + z_{0.8} = 1.960 + 0.842 = 2.802, so
    delta*/sigma = 2.802 * sqrt(2/138) = 0.337. The lane can currently see a
    per-class effect of about a third of its own within-class noise and no
    smaller. Three consequences, each arithmetic:
      B1. UNDER MULTIPLICITY IT IS WORSE, BY A COMPUTABLE FACTOR.
          IDEA-20260807-caf061 declares a family of m = 14 primaries, so the
          per-test level is 0.05/14 = 3.571e-3 and z becomes 2.914, giving
          z-sum 3.756 and delta*/sigma = 0.452 at n = 138. Reaching the
          uncorrected 0.337 under correction requires n = 2*(3.756/0.337)^2 = 248
          curves, i.e. a class 1.80 times larger, i.e. p larger by a factor
          (248/138)^2 = 3.23 and compute larger by 3.23^2 = 10.4. caf061 already
          says multiplicity raises the detection floor; this is that sentence with
          its exponent and its price attached.
      B2. THE DECLARED SCOPE CEILING IS ALSO, APPROXIMATELY, THE FIRST INTERESTING
          RESOLUTION -- AND IT IS UNREACHABLE. To reach delta*/sigma = 0.01 needs
          n = 2*(2.802/0.01)^2 = 1.57e5 curves. With the committed ratio
          n/sqrt(p) = 138/63.25 = 2.18 that is sqrt(p) = 7.19e4, p = 5.2e9, about
          2^32.3 -- essentially exactly RQ-INSTR-f8faa0's declared bit-size ceiling
          of "p up to ~32 bits". At that p complete enumeration is of order
          p^2 = 2^64.6 field operations. So the question's own declared scope
          ceiling is where the resolution this lane would want begins, and it lies
          beyond the declared method's budget by roughly forty binary orders of
          magnitude. THE SCOPE IS NOT WRONG; IT IS UNREACHED, AND BY A NUMBER.
      B3. EVERY COMMITTED RESULT SITS AT p = 4001, ABOUT 12 BITS, WHICH IS 20 BITS
          BELOW THE DECLARED CEILING. So this campaign has never exercised its
          instruments anywhere near the scale it claims scope over, and the
          extrapolation from 12 bits to 32 bits is exactly the kind of unlabelled
          extrapolation docs/claims-and-verification.md forbids.

    (C) THE STRUCTURAL TELL, PRE-REGISTERED, AND IT IS WHY THIS IS AN EXPERIMENT
    AND NOT A CALCULATION. Under docs/inventor-protocol.md section 3 the question
    is what the measured quantity SHOULD do as the parameter grows. Here
    delta*/sigma should DECAY as p^{-1/4}, because power comes from class size and
    class size grows. A MEASURED delta*/sigma THAT DOES NOT DECAY AT THAT RATE IS
    AN ARTIFACT SIGNATURE, and the candidate causes are enumerable in advance:
      T1  the permutation resolution floor 1/(B+1), which is fixed in p, so once
          delta* falls to where the p-value would need to go below 1/(B+1) the
          measured floor stops moving and the limit is the budget B, not the
          mathematics (IDEA-20260807-caf061's floor, seen from the power side);
      T2  the discreteness of an integer-valued functional -- two_torsion_x_count
          takes values in {0, 1, 3}, so its standardized effect cannot resolve
          below the granularity of a three-point distribution however large n
          becomes;
      T3  a multiplicity family that grows with p, since more classes means more
          tests, which would make the correction eat the power the larger class
          bought;
      T4  a within-class variance sigma that itself grows with p, which for a
          count-valued functional it will -- so the RATIO delta*/sigma is the
          quantity that must be watched and the raw delta* is not.
    Which of the four is responsible is decided by the ladder, and identifying it
    is a more useful deliverable than the exponent itself.

    (D) THE DELIVERABLE. Three numbers with error bars and one curve.
      D1  the FITTED gamma, from a log-log regression of measured delta*/sigma
          against p over a ladder of at least four p, with its standard error,
          against the predicted 1/4;
      D2  the FITTED beta, from a log-log regression of measured wall clock for
          the full battery against p, with its standard error, against the
          predicted 2;
      D3  p_max, the largest p at which the full battery completes inside a
          frozen budget of 3600 seconds and 8 GB, measured by bisection rather
          than extrapolated;
      D4  THE CROSSOVER CURVE p*(delta), the p at which the fitted floor reaches a
          target effect size delta, plotted over delta in [0.001, 0.5], with p_max
          drawn on it as a horizontal line. THE READER SUPPLIES delta. This record
          deliberately does NOT assert an attack-relevance threshold, because this
          program has no validated attack cost model for a class effect and
          because IDEA-20260807-f6137c's Closure 2 Limb 3 argues that even a
          perfectly measured class effect buys nothing unless it is reachable.
          Asserting a threshold would be the overclaim; supplying the curve is the
          honest object.

    (E) WHAT EACH OUTCOME MEANS, AND BOTH ARE INFORMATIVE. If the fitted gamma is
    1/4 within error and p_max sits far below p*(delta) for every delta the
    campaign cares about, this lane has a MEASURED OBSTRUCTION WITH AN EXPONENT --
    a closure at docs/inventor-protocol.md section 4's standard, where the
    obstruction is a quantity with units and error bars rather than a verdict --
    and the honest form of every future negative in the lane becomes "no effect
    above delta*(p) at the p we could afford", with delta*(p) a published curve.
    If the fitted gamma is materially steeper than 1/4, the lane buys resolution
    faster than this record predicts and the ceiling is further away than it looks,
    which is the outcome the record would most like to be wrong about. If gamma is
    near zero -- the floor does not move with p at all -- then one of T1 to T4 is
    binding and the lane's resolution is capped by a budget parameter it can change
    for free, which would be the most actionable result of the four.

  mechanism: >-
    THE STRUCTURAL DIAGNOSIS. Every record in this lane states its cost as a
    complexity class and its power as a single number at one p, and no record
    connects them. IDEA-20260807-efc8de produces delta* at p = 4001;
    IDEA-20260807-caf061 shows multiplicity raises delta*; IDEA-20260807-34754f
    and IDEA-20260807-f6137c both note the O(p^2) enumeration as the reason the
    lane is confined to small p. Those are the three ingredients of an exponent
    statement and nobody has multiplied them. The consequence is that the lane
    cannot say what its own negatives exclude at any p other than the one it ran.
    THE MECHANISM IS A LADDER, NOT A DERIVATION. The exponents above are derived
    under a model and the model can be wrong in four named ways (claim C), so the
    record measures rather than computes. Choose a geometric ladder of at least
    four p spanning at least three binary orders of magnitude -- for example
    p near 2^12, 2^13, 2^14 and 2^15, all prime, each chosen with its congruence
    class recorded -- and at each p: enumerate the classes, pick the target class
    by the committed rule, run the frozen analysis pipeline, and run
    IDEA-20260807-efc8de's Family 1 delta sweep to read delta* off the detection
    probability curve at power 0.8. Record wall clock for each stage separately, so
    beta is fitted against the ENUMERATION and not against the whole run.
    WHY THE RATIO AND NOT THE RAW FLOOR. For a count-valued functional the
    within-class standard deviation itself grows with p, so a raw delta* that grows
    is uninformative and a raw delta* that shrinks is doubly so. The tracked
    quantity is the STANDARDIZED floor delta*/sigma, which is dimensionless,
    comparable across functionals, and is the quantity whose decay exponent is
    predicted. Reporting both is required; reporting only the raw one is the error
    T4 names.
    WHY BISECTION AND NOT EXTRAPOLATION FOR p_max. A budget ceiling read off a
    fitted line is a prediction about a machine, and IDEA-20260815-c4a653 already
    records that every cost number in this campaign comes from one machine whose
    variance has never been measured. So p_max is FOUND by doubling p until the
    frozen budget is breached, and the breach is recorded as an infrastructure
    outcome under AGENTS.md rule 3, never as a mathematical result.

  tracked_object: >-
    THE STANDARDIZED DETECTION FLOOR AS A FUNCTION OF SCALE: the pair
    (log p, log(delta*/sigma)) for a fixed frozen analysis pipeline, together with
    (log p, log T_enumeration). The object followed through the computation is the
    two-dimensional point, and the operation that propagates it is INCREASING p.

  lossy_projection_test: >-
    PASSES. The projection sends an entire experiment at scale p -- every curve,
    every class, every functional value, every permutation draw -- to four real
    numbers. It is as lossy as a projection in this program gets: two experiments
    with completely different functionals, different classes and different verdicts
    map to the same point if their class sizes and timings agree, and that
    many-to-oneness is the point, because the floor is a property of the DESIGN and
    not of the mathematics measured. What it discards is discarded COMPATIBLY with
    the operation the target performs, because the operation is "increase p" and
    the retained coordinates propagate deterministically under it through two
    stated laws: n = h(t^2 - 4p) fixes the sample size from p alone, and the
    enumeration cost is a function of p alone. Neither law consults anything
    discarded. It is NOT a change of coordinates: nothing about any curve, class or
    functional is recoverable from four numbers, and the fibre over a point is the
    set of all experiments with that class size and that timing.
    HONEST LIMIT, STATED HERE. The projection cannot see WHICH functional it is
    describing, so delta*/sigma must be reported per functional and the exponent
    fitted per functional; a single pooled gamma would be a projection of a
    projection and would hide exactly the heterogeneity claim (C) T2 predicts
    between a continuous and an integer-valued functional. The record therefore
    tracks one point per (functional, p) and never pools.

  scope_verdict: >-
    IN SCOPE, and this record is the one that takes the declared scope's OWN
    numbers seriously: prime fields, toy ordinary prime-field short-Weierstrass
    curves enumerated by isogeny class, and the declared bit-size ceiling of "p up
    to ~32 bits", which it treats as a testable claim about reachability rather
    than as decoration. Every p on the ladder is inside the declared ceiling; the
    finding is that the top of the declared range is not reachable by the declared
    method, which is a statement about the method and not a widening of the scope.
    ON THE THREE CROSS-LANE INSTANCES: OUTSIDE this question's declared scope on
    every axis, and stated plainly. IDEA-20260829-9aaa40's object is a
    symmetric-cryptanalysis frontier compilation with no curve and no field;
    IDEA-20260829-9e6650's are SHA-1 and MD5 differential paths, likewise;
    IDEA-20260829-c7472b's are elliptic curves over Q with coefficients of order
    1.4e26 and PARI class-group computations -- the field type is Q, not a prime
    finite field, and the size is far above 32 bits. None is inside
    RQ-INSTR-f8faa0's curve_families, field_types or bit_sizes. This record imports
    from them only the general lesson that an instrument's power must be measured
    rather than assumed, and instantiates it on in-scope objects.
    THE SCOPE GAP IS A DEFECT OF THE QUESTION RECORD AND IS ITSELF A FINDING. Its
    title and decision_target are program-general while its scope block is bound to
    GOAL-ENDO-001's lane; proposals already filed against it are already outside
    that block (IDEA-20260816-2f049b, read in full this session, has a side-channel
    leak detector as its object and touches no curve). The correct repair is a
    clause-scoped correction record on the pattern of RQ-MCE-3f7c02 and
    RQ-MCE-f8fca0: record_role clause_supersession, superseding the scope clause
    alone, with the out-of-scope filed proposals listed as sites, every other
    clause left in force, and nothing edited. ONLY THE COORDINATOR MAY CREATE IT.
    This record proposes that it is needed and creates none. Note the second-order
    point this record contributes to that decision: the declared 32-bit ceiling is
    not merely wider than what has been run, it is wider than what CAN be run by
    the declared method, so a correction that narrows the scope to the reachable
    range would be supported by claim (B2)'s arithmetic rather than by preference.

