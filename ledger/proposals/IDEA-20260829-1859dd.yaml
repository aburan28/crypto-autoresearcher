  assumptions:
    - >-
      The analysis pipeline is FROZEN before the ladder is climbed and its commit
      recorded, because delta* is a property of the pipeline. A pipeline change
      mid-ladder makes the fitted gamma meaningless, and IDEA-20260807-efc8de
      already requires delta* to be stamped with the pipeline's commit.
    - >-
      The class-selection rule is the committed one (harness/run_icinv.py's
      pick_classes takes the largest ordinary classes) and is applied identically
      at every rung. Selection on class size is a known confound recorded in
      IDEA-20260807-34754f; here it also biases n upward relative to typical h(D),
      which is why the ratio n/sqrt(p) is a required metric at every rung rather
      than a constant assumed from p = 4001.
    - >-
      Wall clock is measured on one machine whose variance is unmeasured. beta is
      therefore fitted from OPERATION COUNTS where they can be instrumented and
      from wall clock only as a cross-check, and p_max is reported with the
      machine, the interpreter version and the frozen budget attached.
    - >-
      A budget breach is an infrastructure outcome under AGENTS.md rule 3 and is
      never negative mathematical evidence. p_max is a statement about a machine
      and a budget, not about mathematics.
    - >-
      Toy tier throughout. Every rung is inside the declared 32-bit ceiling, and
      the record's central finding is precisely that the top of that range is not
      reachable by the declared method -- which is a statement about reachability,
      not a claim about any curve at that size.

  proof_search_map:
    bottleneck: >-
      The composition beta/gamma. Everything this lane can ever conclude is bounded
      by it: gamma alone says resolution improves with scale, beta alone says scale
      is expensive, and only the ratio says whether any resolution the campaign
      wants is purchasable. Removing either exponent leaves a statement that cannot
      be acted on.
    baseline_embedding:
      parameter_slice: >-
        p = 4001, traces {30, -30, 18, -18}, fb_m2 = 40, fb_m3 = 13, window = 400,
        targets = 400, seed = 20260807 -- exactly RUN-ICINV-p4001-a, and exactly
        the slice IDEA-20260807-efc8de's Family 1 sweep is specified against. The
        ladder's first rung IS the incumbent, so the embedding is exact rather than
        approximate.
      reproduction_check: >-
        Frozen fixture at rung 1: the pipeline must reproduce the committed class
        sizes 138, 138, 98, 98, the committed verdicts, and the committed
        permutation p-values digit for digit before any further rung is climbed. A
        curve on a log-log plot that looks like the right slope is not an
        embedding; the first rung must reproduce the committed numbers exactly or
        the ladder is measuring a different pipeline.
    observation_collision:
      observable: >-
        The fitted pair (gamma, beta), and in particular a fitted gamma near zero.
      distinct_preimage_search: >-
        COLLISION IDENTIFIED IN ADVANCE AND IT IS THE RECORD'S MAIN RISK, stated
        rather than hidden. A flat measured delta*/sigma across the ladder has at
        least five distinct ground-truth preimages, four of which are artifacts:
        (i) genuine -- the floor really is scale-independent for that functional;
        (ii) T1, the permutation floor 1/(B+1) binding, which is fixed in p;
        (iii) T2, the functional's own discreteness capping the standardized
        resolution; (iv) T3, a multiplicity family growing with p; (v) T4, sigma
        growing with p so that the ratio is flat while the raw floor moves. SEPARATING
        CONDITIONS, all cheap and all required as metrics: report B and the
        attainable p-value floor at every rung so (ii) is visible; report the
        functional's distinct-value count at every rung so (iii) is visible; hold
        the multiplicity family FIXED at m = 14 across the ladder by design so (iv)
        cannot arise, and report m anyway; report raw delta* and sigma separately
        beside the ratio so (v) is visible. With those four columns the five
        preimages separate, and without them the fitted gamma is not identifiable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The p-ladder as a resource measure: each rung is a specialization whose
          GAIN is the resolution bought (the drop in delta*/sigma) and whose CHARGE
          is the enumeration cost incurred, charged only over the rung's own
          increment so the charges are disjoint along the chain by construction.
        predicted_gain: >-
          MODELED, NOT MEASURED. A four-point cost-resolution curve per functional
          with a fitted exponent and standard error, from which the crossover curve
          p*(delta) and the budget ceiling p_max follow directly.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (a flat delta*/sigma) fixed and vary the forgotten
          structure: exhibit one functional whose floor is flat because of T1 (the
          permutation budget, changeable for free by raising B) and one whose floor
          is flat because of T2 (its own discreteness, not changeable at all).
        predicted_gain: >-
          MODELED, NOT MEASURED. The pair distinguishes a budget ceiling this lane
          can lift from a structural one it cannot, which is the difference between
          an actionable finding and a closure. If no such pair exists the fibre is
          uniform and the transform yields nothing, which is a clean negative.
    quantifier_order: >-
      THIS RECORD CLAIMS: FOR the frozen pipeline and the declared functionals,
      THERE EXIST exponents gamma and beta, fitted with standard errors over the
      tested ladder, such that delta*/sigma is proportional to p^{-gamma} and
      enumeration cost is proportional to p^{beta} over the TESTED RANGE. NOT
      CLAIMED, and the distinction is the whole of the record's honesty: that the
      fitted exponents hold for all p, for untested functionals, or beyond the
      ladder's top rung. Extrapolating a four-point log-log fit twenty binary
      orders of magnitude to p = 2^32 would be exactly the unlabelled extrapolation
      docs/claims-and-verification.md forbids, so claim (B2)'s arithmetic is
      presented as a MODEL COMPUTATION under the predicted exponents and is
      explicitly not presented as a measurement or a prediction about p = 2^32.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the frozen pipeline, the tested ladder and the declared functionals:
        fitted gamma and beta with standard errors, a bisected p_max under a named
        budget on a named machine, and a crossover curve p*(delta) derived from
        those fits and labelled as a derivation. The method can NEVER certify that
        an effect of any size exists or does not exist, NEVER certify anything at
        an untested p, NEVER establish an attack-relevance threshold (it has no
        attack cost model and does not pretend to), and NEVER convert a budget
        ceiling into a mathematical impossibility.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION MUST FAIL, and it must be run
        at every rung: a SYNTHETIC functional with a known, scale-independent noise
        model -- independent Gaussian draws with unit variance assigned to each
        curve. For it, sigma is 1 by construction and delta*/sigma must follow
        exactly the sqrt(2/n) law, so the measured gamma must equal the class-size
        exponent to within fitting error and nothing else. If the pipeline does not
        recover gamma = 1/4 on the synthetic functional, it is not measuring what
        this record says it measures, and every real functional's fitted exponent
        from the same run is void. Symmetrically, a CONSTANT functional must produce
        no finite delta* at any rung. A ladder that cannot separate that pair has
        identified nothing.
    proof_obligations:
      - claim: >-
          The first rung reproduces RUN-ICINV-p4001-a's class sizes, verdicts and
          permutation p-values exactly.
        responsibility: baseline
      - claim: >-
          delta* is read off a measured detection-probability curve at power 0.8,
          not computed from the closed-form power formula.
        responsibility: correctness
      - claim: >-
          The multiplicity family size m is held fixed across the ladder by design
          and reported at every rung.
        responsibility: strictness
      - claim: >-
          Raw delta*, sigma, the ratio, B, the attainable p-value floor and the
          functional's distinct-value count are reported separately at every rung,
          so the five preimages of a flat curve separate.
        responsibility: correctness
      - claim: >-
          The synthetic Gaussian control recovers gamma equal to the class-size
          exponent within fitting error.
        responsibility: correctness
      - claim: >-
          p_max is found by bisection under a frozen budget, is reported with the
          machine and interpreter recorded, and any breach is labelled an
          infrastructure outcome.
        responsibility: feasibility
      - claim: >-
          No fitted exponent is extrapolated beyond the ladder's top rung in any
          statement of result; claim (B2)'s arithmetic is labelled a model
          computation wherever it appears.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        fitted gamma, the negative slope of log(delta*/sigma) against log p, per
        functional, over a ladder of at least four prime p spanning at least three
        binary orders of magnitude, with standard error
      direction: different
      minimum_effect: >-
        0.25 plus or minus 0.06 for the synthetic Gaussian control and for any
        continuous functional. A fitted gamma below 0.10 for a continuous
        functional means the floor is not sample-size limited and one of T1 to T4
        is binding; identifying which is then the deliverable in place of the
        exponent. A fitted gamma above 0.40 means the lane buys resolution faster
        than this record predicts and claim (A) is withdrawn in the direction that
        helps the programme.
    - metric: >-
        fitted beta, the slope of log(enumeration operation count) against log p,
        with standard error
      direction: different
      minimum_effect: >-
        2.0 plus or minus 0.15, matching the O(p^2) figure the corpus records. A
        materially lower beta means the enumeration is cheaper than the lane
        believes and p_max is further out; a higher one means the ceiling is nearer.
        Either changes the ratio beta/gamma and therefore the headline.
    - metric: >-
        the ratio beta/gamma, the compute exponent per unit of resolution
      direction: higher
      minimum_effect: >-
        Predicted 8.0. Report with a propagated standard error from the two fits.
        A measured value below 4 would mean resolution is materially cheaper than
        this record claims and the whole concern shrinks; that is a real possible
        negative and it is the one the record would most like to lose.
    - metric: >-
        p_max, the largest prime p at which the full frozen battery completes
        within 3600 seconds and 8 GB, found by bisection on a named machine
      direction: lower
      minimum_effect: >-
        Predicted at or below 2^17, i.e. at least 15 binary orders of magnitude
        below RQ-INSTR-f8faa0's declared ceiling of about 32 bits. A p_max above
        2^22 falsifies claim (B2)'s framing: the declared scope would then be
        merely unexercised rather than unreachable, which is a materially different
        and much better position for the campaign.
    - metric: >-
        measured n / sqrt(p) at every rung, under the committed largest-class
        selection rule
      direction: different
      minimum_effect: >-
        Reported raw at every rung with the trace used. Predicted to stay within a
        factor of 3 of the p = 4001 value of 138/63.25 = 2.18. A ratio that drifts
        systematically means the class-size law feeding gamma is not what the model
        assumes and gamma must be re-derived against the measured law rather than
        against Brauer-Siegel.
    - metric: >-
        nearby-object control: fitted gamma for the synthetic unit-variance Gaussian
        functional, and finiteness of delta* for the constant functional
      direction: different
      minimum_effect: >-
        gamma equal to the measured class-size exponent within fitting error for the
        Gaussian, and NO finite delta* at any rung for the constant. Failure of
        either voids every fitted exponent from the same run.

  minimal_test:
    design: >-
      One executor task, staged so that the cheapest falsifiers run first and the
      expensive enumerations run last.
      STAGE 0, ZERO COMPUTE. Freeze the analysis pipeline and record its commit.
      Write the model computation of claim (B) explicitly -- the z-sums, the
      n = 138 arithmetic, the multiplicity factor, the p = 2^32.3 figure -- and
      label every line MODEL COMPUTATION so no reader can mistake it for a
      measurement. Declare the ladder's p values, the class-selection rule, the
      fixed multiplicity family m, the frozen budget and the machine, and commit
      them before the first run.
      STAGE 1, minutes. Reproduce the committed rung: class sizes 138, 138, 98, 98,
      the seven per-class verdicts, and the permutation p-values, digit for digit.
      HALT AND REPORT on any mismatch.
      STAGE 2, an hour. At the committed rung, run the Family 1 delta sweep for
      every declared functional plus the synthetic Gaussian control and the constant
      control, and read delta* off at power 0.8. This produces the first ladder
      point and, on its own, the first standardized floor this campaign has ever
      published.
      STAGE 3, hours. Climb the ladder: for each further p, enumerate, select,
      measure, sweep. Record enumeration operation count and wall clock SEPARATELY
      from analysis cost. Report n / sqrt(p) at every rung.
      STAGE 4, bounded by the frozen budget. Bisect for p_max: double p until the
      battery breaches 3600 seconds or 8 GB, then bisect once. Record the breach as
      an infrastructure outcome.
      STAGE 5, zero compute. Fit gamma and beta by log-log regression per
      functional, propagate errors into beta/gamma, and emit the crossover curve
      p*(delta) over delta in [0.001, 0.5] with p_max drawn as a horizontal line
      and every extrapolated region shaded and labelled UNTESTED.
      THE CHEAPEST VALID DISCRIMINATOR IS STAGE 2 PLUS ONE FURTHER RUNG: two ladder
      points already give a slope, and a slope near zero for a continuous functional
      settles the artifact question before the expensive rungs are paid for.
    controls:
      - >-
        NEARBY-OBJECT CONTROL, and it is blocking: the synthetic unit-variance
        Gaussian functional, whose gamma must equal the measured class-size
        exponent within fitting error. A pipeline that fails it is not measuring a
        detection floor and every exponent from that run is void.
      - >-
        CONSTANT-FUNCTIONAL CONTROL: no finite delta* at any rung, by construction.
        A ladder that reports one is broken.
      - >-
        FROZEN-FIXTURE BASELINE at the committed rung, which can fail and which
        halts the ladder if it does.
      - >-
        FIXED-FAMILY CONTROL: the multiplicity family size m is held constant across
        the ladder by design, so preimage T3 of the flat-curve collision cannot
        arise, and m is reported at every rung anyway.
      - >-
        B-SUFFICIENCY CONTROL: at every rung, B is set from IDEA-20260807-caf061's
        rule B > m/alpha - 1 and the attainable p-value floor 1/(B+1) is printed
        beside every result, so preimage T1 is visible rather than inferred.
      - >-
        SEPARATED-COST CONTROL: enumeration cost and analysis cost are timed
        separately, so beta is fitted against the enumeration and not against a mix.
      - >-
        MACHINE RECORD: every timing carries the machine, the interpreter version
        and the frozen budget, because the campaign's cost numbers all come from one
        unmeasured machine.
    required_metrics:
      - "per rung: p, its congruence class, the selected traces, the class size n, and n / sqrt(p)"
      - "per (rung, functional): raw delta*, sigma, the ratio delta*/sigma, and the detection-probability curve it was read from"
      - "per (rung, functional): the functional's distinct-value count, so discreteness is visible"
      - "per rung: B, the attainable p-value floor 1/(B+1), and the fixed multiplicity family size m"
      - "per rung: enumeration operation count and wall clock, timed separately from analysis"
      - "fitted gamma and beta per functional with standard errors, and beta/gamma with propagated error"
      - "p_max with the machine, interpreter, frozen budget, and the breach classified as an infrastructure outcome"
      - "the crossover curve p*(delta) over delta in [0.001, 0.5], with p_max drawn on it and every extrapolated region labelled UNTESTED"
      - "nearby-object control rows: Gaussian gamma, and the constant functional's absence of a finite delta*"

  falsification_conditions:
    - >-
      The frozen fixture at the committed rung does not reproduce. The ladder is
      measuring a different pipeline; nothing is fitted and the mismatch is reported
      as a reproducibility defect.
    - >-
      The synthetic Gaussian control does not recover gamma equal to the measured
      class-size exponent within fitting error. The pipeline is not measuring a
      detection floor and every exponent from that run is withdrawn.
    - >-
      Fitted gamma exceeds 0.40 for a continuous functional. Claim (A) understates
      how fast this lane buys resolution; the ceiling is further away than stated
      and the record is withdrawn in the direction that helps the programme.
    - >-
      Fitted beta is below 1.5. The enumeration is materially cheaper than the
      corpus records, p_max is further out, and the headline ratio falls.
    - >-
      beta/gamma measures below 4.0. The eighth-power headline is wrong and is
      replaced by the measured value; this is the record's most likely quantitative
      failure and it is pre-registered.
    - >-
      p_max exceeds 2^22 under the frozen budget. The declared 32-bit scope is
      merely unexercised rather than unreachable, claim (B2)'s framing is withdrawn,
      and the campaign is in a much better position than this record supposes.
    - >-
      delta*/sigma is flat across the ladder AND none of the four separating columns
      (B and its floor, the distinct-value count, the fixed m, raw delta* against
      sigma) identifies which preimage is responsible. The observable is then not
      identifiable, no gamma may be reported, and naming the missing column is the
      deliverable.
    - >-
      Every rung above the committed one breaches the frozen budget, including the
      first increment. That is an infrastructure outcome under AGENTS.md rule 3, it
      invalidates the ladder entirely, and it is reported as invalid_measurement --
      never as evidence that the exponents are anything.

  confounders:
    - >-
      A FOUR-POINT LOG-LOG FIT OVER THREE BINARY ORDERS OF MAGNITUDE HAS WIDE ERROR
      BARS. The standard error on gamma is the headline's real uncertainty and must
      be propagated into beta/gamma rather than quoted only on the point estimate.
      Any statement about p = 2^32 is a model computation and is labelled as one.
    - >-
      SELECTION ON CLASS SIZE. The committed rule picks the LARGEST ordinary
      classes, so n is a biased upper estimate of h(D) and the ratio n / sqrt(p) may
      drift with p in a way that is a property of the selection rule and not of the
      arithmetic. Reporting n / sqrt(p) at every rung is the guard, and a secondary
      arm with randomly selected classes should be run if the ratio drifts.
    - >-
      BRAUER-SIEGEL'S o(1) IS INEFFECTIVE AND L(1, chi) FLUCTUATES. The predicted
      exponent 1/4 is asymptotic and the ladder is four points at small p, where the
      fluctuation is a substantial part of the signal. This is why gamma is FITTED
      and the theorem supplies only the predicted value.
    - >-
      SIGMA IS NOT SCALE-INVARIANT FOR COUNT-VALUED FUNCTIONALS. The standardized
      ratio is the tracked quantity precisely because the raw floor moves for
      reasons that have nothing to do with power, and both must be reported so a
      reader can see which is doing the work.
    - >-
      ONE MACHINE, UNMEASURED VARIANCE. beta fitted from wall clock inherits every
      property of one machine on one day. Operation counts are the primary
      measurement and wall clock is a cross-check, and p_max is a statement about
      that machine under that budget.
    - >-
      THE PIPELINE MUST NOT MOVE. delta* is a property of the analysis, so a
      pipeline edit between rungs makes the fit meaningless. The commit is recorded
      at every rung and a change halts the ladder.
    - >-
      PYTHON CONSTANT FACTORS. An O(p^2) algorithm in pure Python may show an
      apparent exponent above 2 from cache and allocation behaviour at the sizes
      tested. Operation counting rather than timing is the mitigation and the gap
      between the two fitted betas is itself reported.

  interpretation_limits:
    - >-
      NO ASYMPTOTIC CLAIM ABOUT ECDLP IS MADE OR IMPLIED. The exponents here are
      properties of an INSTRUMENT's resolution and of an ENUMERATION's cost. No
      attack exponent moves, no attack is mounted, and the prime-field frontier is
      untouched in both directions.
    - >-
      Fitted exponents are scoped to the tested ladder. Statements about p = 2^32
      are model computations under the predicted exponents, are labelled as such
      everywhere they appear, and are not predictions about what would be measured
      there.
    - >-
      p_max is a statement about one machine, one interpreter and one frozen budget.
      A better implementation moves it, and the record must not be cited as a
      statement about what is computable.
    - >-
      The crossover curve p*(delta) supplies a mapping from a target effect size to
      a required scale. It asserts NO target effect size, because this program has
      no validated attack cost model for a class effect and because
      IDEA-20260807-f6137c's Closure 2 Limb 3 argues a measured class effect is not
      an attack unless it is reachable. Reading the curve as an attack claim is the
      error this framing exists to prevent.
    - >-
      Toy tier under docs/claims-and-verification.md at every rung. This record
      asserts nothing about H-STR-002, phi_alpha or any verdict in DEC-20260727-009,
      and moves no hypothesis.

  heuristic_assumptions:
    - id: HS-1
      statement: >-
        (Class-size law.) For the classes selected by the committed
        largest-ordinary-class rule at prime p, the class size n satisfies
        n = c(p) * p^{1/2} with c(p) bounded between 1/3 and 3 times its value at
        p = 4001 over the tested ladder. Equivalently, the ordinary isogeny class
        size at fixed p behaves like the class number h(D) of the imaginary
        quadratic order of discriminant D = t^2 - 4p, which is |D|^{1/2 + o(1)}.
      rigorous_support: >-
        PROVEN BOUND FIXING THE QUANTITY: for an ordinary curve the class size is
        the class number of the endomorphism order, and the class number formula
        gives h(D) = sqrt(|D|) * L(1, chi_D) / pi up to an explicit constant, so
        the sqrt(|D|) factor is exact and only L(1, chi_D) is modelled. CLASSICAL
        DISTRIBUTION THEOREM IMITATED: Brauer-Siegel, under which
        log h(D) / log sqrt(|D|) tends to 1, together with Cohen-Lenstra for the
        finer structure of the class group. OBSTRUCTION DECLARED, AND IT IS REAL:
        Brauer-Siegel's convergence is INEFFECTIVE, L(1, chi_D) fluctuates by a
        factor that is not bounded uniformly, and the largest-class selection rule
        biases upward. So HS-1 is an empirical law over a four-point ladder, not a
        theorem, and gamma is fitted against the MEASURED class sizes rather than
        against p^{1/2} wherever the two disagree.
      validation_plan: >-
        WHAT TO SAMPLE: at each rung, the complete size profile of every ordinary
        isogeny class at p, not merely the selected ones -- the enumeration produces
        it for free once paid. SCALE: four rungs, complete enumeration at each,
        which is the ladder's dominant cost and is already budgeted. SHORTCUT USED
        TO REACH SCALE: none, and none is needed at toy p, because the classes are
        exactly enumerable; this is why the validation is unusually strong for a
        heuristic of this kind and it is stated rather than implied. PREDICTED
        DISTRIBUTION: the histogram of n / sqrt(p) over all ordinary classes at each
        rung, compared against the class-number-formula prediction with L(1, chi_D)
        computed directly for each discriminant; and the selected-class ratio
        reported separately so the selection bias is visible as a shift rather than
        absorbed. TAIL CHECKS: the largest and smallest class at each rung, and
        whether the largest-class rule is picking a systematically atypical
        discriminant -- if the selected traces cluster at small |D| or at
        discriminants with unusual factorisation, that is reported as a selection
        finding. TRANSFER ASSUMPTION, STATED EXPLICITLY: the fitted law is claimed
        over the tested ladder only, and nothing transfers to p = 2^32 or to
        cryptographic scale, where the enumeration that makes this validation
        possible cannot be performed at all.
    - id: HS-2
      statement: >-
        (Floor-scaling law.) For a fixed frozen pipeline and a functional whose
        within-class distribution has finite variance and does not degenerate, the
        measured minimum detectable standardized effect satisfies
        delta*/sigma = K * n^{-1/2} * (1 + o(1)) with K depending on the level, the
        power and the null's efficiency but not on p.
      rigorous_support: >-
        PROVEN INGREDIENT: for the two-sample normal comparison the minimum
        detectable standardized effect is exactly
        (z_{1-alpha/2} + z_{1-beta}) * sqrt(2/n), so the n^{-1/2} rate is exact in
        that model. CLASSICAL RESULT IMITATED: the asymptotic relative efficiency of
        a permutation test against its parametric counterpart, which is 1 under the
        normal model and bounded below by 0.864 for the Wilcoxon-type statistics --
        so K absorbs the efficiency and the RATE is preserved. OBSTRUCTION DECLARED:
        the committed statistic is a mean of within-group VARIANCES, not a mean of
        values, so its efficiency constant is not one of the tabulated ones and K is
        genuinely unknown; and for an integer-valued functional with three attainable
        values the normal approximation fails outright, which is exactly artifact
        preimage T2. HS-2 is therefore asserted only for functionals whose
        distinct-value count grows with n, and functionals that fail that test are
        reported separately and never pooled into a fitted gamma.
      validation_plan: >-
        WHAT TO SAMPLE: the synthetic unit-variance Gaussian functional at every
        rung, which satisfies HS-2's hypotheses by construction and therefore acts
        as the embedded calibration subset; plus every real functional's
        distinct-value count at every rung, which decides whether HS-2 applies to it
        at all. SCALE: the same four rungs; the synthetic arm costs nothing beyond
        the analysis passes, since no curve work is needed to draw a Gaussian per
        curve. PREDICTED DISTRIBUTION: for the synthetic arm, measured delta*/sigma
        against n on log-log axes lies on a line of slope -1/2 within fitting error,
        and its intercept gives K empirically for the committed statistic -- which
        is a useful by-product, since K is otherwise unknown. TAIL CHECKS: the rung
        with the smallest n is where the asymptotic rate is least trustworthy and is
        reported with its residual called out; and any real functional whose
        distinct-value count fails to grow between rungs is excluded from the gamma
        fit and reported as discreteness-limited with its value set. TRANSFER
        ASSUMPTION: K is measured for this statistic, this null and this level, and
        transfers to no other; changing the statistic requires re-measuring it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED, AND THE RECORD IS EXPLICIT THAT ITS
      EXPONENTS DESCRIBE AN INSTRUMENT. INSTRUMENT EXPONENTS, WHICH ARE THE
      DELIVERABLE: enumeration cost p^{2} (beta, to be fitted, predicted 2.0 from
      the O(p^2) character-sum enumeration in harness/isogeny_class.py); standardized
      detection floor p^{-1/4 + o(1)} (gamma, to be fitted, predicted 0.25, with the
      o(1) coming from Brauer-Siegel's ineffective convergence and from L(1, chi_D)
      fluctuation); composition T proportional to (delta*/sigma)^{-8}. LADDER COST:
      four rungs of complete enumeration, dominated by the top rung, which at
      p = 2^15 is about 2^30 field operations in pure Python -- hours -- plus
      analysis passes that are negligible beside it, plus the Family 1 sweeps which
      need no curve work at all because the planting is additive on already-measured
      vectors. The one arm that must be watched is group_structure at O(p) lift_x
      calls per curve, i.e. O(p * n) = O(p^{3/2}) per class, which
      IDEA-20260807-efc8de already records as out of budget at p = 2^16; it is
      therefore excluded from the upper rungs and its exclusion is reported.
    memory_exponent: >-
      The enumeration holds O(p) character-table entries and O(n) curve records per
      class, so memory is O(p) and is the binding resource before time at the upper
      rungs on an 8 GB budget -- at p = 2^20 an O(p) table of Python objects is
      already gigabytes, which is a real part of why p_max is predicted low. The
      analysis itself is O(n + B) floats, kilobytes. Stated beside time as
      docs/claims-and-verification.md requires; the memory ceiling, not the time
      ceiling, may well be what p_max actually measures, and the run must report
      which of the two budgets was breached.
    best_known: >-
      There is no incumbent, and the absence is the point: NO record in this
      repository states a power exponent or a cost exponent in p for this lane.
      IDEA-20260807-efc8de gives delta* at one p in one functional's units;
      IDEA-20260807-caf061 gives the multiplicity penalty at one p;
      IDEA-20260807-c015f5 fits a decay slope in a WINDOW parameter W, not in p, and
      names the change-of-p test without performing it. So the incumbent value on
      gamma, on beta and on p_max is UNDEFINED rather than poor. The attack frontier
      is untouched and uncontested: parallel rho at 0.886*sqrt(N) group operations
      with O(1) memory, the automorphism-discounted variant on CM curves, and BSGS
      at sqrt(N) time and sqrt(N) memory.
    hidden_overhead: >-
      DISCLOSED, five items. (i) The o(1) in gamma is Brauer-Siegel's ineffective
      convergence plus L(1, chi_D) fluctuation, and at p of order 2^12 to 2^15 that
      "o(1)" is a substantial fraction of the exponent rather than a footnote --
      which is why gamma is fitted against MEASURED class sizes. (ii) beta measured
      from wall clock in pure Python absorbs interpreter and allocator behaviour and
      can read above 2 for reasons that are not the algorithm; operation counting is
      the primary measurement and the gap between the two betas is reported.
      (iii) p_max may be set by the 8 GB memory budget rather than by the 3600 second
      time budget, and the run must say which. (iv) The largest-class selection rule
      biases n upward, so the fitted gamma describes the campaign's own design and
      not typical classes. (v) The whole construction depends on complete
      enumeration, which is unavailable above p_max by definition, so the ladder can
      never be extended into the regime the crossover curve points at -- that
      circularity is real, is IDEA-20260807-f6137c's Closure 2 obstruction reappearing
      in a new coordinate, and this record names it rather than evading it.
    tradeoff_note: >-
      THE TRADEOFF IS RESOLUTION AGAINST COMPUTE AND ITS EXPONENT IS THE HEADLINE:
      T proportional to (delta*/sigma)^{-beta/gamma}, predicted -8, so a factor of 2
      in resolution costs 256 in compute and a factor of 10 costs 10^8. Two
      alternative purchases are named and priced against it, because a tradeoff with
      one axis is not a tradeoff. FIRST, raising the permutation budget B is FREE by
      comparison -- linear in B, and B is already 1000 to 2000 -- so if artifact
      preimage T1 is binding then the lane can buy resolution at exponent 1 rather
      than 8 and should, which the ladder decides. SECOND, shrinking the multiplicity
      family m from 37 to 14, which IDEA-20260807-caf061 already recommends, buys
      the equivalent of a factor 3.23 in p and therefore 10.4 in compute, at zero
      compute cost and a stated loss of exploratory reach. So the honest reading of
      the eighth power is not "this lane is stuck" but "scale is the most expensive
      way this lane can buy resolution and two cheaper purchases exist" -- and
      pricing all three against one another is the deliverable. Parallelization: the
      enumeration is embarrassingly parallel across x-coordinates and the ladder is
      parallel across rungs, so wall clock is reducible by a constant factor and the
      EXPONENTS are not, which is the whole reason exponents are the right object
      here.

  dominated_by: >-
    AS AN ATTACK: n/a, no attack is mounted and no attack cost axis is contested.
    Every row of the prime-field frontier -- parallel rho at 0.886*sqrt(N) time with
    O(1) memory, the automorphism-discounted variant on CM curves, BSGS at sqrt(N)
    time and sqrt(N) memory -- dominates trivially across time, memory and
    data/queries, because no discrete logarithm is computed.
    AS A MEASUREMENT, checked record by record rather than asserted.
    (1) IDEA-20260807-efc8de DOMINATES the single-point half outright: it defines
    delta*, specifies the Family 1 sweep that measures it, and this record uses that
    sweep unmodified as its per-rung measurement rather than inventing one. This
    record is an EXTENSION of efc8de along the scale axis and must be written as
    one; claiming otherwise would duplicate committed work. What efc8de does not
    contain is any exponent, any second p, or any budget ceiling.
    (2) IDEA-20260807-caf061 DOMINATES the multiplicity arithmetic: B > m/alpha - 1,
    the worked values, and the observation that correction raises delta*. This
    record supplies only the scaling of that penalty in p and the price in compute,
