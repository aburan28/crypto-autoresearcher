idea:
  id: IDEA-20261006-c98fb7
  question_id: RQ-GFPN-c01af8
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Ideal degree of the m=3 rescaled quotient equals 16 at the smallest
    admissible prime in [11, 40]
  class: measurement
  claim: >-
    Let p be the smallest prime with 11 <= p <= 40, distinct from 4111
    and from 16777291, such that the m = n = 3 rescaled 2-torsion
    quotient of the opened note KN-OPEN-9b4a2b is defined: the first
    monic irreducible cubic over F_p, and the first nonsingular
    double-odd curve y^2 = x(x^2 + a x + b) over F_{p^3} with b a
    nonsquare. The claim is that a completed FGLM degree of that
    quotient ideal equals 16. The negative observation is a completed
    degree that is an integer other than 16. A timeout, a missing
    solver, or an empty prime interval is unmeasured, not a degree.
    The shape count of unknowns versus equations is not the claim.
    No monomial-count ratio is claimed. The opened Gaudry exponent
    at n = 5 stays 8/5.
  mechanism: >-
    OBJECT FRAME. The object is the ideal of the rescaled quotient
    at m = 3, the same quotient whose degree the opened note records
    as 16 at the primes 4111 and 16777291. The operation is one FGLM
    degree computation at a smaller prime that those two rows do not
    contain. The projection keeps the degree and discards the basis.
    A completed degree other than 16 is the negative: the toy law did
    not survive the move to this prime. This record does not form a
    ratio of generator monomial counts and does not issue an oracle
    query.
  novelty_status: unverified
  citations:
