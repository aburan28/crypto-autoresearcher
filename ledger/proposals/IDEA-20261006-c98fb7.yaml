      verified_by: design session, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-081a58.yaml
  assumptions:
    - A completed degree means the solver returned an integer and the run was not a timeout or a crash.
    - The primes 4111 and 16777291 are excluded because the opened note already records them.
    - If no admissible curve exists for any prime in [11, 40], the cell is unmeasured.
  proof_search_map:
    not_applicable_reason: >-
      One degree at one small prime. Not a proof of the m = 5 degree
      and not a security claim about a deployed curve.
  predictions:
    - metric: fglm_degree
      direction: different
      minimum_effect: The completed degree equals 16.
  minimal_test:
    design: >-
      Freeze the prime, the cubic, and the curve by the lexicographic
      rules. Build the rescaled quotient exactly as the opened note
      describes it for m = 3. Compute one FGLM degree. Repeat the
      degree with a second solver, or with the same solver on the
      reversed basis, and require the two integers to agree. Do not
      score a monomial-count ratio.
    controls:
      - The second degree computation.
      - A check that b is a nonsquare and that the curve is nonsingular.
      - A check that the prime is inside [11, 40] and is neither 4111 nor 16777291.
    required_metrics:
      - the prime, the cubic, and (a, b)
      - the two degree integers
      - whether they agree
  falsification_conditions:
    - >-
      Both degree computations finish, they agree, and the integer is
      not 16. That is the negative observation.
    - The two degree computations disagree. The degree is void.
  confounders:
    - A timeout is not a large degree. It is unmeasured.
    - A degree of the raw summation ideal, rather than of the rescaled quotient, is a different object and voids the cell.
    - The figures 2^142 and 2^130 are not inputs.
  interpretation_limits:
    - One prime, m = n = 3. No transfer to m = 5 and no transfer to p = 2^64 - 2^32 + 1.
    - A degree of 16 at this prime does not close the opened m = 5 question.
    - This degree does not move the exponent 8/5.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The ideal degree of the m = 3 rescaled quotient is independent
        of the prime, inside the range where the quotient is defined,
        and therefore equals 16 at the smallest admissible prime in
        [11, 40], matching the opened values at 4111 and 16777291.
      rigorous_support: >-
        KN-OPEN-9b4a2b, opened, records 16 at those two primes and
        does not record this interval. The independence across a
        third prime is the pre-registered prediction, not a theorem.
      validation_plan:
        sampling: One frozen prime and one frozen curve.
        comparison: The completed degree against the integer 16.
        tail_check: A timeout stays unmeasured. It is not entered as a degree.
        parameters: m = n = 3, one prime in [11, 40], two agreeing computations.
  target_complexity:
    time_exponent: >-
      Unchanged. Opened KR-IC-46d822 gives 8/5 at n = 5 and 4/3 at
      n = 3. A degree of 16 moves neither.
    memory_exponent: >-
      Unchanged. One quotient ideal at one small prime.
    best_known: >-
      KN-OPEN-9b4a2b, opened, already states 16 at two larger primes.
      KR-IC-e2d81b, opened, holds the published degree-5 estimates.
      This record replaces neither.
    hidden_overhead: >-
      FGLM's cofactor in the degree is not separated from the integer
      16. No o(1) attack term is claimed.
    tradeoff_note: >-
      Not a time-memory tradeoff. The output is one integer.
