# IDEA-20261003-3ebad0
# Automorphism-order count for j=1728. Proposal only. Not approved.
idea:
  id: IDEA-20261003-3ebad0
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The automorphism order 4 exceeds the generic order 2 by 2
  class: measurement
  claim: >-
    The frozen automorphism order for j=1728 is 4. The frozen
    automorphism order for a generic curve is 2. Four exceeds two
    by 2. The product of the two orders is 8. Their sum is 6.
    Four divided by two is 2. The gap is a group order, not an
    ECDLP exponent and not a point-count ratio.
  mechanism: >-
    OBJECT FRAME. The object is the automorphism order. The
    operation set is reading that order, which is coordinate-dependent
    on the j-invariant and is not a translation of a curve point.
    Two generic orders are both 2, so that gap is 0. No point
    orbit is enumerated and no point count is taken.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a special j confers an advantage
        beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Equal hardness of isogenous curves is a different statement
        from these two automorphism orders.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two orders are frozen before they are subtracted.
    - No point is enumerated.
  proof_search_map:
    bottleneck: The order gap 2.
    baseline_embedding:
      parameter_slice: The orders 4 and 2.
      reproduction_check: >-
        Two readers subtract and must agree that 4 exceeds 2 by 2.
    observation_collision:
      observable: The order gap and the product.
      distinct_preimage_search: >-
        Reporting both orders as 2 drops the gap. Two generic
        orders make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The orders 4 and 2.
        predicted_gain: Integer gap. No point enumeration.
    quantifier_order: >-
      The orders are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The orders 4 and 2. Not a point-count ratio.
      nearby_object_control: >-
        Two generic orders. Both are 2, and the gap is 0.
    proof_obligations:
      - claim: The order for j=1728 is 4.
        responsibility: size
      - claim: The generic order is 2.
        responsibility: size
      - claim: The gap is not a point-count ratio.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: order_gap
      direction: different
      minimum_effect: Four exceeds two by 2.
  minimal_test:
    design: >-
      Subtract 2 from 4 and multiply 4 by 2. Do not enumerate a point.
    controls:
      - Two generic orders, whose gap is 0.
      - An independent count.
    required_metrics:
      - both orders
      - the gap
      - the product
  falsification_conditions:
    - The order for j=1728 is not 4.
    - The product of the two orders is not 8.
  confounders:
    - The automorphism order 6 of j=0 is a different integer.
  interpretation_limits:
    - A group order is not a walk length.
    - No transfer to a cryptographic curve.
    - This is not the order pair 6 and 2.
    - This is not a point-count ratio.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen automorphism order for j=1728 is 4, and the
        frozen generic order is 2.
      rigorous_support: >-
        No automorphism theorem is re-proved here. The count is a
        reading of two orders.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
