idea:
  id: IDEA-20260905-830138
  title: Typed auxiliary-input availability and divisor certificates
  class: representation
  claim: A symbolic supply certificate can distinguish a required auxiliary group input from an ordinary public
    point, and can record divisor eligibility separately from availability without performing a discrete-logarithm
    computation.
  mechanism: Track each permitted public token by its source-group type and a formal exponent label over a declared
    coefficient field. Ordinary group addition and known-scalar multiplication preserve the linear span of those
    labels. A pairing changes the codomain type and therefore cannot silently return a new source-group token. Required
    auxiliary labels can be compared with the supplied span using a formal membership or nonmembership witness under
    a bounded-degree symbolic model. Independently, a divisor certificate proves d divides r-1 or r+1 and records
    factorization completeness. The two certificates compose only as a conjunction of necessary input conditions.
    Symbolic nonmembership is a method ceiling in the stated algebraic model, not a general computational impossibility
    theorem.
