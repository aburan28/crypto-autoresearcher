idea:
  id: IDEA-20260816-a54b82
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: 'Every step of Keccak-f[1600] except iota commutes with cyclic translation along the lane
    axis, so the entire symmetry decay of an internal differential is injected by twenty-four known
    constants: compute that injection and its linear spread as an exact per-round active-chi-row cost
    curve'
  class: theory
  claim: '(A) STRUCTURAL. Write tau_t for cyclic rotation of the 5x5x64 state by t along z. Directly
    from the FIPS 202 step definitions, theta (column parity plus a z-shift by one), rho (per-lane
    rotation by a constant), pi (a permutation of lane coordinates that does not touch z) and chi
    (a 5-bit map applied independently to every row at fixed (y,z)) are all z-translation-equivariant:
    each commutes with tau_t for every t dividing 64. iota does not, because it XORs a fixed non-periodic
    constant RC_i into lane (0,0). Therefore the symmetric subspace S_t = ker(A -> A XOR tau_t A),
    of dimension 25*gcd(t,64), is mapped into itself by theta, rho, pi and chi, and is displaced only
    by iota. (B) COMPUTABLE CONSEQUENCE. For a state A in S_t, one full round produces a deviation
    D_1 = eps_i^{(t)} := (RC_i XOR tau_t RC_i) placed in lane (0,0) and nothing else. The deviation
    thereafter obeys D_{r+1} = L(D_r) XOR chi_correction(D_r, X_r) XOR eps_{i+r+1}, where L = pi.rho.theta
    is an explicit 1600x1600 GF(2) matrix and chi_correction is the only data-dependent term. The
    quantity this proposal computes is the number of ACTIVE CHI ROWS per round -- rows (y,z) on which
    D_r is nonzero -- under the exactly-linear surrogate in which chi is replaced by its identity
    action on differences, together with the same count under a chi-differential-branching upper and
    lower envelope. That curve is exact linear algebra over a fixed matrix, requires no search, no
    solver, and no heuristic, and is reproducible to the bit. (C) WHAT IS PREDICTED. The cumulative
    active-row count, converted to a degrees-of-freedom charge by the per-row cost measured in the
    companion chi-DDT contract, is offered as a candidate PREDICTOR of the round index at which internal-differential
    maintenance stops being affordable against a 2^(n/2) generic budget. (D) WHAT IS NOT CLAIMED.
    No attack, no collision, no speedup, and nothing whatsoever about 24-round SHA-3, SHAKE, or any
    deployed use. It is NOT claimed that the active-row curve is the correct cost model, that the
    birthday crossing is the operative frontier criterion, or that any published round count is or
    is not explained by it. It is not claimed that this structural observation is new; it is claimed
    only that this repository has never computed the curve, and that the curve is computable here
    without reading any external result.'
  mechanism: 'STAGE 1: build a bit-exact pure-Python Keccak-f[1600] from the FIPS 202 step definitions
    and cross-check the full-round permutation against hashlib''s sha3_* outputs on the standard empty-message
    and multi-block digests, so the step decomposition is validated before anything is measured from
    it. STAGE 2: materialise L = pi.rho.theta as a 1600x1600 GF(2) matrix by applying it to the 1600
    unit vectors, and verify L(tau_t v) = tau_t L(v) for all t in {1,2,4,8,16,32} and 10^4 random
    v -- this is the falsifiable form of claim (A) for the linear part. STAGE 3: verify chi''s equivariance
    the same way by direct evaluation on random states, and verify that iota is the unique step for
    which equivariance fails, recording the exact failure vector. STAGE 4: compute eps_i^{(32)} =
    RC_i XOR tau_32 RC_i for all 24 published round constants, exactly, and record its Hamming weight
    and z-support per round. Because RC_i is supported only on z in {0,1,3,7,15,31,63}, the only pair
    of support positions differing by 32 is (31,63), so the weight has a forced arithmetic form the
    contract records rather than fits. STAGE 5: iterate D_{r+1} = L(D_r) XOR eps under three chi treatments
    -- identity-on-differences (lower envelope), full one-bit-per-active-row expansion (upper envelope),
    and the exact chi difference set computed from the 5-bit map -- and emit active-row count, Hamming
    weight and z-support size per round for r = 1..12. STAGE 6: run the identical pipeline on the
    null constant families. REFUTATION: the claim is refuted at stage 2 or 3 if equivariance fails
    for a step other than iota, and the predictor arm is refuted if the active-row curve saturates
    at 320 before the round index where any plausible cost crossing sits, since a saturated curve
    has no discriminating power.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from the repository root: `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/
      docs/`, which returned exactly four proposal files (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc,
      IDEA-20260809-ce875b, IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), six goal records
      including GOAL-SHA3-001, two decisions (DEC-20260814-404d63, DEC-20260810-9942ea) and a block
      of KN-LIT files. Then ran a per-noun count over ledger/proposals/ and ledger/hypotheses/ for:
      translation-invariant (4 files, all ECDLP/AES: IDEA-20260807-cbe8c1, IDEA-20260805-62359f, IDEA-20260811-d7856a,
      H-AES-ecf3ad), symmetry-decay (0), "internal differential" (0), sponge (2: IDEA-20260807-c4f1fc,
      IDEA-20260808-95a21c), "invariant subspace" (2: IDEA-20260813-c9bec2 on TCitH MQ, IDEA-20260808-ae175e
      on MAYO MinRank), "chi step" (0), "rate/capacity" (0). Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001
      header, KN-TECH-080 in full, docs/inventor-protocol.md sections 1-8, and the headers of KN-TECH-066,
      KN-TECH-073, KN-TECH-074, KN-TECH-056. Additionally grepped ledger/proposals and ledger/hypotheses
      for `theta` and `lane` (203 and 528 hits) and inspected the hits, which are ECDLP theta-notation
      and the substring inside `plane`/`Galois`; none is a Keccak step.'
    results: No record in ledger/proposals/, ledger/hypotheses/, or experiments/ computes any quantity
      over Keccak-f[1600]. The only substantive Keccak mention in the whole ledger is IDEA-20260807-c4f1fc,
      which observes that no record treats a hash function or unkeyed permutation as a cryptanalytic
      target and explicitly declines to open a generic Keccak lane; and IDEA-20260805-5194f9, which
      states that Keccak is modelled as a random oracle and no property of it is used. RQ-SHATHREE-cd2cb2
      names the symmetry-decay curve as its tracked object but no proposal has been filed against
      it. KN-TECH-066 catalogues internal differentials as a technique and is cited by zero ledger
      records.
    verdict: 'UNVERIFIED. This program cannot read external literature and asserts nothing about what
      it contains. NEW relative to this repository: the computed object (per-round active-chi-row
      count of the iota-injected deviation under the exact L matrix) exists nowhere in the ledger.
      ASSEMBLED FROM KNOWN PARTS: z-translation equivariance of theta/rho/pi/chi is a direct rereading
      of the FIPS 202 step definitions and is presumed standard; the internal-differential frame is
      KN-TECH-066; the cost-curve-as-predictor framing is taken verbatim from RQ-SHATHREE-cd2cb2''s
      own targets. The contribution claimed is computation and control design, not discovery of the
      symmetry.'
  object_first_candidate:
    tracked_object: The deviation vector D_r = A_r XOR tau_t(A_r) in GF(2)^1600, for an input A_0
      chosen in S_t, followed round by round; and the derived integer sequence (number of active chi
      rows, Hamming weight, z-support size) that D_r induces.
    lossiness: 'D_r discards the entire symmetric component of the state: the map A -> A XOR tau_32
      A has a kernel of dimension 800, so exactly half the state information is thrown away and A
      cannot be reconstructed from D. The discard is compatible with theta, rho and pi because those
      are GF(2)-linear and commute with tau_32, so D propagates deterministically through them with
      no reference to the discarded half. It is NOT fully compatible with chi: chi''s action on D
      depends on the symmetric part, which is precisely why chi is the only place a cost is paid,
      and this contract measures that dependence rather than assuming it away.'
    propagation: One round acts as D -> L(D) XOR c(D, A) XOR eps_{i+1}, where L = pi.rho.theta is
      a fixed GF(2) matrix computed once, eps_{i+1} = RC_{i+1} XOR tau_t RC_{i+1} in lane (0,0) is
      a fixed known vector, and c(D, A) is supported only on rows where D is already nonzero (chi
      is row-local), so the nonlinear correction can enlarge the active-row set only through the subsequent
      L.
    survival_score: Stated as the round index at which the active-row count first exceeds half the
      320 available rows and at which z-support first equals all of Z/64; both are read off the computed
      curve rather than asserted. The pre-run expectation, recorded before computing, is saturation
      somewhere in rounds 3-6 for the upper envelope; if saturation occurs at round 1 or 2 the object
      is measured to dissolve immediately and the predictor arm dies with it, which is a usable measured
      obstruction.
  null_object_control: 'Two nulls, both executed in the same invocation as the signal arm by the same
    code path with only the constant array swapped. NULL-A: 24 round constants drawn uniformly at
    random from the same 7-bit support set {z = 2^j - 1}, 1000 independent draws. NULL-B: 24 constants
    drawn uniformly from all of GF(2)^64 in lane (0,0), 1000 draws. For the signal arm to mean anything,
    the FIPS 202 curve must fall outside the central 90 percent of the NULL-A distribution on at least
    one of the three reported statistics at some round r <= 8. If the FIPS curve is indistinguishable
    from NULL-A, the recorded result is a controlled null: the decay is a property of the linear layer
    and the support shape, and the specific standard constants carry no information about it.'
  discriminated_from:
  - IDEA-20260807-c4f1fc (SLH-DSA hash-primitive gap) -- that proposal argues no record treats a permutation
    as a target and deliberately declines to open a Keccak lane; this one opens exactly the lane it
    declined, with a specific computed object rather than a coverage argument.
  - IDEA-20260805-5194f9 (SelfTargetMSIS two-arm audit) -- shares the 'compute a forced value with
    zero search' shape but its object is a lattice/hash cost comparison in ML-DSA, not a state-space
    subspace under a permutation.
  - H-AES-ecf3ad and the AES r=5..7 measured-effect lane -- also a symmetric-primitive round-decay
    measurement, but its object is byte-algebraic invariants under an S-box factoring as L.Inv, and
    its round function has no translation group at all.
  - Generic differential trail search over Keccak -- this contract runs NO search; the curve is a
    matrix iteration over a fixed permutation, and a solver never starts.
  - Fitting a decay model to a published frontier -- explicitly forbidden by RQ-SHATHREE-cd2cb2's
    third constraint and structurally impossible here, since the computation never sees a published
    round count.
  assumptions:
  - The FIPS 202 step definitions as implemented from the standard text are correctly transcribed;
    validated against hashlib digests before use.
  - Active chi rows are a meaningful unit of internal-differential maintenance cost -- this is the
    assumption the companion chi-DDT contract measures rather than assumes.
  - The relevant translation subgroup is a subgroup of Z/64 acting on z, and not some larger symmetry
    of the state.
  - Replacing chi by its identity action on differences is a genuine lower envelope on active-row
    growth rather than an approximation of unknown sign.
  predictions:
  - metric: number of steps among {theta, rho, pi, chi, iota} whose commutation with tau_32 fails
      on 10^4 random states
    direction: different
    minimum_effect: 1
  - metric: Hamming weight of eps_i^(32) = RC_i XOR tau_32 RC_i, per round
    direction: different
    minimum_effect: forced to be an even integer in {0,2,4,6,8,10,12} for every i, because the RC
      support {0,1,3,7,15,31,63} contains exactly one pair differing by 32
  - metric: round index at which active-chi-row count first exceeds 160 under the upper envelope
    direction: lower
    minimum_effect: 8
  - metric: separation of the FIPS active-row curve from the NULL-A 90 percent band at some round
      r <= 8
    direction: different
    minimum_effect: no pre-commitment; the sign and size of this separation is the unknown the contract
      exists to measure, and pre-committing would prejudge the controlled-null outcome
  minimal_test:
    design: The cheapest discriminating measurement is stages 2-4 alone and costs minutes of CPU.
      Build L as a 1600x1600 GF(2) matrix by 1600 unit-vector applications of pi.rho.theta. Test L.tau_t
      = tau_t.L for t in {1,2,4,8,16,32} exactly by matrix comparison -- this is a deterministic yes/no
      on the linear half of claim (A) and needs no sampling. Test chi's equivariance by evaluating
      chi(tau_t A) XOR tau_t chi(A) on 10^4 random states for each t; any nonzero output falsifies.
      Test iota's non-equivariance the same way and record the exact failure vector, which should
      equal RC_i XOR tau_t RC_i in lane (0,0). Then compute eps_i^(32) for all 24 constants and report
      weights. If any of these fails, the entire proposal collapses at a cost of one afternoon and
      the ledger records a precise structural correction. If all pass, the deviation iteration in
      stage 5 is a further few minutes and the nulls are 2000 repetitions of the same few minutes.
    controls:
    - 'NULL-A: same support shape, random constant values, 1000 draws, identical code path.'
    - 'NULL-B: fully random lane-(0,0) constants, 1000 draws.'
    - 'Zero-constant control: all RC_i set to zero, which must give an identically zero deviation
      curve for all rounds -- a hard correctness check on the whole pipeline.'
    - 'Single-constant isolation: inject eps only at round 0 and zero thereafter, to separate the
      fresh-injection contribution from the propagated contribution.'
    - 'Independent-implementation control: recompute L and the round-0 deviation with a second, differently-written
      state layout (x+5y lane ordering versus [x][y] array) and require bit-identical output.'
    required_metrics:
    - per-step equivariance failure vector for each of theta, rho, pi, chi, iota and each t | 64
    - Hamming weight of eps_i^(32) for i = 0..23
    - z-support of eps_i^(32) for i = 0..23
    - active chi row count per round r = 1..12, under each of three chi treatments
    - Hamming weight of D_r per round
    - z-support size of D_r per round
    - NULL-A and NULL-B empirical distributions of every curve statistic
    - wall-clock and matrix-rank diagnostics for the L construction
  falsification_conditions:
  - Any step other than iota fails to commute with tau_t for some t | 64 -- the structural claim (A)
    is wrong as stated and the whole framing is rebuilt.
  - eps_i^(32) is zero for all 24 rounds, which would mean t = 32 injects no asymmetry at all and
    the chosen translation is the wrong one.
  - The active-row curve saturates at 320 by round 2 under every chi treatment, leaving no dynamic
    range for a predictor.
  - The FIPS 202 curve lies inside the NULL-A central 90 percent band at every round r <= 8 on every
    statistic -- recorded as a controlled null, not as a finding.
  - The zero-constant control produces a nonzero deviation curve, which falsifies the implementation
    rather than the mathematics and voids the run.
  - The two independent state layouts disagree on any bit of L.
  confounders:
  - Lane-ordering and bit-endianness conventions in FIPS 202 are a classic transcription trap; a wrong
    convention can produce a plausible-looking but meaningless curve, which is why the hashlib cross-check
    runs first.
  - Choosing the chi envelope treatment after seeing the curve would let the predictor be tuned to
    whatever answer is wanted; all three treatments are declared before the run.
  - Active-row count is a proxy for cost, and a proxy that happens to correlate with round index for
    trivial reasons (any spreading map saturates) rather than for Keccak-specific reasons -- which
    NULL-A exists to catch.
  - The random-constant null shares the linear layer with the signal arm, so it controls the constants
    but not the layer; NULL-B does not fix this either, and the separate random-permutation contract
    is required to close it.
  interpretation_limits:
  - A computed decay curve predicts nothing by itself; it becomes a predictor only if the per-active-row
    cost is independently measured and the crossing criterion is independently justified.
  - Round-reduced only. Extrapolating the curve to 24 rounds is forbidden as a claim and admissible
    only as a clearly labelled conditional projection, per RQ-SHATHREE-cd2cb2's claim_tier_ceiling.
  - The curve is computed for a chosen translation t; results for t = 32 say nothing about other t
    without recomputation.
  - A controlled-null outcome is informative about the constants, not about SHA-3's security, and
    must not be reported as either good or bad news for the standard.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. The computation itself is O(1) in any security
      parameter: a single 1600x1600 GF(2) matrix build plus 12 iterations, i.e. under 2^25 bit operations
      total.'
    memory_exponent: No attack memory exponent is claimed. The measurement holds one 1600x1600 GF(2)
      matrix, about 320 KiB packed, plus 24 constants.
    best_known: 'The incumbent is the published round-reduced SHA-3 internal-differential collision
      frontier as described (not read in primary text) in RQ-SHATHREE-cd2cb2''s provenance block.
      This contract does not compete with it: it produces no collision and no complexity.'
    hidden_overhead: 'The human cost is transcription correctness of FIPS 202 conventions, which is
      where days go and where the silent failure mode lives. The lower-order term that hides is the
      chi treatment: the gap between the identity-on-differences envelope and reality is exactly the
      unmeasured quantity, and calling the envelope ''the curve'' would smuggle in the answer.'
  dominated_by: 'n/a (no result claimed). Checked explicitly: this contract emits no time row, no
    memory row, and no data/query row, so it does not appear on any Pareto frontier and cannot dominate
    or be dominated. Any collision that a later contract produces at round r would be dominated by
    the published attack at the same r on time, and this record makes no claim otherwise.'
  sota_delta: no attack; conceptual/measurement contribution only. The only numbers produced are dimensions,
    Hamming weights and active-row counts over a fixed permutation, none of which is comparable to
    an attack complexity.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that theta/rho/pi/chi commute with tau_t and iota does not:
    0.95, because it follows by inspection from the step definitions and the only risk is a transcription
    error, which stage 1 catches. Part (B), that the active-row curve is computable exactly and has
    usable dynamic range over rounds 1-8: 0.7, with the main risk being immediate saturation. Part
    (C), that the curve separates from NULL-A: 0.4, because a random constant of the same support
    shape may well drive an indistinguishable curve. Part (C) as an actual frontier predictor: 0.15,
    since it also requires the per-row cost and the crossing criterion to hold, neither of which this
    contract establishes.'
