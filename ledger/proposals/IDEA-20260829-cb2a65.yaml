idea:
  id: IDEA-20260829-cb2a65
  question_id: RQ-ECDLP-001
  added: '2026-08-29'
  title: >-
    THE RANK INSTRUMENT IS THE WRONG SHAPE, AND THAT IS WHY 12 GiB WAS NOT ENOUGH:
    column-chunked dense M4RI elimination costs memory proportional to
    rank times rows, which at the 768,212-column monomial space of the failed
    GOAL-DREG-001 n=15 D=6 rung is tens of gigabytes no matter how the columns are
    chunked, whereas a black-box Krylov rank costs memory proportional to the
    NUMBER OF NONZEROS -- and the cheapest way to find out whether that is true
    here costs zero rank computations, because the nonzero count can be read off
    the generator without building a matrix at all
  class: tooling

  claim: >-
    (A) THE DIAGNOSIS, READ OFF THE COMMITTED SOURCE RATHER THAN INFERRED. The
    program's exact GF(2) Macaulay rank instrument
    (h012c_block_m4ri.chunked_block_m4ri, driven by ctrlb_execute.py) sweeps
    columns in chunks and maintains a persistent PIVOT CARRIER across chunks; its
    own audit checks assert that the number of carrier pivots equals rank_acc.
    A carrier holding r pivot rows over an n-column space costs r times n bits
    regardless of the chunk width, so column chunking bounds the WORKING SET but
    not the ACCUMULATOR. At n = 768,212 columns, a rank of order 7x10^5 gives a
    carrier of about 7x10^5 times 7.7x10^5 divided by 8 bytes, i.e. about 67 GB.
    An 8 GiB contract, and a 12 GiB host ceiling, are therefore not merely tight
    -- they are two orders of magnitude away, and no chunk-width tuning closes
    that gap. THE OBSERVED FAILURE IS CONSISTENT WITH THIS AND IS NOT EXPLAINED BY
    IT: all six runs of the 2026-08-28 n=15 D=6 attempt terminated as
    resource_exhaustion at peak RSS 11.73 and 12.22 GiB with the rank kernel NEVER
    INVOKED, so no rank value exists and none is asserted here. That is an
    INFRASTRUCTURE STOP under AGENTS.md rule 3 and is never negative mathematical
    evidence about d_reg, about H-DREG-001, or about anything else.
    (B) THE PROPOSED SHAPE CHANGE. Compute the rank as a BLACK BOX: never form or
    store an echelon basis, and access the matrix only through matrix-vector
    products. With Wiedemann-style Krylov rank under Kaltofen-Saunders
    preconditioning, memory is O(nnz) for the matrix plus O(n) words of vectors,
    and time is O(n) matrix-vector products. Predicted memory at the failed cell,
    IF the matrix has d nonzeros per row and R rows: about 4 times R times d bytes
    for column indices plus a handful of n-bit vectors. At R about 10^6 and
    d about 30 that is about 120 MB plus 1 MB of vectors -- a predicted reduction
    of order 500x against the carrier, and comfortably inside an 8 GiB contract.
    (C) THE ZERO-RANK-COMPUTATION PRE-TEST, WHICH IS THE ACTUAL PROPOSAL. The
    entire viability of (B) turns on ONE unmeasured number: the nonzero density d
    of the D = 6 Macaulay rows at n = 15. That number can be obtained by streaming
    the existing generator and COUNTING, without allocating any matrix, in a run
    whose peak RSS is bounded by one row at a time. PRE-REGISTERED DECISION RULE,
    committed before the count is taken: d/n at most 0.001 makes the black-box
    route viable and the instrument worth building; d/n at least 0.05 makes it
    strictly worse than dense elimination and KILLS this proposal outright;
    between those the measured crossover decides and is reported as such. This is
    the cheapest possible discriminator and the most likely single outcome of the
    whole record is a clean negative.
    (D) WHY THIS IS FILED UNDER RQ-ECDLP-001 AND VALIDATED THERE FIRST. A new rank
    kernel must be calibrated against a system whose answer is known
    independently, and RQ-ECDLP-001's S_3 systems supply exactly that: the
    companion proposal IDEA-20260829-bdca13 derives, from the Chinese Remainder
    Theorem, that the toy S_3 quotient ring is the product of |Z| copies of F_p,
    so the Macaulay rank at each degree has a CLOSED FORM computed from the group
    law with no linear algebra at all. Calibrating a black-box rank kernel against
    a closed form -- rather than against another implementation of the same
    routine -- is the strongest available correctness check, it costs seconds, and
    it is the reason this tooling proposal belongs to this question.
    (E) BOTH OUTCOMES ARE DELIVERABLES. Viable: the DREG-class memory wall is a
    tooling artifact with a named replacement, and the n=15 and n=18 rungs that
    are currently recorded as INFRA-LIMITED become reachable within contract.
    Not viable: the wall is a genuine density property of the boolean Semaev
    Macaulay matrices at D = 6, which is a measured structural fact about those
    systems that nobody currently has, and it retires the black-box route by
    argument instead of by fatigue.

  mechanism: >-
    THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST. The tracked object is the
    SPARSITY PATTERN of the Macaulay matrix -- which columns each row touches,
    with all coefficient values discarded -- together with the Krylov sequence of
    bilinear forms that a black box exposes. This is catalogue object O5 reused
    for an INSTRUMENT rather than for an attack, and that reuse is disclosed
    rather than presented as new. It is genuinely lossy: over GF(2) the pattern IS
    the matrix, so the honest lossy object here is the Krylov sequence, which
    collapses an R by n matrix to 2n field elements and from which the matrix
    cannot be recovered. It is lossy COMPATIBLY because rank is determined by the
    minimal polynomial of a preconditioned matrix, and the minimal polynomial is
    determined by the Krylov sequence -- so the retained part propagates
    deterministically under exactly the operation (matrix-vector product) the
    method performs. A projection that would FAIL the test, and is not used: the
    row echelon form, which loses nothing about the row space and is precisely the
    object whose storage is the problem.
    WHY MEMORY, NOT TIME, IS THE BINDING CONSTRAINT AND WHY THE FIX IS STRUCTURAL.
    Dense elimination on an n-column space costs Theta(rank times n) bits of
    accumulator and Theta(rank squared times n) bit operations; at n about
    7.7x10^5 the time is also out of reach (of order 10^17 bit operations), so the
    current instrument is not merely memory-blocked at this cell -- it is blocked
    on both axes, and a larger machine would not rescue it. Black-box Krylov
    changes both exponents at once: memory Theta(nnz) and time
    Theta(n times nnz). At d = 30 that is 2 times 7.7x10^5 times 3x10^7, about
    4.6x10^13 elementary operations, which with 64-way bit packing and 14 cores is
    hours, not centuries -- an estimate that MUST be measured and is a required
    metric, not an assertion.
    THE GF(2) DIFFICULTY, NAMED RATHER THAN GLOSSED. Wiedemann's analysis is
    weakest over small fields: random preconditioners drawn from a two-element
    field do not give the same probability guarantees as over large fields, and
    the standard remedies are (i) working over a small extension GF(2^k) for the
    scalar sequence, which multiplies memory by k, or (ii) BLOCK Wiedemann with
    block size 64, which is also the natural bit-packing width and so costs
    nothing extra in memory while raising the success probability. The proposal
    selects (ii) as the primary route and (i) as the fallback, and treats the
    success probability as a measured quantity via repeated trials with fresh
    preconditioners rather than as a quoted bound.

