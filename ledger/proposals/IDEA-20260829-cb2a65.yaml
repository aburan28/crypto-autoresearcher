      edited.
    - >-
      The new kernel fails to reproduce 156520 or 138573 exactly. It is not
      computing rank; nothing about n = 15 may be said.
    - >-
      The deletion mutation does not lower the rank by exactly 1. The kernel is
      not tracking column deletions and its ranks are not trustworthy.
    - >-
      Measured failure rate above 10% per trial. Unusable under the DREG lane's
      exact-rank admissibility rule, and the record says so rather than proposing
      to relax the rule.
    - >-
      The peak-RSS formula misses by more than 25% anywhere in the calibration
      range. The n = 18 feasibility prediction is withdrawn.
    - >-
      The dense control shows no disadvantage. The kernel is not exploiting
      sparsity and its sparse-case numbers mean nothing.
    - >-
      Everything passes. A calibrated, memory-predictable, probabilistic rank
      instrument exists, with a formula that says in advance which ladder rungs fit
      in contract -- and the currently INFRA-LIMITED rungs become a budget
      question rather than a wall.

  confounders:
    - >-
      DENSITY IS CELL-DEPENDENT. Nonzero density at D = 6 n = 15 need not predict
      D = 6 n = 18 or D = 7. The count is taken per cell and no cell's density is
      extrapolated to another; the memory formula is fitted across measured cells
      only and its extrapolation range is stated.
    - >-
      FILL-IN HAS NO ANALOGUE HERE, WHICH CUTS BOTH WAYS. Black-box methods never
      fill in, which is their advantage; they also never exploit structure that
      elimination orderings can find, so on a matrix with excellent separators
      dense-with-good-ordering could still win. Catalogue A1-9's finding that
      random m-uniform hypergraphs have treewidth Theta(B) suggests separators are
      absent, but that is about relation matrices, NOT Macaulay matrices, and the
      transfer is not made here.
    - >-
      PROBABILISTIC VERSUS EXACT IS A CONTRACT ISSUE, NOT A TUNING ISSUE.
      GOAL-DREG-001's objective admits evidence only from full-column exact ranks,
      the graded pivot-degree Hilbert function, or the q-to-s collapse. A Monte
      Carlo rank may not satisfy "exact" as that goal's Coordinator reads it. This
      must be settled by that goal's owner BEFORE any DREG cell is run, and this
      record does not presume the answer.
    - >-
      RSS IS NOT THE ONLY MEMORY. Page cache, temporary files and the SageMath
      TMPDIR issue already recorded in GOAL-DREG-001's infra_note (a host ENOSPC
      event) can dominate. Peak RSS, peak virtual size and temporary disk are all
      reported.
    - >-
      IMPLEMENTATION QUALITY CONFOUNDS THE COMPARISON. A slow new kernel versus a
      tuned M4RI kernel measures programming effort, not asymptotics. The
      comparison reported is MEMORY, where the difference is structural, and the
      time comparison is reported with an explicit caveat that it is
      implementation-bound.
    - >-
      CROSS-BRANCH PROVENANCE. The diagnosis is anchored on figures held on a
      branch this worktree does not carry. Reading them requires a fetch or
      checkout, and a session that skips Stage 0c would be building on a
      second-hand pointer -- which is exactly the failure mode this record
