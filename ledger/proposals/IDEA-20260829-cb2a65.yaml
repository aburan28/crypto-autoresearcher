  heuristic_assumptions:
    - id: H1
      statement: >-
        The GF(2) Macaulay matrices generated by the boolean chained Semaev
        pipeline at D = 6 have nonzero count per row bounded by a quantity that
        grows polynomially in the number of variables and is independent of the
        number of columns, so that nnz is O(rows times polylog) rather than
        Theta(rows times cols).
      rigorous_support: >-
        The RIGOROUS ingredient is structural and elementary: a Macaulay row is a
        single input polynomial multiplied by a single monomial, so its support
        size is exactly the support size of that input polynomial, before any
        reduction by field equations. Boolean reduction can only merge terms,
        never create them, so the row's nonzero count is bounded by the input's
        term count -- a quantity fixed by the system generator and completely
        independent of the D = 6 monomial space size. The CLASSICAL STATEMENT
        IMITATED is the standard sparsity assumption underlying every sparse-FGLM
        and block-Wiedemann application to polynomial system solving: that
        Macaulay matrices inherit the sparsity of their generators. The GAP: the
        boolean chained Semaev system's input polynomials may themselves be dense
        in the relevant variables, in which case the assumption fails outright --
        which is precisely what Stage 0 measures and why no budget is committed
        before it.
      validation_plan: >-
        SAMPLE: stream 100% of the rows of the n = 15 D = 6 system (not a sample
        -- an exhaustive count), plus the n = 12 D = 6 system whose rank is
        already committed, plus at least two smaller cells, so the density is
        measured across at least a 100x range of column counts. COMPARISON: the
        term counts of the generating polynomials themselves, computed
        independently from the generator's inputs; the row density must not exceed
        the input term count. TAIL CHECKS: the maximum row density (not the mean)
        against the memory formula, since peak memory is driven by the tail; and
        the histogram's upper decile reported separately, because a heavy tail can
        defeat a mean-based contract. SAMPLED PARAMETERS RECORDED: n, D, t, ti,
        seed, generator commit, rows, columns, nnz, per-row histogram. TRANSFER:
        NONE. No cell's density is extrapolated to another and the memory
        formula's fitted range is stated with every prediction it is used for.
    - id: H2
      statement: >-
        For the preconditioned matrices arising here, block Wiedemann with block
        size 64 over GF(2) returns the exact rank with probability at least
        1 minus epsilon per trial, with epsilon small enough that a small constant
        number of trials makes the maximum over trials correct with high
        probability.
      rigorous_support: >-
        THE RIGOROUS INGREDIENT IS NOT QUOTED HERE, DELIBERATELY. Wiedemann's
        analysis is weakest over small fields, the strengthened preconditioner
        analysis lives in literature this session did not open (arXiv:1607.04514
        and the ISSAC 2006 block Wiedemann rank algorithm), and transcribing a
        probability bound from memory would be exactly the fabrication AGENTS.md
        rule 5 forbids. The assumption is therefore stated as a purely empirical
        one whose only support in this record is measurement. The CLASSICAL
        STATEMENT IMITATED is the generic behaviour of random preconditioners over
        large fields; the gap to GF(2) is the whole risk and is named.
      validation_plan: >-
        SAMPLE: at least 30 independent preconditioner draws on each of at least 5
        cells whose rank is known independently (the S_3 closed-form ladder and the
        committed n = 12 cell). COMPARISON: the empirical failure rate against a
        Clopper-Pearson 95% interval; the distribution of returned ranks (a
        black-box rank failure is a strict UNDERESTIMATE, so the maximum over
        trials is the estimator and its bias is one-sided and reportable).
        TAIL CHECK: the worst single trial per cell, reported individually and not
        averaged. If any cell shows a failure rate above 10%, the method is
        reported unusable for that cell class rather than rescued by more trials.
        TRANSFER: the measured rate on calibration cells is NOT assumed to hold on
        the n = 15 cell; that would have to be measured there too, and the fact
        that it cannot be (no independent rank exists at n = 15) is stated as the
        residual and is the strongest argument for keeping a dense cross-check at
        the largest cell that still fits.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this is an instrument and it attacks nothing.
      Instrument complexity, stated exactly and comparatively for an R by n GF(2)
      matrix of rank r with z nonzeros: column-chunked dense elimination costs
      Theta(r squared times n) bit operations; block-Wiedemann rank costs
      Theta(n times z) bit operations. At the failed cell (n about 7.7x10^5, r
      assumed of the same order, z about 3x10^7 IF H1 holds) that is about
      4.6x10^17 versus about 2.3x10^13, a predicted factor of order 10^4 --
      entirely conditional on H1 and required to be measured before it is quoted
      anywhere.
    memory_exponent: >-
      Dense chunked: Theta(r times n) bits for the pivot carrier, independent of
      chunk width -- about 67 GB at the failed cell. Black-box: Theta(z + n)
      words -- about 120 MB at the same cell IF H1 holds. Predicted factor of
      order 500. This is the axis the proposal exists for, and the exact
      accounting is frozen as the formula c1 times nnz plus c2 times n before any
      prediction is made.
    best_known: >-
      For exact GF(2) rank of large sparse matrices the standing methods are dense
      M4RI elimination (this program's current instrument, measured at about 7 GB
      peak at n = 12 D = 6) and black-box Krylov methods. This record proposes no
      new algorithm and claims no improvement over the published state of sparse
      linear algebra; it proposes applying the second family where the first is
      being used, and measuring whether it fits.
    hidden_overhead: >-
      DISCLOSED. (i) The entire time and memory advantage is conditional on H1,
      which is UNMEASURED, and the proposal's first stage exists to kill the record
      if H1 is false. (ii) The rank returned is PROBABILISTIC, a strictly weaker
      claim tier, and the DREG lane's admissibility rule may not accept it at all.
      (iii) The constant factors of a fresh kernel against a tuned M4RI are
      unknown and could be 10x or worse, which is why the reported comparison is
      memory and not time. (iv) The n=15 figures anchoring the diagnosis are
      unverified by the authoring session and sit on an unmerged branch.
    tradeoff_note: >-
      This is a genuine time-memory trade in the instrument, not in an attack:
      black-box rank buys a factor of order 500 in memory and pays with a
      probabilistic answer and a serial Krylov dependence. Parallelisation: the
      matrix-vector product parallelises across rows with near-linear speedup on
      14 cores, but the Krylov iteration is inherently serial in the index, so the
      Amdahl ceiling sits at the sequence length 2n/64 and the achievable speedup
      is bounded by the matvec's own parallel fraction. Block size 64 doubles as
      the bit-packing width, so the blocking that raises the success probability
      is free in memory -- the one place where the two constraints cooperate.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST EVERY FRONTIER ENTRY ENUMERATED IN CATALOGUE A1-13.
    As an ATTACK: n/a (no result claimed) -- this record mounts no attack, so every
    ECDLP frontier row (rho, multi-target rho, BSGS, vOW, the preprocessing
    frontier, MITM index calculus, two-term index calculus) dominates it trivially
    on time, memory and data/queries, and none is relevant to what it does. As an
    EXACT-RANK INSTRUMENT: dominated on CLAIM TIER by the incumbent chunked
    block-M4RI kernel, which returns a deterministic exact rank where this returns
    a probabilistic one, and which is already calibrated and already has committed
    evidence behind it; dominating the incumbent on MEMORY by a predicted factor
    of order 500 and on TIME by a predicted factor of order 10^4, both conditional
    on the unmeasured density H1 and both required to be measured before quoting.
    As sparse-linear-algebra research: fully dominated by the published black-box
    literature, from which nothing is claimed as new. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent, no mathematical result.
    Instrument delta, stated as numbers and all conditional on the Stage 0 density
    measurement: memory for exact GF(2) Macaulay rank from
    Theta(rank times columns) to Theta(nonzeros + columns), predicted 67 GB down
    to about 120 MB at the 768,212-column cell (factor about 500); time from
    Theta(rank squared times columns) to Theta(columns times nonzeros), predicted
    about 4.6x10^17 down to about 2.3x10^13 bit operations (factor about 10^4);
    claim tier degraded from deterministic-exact to probabilistic with a measured
    per-trial failure rate; and, if the density is above the pre-registered kill
    threshold, the delta is instead one measured obstruction -- the nonzero
    density of boolean Semaev D=6 Macaulay matrices, a number nobody currently
    has, recorded with value, units, runs and scope.

