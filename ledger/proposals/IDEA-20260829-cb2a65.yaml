  assumptions:
    - >-
      The failed cell's matrix is genuinely sparse. THIS IS THE PROPOSAL'S ENTIRE
      LOAD-BEARING ASSUMPTION and it is unmeasured; the whole minimal test is
      built to measure it first and to kill the proposal if it is false.
    - >-
      The existing system generator (h012_peel_rank.build_system and the boolean
      null path) can be streamed row by row without materialising the matrix. If
      it cannot, a streaming adapter is the first implementation task and its cost
      is charged here, not hidden.
    - >-
      Rank over GF(2) of the Macaulay matrix is the quantity the DREG lane needs.
      This record takes that from the goal's own admissibility rule, which admits
      evidence only from full-column exact ranks, the graded pivot-degree Hilbert
      function, or the q-to-s collapse, and does not reopen it.
    - >-
      The host is 14 cores and 48 GB; contracts are 8 GiB. A method that needs
      67 GB is out of reach on this host regardless of contract, which is why the
      diagnosis matters more than the contract.
    - >-
      No result of this proposal is mathematical evidence about d_reg. It produces
      an instrument; the measurements it would enable are separate work under
      GOAL-DREG-001's own approval, which this record does not and cannot grant.

  proof_search_map:
    bottleneck: >-
      The accumulator in exact GF(2) rank computation: storing rank times n bits
      of pivot rows. Removing that single storage requirement is the whole of the
      proposed change; everything else in the pipeline is untouched.
    baseline_embedding:
      parameter_slice: >-
        The n = 12, D = 6 cell, which the current instrument COMPLETED cleanly at
        peak RSS about 7 GB and whose committed values are
        rank_null_restricted = 156520 and rank_sem = 138573 (GOAL-DREG-001
        BATCH-005 checkpoint, evidence EV-DREG-008). The new kernel must reproduce
        BOTH integers exactly. This is an exact-integer regression fixture against
        committed evidence, not a curve that looks similar.
      reproduction_check: >-
        Exact integer equality on both ranks at n = 12 D = 6, plus exact equality
        with the closed-form Macaulay ranks of the RQ-ECDLP-001 S_3 systems where
        the answer is derived rather than computed. Two independent kinds of
        ground truth -- one committed measurement, one closed form. Any mismatch
        on either halts the line and NOTHING is reported about n = 15.
    observation_collision:
      observable: >-
        A single integer, the rank.
      distinct_preimage_search: >-
        Trivially and massively colliding -- an enormous number of distinct
        matrices share any given rank -- and that is exactly why an integer
        agreement at ONE cell is weak evidence of kernel correctness. The
        separation is supplied by (i) reproducing TWO different committed integers
        at n = 12, (ii) the closed-form S_3 ladder where the predicted rank varies
        cell by cell with |Z|, and (iii) the deletion mutation below. An
        implementation validated on one rank value has not been validated.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the explicit row-echelon representation of the row space by its
          Krylov representation, in which rank becomes the degree of a minimal
          polynomial of a preconditioned operator. Obligations kept separate:
          encoding (the preconditioner must preserve rank), completeness (the
          Krylov space must reach the full invariant subspace), soundness (a
          degenerate preconditioner must be detected, not silently returned),
          transfer (the GF(2) small-field probability), cost loss (O(n) matvecs
          instead of O(rank squared times n) bit operations).
        predicted_gain: >-
          Memory from Theta(rank times n) to Theta(nnz + n); time from
          Theta(rank squared times n) to Theta(n times nnz). At the failed cell
          this is a predicted memory factor of order 500 and a predicted time
          factor of order 10^4 -- BOTH PREDICTIONS, both required metrics, both
          able to fail.
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure -- peak RSS as an explicit
          function of rows, columns, nonzeros per row and block size -- realise it
          by instrumenting the run, and charge memory only over proved-disjoint
          allocation blocks (matrix storage, Krylov vectors, minimal-polynomial
          buffer). A contract that is a formula rather than a number is what makes
          the next cell's feasibility predictable instead of discovered by OOM.
        predicted_gain: >-
          Converts "will n = 18 fit" from an experiment into an arithmetic
          question answered before any budget is spent.
    quantifier_order: >-
      CLAIMED: FORALL cells (n, D) in the DREG ladder, IF the generated Macaulay
      matrix has nonzero density below the pre-registered threshold, THEN THERE
      EXISTS a black-box rank procedure whose peak resident memory is bounded by
      c1 times nnz plus c2 times n bits for absolute constants c1, c2 measured on
      the calibration set, and whose output equals the exact rank with probability
      at least 1 minus epsilon over its own randomness, epsilon measured by
      repeated trials.
      NOT CLAIMED, and the distinction is where black-box methods usually go
      wrong: FORALL cells THERE EXISTS a procedure that is exact
      deterministically. The method is Monte Carlo in its preconditioner; a
      returned rank is a LOWER BOUND that is correct with high probability, and
      repeated trials with fresh preconditioners raise but never eliminate the
      doubt. Every reported rank carries its trial count and the maximum over
      trials, and is labelled probabilistic. Under
      docs/claims-and-verification.md that is a strictly weaker claim tier than
      the current instrument's exact elimination, and the DREG lane's own
      admissibility rule may not accept it -- which is a CONTRACT-LEVEL risk this
      record flags rather than assumes away.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For matrices of the measured density, exact GF(2) rank is obtainable
        within an 8 GiB contract with probability at least 1 minus epsilon per
        trial, epsilon measured." It can NEVER certify a rank deterministically,
        never certify anything about matrices denser than the measured threshold,
        and never produce mathematical evidence about d_reg by itself.
      nearby_object_control: >-
        A DENSE matrix of the same dimensions with a KNOWN rank, planted. The
        method must be visibly WORSE on it -- higher memory and higher time than
        dense elimination -- and must still return the correct rank. A kernel that
        looks good on the dense control is not exploiting sparsity and its
        sparse-case numbers are meaningless. Second nearby object: a matrix that
        is sparse but has a large nilpotent part, where naive Krylov rank is known
        to be delicate.
    proof_obligations:
      - claim: >-
          The nonzeros per row of the n=15 D=6 generated system, measured by
          streaming.
        responsibility: feasibility
      - claim: >-
          Peak RSS is bounded by the specialised formula on every calibration cell.
        responsibility: memory
      - claim: >-
          Rank equals 156520 and 138573 exactly at the committed n=12 D=6 cell.
        responsibility: baseline
      - claim: >-
          Rank equals the closed form on the RQ-ECDLP-001 S_3 ladder.
        responsibility: correctness
      - claim: >-
          The one-column deletion mutation lowers the reported rank by exactly 1.
        responsibility: soundness
      - claim: >-
          Measured failure probability per trial over at least 30 fresh
          preconditioners.
        responsibility: success_probability
      - claim: >-
          Wall time per cell, measured, against the predicted n times nnz.
        responsibility: runtime
      - claim: >-
          Every reported rank is labelled probabilistic with its trial count, and
          the DREG lane's admissibility rule is checked against that label BEFORE
          any DREG cell is run.
        responsibility: interface
      - claim: >-
          The dense nearby-object control shows the method is worse there.
        responsibility: scope

  predictions:
    - metric: >-
        mean and maximum nonzeros per row of the D = 6 Macaulay system at n = 15,
        measured by streaming the existing generator with no matrix allocation
      direction: different
      minimum_effect: >-
        PRE-REGISTERED THREE-WAY DECISION RULE, COMMITTED BEFORE THE COUNT IS
        TAKEN: density d/n at most 0.001 means black-box viable, proceed; d/n at
        least 0.05 means black-box strictly worse than dense elimination, PROPOSAL
        DEAD and the density is recorded as a structural fact about boolean Semaev
        Macaulay matrices at D = 6; in between, report the measured crossover
        against the cost model and take no decision. The band is fixed here so
        neither branch can be reached by moving the threshold afterwards.
    - metric: peak resident memory of the streaming density count itself
      direction: lower
      minimum_effect: >-
        PREDICTED under 1 GiB, i.e. at least 11 times below the 11.73 GiB reported
        failure. If the count itself exhausts memory, the generator cannot be
        streamed, and that is a first-order finding about the pipeline that must
        be fixed before any rank method is discussed.
    - metric: >-
        exact rank returned by the black-box kernel at the committed n = 12, D = 6
        cell
      direction: different
      minimum_effect: >-
        FORCED EXACT: 156520 for rank_null_restricted and 138573 for rank_sem, the
        integers committed in the BATCH-005 checkpoint and EV-DREG-008. Off by any
        amount, in any direction, halts the line. This is the single hardest gate
        in the proposal.
    - metric: >-
        rank returned on the RQ-ECDLP-001 S_3 calibration ladder versus the closed
        form derived from the size of Z
      direction: different
      minimum_effect: >-
        FORCED EXACT on every cell of a ladder in which the predicted rank VARIES
        cell by cell (through |Z| taking values 0, 1, 2, 3), so that agreement is
        not a coincidence of one number. A kernel validated only where the answer
        is constant is not validated.
    - metric: >-
        one-column deletion mutation, deleting one column from an early unit and
        re-running
      direction: lower
      minimum_effect: >-
        REQUIRED TO DROP THE RANK BY EXACTLY 1. This is the discriminating
        mutation the GOAL-DREG-001 BATCH-006 ranking already names as its ranked
        winner (item B, CTRL-013-OPTIONAL-RERANK), which has NOT been authorized
        to run and is NOT authorized by this record; it is adopted here as a
        correctness check on the NEW kernel only, applied to the calibration cells
        this record proposes and to nothing else.
    - metric: >-
        measured peak RSS versus the specialised formula c1 times nnz plus c2
        times n
      direction: different
      minimum_effect: >-
        Formula must predict the measured peak within 25% across the whole
        calibration set spanning at least a 100x range of nnz. A formula that only
        fits at one size predicts nothing about n = 18 and the feasibility claim
        for that rung must be withdrawn.
    - metric: >-
        measured failure rate over at least 30 independent preconditioner draws on
        cells with known rank
      direction: different
      minimum_effect: >-
        Reported as a number with a Clopper-Pearson interval, never as a quoted
        theoretical bound. A measured failure rate above 10% makes the method
        unusable under the DREG lane's exactness rule and the record says so.
    - metric: >-
        dense nearby-object control of the same dimensions with planted rank
      direction: higher
      minimum_effect: >-
        The black-box kernel must be MEASURABLY WORSE there (higher time and no
        memory advantage) while still returning the correct rank. If it looks good
        on the dense control it is not exploiting sparsity and every sparse number
        is suspect.

  minimal_test:
    design: >-
      STAGE 0 (zero rank computations, minutes, THE WHOLE POINT). Stream the
      existing generator for the n = 15, D = 6 system and COUNT nonzeros per row.
      Allocate no matrix. Report mean, median, maximum and the full histogram, and
      apply the pre-registered three-way decision rule. IF THE DENSITY IS ABOVE
      THE KILL THRESHOLD, STOP HERE: the record's deliverable is then the measured
      density, filed as an obstruction with its value, units, run id and scope per
      the inventor-protocol section 4 measurement standard, and the black-box
      route is closed with a mechanism instead of a shrug.
      STAGE 0b (minutes). Independently confirm the accumulator diagnosis by
      reading src/h012c_block_m4ri.py's carrier storage layout, which this session
      did NOT open. If the carrier is not rank times n bits, the memory arithmetic
      in claim (A) is wrong and must be redone before anything else.
      STAGE 0c (minutes, VERIFICATION OBLIGATION, BLOCKING BEFORE ANY SPEND).
      The n=15 figures used in claim (A) -- 768,212 columns, peak RSS 11.73 and
      12.22 GiB, 6 of 6 runs resource_exhaustion, rank kernel never invoked -- are
      NOT on this worktree's branch (ideas-elliptic-curve-20260829) and were NOT
      read by the authoring session. They are reported to live on the unmerged
