  interpretation_limits:
    - A digit count is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the count triple 6, 5, and 5 of the integer 63.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen integer 127 has bit length 7, 6 doublings, and
        6 additions.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent readings. A mismatch voids the product.
