# IDEA-20261003-ac4b14
# Addition count for the integer 127. Proposal only. Not approved.
idea:
  id: IDEA-20261003-ac4b14
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The integer 127 has bit length 7, 6 doublings, and 6 additions
  class: measurement
  claim: >-
    The integer 127 has bit length 7. Reaching it by doubling and
    adding uses 6 doublings and 6 additions. Seven exceeds six by 1.
    The product of 7, 6, and 6 is 252. Their sum is 19. The gap is a
    digit count, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the binary expansion of the integer
    127, which is coordinate-dependent and is not a group element.
    The bits are 1, 1, 1, 1, 1, 1, and 1. The operation set is reading
    one bit and either doubling or doubling and adding. Two
    readings of the addition count both give 6, so that gap is 0.
    No curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        digit counts of the integer 127.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The integer 127 is frozen before the bits are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The digit-count gap between 7 and 6.
    baseline_embedding:
      parameter_slice: The integer 127 and the counts 7, 6, and 6.
      reproduction_check: >-
        Two readers must agree that the bit length is 7, the
        doubling count is 6, and the addition count is 6.
    observation_collision:
      observable: The addition count and the product.
      distinct_preimage_search: >-
        Reporting the addition count as 6 on both readings drops
        their gap. Two readings make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The integer 127.
        predicted_gain: Six additions. No exponent.
    quantifier_order: >-
      The integer is fixed before the bits are read.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 7, 6, and 6. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both give 6, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 127 is 7.
        responsibility: size
      - claim: The addition count is 6.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
