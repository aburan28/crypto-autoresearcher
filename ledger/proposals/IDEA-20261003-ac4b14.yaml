      direction: different
      minimum_effect: Seven exceeds six by 1.
  minimal_test:
    design: >-
      Read the bits of 127 and count doublings and additions. Do not
      add a curve point.
    controls:
      - Two readings of the addition count, whose gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
      - the product
  falsification_conditions:
    - The addition count is not 6.
    - The product of 7, 6, and 6 is not 252.
  confounders:
