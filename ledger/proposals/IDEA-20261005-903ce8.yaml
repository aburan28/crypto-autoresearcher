  predictions:
    - metric: enumerated_point_count_of_E_over_F_5
      direction: different
      minimum_effect: 9
    - metric: enumerated_point_count_of_E_over_F_25
      direction: different
      minimum_effect: 27
    - metric: enumerated_point_count_of_nearby_curve_over_F_25
      direction: different
      minimum_effect: 32
  minimal_test:
    design: >-
      Enumerate squares of x^3+x+1 over F_5 and over F_25, counting the
      point at infinity. Separately enumerate y^2 = x^3 + x + 2 over
      both fields. Compare with 9, 27, and 32. Do not call a summation
      polynomial, a factor-base constructor, or a discrete-log routine.
    controls:
      - The nearby equation must not return 27 over F_25.
      - Two independent F_25 enumerations of E must agree.
      - An implementation that substitutes the trace recurrence for the square tests is invalid and is rerun.
    required_metrics:
      - enumerated_point_count_of_E_over_F_5
      - enumerated_point_count_of_E_over_F_25
      - enumerated_point_count_of_nearby_curve_over_F_25
  falsification_conditions:
    - The square-test count of E(F_5) is not 9.
    - The square-test count of E(F_25) is not 27.
    - The square-test count of y^2 = x^3 + x + 2 over F_25 is 27, or is not 32.
    - A timeout or a missing field implementation is infrastructure, not a falsification of the integers.
  confounders:
    - An F_25-isomorphism can change the model and must not be applied before the count.
    - A quadratic twist over F_25 changes the trace of pi^2.
    - Counting only affine points drops the count by 1.
  interpretation_limits:
    - >-
      Agreement at q=5 says the recurrence matches one enumeration. It
      does not lower a decomposition degree and it does not beat
      Frobenius-class rho.
    - >-
      Theta coordinates, level-2 theta charts, and the field of
      definition of etale 2-torsion are not this count.
    - >-
      No factor base, so the KN-OPEN-020 open classes are not entered.
    - The discrete-log time-exponent delta versus Pollard rho is 0.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For the base change of an elliptic curve over F_q with trace t,
        the trace of Frobenius over F_{q^2} equals t^2 - 2q. Here q=5
        and t=-3, so that trace is -1 and the point count is 27. One
        curve. No transfer to a larger extension or to a factor-base
        cost.
      rigorous_support: >-
        Cayley-Hamilton for X^2 - t X + q gives pi^2 = t pi - q, and
        the trace of the identity endomorphism is 2, so tr(pi^2) = t^2 - 2q.
        This imitates no random integer. The comparison distribution is
        a point mass at 27.
      validation_plan: >-
        Enumerate squares over F_5 and over F_25 for this equation and
        for y^2 = x^3 + x + 2. Accept only if the three counts are 9,
        27, and 32. No sample beyond these two equations.
  target_complexity:
    time_exponent: >-
      O(q^2) field operations at q=5. The discrete-log time exponent
      stays 1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) field elements
    best_known: >-
