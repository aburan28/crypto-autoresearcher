idea:
  id: IDEA-20261005-903ce8
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Enumerated F_25-point count of y^2 = x^3 + x + 1 over F_5 is 27
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + x + 1 over F_5. Independent enumeration of
    E(F_5) equals 9, so the trace is -3. The base change to F_25 has
    enumerated point count 27. The nearby curve y^2 = x^3 + x + 2 over
    F_5 has enumerated count 4 and base-change count 32, not 27. R1 is
    the affine x-coordinate and R2 is the Weierstrass equation. No
    factor base is built, and no index-calculus stage changes its cost.
    Toy scope. The discrete-log time exponent is unchanged.
  mechanism: >-
    OBJECT FRAME. The representation is the pair (R2 equation over F_5,
    R1 x-coordinates over F_25). The operation set Sigma is the semigroup
    of powers of the 5-power Frobenius on those coordinates. Sigma does
    not contain translation. Coordinate-dependent: the integer 27 is a
    function of the coefficients (1, 1), not of one chosen group element.
    LOSSY-PROJECTION TEST. Discarded: the x-coordinates of the rational
    points over F_25. Compatible with Sigma: the 5-power Frobenius
    permutes E(F_25) and preserves its cardinality. Lossy: 27 points
    map to one integer, so the map is not injective and not a coordinate
    change. The priced open number is the pair (L, b) = (27, 1): loss
    27 points, branching 1 because the count is deterministic. The
    prediction uses Cayley-Hamilton. From pi^2 - t pi + 5 = 0 and t = -3,
    the trace of pi^2 equals t^2 - 2*5 = -1, and the point count is
    25 + 1 - (-1) = 27. The test must not use that identity as its
    counter. It must test squares in F_25. F1 through F7 are not the
    lens. In particular there is no factor base, so this is not F2, and
    there is no rho orbit, so this is not F6. Theta coordinates are not
    used. The F_5 count 9 was checked by hand in this session and is
    pre-registered. A disagreeing recount falsifies it.
  novelty_status: unverified
  citations:
    - ref: RQ-FROB-7d8dd4
      provenance: internal
      claim: >-
        Asks whether q-power Frobenius changes the charged cost of
        index calculus on a subfield curve by more than the factor n.
        This proposal only checks the point-count shadow of that
        Frobenius, at q=5 and n=2, before any decomposition system.
      verified_by: idea-generator, this session, read ledger/questions/RQ-FROB-7d8dd4.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        The trace is an isogeny invariant, so the extension count
        predicted from the trace is class data. This proposal measures
        one curve, not a walk to a different trace.
      verified_by: idea-generator, this session, read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms remain Omega(sqrt(p)). A point count
        is not a discrete logarithm.
      verified_by: idea-generator, this session, read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        Automorphism discounts change the rho constant, not the exponent.
        This proposal does not apply an automorphism to a walk.
      verified_by: idea-generator, this session, read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
  assumptions:
    - F_25 is built as F_5[z]/(z^2 - 2). The element 2 is not a square in F_5.
    - The base-change equation keeps coefficients 1 and 1. It is not rewritten by an isomorphism before the count.
    - The nearby curve y^2 = x^3 + x + 2 is a different equation. Its count is not copied from E.
  proof_search_map:
