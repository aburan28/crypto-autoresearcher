  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, hours of thought, AND IT IS THE CHEAPEST RESULT IN
      THE RECORD. Write C4's scalarisation argument and the GLV covolume argument
      as a derivation note, applying the lossy-projection test to objects O3 and
      O4 before any experiment. A failure here - if some endomorphism does not act
      as a scalar, or the lattice basis is not covolume-preserving - is a free and
      highly consequential negative.
      STAGE 1, THE CHEAPEST VALID COMPUTATIONAL DISCRIMINATOR, seconds. Evaluate
      the modulus expression and record both forms; check p modulo 3 and
      primality; run Cornacchia to get (a, b) and verify a^2 + 3b^2 equal to p as
      an exact integer; form the six candidate traces; generate a point on
      y^2 = x^3 + 7; test [p + 1 - t]G for each of the six; certify N prime and N
      greater than 4 sqrt(p). RECORD THE DERIVED TRACE BEFORE OPENING THE MIRROR
      CELL IN THE RUN LOG, then compare against the published trace and cofactor.
      Emit the order certificate with both routes recorded.
      STAGE 2, seconds. The GLV certificate - find beta and lambda, verify the
      endomorphism against double-and-add, check 6 divides N - 1 against the
      mirror's cell format, emit the witness. Run the five wrong-sextic-twist
      controls at the real p.
      STAGE 3, seconds. THE PUBLISHED-COLUMN REPRODUCTION - evaluate
      0.886 sqrt(N) for secp256k1 and, using the mirror's traces and the same
      Hasse-uniqueness route where a base point is available, for NIST P-256,
      ANSSI FRP256v1, brainpoolP256t1 and Curve25519, and report the residual per
      row in bits against the mirror's rho column. Re-read the rho cells from
      pages/rho.html first.
      STAGE 4, minutes to an hour across 14 cores, AND IT IS THE ONLY
      COMPUTE-NONTRIVIAL ITEM. The rho measurement. FIRST the blocking
      reproduction fixture on a generic curve at 24 bits. THEN, on constructed j
      equal to 0 curves at 24, 32 and 40 bits, three arms of 400 instances each -
      classless, negation-only, sextic-class - plus two null arms, a bogus-lambda
      arm and a j not equal to 0 arm. Report mean step counts with confidence
      intervals, the three pairwise ratios, the fruitless-cycle rate and the
      restart count. OPTIONAL 48-bit run at 50 instances as a scaling check,
      declared as underpowered.
      STAGE 5, zero compute. The closure note and the forward-guidance list,
      archived as a derivation artifact per docs/claims-and-verification.md and
      cited by path.
    controls:
      - >-
        BLOCKING REPRODUCTION FIXTURE, TWO PARTS - the rho instrument must return
        1.2533 sqrt(N) classless and 0.886 sqrt(N) with negation on a generic
        j not equal to 0 curve within stated confidence, AND the evaluated formula
        must reproduce the mirror's published rho column on five rows. An
        instrument that fails either measures nothing.
      - >-
        NEARBY-OBJECT NEGATIVE AT FULL SIZE, THE SHARP ONE - the five other sextic
        twists at the SAME 256-bit prime. Same p, same (a, b), same j, same CM
        discriminant, different order. The [N]G test must fail on each with the
        intake N.
      - >-
        NULL OBJECT, BLOCKING - a j not equal to 0 curve at matched size through
        the identical class-walk code path. beta does not exist, the instrument
        must REFUSE, and any measured gain voids the deliverable.
      - >-
        BOGUS-LAMBDA NULL - the sextic-class walk run with lambda replaced by a
        random element of Z/N that is not a cube root of unity. It must produce NO
        speedup and must fail its own consistency check, distinguishing "the walk
        uses the endomorphism" from "the walk is faster because it visits fewer
        distinct states for an unrelated reason".
      - >-
        RANDOM-Q CONTROL - draw Q as a uniformly random point of the order-N
        subgroup with no k ever computed, rather than as [k]P. Predicted the same
        success rate and the same step-count distribution; a gap is direct
        evidence the harness leaks the answer and voids every measurement.
      - >-
        MIRROR-READING CONTROL, ADDED IN RESPONSE TO MIRROR-DEF-1 - for every
        mirror cell used, read the value from tables/*.tsv AND from the
        corresponding pages/*.html and require exact agreement; additionally read
        the same cells from pages/*.txt and record whether the row-boundary
        collapse corrupts them for these rows. This is a cheap direct measurement
        of the defect's blast radius that no record currently holds.
      - >-
        CROSS-IMPLEMENTATION - the fast walk engine validated against
        harness/toycurve.py on 10^4 random additions and doublings before any
        measurement, and the modular square root cross-checked against an
        independent Tonelli-Shanks implementation.
      - >-
        DEGENERATE-INPUT CONTROL - the identity, points of order dividing 6, and
        the fixed points of the beta map, each handled explicitly rather than by
        accident, since the class representative rule is undefined on orbits
        shorter than six.
    required_metrics:
      - 'the modulus expression AND its evaluated integer, recorded side by side'
      - 'p mod 3, N mod 3, and the primality tier reached for p and for N'
      - 'the pair (a, b) with the exact verifying sum a^2 + 3b^2'
      - 'all six candidate traces, and the [p + 1 - t]G outcome for each with 10 witnesses'
      - 'the derived trace, recorded BEFORE the mirror cell is opened in the run log'
      - 'the exact-integer comparison of derived trace and cofactor against the mirror cells'
      - 'per mirror value used, the file, the authority tier, and the tsv-versus-html agreement'
      - 'the certified N, the cofactor, and the Hasse inequality as exact integers'
      - 'beta, lambda, the exact coordinates of both sides of the endomorphism check, and (N-1) mod 6'
      - 'the derived CM discriminant, cross-referenced to IDEA-20260829-9e38bc and to the mirror'
      - 'the published-column residual in bits for each of the five evaluated rows'
      - 'per arm per size, mean step count, standard error, instance count and seeds'
      - 'per arm, the fruitless-cycle rate per step and the restarts per instance'
      - 'the three pairwise ratios with confidence intervals, and the reproduction-fixture result'
      - 'the null-arm and bogus-lambda-arm results'
      - 'wall clock, core count, and an explicit statement of which optional stages were NOT run'
      - 'verifier_commit and the exact harness/toycurve.py revision used'

  falsification_conditions:
    - >-
      p is not congruent to 1 modulo 3, or p is composite. The j equal to 0 GLV
      structure does not exist as described, contradicting the mirror's own
      (l-1)/6 cell format; C1 to C3 are withdrawn and the record reports whether
      the defect is in the modulus expression, its evaluation, or the intake.
    - >-
      None of the six candidate traces passes the [N]G test, or the surviving
      trace differs from the mirror's published trace. Halt, re-read
      pages/disc.html per the authority order, report the six candidates and the
      test outcomes, and localise the defect. DO NOT prefer the more convenient
      value.
    - >-
      Two or more candidate traces pass. A bug, since it would require two of the
      six sextic orders to share the relevant factor; halt.
    - >-
      N is composite or N is not greater than 4 sqrt(p). Hasse uniqueness does not
      apply and the cofactor claim is withdrawn.
    - >-
      The endomorphism check disagrees with double-and-add, or 6 does not divide
      N - 1. The GLV structure is not as described on this curve; C3 is
      inapplicable and C2 is withdrawn.
    - >-
      The reproduction fixture fails to return the known rho constants on a
      generic curve, or the evaluated formula fails to reproduce the mirror's rho
      column on the non-CM comparison rows. The instrument is void and NO ratio
      and NO residual interpretation are reported.
    - >-
      The null-object arm or the bogus-lambda arm shows a speedup. The measurement
      is of the code and not of the curve; every ratio is withdrawn.
    - >-
      The measured sextic ratio significantly EXCEEDS sqrt(3). C4's closure is
      incomplete. PRE-COMMITTED ROUTE - halt, exclude implementation error first
      as overwhelmingly the likelier explanation, escalate to independent
      review-breakthrough scrutiny, and make no statement outside the repository
      until it is excluded.
    - >-
      Some F_p-rational endomorphism is found NOT to act as a scalar on the
      prime-order subgroup. C4's argument is wrong and the closure is withdrawn in
      full - a free, zero-compute falsification available at Stage 0.
    - >-
      Any tsv-versus-html disagreement on a mirror cell used here. The derived
      table is defective beyond MIRROR-DEF-1's recorded scope; report it against
      the source record and use pages/*.html.

  confounders:
    - >-
      CONFIRMATION BIAS AGAINST A PUBLISHED ANSWER, AND IT IS NOW THE LEADING RISK
      IN THIS RECORD. The mirror states the trace, D, the cofactor and the rho
      cost before the executor computes anything, so an implementation that is
      subtly wrong is far likelier to be tuned until it matches than to be caught.
      MANDATORY MITIGATIONS - the run log records the derived trace BEFORE the
      mirror cell is opened, and the [N]G check, which no table can corrupt, is
      what the order claim cites, with the table agreement reported separately as
      corroboration.
    - >-
      sqrt(6) VERSUS sqrt(3), AND THIS IS THE MOST LIKELY ERROR IN ANY WRITE-UP OF
      THIS RESULT. The automorphism group has order six, so the discount over a
      CLASSLESS walk is sqrt(6); but KN-TECH-018 records that the program's stated
      0.886 sqrt(n) convention ALREADY INCLUDES the sqrt(2) negation factor, so
      the additional discount over the STATED BASELINE is only sqrt(3). A record
      that reports sqrt(6) against the 0.886 baseline has double-counted negation
      and overstates the effect by 0.5 bits. Every ratio must name the arm it is
      measured against.
    - >-
      A RESIDUAL IS NOT AN INTENT. Establishing that 0.886 sqrt(N) reproduces the
      published column uniformly shows what the numbers are consistent with; it
      does not establish what convention SafeCurves adopted, which is a question
      about a document whose criterion prose lives in pages/rho.html and was not
      read here. Any claim about intent is out of scope and pre-committed against.
    - >-
      FRUITLESS CYCLES ARE AN IMPLEMENTATION PROPERTY. The achieved discount
      depends on the cycle-detection and restart policy, which is a choice this
      record makes. A measured ratio is a joint property of the curve and the
      walk, and the deliverable must say which policy produced it.
    - >-
      THE MEASUREMENT IS AT 24 TO 40 BITS AND THE CURVE IS AT 256. The ratio is
      expected to be size-independent on theoretical grounds, since both the class
      count and the birthday constant are size-free, but that is an argument and
      not a measurement, and heuristic H2 carries it explicitly. NO RHO WALK IS
      RUN AT 256 BITS AND NONE COULD BE.
    - >-
      THE MODULUS IS AN EXPRESSION IN BOTH SOURCES. The intake and the mirror both
      give p as "2^256 - 2^32 - 977" rather than as a decimal literal, so the
      evaluation is itself a transcription step and an evaluation error would be
      invisible to a cell-by-cell comparison of the two. Both forms must be
      recorded.
    - >-
      j EQUAL TO 0 IS ALSO BN's STRUCTURE. The mirror reports D equal to -3 for
      both this row and BN(2,254), so a shared bug in a CM path would produce the
      same wrong answer twice and look like a cross-validation. The two records
      reach the trace by COMPLETELY DIFFERENT routes - a norm form here, a
      polynomial family in IDEA-20260829-3e330e - which is what makes the
      agreement informative, and the deliverable must state that the shared step is
      only the final square-part extraction.
    - >-
      ECONOMIC SCALE IS NOT A REASON TO SOFTEN OR TO SHARPEN A FINDING. This curve
      secures very large deployed value. That makes the escalation pre-commitment
      above binding, and it equally forbids inflating a 0.79-bit baseline
      correction into a security statement.

  interpretation_limits:
    - >-
      NOTHING HERE IS AN ATTACK, NOTHING HERE MOVES AN EXPONENT, AND NOTHING HERE
      IS A WEAKNESS IN secp256k1. The sqrt(3) is a CONSTANT factor that
      KN-TECH-018 already records as baseline calibration rather than a mechanism,
      and the measured value is expected to be SMALLER than the ideal, meaning the
      curve is if anything slightly stronger than a naive discounted baseline
      would suggest. Per docs/target-result-profile.md this record is explicitly
      NON-TARGET-CLASS. Any summary that presents the discount as a vulnerability
      commits a claim-tier violation.
    - >-
      C4 IS A CLOSURE, NOT AN IMPOSSIBILITY CLAIM. It states a named obstruction
      within a stated scope - single-point endomorphism-image objects on a
      prime-order cyclic subgroup - and names what remains open. It is a
      `derivation` under docs/claims-and-verification.md, a checkable argument,
      never "proved", and it does not declare any direction impossible.
      FORWARD GUIDANCE, THE THREE CLASSES THAT REMAIN OPEN. (a) MULTI-POINT
      OBJECTS where lambda acts non-diagonally - a lambda-invariant factor base
      for index calculus, object O5, where the quotient acts on relations rather
      than on points and the projection is not obviously a bijection; the recalled
      Faugere-Gaudry-Huot-Renault symmetry work is the nearest prior art and its
      known gains are constant-factor, but no one in this program has checked
      whether the j equal to 0 sextic symmetry does better than the 2-torsion
      symmetry usually exploited. (b) OBJECTS ON TORSION OTHER THAN THE TARGET
      SUBGROUP - the action of the CM order's class group on the isogeny class,
      object O6; the standing obstruction is that F_p-isogenies preserve #E,
      recorded in IDEA-20260807-98a970's reachability gate, so no easier curve is
      reachable, but the auxiliary structure reachable that way has never been
      measured here. (c) OBJECTS THAT ARE NOT INVARIANT-THEORETIC at all -
      lift-based and Archimedean-size objects, whose known price KN-TECH-033
      states plainly.
    - >-
      AGREEMENT WITH THE MIRROR IS CONSISTENCY, NOT CORRECTNESS, AND NOT SOURCING.
      Two routes agreeing on an integer raises confidence in both; it proves
      neither, and a shared upstream error would be invisible. SafeCurves is a
      compilation and attributes this row to SEC 2; the goal's first completion
      criterion asks for reconciliation to PRIMARY or authoritative sources with
      citation provenance, and inputs/SAFECURVES-20260825/specs/ carries thirteen
      specification documents this session did NOT open. This record does not
      satisfy that criterion and must not be cited as doing so - but reading those
      specs is now a concrete, offline, cheap next step rather than a blocked one.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) THE NORM-FORM ORDER
      DERIVATION transfers to exactly ONE other row - BN(2,254), also j equal to 0
      per the mirror's disc column - and there it is REDUNDANT, because
      IDEA-20260829-3e330e's polynomial-family route is cheaper and sharper. For
      the seventeen rows the mirror reports with |D| above 2^100 the route does
      not exist at all, because Cornacchia needs a small discriminant to search
      over. Those rows can still have their published orders CHECKED by [N]G
      against a transcribed N, which is a weaker but real check, and the
      deliverable must label which kind each row got. (b) THE GLV CERTIFICATE
      transfers to every row with an efficiently computable endomorphism -
      predicted to be secp256k1 and BN(2,254) only, the two rows the mirror gives
      D equal to -3, with the other eighteen expected to have |Aut| equal to 2,
      which is itself testable from the j-invariant. (c) THE rho MEASUREMENT ARMS
      AND THE PUBLISHED-COLUMN REPRODUCTION transfer FULLY as a method - the
      classless and negation arms apply to every curve, and the residual
      computation applies to all twenty published rho cells at once. THIS IS THE
      RECORD'S PRINCIPAL FAMILY-WIDE VALUE - it would give all twenty goals a
      calibrated rho instrument and a stated reading of the published column,
      where today they have neither. (d) C4's CLOSURE transfers FULLY as an
      argument - it applies verbatim to every curve with a prime-order subgroup,
      which is all twenty, and tells the whole campaign that the endomorphism lane
      is a constant-factor lane. (e) NO TRANSFER AT ALL to any claim about the odd
      part of any group beyond N, or about any curve's security.
    - >-
      NO STATEMENT IS MADE ABOUT ANY RIGIDITY CELL. MIRROR-DEF-1's confirmed
      defect instance is a row of pages/rigid.html, and this session did not read
      tables/rigid.tsv or pages/rigid.html at all.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The expected number of steps of a Pollard rho walk on the quotient of a
        cyclic group of prime order N by an automorphism group of order m is
        sqrt(pi N / (2m)) times (1 + e), where e is a non-negative implementation
        overhead attributable to fruitless-cycle handling; formally, the walk on
        classes behaves like a random function on a set of size N/m, exactly as
        the classless walk behaves like a random function on a set of size N.
      rigorous_support: >-
        The RIGOROUS half is the birthday bound itself - for a genuinely random
        function on a set of size M the expected rho length is sqrt(pi M / 2),
        which is a theorem, and the class set has size exactly (N - 1)/m + 1 by
        orbit counting, which is exact. The HEURISTIC half is the standard
        random-function model for the specific walk used, which imitates the
        modelling assumption underlying the 0.886 constant this program already
        adopts in KN-TECH-006 AND which the mirror's published rho column also
        appears to adopt - so the assumption is not new debt, it is the debt both
        the existing baseline and the published table already carry, now made
        explicit and measured. The non-negativity of e is an assumption about the
        implementation, and E2 above is precisely the outcome in which it fails.
      validation_plan: >-
        SAMPLING - 400 instances per arm at each of 24, 32 and 40 bits, five arms
        (classless, negation, sextic, bogus-lambda, j not equal to 0 null), seeds
        recorded, on freshly constructed j equal to 0 curves - and at 24 bits the
        group order is small enough to compute by EXHAUSTIVE point counting over
        all x in F_p, an O(p) pass, giving ground truth independent of any
        certificate or table. COMPARISON DISTRIBUTION - the empirical distribution
        of step counts against the Rayleigh-shaped rho-length distribution with
        mean sqrt(pi M / 2), by a Kolmogorov-Smirnov test at each arm and size,
        not merely a comparison of means; a mean that matches with a badly wrong
        shape indicates the walk is not random-function-like and the ratio is not
        interpretable. TAIL CHECK - the 99th percentile step count against the
        predicted tail, and the count of instances exceeding 10 times the mean,
        which should be about 10^-4 of the sample and is where a cycle-handling
        defect shows first. TRANSFER - the RATIO is assumed size-independent and
        that assumption is tested by measuring it at three sizes and reporting
        whether it drifts; the ABSOLUTE cost is measured and never extrapolated.
    - id: H2
      statement: >-
        A step-count ratio measured at 24 to 40 bits on constructed j equal to 0
        curves is the ratio that would be observed at 256 bits on secp256k1;
        formally, the achieved automorphism discount is independent of the field
        size.
      rigorous_support: >-
        PARTIAL AND ARGUED, NOT PROVED. Both the class count m and the birthday
        constant are size-free, and the fruitless-cycle rate depends on the walk
        partition count and the class structure rather than on log p, so there is
        a genuine argument for size-independence - more than heuristic H2 of
        IDEA-20260829-d052e6 or of IDEA-20260829-f89a3a can say for their
        analogous assumptions. It is nevertheless an argument and NOT a proof. NO
        WALK IS RUN AT 256 BITS, so unlike the certificate claims in C1 and C2 -
        which now have full-size published comparison targets - there is NO
        full-size check available on the C3 measurement at all, and that asymmetry
        between the certified claims and the measured claim is the honest weak
        point of this record.
      validation_plan: >-
        SAMPLING - the ratio measured at three sizes spanning a factor of 2^16 in
        group order, plus an optional underpowered 48-bit point declared as such.
        COMPARISON - a linear regression of the measured ratio against log2 N with
        its confidence interval; the prediction is a slope indistinguishable from
        zero, and a significant nonzero slope FALSIFIES H2 and bounds how far the
        measurement may be carried, which is a useful result either way. TAIL
        CHECK - the fruitless-cycle rate plotted against size, which should also
        be flat. TRANSFER - explicitly not discharged; the deliverable reports the
        256-bit figure as "the measured ratio at 24 to 40 bits applied to an
        evaluated formula at 256 bits", never as a measurement, and H2 remains
        open.
    - id: H3
      statement: >-
        The six candidate traces derived from the CM norm form exhaust the
        possible traces of a j equal to 0 curve over F_p; that is, every curve
        with j equal to 0 over F_p with p congruent to 1 modulo 3 has trace in
        the set {plus or minus 2a, plus or minus (a + 3b), plus or minus
        (a - 3b)} for the representation p equal to a^2 + 3b^2.
      rigorous_support: >-
        RIGOROUS, not heuristic, and it is recorded and then discharged rather
        than carried. The Frobenius of an ordinary curve with CM by Z[omega] is an
        element of norm p, unique up to the six units of Z[omega] and up to
        conjugation, and the six sextic twists realise exactly those six
        associates. The residual assumption is only that the intake curve IS
        ordinary and has j equal to 0, which the equation y^2 = x^3 + 7 gives
        directly, and that p is not 2 or 3. THE ASSUMPTION IS THEREFORE VACUOUS
        ONCE STATED CAREFULLY, which is why it is stated and discharged.
      validation_plan: >-
        SAMPLING - at toy scale, construct y^2 = x^3 + b for b ranging over a full
        set of sextic class representatives at several small primes congruent to 1
        modulo 3, count points EXHAUSTIVELY over all x, and check that the six
        observed orders are exactly the six predicted ones as a multiset. A
        complete census at those primes, not a sample. COMPARISON - exact integer
        equality of two six-element multisets, plus, at full size, the observation
        that the mirror's published trace is one of the six candidates, which is a
        necessary condition H3 must satisfy on the real curve. TAIL CHECK - primes
        congruent to 2 modulo 3, where the construction does not apply and the
        instrument must REFUSE. TRANSFER - none, because at 256 bits the [N]G test
        decides which trace holds.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND THE RECORD SAYS SO IN ITS CLAIM. As an audit
      instrument - Cornacchia is one modular square root plus a Euclidean descent,
      O(log^2 p) bit operations after an O(log^3 p) square root; the six trace
      tests are 60 scalar multiplications; the GLV certificate is three modular
      exponentiations plus one scalar multiplication; the published-column
      reproduction is five square roots and five logarithms. Total milliseconds at
      256 bits, and the certificate verifies in one multiplication plus one scalar
      multiplication - genuinely succinct. AS AN ATTACK STATEMENT ON THE TARGET
      CURVE the exponent is UNCHANGED at 1/2 and the only movement is in the
      CONSTANT - from the mirror's published 2^127.8, which 0.886 sqrt(N) is
      predicted to reproduce, to an ideal 0.886/sqrt(3) times sqrt(N), which is
      about 2^127.0, a 0.79-bit reduction, with the ACHIEVED constant measured and
      predicted to fall between the two. PER agents/idea-generator.md THIS IS
      EXPLICITLY A CONSTANT-FACTOR RESULT AND IS DECLARED AS SUCH; its priority
      rests on being a required building block - the campaign holds no measured
      rho constant at all today - and on C4's closure, not on ambition.
    memory_exponent: >-
      O(log p) for the audit and O(log p) certificate size, a few hundred bytes.
      The rho measurement uses O(1) memory per walk by construction, which is what
      makes rho the frontier row it is (KN-TECH-001, KN-TECH-006); the
      distinguished-point tables at 24 to 40 bits are at most 2^20 entries and the
      48 GB envelope is not a binding constraint. NO TIME-MEMORY TRADEOFF IS
      EXERCISED and none is claimed.
    best_known: >-
      For the ECDLP on this curve, rho at 0.886 sqrt(n) with O(1) memory
      (KN-TECH-001, KN-TECH-006) - which the mirror evaluates as 2^127.8 -
      improved to about 0.51 sqrt(n) IDEALLY by the order-six automorphism group
      (KN-TECH-018), is the best known and this record TIES it, measuring the
      achieved constant rather than improving it. BSGS at square-root time and
      memory (KN-TECH-031) with its n^{2/3+o(1)} full cost (KN-TECH-035) is
      dominated by rho on memory. MOV and Frey-Ruck (KN-TECH-032) do not apply,
      which the mirror confirms by publishing an embedding degree of (l-1)/6. The
      trace-one additive transfer (KN-TECH-033) does not apply. For the ORDER, the
      best known route is now to read the mirror's disc and twist tables; the
      norm-form route here is the best INDEPENDENT route and is textbook.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. Five honest hidden costs. (i) THE
      DISCOUNT IS A CONSTANT and is being measured, not improved. (ii) THE C3
      MEASUREMENT HAS NO FULL-SIZE CHECK - heuristic H2 carries it from 40 bits to
      256 with an argument and no proof, and unlike C1 and C2 there is no
      independent recomputation and no published target available at 256 bits.
      (iii) THE ACHIEVED RATIO IS PART IMPLEMENTATION - it depends on the cycle
      policy and is a joint property of curve and walk. (iv) C4's closure is
      scoped to single-point endomorphism objects and says nothing about the three
      classes named as open. (v) THE RESIDUAL INTERPRETATION IS ABOUT NUMBERS, NOT
      INTENT, and cannot become a statement about what SafeCurves meant.
    tradeoff_note: >-
      Two tradeoffs. FIRST, INSTANCES VERSUS SIZES - a fixed compute budget buys
      either tighter confidence intervals at one size or a slope estimate across
      three; this record spends it on three sizes at 400 instances because H2's
      size-independence is the assumption that carries the number to 256 bits and
      an untested slope would make the headline uninterpretable. SECOND, IDEAL
      VERSUS ACHIEVED - a more aggressive cycle policy raises the achieved
      discount and raises the variance, so the reported ratio must come with its
      policy. Parallelisation is linear and trivial across the 14 cores and this
      is one of the few records in the campaign where they matter; there is no
      time-memory tradeoff anywhere in it.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. AS AN ATTACK IT IS DOMINATED BY EVERY ROW because it is not an
    attack and mounts none - rho (KN-TECH-001, KN-TECH-006), automorphism-
    discounted rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and
    Frey-Ruck (KN-TECH-032) and the trace-one additive transfer (KN-TECH-033) all
    dominate it on time, memory and data simultaneously. IN PARTICULAR
    KN-TECH-018 DOMINATES C3 ON THE STATEMENT ITSELF - the sqrt(|Aut|) discount is
    already recorded there and this record does not improve it; what this record
    adds is a MEASURED achieved value and a reading of the published column, where
    the corpus and the mirror both have only a formula. AS A SOLVE it is dominated
    by IDEA-20260829-f89a3a, which produces a genuine crypto-tier discrete
    logarithm; this produces no solve at all. AS AN ORDER-DERIVATION ROUTE it is
    dominated on this family by IDEA-20260829-3e330e, whose polynomial-family
    route is cheaper and needs no modular square root - but that route exists only
    for BN curves, so the two are Pareto-incomparable across rows. AS A SOURCE OF
    THE VALUES, inputs/SAFECURVES-20260825/ STRICTLY DOMINATES this record on cost
    for the trace, D, the cofactor, the twist data and the evaluated rho figure -
    one file read against milliseconds to an hour of compute - and that domination
    is stated first, not buried. This record is NOT dominated on four narrow axes
    and they are its entire case: it produces WITNESSES the mirror carries for
    nothing; it produces beta and lambda, which appear in no table; it produces
    the program's FIRST MEASURED rho constant, where every existing figure inside
    and outside the program is evaluated from a formula; and it produces C4's
    closure, for which no incumbent has been identified inside this program - a
    narrow non-domination that would evaporate the moment a retrieved textbook is
    found stating the same thing, which is likely and is why novelty_status is
    `unverified`.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. The exponent is
    unchanged at 1/2 and the constant is unchanged from what KN-TECH-018 already
    records. AS DATA, STATED AT ITS TRUE AND SMALLER SIZE NOW THAT THE MIRROR IS
    ACCOUNTED FOR - the trace, D, the cofactor, the twist cofactor, the twist
    subgroup order and an evaluated rho cost for this row are NOT new to the
    repository; inputs/SAFECURVES-20260825/ has carried them since 2026-08-25.
    What does not exist anywhere in ledger/ or knowledge/, and what this record
    would produce, is - an order and cofactor DERIVED from p by a route sharing no
    input with the published table; a GLV endomorphism certificate, beta and
    lambda, verifiable in one field multiplication against a 256-doubling
    recomputation, for which the mirror carries no analogue on any row; the
    program's FIRST MEASURED rho constant, with confidence intervals at three
    sizes across five arms including two nulls, against a corpus and a mirror that
    contain only evaluated formulas; a five-row residual analysis stating how the
    published rho column must be read, which resolves whether this curve's
    order-six automorphism group is credited in the 2^127.8 figure and, if not,
    places the automorphism-adjusted cost at about 2^127.0; and C4's closure with
    three named open classes. AS PRECISION - the row's rho cost moves from one
    published number to three distinguished quantities: published 2^127.8, ideally
    discounted about 2^127.0, and a measured achieved value between them. AS
    FORWARD GUIDANCE - C4 converts an implicit assumption that the GLV structure
    is worth attacking into an argued closure, which is the deliverable
    docs/inventor-protocol.md section 4 demands and which a count of rejected
    mechanisms would not be.
  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Stages 1 to 3 are about 200 lines - Tonelli-Shanks, Cornacchia, six trace
      tests, cube roots, a TSV parser and five formula evaluations - and run in
      seconds. Stage 4 needs a fast rho engine with automorphism classes, cycle
      detection and distinguished points, roughly 400 lines, validated against
      harness/toycurve.py; it is the reason both labels are medium rather than
      low. The measurement is minutes to about an hour across 14 cores at 24, 32
      and 40 bits with 400 instances per arm; the optional 48-bit point would add
      hours and is declared underpowered. Stage 0 and Stage 5 are pure derivation
      and cost no machine time.
  recommended_priority: high

