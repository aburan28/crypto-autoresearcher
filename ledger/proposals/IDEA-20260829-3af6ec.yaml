    algorithm, the sextic twist trace set for j equal to 0, the GLV endomorphism,
    the sqrt(|Aut|) rho discount of Wiener-Zuccherato and Duursma-Gaudry-Morain,
    and the fruitless-cycle phenomenon are all textbook or standard. The label is
    `unverified` and NOT `known` because the EXTERNAL LITERATURE was not read -
    no paper or standard was opened in this session, and every external citation
    below carries `verified_by: null`. Reading the in-repository SafeCurves mirror
    does NOT change that: the mirror is a table of results, not a derivation, and
    it establishes nothing about priority or about whether the closure argument of
    C4 has been written down before. Per agents/idea-generator.md a proposal whose
    external literature is entirely recalled is `unverified`. NO NOVELTY IS
    CLAIMED FOR ANY MATHEMATICS.
