  assumptions:
    - >-
      The executor session has a shell, Python 3 with arbitrary-precision
      integers, and 14 cores. The rho measurement is the only compute-nontrivial
      item and it is embarrassingly parallel; this is one of the few places in
      the campaign where the core count buys something real.
    - >-
      No Sage, no PARI, no SEA backend and NO NETWORK EGRESS is required. Every
      source this record uses is already in the repository.
    - >-
      MIRROR READING DISCIPLINE IS BINDING. Per MIRROR-DEF-1 the pages/*.txt
      renderings collapse empty cells and may attach a row's content to a
      neighbour. Values are taken from tables/*.tsv for screening and RE-READ from
      pages/*.html before any claim is filed on them; no value is ever taken from
      a .txt rendering; the authority tier is recorded per value. Because the
      recorded defect instance is a rigidity row, this record makes NO statement
      about any rigidity cell.
    - >-
      The intake modulus expression "2^256 - 2^32 - 977" is evaluated in-session
      and BOTH the expression and the resulting integer are recorded; the
      equation y^2 = x^3 + 7 is used as given. Their agreement with the mirror's
      index table is a consistency check and is NOT the reconciliation to primary
      or authoritative sources the goal's first completion criterion requires,
      since SafeCurves is a compilation and attributes this row to SEC 2.
    - >-
      A base point is required for C1 and C2. The intake tuple contains NO base
      point, and the mirror's tables/base.tsv was NOT read in this session, so the
      executor GENERATES one by drawing random x until x^3 + 7 is a square, which
      is sound for every purpose here because the order certificate needs only
      SOME non-identity point. If the audit later needs the standardised G it
      should be read from tables/base.tsv or pages/base.html and never filled from
      memory.
    - >-
      harness/toycurve.py is the independent verifier for the handful of
      full-size scalar multiplications only. The rho walk uses a separate fast
      implementation validated against toycurve.py on 10^4 random inputs before
      any measurement is taken.
    - >-
      No live keys. Every rho instance is generated in-session with k drawn and
      discarded before the walk starts, and every target is a generated toy curve
      - NO RHO WALK IS RUN AGAINST secp256k1 ITSELF, which would be both futile
      and outside the scope block's declared targets.

  proof_search_map:
    bottleneck: >-
      Two bottlenecks, and the record addresses both separately. FIRST, this
      row's order, trace and cofactor are PUBLISHED in the mirror but carry no
      witness this program can re-verify, and the goal's next_action records that
      every stated numeric relation in the dossier is a transcription plus a
      pending check; the bottleneck is verification capability, not access.
      SECOND, the rho baseline for CM curves rests on a formula (KN-TECH-018)
      whose achieved-versus-ideal gap has never been measured anywhere in this
      program, and the mirror publishes an EVALUATED rho cost rather than a
      measured one, so no measured constant exists to calibrate against. Removing
      the first changes what may be cited as evidence; removing the second changes
      what a cost statement means.
    baseline_embedding:
      parameter_slice: >-
        TWO baselines must be reproduced. (i) Restricted to |Aut| equal to 2, the
        rho instrument must reproduce the program's stated convention EXACTLY - a
        measured mean step count matching 0.886 sqrt(N) with negation classes and
        1.2533 sqrt(N) with no classes, at each tested size. (ii) Evaluated on the
        derived N, the formula 0.886 sqrt(N) must reproduce the MIRROR's published
        rho column for this row and for the comparison rows, to within the
        column's stated precision. A plot that looks similar is not an embedding;
        both checks are numeric with stated tolerances.
      reproduction_check: >-
        A frozen fixture with two parts. TOY - 400 instances on a random j not
        equal to 0 curve at 24 bits, requiring the measured mean step count to lie
        within its stated confidence interval of 1.2533 sqrt(N) classless and
        0.886 sqrt(N) with negation, run BEFORE any j equal to 0 curve is touched.
        PUBLISHED - the evaluated 0.886 sqrt(N) against the mirror's rho column
        for at least secp256k1, NIST P-256, ANSSI FRP256v1, brainpoolP256t1 and
        Curve25519, reporting the residual per row in bits. If the instrument
        cannot reproduce the known constant on a generic curve, or the formula
        cannot reproduce the published column, nothing it measures on a special
        curve is interpretable.
    observation_collision:
      observable: >-
        Three observables, attacked separately. (i) The order certificate
        (a, b, t, N) with its point witnesses. (ii) The measured mean rho step
        count per arm. (iii) The residual between the evaluated formula and the
        mirror's published rho column.
      distinct_preimage_search: >-
        REQUIRED FOR ALL THREE. (i) FOR THE ORDER CERTIFICATE the collisions are
        known in advance - the SIX SEXTIC TWISTS over the same p share the same
        (a, b) and are distinguished ONLY by which of the six traces passes the
        [N]G test, so the norm form alone does NOT identify the curve and the
        derivation would be unsound without the point test; additionally a curve
        and its quadratic twist have traces of opposite sign and identical t^2, so
        the CM discriminant observable cannot separate them at all, which is
        exactly why the mirror can report D equal to -3 for both BN(2,254) and
        secp256k1 at different primes. EXHIBITABLE AT TOY SCALE IN ONE LINE.
        (ii) FOR THE STEP COUNT the collision is statistical, which is why the
        null arms exist - two arms with genuinely different structure can produce
        indistinguishable mean step counts at small sample size, so the record
        pre-registers the sample size and the confidence interval and reports a
        NON-SIGNIFICANT difference as non-significant rather than as equality.
        (iii) FOR THE RESIDUAL the collision is the whole point - several distinct
        conventions can produce the same published 2^127.8, for instance
        negation-only on N, or no discount on a slightly different N, so a small
        residual on ONE row does not identify the convention. Only the PATTERN of
        residuals across a CM row and several non-CM rows of the same size does,
        and that is why the reproduction check spans five rows rather than one.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "what is the order of this 256-bit curve", which
          as posed requires SEA or a table read, by the question "what is the
          representation p = a^2 + 3b^2", which is one modular square root and a
          Euclidean descent, followed by a six-way test that reads no table.
        predicted_gain: >-
          A SECOND, INDEPENDENT ROUTE to the order, trace, cofactor and CM
          discriminant in milliseconds, whose only shared input with the published
          table is p. Encoding is the norm form; completeness is that every j
          equal to 0 curve's Frobenius is an associate of a + b sqrt(-3);
          soundness is delivered NOT by the derivation but by [N]G plus Hasse
          uniqueness - so a sign or convention error in the six traces cannot
          produce a wrong certificate, only a failed one.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "measured mean step count" fixed and vary the
          forgotten structure - the automorphism order actually used, the
          fruitless-cycle handling, the class representative rule - to determine
          which of them the measurement is actually sensitive to.
        predicted_gain: >-
          Distinguishes "the sextic classes buy sqrt(3)" from "our particular
          cycle handling buys whatever it buys", which a single arm cannot
          separate and which is the most likely way to publish a number that is a
          property of the implementation rather than of the curve.
      - transform: stronger_invariant
        proposed_object: >-
          Record, per instance, not only the step count but the fruitless-cycle
          count, the restart count and the distinct-class count, because the
          stronger state is what explains a shortfall while the step count alone
          only reports one.
        predicted_gain: >-
          Converts "the achieved discount was 1.4 instead of 1.732" into "the
          achieved discount was 1.4 because the cycle rate was r per step", which
          is an actionable measurement rather than a disappointment.
    quantifier_order: >-
      C1 is claimed PER INSTANCE, EXISTENTIALLY - FOR THIS modulus THERE EXIST a,
      b with p equal to a^2 + 3b^2, and THERE EXISTS t among the six candidates
      with [p + 1 - t]G equal to the identity, N prime and N greater than
      4 sqrt(p), whence #E equals N. C2 likewise existentially, per instance. C3
      is claimed as a MEASUREMENT OVER A SAMPLE and its quantifier is honest and
      restrictive - FOR THE TESTED SIZES and FOR THE TESTED walk implementation,
      the measured ratio is r with a stated confidence interval; NOT claimed FOR
      ALL j equal to 0 curves, and NOT claimed at 256 bits, where no walk is run.
      The published-column reproduction is claimed FOR THE FIVE ROWS EVALUATED and
      not for the column as a whole. C4's closure is claimed UNIVERSALLY OVER A
      RESTRICTED CLASS - FOR ALL F_p-rational endomorphisms phi and FOR ALL P in
      G, phi(P) equals [lambda_phi]P - and its scope restriction is exactly the
      words "tracks endomorphism images of a SINGLE point", which is why O5 and O6
      remain open rather than closed.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the stated modulus and equation, #E equals N with cofactor 1, the
        trace is t matching the value published in the mirror, the CM
        discriminant is -3 up to the fundamental-discriminant convention, and the
        map (x, y) to (beta x, y) acts on the order-N subgroup as [lambda], each
        verified by independent recomputation" - together with "at 24 to 40 bits
        on constructed j equal to 0 curves, the sextic class walk achieved a
        step-count ratio of r against the negation baseline, with a
        fruitless-cycle rate of c" and "the evaluated formula 0.886 sqrt(N)
        reproduces the mirror's published rho column to within x bits on the five
        rows tested". It certifies NOTHING about the ECDLP's hardness, NOTHING
        about the achieved ratio at 256 bits, and NOTHING about what convention
        SafeCurves intended, which is a question about a document and not about a
        curve.
      nearby_object_control: >-
        THE OTHER FIVE SEXTIC TWISTS at the SAME 256-bit prime - same p, same
        (a, b), same j-invariant 0, same CM discriminant, same automorphism
        group, DIFFERENT order. The instrument must return a different N for each
        and must FAIL the [N]G test when handed the wrong one. This is the
        sharpest possible control, differing in one structural bit and nothing
        else, and it is available at FULL SIZE at zero cost. SECOND NEARBY OBJECT
        FOR C3 AND C4 - a curve with j not equal to 0 at matched size, where beta
        does not exist; the sextic-class instrument must REFUSE rather than return
        a number, and the measured ratio must collapse to 1 against the negation
        baseline. THIRD, AND SUPPLIED BY THE MIRROR - NIST P-256 and ANSSI
        FRP256v1, real 256-bit curves with |Aut| equal to 2 and the same published
        rho cost, which are the rows that make the C3 residual pattern
        interpretable.
    proof_obligations:
      - claim: >-
          p congruent to 1 modulo 3 implies p is representable as a^2 + 3b^2 and
          Cornacchia's descent finds the representation in O(log^2 p) bit
          operations after one modular square root.
        responsibility: correctness
      - claim: >-
          The six associates of pi in Z[omega] give traces
          {plus or minus 2a, plus or minus (a + 3b), plus or minus (a - 3b)} and
          each satisfies 4p - t^2 equal to 3 times a square, verified by the
          three expansions stated in C1.
        responsibility: correctness
      - claim: >-
          N prime, [N]G equal to the identity with G not the identity, and N
          greater than 4 sqrt(p) force #E equal to N and cofactor 1.
        responsibility: correctness
      - claim: >-
          The derived trace equals the trace published in the mirror's disc
          table, by exact integer comparison.
        responsibility: interface
      - claim: >-
          beta^3 equal to 1 in F_p and lambda^3 equal to 1 in Z/N, together with
          (beta x_G, y_G) equal to [lambda]G, establish that the endomorphism
          acts as [lambda] on all of G, because G is cyclic and generated by G;
          and 6 divides N - 1, consistent with the mirror's (l-1)/6 cell.
        responsibility: correctness
      - claim: >-
          The rho instrument reproduces 1.2533 sqrt(N) classless and
          0.886 sqrt(N) with negation on a generic curve, within stated
          confidence intervals.
        responsibility: baseline
      - claim: >-
          The ideal sextic discount over the program's stated 0.886 convention is
          sqrt(3), not sqrt(6), because the convention already contains sqrt(2).
        responsibility: strictness
      - claim: >-
          Every F_p-rational endomorphism acts as a scalar on the prime-order
          subgroup, so the endomorphism-augmented point loses no information.
        responsibility: scope
      - claim: >-
          The GLV lattice basis change preserves covolume N, so a two-dimensional
          claw or kangaroo search over it costs sqrt(N).
        responsibility: size
      - claim: >-
          The fast walk engine agrees with harness/toycurve.py on 10^4 random
          inputs before any measurement.
        responsibility: interface
      - claim: >-
          Every mirror value used is read from tables/*.tsv or pages/*.html and
          never from pages/*.txt, with the authority tier recorded per value.
        responsibility: scope
    not_applicable_reason: null

