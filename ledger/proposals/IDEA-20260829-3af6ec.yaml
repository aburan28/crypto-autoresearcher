      direction: different
      minimum_effect: >-
        PREDICTED SMALL AND UNIFORM ACROSS ALL FIVE ROWS, within about 0.2 bits,
        INCLUDING the j equal to 0 row. THE DISCRIMINATOR AND ITS TWO MEANINGS. A
