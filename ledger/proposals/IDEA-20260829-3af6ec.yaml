  id: IDEA-20260829-3af6ec
  question_id: RQ-SCURVE-1c58ec
  goal_id: GOAL-SCURVE-3d5b30
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE j EQUAL TO 0 SEXTIC-ORBIT INSTRUMENT FOR secp256k1 - derive the group
    order from p by solving p = a^2 + 3b^2 and testing the six CM candidate
    traces, cross-checking against the trace the in-repository SafeCurves mirror
    publishes; certify the GLV endomorphism by exhibiting (beta, lambda) with an
    independent recomputation; MEASURE the achieved automorphism-adjusted rho
    discount and test whether the mirror's published rho cost of 2^127.8 for this
    row omits the order-six discount; and CLOSE the endomorphism-attack lane with
    a named obstruction, an argument, and forward guidance rather than a fatigue
    report
  class: composition

  claim: >-
    secp256k1 IS THE FAMILY'S MOST EXCEPTIONAL ORDINARY ROW AND THIS PROGRAM'S
    LEDGER HOLDS NOTHING ABOUT IT. It has j-invariant 0, complex multiplication
    by discriminant -3, an efficiently computable order-three endomorphism, an
    automorphism group of order six rather than the generic two, cofactor one,
    and an economic deployment larger than any other curve in the manifest. A
    2026-08-29 grep finds four files in knowledge/ mentioning it, none carrying a
    parameter, and ZERO proposals filed against RQ-SCURVE-1c58ec. The SafeCurves
    mirror at inputs/SAFECURVES-20260825/ publishes this row's trace, CM
    discriminant, embedding degree, cofactor, twist cofactor, twist subgroup
    order and rho cost - I read all of them on 2026-08-29 - but publishes no
    witness for any of them, and the goal's next_action records the deficiency
    exactly: the producer had no shell and performed no arithmetic, so every
    stated numeric relation is a transcription plus A PENDING CHECK. Five
    separable sub-claims of decreasing rigour.

    (C1) THE ORDER IS DERIVABLE FROM p ALONE, INDEPENDENTLY OF THE PUBLISHED
    TRACE. For a curve with j equal to 0 over F_p with p congruent to 1 modulo 3,
    the CM norm form gives p = a^2 + 3b^2, solvable by one modular square root of
    -3 plus a Euclidean descent - Cornacchia's algorithm - in O(log^2 p) bit
    operations. The Frobenius then lies in Z[omega] with norm p, and its six
    associates give exactly six candidate traces, which I derive here so the
    derivation is checkable rather than recalled - writing pi = a + b sqrt(-3),
    the traces of pi, omega pi and omega^2 pi and their negatives are t in the set
    {2a, -2a, -(a + 3b), (a + 3b), -(a - 3b), (a - 3b)}, and each satisfies the CM
    identity because 4p - (2a)^2 = 3(2b)^2, 4p - (a + 3b)^2 = 3(a - b)^2, and
    4p - (a - 3b)^2 = 3(a + b)^2, all three verified by expanding p = a^2 + 3b^2.
    These six are the traces of the SIX SEXTIC TWISTS. Exactly one is the intake
    curve's, and WHICH one is decided not by a formula but by testing
    [p + 1 - t]G equal to the identity for a random point G on y^2 = x^3 + 7.
    With that N prime and N greater than 4 sqrt(p), Hasse uniqueness forces #E
    equal to N and the cofactor to be EXACTLY 1. THE RESULT MUST THEN EQUAL THE
    TRACE 432420386565659656852420866390673177327 PUBLISHED IN THE MIRROR'S
    tables/disc.tsv, and the cofactor must equal the 1 published in
    tables/twist.tsv. Agreement is a genuine consistency result between an
    offline derivation and a published compilation sharing no input but p;
    disagreement localises a defect and is reported, never reconciled by
    preference.

    (C2) THE GLV ENDOMORPHISM IS CERTIFIABLE IN THREE MODULAR EXPONENTIATIONS
    AND THE PROGRAM HOLDS NO SUCH CERTIFICATE FOR ANY CURVE, NOR DOES THE MIRROR.
    Exhibit beta in F_p with beta^3 equal to 1 and beta not equal to 1, and
    lambda in Z/N with lambda^3 equal to 1 and lambda not equal to 1, and verify
    that the map (x, y) to (beta x, y) - which is ONE field multiplication -
    agrees with the scalar multiplication [lambda]G computed by double-and-add in
    harness/toycurve.py. THE VERIFIER IS GENUINELY INDEPENDENT OF THE PROVER here
    in a way that is rare in this campaign - one side is a single multiplication,
    the other is 256 doublings and additions, and they share no code path. A FREE
    CORROBORATION IS AVAILABLE - the mirror's tables/transfer.tsv gives this row's
    embedding degree cell in the form "= (l-1)/6", which presupposes that 6
    divides l - 1, which is precisely the condition for a nontrivial cube root of
    unity to exist in Z/l. That is an independent, published, one-division check
    on the existence half of C2.

    (C3) THE MIRROR'S PUBLISHED rho COST FOR THIS ROW MAY OMIT THE ORDER-SIX
    DISCOUNT, AND THAT IS A CHECKABLE CLAIM RATHER THAN A COMPLAINT.
    tables/rho.tsv gives 2^127.8 for secp256k1 - THE SAME VALUE IT GIVES FOR NIST
    P-256 AND FOR ANSSI FRP256v1, both of which are j not equal to 0 curves of the
    same size with automorphism group of order two. KN-TECH-018 records that this
    program's convention 0.886 sqrt(n) ALREADY INCLUDES the sqrt(2) negation
    discount; on a j equal to 0 curve the automorphism group has order six, so the
    IDEAL FURTHER discount over that convention is sqrt(3), which is 0.79 bits,
    predicting about 2^127.0. PRE-REGISTERED PREDICTION, STATED BEFORE THE
    EXPERIMENT - evaluating 0.886 sqrt(N) on the derived N reproduces the mirror's
    2^127.8 to within rounding for secp256k1, for NIST P-256 and for Curve25519
    alike, which would establish that the published column uses the negation-only
    convention uniformly and therefore does NOT credit this curve's extra
    structure. KN-TECH-018 ALSO records that negation walks require
    fruitless-cycle handling, so the ACHIEVED discount is expected to be strictly
    less than the ideal sqrt(3). NOBODY HAS MEASURED THAT GAP, for this or any
    curve, and no number for it exists in this program or in the mirror. This
    record measures it at 24, 32 and 40 bits on constructed j equal to 0 curves,
    across three arms and two nulls.

    (C4) THE ENDOMORPHISM-ATTACK LANE IS CLOSED, AT THE STANDARD
    docs/inventor-protocol.md SECTION 4 REQUIRES - a named obstruction, an
    argument, and forward guidance, not a count of rejected mechanisms. NAMED
    OBSTRUCTION - ENDOMORPHISM SCALARISATION ON A PRIME-ORDER SUBGROUP. ARGUMENT
    - the target group G is cyclic of prime order N; it is the unique subgroup of
    that order, so every F_p-rational endomorphism phi maps G into G; the
    endomorphism ring of a cyclic group of order N is Z/N, so phi acts on G as
    multiplication by an integer lambda_phi. CONSEQUENCE - the object
    "endomorphism-augmented point" (P, phi(P), phi^2(P), ...) equals
    (P, [lambda]P, [lambda^2]P, ...) and is fully recoverable from P and lambda.
    IT LOSES NOTHING. It is a change of coordinates, not a new object, and it
    fails the lossy-projection test of docs/inventor-protocol.md section 2 for
    exactly the reason the (Delta, Pi) example of KN-LIT-7595 fails it. The SAME
    argument applied to the GLV scalar decomposition k = k1 + k2 lambda mod N with
    |k1|, |k2| about sqrt(N) shows that map is a bijection onto a fundamental
    domain of a rank-two lattice of covolume N, so the two-dimensional search
    space has the SAME VOLUME N as the one-dimensional one and any claw-finding or
    kangaroo decomposition over it costs sqrt(N) again. THE ONLY GENUINELY LOSSY
    QUOTIENT AVAILABLE IS BY THE FINITE AUTOMORPHISM GROUP, of order six, and
    quotienting a search space by a group of order m buys at most sqrt(m).
    Therefore no attack that tracks endomorphism images of a SINGLE point can move
    the exponent 1/2 on this curve, and C3's constant is the whole of what the j
    equal to 0 structure buys in that class. FORWARD GUIDANCE is in
    interpretation_limits and names three classes that remain open.

    (C5) WHAT IS NOT CLAIMED. No attack, no weakness, no exponent movement, and
    nothing that bears on the security of any deployed system. The sqrt(3) is a
    constant factor and per docs/target-result-profile.md this record is
    explicitly NON-TARGET-CLASS; its priority rests on being a cheap building
    block that converts published values into re-verified ones, on producing the
    program's first measured rho constant, and on C4 telling the program where not
    to look - never on ambition.

  mechanism: >-
    OBJECT-FIRST GENERATION AGAINST A HEAVILY MINED TARGET, per
    docs/inventor-protocol.md sections 1 and 2. secp256k1 is among the most
    analysed curves in existence, which is exactly the condition under which
    KN-LIT-7594 records premature closure as the binding failure mode; this
    record therefore enumerates objects before ideas and declines to conclude
    saturation. STANDING CAVEAT - this program has no written object enumeration
    for the ECDLP, that is KN-OPEN-019, so the mapping below is a SKETCH and not
    a taxonomy.

    ESTABLISHED FAMILIES, NAMED AND DECLARED OFF-LIMITS AS THE PRIMARY LENS FOR
    THIS SESSION - (F1) the bare point walked by rho and kangaroo; (F2) the
    endomorphism-augmented point, which is GLV and GLS; (F3) the pairing image,
    which is MOV and Frey-Ruck and which the mirror confirms is inapplicable here
    by publishing an embedding degree of (l-1)/6; (F4) the formal-group logarithm
    coordinate, which is the additive transfer and is inapplicable off trace one;
    (F5) summation-polynomial and factor-base objects, which are index calculus
    and Weil descent.

    CANDIDATE OBJECTS, SCORED ON THE THREE AXES.
    (O1) THE SEXTIC ORBIT CLASS - a point modulo the order-six automorphism group
    generated by negation and the GLV map. NEW IN THIS PROGRAM as an implemented
    object, though the technique is textbook (KN-TECH-018). CONCRETELY TESTABLE -
    its one-step propagation is the induced map on classes and its cost is a
    measurable step count. SURVIVES until fruitless cycles dominate, which is a
    MEASURABLE dissolution point rather than an algebraic one, and measuring it
    is C3. CHOSEN as the experimental object.
    (O2) THE SIX-ELEMENT TRACE MULTISET of the sextic twist family, projected
    from p alone by the CM norm form. NEW - nothing in the corpus derives a curve
    order from a norm form, and the mirror publishes ONE trace per row rather than
    the six-element family. CONCRETELY TESTABLE by [N]G against a published
    target. SURVIVES every isogeny and every model change. CHOSEN as the
    certification object.
    (O3) THE ENDOMORPHISM-AUGMENTED POINT. FAILS THE LOSSY-PROJECTION TEST - see
    C4 - and that failure is a deliverable, not a discard. Recorded, argued, and
    closed.
    (O4) THE GLV SCALAR PAIR (k1, k2). FAILS for the same reason - a unimodular
    change of basis preserving covolume. Recorded and closed.
    (O5) THE lambda-INVARIANT FACTOR BASE for index calculus. Genuinely
    different, since lambda acts non-diagonally on a MULTI-point relation and the
    projection is therefore not obviously a change of coordinates. NOT PROPOSED
    HERE - it needs summation-polynomial machinery this environment does not have
    and its known gains are constant-factor - but it is named as the leading open
    direction rather than left out.
    (O6) THE CLASS-GROUP ACTION on the CM order, moving between curves in the
    isogeny class. Recorded as open; its known obstruction is that F_p-isogenies
    preserve #E, which IDEA-20260807-98a970's reachability gate already states.

    LOSSY-PROJECTION TEST ON O1, applied before any experiment and costing no
    compute.
    WHAT IS DISCARDED - which of the six points {P, -P, [lambda]P, -[lambda]P,
    [lambda^2]P, -[lambda^2]P} is held. Exactly log2(6) bits, which is 2.585
    bits, are destroyed per point.
    IS IT A CHANGE OF COORDINATES? NO, and the fibre is exhibitable and has size
    exactly six for every point outside the identity - a genuinely non-trivial,
    constant-size fibre, unlike the (Delta, Pi) example of KN-LIT-7595 whose
    fibre is a singleton. The loss is SMALL, and the record says so - this is a
    weakly lossy projection, which is precisely why its gain is a constant factor
    and not an exponent, and that correspondence between loss size and gain size
    is itself worth stating.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? The operation is scalar
    multiplication, and the answer is yes and exactly so - lambda acts as a
    scalar on G, so [k]([lambda]P) equals [lambda]([k]P), the automorphism group
    action COMMUTES with the group operation, and the class of [k]P is a
    deterministic function of the class of P and of k. PASSES.
    WHERE THE STRUCTURE DISSOLVES - at fruitless cycles, where the class walk
    returns to a previously visited class without a genuine collision, and the
    measured rate of those is C3's principal metric.

    LOSSY-PROJECTION TEST ON O3 AND O4, WHICH IS THE CHEAPEST RESULT IN THIS
    RECORD AND COSTS NOTHING AT ALL. Both are BIJECTIONS - O3 because lambda is a
    known scalar, O4 because the GLV lattice basis is unimodular up to a bounded
    constant and preserves covolume N. Nothing is discarded, so nothing is
    gained. This is exactly the test docs/inventor-protocol.md section 2 says is
    the cheapest available answer to "is this actually new", and applying it
    BEFORE any compute is what distinguishes this record from a fatigue report.

    WHAT THE MIRROR CHANGES AND WHAT IT DOES NOT. inputs/SAFECURVES-20260825/ has
    carried the SafeCurves pages, fifteen derived per-page TSV tables and thirteen
    specification documents since 2026-08-25, and I read this row's cells in
    tables/disc.tsv, transfer.tsv, rho.tsv, twist.tsv and index.tsv on 2026-08-29.
    So nothing here is motivated by those values being unavailable. What the
    mirror does NOT supply is (a) any witness this program can re-verify, (b) the
    six-element trace family, (c) any endomorphism certificate, beta or lambda,
    (d) the conductor, (e) any measured rho constant as opposed to an evaluated
    one, and (f) any statement of the scalarisation closure. The record's value
    moves from ACCESS to VERIFICATION AND MEASUREMENT, which is a smaller claim
    honestly stated - and C3 in particular becomes STRONGER, because a published
    2^127.8 sitting beside an identical 2^127.8 for two non-CM curves of the same
    size turns a vague question about conventions into a sharp reproduction test.
    READING DISCIPLINE, BINDING. The mirror carries a documented defect,
    MIRROR-DEF-1 in source_record_addendum_01.yaml - the pages/*.txt renderings
    strip tags, COLLAPSING EMPTY TABLE CELLS and blurring row boundaries, with the
    confirmed instance being the M-383 row of pages/rigid.html whose comments cell
    is empty while the adjacent Curve383187 row carries one. THE RECORDED
    AUTHORITY ORDER IS pages/*.html and specs/* FIRST, tables/*.tsv NEXT,
    pages/*.txt LAST and prose only. Every mirror value in this record came from
    tables/*.tsv, the SECOND tier; load-bearing cells must be re-read from
    pages/*.html before the claim is filed; no value may be sourced from a .txt
    rendering. The `rigid` criterion is specifically implicated by the recorded
    defect instance, so no statement about this row's rigidity cell is made here
    at all.

    HOW THIS DIFFERS FROM IDEA-20260807-98a970, WHICH RQ-SCURVE-1c58ec NAMES AS
    AN INTERNAL DEPENDENCY WITH A NONDUPLICATION RULE. That record's object is
    ord_N(p), its lane is the multiplicative transfer, its inputs are TRANSCRIBED
    from primary standards documents, and it lists secp256k1 as one row among
    fifteen. This record's objects are the sextic orbit class and the trace
    multiset, its lanes are disc and rho, and it DERIVES N rather than
    transcribing it. The two are complementary on the same curve and this record
    SPECIALIZES rather than re-mints; it also supplies 98a970 with a derived N for
    this row, and the mirror independently supplies 98a970's expected answer,
    which is that the embedding degree here is (l-1)/6 and therefore enormous.

    EXECUTION. Step 1, the norm form and the six traces, compared against the
    published trace. Step 2, the order and GLV certificates. Step 3, the rho
    measurement with three arms and two nulls, plus the published-column
    reproduction. Step 4, the closure note.

