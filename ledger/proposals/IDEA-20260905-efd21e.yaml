    direction: different
    minimum_effect: Two equal-marginal processes have different completion costs; the conditional drift certificate
      distinguishes them and exposes infinite or heavy-tail cases.
  minimal_test:
    design: 'Compare exact finite-state rank processes on visible 4-dimensional vector spaces: independent uniform
      rows, cheap redundant rows and expensive independent rows. The same marginal success rates are arranged with
      different state dependence.'
    proposal_only: true
    controls:
    - type: matched_null
      description: Independent uniform rows with the same cost marginal and support size.
    - type: known_false
      description: A process returning the same nonzero row forever has success probability one but never reaches
        full rank; any finite completion estimate must reject it.
