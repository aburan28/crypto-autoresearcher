idea:
  id: IDEA-20260811-d69ebe
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  axis: A5
  claim_tier: toy
  title: >-
    Both recorded closures of the X_1(N) fibre coordinate are GALOIS-theoretic and every
    fibre point is F_p-rational, so neither bounds the quantity that actually decides the
    lens: the minimal ALGEBRAIC DEGREE D_min(N, d) of a polynomial in the Tate-normal-form
    coordinates that is constant on the cosets of the index-d subgroup of the deck group.
    That quantity has an exactly computable null value Theta(sqrt(N)) from dimension
    counting, is measurable to N in the thousands with 250-by-351 linear algebra, and its
    prize is exactly a factor sqrt(d) in rho -- so an exponent needs d = N^{Omega(1)}, not
    one bit. Plus: IDEA-20260806-0c9de1 (D)'s claim that intermediate covers have "no
    analogue in the prime case" is incorrect, and that is the gap this record occupies
  class: measurement
  claim: |-
    (A) THE SETTING, TAKEN AS GIVEN FROM TWO EXISTING RECORDS AND NOT RE-DERIVED. An ECDLP
    instance (E, P, Q = [k]P) with N prime is a pair of F_p-points of X_1(N) over one point
    of X_0(N), and k is the coordinate of the (Z/N)^*/{+-1}-torsor of that fibre, with the
    deck group acting by diamond operators <d> : (E, P) |-> (E, [d]P). This is
    IDEA-20260806-0c9de1 (A), read in full this session and taken as an input. The same
    coordinate seen from characteristic zero is IDEA-20260808-5158fa (A).

    (B) THE GAP, STATED PRECISELY. The two recorded closures are:
      0c9de1 F1: a torsor with a rational point is trivial, so Galois descent gives 0 bits;
      0c9de1 F2: a diamond-INVARIANT function of a single fibre point is constant on fibres;
      0c9de1 F3: the congruence relation involves only the public diamond <p>;
      5158fa (B): pi = 1 mod n, so the Artin symbol at p is trivial, p splits completely in
        the ray class field, and no Frobenius-, splitting-, residue-degree- or
        ramification-derived invariant separates the fibre, INCLUDING every order-l quotient
        character.
    Every one of these is a statement about GALOIS-EQUIVARIANT ACCESS. And every fibre point
    is F_p-RATIONAL by hypothesis, which is exactly why Galois cannot separate them. But a
    polynomial function does not need Galois to separate rational points: a plane curve's
    F_p-points take different values under almost any polynomial. NEITHER CLOSURE BOUNDS THE
    ALGEBRAIC COMPLEXITY OF A SEPARATING FUNCTION, and that is the quantity the lens actually
    turns on.

    (C) THE ERROR THIS RECORD OCCUPIES. IDEA-20260806-0c9de1 (D) states, as forward guidance:
    "F2 assumes N PRIME ... For composite N the fibre is a torsor under (Z/N)^*/{+-1} which
    is not cyclic, and its subgroup structure gives intermediate covers
    X_1(N) -> X_Delta(N) -> X_0(N) that have no analogue in the prime case". THAT IS
    INCORRECT AS STATED. For N prime, (Z/N)^* is CYCLIC OF ORDER N - 1, and a cyclic group
    has exactly one subgroup of index d for EVERY divisor d of its order. Since N - 1 is even
    for N > 2, the index-2 subgroup (the quadratic residues) always exists, and intermediate
    covers X_Delta(N) exist for every d | (N-1)/2. [fact, elementary.] Cyclic means "one
    subgroup per divisor", not "no subgroups". The prime case is therefore not the poor case
    but the RICH one whenever N - 1 is smooth. This record is filed to occupy exactly the
    region that sentence closed prematurely, and it also repairs F2's dichotomy: F2 splits
    functions into "diamond-invariant" (constant on fibres) and "not invariant" (a function
    of P, i.e. the original representation), omitting the intermediate class
    "Delta-invariant for a proper nontrivial Delta", which is neither constant on the fibre
    nor a function of P alone -- and is precisely where fibre information lives.

    (D) THE TRACKED OBJECT AND ITS LOSSY-PROJECTION TEST, DONE BEFORE ANY EXPERIMENT.
    Tracked object: the image of the marked pair in X_Delta(N), i.e. THE COSET k*Delta_d in
    (Z/N)^*/Delta_d.
      LOSSY? Yes: it retains log_2(d) bits of k and discards the remaining
      log_2((N-1)/(2d)) bits. It is not a change of coordinates.
      DISCARDED COMPATIBLY? Yes: the diamond action descends to the quotient
      (Z/N)^*/Delta_d, so the retained coset propagates deterministically under every
      operation the object admits. This is the condition docs/inventor-protocol.md section 2
      requires, and it is met.
      CONTRAST, RECORDED HONESTLY: the Tate-normal-form pair (b, c) itself is NOT a valid
      tracked object -- it determines (E, P) up to isomorphism, so it discards nothing and is
      a change of coordinates by the section-2 test. The record tracks the COSET, not the
      point, for exactly this reason.

    (E) THE MEASURABLE QUANTITY, WITH ITS NULL VALUE DERIVED IN ADVANCE. For (E, P) with
    ord(P) = N >= 4 the Tate normal form gives unique coordinates (b, c) with
    E : y^2 + (1-c)xy - by = x^3 - bx^2 and P = (0, 0), computable from (E, P) in O(log p)
    field operations [recall-confident, classical; verified by substitution in Stage 0].
    Define
        D_min(N, d) := the least total degree D such that some nonzero F in F_p[b, c] of
                       degree <= D is CONSTANT on each Delta_d-coset of the fibre
                       {(b_i, c_i) : i in (Z/N)^*/{+-1}} and NON-constant across cosets.
    NULL VALUE, DERIVED, NOT MEASURED: coset-constancy imposes ((N-1)/2 - d) independent
    linear conditions on the coefficient vector of F, and the space of polynomials of degree
    <= D has dimension (D+1)(D+2)/2. For a fibre embedded by a RANDOM injection into
    A^2(F_p), a solution first appears when (D+1)(D+2)/2 exceeds (N-1)/2 - d + 1, i.e. at
    D_min = Theta(sqrt(N)). [fact, dimension count.] THE EXPERIMENT IS THE COMPARISON OF THE
    MODULAR FIBRE AGAINST THAT NULL.
      OUTCOME 1, D_min = Theta(sqrt(N)) matching the null: no low-degree Delta-invariant
        exists AT ALL, so the algebraic-complexity axis is CLOSED unconditionally -- not
        "no known construction", but "no such function of low degree exists". That is a
        strictly stronger closure than either recorded Galois closure and it is the likely
        outcome.
      OUTCOME 2, D_min = O(polylog N) or any growth materially below sqrt(N): the axis is NOT
        closed. This does NOT constitute an attack, because constructing F by interpolation
        requires knowing the whole fibre, which costs N; the follow-up question becomes
        whether F has a closed form computable without the fibre. The record states this
        in advance so that a positive cannot be over-read.

    (F) THE PRIZE, PRICED EXACTLY, WHICH LOWERS RATHER THAN RAISES EXPECTATIONS. Suppose an
    oracle returned the coset of k in (Z/N)^*/Delta_d. The search space shrinks by the factor
    d, so parallel Pollard rho drops from 0.886*sqrt(N) to 0.886*sqrt(N/d): THE ORACLE IS
    WORTH EXACTLY A FACTOR sqrt(d). Consequences, all stated as conditionals about a
    hypothetical oracle and none as a claim about any candidate:
      (F1) d = 2 -- one bit -- is worth a factor sqrt(2). A CONSTANT, not an exponent, and
        therefore explicitly low priority under the program's exponent-first bias.
      (F2) An exponent requires d = N^{Omega(1)}: the target is not "a bit of k" but a
        character of polynomially large order.
      (F3) The full ladder for every d | (N-1)/2 would reduce the cost to
        O~(sqrt(l_max(N-1))), where l_max is the largest prime factor of N - 1 -- polynomial
        time when N - 1 is smooth. This is Pohlig-Hellman applied to the DECK group, of order
        N - 1, not to the point group, of PRIME order N. The two have unrelated smoothness
        profiles, and that observation -- that the campaign's central group has prime order
        while the group in which the answer naturally lives does not -- is recorded here as
        the reason the ladder is worth pricing at all.

    (G) A SECOND, INDEPENDENT DELIVERABLE: THE CHARACTER ORACLE IS NOT GGM-SIMULABLE, AND
    THAT IS NOT ENOUGH. Let chi_d-ORACLE be the oracle of (F). In the generic group model the
    adversary's transcript is independent of k until a collision occurs, so any algorithm
    making q group-operation queries guesses any nontrivial function of k with advantage at
    most O(q^2 / N) above chance. Hence NO SIMULATOR EXISTS for chi_d with d >= 2. This
    EXTENDS KN-FIND-b7e091 in the direction its own scope invites -- that finding closed the
    incidence and endomorphism-image oracle classes as SIMULABLE; here is an oracle class
    that is provably NOT -- and it is filed as an extension, never as a revisit. The
    methodological point is the pairing of (G) with (F): non-simulability is necessary and
    very far from sufficient, since the non-simulable chi_2-oracle is worth only sqrt(2).
    Axis A4 (TASK-20260811-c439c2, lane L12/RQ-GGMB-6eaabc) is the owner of the simulability
    question and this is handed to it as a concrete candidate, not adjudicated here.

    (H) WHAT IS NOT CLAIMED. No attack, no speedup, no exponent, sota_delta zero. The record
    does not claim a Delta-invariant function of low degree exists; it predicts the opposite
    and proposes the cheapest measurement that could establish it.
  mechanism: |-
    Why the algebraic-degree axis is a different axis from the Galois one, in one paragraph.
    A Galois-theoretic obstruction says: the arithmetic of the field cannot tell two points
    apart. That is a statement about the ACTION OF Gal(F_p-bar / F_p) on the fibre, and when
    all fibre points are rational the action is trivial and the obstruction is automatic --
    which is precisely what 0c9de1's F1 and 5158fa's (B) each prove, from opposite sides. An
    algebraic obstruction says: no low-degree function separates the cosets. That is a
    statement about the GEOMETRY of the embedded point set, and rationality is irrelevant to
    it: the (N-1)/2 fibre points are (N-1)/2 distinct points of A^2(F_p) and any set of
    distinct points is separated by SOME polynomial. The only question is the DEGREE, and the
    dimension count in (E) fixes exactly what degree a structureless point set requires. The
    modular fibre either beats that count or it does not; nothing in either recorded closure
    predicts which, because neither is about degree.
    Why the measurement is cheap. Coset-constancy is a linear condition on coefficients, so
    D_min is computed by ranks of matrices with (N-1)/2 rows and (D+1)(D+2)/2 columns. At
    N = 2003 that is 1001 by 351 over F_p, milliseconds. The fibre is built with (N-1)/2
    point additions and (N-1)/2 Tate-normal-form conversions, each O(log p). The whole sweep
    over N up to a few thousand and d over the divisors of (N-1)/2 is minutes.
  why_not_a_renamed_known_approach: |-
    It is not a renaming of 0c9de1: that record measures a HECKE SEPARATION STATISTIC with a
    derived forced value of zero, and closes three GALOIS families. This record measures an
    ALGEBRAIC DEGREE with a derived null value of Theta(sqrt(N)), and closes -- or fails to
    close -- a family that 0c9de1 explicitly excluded from consideration by an incorrect
    parenthetical about the prime case. It is not a renaming of 5158fa: that record works in
    characteristic zero and closes the same Galois families from the ray-class side. It is
    not a renaming of BSGS: at the null value D_min = Theta(sqrt(N)) the construction cost of
    the invariant is Theta(N), i.e. WORSE than BSGS, which is exactly why Outcome 1 is a
    closure rather than an alternative algorithm; the record says so rather than presenting
    sqrt(N)-degree interpolation as a method.
  resource_label: >-
    R1 (x-coordinates as field elements -- the invariant is a polynomial in field-element
    coordinates, which is the resource that escapes the generic group model) and R2 (the
    curve model). TAXONOMY ARGUMENT, MADE EXPLICITLY BECAUSE THE COMPLETION GATE INVITES IT:
    R2 as written in DECOMPOSITION.md section 2 is "the curve equation (a,b) / model", i.e.
    a coordinate of the UNMARKED curve, and every such coordinate is k-independent by the L7
    obstruction ("k is information about a point, not about the curve"). The Tate normal form
    is the model of the MARKED PAIR (E, P), and it is the only coordinate anywhere in the
    R1-R8 table that is not k-independent. This record proposes that the taxonomy gain a
    named sub-entry -- R2m, "the model of a marked pair / level structure as a coordinate" --
    and notes that its absence is a concrete instance of this batch's pre-registered
    hypothesis that the taxonomy indexes resources applied to one curve's point group and
    cannot express objects outside that indexing. The Coordinator, not this record, decides
    whether the taxonomy changes.
  admissibility: admissible
  predictions:
  - observable: D_min for the modular fibre versus the random-injection null
    metric: >-
      D_min(N, d) for prime N in a sweep up to a few thousand and d over the divisors of
      (N-1)/2, measured identically on (i) the Tate-normal-form fibre and (ii) a random
      injection of a set of the same size into A^2(F_p)
    predicted: >-
      the ratio D_min(modular) / D_min(null) equals 1.00 +- sampling noise, i.e. the modular
      structure buys nothing in degree. A ratio below 0.5 sustained over at least a decade of
      N is the falsifier and is a genuine positive result.
  - observable: null calibration
    metric: the fitted exponent in D_min(null) ~ c * N^alpha
    predicted: >-
      alpha = 0.5 exactly, from the dimension count. If the measured null does not reproduce
      alpha = 0.5 the instrument is wrong and no comparison may be made -- this is the
      instrument's own calibration and it is a hard gate.
  - observable: planted-signal recovery
    metric: >-
      D_min measured on a fibre deliberately embedded so that a degree-3 Delta-invariant
      exists by construction
    predicted: >-
      exactly 3. A planted invariant that the search fails to find means the search is not
      searching, and every negative from the real arm is void.
  - observable: dependence on the divisor structure of N - 1
    metric: >-
      D_min(N, d) as a function of d for fixed N, across primes N with N - 1 smooth versus
      N - 1 having a large prime factor
    predicted: >-
      no dependence beyond the dimension count's explicit d-term. A systematic dependence on
      the smoothness of N - 1 would be structure the null cannot produce and would be the
      most interesting outcome available.
  - observable: the known non-degenerate case
    metric: >-
      for instances with N | p - 1, whether the Tate self-pairing supplies a separating
      function and at what cost
    predicted: >-
      it does, at O(log p) -- confirming the method ceiling and providing the nearby-object
      control where the record's own predicted conclusion is FALSE.
  minimal_test:
    design: |-
      Toy, single machine, minutes to a small number of CPU-hours, no attack.
      STAGE 0 (zero compute, HARD GATE): verify the Tate normal form by direct substitution,
        and verify the dimension count of (E) symbolically. If the null value is not
        Theta(sqrt(N)) the whole comparison is misconceived.
      STAGE 1 (minutes, HARD GATE): for p of 20-30 bits and prime N | #E(F_p) with N from 11
        to a few thousand, build the fibre {(b_i, c_i)} for i in (Z/N)^*/{+-1} and verify by
        exhaustive check that the diamond action on it matches multiplication of the index i,
        i.e. that the dictionary is right. Any mismatch halts everything.
      STAGE 2 (minutes): for each d | (N-1)/2, compute D_min by ranks of the coset-constancy
        linear systems, increasing D until a non-degenerate solution appears.
      STAGE 3 (minutes): identical computation on the random-injection null at matched sizes,
        with at least 10 independent null draws per (N, d) so the comparison has an error bar.
      STAGE 4 (minutes): planted-signal arm.
      STAGE 5 (minutes): the k_emb = 1 nearby-object arm.
      STAGE 6 (zero compute): report the ratio table, the fitted exponents, and -- whatever
        the outcome -- the sqrt(d) prize accounting of (F), so that no number in the table can
        be read as larger than it is.
    controls:
    - >-
      NULL OBJECT (matched shape, structure destroyed): a uniformly random injection of a set
      of size (N-1)/2 into A^2(F_p), carrying the same abstract Delta_d-coset labelling. This
      is the primary control and the entire claim is the modular-versus-null ratio, never the
      absolute D_min.
    - >-
      SECOND NULL (structure partially preserved): the fibre points of a RANDOM plane curve
      of comparable degree, labelled by a random simply transitive cyclic action. This
      separates "lying on a low-degree curve" from "lying on the modular curve", and without
      it a low D_min could be an artifact of the points being collinear-ish on any curve.
    - >-
      PLANTED SIGNAL (two-directional control, mandatory): a fibre embedded so that a
      degree-3 Delta-invariant exists by construction; the search must return exactly 3.
    - >-
      INSTRUMENT NULL: d = (N-1)/2, where Delta is everything and every function is
      trivially coset-constant, so D_min must be 0 or 1 by definition; and d = 1, where
      coset-constancy is vacuous and the non-constancy requirement alone binds.
    - >-
      NEARBY-OBJECT CONTROL: instances with N | p - 1, where a separating function DOES exist
      (the Tate self-pairing). The pipeline is not required to find it as a polynomial in
      (b, c), but the record must state whether it does, and a pipeline that reports "closed"
      identically for k_emb = 1 and k_emb > 1 has not used the non-degeneracy hypothesis.
    required_metrics:
    - 'D_min(N, d) for the modular fibre, per (N, d)'
    - 'D_min for both nulls, with 10+ draws and an error bar, per (N, d)'
    - the ratio modular/null and the fitted exponents alpha for each arm
    - planted-signal recovered degree
    - dictionary verification pass/fail per N
    - the smoothness profile of N - 1 per instance, recorded alongside every D_min
  controls:
  - >-
    See minimal_test.controls. Two are load-bearing: the RANDOM-CURVE second null, without
    which a low D_min cannot be attributed to modularity rather than to lying on any
    low-degree curve; and the PLANTED SIGNAL, without which a null result is a report about
    the search rather than about the object.
  confounders:
  - >-
    Degenerate fibre embeddings. If two fibre points share a coordinate, or if the fibre lies
    in a line, the linear system degenerates and D_min collapses for an uninteresting reason.
    Both must be tested for and reported per instance.
  - >-
    The +-1 quotient. Working modulo signs halves the fibre and changes the dimension count
    by a constant; applying it inconsistently between the modular and null arms would create
    a spurious ratio.
  - >-
    Small N. For N below about 100 the dimension count has no asymptotic content and D_min is
    a small integer; the fit must exclude these and the exclusion must be declared before the
    fit, not after.
  - >-
    D_min is a statement about EXISTENCE of a low-degree invariant, not about
    CONSTRUCTIBILITY. Interpolating F requires the whole fibre, costing N. Any write-up that
    reports a low D_min without repeating this sentence is overclaiming, and the record makes
    the sentence part of the required output.
  - >-
    p versus N. The fibre lives in A^2(F_p) with p much larger than N, so the points are
    sparse and the dimension count is the binding constraint rather than any counting bound
    over F_p. Instances with p close to N must be excluded.
  falsification_conditions:
  - >-
    The null arm does not reproduce alpha = 0.5. The instrument is wrong; no comparison is
    recorded and the run halts.
  - >-
    The planted signal is not recovered at degree 3. The search is broken; every negative is
    void.
  - >-
    The dictionary check in Stage 1 fails on any instance. The Tate-normal-form
    identification of the fibre is wrong and the record is superseded, not amended.
  - >-
    D_min(modular) / D_min(null) below 0.5 sustained over a decade of N, with both nulls
    behaving as predicted. The algebraic-degree axis is NOT closed. PAUSE CONDITION P3
    APPLIES if any resulting cost estimate would approach the automorphism-discounted rho
    baseline: the number is NOT to be stated in any record; the finding is flagged and handed
    to the Coordinator for an independent review-adversarial session.
  - >-
    D_min(modular) / D_min(null) = 1 within noise across the whole sweep. The axis is CLOSED,
    with the mechanism "the modular fibre is, in algebraic degree, indistinguishable from a
    structureless point set of the same size" -- and this is the predicted and most valuable
    likely outcome.
  interpretation_limits:
  - >-
    Toy scale only, N up to a few thousand, p up to 30 bits, and the conclusion is scoped to
    the Tate-normal-form coordinates and to total-degree polynomials. A different coordinate
    system, or a different complexity measure (circuit size, straight-line programs), is a
    different measurement and is untouched.
  - >-
    Outcome 1 closes the ALGEBRAIC-DEGREE axis for these coordinates. It does not close the
    modular representation, which 0c9de1's own interpretation_limits already scope, and it
    does not say anything about the ECDLP.
  - >-
    (F)'s prize accounting is a conditional about a hypothetical oracle. It is not a claim
    that any such oracle exists, and its main function is to LOWER the expected value of the
    whole direction by showing that one bit is worth sqrt(2).
  - >-
    (G) is a generic-group statement about an oracle class. It is an EXTENSION of
    KN-FIND-b7e091, offered to lane L12/axis A4, and it adjudicates nothing there.
  assumptions:
  - E/F_p, p > 3, N prime with N || #E(F_p), N >= 11, Aut(E) = {+-1} so the diamond action is free.
  - >-
    'The Tate normal form: any (E, P) with ord(P) >= 4 has a unique model
    y^2 + (1-c)xy - by = x^3 - bx^2 with P = (0,0), and (b, c) are coordinates on X_1(N)
    [recall-confident, classical; VERIFIED BY SUBSTITUTION in Stage 0 rather than assumed].'
  - >-
    'X_1(N) -> X_0(N) is Galois with group (Z/N)^*/{+-1} acting by diamond operators
    [taken as an input from IDEA-20260806-0c9de1 (A), which is a committed record of this
    program; not re-derived].'
  - '(Z/N)^* is cyclic of order N - 1 for N prime. [fact]'
  - >-
    'The generic-group transcript is independent of k until a collision, giving advantage
    O(q^2/N) for any nontrivial predicate of k [recall-confident: Shoup; corpus KN-TECH-005;
    NOT re-verified this session].'
  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For prime N and a fixed prime p >> N, the (N-1)/2 Tate-normal-form coordinate pairs of
      the fibre {(E, [i]P)} are, with respect to the minimal-degree-of-a-coset-invariant
      statistic, distributed as (N-1)/2 points drawn uniformly and independently from
      A^2(F_p), uniformly over d | (N-1)/2 with d <= N^{1/2}.
    rigorous_support: >-
      The dimension count is rigorous: coset-constancy is exactly ((N-1)/2 - d) linear
      conditions and the polynomial space has dimension (D+1)(D+2)/2, so D_min >= the value
      forced by the count for ANY point set, and equality holds for a set in general position.
      The assumption is only that the modular fibre is in general position with respect to
      this family of linear conditions -- the same shape as "a specific integer behaves like a
      random integer of its size".
    distribution_imitated: >-
      General position of a structured point set with respect to a linear system of
      conditions; the discrete analogue of the transversality heuristics used throughout
      computational algebraic geometry, and the direct counterpart of the smoothness
      heuristics the exemplar uses (a specific object behaves like a random one of its size).
    validation_plan: >-
      This record's minimal test IS the validation: measure D_min on the modular fibre and on
      10+ random-injection draws at each of >= 30 primes N spread over a decade, with p of
      20-30 bits, and compare the fitted exponents and the per-(N,d) ratios. Predicted
      distribution: identical to the null within sampling error. SAMPLED PARAMETERS: prime N
      in [11, ~3000] with N | #E(F_p), p in [2^20, 2^30], d over all divisors of (N-1)/2 up
      to sqrt(N). TRANSFER ASSUMPTION, STATED: nothing here extends to cryptographic N, where
      the fibre cannot be enumerated, and the record makes no crypto-scale claim; a failure of
      HA-1 at toy scale would be informative, a success proves nothing at scale.
    tail_checks: >-
      Check the extreme cells: the smallest observed D_min over the whole sweep against the
      dimension-count lower bound (must never fall below it -- a violation is an
      implementation error, not a discovery), and the largest d for which a coset-invariant
      of degree below the null value is found (predicted: none).
  proof_search_map:
    bottleneck: >-
      D_min(N, d). Every proposal in the modular direction, including both recorded closures,
      turns on whether a cheap Delta-invariant function exists; the Galois arguments bound
      one family of constructions and leave the degree unbounded.
    baseline_embedding:
      parameter_slice: >-
        d = (N-1)/2, where the coset is the whole fibre and the invariant is the constant
        function -- the trivial slice, which must return D_min in {0, 1}. And d = 1, where
        the invariant must separate all (N-1)/2 points, reproducing plain interpolation at
        D = Theta(sqrt(N)) and cost Theta(N), i.e. WORSE than BSGS. Both endpoints are old
        methods and the framework must reproduce them exactly.
      reproduction_check: >-
        Symbolic for both endpoints, then computationally as the instrument null in Stage 2.
        An implementation that does not return 0 or 1 at d = (N-1)/2 is broken.
    observation_collision:
      observable: D_min(N, d), the minimal algebraic degree of a coset invariant.
      distinct_preimage_search: >-
        Sought explicitly, and it is the second null: a random plane curve of comparable
        degree carrying a random simply transitive cyclic labelling should have the SAME
        D_min as the modular fibre. If it does, D_min does not identify modularity and the
        statistic cannot support any conclusion attributing structure to X_1(N) -- the
        collision is the point of running that arm.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Replace the diamond-invariant function of 0c9de1's F2 (which is constant on fibres,
        hence carries nothing) by the strictly weaker Delta_d-invariant function, which
        preserves more state than the final goal requires -- the coset rather than the bare
        answer -- and is exactly the state that survives the descent to X_Delta(N).
      predicted_gain: >-
        Predicted zero, because D_min is predicted to match the null. The transform is filed
        because it is the one F2's dichotomy omits, not because it is expected to pay.
    - transform: observable_fiber
      proposed_object: >-
        Hold D_min fixed and vary the forgotten structure (modular fibre, random curve fibre,
        random injection) to find which one it tracks.
      predicted_gain: >-
        Predicted: it tracks only the cardinality, which is the content of Outcome 1.
    quantifier_order: >-
      FORALL primes N in the tested range, FORALL d | (N-1)/2 in the tested range, FORALL
      nonzero F in F_p[b,c] of total degree < c*sqrt(N) : F is not Delta_d-coset-constant and
      non-constant across cosets. Note the order: the falsifier is EXISTS d EXISTS F of low
      degree, and it is allowed to depend on N -- which is why the sweep tests every divisor
      d rather than a fixed one, and why a positive at a single (N, d) is enough to reopen.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No polynomial of total degree below c*sqrt(N) in the Tate-normal-form coordinates is
        a nonconstant Delta_d-coset invariant, for the tested N, d and coordinate system." It
        can NEVER certify that no efficiently computable coset invariant exists in another
        representation, nor that the ECDLP is hard.
      nearby_object_control: >-
        Instances with N | p - 1, where a computable coset invariant DOES exist (the Tate
        self-pairing determines k outright). The method must be seen to behave differently
        there. A sweep returning the same D_min ratio at k_emb = 1 and k_emb > 1 has not
        identified the load-bearing structure, and that outcome is a falsification of the
        instrument rather than a result about the object.
    proof_obligations:
    - claim: The fibre coordinate is k up to sign, and the Tate normal form realises it.
      responsibility: correctness
    - claim: For N prime, intermediate covers exist for every d | (N-1)/2.
      responsibility: correctness
    - claim: The null value of D_min is Theta(sqrt(N)) by dimension counting.
      responsibility: baseline
    - claim: A chi_d oracle is worth exactly a factor sqrt(d) against rho.
      responsibility: runtime
    - claim: The chi_d oracle admits no generic-group simulator for d >= 2.
      responsibility: correctness
    - claim: Existence of a low-degree invariant does not imply constructibility below cost N.
      responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED AND NONE MOVES. The record's own measurement costs
      O(N * (log p)^{O(1)}) per instance and is toy. The CONDITIONAL accounting, stated as a
      conditional: a chi_d oracle would take rho from 0.886*sqrt(N) to 0.886*sqrt(N/d), a
      factor sqrt(d); the full ladder over all d | N-1 would give O~(sqrt(l_max(N-1))). Both
      are statements about a hypothetical oracle whose existence this record predicts against.
    memory_exponent: >-
      O(N) field elements to hold the fibre and O(D^2) for the linear system -- both toy, and
      both larger than rho's O(1), which is one more reason nothing here is an algorithm.
    best_known: >-
      Parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted rho at 0.886*sqrt(N/r), r <= 6, which is BASELINE CALIBRATION
      and never an exponent (KN-TECH-018); BSGS at sqrt(N)/sqrt(N) (KN-TECH-031); the generic
      lower bound (KN-TECH-005). None is moved.
    hidden_overhead: >-
      The Theta(sqrt(N)) null value hides a constant depending on how the dimension count is
      rounded, which is why the claim is a RATIO against a measured null and not an absolute
      threshold.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. Recorded for completeness: at the null value
      the interpolation route costs Theta(N) time and Theta(N) memory, dominated by BSGS on
      both axes, so even a successful Outcome 1 measurement produces no method.
