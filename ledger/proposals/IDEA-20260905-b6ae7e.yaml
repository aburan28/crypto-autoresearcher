idea:
  id: IDEA-20260905-b6ae7e
  title: Pointed torsor holonomy as the missing reduction interface
  class: representation
  claim: 'A class-group torsor cannot supply a point-group bridge merely from unpointed endpoints. Conjecture: adding
    certified point transport along ideal-class loops gives a well-defined cocycle precisely after quotienting a
    specified ambiguity group; this cocycle is the minimal interface any proposed reduction must either compute
    or bypass.'
  mechanism: An ideal class moves a curve, whereas a point lives in a fiber over that curve. A choice of isogeny
    representative transports points, and different representatives can differ by automorphisms and degree factors.
    Compose two transports around a loop and compare their action on an abstract prime-order point fiber. The resulting
    holonomy can detect noncanonical choices. If its class is trivial, a consistent section may exist; if not, endpoint
    data forget necessary information. This is a mathematical descent problem for a family of point groups, not
    a claim that class-group vectorization solves ECDLP.
