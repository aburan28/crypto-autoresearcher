idea:
  id: IDEA-20260721-001
  title: Do the two confirmed structural signals compound? (INCB richness x BKKMV mixed volume)
  class: composition
  claim: >-
    The amortized relations-per-Groebner-solve of a chord-richness-selected factor base
    (H-INCB excess) processed under the mixed-volume-optimal elimination order (H-BKKMV
    sparsity) exceeds the PRODUCT of each effect measured alone, by a margin that grows
    with p -- i.e. the two independently-confirmed non-generic structures are correlated
    and compound, rather than being independent bounded constant factors.
  mechanism: >-
    INCB concentrates decomposable supports on rich chord lines; BKKMV lowers per-support
    solve cost via sparse elimination. If the rich supports are disproportionately the
    sparse-Newton ones, the two advantages multiply and could grow jointly with p.
  novelty_status: adaptation
  assumptions:
    - the INCB and BKKMV instruments can be run on a shared factor base
    - relations-per-solve is the right cost proxy for the collection phase
  predictions:
    - metric: (relations_found / groebner_solves), combined vs INCB-only vs BKKMV-only vs random
      direction: higher
      minimum_effect: "combined/random ratio strictly increasing across p in {211,1009,4099}"
  minimal_test:
    design: >-
      On the three toy primes, build random, richness-selected, and mixed-volume-ordered
      variants; measure amortized relations-per-solve for each and the combined pipeline.
    controls: [matched random factor base at identical size; each signal in isolation]
    required_metrics: [relations_per_solve, fitted p-exponent of combined/random ratio]
  falsification_conditions:
    - "combined ratio <= product of the two individual ratios (independent factors)"
    - "combined/random ratio flat or decreasing in p (bounded constant -> barrier)"
  confounders: [factor-base size, target selection, saturation at small p]
  interpretation_limits:
    - a compounding CONSTANT factor is still not sub-rho; only p-growth would matter
    - toy scale; no crypto-scale or hardness claim
  estimated_cost: {implementation: medium, compute: low}
  recommended_priority: high
  proposed_by: idea-generator
