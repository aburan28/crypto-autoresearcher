idea:
  id: IDEA-20261002-273e65
  question_id: RQ-NGCC-f52138
  goal_id: GOAL-NGCC-6c8a52
  added: '2026-10-02'
  title: >-
    Reproduce or refute the published Chinith false-witness forgery
    (sign-05-1) on the official round-1 submission
  class: mechanism
  claim: >-
    Saarinen, ePrint 2026/2266, reports that Chinith's final Fiat-Shamir
    challenge omits the only public-key-dependent value, and that an
    ordinary signer run on a false witness forges for any public key
    (finding sign-05-1). This idea asks whether that published claim
    reproduces on the official ICCS round-1 Chinith package, compiled from
    its C sources by this program. It proposes no new attack.
  mechanism: >-
    The published sign-05-1 argument, once read from the finding and the
    Chinith specification, is run by giving the ordinary signer a witness
    that is not the secret key of the target public key. A forgery counts
    only when a verifier built separately from the signer accepts the
    signature under that target public key. An honest signature that also
    verifies under the wrong key is a different defect and is not scored
    as this claim.
  novelty_status: unverified
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Chinith is an NGCC round-1 signature candidate, not an elliptic-curve
      discrete-log instance. knowledge/frontiers/ecdlp does not contain
      this scheme. The corpus entry that names it is a round-1 listing and
      states that it includes no third-party analysis.
    nearest:
      - ref: KN-LIT-05cb38
        provenance: kb
        relation: adjacent
        delta: >-
          KN-LIT-05cb38 records that Chinith is signature candidate 5 and
          states that the specification, reference code, and any
          third-party analysis were not read. This idea adds an
          independent reproduction test of published finding sign-05-1.
          It adds no new attack and no cost improvement over that finding.
    searched:
      corpus_grep:
        - "knowledge/literature/KN-LIT-05cb38.md read 2026-10-02"
      web:
        - "https://eprint.iacr.org/2026/2266 names finding sign-05-1; the paper text was the copy supplied with the target request and was not re-executed"
      blocked: []
  test_boundary: >-
    Official Chinith zip from the round-1 roster (sign-05), every parameter
    set the package declares, two target public keys per set. No claim
    about a repaired or later submission.
  falsification: >-
    On any declared parameter set, the separate verifier rejects the
    false-witness signature under both target public keys, the honest
    self-test had passed, and an honest signature does not verify under
    the wrong key.
  status: proposed
  proposed_by: coordinator
