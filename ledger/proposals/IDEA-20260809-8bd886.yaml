idea:
  id: IDEA-20260809-8bd886
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    Price trusted setup: put the class-group and RSA-modulus options on one axis
    with the setup risk expressed in the same units as the parameter cost
  class: composition
  claim: >-
    The choice between a class group and an RSA modulus is a choice between an
    unquantified setup risk and a quantified parameter cost, and the two are
    compared informally. The claim is that the comparison can be made explicit:
    express the class-group option's cost as the measured extrapolation interval
    from this goal, and the RSA option's as the interval on its own cost model
    plus an explicit statement of what the setup assumption requires, so that the
    tradeoff is legible without pretending the setup risk is a number.
  mechanism: >-
    Compute both options' operation-and-memory costs at matched claimed security
    under one convention, present both intervals, and state the setup assumption
    as a discrete precondition rather than converting it into a probability this
    program cannot justify.
  why_not_a_renamed_known_approach: >-
    The tradeoff is discussed qualitatively everywhere these constructions appear.
    Making the quantitative half genuinely quantitative — with intervals from this
    program's own measurements — while explicitly REFUSING to numerify the setup
    risk, is the contribution and the honesty constraint together.
  predictions:
  - observable: overlap of the two cost intervals at matched claimed security
    metric: interval overlap
    predicted: Substantial overlap, meaning the quantitative side does not decide the choice -- which would make the setup assumption the deciding factor and is the useful conclusion.
  - observable: whether either option's interval is narrower
    metric: interval widths
    predicted: The RSA side narrower, since its cost model has far more anchoring computations; quantifying that asymmetry is itself informative.
  minimal_test: >-
    Evaluate both cost models under one convention at matched claimed security,
    report both intervals and the setup precondition, and state explicitly that no
    probability is assigned to the setup risk.
  controls:
  - 'CONVENTION CONTROL: one machine model and one memory price across both options.'
  - 'NO-NUMERIFICATION CONTROL: the record must not contain any probability, likelihood or risk score for the setup assumption; a reviewer checks this explicitly.'
  falsification_conditions:
  - The intervals are disjoint, in which case the quantitative side does decide and the record reports which way.
  - One option's cost model cannot be expressed under the shared convention, making the comparison unavailable.
  interpretation_limits: >-
    No recommendation is made. The record presents two intervals and one
    precondition, and the choice belongs to whoever owns the threat model.
  sota_delta: 'No attack. Delta: a legible tradeoff with the unquantifiable part left explicitly unquantified.'
  dominated_by: Depends on IDEA-20260809-86ac51 and on GOAL-RSA-001's model, which may be cited as method only.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for trusted setup comparison: no records. WEB NOT CHECKED.'
  source_refs:
  - Hidden-order group construction papers -- RECALLED, REQUIRED READS.
