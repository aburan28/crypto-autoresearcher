idea:
  id: IDEA-20260922-d11575
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE DESCENT-LATTICE DICHOTOMY FOR THE FIVE COMPOSITE-DEGREE ANSI CURVES:
    every GHS base field F_{2^c} with c | 16 is STRUCTURALLY EMPTY because the
    Frobenius orbit of the curve collapses and the Galois sum factors through
    the subfield trace Tr_{F_{2^{16k}}/F_{2^16}}, which annihilates the prime
    subgroup; the four surviving lanes c in {k, 2k, 4k, 8k} are ordinary GHS
    with the module dimension m pinned into [n/2 + 1, n] by the single audited
    fact B not in F_{2^8}; and the whole 5 x 10 table is decided by four
    Artin-Schreier level computations inside F_{2^16}
  class: mechanism
  claim: >-
    Let E be any of c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1,
    so (audit, analysis/binstd-curve-audit/) A, B lie in F_{2^16}, the smallest
    subfield containing B is F_{2^16} exactly, N = 16k with k in
    {11, 13, 17, 19, 23} prime, the cofactor h equals #E(F_{2^16}) = 2^16 + 1 - t,
    and the prime subgroup order l has 161, 193, 257, 289, 353 bits. The
    divisors of N are exactly {1, 2, 4, 8, 16, k, 2k, 4k, 8k, 16k}, because k is
    an odd prime. This record claims three things, each falsifiable.
    (C1) COLLAPSE CLOSES HALF THE LATTICE. For a GHS base field F_{2^c} with
    c | 16, sigma = the 2^c-power Frobenius satisfies sigma^i(E) = E iff
    (16/c) | i, so only 16/c of the n = 16k/c Galois conjugate function fields
    are distinct. Grouping the Galois sum in the conorm-norm homomorphism by
    residue mod 16/c makes each component equal to sigma^j applied to
    Tr(P) = sum_{r=0}^{k-1} pi_q^r(P), where pi_q is the F_{2^16}-Frobenius
    endomorphism. On the prime subgroup pi_q acts as an eigenvalue lambda with
    lambda^k = 1 and lambda != 1 (because l does not divide h = #E(F_{2^16})),
    so Tr acts as (lambda^k - 1)/(lambda - 1) = 0. The conorm-norm image of the
    target is therefore ZERO for every c | 16. Cells c in {1, 2, 4, 8, 16} are
    STRUCTURALLY EMPTY with an elementary certificate, on all five rows. This
    is the F_{2^16} analogue of the recorded fact that Koblitz curves have
    GHS magic number m = 1 and resist GHS over every base field.
    (C2) THE FOUR LIVE LANES HAVE THEIR GENUS PINNED BY ONE AUDITED BIT. For
    c in {k, 2k, 4k, 8k} the conjugate period equals n = 16/(c/k) exactly, so
    there is no collapse and ordinary GHS applies. In each such lane the
    2^c-power Frobenius acts on F_{2^16} as a generator of <sigma_2^{16/n}> of
    order n, F_{2^16} is free of rank 16/n over F_2[u]/(u+1)^n (normal basis
    theorem; IDEA-20260918-9abf42 records the free-rank-one structure this
    generalises), ker(u+1)^{n/2} = F_{2^8}, and B^{1/2} lies outside F_{2^8}
    because B does. Hence m = level(B^{1/2}) satisfies n/2 + 1 <= m <= n, and
    the GHS genus g = 2^{m-1} (or 2^{m-1} - 1) lies in [2^{n/2}, 2^{n-1}]:
    n = 2 forces m = 2 and g = 2 exactly; n = 4 gives g in {4, 8}; n = 8 gives
    g in [16, 128]; n = 16 gives g in [256, 32768].
    (C3) THE TABLE IS DECIDED BY FOUR CHEAP NUMBERS PER CURVE, AND THE
    PRE-REGISTERED VERDICT IS "WEAKENED IN TIME, NOT IN VAN OORSCHOT-WIENER
    COST". Under the generic value m = n the only lane whose index calculus
    falls below matched rho is c = 4k, n = 4, g = 8 over q = 2^{4k}: with the
    reported Gaudry-Theriault-Thome-Diem exponent 2 - 2/g the time is
    q^{1.75} = 2^77, 2^91, 2^119, 2^133, 2^161 against matched rho
    2^77.9, 2^93.7, 2^125.5, 2^141.5, 2^173.3 (derived below), i.e. a time
    advantage of about 2^0.9, 2^2.7, 2^6.5, 2^8.5, 2^12.3 - purchased with a
    factor base of q^{1-1/g} = 2^38.5, 2^45.5, 2^59.5, 2^66.5, 2^80.5 random-
    access entries against rho's negligible memory. The record therefore
    PREDICTS that under the question's mandated van Oorschot-Wiener memory and
    parallel accounting the advantage is a wash or a loss on every row, and
    says so before the computation. The discriminating alternative is real and
    not small: if the census returns m = 3 in the n = 4 lane (a 2^-4 event for
    a uniformly random B, and B is a fixed published constant, so the prior is
    a prior over which constant the standard chose) then g = 4 and the time
    drops to q^{1.5} = 2^66, 2^78, 2^102, 2^114, 2^138 at memory
    q^{0.75} = 2^33..2^69; and if it returns m = 5 in the n = 8 lane (a 2^-6
    event) then g = 16 over q = 2^{2k} and the direct Gaudry cost is about
    g! * q = 2^66 on c2pnb176v1 at 2^22 memory, i.e. 2^12 below matched rho at
    negligible memory. Fourteen percent of the prior mass over the ten
    (curve, lane) pairs that can move sits on an outcome that would change a
    deployed row of the reachability table.
    Representation class R1 (RQ-ECDLP-623a32, affine binary-field coordinates);
    the attack stage whose charged cost the record claims to change is
    RELATION COLLECTION, by replacing the elliptic factor base with the
    degree-one places of a covering curve.
  mechanism: >-
    OBJECT FRAME. Tracked object: the class of the conorm of a point P in
    Jac(C)(F_q) modulo the subgroup generated by the factor base of degree-one
    places of C, C the GHS cover of E over the base field F_q = F_{2^c}. That is
    the hyperelliptic index-calculus relation vector. Representation of the
    point: R1, affine (x, y) in F_{2^{16k}}, pushed to a reduced divisor on C.
    OPERATION SET Sigma: translation by the degree-one places of C -- a PARTIAL
    action, because a reduced divisor of degree g only reduces against the
    factor base when it splits completely, and the relation vector propagates
    on no other operation. Sigma is explicitly NOT the full translation action
    of E, so IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C do not close it.
    TRICHOTOMY: partial-action (Class I). Declared component: F2 of
    IDEA-20260802-002 (factor-base decomposition). WHAT IS ADDED BEYOND F2:
    the factor base is not a subset of E at all but of a different curve
    reached by a field-theoretic transfer, and the record's content is the
    certified enumeration of which transfers exist on these five published
    parameter sets and what each costs.
    LOSSY-PROJECTION TEST AGAINST Sigma. The projection is P |-> (conorm-norm
    of P) mod <factor base>. It discards the F_{2^{16k}}-coordinates of P
    entirely and retains only a vector of exponents over the degree-one places
    of C over F_{2^c}; the fibre over a relation vector is the full set of
    points of E with the same reduced-divisor class, of size at least
    q^{n - g}/|Jac| by dimension count, so the projection is lossy in the
    representation used whenever g < n, and is lossy in the weaker sense of
    forgetting all of E's coordinates whenever the cover is not E itself. THE
    DISCARD IS COMPATIBLE WITH Sigma because conorm-norm is a group
    homomorphism and translation by a factor-base place adds a fixed basis
    vector to the relation vector; nothing retained depends on what was
    discarded. AND HERE IS THE POINT OF THIS RECORD: for c | 16 the projection
    becomes LOSSLESS-TO-ZERO, not lossless-to-identity -- it sends the whole
    target subgroup to 0. A projection that kills the object is as useless as
    one that loses nothing, and (C1) is the certificate that this is what
    happens on half the lattice. That is the lossy-projection test returning a
    NEGATIVE, computed algebraically, at zero compute cost, exactly as
    docs/inventor-protocol.md asks.
    FACTOR-BASE ESCAPE (KN-OPEN-020). The factor base is the set of degree-one
    places of C over F_q: description is O(q) field elements, membership is a
    single polynomial evaluation, relation generation is one reduction and one
    factorisation of a degree-g polynomial over F_q, descent of the target is
    the standard smoothing walk. It is NOT the bounded-degree algebraic factor
    base KN-OPEN-020 scopes out, because it lives on a different curve; it sits
    in KN-OPEN-020's HIGH-DEGREE open class, the degree being g up to 2^{n-1},
    and the record charges description, membership, relation, descent, time and
    memory in the cost table rather than declaring the class open and stopping.
    PRICE THE ONE OPEN NUMBER. The quotient object's orbit-canonicalisation
    cost is the cost of reducing a degree-g divisor on C to its unique reduced
    representative: one Cantor reduction, O(g^2) F_q-operations. For the live
    lanes that is O(64) at g = 8 and O(2^30) at g = 32768 -- which is, on its
    own, why the n = 16 lane is dead and the n = 4 lane is not.
    THE COMPUTATION, IN FULL, SO IT CAN BE CHECKED BEFORE IT IS RUN. For each
    curve and each c in {k, 2k, 4k, 8k}: (i) read A, B from the primary standard
    (ANSI X9.62) and re-verify against the audit; (ii) form beta = B^{1/2} =
    B^{2^15} inside F_{2^16}; (iii) set u = the map alpha |-> alpha^{2^{c mod 16}}
    on F_{2^16} and compute the least j with (u + 1)^j beta = 0 by repeated
    application of (u + 1); that j is m; (iv) report g = 2^{m-1} and
    g = 2^{m-1} - 1 as the two candidates, and flag which the re-derived GHS
    theorem selects; (v) check the transfer-existence necessary condition
    g * c >= log_2 l, and the dimension condition g >= n; (vi) emit the charged
    cost of hyperelliptic index calculus on genus g over F_{2^c} in both the
    small-genus (Gaudry / GTTD) and large-genus (Enge-Gaudry) regimes with the
    regime boundary g / log_2 q stated, together with the factor-base memory;
    (vii) emit matched rho for the row. Total work: a few hundred lines of
    Python over F_{2^16}, seconds. NO ATTACK IS RUN AND NO DEPLOYED CURVE IS
    TOUCHED BEYOND ARITHMETIC ON ITS PUBLISHED COEFFICIENTS.
    WHERE THE DERIVED NUMBERS COME FROM. Matched rho for a row with an
    s-bit prime subgroup: 0.886 * sqrt(l) / sqrt(2k) with l taken as 2^{s-0.5}
    (the convention is stated because s-bit means 2^{s-1} <= l < 2^s), giving
    2^77.9 (k=11, s=161), 2^93.7 (13, 193), 2^125.5 (17, 257), 2^141.5
    (19, 289), 2^173.3 (23, 353). The sqrt(2k) is the negation-and-Frobenius
    class gain and it is the ONLY symmetry these curves grant rho; see
    IDEA-20260922-c07598 for why it is 2k and not 32k. Index-calculus times
    quoted above are q^{2 - 2/g} with q = 2^c, using the GTTD exponent as
    REPORTED, constants uncharged, which the record flags as its largest
    single uncertainty.
