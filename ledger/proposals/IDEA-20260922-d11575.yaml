    exact curve set.
  assumptions:
    - The five curves' parameters are as the audit computed them; the first gate re-derives A and B from ANSI X9.62 before any cell is published.
    - k is an odd prime in every row, so the divisor lattice of N = 16k is exactly the ten-element set used, and F_{2^{q^2}} is not inside F_{2^N}.
    - l is prime and l > h, hence gcd(l, h) = 1, hence lambda != 1 in (C1). Checked from the audit's order/cofactor split.
    - The GHS cover exists and its genus is 2^{m-1} or 2^{m-1}-1; re-derivation obligation, not an assumption the record is allowed to keep.
    - Matched rho uses 0.886 sqrt(l) / sqrt(2k) with l = 2^{s-0.5}; the convention is stated in every cell and the half-bit is carried as an interval, not hidden.
    - ARITHMETIC ONLY. Nothing here runs an attack at N >= 131; the executable arm is toy subfield cells with dk <= 41.
  proof_search_map:
    bottleneck: >-
      The genus of the cover actually obtainable over each admissible base
      field. Everything downstream -- which index-calculus regime applies, what
      it costs, whether it beats rho -- is a function of g alone once q is
      fixed, and g = 2^{m-1} is a function of one integer m per (curve, lane).
      The bottleneck is therefore literally four integers per curve, and the
      record's whole design is to compute them as cheaply as possible.
    baseline_embedding:
      parameter_slice: >-
        Set c = 16 (base field F_{2^16}, n = k). Then the conjugate period is 1,
        m = 1, g = 1, and the construction returns E over F_{2^16} itself. This
        slice MUST reproduce the recorded Koblitz behaviour (m = 1, GHS
        resistant) with F_2 replaced by F_{2^16}; if the implementation returns
        anything other than m = 1 there, it is wrong and no other cell may be
        read.
      reproduction_check: >-
        Two fixtures. (i) A binary Koblitz curve (A, B in F_2) over F_{2^N} for
        a composite N of the implementation's choosing: the level routine must
        return m = 1 for every base field, matching the recorded external
        statement. (ii) A curve over F_{2^{16k'}} for a small k' whose B is
        chosen in F_{2^8}: the routine must return m <= n/2, i.e. it must detect
        the deeper subfield, which is the same code path that produces the
        n/2 + 1 lower bound on the real rows.
    observation_collision:
      observable: >-
        The integer m per (curve, base field), and the derived pair
        (g, matched-rho ratio).
      distinct_preimage_search: >-
        Two distinct preimages give the same m and must be told apart. FIRST:
        m small because the curve is defined over a subfield (collapse, C1) --
        this is the USELESS kind and the conorm-norm image is zero. SECOND: m
        small because B happens to sit low in the Artin-Schreier filtration of
        a lane with no collapse -- this is the DANGEROUS kind and the transfer
        is non-degenerate. The census must report the conjugate period
        16/gcd(c, 16) alongside m in every cell, because that period is exactly
        what separates the two preimages, and a table that reports only m is
        uninterpretable. A cell in which the period is n but m < n/2 + 1 would
        contradict (C2) and is a third, unexpected preimage: report it, do not
        explain it.
    constructive_transforms:
      - transform: base_field_enumeration
        proposed_object: The degree-one places of the GHS cover over F_{2^c}, one object per divisor c of N
        predicted_gain: >-
          Relation collection moves from elliptic decomposition (solving degree
          governed by S_{k+1}, out of reach at k >= 11) to polynomial
          factorisation over F_{2^c}, at the price of genus 2^{m-1}
      - transform: lossy_projection_negative
        proposed_object: The conorm-norm image for c | 16
        predicted_gain: >-
          NONE, and that is the deliverable: the image of the target subgroup
          is exactly {0}, so five of the ten cells per row close with a
          certificate rather than with a cost
    quantifier_order: >-
      FOR ALL five curves AND FOR ALL ten divisors c of N = 16k, THERE EXISTS a
      certified cell verdict in {STRUCTURALLY EMPTY with certificate, DEFINED
      WITH A COMPUTED COST, OPEN with the missing quantity named}. The witness
      quantifier that breaks (C1): THERE EXISTS a curve and a c | 16 for which
      the conorm-norm image of a point of order l is non-zero -- checkable
      directly on a toy cell by computing the image and its order.
    method_ceiling:
      strongest_certifiable_claim: >-
        A 5 x 10 table of (conjugate period, m, g, transfer-existence verdict,
        index-calculus regime, charged time exponent, charged factor-base
        memory, matched rho, ratio), with every entry derived from published
        parameters and re-derivable from the standard, plus the collapse
        certificate for the c | 16 cells. NO STATEMENT that any of these five
        curves is broken, and none that any is safe: the table's honest verdict
        is a cost with its uncertainty, and the largest uncertainty is a
        recalled complexity constant.
      nearby_object_control: >-
        Three. (i) The prime-degree ANSI curves c2tnb191v1, c2tnb239v1,
        c2tnb359v1, c2tnb431r1 and the FIPS binary curves: N prime, so the
        divisor lattice is {1, N} and the whole table collapses to one cell
        with n = N and g up to 2^{N-1}. Running the identical code on them must
        produce exactly that, and if it produces a small genus the code is
        wrong. (ii) A synthetic curve over F_{2^176} whose B is drawn uniformly
        from F_{2^176} rather than from F_{2^16}: its m must equal n in every
        lane with overwhelming probability, isolating what the subfield
        structure actually changes (answer, per C2: it changes the c | 16
        lanes from useless-with-large-genus to useless-with-zero-image, and it
        changes nothing at all in the c = jk lanes). (iii) A binary Koblitz
        curve, where m = 1 everywhere.
    proof_obligations:
      - claim: >-
          Hess's theorem (KN-LIT-6987) that the large cyclic factor is not in
          the conorm-norm kernel has hypotheses that exclude the collapsed case
          c | 16. If it does not, (C1) is false.
        responsibility: correctness
      - claim: >-
          The grouping of the Galois sum by residue class mod 16/c is valid,
          i.e. the image of the conorm of P lies in the sub-abelian-variety
          attached to the j = 0 conjugate and sigma^i carries it to the
          j = i mod 16/c one.
        responsibility: correctness
      - claim: The GHS genus is 2^{m-1} or 2^{m-1} - 1 with m as defined, re-derived from GHS 2002 or Hess rather than relayed.
        responsibility: correctness
      - claim: The transfer-existence necessary condition is g * c >= log_2 l, and it is necessary, not sufficient.
        responsibility: scope
      - claim: The census output is compared cell by cell with MMT's published tables before any cell is called new.
        responsibility: scope
  predictions:
    - metric: conorm_norm_image_order_on_l_part_for_c_dividing_16
      direction: exact
      minimum_effect: >-
        Exactly 1 (the image is the identity) for every c in {1, 2, 4, 8, 16}
        on every toy analogue of the five rows. Any image of order divisible by
        l refutes (C1) outright.
    - metric: artin_schreier_level_m_per_live_lane
      direction: bounded
      minimum_effect: >-
        n/2 + 1 <= m <= n in all twenty live cells: m = 2 exactly at n = 2,
        m in {3,4} at n = 4, m in [5,8] at n = 8, m in [9,16] at n = 16. A
        single cell outside these bounds refutes (C2).
    - metric: minimum_over_lanes_of_log2_time_minus_log2_matched_rho
      direction: lower
      minimum_effect: >-
        Under the generic m = n outcome, between -12.3 and -0.9 across the five
        rows, attained in the c = 4k lane, with the margin growing with k.
        Stated as a PREDICTION that GHS is nominally faster in time on every
        row, so that a table showing GHS slower in time is a refutation of the
        cost model and not a comfort.
    - metric: factor_base_memory_entries_at_the_minimising_lane
      direction: higher
      minimum_effect: >-
        At least 2^38 on c2pnb176v1 and at least 2^80 on c2pnb368w1, against
        rho's O(1) per processor plus the distinguished-point table. The record
        predicts that charging this under van Oorschot-Wiener removes the time
        advantage on every row; a VOW-charged comparison that still favours GHS
        is the interesting outcome and must be escalated, not absorbed.
    - metric: count_of_cells_closed_as_structurally_empty
      direction: exact
      minimum_effect: 25 of 50 (five per row, c in {1,2,4,8,16}), each with the collapse certificate attached.
  minimal_test:
    design: >-
      PHASE 0, PARAMETER RE-DERIVATION (hours, no compute). Read A, B, the
      reduction polynomial, l and h for all five curves from ANSI X9.62 itself
      and diff against analysis/binstd-curve-audit/. Any disagreement stops the
      test. PHASE 1, THE CENSUS (seconds of compute). Implement F_{2^16}
      arithmetic, form beta = B^{2^15}, and for each c in {1,2,4,8,16,k,2k,4k,8k}
      compute the conjugate period 16/gcd(c,16) and the Artin-Schreier level m
      of beta under alpha |-> alpha^{2^{c mod 16}}, by iterating (u+1) until
      zero. Emit the 5 x 9 table of (period, m, g candidates). PHASE 2, THE
      TOY VERIFICATION OF (C1) (minutes). On executable subfield cells
      E/F_{2^d} over F_{2^{dk'}} with d*k' <= 41 -- concretely (d, k') in
      {(4,5), (4,7), (8,5), (2,11)} -- construct the curve, find a point of
      prime order l' in the non-subfield part, compute the subfield trace
      sum_{r} pi_q^r(P) EXPLICITLY, and verify it is the identity. Then, for
      whichever cells the implementation can carry, construct the GHS cover
      over F_{2^c} for c | d and verify the conorm-norm image of P has order
      coprime to l'. PHASE 3, THE COST TABLE (hours, no compute). For each live
      cell emit charged time and memory in both index-calculus regimes with the
      regime boundary g / log_2 q printed, matched rho per
      IDEA-20260922-c07598's symmetry ledger, and the ratio, in a
      hardware-independent unit (F_{2^c}-multiplications and factor-base
      entries). PHASE 4, THE PRIOR-ART DIFF (hours). Obtain MMT's tables and
      place them beside the census, cell by cell, and record agreements and
      disagreements as the primary finding.
    controls:
      - >-
        NULL OBJECT 1, matched prime-degree ANSI rows: c2tnb191v1 against
        c2pnb176v1 and c2tnb239v1 against c2pnb272w1. Identical code; the
        divisor lattice must collapse to {1, N} and the table must contain a
        single, hopeless cell. A small genus here is a bug.
      - >-
        NULL OBJECT 2, a synthetic curve over F_{2^176} with B drawn uniformly
        from F_{2^176}: m must equal n in every lane, isolating the subfield
        contribution to exactly the c | 16 collapse.
      - >-
        NULL OBJECT 3, a binary Koblitz curve: m = 1 in every lane, reproducing
        the recorded external statement and validating the level routine.
      - >-
        BASELINE EMBEDDING CONTROL: the c = 16 cell on the real curves, which
        must return m = 1 and g = 1 and hence reproduce E itself.
      - >-
        POSITIVE CONTROL FOR (C1)'S CONVERSE: a toy cell with k' EVEN, where
        F_{q^2} sits inside F_{q^{k'}}, the collapse argument's arithmetic
        changes, and the conorm-norm image must be checked to be NON-trivial.
        Without this the (C1) verification is a test with no possible negative.
    required_metrics:
      - conjugate_period_per_cell
      - artin_schreier_level_m_per_cell
      - genus_candidates_per_cell
      - transfer_existence_verdict_per_cell
      - index_calculus_regime_and_boundary_ratio_per_cell
      - charged_time_exponent_per_cell
      - charged_factor_base_memory_entries_per_cell
      - matched_rho_per_row_with_declared_symmetry_group
      - ratio_and_its_uncertainty_interval_per_cell
      - toy_cell_conorm_norm_image_order
      - mmt_table_diff_per_cell
  falsification_conditions:
    - A toy cell with c | d in which the conorm-norm image of an l'-order point is non-trivial. (C1) is dead and half the table reopens.
    - Any live cell with conjugate period n but m outside [n/2 + 1, n]. (C2) is dead; the free-module argument or the audit's B-subfield bit is wrong.
    - The re-derived GHS genus formula is not 2^{m-1} or 2^{m-1} - 1, or m is not the Artin-Schreier level of B^{1/2}. Every genus in the table is void and the record is superseded, not patched.
    - Hess's conorm-norm theorem turns out to be unconditional. (C1) is false.
    - MMT's published m values for these five curves disagree with the census. The census is wrong until reconciled; MMT is the senior source.
    - The Koblitz control returns m != 1. The level routine is wrong and no cell may be read.
  confounders:
    - >-
      Two conventions for m (level of B^{1/2} versus level of B, or a
      definition that also involves A) differ by at most one and change the
      genus by a factor of two, which is the whole margin in the n = 4 lane.
      Report both conventions in every cell until the re-derivation fixes one.
    - >-
      The 2^{m-1} versus 2^{m-1} - 1 branch changes g by one and can flip the
      transfer-existence condition at n = 4 (g = 4 exactly equals n). Report
      both branches.
    - >-
      The GTTD constant, exponential in g, against margins as small as 2^0.9.
      A cell whose margin is under 2^16 must be labelled INDISTINGUISHABLE FROM
      A WASH, not "faster".
    - >-
      Charging index-calculus memory as a count of entries while charging rho
      memory as distinguished points is an apples-to-oranges error; the table
      must use one van Oorschot-Wiener accounting for both arms.
    - >-
      The half-bit convention for l. A row whose verdict changes when l moves
      from 2^{s-1} to 2^s is not decided.
  interpretation_limits:
    - Proposal only. No experiment, no run, no approval, no result exists here.
    - >-
      Nothing in this record attacks a deployed curve. Every deployed number is
      arithmetic on published coefficients under numbered assumptions; the
      extrapolation distance from the nearest executable cell (dk <= 41) to
      c2pnb176v1 is 135 bits of field and 6 units of k, and is stated in every
      table row.
    - >-
      A census verdict of "GHS weakens this row by 2^x in time" is a statement
      about the tested construction, the relayed genus formula and the recalled
      complexity constants only. It is not a security claim about the curve and
      must not be reported as one.
    - >-
      The record closes cells, not the method class. A cover attack outside the
      GHS/Hess Artin-Schreier family -- Iijima-style (2,...,2) covers,
      isogeny-extended GHS in the sense of Galbraith-Hess-Smart, or Hess's
      general covers -- is untouched, and (C1) says nothing about any of them
      because (C1) is an argument about THIS construction's Galois sum.
    - Nothing here bears on the prime-degree half of the population except as a control.
  heuristic_assumptions:
    - id: H-DL-0
      statement: >-
        NONE FOR (C1) OR (C2). The collapse argument and the level bounds are
        unconditional finite-field algebra on published constants: the
        conjugate period is gcd arithmetic, lambda^k = 1 and lambda != 1 follow
        from pi_q^k = 1 and gcd(l, h) = 1, and the free-module structure of
        F_{2^16} over F_2[u]/(u+1)^n follows from the normal basis theorem. The
        absence of a heuristic is recorded explicitly so that the conditionality
        of (C3) cannot be smeared onto (C1) and (C2).
      rigorous_support: >-
        Finite-field Galois theory; IDEA-20260918-9abf42 for the module
        structure; the audit certificate for gcd(l, h) = 1.
      validation_plan: >-
        Phase 2 verifies the collapse consequence directly on four executable
        cells at dk <= 41 by computing the subfield trace of an l'-order point
        and checking it is the identity, with the k'-even positive control so
        the check can fail.
    - id: H-DL-1
      statement: >-
        SMOOTHNESS-AND-YIELD HEURISTIC FOR THE SMALL-GENUS REGIME. A uniformly
        random reduced divisor of degree g on the cover C over F_q splits into
        g degree-one places with probability 1/g! + O(g^2/q), independently
        enough across trials that collecting |F| relations costs |F| * g!
        trials up to a polylogarithmic factor. This is the exact function-field
        analogue of the Dickman-de Bruijn statement that a random degree-g
        polynomial over F_q is 1-smooth with probability 1/g! (Panario-Gourdon-
        Flajolet), which is the classical distribution theorem it imitates.
      rigorous_support: >-
        The 1/g! density of totally split monic polynomials of degree g over
        F_q is exact up to O(g^2/q); what is heuristic is that GHS COVER
        divisors, which are not uniformly distributed, obey it, and that trials
        are independent enough for the yield to multiply.
      validation_plan: >-
        On the Phase-2 toy cells with an explicitly constructed cover, sample
        2^20 random reduced divisors per cell, record the empirical split
        density against the predicted 1/g!, and check the upper tail: the
        fraction of samples splitting into places of degree at most 2 must
        follow the corresponding two-smooth density. Record (q, g, sample
        count) and the transfer assumption -- from g <= 8 at q <= 2^8 up to
        g = 8 at q = 2^{4k} -- explicitly, because that transfer is the whole
        distance between the cell and the deployed row.
    - id: H-DL-2
      statement: >-
        COMPLEXITY-CONSTANT HEURISTIC. The reported GTTD exponent 2 - 2/g for
        fixed g is taken as the time law for the small-genus lanes with its
        constant treated as at most g! * polylog(q). No claim is made that this
        is the true constant; it is an upper-bound convention that the record
        applies UNIFORMLY to every cell so that no row is flattered.
      rigorous_support: >-
        None obtained here. The exponent is recalled and the constant is a
        convention, which is why every margin under 2^16 is reported as a wash.
      validation_plan: >-
        Measure the constant directly on the toy cells by counting F_q
        operations to collect |F| relations at g in {2, 3, 4} and fitting
        against g! * |F|; report the fitted constant and its extrapolation
        distance to g = 8 rather than asserting one.
  heuristic_note: >-
    The record is deliberately split so that its strongest content is its least
    conditional. (C1) and (C2) carry NO heuristic: they are algebra on
    published constants and they close or pin fifty cells by themselves, and
    they are the reason this is worth running even if every complexity constant
    in (C3) is wrong. (C3) is conditional on H-DL-1 and H-DL-2 and is stated as
    an exponent comparison with an explicit wash band, not as a speedup. The
    a-priori expectation is written down before the run so neither outcome can
    be narrated as interesting after the fact: the expected census result is
    m = n everywhere, the expected verdict is "nominally 2^0.9 to 2^12.3 faster
    in time at 2^38 to 2^80 memory, i.e. a wash or worse under van Oorschot-
    Wiener", and the expected value of the exercise is twenty-five certified
    empty cells plus a fourteen-percent chance of a row that moves.
  target_complexity:
    time_exponent: >-
      Best live lane under the generic outcome: q^{2 - 2/g} with q = 2^{4k} and
      g = 8, i.e. 2^{7k} = 2^77, 2^91, 2^119, 2^133, 2^161 for
      k = 11, 13, 17, 19, 23. In terms of the subgroup size l this is
      l^{7k/(16k - 16)} -> l^{7/16} = l^{0.4375} as k grows, against rho's
      l^{1/2}. The exponent on l therefore MOVES, from 0.500 to 0.4375, which
      is the only genuinely exponent-level statement in the record and it is
      the known composite-degree phenomenon, not a new one.
    memory_exponent: >-
      q^{1 - 1/g} = 2^{3.5k} = 2^38.5 to 2^80.5, i.e. l^{3.5/16} = l^{0.219},
      against rho's l^{0} (plus the distinguished-point table, which is a tuning
      parameter and not an exponent). The memory exponent moves from 0 to 0.219
      and that is the price of the time exponent moving from 0.5 to 0.4375.
    best_known: >-
      Matched rho with negation and the k-fold Frobenius classes:
      0.886 sqrt(l) / sqrt(2k), i.e. 2^77.9, 2^93.7, 2^125.5, 2^141.5, 2^173.3
      on the five rows (derived here; convention l = 2^{s-0.5} stated).
    hidden_overhead: >-
      Superpolynomial overhead hides in exactly two places and both are
      disclosed. First, the GTTD constant is exponential in g and at g = 8 is
      of order 2^15.3, which alone consumes the entire 2^0.9 margin on
      c2pnb176v1. Second, the o(1) in the Enge-Gaudry large-genus law is
      meaningless at the sizes where the n = 8 and n = 16 lanes live, and the
      record uses it only to establish those lanes are hopeless by many tens of
      bits, where the o(1) cannot rescue them.
    tradeoff_note: >-
      This is a time-memory trade and must be read as one. Rho parallelises
      with linear speedup and near-zero communication under van Oorschot-Wiener
      and needs no shared random-access store; the GHS lane needs
      2^38.5 to 2^80.5 entries of shared, randomly accessed relation storage
      plus a sparse linear algebra over a matrix of that dimension, which is
      the step that does not parallelise for free. The record's central
      prediction is that this trade is unfavourable on every deployed row, and
      the point of charging it is that a time-only table would say the
      opposite.
  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Phases 0, 1, 3, 4 are arithmetic and reading: a few hundred lines over
      F_{2^16} plus a cost-table generator, seconds of CPU. Phase 2 needs a toy
      GHS cover construction at dk <= 41, which is the only real engineering and
      is optional for (C1)'s algebraic part -- the subfield-trace check alone
      needs only point arithmetic. The expensive input is human: obtaining and
      reading MMT and re-deriving the GHS genus theorem.
  asymptotic_claim:
    problem: ECDLP in the prime-order subgroup of E(F_{2^{16k}}) for E defined over F_{2^16}, k an odd prime, at the five deployed parameter sets
    prior_best: Pollard rho with negation and Frobenius classes, 0.886 sqrt(l) / sqrt(2k) group operations
    time_exponent: l^{7/16 + o(1)} in the c = 4k lane under the generic m = n outcome, against l^{1/2}
    memory_exponent: l^{7/32} against l^{0}
    hidden_cofactor: A GTTD constant of order g! = 2^15.3 at g = 8, plus polylog; disclosed, not absorbed
    claim_kind: >-
      exponent_on_a_known_mechanism. The exponent 7/16 is the standard
      composite-degree GHS exponent and is not claimed as new; what is claimed
      as new to THIS PROGRAM is the certified per-curve table, the collapse
      closure of the c | 16 half, and the memory-charged verdict.
  dominated_by: >-
    Matched rho on each row is the frontier competitor and the honest reading is
    PARETO-INCOMPARABLE, not dominated and not dominating: rho wins on memory
    (l^0 against l^{7/32}) and on parallel efficiency; the c = 4k GHS lane wins
    on time by 2^0.9 to 2^12.3 under a recalled complexity constant that is
    itself worth 2^15.3 at g = 8, so on c2pnb176v1 and c2pnb208w1 it is not
    even time-dominant once the constant is charged. Every other frontier row
    was checked before this was written: (i) decomposition-based index calculus
    with the subfield factor base is not a competitor because that factor base
    degenerates to E(F_{2^16}) (IDEA-20260906-6da433's gate; see
    IDEA-20260922-8278db); (ii) decomposition with a general F_2-subspace factor
    base needs summation polynomial S_{k+1} at k >= 11 and is out of reach by
    solving degree, owned by RQ-SDEG-001 and the DREG questions; (iii) the
    quasi-subfield-polynomial line (RQ-QSP-f9bbdb) is indexed to n = 131 and has
    no shape here; (iv) BSGS and generic lower bounds are above rho; (v)
    multi-target and preprocessing frontiers do not apply to a single-target
    table. dominated_by is therefore NOT null and NOT a claim of superiority: it
    is "matched rho, which this beats in time and loses to in memory, with the
    net decided by an accounting the record itself predicts will go against it".
  sota_delta:
    time: >-
      -0.9 to -12.3 bits against matched rho across the five rows in the c = 4k
      lane under the generic outcome (exponent on l: 0.4375 against 0.5), with
      a recalled constant of up to +15.3 bits not charged. Under the
      low-probability m = 3 outcome, -11.9 to -35.3 bits. Under the m = 5 outcome
      in the n = 8 lane on c2pnb176v1, about -12 bits at negligible memory.
    memory: >-
      +38.5 to +80.5 bits of shared random-access storage against rho's
      distinguished-point table (exponent on l: 0.219 against 0).
    data_queries: Not applicable; single-target ECDLP with public parameters and no oracle.
  frontier_check:
    status: pending
    note: >-
      MMT (eprint 2001/084, LMS JCM 5 (2002) 127-174) examines this exact curve
      set and is the dominating prior art; only its abstract was read here and
      the body did not render on this machine. Every cell of the census must be
      diffed against its tables before any cell is described as new, and the
      likely honest outcome is that the live-lane cost table REPRODUCES MMT and
      that only the collapse certificate and the memory charging are this
      program's addition. Coordinator literature acquisition is the blocking
      gate.
  recommended_priority: high
  priority_rationale: >-
    Highest information gain per unit cost in this lane by a wide margin. It is
    the only proposal among the five whose outcome space contains a changed
    verdict on a DEPLOYED row, the probability of that outcome is not negligible
    (about fourteen percent over the ten (curve, lane) pairs that can move,
    under a uniform prior on B's position in the Artin-Schreier filtration), and
    the cost of finding out is four integer computations inside F_{2^16} per
    curve. Its guaranteed output -- twenty-five certified STRUCTURALLY EMPTY
    cells with an argument rather than an assertion, and twenty live cells with
    charged time and memory -- is precisely the artifact RQ-BINSTD-b6f698's
    decision target asks for, for half the composite-degree population, and it
    is produced with zero scientific compute. It is not a constant-factor
    record: the c = 4k lane moves the exponent on l from 1/2 to 7/16, which is
    the known composite-degree phenomenon, and the record's value is in pinning
    that exponent to these five published parameter sets with the memory charged
    honestly rather than leaving the cell OPEN.
  first_deliverable: >-
    The 5 x 9 census table (conjugate period, Artin-Schreier level m under both
    conventions, genus under both branches, transfer-existence verdict) computed
    in F_{2^16} from ANSI X9.62 coefficients, with the Koblitz, uniform-B and
    prime-degree controls attached and the c = 16 baseline-embedding cell
    reproducing m = 1.
  next_gate: >-
    Coordinator acquisition of MMT's body text and a decision on whether the
    census is filed as a reproduction of it or as an extension. No experiment
    contract and no run is requested by this record; Phase 2's toy-cell
    verification of (C1) would be the first thing needing one.
