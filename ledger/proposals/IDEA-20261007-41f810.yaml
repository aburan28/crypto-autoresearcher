idea:
  id: IDEA-20261007-41f810
  question_id: RQ-ECDLP-bc7a54
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: Maximum bucket of x modulo floor(p to the one-third) against a random injection
  class: measurement
  claim: >-
    For an ordinary prime-order subgroup of size N in (2^{10}, 2^{12})
    on a short-Weierstrass curve over F_p, let M = floor(p^{1/3}) and
    let the bucket of a residue a be the number of subgroup points with
    integer x congruent to a modulo M. The largest bucket is at most
    twice the mean bucket N/M. The metric is a bucket size. It is not
    a multiplicative character of x and not an interpolation degree.
  mechanism: >-
    PAIR. Representation R1, the integer x reduced modulo M. Operation
    set Sigma is negation, which preserves x and therefore preserves
    the bucket. TRICHOTOMY. Partial-action. The residue modulo M is
    not a function of a generic translate. LOSSY-PROJECTION TEST. The
    residue discards x except for its class modulo M. The fiber over
    one residue is larger than a negation orbit as soon as the bucket
    has size greater than 2. The test asks whether any residue is
    denser than twice the mean. A dense residue would be a cheap chi.
    It would still need an omega. This proposal does not build one.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-bc7a54
      provenance: internal
      claim: >-
        A dense decidable set still needs an inversion before it is an
        algorithm. A heavy bucket would be one more decidable set.
      verified_by: ledger/questions/RQ-ECDLP-bc7a54.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic-group bound is Omega(N^{1/2}). A bucket size is
        not an operation count.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-5b1c0a
      provenance: internal
      claim: >-
        A representation and subset-sum approach over F_{p^2} costs
        p^{1.314}, worse than rho. This proposal does not run that
        algorithm. It counts residues on a prime field.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
  assumptions:
    - M is at least 2. A smaller M voids the cell.
    - Negation pairs are counted once, since they share x.
    - The curve y^2 = x^3 + x + 1 is not used.
  predictions:
    - metric: >-
        Largest bucket of integer x modulo M, divided by the mean
        bucket N/M, on an ordinary curve.
      direction: lower
      minimum_effect: '<= 2'
  minimal_test: >-
    On the smallest ordinary prime-order curve with N in (2^{10},
    2^{12}), skipping y^2 = x^3 + x + 1, set M = floor(p^{1/3}).
    Count subgroup points by integer x modulo M, after the negation
    quotient. Report the max-to-mean ratio. Repeat on a second
    ordinary curve. Draw one random injection of N labels into F_p
    and reduce modulo M. If that injection's max-to-mean ratio
    exceeds 2, the threshold is void.
  controls:
    - one random injection of N labels into F_p, reduced modulo M
    - negation quotient before the count
    - a second ordinary curve
    - M is at least 2
    - y^2 = x^3 + x + 1 is excluded
  falsification_conditions:
    - >-
      The max-to-mean ratio is strictly above 2 on both ordinary
      curves, and the random injection's ratio is at most 2.
    - >-
      The random injection's max-to-mean ratio is above 2. The
      threshold is then void, and the curve ratio is not evidence.
  confounders:
    - >-
      Points at infinity have no affine x and are omitted. Their
      count is reported and is not placed in residue 0.
    - >-
      If M does not divide p, the residues are not exactly equal in
      the field. The mean used is N/M, and the imbalance of the field
      itself is visible in the random injection.
  interpretation_limits:
    - >-
      A ratio at most 2 does not say that every modulus is flat. It
      prices M = floor(p^{1/3}).
    - >-
      A ratio above 2 would falsify this claim. A heavy bucket is a
      decidable set, not an inversion, and is not an exponent.
    - >-
      This is not a quadratic-character share, not the interpolation
      degree of IDEA-20261006-4c39d3, and not pi congruent to 1 mod n.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At N in (2^{10}, 2^{12}) and M = floor(p^{1/3}) at least 2,
        the integer x-coordinates of a prime-order subgroup, reduced
        modulo M, have maximum bucket at most twice the mean, matching
        a random injection of N labels into F_p up to that factor.
      rigorous_support: >-
        No equidistribution theorem is claimed at cryptographic size.
        The null is one random injection at the same N and M. H1 is
        checked there and is not transferred to N = 2^{256}.
      validation_plan: >-
        Compute the max-to-mean ratio of the random injection. If it
        exceeds 2, H1's threshold is void. Otherwise compare the
        curve ratio with 2. Sample size is the whole subgroup.
  target_complexity:
    time_exponent: >-
      Unchanged at N^{1/2}. A bucket of twice the mean is a constant
      density gain inside one residue, not an exponent.
    memory_exponent: >-
      Unchanged. The histogram has M bins, about N^{1/3}, and is the
      instrument.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations. The file
      was opened. It does not state this bucket ratio.
    hidden_overhead: >-
      No o(1) term is claimed. The bucket size is an integer.
    tradeoff_note: >-
      A heavy bucket would be advice of size 1, the residue, plus a
      list of the bucket. Listing a bucket of size about N/M is
      precomputation of that size. This test does not list an omega
      for the bucket.
  estimated_cost:
    implementation: small
    compute: small
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-5b1c0a
      - KR-RHO-ea34b8
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        relation: adjacent
        delta: >-
          The row requires a representation before any sub-square-root
          algorithm. This proposal measures one residue histogram. The
          exponent stays 1/2. The measured integer is a max-to-mean
          bucket ratio, claimed at most 2.
      - ref: KR-RHO-5b1c0a
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
        relation: orthogonal
        delta: >-
          The row costs a representation attack over F_{p^2} at
          p^{1.314}. This proposal counts x modulo M on a prime field
          and does not build those lists.
  dominated_by: >-
    KR-RHO-13bf67 dominates any algorithm that does not exploit a
    representation. A bucket list of size about N/M is dominated by
    the precomputation tradeoff of KR-RHO-ea34b8 once that list is
    stored. The gap that remains is an omega for one heavy residue.
    This proposal prices the histogram and does not supply that omega.
  sota_delta: >-
    Zero change to the exponent 1/2. The integer measured is a
    max-to-mean bucket ratio, claimed at most 2. No online exponent
    in KR-RHO-ea34b8 moves, because no bucket is inverted.
