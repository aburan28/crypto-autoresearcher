  predictions:
    - metric: T_0(U)/T_BL(1) at epsilon = 0.9, k = 4, a = 1/4, r = 2, batch average
      direction: lower
      minimum_effect: >-
        Below 0.75 with CI excluding 1.0 by U = T_BL/2, and below 0.25 by
        U = 4 T_BL; predicted shape: linear in U with slope about
        -beta k / T_BL, beta in [0.3, 0.7], then a tail to 0.
    - metric: T_0(U)/T_BL(1) for the FIRST 10% of targets at the same epsilon
      direction: lower
      minimum_effect: >-
        Strictly above the batch-average ratio at every U (CI-separated
        for U >= T_BL), and above 0.5 until U >= 4 T_BL; this is the
        binding number for a non-repeatable batch.
    - metric: measured solved fraction relative to the LOWER and UPPER brackets of claim (C)
      direction: different
      minimum_effect: >-
        Inside the brackets at every cell; the gap (UPPER - measured) below
        0.05 when C_sel >= 0.2 and growing as T_0 -> 0.
    - metric: peak stored entries S_peak in the UNCAPPED arm
      direction: higher
      minimum_effect: >-
        Grows with U as the number of new-DP outcomes, predicted about
        U k (1 - C_known) integrated; the CAPPED arm at S_peak = T_BL must
        still show T_0(U)/T_BL below 0.75 by U = 2 T_BL (a weaker but
        frontier-honest claim).
    - metric: T_0(U) under NULL 1 and at phi = 0
      direction: different
      minimum_effect: Equal to T_BL within CI at every U.
    - metric: T_0 = 0 arm per-target cost at U = 32768
      direction: different
      minimum_effect: >-
        Within a factor 2 of sqrt(2 N / U) group operations per target
        (Kuhn-Struik order), reported as the P = 0 comparator; a larger
        deviation flags a bookkeeping problem, not a finding.

  minimal_test:
    design: >-
      STAGE 0 (reading, HARD GATE): read Corrigan-Gibbs-Kogan's multiple-
      discrete-log preprocessing attack and lower bound (KN-LIT-013 records
      the paper as not read), Kuhn-Struik and Fouque-Joux-Mavromati; state
      the multi-instance bound form and whether the composition here is
      already one of their attacks. Absence recorded as absence.
      STAGE 1 (minutes, THE CHEAPEST VALID DISCRIMINATOR): N = 2^24, a = 1/4,
      r = 2, k = 4, T_0 in {T_BL, T_BL/2, 0}, U in {1, 512, 4096}, 3 seeds:
      solved fraction with full resolution accounting, the two brackets, and
      NULL 1. This separates "the batch supplies coverage" from "the batch
      supplies only pending relations that never resolve" in one run.
      STAGE 2 (hours): the full sweep of Step 4 at N in {2^24, 2^27}, 5
      seeds, both memory arms, all nulls and the phi decay.
      STAGE 3 (hours): N = 2^30, 3 seeds, the largest cells only, for the
      N-independence of the T_0(U)/T_BL curve.
      STAGE 4 (hours): toy prime-order curve at N about 2^24, r-adding walk
      r = 32, every resolved logarithm certified. Seeds and CIs as in
      aed829.
    controls:
      - Bernstein-Lange selected table with no batch growth (NULL 1) at every U
      - Kuhn-Struik / T_0 = 0 arm at every U (P = 0 comparator)
      - per-target rho with DPs and no reuse (phi = 0, T_0 = 0)
      - NULL 2 random-point batch entries; NULL 3 relation scramble
      - CAPPED memory arm at S_peak = T_BL
      - first-10% slice beside the batch average
    required_metrics:
      - solved fraction per target index, per cell, with Wilson CIs
      - T_0(U) at epsilon in {0.8, 0.9}, batch average and first-10%, bootstrap CI
      - group operations per target (online) and P for X_0
      - S_peak per arm; bits per entry, frozen
      - outcome-type histogram (i)-(iv) and time-of-resolution histogram
      - component-size distribution of the relation forest at batch end
      - certificate pass count on the curve arm

  falsification_conditions:
    - >-
      T_0(U)/T_BL is not below 1 with CI at U = 4 T_BL, k = 4: the batch's
      own DPs do not substitute for precomputed entries at this budget;
      the record is rejected in its stated regime (explanation B of the
      report).
    - >-
      The measured solved fraction falls below the LOWER bracket: the
      accounting or the union-find is wrong; invalid run set.
    - >-
      NULL 1 shows a T_0 reduction: lookups are leaking; invalid.
    - >-
      The first-10% slice matches the batch average within CI at U >= T_BL:
      the growth is not what drives the gain; a mechanism claim is withdrawn.
    - >-
      The CAPPED arm shows no reduction while the UNCAPPED does: the gain is
      a memory trade, to be reported as a frontier point and not as a T
      reduction.

  confounders:
    - >-
      Memory accounting: batch entries ARE table entries; the RQ's T is the
      precomputed count and S_peak must always be reported beside it.
    - >-
      Order effects: sequential processing favours late targets; the
      first-10% slice and a round-robin arm (all targets walk once, then
      again) guard this.
    - >-
      Pending targets stop walking after a relation; a variant that keeps
      walking could resolve faster at higher L and must not be pooled.
    - >-
      Certification must use the seeded true logs only at check time;
      any leakage into the solver voids the run.
    - >-
      Cap and cycle losses as in aed829.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy. Generic; constant-factor; the exponent
      1/3 (or the Kuhn-Struik 1/2 with U-amortisation) does not move.
    - >-
      The reduction is in PRECOMPUTED entries at fixed per-target L and
      epsilon; it is bought with online memory in the UNCAPPED arm and the
      CAPPED arm is the frontier-honest version.
    - >-
      Applies to a non-adaptive batch of independent targets on one curve;
      says nothing about multi-curve settings (RQ-MTGT-2cabee).

  heuristic_assumptions:
    - id: H4
      statement: >-
        BATCH COVERAGE LAW. The union of the basins of the DPs reached by m
        independent uniform-start batch walks, restricted to basins of size
        below x*_0 W^2, covers C_batch(m) as in claim (C), with relative
        error at most 10% for N >= 2^24, a_m <= 16.
      rigorous_support: >-
        Follows from H1-H2 of IDEA-20260906-aed829 by the same integration
        as the unselected law (B1), truncated at the selection threshold;
        imitates the coupon-collector / size-biased coverage of a random
        partition by random samples.
      validation_plan: >-
        Sample: at N = 2^24 with exact basins, m in T_BL * {1/4 .. 16} batch
        walks after a selected table at a = 1/4, r = 2; compare the exact
        below-threshold coverage with the integral at each m; tail check:
        the largest below-threshold basin stored versus the threshold
        x*_0 W^2 (must be below it in every seed, which audits the
        selection). Transfer: same law at cryptographic N, not tested.
    - id: H1-H2
      statement: Inherited from IDEA-20260906-aed829.
      rigorous_support: As in IDEA-20260906-aed829.
      validation_plan: As in IDEA-20260906-aed829.

  target_complexity:
    time_exponent: >-
      ONLINE per target 1/3 in N at T_BL = N^{1/3} with L = k W fixed;
      unchanged. PRECOMPUTATION 2/3 in N at U = 1, falling to 0 at
      U >= U_0; the record targets the constant of that fall.
    memory_exponent: >-
      Precomputed 1/3 in N at U = 1, falling with U; peak stored entries
      up to 1/3 (CAPPED arm) or growing with U (UNCAPPED arm, reported).
    best_known: >-
      U = 1: Bernstein-Lange selected table (KN-LIT-3060). P = 0: Kuhn-Struik
      about sqrt(2 U N) total (retrieved summary); Fouque-Joux-Mavromati
      O~(sqrt(N U)) (retrieved summary); tight generic bounds without advice
      Theta(sqrt(U N)) (Yun, KN-LIT-4091; Ying-Kunihiro; Hhan-Yamakawa-Yun,
      listings). With advice and U targets: Corrigan-Gibbs-Kogan state a
      bound and an attack (abstract-level; NOT READ).
    hidden_overhead: >-
      Union-find is O(U alpha(U)); lookups O(1); the restart scalar
      multiplications O(k log N) per target. The UNCAPPED arm's memory
      growth is the overhead most likely to be understated and is reported
      as S_peak.
    tradeoff_note: >-
      Interpolates between the Bernstein-Lange point (P = 1.24 N^{2/3},
      S = N^{1/3}) and the Kuhn-Struik point (P = 0, S = batch DPs) on the
      (P, S, L, epsilon, U) frontier; whether the interpolation lies strictly
      inside the convex hull of the two endpoints at fixed (L, epsilon) is
      exactly what T_0(U) measures. Parallelisation: targets' walks are
      independent until a relation; the union-find is a serial bottleneck of
      negligible cost.

  dominated_by: >-
    CHECKED ROW BY ROW. Bernstein-Lange at U = 1: this record IS that point
    at U = 1 (tie). Kuhn-Struik / FJM at P = 0: dominates this record on P
    for U >= U_0 and on precomputed memory always; does not dominate on
    per-target L for U < U_0 at the same peak memory (to be measured).
    Rho with DPs per target: dominated by both on time. CGK single-instance
    bound: respected. CGK multi-instance bound: form NOT READ; the record
    may be dominated by their attack -- Stage 0 decides. May-Ostuzzi: group
    actions, not this group. dominated_by on the (T_0 at fixed L, epsilon,
    U, S_peak <= T_BL) axis: null after this check, conditional on Stage 0.
  sota_delta: >-
    Predicted precomputed-table reduction T_0(U)/T_BL below 0.75 by
    U = T_BL/2 and below 0.25 by U = 4 T_BL at k = 4, epsilon = 0.9, at equal
    per-target L and equal peak memory in the CAPPED arm; exponents unchanged.
    Against Kuhn-Struik the delta is a lower per-target L for U < U_0 at the
    price of P; against Bernstein-Lange it is lower P at the price of online
    memory growth (UNCAPPED) or nothing (CAPPED, if the capped arm fails).

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that T_0(U) falls with U with a CI-separated margin by U = 4 T_BL
    (the mechanism is the same reuse Kuhn-Struik already rely on). 0.5 that
    the CAPPED arm keeps most of the reduction. 0.5 that the composition is
    already Corrigan-Gibbs-Kogan's multi-DL attack in some form, which would
    make the record `known` and leave only the charged curve as the
    contribution. 0.7 that the resolution loss stays below 0.05 while
    C_sel >= 0.2.

