  question_id: RQ-ECDLP-78dbc5
  goal_id: null
  added: '2026-09-06'
  id_allocation_provenance: >-
    Minted by the coordinator with `python3 tools/allocate_id.py --next idea
    --date 20260906`, confirmed free with `--check`, and relayed in the
    in-session handoff TASK-20260906-ideation-RQ-ECDLP-78dbc5. Not derived by
    scanning state.
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-06'

  title: >-
    THE BATCH-GROWN TABLE WITH RELATION-GRAPH ACCOUNTING: precompute only
    T_0 < T_BL selected entries, let the U targets' own terminal distinguished
    points (solved or not) join the table as (point, affine-in-unknowns
    scalar) entries, resolve targets through a weighted union-find of
    relations, and measure the recurrence T_0(U) at fixed per-target budget L
    and success epsilon -- predicted to fall linearly in U with slope set by
    the below-threshold basin mass, reaching T_0 = 0 (pure Kuhn-Struik /
    Fouque-Joux-Mavromati) at U of order N/(k W^2)
  class: composition

  claim: >-
    (A) SETTING (U > 1, one table, one group). Targets Q_1..Q_U are processed
    sequentially (or in rounds); target u runs at most k online walks from
    Q_u + [c]P, each ending at a DP d after about W steps, so the per-target
    budget is L <= k W group operations. Outcomes of a walk at d:
      (i)   d in the precomputed table X_0 (known log): u is SOLVED, certificate
            [k_u]P == Q_u checked;
      (ii)  d is a batch entry owned by an already-solved target: u SOLVED;
      (iii) d is a batch entry owned by an unsolved target v: the walks give
            (a_u + b_u k_u) = (a_v + b_v k_v) mod N, a RELATION; u and v are
            merged in a weighted union-find over Z/N and u stops walking;
      (iv)  d is new: d is stored with (a_u, b_u, u) and u walks again (up to k).
    Whenever a component's root becomes solved, every member is solved and
    certified. At the end of the batch, unresolved components are failures.
    This composes Bernstein-Lange (KN-LIT-3060), Kuhn-Struik reuse of earlier
    walks' DPs (retrieved), and the Fouque-Joux-Mavromati relation graph
    (retrieved). NOTHING in the composition is new; the new content is the
    QUANTITY it asks for and the accounting rule that makes the quantity
    honest.
    (B) THE QUANTITY. T_0(U; L, epsilon): the smallest precomputed table
    (built with the same selection rule and the same P per entry as the
    U = 1 baseline) such that the batch of U targets achieves per-target
    success at least epsilon at budget L, averaged over the batch and ALSO
    reported for the first 10% of targets (who see the smallest table).
    Report the ratio T_0(U)/T_BL(1) with a bootstrap CI over seeds, and the
    peak stored set S_peak (precomputed + batch entries) beside it, because a
    batch that stores its DPs is trading online memory for precomputed
    entries and the RQ definition requires that to be shown on the
    (P, S, L, epsilon, U) frontier rather than hidden.
    (C) THE MODEL PREDICTION (H1, H2 of IDEA-20260906-aed829, plus H4). The
    precomputed selected table covers the basins above a size threshold
    x*_0 W^2 with coverage C_sel(T_0). Every batch walk is a fresh uniform
    start, so after m batch walks the union of the batch's stored basins
    (which live below the threshold) covers
      C_batch(m) = (2 pi)^{-1/2} * integral_0^{x*_0} x^{-1/2} (1 - e^{-a_m x}) e^{-x/2} dx,
      a_m = m W^2 / N,
    and the known-set coverage seen by the next target is C_sel + C_batch(m).
    Two brackets follow for the solved fraction: LOWER = only outcomes (i)-(ii)
    count at the time of the hit; UPPER = any hit on a known DP counts (as if
    all pendings resolve). The measured solved fraction must lie between
    them; the gap is the deferred-resolution loss, predicted small while
    C_sel >= 0.2 (most components touch the table within k walks) and large
    as T_0 -> 0, where the batch is pure Kuhn-Struik and resolution is the
    whole game. Consequences stated as predictions: (C1) T_0(U) decreases in
    U; in the linear regime U k W^2 / N <= 1 the slope dT_0/dU is about
    -beta k with beta = (mean basin of a stored batch DP)/(mean basin of a
    precomputed selected entry), i.e. beta about 0.886 x-bar_batch / x-bar_sel,
    predicted in [0.3, 0.7] at a = 1/4, r = 2; (C2) T_0(U) reaches 0 at
    U_0 of order N/(k W^2) times a constant of order 1-3 for epsilon = 0.9,
    which at T_BL = N^{1/3}, a = 1/4, k = 4 is U_0 of order T_BL to 3 T_BL;
    (C3) the first-10% success is strictly below the batch average and is
    the binding constraint whenever the batch is not re-run. GENERIC,
    CONSTANT-FACTOR: no exponent moves; the per-target cost at U >= U_0
    matches the known Kuhn-Struik / FJM sqrt(2 U N)/U per target only in
    order of magnitude and the record claims nothing beyond the measured
    T_0(U) curve.

  mechanism: >-
    STEP 1. Build X_0 with T_0 entries by the count rule at r = 2, a = 1/4
    (Bernstein-Lange point), P charged; also with the length rule of
    IDEA-20260906-05ffb8 as a second arm.
    STEP 2. Draw U targets with seeded known logs (for certification only;
    never read by the solver). Process sequentially with the four outcomes
    of claim (A); weighted union-find with path compression storing, per
    node, the affine relation to its root.
    STEP 3. Record per target: number of walks used, group operations,
    outcome type, time-of-resolution (immediately, later in the batch, or
    never); certificate check at resolution.
    STEP 4. Sweep T_0 in T_BL * {0, 1/8, 1/4, 1/2, 3/4, 1} and U in
    {1, 8, 64, 512, 4096, 32768} at N in {2^24, 2^27, 2^30}, k in {2, 4, 8};
    interpolate T_0(U) at epsilon in {0.8, 0.9} for the batch average and for
    the first-10% slice.
    STEP 5. Two memory arms: UNCAPPED (all batch DPs stored) and CAPPED
    (S_peak <= T_BL; once full, new batch DPs are stored only if a relation
    can be recorded, otherwise dropped), so the frontier point is reported
    at equal peak memory as well.
    STEP 6. Controls and nulls below; every solved log certified by an
    independent scalar multiplication on the curve arm.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Corpus and web search as in IDEA-20260906-aed829, plus: Kuhn-Struik
      (SAC 2001; PDF fetched, summary read), Fouque-Joux-Mavromati (ASIACRYPT
      2014; search summary), Hitchcock-Montague-Carter-Dawson (IJIS 2004;
      search summary), Corrigan-Gibbs-Kogan multi-DL statements (abstract-
      level only; PDF unparsed), Yun 2015 (KN-LIT-4091), Ying-Kunihiro 2017,
      Hhan-Yamakawa-Yun 2024 (arXiv 2402.11269, listing), Auerbach-Giacon-
      Kiltz 2020 (KN-LIT-3717 title-only; search summary), May-Ostuzzi PKC
      2025 (search summary), KN-LIT-5040 (Kim, multiple DL with auxiliary
      inputs), KN-LIT-097 (batch remark).
    results: >-
      Corpus: no record grows a Bernstein-Lange table during a batch or
      states a T_0(U) recurrence; H-MTIC-001 uses the Kuhn-Struik figure as
      a comparator only; TASK-20260904-e87737 names Kuhn-Struik as the
      correct batch baseline for index calculus. External: Kuhn-Struik reuse
      DPs of solved instances (about sqrt(2 L N) total, per the fetched
      summary); FJM build the relation graph among users and recover all
      keys when it connects (O~(sqrt(N L))); Corrigan-Gibbs-Kogan's abstract
      announces "a new generic preprocessing attack for the multiple-
      discrete-log problem" whose content this session COULD NOT READ -- it
      is the single most likely place where this exact composition already
      exists, and Stage 0 is a reading of it; May-Ostuzzi give the group-
      action analogue (hint s, online t, and sqrt(m) N^{1/2} for m instances)
      but, per the summary, treat precomputation and multi-instance
      separately. The coordinator's scratch (internal, unverified) shows the
      any-known-DP hit rate rising from 0.69 to 0.87 across 40000 sequential
      targets at N = 2^30 with T_0 = 1024 -- the UPPER bracket only, with no
      resolution accounting, no null, no certificate.
    verdict: >-
      ADAPTATION. Every ingredient is published; the composition is
      natural and may be in Corrigan-Gibbs-Kogan's multi-DL attack or in
      Auerbach-Giacon-Kiltz. What this program lacks and this record
      supplies is the charged T_0(U) curve with the resolution accounting
      and the peak-memory arm.

  discriminated_from:
    - >-
      Kuhn-Struik (retrieved): P = 0, no selected table; this record's
      T_0 = 0 arm IS Kuhn-Struik and is a mandatory control, not the claim.
    - >-
      Fouque-Joux-Mavromati (retrieved): the relation graph among L users
      without precomputation; adopted here as the resolution structure.
    - >-
      IDEA-20260807-ea3915: M GROUPS with advice; this record is one group,
      U targets.
    - >-
      IDEA-20260726-001 / H-MTIC-001: multi-target index calculus; different
      algorithm, shares only the Kuhn-Struik comparator.
    - >-
      IDEA-20260906-05ffb8: selection statistic of the PRECOMPUTED part;
      used here as an arm, not duplicated.
    - >-
      IDEA-20260906-aed829: supplies C_sel and the (B1)-type law used in the
