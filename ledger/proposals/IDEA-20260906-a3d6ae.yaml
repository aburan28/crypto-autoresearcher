  object_first_candidate:
    tracked_object: >-
      THE KNOWN-DP SET WITH ITS RELATION FOREST: entries (d, a, b, owner) and
      the union-find over owners, followed target by target.
    lossiness: >-
      GENUINELY LOSSY: forgets every intermediate walk point; retains DPs,
      affine scalars and the component structure.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED. One more walk updates the set by one of
      the four outcomes, each computable from the retained data alone
      (lookup, relation solve, union). Not a change of coordinates: the
      walks are not recoverable from the set.
    survival_score: >-
      Survives arbitrary batch length; its usefulness saturates when the
      known coverage approaches 1 (a_m large). Dies if walks are not
      functions of the point (then basins are not well defined and the
      relation from a shared DP still holds, but the coverage model does
      not).

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL 1 (phantom batch): store batch DPs but
    disable lookups against them; T_0(U) must equal T_BL for every U within
    CI. NULL 2 (random points): replace each stored batch DP by a uniformly
    random group element with the same bookkeeping; hits on batch entries
    must occur at the chance rate (stored entries)/N, i.e. zero at every
    toy size. NULL 3 (relation scramble): permute the (a, b) scalars among
    batch entries; every certificate on a batch-resolved target must fail,
    which audits the union-find. DECAY PARAMETER phi: store only a fraction
    phi of the batch DPs (phi in {0, 0.25, 0.5, 0.75, 1}); the T_0 reduction
    must increase monotonically with phi, and the T_0 = 0 arm at phi = 0
    must be pure per-target rho with no reuse. STRUCTURAL TELL: the
    first-10% success must stay BELOW the batch average; a batch whose
    early targets do as well as its late ones is not using the growth.

  assumptions:
    - >-
      Basin model of IDEA-20260906-aed829 (H1, H2). The batch coverage law
      in claim (C) is a derivation of this record, not a cited result.
    - >-
      Kuhn-Struik's sqrt(2 L N) figure is relayed from a WebFetch summary of
      the SAC 2001 PDF and is used only as the T_0 = 0 comparator; the
      summary tool's reliability is limited and the figure must be re-read.
    - >-
      Corrigan-Gibbs-Kogan's multi-DL preprocessing lower bound and attack
      were NOT read; the record does not claim to be inside or outside them.
    - >-
      Targets are independent uniform; the batch is non-adaptive; no target
      is a live key (RQ constraint).

