idea:
  id: IDEA-20261003-76df35
  question_id: RQ-ECDLP-bc7a54
  goal_id: GOAL-ECDLP-001
  goal_id_note: >-
    Copied from RQ-ECDLP-bc7a54 goal_ids. Binding and any budget consequence
    are Coordinator decisions; this record makes none.
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    AN UNCERTAINTY PRINCIPLE FOR HINT FAMILIES: every subset D of a prime-order
    E(F_p) satisfies |D| <= 4 (C sqrt(p) + 1) A_x(D) A_L(D), where A_x is the
    Wiener norm of D's x-coordinate profile over additive characters of F_p
    and A_L the Wiener norm of its discrete-log profile over characters of
    Z/n -- so no set is both interval-recognizable and kangaroo-invertible
    beyond sqrt(p) polylog points, which makes the recognizable/invertible
    duality a THEOREM over the 'spectrally simple chi x structured-exponent
    omega' class exactly at alpha = 1/2; the one open number is the exponent
    Wiener norm A_L(W(m, w)) of the low-weight set, which decides whether the
    invertible side's canonical example D_w lies inside the theorem
  class: mechanism

  claim: >-
    WHICH SIDE. The impossibility side: the duality stated and proved in a
    named model, with a toy certificate. Representation class R1 of
    RQ-ECDLP-623a32 (x-coordinate in F_p); attack stage: the joint (chi, omega)
    design of HINTWALK.

    (A) DEFINITIONS. E/F_p ordinary, n = #E(F_p) prime, p != n, g a generator.
    For D contained in E(F_p) minus O and closed under negation (the x(-Q) =
    x(Q) quotient taken first, as the RQ requires), the COORDINATE PROFILE is
    f_D : F_p -> {0, 1}, f_D(u) = 1 iff u = x(Q) for some Q in D, and the
    EXPONENT PROFILE is h_D = indicator of log_g(D) in Z/n. Expand
    f_D(u) = sum_a fhat(a) e_p(au), h_D(k) = sum_t hhat(t) e_n(tk), and set
    A_x(D) = sum_a |fhat(a)|, A_L(D) = sum_t |hhat(t)| (Wiener norms). Let
    S(a, t) = sum_{Q != O} e_p(a x(Q)) e_n(t log_g Q) (the MIXED SPECTRUM of
    the curve) and C(E) = max_{a != 0, t} |S(a, t)| / sqrt(p).

    (B) THEOREM U (UNCERTAINTY). If |D| <= p and A_L(D) <= p/2 then
      |D| <= 4 (C(E) sqrt(p) + 1) A_x(D) A_L(D).
    PROOF (to be written in full at Stage 0). |D| = sum_{Q != O} f_D(x(Q))
    h_D(log Q) = sum_{a,t} fhat(a) hhat(t) S(a, t). S(0,0) = n - 1, S(0, t != 0)
    = -1, |S(a != 0, t)| <= C(E) sqrt(p) + 1. With fhat(0) = |D|/(2p) and
    hhat(0) = |D|/n: |D| <= |D|^2/(2p) + (|D|/(2p)) A_L + (C(E) sqrt(p) + 1)
    A_x A_L, and the hypotheses absorb the first two terms. C(E) is bounded
    by the Kohel-Shparlinski estimate (retrieved at secondary level as Lemma 1
    of Ahmadi-Shparlinski: sum over the cyclic group of psi(x(nG)) chi(nG) <<
    q^{1/2} for ordinary E, any nonprincipal psi, any group character chi),
    so C(E) = O(1) uniformly in p; the toy certificate measures it.

    (C) THE DUALITY AS A THEOREM OVER A CLASS. Class K(K1, K2): chi accepts a
    set X with A_x(X) <= K1 (any union of r intervals of x has A_x <= r((4/pi^2)
    ln p + 2): D_x(B) of the note, unions of windows, x mod q residue windows),
    and omega is a collision search (kangaroo, Gaudry-Schost, BSGS) whose
    domain is a structured exponent set with A_L <= K2 (intervals, arithmetic
    progressions, 2-dimensional GLV boxes: A_L = O(ln n) to O(ln^2 n)). A
    hint family in K(K1, K2) has |D| <= 4 (C sqrt(p) + 1) K1 K2, hence
      alpha <= 1/2 + log(4 C K1 K2 + o(1)) / log n,
    and HINTWALK costs at least n^{1/2} / (4 C K1 K2). With K1, K2 polylog the
    exponent is EXACTLY the generic 1/2: no interval-type chi and no
    structured-exponent omega share a dense set. Two readings of the same
    inequality:
      D_x side: A_L(D_x(B)) >= B / (4 (C sqrt(p) + 1) A_x) -- the log-image of
      D_x is spectrally complex unless B <= sqrt(p) polylog, so D_x has no
      structured-exponent omega (this is the note's "no known omega",
      PROVED for this omega class).
      Interval-of-logs side: A_x(D_I(L)) >= L / (4 (C sqrt(p) + 1) O(ln n)) --
      an interval of logs has no interval-type chi (PROVED for this chi class).

    (D) PIECEWISE COROLLARY (secondary, stated with its weakness). If omega is a
    table of R pieces, piece r a set X_r with A_x(X_r) <= K and a log-window
    J_r of width E <= n/2 with X_r contained in log^{-1}(J_r), the joint form
    |X cap L| <= |X||L|/n + (C sqrt(p) + 1) A_x(X) A_L(L) gives |X_r| <=
    2 (C sqrt(p) + 1) K O(ln n), so a table of S = R words supports
    |D| <= S K sqrt(p) polylog and HINTWALK T >= sqrt(n) / (S K polylog). This
    is a curve-specific (non-generic) lower bound for one advice class; it is
    WEAKER in form than Corrigan-Gibbs-Kogan's generic S T^2 >= n and is
    reported only because it holds on E(F_p) itself. It does not bound
    Bernstein-Lange trail tables, whose power is the walk, not a hint set.

    (E) THE OPEN NUMBER. D_w = {g^k : k in W(m, w)} is the invertible side's
    canonical example. Theorem U says something about D_w only if A_L(W(m, w))
    is small. A_L(W) depends on n, m, w only (no curve), so it is measurable
    exactly by one FFT up to n = 2^26. E-STRUCTURED: A_L(W) <= (ln n)^3 --
    then Theorem U PROVES that no chi with A_x <= |W| / (sqrt(p) polylog)
    recognises D_w, i.e. the duality's D_w column becomes a theorem for
    interval-type chi. E-SPREAD: A_L(W) >= 0.05 |W|^{1/2} -- then D_w lies
    outside the theorem, and the forward guidance is exact: any escape must
    pair a chi or an omega whose set is spectrally complex on its own side,
    as D_w's is.

    (F) CEILING. Theorem U holds on anomalous curves (ordinary), where a
    (1, polylog) hint family exists with D = E(F_p); there is no contradiction
    because at |D| about n the |D|^2/(2p) term carries everything -- the
    theorem constrains SPARSE doubly-simple sets, never a curve's hardness.
    chi's with large A_x (Legendre symbol of x, multiplicative-subgroup
    membership of x: A_x about sqrt(p) by Gauss-sum size) are outside K and
    are named as such.

  mechanism: >-
    OBJECT FRAME. Representation: R1 (x in F_p, expanded in additive
    characters). Tracked object: the pair of profiles (f_D, h_D) summarised by
    the Wiener-norm pair (A_x, A_L), and the curve's mixed spectrum S(a, t)
    that couples them. Operation set Sigma: translation by group elements,
    acting on the exponent profile as a shift (so A_L is invariant: a shift
    only modulates hhat) and on the coordinate profile not at all (translation
    scrambles x, so A_x is not invariant); and, on j = 0 curves, the
    automorphism beta, under which both norms are invariant up to relabelling.
    TRICHOTOMY: the coordinate half is Class III (coordinate-dependent: A_x is
    a function of the representation); the exponent half is a quotient-type
    invariant of translation. That asymmetry IS the duality, and Theorem U is
    the statement that the two halves cannot both be small on one sparse set.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The summary D -> (A_x(D), A_L(D))
    discards everything about D except two norms (massively lossy); A_L
    propagates deterministically under translation (invariant), A_x does not
    and is not claimed to; the summary is not a change of coordinates.
    PRICED OPEN NUMBERS: C(E) (the uncertainty constant of the curve, measured
    exhaustively) and A_L(W(m, w)) (the scope number).
    WHY THIS IS NOT D_x OR D_w IN NEW NOTATION. D_x and the interval of logs
    are the two INSTANCES the theorem reads off; the theorem is a size bound
    on every set with both norms small, and its scope question about D_w is a
    measured number, not a relabelling. WHY IT IS NOT IDEA-20260815-f558e4 (E):
    that is the LINEAR form (one statistic against one log character, an
    advantage bound); Theorem U is BILINEAR in two Wiener expansions and
    yields a SET-SIZE bound, which is what "is the duality provable" needs.
    OFF-LIMITS AS PRIMARY LENS: F1-F7 of IDEA-20260802-002; this lane's
    closures (376b00, a5757d, a92b0f, faca6f). F1 (kangaroo / BSGS) appears
    only as the omega CLASS being bounded, F6 only as the j = 0 control.

  novelty_status: unverified

