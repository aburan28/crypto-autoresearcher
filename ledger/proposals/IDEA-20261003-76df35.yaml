        Special case of Kohel-Shparlinski Corollary 1 [ANTS-IV, LNCS 1838
        (2000) 395-404]: for ordinary E/F_q and G of order T, any group
        character chi and nonprincipal additive psi, sum over n in Z_T of
        psi(x(nG)) chi(nG) << q^{1/2}. This is exactly the bound on S(a, t),
        a != 0, that Theorem U consumes (implied constant unstated).
      verified_by: >-
