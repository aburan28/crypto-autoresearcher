  citation_note: >-
    Theorem U is a short consequence of the cited character-sum bound; its
    constants are hand-derived and labelled. No run exists.

  assumptions:
    - n prime and p != n for the stated constant; the anomalous case n = p is treated separately in Stage 0 (frequency blocks), and the theorem's form survives.
    - D is closed under negation (the x(-Q) = x(Q) quotient is taken before any claim, per the RQ constraint).
    - Interval Wiener norm bound A_x([0, B)) <= (4/pi^2) ln p + 2 is the standard Dirichlet-kernel estimate (recalled; the Stage 1 computation checks it exactly).
    - 'Off-limits components used: F1 (collision search) as the bounded omega class; F6 (automorphism) as the j = 0 control.'
    - No factor base appears; KN-OPEN-020 is not engaged.

  proof_search_map:
    bottleneck: >-
      The membership of the invertible side's canonical sets in the class:
      Theorem U is sharp for structured-exponent sets and silent for sets
      whose exponent profile is spectrally complex. Whether D_w is one of the
      latter (A_L(W) large) is the step that decides whether the duality's
      D_w column is a theorem.
    baseline_embedding:
      parameter_slice: >-
        A_x = A_L = 1 corresponds to D = everything (f = h = 1): the main term
        n - 1 reproduces |D| = n - 1 with no error -- the theorem degenerates
        correctly at alpha = 1 (the hypothesis |D| <= p is what excludes it).
        D_x(B) alone (A_L unconstrained) reproduces the known statement that
        the logs of small-x points equidistribute (the f558e4 pinning) as the
        joint form with L = an interval.
      reproduction_check: >-
        Frozen fixture on every toy curve: Theorem U evaluated with the
        MEASURED C(E) must hold for every constructed D (ratio tau(D) <= 1);
        A_x(D_x(B)) and A_L(D_I(L)) computed exactly must be below the
        Dirichlet bound.
    observation_collision:
      observable: The pair (A_x(D), A_L(D)) and the curve constant C(E).
      distinct_preimage_search: >-
        Two sets with the same norms can differ arbitrarily -- harmless, the
        conclusion is a size bound over the whole norm class. The collision
        that matters: an anomalous curve (weak) and a random curve (strong)
        are predicted to have the SAME C(E) band, so C(E) does not certify
        hardness; it certifies only the size bound for sparse doubly simple
        sets. Recorded so no later record reads a small C(E) as curve security.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the linear advantage of one statistic (f558e4) by the
          bilinear pairing of two Wiener expansions, which is the state a
          joint (chi, omega) design consumes.
        predicted_gain: A set-size bound with exponent exactly 1/2 for the whole class K(polylog, polylog).
      - transform: representation_reduction
        proposed_object: >-
          Hint family -> (A_x, A_L) -> mixed spectrum. ENCODING exact;
          COMPLETENESS: every D has both profiles; SOUNDNESS: conditional on
          the cited bound; TRANSFER: uniform in p; COST LOSS: the factor 4 and
          the Wiener norms themselves (polylog for the named classes).
        predicted_gain: The duality proved for interval-type chi and structured-exponent omega.
      - transform: observable_fiber
        proposed_object: >-
          Hold the class fixed and vary the curve: random, j = 0 (exact 6-fold
          spectral symmetry), anomalous (theorem holds, curve weak),
          relabelled null (no Weil bound; C_null about sqrt(ln pn)).
        predicted_gain: Shows the theorem is a statement about the class, not about curve hardness.
    quantifier_order: >-
      FOR ALL ordinary prime-order E/F_p, FOR ALL D closed under negation with
      |D| <= p and A_L(D) <= p/2: |D| <= 4 (C(E) sqrt(p) + 1) A_x(D) A_L(D),
      with C(E) <= C_0 an absolute constant (by the cited bound). The class K
      is fixed BEFORE the curve; no witness depends on the target. The scope
      statement about D_w is EXISTS-free: it is a measured value of A_L(W) per
      (n, m, w).
    method_ceiling:
      strongest_certifiable_claim: >-
        "On every ordinary prime-order E(F_p), a set recognised by an interval-
        type chi (A_x <= K1) and inverted by collision search on a structured
        exponent set (A_L <= K2) has at most 4 (C sqrt(p) + 1) K1 K2 points;
        HINTWALK in this class costs at least n^{1/2} / (4 C K1 K2); C(E) on
        the tested curves is as measured; A_L(W(m, w)) is as measured." It
        cannot certify anything about chi's or omega's with large Wiener
        norm (Legendre, multiplicative subgroups, digit statistics,
        polynomial omegas -- the latter is IDEA-20261003-cd1903's model), nor
        a curve's hardness.
      nearby_object_control: >-
        The relabelled generic group, where no Weil bound exists: C_null is
        expected near sqrt(ln(pn)) and grows, so the same inequality holds
        there only with a larger, size-dependent constant -- a measured
        difference between the curve and the generic group IN THE HARDNESS
        DIRECTION. And the anomalous curve, where the theorem holds and a hint
        family exists at alpha = 1 (outside the theorem's |D| <= p regime).
    proof_obligations:
      - claim: Theorem U with constants, including the n = p case.
        responsibility: correctness
      - claim: Interval and union-of-intervals Wiener bounds (chi side); interval, AP and GLV-box Wiener bounds (exponent side).
        responsibility: size
      - claim: Class K corollary alpha <= 1/2 + log(4 C K1 K2)/log n and the HINTWALK floor.
        responsibility: scope
      - claim: Piecewise corollary (D) and its comparison with Corrigan-Gibbs-Kogan, stated as weaker.
        responsibility: interface
      - claim: Mixed spectrum computable in n FFTs of length p (O(n p log p)); A_L(W) in one FFT of length n.
        responsibility: runtime
    not_applicable_reason: null

  null_object_control: >-
    NULL-1 (MANDATORY): Z/n relabelled by a random bijection onto the x-values
    of a matched curve with the pairing label(k) = label(n - k) preserved;
    C_null and every Wiener norm computed by the identical code path; 10 draws
    per size. NULL-2: matched random prime-order curves, 10 per size. POSITIVE
    CONTROL (RQ-mandated): j = 0 prime-order curves, where x(beta Q) = zeta
    x(Q) and log(beta Q) = lambda log Q force S(a, t) = S(zeta a, lambda t) =
    S(a, -t) EXACTLY; the instrument must recover the 6-fold orbit structure of
    the spectrum (and only the 2-fold one on random curves), and the
    beta-closed set D_x^beta(B) = union of beta^i D_x(B) must show
    |D_x^beta| = 3 |D_x(B)| minus counted overlaps and A_x(D_x^beta) <= 3
    A_x(D_x(B)). DECAY TEST: C(E) across a 16x range of p must be flat (slope
    in ln p consistent with 0); C_null must grow like sqrt(ln pn).

  predictions:
    - metric: M1 -- C(E) = max over a != 0, all t, of |S(a, t)|/sqrt(p), exhaustive, p in {2^10, ..., 2^14}
      direction: lower
      minimum_effect: >-
        C(E) <= 4 on every curve (recalled constant 2 deg x), slope in ln p
        consistent with 0. A curve with C(E) > 6, or a slope with CI excluding
        0 upward, contradicts the cited bound or the code and stops the run.
    - metric: M2 -- C_null on NULL-1 at the same sizes
      direction: higher
      minimum_effect: >-
        About sqrt(ln(pn)) (hand estimate 4.1 at p = 2^12, 4.4 at p = 2^14:
        maximum of pn exponential |S|^2/n variables), growing in p; predicted
        above the curves' maximum at the two largest sizes. Equality of the
        two bands is reported as "the curve is not more uniform than a random
        labelling in the worst case at toy sizes" and is not a falsification
        of Theorem U.
    - metric: M3 -- tightness ratio tau(D) = |D| / (4 (C(E) sqrt(p) + 1) A_x A_L) over the constructed library
      direction: lower
      minimum_effect: >-
        FORCED <= 1 for every D (D_x(B), D_I(L), their intersections and
        unions, j = 0 beta-closures, random sets). Reported: the maximum over
        the library, predicted below 0.05 (the theorem is loose by at least a
        log factor). A family with tau near a constant above 0.2 would be the
        extremal object and is reported as such.
    - metric: M4 -- A_L(W(m, w)) for n in {2^20, 2^22, 2^24, 2^26}, m = log2 n - 2, w in {m/8, m/4, 3m/8, m/2}
      direction: different
      minimum_effect: >-
        E-SPREAD iff A_L(W) >= 0.05 |W|^{1/2} at every cell (D_w outside the
        theorem); E-STRUCTURED iff A_L(W) <= (ln n)^3 at every cell (D_w's
        duality column becomes a theorem for interval chi); otherwise
        E-POWER with the fitted exponent of A_L(W) against |W| reported. Honest
        prior 0.7 on E-SPREAD.
    - metric: M5 -- A_x of chi sets outside the class (Legendre-symbol set, index-2 and index-4 multiplicative-subgroup sets, Thue-Morse sign set)
      direction: higher
      minimum_effect: Of order sqrt(p) for the character-defined sets (Gauss-sum size); reported to fix the class boundary by measurement.
    - metric: M6 -- j = 0 spectral orbit structure
      direction: same
      minimum_effect: FORCED exact equalities S(a, t) = S(zeta a, lambda t) = S(a, -t) to float tolerance 1e-9 sqrt(p) on every pair; failure voids the run.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the main deliverable). Write Theorem U, the class
      K corollary, the D_x and interval-of-logs readings, the piecewise
      corollary with its CGK comparison, and the anomalous treatment; retrieve
      the primary Kohel-Shparlinski statement and its constant or record it
      unretrievable.
      STAGE 1 (toy certificate; minutes). For p in {2^10, 2^11, 2^12, 2^13,
      2^14} (nearest primes with prime-order curves): 10 random curves, 10
      NULL-1 relabellings, 2 j = 0 curves, 1 anomalous curve where available.
      Discrete-log table; for each t in Z/n, the length-p array u ->
      sum over Q with x(Q) = u of e_n(t log Q), FFT over F_p, giving S(., t);
      C(E) and its argmax; exact orbit checks on j = 0.
      STAGE 2 (Wiener norms; minutes). A_x and A_L for the library: D_x(B)
      with B = p^{0.5, 0.6, 0.7, 0.8, 0.9}; D_I(L) with L = n^{same}; their
      intersections; unions of r intervals; beta-closures; random sets of the
      same sizes; the out-of-class chi sets of M5. tau(D) for each.
      STAGE 3 (the open number; minutes). A_L(W(m, w)) by one length-n FFT per
      cell for n up to 2^26, with the interval [0, 2^m) and a random set of size
      |W| as calibration rows (forced O(ln n) and about sqrt(|W|) respectively).
      OUTCOME TABLE. Theorem U holds on every D with measured C(E) bounded and
      flat (the expected outcome): record the duality as proved over class K
      with C(E) as the measured constant and scope the ladder; then E-SPREAD
      (D_w outside; forward guidance: an escape must use a spectrally complex
      set on one side) or E-STRUCTURED (D_w's column proved for interval chi).
      ARTIFACT: tau > 1 anywhere, C(E) growing, orbit equalities failing, or
      calibration rows off their forced values: void.
      FALSIFICATION THRESHOLDS, FIXED NOW: as in predictions M1, M3, M4, M6.
    controls:
      - NULL-1 relabelled Z/n with x-pairing preserved (mandatory), identical code path.
      - NULL-2 matched random prime-order curves.
      - j = 0 beta-orbit positive control (exact spectral equalities; factor-3 set gain).
      - Calibration rows -- interval (A_L, A_x forced O(ln)), random set (forced about sqrt(size)), D = everything (forced |D| = n - 1 identity).
      - Anomalous curve as the ceiling object (theorem holds, curve weak).
      - Decay test of C(E) in p.
    required_metrics:
      - C(E) per curve with argmax (a, t); C_null per draw
      - A_x, A_L, |D| and tau(D) for every library set
      - A_L(W(m, w)) per cell with the two calibration rows
      - j = 0 orbit-equality residuals
      - sha256 of the Stage 0 note and every table

  falsification_conditions:
    - 'F1. tau(D) > 1 for any D with the measured C(E): Theorem U or the code is wrong; stop.'
    - 'F2. C(E) > 6 on any curve or rising in p with CI excluding 0: contradicts the cited bound or the code; stop.'
