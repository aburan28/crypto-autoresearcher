      verified_by: Read the corpus entry (abstract level) this session.
    - ref: KN-LIT-5135
      provenance: kb
      claim: >-
        Differential-view meet-in-the-middle preimage attacks reach 57 steps of
        SHA-1 at ~2^150 compression evaluations; the round depth D is compared
        against.
      verified_by: Read the corpus entry (abstract level) this session.
    - ref: Todo, Structural Evaluation by Generalized Integral Property (2015)
      provenance: recalled
      claim: >-
        RECALLED, NOT OPENED. The division property generalizes the integral
        property and propagates through COPY, XOR, AND, giving provable degree /
        integral bounds; the monomial-prediction refinement makes propagation
        exact. The propagation-rule basis for this object.
      verified_by: null
    - ref: KN-TECH-066
      provenance: internal
      claim: >-
        Frames the unkeyed setting and the freedom-degree accounting; here the
        input-freedom set is the cube over which the integral property is taken.
      verified_by: Read in full this session.
  novelty_screen:
    method: >-
      Filesystem and ledger screening only; crypto-kb index empty and not
      callable. Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full and the claim
      blocks of all 18 existing RQ-SHAONE proposals. Read the corpus SHA-1
      preimage entries KN-LIT-4213 and KN-LIT-5135 and the SHA-1 preimage frontier
      rows in knowledge/frontiers/symmetric-cryptanalysis.yaml (LEGACY-SHA1-57STEP-
      PREIMAGE, differential-MITM). Grepped ledger/proposals for division property,
      integral, monomial prediction, algebraic degree (matches were ECDLP/Semaev
      degree-of-regularity records under different senses, confirmed by inspection).
    results: >-
      No RQ-SHAONE proposal concerns preimages at all; the batch is cost-model and
      detector work. All corpus SHA-1 preimage results (KN-LIT-4213, KN-LIT-5135,
      and the admitted 57-step frontier row) are differential meet-in-the-middle,
      the family this object is explicitly distinct from. No corpus record tracks
      the division property or monomial-prediction support through SHA-1.
    verdict: >-
      UNVERIFIED. The division property and monomial prediction are standard
      symmetric-cryptanalysis tools (Todo and successors, recalled, not opened),
      and integral/division-property analysis of ARX and of SHA-family functions
      plausibly exists in the literature at large -- this session cannot check. What
      is not in any committed record here is a division-property survival-depth D
      for SHA-1 and its comparison to the MITM preimage depth. No external primary
      source was opened; unverified is the honest label.
  object_first_candidate:
    tracked_object: >-
      THE DIVISION-PROPERTY / MONOMIAL-PREDICTION SUPPORT: the set of input-bit
      monomials that can appear in the ANF of a chosen output bit after k SHA-1
      steps, followed step by step. Established family declared OFF-LIMITS as the
      primary lens: the differential meet-in-the-middle pair that every corpus
      SHA-1 preimage result tracks. This object tracks algebraic degree / integral
      structure, not a pair, and is chosen precisely to be outside the MITM family.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST GENUINELY. The support records only WHICH
      monomials MAY appear, discarding their GF(2) coefficients and the actual
      function values -- a monomial in the support may still have coefficient zero.
      This is strictly lossy (it cannot be inverted to the function) yet propagates
      DETERMINISTICALLY under the division-property rules for COPY, XOR, AND,
      rotation, and the modular-addition carry circuit, which is the defining
      compatibility property of the division property with those operations. It is
      not a change of coordinates because the support collapses the full ANF to its
      monomial skeleton, losing all cancellation information -- which is exactly
      what makes an early saturation (loss of the integral property) possible and
      measurable.
    propagation: >-
      One step of the target operation is one SHA-1 step; it acts on the support by
      the composed division-property rules of the step's gates (the carry chain of
      the modular addition is the dominant degree-growth contributor). Saturation
      -- the support becoming the full monomial set for the output bit, or the
      constant-sum property failing over the chosen cube -- is the well-defined
      event whose round index is D.
    survival_score: >-
      Survives until the round D at which the support saturates. D IS the survival
      depth and the deliverable. It dissolves fastest through the modular-addition
      carry chain (the object's predicted obstruction) and slowest through the
      linear message expansion (the object's predicted strength); the balance of
      the two sets D, and the null control establishes the trivial-saturation floor
      D must beat to mean anything.
  proof_search_map:
    bottleneck: >-
      The round depth D at which the division-property integral distinguisher for
      SHA-1 dissolves, compared to the deployed MITM preimage depth. Removing the
      uncertainty about D decides whether a non-MITM algebraic-degree lens reaches
      as far as the MITM family on reduced-step SHA-1.
    baseline_embedding:
      parameter_slice: >-
        The one- and two-step algebraic degree computed by brute-force ANF on a
        reduced-width toy must match the division-property bound at those steps,
        and any on-record low-round integral property must be reproduced.
      reproduction_check: >-
        A frozen fixture: brute-force ANF degree at steps 1-2 on a narrow-word toy
        equals the propagated bound; a divergence means the propagation rules
        (most likely the modular-addition carry circuit) are implemented wrong and
        the run halts.
    observation_collision:
      observable: >-
        The support saturation event and hence D.
      distinct_preimage_search: >-
        A random function of matched wiring shape must saturate at a much smaller
        D_null; SHA-1 and the null sharing a D would show the object sees nothing
        SHA-1-specific (an observation collision that falsifies the object's value).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move preimage structure into the ANF-support representation where "an
          integral distinguisher exists to depth D" is an exact support-saturation
          condition, with encoding (gate rules including the carry circuit),
          soundness (a certified constant sum, checked empirically at reachable cube
          sizes), and scope (reduced steps) as separate obligations.
        predicted_gain: >-
          A provable, compute-cheap distinguisher depth D that is a non-MITM
          structural fact about SHA-1, independent of any pair-based search.
      - transform: observable_fiber
        proposed_object: >-
          Hold the support (and hence the claimed distinguisher) fixed and vary the
          chosen output bit and input-freedom set to find the largest D and to
          check whether the surviving structure is intrinsic to SHA-1 or an artifact
          of a particular bit choice.
        predicted_gain: >-
          Either a robust maximal D across choices (a real object) or a fragile one
          confined to special bits (a weaker, honestly-scoped finding).
    quantifier_order: >-
      EXPLICIT. There EXISTS an output bit and an input cube for which the constant-
      sum (integral) property provably holds through D steps -- established by
      exhibiting one and verifying the sum. The comparison claim: D is at least the
      MITM depth, a statement about reduced-step SHA-1 under the division-property
      rules only, quantifying over neither full SHA-1 nor other attack families.
    method_ceiling:
      strongest_certifiable_claim: >-
        An integral/zero-sum distinguisher for reduced-step SHA-1 to depth D, and
        the comparison of D to the MITM depth. It CANNOT certify a full-SHA-1
        preimage, cannot move any full-SHA-1 exponent, and says nothing about the
        chosen-prefix cost model or the detector.
      nearby_object_control: >-
        The random-function null of matched shape, where no non-trivial integral
        property is expected: the method must report D_null small, and a SHA-1 D no
        larger than D_null means the method has not identified SHA-1-specific
        structure.
    proof_obligations:
      - claim: Brute-force ANF degree at low steps matches the propagated bound.
        responsibility: baseline
      - claim: The certified constant sum holds empirically over the declared cube.
        responsibility: correctness
      - claim: Propagation cost is bounded for the reached step counts.
        responsibility: runtime
      - claim: Scope is reduced-step SHA-1 and the division-property rule set.
        responsibility: scope
    not_applicable_reason: null
  assumptions:
    - >-
      The modular-addition carry chain can be expressed as a bit-sliced XOR/AND
      circuit whose division-property propagation is implementable exactly (three-
      subset / monomial prediction).
    - >-
      A reduced-width toy admits brute-force ANF degree computation at low steps to
      validate the propagation.
    - >-
      The certified integral property is checkable by exhaustive summation over the
      declared cube at cube sizes the harness can reach.
  predictions:
    - metric: >-
        survival_depth D: the round at which the division-property integral
        distinguisher dissolves for SHA-1
      direction: different
      minimum_effect: >-
        Reported as a number with the input cube and output bit declared. The
        decision is D versus the MITM depth (57-62 steps).
    - metric: >-
        null_gap: D for SHA-1 minus D_null for the matched random function
      direction: higher
      minimum_effect: >-
        Must be materially positive, or the object sees no SHA-1-specific structure
        and the finding is a controlled null, not a distinguisher.
    - metric: >-
        empirical_integral_check: measured sum of the output bit over the declared
        cube at reachable sizes
      direction: different
      minimum_effect: >-
        Constant (zero) through the certified depth; a non-constant sum falsifies
        the propagation implementation.
    - metric: >-
        baseline_degree_agreement: propagated degree bound versus brute-force ANF
        at steps 1-2
      direction: different
      minimum_effect: >-
        Exact agreement; a mismatch localizes a propagation-rule bug (most likely
        the carry circuit) and blocks the run.
  minimal_test:
    design: >-
      SIX STEPS, reduced-step and reduced-width, all cheap. STEP 1: implement the
      step-function division-property propagation including the modular-addition
      carry circuit. STEP 2: reproduce brute-force ANF degree at steps 1-2 on a
      narrow-word toy (baseline fixture, blocking). STEP 3: propagate the support
      for a declared output bit and input cube through increasing step counts and
      record the saturation depth D. STEP 4: run the random-function null of
      matched shape and record D_null. STEP 5: for reduced steps where D exceeds
      D_null, verify the certified integral property by exhaustive summation over
      the cube. STEP 6: vary the output bit and cube (observable-fiber) to report
      the maximal robust D, and compare it to the MITM preimage depth.
    controls:
      - >-
        BRUTE-FORCE ANF BASELINE (blocking): propagated degree must match exact ANF
        at low steps or the implementation is wrong.
      - >-
        RANDOM-FUNCTION NULL: matched wiring, random Boolean gates; D_null is the
        trivial-saturation floor D must beat.
      - >-
        EMPIRICAL INTEGRAL CHECK: exhaustive cube summation confirms the certified
        constant sum for reached depths.
      - >-
        OBSERVABLE-FIBER SWEEP: output-bit and cube variation to distinguish a
        robust D from a fragile bit-specific artifact.
    required_metrics:
      - survival depth D for SHA-1, per output bit and cube
      - D_null for the matched random function and the null gap
      - empirical cube-sum results at reached depths
      - propagated-versus-brute-force degree at steps 1-2
      - the maximal robust D and its comparison to the MITM preimage depth
      - artifact manifest with seeds, circuit definitions, and rebuild receipt
  falsification_conditions:
    - >-
      Propagated degree disagrees with brute-force ANF at low steps. The
      implementation is wrong; no D is admissible until fixed. Blocking gate.
    - >-
      The certified integral property fails an exhaustive cube-sum check at a depth
      the propagation claimed. The propagation is unsound and D is void.
    - >-
      D is no larger than D_null. The division-property lens sees nothing SHA-1-
      specific beyond generic wiring; this is a controlled null and, argued with the
      modular-addition-carry obstruction, a closure of the division-property lens
      for SHA-1 at the section-4 standard, with forward guidance to correlation- or
      cube-attack lenses that couple bits differently.
    - >-
      D is at least the MITM preimage depth. SHA-1 admits a non-MITM integral route
      to reduced-round structure competitive with the corpus family -- a positive
      object, reported with its reduced-step scope and with no full-SHA-1 claim.
  confounders:
    - >-
      CARRY-CIRCUIT REPRESENTATION. Different bit-sliced encodings of modular
      addition can give different (still sound) division-property bounds; a loose
      encoding overestimates degree growth and underestimates D. MITIGATION: use
      the tightest exact monomial-prediction encoding and report the encoding.
    - >-
      OUTPUT-BIT AND CUBE CHOICE. D depends on both; cherry-picking inflates D.
      MITIGATION: the observable-fiber sweep reports the distribution of D over
      choices and the robust maximum, not a single lucky bit.
    - >-
      REDUCED WIDTH VERSUS REDUCED STEPS. A narrow-word toy for the baseline is not
      full-width SHA-1; the baseline validates the RULES, not D. MITIGATION: D is
      measured on full 32-bit-word reduced-STEP SHA-1, and the narrow-word toy is
      used only for the ANF baseline.
  interpretation_limits:
    - >-
      Scoped to reduced-step SHA-1 and the division-property rule set. No full-SHA-1
      preimage, no exponent moved, no numeric transfer to full SHA-1.
    - >-
      This is peripheral to the RQ's primary cost-model and detector deliverables
      and is offered as the axis-(c) non-MITM object the brief invites; it is a
      building block / structural measurement, explicitly LOW priority, not a
      substitute for the cost or detector work.
    - >-
      No statement about any deployed system, per RQ claim_tier_ceiling.
  heuristic_assumptions:
    - id: H1
      statement: >-
        DIVISION-PROPERTY TIGHTNESS. The propagated support saturation depth D is a
        faithful indicator of the true integral-distinguisher depth for the chosen
        output bit and cube, i.e. the monomial-prediction propagation is tight
        enough that a monomial predicted absent through D steps is genuinely absent
        (the constant sum genuinely holds).
      rigorous_support: >-
        RIGOROUS INGREDIENT: the division-property propagation rules for COPY, XOR,
        AND are sound (a predicted-absent monomial is provably absent), so any D it
        certifies is a valid lower bound on the true distinguisher depth (Todo,
        recalled). CLASSICAL STATEMENT IMITATED: monomial prediction makes the
        propagation EXACT for the modeled circuit, so predicted support equals true
        support. THE GAP: exactness depends on the carry-circuit encoding; a loose
        encoding gives a sound but not tight D, which the empirical cube-sum check
        detects.
      validation_plan: >-
        SAMPLE: multiple output bits and input cubes at several reduced step counts,
        with the matched random-function null. SHORTCUT: exhaustive cube summation
        at reachable cube sizes directly verifies the certified constant sum,
        needing no full inversion. COMPARISON: propagated D against empirically
        observed integral-loss depth (the deepest cube whose sum is still constant);
        SHA-1 D against D_null. TAIL CHECK: the deepest certified cube, where
        tightness is most stressed and a loose encoding would show first. TRANSFER:
        all sampled parameters (step count, word width, cube, bit) recorded; no
        extrapolation of D to full SHA-1.
  target_complexity:
    time_exponent: >-
      NO FULL-SHA-1 EXPONENT IS CLAIMED OR MOVED. This is a reduced-step structural
      measurement and an explicitly LOW-priority building block. If D reaches the
      MITM depth it offers a non-MITM route to reduced-round distinguishers whose
      exploitation cost is a separate, later question; if not, it is a closure. The
      propagation cost is polynomial per step in the circuit size for the reached
      step counts.
    memory_exponent: >-
      The support/monomial-prediction set can grow large near saturation; memory is
      the practical limit on the reachable D and is reported. No cryptographic-scale
      table; the object is evaluated symbolically at reduced steps.
    best_known: >-
      Reduced-step SHA-1 preimages are held by the differential meet-in-the-middle
      family to 57-62 steps (KN-LIT-4213, KN-LIT-5135); no division-property depth
      is on record in this corpus.
    hidden_overhead: >-
      The carry-circuit encoding tightness is the disclosed source of looseness in
      D; the reduced-step-to-full-SHA-1 gap is disclosed and not extrapolated.
    tradeoff_note: >-
      The relevant tradeoff is propagation memory versus reachable D; parallelization
      is across output bits and cubes.
  dominated_by: >-
    CHECKED ACROSS THE FRONTIER. As a SHA-1 preimage attack: DOMINATED on round
    depth by the differential-MITM family (57-62 steps, KN-LIT-4213/5135) UNLESS
    the measured D meets or exceeds that depth, which is exactly the open question;
    stated honestly, at proposal time it is dominated and the record's value is in
    deciding whether it remains so. As a non-MITM structural object: NOT dominated
    -- no corpus record holds a division-property depth for SHA-1, so on the "which
    lens reaches how far" axis there is no incumbent. As an algebraic-degree method:
    division property / monomial prediction is standard (Todo and successors,
    recalled), so the METHOD is dominated by that published machinery and the record
    claims only its application to SHA-1's survival depth.
  sota_delta: >-
    +0 on full SHA-1 (no preimage, no exponent). On reduced-step preimage round
    depth: delta is D minus the MITM depth, the sign of which is the record's whole
    question -- positive would be a new non-MITM reach, negative a measured
    obstruction. The corpus gains its first division-property survival depth for
    SHA-1 either way.
  discriminated_from:
    - >-
      KN-LIT-4213 and KN-LIT-5135 (and the 57-step frontier row) track a meet-in-
      the-middle pair; this record tracks the division-property monomial support, a
      different object chosen to be outside that family per the RQ's axis-(c)
      condition.
    - >-
      IDEA-20260901-7d0bfd and IDEA-20260901-8e3a59 (this wave) concern the
      collision/near-collision cost via the disturbance-vector code and the neutral-
      bit graph; entirely different objects and a different security property
      (collision, not preimage).
    - >-
      The ECDLP degree-of-regularity and Semaev-polynomial records that match the
      words "degree" and "integral" in the ledger concern polynomial-system solving
      over large fields, a different object and setting; this is a GF(2) algebraic-
      degree object for a hash step function.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low
  honest_prior_of_survival: >-
    0.9 that the propagation reproduces brute-force ANF at low steps. 0.85 that the
    certified integral property passes empirical cube-sum checks. 0.65 that D
    materially exceeds D_null (SHA-1-specific structure is visible at all). 0.2 that
    D reaches the MITM depth (the exciting outcome) versus 0.8 that modular-addition
    degree growth caps D well below it (the closure outcome with the carry-chain
    obstruction) -- both are reportable, and the closure is the more likely and
    still-useful result.
