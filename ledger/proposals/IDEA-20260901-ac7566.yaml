idea:
  id: IDEA-20260901-ac7566
  question_id: RQ-SHAONE-081e3a
  research_question: RQ-SHAONE-081e3a
  goal_id: GOAL-SHA1-001
  added: '2026-09-01'
  title: >-
    A NON-MEET-IN-THE-MIDDLE PREIMAGE OBJECT FOR REDUCED-STEP SHA-1: track the
    division-property / monomial-prediction support (the reachable-monomial set of
    the ANF) through the SHA-1 step function, and DECIDE whether the integral
    distinguisher it certifies survives to at least the round depth the deployed
    differential-meet-in-the-middle preimage results reach -- a non-MITM object
    competitive with the MITM family, or an object that dissolves earlier under
    modular-addition degree growth, which is a closure with a named obstruction.
  class: representation
  claim: >-
    FIVE SEPARABLE CLAIMS. (A) A DISTINCT OBJECT. Every SHA-1 preimage result in
    this corpus (KN-LIT-4213 higher-order-differential MITM to 62 steps,
    KN-LIT-5135 differential-MITM to 57 steps) tracks the SAME object: a matched
    pair across a meet-in-the-middle split. The division property / monomial-
    prediction support -- the set of input-bit monomials that can appear in the
    algebraic normal form of an output bit -- is a genuinely DIFFERENT tracked
    object (it tracks algebraic degree and integral structure, not a pair), and
    it is exactly the family the RQ invites for axis (c) as not a repackaging of
    MITM. (B) THE DECISION. Propagating the division property through SHA-1's COPY,
    XOR, AND (in Ch/Maj), rotation, and modular-addition operations certifies an
    integral/zero-sum distinguisher up to a round depth D where the support
    saturates (all monomials reachable, full degree). D is computable at zero
    cryptographic compute for reduced step counts. The claim is that D is a
    well-defined number and that comparing D to the deployed MITM preimage depth
    (57-62 steps) decides whether the division-property object reaches AT LEAST as
    far. (C) TWO-SIDED. If D is at least the MITM depth, SHA-1 admits a non-MITM
    integral route to reduced-round preimage/distinguishing structure -- a new
    lens competitive with the family the corpus records. If D is materially below
    it, modular-addition degree growth caps the object early, and that cap is a
    named obstruction (SHA-1's nonlinearity concentrated in modular addition
    defeats a purely algebraic-degree lens) with forward guidance. (D) WHAT IS NOT
    CLAIMED: NO full-SHA-1 preimage, no exponent moved on full SHA-1, no new
    collision, no cost figure, and no security consequence for any deployed system.
    This is a reduced-step structural measurement of where an object survives, not
    an attack. (E) Either outcome is reportable: a competitive D is a new object
    for the program's toolbox, and an early-dissolving D is a closure at the
    inventor-protocol section-4 standard for the division-property lens on SHA-1.
  mechanism: >-
    STAGE 1: implement bit-level division-property propagation (three-subset /
    monomial-prediction rules) for the SHA-1 step function: COPY and XOR
    (linear, exact rules), AND inside Ch and Maj (the AND rule), fixed rotations
    (index permutation), and modular addition expressed as a bit-sliced circuit of
    XOR and AND with carry chain (the carry is where degree grows fastest). The
    message expansion is linear and contributes no degree growth, which is the
    structural weakness this object probes. STAGE 2: for a chosen output bit and an
    input-freedom set (message words, or IV bits for a compression-function
    inversion), propagate the support forward step by step and record the round D
    at which the support saturates to full degree / loses the integral (constant-
    sum) property. STAGE 3: report D as a function of the input-freedom set size
    and the chosen output bit, and compare D to the deployed MITM preimage depth.
    STAGE 4, baseline reproduction: reproduce a KNOWN small property -- e.g. the
    algebraic degree after one and two steps computed by brute-force ANF on a
    reduced-width toy, and a known low-round integral property if one is on record
    -- to validate the propagation implementation. STAGE 5, null control: run the
    identical propagation on a RANDOM function of the same wiring shape but with
    the Boolean functions replaced by random S-boxes of matched size; a random
    function should saturate almost immediately, so a materially larger D for real
    SHA-1 is the structural signal, and a D no larger than the null means the
    object sees nothing SHA-1-specific. STAGE 6: for reduced step counts where D
    exceeds the null, verify the certified integral property empirically by summing
    the output bit over the declared input cube and checking it is constant, an
    exhaustive check at cube sizes the harness can reach.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-4213
      provenance: kb
