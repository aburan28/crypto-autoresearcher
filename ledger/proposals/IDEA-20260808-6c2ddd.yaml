      - ledger/proposals/IDEA-20260808-c4b462.yaml
      - ledger/evidence/EV-ECDLP-d5e2e9.yaml
      - ledger/decisions/DEC-20260808-2312c8.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-3033bc/reviews/TASK-20260808-85809d/review-report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-f8c134/dispatch_queue.json

  mechanism: >
    Use a fixed public signed-y antisymmetric partition to select two rooted
    pair-sum lists of size N^(1/3+o(1)), retain the actual group points and
    scalar witnesses, and accept only exact full-point collisions whose
    recovered scalar independently verifies [k]P=Q. Measure tuple multiplicity,
    distinct matching sums, and Boolean root success separately; any exponent
    gain must survive global-label, histogram-preserving, quotient, planted,
    multiplicity-trap, and isomorphic-model controls.

  claim:
    summary: >
      Test whether target-independent self-randomized roots enrich the probability
      of at least one distinct, exactly verified meet-in-the-middle point by
      N^gamma while preserving N^(1/3+o(1)) storage. Any complexity consequence
      is conditional on the numbered heuristics and must be derived from Boolean
      distinct-root success, never raw tuple-match multiplicity.
    conditional_complexity:
      per_root_cost: "C(N)=N^(1/3+o(1))"
      per_root_boolean_success: "p(N)=N^(-1/3+gamma+o(1))"
      roots_to_constant_success: "R(N)=N^(1/3-gamma+o(1))"
      raw_time: "T(N)=R(N)C(N)=N^(2/3-gamma+o(1))"
      storage: "S(N)=N^(1/3+o(1))"
      full_cost_metric: "FC(N)=T(N)S(N)^(1/3)=N^(7/9-gamma+o(1))"
      raw_rho_crossover: "gamma>1/6"
      advancement_full_cost_crossover: "gamma>5/18"
      endpoint: "gamma=1/3 gives constant-root N^(1/3+o(1)) time only if bounded-second-moment and constant-success obligations hold"
    non_claims:
      - No unconditional ECDLP improvement is claimed.
      - Match-count enrichment alone is not success-probability enrichment.
      - Toy-size regression is not crypto-scale validation.
      - Raw-time improvement for "1/6<gamma<=5/18" is not an advancement under the full-cost gate.
  
  root_observables:
    construction: >
      For each independently seeded, target-independent root r, build frozen
      left and right selected sets A_r and B_r of size N^(1/3+o(1)), enumerate
      their exact selected cross-product, and apply the full group verification
      predicate to every reported candidate.
    variables:
      D_r: exact number of enumerated selected cross-pairs; no binomial independence assumption
      Y_r: multiplicity-weighted number of verifying tuples
      X_r: number of distinct verifying point sums represented by at least one tuple
      I_r: "1[X_r>=1]"
      mmax_r: maximum tuple multiplicity of one distinct verifying point
      factorial2_r: "X_r(X_r-1)"
    primary_outcome: I_r
    secondary_outcomes: [X_r, Y_r, mmax_r, factorial2_r]
    forbidden_substitution: "Neither Y_r nor cross-pair match frequency may substitute for I_r or X_r."
  
  numbered_heuristics:
    H1_regular_work:
      statement: >
        Target-independent rerandomization yields D_r=N^(2/3+o(1)) selected
        cross-pairs at C(N)=N^(1/3+o(1)) group-equivalent work and
        S(N)=N^(1/3+o(1)) peak storage.
      falsifier: Superpolynomially uneven fibers, root cost above the stated envelope, or target-dependent/advice-based selection.
    H2_distinct_enrichment:
      statement: >
        With mu_N=E[X_r], E[X_r]/E[D_r]=N^(-1+gamma_X+o(1)), hence
        mu_N=N^(-1/3+gamma_X+o(1)).
      falsifier: Enrichment occurs only in Y_r, disappears after distinct-point deduplication, or does not survive exact verification.
    H3_second_moment:
      statement: >
        There is kappa_N=N^o(1) such that
        E[X_r(X_r-1)]<=kappa_N E[X_r]^2 over the declared curve/root
        distribution.
      consequence: >
        E[X_r^2]<=mu_N+kappa_N mu_N^2 and Paley-Zygmund gives
        P(X_r>=1)>=mu_N/(1+kappa_N mu_N); Markov gives
        P(X_r>=1)<=mu_N. For gamma_X<1/3 this transfers the exponent from
        distinct counts to Boolean success. At gamma_X=1/3, bounded kappa_N is
        additionally required for constant success.
      heuristic_obligation: >
        Estimate the factorial second moment and upper tail at curve/root units;
        failure is a failure of runtime propagation even if E[Y_r] grows.
    H4_subpolynomial_multiplicity:
      statement: "On successful roots, Y_r/max(X_r,1)=N^o(1) and mmax_r=N^o(1)."
      falsifier: A small number of repeated tuples explains the fitted enrichment.
    H5_root_and_model_distribution:
      statement: >
        Independent root seeds sample the declared root distribution, and public
        isomorphic models are drawn independently of target success. Models are
        nested within curves and are not independent curves.
      falsifier: Seed reuse, success-conditioned model choice, or between-model dependence omitted from inference.
  
  rigorous_ceiling:
    statement: >
      Let the fixed, target-independent selection map have M=N^(1/3+o(1))
      labels and every relevant fiber have size at least
      (N/M)N^(-o(1)). Under a uniform self-randomized target/root, conditional
      exact-hit probability within a selected fiber is at most
      1/min_fiber<=M/N*N^o(1). Thus expected pooled multiplicity enrichment is at
      most M*N^o(1), so gamma<=1/3+o(1); distinct enrichment cannot exceed
      multiplicity enrichment.
    rigor_scope:
      - expected value pooled over the declared uniform target/root distribution
      - fixed target-independent maps
      - regular minimum-fiber condition
      - no nonuniform advice or success-conditioned model selection
    exclusions:
      - no pointwise or every-root ceiling
      - no claim for irregular fibers
      - no claim for target-dependent maps, preprocessing advice, or adaptive model search
    implication: A measured gamma above 1/3 diagnoses a violated assumption, accounting error, or finite-size artifact; it is not evidence of a stronger algorithm.
  
  controls:
    N0_balanced_antisymmetric_random_labels:
      object: same enumerated group points and frozen root tuples
      definition: >
        Canonicalize nonzero negation orbits {Q,-Q}. From
        SHA256("TASK-20260808-8944e6|N0|curve_id"), generate one exact uniform
        Fisher-Yates permutation using SHAKE256 words with rejection sampling.
        Assign a balanced multiset of labels in Z/MZ to canonical representatives
        so counts differ by at most one; set h(-Q)=-h(Q) mod M and h(O)=0.
        Freeze this one global map for all occurrences and roots.
      purpose: exact globally consistent random-label null; independent labels per pair are forbidden
    N1_histogram_preserving_curve_permutation:
      definition: >
        Draw one seeded bijection pi of scalar negation orbits with
        pi(-r)=-pi(r), then set h_perm([r]P)=h_y([pi(r)]P). Use the same pi
        globally for the curve. This preserves the complete empirical h_y
        histogram exactly while destroying geometric alignment.
      purpose: same-shape curve null paired by curve, model, and root seed
    Q_exact_synthetic_quotient:
      definition: >
        Use G=Z/nZ with n=F*K, subgroup H={0,K,...,(F-1)K}, and quotient
        q(x)=x mod K. Every fiber has exactly F elements and the exact
        target-fiber probability is F/n=1/K. Record gamma_exact=log_n(F);
        when a nominal finite-size gamma is not a divisor-compatible exponent,
        fit gamma_exact rather than relabeling it as nominal.
      purpose: exact positive control for quotient enrichment and ceiling bookkeeping
    PG_planted_distinct_success:
      definition: >
        For gamma in {0,1/6,5/18,11/36,1/3}, generate seeded regular distinct
        identities with X_r distributed as Poisson(D_r*N^(-1+gamma)), set
        I_r=1[X_r>=1], and set Y_r=X_r.
      purpose: recover known distinct and Boolean exponents through the full analysis
    MT_multiplicity_trap:
      definition: >
        Starting from the gamma=11/36 planted arm, replicate each verifying tuple
        ceil(N^(1/12)) times in Y_r while leaving X_r and I_r unchanged.
      purpose: require the analysis to reject multiplicity-only apparent enrichment
    isomorphic_models:
      distribution: >
        For E:y^2=x^3+A*x+B, sample four public nonzero u values per curve
        without replacement from a domain-separated seed and use
        E_u:y^2=x^3+u^4*A*x+u^6*B with map
        (x,y)->(u^2*x,u^3*y). All four models are nested observations of one
        curve.
      primary_rule: no model selection; pool with curve as outer cluster
      optional_selector: >
        A separately labeled K=16 success-blind selector may use only a frozen
        label-dispersion statistic. Charge model construction plus
        K*4096*ceil(b/6) group additions before the main roots. Any asymptotic
        K=N^tau adds tau to the time exponent and may not be hidden in o(1).
  
  inference:
    units:
      outer_independent_unit: curve
      minimum_repeated_unit: root
      nested_unit: isomorphic_model
      prohibited_unit: cross-pair
    distinct_count_model: >
      log E[X_crm]=log D_crm+alpha+(gamma_X-1)log N+
      beta*N^(-1/3)+u_curve, with free alpha and finite-size coefficient beta.
    boolean_model: >
      cloglog P(I_crm=1)=offset(log D_crm-log N)+alpha+
      gamma_B*log N+beta*N^(-1/3)+u_curve, with free alpha.
    primary_runtime_exponent: gamma_B
    multiplicity_diagnostic: >
      Fit Y only as a diagnostic and compare gamma_Y, gamma_X, Y/max(X,1),
      mmax, and the factorial second moment.
    clustered_inference:
      - 9999 deterministic Rademacher wild-cluster bootstrap draws at the curve level
      - paired treatment-null contrasts retain every model/root observation inside its curve
      - under the predeclared sharp exchangeability null, enumerate all 2^6 curve-level sign assignments
    zero_policy:
      - retain exact zero X and I observations
      - use likelihood/profile or exact bounds under separation
      - never add pseudocounts
      - an all-zero arm or unidentified interval is reported as inconclusive
    decision_gates:
      artifact_gate: planted gamma arms recover their exact inputs and MT changes Y but not X or I
      raw_interest_gate: one-sided 95-percent lower bound for gamma_B exceeds "1/6"
      advancement_gate: >
        One-sided 95-percent curve-clustered lower bound for gamma_B exceeds
        5/18, H3 and H4 survive, treatment separates from both global nulls,
        quotient control calibrates, and costs remain within the preregistered
        envelope.
      null_gate: Failure to separate from either same-shape global null classifies the signal as artifact.
      interpretation_gate: Passing these proposed tests would justify further proof work, not support or a crypto-scale claim.
  
  power_derived_schedule:
    sizes_bits: [9, 12, 15, 18, 21, 24, 27]
    definitions:
      L_b: "2^(b/3)"
      curves_per_size: 6
      models_per_curve: 4
      roots_per_curve_model: "32*L_b"
      roots_per_arm_size: "6*4*32*L_b=768*L_b"
    rows:
      - {b: 9, L: 8, roots_per_curve_model: 256, roots_per_arm_size: 6144}
      - {b: 12, L: 16, roots_per_curve_model: 512, roots_per_arm_size: 12288}
      - {b: 15, L: 32, roots_per_curve_model: 1024, roots_per_arm_size: 24576}
      - {b: 18, L: 64, roots_per_curve_model: 2048, roots_per_arm_size: 49152}
      - {b: 21, L: 128, roots_per_curve_model: 4096, roots_per_arm_size: 98304}
      - {b: 24, L: 256, roots_per_curve_model: 8192, roots_per_arm_size: 196608}
      - {b: 27, L: 512, roots_per_curve_model: 16384, roots_per_arm_size: 393216}
    roots_per_complete_arm: 780288
    derivation: >
      At gamma=0, each block has 32*L roots and root success approximately 1/L,
      giving 32 expected events per curve/model and 768 per size. After projecting
      log N against a free intercept and N^(-1/3), residual design information is
      27.7660228004. With design effect 2, one-sided alpha=0.05, and alternative
      gamma=11/36 versus gate 5/18, delta=1/36 and
      lambda=(1/36)*sqrt(768*27.7660228004/2)=2.868, giving approximate power
      Phi(2.868-1.644854)=0.89.
    limitations:
      - This calculation has no power exactly at the boundary.
      - Calibration must confirm the event rate and effective information.
      - Calibration failure stops the proposal; extra roots require a new Coordinator-approved amendment.
  
  prospective_resource_budget:
