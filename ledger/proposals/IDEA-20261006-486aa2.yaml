      verified_by: idea-generator (pasted-context only; no independent retrieval in this session)
    - ref: IDEA-20260922-1a081a
      provenance: internal
      claim: curve-blindness context (cost laws never read coefficients); B/A4/A6 recorded as confounder here
      verified_by: idea-generator (pasted-context only; no independent retrieval in this session)
  assumptions:
    - Nearby-object family fixed: E/F_{p^n}, y^2=x^3+A4x+A6, p in {3,5}, descended to F_p; binary family fixed as in the companion measurement IDEA-20261006-8f4f02.
    - Matched-pair unit in each characteristic: same (n,m,k), same seeds/order/routine within characteristic; cross-characteristic matching is by equal design parameters, not identical field arithmetic.
    - Degree caps labelled: binary 4, p=3 cap 10, p=5 cap 16; every value reported as (label, value, gap value-B_p).
    - Refs 2013/548 and 2013/549 recalled only, no support.
    - No claim about any deployed curve's security; scope is tested n,m,k, characteristics, labelled bounds, with transfer assumptions stated.
  proof_search_map:
    bottleneck: whether coset-shift fragility (if any) is generic to affine shifts or specific to char-2 trace structure.
    baseline_embedding:
      parameter_slice: exactly-computable (n,m,k) admitting both binary degree-4 rank and odd-p capped rank in pure Python; v=0 baselines in each characteristic.
      reproduction_check: unshifted odd-p triple must reproduce Prop.2 neighbourhood (values <=3p+1) and unshifted binary triple must reproduce the companion baseline before shifted comparison counts.
    observation_collision:
      observable: per-characteristic gap vector g=(Def5-true-B_p, Def6-fake-B_p, rank-fall-degree-B_p) for v=0 vs v!=0.
      distinct_preimage_search: same split pattern from field-representation/basis artifact vs true characteristic effect; searched via basis swap, seed/order swap, A4/A6/B variation, generic-system controls.
    constructive_transforms: []
    quantifier_order: FORALL tested designs compute binary and odd-p gap vectors; EXISTS >=1 design with binary-break/odd-p-preserve (or converse) labelled split suffices to isolate a characteristic-specific mechanism at tested scope; no beyond-scope quantifier.
    method_ceiling:
      strongest_certifiable_claim: scoped covariation/split statement at tested (n,m,k,p) with labelled gaps; no transfer beyond stated assumption.
      nearby_object_control: this idea IS the nearby-object control for the companion measurement; its own nearby control is the random-shift null (IDEA-20261006-839ced).
    proof_obligations:
      - claim: odd-p capped Macaulay dims use exact C(N+d,d) with d=3p+1, not N^d
        responsibility: future executor under frozen contract
      - claim: cross-characteristic comparison uses normalised gaps, never raw degrees
        responsibility: future validator
    not_applicable_reason: "Constructive transforms N/A: control proposal claiming no theorem; bottleneck/collision/quantifier/ceiling audits retained."
  predictions:
    - metric: per-design split indicator S=1 iff binary preservation status (all labelled gaps <=0 preserved) differs from odd-p preservation status at same design
      direction: different
      minimum_effect: S=1 on >=1 matched design with >=1 labelled degree-step gap across the B_p threshold
    - metric: covariation rate C=fraction of designs where binary and odd-p agree (both preserve or both break)
      direction: different
      minimum_effect: C<=0.5 (majority split) or C>=0.8 (strong covariation) decides generic vs specific reading; either extreme with N>=10 designs is informative
  minimal_test:
    design: |
      N>=10 matched designs at exactly-computable (n,m,k): per design compute binary labelled triple (cap 4) and odd-p labelled triple (cap 3p+1, p=3 and where feasible p=5) for v=0 vs v!=0 with characteristic-internal matched routines; record gap vectors and S/C. NEGATIVE outcome for the split reading (C high, no S=1) supports genericity; NEGATIVE for genericity (S=1 with char-isolated pattern) supports specificity; either is informative and neither corroborates Theorem 1.
    controls:
      - v=0 baselines in each characteristic at same (n,m,k,seeds/order/routine)
      - seed/order/basis swaps within each characteristic
      - A4/A6 (odd-p) and A/B (binary) coefficient-variation records
      - random-label shuffle and generic-system controls per characteristic
    required_metrics:
      - per-side labelled values plus normalised gaps value-B_p (B_p in {4,10,16})
      - exact matrix dims C(N+d,d) per system
      - per-design S indicator and batch covariation rate C
  falsification_conditions:
    - If every tested design shows binary-break with odd-p-preserve (or the converse) the covariation claim is false and the split reading wins at tested scope (still scoped science).
    - If no design yields a valid odd-p baseline (caps infeasible in pure Python), the control is infeasible at that (n,m,k), not evidence on the proposition; scope must shrink, not conclude.
  confounders:
    - infeasible odd-p matrix sizes at cap 10/16 (record dims; shrink (n,m,k) rather than approximate)
    - basis/curve-coefficient effects (A4/A6 vs A/B)
    - descent implementation differences between F2 and Fp code paths (keep routines characteristic-matched, record versions)
    - monomial order and rank tolerance per characteristic
  interpretation_limits:
    - Scope is tested (n,m,k,p) and labelled caps only; cross-characteristic transfer assumes design-parameter matching captures the relevant structure, which is NOT established.
    - Any split or covariation outcome FAILS to corroborate Nagao Theorem 1 (it characterises the failure mode or its genericity): ordinary scoped science.
    - Joint preservation in both characteristics (no break anywhere) WOULD corroborate the proposition family and is breakthrough-adjacent: flag explicitly, needs breakthrough-tier review, still NO claim about any deployed curve's security.
    - Infrastructure infeasibility (odd-p caps too large) is never evidence on the proposition.
  heuristic_assumptions:
    - id: H1
      statement: |
        FORMAL (control bridge, conditional): IF affine coset-shift fragility is generic to Weil-descended summation systems (independent of characteristic-specific morphisms), THEN preservation status at bound 4 (binary) and at bound 3p+1 (odd-p) agrees on matched designs up to the normalised gap (value-B_p).
      rigorous_support: |
        No rigorous support for the bridge; it is a control hypothesis. Partial analogues: HKY last-fall boundedness under stated conditions (KR-IC-fbdb61) and HPS FFD-boundedness conditions (KR-IC-f5c584) each give characteristic-aware boundedness for UNSHIFTED systems only.
      validation_plan: |
        Sampling: N>=10 matched designs across small n and coset dims. Comparison distribution: covariation rate C vs 0.5 null (exact binomial test). Tail checks: C vs n, vs coset dimension, vs p in {3,5}; report parameters and transfer assumption explicitly.
  target_complexity:
    time_exponent: no exponent change claimed; per-system rank cost poly in N at fixed toy sizes (binary C(N+4,4); odd-p C(N+3p+1,3p+1))
    memory_exponent: no exponent change claimed; odd-p caps may dominate memory at tested sizes (record dims)
    best_known: vOW parallel rho generic; KR-IC-1fcdbc measured negative for binary summation at tested sizes
    hidden_overhead: odd-p cap constants (10/16) made explicit; no o(1) hidden
    tradeoff_note: odd-p control trades larger matrices for characteristic isolation; binary lane remains the primary decision target
  estimated_cost:
