idea:
  id: IDEA-20261006-486aa2
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-06'
  approved_by: null
  title: "Odd-characteristic nearby-object control: coset-shift (non-)invariance at Nagao Prop.2 bound 3p+1 for p=3,5"
  class: control
  claim: |
    Coset-shift (non-)invariance covaries across characteristics on matched (n,m,k) designs: E/F_{p^n}: y^2=x^3+A4x+A6 with p in {3,5} descended to F_p shows the same preservation/break pattern at its Nagao Prop.2 bound (3p+1 = 10, 16) as E/F_{2^n} shows at bound 4. Falsified if binary pairs diverge while matched odd-p pairs preserve (or vice versa) by >=1 labelled degree-step on >=1 matched design, which instead isolates a characteristic-specific mechanism.
  mechanism: |
    OBJECT FRAME: point representation R_p = x-coordinate of E/F_{p^n} (y^2=x^3+A4x+A6, small odd p in {3,5}) restricted to affine coset V+v over F_p, encoded in a fixed F_p-basis, descended to F_p equations; paired with R_bin from IDEA-20261006-8f4f02 at equal (n,m,k) design. Operation set Sigma_Fb (both characteristics) = translation by factor-base elements only, partial as in the companion measurement.
    TRICHOTOMY: Class I partial-action in both characteristics, because the tracked labelled-degree descriptor propagates only under Sigma_Fb translations; not branching nor coordinate-dependent (y-recovery ambiguity priced as confounder, not tracked state).
    LOSSY-PROJECTION TEST vs Sigma_Fb: tracked object D_p=(degree-label in {Def5-true, Def6-fake, Macaulay-rank-fall}, value, prime p, bound B_p in {4,10,16}). Discard: full Macaulay entries, coefficient values, monomial-order details, relation order. Sigma-compatibility: translation by factor-base elements permutes coset labels/relation indices deterministically so D_p recomputed on the translated system equals D_p translated, without discarded entries. Lossiness: many distinct full systems map to one D_p; many-to-one, not a coordinate change.
    PRICE THE OPEN NUMBER: open number = cross-characteristic covariation (both preserve / both break / split). Plan: at exactly-computable (n,m,k) build degree-capped Macaulay matrices (degree 4 binary; degree 3p+1 cap odd-p, exact binomial C(N+d,d)) in pure Python, record labelled gap g=value-B_p per side (v=0 vs v!=0) in each characteristic; controls: v=0 baselines, random-label shuffle, generic-system control per characteristic.
    F2 DELTA: adds the Prop.2 cross-characteristic control beyond Semaev descent + Nagao cosets; proposes no new factor base. Complements IDEA-20260913-352163 (binary-only), IDEA-20260922-8ac1ea (single-B control), and IDEA-20260922-1a081a (curve-blindness: costing never reads coefficients, here B/A4/A6 variation recorded as confounder).
    FACTOR-BASE ESCAPE: inside KN-OPEN-020 scoped-out class in both characteristics (explicit affine-coset membership); no escape claimed; stops per constraint (f).
  novelty_status: unverified
  citations:
    - ref: Nagao 2015/984 Prop.2 (d_F<=3p+1, small odd p)
      provenance: recalled
      claim: nearby-object bound under test as control (10 for p=3, 16 for p=5)
    - ref: KR-IC-f5c584
      provenance: kb
      claim: char-2 trace-morphism structure that a char split would isolate
      verified_by: idea-generator (pasted-context only; no independent retrieval in this session)
    - ref: KR-IC-fbdb61
