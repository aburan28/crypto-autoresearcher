idea:
  id: IDEA-20261006-14ca06
  question_id: RQ-SSIQ-9702af
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Ascending and descending smooth factor prefixes disagree about
    which cofactor exceeds X
  class: measurement
  claim: >-
    Let B = 7 and X = 30. Let D run through the 7-smooth integers
    with 30 < D ≤ 180. For each D, write the prime factorization with
    multiplicity in nondecreasing order and in nonincreasing order.
    The prefix of an order is the longest prefix whose product is at
    most X. The claim is that at least one D has the larger prefix
    product at least twice the smaller one, and exactly one of the
    two cofactors D/prefix strictly greater than X. A finished scan
    with no such D is the concrete negative. The proof of the
    archived Lemma 3.4 chooses an order of prime factors and then
    takes a longest prefix at most X. This idea asks whether that
    order changes which side exceeds X, on a finite set of smooth
    integers, with no curve and no minimal degree. The exponent stays
    p^{1/3+o(1)}. This record does not say that a p^{1/4} algorithm
    exists.
  mechanism: >-
    The tracked object is a pair of prefix products for one smooth
    integer. The representation is the ordered prime factorization.
    The operation set is {reverse the order of the prime factors}.
    Reversing can change the longest prefix whose product is at most
    X, so the split is order-dependent even though the integer is
    not. The projection from an ordered factorization to the prefix
    product discards the remaining factors. The priced number is a
    count of integers D in a fixed range. No elliptic curve is
    constructed and no isogeny is evaluated.
  novelty_status: unverified
  citations:
    - ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: retrieved
      claim: >-
        The proof of Lemma 3.4 writes the degree as a product of
        primes not necessarily distinct, then takes the largest index
        whose prefix product is at most X. This idea varies only the
        order of that product, on smooth integers that are not
        claimed to be degrees.
      verified_by: >-
        design session opened
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, including lines
        177-185, on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains a square-root exponent. An
        order-dependence of a smooth split is not a discrete-log
        algorithm.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KN-TECH-055
      provenance: internal
      claim: >-
        The exemplar splits a smooth degree for a meet-in-the-middle.
        This idea tests whether one written splitting rule is
        sensitive to factor order. It does not replace the split.
      verified_by: >-
        design session opened knowledge/techniques/KN-TECH-055.md
        on 2026-10-06
  assumptions:
    - >-
      A positive integer is 7-smooth when every prime factor is at
      most 7. The primes at most 7 are 2, 3, 5, and 7.
    - >-
      The empty product is not used. The first prime factor of any
      such D is at most 7, and 7 ≤ 30, so each prefix product is a
      positive integer.
    - >-
      D = 30 is 7-smooth and is excluded because the range is
      strict above X. Including it voids the scan.
  predictions:
    - metric: >-
        the number of 7-smooth D in (30, 180] whose two prefix
        products differ by a factor of at least 2 and whose two
        cofactors lie on opposite sides of X
      direction: higher
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Enumerate every integer D from 31 through 180. Keep D when
      trial division by the primes 2, 3, 5, and 7 reduces it to 1.
      For each kept D, form both factor orders, compute both longest
      prefixes with product at most 30, and test the two conditions
      in integers. Count the D that pass both. Do not stop at the
      first hit. The claim is the full count at least 1.
    controls:
      - >-
        The integer 11 is not 7-smooth. If the enumerator keeps 11,
        the scan is void.
      - >-
        The integer 30 is 7-smooth and is outside the open range
        above 30. If the enumerator scores 30, the scan is void.
      - >-
        For D = 32 = 2^5, both orders are the same and the two
        prefix products are equal. If the two prefixes differ, the
        factorizer is void. D = 32 may or may not meet the cofactor
        condition. It is an equality control on the two orders, not
        a predicted hit.
    required_metrics:
      - the number of 7-smooth integers in the range
      - the number of D that meet both conditions
      - the prefix pair for each such D
  falsification_conditions:
    - >-
      The finished scan finds no D meeting both conditions, the
      integer 11 is excluded, and the integer 30 is excluded. That
      count of zero is the concrete negative.
    - The factorizer reports two different prefixes for D = 32.
    - The enumerator keeps an integer divisible by a prime greater than 7.
  confounders:
    - >-
      Dropping prime multiplicity, so that 12 = 2*2*3 is treated as
      2*3, changes the prefix.
    - >-
      Using a greedy split that is not the longest prefix, for
      example stopping at the first factor, answers a different rule
      than Lemma 3.4's largest index.
    - >-
      A floating-point product voids the comparison. All products
      here are integers at most 180.
  interpretation_limits:
    - >-
      One order-sensitive integer, or a count of zero, does not move
      the exponent p^{1/3+o(1)} and does not show that a real
      minimal degree fails to split.
    - >-
      The integers D are not degrees of isogenies. Agreement or
      disagreement here does not score Heuristic 1.
    - >-
      The archived proof also proves the complementary degree is at
      most X when the total degree is at most (p/2)^{1/3} and X is
      the paper's choice. This scan does not use that p.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The written splitting rule is applied to two opposite orders
        of the same multiset of prime factors. No randomness and no
        smoothness probability is assumed. The existence claim is a
        statement about a finite set.
      rigorous_support: >-
        Lemma 3.4 fixes one unspecified order and then proves a bound
        under the paper's choice of X. It does not assert that every
        order produces the same prefix, and it does not assert the
        existence claim in this idea.
      validation_plan: >-
        The quantity is the count of D in the stated range that meet
        both conditions. The comparison is that count against 1. The
        tail check is the D = 32 prefix equality. Transfer
        assumption: none. The count is not a probability at large p.
  target_complexity:
    time_exponent: >-
      unchanged at p^{1/3+o(1)} under Heuristic 1. The scan is
      O(1) arithmetic on 150 integers.
    memory_exponent: >-
      unchanged at p^{1/3+o(1)}. The scan stores one prefix pair per
      smooth integer in the range.
    best_known: >-
      Archived Theorem 1.1. This scan does not search for an
      endomorphism.
    hidden_overhead: >-
      The paper's o(1) is untouched. An order-sensitive split at
      X = 30 does not estimate it.
    tradeoff_note: >-
      No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: small
    compute: small
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-755e35
      - KR-RHO-ea34b8
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a generic discrete-log lower bound. This idea
          outputs a count of smooth integers. The exponent delta is
          zero.
      - ref: KN-TECH-055
        provenance: internal
        relation: adjacent
        delta: >-
          The exemplar uses a smooth split as one step of a
          meet-in-the-middle. This idea asks whether the prefix in
          the written proof depends on factor order, and it does not
          run the meet-in-the-middle.
    searched:
      corpus_grep:
        - largest index
        - prefix product
      web: []
      blocked: []
  dominated_by: >-
    Dominated as an algorithm by the archived Theorem 1.1 at
    p^{1/3+o(1)} time and memory. Compared with KR-RHO-13bf67
    (generic exponent 1/2, different problem) and KR-RHO-ea34b8
    (preprocessing tradeoff, not a factor-order scan). No row counts
    order-sensitive smooth prefixes at X = 30.
  sota_delta: >-
    Zero change to the 1/3 exponent. The numerical output is a count
    of integers against the threshold 1.
  proof_search_map:
    not_applicable_reason: >-
      This is a finite scan of smooth integers. It does not propose a
      theorem, a new bound, a certificate family, a reduction, or a
      closure.
