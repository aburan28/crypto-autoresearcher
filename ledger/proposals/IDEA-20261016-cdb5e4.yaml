    nearest:
      - {ref: KN-LIT-7563, provenance: internal, relation: adjacent, delta: "Records n = O(log p) via Lemma 14 and the NIST-I row. This threshold is ε < 2^{-15} from the printed ratio 2^{14}. IDEA-20260815-1cc763 measures λ2 against the big-O phrase and has no 2^{-15} budget."}
      - {ref: KN-LIT-6902, provenance: internal, relation: adjacent, delta: "The local note is title-level and does not contain Lemma 14’s distance. The test extracts (n, ε) from that paper."}
      - {ref: KR-RHO-755e35, provenance: internal, relation: orthogonal, delta: "An isogeny walk cannot reach a different trace or embedding degree. Algorithm 3 re-randomises OneEnd inside one isogeny class."}
      - {ref: KR-RHO-13bf67, provenance: internal, relation: orthogonal, delta: "Generic-group lower bounds count prime-order black-box operations. This walk is on supersingular j-invariants."}
      - {ref: KR-RHO-1c2928, provenance: internal, relation: orthogonal, delta: "Toy Koblitz signed-Frobenius rho constant, not a 2^{-15} mixing-lemma budget."}
