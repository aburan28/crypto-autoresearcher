idea:
  id: IDEA-20261016-cdb5e4
  title: Mixing citation versus total variation 2^{-15} on the NIST-I row
  status: proposed
  question_id: RQ-WESO-8aff57
  proposed_by: idea-generator
  approved_by: null
  added: '2026-10-16'
  class: control
  claim: >-
    The mixing citation in the proof of Theorem 1.1 (frozen source: n = O(log p)
    following Pizer or Basso et al., EUROCRYPT 2023, Lemma 14) does not display
    a walk length n with total-variation distance ε(n) < 2^{-15} from the
    uniform measure on supersingular j-invariants. The budget 2^{-15} is half
    the reciprocal of the Section 4.1 NIST-I ratio 2^{106.5}/2^{92.5} = 2^{14},
    so that a transferred success lower bound would remain at least half the
    uniform lower bound used for that row. Until such an n is displayed,
    Lemma 3.5’s probability for a uniform curve is not yet attached to
    Algorithm 3 at that row.
  mechanism: >-
    The smoothness event of Heuristic 1 depends on the terminal curve only.
    The endpoint of the non-backtracking 2-walk is a lossy projection: the
    path is discarded by the success event and retained for the pullback
    ω̂ ∘ ϕ ∘ φ ∘ ω. One step branches by 2 on the 3-regular graph after the
    arrival edge is removed. Coupling gives |Pr_walk[success] − Pr_uniform[success]| ≤ ε.
    If ε ≥ P0, the lower bound Pr_walk ≥ P0 − ε can vanish. IDEA-20260815-1cc763
    compares a measured spectral gap with the phrase O(log p). This record does
    not measure a spectrum. Its threshold is the printed ratio 2^{14}, and its
    object is the (n, ε) pair inside the cited lemma.
  novelty_status: unverified
  citations:
    - {ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, provenance: internal, claim: "Theorem 1.1 cites n = O(log p) via [37] or [6, Lemma 14]. Section 4.1 prints ≥ 2^{106.5} and ≥ 2^{92.5}.", verified_by: idea-generator}
    - {ref: KN-LIT-7563, provenance: internal, claim: "Records the same walk citation without an ε.", verified_by: idea-generator}
    - {ref: KN-LIT-6902, provenance: internal, claim: "Title-level note for Supersingular Curves You Can Trust. Lemma 14’s ε is not extracted.", verified_by: idea-generator}
    - {ref: "Pizer, Bull. AMS 1990, frozen source [37]", provenance: recalled, claim: "Ramanujan property of supersingular isogeny graphs, used as a mixing citation.", verified_by: null}
  assumptions:
    - "The budget 2^{-15} is half the printed reciprocal, chosen so a transferred lower bound stays at least P0/2."
    - "The ratio of the two printed ≥ figures is the section’s implied 1/P0."
    - "Remark 1 can raise the true success probability. This record does not estimate that multiplicity."
  proof_search_map:
    bottleneck: "The total variation named, or not named, by Algorithm 3’s mixing citation."
    baseline_embedding:
      parameter_slice: "Uniform-curve Lemma 3.5 at the Section 4.1 NIST-I row, implied P0 = 2^{-14}."
      reproduction_check: "2^{106.5}/2^{92.5} = 2^{14} from the printed row."
    observation_collision:
      observable: "The pair (n, ε) displayed in the cited Lemma 14."
      distinct_preimage_search: "Either [37] or [6, Lemma 14] displaying ε < 2^{-15} meets the budget."
    constructive_transforms:
      - {transform: stronger_invariant, proposed_object: "Total variation of the endpoint law", predicted_gain: "Yes or no attachment of Lemma 3.5 to Algorithm 3 at one printed row."}
    quantifier_order: "There exists an n, taken from the citation the proof already names, with ε(n) < 2^{-15}. The claim says the citation does not exhibit that n."
    method_ceiling:
      strongest_certifiable_claim: "Whether the existing citation discharges the transfer at distance 2^{-15}."
      nearby_object_control: "The NIST-V printed ratio. A citation can meet 2^{-15} and miss that tighter ratio."
    proof_obligations:
      - {claim: "No displayed n satisfies ε(n) < 2^{-15}", responsibility: success_probability}
      - {claim: "The printed NIST-I ratio is 2^{14}", responsibility: baseline}
    not_applicable_reason: null
  predictions:
    - {metric: "1 if no cited n has ε(n) < 2^{-15}, else 0", direction: higher, minimum_effect: "1 (no such n is displayed)"}
  minimal_test:
    design: "Read EUROCRYPT 2023 Lemma 14 and the Pizer citation as the frozen proof uses them. Extract every explicit (n, ε). Compare ε with 2^{-15}. If a pair meets the budget, record n and the field-operation cost of a non-backtracking 2-walk of that length, without rerunning the listing step."
    controls: ["Keep simple random walk and non-backtracking walk on separate rows.", "Label statistical distance, total variation, and ℓ2 bounds separately."]
    required_metrics: ["Every (n, ε) pair, or a statement that the lemma gives only O(log p)", "Whether min ε is < 2^{-15}"]
  falsification_conditions:
    - "Lemma 14 or the [37] citation displays an n with ε(n) < 2^{-15} for the non-backtracking walk. Coupling then keeps Lemma 3.5’s lower bound positive by at least P0/2 at the printed P0."
  confounders:
    - "A simple-random-walk bound does not bound Algorithm 3’s non-backtracking walk."
    - "Indistinguishability in the citation may be a fixed inverse polynomial, not 2^{-15}."
    - "Remark 1 can raise P0 above 2·ε. That factor is out of scope."
  interpretation_limits:
    - "A missing ε does not prove the walk is biased and does not weaken Heuristic 1 on uniform curves."
    - "A displayed ε < 2^{-15} does not validate the Section 4.2 Dickman comparison."
    - "No spectral computation. IDEA-20260815-1cc763 remains the λ2 measurement."
  heuristic_assumptions:
    - {id: H1, statement: "The Section 4.1 NIST-I success probability used as P0 is 2^{-14}, and the transfer budget is P0/2.", rigorous_support: "Coupling bounds the success gap by total variation. Lemma 3.5 supplies the uniform lower bound only under Heuristic 1, and only when Section 4.1 treats that bound as tight.", validation_plan: "Check the printed ratio. Recompute P0 at p = 5·2^{248}−1 from the Section 4.1 formulas and repeat at that P0/2. No curve sampling."}
  target_complexity:
    time_exponent: "Unchanged conditional p^{1/3+o(1)} when the walk length stays p^{o(1)} and the probability transfers."
    memory_exponent: "Unchanged. The walk stores a path of length n."
    best_known: "The same conditional theorem and the same Delfs–Galbraith polynomial-memory baseline."
    hidden_overhead: "A walk of length (log p)^{O(1)} sits in the o(1) only together with its ε."
    tradeoff_note: "Not a memory tradeoff. Walk cost is reported only if an n meeting the budget is found."
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  prior_art:
