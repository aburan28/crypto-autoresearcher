    - metric: per_instance_orbit_clause_sat_changes (literal original H1 clauses, planted SAT targets)
      direction: higher
      minimum_effect: At least one planted target per cell made UNSAT (predicted about (1 - 1/n) of single-solution targets). Zero changes would contradict claim (S2) and IDEA-20261001-93e740 claim (D).
    - metric: null_curve_ratio (arm (b) over arm (c) on the ordinary-curve null)
