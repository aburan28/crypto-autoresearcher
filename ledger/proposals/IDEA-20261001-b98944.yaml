      - claim: Arms (a), (b), (c) are satisfiability-equivalent per target after gauge mapping (fixture B0).
        responsibility: correctness
      - claim: The literal per-instance orbit-equivalence clause set changes satisfiability on planted targets (expected, derivation; tripwire, not a speed arm).
        responsibility: strictness
      - claim: ord_163(2) = 162 and ord_n(2) at every toy n, recomputed.
