  minimal_test:
    design: >-
      CELLS (R4-c; worksheet AC-1 to AC-4 and AC-11). m = 2: n = 17 with
      V = ker f_i(sigma) (l = 8) and F_2 + ker f_i(sigma) (l = 9); n = 23 with
      l = 11 and l = 12; n = 31 with l = 15 and l = 16. m = 3: n = 31 with
      l = 10 and l = 11 (3 (l - 1) <= 31). The degrees 17 and 23 host no
      admissible m = 3 stable cell, and 41 is excluded by scope (S3). CURVES:
      the Koblitz toy at each n (a = 1 first; a = 0 as second curve; #E
      recomputed at setup), and the ordinary-curve null over the same field.
      TARGETS: 50 seeded UNSAT targets and 20 planted SAT targets per cell.
      ARMS: (a) single-instance representative-and-shift in a normal basis;
      (b) gauge-fixed one-hot orbit system over the n conjugate targets in a
      normal basis; (c) plain single-instance in a normal basis and in the
      polynomial basis; the generic control; the literal per-instance clause
      set as soundness tripwire on planted targets only. Same solver, same
      seeds, shift bits given branching priority (47da4e's best case) and
      default order, both reported. SOLVER: WDSat (vendored per
      DEC-20260924-99ce20 HOLD-A; build state not verified here) and CaDiCaL if
      installable. A missing binary is an impediment, never evidence. STAGES.
      0: zero compute (worksheet). 1: fixture B0. 2: n = 17 cells. 3: n = 23
      and n = 31 cells, only if Stage 2's fixture passes. CHEAPEST VALID
      DISCRIMINATOR: the n = 17, l = 8 cell, arms (a), (b), (c) on 50 UNSAT
      targets, minutes with a solver. It separates the original H1 (ratio
      about 0.0035), the relabelling null (at least 0.95, overhead about n)
      and a solver-structure effect (below 0.95, not reproduced by the generic
      control).
    controls:
      - Fixture B0 (gauge j = 0 equals arm (c); certificate equality on planted targets).
      - Ordinary-curve null at the same field and V.
      - Size-matched generic symmetry-breaking clause set on the same targets.
      - Arm (c) in two bases (basis separated from encoding).
      - Literal per-instance orbit clauses as a soundness tripwire, never a speed arm.
    required_metrics:
      - conflicts and decisions per target per arm, median and interquartile range per cell
      - (a) - (c) and (b) - (c) per target, regressed against n and against conflicts(c)
      - satisfiability changes under the literal per-instance clauses
      - certificates on every SAT answer, re-verified by group arithmetic
      - solver name, version, build hash, branching order; termination_reason per run
  falsification_conditions:
    - 'A replicated median ratio (a)/(c) or (b)/(c) below 0.95 at a cell, not reproduced by the generic control and not explained by the basis ratio: H1-prime is false there and the solver exploits orbit structure beyond the counting identity; route to review-adversarial before any interpretation.'
    - 'Overhead (b) - (c) growing proportionally with conflicts(c) rather than with n: the overhead is multiplicative and the relabelling reading fails, in the unfavourable direction.'
    - 'The literal per-instance orbit clauses change no planted target at any cell: claim (S2) and IDEA-20261001-93e740 (B1) are contradicted; headline, replicate.'
    - 'An independent computation finds a stable subspace of F_{2^163} of dimension other than 0, 1, 162, 163: the ord_163(2) arithmetic is wrong.'
    - 'Fixture B0 failure: the encodings are not equivalent; run void, no evidence either way.'
  confounders:
    - Branching order dominates SAT conflict counts (47da4e reports 2.5 to 15 times under default order). Both orders are reported, and the band applies to the priority order.
    - Solver version and XOR module. WDSat XG-ext changed absolute counts by factors of 69 to 220 in 47da4e while preserving ratios; ratios, not counts, are compared across arms.
    - Small-n noise. Medians over 50 targets, two curves per n.
    - Basis. Arm (c) is run in both bases so a basis effect is not misread as an encoding effect.
  interpretation_limits:
    - Proposal only. No experiment, approval, run or result exists here.
    - Toy tier, linear stable bases only, m in {2, 3}, n in {17, 23, 31}. Nothing transfers to orbit unions at m >= 3, to n = 41 or 43, or to any deployed curve.
    - >-
      KN-FIND-47da4e is a prior on the form of the overhead only. It is not
      evidence about linear stable bases and is not read as anticipating
      H-FROB-a5bf86 or EXP-FROB-30006a.
