  predictions:
    - metric: stable_subspace_dimensions_at_n_163 (zero compute)
      direction: different
      minimum_effect: EXACTLY {0, 1, 162, 163}. Any other dimension falsifies the ord_163(2) arithmetic.
    - metric: ratio_rep_shift_over_plain = conflicts(a) / conflicts(c), per UNSAT target, median per cell
      direction: higher
