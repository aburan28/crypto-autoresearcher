  assumptions:
    - >-
      Linear stable bases V = ker g(sigma), with g a product of the
      irreducible factors of T^n - 1 over F_2, at the admissible dimensions of
      the cells. No orbit-union base is used; that is 47da4e's object.
    - >-
      Cell admissibility uses IDEA-20260904-96c4f3's validity range
      m (l - 1) <= n with l >= 2, and measurements are made on UNSAT targets
      (conflict counts) plus planted SAT targets (soundness).
    - >-
      OFF-LIMITS COMPONENTS declared: F2 (factor-base decomposition) as the
      family and F6 (endomorphism orbit) as the named operation set only. No
      new factor base; no KN-OPEN-020 escape claimed.
    - No run at n >= 131 and none at n = 41 or 43 (scope separation from H-FROB-a5bf86).
  proof_search_map:
    bottleneck: >-
      Whether any sound use of the Frobenius orbit structure lowers the
      per-target search of ONE decomposition attempt on a stable base, which
      is the only way 2a3771's H1 gain could exist after the equivariance
      correction.
    baseline_embedding:
      parameter_slice: >-
        Arm (c) itself, the plain single-instance CNF-XOR search with S_m
        lexicographic breaking. Under IDEA-20260904-3c7a91's proposed law its
        UNSAT conflict count is (1 +- 0.05) 2^{ml}/m!. The gauge-fixed orbit
        system at j = 0 is arm (c) exactly. That is the symbolic embedding.
      reproduction_check: >-
        Frozen fixture B0. (i) The gauge-fixed orbit encoding restricted to
        j = 0 is checked clause-by-clause equal to arm (c) after variable
        renaming. (ii) Arms (a), (b), (c) return identical certified solution
        sets (mapped through the gauge) on 20 planted SAT targets per cell.
        (iii) Arm (c)'s UNSAT conflict count at n = 17, m = 2 is reported
        against 2^{ml}/m!; deviation beyond 3c7a91's band is recorded, not
        corrected.
    observation_collision:
      observable: Ratio of per-target conflict counts, (a)/(c) and (b)/(c), on identical UNSAT targets.
      distinct_preimage_search: >-
        A ratio below 1 could come from (i) solver exploitation of the
        circulant normal-basis structure, which is the live reading; (ii) a
        basis effect independent of the encoding; (iii) an unsound clause
        silently dropping branches. (ii) is separated by running (c) in both
        bases. (iii) is separated by fixture B0 (ii) and by certificate
        equality on every SAT target. The literal original H1 clause set
        (per-instance orbit equivalence) is run once as a soundness tripwire
        and must change satisfiability on planted targets.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The gauge-fixed orbit system as a change of coordinates of the single-instance search.
        predicted_gain: None (that is the prediction); a ratio below 0.95 would falsify it.
      - transform: observable_fiber
        proposed_object: Hold the search space fixed and vary only the encoding (plain, representative-and-shift, orbit one-hot) and the basis.
        predicted_gain: Separates solver behaviour from counting identity.
    quantifier_order: >-
      Counting identity: FOR ALL stable V, FOR ALL m, the gauge-fixed orbit
      search space has exactly |V^m / S_m| points, which is exact. H1-prime:
      FOR the tested cells (n, l, m) and the named solvers, ratios at least
      0.95 with overhead additive in n. Heuristic and solver-specific; one
      replicated sub-0.95 cell refutes it there.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On linear stable bases at n = 17, 23, 31 (m = 2) and n = 31 (m = 3),
        sound orbit encodings cost (a)/(c) and (b)/(c) times the plain search
        on the named solvers, with overhead of the stated form." It certifies
        nothing about orbit unions at m = 3 (47da4e's successor), nothing about
        n = 41 or 43, nothing about K-163 or any deployed curve, and nothing
        about cost per relation.
      nearby_object_control: >-
        Two, blocking. (i) The ordinary-curve null at the same field and same
        V (b not in F_2). There sigma is not an endomorphism and the orbit
        system is not an equivariance, so arm (b)'s n targets are unrelated and
        its ratio must be at least the Koblitz ratio. (ii) A size-matched
        generic symmetry-breaking clause set (lexicographic leader on a random
        permutation group of order n acting on the leg variables) on the same
        targets. It must not reproduce any sub-1 ratio that arms (a) or (b)
        show; if it does, the effect is generic SAT engineering.
    proof_obligations:
