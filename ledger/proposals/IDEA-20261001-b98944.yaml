  title: >-
    K-163 HOSTS NO FROBENIUS-STABLE SUBSPACE (ord_163(2) = 162, recomputed), SO
    BOTH NUMBERED CONDITIONS OF 2a3771 LACK AN OBJECT THERE. RESTATED THROUGH
    a77711's EQUIVARIANCE, ITS H1 BECOMES A FALSIFIABLE RELABELLING NULL: on a
    linear sigma-stable base, every SOUND orbit encoding (single-instance
    representative-and-shift reparameterisation, or the gauge-fixed n-target
    orbit system) costs at least the plain single-instance search, with an
    overhead additive in n. KN-FIND-47da4e (m = 2, orbit unions) is the
    pre-registered prior inside its stated exclusion, and the toy cells are
    n = 17, 23, 31 at m = 2 and n = 31 at m = 3. H2 is removed: orbit-constancy
    of the abscissa test is a theorem, so it cannot fail.
  class: control
  claim: >-
    SETTING. As in IDEA-20261001-93e740: a Koblitz toy E over F_{2^n} (a, b in
    F_2), n an odd prime, G of prime order r with r^2 not dividing #E and G
    meeting E(F_2) only in O, sigma the absolute Frobenius acting on G as
    lambda of order n. V is a sigma-stable F_2-subspace, V = ker g(sigma) for a
    monic divisor g of T^n - 1 over F_2. Arity is written m (never the field
    degree; 2a3771's m_a log2(m) notation is retired).

    (S1) K-163 AND THE ORIGINAL'S OBJECT (HOLD-S; recomputed in worksheet
    AC-6). ord_163(2) = 162: 2^81 = -1 mod 163 (2 is a non-residue, 163 = 3
    mod 8), and 2^2, 2^6, 2^18, 2^54 are not 1 mod 163. So Phi_163 is
    irreducible over F_2, T^163 - 1 = (T - 1) Phi_163, and the sigma-stable
    subspaces of F_{2^163} have dimensions 0, 1, 162, 163 only. Neither of
    2a3771's conditions has an object on K-163 at any index-calculus
    dimension. The same holds at ECC2K-130 (ord_131(2) = 130; AC-5).
    Frobenius-stable SETS (orbit unions) exist at every n. They are
    KN-FIND-47da4e's object, not a stable subspace.

    (S2) H1 RESTATED UNDER a77711's EQUIVARIANCE (R4-a). The original H1 (on
    ONE instance, explicit orbit-equivalence clauses make the search range
    over |V|/n orbit classes and cut conflicts by a factor n^m) is withdrawn.
    Squaring maps Sol(R, V) to Sol(sigma R, V), the system for sigma(R), not
    to itself (a77711 Lemma A1 at q = 2; 9c5694 Proposition T). A clause that
    identifies a solution t with sigma t on one instance therefore changes
    satisfiability, which is the original's own falsification condition, met by
    derivation (the loss law is IDEA-20261001-93e740 claim (D)). The ceiling is
    9c5694 Proposition Sigma: the per-instance stabiliser is S_m. Every SOUND
    orbit clause set on one instance is a bijective reparameterisation
    x_i = sigma^{s_i}(rho_i) (rho_i an orbit representative in V, s_i a shift)
    whose search space equals the plain one. The only sound reduction by n is
    gauge fixing of the n-target orbit system, where it is cancelled exactly by
    the n-fold target multiplicity (IDEA-20261001-e740ce claim (A)). H1-PRIME
    (falsifiable). On a linear sigma-stable V at the cells below, the
    per-target complete-search conflict count of (a) the single-instance
    representative-and-shift reparameterisation and of (b) the gauge-fixed
    one-hot orbit-system encoding over the n conjugate targets, each divided by
    (c) the plain single-instance count on the same solver with the same
    branching priority, is at least 0.95, and the excess (a) - (c) and
    (b) - (c) grows with n and not with (c). The original's alternative is a
    ratio of about n^{-m} (0.0035 at n = 17, m = 2).

    (S3) THE PRIOR, CITED WITH ITS STATED EXCLUSION (HOLD-S). KN-FIND-47da4e
    measured the gauge-fixed one-hot shift encoding of an ORBIT UNION of a
    random subspace at m = 2: ratios 1.017, 1.017, 1.467, 1.150 on CaDiCaL at
    n = 13, 17, 19, 23 and 1.000 to 1.212 on WDSat at n = 19, 23, never below
    1, with an additive overhead of about one conflict per discarded shift.
    Its exclusions are stated in its own text and bind here. (i) It is an
    unverified deposit whose promotion gate is not met. It may not support a
    status change and may not be cited as internal ground truth. (ii) It covers
    m = 2 only. (iii) It is one parameterisation of orbit unions. (iv) In its
    own words, with Greek letters and code marks transliterated, "Nothing
    about the linear stable factor bases. H-FROB-a5bf86 and EXP-FROB-30006a
    test ker g(sigma) at n = 41 and 43 against the null 2^{m l}/m!. Different
    object, different cells, different null. This entry scores none of that
    hypothesis's predictions and must not be read as anticipating its
    result." (v) Its table is the encoding's best case, with shift bits given
    branching priority; default order cost 2.5 to 15 times. Accordingly 47da4e
    is used here only as a prior on the FORM of the overhead (additive), never
    as evidence about linear stable bases. This record keeps off n = 41 and 43
    and states nothing about H-FROB-a5bf86's predictions or any
    EXP-FROB-30006a outcome.

    (S4) H2 REMOVED. 2a3771's H2 (count |x(E) cap V| by one representative per
    tau-orbit) is true by construction. For a, b in F_2 and x != 0, x is an
    abscissa iff Tr(x + a + b/x^2) = 0, and Tr(u^2) = Tr(u) makes the test
    invariant under x -> x^2. The representative count therefore equals the
    direct count identically, and no outcome can fail. The "uncharged"
    polynomial-to-normal basis conversion is one fixed n x n matrix over F_2
    (n^2 bit operations per element). ECC2K-130 is already specified in a type-2
    normal basis (KN-LIT-661e97). Both facts are kept only as an instrument
    self-check, never as a prediction.

    (S5) WHAT WOULD HAVE TO BE TRUE, RE-SCOPED (the original's question). For a
    Frobenius-derived per-attempt gain on K-163's decomposition step, which
    has no stable V, at least one of the following must hold. (C1) A sound
    per-instance Frobenius symmetry: excluded at the proposition level by 9c5694
    Proposition Sigma (cited as ceiling; IDEA-20261001-93e740 tests its
    soundness consequences). (C2) A Frobenius-stable SET base whose sound
    encoding beats relabelling: 47da4e found none at m = 2 (unverified). This
    record tests the transferable half, whether a linear stable base where one
    exists does any better. (C3) Conjugate attempts over a non-stable V
    correlated beyond the base-intersection overlap: 9c5694's E-EXTRA reading,
    open and not tested here. (C4) Arity: governed by the product law. For
    ECC2K-130 the m = 4 per-attempt budget is D3 = 2^11.01
    (CORR-20260928-4cb669, never D1). No K-163 product-law figure is computed
    here. Matched rho on K-163 under the CORR-20260922-81aeab convention is
    sqrt(pi r / (4 x 163)), about 2^77.15 if log2 r = 162 (approximation; r
    not re-read from FIPS 186-4). Nothing here states that any condition holds,
    and nothing is a speedup or a verdict on K-163.
  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinates in a fixed F_2-basis). The
    normal basis, in which sigma is a coordinate rotation, is used for arms (a)
    and (b); arm (c) is run in both bases, so basis and encoding are separated.
    Operation set Sigma_op = <sigma> acting on (tuple, conjugate-target index)
    pairs of the orbit system. Trichotomy: partial-action; sigma moves the
    target, so it acts on the family of n instances and not on one.
    LOSSY-PROJECTION TEST against Sigma_op. The gauge-fixed orbit system is
    the quotient of Omega = (V^m / S_m) x Z/n by the free C_n-action
    (t, j) -> (sigma t, j + 1). The projection is lossy (n to 1) and propagates
    deterministically, but its image is in bijection with the single-instance
    search space V^m / S_m (gauge j = 0). That is a change of coordinates of
    the single-instance search in the sense of docs/inventor-protocol.md
    section 2, which is why no per-target gain is predicted. The single-instance
    reparameterisation (a) loses nothing (a bijection) and fails the test
    outright. What the measurement can still find is solver behaviour: whether
    clause learning or XOR propagation exploits the circulant structure of the
    normal-basis encoding beyond the counting identity. That would be ratio
    below 0.95, and it is the only route to the original's gain.
