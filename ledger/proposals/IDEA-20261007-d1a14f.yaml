idea:
  id: IDEA-20261007-d1a14f
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Legendre symbol of the norm of y(P) - y(pi(P)) on
    y^2 = x^3 + x + 4 over F_31, against a frozen translate
  class: measurement
  claim: >-
    On E: y^2 = x^3 + x + 4 over F_31, let S be the affine points of
    E(F_{31^2}) whose x-coordinate is not in F_31 and for which pi(P)
    is distinct from both P and -P. Let N be the field norm
    F_{31^2} to F_31. Let C_frob be the number of P in S for which the
    Legendre symbol (N(y(P) - y(pi(P))) / 31) equals 1. Let T be the
    least affine point in lexicographic order, and let S_T be the
    points of S for which P+T is affine and distinct from P and from
    -P. Let C_shift be the number of P in S_T for which
    (N(y(P) - y(P+T)) / 31) equals 1. The claim is
    C_frob >= C_shift + floor(|S|/10). The representation is R1.
    The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0.
  mechanism: >-
    The tracked object is one quadratic character of a norm, not the
    point. Frobenius fixes the base field, so N(y(P) - y(pi(P))) is a
    base-field element and the character is defined. A translate by a
    frozen point has no such reason to prefer quadratic residues. The
    operation set is the pair {pi, translation by T}. This is a
    character count, not a walk and not a factor base.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: A generic algorithm needs on the order of the square root of the group order.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: Gaudry's exponent in q is 2-2/n for fixed n. This count is not that exponent.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: An isogeny walk cannot reach a different weakness class. This proposal does not walk one.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
  predictions:
    - metric: C_frob minus C_shift
      direction: higher
      minimum_effect: the difference is at least floor(|S|/10)
  minimal_test:
    design: >-
      Recheck that 4+27*16 is 2 mod 31. Enumerate affine points over
      F_{31^2}. Compute C_frob and C_shift. No discrete log is attempted.
    controls:
      - A zero discriminant voids the run.
      - The size of S equal to 0 is instrument_failure, not a value of the difference.
      - Replacing T by T does not change C_shift. A second loop must agree.
      - The character of 0 is excluded. A zero difference is dropped from both counts and the drop is reported.
    required_metrics:
      - C_frob
      - C_shift
      - size of S
      - the discriminant residue
  falsification_conditions:
    - C_frob <= C_shift after the instrument checks pass.
    - The size of S is positive and the difference is strictly less than floor of the size of S over 10.
  confounders:
    - Points with pi(P) = P or pi(P) = -P make the Frobenius difference zero and are excluded from S by the definition.
    - A translate that lands on infinity is excluded from S_T. The excluded count is reported and does not change the threshold.
  interpretation_limits:
    - Toy scope: F_31 and F_{31^2} only.
    - The discrete-log exponent stays 1/2 whether or not the inequality holds.
    - This is not a statement about the mean absolute trace of y.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The Frobenius difference N(y(P)-y(pi(P))) is a quadratic residue
        more often than the translate difference, by at least |S|/10.
        The bias is not proved. The translate is the null of the same shape.
      rigorous_support: >-
        The norm of an element of F_{31^2} lands in F_31, and the
        Legendre symbol on F_31 is a character of order 2. No opened
        bound gives the gap floor(|S|/10).
      validation_plan: >-
        Compute both counts on this one curve. Tail check: also report
        the count of symbol -1. If the +1 gap meets the threshold and
        the -1 count for Frobenius exceeds the -1 count for the
        translate, the residue-bias reading fails and is recorded
        beside the row. That tail does not replace the threshold.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "1/2 is the generic collision scale and is not improved; the test stores one curve over F_{31^2}"
    best_known: >-
      Pollard rho at exponent 1/2 (KR-RHO-13bf67) and Gaudry
      Õ(q^{2-2/n}) for fixed n (KR-IC-46d822). Neither is replaced.
    hidden_overhead: No o(1) term is claimed. The gap is one integer on one curve.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0. This is not a van Oorschot-Wiener tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-RHO-13bf67, KR-IC-46d822, KR-IC-b0fcda, and
    KR-RHO-755e35, each opened on 2026-10-07. None dominates: the
    generic bound is exponent 1/2, Gaudry's row is a decomposition
    exponent, the factor-base row does not score this character, and
    the isogeny row does not apply because no walk is run. The
    exponent claimed here is the same 1/2.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0. The pre-registered gap is C_frob - C_shift at
    least floor(|S|/10).
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-46d822
      - KR-IC-b0fcda
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-IC-46d822
        provenance: internal
        relation: orthogonal
        delta: >-
          Gaudry's cost is Õ(q^{2-2/n}). This proposal outputs one
          character gap on F_{31^2} and states exponent delta 0.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The generic lower bound is on the order of the square root.
          This proposal does not undercut it.
    searched:
      corpus_grep:
        - "Legendre symbol of the norm"
      web: []
      blocked:
