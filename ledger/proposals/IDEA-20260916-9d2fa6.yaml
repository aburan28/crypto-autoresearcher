  assumptions:
    - >-
      Claim (A) - block multiaffinity - is an OBLIGATION, not an assumption
      granted: it is verified symbolically at Stage 0 on the actual system
      builder output (harness/semaev.py, src/semaev_tree.py) by asserting that
      every monomial of every descended generator has at most one variable
      from each block and touches at most three blocks. If the assertion
      fails, rungs N2-N4 are re-specified to match whatever the true pattern
      is, and the record says so rather than proceeding.
    - >-
      All five arms share: the field, n, t, k, the F_2-basis of the descent,
      the field-equation convention, the row-set convention, the monomial
      order, the Macaulay degree D, the column partition and the seed
      protocol. An arm differing in any of these is void as a control.
    - >-
      N4's random F_{2^n}-polynomial is drawn with the same multidegree as
      S_3 and the same constant-term slot, so the ONLY difference from N5 is
      the coefficient values. In particular the curve equation is not used to
      generate N4 and no elliptic-curve solution set exists for it; N4 arms
      therefore have no decomposition certificate and none is claimed.
    - >-
      OFF-LIMITS COMPONENT DECLARED: family F2 (factor-base decomposition) is
      the underlying system; no new factor base is proposed and KN-OPEN-020 is
      not engaged.

  proof_search_map:
    bottleneck: >-
      The inferential step "the Semaev system has a deficit and a
      support-matched random system does not, therefore the deficit is
      Semaev structure". Removing that step - by interposing nulls that share
      the structure the attacker cannot choose - changes which part of the
      measured effect is allowed to carry an exponent argument, without
      changing any measured number.
    baseline_embedding:
      parameter_slice: >-
        N1 IS the existing baseline and must be reproduced exactly: the T11
        null at n = 12,15,18 must return deficit 0 and rank equal to the
        archived sr_pred integers (29,418 at n = 12; 70,935 at n = 15). That
        is the parameter slice at which this record's tower degenerates to the
        program's current practice.
      reproduction_check: >-
        Byte-level: the N1 arm is run through the SAME code path with the SAME
        seed as the archived run and its rank integers compared to the archived
        values. Any deviation halts the battery as an instrument failure under
        the KN-OPEN-5b3a08 precedent.
    observation_collision:
      observable: >-
        deficit(D) and new_falls(D) at fixed (n, k, D).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED AT SOME RUNG, which is the content.
        The search is exactly the tower: two systems (N4 and N5) that are
        distinct ground-truth objects - one has an elliptic-curve solution set
        and one does not - and the question is whether they collide on the
        observable. A collision at N4/N5 means the observable cannot see the
        summation polynomial at all and every "Semaev is special" reading of
        the deficit is void. A separation at N4/N5 is the first evidence in
        this program that the observable sees the curve rather than the
        descent. BOTH are reportable results and the record commits to
        reporting whichever occurs.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (deficit, fall profile) fixed and vary the
          forgotten structure one named feature at a time. The tower is
          literally a walk through the fiber of the observable, and the
          increments Delta_i are the derivative of the observable along each
          named direction.
        predicted_gain: >-
          Replaces one uninterpretable number (8k) by four named increments
          whose sum is that number, at the cost of three extra arms per cell.
          NO ATTACK EXPONENT IS MOVED; what moves is which increment is
          ALLOWED to be quoted in an exponent argument.
      - transform: representation_reduction
        proposed_object: >-
          Move the "slower than random" question into the multidegree support
          lattice, where "random" becomes a precisely specified uniform
          distribution on a named coefficient space rather than an intuition.
        predicted_gain: >-
          Makes "random similar systems" - the slide's own phrase, and its
          weakest word - a definition instead of a gesture.
    quantifier_order: >-
      CLAIMED: FORALL cells (n, t, k) in the tested ladder, FORALL degrees D
      in the tested range, the five arms are constructed from ONE shared
      specification that fixes everything except the named feature, and the
      increments Delta_i(D) are reported. NOT CLAIMED: that there EXISTS a
      decomposition of the deficit into structural causes that is
      basis-independent or unique - the tower's order is a CHOICE, different
      orders give different increments when the features interact, and the
      record therefore also runs the reverse order (N0, N4', N3', N2', N5 with
      features added in the opposite sequence) at the single cheapest cell to
      measure the interaction. An increment that changes sign under reordering
      is reported as non-additive and not attributed.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these cells, of the measured deficit at degree D, the fraction
        f_i is already present in a random system sharing features 1..i, and
        the residual fraction f_4 is present only when the coefficients are
        the summation polynomial's." It can NEVER certify that the residual
        is exponent-relevant - that requires a growth law in n AND a cost
        model, neither of which a rank measurement supplies - and it can never
        certify that some unnamed fifth feature is not doing the work.
      nearby_object_control: >-
        BLOCKING, and it is N4 itself read in the other direction: a random
        descended system has no elliptic curve behind it, so if N4 reproduces
        the full 8k deficit then the deficit is a theorem about Weil descent
        of multiaffine chains and the method has NOT identified curve
        structure. A second nearby object: the descent of S_3 for a SINGULAR
        curve (B = 0), where the group law degenerates; the deficit must
        change if it is about the group and need not if it is about the
        monomial shape.
    proof_obligations:
      - claim: >-
          Every descended generator is multiaffine in the block decomposition
          and touches exactly three blocks.
        responsibility: correctness
      - claim: >-
          N2, N3, N4 are drawn from exactly the stated coefficient spaces, with
          the sampler verified by a planted-structure check.
        responsibility: encoding
      - claim: >-
          N1 reproduces the archived deficit-0 baseline.
        responsibility: baseline
      - claim: >-
          The telescoping identity sum_i Delta_i = deficit_{N5} - deficit_{N0}
          holds numerically at every cell.
        responsibility: correctness
      - claim: >-
          Increment attribution is order-dependent, and the interaction is
          measured rather than assumed away.
        responsibility: scope
      - claim: >-
          Per-arm matrix dimensions and peak memory stay inside the contract,
          with pre-flight abort.
        responsibility: memory
    not_applicable_reason: null

  predictions:
    - metric: >-
        deficit(D=4) on arm N2 (block-multiaffine random) at
        n in {12,15,18}, k = n/3
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED AND FALSIFIABLE IN BOTH DIRECTIONS. Predicted STRICTLY
        POSITIVE and growing with k - at least 2k - because a multiaffine
        system's degree-4 Macaulay matrix cannot reach the monomials a dense
        system reaches, so the semi-regular prediction over-counts. If instead
        deficit_{N2}(D=4) = 0 (like the T11 null), then multiaffinity explains
        NONE of the effect and the T11 null was adequate after all - which
        would be a clean negative for this record and a strengthening of
        KN-FIND-006.
    - metric: >-
        Delta_4(D=4) = deficit_{N5}(D=4) - deficit_{N4}(D=4), as a fraction of
        8k, at k = 3,4,5,6
      direction: different
      minimum_effect: >-
        THE DECISION METRIC, threshold fixed before data: >= 0.5 at every k is
        "genuinely summation-polynomial"; <= 0.1 at every k is "Weil-descent
        artifact"; between is UNRESOLVED and the response is to extend k, not
        to move the threshold.
    - metric: >-
        new_falls(3) on arms N2, N3, N4 versus N5
      direction: lower
      minimum_effect: >-
        Predicted 0 on N2 and N3 and 0 on N4, versus 1 on N5, because the
        degree-3 fall is claimed (by KN-FIND-006's exhibited mechanism, and by
        Kosters-Yeo's group-morphism cause) to require a cancellation that
        generic coefficients do not produce. A degree-3 fall on N4 at any cell
        falsifies that attribution and reassigns the degree-3 mechanism to the
        descent rather than to the curve - which would be the single most
        surprising outcome available here and is why this metric is included.
    - metric: >-
        the reverse-order tower at the cheapest cell (n = 12, D = 4):
        max_i |Delta_i(forward) - Delta_i(reverse)| / 8k
      direction: different
      minimum_effect: >-
        REPORTED. Below 0.1 means the features are close to additive and the
        attribution is meaningful; above 0.3 means they interact strongly and
        NO single-cause attribution may be quoted, only the joint table. The
        record commits to the latter reading if it occurs.
    - metric: >-
        deficit and fall profile on the singular-curve arm (B = 0)
      direction: different
      minimum_effect: >-
        REPORTED AS A NEARBY-OBJECT CONTROL. If the deficit is unchanged from
        N5, the observable is not seeing the group law.

  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE, HARD GATE. Assert block multiaffinity
      symbolically on the actual builder output at n = 12: every monomial of
      every descended generator has degree <= 1 in each block and touches <= 3
      blocks. Record the assertion result. If it fails, re-specify N2-N4 to the
      observed pattern before any arm is built.
      STAGE 1 - SAMPLERS AND THEIR PLANTED-STRUCTURE CHECKS, MINUTES. Implement
      the N2, N3, N4 samplers. Each is validated by a planted check: draw 1000
      samples and assert the intended invariant holds in all of them and that
      the un-intended invariants do NOT hold (e.g. an N2 sample must be
      multiaffine and must NOT be chain-symmetric; an N3 sample must be both).
      A sampler that accidentally produces the next rung's structure voids the
      telescoping and is rejected here, not discovered later.
      STAGE 2 - BASELINE REPRODUCTION, MINUTES. N1 at n = 12 and n = 15 must
      reproduce the archived rank integers exactly.
      STAGE 3 - THE TOWER AT n = 12, SINGLE-DIGIT CPU HOURS. All five arms,
      D = 3,4,5, 5 seeds per random arm (N2, N3, N4), 1 deterministic Semaev
      arm, both observables (deficit and fall profile). Report the per-arm
      distribution across seeds, never only the mean.
      STAGE 4 - THE k LADDER, TENS OF CPU HOURS. Repeat at n = 15 and n = 18
      (k = 5, 6), D = 3,4 guaranteed and D = 5 if the pre-flight allows. The
      point of the ladder is Delta_4 as a function of k, because 8k is a
      k-law and a k-independent measurement cannot test it.
      STAGE 5 - REVERSE ORDER AND SINGULAR-CURVE ARMS, MINUTES, at n = 12
      only.
      STAGE 6 - ZERO COMPUTE. Report the attribution table with the
      pre-registered verdict, the interaction measure, and the not-measured
      list.
    controls:
      - >-
        N1 ARCHIVED-BASELINE REPRODUCTION (blocking).
      - >-
        SAMPLER PLANTED-STRUCTURE CHECKS (blocking): each rung's sampler must
        produce its own invariant and must NOT produce the next rung's.
      - >-
        REVERSE-ORDER TOWER at the cheapest cell, measuring feature
        interaction. Attribution language is forbidden if the interaction
        exceeds the stated threshold.
      - >-
        SINGULAR-CURVE (B = 0) NEARBY OBJECT: does the observable see the
        group law at all.
      - >-
        SEED VARIATION on every random arm, with the full distribution
        reported and the extreme seed named.
      - >-
        SHARED-SPECIFICATION ASSERTION: a single frozen spec object generates
        all five arms and an automatic diff proves they differ only in the
        named feature.
    required_metrics:
      - 'rank(M_D), sr_pred(D), deficit(D) per arm per cell per degree'
      - 'new_falls(D) per arm per cell per degree (IDEA-20260916-4b7c1e meter)'
      - 'Delta_i(D) for i = 1..4, forward and reverse order'
      - 'Delta_4(D=4) / 8k at each k, with across-seed spread'
      - 'sampler validation pass rates and the planted-check outcomes'
      - 'per-arm matrix dimensions, pre-flight monomial count, peak RSS, wall time'
      - 'list of NOT MEASURED cells with reasons'

  falsification_conditions:
    - >-
      Stage 0's multiaffinity assertion fails. Claim (A) is false as stated
      and the tower is re-specified before anything is run; the record does
      not proceed on the old specification.
    - >-
      deficit_{N2}(D=4) = 0 at every cell. Multiaffinity explains nothing and
      the T11 null was already adequate; this record's central premise is
      wrong and KN-FIND-006's attribution is strengthened, not weakened.
    - >-
      deficit_{N4}(D=4) >= 0.9 * 8k at every k. The 8k law is a theorem about
      Weil descent of multiaffine chains with field equations, the summation
      polynomial contributes almost nothing, and every "Semaev systems are
      special" reading in this corpus - including KN-FIND-006's own framing -
      must be re-scoped.
    - >-
      new_falls(3) = 1 on arm N4. The degree-3 affine degeneration is generic
      for descended chains and neither the curve nor Kosters-Yeo's group
      morphism is needed to explain it.
    - >-
      The forward and reverse towers disagree by more than 0.3 * 8k on some
      increment. No single-feature attribution may be quoted from this battery
      at all, and the deliverable collapses to a joint table.
    - >-
      N1 fails to reproduce the archived integers. Instrument failure; the
      battery is void.

  confounders:
    - >-
      THE SEMI-REGULAR PREDICTION IS ITSELF MODEL-DEPENDENT. deficit(D) is
      defined against the Bardet-Faugere-Salvy formula, which assumes a
      generic dense system. For a multiaffine system that formula is the WRONG
      reference and its "deficit" partly measures its own inapplicability.
      This is why every arm is ALSO measured with the model-free fall profile;
      conclusions that hold on only one of the two observables are reported as
      such.
    - >-
      SAMPLER BIAS. A random coefficient draw that accidentally lands on a
      degenerate system (e.g. an identically zero descended component) inflates
      the deficit. Degenerate draws are detected, reported and re-drawn with
      the count of re-draws recorded, never silently discarded.
    - >-
      N4 HAS NO SOLUTION SET. A random descended chain has no guaranteed
      Boolean solutions, so unsatisfiable-instance effects may differ between
      N4 and N5. The Semaev arm is therefore run in BOTH a
      satisfiable-by-construction and a random-target variant, and N4 is
      compared to the random-target variant.
    - >-
      DEFICIENT CELLS. n = 9 and n = 17 are structurally deficient per
      KN-FIND-006 and are excluded from the k-law fit, reported separately.
    - >-
      INTERACTION. Features are not independent - symmetry constrains
      coefficients, which interacts with multiaffinity - so increments are not
      causal effects. The reverse-order arm exists because this cannot be
      argued away.
    - >-
      FIELD-EQUATION CONVENTION. Rungs N0-N3 have no natural field equations
      of their own; they must be given the SAME Boolean field equations, and
      that choice is itself a feature. It is declared as part of the shared
      spec and the "field equations out" variant is run at n = 12 to bound the
      effect.

  interpretation_limits:
    - >-
      A CONTROL result, not an attack. No exponent is claimed in any
      direction, and a large Delta_4 would NOT by itself be an ECDLP result -
      it would be a licence to ask the growth question about that residual.
    - >-
      Everything is scoped to the chained binary presentation at
      t = 3, n in {12,15,18}, the stated conventions, and the tested degrees.
      No transfer to n = 409 or 571, to odd characteristic, or to the direct
      S_{m+1} presentation is claimed.
    - >-
      This record does NOT claim that Weil-descended Semaev systems violate
      the semi-regular prediction (already established, KN-LIT-7604 /
      KN-LIT-7607) nor that the deficit is bounded in system size (same). It
      claims the existing comparison does not attribute the departure, and it
      supplies the attribution instrument.
    - >-
      KN-OPEN-020 class: not applicable; no factor base is proposed.
    - >-
      A controlled null (Delta_4 near zero) is a FIRST-CLASS OUTCOME and must
      be recorded as a controlled null under inventor-protocol section 3, not
      as a failure of the battery.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The uniform distribution on multiaffine block-supported coefficient
        vectors (arms N2, N3) and the uniform distribution on
        F_{2^n}-coefficient vectors of S_3's multidegree (arm N4) are the
        right "random similar systems" for this comparison: a system drawn
        from them behaves, with respect to degree-D Macaulay rank, like a
        uniformly random member of the structural class it represents, with
        the across-seed standard deviation of deficit(D) below 10 percent of
        its mean at every tested cell.
      rigorous_support: >-
        The rigorous ingredient is that all five arms are EXACT ranks on
        explicitly constructed matrices - there is no estimation error, only
        sampling error over the coefficient draw. The classical statement
        imitated is the standard genericity picture for determinantal loci:
        the rank of a matrix whose entries are polynomial in the coefficients
        takes its maximum on a Zariski-open set, so a uniform draw attains the
        generic rank except on a proper closed subset, whose F_2-density is
        what the across-seed spread measures.
      validation_plan: >-
        SAMPLE - 5 seeds per random arm at every cell and 25 seeds at the
        single calibration cell (n = 12, D = 4). COMPARISON DISTRIBUTION - the
        empirical spread against the "generic rank with a rare degenerate
        stratum" picture: the modal deficit should account for most draws and
        the deviants should be identifiable as degenerate draws by an
        independent structural check (e.g. a vanishing descended component).
        TAIL CHECKS - (a) the extreme seed in each direction is reported
        individually with its coefficient vector archived; (b) the number of
        re-draws for degeneracy is reported per arm; (c) if any arm's spread
        exceeds 10 percent of its mean, the k-law fit for that arm is
        suppressed and reported as too noisy, rather than fitted anyway.
        SAMPLED PARAMETERS RECORDED - n, t, k, basis, target, arm, seed,
        coefficient vector digest, field-equation convention. TRANSFER
        ASSUMPTIONS - NONE; nothing above the tested ladder is claimed, and
        the 8k law itself is only measured over k = 3..6 here.
    - id: H2
      statement: >-
        The four named features (multiaffinity, presentation symmetry, Weil
        descent with field equations, summation coefficients) are close to
        ADDITIVE in their effect on deficit(D=4): the maximum discrepancy
        between forward-order and reverse-order increments is below 0.1 * 8k.
      rigorous_support: >-
        No theorem supports additivity and the record says so. The rigorous
        anchor is only the telescoping identity itself, which holds exactly
        for ANY order: sum_i Delta_i = deficit_{N5} - deficit_{N0}. What is
        heuristic is the attribution of an increment to a feature, and the
        reverse-order measurement is precisely the falsification route rather
        than a robustness check added afterwards.
      validation_plan: >-
        SAMPLE - both orders at the cheapest cell (n = 12, D = 4), 5 seeds
        each, and one intermediate order (a third permutation of the feature
        sequence) so the comparison is not two-point. COMPARISON - the three
        increment vectors against each other. TAIL CHECK - the single feature
        whose increment varies most across orders is named in the report and
        its attribution is withdrawn. TRANSFER - none; additivity measured at
        n = 12 is not assumed at n = 18, and the n = 18 attribution is
        reported as conditional on the n = 12 interaction measurement with
        that dependence stated.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. As a control battery: four extra
      arms per cell, each costing one full exact-rank pass equal in cost to the
      existing Semaev arm, so the per-cell cost multiplies by roughly
      (1 + 3*seeds) relative to the current two-arm practice - at n = 12 that
      is about 16 passes of 50.4 s, i.e. under 15 minutes, and at n = 15 about
      16 passes of 404.2 s, i.e. under 2 hours. The n = 18 ladder is the
      dominant cost at roughly 10.1x the n = 15 figure per pass.
    memory_exponent: >-
      Unchanged per arm from the archived instrument (0.74 GB at n = 12,
      2.64 GB at n = 15); arms are run sequentially so peak memory is the
      single-arm peak, not the sum. Pre-flight monomial counting aborts before
      allocation.
    best_known: >-
      For the QUESTION (is the departure from random a structural artifact):
      the best known control in this program is the T11 support-count-matched
      null (KN-FIND-006), and in the literature the comparison is usually
      against the dense semi-regular prediction with no null system built at
      all (KN-LIT-fa346d, KN-LIT-327949). No published work in this corpus
      constructs a Weil-descent-matched random null for these systems; that
      absence is what this record fills, and the claim that it is absent is
      scoped to this corpus plus the abstracts read, not to the literature at
      large. For the ECDLP: Pollard rho, unaffected.
    hidden_overhead: >-
      The phrase "only Delta_4 can move an exponent" hides a real assumption:
      it presumes the attacker cannot choose the descent, the block structure
      or the field equations. That is true for the Weil-descent attack as
      posed, and FALSE for an attacker free to choose a different presentation
      - Karabina's alternative chain topology (KN-LIT-327949) is exactly such
      a choice. So Delta_1..Delta_3 are non-exploitable ONLY relative to a
      fixed presentation, and a presentation-search record could legitimately
      target them. That is named here as forward guidance rather than buried.
    tradeoff_note: >-
      Not applicable - no algorithm is proposed. Arms are embarrassingly
      parallel across seeds and cells with no communication.

  dominated_by: >-
    CHECKED ROW BY ROW. As an ATTACK: n/a - none is mounted; rho (N^{1/2},
    O(1)), BSGS (N^{1/2}, N^{1/2}), van Oorschot-Wiener, multi-target
    sqrt(TN), S*T^2 = Omega~(N) preprocessing, and meet-in-the-middle index
    calculus all dominate on all three axes and none is affected. As a
    CONTROL: dominated by nothing in this corpus on the attribution axis (the
    T11 null is strictly weaker - it matches one feature of four - and is a
    rung of this tower rather than a competitor); dominated by a full F4
    solve on completeness, which is unavailable at these parameters.
    As a MEASUREMENT: it shares the observable with IDEA-20260916-4b7c1e and
    consumes that record's meter, so it is dominated by 4b7c1e on cost and
    dominates it on interpretability.
  sota_delta: >-
    Zero on every ECDLP cost axis. Quantified deltas against this program's
    prior state: (1) the corpus has exactly ONE null for this system and it
    matches one structural feature of four; this record specifies three more
    and the cost of each is one extra rank pass; (2) KN-FIND-006's 8*dim(V)
    is currently an unexplained measured law with a REFUTED mechanism
    hypothesis on record ("generator-level Frobenius" and "alpha-orbit
    invariance" both refuted there); this record does not explain it either
    but it bounds how much of it can possibly be curve-specific, to a
    pre-registered threshold; (3) it makes the slide's phrase "random similar
    systems" a definition with a sampler, which is the word the whole
    comparison turns on. Against the EXTERNAL state of the art: no delta is
    claimed - the finding that these systems beat the semi-regular prediction
    is already published (KN-LIT-7604, KN-LIT-7607) and this record is an
    attribution of an effect others discovered.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation MEDIUM: three new samplers plus their planted-structure
      validators, a shared frozen spec object with an automatic arm diff, and
      the N4 coefficient swap in the descent builder; the rank engine, the T11
      null and the controls already exist. Compute MEDIUM: roughly 16 rank
      passes per cell against the current 2, which is under 15 minutes at
      n = 12 and under 2 hours at n = 15 on the archived per-pass timings, with
      n = 18 dominating at about 10.1x the n = 15 per-pass cost. The n = 18,
      D = 5 cells are the expected NOT-MEASURED boundary and are budgeted as
      such.

  recommended_priority: high

  discriminated_from: >-
    KN-FIND-006 measures the deficit against ONE null and attributes it to
    Semaev structure; this record measures the same deficit against four nulls
    and attributes it to whichever feature the increments name, with a
    pre-registered threshold and an interaction control. IDEA-20260916-4b7c1e
    supplies the model-free observable and is a prerequisite, not a competitor.
    IDEA-20260830-cb8e46 shows that IDEAL-invariant observables of the
    prime-field membership encoding are degenerate; that record explicitly
    scopes itself out of the Boolean chained systems and out of
    generator-level quantities, which is exactly where this record lives.

