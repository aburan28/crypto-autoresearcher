idea:
  id: IDEA-20260916-9d2fa6
  question_id: RQ-DREG-bd6c86
  added: '2026-09-16'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE DESCENDED CHAINED SEMAEV SYSTEM IS BLOCK-MULTIAFFINE - DEGREE AT MOST
    ONE IN EACH OF THE t+(t-2) VARIABLE BLOCKS AND SUPPORTED ON EXACTLY THREE
    BLOCKS PER EQUATION - AND THE PROGRAM'S ONLY NULL DESTROYS THAT STRUCTURE
    BY CONSTRUCTION: a five-rung null tower, each rung adding one named
    structural feature, telescopes KN-FIND-006's 8*dim(V) deficit into an
    attribution budget in which only the last increment can possibly move an
    exponent
  class: control

  claim: >-
    (A) THE STRUCTURAL FACT THE NULL MUST MATCH, WHICH IS CHECKABLE AT ZERO
    COMPUTE. Over F_{2^n} with Y^2 + XY = X^3 + AX^2 + B one has
    S_3(x_1,x_2,x_3) = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B. In the
    chained presentation each equation involves exactly three field elements,
    each of which descends to its own block of F_2-coordinates (n coordinates
    for a free auxiliary u_j, k = dim V coordinates for a factor-base x_i).
    Every monomial of S_3 is a product of DISTINCT field elements, and
    squaring is F_2-linear on descended coordinates, so each descended
    component is MULTI-AFFINE: total degree at most 3, degree at most ONE in
    each block, and identically zero on every block the equation does not
    touch. CLAIM A is that this holds for every descended component of every
    chain equation, at every t and every k, and it is a two-line verification,
    not a measurement.
    (B) THE NULL CURRENTLY IN USE DOES NOT HAVE PROPERTY (A). The T11
    support-matched Boolean null "preserves the number of monomials at each
    Boolean degree while replacing those monomials by deterministic
    pseudorandom monomials" (experiments/EXP-DREG-001/implementation.md). A
    pseudorandom degree-3 Boolean monomial is, with overwhelming probability,
    NOT block-multiaffine and NOT confined to three blocks. So the T11 null
    differs from the Semaev system in at least four respects at once -
    multiaffinity, block support, S_m-type symmetry, and the Weil-descent /
    Frobenius origin of its coefficients - and KN-FIND-006's finding that the
    T11 null has deficit EXACTLY ZERO while the Semaev arm has 8k - 1 at
    D = 4 therefore attributes the entire deficit to "Semaev structure" when
    it may be attributable to multiaffinity alone.
    (C) THE TOWER. Measure the SAME observables (rank(M_D), the fall profile
    of IDEA-20260916-4b7c1e, and deficit against the semi-regular prediction)
    on five arms that differ by exactly one structural feature each:
      N0  dense semi-regular reference (the BFS prediction formula itself);
      N1  T11 support-count-matched random Boolean system (the existing null);
      N2  BLOCK-MULTIAFFINE RANDOM: same variable blocks, same block sizes,
          same per-equation block support pattern (3 blocks), same multidegree
          profile, uniformly random F_2 coefficients on that support;
      N3  N2 PLUS the presentation symmetry: coefficients drawn so the system
          is invariant under the automorphism group of the chain topology
          (for t = 3, the transposition x_1 <-> x_2), matching the Semaev
          system's own symmetry exactly;
      N4  WEIL-DESCENT-MATCHED RANDOM: the descent over F_2 of a RANDOM
          F_{2^n}-polynomial chain of the same shape - i.e. replace S_3 by a
          uniformly random polynomial of the same F_{2^n}-multidegree, then
          descend with the same basis and adjoin the same field equations.
          This arm shares multiaffinity, block support, symmetry, the
          Frobenius structure of the descent, and the field equations, and
          differs from the Semaev arm ONLY in the coefficients being random
          rather than the summation polynomial's;
      N5  the true Semaev arm.
    (D) THE ATTRIBUTION BUDGET, WHICH IS THE DELIVERABLE. Write
    Delta_i(D) := deficit_{N_{i+1}}(D) - deficit_{N_i}(D). Then
    deficit_{N5}(D) = sum_i Delta_i(D) telescopes, and each increment carries
    a NAME: Delta_1 = block multiaffinity, Delta_2 = presentation symmetry,
    Delta_3 = Weil descent plus field equations (Frobenius), Delta_4 = THE
    SUMMATION POLYNOMIAL ITSELF. CLAIM D is that only Delta_4 is
    exponent-relevant, because every other increment is a property the
    attacker cannot choose - it is forced by the descent, not by the curve -
    and a deficit that a random descended system of the same shape also has is
    a property of Weil descent, not of the ECDLP.
    (E) THE PRE-REGISTERED SPLIT. KN-FIND-006's cumulative deficit at D = 4 is
    8*dim(V), exact at k = 3..7. Either most of 8k appears already at N4 (the
    "slower than random" effect is a Weil-descent artifact and the slide's
    intuition is about descent, not about elliptic curves), or 8k survives to
    Delta_4 (the effect is summation-polynomial-specific and is the only part
    worth an exponent argument). The record commits to the threshold BEFORE
    the measurement: Delta_4(D=4) >= 0.5 * 8k at every k in 3..6 is the
    "genuinely Semaev" outcome; Delta_4(D=4) <= 0.1 * 8k at every k is the
    "descent artifact" outcome; anything between is reported as unresolved and
    the ladder is extended in k rather than the threshold moved.

  mechanism: >-
    OBJECT FRAME. Representation: the Weil-descended chained Semaev system in
    its natural BLOCK decomposition of the Boolean variables (R1 class -
    a field representation of the coordinates, with the block structure being
    exactly the F_2-coordinate blocks of the descent), addressing the relation
    decomposition stage. Operation set Sigma: the Macaulay/XL step set
    (multiply by a monomial under a degree cap, take F_2-linear combinations),
    together with the block-permutation action of the chain automorphism
    group. Trichotomy class: COORDINATE-DEPENDENT - the block decomposition is
    a property of the chosen F_2-basis and presentation, not of the group
    element, and this record exploits exactly that.
    LOSSY-PROJECTION TEST AGAINST THAT Sigma. The tracked object is the
    MULTIDEGREE SUPPORT PATTERN of the system: the map that sends each
    generator to the set of (block, block-degree) pairs occurring in it,
    forgetting all coefficients. This is genuinely lossy - infinitely many
    systems share one pattern, and from the pattern one cannot recover the
    curve, the target, B, or any solution. And the discard IS compatible with
    Sigma in the needed one-step sense: multiplying a generator by a monomial
    adds that monomial's block-degree vector to the generator's, so the
    support pattern of any Sigma-product is computable from the pattern alone,
    without the coefficients - the pattern propagates deterministically one
    step under multiplication (it is sub-additive rather than exactly additive
    under ADDITION, where cancellation can shrink it, and that asymmetry is
    precisely the thing the tower measures: N2-N4 have generic coefficients so
    no cancellation, N5 may cancel, and the cancellation IS the mechanism
    KN-FIND-006 exhibits at degree 3). The projection is therefore a real
    lossy object whose failure mode is informative, not a change of
    coordinates.
    WHY THIS IS THE DISCRIMINATING CONTROL AND NOT A BETTER-LOOKING BASELINE.
    A null object exists to answer "compared to what". The corpus's current
    answer - a support-count-matched random Boolean system - answers "compared
    to a system with the same number of monomials per degree". That is a
    weak null against a system whose defining feature is that its monomials
    are NOT arbitrary: they are products of one coordinate from each of three
    disjoint blocks. Against a weak null, every structured system looks
    special, which is why the inventor protocol section 3 requires the
    identical measurement against a null of the same SHAPE, not merely the
    same size. N4 is the strongest null the shape admits: it holds fixed
    everything an attacker cannot choose and varies only the one thing the
    elliptic curve supplies.
    WHY N4 IS CONSTRUCTIBLE AND CHEAP. Building N4 needs no new mathematics -
    it is the existing descent code with S_3's coefficient vector replaced by
    a random one of the same F_{2^n}-multidegree. The same basis, the same
    field equations, the same chain topology, the same k, the same target
    slot. That is a coefficient swap in the system builder, which is why this
    proposal costs what one extra arm costs and not what a new instrument
    costs.

