idea:
  id: IDEA-20260805-fc6361
  question_id: RQ-MLKEM-003
  added: '2026-08-05'
  title: >-
    Measure the one constant the campaign borrowed: an exhaustive
    saturation-ball census on ML-KEM-shaped q-ary module lattices at reduced
    dimensions, against the exactly forced value (4/3)^(d/2), with a
    Siegel-exact null and a graded planted-deficit control
  class: measurement_calibration

  claim: >-
    GOAL-MLKEM-003's completion criterion 1 asks for a memory-charged estimate
    "calibrated by measured sieve behaviour at reduced dimensions". Twelve
    batches produced no measurement of any lattice quantity at any dimension.
    The whole memory side of the campaign rests on ONE borrowed literal --
    log2 M = 0.2075 * n_sieve, i.e. a sieve list of size (4/3)^(n/2) -- which
    EV-MLKEM-020 itself records as BORROWED (the estimator's `lwe_primal` path
    "never calls `short_vectors`, so the instrument supplies NO memory figure
    for this attack at all"). That constant is not an estimator convention that
    has to be taken on trust. It is the count of lattice points in a ball, it
    has an EXACTLY forced value, and at dimensions d <= 32 it is directly
    countable by exhaustive enumeration in pure Python in minutes. This
    proposal is to count it: on ML-KEM-shaped q-ary MODULE lattices, on
    plain q-ary lattices with the same determinant and dimension, and on
    unstructured random lattices of the same determinant, against the forced
    value and against a graded planted-deficit control. The deliverable is the
    campaign's first measured number and the first honest error bar on the
    memory exponent it has been charging since BATCH-010.

  object_first_candidate:
    tracked_object: >-
      THE SATURATION-BALL POPULATION. For a lattice L of rank d, track the
      finite set
        S(L) = { v in L : 0 < ||v|| <= sqrt(4/3) * gh(L) },
      gh(L) = det(L)^(1/d) * Gamma(d/2 + 1)^(1/d) / sqrt(pi),
      followed as a function of d and of the lattice family, reduced to the
      single integer |S(L)| and its orbit decomposition under the lattice's own
      automorphisms. This is the object a sieve must hold in memory: the
      saturation condition IS the statement that S(L) is what the list
      converges to, so |S(L)| is the memory the campaign has been charging
      without ever looking at it.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal, because every one of
      them is what the previous twelve batches did and each arrived in new
      notation each time:
      (1) LATTICE-ESTIMATOR DIFFERENCING -- computing two estimator outputs and
          reporting their difference as a security statement. This is
          BATCH-001, -010, -011 and -012, and EV-MLKEM-af61e7's named
          obstruction is precisely that the difference of two estimator outputs
          cannot answer the question.
      (2) DUAL-VS-PRIMAL RECONCILIATION and any `dual_hybrid` / `matzov`
          callable comparison (H-MLKEM-014, EV-MLKEM-015/020/021).
      (3) CARRIER CodedDualAttack Pwrong/Pgood ADJUDICATION and anything
          downstream of Fig 4.1 or Theorem 4.1 (H-MLKEM-010..013).
      (4) MEMORY CHARGING BY CONVENTION -- the T * M^c family with c swept as a
          free parameter (EV-MLKEM-020 Model A / Model B). This proposal does
          not sweep c; it measures the M that c multiplies.
      (5) IMPLEMENTATION CONFORMANCE (GOAL-MLKEM-001 / -002 own that flank).
    newness_score: >-
      The object is elementary and certainly not new to the lattice literature:
      counting lattice points in a ball is the oldest question in the subject,
      and G6K's saturation radius of 4/3 in squared norm is a design constant of
      a deployed sieve (RECALLED, UNVERIFIED -- no G6K source was read for this
      record). What is new IS NOT THE OBJECT BUT ITS ABSENCE FROM THIS CAMPAIGN:
      GOAL-MLKEM-003 has charged 2^(0.2075*n) as memory across three batches and
      three evidence records without a single measurement, and its own
      completion criterion names measurement as the missing half. The novelty
      claimed here is exactly that and nothing more.
    testability_score: >-
      Very high and cheap. The forced value is exact; the measurement is a
      depth-first enumeration over a reduced basis; the environment was checked
      THIS SESSION (numpy 2.4.6 present; `sage` and `fpylll` both absent,
      ModuleNotFoundError) so no solver dependency is assumed. The expected
      populations are tiny: (4/3)^(d/2) = 9.99 / 31.57 / 99.77 at d = 16 / 24 /
      32. The cost is the enumeration tree, not the output.
    survival_score: >-
      The object survives the whole of BKZ, because a sieve's list IS this set
      for its local projected block; that is the point. Where it dissolves is
      the extrapolation from d <= 32 to the campaign's n_peak ~ 426 / 634 / 872
      (derived below), a factor of 13 to 27 in dimension. That extrapolation is
      the weakest joint in the proposal and is carried as a numbered heuristic
      with its own falsification condition, not smuggled into a conclusion.

  mechanism: >-
    DERIVED IN THIS RECORD. Every numeric value below is either an exact closed
    form or arithmetic on numbers already committed in EV-MLKEM-020; nothing is
    a new measurement and nothing is relayed from an unread source without a
    label.

    STEP 1 -- THE FORCED VALUE IS EXACT, NOT HEURISTIC.
    Let L have rank d and covolume det(L). The Gaussian heuristic radius is
    defined by vol(B_d(gh(L))) = det(L), i.e.
      gh(L) = det(L)^(1/d) / V_d(1)^(1/d),  V_d(1) = pi^(d/2)/Gamma(d/2+1),
    so gh(L) = det(L)^(1/d) * Gamma(d/2+1)^(1/d) / sqrt(pi). Then for
    R = sqrt(4/3) * gh(L),
      vol(B_d(R)) / det(L) = (R / gh(L))^d = (4/3)^(d/2).
    Hence the predicted population of the saturation ball is EXACTLY
      E[|S(L)|] = (4/3)^(d/2) = 2^(0.20751874963942182 * d),
    and log2(sqrt(4/3)) = 0.20751874963942182 is the same constant EV-MLKEM-020
    records as agreeing with the estimator's 0.2075 literal at
    |delta| = 1.874964e-05. Numerically (4/3)^(d/2) = 5.6187 / 9.9887 / 17.7577
    / 31.5693 / 56.1232 / 99.7746 at d = 12 / 16 / 20 / 24 / 28 / 32.

    STEP 2 -- THE NULL ARM'S FORCED VALUE IS A THEOREM, NOT A HEURISTIC, AND
    THAT IS WHAT MAKES THE NULL ABLE TO FAIL.
    Siegel's mean value theorem states that for L drawn from the Haar
    probability measure on unimodular lattices of rank d and f integrable,
      E[ sum_{v in L, v != 0} f(v) ] = integral f.
    Taking f = indicator of B_d(R) gives E[|S(L)|] = vol(B_d(R)) = (4/3)^(d/2)
    after scaling to covolume 1 -- EXACTLY, with no o(1). Rogers' second-moment
    theorem gives, for d large, Var(|S|) approximately E[|S|] (a Poisson-like
    law) so the per-instance relative fluctuation is about 1/sqrt(E|S|), i.e.
    10.0% at d = 32 and 17.8% at d = 24. THESE TWO CLASSICAL RESULTS ARE
    RECALLED, NOT READ; their statements are recorded here as CANDIDATES TO
    CHECK and their verification is a declared stage of the experiment, not an
    assumption of it. What matters structurally is that the null's predicted
    value is derived from a measure-theoretic identity rather than fitted, so a
    null arm that misses it convicts the instrument.

    STEP 3 -- WHAT COULD MAKE THE ML-KEM LATTICE DIFFER, STATED AS MECHANISM
    RATHER THAN HOPE. Three candidate deviations, each with a sign:
    (a) q-ARY OBSTRUCTION. A q-ary lattice contains q*Z^d, so it is not
        Haar-random; it carries d vectors of norm exactly q. With
        det = q^(d/2) we get gh(L) = sqrt(q) * Gamma(d/2+1)^(1/d)/sqrt(pi), so
        R/q = sqrt(4/3)*Gamma(d/2+1)^(1/d)/(sqrt(pi*q)). At q = 3329, d = 32
        this is 1.1547 * 1.47128 / 57.70 = 0.0294, so the trivial q-vectors sit
        far outside the ball and cannot contaminate it. AT THE FIPS 203 SIEVE
        DIMENSIONS THE SIEVE RUNS ON PROJECTED SUBLATTICES WHERE THIS IS NOT
        AUTOMATIC, and that limit is recorded, not hidden.
    (b) MODULE AUTOMORPHISMS -- THE ONE STRUCTURAL EFFECT WITH A CLEAN FORCED
        VALUE. For R = Z[X]/(X^n + 1) the module lattice
        L(A) = {(x,y) in R^k x R^k : y = A x mod q}, embedded coefficientwise,
        is invariant under v -> X * v and v -> -v, both of which are ISOMETRIES
        of the coefficient embedding (X acts as the negacyclic shift, an
        orthogonal matrix). Hence S(L) is a union of orbits of size dividing
        2n, and generically |S(L)| is DIVISIBLE BY 2n. This is a free integrity
        check with an exactly forced value, and it is also the only place a
        real memory saving hides: a sieve on the UNPROJECTED module lattice can
        store one representative per orbit and regenerate the rest, cutting
        log2 M by exactly log2(2n) = 9.000000 bits at n = 256.
    (c) MODULE-VS-PLAIN q-ARY POPULATION DIFFERENCE. Whether |S| itself (not
        just its orbit structure) differs between the module arm and a plain
        q-ary arm of identical (d, det) is UNKNOWN TO THIS RECORD and is the
        substantive measurement. A difference is a structure-dependent
        correction to the memory exponent; no difference is a controlled null
        and is equally publishable.

    STEP 4 -- COST BOOKKEEPING, AND WHAT THE ANSWER WOULD BE WORTH.
    From EV-MLKEM-020's own committed figures -- free-memory margins
    2.800527 / 6.041285 / 1.276377 bits and c* (Model A, Z_q)
    0.03164649 / 0.04588645 / 0.00705473 -- and the identity c* = margin/log2 M
    that the same record establishes, the log2 M actually in use is
      log2 M = 88.4941 / 131.6573 / 180.9250 at Kyber-512 / 768 / 1024
    (DERIVED HERE by division from committed numbers; independently consistent
    with the primal peak memory 2^88.49 / 2^131.66 / 2^180.92 that BATCH-011
    reconstructed, per GOAL-MLKEM-003 batch_log). Dividing by 0.20751874963942182
    gives the effective peak sieve dimensions
      n_peak = 426.4 / 634.4 / 871.8,
    which are the dimensions the extrapolation must reach.
    CONSEQUENCE 1, the orbit saving: charging log2(2n) = 9 bits less memory
    raises c* to 0.035229 / 0.049253 / 0.007424, i.e. by +11.3% / +7.3% /
    +5.2%. THIS DOES NOT OVERTURN c* < 1/3 AND IS NOT OFFERED AS DOING SO.
    CONSEQUENCE 2, the honest ceiling on what a measurement can do here: for
    c* to reach 1/3 the memory exponent would have to fall to
      e = 3 * margin / n_peak = 0.019702 / 0.028567 / 0.004392,
    an order of magnitude below 0.2075. No plausible measured correction to the
    saturation-ball population reaches that, and RT-B3's own sweep of the
    exponent over [0.05, 0.40] already showed c* staying below 1/3 throughout.
    SO THIS PROPOSAL DOES NOT MOVE THE c* INEQUALITY AND SAYS SO IN ADVANCE.
    What it moves is the status of the number: from a literal lifted out of a
    function the attack never invokes, to a measured quantity with an error bar
    and a named extrapolation. That is what completion criterion 1 asks for and
    it is the half of it that twelve batches never attempted.

    STEP 5 -- WHY THE MEASUREMENT IS AFFORDABLE. The output is small
    (|S| ~ 100 at d = 32). The cost is the depth-first enumeration tree over a
    reduced basis, whose node count at radius sqrt(4/3)*gh with an
    LLL/small-block-BKZ-reduced basis is dominated by the middle levels and is
    empirically manageable to d ~ 32 in interpreted code. The ladder is graded
    and the contract stops on a node-count cap: a cell that exceeds the cap is
    reported as budget-exhausted infrastructure signal and NEVER as a
    measurement (AGENTS.md rule 5). The cheapest gate runs first and can end
    the whole line: if the enumerator does not reproduce the exact theta-series
    coefficient of Z^d, nothing else is looked at.

  novelty_status: unverified

  literature_context:
    - >-
      EV-MLKEM-020 (READ, in repo): records that `lwe_primal` "never calls
      `short_vectors`, so the instrument supplies NO memory figure for this
      attack at all", that the 0.2075 memory convention was borrowed from
      `lwe_dual.py:172` -- a different attack's code path -- and that the closed
      form log2(sqrt(4/3)) = 0.20751874963942182 agrees with the literal at
      |delta| = 1.874964e-05. This proposal exists because of that entry: the
      construction was judged defensible and the PROVENANCE was judged
      borrowed, and nothing since has replaced the provenance.
    - >-
      GOAL-MLKEM-003 completion criterion 1 and its own closure text
      (READ, in repo): "no measurement of sieve behaviour exists anywhere in
      this campaign"; "the calibration half of criterion 1 has still never been
      attempted by this campaign after eleven batches". The goal record states
      the gap this proposal targets in its own words.
    - >-
      Siegel's mean value theorem and Rogers' second moment theorem for random
      unimodular lattices. RECALLED, UNVERIFIED -- no source was retrieved for
      this record. The statements used are: E[#(L cap A \ {0})] = vol(A) under
      Haar measure at covolume 1, and Var approximately equal to the mean for
      large d. BOTH ARE CANDIDATES TO CHECK and Stage 0 of the experiment
      verifies them empirically against the measured null before either is used
      as a forced value.
    - >-
      G6K's saturation radius of 4/3 in squared norm, and the standard
      identification of the sieve list size with (4/3)^(d/2). RECALLED,
      UNVERIFIED -- NOT READ. Published G6K saturation measurements very
      probably exist and would partly pre-empt the calibration; the honest
      position is that this record did not retrieve them, which is a gap in the
      novelty screen and is recorded as one rather than papered over. ANGLE-BRIEF
      section 2 T-H measures why a corpus novelty screen cannot settle this:
      7,809 literature entries, 7,420 carrying a bulk-seed caveat, and 2,000 of
      2,000 sampled carrying `citation_verified: read` over a body that says the
      claims are relayed without verification.
    - >-
      KN-OPEN-017, as quoted in ANGLE-BRIEF section 3 F4/F5: "No source in this
      corpus computes the crossover under full cost." NOT READ in full for this
      record. Named to mark the boundary with GOAL-MLKEM-005, which owns the
      enumeration-vs-sieving crossover; THIS PROPOSAL DOES NOT ENTER THAT
      QUESTION and computes no crossover.

  lossy_projection_identifiability_audit:
    projection: >-
      Full lattice L (an infinite point set with a basis, a Gram matrix, and in
      the module arm a ring action) --> the single integer |S(L)| = the
      population of the saturation ball, plus its orbit-size histogram.
    what_is_discarded: >-
      Everything except one count and one small histogram: the basis, the
      coordinates of every retained vector, the directions, the Gram matrix,
      the secret, the matrix A, and the entire geometry outside the ball.
    why_genuinely_lossy: >-
      Massively lossy and provably so: the fibre over a given value of |S| is
      infinite-dimensional. Isospectral non-isometric lattices are the classical
      demonstration that even the FULL theta series -- of which |S| is one
      truncated coefficient -- does not determine the lattice (Milnor's
      16-dimensional pair, and the Conway-Sloane families). RECALLED,
      UNVERIFIED; recorded as a candidate to check, and the audit does not
      depend on it, because the fibre is already visibly infinite: any
      unimodular transformation of L preserves |S| exactly.
    why_compatible_with_the_operations: >-
      This is the part that makes the projection worth tracking rather than
      merely lossy. The retained quantity propagates deterministically through
      the operation that matters: a sieve's memory IS the retained list, and the
      saturation condition says the list converges to S(L) up to a poly factor.
      So the projection discards exactly what the cost model does not charge,
      and retains exactly what it does charge. Contrast the failure mode this
      program keeps hitting: a projection that retains something the cost model
      never touches.
    is_it_only_a_change_of_coordinates: >-
      NO, AND THE CHECK WAS RUN BOTH WAYS.
      (i) The (Delta, Pi) = (x xor y, x*y) failure -- nothing discarded, so
      nothing gained -- does not apply: |S| is a single integer summarising an
      infinite object, and L cannot be recovered from it.
      (ii) THE MIRROR FAILURE IS THE LIVE RISK AND IS WHERE THE CHECK BITES.
      A projection so lossy that it is constant across instances has zero
      comparator spread and is worthless. Here the derivation itself PREDICTS
      near-constancy: the forced value (4/3)^(d/2) depends only on d, so if the
      Gaussian heuristic is exact for every arm, the comparator spread across
      lattice families is ZERO and the statistic distinguishes nothing.
      THIS IS NOT A DEFECT OF THE PROPOSAL, IT IS ITS FIRST POSSIBLE RESULT, and
      the design is built so that outcome is reportable: a measured
      family-independent population at ratio 1.00 +/- (statistical error) is a
      CONTROLLED NULL that converts a borrowed literal into a measured constant
      with an error bar -- which is what criterion 1 asked for. The mirror
      failure is defused a second way by the ORBIT HISTOGRAM, which is provably
      NOT constant across families: it is forced to have all orbits of size 2n
      in the module arm and generically size 2 in the null arm. So at least one
      component of the observable has guaranteed nonzero spread, by derivation,
      before any run.
    which_failure_was_checked: >-
      Both. The change-of-coordinates failure is excluded by the infinite fibre;
      the constant-projection failure is checked, found to be a genuine
      possibility for the scalar component, pre-declared as a reportable
      controlled null rather than a disappointment, and excluded outright for
      the orbit component by the negacyclic isometry argument.

  assumptions:
    - >-
      That the sieve memory the campaign charges is the retained list, so that
      |S(L)| is the right thing to count. If instead the dominant memory is a
      bucketing / list-decoding data structure with its own overhead, the count
      is a LOWER BOUND on memory and the calibration bounds one term rather than
      the total. EV-MLKEM-020 records exactly this concern (its OBJ on the
      applicability of a bucketed list-decoding sieve with a different access
      pattern), and this proposal inherits it rather than resolving it.
    - >-
      That a saturation-ball census at d <= 32 says anything about d ~ 426. It
      is an extrapolation of 13x and it is carried as HEUR-SB-3 with an explicit
      falsification condition, never as a transfer.
    - >-
      That numpy 2.4.6 is present and Sage/fpylll are absent. VERIFIED BY THIS
      SESSION on this machine, resolving the ANGLE-BRIEF section 5.3 item 1
      environment disagreement in favour of "numpy yes, solvers no".

  proof_search_map_note: >-
    This proposal is a MEASUREMENT, not a proof-oriented claim, so the full
    `proof_search_map` lives on the paired hypothesis H-MLKEM-fef5ae, where the
    forced value is a theorem statement (Siegel) and therefore does carry
    baseline-reproduction, observation-collision, quantifier-order and
    method-ceiling obligations. It is filled there rather than duplicated here.

  predictions:
    - metric: >-
        rho_d(NULL) = |S(L)| / (4/3)^(d/2), mean over 20 independent random
        integer lattices of determinant q^(d/2), q = 3329, at each
        d in {12, 16, 20, 24, 28, 32}
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.000, derived before any run from Siegel's mean value
        theorem. Pre-registered acceptance band: the mean over 20 instances must
        lie within 3 standard errors of 1, where the standard error is
        1/sqrt(20 * (4/3)^(d/2)) under the Poisson-like Rogers variance, i.e.
        +/- 0.283 / 0.212 / 0.159 / 0.119 / 0.089 / 0.067 at
        d = 12 / 16 / 20 / 24 / 28 / 32. A miss at any d convicts the
        INSTRUMENT, not the lattice, and blocks every other reading.
    - metric: >-
        rho_d(MODULE) - rho_d(NULL): difference in saturation-ball population
        ratio between the ML-KEM-shaped module q-ary arm and the unstructured
        null arm, at matched d and matched determinant
      direction: different
      minimum_effect: >-
        NO FORCED VALUE IS AVAILABLE AND NONE IS INVENTED -- this is the
        substantive unknown. The pre-registered detection threshold is
        |difference| >= 0.15 at any two consecutive d with the same sign, which
        is above the 3-sigma statistical band at d >= 20 and is chosen before
        the run. Below threshold at every d is reported as a CONTROLLED NULL,
        stated as such, and IS the deliverable in that branch.
    - metric: >-
        Fitted slope s of log2(rho_d) against d, per arm, over the completed
        ladder
      direction: different
      minimum_effect: >-
        FORCED VALUE 0.000 bits per dimension for every arm if the Gaussian
        heuristic is exact. The reported quantity is the measured memory
        exponent 0.20751874963942182 + s with its confidence interval. A |s|
        below 0.002 bits/dim is reported as "0.2075 confirmed to +/- 0.002 over
        12 <= d <= 32", which at n_peak = 426.4 is +/- 0.85 bits of log2 M and
        +/- 1.0% on c*. Numbers stated in advance so the write-up cannot inflate
        them.
    - metric: >-
        Orbit-size divisibility in the module arm: |S(L)| mod 2n, over all
        module-arm instances
      direction: different
      minimum_effect: >-
        FORCED VALUE EXACTLY 0 for every instance, from the negacyclic isometry
        v -> X*v together with v -> -v. Any nonzero residue not explained by an
        exhibited short vector fixed by a power of X is an IMPLEMENTATION
        FAILURE and invalidates the module arm. This control costs nothing and
        cannot be satisfied by accident.
    - metric: >-
        Z^d instrument control: measured |S(Z^d)| against the exact coefficient
        sum of the theta series theta_3(z)^d over the same radius
      direction: different
      minimum_effect: >-
        EXACT EQUALITY, integer to integer, at every d in the ladder. Computed
        two independent ways (enumeration, and direct convolution of the
        one-dimensional counts). Any discrepancy halts the package before any
        arm is read.

  minimal_test:
    design: >-
      Five stages, ordered cheapest-first, each able to terminate the line.
      STAGE 0 (minutes, decisive): implement the enumerator and check it against
      Z^d via the exact theta-series count at d = 4..32. If it misses by one
      point anywhere, STOP -- no arm is read and the deliverable is an
      instrument-failure report.
      STAGE 1 (minutes, decisive): run the NULL arm alone and check the Siegel
      forced value 1.000 within the pre-registered band. This is simultaneously
      the empirical verification of the two RECALLED theorems and the
      instrument's sensitivity floor. Commit and hash the null arm's numbers
      BEFORE any other arm is generated.
      STAGE 2 (minutes): the graded planted-deficit control (below), which must
      show the instrument can detect a deviation it is told to detect.
      STAGE 3 (minutes to ~1 hour): plain q-ary arm and ML-KEM-shaped module arm
      at matched (d, det), with the orbit-divisibility check.
      STAGE 4 (zero compute): propagate the measured exponent and its interval
      through log2 M = e * n_peak at n_peak = 426.4 / 634.4 / 871.8 and report
      the resulting interval on c*, stating in the same sentence that the
      inequality c* < 1/3 is unaffected unless e falls below 0.0197 / 0.0286 /
      0.0044, which no measured value in this ladder can reach.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL).
        Twenty random integer lattices per d with determinant exactly q^(d/2),
        q = 3329, sampled in Hermite normal form from a declared seeded stream
        and then reduced by the same reduction as every other arm. FORCED VALUE
        rho = 1.000 with the stated 3-sigma band, from Siegel. It can fail in
        three distinct ways -- the theorem could be misremembered, the sampler
        could fail to equidistribute at fixed determinant, or the enumerator
        could be wrong -- and each failure mode has a different repair, which is
        why it is worth running before anything else.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR.
        L_t = diag(t, 1, ..., 1) applied to a null lattice and rescaled to the
        same determinant. Stretching one axis provably evacuates the ball: as t
        grows the population collapses onto the (d-1)-dimensional orthogonal
        sublattice and rho falls monotonically toward a value computable in
        closed form from the (d-1)-dimensional Gaussian heuristic. IF rho DOES
        NOT FALL HERE, THE INSTRUMENT IS BLIND AND NO NEGATIVE RESULT MAY BE
        REPORTED FROM ANY ARM.
      - >-
        GRADED CONTROL, 5 POINTS, MONOTONICITY REPORTED. The same construction
        at t in {1.0, 1.25, 1.5, 2.0, 4.0}: four interior points beyond the
        t = 1 identity. The report states the measured rho(t) sequence and
        whether it is monotone decreasing. This localises a failure -- an
        instrument that fires only at t = 4 has a sensitivity floor and the
        floor is then a measured number, not a guess. THE PARAMETER MEANT TO
        DESTROY THE SIGNAL IS t, AND THE QUANTITY MUST DECAY IN t; a quantity
        that fails to decay is the canonical artifact tell.
      - >-
        ORDERING CONTROL. The null arm and the graded control are generated,
        measured, written and hash-committed before the module arm's basis is
        constructed. The decision rule is executed on the null first; if it
        emits the same verdict on the null as on the treatment, it discriminates
        nothing and must be rewritten before the treatment is read.
      - >-
        ARCHIVE CHECK (zero compute). Every prior measurement of this observable
        in this program is to be listed. The expected answer, stated in advance,
        is NONE -- GOAL-MLKEM-003's own record says no sieve behaviour was ever
        measured -- and if a prior measurement is found, this proposal must be
        re-scoped against it rather than duplicating it.
    required_metrics:
      - per-arm, per-d population |S| for every instance, with seeds
      - rho_d per arm with mean, sample standard deviation, and standard error
      - orbit-size histogram for the module arm and the exact mod-2n residue
      - boundary-band counts: vectors with norm within 1e-6 relative of R
      - enumeration node counts and wall time per instance
      - the exact theta-series comparison table for Z^d
      - the Stage-4 propagated interval on log2 M and c*, with the sentence that it does not move c* < 1/3

  falsification_conditions:
    - >-
      Z^d control fails at any d. The enumerator is wrong; nothing is reported
      except the instrument failure.
    - >-
      The null arm misses the Siegel forced value outside the pre-registered
      band. Either the recalled theorem is wrong as used, or the sampler does
      not equidistribute; the proposal's premise that (4/3)^(d/2) is exactly
      forced is then FALSE and must be withdrawn. This is the single most
      informative failure available and it is cheap.
    - >-
      The graded control does not decay in t. The instrument cannot detect a
      deviation it was constructed to detect and no negative from any arm is
      admissible.
    - >-
      Module-arm |S| is not divisible by 2n without an exhibited fixed vector.
      The module construction is wrong.
    - >-
      The enumeration node cap is hit at d = 12 or 16. The measurement is not
      affordable in this environment at any useful dimension; that is
      infrastructure signal (AGENTS.md rule 5), never evidence about lattices,
      and the honest deliverable is a costed infrastructure request.

  confounders:
    - >-
      RADIUS SENSITIVITY, THE DOMINANT ONE. |S| ~ (R/gh)^d, so a relative error
      eps in R produces a relative error d*eps in the count: at d = 32 an eps of
      1e-3 is a 3.2% bias, comparable to the effect being hunted. Mitigation is
      contractual: gh is computed in 50-digit decimal arithmetic, the comparison
      is ||v||^2 (an exact integer) against a high-precision threshold, and the
      boundary band is counted and reported separately so the reader can see how
      many points sat near the cut.
    - >-
      REDUCTION QUALITY. The enumeration is exact and its RESULT is
      basis-independent, but its COST is not; a weakly reduced basis can blow the
      node budget and truncate the ladder. Cost truncation must never be read as
      a population result.
    - >-
      SMALL-d GEOMETRY. At d = 12 the Gaussian heuristic is known to be poor and
      Gamma(d/2+1)^(1/d) is far from its asymptote. Deviations at the bottom of
      the ladder are expected and are NOT evidence of structure; the slope fit is
      therefore also reported restricted to d >= 20.
    - >-
      TOY MODULE DEGREE. n in {2, 4, 8} is not 256. The negacyclic isometry
      argument is exact at any n, so the ORBIT result transfers as algebra; the
      POPULATION result does not, and is toy.
    - >-
      SELECTION OF q. q = 3329 is ML-KEM's modulus but at d <= 32 the lattice is
      dominated by q rather than by the module structure; a second modulus is
      therefore run as a robustness arm so that no conclusion rests on one q.

  interpretation_limits:
    - >-
      CLAIM TIER TOY, and no citation may raise it. A population census at
      d <= 32 is not a statement about FIPS 203. It calibrates a constant used
      at d ~ 426-872 and the extrapolation is the assumption, not the result.
    - >-
      This measures MEMORY, not time. Nothing here bears on the 0.292 sieve time
      exponent, on block sizes, or on any attack's running time.
    - >-
      It does not overturn, weaken, or corroborate EV-MLKEM-020's c* < 1/3
      inequality, and Step 4 derives in advance why it cannot.
    - >-
      NO STATUS CHANGE to any EV-MLKEM-*, KN-FIND-*, or KN-OPEN-* record is
      proposed or implied. Rule 12 remains unmet and unwaived and this proposal
      does not route around it.
    - >-
      A controlled null here -- the module arm indistinguishable from the
      unstructured arm -- would be a real and reportable result and must not be
      written up as a failure.

  heuristic_assumptions:
    - id: HEUR-SB-1
      statement: >-
        SATURATION IDENTIFICATION. For a sieve run to saturation on a rank-d
        lattice L, the peak retained list has size Theta(|S(L)|) up to a factor
        polynomial in d, where S(L) is the saturation ball population defined
        above. Formally: there exist constants and a polynomial p such that
        list_size / |S(L)| lies in [1/p(d), p(d)] for all admissible d.
      rigorous_support: >-
        One direction is unconditional: a list that saturates must contain the
        lattice points it claims to have found, so |S| is a LOWER BOUND on the
        peak list up to the retention policy. The other direction is the sieve
        design assumption and is NOT proved here. The polynomial factor is
        exactly what the campaign's cost model already suppresses.
      validation_plan: >-
        Not validated by this experiment and declared unvalidated. What the
        experiment supplies is the lower-bound side. Upgrading it needs a real
        sieve, which this environment does not have (fpylll absent, verified
        this session); that is a costed infrastructure request, not a result.
    - id: HEUR-SB-2
      statement: >-
        SIEGEL EXACTNESS AT FIXED DETERMINANT. Random integer lattices of rank d
        sampled uniformly from Hermite normal forms of determinant D
        equidistribute, as D -> infinity, toward the Haar measure on unimodular
        lattices after rescaling, so that E[|S|] = (4/3)^(d/2) holds for the
        sampler actually used and not only for the idealised Haar measure.
      rigorous_support: >-
        The equidistribution statement is RECALLED, UNVERIFIED. q^(d/2) = 3329^16
        at d = 32 is large, which is the reason to expect it to bite, not a
        proof that it does.
      validation_plan: >-
        Stage 1 IS this heuristic's validation: the null arm's measured mean
        against the forced 1.000 within the stated band. A miss refutes
        HEUR-SB-2 (or the enumerator) at zero additional cost and is reported as
        such, not absorbed.
    - id: HEUR-SB-3
      statement: >-
        DIMENSIONAL TRANSFER. The measured ratio rho_d, and in particular its
        slope in d, continues to hold at the campaign's peak sieve dimensions
        n_peak = 426.4 / 634.4 / 871.8, so that log2 M = (0.20751874963942182 +
        s) * n_peak with s the slope measured over 12 <= d <= 32.
      rigorous_support: >-
        NONE. This is a 13x to 27x extrapolation in dimension and it is the
        weakest link in the proposal. It is stated as a numbered heuristic
        precisely so that a reader can reject the extrapolation while keeping the
        measurement, which remains valid on its own terms at d <= 32.
      validation_plan: >-
        Partially testable within the ladder: if s is statistically
        indistinguishable from 0 across six values of d spanning a factor of
        2.7 in dimension, that is weak support for constancy; if s is nonzero
        and d-dependent, the extrapolation is refuted by its own data and the
        report says the exponent is not constant over the measured range. Full
        validation needs dimensions this environment cannot reach and is
        declared out of scope.

  target_complexity:
    time_exponent: >-
      n/a for this audit. No attack, no time exponent, no speedup. The proposal
      is a calibration of a cost-model input and it says so.
    memory_exponent: >-
      THIS IS THE EXPONENT UNDER AUDIT: 0.20751874963942182 bits per sieve
      dimension, the coefficient in log2 M = e * n. The deliverable is a measured
      interval on e over 12 <= d <= 32 with the extrapolation to n_peak stated as
      HEUR-SB-3. The honest expectation, stated before the run, is that e is
      CONFIRMED rather than moved: the forced value is exact under a theorem, so
      the most likely outcome is |s| < 0.002, which is a confirmation with an
      error bar and not an exponent movement. IT IS STILL WORTH RUNNING, for
      three reasons stated plainly: the campaign's own completion criterion names
      this measurement and nothing else supplies it; the constant is currently
      borrowed from a code path the attack never invokes, so a confirmation is a
      change of epistemic status for three evidence records; and the orbit
      component (exactly 9.000000 bits at n = 256) is a real structure-dependent
      correction that nobody in this campaign has charged.
    best_known: >-
      The incumbent value of the same quantity is the Gaussian-heuristic /
      kissing-number figure 2^(0.2075 n) itself, as used by the lattice
      estimator's dual path and borrowed by BATCH-010. There is no competing
      value in this corpus.
    hidden_overhead: >-
      The poly(d) factor in HEUR-SB-1, the bucketing/list-decoding data
      structure overhead EV-MLKEM-020 flags, and the projection effect: BKZ
      sieves on projected sublattices, which do not inherit the module
      automorphism, so the 9-bit orbit saving applies to a sieve on the
      unprojected module lattice and NOT automatically to the attack as costed.
      This limitation is load-bearing and is stated wherever the 9 bits appear.
    tradeoff_note: >-
      Charging less memory can only raise c* (T*M^c is monotone in M for c >= 0),
      so every correction this proposal could produce moves the campaign's
      headline in the SAME direction as the campaign's own conclusion. That is a
      reason for suspicion, not comfort, and the ordering control exists to keep
      the null arm from being read after the direction is known.

  dominated_by: >-
    n/a (no attack and no cost improvement claimed). Rows actually checked
    before writing this, and what each was checked for:
    TIME axis -- no time claim is made, so no row on the time frontier can
    dominate; the campaign's own primal_bdd and matzov cost figures
    (EV-MLKEM-015, -020, -021) are untouched by this proposal.
    MEMORY axis -- the incumbent is the borrowed 2^(0.2075 n) itself, which this
    proposal does not beat but measures; there is no competing memory model in
    the corpus, and EV-MLKEM-020 records that `lwe_primal` supplies none.
    DATA / QUERIES axis -- not applicable: the measurement consumes no LWE
    samples, no oracle queries and no preprocessing.
    Corpus rows checked for a prior measurement of the same observable:
    EV-MLKEM-011 through EV-MLKEM-021 and the six 6-hex EV-MLKEM records listed
    in this goal's brief, GOAL-MLKEM-003's batch_log (all twelve rows),
    KN-OPEN-016 and KN-OPEN-017 as summarised in the ANGLE-BRIEF. NONE contains
    a lattice-point census at any dimension. External rows NOT checked and
    declared unchecked: published G6K saturation measurements, which very
    probably contain a version of this calibration and which this record did not
    retrieve. That gap is the honest reason `dominated_by` is stated as "n/a"
    for the internal frontier and "unchecked" for the external one, rather than
    as a bare null.
  sota_delta: >-
    Against the state of this campaign, quantitatively: the memory exponent goes
    from a borrowed literal with zero measurements behind it to a measured
    interval, target width +/- 0.002 bits per dimension, which at
    n_peak = 426.4 / 634.4 / 871.8 is +/- 0.85 / 1.27 / 1.74 bits of log2 M and
    about +/- 1.0% on c*. The separately derived orbit correction is exactly
    9.000000 bits of log2 M at n = 256, worth +11.3% / +7.3% / +5.2% on c*
    (0.03164649 -> 0.035229, 0.04588645 -> 0.049253, 0.00705473 -> 0.007424),
    subject to the projection limitation above. Against the external state of
    the art: NO CLAIMED DELTA. Counting lattice points in a ball is not new
    mathematics and this record does not pretend it is.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.75 that the experiment returns a usable calibration -- i.e. Stage 0 and
    Stage 1 both pass and the ladder reaches d >= 24. It is not higher because
    the enumeration cost in interpreted Python is the one quantity in this
    proposal that has not been derived, only argued; because the recalled Siegel
    and Rogers statements are unverified and the whole forced-value structure
    rests on them; and because ANGLE-BRIEF section 5.3 records this program's
    own environment claims contradicting each other, which is a warning about
    costing anything from memory. It is not lower because the output is tiny,
    the arithmetic is exact integer arithmetic, the instrument has an exact
    self-check against Z^d that costs seconds, and the environment was verified
    in this session rather than assumed.
    SEPARATELY: 0.20 that the module arm differs measurably from the
    unstructured arm in POPULATION. Low because the forced value depends only on
    d and Siegel's identity does not care about structure; not lower because
    q-ary lattices are not Haar-random by construction and nobody has looked.
    The proposal is worth running at 0.20 because the 0.80 branch is a
    controlled null that still discharges completion criterion 1's measured half.
