  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: information-set decoding; square-code and
      syzygy distinguisher construction; support-splitting signatures;
      side-channel and fault attacks. The lens used is inversion of a known map
      on a multiplier, which is interpolation, not an attack family.
    tracked_object: >-
      The multiplier as a RATIONAL FUNCTION on the field, R = N_0/g^2 in
      F_{2^m}(X), carried as the pair of coefficient vectors plus the degree
      pair (s, 2t). What is followed through the computation is the function,
      not the vector of its values at the support.
    lossiness: >-
      Genuinely lossy in exactly the direction the target scrambles. The
      projection from a full key to R discards WHICH points of F_{2^m} are in
      the support and IN WHAT ORDER -- that is, the entire permutation and the
      support set, which is the bulk of the secret and is precisely what the
      public-key scrambling randomises. R has s + 2t + 2 coefficients where the
      key has n support values plus t polynomial coefficients. The retained part
      propagates deterministically because a coordinate permutation does not
      change R at all (R is a function on the field, indifferent to how the
      support is listed), and an affine support change x -> ax + b acts on R by
      substitution, which is a deterministic map on coefficient vectors.
      NOT a change of coordinates: the support cannot be read off R. What is
      striking, and is the reason this proposal exists, is that the discarded
      support points of S come BACK as the roots of the numerator -- the
      projection forgets the support but not the punctured-out part of it, which
      is an asymmetry worth having on the record.
    propagation: >-
      One step of the target operation is one more puncture at x_j, which maps
      R to (X - x_j) R, i.e. degree pair (s, 2t) to (s + 1, 2t) with the
      denominator untouched. The denominator is invariant along the entire
      chain, which is exactly why the lift recovers g regardless of how deep the
      chain went, and it is the single structural fact this proposal rests on.
    survival_score: >-
      The object survives while the counting condition n - s > s + 2t holds,
      i.e. while s < (n - 2t)/2. At Classic McEliece parameters that is
      s < 3216 for mceliece6688128 against a required s of 139, a margin of 23x.
      At toy scale m = 6, t = 4, n = 64 it is s < 28 against a required s of 5.
      The object dissolves when the numerator degree approaches half the
      remaining length, which no chain in this program's scope approaches.

  null_object_control: >-
    Three, and the first is decisive. (1) RANDOM-MULTIPLIER ARM: run the
    identical lift on the puncture-derived code of a random degree-2t alternant
    code with uniform multiplier. There is no rational-function shape to find,
    so the system must be inconsistent or return a D that is not a perfect
    square. A lift that 'succeeds' there is fitting noise and refutes the design
    at zero cost. (2) WRONG-DEGREE ARM: run the lift with declared degrees far
    from the truth and confirm the kernel dimension behaves as the counting
    argument predicts, so that a success at the true degrees is not an artifact
    of an over-parameterised system. (3) SCRAMBLED-SUPPORT ARM: permute the
    derived support labels without permuting the multiplier values, breaking the
    pairing while preserving both multisets; the lift must fail. This is the
    control that distinguishes 'the pairing carries the structure' from 'the
    value distribution carries the structure'.

  discriminated_from:
    - >-
      IDEA-20260829-afa314. That record produces the derived code and measures
      whether the family escape is real; this one assumes a derived structure is
      already recovered and asks what it is worth. They can fail independently:
      the escape can be real and the lift ambiguous, or the lift exact and the
      escape blocked by a residual anomaly.
    - >-
      IDEA-20260816-2b2ccd, on RQ-MCE-b38a8b. That counts the fibre of secret
      parametrisations over a public code. This inverts one specific map and
      needs the equivalence group only as a measured ambiguity in stage 3.
      Filed against a different question and consuming, not duplicating, that
      one's output.
    - >-
      IDEA-20260805-f58517. Complexity-ceiling transfer for the structural
      assumption via AM-intersect-coAM. A different route to a different kind of
      statement, with no shared machinery.
    - >-
      The paper's ingredient (ii) as fetched, a Groebner basis approach that
      recovers the structure of a degree-3 alternant code. That is the ORACLE
      this record assumes; this record is about what happens after the oracle
      returns, which the abstract does not describe.

  assumptions:
    - >-
      An oracle returning the derived code's support and multiplier exists. It
      is ASSUMED, not built, and this record makes no claim that any published
      method provides it for a Goppa-derived code.
    - >-
      The doubling identity, so that the denominator is g^2 and the Frobenius
      square root applies. Inherited from IDEA-20260805-9704d9 HEUR-SD-2 and
      IDEA-20260829-afa314 HA-1; if g is used at degree t rather than 2t the
      denominator is g and the square-root self-check disappears, which weakens
      but does not void the lift.
    - >-
      The chain's effect on the multiplier is multiplication by a polynomial of
      known degree. True by construction for puncturing; NOT asserted for the
      shortening-plus-Schur chain of arXiv:2304.14757, whose body is unfetched.
    - >-
      The derived support is a subset of the original support, not a
      transformed one. True for puncturing; an operation that moves the support
      would change the interpolation nodes and is out of scope here.

  proof_search_map:
    baseline_reproduction: >-
      The exact bottleneck being attacked is the INVERSE of the filtration, and
      the baseline is that no bound on it exists in this corpus at all. The
      reproduction target is therefore symbolic and internal: on the frozen toy
      fixture, verify that the lift reconstructs (L, g) exactly from the true
      derived structure at 100 percent of instances, with the kernel dimension
      exactly 1. A lift that works at 99 percent is not a polynomial-time
      reduction and must be reported as a failure of the uniqueness argument,
      not as a good result.
    observation_collision: >-
      The observable is the rational function R = N/D recovered from the
      evaluations. THE COLLISION TO HUNT is a distinct pair (L', g') generating
      the same derived evaluations, i.e. two different secrets with the same R
      on the same nodes. The uniqueness argument forbids it when the node count
      exceeds s + 2t, so the collision search is run in the regime where the
      count is DELIBERATELY reduced below that threshold, to confirm that
      collisions appear exactly where the argument stops protecting and not
      before. A collision inside the protected regime falsifies the argument
      directly. The second collision axis is the equivalence group: two
      oracle outputs differing by a group element produce two R's, and whether
      they yield the same (L, g) up to equivalence is stage 3's measurement.
    quantifier_order: >-
      For all m, for all squarefree g of degree t with no root in L, for all S
      with |S| = s and n - s > s + 2t, THERE EXISTS a unique-up-to-scalar
      (N, D) solving the system, AND for every such solution D is a scalar
      multiple of g^2. The witness depends on S and on the instance, which is
      allowed since both are available to whoever ran the chain. The quantifier
      that must NOT slip is the one on the oracle: the claim is conditional on
      the oracle's output for THIS instance, and no uniformity over instances is
      claimed for the oracle itself.
    method_ceiling_and_nearby_object_control: >-
      CEILING. Under ideal tuning this method proves only that the inverse of a
      multiplier-multiplying chain is polynomial. It cannot prove the forward
      chain exists, cannot prove any structure recovery is feasible, and cannot
      say anything about codes whose derivation moves the support rather than
      restricting it.
      NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL. The random-multiplier
      alternant code: it has no g, so its derived multiplier is not a rational
      function of bounded degree, and the lift must fail there. A lift that
      cannot distinguish that pair has identified nothing, which is why null
      control (1) is decisive rather than decorative.

  predictions:
    - metric: Projective dimension of the solution space of the interpolation system at the true declared degrees
      direction: different
      minimum_effect: EXACTLY 0, i.e. kernel dimension exactly 1, at 100 percent of toy instances. Zero tolerance.
    - metric: Fraction of toy instances at which the recovered D is a perfect square in F_{2^m}[X] and its Frobenius square root equals g up to a scalar
      direction: higher
      minimum_effect: 1.00, at at least 60 instances across m in {4,5,6}.
    - metric: Fraction of toy instances at which the roots of the recovered N are exactly the punctured-out support set S
      direction: higher
      minimum_effect: 1.00, with the recovered set compared to S as an unordered set of field elements.
    - metric: Fraction of RANDOM-MULTIPLIER null instances at which the lift returns a consistent system with a perfect-square D
      direction: lower
      minimum_effect: EXACTLY 0.00. Any success on the null arm refutes the design.
    - metric: Fitted exponent of exact field-operation count against (s + 2t)
      direction: different
      minimum_effect: 3.0 plus or minus 0.3 for textbook elimination; a fitted exponent above 3.5 indicates the implementation, not the method.
    - metric: >-
        Fraction of equivalence-group elements (stage 3) under which the lift
        still returns a perfect-square D
      direction: higher
      minimum_effect: >-
        No value is pre-committed for the projective part of the group, because
        this program has not verified what that group is. The pre-registered
        content is that the AFFINE subgroup must give 1.00, and that the
        measured fraction for the full enumerated stabiliser at m = 4 is the
        deliverable. A fraction below 1.00 localises a new obstruction in the
        lift and is the valuable negative.

  minimal_test:
    design: >-
      One cell, one afternoon, pure Python. Take m = 6, t = 4, n = 64 and s = 5.
      Build 20 Goppa keys from the certified fixture. For each, choose a random
      S of size 5, form the true derived support x' = L minus S and the true
      derived multiplier y'_i = h_S(x_i)/g(x_i)^2, and solve the 59-equation,
      14-unknown system over F_{2^6} by exact elimination. Three numbers decide
      everything and all three are integers or exact set comparisons: the kernel
      dimension must be 1; the recovered D must be a perfect square whose root
      is g up to scalar; the roots of the recovered N must be exactly S. In the
      same invocation run the random-multiplier null arm and confirm all three
      fail there. THE DISCRIMINATION IS THAT AN INTERPOLATION EITHER INVERTS THE
      MAP OR IT DOES NOT -- there is no intermediate outcome to argue about, and
      the null arm proves the success is not an artifact of an
      over-parameterised system. Only if this passes does stage 3, the
      equivalence enumeration at m = 4, run.
    controls:
      - Random-multiplier arm, same invocation, must fail on all three checks.
      - Wrong-declared-degree grid, kernel dimension compared against the counting prediction.
      - Scrambled-support arm, pairing broken with both multisets preserved, must fail.
      - >-
        Node-starvation arm: deliberately reduce the number of evaluation points
        below s + 2t + 1 and confirm collisions appear there, so that the
        uniqueness argument is shown to be tight rather than merely satisfied.
      - >-
        Ordering control: null arms computed, hashed and committed before the
        Goppa arm is examined.
    required_metrics:
      - kernel dimension per instance, all arms
      - perfect-square test outcome and recovered g versus true g, per instance
      - recovered root set versus S, as an exact set comparison, per instance
      - exact field-operation count per instance with the fitted exponent
      - kernel dimension as a function of declared (deg N, deg D) over the grid
      - stage 3 table of equivalence-group elements and lift outcomes at m = 4

  falsification_conditions:
    - Kernel dimension greater than 1 at any instance in the protected regime; the uniqueness argument is wrong and a new obstruction sits in the lift.
    - The recovered D is not a perfect square at any instance; the degree-2t presentation or the derivation is wrong.
    - The roots of N do not reproduce S; the multiplier propagation rule is wrong and IDEA-20260829-afa314's mechanism is also implicated.
    - The random-multiplier null arm produces a consistent system with a perfect-square D; the lift recovers nothing and the design is refuted by its own control.
    - >-
      Stage 3 shows that the equivalence group's action destroys the
      rational-function shape for a nontrivial fraction of elements. The lift is
      then conditional on an oracle that returns a canonical representative,
      which no method is known to do, and that conditionality must be stated in
      every downstream artifact.
    - >-
      A literature check finds the inversion already published, in which case
      the novelty claim is withdrawn in a superseding record and the deliverable
      reduces to a corpus entry recording where it was found. This is a likely
      outcome and is written in as such.

  confounders:
    - >-
      ORACLE CHEAT. Stage 1 hands the lift the true derived structure. That is a
      soundness-losing cheat under validation-ladder step 3 and it is delegated
      to stage 3; a write-up that reported stage 1 alone as 'the lift works'
      would be claiming the oracle.
    - >-
      SCALAR AMBIGUITY. (N, D) is determined only up to a scalar, and over
      F_{2^m} every element is a square, so the scalar never obstructs the
      square-root step. This is a convenience of characteristic 2 and does not
      generalise; a write-up must not present it as a general fact.
    - >-
      DEGREE KNOWLEDGE. The lift needs deg D = 2t, which an adversary knows only
      because Classic McEliece publishes t. In a setting where t is secret the
      grid search of stage 2 is the honest cost and must be reported.
    - >-
      TOY NODE COUNTS. At m = 4 the node count barely exceeds s + 2t and the
      uniqueness margin is thin, so failures there may be counting artifacts
      rather than structural. Cells are reported with their margin.
    - >-
      INHERITED DEPENDENCY on the certified fixture and on the doubling
      identity; a bug in either produces a lift that appears to fail for reasons
      that have nothing to do with this record.

  interpretation_limits:
    - >-
      TOY claim tier, unchanged. This is a reduction between two problems, not
      an attack, and the harder of the two problems is assumed away by an oracle.
    - >-
      Any deliverable citing the Goppa exclusion must carry all four
      qualifications of RQ-MCE-f8fca0's completed_constraint with Q-2 and Q-4
      quoted. In particular, showing that the lift is polynomial says NOTHING
      about whether the filtration falls, and reading it as evidence that Goppa
      codes are threatened would be the alarm-side error that record names as
      symmetric with dismissal.
    - >-
      The claim that 'the filtration is the only gate' is scoped to the
      PUNCTURING chain of IDEA-20260829-afa314. For the shortening-plus-Schur
      chain of arXiv:2304.14757 the multiplier relation is unfetched and the
      statement is not made.
    - >-
      A successful lift at m <= 6 is an exactness check on an algebraic
      derivation, which does transfer, together with an operation-count fit,
      which is measured only over a tiny range and is not an asymptotic.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For all m >= 3, all squarefree g of degree t with no root in L, all
        S contained in L with |S| = s, and all evaluation sets of size
        greater than s + 2t, the system y'_i D(x_i) = N(x_i) with
        deg N <= s and deg D <= 2t has solution space of projective dimension 0,
        and every solution satisfies D = lambda g^2 and N = lambda h_S.
      rigorous_support: >-
        NOT A HEURISTIC AT ALL and it is recorded here only because the record
        must not hide a load-bearing statement. RIGOROUS: N D' - N' D has degree
        at most s + 2t and vanishes at more than s + 2t points, hence is zero.
        The classical statement imitated is Cauchy interpolation / the uniqueness
        of Pade approximants over a field, RECALLED with no theorem number
        asserted. It is listed so the experiment is obliged to verify it rather
        than assume it.
      validation_plan: >-
        Measured as the kernel dimension at at least 60 toy instances across
        m in {4,5,6}, plus the node-starvation arm which reduces the node count
        below the threshold and confirms collisions appear exactly there. Cost
        of being wrong: seconds. Sampled parameters recorded per instance.
    - id: HA-2
      statement: >-
        The stabiliser of a derived alternant code inside the group of
        transformations (x, y) -> (sigma(x), lambda(x) y) is generated by
        support-affine maps x -> ax + b with a nonzero and by multiplier
        scaling, for the parameters tested.
      rigorous_support: >-
        RECALLED AND EXPLICITLY UNVERIFIED. The alternant equivalence group is
        usually stated projectively, x -> (ax + b)/(cx + d) with a compensating
        multiplier factor; if the projective part is present the substitution
        does not preserve polynomial degrees in the naive way and the lift needs
        an extra normalisation step. NO AUTHOR, YEAR OR THEOREM IS ASSERTED. The
        classical object imitated is the automorphism group of a GRS code.
      validation_plan: >-
        Exhaustive enumeration of the stabiliser at m = 4, where the group is
        small enough to enumerate, and seeded sampling at m in {5,6}. For each
        element, apply it, re-run the lift, and record the outcome. The
        deliverable is a table, not a verdict. Tail check: any element under
        which the lift fails is reported individually with its parameters, since
        a structured failing subgroup is a finding.
    - id: HA-3
      statement: >-
        The derived multiplier of ANY degree-reduction chain used against
        alternant codes is a rational function of the original multiplier with
        polynomially bounded degrees.
      rigorous_support: >-
        TRUE BY CONSTRUCTION for puncturing and PROVED NOWHERE ELSE. For the
        shortening-plus-Schur chain the fetched abstract says only 'with a
        multiplier and support related to those of the original alternant code',
        which is not enough to assert the shape. This is the assumption that
        would carry the cascade beyond puncturing and it is the least supported
        statement in the record.
      validation_plan: >-
        Not validatable without the body of arXiv:2304.14757. The route is
        named: transcribe the chain's multiplier update rule from the PDF at
        sha256 ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8
        and check whether it is of the assumed shape. Until then the cascade is
        claimed for the puncturing chain only.

  target_complexity:
    time_exponent: >-
      O((s + 2t)^3) field operations for the lift by textbook elimination,
      O((s + 2t)^omega) with fast linear algebra, plus one root-finding of a
      degree-s polynomial over F_{2^m} at O(s^2 log(s) m) operations. At
      mceliece6688128 with s = 139 and 2t = 256 that is about 2^25 field
      operations, i.e. seconds. The lift is not the bottleneck of anything and
      that is the entire point of the record.
    memory_exponent: >-
      O((s + 2t) n) field elements for the interpolation matrix, about 2^21
      field elements at mceliece6688128. No tradeoff arises.
    best_known: >-
      NO INCUMBENT IN THIS CORPUS. No record here states any bound, upper or
      lower, on inverting a derived-code structure recovery back to a Goppa key.
      Externally, iacr:2026/1232's abstract asserts that from the recovered
      algebraic structure 'an equivalent secret key can be efficiently derived',
      which if true means the inversion is already known to be easy in their
      setting and this record's contribution is an explicit, checkable
      construction rather than a new capability.
    hidden_overhead: >-
      Two, both stated. The oracle is the whole cost and is assumed away; any
      quoted total is meaningless without it. And the equivalence-group
      normalisation of HA-2 may add a search whose size this program has not
      measured -- if the projective part is present and must be searched, the
      honest cost gains a factor this record cannot yet name.
    tradeoff_note: >-
      None. The lift is a single dense solve with no search, so there is no
      time-memory frontier to sit on and no parallelisation question worth
      stating beyond the trivial one.

  dominated_by: >-
    DOMINATED. Frontier rows checked. TIME AND APPLICABILITY: iacr:2026/1232
    (KN-LIT-7c4620), abstract fetched 2026-08-29, claims full key recovery on
    binary Goppa directly, and its abstract states that deriving an equivalent
    secret key from the recovered structure is already efficient -- so on the
    axis this record occupies, the claimed state of the art already has an
    efficient lift and this record's construction is dominated as a capability.
    MEMORY: the lift uses O((s+2t)n) field elements, which is small, but a
    memory figure for a step that presupposes an oracle is not a frontier
    position. DATA/QUERIES: no query is made; the axis is empty. PREPROCESSING:
    none. WITHIN THIS REPOSITORY: nothing dominates, because nothing here
    addresses the inversion at all. The external domination is stated against a
    claim read from an abstract, not against a verified figure.
  sota_delta: >-
    No attack; reduction and measurement contribution. Quantitatively: before,
    this repository holds zero bounds on the inversion step and the cascade from
    a derived-code structure recovery to a Classic McEliece key is entirely
    unstated. After, the inversion is an explicit O((s + 2t)^3) field-operation
    procedure -- about 2^25 operations at mceliece6688128 -- with a rigorous
    uniqueness condition n - s > s + 2t that holds by a factor of 23 at those
    parameters, and with the recovered secret checked two independent ways
    (perfect-square denominator, roots of the numerator equal to the punctured
    set). Against the published state of the art the delta is plausibly zero and
    that is stated rather than hidden.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Exact F_{2^m} linear algebra plus polynomial root-finding, all pure
      Python; the medium implementation cost is the equivalence-group
      enumeration of stage 3, not the solve. Under 10^3 core-seconds for the
      whole grid. No network required except the optional literature check.
  recommended_priority: high
  honest_prior_of_survival: >-
    P(kernel dimension exactly 1 and the lift recovers g and S at 100 percent
    from the true derived structure) = 0.85; the argument is three lines and the
    residual risk is a construction bug or a degree-bookkeeping slip.
    P(the random-multiplier null arm fails as required) = 0.95. P(the affine
    subgroup leaves the lift intact) = 0.85. P(the full stabiliser leaves the
    lift intact) = 0.5, and that is the number carrying most of the risk.
    P(the inversion turns out to be already published, so that the novelty claim
    is withdrawn) = 0.6 -- deliberately high, because it is the natural next
    step for anyone who has the forward chain, and the record is written so that
    outcome still leaves a checkable artifact and a corpus entry behind.

