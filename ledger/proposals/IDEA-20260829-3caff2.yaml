idea:
  id: IDEA-20260829-3caff2
  question_id: RQ-MCE-e65b3c
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    The filtration is the only gate. Any degree-reduced alternant code derived
    from a binary Goppa code carries a multiplier that is a RATIONAL FUNCTION of
    the original one, so recovering the derived code's support and multiplier
    lifts back to the full secret (L, g) by Cauchy interpolation in O((s+2t)^3)
    field operations, with the missing support points falling out as the roots
    of the interpolated numerator -- making the lift provably polynomial and
    unique, and turning the phase-scoped Goppa exclusion into a statement about
    exactly one step.
  class: algorithm

  claim: >-
    (A) THE CASCADE, stated as a reduction rather than an attack. Let a derived
    code be obtained from Gamma(L,g) = Alt_{2t}(L, 1/g^2) by any chain of
    operations whose effect on the multiplier is
    y_derived,i = N_0(x_i) / g(x_i)^2 for a KNOWN-DEGREE polynomial N_0 of
    degree s, and whose effect on the support is restriction to L minus S.
    Puncturing gives exactly this with N_0 = h_S (IDEA-20260829-afa314); the
    fetched abstract of arXiv:2304.14757 states that ITS derived degree-3 code
    also has 'a multiplier and support related to those of the original
    alternant code', though the body is unfetched and the exact relation is NOT
    asserted here. Suppose an oracle returns the derived support x' and
    multiplier y' up to the alternant equivalence group. Then solving the LINEAR
    system y'_i D(x_i) = N(x_i) for i in L minus S, over the unknown coefficient
    vectors of N with deg N <= s and D with deg D <= 2t, recovers (N, D) uniquely
    up to a scalar whenever the number of evaluation points exceeds s + 2t.
    (B) THE TWO PAYOFFS OF THE LIFT, both exact and both checkable. D is a scalar
    multiple of g^2, so over F_2^m the Goppa polynomial is recovered coefficient
    -wise by the Frobenius square root: g_i = (D_{2i})^{2^{m-1}}, and D having
    any odd-degree coefficient is an immediate self-check failure. N is a scalar
    multiple of h_S, so THE PUNCTURED-OUT SUPPORT POINTS ARE THE ROOTS OF N --
    the s coordinates thrown away to escape the family come back for free, and
    the full secret (L, g) is reconstructed.
    (C) UNIQUENESS IS RIGOROUS, NOT HEURISTIC. If (N, D) and (N', D') both solve
    the system, then N D' - N' D vanishes at more than s + 2t points while having
    degree at most s + 2t, hence is identically zero, hence N/D = N'/D' as
    rational functions. At Classic McEliece parameters the system has roughly
    6550 equations in about 267 unknowns, so the margin is not marginal.
    (D) WHAT THIS MAKES OF THE CORRECTION RECORDS. RQ-MCE-f8fca0 Q-3 scopes the
    Goppa failure to the FILTRATION and records the authors' expectation that the
    Groebner phase remains polynomial. If (A) to (C) hold, then the INVERSE of
    the filtration -- getting from a recovered derived structure back to the real
    key -- is also polynomial and unconditional. That would leave the filtration
    as the sole non-polynomial step in the whole pipeline for Goppa codes, which
    is a sharp, checkable localisation of where the security actually sits.
    (E) NOT CLAIMED. No attack is constructed: the oracle in (A) is assumed, not
    built, and this record neither claims nor denies that any published method
    realises it for Goppa-derived codes. No security statement about Classic
    McEliece in either direction, no claim about condition (6), and no claim
    about what the body of arXiv:2304.14757 or iacr:2026/1232 contains.
    (F) THE NEGATIVE OUTCOME IS THE VALUABLE ONE IF IT HAPPENS. If the
    interpolation system's solution space has dimension greater than 1 at any
    instance -- for example because the equivalence group's action on (x', y')
    is larger than the affine group and destroys the rational-function shape --
    then a NEW obstruction has been located in the LIFT, a phase nobody in this
    corpus or in the fetched abstracts has claimed to be hard, and that is a
    first-class result under docs/inventor-protocol.md section 4.

  mechanism: >-
    STAGE 0, derivation, minutes, can kill it. Write out the interpolation
    system and the uniqueness argument of claim (C); check the counting
    condition n - s > s + 2t at all five Classic McEliece parameter sets with
    s = ceil(tm/(m-1)), where it holds by a factor of roughly 20.
    STAGE 1, the oracle-supplied lift at toy scale. Using the certified Goppa
    fixture, build Gamma(L,g), puncture at a random S of size s, and hand the
    lift routine the TRUE derived support and multiplier (x', y') -- this is a
    named soundness-losing cheat under the validation ladder step 3, and the
    lost soundness is delegated explicitly to stage 3's equivalence measurement.
    Solve the linear system by exact Gaussian elimination over F_{2^m}. Report
    the kernel dimension, which must be exactly 1 projectively, and then check
    D against g^2 and the roots of N against S.
    STAGE 2, the degrees are the whole design, so sweep them. Re-run the lift
    with DECLARED degree bounds (deg N, deg D) taken from a grid around the true
    (s, 2t), including under-declared and over-declared cases. An over-declared
    system has a larger kernel by a computable amount; an under-declared system
    is inconsistent. Report the kernel dimension as a function of the declared
    bounds, since an attacker who does not know t exactly must search this grid
    and the grid size is part of the honest cost.
    STAGE 3, the equivalence ambiguity, which is the real risk. The oracle
    realistically returns (x', y') only up to the alternant equivalence group.
    Measure, by exhaustive enumeration at m = 4 and by seeded sampling at
    m in {5,6}, the group of transformations (x, y) -> (sigma(x), lambda(x) y)
    that fix the derived code, apply each to the true (x', y'), re-run the lift,
    and record whether the recovered D is still a perfect square and whether the
    recovered roots of N still lie in the field. The affine case sigma(x) =
    ax + b is expected to be clean; the projective case is the one that can
    break the rational-function shape, and it is measured rather than assumed.
    STAGE 4, the negative control that makes the lift mean something. Run the
    identical lift on a derived code obtained from a RANDOM degree-2t alternant
    code with random multiplier. There is no g and no h_S, so the interpolation
    must FAIL -- either inconsistent or with a D that is not a perfect square.
    A lift that succeeds on the random arm is recovering nothing and the design
    is refuted by its own control.
    STAGE 5, cost. Count exact field operations as a function of (s, t, m) and
    fit the exponent; compare against the O((s + 2t)^3) prediction and report
    the constant.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Read RQ-MCE-e65b3c, RQ-MCE-3f7c02, RQ-MCE-f8fca0 in full; the prior-art
      list of all 14 proposals on this question; the full text of
      IDEA-20260805-9704d9, IDEA-20260808-b9a74c, IDEA-20260816-9c7e2d,
      IDEA-20260816-576d70; the titles and claim openings of the seven proposals
      on RQ-MCE-b38a8b and RQ-MCEQ-fcb504. Fetched the abstracts of
      arXiv:2304.14757 and iacr:2026/1232 on 2026-08-29.
    results: >-
      No record in this repository contains a rational-function interpolation,
      a Cauchy interpolation, or any lift from a derived code's structure back
      to (L, g). IDEA-20260816-2b2ccd counts the FIBRE of secret parametrisations
      over one public code by enumeration and Monte Carlo; that is a
      cardinality question about the trivial-equivalence quotient, filed against
      RQ-MCE-b38a8b, and this record is not filed against that question and does
      not count fibres -- it inverts a specific known map on the multiplier and
      needs the equivalence group only as an ambiguity to be measured (stage 3),
      where 2b2ccd's numbers would be a useful input rather than a duplicate.
      IDEA-20260805-f58517 attacks the structural assumption through an
      AM-intersect-coAM complexity ceiling, a different route entirely.
    verdict: >-
      UNVERIFIED. Cauchy/rational interpolation is classical, and recovering a
      Goppa polynomial from a multiplier is the natural move any specialist
      would make; no external novelty is claimed for the technique. The fetched
      abstract of arXiv:2304.14757 says its ingredient (ii) is a Groebner basis
      approach recovering the structure of the DEGREE-3 code, and says nothing
      about how the chain is inverted -- but the body is unfetched, so it is
      entirely possible the inversion is in there and this record would then be
      a rediscovery. That possibility is stated rather than hedged, and the
      first action of any experiment derived from this record should be a
      literature check of the inversion step.

