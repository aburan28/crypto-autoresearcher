    proof_obligations:
      - claim: The three sizes sum to 30.
        responsibility: correctness
      - claim: The three sizes multiply to 960.
        responsibility: correctness
      - claim: The excess is not a decomposition cost.
        responsibility: scope
    not_applicable_reason: null
