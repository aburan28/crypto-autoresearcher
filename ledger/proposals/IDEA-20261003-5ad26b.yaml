# IDEA-20261003-5ad26b
# Toy bit-size count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-5ad26b
  question_id: RQ-ECDLP-001
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The toy bit sizes 8, 10, and 12 sum to 30 and multiply to 960
  class: measurement
  claim: >-
    The question lists toy bit sizes 8, 10, and 12. Their sum is 30.
    Their product is 960. Twelve exceeds eight by 4, and ten exceeds
    eight by 2. The two consecutive gaps are both 2, and their
    product is 4. These are scale labels, not a decomposition cost.
  mechanism: >-
    The written list is the object. No summation polynomial is
    built. The consecutive differences are 10 minus 8 and 12 minus
    10. A repeated size 8 has gap 0, which is the nearby control.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-001
      provenance: internal
      claim: >-
        The question lists bit sizes 8, 10, and 12.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials are a different object from the bit-size list.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The three sizes are read from the question and not replaced.
    - No system is solved.
  proof_search_map:
    bottleneck: The excess 4 of 12 over 8.
    baseline_embedding:
      parameter_slice: The sizes 8, 10, and 12.
      reproduction_check: >-
        Two readers add and must agree that the sum is 30.
    observation_collision:
      observable: The sum 30 and the product 960.
      distinct_preimage_search: >-
        Replacing 12 by 8 drops the excess 4. Three copies of 8
        have pairwise gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The three written sizes.
        predicted_gain: Integer sum and product. No solver.
    quantifier_order: >-
