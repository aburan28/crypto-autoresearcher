idea:
  id: IDEA-20261018-6c1c6e
  title: FGHR 2-torsion symmetrisation and Faugere-Svartz character blocks on the m=4 Weil-descent system
  class: composition
  question_id: RQ-DREG-bd6c86
  area: DREG
  goal_ids:
  - GOAL-DREG-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: If the degree-5 row survives, FGHR 2-torsion symmetrisation lowers the counted cost of the m=4
    system by at least 30x, as measured elsewhere (30-416x, about 5-8.7 bits), moving the ECC2K-130 optimistic
    row from +10.32 to between about +1.6 and +5.4 bits over rho; Faugere-Svartz character blocks (never
    run) are measured separately and stacked.
  mechanism: Specified 2026-10-10 and never run. The equivariant pass is a separate 2-3x (honest) plus
    memory reach. The C ~ D^3.1 projection overstated D4 by 13x, so any projected figure is discounted;
    only measured factors are stacked, after K is converted.
  novelty_status: adaptation
  regime: binary m=4, conditional on degree 5 holding at (4,6) and l>=7; constant-level; 2-3 weeks
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.5, 2.1 rows 3-4, 4 row 8
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/ic_next10_20261014/06-equivariant-f4-m4/README.md
    provenance: internal
    claim: FGHR arm not run; equivariant pass bit-identical, 2-3x against gf2_elim.
    verified_by: idea-generator
  - ref: crypto:research/notes/ecc2k130/RESEARCH_ECC2K130_DESCENT_DEGREE.md
    provenance: internal
    claim: Optimistic row +10.32 bits over rho.
    verified_by: idea-generator
  - ref: crypto:research/d4_symmetrised_s5_20261015/README.md
    provenance: internal
    claim: C ~ D^3.1 projection overstated D4 by 13x.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-955fd6
    - KR-IC-8b9daa
    - KR-IC-1fcdbc
    - KR-IC-f5c584
    nearest:
    - ref: KR-IC-955fd6
      provenance: internal
      relation: special_case
      delta: Exploiting small-order torsion and S_m symmetry to speed point decomposition is the row;
        this applies it to the m=4 descended system with measured stacking.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Runs only after the (4,6) and l>=7 cells keep the degree at 5.
  - K is converted first, so the factors apply to a converted row.
  predictions:
  - metric: FGHR_factor_on_m4_cells
    direction: higher
    minimum_effect: At least 30x counted-cost reduction, interval excluding 1.
  - metric: stacked_row_bits_over_rho
    direction: lower
    minimum_effect: Below +10.32 after conversion; reported as distance remaining.
  - metric: FS_character_blocks_factor
    direction: different
    minimum_effect: Measured, never projected.
  minimal_test:
    design: On the m=4 cells where the degree is 5, build the FGHR 2-torsion symmetrised system and the
      Faugere-Svartz character-block system, solve each and the baseline with the same engine, same instances,
      exact verification; then stack and re-price the ECC2K-130 row with K.
    controls:
    - unsymmetrised baseline on the same cells
    - A/A repeat
    - random-structure null with the same symmetry group size
    - 'positive control: reproduce a published FGHR factor on a small cell'
    required_metrics:
    - counted cost per arm
    - degree reached
    - peak memory
    - stacked converted row
  falsification_conditions:
  - FGHR factor below 2x with an interval including 1 refutes the transfer from the Gaudry setting.
  - Stacking whose product is not realised (stack < product of parts) is reported as interaction.
  - If the degree at (4,6) or l>=7 exceeds 5, this item is not run.
  confounders:
  - symmetry breaks monomial structure
  - K conversion
  - projection error (13x seen)
  interpretation_limits:
  - Constant-level only; even the favourable factors leave the row above rho (+1.6 to +5.4 bits).
  heuristic_assumptions:
  - id: H1
    statement: The 30-416x FGHR factor transfers from the Gaudry setting to the Weil-descended m=4 system.
    rigorous_support: Measured 30-416x elsewhere.
    validation_plan: Measure on two small m=4 cells before the full cells.
  target_complexity:
    time_exponent: 'Conditional on degree 5: constant-level change of about 5-8.7 bits; no exponent change.'
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium-high
    compute: medium (2-3 weeks)
  recommended_priority: medium
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: None measured on this system. Conditional on the large-memory degree cells.
