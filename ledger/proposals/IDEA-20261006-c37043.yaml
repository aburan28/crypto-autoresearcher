idea:
  id: IDEA-20261006-c37043
  question_id: RQ-TORS-8c7b79
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Rational-root count of the 3-division polynomial against the
    abscissae of rational order-3 points, on eight curves over F_101
  class: measurement
  claim: >-
    Over F_101, on the first eight ordinary short-Weierstrass models
    y^2 = x^3 + A x + B found by the frozen coefficient scan, the
    number of distinct F_101-roots of the degree-4 polynomial f_3
    equals the number of distinct abscissae of affine points T other
    than the identity with 3T equal to the identity. A paired random
    monic-style degree-4 polynomial, leading coefficient 3, matches
    that torsion count on at most 2 of the eight curves. The claim
    states no scalar recovery and no attack-cost change. Equality
    failing on any one curve, or the random arm matching on 3 or more
    curves, is a negative.
  mechanism: >-
    f_3 is the odd 3-division polynomial implemented in
    harness/endosweep/explicit.py, low-coefficient order
    [-A^2, 12 B, 6 A, 0, 3], which this session opened. Its roots are
    the abscissae of nonzero 3-torsion in the algebraic closure. The
    tracked object is the pair of integers (root count, torsion
    abscissa count) on each curve. The operation set is root counting
    and point enumeration, not a walk. Lossy projection: the
    observable drops which roots and which points, and keeps the two
    counts. The loss is compatible with the question because
    RQ-TORS-8c7b79 asks whether torsion structure carries public
    information, and a count that a random degree-4 polynomial matches
    just as often carries none. The open number priced here is the
    match gap, 8 versus at most 2, on this one prime.
  novelty_status: unverified
  citations:
    - ref: harness/endosweep/explicit.py
      provenance: internal
      claim: >-
        f_3 is stored as the coefficient list [-A^2, 12 B, 6 A, 0, 3]
        in division_polynomials. Opened this session. The recurrence
        for n >= 5 was not used.
      verified_by: harness/endosweep/explicit.py
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Small-order torsion is used in the literature to shrink
        point-decomposition systems. Opened this session. This idea
        does not shrink a system and does not claim that speedup.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
  assumptions:
    - Characteristic is not 2 or 3. The prime is 101.
    - A root is counted once even if the polynomial has a repeated factor.
    - Point enumeration is exhaustive over F_101. A missed point voids the curve rather than lowering the torsion count.
    - The random polynomial is not claimed to be a division polynomial.
  predictions:
    - metric: >-
        For each of the eight curves, the absolute difference between
        the number of distinct F_101-roots of f_3 and the number of
        distinct abscissae of affine points T with 3T = O and T ≠ O.
      direction: lower
      minimum_effect: >-
        0 on every curve. A difference of at least 1 on any curve
        falsifies the equality on this prime.
    - metric: >-
        How many of the eight paired random polynomials have a
        distinct-root count equal to that curve's torsion abscissa
        count.
      direction: lower
      minimum_effect: >-
        at most 2. A match count of 3 or more means the equality is
        not specific to f_3 on this sample.
  minimal_test:
    design: >-
      Prime p = 101. Scan A from 1 upward and, for each A, B from 1
      upward. Skip singular models, those with 4 A^3 + 27 B^2 = 0,
      and supersingular models, those with trace 0. Trace comes from
      a full Legendre point count. Keep the first eight survivors in
      (A, B) lexicographic order. On each, compute f_3 from the
      opened coefficient list, count distinct roots by evaluation at
      every field element, and count torsion abscissae by enumerating
      affine points. The paired random polynomial has leading
      coefficient 3 and lower coefficients uniform in F_101, drawn
      from SHA-256 of the UTF-8 string
      IDEA-20261006-c37043|random|{curve_index}|{degree}.
    controls:
      - >-
        The random degree-4 arm above. It uses the same root counter.
        A shared bug in the counter can make both arms agree; the
        random arm is then not a separator. Record both raw counts.
      - >-
        On the first curve, recompute 3T = O for one torsion point by
        a second addition chain and require the same point. A mismatch
        voids the sample.
      - >-
        The zero polynomial is not a legal random draw. Leading
        coefficient stays 3.
    required_metrics:
      - root count and torsion abscissa count per curve
      - the eight absolute differences
      - the random-arm match count
      - A, B, and the trace of each curve
  falsification_conditions:
    - >-
      Any of the eight absolute differences is at least 1. The
      equality fails on F_101 for this scan.
    - >-
      All eight differences are 0 and the random arm matches on 3 or
      more curves. The equality is then not distinguished from a
      random degree-4 count on this sample.
  confounders:
    - One prime and eight curves. A match here does not transfer to other primes.
    - Exhaustive enumeration at p=101 is feasible. The same check at cryptographic size is not this test.
    - Repeated roots are collapsed. A multiplicity discrepancy is invisible.
  interpretation_limits:
    - >-
      An equality of counts is not a discrete logarithm and not a
      statement about the scalar. No attack cost moves.
    - >-
      This does not restate a Legendre-symbol bias of a 5-division
      polynomial against a scalar bit.
    - Toy prime only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A degree-4 polynomial over F_101 with leading coefficient 3
        and other coefficients uniform in the field has a
        distinct-root count that equals a fixed integer in {0, 1, 2,
        3, 4} on at most 2 of 8 independent draws, when that integer
        is the torsion count of the paired curve.
      rigorous_support: >-
        The number of roots of a random polynomial over a finite
        field is a classical distribution. This session did not open
        a theorem bounding the probability of eight matches. The
        bound "at most 2" is the pre-registered toy separator, not a
        proved tail.
      validation_plan: >-
        Draw 8 further independent degree-4 polynomials from a second
        seed suffix |holdout, paired with the same eight torsion
        counts, and record the match count. The holdout is reported.
        It does not replace the pre-registered arm. Sampled field is
        exactly F_101. No transfer is assumed.
  target_complexity:
    time_exponent: >-
      not beaten. Prime-field Pollard rho remains Theta(N^{1/2})
      group operations.
    memory_exponent: >-
      not beaten. Rho memory stays polylogarithmic per walk.
    best_known: >-
      Pollard rho at Theta(N^{1/2}). Torsion counts on a 101-element
      field are exhaustive and are not an algorithm for larger fields.
    hidden_overhead: >-
      None claimed. No attack cost is proposed.
    tradeoff_note: >-
      No time-memory tradeoff is offered.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-955fd6
      - KR-IC-5a43e5
      - KR-RHO-755e35
      - KR-IC-5931ee
    nearest:
      - ref: KR-IC-955fd6
        provenance: internal
        relation: adjacent
        delta: >-
          That row is a heuristic speedup of point decomposition by
          small-order torsion. This idea adds an 8-curve count
          equality on F_101, with a random degree-4 arm allowed to
          match at most 2 curves, and it claims no decomposition
          speedup.
    searched:
      corpus_grep:
        - titles of IDEA-20261005 and IDEA-20261006 on origin/main
        - proposal files added on design/tors-ed9a14
      web:
        - not performed this session
      blocked:
        - Legendre symbol of the 5-division polynomial against a scalar bit
        - symmetrized summation polynomials (KR-IC-955fd6 as a method)
  dominated_by: >-
    Pollard rho at Theta(N^{1/2}) group operations. No attack result
    is claimed.
  sota_delta: >-
    Exponent delta is 0 against Theta(N^{1/2}). The quantitative
    separator is an absolute root-count difference of 0 on all eight
    curves, against a difference of at least 1 on any curve, and a
    random-arm match count of at most 2, against 3 or more, on F_101.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        p=101, eight ordinary models, f_3 as implemented. Not an
        attack baseline.
      reproduction_check: >-
        Recompute f_3 on the first curve from the coefficient list
        and from one step of the recurrence in the same file, and
        require the same polynomial.
    observation_collision:
      observable: the two counts
      distinct_preimage_search: >-
        Two curves may share a count. That collision is not a
        discrete logarithm.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the curves with a given root count
        predicted_gain: none as an attack
    quantifier_order: >-
      For all eight curves the two counts are integers in
      {0, 1, 2, 3, 4}. The claim is the eight differences and one
      match count.
    method_ceiling:
      strongest_certifiable_claim: >-
        A statement about eight curves over F_101, either exact
        equality with a rare random match, or a named failure.
      nearby_object_control: the paired random degree-4 polynomial
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Count comparison on a toy prime. The random polynomial is the
      nearby control.
