      verified_by: null
  assumptions:
    - Cover construction and branch set as in the sibling census; all four branch points K-rational.
    - The universal constant between Jacobian roots and c*theta_i is absorbed into u; only the twist-pair claim touches it.
  proof_search_map:
    bottleneck: why v_2 restricts floor-family curves at q = 3 and what lifts it
    baseline_embedding:
      parameter_slice: n = 5, q = 3, the 20 genus-5 records of the sibling census
      reproduction_check: re-enumerate the family by x-orbits and match the curves and their [4]-data
    observation_collision:
      observable: (eps, chi(c_1), chi(c_2), u)
      distinct_preimage_search: two configurations with equal bits and different j; expected, the law is coarse
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Kummer class vector in F_q*/F_q*^2 of the orbit
        predicted_gain: derived 2-adic type of each floor-family curve
    quantifier_order: for all odd q, odd prime n, x with exact orbit n, c
    method_ceiling:
      strongest_certifiable_claim: the halvability pattern, not v_2 beyond |E(K)[4]|
      nearby_object_control: genus-17 and genus-25 split curves at q = 3, where |E(K)[4]| = 4 occurs
    proof_obligations:
      - claim: Plucker identities and the three halvability conditions
        responsibility: correctness
  predictions:
    - metric: share of genus-5 curves with |E(K)[4]| = 8, q = 3, 7, 11
      direction: equals
      minimum_effect: 1.0 (no 4, no 16)
    - metric: share of floor-family curves with |E(K)[4]| = 4, q = 5, 9, 13
      direction: equals
      minimum_effect: 0.5 exactly, one twist per configuration
    - metric: "|E(K)[4]| = 16 occurs iff eps = +1, u = +1, chi(-c_1 c_2) = +1"
      direction: equals
      minimum_effect: no exception in any panel
    - metric: n = 7 analogue for S = {0,2,3,4}
      direction: different
      minimum_effect: bits and prediction written before the panel
  minimal_test:
    design: >-
      (0) Write the n = 5 derivation and the n = 7 analogue first. (1) Enumerate the genus-5 configurations (x up
      to PGL2(F_q), five omitted conjugates, both twists), about 5q^2 each, for q = 3, 5, 7, 9, 11, 13; get the
      exact group structure of E(K); tabulate |E(K)[4]| by (eps, bits, u). (2) Match the 20 sibling q = 3
      records. (3) Out-of-sample: q = 5, 9, 13 and n = 7 at q = 3, 5, 7.
    controls:
      - "Positive: the 20 q = 3 sibling records and the 20 of 60 / 0 of 21 split by |E(K)[4]|."
      - "Negative: genus-17 and genus-25 split curves, where |E(K)[4]| = 4 occurs; the law must not bind them."
      - "Nearby object: the n = 3 hyperelliptic family (4 | #E on all 81 instances), same bit analysis."
    required_metrics: [q, n, eps, bits, u, "|E(K)[4]|", "v_2(#E(K))", configurations, coverage]
  falsification_conditions:
    - A genus-5 curve at q = 3 mod 4 with |E(K)[4]| != 8 refutes the Kummer bookkeeping.
    - At q = 1 mod 4 a twist pair not split as one 4 and one in {8, 16}, or a share of 4 away from 1/2, refutes the u-flip.
    - "|E(K)[4]| = 16 at q = 3 mod 4 signals an enumeration error (invalid, not null)."
  confounders:
    - Characteristic 3 at q = 3 (the n = 3 pilot had char-3 exceptions); q = 7, 11 separate it.
    - j = 0, 1728 have extra twists; separate rows.
  interpretation_limits:
    - Bounded q and n; no cost, no transfer claim. Why genus 25 needs v_2 >= 3 at q = 3 is a different family, left open.
  heuristic_assumptions:
    - id: H1
      statement: The bits (chi(c_1), chi(c_2)) are equidistributed over configurations, each cell 1/4 + O(q^(-1/2)).
      rigorous_support: Weil/Katz bounds for multiplicative character sums on the Weil restriction of P^1.
      validation_plan: counts at q = 5..13 against 1/4 per cell, chi-square, worst cell reported.
