idea:
  id: IDEA-20260805-5ac0a2
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  added: '2026-08-05'
  title: >-
    The reference curve this goal froze is off by a derivable factor 2^m: an
    exact-counting audit of HEUR-SEMAEV-2015-4.3 as transcribed into the
    GOAL-RELN-001 protocol, which decides the protocol's own headline verdict
    at every cell of the ladder before any measurement is made
  class: control

  claim: >-
    The frozen review-only protocol for this goal
    (coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/TASK-20260725-661/decomp_probability_protocol.yaml)
    pins its primary discriminator RULE-HEUR-TRACK to the reference curve
    P_reported = 1 - (1 - 1/q)^K with K = |V|^t/t! and q = p, and declares an
    absolute tolerance of 0.05 on the residual hat_p_exist - P_reported. Exact
    counting on the same objects the protocol names gives a different forced
    mean: for a factor base V of B distinct non-2-torsion x-coordinates on
    E(F_p) with N = #E(F_p), the point set actually searched is
    W = V-lifts union their negatives, |W| = 2B, and the exact number of size-m
    multisets from W is C(2B+m-1, m), every one of which sums to exactly one
    group element. Hence the exact mean number of decompositions of a uniformly
    random target is mu(B,m) = C(2B+m-1, m) / N, and the Poisson analogue of the
    protocol's reference curve is 1 - exp(-mu). The ratio of the two exponents is
    exactly (p/N) * 2^m * prod_{j=0}^{m-1} (1 + j/(2B)), i.e. it converges to
    2^m and never approaches 1. The missing 2^m is not a modelling dispute: it is
    the degree of the summation polynomial S_{m+1} in its last variable
    (2^{m-1}, KN-TECH-002) times 2 for the two lifts of a root, i.e. the number
    of targets one factor-base multiset covers. Evaluated on the protocol's own
    default ladder this forces RULE-HEUR-TRACK's verdict at 20 of 20 cells before
    a single trial runs: 16 cells are forced past the 0.05 tolerance (residual up
    to 0.66) and the remaining 4 sit below it only because both curves are small
    there, so the rule endorses a reference wrong by a factor of 4 in the mean.
    Either way the metric measures the transcription, not the heuristic, and the
    ICEX package built from it would carry that artifact downstream. THIS IS AN
    AUDIT OF THIS PROGRAM'S TRANSCRIPTION, NOT A CLAIM THAT SEMAEV IS WRONG:
    KN-LIT-009 has not been read here (its corpus entry says so in its own "Not
    verified here" section), and the first stage of the paired experiment is to
    obtain the source and check the formula verbatim.

  object_first_candidate:
    tracked_object: >-
      One unordered size-m multiset of factor-base x-coordinates, followed
      through the summation polynomial to the set of targets it can decompose.
      The tracked quantity is that multiset's target-coverage number: how many
      group elements R satisfy S_{m+1}(x_1,...,x_m,x(R)) = 0 for this fixed
      multiset. Everything in the audit is bookkeeping on that one number and
      on how many multisets there are.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: new summation-polynomial
      variants or degree engineering; Groebner solving-degree / first-fall-degree
      instrumentation; factor-base geometry yield claims of the "small-x is
      optimal" family (DEC-20260804-2bfc30, DEC-20260724-020); Weil-descent /
      Gaudry-Diem extension-field transfer; rho/BSGS baselining; and any new
      prime-field decomposition construction. The lens used instead is exact
      double counting applied to the measurement convention. This is deliberate:
      the goal's next_action queues a measurement campaign, and the cheapest
      thing that can change what that campaign is worth is an audit of its
      reference curve, which costs no compute.
    newness_score: >-
      The counting identity is elementary and its group-theoretic half is already
      in this corpus as KN-FIND-007 (stated for a factor base D of B elements;
      the step taken here is to apply it to W = +/-V of size 2B, which is the set
      the summation polynomial actually searches). What is not in the corpus is
      the collision between that identity and the reference curve this goal
      froze, nor the pre-run verdict table it forces. The novelty is in the
      collision, not in either half.
    testability_score: >-
      Maximal. Stage 1 is pen and paper. Stage 2 is exact enumeration on toy
      curves in pure Python with no dependency beyond the standard library
      (verified this session: numpy 2.4.6 present, sympy absent, Sage absent,
      src/ic_first_fall_fast.py fails to import), and returns a value that is
      either exactly C(2B+m-1,m) or not.
    survival_score: >-
      The counting identity survives with certainty because it is a double count.
      What may not survive is the attribution: if KN-LIT-009's formula, read in
      its own notation, already carries the 2^m (for example by defining V as a
      set of points rather than x-coordinates, or by counting sign classes), then
      the defect is in this program's transcription and the finding is smaller
      but not smaller in consequence for the protocol.

  mechanism: >-
    Setup. E: y^2 = x^3 + ax + b over F_p, N = #E(F_p), and a factor base given
    as a set V of B distinct x-coordinates of non-2-torsion points. Each x in V
    lifts to exactly two points P and -P, so the point set the decomposition
    search ranges over is W = union over x in V of {P_x, -P_x}, with |W| = 2B and
    W = -W.

    Step 1 (what one multiset covers). Fix a size-m multiset M from W. It sums to
    exactly one group element. Equivalently, fix a size-m multiset of
    x-coordinates from V; then S_{m+1}(x_1,...,x_m,X) is a univariate polynomial
    in X of degree at most 2^{m-1}, because deg S_n in each variable is 2^{n-2}
    (KN-TECH-002, with the explicit S_3 given there of degree 2 in each variable).
    Its roots are exactly the x-coordinates of the points +/- sum eps_i P_i over
    sign vectors eps in {+/-1}^m. There are 2^m such signed sums, closed under
    global negation, hence generically 2^{m-1} distinct x-values, matching the
    degree. So ONE x-multiset covers 2^{m-1} x-targets, i.e. 2^m group elements.
    Two independent derivations (degree of S_{m+1}; sign-vector counting) agree,
    which is the cheapest available check on this step.

    Step 2 (how many multisets, exactly). By the double count recorded as
    KN-FIND-007 -- every size-m multiset sums to exactly one group element --
    applied to W rather than to V:
        sum over g in E(F_p) of c_W(g)  =  C(2B+m-1, m)   exactly,
    where c_W(g) counts size-m multisets from W summing to g. Therefore the exact
    mean per-target decomposition count is
        mu(B,m) = C(2B+m-1, m) / N,
    with no heuristic anywhere. Two structural facts follow immediately and are
    used as instrument checks: c_W(g) = c_W(-g) for every g, because W = -W and
    negating every element of a multiset is an involution on multisets; and
    coverage <= min(1, mu), with equality iff no target has two decompositions
    (KN-FIND-007 consequence 3).

    Step 3 (the collision). The protocol's reference curve has Poisson exponent
    K/q = B^m / (m! p). The exact mean has exponent
    mu = C(2B+m-1,m)/N = prod_{j=0}^{m-1} (2B+j) / (m! N). Their ratio is
        mu / (K/q)  =  (p/N) * 2^m * prod_{j=0}^{m-1} (1 + j/(2B)),
    exactly. As B grows this decreases monotonically to 2^m * (p/N), and p/N is
    within 1 +/- 2/sqrt(p) by Hasse. So the discrepancy is a factor of about 4 at
    m = 2 and about 8 at m = 3, at every B, and it does not wash out.

    Step 4 (what that does to the frozen decision rule). RULE-HEUR-TRACK declares
    a match when |hat_p_exist - P_reported| <= 0.05 absolute. Substituting the
    exact mu into 1 - exp(-mu) and comparing against P_reported on the protocol's
    own default ladder (fixture_ladder.factor_base_size_ladder_rule) gives the
    forced residuals tabulated in predictions below. The rule's verdict is
    therefore fixed by the design, not by the data, at every cell. Note the two
    failure directions are both bad and they are different: at 16 cells the rule
    fires H-HEURISTIC-MISSES for a reason that has nothing to do with Semaev, and
    at the 4 smallest-mu cells it fires H-HEURISTIC-TRACKS on a reference curve
    that is wrong by a factor of 4 in the mean, purely because 0.05 absolute is
    not a scale-free criterion when both quantities are near 0.01. The second
    failure is the more damaging one, because it is the one that would be written
    into the ICEX package as a passed check.

    Step 5 (what the honest reference curve is). The audit's constructive output
    is a replacement reference with no free parameters: REF-EXACT-MEAN,
    mu(B,m) = C(2B+m-1,m)/N, exact, plus the interval
    [max(0, mu - (m(m-1)/(4B)) * mu), min(1, mu)] for coverage, whose upper end
    is KN-FIND-007's ceiling and whose lower end subtracts the negation-forced
    self-cancellation leak (multisets containing a +/- pair collapse to an
    (m-2)-multiset; at m = 2 exactly B of the C(2B+1,2) multisets sum to the
    identity, a forced value that is independently checkable). Under this
    replacement the residual metric measures what the goal actually wants to
    know: the collision deficit mu - coverage, which is the only part of
    p_exist(B) that is not determined by (B, m, N) alone. That deficit is the
    subject of IDEA-20260805-a25f11 and is deliberately not claimed here.

  novelty_status: unverified

  literature_context:
    - >-
      KN-LIT-009 (Semaev, "New algorithm for the discrete logarithm problem on
      elliptic curves", iacr:2015/310). NOT READ -- relayed claim. The corpus
      entry itself states "Full paper not read; the standing of its complexity
      claims summarized from general community reception". The formula this
      proposal audits is quoted at second hand inside this goal's own protocol
      artifact, which attributes to KN-LIT-009 section 4.3 the model
      P(q,m,t,|V|) ~ 1-(1-1/q)^{|V|^t/t!} ~ |V|^t/(q t!). NEITHER THIS PROPOSAL
      NOR THE PAIRED EXPERIMENT ASSERTS THAT THIS IS WHAT THE PAPER SAYS. Stage 0
      of EXP-RELN-475c87 is to obtain the source and record the formula verbatim
      with its stated setting, or to record that it could not be obtained. The
      2026-08-05 scouting note for this session records eprint.iacr.org abstract
      pages returning 200 and the /YYYY/NNNN.pdf endpoint returning 403; that
      claim is itself relayed and is to be retested in the run.
    - >-
      KN-LIT-025 (Petit, Kosters, Messeng, PKC 2016). NOT READ -- relayed claim;
      the corpus entry says "Full paper not read ... relayed from the abstract
      and secondary sources. No IACR ePrint located." This proposal makes no
      claim about the PKM construction and does not touch the protocol's
      ARM-PKM-PRIME arm, which the protocol itself blocks on literature fixture
      materialization.
    - >-
      KN-TECH-002 (Semaev summation polynomials). READ in this repository. Supplies
      the two facts the mechanism leans on: deg S_n in each variable is 2^{n-2},
      and the explicit S_3 for y^2 = x^3 + ax + b, which is visibly degree 2 in
      each variable. Also states the decomposition condition "R equals a sum of m
      factor-base points (up to signs)" -- the "up to signs" is precisely the 2^m
      this audit recovers.
    - >-
      KN-FIND-007 (internal finding, confidence: established, claim_tier toy).
      READ in this repository. Supplies the conservation double count
      sum_r c_D(r) = C(B+m-1,m) and the ceiling coverage <= min(1, mu). This
      proposal's only extension is to apply it to W = +/-V of size 2B rather than
      to V of size B, because W is the set the summation polynomial searches.
      KN-FIND-007's own screening rule ("a factor-base proposal that promises
      higher mean yield at matched size is refuted on sight") is respected: no
      yield improvement is proposed here.
    - >-
      EV-RELN-001 and the frozen protocol artifact are this goal's only prior
      records. EV-RELN-001 states plainly "No decomposition-probability
      measurement was performed", so nothing in this audit contradicts a
      measurement; it contradicts a design.

  lossy_projection_identifiability_audit:
    projection: >-
      (curve E, factor base V, arity m, target R)  -->  the exact mean
      mu = C(2B+m-1, m)/N, i.e. the triple (B, m, N).
    what_is_discarded: >-
      The identity of the curve beyond its order, the entire additive structure
      of V, and the target R. Two factor bases of the same size on the same curve
      project to the identical value.
    why_genuinely_lossy: >-
      Maximally lossy. The fibre over an observed mu is every factor base of that
      size on every curve of that order.
    why_compatible_with_the_operations: >-
      Compatible by a theorem rather than by approximation: the double count is
      exact and is preserved by the group operation, which is why mu propagates
      deterministically and needs no random model at all.
    is_it_only_a_change_of_coordinates: >-
      No -- and the failure checked for here is the MIRROR one, not the
      (Delta,Pi) = (x xor y, x*y) change-of-coordinates failure. The check
      performed: does the projection have zero spread across instances within a
      stratum? IT DOES. mu is constant across every factor base of size B on a
      curve of order N, so as a DISCRIMINATOR it is worthless -- exactly the
      zero-comparator-spread failure KN-TECH-1a5b7e names. That is the finding,
      not an oversight: the projection is proposed as a REFERENCE (a forced value
      the measurement must reproduce), and the discriminating object is the
      residual left over after it is divided out, namely the collision deficit
      mu - coverage. A reference curve is supposed to be constant; a
      discriminator is not; the protocol under audit uses one as the other.
      Recording which of the two roles a constant projection can play is the
      whole content of this audit.

  assumptions:
    - >-
      That the protocol artifact's transcription of KN-LIT-009 is the object
      under audit. If the paper's own formula already carries the 2^m, the
      headline shifts from "the reference curve is wrong" to "this program's
      transcription of it is", which is a smaller finding with the same operational
      consequence. Stage 0 exists to decide this and the audit must not skip it.
    - >-
      That V consists of x-coordinates of non-2-torsion points and contains no
      pair {x(P), x(-P)} counted twice (they are equal, so this is automatic).
      2-torsion x-coordinates break |W| = 2B and are handled as an explicit null
      arm rather than assumed away.
    - >-
      That the protocol's "p_exist" is the probability that a uniformly sampled
      target admits at least one decomposition over V, which is what its Y_exist
      definition says.

  proof_search_map_note: >-
    The paired hypothesis H-RELN-96e3ba carries the filled proof_search_map for
    this proposal; it is not duplicated here.

  predictions:
    - metric: >-
        exact_multiset_total: the enumerated number of size-m multisets from
        W = +/-V, summed over all group elements, on every tested (curve, V, m)
      direction: different
      minimum_effect: >-
        EXACTLY C(2B+m-1, m), with zero deviation. Forced before any run. Any
        deviation falsifies the counting convention and the whole audit is
        withdrawn. (Sanity-checked outside the harness at p = 101, a = 2, b = 3,
        N = 96, for B in {5,8,12} and m in {2,3}: totals 55, 220, 136, 816, 300,
        2600 against predictions 55, 220, 136, 816, 300, 2600. THAT CHECK IS
        SCRATCH ARITHMETIC RUN OUTSIDE THE HARNESS AND IS NOT EVIDENCE; it is
        recorded so a reviewer knows the prediction was not written blind, and
        it is to be re-run in-harness as a contract stage.)
    - metric: >-
        ratio_of_exponents: mu(B,m) divided by the protocol reference exponent
        K/q = B^m/(m! p), computed cell by cell on the protocol's default ladder
      direction: higher
      minimum_effect: >-
        Forced closed form (p/N) * 2^m * prod_{j=0}^{m-1}(1 + j/(2B)). With
        N set to p the forced values are, at m = 2: 4.500, 4.333, 4.250, 4.167
        for B = 4, 6, 8, 12; 4.333, 4.200, 4.143, 4.100 for B = 6, 10, 14, 20;
        4.250, 4.143, 4.100, 4.071 for B = 8, 14, 20, 28; 4.167, 4.100, 4.062,
        4.042 for B = 12, 20, 32, 48. At m = 3, B = 8, 14, 20, 28: 9.563, 8.878,
        8.610, 8.434. The ratio must be > 4 at every m = 2 cell and > 8 at every
        m = 3 cell, and must DECREASE monotonically in B within each cell family.
        A measured ratio of 1 falsifies the audit outright.
    - metric: >-
        forced_residual: |1 - exp(-mu) - P_reported| evaluated at every cell of
        the protocol's default ladder, compared against RULE-HEUR-TRACK's
        declared absolute tolerance of 0.05
      direction: higher
      minimum_effect: >-
        At least 16 of the 20 default cells forced above 0.05 with no trial run.
        Computed forced residuals (N = p placeholder, p = the smallest prime
        above 2^{bits-1}+1 for illustration only; the contract fixes the primes):
        bits 8 m 2: 0.181, 0.320, 0.428, 0.475; bits 10 m 2: 0.105, 0.240, 0.370,
        0.474; bits 12 m 2: 0.049, 0.133, 0.236, 0.367; bits 12 m 3: 0.287, 0.662,
        0.519, 0.168; bits 16 m 2: 0.007, 0.019, 0.046, 0.098. The four cells
        below tolerance (bits 12 m 2 B 8; bits 16 m 2 B 12, 20, 32) are the more
        serious finding and must be reported as such: there the rule returns
        TRACK on a reference wrong by a factor of 4 in the mean.
    - metric: >-
        identity_target_count c_W(O) at m = 2 on a factor base with no 2-torsion
      direction: different
      minimum_effect: >-
        EXACTLY B, forced (the B multisets {P_i, -P_i}). Independently checkable
        and independently falsifiable; a different value means the +/- lifting
        convention in the instrument does not match the derivation.
    - metric: >-
        negation_symmetry: fraction of group elements g with c_W(g) = c_W(-g)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000. Forced. A single violation means the enumerator is wrong.
    - metric: >-
        source_fidelity: whether KN-LIT-009's own statement of the decomposition
        probability, read from the primary source, carries the factor 2^m
      direction: different
      minimum_effect: >-
        Binary and pre-registered as UNKNOWN. This proposal predicts nothing here
        and must not: the paper has not been read. Both outcomes are recorded and
        both are useful.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the audit; specified in
      full in EXP-RELN-475c87. STAGE 0 (zero compute, source): obtain
      iacr:2015/310 and quote the decomposition-probability statement verbatim
      with its setting, or record the exact failure mode. STAGE 1 (zero compute,
      algebra): write out the two derivations of the 2^{m-1} target coverage
      (degree of S_{m+1}; sign-vector count) and the conservation double count;
      if they disagree, STOP. STAGE 2 (seconds, pure Python): exact enumeration
      on toy curves, checking the four forced values above. STAGE 3 (zero
      compute, tabulation): evaluate RULE-HEUR-TRACK against both reference
      curves on every ladder cell and publish the pre-run verdict table.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL):
        a factor base seeded with t 2-torsion x-coordinates (points with y = 0).
        Then |W| = 2B - t, not 2B, and the forced multiset total becomes
        C(2B-t+m-1, m), a DIFFERENT number. Predicting it correctly is a genuine
        test of the lifting convention rather than of the arithmetic; predicting
        it wrongly falsifies the convention. This null can fail and is not
        decoration.
      - >-
        POSITIVE CONTROL / nearby object (the effect MUST appear): the
        small-multiples factor base V = {x(iG) : i = 1..B}. Conservation forces
        its mean to be IDENTICAL to a random base of the same size, while
        KN-FIND-007 records a measured coverage ratio of 0.0021 at N ~ 2^18 for
        this family. So the instrument must report equal mu and drastically lower
        coverage. If it reports coverage near the Poisson value for this base,
        the instrument cannot see collisions at all and NO NEGATIVE RESULT MAY BE
        REPORTED from any arm.
      - >-
        GRADED CONTROL (>= 3 interior points, monotonicity reported): the ratio
        prediction itself is graded. Within each cell family the forced ratio
        decreases strictly in B (e.g. 4.500 > 4.333 > 4.250 > 4.167). Report the
        measured sequence and its monotonicity. A non-monotone sequence localises
        the error to the multiset-vs-power correction rather than leaving "it did
        not match".
      - >-
        ORDERING CONTROL: the forced-value table (predictions above) is committed
        to the run directory before the enumerator is executed, and the
        enumerator's output is compared against the committed file rather than
        the other way round.
      - >-
        ARCHIVE CHECK (zero compute): search the corpus for any prior measurement
        of the same observable on E(F_p) with a +/- symmetric factor base. Report
        what was found rather than asserting none exists; EV-SEMAEV-001's 3/6
        decomposition incidence at fixed B = 14 is the nearest thing and the
        protocol itself labels it "explicitly not a controlled P(decomp)
        measurement".
    required_metrics:
      - verbatim quotation of the source formula with page or section, or the recorded fetch failure
      - enumerated multiset totals against the forced C(2B+m-1,m), per cell, exact match or deviation
      - c_W(O) at m = 2 against the forced value B
      - measured ratio sequence and its monotonicity in B
      - the pre-run RULE-HEUR-TRACK verdict table over all 20 default cells, both reference curves

  falsification_conditions:
    - >-
      Any enumerated multiset total differing from C(2B+m-1, m). The conservation
      step is then wrong and the audit is withdrawn in full.
    - >-
      A measured exponent ratio near 1 rather than near 2^m. The 2^m derivation is
      then wrong and the headline collapses.
    - >-
      The primary source, once read, states the probability with the 2^m already
      present. The headline is then re-attributed to this program's transcription
      (still a defect in the frozen protocol, but not a defect in the literature),
      and the record must say so in those words.
    - >-
      c_W(O) at m = 2 differing from B on a 2-torsion-free base, or any violation
      of c_W(g) = c_W(-g). Instrument broken; nothing may be reported.
    - >-
      The positive control failing to show a coverage collapse for the
      small-multiples base. Instrument insensitive; no negative may be reported.

  confounders:
    - >-
      TRANSCRIPTION VS SOURCE. The audit is aimed at a formula quoted at second
      hand inside a protocol artifact. Stage 0 exists solely to remove this and
      the audit may not report a literature-facing conclusion without it.
    - >-
      HASSE. p and N differ by up to 2 sqrt(p); at bits = 8 that is about 12
      percent, comparable to the tolerance band. The audit must report residuals
      against N, not p, and must report the p/N factor separately so the 2^m and
      the Hasse effect are not conflated.
    - >-
      REGIME. 1 - exp(-mu) is the Poisson approximation to coverage; it is not
      exact, and it is least accurate exactly where mu ~ 1, which is where several
      ladder cells sit. The audit's exact statements are mu and the ceiling
      coverage <= min(1, mu); 1 - exp(-mu) is used only to evaluate the protocol's
      own rule on the protocol's own terms and must be labelled as such.
    - >-
      DEGENERATE MULTISETS. Multisets with repeats and multisets containing a
      +/- pair are counted by C(2B+m-1,m) but behave specially; the identity-target
      count c_W(O) = B at m = 2 is the visible consequence and is checked directly
      rather than argued away.
    - >-
      AUTHORSHIP ASYMMETRY. Auditing a frozen artifact from the same program is
      cheap and reads as rigour. The falsification conditions above are written so
      that a negative outcome (the transcription is fine) costs the same work as a
      positive one.

  interpretation_limits:
    - >-
      A confirmed audit closes the RULE-HEUR-TRACK metric AS FROZEN. It does not
      close the goal, does not refute KN-LIT-009, does not establish any
      decomposition probability, and does not touch the ARM-PKM-PRIME arm. Forward
      guidance is concrete and is the audit's constructive half: replace the
      reference with REF-EXACT-MEAN mu = C(2B+m-1,m)/N and make the reported
      quantity the collision deficit.
    - >-
      Toy scope throughout. The counting identity is exact at every scale, so the
      toy enumeration is a CHECK OF A DERIVATION rather than an extrapolation --
      but nothing about crypto-scale decomposition probability follows, and the
      protocol's prohibited_claims list is inherited verbatim.
    - >-
      NO STATUS CHANGE to the frozen protocol, to EV-RELN-001, to GOAL-RELN-001's
      next_action, or to any knowledge record is proposed or implied. Those are
      Coordinator decisions.

  heuristic_assumptions:
    - id: HEUR-RELN-A1
      formal_statement: >-
        NONE OF THE HEADLINE IS HEURISTIC. The two load-bearing statements --
        sum over g of c_W(g) = C(2B+m-1,m) for |W| = 2B, and one x-multiset covers
        at most 2^{m-1} x-values -- are a double count and a degree bound
        respectively. This entry exists to record that the audit is unconditional
        where the object it audits is not.
      random_model_justification: >-
        Not applicable; no random model is used for the forced values.
      supporting_results:
        - "KN-FIND-007 (internal, established, derivation): sum_r c_D(r) = C(B+m-1,m)."
        - "KN-TECH-002 (internal, established): deg S_n in each variable = 2^{n-2}."
      validation_experiment_ids: [EXP-RELN-475c87]
      falsification_condition: >-
        An enumerated total differing from C(2B+m-1,m), or an x-multiset covering
        more than 2^{m-1} distinct x-values.
    - id: HEUR-RELN-A2
      formal_statement: >-
        For the purpose of evaluating the protocol's own rule, coverage is
        approximated by 1 - exp(-mu). This IS a heuristic (Poissonization) and is
        used only to put the two reference curves on the same footing.
      random_model_justification: >-
        The standard balls-in-bins approximation, valid when no target absorbs a
        constant fraction of the multisets. It is known to be violated by
        high-additive-energy factor bases, which is why the small-multiples
        positive control exists.
      supporting_results:
