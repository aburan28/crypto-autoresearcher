idea:
  id: IDEA-20261006-b8d10a
  question_id: RQ-ECDLP-165d4b
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The least prime where both y^2 = x^3 + 8x + 3 and
    y^2 = x^3 + 11x + 6 are ordinary has unequal group orders
  class: measurement
  claim: >-
    Let E0 be y^2 = x^3 + 8x + 3 and E1 be y^2 = x^3 + 11x + 6.
    Let p be the smallest prime with p > 40 and p < 180 such that
    both curves are nonsingular over F_p and both traces are not
    divisible by p. The claim is that this p exists and that
    #E0(F_p) is not equal to #E1(F_p). No discrete logarithm is
    transferred. If no such prime exists, or the two orders are
    equal at that prime, the claim is false.
  mechanism: >-
    The tracked object is the pair of group orders at one prime.
    The representation is the short-Weierstrass model. The
    operation is point counting, not a walk and not an isogeny.
    Lossy-projection test: the projection keeps the integer
    difference of the two orders and discards the points. One-line
    reason: curves of unequal order are not isogenous, by the
    criterion that isogenous curves share the number of points.
    This record asks whether the least eligible prime already
    separates the orders. It does not search for a secret
    endomorphism.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if
        they have the same number of points. Unequal orders are the
        observation this record predicts. No isogeny is constructed.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs Omega of the square root of the
        group order. Two point counts are not that algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        MOV, Frey-Rück, and the anomalous-curve attack apply only
        on special curves. This record does not compute an
        embedding degree and does not test trace 1.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
  assumptions:
    - Nonsingularity is 4A^3 + 27B^2 nonzero in F_p.
    - The trace is p + 1 - #E(F_p). Ordinary in this window means that trace is not divisible by p.
    - The same prime is used for both curves. Counting them at different primes is not the instance.
  predictions:
    - metric: absolute difference of the two group orders
      direction: higher
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Search primes from 41 up to 179. Skip a prime if either curve
      is singular or either trace is divisible by p. At the least
      remaining prime, point-count both curves. The claim holds if
      the orders differ. Record p, both orders, and both traces.
      If the window is exhausted, record empty_search.
    controls:
      - >-
        At the scored prime, the order of E0 counted twice must
        agree. A nonzero self-difference voids the point-count code.
      - >-
        A prime at which either discriminant is zero is not
        eligible. Scoring it voids the run.
      - >-
        The prime p = 41 is inside the window only if it meets
        every condition. Do not force p = 41 after seeing the
        orders.
    required_metrics:
      - p or the statement that none exists
      - both group orders
      - both traces
      - the absolute difference
  falsification_conditions:
    - >-
      The least eligible prime exists and the two group orders are
      equal.
    - No prime in the window is eligible.
    - The two counts of #E0(F_p) disagree.
  confounders:
    - >-
      Using different primes for the two curves can fake a
      difference or hide an equality.
    - >-
      Treating a trace of 0 as ordinary makes a supersingular curve
      eligible.
    - >-
      An embedding degree is not this claim. Reporting one would be
      a different experiment.
  interpretation_limits:
    - >-
      Unequal orders at one prime do not yield a discrete logarithm
      and do not say that every pair of these models is non-isogenous.
    - >-
      Equal orders would not by themselves exhibit an isogeny. They
      would only fail this prediction.
    - >-
      The rho exponent stays 1/2. A point count is not a walk.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Two distinct short-Weierstrass models, both ordinary at the
        least eligible prime in this window, are predicted to have
        different group orders. The prediction is one integer
        difference, not a distribution of traces.
      rigorous_support: >-
        KR-RHO-755e35, opened in this session, equates isogeny with
        equal point counts and does not evaluate these two cubics.
        Hasse's bound limits the trace but was not re-derived here.
        No file opened here computes either group order.
      validation_plan:
        sampling: >-
          The least eligible prime, one pair of curves. Not a
          sample of primes beyond that prime.
        comparison: >-
          The absolute difference of the orders against 1.
        tail_check: >-
          An empty window is kept and falsifies the existence
          clause. It is not replaced by a later prime outside the
          window.
        parameters: >-
          40 < p < 180, curves y^2 = x^3 + 8x + 3 and
          y^2 = x^3 + 11x + 6. No transfer to a cryptographic prime.
  target_complexity:
    time_exponent: >-
      unchanged at 1/2, from KR-RHO-13bf67. Two group orders do not
      change the cost of a discrete logarithm on either curve.
    memory_exponent: >-
      unchanged. The test stores two integers at one prime below 180.
    best_known: >-
      KR-RHO-755e35 for the isogeny criterion and KR-RHO-13bf67 for
      the generic exponent. Neither row is improved.
    hidden_overhead: >-
      None. No o(1) in an exponent is claimed. An order difference
      is an integer.
    tradeoff_note: >-
      No time-memory tradeoff. Two stored orders do not replace a
      distinguished-point table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-RHO-53c89f
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row says isogenous curves share the group order.
          This record's output is one absolute difference of orders,
          predicted at least 1, at the least eligible prime below
          180. Shared isogenies constructed: 0. The exponent delta
          is zero.
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: orthogonal
        delta: >-
          That row restricts MOV, Frey-Rück, and the anomalous
          attack to special curves. This record does not compute an
          embedding degree and does not test trace equal to 1.
          Shared pairing values: 0.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The row's exponent is 1/2. This record changes that
          exponent by 0.
    searched:
      corpus_grep:
        - question_id RQ-ECDLP-165d4b in ledger/proposals
        - x^3 + 8x + 3
        - x^3 + 11x + 6
      web: []
      blocked:
        - No web fetch in this session.
  dominated_by: >-
    Checked KR-RHO-755e35, KR-RHO-13bf67, and KR-RHO-53c89f, all
    opened. Pollard rho at exponent 1/2 dominates any reading of
    these two orders as an algorithm. Tate's criterion dominates
    any reading of an order gap as a new isogeny obstruction. The
    gap does not beat either row.
  sota_delta: >-
    Zero change to the 1/2 exponent. The predicted gap is an
    absolute difference of group orders of at least 1, against a
    difference of 0, at one prime below 180.
  proof_search_map:
    not_applicable_reason: >-
      This is two point counts at one prime. It does not propose a
      theorem on isogeny classes, a complexity bound, or a closure
      of the prime-field hardness census.
