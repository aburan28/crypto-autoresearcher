idea:
  id: IDEA-20260805-554b9d
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  added: '2026-08-05'
  title: >-
    Basis-parametric full-cost re-costing of the ISD family: under Wiener full
    cost the comparator is tau + mu, not tau, and the whole memory-heavy ISD
    lineage may lose to Prange at Classic McEliece's parameters

  class: cost_model_audit

  claim: >-
    A one-line derivation fixes the comparator that every published ISD ranking
    omits. Let an information-set-decoding variant V have RAM-model time
    2^(n*tau_V*(1+o(1))) and memory 2^(n*mu_V*(1+o(1))) in a fixed asymptotic
    regime. Under Wiener full cost (hardware quantity times time occupied,
    KN-TECH-035 relaying KN-LIT-094) the memory cells ARE hardware and are held
    for the whole run, so the full cost is at least 2^(n*(tau_V+mu_V)*(1+o(1))),
    and that exponent is INVARIANT under the standard outer-loop
    parallelisation that makes tau_V look reducible. Prange has mu = 0, so
    Prange's full-cost exponent equals its time exponent unchanged. Therefore V
    beats Prange under full cost if and only if tau_V + mu_V < tau_Prange -- a
    strictly harder test than the published tau_V < tau_Prange, and one that
    charges the representation-technique family DOUBLE for exactly the resource
    it buys its advantage with. This proposal does not assert the outcome of
    that arithmetic. It asserts that the arithmetic has never been done in this
    corpus, that GOAL-MCE-001, GOAL-HQC-001 and GOAL-SDITH-001 all name the
    memory-charged ISD baseline as deliverable number one while no experiment
    or evidence record in the repository contains one, and that the input
    numbers are transcribable and the computation is pure-Python integer
    arithmetic. BOTH outcomes are deliverables: if the ranking inverts, the
    baseline exponent for three schemes at once is Prange rather than
    BJMM/May-Ozerov, and every concrete estimate inheriting the latter is on a
    basis that charges nothing for its own distinguishing feature; if the
    ranking does not invert, the cell closes in one table and that closure is
    precisely the negative all three goals asked for.

  object_first_candidate:
    tracked_object: >-
      The COST-BASIS-INDEXED RANKING PERMUTATION of a fixed list of ISD
      variants. Not any algorithm, not any code, not any instance: the object
      followed through the computation is the ordering of the variant list, as
      a function of the accounting basis it is priced under. It is followed
      through five declared bases -- B1 RAM word-operations, B2 bit-operations,
      B3 logic gates, B4 gates plus a memory-access penalty, B5 Wiener full
      cost -- and the measured quantity is where in that sequence of bases the
      ordering changes, and by how much.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this proposal, so that the
      candidate cannot regress into a variant of them under new notation:
      (a) building or improving any ISD variant, including any birthday,
      representation-technique, nearest-neighbour or quantum-Grover refinement;
      (b) algebraic key-recovery on the Goppa structure (the
      distinguisher/square-code/syzygy family -- that is
      IDEA-20260805-9704d9's lane, deliberately disjoint);
      (c) decoding-failure, side-channel, fault and implementation attacks,
      which RQ-MCE-e65b3c already fences off as a separate claim class;
      (d) generic-group and information-theoretic lower bounds on syndrome
      decoding.
      What is NOT off-limits, and is the whole proposal, is the accounting
      basis -- which is not an attack family at all, and is why this candidate
      is not a repackaging of any row above.
    newness_score: >-
      The full-cost model is 2004 mathematics (KN-LIT-094 via KN-TECH-035) and
      the ISD exponents are published; neither ingredient is new. What is new,
      and what the corpus is measured to lack, is their composition: grep over
      experiments/ and ledger/evidence/ returns no ISD cost computation of any
      kind, and the one costing document that exists
      (coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md,
      READ for this proposal) fixes an accounting basis and states in its own
      section 0 that it "contains no arithmetic" and "is not a source of
      numbers". So the basis is drafted, the numbers are absent, and the
      composition has never been performed. The newness is compositional and
      is claimed as exactly that.
    testability_score: >-
      Very high and almost free. Stage 1 is one page of algebra plus an exact
      integer computation of Prange's cost at five parameter sets already
      transcribed and independently recomputed by this goal's own BATCH-001
      (EV-MCE-332f99 O-1) -- pure Python, no dependency, seconds. Stage 2 needs
      one published table transcribed. There is no solver, no lattice library,
      and no field arithmetic anywhere in the critical path.
    survival_score: >-
      The tracked object survives to the end by construction, because it is
      defined by the bases rather than by any structure that can dissolve. The
      risk is the mirror one and is addressed in the audit below: a ranking
      permutation that never changes across bases is a constant, and a constant
      is not a finding.

  mechanism: >-
    STEP 1 -- THE FULL-COST EXPONENT OF A REPEAT-UNTIL-SUCCESS ALGORITHM,
    DERIVED HERE, NOT CITED.
    Every ISD variant in the lineage has the same skeleton: an outer loop of
    N_it independent randomised iterations (permute the columns, Gaussian-
    eliminate, search a structured subspace), each iteration costing C_it time
    and occupying M memory, with overall time T = N_it * C_it. Write, in a
    fixed asymptotic regime and with n the code length,
      N_it = 2^(n*iota*(1+o(1))),  C_it = 2^(n*gamma*(1+o(1))),
      M    = 2^(n*mu*(1+o(1))),    T = 2^(n*tau*(1+o(1))), tau = iota + gamma.
    Wiener full cost is FC = (hardware quantity) * (time occupied). A memory
    cell is hardware and it is occupied for the entire run, so
      FC >= M * T = 2^(n*(tau+mu)*(1+o(1))).
    STEP 2 -- WHY tau+mu AND NOT SOMETHING SOFTER: PARALLELISATION INVARIANCE.
    The obvious objection is that tau can be bought down with processors. Run P
    of the independent outer iterations concurrently. Time becomes T/P;
    hardware becomes P*M, because each of the P copies needs its own list
    memory. Then FC = (P*M)*(T/P) = M*T, unchanged. The exponent tau+mu is
    therefore invariant under exactly the parallelisation that makes the
    step-count comparison look improvable, which is why it -- and not tau -- is
    the comparator. Sharing one memory between P processors does not rescue the
    objection: it reintroduces the wiring cost that KN-TECH-035 records as
    turning BSGS's n^(1/2) step count into n^(2/3) full cost, so the shared
    variant pays a different penalty rather than none.
    STEP 3 -- THE DECISION RULE, AND WHY IT BITES THIS FAMILY SPECIFICALLY.
    Prange stores only the permuted parity-check matrix, so mu_Prange = 0 and
    phi_Prange := tau_Prange + mu_Prange = tau_Prange. Hence
      V beats Prange under full cost  <==>  tau_V + mu_V < tau_Prange.
    The whole advanced-ISD lineage (Stern, Dumer, MMT, BJMM, May-Ozerov,
    Both-May) obtains tau_V < tau_Prange by INCREASING gamma -- doing more work
    per iteration inside a structured list search -- so as to DECREASE iota.
    That is a trade of iterations for per-iteration work, and full cost charges
    the per-iteration side twice whenever the lists are the memory.
    STEP 4 -- A SECOND, SHARPER FORCED VALUE: mu = gamma FOR LIST-BASED ISD.
    In every representation-technique variant the dominant per-iteration
    operation is building and merging lists whose SIZE is the thing stored.
    Building a list of size L costs Theta~(L) and storing it costs Theta~(L),
    so up to sub-exponential factors mu_V = gamma_V, whence
      phi_V = tau_V + mu_V = iota_V + 2*gamma_V.
    The full-cost comparison against Prange therefore reduces to
      iota_V + 2*gamma_V  <  iota_Prange,
    i.e. the algorithm must buy back TWICE the per-iteration exponent it spends.
    THIS IS A FORCED VALUE AND IT CAN FAIL: mu_V = tau_V - iota_V is checkable
    against any published (time exponent, memory exponent) pair for which the
    success probability -- hence iota_V -- is also published, and a variant
    whose per-iteration work is superlinear in its list size (May-Ozerov's
    nearest-neighbour search is the named candidate; NOT READ -- relayed) will
    violate it. Detecting the violation is informative, not fatal: it locates
    the variants for which time and memory genuinely decouple.
    STEP 5 -- THE REGIME PROBLEM, STATED BEFORE IT IS DISCOVERED.
    All of the above is written for the constant-rate, constant-relative-weight
    regime in which published ISD exponents are stated, where costs have the
    shape 2^(c*n). Classic McEliece does not live there: it uses w = t with
    t*m < n and w/n small (EV-MCE-332f99 O-1 gives k/n between 0.729167 and
    0.796875, and the specification's k = n - m*t forces w/n = t/n well below
    any half-distance value). KN-LIT-fa9bc8 (Canto Torres-Sendrier, NOT READ --
    relayed via its own corpus entry) reports that in the SUB-LINEAR weight
    regime the asymptotic advantage of advanced ISD over Prange largely
    disappears in TIME ALONE. If that is right, then full cost is a second and
    independent reason for the same ordering, and the honest deliverable is to
    report the two reasons separately rather than to let one borrow the other's
    force. The regime dependence is therefore not a nuisance parameter: it is
    the graded axis of the experiment.
    STEP 6 -- THE CONCRETE SIDE, WHICH NEEDS NO TRANSCRIPTION AT ALL.
    Prange's cost at fixed (n, k, w) is exactly computable in integer
    arithmetic. Success probability per iteration is
      P = C(n-k, w) / C(n, w)
    (all w errors must fall in the n-k redundancy coordinates of the chosen
    information set), so the expected iteration count is its reciprocal, and
      log2 N_it = log2 C(n,w) - log2 C(n-k,w) = sum_{i=0}^{w-1} log2((n-i)/(n-k-i)).
    Each factor (n-i)/(n-k-i) is STRICTLY INCREASING in i, because
      d/di [(n-i)/(n-k-i)] = k/(n-k-i)^2 > 0,
    so the closed form w*log2(n/(n-k)) is a STRICT LOWER BOUND on the exact
    value for every k > 0 and w > 1. That inequality is a forced value derived
    before any run, it is one line, and it can be falsified by a single
    parameter set. Multiplying N_it by a declared per-iteration Gaussian-
    elimination cost and by a declared basis conversion gives the concrete
    memory-charged Prange baseline at all five Classic McEliece parameter sets
    -- completion criterion 2 of GOAL-MCE-001, computed from numbers this goal
    has already transcribed and independently recomputed, with no unobtainable
    source in the path.
    STEP 7 -- WHY THIS IS NOT A CONVENTION ADOPTION, WHICH THE GOAL FORBIDS.
    GOAL-MCE-001.objective_correction and DEC-20260803-a5b9b1 D-3 establish
    that ISD-FC-2026 is NOT adopted and that this goal may not bind to it, while
    RQ-MCE-e65b3c.constraints still says to bind to it and not derive a
    competing one. Both instructions are satisfied at once by refusing to
    choose: every number is reported under ALL FIVE bases simultaneously, as a
    basis-indexed table, so the deliverable commits to no convention and adopts
    none. A basis-parametric result is also strictly more useful than a
    basis-committed one, because the load-bearing output is the SET OF BASES AT
    WHICH THE RANKING CHANGES, which a single-basis table cannot express.

  novelty_status: unverified

  literature_context:
    - >-
      KN-TECH-035 (READ, in repo) states the full-cost model and its worked
      consequence: BSGS needs n^(1/2+o(1)) processor steps but has full cost
      n^(2/3+o(1)), while parallel collision search keeps its advantage under
      the same accounting because per-processor storage stays small. It also
      records Wiener's own caution, which this proposal adopts verbatim as a
      scope rule: step counting is CONSERVATIVE FROM THE DEFENDER'S SIDE, so
      using step counts to choose key sizes is safe, and full cost is unsafe
      only when used to declare two algorithms equivalent. Its underlying
      source KN-LIT-094 was NOT READ here; KN-TECH-035 is the relay.
    - >-
      coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md
      (READ, in repo, 759 lines). Its section 2.1 enumerates the five bases
      B1-B5 used above, verbatim, and its section 0 states that the document
      "contains no arithmetic" and "is not a source of numbers". This proposal
      uses its BASIS TAXONOMY as a checklist and takes no rule, no rate and no
      number from it, because it is not adopted (DEC-20260802-344883 D-6,
      DEC-20260803-a5b9b1 D-3).
    - >-
      KN-LIT-fa9bc8 (Canto Torres-Sendrier, "Analysis of information set
      decoding for a sub-linear error weight", PQCrypto 2016, DOI
      10.1007/978-3-319-29360-8_10). NOT READ -- relayed claim, and its own
      corpus entry says the full text was not read and no figure reproduced.
      Relayed content used here only as a hypothesis to test: in the sub-linear
      weight regime the asymptotic advantage of advanced ISD over Prange
      largely disappears. Obtaining and checking this is a stage of the
      experiment, not an assumption of it.
    - >-
      KN-LIT-6923 (Esser-Bellini, "Syndrome Decoding Estimator") and
      KN-LIT-4875 (Esser-May, "McEliece needs a Break"). Both carry
      citation_verified read against the absent downloads/ tree flagged by
      KN-OPEN-3f7a21, so their `read` provenance is UNCONFIRMED and neither is
      treated as read here. GOAL-MCE-001's own checkpoint records
      TASK-20260803-f3aece READING the Esser-Bellini SEC Table 1 and DECLINING
      to transcribe it, deferring to the non-existent ISD-FC-2026 binding --
      the exact deliverable this proposal needs and the exact reason it is
      missing.
    - >-
      KN-LIT-27f923 and KN-LIT-4388b3 (Esser, Ramos-Calderer, Bellini et al.,
      quantum and hybrid ISD resource estimation, iacr:2021/1608 and
      iacr:2022/964). NOT READ. Named because a resource-estimation paper is
      the most likely place a published memory column already exists, which
      would make part of stage 2 a transcription rather than a derivation --
      and if it also already performs a full-cost comparison, this proposal's
      novelty claim is falsified and must be withdrawn. Checking that is a
      declared step.

  lossy_projection_identifiability_audit:
    projection: >-
      A fully specified algorithm-plus-parameter-set instance (the variant's
      pseudocode, its parameter optimisation, the code family, the concrete
      (n,k,w)) is projected to the single ordered pair (tau, mu) of asymptotic
      time and memory exponents, and then to the one number phi = tau + mu.
    what_is_discarded: >-
      Everything except two exponents: all constants, all polynomial factors,
      the entire internal structure of the algorithm, the parameter
      optimisation, the code family, and the sub-exponential terms hidden in
      o(1). The fibre over an observed (tau, mu) is enormous.
    why_genuinely_lossy: >-
      Strictly and demonstrably lossy in the direction that matters: the map is
      many-to-one on the algorithm side, and two algorithms with different
      internal structure and different practical behaviour can share a fibre.
      This is NOT the (Delta, Pi) = (x XOR y, x*y) failure of KN-LIT-7595,
      where the pair is recoverable as the roots of t^2 + Delta*t + Pi. There is
      no inverse map from (tau, mu) back to an algorithm, and none is claimed
      or needed.
    why_compatible_with_the_operations: >-
      The retained part propagates deterministically through the target's
      operation, which here is COST COMPOSITION, and that is exactly what the
      derivation in mechanism steps 1-2 establishes. Multiplying hardware by
      time is multiplication of exponentials, so it acts on exponents by
      addition; parallelising by P multiplies one factor and divides the other,
      so it acts as the identity on phi. The projection commutes with the
      operations the accounting basis performs, which is the compatibility
      condition the lossy-projection test asks for.
    is_it_only_a_change_of_coordinates: >-
      NO -- and the check that establishes it is the interesting one. If the
      basis change were merely a relabelling, the ranking permutation would be
      IDENTICAL under B1 and B5, in which case the tracked object is constant
      across instances and this proposal has hit the MIRROR failure mode, not
      the change-of-coordinates one. That is precisely the failure mode checked
      for, and the check is the primary metric: the number of ranking
      inversions between bases. The check returns a definite answer either way
      -- zero inversions is the mirror failure and is reported as such rather
      than dressed up -- and the null arm of the experiment (a variant list with
      mu forced to 0, where zero inversions is FORCED) exists so that a zero on
      the treatment arm can be told apart from an instrument that cannot
      produce a nonzero.

  assumptions:
    - >-
      That published ISD exponent tables report time and memory in a stated
      regime that can be identified from the text. If a table's regime is
      ambiguous, the entry is recorded as unusable rather than guessed.
    - >-
      That "memory is occupied for the whole run" holds for the variants
      compared. It is FALSE for an algorithm that streams and discards, and the
      experiment must classify each variant rather than assume. Prange is the
      classified-as-streaming case and is the reason mu_Prange = 0.
    - >-
      That the RAM-model exponents and the full-cost model are being applied to
      the same problem instance family. Mixing a full-distance-decoding exponent
      with a half-distance-decoding one is the most likely bookkeeping error and
      is guarded by a declared regime column on every row.

  predictions:
    - metric: >-
        FV-1 direction test. Sign of
        [log2 C(n,w) - log2 C(n-k,w)] - w*log2(n/(n-k))
        at each of the five Classic McEliece parameter sets, computed in exact
        integer/rational arithmetic from the (m,n,t) already transcribed and
        independently recomputed in EV-MCE-332f99 O-1.
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE at all five sets, 5 of 5, no exceptions. Derived
        before any run from d/di[(n-i)/(n-k-i)] = k/(n-k-i)^2 > 0. A single
        non-positive value falsifies the derivation and the whole concrete
        stage must be re-derived before anything else is reported. A
        forced value with a one-line proof is the cheapest falsifier available
        and it is placed first for that reason.
    - metric: >-
        FV-1b magnitude. The relative gap
        (exact - approx)/exact for the same quantity, five sets.
      direction: lower
      minimum_effect: >-
        Below 0.05 at every set, predicted before the run. The prediction is
        stated because it is falsifiable, not because it is important: if the
        gap exceeds 5 per cent the closed form is not usable as a sanity check
        and the exact computation must be reported alone.
    - metric: >-
        n_inversions_B1_to_B5. The number of ordered variant pairs (V, W) whose
        relative order under basis B1 (RAM word-operations, memory free)
        differs from their order under basis B5 (Wiener full cost), over the
        declared variant list.
      direction: higher
      minimum_effect: >-
        AT LEAST 1, and the pre-registered specific instance is
        (Prange, BJMM): the prediction is that Prange is ranked below BJMM
        under B1 and above it under B5, in the constant-rate half-distance
        regime, PROVIDED the transcribed mu_BJMM satisfies
        mu_BJMM > tau_Prange - tau_BJMM. That proviso is stated as an
        inequality on transcribed numbers, NOT as a claim about their values:
        no exponent value is asserted anywhere in this record, because none has
        been read. If the transcribed numbers fail the proviso, the prediction
        is not falsified -- it was conditional -- and the reported result is
        the honest negative: full cost does not reorder this family, the cell
        closes, and three goals get the answer they asked for.
    - metric: >-
        FV-2 list-identity check. For each list-based variant with a published
        success probability, the residual |mu_V - (tau_V - iota_V)|.
      direction: lower
      minimum_effect: >-
        Below 0.02 in exponent units for at least the pure representation-
        technique variants (MMT, BJMM), derived from mechanism step 4. A larger
        residual identifies a variant whose per-iteration work is superlinear
        in its stored list, which is a REPORTABLE STRUCTURAL FACT rather than a
        failure, and it is pre-declared here so that it cannot be presented as
        a surprise confirmation afterwards.
    - metric: >-
        Graded regime sweep. The full-cost margin phi_V - phi_Prange as a
        function of relative weight W = w/n, evaluated at at least five points
        from the half-distance value down to Classic McEliece's actual t/n, for
        every variant whose exponents are transcribed with a stated
        W-dependence.
      direction: different
      minimum_effect: >-
        MONOTONE in W for every variant, with the sign of the margin either
        constant or changing at most once, and the crossing point reported to
        three significant figures where it exists. Non-monotonicity, or more
        than one sign change, indicates a parameter-optimisation artifact in
        the transcribed formula rather than a structural fact, and halts the
        regime arm.

  minimal_test:
    design: >-
      Four stages, strictly cheapest first, each able to terminate the line.
      STAGE 0 (zero compute, minutes): re-derive mechanism steps 1-4 on paper
      and have them attacked. If FC = M*T is wrong, or if the parallelisation
      invariance argument fails, the proposal dies here at zero cost.
      STAGE 1 (pure-Python integers, seconds): compute the exact Prange
      iteration count and the FV-1 inequality at all five Classic McEliece
      parameter sets from the transcribed (m, n, t), and emit the concrete
      memory-charged Prange baseline under all five bases. This stage alone
      discharges the computable half of GOAL-MCE-001 completion criterion 2 and
      needs no external source.
      STAGE 2 (transcription, hours, network): obtain and transcribe published
      (time exponent, memory exponent, regime) triples for the declared variant
      list, with the transcription independently controlled in the manner
      GOAL-HQC-001 BATCH-001 established after its own RS-S3 error. Every row
      that cannot be obtained is recorded as ABSENT, never estimated.
      STAGE 3 (pure-Python, seconds): compute phi = tau + mu per row, emit the
      basis-indexed ranking table, count inversions, run the graded regime
      sweep, and report.
      The decisive-and-cheapest gate is STAGE 0, and STAGE 1 is decisive for
      the concrete deliverable independent of everything downstream.
    controls:
      - >-
        NULL OBJECT (mu-zeroed arm). Take the identical variant list, set every
        mu_V := 0, and run the identical basis-indexed ranking pipeline.
        FORCED VALUE DERIVED BEFORE THE RUN: the number of inversions between
        B1 and B5 is EXACTLY 0, because with mu = 0 the full-cost exponent
        equals the time exponent for every row and the two orderings are
        literally the same list. This null CAN FAIL -- a wiring-latency term
        applied per-row, an off-by-one in the sort, or a tie-breaking rule that
        consults memory would all produce a nonzero -- so it is a null and not
        a decoration. If it returns nonzero, the pipeline manufactures
        inversions and NO result from the treatment arm may be reported.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT (the published inversion that MUST
        appear). Feed the pipeline the pair {BSGS, Pollard rho} for a generic
        group of order N, with the exponents KN-TECH-035 records: both
        N^(1/2+o(1)) in processor steps, BSGS N^(2/3+o(1)) and rho
        N^(1/2+o(1)) in full cost. The pipeline MUST rank them tied-or-BSGS-
        favoured under B1 and strictly rho-favoured under B5, reproducing the
        2/3 versus 1/2 separation. If it does not, the instrument cannot detect
        the canonical inversion it exists to detect, it is broken, and NO
        negative result about ISD may be reported at all. Threshold declared
        before the run: the computed full-cost exponents must be 2/3 and 1/2 to
        within 0.001.
      - >-
        GRADED CONTROL (five interior points, monotonicity reported). Build a
        synthetic ladder of hypothetical variants sharing one time exponent
        tau_0 and carrying mu in {0, 0.25, 0.50, 0.75, 1.00} * tau_0, and
        report the count of ladder members that beat a fixed Prange row under
        full cost. FORCED: that count is NON-INCREASING in mu, and it is
        exactly the count of members with tau_0 + mu < tau_Prange. A
        non-monotone result localises the fault in the comparator rather than
        leaving "it did not work", and the ladder costs nothing.
      - >-
        ORDERING CONTROL. The null arm and both synthetic controls are
        computed, hashed and committed BEFORE any transcribed exponent is read
        into the pipeline. A pipeline tuned after seeing the real numbers is
        not an instrument.
      - >-
        ARCHIVE CHECK (zero compute, recorded as a result either way). Search
        experiments/, ledger/evidence/ and knowledge/ for any prior ISD cost
        computation, any prior full-cost comparison of ISD variants, and any
        prior use of the tau+mu comparator. The search performed for this
        proposal returned NONE in experiments/ or ledger/evidence/; that is
        recorded here as a measured absence with its method stated, and
        AGENTS.md's retrieval policy applies -- absence of a search result is
        not evidence that something was not tried.
    required_metrics:
      - exact log2 iteration count and the FV-1 residual at each of five parameter sets, with the integer arithmetic reproducible
      - the concrete Prange baseline at each parameter set under each of the five bases, with every conversion factor stated as a formula
      - per-variant (tau, mu, regime, source, page or table number, obtained-or-ABSENT) with the transcription controlled by a second reader
      - the basis-indexed ranking table and the inversion count, treatment and null arms side by side
      - the BSGS/rho positive-control exponents to three decimals
      - the graded ladder counts at all five mu points

  falsification_conditions:
    - >-
      FV-1 returns a non-positive sign at any parameter set. The one-line
      monotonicity derivation is then wrong, and every concrete number in the
      package is suspect until it is re-derived.
    - >-
      The null arm returns a nonzero inversion count. The pipeline is
      manufacturing inversions; nothing may be reported.
    - >-
      The BSGS/rho positive control fails to reproduce 2/3 versus 1/2. The
      instrument is broken and no negative may be reported (inventor protocol
      section 3, and the T-C obligation that a named instrument must have a
      demonstrated sensitivity).
    - >-
      A published source is found that already performs the full-cost or AT^2
      re-costing of the ISD family. The novelty claim is then FALSE, must be
      withdrawn in a superseding record, and the correct deliverable becomes
      transcribing and checking that source instead.
    - >-
      The transcribed memory exponents make tau_V + mu_V < tau_Prange for the
      advanced variants at Classic McEliece's regime. Full cost then does NOT
      reorder the family, the headline framing of this proposal is wrong, and
      the honest deliverable is the negative table -- which is still the
      deliverable all three code-based goals asked for and is still worth the
      cost of getting it.

  confounders:
    - >-
      REGIME MIXING. Full-distance versus half-distance decoding, constant
      versus sub-linear relative weight, and worst-case-over-rate versus
      at-a-fixed-rate exponents are four axes on which published tables differ,
      and combining rows from different axes produces a ranking that is an
      artifact of the combination. Every row carries an explicit regime column
      and cross-regime rows are never compared.
    - >-
      THE o(1) TERM. Full cost is asymptotic with unextracted constants
      (KN-TECH-035's own applicability limit). It settles exponent-level
      comparisons and cannot settle a claimed constant-factor advantage. At
      n = 6960 an exponent difference of 0.005 is about 35 bits and an
      unextracted polynomial factor can be 30. The asymptotic table and the
      concrete table are therefore reported as two separate objects and neither
      is used to argue the other.
    - >-
      THE TIME-MEMORY TRADEOFF CURVE. Published papers usually report ONE point
      on a variant's tradeoff curve, normally the time-optimal one. phi
      computed from that point is an UPPER BOUND on the variant's true
      full-cost exponent, so a negative ("V does not beat Prange under full
      cost") is weaker than it looks and must be stated as scoped to the
      published operating point. Memory-restricted variants are known to exist
      in the literature (NOT READ -- relayed); locating them is declared future
      work and their absence from the table is declared, not hidden.
    - >-
      DEFENDER-SIDE DIRECTION. Wiener's own caution (KN-TECH-035) means this
      result cannot be used to say Classic McEliece is weaker. If anything it
      says the published estimates are conservative. A cost audit that comes
      out in the defender's favour is still a result and must be reported with
      the same energy as one that does not -- KN-TECH-050's rule, inherited
      here as a rule rather than a sentiment.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED AND NO SCHEME IS WEAKENED. The output is an
      accounting statement about a family of published algorithms plus a
      concrete baseline table. It cannot support any claim about Classic
      McEliece's security in either direction, and RQ-MCE-e65b3c's toy
      claim-tier ceiling is untouched.
    - >-
      The asymptotic half is a statement about exponents in a named regime and
      says nothing about n = 6960. The concrete half is a statement about
      Prange at five parameter sets under declared bases and says nothing
      asymptotic. Citing either as the other is the error this record exists
      partly to prevent.
    - >-
      A negative outcome closes exactly the variants transcribed, at exactly
      the operating points published, under exactly the five declared bases.
      Forward guidance is mandatory and is named here in advance: the
      memory-restricted variants of MMT/BJMM, the quantum resource estimates
      (KN-LIT-27f923, KN-LIT-4388b3), and the sub-linear-weight analysis of
      KN-LIT-fa9bc8 all remain open lanes on this same object.

  heuristic_assumptions:
    - id: HEUR-FC-1
      statement: >-
        For every variant in the declared list, the memory reported in the
        source is occupied for essentially the whole running time (not
        streamed, not amortised across iterations, not reused between
        independent restarts in a way that lowers the peak).
      rigorous_support: >-
        Structural rather than probabilistic: the representation-technique
        variants build lists inside one iteration and consume them inside that
        iteration, so the peak coincides with the per-iteration work, and the
        outer loop repeats that pattern. This is the standard reading of the
        pseudocode; it is NOT verified from primary text here and is labelled
        accordingly.
      validation_plan: >-
        Classify each variant from its published pseudocode as STREAMING or
        RESIDENT and record the classification with its textual basis. A
        variant that cannot be classified from the obtained text is recorded as
        UNCLASSIFIED and excluded from the ranking rather than assumed
        RESIDENT.
    - id: HEUR-FC-2
      statement: >-
        For pure representation-technique variants, mu = gamma up to
        sub-exponential factors, i.e. stored list size and per-iteration work
        share an exponent.
      rigorous_support: >-
        Building and merging a list of size L costs Theta~(L) with hashing and
        storing it costs Theta~(L). Derived here, not cited. The failure mode
        is a variant whose merge is superlinear in list size.
      validation_plan: >-
        The FV-2 residual |mu_V - (tau_V - iota_V)| computed per variant from
        transcribed numbers, with a pre-declared 0.02 threshold, and the
        violating variants named rather than dropped.
    - id: HEUR-FC-3
      statement: >-
        Wiener full cost FC = hardware * time is the correct accounting for a
        comparison of this kind, and its wiring model (three spatial
        dimensions, one technology abstraction) does not invert any conclusion
        drawn here.
      rigorous_support: >-
        None offered beyond KN-TECH-035's own statement of the model and its
        own declared applicability limits, which are quoted rather than
        paraphrased in the confounders above. KN-LIT-094 was NOT READ. This is
        the load-bearing external assumption of the entire proposal and it is
        recorded as such rather than buried.
      validation_plan: >-
        Report every number under all five bases, so that a reader who rejects
        B5 still gets B1-B4 and can see exactly which conclusions depend on the
        rejected basis. This is why the deliverable is basis-parametric and it
        is the reason, not a side effect.

  target_complexity:
    exponent_moved: >-
      NONE for the attacker, and the record says so plainly. What may move is
      WHICH published exponent is the correct baseline for three code-based
      schemes -- Classic McEliece, HQC and SDitH -- which is an exponent-level
      reordering rather than an exponent-level improvement. Under B1 the
      baseline is the smallest transcribed tau; under B5 it is the smallest
      transcribed tau + mu, and Prange's row is unchanged between them.
    memory_exponent: >-
      Prange: polynomial, mu = 0, and this is the whole reason its row does not
      move between bases. Every other row's mu is a transcription target and no
      value is asserted here.
    best_known: >-
      NOT ASSERTED. The corpus holds no transcribed ISD exponent table and this
      record refuses to supply one from memory. Naming the best-known time
      exponent is the first output of stage 2, not an input to this proposal.
    hidden_overhead: >-
      Polynomial factors in n throughout, plus the unextracted constants
      KN-TECH-035 declares in the full-cost model itself, plus the sub-
      exponential factors in every ISD exponent statement. At the concrete
      stage these are made explicit as declared formulas rather than absorbed.

  dominated_by: >-
    n/a (no algorithm and no attack is proposed, so there is no Pareto point to
    dominate). Rows checked, and listed as the contract requires. TIME: no ISD
    time computation exists anywhere in experiments/ or ledger/evidence/ (grep
    over both trees for information-set-decoding and ISD returned only
    compressed unrelated artifacts and EV-HQC-9906b9, which is a
    source-acquisition record explicitly stating no measurement was made).
    MEMORY: no ISD memory figure exists in the corpus; the only memory-charging
    document is the unadopted ISD-FC-2026 draft, which states it contains no
    arithmetic. DATA/QUERIES: not an axis here -- syndrome decoding takes one
    instance and makes no oracle queries, so the data axis is constant across
    every row and cannot dominate. PREPROCESSING: none is used by any row;
    Prange and the list variants all start from the public matrix. The
    incumbent this proposal is measured against is therefore the PUBLISHED
    literature's ranking rather than anything internal, and that ranking is
    what stage 2 transcribes.
  sota_delta: >-
    Quantitatively, in the two possible outcomes.
    (1) If the ranking inverts: the baseline exponent for syndrome decoding at
    Classic McEliece's regime changes from the smallest published tau to
    tau_Prange, and the delta is exactly (min_V tau_V) - tau_Prange in exponent
    units, applied to three schemes at once. In bits at n = 6960 that is
    6960 * (tau_Prange - min_V tau_V), a quantity the experiment computes and
    this record does not guess.
    (2) If it does not invert: the delta is zero and the deliverable is the
    first ISD cost table in this repository, with an explicit statement that
    full cost does not reorder the family at the published operating points --
    which is the negative GOAL-MCE-001, GOAL-HQC-001 and GOAL-SDITH-001 each
    named as deliverable number one and none has produced.
    Independent of both: the concrete memory-charged Prange baseline at five
    Classic McEliece parameter sets currently does not exist in this corpus, so
    its delta against the incumbent internal state is "from nothing to a
    reproducible exact table".

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.55 that the full-cost comparator changes the ranking of at least one
    published variant pair against Prange in at least one of the declared
    regimes. It is not lower because the derivation phi = tau + mu is
    elementary and unconditional given the model, because the entire advanced-
    ISD lineage buys time with memory by construction so it is exposed to the
    charge in the most direct possible way, and because KN-LIT-fa9bc8 reports
    (relayed) that the time advantage already collapses in the regime McEliece
    occupies, so the margin being attacked is small before memory is charged at
    all. It is not higher because the memory exponents are unread and may
    simply be small enough -- several ISD variants are described as using
    modest memory relative to their time, and if mu_V is well below
    tau_Prange - tau_V for every V the ranking is untouched; because the
    published operating point may not be the memory-optimal one, so a variant
    can lose at its published point and win elsewhere on a curve nobody
    transcribed; and because a 2016 sub-linear-weight analysis being right
    would make part of the result redundant with published work.
    Separately and much higher: 0.95 that the CONCRETE stage produces the
    Prange baseline table, because it depends on nothing but arithmetic over
    numbers this goal has already transcribed and independently recomputed.
