idea:
  id: IDEA-20260905-809a81
  title: Torsion-translate norms distinguish point data from new information
  class: mechanism
  claim: 'Let ell be coprime to pN. A full auxiliary-torsion orbit norm of a rational function evaluated at Q is
    point-dependent but translation-invariant under E[ell], hence factors through the quotient by E[ell]. Conjecture:
    partial Galois-orbit norms retain extra arithmetic structure only at a complexity cost visible in their residual
    stabilizer and field of definition.'
  mechanism: Start from the divisor of a rational function and sum its translations by a finite torsion subgroup.
    The resulting divisor descends through a separable quotient; this explains why some elaborate public torsion
    observables merely encode a known multiplication map. A partial orbit lacks full translation invariance, leaving
    a smaller stabilizer and potentially higher descent complexity. The non-generic resource is that residual rational
    function, not division-polynomial splitting that depends only on the curve. Pairing-type constructions are compared
    at the level of their divisor and Galois invariance, without giving an extraction procedure.
