idea:
  id: IDEA-20260807-9fb27c
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    THE sqrt-VELU COST-MODEL RE-AUDIT, AND WHY THE KNIFE EDGE IS ILLUSORY: the
    minimal non-scalar endomorphism of an ordinary E/F_p has degree
    d = |D|/4 ~ p, so a naive application of the square-root Velu cost model
    Otilde(sqrt(d)) would put its evaluation at Otilde(sqrt(p)) -- exactly the
    rho birthday bound -- but that cost is counted in operations over the field
    containing a KERNEL GENERATOR, and Frobenius acts on the cyclic kernel
    Z/d as the scalar lambda = -u v^{-1} mod d, so the generator lives in
    F_{p^m} with m = ord_d(lambda), predicted ~d; the tracked object is the
    triple (d, lambda, m), the audit is falsifiable at toy scale by direct
    computation of m, and the record additionally enumerates every corpus
    barrier that charges an isogeny-evaluation cost so the question "does any
    ledger exponent flip sign under the corrected cost model" gets a measured
    answer rather than a shrug
  class: measurement

  claim: >-
    (A) THE WORRY THIS RECORD EXISTS TO SETTLE, STATED SO IT COULD WIN.
    Several cost arguments in this corpus charge "evaluating a degree-d isogeny
    costs Otilde(d)". If a square-root Velu style algorithm evaluates a
    cyclic-kernel degree-d isogeny in Otilde(sqrt(d)) operations, then any
    barrier resting on the Otilde(d) figure is stale, and the arithmetic lands
    on a knife edge: for an ordinary E/F_p with Frobenius trace t and
    D = t^2 - 4p, the minimum degree of a NON-SCALAR endomorphism is
      min_{v != 0, u} N(u + v pi) = min_u (u^2 + u t + p) = p - t^2/4 = |D|/4,
    attained at v = ±1, u = round(-t/2). For generic t = O(sqrt(p)) this is
    Theta(p). So Otilde(sqrt(d)) = Otilde(sqrt(p)) would TIE the 0.886 sqrt(N)
    rho baseline (KN-TECH-001, KN-TECH-006) rather than beat it -- but a tie at
    the birthday bound is close enough to the campaign's stated target profile
    that it must be checked rather than assumed away.

    (B) THE CORRECTION, AND IT IS ALGEBRAIC AND COSTS NO COMPUTE. The
    square-root Velu bound counts operations IN THE FIELD OF DEFINITION OF A
    KERNEL GENERATOR, because the algorithm's baby-step/giant-step structure is
    run over the multiples of a generating point of the kernel. Now let
    alpha = u + v pi be primitive (not divisible by a rational integer) with
    d = deg alpha = N(alpha). Then:
      (B1) ker alpha is a CYCLIC subgroup of order d and is GALOIS-STABLE,
           because alpha commutes with pi (O is commutative). So the SUBGROUP
           is F_p-rational and the kernel polynomial has coefficients in F_p.
      (B2) The POINTS are a different matter. On ker alpha we have
           u + v pi = 0, hence (assuming gcd(v, d) = 1) pi acts on
           ker alpha = Z/d as multiplication by the scalar
             lambda = -u v^{-1} mod d,   and with v = 1, lambda = -u mod d.
           A generator T of ker alpha satisfies pi^m(T) = T iff
           lambda^m = 1 mod d. Therefore the smallest field containing a kernel
           generator is F_{p^m} with
             m = ord_d(lambda),  the multiplicative order of lambda mod d.
      (B3) Consequence. The square-root Velu cost for alpha is
             Otilde(sqrt(d)) operations in F_{p^m}
             = Otilde(sqrt(d) * m)  F_p-operations, up to log factors.
           With d ~ p and m generically ~d ~ p this is Otilde(p^{3/2}), which
           is WORSE than the Otilde(d) = Otilde(p) figure the corpus already
           charges, not better. THE KNIFE EDGE IS ILLUSORY, and it is illusory
           in the unfavourable direction.

    (C) THE SECOND, INDEPENDENT KILL, RECORDED BECAUSE ONE OBSTRUCTION IS NOT A
    CLOSURE. Suppose (B) failed -- suppose some family had m = polylog(p) and
    the endomorphism really were evaluable in Otilde(sqrt(p)). It would still
    be worthless, by H-ENDO-001 / KN-FIND-b7e091: alpha acts on the
    prime-order subgroup G = <P> as multiplication by the scalar
      mu(alpha) = u + v mod N,
    because pi acts as the identity on E(F_p). That scalar is computable in
    O(1) integer operations from (u, v, N) and [mu]P in O(log N) group
    operations. So the expensive isogeny evaluation returns a point that a
    scalar multiplication already returns. The two kills are INDEPENDENT: (B) is
    about cost, (C) is about information, and each alone suffices.

    (D) WHERE SQUARE-ROOT VELU *DOES* APPLY IN THIS CORPUS, AND WHY IT MOVES
    NOTHING. The isogenies this campaign actually evaluates are the class-group
    action steps: an ideal l of prime norm ell with ell SMALL and the
    ell-torsion eigenspace F_p-rational (the CSIDH/Kohel-style step). There
    m = 1 or 2 by construction and d = ell = polylog(p) in every design in the
    ledger. Square-root Velu is then a genuine improvement of poly(ell) to
    Otilde(sqrt(ell)) -- a CONSTANT-FACTOR or low-degree-polynomial gain inside
    an already-polylog step. It multiplies no exponent. In particular it does
    NOT move IDEA-20260807-c36472's Otilde(p^{1/4}) transport figure, which
    counts ACTION EVALUATIONS and not field operations inside one evaluation,
    and it does NOT move the h ~ p^{1/2} identification cost that record
    identifies as the real T5 barrier.

    (E) THE PREDICTED ANSWER TO THE AUDIT QUESTION, PRE-REGISTERED. "Does any
    exponent stated in the ledger flip sign under the corrected cost model?"
    PREDICTED: NO, zero exponents flip, for the structural reason in (D) --
    every isogeny the corpus evaluates has a rational or near-rational kernel
    and polylog degree, where the sqrt saves a cofactor and not an exponent;
    and the one large-degree object, the CM endomorphism, is killed twice over
    by (B) and (C). The audit is worth running anyway because its deliverable
    is an enumerated table (barrier, charged cost, kernel rationality, corrected
    cost, exponent moved yes/no), which is what makes this a closure at the
    docs/inventor-protocol.md section 4 standard instead of a reassurance.

    (F) WHAT WOULD MAKE THIS RECORD WRONG, AND IT IS A REAL POSSIBILITY. m is
    an arithmetic quantity nobody in this corpus has computed. If m is
    systematically small -- say m = O(polylog p) on a family of ordinary curves
    identifiable in advance -- then (B) lapses on that family, the Otilde(sqrt
    p) tie is real, and the family becomes an object worth naming even though
    (C) still bites. Measuring m is cheap and has never been done here.

  resource_label: >-
    R3 (End(E) as a ring: the norm form, the Galois action on kernels). The
    audit consumes only the arithmetic of O and the Galois module structure of
    ker alpha; it touches no group operation on G.
  admissibility: admissible
  admissibility_argument: >-
    Admissible as a COST AUDIT: it makes no oracle available to an adversary
    and therefore is untouched by the curve-measurable closure of
    IDEA-20260807-413fcc. Its conclusion, however, invokes H-ENDO-001 as the
    binding admissibility filter for the hypothetical in (C) -- used as a
    filter, never re-tested, exactly as GOAL-ENDO-001's opening note requires.

  discriminated_from:
    - >-
      IDEA-20260807-c36472 (T5 re-costed to Otilde(p^{1/4})). That record
      re-prices TRANSPORT, counting the number of class-group action
      evaluations needed to reach a specified curve. This record prices the
      INTERIOR of a single isogeny evaluation and the separate object of a
      large-degree endomorphism. The two do not overlap: c36472's p^{1/4} is
      unchanged by everything here, and this record says so explicitly in (D)
      rather than leaving the reader to check. c36472 also marks its p^{1/4}
      figure [open] pending re-verification; that mark is inherited here and
      not discharged.
    - >-
      IDEA-20260807-778375 and IDEA-20260807-94f953 (small |D_0|). Those
      records concern the CM discriminant being small, hence the Hilbert class
      polynomial cheap. This record concerns the FIELD OF DEFINITION OF KERNEL
      POINTS, which is a Galois-theoretic quantity independent of |D_0|; a
      small-|D_0| curve still has a degree-~p minimal non-scalar endomorphism
      with the same lambda-order question.
    - >-
      IDEA-20260807-e9d57c and IDEA-20260807-5d7606 (kernel IDEALS). Those
      track ideals of O attached to subgroups. This record tracks the GALOIS
      ACTION on the points of a kernel, which is the datum the ideal-class
      framing discards. Different object, different lossiness, different test.
    - >-
      IDEA-20260805-38aebb (h(f^2 D_K) and the short-endomorphism count
      rho(f, B)). That record counts endomorphisms by norm. This one asks, for
      one endomorphism, what field its kernel generator lives in. Norm-counting
      does not see m.

  object_first_candidate:
    tracked_object: >-
      THE TRIPLE (d, lambda, m) = (degree of a primitive non-scalar
      endomorphism; the scalar by which Frobenius acts on its cyclic kernel;
      the multiplicative order of that scalar mod d, i.e. the extension degree
      of the field of definition of a kernel generator). Grep of the whole
      repository on 2026-08-07 for "field of definition of the kernel", "kernel
      field", "kernel polynomial degree" returns ZERO hits: this object is not
      tracked anywhere in the corpus.
    lossiness: >-
      GENUINELY LOSSY, and lossy compatibly. It discards the curve E, the
      coefficients (a, b), every point coordinate, the isogeny's rational
      functions, and the codomain -- retaining only the cyclic Galois module
      (Z/d, multiplication by lambda). From (d, lambda) one cannot recover
      alpha, E, or even p: many curves over many primes share a triple. It is
      therefore not a change of coordinates. It is compatible with the
      operations that matter because the Galois module structure of a kernel is
      functorial: for a composite alpha = alpha_1 alpha_2 with coprime degrees,
      ker alpha = ker alpha_1 (+) ker alpha_2 as Galois modules, so
      lambda and m propagate by the Chinese Remainder Theorem,
      m = lcm(m_1, m_2). One-step propagation is therefore DEFINED AND
      COMPUTABLE, which is the concrete-testability axis.
    propagation: >-
      One step = multiply alpha by a prime element of O of small norm ell, or
      equivalently compose with one class-group action step. The new degree is
      d' = d * ell; the new lambda' is determined by CRT from lambda mod d and
      the eigenvalue of pi on E[ell] (a root of X^2 - tX + p mod ell); the new
      m' = lcm(m, ord_ell(lambda_ell)). Every quantity is computable in
      poly(log p, ell) time, so a propagation trace can be measured directly.
    survival_score: >-
      The object survives composition (by CRT), survives isogeny walks within a
      class (D and hence the norm form are class invariants), and survives
      volcano descent with an explicit conductor correction (O changes, the
      norm form changes by f, lambda and m change computably). It DISSOLVES
      exactly when gcd(v, d) > 1, where pi does not act by a scalar on the whole
      kernel and the kernel is no longer cyclic as a Galois module -- a
      degenerate case that must be detected and excluded, and detecting it is
      part of the minimal test rather than an afterthought.

  mechanism: >-
    STEP 1 (zero compute, and the deliverable even if every measurement is
    inconclusive). THE BARRIER TABLE. Grep ledger/, knowledge/, analysis/ and
    docs/ for every stated isogeny- or endomorphism-evaluation cost. For each
    occurrence record: the record ID; the charged cost; the degree regime; the
    kernel's field of definition; whether square-root Velu applies; the
    corrected cost; and a yes/no on "does the stated exponent change". This is
    a pure audit and produces a frozen table.

    STEP 2 (zero compute). THE ALGEBRA OF (B), written out and checked
    symbolically: the minimum of the norm form over v != 0; the identity
    lambda = -u v^{-1} mod d on ker alpha; the equivalence
    (kernel generator in F_{p^m}) <=> (lambda^m = 1 mod d). Each is one line
    and each is independently checkable.

    STEP 3 (toy compute, THE MEASUREMENT). Over a ladder of toy primes
    p in roughly 2^12 .. 2^24, enumerate ordinary curves, and for each compute
    t; D = t^2 - 4p; the conductor f and O; the minimising (u, v) of the norm
    form with v != 0; d = deg alpha; whether alpha is primitive and
    gcd(v, d) = 1; lambda = -u v^{-1} mod d; and m = ord_d(lambda) by factoring
    d (feasible at toy scale) and testing divisors of Carmichael's
    lambda-function of d. Report the empirical distribution of
    log m / log d.

    STEP 4 (toy compute, THE CONTROL). Compute the identical statistic for a
    NULL object of the same shape: for each measured d, draw a uniformly random
    a in (Z/d)^* and compute ord_d(a). If the curve-derived lambda and the
    random a have indistinguishable order distributions, the arithmetic of the
    CM order supplies nothing special and the prediction in (B) rests on the
    generic multiplicative-order heuristic alone -- which is the expected and
    honest outcome. If they DIFFER, that is an unexpected observation and is
    recorded as one (AGENTS.md rule 8), not smoothed over.

    STEP 5 (toy compute, THE POSITIVE CONTROL, BLOCKING). The pipeline must
    detect a PLANTED small order. Construct d = r^2 - 1 for a chosen r, set
    lambda = r, so ord_d(lambda) = 2 exactly. The measurement code must report
    m = 2. A pipeline that fails this returns no usable null and its run set is
    INVALID, not negative.

    STEP 6 (zero compute). Write the closure: named obstruction (kernel-point
    irrationality), argument ((B1)-(B3) plus the independent (C)), forward
    guidance (the family in (F) with small m, if any is found; and the explicit
    statement that square-root Velu remains a real constant-factor gain in the
    small-ell rational-kernel regime of (D)).

  novelty_status: unverified
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over the full tree: "velu|Velu|sqrt-elu|
      VeluSqrt|square-root Velu" (case-insensitive); "field of definition of the
      kernel|kernel field|kernel polynomial degree"; "ord_d|multiplicative
      order"; plus full reads of RQ-CLGP-b99df5, RQ-ICINV-475b5e's neighbours
      via IDEA-20260807-c36472, DECOMPOSITION.md sections L10 and L1,
      docs/inventor-protocol.md and docs/target-result-profile.md.
    results: >-
      Square-root Velu appears in the corpus only inside literature notes about
      SIDH/CSIDH implementation (e.g. KN-LIT-848 on Huff curves, which reports
      applying the square-root Velu formula to Huff curves). NO ledger record
      applies it to a cost barrier, and "field of definition of the kernel"
      returns ZERO hits across the entire repository. The minimal non-scalar
      endomorphism degree |D|/4 and the scalar action lambda = -u v^{-1} are
      standard CM arithmetic but are not written down anywhere in this corpus.
    external_check: >-
      NOT PERFORMED. Web search was unavailable in this session. The
      square-root Velu bound Otilde(sqrt(ell)) is attributed here to
      Bernstein-De Feo-Leroux-Smith (ANTS XIV, 2020), "Faster computation of
      isogenies of large prime degree", CITED FROM THE AGENT'S BACKGROUND
      KNOWLEDGE AND NOT READ IN THIS SESSION. It is marked [unverified] and
      must be located, read, and cited precisely -- including the exact field
      over which its operation count is stated, which is the load-bearing
      detail of this entire record -- before this figure appears in any
      write-up. If that reading shows the count is stated over the base field
      rather than over the kernel-generator field, claim (B3) is WRONG and this
      record must be superseded.
    verdict: >-
      UNVERIFIED, because the external literature check was not performed. The
      internal novelty is real: no corpus record tracks the kernel's field of
      definition. The external novelty is almost certainly nil -- that a
      degree-d isogeny is only cheaply evaluable when its kernel is defined over
      a small extension is folklore in the isogeny literature -- and this record
      claims no external novelty. A citation would be a better deliverable than
      this record's (B) and should be sought.

  null_object_control: >-
    MANDATORY AND BLOCKING, TWO-DIRECTIONAL, per RQ-INSTR-f8faa0 and
    docs/inventor-protocol.md section 3.
    NEGATIVE DIRECTION (STEP 4): the matched null is the multiplicative order of
    a uniformly random unit mod the SAME d. Matching on d is essential -- the
    order distribution depends heavily on the factorisation of d, so a null that
    resamples d as well would be measuring the wrong thing.
    POSITIVE DIRECTION (STEP 5): the planted d = r^2 - 1, lambda = r family with
    m = 2 by construction, which the pipeline must detect.
    DECAY PARAMETER: the size of d. The generic multiplicative-order heuristic
    predicts log m / log d -> 1 as d grows; a measured log m / log d that is
    FLAT or DECREASING in log d across the ladder is the canonical artifact tell
    (a quantity that fails to move as the parameter meant to move it increases)
    and indicates the order computation is silently truncating -- most likely by
    failing to factor d and defaulting to a divisor of a partial factorisation.

  assumptions:
    - >-
      E/F_p ordinary, End_{F_p}(E) = O an order in the imaginary quadratic field
      of discriminant D_0, pi the Frobenius with pi^2 - t pi + p = 0. Standard
      Deuring/Waterhouse. Verified at toy scale by direct point counting.
    - >-
      alpha = u + v pi is primitive and gcd(v, d) = 1, so that pi acts on
      ker alpha by a scalar and ker alpha is cyclic. Instances failing this are
      DETECTED AND EXCLUDED by the pipeline and their count is reported; they
      are not silently dropped.
    - >-
      The square-root Velu operation count is stated over the field of
      definition of a kernel generator. THIS IS THE RECORD'S LOAD-BEARING
      EXTERNAL ASSUMPTION AND IS MARKED [unverified]; see novelty_screen.
      external_check. If false, (B3) fails and the record is superseded.
    - >-
      H-ENDO-001's scalar action on a prime-order subgroup, used as the
      admissibility filter for the hypothetical in (C). Used, not re-tested.

  proof_search_map:
    bottleneck: >-
      The exact field over which the square-root Velu operation count is
      stated. Everything in (B) is elementary once that is fixed; nothing in
      (B) is defensible until it is. This is the single step whose resolution
      changes the conclusion, and it is a literature question, not a compute
      question.
    baseline_embedding:
      parameter_slice: >-
        ell small, kernel eigenspace F_p-rational, m = 1. In that slice the
        corrected cost must reduce exactly to the corpus's existing poly(ell,
        log p) charge for one class-group action step, improved to
        Otilde(sqrt(ell)) field operations. If the corrected formula
        Otilde(sqrt(d) * m) does not degenerate to Otilde(sqrt(ell)) at m = 1,
        the formula is wrong.
      reproduction_check: >-
        Frozen fixture: three toy curves, three small ell with rational
        eigenspaces, evaluate the ell-isogeny by classical Velu and by the
        corrected accounting; the two operation counts must agree to within the
        stated constant, and the m = 1 determination must be produced by the
        same code path that computes m in STEP 3.
    observation_collision:
      observable: >-
        The pair (d, m): degree and kernel-generator field extension degree.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the record does not
        claim identifiability. Two curves over different primes, with different
        traces, can share (d, m) exactly -- the observable is a pair of
        integers and the fibre is large. The record therefore never claims that
        (d, m) determines anything about a curve; it claims only a COST bound,
        which is a statement in the forward direction and is unaffected by
        collisions. Any downstream use of (d, m) as an INVARIANT would be
        falsified by this collision and is forbidden here.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "degree d" (which is what the corpus's cost charges track) by
          the Galois module (Z/d, lambda), preserving more state than the cost
          question strictly requires -- because the extra state (lambda) is
          exactly what survives composition by CRT and is exactly what decides
          the cost.
        predicted_gain: >-
          Not a speedup. The gain is that a cost claim becomes checkable: the
          corrected cost is a computable function of the retained state, so the
          audit table of STEP 1 has a well-defined right answer per row.
      - transform: representation_reduction
        proposed_object: >-
          Restate "is this isogeny cheaply evaluable" as the exact arithmetic
          condition ord_d(lambda) small, moving the question from an
          implementation model to a multiplicative-order computation.
        predicted_gain: >-
          Converts an unfalsifiable cost-model worry into a toy-scale
          measurement with a matched null. That conversion, not a speedup, is
          the deliverable.
    quantifier_order: >-
      WHAT IS CLAIMED: FORALL ordinary E/F_p with End_{F_p}(E) = O, FORALL
      primitive non-scalar alpha = u + v pi in O with gcd(v, deg alpha) = 1,
      THERE EXISTS a unique lambda in (Z/d)^* such that pi acts on ker alpha as
      multiplication by lambda, and the field of definition of a generator of
      ker alpha is EXACTLY F_{p^m} with m = ord_d(lambda). This is a theorem,
      with no algorithmic quantifier.
      WHAT IS PREDICTED, NOT CLAIMED: FORALL epsilon > 0, for ALL BUT A DENSITY-
      ZERO SET of such (E, alpha), m > d^{1 - epsilon}. This is heuristic H1,
      carries an existential over exceptional sets, and is exactly what the
      measurement tests.
      NOT CLAIMED: that no ordinary curve has a small-m minimal endomorphism.
      Such curves may exist; (F) says finding one is a valuable outcome, and
      (C) says it would still not be an attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the marked external assumption about where the square-root Velu
        operation count is stated, no exponent currently recorded in this
        ledger changes when isogeny-evaluation costs are recomputed, and the
        minimal non-scalar endomorphism of a generic ordinary curve is NOT
        evaluable in Otilde(sqrt p) F_p-operations." It can NEVER certify that
        the ECDLP is hard, that some other isogeny-evaluation technique does not
        exist, or anything about supersingular curves, where the whole kernel
        rationality analysis is different.
      nearby_object_control: >-
        THE SMALL-ell RATIONAL-EIGENSPACE ISOGENY, where the desired conclusion
        ("square-root Velu does not help") FAILS -- there it genuinely does help,
        by a square root of a polylog quantity. The audit must NOT conclude
        "square-root Velu never helps"; if the argument as written also kills
        that case, it is proving too much and has mis-identified the
        load-bearing structure (which is kernel rationality, not degree size).
    proof_obligations:
      - claim: min over v != 0 of N(u + v pi) equals |D|/4 up to rounding.
        responsibility: size
      - claim: >-
          pi acts on ker alpha as the scalar lambda = -u v^{-1} mod d when
          gcd(v, d) = 1, and ker alpha is cyclic of order d.
        responsibility: correctness
      - claim: >-
          A generator of ker alpha is defined over F_{p^m} with
          m = ord_d(lambda), and over no smaller field.
        responsibility: correctness
      - claim: >-
          Square-root Velu costs Otilde(sqrt d) operations in the
          kernel-generator field.
        responsibility: interface
      - claim: >-
          alpha acts on the prime-order subgroup as the scalar u + v mod N.
        responsibility: scope
      - claim: >-
          The planted d = r^2 - 1, lambda = r family is detected with m = 2.
        responsibility: soundness

  predictions:
    - metric: >-
        median of log m / log d over toy ordinary curves, m = ord_d(lambda) for
        the minimal non-scalar endomorphism
      direction: higher
      minimum_effect: >-
        Median at least 0.75 at the largest toy p, and non-decreasing across
        the p ladder. A median below 0.5 that persists as p grows falsifies the
        genericity claim in (B3) and identifies the family of (F).
    - metric: >-
        Kolmogorov-Smirnov distance between the distribution of
        log ord_d(lambda)/log d for curve-derived lambda and for a uniformly
        random unit mod the same d
      direction: different
      minimum_effect: >-
        Predicted INDISTINGUISHABLE: KS statistic below the 0.05 critical value
        at the sample size used. A significant difference is an unexpected
        observation about CM arithmetic and is recorded as such under AGENTS.md
        rule 8, whichever direction it goes.
    - metric: >-
        number of rows in the STEP 1 barrier table whose stated exponent
        changes under the corrected cost model
      direction: lower
      minimum_effect: >-
        Predicted EXACTLY ZERO. Any row that does change is escalated
        immediately: it means a recorded barrier is stale, which is a
        first-order correction to the campaign regardless of direction.
    - metric: >-
        fraction of enumerated instances excluded because alpha is imprimitive
        or gcd(v, d) > 1
      direction: lower
      minimum_effect: >-
        Reported, not thresholded. If it exceeds 20 percent the degenerate case
        is not degenerate and the analysis in (B) must be extended to
        non-cyclic kernels before any conclusion is drawn.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE, AND THE CHEAPEST DISCRIMINATOR IN THIS
      RECORD): locate and read the square-root Velu source and establish over
      WHICH FIELD its operation count is stated. One literature read decides
      whether (B3) stands or the record is superseded. Nothing below is worth
      running until this is done.
      STAGE 1 (zero compute, hours of reading): the STEP 1 barrier table.
      STAGE 2 (minutes): STEP 5 planted positive control -- must report m = 2.
      STAGE 3 (minutes to hours): STEP 3 measurement over the p ladder, and
      STEP 4's matched random-unit null on the same d values.
      STAGE 4 (zero compute): the closure write-up of STEP 6.
    controls:
      - >-
        planted d = r^2 - 1, lambda = r family with m = 2 by construction --
        BLOCKING; failure invalidates the run set
      - >-
        matched null: ord_d(a) for a uniformly random unit a mod the SAME d
      - >-
        m = 1 baseline slice (small ell, rational eigenspace) reproducing the
        corpus's existing per-step cost
      - >-
        decay check: log m / log d as a function of log d across the ladder
      - >-
        rho with distinguished points and BSGS as the standing cost baselines
        against which every corrected figure in the barrier table is compared
        (0.886 sqrt(N); KN-TECH-001, KN-TECH-006)
    required_metrics:
      - per instance (p, t, D, f, u, v, d, lambda, m, primitivity flag)
      - empirical distribution and CDF of log m / log d, per p decade
      - KS statistic against the random-unit null, with sample sizes
      - planted-control verdict (pass/fail) with the reported m
      - the barrier table with one row per corpus cost claim and an explicit
        exponent-changed yes/no column

  falsification_conditions:
    - >-
      The square-root Velu operation count turns out to be stated over the base
      field, not over the kernel-generator field. (B3) is wrong; the record is
      SUPERSEDED, the knife edge in (A) is real, and the tie at Otilde(sqrt p)
      must be re-examined -- though (C) still applies and would still make it
      useless for the ECDLP.
    - >-
      log m / log d is measured well below 1 and does not rise with d, on an
      identifiable family of ordinary curves. The genericity claim is falsified
