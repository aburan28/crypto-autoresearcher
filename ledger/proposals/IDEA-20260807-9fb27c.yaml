  confounders:
    - >-
      FACTORING d. Computing ord_d(lambda) exactly needs the factorisation of
      d ~ p. Feasible at toy scale, INFEASIBLE at crypto scale. Every number in
      this record is therefore toy scale by construction, and no extrapolation
      of the measured distribution to crypto-sized p is a validated claim --
      it is an extrapolation and must be labelled one.
    - >-
      SMALL-d ARTEFACTS. At tiny p, d is small and the multiplicative-order
      distribution is dominated by the arithmetic of individual d. Report per-
      decade distributions, never a pooled statistic, and never a single
      instance.
    - >-
      CONDUCTOR / VOLCANO LEVEL. Curves in one class at different levels have
      different O, different norm forms, and therefore different minimal d.
      Stratify by level; do not pool across levels.
    - >-
      MINIMALITY IS NOT UNIQUENESS. Several alpha can attain or nearly attain
      the minimum degree, with different lambda and very different m. Record
      the minimum over a window of the k smallest degrees, not only the single
      minimiser, or the reported m is an artefact of tie-breaking.
    - >-
      TWO DIFFERENT SQUARE ROOTS. Otilde(sqrt d) is a square root of the ISOGENY
      DEGREE; 0.886 sqrt(N) is a square root of the GROUP ORDER. They coincide
      numerically here only because d ~ p ~ N. Any write-up that conflates them
      is misreporting this record.

  interpretation_limits:
    - >-
      This record mounts NO attack and claims NO speedup. Its predicted outcome
      is that nothing changes. Its value is that "nothing changes" becomes a
      table with a reason rather than an assumption.
    - >-
      Everything empirical is toy scale (p up to about 2^24, bounded by the
      cost of factoring d). Nothing here is crypto-scale validation
      (AGENTS.md rule 7).
    - >-
      The analysis is for ORDINARY curves over prime fields. Supersingular
      curves have a non-commutative endomorphism ring and an entirely different
      kernel-rationality picture; nothing here transfers, and in particular
      nothing here bears on KN-TECH-055 or the Wesolowski exemplar.
    - >-
      Claim tier capped at toy per GOAL-ENDO-001. Timeouts, crashes, and
      failures to factor d are infrastructure outcomes and are never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the minimal non-scalar endomorphism of a uniformly sampled ordinary
        E/F_p, the scalar lambda = -u v^{-1} mod d behaves, with respect to
        multiplicative order, like a uniformly random element of (Z/d)^*.
        Formally: for every epsilon > 0, the density of instances with
        ord_d(lambda) <= d^{1 - epsilon} tends to 0 as p -> infinity, uniformly
        for d in [p/4, 4p].
      rigorous_support: >-
        Rigorous side: ord_d(lambda) always divides Carmichael's
        lambda-function of d, and for lambda != ±1 the bound
        d | lambda^m - 1 with lambda < d forces m >= log d / log lambda >= 2,
        which excludes only the trivial cases. Classical distribution statement
        imitated: the theory of multiplicative orders of a fixed integer modulo
        varying n (Erdos-Murty; Kurlberg-Pomerance), under which the order of a
        typical element exceeds n^{1/2 + o(1)} for almost all n, and exceeds
        n^{1 - o(1)} outside a sparse set. THESE ATTRIBUTIONS ARE CITED FROM
        BACKGROUND KNOWLEDGE AND ARE [unverified] IN THIS SESSION; they must be
        located and cited precisely before use in any write-up.
      validation_plan: >-
        Sample all ordinary curves at toy primes across p in 2^12 .. 2^24;
        compute m exactly by factoring d; compare the empirical CDF of
        log m / log d against the CDF obtained by drawing a uniformly random
        unit mod the SAME d (the matched null, which is the correct comparison
        distribution here precisely because the theoretical distribution depends
        on the factorisation of d). Tail check: the SMALLEST observed
        log m / log d in each decade versus the fraction of units of that d
        having order at most the observed value -- a small-order outlier that is
        far rarer than the null predicts is the interesting signal. LABELLED
        TOY SCALE; the crypto-scale statement is not tested and is not claimed,
        because factoring d ~ 2^256 is out of reach.
      falsification_condition: >-
        Median log m / log d below 0.5 at the largest toy p AND not rising with
        p, or a KS-significant deficit against the matched random-unit null.
        Either falsifies H1 as stated and identifies the family of (F).
    - id: H2
      statement: >-
        Over the corpus's actual isogeny-evaluation regime (prime norm
        ell = polylog(p), F_p-rational ell-torsion eigenspace), the kernel
        generator is defined over F_p or F_{p^2}; formally, m divides 2 for
        every class-group action step used in any ledger design.
      rigorous_support: >-
        Rigorous: an ell-isogeny step in the Cl(O) action is defined by an
        eigenspace of pi on E[ell] with eigenvalue a root of X^2 - tX + p mod
        ell; when that root is in F_ell and the eigenspace is F_p-rational, a
        generator is F_p-rational, so m = 1 (m = 2 in the twisted case). No
        distribution theorem is needed: this is a structural fact about how the
        action is implemented, not a genericity claim.
      validation_plan: >-
        Instrument every class-group action step in the campaign's existing
        isogeny-walk code to assert m in {1, 2} at runtime and record a counter.
        Any step with m > 2 is a construction the corpus did not intend and is
        reported. Zero additional compute beyond an assertion.
      falsification_condition: >-
        Any recorded action step with m > 2. That would mean some ledger design
        is evaluating a non-rational-kernel isogeny and its cost accounting is
        wrong, which is exactly the kind of stale figure this audit hunts.

  reachability_gate: >-
    NOT BINDING and stated so rather than omitted. T5 asks what it costs to
    REACH a specified curve. This record evaluates a map on a curve already in
    hand and moves nowhere in the isogeny class, so no reachability question
    arises. Where the record touches transport at all -- in (D), where it
    confirms that IDEA-20260807-c36472's Otilde(p^{1/4}) figure is unmoved --
    it defers entirely to that record's accounting, including its [open] mark.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT CLAIMED. The record's own quantitative content is a
      CORRECTION, upward: evaluating the minimal non-scalar endomorphism of a
      generic ordinary E/F_p costs Otilde(sqrt(d) * m) = Otilde(p^{3/2})
      F_p-operations under H1, versus the Otilde(d) = Otilde(p) the naive
      accounting charges and the Otilde(p^{1/2}) an incorrect application of
      square-root Velu would suggest. In the regime where square-root Velu does
      apply (small ell, m <= 2) the per-step cost improves from poly(ell) to
      Otilde(sqrt(ell)) with ell = polylog(p): a polylog-cofactor gain, which
      docs/target-result-profile.md classifies as explicitly NOT target-class.
    memory_exponent: >-
      Square-root Velu's baby-step/giant-step table is Otilde(sqrt(d)) elements
      of the kernel-generator field, i.e. Otilde(sqrt(d) * m) F_p-elements --
      Otilde(p^{3/2}) in the generic endomorphism case and Otilde(sqrt(ell)) in
      the applicable case. Stated because a square-root-time algorithm with
      square-root memory must never be quoted as if memory were free.
    best_known: >-
      Prime-field ECDLP: 0.886 sqrt(N) group operations at O(1) memory
      (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N) time and sqrt(N) memory;
      automorphism-discounted rho at 0.886 sqrt(N/|Aut|), |Aut| <= 6
      (KN-TECH-018). Nothing in this record approaches any of these.
    hidden_overhead: >-
      Two items, both disclosed rather than buried. (i) The Otilde in
      Otilde(sqrt d) hides the polylogarithmic cost of the resultant/remainder-
      tree machinery, which is a large constant in practice. (ii) Computing m
      at all requires FACTORING d ~ p, which is subexponential, not polynomial.
      That cost is paid only by the AUDIT, never by an attacker, but it is what
      caps every measurement here at toy scale and it is why no crypto-scale
      statement is made.
    tradeoff_note: >-
      Square-root Velu is itself a time-memory tradeoff point: classical Velu is
      Otilde(d) time at O(1) memory, square-root Velu is Otilde(sqrt d) time at
      Otilde(sqrt d) memory, and intermediate splits interpolate. Since this
      record's conclusion is that neither point is reachable for the object in
      question (the kernel generator is unavailable at either), the tradeoff is
      recorded for completeness rather than exploited. Parallelisation is not
      analysed because no attack is proposed.

  dominated_by: >-
    n/a as an attack (no result claimed); as a COST STATEMENT, checked against
    every row of the frontier across time, memory and data/queries. The record
    proposes no algorithm, so parallel rho with distinguished points
    (0.886 sqrt(N) time, O(1) memory), BSGS (sqrt(N)/sqrt(N)), and
    automorphism-discounted rho (KN-TECH-018) all dominate it trivially on
    time; it consumes no data and no queries, so it is not dominated on those
    axes but only because it does not use them. The corrected figure it
    produces, Otilde(p^{3/2}) for a minimal-endomorphism evaluation, is
    dominated by simply not evaluating the endomorphism -- by (C), the scalar
    u + v mod N gives the same answer in O(log N) group operations. That is the
    dominating "algorithm" and it is stated rather than left implicit.
    dominated_by is NOT null.
  sota_delta: >-
    Zero speedup: 0.886 sqrt(N) before and after. Quantitatively the record
    moves three numbers, all of them cost accounting rather than attack
    performance: (i) minimal non-scalar endomorphism evaluation, from a naive
    Otilde(p) or an erroneous Otilde(p^{1/2}) to Otilde(p^{3/2}) under H1;
    (ii) one class-group action step, from poly(ell) to Otilde(sqrt(ell)) with
    ell = polylog(p) -- a cofactor gain, not an exponent; (iii) the predicted
    count of ledger exponents that flip under the corrected model, from
    "unknown" to a measured zero. Item (iii) is the deliverable.

