idea:
  id: IDEA-20260725-007   # placeholder: coordinator confirms/renumbers (004/005 taken by concurrent lanes)
  supersedes: >-
    the unfiled "Ensemble calibration of the column-matched null" formulation
    of the syzygy-confound lane, screened REVISE on 2026-07-25
  supersede_reason: >-
    Screen returned five defects (false "one sample per cell" premise; a
    cross-size-pooled correlation that is a proxy for n; an unmeasurable
    relabeling arm; unanchored budget; K inconsistency). On re-grounding I
    found a sixth of my own: the control "assert exact D5 column-set equality
    per sample" is UNSATISFIABLE -- the construction matches columns at D6, and
    the recorded D5 column counts differ from the sem's by 11 (n=9) and 15
    (n=12). All six are repaired below.
  title: >-
    Ensemble calibration of the column-matched D5 null: size-dependence,
    trajectory-dependence, or a construction family with too little entropy to
    vary?
  class: control
  question_id: RQ-ECDLP-002
  claim: >-
    Three explanations of the recorded support-bias pair -- extra_5 = 369 of a
    sem D5 deficit of 909 at n = 9 (40.6%, EV-SIG-006) and extra_5 = 0 of 1,321
    at n = 12 (0.0%, EV-SIG-008 RUN-c) -- are currently indistinguishable, and
    an ensemble over re-seeded constructions separates them.
    E1 SIZE-DEPENDENT: extra_5 is fixed by the cell, essentially independent of
    which admissible column-matched construction is drawn. Then over K = 16
    independently seeded greedy constructions at n = 9, median extra_5 >= 200,
    IQR/median <= 0.5, and at most 2/16 give extra_5 = 0; and over K = 16 at
    n = 12, 0/16 give extra_5 > 0.
    E2 TRAJECTORY-DEPENDENT: extra_5 depends on which greedy trajectory the
    seed takes. Then at n = 9 IQR/median >= 1.0, or >= 4/16 give extra_5 = 0,
    and both the 40.6% and the load-bearing 0.0% become single-construction
    measurements that must be re-scoped.
    E3 DEGENERATE ENTROPY (new, and the explanation the existing data most
    supports): the construction family has so little freedom that re-seeding
    produces near-identical systems. Operationalized as median pairwise support
    Jaccard >= 0.99 across the n = 9 ensemble. Under E3 neither E1 nor E2 is
    decidable with this family, the recorded 369 is a single point of a nearly
    deterministic construction, and no share figure may be quoted from it until
    the family is widened.
  mechanism: >-
    Column matching is realized by seeded greedy set-cover over "safe pools"
    plus swap repairs (5 repairs at n = 9, 6 at n = 12). The randomization is
    explicit and re-seedable: SIG8_run.sage:646-647 defines
    greedy_cover(seed_tag) with rng = Random(stable_seed("sig8", "n1greedy", N,
    SEED, seed_tag)), and line 734 calls it with the single tag "main". So
    every recorded column-matched null in the program sits on ONE greedy
    trajectory, and re-seeding is a one-line change.
    That procedure concentrates the null's monomial supports into the same
    sparse block-composition classes the sem occupies -- the structure the
    up-closure column law rewards (EV-SIG-006 observation 1) -- so a
    concentrated random system can carry non-Koszul relations at D5 that a
    histogram-only null does not. The n = 9 attribution is already clean: the
    non-column-matched nulls N0 and N2 give extra_5 = 0 there (EV-SIG-006
    control C2), so at n = 9 column matching is what produces 369. What is
    unknown is whether the MAGNITUDE is a property of the cell, of the
    trajectory, or of a family with no freedom to vary.
    Prior evidence that must be folded in rather than ignored (this corrects
    the superseded record's false "each cell has exactly one sample"):
    RUN-EXP-SIG-006-c and RUN-EXP-SIG-006-d are two DIFFERENT constructions --
    D5 ncols 11,004 vs 11,021, D6 ncols 29,327 vs 29,332, D6 extra 7,261 vs
    7,226, |V| 1 vs 0 -- and they return byte-identical D5 numbers: rank 9,135,
    sr_pred 9,504, deficit 369, kernel_dim 1,305, rankK 936, extra 369. That is
    strong evidence against fine-grained sensitivity. It is NOT evidence
    against E2, because both used seed_tag "main" and differ only by a
    donor-filter bug fix; and it is exactly the signature E3 predicts. Hence
    the ensemble, and hence E3 as a first-class preregistered outcome.
    Two construction families are compared. Family G = greedy with K distinct
    seed_tags. Family W = admissible-swap walk: start from a valid N1 and apply
    W accepted swaps drawn from the pools using the existing swap primitive.
    Family W is provably admissible, which is why it replaces the relabeling
    arm the screen correctly rejected: every pool element is "safe" in the
    sense of SIG8_run.sage:435-444 (every degree-6 up-closure element of the
    monomial lies in the sem's sextic set), so no choice from the pools can
    introduce a column outside the sem's D6 column set; and the swap primitive's
    risk test (lines 707-722) accepts a swap only if no singly-covered sextic
    loses its cover, so no sem column is lost. Exact D6 column-set equality is
    therefore preserved by construction and is verified per sample by the
    existing colset_of_int equality check (lines 763-776). Its expected
    admission rate is ~1; a measured rate < 0.9 falsifies that safety argument
    and is itself the finding.
    The program's standard T11 null (identical support, randomized
    coefficients) is vacuous for this instrument because the system is boolean
    over GF(2), where every support coefficient is 1 -- which is why a
    construction-space ensemble is the only available route.
  why_not_renamed_known_approach: >-
    It is not EXP-SIG-008 gate 3 (experiments/EXP-SIG-008/specification.yaml
    line 15), which is FINAL and measured exactly one column-matched null at
    n = 12 (share 0/1,321); this proposal measures the DISTRIBUTION that gate 3
    sampled once, which EV-SIG-008 itself lists as unmeasured ("measured for
    THIS null construction at THIS cell; other seeds/sizes unmeasured") and as
    an unresolved confound ("Why the n=9 support-bias confound (369) vanishes
    at n=12 -- mechanism not identified"). It is not T11
    (inputs/h100_session/AUTOLAB_TASKS.md:138-145) or its EXP-R6-001 control-4
    deployment, which randomize coefficients on a fixed support and are vacuous
    over GF(2). It is not IDEA-20260725-001, whose new arm is a FULL-SUPPORT
    unconstrained random system probing the D6 boundary law with 3 seeds of a
    single construction; that asks whether the support constraint matters at
    all at D6, this asks whether the D5 support-bias number is reproducible
    within the constraint. The two compose.
  novelty_status: adaptation
  novelty_evidence: >-
    Greps run 2026-07-25 by the idea generator. "column-matched|column
    matched|set-cover|set cover" matches 40 files repo-wide, but every match in
    the anti-duplication corpora is unrelated: the hits in
    outputs/_blacklist_compact.txt, outputs/prior_proposals_digest.md and
    inputs/idea_generation_20260719_batch12.md (lines 94, 485, 1079) are
    "fooling-set cover", a communication-complexity mechanism
    (FOOLING-SET-COVER-B2 / ECFG-P1686), and the remaining hits are the SIG
    instrument, its receipts, and its ledger records. Zero hits for
    "column-matched" in the external
    /Volumes/Volume/git/autolab/research/idea_generation_*.md set. This
    confound is an internal SIG-instrument matter, so the mechanism blacklist
    is the wrong index for it and its absence there is expected rather than
    reassuring; the two real collision risks (EXP-SIG-008 gate 3 and
    IDEA-20260725-001) were read in full and do not collide.
  assumptions:
    - "D5 is below the freeze degree at both n = 9 (freeze 6) and n = 12
       (freeze 7), so the freeze/variety-collapse mechanism of EV-SIG-006 is
       not in play at D5; a sample whose measured freeze differs is out of scope."
    - "greedy_cover's seed_tag is the only randomization input (SIG8_run.sage:646-647),
       so distinct tags give genuinely distinct trajectories through the
       shuffle of `free` and of each pool. If distinct tags produce identical
       chosen sets, that IS the E3 outcome and must be reported as such."
    - "Column matching is enforced at D6, NOT at D5 (SIG8_run.sage:763-776
       computes colset_of_int(..., 6) and halts on inequality). The recorded
       D5 column counts differ from the sem's: 11,032 vs 11,021 at n = 9
       (RUN-EXP-SIG-006-d), 46,709 vs 46,694 at n = 12 (RUN-EXP-SIG-008-c). Any
       control demanding exact D5 column-set equality is unsatisfiable and the
       superseded record's version of it was wrong."
    - "sr_pred is the pinned truncated-positive series documented in EV-SIG-006,
       not the textbook Bardet series."
    - "The sem D5 anchors are reproducible through this instrument (n = 12:
       rank 28,097, sr_pred 29,418, deficit 1,321, extra 1,322, rankK5 2,093,
       kernel 3,415, nrows 31,512, ncols 46,709 -- RUN-EXP-SIG-008-c raw.json;
       n = 9: deficit 909 per EV-SIG-005). Note EV-SIG-005's D5 deficit series
       lists 1322 at n = 12 where the receipt records deficit 1,321 and extra
       1,322; the receipt values govern and this +-1 labelling inconsistency is
       flagged, not relied on."
  predictions:
    - metric: "median extra_5 over the n = 9 K = 16 greedy (family G) ensemble"
      direction: higher
      minimum_effect: ">= 200 under E1; a median <= 100 falsifies the size-typical reading of the 369"
    - metric: "IQR/median of extra_5 in the n = 9 family-G ensemble"
      direction: lower
      minimum_effect: "<= 0.5 under E1; >= 1.0 selects E2"
    - metric: "median pairwise support Jaccard within the n = 9 family-G ensemble"
      direction: lower
      minimum_effect: "<= 0.95 required for the ensemble to be informative; >= 0.99 selects E3 and makes E1/E2 undecidable with this family"
    - metric: "count of n = 12 samples with extra_5 > 0, reported separately for family G (of 16) and family W (of 16)"
      direction: lower
      minimum_effect: "0 in both under E1; >= 1 in EITHER family forces re-scoping of EV-SIG-008's '0.0% support-induced, the sem's entire 1,321 D5 deficit is genuine'"
    - metric: "within-size Spearman rho between extra_5 and conc_5 (fraction of the sem's missing D5 top-slice monomials that the null's D5 column set covers), computed separately at n = 9 and n = 12, never pooled"
      direction: higher
      minimum_effect: "|rho| >= 0.6 at n = 9 establishes a predictive admissibility criterion for future nulls; |rho| <= 0.2 leaves the confound mechanistically unexplained"
    - metric: "|median extra_5 (family G) - median extra_5 (family W)| at n = 9"
      direction: different
      minimum_effect: "<= 50 indicates the effect is a property of column matching itself; >= 150 indicates construction-procedure dependence and the family must be re-specified before further use"
    - metric: "family-W admission rate (fraction of walk samples whose D6 column set still equals the sem's)"
      direction: higher
      minimum_effect: ">= 0.9, as predicted by the safe-pool plus risk-test argument; < 0.9 falsifies that argument, voids family W's contribution to prediction 6, and is reported as an instrument finding rather than as evidence about extra_5"
    - metric: "n_free_classes and n_forced_classes at each size (pool size vs required count per (equation, monomial-degree) class)"
      direction: different
      minimum_effect: "n = 9 recorded as 36 free / 2 forced (RUN-EXP-SIG-006-c/-d); if n = 12 shows a materially higher forced fraction, E3 is the expected outcome at n = 12 and the 0/16 prediction there is weak evidence rather than strong"
  minimal_test:
    design: >-
      D5 only, two sizes, two construction families, no closure engine and no
      D6 rank. Definitions fixed BEFORE execution:
      conc_5 := |C5_null intersect T5_sem| / |T5_sem|, where T5_sem is the set
      of degree-5 monomials the SEM's D5 column set MISSES (1,584 at n = 9 per
      EV-SIG-006 observation 1) and C5_null is the null's D5 column set;
      delta5_in := |C5_sem \ C5_null| and delta5_out := |C5_null \ C5_sem|
      (recorded net difference 11 at n = 9, 15 at n = 12);
      pairwise support Jaccard := over the union of the 2n equation supports.
      Rung 1 (n = 9, ncols about 11,000-12,600): K = 16 family-G samples and
      K = 16 family-W samples. Rung 2 (n = 12, sem D5 ncols 46,709, nrows
      31,512): K = 16 and K = 16. Per sample measure rank_5, sr_pred,
      deficit_5, kernel_dim_5, rankK_5, extra_5, ncols_5, delta5_in/out,
      conc_5, |V|, swap_repairs, D6-colset-equality boolean, and the
      determinism rebuild for at least one sample per (size, family).
      Interpretation map fixed BEFORE execution:
      (i) small within-size spread at both sizes, Jaccard <= 0.95, and 0/32
          nonzero at n = 12 => E1: the size-dependent reading stands, the 0.0%
          at n = 12 is robust, and the D <= 5 SIG conclusions keep their
          current strength;
      (ii) large n = 9 spread (IQR/median >= 1.0) or any nonzero at n = 12 =>
          E2: both share figures are single-construction artifacts and every
          SIG D <= 5 statement must be re-scoped to "validated against one null
          construction";
      (iii) median Jaccard >= 0.99 => E3: the family cannot vary, no share
          figure may be quoted from a single draw, and the next step is a wider
          admissible family rather than more seeds;
      (iv) the two families' medians differ by >= 150 at n = 9 => the operative
          variable is the construction procedure and the column-matched null
          family must be re-specified before any further use;
      (v) any sample failing D6 column-set equality is excluded and counted;
          if >= 4/16 fail in family G the generator is unreliable at that size
          and no support-share figure may be quoted from it.
    controls:
      - "Reproduce the sem D5 anchors at both sizes before admitting any null sample (n = 9: deficit 909 per EV-SIG-005/006; n = 12: rank 28,097, sr_pred 29,418, deficit 1,321, extra 1,322, rankK5 2,093, kernel 3,415, nrows 31,512, ncols 46,709 per RUN-EXP-SIG-008-c raw.json)."
      - "Admit the two recorded n = 9 constructions as ensemble members and reproduce their identical D5 numbers (rank 9,135, deficit 369, kernel 1,305, rankK 936, extra 369) from RUN-EXP-SIG-006-c and -d; and reproduce the n = 12 N1 (extra_5 = 0, ncols 46,694, rankK 2,094) from RUN-EXP-SIG-008-c. A failure here is instrument failure, not evidence."
      - "Non-matched baseline anchor at n = 9: reproduce N0/N2 extra_5 = 0 (EV-SIG-006 control C2), which is what attributes the 369 to column matching rather than to randomness per se."
      - "Exact D6 column-set equality assertion per sample (set equality, the construction invariant), with delta5_in/delta5_out reported as covariates and the rejected-sample count reported. Exact D5 equality is NOT asserted -- it does not hold for the recorded constructions."
      - "|V| measured per sample and used to stratify (recorded: 0 for RUN-006-d N1, 1 for RUN-006-c N1, 1 for the old null, 6 for the sem at n = 9; 2 for N1 at n = 12)."
      - "Independence check: median pairwise support Jaccard reported per family; >= 0.99 triggers the E3 branch rather than a share figure."
      - "Determinism rebuild of at least one sample per (size, family), matching the recorded determinism_rebuild_identical control."
      - "Instrument sha256 identity with the pinned EXP-SIG-006/008 instrument (RUN-EXP-SIG-008-c records instrument_sha256_matches_pinned: true)."
      - "MATCHED-CONTROL DECLARATION (RQ-ECDLP-002 constraint 3; docs/claims-and-verification.md): Pollard rho, BSGS and generic lower bounds are NOT applicable and are deliberately omitted. This run calibrates a baseline instrument, performs no solve, produces no factor-base relation and asserts no attack-cost quantity; it carries certificate kind: none, the designated value for pure measurement runs. This sentence must appear in the run manifest rather than the field being left blank."
    required_metrics:
      - extra_5
      - deficit_5
      - rank_5
      - ncols_5
      - nrows_5
      - sr_pred_n_5
      - rankK_5
      - kernel_dim_5
      - delta5_in
      - delta5_out
      - conc_5
      - variety_size_V
      - swap_repairs
      - d6_colset_equal_bool
      - family_W_admission_rate
      - pairwise_support_jaccard_median
      - n_free_classes
      - n_forced_classes
      - median_extra_5
      - iqr_extra_5
      - spearman_rho_within_size
      - wall_seconds_per_sample
      - peak_rss_gb
    budget: >-
      <= 45 min wall clock total, <= 2 GB RSS, per-invocation <= 240 s with
      8 samples per invocation and resume-safe checkpointing. Anchored to
      measured receipts, which refute the superseded record's "rung 2 is the
      cost driver": RUN-EXP-SIG-008-b (n = 12 construction: greedy+repair 1 s,
      colset verify 0 s, determinism 1 s, |V| 9 s, total 12 s wall, 776 MB peak
      RSS) and RUN-EXP-SIG-008-c (sem D5 echelon 6 s, N1 D5 echelon 6 s, total
      13 s wall, 1.15 GB peak RSS). So a full n = 12 sample is about 16 s and
      K = 16 per family is about 9 min; at n = 9 the D5 echelon is recorded at
      0-1 s. The expensive object in EXP-SIG-008 was the D6 staircase
      (RUN-EXP-SIG-008-n, secs_total 1,182), which this proposal does not
      touch. K at n = 12 is therefore RAISED from 8 to 16 rather than cut. A
      censored rung is INCONCLUSIVE, not negative (AGENTS rule 5).
  falsification_conditions:
    - "Median extra_5 over the n = 9 family-G ensemble <= 100 -> the claim that 369 is a size-typical value is FALSE."
    - "IQR/median of n = 9 family-G extra_5 >= 1.0 -> E1 is falsified; the confound is trajectory-dependent and the recorded 40.6%/0.0% pair is not interpretable as a size effect."
    - "Any n = 12 sample in either family with extra_5 > 0 -> the load-bearing half is falsified; EV-SIG-008's '0.0% support-induced, the sem's entire 1,321 D5 deficit is genuine' must be re-scoped. The families are reported separately so the source is attributable."
    - "Median pairwise support Jaccard >= 0.99 in family G at n = 9 -> E1 and E2 are BOTH undecidable with this family; the correct report is E3, and any share figure quoted from a single draw is unsupported."
    - "Family-W admission rate < 0.9 -> the safe-pool plus risk-test preservation argument in the mechanism is FALSE; family W contributes nothing to prediction 6 and that must be stated rather than the arm silently dropped."
    - "Sem D5 anchors fail to reproduce at either size, or the two recorded n = 9 constructions do not return 369 -> instrument failure; no null statement may be made and the run yields no evidence."
    - ">= 4/16 family-G samples fail D6 column-set equality -> the generator is unreliable at that size and no support-share figure may be quoted from it."
    - "The two families' medians differ by >= 150 at n = 9 -> the claim that the effect is a property of column matching is falsified in favour of procedure dependence."
  confounders:
    - "|V| varies across samples and could drive extra_5 independently of support (recorded 0 / 1 / 2 / 6 across nulls and the sem); stratification by |V| is mandatory, and a |V|-extra_5 correlation is a distinct explanation from support concentration."
    - "Seeds may reuse correlated safe pools, producing pseudo-replicates that shrink the measured IQR; the Jaccard control bounds this and, at >= 0.99, becomes the E3 verdict rather than a caveat."
    - "The D5 column sets are NOT matched by construction (matching is at D6), so delta5_in/delta5_out are uncontrolled covariates by design and must be reported alongside every extra_5, not conditioned away."
    - "Family W's samples are a random walk FROM the recorded N1, so they are not independent draws from the admissible set; a small walk length W gives correlated samples. Walk length must be swept (at least two values) and Jaccard-vs-W reported."
    - "Both sizes are below freeze at D5, so nothing here speaks to D6; conversely the completed n = 12 D6 receipt (RUN-EXP-SIG-008-n: rank6 149,410, extra_6 7,110, rank_eq_sr_pred false) does not bear on D5."
    - "Echelon cost differences between families are timing artifacts, not evidence about syzygies."
    - "n = 9 is documented in EV-SIG-005 as an anomalous size (residual_4 = 24 vs law 7); a large n = 9 spread might reflect that anomaly rather than construction noise, which is why the n = 12 rung is decisive."
    - "Confirmation pressure: E1 is the convenient outcome (it preserves every D <= 5 SIG conclusion). The interpretation map and all thresholds are fixed in this record before any sample is drawn."
  interpretation_limits:
    - "claim_tier toy: boolean chained Semaev m = t = 3 over GF(2^n) at n = 9 and n = 12 only; no prime-field or crypto-scale statement (AGENTS rule 7)."
    - "This calibrates the BASELINE. Even a fully E1 outcome does not validate the cascade interpretation of the sem deficit; it only removes one alternative explanation for it."
    - "Nothing here admits or inadmits any D6 quantity, and nothing here changes any hypothesis status -- that is the Coordinator's authority."
    - "A measured conc_5 correlation would be an empirical admissibility criterion for this instrument, not a theorem about semi-regularity."
    - "The ensemble explores only the SAFE-POOL admissible set. A negative result bounds that family and says nothing about column-matched nulls built by a different admissible construction."
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
