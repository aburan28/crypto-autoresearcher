idea:
  id: IDEA-20260901-d88b5c
  question_id: RQ-GNFS-c6ce52
  research_question: RQ-GNFS-c6ce52
  goal_id: null
  added: '2026-09-01'
  title: >-
    THE SINGLE QUANTITY ANY TWO-POLYNOMIAL PROPOSAL MUST MOVE IS sigma. The
    L[1/3] balance of the two-polynomial number field sieve depends on the
    polynomial pair only through sigma = D times log(coefficient-size product)
    over log N, with the closed form c(sigma)^3 = 32 sigma / 9 reproducing the
    general sieve at sigma = 2 and the special sieve at sigma = 1 as exact
    parameter slices; a resultant lemma, a Gaussian heuristic on the ensemble
    of root lattices, and root extraction modulo a composite pin every
    constructible factoring pair at sigma >= 2 - o(1) and every prime-field
    DLP pair at sigma >= 2 - 2/(D+1), so two nonlinear polynomials of any
    degree are at best a TIE inside the o(1) and never a constant change --
    a closure of the exponent-adjacent target at the section-4 standard, with
    a toy root-lattice validation, the SNFS form as the object on which the
    heuristic fails by construction, and Joux-Lercier as the factoring-versus-
    DLP discriminator the literature already set up
  class: mechanism

  claim: >-
    FIVE SEPARABLE CLAIMS, (A) THE SLICE, (B) THE THREE CONSTRAINTS AND THE
    TABLE THEY FORCE, (C) THE DLP DISCRIMINATOR, (D) THE TOY VALIDATION, (E)
    WHAT IS NOT CLAIMED. Every constant below is RE-DERIVED in this record from
    the standard balance and checked against the values the corpus already
    holds (H-RSA-68884a gates G1-G2 at theta = 0); none is quoted as authority.

    (A) THE SLICE. Let f, g in Z[x] have degrees d1, d2 and a common root
    modulo N, let D = d1 + d2, let ||.||_s be the skewed coefficient size
    max_i |a_i| s^(i - deg/2), and write x = log||f||_s / log N, y =
    log||g||_s / log N, S = x + y. Over a sieve box of A = L[1/3, alpha]
    coprime pairs the product of the two homogenised norms has logarithm
    S log N + (D/2) log A to leading order, so with D = delta (log N /
    log log N)^(1/3) the norm product is L[2/3, sigma/delta + alpha delta/2]
    with sigma := D S. Re-running the Buhler-Lenstra-Pomerance balance with
    sigma in place of the base-m value 2 gives, exactly as rationals,
    delta(sigma)^3 = 3 sigma / 2, beta(sigma)^3 = 4 sigma / 9, c(sigma)^3 =
    32 sigma / 9, with time L[1/3, c] and factor base / matrix dimension
    L[1/3, beta]. At sigma = 2 this is (3, 8/9, 64/9), the classical triple;
    at sigma = 1 it is c^3 = 32/9, the special number field sieve constant.
    The pair enters the constant ONLY through sigma. A proposal about
    polynomial selection that cannot say what it does to sigma is not a
    proposal about the constant, which is RQ-GNFS-c6ce52 target 1 answered.

    (B) THREE CONSTRAINTS AND THE TABLE. LEMMA R (resultant, a theorem): since
    Res(f, g) is a nonzero multiple of N and is bounded by C(d1, d2)
    ||f||_s^(d2) ||g||_s^(d1) -- the resultant is homogeneous of degree d2 in
    the coefficients of f and d1 in those of g, and the bound is invariant
    under skewing because Res(f(sx), g(sx)) = s^(d1 d2) Res(f, g) -- one has
    d2 x + d1 y >= 1 - o(1). HEURISTIC H1 (root-lattice Gaussian heuristic,
    stated formally below): for a root r chosen without special structure,
    the lattice L_r^(d) of degree-d integer polynomials vanishing at r modulo
    N has determinant N in dimension d + 1 and its successive minima are all
    N^(1/(d+1)) up to a constant depending on d; consequently a pair drawn
    from ONE root lattice has x = y = 1/(d_i + 1) up to o(1), and a pair
    beating this exists only for roots r in a tail of relative size N^(-c),
    which no L[1/3]-time search reaches. Prest and Zimmermann (retrieved,
    read) give exactly this count in their section 3.1, N^(1/d) admissible
    pairs of degree d with coefficients N^(1/(2d)) among N choices of root.
    OBSTRUCTION F (factoring only): the common root must be CONSTRUCTED,
    because extracting a root of a non-linear integer polynomial modulo a
    composite N is, for every case with a known reduction, as hard as
    factoring N (RECALLED, Rabin for degree 2); so for factoring one chooses
    r first and every polynomial is then a vector of L_r. For a prime-field
    DLP the modulus is prime and roots are computable, so F is absent.

    THE TABLE FORCED BY (R, H1, F), all entries derived in this record.
    Base-m / Kleinjung (d, 1) with the small root r = m: x = y = 1/(d+1),
    D = d + 1, sigma = 2. Generic (d, d) with both polynomials from one
    random L_r: x = y = 1/(d+1), D = 2d, sigma = 4d/(d+1), which tends to 4
    and gives c -> (128/9)^(1/3) = 2.42, WORSE than base-m. Montgomery two
    quadratics (2, 2): coefficients N^(1/4) each, D = 4, sigma = 2, a TIE
    with a base-m cubic, reached only because the geometric-progression
    construction places r in the N^(-1/2) tail of the ensemble. Prest-
    Zimmermann generic degree d: their resultant exponent
    2(d^2 - 2d + 2)/(d^2 - d + 2) converts, via sigma = 2 rho for balanced
    pairs (rho = log|Res| / log N), to sigma_PZ(d) = 4(d^2 - 2d + 2)/
    (d^2 - d + 2) = 2, 2.5, 2.857, 3.09 at d = 2, 3, 4, 5, interpolating from
    the Montgomery tie toward the generic value 4. The IDEAL (d, d) pair with
    resultant exactly N, whose construction is the open problem RQ-GNFS-c6ce52
    names, has sigma = 2 exactly, again a tie and never below. Joux-Lercier
    (d+1, d) for a PRIME modulus: x = 0, y = 1/(d+1), D = 2d + 1, sigma =
    2 - 1/(d+1) = 2D/(D+1), which is the vertex where Lemma R and H1's
    counting line meet, reachable only because F is absent. Minimising S on
    the region cut out by R and H1 gives S >= 2/(D+1) when d1 differs from
    d2 and S >= 2/D when d1 = d2, hence sigma >= 2D/(D+1) for every
    two-polynomial NFS, and c >= (64/9)^(1/3) (1 - O(1/D))^(1/3), which is
    (64/9)^(1/3) (1 - o(1)) because D grows. CLOSURE OF TARGET 2 at the
    docs/inventor-protocol.md section-4 standard, obstruction named as
    (R, H1, F) with an argument, forward guidance in (E). The open geometric-
    progression problem for degree >= 3 is a problem about the o(1) and about
    practical sizes, not about the constant.

    (C) THE DLP DISCRIMINATOR. Joux-Lercier achieves sigma = 2 - 2/(D+1) and
    base-m achieves 2, so at matched N and matched D the DLP pair's norm
    product is smaller by the factor N^(2/(D(D+1))) -- an o(1) effect but a
    SIGNED, SIZED prediction, and one the record literature is consistent
    with: Boudot et al. 2020 (retrieved through the ar5iv rendering, figures
    relayed by a fetch tool) used Joux-Lercier degrees (4, 3) with the small
    polynomial's coefficients bounded by 150 for DLP-240, and Kleinjung's
    degree (6, 1) for RSA-240. The ingredient the two problems do NOT share
    at the polynomial-selection stage is therefore exactly Obstruction F.

    (D) THE TOY VALIDATION. H1 is sampled directly, at 64 to 256-bit N, by
    exact shortest-vector computation in the root lattices, against the
    Rogers-type law for random lattices, with the SNFS form N = f(m) as the
    nearby object on which H1 FAILS BY CONSTRUCTION (L_m contains f, which is
    exponentially shorter than N^(1/(d+1))) and Montgomery's construction as
    the positive anchor that must land in the predicted tail. The table in
    (B) is then measured as norm-product bit shifts over a fixed box.

    (E) NOT CLAIMED. No constant or exponent moves; sota_delta is +0. Nothing
    is said about THREE OR MORE polynomials (Coppersmith's multiple-polynomial
    sieve amortises the linear side over V = L[1/3, .] algebraic polynomials
    and is reported at 1.902; that family is off-limits as the lens here and
    is the first item of forward guidance). Nothing is said about the
    Dickman term H2 beyond its validation; the object that attacks H2 is
    IDEA-20260901-e51076. Nothing here is a statement about any deployed key.

  mechanism: >-
    The balance has one norm-size term and one region term. The region term
    is D log A / 2 and is pair-independent; the norm-size term is S log N and
    is the ONLY channel through which the pair acts, so the constant is a
    function of sigma = D S alone once the degree parameter is optimised.
    Substituting 2/delta -> sigma/delta in H-RSA-68884a's Steps 1-3 and
    minimising over delta gives 3 beta^2 - beta delta - sigma/delta = 0 and
    the stationarity condition delta^3 = 3 sigma/2, whence beta = sigma /
    delta^2 = (4 sigma/9)^(1/3) and c = 2 beta. Lemma R bounds sigma from
    below only for balanced coefficient sizes (it reads sigma >= 2 rho >= 2
    when x = y); unbalanced pairs escape it and H1 is what closes the escape,
    because the polynomial with the smaller coefficients must come from the
    root lattice of a root that the OTHER polynomial fixes, and a random root
    lattice has no vector shorter than N^(1/(d+1)). The only way around H1 is
    to choose the small polynomial first and take its root -- which Obstruction
    F forbids for a composite modulus and permits for a prime one. That
    asymmetry is why the factoring and DLP tables differ by exactly the
    Joux-Lercier row, and why the DLP control locates the ingredient.

  novelty_status: unverified

  citations:
    - ref: >-
        Prest, Zimmermann, Non-linear polynomial selection for the number
        field sieve, J. Symbolic Computation 47(4), 2012, 401-409; preprint
        members.loria.fr/PZimmermann/papers/polyselect.pdf
      provenance: retrieved
      claim: >-
        Read in full (pages 1-9 of the preprint this session). Montgomery's
        two quadratics give coefficients O(N^(1/4)) with resultant N; no
        efficient method is known for two non-linear polynomials beyond it;
        section 3.1 gives the heuristic count of about N^(1/d) admissible
        degree-d pairs with coefficients O(N^(1/(2d))); the generalised
        geometric-progression method gives resultant O(N^(5/4)) at d = 3
        against Williams' O(N^(4/3)) and, in the generic case, resultant
        N^(2(d^2-2d+2)/(d^2-d+2)); a GP of d + 1 terms of size O(N^(1/2))
        would give resultant near N, easy for d = 2 and, in their words,
        seemingly more difficult for d >= 3; different degrees d and d - 1
        are named as open.
