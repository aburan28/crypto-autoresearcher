  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING PLUS WEB VERIFICATION OF EXTERNAL
      SOURCES. The crypto-kb MCP server was not available to this session (the
      orchestrating session reports the collection does not exist and the index
      is ':memory:'). Read RQ-GNFS-c6ce52, RQ-SNFS-005666, RQ-RSA-afe33c,
      RQ-PAIR-f2e31f in full; read the claim blocks of IDEA-20260805-1775f2,
      IDEA-20260808-71c077, IDEA-20260808-589c19, IDEA-20260805-72bcb5,
      IDEA-20260808-0cdd09, IDEA-20260816-9cfbac; grepped ledger/ for
      resultant, nonlinear polynomial, Joux-Lercier, two quadratics, base-m,
      Kleinjung, Prest, root lattice. Web: Prest-Zimmermann read in full;
      Koo-Jo-Kwon, BBDT, Le Gluher-Spaenlehauer-Thome abstracts read;
      Coppersmith and the DCC 2025 complexity-formulae paper reachable only as
      metadata.
    results: >-
      NEAREST WORK. (1) The DCC 2025 paper on complexity formulae for NFS
      variants, unread, is the likely home of a general sigma-like
      parameterisation; if so claim (A) is a re-derivation and is labelled as
      such. (2) Prest-Zimmermann section 3.1 already contains the counting
      heuristic behind H1 and the statement that no efficient two-nonlinear
      method beyond Montgomery is known; this record adds the conversion of
      their resultant exponents to sigma, the placement of base-m, Montgomery,
      generic-lattice, ideal and Joux-Lercier pairs on one frontier, and the
      identification of root extraction modulo a composite as the exact
      factoring/DLP asymmetry. (3) H-RSA-68884a and IDEA-20260805-1775f2
      parameterise the SAME balance by a charging exponent theta on memory;
      this record parameterises it by the norm-size term sigma and holds
      theta = 0; the two families are orthogonal and could be composed. (4)
      IDEA-20260816-9cfbac measures norm shifts for special versus general
      polynomials at the same degree; this record's toy test compares
      polynomial pairs at the same TOTAL degree with different degree splits.
      No filed proposal derives a lower bound on sigma or names Obstruction F.
    verdict: >-
      UNVERIFIED. The balance is textbook, the counting heuristic is in
      Prest-Zimmermann, and a general complexity-formula paper exists unread.
      The honest classification is 'adaptation' for the slice and
      'speculative' for the (R, H1, F) closure, and the label the contract
      allows without a completed literature check is unverified.

  object_first_candidate:
    tracked_object: >-
      THE COEFFICIENT-SIZE VECTOR (x, y) OF A POLYNOMIAL PAIR WITH A COMMON
      ROOT, together with its degree split (d1, d2), followed from the
      polynomial-selection lattice through the norm-size term into the
      L[1/3] balance and out as sigma = D (x + y). Families declared
      OFF-LIMITS as the primary lens for this record, having been named in
      RQ-GNFS-c6ce52's methods: Coppersmith's multiple-polynomial sieve, the
      factorization factory, batch NFS, lattice sieving and special-q, block
      Wiedemann. Also off-limits as a lens: Murphy-alpha root-property
      optimisation, which acts on the Dickman term and is IDEA-20260901-e51076's
      object.
    lossiness: >-
      PASSES. The projection (f, g) -> (x, y, d1, d2) discards the
      polynomials entirely -- their roots, Galois groups, root properties,
      discriminants, skew -- and keeps four numbers; infinitely many pairs
      share an image, so it is not a change of coordinates. What is discarded
      is discarded compatibly with the operation that matters here, the
      balance: the L[1/3] constant depends on the pair only through sigma up
      to o(1), which is claim (A), so the retained part propagates
      deterministically through the derivation. What the projection loses and
      the balance does NOT forgive is the alpha-shift, which is an o(1)-level
      correction here and is charged to IDEA-20260901-e51076.
    propagation: >-
      ONE STEP IS THE BALANCE. Given (x, y, d1, d2) the record computes sigma,
      then (delta, beta, c) in exact rationals; that map is deterministic and
      is the reproduction check. The second propagation, from a construction
      to (x, y), is what the three constraints govern: a construction that
      fixes r first lands on x = y = 1/(d_i + 1) under H1; one that fixes a
      small polynomial first lands on x = 0 and needs a root, which F forbids
      for composites.
    survival_score: >-
      Survives for every two-polynomial variant, since every such variant has
      a coefficient-size vector; dissolves at THREE polynomials, where the
      norm-size term is no longer a single product and the multiple-polynomial
      analysis takes over (that is where the object ends and is the forward
      guidance). Dissolves also when the sieve is not two-dimensional (tower
      and higher-dimensional sieving), which RQ-PAIR-f2e31f owns.

  proof_search_map:
    bottleneck: >-
      The norm-size term S log N of the balance, equivalently sigma. Removing
      it (sigma -> 0) would send c to 0; halving it (sigma = 1) is the special
      sieve. Every polynomial-selection proposal is a proposal about this one
      term, and the decision-changing question is whether any constructible
      pair has sigma < 2 - o(1) for a general composite N.
    baseline_embedding:
      parameter_slice: >-
        sigma = 2 reproduces (delta^3, beta^3, c^3) = (3, 8/9, 64/9), the
        classical GNFS triple and H-RSA-68884a's gates G1-G2 at theta = 0;
        sigma = 1 reproduces c^3 = 32/9, the special sieve constant. Both
        are exact rational identities of the closed forms, not numerical
        resemblances.
      reproduction_check: >-
        Symbolic. Cube the closed forms delta^3 = 3 sigma/2, beta^3 =
        4 sigma/9, c^3 = 32 sigma/9 at sigma = 2 and sigma = 1 in exact
        rational arithmetic and diff against the fixture values; additionally
        verify that the stationarity condition and the relation condition
        close on each other for symbolic sigma, i.e. that 3 beta^2 - beta
        delta - sigma/delta = 0 and delta^3 = 3 sigma/2 jointly imply beta =
        sigma / delta^2. A failure at either slice voids the record at zero
        compute.
    observation_collision:
      observable: >-
        sigma, and through it c. Two collisions are DESIGNED and are the
        content of the closure: a base-m pair of degrees (2d-1, 1) and an
        ideal (d, d) pair with resultant N both have sigma = 2 -- the tie;
        and Joux-Lercier at sigma = 2 - 2/(D+1) collides with base-m at
        sigma = 2 in c because the difference is o(1). The observable c
        therefore does NOT identify the pair type below the o(1), which is
        exactly why the claim is a closure of the CONSTANT and says nothing
        about practical sizes, where IDEA-20260901-e849e4 and the toy test
        measure the difference directly.
      distinct_preimage_search: >-
        The table in claim (B) is the search: seven construction types with
        their (x, y, D) and sigma. The pair that must NOT collide is SNFS
        (sigma = 1) versus every general construction (sigma >= 2 - o(1)); if
        the toy measurement found a general construction at sigma near 1 the
        closure would be falsified outright.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from 'polynomial pair' to 'coefficient-size vector plus degree
          split', where the hypothesis 'this pair moves the constant' becomes
          the exact inequality sigma < 2 - o(1), and where the three
          constraints R, H1, F are a theorem, a distribution heuristic with a
          validation route, and a hardness obstruction respectively.
        predicted_gain: >-
          A decidable, zero-compute test of any polynomial-selection proposal
          against the constant, plus a measured toy validation of the one
          heuristic input; no cost gain.
      - transform: observable_fiber
        proposed_object: >-
          Hold sigma = 2 fixed and vary the forgotten structure -- degree
          split, skew, root richness -- across base-m, Montgomery and ideal
          (d, d) pairs, then measure the norm-product histogram over a fixed
          box to see which forgotten degrees of freedom move the o(1) at
          reachable sizes.
        predicted_gain: >-
          Either the o(1) differences at 60-100 digits are within the LLL
          constant band (the tie is a tie in practice too) or one construction
          wins measurably at reachable sizes, which is an engineering finding
          for RQ-SNFS-005666's crossover work, not a constant.
    quantifier_order: >-
      FOR ALL general composite N and FOR ALL pairs (f, g) with a common root
      modulo N that are constructible in time L[1/3, O(1)] without factoring
      N, ASSUMING H1 for the root lattices of the roots those constructions
      reach, sigma(f, g) >= 2 D/(D+1) - o(1). The witness pair may depend on N
      and on the construction; the bound may not. The existential statement
      THERE EXIST pairs with sigma = 2 for (d, d) (Prest-Zimmermann's count,
      about N^(1/d) of them) is compatible with the universal one because
      existence is not constructibility; and THERE EXIST N with pairs at
      sigma = 1 is the special-form class, which is the H1 failure set, not a
      counterexample to the universal claim over general N.
    method_ceiling:
      strongest_certifiable_claim: >-
        A CONDITIONAL lower bound on sigma for two-polynomial NFS, hence the
        statement that polynomial selection with two polynomials cannot move
        c for general N, conditional on H1 and on the absence of a root-
        extraction method for composites. The method certifies nothing about
        three or more polynomials, nothing about the Dickman term, nothing
        about the o(1), and nothing about special-form N.
      nearby_object_control: >-
        THE SPECIAL FORM N = f(m) with f of tiny coefficients. There H1 is
        FALSE by construction -- L_m^(d) contains f, exponentially shorter
        than N^(1/(d+1)) -- and sigma = 1, so the conclusion 'sigma >= 2 -
        o(1)' is known false. The apparatus must (i) detect the H1 failure
        from the lattice statistic alone and (ii) measure sigma near 1, or it
        has not identified the load-bearing structure. A second nearby object
        is the prime modulus with Joux-Lercier, where F is absent and sigma
        must come out at 2 - 1/(d+1).
    proof_obligations:
      - claim: >-
          The closed forms at sigma = 2 reproduce (3, 8/9, 64/9) and at
          sigma = 1 reproduce c^3 = 32/9.
        responsibility: baseline
      - claim: >-
          Lemma R, the skew-invariant resultant inequality d2 x + d1 y >= 1 -
          o(1), with the constant C(d1, d2) made explicit.
        responsibility: size
      - claim: >-
