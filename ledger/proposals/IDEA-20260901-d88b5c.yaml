  minimal_test:
    design: >-
      SIX STEPS, ALL CHEAP, FIRST TWO AT ZERO COMPUTE. STEP 0 (symbolic,
      blocking): re-derive the balance with sigma symbolic in a computer
      algebra system, emit the closed forms, cube them at sigma = 2 and 1 in
      exact rationals and diff against the fixture (3, 8/9, 64/9, 32/9);
      prove Lemma R's skew invariance symbolically for (d1, d2) up to (6, 6).
      STEP 1 (minutes): build a frozen set of moduli -- 100 random balanced
      semiprimes at each of 64, 128, 192, 256 bits with recorded seeds, 20
      random primes of each size, and 20 special-form N = f(m) per size with
      f of coefficients at most 10 and degrees 3..6 -- committed before any
      lattice is reduced. STEP 2 (minutes to an hour): for each composite N,
      1000 uniform roots r, d in 2..6, build L_r^(d), compute lambda_1 and
      lambda_2 exactly, record the normalised values; run the same on the
      special-form N at r = m and on the roots produced by Montgomery's
      construction at d = 2. STEP 3 (minutes): construct the pairs of the
      table -- base-m with Kleinjung-style small leading coefficient, generic
      (d, d) from L_r, Montgomery (2, 2), Prest-Zimmermann (3, 3) with their
      skew rule, Joux-Lercier (d+1, d) on the primes -- and measure sigma from
      skewed coefficient sizes. STEP 4 (hour): over a fixed coprime box,
      score the norm-product bit histogram of each pair with the
      IDEA-20260816-9cfbac instrument and report the matched-D gaps. STEP 5
      (hours): count B-smooth norm products by trial division for B = 2^16
      to 2^22 and compare with rho(u) times the alpha correction, with the
      largest-prime-factor CDF and the smoothest-sample tail check. STEP 6:
      write the obstruction block with the measured H1 statistics, their
      intervals, the runs, and the scope.
    controls:
      - >-
        SYMBOLIC FIXTURE (blocking): the sigma = 2 and sigma = 1 slices must
        reproduce the known constants exactly before any lattice is built.
      - >-
        POSITIVE ANCHOR: Montgomery's construction at d = 2 must give sigma =
        2 and must land in the predicted N^(-1/2) tail of the lambda_1
        lambda_2 statistic; failure means the sampler or the normalisation is
        wrong.
      - >-
        NEGATIVE ANCHOR (nearby object): special-form N at r = m must show
        the H1 failure in the lattice statistic and sigma near 1.
      - >-
        PRE-REGISTRATION: moduli, roots' seeds, degrees, box, smoothness
        bounds and the KS threshold are frozen in a committed file before
        STEP 2.
      - >-
        NULL FOR THE NORM GAP: for each (d, d) pair, a base-m pair of the SAME
        total degree on the SAME N over the SAME box, so the gap is a
        degree-split effect and nothing else.
      - >-
        DLP ARM: primes of the same sizes with Joux-Lercier pairs, so the
        factoring/DLP asymmetry of claim (C) is measured rather than argued.
    required_metrics:
      - exact rational values of the closed forms at sigma = 2 and sigma = 1
      - per-(d, size) KS distance of the lambda_1 law and the lambda_2 tail count
      - measured sigma per construction type with LLL-constant normalisation
      - matched-D norm-product gaps in bits with box-derived error bars
      - Dickman ratio per pair type and u, with tail checks
      - SNFS anchor statistic and Montgomery anchor statistic
      - frozen fixture hash, seeds, and an artifact manifest with a rebuild receipt

  falsification_conditions:
    - >-
      The closed forms fail either slice. The derivation is wrong and nothing
      downstream is read.
    - >-
      The lambda_1 law or the second-minimum tail of random root lattices
      departs from the random-lattice prediction by more than the declared
      threshold at any size, in the direction of SHORTER vectors. H1 is false
      for root lattices, the closure is void, and the finding is that
      generic root lattices have structure -- the most valuable possible
      outcome and one to be handed to the coordinator as a new object.
    - >-
      Generic (d, d) pairs measure sigma near 2 rather than near 4d/(d+1), or
      the matched-D norm gap is consistent with zero at 256 bits. Same
      consequence as above, localised to the second minimum.
    - >-
      Montgomery pairs measure sigma far from 2, or the special-form anchor is
      not flagged. The apparatus is broken and no number is read.
    - >-
      Joux-Lercier pairs on primes do not reach 2 - 1/(d+1). Then the vertex
      is not reachable even without F, and claim (C)'s discriminator is
      misplaced; the factoring closure survives but its forward guidance
      about the DLP side must be rewritten.
    - >-
      Dickman ratios exceed 3 at toy u. H2 is unusable at these sizes and
      the record's norm claims are reported in bits only, with the closure
      resting on H1 and R alone.

  confounders:
    - >-
      LLL AND SKEW CONSTANTS. Coefficient sizes carry 2^(O(d)) reduction
      constants and the skew choice shifts x and y by O(1)/log N.
      MITIGATION: sigma is read from log N-normalised sizes at four bit
      sizes and the O(1)/log N drift is fitted and removed; the table is
      about slopes in log N, not intercepts.
    - >-
      ALPHA AND ROOT PROPERTIES differ between construction types and shift
      the effective norm by O(1) nats. MITIGATION: the norm gap is reported
      in bits before any smoothness conversion, and the smoothness comparison
      uses the alpha-corrected prediction per polynomial.
    - >-
      SMALL-DIMENSION LATTICES. Rogers' law is asymptotic in the dimension
      and dimension 3-7 has visible finite-size corrections. MITIGATION: the
      comparison distribution is computed for the exact dimension by Monte
      Carlo over random lattices of determinant N (unimodular-random Hermite
      normal forms), not from the asymptotic formula.
    - >-
      MODULUS SHAPE. Balanced semiprimes versus primes versus special forms
      differ in more than H1. MITIGATION: the factoring arm uses only
      balanced semiprimes; the special form is the declared negative
      anchor; primes appear only in the DLP arm.
    - >-
      BOX SHAPE. A rectangular box favours skewed pairs. MITIGATION: each
      pair is scored over its own optimally skewed box of the same
      cardinality, following IDEA-20260816-9cfbac's convention.

  interpretation_limits:
    - >-
      CLAIM TIER (a) of RQ-GNFS-c6ce52 for the slice and the closure -- a
      conditional theoretical statement under numbered heuristics with a
      validation route -- and tier (b) for the toy measurements at 64-256
      bits. NO constant moves, no exponent moves, and nothing here says
      anything about any deployed modulus.
    - >-
      THE CLOSURE IS ABOUT THE CONSTANT AND ONLY FOR TWO POLYNOMIALS. It says
      nothing about Coppersmith's multiple-polynomial sieve (reported at
      1.902, recalled), the factorization factory, batch NFS, or tower
      variants. Those are the forward guidance, not the scope.
    - >-
      THE o(1) IS LARGE. Per Le Gluher-Spaenlehauer-Thome the correction
      converges only beyond N > exp(exp(25)); at record sizes the tie
      between base-m and a hypothetical ideal (d, d) pair could still be a
      measurable practical difference in either direction, which is
      IDEA-20260901-e849e4's and RQ-SNFS-005666's territory.
    - >-
      H1 IS VALIDATED ON AN ENSEMBLE AT 64-256 BITS. Transfer to 2048-bit
      moduli assumes the normalised root-lattice statistics are size-
      independent, which is recorded as a transfer assumption and tested
      only across the four sizes sampled.
    - >-
      OBSTRUCTION F IS AN ABSENCE-OF-METHOD STATEMENT except at degree 2. A
      root-extraction method for composites at higher degree that is not a
      factoring method would reopen the Joux-Lercier row for factoring, and
      even then only the o(1) would move.

  heuristic_assumptions:
    - id: H1
      statement: >-
        ROOT-LATTICE GAUSSIAN HEURISTIC. For N a balanced semiprime and r
        uniform modulo N, the lattice L_r^(d) = { (a_0, ..., a_d) in Z^(d+1)
        with sum a_i r^i = 0 mod N }, of determinant N, has first minimum
        distributed as for a uniformly random lattice of the same determinant
        and dimension, P(lambda_1 <= t N^(1/(d+1))) = 1 - exp(-V_(d+1)
        t^(d+1) / 2) (1 + o(1)) with V_n the unit-ball volume, and the number
        of nonzero lattice points of norm at most t N^(1/(d+1)) is Poisson
        with mean V_(d+1) t^(d+1) / 2, uniformly for 2 <= d <= (log N)^(1/3)
        and t in (log N)^(-1) to (log N).
      rigorous_support: >-
        RIGOROUS INGREDIENT: Minkowski's theorem, lambda_1 <= sqrt(d+1)
        N^(1/(d+1)) always, and Minkowski's second theorem bounding the
        product of the minima by gamma_(d+1)^((d+1)/2) N, both used by
        Prest-Zimmermann section 1.1. CLASSICAL DISTRIBUTION IMITATED: the
        Siegel mean value theorem and Rogers' second-moment formula for
        random lattices (RECALLED), under which the lattice-point count in a
        ball is asymptotically Poisson and lambda_1 has the stated law. THE
        GAP: root lattices are a thin, arithmetically defined family (the
        Hermite normal form has a single non-trivial row (1, r, ..., r^d) mod
        N), and equidistribution of such families in the space of lattices is
        known in some cases (RECALLED, Hecke-type equidistribution of
        rational points on the modular curve for d = 1) and not proved here
        for d >= 2. H1 is therefore the hypothesis the ensemble experiment
        tests, with the special form as its known failure set.
      falsification_condition: >-
        KS distance above 0.15 at any (d, size), or a second-minimum tail
        count exceeding the Poisson prediction by a factor above 3 at the
        smallest 1 per cent of roots, in the direction of shorter vectors.
      validation_plan: >-
        SAMPLE: 100 balanced semiprimes at each of 64, 128, 192, 256 bits,
        1000 uniform roots each, d in 2..6, exact shortest and second
        vectors by enumeration in dimension at most 7. SHORTCUT: none needed
        at these sizes; at 1024-2048 bits the same statistic is computable
        (dimension is unchanged, only the entries grow), so the sampling can
        be pushed to cryptographic size cheaply, and that extension is the
        transfer check. COMPARISON: empirical CDF of lambda_1 / N^(1/(d+1))
        against a Monte Carlo reference from random unimodular-Hermite
        lattices of the same determinant and dimension (finite-dimension
        exact), and against the asymptotic Rogers law. TAIL CHECKS: the
        smallest lambda_1 over each 10^5-root sample versus its predicted
        quantile; the count of roots with two vectors below t N^(1/(d+1))
        versus the Poisson prediction, which is the tail that governs
        Montgomery-type constructions and must contain the Montgomery roots.
        RECORDED PARAMETERS: N, seeds, d, box, and the reference sampler.
    - id: H2
      statement: >-
        DICKMAN FOR NORM PRODUCTS. For a pair (f, g) as above and (a, b)
        uniform coprime in the skewed box, the product |F(a, b) G(a, b)| is
        B-smooth with probability rho(u) exp(O(alpha_f + alpha_g)) (1 + o(1)),
        u = log(norm product) / log B, uniformly for (log N)^eps < u <
        (log N)^(1 - eps), where alpha is Murphy's root-property correction.
      rigorous_support: >-
        RIGOROUS INGREDIENT: Canfield-Erdos-Pomerance for integers, and
        Balog-Blomer-Dartyge-Tenenbaum 2012 (retrieved, abstract) for binary
        forms of degree g at bounded u, Psi_F(x, y) of order x^2 for y =
        x^(g-2+eps). CLASSICAL DISTRIBUTION IMITATED: Dickman-de Bruijn rho
        for a uniformly random integer of the norm's size. THE GAP: the NFS
        regime has u tending to infinity with the degree, where only the
        conditional Bateman-Horn-based formula of Martin 2002 (retrieved,
        abstract) is available for polynomial values; H2 is the standard
        NFS heuristic and is validated here only at bounded u.
      falsification_condition: >-
        Counted-to-predicted ratio outside [1/3, 3] at any u in [3, 7] for
        any pair type after alpha correction.
      validation_plan: >-
        SAMPLE: 10^6 coprime (a, b) per pair type per N at 128 and 192 bits,
        B from 2^16 to 2^22, trial-division smoothness test. SHORTCUT: none;
        at larger N the same box is affordable because only the norm size
        grows. COMPARISON: counted smooth fraction against rho(u) computed
        from its delay differential equation with u from the measured mean
        log norm and the alpha shift. TAIL CHECKS: the empirical CDF of the
        largest prime factor of the norm product against the rho-derived
        prediction; the smoothest observed sample against the predicted
        probability of at least one such sample. TRANSFER: the u range
        sampled is 3-7; the NFS optimum at record sizes sits at larger u and
        the extrapolation is recorded as an assumption, not measured.

  target_complexity:
    time_exponent: >-
      L[1/3, (32 sigma/9)^(1/3)], which at the only sigma reachable for
      general N by two polynomials, sigma = 2 - o(1), is L[1/3, (64/9)^(1/3)]
      = L[1/3, 1.923]. NO CHANGE IS CLAIMED; the record is a closure of the
      two-polynomial route and a slice that tells every future proposal
      which term it must move. Its priority rests on being the zero-compute
      admissibility test for the whole polynomial-selection lane.
    memory_exponent: >-
      L[1/3, (4 sigma/9)^(1/3)] for the factor base and matrix, = L[1/3,
      0.9615] at sigma = 2, unchanged; the sieve's live state per processor
      is not modelled here (theta = 0 throughout, per H-RSA-68884a's
      convention and its HEUR-NFS-2 caveat).
    best_known: >-
      Single general integer, two polynomials, time counted: L[1/3,
      (64/9)^(1/3)]; Coppersmith multiple polynomials L[1/3, 1.902]
      (RECALLED); factorization factory per integer L[1/3, 1.639] after
      L[1/3, 2.007] precomputation (RECALLED, amortised, not single-integer);
      batch NFS per-key area-time L[1.704] and single-key area-time L[1.976]
      (KN-LIT-2663, relayed); special form L[1/3, (32/9)^(1/3)]. Every
      figure except the corpus-held ones is unverified here.
    hidden_overhead: >-
      DISCLOSED. The whole content of the two-polynomial closure lives inside
      the o(1), whose convergence Le Gluher-Spaenlehauer-Thome bound at
      4 log log log N / (3 log log N) with convergence starting beyond
      exp(exp(25)); a tie in the constant is compatible with large practical
      differences, and the record does not pretend otherwise. The LLL and
      skew constants and Murphy's alpha are O(1)-in-log effects also inside
      the o(1).
    tradeoff_note: >-
      The slice is derived at theta = 0 (memory free). Composing sigma with
      H-RSA-68884a's theta yields a two-parameter family c(sigma, theta) that
      is not derived here; nothing in the record changes the time-memory
      position of NFS, and parallelisation is untouched.

