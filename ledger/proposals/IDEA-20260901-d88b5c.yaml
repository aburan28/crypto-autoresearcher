    - metric: >-
        lambda1_cdf_deviation, the Kolmogorov-Smirnov distance between the
        empirical CDF of lambda_1(L_r^(d)) / N^(1/(d+1)) over random roots and
        the Rogers-type law 1 - exp(-V_(d+1) t^(d+1) / 2)
      direction: lower
      minimum_effect: >-
        KS distance below 0.05 at 1000 roots per N for d in 2..6 at each of
