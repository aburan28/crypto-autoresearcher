      claim: polynomial-time binary ECDLP is the disputed breakthrough-adjacent claim
      verified_by: idea-generator (pasted-context only; no independent retrieval in this session)
    - ref: IDEA-20260913-41c4f0
      provenance: internal
      claim: Theorem-1 constants at FIPS labels (complemented here by granted-bound head-to-head with yield retry)
      verified_by: idea-generator (pasted-context only; no independent retrieval in this session)
    - ref: KR-RHO-825bca
      provenance: kb
      claim: "Bos-Costello-Miele honest rho constants via KN-LIT-a5c59c (full_text_read): ~1129 cycles/step (32-adding) on one Core i7 for P-256 and ~3.9e24 core-years total; negation 0.947*sqrt(2), automorphism 0.790*sqrt(6) on BN254; used here only as honest-constants discipline, not as numeric input"
      verified_by: idea-generator (row text supplied in follow-up prompt 2026-10-06; source KN-LIT-a5c59c not independently opened in this session)
  assumptions:
    - Bound granted arguendo (d_F<=4 survives shift) for costing only; grant is NOT evidence for the proposition.
    - Arithmetic-only at n=163,233,283,409,571; no curve-security claim at any outcome; scope is cost inequality at stated labels under stated constants.
    - Optimistic tie-breaking where Theorem 1 leaves (C_0,w,N,q) ambiguous: w-minimal, q=1 baseline plus q in {0.1,1} sensitivity; every optimistic choice flagged.
    - Exact C(N+4,4) used, never N^4; p^{C_0}/C_0 and n^{8w+1} with explicit w; O(1) yield treated as R=1/q, never 1.
    - Refs 2013/548 and 2013/549 recalled only, no support.
  proof_search_map:
    bottleneck: the HUGE o(1) and O(1)-yield conflation that decide whether a granted polynomial law matters at any used size.
    baseline_embedding:
      parameter_slice: FIPS binary labels n=163,233,283,409,571, arithmetic-only; vOW parallel rho baseline at same n with stated constants.
      reproduction_check: reproduce the N^4-vs-C(N+4,4) gap and the q~1 counting identity (prod #Fb_i ~ p^n ~ #E) numerically before head-to-head; vOW formula must match the standard parallel-collision expression with documented constants.
    observation_collision:
      observable: per-label log2-cost gap G_n=log2(cost_Nagao,explicit)-log2(cost_vOW).
      distinct_preimage_search: same G_n>0 from different optimistic/pessimistic constant choices; searched via w-minimal vs w-stated, q=1 vs q=0.1, N^4 vs exact binomial, vOW constant sensitivity bands.
    constructive_transforms: []
    quantifier_order: FORALL n in {163,233,283,409,571} compute G_n under optimistic grant; EXISTS one n with G_n<0 falsifies the still-loses claim at stated labels; no claim beyond listed labels.
    method_ceiling:
      strongest_certifiable_claim: scoped inequality (granted-bound explicit cost vs vOW) at listed labels with sensitivity bands; no asymptotic or security claim.
      nearby_object_control: vOW baseline sensitivity; N^4-vs-binomial control; q-sensitivity; K-163 decomposition conditions noted from IDEA-20260922-2a3771 without repeating that lane.
    proof_obligations:
      - claim: constants table with every optimistic choice flagged and exact binomials
        responsibility: future executor under frozen contract
      - claim: vOW comparison uses matched parallelism/memory model with sensitivity
        responsibility: future validator
    not_applicable_reason: "Constructive proof transforms N/A: conditional costing audit claiming no theorem; bottleneck/collision/quantifier/ceiling audits retained."
  predictions:
    - metric: per-label gap G_n=log2(Nagao explicit)-log2(vOW), optimistic (w-minimal, q=1, exact binomial)
      direction: higher
      minimum_effect: G_163>=3.3 bits (>=10x) with G_n nondecreasing over {163,233,283,409,571}
    - metric: correction decomposition (binomial factor C(N+4,4)/N^4 in bits; retry R=1/q in bits for q in {0.1,1})
      direction: higher
      minimum_effect: binomial correction >=1 bit and R(q=0.1)>=3.3 bits reported separately so neither hides in o(1)
  minimal_test:
    design: |
      Arithmetic-only spreadsheet/head-to-head: extract (C_0,w,N) from Theorem-1 proof (optimistic, flagged), compute exact C(N+4,4), p^{C_0}/C_0, n^{8w+1}, R=1/q for q in {0.1,1}, sum in log2 at each FIPS n, subtract vOW log2 cost at same n with sensitivity band. NEGATIVE outcome (any G_n<0 after corrections) falsifies still-loses and is the corroborating direction for the polynomial route.
    controls:
      - N^4 vs exact C(N+4,4) costing control
      - q=1 vs q=0.1 yield-sensitivity control
      - w-minimal vs w-as-stated control
      - vOW constant/parallelism sensitivity band
    required_metrics:
      - per-label log2 Nagao-explicit cost with component breakdown (binomial, p^{C_0}/C_0, n^{8w+1}, R)
      - per-label log2 vOW cost with constants stated
      - per-label gap G_n plus sensitivity ranges
  falsification_conditions:
    - Any FIPS label with G_n<0 under stated optimistic grant falsifies the still-loses claim (that failure corroborates the polynomial route conditionally and is breakthrough-adjacent).
    - If (C_0,w,N) cannot be extracted even optimistically from Theorem 1, the audit is blocked for want of a cost law, not evidence for or against the proposition; record the extraction gap.
  confounders:
    - ambiguous (C_0,w,N) definitions across Theorem-1 proof steps (flag every choice)
    - vOW constant/parallel-model mismatch (use bands, never point comparison)
    - hidden polylog/o(1) factors beyond the priced product (list unpriced remainder explicitly)
    - B-coefficient irrelevance per curve-blindness (tabulate per n, note B-independence, do not multiply by curve count)
  interpretation_limits:
    - Granted-bound costing only; grant is arguendo and lends NO support to d_F<=4 survival or to Theorem 1 unconditionally.
    - Success (still-loses at all labels) FAILS to corroborate Theorem 1 as a practical route: ordinary scoped science, preferred; it does not refute the asymptotic polynomial claim, only its cost at listed labels under stated constants.
    - Failure (Nagao beats vOW at some label even corrected) WOULD conditionally corroborate the polynomial route and is breakthrough-adjacent: flag explicitly, needs breakthrough-tier review, and still makes NO claim about any deployed curve's security.
    - Scope is labels {163,233,283,409,571}, characteristic 2, stated constants; no extrapolation beyond listed n without new costing.
  heuristic_assumptions:
    - id: H1
      statement: |
        FORMAL (granted arguendo): the first-fall bound d_F<=4 holds uniformly for every coset-shifted chained-S_3 system counted in the Theorem-1 cost law at the costed n.
      rigorous_support: |
        No rigorous support at costed n; granted only to test constants. Partial analogue for small systems: HPS-condition FFD boundedness for unshifted S_3 descent (KR-IC-f5c584) and HKY last-fall boundedness (KR-IC-fbdb61); neither transfers to shifted chained systems at n>=163.
      validation_plan: |
        Sampling: no sampling at n>=163 (infeasible); proxy sampling is toy-n matched-pair rates from the companion measurement and null-ensemble ideas at n<=24. Comparison distribution: toy empirical preservation rate vs granted rate 1.0 (gap reported, not extrapolated). Tail checks: preservation rate vs n over toy range to test stability of the grant; grant flagged as assumption, never as finding.
    - id: H2
      statement: |
        FORMAL (yield law): relation yield q per chained system satisfies q=c+o(1) with c~=1 from prod_i #Fb_i ~ p^n ~ #E under a uniform-random heuristic, so expected systems per relation R=1/q=O(1) with explicit constant 1/c.
      rigorous_support: |
        Counting identity prod #Fb_i ~ p^n is exact combinatorics; uniformity step is heuristic. Classical analogue: random-map occupancy / coupon heuristics for uniform relation search; rigorous proxied by toy-n relation counts only.
      validation_plan: |
        Sampling: toy-n relation counts on matched pairs at n<=24 to estimate empirical q_hat vs 1. Comparison distribution: q_hat histogram vs point mass at 1 with dispersion and zeros reported. Tail checks: q_hat vs n and vs coset dimension; carry q in {0.1,1} sensitivity to FIPS labels without asserting transfer.
  target_complexity:
    time_exponent: Nagao claims O(n^{8w+1}) poly in n (exponential-to-polynomial vs vOW 2^{n/2} IF proposition holds); this audit claims NO exponent improvement and tests that the granted poly still loses on constants at listed labels
    memory_exponent: matrix C(N+4,4) factor made explicit; vOW memory model stated with sensitivity; no new tradeoff claimed
    best_known: vOW parallel rho ~2^{n/2} generic at FIPS binary labels (baseline); KR-IC-1fcdbc measured negative context
    hidden_overhead: HUGE o(1) decomposed into priced product plus explicitly listed unpriced remainder; optimistic choices flagged
    tradeoff_note: parallel vOW vs sequential Groebner/linear-algebra compared under stated models with bands; no wall-time bound claimed
  estimated_cost:
