idea:
  id: IDEA-20261006-ef3939
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-06'
  approved_by: null
  title: "Conditional-grant explicit costing: Theorem-1 vs vOW at FIPS binary labels with exact binomial and yield retry"
  class: composition
  claim: |
    Granting d_F<=4 survival arguendo, constant-explicit Nagao Theorem-1 cost with exact C(N+4,4) (not N^4), explicit C_0 and p^{C_0}/C_0, explicit chaining width w, and yield retry factor R=1/q (q~1 from prod #Fb_i ~ p^n ~ #E) exceeds vOW parallel rho cost at every FIPS binary label n in {163,233,283,409,571} by >=10x (>=3.3 bits) at n=163 under optimistic (w-minimal, q=1) choices, growing thereafter. Falsified if any label shows explicit Nagao cost below vOW after corrections.
  mechanism: |
    OBJECT FRAME: point representation R_bin = x-coordinate of E/F_{2^n} restricted to Nagao affine coset, Weil-descended via S_3 (Nagao Def.1 / KN-LIT-fa346d family); tracked object here is the cost ledger L=(N, C_0, w, C(N+4,4), p^{C_0}/C_0 term, n^{8w+1} factor, yield q and retry R, vOW baseline at same n). Operation set Sigma_Fb = translation by factor-base elements only (Class I partial-action); L propagates under relation-collection counting, not under group walks.
    TRICHOTOMY: Class I partial-action, because L counts relation vectors obtainable only via Sigma_Fb translations; vOW walk-collision counting (F1) used ONLY as a named baseline component, never as the lens, per off-limits rule.
    LOSSY-PROJECTION TEST vs Sigma_Fb: D=L discards per-relation coefficients, matrix entries, and schedule details. Sigma-compatibility: translating the relation search by factor-base elements permutes counted relations deterministically without discarded details. Lossiness: many distinct relation sets yield one L; many-to-one, not a coordinate change.
    PRICE THE OPEN NUMBER: open number = the HUGE o(1) plus O(1)-yield conflation. Priced as explicit product: Groebner/linear-algebra factor via C(N+4,4) and w, p^{C_0}/C_0 factor, n^{8w+1} chaining factor, retry R=1/q with q from prod #Fb_i ~ p^n ~ #E (~1, constant success probability NOT 1). Measurement plan is arithmetic-only at n=163,233,283,409,571: extract (C_0,w,N) from Theorem-1 proof with optimistic tie-breaking flagged, compute exact binomials, tabulate log2 costs vs vOW parallel rho at same n with stated vOW constants and sensitivity bands.
    F2 DELTA: adds the yield-law plus exact-constant audit beyond Semaev descent + Nagao cosets; proposes no new descent. Complements IDEA-20260913-41c4f0 (which writes constants down) by granting the bound and testing the head-to-head inequality with R correction; complements IDEA-20260922-1a081a (costing never reads B, so tabulate per n) and IDEA-20260922-2a3771 (K-163 conditions recorded as sensitivity, not repeated).
    FACTOR-BASE ESCAPE: inside KN-OPEN-020 scoped-out class; no escape claimed; stops per constraint (f).
  novelty_status: unverified
  citations:
    - ref: Nagao 2015/984 Theorem 1 (O(n^{8w+1}), HUGE o(1), O(1) yield)
      provenance: recalled
      claim: cost law under audit (granted arguendo, not asserted)
    - ref: KR-IC-1fcdbc
      provenance: kb
      claim: measured negative that summation stays far slower than rho at tested binary sizes; vOW baseline context
      verified_by: idea-generator (pasted-context only; no independent retrieval in this session)
    - ref: KR-IC-889857
