idea:
  id: IDEA-20260906-7bd805
  question_id: RQ-GRUMPY-964876
  goal_id: null
  goal_id_note: >-
    RQ-GRUMPY-964876 has no bound GOAL record at filing time (context file
    for TASK-20260906-faad4d). Left null deliberately.
  added: '2026-09-06'
  title: >-
    THE SET OF TARGETS SOLVED BY THE GRUMPY-GIANTS ALGORITHM AFTER n
    ADDITIONS IS TARGET-INDEPENDENT -- a union of three explicit
    interval systems in Z/l -- SO THE AVERAGE-CASE CONSTANT IS THE INTEGRAL
    OF AN EXPLICIT PIECEWISE-POLYNOMIAL COVERED-DENSITY FUNCTION rho(tau; mu,
    phi), NOT A FIRST-COLLISION EXPECTATION: c(mu, phi) = 3 * integral of
    (1 - rho) d tau, the phase phi = (l mod m)/m is a schedule degree of
    freedom that may or may not survive at leading order, and every value is
    checkable as an exact integer sum against exhaustive all-target means
    before it is believed
  class: mechanism

  claim: >-
    SETTING. Generic group of prime order l written additively as Z/l with
    generator 1; the target is x in Z/l (Q = xP), uniform. Cost unit is one
    group addition; lookups, comparisons and storage are charged separately.
    SCHEDULE FAMILY S (declared input, finite grid). m = round(mu * sqrt l)
    with mu on a grid; three sequences computed one element per addition in
    a declared interleaving order (default strict round-robin baby, giant-1,
    giant-2, generalised to a rate vector (r_b, r_1, r_2) on a grid): baby
    b_i = i (i = 0, 1, ...), giant-1 g_j = x + j m, giant-2 h_k = s x -
    k (m + 1) with s on the grid {2, -1, 1} and the sign of the second
    step on {+1, -1}. The RECALLED Bernstein-Lange instance is s = 2 with
    giant-2 walking backward in steps of m + 1; it is a POINT of S to be
    pinned in Stage 0, not a dependency of the theorem.

    THEOREM A (TARGET INDEPENDENCE; elementary). A collision b_i = g_j
    holds iff x = i - j m; b_i = h_k iff x = s^{-1} (i + k (m + 1));
    g_j = h_k iff x = (s - 1)^{-1} (j m + k (m + 1)) (s = 2 gives
    x = j m + k (m + 1); s = 1 makes the last type empty and is the
    degenerate control). Self-collisions within a sequence do not occur
    while the index range is below l / gcd(step, l) = l. Hence the set C_n
    of targets solved within the first n additions is the union of three
    EXPLICIT subsets of Z/l determined by (l, S, n) alone, and the exact
    all-target mean is
      mean(l, S) = (1/l) * sum over n >= 0 of (l - |C_n|)
    plus the precomputation cost of m P, (m + 1) P and s Q (O(log l)
    additions, reported separately). The all-target mean is therefore an
    integer ratio computable WITHOUT simulating any target, in O(l) bit
    operations via an incremental bitmap (each new element marks at most
    n new residues, total O(sum of sequence lengths squared) = O(l)).

    THEOREM B (CONTINUUM DENSITY; the derivation-level claim). Write
    n = 3 tau sqrt l (round-robin) and phi = (l mod m)/m. Each of the three
    solved sets is a union of intervals: type b-g is intervals of length t
    at positions -j m; type b-h is 2t intervals of length about t/2 at
    positions k (m + 1)/2 and k (m + 1)/2 + l/2 (s = 2); type g-h is
    intervals of triangular lengths min(s', t - 1) - max(0, s' - t + 1) + 1
    at positions s' m, s' = j + k. Their local densities and pairwise
    overlaps are piecewise-linear functions of (tau, mu) and of the lattice
    phase phi; consequently rho(tau; mu, phi) = lim |C_{3 tau sqrt l}| / l
    is an explicit piecewise polynomial of degree at most 2 in tau on
    finitely many pieces, and
      c(mu, phi) = 3 * integral from 0 to tau_max of (1 - rho) d tau
    is a rational function of the piece endpoints, hence a rational number
    at rational (mu, phi). The finite-l correction is O(1) additions:
    mean(l, S) = c sqrt l + O(1), NOT c sqrt l (1 + o(1)) with an
    unquantified o(1).

    THE DISCRIMINATION THIS RECORD IS BUILT TO MAKE. Type b-g intervals sit
    on the lattice m Z shifted by l mod m; type g-h intervals sit on m Z
    unshifted. Where their regions overlap, the overlap is a function of
    phi at LEADING order (worked instance in mechanism). Two mutually
    exclusive readings: READING 1 (SINGLE CONSTANT) -- for the optimal
    schedule in S the overlapping regions are empty or saturated, so
    c(mu, phi) = c(mu) and the exact constant is one rational number per
    mu; READING 2 (PHASE-DEPENDENT LEADING TERM) -- c(mu, phi) varies with
    phi at leading order, in which case the quantity the RQ calls 'the
    constant' is either the phase-average or the phase-OPTIMUM, and since m
    is chosen by the algorithm (a window of width Theta(sqrt l) around
    mu sqrt l sweeps every phase), the honest optimal constant is
    min over (mu, phi) of c(mu, phi), which is a schedule choice no
    published constant (GWZ conjectural 1.25) is known by this record to
    have made. Either reading is a result; a fitted single number that
    ignores phi is not.

    CONSISTENCY ANCHORS DERIVED IN-RECORD (own arithmetic, not opened
    sources). One-giant round-robin BSGS in the same framework has
    rho = tau^2 (no overlaps, no phase) up to tau = 1 at mu = 1, giving
    2 * integral (1 - tau^2) = 4/3 -- Pollard's interleaved constant
    (recalled) -- and 0.75^2 = 0.5625 at budget 1.5 sqrt l, which is
    exactly the BSGS figure in KN-LIT-7291 (retrieved abstract). The
    random-walk row 1 - exp(-1.5^2 / 2) = 0.6753 reproduces the second
    figure. The grumpy figure 0.71875 = 23/32 at 1.5 sqrt l requires
    total pairwise-overlap density exactly 1/32 at tau = 0.5; the schedule
    point in S that yields exactly 23/32 is the Stage 0 pin of the
    Bernstein-Lange instance.

  mechanism: >-
    (1) Every collision condition is linear in x with an invertible
    coefficient (l prime, s and s - 1 units), so 'x is solved by time n'
    is membership of x in a set that does not depend on x; the mean of the
    first-hit time is the tail sum of the complement sizes. (2) Each solved
    set is a two-dimensional generalised arithmetic progression
    {u + i + j d : i < t, j < t'} in Z/l, i.e. a union of intervals on a
    lattice d Z; dilation by a unit (s^{-1}) maps an interval to two
    half-length intervals. (3) Union sizes of finitely many interval systems
    on commensurate lattices are computed exactly by inclusion-exclusion on
    intervals; in the continuum limit the counts become integrals of
    piecewise-linear local densities. (4) WORKED PHASE INSTANCE (recalled
    schedule, mu = 1, tau = 0.5, s = 2): type b-g occupies positions
    [1 - tau mu, 1] of the circle with local density tau/mu = 1/2 on the
    lattice m Z + (l mod m); type g-h occupies [0, 2 tau mu] = [0, 1] with
    a triangular density ramp on m Z. On [1/2, 1] the per-lattice-cell
    overlap is max(0, min(1/2, 1 - sigma - phi)); integrating over sigma
    gives 1/8 at phi = 0 and 0 at phi >= 1/2. That is a leading-order
    phase effect of size up to 1/8 of l in the success probability at
    budget 1.5 sqrt l -- larger than the 1/32 total overlap implied by
    23/32 -- which is why the recalled schedule cannot be the BL instance
    as written and why Stage 0 pins it by the 23/32 criterion rather than
    by memory. (5) The b-h system sits on the lattice ((m + 1)/2) Z whose
    residues mod m drift, so its overlaps with the other two average over
    phase and contribute product-like terms; those are phase-independent
    and computable in closed form. (6) The exact finite-l count differs
    from l * rho by boundary terms O(t) per n, summing to O(1) in the mean.

