  assumptions:
    - l an odd prime not equal to 3 so that 2, s and s - 1 are units; composite l is the nearby object where Theorem A fails (b-h collisions no longer determine x uniquely).
    - Collision detection is immediate (each new element is looked up in the other two tables); lookups are charged separately and never enter the addition count.
    - Toy scale l from about 2^10 to the largest l at which the exhaustive per-target column is affordable; the theorem is scale-free but every measurement is toy-tier.
    - The negation-map variant is a separate parameter and is NOT covered by this record's claim; its covered sets are unions of S and -S and are the subject of the companion measurement record.

  proof_search_map:
    bottleneck: >-
      The inclusion-exclusion of the three interval systems on the
      lattices m Z + (l mod m), m Z and ((m + 1)/2) Z in the continuum
      limit -- specifically whether the g-h / b-g overlap is
      phase-dependent at leading order for the OPTIMAL schedule. Everything
      else is bookkeeping.
    baseline_embedding:
      parameter_slice: >-
        Rate vector (1, 1, 0) (no second giant) reproduces interleaved BSGS
        with rho = tau^2 and c = 4/3 at mu = 1; rate vector (1, 0, 0) until
        the baby table is full, then (0, 1, 0), reproduces classical BSGS
        at 1.5 sqrt l; both are exact slices of Theorem A. The fixed-budget
        slice tau_total = 1.5 must give 0.5625 (BSGS) and, for the pinned BL
        point, 0.71875.
      reproduction_check: >-
        Frozen fixture: at l = 4099 (and two more primes near 2^12 and
        2^14) the covered-set counter must return, for the (1, 1, 0) slice,
        an all-target mean whose value/sqrt l lies within O(1)/sqrt l of
        4/3, and the exhaustive per-target simulation must return the SAME
        integer numerator. The BL pin: a schedule in S whose |C_n|/l at
        n = 1.5 sqrt l is within 1/sqrt l of 23/32 at three ladder primes.
    observation_collision:
      observable: The integer |C_n| for every n (equivalently the exact mean numerator) and the continuum function rho.
      distinct_preimage_search: >-
        REQUIRED. Two different instruments -- per-target simulation of the
        algorithm and the target-free covered-set counter -- must produce
        the identical integer at every n; a disagreement localises to a
        specific (n, x) and is checked by hand. Two different schedules
        with the same rho are expected (e.g. s = 2 and s = -1 may coincide
        after relabelling) and are not a failure; two different l with the
        same (mu, phi) grid point must give normalised means within O(1)/
        sqrt l of each other -- that is the phase test.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'first collision time of three random-looking sequences'
          by 'membership of x in a target-independent union of interval
          systems'; expectation becomes an exact counting problem.
        predicted_gain: Exact integer mean at every l without simulation; a continuum constant as an integral of a piecewise polynomial.
      - transform: specialization_pack
        proposed_object: >-
          The phase phi = (l mod m)/m as an explicit resource coordinate of
          the schedule, so that the optimum over S includes the choice of
          m within its window.
        predicted_gain: Either a proof that the constant is phase-free or a strictly better optimal constant than any phase-blind figure.
    quantifier_order: >-
      THEOREM A: FOR ALL odd primes l != 3, FOR ALL schedules in S, FOR ALL
      n, the solved set C_n is the stated union and mean(l, S) is the stated
      integer ratio. Unconditional. THEOREM B: FOR ALL (mu, phi) on the
      grid THERE EXISTS an explicit piecewise polynomial rho such that FOR
      ALL l with (mu, phi) within 1/sqrt l of the grid point,
      |mean(l, S) - c(mu, phi) sqrt l| = O(1). The optimal constant is
      min over S; 'optimal' is over the DECLARED finite grid only.
      EXPLICITLY NOT CLAIMED: anything about the negation map, about
      non-generic groups, or about which reading holds before Stage 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        'For the declared family S the average-case cost is c(mu, phi)
        sqrt l + O(1) with c an explicit rational number per grid point,
        verified against exhaustive all-target means at every ladder l, and
        the optimum over S is [value] at [schedule].' It cannot certify
        optimality outside S, cannot certify the negation-map constant, and
        says nothing about elliptic curves beyond generic-group equality.
      nearby_object_control: >-
        (i) Composite l (e.g. 2 times a prime): b-h collisions with s = 2
        give two candidate x, Theorem A's set is no longer the solved set
        and the two instruments MUST disagree there. (ii) A truly random
        three-sequence walk on Z/l: the solved set is target-dependent and
        rho = 1 - exp(-tau_total^2 / 2) is NOT piecewise polynomial; the
        counter has nothing to count and the record must say so rather
        than fit. (iii) s = 1: the g-h type is empty and the constant must
        drop to the two-type value. A method that reports the same numbers
        on (i) or (ii) has not identified the structure.
    proof_obligations:
      - claim: Every collision type is linear in x with a unit coefficient and there are no self-collisions in range.
        responsibility: correctness
      - claim: The solved-set union is exactly C_n and the mean is the tail sum of complements (interface with the per-target instrument).
        responsibility: interface
      - claim: Each solved set is a union of intervals on the stated lattice with the stated lengths and positions.
        responsibility: size
      - claim: The continuum density is piecewise polynomial and the finite-l residual is O(1).
        responsibility: strictness
      - claim: The one-giant slices reproduce 4/3 and 1.5; the tau_total = 1.5 slices reproduce 0.5625 and 23/32.
        responsibility: baseline
      - claim: Nothing is claimed beyond S, l prime, cost unit additions, no negation map.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The solved set C_n (a subset of Z/l) and its continuum density rho;
      the state it projects from is the full triple of computed lists.
    established_families_off_limits: >-
      Off-limits as the primary lens: first-collision-time / birthday
      analysis of random sequences (the rho-style heuristic that gives
      0.886 and the 0.6753 row); Monte Carlo fitting of the constant from
      sampled targets (forbidden by the RQ); step-cost accounting of
      elliptic arithmetic (irrelevant, the constant is generic).
    lossiness: >-
      GENUINELY LOSSY: (lists, x) -> C_n forgets which pair collided, the
      order of the lists and the target entirely; the fibre over C_n is
      every target in Z/l. Under the operation set 'append the next
      element of each sequence' the object propagates deterministically
      (C_{n+1} = C_n union a set determined by n and S alone). It is not a
      change of coordinates: |C_n| is one integer where the state is
      3 n residues.
    propagation: >-
      Exact under the append step; the object is a partial-action object
      for the operation set {append b, append g, append h}, consistent
      with IDEA-20260806-c5d183 (translation by an arbitrary element does
      not preserve it).
    survival_score: >-
      Survives the whole computation by construction on prime-order groups;
      dies on composite order (unit coefficients fail) and under a random
      walk (target dependence returns).

  null_object_control: >-
    NULL-A, BLOCKING: the truly random three-sequence walk on Z/l of the
    same lengths, all-target exhaustive first-collision mean by simulation;
    the covered-set counter is NOT applicable and the record must report
    rho = 1 - exp(-tau_total^2/2) (with the 0.6753 anchor) as a target-
    DEPENDENT object -- if the counter is (wrongly) applied and matches, the
    instrument is measuring nothing. NULL-B, BLOCKING: composite l where
    the two instruments must disagree. POSITIVE CONTROL, BLOCKING: the
    one-giant slice (4/3 within O(1)/sqrt l) and the tau_total = 1.5 slices
    (0.5625 and 23/32 within 1/sqrt l). DECAY PARAMETER: the residual
    r(l) = mean(l, S) - c(mu, phi) sqrt l across the ladder at fixed grid
    point must stay bounded (predicted O(1)); a residual growing like
    sqrt l is the artifact tell of docs/inventor-protocol.md section 3 and
    means rho was mis-derived, not that the framework is wrong (the
    integer-instrument agreement isolates the two). ORDERING: the closed
    form c(mu, phi) per grid point is written and hashed before the
    exhaustive column is read.

  discriminated_from:
    - >-
      KN-LIT-7291 -- NEAREST RECORD. Holds the three fixed-budget success
      probabilities as reported. EXACT DELTA: this record supplies the
      object (C_n), the exact finite-l integer formula, the continuum
      integral for the AVERAGE case (which KN-LIT-7291 does not mention),
      and the phase parameter; it reproduces two of the three probabilities
      in-record and pins the third as the schedule criterion.
    - >-
      IDEA-20260901-753636. Uses Bernstein-Lange only as a rho
      anti-collision pointer and tracks a partition-transition matrix of an
      r-adding walk on a curve. Delta: different algorithm (deterministic
      giants, no hash), different object (solved set, not transition
      counts), different group (Z/l, curve as consistency arm only).
    - >-
      IDEA-20260906-86cd30. Same STYLE (exact combinatorial law replacing a
      reported heuristic, checked by exhaustive enumeration), different
      question, object and algorithm; cited here only as the schema
      exemplar.
    - >-
      Galbraith-Wang-Zhang 2017 (retrieved landing page). They list the
      constant as 1.25 conjectural. Delta claimed: an exact finite-l
      formula, an O(1) residual, and the phase discrimination -- but their
      derivation was not read and may already contain some of this;
      novelty stays unverified.

  predictions:
    - metric: M1 -- integer agreement of the two instruments (per-target simulation vs covered-set counter) at every n and every ladder l
      direction: different
      minimum_effect: FORCED exact equality on prime l; any disagreement voids the record until localised; forced DISAGREEMENT on composite l (NULL-B).
    - metric: M2 -- baseline slices; normalised means for rate vector (1,1,0) and classical BSGS, and |C_n|/l at n = 1.5 sqrt l
      direction: different
      minimum_effect: 4/3 and 1.5 within 2/sqrt l; 0.5625 within 1/sqrt l; and existence of a schedule point in S giving 23/32 within 1/sqrt l at three primes (the BL pin). Failure of the pin means S does not contain the BL instance and the record is re-scoped to S as declared.
    - metric: M3 -- residual r(l) = mean(l, S) - c(mu, phi) sqrt l across the ladder at fixed grid point
      direction: different
      minimum_effect: PREDICTED bounded, |r(l)| below 8 additions at every rung from 2^10 upward with no monotone growth; a residual exceeding 0.05 sqrt l at the top two rungs refutes Theorem B for that grid point.
    - metric: M4 -- phase dependence; at fixed l, the exact mean over m sweeping the window round(mu sqrt l) +- sqrt l / 4, plotted against phi = (l mod m)/m
      direction: different
      minimum_effect: READING 1 if the spread of mean/sqrt l across phi is below 0.02 for the optimal mu; READING 2 if the spread exceeds 0.05 and is reproduced (same shape in phi) at two further ladder primes. In between, INCONCLUSIVE at this ladder.
    - metric: M5 -- optimum over S of c(mu, phi) compared with the retrieved conjectural 1.25
      direction: different
      minimum_effect: Reported as a number with its schedule; below 1.25 - 0.02 is a headline requiring the phase mechanism to be shown explicitly; equality within 0.01 corroborates the conjectural figure; above 1.25 + 0.02 means S is missing the BL optimisation and is reported as such.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write Theorem A with all three
      collision types and the self-collision exclusion; write rho for the
      one-giant slices and check 4/3 and 1.5 symbolically; write the
      candidate piecewise polynomial for the recalled schedule and its
      phase table. STAGE 1 (minutes): implement the covered-set counter
      (bitmap, O(l)) and the exhaustive per-target simulator (O(l^{1.5}))
      on Z/l; run both at three primes near 2^10, 2^12, 2^14 for the grid
      of S; M1 and M2 decided here. This is the CHEAPEST VALID
      DISCRIMINATOR: if M1 fails nothing else is worth running, and if the
      BL pin fails the family is re-declared. STAGE 2 (hours): the ladder
      2^10 .. 2^22 with the counter, per-target simulation mandatory at
      every rung up to the affordable limit (the counter column at higher
      rungs is labelled 'exact via Theorem A, cross-validated on rungs
      <= L*'); M3, M4, M5. STAGE 3 (minutes): elliptic consistency arm at
      one prime near 2^14 on a self-generated prime-order curve; counts
      must equal the Z/l counts to the integer.
    controls:
      - NULL-A truly random three-sequence walk (blocking; target-dependent, counter not applicable, 0.6753 anchor at tau_total = 1.5)
      - NULL-B composite l where the instruments must disagree (blocking)
      - Positive control one-giant and classical BSGS slices at 4/3 and 1.5 (blocking)
      - BL pin 23/32 at tau_total = 1.5 (blocking for any statement about the Bernstein-Lange instance; not blocking for statements about S)
      - Elliptic arm equal to Z/l counts to the integer (instrument check, never a finding)
      - Closed-form table per grid point hashed before the exhaustive column is read
    required_metrics:
      - per (l, schedule, n) the integer |C_n| from both instruments and their equality flag
      - per (l, schedule) the exact mean as an integer ratio, mean/sqrt l, the closed-form c(mu, phi), and the residual r(l)
      - per l the phase sweep table mean(l, m)/sqrt l versus phi
      - the optimum over S with its schedule, mu, phi, and the comparison rows BSGS (4/3, 1.5) and random walk on the same instrument
      - storage charged (table sizes) and lookup counts, reported separately from additions
      - wall clock per stage; sha256 of every table

  falsification_conditions:
    - F1. Stage 0 finds a collision type missing from Theorem A or a self-collision within range; the theorem is amended before any run and the record superseded if the solved set is not target-independent.
    - F2. M1 fails on a prime l. Either instrument is wrong; localised by the offending (n, x); no number is read until resolved.
    - F3. Baseline slices miss 4/3 or 1.5 beyond 2/sqrt l at three primes. The framework's counting is wrong; record superseded.
    - F4. M3 residual grows with l at a grid point while M1 holds. Theorem B's piecewise polynomial is mis-derived for that point; Theorem A stands; the exact column remains a certified numerical result (branch b of the RQ).
    - F5. The BL pin is not achieved by any point of S. The record makes no statement about the Bernstein-Lange instance, only about S; noted, not fatal.
    - F6. Budget exhaustion or crash. Infrastructure outcome under AGENTS.md rule 3, never evidence.

  confounders:
