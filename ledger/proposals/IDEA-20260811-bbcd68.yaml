idea:
  id: IDEA-20260811-bbcd68
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE TWIST-PAIR IDENTITY - a ZERO-NOISE instrument test the campaign already
    has the data for. Quadratic twisting is an involution carrying the isogeny
    class of trace t bijectively onto the class of trace -t while PRESERVING j,
    so the j-multisets of the two classes are EXACTLY equal and every
    j-measurable functional has EXACTLY equal distributions on them; therefore
    any measured t versus -t difference in a j-measurable quantity is 100%
    artifact with no statistics required, and any experiment whose dependent
    variable is j-measurable has IDENTICALLY ZERO power against the t / -t
    contrast - which classifies, in advance, which of this campaign's functionals
    can and cannot answer its gating question
  class: control

  object: >-
    OBJ-TWIST, the quadratic-twist involution on the set of F_p-isomorphism
    classes of elliptic curves, together with the induced partition of measured
    functionals into J-MEASURABLE (constant on twist pairs) and NOT. The tracked
    object is the FUNCTIONAL ITSELF and its behaviour under one exactly known
    symmetry - this is a lens on the campaign's instruments rather than on its
    curves, which is why it costs nothing and why nothing else in the batch
    substitutes for it.

  resource: >-
    None consumed as an attack resource; this is an L14-class instrumentation
    record in the sense of DECOMPOSITION.md, whose purpose is to make other
    lanes' negatives citable. H-ENDO-001 admissibility is trivially satisfied:
    no endomorphism, no point of G, no oracle.

  claim: >-
    (A) THE INVOLUTION AND THE EXACT IDENTITY. Let d be a non-square in F_p and
    E : y^2 = x^3 + a x + b. Its quadratic twist is
    E^d : y^2 = x^3 + d^2 a x + d^3 b, with j(E^d) = j(E) and
    trace(E^d) = -trace(E). Twisting is an involution on F_p-isomorphism classes,
    so it is a BIJECTION from the isogeny class of trace t onto the isogeny class
    of trace -t (Tate: same trace iff isogenous), and it preserves j. THEREFORE
    THE MULTISET OF j-INVARIANTS OF CLASS(t) EQUALS THE MULTISET OF j-INVARIANTS
    OF CLASS(-t), EXACTLY, WITH NO ERROR TERM. [Derived in this record;
    elementary; directly checkable against the campaign's committed 253-trace
    enumeration at p = 4001, which was independently re-verified with zero
    disagreements (EV-ICINV-6b6264).]
    (B) THE IMMEDIATE COROLLARY, WHICH IS THE INSTRUMENT. Call a functional F
    J-MEASURABLE if F(E) depends only on j(E). Then for J-measurable F the
    empirical DISTRIBUTION of F over class(t) is IDENTICAL to its distribution
    over class(-t) - not statistically similar, identical as multisets. So:
      (i) Any observed t versus -t difference in a J-measurable functional is an
          artifact, full stop, with no p-value, no null draw and no permutation
          test. This is the cheapest artifact detector available to this
          campaign and it requires no new measurement.
      (ii) Any experiment whose dependent variable is J-measurable has EXACTLY
          ZERO power to distinguish class(t) from class(-t). Designing such an
          experiment and reporting a null from it would be reporting a
          mathematical identity as an empirical finding.
    (C) THE CLASSIFICATION, WHICH IS THE DELIVERABLE. Every functional this
    campaign measures is to be classified, with a derivation per row, as
    J-measurable or not. Pre-registered classification, to be verified:
      J-MEASURABLE (by the weighted-orbit argument, since twisting is the
        u^2 = d case of (a,b) -> (u^4 a, u^6 b) and the committed C-GAUGE
        identity shows support is constant on the FULL orbit including both
        twists, EV-ICINV-6b6264): monomial support of S_m; the Newton polytope
        and any mixed volume; the factorisation type of S_m over the algebraic
        closure; dim and deg of Sing(V(S_m)); the number of roots of x^3+ax+b in
        F_p (because the twist's cubic has roots d*x_i, so the ROOT COUNT is
        preserved).
      NOT J-MEASURABLE: #E(F_p) and everything derived from it - the trace, N,
        the cofactor, the group structure, the embedding degree, D, D_0, the
        conductor, the volcano level, |Aut| when it is read off the class,
        decomposition rate, liftable density, and every quantity computed from
        sampled points.
      THE ONE ROW THAT MATTERS MOST: the ROOT COUNT r of the curve cubic is
        J-measurable AND varies within an isogeny class - which is consistent,
        because j varies within a class - and it is the candidate cause of
        within-class variance identified in IDEA-20260807-0a3272. This record's
        classification says that r cannot separate class(t) from class(-t) even
        though it can vary inside each; that is a sharp and non-obvious
        constraint on how any r-based finding may be reported.
    (D) WHAT THIS FORBIDS, AND IT IS BINDING ON THIS BATCH. Every symbolic
    proposal in this batch - IDEA-20260811-a7c1df, -97e244, -6034d0, -34f29d - is
    measuring a J-measurable functional. THEY THEREFORE CANNOT, EVEN IN
    PRINCIPLE, ANSWER RQ-ICINV-475b5e'S CLASS-INVARIANCE QUESTION IN THE t / -t
    DIRECTION, and each of them says so in its own observation-collision field.
    This record makes that constraint explicit, uniform and citable instead of
    leaving it to be rediscovered per proposal.

  mechanism: >-
    A symmetry of the object that is exactly known and exactly measure-preserving
    turns a statistical comparison into an identity. The campaign's instruments
    have repeatedly been characterised after the fact - NULL-C turned out to be a
    between-class mean detector with power 1.00 at a 0.9% shift and no within-class
    content; the "volcano level" computed as a 2-torsion count resolved 2 of 5
    levels; the hash-and-lift target sampler encoded the class label into the
    target multiset (CORR-20260807-a05e1e). Each of those cost a batch to
    discover. The twist involution is a way to detect an entire family of such
    defects for free, because it predicts an exact equality that a defective
    instrument will violate.

  novelty_status: adaptation
  novelty_note: >-
    The quadratic twist and its trace negation are elementary and classical. The
    committed C-GAUGE observation already notes in passing that "the same scaling
    shows support is constant on the full orbit including both quadratic twists"
    (EV-ICINV-6b6264). THE ADAPTATION is turning that remark into (i) an exact
    multiset identity between paired isogeny classes, (ii) a zero-noise artifact
    detector, and (iii) a binding classification of the campaign's functional
    inventory. Corpus grep finds the twist remark only as a limitation clause in
    one evidence record and finds no classification anywhere. External literature
    NOT checked; the mathematics is textbook and the contribution is
    organisational.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-a3d644, which builds matched nulls across D_0 through the
    cofactor - a construction problem; this record derives a symmetry and a
    prohibition. NOT IDEA-20260808-45af43, which closes the SEXTIC twist family
    at j = 0 using Tate's theorem to show the six twists are non-isogenous; that
    record is about j = 0 and about transport of a DLP instance, this one is
    about arbitrary j and about the measurability class of functionals, and
    neither implies the other. NOT the L14 instrument lane's NULL-B / NULL-C,
    which are sampling nulls with statistical power; this test has infinite power
    by construction because it predicts an exact equality.

  assumptions:
  - >-
    p > 3, and d a fixed non-square in F_p. For j = 0 and j = 1728 the twist
    group is larger (sextic and quartic twists respectively) and the simple
    quadratic involution is a subgroup of the full twist action; those two j must
    be handled separately and the record must not apply the two-element argument
    there.
  - >-
    The committed 253-trace enumeration at p = 4001 is correct. It was
    independently re-enumerated with set equality of j-invariants and zero
    disagreements (EV-ICINV-6b6264), so it is the strongest fixture the campaign
    owns.
  - >-
    Classes with t = 0 are self-paired and are excluded from the pairwise test;
    they are supersingular at p > 3 and outside this campaign's ordinary scope
    anyway.

  proof_search_map:
    bottleneck: >-
      The bottleneck is that the campaign cannot currently tell, before running
      an experiment, whether its dependent variable is capable of answering its
      independent variable. Every discovered instrument defect so far was found
      after the data.
    baseline_embedding:
      parameter_slice: >-
        The exact slice is the committed p = 4001 enumeration. The pairs
        (t, -t) for t in {30, 36, 12} are already enumerated or enumerable, and
        the identity must hold on all of them.
      reproduction_check: >-
        Re-enumerate class(30) and class(-30) at p = 4001 and check SET EQUALITY
        of the 138 j-invariants. The campaign has already re-enumerated
        class(30) independently; class(-30) is one line more. This is a frozen
        fixture and the strongest available.
    observation_collision:
      observable: Any J-measurable functional.
      distinct_preimage_search: >-
        THE COLLISION IS THE THEOREM. E and E^d are distinct ground-truth objects
        - different group orders, different classes, different ECDLP instances -
        with identical values of every J-measurable observable. They sit on
        opposite sides of any class-level conclusion. The additional condition
        that separates them is exactly a non-J-measurable functional, i.e. one
        that reads the group, and the record's classification lists which those
        are.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Track the measurability class of a functional alongside its value, as a
        required metadata field on every measurement the campaign records.
      predicted_gain: >-
        Prevents an entire family of design errors before compute, at zero
        marginal cost per experiment. This is the transform with the best
        cost-to-benefit ratio in the whole batch and it is organisational rather
        than mathematical.
    quantifier_order: >-
      FOR ALL admissible p, FOR ALL non-zero traces t, and FOR ALL J-measurable
      functionals F, the multiset {F(E) : E in class(t)} equals
      {F(E) : E in class(-t)}. There is no existential and no witness the
      experimenter may choose; that total absence of freedom is what makes a
      violation necessarily an implementation defect rather than a finding.
    method_ceiling:
      strongest_certifiable_claim: >-
        That a given functional is or is not J-measurable, by derivation, and
        that a given measurement pipeline respects or violates the resulting
        identity. It CANNOT certify that a non-J-measurable functional carries
        useful class information - only that it is not excluded by this argument.
      nearby_object_control: >-
        The nearby object where the conclusion fails is j = 0 and j = 1728, whose
        twist groups are larger; the method applied there must produce the
        SEXTIC and QUARTIC statements, not the quadratic one, and a pipeline that
        applies the two-element argument at j = 0 is wrong. That is the control
        that shows the method is tracking the twist group rather than a slogan.
    proof_obligations:
    - claim: Twisting is a bijection class(t) -> class(-t) preserving j
      responsibility: correctness
    - claim: Support, polytope, factorisation type, Sing and root count are J-measurable
      responsibility: correctness
    - claim: The campaign's sampled functionals are not J-measurable
      responsibility: correctness
    - claim: The committed enumeration satisfies the identity
      responsibility: baseline

  predictions:
  - metric: j_multiset_equality_class_t_versus_class_minus_t
    direction: different
    minimum_effect: >-
      EXACT SET EQUALITY at p = 4001 for t = 30, and for at least four further
      trace pairs. Zero tolerance: one differing j-invariant refutes (A) or the
      enumeration.
  - metric: class_size_equality
    direction: different
    minimum_effect: >-
      |class(t)| = |class(-t)| exactly, for every non-zero admissible t at
      p = 4001. This is implied by (A) and is also implied by the
      Hurwitz-Kronecker mass H(4p - t^2), which depends on t^2; agreement of the
      two routes is a free cross-check of both.
  - metric: support_multiset_equality_across_the_twist_pair
    direction: different
    minimum_effect: >-
      The S_3 and S_4 support multisets over class(30) and class(-30) are
      identical - in particular class(-30) must ALSO contain exactly one member
      with S_4 support 391, at the same j = 2257. That is a sharp, committed-data-
      backed prediction and a genuine test of the whole framework.
  - metric: root_count_r_multiset_equality
    direction: different
    minimum_effect: >-
      The multiset of r = #{x in F_p : x^3 + a x + b = 0} over class(t) equals
      that over class(-t), exactly. This is the least obvious row of the
      classification and the one most worth testing, because
      IDEA-20260807-0a3272 proposes r as the candidate cause of within-class
      variance and the prediction constrains how any r-based result may be read.
  - metric: sextic_twist_handling_at_j0
    direction: different
    minimum_effect: >-
      At j = 0 the pipeline must report SIX twist classes and six traces
      (the classical {+-a, +-(a+3b)/2, +-(a-3b)/2} for 4p = a^2 + 3b^2), not two.
      A pipeline reporting two at j = 0 is applying the wrong twist group.

  minimal_test:
    design: >-
      A DERIVATION PLUS A TABLE JOIN. NO SAMPLING, NO TIMING, NO NEW MEASUREMENT
      OF ANY CURVE PROPERTY. (1) Write the derivation of (A) formally and check it
      symbolically: verify j(E^d) = j(E) and trace(E^d) = -trace(E) on 1000
      random curves at p = 4001 by direct point counting. (2) Enumerate class(t)
      and class(-t) for at least five trace pairs at p = 4001 including t = 30,
      and check exact j-multiset equality. (3) Compute S_3 and S_4 support, the
      root count r, and (if IDEA-20260811-34f29d has run) dim and deg of Sing
      over both classes of at least one pair, and check exact multiset equality.
      (4) Produce the classification table of every functional named in
      DECOMPOSITION.md L1-L14 and in the campaign's harness, with a one-line
      derivation per row and an explicit J-measurable / not verdict. (5) Handle
      j = 0 and j = 1728 separately with their full twist groups.
    controls:
    - >-
      C-NEGATIVE-CONTROL (essential). Apply the identity test to a functional
      that is NOT J-measurable - the group order #E, or the decomposition rate -
      and confirm it FAILS: #E differs between the pair by 2t, which is non-zero.
      A test that reports equality for #E is not testing anything.
    - >-
      C-J0. The sextic-twist arm at j = 0, which must produce six classes.
    - >-
      C-SELFPAIR. Traces with t = 0 are self-paired; excluded and reported as
      excluded rather than silently dropped.
    - >-
      C-INDEPENDENT-ENUMERATION. class(-30) is enumerated by code that does not
      simply negate the recorded class(30) output, or the test is circular. This
      is the single most important implementation control in the record.
    required_metrics:
    - j_multiset_per_class_for_each_tested_trace_pair
    - class_size_per_trace_and_hurwitz_mass_cross_check
    - support_multiset_per_class_for_at_least_one_pair
    - root_count_multiset_per_class
    - group_order_difference_negative_control
    - functional_classification_table_with_derivations
    - j0_twist_class_count

  lossy_projection_answer: >-
    The projection is curve -> j, and this record's contribution is to state
    EXACTLY what that projection discards: it discards the twist, hence the sign
    of the trace, hence the group order, hence the isogeny class. What it retains
    propagates deterministically under isomorphism and under the whole weighted
    gauge orbit, which is why J-measurable functionals are well defined at all.
    THE CAMPAIGN'S CENTRAL FAILURE MODE IS EXACTLY A FAILURE TO NOTICE THIS
    DISCARD: the S_4 outlier was read as a within-class anomaly until an
    independent session showed it was a j-invariant degeneration with no class
    content (DEC-20260810-d70ece), and that adjudication is precisely an
    application of this record's argument, performed once, after the fact, for
    one functional. This record generalises it and applies it in advance.

  t5_reachability_answer: >-
    NOT ENGAGED - no cost minimiser is proposed and no walk is performed. The
    record does, however, sharpen T5 for others: since J-measurable functionals
    are constant on twist pairs, a "good vertex" identified by a J-measurable
    functional automatically has a twin in the mirror class, which doubles the
    target set and changes nothing about the density, because the mirror class is
    a different instance. Stated so nobody counts it as a factor of two.

  null_object: >-
    C-NEGATIVE-CONTROL is the null of the right shape and it is unusual and
    valuable: rather than a random object, it is a functional KNOWN to violate
    the identity (#E), so it proves the test can fail. Without it a universal
    "all equal" report would be indistinguishable from a pipeline that always
    reports equality.

  falsification_conditions:
  - >-
    The j-multisets of class(t) and class(-t) differ for any tested pair. Either
    the derivation (A) is wrong or the enumeration is; both are checked and the
    record is superseded.
  - >-
    class(-30) does NOT contain a member with S_4 support 391 at j = 2257. The
    framework's sharpest committed-data prediction fails and the classification
    of support as J-measurable is wrong.
  - >-
    The root-count multisets differ across a twist pair. r is not J-measurable,
    the classification row is wrong, and IDEA-20260807-0a3272's reading must be
    revised.
  - >-
    C-NEGATIVE-CONTROL reports equality for #E. The test is vacuous and every
    equality it reports is void.
  - >-
    C-INDEPENDENT-ENUMERATION is not achieved - class(-t) is derived from
    class(t) by negation. The test is circular and establishes nothing.

  confounders:
  - >-
    Circularity, which is the dominant risk. If the enumerator constructs the
    twist class by twisting the original class, the identity is true by
    construction and the test measures the code rather than the mathematics. The
    independent-enumeration control is blocking for exactly this reason.
  - >-
    j = 0 and j = 1728, where the twist group is sextic and quartic; applying the
    quadratic argument there is a category error and the contract separates them.
  - >-
    Supersingular curves, where the trace is 0 mod p and the class structure
    differs; excluded from scope and reported as excluded.
  - >-
    Functionals that depend on a CHOICE (a monomial order, a seed, a factor-base
    window) are J-measurable only if the choice is made canonically from j; if
    the choice depends on (a,b) the functional is not well defined on the j-line
    at all. The classification must state, per row, whether the functional is
    canonical.

  interpretation_limits:
  - >-
    The record establishes a PROHIBITION and a classification, not a finding
    about curves. It says which experiments cannot work; it says nothing about
    whether the permitted ones will.
  - >-
    It does not imply that J-measurable functionals are useless - they can vary
    within a class, since j does. It implies only that they are blind to the
    t / -t contrast.
  - >-
    claim_tier toy, though in truth limb (A) is a derivation and carries no
    experimental tier at all.

  heuristic_assumptions:
  - id: H1
    statement: >-
      NO HEURISTIC IS LOAD-BEARING. Limb (A) is an elementary theorem; the
      classification in (C) is a set of derivations, one per functional; the
      tests are exact multiset comparisons with zero tolerance.
    rigorous_support: >-
      Tate's isogeny theorem (same trace iff F_p-isogenous), the standard
      quadratic-twist formulas, and the committed C-GAUGE identity verified on
      138 members.
    validation_plan: >-
      Direct exact verification as described, with the independent-enumeration
      and negative controls. No sampling distribution applies. The tail check is
      the j = 0 sextic arm, which is where a slogan-level implementation of the
      argument would break first.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted variant (KN-TECH-018).
    hidden_overhead: Not applicable.
    tradeoff_note: Not applicable.

  dominated_by: >-
    n/a as an attack - no attack result is claimed, and every row of the attack
    frontier trivially dominates a record that produces no solver. As an
    instrument it is dominated by nothing in the corpus because the corpus
    contains no comparable pre-compute measurability check.
  sota_delta: >-
    ZERO on every attack axis. The contribution is a prohibition plus a
    classification table.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  expected_value: >-
    HIGH, AND THE BEST COST-TO-BENEFIT RATIO IN THE BATCH AFTER
    IDEA-20260811-df6c0f. It is nearly free, it reuses an already-certified
    enumeration, it makes an exact prediction against committed data (class(-30)
    must contain a support-391 member at j = 2257), and it prevents a class of
    design errors that has already cost this campaign at least three
    after-the-fact instrument characterisations. ITS HONEST LIMIT: it produces no
    new mathematics and its content is organisational, so a reviewer looking for
    a discovery will be disappointed. I would run it FIRST among the instrument
    records and treat it as a prerequisite for any further class-versus-j
    experiment in this campaign.
