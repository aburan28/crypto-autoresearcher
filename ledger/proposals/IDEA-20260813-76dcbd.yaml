idea:
  id: IDEA-20260813-76dcbd
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  title: >-
    Anytime-valid signature monitor: a preregistered e-process for adaptive
    streams with optional-stopping-safe false-positive control
  class: measurement
  claim: >-
    For any bounded public score sequence X_t whose exact-null conditional
    moment-generating-function bound is certified before treatment, the process
    E_t = product_{i<=t} exp(lambda_i X_i) / M_i(lambda_i), with predictable
    lambda_i fixed by a preregistered rule, is a nonnegative supermartingale
    under the exact sampler.  Therefore the probability that E_t ever crosses
    1/alpha is at most alpha, even when the signer is stopped adaptively and
    public messages or contexts are selected from prior public observations.
    A planted exponentially tilted sampler supplies a known positive growth
    rate and a detection-delay curve.  The proposal would replace fixed-horizon
    p-values with an anytime-valid instrument; it does not assert an FN-DSA
    deviation, a shorter attack, or validity before the public score and exact
    null are derived from filed primary sources.
  mechanism: >-
    Fix a filtration containing public messages, keys, signatures and previous
    betting choices.  Under the exact null require
    E[exp(lambda_t X_t) | F_{t-1}] <= M_t(lambda_t), where lambda_t is
    F_{t-1}-measurable and chosen by a frozen bounded rule.  Multiplying the
    normalized factors yields a test supermartingale.  Ville's inequality then
    controls the chance of any threshold crossing over all times, so checking
    after every signature or stopping on an apparent signal does not inflate
    alpha.  Candidate scores may come from a finite public projection audit,
    but the score family, clipping, context bins and betting rule are frozen
    using null and planted-control data only.  A mixture over a finite effect
    grid permits sensitivity to unknown sign and magnitude with its mixture
    weight charged.  Expected log growth under a planted alternative determines
    detection delay; this is a data-axis instrument, not a cryptanalytic work factor.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-010 and IDEA-20260805-4a6dc7 use fixed-sample GOF tests with a
    specified N.  IDEA-20260808-e7ba81 proposes a fixed-sample BBP spectral
    threshold.  This proposal's defining property is uniform type-I control
    over every stopping time and predictable adaptive context, with a
    preregistered e-value rather than a p-value or eigenvalue edge.  It does not
    duplicate the exact-normalizer, width-homotopy, exact-null, key-shape,
    pathwise-coupling or projection-nullspace mechanisms.
  predictions:
    - observable: maximum exact-null e-value over all prefixes
      metric: anytime_false_positive_rate
      predicted: >-
        At most alpha across independent null streams under the frozen stopping
        rule, with a simultaneous confidence interval containing the nominal bound.
    - observable: planted exponential-tilt stream
      metric: median_detection_delay
      predicted: >-
        Median delay decreases approximately as
        log(1/alpha)/D_alt for the frozen tilt ladder, where D_alt is the exact
        per-sample expected log e-increment computed before sampling.
    - observable: stopped versus fixed-horizon null analysis
      metric: optional_stopping_invariance
      predicted: >-
        E-process false-positive rate remains at most alpha under continuous
        monitoring, while an intentionally naive repeatedly recomputed
        fixed-horizon p-value exceeds alpha and serves only as an artifact control.
    - observable: sign-mixture alternative
      metric: two_sided_growth
      predicted: >-
        The symmetric mixture detects positive and negative planted tilts with
        equal delay distribution up to Monte Carlo tolerance.
  minimal_test:
    design: >-
      On an exactly enumerable toy public score from a filed sampler/encoder
      slice, compute the null conditional MGF exactly for every frozen context.
      Freeze alpha, score clipping, context bins, effect grid, mixture weights,
      betting rule, maximum horizon, stream count and seed derivation.  Run the
      exact null under continuous monitoring first, then a symmetric ladder of
      planted exponential tilts with exact normalizers, then adaptive public
      context schedules chosen from prior public results.  Only after these
      gates may a later approved task feed a named candidate sampler to the
      instrument, and any non-crossing must be reported with its detectable
      effect/delay boundary.
    test_boundary:
      instances: toy exact public-score laws with finite context set
      parameters: frozen alpha, horizon, score bound, effect grid and planted tilt ladder
      oracle_model: local signature or sampler stream; no deployed or private target
      preprocessing: exact context-wise MGF tables and mixture calibration, charged
      stopping_rule: >-
        Stop and invalidate the detector if the null MGF inequality fails,
        exact-null false-positive control fails, or the smallest declared
        planted effect misses its power gate.
    required_metrics:
      - exact MGF bound for every score, context and effect-grid value
      - maximum e-value and crossing time per stream
      - anytime false-positive rate under fixed and adaptive context schedules
      - planted effect, exact expected log growth and empirical detection-delay distribution
      - non-crossing sensitivity bound at the maximum horizon
      - data, time, memory, preprocessing and discarded/invalid-stream accounting
  controls:
    - name: exact sampler e-process null
      kind: exact_null
      construction: >-
        Independent streams from the exactly enumerated public-score law,
        monitored at every prefix with the same context and betting machinery.
      forced_value: crossing probability no greater than alpha over the entire horizon
      gate: >-
        A simultaneous interval excluding the nominal bound invalidates all
        treatment monitoring; null streams are never silently retrained.
    - name: exponentially tilted exact law
      kind: biased_positive
      construction: >-
        Reweight the exact finite null by exp(delta X) and normalize exactly for
        a frozen symmetric ladder of nonzero rational or high-precision delta.
      forced_value: >-
        Exact expected log e-increment and approximate detection delay
        log(1/alpha)/D_alt are computed before streams are drawn.
      gate: >-
        The smallest declared tilt must cross with preregistered power by the
        maximum horizon before candidate non-crossing can bound an effect.
    - name: naive repeated-p-value artifact
      kind: structural_control
      construction: >-
        Apply a fixed-horizon test at every prefix without multiplicity
        correction to the identical exact-null streams.
      forced_value: false-positive inflation relative to one fixed look
      gate: >-
        Used only to demonstrate the optional-stopping artifact; never as
        evidence for or against a sampler.
  confounders:
    - >-
      The supermartingale guarantee fails if the conditional MGF ignores
      message/context adaptivity, reused randomness, key changes or dependence across signatures.
    - >-
      Choosing the score, clipping threshold, effect grid or betting rule after
      treatment inspection spends type-I error and voids anytime validity.
    - >-
      An exact toy null need not equal the public score law of the standardized
      sampler; primary sources and a validated exact sampler are prerequisites.
    - >-
      Mixture weights and multiple score families reduce growth and must be
      charged rather than selecting the best stream retrospectively.
    - >-
      A detector can distinguish without identifying the trapdoor or enabling recovery.
  falsification_conditions:
    - Any exact context-wise MGF inequality is violated by enumeration.
    - Exact-null anytime crossings exceed alpha beyond the preregistered simultaneous interval.
    - >-
      The planted smallest tilt fails its power/delay gate even though its exact
      expected log growth is positive.
    - >-
      Two-sided mixture delays differ beyond tolerance on symmetric planted laws,
      revealing an implementation or normalization asymmetry.
    - >-
      Adaptive public context selection changes the null law outside the
      certified context family; the guarantee is then out of scope, not negative evidence.
  interpretation_limits:
    - No signature stream or FN-DSA implementation was tested here.
    - >-
      A threshold crossing is a calibrated distributional alarm for one public
      score, not a trapdoor recovery, forgery or standardized break.
    - >-
      A non-crossing bounds only alternatives represented by the frozen score,
      effect grid, contexts and horizon; invisible defects remain open.
    - >-
      Anytime validity protects false-positive rate, not transfer from toy to
      standardized dimensions or from an exact reference to deployed code.
    - No timing, fault, private data or deployed-target interaction is proposed.
  assumptions:
    - >-
      A bounded public score with an exact or rigorously upper-bounded
      conditional MGF can be derived after primary sampler and encoder sources are filed.
    - >-
      Fresh signature randomness makes the declared null supermartingale
      conditioning valid, or all remaining dependence is included in the context state.
    - >-
      The candidate stream and stopping rule can be logged without using timing or secret traces.
  heuristic_assumptions:
    - id: HEUR-76DCBD-1
      formal_statement: >-
        The finite symmetric exponential-tilt mixture achieves median detection
        delay within factor 2 of the best fixed tilt in the mixture for every
        planted effect on the frozen ladder.
      rigorous_support: >-
        Mixture e-process validity is rigorous, but its efficiency relative to
        an oracle tilt depends on mixture weights and finite-horizon overshoot.
      validation_plan: >-
        Compute oracle and mixture e-processes on identical planted streams and
        compare detection-delay distributions at every ladder rung.
      falsification_condition: median mixture delay exceeds twice oracle delay on any rung
    - id: HEUR-76DCBD-2
      formal_statement: >-
        The frozen public score captures enough of each planted defect that the
        exact expected log e-increment scales quadratically with small effect
        magnitude over the declared local ladder.
      rigorous_support: >-
        Local asymptotic expansion predicts quadratic divergence for regular
        exponential tilts; clipping and discrete support can alter the regime.
      validation_plan: >-
        Compute exact divergence on the finite law and fit the log-growth
        exponent before generating sampled streams.
      falsification_condition: fitted exponent differs from 2 by more than 0.2 on the local ladder
  proof_search_map:
    bottleneck: >-
      Maintaining calibrated false-positive control when signature collection,
      context choice and stopping time adapt to previous public observations.
    baseline_embedding:
      parameter_slice: one fixed terminal horizon with one frozen score and betting parameter
      reproduction_check: >-
        At the terminal horizon, the e-value Markov bound reproduces a level-alpha
        fixed-sample test; exact enumeration verifies null expectation at most one.
    observation_collision:
      observable: complete e-value path and threshold-crossing time
      distinct_preimage_search: >-
        Construct two alternative score laws with the same expected e-increment
        but different higher moments and overshoot distributions; this collision
        shows that expected growth alone does not identify finite-sample delay.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: log e-value as the sum of predictable normalized score increments
        predicted_gain: optional-stopping-safe accumulation of weak public evidence
      - transform: specialization_pack
        proposed_object: finite mixture over predeclared effect signs and magnitudes
        predicted_gain: one valid process covers multiple alternatives without post-hoc selection
    quantifier_order: >-
      For every stopping time adapted to the declared public filtration and for
      every exact-null law in the certified context family, the score family,
      mixture and betting rule are fixed first and crossing probability is at
      most alpha.  The stopping rule may depend on past observations; the score
      definition may not.
    method_ceiling:
      strongest_certifiable_claim: >-
        Anytime-valid detection or a scoped non-crossing sensitivity statement
        for a frozen public score and exact-null context family.
      nearby_object_control: >-
        An alternative lying in the score's orthogonal/nullspace can have
        nonzero internal total variation but identical score law; the detector
        must remain powerless and cannot certify global exactness.
    proof_obligations:
      - claim: every normalized factor has conditional null expectation at most one
        responsibility: correctness
      - claim: score, contexts, mixture and betting rule are fixed before treatment
        responsibility: interface
      - claim: Ville bound covers all declared stopping times and looks
        responsibility: success_probability
      - claim: invalid streams, key/context changes and dependence are included or excluded explicitly
        responsibility: scope
      - claim: mixture, MGF preprocessing and monitoring costs are charged
        responsibility: runtime
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed.  Monitoring K mixture components costs
      O(NK) arithmetic for N signatures, with expected planted detection delay
      reported in signatures as approximately log(1/alpha)/D_alt only after calibration.
    memory_exponent: O(K plus context-state size) streaming memory; no signature archive required
    best_known_baseline: >-
      Fixed-horizon GOF in IDEA-20260801-010 and IDEA-20260805-4a6dc7, plus the
      fixed-sample spectral threshold in IDEA-20260808-e7ba81.  None provides
      uniform optional-stopping control for adaptive streams.
    hidden_overhead_disclosure: >-
      Exact MGF tables, score clipping, context stratification, mixture weights,
      multiple score families, overshoot and maximum-horizon truncation are charged.
    time_memory_tradeoff: >-
      More mixture components improve effect-grid coverage but increase O(K)
      time and memory per signature; pruning components saves resources but
      changes sensitivity and must be frozen before treatment.
    data_queries: N local or later approved signature samples; no unbounded or deployed oracle in this proposal
    preprocessing: exact null MGF and planted-divergence calculation, included
    oracle_model: public signature stream only
    retry_success_accounting: >-
      Each signature is one sequential update.  There is no retry success
      probability; false-positive and delay distributions are preregistered,
      and optional stopping is part of the theorem rather than an uncharged retry.
  sota_delta: >-
    Quantitative instrument delta: type-I error remains at most alpha over all
    monitored prefixes instead of inflating with the number of looks, while
    planted detection delay is calibrated against exact expected log growth.
    Claimed FN-DSA attack-time, memory and security delta are zero.
  dominated_by: >-
    n/a (no attack result claimed).  Compared across time, memory, data,
    preprocessing and oracle access with IDEA-20260801-010,
    IDEA-20260805-2bbfb2, IDEA-20260805-4a6dc7,
    IDEA-20260805-637a3b, IDEA-20260808-cb0828,
    IDEA-20260808-e7ba81, H-FNDSA-58b464 and H-FNDSA-6a9cbb.  Streaming memory
    is O(K), preprocessing pays for exact MGFs, and no signature-count
    improvement is claimed.  No screened row dominates on the anytime-valid
    stopping axis; fixed-horizon tests may dominate in constants when N is
    fixed.  External Pareto status is unverified.
  estimated_cost:
    implementation: medium
    compute: low
    data: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.90 that an exact finite-score e-process satisfies its null theorem and
    controls optional stopping on toy streams; 0.65 that a compact mixture
    retains useful planted-control efficiency; no claim or prior is assigned
    to a real FN-DSA alarm before a valid public score and primary sources exist.
  novelty_status: unverified
  novelty_screen: >-
    Parent-supplied immutable retrieval receipts and current-tree screening
    covered fixed-sample GOF, analytic normalizer, leaf, homotopy/moment,
    key-shape, BBP and exact-null records.  The screened records contain no
    anytime-valid e-process.  The index is stale and primary literature was not
    checked, so this absence is not novelty evidence.
  discriminated_from: >-
    Exact nearest neighbor IDEA-20260801-010 is a fixed-N whole-signature GOF.
    This proposal's mechanism is a predictable test supermartingale whose
    guarantee is uniform over stopping times and adaptive public contexts; it
    uses a planted exponential-tilt delay curve instead of a terminal p-value.
