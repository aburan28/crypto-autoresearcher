idea:
  id: IDEA-20260809-c8027c
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    A two-context collision certificate for a minimal combiner: same shared
    secret, two different (key, ciphertext) pairs, a few hundred bytes
  class: mechanism
  claim: >-
    For a combiner that hashes only the two shared secrets, an adversary who
    generates its own post-quantum key can produce two distinct
    (public key, ciphertext) pairs yielding the same combined secret. The claim is
    that this is a direct construction rather than a search, that the resulting
    certificate is small and instantly checkable, and that it is the concrete
    object that makes the whole lattice argument legible to a reader who does not
    want to follow derivations.
  mechanism: >-
    Use the component's behaviour under adversarial key generation from
    IDEA-20260809-c13e6a to obtain two decapsulation contexts yielding the same
    post-quantum shared secret; hold the traditional secret fixed; the combiner's
    output is then identical by construction.
  why_not_a_renamed_known_approach: >-
    The mechanism follows immediately from the component analysis, which is
    published. The record's value is the artifact and its role: it is the
    existence proof that anchors the table, and its absence would leave the
    lattice purely derivational.
  predictions:
  - observable: certificate size and verification time
    metric: bytes and milliseconds
    predicted: Hundreds of bytes, verification in milliseconds by an independent implementation.
  - observable: whether the same construction works against a combiner hashing the ciphertext
    metric: boolean
    predicted: No -- and that contrast is the point, since it isolates the ciphertext input as the load-bearing element.
  minimal_test: >-
    Construct the certificate against the minimal combiner, verify with a second
    implementation, then attempt the identical construction against a combiner
    including the ciphertext and record the failure.
  controls:
  - 'CONTRAST CONTROL: the attempt against the stronger combiner must fail, or the certificate does not isolate the mechanism it claims.'
  - 'INDEPENDENT VERIFICATION of the collision.'
  falsification_conditions:
  - The construction fails against the minimal combiner.
  - It also succeeds against the ciphertext-hashing combiner, meaning the mechanism is misattributed.
  interpretation_limits: >-
    The minimal combiner is a laboratory object used to exhibit the mechanism, not
    a deployed construction, and the record says so in its title. A binding
    collision is not a confidentiality break.
  sota_delta: 'No attack on any deployed construction. Delta: the anchoring artifact for the goal''s table.'
  dominated_by: Downstream of IDEA-20260809-c13e6a; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no combiner records. WEB NOT CHECKED.'
