  assumptions:
    - >-
      BRiAl can be installed on this host without a Sage dependency (a pip wheel or a
      cmake build against m4ri). If it cannot, the substitute is Singular's
      `slimgb` inside a Boolean quotient ring plus Macaulay2 under C1, and C2's
      threshold statement is recorded as untested rather than silently transferred.
    - >-
      The engines' protocol output exposes the solving degree and matrix sizes in a
      parseable form. If an engine does not, its row records d_solv as unavailable and
      C4 is partially discharged, with which engine failed named.
    - >-
      Removing RLIMIT_AS is safe on this host only with the RSS watchdog and a wall
      timeout both active; a runaway engine must be killed by RSS, not by the OOM
      killer, because an OOM kill takes the driver with it and loses the row.
    - >-
      Nothing here is an approval to run. This record proposes; the Coordinator
      decides.

  proof_search_map:
    not_applicable_reason: >-
      Instrument/tooling proposal. It proves nothing and certifies nothing; it changes
      what the boundary table can measure. The four audits are recorded where they
      apply because C3 is a prediction with a threshold that can fail.
    bottleneck: >-
      The Groebner column of the ICPERF boundary table is empty, so the ratio the
      whole row exists to report (SAT cost / Groebner cost) is undefined on every cell.
    baseline_embedding:
      parameter_slice: >-
        n15l5-1-S under Macaulay2 F4 over ZZ/2 with field equations - the exact row
        that aborted, re-run with the limit changed and nothing else.
      reproduction_check: >-
        The RLIMIT_AS arm must reproduce the original abort (exit -6, bad_alloc, wall
        under 20 s, RSS about 2.65 GB) before the no-rlimit arm is believed. A
        re-run that does NOT reproduce the abort means the run's phase C differed from
        this harness in some other way and the whole comparison is void.
    observation_collision:
      observable: exit status plus peak RSS plus wall time.
      distinct_preimage_search: >-
        "Column is empty" has at least four distinct preimages - address-space
        artifact, genuine memory need, wrong algorithm for a Boolean system, and
        engine absence. The four arms (RLIMIT_AS / no-rlimit+RSS / BRiAl /
        Singular-in-Boolean-ring) are chosen so that each preimage produces a
        different pattern across the arms; a pattern matching none of the four is
        reported as such rather than assigned.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The same ideal presented in a Boolean polynomial ring (x_i^2 = x_i imposed
          by the representation) instead of ZZ/2[x] with appended field equations.
        predicted_gain: >-
          Generator count 52 instead of 103 at l = 6 and a memory profile that does
          not grow with the appended quadratics; predicted completion within 900 s at
          under 4 GB where the ZZ/2 presentation does not finish.
    quantifier_order: >-
      For the single instance n15l5-1-S and each of the four arms, one outcome tuple
      (status, wall, peak RSS, d_solv) is recorded. C3's 10x threshold is then a claim
      about per-cell MEDIANS over the 10 S and 10 U instances of each of (15,5),
      (17,6), (19,6) for the engines that finish, and about nothing else.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the installed engines, at l <= 6, on this host, with these limits, do or
        do not finish, and by what ratio to WDSat. It can never certify anything about
        Magma F4, about l >= 7, or about the 200 GB wall reported at l = 8.
      nearby_object_control: >-
        The matched random Boolean system of the same shape run through the same
        Groebner arms: a general-purpose engine should NOT show the same
        structure-dependent profile there. If the Groebner engines behave identically
        on the structured instance and on the null, the Groebner column is measuring
        size, not structure, and any SAT/Groebner ratio is a statement about size.
    proof_obligations:
      - claim: the RLIMIT_AS arm reproduces the recorded abort
        responsibility: baseline
      - claim: the no-rlimit arm's outcome distinguishes artifact from memory model
        responsibility: correctness
      - claim: BRiAl finishes l = 6 within budget
        responsibility: feasibility
      - claim: d_solv and matrix dimensions are recorded for every finishing row
        responsibility: interface
      - claim: every conclusion is scoped to these engines, cells and host
        responsibility: scope

  predictions:
    - metric: >-
        Macaulay2 1.22 on n15l5-1-S, no RLIMIT_AS, RSS watchdog 5.5 GB, wall 600 s -
        exit status
      direction: different
      minimum_effect: >-
        completes (exit 0) with peak RSS below 3.5 GB; the alternative outcome
        (watchdog kill at 5.5 GB, or bad_alloc again below 3.5 GB) is the named
        falsifier of C1 and is a MEASURED obstruction, not a null row
    - metric: BRiAl over GF(2) on the (17,6) and (19,6) S instances - completion rate
      direction: higher
      minimum_effect: >-
        at least 8 of 10 instances per cell complete within 900 s at peak RSS below
        4 GB; below 5 of 10 falsifies C2 as worded
    - metric: median wall time ratio, best finishing Groebner engine / WDSat default, per cell
      direction: higher
      minimum_effect: >-
        C3 is DECIDED either way - a ratio at or above 10 on every cell supports P2's
        structural reading; any cell at l = 6 with a ratio below 10 falsifies P2 as
        worded and reattributes the reported gap to engine availability. Both outcomes
        are reportable results
    - metric: solving degree d_solv recorded per finishing Groebner row
      direction: different
      minimum_effect: >-
        recorded for 100% of finishing rows, with the maximum Macaulay matrix
        (rows, cols, nnz); a row without it is an instrument defect, not a datum
    - metric: peak RSS of the Groebner arms on the matched null object of the same shape
      direction: different
      minimum_effect: >-
        differs from the structured instance's by at least 2x in at least one
        direction; equality within 2x means the Groebner column measures size and the
        interpretation of every SAT/Groebner ratio must say so

  minimal_test:
    design: >-
      STAGE 1 (single instance, four arms, cheapest valid discriminator): n15l5-1-S,
      Macaulay2 F4 over ZZ/2 with field equations, run (a) under RLIMIT_AS 6 GB
      exactly as bench.py did, (b) with no RLIMIT_AS, a 250 ms /proc VmHWM poller
      killing at 5.5 GB, and a 600 s wall timeout. Record exit status, wall, cpu,
      peak RSS, and gbTrace output for both. STAGE 2 (engine addition): install BRiAl,
      record its version and build provenance, run it on the same instance and then on
      all 10 S and 10 U instances of each of (15,5), (17,6), (19,6) under the same
      watchdog and a 900 s wall; also run Singular `slimgb` inside a Boolean quotient
      ring on the same set. STAGE 3 (unit): parse d_solv and per-degree matrix
      dimensions from each engine's protocol output into the row. STAGE 4 (control):
      repeat Stage 2 on the 18 matched random Boolean null objects already generated
      for RUN-ICPERF-305ca3. Then recompute P2 per cell from medians over finishing
      rows only, with the count of non-finishing rows reported beside every median.
    execution_status: design_only_not_approved_in_this_record
    controls:
      - kind: reproduction
        design: >-
          Arm (a) must reproduce the recorded abort signature before arm (b) is
          interpreted. This is the control that makes Stage 1 a comparison rather than
          a new observation.
      - kind: null_object
        design: >-
          The 18 existing matched random Boolean systems through the same Groebner
          arms; separates structure-dependence from size-dependence on the Groebner
          side, which no row of RUN-ICPERF-305ca3 could do.
      - kind: matched_encoding
        design: >-
          Boolean-ring presentation versus ZZ/2 with appended field equations, same
          ideal, same engine family where possible (Singular slimgb in both forms), so
          C2's gain is attributed to the representation and not to the engine change.
      - kind: known_false
        design: >-
          An instance whose ideal is the unit ideal by construction (append 1 to the
          generators): every engine must return the unit ideal in negligible time. An
          arm that instead times out or aborts is broken and its rows are void.
      - kind: load
        design: >-
          Every row records loadavg at start; medians are reported both including and
          excluding rows above loadavg 2, because 31 of 32 phase-C rows of
          RUN-ICPERF-305ca3 were launched above it.
    required_metrics:
      - exit status, wall_s, cpu_s, peak child RSS (VmHWM), and which limit fired, per row
      - d_solv and per-degree (rows, cols, nnz) for every finishing Groebner row
      - per-cell median wall and median d_solv over finishing rows, with the non-finishing count
      - engine identity, version and build provenance for every row including BRiAl
      - the ratio best-Groebner / WDSat default per cell, on S and U separately

  falsification_conditions:
    - >-
      C1 fails if Macaulay2 aborts identically with no RLIMIT_AS at peak RSS below
      3.5 GB, or is killed by the 5.5 GB RSS watchdog. Either outcome converts the
      empty column into a measured memory obstruction with a value, which is a result
      and must be recorded as one (with `resource_check` per docs/inventor-protocol.md).
    - >-
      C2 fails if BRiAl cannot be installed on this host, or completes fewer than 5
      of 10 S instances per l = 6 cell within 900 s. Then no Boolean-native Groebner
      column exists here and H-ICPERF-cc4847's "stand-ins for PolyBoRi" assumption
      must travel with every later ICPERF row explicitly.
    - >-
      C3 fails - and this is the outcome that would most change the campaign - if any
      l = 6 cell shows a best-Groebner / WDSat median wall ratio below 10. P2 as
      worded is then false on this host and the reported SAT advantage is substantially
      an engine-availability effect at these cells.
    - >-
      C4 fails if any finishing row lacks d_solv; the column is then still not
      hardware-independent and the ratio to the SAT column remains incommensurable.
    - >-
      If the Groebner arms show the same wall and the same d_solv on the matched null
      objects as on the structured instances, the Groebner column measures instance
      size only, and every SAT/Groebner ratio in the table is a size comparison.

  confounders:
    - >-
      Removing RLIMIT_AS changes the child's allocator behaviour globally, not only
      its ceiling; a finishing run under arm (b) is evidence that the limit was
      binding, not that the ideal is small. The peak RSS is what carries the
      attribution.
    - >-
      BRiAl and Macaulay2 differ in monomial order defaults (degrevlex vs the
      Boolean ring's own) and in whether field equations are appended; the matched
      encoding control exists because otherwise C2's gain is unattributable.
    - >-
      31 of 32 phase-C rows of RUN-ICPERF-305ca3 launched at loadavg above 2, and
      Macaulay2 used more than one thread (phase C cpu > wall). Any wall comparison to
      single-threaded WDSat must either pin threads or report cpu_s beside wall_s.
    - >-
      A newly installed engine is a new confound for every later row; its version and
      build must be frozen in the same way WDSat's was, or the Groebner column stops
      being comparable across batches.
    - >-
      The validator task TASK-20260913-6c5729 is ALREADY assigned a version of Stage 1
      (review plan joint V2(2)), so the marginal information of Stage 1 alone may be
      near zero by the time this is dispatched. The stages that are not pre-empted are
      2, 3 and 4.

  interpretation_limits:
    - >-
      Tooling. Nothing here bears on any curve's security, on any exponent, or on
      Magma F4, which remains absent. A repaired column is a measurement, not a
      finding.
    - >-
      A finishing Macaulay2 row obtained after the limit changed is a NEW observation
      under a different harness, never a correction of the immutable rows of
      RUN-ICPERF-305ca3.
    - >-
      C3's threshold is P2's 10x as H-ICPERF-cc4847 words it; deciding C3 does not by
      itself move that hypothesis's status, which is the Coordinator's act alone.
    - >-
      d_solv measured on 20 toy instances at l <= 6 is not a first-fall-degree or
      degree-of-regularity result; those quantities and their disputes stay with
      KN-OPEN-d218ec and their owning goals.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The peak RESIDENT set of Macaulay2's F4 on the (15,5) instance is within a
        factor 1.5 of the 2.65 GB observed at abort time, i.e. the abort occurred at
        or near the computation's resident high-water mark rather than at the start of
        a much larger allocation profile.
      rigorous_support: >-
        Rigorous side: RLIMIT_AS bounds mapped address space and is enforced at
        mmap/brk, so a bad_alloc under it is consistent with any resident size below
        the limit - the inequality peak_RSS <= peak_AS is exact and is all that is
        known. Imitated side: for a mark-sweep collector whose heap is grown
        geometrically, resident size at time t is within a constant factor of the live
        set, in the same way that a dynamic array's occupancy is within a factor 2 of
        its capacity. This is the assumption that makes the 3.5 GB prediction a
        prediction rather than a guess, and it is the one H1 that can fail benignly.
      validation_plan: >-
        Sample VmRSS and VmSize every 250 ms for the whole of arm (b) on n15l5-1-S
        and on n17l6-1-S, giving the full resident and virtual traces rather than a
        single high-water number; compare the ratio VmSize/VmRSS at abort in arm (a)
        against its value at the same wall time in arm (b). Tail check: the maximum
        over the trace of VmSize/VmRSS - if that ratio exceeds 2 anywhere, the
        address-space reading is supported quantitatively; if it stays near 1, H1's
        premise is wrong and outcome B was the right prior. Sampled parameters: two
        instances, one cell each at l = 5 and l = 6. Transfer assumption stated
        explicitly: nothing about l >= 7, where the live set may exceed any limit here.
    - id: H2
      statement: >-
        The number of F_2 operations a Groebner engine performs on these instances is
        within a polynomial factor of (max Macaulay matrix columns)^omega with
        2 <= omega <= 3, so d_solv plus the matrix dimensions is a sufficient
        hardware-independent cost proxy.
      rigorous_support: >-
        Rigorous side: for a fixed degree bound d the F4 step IS a rank computation on
        an explicit matrix, whose cost is bounded below by its nonzero count and above
        by cols^3; both bounds are unconditional given the matrix. Imitated side: the
        assumption that the LARGEST matrix dominates the total, in the same way that
        the largest term dominates a geometric sum - true when the dimensions grow
        geometrically in the degree, which is the standard bookkeeping in the
        first-fall-degree literature (KN-LIT-023, relayed, unverified).
      validation_plan: >-
        For every finishing row, record the full per-degree (rows, cols, nnz) sequence
        and check empirically that the largest degree step accounts for at least 60% of
        the measured cpu_s, by regressing cpu_s on cols^2 and cols^3 across the 20
        instances of a cell. Comparison: the fitted exponent against [2, 3]. Tail
        check: the instance whose ratio of total cpu to top-step cost is largest -
        if it exceeds 3, the proxy is not sufficient and the column reports cpu_s and
        the trace side by side without claiming commensurability.

  target_complexity:
    time_exponent: >-
      None claimed. This record changes what is measured, not what anything costs.
      The quantity it makes measurable is the Groebner column's exponent in n and l,
      which is currently unknown here because the column is empty.
    memory_exponent: >-
      None claimed. It replaces an address-space CEILING with a measured resident
      quantity, so peak RSS becomes a reported axis of the boundary table on the
      Groebner side, where WDSat's is fixed at compile time (about 17 MB flat,
      KN-LIT-6e036d) and therefore incomparable without the disclosure.
    best_known: >-
      For the SAT side on the same instances, WDSat default medians of
      RUN-ICPERF-305ca3 (unreviewed): 0.0651-2.3471 s wall and 30978-255301 conflicts
      per cell/label. For the Groebner side: nothing measured in this program. The
      published comparators (SRC-SATIC-TRIMOSKA-2019 Magma F4 numbers) are `reported`
      and are excluded from any ratio by RQ-ICPERF-94c86e's own constraints.
    hidden_overhead: >-
      The RSS watchdog itself costs one poll per 250 ms and is negligible; the
      instrumentation of gbTrace can slow an engine measurably (protocol output is
      unbuffered in some engines), so every instrumented row must be paired with an
      uninstrumented one and the overhead reported, or the cost unit contaminates the
      wall time it is supposed to explain.
    tradeoff_note: >-
      Not applicable as an algorithm. Operationally: the watchdog trades a hard
      guarantee (RLIMIT_AS never lets the child exceed the limit) for a sampled one (a
      child can spike between polls), so a 5.5 GB watchdog on a 6 GB budget host is
      the safe configuration and is what is proposed.

  dominated_by: >-
    Not applicable as an algorithmic claim - this record proposes no algorithm and
    occupies no point on any cost frontier ("n/a (no cost result claimed)"). The
    frontier check that IS meaningful, and was actually done: the alternatives for
    obtaining a Groebner column here are (i) Macaulay2 1.22 under the existing
    RLIMIT_AS, which produced 0 finishing rows in 32 attempts; (ii) Singular std over
    GF(2) with field equations, 0 of 4 within 900 s; (iii) msolve, present at
    /usr/bin/msolve but over prime fields, so not applicable to GF(2) here;
    (iv) Magma F4, absent and unobtainable; (v) exhaustive enumeration of V^3, which
    is IDEA-20260915-3f1964's instrument and dominates a Groebner engine outright on
    time at l <= 8 (2^{3l}/6 field operations) while answering a different question -
    it certifies UNSAT and classifies roots but yields no Groebner cost datum, which
    is the number RQ-ICPERF-94c86e's table asks for. BRiAl is proposed because every
    row of (i)-(iv) is empty or inapplicable, not because it is expected to beat
    anything.
  sota_delta: >-
    Zero exponent change, zero constant change to any attack. The delta is in
    measurability: three cells x two labels of the boundary table's Groebner column go
    from `none (0)` to a number with a hardware-independent unit, or to a measured
    memory obstruction with a value in GB. Quantitatively, the decidable quantity is
    the best-Groebner/WDSat median wall ratio per cell, currently undefined on 6 of 6
    cells; C3 predicts it is at least 10 everywhere and names below-10 at l = 6 as the
    outcome that would reattribute the reported gap.

  estimated_cost:
    implementation: medium
    compute: low
    wall_clock_seconds: 21600
    memory_gb: 6
    note: >-
      Advisory (AGENTS.md research-budget policy). Stage 1 is two runs of at most
      600 s. Stage 2 is 60 structured + 18 null instances x 2 engines under a 900 s
      cap; if BRiAl behaves as predicted the true cost is far below the cap, and if it
      does not the cap binds at about 39 h of single-core time, which is why Stage 2
      should be ordered l = 5 first and stopped per-cell on the first 5 timeouts.
      Implementation cost is dominated by installing and freezing BRiAl and by parsing
      three engines' protocol formats, not by the watchdog.
  recommended_priority: high
  inference:
    policy: research-deep
    reasoning_effort: null
