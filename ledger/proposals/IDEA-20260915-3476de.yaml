idea:
  id: IDEA-20260915-3476de
  title: >-
    Make the Groebner column measurable and then decide whether the SAT-over-Groebner
    gap is structural or an engine-availability artifact: an RSS watchdog in place of
    RLIMIT_AS, a Boolean-native engine (BRiAl over GF(2)) added beside Macaulay2 F4
    and Singular std, and a hardware-independent Groebner cost unit (solving degree
    reached x Macaulay matrix dimensions) so the column reports operations rather
    than only wall time
  class: tooling
  research_question_id: RQ-ICPERF-94c86e
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids: [GOAL-ICPERF-e6b6a4]
  status: proposed
  proposed_by: idea-generator
  task_id: TASK-20260915-5ba08b
  recorded_at: '2026-09-15'
  kind: instrument

  provenance_note: >-
    THIS ID WAS ALREADY ALLOCATED AND FORWARD-REFERENCED BY AN EARLIER, INTERRUPTED
    SESSION OF THIS SAME TASK. IDEA-20260915-0d8e90 (interpretation_limits) says
    "nothing about Groebner engines (their law is IDEA-20260915-3476de's to measure)"
    and IDEA-20260915-eee7e4 (interpretation_limits) says "the analogous move there
    is adding the side polynomial to the ideal, IDEA-20260915-3476de's column could
    test it". Both of those records are immutable and name this identifier for exactly
    this content. `python3 tools/allocate_id.py --check IDEA-20260915-3476de` reports
    it well-formed and free across the union (0 occurrences in the identifier union;
    the two references above are in free text, which the checker does not scan). This
    record is therefore written AT that identifier so those two references resolve,
    rather than minting a fresh token and leaving them dangling. Nothing in either
    sibling record is edited. If a reviewer judges the reuse improper, the remedy is a
    superseding record under a new id, never an edit to 0d8e90 or eee7e4 (AGENTS.md
    rule 15).

  claim: >-
    (C1, INSTRUMENT) The 32 Macaulay2 1.22 rows of RUN-ICPERF-305ca3 that exited -6
    with std::bad_alloc in 0.87-15.65 s did so at 2644-2653 MB peak child RSS under a
    6 GB RLIMIT_AS, i.e. at 44% of the limit they were killed by. Replacing RLIMIT_AS
    with (a) no address-space limit, (b) a polling RSS watchdog at 5.5 GB sampling
    /proc/<pid>/status VmHWM at 250 ms, and (c) an unchanged wall timeout, makes at
    least the (15,5) cell finish: this record predicts Macaulay2 F4 over ZZ/2 with
    field equations completes n15l5-1-S in under 600 s at peak RSS below 3.5 GB.
    (C2, INSTRUMENT) Adding one Boolean-native engine - BRiAl (the PolyBoRi successor,
    zero-suppressed decision diagrams over GF(2), which needs no appended field
    equations because the Boolean ring quotients by x^2 = x structurally - NOT
    currently installed here) - makes the l = 6 cells reachable: predicted completion
    of the (17,6) and (19,6) S instances within 900 s at peak RSS below 4 GB.
    (C3, DISCRIMINATING) With C1 and C2 in place, P2 of H-ICPERF-cc4847 becomes
    decidable, and the two outcomes mean DIFFERENT things. If the best installed
    Groebner engine's median wall time exceeds WDSat's by at least 10x on every cell,
    the SAT advantage on these instances is a property of the descended structure
    (core-variable propagation) as the mechanism paragraph of H-ICPERF-cc4847 asserts.
    If a Boolean-native engine lands WITHIN 10x of WDSat at l = 6, then P2 as worded
    is FALSE here and the reported SAT-over-Groebner gap of
    SRC-SATIC-TRIMOSKA-2019 is, on this host and at these cells, substantially an
    artifact of which Groebner engine is available - the very confound the empty
    column of RUN-ICPERF-305ca3 could not distinguish.
    (C4, INSTRUMENT) The Groebner column must report a hardware-independent primary
    unit, as RQ-ICPERF-94c86e's decision target requires ("Groebner matrix
    operations"), not wall time alone: the solving degree reached d_solv and, per
    degree step, the Macaulay matrix row count, column count and nonzero count,
    parsed from the engines' own protocol output (Macaulay2 gbTrace, Singular
    option(prot), BRiAl's polynomial/monomial counters). Without it, even a finishing
    row yields a number that cannot be compared to another machine, another engine,
    or the first-fall-degree literature.
    No exponent is claimed and no curve is discussed.

  mechanism: >-
    WHY THE ABORT IS PLAUSIBLY AN ADDRESS-SPACE ARTIFACT AND WHAT WOULD SHOW IT IS
    NOT. RLIMIT_AS caps the virtual address space a process may MAP; it does not cap
    resident memory. A garbage-collected runtime that reserves a large heap region up
    front (Macaulay2 links the Boehm-Demers-Weiser collector) can fail an mmap and
    throw std::bad_alloc while its resident set is a small fraction of the limit. The
    signature in RUN-ICPERF-305ca3 is exactly that shape - failure in 0.9-15.7 s (too
    fast for a Macaulay matrix to have been built at l = 5, where the review plan
    records a pre-run smoke observation of about 50 s to COMPLETION with no rlimit)
    and a peak RSS of 2.65 GB against a 6 GB cap. The competing explanation is that
    the process genuinely needs more than 6 GB of ADDRESSABLE space early because the
    collector sizes its heap from the ideal's degree bound, in which case removing
    RLIMIT_AS lets it grow and the RSS watchdog, not the address-space limit, becomes
    the binding constraint. These two are distinguished by ONE run: no RLIMIT_AS, RSS
    watchdog, wall timeout. Outcome A (finishes below 3.5 GB RSS): the column was
    empty for a harness reason and AGENTS.md rule 5 applies - no negative
    mathematical evidence was ever available. Outcome B (killed by the RSS watchdog at
    5.5 GB, or bad_alloc again below 3.5 GB RSS): the memory model is the obstruction,
    it is a real measured quantity, and the honest table entry is "not measurable with
    Macaulay2 1.22 at this cell within 6 GB", with the peak RSS recorded as the
    obstruction's value.

    WHY A BOOLEAN-NATIVE ENGINE IS THE RIGHT ADDITION AND NOT A CONVENIENCE. The
    shipped instance at l = 6 is 51 variables / 52 equations over GF(2)
    (KN-LIT-036049). Macaulay2 and Singular are run here over ZZ/2 with the field
    equations x_i^2 + x_i APPENDED, which doubles the generator count and forces the
    engine to rediscover, by reduction, a quotient that a Boolean ring imposes by
    construction. A ZDD-based Boolean ring stores a polynomial as a set of monomials
    with sharing, so the memory profile of the same computation is structurally
    different, and this is precisely why PolyBoRi/BRiAl is the engine the Trimoska
    line compares against in the literature. Installing it is what makes the
    Groebner side of the boundary table an engine comparison rather than a single
    engine's failure. It is also the ONLY way to test C3, because a gap measured
    against a general-purpose engine given a Boolean problem measures the mismatch,
    not the structure.

    WHY THE COST UNIT MATTERS MORE THAN THE WALL TIME. WDSat's primary unit is
    conflicts (KN-LIT-6e036d), which is hardware-independent and comparable across
    builds. The Groebner side currently has no counterpart in this program's ICPERF
    row, so a ratio between the two columns is a ratio between a machine-independent
    count and a machine-dependent second. Recording (d_solv, rows, cols, nnz) per
    degree step gives the Groebner side a comparable unit - the dominant linear
    algebra cost is rows x cols x (nnz/row) for a sparse elimination and cols^omega
    for a dense one, both computable from the trace - and it makes the column
    directly commensurable with the first-fall-degree and degree-of-regularity
    literature this program treats as open (KN-LIT-023, KN-OPEN-d218ec), because
    d_solv is the quantity those claims are about.

  what_this_would_have_caught_in_RUN_ICPERF_305ca3: >-
    (1) All 32 phase-C rows were killed by a limit they were nowhere near in resident
    terms; the run therefore reports P2 as `null` and the boundary table's Groebner
    column is empty on all three cells. C1's watchdog would either have produced the
    column or produced a MEASURED memory obstruction with a number. (2) Nothing in
    the 32 rows records the solving degree, the matrix dimensions, or the pair count,
    so even a finishing row would have given wall seconds with no invariant to compare
    - C4 fixes that and is independent of C1. (3) The four Singular std rows timing
    out at 900 s are consistent both with "std over GF(2) with appended field
    equations is the wrong algorithm" and with "no Boolean-native engine was
    installed"; C2 separates them. (4) The contract's own assumption that the
    installed engines "are stand-ins for Magma F4 / PolyBoRi, which are absent" is
    load-bearing for every P2 reading; C2 removes the PolyBoRi half of that
    assumption rather than carrying it forward into every later row.

  novelty_status: unverified
  novelty_screen:
    what_is_not_new: >-
      RSS-versus-address-space accounting is standard operational practice; polling
      /proc/<pid>/status is not a technique. PolyBoRi/BRiAl as the reference Boolean
      Groebner engine is the standard choice in this literature and is named as
      absent in KN-LIT-036049 and in H-ICPERF-cc4847's assumptions. Recording the
      solving degree and Macaulay matrix size is the standard instrumentation of
      every Groebner complexity study.
    what_is_new: >-
      Nothing mathematically. What is new HERE is (i) the specific discrimination in
      C3 - using a Boolean-native engine as the control that decides whether the
      measured SAT advantage is structural or engine-availability - stated as a
      prediction with a threshold before the engine is installed, and (ii) making the
      Groebner column's primary unit an invariant rather than wall time inside this
      program's boundary table. The record is filed as tooling and claims no
      mathematical novelty.
    searched: >-
      Read this session: RUN-ICPERF-305ca3 task-report.md and environment.json,
      EXP-ICPERF-66fd51 hypothesis and review plan, KN-LIT-036049, KN-LIT-6e036d,
      KN-LIT-023, KN-LIT-022. `rg` over knowledge/ and ledger/proposals/ for
      "PolyBoRi", "BRiAl", "RLIMIT", "RSS", "bad_alloc". Availability checked on this
      host: /usr/bin/M2 (1.22), /usr/bin/Singular, /usr/bin/msolve present;
      `import brial` raises ModuleNotFoundError; no Sage. No web search for BRiAl
      version behaviour; hence unverified.

