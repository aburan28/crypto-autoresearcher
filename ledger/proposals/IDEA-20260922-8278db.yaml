idea:
  id: IDEA-20260922-8278db
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE TRACE-ZERO-VARIETY DECOMPOSITION LINE, NAIVELY EXTRAPOLATED TO THESE
    FIVE DEPLOYED ROWS, APPEARS TO BREAK ALL FIVE CURVES BY 27 TO 73 BITS --
    AND THAT IS THE CERTIFICATE THAT THE EXTRAPOLATION IS INVALID, NOT A
    RESULT: g = k-1 EXCEEDS log2(q) AT THREE OF THE FIVE ROWS, PUTTING THEM
    OUTSIDE THE "g FIXED, q -> infinity" REGIME THE FORMULA ASSUMES, AND THE
    REACHABILITY-TABLE CELL FOR THIS LINE MUST BE FILED AS OPEN, WITH THE
    MISSING QUANTITY NAMED, NOT AS DEFINED-WITH-A-COST
  class: mechanism
  claim: >-
    SETTING. E/F_q, q = 2^16, over F_{q^k}, k in {11,13,17,19,23} prime
    (audit). IDEA-20260906-a77711 Arm B proposes index calculus on the
    trace-zero variety T_k = ker(Tr : Res_{F_{q^k}/F_q}(E) -> E), an abelian
    variety of dimension k - 1 over F_q containing G (since Tr acts on G as
    (mu^k - 1)/(mu - 1) = 0, mu the pi_q-eigenvalue of IDEA-20260922-c07598),
    via Gaudry's abelian-variety algorithm at cost q^{2 - 2/g}, g = k - 1,
    "up to polylog," with a disclosed but uncharged overhead of "(n-1)! solves
    per relation" that a77711 itself flags as making "the exponent meaningless
    for n growing with the field." This record charges that overhead
    explicitly, at these five rows, and shows the result is a trap.

    (A) THE STRUCTURAL FIT, COMPUTED HERE, THAT MAKES ARM B LOOK UNUSUALLY
    APPLICABLE. a77711's Arm B toy construction assumes |G| ~ q^{k-1}
    (G nearly fills T_k). On these five DEPLOYED rows this is not an
    assumption but an audited near-identity: total order over F_{q^k} is
    q^k + 1 - s_k ~ q^k, cofactor h ~ q (6cf862, result A), so
    r = (q^k + 1 - s_k)/h ~ q^{k-1}. Checked bit-for-bit against the audited
    subgroup sizes: q^{k-1} has 16(k-1) bits = 160, 192, 256, 288, 352 for
    k = 11, 13, 17, 19, 23, against audited r of 161, 193, 257, 289, 353 bits
    -- agreement to within the one bit the Hasse-interval rounding allows, at
    every row. This is a genuine, checkable alignment between a77711's toy
    scaling assumption and these deployed parameters that no record in this
    lane has previously noted, and it is exactly what makes the naive
    extrapolation in (B) look tempting rather than obviously wrong.

    (B) THE NAIVE NUMBER, COMPUTED HERE, AND WHY IT MUST NOT BE TRUSTED.
    Charging a77711's exponent AND its disclosed (k-1)! overhead as a single
    multiplicative cost, q^{2-2/(k-1)} * (k-1)!, in bits:
      k=11 (g=10): 16*(2-2/10) + log2(10!)  = 28.80 + 21.79 =  50.6
      k=13 (g=12): 16*(2-2/12) + log2(12!)  = 29.33 + 28.84 =  58.2
      k=17 (g=16): 16*(2-2/16) + log2(16!)  = 30.00 + 44.25 =  74.3
      k=19 (g=18): 16*(2-2/18) + log2(18!)  = 30.22 + 52.51 =  82.7
      k=23 (g=22): 16*(2-2/22) + log2(22!)  = 30.55 + 69.93 = 100.5
    (factorial magnitudes are the standard values 10!=3,628,800 through
    22!=1,124,000,727,777,607,680,000; log2 taken by hand from those decimal
    magnitudes, +/- 0.1 bit). Against matched rho, reused from
    IDEA-20260922-d11575 and certified in IDEA-20260922-c07598
    (2^77.9, 2^93.7, 2^125.5, 2^141.5, 2^173.3): the naive number sits BELOW
    rho at every single row, by 27.3, 35.5, 51.3, 58.8 and 72.8 bits
    respectively -- margins that GROW with k, i.e. the naive formula predicts
    the "break" gets more dramatic exactly where the curve is largest. NO
    PUBLISHED RESULT, INTERNAL OR EXTERNAL, HAS EVER REPORTED THESE FIVE
    STANDARDIZED CURVES AS BROKEN. A margin of 27 to 73 bits growing with
    field size, contradicting the entire deployment history of this curve
    family, is the signature of a misapplied asymptotic formula, not a
    computation to report as a cost.

    (C) THE NAMED OBSTRUCTION: g EXCEEDS log2(q) AT THREE OF FIVE ROWS.
    Gaudry's q^{2-2/g} is an asymptotic statement as q -> infinity WITH g
    FIXED; its derivation (recalled, not re-derived here) treats the
    per-relation decomposition-system solve as bounded independently of q,
    which is only plausible when g is small relative to log q (the system's
    own bit-size scale). Define the regime ratio rho_reg = g / log2(q) =
    (k-1)/16: 0.625 (k=11), 0.750 (13), 1.000 (17), 1.125 (19), 1.375 (23).
    At k=17 the arity EQUALS log2(q) exactly; at k=19 and k=23 it EXCEEDS it.
    This is precisely a77711's own disclaimer -- "the exponent is meaningless
    for n growing with the field" -- made QUANTITATIVE at these five specific
    rows for the first time: nobody has previously computed rho_reg here, and
    it is the reason (B)'s numbers cannot be trusted, not merely a general
    caveat.

    (D) THE ACTUAL MISSING QUANTITY, NAMED. The (k-1)! charge in (B) prices
    only the EXPECTED TRIAL COUNT to find one decomposing tuple under a
    decomposition-probability heuristic (a77711's H2); it does NOT price the
    cost of ONE trial, i.e. the cost of testing (or solving for) whether a
    candidate arity-(k-1) sum decomposes, which on a Weil-descended system at
    arity g = 10 to 22 is a polynomial-solving cost this program has never
    measured at any arity above 3-4 (IDEA-20260807-32f96d: "Arity m >= 4 has
    ZERO measured cost cells anywhere in the corpus," and RQ-SDEG-001 /
    KN-OPEN-d218ec record the solving-degree question as open even at small
    arity). If that per-trial cost is not O(1) or polylog(q) -- and every
    result this program holds about Semaev/Weil-descent solving cost at
    growing arity (the DREG line, KN-OPEN-d218ec) argues it is NOT -- then
    the true cost is (k-1)! times a per-trial factor this record does not
    know, and the reachability-table cell for "decomposition-based index
    calculus via the trace-zero variety" on these five rows must be filed as
    OPEN, with that per-trial cost at arity 10-22 over F_{2^16} as the
    EXPLICITLY NAMED missing quantity -- not STRUCTURALLY EMPTY (unlike the
    F_q-rational base of 6cf862 result A) and not DEFINED WITH A COMPUTED
    COST (the naive number in (B) is not trustworthy enough to file as one).

    Representation class R1 (RQ-ECDLP-623a32, field coordinates restricted to
    T_k). Attack stage whose charged cost this record addresses:
    decomposition (relation-search system solving), the exact stage
    IDEA-20260906-a77711 and IDEA-20260922-6cf862 both flag as uncharged.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate of a point of T_k(F_{q^k})
    restricted to its F_q-rational structure, exactly a77711's Arm B object
    (trace-zero variety), cited and not restated. Operation set Sigma:
    translation by the factor base inside T_k -- partial action, Class I,
    same trichotomy placement as a77711 gives it there; this record adds
    nothing to that placement. WHAT THIS RECORD ADDS is not a new object but
    a COST AUDIT of an already-named object at parameters where the audit
    changes the verdict from "reported, untested" to "the untested part is
    exactly what decides the row."

    THE ARITHMETIC, SHOWN SO IT CAN BE CHECKED. Factorial magnitudes used:
    10! = 3,628,800; 12! = 479,001,600; 16! = 20,922,789,888,000;
    18! = 6,402,373,705,728,000; 22! = 1,124,000,727,777,607,680,000
    (standard values, not computed by a script this session, cross-checked
    against each other by successive multiplication -- 11*10! = 11! etc. --
    which a reviewer should redo). log2 of each taken from its decimal
    magnitude via log2(x) = log10(x)/log10(2), log10(2) = 0.30103: e.g.
    log2(22!) = log10(1.1240 * 10^21)/0.30103 = (21 + 0.0508)/0.30103 = 69.93.
    q^{2-2/g} exponents computed directly: 16*(2 - 2/g) for g in
    {10,12,16,18,22}, giving 28.80, 29.33, 30.00, 30.22, 30.55 respectively
    (2/g shrinks as g grows, so the exponent RISES toward 32 = 16*2 slowly,
    consistent with Gaudry's formula approaching the trivial q^2
    brute-force bound as g -> infinity, which is itself a sanity check on
    the formula's shape here).

    WHY THIS IS NOT A CLAIMED BREAK, STATED AS PLAINLY AS POSSIBLE. A margin
    of 27 to 73 bits, GROWING with k, against a curve family with no reported
    break in the literature, run through a formula its own source (a77711)
    disclaims as meaningless in exactly this regime (n growing with a fixed
    field), is textbook evidence that the FORMULA does not apply here, not
    evidence that the curves are weak. This record's contribution is
    identifying and quantifying the regime failure (rho_reg = g/log2(q) >= 1
    at three of five rows) rather than either (i) reporting the naive number
    as a cost, which would be a fabricated result under AGENTS.md rule 5 in
    substance even though every individual number is independently checkable
    arithmetic, or (ii) declining to compute it at all, which would leave the
    reachability table's cell silently absent rather than explicitly OPEN.

    F2 (factor-base decomposition, via a77711's trace-zero variety
    construction) is the declared component. F6 (endomorphism orbit, the
    trace map Tr as an F_q-endomorphism of Res(E)) is a component of the T_k
    construction, named as in a77711. What is added beyond both: the
    numeric audit (B), the regime-validity quantity rho_reg (C), and the
    resulting OPEN verdict with its named missing quantity (D), none of
    which a77711 or any other filed record computes at these five rows.
