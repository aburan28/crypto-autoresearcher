      - regime_ratio_rho_reg_per_row (already computed, Part 1)
      - gorla_massierer_measured_cost_at_implemented_g (Part 2)
      - per_trial_decomposition_wall_time_and_operation_count_vs_g (Part 3)
      - fitted_growth_law_in_g_with_extrapolation_distance_to_g_equals_22
  falsification_conditions:
    - >-
      A recomputation of (B) or (C) that disagrees by more than 0.5 bit or
      0.01 in rho_reg at any row: the arithmetic is wrong and the record is
      superseded, not patched.
    - >-
      Gorla-Massierer's measured cost at g = 2 or 4, once read, turns out to
      match a77711's H1/H2-only prediction with no additional per-trial
      overhead beyond it: this record's (D) concern is then substantially
      weakened for small g, though the regime-ratio argument (C) for g >= 16
      is untouched by a small-g calibration.
    - >-
      A toy-scale measurement (Part 3) showing per-trial decomposition cost
      GROWS SLOWER than the factorial-adjacent rate this record's caution
      assumes (e.g. only polynomially in g): the naive number in (B) becomes
      more credible and the reachability-table cell should move from OPEN
      toward DEFINED, with the fitted law replacing the (k-1)! placeholder.
    - >-
      A toy-scale measurement showing per-trial cost EXPLOSIVE beyond even a
      generous factorial-times-exponential model (e.g. matching the doubly-
      exponential-in-arity behaviour some Groebner worst cases exhibit): the
      naive number is confirmed as an artefact and the cell should move
      toward "line inert, obstruction: per-trial solving cost," a genuine
      closure with the standard this program's protocol requires.
  confounders:
    - >-
      The factorial-only charge in (B) may UNDERSTATE or OVERSTATE the true
      cost depending on whether decomposition attempts are independent
      (a77711's implicit assumption) or correlated (e.g. a failed attempt
      revealing information that speeds later attempts, or conversely a
      solver whose worst-case cost scales far worse than its expected-case
      trial count) -- this record does not distinguish these and states the
      charge as a NAMED HEURISTIC APPROXIMATION, not a bound in either
      direction.
    - >-
      Toy-scale per-trial cost measurements (Part 3) at g <= 8 may not
      extrapolate to g = 22: Groebner and SAT solving costs are notoriously
      non-smooth in problem size (phase transitions, memory walls per
      IDEA-20260828-770aa4's analogous binary-Weil-descent finding), so any
      fitted law from Part 3 carries a stated, large extrapolation distance
      and must not be read as settling (D).
    - >-
      The half-bit convention for r (2^{s-0.5}) affects the matched-rho
      figures reused from d11575/c07598 but not the internal comparison
      within (B) or (C).
  interpretation_limits:
    - Proposal only. No experiment, no run, no approval, no result exists here.
    - >-
      THIS RECORD DOES NOT CLAIM A BREAK OF ANY OF THE FIVE CURVES. Stated
      as plainly as the claim itself: the naive number in (B) is presented
      specifically to be DISCREDITED by (C) and (D), not to be reported as a
      cost anywhere downstream. Any record citing this one's numbers without
      also citing (C) and (D) has misused it.
    - >-
      The reachability-table verdict this record supports is OPEN, with a
      named missing quantity -- not STRUCTURALLY EMPTY (that verdict belongs
      to 6cf862's F_q-rational-base result) and not DEFINED WITH A COMPUTED
      COST (the naive number is explicitly disclaimed as untrustworthy).
    - >-
      Nothing here re-derives Gaudry's exponent, Gorla-Massierer's
      implementation, or a77711's H1/H2; all are cited and treated as
      reported. The arithmetic contribution is confined to evaluating
      already-stated formulas at these five rows and computing the
      regime-validity ratio.
    - The toy cells proposed in Part 3 reach g <= 8 against deployed g up to 22; the extrapolation distance is large and is not resolved by this record.
  heuristic_assumptions:
    - id: H-8278db-0
      statement: >-
        r ~ q^{k-1} TO WITHIN ONE BIT. Unconditional given the audited
        cofactor h ~ q and total order ~ q^k; not a heuristic, an arithmetic
        consequence, recorded here for completeness of the numbered list.
      rigorous_support: Weil's theorem (Hasse interval) plus the audited exact cofactor identity (6cf862).
      validation_plan: Bit-count check performed in (A); no further validation needed.
    - id: H-8278db-1
      statement: >-
        DECOMPOSITION PROBABILITY ~ 1/(k-1)! (a77711's H2, imported
        unmodified). Imitates the classical heuristic that a zero-dimensional
        polynomial system of expected solution count 1 over an unordered
        arity-g factor base succeeds at rate 1/g! -- the same family of
        heuristic as Gaudry-Diem decomposition probability and its
        prime-field analogue, the Dickman-de Bruijn smoothness density,
        already named as the classical imitation target by
        IDEA-20260922-6cf862's H-6cf862-1.
      rigorous_support: The counting upper bound is exact; attainment of the rate is the heuristic (a77711's own characterisation, not strengthened here).
      validation_plan: a77711's own validation plan (toy exact enumeration at n = 3, 5), not repeated here; this record's addition is applying the SAME probability model at k up to 23 without re-validating it there, which is exactly the extrapolation Part 3 of the minimal test would begin to check.
    - id: H-8278db-2
      statement: >-
        PER-TRIAL COST IS THE UNKNOWN, NOT A HEURISTIC WITH A STATED VALUE.
        This record explicitly declines to assume a value for it (neither
        O(1)/polylog as a77711's formula implicitly requires, nor any
        specific growth law), which is the entire content of verdict (D).
      rigorous_support: n/a by construction; recorded so a reader cannot mistake the absence of an assumption for an implicit O(1) one.
      validation_plan: Part 3 of the minimal test, the first attempt at any measurement of this quantity in this program.
  heuristic_note: >-
    This record's arithmetic (A), (B), (C) is unconditional; only H-8278db-1
    (imported, not re-derived) and the explicitly UNASSUMED H-8278db-2 govern
    the interpretation. The a-priori expectation, stated before any Part-3
    measurement: per-trial decomposition cost at arity 10-22 grows fast
    enough to erase the entire 27-to-73-bit naive margin, because nothing in
    this program's own experience with Weil-descended systems at arity >= 4
    (RQ-SDEG-001, RQ-DREG-001, KN-OPEN-d218ec) suggests otherwise, and
    because five widely deployed curves showing an internally-consistent,
    field-size-growing apparent break by a formula their own source disclaims
    is precisely the shape of a known trap rather than a discovery. A Part-3
    result that instead shows the margin SURVIVING even a partial toy-scale
    extrapolation would be the single most consequential finding this lane
    could produce and must trigger independent review before any further
    step, per RQ-BINSTD's decision target and AGENTS.md rule 9.
  target_complexity:
    time_exponent: >-
      NOT ESTABLISHED. The naive formula gives l^{(2-2/(k-1))/(k-1)}, which
      -> l^0 as k grows (the exponent on q stays near 2 while the group order
      exponent k-1 grows), an ever-shrinking exponent that is itself another
      symptom of the regime failure (C): a genuine algorithm should not get
      asymptotically CHEAPER in the exponent on l as l grows, at fixed q,
      without an explicit statement of what is being held fixed and why. This
      record treats that shrinking exponent as a further, independent piece
      of evidence against trusting the naive extrapolation, alongside the
      27-to-73-bit margin and the rho_reg >= 1 condition.
    memory_exponent: >-
      q^{1-1/g}, i.e. roughly q per row (2^{14.4} to 2^{15.3} entries),
      MODEST at fixed q -- unlike IDEA-20260922-d11575's GHS line, whose
      memory grows with k. This is the one place the naive formula might
      still be informative even if the time exponent is not: the FACTOR-BASE
      SIZE claim (order q, independent of k) rests only on H1 (trace-zero
      density), not on the disputed per-trial cost, and is comparatively more
      trustworthy.
    best_known: 0.886 sqrt(r) / sqrt(2k) group operations (matched rho, cited from IDEA-20260922-c07598 / d11575).
    hidden_overhead: >-
      THE ENTIRE POINT OF THIS RECORD. The per-trial decomposition cost at
      arity 10-22, unknown, is disclosed as the dominant hidden term rather
      than absorbed into an o(1) or a constant; see (D) and H-8278db-2.
    tradeoff_note: >-
      If a real per-trial cost law were established and turned out
      favourable, this line's memory footprint (order q, roughly 2^15 field
      elements) would be far smaller than IDEA-20260922-d11575's GHS memory
      (order q^{1-1/g} at MUCH larger g there), making it the more attractive
      time-memory point of the two decomposition-adjacent lines IF it turned
      out to work -- which this record explicitly does not establish.
