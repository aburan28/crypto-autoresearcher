      ASSUMPTION THIS RECORD ARGUES IS UNSAFE for the per-trial-cost half of
      the charge, though it is retained for the probability half because no
      better information exists.
    - Arithmetic only at deployed parameters; nothing here runs an attack at any of the five field sizes.
  proof_search_map:
    bottleneck: >-
      The per-trial solving cost of a single decomposition attempt on a
      Weil-descended, arity-(k-1) system over F_{2^16}, at k-1 in
      {10,12,16,18,22} -- a quantity IDEA-20260807-32f96d certifies this
      program has never measured at any arity above 3-4, and which is not
      captured by a77711's H1/H2 probability heuristics or by the q-exponent
      alone.
    baseline_embedding:
      parameter_slice: >-
        At k' = 3 (g = 2, the smallest case a77711's Arm B admits, n odd
        prime with n >= 3), q^{2-2/2} = q^1 (the classical g = 1 point-
        counting-free case Gaudry's method degenerates to) and the "(n-1)!"
        overhead is 2! = 2, both trivially cheap; this is the reproduction
        slice against the toy ladder a77711 itself proposes (n = 3, 5) and
        Gorla-Massierer's implemented cases.
      reproduction_check: >-
        The g = 2, 4 cases (k' = 3, 5) are exactly where Gorla-Massierer
        report an implementation; if that paper's measured per-relation cost
        at g = 2 or 4 is read and compared to a77711's H2-only prediction
        (1/(g-1)!, i.e. no extra per-trial cost beyond the probability), the
        resulting ratio is the calibration this record's (D) needs and does
        not have. NOT PERFORMED HERE (the paper was not opened).
    observation_collision:
      observable: >-
        The gap between (i) the naive (k-1)!-charged number in (B) and (ii)
        a real measured per-relation cost at growing arity, were it
        available.
      distinct_preimage_search: >-
        Two distinct explanations could produce "naive number below rho":
        (a) the trace-zero-variety line is genuinely fast at these
        parameters and the formula IS valid despite rho_reg >= 1 (the
        surprising, high-consequence possibility this record does not rule
        out, only flags as implausible given the field's deployment
        history), or (b) the formula is invalid and the true per-trial cost
        is large enough to push the total above rho (this record's stated
        expectation). The distinguishing evidence is a MEASUREMENT of
        per-trial cost at growing arity (D), which does not exist in this
        program and is the reason the cell is filed OPEN rather than
        resolved either way.
    constructive_transforms:
