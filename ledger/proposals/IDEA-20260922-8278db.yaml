  assumptions:
    - k odd prime, q = 2^16, as audited; r ~ q^{k-1} (checked bit-for-bit in (A)).
    - >-
      a77711's H1 (trace-zero density ~ q) and H2 (decomposition probability
      ~ 1/(k-2)! for a g = k-1 summand base, here approximated as 1/(k-1)!
      per a77711's own stated form) are assumed to transfer from a77711's
