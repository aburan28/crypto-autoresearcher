      count cost of one decomposition attempt with the program's existing
      Groebner/SAT instruments (RQ-DREG-001 / RQ-SATIC-1ae57a line), fitting
      a growth law in g. This is the first direct measurement of the missing
      quantity (D) at any arity, even toy, and its extrapolation to g = 22
      -- stated with the extrapolation distance, never hidden -- is the
      first data-backed alternative to the naive (k-1)! charge.
