idea:
  id: IDEA-20261009-3642dd
  question_id: RQ-QLWE-9108dc
  added: '2026-10-09'
  status: proposed
  approved_by: null
  title: Rank-1 subquotient ideal-certificate census on toy module lattices
  class: control
  claim: >-
    On frozen toy shapes (d,k) with total dimension kd <= 48 — including
    (8,2), (8,4), (16,2) — the census of bounded-height functionals
    phi: K^k -> K (dual-order coefficient vectors) applied to module
    lattices finds: (a) at least one certified, decoding-positive
    subquotient phi(M) that is a fractional ideal of O_K on every planted
    module (positive control, rate 1.0), and (b) zero certified
    subquotients on random MLWE-shaped modules across >= 30 seeds per shape
    (the obstruction reading: module rank filtration does not propagate
    ideal certificates to random modules), or a measured nonzero rate with
    its exact certifying phi (the re-opened reading). Either branch is
    the deliverable. No deployed parameter set is touched; no exponent
    moves.
  mechanism: >-
    The object is the rank-1 subquotient phi(M) of a rank-k module lattice
    M over O_K for small functionals phi. Ideals are rank-1 modules, so
    the whole ideal chain (KN-TECH-046) applies to a subquotient that is
    an ideal; the rank-filtration question is whether random MLWE modules
    expose such subquotients through cheap projections. The census is
    finite at toy scale: enumerate phi from a frozen bounded-height set,
    test O_K-closure of phi(M) exactly (multiplication by every ring
    basis element maps the subquotient to itself), and on certified
    subquotients run classical log-unit decoding with a planted-or-random
    short element. Lossy projection: phi itself — a mechanism surviving
    every phi is module-level and mislabelled as rank-1; one surviving
    specific phi localises where the structure lives. The null is the same
    census on random Z-lattices of the same total dimension (the measured
    accident rate); the nearby control is a non-cyclotomic order of the
    same degree whose unit lattice lacks the decodability structure.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        The ideal chain applies to ideals (rank-1 modules) and does not
        address module structure. Read from
        knowledge/techniques/KN-TECH-046.md.
      verified_by: knowledge/techniques/KN-TECH-046.md
    - ref: KN-LIT-054
      provenance: kb
      claim: >-
        Module-LWE interpolates plain LWE and Ring-LWE over module
        lattices of tunable rank.
      verified_by: knowledge/literature/KN-LIT-054.md
    - ref: KN-LIT-115
      provenance: kb
      claim: >-
        Log-unit decoding recovers short generators in prime-power
        cyclotomics — the certificate run on certified subquotients.
      verified_by: knowledge/literature/KN-LIT-115.md
  assumptions:
    - >-
      The frozen bounded-height functional set covers a representative
      sample of cheap projections; the enumeration bound is frozen before
      the run and its coverage stated as a limitation.
    - >-
      O_K-closure of phi(M) is decidable exactly by linear algebra over Q
      at these degrees.
    - >-
      Planted modules contain one ideal column by construction; random
      modules are MLWE-shaped (random columns, small secrets).
  predictions:
    - metric: planted_positive_control_rate
      direction: different
      minimum_effect: >-
        Rate 1.0 across shapes; below that the census instrument is broken.
    - metric: random_module_certified_subquotient_rate
      direction: lower
      minimum_effect: >-
        Rate 0 across >= 30 seeds per shape (obstruction), or the exact
        nonzero rate with its certifying phi (re-opened); one of the two
        pre-registered branches occurs.
    - metric: null_accident_rate
      direction: lower
      minimum_effect: >-
        Below 1/30 per shape; above that the closure check is too loose
        and every reading is blocked.
  minimal_test:
    design: >-
      (1) Freeze shapes (8,2), (8,4), (16,2) and the functional bound
      (height <= 2 over the dual basis). (2) Planted cells: one
      principal-ideal column with ternary generator, other columns random;
      census, record certifying phi, log-unit decode certified
      subquotients. (3) Random cells: MLWE-shaped modules, 30 seeds per
      shape, same census. (4) Null: random Z-lattices of total dimension
      16-48, same census. (5) Nearby control: same census over a
      non-cyclotomic order of degree 8 with planted ideal columns.
    controls:
      - Plain LWE of the same total dimension (the null).
      - Non-cyclotomic order of the same degree (nearby ring).
      - >-
        A planted module with the ideal column's generator drawn long (not
        ternary): closure may certify, decoding must not — separating
        certification from decodability.
    required_metrics:
      - certified-subquotient count and rate per cell with certifying phi
      - closure-check pass/fail per phi per module
      - log-unit decoding success on certified subquotients
      - the null accident rate per shape
  falsification_conditions:
    - >-
      The planted positive control fails on some planted module: the census
      does not detect the structure it was built to detect.
    - >-
      The null accident rate exceeds 1/30 per shape: the closure check
      certifies accidents and the random-module rate is uninterpretable.
    - >-
      The long-generator control decodes: certification is being scored as
      decodability and the two events are not separated.
    - >-
      The random-module rate is nonzero but every certifying phi is also
      certified on the null at the same rate: the re-opened reading is an
      accident, not structure.
  confounders:
    - >-
      The bounded functional set under-covers; the recorded rate is
      conditional on the frozen bound and the coverage limitation is
      stated.
    - >-
      At degree 8, exp(O~(sqrt(d))) overlaps polynomial factors; the
      certificate carries the ideal reading.
    - A failed closure computation is infrastructure, never evidence.
  interpretation_limits:
    - Toy shapes (kd <= 48); no transfer to any deployed parameter set or
      statement about ML-KEM, ML-DSA, Falcon, Hawk, NTRU, FrodoKEM.
    - A zero rate on random modules closes only the cheap-projection
      surface at the frozen functional bound; unbounded phi and higher
      quotients stay open.
    - Planted positives certify the instrument, not an attack.
  proof_search_map:
    bottleneck: >-
      Whether cheap rank-1 projections of random MLWE modules expose
      ideal-certified subquotients; resolving it gives a new attack surface
      through the rank-1 filtration or closes that surface at a stated
      boundary.
    baseline_embedding:
      parameter_slice: >-
        k = 1 with phi = identity reduces to the ideal cell of
        IDEA-20261005-9f4777 at the census's degrees (planted ideal,
        certificate present).
      reproduction_check: >-
        The planted k=1 sanity cell reproduces certificate=1 before any
        k >= 2 reading.
    observation_collision:
      observable: O_K-closure certification of phi(M) and decoding
        success on certified subquotients.
      distinct_preimage_search: >-
        The long-generator ideal: closure certified, decoding absent — the
        two events must separate on planted cells, or the census conflates
        algebraic shape with decodability.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Vary phi over the frozen set holding M fixed: the fiber of
          certified subquotients localises where the module's rank-1
          structure lives.
        predicted_gain: >-
          The measured certified-subquotient rate on random modules (0
          gives the named obstruction; > 0 re-opens the surface with its
          certifying phi).
    quantifier_order: >-
      For every module in the frozen cells (exists census) the rate is
      measured; the obstruction statement is 'for all tested MLWE-shaped
      modules, no cheap phi certifies a decoding-positive ideal
      subquotient' — conditional on the frozen functional bound, never on
      all phi.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the frozen shapes and functional bound, random MLWE-shaped
        modules do (or do not) expose certified ideal subquotients at the
        measured rate, with positive control and null calibrated.
      nearby_object_control: >-
        Plain-LWE null and non-cyclotomic order; readings not separating
        them certify nothing.
    proof_obligations:
      - claim: the k=1 sanity cell reproduces the ideal baseline
        responsibility: baseline
      - claim: closure check is exact linear algebra with recorded seeds
        responsibility: correctness
      - claim: certification and decodability events separate
        responsibility: strictness
      - claim: the functional bound is frozen before the run
        responsibility: scope
      - claim: 30 seeds per shape with rates and intervals recorded
        responsibility: success_probability
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen bounded-height functional set is representative of cheap
        projections: if any cheap projection certifies structure on random
        modules, one in the frozen set does with non-negligible
        probability.
      rigorous_support: >-
        No theorem; the census's stated coverage assumption, kept explicit
        so the obstruction stays conditional on the bound.
      validation_plan: >-
        Double the functional bound on one shape: the rate must be stable
        within the seed interval, or the bound-dependence is recorded as
        the reading's boundary.
    - id: H2
      statement: >-
        O_K-closure of phi(M) is decidable exactly, and log-unit decoding
        behaves on certified subquotients as on ideals of the same ring.
      rigorous_support: >-
        Closure is finite linear algebra over Q; decoding behaviour follows
        KN-LIT-115's decodability (reported) since certified subquotients
        are fractional ideals.
      validation_plan: >-
        Planted cells: certified subquotients must decode as the k=1 sanity
        cell does, or the transfer is recorded as broken.
  target_complexity:
    time_exponent: >-
      No exponent claimed. Exact linear algebra over Q at total dimension
      <= 48 plus classical log-unit decoding at ring degree <= 16 —
      seconds per cell.
    memory_exponent: negligible.
    best_known: >-
      The plain-LWE null census (accident rate) at matched total
      dimension; the ideal chain (KN-TECH-046) is the structure being
      detected, not beaten.
    hidden_overhead: >-
      The frozen functional bound is the hidden surface; the obstruction
      is conditional on it and the coverage limitation is stated.
    tradeoff_note: none proposed.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP question; no ECDLP known-results row covers module
      subquotient censuses.
    nearest:
      - ref: KN-TECH-046
        provenance: internal
        relation: adjacent
        delta: >-
          The chain's objects are ideals (rank-1); this census measures
          whether random modules expose such objects through cheap
          projections, which the technique note leaves open.
      - ref: KN-LIT-054
        provenance: kb
        relation: generalizes
        delta: >-
          The module framework interpolates ring and plain settings; this
          adds the census instrument testing whether the rank-1 end of the
          filtration is attackable from the module side.
  dominated_by: >-
    Baseline named: the plain-LWE null census (accident rate) at matched
    total dimension, and the k=1 ideal baseline (IDEA-20261005-9f4777's
    cell at the census's degrees). No attack over either is claimed.
  sota_delta: >-
    Not an attack claim. Separator: the certified-subquotient rate on
    random MLWE-shaped modules (0 with the seed interval, or the exact
    nonzero rate with its certifying phi) at the frozen shapes and
    functional bound — the first measured reading of the rank-1-filtration
    surface RQ-QLWE-9108dc names.
