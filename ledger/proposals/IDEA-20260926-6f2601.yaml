idea:
  id: IDEA-20260926-6f2601
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE TORUS ROW OF KN-OPEN-095df5 PRICED AS A CERTIFICATE WITH NUMBERS,
    131 divides Phi_k(2) exactly when k = 130 x 131^j, so every F_2-torus with
    a rational point of order 131 has dimension >= phi(130) = 48 and T_130
    attains it; and a translation-stable function space on ANY commutative
    group gives a Frobenius-stable F_2-subspace of F_(2^131), hence one of the
    four of IDEA-20260918-9abf42, with the degree-1 torus base being exactly
    the trace-zero hyperplane and a non-stable space giving an orbit union
    that costs >= 17030 F_2-unknowns per slot more than KN-FIND-47da4e's
    parameterisation

  class: control

  claim: >-
    CEILING FIRST. A certificate for one row of RQ-BINSTD-b6f698's table. No
    arity m, no per-attempt oracle budget, no row of the product-law table
    moves; nothing touches ECC2K-130's curve or rho (2^60.8). Question owner
    by the R2 rule, structural certificate.
    PART 1, WHICH k (exact, zero compute). For a prime p and integer a with
    p not dividing a, p | Phi_k(a) if and only if k = p^j ord_p(a) for some
    j >= 0 (standard lemma on prime divisors of cyclotomic values, recalled;
    the j = 0 case is "p | Phi_k(a) with p not dividing k iff ord_p(a) = k").
    With p = 131, a = 2 and ord_131(2) = 130 (IDEA-20260918-9abf42 part C:
    2^65, 2^26, 2^10 are 130, 53, 107 mod 131), the set is {130, 17030,
    2230930, ...} and the Euler values are phi(130) = 1 x 4 x 12 = 48,
    phi(17030) = 48 x 130 = 6240, and so on. FALSIFIER, stated before any
    run: a k with 131 | Phi_k(2) and phi(k) < 48.
    PART 2, THE ORDER OF T_130(F_2) RE-DERIVED. Phi_130(2) = prod over d | 130
    of (2^d - 1)^mu(130/d) = (2^130 - 1)(2^13 - 1)(2^5 - 1)(2^2 - 1) /
    ((2^65 - 1)(2^26 - 1)(2^10 - 1)(2 - 1)) = (2^65 + 1) x 8191 x 31 x 3 /
    (8191 x 8193 x 1023) = (2^65 + 1) / (8193 x 11) = 36893488147419103233 /
    90123 = 409368176241571, the value KN-OPEN-095df5 quotes (cross-check
    409368176241571 x 90123 = 36893488147419103233 = 2^65 + 1). Then
    409368176241571 = 131 x 3124947910241 and 3124947910241 = 131 x
    23854564200 + 41, so 131 divides #T_130(F_2) exactly once and the
    order-131 subgroup T is unique and cyclic.
    PART 3, WHY 48 IS A LOWER BOUND OVER ALL TORI, NOT JUST CYCLOTOMIC ONES.
    For an F_2-torus T of dimension d, #T(F_2) = f_T(2) where f_T is the
    characteristic polynomial of Frobenius on the character lattice X*(T), a
    product of cyclotomic polynomials Phi_(k_i) with sum phi(k_i) = d
    (recalled; sanity checks G_m gives 2 - 1, the Weil restriction of G_m from
    F_4 gives 2^2 - 1, the norm-one torus of F_4/F_2 gives 2 + 1). So 131 |
    #T(F_2) forces some k_i in {130 x 131^j} and d >= 48, attained by T_130
    (X*(T_130) = Z[x]/Phi_130(x), rank 48). The dimension-130 Weil restriction
    R = Res_(F_(2^130)/F_2) G_m also carries T, since #R(F_2) = 2^130 - 1 is
    divisible by 131, and is the simpler ambient group for the toy below.
    PART 4, THE LEMMA THAT PRICES THE MEMBERSHIP CONDITION (exact; the one
    new algebraic statement of this record). Setting, as GGMP section 4.2
    relays it: G a commutative algebraic group over F_2, T a rational subgroup
    of order 131 generated by t, I the quotient isogeny G -> G/T, a in
    (G/T)(F_2) with fibre I^(-1)(a) a single Frobenius orbit, b a point of the
    fibre, so sigma(b) = b + t where sigma is the 2-Frobenius; then b is in
    G(F_(2^131)). LEMMA L. Let W be a finite-dimensional F_2-space of
    F_2-rational functions on G regular on the fibre with tau_t^* W = W
    (translation by t preserves W). Then ev_b(W) = {f(b) : f in W} is an
    F_2-subspace of F_(2^131) stable under Frobenius, hence (IDEA-20260918-
    9abf42 part C) it is 0, F_2, the trace-zero hyperplane T_0 or F_(2^131).
    PROOF. ev_b is F_2-linear. For f in W, f(b)^2 = f(sigma b) because f has
    F_2 coefficients, and f(sigma b) = f(b + t) = (tau_t^* f)(b) with
    tau_t^* f in W. So ev_b(W) is a Frobenius-stable F_2-subspace, and the
    four-element list is 9abf42's theorem at n = 131. QED.
    CONSEQUENCE FOR TORI (exact). Translation by t acts on a character chi of
    a torus by the scalar chi(t), so every span of characters, in particular
    every space defined by a bound on monomial degree in the ambient
    coordinates, is tau_t-stable; Lemma L applies to every such filtration.
    Degree 1 computed out on R (and on T_130 by restriction): W_1 = {x ->
    Tr(c x) : c in F_(2^130)}, ev_b(W_1) = {Tr_(F_(2^17030)/F_(2^131))(c b)}
    is the image of an F_2[t]-module map out of F_(2^130) = F_2(t), a simple
    module, so it is 0 or of dimension 130, it is nonzero by nondegeneracy of
    the trace form, and it is annihilated by m_t(sigma) = Phi_131(sigma) whose
    kernel is T_0. So THE DEGREE-1 TORUS BASE AT n = 131 IS EXACTLY THE
    TRACE-ZERO HYPERPLANE, 2^130 elements, no size control; every higher
    character-degree filtration gives T_0 or everything; and the fraction
    shape g(b)/h(b) over a tau_t-stable W gives all of F_(2^131), because
    every z is a ratio of two trace-zero elements (the map y -> (Tr y, Tr zy)
    has a kernel of dimension >= 129).
    CONSEQUENCE FOR THE NON-STABLE SHAPE (exact). If W is not tau_t-stable,
    the Frobenius closure of ev_b(W) is the union over j < 131 of
    ev_b(tau_(jt)^* W) = the union of sigma^j(V) for V = ev_b(W): a Frobenius
    orbit union of an ordinary subspace, which is precisely the object
    KN-FIND-47da4e parameterises as (representative, shift) with a 131-way
    one-hot shift per slot and measures cost-neutral at m = 2 (toy tier,
    unverified). The group can only add an ALGEBRAIC description of the same
    set, and on T_130 that description costs, per factor-base slot, the
    coordinates of a torus point b_j in F_(2^131): 130 unknowns in the ambient
    Weil restriction, 82 norm equations cutting out T_130 (norms to the
    subfields of degrees 65, 26, 10 with inclusion-exclusion 65 + 26 + 10 -
    13 - 5 - 2 + 1 = 82, of degrees 2, 5, 13) and 48 fibre equations (a basis
    of the index-131 sublattice Lambda' = (x - 2) Lambda + 131 Lambda of
    Lambda = Z[x]/Phi_130, which is the character lattice of T_130/T since
    Phi_130(2) = 0 mod 131 makes x -> 2 a well-defined map Lambda -> Z/131
    whose kernel is Lambda'); after Weil descent to F_2 that is >= 130 x 131
    = 17030 F_2-unknowns per slot, against 131 one-hot bits (7.03 bits of
    branching) for the direct parameterisation of the same set. THE NUMBER
    FOR THE ROW: +17030 unknowns per slot for no change of set.
    THE CERTIFICATE, IN ONE SENTENCE. At n = 131 over F_2 the torus row is
    either one of the four Frobenius-stable subspaces (every character-
    support filtration; degree 1 gives T_0 exactly) or the orbit union of an
    ordinary subspace already available without the group at zero extra
    cost; the minimal torus has dimension 48 and its group law contributes
    only a 17030-unknown-per-slot description of a set that needs 131 bits.
    THE OUTCOMES. (A) The zero-run script confirms {k <= 20000 : 131 |
    Phi_k(2)} = {130, 17030}, the factorisation of Phi_130(2), and the toy
    n = 17 instance of Lemma L (below) returns a Frobenius-stable image of
    dimension 8 equal to ker m_t(sigma): the row is recorded as a certificate
    with the numbers above. (B) The toy image is not Frobenius-stable, or has
    a dimension outside the subset-sum set {0, 1, 8, 9, 16, 17}: Lemma L's
    hypotheses (in particular sigma(b) = b + t on the fibre) are wrong as
    stated and the record is withdrawn before anything cites it. (C) A k with
    131 | Phi_k(2) and phi(k) < 48 appears: the standard lemma of Part 1 was
    misremembered and Parts 3 to 4 are re-derived from the corrected set.

  mechanism: >-
    OBJECT FRAME. Representation: elements of F_(2^131) as values f(b) of
    F_2-rational functions on a torsor fibre of a commutative group over F_2
    (a KN-OPEN-020 implicit-membership description). Operation set Sigma:
    translation by the generator t of the order-131 subgroup, which under the
    torsor identification IS the 2-Frobenius of F_(2^131); the lossy-
    projection test against this Sigma is the content of Lemma L: the
    Frobenius-stable F_2-subspaces of F_(2^131) are the block systems of
    <sigma> that are also subspaces, and there are four (IDEA-20260918-
    9abf42; IDEA-20260901-863e36 for the block-system reading). TRICHOTOMY:
    coordinate-dependent as a base description, since the base is defined
    through the coordinates of b; no branching object is proposed. This is
    a certificate and forces no class beyond that.
    FACTOR-BASE ESCAPE CHARGED (for the only surviving shape). Description:
    the torus point b_j per slot (130 unknowns, 82 + 48 equations before
    descent). Membership: 131 linear tests of dimension dim V (the direct
    route) or the algebraic system above (the torus route). Relation and
    descent: the direct route is KN-FIND-47da4e's (representative, shift)
    system, measured at ratio 1.00 to 1.47 against gauge-fixed subspace
    systems at n <= 23, m = 2; the torus route adds 17030 F_2-unknowns per
    slot and can only be slower. Time and memory: not priced further because
    the set is unchanged.
    REPRESENTATION CLASS. R1 of RQ-ECDLP-623a32 for the eventual factor base
    (x-coordinates in a union of subspaces); the stage whose charge changes
    is factor-base membership, and it changes upward.
    OFF-LIMITS COMPONENTS NAMED. Frobenius-stable subspaces at 131
    (IDEA-20260918-9abf42) and the Couveignes-Lercier closure of
    KN-OPEN-095df5 are used as components; what is added is Lemma L, which
    shows the second reduces to the first for every translation-stable
    filtration on any commutative group, and the numbers 48, 82, 48, 17030.
    THE TOY INSTANCE OF LEMMA L (near-zero-run, pure Python). n = 17,
    ord_17(2) = 8, G = Res_(F_(2^8)/F_2) G_m (dimension 8, #G(F_2) = 255 =
    15 x 17), t of order 17 in F_(2^8)^*. Work in F_(2^136) = F_(2^8) F_(2^17)
    (experiments/EXP-CERTBIN-e94b27/impl/gf2n.py or a 40-line GF(2^n) class).
    The automorphism trivial on F_(2^8) and Frobenius on F_(2^17) is
    Frob^120 (120 = 0 mod 8, 120 = 1 mod 17). Solve b^(2^120 - 1) = t for b
    in F_(2^136)^*: solvable because the image of that power map has index
    gcd(2^120 - 1, 2^136 - 1) = 2^8 - 1 = 255 and t^((2^136 - 1)/255) = 1
    since (2^136 - 1)/255 = sum of 256^i for i < 17 = 17 = 0 mod 17. Compute
    V = {Tr_(F_(2^136)/F_(2^17))(c b) : c in F_(2^8)}, an F_2-subspace of
    F_(2^17). PREDICTED: dim V = 8, V is Frobenius-stable, and V = ker
    m_t(sigma) where m_t is the degree-8 minimal polynomial of t over F_2 (one
    of the two irreducible factors of Phi_17). CONTROLS: replace b by a random
    element of F_(2^136)^* (no torsor relation) and predict V NOT Frobenius-
    stable in general; replace t by an element of order 15 (not a subgroup of
    prime order n) and predict a stable image again but of a dimension in the
    subset-sum set of the factor degrees of x^17 - 1 only if the relation
    still holds, which it does not since 15 does not divide 17 (a null of the
    "prime order n" hypothesis). The same script at n = 131 (F_(2^17030)
    arithmetic, still cheap) predicts dim V = 130 and V = T_0.

