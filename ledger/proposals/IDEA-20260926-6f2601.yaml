  citation_note: >-
    Couveignes-Lercier is unread in this program. Lemma L is proved here from
    the torsor relation sigma(b) = b + t as GGMP relays it; whether their own
    smoothness basis on a torus is of the form ev_b(W) with W translation-
    stable (which the lemma then settles) or of the non-stable form (which
    reduces to an orbit union) is a statement about their text, carried as a
    scope proof obligation. Two number-theoretic facts are recalled and each
    is tested by the zero-run script on the range it uses.

  assumptions:
    - >-
      The torsor relation sigma(b) = b + t with t generating T, i.e. the
      fibre over a is a single Frobenius orbit of length 131 (GGMP's setting
      as relayed). If a fibre splits into shorter orbits the points are in a
      smaller field and the construction does not produce F_(2^131) at all.
    - >-
      "Functions" means F_2-rational functions regular on the fibre; sections
      of a non-trivial line bundle are not functions, which is why abelian
      varieties escape only through ratios (the fraction shape).
    - >-
      The dimension count 82 for T_130 inside its Weil restriction uses the
      standard description of the cyclotomic torus as the intersection of the
      norm-one kernels to the maximal proper subfields (degrees 65, 26, 10);
      the fibre equations are counted as 48 by the rank of Lambda', not by
      their degree, which is left unpriced.

  proof_search_map:
    bottleneck: >-
      Whether the torus row can be closed by an exact argument at all
      (Lemma L plus the four-subspace count) rather than by cost recall; and
      the single number that survives, the extra unknowns per slot of the
      algebraic description of an orbit union.
    baseline_embedding:
      parameter_slice: >-
        n = 17 with G = Res_(F_(2^8)/F_2) G_m, where the stable-subspace
        lattice is rich (8 subspaces, dimensions {0, 1, 8, 9, 16, 17}) and the
        lemma predicts a specific one, ker m_t(sigma), of dimension 8.
      reproduction_check: >-
        The toy computation above; a Frobenius-stable image of dimension 8
        equal to ker m_t(sigma), with the random-b null NOT stable.
    observation_collision:
      observable: >-
        The set {k : 131 | Phi_k(2)}, the factorisation of Phi_130(2), the
        image ev_b(W_1) and its dimension and Frobenius-stability.
      distinct_preimage_search: >-
        A stable image of dimension 8 at n = 17 could arise from a b that
        happens to satisfy a different relation; the random-b null and the
        order-15 null separate "torsor relation" from "accident". At n = 131
        the only stable subspace of dimension 130 is T_0, so no collision.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Lemma L, replacing "no degree bound is known" by "the base is a
          Frobenius-stable subspace or a Frobenius orbit union of one".
        predicted_gain: >-
          The torus row becomes a certificate with numbers (48; T_0; 17030 per
          slot) instead of prose.
    quantifier_order: >-
      FOR ALL commutative algebraic groups G over F_2, all rational subgroups
      T of order 131, all torsor fibres and all tau_t-stable finite-
      dimensional F_2-spaces W of F_2-rational functions regular on the fibre,
      ev_b(W) is one of four subspaces (Lemma L). FOR ALL F_2-tori T, 131 |
      #T(F_2) implies dim T >= 48 (Part 3). THERE EXISTS a torus of dimension
      48 with a rational point of order 131 (T_130).
    method_ceiling:
      strongest_certifiable_claim: >-
        The certificate sentence of the claim block. It does not certify
        anything about NON-stable W beyond the orbit-union reduction, and it
        does not price the fibre equations' degree.
      nearby_object_control: >-
        The n = 17 toy with its two nulls, and the n = 131 instance of the
        same script predicting T_0.
    proof_obligations:
      - claim: Lemma L's proof (three lines above) is correct and its hypothesis matches GGMP's setting.
        responsibility: correctness
      - claim: 'The set {k <= 20000 : 131 | Phi_k(2)} equals {130, 17030}.'
        responsibility: correctness
      - claim: Phi_130(2) = 409368176241571 = 131 x 3124947910241 with 131 not dividing the cofactor.
        responsibility: correctness
      - claim: The toy image at n = 17 has dimension 8, is Frobenius-stable and equals ker m_t(sigma).
        responsibility: baseline
      - claim: Couveignes-Lercier's torus smoothness basis is of the form ev_b(W) for a translation-stable W, or else of the non-stable form; the paper must be read to place it.
        responsibility: scope
      - claim: The 82 + 48 equation count for T_130 and its fibre is right (rank count only).
        responsibility: size

