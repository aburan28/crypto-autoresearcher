  minimal_test:
    design: >-
      Script analysis/couveignes-lercier-131/torus_row.py, pure Python. (1)
      For k <= 20000 compute Phi_k(2) exactly by the Moebius product over
      2^d - 1 and report those divisible by 131 with phi(k). (2) Report
      Phi_130(2), its 131-adic valuation and the 2^65 + 1 cross-check. (3)
      The n = 17 toy of Lemma L with its two nulls (10 random b, 10 random t
      of order 15), reporting dimension, stability and equality with ker
      m_t(sigma) for each of the two degree-8 factors. (4) The n = 131
      instance on the Weil restriction, reporting dimension 130 and equality
      with T_0. Cell: no curve; fields F_(2^136) and F_(2^17030). Instrument:
      gf2n.py from experiments/EXP-CERTBIN-e94b27/impl/ or a self-contained
      class. Metrics with units: set of k (list), valuation (integer),
      dimensions (integer), stability (boolean), null outcomes (counts).
      Falsification thresholds stated before the run: any k with phi(k) < 48;
      any toy image unstable or of dimension outside {0, 1, 8, 9, 16, 17};
      n = 131 image of dimension other than 130. Cost: seconds to a minute
      (estimate).
    controls:
      - >-
        Random-b null (no torsor relation) predicted NOT Frobenius-stable.
      - >-
        Order-15 null (t not of prime order n) as a hypothesis check.
      - >-
        Modulus swap: the same script with 131 replaced by 17 must return
        {8, 136, 2312, ...} intersected with k <= 20000, i.e. {8, 136, 2312},
        matching ord_17(2) = 8.
      - >-
        Relabelled control for the toy: the result is basis-free by
        construction; a change of the F_2-basis of F_(2^17) must leave
        dimension and stability unchanged (a trivial but stated invariance).
    required_metrics:
      - 'set of k with 131 | Phi_k(2), with phi(k)'
      - 'v_131(Phi_130(2))'
      - 'dim ev_b(W_1), Frobenius-stability, equality with ker m_t(sigma), at n = 17 and n = 131'
      - 'null outcomes'

  falsification_conditions:
    - 'A k <= 20000 with 131 | Phi_k(2) and phi(k) < 48: Part 1 is wrong and the dimension bound 48 falls.'
    - 'The n = 17 toy image is not Frobenius-stable or its dimension is outside the subset-sum set: Lemma L or its hypothesis is wrong; the record is withdrawn.'
    - 'The n = 131 image has dimension other than 130: the degree-1 computation is wrong.'
    - 'An explicit tau_t-stable W on some G/F_2 at n = 131 with 2 <= dim ev_b(W) <= 129: contradicts a theorem (9abf42 C), so it would locate an error in the torsor relation as used here.'
    - 'A torus description of an orbit union with fewer than 131 F_2-unknowns per slot: the pricing is wrong.'

  confounders:
    - >-
      At n = 17 the image could be stable of dimension 8 by accident for a
      random b with small probability; the nulls quantify this (predicted
      rare) and the equality with ker m_t(sigma) is the sharper check.
    - >-
      Lemma L needs W to consist of functions; a construction using sections
      of a line bundle on an abelian variety is outside it and is handled by
      the census record, not here.
    - >-
      The Couveignes-Lercier text may define the torus smoothness basis in a
      way that is neither ev_b(W) nor its Frobenius closure; that would be a
      scope failure of this record, disclosed as a proof obligation.

