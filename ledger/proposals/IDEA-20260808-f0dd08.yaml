idea:
  id: IDEA-20260808-f0dd08
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: The component-dominance inequality n/o < 2 + (k-1)/2 decides which intersection order
    k binds against a UOV key, and plain UOV's published n/o ~ 2.55 sits a hair above the
    k=2 threshold of 2.5 -- so the baseline every sibling scheme is measured against is set
    by a margin of 0.05 that nobody in this program has computed
  class: measurement
  claim: 'DERIVED THIS SESSION, dimension counting only. For a UOV key with n variables, m
    = o equations and oil space O of dimension o, consider the k-tuple system asking for (x_1..x_k)
    with P_a(x_i) = 0 for all a,i and P''_a(x_i,x_j) = 0 for all a and i<j. Its solution set
    contains O^k of dimension k*o. The "junk" locus has expected dimension k(n-o) - C(k,2)
    o. The oil component DOMINATES iff k*o > k(n-o) - C(k,2) o, i.e. iff n/o < 2 + (k-1)/2.
    For k=2 the threshold is exactly 2.5; for k=3 it is 3; for k=4, 3.5. CLAIM: (i) published
    plain-UOV parameters sit just ABOVE the k=2 threshold (RECALLED uov-Ip (q,n,m)=(256,112,44)
    gives n/o = 2.545), so the k=2 intersection system''s solutions are dominated by junk
    and the attack must pay for it, whereas k=3 puts the oil component back on top; (ii) the
    binding attack order k* is therefore the smallest k with n/o < 2 + (k-1)/2, and the published
    cost model must be evaluated at k*, not at k=2; (iii) at toy cells straddling the threshold
    the measured fraction of solutions lying in O^k jumps from ~q^{-(k(n-o)-C(k,2)o-ko)} to
    ~1 as n/o crosses 2 + (k-1)/2. This is the calibration GOAL-UOV-001 asks for, expressed
    as one inequality that MAYO, QR-UOV and SNOVA can all be evaluated against with the same
    convention.'
  mechanism: The intersection attack's cost is (cost of solving the k-tuple system) times
    (inverse probability that a found solution is an oil tuple). The second factor is invisible
    in a pure solving-degree estimate and is exactly what the dominance inequality controls.
    When the junk component dominates, a solver returns junk and the attack pays q^{junk excess};
    when the oil component dominates, the first solution found is already an oil tuple. The
    inequality is pure expected-dimension bookkeeping and needs no genericity beyond Krull
    for the lower bound.
  why_not_a_renamed_known_approach: 'Nearest known method: Beullens'' intersection attack,
    which introduces exactly this k and chooses it. The difference is that the published choice
    is normally justified by system shape (equations vs unknowns), whereas this record justifies
    it by COMPONENT DOMINANCE, which is a different criterion and can select a different k.
    Nearest internal record: IDEA-20260805-ca92fd derives the k=2 system from the oil space
    and measures its solving degree against a planted null; it fixes k=2 and never asks which
    k dominates.'
  predictions:
  - observable: n/o for every published parameter set in the slice, with the induced k*
    metric: rational number and integer k*
    predicted: 'RECALLED: uov-Ip n/o = 2.545 -> k* = 3; MAYO underlying maps n/o ~ 8-10 ->
      k* >= 15; SNOVA flattened n/o = 5.8 -> k* = 9; QR-UOV flattened n/o ~ 3.9 -> k* = 5.
      Any published set with n/o < 2.5 would be immediately k*=2 and is not expected.'
  - observable: fraction of solutions of the k-tuple system lying in O^k, at toy cells with
      n/o swept across 2 + (k-1)/2
    metric: fraction in [0,1]
    predicted: 'A sharp transition at the threshold: below it, fraction -> 1; above it, fraction
      decays like q^{-(k(n-o) - C(k,2) o - k o)}. A fraction that does not move as n/o crosses
      the threshold falsifies the criterion.'
  - observable: certified toy oil-space recovery cost at k = 2 vs k = k*
    metric: field operations and peak memory in field elements, both recorded
    predicted: k = k* strictly cheaper in total charged cost at cells above the k=2 threshold.
      If k=2 wins anyway, the dominance criterion is not the binding consideration and the
      record says so.
  minimal_test: 'Toy, certified. Cells (q,n,m=o) = (16,10,4) [n/o=2.5], (16,11,4) [2.75],
    (16,12,4) [3.0], (16,13,4) [3.25], each with 20 keys. For k = 2 and k = 3: build the k-tuple
    system, solve it to completion, count solutions, and classify each as in O^k or junk using
    the KNOWN secret (this is a calibration experiment, so the secret is available and its
    use is declared). Record the fraction in O^k, the solving degree, the field-operation
    count and the peak Macaulay matrix size in field elements. Emit, for at least one cell,
    a CERTIFICATE: a recovered oil vector x with P_a(x) = 0 for all a, re-verified by an independent
    checker.'
  controls:
  - 'RANDOM NULL: a random system of m quadratics with a planted o-dimensional isotropic subspace,
    same (q,n,m,o). The dominance transition must appear there too -- it is a property of
    the dimensions, not of UOV -- and if it does NOT, the measurement is wrong.'
  - 'NO-PLANT NULL: a uniformly random system with no isotropic subspace. Fraction in O^k
    must be undefined/zero at every cell.'
  - 'THRESHOLD-SWEEP CONTROL: the fraction must move monotonically with n/o. A fraction that
    is flat across the sweep is the canonical artifact tell.'
  - 'SOLVER-LINEAGE CONTROL: repeat one cell with a second solver implementation; solving
    degree must agree exactly (it is an integer), operation counts need not.'
  confounders:
  - Expected dimensions are not actual dimensions at toy sizes; a component can be missing
    or larger. Saturating the ideal by I(O^k) and taking the dimension of the quotient measures
    the junk directly and is the defence.
  - The k-tuple system has an obvious GL_k(F_q) symmetry (any invertible combination of the
    x_i is again a solution), which inflates solution counts by |GL_k| and must be quotiented
    before fractions are compared.
  - At larger k the system size grows as k*n variables, so the solve cost can swamp the dominance
    gain; total charged cost, not solving degree, is the deciding metric.
  - Toy o = 4 is far from published o = 44; the transition's sharpness may be a small-o artifact.
  falsification_conditions:
  - The fraction in O^k does not respond to n/o across the sweep.
  - k = k* is not cheaper than k = 2 in total charged cost at any cell above the threshold.
  - The saturation measurement shows junk dimension differing from k(n-o) - C(k,2) o at every
    cell.
  interpretation_limits: Toy scale, declared as such (AGENTS.md rule 7). The deliverable is
    a calibrated criterion plus certified recoveries at o = 4, not a cost for o = 44. The
    record deliberately uses the secret key to classify solutions; that is legitimate for
    calibration and illegitimate for any attack claim, and the distinction is recorded in
    the run package.
  assumptions:
  - Krull's height theorem bounds junk component dimension from below (rigorous).
  - m = o for plain UOV (definitional).
  - Published parameter tuples as RECALLED; to be replaced by spec reads.
  heuristic_assumptions:
  - id: HA-1
    statement: The junk locus of the k-tuple system has dimension exactly k(n-o) - C(k,2)
      o, uniformly for 2 <= k <= 4 and 2 <= n/o <= 4.
    rigorous_ingredient: Krull's height theorem gives dimension at least that value; the equations
      are k*m + C(k,2)*m in k*n variables, so the count is exact for a regular sequence.
    distribution_imitated: '"The non-oil part of the k-tuple system behaves like a regular
      sequence" -- the same imitation behind semi-regularity in every published UOV estimate.'
    validation_route: At each toy cell, saturate the ideal by I(O^k) and compute the dimension
      of the quotient exactly, for 20 keys. Compare against the predicted integer. TOY SCALE.
    tail_checks: Report the maximum observed junk dimension; a systematic excess of even 1
      shifts the threshold and must be propagated into the k* table rather than averaged away.
  target_complexity:
    time_exponent: No new attack. The claim is that the published cost must be evaluated at
      k*, and the correction is the factor q^{k(n-o) - C(k,2)o - ko} that the k=2 accounting
      omits when the junk dominates. At RECALLED uov-Ip with k=2 that exponent is 2(112-44)
      - 44 - 88 = 4, so a factor q^4 = 2^32 -- material, and in the DEFENDER's favour, which
      is the honest direction.
    memory_exponent: The k-tuple solve's memory is its Macaulay matrix, binom(kn + d, d) field
      elements, and grows with k; moving from k=2 to k=3 raises memory substantially, which
      is why the experiment records peak matrix size and not just time.
    best_known_baseline: The published UOV key-recovery row (RECALLED ~2^143 for uov-Ip) and
      Beullens' intersection-attack cost at its chosen k.
    hidden_overhead_disclosure: The correction factor assumes the solver returns a UNIFORM
      solution; a solver with a term-order bias may return oil solutions preferentially, which
      would erase the factor. This is a real and unquantified overhead and is stated.
    time_memory_tradeoff: Larger k trades memory for a better dominance ratio; the record's
      table reports the (time, memory) pair per k so the tradeoff is visible rather than optimised
      away.
  sota_delta: 'No attack. Quantitatively: a correction factor of q^{4} = 2^{32} at RECALLED
    uov-Ip in the defender''s favour if the k=2 accounting is what the spec uses, or zero
    if the spec already evaluates at k*. Either outcome is a calibrated baseline, which is
    what GOAL-UOV-001 wants.'
  dominated_by: 'As an attack: n/a (no result claimed). As a calibration: not dominated by
    any corpus record. Frontier rows checked -- IDEA-20260805-ca92fd (k=2 solving degree vs
    planted null), IDEA-20260805-69af7c (memory charging), IDEA-20260805-74349c (compression
    identity), IDEA-20260807-b63f08 (the missing shared KN-TECH baseline), IDEA-20260801-014
    (toy calibration). None computes the dominance threshold or selects k.'
  estimated_cost: 'Implementation medium: a k-tuple system builder, an ideal-saturation call,
    a certificate checker. Compute medium: 4 cells x 20 keys x 2 values of k, minutes to hours
    each at o = 4.'
  recommended_priority: high
  honest_prior_of_survival: 'The inequality is elementary and near-certainly correct (~0.95).
    That published UOV sits just above the k=2 threshold: ~0.8 given RECALLED tuples. That
    the correction is material rather than already in the published model: ~0.4. That the
    experiment yields a usable shared baseline regardless: ~0.9.'
