  fixture_identity_equation_v4:
    schema: crypto.autoresearch.identity_inclusive_curve_check.v2
    status: prospective_not_executed
    frozen_point_encoding:
      schema_id: toy-affine-or-infinity-16-v1
      width_bytes: 16
      byte_order: little_endian
      infinity_hex: ffffffffffffffffffffffffffffffff
      affine_layout: u64_x_then_u64_y
      affine_canonicality: '0<=x<p and 0<=y<p; all toy fields satisfy p<2^32.'
      rejection_rules:
        - Exactly the all-ff 16-byte word is infinity.
        - A partial sentinel, coordinate at least p, wrong width, or noncanonical integer is invalid.
        - No affine encoding can equal infinity because both affine coordinates are below p.
    branch_semantics:
      identity: >-
        If both u64 words are the sentinel, record is_identity=1 and
        on_curve=1. Decode no affine coordinate. Execute the constant-budget
        arithmetic slots on masked zeros, charge them, and ignore their equation result.
      affine: >-
        If neither word is sentinel, require canonical x and y, read A and B,
        compute y2=y^2, x2=x^2, x3=x2*x, Ax=A*x,
        rhs=x3+Ax+B, compare y2=rhs, and record is_identity=0 plus the result.
      invalid_mixed: >-
        If exactly one u64 word is sentinel, invalidate before the equation.
      constant_budget_rule: >-
        Every enumerated check receives two field multiplications, two field
        squarings, two field additions, one field equality, two sentinel
        comparisons, one branch decision, one serialization round trip, two
        coefficient reads, and two retained outcome bits.
