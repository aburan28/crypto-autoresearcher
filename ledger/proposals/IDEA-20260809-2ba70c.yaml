  common_unit_pareto_v4:
    status: exponent_only_abstract_schedule_comparison_not_concrete_runtime
    common_time_unit:
      unit_id: standardized-primitive-event-v1
      symbol: SPE
      definition: >-
        One SPE is one occurrence of any primitive category in the frozen
        count vector below. Every category has scalar conversion weight exactly
        one SPE. SPE is an abstract deterministic schedule-count unit; it does
        not assert that heterogeneous operations take equal nanoseconds and
        supplies no measured constant-factor comparison.
      primitive_categories_and_weights:
        - {category: group_addition_or_scalar_ladder_addition, SPE_per_event: 1}
        - {category: field_multiplication, SPE_per_event: 1}
        - {category: field_squaring, SPE_per_event: 1}
        - {category: field_addition, SPE_per_event: 1}
        - {category: field_or_point_comparison, SPE_per_event: 1}
        - {category: label_or_bucket_event, SPE_per_event: 1}
        - {category: hash_or_table_insert, SPE_per_event: 1}
        - {category: hash_or_table_probe, SPE_per_event: 1}
        - {category: join_lookup, SPE_per_event: 1}
        - {category: witness_verification_query, SPE_per_event: 1}
        - {category: serialization_or_transform_event, SPE_per_event: 1}
        - {category: SHA256_absorb_byte, SPE_per_event: 1}
        - {category: SHA256_compression_round, SPE_per_event: 1}
        - {category: SHA256_output_byte, SPE_per_event: 1}
        - {category: fixed_analysis_or_rank_event, SPE_per_event: 1}
      conversion_formula: 'W_SPE(algorithm)=sum_category event_count(algorithm,category)*1_SPE.'
      full_cost_formula: 'FC_SPE=W_SPE*(simultaneously_live_entries)^(1/3).'
      comparability_boundary: >-
        Raw and full exponent rows below share SPE and SPE*entry^(1/3),
        respectively. Nanoseconds, energy, cache misses, network time, and
        constant factors are separate unmeasured axes; no real-runtime or
        hardware dominance claim is made.
    explicit_algorithm_conversions:
      Pollard_rho_vOW: >-
        For R=N^(1/2+o(1)) walk steps, charge R group-addition events, R
        partition/hash events, and R comparison events, plus O(1) verification:
        W_SPE=3R+O(1)=N^(1/2+o(1)). Live entries are N^o(1).
      standard_BSGS: >-
        With t=ceil(N^(1/2)), charge 2t group-addition events, t hash inserts,
        t hash probes, t comparisons, and O(1) verification:
        W_SPE=5t+O(1)=N^(1/2+o(1)). Live entries are N^(1/2+o(1)).
      memory_matched_BSGS: >-
        With m=ceil(N^(1/3)) and g=ceil(N/m), charge m+g group additions, m
        hash inserts, g probes, g comparisons, and O(1) verification:
        W_SPE=2m+3g+O(1)=N^(2/3+o(1)). Live entries are N^(1/3+o(1)).
      candidate: >-
        Convert every frozen candidate group, field, label, bucket, hash,
        join, equality, witness, serialization, transform, and analysis event
        through the same unit weights. One root is N^(1/3+o(1)) SPE and
        N^(1/3+o(1)) live entries. N^(1/3-gamma_s+o(1)) independent roots give
        W_SPE=N^(2/3-gamma_s+o(1)) and
        FC_SPE=N^(7/9-gamma_s+o(1)).
    axis_units:
      raw_time: expected_standardized_primitive_events_per_target
      full_cost: expected_SPE_times_live_entries_to_one_third
      live_memory: simultaneously_live_table_entries_and_schema_derived_bytes
      data_queries: public_ECDLP_target_instances_and_group_operation_queries
      advice: reusable_instance_independent_bytes
      preprocessing: per_instance_SPE_included_in_raw_time
    pareto_rows:
      - algorithm: Pollard_rho_vOW
        raw_work_exponent: '1/2'
        raw_time_unit: SPE
        live_storage_exponent: '0'
        memory_unit: rho-state-v1_records
        entry_width_formula_bytes: '4*ceil(order_bits/8)+32'
        full_cost_exponent: '1/2'
        full_cost_unit: SPE_times_live_entries_to_one_third
        public_target_instances: 1
