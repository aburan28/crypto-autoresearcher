    sota_delta: >-
      Candidate-minus-rho exponents are 1/6-gamma_s raw and 5/18-gamma_s full,
      with +1/3 storage. Against standard BSGS, full delta is 1/9-gamma_s and
      memory delta -1/6. Against memory-matched BSGS, raw and full deltas are
