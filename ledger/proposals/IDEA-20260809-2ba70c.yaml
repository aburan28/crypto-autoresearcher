        memory_unit: bsgs-entry-v1_records
        entry_width_formula_bytes: '3*ceil(order_bits/8)+16'
        full_cost_exponent: '7/9'
        full_cost_unit: SPE_times_live_entries_to_one_third
        public_target_instances: 1
        group_operation_query_exponent: '2/3'
        external_oracle_queries: 0
        advice_bytes: 0
        reusable_preprocessing_bytes: 0
        per_instance_preprocessing_exponent: '1/3'
