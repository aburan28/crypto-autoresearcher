    completeness_assertion: >-
      Every row uses the same SPE conversion and supplies one value and unit for
      time, memory, data/query, advice, and preprocessing. No null or implicit
      zero participates in the frontier.
    dominated_by: >-
      No result is realized. At gamma_s=0 Pollard rho/vOW strictly dominates
      the candidate in SPE raw-work exponent, SPE full-cost exponent, and live
      storage exponent. Through gamma_s<=5/18 the candidate has no strict SPE
