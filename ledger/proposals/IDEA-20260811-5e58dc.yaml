idea:
  id: IDEA-20260811-5e58dc
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  title: >-
    THE CLASS EXTREMAL BUDGET: the gating lane has been asking a SIGNIFICANCE
    question ("does within-class variance beat the null?") when the
    decision-relevant quantity is an EFFECT-SIZE question, and the effect size is
    capped in closed form -- for any cost functional C with class coefficient of
    variation CV and class size h = p^{1/2+o(1)}, the entire advantage available
    from class minimisation, GIVEN A FREE MINIMISER ORACLE AND FREE TRANSPORT, is
    at most CV*sqrt(2 ln h) = CV*sqrt(ln p)(1+o(1)); so an EXPONENT gain requires
    CV = Omega(1/sqrt(log p)), and on the campaign's own committed numbers the
    m=3 decomposition rate scores 0.26 (fails) while the conductor-driven
    functional f_E scores 1.53 (passes) -- which turns C2 from an unbounded
    measurement programme into a one-line admission test computable before any
    compute is spent
  class: mechanism

  claim: >-
    (A) THE OBJECT. Let X be a complete F_p-isogeny class of ordinary curves,
    h = |X| its size, and C : X -> R_{>0} any attack-cost functional (any of the
    functionals RQ-ICINV-475b5e enumerates: Semaev/Groebner solving-degree
    proxies, first-fall degree, relation yield, factor-base decomposition
    probability, Macaulay rank profile -- and any not yet invented). Write
    mu_C = mean over X, sigma_C = standard deviation over X,
    CV_C = sigma_C / mu_C.

    (B) THE DEFINITION. The CLASS EXTREMAL BUDGET of C on X is
        B(C, X) := CV_C * sqrt(2 ln h).
    Since h = H(t^2 - 4p) = p^{1/2 + o(1)} (Kronecker class number; the campaign's
    own p = 4001, t = 30 class has h = 138 against sqrt(p) = 63.3), we have
    sqrt(2 ln h) = sqrt(ln p) (1 + o(1)), so B(C, X) = CV_C * sqrt(ln p)(1+o(1)).

    (C) THE CLAIM, IN TWO PARTS.
      (C1) UPPER BOUND ON THE PRIZE. Under HEURISTIC H1 below (the h class values
      of C behave as exchangeable draws with sub-Gaussian tails of parameter
      sigma_C), the best relative advantage obtainable by moving to the optimal
      member of the class is
          | mu_C - opt_{E in X} C(E) | / mu_C  <=  B(C, X) * (1 + o(1)),
      and this holds EVEN IF the minimiser's address is handed over for free and
      transport to it is free. It therefore DOMINATES, and does not compete with,
      the reachability accounting of IDEA-20260807-c36472 and IDEA-20260808-28361d:
      those price FINDING the minimiser; this prices the minimiser itself.
      (C2) THE ADMISSION THRESHOLD. Consequently a functional can support an
      EXPONENT gain (opt C <= mu_C * p^{-eps} for some fixed eps > 0) only if
          B(C, X) >= 1 - o(1),   i.e.   CV_C >= (1 + o(1)) / sqrt(ln p),
      and can support a constant-factor gain of size g only if
      B(C, X) >= 1 - 1/g. A functional whose class CV decays faster than
      1/sqrt(log p) is capped at a 1 + o(1) advantage and is CLOSED for
      class-minimisation purposes at every exponent, with the obstruction named:
      NAMED OBSTRUCTION (O-BUDGET) -- an isogeny class is a set of only
      p^{1/2+o(1)} objects, and the extreme of p^{1/2+o(1)} concentrated draws
      lies only sqrt(ln p) standard deviations from their mean; a functional
      whose class-conditional fluctuation is smaller than mu/sqrt(ln p) cannot
      reach an exponentially better value anywhere in the class, no matter how
      significantly its variance exceeds a matched null.

    (D) WHY THIS IS NOT A RESTATEMENT OF THE LANE'S EXISTING DECISION RULE.
    RQ-ICINV-475b5e's committed decision_target reads: "Admit a cost functional
    only if its within-class variance exceeds its matched-null variance AND the
    minimiser is reachable." Both conjuncts can hold while B(C, X) is 0.01. The
    campaign's headline within-class number is a VARIANCE RATIO (2.037 at density
    0.5306, red_team_notes.md section 4 as quoted in H-VOLC-dff1f8) -- a
    significance statistic. A variance ratio of 2.037 with CV = 0.08 is a
    statistically clear signal worth exactly a 26% constant factor, and the two
    facts are not in tension. This record supplies the missing second axis.

    (E) THE ARITHMETIC ON THE CAMPAIGN'S OWN COMMITTED NUMBERS, WHICH COSTS ZERO
    COMPUTE AND IS THE MINIMAL TEST. From H-VOLC-dff1f8 mechanism STEP 0, quoting
    red_team_notes.md section 10 for the p = 4001, t = 30 class (h = 138,
    sqrt(2 ln 138) = 3.139):
      FUNCTIONAL 1 -- decomposition_rate_m3. Committed per-level means
      0.4800 / 0.4456 / 0.4489 / 0.4411 / 0.4519 with sds
      0.0173 / 0.0430 / 0.0311 / 0.0382 / 0.0366. Taking mu ~ 0.4497 and
      sigma ~ 0.037 (the largest committed within-level sd is 0.0430; using it
      only makes the conclusion weaker in the safe direction) gives CV ~ 0.082 and
      B ~ 0.26. VERDICT: FAILS the admission threshold by a factor of ~3.8. And
      this CV is an OVERSTATEMENT, because the committed sds contain the target
      sampler's own noise; the class-intrinsic figure is smaller.
      FUNCTIONAL 2 -- the conductor f_E itself (equivalently the 2-volcano level,
      the campaign's own within-class covariate). On the same class the committed
      true level distribution is {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} with
      f_E = 2^level, i.e. f_E in {1, 2, 4, 8, 16} with those counts. Then
      mean f_E = 1533/138 = 11.11, E[f_E^2] = 21063/138 = 152.63,
      sigma = 5.40, CV = 0.486, B = 1.53. VERDICT: PASSES.
    THE TEST DISCRIMINATES on already-committed data. It is not a formula that
    passes everything or fails everything.

    (F) WHAT THIS OPENS RATHER THAN CLOSES, WHICH IS THE POINT OF FILING IT.
    (C2) is a filter on the SHAPE of the functional's class distribution, not a
    verdict on the lane. It says: stop measuring functionals that are averages
    over ~N weakly dependent events (all of the L1 list are), because averaging
    forces CV = O(N^{-1/2}) and hence B = O(sqrt(log p / p)) -> 0; and start
    looking for functionals whose class distribution is DISCRETE, HEAVY-TAILED,
    or RARE-EVENT driven. Exactly one such family is already visible in the
    campaign's own data and it is functional 2 above: quantities driven by the
    conductor f_E, which ranges over a factor of f <= 2 sqrt(p/3) inside a single
    class. IDEA-20260811-c72830 exhibits a cost-relevant functional of that shape
    (the minimal degree of an endomorphism representing the secret scalar,
    proportional to f_E) and prices it; this record supplies the threshold that
    functional must clear and shows it clears it.

  resource_label: >-
    None consumed. This record is a cost-accounting result about the SEARCH over
    an isogeny class (R4 as an index set), not an algorithm reading any resource.
    It is therefore outside the admissibility taxonomy of DECOMPOSITION.md
    section 2 by construction, and it is stated that way rather than being given
    a resource label it does not use.
  admissibility: not_applicable_no_oracle_proposed
  admissibility_argument: >-
    No oracle is invented, so RQ-GGMB-6eaabc has nothing to simulate and
    GOAL-ENDO-001 criterion C3 is satisfied vacuously for this record --
    explicitly, not by omission. KN-FIND-b7e091 is untouched: the budget bound
    would hold verbatim in a world where every one of its closed oracle classes
    were open, because it is a statement about the size of the class and the
    concentration of a real-valued functional on it, not about what an algorithm
    may query. H-ENDO-001 is likewise untouched and is not retested.

  discriminated_from:
    - >-
      IDEA-20260807-c36472 (T5 re-costed: transport is affordable at Otilde(p^{1/4}),
      identification costs h ~ p^{1/2} functional evaluations, three escape routes
      -- commonness, local detectability, cheap vertex invariant). That record
      prices FINDING the minimiser and concludes the barrier is identification.
      This record grants identification for free and prices the minimiser ITSELF.
      The two compose: if B(C, X) < 1 then all three of c36472's escape routes are
      moot for C, because the destination is not worth the trip at any price. This
      is a strictly stronger conclusion on the same lane and it is derived, not
      measured.
    - >-
      IDEA-20260808-28361d (the class is enumerable in p^{1/2+o(1)}, so T5 is the
      wrong gate). Same relationship: that record argues the gate is mis-sited;
      this record argues the PRIZE behind the gate is bounded. Neither implies the
      other, and this one applies unchanged even if class enumeration were free.
    - >-
      IDEA-20260807-0ff796 (arity-2 relation yield is an exact class invariant in
      the MEAN, obstruction O-YIELD, the relation locus is F_p-isomorphic to E).
      That record proves sigma_C = 0 for one functional at one arity in the mean.
      This record does not need sigma_C = 0: it bounds the prize for every
      functional at every arity in terms of whatever sigma_C turns out to be, and
      it is therefore the general statement of which 0ff796 is the sharpest
      special case. 0ff796's own section (E) lists "the VARIANCE and higher
      moments" as NOT closed; this record is what makes an unclosed variance
      harmless up to a stated size.
    - >-
      IDEA-20260807-0a3272 (group structure E(F_p) varies within a class as a
      candidate class-varying functional) and IDEA-20260807-1d9c5f (rational-kernel
      count of psi_ell as the only varying R5 quantity). Both PROPOSE candidate
      varying functionals. This record supplies the quantitative bar any such
      candidate must clear and computes it for two of them.
    - >-
      IDEA-20260807-34754f (nested variance-components null) and
      IDEA-20260807-6eb96b (gauge-orbit null). Those are null designs for deciding
      whether a variance is real. This record is about what a REAL variance is
      worth, and its conclusion is unchanged by which null is adopted -- which is
      also why it is immune to the H-ICINV-6c7920 sampler dispute: a p-independent
      multiplicative bias in the estimated sigma changes B by a constant and
      changes the fitted p-exponent of B not at all.

  object_first_candidate:
    established_families_off_limits: >-
      DECLARED OFF-LIMITS AS THE PRIMARY LENS for this record, per
      docs/inventor-protocol.md section 1: (i) the per-curve scalar cost
      functional compared within/between class (the ICINV family); (ii) the
      volcano level as a stratifier of that functional (the VOLC family);
      (iii) the transported instance and transport-oracle relabeling (the
      MTGT/transport family); (iv) the phi-stable factor base (the EQIC family);
      (v) the endomorphism acting as a scalar on G (closed by H-ENDO-001).
      This record's lens is none of those: it is the EMPIRICAL DISTRIBUTION of a
      functional over the class, treated as the object, with the individual
      functional values discarded.
    tracked_object: >-
      THE CLASS-CONDITIONAL DISTRIBUTION of a cost functional -- specifically the
      pair (CV_C, h) and, through it, the single scalar B(C, X). The thing
      followed through the computation is not a curve, not a point, and not a
      polynomial: it is the shape of a functional's values across the h members
      of one class.
    one_step_propagation_rule: >-
      Defined and measurable: adding one more member of the class adds one draw to
      the empirical distribution; CV_C and h both update exactly, and B updates in
      closed form. Moving to a larger prime moves h and CV_C along a fitted
      scaling law. Both propagations are arithmetic and carry no estimator beyond
      a sample standard deviation.
    newness_score: >-
      The extreme-value bound itself is textbook (sub-Gaussian maximal
      inequality). What is new TO THIS PROGRAM is its use as an ADMISSION TEST on
      the gating lane, and the observation that the lane's committed decision
      target measures a different axis entirely. Nothing external is claimed
      novel; novelty_status is unverified and the specific external check is
      named below.
    survival_score: >-
      Survives: change of functional, change of null design, change of estimator,
      change of prime, the H-ICINV-6c7920 sampler dispute, and the whole
      reachability question. Dies at: functionals whose class distribution has
      heavy or discrete tails (H1 fails -- this is the intended live branch, not a
      defect), and at classes so small that h = O(1), which does not occur for
      ordinary classes at any p of interest.

  mechanism: >-
    THE CAUSAL CHAIN, IN SIX STEPS, EACH OF WHICH IS EITHER A THEOREM OR A NAMED
    ASSUMPTION.

    STEP 1 -- THE CLASS IS SMALL, AND THAT IS A SIZE CONSTRAINT AND NOT A SEARCH
    CONSTRAINT. An ordinary F_p-isogeny class is a torsor under Cl(O) and has
    h = H(t^2 - 4p) = p^{1/2 + o(1)} members. This is the first and most important
    input: whatever "minimise the cost functional over the class" means, it is a
    minimisation over EXACTLY h values and never more. Every prior record in this
    lane reads that integer as a COST -- h evaluations are needed to find the
    minimiser. This record reads the same integer as a BUDGET -- h draws is all
    the spread the extreme can possibly exploit. It plays both roles and only one
    of them has ever been used here.

    STEP 2 -- MINIMISATION IS AN EXTREME-VALUE PROBLEM, SO THE OPERATION THAT
    MATTERS IS min OVER A FINITE SET AND NOT A HYPOTHESIS TEST. The campaign has
    been computing whether the class values of C are more dispersed than a matched
    null. But an attacker does not consume dispersion; an attacker consumes the
    single best value. The map from the class values to the attacker's prize
    therefore FACTORS THROUGH THE EXTREME, and the extreme of a finite set is
    controlled by two things and by nothing else: how many elements there are, and
    how far the values spread. That factorisation is the entire causal content of
    this record, and it is why a significance statistic and an effect-size
    statistic can point in opposite directions without either being wrong.

    STEP 3 -- CONCENTRATION CONVERTS THE PAIR (h, sigma) INTO A CEILING. If the h
    class values are sub-Gaussian at scale sigma_C about their mean mu_C
    (assumption H1, stated and measured rather than assumed away), the maximal
    inequality gives max_E |C(E) - mu_C| <= sigma_C sqrt(2 ln h) (1 + o(1)); and
    the matching lower bound for iid Gaussians shows the constant sqrt(2) cannot
    be improved, so this is a TIGHT ceiling and not merely a sufficient bound.
    Independence of the class members is not required -- only the marginal tail
    condition -- which is why the assumption bears on the SHAPE of the class
    distribution and not on any independence between curves that an isogeny class
    plainly does not have.

    STEP 4 -- THE CEILING IS DIMENSIONLESS, AND THAT IS WHY IT CAN DECIDE
    EXPONENTS. Dividing by mu_C gives the relative prize CV_C sqrt(2 ln h), and
    substituting h = p^{1/2 + o(1)} gives CV_C sqrt(ln p) (1 + o(1)). Because it
    is a RATIO it is invariant under every rescaling of the functional; under
    parallelisation, since both rho and any class-minimised variant parallelise
    linearly, so the ratio cannot be recovered by adding processors; and -- the
    property that makes it usable in THIS campaign -- under any p-INDEPENDENT
    multiplicative bias in the estimator of sigma_C. That last invariance is the
    reason the bound survives the live H-ICINV-6c7920 sampler dispute untouched: a
    constant sampler bias moves the budget by a constant and moves its fitted
    p-exponent not at all.

    STEP 5 -- THE THRESHOLD FALLS OUT OF ASKING WHAT AN EXPONENT GAIN WOULD
    ACTUALLY REQUIRE. The statement "opt C <= mu_C p^{-eps}" is the statement that
    the relative prize equals 1 - p^{-eps}, i.e. essentially 1. So an exponent gain
    requires CV_C >= (1 + o(1)) / sqrt(ln p), and a constant-factor gain of size g
    requires CV_C sqrt(2 ln h) >= 1 - 1/g. The admission test B(C, X) >= 1 is
    therefore not an invented convention or a chosen significance level: it is the
    exact condition under which the ceiling of STEP 4 is high enough to permit the
    conclusion the lane is trying to reach.

    STEP 6 -- WHY THE ANSWER SPLITS BY FUNCTIONAL SHAPE, WHICH IS THE ACTIONABLE
    OUTPUT. An AVERAGING functional -- relation yield, decomposition probability,
    coverage, any normalised count over the ~N elements of the group -- has
    CV = O(N^{-1/2}), by the same square-root cancellation that governs the Weil
    error term on the Semaev relation locus, so its budget decays like
    sqrt(log p / p) and is asymptotically zero. A functional driven by a DISCRETE
    STRUCTURAL PARAMETER -- the conductor f_E, which ranges over a factor of
    f <= 2 sqrt(p/|D_0|) inside one class -- has CV = Theta(1) and a budget above
    1. The mechanism therefore predicts, BEFORE any measurement, which of the
    lane's candidates can matter and which cannot; and the campaign's own
    committed numbers at p = 4001 instantiate both cases at once, 0.26 against
    1.53. The prediction is falsifiable in both directions: an averaging
    functional scoring above 1, or the conductor scoring below it, refutes the
    mechanism rather than the lane.

    WHERE THE MECHANISM IS GRANTED RATHER THAN ASSUMED, AND WHY THAT MAKES IT
    STRONGER RATHER THAN WEAKER. Every step above holds with the minimiser's
    address supplied free and transport to it free -- both branches of T5
    discharged at zero cost, by fiat. So the bound does not compete with the
    reachability accounting of IDEA-20260807-c36472 and IDEA-20260808-28361d; it
    sits underneath it. If the budget is below 1, discharging T5 buys nothing and
    the reachability work is unnecessary for that functional. If the budget is at
    or above 1, the T5 question becomes live again exactly as those records
    specify, and this record hands it straight to them.

  lossy_projection_identifiability_audit:
    projection: >-
      (the h-tuple of functional values on the class) -> (mu_C, sigma_C, h) ->
      the single scalar B(C, X).
    what_is_discarded: >-
      Which curve carries which value; the entire correspondence between the
      functional and the volcano level, the j-invariant, the conductor, and the
      group structure; every higher moment beyond the second; and the identity of
      the extremal member.
    is_it_only_a_change_of_coordinates: >-
      NO. The map is h real numbers -> 3 real numbers -> 1 real number and is
      massively non-injective: any two classes with the same (mu, sigma, h) have
      the same budget regardless of how their values are arranged over the
      volcano. The discarded data is discarded COMPATIBLY with the operation the
      campaign actually performs on the class, which is MINIMISATION: the extreme
      of a set is controlled by the set's spread and cardinality and by nothing
      about the labelling, so the retained pair (CV, h) propagates
      deterministically to a bound on the extreme. This is exactly the
      lossy-projection condition of docs/inventor-protocol.md section 2, and it is
      why the record can be stated before any curve is examined.
    mirror_failure_check: >-
      CHECKED, and the failure mode is real and is the live branch: the projection
      is compatible with minimisation only for distributions whose extremes are
      controlled by the second moment. For a heavy-tailed or discrete-multimodal
      class distribution the retained pair does NOT determine the extreme, the
      bound becomes vacuous in the useful direction, and the honest statement is
      that H1 has failed. That branch is not a defect in the record; it is the
      record's forward guidance, and the functional in prediction P2 is chosen
      precisely because it sits on that branch.

  null_object_control: >-
    MANDATORY AND BLOCKING, AND IT IS ARITHMETIC RATHER THAN STATISTICAL. NULL 1
    (the gauge orbit, forced-value null): compute B for the SAME curve written
    with h distinct Weierstrass models (a, b) -> (u^4 a, u^6 b). The gauge orbit
    has no isogeny-class content at all, so any budget it scores is pure
    equation-choice and every real budget must be reported net of it. NULL 2 (the
    matched random-curve set of IDEA-20260807-0ff796): B computed on h random
    ordinary curves at the same p drawn from outside the class. NULL 3 (the
    label-free null): B computed on h values drawn from the fitted null
    distribution itself, which by construction returns the sub-Gaussian value and
    is a MODE-1 control that cannot fail -- run and reported as such, never as
    evidence. THE DECAY PARAMETER IS p, NOT the factor-base size B_fb: B(C, X)
    for an averaging functional must decay as sqrt(log p / p) across a ladder of
    primes, and a budget that does NOT decay when p grows is the canonical
    artifact tell (docs/inventor-protocol.md section 3, KN-TECH-056). This is the
    control the campaign has never run, because every within-class measurement it
    owns sits at a single prime.

  assumptions:
    - >-
      [fact] Tate: the F_p-isogeny class is exactly the set of curves with a given
      characteristic polynomial of Frobenius, hence a given #E(F_p). ITS
      IDENTIFIABILITY CONSEQUENCE IS RECORDED HERE AS A CONFOUNDER RATHER THAN
      SUPPRESSED: "in this class" and "with this group order" are the SAME
      condition, so no null object can fix #E(F_p) and break class membership, and
      any functional factoring through #E(F_p) is class-invariant for a reason
      that has nothing to do with isogenies.
    - >-
      [fact] h = H(t^2 - 4p) = p^{1/2 + o(1)} up to the usual class-number
      log-factors (Kronecker class number; Siegel/Brauer for the lower bound,
      which is ineffective and is used only asymptotically and never numerically).
      The committed instance h = 138 at p = 4001 is used as the arithmetic anchor.
    - >-
      [fact] Sub-Gaussian maximal inequality: for h random variables each
      sub-Gaussian with parameter sigma, E[max_i (X_i - mu)] <= sigma sqrt(2 ln h),
      with the matching lower bound for iid Gaussians. Independence is NOT
      required for the upper bound; only the marginal tail condition is. This is
      why H1 assumes tails and exchangeability rather than independence.
    - >-
      [committed, not re-derived] The p = 4001, t = 30 per-level means and sds and
      the true level distribution {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}, quoted from
      H-VOLC-dff1f8 mechanism STEP 0 and STEP 2, which quote
      coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
      sections 4 and 10. Used as arithmetic input to (E); the run re-reads them
      from the committed artifact and terminates PREMISE-FAILED on disagreement.
    - >-
      [declared, not a fact] The identification of "advantage in the cost
      functional" with "advantage in attack cost". A 26% better decomposition rate
      is a 26% change in ONE STAGE of point-decomposition index calculus, which is
      itself dominated (KN-TECH-003, and the whole formulation is dominated by rho
      at p^{1/2}). The budget bounds the functional; converting that to an attack
      cost is a further step this record does not take.
    - >-
      [scope] claim_tier toy for every measured quantity. The DERIVATION in (B),
      (C) is scale-free arithmetic and is not a measurement, but every number in
      (E) is toy-scale and every fitted p-exponent is fitted over toy primes.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the lane's conclusion is the
      substitution of a SIGNIFICANCE statistic (variance ratio against a matched
      null) for an EFFECT-SIZE statistic (achievable relative advantage) in
      RQ-ICINV-475b5e's decision_target. Every within-class number this campaign
      has produced answers the first question. No record anywhere in the corpus
      computes the second, and the second is the one that decides whether the lane
      can move an exponent.
    baseline_embedding:
      parameter_slice: >-
        h = 1 (a class with one member, i.e. a functional evaluated on a single
        curve). There B = CV * sqrt(2 ln 1) = 0 exactly: no advantage is available
        from a class of size one, which is the correct and forced boundary value.
        Second slice: sigma_C = 0, the exact-invariance case of
        IDEA-20260807-0ff796, where B = 0 and the closure is recovered as the
        zero-variance corner of this bound. The bound therefore CONTAINS 0ff796's
        conclusion as a boundary case rather than competing with it.
      reproduction_check: >-
        SYMBOLIC AND ARITHMETIC, AND IT IS A GATE, COSTING SECONDS. (i) Recompute
        sqrt(2 ln 138) = 3.1391 and reproduce B = 0.26 and B = 1.53 for the two
        functionals of (E) from the committed numbers, to three decimals, in a
        script that reads the committed artifact rather than transcribing it.
        (ii) Verify the h = 1 and sigma = 0 boundary values symbolically. Failure
        of either is an arithmetic defect that kills the record before any
        measurement.
    observation_collision:
      observable: >-
        The scalar B(C, X) = CV_C sqrt(2 ln h).
      distinct_preimage_search: >-
        COLLISIONS ARE GUARANTEED AND MUST BE STATED. Two classes with identical
        B can differ arbitrarily in every structural respect (different D_0,
        different volcano depth, different group structures), and a functional
        whose values are randomly permuted over the class has the same B as one
        whose values track the volcano level perfectly. THE COLLISION IS THE
        CONTENT: it is exactly why B is a valid bound on the prize regardless of
        structure, and it is equally why B alone can NEVER support a positive
        claim -- a large B says a large advantage is NOT EXCLUDED, never that one
        exists. Every use of B in the affirmative direction is prohibited by this
        record. The separating condition that must accompany any positive use is
        the identity of the extremal member and its reachability, which is
        IDEA-20260807-c36472's subject and not this one's.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Replace the unbounded question "is C non-constant across the class?" by
          the bounded resource measure B(C, X) = CV_C sqrt(2 ln h), realise it by
          specialising to the campaign's already-committed p = 4001 class, and
          charge each functional against the single threshold B >= 1. Charges are
          added only over the disjoint blocks (functional, class), never pooled
          across classes, because CV and h are both class-dependent.
        predicted_gain: >-
          Encoding: exact given (mu, sigma, h); no new estimator, no new null, no
          new sampler. Completeness: the measure bounds the prize for EVERY
          functional the lane can define, including undefined ones, which is what
          makes it a lane-level rather than a functional-level result.
          Soundness: one-sided -- it can refute a functional's exponent potential
          and can never establish one. Transfer: DECLARED UNMET beyond the primes
          measured; the sqrt(ln p) factor is asymptotic and the h = p^{1/2+o(1)}
          input is asymptotic, so numerical statements are toy-scale.
          Cost: zero compute for (E); one class enumeration per rung of the prime
          ladder for the decay test.
      - transform: observable_fiber
        proposed_object: >-
          Hold B fixed and vary the shape of the class distribution: compare an
          averaging functional (decomposition rate) against a conductor-driven
          functional (f_E) at matched B, and exhibit the intrinsic invariant that
          separates them -- the ratio of the observed extreme to the sub-Gaussian
          prediction, which is ~1 for the first and materially below 1 for the
          second because f_E's distribution is discrete and geometric rather than
          concentrated.
        predicted_gain: >-
          Turns "H1 might fail" from a caveat into a measured quantity with its own
          reported value, and identifies the shape class that the lane should be
          hunting.
    quantifier_order: >-
      CLAIMED IN THIS ORDER: FORALL primes p, FORALL ordinary F_p-isogeny classes
      X with |X| = h, FORALL functionals C : X -> R_{>0} whose class values
      satisfy H1 with parameter sigma_C, THE INEQUALITY
      |mu_C - opt C| / mu_C <= CV_C sqrt(2 ln h)(1 + o(1)) HOLDS. Note FORALL C
      inside FORALL X: the bound is uniform over functionals, which is the whole
      point, and it is what makes the record a statement about the LANE rather
      than about a functional. The weaker and useless order -- FORALL C EXISTS a
      class on which the bound holds -- is NOT claimed. The o(1) is in h and is
      made explicit: it is the gap between the sub-Gaussian upper bound and the
      Gaussian lower bound and is O(1/log h). No quantifier over attacks,
      algorithms, or exponents is claimed anywhere.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that a named functional, on a named enumerated class at a named
        prime, has a measured class extremal budget below (or above) 1, and hence
        that class minimisation of THAT functional on THAT class cannot (or is not
        excluded from being able to) yield an advantage exceeding the measured
        budget, CONDITIONAL ON H1. It can never certify that any functional does
        yield an advantage; it can never certify anything about attack cost as
        opposed to functional value; it can never certify anything about a
        functional whose class distribution violates H1; and it says nothing about
        the ECDLP in the prime-order subgroup.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS, AND IT MUST BE EXHIBITED:
        the functional f_E itself on the same class. Its class distribution is
        discrete and spread over a factor of 16 at p = 4001 (a factor of
        f <= 2 sqrt(p/3) in general), its B = 1.53 exceeds the threshold, and its
        observed extreme (f_E = 1, i.e. 1.87 sigma below the mean) is materially
        LESS extreme than the sub-Gaussian prediction of 3.14 sigma -- so H1's
        bound is satisfied but loose exactly where the distribution stops being
        concentrated. A method that returned B < 1 for f_E, or that could not tell
        the two functionals apart, would not have identified the load-bearing
        structure and the record would be withdrawn.
    proof_obligations:
      - claim: >-
          Under H1, E[opt over h draws] deviates from mu by at most
          sigma sqrt(2 ln h)(1 + o(1)), and the same holds with probability
          1 - o(1).
        responsibility: correctness
      - claim: h = p^{1/2 + o(1)} for ordinary F_p-isogeny classes.
        responsibility: size
      - claim: >-
          An exponent gain requires relative advantage 1 - o(1), hence
          B >= 1 - o(1).
        responsibility: strictness
      - claim: >-
          The arithmetic of (E) reproduces from the committed artifacts, not from
          transcription.
        responsibility: baseline
      - claim: >-
          B is one-sided: it bounds the prize and never exhibits one.
        responsibility: scope
      - claim: >-
          No hypothesis status moves and no oracle is invented, so C3 is vacuous
          and P1/P2/P3 are untriggered.
        responsibility: interface
    not_applicable_reason: null
    not_applicable_reason_note: >-
      Filled rather than excused. This is a closure-shaped proposal with an
      asymptotic inequality at its centre, which places it squarely inside the
      proof-architecture portfolio of docs/inventor-protocol.md section 8, so all
      four pre-compute audits are run above and none is omitted.

  predictions:
    - metric: >-
        P1 -- B(decomposition_rate_m3, X) on the committed p = 4001, t = 30 class,
        recomputed from the committed per-level means and sds
      direction: lower
      minimum_effect: >-
        PREDICTED BELOW 0.40, and the point prediction from the committed numbers
        is 0.26. A value at or above 1.00 would mean the campaign's own headline
        functional is exponent-capable and would REVERSE this record's reading of
        its own lane; that outcome is pre-registered as the interesting one. The
        computation is arithmetic on committed values and carries no sampling
        error of its own.
    - metric: >-
        P2 -- B(f_E, X) on the same class, from the committed level distribution
        {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} with f_E = 2^level
      direction: higher
      minimum_effect: >-
        PREDICTED ABOVE 1.00, point prediction 1.53. If P2 came out below 1.00 the
        threshold would fail to admit the one functional shape the record claims
        it should admit, the test would be non-discriminating, and the record is
        withdrawn rather than amended. P1 and P2 together are the discrimination.
    - metric: >-
        P3 -- the fitted p-exponent of B(C, X) for an averaging functional, over a
        ladder of at least four primes with fully enumerated classes
      direction: lower
      minimum_effect: >-
        PREDICTED B ~ c * sqrt(log p / p), i.e. a fitted log-log slope of
        -0.50 +- 0.10 after the sqrt(log p) factor is divided out. A fitted slope
        materially above -0.25, or a slope indistinguishable from 0, is the
        canonical artifact tell and means either the class values are not
        averaging (H1's shape assumption is wrong in the useful direction) or the
        measured sigma is dominated by an instrument whose noise does not decay --
        and the record must report which, by comparing against NULL 1's fitted
        slope on the same ladder.
    - metric: >-
        P4 -- the ratio (observed extreme deviation) / (sigma sqrt(2 ln h)) per
        functional per class
      direction: different
      minimum_effect: >-
        Reported as an exact ratio, never as a test. Predicted near 1 for
        averaging functionals (the sub-Gaussian bound is tight for concentrated
        draws) and materially below 1 for f_E (a discrete distribution does not
        reach its sub-Gaussian tail). A ratio ABOVE 1 anywhere refutes H1 on that
        functional and is the single most valuable observation this design can
        make, because a functional whose class extreme beats its sub-Gaussian
        budget is exactly the shape the lane needs.
    - metric: >-
        P5 -- CONTROL: B computed on the gauge orbit of one fixed curve, at matched
        h
      direction: lower
      minimum_effect: >-
        The gauge orbit carries no class content, so its budget is the
        equation-choice floor. Every reported class budget must exceed the gauge
        budget or the reported quantity is measuring the Weierstrass model. Read
        and written to the record BEFORE any class budget is read (null-first,
        docs/inventor-protocol.md section 3).

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, AND IT IS THE WHOLE DISCRIMINATOR). Read the
      committed per-level means, sds and level counts for the p = 4001, t = 30
      class from the committed red-team artifact; compute h, sqrt(2 ln h), and B
      for the two functionals of (E); verify the h = 1 and sigma = 0 boundary
      values symbolically; report P1, P2 and P4. This costs minutes of a human's
      time and no CPU, and it settles the record's central claim about the
      campaign's own headline functional.
      STAGE 1 (MINUTES). Recompute B on the gauge orbit of one class member at
      matched h (P5), reusing the gauge machinery IDEA-20260807-6eb96b and
      IDEA-20260807-0ff796 already specify.
      STAGE 2 (HOURS, ONLY IF STAGE 0 IS NOT ALREADY DECISIVE). The prime ladder:
      fully enumerate one class at each of at least four primes spanning at least
      a decade (the class enumeration by vectorised quadratic-character table is
      the committed method of IDEA-20260807-0ff796 STEP 2 and is reused
      unchanged), measure CV of an EXACTLY computed functional at each rung
      (exact full-group coverage, so that no target sampler enters and
      H-ICINV-6c7920 is not engaged in either direction), and fit P3.
      STAGE 3 (ZERO COMPUTE). Report the admission verdict per functional, the
      fitted decay, and the forward guidance naming the shape class that survives.
      STAGE 0 ALONE CAN KILL OR CONFIRM THE RECORD'S HEADLINE, WHICH IS WHY THIS IS
      THE CHEAPEST ITEM AVAILABLE IN THE LANE.
    controls:
      - the gauge orbit of a fixed class member at matched h (NULL 1, null-first)
      - h random ordinary curves at the same p from outside the class (NULL 2)
      - synthetic draws from the fitted null (NULL 3, declared MODE-1, cannot fail)
      - the h = 1 and sigma = 0 forced boundary values
      - f_E as the nearby object on which the conclusion must fail
      - re-read of the committed numbers from the artifact, never transcription
    required_metrics:
      - h and sqrt(2 ln h) per class
      - mu_C, sigma_C, CV_C and B(C, X) per (functional, class), with the source of
        each committed input named
      - the observed extreme deviation and its ratio to sigma sqrt(2 ln h)
      - the fitted p-exponent of B with its interval, for the real arm and NULL 1
      - the admission verdict (B >= 1 or B < 1) per functional, stated with its
        conditionality on H1

  falsification_conditions:
    - >-
      F1 (ARITHMETIC GATE, SECONDS). The recomputation of (E) from the committed
      artifact does not reproduce B = 0.26 and B = 1.53 to two decimals, or the
      committed numbers cannot be located in the artifact. PREMISE-FAILED; the
      record is superseded and the discrepancy is itself the finding, because it
      would mean a committed within-class number is not where two ledger records
      say it is.
    - >-
      F2 (THE THRESHOLD DOES NOT DISCRIMINATE). P1 and P2 fall on the same side of
      1. The admission test separates nothing and the record is withdrawn, not
      amended.
    - >-
      F3 (THE HEADLINE REVERSES, AND THIS IS THE VALUABLE OUTCOME). P1 returns
      B >= 1 for an averaging functional. Then the campaign's own gating
      functional is exponent-capable under H1, this record's reading of its lane is
      wrong, and the correct next action is to identify the extremal member and
      hand it to IDEA-20260807-c36472's reachability accounting. The record
      commits to reporting this branch as prominently as the other.
    - >-
      F4 (H1 FAILS UPWARD). P4 returns a ratio above 1 for any functional. The
      sub-Gaussian model is wrong for that functional's class distribution, the
      bound is not available in the form stated, and the deliverable becomes the
      identification of a functional whose class extreme beats its budget --
      which the record explicitly wants to find.
    - >-
      F5 (THE DECAY FAILS). P3's fitted slope is indistinguishable from zero while
      NULL 1's is not. The measured sigma is not class-intrinsic and the whole
      ladder is instrument noise; nothing is concluded about any functional and
      the finding is reported against RQ-INSTR-f8faa0.
    - >-
      F6 (PLANNED NEGATIVE, PRE-REGISTERED). If the outcome is that every
      averaging functional fails admission, the record does not get to emit "the
      lane is closed" and stop. It must emit: the named obstruction O-BUDGET, the
      exact numerical budgets per functional per class, the fitted decay with its
      interval, the gauge control, the f_E nearby-object comparison, and CONCRETE
      FORWARD GUIDANCE naming the shape class that remains open -- at minimum
      (i) conductor-driven functionals, of which IDEA-20260811-c72830 supplies a
      cost-relevant instance, (ii) functionals with discrete or heavy-tailed class
      distributions, (iii) functionals defined on classes with UNUSUALLY LARGE h
      relative to sqrt(p), where the log h factor is bigger, and (iv) the
      possibility that the right object is not a functional on the class at all.
      A negative naming no successor has not finished and its honest status is
      unverified (docs/inventor-protocol.md section 4).

  confounders:
    - >-
      SAMPLING NOISE INFLATES sigma_C AND THEREFORE INFLATES B. Every committed
      sd in this campaign is a sd of an ESTIMATE, not of the underlying functional.
      The inflation is in the SAFE direction for a negative verdict (the true
      budget is smaller than the measured one) and in the DANGEROUS direction for
      a positive one. Any B >= 1 must be re-derived from an exactly computed
      functional with no estimator, or it is not reported.
    - >-
      THE #E CONFOUND, WHICH IS STRUCTURAL AND CANNOT BE DESIGNED AWAY. Class
      membership and group order are the same condition (Tate), so NULL 2 differs
      from the real arm in two ways at once and can never isolate "class effect"
      from "#E effect". NULL 1 (gauge) is the only null that holds #E fixed, and
      it holds the curve fixed too. This is a permanent identifiability limit of
      the lane and it is recorded here rather than in a footnote.
    - >-
      SMALL-h ARTIFACTS. sqrt(2 ln h) changes by only 25% between h = 30 and
      h = 500, so B is dominated by CV at toy scale and the log factor is nearly
      constant across the accessible ladder. The p-decay is therefore carried
      almost entirely by CV, and the fit must say so rather than crediting the
      log term.
    - >-
      GAUGE. The same curve has (p-1)/2 Weierstrass models. Any functional not
      gauge-invariant contributes equation-choice variance to sigma_C and inflates
      B. NULL 1 measures exactly this and is not optional.
    - >-
      MULTIPLE FUNCTIONALS. Computing B for many functionals and reporting the
      largest is selection. Every functional examined is listed with its budget,
      including the ones that lose.

  interpretation_limits:
    - >-
      claim_tier toy. Every number is from one prime and one class unless the
      ladder runs. The INEQUALITY is scale-free; the NUMBERS are not.
    - >-
      THE BOUND IS ONE-SIDED AND MAY NEVER BE USED AFFIRMATIVELY. B >= 1 says an
      advantage is not excluded. It never says one exists, and a record citing a
      large B as evidence of a within-class effect is making an unsupported
      inference.
    - >-
      THE BOUND IS ON THE FUNCTIONAL, NOT ON ATTACK COST. Converting a bound on
      the class spread of a Groebner proxy into a bound on ECDLP cost requires the
      proxy to be a cost model, which IDEA-20260807-0ff796 and H-ICINV-d5e351 both
      record it is not.
    - >-
      CONDITIONAL ON H1 THROUGHOUT, AND H1 IS A TAIL ASSUMPTION THAT THE RECORD
      EXPECTS TO FAIL ON EXACTLY THE FUNCTIONALS IT WANTS THE LANE TO PURSUE.
      Presenting the bound as unconditional is prohibited.
    - >-
      H-ENDO-001 is used nowhere and is not retested. KN-FIND-b7e091 is binding and
      is not revisited; the bound is orthogonal to it. Nothing here bears on
      H-STR-002 in either direction (no factor base, no relation, no equivariance),
      so pause condition P2 is not triggered; nothing here presumes H-ICINV-6c7920
      true or false, and STAGE 2's exact-coverage functional engages no target
      sampler at all.
    - >-
      sqrt(6) remains baseline calibration and never an attack (KN-TECH-018). This
      record produces no speedup of any size.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (CLASS-DRAW CONCENTRATION.) For a cost functional C of averaging type on a
        complete ordinary F_p-isogeny class X with |X| = h, the h values
        {C(E) : E in X}, centred at their class mean mu_C and scaled by their class
        standard deviation sigma_C, are exchangeable and sub-Gaussian with
        parameter 1: for all lambda > 0 and all E in X,
        Pr[ |C(E) - mu_C| >= lambda sigma_C ] <= 2 exp(-lambda^2 / 2), with the
        probability taken over the choice of E uniformly in X. Consequently
        max_E |C(E) - mu_C| <= sigma_C sqrt(2 ln h)(1 + o(1)).
      rigorous_support: >-
        RIGOROUS HALF: the sub-Gaussian maximal inequality is a theorem and needs
        no independence, only the marginal tail bound; and the matching lower bound
        for iid Gaussians shows the constant sqrt(2) cannot be improved, so the
        budget is tight rather than merely sufficient. DISTRIBUTION THEOREM
        IMITATED: the central limit behaviour of a sum of ~N weakly dependent
        indicators -- an averaging functional (relation yield, decomposition
        probability, coverage) is a normalised count over the whole group, and the
        classical statement it imitates is the Gaussian limit for such counts with
        fluctuation N^{-1/2}, exactly as the Weil/Bombieri square-root cancellation
        governs the analogous counts on the Semaev locus (the mechanism
        IDEA-20260807-0ff796 D2 and IDEA-20260808-d6d973 HA-1 both invoke).
        WHAT IS HEURISTIC: that the ISOGENY CLASS supplies draws behaving like that
        model rather than like a structured family. That is precisely what the
        campaign is trying to find out, so it is stated as an assumption and
        measured, never assumed away.
      validation_plan: >-
        WHAT IS SAMPLED: the full enumerated class (no sampling of curves at all --
        every member is computed), at one exactly computed functional per rung.
        AT WHAT SCALE: a ladder of at least four primes spanning at least a decade,
        p from 4001 upward, each with a completely enumerated Hurwitz-Kronecker-
        certified class; h grows as p^{1/2+o(1)}, giving h from ~10^2 to ~10^3.
        SHORTCUT USED TO REACH SCALE: exact full-group coverage enumeration instead
        of target sampling, which removes the estimator entirely and lets CV_C be
        the class-intrinsic quantity rather than an estimate; and the vectorised
        quadratic-character class enumeration of IDEA-20260807-0ff796 STEP 2, which
        makes class construction O(p) rather than requiring Hilbert class
        polynomials. NO correspondence exists that would carry this to
        cryptographic p, and the record says so instead of implying one.
        PREDICTED DISTRIBUTION COMPARED AGAINST: the standardised class values
        against the standard normal, by empirical CDF and by Anderson-Darling,
        per class per rung; and the observed extreme against the Gumbel prediction
        for h iid Gaussian draws, whose location is sqrt(2 ln h) - (ln ln h + ln 4pi)
        / (2 sqrt(2 ln h)) and whose scale is 1/sqrt(2 ln h).
        TAIL CONSISTENCY CHECKS: the observed maximum and minimum standardised
        values against the Gumbel quantiles at that h (P4); the count of class
        members beyond 2.5 sigma against the Gaussian expectation h * 0.0124; and
        the SIGN of the discrepancy, since an observed extreme BEYOND the Gumbel
        prediction refutes H1 upward and is the outcome of interest.
        SAMPLED PARAMETERS RECORDED: p, t, D, D_0, f, h, the functional, the
        factor-base rule, and the exact commit of the enumeration code.
        TRANSFER ASSUMPTION, STATED: none is made. The fitted p-exponent is a
        toy-scale fit over toy primes and is not extrapolated; the asymptotic
        statement B ~ CV sqrt(ln p) rests on h = p^{1/2+o(1)}, which is a theorem,
        and on CV's decay, which is exactly what is being measured.
    - id: H2
      statement: >-
        (CLASS SIZE.) For the primes and traces measured, h = H(t^2 - 4p) satisfies
        p^{1/2 - eps} <= h <= p^{1/2 + eps} with eps small enough that
        sqrt(2 ln h) = sqrt(ln p)(1 + O(eps)) for the reported figures.
      rigorous_support: >-
        Rigorous ingredient: the class number formula h(D) = sqrt(|D|) L(1, chi_D)/pi
        with |D| = 4p - t^2, together with Siegel's bound (ineffective) for the
        lower side and the classical upper bound h(D) = O(sqrt(|D|) log |D|). The
        classical distribution statement imitated is the conjectural (GRH-provable)
        confinement of L(1, chi_D) to [c/log log |D|, C log log |D|], the same
        ingredient IDEA-20260808-28361d already carries for its class-size
        accounting. WHAT IS HEURISTIC: nothing about h for a MEASURED class, which
        is enumerated exactly; only the asymptotic identification
        h = p^{1/2+o(1)} used in the closed-form threshold.
      validation_plan: >-
        WHAT IS SAMPLED: for each rung of the prime ladder, the exact enumerated
        class size h against sqrt(|D|), reported as the ratio h/sqrt(|D|).
        SCALE: the same four-rung ladder; the committed anchor is h/sqrt(p) = 2.18
        at p = 4001. PREDICTED DISTRIBUTION: the ratio h/sqrt(|D|) against the
        distribution of L(1, chi_D)/pi over random fundamental discriminants,
        compared by empirical CDF over at least 50 classes per rung.
        TAIL CHECKS: the smallest and largest observed h/sqrt(|D|) against the
        GRH-predicted extremes at that sample size. TRANSFER: at cryptographic p, h
        is not computable without subexponential work, so H2 cannot be validated at
        crypto scale by this route, and the record says so rather than implying it
        can.

  reachability_gate: >-
    T5 IS DELIBERATELY GRANTED IN FULL AND THAT IS THE POINT, RATHER THAN BEING
    SKIPPED. The bound in (C1) is proved under the assumption that the minimiser's
    address is free and that transport to it is free -- both branches of T5
    satisfied at zero cost. So the record is INDEPENDENT of the T5 debate and
    subsumes it in the negative direction: when B(C, X) < 1, discharging T5 buys
    nothing, and the reachability work of IDEA-20260807-c36472 and
    IDEA-20260808-28361d becomes unnecessary for that functional. When
    B(C, X) >= 1 the T5 gate becomes live again exactly as those records specify
    and this record hands the question straight to them. The composition is:
    BUDGET first (free, arithmetic, functional-level), REACHABILITY second (costly,
    empirical, member-level).

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED, AND THE RECORD'S CONTENT IS A CAP ON
      ONE. Stated as the cap: for any functional with B(C, X) = o(1), class
      minimisation changes the relevant stage's cost by a factor 1 + o(1), so the
      exponent of that stage is EXACTLY class-invariant and no isogeny walk moves
      it. The record's own computational cost is O(1) arithmetic for STAGE 0 and
      O(p) per curve for the optional class enumeration of STAGE 2, i.e.
      p^{1+o(1)} to p^{3/2+o(1)} per rung -- far worse than the p^{1/2} baseline,
      affordable only because it is a measurement and not an attack.
    memory_exponent: >-
      O(h) real numbers for the budget computation (kilobytes) and O(p) bytes for
      the character table in the optional enumeration. Memory is never the binding
      constraint here; wall time on the enumeration is.
    best_known: >-
      For prime-field ECDLP: parallel Pollard rho with distinguished points at
      0.886 sqrt(N) group operations and O(1) memory per processor (KN-TECH-001,
      KN-TECH-006), already carrying the negation discount, and its
      automorphism-discounted variant on CM curves at a factor at most sqrt(6)
      (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory (KN-TECH-031). For the
      decomposition stage specifically, the heuristic |F|^m / (m! N) of
      KN-TECH-003. This record changes none of them and is designed to make it
      cheap to prove that a proposed change to them is capped.
    hidden_overhead: >-
      The o(1) in "h = p^{1/2+o(1)}" hides a class-number log factor and Siegel's
      ineffectivity, so the threshold constant is asymptotic and is NOT a numerical
      claim at any finite p; every reported budget uses the EXACT enumerated h
      instead. The (1 + o(1)) in (C1) is the sub-Gaussian/Gaussian gap, O(1/log h),
      which at h = 138 is not small -- roughly 20% -- so budgets near 1 must be
      reported as near 1 and never adjudicated by the third decimal.
    tradeoff_note: >-
      No algorithm is produced, so there is no time-memory tradeoff to state. One
      parallelisation remark IS relevant and is stated because it strengthens the
      cap: the bound is on a RATIO, and both rho and any class-minimised variant
      parallelise linearly, so the budget is invariant under parallelisation and
      cannot be recovered by throwing processors at it.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW OF THE
    PRIME-FIELD FRONTIER NAMED IN THIS CAMPAIGN'S OWN ACCOUNTING, AND NOT LEFT
    NULL. (i) Parallel Pollard rho with distinguished points, 0.886 sqrt(N) group
    operations, O(1) memory per processor, linear parallel speedup (KN-TECH-001,
    KN-TECH-006). (ii) Its automorphism-discounted variant on CM curves, same
    exponent, constant discount at most sqrt(6) (KN-TECH-018). (iii) BSGS,
    sqrt(N) time and sqrt(N) memory, deterministic (KN-TECH-031). (iv) For the
    decomposition stage, KN-TECH-003's heuristic. This record mounts no attack and
    produces no speedup at all, so it is dominated by (i)-(iv) on time, by (i) and
    (ii) on memory, and by all of them on data/queries since it reads the full
    curve equation and enumerates classes while rho reads only the group. It is
    also dominated, as a piece of lane-level accounting, by nothing in the corpus:
    IDEA-20260807-c36472 and IDEA-20260808-28361d price a different axis and
    neither implies nor is implied by this bound.
  sota_delta: >-
    ZERO on every attack axis: the rho constant stays 0.886 sqrt(N), the exponent
    stays 1/2, memory stays O(1), and no data or query cost changes. The delta is a
    CLOSURE delta and is stated quantitatively: it replaces the lane's open-ended
    question "is any cost functional non-constant across the class?" with the
    computable admission test B(C, X) = CV_C sqrt(2 ln h) >= 1, evaluates it at
    0.26 for the campaign's own headline functional and 1.53 for the conductor on
    the campaign's own committed class, and predicts B ~ sqrt(log p / p) -> 0 for
    every averaging functional -- turning an unbounded measurement programme into a
    one-line pre-compute filter that costs nothing and that any future proposed
    functional must pass before it is measured.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  novelty_status: unverified
  novelty_screen:
    method: >-
      Repository greps run 2026-08-11 with the Grep tool over ledger/proposals,
      ledger/hypotheses, ledger/questions, knowledge/ and analysis/: patterns
      "extreme value|extreme-value|sqrt\\(2 log|order statistic|minimum over the
      class|min over the class|class size h|effect size"; "scaling law|ladder of
      primes|across primes|p\\^\\{-1/2\\}"; "concentration|coefficient of
      variation". Full reads: IDEA-20260807-0ff796, IDEA-20260807-c36472 (title and
      claim head), IDEA-20260808-28361d (heuristics and target_complexity),
      H-ICINV-d5e351, H-VOLC-dff1f8, RQ-ICINV-475b5e, RQ-VOLC-f6253b,
      DECOMPOSITION.md, KN-FIND-b7e091, docs/inventor-protocol.md.
    results: >-
      No record computes an effect-size bound on class minimisation. The nearest
      neighbours are IDEA-20260807-c36472 (prices IDENTIFICATION of the minimiser
      at h ~ p^{1/2} evaluations) and IDEA-20260808-28361d (prices class
      ENUMERATION at p^{1/2+o(1)}), both of which price the SEARCH and neither of
      which bounds the PRIZE; and IDEA-20260807-0ff796, which proves sigma = 0 for
      one functional at one arity in the mean and explicitly lists the variance and
