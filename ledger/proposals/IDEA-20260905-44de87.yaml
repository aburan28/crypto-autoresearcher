  - RQ-CANL-63098f
  goal_ids:
  - GOAL-ENDO-001
  goal_applicability:
    GOAL-ENDO-001: Directly targets the lift-height requirement named by RQ-CANL; smaller CM coefficients or rank
      alone do not discharge it.
