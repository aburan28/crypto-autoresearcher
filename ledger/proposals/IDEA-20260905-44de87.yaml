  assumptions:
  - Global model, field degree, Mordell-Weil subgroup saturation and height error bounds are declared; otherwise
    only abstract lattice controls are admissible.
  - No claim that a canonical lift supplies small global lifts of arbitrary finite-field points.
  - In the abstract diagonal comparison lambda_i denotes squared successive length (height units). Any transfer
    from arbitrary diagonal forms to a certified CM Mordell-Weil lattice remains a separate prerequisite.
  predictions:
  - metric: Successive minima, distinct reduction images by height shell, maximum fiber multiplicity and H needed
      for 10% coverage
    direction: different
    minimum_effect: Coverage knees follow newly active minima, while the quotient-kernel plant separates lattice
      volume from usable image count.
  minimal_test:
    design: First compare rank-2 and rank-4 rational quadratic lattices with the same determinant and different
      successive minima, together with explicit quotient maps to Z/101. Only after global-model certification could
      an independent task select toy CM and non-CM lifts. For the formal comparison use diagonal squared-length
      forms diag(1,4,25,100) and diag(1,5,20,100) on Z^4, both determinant 10000 and rank 4. At H=10 both have two
      active coordinate directions; both share shortest and longest squared minima 1 and 100, while their middle
      minima differ. With reduction n->n1 mod 101, both have the same image count min(101,2 floor(sqrt(H))+1) at
      every H, yet the middle squared minima distinguish them. This is an abstract distinction beyond rank/determinant/effective-rank
      classification and image census, not an exhibited CM lattice or verified CM gain.
    proposal_only: true
    controls:
    - type: matched_null
      description: Same determinant and rank with balanced minima, identical quotient size.
    - type: known_false
      description: A high-rank lattice whose short vectors all lie in the reduction kernel has many short points
        and zero nontrivial coverage; the statistic must detect this.
    required_metrics:
    - Successive minima, distinct reduction images by height shell, maximum fiber multiplicity and H needed for
      10% coverage
    - construction work, peak bytes, certificate size
    required_artifacts:
    - Exact fixtures
    - Independent certificates
    - Complete controlled outputs
    stopping_rule: First exact contradiction or stated finite panel; missing prerequisites and limits are inconclusive.
      No execution in this task.
  falsification_conditions:
  - A purported height advantage disappears after reduction collisions or global field-degree costs are charged;
    no valid global realization exists within the declared scope.
  confounders:
