      parameter_slice: L=Z, Q(n)=a*n^2 with a>0; reduction n mod N, and m=floor(sqrt(H/a)).
      exact_expected_identity: Height ball is {-m,...,m}; count=2m+1 and distinct reduction images=min(N,2m+1).
        This reproduces the rank-one lattice/reduction baseline; random matched lattices remain separate.
