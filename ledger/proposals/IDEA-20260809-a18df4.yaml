idea:
  id: IDEA-20260809-a18df4
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    The fully-proved instantiation as null object, with per-proof re-enabling as
    the positive control that measures the harness's power
  class: control
  claim: >-
    With every specified proof enabled at its specified parameters, the entire
    attack suite must fail. The claim is that this negative, paired with the
    observation that each attack reappears the moment its precondition is
    restored, is what makes the goal's fix map a measurement — and that without
    the pair, every "the fix works" cell is an untested assertion.
  mechanism: >-
    Run the suite against the fully-proved configuration at matched budgets, then
    for each attack restore exactly its precondition and confirm the attack
    reappears at the rate its own record documented.
  why_not_a_renamed_known_approach: >-
    Regression testing is standard. Its use here is as a POWER MEASUREMENT for
    negatives, which this program's rules require: an attack that fails must be
    shown to be capable of succeeding under the conditions it needs.
  predictions:
  - observable: attack outcomes against the fully-proved configuration
    metric: success count
    predicted: Zero. A success would be a finding about a published protocol version and triggers the goal's disclosure-before-publication rule immediately.
  - observable: reappearance rates on precondition restoration
    metric: per-attack success rate versus its own record
    predicted: Matching. A lower rate means the harness lost power in the fully-proved code path and the negatives are not interpretable.
  minimal_test: >-
    Full suite against the fully-proved configuration and against each
    single-precondition restoration, at matched budgets and seeds.
  controls:
  - 'MATCHED BUDGETS AND SEEDS across all configurations.'
  - 'HONEST-PATH CONTROL in the fully-proved configuration, so a failure to attack is not a failure to run the protocol.'
  falsification_conditions:
  - An attack succeeds against the fully-proved configuration.
  - Reappearance rates fall short of the recorded ones.
  interpretation_limits: >-
    Failure of this program's attacks at declared budgets is never a security
    proof for any protocol (AGENTS.md rule 3), and the fully-proved reference is
    still this program's implementation rather than any deployed one.
  sota_delta: 'No attack. Delta: measured harness power, without which the fix map''s positive cells are assertions.'
  dominated_by: Not dominated by any corpus record; a precondition for the goal's fix map.
  estimated_cost: Implementation small on top of the suite; compute moderate.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for null-object control: discipline present elsewhere in the program, not for this protocol. WEB NOT CHECKED.'
  source_refs:
  - Threshold ECDSA protocol specifications -- REQUIRED READS.
