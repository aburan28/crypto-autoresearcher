idea:
  id: IDEA-20260829-7169d6
  question_id: RQ-ECDLP-160d89
  added: '2026-08-29'
  title: >-
    Price the four-list route in bits of the answer: the discrete-logarithm
    interval key is computable after guessing the top bits of x, the guessed
    variant collapses to exactly N^(1/2), and (1/3)log_2 N bits of advice are
    exactly enough to reach N^(1/3)
  class: algorithm
  claim: >-
    THREE LINKED STATEMENTS. STATEMENT 1, BOOTSTRAP. The log-interval key that
    IDEA-20260829-390ccc argues is forced, namely g(R) equal to the top bits of
    log_T(R), is NOT unconditionally uncomputable on source-labelled leaves. For
    leaves R = aP + bQ with b in {0,1} and known a, log_P(R) = a + b*x, so
    guessing the top k bits of x makes g computable to precision N/2^(k-O(1)) at
    O(1) cost per leaf. STATEMENT 2, CEILING. Running the four-list route inside
    such a guess and charging the guesses gives total expected time
    N^(mu + max((1+mu)/4, (1-mu)/2)) where mu is log_N of the number of key
    fibers and lies in [0,1/3]. That expression equals 1/2 + mu/2 on the whole
    range, is strictly increasing in mu, and attains its minimum EXACTLY 1/2 at
    mu = 0, which is plain BSGS with no four-list structure at all. So the
    bootstrap route degrades monotonically in the amount of pruning it buys and
    its ceiling is precisely the birthday bound, meaning the four-list structure
    buys exactly nothing once the key is charged. STATEMENT 3, ADVICE PRICE, the
    positive corollary. If k bits of log_P(Q) are supplied rather than guessed,
    the route runs at N^max((1+mu)/4, (1-mu)/2) with mu at most k/log_2 N, and at
    mu = 1/3, that is, exactly ceil((1/3)log_2 N) supplied bits, the exponent is
    exactly 1/3. So the four-list lane's entire conditional promise is worth
    precisely (1/3)log_2 N bits of the discrete logarithm and not one bit less.
    That is a sharp, falsifiable price for the lane, and it is the currency in
    which the lane should be compared to the preprocessing frontier.
  mechanism: >-
    Statement 1 is arithmetic on the source labels the certificate already
    requires under JPR-C1. A leaf carries (a,b) with R = aP + bQ; its
    P-logarithm is a + b*x. With b restricted to {0,1} and the top k bits of x
    fixed by a guess, a + b*x is known to within 2^(n-k) where n = log_2 N, so
    any bucketing to precision coarser than 2^(n-k) is computable in O(1) per
    leaf with no group operation. Statement 2 composes that with the
    IDEA-20260829-3f0f4b surface. With m = N^mu fibers the accepted-set size is
    sigma about 2N/m, hence s = 1 - mu, and an output-sensitive join with
    gamma = 1 is available BECAUSE the fibers are now genuine log-intervals and
    the join is a two-pointer scan on known integers. Substituting gamma = 1 and
    s = 1 - mu into N^max(gamma(2-s)/4, s/2) gives
    N^max((1+mu)/4, (1-mu)/2). The two branches cross at mu = 1/3; below that the
    (1-mu)/2 branch dominates. Multiplying by the N^mu guesses gives
    mu + (1-mu)/2 = 1/2 + mu/2 on mu in [0,1/3], minimized at mu = 0. Statement 3
    is the same expression without the guess factor. The structural reading is
    that the four-list route needs to prune on partial sums of the UNKNOWN x, the
    only comparison primitive available on points is all-or-nothing equality, and
    buying the missing comparison by guessing costs exactly as much as the
    pruning saves. The two exponents cancel to 1/2 identically, which is why the
    cancellation is a ceiling and not a coincidence.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260829-390ccc
      provenance: internal
      claim: >-
        The join-key rigidity chain concluding that an O(L)-scan sound
        concentrating fiber system on a prime-order group has AP or
        generalized-AP fibers, that is, is a log-interval key. This record takes
        that conclusion as its input and asks what it costs to make such a key
        computable.
      verified_by: idea-generator, authored in this session
    - ref: IDEA-20260829-3f0f4b
      provenance: internal
      claim: >-
        The cost surface T = N^max(gamma(2-s)/4, s/2), used here at gamma = 1 and
        s = 1 - mu.
      verified_by: idea-generator, authored in this session
    - ref: ledger/hypotheses/H-JPR-3a00f0.yaml
      provenance: internal
      claim: >-
        JPR-C1 requires every leaf to store (a, b, R = aP+bQ). This record's
        bootstrap uses exactly that stored data and adds nothing to the leaf.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: IDEA-20260817-1e0111
      provenance: internal
      claim: >-
        The record's ARM 1 observation that the integer bit decomposition of the
        discrete logarithm is addition-compatible but NOT computable from a
        point, which is why ARM 1 does not contradict prime-order rigidity. This
        record is the quantitative continuation of exactly that observation,
        since it prices the gap between not computable from a point and
        computable after k guessed bits.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: >-
        D. Boneh and R. Venkatesan, "Hardness of computing the most significant
        bits of secret keys in Diffie-Hellman and related schemes", CRYPTO 1996,
        and the hidden-number-problem line following it
      provenance: recalled
      claim: >-
        Recovering the most significant bits of a Diffie-Hellman-type secret is
        as hard as the full problem, via lattice-based reductions. Relied on only
        as the reason to treat the top bits of x as advice that must be paid for
        rather than computed. Pointer only; not fetched in this session.
      verified_by: null
    - ref: >-
        D. J. Bernstein and T. Lange, "Non-uniform cracks in the concrete, the
        power of free precomputation", ASIACRYPT 2013, and the S*T^2 = N
        preprocessing frontier
      provenance: recalled
      claim: >-
        With S units of precomputed advice about a fixed group, discrete
        logarithms are solvable in online time T with S*T^2 about N, and this is
        the matching generic-model frontier. Relied on as the mandatory
        comparison row for statement 3. Pointer only; not fetched, and the exact
        form of the bound and whether it applies to per-TARGET advice rather than
        per-GROUP advice is NOT verified. That distinction is decisive here and
        is an explicit proof obligation.
      verified_by: null
    - ref: >-
        P. C. van Oorschot and M. J. Wiener, parallel collision search, and
        M. J. Wiener and R. J. Zuccherato
      provenance: recalled
      claim: >-
        Parallel rho gives wall clock N^(1/2)/m at small memory with TOTAL WORK
        unchanged at N^(1/2). Used as the parallelization comparison row. Pointer
        only; not fetched.
      verified_by: null
  assumptions:
    - >-
      A1. Leaves may be constructed with b restricted to {0,1} without destroying
      the relation, since a four-term sum with the sum of b in {1,2,3} has
      nonzero denominator mod N and replays to x = -(sum of a)/(sum of b).
    - >-
      A2. Guessing the top k bits of x is a partition of the search space into
      2^k equal parts, exactly one of which is correct. A wrong guess yields no
      relation and the attempt is discarded at full cost.
    - >-
      A3. Once the key is a genuine log-interval key on known integers, the
      level-1 join is a two-pointer scan, so gamma = 1 is achieved and not
      assumed.
    - >-
      A4. The advice in statement 3 is per-TARGET, meaning bits of log_P(Q), not
      per-group precomputation. That distinction changes which frontier row
      applies and is not elided.
    - A5. N is prime and no exact nontrivial quotient of G is assumed.
  proof_search_map:
    bottleneck: >-
      IDEA-20260829-390ccc concludes that the required key is a log-interval key
      but does not say what such a key COSTS. Without that, the phrase requires a
      discrete logarithm is a slogan. The bottleneck is turning it into an
      exponent.
    baseline_embedding:
      parameter_slice: >-
        mu = 0, meaning one fiber, no pruning, and no guessing. The route
        degenerates to a two-list meet-in-the-middle at N^(1/2) time and N^(1/2)
        memory, that is, exactly BSGS. This is the exact old-method boundary.
      reproduction_check: >-
        Symbolic. 1/2 + mu/2 at mu = 0 is 1/2, and the list length
        L = (N^2/sigma)^(1/4) at sigma = N is N^(1/4), which must be checked
        against the BSGS list length N^(1/2) and reconciled, since a four-list
        scheme at mu = 0 is a FOUR-list meet-in-the-middle, not a two-list one.
        The reconciliation is a mandatory obligation and a place the derivation
        can fail. If the mu = 0 slice does not reproduce a known N^(1/2)
        algorithm exactly, statement 2 is wrong.
    observation_collision:
      observable: 'Total expected time as a function of mu, namely 1/2 + mu/2.'
      distinct_preimage_search: >-
        Two objects share the same total exponent 1/2 at mu = 0, namely plain
        BSGS and the four-list route with a trivial key. They agree in cost and
        differ in memory profile and parallel span, so the observable total
        exponent cannot distinguish them and must be reported alongside memory
        and span. A second, sharper collision, the guessed route at mu and the
        advised route at mu have the same PER-ATTEMPT cost and differ only by the
        N^mu factor, so any report that quotes per-attempt cost without the guess
        factor manufactures an apparent N^(1/3) result out of nothing. That is
        the specific mis-reading this record exists to pre-empt.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Track bits of x consumed as a potential function across the merge
          levels. Each fiber refinement consumes mu*log_2 N bits and each guessed
          bit supplies one, so the route's feasibility is a ledger that must
          balance.
        predicted_gain: >-
          Makes the cancellation to 1/2 visible as a conservation law rather than
          an algebraic accident, and predicts that ANY future variant of the
          bootstrap also lands on 1/2 unless it obtains bits of x more cheaply
          than by guessing, which names the single thing a successor must do.
      - transform: boundary_lift
        proposed_object: >-
          Move from the single-target, no-advice setting to the advice setting,
          where the bits are supplied.
        predicted_gain: >-
          Converts the ceiling into a price, namely that exactly
          ceil((1/3)log_2 N) bits of log_P(Q) buy exponent 1/3. That is a
          positive, checkable corollary and it is the record's only positive
          content.
    quantifier_order: >-
      Statement 2, FOR ALL mu in [0,1/3] and FOR ALL prime N in the declared
      family, the guessed-bootstrap route's expected total time is
      N^(1/2 + mu/2 + o(1)), and THERE EXISTS no mu making it below N^(1/2).
      Statement 3, FOR ALL mu in [0,1/3], IF an oracle supplies the top
      mu*log_2 N bits of log_P(Q), THEN expected time is
      N^(max((1+mu)/4,(1-mu)/2) + o(1)); the oracle is an explicit hypothesis and
      is never discharged.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact exponent identity for the guessed and advised variants of ONE
        key family, the log-interval key on leaves with b in {0,1}. It can NEVER
        certify anything about (a) leaves with unbounded b, where the guess
        precision degrades and the arithmetic changes, (b) keys that are not
        log-interval keys, (c) obtaining bits of x by any means other than
        guessing or advice, or (d) amortization across many targets, where the
        guess may be shared and the accounting changes qualitatively.
      nearby_object_control: >-
        The object where the conclusion must FAIL is Z/N with fully known
        logarithms, where mu can be taken to 1/3 at ZERO guess cost and the route
        does reach N^(1/3). If the derivation gives 1/2 there too, it has charged
        a guess that is not needed and is wrong. This control is the sharpest
        available test of the accounting.
    proof_obligations:
      - claim: >-
          With b in {0,1} and the top k bits of x fixed, a + b*x is determined to
          within 2^(n-k) at O(1) cost per leaf.
        responsibility: correctness
      - claim: >-
          A log-interval key on known integers admits a two-pointer join at
          gamma = 1.
        responsibility: runtime
      - claim: >-
          Substituting gamma = 1 and s = 1-mu into the surface gives
          N^max((1+mu)/4,(1-mu)/2), with the branches crossing at mu = 1/3.
        responsibility: size
      - claim: >-
          The total with guesses is 1/2 + mu/2 on [0,1/3], strictly increasing,
          and minimized at mu = 0.
        responsibility: strictness
      - claim: >-
          The mu = 0 slice reproduces a known N^(1/2) algorithm exactly,
          including its list lengths and memory.
        responsibility: baseline
      - claim: The known-logarithm control reaches 1/3 at zero guess cost.
        responsibility: scope
      - claim: >-
          Statement 3's advice is per-target, and the correct comparison row is
          therefore identified explicitly rather than borrowed from per-group
          preprocessing.
        responsibility: interface
      - claim: >-
          A wrong guess costs a full attempt and yields no partial credit; no
          early-abort saving is assumed.
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: total_exponent_of_the_guessed_bootstrap_as_a_function_of_mu
      direction: higher
      minimum_effect: >-
        Exactly 1/2 + mu/2 on mu in [0,1/3], strictly increasing, with minimum
        exactly 1/2 at mu = 0.
    - metric: advised_route_exponent_at_mu_equals_one_third
      direction: different
      minimum_effect: >-
        Exactly 1/3, that is, ceil((1/3)log_2 N) supplied bits of log_P(Q)
        suffice and fewer do not.
    - metric: known_logarithm_control_exponent
      direction: lower
      minimum_effect: >-
        Forced value, exactly 1/3 at zero guess cost. If the derivation charges a
        guess here it is wrong and the record is void.
    - metric: mu_equals_zero_slice_versus_a_known_N_to_the_half_algorithm
      direction: different
      minimum_effect: >-
        Must coincide in exponent AND in list length and memory. A mismatch in
        list length falsifies the surface substitution.
    - metric: branch_crossing_point_of_the_two_maxima
      direction: different
      minimum_effect: >-
        Exactly mu = 1/3. Any other crossing point means the substitution is
        arithmetically wrong.
  minimal_test:
    design: >-
      STATIC, SYMBOLIC, ZERO RUNS, inside the RQ claim boundary. Step 1, write
      the bootstrap arithmetic explicitly for b in {0,1}, including the carry
      analysis that costs O(1) bits of precision, and state the exact precision
      achieved as a function of k. Step 2, substitute gamma = 1 and s = 1 - mu
      into the IDEA-20260829-3f0f4b surface and derive both branches, the
      crossing point and the guessed total, carrying constants. Step 3, run the
      mu = 0 baseline reconciliation against a named N^(1/2) algorithm, matching
      exponent, list length and memory, and if they do not match, report the
      mismatch rather than adjusting the surface. Step 4, run the
      known-logarithm control, which must reach 1/3 at zero guess cost. Step 5,
      extend b to a bounded range B greater than 1 and report how the required k
      grows, to test whether the ceiling is an artifact of b in {0,1}. Step 6,
      for statement 3, identify the correct frontier comparison row and state
      explicitly whether per-target advice of k bits is or is not covered by the
      per-group S*T^2 = N frontier; if the distinction cannot be settled from the
      cited sources, record it as an open obligation rather than assuming either
      way.
    controls:
      - >-
        Known-logarithm control on Z/N, which must reach exponent 1/3 with zero
        guess cost.
      - >-
        mu = 0 baseline, which must reproduce a named N^(1/2) algorithm in
        exponent, list length and memory.
      - >-
        Unbounded-b control, with b drawn from a range of size B. The required k
        grows by log_2 B and the ceiling must be re-derived, not assumed.
      - >-
        Proves-too-much control. If the derivation shows the guessed route
        beating N^(1/2) for any mu, it must be checked against Shoup and Nechaev,
        since the key evaluation in the guessed route is generic, touching only
        known integers, and a generic sub-rho result would be impossible.
      - >-
        Mandatory Pareto rows, Pollard rho, BSGS, van Oorschot-Wiener total work,
        and, for statement 3 only, the preprocessing frontier S*T^2 = N.
      - >-
        Mis-reading control. The per-attempt cost must be reported adjacent to
        the guess factor everywhere, so no reader can quote N^(1/3) without the
        N^(1/3) guesses.
    required_metrics:
      - exact_precision_of_the_bootstrapped_key_as_a_function_of_k_and_B
      - the_two_branch_expressions_and_their_crossing_point
      - total_guessed_exponent_as_a_closed_form_in_mu
      - mu_zero_reconciliation_outcome_including_list_length_and_memory
      - known_logarithm_control_exponent
      - required_supplied_bits_for_each_target_exponent_between_one_third_and_one_half
      - whether_per_target_advice_is_covered_by_the_cited_preprocessing_frontier
      - generic_model_consistency_check_outcome
  falsification_conditions:
    - >-
      The mu = 0 slice does not reproduce a known N^(1/2) algorithm in exponent,
      list length and memory. The surface substitution is then wrong and
      statements 2 and 3 fall with it.
    - >-
      The known-logarithm control does not reach 1/3 at zero guess cost, showing
      the accounting charges a guess that is not needed.
    - >-
      The branch crossing is not at mu = 1/3, or the guessed total is not
      1/2 + mu/2.
    - >-
      The guessed route is derived to beat N^(1/2) for some mu. Since its key
      touches only known integers and is therefore a generic step, this would
      contradict the generic-model lower bound and is an arithmetic error until
      independently replicated.
    - >-
      A method is exhibited that obtains the top mu*log_2 N bits of x in time
      below N^(1/2 - mu/2). Then the ceiling is broken, statement 2 is FALSE, and
      this record inverts into a positive route. This is the single outcome that
      would make the whole lane live again, and naming it is the point of writing
      the ceiling down.
    - >-
      Extending b beyond {0,1} changes the ceiling qualitatively. The ceiling
      would then be an artifact of the leaf construction rather than a property
      of the family, and must be restated.
    - >-
      Per-target advice of k bits turns out to be strictly cheaper than the cited
      frontier permits, in which case statement 3 is not merely a price but a
      frontier claim and requires far stronger review.
  confounders:
    - >-
      Carry propagation. a + b*x with b = 1 and unknown low bits of x can carry
      into the guessed prefix, costing O(1) bits of precision. Ignoring the carry
      would flatter the record by a constant and must be carried explicitly.
    - >-
      Guess granularity. The count 2^k assumes the top k bits partition
      uniformly; the last partial block must be handled or the count is off by a
      factor.
    - >-
      The sum of b must be nonzero mod N for replay. Restricting b to {0,1} makes
      the sum lie in {0,1,2,3,4}, and the zero case must be rejected and its
      probability charged.
    - >-
      Sharing the guess across the four lists creates dependence between the
      lists' key values. The surface's independence premise must be re-examined
      under a shared guess rather than inherited.
    - >-
      The distinction between per-group precomputation and per-target advice is
      easy to blur, and blurring it would let a per-target claim borrow a
      per-group frontier's legitimacy.
    - >-
      The o(1) in the surface hides polylog factors that at mu near 1/3 are
      comparable to the exponent gap being discussed at toy sizes. No toy-scale
      check of this record would be able to resolve mu to better than roughly
      0.05.
  interpretation_limits:
    - Zero runs, no implementation, no curve generation, no ECDLP result.
    - >-
      Statement 2 is a ceiling for ONE key family under ONE method of obtaining
      the missing bits. It is not an impossibility result and explicitly names
      the successor that would break it.
    - >-
      Statement 3 is conditional on an oracle that is never discharged. Supplying
      bits of a discrete logarithm is not a realistic capability and the
      corollary must never be quoted without its hypothesis.
    - >-
      The record depends on IDEA-20260829-390ccc for why the log-interval key is
      the relevant one, and on IDEA-20260829-3f0f4b for the surface. If either is
      falsified, this record's framing, though not its arithmetic, loses its
      motivation.
    - >-
      Both external frontier citations are recalled and unfetched, so the
      preprocessing comparison in statement 3 is UNVERIFIED and is an obligation,
      not a result.
  heuristic_assumptions:
    - id: H1
      statement: >-
        UNIFORM GUESS COST. Each of the 2^k prefix guesses costs one full
        four-list attempt, and exactly one guess yields a relation, so the
        expected number of attempts is 2^(k-1) + O(1) and no guess can be
        eliminated early. Formally, for x uniform on the interval from 0 to N the
        prefix is uniform on 2^k values and no partial transcript from a wrong
        guess is informative. This imitates the standard exhaustive-search
        accounting for a uniformly distributed unknown prefix.
      rigorous_support: >-
        Uniformity of the prefix is exact for x uniform. That no wrong-guess
        transcript is informative is NOT rigorous, because a wrong guess produces
        survivor statistics that could in principle be distinguished from a
        correct guess more cheaply than a full attempt, which would reduce the
        guess factor below 2^k and weaken the ceiling.
      validation_plan: >-
        Two routes. Symbolic, attempt to construct a distinguisher between the
        correct-guess and wrong-guess survivor-count distributions and bound its
        advantage; a distinguisher with advantage delta reduces the guess factor
        by at most 1/delta and the ceiling must be restated accordingly.
        Empirical, separately authorized and not requested here, at
        24 <= log2 N <= 34, over at least 8 curves and at least 200 seeds, record
        the survivor count and cross-collision count distributions under the
        correct guess and under wrong guesses, and compare their empirical CDFs;
        report the Kolmogorov-Smirnov separation and the smallest number of
        attempts at which a threshold test achieves 90 percent accuracy. Tail
        check, the largest survivor count observed under a wrong guess against
        the correct-guess distribution. Transfer assumption, any separation
        observed at log2 N <= 34 is a toy-tier signal and does not establish an
        asymptotic distinguisher, and absence of separation does not prove none
        exists.
    - id: H2
      statement: >-
        BOUNDED-b SUFFICIENCY. Restricting leaf coefficients to b in {0,1} does
        not reduce the achievable relation density, because among four leaves the
        sum of b is nonzero with probability at least 1 - 2^(-4)*C for an
        explicit constant C, so replay succeeds at constant rate. This imitates
        the standard argument that the rank-2 relation lattice supplies ample
        solution multiplicity.
      rigorous_support: >-
        The relation lattice of pairs (a,b) with aP + bQ = O has rank 2 and
        determinant N, which supplies multiplicity in general. That this survives
        the restriction b in {0,1} is a counting statement that is
        straightforward but has NOT been written out here.
      validation_plan: >-
        Symbolic enumeration of the 16 sign and coefficient patterns for four
        leaves with b in {0,1}, recording the exact fraction with nonzero sum of
        b and the exact rejection rate, then the same for b in a range of size B
        to confirm the rate is not an artifact of the binary restriction.
  target_complexity:
    time_exponent: >-
      Guessed bootstrap, N^(1/2 + mu/2 + o(1)) for mu in [0,1/3], that is,
      exactly N^(1/2+o(1)) at best and strictly worse for any nontrivial pruning.
      NO IMPROVEMENT IS CLAIMED. Advised variant,
      N^(max((1+mu)/4,(1-mu)/2)+o(1)) with the oracle hypothesis explicit, giving
      N^(1/3+o(1)) at mu = 1/3.
    memory_exponent: >-
      Guessed bootstrap, N^max((2-s)/4, s/2) with s = 1-mu, which at mu = 0 is
      N^(1/2), equal to BSGS and far worse than rho, and at mu = 1/3 is N^(1/3).
      The guessed route therefore pays BSGS memory to achieve rho time, which is
      a strictly worse Pareto position than rho and must be reported as such.
      Advised variant at mu = 1/3, N^(1/3) memory.
    best_known: >-
      Pollard rho at N^(1/2+o(1)) time and O(1) memory; BSGS at N^(1/2) time and
      memory; van Oorschot-Wiener total work N^(1/2); and, for the advised
      variant only, the preprocessing frontier S*T^2 about N, whose applicability
      to PER-TARGET advice is an explicit open obligation of this record.
    hidden_overhead: >-
      The o(1) hides the O(1) precision loss from carry propagation; the
      rejection rate when the sum of b is zero; the two-pointer scan's sorting
      cost; the per-attempt restart overhead, which at 2^k attempts is multiplied
      and is not negligible in practice; and the p-versus-N translation. Nothing
      superpolynomial is hidden, because no superpolynomial step appears. This
      route's honesty problem is the opposite one, that its per-attempt cost
      looks like N^(1/3) and only the guess factor reveals it is N^(1/2).
    tradeoff_note: >-
      The guessed route at mu = 0 sits at (T,M) = (N^(1/2), N^(1/2)), so
      T^2*M = N^(3/2), strictly OFF and above the T^2*M = N curve occupied by rho
      and by the Wagner-ideal corner, and it is dominated by rho on both axes.
      The advised route at mu = 1/3 sits at (N^(1/3), N^(1/3)) with T^2*M = N,
      exactly on the rho iso-curve, so even with the oracle it is a new point on
      an existing curve rather than a departure from it. Parallelization, the 2^k
      guesses are embarrassingly parallel and each attempt's join is a
      distributed sort, so wall clock divides by the number of processors while
      TOTAL WORK is unchanged, which is exactly the van Oorschot-Wiener profile,
      and therefore the guessed route offers no parallel advantage over it
      either.
  dominated_by: >-
    Dominated by Pollard rho, at N^(1/2+o(1)) time and O(1) memory, on both time
    and memory. Rows checked one by one for prime-field ECDLP, N prime, single
    target, classical. (1) Pollard rho at N^(1/2+o(1)) and O(1) memory DOMINATES
    the guessed route on both axes at every mu, with equal time only at mu = 0,
    where the route still pays N^(1/2) memory. (2) BSGS at N^(1/2) time and
    memory ties the guessed route at mu = 0 and dominates it for mu > 0.
