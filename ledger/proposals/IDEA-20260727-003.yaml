idea:
  id: IDEA-20260727-003
  question_id: RQ-ECDLP-002
  title: >-
    Free-oracle admissibility frontier - measuring the relation-count and
    linear-algebra floor that any prime-field index calculus must clear before
    a decomposition cost is charged
  class: measurement
  claim: >-
    For prime-field Semaev index calculus with factor base size B = N^beta and
    decomposition arity m, the cost floor obtained by making the decomposition
    oracle FREE is F(beta, m) = max(B, c_LA * B^omega_LA) subject to the yield
    constraint B^m >= m! * N, i.e. beta >= 1/m. With omega_LA measured on real
    prime-field relation matrices rather than assumed, the admissible region
    {(beta, m) - F(beta, m) < 0.886 sqrt(N)} is predicted to be EMPTY for every
    m <= 4 and non-empty only for m >= 5. Consequently every index-calculus
    parameterization currently present in this ledger is inadmissible before
    any decomposition cost is charged - EXP-IC-001 at B = 14 and m = 2,
    H-STR-002 and IDEA-20260726-001 at B = ceil(sqrt(N)), and
    IDEA-20260726-005 at B_med > ceil(sqrt(N)). The measurement is falsified if
    omega_LA is measured below 1.5 on real relation matrices, or if a
    yield-admissible (beta, m) point with m <= 4 clears 0.886 sqrt(N) at any
    tested N.
  mechanism: >-
    Any index calculus must (i) collect at least B independent relations, each
    costing at least one group operation to form and verify, and (ii) solve a
    B x B sparse system over Z/n. The total is therefore at least
    max(B, LA(B)) even if every decomposition were free. Yield requires that a
    random target have at least one representation as a sum of m factor-base
    elements, so the number of m-subsets B^m / m! must be at least N, giving
    beta >= 1/m. Substituting beta = 1/m, the relation count is N^(1/m) and the
    linear algebra is N^(omega_LA / m). Against matched rho at 0.886 N^(1/2),
    the linear algebra alone clears rho only when omega_LA / m < 1/2, i.e.
    m > 2 omega_LA. With omega_LA = 2, which is the standard sparse Wiedemann
    charge of about m B^2 matrix-vector operations on a B x B system of row
    weight m, this forces m >= 5. The same inequality read at beta > 1/m is
    strictly worse, because raising beta raises both terms. The identical
    structural statement was reached from the measurement side in an
    independent prior campaign, whose paper states that m-point index calculus
    needs about n^(1/m) relations so the sparse linear algebra alone costs
    about n^(2/m), that for m = 3 this is n^(2/3) > sqrt(n), and therefore that
    m = 3 index calculus cannot beat rho even with a free decomposition oracle,
    with the m = 4 case sitting exactly on the boundary. What that campaign did
    NOT do, and what this measurement adds, is to measure omega_LA and the true
    minimum yield exponent on prime-field relation matrices instead of assuming
    them, and to install the resulting admissible region as a cheap precheck
    that every future proposal in this ledger must pass before compute is
    allocated. The measurement discriminates three outcomes -
    (a) omega_LA near 2 and beta_min near 1/m, so the admissible region needs
    m >= 5 and this ledger's index-calculus lane must either move to m >= 5 or
    record the closure; (b) omega_LA measured below 1.5, for instance because
    prime-field relation matrices are sparse enough that block Wiedemann
    behaves sub-quadratically, in which case m = 4 and possibly m = 3 reopen;
    (c) beta_min measured meaningfully below 1/m, meaning yield is better than
    the counting heuristic and the frontier shifts left.
  novelty_status: known
  novelty_screen:
    screened_on: '2026-07-27'
    corpus_paths_grepped:
      - /Volumes/Volume/git/autolab/research
      - /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006/ledger
    grep_results:
      - >-
        "free decomposition oracle|even with a free|linear algebra alone costs"
        in the report corpus - 1 occurrence, in
        PAPER_prime_field_ecdlp_resistance_map.md section 6.2(iii), read in
        full. That section reports the EXP-020 solve gate - a real m = 3 Semaev
        index calculus solving discrete logarithms end to end with measured
        decomposition-cost exponent about n^0.89 against rho n^0.5, ratio
        growing 21.5 to 205.7 - and gives the structural reason as the
        n^(2/m) linear-algebra floor.
      - >-
        The corpus's standing conservative gate (RT-1476-SUBRES-A1, unchanged
        for 37 consecutive idea-generation rounds per
        idea_generation_20260723_batch4.md) is an m = 5 construction, which is
        consistent with, and is independent corroboration of, the m >= 5
        admissibility conclusion.
      - >-
        In this ledger there is no admissibility precheck of any kind. The four
        parameterizations named in the claim were each proposed without a
        free-oracle floor computation.
    literature_verified: []
    conclusion: >-
      The inequality is standard index-calculus accounting (the Diem and Gaudry
      tradeoff) and is already stated in the external report corpus. No novelty
      is asserted for the inequality. The contribution is measuring omega_LA and
      beta_min instead of assuming them, and turning the result into a
      reusable admissibility gate for this ledger.
  assumptions:
    - >-
      Relation collection cannot cost less than one group operation per
      relation, and the number of independent relations needed is at least
      B - 1 to determine the factor-base logarithms up to scaling.
    - >-
      The yield heuristic B^m / m! >= N is necessary for a random target to
      have an expected decomposition. Collisions among factor-base sums make
      the true requirement stricter, so using the heuristic understates the
      floor.
    - >-
      Sparse Wiedemann or Lanczos over Z/n on a B x B matrix of row weight m
      costs about 2 m B^2 field operations; omega_LA is defined as the
      empirically fitted exponent of measured operation count against B.
    - >-
      Matched rho with negation costs 0.886 sqrt(N) group operations, the
      mandatory baseline for RQ-ECDLP-002.
  predictions:
    - metric: measured_sparse_LA_exponent_omega_LA
      direction: different
      minimum_effect: >-
        Fitted omega_LA lies in [1.9, 2.1] over B in {32, 64, 128, 256, 512} on
        real harvested prime-field relation matrices, with R^2 >= 0.95 on the
        log-log fit. The competing prediction is omega_LA < 1.5, which would
        reopen m = 4 and possibly m = 3.
    - metric: measured_min_yield_exponent_beta_min
      direction: different
      minimum_effect: >-
        The smallest beta at which the expected number of decompositions per
        random target reaches 1 satisfies |beta_min - 1/m| <= 0.05 for
        m in {2, 3, 4}. The competing prediction is beta_min < 1/m - 0.1,
        indicating yield materially better than the counting heuristic.
    - metric: admissible_grid_points_with_m_at_most_4
      direction: different
      minimum_effect: >-
        Zero grid points (beta, m) with m <= 4 satisfy both beta >= beta_min(m)
        and F(beta, m) < 0.886 sqrt(N), at every tested N. A single admissible
        point with m <= 4 falsifies the claim.
    - metric: ledger_parameterization_floor_over_rho
      direction: higher
      minimum_effect: >-
        For each of the four named ledger parameterizations, the ratio
        F(beta, m) / (0.886 sqrt(N)) is at least 1.0 at every tested N, with the
        margin reported. A ratio below 1.0 for any of them falsifies the claim
        for that parameterization.
  minimal_test:
    design: >-
      (1) On toy prime-field curves at bits 12, 16, 20 and 24, build REAL
      relation matrices at m = 2 and m = 3 with B set at beta = 1/m so that
      decompositions actually occur, harvesting genuine verified relations until
      the matrix has rank B - 1; record the harvest cost and the row weight
      distribution. (2) For each harvested matrix, run a sparse Wiedemann or
      Lanczos solve over Z/n, counting field operations and matrix-vector
      products, and fit omega_LA by log-log regression of operation count
      against B over B in {32, 64, 128, 256, 512}. (3) Measure yield by
      exhaustive enumeration of factor-base m-sums at the smallest sizes and by
      uniform sampling with hash-set membership at the larger ones; fit
      beta_min(m) as the smallest beta with expected decompositions per target
      at least 1. (4) Evaluate F(beta, m) = max(N^beta, c_LA N^(omega_LA beta))
      on a grid beta in [0.10, 0.60] step 0.02 and m in {2, 3, 4, 5, 6},
      subject to beta >= beta_min(m), and report the admissible region against
      0.886 sqrt(N) for N in {2^24, 2^32, 2^64, 2^128, 2^256} by extrapolation
      of the fitted exponents only, with the extrapolation flagged as a model
      statement and not a measurement. (5) Evaluate the four named ledger
      parameterizations and report each margin.
    controls:
      - >-
        Matched Pollard rho with negation at 0.886 sqrt(N), honest op count,
        run on the same curves - the mandatory RQ-ECDLP-002 baseline.
      - >-
        Matched BSGS reporting both operations and memory - the second
        mandatory baseline.
      - >-
        Generic preprocessing frontier S * T^2 = Omega(eps N) plotted as the
        multi-target reference so that no single-target claim is confused with
        an amortized one.
      - >-
        Dense-solve control - Gaussian elimination on the same matrices, which
        must fit an exponent near 3. If the fitting procedure cannot separate
        dense from sparse, it cannot be trusted to measure omega_LA.
      - >-
        Random sparse null control - a random matrix of matched dimension and
        row weight. Its fitted omega_LA must agree with the harvested matrices
        within the fit error; a disagreement would indicate that harvested
        prime-field relation matrices carry exploitable structure and is itself
        a reportable signal.
      - >-
        Rank control - every matrix used in the fit must have rank B - 1, so
        that the solve being timed is a solve of a determined system rather
        than of a degenerate one.
    required_metrics:
      - harvested relation count, rank, and row weight distribution per B
      - sparse solve field-operation count and matrix-vector product count per B
      - fitted omega_LA with confidence interval and log-log R^2
      - enumerated and sampled yield per (beta, m), and fitted beta_min(m)
      - F(beta, m) grid and the admissible region boundary per N
      - F / (0.886 sqrt(N)) for each of the four named ledger parameterizations
      - matched rho and BSGS operation counts and BSGS memory
  falsification_conditions:
    - >-
      Any yield-admissible (beta, m) with m <= 4 has F(beta, m) < 0.886 sqrt(N)
      at a tested N - the m >= 5 necessity claim is false.
    - >-
      Fitted omega_LA < 1.5 with R^2 >= 0.95 - the assumed quadratic
      linear-algebra charge is wrong for prime-field relation matrices and the
      frontier must be redrawn.
    - >-
      Fitted beta_min(m) < 1/m - 0.1 for any m - the yield constraint is looser
      than the counting heuristic and the frontier must be redrawn.
    - >-
      The dense-solve control does not fit an exponent near 3, or the rank
      control fails - the measurement apparatus is invalid and the run is
      inconclusive rather than negative.
  confounders:
    - >-
      At toy B the operation count is dominated by constants, so the fitted
      omega_LA may under- or over-state the asymptotic exponent. Reporting the
      fit interval and the residuals is mandatory; a single-point fit is not
      acceptable.
    - >-
      Collisions among factor-base sums reduce the reachable target set, making
      the true yield constraint stricter. The bias direction is known and
      favours the claim, so a confirmation is conservative and a refutation is
      the informative outcome.
    - >-
      The floor charges nothing for descent, nothing for failed decompositions,
      and nothing for the Groebner solve. It can only understate the true cost,
      so it is a necessary condition only.
    - >-
      Extrapolating fitted toy exponents to cryptographic N is a model
      statement. Any figure quoted beyond the measured range must be labelled as
      extrapolation, never as measurement.
    - >-
      Block Wiedemann with many vectors changes constants and parallel
      structure but is charged in the same operation unit; if a block variant is
      used it must be fitted separately rather than pooled.
  interpretation_limits:
    - >-
      Passing the floor is necessary, not sufficient. An admissible (beta, m)
      does not imply that a working algorithm exists at those parameters.
    - >-
      An empty admissible region for m <= 4 is a statement about a specific cost
      model with a free decomposition oracle at toy-measured exponents. It is
      not a proof about prime-field ECDLP and not a statement at cryptographic
      scale.
    - >-
      Excluding the four named ledger parameterizations is a scoping result for
      this ledger's own proposals; it neither refutes nor supports any
      hypothesis about the underlying mathematics.
    - >-
      m >= 5 admissibility does not imply an m >= 5 algorithm is cheap - the
      decomposition cost at m = 5 is exactly the term this floor sets to zero,
      and it is the term that the external corpus's standing conservative gate
      is trying to bound.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  source_refs:
    - ledger/hypotheses/H-IC-001.yaml
    - ledger/hypotheses/H-STR-002.yaml
    - ledger/proposals/IDEA-20260726-001.yaml
    - ledger/proposals/IDEA-20260726-005.yaml
    - /Volumes/Volume/git/autolab/research/PAPER_prime_field_ecdlp_resistance_map.md
