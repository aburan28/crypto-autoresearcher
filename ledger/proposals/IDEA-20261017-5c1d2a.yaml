idea:
  id: IDEA-20261017-5c1d2a
  question_id: RQ-ECDLP-002
  added: '2026-10-17'
  title: >-
    Ring-homomorphic digit section of the SNFS ring: the defect is a carry polynomial confined to a digit
    box at chain length one and out of it at length two (a rule that must fail HEUR-001 uniformity)
  class: measurement
  claim: >-
    p=m^d-c prime; pi=alpha-m generates the degree-1 prime of Z[alpha]=Z[X]/(X^d-c), N(pi)=+-p;
    psi2: Z[alpha]->Z/p^2, alpha->m+p*t0, t0=-1/(d*m^(d-1)), is a ring homomorphism; section
    s(x)=psi2(Babai small-digit lift of x). (A) If F(x~) has digits <=V and F(x~)=pi*w (F=S_3 or the
    x-only doubling numerator, curve A,B in the digit box) then F(psi2 x~)/p = t0*w(m) mod p, digits(w)
    <=d*V/m: the defect lies in a d-digit box; for S_3 on a box D that is |D|^4/p values, compact exactly
    for p^(1/3)<|D|<p^(1/2). (B) The box needs A,B in it (secp256k1 yes, P-256 no). (C) After L>=2
    doublings the weights are derivatives of the doubling map at full-size intermediates: the defect
    leaves every digit box, and the weights depend on the unknown scalar, so no fixed-weight knapsack
    decoder exists.
  mechanism: >-
    PAIR: representation = Babai digit vector over Z[alpha] lifted by psi2 (R1, p-adic section); Sigma =
    one group-law step on lifted x-coordinates, then re-lift. TRICHOTOMY: coordinate-dependent (function
    of x, not of the group element). LOSSY TEST: on the unique-lift box the digit map is a bijection (a
    change of coordinates, not claimed); the tracked object is the carry w, which discards all but the
    carry and is Sigma-compatible because psi2 is a ring map (only division by pi fails to propagate).
    PRICE: decoder = enumerate supp = W^d; no factor base (control). Stage: class (i) of EXP-CANL-1064e0.
  novelty_status: unverified
