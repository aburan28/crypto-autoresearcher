idea:
  id: IDEA-20260813-f7d6cb
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: >-
    Challenge-conditioned MQ geometry: audit whether TCitH transcript openings
    restrict the public quadratic system to atypically low-rank affine slices
  class: composition
  claim: >-
    If a filed TCitH transcript challenge and opening pattern induces public
    affine constraints or partial assignments on the MQOM variables, the
    residual quadratic map must be compared with a random-MQ system subjected
    to the identical restriction, not with an unrestricted random system.  A
    challenge class whose residual polar span, Jacobian rank or effective
    variable/equation ratio is systematically smaller than this matched
    conditioned null could lower the cost of a transcript-conditioned solver
    or invalidate a proof's generic-MQ substitution.  Exact challenge
    enumeration at toy scale and a planted low-rank slice calibrate the audit.
    No transcript format was verified, no residual system was built and no
    solver or forgery claim is made.
  mechanism: >-
    Treat each public challenge/opening pattern c as a restriction operator
    R_c mapping the original MQ polynomial space to an affine slice.  Compute
    the surviving variable dimension, equation rank, polar-form span, common
    radical and Jacobian rank profile of R_c(F).  Generate a matched null by
    sampling random MQ F_0 first and applying the same R_c, preserving all
    public conditioning and coefficient eliminations.  Compare the entire
    distribution over challenge orbits rather than selecting the weakest
    observed challenge.  If a rare weak class exists, its probability and
    any ability to grind or select it are charged separately.  The mechanism
    is restriction-induced geometry, not generic solving degree.
  why_not_a_renamed_known_approach: >-
    IDEA-20260808-aa551f is the nearest neighbor because it studies global-tree
    challenge-space combinatorics.  This proposal treats each challenge as an
    algebraic restriction operator and audits the residual MQ geometry against
    the same restriction applied to random MQ.  IDEA-20260805-7d97be compares
    unconditioned matched random Macaulay behaviour; cec9b6 tracks proof
    dependencies; 7abf04 studies grinding inequality.  No prior summary
    combines exact challenge orbits with restriction-matched polar/Jacobian geometry.
  predictions:
    - observable: exact toy challenge orbit table
      metric: orbit_mass_reconciliation
      predicted: masses sum exactly to one and match exhaustive transcript enumeration
    - observable: residual polar-span rank
      metric: standardized_rank_residual_by_orbit
      predicted: centered at the restriction-matched random null absent scheme-specific structure
    - observable: planted weak challenge class
      metric: recovered_dimension_drop
      predicted: exact planted variable/rank drop with monotone detection over a frozen drop ladder
    - observable: selectable weak-orbit mass
      metric: end_to_end_expected_trial_cost
      predicted: per-attempt restriction/solve cost multiplied by inverse public probability of reaching the declared class
  minimal_test:
    design: >-
      File primary challenge, opening and public reconstruction rules.  At a
      fully enumerable toy parameter slice, list all challenges, quotient them
      by proved public symmetries and derive R_c exactly.  Build the random-MQ
      null before restriction, apply each same R_c, and verify orbit masses.
      Run exact-null and planted weak-slice controls before the actual public
      map.  Report residual dimensions and ranks for every orbit plus weighted
      tails.  No solving-degree run is permitted until a fresh DREG backend
      calibration supersedes EV-DREG-004.
    test_boundary:
      instances: exhaustive toy challenges and later frozen exact-parameter public challenge sample
      parameters: filed challenge distribution, restriction rules, MQ field/variables/equations
      oracle_model: public transcript/challenge generation only
      preprocessing: orbit enumeration, symmetry proof and restriction matrices are charged
      backend_gate: fresh calibrated DREG backend required before any Macaulay or solving-degree extension
      stopping_rule: stop if orbit masses, restriction identities or planted dimension drops fail exact verification
    required_metrics:
      - challenge orbit representatives, sizes and exact probabilities
      - restriction matrix and residual variable/equation counts per orbit
      - polar-span, radical and Jacobian ranks per orbit and matched null
      - weighted lower-tail probability with simultaneous correction
      - grinding/selectability trials, if any, charged separately
      - time, memory, preprocessing and public queries
  controls:
    - name: restriction-matched random MQ
      kind: exact_null
      construction: sample random MQ with exact public dimensions and apply the identical R_c family and challenge distribution
      forced_value: exact toy residual-rank law and calibrated orbit-weighted null
      gate: actual-map comparison is invalid if restriction-matched null is replaced by unrestricted random MQ
    - name: planted weak affine slice
      kind: biased_positive
      construction: >-
        Plant a public challenge orbit whose restriction annihilates a frozen
        k-dimensional variable block while leaving other orbits random.
      forced_value: exact k-dimensional drop and orbit probability fixed before measurement
      gate: smallest planted drop must be recovered with preregistered power
    - name: orbit relabeling control
      kind: structural_control
      construction: permute challenge labels within a proved symmetry orbit
      forced_value: identical restriction invariant and probability
      gate: any change exposes label-dependent instrumentation
  confounders:
    - A restriction can reduce variables and equations proportionally without lowering solving hardness.
    - Challenge symmetries must be proved; an invalid quotient can hide exceptional classes.
    - Weak-class selection may be impossible for an adversary or cost inverse orbit mass.
    - Conditioning the actual map but not the random null creates a guaranteed false signal.
    - TCitH transcript and challenge details remain unverified.
  falsification_conditions:
    - Exact challenge orbit masses do not reconcile with exhaustive toy enumeration.
    - The planted restriction fails to yield its exact dimension/rank drop.
    - Null invariants depend on arbitrary challenge labels within a symmetry orbit.
    - Any claimed weak actual orbit disappears under the correctly restriction-matched null.
    - The residual geometry cannot be constructed from public transcript data alone.
  interpretation_limits:
    - No transcript-conditioned weakness or solve is observed.
    - A low-rank residual slice is not a forgery and requires a complete solver and challenge-acquisition cost.
    - Toy challenge enumeration does not transfer automatically to exact parameters.
    - Null results cover only the declared restriction invariants, challenge family and parameter slice.
  assumptions:
    - Filed public transcript data induces deterministic affine restrictions on a declared MQ representation.
    - Challenge probabilities and any adversarial selection/grinding ability can be computed exactly.
    - Matched random MQ can be subjected to precisely the same restriction operators.
  heuristic_assumptions:
    - id: HEUR-F7D6CB-1
      formal_statement: >-
        Residual polar/Jacobian rank at fixed restricted variable/equation counts
        is a monotone proxy for the exponent of the best generic residual solver.
      rigorous_support: rank defects can expose eliminated directions, but generic solving complexity is not determined by rank alone
      validation_plan: on planted toy restrictions compare exact exhaustive solve counts across equal-size systems with a rank-drop ladder
      falsification_condition: rank drops fail to reduce exhaustive operation counts monotonically
    - id: HEUR-F7D6CB-2
      formal_statement: >-
        The frozen toy orbit taxonomy stabilizes to the same finite set of
        restriction types at larger declared tree depths.
      rigorous_support: protocol symmetry may imply stable types, but no primary derivation has been checked
      validation_plan: derive orbit types symbolically at three increasing toy depths and compare normalized restriction signatures
      falsification_condition: a new restriction type appears at each tested depth without stabilization
  proof_search_map:
    bottleneck: whether proof- or transcript-induced conditioning preserves the random-MQ hardness model at the exact challenge distribution
    baseline_embedding:
      parameter_slice: apply every filed restriction operator to independently random MQ of identical dimensions
      reproduction_check: exhaustive toy challenges reproduce exact residual dimensions and orbit masses
    observation_collision:
      observable: residual variable/equation count
      distinct_preimage_search: >-
        Construct two restrictions with equal counts but different polar radical
        and Jacobian rank, showing counts alone do not identify residual geometry.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: exact affine restriction operator R_c on polynomial coefficients
        predicted_gain: makes transcript conditioning algebraically explicit
      - transform: specialization_pack
        proposed_object: proved challenge-orbit representatives with exact weights
        predicted_gain: replaces cherry-picked weak challenges by a complete weighted portfolio
    quantifier_order: >-
      For every challenge under the filed distribution, derive R_c before
      inspecting actual-map invariants; there exists a weak class only if its
      full orbit and acquisition probability are included.
    method_ceiling:
      strongest_certifiable_claim: scoped residual structural deviation or bound by challenge orbit
      nearby_object_control: equal-count restriction with generic full-rank polar span
    proof_obligations:
      - claim: restriction operator matches public transcript semantics
        responsibility: interface
      - claim: orbit partition is exhaustive with exact mass
        responsibility: correctness
      - claim: matched null applies identical conditioning
        responsibility: baseline
      - claim: weak-orbit acquisition and inverse probability are charged
        responsibility: success_probability
      - claim: solving claims remain gated and out of scope
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No attack exponent.  Audit cost is challenge enumeration or sampling plus
      polynomial exact linear algebra; a later residual solve must multiply
      per-class cost by inverse accessible class probability.
    memory_exponent: orbit/restriction tables plus polynomial matrix storage
    best_known_baseline: IDEA-20260808-aa551f challenge-space combinatorics and IDEA-20260805-7d97be unconditioned matched MQ null
    hidden_overhead_disclosure: orbit proof, restrictions, rare-class sampling, multiplicity, grinding and later solver verification
    time_memory_tradeoff: enumerate and store all toy orbits or stream representatives with recomputed restrictions
    data_queries: public transcript/challenge samples only
    preprocessing: orbit and restriction derivation fully charged
    oracle_model: public challenge/transcript model only
    retry_success_accounting: expected cost equals per-attempt restricted work times inverse probability of an adversarially accessible weak class
  sota_delta: >-
    Quantitative target is per-orbit dimension/rank delta and its exact
    probability; attack/security delta is zero until an end-to-end residual
    solver and acquisition strategy are validated.
  dominated_by: >-
    n/a (no attack result claimed).  All eight current MQOM priors were checked
    across cost axes.  aa551f may dominate pure challenge counting and 7d97be
    generic solving-degree comparisons, but neither dominates the restriction-
    matched residual-geometry interface.  External status is unverified.
  estimated_cost:
