idea:
  id: IDEA-20260816-a67f97
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: 'The ALPF meter reads homogeneous leading forms, not the systems themselves, so every survival
    verdict is a verdict about a truncation: test whether early fall on the leading forms predicts
    early fall on the full inhomogeneous Semaev system, and measure the disagreement rate directly.'
  class: theory
  claim: '(A) The archived meter is described in EXP-ALPF-011''s own text as a ''validated nontrivial-syzygy
    / Bardet-Faugere-Salvy first-fall meter on homogeneous leading forms'', and the per-cell table
    reports a ''leading-form degree profile'' as the input actually fed to the meter. The object being
    metered is therefore not the Semaev system but its top-degree truncation. Every ALPF survival
    verdict is thus a statement about the truncation, and the step from truncation to full system
    is an unstated inference. (B) The claim is that this step is a lossy projection in the inventor-protocol
    sense and that its loss is MEASURABLE by running the identical meter twice per instance -- once
    on the leading forms, once on the full inhomogeneous system via its degree filtration -- and reporting
    the 2x2 agreement table. The disagreement rate in each direction is the quantity: leading-form-fires-but-full-does-not
    is an optimistic bias of the screen, full-fires-but-leading-form-does-not is a pessimistic bias
    that would mean the campaign''s quiet cells are under-reporting. (C) The claim is further that
    the direction of the bias is predictable from the profile: for strongly unbalanced profiles such
    as the archived [1,1,1,24] pullback rows, where the leading forms have degree 1 and the full generators
    degree 24, the truncation discards essentially the entire system and the two verdicts should agree
    only by accident. (D) NOT CLAIMED: that the leading-form meter is wrong; that any ALPF verdict
    flips; that the full-system computation is feasible at any larger scale; that any decomposition
    is faster or slower. A measured disagreement rate scopes what a leading-form verdict licenses.
    The Bardet-Faugere-Salvy semiregularity prediction is itself a heuristic about generic homogeneous
    systems, so the leading-form restriction may be exactly the right domain for it -- in which case
    the measured agreement is high and the campaign is strengthened at no cost to its claim tier.'
  mechanism: 'STAGE 1 (zero compute, symbolic): write out, for each archived profile, the relationship
    between the full Semaev generators and their leading forms, and identify which profiles are near-total
    truncations. The archived table already shows rows such as pullback x=t^2+c with leading-form
    degrees [1,1,1,24] against a full S4_phi total degree of 24, which is a near-total truncation
    on three of four generators. STAGE 2: implement a full-system first-fall meter that works on the
    degree filtration of the inhomogeneous system rather than on its top forms -- concretely, build
    the Macaulay matrix of the full generators up to degree D and detect the first degree at which
    the observed rank exceeds the semiregular prediction, using the same rank routine so the two meters
    differ only in their input. STAGE 3: for every archived cell reproducible at toy size, run both
    meters on the SAME instance in one invocation and record the pair of verdicts. STAGE 4: aggregate
    to a 2x2 agreement table per profile with a McNemar test for asymmetric disagreement, and report
    the disagreement rate in each direction. STAGE 5: run both meters on the three published control
    systems, which are homogeneous by construction and must agree, as a positive check that the two
    meters coincide when the truncation is trivial. Refutation: if the two meters agree on more than
    95 percent of instances at every profile, the truncation is not load-bearing and claim (C) is
    falsified.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'leading form|leading-form' ledger/proposals/ ; grep -ril 'first-fall|first_fall|d_ff'
      ledger/proposals/ ; grep -ril 'ALPF' ledger/proposals/ ; read experiments/EXP-ALPF-011/analysis.md
      meter description and per-cell table, experiments/EXP-ALPF-007/analysis.md pullback degree table,
      experiments/EXP-ALPF-006/analysis.md gate-failure notes on Hilbert-series cancellation, docs/inventor-protocol.md
      section 2.
    results: 'grep for ''leading form|leading-form'' across all 920 proposals returned exactly ONE
      file: IDEA-20260807-1354d8 (RQ-MODEL-e61cb2), which is about a meter with no dynamic range (d_reg
      flat at 2 in every arm) and does not concern homogenisation or truncation. No proposal references
      ALPF. Inside the ALPF artifacts the truncation is stated plainly -- EXP-ALPF-011''s meter line
      says ''validated nontrivial-syzygy / Bardet-Faugere-Salvy first-fall meter on homogeneous leading
      forms'' and its table column is ''leading-form degree profile ... actually fed to the meter''
      -- and EXP-ALPF-007''s pullback table shows the extreme cases (S4_phi total degree 24 against
      factor-base leading degree 1) where truncation is nearly total. EXP-ALPF-006 records the closely
      related algebraic fact that syzygies which cancel in the Hilbert series are invisible, which
      is a different loss channel and is cited as such. Nothing in the ledger measures leading-form-versus-full
      agreement.'
    verdict: 'UNVERIFIED. No claim is made about external literature; the Bardet-Faugere-Salvy semiregularity
      framework is referenced only as the archived analysis names it, with no assertion about what
      any publication contains. Assembled from known parts: the homogenisation/truncation distinction
      is standard algebra, the meter and its controls already exist in the archive, and the 2x2 agreement
      design is elementary. Claimed new relative to this repository: (i) naming the truncation as
      the ALPF lane''s central unmeasured lossy projection and treating the disagreement rate as the
      deliverable; (ii) running both meters on the same instance in one invocation so the comparison
      is paired rather than across-cell; (iii) predicting the bias DIRECTION from profile imbalance,
      which makes a single 2x2 table falsify a stated mechanism rather than merely describe a discrepancy.'
  object_first_candidate:
    tracked_object: The pair of verdicts (leading-form verdict, full-system verdict) produced by two
      meters on one and the same Semaev instance -- that is, the truncation map itself, instrumented
      by its effect on the screen's output.
    lossiness: 'Genuinely lossy, and this entry exists to quantify exactly how lossy. The leading-form
      projection sends each generator to its top homogeneous component, discarding every lower-degree
      term. This is compatible with the meter''s operation because the semiregularity prediction the
      meter compares against is defined for homogeneous systems, so the retained part propagates through
      the Macaulay construction with a well-defined predicted Hilbert series. What is discarded --
      the lower-order terms -- is precisely what encodes the curve''s affine structure and the factor-base
      membership conditions, and for profiles like [1,1,1,24] it is almost everything. Non-injectivity
      is extreme: infinitely many Semaev systems share a leading-form profile.'
    propagation: One step of the target operation, degree increment D -> D+1, acts on both components.
      On the leading-form component it appends one Hilbert-function comparison exactly as in the homogeneous
      theory. On the full-system component it appends a comparison in the associated graded object
      of the degree filtration, which coincides with the leading-form comparison if and only if no
      lower-order term contributes a new leading term at that degree -- that is, if and only if the
      generators form a Groebner-like configuration with respect to the degree filtration. The measurable
      consequence is that the two verdict components can only diverge at degrees where a lower-order
      term produces a new leading term, which gives the experiment a specific degree to watch rather
      than a global comparison.
    survival_score: 'The pair survives as a coherent object up to the degree ceiling, but the two
      components are predicted to decouple early on unbalanced profiles: for [1,1,1,24] the leading-form
      component reaches its verdict at degree 1 (the archived table shows d_ff = 1, D_reg = 1) while
      the full system''s first informative degree is far higher, so the pair dissolves almost immediately.
      For balanced profiles like [4,4,4,12] the pair is predicted to survive to the ceiling in agreement.
      The imbalance ratio max(d_i)/min(d_i) is the concrete parameter along which the structure dissolves,
      and it is 24 for the extreme archived row and 3 for the baseline.'
  null_object_control: The null object is a homogeneous random system with the identical leading-form
    profile -- for which the two meters are, by construction, reading the same input, since a homogeneous
    system equals its own leading forms. Running both meters on the null must produce EXACT agreement
    on every instance; any disagreement is a bug in one of the two implementations and voids the whole
    comparison. The three published control systems serve the same role and must also agree exactly.
    For the signal arm to mean anything, the null must show a 100 percent agreement rate and the published
    control rows must be reproduced by both meters independently. A second null, a random inhomogeneous
    system with the same profile and randomly drawn lower-order terms, bounds how much disagreement
    arises from generic lower-order terms rather than from curve structure.
  discriminated_from:
  - IDEA-20260807-1354d8 (RQ-MODEL-e61cb2) diagnoses a meter with no dynamic range on the representation
    question. That is a range problem; this is a domain problem -- the meter has range but is reading
    a truncated input, and the disagreement rate is a different quantity from the dynamic range.
  - EXP-ALPF-006's finding that Hilbert-series-cancelling syzygies are invisible is a loss channel
    INSIDE the homogeneous theory. The truncation loss studied here occurs before the homogeneous
    theory is entered, and the two can be present independently; the experiment reports both.
  - The DREG lane (IDEA-20260815-ad4b55, IDEA-20260815-b751cf) studies the degree of regularity as
    a function of system parameters. This proposal holds every system parameter fixed and changes
    only which representative of the instance the meter reads, which the DREG lane never varies.
  - IDEA-20260815-f558e4's propagation ceiling / one-step rigidity bound concerns how far a tracked
    object survives one group operation. This tracks no group-theoretic object at all; it tracks a
    pair of algebraic verdicts on a fixed system and never applies the group law.
  - EXP-ALPF-007's pullback table compares D_reg and d_ff of pullback versus baseline systems. That
    is a comparison ACROSS systems; this is a paired comparison of two readings of the SAME system,
    which is why McNemar rather than a two-proportion test is the right instrument.
  assumptions:
  - The archived meter reads homogeneous leading forms as its analysis text states, and the 'leading-form
    degree profile' column is the actual input.
  - A full-system meter on the degree filtration can be implemented with the same rank routine, so
    the two meters differ only in input construction.
  - The semiregular prediction D_reg_pred is computed from the same profile in both meters, so any
    disagreement is attributable to the observed side rather than the predicted side.
  - Toy instances at the archived sizes are small enough that the full-system Macaulay matrix at the
    ceiling degree fits in memory, which is the binding constraint since full generators have degree
    up to 24.
  - Homogeneous systems are fixed points of the truncation, giving a null with a forced 100 percent
    agreement rate.
  predictions:
  - metric: verdict agreement rate on the homogeneous null arm
    direction: higher
    minimum_effect: 1.0
  - metric: verdict agreement rate for balanced profile [4,4,4,12]
    direction: higher
    minimum_effect: 0.9
  - metric: verdict agreement rate for extreme profile [1,1,1,24]
    direction: lower
    minimum_effect: 0.6
  - metric: McNemar asymmetry between leading-form-only fires and full-only fires
    direction: different
    minimum_effect: 'refuse to pre-commit the direction: the archived rows show the truncation both
      lowering degrees (pullback rows d_ff = 1) and leaving them unchanged (baseline rows), so a signed
      prediction would be guesswork'
  minimal_test:
    design: Two profiles, one prime, paired design. Take the balanced x-ring baseline [4,4,4,12] and
      the extreme pullback profile [1,1,1,24], both present in the archived EXP-ALPF-011 and EXP-ALPF-007
      tables at 13-bit primes and |FB| = 4. Build 40 toy instances of each; for every instance run
      both meters in the same process on the same generator list, one reading the top forms and one
      reading the full generators. Record the paired verdicts. In the same invocation run 40 homogeneous
      null systems per profile, on which the two meters must agree perfectly, plus the three published
      control rows. The discriminating comparison is a single McNemar test per profile plus the absolute
      agreement rate. A near-100 percent agreement on the balanced profile with a materially lower
      rate on the extreme profile confirms the mechanism; equal high agreement on both falsifies claim
      (C) cheaply.
    controls:
    - Homogeneous null arm on which the two meters must agree on 100 percent of instances, run in
      the same invocation.
    - Random-inhomogeneous null arm with the same profile and random lower-order terms, bounding generic
      truncation disagreement.
    - The three published meter control rows, metered by both implementations independently.
    - 'Rank-routine identity check: both meters call the same rank function on matrices built by different
      builders, asserted programmatically.'
    - 'Degree-ceiling parity: both meters run to the same maximum degree, with ceiling hits reported
      per meter.'
    required_metrics:
    - paired 2x2 verdict agreement table per profile
    - McNemar statistic and p-value per profile
    - agreement rate on the homogeneous null arm
    - d_ff from each meter per instance
    - first degree at which the two meters' observed Hilbert values diverge, per instance
    - profile imbalance ratio max(d_i)/min(d_i) per profile
    - peak Macaulay dimensions per meter per instance
  falsification_conditions:
  - Agreement above 95 percent at every profile including the extreme ones, falsifying claim (C) and
    establishing the truncation as not load-bearing at toy scale.
  - Any disagreement on the homogeneous null arm, which indicates an implementation bug and voids
    all signal-arm results.
  - Failure of either meter to reproduce the published control rows.
  - The full-system meter exceeding the memory budget on the degree-24 generators, in which case the
    extreme profile is reported as not measurable and the claim is scoped to profiles that fit.
  - Divergence degree distributed uniformly rather than concentrated at degrees where lower-order
    terms produce new leading terms, falsifying the propagation account.
  confounders:
  - The full-system meter's semiregular prediction may not be the appropriate baseline for an inhomogeneous
    system, so a disagreement could reflect a mis-specified predictor rather than a truncation effect.
  - Full generators of degree 24 produce very large Macaulay matrices, so a ceiling hit on the full
    meter and not on the leading-form meter would manufacture disagreement artificially; ceiling parity
    is controlled but the budget may still bind asymmetrically.
  - The archived 'structured' curve family is undocumented, so instances built here may not match
    the ones whose profiles are being reused.
  - Small primes allow accidental degeneracies that affect the full system more than its top forms.
  - Homogenisation conventions (which variable is homogenising, whether the system is already homogeneous
    in a weighted grading) can differ from the archive's, silently changing the truncation.
  interpretation_limits:
  - A measured disagreement rate scopes what a leading-form verdict licenses at these profiles and
    sizes; it does not correct any archived verdict, since the archived runs are immutable and were
    metered on the truncation by design.
  - High agreement does not validate the semiregular predictor, only that the two inputs give the
    same answer under it.
  - No decomposition, solving cost, or security consequence follows in either direction.
  - Results are confined to toy sizes where the full-system Macaulay matrix fits, which excludes exactly
    the largest-degree profiles that claim (C) says are most affected.
  target_complexity:
    time_exponent: No attack exponent is claimed. The full-system meter is strictly more expensive
      than the leading-form meter at the same degree, by a factor equal to the ratio of monomial counts,
      which is reported per cell.
    memory_exponent: No attack memory exponent is claimed. The full-system Macaulay matrix at degree
      D for generators of total degree up to 24 is the binding resource and is the reason the extreme
      profile may be unmeasurable.
    best_known: The incumbent instrument is the archived leading-form first-fall meter of EXP-ALPF-010
      and EXP-ALPF-011, whose published validation is three homogeneous control systems on which the
      truncation is trivial and therefore cannot expose this loss channel at all. The incumbent for
      the underlying problem remains Pollard rho at roughly sqrt(n) group operations, untouched.
    hidden_overhead: 'The human cost is in specifying a defensible semiregular predictor for the inhomogeneous
      side; the archived analysis gives one only for homogeneous systems, and choosing the wrong one
      converts a truncation study into a predictor study. Lower-order term: the full-system Macaulay
      build is memory-bound in a way the leading-form build is not, so the two arms have asymmetric
      failure modes that must be reported rather than averaged.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed across time, memory and data/queries:
    nothing here lands on an ECDLP attack frontier so no row dominates it. On the instrument axis
    the leading-form meter strictly dominates this paired procedure in cost (one build instead of
    two, smaller matrices) and is strictly dominated in information (it cannot see its own truncation
    loss), which is the entire point.'
  sota_delta: 'No attack; conceptual and measurement contribution only. Quantitatively: the incumbent
    validation exposes the truncation on zero instances, because all three published controls are
    homogeneous and hence fixed points of the truncation; this measures the disagreement on 80 or
    more paired instances across at least two profiles with a McNemar test. Zero change to any ECDLP
    time or memory exponent.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the truncation is correctly identified as the meter''s actual input:
    0.85, since EXP-ALPF-011''s own text says so twice. That a defensible inhomogeneous first-fall
    meter can be specified and implemented: 0.55 -- this is the weak joint, because the semiregular
    predictor is a homogeneous notion and its inhomogeneous analogue is a modelling choice a Coordinator
    must fix. That agreement is materially lower on extreme profiles than balanced ones (claim C):
    0.6, mechanically motivated by the [1,1,1,24] rows where the truncation discards nearly everything.
    That the extreme profile is measurable at all within the memory budget: 0.4, and if it is not,
    the entry still delivers the balanced-profile agreement rate and an honest not-measurable record
    for the rest.'
