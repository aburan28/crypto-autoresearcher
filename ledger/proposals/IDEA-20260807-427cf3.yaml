  confounders:
    - >-
      PRESENTATION DEPENDENCE. The profile depends on the monomial order and on
      how the Macaulay matrix is built. Two records comparing profiles built
      differently are comparing nothing. The construction is frozen and printed.
    - >-
      FIELD EQUATIONS. Whether x^p - x is included as a generator changes the
      profile materially. The convention is frozen before Stage 3 and reported
      with every number, exactly as IDEA-20260806-e4f96e requires for the same
      matrix.
    - >-
      FACTOR-BASE CONTENT. A factor base that accidentally contains a 2-torsion
      x-coordinate or x(R) will produce a difference that looks like a class
      effect. Every factor base's 2-torsion content is computed and recorded
      before use, not after a surprising result.
    - >-
      SMALL B. At B < 5 the profile is short and many curves will agree
      trivially. B must be swept and the shortest profiles reported separately.
    - >-
      GAUGE CONFLATION. The two gauge arms answer different questions and must
      never be pooled: (5a) tests the algebra, (5b) tests membership.
    - >-
      IMPORTED DEPENDENCY. (C1) is imported from IDEA-20260807-0ff796. If that
      record is superseded, this one inherits the change and must be re-checked;
      the dependency is declared so the inheritance is visible.

  interpretation_limits:
    - >-
      This closes ONE functional at ONE arity in ONE presentation for factor
      bases avoiding the rational 2-torsion, at toy scale. It says nothing about
      arity >= 3, nothing about solver behaviour, nothing about the ECDLP.
    - >-
      Because the matched-shape null is predicted to agree, a class-invariance
      verdict here is a verdict about transverse intersections of (2,2) curves
      with grids. It must be reported in those terms and not as a statement
      about elliptic-curve structure.
    - >-
      The surviving 2-torsion channel has expected size rB/p < 1 at every toy
      and cryptographic parameter with B = p^{o(1)}, so exhibiting it requires
      deliberate loading and is not something an ordinary attacker would meet.
    - >-
      Nothing here interacts with KN-TECH-005: that bounds generic algorithms,
      this describes an algebraic system's Hilbert function.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V of size B drawn uniformly from F_p, the number of
        non-transverse columns is Binomial(B, r/p) with mean rB/p <= 3B/p, so
        the derived channel fires with probability below one per instance in the
        entire toy range.
      rigorous_support: >-
        Exact rather than heuristic for uniform V, since the r roots of f form a
        fixed set of size r <= 3 inside F_p. The heuristic component is only
        that the harness's hashed factor-base generator is close enough to
        uniform, which imitates the standard modelling of a deterministic hash
        as a uniform sampler.
      validation_plan: >-
        Count 2-torsion elements in >= 1000 generated factor bases per (p, B)
        and test against Binomial(B, r/p) by exact chi-square. A deviation is an
        instrument finding about the generator and is reportable in its own
        right. TOY SCALE, labelled.
    - id: H2
      statement: >-
        A transverse intersection of a smooth (2,2) curve with a B x B grid of
        lines yields a radical ideal whose Hilbert function is determined by B
        and the bidegree alone, independently of the curve's coefficients.
      rigorous_support: >-
        The rigorous ingredient is that a transverse intersection of a smooth
        curve with a reduced complete intersection is reduced, and that the
        Hilbert function of a reduced finite scheme in general position is
        determined by its length. The heuristic ingredient is "in general
        position": collinearity or other special position among the intersection
        points could still move the Hilbert function, and that is exactly what
        the class sweep tests empirically rather than assumes.
      validation_plan: >-
        Compare profiles across the class (Step 3) and against the matched-shape
        random (2,2) null (arm 4). If the random null and the Semaev systems all
        agree, general position holds at this scale; if the Semaev systems agree
        with each other but differ from the random null, the intersection points
        of a Semaev system are in SPECIAL position, which would be a genuinely
        interesting structural observation and would refine H2 rather than
        refute the class-invariance conclusion. TOY SCALE, labelled.

  reachability_gate: >-
    UNDER OUTCOME F, T5 IS MOOT: a constant functional has no minimiser. UNDER
    OUTCOME T the minimiser is a class member with a particular r, and the gate
    is PASSED exactly as in IDEA-20260807-0a3272 -- r is computable in
    O(log^2 p) by factoring a cubic at any vertex, so goodness is locally
    detectable and hill-climbing along the 2-volcano costs polylog(p), against a
    0.886 sqrt(N) baseline. BUT the prize is bounded by the derived channel
    size: the profile difference exists only when the factor base contains a
    2-torsion x-coordinate, which happens with probability rB/p < 1 by accident
    and must otherwise be forced by loading, at the cost of shrinking the usable
    factor base by up to 3 elements. So the reachable prize is at most a
    bounded, computable change in one integer sequence -- reachable and
    negligible, and the record states both halves. UNDER OUTCOME U the
    reachability question is reopened along with everything else.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The record's own cost: rank of a
      Macaulay matrix with binomial(2 + D, D) columns per degree D, times the
      class size ~ p^{1/2}, so about p^{1/2} rank computations per class -- far
      above the 0.886 sqrt(N) baseline and feasible only at toy scale.
    memory_exponent: >-
      The Macaulay matrix dominates: binomial(2 + D, D) columns and O(B^2) rows
      at the relevant degrees. Peak memory is measured per cell and is the
      binding constraint on how large B can go, exactly as in
      IDEA-20260806-e4f96e.
    best_known: >-
      0.886 sqrt(N) group operations at O(1) memory (KN-TECH-001, KN-TECH-006,
      with the negation discount per KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
      (KN-TECH-031). For the decomposition step: KN-TECH-003's heuristic and the
      program's DREG-lane degree measurements (KN-TECH-004, KN-TECH-011). None
      is changed.
    hidden_overhead: >-
      Everything hides inside "in this presentation" and "at arity 2". A Hilbert
      function is not an invariant of the variety; it is an invariant of the
      ideal in a chosen presentation, and a different Macaulay construction can
      give a different profile for the same mathematics. Both qualifiers must
      appear in every downstream sentence, and the record refuses to state a
      profile without its construction.
    tradeoff_note: >-
      Not applicable; no algorithm produced. The one real trade is in the loaded
      arm: gaining the 2-torsion channel costs up to 3 factor-base slots, and
      that cost is charged rather than ignored.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK: none mounted, so
    dominated on every axis by parallel rho at 0.886 sqrt(N) with O(1) memory
    (KN-TECH-001, KN-TECH-006), by the automorphism-discounted variant
    (KN-TECH-018) and by BSGS at sqrt(N) time and memory (KN-TECH-031). As a
    COST INSTRUMENT for the decomposition step, the incumbents are the degree of
    regularity and the first-fall degree (KN-TECH-004, KN-TECH-011,
    src/ic_first_fall_fast.py); this record dominates them on RESOLUTION (a full
    profile rather than a single degree) and is dominated by them on SCALE and
    MATURITY, since a rank profile costs far more than reading one degree off a
    solver run and is feasible only at small B. Against IDEA-20260806-e4f96e it
    is neither dominant nor dominated: same matrix, orthogonal question, and the
    two share an implementation. dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline. Closure delta, quantitatively: it
    reduces the class-dependence of the entire arity-2 algebraic-solver cost
    family to a SINGLE named channel -- factor-base elements v with f(v) = 0 --
    of expected multiplicity rB/p <= 3B/p per instance, which is below 1 for
    every B = p^{o(1)}; and it upgrades the lane's algebraic functional from a
    single degree to a full rank profile, which is strictly more resolution at
    the cost of one rank computation per degree. It also supplies
    IDEA-20260807-0a3272 with a derived mechanism in place of a hypothesised one
    and supplies IDEA-20260806-e4f96e with the observation that, if the profile
    is class-invariant, that record's refutation-degree sweep need not be
    repeated per curve within a class.

