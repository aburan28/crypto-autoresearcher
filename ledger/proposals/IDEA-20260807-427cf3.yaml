    - >-
      Profiles differ across a class at a clean factor base (OUTCOME U). Either
      (C1) or (C2) is wrong, or a degeneracy exists that neither covers. This is
      the most valuable outcome and it must be pursued, not explained away.
    - >-
      The gauge-with-transported-factor-base control shows any change. The
