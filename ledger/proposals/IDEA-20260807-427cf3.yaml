idea:
  id: IDEA-20260807-427cf3
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    THE FINEST ALGEBRAIC FUNCTIONAL IN THE LANE, AND A DERIVATION THAT FORCES
    IT: the Macaulay rank profile and Hilbert function of the Semaev
    decomposition ideal are determined by the factor-base size alone, because
    the relation locus is a SMOOTH (2,2) curve for every non-2-torsion target
    and its intersection with the factor-base grid is transverse EXCEPT at
    factor-base elements v with f(v) = 0 -- so the only route by which an
    algebraic-solver cost can vary within a class is the rational 2-torsion, and
    that route is quantified here rather than searched for
  class: measurement

  claim: >-
    (A) THE FUNCTIONAL, AND WHY IT IS FINER THAN SOLVING DEGREE. Fix E/F_p, a
    target R, a factor base V of size B, and the ideal
        I(E, V, R) = < S_3(x1, x2, x(R)), f_V(x1), f_V(x2) >
    where f_V(x) = prod_{v in V} (x - v). The MACAULAY RANK PROFILE is the
    function D |-> rank M_D, where M_D is the Macaulay matrix in degree D built
    from the generators times all monomials of complementary degree; equivalently
    the Hilbert function of the quotient. Solving degree and first-fall degree
    are single numbers read off this profile; the profile itself is strictly more
    information and is what a rank-based or XL-style solver actually pays for
    (KN-TECH-004, KN-TECH-011, KN-TECH-053).

    (B) WHY IT COULD DEPEND ON THE EQUATION AND NOT ONLY ON (p, N, t). For a
    GENERIC system, the Hilbert function is determined by the degrees alone. The
    Semaev system is emphatically not generic: S_3's coefficients are polynomials
    in (a, b), the system is over-determined (three generators in two
    variables), and the Hilbert function of an over-determined system JUMPS on
    proper closed subschemes of coefficient space -- exactly where the
    intersection acquires multiplicity or the ideal fails to be radical. Since
    (p, N, t) do not determine (a, b), and an isogeny class is a finite set of
    j-invariants (the roots of a Hilbert class polynomial mod p), the question
    "does the class meet the degeneracy locus" is a genuine question with no a
    priori answer. That is the whole reason the functional belongs in L1.

    (C) THE DERIVATION, WHICH ANSWERS IT. Two facts compose.
      (C1) SMOOTHNESS. For R in E(F_p) with 2R != O and R != O, the affine curve
        C_R : S_3(x1, x2, x(R)) = 0 is F_p-ISOMORPHIC TO E via
        P |-> (x(P), x(R - P)) -- see IDEA-20260807-0ff796 (B) for the
        injectivity argument and the arithmetic-genus computation. In
        particular C_R is SMOOTH and geometrically irreducible for EVERY
        non-singular E and every such R. There is no curve in any class where
        C_R degenerates. So the first and most obvious source of a Hilbert-
        function jump -- a singular or reducible relation locus -- DOES NOT
        EXIST.
      (C2) TRANSVERSALITY. The remaining source is tangency of C_R to the grid
        V x V. C_R meets the vertical line x1 = v non-transversally iff the
        quadratic x2 |-> S_3(v, x2, x(R)) has a double root, i.e. iff its
        discriminant vanishes. S_3 is symmetric in its three variables and the
        classical identity disc_{x3} S_3 = 16 f(x1) f(x2) therefore gives
        disc_{x2} S_3(v, ., x(R)) = 16 f(v) f(x(R)). Since R is a rational
        non-2-torsion point, f(x(R)) is a non-zero square. HENCE THE
        INTERSECTION IS NON-TRANSVERSE AT x1 = v IF AND ONLY IF f(v) = 0, i.e.
        iff v is the x-coordinate of a rational 2-torsion point.
      CONCLUSION: I(E, V, R) is a radical, transverse, complete intersection
      whenever V contains no 2-torsion x-coordinate, and in that case its
      Hilbert function is a function of B and the degrees ALONE -- hence a class
      invariant, hence closed for this functional.
      NAMED OBSTRUCTION (O-TRANSVERSE): the relation locus is smooth on every
      curve in every class, and its only possible tangency to the factor-base
      grid sits at the rational 2-torsion, whose size is at most 3 out of p.

    (D) THE EXACT SIZE OF THE SURVIVING ROUTE, COMPUTED BEFORE MEASUREMENT. Let
    r = #{x : f(x) = 0} in {0, 1, 3}. For a uniformly random factor base of size
    B, the expected number of non-transverse columns is rB/p <= 3B/p, which is
    BELOW 1 for every (B, p) in the toy range and for every cryptographic range
    with B = p^{o(1)}. So the only class-varying route to a Hilbert-function
    difference has expected multiplicity below one element. It can be forced to
    fire only by DELIBERATELY loading the factor base with 2-torsion
    x-coordinates -- which costs factor-base diversity and is charged.
    THE CONSEQUENCE FOR THE LANE: the algebraic-solver cost family is
    class-invariant except through a channel of expected size 3B/p, and that
    number, not a hand-wave, is the closure.

    (E) THE THREE OUTCOMES, ALL DELIVERABLES.
      OUTCOME F (forced): the measured rank profile is identical across every
        member of a class at a common factor base containing no 2-torsion
        x-coordinate. The derivation is confirmed and the finest algebraic
        functional in the lane is closed.
      OUTCOME T (tangency-explained): profiles differ, and every difference is
        traced to a factor base containing a 2-torsion x-coordinate. The
        derivation is confirmed AND the surviving channel is exhibited, which
        supplies IDEA-20260807-0a3272 with its mechanism (C2) rather than
        leaving it hypothetical.
      OUTCOME U (unexplained): profiles differ with no 2-torsion element
        present. Then (C1) or (C2) is wrong, or a degeneracy exists that neither
        covers -- a fourth escape hatch in the sense of IDEA-20260807-dc14b4,
        and the most valuable outcome available to this record.

  resource_label: >-
    R1 (x-coordinates as field elements: the Macaulay matrix is built over F_p
    from coordinate data) + R2 (the curve equation, which supplies S_3's
    coefficients and hence the matrix entries) + R5 in the surviving channel
    only (the rational 2-torsion, which is torsion at ell = 2 != N).
  admissibility: admissible
  admissibility_argument: >-
    The Macaulay matrix is built from polynomial coefficients over F_p. No
    generic-group algorithm can construct it: it has no access to a, b, or to
    x-coordinates as field elements, only to opaque group handles. This is the
    R1/R2 line of DECOMPOSITION.md section 2 and it is disjoint from the oracle
    classes KN-FIND-b7e091 closes, both of which return group elements.
    H-ENDO-001 is untouched: no endomorphism is applied to any point of G, and
    the 2-torsion enters as a property of the CUBIC, not as a group element
    supplied to an algorithm working in G.

  discriminated_from:
    - >-
      IDEA-20260806-e4f96e, which computes the POLYNOMIAL CALCULUS refutation
      degree of an unsatisfiable Semaev system by rank on the same Macaulay
      matrix. That record measures a solver-independent LOWER BOUND for a fixed
      curve as (m, p, density) vary. This record measures whether the RANK
      PROFILE is constant ACROSS AN ISOGENY CLASS at fixed (m, p, B). Same
      matrix, orthogonal questions, and the two are mutually useful: if this
      record shows the profile is class-invariant, then e4f96e's degree is too,
      and e4f96e need not repeat its sweep per curve. That inference must be
      stated in both records or in neither.
    - >-
      IDEA-20260807-0ff796, which counts the SOLUTIONS of the same system. The
      solution count is p - 1 - t restricted to V x V; the rank profile is the
      scheme structure of the same intersection. A system can have a
      class-invariant solution count and a class-varying profile if the
      multiplicities differ -- which is exactly what (C2) rules out, so the two
      records reach the same verdict by genuinely different arguments and each
      is a check on the other.
    - >-
      IDEA-20260807-0a3272, which measures a 2-torsion stratification
      empirically. This record DERIVES the mechanism that record hypothesises,
      and derives the forced value 3B/p that bounds it. If this derivation
      fails, 0a3272 loses mechanism (C2) and must stand on ramification alone;
      0a3272 says so.
    - >-
      KN-TECH-004 and KN-TECH-011 (degree of regularity, first-fall degree, F4/
      F5). Those are single numbers read from a solver's execution. The rank
      profile is the whole curve and is a property of the system; the record
      measures the profile and reports the derived numbers as its consequences,
      never the other way round.

  object_first_candidate:
    tracked_object: >-
      THE SCHEME STRUCTURE OF THE INTERSECTION C_R cap (V x V): the finite
      subscheme of the plane cut out by the Semaev ideal, followed across a
      complete isogeny class, and summarised by the Macaulay rank profile
      D |-> rank M_D.
    lossiness: >-
      GENUINELY LOSSY. The profile forgets where the solutions are, forgets the
      curve, forgets a, b and j, and retains only a non-decreasing integer
      sequence. LOSSY-PROJECTION TEST APPLIED: what is discarded -- the
      coordinates of the intersection points -- is discarded COMPATIBLY with the
      operations an algebraic solver performs, because linear algebra on the
      Macaulay matrix is invariant under any linear change of the monomial basis
      and reads only ranks; the retained sequence therefore propagates
      deterministically under exactly the operations at issue (multiplying
      generators by monomials, row reduction). It is NOT a change of coordinates:
      a B^2-cell grid and a curve collapse to a short integer sequence, and many
      distinct systems share a profile -- the observation-collision entry below
      exhibits that explicitly.
    propagation: >-
      Under gauge: the profile is INVARIANT, because the gauge dilation
      (x1, x2) -> (u^2 x1, u^2 x2) is a linear change of variables that carries
      the ideal to the ideal of the dilated factor base, and rank is invariant
      under invertible linear substitution -- PROVIDED the factor base is
      transported with it. If the factor base is a fixed coordinate window and
      is NOT transported, the profile is gauge-dependent through the changed
      membership only, not through the algebra. That distinction is measurable
      and is one of the record's controls.
    survival_score: >-
      Survives change of curve within a class, change of gauge with transported
      factor base, and change of target away from E[2]. Dies at R in E[2] (C_R
      degenerates), at arity m >= 3 (the locus is no longer a curve and (C1)
      gives out), and at any monomial order or Macaulay construction different
      from the declared one -- the profile is a property of the presentation as
      well as the ideal, and that is stated rather than hidden.

  mechanism: >-
    STEP 1 -- SYMBOLIC PREREQUISITES, ZERO COMPUTE, HARD GATE. (i) Re-derive
    disc_{x3} S_3 = 16 f(x1) f(x2) in sympy and confirm the symmetry of S_3 that
    licenses the substitution used in (C2). (ii) Confirm that
    S_3(v, ., x(R)) is a genuine quadratic in x2 for v not equal to x(R), i.e.
    that its leading coefficient (x(R) - v)^2 is non-zero -- the record's one
    unstated edge case, and it is stated here: v = x(R) makes the leading
    coefficient vanish and must be excluded from V or handled separately.
    (iii) Re-derive the arithmetic-genus and injectivity facts of (C1) or import
    them from IDEA-20260807-0ff796's Stage 1 with an explicit dependency.

    STEP 2 -- BUILD THE MACAULAY PROFILE. For a declared monomial order
    (grevlex, matching harness/semaev.py) and degree bound D_max, construct M_D
    for D = 1..D_max over F_p and compute ranks by Gaussian elimination modulo
    p. Report the full profile, not only the threshold at which the ideal
    becomes trivial. This is the same machinery IDEA-20260806-e4f96e needs and
    the two records should share one implementation, with the shared code path
    named in both.

    STEP 3 -- THE CLASS SWEEP AT A CLEAN FACTOR BASE. For every member of a
    complete toy class, at a COMMON factor base V containing no 2-torsion
    x-coordinate and not containing x(R), and at a transported target with a
    verified certificate, compute the profile. PREDICTION FROM (C): the profiles
    are IDENTICAL, element for element, across the entire class. This is an
    exact integer-sequence comparison, with no statistical threshold, and it is
    the record's decisive test.

    STEP 4 -- THE LOADED ARM, WHICH EXHIBITS THE SURVIVING CHANNEL. Repeat with
    V deliberately containing all r rational 2-torsion x-coordinates of the
    member (so the arm is only defined on members with r >= 1). PREDICTION: the
    profile now DIFFERS between r = 1 and r = 3 members, by an amount that
    reflects the extra multiplicity. Measuring the exact difference converts the
    derivation into a quantified channel.

    STEP 5 -- THE GAUGE CONTROL IN BOTH FORMS, WHICH SEPARATES ALGEBRA FROM
    MEMBERSHIP. (5a) TRANSPORTED FACTOR BASE: apply the gauge dilation to V as
    well as to the curve. The profile must be EXACTLY unchanged, because the
    substitution is linear and invertible. This is a forced value and observing
    it is an instrument check. (5b) FIXED WINDOW: keep V = [0, W) fixed while
    the curve is gauged. The profile may change, entirely through membership.
    Reporting both is what prevents a membership effect being read as an
    algebraic one.

    STEP 6 -- THE NEARBY-OBJECT CONTROL. Run the pipeline with R in E[2]. There
    (C1) fails, C_R degenerates, and the profile MUST differ. If it does not,
    the profile is not reading the geometry and no conclusion may be drawn from
    Step 3's agreement.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07: "first.fall degree|first_fall|solving degree|degree
      of regularity" over the repository (60+ files); "birational|genus.1 curve|
      \\(2,2\\).curve|relation locus|C_R" over *.md, *.yaml, *.py;
      "isogeny class" over the repository. Targeted reads of
      IDEA-20260806-e4f96e, KN-TECH-004, KN-TECH-011, KN-TECH-053, KN-TECH-007,
      harness/semaev.py, src/macaulay_export.py, src/ic_first_fall_fast.py.
    results: >-
      The corpus has extensive first-fall and degree-of-regularity material
      (DREG lane, src/ic_first_fall_fast.py, src/macaulay_export.py) and one
      record using Macaulay rank as a proof-complexity lower bound
      (IDEA-20260806-e4f96e). NONE of them asks whether the profile is an
      isogeny-class invariant, and none states the transversality criterion
      "non-transverse iff f(v) = 0". The Macaulay machinery exists in-tree,
      which lowers the implementation cost substantially and is why the record
      is cheap.
    verdict: >-
      ADAPTATION. The discriminant identity is classical, the genus computation
      is elementary, and transversality-implies-radical is standard commutative
      algebra; none of it is claimed as new. New to this program: the
      composition of (C1) and (C2) into a statement that the algebraic-solver
      cost family is class-invariant except through a channel of expected size
      3B/p, and the use of the rank profile rather than a single degree as the
      class functional.

  null_object_control: >-
    MANDATORY, FOUR ARMS, AND TWO OF THEM ARE FORCED VALUES DERIVED BEFORE THE
    RUN.
    (1) FORCED-VALUE CONTROL (gauge with transported factor base): the profile
      must be EXACTLY unchanged, because the substitution is an invertible
      linear change of variables. Its spread is ZERO by algebra, so it is a
      MODE-1 null for the profile and is used ONLY as an instrument check, never
      as a spread reference. Stated in advance per KN-TECH-1a5b7e.
    (2) ADMISSIBLE NULL (gauge with a fixed coordinate window): spread is
      non-zero and arises purely through factor-base membership. This is the
      correct spread reference for the fixed-window arm, drawn >= 8 times and
      reported as an interval.
    (3) NEARBY-OBJECT CONTROL: R in E[2], where the profile MUST differ. An
      instrument that cannot distinguish a degenerate relation locus from a
      smooth one is measuring the shape of the Macaulay construction and not
      the curve.
    (4) MATCHED-SHAPE NULL: a random (2,2) form with the same support and random
      coefficients, intersected with the same grid. Its profile is the SHAPE
      baseline; if it agrees with S_3's profile, the profile reads the shape and
      no Semaev-specific statement may be made from it.
    DECAY PARAMETER: B. Under (D), any 2-torsion-borne difference must appear
    with probability rB/p at a random factor base, i.e. it must become MORE
    frequent as B grows while the per-instance effect stays bounded. A profile
    difference whose FREQUENCY does not track rB/p, or whose SIZE grows with B,
    is not the derived channel and is the artifact tell.

  assumptions:
    - >-
      [open] disc_{x3} S_3 = 16 f(x1) f(x2). Classical; re-derived symbolically
      in Step 1 and NOT quoted. The whole of (C2) rests on it.
    - >-
      [fact, imported] C_R is smooth and F_p-isomorphic to E for R outside
      E[2] union {O}. Imported from IDEA-20260807-0ff796 (B) with an explicit
      dependency; if that record's Stage 1 fails, this record's (C1) fails too.
    - >-
      [fact] Rank is invariant under an invertible linear change of variables,
      which is what makes control (1) a forced value.
    - >-
      [edge case, stated] v = x(R) makes the leading coefficient (x(R) - v)^2 of
      the quadratic vanish, so such a v must be excluded from V or handled
      separately. Named in Step 1 rather than discovered at runtime.
    - >-
      [scope] The profile is a property of the PRESENTATION (monomial order,
      Macaulay construction, degree bound) as well as of the ideal. Every
      reported profile names its presentation.
    - >-
      [scope] Arity 2 only. (C1) is a statement about a curve and does not
      extend to the higher-dimensional loci of S_4 and beyond.
    - >-
      [scope] Toy scale, p <= 2^14, B small enough that the Macaulay matrices
      fit; claim_tier toy.

  proof_search_map:
    bottleneck: >-
      The transversality criterion (C2). (C1) rules out the obvious degeneracy
      and is imported; everything after (C2) is linear algebra. If the
      discriminant identity is wrong, or if tangency can occur for a reason the
      discriminant does not see (for instance a higher-order contact that the
      quadratic discriminant misses because the relevant degeneracy is in the
      x1 direction rather than the x2 direction), then the derivation collapses
      and the functional becomes an open empirical question again. That single
      step is where the record can fail, and Step 1 is designed to fail it
      cheaply.
    baseline_embedding:
      parameter_slice: >-
        V = a single element, B = 1. There the ideal is
        <S_3(v, x2, x(R)), x1 - v, x2 - v>, the profile is trivially computable
        by hand, and the answer must match the direct evaluation
        S_3(v, v, x(R)) = 0 or not. The slice is degenerate enough to be checked
        without any machinery, which is what makes it a real baseline.
      reproduction_check: >-
        Frozen fixture: at B = 1 and B = 2 the computed profile must match a
        hand-derived table for at least 10 instances; and at any B the measured
        first-fall degree read off the profile must match the value
        src/ic_first_fall_fast.py reports for the identical instance. A mismatch
        with the existing in-tree first-fall implementation means the two are
        not measuring comparable objects, and that must be discovered before any
        class comparison.
    observation_collision:
      observable: >-
        The integer sequence D |-> rank M_D.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why null arm (4) is blocking:
        find two systems with the same profile, one Semaev and one a random
        (2,2) form of matched support. Under (C) they SHOULD agree, because the
        profile is forced by transversality and degrees and neither knows
        anything about elliptic curves. That collision is therefore the
        DERIVATION'S OWN PREDICTION rather than a threat -- and it bounds the
        conclusion hard: the profile says nothing Semaev-specific, so a
        class-invariance verdict from it is a verdict about transverse
        intersections of (2,2) curves with grids, and must be reported in those
        terms.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The full rank profile rather than the first-fall degree or the solving
          degree. The profile preserves strictly more state: two systems can
          share a first-fall degree and differ in profile, so a profile-level
          invariance statement is strictly stronger than a degree-level one.
        predicted_gain: >-
          A curve instead of a point, giving enough resolution to detect a
          multiplicity-one tangency that a single degree would wash out -- which
          is exactly the surviving channel (D) predicts.
      - transform: specialization_pack
        proposed_object: >-
          Specialise the factor base to contain 0, 1 or 3 two-torsion
          x-coordinates, measure the profile in each case, and pack the result
          as a statement about which class members can realise which
          specialisation.
        predicted_gain: >-
          Converts "does the class matter" into "how many 2-torsion elements can
          the class member's factor base contain", which is answerable exactly:
          0, 1 or 3 by the class member's r.
    quantifier_order: >-
      Claimed: FORALL p, FORALL non-singular E/F_p, FORALL R in E(F_p) outside
      E[2] union {O}, FORALL V with V cap {x : f(x) = 0} empty and x(R) not in
      V, the Hilbert function of I(E, V, R) DEPENDS ONLY ON |V|. The trap
      avoided: it is NOT claimed that FORALL V the Hilbert function depends only
      on |V| -- the 2-torsion-loaded V is a genuine exception and the claim's
      value comes from excluding it explicitly rather than from pretending it
      does not exist.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At arity 2, in this presentation, for factor bases avoiding the
        rational 2-torsion, the Macaulay rank profile of the Semaev
        decomposition ideal is a function of B alone and hence an isogeny-class
        invariant." It can NEVER certify anything about arity >= 3, about a
        different monomial order or Macaulay construction, about the solving
        behaviour of any particular implementation, or about the ECDLP.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS, exhibited rather than
        described: R in E[2]. There C_R degenerates, the intersection is not a
        transverse cut of a smooth curve, and the profile must differ. A second
        nearby object: V containing x(R), where the quadratic's leading
        coefficient vanishes and the intersection with that column is not a
        finite scheme of the expected length.
    proof_obligations:
      - claim: disc_{x3} S_3 = 16 f(x1) f(x2), and S_3 is symmetric.
        responsibility: correctness
      - claim: C_R is smooth for R outside E[2] (imported).
        responsibility: correctness
      - claim: Non-transversality at x1 = v occurs iff f(v) = 0.
        responsibility: strictness
      - claim: Transverse intersection implies a radical ideal with Hilbert function determined by B.
        responsibility: correctness
      - claim: Expected number of non-transverse columns at random V is rB/p.
        responsibility: size
      - claim: The gauge-with-transported-factor-base control is exactly invariant.
        responsibility: baseline
      - claim: Every profile names its monomial order and construction.
        responsibility: scope

  predictions:
    - metric: >-
        the rank profile D |-> rank M_D, compared element-for-element across
        every member of a complete toy class at a common 2-torsion-free factor
        base and transported target
      direction: different
      minimum_effect: >-
        EXACT SEQUENCE EQUALITY across the entire class. This is an integer
        comparison with no tolerance. A single differing entry, with the E[2]
        and x(R) edge cases excluded, is OUTCOME U and refutes the derivation.
    - metric: >-
        the profile under gauge with a TRANSPORTED factor base
      direction: different
      minimum_effect: >-
        EXACTLY unchanged. A forced value; observing it is an instrument check,
        and observing anything else means the substitution is implemented wrong.
    - metric: >-
        the profile on r = 1 versus r = 3 members at a factor base LOADED with
        all rational 2-torsion x-coordinates
      direction: different
      minimum_effect: >-
        A difference of at least one entry, in the direction of higher rank
        deficiency for larger r. This is the surviving channel and measuring its
        exact size is the record's quantitative deliverable.
    - metric: >-
        the profile of a random (2,2) form with matched support on the same grid
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL to Semaev's on the transverse arm. That agreement is
        the derivation's prediction and it BOUNDS the conclusion: a profile
        result is a result about transverse (2,2)-curve/grid intersections, not
        about elliptic curves. Reported in exactly those words.
    - metric: >-
        the profile with R in E[2]
      direction: different
      minimum_effect: >-
        MUST differ from the non-2-torsion case. If it does not, the instrument
        has no resolution and Step 3's agreement means nothing.

  minimal_test:
    design: >-
      STAGE 0 (minutes, HARD GATE): re-derive the discriminant identity and the
      symmetry; confirm the leading-coefficient edge case; import or re-derive
      (C1). Failure here removes the record's entire derivation at a cost of
      minutes, which is the point of putting it first.
      STAGE 1 (minutes, HARD GATE): the B = 1, 2 hand-checkable baseline and the
      cross-check against src/ic_first_fall_fast.py on an identical instance.
      STAGE 2 (minutes, BLOCKING): the E[2] nearby-object control, which must
      DIFFER, run before any agreement is interpreted.
      STAGE 3 (hours): the class sweep at a clean common factor base --
      exact sequence comparison across all members.
      STAGE 4 (hours): the loaded arm, the two gauge arms, and the matched-shape
      null.
      STAGE 5 (zero compute): record OUTCOME F, T or U, and state the conclusion
      in the transverse-intersection terms the observation collision forces.
      Stages 0-2 cost under an hour and can kill the record or invalidate the
      instrument before the expensive sweep.
    controls:
      - gauge with transported factor base (forced value, exactly invariant)
      - gauge with fixed window (admissible spread reference, >= 8 draws)
      - R in E[2] (nearby object; MUST differ) -- BLOCKING
      - random (2,2) form of matched support (shape baseline)
      - cross-check against the existing in-tree first-fall implementation
      - transport certificates on every target
    required_metrics:
      - full rank profile per (curve, factor-base type, target), as an integer sequence
      - Macaulay matrix dimensions and peak memory per degree
      - r per class member and the 2-torsion content of each factor base
      - the exact profile difference on the loaded arm, per r
      - pass/fail of every gate control, reported before any class comparison
      - the monomial order and Macaulay construction, printed with every profile

  falsification_conditions:
    - >-
      The discriminant identity fails to re-derive. (C2) collapses; the
      transversality criterion is unknown and the functional reverts to an open
