idea:
  id: IDEA-20261018-b4bc61
  title: Crossbred on Weil-descended Semaev systems vs F4 and WDSat on the same PDP cells
  class: composition
  question_id: RQ-DREG-bd6c86
  area: DREG
  goal_ids:
  - GOAL-DREG-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: Crossbred with the improved preprocessing of ePrint 2026/360 solves the Weil-descended PDP cells
    at lower counted cost than F4 and WDSat at the cells where F4 needs degree 5 or more or hits the memory
    cap.
  mechanism: Crossbred (Joux-Vitse; theory Vidal-Ionica-Delaplace ePrint 2024/992) is the state of the
    art for overdetermined Boolean systems. In this repository it was tried only on the m=2 toy oracle
    at n=7, 9 and never on the descent cells. Run it on the same cells and instances as F4 and WDSat.
  novelty_status: unverified
  regime: binary PDP cells; instrument/constant-level; 3-5 days
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.6 bullet 1, 2.5
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/crossbred_20260920/e2e_panel.txt
    provenance: internal
    claim: 'Only prior Crossbred trial: m=2 toy oracle at n=7, 9.'
    verified_by: idea-generator
  - ref: ePrint 2024/992 (Vidal, Ionica, Delaplace), ePrint 2026/360 (improved preprocessing)
    provenance: recalled
    claim: Crossbred theory and improved preprocessing; not re-opened in this logging pass.
    verified_by: idea-generator
  - ref: ePrint 2019/313 (WDSat)
    provenance: recalled
    claim: SAT/XOR solver for binary-curve PDP.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-e847d1
    - KR-IC-5765d2
    - KR-IC-f3da82
    - KR-IC-0d2021
    nearest:
    - ref: KR-IC-e847d1
      provenance: internal
      relation: special_case
      delta: The row records Crossbred for Boolean systems; this applies it to the descended PDP cells
        with 2026/360 preprocessing and counted-cost comparison to F4 and WDSat.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Cells and instances are the frozen PDP cells of the degree campaign.
  - Crossbred parameters (D, k, d) are tuned on a held-out cell, not on the scored ones.
  predictions:
  - metric: crossbred_vs_F4_counted_cost
    direction: lower
    minimum_effect: Ratio below 1 with interval at cells where F4 needs degree >= 5.
  - metric: crossbred_vs_WDSat_counted_cost
    direction: lower
    minimum_effect: Ratio below 1 at the same cells; otherwise reported as trade.
  minimal_test:
    design: Implement or import Crossbred with 2026/360 preprocessing, run F4, WDSat and Crossbred on
      the same PDP cells and instances, same engine accounting, tune on held-out cells, verified solutions.
    controls:
    - 'positive control: m=2 n=7,9 reproduces the prior trial'
    - A/A repeat
    - support-matched random system
    - unpriced work priced at 0/0.1/1 GAE
    required_metrics:
    - counted cost per solver
    - peak memory
    - solved fraction
    - parameters used
  falsification_conditions:
  - Crossbred counted cost >= F4's at every cell where both complete refutes a Crossbred advantage on
    these cells.
  - A win only in raw clock time is not a result (counted unit).
  confounders:
  - parameter tuning
  - implementation maturity gap vs msolve/WDSat
  - cell selection
  interpretation_limits:
  - Constant-level; does not move the degree. Tooling gap may dominate the comparison.
  heuristic_assumptions:
  - id: H1
    statement: Descended systems are overdetermined enough for the Crossbred hybrid to apply.
    rigorous_support: Equation/variable ratios of the cells.
    validation_plan: Compute the ratio per cell before running; skip cells outside the regime.
  target_complexity:
    time_exponent: Constant-factor lever on the solving stage, memory-light relative to dense closure;
      no exponent claim.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium
    compute: low (3-5 days)
  recommended_priority: medium
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: None measured. Crossbred has not been run on these cells.
