idea:
  id: IDEA-20260807-d6956c
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-07'
  title: >-
    DOES THE FACTOR g SURVIVE BEING CHARGED? The phi-stable factor base needs
    only B/g relations instead of B, but only if folded relations arrive
    independently and only if the orbit constraint does not depress the
    decomposition rate - measure the rank-arrival excess and the density penalty
    together and report the single number that decides the lane,
    (density penalty) / g, which the program's own prior measurements place at
    almost exactly 1

  class: measurement

  claim: >-
    (A) THE ONLY SAVING THE LANE HAS, AND ITS TWO PRECONDITIONS. On a phi-stable
    factor base of size B with orbit length g, the factor-base logarithms are
    determined by B/g independent unknowns (IDEA-20260807-0e4d83), so B/g
    relations suffice where a generic base of size B needs B. That factor g is
    the whole relation-side content of the L5 lane. It is real ONLY IF both of
    these hold:
      PRECONDITION 1 (INDEPENDENCE). Folded relation rows arrive like generic
        vectors of their weight in F_N^{B/g}, so that B/g + O(1) of them reach
        full informative rank. If instead the excess grows with B, more
        relations are needed and the factor g is partly or wholly eaten.
      PRECONDITION 2 (DENSITY). A random target decomposes over the phi-stable
        base of size B at the same rate as over a generic base of the same size
        B. If the orbit constraint depresses the rate by a factor delta, each
        relation costs delta times more and the net relation-side saving is
        g / delta, not g.
    NET RELATION-SIDE SAVING = g / (delta * (1 + excess / (B/g))).
    THE PROGRAM'S OWN PRIOR NUMBERS PUT THIS AT ABOUT 1. EV-STR-002 recorded a
    "density penalty ~2-3x"; g = 3. If delta = 3 the saving is exactly zero.
    Nobody has measured delta and the excess together, on matched arms, with the
    denominator being INFORMATIVE rank rather than row count - and until that is
    done the lane does not know whether its one claimed saving exists.

    (B) WHY THE EXISTING MEASUREMENT DOES NOT SETTLE IT. EV-STR-003 O-11 reports
    "the one reproducible effect ... searches per relation row, phi arm against
    random arm, 0.692/1.811, 0.364/1.154, 0.383/1.136 and 0.770/2.466 - ratios
    2.62x, 3.17x, 2.97x and 3.20x, i.e. r = 3 at every instance". That
    denominator is ROWS. Two of every three rows on the phi arm are sigma-shifts
    of the third and contribute exactly zero informative rank
    (IDEA-20260807-0e4d83, FACT 2). So the measured factor 3 in
    searches-per-row is exactly what a 3-fold row-inflation produces, and it is
    consistent with a searches-per-INFORMATION ratio of 1.0 - no saving at all -
    and equally consistent with a genuine 3x. The two readings differ by a factor
    of 9 and the committed data cannot distinguish them, because the informative
    denominator was never computed. This proposal computes it.

    (C) THE THIRD EFFECT, WHICH IS NEW AND MAY CUT EITHER WAY. Folding can
    ANNIHILATE columns. The fold is tilde-r_s = sum_{t=0}^{g-1} lambda^t
    r_{sigma^t(i_s)}. A relation whose support meets orbit s in ALL g positions
    with equal coefficients folds to 1 + lambda + ... + lambda^{g-1} = 0 in that
    column - the column vanishes. A relation meeting an orbit in 2 of 3
    positions folds to 1 + lambda != 0 but with a DIFFERENT coefficient from a
    single hit. So the folded matrix has a different weight law from the
    unfolded one, with a computable rate of column annihilation, and the
    annihilation is exactly what produces the free relations of
    IDEA-20260807-61049d when the whole row is one orbit. Predicted rate of a
    weight-m relation meeting some orbit in all g positions: about
    C(m, g) (g/B)^{g-1} for m >= g - negligible at large B, non-negligible at
    the toy B values this lane has used, which is precisely where its numbers
    come from. Measuring it is cheap and it is a candidate explanation for the
    rank deficiencies of 4, 6, 30 and 67 that EV-STR-003 O-9 recorded without
    explanation.

    (D) THE DECISION THIS PRODUCES. One number:
      charged_searches_per_unit_informative_rank(phi arm)
      -------------------------------------------------- =: RHO
      charged_searches_per_unit_informative_rank(generic arm, same B)
    RHO < 1 means the phi structure genuinely buys relation-collection work and
    the lane has a real, if constant, saving of 1/RHO. RHO >= 1 means it does
    not, and then the entire L5 lane reduces to a factor g^2 = 9 on a stage that
    EV-STR-001 measured at 0.4% to 3% of the charged total - a total effect under
    3%, which is a closure on cost grounds with the obstruction being arithmetic
    rather than algebraic. Both outcomes are deliverables and both are stated
    before measurement.

  resource_label: >-
    R1 + R3. R1: the factor base is defined by x-coordinates as field elements
    and the orbit constraint is a condition on those field elements; the
    decomposition rate is a statement about field data. R3: the fold weights are
    powers of lambda, an invariant of End(E) acting on G.

  admissibility: admissible

  admissibility_argument: >-
    Admissible with the ceiling attached. The measured quantities are rates of
    decomposition over sets of field elements and ranks over F_N - neither is a
    group-oracle output, and the orbit is generated by field multiplication. The
    resource is therefore genuinely non-generic. Its VALUE, however, is capped by
    the same argument that closes the lane's other proposals: the informational
    content of the orbit structure is generic-group simulable
    (KN-FIND-b7e091 Oracle D), so no exponent can arise and none is claimed. The
    honest statement is that this record measures whether a bounded constant is
    1 or 3, and says so.

  discriminated_from:
    - >-
      IDEA-20260807-0e4d83, which proves that shifted rows add zero informative
      rank. That is a theorem about rows already harvested. THIS record asks
      whether the harvested BASE rows, once folded, arrive independently and at
      what rate - two empirical questions the theorem does not touch, and it is
      the theorem's own OUTCOME 3 branch made into a full experiment.
    - >-
      EV-STR-002's "density penalty ~2-3x", which is a row-denominated
      measurement whose provenance is contested (DEC-20260727-009: no run record
      exists for the B = 55, 204, 397 cells) and whose target counts were
      recorded as insufficient (EV-STR-002 unresolved_confounds). This record
      measures delta with a pre-registered target budget sized for a stated
      standard error, on matched arms, with the informative denominator.
    - >-
      EV-STR-003 O-11, whose factor of about 3 this record does not dispute and
      does not reproduce as an information claim: it re-denominates it. The two
      numbers are compatible and their ratio is the finding.
    - >-
      IDEA-20260727-001's `fully_charged_ic_ops_over_rho_ops` prediction, which
      charges an end-to-end total against rho. This record does not attempt an
      end-to-end total: it isolates the single ratio RHO, because an end-to-end
      total at toy scale is dominated by toy artifacts (EV-EQJ-001 recorded
      exactly this: "non-monotone toy artifact (N falls ~ (2k)^4/p at fixed k);
      no crypto-scale exponent claim supported") whereas a ratio between two arms
      at the SAME p, B and arity is not.
    - >-
      EV-STR-001's supply-side finding for arithmetic-progression bases
      (17.5x-4128.6x penalty, supply << C(B,m)). That was a SUPPLY failure: too
      few admissible tuples existed. The phi-orbit constraint imposes no
      restriction on which tuples are admissible - every m-subset of the factor
      base is still a candidate - so the AP failure mode is structurally absent
      here, and the density question is about the factor base's DISTRIBUTION in
      F_p, not about its combinatorics. Recording that distinction is part of the
      contribution.

  object_first_candidate:
    tracked_object: >-
      THE INFORMATIVE-RANK ARRIVAL CURVE: the map from search budget (number of
      decomposition attempts) to informative rank achieved,
      A(t) = rank(tilde-M after t attempts). The tracked object is the curve, not
      its endpoint.
    lossiness: >-
      GENUINELY LOSSY: the curve forgets which relations were found, in what
      order, and with what support - it retains only how much of the solvable
      system has been determined per unit of work. Two entirely different harvest
      histories with the same arrival curve are identified, and that is the
      point: the curve is exactly the equivalence class "same progress per unit
      cost", which is the only thing a cost comparison is entitled to be about.
      It passes the section-2 test - the harvest is not recoverable from the
      curve. What is discarded is discarded compatibly with the operations,
      because adding a relation can only move the curve up by 0 or 1 and never
      changes its past, so the curve propagates deterministically forward.
    propagation: >-
      One step, exactly: a new base relation folds to tilde-r and A increases by
      1 if tilde-r is outside the current row space and by 0 otherwise. Both the
      increment and the reason for it are observable per step, which is what
      makes the excess measurable rather than inferred from an endpoint.
    survival_score: >-
      Survives: arity, curve inside the family, factor-base rule, solver, and
      the choice of orbit representatives. Dies at: a factor base that is not
      exactly orbit-closed (the arrival curve is then not a curve over a
      well-defined quotient), and at rank-deficient regimes where the target
      B/g is unattainable - which must be detected by the curve flattening below
      B/g rather than by the run exhausting its budget, and those two are
      distinguishable only if the curve is recorded rather than the endpoint.

  mechanism: >-
    STEP 1. Matched arms at identical B, identical curve, identical arity,
    identical search budget:
      ARM PHI    - factor base = B/g complete phi-orbits (B columns, B/g unknowns)
      ARM GEN    - factor base = B x-coordinates drawn by the generic rule
                   (B columns, B unknowns)
      ARM QUOT   - factor base = B/g x-coordinates drawn by the generic rule
                   (B/g columns, B/g unknowns) - the SIZE-OF-QUOTIENT control,
                   which isolates whether the phi arm's advantage is anything
                   more than having fewer unknowns
    ARM QUOT is the control the lane has never run and it is the sharpest one:
    if ARM PHI and ARM QUOT have the same arrival curve per unit search, the phi
    structure contributes exactly nothing beyond shrinking the unknown count, and
    the correct algorithm was always "use a smaller factor base".

    STEP 2. Measure, per arm, per attempt: decomposition found (yes/no), the
    support, the folded row, and the informative-rank increment. Emit the arrival
    curve A(t) directly.

    STEP 3. Extract the three numbers:
      delta  = hit_rate(ARM GEN) / hit_rate(ARM PHI)          [density penalty]
      excess = (base relations at which A first reaches its arm's target)
               minus the target                                [independence]
      RHO    = (attempts per unit informative rank on ARM PHI)
               / (attempts per unit informative rank on ARM GEN)
    and report RHO against ARM QUOT as well.

    STEP 4. Measure the folding side-effects of (C): the fraction of harvested
    relations whose support meets some orbit in 2 positions and in g positions;
    the folded row-weight law against the unfolded one; the number of columns
    annihilated by folding; and whether annihilation correlates with the
    informative-rank increments that failed to fire.

    STEP 5. The nulls and the decay sweep (see null_object_control), then the
    single decision: RHO < 1 or RHO >= 1, with the pre-registered inconclusive
    band declared in advance.

    STEP 6. Charge honestly. Report the linear-algebra share of the charged
    total for each arm using the measured attempt counts and the measured
    solve costs, so that the g^2 linear-algebra factor is placed against the
    share it applies to - which EV-STR-001 measured at 0.4% to 3% and which
    nothing in this record is expected to change.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Ripgrep over the whole repository on 2026-08-07: "density penalty";
      "hit rate|hit_rate"; "rank arrival|arrival"; "relations needed";
      "excess"; "supply"; "searches per". Full reads of EV-STR-001 (its
      supply-side analysis in full), EV-STR-002, EV-STR-003 (O-9 and O-11),
      EV-STR-004, EV-EQJ-001, H-YIELD-001, IDEA-20260727-001,
      IDEA-20260727-003 (referenced by IDEA-20260727-001 for the B = sqrt(N)
      objection).
    results: >-
      "density penalty" appears in H-STR-002, EV-STR-002, IDEA-20260726-002 and
      IDEA-20260727-001, always as a ROW-denominated quantity and always as a
      threshold to be compared against B/alpha. "rank arrival" appears in
      H-EQJ-001 and EV-EQJ-001 ("block-restricted rank arrival"), for a different
      group and a different module, and EV-EQJ-001 measured that it did not
      occur. No record computes attempts per unit of INFORMATIVE rank; no record
      runs a size-of-quotient control arm; no record measures folded row weights
      or column annihilation. EV-STR-003 O-9's rank deficiencies (4, 6, 30, 67)
      are recorded with no proposed explanation anywhere in the corpus.
    verdict: >-
      ADAPTATION. Measuring decomposition rates and rank arrival is standard
      index-calculus practice and nothing about the technique is new. New to this
      corpus: the informative denominator, the ARM QUOT size-of-quotient control,
      the column-annihilation effect of folding, and the single decision number
      RHO with its pre-registered bands. No novelty is claimed against external
      literature; a Stage-0 check for published measurements of orbit-constrained
      decomposition rates over prime fields is part of the design.

  null_object_control: >-
    MANDATORY AND BLOCKING.
    NULL 1 - ARM QUOT, the size-of-quotient control: a GENERIC factor base of
    size B/g on the same curve with the same arity and budget. It has the same
    number of unknowns as ARM PHI and none of its structure. PREDICTED: the same
    arrival curve per unit search as ARM PHI, within seed noise. If so, the phi
    structure contributes nothing beyond the unknown count and the lane's
    relation-side content is exactly "use a smaller factor base", which needs no
    endomorphism at all.
    NULL 2 - MATCHED RANDOM MATRIX with identical shape, density and column-orbit
    partition (from the generator of IDEA-20260807-1e673d), fed through the same
    rank-arrival code. It supplies the reference excess for genuinely random rows
    and hence the baseline against which ARM PHI's excess is judged. The excess
    of a random sparse matrix over F_N is O(1) with a known distribution; a
    measured phi-arm excess indistinguishable from it means PRECONDITION 1 holds.
    DECAY PARAMETER: the orbit closure fraction c of the FACTOR BASE - the
    fraction of factor-base elements that lie in complete orbits, swept from 0
    (a generic base) to 1 (fully orbit-closed). Every quantity attributed to the
    phi structure - delta, the annihilation rate, the folded weight law - must
    vary monotonically in c and must equal its ARM GEN value at c = 0. A quantity
    that is flat in c is not measuring the orbit structure.
    PLANTED POSITIVE: inject a set of relations constructed to be linearly
    dependent after folding by a declared amount k. The measured excess must rise
    by exactly k. An instrument that does not see a planted dependency cannot
    certify independence, and every PRECONDITION 1 verdict it returns is void.

  assumptions:
    - >-
      The three arms differ ONLY in the factor base. Same curve, same p, same N,
      same arity m, same target sequence, same decomposition code path, same
      seed policy. Any other difference is a confounder and the driver asserts
      against it by comparing configuration vectors field by field.
    - >-
      Enough targets per cell that the hit-count standard error is below 20%.
      EV-STR-002's unresolved confound was precisely insufficient targets at
      large B, and EV-STR-001 recorded 14 of 36 zero-hit instances. The target
      budget is computed from the expected hit rate BEFORE the run and is
      declared, not discovered.
    - >-
      Zero-hit cells are reported, not smoothed, and cells whose hit count is
      below 5 are labelled low-power and excluded from the RHO estimate while
      still being reported.
    - >-
      The x = 0 point is excluded (it is the unique fixed point of the x-action
      and would make the action non-free).
    - Toy scale; claim tier `toy`; no crypto-scale statement is licensed.

  proof_search_map:
    not_applicable_reason: >-
      Predominantly empirical: it measures two rates and one arrival curve and
      computes their ratio. The one derivational element - the column
      annihilation rate of (C) - is a short combinatorial calculation whose
      obligations are carried by IDEA-20260807-61049d's map (the free relations
      are its g-position case) and by IDEA-20260807-0e4d83's map (the fold's
      definition). No theorem, asymptotic bound, certificate family, reduction or
      closure argument is asserted here, so a full map would be decoration. What
      IS pre-registered instead, and serves the same falsification purpose, is
      the decision band for RHO and the low-power exclusion rule, both declared
      before execution.

  heuristic_assumptions:
    - id: HEUR-L5-11
      statement: >-
        The decomposition probability of a uniformly random target over a
        factor base F of size B at arity m depends on |F| and not on the
        algebraic shape of F: Pr = B^m / (m! N) * (1 + o(1)) uniformly over the
        factor-base rules considered here (generic, phi-orbit-closed,
        quotient-sized).
      rigorous_support: >-
        Imitates the standard index-calculus heuristic that the m-fold sumset of
        a random B-subset of a group of order N covers a 1 - exp(-B^m/(m! N))
        fraction, i.e. the classical random-subset-sumset equidistribution
        statement. It is EXPLICITLY KNOWN TO FAIL for some shaped factor bases:
        EV-STR-001 measured 3-13% group coverage for arithmetic-progression bases
        against 93-100% for generic ones, a total failure of this heuristic. That
        prior failure is the reason it must be measured here rather than assumed,
        and the reason delta is the record's central quantity.
      validation_plan: >-
        Measure the m-fold sumset COVERAGE of each arm's factor base directly at
        small p by enumeration (the same measurement EV-STR-001 made for AP
        bases, which is what made that record decisive), alongside the hit rate.
        Predicted distribution: coverage 1 - exp(-B^m/(m! N)) with hit counts
        Poisson about that mean. Tail check: maximum multiplicity of any group
        element in the sumset, which EV-STR-001 reported as at most 3 for AP
        bases (spread thin, not clustered) and which distinguishes a
        supply failure from a clustering failure. TOY SCALE ONLY, and labelled
        so: coverage enumeration is feasible only at p up to a few thousand.
    - id: HEUR-L5-12
      statement: >-
        Folded relation rows behave like uniformly random vectors of their weight
        in F_N^{B/g}, so B/g + O(1) of them attain full informative rank, with
        the rank-defect distribution converging to the F_N random-matrix law
        (mass prod_{i>0}(1 - N^{-i}) at defect 0).
      rigorous_support: >-
        Imitates the classical rank distribution of uniformly random matrices
        over a finite field, and the standard result that sparse random matrices
        of row weight at least 3 attain full rank after n + O(1) rows. NOT a
        theorem here: folded rows are supports of decompositions with weights
        modified by the fold, and (C) shows the fold changes the weight law in a
        support-dependent way.
      validation_plan: >-
        Measure the empirical rank-defect distribution over at least 20 seeds per
        cell and compare it to the F_N random-matrix law and to NULL 2's
        measured distribution on identical shapes. Tail check: the maximum excess
        over all instances. Report the excess as a function of B over at least
        three B values spanning an order of magnitude, since a constant excess
        and an excess growing like log B are indistinguishable at one B and have
        entirely different consequences for the factor g. TOY SCALE ONLY.

  predictions:
    - metric: delta = hit_rate(ARM GEN) / hit_rate(ARM PHI) at matched B
      direction: different
      minimum_effect: >-
        PREDICTED in [1, 4] and most likely near 1. The reasoning: the phi-orbit
        constraint does not restrict which m-subsets are admissible (unlike the
        AP constraint of EV-STR-001), it only correlates the factor base's
        positions in F_p; if the orbits are equidistributed, delta should be
        close to 1, and EV-STR-002's "2-3x" would then be a small-B or
        insufficient-target artifact. A measured delta above 4 puts the lane in
        the EV-STR-001 regime and closes the relation-side saving outright.
    - metric: excess = (base relations to full informative rank) - (B/g)
      direction: different
      minimum_effect: >-
        PREDICTED O(1), specifically below 5 at every B, and statistically
        indistinguishable from NULL 2's measured excess. An excess growing like
        B^epsilon for any epsilon > 0 eats the factor g and is the primary way
        PRECONDITION 1 fails.
    - metric: RHO (the decision number)
      direction: different
      minimum_effect: >-
        PRE-REGISTERED BANDS, frozen before execution: RHO <= 0.5 means a
        genuine relation-side saving of at least 2x and requires independent
        review; RHO >= 0.9 means no saving and the lane closes on cost grounds
        with the ceiling being the g^2 linear-algebra factor on a 0.4-3% stage;
        0.5 < RHO < 0.9 is declared INCONCLUSIVE in advance so that neither
        branch is reachable by rounding.
    - metric: RHO measured against ARM QUOT instead of ARM GEN
      direction: different
      minimum_effect: >-
        PREDICTED 1.0 within seed noise. If ARM PHI and ARM QUOT are
        indistinguishable, the phi structure adds nothing to simply using a
        smaller factor base, which is the sharpest possible statement of the
        lane's relation-side content and requires no endomorphism to implement.
    - metric: >-
        fraction of harvested relations whose support meets some orbit in all g
        positions
      direction: different
      minimum_effect: >-
        Compared against the predicted C(m, g) (g/B)^{g-1}. A measured rate
        exceeding twice the prediction means the decomposition search is biased
        toward within-orbit supports - which would be a genuine structural
        finding about relation collection and would hand the lane a new question.
    - metric: folded row weight law versus unfolded
      direction: different
      minimum_effect: >-
        Report the full distributions. Predicted: nearly identical at large B
        (annihilation is rare), materially different at the toy B values the lane
        has actually used - which would explain part of EV-STR-003 O-9's
        unexplained rank deficiencies and is worth reporting either way.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): freeze the RHO bands, the low-power exclusion rule
      and the target budget computed from the expected hit rate. Pre-registration
      is what makes the decision meaningful and EV-STR-003 recorded a
      pre-registration limitation in exactly this lane.
      STAGE 1 (minutes, HARD GATE): the planted-dependency positive control -
      inject k dependent folded rows, confirm the excess rises by exactly k.
      STAGE 2 (hours, the main run): three arms at matched B, at three B values
      spanning an order of magnitude, at least 5 seeds each, with the declared
      target budget. Emit per-attempt records so that arrival curves, not just
      endpoints, are archived.
      STAGE 3 (minutes): compute delta, excess, RHO, and RHO against ARM QUOT.
      STAGE 4 (minutes): the (C) side-effect measurements - orbit-collision
      rates, folded weight law, annihilated columns.
      STAGE 5 (hours at small p only): the sumset coverage enumeration for
      HEUR-L5-11, which is what made EV-STR-001 decisive and which no later
      record in this lane has repeated.
      STAGE 6 (minutes): the c-sweep decay test using the
      IDEA-20260807-1e673d generator for the matrix side and a graded factor-base
      construction for the curve side.
      This is the most compute-expensive record in the L5 set and it is still
      hours of pure Python at toy scale, because the arms share every code path.
    controls:
      - ARM QUOT - generic factor base of size B/g, same unknowns, no structure
      - ARM GEN - generic factor base of size B, the size-matched control
      - NULL 2 - matched random matrix through the same rank-arrival code
      - planted-dependency positive control of declared size k
      - c-sweep over factor-base orbit-closure fraction as the decay test
      - >-
        zero-hit and low-power cells reported explicitly, following EV-STR-001's
        practice of recording 14 of 36 zero-hit instances rather than smoothing
      - >-
        matched Pollard rho with negation (0.886 sqrt(N/6) on these curves) and
        matched BSGS, in group operations, for the Pareto row
    required_metrics:
      - hit count, attempt count and hit rate per arm per cell
      - delta with its standard error
      - arrival curve A(t) per arm per seed, archived per attempt
      - excess per arm per seed, with the empirical defect distribution
      - RHO against ARM GEN and against ARM QUOT, with bands applied
      - orbit-collision rates at 2 and at g positions
      - folded and unfolded row weight distributions; annihilated column count
      - m-fold sumset coverage and maximum multiplicity per arm (small p only)
      - linear-algebra share of the charged total per arm
      - sha256 of each factor base and each row list
      - matched rho and BSGS group-operation counts and BSGS memory

  falsification_conditions:
    - >-
      The planted-dependency control does not raise the measured excess by
      exactly k. The independence instrument is broken; every PRECONDITION 1
      verdict is void and nothing about the factor g is established.
    - >-
      RHO lands at or above 0.9. The relation-side factor g does not survive
      being charged; the L5 lane's total content is the g^2 linear-algebra factor
      on a 0.4-3% stage, i.e. under 3% of a charged total, and that is a closure
      on arithmetic grounds. This is the predicted outcome.
    - >-
      RHO lands at or below 0.5. The phi structure buys genuine relation-
      collection work; independent review before any interpretation; the lane
      reopens with a measured constant.
    - >-
      The excess grows measurably with B on ARM PHI and not on NULL 2. Folded
      relations are systematically dependent for a reason not yet identified;
      that reason becomes the lane's next question and the factor g is
      correspondingly reduced by a measured amount.
    - >-
      ARM PHI and ARM QUOT differ materially. Then the phi structure does
      something a smaller generic factor base does not, which is the one result
      in this record that would be genuinely surprising and would require
      replication before interpretation.
    - >-
      delta exceeds 4. The lane enters the EV-STR-001 regime (supply/coverage
      failure) and the sumset coverage measurement of STAGE 5 becomes the
      decisive follow-up rather than a control.

  confounders:
    - >-
      INSUFFICIENT TARGETS. EV-STR-002's density penalty is explicitly recorded
      as measured with too few targets at large B. A repeat of that error would
      make delta meaningless. The target budget is pre-computed and declared.
    - >-
      SHARED TARGET SEQUENCE. If the arms are run on different random targets,
      target-to-target variance contaminates delta. The arms must consume the
      SAME target sequence, which also makes the comparison paired and much
      tighter.
    - >-
      B = ceil(sqrt(N)) IS NOT A NEUTRAL CHOICE. IDEA-20260727-001's confounder
      list notes that at that B the relation COUNT alone is sqrt(N), already
      equal to matched rho before any solve cost. Any end-to-end statement at
      that B is predetermined; this record therefore reports a RATIO between arms
      at fixed B and does not attempt an end-to-end verdict.
    - >-
      TOY-SCALE HIT RATES. At small p the hit rate can be so high that the
      factor base's shape barely matters, or so low that no cell has power. Three
      B values spanning an order of magnitude, with the low-power exclusion rule,
      exist to detect this.
    - >-
      COLUMN ANNIHILATION AT SMALL B. The (C) effect scales as (g/B)^{g-1} and is
      therefore a toy-scale artifact by construction. Any conclusion drawn from
      it must be labelled as applying to the toy regime and NOT extrapolated -
      the honest reading is that it may explain past toy measurements, not that
      it matters at scale.
    - >-
      DEDUPLICATION. The committed harness deduplicates rows; a deduplicated
      harvest understates attempts per unit rank on whichever arm produces more
      duplicates, which is the phi arm by construction. Dedup must be off or
      logged per row.

  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX
      CALCULUS - RELATION COLLECTION IS. EV-STR-001 measured the linear-algebra
      share at 0.4% to 3% of the charged total at p = 211, 1009 and 4099. That
      is exactly why this record measures the RELATION side: the lane's only
      chance of mattering is on the dominant stage, and RHO is the number that
      decides whether it does. The g^2 linear-algebra factor is reported here
      only to place the ceiling, and no linear-algebra gain is claimed.
    - >-
      Toy tier only, claim tier `toy`. Both heuristics carry validation plans
      that are explicitly toy-scale, and neither a delta nor an excess measured
      at p <= 2^32 licenses any crypto-scale reading.
    - >-
      RHO >= 0.9 is a closure of the RELATION-SIDE saving within the tested
      scope. It is not a statement that the endomorphism mechanism is false, not
      a statement about other factor-base rules or arities, and not a statement
      about extension fields where the same mechanism has an unbounded parameter
      (eprint 2020/1315).
    - >-
      No hypothesis status is moved by this record and it has no authority to
      move one.

  reachability_gate: >-
    T5's isogeny-walk form does not apply: one curve, all three arms on it, no
    movement between curves. T4 binds: the orbit structure requires D_0 = -3
    (g = 3) or D_0 = -4 (g = 2 on x-coordinates), class-determined and
    unreachable from a generic curve at any cost, so ARM PHI does not exist for a
    generic prime-field curve and ARM GEN is the only arm there. Within the
    D_0 = -3 family the object is free: the orbit-closed factor base costs B
    multiplications by zeta. SCOPE NOTE, not an attack claim: secp256k1 has
    a = 0 and lies in the family; this record's own predicted outcome is that the
    relation-side saving there is 1, i.e. none.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES AND NONE IS CLAIMED. The record measures whether a
      CONSTANT factor of at most g = 3 on the relation stage is 3 or 1. Its
      predicted answer is 1. The linear-algebra constant g^2 = 9 is separately
      bounded and applies to 0.4-3% of the charged total. Nothing in this record
      could produce a super-constant effect: the factor g is bounded by
      |Aut(E)| <= 6 and, on x-coordinates, by 3 (IDEA-20260807-9ecc6f), and the
      density penalty can only reduce it.
    memory_exponent: >-
      Constant: ARM PHI stores B/g unknowns and (after folding) a (B/g)-column
      matrix, a factor g^2 = 9 less than ARM GEN at the solve and a factor g in
      stored relations. Unchanged by the outcome, since it follows from the
      unknown count and not from delta.
    best_known: >-
      For the relation stage of prime-field index calculus: the generic factor
      base with the classical automorphism-quotient reduction already applied
      (KN-TECH-018), and, in the extension-field setting where the analogous
      parameter is unbounded, eprint 2020/1315's factor 1/n. For the ECDLP:
      parallel rho at 0.886 sqrt(N) and O(1) memory (KN-TECH-001, KN-TECH-006),
      automorphism-discounted rho at about 0.36 sqrt(N) on j = 0 (KN-TECH-018),
      BSGS at 2 sqrt(N) time and sqrt(N) memory (KN-TECH-031).
    hidden_overhead: >-
      No o(1) since no asymptotic claim. Disclosed instead, and it is the whole
      record: the factor g is charged against delta and against the arrival
      excess, and the program's own prior numbers (delta about 3, g = 3) put the
      product at about 1. The record exists because that near-cancellation has
      never been measured with the correct denominator, and a cancellation that
      close deserves a measurement rather than an assumption in either direction.
    tradeoff_note: >-
      The one genuine tradeoff the arms expose: ARM QUOT achieves the same
      unknown count with a smaller factor base and hence a LOWER hit rate
      ((B/g)^m instead of B^m in the numerator), so ARM PHI should beat ARM QUOT
      by about g^m on hit rate while matching it on unknowns. If it does not,
      that is the finding. This is a real and previously unstated comparison and
      it is the reason ARM QUOT is in the design.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and not null. As an
    attack: none is mounted, so dominated on every axis by parallel rho
    (0.886 sqrt(N) time, O(1) memory, KN-TECH-001/KN-TECH-006), by
    automorphism-discounted rho on exactly these curves (about 0.36 sqrt(N),
    KN-TECH-018), and by BSGS (2 sqrt(N) time, sqrt(N) memory, KN-TECH-031); at
    B = ceil(sqrt(N)) the relation count alone already equals rho's total work,
    which IDEA-20260727-001 records and which makes the domination structural
    rather than incidental. As a RELATION-STAGE MEASUREMENT: the incumbents are
    EV-STR-002's density penalty and EV-STR-003 O-11's searches-per-row, which
    dominate on being already committed and independently re-executed
    (TASK-20260727-023) and which this record dominates on denominator
    correctness (informative rank versus rows), on target budget (pre-computed
    versus recorded-as-insufficient) and on having a size-of-quotient control arm
    that neither ran.
  sota_delta: >-
    Zero speedup against any attack baseline. Quantitatively: converts
    EV-STR-003 O-11's reproducible factor of about 3 (searches per ROW) into a
    factor of about 3/delta (searches per unit of INFORMATION), where delta is
    measured rather than assumed; the two readings differ by up to 9x and the
    committed data cannot distinguish them. Adds the ARM QUOT control, which
    tests whether the entire relation-side content of the lane is reproducible
    without any endomorphism by simply using a factor base of size B/g. Places a
    hard arithmetic ceiling on the whole L5 lane: if RHO >= 0.9, the lane's
    maximum effect on a charged total is the g^2 = 9 linear-algebra factor
    applied to a 0.4-3% stage, i.e. under 3%.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.5 that RHO lands in the "no saving" band (>= 0.9) - this is genuinely
    uncertain and is the reason the record exists. 0.25 that it lands
    inconclusive, 0.25 that it lands at or below 0.5 and the lane keeps a real
    constant. 0.6 that delta comes out near 1 rather than near 3, because the
    phi-orbit constraint imposes no combinatorial restriction on admissible
    tuples (unlike the AP constraint that killed EV-STR-001) - which would mean
    EV-STR-002's 2-3x was a small-B or low-target artifact and would make the
    lane's constant real. 0.75 that the excess is O(1) and PRECONDITION 1 holds.
    0.7 that ARM PHI and ARM QUOT are indistinguishable per unit search once hit
    rates are accounted for. This is the record whose outcome is least
    predictable in the set and correspondingly the one with the highest expected
    information gain per unit of compute.

