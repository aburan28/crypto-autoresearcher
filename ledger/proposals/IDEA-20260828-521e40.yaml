idea:
  id: IDEA-20260828-521e40
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-28'
  title: 'Charge the phase every existing memory measurement in this batch skips: measure the near-collision-block
    search''s own per-worker resident-state footprint as a function of neutral-bit budget, and the
    occupancy ceiling it imposes on effective phase throughput under a declared total-memory pool --
    a memory quantity distinct from birthday-phase table storage, from symbolic closure memory, and
    from per-evaluation CPU rate.'
  class: measurement
  claim: '(A) RQ-SHAONE-081e3a''s second target requires memory charged beside time, and its own text
    names "the birthday-phase storage and its access pattern" explicitly as one thing a device-hour
    figure omits. Of the ten proposals filed against this RQ before today, IDEA-20260816-71d4dd measures
    birthday-phase distinguished-point TABLE memory and its efficiency eta; IDEA-20260816-1e36fa counts
    a purely SYMBOLIC difference-state set N(k), whose own memory is an artifact of a closure computation
    that never executes a search; IDEA-20260816-389b1b measures CPU per-evaluation THROUGHPUT (branch
    misprediction, vectorisation, cache) and explicitly names memory only as a confounder it does not
    measure; IDEA-20260816-962936 takes memory PRICE as one declared input to a cost-model composition
    it does not itself derive. Two proposals filed earlier today (IDEA-20260828-521e40''s siblings IDEA-20260828-ca6bda
    and IDEA-20260828-54fd0a) reproduce published headline numbers and measure a success-probability
    curve under partial state knowledge, respectively -- neither touches a physical resource footprint
    at all. NONE of the fourteen proposals filed against this RQ measures the near-collision-block search''s
    own PER-WORKER RESIDENT MEMORY: the live state a message-modification implementation (KN-TECH-066)
    must hold per parallel worker while satisfying a chained disturbance vector''s conditions -- the
    partial message words under active modification, the neutral-bit candidate table used to generate
    many low-cost variant continuations from one base assignment without re-solving the early rounds,
    and the condition-satisfaction bitmask. This is a structurally separate phase and a structurally
    separate memory quantity from 71d4dd''s birthday-phase table. (B) KN-TECH-066 records that message
    modification spends degrees of freedom to force early, expensive conditions to hold deterministically,
    and the neutral-bit technique -- varying bits that do not disturb already-satisfied early-round
    conditions -- is the standard way of generating many candidate continuations cheaply from one base
    state. Each neutral bit doubles the number of candidate assignments a worker may hold or index to
    avoid re-solving the early rounds from scratch, so per-worker resident footprint is a plausible,
    measurable function of the declared neutral-bit budget b. If a real compute node has only a bounded
    total memory pool, the number of workers that can run CONCURRENTLY on that node is capped by pool_size
    / footprint(b) -- an occupancy ceiling invisible to a device-hour figure built from an unconstrained
    per-worker evaluation rate. (C) This proposal claims the footprint-vs-b curve and the resulting
    occupancy-vs-total-memory-vs-b surface are measurable at reduced-step/MD5-scale analogue widths
    by direct in-kernel instrumentation of a real message-modification implementation, that the occupancy
    ceiling this surface implies is a genuinely different constraint from birthday-phase table capacity,
    and that the two must be reported and charged separately rather than one being silently assumed
    away as the other. (D) WHAT IS NOT CLAIMED: no attack, no SHA-1 cost figure, no dollar amount, no
    assertion that any published cost model is wrong, and critically no claim about any real GPU''s
    actual register file or shared memory -- this is a SOFTWARE resident-state footprint measured on
    this harness''s CPUs, and the record states explicitly, mirroring IDEA-20260816-389b1b''s own disclosed
    limitation, that it does NOT transfer numerically to GPU register/shared-memory allocation, which
    is governed by a compiler and scheduler this harness does not have. (E) A finding that footprint
    is FLAT in b -- e.g. because a well-written implementation streams and discards candidates rather
    than caching them -- is fully valuable: it would show near-collision-phase memory really is negligible
    next to the birthday-phase table, which is currently an UNMEASURED assumption every cost-model proposal
    in this batch relies on rather than a validated one.'
  mechanism: 'STAGE 1: implement message modification with an explicit, parameterised neutral-bit budget
    b (0 up to a declared maximum) over a reduced-step/truncated ARX compression function or an MD5-scale
    disturbance vector, reusing GOAL-MD5-001''s pipeline conventions where applicable, following KN-TECH-066''s
    degrees-of-freedom accounting: solve early conditions deterministically via message-word freedom,
    then use b neutral bits to generate up to 2^b candidate continuations per base assignment without
    re-solving the early rounds. STAGE 2: instrument peak resident-state size per worker (bytes: message-word
    buffer, per-candidate index/cache structures, condition-satisfaction bitmask) at each declared b,
    measured via an in-kernel high-water-mark counter rather than external OS-level RSS, so the measurement
    isolates the algorithm''s own footprint from allocator and OS overhead -- the same in-kernel-counter
    discipline IDEA-20260816-389b1b uses for throughput. STAGE 3: declare a total-memory-pool capacity
    C_total (varied over several values as an explicit sensitivity input, in the spirit of IDEA-20260816-962936''s
    declared-input discipline), compute max_workers(b, C_total) = floor(C_total / footprint(b)), and
    combine with a per-worker evaluation rate r -- taken as a DECLARED input at b=0 from this proposal''s
    own harness, not re-derived from IDEA-20260816-389b1b''s separate hardware-coefficient measurement
    -- to report effective phase throughput = max_workers(b, C_total) * r. STAGE 4, null control: a
    synthetic loop performing the identical volume of arithmetic work as message modification at each
    b (same candidate-evaluation count) but built to touch a FIXED-size buffer regardless of b, with
    no genuine per-candidate caching, run through the identical instrumentation in the same invocation.
    This null MUST show footprint flat in b; if it does not, the instrumentation itself introduces a
    b-dependent artifact and no real-loop measurement is admissible. STAGE 5: report the footprint-vs-b
    curve, the occupancy-vs-C_total-vs-b surface, and effective-throughput against a naive "unconstrained-occupancy"
    baseline that assumes footprint = 0 (max_workers = C_total / one evaluation''s transient stack only)
    -- which is exactly what an unstated near-collision-phase-memory device-hour figure implicitly assumes.
    STAGE 6: sanity cross-check -- confirm that at b=0 (no neutral bits, no caching required) the real
    loop''s footprint matches the null''s footprint within a small tolerance, since at b=0 the two loops
    should be doing structurally the same thing.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full. Read all fourteen filed proposals against
      RQ-SHAONE-081e3a in full: the ten from 2026-08-16 (fa13f6, d3151e, ade53e, 962936, 8e0b9c, 71d4dd,
      70b60d, 3edd14, 1e36fa, 389b1b) and the four filed earlier today (ca6bda, ca6584, 54fd0a, 2804d3).
      Read knowledge/techniques/KN-TECH-066.md and knowledge/literature/KN-LIT-91b680.md in full this
      session. Ran grep -ril ''neutral.bit|resident.state|resident memory|high-water mark'' over ledger/proposals
      (23 hits, all outside the SHAONE bucket except IDEA-20260816-1e36fa, which is a symbolic closure-memory
      record already discriminated below); grep -ril ''occupancy|register pressure|recompression|timing
      side.channel|version drift|vendored|submodule'' over ledger/proposals (108 hits, sampled a representative
      set -- all matches outside the SHAONE bucket are unrelated ECDLP polynomial/operator-DAG ''recompression''
      or generic wording, confirmed by direct inspection of three sampled files).'
    results: No proposal filed against RQ-SHAONE-081e3a, and no other ledger/proposals record found
      by the targeted greps, measures a near-collision-block search''s own per-worker resident-memory
      footprint or an occupancy ceiling derived from it. IDEA-20260816-71d4dd''s object is birthday-phase
      distinguished-point table memory (a different phase); IDEA-20260816-1e36fa''s object is a symbolic
      difference-state set whose memory is the closure computation''s own bookkeeping cost, explicitly
      not a measurement of any executing search; IDEA-20260816-389b1b explicitly measures time (evaluations
      per second) and names memory only as a confounder ("cache behaviour... may be memory rather than
      control flow"), never as its object.
    verdict: 'UNVERIFIED. No claim is made about whether near-collision-phase resident-memory footprint
      has been measured in published cryptanalytic engineering work -- implementers plausibly track
      this routinely when tuning GPU kernels. What is claimed new internally: this repository holds
      no measurement of this specific object for any hash attack, and the specific construction --
      an in-kernel footprint-vs-neutral-bit-budget curve composed with a declared total-memory-pool
      sensitivity analysis to derive an occupancy ceiling, validated against a fixed-footprint null
      -- is assembled from KN-TECH-066''s degrees-of-freedom/neutral-bit framing plus this program''s
      own in-kernel-counter and null-control discipline (IDEA-20260816-389b1b, IDEA-20260816-71d4dd),
      applied to a phase and a resource axis neither of those records touches.'
  citations:
    - ref: KN-TECH-066
      provenance: internal
      claim: "Message modification (Wang et al. 2004-05) spends degrees of freedom in message words to force early conditions deterministically; the same accounting drives disturbance vectors used against the SHA family."
      verified_by: "Read in full this session, knowledge/techniques/KN-TECH-066.md."
    - ref: KN-LIT-91b680
      provenance: internal
      claim: "Chosen-prefix collision attacks rely on message-differential/multi-block construction and the birthday-bound ~2^(n/2) framework."
      verified_by: "Read in full this session, knowledge/literature/KN-LIT-91b680.md."
    - ref: "IDEA-20260816-71d4dd, IDEA-20260816-1e36fa, IDEA-20260816-389b1b, IDEA-20260816-962936"
      provenance: internal
      claim: "The four existing memory- and cost-model-adjacent proposals against RQ-SHAONE-081e3a, whose objects (birthday-phase table memory, symbolic closure cardinality, CPU throughput, declared-input elasticity) are each discriminated from this proposal's object in `discriminated_from`."
      verified_by: "Read in full this session."
  object_first_candidate:
    tracked_object: 'The per-worker resident-state footprint (bytes) of a message-modification search
      at declared neutral-bit budget b, carried together with the declared total-memory pool C_total
      through the derived quantity max_workers(b, C_total). What is followed is the OCCUPANCY the footprint
      permits, not the message content or the search''s success/failure.'
    lossiness: 'Genuinely lossy. The projection discards every message word, every internal compression-function
      state, and the search''s success or failure entirely, retaining only a byte count per worker at
      each b. It is compatible with the target operation because occupancy is a deterministic function
      of footprint and declared pool size alone -- neither depends on what the search finds -- so the
      retained byte count propagates through the derived max_workers and effective-throughput quantities
      without needing the discarded content. What is lost is any attribution of WHICH part of the resident
      state (message buffer versus candidate cache versus bitmask) drives the footprint at a given b;
      recovering that would require per-component instrumentation this proposal does not attempt and
      names as a limitation.'
    propagation: 'One step of the target operation is one worker processing one neutral-bit-budget-b
      near-collision-block attempt. It updates the tracked object by recording the peak resident-state
      size reached during that attempt; across many attempts at fixed b the object is the MAXIMUM observed,
      which is exactly the quantity a capacity-planning occupancy model needs (a mean footprint would
      understate the pool size required to avoid eviction or failure).'
    survival_score: 'The object survives as long as b is small enough that footprint(b) does not exceed
      the declared C_total for at least one worker -- past that point max_workers rounds to zero and
      the occupancy model degenerates to "this configuration cannot run at all," which is itself a reportable
      boundary rather than a silent failure. It also depends on the neutral-bit caching strategy actually
      implemented: a streaming (generate-and-discard) strategy may show near-flat footprint in b, at
      which point the object still exists but the occupancy ceiling it implies is uninteresting -- exactly
      outcome (E) in `claim`, which the design is built to report as a clean, valuable negative.'
  null_object_control: 'A synthetic loop performing the identical volume of arithmetic work as the real
    message-modification loop at each declared b (same number of per-attempt candidate evaluations)
    but built to touch a FIXED-size buffer regardless of b -- no genuine per-candidate caching -- run
    through the IDENTICAL in-kernel footprint instrumentation in the same invocation. This null must
    show footprint flat in b. If it does not, the instrumentation itself is introducing a b-dependent
    artifact (e.g. compiler-inserted buffers scaling with a loop-bound parameter unrelated to genuine
    caching), and no measurement of the real loop''s footprint-vs-b curve is admissible until the artifact
    is found and removed.'
  discriminated_from:
    - 'IDEA-20260816-71d4dd (birthday-phase distinguished-point table memory and efficiency eta): that
      proposal''s object is table memory in the BIRTHDAY phase (the search for a chaining-value difference
      inside a target set); this proposal''s object is per-worker resident memory in the NEAR-COLLISION-BLOCK
      phase (satisfying a chained disturbance vector''s conditions), a structurally different phase
      with a different memory-consuming mechanism (message-word caching and neutral-bit candidate tables,
      versus distinguished-point trail storage). Neither may cite the other''s number, and a full cost
      model needs both, which is exactly why the RQ names memory as a general requirement rather than
      scoping it to one phase.'
    - 'IDEA-20260816-1e36fa (N(k), the symbolic near-collision difference-state closure): that proposal''s
      memory is the bookkeeping cost of a COMBINATORIAL closure computation that never executes a message-modification
      search at all; this proposal instruments an ACTUALLY EXECUTING search''s resident state, a different
      object measuring a different thing despite both nominally concerning "near-collision blocks."'
    - 'IDEA-20260816-389b1b (hardware efficiency coefficient eta_hw, attack-loop throughput versus straight-line
      hashing): that proposal measures TIME (evaluations per second) with the same loop-shape discipline
      this proposal borrows, and explicitly disclaims measuring memory, naming cache effects only as
      a confounder of ITS timing result; this proposal measures the confounder itself as the primary
      object, and the two compose (this proposal''s max_workers times that proposal''s eta_hw-adjusted
      rate r gives a fuller effective-throughput estimate than either alone) without either subsuming
      the other.'
    - 'IDEA-20260816-962936 (elasticity vector over a declared cost-model composition): that proposal
      takes a structural cost-model form and memory PRICE as declared inputs and never measures a physical
      footprint; this proposal supplies one of the physical measurements (occupancy-limited throughput)
      that a future composition could take as an input, and neither may cite the other''s output as
      already established.'
    - 'IDEA-20260828-ca6bda (reproducing published headline complexity figures from declared parameters):
      that proposal evaluates a closed-form arithmetic formula against published numbers and touches
      no physical resource footprint of any kind; this proposal measures an executing search''s memory,
      an orthogonal object.'
    - 'A generic claim that "message modification uses memory": that is an assertion; this proposal
      measures a footprint-vs-b curve with a fixed-footprint null control, derives an occupancy ceiling
      under a declared total-memory-pool sensitivity analysis, and reports effective phase throughput
      against a naive zero-footprint baseline.'
  assumptions:
    - 'A reduced-step or truncated compression function''s message-modification structure is similar
      enough to a full-scale disturbance vector''s that a measured footprint-vs-b relationship is informative
      about the mechanism (caching cost scaling with candidate count), not merely about the analogue.
      This is the central extrapolation assumption and no numeric transfer of footprint bytes to full-scale
      SHA-1 parameters is performed.'
    - 'In-kernel high-water-mark instrumentation does not itself perturb the measured footprint; checked
      by the STAGE 6 b=0 cross-check between the real loop and the null, which should coincide when
      no caching is yet exercised.'
    - 'The declared neutral-bit caching strategy (generate-and-index versus generate-and-discard) is
      a genuine implementation choice this proposal makes explicit and varies; a different real-world
      implementation could choose differently, and the measured curve is scoped to the declared strategy,
      not to "message modification in general."'
    - 'max_workers = floor(C_total / footprint(b)) is an idealised capacity model ignoring real allocator
      fragmentation, OS overhead, and non-search processes sharing the pool; this is stated as a limitation
      of the occupancy model, not hidden inside a headline number.'
  proof_search_map:
    not_applicable_reason: >-
      This is an empirical instrumentation measurement of a physical resource footprint and a derived
      capacity/occupancy model, not a proof of a theorem or a claimed algorithmic ceiling. There is no
      bottleneck step whose removal changes a theorem, no certificate-carrying observable requiring a
      collision search, and no constructive transform being attempted; KN-TECH-080's proof-architecture
      apparatus does not apply. The nearest analogue is the fixed-footprint null control in `mechanism`
      STAGE 4.
  predictions:
    - metric: per-worker peak resident footprint (bytes) at the largest tested neutral-bit budget b_max, relative to at b=0
      direction: higher
      minimum_effect: '2x; a smaller ratio would show the caching strategy is not materially memory-hungry at the tested scale'
    - metric: footprint of the STAGE-4 fixed-footprint synthetic null across the same range of b
      direction: different
      minimum_effect: 'predicted flat (no material variation); any material variation here is an instrumentation
        artifact that voids the real-loop measurement'
    - metric: max_workers(b_max, C_total) relative to max_workers(b=0, C_total), at a declared mid-range C_total
      direction: lower
      minimum_effect: '1.5x fewer concurrent workers supportable at b_max than at b=0, at the same declared memory pool'
    - metric: effective phase throughput at b_max under the declared C_total, relative to the naive zero-footprint
        baseline (max_workers assuming footprint negligible)
      direction: lower
      minimum_effect: '20% degradation; a smaller gap would suggest near-collision-phase memory genuinely
        is close to negligible at this scale, which is outcome (E) and a fully valuable result'
  minimal_test:
    design: 'The cheapest discriminating run measures footprint at exactly two declared b values (a
      small baseline and one materially larger value) plus the STAGE-4 null at both, in one invocation
      with one shared instrumentation path, and computes max_workers under two declared C_total settings.
      This costs CPU-hours only, no GPU, and needs no collision to complete -- footprint is measured
      during ordinary attempts regardless of success. It answers the single gating question before the
      full curve and surface are bought: does real per-worker footprint actually grow with b at all,
      distinguishably from the null''s expected flatness? If it does not, the near-collision-phase memory-negligible
      assumption every sibling cost-model proposal in this batch relies on is validated at this scale
      and the line closes with a measured, useful null. If it does, the fuller b-sweep and the occupancy
      surface across multiple C_total values are warranted.'
    controls:
      - 'Fixed-footprint synthetic null performing identical arithmetic work volume, same invocation, same instrumentation.'
      - 'STAGE 6 b=0 cross-check between real loop and null, which must coincide within a small declared tolerance.'
      - 'Declared neutral-bit caching strategy fixed and stated before any measurement, not tuned after seeing the footprint curve.'
      - 'Multiple declared C_total values spanning a plausible range, so the occupancy ceiling is reported as a sensitivity surface rather than at one arbitrary pool size.'
    required_metrics:
      - 'peak resident footprint (bytes) per worker at each declared b, real loop and null'
      - 'max_workers(b, C_total) at each declared (b, C_total) pair'
      - 'effective phase throughput at each (b, C_total) pair versus the naive zero-footprint baseline'
      - 'b=0 real-loop-versus-null footprint agreement (cross-check)'
  falsification_conditions:
    - 'The STAGE-4 fixed-footprint null shows material footprint variation across b, indicating an instrumentation
      artifact and voiding any real-loop measurement until resolved.'
    - 'Real-loop footprint is statistically indistinguishable from the null''s (flat) footprint across
      the full tested b range, showing near-collision-phase memory is genuinely negligible at this scale
      -- a valid, useful, and fully reportable negative result per claim (E).'
    - 'The b=0 cross-check between real loop and null disagrees beyond a small declared tolerance, indicating
      the two loops are not doing comparable work at the baseline and undermining the null''s validity as a comparison point.'
    - 'footprint(b) exceeds every declared C_total before reaching the declared b_max, so max_workers
      rounds to zero at some tested b -- a real capacity boundary, reported as such rather than silently
      clipped or extrapolated past.'
  confounders:
    - 'Allocator and OS-level memory overhead (fragmentation, page alignment) is excluded by the in-kernel
      counter design, but a real deployment would experience it; the measured footprint is therefore
      a LOWER bound on real-world resident memory, stated as such.'
    - 'A reduced-step or truncated analogue may have a shorter condition chain than full-scale SHA-1,
      understating how many neutral bits a real attack would need and hence understating real footprint
      growth; this is an extrapolation risk named in `assumptions`.'
    - 'The declared caching strategy is a design choice this proposal fixes; a differently engineered
      real attack implementation could show a different footprint-vs-b relationship entirely, and the
      measured curve characterises this declared strategy, not "the" near-collision phase in general.'
    - 'max_workers is computed from a single-resource (memory) capacity model; real occupancy on any
      hardware also depends on other shared resources (cache, memory bandwidth) not modelled here, which is disclosed rather than folded into the number.'
  interpretation_limits:
    - 'A measured footprint-vs-b curve and its derived occupancy ceiling are statements about this declared
      software implementation and caching strategy at this analogue scale; no numeric transfer to full-scale
      SHA-1 parameters, to GPU register/shared-memory allocation, or to any real deployed attack implementation is performed or licensed.'
    - 'The occupancy model (max_workers = floor(C_total / footprint(b))) is an idealised capacity bound,
      not a measured real-hardware scheduling outcome; real allocator and OS overhead would only tighten it further.'
    - 'Nothing here bears on SHA-1''s security, on any detector, or on any deployed system.'
  heuristic_assumptions:
    - id: H1
      statement: >-
        Per-worker resident-state footprint under a neutral-bit-indexed candidate-caching strategy grows
        with the neutral-bit budget b at a rate determined by the number of cached candidates (up to
        2^b) times a roughly constant per-candidate byte cost -- i.e. footprint(b) is well-approximated
        by a linear function of 2^b, the way a hash table's memory is a linear function of its entry
        count for a fixed entry size.
      rigorous_support: >-
        No proved theorem for this specific implementation; it extrapolates the standard capacity-planning
        heuristic for indexed caching structures (memory proportional to entry count times per-entry
        size) to the neutral-bit candidate table KN-TECH-066 describes only qualitatively (as a source
        of freedom degrees), which is the untested step this proposal exists to check empirically.
      validation_plan: >-
        Sample: footprint measured at every declared b from 0 to a declared maximum reachable within
        memory at a reduced-step/MD5-scale analogue, with the STAGE-4 fixed-footprint null run at every
        same b as the internal consistency check. Shortcut: none needed beyond direct instrumentation,
        since this is a software engineering measurement rather than a number-theoretic sampling problem
        requiring a correspondence like the Deuring correspondence. Comparison: empirical footprint(b)
        fit by linear regression against 2^b, with residuals reported explicitly rather than only the
        fitted slope, and an explicit statement of whether the linear-in-2^b form fits better than a
        flat (null-consistent) alternative. Tail check: the largest b reachable before footprint(b) exceeds
        the smallest declared C_total is the tail of this measurement, and the occupancy ceiling at that
        b (max_workers rounding toward zero) is reported as the boundary condition rather than omitted.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed. The deliverable is a resident-memory-footprint curve and a derived
      occupancy/throughput surface at declared analogue parameters.
    memory_exponent: >-
      No attack memory exponent is claimed in the asymptotic sense. The deliverable IS a memory measurement
      (per-worker footprint in bytes as a function of neutral-bit budget b), reported as an empirical
      curve rather than an exponent, since b is a declared implementation parameter and not a security parameter.
    best_known: >-
      The incumbent is the implicit, unmeasured assumption in every existing cost-model proposal against
      this RQ (IDEA-20260816-71d4dd, -1e36fa, -389b1b, -962936) that near-collision-phase memory is negligible
      relative to birthday-phase table memory or to per-evaluation compute cost -- an assumption this
      repository has never tested because no prior proposal measured this phase's own resident footprint.
      No algorithm is beaten; an unmeasured assumption is replaced by a measured curve and a derived occupancy model.
    hidden_overhead: >-
      The real risk is that the declared caching strategy (STAGE 1) is either unrealistically memory-hungry
      or unrealistically memory-frugal relative to what a genuinely optimised real attack implementation
      would use, in which case the measured curve characterises this proposal's engineering choice rather
      than "the" near-collision phase; this is disclosed in `interpretation_limits` rather than smoothed over.
    tradeoff_note: >-
      The occupancy model IS a time-memory tradeoff statement by construction: more memory per worker
      (larger neutral-bit budget b, hence higher per-worker throughput via more candidates generated
      per early-round solve) buys fewer concurrently resident workers under a fixed total pool, and effective
      phase throughput is the product of the two, reported as a surface over (b, C_total) rather than a single number.
  dominated_by: >-
    n/a (no result claimed). Checked across time, memory and data/query axes: the deliverable is a physical
    resident-memory-footprint measurement and a derived occupancy surface at analogue scale, placing
    no point on any attack frontier for SHA-1, MD5, or any other primitive. The single UNVERIFIED chosen-prefix
    cost row this repository holds in RQ-SHAONE-081e3a is on a disjoint axis set (it is a headline total,
    not a per-phase memory measurement), and none of the four existing memory- or cost-adjacent sibling
    proposals (71d4dd, 1e36fa, 389b1b, 962936) measures this specific phase-and-resource combination,
    so there is no existing row in this repository's corpus to dominate or be dominated by.
  sota_delta: >-
    No attack; conceptual/measurement contribution only. Quantitatively: the repository moves from zero
    measurements of near-collision-block-search resident memory (as distinct from birthday-phase table
    memory) to a footprint-vs-neutral-bit-budget curve with a fixed-footprint null control, a derived
    occupancy ceiling under a declared total-memory-pool sensitivity analysis, and an effective-phase-throughput
    comparison against a naive zero-footprint baseline. No speed comparison to any competing algorithm
    is stated because no algorithm is proposed.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    Separable parts. (1) That the STAGE-4 fixed-footprint null shows flat footprint across b, validating
    the instrumentation: about 0.75, since the null is engineered specifically to have no footprint-b
    dependence and the main risk is a compiler-inserted artifact. (2) That the real loop shows a footprint(b)
    curve statistically distinguishable from the null: about 0.5 -- I would not be surprised either way;
    a naively implemented candidate cache would clearly grow with b, but a carefully streamed implementation
    might not, and both outcomes are reportable per claim (E). (3) That, conditional on (2), the growth
    is well-approximated by the declared linear-in-2^b form rather than some other shape: about 0.45,
    since real caching data structures often have overhead terms that distort a clean linear fit at small
    b. (4) That the derived occupancy ceiling materially changes effective throughput at realistic C_total
    values (i.e. the effect is not swamped by having abundant memory relative to what any single worker needs):
    about 0.4. Composite roughly 0.13 for the full four-part design; the minimal two-point-plus-null
    test alone succeeds with probability near 0.6 and is cheap enough to run regardless of the composite odds.
