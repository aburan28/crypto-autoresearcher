  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-06'

  title: >-
    BEYOND THE BERNSTEIN-LANGE WEIGHT: at equal precomputation P and equal
    table size T, rank candidate distinguished points by the Galton-Watson
    posterior mean of the basin size given hit count and walk depths (R3), by
    the sum of squared lengths (R2), or by the Bernstein-Lange weight
    "total length + c W per walk" with the coefficient c swept away from
    their unexplored default c = 4 -- against the EXACT published weight
    (c = 4) as baseline -- and buy up to the measured estimation-loss gap
    (1.79 versus a model oracle of 1.28 at alpha = 1/2, N/T = 2) in the
    low-over-generation regime, with the gain vanishing by N/T = 8 where the
    published count-dominated selection already sits within 2% of the model
    ceiling
  class: algorithm

  claim: >-
    (A) WHAT BERNSTEIN-LANGE ALREADY DO (primary text, read 2026-09-06 via
    the coordinator's plain-text copy; lines quoted in citations). They
    define "most useful" as "having the largest number of ancestors", the
    ancestors being exactly the basin B(d) of IDEA-20260906-aed829; they
    estimate it by the number of walks reaching the point, note that this
    "is unreliable for a distinguished point found by very few walks,
    especially for distinguished points found by just one walk", and
    "propose using the walk length as a secondary estimate": in their
    experiments the weight is "the total length of all walks reaching the
    point, plus 4W per walk", and they "have not yet experimented with
    modifications to this weighting". So the sum-of-lengths statistic is
    KNOWN and is part of their published rule W_BL(d) = S_d + 4 W h_d, with
    S_d the total length and h_d the hit count. The COUNT rule (R0 of the
    superseded draft of this record) is the c -> infinity limit of
    W_c(d) = S_d + c W h_d and is NOT their baseline; the coordinator's
    scratch comparison of "sumlen" against "count" is therefore a
    comparison of c = 0 against c = infinity and says nothing about c = 4.
    (B) WHAT IS OPEN, IN THEIR OWN WORDS. The coefficient c (they leave it at
    4 unexplored), any nonlinear use of the lengths, and any model-based
    estimator. Under the basin model (H1-H2 of aed829) plus the depth law H3
    below, a walk of length l into a basin of size n has E[l | n] = kappa
    sqrt(n), so a single length carries an estimate of n proportional to
    l^2, and the Bayes-optimal ranking statistic at fixed T is the posterior
    mean E[n | h_d, l_1..l_{h_d}] under the size-biased Borel prior and the
    Poisson(T_gen n/N) hit law. The rules tested are:
      R_c  = S_d + c W h_d for c in {0, 1, 2, 4, 8, 16, infinity}
             (c = 4 is the published Bernstein-Lange rule and the BASELINE;
              c = 0 is sum of lengths; c = infinity is the count);
      R2   = sum of l^2 over walks reaching d;
      R3   = the posterior mean above, by one-dimensional quadrature.
    (C) HOW MUCH ROOM THERE IS, FROM THE PRIMARY TEXT AND THE MODEL. Their
    Table 4.1 (l about 2^48, W = alpha (l/T)^{1/2}) reports main-computation
    cost per successful logarithm, scaled by (l/T)^{1/2}: at N/T = 8, 1.38 at
    alpha = 0.707 (a = alpha^2 = 1/2) and 1.50 at alpha = 1 (a = 1); at
    N/T = 2, 1.62 at both; at N/T = 1, 2.14 and 2.01. The model oracle of
    aed829 (B3) gives 1.35 at a = 1/2 and 1.51 at a = 1: the published
    weight at N/T = 8 is ALREADY within 2% of the model ceiling, so no
    estimator can gain measurably there; at N/T = 2 the gap is 1.62/1.35 =
    1.20 (a = 1/2) and 1.62/1.51 = 1.07 (a = 1); at their headline point
    alpha = 1/2 (a = 1/4), N/T = 2, the measured 1.79 sits 1.40 above the
    model oracle 1.28. The room for R2/R3/c-sweep is therefore bounded by
    those gaps and is largest at small a and small N/T -- exactly where hit
    counts are 0 or 1 and the length term carries the ranking.
    (D) THE CLAIM, CHARGED. At fixed P (same T_gen, same W), fixed T, fixed
    bits per entry and fixed cap: coverage(R3) >= coverage(R_4) with a
    CI-separated margin at a = 1/4, N/T = 2, predicted +0.01 to +0.04
    absolute (equivalently 3-10% fewer stored DPs at fixed L, epsilon);
    c-sweep: the optimum c* is finite and depends on (a, N/T), predicted to
    move toward 0 as a falls and toward infinity as N/T grows; R2 between
    R_0 and R3. All gains vanish within CI at N/T = 8. CONSTANT-FACTOR,
    GENERIC, no exponent moves, no extra memory, no extra online cost.

  mechanism: >-
    STEP 1. Generate T_gen = (N/T) T walks from uniform random known-scalar
    starts, capped at 8W as in Bernstein-Lange; record (DP, length l). Cost
    P = sum of lengths, charged; capped walks charged at the cap.
    STEP 2. Aggregate per DP: h_d, S_d, Q_d = sum of l^2, and the depth
    multiset.
    STEP 3. Compute R_c for the c grid, R2, and the R3 posterior: prior on
    x = n/W^2 proportional to x^{-1/2} e^{-x/2}; hit likelihood
    Poisson((N/T) a x) at h_d; depth likelihood product of Rayleigh(scale
    kappa sqrt(x) W) at l_i (H3), kappa fitted once on separate seeds from
    aed829's exact-basin data and frozen; posterior mean by quadrature on a
    200-point log grid.
    STEP 4. For each rule, store the top T DPs (ties broken by a seeded
    permutation), identical bits per entry.
    STEP 5. Measure coverage EXACTLY (sum of true basins, N <= 2^26) and
    EMPIRICALLY (M = 40000 online walks, cap 8W, Wilson intervals); report
    T-at-fixed-coverage per rule by interpolating each rule's coverage-
    versus-T curve at the c = 4 rule's coverage at T = T0.
    STEP 6. Baseline reproduction: the c = 4 arm at a = 1/2 and a = 1,
    N/T in {1, 2, 8}, must reproduce Table 4.1's scaled costs (2.14/2.01,
    1.62/1.62, 1.38/1.50) within 0.1 in the generic instrument; if it does
    not, the harness is not comparable to the paper and nothing downstream
    is reported.
    STEP 7. Nulls and decay (below). STEP 8. Curve arm with certificates.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus and web search as in IDEA-20260906-aed829; plus the primary
      text of Bernstein-Lange (cr.yp.to/dlog/cuberoot-20120919.pdf, 22
      pages), fetched and read by the coordinator on 2026-09-06 and
      re-checked by this session by grep of the plain-text copy for the
      selection passage (lines 458-486 of the copy), the experiment
      parameters (631-668) and Table 4.1 (672-741).
    results: >-
      COMPONENT LABELS. R_0 (sum of lengths) and R_infinity (count): KNOWN --
      both are limits of the published weight S_d + 4 W h_d, and the paper
      states the count is unreliable at one hit and the length is the
      secondary estimate. R_4: KNOWN, it is the published rule. The c-sweep,
      R2 and R3: not in the paper, which says "we have not yet experimented
      with modifications to this weighting"; no corpus record and no search
      hit proposes a model-based posterior or a squared-length statistic for
      DP-table selection. The perfect-table TMTO literature (listings only)
      computes average chain lengths for coverage formulas, not per-entry
      rankings. The coordinator's scratch (internal, unverified) compared
      c = 0 with c = infinity only.
    verdict: >-
      UNVERIFIED for the record as a whole, for one reason only: the depth
      law H3 that motivates R2 and R3 rests on a recalled, unopened reference
      (Aldous, continuum random tree). The component labels are: R_0, R_4,
      R_infinity known (primary text read); c-sweep, R2, R3 adaptation of the
      paper's own unexplored suggestion. The label converts to adaptation
      when a validator opens the depth-law reference or when aed829's Step 2
      measures H3 directly, which makes the reference unnecessary.

  discriminated_from:
    - >-
      Bernstein-Lange (primary text, retrieved): the published weight
      S_d + 4 W h_d IS the baseline of this record; this record changes only
      the functional form of the ranking statistic (c, squares, posterior).
      The superseded draft of this record wrongly took the count as the
      baseline; that comparison is withdrawn.
    - >-
      IDEA-20260906-aed829: the instrument that scores every rule here; the
      c = 4 arm there is the same code path.
    - >-
      Perfect-table DP tradeoffs (Borst-Preneel-Vandewalle, recalled;
      Avoine-Junod-Oechslin, Lee-Hong, retrieved listings): deduplicate
      merged chains and analyse average chain length; no per-entry ranking.
    - >-
      IDEA-20260906-a3d6ae: batch growth of the table; orthogonal.

  object_first_candidate:
    tracked_object: >-
      THE PER-DP SUFFICIENT STATISTIC (h_d, l_1..l_{h_d}) of the generation
      walks, projected to a scalar rank. The published weight is one affine
      projection of it; R2 and R3 are others.
    lossiness: >-
      GENUINELY LOSSY: forgets the walks' start points, scalars, and every
      intermediate point; keeps counts and depths.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED. Adding one generation walk updates
      (h_d, depths) deterministically; the retained part propagates without
      the discarded part. Not a change of coordinates.
    survival_score: >-
      Survives any change of curve or walk at fixed theta. Its informativeness
      dies as N/T -> infinity (counts become exact; the paper says the same:
      "This issue disappears as the number of random walks increases towards
      larger multiples of T") and at small W where depth and size
      decorrelate.

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL A (length shuffle): replace each walk's
    length by an independent draw from the empirical length distribution,
    keeping the DP; R_c for every finite c, R2 and R3 must then collapse to
    the count within CI. NULL B (relabelling): permute the statistic vector
    among DPs; coverage must equal the unselected control. DECAY PARAMETER:
    mix each length as l' = (1 - lambda) l + lambda l~ with l~ an independent
    draw, lambda in {0, 0.25, 0.5, 0.75, 1}; every gain over the count must
    decrease monotonically to zero at lambda = 1, and the R3 gain over R_4
    must decay with it. STRUCTURAL TELL: every gain must shrink with N/T
    and be indistinguishable from zero at N/T = 8, where the published rule
    already sits at the model ceiling (Table 4.1 versus aed829 (B3)); a gain
    at N/T = 8 contradicts both the model and the paper and is an artifact
    signature.

  assumptions:
    - >-
      Basin model of IDEA-20260906-aed829 (H1, H2) and its closed forms,
      still derivations of this batch and unverified by a validator.
    - >-
      Bernstein-Lange's Table 4.1 values and the selection passage are
      relayed from the coordinator's plain-text copy and re-checked by grep;
      the PDF itself was not opened by this session.
    - >-
      The coordinator's scratch numbers compare c = 0 with c = infinity and
      are NOT evidence about c = 4; they are cited only as the origin of the
      question.
    - >-
      Bits per entry are identical across rules; lengths are used only at
      selection time and not stored.

