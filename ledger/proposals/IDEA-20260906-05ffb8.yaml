    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      Empirical algorithm-class record; its ceiling is the oracle of
      IDEA-20260906-aed829 and its model is derived in IDEA-20260906-ac100b.
      The baseline-reproduction obligation is carried as mechanism STEP 6.

  predictions:
    - metric: c = 4 arm scaled main-computation cost at a in {1/2, 1}, N/T in {1, 2, 8}, generic instrument at l about 2^48 emulated by N = 2^30 and 2^40
      direction: different
      minimum_effect: >-
        Within 0.10 of Table 4.1 (2.14/2.01, 1.62/1.62, 1.38/1.50); this is
        the baseline embedding and gates everything else.
    - metric: coverage(R3) - coverage(R_4) at T = T0, a = 1/4, N/T = 2
      direction: higher
      minimum_effect: >-
        At least +0.01 absolute with the 95% CI excluding 0 (exact coverage,
        seed bootstrap); predicted +0.01 to +0.04. Zero within CI rejects R3
        in this regime.
    - metric: T at fixed coverage, R3 relative to R_4, at a = 1/4, N/T = 2
      direction: lower
      minimum_effect: >-
        Ratio at most 0.97 with CI excluding 1.0; predicted 0.90-0.97. Ratio
        1.0 at N/T = 8 is CONSISTENT with the mechanism.
    - metric: optimum c* of the c-sweep as a function of (a, N/T)
      direction: different
      minimum_effect: >-
        c* finite, decreasing in a at fixed N/T and increasing in N/T at
        fixed a, with the coverage at c* above the c = 4 coverage by a
        CI-separated margin in at least one cell with a <= 1/2, N/T <= 2. A
        flat coverage-versus-c curve everywhere means the published c = 4 is
        already optimal within resolution and is a complete answer.
    - metric: coverage(R2) relative to R_0 and R3
      direction: different
      minimum_effect: Between them within CI, or reported as an exception.
    - metric: all gains under NULL A and at lambda = 1
      direction: different
      minimum_effect: Zero within CI at every cell.
    - metric: all gains at N/T = 8
      direction: different
      minimum_effect: Zero within CI (the paper's rule is at the model ceiling there).

  minimal_test:
    design: >-
      STAGE 0 (done for the selection rule; remaining reading): the
      coordinator's read of the primary text supplies the weight, the
      parameters and Table 4.1; the remaining Stage 0 item is a validator
      opening the depth-law reference or, equivalently, aed829 Step 2
      measuring H3 directly.
      STAGE 1 (minutes, THE CHEAPEST VALID DISCRIMINATOR): N = 2^22, exact
      basins, a = 1/4, N/T = 2, 5 seeds: exact coverage of R_c for the c grid,
      R2, R3, the generated-set oracle, the unselected control and NULL A.
      One array pass per seed; this decides whether any modification of the
      published weight moves coverage at all, with no sampling error in the
      coverage.
      STAGE 2 (about one hour): STEP 6's baseline reproduction at a in
      {1/2, 1}, N/T in {1, 2, 8}, N in {2^24, 2^26}; then the full grid
      a in {1/8, 1/4, 1/2, 1}, N/T in {1, 2, 4, 8}, 5 seeds; the lambda
      decay; T-at-fixed-coverage interpolation.
      STAGE 3 (hours): N in {2^30, 2^34, 2^40} empirically (M = 40000 online
      walks per cell, cap 8W), 3 seeds; N-independence of every gain.
      STAGE 4 (hours): toy-curve arm at N about 2^24, r-adding walk r = 32,
      every solved logarithm certified; report R3/R_4 on the curve beside
      the generic instrument. Seeds and CI methods as in aed829.
    controls:
      - R_4, the published Bernstein-Lange weight, at identical T, W, T_gen, cap, bits (BASELINE)
      - R_0 (sum of lengths) and R_infinity (count) as the two limits
      - unselected uniform-random table of the same T
      - rho with DPs and no table
      - generated-set oracle and global oracle
      - NULL A length shuffle; NULL B relabelling; lambda decay sweep
      - Table 4.1 baseline reproduction (STEP 6)
      - N-independence across 2^22..2^40
    required_metrics:
      - exact and empirical coverage per rule, per (N, a, N/T), with CIs
      - scaled main-computation cost per rule beside Table 4.1 values
      - T at fixed coverage per rule relative to R_4, bootstrap CI over seeds
      - precomputation group operations (identical across rules; reported)
      - online group operations per solved target per rule
      - bits per entry (identical; reported)
      - fitted kappa and the depth-law goodness of fit (H3)
      - certificate pass count on the curve arm

  falsification_conditions:
    - >-
      STEP 6 fails to reproduce Table 4.1 within 0.10: the harness is not
      comparable to the paper; nothing is reported and the run set is
      invalid, not negative.
    - >-
      coverage(R3) <= coverage(R_4) within CI at a = 1/4, N/T = 2, at
      N >= 2^22, AND the c-sweep is flat: the published weight is already
      optimal within resolution; the record is rejected and that is a
      complete, citable answer to the handoff's "selection rules beyond
      popularity" direction.
    - >-
      Any gain survives NULL A or fails to decay with lambda: artifact; the
      run set is invalid.
    - >-
      A gain appears at N/T = 8: contradicts the paper and the model; the
      effect is something else, to be reported without a mechanism claim.
    - >-
      R3 below R_4 by a CI-separated margin: the posterior model H3 is
      mis-specified; R3 is withdrawn, the c-sweep result stands on its own.
    - >-
      The curve arm shows no gain while the generic arm does: a walk-quality
      confound, reported as such; no rule claim on curves.

  confounders:
    - >-
      Cap handling: Bernstein-Lange cap generation and online walks at 8W;
      every arm must use the same cap and charge capped walks identically.
    - >-
      "N = T" in the paper means T distinct DPs kept after discarding
      duplicates (they note this biases toward short walks); the N/T = 1
      baseline cell must replicate that procedure, not "T walks".
    - >-
      kappa fitted on the same data it is scored on inflates R3; fit on
      separate seeds.
    - >-
      Table 4.1 is at l about 2^48 with W = 2^19; emulating it at N = 2^30
      changes theta by 2^{-6} relative and the O(theta) corrections with it;
      the reproduction tolerance 0.10 is set for that.
    - >-
      At a = 1 the hit counts are higher and every length effect is smaller;
      cells must not be pooled across a.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy; the gain is a constant factor bounded by
      the measured N/T = 2 gap and never an exponent.
    - >-
      Valid only for random-function-like walks with a point-local DP rule.
    - >-
      The reduction is in T at fixed (P, L, epsilon, bits); it is not a
      reduction in P and is reported as a point on the (P, S, L, epsilon, U)
      frontier. Bernstein-Lange's Figure 4.3 already shows that extra
      precomputation buys more than alpha-tuning; this record does not
      change that ordering.

  heuristic_assumptions:
    - id: H3
      statement: >-
        DEPTH LAW. For the DP-truncated random-function walk, conditional on
        a basin having size n with W^2/10 <= n <= 4 W^2, the distance from a
        uniformly random point of the basin to its DP has mean kappa sqrt(n)
        and a Rayleigh-type law with coefficient of variation in [0.4, 0.6],
        with kappa in [0.8, 1.6] independent of N for N in [2^20, 2^40].
      rigorous_support: >-
        Imitates the height and depth laws of critical Galton-Watson trees
        conditioned on total size (Aldous continuum random tree limits:
        depth of a random vertex of a size-n tree is of order sqrt(n) with a
        Rayleigh limit law; recalled, hedged). The walk's tree is Poisson
        (1 - theta), subcritical by theta, so the law is critical-like for
        n << 1/theta^2 = W^2 and is distorted near the cutoff; the stated
        range is where the imitation is expected to hold.
      validation_plan: >-
        Sample: from the exact-basin enumeration of aed829 at N in {2^22,
        2^24, 2^26}, for every basin with n in the stated range, the depth
        of every point (available for free from the enumeration); fit
        kappa by least squares of mean depth against sqrt(n); compare the
        empirical depth CDF within size bins with the Rayleigh prediction by
        a KS statistic at alpha = 0.01; tail check: the deepest point per
        bin against the Rayleigh 99.9% quantile. Transfer assumption: the
        same law at cryptographic N, not tested.
    - id: H1-H2
      statement: >-
        Inherited from IDEA-20260906-aed829 (random-function heuristic and
        size-biased sampling).
      rigorous_support: As in IDEA-20260906-aed829.
      validation_plan: As in IDEA-20260906-aed829.

  target_complexity:
    time_exponent: >-
      ONLINE 1/3 in N, unchanged; the constant targeted is a 3-10% reduction
      of L at fixed T (or of T at fixed L) at a = 1/4, N/T = 2, bounded above
      by the measured gap 1.79/1.28 = 1.40; zero at N/T = 8.
      PRECOMPUTATION 2/3, constant unchanged (same T_gen and W).
    memory_exponent: >-
      1/3 in N, unchanged; T reduced by the predicted factor 0.90-0.97 at
      fixed L, bits per entry unchanged.
    best_known: >-
      Bernstein-Lange published weight S_d + 4 W h_d at T = N^{1/3}: 1.79
      (l/T)^{1/2} at alpha = 1/2, N/T = 2 (headline; 1.77 at T = 2^16);
      1.38 at alpha = 0.707, N/T = 8 (Table 4.1). Model oracle of aed829 at
      the same (T, W): 1.28 and 1.35 respectively.
    hidden_overhead: >-
      The R3 quadrature is O(T_gen) scalar work, negligible. The gain is
      bounded by the N/T = 2 estimation gap, which the paper's own Figure 4.3
      shows is cheaper to close by extra precomputation than by anything
      else; the record's value is at fixed P only.
    tradeoff_note: >-
      Moves the (P, L) curve at fixed T down for small N/T only; for a table
      amortised over many targets the optimal N/T is large and the gain is
      nil. Parallelisation unchanged.

  dominated_by: >-
    CHECKED ROW BY ROW. Rho with DPs (KN-TECH-001): dominates on memory and
    precomputation, not on online time at T = N^{1/3}. Bernstein-Lange
    published weight: tied on P, S, U; this record predicts strictly lower L
    (or T) by 3-10% at N/T = 2, a <= 1/2 -- NOT dominated on that axis if the
    prediction holds. Bernstein-Lange at N/T = 8: dominates this record's
    N/T = 2 cells on L at 4x the P, which is the paper's own recommended
    direction and is not contested. Oracle ceiling (aed829, model):
    dominates on L at every N/T but is not an algorithm at finite P.
    Kuhn-Struik batch rho: dominates on P for U >= N/W^2. CGK bound: the
    ceiling. dominated_by on the (T at fixed P, L, epsilon, U = 1, N/T = 2)
    axis: null after this check.
  sota_delta: >-
    Predicted 3-10% fewer stored DPs than the published Bernstein-Lange
    weight at equal P, L, epsilon, bits and cap for N/T = 2, a <= 1/2; zero
    at N/T = 8. The superseded draft's 5-15% against the count rule is
    withdrawn because the count is not the published baseline. Exponents
    unchanged (1/3, 1/3, 2/3).

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.45 that R3 beats the published weight with a CI-separated margin at
    a = 1/4, N/T = 2 (the paper's weight already uses the length; the
    posterior can only sharpen it). 0.5 that the c-sweep finds a c* with a
    CI-separated gain in at least one small-a cell. 0.3 that the T ratio
    reaches 0.93 or better anywhere. 0.9 that all gains vanish by N/T = 8.
    0.7 that STEP 6 reproduces Table 4.1 within 0.10 on the first attempt.
    The most likely honest outcome is "the published weight is within
    resolution of optimal at N/T >= 2", which closes the selection-rule
    direction of the handoff with a measurement rather than a fatigue
    report.

