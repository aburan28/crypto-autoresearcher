idea:
  id: IDEA-20260808-6a2b50
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  title: Is the measured solving degree a coordinate artifact? Import the generic-coordinates
    criterion and the Castelnuovo-Mumford regularity bound, test whether Semaev systems are
    in generic coordinates, and convert the lane's heuristic first-fall proxy into a rigorous
    upper bound
  class: measurement
  claim: 'There is a published invariant-theoretic route that this lane does not use: for
    a polynomial system in GENERIC COORDINATES, the solving degree is bounded above by the
    Castelnuovo-Mumford regularity of the homogenised ideal — a RIGOROUS bound, unlike the
    first-fall-degree proxy on which every binary-ECDLP subexponential claim rests. CLAIM,
    IN TWO PARTS. (P1) STRUCTURAL: the chained boolean Semaev system (t=3, ti=0, m=3) and
    the prime-field decomposition ideal I_R are NOT in generic coordinates, in the precise
    sense that a uniformly random invertible linear change of variables changes the graded
    rank profile. (P2) OPERATIONAL: under a random linear change of coordinates the measured
    solving degree d_solve either (a) DROPS, in which case every deficit this programme has
    measured — 1322 at n=12 D5, the quarantined 17947 at D6, the 7110 of EV-SIG-008 — is partly
    a coordinate artifact and the intrinsic invariant is reg(I^hom); or (b) does NOT drop,
    in which case the low solving degree (where it exists) is intrinsic and a rigorous upper
    bound becomes available by computing reg(I^hom) directly. BOTH OUTCOMES ARE DELIVERABLES;
    the lane currently has neither.'
  mechanism: 'The programme measures d_solve and deficits with respect to a semi-regular null
    and treats the result as a property of the system. Solving degree is NOT a coordinate
    invariant: it depends on the monomial order and on the linear coordinate frame, whereas
    the last fall degree is order-independent (KN-LIT-7607) and Castelnuovo-Mumford regularity
    is a genuine ideal invariant. A system that is not in generic coordinates can have solving
    degree far above reg(I^hom), and the classical repair is randomisation of the frame. The
    corpus already contains the relevant vocabulary in KN-LIT-1540, which reports for an algebraic
    modelling of the supersingular isogeny problem that the systems "are not in generic coordinates"
    — the same authors'' framework, applied to a neighbouring problem, and never applied here.
    The obvious countervailing effect must be stated up front and is the reason this is a
    measurement rather than a proposed speedup: a random linear change of variables DESTROYS
    sparsity and destroys the S_m symmetry, so the practical cost can rise even where the
    degree falls. The experiment therefore reports degree and cost as two separate columns.'
  why_not_a_renamed_known_approach: 'Nearest in-corpus item is catalogue entry A2-12 ("weight-order
    sensitivity: is the solving degree an invariant of the system or an artifact of the grading"),
    which varies the TERM ORDER / weights. This record varies the LINEAR COORDINATE FRAME,
    which is a different group acting (GL_n on variables versus the choice of monomial order)
    and a different theorem (regularity in generic coordinates versus order-independence).
    Nearest external method is generic-change-of-coordinates preprocessing before a Groebner
    computation, standard in commutative algebra; what is not standard is applying it as a
    DIAGNOSTIC to decide whether a measured cryptanalytic deficit is intrinsic.'
  predictions:
  - observable: graded rank profile before and after a random GL change of variables
    metric: rank(Mac_D) at every D, boolean chained Semaev at n in {9,12}, and prime-field
      I_R at B in {6,8}, m in {2,3}
    predicted: 'If (P1) holds the profiles differ at some degree. FORCED CHECK: the number
      of solutions is invariant under a linear change of variables, so the corank at d_solve
      must be IDENTICAL in both frames; a run where it differs has a bug, and that is a free
      correctness gate.'
  - observable: d_solve in the random frame minus d_solve in the native frame
    metric: integer difference, >= 8 random frames per cell
    predicted: Three outcomes. Negative (degree drops) — the native frame is pathological
      and deficits are partly artifacts. Zero — solving degree is frame-robust here and reg(I^hom)
      is a candidate rigorous bound. Positive (degree rises) — the native frame is BETTER
      than generic, which would be the most interesting outcome of all, because it means the
      Semaev structure is a favourable coordinate choice and quantifies by how much.
  - observable: cost in the two frames
    metric: nonzero count of the Macaulay matrix and operation count
    predicted: Nonzero count rises by a large factor in the random frame at every cell. This
      is expected and is NOT evidence against the degree finding; reporting both columns is
      what prevents the two effects being confused.
  minimal_test: 'One instrument, four arms. Arm A: boolean chained Semaev at n = 9 and 12,
    native frame, exact GF(2) graded ranks (this reproduces committed cells and is the baseline-reproduction
    gate). Arm B: same systems after a uniformly random invertible GF(2) change of variables,
    >= 8 frames, same ranks. Arm C: prime-field I_R at p = 1009, B in {6,8}, m in {2,3}, native
    and random frames. Arm D: the support-matched semi-regular null in both frames, which
    must be frame-INSENSITIVE by construction and is the calibration. Deliverable: a table
    of (d_solve, corank at d_solve, nonzero count) per arm.'
  controls:
  - Arm D (null in both frames) must show no degree change. A null that moves under a change
    of frame means the instrument is measuring the frame, not the system, and nothing else
    may be read.
  - Corank invariance at d_solve (solution count is frame-invariant) is a free per-run correctness
    gate.
  - Identity-frame arm: applying the identity matrix must reproduce arm A bit for bit.
  - Repeat with >= 8 independent frames; a single frame cannot distinguish a genuine drop
    from a lucky draw, and the spread across frames is itself reported.
  confounders:
  - Random frames destroy sparsity, so any wall-time comparison is meaningless; only operation
    counts and degrees are comparable.
  - Random frames destroy the S_m symmetry, so a symmetry-exploiting solver loses its advantage;
    the comparison must use the same solver in both frames.
  - Over GF(2) the field equations x^2 = x are NOT preserved by a linear change of variables
    in the naive sense (they are, being GF(2)-linear-friendly, but their interaction with
    the affine part is not) — the implementation must re-derive the field equations in the
    new frame and record that it did.
  - Small n or small B may leave d_solve pinned at the Semaev degree, where no frame effect
    can appear.
  falsification_conditions:
  - Arm D (the null) shows a frame-dependent degree. Instrument void.
  - Corank at d_solve differs between frames in any run. Implementation bug; the run is discarded,
    not interpreted.
  - d_solve is identical in native and all random frames across every cell. (P1) is false
    as an operational statement, the artifact hypothesis dies, and reg(I^hom) becomes the
    recommended rigorous bound to compute.
  interpretation_limits: Toy tier. Establishes nothing about crypto-scale systems. A drop
    in d_solve under randomisation does NOT mean the systems are easier — the randomised system
    is more expensive to reduce — it means the measured deficit is not a coordinate-free quantity
    and must be re-stated before it can support any claim. The regularity bound itself is
    only invoked as an upper bound under a genericity hypothesis that this experiment tests
    rather than assumes.
  assumptions:
  - Exact ranks over the base field; no floating point anywhere.
  - The same solver and the same degree-graded termination criterion in both frames.
  - Solution counts obtained independently by enumeration where feasible.
  heuristic_assumptions:
  - id: HA-1
    statement: For a system in generic coordinates the solving degree is bounded above by
      the Castelnuovo-Mumford regularity of the homogenised ideal, and a uniformly random
      linear change of variables puts a system in generic coordinates with probability 1 -
      o(1) over a large enough field.
    rigorous_ingredient: 'UNVERIFIED EXTERNAL RESULT, recorded as such: the solving-degree
      <= regularity bound in generic coordinates is attributed to the Caminata-Gorla line
      of work, and the notion "not in generic coordinates" appears in-corpus at KN-LIT-1540
      for a neighbouring algebraic modelling. I could not open any primary source this session
      (WebSearch and WebFetch both failed with a backend model error; eprint.iacr.org is separately
      recorded as returning 403 from this environment). CONFIRMATION ROUTE: fetch the Caminata-Gorla
      papers on solving degree, regularity and last fall degree, transcribe the exact hypothesis
      (which grading, which field-size requirement, affine versus homogeneous) and the exact
      inequality, and record them in knowledge/literature/ before any bound is quoted. Until
      then the bound is a MOTIVATION for the experiment and is not used as an ingredient of
      any claim.'
    distribution_imitated: Genericity in the Zariski sense — the property holds off a proper
      closed subset of GL_n, so a random frame avoids it with high probability over a large
      field. Over GF(2) that probability argument is weak and the experiment compensates with
      >= 8 frames.
    validation_route: 'The experiment IS the validation: measure d_solve across >= 8 frames
      per cell and report the distribution, not the mean. Over GF(2) also report how many
      of the 8 frames agree, since small-field genericity is the weakest link. TOY SCALE.'
    tail_checks: Report the minimum d_solve over all frames per cell; if a single frame achieves
      a much lower degree than the rest, that is a rare-good-frame phenomenon and is a separate,
      exploitable finding that must not be averaged away.
  target_complexity:
    time_exponent: No attack exponent is proposed. The record can only change the value of
      the algebraic oracle exponent theta that E2-02 consumes. If d_solve drops by a constant
      number of degrees, theta is unchanged asymptotically; if it drops from Theta(B) to O(B^{gamma}),
      theta drops from m omega to gamma m omega and the E2-02 threshold theta < (m-1)/2 becomes
      reachable only for gamma < (m-1)/(2 m omega).
    memory_exponent: Rises in the random frame by the sparsity-loss factor, which the experiment
      measures as the nonzero count and does not model.
    best_known_baseline: rho sqrt(N); for the sub-question "what bounds the solving degree",
      the incumbent is the heuristic first-fall proxy, which is exactly what a rigorous regularity
      bound would replace.
    hidden_overhead_disclosure: The regularity bound, if confirmed, is an upper bound that
      can be astronomically loose; a bound is not a cost model, and this record does not claim
      it is one.
    time_memory_tradeoff: Not applicable; both frames are solved by the same method.
  sota_delta: Zero on attack axes. The deliverable is either a re-statement obligation for
    every deficit in GOAL-DREG-001 and GOAL-SIG-001 (if degrees are frame-dependent) or the
    first rigorous-upper-bound route this lane has had (if they are not). Quantitatively,
    the reportable number is the integer d_solve difference per cell and its spread over >=
    8 frames.
  dominated_by: n/a (no algorithmic result claimed); frontier checked. rho, BSGS, van Oorschot-Wiener,
    S T^2 = Omega~(N), sqrt(TN) all checked and none is approached or affected. The nearest
    DOMINATING instrument for the specific sub-question is the last fall degree (KN-LIT-7607),
    which is already order-independent and is a stronger invariant than anything measured
    here; that is stated because it partially dominates this record's motivation and the honest
    response is to run both.
  estimated_cost: Implementation low-medium (a change-of-frame wrapper around the existing
    exact-rank engine); compute medium (arm B multiplies existing cell costs by the number
    of frames and by the sparsity loss — the n=12 D6 boolean cell is already expensive and
    should be attempted only after n=9 settles).
  recommended_priority: high
  honest_prior_of_survival: 0.75 that (P1) holds — Semaev systems are highly structured and
    almost certainly not in generic coordinates. 0.45 that d_solve actually DROPS in the random
    frame at a measurable cell (structure often helps rather than hurts, and the positive-difference
    outcome is genuinely plausible). 0.3 that the external bound can be transcribed and used
    at all without web access.
