  discriminated_from: Catalogue A2-12 varies the term order/grading; this varies the linear
    frame — different group, different theorem, and the two can be run in the same harness
    and cross-checked. IDEA-20260801-002 computes the graded pivot-degree Hilbert function
    in the NATIVE frame; this record's claim is that the native frame may not be the right
    one to compute it in. KN-LIT-7607's last fall degree is order-independent BY CONSTRUCTION
    and is the stronger invariant — this record does not compete with it and explicitly recommends
    running both (see E2-07 and E2-08).
