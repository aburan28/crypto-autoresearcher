idea:
  id: IDEA-20261006-64c06d
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Least bit of x(P) agrees with the least bit of x([2]P) on a count
    other than half the eligible points of y^2 = x^3 + x + 1 over F_1009
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. R1 is the affine x-coordinate, read as
    an integer in {0, 1, ..., 1008}. The attack stage is one
    itinerary bit under doubling, not a collision search. The
    discrete-log exponent versus Pollard rho stays 1/2. Let p = 1009
    and let E be y^2 = x^3 + x + 1 over F_p. The discriminant
    4 + 27 = 31 is not 0 in F_p. 1009 is prime. Let b(t) be t mod 2
    for the representative in {0, ..., p - 1}. Let M be the number of
    affine points P with y not 0, and let C be the number of those
    points with b(x(P)) = b(x([2]P)). The claim is that 2C is not
    equal to M. The concrete negative is that the instrument checks
    pass and 2C = M. If M = 0 the cell is unmeasured. This is not a
    spectral radius of an r-adding walk, not the y-axis prefix count
    of scalars 2, 5, and 11, and not a discrete logarithm.
  mechanism: >-
    OBJECT FRAME. The representation is the least bit of the affine
    x-coordinate. The operation set is {doubling}. The predicate
    compares that bit on P with the same bit on [2]P. Negation does
    not change x, so P and -P carry the same agreement bit and the
    comparison is not forced to one half by the pairing. LOSSY-PROJECTION
    TEST. The projection keeps one bit of agreement and discards y,
    the rest of x, and the discrete log. Many points share the agree
    label and many share the disagree label. The projection is lossy.
    It is not a block system of the translation group, and it is not
    the transition matrix of an r-adding walk.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question asks whether a cheap coordinate predicate carries
        discrete-log information. An itinerary bit is one such
        predicate. This record measures one equality count, not the
        spectrum of a walk.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: KR-RHO-cd86f5
      provenance: internal
      claim: >-
        r-adding walks change the rho walk constant. This record does
        not run a walk and does not estimate that constant.
      verified_by: >-
        design session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-cd86f5.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs Omega(sqrt(p)) group operations.
        A bit-agreement count does not move that exponent.
      verified_by: >-
        design session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: Silverman, The Arithmetic of Elliptic Curves, duplication formula
      provenance: recalled
      claim: >-
        On a short Weierstrass model in odd characteristic, [2]P is
        infinity exactly when y(P) = 0, and otherwise x([2]P) is a
        rational function of x(P) and y(P). The book was not opened.
      verified_by: null
  assumptions:
    - 1009 is prime. It was checked with sympy.isprime in this session.
    - The discriminant of y^2 = x^3 + x + 1 is 31, which is not 0 in F_1009.
    - The representative of a field element used for the least bit is the integer in {0, 1, ..., 1008}, not a signed residue.
    - Points with y = 0 are excluded because x([2]P) is then undefined.
  proof_search_map:
    not_applicable_reason: >-
      This is one comparison of an integer count with half the
      eligible points. It is not a theorem about walk eigenvalues.
    bottleneck: >-
      The defect |2C - M|. A value of 0 is exact balance of the
      agreement bit. Any positive value is the claim.
    baseline_embedding:
      parameter_slice: p = 1009, model y^2 = x^3 + x + 1, least bit of x, doubling
      reproduction_check: >-
        x([2]P) is computed by the duplication formula and again by
        adding P to P. The two x-coordinates must agree. One
        disagreement voids the cell.
    observation_collision:
      observable: the pair (C, M)
      distinct_preimage_search: >-
        Exact balance 2C = M is one integer relation. An empty
        eligible set is a different outcome and is not called balance.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the agree and disagree fibers of the least bit under doubling
        predicted_gain: >-
          2C is not M, or the record reports that it is.
    quantifier_order: >-
      Exists this one curve over F_1009 such that 2C is not M, when
      M is at least 1. Not for all curves and not for all bits.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two integers C and M on this curve. They do not certify
        a discrete logarithm.
      nearby_object_control: >-
        The same count after replacing b(t) by 1 - b(t). Agreement is
        invariant under flipping both bits, so the second count must
        equal C. A mismatch voids the instrument.
    proof_obligations:
      - claim: C counts only points with y not 0, and only the representative in 0 through p - 1.
        responsibility: correctness
  predictions:
    - metric: absolute difference of 2C and M
      direction: different
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Enumerate E over F_1009. Reject the cell if the discriminant is
      0 or if M = 0. For each affine P with y not 0, compute [2]P by
      duplication and by adding P to P, and increment C when the least
      bits agree. Emit C, M, and 2C - M.
    controls:
      - >-
        Two addition methods agree on x([2]P). One disagreement voids
        the cell.
      - >-
        Bit-flip control: replacing b by 1 - b on both points leaves
        C unchanged. A change voids the instrument.
      - >-
        Representative control: a signed residue, with negatives
        wrapped by adding p, must reproduce the same least bits. One
        mismatch voids the cell.
      - >-
        Exclusion control: points with y = 0 are tallied separately
        and are not in M. Infinity is not given the bit 0.
    required_metrics:
      - C and M
      - 2C - M
      - the y = 0 tally
  falsification_conditions:
    - The instrument checks pass, M is at least 1, and 2C = M. That equality is the negative.
    - The discriminant is 0, or M = 0. The cell is unmeasured.
    - The two addition methods disagree, or the bit-flip control changes C. The instrument is void.
  confounders:
    - >-
      Using x mod r for r greater than 2 is a different predicate.
      This record uses only the least bit.
    - >-
      IDEA-20260905-9c4f0c studies the transition operator of an
      r-adding walk. This record does not build that matrix and does
      not report an eigenvalue.
    - >-
      A point and its negative share x, so they contribute two to the
      same side. The count is still of points, and that pairing does
      not force 2C = M.
  interpretation_limits:
    - A nonzero defect is one bit on one curve at p = 1009. It is not a walk speedup.
    - The exponent delta versus Pollard rho is 0.
    - This record does not restate the y-axis prefix census, a slope-character bin count, an FGLM degree, or a translation product equal to a curve constant.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The least bit of x([2]P) is independent of the least bit of
        x(P) at rate 1/2, up to an error 1/M, as it would be if the
        doubling map sent x to a uniform field element. The claim
        tested here is only that the agreement count is not exactly
        half the eligible points.
      rigorous_support: >-
        x([2]P) is a rational function of degree 4 in x when y is
        eliminated, on the points where it is defined. That degree is
        the proved piece. Independence of least bits is the random
        model, not a theorem about this cubic. KR-RHO-cd86f5, opened,
        is about walk constants and does not state this count.
      validation_plan: >-
        Compute C and M by enumerating F_1009. Compare 2C with M
        exactly. Do not sample a subset. A difference of 0 falsifies
        the imbalance on this curve. A timeout does not.
  target_complexity:
    time_exponent: >-
      Enumeration is Theta(p) field operations. The discrete-log
      exponent stays 1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) beyond the current point.
    best_known: Pollard rho at Theta(N^{1/2}) group operations, KR-RHO-13bf67.
    hidden_overhead: No o(1) attack term. No collision search is run.
    tradeoff_note: >-
      No time-memory tradeoff. Distinguished-point storage does not
      apply to a one-pass census.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this count is dominated by Pollard rho.
    KR-RHO-13bf67 and KR-RHO-cd86f5 were opened, as were KR-RHO-fb88e6,
    KR-RHO-6239aa, and KR-RHO-6654ba. None of those rows defines 2C - M
    for this bit. They dominate any reading of C as an attack. They
    do not dominate the integer comparison itself.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. This
    census returns one integer defect at cost Theta(p), not a
    logarithm at cost Theta(N^{1/2}).
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-cd86f5
      - KR-RHO-fb88e6
      - KR-RHO-6239aa
      - KR-RHO-6654ba
    nearest:
      - ref: KR-RHO-cd86f5
        provenance: internal
        relation: adjacent
        delta: >-
          r-adding walks change a walk constant. This record's
          walk-constant delta is 0. The new integer is 2C - M for one
          doubling bit, which that row does not define.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          Time-exponent delta versus Omega(sqrt(p)) is 0. The bit
          count is not a generic-group algorithm.
      - ref: KR-RHO-6239aa
        provenance: internal
        relation: orthogonal
        delta: >-
          Distinguished points trade memory for a collision search.
          This census stores O(1) and does not search. The memory
          exponent of the census is 0 in the number of stored points.
    searched:
      corpus_grep:
        - >-
          Proposals on origin/main bound to RQ-ECDLP-4fcbd3 include
          IDEA-20260905-9c4f0c, which is the real-walk transition
          operator. This record does not build that operator.
        - >-
          PR 1952 and PR 1953 ideas were read at title and claim.
          None is a least-bit agreement count under doubling.
