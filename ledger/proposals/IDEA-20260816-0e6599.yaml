idea:
  id: IDEA-20260816-0e6599
  question_id: RQ-FNDSA-001
  added: '2026-08-16'
  title: 'Replace sampled goodness-of-fit with exhaustive enumeration: at lattice dimensions 2, 4
    and 8 with small widths the Klein sampler''s output support is finite, so the total variation
    between a p-bit-mantissa implementation and exact rational arithmetic is computed rather than
    estimated, and mantissa width becomes a swept variable with zero sampling noise.'
  class: measurement
  claim: '(A) For a Klein/GPV nearest-plane sampler over a d-dimensional lattice with d in {2, 4,
    8} and a width small enough that the coset support truncated at 8 sigma holds at most a few million
    points, the exact output probability mass function is a computable vector of rationals: every
    output probability is a finite product of leaf terms, and each leaf term is a ratio of truncated
    theta sums that fractions.Fraction evaluates exactly once the tail is bounded. (B) Therefore the
    total variation distance and the Kullback-Leibler divergence between an implementation at mantissa
    precision p and the exact-arithmetic sampler are OBTAINED BY ENUMERATION, not by drawing samples,
    so the measurement carries no Monte Carlo error whatsoever and the usual sample-size question
    is replaced by a support-size question. (C) Sweeping p over 8, 12, 16, 20, 24, 32, 40 and 53 with
    a software float emulator yields TV(p) as an exact curve, and the object of interest is the SHAPE
    of that curve: whether it decays geometrically in p, whether it has a knee, and whether the decay
    constant depends on the dimension. (D) WHAT IS NOT CLAIMED: nothing here is a statement about
    FN-DSA-512 or FN-DSA-1024, about any deployed implementation, about any standardized precision
    requirement, or about key recovery. The enumerable regime is d at most 8 and sigma at most 3,
    three orders of magnitude below deployed dimension, and no extrapolation is asserted anywhere
    in this record. A separate entry in this batch treats the dimension-scaling law as its own measurement;
    this one establishes only that an exact-truth instrument exists and what it reads at toy scale.
    (E) A negative outcome, meaning TV(p) already sitting at the exact-arithmetic floor for every
    p tested, is itself a usable measured obstruction: it would say the enumerable regime cannot resolve
    precision effects at all and would bound how small a defect this instrument can ever see.'
  mechanism: 'STAGE ONE builds two reference samplers over one toy basis. The first is exact: leaf
    normalizers are truncated theta sums evaluated in fractions.Fraction with a proven tail bound,
    centers are exact rationals, and the output pmf over the truncated support is a vector of exact
    rationals summing to one minus a bounded tail. The second is precision-parametric: every real
    quantity inside the sampler, including the Gram-Schmidt norms, the centers, the normalizers and
    the comparison thresholds, is rounded to a p-bit mantissa after every operation by an emulator
    built on Python integers. STAGE TWO computes the second sampler''s exact pmf as well, by enumerating
    the same support and, for each support point, replaying the deterministic decision structure under
    the rounded arithmetic; because randomness enters only through the leaf draws, the implemented
    pmf is again a finite product, with rounded factors. STAGE THREE differences the two vectors coordinatewise
    and reports total variation as half the L1 norm and KL as an exact rational sum, both to full
    precision. STAGE FOUR sweeps p and d and records the curve. The claim is established if TV(p)
    is nonzero and decreasing in p with a stable decay constant per dimension; it is refuted if TV(p)
    is flat across p, meaning the defect is dominated by something other than mantissa width, or if
    the tail bound cannot be made small enough for the enumeration to be conclusive.'
  novelty_status: unverified
  novelty_screen:
    method: Read ledger/questions/RQ-FNDSA-001.yaml in full. Read ledger/hypotheses/H-FNDSA-6a9cbb.yaml.
      Listed every proposal via grep -l RQ-FNDSA-001 ledger/proposals/*.yaml and extracted all twelve
      titles. Ran grep -ril for ffSampling, floating-point, precision, CDT, base sampler, Renyi, Kullback,
      statistical distance, smoothing parameter, LDL and FFT across ledger/proposals/. Read knowledge/techniques/KN-TECH-022.md
      and KN-TECH-023.md and knowledge/open-problems/KN-OPEN-012.md. Listed harness/ to confirm no
      lattice or Gaussian-sampler module exists in this repository.
    results: Twelve proposals carry question_id RQ-FNDSA-001. The closest are IDEA-20260805-4a6dc7,
      which argues that goodness-of-fit on full signatures has almost no power and moves the test
      down to the one-dimensional leaf where a rational reference exists, and IDEA-20260813-aaf02e,
      which composes nodewise rounding into an end-to-end distance BUDGET by interval arithmetic.
      IDEA-20260801-010 is the generic sampled exactness probe. H-FNDSA-6a9cbb states explicitly that
      at deployed sigma the amplitude is about 2e-14 and that empirical estimation in double arithmetic
      would measure the arithmetic rather than the sampler, and it therefore runs its empirical arm
      at sigma between 0.45 and 0.70 BY SAMPLING. No record proposes enumerating the full multi-dimensional
      output support to obtain an exact pmf. The harness contains no lattice code at all.
    verdict: 'UNVERIFIED. This program cannot read external literature, so no claim is made about
      what exists outside this repository; exhaustive enumeration of a small discrete distribution
      is an obvious and old technique. What is claimed new HERE is the combination: applying it to
      the MULTI-DIMENSIONAL Klein output rather than the one-dimensional leaf that IDEA-20260805-4a6dc7
      already retreated to, and using it to make mantissa width the swept variable at exactly zero
      sampling noise. The rational-reference idea is assembled from IDEA-20260805-4a6dc7; the precision
      sweep is assembled from the goal''s own openings list; the multi-dimensional exact pmf is the
      part no record contains.'
  object_first_candidate:
    tracked_object: 'The exact rational probability mass function of the sampler, as a vector indexed
      by the enumerated coset points inside an 8 sigma ball. Not a sample, not a histogram, not a
      moment, not a timing: the distribution itself as a finite object with exact entries, followed
      as the arithmetic precision of the machine producing it is varied.'
    lossiness: The projection discards the ORDER of the leaf draws and every intermediate state of
      the recursion, keeping only the terminal point and its probability; two different internal decision
      paths landing on the same coset point are identified. That is genuinely lossy, since the map
      from randomness tape to output point is many-to-one and its fibers are not recoverable from
      the pmf. What survives propagates because the quantity the security argument concerns is exactly
      the terminal law, so every operation the analysis performs, comparison to the ideal, mixing
      over messages, aggregation over signatures, is a function of the pmf alone. Truncation at 8
      sigma is a second, controlled loss and is charged explicitly as a tail bound rather than ignored.
    propagation: One step of the target operation is one leaf of the recursion. Acting on the tracked
      object, a leaf multiplies each surviving pmf entry by a factor exp(-(z - c)^2 / (2 s^2)) divided
      by Z_s(c) and refines the index set by one integer coordinate. Under exact arithmetic those
      factors are exact rationals to the truncation; under p-bit arithmetic each is perturbed by a
      relative error bounded by a function of p and of the operation count in evaluating it. The pmf
      therefore evolves as a product measure under multiplicative per-step perturbation, which is
      why the composed defect is expected to be geometric in p and at most linear in the number of
      leaves.
    survival_score: 'The object survives as long as the support is enumerable. Concretely: at d =
      2 and sigma = 1.5 the truncated support has order 10^2 points; at d = 4 and sigma = 2 order
      10^4; at d = 8 and sigma = 2 order 10^7, which is the practical ceiling in pure Python within
      a one-hour budget. Beyond d = 12 the object dissolves into inaccessibility rather than into
      meaninglessness: it still exists and simply cannot be written down. That boundary, d around
      8 to 10 at sigma around 2, is the honest survival score and is reported as a number rather than
      a hope.'
  null_object_control: 'The null arm runs the IDENTICAL enumeration comparing the exact-arithmetic
    sampler against ITSELF under a different but mathematically equivalent evaluation order, for instance
    theta sums accumulated in ascending versus descending index order, both in exact rational arithmetic.
    The null must return TV exactly zero, bit for bit, for the signal arm to mean anything: any nonzero
    reading proves the enumeration pipeline, not the mantissa width, generates the difference. A second
    null runs the p-bit arm at p = 200 against the exact arm and must return TV below 2 to the power
    minus 150, establishing that the emulator converges to the exact reference as precision grows.'
  discriminated_from:
  - IDEA-20260805-4a6dc7 moves the exactness test to the one-dimensional leaf because ground truth
    exists there. This proposal accepts that argument and extends the ground-truth region to d dimensions
    by enumeration, which the leaf-only framing gives up on; the two differ in the dimension of the
    object, not in philosophy.
  - IDEA-20260813-aaf02e composes nodewise rounding into an end-to-end distance BOUND by interval
    arithmetic. A bound is an upper estimate; this computes the ACTUAL distance exactly at toy size,
    which is what is needed to say whether that bound is tight.
  - IDEA-20260801-010 is a sampled statistical test against the ideal. Sampling brings Monte Carlo
    error and a power calculation; enumeration has neither, and the difference is the whole methodological
    content here.
  - H-FNDSA-6a9cbb derives the exact-arithmetic defect in closed form and validates it by SAMPLING
    at small widths. This measures a different defect, the finite-precision one, and measures it without
    sampling.
  - IDEA-20260808-e7ba81 detects deviation through the sample covariance spectrum, a second-moment
    summary of many samples. The pmf is the full distribution and is compared with no summary statistic
    at all.
  assumptions:
  - The toy lattice bases are constructed by this experiment and are NOT claimed to be FN-DSA keys;
    they are NTRU-shaped only in coming from a circulant construction at tiny n, and no property of
    the deployed key distribution is imported.
  - The truncation tail outside 8 sigma is bounded above by an explicit Gaussian tail estimate evaluated
    in exact arithmetic, and that bound is reported next to every TV value so a reader can see whether
    truncation could have changed the verdict.
  - A software p-bit mantissa emulator over Python integers faithfully models round-to-nearest arithmetic
    at width p; this is itself checked against Python floats at p = 53 on a frozen operation list.
  - The sampler's control flow under rounded arithmetic depends on the arithmetic only through comparisons
    the emulator reproduces, so the implemented pmf is well defined as a function of p.
  - Enumeration in pure Python at 10^7 support points is feasible inside the compute budget; if it
    is not, the experiment reports the achieved ceiling rather than extrapolating.
  predictions:
  - metric: total variation between the p-bit and exact-arithmetic sampler at d = 4, sigma = 2
    direction: lower
    minimum_effect: TV falls by at least a factor of 2 per additional mantissa bit over p = 8 to 24,
      that is a fitted slope of log2 TV against p at or below -1.0
  - metric: TV in the null arm, exact versus exact under reordered summation
    direction: different
    minimum_effect: 0
  - metric: TV at p = 200 against exact
    direction: lower
    minimum_effect: below 2 to the power -150
  - metric: ratio of TV at d = 8 to TV at d = 4 at fixed p and sigma
    direction: higher
    minimum_effect: 'no pre-committed value. Refusal reason: the composition law across leaves is
      exactly what a separate entry in this batch is designed to measure, and pre-committing a value
      here would let this experiment appear to confirm a law it is not powered to test.'
  minimal_test:
    design: 'The cheapest discriminating measurement is d = 2, sigma = 1.5, support truncated at 8
      sigma, roughly 200 coset points. Build the exact pmf in fractions.Fraction; build the p-bit
      pmf for p in 8, 12, 16, 20 and 24; difference them. This is seconds of compute and it already
      separates the three outcomes that matter: TV strictly decreasing in p means precision is the
      carrier and the instrument works; TV flat and nonzero means something other than mantissa width
      dominates at this size, which redirects the whole line; TV exactly zero at every p means the
      toy configuration cannot expose rounding at all and the width or basis conditioning must change
      before any larger run is authorized. Run both null arms in the same invocation, also seconds.
      Only after the d = 2 reading is in hand does the d = 4 and d = 8 ladder earn its compute.'
    controls:
    - 'Null arm one: exact versus exact under reordered exact summation, must read TV identically
      zero.'
    - 'Null arm two: p = 200 versus exact, must read TV below 2 to the power minus 150, demonstrating
      emulator convergence.'
    - 'Positive control: a deliberately biased sampler with one leaf normalizer perturbed by a known
      relative amount delta, whose TV against exact must track delta linearly for small delta.'
    - 'Truncation control: recompute every TV at 6 sigma and 10 sigma truncation and confirm stability
      within the reported tail bound.'
    - 'Basis control: repeat at a second toy basis with a different Gram-Schmidt norm profile to confirm
      the reading is not an artifact of one conditioning number.'
    required_metrics:
    - exact total variation as a rational, reported to 20 significant digits
    - exact Kullback-Leibler divergence in bits
    - maximum pointwise log-density ratio over the enumerated support
    - enumerated support size and the exact truncated tail mass bound
    - fitted slope of log2 TV against mantissa width p, with residuals
    - wall-clock and peak memory per enumeration, recorded but never used as evidence
  falsification_conditions:
  - The null arm returns nonzero TV, which falsifies the instrument and voids every signal reading
    until the pipeline is fixed.
  - TV at p = 200 exceeds 2 to the power minus 150, meaning the emulator does not converge to the
    exact reference.
  - TV is flat in p across the full sweep, falsifying the claim that mantissa width carries the toy-scale
    defect.
  - The positive control's TV does not track the injected delta linearly, falsifying the calibration
    of the distance measurement.
  - The truncation tail bound is not small enough to separate the measured TV values, so the enumeration
    is inconclusive at this width and the claim of exact ground truth fails.
  - Support enumeration at d = 4 already exceeds the compute budget, falsifying the feasibility premise.
  confounders:
  - Truncation of the support masquerading as a precision effect; addressed by the 6, 8 and 10 sigma
    control.
  - The emulator's rounding rule differing from the rule the analysis assumes, so measured decay reflects
    the emulator rather than the sampler.
  - 'Basis conditioning: a badly conditioned toy basis inflates rounding error for reasons unrelated
    to sampler structure.'
  - Python arithmetic silently reordering evaluation, which would break exactness of the null arm.
  - Choosing sigma so small that the discrete Gaussian is nearly a point mass, so TV is dominated
    by one support point and the curve is uninformative.
  interpretation_limits:
  - Results hold for d at most 8, sigma at most 3, and the specific toy bases constructed in the run;
    they are statements about the Klein sampler family at those parameters and nothing else.
  - No statement about FN-DSA-512, FN-DSA-1024, any FIPS text, or any deployed implementation follows,
    because no such text has been read by this program and no such parameters are reachable by this
    instrument.
  - A measured TV is a distributional distance, not an attack cost; converting one into the other
    needs a distinguisher computable from public data, which this record does not supply.
  - Exactness of the ground truth is exactness relative to the truncated support, not to the infinite
    lattice.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: enumeration is linear in
      support size, which is order (8 sigma)^d, so time grows exponentially in the toy dimension and
      that exponential is why the method is confined to d at most 8.'
    memory_exponent: No attack memory exponent is claimed. Instrument memory is linear in support
      size, order (8 sigma)^d rational entries, about 10^7 entries at the ceiling configuration.
    best_known: The incumbent inside this repository is the sampled goodness-of-fit approach of IDEA-20260801-010
      and the leaf-level rational reference of IDEA-20260805-4a6dc7, together with the interval-arithmetic
      budget of IDEA-20260813-aaf02e. Outside the repository the incumbent is unknown to this program
      and no claim is made about it.
    hidden_overhead: 'Exact rational arithmetic on theta sums has denominators that grow with truncation
      depth, so a single pmf entry can carry thousands of digits and the constant in front of the
      linear enumeration cost is large and grows silently with sigma. The human cost is the emulator:
      a p-bit round-to-nearest emulator that is subtly wrong produces a beautiful curve that means
      nothing, and validating it is most of the implementation effort.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed on the instrument axes rather
    than an attack frontier, and every axis was checked: against the two in-repository alternatives,
    sampled testing is cheaper in memory and unbounded in dimension but carries Monte Carlo error
    and needs a power analysis; interval-arithmetic bounding is cheaper still and dimension-free but
    returns an upper bound rather than a value. This proposal is dominated on cost by both and dominates
    both on the single axis of exactness. No attack frontier row is claimed to be beaten because no
    attack is claimed.'
  sota_delta: 'No attack; measurement contribution only. The quantitative delta is on measurement
    error: sampled estimation of a TV of size t needs order t to the power minus 2 samples and returns
    an interval, whereas enumeration returns t with zero variance at a cost independent of t and exponential
    in d. At d = 4 and a TV of 1e-6 the sampled route needs order 10^12 signatures and the enumerated
    route needs order 10^4 support points.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separate parts, separate odds. That the exact pmf is computable at d
    = 2 and 4: about 0.9, this is arithmetic and the only risk is denominator blowup. That it is computable
    at d = 8 within budget in pure Python: about 0.45, the support-size estimate being the weak link.
    That TV(p) shows clean geometric decay: about 0.65, the alternative being a staircase dominated
    by individual comparison flips. That the instrument reads anything transferring to deployed dimension:
    deliberately low, about 0.15, which is why the transfer question is a separate entry rather than
    a promise made here.'
