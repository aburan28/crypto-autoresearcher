  assumptions:
    - >-
      p greater than 3 and E ordinary. Supersingular curves are out of scope by the
      RQ's own constraints and C1 fails for them (End is non-commutative and the
      crater picture does not apply).
    - >-
      "Leaving the locus" is defined as producing a codomain that is NOT
      F_p-isomorphic to a curve with |Aut| greater than 2, i.e. the codomain has
      |Aut_{F_p}| equal to 2. Deduplication of class vertices is by F_p-ISOMORPHISM,
      never by j-invariant alone; twists share j and must not be merged.
    - >-
      f is computed exactly from 4p - t^2 = |D_K| f^2 by exact integer arithmetic at
      the declared bit sizes; no factoring heuristic is used at 7-9 bits.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks only.

  proof_search_map:
    bottleneck: >-
      The exit criterion. Everything else in this lane presupposes an answer to
      "which degrees can leave", and the only filed answer (D2) attributes the
      exception to ramification. If the true criterion is divisibility of the
      conductor, then every downstream design that samples "an odd degree that
      leaves" from a class with f a power of 2 samples from the EMPTY SET, and
      would report a null for a reason that has nothing to do with the ECDLP.
    baseline_embedding:
      parameter_slice: >-
        Setting D_K outside {-3,-4} empties the locus and C1-C3 degenerate to the
        standing generic statement that no class member has extra automorphisms,
        which is EV-ECDLP-b3e847 obstruction 4 and the special_j_segregation control
        of EXP-ISOU-2ac81f. Setting f = 1 makes the class equal to the crater alone
        and C2 says no odd exit exists at any degree - the extreme slice.
      reproduction_check: >-
        Frozen regression fixture computed and committed BEFORE the special-j arm is
        read: on a class with D_K outside {-3,-4}, the measured |Aut| must be 2 at
        every vertex and the horizontal/descending counts must match
        1 + (D_K/ell) and ell - (D_K/ell). This is a symbolic prediction checked
        against an independent enumeration, not a visual comparison.
    observation_collision:
      observable: >-
        The pair consisting of the number of F_p-rational ell-isogenies from the
        vertex and the multiset of |Aut| over their codomains.
      distinct_preimage_search: >-
        Search for two vertices with the SAME observable at every ell in
        {3,5,7,11,13} but different exit behaviour - which would mean the observable
        does not identify the exit structure and a third quantity is at work.
        Deliberately hunted collision, one on each side of the conclusion: a
        (chi = +1, v = 0) cell (predicted 2 loops, no exit) and a (chi = +1, v = 1)
        cell at the same ell (predicted 2 loops PLUS ell - 1 exits). If these two
        produce the same observable the classification is not identifiable from the
        data being collected and the instrument must be changed before any reading.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace |Aut| (a single integer per vertex, blind to degree) by the local
          splitting datum (chi_ell, v_ell) per prime, which preserves strictly more
          state than the conclusion needs and is exactly the state that survives one
          isogeny step.
        predicted_gain: >-
          Converts the RQ's decision target from a survey ("which ell leave?") into a
          closed-form criterion ("ell leaves iff ell divides f") checkable in
          O(log p) integer operations with no isogeny computation at all.
      - transform: boundary_lift
        proposed_object: >-
          Lift the standing exception "the ramified prime above 3" to the full
          boundary "every odd prime not dividing f", of which ramified-3 with
          3 not dividing f is one member.
        predicted_gain: >-
          Strict inward improvement - the standing exception set is a subset of the
          predicted one, and the difference (split primes not dividing f) is
          nonempty at p = 67, so the lift is testable rather than merely more general.
    quantifier_order: >-
      FOR ALL primes p congruent to 1 mod 3, FOR ALL ordinary E/F_p with j(E) = 0,
      FOR ALL odd primes ell: (THERE EXISTS an F_p-rational ell-isogeny from E with
      codomain of |Aut| equal to 2) IF AND ONLY IF ell divides f. The order is
      load-bearing: ell is quantified universally AFTER the curve is fixed, so no
      witness may be chosen to suit a convenient degree, and the biconditional forbids
      the standing record's one-sided exception list.
    method_ceiling:
      strongest_certifiable_claim: >-
        A certificate-carrying, complete-class, exhaustive statement for the
        enumerated primes at 7-9 bits: for every j = 0 and j = 1728 class in range,
        the rational ell-isogeny counts and codomain |Aut| values agree with C2/C3
        with zero exceptions. It CANNOT certify the theorem for all p (that is a
        derivation, not a measurement), cannot certify anything about even degrees,
        and cannot be read as evidence about any ECDLP cost.
      nearby_object_control: >-
        The nearest object where the desired conclusion FAILS: a crater vertex with
        D_K in {-7, -8, -11, -19, -43, -67, -163} - class number one, so the crater
        is still a single vertex and every horizontal isogeny is still a self-loop,
        but |Aut| = 2 so there is no automorphism locus to leave. The method must
        report "self-loop, |Aut| = 2 on both sides" there. A method that cannot
        separate that object from j = 0 is measuring class number, not automorphisms,
        and the record's framing would be wrong even if its counts are right. Second
        nearby object: D_K = -15 or -23 (h = 2), where the crater has two vertices and
        a horizontal isogeny CAN move to a different vertex - the one place in the
        design where a horizontal isogeny is predicted NOT to be a self-loop.
    proof_obligations:
      - claim: Aut(E) of order greater than 2 forces End(E) equal to O_K
        responsibility: correctness
      - claim: h(-3) = h(-4) = 1 so the crater is a single F_p-isomorphism class
        responsibility: size
      - claim: >-
          Horizontal isogenies preserve the endomorphism ring, hence map the crater
          to itself
        responsibility: correctness
      - claim: >-
          Rational ell-isogeny count is 1 + (D_K/ell) if ell does not divide f and
          ell + 1 if it does
        responsibility: feasibility
      - claim: Every descending codomain has |Aut| equal to 2
        responsibility: strictness
      - claim: >-
          The 7-9 bit enumeration contains at least one (chi = +1, v = 0) cell, so the
          test is not vacuous
        responsibility: scope

