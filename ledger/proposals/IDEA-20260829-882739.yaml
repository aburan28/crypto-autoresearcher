        fraction of descending-isogeny codomains (ell dividing f) with |Aut| equal
        to 2
      direction: higher
      minimum_effect: 1.000 exactly, zero exceptions.
    - metric: >-
        at the h(D_K) = 2 control (D_K = -15 or -23), fraction of horizontal
        ell-isogeny codomains F_p-isomorphic to the domain
      direction: lower
      minimum_effect: >-
        Strictly below 1.000 - at least one horizontal isogeny must move to the other
        crater vertex. If this control also reads 1.000 the instrument cannot detect
        crater motion at all and every reading above is void.

  minimal_test:
    design: >-
      ONE ARM, entirely inside RQ-ECDLP-912694's declared scope. For every prime p in
      the interval from 64 to 512 with p congruent to 1 mod 3 (and separately p
      congruent to 1 mod 4), enumerate all curves y^2 = x^3 + b (resp.
      y^2 = x^3 + a x) up to F_p-isomorphism; for each, compute the point count by
      exact enumeration, derive t and solve 4p - t^2 = |D_K| f^2 for f by exact
      integer arithmetic; for each odd ell in {3,5,7,11,13} enumerate ALL order-ell
      subgroups of the ell-torsion that are Frobenius-stable, form the Velu quotient
      for each, and record (i) the number of rational ell-isogenies, (ii) whether each
      is horizontal, ascending or descending by directly computing the codomain's
      |Aut_{F_p}| and its j-invariant, and (iii) whether the codomain is
      F_p-isomorphic to the domain. Cross-tabulate against the predicted
      (chi_ell, v_ell) cell. Report the coverage table showing that every predicted
      cell is populated; an empty cell is a non-result for that cell and must be
      reported as such, never as a confirmation. The p = 67 f = 2 class and the
      p = 67 f = 7 class are named IN ADVANCE as the two decisive cells and their
      outcomes are pre-registered above.
    controls:
      - >-
        CLASS-NUMBER-TWO CONTROL, BLOCKING: a class with D_K in {-15, -23} where the
        crater has two vertices. At least one horizontal isogeny must land on a
        DIFFERENT vertex. This proves the instrument can see crater motion before any
        self-loop claim is read, and it is the positive control for the whole design.
      - >-
        NULL OBJECT: crater vertices with D_K in {-7, -8, -11, -19, -43, -67, -163} -
        class number one, single crater vertex, self-loops everywhere, but |Aut| = 2.
        Discriminates "self-loops come from h = 1" from "self-loops come from extra
        automorphisms". The prediction is that self-loops appear here TOO, which
        separates C2's mechanism (trivial class group) from the lane's default
        assumption (automorphisms).
      - >-
        GENERIC-D_K NULL: a class with |D_K| large and h(D_K) greater than 2, where
        horizontal isogenies must move between distinct vertices at a rate consistent
        with the crater size. This is the baseline_embedding reproduction fixture.
      - >-
        DEDUPLICATION CONTROL: F_p-isomorphism testing implemented independently of
        j-invariant equality (explicit search for u with u^4 a' = a and u^6 b' = b),
        with a logged count of j-equal but F_p-inequivalent pairs. Deduplicating by j
        alone is the primary way this measurement could manufacture a false
        self-loop rate of 1.000.
      - >-
        CERTIFICATE CONTROL: every kernel subgroup and every Velu codomain
        independently re-verified by code sharing no state with the producer -
        kernel points on the domain curve, codomain points on the codomain curve,
        codomain order equal to domain order (Tate). Verification fraction must be 1.0
        as the RQ constraint requires.
    required_metrics:
      - >-
        per (p, t, j, ell) row: rational ell-isogeny count, horizontal count,
        descending count, codomain j and |Aut_{F_p}| per isogeny, F_p-isomorphism
        verdict versus the domain
      - exact f and its full factorisation per class
      - >-
        Kronecker symbol (D_K/ell) per (class, ell), computed independently of the
        isogeny data
      - coverage table over the cells chi in {-1,0,+1} crossed with v in {0,1,2+}
      - >-
        complete class enumeration size per class, with the Kronecker class number
        cross-check
      - deduplication log of j-equal but F_p-inequivalent pairs
      - certificate verification fraction, required 1.0

  falsification_conditions:
    - >-
      Any F_p-rational odd-degree ell-isogeny from a j = 0 vertex with ell not
      dividing f whose codomain has |Aut| equal to 2. C2 is false and the standing D2
      is vindicated.
    - >-
      Any rational 5-isogeny or 11-isogeny from a j = 0 vertex with 5 (resp. 11) not
      dividing f. The count formula 1 + (D_K/ell) is false.
    - >-
      Any class with D_K in {-3,-4} containing two or more vertices with |Aut| greater
      than 2. C1 is false, and this also falsifies D1 of the standing record.
    - >-
      Any descending codomain with |Aut| greater than 2. C2's second half is false.
    - >-
      The h(D_K) = 2 positive control shows only self-loops. The instrument cannot
      detect crater motion and every reading in the record is void - reported as an
      instrument failure, never as support for C2.
    - >-
      The enumeration contains no (chi = +1, v = 0) cell at any ell in the declared
      set. The test is vacuous at the declared bit sizes and must be reported as
      inconclusive with a scope-extension request, not as a confirmation.

  confounders:
    - >-
      Twists share a j-invariant and have different traces. Deduplicating vertices by
      j alone merges distinct vertices and drags in curves from other classes -
      it would manufacture the self-loop result this record predicts, from the
      wrong cause. The dedup control exists for exactly this.
    - >-
      For j = 0 there are six sextic twists lying in six different F_p-isogeny
      classes (IDEA-20260808-45af43). Enumerating "all j = 0 curves over F_p" and
      treating them as one class is a category error that would corrupt every count.
    - >-
      Velu's formulas produce a codomain in a particular Weierstrass model; the model
      is not canonical, so "same j" and "F_p-isomorphic" must both be tested and
      reported separately. A codomain that is a nontrivial twist of the domain has
      the same j, the same |Aut|, but lies in a DIFFERENT isogeny class - which cannot
      happen for a genuine isogeny and is therefore a live implementation bug check.
    - >-
      At 7-9 bits the number of rational points is small enough that the ell-torsion
      may be entirely rational or entirely irrational for several ell in the declared
      set, biasing which cells are populated. Coverage is therefore a REPORTED metric,
      not an assumption.
    - >-
      The RQ excludes even degrees. In the p = 67, f = 2 class the ONLY exit is at
      ell = 2, so the RQ as scoped can only ever answer "no" there. This is a
      property of the scope, not of the curve, and it is reported as such.

  interpretation_limits:
    - >-
      Toy scale, claim tier toy. C1-C3 are a DERIVATION under
      docs/claims-and-verification.md; the enumeration verifies the derivation over
      the enumerated range and does not prove it.
    - >-
      This record makes NO ECDLP cost claim of any kind. It answers a structural
      question that precedes cost. No exponent moves, no constant moves, no attack.
    - >-
      A confirmation does not retire IDEA-20260812-c49409. That record's D1, D3 and
      D4 are unaffected and are cited here as standing; only D2 is contradicted, and
      the correction is supersession by a new record, never an edit.
    - >-
      Nothing here is evidence about P-256 or P-224 (D_K about -2^258, conductor 1,
      no special j). secp256k1 IS in the covered family (j = 0, D_K = -3) and the
      exit criterion applies to it verbatim, but the criterion says only which
      degrees admit exits - it says nothing about its ECDLP hardness, which is
      unchanged by Tate's theorem.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 3).

  heuristic_assumptions:
    - id: H-EXIT-1
      statement: >-
        COVERAGE, not distribution. The enumeration over primes from 64 to 512 with
        the declared congruence conditions populates every cell of the product of
        chi_ell in {-1, 0, +1} with v_ell in {0, 1, 2 or more}, for at least one ell
        in {3,5,7,11,13}, with at least three independent classes per populated cell.
        This is an assumption about the SAMPLE, not about the mathematics, and it is
        decided by counting rather than believed.
      rigorous_support: >-
        Rigorous ingredient - the set of triples (p, t, f) with 4p = t^2 + 3f^2 and
        p in a bounded interval is finite and completely enumerable by a sieve, so
        coverage is a computed fact and not an estimate. Distribution imitated - none;
        no distributional claim is made or needed by C1-C3.
      validation_plan: >-
        Compute and commit the coverage table BEFORE any isogeny computation. Sampled
        parameters recorded exactly: the prime interval, both congruence classes, the
        degree set. If a cell is empty, extend the prime interval upward in powers of
        two, recording each extension as a scope note; if a cell is still empty at
        16 bits, report that cell as untested. Transfer assumption stated explicitly:
        coverage at 7-9 bits transfers NOTHING to cryptographic p, and no such
        transfer is attempted - the derivation, not the sample, is what is claimed to
        be uniform in p.
    - id: H-EXIT-2
      statement: >-
        The derivation C1-C3 is uniform in p over the range p greater than 3 with the
        stated congruence conditions; that is, no step invokes a property of p beyond
        p greater than 3, ordinariness, and the congruence that makes j = 0 (resp.
        1728) ordinary. Hence a finite verification tests IMPLEMENTATION, and a single
        counterexample would falsify the derivation rather than merely bound its range.
      rigorous_support: >-
        Rigorous ingredient - Deuring's theorem and Kohel's level criterion are stated
        for all ordinary classes over all finite fields of characteristic not 2 or 3,
        with no small-p exception in the recalled statements. Distribution imitated -
        none. This is a uniformity assumption about a proof, not about a random object.
      validation_plan: >-
        Adversarial re-derivation by the Red Team looking specifically for a hidden
        small-p or small-ell exception (ell = 3 with D_K = -3 is ramified AND equal to
        the automorphism order, the single most likely site of a degenerate case).
        Empirically, the enumeration's outcome is stratified by p and by ell and any
        p-dependent or ell-dependent deviation is reported before the pooled result.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE AS AN ALGORITHMIC CLAIM, and this is stated plainly rather than
      dressed up. No algorithm for the ECDLP is proposed and no exponent moves. The
      one cost statement the record does make: deciding whether a special-j curve can
      leave its locus at odd degree ell costs O(log p) integer operations (compute f
      from 4p - t^2, test whether ell divides f) rather than the O(ell^2)
      modular-polynomial or O(ell) kernel enumeration a direct search would use - a
      reduction in the parameter ell only, and irrelevant to any exponent in p.
    memory_exponent: >-
      O(log p) bits for the criterion; the verification enumeration is O(p) time and
      O(1) memory per class at the declared bit sizes.
    best_known: >-
      For the ECDLP on these curves: Pollard rho at 0.886*sqrt(N) group operations
      with negation, and the automorphism-discounted variant on the special-j vertex
      itself (KN-TECH-018). This record does not compete with either. For the
      structural question, the best known is the direct computation of all rational
      ell-isogenies via kernel enumeration or modular polynomials.
    hidden_overhead: >-
      One disclosed item: extracting f from 4p - t^2 is free at 9 bits and requires
      factoring an integer of size about sqrt(p) at cryptographic scale, which is
      subexponential. The O(log p) criterion cost above assumes f is already known.
      Charging it as free at toy scale and extrapolating would be the single most
      misleading thing this record could do; it is not done.
    tradeoff_note: >-
      No time-memory tradeoff arises. Parallelisation is embarrassing over classes and
      irrelevant to the claim.

  dominated_by: >-
    Not applicable as an attack, because no attack is claimed. As a structural
    classification it is DOMINATED BY the classical literature it reassembles -
    Kohel's volcano criterion and the class number formula already imply C1-C3 for any
    reader who composes them, and this record's value is that this program's only
    filed proposal on the question composed them differently and got a different
    answer. Pareto frontier rows checked before writing null was refused: BSGS
    (sqrt(N) time, sqrt(N) memory); Pollard rho with negation and van Oorschot-Wiener
    parallelisation (0.886*sqrt(N), O(1) memory); the automorphism-discounted rho at
    the crater (KN-TECH-018); the multi-target frontier sqrt(L*N); the preprocessing
    frontier S*T^2 = Omega(eps*N). Every one of them dominates this record on every
    ECDLP cost axis because this record offers no ECDLP algorithm at all, so null is
    not available and is not written.
  sota_delta:
    time_exponent: "0 (no change)"
    memory_exponent: "0 (no change)"
    data_or_query_exponent: "0 (no queries, public data only)"
    note: >-
      Quantitatively: zero movement on every ECDLP cost axis. The delta is
      evidentiary, and it is exactly sized - it changes the predicted exceptional
      odd-degree set for a j = 0 crater from the singleton containing 3 to the
      infinite set of odd primes not dividing f, and it predicts that an entire
      declared arm of RQ-ECDLP-912694 (classes with f a power of 2) has NO odd-degree
      exit at all.

  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Exact enumeration over primes below 512 with degrees up to 13: seconds to minutes
    of CPU, single core, no specialised library beyond exact finite-field arithmetic
    and Velu. The h(D_K) = 2 positive control and the class-number-one null add
    negligible cost. This is the cheapest record in the batch and the only one that
    fits the RQ's declared bit sizes without any scope decision.
  recommended_priority: high
