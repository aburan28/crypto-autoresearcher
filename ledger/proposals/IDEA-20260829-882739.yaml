idea:
  id: IDEA-20260829-882739
  question_id: RQ-ECDLP-912694
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    THE EXIT BOUNDARY IS "ell DIVIDES f", NOT "ell = 3": because h(-3) = h(-4) = 1
    the crater is a single vertex, so EVERY horizontal rational odd-degree isogeny
    from a special-j curve is a SELF-LOOP back to j = 0, and the curve can leave its
    CM automorphism locus at odd degree ell if and only if ell divides the conductor
    f - which makes the standing lane record's exceptional-prime prediction (ell = 3
    alone) falsifiable by one enumeration at p = 67.

  object: >-
    TRACKED OBJECT. The LOCAL SPLITTING DATUM of a vertex at a prime ell: the pair
    (chi, v) where chi = (D_K / ell) is the Kronecker symbol of the fundamental
    discriminant at ell and v = v_ell(f) is the ell-adic valuation of the conductor
    of Z[pi]. Two small integers per (vertex, prime) are retained; the curve
    equation, the j-invariant, the group structure and every coordinate are
    discarded. Established families declared OFF-LIMITS as the primary lens for this
    record, per docs/inventor-protocol.md section 1: the automorphism-order function
    (IDEA-20260812-c49409, this lane's only prior record), the rho automorphism
    discount (KN-TECH-018), Semaev support/degeneration screens (the RQ-JINV-8fc13a
    family), the Cl(O)-torsor Fourier functional (IDEA-20260826-228fa6), and
    isogeny-transfer-to-a-weak-destination (EV-ECDLP-b3e847). Candidates enumerated
    and scored on (new / one-step propagation definable and measurable / survival
    depth): the j-invariant (repackaging / testable / dissolves immediately, it is a
    label); |Aut| (already the lane's lens, and it is a delta function that carries
    no degree information, so it cannot answer a question about DEGREES); the
    endomorphism order (known, Kohel, fully mapped, and too heavy - it needs
    End(E) computed); the LOCAL SPLITTING DATUM (chi, v) (new as a cost object in
    this corpus / testable, its one-step propagation is exactly Kohel's level rule /
    survives the whole volcano and is the exact decision variable of this RQ). Per
    KN-OPEN-019 this program has no written object-enumeration for the ECDLP, so the
    scoring above is a sketch and not a taxonomy.

  lossy_projection_test: >-
    The projection E' to (chi_ell, v_ell) keeps about log2(3) + log2(v+1) bits per
    prime out of a full Weierstrass equation over F_p, so it is violently lossy. What
    it discards is discarded COMPATIBLY with the operation the target performs: an
    ell-isogeny step changes v_ell by exactly +1, 0 or -1 by Kohel's criterion and
    changes no chi_ell' for any ell', so the retained part propagates
    deterministically under the exact operation the RQ asks about. It is not a change
    of coordinates - from (chi, v) at all primes one recovers the Kronecker class
    number of the class but NOT the curve, not the j-invariant, and not which vertex
    of a level one is standing on. The test passes.

  claim: >-
    Let E/F_p be ordinary with j(E) = 0 and p congruent to 1 mod 3 (respectively
    j(E) = 1728 and p congruent to 1 mod 4). Write 4p - t^2 = |D_K| f^2 with
    D_K = -3 (respectively -4). Four statements, C1-C4.

    (C1) FORCED MAXIMALITY. Aut(E) contains an element of order 3 (respectively 4),
    hence End(E) contains Z[zeta_3] = O_{-3} (respectively Z[i] = O_{-4}), which is
    already the MAXIMAL order. Therefore End(E) = O_K exactly, and E is a crater
    vertex of every ell-volcano in its class. Conversely a crater vertex of a class
    with D_K in {-3,-4} has End = O_K, hence contains the extra units, hence has
    j = 0 (respectively 1728). Crater and special-j coincide; there is no third case.

    (C2) EXIT CRITERION. For an odd prime ell, the number of F_p-rational
    ell-isogenies from E is 1 + (D_K/ell) when ell does not divide f, and ell + 1
    when ell divides f. In the first case ALL of them are horizontal, hence land on
    the crater, which by h(-3) = h(-4) = 1 is a SINGLE F_p-isomorphism class; hence
    every codomain is F_p-isomorphic to E and has the same j and the same |Aut|.
    In the second case exactly 1 + (D_K/ell) are horizontal self-loops and
    ell - (D_K/ell) are descending, and every descending codomain has End of
    conductor ell, hence |Aut| = 2.

    THEREFORE: E can leave its CM automorphism locus through a public rational
    odd-degree isogeny IF AND ONLY IF some odd prime divides f. The exceptional
    (non-leaving) odd degrees are the INFINITE set consisting of every odd ell that
    does not divide f, not the single degree ell = 3.

    (C3) THE EXPLICIT TABLE FOR THE RQ'S DECLARED DEGREES. For j = 0,
    (D_K/ell) = +1 exactly when ell is congruent to 1 mod 3, = -1 when ell is
    congruent to 2 mod 3, and = 0 when ell = 3. So at ell not dividing f the count of
    rational ell-isogenies is 2 for ell in {7, 13}, 0 for ell in {5, 11}, and 1 for
    ell = 3 - and every one of them returns to j = 0. For j = 1728,
    (D_K/ell) = +1 exactly when ell is congruent to 1 mod 4, so the count is 2 for
    ell in {5, 13}, 0 for ell in {3, 7, 11}.

    (C4) THE STANDING LANE RECORD IS WRONG ON THIS POINT AND THE COUNTEREXAMPLE IS
    SEVEN BITS. IDEA-20260812-c49409 statement D2 predicts that every F_p-rational
    odd-degree isogeny from the j = 0 vertex leaves the locus except the one whose
    kernel is the ramified ideal above 3. At p = 67 the three j = 0 isogeny classes
    have (t, f) equal to (16, 2), (11, 7) and (5, 9). In the f = 2 class NO odd prime
    divides f, so by C2 the j = 0 curve admits exactly one rational 3-isogeny and two
    rational 7-isogenies and two rational 13-isogenies, ALL of them self-loops, and
    it cannot leave the locus at ANY odd degree whatsoever. D2 predicts the two
    7-isogenies leave. One enumeration decides it.

  mechanism: >-
    Two facts collide, and the second is the one the standing record omits. First,
    extra automorphisms force the endomorphism ring to be maximal, so a special-j
    curve is pinned to the crater of every volcano in its class simultaneously.
    Second, the crater of a class is a torsor under Cl(O_K), and for the only two
    discriminants that carry extra automorphisms the class number is ONE, so the
    torsor is a point. A horizontal isogeny is by definition an isogeny between
    curves with the SAME endomorphism ring, so it maps the crater to itself, so it
    maps the single crater vertex to itself. Ramification at 3 is therefore not the
    mechanism producing the exception - it only controls HOW MANY horizontal
    isogenies exist (0, 1 or 2), never WHERE they land. The mechanism producing the
    exception is triviality of the class group, and it applies identically to split
    primes, which is where the standing record's prediction and this one diverge by a
    directly observable amount. The vertical direction is the only exit, and it exists
    only where the conductor supplies a level to descend into.

  novelty_status: unverified
  novelty_note: >-
    NOTHING IN C1-C3 IS CLAIMED AS NEW MATHEMATICS. Kohel's volcano structure, the
    horizontal/descending count 1 + (D_K/ell) at the surface, the Cl(O)-torsor
    structure of a level, and h(-3) = h(-4) = 1 are classical. This record's
    deliverable is (a) the assembly of those facts into an exact answer to
    RQ-ECDLP-912694's declared decision target, and (b) a concrete seven-bit
    falsifier of the only proposal currently filed against that question. Corpus
    checked: IDEA-20260812-c49409 (this lane, read in full - its D1, D3, D4 stand
    and are cited, its D2 is contradicted here); IDEA-20260807-94f953 (RQ-JINV,
    crater has h(D_0) vertices and the descending direction is the surviving object -
    consistent with, and prior to, C1, but does not state the exit criterion);
    IDEA-20260826-d61c49 (small |D_0| gives a SMALLER crater - the same fact read for
    a different purpose); IDEA-20260808-45af43 (sextic twists lie in six different
    classes - orthogonal). No corpus record states C2 or C3. External sources for the
    classical facts were NOT opened this session (see citations); the finite test
    is designed to verify them rather than trust them.

