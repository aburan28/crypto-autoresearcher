idea:
  id: IDEA-20260808-8e13ff
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FIND-001
  goal_id: GOAL-FIND-001
  title: 'A promotion gate for closures, with the two tests the current process lacks: a closure
    earns a KN-FIND only if its obstruction predicts a QUANTITATIVE form and dissolves on
    a named nearby object - and "replicated" for a derivation means independently RE-DERIVED
    from the premises by a session given the premises and NOT the conclusion, which is the
    only thing that distinguishes a replicated barrier from an unrefuted one'
  class: control
  claim: "(A) THE GAP. GOAL-FIND-001's completion criterion is that committed KN-FIND entries\
    \ or explicit not_warranted justifications cover the replicated ECDLP-relevant EV set\
    \ \"with claim boundaries no stronger than cited EV/DEC scope\". That criterion governs\
    \ SCOPE. It does not say what makes a closure DURABLE rather than a fatigue report, and\
    \ it does not say what \"replicated\" means for a closure that is a derivation rather\
    \ than an experiment - which most closures are. docs/inventor-protocol.md supplies the\
    \ first half (a closure needs a named obstruction, an argument, and forward guidance;\
    \ a count of screened-and-rejected mechanisms is a fatigue report whose honest status\
    \ is unverified) but not the second. (B) THE GATE, FIVE BINARY TESTS. A closure is admissible\
    \ as a KN-FIND iff:\n  T1 NAMED OBSTRUCTION. One sentence which, if false, reopens the\
    \ lane. The\n     fatigue-report tell is that the record's content is a COUNT of\n   \
    \  mechanisms tried; that count is not an obstruction and never becomes\n     one by being\
    \ longer.\n  T2 QUANTITATIVE FORM. The obstruction predicts a threshold, exponent, or\n\
    \     equality - not a direction. \"Blocked\" fails; \"blocked unless\n     T > (m!)^2\
    \ * N\", \"d_lf >= B\", \"extension degree ~ ord(pi mod M)\",\n     \"reachable iff N\
    \ | p - 1\" pass. This test is what stops a closure from\n     being a mood.\n  T3 NEARBY-OBJECT\
    \ DISSOLUTION. A named object on which the obstruction\n     fails, together with the\
    \ observation that the closure fails there too.\n     A closure that holds everywhere\
    \ has not been tested against anything.\n     This is the inventor protocol's null-control\
    \ requirement, transposed\n     from signals to closures.\n  T4 ESCAPE CLAUSE. The exact\
    \ quantity that would have to change for the\n     lane to reopen - which is what makes\
    \ the record useful to a future\n     generator rather than merely discouraging.\n  T5\
    \ MODEL AND RESOURCE SCOPE. The model the closure's force comes from, and\n     the resources\
    \ it does NOT cover. A generic-group simulability result\n     closes ORACLES; it says\
    \ nothing about resources that are not group-\n     oracle outputs (field data, lifts,\
    \ pairings - R1, R6, R7 in\n     DECOMPOSITION.md's taxonomy), and a record that does\
    \ not say so will be\n     over-cited. This test also catches the opposite error, a closure\
    \ quoted\n     more narrowly than its evidence supports.\n(C) REPLICATION, DEFINED FOR\
    \ A DERIVATION. An experiment is replicated by re-running it. A derivation is replicated\
    \ by RE-DERIVING it: a session that did not originate the closure is given the PREMISES\
    \ and the CLAIM SHAPE but NOT the conclusion, and asked to derive the obstruction independently,\
    \ plus a bounded counterexample search at the stated boundary. The failure mode being\
    \ excluded is \"unrefuted\": nobody looked, and silence was recorded as agreement. The\
    \ distinction is operational and cheap, and no current record in this repository draws\
    \ it. (D) WHAT THE GATE PREDICTS ABOUT THE EXISTING CORPUS. Applied to the 57 committed\
    \ KN-FIND entries and to this round's ~19 new closures, the record predicts: near-universal\
    \ passage of T1 (this corpus is careful about naming obstructions), high passage of T2\
    \ among the new closures (they were generated under the inventor protocol, and several\
    \ already carry explicit thresholds), and LOW passage of T3 - because a nearby-object\
    \ control is the least common component in the corpus and is not required by any current\
    \ template. If that pattern holds, the actionable output is a single template change:\
    \ add a nearby-object field to the KN-FIND template, which costs one line and is the cheapest\
    \ available improvement to closure quality. (E) PAUSE FLAG. GOAL-FIND-001 is paused. This\
    \ proposes a gate to apply when the pause clears; it changes no record's status and creates\
    \ no permission to promote anything. Only the Coordinator promotes."
  mechanism: A closure is a claim that further search in a region is not worth funding. That
    claim is falsifiable in exactly two ways - by exhibiting a mechanism the obstruction does
    not cover, and by exhibiting an object where the obstruction fails but the conclusion
    still holds - and a promotion process that does not force both checks converts a plausible
    argument into durable ground truth without anyone having tried to break it. T2 and T3
    are the two checks; T5 bounds how far the resulting record may travel; the replication
    definition in (C) ensures somebody actually tried.
  why_not_a_renamed_known_approach: 'Nearest known: docs/inventor-protocol.md section 4''s
    closure standard (obstruction + argument + forward guidance), which this gate contains
    as T1 and T4 and does not replace. The additions are T2 (quantitative form), T3 (nearby-object
    dissolution), T5 (model/resource scope), and the operational definition of replication
    for a derivation. Nearest corpus practice: the promotion of KN-FIND-001..027 under DEC-20260725-024,
    which applied a scope criterion; that process would admit a closure with a correct obstruction,
    no threshold, and no control object, and the gate''s purpose is to say so explicitly rather
    than to fault it retrospectively.'
  predictions:
  - observable: pass rates across the five tests
    metric: for each of the 57 committed KN-FIND entries and each of the round's ~19 closures,
      a binary score on T1-T5, reported per test
    predicted: 'T1 pass rate above 0.9; T2 pass rate materially higher for the new closures
      than for the committed ones; T3 pass rate the LOWEST of the five and below 0.5 overall.
      Direction matters more than the numbers: T3 must come out lowest, and if it does not,
      the gate''s premise is wrong'
  - observable: separation between known-strong and known-weak records
    metric: the gate's scores on a pre-selected set of three records the corpus already treats
      as strong and three it already treats as weak or superseded
    predicted: strict separation - every strong record outscores every weak one. Failure to
      separate means the gate is not measuring closure quality and its corpus-wide counts
      are void
  - observable: replication status
    metric: how many committed KN-FIND entries have been independently RE-DERIVED under (C)'s
      definition, as opposed to reviewed or unchallenged
    predicted: a small number, possibly zero, because no current process asks for it; this
      is the measurement that converts "replicated barriers" in the goal's title from an assumption
      into a count
  minimal_test: 'Score the 57 committed KN-FIND entries plus this round''s closures on T1-T5
    by reading each record; report the five pass rates, the strong/weak separation check,
    and the re-derivation count. Then, as a single worked demonstration of (C), take ONE closure
    and run the blind re-derivation: give a non-originating session the premises and the claim
    shape without the conclusion and record whether it reaches the same obstruction. One working
    session for the scoring, one short session for the demonstration.'
  controls:
  - 'POSITIVE AND NEGATIVE CONTROL RECORDS, chosen and frozen BEFORE scoring: three records
    the corpus treats as strong, three it treats as weak or superseded. The gate must separate
    them. This is the two-directional instrument check the campaign requires of every instrument.'
  - 'BLIND SCORING: the scorer should not know which records are in the control set. Where
    that is impractical, the control set must at least be frozen in advance and the scoring
    order randomised.'
  - 'For (C)''s demonstration: the re-deriving session must be given the premises and NOT
    the conclusion, and its output must be recorded whether or not it agrees - a disagreement
    is the informative outcome and must not be discarded.'
  confounders:
  - Older records were written under earlier templates that did not ask for T2 or T3; scoring
    them low measures the template, not the mathematics, and the report must say so. The gate
    is prospective; retro-scoring is diagnostic only and must never be used to demote a committed
    record.
  - T3 is genuinely inapplicable to some closures (an impossibility that holds for all objects
    in a category has no nearby object where it fails). Those must be recorded as "T3 not
    applicable, with reason" rather than as failures - the same discipline the proof_search_map
    already requires for inapplicable audits.
  - The author of this record is an idea generator in the same round whose closures would
    be scored; the scoring must be done by a different session.
  falsification_conditions:
  - 'All 57 committed entries passing all five tests: the gate is not discriminating and should
    be discarded rather than adopted. This is a real possible outcome and it would be good
    news.'
  - 'Failure to separate the frozen strong and weak control records: the gate measures something
    other than closure quality and every count it produced is void.'
  - 'The blind re-derivation reaching a DIFFERENT obstruction for a closure the corpus treats
    as settled: the closure needs a superseding record, and (C) has justified itself in one
    instance.'
  interpretation_limits: This is process, not mathematics. Passing the gate makes no closure
    true; failing it makes none false. It cannot raise any record's evidence tier - a derivation
    that passes all five tests is still a derivation under docs/claims-and-verification.md.
    Retro-scoring is diagnostic and may not demote a committed record; only a superseding
    record can do that, and only the Coordinator may create one.
  assumptions:
  - docs/inventor-protocol.md's closure standard and the "controls before belief" rule, as
    quoted in AGENTS.md [corpus].
  - GOAL-FIND-001's completion criterion as written in ledger/goals/GOAL-FIND-001.yaml [corpus,
    read this session].
  - The R1-R8 resource taxonomy of DECOMPOSITION.md section 2, used by T5 [corpus].
  - KN-FIND-002 / -b7e091 / -982fdf are statements about oracle simulability in the generic
    group model, which is what makes T5 non-vacuous [corpus, from their titles and from KN-FIND-b7e091's
    use in DECOMPOSITION.md].
  heuristic_assumptions:
  - id: HA-1
    statement: Closure quality, as judged by later usefulness to generators, is monotone in
      the number of gate tests passed. This is a methodological assumption and is the gate's
      main commitment; it is not a mathematical claim and cannot be proved.
    rigorous_ingredient: 'T3 alone is a genuine falsifier independent of the assumption: a
      closure that holds on an object where its stated obstruction fails is mis-explained,
      whatever anyone judges about quality.'
    distribution_imitated: Standard measurement-validation practice (an instrument must separate
      known-positive from known-negative cases before its readings mean anything), imported
      deliberately and named as imported.
    validation_route: The frozen strong/weak control set is the validation. If the gate fails
      to separate them, HA-1 is unsupported and the gate is not adopted.
    tail_checks: Report the individual records where the gate's score most disagrees with
      the corpus's existing treatment, by name, rather than only the separation statistic
      - the disagreements are where the gate is either wrong or informative, and both need
      to be visible.
  target_complexity:
    time_exponent: No algorithm, no exponent. Explicitly exponent-irrelevant process work,
      filed as such. Its justification under the exponent-first bias is that a closure admitted
      on weak grounds redirects future exponent-seeking effort away from a live lane, which
      is the one way process work can cost an exponent.
    memory_exponent: not applicable
    best_known_baseline: The current promotion process (scope-boundary check plus independent
      review), which admits a closure with a correct obstruction, no threshold, and no control
      object.
    hidden_overhead_disclosure: Scoring is judgement-laden; T3's not-applicable branch is
      the obvious place for scores to be inflated, which is why it requires a stated reason
      rather than a checkbox.
    time_memory_tradeoff: not applicable
  sota_delta: 'Zero mathematically. Operationally: adds two falsification-bearing tests and
    an operational definition of replication for derivations, and predicts a one-line template
    change (a nearby-object field) as the cheapest available improvement to closure quality.'
  dominated_by: n/a (no result claimed). No ECDLP frontier row is involved. Within the process
    column the closest artifact is docs/inventor-protocol.md section 4, which this gate extends
    rather than replaces and which does not dominate it because it contains neither T2, T3,
    T5 nor a replication definition for derivations.
  estimated_cost: 'Implementation: low (reading and scoring; one short blind re-derivation).
    Compute: none. Requires a non-originating session.'
  recommended_priority: high
  honest_prior_of_survival: 0.75 that T3 comes out as the lowest pass rate, which is the record's
    central prediction. 0.7 that the gate separates the frozen strong and weak control records.
    0.5 that it is adopted as a template change, which is the only outcome with lasting effect.
    Filed high because it is cheap, because it is the goal's actual subject matter, and because
    the round just produced ~19 new closures that will be promoted under whatever criterion
    exists at the time.
  novelty_status: unverified
  novelty_screen: Screened against GOAL-FIND-001.yaml (completion criterion and batch checkpoints
    BATCH-001/002, DEC-20260725-021, DEC-20260725-024), KNOWLEDGE_BARRIERS.txt (57 KN-FIND,
    28 KN-OPEN), EXISTING_PROPOSALS.txt rows for RQ-FIND-001, AGENTS.md's inventor-protocol
    section, and DECOMPOSITION.md section 2 for the T5 taxonomy. No corpus record defines
    replication for a derivation or requires a nearby-object control on a closure. WEB SEARCH
    UNAVAILABLE and not required.
  discriminated_from: docs/inventor-protocol.md section 4 supplies T1 and T4; this gate adds
    T2, T3, T5 and the replication definition. DEC-20260725-024's promotion process applies
    a scope criterion, which this gate contains as part of T5 and extends with the model/resource
    statement. Slice record E3-11 asks whether the round's closures share a root cause - a
    question about their CONTENT; this record asks whether each individually deserves promotion
    - a question about their EVIDENCE, and the two are run independently and can disagree.
    Slice record E3-10 concerns whether a promoted barrier is readable where it is consumed,
    which is downstream of promotion entirely.
  source_refs:
  - '[corpus] ledger/goals/GOAL-FIND-001.yaml; DEC-20260725-021; DEC-20260725-024; EV-FIND-002;
    EV-FIND-003; AGENTS.md inventor-protocol section; KN-TECH-056; docs/claims-and-verification.md
    as cited in AGENTS.md; DECOMPOSITION.md section 2 (R1-R8) and lane L12; KN-FIND-002; KN-FIND-b7e091;
    KN-FIND-982fdf; KN-OPEN-001.'
