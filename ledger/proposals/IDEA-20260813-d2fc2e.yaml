idea:
  id: IDEA-20260813-d2fc2e
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MQOM-001
  goal_id: GOAL-MQOM-001
  title: >-
    Non-Koszul low-degree syzygy certificates for the actual MQOM public map,
    with a solving-backend gate and a matched random module baseline
  class: algorithm
  claim: >-
    Once the actual public MQOM map is filed and a fresh algebra backend is
    calibrated, the degree-one and degree-two syzygy spaces of its coordinate
    quadratics can be computed as exact linear systems, quotiented by universal
    Koszul and field-equation relations, and compared with parameter-matched
    random MQ.  Any excess must be carried by an explicit polynomial tuple
    (g_i) satisfying sum_i g_i f_i=0 under independent exact multiplication.
    Such a certificate could expose equation dependencies or a lower-degree
    elimination route without running a full solving-degree experiment.  The
    current DREG evidence is incomplete and unrelated in object, so no syzygy
    computation, rank claim or solving consequence is authorized here.
  mechanism: >-
    For public quadratics f_1,...,f_m, a degree-d syzygy is a tuple of
    polynomials g_i of degree at most d with sum g_i f_i=0.  Coefficient
    matching turns the search into exact finite-field linear algebra.  Generic
    systems possess predictable universal relations, especially Koszul
    syzygies; these are generated explicitly and quotiented before measuring
    excess dimension.  A non-Koszul certificate can eliminate one equation,
    reveal a hidden common factor, or constrain the Hilbert function earlier
    than a semiregular random model.  Those consequences are separate proof
    obligations; excess dimension alone is not solving-degree evidence.
  why_not_a_renamed_known_approach: >-
    IDEA-20260805-7d97be is nearest because it compares Macaulay rank/solving
    degree with matched random MQ.  This proposal fixes only degrees one and
    two, quotients universal syzygies, and requires replayable polynomial
    identity certificates; it neither estimates a solving degree nor interprets
    wall-clock rank.  EV-DREG-004 concerns an incomplete Boolean chained-Semaev
    n=21 object, not dense random MQ, and transfers no number.  The remaining
    proof, memory, Weil-descent, forger and challenge priors track different objects.
  predictions:
    - observable: exact random-null syzygy quotient
      metric: non_koszul_dimension
      predicted: exact enumerated toy baseline with simultaneous interval at larger frozen samples
    - observable: planted degree-one identity
      metric: certificate_recovery_and_residual
      predicted: one declared non-Koszul basis direction recovered with exactly zero polynomial residual
    - observable: public-map quotient dimension
      metric: excess_over_matched_random
      predicted: reported as an effect and certificate list, with no assumed sign before execution
    - observable: elimination consequence
      metric: certified_reduction_in_independent_equations_or_monomials
      predicted: zero unless a separate symbolic transform verifies the reduction
  minimal_test:
    design: >-
      First run a fresh backend check on the exact finite field and matrix sizes;
      record versions, deterministic rank fixtures and memory.  If unavailable,
      stop as infrastructure and create no result.  At enumerable toy sizes,
      construct universal syzygies and exact matched-random quotient dimensions.
      Validate a planted non-Koszul identity.  Only then build degree-one and
      degree-two coefficient matrices for the actual filed public map and null
      ensemble.  Every excess vector is exported as a polynomial identity and
      verified by an independent minimal checker.  Full Macaulay solving-degree
      ladders remain outside this proposal.
    test_boundary:
      instances: exact public map and parameter-matched random MQ after primary filing
      parameters: syzygy coefficient degree at most two; no extrapolation to solving degree
      oracle_model: public polynomial coefficients only
      preprocessing: universal-relation generation and quotient basis are charged
      backend_gate: >-
        Mandatory fresh calibration.  EV-DREG-004 is in_progress_rebuilt,
        incomplete at 24.93 percent of columns, affected by two filesystem
        incidents and has unresolved collective labels.  H-MQOM-a45638 records
        absent Sage/sympy in its checked container.  Neither authorizes a run.
      stopping_rule: stop on unavailable backend, failed planted certificate or checker disagreement
    required_metrics:
      - raw kernel, universal-relation and quotient dimensions
      - exact rank certificates and deterministic backend fixtures
      - polynomial identity files for every non-Koszul basis vector
      - independent residual verification
      - matrix dimensions, sparsity, time, memory and preprocessing
  controls:
    - name: matched random MQ syzygy module
      kind: exact_null
      construction: random quadratic systems with identical field, variables, equations and public conditioning
      forced_value: exact toy quotient dimension after the same Koszul and field-relation quotient
      gate: actual-map excess is uninterpretable until the null quotient is reproduced
    - name: planted non-Koszul degree-one relation
      kind: biased_positive
      construction: >-
        Include f_1=x_2 h and f_2=-x_1 h for a random linear h, so
        x_1 f_1+x_2 f_2=0, embedded by random public invertible transformations.
      forced_value: one explicit degree-one non-Koszul identity with zero residual
      gate: certificate must be recovered after public transformations before actual-map analysis
    - name: universal-Koszul subtraction control
      kind: structural_control
      construction: generic random system with only universal f_j e_i-f_i e_j relations
      forced_value: those relations vanish from the reported quotient
      gate: any retained universal relation invalidates the quotient dimension
  confounders:
    - Universal Koszul and field-equation syzygies can masquerade as structure.
    - Rank backend defects can create false kernel vectors; independent identity checking is mandatory.
    - Low-degree relations may not reduce end-to-end solving cost.
    - Public affine transformations change coefficient sparsity but not module existence; controls must include them.
    - DREG's Boolean Semaev results and incomplete state are nontransferable.
  falsification_conditions:
    - Fresh backend calibration fails or deterministic rank fixtures disagree.
    - Planted non-Koszul identity is not recovered and independently verified.
    - Reported excess vectors fail exact polynomial multiplication checks.
    - Excess disappears after quotienting universal relations correctly.
    - No symbolic elimination or Hilbert consequence follows from the certificate; any solver-improvement interpretation is then falsified while the identity may remain valid.
  interpretation_limits:
    - No backend check or syzygy search was run in this task.
    - A syzygy certificate is algebraic structure, not a solve or security estimate.
    - Negative evidence covers only degrees one and two and the exact tested map/null ensemble.
    - No result from EV-DREG-004 transfers to dense MQOM.
  assumptions:
    - The public MQ polynomials and field equations are exactly reconstructible from primary sources.
    - Universal relation modules can be generated and quotiented without omission.
    - An independent checker can verify identities without trusting the search backend.
  heuristic_assumptions:
    - id: HEUR-D2FC2E-1
      formal_statement: >-
        Any actual-map non-Koszul syzygy of degree at most two that exceeds the
        matched random quotient dimension yields at least one exact reduction
        in independent equations or degree-three/four monomials.
      rigorous_support: a syzygy is an exact dependency, but it need not improve a chosen elimination order
      validation_plan: on planted and held-out toy systems derive the strongest symbolic elimination consequence and compare exact monomial counts
      falsification_condition: verified excess syzygies yield no reduction under any preregistered symbolic transform
    - id: HEUR-D2FC2E-2
      formal_statement: >-
        Matched-random quotient dimension at exact dimensions is concentrated
        sufficiently that a frozen null sample estimates an excess of one basis
        vector with family-wise error at most 0.01.
      rigorous_support: finite-dimensional rank concentration is plausible but field-size and aspect-ratio atoms may create tails
      validation_plan: exact enumeration at toy dimensions and seeded null replication with simultaneous upper quantiles
      falsification_condition: null quotient has an unresolved atom/tail at the candidate excess threshold
  proof_search_map:
    bottleneck: whether the actual public equations have low-degree dependencies beyond universal random-system relations
    baseline_embedding:
      parameter_slice: matched random MQ with identical field, dimensions, affine terms and universal-relation quotient
      reproduction_check: exact toy Hilbert/syzygy dimensions and planted identity fixture
    observation_collision:
      observable: raw Macaulay kernel dimension
      distinct_preimage_search: >-
        Construct systems with identical raw kernel dimension but differing only
        by universal versus non-Koszul relations; quotient and certificates must separate them.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: quotient syzygy module with independently verified basis
        predicted_gain: removes universal-kernel collisions
      - transform: representation_reduction
        proposed_object: symbolic equation or monomial elimination induced by a certificate
        predicted_gain: converts identity into a separately checked computational consequence
    quantifier_order: >-
      For every reported excess basis vector, the quotient basis and checker are
      fixed first; there exists an elimination gain only if a declared symbolic
      transform verifies it without selecting a favorable monomial order post hoc.
    method_ceiling:
      strongest_certifiable_claim: exact non-Koszul syzygy presence or absence through degree two
      nearby_object_control: random system with equal raw kernel dimension consisting only of universal relations
    proof_obligations:
      - claim: backend exact rank arithmetic is calibrated
        responsibility: baseline
      - claim: universal module is complete and correctly quotiented
        responsibility: correctness
      - claim: every excess vector verifies as a polynomial identity
        responsibility: interface
      - claim: degree and parameter boundary is explicit
        responsibility: scope
      - claim: any elimination gain is separately proved and costed
        responsibility: runtime
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No attack exponent.  Degree-d certificate search is exact sparse linear
      algebra on the declared coefficient matrix; exponential solving-degree
      extrapolation is prohibited.
    memory_exponent: sparse matrix, quotient basis and certificate storage, all reported
    best_known_baseline: IDEA-20260805-7d97be matched-random Macaulay/solving control
    hidden_overhead_disclosure: backend calibration, universal module generation, quotienting, field relations and independent checking
    time_memory_tradeoff: sparse iterative rank with certificates versus dense exact elimination; only calibrated choices admissible
    data_queries: zero; public coefficients only
    preprocessing: coefficient matrices and quotient bases fully charged
    oracle_model: none
    retry_success_accounting: no retries; complete exact degree-bounded search or bounded incomplete infrastructure outcome
  sota_delta: >-
    Quantitative target is quotient-dimension excess and certified eliminated
    equation/monomial count.  Attack and security-bit delta remain zero until a
    complete matched solver demonstrates an end-to-end gain.
  dominated_by: >-
    n/a (no attack result claimed).  All eight current priors checked.  7d97be
    dominates generic solving-degree comparison once a backend is available;
    this proposal is intentionally narrower and certificate-first.  No prior
    dominates verified non-Koszul degree-one/two identities.  External status unverified.
  estimated_cost:
    implementation: medium
    compute: medium
    data: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.90 that controls work after backend calibration; 0.30 that the actual map
    has an excess low-degree non-Koszul relation; below 0.15 that such a relation
    yields a competitive end-to-end solver improvement.
  novelty_status: unverified
  novelty_screen: >-
    Internal screening found generic Macaulay-rank and DREG-adjacent records but
    no degree-bounded non-Koszul certificate/quotient proposal for the actual
    public map.  The stale index and absent primary literature do not establish novelty.
  discriminated_from: >-
    Exact nearest neighbor IDEA-20260805-7d97be measures solving behaviour.
    This proposal searches only degree-one/two non-Koszul identities, requires
    exact replay certificates, and forbids solving-degree interpretation without
    a separate backend-gated experiment.
