  assumptions:
    - >-
      Executor has a shell, Python 3 with arbitrary-precision integers, and
      network egress for Step 1. The 14-core, 48 GB envelope is far more than
      this proposal needs; retrieval, not compute, is the binding constraint.
    - >-
      No SEA backend. #E is obtained by the Hasse-uniqueness argument, which
      requires l prime, [l]G equal to the identity, G not the identity, and l
      greater than 4 sqrt(p). A row failing any premise is UNRESOLVED, not
      estimated.
    - >-
      IDEA-20260829-d052e6 has passed its exhaustive toy census. Route A is
      otherwise not trustworthy and I2 collapses to a single route, which is not
      a cross-check.
    - >-
      Every parameter enters from a retrieved primary source with recorded
      provenance. A parameter recalled from memory would silently create the
      exact defect this lattice exists to detect, and would do so invisibly
      because a memory-recalled value is likely to be self-consistent.

  proof_search_map:
    bottleneck: >-
      That every numeric relation in the campaign is currently a transcription
      plus a pending check, in the goal's own next_action wording. The
      bottleneck is not any computation, since all the arithmetic here is
      microseconds; it is the absence of any mechanism that would DETECT a
      transcription error, and in particular the absence of redundancy between
      independently transcribed quantities.
    baseline_embedding:
      parameter_slice: >-
        Restricted to a single row and to instrument I1 alone, this reduces
        exactly to the archived plan's lane L9-TWIST arithmetic, namely
        #E^t = 2p + 2 - #E, plus lane L4's cofactor. The lattice must reproduce
        L9's per-row numbers bit for bit on the Curve25519 row, or it has not
        embedded the baseline.
      reproduction_check: >-
        A frozen fixture asserting that the lattice's Curve25519 row equals the
        L4 and L9 outputs exactly, run before any other row is processed.
    observation_collision:
      observable: >-
        The residue vector together with the valuation agreement matrix. The
        conclusion that the family is internally consistent rests entirely on
        this observable, so its identifiability must be attacked first.
      distinct_preimage_search: >-
        REQUIRED, AND IT HAS A KNOWN ANSWER THAT MUST BE STATED RATHER THAN
        DISCOVERED. Collisions PROVABLY EXIST - any compensating pair of errors,
        for instance l increased by delta and p_2 decreased by h times delta
        divided by h', leaves r_i at zero. So an all-zero residue vector does
        NOT certify correctness; it certifies the absence of any error outside
        the compensating subvariety, which has codimension one in the
        five-dimensional error space. The separating condition that must be
        added is that each of the five quantities is ALSO bound by at least one
        identity not involving the others - l prime, [l]G equal to the identity
        on the stated curve, h times l inside the Hasse interval, and the two
        valuations from route A. The record must state that the lattice's force
        comes from the CONJUNCTION and never from r_i alone. This is the same
        structural point as the archived plan's null control Z3 and it is
        inherited deliberately.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Preserve, per row, the whole residue tuple and both valuation routes
          rather than the single bit that the row checked out. The stronger
          state is what survives across rows and is what localises a defect to a
          field; the bit does not.
        predicted_gain: >-
          A defect is localised to a specific row and field instead of being
          reported as some disagreement somewhere, which is the difference
          between an actionable finding and a fatigue report.
      - transform: specialization_pack
        proposed_object: >-
          Sum the per-row evidence only over rows PROVED disjoint in their
          sources, since two rows sharing one specification document are not
          independent evidence about that document's fidelity.
        predicted_gain: >-
          An honest count of independent checks, predicted well below twenty
          because RFC 7748 covers two rows, SEC 2 covers several, and the
          Aranha-Barreto-Pereira-Ricardini paper covers four, preventing a
          twenty-fold consistency claim that is really a seven- or eight-fold
          one.
    quantifier_order: >-
      Claimed PER ROW, EXISTENTIALLY IN THE CERTIFICATE. FOR THIS curve, THERE
      EXISTS a tuple of prime, cofactor, subgroup order, twist cofactor and
      twist subgroup order with recorded provenance such that the I1 identity
      holds AND l is certified prime at a stated tier AND [l]G equals the
      identity AND l is greater than 4 sqrt(p) AND both valuation routes agree.
      NOT CLAIMED - FOR ALL curves in the SafeCurves family, which would require
      the row list to be complete and every specification obtainable, neither of
      which is established. The row list is enumerated and its incompleteness is
      stated.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The transcribed parameter tuples of the R rows that were resolved are
        mutually consistent under identities I1 to I3, and no single-field
        perturbation of any resolved row is consistent with them." It certifies
        nothing about rows that were not resolved, nothing about fields the
        identities do not bind, nothing about compensating error pairs, and
        nothing whatsoever about any curve's security.
      nearby_object_control: >-
        THE MUTATION CONTROL, WHICH IS BLOCKING. Construct a corrupted copy of
        the family by changing one digit of one field in one row. The lattice
        MUST flag exactly that row and MUST name the identity that failed. Run
        this for at least five mutations per resolved row, on the order of 100
        mutations, and report the detection rate. PREDICTED 100 out of 100. A
        lattice that passes the true family and also passes a corrupted one has
        no resolving power and every consistency statement it makes is void.
        SECOND NEARBY OBJECT - the ANOMALOUS row, whose correct processing
        requires h = 1 and l = p, a configuration in which l greater than
        4 sqrt(p) holds trivially but the curve is deliberately broken,
        demonstrating that lattice consistency is orthogonal to security.
    proof_obligations:
      - claim: '#E + #E^t = 2p + 2 for a quadratic twist over F_p.'
        responsibility: correctness
      - claim: >-
          The Hasse interval of width 4 sqrt(p) contains at most one multiple of
          l when l is greater than 4 sqrt(p), so #E is determined by p, l and
          the fact that [l]G is the identity.
        responsibility: correctness
      - claim: >-
          The absolute value of delta in I3 is below 2^{-124} at p near 2^255,
          from the Hasse bound alone with no heuristic.
        responsibility: size
      - claim: >-
          The null probability of a spurious I1 pass is about 2^{-255} for
          independent perturbations, and is 1 for compensating pairs.
        responsibility: strictness
      - claim: 'The mutation control achieves a 100 percent detection rate.'
        responsibility: baseline
      - claim: >-
          The count of INDEPENDENT sources is reported, not merely the count of
          rows.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: 'number of resolved rows with residue r_i nonzero under identity I1'
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0. Any nonzero residue is a localised defect and a
        material process finding about this campaign's inputs; it triggers
        re-fetch of that row's specification before anything else proceeds.
    - metric: >-
        number of resolved rows where route A and route B disagree on the pair
        of valuations
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0 on rows where both routes are defined. THE TWO
        OUTCOMES MEAN DIFFERENT THINGS - agreement means the equation and the
        order were transcribed consistently with each other, from two documents
        or two parts of one document; disagreement means at least one is wrong,
        and the record must then determine WHICH by re-fetching, never by
        preferring the more convenient.
    - metric: >-
        measured difference of log2 twist rho cost and log2 curve rho cost,
        minus one half times log2(h/h'), per resolved row
      direction: different
      minimum_effect: >-
        PREDICTED below 2^{-100} in absolute value on every row, effectively
        exact. THE DISCRIMINATOR BETWEEN TWO EXPLANATIONS OF THE ARCHIVED PLAN'S
        0.5-BIT PREDICTION - if the residual is at the Hasse bound, the gap is
        COFACTOR BOOKKEEPING and carries no information about the trace, and the
        archived plan's description of it as a non-obvious falsifiable
        prediction about the curve must be corrected. If the residual EXCEEDS
        the rigorous Hasse bound on any row, then an input to that row is wrong,
        because the bound is a theorem and cannot be violated by a correctly
        transcribed curve.
    - metric: >-
        detection rate of the blocking mutation control over about 100
        single-field mutations
      direction: higher
      minimum_effect: >-
        PREDICTED 100 percent. Anything below 100 percent voids every
        consistency statement in the deliverable.
    - metric: 'number of rows resolved to a primary specification'
      direction: different
      minimum_effect: >-
        REPORTED AS A COVERAGE COUNT WITH NO TARGET. A low count is an honest
        environment measurement, not a failure, and the reason per unresolved
        row is recorded. Pre-registered expectation, stated so that the outcome
        is controlled rather than rationalised afterwards - the IETF rows and
        the SEC 2 rows are expected to resolve; the ANSSI, brainpool and
        Aranha-Barreto-Pereira-Ricardini rows are at material risk; and the
        Anomalous row, which is a constructed illustration rather than a
        standardised curve, may have NO primary source at all, which is itself a
        finding about the family's designated positive control.
    - metric: 'number of INDEPENDENT source documents behind the resolved rows'
      direction: lower
      minimum_effect: >-
        PREDICTED STRICTLY FEWER THAN the number of resolved rows, because
        several documents cover several curves each. The gap is the amount by
        which a naive row count would overstate the audit's independence, and it
        must be published.

  minimal_test:
    design: >-
      STAGE 0, zero compute. The mutation control's design is frozen BEFORE any
      real row is processed, so the detection rate cannot be tuned after seeing
      the data.
      STAGE 1, THE CHEAPEST VALID SUBSET, minutes, two rows only. Resolve
      exactly TWO rows - Curve25519, whose parameters the archived capsule
      already carries at retrieved provenance from RFC 7748 and RFC 8032, and
      ANOMALOUS, the deliberately broken positive control. Run I1, I2, I3 and
      the mutation control on those two. This alone (a) closes the archived
      capsule's open item OR-1 by exact integer comparison of the hexadecimal
      RFC 7748 literal against the decimal RFC 8032 literal, (b) exercises both
      the Montgomery and the short-Weierstrass branches of route A, (c) exhibits
      the h = 1 and l = p configuration that proves the lattice is not hard-wired
      to cofactor 8, and (d) produces the mutation detection rate. Two rows are
      enough to falsify the design; twenty are needed only to deliver it.
      STAGE 2, hours, retrieval-bound. Resolve the remaining rows, one primary
      specification at a time, recording provenance per field and marking
      unresolved rows with reasons.
      STAGE 3, seconds. The full lattice, the residue table, the valuation
      matrix, the I3 residuals, and the independent-source count.
    controls:
      - >-
        BLOCKING MUTATION CONTROL - about 100 single-field digit mutations
        across the resolved rows; detection rate must be 100 percent and each
        detection must name the failing identity and field.
      - >-
        POSITIVE, ANOMALOUS - h = 1, l = p, v_2(#E) = 0 on both routes, and the
        Weierstrass branch of route A must report no rational 2-torsion. Per the
        goal's claim boundaries these parameters must be independently re-sourced
        before the row is treated as an authoritative control; until then it is
        an intake self-consistency check and is labelled so.
      - >-
        POSITIVE, BN(2,254) - expected cofactor 1 with a distinctive
        small-discriminant signature. Same re-sourcing precondition.
      - >-
        NEGATIVE - a sourced twist-secure row expected to behave like
        Curve25519, namely M-221 or E-222, whose residues must also be zero.
        This matches on design intent only, not on p, and that limitation is
        stated.
      - >-
        NULL, SAME SHAPE - 10^3 synthetic five-tuples of the same bit lengths
        drawn independently at random, fed through the identical code path.
        PREDICTED residue-zero rate about 2^{-255}, that is zero observed. A
        single spurious pass indicates the identity is being evaluated modulo
        something, or with truncation, and voids the lattice.
      - >-
        NULL, COMPENSATING-ERROR PROBE - deliberately construct compensating
        error pairs and confirm the lattice does NOT detect them, so that the
        published claim is bounded by what was actually demonstrated rather than
        by what was hoped.
    required_metrics:
      - 'per row, the five transcribed quantities with per-field provenance'
      - 'per row, the residue r_i as an exact integer'
      - 'per row, the route A and route B valuations for both curve and twist'
      - 'per row, the I3 residual and the rigorous Hasse bound it is compared to'
      - 'per row, the primality tier reached for l and for p_2'
      - 'per row, resolved or unresolved with reason'
      - 'mutation detection rate, broken down by mutated field type'
      - 'count of independent source documents versus count of rows'
      - 'null pass rate on 10^3 synthetic tuples'

  falsification_conditions:
    - >-
      Any nonzero residue on a fully resolved row. The row's parameters are
      internally inconsistent - halt that row, re-fetch its specification, and
      record whether the defect was in this program's transcription or in the
      source. If in the source, that is a material finding about a published
      specification and must not leave the repository before independent review.
    - >-
      Any route A versus route B valuation disagreement, handled as above.
    - >-
      An I3 residual exceeding the rigorous Hasse bound on any row. Since the
      bound is a theorem, this is proof of a wrong input and cannot be a
      property of a real curve.
    - >-
      A mutation detection rate below 100 percent. The lattice is not an
      error-detecting code and the entire deliverable is withdrawn.
    - >-
      A nonzero pass rate on the synthetic null. Implementation failure.
    - >-
      Fewer than two rows resolvable to primary sources. The lattice has no
      redundancy and this proposal returns an environment measurement instead of
      a result - a legitimate outcome, recorded as such and not dressed up.

  confounders:
    - >-
      NON-INDEPENDENT SOURCES. Two rows transcribed from the same document give
      one check of that document, not two. The deliverable must publish the
      independent-source count beside the row count; reporting only the row
      count would overstate the audit's power, and this is the single most
      likely way for the lattice to look stronger than it is.
    - >-
      SELF-CONSISTENT MEMORY. A parameter recalled from memory is likely to be
      self-consistent with other recalled parameters and would pass the lattice
      while being unsourced. Provenance is therefore recorded PER FIELD, not per
      row, and a row with any recalled field is excluded from the consistency
      count.
    - >-
      COMPENSATING ERRORS are invisible to I1 by construction. The
      compensating-error probe exists to bound the claim, and the published
      statement must be "no single-field defect", never "no defect".
    - >-
      TWIST CONVENTION. Which of E and E^t is called the twist is a convention.
      Swapping them exchanges the two cofactor-order pairs, leaves I1 invariant,
      but FLIPS THE SIGN of I3's predicted gap. A row whose I3 residual is
      exactly log2(h/h') in magnitude but wrong in sign has a convention error,
      not a parameter error, and the two must not be conflated.
    - >-
      PROBABLE PRIMES. If l or p_2 is only BPSW-certified, the statement that
      the cofactor is exactly h is conditional on a probable-prime premise and
      every downstream row inherits it. "Probable prime" may never be written as
      "prime".

  interpretation_limits:
    - >-
      Consistency is not correctness and is not security. A perfectly consistent
      family could be uniformly wrong, if all rows came from one corrupted
      source, and a deliberately broken curve like Anomalous is expected to be
      perfectly consistent - it is broken, not mis-transcribed. No safety
      conclusion whatsoever follows from a zero residue.
    - >-
      TRANSFER TO THE OTHER 19 CURVES - this record IS the transfer, and that is
      its point. I1 and I3 are field-agnostic and model-agnostic and apply
      verbatim to every row for which the five quantities can be sourced, with no
      Montgomery assumption and no branching on p mod 4. The transfer is
      therefore FULL for I1 and I3. It is PARTIAL for I2, whose route A inherits
      every branch limitation of IDEA-20260829-d052e6 - full for the
      Montgomery rows M-221, M-383, Curve383187 and Curve25519;
      model-conversion dependent for the Edwards rows E-222, Curve1174 and
      E-382; and Weierstrass-branch-only for the remaining rows including
      Anomalous, BN(2,254), the NIST rows, the brainpool rows, secp256k1 and
      ANSSI FRP256v1.
    - >-
      The lattice binds five fields. It says nothing about the base point beyond
      its order, the j-invariant, the CM discriminant, the embedding degree, or
      any criterion cell.
    - >-
      Unresolved rows are excluded, and their exclusion changes what the
      deliverable covers. The coverage count is part of the result, not a
      footnote.

  heuristic_assumptions:
    - id: H1
      statement: >-
        A transcription error introduced by a human or by a text-extraction tool
        perturbs the affected field ADDITIVELY AND INDEPENDENTLY of the other
        four fields; formally, conditioned on an error occurring in exactly one
        field of row i, the resulting residue r_i is modelled as a uniformly
        random integer of the magnitude of the perturbation, so the probability
        that r_i equals zero given a single-field error is at most 2^{-b}, where
        b is the bit length of the smallest field bound by the identity.
      rigorous_support: >-
        The RIGOROUS half is the identity itself - h times l plus h' times p_2
        equals 2p + 2 holds exactly for a correctly transcribed row, with no
        error term, so any nonzero residue is UNCONDITIONAL proof of an error.
        The heuristic is used ONLY in the reverse direction, to claim that a zero
        residue is evidence of correctness, and it imitates the standard
        random-oracle model of a checksum in which a corrupted message collides
        with a valid one with probability 2^{-b}. This is exactly the shape of
        the "behaves like a uniformly random integer of its size" family of
        assumptions.
      validation_plan: >-
        SAMPLING - about 100 single-field mutations across the resolved rows,
        plus 10^3 fully synthetic five-tuples at matched bit lengths of 255, 256
        and 384 bits with recorded seeds. COMPARISON DISTRIBUTION - the observed
        false-negative rate against the predicted 2^{-b}; at b of at least 250
        the prediction is exactly zero observed in any feasible sample, so the
        test has no power to confirm the exponent and CAN ONLY REFUTE IT, which
        is stated rather than glossed, since a single false negative would refute
        it decisively. TAIL CHECK - mutations restricted to the LOW-ORDER digits,
        where a naive implementation using floating point or truncated comparison
        would fail first; PREDICTED still 100 percent detection, and this is the
        mutation class most likely to expose an implementation defect. TRANSFER -
        none, since the mutation control runs at the real bit lengths on the real
        rows and there is no size extrapolation in this heuristic at all.
    - id: H2
      statement: >-
        The primary specification documents fetched in Step 1 faithfully state
        their curves' parameters; that is, a residue of zero reflects the real
        curve rather than a shared error propagated from a single upstream
        source into several documents.
      rigorous_support: >-
        NONE. This is an assumption about the world, not about mathematics, and
        no computation can discharge it. It is the reason the deliverable reports
        the INDEPENDENT-SOURCE count rather than the row count, and the reason
        cross-body corroboration - the archived capsule's open item OR-4, NIST SP
        800-186 as a second authority alongside the IETF documents - is worth its
        retrieval cost.
      validation_plan: >-
        PARTIAL ONLY, and it is a provenance exercise rather than a measurement.
        For each row, attempt at least TWO independent authorities from DIFFERENT
        standards bodies, for example IETF and NIST for Curve25519, or SEC and
        NIST for the P-curves, and record agreement or disagreement per field.
        Rows with only one authority are labelled single-authority and are
        excluded from any claim of cross-body corroboration. There is no
        statistical comparison distribution here and none is invented; the output
        is a provenance table.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. Audit cost - I1 is one big-integer
      multiply-add per row, I2 is the dozen exponentiations of
      IDEA-20260829-d052e6 plus two 2-adic valuations of transcribed integers,
      and I3 is two integer square roots and a logarithm. That is microseconds
      per row and milliseconds for the family. The dominating cost is the per-row
      order-of-G verification, one scalar multiplication of 252 to 384 bits, and
      the primality certification of l and p_2, which is capped. RETRIEVAL, NOT
      COMPUTE, IS THE BUDGET.
    memory_exponent: >-
      O(log p) per row; the whole lattice is a few kilobytes. Certificate
      verification is O(1) big-integer operations per identity - genuinely
      succinct, unlike the K-multiplication embedding-degree bound of
      IDEA-20260807-98a970.
    best_known: >-
      No incumbent exists inside this program, since the corpus holds no order,
      no cofactor and no twist order for any of the twenty curves. Outside it,
      any computer-algebra system with the parameters loaded performs these
      checks trivially, and SafeCurves' own published tables are the incumbent
      deliverable. Against the ECDLP attack frontier - KN-TECH-001, KN-TECH-006,
      KN-TECH-018, KN-TECH-031, KN-TECH-032, KN-TECH-033 and KN-TECH-035 - this
      record is dominated by every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. The honest hidden costs are two and
      both are epistemic. (i) The independence of the twenty checks is
      OVERSTATED by the row count and the deliverable must publish the corrected
      count. (ii) A zero residue is evidence only under heuristic H1 and only
      against single-field errors; compensating errors are invisible and are
      demonstrated to be invisible by the probe.
    tradeoff_note: >-
      The tradeoff is between COVERAGE and INDEPENDENCE, and it is unusual in
      that spending more retrieval effort on the same rows buys independence
      while spending it on new rows buys coverage. The deliverable should say
      which it bought. There is no time-memory tradeoff, and parallelisation is
      irrelevant since the compute is milliseconds; the 14 cores buy nothing
      here.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. AS AN ATTACK it
    is dominated by rho (KN-TECH-001, KN-TECH-006), automorphism-discounted rho
    (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
    (KN-TECH-032) and the trace-one transfer (KN-TECH-033), simultaneously on
    time, memory and data, because it is not an attack. AS AN AUDIT INSTRUMENT
    it is dominated by SafeCurves' own published tables on coverage and
    authority, and by any computer-algebra system on convenience. It is NOT
    dominated on one specific axis, which is the whole of its case - no incumbent
    named above performs a MUTATION-CONTROLLED cross-check of this program's own
    transcriptions with a published detection rate and per-field provenance, and
    no incumbent's output is a ledger-resident certificate. AS A PREDICTION,
    instrument I3 STRICTLY DOMINATES the archived audit plan's lane L9 twist-rho
    prediction, replacing a per-curve empirical expectation of about 0.5 bits
    with tolerance plus or minus 0.1 by an exact identity carrying a rigorous
    2^{-124} error bound. That is a genuine and quantifiable improvement over the
    best statement this program currently holds.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS DATA - the
    repository currently contains zero group orders, zero cofactors and zero
    twist orders for the twenty-curve family; the manifest read on 2026-08-29
    carries none, and the archived capsule's own grep found neither Curve25519
    order literal anywhere. This would produce up to twenty rows times five
    sourced quantities with per-field provenance, twenty exact residues, forty
    cross-certified valuations, and a published mutation detection rate, where
    there are currently none. AS PRECISION - the twist-versus-curve rho gap moves
    from "predicted about 0.5 bits, tolerance plus or minus 0.1", the archived
    plan's lane L9, to "one half times log2(h/h') exactly, with residual below
    2^{-124} by Hasse", a tightening of the stated uncertainty by about 120
    orders of magnitude in binary and a reclassification of the effect from curve
    structure to cofactor bookkeeping. AS PROCESS - the campaign's standing
    defect, that every stated numeric relation is a transcription plus a pending
    check, moves from undetectable to detectable with a measured detection rate
    for single-field errors in five fields per row, and provably undetectable for
    compensating pairs; a bounded improvement, stated at its true size.
