idea:
  id: IDEA-20260829-e37b52
  question_id: RQ-SCURVE-d9b7d2
  goal_id: GOAL-SCURVE-51437e
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE TWENTY-ROW CONSISTENCY LATTICE - treat the SafeCurves family's parameter
    set as an ERROR-DETECTING CODE and audit it with two mutually independent
    routes to the same quantities, so that a transcription error anywhere in the
    family is LOCALISED rather than merely suspected
  class: control

  claim: >-
    The twenty curves of the SafeCurves manifest, taken together, are massively
    over-determined by exact integer identities, and this over-determination can
    be turned into a machine-checkable consistency certificate that localises
    transcription errors. Three concrete instruments, each with a quantified
    null.

    (I1) THE HASSE-TWIST IDENTITY, exact, zero tolerance. For every curve,
    h times l plus h' times p_2 equals 2p + 2 exactly, where (h, l) are the
    curve cofactor and prime subgroup order and (h', p_2) are the twist's. This
    is one big-integer multiply-add per curve and it binds FIVE independently
    transcribed quantities into ONE equation. NULL - a tuple of five
    independently drawn 255-bit integers satisfies it with probability about
    2^{-255}. A pass is therefore a roughly 255-bit consistency signal per
    curve, and a single-digit typo in any of the five is caught with probability
    1.

    (I2) THE TWO-ROUTE CROSS-CERTIFICATION OF v_2. Route A computes v_2(#E) and
    v_2(#E^t) from the CURVE EQUATION ALONE by the Legendre instrument of
    IDEA-20260829-d052e6, using no order data whatsoever. Route B computes them
    from the TRANSCRIBED ORDERS by 2-adic arithmetic on h times l and on
    2p + 2 - h times l. The two routes share no input beyond p, so agreement is
    a genuine cross-check and not a tautology. PREDICTED - agreement on all rows
    where both routes are defined. A DISAGREEMENT ON ROW i IS A LOCALISED DEFECT
    and the record must then say which of the two routes is wrong, not merely
    that they differ.

    (I3) THE COFACTOR-RATIO IDENTITY FOR THE CURVE-VERSUS-TWIST RHO GAP.
    log2(0.886 sqrt(p_2)) minus log2(0.886 sqrt(l)) equals one half times
    log2(h / h') plus delta, where delta is RIGOROUSLY BOUNDED by Hasse. Since
    l = (p + 1 - t)/h and p_2 = (p + 1 + t)/h' with the absolute value of t at
    most 2 sqrt(p), the absolute value of delta equals one half times the
    absolute value of log2((p+1+t)/(p+1-t)), which is at most one half times
    log2(1 + 4 sqrt(p)/(p + 1 - 2 sqrt(p))), and at p near 2^255 that is below
    2^{-124}. THE CONSEQUENCE, STATED AS THE DISCRIMINATOR - the archived audit
    plan predicts the Curve25519 twist to be the HARDER group by about 0.5 bits
    and calls this a non-obvious falsifiable prediction. I1 to I3 show it is
    neither non-obvious nor about the trace, because 0.5 equals one half times
    log2(8/4) EXACTLY, to within 2^{-124}. The gap is COFACTOR BOOKKEEPING, not
    curve structure. This proposal's job is to decide that question
    quantitatively across the whole family instead of reporting a per-curve
    number and calling it a finding.

  mechanism: >-
    THE TRACKED OBJECT is the residue vector of the family. For each curve i,
    the tuple (p_i, h_i, l_i, h'_i, p_2i) is reduced to the single scalar
    r_i = h_i times l_i plus h'_i times p_2i minus (2 p_i + 2), together with
    the pair of 2-adic valuations obtained by the two independent routes. The
    family object is the vector of twenty residues and the twenty-by-two matrix
    of valuation pairs.

    LOSSY-PROJECTION TEST, applied before any experiment.
    WHAT IS DISCARDED - everything. Five integers of up to 384 bits each, times
    twenty curves, collapse to twenty residues that are PREDICTED to be
    identically zero, plus forty small valuations. The projection is maximally
    lossy, since a vector of zeros carries no information about any curve.
    IS IT A CHANGE OF COORDINATES? Emphatically not. From the residues one
    cannot recover a single parameter, and the fibre over the all-zeros vector
    is the entire consistent parameter space.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? The operation that matters
    here is not an algebraic one; it is TRANSCRIPTION, the error process the
    goal's own next_action identifies as the standing defect. The projection
    propagates deterministically under it in the strongest possible sense -
    r_i is IDENTICALLY ZERO for every correctly transcribed row and NONZERO with
    probability 1 - 2^{-255} for any row with an independent perturbation in any
    one of the five fields. That is precisely the defining property of a
    checksum, and it is the reason this object is worth tracking even though its
    predicted value carries no mathematical content. PASSES, and it passes for
    an unusual reason worth recording - the object is informative exactly BECAUSE
    its predicted value is trivial.
    WHERE IT DISSOLVES - r_i is blind to a COMPENSATING pair of errors, and to
    any error in a quantity it does not contain, namely the base point, the
    j-invariant, the discriminant and the embedding degree. Its reach is exactly
    the five fields it binds and no further. Stated up front.

    WHY A FAMILY LATTICE AND NOT TWENTY SEPARATE AUDITS. The archived plan is a
    single-curve plan and its final open direction explicitly leaves the
    cross-curve comparison unaddressed, describing it as a cheap comparative
    measurement across the twenty SafeCurves goals needing only the same lanes
    run twenty times. That framing under-uses the family. Twenty independent
    audits give twenty unverified numbers; ONE lattice gives twenty numbers each
    checked against four others plus a second independent route, and it converts
    "we measured a thing" into "the family is internally consistent, or defect
    number j is at row i field f". The deliberately-broken rows are not noise in
    this design, they are the calibration - ANOMALOUS must produce h = 1, l = p
    and v_2 = 0 on BOTH routes, and BN(2,254) must produce its own distinctive
    signature. An instrument whose residues are all zero because it is
    insensitive would also return all zeros on a corrupted family, which is why
    the mutation control below is BLOCKING.

    EXECUTION. Step 1, RETRIEVAL - for each of the twenty rows, fetch a primary
    or authoritative specification and transcribe p, the curve equation, the
    base point, l and h. Rows whose specification cannot be obtained are
    recorded UNRESOLVED with the reason and are EXCLUDED from the lattice, never
    guessed. Step 2, PER-ROW CERTIFICATION OF #E without point counting, by the
    archived plan's L4 Hasse-uniqueness argument - given l prime, [l]G equal to
    the identity with G not the identity on E, and l greater than 4 sqrt(p), the
    Hasse interval contains exactly one multiple of l, so #E = h times l with h
    the unique multiplier. Step 3, derive #E^t = 2p + 2 - #E and factor out its
    2-part and small odd part. Step 4, evaluate I1, I2 and I3 for every row and
    publish the residue table. Step 5, the MUTATION CONTROL - perturb one digit
    of one field in one row and confirm the lattice localises it.

  novelty_status: unverified
  novelty_rationale: >-
    The identity #E + #E^t = 2p + 2 is textbook and the Hasse-uniqueness
    argument is the archived plan's own lane L4, so as mathematics this is
    `known`. Its use as a FAMILY-WIDE ERROR-DETECTING CODE with a quantified
    null and a mutation control is, as far as the corpus screen shows, not
    present in this program. The label is `unverified` because no external source
    was successfully retrieved this session and the SafeCurves criterion pages
    remain unreachable; per agents/idea-generator.md that forces the weaker
    label regardless of how routine the mathematics is.
  novelty_screen:
    method: >-
      Same 2026-08-29 screen as IDEA-20260829-d052e6, plus a partial read of
      coordination/bootstrap/safecurves/TASK-20260824-41038d/manifest.yaml,
      lines 1 to 893 of 1300. The remaining rows were not read and the count of
      twenty rows is taken from the manifest's own record_count block, not from
      my own enumeration.
    results: >-
      The manifest carries, per row, ONLY the curve name, equation, modulus,
      details string, expected_safe flag, the eleven expected criterion cells,
      and record paths. It carries NO group order, NO cofactor, NO base point
