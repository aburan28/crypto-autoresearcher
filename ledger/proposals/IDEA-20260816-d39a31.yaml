idea:
  id: IDEA-20260816-d39a31
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: Vary only the solver budget against a frozen step-reduced SHA-256/16 encoding across eight
    doublings and read the shape of the reachable-step response curve, because a plateau and a persistent
    slope are the two different predictions that instrument-limited and deficit-limited frontiers
    make
  class: measurement
  claim: '(A) The two competing explanations of a step-reduced stall are separable by a single experiment
    that changes nothing but the budget. If the frontier is set by the search instrument, then the
    maximum step count s* at which the instrument returns a verified satisfying assignment within
    budget B keeps rising as B doubles, with a slope that does not flatten inside the tested range.
    If the frontier is set by an exhaustion of usable degrees of freedom in the message schedule,
    then s* saturates: past some budget, further doublings buy nothing, because the additional search
    is exploring a space that contains no solution rather than failing to find one that is there.
    (B) The tracked object is therefore not a step count but the response curve s*(B) and specifically
    its discrete derivative ds*/dlog2(B) over eight doublings, measured at a toy word size where eight
    doublings are affordable and where every arm can be replicated across seeds. The curve''s shape,
    not its height, carries the discrimination, which is why the toy word size costs nothing conceptually:
    a plateau at w = 16 is still a plateau. (C) NOT CLAIMED: that any value of s* obtained here transfers
    to 32-bit SHA-256; that a plateau proves no characteristic exists beyond it - AGENTS.md rule 3
    forbids exactly that reading, and every non-solution is recorded as a budget outcome about a solver;
    that a persistent slope proves the real frontier is instrument-limited, since a slope inside a
    tested range may flatten just outside it; or anything at all about full-round SHA-256. What a
    run delivers is a measured curve shape with replicate error bars, and the honest reading of a
    persistent slope is that this program has not yet found the plateau, not that there is none.'
  mechanism: 'STAGE A. Define SHA-256/16, a toy instantiation with 16-bit words, a 256-bit block of
    16 words, the same recurrence structure, and rotation and shift amounts scaled by a rule declared
    in advance and frozen. STAGE B. Encode the step-reduced semi-free-start collision search as CNF:
    two message blocks, the step-reduced state, XOR differences constrained non-zero on the input
    and zero on the output of the covered steps, with modular addition and the Boolean functions bit-blasted
    through a standard adder encoding written in-repo. STAGE C. Freeze the encoding, the solver binary,
    the seed set and the preprocessing configuration; the ONLY variable is the wall-clock budget B,
    taken over eight doublings. STAGE D. For each s and each B, run R replicate seeds and record whether
    a satisfying assignment was returned and whether the returned assignment verifies against an independent
    SHA-256/16 implementation. Unverified SAT answers are instrument faults, not results. STAGE E.
    Define s*(B, seed) as the largest s at which a verified assignment was returned, and emit the
    response curve with replicate spread. STAGE F. Refutation route: if the curve rises monotonically
    across all eight doublings with no flattening, the run reports that the plateau was not located
    within budget and that the discrimination is unresolved - which is a budget outcome, and is recorded
    as one rather than as evidence for the instrument-limited hypothesis.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full, ledger/goals/GOAL-SHA2-001.yaml, and docs/inventor-protocol.md
      sections 3 and 8. Ran grep -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/ coordination/;
      grep -ril 'solver budget' over ledger/proposals/ ledger/hypotheses/ knowledge/techniques/ knowledge/findings/;
      grep -ril 'instrument-limited' over the same; grep -ril 'SAT encoding|CNF' over the same; grep
      -ril 'toy word size|scaled-down word' over the same.
    results: '''solver budget'' matched four records: ledger/proposals/IDEA-20260807-d329e2, IDEA-20260731-016,
      IDEA-20260731-017 and ledger/hypotheses/H-ECTD-001 - grep-level hits whose bodies I did not
      read, none of which references RQ-SHATWO since the RQ-SHATWO grep returned only the question,
      GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2. ''instrument-limited'' matched exactly one proposal, IDEA-20260807-6eb96b,
      again grep-level only. ''SAT encoding|CNF'' returned ZERO hits across ledger/proposals/, ledger/hypotheses/,
      knowledge/techniques/ and knowledge/findings/, so no record in this repository proposes a CNF
      encoding of anything. ''toy word size|scaled-down word'' returned ZERO hits. RQ-INSTR-f8faa0
      exists and owns instrument validity for the ECDLP lane; its opening states the doctrine this
      proposal borrows - an instrument that cannot detect a planted signal cannot support a negative
      - but it is bound to toy prime-field curves, not to a hash.'
    verdict: 'UNVERIFIED. No agent here can read external literature and this record asserts nothing
      about what that literature contains. Claimed new: nothing in the encoding, which is ordinary
      bit-blasting, and nothing in the solver, which is off the shelf. What is claimed as the contribution
      is the experimental design: making budget the sole independent variable with encoding, solver,
      seed set and preprocessing all frozen, and reading the SHAPE of the response curve rather than
      its height, so that the two hypotheses in RQ-SHATWO-f196c7 target 3 make different predictions
      on one measurement. Assembled from known parts: budget sweeps are routine practice in solver
      benchmarking, and toy-word-size hash variants are an obvious construction. Within this repository
      the verifiable novelty is narrow and real: zero records mention a CNF encoding, zero mention
      a toy word size, and no proposal binds to RQ-SHATWO at all.'
  object_first_candidate:
    tracked_object: 'The response curve s*(B): the largest step count at which a frozen instrument
      returns a certificate-verified satisfying assignment within wall-clock budget B, followed as
      B doubles eight times, together with its discrete derivative ds*/dlog2(B) and the replicate
      spread of both across seeds.'
    lossiness: 'Lossy, and named. Discarded: the assignments themselves, the search tree, conflict
      counts, the identity of which characteristic was found, and all internal solver telemetry -
      everything except one integer per (B, seed). Retained: the integer and its trend. Vast numbers
      of distinct search histories map to the same s*, so this is a projection rather than a re-coordinatization.
      Why the remainder still propagates: s* is monotone non-decreasing in B by construction, because
      any assignment findable within B is findable within 2B under the same seed and configuration
      when the solver is run to completion of the budget, so the sequence over doublings is a well-defined
      monotone staircase and the derivative is well-defined on it without reference to anything discarded.'
    propagation: The operation being iterated is a budget doubling, not a cipher step. One doubling
      maps the staircase value s*(B) to s*(2B) >= s*(B). The informative content is the increment.
      Under the deficit-limited hypothesis increments go to zero and stay there once the budget exceeds
      what the satisfiable region requires; under the instrument-limited hypothesis increments persist
      at roughly constant size across doublings, which is the signature of search cost growing geometrically
      in s. The two propagation laws are distinguishable on eight doublings if the increment size
      is at least one step, which is why the toy word size is chosen to make single-step increments
      cheap.
    survival_score: 'The object survives exactly as far as the budget ladder reaches and no further,
      and that boundary is the honest limit of the whole design: eight doublings is a 256-fold range,
      and a plateau observed inside it is a plateau inside it. Concretely, if increments are zero
      for the last three doublings the plateau is recorded with that scope; if they are nonzero throughout,
      the object has not dissolved, it has simply not yet been resolved, and the record says the plateau
      was not located within 256x the base budget rather than that none exists.'
  null_object_control: 'Two nulls in the same invocation. NULL-A random-tap SHA-256/16: identical
    encoder, identical solver, identical budget ladder, but sigma0 and sigma1 replaced by random GF(2)
    linear maps of matched fan-in; a design-specific frontier must differ from this, and if the response
    curve is identical then s* is measuring the encoder''s size rather than the primitive. NULL-B
    satisfiability-neutral scramble: the same CNF with the variable names permuted by a random permutation
    and the clause order shuffled, which is provably an equisatisfiable instance; s*(B) must be statistically
    identical to the signal arm across seeds. If NULL-B differs materially, the measurement is reading
    solver heuristics keyed to variable order and no arm means anything. For the signal arm to carry
    information, NULL-B must match and NULL-A must not.'
  discriminated_from:
  - RQ-SHATWO-f196c7 target 3, which names this discrimination as unrun but specifies no budget ladder,
    no toy scale, no replicate structure and no null; this supplies all four and confines itself to
    curve shape.
  - RQ-INSTR-f8faa0, which owns instrument validity in this program but is scoped to toy prime-field
    curves and planted ECDLP signals; the doctrine transfers, the instrument does not, and this proposal
    does not reuse any of its harness modules.
  - 'IDEA-20260807-6eb96b, the single grep hit for ''instrument-limited'' in ledger/proposals: matched
    at grep level only, in a lane that does not reference RQ-SHATWO, and I did not read its body.'
  - The rank-ledger proposal in this same bucket, whose object is a solver-free integer computed before
    any search; this object exists only because a solver runs, and the two are deliberately complementary
    rather than variants - one is the predicted crossing and this is the measured response.
  - Ordinary solver benchmarking, which varies the instance family at fixed budget to rank solvers;
    here the solver is frozen and the budget is the only variable, because the question is about the
    primitive's frontier and not about solver quality.
  assumptions:
  - SHA-256/16 with declared scaled rotation amounts is a legitimate nearby object, not a different
    primitive; this is a modelling assumption and the scaling rule is frozen in the preregistration
    rather than justified.
  - 'The CNF encoding is faithful: every satisfying assignment decodes to a message pair that an independent
    SHA-256/16 implementation confirms, which is checked on every returned assignment rather than
    assumed.'
  - Solver runs are reproducible under a fixed seed and fixed configuration to within the reported
    replicate spread; nondeterminism is measured, not assumed away.
  - A budget doubling is a meaningful resource axis on this machine, i.e. wall-clock is not dominated
    by I/O or by other tenants; machine variance is bounded by replicates and reported, and this contract
    does not attempt a general cost model, which RQ-INSTR-f8faa0 already owns.
  predictions:
  - metric: ds*/dlog2(B) over the last three of eight doublings, SHA-256/16 signal arm
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a direction, and this is the point of the design:
      the whole experiment exists because the two hypotheses predict opposite signs and pre-committing
      one would bias the reading. What IS pre-committed is the decision rule - mean increment below
      0.25 steps per doubling over the last three doublings is scored as plateau, above 0.75 as persistent
      slope, between as unresolved'
  - metric: s*(B) of NULL-B variable-permuted equisatisfiable arm versus signal arm
    direction: different
    minimum_effect: 0 - the two must be statistically indistinguishable, and any separation exceeding
      one step at any B voids the run as heuristic-keyed
  - metric: s*(B) of NULL-A random-tap arm versus signal arm at the largest budget
    direction: different
    minimum_effect: at least 1 step of separation, otherwise the measurement is reading encoder size
      rather than the SHA-256/16 design
  - metric: fraction of returned satisfying assignments that verify against the independent implementation
    direction: higher
    minimum_effect: 1.0 exactly; any unverified SAT answer is a fatal encoder fault and voids the
      run
  minimal_test:
    design: 'Cheapest discriminating version: fix w = 16, fix one solver binary, fix five seeds, and
      run only three budgets - B, 16B, 256B - rather than all eight doublings, at the three step counts
      bracketing the coarse frontier located by a single pilot pass. That is fifteen runs per arm
      and three arms, and it already discriminates, because the plateau-versus-slope decision rule
      reads the increment between the second and third budget and needs only those two increments
      to fire. Add the NULL-B equisatisfiable permutation arm at the same fifteen configurations,
      since it is free - the same CNF with shuffled names - and its failure would void everything.
      If the coarse pass returns unresolved, the full eight-doubling ladder is justified; if it returns
      a plateau at 16B already, the expensive ladder is unnecessary and the cheap answer stands with
      its scope stated as within 256x the base budget.'
    controls:
    - NULL-B equisatisfiable variable-permutation and clause-shuffle arm, same invocation, same budgets.
    - NULL-A random-tap SHA-256/16 arm, same encoder, same budgets.
    - Certificate verification of every returned assignment by an independent SHA-256/16 implementation;
      unverified SAT is a fault, never a result.
    - Replicate seeds at every (s, B) cell with the spread reported, so machine variance is visible.
    - A trivially satisfiable planted instance at every budget as a liveness check that the solver
      and harness are functioning at that budget.
    required_metrics:
    - s*(B, seed) per arm
    - discrete derivative ds*/dlog2(B) per arm with replicate spread
    - per-cell SAT / UNSAT / TIMEOUT counts, with TIMEOUT recorded as a budget outcome and never as
      UNSAT
    - certificate verification rate of returned assignments
    - wall-clock and memory per run
    - solver version, seed, encoding hash and preprocessing configuration per run
  falsification_conditions:
  - The NULL-B equisatisfiable arm differs from the signal arm by more than one step at any budget,
    showing s* is keyed to variable order rather than to the instance.
  - Any returned satisfying assignment fails independent verification, showing the encoder is unfaithful.
  - The NULL-A random-tap arm matches the signal arm at every budget, showing the curve measures encoder
    size rather than the primitive.
  - Replicate spread at fixed (s, B) exceeds the increment the decision rule must read, making the
    discrimination unresolvable at this replicate count.
  - The liveness planted instance is not solved at some budget, showing the harness silently failed
    at that budget.
  confounders:
  - Solver preprocessing and restart heuristics interact with instance size, so a curve attributed
    to the primitive may track CNF size; the NULL-A arm exists to expose this and its clause counts
    must be reported alongside.
  - Machine load and thermal effects contaminate wall-clock budgets; replicates bound this and RQ-INSTR-f8faa0
    owns the general cost-model question, which this contract does not reopen.
  - The rotation-amount scaling rule for w = 16 is a free choice that may itself set the frontier;
    the constant-perturbation proposal in this bucket is the entry that measures that dependence,
    and this one holds it fixed and says so.
  - Encoding a semi-free-start rather than a full collision changes what a solution means; the target
    predicate is declared in the preregistration and never varied mid-run.
  - A plateau caused by memory exhaustion rather than by search exhaustion looks identical in s*;
    peak memory per run is recorded so that this confound is separable after the fact.
  interpretation_limits:
  - A plateau is a statement about a solver within a budget range, never a statement that no characteristic
    exists beyond it; AGENTS.md rule 3 governs and every timeout is a budget outcome.
  - All step counts are for SHA-256/16, a toy object, and no s* value transfers to 32-bit SHA-256;
    only the curve shape is offered as transferable, and even that is a conjecture this contract does
    not test.
  - Nothing here is a statement about full 64-step SHA-256, HMAC-SHA-256, or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement's own cost is 3 arms x 8 budgets
      x 5 seeds x the step ladder, bounded by the declared total wall clock; the largest single run
      is one budget unit and the total is fixed in advance by the ladder.
    memory_exponent: No attack memory exponent is claimed. Per-run solver memory is capped and recorded;
      exceeding the cap is a recorded fault, not a result.
    best_known: 'No incumbent attack. The incumbent to beat is the current epistemic state named in
      RQ-SHATWO-f196c7 target 3 in its own words: nobody in this program has run this discrimination,
      so the incumbent is an unrun comparison and any measured curve with error bars improves on it.'
    hidden_overhead: 'The encoder is the hidden cost and it is human: bit-blasting modular addition,
      Ch and Maj correctly, and getting the difference predicate right, is where days go and where
      silent faults live. The certificate-verification requirement charges that cost visibly. Second
      hidden cost: eight doublings means the last budget is 128 times the first, so the ladder''s
      total is dominated by its top rung and a mis-sized base budget wastes the entire run.'
  dominated_by: 'n/a (no attack result claimed). On the measurement axes I checked every frontier
    row present in this repository: no experiment directory and no evidence record measures a solver
    response curve for any hash primitive, the RQ-SHATWO grep returns no proposal or evidence at all,
    and ''CNF'' and ''SAT encoding'' return zero hits across proposals, hypotheses, techniques and
    findings. There is therefore no prior row here to dominate this one, and this repository cannot
    adjudicate against external work in either direction.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The delta is from an unrun discrimination
    to a curve with replicate error bars and a preregistered decision rule: currently zero measured
    values of s*(B) exist here for any hash, and a run would produce 3 arms x 8 budgets x 5 seeds
    of them plus two increments per arm that the decision rule reads.'
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Three separable parts. (1) That a faithful encoder can be built and every
    returned assignment verifies: ~0.85; bit-blasting is routine but the difference predicate is where
    encoders are silently wrong, and the verification gate is exactly what catches it. (2) That the
    plateau-versus-slope decision rule fires at all rather than returning unresolved: ~0.5, because
    replicate spread on solver wall-clock is often comparable to the increment being read, and eight
    doublings may simply be too short a lever at any affordable base budget. (3) That the curve shape
    measured at w = 16 says anything about 32-bit SHA-256: ~0.2, and stated low on purpose - the word-width
    transfer is precisely what the separate scaling-ladder entry in this bucket exists to test, and
    it is not assumed here. Part (2) failing still leaves a usable measured obstruction, namely the
    measured replicate spread that defeats the discrimination, which tells the next agent what replicate
    count would be needed.'
