      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 vanishes when three x-coordinates are x-coordinates of points
        summing to the identity, up to signs. Using that fact is the
        index-calculus framework. The check here is the group law, which
        is the same vanishing.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        For fixed n, Gaudry decomposition on E(F_{q^n}) is heuristic
