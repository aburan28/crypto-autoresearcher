      record and is not the odd-characteristic baseline.
    hidden_overhead: >-
      No o(1) attack term. The hidden pieces of Gaudry's Õ, including n!
      and the summation degree, are not measured.
    tradeoff_note: >-
      Not a time-memory tradeoff. The output is one ratio at cardinality 5.
