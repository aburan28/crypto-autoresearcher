idea:
  id: IDEA-20261006-7300c0
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Size-matched S_3 success rates for one Frobenius orbit versus a random
    5-set on an ordinary curve over F_{3^5}
  class: control
  claim: >-
    Representation class R1, x-coordinates. The attack stage is relation
    collection, and the charged cost of that stage is predicted not to
    change once the factor-base cardinality is fixed at 5. Let E be the
    first ordinary short-Weierstrass curve over F_3, in lexicographic
    order of (A, B), whose group E(F_{3^5}) has a prime-order subgroup G
    not contained in a proper subfield. Let B_orbit be one Frobenius orbit
    of five points of G, the orbit whose lexicographically least
    x-coordinate is smallest. Let B_rand be a 5-point subset of G drawn
    from a frozen seed, disjoint in the sense that it is not a single
    Frobenius orbit. Let ρ(B) be the fraction of 40 frozen targets in G
    that equal P+Q for some P, Q in B, with the sum checked in the group.
    Then ρ(B_orbit)/ρ(B_rand) lies in the closed interval [1/2, 2]. The
    same ratio for two independent random 5-sets on a null curve over
    F_{3^5} that is not defined over a proper subfield also lies in
    [1/2, 2]. A ratio of 5, the orbit length, is not predicted. The time
    exponent stays the opened Gaudry exponent q^{2-2/n} at n = 5, which
    is q^{8/5}, and Pollard rho stays q^{n/2}.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the x-coordinate in F_{3^5}.
    Operation set Sigma: translation by the five factor-base points, and
    on the object curve also the 3-power Frobenius. Sigma is not the full
    translation action of G.
    TRICHOTOMY. Partial-action. A relation vector propagates under
    translation by factor-base points only. Index calculus is Class I in
    that sense. The orbit base adds Frobenius as a second partial action
    that permutes the base.
    LOSSY-PROJECTION TEST against Sigma. The projection keeps the
    unordered pair of base points and discards the target's discrete
    logarithm. Translation by a base point adds a standard basis vector
    to the relation. The projection is lossy because many targets can
    share one pair. It is not a block system of the full translation
    action; the question's null curve is there to show a ratio that
    appears without Frobenius.
    The factor base is a bounded-degree algebraic set, x-coordinates of
    five rational points. It sits inside the scoped-out bounded-degree
    class. This record does not claim an escape from that class. It asks
    whether orbit structure changes the success fraction after the
    cardinality is matched. Families F1 through F7 are not the lens. The
    component used is ordinary summation, named as the known framework.
  novelty_status: adaptation
