        On a binary Koblitz curve, Frobenius-class rho reduces work by
        about sqrt(2m). The matched baseline for this odd-characteristic
        cell is rho on the same G, not that binary record's constant.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: RQ-FROB-7d8dd4
      provenance: internal
      claim: >-
        The opened question asks whether Frobenius changes index-calculus
        cost by more than the factor n, against a curve that is not
        defined over a proper subfield. This record isolates per-attempt
        success at cardinality 5.
      verified_by: idea-generator, 2026-10-06, ledger/questions/RQ-FROB-7d8dd4.yaml
  assumptions:
    - The first lexicographic ordinary (A, B) over F_3 with a prime-order subgroup of E(F_{3^5}) outside every proper subfield exists and is the object. If the search through a pre-registered bound on (A, B) finds none, the cell is unmeasured.
    - A free Frobenius orbit in that subgroup has size 5. A fixed point of Frobenius is discarded and the next orbit is taken.
    - Forty targets are frozen before any success bit is computed. Both bases are frozen before the targets are tested.
    - The null curve is ordinary, defined over F_{3^5}, and not isomorphic over a proper subfield to a curve defined over that subfield. Two random 5-sets replace the orbit arm.
  proof_search_map:
    not_applicable_reason: >-
      One-cell success-fraction control. Not a theorem about Gaudry's
      exponent and not a closure of Frobenius-invariant factor bases.
  predictions:
    - metric: success_rate_ratio_orbit_over_random
      direction: different
      minimum_effect: >-
        The ratio on the object lies in [1/2, 2], which is a gap of at
        least 3 from the orbit length 5 if the ratio were the symmetry
        factor. The null's two-random-set ratio also lies in [1/2, 2].
  minimal_test:
    design: >-
      Freeze the object curve and one 5-point orbit. Freeze a random
      5-set from a named seed. Freeze 40 targets in G. For each target,
      test all ordered pairs from the base by the group law and record a
      hit or a miss. Do the same for the random base. Build the null
      curve and two random 5-sets and repeat. Every hit stores the two
      points and is re-added by an independent group-law implementation.
    controls:
      - The null curve's ratio of two random 5-sets, which has no Frobenius endomorphism to exploit.
      - A second group-law check of every reported hit. A failed check voids the cell.
      - The orbit-size check: the orbit base has cardinality 5, and the random base has cardinality 5.
    required_metrics:
      - ρ(B_orbit) and ρ(B_rand) as fractions with denominator 40
      - their ratio
      - the null ratio
      - the curve coefficients and a certificate that the null is not a subfield curve
      - the number of hits that fail the second addition, required to be 0
  falsification_conditions:
    - >-
      Both object rates are at least 1/40 and their ratio is ≥ 2 or ≤ 1/2.
      That is the negative observation: cardinality matching did not remove
      the yield gap.
    - >-
      The null ratio is ≥ 2 or ≤ 1/2 while both null rates are at least
      1/40. The instrument is then too noisy for this sample, and the
      object ratio is not interpreted.
    - A hit fails the second addition. The cell is void.
  confounders:
    - A ratio with a zero denominator is undefined. If either rate is 0, the cell is inconclusive, not a confirmation of the interval.
    - Forty targets can miss a factor-of-two gap. The interval is the pre-registered claim for this sample size, not a confidence interval for all targets.
    - Binary trace-fall degree, tau-Horner chains, and Mumford eliminants are different mechanisms and are not controls for this ratio.
    - Linear-algebra dimension still drops by about n when relations are expanded by Frobenius. This record does not measure that drop.
  interpretation_limits:
    - One cell, q = 3, n = 5, base size 5, 40 targets. No statement at n = 131 and no exponent change.
    - The factor base remains in the bounded-degree algebraic class. No escape is claimed.
    - A ratio inside [1/2, 2] does not close Frobenius-invariant linear algebra. It closes only the per-attempt success fraction at this cardinality.
    - Gaudry's Õ(q^{8/5}) and rho's q^{5/2} are untouched. 8/5 is larger than 5/2 is false: 8/5 = 1.6 and 5/2 = 2.5, so the opened heuristic still has the smaller index-calculus exponent at n = 5, and this cell does not measure that race.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At cardinality 5, a uniform random 5-subset of G and one Frobenius
        orbit are two draws from the 5-subsets, and their S_3 hit rates on
        40 uniform targets differ by at most a factor of 2. The orbit is
        not assumed uniform. The factor-2 band is the pre-registered
        tolerance. The model imitated is a hypergeometric hit rate for a
        fixed 5-set against uniform targets, not a Dickman law.
      rigorous_support: >-
        For a fixed 5-set the hit indicator of a uniform target is an
        average over G of a checkable group-law predicate. KR-IC-b0fcda,
        opened, bounds the number of systems by 1/n after orbits are
        collapsed. It does not bound this hit rate. The factor-2 band is
        a tolerance, not a theorem.
      validation_plan:
        sampling: >-
          All 40 frozen targets against both bases on the object, and
          against two random bases on the null. No subsampling of the
          40.
        comparison: >-
          The ratio of the two object rates, and the ratio of the two
          null rates, each against the interval [1/2, 2].
        tail_check: >-
          If either rate is 0, record the zero and mark the ratio
          inconclusive. Do not replace a zero by a pseudocount.
        parameters: >-
          q = 3, n = 5, base size 5, 40 targets, one object curve, one
          null curve. No transfer to binary fields or to n > 5.
  target_complexity:
    time_exponent: >-
      Unchanged. Opened KR-IC-46d822 gives the heuristic Gaudry exponent
      2 - 2/n = 8/5 in q at n = 5. Rho remains exponent n/2 = 5/2 in q
      on the group order, up to the Frobenius-class constant the question
      requires. This ratio moves neither exponent.
    memory_exponent: >-
      Unchanged. Five points and forty targets. Linear algebra is not run.
    best_known: >-
      KR-IC-46d822, opened, heuristic Õ(q^{2-2/n}). KR-IC-b0fcda, opened,
      an extra factor up to n on the number of systems and n^2 on linear
