        binary field, and no Macaulay matrix is built.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
    - ref: KR-RHO-037e22
      provenance: internal
