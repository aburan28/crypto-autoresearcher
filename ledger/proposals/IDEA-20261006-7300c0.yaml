        not replace it.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        On ordinary binary curves the trace forces first fall degree 2
