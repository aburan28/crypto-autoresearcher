idea:
  id: IDEA-20260829-4dc951
  question_id: RQ-MLDSA-ffa0f5
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'
  title: >-
    Every prior proposal in this lane studies a signing check being REMOVED. The
    mirror-image non-conformance is a check being ADDED, and FIPS 204 leaves the
    only candidate wide open - the signing loop has no stated iteration bound,
    and the two-byte mask counter imposes an implicit one at 16384 / 13107 /
    9362 attempts whose exhaustion probability is 10^-1909. Derive the bound the
    standard does not state, then decide by measurement whether a capped
    signer's failure indicator is key-INDEPENDENT (leaking only its own rate) or
    key-DEPENDENT (a public selection channel), against the exact
    key-independence lemma for the z-norm acceptance probability.
  class: mechanism

  claim: >-
    (A) THE SPECIFICATION CLAIM. RECALLED, NOT FETCHED THIS SESSION. FIPS 204's
    signing algorithm is a while-loop with no stated maximum iteration count and
    no stated termination bound. Its parameter table supplies an EXPECTED
    repetition count - 4.25 / 5.1 / 3.85 at ML-DSA-44 / -65 / -87 - and no tail
    bound, no worst case, and no statement of what an implementation should do
    if the loop runs long. The verifier observes nothing whatsoever about how
    many attempts produced a signature. So an implementation that imposes an
    undeclared iteration cap is non-conformant in a way that NO amount of
    sign-verify testing on its outputs can detect, for the same structural
    reason the omitted ct0 check cannot be detected - and unlike the omitted
    check, this one is a modification any implementer might make for a perfectly
    ordinary engineering reason. That is a statement about a document and about
    an interface, and it is where this record's document claim stops.

    (B) THE DERIVABLE BOUND THE STANDARD DOES NOT STATE. RECALLED AND FLAGGED AS
    THE RECORD'S PRIMARY FALSIFIER: the mask expansion function derives each
    attempt's mask from a seed together with a counter encoded in TWO BYTES, and
    the counter advances by l per attempt. If that is right, the counter
    saturates after 65536/l attempts and the loop can make no further distinct
    progress. GENERATOR-COMPUTED, RE-DERIVATION REQUIRED, from l = 4 / 5 / 7:
      ML-DSA-44  16384 attempts
      ML-DSA-65  13107 attempts
      ML-DSA-87   9362 attempts
    Under the geometric law with per-attempt acceptance 1/R the probability of
    ever reaching that implicit ceiling is GENERATOR-COMPUTED as
      ML-DSA-44  (1 - 1/4.25)^16384 = 10^-1908.6
      ML-DSA-65  (1 - 1/5.10)^13107 = 10^-1242.2
      ML-DSA-87  (1 - 1/3.85)^9362  = 10^-1222.9
    So the implicit ceiling is a DEAD BRANCH in exactly the sense
    IDEA-20260805-bb52fa established for the ct0 disjunct at ML-DSA-65 and -87 -
    reachable in arithmetic, unreachable in practice - and the standard states
    neither the ceiling nor its unreachability. IF THE COUNTER IS NOT TWO BYTES,
    CLAIM (B) IS WITHDRAWN IN FULL and only the tail law in (C) survives; that
    is a single-line check and it is Stage 0.

    (C) THE MEASURABLE OBJECT. Define p_fail(kappa_max, sk) as the probability
    that signing a fresh message under sk exceeds kappa_max attempts. Under the
    geometric law it is (1 - 1/R)^kappa_max, GENERATOR-COMPUTED at ML-DSA-44 as
    0.2615 / 0.0684 / 4.68e-3 / 2.19e-5 / 4.79e-10 for kappa_max = 5 / 10 / 20 /
    40 / 80. A capped signer's emitted law is the conforming law FURTHER
    CONDITIONED on the attempt count, so by the total-variation identity
    IDEA-20260821-60ba98 establishes for a shrunken accept set - applied here
    with the roles swapped, since capping SHRINKS rather than enlarges the
    accept set - TV(D_cap, D_conf) = p_fail exactly, and the leak over N queries
    is at most N * p_fail. THE NEW CONTENT IS NOT THAT IDENTITY. It is that
    unlike an omitted check, a cap produces an OBSERVABLE EVENT - a signing
    failure - whose incidence is public to the signer's own clients while
    remaining invisible in every signature that is emitted. Detectability and
    leak therefore come apart in the opposite direction from the ct0 case.

    (D) THE FALSIFIABLE DISCRIMINATION, AND IT HAS A DERIVED FAVOURITE. There is
    an EXACT lemma pushing toward key-independence and it is worth stating
    because the corpus does not contain it. For a conforming key, z = y + c s1
    with y uniform on 2 gamma1 integers per coefficient, and the number of y
    values giving |z_j| < gamma1 - beta is exactly 2(gamma1 - beta) - 1
    INDEPENDENT OF (c s1)_j, precisely because |c s1| is at most beta. So the
    z-norm acceptance probability is EXACTLY key-independent and
    challenge-independent - not approximately, exactly - and the same shift
    argument makes the low-part acceptance probability key-independent under one
    named uniformity heuristic. HYPOTHESES. E1 KEY-INDEPENDENT: the across-key
    dispersion of the mean attempt count over 64 keys is consistent with the
    sampling floor; a cap then leaks only its own rate, the failure indicator
    carries nothing about the key, and the honest replacement for the standard's
    silence is a single number per parameter set. E2 KEY-DEPENDENT: the
    dispersion exceeds the floor; the exact lemma is then violated somewhere,
    the violation is localised to the low-part factor or to the special top cell
    of the decomposition by the factorised arm, and a capped signer's failure
    indicator IS a public key-dependent bit - a selection channel that no prior
    record in this lane has considered.

    (E) THE ARTIFACT. In deterministic mode the attempt count is a DETERMINISTIC
    FUNCTION of (sk, M) that every conformant implementation must reproduce
    bit-for-bit. The deliverable is therefore a portable ATTEMPT-COUNT TEST
    VECTOR SET - (seed, message, parameter set, attempt count) tuples spanning
    counts from 1 to the largest observed - which a second implementation
    re-derives in microseconds and which no existing conformance vector set is
    known to contain. That is an artifact, not a verdict.

    NOT A BREAK. No signature is forged, no key is recovered, every object is
    produced by a party holding sk, and nothing is asserted about MLWE, MSIS or
    SelfTargetMSIS in any direction.

  mechanism: >-
    (1) WHY THIS OBJECT IS NEW TO THE LANE, STATED AGAINST THE TWELVE. The filed
    proposals track the four rejection predicates and their firing rates
    (031ce2, bb52fa, 4f83f6, 60ba98, 6d1b97), the t0 channel and its price
    (630606, 6109f8, 65739b, 71fc18), the signature byte fibre (e5f947), and the
    testing and deployment volumes that would exercise them (8f3496, fa04dc).
    Every one of them studies what happens INSIDE an attempt, or how many
    signatures an observer needs. The tracked object here is the LOOP ITSELF -
    the attempt count as an integer-valued random variable, followed from the
    key through the loop to a public failure indicator. IDEA-20260821-60ba98
    comes closest because its identity applies, but it applies with the
    conditioning direction reversed and it never forms the attempt count as an
    object; its own confounder list treats the attempt counter only as a
    nuisance that decouples two signers' streams. Here the nuisance is the
    subject.

    (2) THE LOSSY PROJECTION. The projection sends the entire signing state - key,
    message, every mask, every intermediate polynomial - to a single non-negative
    integer, the number of attempts. The fibre over any observed value is
    astronomically large; nothing reconstructs anything about the key or the
    message from it. The discard is COMPATIBLE with the target's operations
    because the loop's one-step propagation is exactly a Bernoulli trial with
    the acceptance probability as its parameter, so the integer propagates
    deterministically under the loop's own semantics without needing anything
    that was discarded. THE MIRROR FAILURE - a projection so lossy it is
    constant across instances - was checked and does NOT occur: the attempt
    count is geometric with mean 4.25 / 5.1 / 3.85 and standard deviation about
    3.8 / 4.6 / 3.4, so it has real spread, and a measured spread near zero is
    the pre-registered tell of a broken instrument. Note that this is the one
    place the projection could still be worthless in the way that matters: if
    its PARAMETER is constant across keys, then the object separates parameter
    sets but not keys, and deciding that is precisely hypothesis E1 against E2
    rather than an assumption of the design.

    (3) THE EXACT KEY-INDEPENDENCE LEMMA, DERIVED. Per coefficient, z_j = y_j +
    a_j with y_j uniform on the 2 gamma1 integers and a_j = (c s1)_j satisfying
    |a_j| <= beta = tau eta. The acceptance condition is |z_j| < gamma1 - beta.
    The set of y_j giving acceptance is an interval of length exactly
    2(gamma1 - beta) - 1 translated by -a_j, and because |a_j| <= beta that
    translated interval lies entirely inside the support of y_j. Its cardinality
    is therefore independent of a_j, hence of the key and of the challenge. This
    is the reason the scheme's uniformity argument works at all, and it makes
    the z-factor of the acceptance probability EXACTLY
    ((2(gamma1 - beta) - 1)/(2 gamma1))^(256 l) for every conforming key. The
    low-part factor is NOT exact by the same argument, because the low part of
    w - c s2 is a shift within a bucket structure rather than within a
    box, and whether the shift is measure-preserving depends on the low part of
    w being uniform - which is heuristic H1 below. SO THE DERIVATION PREDICTS
    THAT ANY MEASURED KEY-DEPENDENCE MUST SIT IN THE LOW-PART FACTOR, and the
    factorised arm tests exactly that prediction rather than merely reporting a
    dispersion.

    (4) THE POSITIVE CONTROL, WHICH IS FORCED BY THE SAME LEMMA AND MUST FIRE.
    The lemma's hypothesis is |c s1| <= beta. An OUT-OF-RANGE private key breaks
    it - IDEA-20260829-a2b5d7 derives that the decodable envelope is 195 / 539 /
    300 against beta = 78 / 196 / 120 - so for such a key the translated
    acceptance interval no longer lies inside the support, the z-factor DROPS,
    and the mean attempt count MUST rise. That gives this design a positive
    control with a derived direction and a shared object with a sibling
    proposal: if the dispersion instrument cannot see the elevated attempt count
    of an out-of-range key, it cannot see anything, and no key-independence
    verdict from it is reportable. A dispersion statistic that has never been
    shown to move is not a measurement of key-independence.

    (5) WHY THE CAP IS THE RIGHT NON-CONFORMANCE TO STUDY AND NOT A STRAW MAN.
    The IETF security-considerations draft cited below states, in terms, that
    implementations should not impose a fixed upper bound on signing loop
    iterations, that an artificially low limit could cause signing to fail for
    valid keys under normal operation, and that in deterministic mode it could
    introduce a detectable failure mode that leaks information about the signing
    key. That is a published, retrieved statement that the object exists and
    that its consequence is UNQUANTIFIED - the draft says "could" and gives no
    rate, no key-dependence measurement, and no threshold. This record supplies
    the numbers, and its E1 outcome would partially contradict the draft's
    warning while its E2 outcome would substantiate it. Both directions are
    reportable and neither is presupposed.

    (6) THE THREE ARMS AND WHAT EACH DECIDES. ARM 1, THE TAIL LAW: measure the
    attempt-count distribution over 10^4 signatures per parameter set against
    the geometric law, including the upper tail, which is what a cap actually
    interacts with. ARM 2, THE DISPERSION: 64 keys per parameter set, mean
    attempt count per key, compared against the sampling floor derived from the
    per-key sample size. ARM 3, THE FACTORISATION: instrument the signer to
    record which factor rejected each attempt, so that any dispersion found in
    ARM 2 is attributed to the z-factor (which the lemma forbids) or to the
    low-part factor (which the lemma permits). A dispersion attributed to the
    z-factor falsifies the lemma and is the most interesting outcome available.

  novelty_status: unverified

  citations:
    - ref: >-
        draft-connolly-cfrg-ml-dsa-security-considerations-02, IETF
        Internet-Draft, section 3.2.6.2 (Signing Loop Bounds)
      provenance: retrieved
      claim: >-
        "To remain FIPS 204 compliant, implementations should not impose a fixed
        upper bound on the number of signing loop iterations", and an
        artificially low limit "could cause signing to fail for valid keys under
        normal operation, and in deterministic mode could introduce a detectable
        failure mode that leaks information about the signing key." THE CLAIM IS
        QUALITATIVE - no rate, no key-dependence measurement, no threshold, and
