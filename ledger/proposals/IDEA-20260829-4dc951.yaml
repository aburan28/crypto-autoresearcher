  assumptions:
    - >-
      That the mask counter is two bytes and advances by l per attempt. If it is
      four bytes or unbounded, claim (B) is withdrawn in full; the tail law, the
      dispersion measurement and the artifact are unaffected. Stage 0 is the
      gate and this is the record's single most likely failure.
    - >-
      That an implementation can be instrumented to report its attempt count and
      the identity of the rejecting factor without altering the distribution it
      samples. An instrumentation that reseeds or reorders is not measuring the
      same loop.
    - >-
      That the deterministic mode is available, since the artifact in claim (E)
      is meaningless without it. In hedged mode the attempt count is a random
      variable rather than a function of (sk, M) and the vector set cannot be
      built.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the exact
      key-independence of the z-factor. Everything downstream - the geometric
      tail, the identity, the cap arithmetic - is bookkeeping. The bottleneck is
      therefore the containment of the translated acceptance interval inside the
      mask support, and the only mechanism that breaks it is |c s1| exceeding
      beta, which is impossible for a conforming key and forced for an
      out-of-range one.
    baseline_embedding:
      parameter_slice: >-
        The old-method boundary is kappa_max = infinity, where p_fail = 0, the
        capped signer is bit-for-bit the conforming signer, and every statement
        here must reduce to the known expected-repetition figures 4.25 / 5.1 /
        3.85. The other boundary is kappa_max = 1, where p_fail = 1 - 1/R =
        0.765 / 0.804 / 0.740 - the same three numbers IDEA-20260821-60ba98
        pre-registers for its own positive arm, which is a free cross-check
        between two independently motivated designs.
      reproduction_check: >-
        Symbolic: substitute kappa_max = infinity and check TV = 0 and byte
        equality of transcripts on a frozen fixture of 10^3 (key, message)
        pairs. Numeric: the measured mean attempt count must reproduce Table 1's
        Repetitions column to within the +0.35 to +1.1 per cent same-sign
        residual IDEA-20260805-bb52fa records.
    observation_collision:
      observable: >-
        The certificate is the triple (attempt-count histogram, across-key mean
        dispersion, rejecting-factor attribution).
      distinct_preimage_search: >-
        Two distinct ground-truth situations with the same observable were
        searched for and one was found: (i) a genuinely key-independent
        acceptance probability, and (ii) a key-dependent one whose dispersion is
        below the sampling floor at the executed per-key sample size. BOTH
        RETURN "consistent with the floor". The separator is not more keys but
        more DEPTH per key, so the design fixes the per-key sample size from a
        pre-computed power calculation and reports the smallest dispersion it
        could have detected, rather than reporting "no dispersion found".
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the FACTORISED acceptance probability - the z-factor and the
          low-part factor separately - through the loop rather than the scalar
          acceptance probability. The stronger state is what makes a measured
          dispersion attributable rather than merely present.
        predicted_gain: >-
          Converts "the attempt count varies across keys" into "the variation
          sits in the factor the lemma permits it to sit in, or it does not",
          which is a falsification of a derived lemma rather than a descriptive
          statistic.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the family from conforming keys to keys with a declared excess
          above eta, and prove the strict inward statement - that the z-factor
          is exactly constant on the excess-0 slice and strictly decreasing in
          the excess - rather than merely that some keys differ.
        predicted_gain: >-
          Supplies the positive control with a derived direction and magnitude,
          so a null dispersion result on conforming keys is backed by a
          demonstrated ability to detect a non-null one.
    quantifier_order: >-
      FOR ALL parameter sets, FOR ALL keys sk produced by KeyGen, FOR ALL
      challenges c in B_tau and FOR ALL coefficient indices j, the number of
      mask values giving z-norm acceptance is exactly 2(gamma1 - beta) - 1 -
      note that this is a FOR ALL and not an expectation, which is what makes
      the lemma exact. THEN, and only conditionally on heuristic H1, THERE
      EXISTS a single acceptance probability per parameter set such that FOR ALL
      keys the attempt count is geometric with that parameter. The record's
      whole discrimination is whether the second, weaker quantifier order holds
      empirically; the first is proved.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is the law of the attempt
        count and its dependence on the key, and hence the rate and the
        key-dependence of a capped signer's failure indicator. It cannot certify
        that no other channel carries key information, it cannot certify
        anything about timing or power observation of the loop - that is
        GOAL-MLDSA-001's territory and the boundary is stated rather than
        assumed - and it cannot certify that a cap is safe.
      nearby_object_control: >-
        The nearby object where the hoped-for key-independence fails is an
        out-of-range key, where the lemma's hypothesis is violated by
        construction and the mean attempt count must rise. A method that could
        not distinguish that key from a conforming one has not identified the
        load-bearing structure, and that is exactly the mandatory positive
        control.
    proof_obligations:
      - claim: "the z-factor acceptance count is exactly 2(gamma1 - beta) - 1 for every conforming key and challenge"
        responsibility: correctness
      - claim: "the implicit ceiling is 65536/l attempts and is reached with probability below 10^-1222"
        responsibility: size
      - claim: "TV(D_cap, D_conf) = p_fail exactly, by the reversed conditioning identity"
        responsibility: correctness
      - claim: "the dispersion instrument detects the elevated attempt count of an out-of-range key"
        responsibility: interface
      - claim: "the measured mean attempt count reproduces 4.25 / 5.1 / 3.85 within the recorded residual"
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        implicit attempt ceiling 65536/l and its exhaustion probability
        (1 - 1/R)^ceiling, at each parameter set
      direction: different
      minimum_effect: >-
        FORCED VALUES DERIVED BEFORE ANY RUN - ceilings 16384 / 13107 / 9362 and
