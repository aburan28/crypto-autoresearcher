        mask counter is not two bytes these are withdrawn in full rather than
        rescaled, and the record says so.
    - metric: >-
        p_fail(kappa_max) at ML-DSA-44 for kappa_max in {5, 10, 20, 40, 80},
        measured over 10^5 signing operations
      direction: lower
      minimum_effect: >-
        FORCED VALUES 0.2615 / 0.0684 / 4.68e-3 / 2.19e-5 / 4.79e-10, monotone
        decreasing, with the first three measurable at 10^5 operations and the
        last two reported as upper bounds with their sample size. A measured
        curve that is not monotone falsifies the geometric law and no signed
        statement about any cap is then made.
    - metric: >-
        mean attempt count per parameter set over 10^4 signatures, against
        FIPS 204's Repetitions column
      direction: different
      minimum_effect: >-
        4.25 / 5.1 / 3.85 with a tolerance band admitting
        IDEA-20260805-bb52fa's +0.35 to +1.1 per cent same-sign residual. A
        measurement outside that band means the instrument is not measuring the
        loop and every other arm is unreadable.
    - metric: >-
        across-key dispersion of the mean attempt count over 64 conforming keys
        per parameter set, expressed as the ratio of the observed variance to
        the sampling floor
      direction: different
      minimum_effect: >-
        The E1/E2 split is pre-registered at a variance ratio of 1.5 with a
        bootstrap interval excluding 1.0. The design must ALSO report the
        smallest dispersion it could have detected at the executed per-key
        sample size; a null reported without that number is not a null.
    - metric: >-
        mean attempt count for an OUT-OF-RANGE key against a conforming key at
        the same parameter set
      direction: higher
      minimum_effect: >-
        Strictly higher, by a margin the boundary-lift derivation fixes in
        advance from the excess. IF THIS DOES NOT RISE, THE INSTRUMENT CANNOT
        SEE KEY-DEPENDENCE AT ALL AND THE E1 VERDICT IS NOT REPORTABLE. This is
        the mandatory positive control.
    - metric: >-
        fraction of any measured across-key dispersion attributable to the
        z-factor rather than the low-part factor
      direction: lower
      minimum_effect: >-
        FORCED VALUE 0 by the exact lemma. Any dispersion attributed to the
        z-factor beyond its sampling floor falsifies the lemma, which would be
        far more interesting than the dispersion itself, and deciding whether
        the lemma or the instrumentation is at fault comes before anything else
        is written.

  minimal_test:
    design: >-
      FOUR STAGES, CHEAPEST FIRST, EACH ABLE TO TERMINATE THE LINE.
      STAGE 0 (reading, zero compute, TERMINATING). Re-obtain FIPS 204 under a
      run record; read verbatim, with pages, the signing loop and its absence of
      an iteration bound, the mask expansion counter's byte width and increment,
      Table 1's l and Repetitions columns. If the counter is not two bytes,
      claim (B) is withdrawn and the batch reports that before anything runs.
      STAGE 1 (algebra, zero compute, TERMINATING). Derive the exact
      key-independence lemma for the z-factor symbolically; derive the ceilings
      and exhaustion probabilities; derive the reversed conditioning identity.
      If the lemma does not hold as stated, STOP and restate the discrimination.
      STAGE 2 (the tail law and the cap curve, minutes). Instrument a
      pure-Python ML-DSA on hashlib SHAKE to report the attempt count and the
      rejecting factor per attempt. Emit 10^4 signatures per parameter set;
      report the attempt-count histogram against the geometric law with a
      chi-square over the first 20 bins and a separate upper-tail check; compute
      p_fail at the five caps by post-hoc thresholding of the SAME run, so the
      cap curve costs no additional compute.
      STAGE 3 (dispersion and artifact, under an hour). 64 conforming keys per
      parameter set at a per-key sample size fixed by a pre-run power
      calculation; the out-of-range positive-control key; the factorised
      attribution. Emit the deterministic attempt-count test-vector set and
      re-derive every tuple under a second, independently written
      implementation.
      WHAT DISCRIMINATES. Stage 1 decides whether the lemma exists at all, at
      zero cost. Stage 2 separates "the loop is geometric" from "the loop has a
      heavier tail than the standard's expected value suggests", which is
      exactly what a cap interacts with and which the Repetitions column cannot
      answer. Stage 3 separates E1 from E2 with a stated detection floor and a
      positive control that has been shown to move.
    controls:
      - >-
        POSITIVE CONTROL, MANDATORY, MUST FIRE - the out-of-range key's mean
        attempt count must exceed the conforming one. A dispersion instrument
        that cannot see the one key-dependence that is derived to exist has not
        been shown to fire, and its E1 verdict is void.
      - >-
        SECOND POSITIVE CONTROL WITH A DERIVED VALUE - a signer with kappa_max =
        1, whose p_fail is forced to 1 - 1/R = 0.765 / 0.804 / 0.740. The same
        three numbers IDEA-20260821-60ba98 pre-registers, obtained through a
        different design, so a mismatch is informative about both.
      - >-
        CONFORMING NULL, RUN AND COMMITTED FIRST - an uncapped signer, whose
        p_fail must be exactly 0 and whose transcripts must be byte-identical to
        a second uncapped run at the same seed in deterministic mode.
      - >-
        GRADED CONTROL, FIVE POINTS, MONOTONICITY REPORTED - the cap sweep over
        {5, 10, 20, 40, 80} spans nine orders of magnitude in p_fail and must be
        monotone. A curve that does not decay as the cap rises is the canonical
        artifact tell.
      - >-
        FACTORISED ATTRIBUTION as a structural control - any dispersion must
        localise to the low-part factor. A dispersion in the z-factor is a
        falsification of the derived lemma and halts interpretation.
      - >-
        SECOND INDEPENDENT IMPLEMENTATION for every attempt-count vector. An
        attempt count reproduced only by the implementation that produced it is
        not a test vector.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE - record that no prior record in this corpus
        forms the attempt count as an object, as an ABSENCE and not a passed
        check, and record the IETF draft's signing-loop-bounds paragraph beside
        it as the nearest external prior art.
    required_metrics:
      - the signing loop, the absence of an iteration bound, and the mask counter width quoted verbatim with pages and a fetch receipt
      - the three ceilings and three exhaustion probabilities as exact rationals and floats
      - attempt-count histogram per parameter set with seeds, chi-square against the geometric law, and a separate upper-tail statistic
      - measured mean attempt count against 4.25 / 5.1 / 3.85 with the residual band
      - p_fail at five caps with Clopper-Pearson intervals, zero counts as upper bounds with sample size
      - across-key variance ratio over 64 keys with a bootstrap interval AND the smallest detectable dispersion
      - out-of-range positive-control mean attempt count beside the conforming one
      - rejecting-factor attribution per parameter set
      - the deterministic attempt-count test-vector set with two independent implementations' agreement

  falsification_conditions:
    - >-
      The mask counter is not two bytes or does not advance by l. Claim (B) is
      withdrawn in full; the record is superseded for that part and the
      remaining arms proceed unchanged.
    - >-
      The exact key-independence lemma fails on re-derivation. The whole
      discrimination is restated before any measurement is interpreted.
    - >-
      The measured mean attempt count misses 4.25 / 5.1 / 3.85 outside the
      recorded residual band. The instrument is not measuring the loop; nothing
      else is readable.
    - >-
      The out-of-range positive control does not raise the mean attempt count.
      The dispersion instrument has no demonstrated power; the E1 verdict is not
      reportable and the outcome is an instrument statement under AGENTS.md
      rule 3.
    - >-
      The cap sweep is non-monotone in kappa_max. The geometric law is wrong as
      applied and no signed statement about any cap is made.
    - >-
      The two independent implementations disagree on any attempt count in
      deterministic mode. That is a conformance finding about one of them and it
      halts the artifact until resolved - and it would be a more valuable
      outcome than the dispersion measurement.

  confounders:
    - >-
      A NULL IS COMFORTABLE AND CHEAP. "The attempt count is key-independent" is
      the conclusion this design would produce most easily, it is what the exact
      lemma half-predicts, and it is the conclusion a defender wants. The
      out-of-range positive control and the stated detection floor exist to make
      that conclusion cost something.
    - >-
      INSTRUMENTATION CHANGES THE LOOP. A signer modified to report its attempt
      count may reseed, reorder, or short-circuit. The conforming null's
      byte-identity check in deterministic mode is what catches this.
    - >-
      PURE-PYTHON SCALE. 10^4 signatures per parameter set is what the budget
      buys, which puts the smallest measurable p_fail at about 3e-4 and makes
      the kappa_max = 40 and 80 rows bounds rather than measurements. That is
      declared in advance rather than discovered.
    - >-
      DETERMINISTIC AND HEDGED MODES ARE DIFFERENT OBJECTS. The artifact needs
      deterministic mode; the dispersion measurement is cleanest in hedged mode
      where attempts are independent across queries. Reporting a number from one
      mode as if it held in the other is the specific error to avoid, and every
      metric carries its mode.
    - >-
      SELF-CONSISTENCY IS NOT INDEPENDENCE. The forced values 0.765 / 0.804 /
      0.740 and the Repetitions column come from one reading of one document,
      which IDEA-20260805-bb52fa records as carrying a same-sign residual
      against its own recomputation. Agreement with them is one reading
      confirmed, not two.

  interpretation_limits:
    - >-
      NOT A BREAK, NOT A FORGERY, NOT A VULNERABILITY REPORT. Every object is
      emitted by a party holding sk. Nothing bears on MLWE, MSIS or
      SelfTargetMSIS in any direction and any downstream sentence readable as
      such is defective regardless of what was measured.
    - >-
      THE SPECIFICATION CLAIM AND THE MATHEMATICAL CLAIM ARE SEPARATE. "FIPS 204
      states an expected repetition count and no tail bound" is checkable by
      reading. "The attempt count is geometric with that mean" is checkable by
      derivation and measurement. Neither licenses "the standard is wrong", and
      the implicit ceiling in claim (B) is a consequence of an encoding width,
      not a defect.
    - >-
      The bound covers an observer of SIGNATURES and of SIGNING FAILURES. It
      says nothing about timing, power, EM or memory observation of the loop,
      where the attempt count is plainly visible; that is GOAL-MLDSA-001's
      territory and the boundary is stated rather than assumed.
    - >-
      An E1 result does NOT license "capping the signing loop is safe". It
      licenses only that the failure indicator carries no key-dependence
      detectable at the executed sensitivity, which is a bounded statement with
      a number attached.
    - >-
      The IETF draft is a draft and its section numbering may change; it is
      cited for its retrieved text, not as a normative authority, and no
      statement here is a criticism of it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The coefficients of LowBits(w) with w = A y and y drawn fresh by the
        mask expansion at each attempt behave as independent uniforms on the
        2 gamma2 integers, so that the low-part acceptance factor is
        ((2(gamma2 - beta) - 1)/(2 gamma2))^(256 k) independently of the key.
        LOAD-BEARING ONLY FOR THE PREDICTION THAT E1 HOLDS; the exact
        key-independence of the z-factor needs no distributional assumption at
        all, and the discrimination between E1 and E2 is precisely a test of
        this assumption.
      rigorous_support: >-
        The rigorous half, carried over from IDEA-20260805-bb52fa: reduction of
        a uniform element of Z_q modulo a bucket width is uniform up to a
        1/1023 excess at a single class, because q - 1 = 1023 * 8192, and that
        excess sits at the centre. The classical statement imitated is that a
        linear image of a uniform mask is uniform modulo a fixed modulus. NOT
        PROVED - that A y is close enough to uniform, which the usual argument
        derives from an assumption this question is forbidden to touch and which
        is therefore NOT invoked; and the independence across the 256k
        coefficients, which is a second unproved part.
      validation_plan: >-
        Directly measured, at the scale where it is used, by the same run that
        produces everything else. Compare the measured mean attempt count
        against the closed-form product of the two factors at each parameter
        set, and compare the measured low-part rejection rate against
        IDEA-20260805-031ce2's pre-registered 0.570 / 0.684 / 0.610. Tail check:
        the attempt-count upper tail against the geometric quantile at
        1 - 1/(10^4), which is where a cap would actually bite and where a
        dependence between coefficients would first show. Sampled parameters -
        10^4 signatures per set, 64 keys, deterministic and hedged modes both
        recorded. No transfer or extrapolation is claimed to other parameter
        sets.
    - id: H2
      statement: >-
        Signing attempts are independent Bernoulli trials given the key, so the
        attempt count is geometric and p_fail(kappa_max) = (1 - 1/R)^kappa_max.
        This requires the mask to be freshly and independently drawn at each
        attempt, which holds in hedged mode by construction and holds in
        deterministic mode only in the sense that distinct counter values give
        outputs modelled as independent.
      rigorous_support: >-
        The geometric law for independent trials is exact; what is assumed is
        the independence of mask expansions across counter values, which imitates
        the classical assumption that a hash-based expander's outputs at distinct
        inputs are independent uniforms.
      validation_plan: >-
        Chi-square of the attempt-count histogram against the geometric law over
        the first 20 bins at 10^4 signatures per parameter set, plus a run test
        on the sequence of attempt counts to detect serial correlation, plus a
        separate check of the upper tail at the 1 - 1/(10^4) quantile. A
        measured tail heavier than geometric would mean p_fail at the larger
        caps is UNDERSTATED, which is the direction that matters, and it is
        reported as such rather than absorbed.

  target_complexity:
    time_exponent: >-
      NO EXPONENT OF ANY HARD PROBLEM IS MOVED AND NONE IS CLAIMED. This is a
      structural derivation plus a rate and dispersion measurement about a
      fielded standard. The quantities here with exponent-like character are the
      exhaustion probability of the implicit ceiling, 10^-1908.6 at ML-DSA-44,
      and the cap curve p_fail = (1 - 1/R)^kappa_max, which falls exponentially
      in the cap with rate ln(R/(R-1)) = 0.268 / 0.218 / 0.301 per attempt.
      Measurement cost is about 3e4 signatures for Stage 2 plus 64 keys times a
      power-determined per-key sample for Stage 3.
    memory_exponent: >-
      Negligible. The statistic is one integer counter per attempt plus a
      64-key table; peak working set under 100 MB with transcripts retained.
    best_known: >-
      IN CORPUS - nothing forms the attempt count as an object;
      IDEA-20260821-60ba98 supplies the identity in the opposite conditioning
      direction and treats the counter only as a nuisance. EXTERNAL - the IETF
      security-considerations draft states the object and its risk
      qualitatively and gives no number; whether any published work measures the
      attempt-count law's key-dependence is UNKNOWN, was not searched
      exhaustively this session, and is the most likely route to domination.
    hidden_overhead: >-
      The honest overhead is that claim (B) rests entirely on a recalled encoding
      width, so the headline ceiling is a prediction and not a result until Stage
      0 runs. The second is that the dispersion arm's null is only as strong as
      its power calculation, and a null reported without the smallest detectable
      dispersion is worthless however many keys were run.
    tradeoff_note: >-
      The trade is budget rather than time against memory. The cap curve is
      obtained by post-hoc thresholding of a single attempt-count log, so five
      cap values cost the same as one; the dispersion arm's only real lever is
      keys against depth per key, and the design fixes that split by a power
      calculation rather than by a round number. Every arm is embarrassingly
      parallel across keys and messages.

  dominated_by: >-
    n/a (no attack, no cost triple, no Pareto point claimed). ROWS ACTUALLY
    CHECKED BEFORE WRITING. (i) All twelve RQ-MLDSA-ffa0f5 proposals, read in
    full or in large part this session; none forms the attempt count as a
    tracked object, and IDEA-20260821-60ba98 - the nearest - explicitly treats
    the counter as a confounder rather than a subject. (ii) The sibling
    RQ-MLDSA-001, which owns hedged versus deterministic mode as an
    ATTACKER-MODEL distinction and the fault-proof boundary; this record makes
    no attacker-model taxonomy claim and injects no fault, and any batch that
    finds itself doing either must hand off. (iii) Targeted greps over
    ledger/proposals for the mask expansion function and iteration bounds, which
    return only 60ba98's confounder paragraph and unrelated records. (iv) The
    three cost axes - TIME (about 3e4 signatures plus a power-sized key sweep,
    against the 10^9 a direct ct0 rate measurement would need), MEMORY
    (negligible), DATA/QUERIES (all queries under a key the auditor holds).
    NOT CHECKED, AND SAID SO - the published implementation-security literature
    on rejection-sampling loop behaviour, which was not searched exhaustively;
    if a published measurement of the attempt-count law's key-dependence exists,
    this record's Stage 3 is dominated and its contribution reduces to the
    ceiling derivation and the test-vector artifact.
  sota_delta: >-
    no attack; structural and measurement contribution only. It supplies (a) an
    implicit attempt ceiling of 16384 / 13107 / 9362 with an exhaustion
    probability of 10^-1908.6 / 10^-1242.2 / 10^-1222.9, neither of which the
    standard states; (b) an exact key-independence lemma for the z-norm
    acceptance count that the corpus does not contain; (c) a cap curve turning
    the IETF draft's "could introduce a detectable failure mode" into
    0.2615 / 0.0684 / 4.68e-3 / 2.19e-5 / 4.79e-10 at five named caps; and
    (d) a portable deterministic attempt-count test-vector class that no known
    conformance vector set contains. Against the external state of the art the
    delta is quantification of a published qualitative warning, not an
    improvement to any algorithm, and no exponent of any hard problem moves.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    BY PART. (i) That the exact key-independence lemma for the z-factor survives
    independent re-derivation, about 0.9 - it is a counting argument about a
    translated interval and it is the reason the scheme's uniformity argument
    works, so it is likely folklore among implementers rather than new. (ii)
    That the two-byte mask counter is confirmed and the ceilings stand, about
    0.7 - this is recalled and not read, and it is the record's single most
    likely failure. (iii) That the measured mean attempt count reproduces
    4.25 / 5.1 / 3.85 within the recorded residual, about 0.85. (iv) That the
    out-of-range positive control raises the attempt count as derived, about
    0.85, limited by whether IDEA-20260829-a2b5d7's envelope arithmetic holds.
    (v) That the outcome is E1 rather than E2, about 0.7 - the exact lemma
    covers one of two factors and the other is only heuristically
    key-independent, so E2 is a live and reportable possibility rather than a
    formality.
