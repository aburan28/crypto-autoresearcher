        predicted_gain: >-
          Converts the special-curve prior at m >= 5 from an open sentence
          into one ladder slope per arm with a pre-registered null.
      - transform: specialization_pack
        proposed_object: >-
          The weight grading deg(x, a, b) = (1, 2, 3) as the resource measure
