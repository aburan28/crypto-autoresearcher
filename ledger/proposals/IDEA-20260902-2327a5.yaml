  proof_search_map:
    bottleneck: >-
      The per-target decomposition solve at arity m >= 4, whose exponent sigma
      is the single free parameter of IDEA-20260808-812554; everything else
      (yield, relation count, linear algebra) is pinned by KN-FIND-007 and the
      sparse-solve charge.
    baseline_embedding:
      parameter_slice: >-
        m = 3 on a generic curve with the chained membership-adjoined system,
        which must reproduce EV-R6-001's d_reg median 2 and its solve-cost
        slope of about 6 to 7 in F (sigma about 3 to 3.5) on the new engine
        within the engine's own constant; and the exhaustive arm must show
        slope m - 1 exactly at every m.
      reproduction_check: >-
        Frozen fixture at p = 4001, m = 3, B in {12, 14, 16}: the exhaustive
        arm's operation count equals the closed-form (2B)^2/2 lookups within
        1 percent, and the F4 arm's cost ratio against Singular's recorded
        gb_median_s (1.41, 4.15, 8.66 s) is a constant across the three B
        within a factor 2 (engine constant), otherwise the new engine is not
        measuring the same object.
    observation_collision:
      observable: >-
        The pair (specialised support set, fitted sigma) per arm.
      distinct_preimage_search: >-
        PERFORMED AND PREDICTED TO COLLIDE: by (S3) the crater, the floor, the
        sham and the unmatched random curve all have the SAME specialised
        support at every m >= 3, so support cannot separate them; (S4)
        predicts they also collide on sigma. That collision IS E1. The
        separating condition, if E2 held, is a coefficient-value invariant
