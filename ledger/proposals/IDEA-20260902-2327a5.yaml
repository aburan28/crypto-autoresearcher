  object_first_candidate:
    tracked_object: >-
      The specialised summation system (S_{m+1}(x_1..x_m, x_R), f_V(x_i))
      projected to its (support, solver exponent) pair on the j-line.
    lossiness: >-
      Genuinely lossy: the projection forgets the coefficient values, the
      curve, the target and the base; by (S3) it even forgets j for every
      m >= 3 on the support coordinate. It is compatible with the operations
      of the target in the required sense: specialisation and the diagonal
      scaling act on the support deterministically (the residue argument),
      and the solver exponent is a functional of the ideal alone.
    propagation: >-
      Deterministic under x_n := x_R (residue coverage) and under the diagonal
      mu_3 action (relation transport). Not a propagation through the group
      law, and none is claimed; this is a measurement object, not an attack
      object.
    survival_score: >-
      Survives as a theorem at every arity; dies as a lever at m >= 3 because
      the retained part (support) is j-independent, leaving coefficient
      values, which this record measures rather than models.

