idea:
  id: IDEA-20260902-2327a5
  question_id: RQ-ECDLP-002
  added: '2026-09-02'
  title: >-
    ARITY m >= 5 ON A SPECIAL-CURVE PANEL, COSTED BEFORE IT IS RUN: the sixth
    summation polynomial has per-variable degree 16, weight 80 and at most
    17^6 = 24137569 monomial slots (at most 17^5 = 1419857 after x_6 := x_R),
    the exhaustive V^{m-1} baseline needs NO summation polynomial at all
    (enumerate B^{m-1} signed sums, close with one hash lookup), and a
    zero-compute residue argument shows that every special-j support
    confinement of S_{m+1} is destroyed by the specialisation x_{m+1} := x_R
    for every m >= 3 -- so the panel's only conceivable solver lever at m >= 5
    is a coefficient-value effect, and the discriminating measurement is the
    solver exponent sigma on a B-ladder at m in {4, 5} inside the one isogeny
    class this corpus owns where a j = 0 crater and 36 generic floor curves
    share p, N, t and D_0
  class: control

  claim: >-
    Setting: E/F_p ordinary, p > 3, G a subgroup of prime order N, factor base
    V a set of B on-curve x-coordinates, decomposition arity m (m summands),
    solver cost T_solve(B) = B^{(m-1) sigma} per target as in
    IDEA-20260808-812554, so that sigma = 1 is the exhaustive baseline and the
    admission gate is sigma < 1 - 2/(m-1) together with B < N^{1/4}. Five
    statements, the first three derived here at zero compute.

    (S1) WRITE-DOWN COST OF S_6 AND S_7. By KN-TECH-002, deg_{x_i} S_n =
    2^{n-2}, so S_6 has per-variable degree 16 in six variables and S_7 has
    per-variable degree 32 in seven. The monomial slot count is at most
    17^6 = 24137569 for S_6 and 33^7 about 4.26e10 for S_7. Under the grading
    deg x_i = 1, deg a = 2, deg b = 3 every S_n is weighted-homogeneous of
    weight W_n = (n-1) 2^{n-2} (derived in (S3) below: W_3 = 4, W_4 = 12,
    W_5 = 32, W_6 = 80, W_7 = 192), so the total x-degree of any monomial is
    at most W_n, which prunes nothing at the 17^6 level because 6 * 16 = 96 >
    80 only trims the top corner. At fixed (a, b, p) the resultant
    Res_t(S_4(x1,x2,x3,t), S_4(x4,x5,x6,t)) is an 8 x 8 Sylvester determinant
    with entries of per-variable degree at most 4; by evaluation and
    interpolation it costs about 17^6 determinant evaluations, i.e. of order
    10^9 field operations and about 100 MB at 32-bit coefficients: FEASIBLE at
    toy p as a one-off, but the specialised S_6(x1..x5, x_R) carries up to
    17^5 = 1419857 coefficients PER TARGET. S_7 is out of reach of any dense
    representation (4e10 slots). The chained formulation of EV-R6-001 --
    S_3(x1,x2,t1), S_3(t1,x3,t2), ..., S_3(t_{m-2},x_m,x_R) with m-2 auxiliary
    unknowns -- never writes S_{m+1} and is the only representation this record
    admits at m >= 5; its price is m - 2 unconstrained variables, which is the
    reason the R6 instrument (Singular) was killed at m = 4, F = 6 after 300 s.

    (S2) THE EXHAUSTIVE V^{m-1} BASELINE, WHICH NEEDS NO POLYNOMIAL. Lift V to
    signed points; enumerate the (2B)^{m-1}/(m-1)! signed (m-1)-multisets;
    for each, compute R minus the partial sum and test its x-coordinate
    against a hash set of V. Cost Theta(B^{m-1}) group operations with
    O(B) memory, sigma = 1 by definition, and it is the only solver in this
    record known to run at m = 5 at every toy size: at N about 2^20 and
    B = N^{1/5} = 16 it is 6.5e4 additions per target; at N about 2^30,
    B = 64, it is 1.7e7. Every sigma reported by this record is the log-log
    slope of a solver's per-target cost against this baseline on the SAME
    targets, never a wall clock alone.

    (S3) THE ARITY-UNIFORM SUPPORT THEOREM (resolves the open question of
    H-JINV-0e8819 in the negative and extends it to all m). With deg x_i = 1,
    deg a = 2, deg b = 3, S_3 is weighted-homogeneous of weight 4 (check the
    thirteen monomials of KN-TECH-002's S_3). For a resultant Res_t(f, g) with
    deg_t f = d_f, deg_t g = d_g and weights w_f, w_g, every term of the
    Sylvester determinant is a product of d_g coefficients of f and d_f
    coefficients of g whose t-indices sum to d_f d_g, hence the resultant is
    weighted-homogeneous of weight d_g w_f + d_f w_g - d_f d_g. Applying
    KN-TECH-002's recurrence gives W_4 = 2*4 + 2*4 - 4 = 12,
    W_5 = 4*4 + 2*12 - 8 = 32, W_6 = 4*12 + 4*12 - 16 = 80 (and the
    alternative split Res(S_3, S_5) gives 8*4 + 2*32 - 16 = 80, consistent),
    i.e. W_n = (n-1) 2^{n-2}. CONSEQUENCE AT j = 0 (a = 0, b of weight 3):
    every monomial of S_n has total x-degree congruent to W_n modulo 3, a
    single residue class -- this is the diagonal mu_3 relative invariance
    S_n(zeta x) = zeta^{W_n} S_n(x). CONSEQUENCE AT j = 1728 (b = 0, a of
    weight 2): total x-degree congruent to W_n mod 2, i.e. even for n >= 3.
    NOW SPECIALISE x_n := x_R. A monomial x_1^{e_1} ... x_{n-1}^{e_{n-1}} of
    the specialised polynomial collects every unspecialised monomial with the
    same (e_1..e_{n-1}) and any e_n in 0..2^{n-2}; the confinement fixes only
    e_1 + ... + e_n mod 3, so the residue of e_1 + ... + e_{n-1} is FREE as
    soon as e_n ranges over all three residues, i.e. 2^{n-2} >= 2, i.e.
    n >= 4 (m >= 3); for j = 1728 the parity is free as soon as 2^{n-2} >= 1,
    i.e. n >= 3 (m >= 2, which is exactly the nine-coefficient check of
    H-JINV-0e8819). So NO special-j confinement survives specialisation as a
    support restriction at any arity m >= 3; what survives is a grading of the
    COEFFICIENTS in x_R (the x_R-exponent of the coefficient of a given
    x-monomial lies in one residue class mod 3), and the identity
    S_n|_{a=0}(zeta x_1, ..., zeta x_{n-1}, zeta x_R) = zeta^{W_n} S_n|_{a=0},
    which says only that decompositions of R over V correspond to
    decompositions of phi(R) over zeta V -- the relation transport of
    IDEA-20260807-f8a045, worth the constant |Aut|/2 and nothing more.
    Support EQUALITY with the generic curve additionally needs that, for each
    (e_1..e_{n-1}) in the generic specialised support, some contributing
    unspecialised coefficient survives a = 0 (resp. b = 0); this is a finite
    symbolic check and is the cheap falsifier F1 below. The same residue
    argument applies verbatim to the a^3 + 8 b^2 = 0 locus of
    EV-ICINV-6b6264 (48 of 439 S_4 coefficients vanish): a specialised hole
    appears only if an entire e_4-fibre of the deleted block vanishes.

    (S4) WHAT THE PANEL CAN AND CANNOT OFFER AT m >= 5, DERIVED. (i) Class-
    number-one CM discriminants other than -3 and -4, rational 2-torsion and
    rational 3-torsion all have a b != 0, so by EV-ICINV-343679 and
    EV-ICINV-6b6264 they have the generic support (13 for S_3, 439 for S_4)
    and the generic Betti table, regularity, singular locus and elimination
    degree; their only channel is coefficient values. (ii) j = 0 and j = 1728
    have reduced UNSPECIALISED support and full SPECIALISED support by (S3);
    their only channels are coefficient values and the automorphism constant
    (rho: sqrt(|Aut|/2); index calculus: at most |Aut|/2 on relation count,
    (|Aut|/2)^2 on linear algebra, IDEA-20260807-f8a045). (iii) A solver that
    reduces modulo the membership ideal first sees, by the Chinese remainder
    argument of IDEA-20260829-bdca13 (recalled at excerpt level, opened for
    its first 120 lines), the evaluation vector of S_{m+1} on V^m, of length
    B^m > B^{m-1}: for such solvers sigma >= m/(m-1) > 1 on EVERY curve. The
    measured m = 3 Groebner cost of EV-R6-001 (about F^6 to F^7 against the
    exhaustive F^2) is sigma about 3, consistent with (iii) plus engine
    overhead. Therefore the pre-registered expectation for every Groebner arm
    is sigma >= 1 on every panel member.

    (S5) THE DISCRIMINATION. Two explanations of the user's prior at m >= 5:
    E1 (predicted) -- sigma is identical across the panel and the matched
    floor control within the ladder's confidence interval and is >= 1 for
    every algebraic solver, so no special curve makes the summation-polynomial
    method run faster in the exponent at m >= 5, and the automorphism constant
    is the whole effect; E2 -- some panel member shows sigma lower than its
    matched control by more than the pre-registered margin at two consecutive
    N, a coefficient-value effect that (S3) says cannot be a support effect and
    that must then be explained by reducibility or singular structure
    (IDEA-20260811-6034d0, IDEA-20260811-34f29d); E3 -- any arm reaches
    sigma < 1 - 2/(m-1), which routes to review-breakthrough handling and is
    not believed before an independent replication.

  mechanism: >-
    OBJECT-FIRST. The tracked object is the pair (specialised monomial
    support, per-target solver cost) as a function on the j-line at fixed
    (p, N, m, B). The families declared OFF-LIMITS as the primary lens: the
    unspecialised support count (H-JINV-0e8819, IDEA-20260807-477e40), the
    Newton polytope (IDEA-20260811-97e244), the invariant-coordinate
    reformulation (IDEA-20260807-1ea327, IDEA-20260807-5ddccf), the
    automorphism-quotient coordinate (IDEA-20260807-d329e2), and the
    |D_0|-density regression (IDEA-20260811-473c2e). What this record adds is
    the arity-uniform theorem (S3) and the exponent-level measurement at the
    arities where the gate of H-ICEX-9e54c2 is non-empty.

    STAGE 0 (zero compute, HARD GATE). Write (S1)-(S3) with the weight table
    W_n and the residue-coverage argument; verify W_4 = 12 against
    H-JINV-0e8819's independent derivation. Symbolically (seconds, sympy over
    Q[a, b]): compute the specialised support of S_4(x1, x2, x3, x_R) at a = 0,
    at b = 0 and at generic (a, b), and the same for S_5(x1..x4, x_R); report
    the support sets and their equality. Compute the specialised S_4 support
    at a^3 + 8 b^2 = 0. These are the falsifier F1 and cost minutes.

    STAGE 1 (instrument). The class of EV-JINV-a8c812 / IDEA-20260811-99cc67:
    N = 19507, t = 211, p = 19717, D = -3 * 107^2, one j = 0 crater with
    |Aut| = 6 and 36 floor curves with |Aut| = 2 at identical p, N, t and D_0
    (all numbers re-derived as gate 1, per IDEA-20260811-99cc67's own
    caveat; the crater count from the Hurwitz-Kronecker mass, not the class
    number). Arms: CRATER (j = 0), FLOOR (8 floor curves drawn by seed),
    RANDOM-OTHER-CLASS (8 curves at p = 19717 with N != 19507, the same-p
    unmatched control), and, for j = 1728, a second matched family found by
    Stage 1a: a prime N' that is a sum of two squares u^2 + f^2 with
    p' = N' + t' - 1 prime and t' = 2 + 2u, so that D = -4 f^2 and the class
    has a j = 1728 crater; the record predicts such N' exist near 2^14 and
    names their construction rather than a specific one. Class-number-one,
    2-torsion and 3-torsion arms are NOT run at m >= 4 because (S4)(i) fixes
    their support and geometry to generic; they are listed as forward
    guidance only.

    STAGE 2 (the ladder at m = 4, the first arity with a non-empty gate,
    sigma < 1/3). Solver arm: the chained membership-adjoined system in an
    F4 engine that is not sympy and not Singular (msolve or FGb; the R6
    Singular instrument is censored at m = 4, F = 6 and is not reused), at
    B in {6, 8, 10, 12, 16}, 20 targets per (curve, B) drawn with targets_B.
    Baseline arm: the exhaustive (S2) enumeration on the identical targets,
    charged in group operations. Report per arm the log-log slope of solver
    cost against B (sigma_GB times (m-1)), the slope of the exhaustive arm
    (must be m - 1 = 3 within 0.1: instrument calibration), and the ratio
    solver over exhaustive at every B. A cell whose F4 run exceeds the
    per-cell budget is CENSORED INFRASTRUCTURE STATE (AGENTS rule 5), never
    evidence.

    STAGE 3 (the ladder at m = 5, the corner's arity). Same design at
    B in {4, 6, 8, 12}, with the explicit expectation that the F4 arm may be
    censored at B = 8; if fewer than three B values complete on any arm, that
    arm reports NOT MEASURED, and the deliverable is the largest completed B
    per arm together with the exhaustive baseline, which always completes.

    STAGE 4 (decay and artifact tells). Any between-arm sigma difference must
    (a) persist at a second matched family and (b) be absent on the sham null
    of IDEA-20260811-18bbf9 built from a FLOOR curve's S_4 with the a-block
    deleted (which by (S3) has full specialised support and generic
    coefficient values elsewhere); a difference shared by the sham is a
    support-count artifact of the engine's dense representation, not curve
    structure.

