    IDEA-20260727-007 (m = 5 alpha budget, never run); this record is
    dominated by neither on the axis 'solver exponent at m >= 4 on a matched
    special-curve panel', which neither populates.
  sota_delta: >-
    +0 on time, memory and queries. Derivation deltas: (i) the weight law
    W_n = (n-1) 2^{n-2} and the all-m negative answer to H-JINV-0e8819's
    open question, at zero compute; (ii) the S_6 write-down accounting
    (17^6 slots, 17^5 per specialised target; S_7 infeasible densely); (iii)
    an exhaustive baseline that needs no summation polynomial; (iv) a ladder
    design at the first two arities with a non-empty gate, with a matched
    null and a positive control, estimated at CPU-days capped per cell.

