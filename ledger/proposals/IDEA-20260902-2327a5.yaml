  predictions:
    - metric: >-
        Y1 -- weight of S_n under deg(x, a, b) = (1, 2, 3), n in {4, 5, 6}
      direction: different
      minimum_effect: >-
        Exactly 12, 32, 80. Any other value falsifies (S3)'s weight law.
    - metric: >-
        Y2 -- specialised support set of S_4(x1,x2,x3,x_R) and S_5(x1..x4,x_R)
        at a = 0, at b = 0, at a^3 + 8 b^2 = 0, against generic (a, b)
      direction: different
      minimum_effect: >-
        EXACT SET EQUALITY, pre-registered. A single missing monomial at a = 0
        or b = 0 falsifies the support-equality half of (S3) and is a positive
        result for the special-j lane at that arity.
    - metric: >-
        Y3 -- exhaustive arm log-log slope of per-target cost against B, per m
      direction: different
      minimum_effect: >-
        m - 1 within 0.1 at every m. Otherwise the baseline instrument is
        broken and no sigma may be reported.
    - metric: >-
        Y4 -- fitted sigma of the F4 arm on the crater minus fitted sigma on
        the matched floor, per m
      direction: different
      minimum_effect: >-
        Zero within the pooled 90 percent interval (E1). E2 requires a
        difference exceeding 0.10 in sigma, absent on the sham, persisting at
        a second matched family. E3 requires any arm below 1 - 2/(m-1).
    - metric: >-
        Y5 -- fitted sigma of every F4 arm, per m
      direction: higher
      minimum_effect: >-
        At least 1.0 on every arm (S4)(iii). A value below 1.0 on ANY arm,
        including the floor, contradicts the coordinatewise argument and is
        routed to independent review before interpretation.

  minimal_test:
    design: >-
      STAGE 0 (zero compute plus minutes of sympy, HARD GATE): W_n table;
      residue argument; specialised support sets Y2. STAGE 1 (hours):
      re-derive the class; draw 8 floor curves, 8 unmatched controls, build
      the sham; find one j = 1728 matched family by the sum-of-two-squares
      construction. STAGE 2 (CPU-days at most, budget-capped per cell):
      m = 4 ladder, F4 arm and exhaustive arm, 20 targets per cell, extension-
      field positive control. STAGE 3 (budget-capped): m = 5 ladder at
      B in {4, 6, 8, 12}; censored cells reported as such. STAGE 4: only on a
      Y4 excess, the second matched family and the sham.
    controls:
      - matched floor of the same isogeny class (blocking)
      - sham curve of IDEA-20260811-18bbf9 built from a floor curve (blocking)
      - unmatched random curves at the same p (same-p control)
      - exhaustive arm slope m - 1 (blocking calibration)
      - extension-field cell with known sigma below 1 (blocking positive control)
      - per-cell budget and memory cap declared before the ladder; censored cells labelled infrastructure
      - targets_B sampler, r-stratified; never targets_uniform
      - fixed monomial order and engine version pinned; a second order on one cell
    required_metrics:
      - W_n for n in {4, 5, 6} and the residue class of the specialised coefficients
      - specialised support sets per locus per arity with set-equality flags
      - per-target solver cost in engine operations and wall clock, per arm, per B, per m
      - per-target exhaustive cost in group operations, per arm, per B, per m
      - fitted slopes with 90 percent intervals and residual curvature test, per arm
      - largest completed B per arm and the censoring reason
      - sham and positive-control columns beside every sigma

  falsification_conditions:
    - >-
      F1 (cheap, minutes). Y1 or Y2 fails: the weight law or the support-
      equality claim of (S3) is wrong; the record is superseded before any
      ladder is run, and a support difference at a = 0 or b = 0 is a positive
      for the special-j lane at that arity.
    - >-
      F2. Y3 fails: the baseline instrument is broken; nothing is reported.
    - >-
      F3. Y5 fails on the floor: the coordinatewise argument (S4)(iii) does
      not describe the engine; the ceiling claim is withdrawn and the engine
      is characterised before any panel reading.
    - >-
      F4. Y4 shows E2: a coefficient-value effect exists at m >= 4; routed to
      the reducibility and singular-locus records, replicated at a second
      family before description.
    - >-
      F5. Y4 shows E3: review-breakthrough handling; not believed before
      independent replication.
    - >-
      F6. All predictions met (predicted): E1 -- the special-curve prior at
      m >= 5 has no support channel (theorem) and no measured exponent
      channel (ladder) at the tested scope, and the automorphism constant is
      the whole effect.
    - >-
      F7. Budget exhaustion or engine failure: infrastructure outcome under
      AGENTS.md rule 5.

  confounders:
    - >-
      Engine constants: an F4 engine's cost at small B is dominated by
      set-up; only the slope across >= 3 B values is read, with a curvature
      test, and a slope that changes sign under a second monomial order is a
      statement about the order.
    - >-
      Precomputation hiding: a solver with target-independent precomputation
      P(B) and per-target cost T(B) has sigma defined on T only; P must be
      charged separately or a shared-table meet-in-the-middle would read as
      sigma = ceil(m/2)/(m-1) while its table is B^{floor(m/2)} -- exactly the
      enumerate-and-join pinning of IDEA-20260802-003. Both P and T are
      reported.
    - >-
      Single crater: the |Aut| = 6 arm has ONE curve; replication is over
      targets and B, and the between-curve variance is estimated from the
      floor. The second matched family is required before any between-arm
      statement.
    - >-
      Small B at m = 5 (B = 4 to 12) is far from asymptotic; the ladder
      reports the fit interval, and a fit from fewer than three B is
      forbidden.
    - >-
      The x_R = 0 stratum on a j = 0 curve with b a square is degenerate
      (H-JINV-0e8819); targets with x_R = 0 are excluded and counted.

  interpretation_limits:
    - >-
      No attack, no exponent, no speedup is claimed. E1 closes only the
      tested class, engine, arities and ladder; it bounds the between-arm
      sigma difference at the achieved interval and asserts no absence.
    - >-
      (S3) is a statement about SUPPORT; coefficient-value effects are
      explicitly left open and are the content of E2.
    - >-
      (S4)(iii) bounds solvers that reduce modulo the membership ideal; a
      solver of a different kind (lattice, MITM with charged table) is
      outside the ceiling and is not measured here.
    - >-
      Toy tier. N about 2^14 to 2^16. Nothing transfers to cryptographic N.
    - >-
      IDEA-20260807-f8a045 is cited at title level only; the automorphism
      constant is read from KN-TECH-018 (recalled) and from the record's
      title, not from its body.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For every solver that reduces modulo the membership ideal
        (f_V(x_1), ..., f_V(x_m)) with V of B distinct on-curve x-coordinates,
        the per-target cost is at least the size of the evaluation vector of
        S_{m+1}(., x_R) on V^m, i.e. T_solve >= c B^m, uniformly in the curve,
        for B in the tested ladder.
      rigorous_support: >-
        RIGOROUS BOUND: the Chinese remainder isomorphism
        F_p[x]/(f_V(x_i)) = F_p^{V^m} for squarefree completely split f_V
        (IDEA-20260829-bdca13 (A)), so the reduced generator is a vector of
        length B^m. CLASSICAL STATEMENT IMITATED: the dense-representation
        lower bound 'an algorithm that materialises a vector reads it' -- not
        a distribution but a representation-size bound. The heuristic part is
        that the engine actually materialises the reduction rather than
        exploiting sparsity of S_{m+1} in the monomial basis, which is what
        the extension-field positive control and the m = 3 baseline check.
      validation_plan: >-
        SAMPLE: the F4 arm's operation count at every (arm, B, m) cell, at
        least 20 targets, at N about 2^14; COMPARISON: log-log slope against
        the line m on the floor arm; TAIL CHECK: the minimum per-target cost
        over targets must also scale at slope >= m - 1 (a cheap tail below
        the baseline would indicate an early-abort path the model does not
        charge). SAMPLED PARAMETERS RECORDED: engine, version, order, p, N,
        curve, B, m, targets, seeds. TRANSFER: none claimed beyond the ladder.
    - id: H2
      statement: >-
        Per-target solver cost on the ladder follows a single power law
        T(B) = c B^{(m-1) sigma (1 + o(1))} over B in the ladder, so a
        log-log fit over >= 3 B values estimates sigma to the reported
        interval.
      rigorous_support: >-
        RIGOROUS BOUND: T is bounded below by output size and above by
        exhaustive enumeration times the engine's per-step cost, giving
        1 <= (m-1) sigma <= m omega_GB for a Macaulay-type engine (HEUR-AT-3
        of H-ICEX-9e54c2, recalled from the full read). CLASSICAL STATEMENT
        IMITATED: exponent fitting from a bounded size range, valid exactly
        when lower-order terms have decayed, which is why the residual
        curvature test is reported and not the point estimate alone (the same
        H2 as IDEA-20260727-007).
      validation_plan: >-
        SAMPLE: the fitted slope per arm with residuals; COMPARISON: linear
        against quadratic log-log fit by an F test; TAIL CHECK: the ratio of
        the worst-case single target to the mean must be bounded across B;
        an unbounded ratio means the mean is dominated by rare targets and the
        fit is reported as unstable. Parameters recorded as in H1.
    - id: H3
      statement: >-
        A prime N' near 2^14 that is a sum of two squares u^2 + f^2 with
        p' = N' + 2u + 1 prime exists and yields an isogeny class at p' with
        #E = N', D = -4 f^2 and a j = 1728 crater, so a second matched family
        exists for the j = 1728 arm.
      rigorous_support: >-
        RIGOROUS: D = (t-2)^2 - 4N' with t = 2 + 2u gives 4u^2 - 4N' = -4 f^2,
        a class with fundamental discriminant -4 and conductor f whose crater
        is j = 1728 by Deuring; existence of such N' near 2^14 follows from
        the density of sums of two squares among primes (half of them) and of
        primes among integers of that size (about 1/10). CLASSICAL
        DISTRIBUTION IMITATED: primes in short intervals, heuristically
        Poisson.
      validation_plan: >-
        SAMPLE: enumerate primes N' in [2^14, 2^16] that are 1 mod 4, factor
        as u^2 + f^2, test p' prime; COMPARISON: the count against the
        heuristic product of densities; TAIL CHECK: the smallest such N'. One
        found family suffices; this is a construction, not an inference.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED. Within the model of IDEA-20260808-812554 the
      panel's index-calculus exponent at m in {4, 5} is
      2/(2 + (m-1)(1 - sigma)) with sigma predicted >= 1, i.e. exponent >= 1
      (total m! N or worse), a loss of N^{1/2} against rho. The best
      conceivable E3 outcome at m = 5 would need sigma < 1/2, i.e. finding a
      five-fold decomposition faster than reading B^2 pairs, and no mechanism
      for it is proposed.
    memory_exponent: >-
      Exhaustive arm O(B) group elements; F4 arm the Macaulay dimension,
      bounded by B^m field elements at the tested sizes and reported per
      cell; the relation matrix B x B is untouched.
    best_known: >-
      Parallel rho with negation, 0.886 sqrt(N), O(1) memory; BSGS 2 sqrt(N)
      time and sqrt(N) memory; kangaroo on an interval; automorphism-
      discounted rho at 0.886 sqrt(N/3) on j = 0 (KN-TECH-018, recalled from
      the full reads of 99cc67 and 1ea327); Pohlig-Hellman (not applicable at
      prime N); generic preprocessing S T^2 = N.
    hidden_overhead: >-
      Engine constants exponential in m (per-variable degree 2^{m-1} in the
      unchained form, m - 2 auxiliary variables in the chained form); the
      1/m! yield constant; the 17^5 coefficients per specialised S_6 if the
      unchained form is ever used. Nothing superpolynomial is hidden because
      no asymptotic claim is made.
    tradeoff_note: >-
      Not applicable to a claim. Operationally the ladder is embarrassingly
      parallel over (arm, B, target); the F4 solve is serial within a cell.

  dominated_by: >-
    n/a (no result claimed). ROWS CHECKED: (1) parallel rho with negation --
    dominates every panel arm at sigma >= 1 on time and memory; (2) BSGS --
    dominates on time; (3) kangaroo -- not comparable (no interval); (4)
    automorphism-discounted rho -- dominates the j = 0 and j = 1728 arms by
    the additional sqrt(3) and sqrt(2); (5) Pohlig-Hellman -- not applicable,
