      session-limit error; no external source was opened.
    results: >-
      No record states the weight law W_n = (n-1) 2^{n-2} for the summation
      polynomials, the residue-coverage argument that kills the special-j
      confinement under specialisation for every m >= 3, or the S_6 / S_7
      write-down accounting. No record measures a solver-cost exponent on a
      B-ladder at m >= 4 on any curve, special or not; EV-R6-001's m = 4 cell
      is censored and no other m >= 4 measurement exists in the ledger.
      IDEA-20260811-99cc67 and EXP-JINV-bd141d use the same crater/floor class
      but measure rho ratios, decomposition rates and support, never a solver
      exponent. All absences are floors, not novelty; the weight law is
      elementary and almost certainly appears in the literature on summation
      polynomials (Semaev 2004, Faugere-Gaudry-Huot-Renault 2014, recalled,
      not opened).
    verdict: >-
      UNVERIFIED. The derivation (S3) is elementary and the measurement is a
      ladder extension of an existing instrument; nothing here is claimed as
      new against the external literature, which was not opened.

