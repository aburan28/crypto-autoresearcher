idea:
  id: IDEA-20260809-c13b8b
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    A measurement artifact that answers "where does my parameter point sit on the
    measured frontier" and refuses to answer "what should I choose"
  class: tooling
  claim: >-
    The output of this goal is most useful as a queryable artifact: given (t, m,
    p) and a hardware profile, return the measured position relative to the
    tradeoff frontier and the measured attacker-to-defender ratio, with the
    measurement's uncertainty and its provenance. The claim is that such an
    artifact can be built with no recommendation path at all, and that removing
    the recommendation path is what keeps it inside this program's rules while
    still being useful.
  mechanism: >-
    Index the measured grid; answer queries by interpolation with the
    interpolation error reported; return a structured record carrying values,
    uncertainties, the hardware profile used, and the run identifiers the numbers
    came from. No code path returns advice.
  why_not_a_renamed_known_approach: >-
    Parameter calculators exist and give recommendations. An artifact that returns
    measurements with provenance and explicitly cannot recommend is a different
    tool with a different contract, and the contract is the point.
  predictions:
  - observable: existence of any code path returning a recommendation
    metric: boolean by test
    predicted: None; a test asserts it, and a deliberately added path must fail the suite.
  - observable: interpolation error against held-out grid points
    metric: error distribution
    predicted: Small within the measured grid and refused outside it -- queries beyond the grid must return a refusal rather than an extrapolation.
  minimal_test: >-
    Build the artifact over the measured grid, hold out points for error
    measurement, test that out-of-grid queries refuse, and test that no
    recommendation path exists.
  controls:
  - 'HELD-OUT VALIDATION for interpolation error.'
  - 'REFUSAL CONTROL: out-of-grid queries must refuse; silently extrapolating is exactly how a measurement artifact becomes an unsupported recommendation.'
  falsification_conditions:
  - Out-of-grid queries return values.
  - Interpolation error is large within the grid, meaning the grid is too coarse to support the artifact.
  interpretation_limits: >-
    Every returned value is a measurement under declared assumptions on one
    machine, carrying its run identifiers. The artifact makes no claim about
    security and gives no advice.
  sota_delta: 'No attack. Delta: a provenance-carrying measurement service, which is the usable form of this goal''s output.'
  dominated_by: Downstream of the whole goal; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: low
  novelty_status: unverified
  novelty_screen: 'Corpus grep for parameter calculator: no records. WEB NOT CHECKED.'
  source_refs:
  - AGENTS.md -- IN CORPUS, for the no-recommendation constraint.
