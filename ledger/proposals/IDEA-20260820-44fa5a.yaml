    - id: Domain-separation analyses for Fiat-Shamir signatures, exact primary source not retrieved in this task
      provenance: recalled
      verified_by: null
  novelty_screen:
    method: >-
      Screened the complete 24-record RQ-SQISIGN-001 direct-tree inventory and the
      stale low-specificity knowledge results available in the frozen task context.
    results: >-
      Existing records cover canonicalization, public strata, generic transcript
      tests, verifier fibres, simulator audits, path localization, retries, and
      signature length. No screened record uses a fault oracle that aliases two
      declared protocol domains at one chosen derivation boundary and then measures
      the contraction of their public transcript laws.
    verdict: >-
      Unverified. The primary literature was not retrieved, and a stale index cannot
      support a novelty conclusion.
  object_first_candidate:
    tracked_object: >-
      The pair of conditional public-transcript laws P(T | d0) and P(T | d1), and
      their contraction under a declared tag-alias intervention.
    lossiness: >-
      Public transcript features may erase the affected internal derivation; failure
      to distinguish covers only the selected boundary and feature family.
    propagation: >-
      A tag collision at a challenge or randomness derivation can propagate into a
      public challenge, response stratum, or acceptance-conditioned field law.
    survival_score: >-
      The effect survives only if domain-label AUC and cross-domain MMD both shift in
      the pre-registered direction on held-out messages while null arms remain calibrated.
  predictions:
    - metric: absolute distance of fault-arm domain-label AUC from the pooled-domain null AUC
      direction: decrease toward chance under tag aliasing
      minimum_effect: at least 0.08 AUC contraction with 95% bootstrap confidence
    - metric: cross-domain MMD squared between d0 and d1 transcript features
      direction: decrease under tag aliasing
      minimum_effect: at least 25 percent relative contraction and corrected p-value below 0.01
    - metric: matched true-simulator tag-alias null
      direction: no change
      minimum_effect: all primary statistics remain within the 95% registered null bands
  minimal_test:
    design: >-
      At a toy parameter set, choose two explicit domain strings and one declared
      derivation boundary. Compare no-fault real signing, O_tag-alias signing, a true
      simulator supplied only with public inputs, and a planted positive that copies a
      labelled public challenge field across domains with probability 0.20. Train and
      calibrate only on a separate message block.
    controls:
      - No-fault real signer with distinct tags and matched messages.
      - True simulator with distinct public domain inputs and no internal tag alias.
      - Planted cross-domain public-field copy positive.
      - Random tag replacement of equal byte length that preserves tag distinctness.
      - Parser and serializer frozen identically across arms.
      - No clock, retry count, branch trace, power sample, or signature byte length supplied to any statistic.
    required_metrics:
      - Domain-label classifier AUC by arm and held-out domain pair.
      - MMD squared with permutation confidence interval.
      - Public-field collision matrix and verifier-stratum transition matrix.
      - Verification and parse rates reported but not used as hidden filters.
  controls:
    - True-simulator no-fault null with distinct domains.
    - Real-signer no-fault null with distinct domains.
    - Equal-length random nonaliasing tag fault.
    - Planted public-field alias positive.
    - A second domain pair not used during feature selection.
  falsification_conditions:
    - >-
      Reject the mechanism for the tested boundary if neither AUC contraction nor MMD
      contraction reaches the registered threshold while the planted positive has at
      least 0.90 power.
    - >-
      Reject the tag-specific interpretation if an equal-length random nonaliasing tag
      perturbation produces an equal or larger effect.
    - >-
      Mark the test invalid if the true-simulator null is miscalibrated, domain arms
      differ in parsing or signature length, or any timing-derived observation enters.
  confounders:
    - Different message populations can masquerade as domain separation.
    - Unequal tag lengths can change serialization without changing hash-domain semantics.
    - Verifier rejection can condition the retained transcript population differently.
    - A boundary may be dead code or overwritten by a later correctly separated derivation.
  interpretation_limits:
    - Detecting domain-law contraction is not a forgery or recovery result.
    - The oracle assumes the ability to alter one declared tag boundary.
    - The test does not cover side channels, retry latency, or signature-size correlation.
    - The test does not study the SQIsign-002 Kani/published attack surface.
    - The test does not change GOAL-SSI-001 assumptions or KN-TECH-058 baselines.
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Under no fault, the selected derivation boundary consumes two distinct,
        unambiguous domain encodings and contributes to at least one published-field law.
      rigorous_support: >-
        Distinct encodings can be checked exactly; propagation to a public law is an
        implementation-specific hypothesis.
      distribution_imitated: Two domain-conditioned transcript laws with a shared public-input sampler.
      validation_plan: >-
        Trace only declared public dataflow labels in a toy instrumented implementation,
        then remove instrumentation before the blinded distributional test.
      falsification_condition: >-
        The selected tag is not consumed at the boundary or its value is provably
        overwritten before every published-field derivation.
    - id: H2
      formal_statement: >-
        Replacing d1 by d0 contracts at least one registered public-transcript distance
        without requiring timing or length observations.
      rigorous_support: >-
        Exact equality follows for the planted copied-field positive only; no general
        protocol theorem is asserted.
      distribution_imitated: A partial mixture of two domain-conditioned public laws.
      validation_plan: >-
        Calibrate MMD and AUC power on mixture weights 0.02 through 0.20 and freeze the
        minimum detectable contraction.
      falsification_condition: >-
        The registered statistics fail to detect the planted mixture at 0.90 power.
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known: >-
      Not a hard-problem algorithm. KN-TECH-058 records unconditional Fp2
      p^(1/2)(log p)^O(1) time with polynomial memory and conditional p^(1/3+o(1))
      time and memory under Heuristic 1 only.
    hidden_overhead: >-
      Distribution testing is O(Nd) to O(N^2) depending on the registered MMD
      estimator. The conditional KN-TECH-058 row retains superpolynomial hidden
      overhead and no concrete-performance claim.
    tradeoff_note: >-
      Feature dimension trades sample complexity against memory; no cryptanalytic
      exponent changes. Reductions and the GRH boundary remain unverified.
  cost_model:
    time: O(Nd) linear-MMD and classifier audit, or O(N^2) exact-kernel confirmation
    memory: O(Nd) batch storage or O(d) streaming feature means
    data_or_queries: 4N transcripts per domain pair across no-fault, alias, simulator, and planted arms
    preprocessing: Freeze domain encodings, affected boundary, feature map, and domain-pair split
    oracle: >-
      O_tag-alias replaces one declared domain-tag encoding before one selected
      hash/sampler boundary; it exposes no timing, length, secret state, or branch trace.
    verification: O(N) standard transcript verification plus independent recomputation of tag encodings and metrics
  proof_search_map:
    exact_baseline_reproduction: >-
      Reproduce the expected separation of the two no-fault domain laws and calibration
      of the true simulator before applying O_tag-alias.
    observation_collision_search: >-
      Test whether message imbalance, tag length, parser behavior, or acceptance
      conditioning yields the same apparent distance contraction.
    quantifier_order: >-
      For each fixed parameter set, implementation, two domain strings, derivation
      boundary, oracle mask, feature map, and sample budget, probability is over the
      precommitted messages and seeds; no statement covers all boundaries or domains.
    method_ceiling: >-
      A detected contraction shows only that public transcript laws respond to the
      declared intervention; it does not prove nonce reuse, key leakage, or forgery.
    nearby_object_control: >-
      Replace d1 with a fresh equal-length d2 that remains distinct from d0; a similar
      contraction there points to encoding perturbation rather than alias semantics.
  nearest_neighbors:
    - id: IDEA-20260813-87106b
      overlap: Both examine implementation-level handling of public encodings.
      discriminator: The prior canonicalization mechanism concerns representative choice; this proposal aliases semantic domain tags before derivation.
    - id: IDEA-20260813-878855
      overlap: Both can partition transcripts by a public label or stratum.
      discriminator: Here two controlled domains and an intervention define the comparison, rather than passive stratum composition.
    - id: IDEA-20260801-020
      overlap: Both use public-transcript distribution tests.
      discriminator: This proposal has a localized tag-alias oracle, a cross-domain contraction prediction, and an equal-length nonaliasing control.
