idea:
  id: IDEA-20260820-44fa5a
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Cross-domain transcript aliasing under a domain-tag fault oracle
  class: distributional implementation-fault audit
  claim: >-
    A fault that aliases two protocol domain-separation tags can make public SQIsign
    transcript distributions from logically distinct signing domains measurably
    closer or cross-correlated. The claim is limited to a pre-registered
    distributional test under an explicit tag-fault oracle; it makes no timing,
    length, key-recovery, forgery, or hard-problem claim.
  mechanism: >-
    Define O_tag-alias(d0, d1, m) to replace the encoded domain tag d1 by d0 at one
    declared hash/sampler boundary selected by mask m, leaving the message, public
    key, serialization, and all clocks unchanged. Generate balanced transcripts for
    two domains whose no-fault encodings are disjoint. Measure cross-domain MMD,
    domain-label classifier AUC, equality of labelled public challenge fields, and
    verifier-stratum transition matrices. If the tag enters a randomness or challenge
    derivation that survives to published fields, aliasing can collapse part of the
    separation between the two conditional transcript laws.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-bdae64
    - id: KN-TECH-057
      provenance: internal
      verified_by: TASK-20260820-bdae64
