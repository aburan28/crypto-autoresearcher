idea:
  id: IDEA-20261005-e211ac
  question_id: RQ-SSI-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Mean 2-isogeny distance on the full supersingular set versus the
    F_p-rational subset, first prime with 8 to 24 vertices
  class: measurement
  claim: >-
    Let p be the least prime congruent to 11 mod 12 such that the set S of
    supersingular j-invariants in F_{p^2} satisfies 8 ≤ |S| ≤ 24. Let S_p be
    the subset of those j that lie in F_p. Let G_full be the simple graph on
    S with an edge when a separable 2-isogeny exists over F_{p^2}. Let G_rat
    be the simple graph on S_p with an edge when a separable 2-isogeny exists
    over F_p. Both graphs are connected, 0 and 1728 lie in S, every vertex of
    G_full outside {0, 1728} has degree 3, and the ratio of mean pairwise
    distances d(G_full)/d(G_rat) is at least 3/2. No torsion image is used.
    No endomorphism ring is returned.
  mechanism: >-
    The surviving object is the supersingular 2-isogeny graph, not an ECDLP
    instance. Two explanations are separated before the search. Explanation
    A: restricting to F_p-rational vertices and F_p-rational kernels shortens
    mean distance by a factor at least 3/2 at this p, which is a constant-factor
    orientation effect. Explanation B: the ratio is strictly less than 3/2, so
    the published F_p-structure does not shorten paths by that factor on this
    graph. A third outcome, degree not equal to 3 off {0, 1728}, means the
    enumerated graph is not the 3-regular graph path-finding cost models use,
    and the ratio is then not interpreted. This is not a prime-field ECDLP
    translation problem, so the translation-rigidity frame is not the object.
    The representation is the j-invariant. Sigma is the set of separable
    2-isogenies, a partial action on the finite set S. The projection discards
    the kernel subgroup and the isogeny map and keeps the codomain j. Distinct
    kernels can share a codomain j, so the projection is not injective on
    kernels and is not a change of coordinates. Vertices 0 and 1728 are the
    nearby objects where extra automorphisms can drop the distinct-neighbor
    count. No SIDH torsion basis is published into the test.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        After the SIDH break, CGL path-finding and SQIsign rest on
        endomorphism-ring or isogeny-path hardness, with best known cost
        recorded in that note as soft-O of p to the power 1/4, classical and
        quantum, for pure path-finding.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-013.md
    - ref: KN-TECH-055
      provenance: internal
      claim: >-
        The opened note abstracts a p to the power 1/3 plus o(1) pattern for
        the supersingular isogeny problem from a structural degree bound, a
        smoothness heuristic, and a meet-in-the-middle. This idea does not
        run that algorithm.
      verified_by: idea-generator, this session, via knowledge/techniques/KN-TECH-055.md
    - ref: KN-LIT-062
      provenance: internal
      claim: >-
        The opened note describes SIDH as walks on the supersingular
        2-isogeny and 3-isogeny graphs over F_{p^2}. The note was read
        through its contribution section. No diameter table is in that
        section.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-062.md
    - ref: KN-OPEN-015
      provenance: internal
      claim: >-
        Publishing torsion images collapsed SIDH. This test publishes no
        torsion image.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-015.md
    - ref: KR-RHO-5b1c0a
      provenance: internal
      claim: >-
        Delaplace-May's representation and subset-sum approach to ECDLP over
        F_{p^2} costs p^{1.314}, worse than rho at O(p); lists alone need
        p^{3/4}.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
  assumptions:
    - Supersingular j-invariants used here lie in F_{p^2}. The test enumerates them by the supersingular polynomial and does not trust a closed count formula.
    - p congruent to 11 mod 12 is the search residue so that a recalled congruence predicts 0 and 1728 are supersingular. Membership is checked. If either is absent, the setup fails.
    - Distances are in the simple graph of distinct neighbor j-invariants. Multiple kernels with the same codomain j contribute one edge.
    - The search stops at the first prime with |S| above 24 or at p greater than 300, whichever comes first. An empty search is a failed setup.
  proof_search_map:
    bottleneck: >-
      The mean-distance ratio between the full supersingular 2-isogeny graph
      and the F_p-rational subgraph at one prime.
    baseline_embedding:
      parameter_slice: >-
        Exact BFS on a graph of at most 24 vertices, which is smaller than
        every parameter in the p to the 1/4 path-finding bound.
      reproduction_check: >-
        Every vertex outside {0, 1728} has degree 3, and both graphs are
        connected. Otherwise the ratio is not a path-finding datum.
    observation_collision:
      observable: d(G_full)/d(G_rat)
      distinct_preimage_search: >-
        Two non-isomorphic graphs, G_full and G_rat, can share a mean
        distance. A ratio below 3/2 is that collision.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The least prime p ≡ 11 mod 12 with 8 ≤ |S| ≤ 24.
        predicted_gain: >-
          A ratio of two exact means, predicted at least 3/2. No exponent.
    quantifier_order: >-
      For the least prime p in the search, every vertex outside {0, 1728}
      has degree 3, and the mean-distance ratio is at least 3/2. Failure at
      this single p falsifies the claim at this p only.
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor gap between two mean distances on a graph of at
        most 24 vertices, or the absence of that gap.
      nearby_object_control: >-
        The vertices 0 and 1728, where degree 3 is not required. A degree-3
        count there falsifies the automorphism exception used as the control.
    proof_obligations:
      - claim: degree 3 off {0, 1728}
        responsibility: correctness
      - claim: both graphs connected
        responsibility: feasibility
      - claim: ratio at least 3/2
        responsibility: size
    not_applicable_reason: not_applicable
  predictions:
    - metric: ratio of mean pairwise BFS distances d(G_full)/d(G_rat)
      direction: higher
      minimum_effect: 3/2
    - metric: degree of each vertex in G_full outside {0, 1728}
      direction: different
      minimum_effect: exactly 3
    - metric: distinct-neighbor count of j = 0 and of j = 1728, if present
      direction: lower
      minimum_effect: at most 2
  minimal_test:
    design: >-
      Enumerate supersingular j in F_{p^2} for primes p ≡ 11 mod 12 in
      increasing order until 8 ≤ |S| ≤ 24 or p > 300. Build 2-isogeny
      neighbors by the kernels of order 2 and Vélu, keeping distinct
      codomain j-invariants. BFS every unordered pair in G_full and in
      G_rat. Report degrees, connectivity, and the ratio. Do not compute a
      hidden isogeny, a torsion image, or an endomorphism ring.
    controls:
      - 0 and 1728 must lie in S. Absence falsifies the setup before the ratio is read.
      - A path graph on |S| vertices is the null graph. Its mean distance must be strictly larger than d(G_full). If it is not, the distance statistic does not see expansion and the ratio is not interpreted.
      - Self-loops and the dual of an isogeny are not extra vertices.
    required_metrics:
      - vertex_count_full
      - vertex_count_rational
      - degree_list_outside_0_1728
      - degree_of_0
      - degree_of_1728
      - mean_distance_full
      - mean_distance_rational
      - mean_distance_path_null
  falsification_conditions:
    - The ratio d(G_full)/d(G_rat) is strictly less than 3/2.
    - Some vertex outside {0, 1728} has degree not equal to 3.
    - Either graph is disconnected.
    - "|S_p| is less than 2."
    - No prime p ≤ 300 yields 8 ≤ |S| ≤ 24.
    - The path-graph null has mean distance less than or equal to d(G_full).
  confounders:
    - Counting dual isogenies as two edges inflates degree. The graph is simple.
    - Extra automorphisms at 0 and 1728 can repeat a codomain j. Those two vertices are excluded from the degree-3 prediction.
    - A disconnected G_rat makes the ratio undefined. That outcome falsifies the claim rather than being imputed a distance.
  interpretation_limits:
    - A ratio of 3/2 on at most 24 vertices is a constant factor. It does not beat soft-O of p to the 1/4 and it does not instantiate the p to the 1/3 plus o(1) pattern.
    - Failure of degree 3 falsifies the enumerated graph as a cost-model carrier at this p. It is not a break of CSIDH or SQIsign.
    - No quantum query cost is measured.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Mean distance in G_full is at least 3/2 times mean distance in G_rat
        when both are connected and G_full is 3-regular off {0, 1728}. This
        imitates the Moore lower bound on the diameter of a 3-regular graph,
        diameter at least log(|V| - 1) / log(2), together with the heuristic
        that the mean distance is at most twice that lower bound.
      rigorous_support: >-
        A finite 3-regular graph on |V| vertices has diameter at least
        log(|V| - 1) / log(2). That bound does not force the ratio of two
        means to be 3/2. KN-OPEN-013 records a path-finding exponent and
        does not state this ratio.
      validation_plan: >-
        At the single prime the search returns, with |S| ≤ 24, compute both
        means exactly by BFS and compare each to the Moore lower bound. If
        either mean exceeds twice its Moore lower bound, the expander reading
        fails at this p and the ratio is not exported as an asymptotic. No
        transfer to a cryptographic prime is claimed.
  target_complexity:
    time_exponent: >-
      BFS on at most 24 vertices. The path-finding exponent recorded in
      KN-OPEN-013, soft-O of p to the 1/4, is not changed. The p to the
      1/3 plus o(1) pattern in KN-TECH-055 is not run.
    memory_exponent: O(|S|^2) distance entries, |S| ≤ 24
    best_known: >-
      KN-OPEN-013, opened, states soft-O of p to the power 1/4 for pure
      supersingular path-finding. This graph does not beat that bound.
    hidden_overhead: >-
      No o(1) term is hidden because no asymptotic algorithm is claimed.
      Vélu arithmetic at this p is constant time per edge.
    tradeoff_note: >-
      Exact BFS uses memory quadratic in |S| and time quadratic in |S|.
      That is not a van Oorschot-Wiener tradeoff and it does not parallelize
      into a cheaper exponent.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is a supersingular isogeny-graph distance at one toy prime. It is
      not a claim on the prime-field ECDLP frontier. KR-RHO-5b1c0a was opened
      and is recorded under nearest: it prices a representation attack over
      F_{p^2}, which this distance ratio is not.
    nearest:
      - ref: KN-OPEN-013
        provenance: internal
        relation: adjacent
        delta: >-
          The opened note records path-finding at soft-O of p to the 1/4.
          This idea adds one rational, a mean-distance ratio predicted at
          least 3/2, on a graph of at most 24 vertices, and leaves that
          exponent unchanged.
      - ref: KN-TECH-055
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened note is a smoothness-splitting pattern aimed at p to
          the 1/3 plus o(1). This idea performs no smoothness split and no
          claw search. The numeric gap to that pattern is the full exponent
          difference between a 24-vertex BFS and p to the 1/3.
      - ref: KR-RHO-5b1c0a
        provenance: internal
        relation: orthogonal
        verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
        delta: >-
          The opened row states that a representation and subset-sum ECDLP
          over F_{p^2} costs p^{1.314}, worse than rho at O(p), with lists
          alone at p^{3/4}. This idea adds one rational, a mean 2-isogeny
          distance ratio predicted at least 3/2, on a graph of at most 24
          vertices. It builds no representation list. The exponent gap to
          that row is 3/2 against p^{1.314}. The rho cost O(p) over F_{p^2}
          is not improved.
  dominated_by: >-
    KN-OPEN-013 records pure supersingular path-finding at soft-O of p to
    the power 1/4. Exact BFS on at most 24 vertices does not beat that bound,
    and it does not beat the p to the 1/3 plus o(1) pattern named in
    KN-TECH-055.
  sota_delta: >-
    No exponent is derived. The quantitative delta is a ratio of two means,
    predicted at least 3/2, on a graph with at most 24 vertices. The
    path-finding exponent stays the soft-O of p to the 1/4 figure in the
    opened note KN-OPEN-013.
