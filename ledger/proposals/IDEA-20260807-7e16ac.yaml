idea:
  id: IDEA-20260807-7e16ac
  question_id: RQ-AES-001
  added: '2026-08-07'
  title: >-
    GCM's counter sits on a column, not a diagonal: a one-round integral
    depth deficit versus REF-C's diagonal coset, plus GCM's own 2^32-2 message
    limit charged against the coset dimension (A2-5)
  class: control

  claim: >-
    Formalization of catalogue entry A2-5 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A2.md,
    lines 457-529). Under the campaign's pinned column-major state layout, the
    ShiftRows image of the diagonal D_0 = {0,5,10,15} is column 0, so a
    coset defined on AES-GCM's counter placement (bytes 12-15 = column 3) is
    exactly one round further along in diffusion than REF-C's diagonal coset
    at the same data cost: the full 2^32 column coset is predicted to balance
    exactly through r = 3 and die at r = 4, one round earlier than REF-C's
    diagonal 16/16-through-r=4. Two mode-level charges are asserted as part of
    the result rather than estimated: GCM's own 2^32 - 2 counter limit caps
    the largest aligned column coset at 2^30 inside GCM's stated bound, and
    the missing element to reach the aligned 2^31 run is counter 0 (the tag
    mask block E_K(J_0)), recoverable from one known-plaintext message with
    its tag. No attack, no break, no full-round claim: a reduced-round
    MODE/byte-placement result, scoped to the tested rounds, keys, seeds,
    position sets and the pinned final-round convention.

  mechanism: >-
    See A2.md lines 465-509 for the full ShiftRows index-arithmetic
    derivation and the exact charged cost (four position-set arms x six
    dimension-ladder points x three round counts, dominated by four d=32
    sweeps at ~2^34 AES evaluations, ~4 minutes on 4 cores, <100 MB RSS,
    sequential access, zero oracle calls, no QRAM). This proposal formalizes
    that entry's own minimal_test, falsifier and ceiling verbatim into this
    repository's ledger schema; no new science is introduced.

  novelty_status: unverified

  source_refs:
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A2.md (A2-5, lines 457-529)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/INDEX.md (section 2a)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md (section 4c)
    - ledger/goals/GOAL-AES-001.yaml
    - ledger/questions/RQ-AES-001.yaml

  review_refs: []
  disposition: proposed

  interpretation_limits:
    - >-
      A MODE result about AES-GCM/AES-CTR byte placement, not a statement
      about AES the block cipher. No key-recovery or distinguishing attack is
      exhibited: a reduced-round depth deficit in a mode's byte placement is
      not a property of the full-round mode and is not claimed to be.
    - >-
      Ceiling toy, scoped to tested rounds (3-5, decay checked at r=10), keys,
      seeds, position sets and the pinned final-round convention (no final
      MixColumns).
    - >-
      No comparison to the published state of the art in either direction;
      the only comparison made is to this repository's own committed REF-C
      diagonal measurement (MEAS-GOAL-AES-002-002 / measurement_2).

  recorded_by: coordinator
  recorded_at: '2026-08-07'
