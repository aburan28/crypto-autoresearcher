idea:
  id: IDEA-20260809-d566b0
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    The hash-everything combiner as null object, with one-input removal as the
    positive control for each input
  class: control
  claim: >-
    A combiner hashing every available value — both shared secrets, both public
    values, the post-quantum ciphertext, and a domain-separating label — should
    admit no binding certificate. The claim is that this negative, paired with the
    reappearance of certificates when each single input is removed, measures the
    goal's certificate machinery and makes every empty cell in the table a bounded
    statement rather than an absence.
  mechanism: >-
    Implement the maximal combiner; run every certificate construction; expect
    empty. Remove each input in turn and rerun, expecting the lattice's predicted
    outcome for that removal.
  why_not_a_renamed_known_approach: >-
    Hashing everything is standard advice. Its use as a NULL OBJECT with
    per-input positive controls is the discipline that the inventor protocol
    requires and that makes this goal's negatives reportable.
  predictions:
  - observable: certificates against the maximal combiner
    metric: count
    predicted: Zero. A nonzero count would mean either an implementation defect or a construction outside the enumerated class, and the second would be a genuine finding.
  - observable: agreement between removal outcomes and the lattice's predictions
    metric: agreement rate over inputs
    predicted: Full agreement; a disagreement identifies an error in the derivations, which is exactly what the control exists to catch.
  minimal_test: >-
    Run the full construction suite against the maximal combiner and against each
    single-input removal at matched budgets, comparing outcomes against the
    lattice.
  controls:
  - 'MATCHED BUDGETS across all configurations.'
  - 'ENCODING-AMBIGUITY CHECK: the maximal combiner must use unambiguous encoding of its inputs, since a length-ambiguous concatenation is an omission in disguise.'
  falsification_conditions:
  - A certificate against the maximal combiner.
  - Removal outcomes disagree with the lattice predictions.
  interpretation_limits: >-
    Emptiness at a declared budget within an enumerated construction class is not
    a proof of binding, and every empty cell in the table carries that scope.
  sota_delta: 'No attack. Delta: measured machinery power plus a cross-check of the lattice derivations against artifacts.'
  dominated_by: Not dominated by any corpus record; a precondition for the table's negative cells.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for null-object combiner: no records. WEB NOT CHECKED.'
  source_refs:
  - Binding taxonomy references -- REQUIRED READS.
