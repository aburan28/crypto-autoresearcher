idea:
  id: IDEA-20260805-f58517
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  added: '2026-08-05'
  title: >-
    The structural assumption has a complexity ceiling and an exact sparsity
    number: transferring the AM-intersect-coAM argument from lattice
    isomorphism to Classic McEliece's second assumption, and naming the
    obstruction where the transfer fails

  class: complexity_ceiling_transfer

  claim: >-
    RQ-MCE-e65b3c states Classic McEliece's security as TWO assumptions and says
    the question is mostly about the second -- that a scrambled binary Goppa
    parity-check matrix is indistinguishable from a random one -- because every
    break in the McEliece family has come through it. That assumption has never
    been given a complexity-theoretic ceiling in this corpus, and two things can
    be established about it cheaply and largely on paper.
    FIRST, AN EXACT NUMBER. The set of binary Goppa codes is astronomically
    sparse inside the set of binary codes of the same length and dimension: at
    most 2^(m*n + m*t) keys against roughly 2^(k*m*t) codes, so at
    mceliece6960119 (m = 13, n = 6960, t = 119, k = 5413, m*t = 1547) the Goppa
    codes occupy at most a 2^(92027 - 8373911) = 2^(-8281884) fraction. The
    second assumption is therefore INFORMATION-THEORETICALLY FALSE by an
    enormous, computable margin and is only ever a computational statement.
    Every deliverable of this goal that says "indistinguishable" without saying
    "computationally" is overstating by that exponent, and the exponent is now a
    number rather than a gesture.
    SECOND, A CEILING AND ITS OBSTRUCTION. KN-LIT-7671 reports that the search
    Lattice Isomorphism Problem lies in AM intersect coAM, hence that NP cannot
    reduce to it and SVP cannot reduce to it unless the polynomial hierarchy
    collapses -- the cheapest possible pre-compute falsification check for any
    scheme whose hardness rests on an isomorphism or equivalence problem, and
    one nobody has pointed at a code-based goal. Transferring it here yields a
    conditional statement worth having: Goppa Code Distinguishing lies in NP
    with a witness of at most m*n + m*t bits (derived below), so if it also lies
    in coAM then syndrome decoding, which is NP-complete, cannot reduce to it
    unless PH collapses, and Classic McEliece's two assumptions are provably NOT
    interchangeable. It also yields a NAMED OBSTRUCTION where the transfer
    fails, which is the honest half: the Goldwasser-Sipser route that puts
    equivalence problems in coAM certifies that a set is LARGE, and the Goppa
    set is the sparsest object in sight, so the standard protocol runs in
    exactly the wrong direction. That obstruction, with its forward guidance, is
    the deliverable whether or not the ceiling is ever established.

  object_first_candidate:
    tracked_object: >-
      THE VERIFIER'S TRANSCRIPT -- the sequence of messages an Arthur-Merlin
      protocol would exchange to certify that a given parity-check matrix is, or
      is not, the scrambled parity check of a binary Goppa code -- followed
      through the reduction from key recovery to distinguishing to set
      membership. Not a code, not an attack, not an algebraic invariant: an
      interactive proof, and the quantity followed through it is the SIZE OF THE
      SET the protocol must lower-bound at each step.
    established_families_off_limits: >-
      Declared off-limits as the primary lens:
      (a) information-set decoding and all generic decoding
      (IDEA-20260805-554b9d's lane);
      (b) algebraic distinguishers and key recovery -- square codes, syzygies,
      filtrations, MinRank, Pfaffians -- and the alternant-degree bookkeeping of
      IDEA-20260805-9704d9, which is a different lane on a neighbouring object;
      (c) side channels, faults, decryption failures;
      (d) support splitting, code equivalence ALGORITHMS, and any attempt to
      recover a key by any means.
      The lens used instead is structural complexity theory -- where the
      decision problem sits relative to NP and the polynomial hierarchy -- which
      is not an attack family and has never been applied to any code-based goal
      in this corpus.
    newness_score: >-
      The individual ingredients are not new: sparsity counts of Goppa keys are
      standard, and the AM-intersect-coAM style of ceiling argument is
      well-established for isomorphism problems. What this corpus does not have,
      measured rather than asserted, is any of it: knowledge/ carries the SLIP
      ceiling only in the HAWK lineage (KN-OPEN-027, superseded by KN-OPEN-028),
      the ANGLE-BRIEF records the transfer to MCE-001 as never attempted, and no
      MCE record states either the sparsity exponent or any complexity ceiling.
      The newness claimed is the transfer plus the exact numbers, and nothing
      more.
    testability_score: >-
      Mixed, honestly. The sparsity half is exact integer arithmetic on already-
      transcribed parameters and is decided in seconds. The witness-size half is
      a derivation. The ceiling half is NOT decidable by this program -- proving
      or refuting membership in coAM is a research problem in complexity theory,
      not an experiment -- and the honest deliverable there is the obstruction
      and the forward guidance rather than the theorem. This split is stated up
      front so that the record cannot later be read as promising a proof.
    survival_score: >-
      The sparsity object survives entirely and is unconditional. The transcript
      object survives to the point where the set-size direction reverses, and
      that point is exactly where the interesting statement is; it is the
      boundary that this proposal exists to locate rather than to cross.

  mechanism: >-
    PART A -- THE SPARSITY EXPONENT, DERIVED.
    Count keys. A Classic McEliece key is an ordered support L of n distinct
    elements of F_(2^m) together with a monic polynomial g of degree t. The
    number of ordered supports is (2^m)!/(2^m - n)! <= 2^(m*n), and the number
    of monic degree-t polynomials over F_(2^m) is 2^(m*t). So
      log2 (number of keys) <= m*n + m*t.
    At the five standardized parameter sets, using the (m, n, t) whose k = n -
    m*t and rates EV-MCE-332f99 O-1 transcribed and independently recomputed,
    this bound is computed exactly by the experiment; for mceliece6960119 it is
    13*6960 + 13*119 = 90480 + 1547 = 92027.
    Count codes. The number of k-dimensional subspaces of F_2^n is the Gaussian
    binomial, whose base-2 logarithm is k*(n-k) + O(1), with n - k = m*t. For
    mceliece6960119 that is 5413 * 1547 = 8373911.
    Hence the fraction of [n, k] binary codes that are Goppa codes is at most
      2^(m*n + m*t - k*m*t) = 2^(92027 - 8373911) = 2^(-8281884).
    THREE CONSEQUENCES, EACH SEPARATELY USEFUL.
    (i) The second assumption is information-theoretically false. An unbounded
    distinguisher succeeds with overwhelming advantage. So "indistinguishable
    from random" is only ever a computational statement, and the gap is 2^(-8.28
    million) rather than something negligible-looking. This is not news to
    coding theorists; it IS news to this corpus, and it directly disciplines
    every sentence GOAL-MCE-001 is about to write about distinguishers.
    (ii) The key entropy is at most 92027 bits against a claimed security of a
    few hundred bits, so there is no key-entropy shortcut and no birthday
    argument on the key space -- a negative worth having in writing.
    (iii) The witness size for Goppa Code Distinguishing is at most m*n + m*t
    bits and verification (rebuild the code from (L, g), compare) is polynomial,
    so GD is in NP with an explicitly bounded witness.
    PART B -- THE CEILING TRANSFER, AND EXACTLY WHERE IT BREAKS.
    KN-LIT-7671 (NOT READ -- relayed via its own corpus entry) reports: every
    language reducible to the search Lattice Isomorphism Problem lies in AM
    intersect coAM; hence NP cannot reduce to SLIP and SVP cannot reduce to SLIP
    unless the polynomial hierarchy collapses. The pattern generalises to any
    hardness assumption phrased as "these two objects are isomorphic", because
    the standard set lower-bound protocol certifies the size of an orbit and
    orbits of non-isomorphic objects are disjoint.
    THE TRANSFER TARGET. Classic McEliece's second assumption is NOT of that
    shape and this is the crux. It is a MEMBERSHIP problem with one object --
    given a parity-check matrix, is the code a scrambled Goppa code? -- not an
    EQUIVALENCE problem with two. The Goldwasser-Sipser route proves a set is
    LARGE. To place GD in coAM one needs an AM proof of NON-membership, and the
    natural set to lower-bound is the set of codes, which certifies nothing
    about the particular code presented. By Part A the Goppa set is the sparsest
    object available, so the protocol's direction is exactly wrong.
    THIS IS THE NAMED OBSTRUCTION and it is stated at the inventor-protocol
    section 4 standard rather than as a fatigue report: the obstruction is the
    DIRECTION OF THE SET-SIZE ARGUMENT, the argument is that sparsity makes the
    lower-bound protocol vacuous, and the forward guidance is three concrete
    lanes that remain open -- (1) the PERMUTATION-EQUIVALENCE formulation, where
    two objects ARE given and the classical route may apply directly (the
    RECALLED-UNVERIFIED classical result that permutation code equivalence is
    not NP-complete unless PH collapses is the thing to check, and its author,
    year and statement are deliberately not asserted here because none was
    read); (2) the possibility that GD reduces to an equivalence problem via the
    support-splitting-style formulation, which would import the ceiling
    wholesale; (3) the counting protocol, since GD's witness is bounded and its
    solution count is exactly the quantity Part A bounds.
    PART C -- THE CONDITIONAL STATEMENT THAT IS WORTH HAVING EITHER WAY.
    Syndrome decoding of a random binary linear code is NP-complete
    (RECALLED-UNVERIFIED, and confirming it from primary text is a step of the
    work). GD is in NP by Part A (iii). So:
      IF GD is in coAM, THEN no NP-complete problem -- in particular syndrome
      decoding -- reduces to GD unless PH collapses.
    Read plainly: Classic McEliece's two assumptions would be provably of
    different hardness types, the second provably not inheritable from the
    first, and any security argument that treats them as a single "hard"
    predicate would be leaning on something the polynomial hierarchy forbids.
    That is a conditional, it is stated as one, and its antecedent is exactly
    the open question Part B locates.
    PART D -- THE ONE THING THAT IS MEASURABLE TODAY. Part A's counting rests on
    an upper bound because distinct (L, g) pairs can give the same code. The
    refinement is a forced value that can be checked exhaustively at toy scale:
    with L FIXED as an ordered enumeration of all of F_(2^m), is the map
    g -> Gamma(L, g) INJECTIVE on monic irreducible g of degree t? Predicted
    YES, from which the count of distinct codes at (m, t) = (4, 2) equals the
    number of monic irreducible quadratics over F_16, namely
    (16^2 - 16)/2 = 120. That number is derived before the run, it is exhaustively
    checkable in seconds, and it CAN FAIL -- the doubling identity of
    IDEA-20260805-9704d9 is a proven collision for g versus g^2, so collisions
    of some kind demonstrably exist and the only question is whether they occur
    inside the irreducible stratum.

  novelty_status: unverified

  literature_context:
    - >-
      KN-LIT-7671 (Jiang-Liu, "Exploiting the complexity of Lattice Isomorphism
      Problem via Irreducible Decomposition", iacr:2026/1139). NOT READ -- every
      statement here is relayed from its corpus entry, which is itself
      confidence: reported. Relayed content used: SLIP is in AM intersect coAM;
      NP cannot reduce to SLIP and SVP cannot reduce to SLIP unless PH
      collapses; the search/counting/decision reductions mirror the graph-
      isomorphism picture. Verifying these against primary text is a declared
      step and no conclusion may be published before it.
    - >-
      KN-OPEN-027 (superseded by KN-OPEN-028, and the supersession is respected
      here -- it is cited only for the ceiling observation, which is the part
      KN-OPEN-028 does not replace). It is the corpus's only carrier of the
      AM-intersect-coAM ceiling, filed entirely inside the HAWK lattice lineage,
      with no code-based goal referencing it.
    - >-
      That syndrome decoding of a random binary linear code is NP-complete is
      RECALLED-UNVERIFIED. No author, year, venue or theorem number is asserted.
      It is load-bearing for Part C and is therefore an explicit verification
      step rather than a background fact.
    - >-
      That permutation code equivalence is not NP-complete unless the polynomial
      hierarchy collapses is likewise RECALLED-UNVERIFIED, with no attribution
      asserted. It is the single most valuable thing stage 2 could confirm,
      because if true it supplies the equivalence-side half of the ceiling
      directly and reduces Part B's open question to whether GD reduces to
      equivalence.
    - >-
      RQ-MCE-e65b3c.scope.assumption (READ, in repo) is the internal source for
      the two-assumption framing and for the observation that every break in the
      family has come through the second. This proposal adds the complexity-
      theoretic reading of that sentence, which the question record does not
      have.

  lossy_projection_identifiability_audit:
    projection: >-
      A full Classic McEliece key (m, L, g, and the scrambling) is projected to
      a single membership bit -- "is this code in the Goppa set?" -- together
      with two integers, log2 of the key count and log2 of the ambient code
      count.
    what_is_discarded: >-
      Everything except cardinalities. Support, polynomial, field, scrambling,
      and the identity of the code are all gone; only how many objects of each
      kind exist remains.
    why_genuinely_lossy: >-
      Extreme and irreversible. A cardinality cannot encode a support. This is
      not the change-of-coordinates failure of KN-LIT-7595, where the tracked
      pair was recoverable as the roots of a quadratic; nothing is recoverable
      here and nothing is meant to be.
    why_compatible_with_the_operations: >-
      Compatible with exactly the operations the argument uses, which are the
      operations of counting and of interactive proof: set inclusion, set size,
      and reduction between decision problems. Cardinality propagates
      deterministically under all three, which is the whole reason a counting
      argument can yield a complexity statement at all.
    is_it_only_a_change_of_coordinates: >-
      NO, but the MIRROR failure is live here and is the one that was checked.
      A membership bit that is constant across instances carries nothing. It is
      not constant: the bit is 1 on the Goppa arm and 0 on the random-code arm
      by construction, and the comparator spread is the sparsity exponent
      itself, which Part A computes as roughly 8.28 million at the largest
      parameter set. The failure that MUST be watched instead is different and
      is stated plainly: a projection this lossy can be perfectly informative
      and still support no efficient algorithm, which is exactly the situation
      here. That is why this proposal claims a COMPLEXITY CEILING and a SCOPING
      CORRECTION, and explicitly claims no attack -- the information exists, and
      the entire content of the assumption is that nobody can extract it in
      polynomial time.

  assumptions:
    - >-
      That the two relayed complexity facts (SLIP in AM intersect coAM; syndrome
      decoding NP-complete) are as reported. Neither is verified here. Both are
      verification steps, and Part C's conditional is void if either fails.
    - >-
      That the Gaussian-binomial logarithm is k*(n-k) + O(1) with the O(1)
      bounded by a small absolute constant. This is standard and is checked
      numerically at the actual parameters rather than assumed, because the
      whole sparsity headline is a difference of two large logarithms and a
      sloppy second term would be invisible.
    - >-
      That the key count may be taken as an upper bound for the sparsity
      argument. It may: overcounting keys only WEAKENS the sparsity claim, so
      the bound is in the safe direction. Part D refines it anyway.

  predictions:
    - metric: >-
        Sparsity exponent s = m*n + m*t - log2(Gaussian binomial(n, k)_2),
        computed in exact integer arithmetic at each of the five Classic
        McEliece parameter sets.
      direction: lower
      minimum_effect: >-
        s <= -1000000 (one million) at every one of the five sets, and at
        mceliece6960119 specifically s within 1 per cent of -8281884, the value
        derived above from m*n + m*t = 92027 and k*(n-k) = 8373911. A deviation
        beyond 1 per cent means the Gaussian-binomial second term is not
        negligible and the derivation must be redone with it carried.
    - metric: >-
        log2 key-count upper bound m*n + m*t at each parameter set.
      direction: different
      minimum_effect: >-
        EXACTLY 92027 at mceliece6960119, computed as 13*6960 + 13*119. An exact
        integer with no tolerance; it is stated here so a transcription error in
        (m, n, t) is caught by arithmetic rather than by trust.
    - metric: >-
        Part D injectivity. Number of DISTINCT F_2 codes among
        { Gamma(L, g) : g monic irreducible of degree t over F_(2^m) }, with L a
        fixed enumeration of all of F_(2^m), at (m, t) = (4, 2).
      direction: different
      minimum_effect: >-
        EXACTLY 120 = (16^2 - 16)/2, the count of monic irreducible quadratics
        over F_16, i.e. the map is injective on that stratum. Derived before the
        run. Fewer than 120 means collisions exist inside the irreducible
        stratum -- which would be a genuinely interesting finding, would refine
        the key count, and is exactly why the prediction is stated as an equality
        that can fail rather than as an inequality that cannot.
    - metric: >-
        Part D extended. The same count at (m, t) in {(4,3), (5,2), (5,3),
        (6,2)}, each compared against the number of monic irreducible degree-t
        polynomials over F_(2^m) given by the necklace formula
        (1/t) * sum_{d | t} mu(d) * 2^(m*t/d).
      direction: different
      minimum_effect: >-
        Equality at all five cells. This is a graded ladder in (m, t) and its
        purpose is monotone localisation: if injectivity fails, the cell at
        which it first fails names the algebraic condition responsible.
    - metric: >-
        Ceiling-transfer disposition. A written statement, per lane, of whether
        the Goldwasser-Sipser set-size route applies to (a) Goppa Code
        Distinguishing as membership, (b) permutation code equivalence, (c) a
        reduction between them.
      direction: different
      minimum_effect: >-
        NOT A NUMBER, and stated as such rather than dressed as one. The
        required output is three dispositions each of which is APPLIES, FAILS
        WITH A NAMED OBSTRUCTION, or UNRESOLVED WITH THE OBSTACLE NAMED. An
        output of "unresolved" with no obstacle named is a fatigue report and
        does not discharge this metric.

  minimal_test:
    design: >-
      Three stages, cheapest first. STAGE 1 (pure Python integers, seconds): the
      sparsity exponent and key-count bound at all five parameter sets, plus a
      numerically exact Gaussian binomial so the O(1) term is measured rather
      than assumed. STAGE 2 (pure Python, minutes): the Part D injectivity
      ladder by exhaustive enumeration at five (m, t) cells. STAGE 3 (reading,
      hours, network): verify the two relayed complexity facts against primary
      text, and write the three ceiling-transfer dispositions. Stage 3 is the
      only stage that can fail for infrastructure reasons, and a blocked route
      there is a recorded outcome, never negative mathematical evidence
      (AGENTS.md rule 5). NOTE: this proposal is filed WITHOUT a paired
      experiment contract in this batch. Stages 1 and 2 are contract-ready as
      written; stage 3 is a reading task whose scope belongs to a Coordinator
      batch, not to an experiment.
    controls:
      - >-
        NULL OBJECT (matched random code, same shape). A uniformly random
        [n, k] binary code at the same n and k. FORCED VALUE DERIVED BEFORE THE
        RUN: its probability of lying in the Goppa set is at most 2^s with s the
        sparsity exponent, so at toy parameters where exhaustive enumeration is
        possible the measured membership rate must be 0 out of the sampled
        codes, and at (m, t) = (4, 2), n = 16, k = 8 the exact Goppa-set size is
        enumerable and the exact fraction is computable rather than bounded.
        This null CAN FAIL: at very small parameters the Goppa set is NOT sparse
        and a random code may well be Goppa, which would be a measured
        finite-size fact and a warning against reading the asymptotic sparsity
        into small cells.
      - >-
        POSITIVE CONTROL (the effect MUST appear). The enumeration routine must
        recover, at (m, t) = (4, 1), the count of monic irreducible LINEAR
        polynomials over F_16, which is 16 -- and every such g has a root in
        F_16 = L, so every one must be REJECTED by the g(alpha_i) != 0
        precondition and the admissible count must be EXACTLY 0. An enumerator
        that returns anything other than 0 there is not applying the
        precondition and no other cell it produces is interpretable.
      - >-
        GRADED CONTROL (five cells, monotonicity reported). The (m, t) ladder of
        Part D extended, with the ratio (distinct codes)/(irreducible g count)
        reported per cell. FORCED: exactly 1.00 at every cell under the
        injectivity prediction. A ladder that departs from 1.00 at a single cell
        localises the failure; a ladder that departs everywhere indicates the
        enumerator, not the mathematics.
      - >-
        SANITY CONTROL ON THE COUNTING (zero compute). The Gaussian binomial
        log2 must satisfy k*(n-k) <= log2 <= k*(n-k) + 2 for all five parameter
        sets. If it does not, the second-term assumption is wrong and the
        sparsity headline must be restated with the exact value.
    required_metrics:
      - per parameter set (m, n, t, k, m*n + m*t, exact log2 Gaussian binomial, sparsity exponent s)
      - per (m, t) cell (irreducible count from the necklace formula, admissible count after the no-root precondition, distinct-code count, ratio)
      - the (4,1) positive-control count, which must be 0
      - three written ceiling-transfer dispositions, each APPLIES / FAILS-WITH-NAMED-OBSTRUCTION / UNRESOLVED-WITH-OBSTACLE-NAMED
      - verbatim status of the two relayed complexity facts (verified from primary text, or ABSENT with routes tried)

  falsification_conditions:
    - >-
      The exact Gaussian binomial makes s substantially different from the
      derived value. The headline number is then wrong and must be superseded
      before anything cites it.
    - >-
      Part D injectivity fails at (4, 2). The key-count refinement is then
      wrong, collisions exist inside the irreducible stratum, and the correct
      response is to characterise them -- which would be a better result than
      the prediction it replaces.
    - >-
      The relayed SLIP ceiling is not as reported. Part B and Part C both lose
      their premise and must be withdrawn in a superseding record.
    - >-
      A published source is found that already states the McEliece structural
      problem's position relative to AM intersect coAM. The transfer's novelty
      claim is then FALSE and the deliverable becomes a corpus entry pointing at
      that source.
    - >-
      Stage 3 produces three UNRESOLVED dispositions with no obstacle named.
      Under inventor-protocol section 4 that is a fatigue report, its honest
      status is unverified, and it does not discharge the proposal.

  confounders:
    - >-
      SMALL-CELL NON-SPARSITY. At (m, t) = (4, 2) the Goppa set is a large
      fraction of the code set, so nothing about the toy cells supports the
      asymptotic sparsity claim and the toy cells are used ONLY to check
      injectivity. Reading one into the other is the error this note exists to
      forbid.
    - >-
      UPPER BOUND VERSUS COUNT. m*n + m*t bounds the keys, not the distinct
      codes. Every sentence must say which it is. The sparsity conclusion is
      safe under the bound; the key-entropy conclusion is not, and is stated as
      an upper bound throughout.
    - >-
      RELAYED COMPLEXITY THEORY. Two of the three load-bearing complexity facts
      are recalled or relayed. A complexity-theoretic conclusion built on an
      unread theorem is exactly the failure mode KN-OPEN-3f7a21 documents at
      corpus scale, and the mitigation is that Part C is stated as a conditional
      whose antecedent is open.
    - >-
      APPEARANCE OF STRENGTH. "The assumption is information-theoretically
      false" reads like a break and is not one. It is true of essentially every
      public-key scheme and is stated here for its DISCIPLINARY value -- it fixes
      what a distinguisher result can and cannot mean for this goal -- not as a
      finding about Classic McEliece.

  heuristic_assumptions:
    - id: HEUR-CC-1
      statement: >-
        None of the three parts rests on a distributional or random-model
        heuristic. Part A is exact counting, Part D is exhaustive enumeration,
        and Parts B and C are stated as conditionals whose antecedents are
        explicit. This entry exists to record that fact rather than to leave the
        field empty, and to record that the load-bearing assumptions are
        EVIDENTIARY -- three unread sources -- not mathematical.
      rigorous_support: >-
        Direct: the counting is finite and exact; the enumeration is exhaustive
        at the tested cells; the conditionals carry their antecedents.
      validation_plan: >-
        Exact integer arithmetic with the Gaussian binomial computed rather than
        approximated, and exhaustive enumeration with the enumerator validated
        by the (4, 1) positive control before any cell is reported.

  target_complexity:
    exponent_moved: >-
      NONE, and no algorithm is proposed. What is produced is (i) an exact
      sparsity exponent, roughly -8281884 at mceliece6960119, which is a number
      this corpus does not have; (ii) an explicit witness-size bound of
      m*n + m*t bits placing Goppa Code Distinguishing in NP; and (iii) a
      conditional non-reducibility statement. Exponent-first ambition is
      answered honestly here: this proposal moves no exponent and says so, and
      it is worth running because it is nearly free, because it disciplines
      every distinguisher sentence the goal will write, and because a ceiling
      argument is the one kind of result that can rule out an entire class of
      future reductions at zero compute.
    memory_exponent: n/a. No algorithm.
    best_known: >-
      NOT ASSERTED. No complexity figure for any McEliece attack appears in this
      record.
    hidden_overhead: >-
      n/a for the audit itself. The enumeration at (6, 2) is the largest cell and
      is bounded by the number of monic irreducible quadratics over F_64, which
      is (64^2 - 64)/2 = 2016 codes of length at most 64 -- trivial.

  dominated_by: >-
    n/a (no algorithm, no cost claim, no Pareto point). Rows checked and listed.
    TIME: nothing proposed to be beaten. MEMORY: same. DATA/QUERIES: the audit
    consumes public parameters and makes no queries. PREPROCESSING: none. On the
    QUESTION -- where does Classic McEliece's structural assumption sit
    complexity-theoretically -- the incumbent in this corpus is EMPTY: grep of
    knowledge/ and ledger/ finds the AM-intersect-coAM ceiling only in
    KN-OPEN-027/028 inside the HAWK lattice lineage, and no code-based record
    references it. Externally the incumbent is the published complexity
    literature, which this record does not claim priority over and has not read.
    Absence of a search result is not evidence something was not tried
    (AGENTS.md retrieval policy).
  sota_delta: >-
    No attack; conceptual, measurement and scoping contribution only.
    Quantitatively: the corpus goes from zero to (a) five exact sparsity
    exponents, the largest-parameter one being about -8.28 million; (b) an
    explicit NP witness bound of m*n + m*t bits, 92027 at mceliece6960119;
    (c) one conditional non-reducibility statement with an explicit open
    antecedent; and (d) three named dispositions on the ceiling transfer. Against
    the published state of the art the delta is zero on every axis and no
    priority is claimed.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.90 that Part A's sparsity computation and Part D's injectivity ladder come
    out as predicted, because both are finite exact computations on parameters
    already transcribed and independently recomputed, and because the only way
    they fail is a derivation error that the controls are built to catch. It is
    not 1.00 because the Gaussian-binomial second term has not been evaluated
    and because injectivity is a genuine prediction that the known g-versus-g^2
    collision shows is not automatic.
    0.25 that Part B's ceiling transfer reaches a positive disposition -- that
    is, that some formulation of Classic McEliece's structural assumption is
    shown to lie in coAM. Low because the named obstruction is real: the
    set-size protocol proves largeness and the Goppa set is sparse, and this is
    a structural mismatch rather than a gap in effort. Not lower because the
    permutation-equivalence formulation is a genuinely different object where
    the classical route is recalled to work, because a reduction between the two
    formulations is exactly the kind of thing the code-equivalence literature
    contains, and because the corpus's own record shows this program's confident
    negatives about a lane being defective on audit four times out of five in
    the one case where a red team checked (DEC-20260805-2be965).
    Overall this is filed at medium rather than high priority because its
    strongest half is a scoping correction rather than a research result, and
    the record says so.
