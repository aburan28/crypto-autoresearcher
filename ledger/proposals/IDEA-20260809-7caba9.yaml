idea:
  id: IDEA-20260809-7caba9
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    Round-by-round soundness versus the quoted bit level: measure the gap the
    Fiat-Shamir transform introduces per round
  class: measurement
  claim: >-
    The soundness of an interactive protocol and the soundness of its Fiat-Shamir
    transform differ, and the difference accumulates with the number of rounds.
    The claim is that this gap is measurable on a reference protocol by comparing
    the interactive forgery probability with the non-interactive one at matched
    parameters, that it grows with round count in a stateable way, and that the
    growth rate is what determines how many rounds a given bit level can afford.
  mechanism: >-
    Run the same protocol interactively with a real verifier providing challenges,
    and non-interactively with the transform, measuring the empirical forgery
    probability of a cheating prover with a declared strategy in each mode at
    matched parameters and round counts.
  why_not_a_renamed_known_approach: >-
    The theoretical relationship is developed in the round-by-round soundness
    literature. Measuring the gap empirically on one implementation across round
    counts is what turns a theorem shape into a number a parameter chooser can
    use.
  predictions:
  - observable: interactive versus non-interactive forgery probability at matched parameters
    metric: ratio, per round count
    predicted: Non-interactive strictly easier, with the ratio growing in round count. A flat ratio would contradict the accumulation account.
  - observable: implied bits lost per round
    metric: bits per round
    predicted: A small number of bits per round; if it is large, the practical implication for many-round protocols is significant and must be stated carefully rather than extrapolated.
  minimal_test: >-
    Matched runs at three round counts, with the cheating strategy declared in
    advance, at least ten thousand trials per cell, reporting empirical
    probabilities with confidence intervals.
  controls:
  - 'STRATEGY DECLARATION: the cheating strategy is fixed before measurement; a strategy tuned per mode makes the comparison meaningless.'
  - 'MATCHED-RANDOMNESS CONTROL: the same randomness budget in both modes.'
  falsification_conditions:
  - The ratio does not grow with round count.
  - The declared cheating strategy is too weak to produce measurable forgery probabilities, in which case no gap can be measured and the record says so.
  interpretation_limits: >-
    An empirical gap under one cheating strategy is a lower bound on the gap; a
    better strategy could widen it. The record states this explicitly, since
    reporting a measured gap as the gap is the obvious misreading.
  sota_delta: 'No attack. Delta: an empirical per-round cost of the transform, measured rather than bounded.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for round-by-round soundness: no records. WEB NOT CHECKED.'
  source_refs:
  - Round-by-round soundness references -- RECALLED, REQUIRED READS.
