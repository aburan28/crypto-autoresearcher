  lossy_projection_identifiability_audit:
    projection: >-
      (alpha_0, kappa, u, seed) - the full cost law of the algorithm under a
      counting convention - projected to the single scalar
      alpha_hat = log_2 C / b, and then to the binary verdict
      [CI entirely below 1/2].
    what_is_discarded: >-
      alpha_0 and kappa are discarded SEPARATELY and retained only in the
      combination alpha_0 + log_2(kappa)/b. The projection is not merely lossy;
      it is lossy in precisely the direction that matters, because it collapses
      the two parameters the criterion needs to distinguish into one coordinate.
    why_genuinely_lossy: >-
      Genuinely lossy: the fibre over an observed alpha_hat = a at a fixed b is
      the one-parameter family {(alpha_0, kappa) : alpha_0 + log_2(kappa)/b = a},
      which contains points with alpha_0 < 1/2, alpha_0 = 1/2 and alpha_0 > 1/2
      for any a. This is not a change of coordinates: no map recovers
      (alpha_0, kappa) from alpha_hat at one cell.
    why_compatible_with_the_operations: >-
      Fully compatible, and that is what makes it dangerous. alpha_hat
      propagates deterministically through every downstream step of the frozen
      protocol - primary coordinate selection, replica aggregation, t-interval,
      predicate evaluation - with no step at which the discarded information
      would be noticed missing.
    is_it_only_a_change_of_coordinates: >-
      NO, and the mirror failure is the one that applies here. The
      (Delta, Pi) = (x XOR y, x*y) char-2 failure named in
      docs/inventor-protocol.md section 2 is "nothing discarded, nothing
      gained". This is its mirror: the projection discards exactly the
      distinction the consumer needs, while remaining perfectly well-behaved. I
      checked for BOTH failures. The change-of-coordinates failure is ABSENT
      (the map is not invertible at one cell). The constant-across-instances
      failure is ABSENT TOO (alpha_hat does vary with the instance) - but a
      third failure is present, which the two-failure taxonomy does not name and
      which this record therefore states explicitly: the projection VARIES for
      the wrong reason. Its instance-to-instance spread is entirely seed noise,
      while its systematic offset is entirely convention. Zero comparator spread
      is not the tell here; spread that is orthogonal to the question is.

  assumptions:
    - >-
      That the cost law is of the form kappa * ell^{alpha_0} * u(ell) with u
      subpolynomial over the tested range. IF the true toy-range cost is not
      even approximately of this shape - which is entirely possible at
      b in {8,...,16}, where asymptotics need not have begun - then BOTH
      estimators are meaningless at the sealed ladder, and that is a STRONGER
      form of the same conclusion, not a rescue of the pointwise one.
    - >-
      That the protocol's confidence_interval_rule is read correctly as an
      interval over seed replicas at a fixed cell rather than over ladder cells.
      The verbatim text is "Across sealed replicas (minimum 3), compute a
      predeclared CI for alpha_primary". Stage 0 of the contract re-reads this
      with a second pair of eyes and RECORDS the reading before anything else
      runs, because the whole audit collapses if the protocol already intended a
      cross-cell fit.
    - >-
      That Pollard rho's exponent is 1/2. This is assumed, not measured, and is
      the audit's fixed point: it is the only way to have a null object whose
      true value is known.

  predictions:
    - metric: >-
        alpha_hat_pointwise minus planted alpha_0, on the synthetic cost oracle
        with planted (alpha_0, kappa), measured at b in {8,10,12,16,20,32}
      direction: different
      minimum_effect: >-
        EXACTLY log_2(kappa)/b, to within the planted noise. Predicted before
        any run, to 4 decimal places per cell: for kappa = 2^{-8} the deviations
        are -1.0000, -0.8000, -0.6667, -0.5000, -0.4000, -0.2500 at
        b = 8,10,12,16,20,32. IF THE MEASURED DEVIATION IS NOT THIS, the
        derivation in `mechanism` (1) is wrong and this proposal is falsified at
        Stage 2 for a few seconds of compute.
    - metric: >-
        alpha_slope on the SAME synthetic data, fitted across the ladder
      direction: different
      minimum_effect: >-
        EXACTLY alpha_0, independent of kappa, to within the noise-driven
        standard error sqrt(2)*sd(log_2 X)/((b2-b1)*sqrt(R)). This is the
        POSITIVE CONTROL: if alpha_slope does not recover the planted alpha_0
        for every planted kappa, the harness is broken and NO negative result
        about the pointwise estimator may be reported.
    - metric: >-
        replica count R* at which a Student-t CI on replica alphas first
        excludes 1/2, for real Pollard rho at each of b in {8,10,12,16,20,32}
      direction: different
      minimum_effect: >-
        R* IS PREDICTED TO BE INDEPENDENT OF b, within replicate scatter - the
        b-dependence cancels between the bias and the CI half-width (derivation
        in `mechanism` (2)). This is the sharpest available forced value because
        it is a QUALITATIVE invariance, not a number: if R* falls with b, the
        cancellation is wrong and the objection weakens. A ratio
        max(R*)/min(R*) exceeding 4 across the ladder falsifies it.
    - metric: >-
        sign of (alpha_rho_hat - 1/2) under c = 1 versus c = 2 charged group
        operations per walk step, at every ladder cell
      direction: different
      minimum_effect: >-
        OPPOSITE SIGNS AT EVERY CELL, under the sqrt(pi/4) location constant. If
        the measured kappa_rho at c = 1 turns out to exceed 1, both charges give
        the same sign and the sign-flip demonstration fails - the magnitude
        objection survives but the rhetorical one does not, and the record must
        say so.
    - metric: >-
        PRED-ALPHA-EXCLUDES-HALF-TOY evaluated on Pollard rho itself, using the
        protocol's own alpha CI clause in isolation, at R = 200 replicas
      direction: different
      minimum_effect: >-
        FIRES (i.e. the clause is satisfied by an algorithm of exponent exactly
        1/2) at every cell where the measured log_2(kappa_rho) is negative. A
        clause satisfied by the baseline it is meant to beat cannot discriminate.
        If it does NOT fire anywhere, the objection is quantitatively weaker than
        stated and the record is corrected downward.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the audit; the whole
      thing is minutes of pure-Python compute and needs no solver.
      STAGE 0 (zero compute, ~30 min): re-read the frozen protocol's
      confidence_interval_rule and per_coordinate_formula and RECORD the reading
      before anything else. If the protocol is found to specify a cross-cell fit
      after all, STOP - the objection does not apply as stated and the audit
      converts into a note that the pointwise reading was available and should
      be closed off explicitly.
      STAGE 1 (zero compute, ~1 h): write out the bias identity, the CI
      cancellation, and the slope-estimator variance in full and have them
      checked. A single algebra error here ends the line.
      STAGE 2 (seconds): synthetic cost oracle. Plant (alpha_0, kappa) on a
      grid, generate replicate costs with a declared noise law, run BOTH
      estimators, check the forced deviations.
      STAGE 3 (minutes): real Pollard rho on deterministic toy prime-field
      curves at b in {8,10,12,16,20,32} up to the protocol's own hard_cap_bits,
      measuring kappa_rho, sd(log_2 X), R*, and the c=1 vs c=2 sign.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL):
        Pollard rho itself. It has the same shape as the treatment - an
        algorithm with a charged cost vector on the same curves at the same
        cells - and its exponent is known to be exactly 1/2. FORCED VALUE:
        alpha_hat_pointwise = 1/2 + log_2(kappa_rho)/b, with kappa_rho measured
        in the same run. THIS NULL CAN FAIL: if the measured alpha_hat comes out
        at 1/2 within the CI at every cell and every replica budget, the bias is
        empirically negligible, the objection is refuted, and the frozen
        protocol is vindicated at the tested scale.
      - >-
        POSITIVE CONTROL / instrument sensitivity (the effect MUST appear): the
        slope estimator on synthetic data with planted alpha_0 in
        {0.34, 0.40, 0.45, 0.50, 0.55} and kappa in {2^-8, 2^-2, 1, 2^2, 2^8}.
        The slope estimator MUST recover each planted alpha_0 within its
        pre-derived standard error for every kappa. If it does not, the
        implementation is broken and NO negative result about the pointwise
        estimator may be reported at all.
      - >-
        GRADED CONTROL, 6 interior points, monotonicity reported: sweep
        b in {8,10,12,16,20,32} at fixed planted (alpha_0 = 1/2, kappa = 2^-8).
        PREDICTED: |alpha_hat - 1/2| = 8/b, strictly DECREASING in b, hitting
        1.0000, 0.8000, 0.6667, 0.5000, 0.4000, 0.2500. A bias that does NOT
        decay as 1/b localises the failure elsewhere (a non-power-law cost
        term), which is a different and also reportable finding.
      - >-
        SECOND GRADED CONTROL on the parameter meant to destroy the effect:
        sweep the replica count R in {3, 10, 30, 100, 300, 1000} on real rho at
        a fixed cell and report the CI half-width and the exclusion verdict.
        PREDICTED: half-width falls as 1/sqrt(R) while the centre does not move,
        so the false exclusion becomes MORE confident with more data. This is
        the inventor-protocol section 3 tell stated as a measurement.
      - >-
        ARCHIVE CHECK (zero compute): list every prior measurement in this
        corpus of the same observable. Searched this session: EV-ICEX-001 (no
        measurement), the 30 prior ideas in this goal's brief, and
        experiments/ for an ICEX directory - THERE IS NO experiments/EXP-ICEX-*
        DIRECTORY AT ALL. Recorded as unavailable rather than claimed as a
        passed check.
      - >-
        VERDICT-ON-THE-NULL-FIRST (ordering control): the frozen decision rule is
        executed and committed on the rho null arm BEFORE any synthetic
        treatment arm is looked at. If it emits the same label on both, it
        discriminates nothing and must be rewritten before the treatment arm is
        read.
    required_metrics:
      - the verbatim quotation of confidence_interval_rule with its file path and line, recorded at Stage 0
      - per-cell alpha_hat_pointwise and alpha_slope with seeds, for every planted (alpha_0, kappa)
      - measured kappa_rho and sd(log_2 X) per cell, with the walk definition and the group-operation counter convention stated
      - R*(b), the replica count at which the t-CI first excludes 1/2, per cell
      - the c=1 versus c=2 sign table
      - the derived replica budget R > 50 * sd(log_2 X)^2 evaluated at the measured sd

  falsification_conditions:
    - >-
      The synthetic deviation is not log_2(kappa)/b. The core algebra is wrong
      and the proposal is withdrawn as a superseding record.
    - >-
      Real Pollard rho's measured alpha_hat_pointwise contains 1/2 in its CI at
      every cell for every replica budget up to 1000. The bias is empirically
      negligible at the sealed scales and the objection does not bind.
    - >-
      R*(b) falls sharply with b. The b-cancellation in mechanism (2) is wrong,
      enlarging the ladder does fix the problem, and the recommendation changes
      from "replace the estimator" to "extend the ladder".
    - >-
      Stage 0 finds the protocol already specifies a cross-cell fit. The
      objection does not apply and the audit reports that.
    - >-
      The positive control fails: the slope estimator cannot recover a planted
      alpha_0. Nothing negative may be reported at all.

  confounders:
    - >-
      TOY-RANGE NON-ASYMPTOTICS. At b <= 16 an index-calculus cost is not
      plausibly in its asymptotic regime, so u(ell) may be neither subpolynomial
      nor slowly varying. This CONFOUNDS the repair (the slope estimator also
      needs the power law) more than it confounds the objection. It must be
      reported as limiting both, not as limiting only the incumbent.
    - >-
      THE AUDIT IS AIMED AT THIS PROGRAM'S OWN ARTEFACT. Criticising an internal
      frozen protocol is cheap to produce and reads as rigour. The positive
      control and the falsification conditions exist so that a negative outcome
      costs something to reach, and the record explicitly credits what the
      protocol got right (coordinatewise dominance, certificate requirements,
      the zero_gain_rule forbidding minted alpha at R_gain = 0).
    - >-
      SINGLE-COORDINATE READING. The protocol mandates a full cost VECTOR and
      names the alpha CI as one clause among five. This audit isolates that
      clause deliberately, and the record must not be cited as an audit of the
      whole protocol.
    - >-
      MY OWN RECALLED CONSTANTS. Every rho constant in this record is
      RECALLED-UNVERIFIED. If Stage 3's measured kappa_rho differs from both
      candidates, the tabulated numbers in `claim` are wrong as displayed and
      must be superseded, while the identity they illustrate is unaffected.

  interpretation_limits:
    - >-
      A confirming outcome closes NOTHING about the ECDLP. It says the sealed
      toy alpha CI cannot answer the question GOAL-PATH-001 completion clause 1
      poses, and it names the repair. Index calculus over prime fields is
      neither helped nor hurt; no exponent moves; Pollard rho remains the
      baseline; every child goal's mathematics stands exactly as it was.
    - >-
      NO STATUS CHANGE is proposed or implied for the ICEX protocol, for
      EV-ICEX-001, for GOAL-ICEX-001, or for GOAL-PATH-001's next_action. Those
      are Coordinator decisions (AGENTS.md rule 1). This record is a proposal.
    - >-
      THE FROZEN PROTOCOL IS IMMUTABLE and must not be edited. A confirmed
      finding is carried by a NEW superseding protocol version, never by a
      correction to the sealed one.
    - >-
      Toy claim tier, and it may not be raised. Everything measured here happens
      at b <= 32.
    - >-
      FORWARD GUIDANCE IS MANDATORY AND IS GIVEN: what remains open after this
      audit either way is (i) whether the slope estimator's replica budget is
      affordable inside this goal's 86400-second campaign budget, (ii) whether
      the coordinatewise-dominance clause alone can carry the completion
      criterion, and (iii) whether a completion criterion phrased on a cost
      RATIO C_IC/C_rho at matched cells - in which kappa does not cancel but is
      at least charged symmetrically - is better conditioned than either.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NOT LOAD-BEARING FOR THE HEADLINE. The identity
        log(kappa*ell^{a}*u)/log(ell) = a + log(kappa)/log(ell) + log(u)/log(ell)
        is arithmetic and is proved, not assumed. This entry exists to record
        that the headline is unconditional where its consequences are not.
      rigorous_support: Logarithm of a product. Elementary.
      validation_plan: >-
        Symbolic check plus the Stage-2 synthetic grid, where the deviation is
        predicted to 4 decimal places per cell before the run.
    - id: H2
      statement: >-
        FORALL algorithms A in the tested set and FORALL cells b, the per-replica
        charged cost factorises as C_{A,b,r} = kappa_A * ell_b^{alpha_0(A)} *
        X_r with X_r i.i.d. across replicas r and independent of b. Only under
        this factorisation does the bias contribute exactly zero CI width.
      rigorous_support: >-
        NONE THAT IS UNCONDITIONAL, AND THIS IS THE WEAKEST LINK, RECORDED AS
        SUCH. Seed noise need not be multiplicative, need not be
        scale-independent, and for a Groebner-backed index calculus is very
        likely neither. What survives without H2 is weaker but still decisive:
        kappa is not seed-dependent, so its contribution to the CI width is zero
        regardless of the noise law - only the clean formula for R* needs H2.
      validation_plan: >-
        Stage 3 measures sd(log_2 X) at each cell for real rho and reports
        whether it is b-independent. If it is not, R* will not be b-invariant
        and the third prediction is falsified in a way that is informative
        rather than fatal.
    - id: H3
      statement: >-
        Pollard rho on a prime-order subgroup of a toy prime-field elliptic curve
        has time exponent exactly 1/2 in the group order.
      rigorous_support: >-
        The birthday bound gives the upper side under the random-function
        heuristic for the walk, and Shoup-type generic lower bounds give
        Omega(sqrt(ell)) for generic algorithms. BOTH ARE RECALLED, UNVERIFIED
        here; neither is cited to a page. The audit does not need either to be
        exactly right: it needs only that rho's exponent is a KNOWN CONSTANT
        independent of what the estimator reports, which is uncontested in this
        corpus.
      validation_plan: >-
        Not validated - it is the fixed reference point. Its role is declared so
        a reviewer can attack it directly.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED, PROPOSED, OR CLAIMED. The audit
      is about the instrument that would report an exponent. The exponent under
      discussion elsewhere in the series is alpha versus 1/2 for toy prime-field
      index calculus, and this record's whole content is that the sealed
      estimator cannot resolve that comparison at the sealed scales.
    memory_exponent: >-
      n/a. Memory is charged by the frozen protocol as a mandatory cost
      coordinate and the same bias identity applies coordinatewise to it - the
      audit reports the memory coordinate's kappa alongside the time
      coordinate's, because a memory exponent read off one cell is biased for
      exactly the same reason.
    best_known: >-
      Pollard rho / BSGS at ell^{1/2} for generic prime-field ECDLP. Unchanged by
      anything in this record.
    hidden_overhead: >-
      The audit's SUBJECT IS the hidden overhead: log_2(kappa)/b is precisely the
      constant factor leaking into a reported exponent, which is the failure mode
      docs/target-result-profile.md's cost-honesty clause exists to prevent.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed, no algorithm proposed, no Pareto point offered).
    Rows checked before writing that: this proposal offers no time, no memory,
    and no data/query cost against any ECDLP baseline, so there is no frontier
    row for it to sit on. On the QUESTION it audits, the incumbent is the frozen
    ICEX protocol version 1.0.0-review itself, and this record proposes no
    replacement for it, only a named defect and a repair to be evaluated.
    Checked for a prior audit of the same estimator: EV-ICEX-001 and its red-team
    report RT-20260731-023 (READ - checks feed pinning, uncharged imports,
    scalarization, matched baselines; not identifiability); the 30 prior ideas
    listed in this goal's brief (none audits an estimator); experiments/ (no
    EXP-ICEX-* directory exists). Absence of a search result is not evidence that
    no such audit exists (AGENTS.md knowledge-retrieval policy).
  sota_delta: >-
    Zero on every attack axis: time, memory, data, queries, advice, preprocessing.
    Quantitatively, the delta this record offers is on the MEASUREMENT: the
    pointwise estimator's systematic error is |log_2 kappa|/b, which at the
    sealed ladder's largest cell (b = 16) is 0.0625 per factor of 2 in the
    counting convention, against a target effect size of order 0.05; the slope
    estimator's systematic error is (log_2 u(b2) - log_2 u(b1))/(b2-b1), which
    is 0 for any pure power law. The trade is systematic error for variance:
    se(alpha_slope) = sqrt(2)*sd(log_2 X)/((b2-b1)*sqrt(R)), costing
    R > 50*sd(log_2 X)^2 replicas per cell over the sealed span of 8 bits.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the pointwise estimator is shown to be biased by log_2(kappa)/b
    exactly as derived, and 0.55 that real Pollard rho's own alpha CI is
    demonstrated to exclude 1/2 at an affordable replica count - the two are
    different claims and the second is the one that carries rhetorical weight.
    0.85 is not higher because Stage 0 could find that the protocol already
    intended a cross-cell fit (the single most likely way this proposal dies),
    because the toy range may not be power-law at all, and because the frozen
    protocol has already survived one independent red-team pass that this
    proposal does not claim was negligent. It is not lower because the headline
    is arithmetic rather than empirical: a logarithm of a product does not
    depend on anything the run could reveal. 0.55 on the second claim reflects
    genuine uncertainty about kappa_rho's sign and about sd(log_2 X), both of
    which are measured rather than assumed here, and reflects that at R = 3 -
    the protocol's stated minimum - the CI is wide enough that rho very likely
    does NOT exclude 1/2, so the demonstration needs a replica budget the
    protocol does not mandate.
