idea:
  id: IDEA-20260805-bb4488
  question_id: RQ-ICEX-001
  added: '2026-08-05'
  goal_id: GOAL-PATH-001
  title: >-
    The exponent this whole tier ladder exists to measure is not identifiable by
    the estimator that measures it: alpha = log C / log ell carries a
    constant-factor bias log kappa / log ell that the replica CI cannot see, and
    Pollard rho itself - exponent exactly 1/2 by construction - passes the
    protocol's own "CI entirely below 1/2" predicate at every sealed toy cell
  class: control

  claim: >-
    GOAL-PATH-001's PRIMARY completion criterion is that GOAL-ICEX-001 reach a
    committed decision on a charged toy IC-vs-rho exponent. The estimator that
    decision is defined on is fixed verbatim in the frozen protocol
    (coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
    ic_exponent_protocol.yaml, exponent_definition.per_coordinate_formula, READ
    in full this session):
      alpha_coord[c] := log(C_IC[c]) / log(ell)
    evaluated AT A SINGLE CELL, with the confidence interval taken
    "across sealed replicas (minimum 3) ... Student-t on replica alphas"
    (confidence_interval_rule, verbatim).
    THE ALGEBRA IS ONE LINE. If the true cost law of an algorithm is
    C(ell) = kappa * ell^{alpha_0} * u(ell) with u subpolynomial, then
      alpha_measured(ell) = alpha_0 + log(kappa)/log(ell) + log(u)/log(ell).
    The bias term log(kappa)/log(ell) is IDENTICAL IN EVERY REPLICA at a fixed
    cell, because kappa is a property of the algorithm and the counting
    convention and not of the seed. It therefore contributes EXACTLY ZERO width
    to a replica CI, and the CI concentrates - as the replica count grows - on
    alpha_0 + log(kappa)/log(ell), never on alpha_0. More replicas make a wrong
    conclusion MORE significant, which is the canonical artifact tell of
    inventor-protocol section 3 running in reverse.
    THE FORCED VALUE THAT MAKES THIS DECIDABLE AT ZERO COMPUTE. Apply the
    protocol's own estimator to the protocol's own baseline. Pollard rho has
    alpha_0 = 1/2 exactly, by construction and by theorem, not by measurement.
    Its charged group-operation cost is kappa_rho * ell^{1/2} for a kappa_rho
    that is certainly not 1 (it absorbs the birthday constant, the group
    operations charged per walk step, the distinguished-point overhead, and the
    cycle-detection tail). Hence
      alpha_rho(b) = 1/2 + log_2(kappa_rho)/b  at  ell ~ 2^b,
    which is NOT 1/2 at any finite b, and whose SIGN flips on an implementation
    detail: at the sealed ladder bit sizes {8,10,12,16} one group operation per
    walk step and the textbook birthday constant sqrt(pi/4) give
    0.4782 / 0.4826 / 0.4855 / 0.4891 - all strictly BELOW 1/2, i.e. Pollard rho
    SATISFIES the predicate primary_CI_entirely_below_1_2 - while charging two
    group operations per step gives 0.6032 / 0.5826 / 0.5688 / 0.5516, all
    strictly ABOVE. Same algorithm, same exponent, opposite verdict, decided by
    a counter convention the protocol leaves open.
    THIS PROPOSAL CLAIMS NO ATTACK AND MOVES NO EXPONENT. It claims that the
    instrument named in GOAL-PATH-001's completion criterion cannot answer
    GOAL-PATH-001's completion question, states the repair (a slope estimator
    across ladder cells, in which kappa cancels identically), and prices the
    repair (variance amplified by 1/Delta log ell, hence a replica budget, hence
    a real cost the Coordinator can weigh). BOTH outcomes are useful: if the
    derivation is wrong the audit finds where instance information enters the
    estimator, and if it is right the tier series learns - before spending its
    remaining budget on G4-G6 feeds - that its terminal decision rule needs
    rewriting, which is far cheaper now than after the feeds exist.

  object_first_candidate:
    tracked_object: >-
      The ESTIMATOR ITSELF as the tracked object: the scalar
      alpha_hat = log C / log ell followed through the pipeline
      (charged cost vector -> primary coordinate -> per-replica alpha ->
      Student-t CI -> PRED-ALPHA-EXCLUDES-HALF-TOY -> Coordinator decision ->
      GOAL-PATH-001 completion criterion clause 1). The state it is a projection
      of is the pair (alpha_0, kappa) - the exponent and the constant of the true
      cost law - plus the seed. What is followed is how much of (alpha_0, kappa)
      survives each arrow.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens for this proposal: index calculus and
      point decomposition; summation polynomials and Groebner solving-degree
      instrumentation; Semaev/Gaudry/Diem/Petit-Kosters relation collection;
      isogeny and endomorphism transfer; lattice and small-root methods;
      generic-group lower bounds; xedni/lifting; multi-target amortisation;
      factor-base geometry. None of them is the lens here. This proposal does
      not propose, improve, or evaluate any ECDLP algorithm. It audits a
      MEASUREMENT that this program's own tier series has already frozen, which
      is the one move the off-limits rule does not forbid and which
      GENERATION_CONTRACT section "What makes an angle unattacked" ranks first
      ("attack the measurement, not the target").
    newness_score: >-
      The identity alpha_hat = alpha_0 + log kappa / log ell is elementary and
      certainly known to anyone who has fitted an exponent. What is not in this
      corpus - checked against the 30 prior ideas listed in this goal's brief,
      against EV-ICEX-001, and against the frozen protocol's own controls block
      - is its application as a PRE-REGISTERED FORCED VALUE to the specific
      estimator on which GOAL-PATH-001's primary completion criterion depends,
      with Pollard rho used as the null object whose exponent is known exactly.
      The protocol's controls block anticipates single-scalar narration
      (reject_single_scalar_C_IC) and fabricated alpha at zero gain
      (R_gain_zero_with_fabricated_alpha); it does NOT anticipate a
      well-formed, honestly computed alpha that is biased by a constant.
    testability_score: >-
      Maximal and nearly free. Stage 1 is pen-and-paper algebra. Stage 2 is a
      synthetic cost oracle with a planted (alpha_0, kappa) - pure Python integer
      and float arithmetic, seconds. Stage 3 is a real Pollard rho on toy prime
      curves up to the protocol's own hard_cap_bits: 32, where the expected walk
      length is ~2^16 steps, i.e. seconds per replica. Measured this session:
      numpy 2.4.6 IMPORTS in this container; `import sage` FAILS
      (ModuleNotFoundError), so src/ic_first_fall_fast.py does not load. Nothing
      in this proposal needs Sage, a Groebner engine, or a solver.
    survival_score: >-
      The object survives every arrow in the pipeline - that is exactly the
      complaint. alpha_hat propagates deterministically and cleanly all the way
      to the Coordinator decision while carrying an additive term that has
      nothing to do with the quantity the decision is about. A projection can be
      lossy, compatible, deterministic and still wrong, and the failure is only
      visible when it is applied to an object whose true value is known.

  mechanism: >-
    DERIVED HERE, NOT CITED.

    (1) THE BIAS IDENTITY. Let an algorithm's charged cost on a group of order
    ell obey C(ell) = kappa * ell^{alpha_0} * u(ell) with u(ell) subpolynomial
    (log u / log ell -> 0). The protocol's estimator is
    alpha_hat(ell) = log C(ell) / log ell. Substituting,
      alpha_hat(ell) = alpha_0 + log(kappa)/log(ell) + log(u(ell))/log(ell).
    Writing ell = 2^b and logs base 2,
      alpha_hat(b) - alpha_0 = log_2(kappa)/b + log_2(u)/b.
    At the protocol's sealed ladder b in {8,10,12,16}, the coefficient of
    log_2(kappa) is 1/b = 0.1250, 0.1000, 0.0833, 0.0625. A single doubling of
    the counting unit therefore moves the measured "exponent" by 0.0625 at the
    LARGEST sealed cell. The quantity the criterion asks about - whether alpha
    is below 1/2 - is a question about alpha_0, and any candidate effect worth
    calling an exponent improvement (say alpha_0 = 0.45, effect 0.05) is
    SMALLER than the bias produced by one bit of convention.

    (2) THE CI SEES NONE OF IT. kappa is a function of the algorithm, the cost
    coordinate, and the counting convention; it is not a function of the seed.
    Across sealed replicas at a fixed cell, therefore, every replica's alpha
    carries the SAME additive log_2(kappa)/b. A Student-t interval on replica
    alphas estimates the dispersion of the seed-dependent part alone. Formally,
    if per-replica cost is C_r = kappa * ell^{alpha_0} * X_r with X_r i.i.d.
    seed noise, then alpha_r = alpha_0 + (log_2 kappa + log_2 X_r)/b, so
      E[alpha_r] = alpha_0 + (log_2 kappa + E log_2 X)/b,
      sd(alpha_r) = sd(log_2 X)/b,
    and the half-width of a Student-t CI on R replicas is
    t_{R-1,0.975} * sd(log_2 X) / (b * sqrt(R)). The CI EXCLUDES 1/2 for an
    algorithm with alpha_0 = 1/2 exactly when
      t * sd(log_2 X) / sqrt(R) < |log_2 kappa + E log_2 X|,
    an inequality in which b HAS CANCELLED ENTIRELY. The replica count at which
    the artifact becomes "significant" is therefore SCALE-FREE: enlarging the
    ladder does not help, and running more replicas makes the false exclusion
    MORE confident, not less. That is the structural tell inventor-protocol
    section 3 names - a quantity that should decay as the destroying parameter
    grows and does not.

    (3) THE NULL OBJECT IS ALREADY IN THE PROTOCOL. The protocol's own baseline
    is matched Pollard rho, whose exponent is 1/2 by the birthday argument -
    known exactly, independent of any measurement, and not in dispute anywhere
    in this corpus. Under the standard random-function heuristic the walk length
    T satisfies T = sqrt(ell) * X for a mean-order-one random variable X, so
    with c group operations charged per walk step,
      kappa_rho = c * (the location constant of X),
      alpha_rho(b) = 1/2 + log_2(kappa_rho)/b.
    TWO TEXTBOOK CONSTANTS ARE IN CIRCULATION FOR X AND THIS PROPOSAL ASSERTS
    NEITHER: sqrt(pi/4) = 0.8862 (log_2 = -0.1743) and sqrt(pi/2) = 1.2533
    (log_2 = +0.3257). BOTH ARE RECALLED, UNVERIFIED and are to be MEASURED in
    the experiment, not taken from this record. The point is convention-robust:
    kappa_rho != 1 under every one of them, so alpha_rho(b) != 1/2 at every
    finite b, and the tabulated numbers in `claim` are computed from the first
    constant at c = 1 and c = 2 purely to display the magnitude and the SIGN
    FLIP. A third, independent convention ambiguity compounds it: the protocol
    prescribes a t-interval on REPLICA ALPHAS, i.e. the mean of a logarithm, so
    the operative constant is the GEOMETRIC mean of X; an equally natural
    reading - alpha computed from the mean cost - uses the ARITHMETIC mean. For
    a Rayleigh-shaped X these differ by a factor of about 4 in log_2(kappa)
    (RECALLED-UNVERIFIED, and a Stage-2 measurement in the contract).

    (4) THE REPAIR, AND ITS PRICE, DERIVED. Across two cells b1 < b2 on the same
    algorithm and the same counting convention, the slope estimator
      alpha_slope = (log_2 C(b2) - log_2 C(b1)) / (b2 - b1)
    cancels kappa IDENTICALLY - it is a difference of logs of a common factor -
    and leaves alpha_0 + (log_2 u(b2) - log_2 u(b1))/(b2 - b1), which vanishes
    for u subpolynomial as the ladder lengthens. The price is variance
    amplification: with per-cell replica means each carrying standard error
    sd(log_2 X)/sqrt(R),
      se(alpha_slope) = sqrt(2) * sd(log_2 X) / ((b2 - b1) * sqrt(R)).
    Over the protocol's own sealed span b2 - b1 = 16 - 8 = 8, resolving an
    effect of 0.05 at two standard errors requires
      sqrt(2) * sd(log_2 X) / (8 * sqrt(R)) < 0.025,
    i.e. sqrt(R) > 7.07 * sd(log_2 X), so R > 50 * sd(log_2 X)^2 replicas per
    cell. THIS IS THE NUMBER THE TIER SERIES DOES NOT HAVE AND SHOULD HAVE
    BEFORE IT COMMISSIONS FEEDS: it converts "measure the exponent" into a
    concrete replica budget that can be compared against
    campaign_budget.total_wall_clock_seconds = 86400 on this goal.

    (5) WHY THE PROTOCOL'S OTHER GUARDS DO NOT CATCH IT. The advantage predicate
    PRED-ALPHA-EXCLUDES-HALF-TOY is a conjunction of five clauses, and the other
    four - R_gain positive with certificates, no coordinatewise domination by
    C_rho on the critical set, valid charged feeds, claim-boundary echo - are
    real and are not disputed here. But they are gates on ADMISSIBILITY, not on
    identifiability: a pipeline can produce genuine relations, genuine
    certificates, and a genuine non-dominated cost vector, and STILL have its
    alpha determined by kappa rather than by alpha_0. Conversely the
    coordinatewise-dominance clause is the one guard that is convention-robust,
    and the audit's constructive recommendation is that it, not the alpha CI,
    should carry the weight of the criterion.

  novelty_status: unverified

