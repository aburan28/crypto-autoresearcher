idea:
  id: IDEA-20260807-812fd2
  question_id: RQ-AES-001
  added: '2026-08-07'
  title: >-
    GHASH's power weighting blocks set-aggregate transfer into the tag, and
    the exact fibre-constancy condition under which it would not (A2-9,
    absorbed A2-4's affine-combiner framing per INDEX.md ⚑6)
  class: control

  claim: >-
    Formalization of catalogue entry A2-9 (A2.md, lines 756-834), which per
    INDEX.md section 2a row ⚑6 absorbed A2-4's TO-COMB taxonomy: A2-4's
    original claim was that a reduced-round set-aggregate integral property
    transfers through AFFINE output combiners with constant coefficients,
    treated here as a near-forced algebraic consequence and NOT the subject
    of this proposal's success criterion. A2-9's genuinely open content is
    the GENUINELY UNDETERMINED part: GHASH's digest Sigma_c C_c * H^(n-c) is
    GF(2^128)-LINEAR with KEY-DERIVED, BLOCK-POSITION-DEPENDENT weights, not
    affine with constant coefficients, and a weighted aggregate over a
    balanced multiset vanishes for every value distribution IFF the weight
    function is constant on each level set of the round-3 byte-value map.
    Predicted: (i) at H=1 (free known-answer gate; GHASH collapses to plain
    XOR) the r=4 balance is visible in the digest alone, 16/16 in trials;
    (ii) at random H the digest is uniform, null probability 2^-128; (iii)
    the discriminator is the WEIGHT PARTITION, not H's size or algebraic
    identity — a 2-valued weight sequence on even-size blocks restores
    transfer, an all-distinct-weight sequence destroys it. The success
    criterion this proposal targets is exactly (iii): WHICH CLASS OF
    COMBINER (constant-on-fibres vs not) the observed behavior falls into,
    never a restatement of the A2-4 affine identity itself.

  mechanism: >-
    See A2.md lines 765-834 for the full derivation and the charged cost
    (rides A2-5's counter-coset sweeps; one extra GF(2^128) multiply-
    accumulate per block over 2^32 blocks per arm at ~15-40 cycles/block
    software cost, 5 weight arms x 4 round counts, ~30-45 minutes on 4
    cores, <100 MB RSS, zero oracle calls, no QRAM).

  novelty_status: unverified

  source_refs:
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A2.md (A2-9, lines 756-834)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/INDEX.md (section 2a, row ⚑6)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md (section 4c)
    - ledger/goals/GOAL-AES-001.yaml
    - ledger/questions/RQ-AES-001.yaml
    - ledger/hypotheses/H-AES-ecf3ad.yaml (nearest prior-art neighbour, distinguished per A2.md lines 825-832)

  review_refs: []
  disposition: proposed

  interpretation_limits:
    - >-
      Ceiling medium for the algebraic fibre-constancy condition (exact and
      general to any weighted digest, not only GHASH); ceiling toy for each
      measured arm. Explicitly a MODE/COMPONENT result about GHASH/AES-GCM,
      not a statement about AES. No forgery, no authentication break, no
      weak-key claim; H=1 is used as an instrument setting, never an attack.
    - >-
      Risk band high_risk: prediction (iii)'s sharp fibre-constancy threshold
      is the part most likely to be wrong because round-3 level sets are only
      approximately uniform below coset dimension 32; a grey zone is reported
      as a grey zone, never as absent.
    - >-
      The A2-4 affine-combiner identity is a near-forced algebraic
      consequence and is USED, not re-tested, by this proposal; it is not the
      subject of this proposal's success criterion.

  recorded_by: coordinator
  recorded_at: '2026-08-07'
