idea:
  id: IDEA-20260809-7e45f5
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    The canonical transform as null object, with a one-element removal as the
    positive control that proves the harness still bites
  class: control
  claim: >-
    A transform that hashes the statement, the parameters, every prior message,
    the round index and a domain separator, in a fixed order with unambiguous
    encoding, should admit no certificate. The claim is that running the complete
    attack suite against it yields nothing, and that removing exactly one element
    restores certificates at the rate recorded in the enumeration — the paired
    result that makes every negative cell in this goal interpretable.
  mechanism: >-
    Instantiate the canonical transform; run every attack; expect empty. Then
    remove one element and rerun, expecting the enumeration's recorded outcome for
    that class. Repeat the removal for each element to get a full paired matrix.
  why_not_a_renamed_known_approach: >-
    Hashing everything is the standard advice. Using it as a NULL OBJECT with
    per-element positive controls, so that the harness's power is measured rather
    than assumed, is the discipline the inventor protocol requires and the reason
    this goal's negatives are reportable.
  predictions:
  - observable: certificates against the canonical transform
    metric: count
    predicted: Zero. Any nonzero count means either the transform is not canonical as implemented or an attack class exists outside the enumeration -- and the second would be a genuine finding.
  - observable: certificate recovery on each one-element removal
    metric: per-element boolean
    predicted: Recovery for every element that the enumeration says is load-bearing; a non-recovery identifies an element whose necessity is protocol-specific.
  minimal_test: >-
    Full attack suite against the canonical transform and against each
    one-element removal, at matched parameters and budgets, reported as a paired
    matrix.
  controls:
  - 'ENCODING-AMBIGUITY CHECK: the canonical transform must use unambiguous encoding, since a length-ambiguous concatenation is itself an omission in disguise and would make the null object fail for the wrong reason.'
  - 'MATCHED BUDGETS across all cells.'
  falsification_conditions:
  - A certificate against the canonical transform.
  - Non-recovery on a removal the enumeration says is load-bearing, indicating lost harness power.
  interpretation_limits: >-
    Emptiness against the canonical transform at a declared budget is not a
    soundness proof and may never be written as one (AGENTS.md rule 3).
  sota_delta: 'No attack. Delta: the control pair that turns this goal''s negatives from silence into bounded statements.'
  dominated_by: Not dominated by any corpus record; a precondition for IDEA-20260809-7c0817's scoring.
  estimated_cost: Implementation small; compute low.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for canonical transform control: no records. WEB NOT CHECKED.'
