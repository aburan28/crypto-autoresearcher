        violations; mu(R) = R + T' for all 117 points with omega = 35,
        T' = (1, 62, 0) and ZERO violations; sigma^3 = id; sigma has 0 fixed
        points on the curve; negation equals the coordinate swap on all 117
        points with the swap having exactly 1 fixed point (O, since #C is odd).
        Known-false control: the claim that the swap is a translation, which the
        fixed point refutes.
    - metric: gamma_order_and_freeness
      direction: same
      minimum_effect: >-
        |<sigma, mu>| = 9 exactly in PGL_3(F_97); |<sigma, mu, swap>| = 18
        exactly; Gamma acts freely on C_27(F_97) with all orbits of size exactly
        9 and exactly 13 orbits, matching #C/9 = 13. Known-false control: the
        claim |Gamma| = 27, which the enumeration refutes.
    - metric: L_and_b
      direction: different
      minimum_effect: >-
        L = log_2 9 = 3.170 bits on the full curve (4.170 with negation) and
        b = 1 exactly, measured against the identity projection (L = 0, b = 1), a
        random 13-symbol label (b at the balls-in-bins expectation and no
        deterministic propagation at all), and the relabelled Z/117Z generic
        group (where the E[3] coset structure survives because it is
        group-theoretic, but c_can reverts to group operations because there are
        no coordinates to compare -- which is precisely the measurement that
        isolates the model lever). A measured b > 1 means the implementation is
        wrong, not that the object branches.
    - metric: loss_on_prime_order_subgroup
      direction: different
      minimum_effect: >-
        EXACTLY 13 distinct Gamma-orbit labels on the 13 elements of the
        order-13 subgroup, i.e. L_restricted = 0 bits while L_global = 3.170
        bits. This is the rigidity measurement and it is the record's central
        negative. Known-false control: the claim that the projection is lossy on
        <P>, which the enumeration refutes. The gcd argument predicts this for
        every prime n > 3, and the ladder over several cells is the test.
    - metric: c_can_in_field_multiplications
      direction: lower
      minimum_effect: >-
        c_can in the Hesse model: 9 monomial images at 0 or 2 multiplications
        each and 8 cross-multiplication comparisons at about 4 multiplications,
        totalling about 50 field multiplications, 0 inversions and 0 curve
        additions. In short Weierstrass form with the same Gamma: 8 point
        additions, 8 inversions and about 24 multiplications. PREDICTED: the
        Hesse c_can is lower when one inversion costs more than about 3
        multiplications, which is the case for every standard field
        implementation; the measured ratio is the model lever and it must be
        reported as a ratio, never as an exponent.
    - metric: quotient_rho_speedup_versus_baseline
      direction: same
      minimum_effect: >-
        A rho walk on the Gamma-quotient must collide after about
        sqrt(n_total/|Gamma_eff|) steps where Gamma_eff is the subgroup of Gamma
        PRESERVING the target subgroup, predicted to be {+-1} of order 2, so the
        measured speedup against plain rho on the order-13 part is sqrt(2) and
        NOT sqrt(18). Known-false control: a measured speedup near sqrt(18) on
        the prime-order part, which would refute Claim C and would be the LEAD
        branch requiring independent review.
  minimal_test:
    execution_status: design_only
    design: >-
      STAGE 0 (zero compute beyond exact arithmetic over F_97, HARD GATE, and
      this is the whole positive control). Enumerate C_27(F_97) and confirm
      #C = 117 = 9 * 13. Confirm O = (1, 96, 0) lies on the curve. Implement the
      group law ONLY through the third-intersection construction from the
      inflection origin -- for A != B the binary cubic on the line has A and B as
      roots, so the third is c_1*A - c_2*B with c_1, c_2 read off two
      evaluations; negation is the third point on the line through O. Then
      verify, POINTWISE OVER ALL 117 POINTS AND WITH THE VIOLATION COUNT
      REPORTED: sigma(R) = R + T; mu(R) = R + T'; negation = coordinate swap;
      sigma^3 = id; sigma has no fixed point. Enumerate the linear groups in
      PGL_3(F_97) and confirm orders 9 and 18. Confirm all 13 Gamma-orbits have
      size 9. Take a point of order 13 as [9] times any point of order 117 or 39,
      enumerate the subgroup, and confirm 13 DISTINCT orbit labels. Any
      disagreement stops the record.
      STAGE 1 (minutes). The (L, b) meter and c_can, measured in the two units
      (field multiplications in the Hesse model, group operations in the
      Weierstrass model of the same curve) with the inversion-to-multiplication
      ratio of the implementation recorded, plus the three nulls below.
      STAGE 2 (minutes). Repeat Stage 0's verification on a LADDER of cells with
      different (p, d) and different cofactor structures, including at least one
      p == 2 mod 3 cell where omega is irrational and Gamma is only of order 3
      (predicted: everything holds with 9 replaced by 3, and the subgroup
      injectivity is unchanged), and at least one cell where 9 | n is FALSE but
      27 | #C, to check that the loss tracks the cofactor rather than the model.
      STAGE 3 (hours, only if the LEAD branch fires, i.e. a measured speedup on
      the prime-order part above sqrt(2)). Matched rho runs on the quotient
      against plain rho and automorphism-discounted rho, then stop and route to
      independent review. NO ECDLP INSTANCE IS SOLVED under this record and no
      curve larger than toy scale is needed for any claim it makes.
    matched_null: >-
      THREE, and the third is the one that isolates the model lever.
      (1) A RANDOM 13-symbol label on C_27(F_97) with the same image size as pi:
      it must fail to propagate under Sigma, i.e. b must be at the balls-in-bins
      expectation rather than 1. (2) The relabelled Z/117Z generic group with the
      same Gamma: the (L, b) meter must AGREE with the elliptic run because the
      coset structure is group-theoretic, while c_can must REVERT to group
      operations because there are no coordinates to compare -- so the
      disagreement between these two runs IS the model lever, isolated.
      (3) A RANDOM projective change of coordinates of the Hesse cell (the
      mandatory PGL null of RQ-ECDLP-623a32): after conjugating by a random
      element of PGL_3(F_97) the operation set is still realised linearly (by the
      conjugated matrices) but is no longer MONOMIAL, so c_can rises to full
      matrix applications. If c_can does NOT rise, the advantage was never about
      monomiality and the measurement is an artifact.
      DECAY PARAMETER: n, the prime part. The rigidity prediction (zero loss on
      <P>) must hold at every n, and the speedup on the prime part must stay at
      sqrt(2) as n grows. A speedup that grows with n is the artifact tell in
      the other direction.
    known_false: >-
      (i) The coordinate swap is a translation (refuted by its fixed point O).
      (ii) |Gamma| = 27 (refuted by the PGL_3 enumeration giving 9).
      (iii) The projection is lossy on the order-13 subgroup (refuted by the 13
      distinct labels). (iv) The Hesse model exists for a prime-order curve
      (refuted by 3 | #C, which the representation requires).
    controls:
      - kind: positive_control
        design: >-
          THE RECORD IS ITSELF THE POSITIVE CONTROL for the campaign's
          coordinate-dependent instrument, and it carries its own: the pointwise
          identity sigma(R) = R + T over all 117 points must return ZERO
          violations. If the harness cannot certify that -- an identity derived
          from first principles and verified during ideation -- then it has no
          power to certify any coordinate-dependent negative, and the eight
          Stage 0 rejections of 2026-09-13 must be re-read as instrument-unknown
          rather than as evidence about their objects.
      - kind: matched_null
        design: >-
          The three nulls above: random label, relabelled Z/117Z, and the random
          PGL_3 conjugate of the same cell.
      - kind: known_false
        design: >-
          The four refuted claims above, each of which the pipeline must reject.
      - kind: invalid_input
        design: >-
          d with d^3 = 1 mod p must be refused (singular pencil member); the
          coordinate triple (0, 0, 0) must be refused; a p == 2 mod 3 cell must
          refuse mu because omega is irrational, and must NOT silently fall back
          to a smaller Gamma without saying so.
      - kind: baseline
        design: >-
          Plain Pollard rho, BSGS, and automorphism-discounted rho (KN-TECH-018)
          on the same curve in the same unit, as the mandatory matched
          attack-cost controls. On this cell the prime part is 13, far too small
          for a meaningful rho timing, so any timing claim requires the Stage 2
          ladder and is otherwise reported as NOT MEASURED.
      - kind: generic_group
        design: >-
          Covered by null (2); listed separately because it carries the
          load-bearing comparison: same L, same b, different c_can unit.
    required_metrics:
      - sigma_is_translation_by_torsion
      - gamma_order_and_freeness
      - L_and_b
      - loss_on_prime_order_subgroup
      - c_can_in_field_multiplications
      - quotient_rho_speedup_versus_baseline
    decision_threshold: >-
      Stage 0 must reproduce every frozen identity with zero violations and must
      reject all four known-false claims. The record is then accepted as a
      positive control for the coordinate-dependent class. Claim C is decided by
      the label count on the prime-order subgroup, Claim B by the c_can ratio in
      the two units, and Claim D is a proof obligation checked by argument rather
      than by measurement. No exponent claim is made from any of them.
    stopping_rules:
      - >-
        Stop at the first pointwise violation of sigma(R) = R + T or
        mu(R) = R + T' and classify it as a procedure defect -- most likely in
        the third-intersection construction, which is the only non-trivial code
        in Stage 0 -- rather than as evidence about the object.
      - >-
        Stop after Stage 1 if the label count on the prime-order subgroup is the
        full n as predicted and the c_can ratio is a constant: the record has
        then delivered its positive control and its negative, and Stages 2 and 3
        are optional confirmations.
      - >-
        No run is authorised by this record; authorized_runs is 0.
    required_artifacts:
      - >-
        frozen manifest (p, d, #C, O, T, T', omega, the 117-point list, the
        13-element subgroup list) and the group-law construction used
      - >-
        per-point violation counts for sigma, mu, negation, with the zero-count
        assertions explicit
      - PGL_3 group-order enumeration transcripts for orders 9 and 18
      - >-
        the (L, b) table for pi and for all three nulls, and the orbit-size
        histogram
      - >-
        c_can in field multiplications and in group operations with the
        implementation's inversion-to-multiplication ratio recorded
      - >-
        the label count on the prime-order subgroup for every cell on the ladder
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: >-
        requires a new approved frozen handoff; the group-law construction and
        the cell list must be declared and hash-bound before any measurement
  falsification_conditions:
    - >-
      Independent recomputation disagrees with #C = 117, with T = (1, 0, 96),
      with T' = (1, 62, 0) at omega = 35, with |Gamma| = 9 or 18, with the
      13 orbits of size 9, or with the 13 distinct subgroup labels. The designed
      values are then a procedure defect and this record is superseded, not
      amended.
    - >-
      A single pointwise violation of sigma(R) = R + T over the 117 points.
      Claim A is then FALSE, the Hesse cyclic shift is not a translation, and the
      whole record collapses -- which is why the check is over all points and not
      a sample.
    - >-
      Fewer than 13 distinct labels on the order-13 subgroup. Claim C is then
      false, a torsion-coset quotient WOULD lose information on a prime-order
      subgroup, and that contradicts the gcd argument and Theorem C; this is the
      LEAD branch, it is a contradiction between an argument and a measurement,
      and it requires independent review at the review-breakthrough tier before
      any interpretation.
    - >-
      A measured quotient rho speedup on the prime-order part exceeding sqrt(2)
      by more than the statistical error on the Stage 2 ladder. Claim C's
      Gamma_eff = {+-1} identification is then wrong and the model lever reaches
      further than the argument allows.
    - >-
      A linear realisation of a multiplication [lambda] with lambda^2 != 1 on
      some projectively normal model. Claim D is then FALSE and the lane it
      closes is reopened, which would be the most valuable single outcome
      available here.
    - >-
      c_can in the Hesse model measuring no lower than in the Weierstrass model
      at any realistic inversion-to-multiplication ratio. Claim B is then false
      and the model lever is not even a constant.
    - >-
      The random-PGL null failing to raise c_can. The advantage was never about
      monomiality; artifact, recorded as a controlled null.
    - >-
      Budget exhaustion before Stage 0 completes. Infrastructure outcome under
      AGENTS.md rule 5, never evidence about the object.
  confounders:
    - >-
      THE GROUP-LAW IMPLEMENTATION IS THE ONLY NON-TRIVIAL CODE AND IS THE MOST
      LIKELY SOURCE OF A FALSE NEGATIVE. The third-intersection construction must
      handle the tangent case (A = B) and the case where the third root coincides
      with A or B. A harness that silently returns O on a degenerate line will
      produce violations that look like a refutation of Claim A. The stopping
      rule classifies any violation as a procedure defect first, for exactly this
      reason.
    - >-
      PROJECTIVE NORMALISATION. Comparing (x : y : z) with (y : z : x) requires
      either a normalisation (one inversion) or cross-multiplication. Mixing the
      two between the Hesse and Weierstrass arms would make the c_can ratio an
      artefact of the comparison convention. The convention is frozen:
      cross-multiplication, no inversions, in both arms.
    - >-
      ALL j = 0 CELLS ARE SPECIAL. The Fermat cubic d = 0 and the three Hesse
      parameters with d^3 = -8 have j = 0 and |Aut(E, O)| = 6. In particular,
      the frozen d = 27 cell satisfies 27^3 = -8 mod 97, so its full linear
      stabiliser has the exceptional order 9 * 6 = 54 rather than the generic
      9 * 2 = 18. The generated translation/negation subgroup remains order 18,
      but it must not be presented as the full stabiliser; every c_can and
      Gamma_eff claim involving the full group must account for the exceptional
      automorphisms.
    - >-
      COFACTOR CONFOUNDING WITH THE MODEL. The Hesse model REQUIRES 3 | #C, so
      any cell that exhibits the model also exhibits the cofactor, and a naive
      reading would attribute the loss to the model. Stage 2's cell with 27 | #C
      but the prime part unchanged is the design that separates them, and without
      it the two levers cannot be told apart.
    - >-
      TOY SCALE. The frozen cell has prime part 13, which is far too small for
      any timing claim; #C = 117 is smaller than the automorphism-discount
      constant it is being compared against. Every timing statement is therefore
      declared NOT MEASURED at Stage 0 and deferred to the ladder, and the record
      claims only exact structural identities at this scale.
    - >-
      Accidental smoothness of the prime part and the anomalous case #C = p,
      excluded per KN-TECH-034 before a cell enters the run set. The frozen cell
      has prime part 13 and 117 != 97.
    - >-
      CLAIM D SHARES ITS PROOF TECHNIQUE WITH IDEA-20260905-d0fee4 (both are
      degree arguments). If a common error exists in the degree bookkeeping both
      closures fall together. This is disclosed so a reviewer can check them as
      a pair rather than independently.
  interpretation_limits:
    - >-
      REPRESENTATION CLASS AND STAGE: class R2 of RQ-ECDLP-623a32 (curve models
      and embeddings), specifically the Hessian entry of its own method list; the
      stage whose charged cost is claimed to change is COLLISION STRUCTURE (the
      per-step and per-canonicalisation cost of a rho-style walk). The record
      makes NO claim about factor-base membership, relation decomposition,
      linear algebra or descent.
    - >-
      NOT THE CLOSED FAMILIES. The Hesse model is a degree-3 plane embedding, not
      a degree-2 coordinate and not a map E -> P^1 of any degree, so it is
      outside the model-lever-1 closures of IDEA-20260807-8027a2 and
      IDEA-20260905-d0fee4. It is not the Kummer line: the point itself is
      represented, not its class modulo +-1. No theta coordinates are proposed
      and IDEA-20260905-40aa90's lane is untouched.
    - >-
      NOT THE REJECTED FAMILY. This is a coordinate-dependent object, the same
      trichotomy class as the eight Stage 0 calibrators this campaign rejected on
      2026-09-13, and that is DELIBERATE: it is the positive control that class
      never had. It differs from all eight in representation (R2 projective
      triple, not a function of the affine pair), in operation set (translation
      by rational 3-torsion realised monomially, not {[2]}), and in outcome
      structure (a provable invariance, so the surrogate cannot fail to reproduce
      the real value). It is NOT a ninth member of that family and must not be
      scored as one.
    - >-
      F6 IS A COMPONENT, NOT THE LENS: negation and Aut(E, O) sit inside Gamma
      and the automorphism-discounted rho baseline is the incumbent. What is new
      is the model in which the action is realised and the cap on how far that
      realisation can go.
    - >-
      NO EXPONENT MOVE IS CLAIMED, AND NONE IS EXPECTED. established_exponent
      _gain = 0. The measured gain is a per-step constant whose collision-side
      benefit on the prime-order subgroup is sqrt(2), already available to plain
      negation-map rho. Claim D argues that no model change can do better, and
      that argument is the record's most valuable output.
    - >-
      CLAIM D IS AN ARGUMENT, NOT A MEASUREMENT. It rests on the embedding being
      projectively normal and on deg([lambda]^*L) = lambda^2 * deg L. A reviewer
      who rejects either premise should treat Claim D as UNVERIFIED with the
      premise named, and the closure as not yet earned; the rest of the record
      stands independently.
    - >-
      The frozen identities were computed during ideation by exact enumeration.
      They are a fixture to be independently recomputed, NOT an evidence record:
      no hypothesis status follows from them and authorized_runs is 0.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-11d3cb
      statement: >-
        NO HEURISTIC IS REQUIRED FOR CLAIMS A, B OR C, and this entry records
        that fact rather than manufacturing one. Claim A is an exact finite
        verification (117 points, zero violations) plus an elementary argument
        (a linear automorphism preserves collinearity, hence sums to O, hence is
        a translation by a 3-torsion point composed with an automorphism; a
        fixed-point-free such map is a pure translation). Claim B is a counted
        operation tally. Claim C is the gcd argument: gcd(|Gamma|, n) = 1 for
        prime n > 3, so Gamma meets <P> trivially. FORMAL STATEMENT OF WHAT IS
        ASSUMED: that the frozen cell is not exceptional, i.e. that the identity
        sigma = tau_{sigma(O)} holds for every smooth member of the Hesse pencil
        over every finite field of characteristic not 3, which the argument
        proves and the ladder tests.
      rigorous_support: >-
        Fully rigorous: the collinearity characterisation of the group law on a
        plane cubic with an inflection origin, plus the observation that the
        fixed points of the cyclic shift in P^2 lie on C_d only when d^3 = 1,
        which are exactly the singular members. No distribution law is invoked
        because no statistical statement is made.
      random_model_justification: >-
        Not applicable, and the reason is recorded rather than the field being
        left blank: the claims are exact identities and operation counts on a
        finite object, so the comparison law is direct recomputation, not a
        random model. The three matched nulls of the minimal test play the role
        a random model would play for a statistical claim -- they check that the
        identity is a property of the object and not of the harness.
      validation_plan: >-
        SAMPLE: the COMPLETE point set of each cell -- all 117 points at
        (p, d) = (97, 27), and all points of every cell on the Stage 2 ladder
        (at least one p == 2 mod 3 cell where Gamma has order 3, at least one
        cell with 27 | #C, and at least one d = 0 cell reported separately). No
        sampling error is possible because the verification is exhaustive.
        SHORTCUT MAKING SAMPLING FEASIBLE: none needed at toy scale; at larger p
        the verification is over a random sample of points plus the exhaustive
        check of the group orders, and the switch from exhaustive to sampled must
        be recorded in the manifest. COMPARISON DISTRIBUTION: not applicable;
        the comparison is to the exact predicted values. TAIL CHECK: the
        degenerate lines -- tangents, lines through O, and lines meeting the
        curve at a point of order 3 -- which are where a group-law implementation
        fails, and which must be enumerated and checked individually rather than
        left to a random sample. TRANSFER ASSUMPTION, STATED: the identities are
        verified at p = 97 and on the declared ladder; their extension to
        cryptographic p follows from the ARGUMENT and not from the measurement,
        and the argument's premise (smooth Hesse member, characteristic not 3) is
        stated with it.
      falsification_condition: >-
        A smooth Hesse cell on which sigma(R) = R + sigma(O) fails at any point,
        or a cell where the cyclic shift has a fixed point on the curve without
        d^3 = 1. Either falsifies the argument, not merely the cell.
    - id: H2-IDEA-20260913-11d3cb
      statement: >-
        CLAIM D'S GENERALISATION IS THE ONE PLACE A GAP CAN HIDE, AND IT IS
        STATED AS AN ASSUMPTION RATHER THAN A THEOREM. Formally: for every
        projectively normal embedding of an elliptic curve E by a line bundle L
        of degree D >= 3, the group of projective linear transformations
        preserving the image is contained in the extension of E[D] (acting by
        translation) by Aut(E, O), of order at most D^2 * 24; and consequently a
        multiplication [lambda] is realised by a linear transformation only if
        lambda^2 = 1.
      rigorous_support: >-
        The consequence is rigorous given the premise: a linear transformation
        preserving the image induces an automorphism of the abstract curve that
        pulls L back to L (the hyperplane class), while
        deg([lambda]^* L) = lambda^2 * deg L, so lambda^2 = 1. The part carried
        as an assumption is the STRUCTURE of the full linear stabiliser
        (that it is exactly translations by E[D] extended by Aut(E, O)), which is
        the classical theta-group statement cited as `recalled` and which this
        session did not verify beyond the D = 3 case, where the frozen cell gives
        exactly 9 = 3^2 translations; adjoining negation gives a selected
        subgroup of order 18, while the full j = 0 stabiliser is predicted to
        have order 54 = 9 * |Aut(E, O)|.
      random_model_justification: >-
        Comparison law for the assumption's testable part: the order of the
        linear stabiliser computed by brute-force enumeration in PGL_{D}(F_p)
        for small D and small p, against the predicted D^2 * |Aut(E, O)|. At
        D = 3, p = 97, d = 27 is a j = 0 cell, so the prediction is 9 * 6 = 54
        for |Aut| = 6; the generated translation/negation subgroup has order
        18 but is not the full stabiliser. That is one exceptional cell, not a
        proof of the generic formula.
      validation_plan: >-
        SAMPLE: exhaustive enumeration of the linear stabiliser for D = 3 over
        several (p, d) cells (feasible: PGL_3(F_p) is too large to enumerate
        directly, so the stabiliser is computed as the set of linear maps
        determined by their action on 4 points in general position that are
        verified to preserve the curve -- a finite and small search), and for
        D = 4 on one Jacobi-intersection cell if one can be constructed cheaply.
        SHORTCUT MAKING SAMPLING FEASIBLE: a projective linear map is determined
        by the images of 4 points in general position, so the stabiliser search
        is over quadruples of curve points rather than over PGL_3 itself.
        COMPARISON DISTRIBUTION: the predicted order D^2 * |Aut(E, O)|. TAIL
        CHECK: a cell with j = 0 or j = 1728 where |Aut| is 6 or 4, which must
        show the larger stabiliser -- if it does not, the formula is wrong in the
        direction that matters least, but it is still wrong. TRANSFER
        ASSUMPTION: verified at D = 3 (and possibly 4) only; the statement for
        general D rests on the recalled classical result and is labelled as such
        wherever Claim D's corollary is used.
      falsification_condition: >-
        A linear stabiliser larger than D^2 * |Aut(E, O)| on any cell, or a
        linear map realising [lambda] with lambda^2 != 1. Either falsifies
        Claim D's corollary and REOPENS the lane this record closes, which would
        be a substantially more valuable outcome than the closure.
  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVE IS CLAIMED AND NONE IS EXPECTED. Stated plainly as the
      handoff requires: this candidate cannot claim an asymptotic exponent
      improvement, and the record does not dress one up. The quantified effect is
      a per-step CONSTANT -- c_can moves from O(|Gamma|) curve additions to
      O(|Gamma|) inversion-free field multiplications -- and the collision-side
      effect on the prime-order subgroup is a factor sqrt(2), which plain
      negation-map rho already has. The asymptotic cost of the best attack is
      unchanged at 0.886*sqrt(n) group operations. The record's asymptotic
      content is a NEGATIVE with an argument: Claim D bounds the whole linear-
      realisation family at |Gamma| <= D^2 * |Aut(E, O)| = O(1) in n, so a
      sqrt(|Gamma|) = n^{epsilon} speedup is unreachable by any change of model,
      and the exponent 1/2 is not moved by this lever at all.
    memory_exponent: >-
      O(1) per processor, identical to plain rho; the Hesse representation stores
      3 field elements instead of 2, a 1.5x constant. No memory exponent changes.
    best_known: >-
      Pollard rho with distinguished points at about 0.886*sqrt(n) group
      operations and O(1) memory per processor; BSGS at 2*sqrt(n) time and
      sqrt(n) memory; van Oorschot-Wiener parallel rho at sqrt(n)/m wall clock on
      m processors; automorphism-discounted rho at sqrt(n/|Aut|), at most sqrt(6)
      better (KN-TECH-018); negation-map rho at sqrt(2) better, which is the
      DIRECT incumbent for this record's measured effect.
    best_known_comparator: >-
      Negation-map rho (the direct incumbent, sqrt(2)); automorphism-discounted
      rho (KN-TECH-018); IDEA-20260901-863e36's c_can = Theta(m) cost law for the
      quotient family; the model-lever-1 closures of IDEA-20260807-8027a2 and
      IDEA-20260905-d0fee4.
    hidden_overhead: >-
      No o(1) is claimed because no asymptotic improvement is claimed. What hides
      instead and is disclosed: (i) the Hesse model needs 3 | #E, which is a
      PRECONDITION on the curve, not a free choice, and excludes every
      prime-order standardised curve -- so the representation is unavailable
      exactly where the ECDLP is posed; (ii) omega must be rational (p == 1
      mod 3) for the full order-9 Gamma, halving the available curves;
      (iii) the group law in Hesse coordinates is not the fastest known addition
      law, so the per-step cost advantage on the Sigma-step must be weighed
      against a possibly slower generic addition, which the minimal test
      measures in the same unit; (iv) the walk on a quotient needs a
      canonicalisation at EVERY step, so c_can multiplies the step count and is
      charged that way rather than once.
    tradeoff_note: >-
      The only tradeoff opened is the unit in which c_can is paid: field
      multiplications with no inversions (Hesse) against point additions with
      inversions (Weierstrass), which is an implementation tradeoff and not a
      time-memory one. No time-memory tradeoff is opened at all: memory stays
      O(1) in both arms. Parallelisation is unchanged from van Oorschot-Wiener,
      and the well-known interaction between the negation map and fruitless
      cycles in parallel rho applies here too and is NOT analysed in this record
      -- named as a gap rather than glossed.
    cost_model: >-
      Two units, never mixed: one field multiplication in F_p, and one group
      operation on the frozen curve, with the implementation's
      inversion-to-multiplication ratio recorded so the two can be converted
      explicitly. Stage 0 is a few tens of thousands of F_97 operations.
      established_exponent_gain = 0.
    data_query_cost: >-
      Every canonicalisation and every walk step is charged. No oracle queries
      and no preprocessing advice.
    established_exponent_gain: 0
  estimated_cost:
    implementation: low
    compute: low
    proposal_task:
      maximum_runs: 0
      wall_clock_cap_seconds: 3600
      memory_cap_gb: 2
    future_test: >-
      Stage 0 is seconds of exact arithmetic over F_97 with no external
      dependency beyond integer arithmetic; the only non-trivial component is the
      third-intersection group law. The full ladder is minutes on a single core.
      This is the cheapest of the four candidates in this session by a wide
      margin.
    dominant_cost: >-
      The linear-stabiliser enumeration for H2's validation, which searches over
      quadruples of curve points.
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      TWO, and they are different in kind. (1) Measured: the label count of pi on
      the prime-order subgroup, which decides whether the model lever touches the
      ECDLP at all (predicted: full, i.e. no loss). (2) Argued: the linear
      stabiliser's order, which decides whether |Gamma| can grow with n
      (predicted: capped at D^2 * |Aut|). Every cost statement in the record is a
      function of those two, and the first is an exhaustive finite check while
      the second is a one-line degree argument plus a recalled classical
      structure result.
    baseline_embedding:
      parameter_slice: >-
        Gamma = {id}: pi is the identity, L = 0, c_can = 0, and the quotient walk
        degenerates to plain rho at 0.886*sqrt(n) -- the cost formula must return
        exactly that. Gamma = {+-1}: pi is the negation quotient, L = 1 bit,
        c_can = one sign comparison, and the formula must return the known
        negation-map rho at sqrt(2) better than plain rho. n = 3: the gcd
        argument's premise fails, Gamma CAN meet <P>, and the formula must not
        silently report zero loss.
      reproduction_check: >-
        Symbolic plus a frozen fixture: the c_can and speedup formulae must
        reproduce plain rho at Gamma = {id} and negation-map rho at
        Gamma = {+-1} with no special-casing, and must flag n = 3. A formula that
        does not reproduce the negation-map incumbent is not a cost model, and
        that incumbent is the one row of the frontier this record's mechanism
        actually touches.
    observation_collision:
      observable: >-
        The pair (L, b) of the loss-and-branching meter.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. (L, b) = (3.170, 1) is produced by pi
        on the Hesse cell AND by the abstract coset projection
        C_27 -> C_27/E[3] computed entirely in the relabelled Z/117Z generic
        group, where there are no coordinates at all and c_can reverts to group
        operations. So (L, b) DOES NOT IDENTIFY the model: two objects with
        different costs share the observation, and any claim founded on (L, b)
        alone would be a claim about the group and not about the Hesse model.
        The separating quantity is c_can IN ITS UNIT, which is why the minimal
        test insists on reporting both units and why null (2) is load-bearing
        rather than decorative. A second collision, in the other direction: the
        Gamma-orbit count 13 equals #C/9 and also equals the prime part n, so on
        THIS cell the orbit count and the subgroup order coincide numerically by
        accident -- a cell with #C = 9 * n and n != #C/9 does not exist, so the
        ladder must include a cell with cofactor 27 to break the coincidence
        before any inference is drawn from the number 13.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "does the operation set have a cheap realisation" by "in which
          model is the operation set LINEAR, and what does the linear stabiliser
          of that model contain". Encoding: exact, since a linear map is
          determined by 4 points in general position. Completeness: exact for the
          Hesse cell (the stabiliser is enumerated). Soundness: spent on the
          projective-normality premise of Claim D. Cost loss: the question moves
          onto the order of a finite group, which is computable.
        predicted_gain: >-
          Converts the open hope "a better model might make a big Gamma cheap"
          into the computable quantity |linear stabiliser|, and yields the
          lambda^2 cap at zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold (L, b) fixed and vary the representation (Hesse coordinates versus
          the relabelled generic group). The intrinsic invariant distinguishing
          them is the UNIT of c_can, not its asymptotics.
        predicted_gain: >-
          Isolates the model lever from the group structure, which is the one
          measurement this campaign's R2 lane has never made, and simultaneously
          supplies the known-false control for any claim founded on (L, b).
    quantifier_order: >-
      FOR ALL primes p with p != 3, FOR ALL d with d^3 != 1 mod p: THERE EXISTS a
      3-torsion point T = sigma(O) such that FOR ALL R on C_d, sigma(R) = R + T,
      where sigma is the cyclic coordinate shift. The existential is
      constructive (T is computed from O by one application of sigma) and the
      inner universal is over ALL points, which is what makes the object a
      quotient rather than a partial action -- writing the order down is what
      distinguishes this record from its Class I siblings in this session.
      Claim C reverses the order deliberately: FOR ALL primes n > 3 dividing #C,
      FOR ALL R in <P>, the labels are distinct -- a universal statement with no
      existential, proved by gcd. Claim D is the strongest quantifier and the
      weakest evidence: FOR ALL projectively normal embeddings, FOR ALL lambda
      with lambda^2 != 1, THERE IS NO linear realisation of [lambda]. THE
      READING NOT CLAIMED: "there is no cheap realisation of [lambda]", which is
      false (GLV endomorphisms are cheap and non-linear) and which the forward
      guidance names as the surviving route.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "on the declared Hesse cells, translation by rational 3-torsion
        is a monomial linear map verified pointwise, the resulting quotient has
        L = log_2|Gamma| and b = 1, c_can costs [these field multiplications]
        against [these group operations], the projection is injective on the
        prime-order subgroup, and the linear stabiliser has order D^2*|Aut| on
        every cell enumerated". It can NEVER certify that no model makes a large
        multiplication cheap -- that is Claim D's argued content and rests on a
        premise -- and it certifies nothing about the ECDLP beyond the tested
        cells.
      nearby_object_control: >-
        TWO in opposite directions. (1) THE OBJECT WHERE THE HOPED-FOR
        CONCLUSION HOLDS: negation, {+-1}, which is a lossy projection that DOES
        preserve the prime-order subgroup and DOES give a real (sqrt(2)) speedup.
        The pipeline must measure that gain; if it cannot see the one gain that
        certainly exists, it has no power to report the absence of a larger one.
        (2) THE OBJECT WHERE IT FAILS: the same Hesse cell conjugated by a random
        element of PGL_3(F_97). There Sigma is still linear but not monomial,
        c_can rises to full matrix applications, and the model advantage must
        vanish. An advantage surviving conjugation was never about the Hesse
        model.
    proof_obligations:
      - claim: >-
          #C_27(F_97) = 117 = 9 * 13; O = (1, 96, 0) on the curve;
          T = (1, 0, 96) and T' = (1, 62, 0) on the curve with omega = 35.
        responsibility: baseline
      - claim: >-
          sigma(R) = R + T and mu(R) = R + T' for all 117 points, zero
          violations; negation = coordinate swap; sigma^3 = id; sigma
          fixed-point-free.
        responsibility: correctness
      - claim: >-
          |<sigma, mu>| = 9 and |<sigma, mu, swap>| = 18 in PGL_3(F_97); Gamma
          acts freely with 13 orbits of size 9.
        responsibility: size_bounds
      - claim: >-
          L = log_2 9 globally and 0 on the prime-order subgroup; b = 1; the 13
          subgroup elements receive 13 distinct labels.
        responsibility: correctness
      - claim: >-
          c_can is about 50 field multiplications with 0 inversions and 0 curve
          additions in the Hesse model, against 8 point additions in the
          Weierstrass model.
        responsibility: runtime
      - claim: >-
          deg([lambda]^* L) = lambda^2 * deg L, hence linear realisability
          implies lambda^2 = 1; and the linear stabiliser has order at most
          D^2 * |Aut(E, O)| under projective normality.
        responsibility: correctness
      - claim: >-
          Every canonicalisation and walk step is charged; the two units are never
          mixed; the negation-map incumbent is reproduced by the cost formula.
        responsibility: interface
      - claim: >-
          No transfer off the frozen cells and the declared ladder; the general-D
          half of Claim D rests on a recalled classical structure result and is
          labelled as such.
        responsibility: scope
    not_applicable_reason: null
  dominated_by:
    status: dominated
    checked_rows:
      - name: Pollard rho with distinguished points
        time: about 0.886*sqrt(n) group operations
        memory: O(1) per processor
        data: one target plus walk queries
      - name: Negation-map rho (the direct incumbent)
        time: about 0.886*sqrt(n)/sqrt(2)
        memory: O(1) per processor
        data: walk queries, plus fruitless-cycle handling
      - name: Automorphism-discounted rho (KN-TECH-018)
        time: sqrt(n/|Aut|), at most sqrt(6) better
        memory: O(1) per processor
        data: walk queries
      - name: BSGS
        time: about 2*sqrt(n)
        memory: about sqrt(n)
        data: about sqrt(n) stored points
      - name: van Oorschot-Wiener parallel rho
        time: sqrt(n)/m wall clock at m processors, sqrt(n) serial-equivalent
        memory: charged distinguished-point store
        data: walk queries
      - name: Generic preprocessing frontier S*T^2 = n
        time: n^{1/3} online
        memory: n^{1/3} advice
        data: n^{1/3} advice
      - name: Multi-target rho
        time: sqrt(T*n) for T targets
        memory: distinguished-point store
        data: T targets
      - name: Pohlig-Hellman on the cofactor
        time: free for the 9-part; the prime part is untouched
        memory: O(1)
        data: none
      - name: This record, predicted
        time: 0.886*sqrt(n)/sqrt(2) at best, with a per-step constant
        memory: O(1) per processor, 1.5x coordinates
        data: every canonicalisation and step charged
    missing_comparisons:
      - >-
        No numerical Pareto sweep was run; the comparison is by formula at
        matched n, and the frozen cell's prime part 13 is too small to time.
      - >-
        The interaction of the negation map with fruitless cycles in parallel rho
        is not analysed, so the comparison against negation-map rho is by
        collision count and not by measured wall clock.
      - >-
        Quantum baselines are out of scope and are not tabulated.
    note: >-
      Dominated. The record's own best case is EXACTLY the negation-map rho row,
      which it reproduces rather than beats, and Pohlig-Hellman already takes the
      9-part for free. dominated_by is NOT null and the dominating row is
      negation-map rho at 0.886*sqrt(n)/sqrt(2), with plain rho dominating on
      implementation simplicity. This is stated as the record's position, not
      buried: the value here is a positive control and a closure argument, not an
      attack.
  sota_delta:
    established_time_exponent_improvement: 0
    established_memory_exponent_improvement: 0
    conditional_delta: >-
      0 established and 0 conditional -- there is no branch of this record under
      which an exponent moves, and that is stated rather than hedged.
      Quantitatively: the best achievable effect is a factor sqrt(2) in collision
      count, which the negation-map incumbent already has, plus a per-step
      constant equal to the ratio of about 50 field multiplications to 8 point
      additions, which is an implementation constant of order 1 to 10. The
      claimed deltas are methodological and exact: one R2 fixture whose
      lossy-projection audit passes both clauses against a named non-trivial
      Sigma (the first in this campaign), two levers separated by measurement
      (model = per-step unit, cofactor = bits of loss), one rigidity measurement
      (13 distinct labels on a 13-element subgroup), and one named obstruction
      with a quantity (lambda^2 * D against D, cap D^2 * |Aut(E, O)|) closing the
      linear-realisation lane with forward guidance to Classes I and II.
    measurement_status: unmeasured
  authorized_runs: 0
