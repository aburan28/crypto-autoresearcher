idea:
  id: IDEA-20260913-11d3cb
  title: >-
    THE MODEL LEVER IS REAL, FINITE, AND CAPPED BY A ONE-LINE DEGREE ARGUMENT:
    on the Hesse cubic x^3+y^3+z^3 = 3d*xyz translation by the rational
    3-torsion is a MONOMIAL projective map, so a genuine lossy quotient
    propagates under a non-trivial Sigma with c_can = O(1) FIELD operations and
    ZERO curve additions -- the first R2 positive control this program has for
    the coordinate-dependent class -- and yet the same fixture shows the
    quotient is INJECTIVE on the prime-order subgroup, while
    deg([lambda]^*L) = lambda^2 * deg L proves no change of model can ever make
    a multiplication other than +-1 linear, which closes "make a large
    Gamma <= (Z/n)^* cheap by re-modelling" by argument rather than by fatigue
  class: control
  claim: >-
    OBJECT FRAME. Representation: the Hesse (equianharmonic-pencil) plane-cubic
    model, a point given as a projective triple (x : y : z) on
    C_d : x^3 + y^3 + z^3 = 3d*xyz with identity O = (1 : -1 : 0). This is class
    R2 of RQ-ECDLP-623a32 (curve models and embeddings) and it is NOT the
    Kummer line and NOT a degree-d function E -> P^1, so it is outside the
    family closed at model lever 1. Operation set:
    Sigma = {tau_T, tau_{T'}} where T = (1 : 0 : -1) and T' = (1 : -omega : 0)
    are rational 3-torsion points and, CRUCIALLY, both translations are realised
    as MONOMIAL LINEAR MAPS of the ambient plane -- tau_T is the cyclic
    coordinate shift (x : y : z) -> (y : z : x) and tau_{T'} is the diagonal
    scaling (x : y : z) -> (x : omega*y : omega^2*z). Sigma is neither {[2]} nor
    the full translation action. TRICHOTOMY: CLASS III, COORDINATE-DEPENDENT --
    one line reason: the tracked object is the lexicographic minimum of the nine
    coordinate triples in the Gamma-orbit, a comparison of COORDINATES that is
    not a group-theoretic function of the point, and it is a genuine block
    system of <Sigma> rather than a partial action or a branching map.
    ATTACK STAGE CLAIMED: collision structure (the per-step cost and the
    collision multiplicity of a rho-style walk), not relation decomposition and
    not linear algebra.
    CLAIM (A), A POSITIVE CONTROL, EXACT AND VERIFIED ON A FROZEN CELL. On
    C_27 over F_97: the curve has 117 = 9 * 13 rational points; O = (1 : 96 : 0);
    sigma(x : y : z) = (y : z : x) preserves C_27, satisfies sigma^3 = id, has
    ZERO fixed points on the curve, and satisfies sigma(R) = R + T for ALL 117
    points with ZERO violations, where T = sigma(O) = (1 : 0 : 96); omega = 35
    and mu(x : y : z) = (x : 35y : 35^2 z) satisfies mu(R) = R + T' for all 117
    points with ZERO violations, where T' = mu(O) = (1 : 62 : 0); the group
    Gamma = <sigma, mu> has order exactly 9 in PGL_3(F_97), acts FREELY (all 13
    orbits have size exactly 9), and adjoining the negation map -- which on this
    model is the coordinate SWAP (x : y : z) -> (y : x : z), verified equal to
    negation on all 117 points -- gives a generated linear subgroup of order
    exactly 18. This
    is the program's first R2 object whose lossy-projection audit PASSES both
    clauses against a named non-trivial Sigma at zero curve cost, and it exists
    to prove the instrument has power: the eight Stage 0 calibrators this
    campaign cycled on 2026-09-13 all failed because their lens had NO
    invariance under the operation set, and this fixture shows what a lens WITH
    provable invariance looks like.
    CLAIM (B), THE COST THE MODEL LEVER ACTUALLY MOVES, AND BY HOW MUCH. In the
    Hesse model a Sigma-step costs ZERO curve additions: tau_T is a coordinate
    permutation (0 multiplications) and tau_{T'} is 2 multiplications by
    constants. Canonicalising a Gamma-orbit costs c_can = 9 monomial images plus
    8 projective comparisons by cross-multiplication, about 50 field
    multiplications and ZERO inversions and ZERO curve additions. In short
    Weierstrass form the same step is a full point addition (1 inversion plus 3
    multiplications) and the same canonicalisation is 8 point additions. The
    model lever is therefore REAL and is a MEASURED CONSTANT: it converts
    O(|Gamma|) curve additions into O(|Gamma|) inversion-free field
    multiplications. It is not an exponent.
    CLAIM (C), WHY THAT CONSTANT BUYS NOTHING WHERE THE ECDLP LIVES. On the
    frozen cell the order-13 subgroup receives 13 DISTINCT Gamma-orbit labels
    (verified by enumeration): the projection is INJECTIVE on the prime-order
    subgroup, so it forgets nothing exactly where the discrete logarithm lives.
    The reason is one line and is general: Gamma is a subgroup of E[3] and
    gcd(|Gamma|, n) = 1 for prime n > 3, so Gamma meets <P> trivially. The
    For the selected generated subgroup, the subgroup that DOES preserve <P> is
    exactly {+-1}, which recovers the standard negation-map speedup sqrt(2).
    However,
    d = 27 is a j = 0 cell, so the full rational linear stabiliser also contains
    the order-3 origin-fixing automorphisms; if those maps are admitted to the
    operation set, Gamma_eff is larger than {+-1}. This fixture therefore cannot
    serve as a generic |Aut(E, O)| = 2 confirmation: it separates the selected
    translation/negation operation set from the cofactor, but not the full
    stabiliser from the exceptional automorphisms.
    CLAIM (D), THE NAMED OBSTRUCTION, WITH A QUANTITY AND AN ARGUMENT. The lane
    "choose a model that makes a LARGE Gamma <= (Z/n)^* multiplication action
    cheap, then quotient by it and win sqrt(|Gamma|)" is CLOSED by a degree
    argument, not by a count of screened mechanisms. Let E be embedded by a line
    bundle L of degree D (Hesse: D = 3, ambient P^2; level-d theta: D = d,
    ambient P^{d-1}). A linear automorphism of the ambient space preserving the
    image pulls L back to L, so it preserves deg L = D. But multiplication by
    lambda satisfies deg([lambda]^* L) = lambda^2 * D. Hence a multiplication is
    realised linearly ONLY IF lambda^2 = 1, i.e. lambda = +-1. THE QUANTITY:
    lambda^2 * D against D, a ratio of lambda^2, which is 1 exactly at
    lambda = +-1 and at least 4 otherwise. COROLLARY: the linear group available
    in ANY projectively normal model is contained in E[D] extended by
    Aut(E, O), of order at most D^2 * 24, which is a CONSTANT independent of n;
    and its rational part requires D^2 | #E, i.e. it lives in the cofactor. So
    the model lever can never deliver |Gamma| = n^{epsilon}, and every gain it
    can deliver is a constant that Pohlig-Hellman already has.
    FORWARD GUIDANCE, as required by the closure standard. What remains open
    after Claim D is NOT nothing: (i) NON-LINEAR but low-degree realisations --
    the GLV endomorphisms are degree-lambda maps, cheap but not linear, and the
    degree argument says nothing against them (it says only that they are not
    linear, which is already known); (ii) Class I partial actions, where the
    object need not be Gamma-invariant on all of E (see IDEA-20260913-04fb8c and
    IDEA-20260913-c5f90d, this session's Class I candidates); (iii) Class II
    branching objects with a cheap pruner (see IDEA-20260913-31457a); (iv)
    models over a RING rather than a field, where the linear group of the ambient
    space is larger and the degree argument must be re-run. The lane this record
    closes is precisely "linear realisation of a large multiplication action",
    and it is closed with an obstruction, an argument and a quantity.
  mechanism: >-
    THE STRUCTURAL FACT THE RECORD RESTS ON. The Hesse pencil
    C_d : x^3 + y^3 + z^3 = 3d*xyz is the classical family whose nine base
    points are the inflections of every member, i.e. the 3-torsion. The equation
    is invariant under the cyclic shift of coordinates and under the diagonal
    scaling by cube roots of unity, so both maps carry C_d to itself for EVERY d;
    each is a projective linear map of the plane. Because a linear map takes
    collinear triples to collinear triples, and because on a plane cubic with an
    inflection origin three points are collinear exactly when they sum to O, any
    linear automorphism sigma of the curve satisfies
    sigma(R) + sigma(S) + sigma(U) = O whenever R + S + U = O. Writing
    sigma = tau_T o alpha with alpha in Aut(E, O) gives 3T = O, so T is
    3-torsion, and if sigma additionally has no fixed point on the curve then
    alpha = id and sigma is exactly translation by T = sigma(O). For the cyclic
    shift the fixed points in P^2 are (1 : 1 : 1) and its two omega-twists, and
    each lies on C_d only when d = 1, which is a singular member of the pencil;
    so for every smooth d the cyclic shift is EXACTLY a translation by a
    3-torsion point. That is the whole mechanism, and the frozen cell verifies it
    pointwise rather than resting on the argument.
    THE OBJECT AND THE OPERATION SET, NAMED. Tracked object:
    pi(R) = min{ normalise(g(R)) : g in Gamma }, the lexicographically smallest
    normalised coordinate triple in the Gamma-orbit of R, where
    Gamma = <sigma, mu> of order 9 (or order 18 with negation adjoined).
    Operation set: Sigma = {tau_T, tau_{T'}} realised as sigma and mu. <Sigma> =
    Gamma. TRICHOTOMY PLACEMENT, CLASS III COORDINATE-DEPENDENT, one line: the
    canonical form is chosen by comparing coordinate triples, which is a property
    of the model and not of the group element, and the resulting fibres are
    exactly the Gamma-cosets, a block system -- so it is neither a partial action
    (pi is defined on all of C_d) nor a branching map (pi is single-valued).
    LOSSY-PROJECTION TEST, AGAINST THE NAMED OPERATION SET. (i) WHAT IS
    DISCARDED: which of the nine points of the Gamma-coset R + E[3] was held --
    exactly log_2 9 = 3.17 bits, or log_2 18 = 4.17 bits with negation adjoined.
    On the frozen cell pi maps 117 points onto 13 labels, so the projection is
    demonstrably lossy IN THE REPRESENTATION ACTUALLY USED and not merely in
    principle. (ii) COMPATIBILITY WITH Sigma: the fibres of pi are the
    Gamma-orbits, which form a block system of <Sigma> = Gamma by construction,
    so the retained part propagates DETERMINISTICALLY under Sigma with branching
    b = 1 -- verified on the frozen cell, where all 13 orbits have size exactly 9
    and Gamma acts freely. This is the clause that all eight of this campaign's
    rejected Stage 0 calibrators failed: they paired a coordinate function with
    Sigma = {[2]} and had no invariance at all, so their surrogate could not
    reproduce the real value. (iii) NOT A CHANGE OF COORDINATES: pi loses 3.17
    bits globally, which is the definition of lossy. BUT -- and this is the
    finding rather than a caveat -- pi loses ZERO bits on the prime-order
    subgroup, because Gamma has order 9 and <P> has prime order 13, so
    Gamma meets <P> trivially and the 13 subgroup elements receive 13 distinct
    labels. THE PROJECTION IS LOSSY ON THE CURVE AND LOSSLESS WHERE THE PROBLEM
    IS. That is the exact shape of KN-FIND-ffe1df Theorem C rigidity, exhibited
    on a model where every other clause passes, which is why this record is filed
    as a control.
    PRICE THE ONE OPEN NUMBER. For a quotient object the priced quantity is
    c_can, the end-to-end cost of canonicalising a <Sigma>-orbit. HESSE MODEL:
    nine monomial images, each 0 or 2 field multiplications (the shift is a
    permutation, the scaling is two multiplications by fixed constants), plus
    eight projective comparisons at about 4 multiplications each by
    cross-multiplication to avoid normalisation inversions -- so c_can is about
    50 field multiplications, 0 inversions, 0 curve additions. WEIERSTRASS
    MODEL, same Gamma: eight point additions, each 1 inversion and about 3
    multiplications. The model lever is therefore the ratio of those two numbers
    -- roughly 50 multiplications against 8 inversions plus 24 multiplications --
    a constant of order 1 to 10 depending on the inversion-to-multiplication
    ratio, which the minimal test measures rather than assumes. IDEA-20260901-
    863e36 priced this family's c_can at Theta(m) group operations for an
    orbit of size m; this record's contribution is that the model lever changes
    the UNIT from group operations to field multiplications while leaving the
    Theta(m) intact, and that m itself is capped at a constant by Claim D.
    WHY THE CAP IS THE INTERESTING PART. The quotient family only pays if
    |Gamma| grows with n: a rho walk on the quotient collides after about
    sqrt(n/|Gamma|) steps, so the speedup is sqrt(|Gamma|) and needs
    |Gamma| = n^{epsilon} to move an exponent. Claim D says the linear
    realisation route caps |Gamma| at D^2 * |Aut(E, O)| for an embedding of
    degree D, a constant in n, and that raising D raises the ambient dimension
    (and hence the per-step cost) at least linearly while requiring D^2 | #E,
    which pushes the whole gain into the cofactor. The two-sided squeeze --
    speedup sqrt(D^2) = D against per-step cost growing with D and a divisibility
    requirement D^2 | #E -- is the quantified reason the model lever cannot reach
    an exponent, and it is computed here rather than asserted.
    WHAT IS ADDED OVER THE COMPONENTS IT USES. F6 (endomorphism and automorphism
    orbit) is used as a COMPONENT and named: the negation map and Aut(E, O)
    appear inside Gamma, and the sqrt(2) negation speedup is the incumbent
    baseline (KN-TECH-018). What is added is (i) the first R2 fixture in this
    campaign where a lossy projection provably propagates under a named
    non-trivial Sigma, which the eight rejected calibrators establish is not easy
    to produce; (ii) the separation of the MODEL lever (per-step cost, in field
    multiplications) from the COFACTOR lever (the loss, in bits) as two
    independently measured numbers; (iii) the degree argument capping the model
    lever, which converts a standing hope into a closed lane with forward
    guidance. F1 (walk collision) appears only as the mandatory baseline.
