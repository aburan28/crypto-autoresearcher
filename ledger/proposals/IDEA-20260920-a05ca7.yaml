idea:
  id: IDEA-20260920-a05ca7
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Protocol-conditional rho-family ruler: if a deployment on EcGFp5 or
    EcMasFp5 draws private scalars or nonces from an interval narrower than the
    group order, Pollard's kangaroo (interval) method prices the key at about
    2*sqrt(w) for interval width w, not at 0.886*sqrt(n) -- a scalar-sampling
    audit of the frozen sources and reference implementations decides which
    ruler applies, and the kangaroo constant is measured on the deployed field
  class: measurement
  claim: >-
    The 320-bit group order of these curves buys 2^159.8 of rho cost only if
    the secret scalar is uniform on the whole order. If an implementation or
    protocol samples a k-bit scalar with k < 320 (for example a 256-bit
    scalar used directly, or a nonce derived from a 256-bit hash without
    reduction-and-expansion), then the generic F1 interval method (Pollard's
    kangaroo, parallelized with distinguished points) finds it in about
    2*sqrt(2^k) group operations (recalled Pollard constant 2; improved
    constants below 2 are recalled for the four-kangaroo and Gaudry-Schost
    variants and are not relied on), with no endomorphism, no negation map,
    and no property of the curve. Arithmetic: k = 320 gives 2^161, above rho
    (the null: kangaroo never beats rho on a full-width scalar); k = 256 gives
    2^129; k = 254 gives 2^128; k = 200 gives 2^101. So the advertised 128-bit
    level fails under this arm if and only if the effective scalar entropy is
    below about 254 bits (constant 2) or about 255 bits (constant 1.7). The
    claim, stated so it can fail: (i) the scalar-sampling audit of the frozen
    design notes and of the reference implementations, once frozen, yields a
    definite k per (curve, implementation, use) with the code path cited, and
    at least one of the two design notes does NOT state the scalar width or
    sampling method explicitly (the generator does not know; either reading is
    reportable); (ii) on the deployed field the measured kangaroo cost on
    intervals of width 2^30 to 2^40 inside a subgroup of order about 2^40 is
    2*sqrt(w) within +/- 15% with the DP overhead charged, identical to the
    Z/n transport; and (iii) the arithmetic table maps k to bits for both
    curves. The tracked object is unchanged (F1); the collision structure
    (tame and wild herds on an interval) is the stage whose cost this record
    prices. The record makes NO claim about what any implementation does.
  mechanism: >-
    OBJECT FRAME (card C-4). Representation: affine F_{p^5} points as in
    IDEA-20260920-0d218c. Operation set Sigma: translation by a fixed set of
    jump multiples s_j P chosen with mean about sqrt(w)/2, applied to a tame
    herd started at known multiples inside the interval and a wild herd
    started at Q; the tracked object is the lossless F1 object with known
    coefficients; nothing is projected away. Trichotomy: object Class 0;
    the record changes the collision structure's cost by restricting the
    start set, which is a property of the SECRET's distribution, not of the
    group. That is why the claim_kind is protocol_conditional: the group
    contributes nothing, and the record's first deliverable is to establish
    whether the condition holds anywhere.
    WHY THE AUDIT IS THE DELIVERABLE. The generator does not know how the
    reference implementations of EcGFp5 (Pornin's crate) and EcMasFp5 (the
    Polygon Hermez pil2-proofman code) sample scalars or how the STARK-side
    protocols that use them derive nonces; neither source is frozen in this
    repository beyond the two design notes (KN-LIT-8aff72, KN-LIT-47d541), and
    the generator has not read the sampling code. The audit reads the frozen
    note for any statement of scalar width, freezes the implementation
    sources, and cites the sampling code path with its width. A uniform-mod-n
    reading closes this arm for that implementation with the condition named;
    a narrower reading opens it with the k found. Both are first-class
    outcomes and neither is assumed here.
    WHY MEASURE THE CONSTANT. The interval method's constant and its DP
    overhead on this field are what turn k into bits; they are generic and
    the Z/n transport is the reference, but the record refuses to quote a
    recalled constant for a deployed-parameter table without one measurement
    on the field that the goal's ruler will be stated on.
    FIELD FROBENIUS. Not used. No endomorphism, no automorphism class, no
    negation (card C-2); the Galbraith-Ruprai negation-map kangaroo speedup is
    explicitly NOT a component and is named only to exclude it.
  novelty_status: unverified
  origin:
    kind: generator_candidate
    date: '2026-09-20'
    seeded_from_sketch: null
    scope: >-
      One of the two generator-added candidates permitted by
      TASK-20260920-0eace8. It answers the user's question ("besides
      endomorphism") with the one generic F1 mechanism that can beat 0.886*sqrt(n)
      without any curve structure -- a restricted secret -- and makes the
      condition an auditable input rather than an assumption.
    overlap_review: >-
      H-GFPN-ee4d45 (SafeCurves-style audit) recomputes order, cofactor,
      embedding degree, CM discriminant, twist security and rigidity; it does
      NOT audit scalar sampling or nonce derivation, and this record does not
      duplicate any of its criteria; the coordinator may prefer to attach the
      sampling audit to that experiment's frozen-source packages as an
      additional row, which this record recommends if it is cheaper than a
      new contract. IDEA-20260920-73dc35 (OA-SDH) is a different oracle model.
      RQ-GRUMPY-964876 owns the grumpy-giants constant on generic groups
      (interval and full-group BSGS variants); this record measures the
      kangaroo constant only as an instrument calibration on this field and
      claims nothing about the constant itself, deferring any constant
      question to GRUMPY. KN-LIT-3060 (Bernstein-Lange, small discrete logs
      with tables) is the precomputation form of the same interval problem and
      is cited in IDEA-20260920-2e37b3; not a component here.
      RQ-ICPERF-94c86e, IDEA-20260731-010 and the GOAL-GFPN-380702
      scope_exclusions are untouched. Nearest owned record: H-GFPN-ee4d45;
      what is added at deployed parameters: the scalar-width audit and the
      k-to-bits table.
  citations:
    - ref: Pollard, "Kangaroos, Monopoly and discrete logarithms", Journal of Cryptology 13 (2000)
      provenance: recalled
      claim: >-
        Recalled, hedged: the kangaroo (lambda) method finds a discrete
        logarithm known to lie in an interval of width w in about 2*sqrt(w)
        group operations expected, with negligible memory using distinguished
        points. Not opened this session.
      verified_by: null
    - ref: Galbraith, Pollard and Ruprai, "Computing discrete logarithms in an interval", Mathematics of Computation (2013)
      provenance: recalled
      claim: >-
        Recalled, hedged: four-kangaroo and Gaudry-Schost-style variants reach
        constants below 2 (recalled value about 1.7*sqrt(w) without the
        negation map); the negation-map variant (Galbraith-Ruprai) reaches
        lower and is excluded here by card C-2. Not opened; not relied on.
      verified_by: null
    - ref: KN-LIT-012
      provenance: internal
      claim: >-
        Van Oorschot-Wiener parallel collision search with distinguished
        points, the parallelization the kangaroo herds use. Caveat carried:
        full paper not re-read there.
      verified_by: idea-generator, TASK-20260920-0eace8 (read from repository)
    - ref: KN-LIT-8aff72
      provenance: internal
      claim: >-
        EcGFp5 design note, frozen; the audit must read it for any statement
        of scalar width or sampling; the generator did not extract such a
        statement this session and records that as unknown.
      verified_by: cloud-agent session 2026-09-20 per the entry; re-read by idea-generator, TASK-20260920-0eace8 (entry only, not the frozen text)
    - ref: KN-LIT-47d541
      provenance: internal
      claim: >-
        EcMasFp5 design note, frozen; same audit obligation; the note is
        unrefereed and its implementation cross-link (pil2-proofman) is not
        frozen here.
      verified_by: cloud-agent session 2026-09-20 per the entry; re-read by idea-generator, TASK-20260920-0eace8 (entry only, not the frozen text)
    - ref: KN-LIT-3060
      provenance: internal
      claim: >-
        Bernstein-Lange: discrete logarithms in an interval of order l with a
        table (1.93*l^{1/3} online after 1.21*l^{2/3} precomputation);
        abstract retrieved this session under IDEA-20260920-2e37b3. Cited to
        note the precomputation form of the interval problem, not used.
      verified_by: idea-generator, TASK-20260920-0eace8 (entry read; abstract retrieved)
    - ref: KN-TECH-006
      provenance: internal
      claim: The full-width ruler 0.886*sqrt(n) that the null (k = 320) must not beat.
      verified_by: idea-generator, TASK-20260920-0eace8 (read from repository)
  citation_note: >-
    The kangaroo constants are recalled and unread; the design notes are
    frozen but their scalar-sampling statements were not extracted this
    session, and the implementation sources are not frozen at all.
    novelty_status is unverified; the mechanism is classical and no novelty
    is claimed for it. First executor task: freeze Pollard 2000 and the two
    implementation sources, and read the sampling code.
  assumptions:
    - Public parameters and public source code only; no keys, signatures or live systems; every measured instance is planted with a known scalar.
    - The audit reports, per (curve, implementation, use), the scalar width k and the sampling method with a code citation, or "not determinable from frozen sources"; it never infers k from a variable's type alone without the sampling call.
    - The kangaroo arm uses distinguished points and a plain jump set; no negation map, no endomorphism (card C-2).
    - The arithmetic table uses constant 2 as the primary row and the measured constant as the second row; both are labelled.
    - Uses the F1 walk-collision family as its component; nothing outside it.
  proof_search_map:
    bottleneck: >-
      Whether any deployed use samples scalars below full width; the kangaroo
      cost is then arithmetic on k.
    baseline_embedding:
      parameter_slice: >-
        k = 320 (full width) must give a kangaroo cost above the rho ruler
        (2^161 versus 2^159.8) so the null is reproduced before any narrower
        row is read; on the instrument, w = n reproduces "no better than rho".
      reproduction_check: >-
        Measured cost at w = n on the calibration subgroup is at least the
        plain rho cost on the same subgroup.
    observation_collision:
      observable: >-
        Per (curve, implementation, use): k with code citation; per interval
        width: measured steps / sqrt(w).
      distinct_preimage_search: >-
        A scalar that is reduced mod n from a 256-bit seed is uniform enough on
        the full order only if the seed is expanded (e.g. 512 bits reduced);
        a 256-bit seed reduced mod a 320-bit n is NOT uniform and lies in a
        2^256 interval; the audit must distinguish "reduced from 256 bits"
        from "uniform mod n" because both look like "mod n" in code.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The interval-restricted start set of the wild herd, packed against the full-order ruler
        predicted_gain: None on the exponent; cost 2*sqrt(2^k) instead of 0.886*sqrt(n) when k < log2(n) - 1.2; zero when the scalar is full width
    quantifier_order: >-
      For each (curve, implementation, use) in the frozen set there exists an
      audit row with k or "not determinable"; for each k in the table there
      exists a derived cost in bits; for the calibration widths there exist
      measured constants.
    method_ceiling:
      strongest_certifiable_claim: >-
        A per-use scalar-width table with citations and a k-to-bits table
        under the recalled constant and the measured one; no statement about
        any implementation not frozen, and no claim that any deployment uses a
        narrow scalar.
      nearby_object_control: >-
        The Z/n transport for the kangaroo constant; the w = n null; the
        full-width sampling reading as the expected audit outcome.
    proof_obligations:
      - claim: Every planted interval instance is recovered and certified by the independent verifier.
        responsibility: correctness
      - claim: The audit cites the exact sampling code path and version hash for every k it reports.
        responsibility: scope
      - claim: The w = n null is reproduced before any narrow-interval number is read.
        responsibility: baseline
      - claim: DP overhead is charged in the measured constant.
        responsibility: runtime
  predictions:
    - metric: audit_rows_with_definite_k
      direction: higher
      minimum_effect: At least one definite k with code citation per curve, or an explicit "not determinable" with the missing freeze named.
    - metric: design_note_states_scalar_width
      direction: different
      minimum_effect: Reported per note as yes or no; the generator predicts nothing about which.
    - metric: measured_kangaroo_constant_over_sqrt_w
      direction: flat
      minimum_effect: 2.0 +/- 0.3 at w in {2^30, 2^34, 2^38} inside a subgroup of order about 2^40, DP overhead charged, identical to Z/n within 5%.
    - metric: null_w_equals_n_cost_over_rho
      direction: higher
      minimum_effect: At least 1.0 (kangaroo never beats plain rho on the full order).
    - metric: k_to_bits_table
      direction: different
      minimum_effect: >-
        Derived, not measured: 161 / 129 / 128 / 101 bits at k = 320 / 256 /
        254 / 200 with constant 2; re-derived with the measured constant.
  minimal_test:
    design: >-
      Two legs. AUDIT (zero compute): freeze the reference implementations
      (Pornin's EcGFp5 crate; the pil2-proofman EcMasFp5 code) as SRC-*
      packages; read the frozen design notes and the sampling code; produce
      the (curve, implementation, use) -> (k, method, citation) table,
      distinguishing uniform-mod-n, reduce-from-seed, and fixed-width
      sampling. MEASUREMENT: on the F_{p^5} backend of IDEA-20260920-68b279 in
      kangaroo mode (new tooling, V5), plant 64 scalars per width in
      intervals of width 2^30, 2^34, 2^38 inside the about-2^40 calibration
      subgroup; tame and wild herds with distinguished points at density 2^-8;
      record steps to solve, DP overhead, certificates; repeat on the Z/n
      transport; run the w = n null against plain rho. Then the k-to-bits
      table with both constants.
    controls:
      - >-
        The w = n null; kangaroo on the full order must cost at least plain
        rho, since the arm buys nothing without a restricted secret.
      - >-
        Z/n transport at each width; identical constant required, since the
        method is generic.
      - Planted-scalar certificates re-verified independently.
      - >-
        Audit control; one implementation with KNOWN uniform-mod-n sampling
        (e.g. the program's own F_p rho test harness's scalar generator)
        audited by the same procedure must be classified uniform, and a
        procedure that cannot classify a known case is void.
    required_metrics:
      - audit_table_curve_implementation_use_k_method_citation
      - measured_constant_per_width_with_interval
      - dp_overhead_per_width
      - null_ratio_w_equals_n
      - certificate_pass_rate
      - k_to_bits_table_both_constants
  falsification_conditions:
    - The audit cannot classify the known-uniform control implementation (procedure void; no audit row is reported).
    - Measured constant outside 2.0 +/- 0.3 at any width or differing from Z/n by more than 5% (instrument or jump-set defect; the k-to-bits table is not quoted with the measured row).
    - The w = n null beats plain rho (instrument defect; nothing is read).
    - >-
      Every audited use is uniform mod n with citation; the arm is then CLOSED
      for the audited implementations with the condition named ("full-width
      scalar"), and the record's deliverable is that closure plus the table
      for any future narrower use. This is a first-class outcome, not a
      failure.
  confounders:
    - Reading a 256-bit type as a 256-bit scalar when the code reduces a 512-bit expansion mod n; the audit must follow the sampling call, not the storage type.
    - Nonce derivation in a higher-level protocol (signature schemes over these curves) may differ from key sampling; each use is its own row.
    - Toy interval widths where the DP density dominates the constant; density 2^-8 at w >= 2^30 keeps DP overhead below 2%.
    - Confusing this arm with the auxiliary-input (Cheon) or SDH oracle models; no oracle is assumed here.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - >-
      Protocol-conditional; the record asserts nothing about any
      implementation until the audit reads it, and a uniform reading closes
      the arm for that implementation.
    - No exponent moves; sqrt(w) is the generic interval cost and the record claims no improvement to it.
    - Nothing about curves other than the two named ones and their frozen implementations.
  heuristic_assumptions:
    - id: H-KAN-1
      statement: >-
        Kangaroo law: for a secret uniform on an interval of width w in a
        prime-order group, the distinguished-point kangaroo method with tame
        and wild herds and mean jump about sqrt(w)/2 finds it in
        2*sqrt(w)(1 + o(1)) expected group operations (recalled constant),
        with the random-mapping collision law for the two herds.
      rigorous_support: >-
        Birthday-type analysis for the tame-wild overlap (Pollard 2000,
        recalled; Kijima-Montenegro KN-LIT-2945 record rigorous bounds for the
        kangaroo method at abstract level). The transfer to jump walks on E is
        the standard heuristic.
      validation_plan: >-
        The measurement leg: 64 planted scalars per width at w = 2^30..2^38 on
        the deployed field and on Z/n; steps / sqrt(w) against 2.0; tail check
        on the slowest instance; DP overhead charged. Transfer to w = 2^k at
        k up to 320 is by the law, stated explicitly.
    - id: H-KAN-0
      statement: >-
        NONE FOR THE AUDIT: the scalar-width table is a reading of frozen code,
        not a heuristic. Recorded so the absence is explicit.
      rigorous_support: Source reading with citations.
      validation_plan: The known-uniform control implementation must classify correctly.
  heuristic_note: >-
    The only heuristic is the kangaroo constant, which the measurement leg
    checks on this field; the condition that makes the arm bite is an audited
    fact, not an assumption.
  target_complexity:
    time_exponent: 1/2 in the interval width w, i.e. 2^(k/2 + 1) for a k-bit scalar; equals the rho ruler at k about 318 and beats it only for k below that.
    memory_exponent: O(1) per herd plus the DP table (negligible).
    best_known: Pollard rho 0.886*sqrt(n) group operations with negation (KN-TECH-006, KN-TECH-018), about 2^159.8 on EcMasFp5 and about 2^159.3 on EcGFp5, for a full-width scalar.
    hidden_overhead: DP overhead and herd start-up, charged; the o(1) in the kangaroo law at toy widths, exposed by the width ladder.
    tradeoff_note: Van Oorschot-Wiener parallel herds; a precomputed table (KN-LIT-3060 form) would trade to w^{1/3} online and is not proposed here.
  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      The audit is zero compute and a few hours of source reading once the
      implementations are frozen; the kangaroo mode shares the tooling of
      IDEA-20260920-68b279 (charged there) and the measurement is under a
      core-day.
  asymptotic_claim:
    problem: ECDLP on E(F_{p^5}) at p = 2^64 - 2^32 + 1 with the secret restricted to an interval of width 2^k (protocol condition)
    prior_best: 0.886*sqrt(n) group operations for a full-width secret; 2*sqrt(w) for an interval secret (recalled)
    time_exponent: 1/2 in w (unchanged in form)
    memory_exponent: O(1)
    hidden_cofactor: none claimed
    claim_kind: protocol_conditional
  dominated_by: >-
    For a full-width secret, rho at 0.886*sqrt(n) dominates this arm (2^161
    versus 2^159.8) and the arm is void; for an interval secret of width w
    below about n/5 (where 2*sqrt(w) drops under 0.886*sqrt(n)), nothing
    generic dominates 2*sqrt(w) except the recalled sub-2 constants (same
    exponent) and the precomputation form (KN-LIT-3060, w^{1/3} online after
    w^{2/3} offline), which is a different (S, T) point and is stated in
    IDEA-20260920-2e37b3. Rows checked: rho, BSGS on the interval (same
    sqrt(w) with sqrt(w) memory), multi-target rho, the S*T^2 frontier, the
    a639a1 band (which does not use the secret's width at all). Stated as
    "dominated by rho when the condition fails; on the frontier when it holds".
  sota_delta:
    time: 0 for a full-width secret; 2*sqrt(2^k) versus 0.886*sqrt(n) when the secret has k bits (derived; e.g. 2^129 at k = 256 on a 320-bit order).
    memory: 0 (zero).
    data_queries: Not applicable (public keys only; no oracle).
  frontier_check:
    status: pending
    note: >-
      Whether either implementation samples full-width scalars is unknown to
      the generator and is the audit's first row; the coordinator should not
      approve the measurement leg before the audit reports at least one
      non-uniform or non-determinable row, because a fully uniform reading
      makes the measurement leg a calibration only.
  recommended_priority: medium
  priority_rationale: >-
    Constant-factor and protocol-conditional work is not target-class under
    docs/target-result-profile.md rule A1, and this record says so. Its
    priority for GOAL-GFPN-380702 is that the audit leg is zero-compute, can
    be attached to H-GFPN-ee4d45's frozen-source work, and is the one
    generic rho-family mechanism that could put a deployed key below 2^128
    without any property of the curve; the goal's decision target (e) asks
    whether each curve's 128-bit claim stands, and a narrow-scalar reading
    would change that answer for a deployment independently of every
    index-calculus band. Medium because the expected audit outcome is
    uniform sampling, which closes the arm cheaply and cleanly.
  first_deliverable: >-
    Frozen SRC-* packages for the two reference implementations and the
    scalar-sampling audit table with code citations (zero compute), the
    known-uniform control classified; then, only if a non-uniform or
    non-determinable row exists, the kangaroo mode in the F_{p^5} backend
    (IDEA-20260920-68b279) and the width-ladder measurement.
  next_gate: Coordinator decision whether to attach the audit leg to EXP-GFPN-726eb2's frozen-source scope or to a new zero-run task; measurement leg gated on the audit's rows.
