  assumptions:
    - The split-curve floor is attained on a single orbit; checked for n <= 14 by the sibling study, to be extended to n <= 31.
    - Multi-orbit and K-rational-point types have larger r; their minima are enumerated, not assumed.
  proof_search_map:
    bottleneck: the spectrum of m at prime n beyond 3, 5, 7
    baseline_embedding:
      parameter_slice: n = 5, 7, 11, 13 (minima 5, 7, 1793, 9217)
      reproduction_check: formula and brute force reproduce all four
    observation_collision:
