        predicted_gain: closed floor formula for every prime
    quantifier_order: for all primes n >= 5, for all 4-sets S in Z/n
    method_ceiling:
      strongest_certifiable_claim: single-orbit floor for every prime, not the full floor without the type enumeration
      nearby_object_control: n = 17, where 3 is outside <2> and e = 0 by code distance
    proof_obligations:
      - claim: Newton argument p_1 = p_3 = 0
        responsibility: correctness
      - claim: general bound on e(n)
        responsibility: size
  predictions:
    - metric: e(n) for primes 5 <= n <= 300, exhaustive over 4-sets
      direction: equals
      minimum_effect: "0 whenever 3 in <2>, and at 17; 3 at 7; positive iff 4 distinct elements of mu_n sum to 0"
    - metric: single-orbit floor at n = 11, 13, 17, 19
      direction: equals
      minimum_effect: "2^(n-3)(n-4)+1: 1793, 9217, 212993, 983041"
    - metric: e(31)
      direction: equals
      minimum_effect: 5 (one coset; two would need a Newton-compatible pair)
    - metric: odd floor over Hess genus at n = 31
      direction: higher
      minimum_effect: ratio >= 2^20
  minimal_test:
    design: >-
      (1) For each prime 5 <= n <= 300 enumerate the C(n-1,3) 4-sets containing 0; compute deg gcd(s_S, x^n - 1)
      over F_2 with bit-polynomials; record m*(n), e(n), attaining S. (2) Check the lemma and the Poisson mean
      C(n,4)/2^o for the count of 4-term relations. (3) Extend the sibling exact-period minimum to n <= 31 by type
      enumeration. (4) Evaluate the Hess formula at n = 7, 31, 127. (5) Lean decide for n = 7 submodule dimensions
      and weight-4 patterns.
    controls:
      - "Positive: n = 5, 7, 11, 13 give 5, 7, 1793, 9217."
      - "Negative: n = 17 (3 outside <2>, e = 0) shows the lemma's converse fails; n = 7 shows e > 0 occurs."
      - "Nearby object: characteristic-2 magic numbers at n = 7 against KR-IC-791cb7."
    required_metrics:
      - n
      - ord_n(2)
      - "3 in <2>"
      - e(n)
      - m*(n)
      - floor genus
      - attaining S
      - relation count vs Poisson mean
  falsification_conditions:
    - A prime with 3 in <2> and e(n) > 0 refutes the Newton lemma.
    - A mismatch with 5, 7, 1793, 9217 refutes the module-to-genus link (or the code).
    - A prime n >= 11 with a multi-orbit type below the single-orbit floor refutes the single-orbit assumption.
  interpretation_limits:
    - Genus only; no cost, descent or transfer. The Hess comparison is formula-level. Brute force proves nothing beyond n = 300.
  heuristic_assumptions:
    - id: H1
      statement: The number of 4-term relations among mu_n in F_{2^o} is Poisson with mean C(n,4)/2^o, apart from perfect-code structure.
      rigorous_support: counting 4-subsets of a subgroup against a random-sum model; the exceptions are perfect-code cases.
      validation_plan: per prime n <= 300, observed relation count against the mean; flag outliers (17 expected).
