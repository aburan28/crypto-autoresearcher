# IDEA-20261003-abf93e
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-abf93e
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 6 has degree 36 and multiplication by 5 has degree 25
  class: measurement
  claim: >-
    Multiplication by 6 has degree 36. Multiplication by 5 has
    degree 25. Thirty-six exceeds twenty-five by 11. The product
    of the two degrees is 900. Their sum is 61. The gap is a map
    degree, not an ECDLP exponent and not the degree pair 25 and 16.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Six squared is 36. Five squared is 25. Two maps of
    degree 25 have gap 0 and product 625. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The multipliers 6 and 5 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 11.
    baseline_embedding:
      parameter_slice: The degrees 36 and 25.
      reproduction_check: >-
        Two readers must agree that 6 squared is 36 and that 5
        squared is 25.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 25 drops the gap. Two maps of
        degree 25 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 36 and 25.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The multipliers are fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degrees 36 and 25. Not the degree pair 25 and 16.
      nearby_object_control: >-
        Two maps of degree 25. The gap is 0 and the product is 625.
    proof_obligations:
      - claim: Multiplication by 6 has degree 36.
        responsibility: size
      - claim: Multiplication by 5 has degree 25.
        responsibility: size
      - claim: The gap is not the degree pair 25 and 16.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: Thirty-six exceeds twenty-five by 11.
  minimal_test:
    design: >-
      Square 6 and square 5, then subtract 25 from 36. Do not map
      a curve point.
    controls:
      - Two maps of degree 25, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The degree of multiplication by 6 is not 36.
    - The product of the two degrees is not 900.
  confounders:
    - The degree pair 25 and 16 belongs to multipliers 5 and 4.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic endomorphism.
    - This is not the degree pair 25 and 16.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen multiplication by 6 has degree 36, and the
        frozen multiplication by 5 has degree 25.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is a
        reading of two squares.
      validation_plan: >-
        Two independent squares. A mismatch voids the gap.
  target_complexity:
