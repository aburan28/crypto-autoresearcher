idea:
  id: IDEA-20261007-3c6b07
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-SSIQ-9702af
  title: >-
    Five-smooth count on 1..200 versus the progression 1+6k, as a
    toy probe of the smoothness factor
  class: measurement
  claim: >-
    Toy instance only, prediction fixed before any run. Let S be the
    number of integers n with 1 <= n <= 200 whose largest prime
    factor is at most 5. Let A be the number of terms of the
    progression 1+6k for k = 0, 1, ..., 32 (the terms are 1, 7, ...,
    193) whose largest prime factor is at most 5. Prediction: S is at
    least A+12. S at most A+11 is a negative. This claim does not say
    that the inverse-smoothness factor u^{u(1+o(1))} moves. The rho
    exponent stays 1/2 and the conditional isogeny exponent stays 1/3.
  mechanism: >-
    Lever F4 of RQ-SSIQ-9702af is the inverse success probability,
    which treats degrees like random integers and compares them with
    the Dickman law on an interval. The measured gap is whether that
    interval is richer in 5-smooth integers than one frozen
    arithmetic progression of the same rough length. The progression
    is the null object of the same shape: positive integers below
    200, thinned by a fixed step. No curve is enumerated. This is not
    a character sum on a curve and not an isogeny list.
  novelty_status: unverified
  citations:
    - ref: docs/target-result-profile.md
      provenance: internal
      claim: >-
        The archived conditional exponent hides a superpolynomial
        smoothness overhead in the o(1). This proposal does not
        estimate that overhead.
      verified_by: >-
        coordinator session 2026-10-07 opened
        docs/target-result-profile.md
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need Omega(sqrt(N)) group
        operations.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - The progression has 33 terms and every term is at most 193.
    - Five-smooth means the largest prime factor is at most 5, and 1 is counted as five-smooth.
    - This session did not count S or A.
  proof_search_map:
    not_applicable_reason: >-
      This is one pre-registered count, not a proof about the
      smoothness probability at cryptographic size.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: S minus A
      direction: higher
      minimum_effect: at least 12
  minimal_test:
    design: >-
      Factor every integer from 1 through 200 by trial division and
      count those whose largest prime factor is at most 5. Do the
      same for the 33 progression terms. Subtract. Do not replace the
      count by a Dickman approximation.
    controls:
      - >-
        The progression is the null sample. A bug that marks every
        integer five-smooth fails a check that 7 is not five-smooth
        and that 32 is five-smooth.
      - >-
        The count on 1..200 is recomputed from the high end downward.
        A disagreement voids the instrument.
    required_metrics:
      - S
      - A
      - S minus A
  falsification_conditions:
    - S is at most A+11.
    - A timeout or a factorisation disagreement is infrastructure, not a falsification and not support.
  confounders:
    - >-
      The step 6 shares factors with the smoothness bound 5 only at
      the prime 2 and the prime 3. A different step would be a
      different experiment.
  interpretation_limits:
    - >-
      A gap of at least 12 at this size does not validate the Dickman
      law at cryptographic X and does not move u^{u(1+o(1))}.
    - A negative closes only this interval, this bound, and this progression.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The interval 1..200 contains at least 12 more 5-smooth
        integers than the progression 1+6k, as if thinning by 6
        removed smooth integers faster than it removed all integers.
      rigorous_support: >-
        Every integer has a largest prime factor. No theorem in the
        files opened for this proposal gives the difference S-A. The
        gap of 12 is the unproved imitation.
      validation_plan: >-
        The minimal test counts both sets in full. The instrument
        checks 7 and 32 before the subtraction is scored.
  target_complexity:
    time_exponent: p^{1/3+o(1)} conditional, unchanged
    memory_exponent: p^{1/3+o(1)} conditional, unchanged
    best_known: >-
      p^{1/2} times (log p) to a constant power, and p^{1/3+o(1)}
      time and memory conditional on the archived smoothness heuristic
    hidden_overhead: >-
      No new o(1) is claimed. The incumbent o(1) still hides the
      smoothness overhead named in the target profile.
    tradeoff_note: >-
      The count uses O(1) memory beyond the two integers S and A.
      Exponent delta is 0.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    Opened KR-RHO-13bf67 and the target-result profile. Neither states
    S-A for this interval. KR-RHO-13bf67 dominates any exponent
    reading. A Dickman evaluation at cryptographic size would dominate
    this toy gap; this proposal does not compute one.
  sota_delta: >-
    Exponent difference 0 against both p^{1/2} and p^{1/3+o(1)}. The
    counted delta is a smooth-count gap of at least 12 on 1..200,
    against the profile's u^{u(1+o(1))} factor, which is a different
    scale.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-5b1c0a
      - KR-RHO-037e22
      - KR-IC-46d822
      - KR-IC-b0fcda
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is the generic square-root bound. This proposal
          counts 5-smooth integers and claims exponent difference 0.
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a Frobenius-stable factor base. This proposal
          does not build a factor base.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for the phrase largest prime factor is at most 5
        - PR 1960 and PR 1959 idea claims
      web: []
      blocked: []
