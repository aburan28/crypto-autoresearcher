idea:
  id: IDEA-20261007-ece173
  question_id: RQ-OAKLEY-264353
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: >-
    Fully charged yield metrology with a two-rung tower-scaling probe to the
    extrapolation boundary
  class: measurement
  claim: >-
    With every cost charged (attempts, failures, timeouts at a fixed conflict
    cap, preprocessing, symmetry and encoding setup, wall-clock and peak RSS),
    the five-point PDP cost per relation is measured on sibling tower cells at
    two rungs (p equal 5, m equal 25, and p equal 7, m equal 35), the
    per-attempt cost scaling exponent alpha in cost proportional to q^{alpha}
    and the decomposition-probability scaling are fitted across the rungs,
    and the honest extrapolation boundary to q equal 2^{31} and 2^{37} is
    published as an interval under numbered heuristics with validation
    routes; per-solve numbers that omit the failure rate are explicitly not
    relation costs anywhere in the record.
  mechanism: >-
    OBJECT FRAME. Representation: R1 tower-basis x-coordinates with the Vsub
    membership predicate, shared with the sibling ladder so this protocol
    standardises their accounting rather than inventing a new object;
    operation set Sigma: translation by factor-base elements only.
    TRICHOTOMY: Class I, partial-action; the priced branching event is
    decomposition, and the failure rate is its measured complement.
    LOSSY-PROJECTION TEST against Sigma: relation vector, lossy and
    compatible, as in the siblings; passes unchanged because the object is
    unchanged and only the meter is new. KN-OPEN-020: linear subfield base,
    scoped-out, no escape claimed. THE MECHANISM. Uncharged per-solve figures
    flatter every PDP comparison by exactly the failure multiplier the
    decision target must contain: cost per relation equals per-attempt charged
    cost times 5! divided by measured success probability, plus amortised
    setup, plus linear algebra; fitting alpha across two rungs converts the
    endpoint extrapolation from an opinion into an interval with named
    heuristic loadings per factor. WHAT IS ADDED beyond the siblings and the
    ICPERF discipline they cite: the charging standard itself (what counts as
    a charged second, how timeouts enter, how setup amortises), the two-rung
    alpha fit design, and the per-factor extrapolation boundary table.
  novelty_status: speculative
  citations:
    - ref: IDEA-20260922-af7396
      provenance: internal
      claim: >-
        The k equal 4 versus 5 SAT exponent branch, the crossover p* analysis,
        and the endpoint pricing whose heuristic loadings this protocol
        itemises per factor.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: IDEA-20260922-70a67c
      provenance: internal
      claim: >-
        The K_5 constant framing with thresholds 2^{38.9} and 2^{48.4} that
        the two-rung probe tests for q-independence in F_q operations.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: Gaudry fixed-n complexity analysis (recalled pointer, unopened)
      provenance: recalled
      claim: >-
        Recalled only: heuristic O~(q^{2-2/n}) relation-search cost for fixed
        n, the exponent prediction the alpha fit is tested against.
      verified_by: null
  assumptions:
    - >-
      Rungs p equal 5 and p equal 7 with fully recorded sibling objects;
      fixed conflict cap per rung published before the fit; at least 20
      targets per rung with SAT versus UNSAT certified at p equal 5 by the
      exhaustive 4-loop.
    - >-
      Linear-algebra cost carried as the standard sparse estimate on
      2^{p-1} by 2^{p-1} weight-5 matrices, stated as estimate, never as
      measurement at these rungs.
    - >-
      Scale never laundered: m equal 35 cost is m equal 35 cost; every
      q equal 2^{31}, 2^{37} figure is labelled EXTRAPOLATION with the
      heuristic and validation route attached.
  proof_search_map:
    bottleneck: >-
      The failure multiplier: uncharged per-solve numbers understate relation
      cost by exactly the inverse success probability, and no sibling
      standardises its measurement.
    baseline_embedding:
      parameter_slice: >-
        The p equal 5 rung reproduces the sibling Vsub figures within their
        error bars before the p equal 7 rung is admitted to the fit.
      reproduction_check: >-
        Recompute the 1/5! probability by exact enumeration at p equal 5; a
        mismatch beyond binomial error invalidates the counting, not the
        scaling.
    observation_collision:
      observable: >-
        The charged cost per relation with its four additive components
        (attempts, setup amortisation, failures via the multiplier, algebra
        estimate) reported separately at each rung.
      distinct_preimage_search: >-
        A steep fitted alpha comes both from genuine scaling and from a
        rung-dependent timeout cap truncating p equal 7 harder; discriminate
        by refitting with the cap doubled at p equal 7, and an alpha that
        falls under cap doubling is cap artifact, not scaling.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The two-rung charged table plus the per-factor boundary to q equal
          2^{31}, 2^{37} as the single handoff artifact for decision item (4).
        predicted_gain: >-
          Turns endpoint extrapolation into an auditable interval with named
          loadings instead of a point estimate with hidden assumptions.
    quantifier_order: >-
      FORALL targets at the two rungs the charging rules apply identically;
      the fitted alpha is an EXISTENTIAL fit over exactly two rungs, published
      with the two-point fragility stated, never as a law.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Charged cost per relation at m equal 25 and 35 is C25, C35 with
        stated components; the two-point alpha is a with stated interval;
        endpoint figures are extrapolations under H1, H2.' Nothing stronger.
      nearby_object_control: >-
        PROVES-TOO-MUCH: the same protocol at t equal 3 must recover an alpha
        consistent with the known t equal 3 behaviour; otherwise the meter,
        not the tower, is miscalibrated.
    proof_obligations:
      - claim: Charging rules applied identically at both rungs.
        responsibility: correctness
      - claim: Success probabilities with binomial intervals per rung.
        responsibility: correctness
      - claim: Two-point alpha with cap-doubling stability check.
        responsibility: runtime
      - claim: Per-factor extrapolation boundary table.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: fitted per-attempt scaling exponent alpha across the two rungs
      direction: different
      minimum_effect: >-
        Alpha published with interval; SAT-chain alpha inside [3.5, 5.5]
        confirms the sibling branch, outside it reopens the formulation
        question; Groebner F_q-operation alpha inside [-0.3, 0.3] confirms
        q-independence.
    - metric: measured success probability per rung versus 1/120
      direction: different
      minimum_effect: >-
        Agreement within binomial error at both rungs, or the deviation and
        its structural hypothesis published as the finding.
    - metric: failure-multiplier share of charged cost per relation
      direction: higher
      minimum_effect: >-
        Multiplier above 60 at both rungs, demonstrating that uncharged
        per-solve figures understate relation cost by nearly two orders of
        magnitude.
    - metric: cap-doubling stability of alpha at p equal 7
      direction: different
      minimum_effect: >-
        Alpha shift under doubled cap below 0.5, or alpha published as
        cap-dependent with both values.
  minimal_test:
    design: >-
      Fix the charging standard in writing (conflict cap, timeout handling,
      setup amortisation divisor, RSS sampling). Run 20 targets per rung on
      the shared sibling cells with WDSat configurations from the siblings,
      plus Groebner F_q-operation counts wherever the engine exists. Compute
      per-rung charged cost per relation with components, fit alpha, double
      the p equal 7 cap and refit, then publish the boundary table to q equal
      2^{31}, 2^{37} with per-factor heuristic labels.
    controls:
      - shape-matched random Boolean null at both rungs (scaling of the null must not mimic the fitted alpha)
      - size-matched random V arm at both rungs (alpha must be V-class specific, not instance-generic)
      - Groebner-versus-SAT identity inherited from IDEA-20261007-424b6f at p equal 5
      - cap-doubling refit at p equal 7 as the truncation control
      - t equal 3 calibration of the whole meter before t equal 5 numbers are trusted
    required_metrics:
      - charged cost per relation with all four components per rung
      - success probabilities with binomial intervals per rung
      - fitted alpha with interval plus cap-doubled refit
      - wall-clock and peak RSS distributions, failures included
      - boundary table entries per factor with heuristic labels
  falsification_conditions:
    - Null-object alpha matches the measured alpha within the interval: the scaling is instance shape, and endpoint transfer is void.
    - Cap doubling moves alpha by more than 0.5: alpha is cap artifact and only cap-conditional figures are published.
    - Success probability deviates from 1/120 beyond binomial error at either rung: H2 is withdrawn for that rung and the boundary table carries the measured probability instead.
    - t equal 3 calibration fails: the meter is wrong and no t equal 5 interval is published.
  confounders:
    - Two points do not make a law; the interval, not the point, is the product, and a third rung is the named successor.
    - Setup amortisation divisor is a judgement; publish per-divisor sensitivity with divisors 1, 20 and 100 targets.
    - Wall-clock mixes machine noise with scaling; conflicts and F_q-operations are the primary fit variables, time secondary.
  interpretation_limits:
    - Everything measured is at m equal 25 and 35; the boundary table is extrapolation, each entry labelled.
    - The protocol moves no exponent itself; it is the meter the exponent claims must pass through.
    - Nothing about deployed-system security.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Per-attempt charged cost at fixed formulation follows q^{alpha} with
        alpha constant across the measured rungs and extending to q equal
        2^{31}, 2^{37}.
      rigorous_support: >-
        Fixed descended-system shape from Weil-restriction degree bounds,
        imitating the uniform-random-system model where fixed-shape solving
        cost is q-independent up to the branch factor the fit measures.
      validation_plan: >-
        Two-rung fit plus cap-doubling stability plus null-object contrast;
        tail check: hardest decile per rung within a factor 8 of the rung
        median; third rung named as successor, transfer explicit.
    - id: H2
      statement: >-
        Decomposition probability per target stays 1/120 times the measured
        rung factor, extending to the endpoints.
      rigorous_support: >-
        Expected-count identity for uniform sums, imitating Poisson occupancy
        of representation counts.
      validation_plan: >-
        Exact enumeration at p equal 5, binomial intervals at p equal 7; tail
        check: zero-success target count consistent with the Poisson lower
        tail; transfer explicit.
  target_complexity:
    time_exponent: >-
      Fitted alpha per formulation, tested against Gaudry 1.6 for the full
      relation stage and against the sibling SAT branch exponents; the record
      reports alpha, it does not improve it.
    memory_exponent: >-
      Peak RSS scaling fitted alongside as a secondary exponent with the same
      two-point fragility warning.
    best_known: >-
      Gaudry O~(q^{1.6}) heuristic and rho 2^{75.8}, 2^{91.3} as the lines the
      extrapolated interval is drawn against; neither is challenged here.
    hidden_overhead: >-
      Setup amortisation and algebra estimates exposed per divisor and per
      formula; no hidden point estimate anywhere.
    tradeoff_note: >-
      Parallel over targets; the two-rung design is itself the cost control
      against a full ladder.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  dominated_by: >-
    n/a (no result claimed): a metrology protocol dominates nothing and is
    dominated by nothing as a result; as an attack it sits under rho and GHS
    with every other PDP step. Checked against every index-calculus row of
    the pasted map; the charged-yield standard with a two-rung boundary
    table is absent.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against program state: converts all
    sibling per-solve figures into comparable per-relation figures and gives
    decision item (4) its auditable extrapolation boundary.
