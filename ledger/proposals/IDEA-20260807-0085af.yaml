idea:
  id: IDEA-20260807-0085af
  question_id: RQ-NCP-001
  added: '2026-08-07'
  title: 'The path-algebra test ran on a quiver that abelianizes by construction, so its negative
    result was forced before any computation: rebuild it on a MULTI-VERTEX isogeny quiver, where
    phi o T_P = T_{phi(P)} o phi makes the commutator argument non-trivial, and keep EV-NCP-001''s
    own one-line falsifier'
  class: representation
  claim: 'EV-NCP-001 is a clean replicated negative -- the commutative signed-subset-sum quotient
    reproduced 100% of NC-found relations across 94,472 shadow replays, with 0 violations -- but
    its declared test boundary names the object it tested: ''quiver {T_Pi}+{neg} only (no isogeny
    arrows); word degree <= 6''. Translations and negation generate a dihedral-type action on
    ONE curve, and every arrow lives over the single vertex E. For a one-vertex quiver whose arrow
    group is virtually abelian, commutator collapse is close to forced a priori, so the experiment
    could not have come out any other way. Both KN-OPEN-008 and KN-TECH-014 define the intended
    object as modelling ''translations, negation, and small correspondences''; the third arrow
    class was never built. THE CLAIM IS THAT THE TESTED OBJECT AND THE INTENDED OBJECT ARE DIFFERENT,
    and that DEC-20260804-139a86''s listing of ''NCP'' among directions closed program-wide therefore
    over-reaches its own evidence.'
  mechanism: 'Take an ordinary prime-field curve E and its 2- and 3-isogenous neighbours as VERTICES.
    Arrows: the isogenies phi_l and their duals (vertex-changing), negation, and a small translation
    set T_P per vertex. Paths no longer all compose -- composability is a groupoid condition on
    vertices -- and the semidirect relation phi o T_P = T_{phi(P)} o phi is exactly the relation
    an abelianization argument must survive. In the one-vertex case that relation degenerates
    to T_P commuting with itself; in the multi-vertex case the conjugation action is by a non-identity
    map on the point group, so the commutator subgroup of the path groupoid is not obviously trivial.
    Run the abelianization diagnostic that EXP-NCP-001 already implements (ncp1_quiver_gb.sage
    plus its shadow-replay control) and ask its question unchanged: does every target-reaching
    word relation have a commutative image?'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - knowledge/techniques
    - knowledge/open-problems
    grep_results:
    - '''quiver'' and ''path algebra'' return ZERO occurrences across all 278 records in ledger/proposals
      and all 249 in ledger/hypotheses; the object is orphaned outside the legacy RQ-NCP-001 /
      H-NCP-001 / EXP-NCP-001 triple.'
    - KN-TECH-014 (noncommutative Groebner bases and path algebras of quivers) is cited by no
      ledger or experiment record at all.
    conclusion: No record builds a multi-vertex or isogeny-arrow quiver. Novelty against the external
      literature is UNVERIFIED and is not claimed here.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: Semaev summation systems,
      Groebner solving degree, index calculus over a small-x factor base, Pollard rho and BSGS.
      This record proposes no attack and claims no exponent.'
    tracked_object: A word in the path groupoid of the isogeny quiver, projected to the pair (its
      endpoint vertex, its evaluation in the point group of that vertex). The retained part is
      the endpoint and the group element; the discarded part is the word itself.
    one_step_propagation_rule: 'Appending an arrow a to a word w is deterministic on the projection:
      the vertex moves along a, and the group element is transported by the map a induces on points
      (phi for an isogeny arrow, negation, or translation by P). Composability is checked on vertices
      alone.'
    newness_score: 'As mathematics, small: groupoid algebras of isogeny graphs are standard objects.
      As an experiment in this corpus, the arrow class is the one EV-NCP-001 explicitly excluded,
      and it is the class the technique entry was written for.'
  lossy_projection_identifiability_audit:
    projection: word in the path groupoid -> (endpoint vertex, evaluated point).
    what_is_discarded: The order of the arrows, and hence the word itself. Two words with the
      same endpoint and the same evaluation are identified.
    is_it_only_a_change_of_coordinates: NO, and this is the point of the record. In the ONE-VERTEX
      case the projection is very nearly lossless in the relevant sense -- the evaluation factors
      through the abelianization, so the word order carries no extra information, which is precisely
      what EV-NCP-001 measured. In the MULTI-VERTEX case the conjugation relation phi o T_P =
      T_{phi(P)} o phi means the evaluation depends on the ORDER in which translation and isogeny
      arrows appear, so the projection discards something the target's operations do not let you
      recover. If it turns out that it does not, that is the answer and the lane closes properly.
    mirror_failure_check: 'CHECKED. The failure mode would be a diagnostic that returns ''abelianizes''
      for every input by construction. It does not: the diagnostic is a comparison against the
      commutative quotient, and on the two-vertex quiver a single word pair with phi(T_P(x)) !=
      T_P(phi(x)) already produces distinct images. That inequality holds whenever phi(P) != P,
      which is checkable before any search runs.'
  null_object_control:
    primary_null: REPLACE THE ISOGENIES BY RANDOM GROUP ISOMORPHISMS between the vertex groups,
      of the same orders, with no curve behind them. If the diagnostic reports the same non-abelianization
      rate on the random arrows as on the genuine isogenies, the effect is groupoid bookkeeping
      and carries nothing about elliptic curves. This null MUST be run before any positive reading.
    secondary_nulls:
    - 'ONE-VERTEX REGRESSION: re-run the harness on EV-NCP-001''s original arrow set and reproduce
      its 0 violations. A harness that does not reproduce the committed negative is not measuring
      the new object either.'
    - 'FORCED-VALUE GATE: on a vertex pair joined by an isogeny with phi(P) = P for every P in
      the translation set (achievable by choosing translations in ker phi''s complement trivially),
      the diagnostic MUST report abelianization. If it does not, it is broken.'
  assumptions:
  - Small-degree isogenies between toy prime-field curves are computable at the sizes EXP-NCP-001
    used (p ~ 431 upward).
  - The noncommutative Groebner engine in ncp1_quiver_gb.sage accepts a quiver with more than
    one vertex; if it does not, that is an instrumentation cost, not a result.
  predictions:
  - metric: fraction of target-reaching word relations whose commutative image is also target-reaching,
      on the multi-vertex quiver
    direction: lower
    minimum_effect: Any value below 1.0 that survives the random-isomorphism null is the first
      non-abelianizable target-reaching relation in the corpus. EV-NCP-001 measured exactly 1.0
      on the one-vertex quiver.
  - metric: reachability under word-order constraints versus the commutative quotient
    direction: different
    minimum_effect: EV-NCP-001 found strict PRUNING (350/439 vs 437/439). A multi-vertex quiver
      that instead EXTENDS reachability reverses the sign of the committed observation.
  minimal_test:
    design: 'Build the quiver on E and its 2- and 3-isogenous neighbours at p ~ 431 and p ~ 1009.
      Arrows: phi_2, phi_3, their duals, negation per vertex, and |T| in {2,3,4} translations
      per vertex. Enumerate words to degree <= 6 (EV-NCP-001''s own bound), collect target-reaching
      relations, and compute the commutative image of each. Report the abelianization fraction
      with the random-isomorphism null run first and the one-vertex regression run alongside.'
    controls:
    - random group isomorphisms in place of isogenies (primary null)
    - one-vertex regression against EV-NCP-001
    - shadow replay, as implemented in EXP-NCP-001
    required_metrics:
    - abelianization fraction per quiver and per null
    - target-reaching relation count and word-degree histogram
    - reachability fraction under word-order constraints
    - wall time and any censored cells, recorded as infrastructure
  falsification_conditions:
  - 'Abelianization fraction is 1.0 on the multi-vertex quiver at both primes and both arrow sets:
    the collapse extends to the arrow class that was supposed to break it, which is what a real
    closure of KN-OPEN-008 requires, and this record''s premise is wrong.'
  - 'The random-isomorphism null shows the same non-abelianization rate: any effect is bookkeeping,
    not elliptic-curve structure.'
  - phi(P) = P holds for the whole translation set by construction at these parameters, in which
    case the quiver is one-vertex in disguise and the design is void.
  confounders:
  - Degree-6 word bound may be too short to reach the first non-commuting configuration; a null
    result at degree 6 is scoped to degree 6.
  - Isogeny arrows change the group order between vertices when the curves are not isogenous over
    the same field; use l-isogenies within one isogeny class so the orders match.
  - Groebner engine differences between the one-vertex and multi-vertex settings could change
    the relation census for reasons unrelated to the algebra.
  interpretation_limits:
  - Toy scale only (p <= 2^12). Nothing here is a cryptographic-scale claim.
  - A non-abelianizable relation is not an attack and not a cost improvement; it is the condition
    KN-OPEN-008 names for the path-algebra route to remain open.
  - This record does not dispute EV-NCP-001 within its declared boundary. It disputes the program-wide
    reading of it in DEC-20260804-139a86.
  heuristic_assumptions:
  - id: HEUR-NCPQ-1
    statement: The abelianization behaviour of target-reaching relations at word degree <= 6 is
      directionally representative of longer words.
    rigorous_support: None. EV-NCP-001 relied on the same assumption for its negative.
    validation_plan: Sweep the word-degree bound over 4,5,6 and report the trend rather than a
      single value.
  target_complexity:
    time_exponent: n/a -- no algorithm proposed
    memory_exponent: n/a
    best_known: Pollard rho, exponent 1/2, for the underlying problem
    hidden_overhead: n/a
    tradeoff_note: This is a structure probe, not a cost claim.
  dominated_by: 'Pollard rho at exponent 1/2, trivially, since no attack is proposed. Rows checked
    across time, memory and data before writing: rho at p^{1/2} and O(1) memory; BSGS at p^{1/2}
    time and p^{1/2} memory; Semaev index calculus as costed in FINDING-PF-IC-001 at total exponent
    ~2.05 per target, i.e. worse than rho at these sizes. This record adds no row.'
  sota_delta: ZERO on every attack axis. The deliverable is a measured abelianization fraction
    on an arrow class the corpus has never built, plus either the first non-commutative target-reaching
    relation or an extension of the collapse to the class that was supposed to break it.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.95 that the harness reproduces EV-NCP-001's one-vertex negative.
    0.30 that the multi-vertex quiver produces at least one target-reaching relation with a non-commutative
    image at degree <= 6 -- it is not higher because the point group is still abelian and the
    conjugation action may simply permute translations within the same commutative image, and
    not lower because the semidirect relation is genuinely non-trivial whenever phi(P) != P. 0.05
    that any such relation is cheaper to find than the commutative search, which is the only branch
    that would bear on cost at all.
