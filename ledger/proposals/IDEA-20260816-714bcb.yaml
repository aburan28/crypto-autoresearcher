idea:
  id: IDEA-20260816-714bcb
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: Before any frontier is read, plant characteristics of known satisfiability into the step-reduced
    search instrument and measure recovery rate against difficulty and false-positive rate against
    provably unsatisfiable twins, so that a failure here voids every other measurement in this bucket
  class: control
  claim: '(A) Every measured step-reduced frontier in this bucket is a statement about an instrument,
    and an instrument that cannot find a solution it was handed cannot support a negative reading,
    while an instrument that reports a solution on a provably unsatisfiable instance cannot support
    a positive one. This proposal makes both directions measurable before any frontier number is trusted.
    Plant, by construction, message pairs that satisfy a declared step-reduced predicate at step count
    s, encode the instance without telling the encoder where the solution is, and measure the recovery
    rate as a function of a difficulty knob that is varied monotonically. Separately construct twins
    that are unsatisfiable by construction - the identical instance with one additional clause that
    contradicts a bit the planted solution fixes - and measure the rate at which the instrument returns
    SAT on them, which must be exactly zero. (B) The tracked object is the pair (recovery rate, false-positive
    rate) as a function of planted difficulty, and the informative content is the SHAPE of the recovery
    curve: it must decay as difficulty rises. A recovery rate flat across difficulty is, per inventor-protocol
    section 3, the signature of an artifact rather than of a strong instrument, because a quantity
    that should degrade and does not indicts the measurement. (C) NOT CLAIMED: that a high recovery
    rate makes any subsequent frontier reading correct, since detecting planted structure is easier
    than finding unknown structure and this asymmetry is not quantified here; that any planted characteristic
    resembles one a real search would find; that passing this gate licenses any claim about SHA-256
    at any step count. This contract produces no frontier, no attack, and no security statement of
    any kind. Its only output is a licence, or the withdrawal of one, for the other measurements in
    this bucket.'
  mechanism: 'STAGE A. Build the planting construction: choose a message pair by fixing the free schedule
    words directly, run the step-reduced compression forward, and read off the step-reduced predicate
    the pair satisfies. Because the pair is chosen first and the predicate read second, satisfiability
    is guaranteed by construction and requires no search. STAGE B. Define the difficulty knob explicitly:
    the number of output-difference bits forced to zero, raised monotonically, with everything else
    held fixed. STAGE C. Encode each planted instance with the frozen CNF encoder used by the frontier
    measurements in this bucket, blind to the planted assignment, and run the frozen solver at the
    frozen budget with the declared seeds. STAGE D. Construct the unsatisfiable twin of each instance
    by adding a unit clause contradicting one bit of the planted solution and asserting the planted
    solution is otherwise forced; verify unsatisfiability independently by a second solver or by exhaustive
    enumeration at the smallest widths. STAGE E. Measure recovery rate per difficulty level and false-positive
    rate on the twins. STAGE F. Refutation route: a flat recovery curve, or any nonzero false-positive
    rate, withdraws the instrument''s licence, and the withdrawal is recorded as a measured obstruction
    that names the exact difficulty level at which the instrument stops behaving, which is reusable
    by every later agent.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full, ledger/questions/RQ-INSTR-f8faa0.yaml opening section,
      and docs/inventor-protocol.md section 3. Ran grep -rl 'RQ-SHATWO' over ledger/ experiments/
      knowledge/ coordination/; grep -ril 'SAT encoding|CNF' and grep -ril 'signed-difference|generalized
      condition' over ledger/proposals/ ledger/hypotheses/ knowledge/techniques/ knowledge/findings/.
    results: 'RQ-INSTR-f8faa0 exists and states the doctrine directly in its decision_target: an instrument
      that cannot detect a planted signal cannot support a negative, and one that fires on a matched
      null cannot support a positive, both directions required. Its scope block binds it to toy ordinary
      prime-field short-Weierstrass curves, CM curves, and matched random-curve nulls at the same
      p - an ECDLP instrument, sharing no code with a CNF encoder for a hash. The task brief warns
      that RQ-INSTR-f8faa0 already carries 15-plus proposals auditing this program''s cost model,
      machine variance and single-machine timing; this proposal audits none of those and measures
      no timing model. ''SAT encoding|CNF'' returned ZERO hits across proposals, hypotheses, techniques
      and findings, and ''signed-difference|generalized condition'' returned ZERO, so no record in
      this repository plants a characteristic into any symmetric-cryptanalysis instrument. RQ-SHATWO
      carries no proposals at all.'
    verdict: 'UNVERIFIED. No external literature is readable here and nothing is asserted about it.
      Claimed new: nothing methodological - planted-signal validation is this program''s own standing
      doctrine under RQ-INSTR-f8faa0 and inventor-protocol section 3, and planting solutions into
      SAT instances is an obvious construction. What is claimed is the application and its blocking
      role: the first planted-signal gate for a symmetric-cryptanalysis instrument in this program,
      with a monotone difficulty knob so the decay test can run, an unsatisfiable-twin arm giving
      a two-sided reading, and an explicit dependency edge making every other frontier measurement
      in this bucket void if the gate fails. Assembled from known parts. Within this repository the
      verifiable fact is that zero records mention a CNF encoding and RQ-SHATWO carries no proposals.'
  object_first_candidate:
    tracked_object: The pair (recovery rate r(d), false-positive rate f(d)) of a frozen search instrument
      at planted difficulty d, where r(d) is the fraction of planted-satisfiable instances at difficulty
      d on which the instrument returns a certificate-verified satisfying assignment within the frozen
      budget, and f(d) is the fraction of the provably unsatisfiable twins at the same difficulty
      on which it returns SAT.
    lossiness: 'Lossy. Discarded: the planted assignments, the search traces, the identity of which
      characteristic was planted, the solver''s internal state, and all timing beyond the budget cutoff
      - everything except two rates per difficulty level. Many distinct instrument behaviours yield
      identical rates, so this is a projection, not a re-coordinatization. Why the remainder propagates:
      the difficulty knob is defined so that instances at level d+1 are strict refinements of those
      at level d - one more output-difference bit forced - so the planted solution set is nested and
      r(d) is well-defined as a monotone-expected sequence without reference to the discarded material.
      The decay test reads exactly that monotonicity and needs nothing else.'
    propagation: The iterated operation is one increment of the difficulty knob, which forces one
      additional output-difference bit to zero. Under a competent instrument, r(d) decays as d rises,
      because the satisfiable region shrinks while the budget is fixed, and f(d) stays pinned at zero
      because the twins remain unsatisfiable by construction at every level. Under a broken encoder,
      f(d) becomes nonzero as soon as the added constraint is mis-encoded, which is precisely the
      failure the twin arm is built to expose. Under an artifact - an encoder that trivially satisfies
      its own predicate - r(d) stays flat as d rises, which is the section 3 structural tell.
    survival_score: 'The object is well-defined across the whole declared difficulty ladder and dissolves
      at exactly one boundary, which is the honest limit of the whole gate: planted characteristics
      are found, not searched for, so a high r(d) at every level says nothing about the instrument''s
      ability to find an UNPLANTED characteristic. That asymmetry is not quantified here and is stated
      as the gate''s ceiling. Concretely, the gate survives as far as licensing negatives (a low r(d)
      at level d means a null result at that difficulty is uninformative) and does not survive into
      licensing positives beyond the twin arm''s f(d) = 0.'
  null_object_control: 'The unsatisfiable twins ARE the null object, and they run in the same invocation
    through the identical encoder and solver: each is the byte-identical CNF of a planted instance
    plus one unit clause contradicting a bit that the planted solution forces, so it is unsatisfiable
    by construction and its unsatisfiability is independently confirmed by a second solver, and by
    exhaustive enumeration at the smallest tested width. A second null runs alongside: random CNF
    instances with matched variable and clause counts, on which the SAT rate must be far below the
    signal arm''s. For the gate to license anything, the twin arm must show f(d) = 0 at every level,
    and the random-CNF arm must not match the signal arm''s recovery rate; if random instances are
    solved as often as planted ones, the instrument is solving something other than the intended predicate.'
  discriminated_from:
  - RQ-INSTR-f8faa0, which owns planted-signal doctrine in this program but is scoped by its own scope
    block to toy prime-field curves and matched random-curve nulls; no code, no object and no instrument
    is shared with a CNF encoder for a hash, and this proposal audits none of the cost-model or machine-variance
    questions that its 15-plus existing proposals cover.
  - The budget-response entry in this bucket, which measures a frontier; this measures whether that
    measurement is licensed at all, and its failure voids that entry rather than competing with it.
  - KN-TECH-080 audit 1 (baseline reproduction), which validates a method against a known published
    result; this validates an instrument against a self-constructed known-satisfiable instance and
    therefore runs even while the reproduction lane is blocked on primary text.
  - Ordinary SAT solver benchmarking on crafted instances, which ranks solvers by runtime; here the
    solver is frozen, the runtime is capped, and the reported quantity is a two-sided detection rate
    whose decay in difficulty is the actual signal.
  - Ordinary unit testing of an encoder, which checks that encoded formulas are well-formed; the twin
    arm checks a stronger property, that the encoder's satisfiability semantics match the primitive's,
    which a well-formedness test cannot see.
  assumptions:
  - A message pair chosen first and its predicate read second yields an instance that is satisfiable
    by construction; this is exact, not probabilistic, and is re-checked by verifying the planted
    assignment against an independent implementation before encoding.
  - Adding a unit clause contradicting a bit forced by the unique planted solution yields an unsatisfiable
    instance; this requires that the fixed bit is genuinely forced, which is verified by independent
    solving or exhaustive enumeration rather than assumed.
  - 'The difficulty knob is monotone: instances at level d+1 have a solution set contained in those
    at level d, by construction of the nested constraint sequence.'
  - The encoder and solver used here are byte-identical to those used by the frontier measurements
    this gate licenses; a gate on a different instrument licenses nothing.
  predictions:
  - metric: false-positive rate f(d) on unsatisfiable twins
    direction: lower
    minimum_effect: 0.0 exactly at every difficulty level; any nonzero value voids the instrument
      and every measurement depending on it
  - metric: recovery rate r(d) on planted instances as difficulty rises
    direction: lower
    minimum_effect: strictly decreasing across the ladder, with r at the top level at least 0.2 below
      r at the bottom level; a flat curve is scored as the section 3 artifact signature and withdraws
      the licence
  - metric: recovery rate on matched random CNF instances versus planted instances at the lowest difficulty
    direction: lower
    minimum_effect: at least a factor of 5 below the planted arm, otherwise the instrument is not
      solving the intended predicate
  - metric: certificate verification rate of returned assignments in the planted arm
    direction: higher
    minimum_effect: 1.0 exactly; a returned assignment that does not decode to a verifying message
      pair is an encoder fault
  minimal_test:
    design: 'Cheapest sufficient gate: one width (w = 16), one step count in the middle of the intended
      ladder, three difficulty levels rather than the full ladder, twenty planted instances and twenty
      twins per level, five seeds. That is 600 solver invocations at the frozen budget and it already
      fires all three decision rules - f(d) = 0 is checked at 300 of them, the decay of r(d) is read
      across three points, and the random-CNF arm adds 60 more. The construction cost is near zero
      because planting requires no search: choose the free schedule words, run forward, read the predicate.
      Independent unsatisfiability confirmation of the twins is the only added cost and is bounded
      by exhaustive enumeration at w = 8 for a calibration subset. If f(d) is nonzero anywhere in
      this cheap pass, no larger gate is worth running and the encoder is rebuilt; if r(d) is flat
      across the three levels, the same conclusion follows from a fifth of the cost.'
    controls:
    - Unsatisfiable-twin arm at every difficulty level, byte-identical CNF plus one contradicting
      unit clause, same invocation.
    - Independent unsatisfiability confirmation of every twin by a second solver, and by exhaustive
      enumeration on a calibration subset at the smallest width.
    - Matched random-CNF arm with equal variable and clause counts.
    - Certificate verification of every returned assignment against an independently written reduced-width
      implementation.
    - Replicate seeds at every cell, with the spread reported so that a rate difference smaller than
      the spread is not read as a decay.
    required_metrics:
    - recovery rate r(d) per difficulty level with replicate spread
    - false-positive rate f(d) on twins per level
    - SAT rate on the matched random-CNF arm
    - certificate verification rate of all returned assignments
    - independent unsatisfiability confirmation status per twin
    - wall-clock and memory per invocation, and the count of TIMEOUT cells recorded as budget outcomes
  falsification_conditions:
  - f(d) is nonzero at any difficulty level, which withdraws the instrument's licence outright.
  - r(d) is flat across the difficulty ladder within replicate spread, which is the section 3 artifact
    signature.
  - The matched random-CNF arm is solved at a rate comparable to the planted arm, showing the instrument
    is not solving the intended predicate.
  - Any returned assignment fails independent verification.
  - An independent solver disagrees with the constructed unsatisfiability of any twin, showing the
    twin construction is wrong and the whole null arm is void.
  - r(d) is at or near zero at the lowest difficulty level, meaning the instrument cannot find even
    a handed solution and licenses no negative reading anywhere.
  confounders:
  - Planted solutions may sit in regions the solver reaches easily for reasons unrelated to the primitive,
    inflating r(d); the matched random-CNF arm bounds this only partially and the residual is stated
    rather than removed.
  - The difficulty knob conflates constraint count with constraint structure, since forcing more output
    bits changes both; variable and clause counts per level are reported so the conflation is auditable.
  - Solver preprocessing may simplify twins differently from planted instances because of the extra
    unit clause; the preprocessing configuration is frozen and its effect on clause counts is reported
    per arm.
  - Replicate spread on solver outcomes can exceed the decay being read; the 0.2 drop threshold is
    set above the pilot-observed spread and that pilot spread is reported alongside.
  - A twin whose contradicted bit is not genuinely forced would be satisfiable, appearing as a false
    positive that is really a construction error; independent confirmation is what separates those
    two readings.
  interpretation_limits:
  - Passing this gate licenses reading the frontier measurements in this bucket; it does not make
    any of their numbers correct.
  - Detecting a planted characteristic is strictly easier than finding an unknown one, and this contract
    does not quantify that asymmetry, so a high r(d) is not evidence of search power.
  - All rates are for one width, one encoder, one solver version and one budget; a different instrument
    needs its own gate.
  - Nothing here is a statement about SHA-256 at any step count, about full 64-step SHA-256, or about
    any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The gate's own cost is a few hundred to a few thousand
      capped solver invocations plus a construction step that requires no search at all.
    memory_exponent: No attack memory exponent is claimed. Per-invocation memory is capped and recorded;
      exhaustive-enumeration confirmation at w = 8 is bounded by the enumerated space size, which
      is declared in advance.
    best_known: 'No incumbent attack. The incumbent this improves on is an unrun check: this program
      has no planted-signal gate for any symmetric-cryptanalysis instrument, since ''CNF'' and ''SAT
      encoding'' return zero hits across proposals, hypotheses, techniques and findings, while RQ-INSTR-f8faa0
      establishes that the program considers such a gate mandatory in the ECDLP lane.'
    hidden_overhead: 'The twin construction is where the hidden work is: proving that the contradicted
      bit is genuinely forced by the planted solution, rather than merely consistent with it, is the
      difference between a null arm and a construction error that reads as an instrument failure.
      Independent confirmation charges that cost. A second hidden cost is that this gate must be re-run
      whenever the encoder or solver version changes, which makes it a recurring tax on every frontier
      measurement rather than a one-time expense, and that tax should be stated to a Coordinator before
      the lane is opened.'
  dominated_by: 'n/a (no result claimed). Pareto check across time, memory and data/queries: I checked
    every frontier row present in this repository and found none for this object - no experiment directory,
    evidence record, proposal or hypothesis plants a signal into a hash-cryptanalysis instrument,
    ''CNF'' returns zero hits, and RQ-SHATWO carries no proposals. RQ-INSTR-f8faa0''s rows concern
    prime-field curve instruments and are not on the same frontier. This repository cannot adjudicate
    against external work in either direction.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The delta is from an ungated instrument
    to a two-sided gated one: currently zero measured recovery or false-positive rates exist here
    for any symmetric instrument, and a run would produce r(d) and f(d) across the difficulty ladder
    with replicate spread, plus a pass or fail licence that other contracts in this bucket cite by
    run id.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. (1) That planted instances can be constructed and verified without
    search: ~0.95, since this is forward evaluation and not a search problem at all. (2) That the
    twin construction yields genuinely unsatisfiable instances confirmed independently: ~0.8; the
    risk is that a contradicted bit is not forced, which is a real and easy mistake and is exactly
    why independent confirmation is in the contract rather than assumed. (3) That the instrument passes
    both arms - f(d) = 0 everywhere and r(d) decaying by at least 0.2 across the ladder: ~0.55, and
    I hold this near even deliberately, because an encoder written for this bucket has never been
    gated and the most common outcome of a first gate is a discovered encoder fault. (4) That passing
    implies the frontier readings in this bucket are trustworthy: ~0.3, and stated low because the
    planted-versus-unplanted asymmetry is real, unquantified, and named in the interpretation limits
    rather than papered over.'
