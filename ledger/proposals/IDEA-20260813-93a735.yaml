  discriminated_from:
    - explanation: Empirical transcript leakage.
      discriminator: The audit can identify an interface obligation without observing any transcript samples.
    - explanation: A valid single-transcript simulator that composes uniformly.
      discriminator: Derive the multi-signature specialization with unchanged simulator choice and fully charged resources.
    - explanation: A per-key fitted null mislabeled as a simulator.
      discriminator: Require simulator selection before the secret key and forbid secret-derived advice.
