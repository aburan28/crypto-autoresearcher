idea:
  id: IDEA-20260813-93a735
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  title: Uniform-simulator resource and quantifier audit
  class: control
  claim: >-
    Audit the filed primary security statement to determine whether it supplies
    one uniform, efficient, secret-free simulator for the full allowed
    multi-signature transcript experiment, or only per-key, per-statement, or
    non-uniform existential simulators whose advice or resource bounds do not
    compose. The outcome may expose a proof obligation, but this proposal makes
    no claim of a proof gap or protocol leakage.
  mechanism: >-
    Statements of the form for every key there exists a simulator can be weaker
    than the operational requirement that there exists one uniform simulator
    working for every key, message schedule, and allowed adaptive transcript.
    Likewise, a simulator may match a distribution only with secret-derived
    advice, uncharged rewinding, rejection, preprocessing, or oracle access.
    An exact quantifier-and-resource table can distinguish a true simulator
    null from a key-specific fitting procedure before any empirical comparison.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-020 proposes a statistical transcript probe, while this is a
    proof-interface control that can block the probe if its purported simulator
    is not the one guaranteed by the primary theorem. IDEA-20260807-ba5eda
    concerns verifier accept fibres and strong unforgeability, not simulator
    quantifier order. IDEA-20260808-19876e concerns the exponent ceiling of a
    constant distinguisher; this proposal audits whether the null distribution
    and its full resource bill are legitimate at all.
  predictions:
    - metric: simulator quantifier and interface obligations resolved from primary text
      direction: different
      minimum_effect: >-
        Every key, message, adaptivity, advice, oracle, and randomness quantifier
        is mapped without an unresolved scope change; any gap is recorded as an
        obligation, not as leakage.
    - metric: simulator resource ratio to real signing and transcript verification
      direction: different
      minimum_effect: >-
        A symbolic, source-supported bound includes rewinding, rejection,
        preprocessing, advice, oracle, memory, and success probability rather
        than treating them as free.
    - metric: planted quantifier-swap positive-control detection
      direction: higher
      minimum_effect: >-
        The audit must reject a synthetic theorem that deliberately swaps
        exists-simulator and forall-key or grants secret-derived advice.
  minimal_test:
    design: >-
      The minimal discriminating action is a source-filing and formal audit, not
      an experiment: file the exact primary Round-3 theorem, simulator
      construction, proof, permitted query model, and complexity statement;
      translate them into a quantifier/resource matrix; and compare that matrix
      with RQ-SQISIGN-001. No sampling experiment may be designed or approved
      until this gate is complete.
    controls:
      - Genuine source-defined simulator interface as the mandatory null specification for every later experiment.
      - Planted positive control theorem with a deliberate forall/exists swap.
      - Planted positive control simulator with secret-derived advice and uncharged rejection.
      - Nearby valid theorem with one uniform secret-free simulator and identical resource notation.
      - Independent check that the experiment's messages and adaptivity stay within the theorem's scope.
    required_metrics:
      - Quantifier matrix over keys, statements, messages, transcripts, randomness, and simulator choice.
      - Resource ledger for time, memory, data, preprocessing, oracle access, rewinding, rejection, and verification.
      - Exact unresolved obligations and primary-source locations.
      - Pass/fail of planted invalid and nearby valid controls.
  controls:
    - primary_source_true_simulator_interface_mandatory
    - planted_quantifier_swap_positive_control
    - planted_secret_advice_positive_control
    - nearby_uniform_simulator_valid_control
  confounders:
    - Treating informal prose as stronger than the formal theorem.
    - Conflating honest-verifier, single-transcript, or selective security with the requested adaptive multi-signature distribution.
    - Ignoring non-uniform advice, preprocessing, rewinding, aborts, or success amplification.
    - Importing a simulator from another SQIsign round or scheme variant.
    - Mistaking an unresolved proof obligation for an observed vulnerability.
  falsification_conditions:
    - >-
      Primary sources exhibit one uniform, efficient, secret-free simulator
      under the exact RQ-SQISIGN-001 transcript and query quantifiers, with every
      resource and failure probability fully bounded.
    - >-
      The apparent quantifier or resource gap results only from an incorrect
      transcription and disappears under independent primary-source checking.
    - >-
      The audit fails to detect either planted invalid theorem, invalidating the
      method rather than supporting a gap.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - A missing or weaker theorem is not evidence that the protocol leaks.
    - A valid simulator theorem does not establish implementation conformance.
    - The audit cannot approve a sampling experiment; the Coordinator must act after sources and controls are filed.
    - >-
      GOAL-SSI-001 exclusively owns EndRing/OneEnd hard-problem algorithms,
      reductions, and status. This proof-interface audit is restricted to
      protocol simulation and cannot change or imply a GOAL-SSI-001 result.
  assumptions:
    - The primary Round-3 specification, proof, and simulator construction can be filed verbatim or with auditable locations.
    - Resource notation can be normalized without strengthening the theorem.
    - RQ-SQISIGN-001's target transcript and multi-signature model can be stated formally.
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >-
      Align the theorem's simulator quantifiers, advice, oracles, resources, and
      failure events with one operational genuine-simulator null for the RQ.
    baseline_embedding:
      parameter_slice: >-
        Reproduce the primary theorem exactly as stated for its declared scheme,
        parameter domain, adversary class, and transcript count; if it is not a
        family theorem, record that non-family boundary.
      reproduction_check: >-
        Two independent transcriptions must agree on forall/exists order,
        simulator inputs, adaptivity, resources, and success or statistical distance.
    observation_collision:
      observable: The public transcript distribution named by the theorem.
      distinct_preimage_search: >-
        Exhibit whether two secret keys or adaptive histories with the same
        public statement require different existential simulators or advice;
        such a collision marks a quantifier obligation, not leakage.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Exact theorem specializations for one transcript, many nonadaptive transcripts, and allowed adaptive transcripts.
        predicted_gain: Locates the first composition step not justified by the primary quantifiers.
      - transform: boundary_lift
        proposed_object: Uniform simulator interface with explicit advice, oracle, and resource parameters.
        predicted_gain: Makes hidden resource or secret-dependence impossible to omit from later null controls.
    quantifier_order: >-
      Required operational form is one simulator construction chosen without
      the secret and before keys, allowed messages, and transcript randomness,
      subject exactly to the primary theorem. Record, without strengthening,
      every place the source instead has a different order.
    method_ceiling:
      strongest_certifiable_claim: >-
        A source-supported statement that the theorem does or does not establish
        the exact uniform simulator interface and resource bound required by the RQ.
      nearby_object_control: >-
        A synthetic neighboring theorem identical in notation but with one
        explicit uniform secret-free simulator; the audit must distinguish it
        from a per-key existential simulator.
    proof_obligations:
      - claim: Reproduce the primary theorem and simulator without strengthening either.
        responsibility: baseline
      - claim: Map the exact transcript and query interface into the theorem domain.
        responsibility: interface
      - claim: Preserve forall/exists order under single-to-multiple transcript specialization.
        responsibility: correctness
      - claim: Charge simulator time, memory, preprocessing, advice, oracle calls, rewinding, and failures.
        responsibility: runtime
      - claim: State whether any theorem is a family result and preserve its parameter scope.
        responsibility: scope
      - claim: Separate a proof obligation from empirical or cryptanalytic evidence.
        responsibility: strictness
    not_applicable_reason: null
  target_complexity:
    time_exponent: n/a; proof-interface audit, not a hard-problem algorithm
    memory_exponent: n/a; proof-interface audit, not a hard-problem algorithm
    best_known: >-
      Any later hard-problem comparison must use KN-TECH-057: van
      Oorschot-Wiener p^(1/2) over Fp2, or conditional p^(1/4) over Fp only with
      its stated mixing assumption. The simulator's own resources are charged separately.
    hidden_overhead: >-
      Non-uniform advice, preprocessing, oracle setup, rewinding, rejection,
      inverse success probability, transcript count, and verification cannot be
      hidden. Literature acquisition and independent theorem transcription are
      also explicit work.
    tradeoff_note: >-
      A simulator may exchange time for memory or success probability; the
      resource table must expose the complete Pareto curve. No such tradeoff
      changes the EndRing/OneEnd baseline.
  sota_delta:
    claim: No speedup and no leakage claimed; exponent delta is 0.
    baseline_time_exponent_fp2: 0.5
    conditional_baseline_time_exponent_fp: 0.25
    proposed_time_exponent_delta: 0.0
    proposed_memory_exponent_delta: 0.0
    pareto_rows:
      time: Simulator construction, rewinding, rejection, and amplification are charged.
      memory: Simulator state and any advice are explicit.
      data: Transcript count and adaptive query volume are explicit.
      preprocessing: Key-dependent and global preprocessing are separated and charged.
      oracle: Every oracle and its setup or query count must be source-supported.
      verification: Theorem transcription, interface matching, and control checks are charged.
    frontier_check: >-
      Checked all rows against transcript probing, abort, verifier-fibre,
      constant-distinguisher, and the disclosed true-simulator experiment. This
      control precedes them by validating the simulator and quantifiers they
      would otherwise assume.
  dominated_by: null
  estimated_cost:
