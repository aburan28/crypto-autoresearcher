idea:
  id: IDEA-20260922-818b73
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE EXCHANGE RATE AGAINST RHO: gamma*(cell) = 2^(60.9 - floor_bits), the
    single scalar any ECC2K-130 relation-based line's measured solver-to-floor
    overhead must clear to tie rho, worked zero-compute on the already-closed
    QSP row (where it is unreachable by at least 50 bits under the paper's own
    realistic cost model) and proposed as the standard instrument for every
    other cell of RQ-BINSTD's reachability table
  class: measurement

  claim: >-
    For any relation-based decomposition line at a cell (curve, arity m,
    factor-base/system parameters), let F(cell) be its own IDEALIZED cost
    floor in bits (a Bezout, resultant, mixed-volume or semi-regular bound
    already computed for that cell in this program's corpus) and let
    R = 60.9 be ECC2K-130's matched rho baseline (KN-LIT-096, with the
    Frobenius and negation speedups already folded in). Define the EXCHANGE
    RATE gamma*(cell) = 2^(R - F(cell)): the factor by which the line's REAL,
    measured per-attempt solver cost is allowed to exceed its own idealized
    floor before that cell stops being able to tie rho even in principle. This
    converts "does line L reach ECC2K-130 below rho" into a bounded,
    toy-measurable question about gamma_meas = measured_operation_count /
    idealized_floor, without running anything at n = 131: if a toy-scale
    ladder of gamma_meas for a line shows no tendency to approach gamma* as
    the toy cell's shape moves toward the target parameters, that line's
    floor is falsified as a reachable number, reported as "not observed to
    close" (never as "impossible", per the Idea Generator's standing
    prohibition).
    ZERO-COMPUTE WORKED EXAMPLE, USING NUMBERS ALREADY IN THE CORPUS. The QSP
    factor-base line at (n' = 33, m = 4): RQ-QSP-f9bbdb's own
    Frobenius-reduced resultant-model floor is F = 60.6 bits, so
    gamma*(cell) = 2^(60.9 - 60.6) = 2^0.3 ~ 1.23 -- the line's real solver
    cost is allowed to exceed the idealized floor by at most 23% to tie rho.
    RQ-QSP-f9bbdb's own motivation block states that "the paper's own cost
    formula with every constant kept" (i.e. a LESS idealized, more realistic
    floor for the identical cell) bottoms out at F' = 133 bits, i.e.
    gamma*' = 2^(60.9 - 133) = 2^-72.1: the realistic-formula floor for this
    cell is already 72 bits ABOVE what gamma* = 1.23x would tolerate, using
    only the paper's own arithmetic, no engine run. IDEA-20260916-3f7a1c's
    certified factor-base-size bound (|F| <= 2401 at n' = 33, a proven
    certificate, not an estimate) pushes the actual attempts column to
    >= 110 bits by direct recomputation (that record's own claim D), an
    EVEN LARGER gap. So at this one cell the exchange rate is not merely
    unmet, it is unmet by 50-72 bits before any solver is instrumented --
    which is exactly the content docs/inventor-protocol.md section 4 asks a
    closure to carry: a MEASURED obstruction (the gap in bits), not a verdict.
    THE PROPOSED NEW CONTENT. (i) The instrument itself -- gamma*(cell) as a
    standardized column RQ-BINSTD's reachability table should carry beside
    every DEFINED WITH A COMPUTED COST cell, so "beats/loses to rho" reduces
    to one comparable number per line instead of a bespoke argument per
    question. (ii) A first LIVE application at a cell this program has
    proposed measuring but not yet run: IDEA-20260916-b84e2d's own chain-system
    ladder (n <= 41, m in {2,3,4}, d in {2,3}), whose deliverable D_S (the
    measured ideal degree) is exactly the ingredient gamma_meas needs once
    that record executes -- this record does not duplicate b84e2d's
    measurement, it adds the derived quantity (gamma_meas and its trend
    against gamma*) that b84e2d's own predictions section does not compute,
    because b84e2d asks "does D_S match M(E)", a pure sizing question, not
    "how far is this line from tying rho at THIS cell specifically".

  mechanism: >-
    NO NEW TRACKED OBJECT IS PROPOSED. This is a second-order, population-level
    MEASUREMENT over objects already declared by their owning lines: the QSP
    factor base's object (R1 x-coordinate, Sigma = {sigma^{n'}, substitution by
    lambda}, Class I partial-action, per IDEA-20260916-5c9d6e's own
    declaration) and the chain system's object (R1, Sigma = {phi}, Class I,
    per IDEA-20260916-b84e2d's own declaration). What this record adds is the
    RATIO gamma_meas / gamma*, which is not itself a lossy projection of a
    group element -- it is a derived scalar over already-declared objects, and
    the lossy-projection test therefore applies to those owning records, not
    to this one; this record inherits their declarations rather than
    re-litigating them, per RQ-BINSTD's "owns no mechanism" rule.
    REPRESENTATION CLASS AND STAGE. R1 (inherited). The charged stage this
    quantity speaks to is the DECISION of whether the decomposition-attempt
    stage cost, once measured, can ever be reconciled with the rho baseline --
    upstream of any single phase (membership, relation, linear algebra), and
    downstream of all of them, since gamma* is stated in the SAME total-cost
    bits RQ-QSP-f9bbdb's table already reports.
    F2 DECLARATION. Every line this instrument is applied to is F2
    (factor-base decomposition); this record adds no factor base and escapes
    no KN-OPEN-020 class on its own -- it aggregates the classes its
    component lines already declare (QSP: implicit-membership, per
    IDEA-20260916-5c9d6e's interpretation_limits).

  novelty_status: unverified

  citations:
    - ref: RQ-QSP-f9bbdb
      provenance: internal
      claim: >-
        The 60.6-bit Frobenius-reduced resultant-model floor at (n'=33,m=4),
        stated as "a floor no solver is known to reach"; the 133-bit floor
        from "the paper's own cost formula with every constant kept"; both
        quoted from the motivation block, item (5).
      verified_by: idea-generator, this session, RQ-QSP-f9bbdb.yaml read in full.
    - ref: IDEA-20260916-3f7a1c
      provenance: internal
      claim: >-
        Certified injection bound |F| <= 2401 at n' = 33 (claim A-C); the
        recomputed attempts column >= 110 bits at d = 3 (claim, mechanism
        section, "WHY THE TABLE ROW CHANGES").
      verified_by: idea-generator, this session, record read in full.
    - ref: IDEA-20260916-b84e2d
      provenance: internal
      claim: >-
        The chain-system ladder (n<=41, m in {2,3,4}, d in {2,3}), status
        proposed, deliverable D_S per cell, and the discrepancy between the
        analysis note's M(E) = 2^{m(m-1)} d^{m(m-1)} and the paper's
        Appendix A.1 M(E) = 2^{m(m-1)} d^{m(m-1)/2} (2^31.0 vs 2^21.5 at
        (4,3)) -- the two candidate floors this record's gamma* would need to
        pick between once that record runs.
      verified_by: idea-generator, this session, record read in full.
    - ref: KN-LIT-096
      provenance: internal
      claim: The ECC2K-130 rho baseline of 2^60.9 iterations.
      verified_by: idea-generator, this session, cited via RQ-BINSTD-b6f698 and KN-LIT-661e97, both read in full.

  citation_note: >-
    No literature outside this program's own corpus was checked this session
    (no web search was run). The "exchange rate" framing itself -- a ratio of
    measured cost to an idealized combinatorial floor, used as a go/no-go
    threshold -- is a standard move in cryptanalytic cost accounting (recalled
    as a generic pattern, not a specific citation); whether it has been named
    this way for index calculus specifically was not checked.

  assumptions:
    - >-
      F(cell) is read from an EXISTING record's own stated floor, never
      recomputed here; this record trusts RQ-QSP-f9bbdb's and
      IDEA-20260916-b84e2d's arithmetic and does not re-derive it.
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2 is the family priced; no new factor
      base or relation mechanism is proposed.
    - >-
      gamma_meas, once measured, is reported as a distribution over sampled
      targets/instances, not a point value; the trend along the toy ladder
      (does it approach or recede from gamma* as m, d grow toward the target
      cell) is the deliverable, not a single number.

  proof_search_map:
    bottleneck: >-
      Whether ANY line this program has instrumented, at ANY toy cell, has
      ever measured gamma_meas within even an order of magnitude of a
      gamma*(cell) computed for a crypto-scale target. No record in the
      corpus currently computes gamma* at all; this is the missing quantity
      RQ-BINSTD's decision_target asks for ("what quantity would an
      index-calculus line have to achieve to tie [rho]") and no owning
      question (RQ-QSP, RQ-ICPERF, RQ-SATIC, RQ-DREG) computes it, because
      each is scoped to its own mechanism.
    baseline_embedding:
      parameter_slice: >-
        The QSP row (n'=33, m=4) is the exact parameter slice already
        computed by two independent methods (the resultant-model floor and
        "every constant kept" formula) in RQ-QSP-f9bbdb's own motivation
        block; this record's reproduction check is arithmetic on those two
        numbers plus KN-LIT-096's 60.9, not a new computation.
      reproduction_check: >-
        ZERO COMPUTE. 2^(60.9-60.6) = 2^0.3 = 1.231; 2^(60.9-133) = 2^-72.1.
        Both re-derivable by hand from the three cited numbers in one line
        each; a reviewer should redo this arithmetic before trusting anything
        else in the record.
    observation_collision:
      observable: >-
        gamma_meas = measured_operation_count / idealized_floor_operation_count,
        per cell, per line.
      distinct_preimage_search: >-
        Two different lines could report the SAME gamma_meas while one is
        near gamma* and the other is far, because gamma* is cell-specific
        (it depends on that line's own F). The collision that would matter:
        a line whose gamma_meas trends toward 1 as the toy ladder grows
        while its OWN F(cell) simultaneously grows faster than R stays fixed
        -- in which case gamma* itself shrinks toward 0 and "approaching
        gamma_meas -> 1" is not informative about reaching rho. This record's
        minimal_test reports both trends side by side to avoid exactly that
        misreading.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A single derived column (gamma*, gamma_meas, their ratio) added
          beside every DEFINED WITH A COMPUTED COST cell of the reachability
          table, computed from numbers each owning line already reports.
        predicted_gain: >-
          Converts a per-question, bespoke "does this beat rho" argument into
          one comparable scalar across the whole BINSTD table, at zero
          marginal compute beyond what each owning line already measures.
    quantifier_order: >-
      FOR the QSP cell specifically: EXISTS a fully worked, zero-compute
      demonstration that gamma* is unreachable by 50-72 bits under the
      program's own two cost models (shown above; not a forall claim). FOR
      the general instrument: this record claims only that gamma*(cell) is
      WELL DEFINED and COMPUTABLE from numbers each line already reports; it
      makes no claim, universal or existential, about what gamma_meas will be
      at any cell not yet measured (in particular the b84e2d ladder).
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the QSP (n'=33,m=4) cell, gamma* = 2^0.3 and the program's own
        realistic cost model already exceeds it by >= 50 bits, using no new
        compute." It cannot certify anything about a cell whose floor is not
        yet computed by an owning line, and it cannot certify that gamma_meas
        will ever be measured for the chain system (that depends on
        IDEA-20260916-b84e2d executing).
      nearby_object_control: >-
        The QSP row itself, where BOTH the exchange rate AND the certified
        factor-base bound already independently show the cell is void
        (IDEA-20260916-3f7a1c): the instrument must reproduce that closure at
        no worse than the existing closure's own numbers, which the
        reproduction check above confirms. A nearby cell where the instrument
        should NOT show a large gap is any cell already flagged "reachable
        only through a memory pre-flight" rather than closed (the (4,3) chain
        cell of b84e2d) -- the instrument must not prejudge that cell's
        outcome, and this record does not: it states the dependency
        explicitly in next_gate.
    proof_obligations:
      - claim: 2^(60.9 - 60.6) = 2^0.3 ~= 1.231 and 2^(60.9 - 133) = 2^-72.1.
        responsibility: correctness
      - claim: gamma*(cell) is well-defined whenever a line reports a floor F(cell) in the same units (bits of operation count) as KN-LIT-096's 60.9.
        responsibility: interface
      - claim: The instrument adds no new attack claim; it aggregates existing numbers and states a dependency on b84e2d for its first live application.
        responsibility: scope

  predictions:
    - metric: gamma*(cell) at (n'=33, m=4), computed from RQ-QSP-f9bbdb's own floors
      direction: lower
      minimum_effect: >-
        Exactly 2^0.3 = 1.231 from the resultant-model floor; exactly 2^-72.1
        from the "every constant kept" floor. Pure arithmetic; any
        recomputation returning a different value localises a transcription
        error in this record, not a new finding.
    - metric: >-
        gamma_meas of the chain system at (m,d) in {(2,2),(2,3),(3,2),(3,3)},
        once IDEA-20260916-b84e2d executes, using its measured D_S as the
        numerator's floor ingredient
      direction: different
      minimum_effect: >-
        No value predicted here (that record makes its own prediction on
        D_S/M(E), not on gamma_meas); this record commits only to computing
        the derived ratio once D_S is measured and reporting whether it
        trends toward or away from gamma*(4,3) as m grows.

  minimal_test:
    design: >-
      STAGE 0 (this record, zero compute, delivered now): the reproduction
      check above. STAGE 1 (dependent on IDEA-20260916-b84e2d's execution):
      once that record's ladder produces D_S and per-attempt time/memory at
      each cell, compute gamma_meas = measured_operation_count /
      min(M(E)_paper, M(E)_analysis-note) at each cell, compute gamma*(cell)
      using each cell's own floor and R=60.9, and report the ratio
      gamma_meas/gamma* and its trend along the ladder m=2->3->4. STAGE 2:
      extend the SAME instrument to any OTHER line this program measures
      going forward (SAT/CNF-XOR pdp cost of RQ-SATIC-1ae57a,
      Macaulay-degree cost of RQ-DREG-001/RQ-SDEG-001) as those records
      report floors, without re-deriving their mechanisms.
    controls:
      - >-
        The QSP row as the reproduction check: any implementation of this
        instrument must reproduce the >=50-bit gap using only cited numbers,
        with no new compute, before it is trusted on a cell that has not
        already been closed by another route.
      - >-
        Report gamma* alongside its OWN floor F(cell) at every stage, so a
        shrinking gamma* (because F is growing, not because gamma_meas is
        improving) is never misread as progress.
    required_metrics:
      - 'gamma*(cell) per cell, with the citation for F(cell)'
      - 'gamma_meas per cell, once measured elsewhere, with its source record'
      - 'gamma_meas/gamma* trend along any measured ladder'

  falsification_conditions:
    - 'The reproduction check does not reproduce 2^0.3 and 2^-72.1 from the cited numbers: the record is withdrawn pending correction.'
    - >-
      A future line reports gamma_meas within a factor of 4 of its own
      gamma* at ANY cell this program measures: the instrument has found a
      live candidate and Stage 2 of the minimal_test is mandatory before any
      closure statement about that line.

  confounders:
    - >-
      F(cell) itself may be revised by its owning record (as RQ-QSP-f9bbdb's
      own citation flags a possible M(E) exponent discrepancy, 2^21.5 vs
      2^31.0); gamma* moves with any such revision and this record does not
      adjudicate which M(E) is correct.
    - >-
      "Operation count" is not uniformly defined across engines (wall clock,
      field operations, SAT conflicts); Stage 1 must normalise units before
      comparing gamma_meas across lines.

  interpretation_limits:
    - >-
      A DEFINITIONAL/measurement contribution: an instrument and a zero-compute
      worked example, not a new attack, exponent, or curve result. It moves no
      cell of the reachability table from OPEN to DEFINED on its own.
    - >-
      Depends on IDEA-20260916-b84e2d for its only proposed new numeric
      application; until that record runs, this record's live content is the
      QSP reproduction check alone.

  heuristic_assumptions:
    - id: H1
      statement: >-
        A line's real per-attempt solver cost, once measured at toy scale on
        a ladder of cells approaching a target, is a smooth (non-oscillating)
        function of the cell parameters, so that "gamma_meas trending toward
        or away from gamma*" is a meaningful reading rather than noise.
      rigorous_support: >-
        No rigorous bound; this imitates the standard assumption behind any
        extrapolation ladder in this program (e.g. IDEA-20260916-b84e2d's own
        m=2->3->4 growth-law fit), stated here explicitly because this record
        depends on that assumption transitively through b84e2d.
      validation_plan: >-
        SAMPLE - the same cells b84e2d's own ladder samples (n<=41, m in
        {2,3,4}, d in {2,3}), no new sampling by this record. COMPARISON -
        gamma_meas at consecutive m values, checked for monotonicity or a
        clear trend rather than assumed. TAIL - any non-monotone cell is
        reported, not smoothed over. TRANSFER - none to n=131; explicitly a
        toy-ladder-only reading.

  heuristic_note: >-
    The only heuristic content is inherited from IDEA-20260916-b84e2d, which
    this record depends on for its live numeric application; the reproduction
    check on the QSP row uses no heuristic at all (it is arithmetic on
    already-derived, non-heuristic floors).

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. This is a measurement/decision
      instrument, not an algorithm.
    memory_exponent: Not applicable; the instrument itself costs no compute beyond arithmetic on existing numbers.
    best_known: >-
      Rho at 2^60.9 (KN-LIT-096) for ECC2K-130; every line this instrument
      has been applied to so far (the QSP row) is shown void by a margin of
      50-72 bits using the program's own numbers.
    hidden_overhead: >-
      None in the instrument itself. The hidden dependency is that its only
      live future application requires IDEA-20260916-b84e2d to execute; until
      then this record's content is the zero-compute worked example alone.
    tradeoff_note: Not applicable.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      The instrument is arithmetic; Stage 0 is delivered in this record.
      Stage 1's cost is entirely charged to IDEA-20260916-b84e2d's own
      estimated_cost (high/medium there), not duplicated here.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 (index-calculus reachability, RQ-BINSTD-b6f698)
    prior_best: Pollard rho with Frobenius and negation speedups, 2^60.9 iterations (KN-LIT-096)
    time_exponent: not_applicable (measurement instrument, no attack claimed)
    memory_exponent: not_applicable
    hidden_cofactor: none; the instrument reports floors and measured costs as given by their owning lines
    claim_kind: measurement_instrument

  dominated_by: >-
    n/a (no attack claimed). As an instrument: no prior record in this
    program's corpus computes a rho-tying exchange rate for a decomposition
    line's cost floor; RQ-QSP-f9bbdb and IDEA-20260916-3f7a1c already show
    the QSP row's floor is unreachable by direct arithmetic (a stronger,
    already-filed closure on that ONE cell), so on that cell this record adds
    only the reframing, not a new number; it is not dominated on the general
    instrument, which no other record proposes.

  sota_delta:
    time: n/a; no attack, no exponent
    memory: n/a
    data_queries: >-
      Adds one derived column (gamma*) to the reachability table's decision
      criteria; against the corpus's prior state, this is the first record to
      state RQ-BINSTD's own decision_target quantity as a named, computable
      scalar rather than leaving "what would it take to tie rho" implicit in
      each line's own cost table.

  frontier_check:
    status: pending
    note: >-
      No web search was run this session; whether an "exchange rate" or
      "overhead ratio" instrument of this exact form is named in the
      cryptanalytic cost-accounting literature was not checked. A Coordinator
      literature pass is recommended before this record is cited as a
      methodological novelty.

  recommended_priority: medium
  priority_rationale: >-
    Constant-factor / accounting contribution under docs/target-result-profile.md,
    not exponent-moving on its own -- its value is as a REQUIRED BUILDING
    BLOCK for RQ-BINSTD's own decision_target, which explicitly asks for
    exactly this kind of scalar per cell. Priority is medium rather than low
    because the zero-compute worked example is delivered in this record and
    immediately usable, and because it costs nothing further until
    IDEA-20260916-b84e2d executes.

  first_deliverable: >-
    The gamma* formula, the QSP-row reproduction check (delivered in this
    record), and a one-page instrument spec for computing gamma_meas from any
    future line's measured operation count and floor.

  next_gate: >-
    Coordinator decision on whether to attach this instrument's Stage 1 as a
    reporting requirement of IDEA-20260916-b84e2d's own EXP-QSP-* contract
    when/if that record is designed into an experiment, versus holding this
    record until that contract reports independently.

  discriminated_from: >-
    IDEA-20260916-b84e2d measures D_S/M(E) (a pure sizing ratio) for the
    chain system alone; this record measures a DIFFERENT ratio
    (measured-cost / rho-tying-threshold) intended to generalise across every
    line in RQ-BINSTD's reachability table, not just the QSP chain, and adds
    the zero-compute demonstration that the QSP row's gap is already 50-72
    bits under the corpus's own numbers -- a statement b84e2d does not make.
    RQ-QSP-f9bbdb's own decision_target already closes the QSP cell by a
    stronger, more specific route (the certified factor-base bound); this
    record does not re-close that cell, it reframes the closure as an
    instance of a reusable instrument for the rest of the table.

  source_refs:
    - RQ-BINSTD-b6f698
    - RQ-QSP-f9bbdb
    - IDEA-20260916-3f7a1c
    - IDEA-20260916-5c9d6e
    - IDEA-20260916-b84e2d
    - KN-LIT-096
    - KN-LIT-661e97
    - docs/inventor-protocol.md
    - docs/object-frame-ideation.md

  id_allocation_provenance: >-
    ID pre-minted and assigned by the dispatching session for this lane
