  minimal_test:
    design: |-
      Freeze 6 to 10 fixtures (3 positives, 3 nulls, 1 nearby-object each) with expected labels written before the first run. Run the enumerator inside a declared boundary (families, genus <= 3, degree bounds, time cap), re-check each certificate with code independent of the enumerator, and add a transported-data control and a coordinate-isomorphism control per candidate. Route any logarithm-solving trial through the existing run entry point; the tool itself solves none.
