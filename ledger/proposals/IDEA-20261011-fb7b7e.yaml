  title: Automated transfer audit - subgroup-preserving map discovery and complete cost tables for Weil-descent, isogeny, cover and pairing candidates on toy and supplied curves
  class: tooling
  claim: |-
    For a supplied toy curve (binary composite or prime degree, or prime field) and a declared candidate family (GHS Weil descent, isogeny moves, genus-2/3 covers, pairing embedding), a tool that enumerates maps inside a stated exploration boundary emits, per candidate, an explicit map, a subgroup-preservation certificate (injective on the order-r subgroup, checked on random points), a complete cost table against matched rho (construction, conversion, failed attempts, verification, recovery, memory, preprocessing) and a verdict label from the AGENTS.md vocabulary. On a frozen fixture set it labels every positive control weak by the stated family and no null weak, with no required cost column empty; a bounded miss is reported as not found within this family and boundary.
  mechanism: |-
    Not a new-arithmetic proposal. OBJECT FRAME. A transfer is an injective homomorphism on the r-subgroup, so it loses nothing: a change of coordinates (IDEA-20260806-c5d183, KN-FIND-ffe1df Theorem C) whose only possible benefit is a cheaper problem in the destination, a coordinate-dependent effect priced by the cost table. R3 (Jacobian, cover and descent representations); Sigma = the correspondence. F3 and F4 are components. Each candidate carries a typed obligation table (unknown, supported, refuted, not_applicable) per the transfer skill; the weakest unresolved obligation propagates along composed paths. Stage: any, by candidate.
