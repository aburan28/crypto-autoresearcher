idea:
  id: IDEA-20260921-b03306
  id_allocation_provenance: >-
    Minted by the top-level coordinator session with `python3
    tools/allocate_id.py --next idea --date 20260921` and confirmed free
    with `--check` on 2026-09-21. Authored under the idea-generator role
    contract in the coordinator session (role-runtime outage; runtime
    substitution recorded per the interchangeable-runtimes clause, see
    DEC-20260921-4d1b40).
  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    THE CENSUS MEASURED SETS; THE LANE KEYS ON PARTITIONS: every
    construction in the branching-window lane (a5757d's merge,
    f68c7f's A(v), ffe1df's M-level filter battery) keys on a
    MULTI-LEVEL partition g: F_p -> {0..M-1}, not a single set -- and
    the (lambda, PGL_2-stability) profile of a partition is NOT
    determined by its level sets' profiles (the levels interact through
    the cross-terms in the partition's Fourier algebra, and a partition
    can be stable while its levels are not, or structured while its
    levels are flat), so the synthetic-statistic table has a missing
    row class: measure (lambda, stability) for the natural M-level
    partitions -- the popcount partition of ffe1df's own battery at
    M = 4..256, digit-position partitions, residue-class partitions --
    whose joint profile either finds the stable-structured partition
    the lane's constructions actually need, or extends the census
    negative to the object class the lane consumes, closing the gap
    between what was measured (sets) and what is used (partitions).
  class: measurement
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): class R1 of
    RQ-ECDLP-623a32 (the coordinate post-processed by an M-level
    partition function), attack stage COLLISION STRUCTURE. CLAIM: for a
    partition g with levels A_0..A_{M-1}, the pair (partition lambda,
    PGL_2-stability) -- defined on the partition's natural scalar
    summary ||g-hat||_{1,*} = max over t != 0 of sum over k != 0 of
    |g-hat_t(k)| (the t != 0 level-characters, the ffe1df battery's own
    observable) -- is measurable by one census-harness extension, and
    the level-set readings do NOT determine it: the partition profile
    is the missing row class of the synthetic-statistic table, and
    measuring it either finds a stable-structured partition (the
    direct input a5757d-style constructions key on) or extends the
    census's scoped negative from sets to partitions at the measured
    scope.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the partition's
    level-character family under the branching operation -- BRANCHING
    class (IDEA-20260806-c5d183), R1 representation, canonical
    probability normalisation (DEC-20260921-8e8086). WHY LEVELS DO NOT
    DETERMINE THE PARTITION: the constructions use the characters
    g_t = sum_c omega^t{c} 1_{A_c} (the level-combination, not the bare
    indicators): g-hat_t(k) = sum_c omega^{tc} 1-hat_{A_c}(k) -- a
    linear combination whose cancellations are invisible in any single
    level's reading. The popcount partition at M = 16 is ffe1df's own
    battery object (its L1 ~ p^{0.39} reading lives HERE, in the
    t-combined norm); the census measured only the MODE level of the
    same partition (0.4191, marginal) -- the t != 0 characters were
    never measured, and they are what the lane's bias machinery
    actually consumes (f68c7f's A(v) is a max over t of exactly these
    quantities). The stability question is likewise partition-level:
    the Moebius battery on g_t, not on the levels separately.
  novelty_status: unverified
  citations:
    - ref: knowledge/findings/KN-FIND-ffe1df.md
      provenance: internal
      claim: >-
        The M-level filter battery with g_t characters, the popcount
        partition at p = 65539 with M = 16 reading L1 = 7.56 log p in
        one framing and the family growth ~ p^{0.39} in the coverage
        table; the t != 0 characters are the battery's objects.
      verified_by: "coordinator session, read of the record's coverage table and measurement sections on 2026-09-21"
    - ref: EV-ECDLP-81f4d4
      provenance: internal
      claim: >-
        The census measured SET rows only (mode-level indicator among
        them, 0.4191 marginal); partitions' t-combined norms were not
        measured.
      verified_by: "coordinator session, authored and reviewed the record on 2026-09-21"
    - ref: ledger/proposals/IDEA-20260904-f68c7f.yaml
      provenance: internal
      claim: >-
        A(v) is a max over nonzero t of level-character sums -- the
        partition's t != 0 characters are the consumed observable.
      verified_by: "coordinator session, read of the (E)/(D) sections on 2026-09-21"
    - ref: RUN-ECDLP-ccf8f0
      provenance: internal
      claim: >-
        The extension-run pattern executes a focused decision in
        the census harness at minutes-to-an-hour cost.
      verified_by: "coordinator session, executed the run on 2026-09-21"
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: serves the lane's keyed-merge
      constructions (F1/F2-adjacent); what is added is the missing
      row class of the measured table, not a new construction.
  proof_search_map:
    not_applicable_reason: >-
      Measurement, not a theorem; the census's own audits (reproduction
      anchors, battery, checker) transfer verbatim. One derivation-level
      check is included as a control: the t-combination identity
      g-hat_t(k) = sum_c omega^{tc} 1-hat_{A_c}(k) verified numerically
      at one prime.
  predictions:
    - metric: >-
        partition lambda (t != 0 combined norm) for the popcount
        partition at M in {4, 16, 64}
      direction: different
      minimum_effect: >-
        The ffe1df-attributed growth ~ p^{0.39} should reproduce in the
        t-combined norm if that is the right construction of the 0.39
        reading; a materially different exponent means the 0.39 lives
        in yet another framing and the reproduction question reopens
        with three candidates on record.
    - metric: >-
        PGL_2 stability of g_t (Moebius battery on the partition)
      direction: different
      minimum_effect: >-
        EITHER the partition is stable while its mode level was not
        (the cross-term cancellations absorb the embedding dependence
        -- the first stable structured natural object, the direct
        candidate input) OR unstable, extending the set finding to
        partitions.
    - metric: residue-class and digit-position partitions
      direction: lower
      minimum_effect: >-
        Expected flat-or-unstable per the census's priors; recorded as
        the control rows of the partition table.
  minimal_test:
    design: >-
      Census-harness extension: at least 8 primes 2^12..2^22, partitions
      {popcount at M = 4, 16, 64; x mod M residue at M = 4, 16; binary
      digit-position partition at 2 levels per position}, the t != 0
      combined norm per partition per prime, the frozen-hash Moebius
      battery on g_t, C01/C02 controls, the t-combination identity
      check at one prime, the census checker battery.
    controls:
      - the t-combination identity at one prime to 1e-9
      - C01 exact zero, C02 Parseval band
      - the M = 2 partition (a single set -- the census's own rows) as
        the bridge row that must reproduce the census's readings
    required_metrics:
      - fitted partition lambda with SE per partition
      - Moebius deviation beyond 2SE on g_t
      - the reproduction statement for the 0.39-attributed reading
  falsification_conditions:
    - >-
      All partitions read flat or unstable: the census negative extends
      from sets to partitions at the measured scope, and the
      synthetic-statistic lane's remaining design space narrows to the
      escape hatch of IDEA-20260921-4af08b (non-set statistics) and the
      cross-ratio family.
    - >-
      Any partition reads stable AND above the flat level: the first
      direct construction input is found; replicate before any use, and
      the owed review covers it with the census.
    - >-
      The M = 2 bridge row fails to reproduce the census: the harness
      extension is defective; void, infrastructure, never evidence.
  confounders:
    - >-
      the 0.39 reading's construction ambiguity is the point of the
      measurement, not a defect to hide: all framings measured are
      reported side by side
    - >-
      M-level norms at small M approach single-set readings; keep
      M >= 4 for the partition-specific rows and rely on the M = 2
      bridge for continuity
    - >-
      omega^{tc} roots of unity in F_p vs complex: the combined norm is
      computed in the complex characters of the level index t, not in
      F_p -- frozen and recorded
  interpretation_limits:
    - >-
      Toy/medium ladder; gates necessary-not-sufficient; positive
      readings are candidates pending replication and the owed review.
    - >-
      KN-OPEN-020 CLASS, DECLARED: not a factor-base proposal;
      collision-structure keying only.
  heuristic_assumptions:
    - id: H1
      statement: LADDER EXTRAPOLATION (census HEUR-1 verbatim).
      rigorous_support: the census's validated two-ladder/jackknife guards.
      validation_plan: the harness's existing checks, verbatim.
  target_complexity:
    time_exponent: >-
      O~(p) per cell per partition, census harness; one
      run covers the table. No attack exponent claimed.
    memory_exponent: O(p) words per prime, within cap.
    best_known: the flat level 0.5 as the comparison.
    hidden_overhead: >-
      M factor in cells (one transform per partition, levels combined
      algebraically -- the indicators' transforms are computed once per
      prime and combined, so the cost is per-prime, not per-level).
    tradeoff_note: flat parallelism.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
