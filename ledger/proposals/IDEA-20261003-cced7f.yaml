# IDEA-20261003-cced7f
# Map-degree count for multiplication by 3. Proposal only. Not approved.
idea:
  id: IDEA-20261003-cced7f
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 3 has degree 9 and multiplication by 2 has degree 4
  class: measurement
  claim: >-
    Multiplication by 3 has degree 9. Multiplication by 2 has degree
    4. Nine exceeds four by 5. The product of the two degrees is 36.
    Their sum is 13. Three squared is 9 and two squared is 4. The
    gap is a map degree, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R3 is the endomorphism. The operation set is
    composition of that map with itself. The degree of multiplication
    by an integer is the square of that integer. Two copies of
    degree 4 have gap 0. No point is multiplied.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from these two map degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two degrees are frozen before the subtraction.
    - No point is multiplied.
  proof_search_map:
    bottleneck: The degree gap 5.
    baseline_embedding:
      parameter_slice: The degrees 9 and 4.
      reproduction_check: >-
        Two readers must agree that 3 squared is 9, that 2 squared
        is 4, and that 9 exceeds 4 by 5.
    observation_collision:
      observable: The degree gap and the two squares.
      distinct_preimage_search: >-
        Reporting both degrees as 4 drops the gap. Two copies of
        degree 4 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 9 and 4.
        predicted_gain: Integer gap. No multiplication of a point.
    quantifier_order: >-
      The squares are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degree gap 5. Not a scalar multiplication.
      nearby_object_control: >-
        Two copies of degree 4. The gap is 0.
    proof_obligations:
      - claim: Three squared is 9.
        responsibility: correctness
      - claim: Two squared is 4.
        responsibility: correctness
      - claim: Nine exceeds four by 5.
        responsibility: size
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: Nine exceeds four by 5.
  minimal_test:
    design: >-
      Square 3, square 2, and subtract 4 from 9. Do not multiply a
      curve point.
    controls:
      - Two copies of degree 4, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - Three squared is not 9.
    - The gap is not 5.
  confounders:
    - The minimal-polynomial degree of multiplication by an integer is 1, which is a different degree from the map degree.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not a dual-degree comparison.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen degree of multiplication by 3 is the square of 3,
        and the frozen degree of multiplication by 2 is the square of 2.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is the
        squares of 3 and 2.
      validation_plan: >-
        Two independent squares. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Separable and inseparable parts of the map are not split here.
    tradeoff_note: A larger degree is not a shorter walk.
