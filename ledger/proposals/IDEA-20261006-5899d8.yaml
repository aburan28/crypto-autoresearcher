idea:
  id: IDEA-20261006-5899d8
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Chord-slope Legendre imbalance of P and [2]P on one curve over
    F_1093, with a forced-balance control over F_1031
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. R1 is the affine coordinate pair. The
    attack stage is a coordinate predicate, not a collision search.
    The discrete-log exponent versus Pollard rho stays 1/2. Let
    E1093 be y^2 = x^3 + 2x + 3 over F_1093, and let E1031 be
    y^2 = x^3 + x + 1 over F_1031. Both discriminants were recomputed
    in this session as 275 and 31, neither 0. 1093 and 1031 are
    prime, and 1093 = 1 mod 4 while 1031 = 3 mod 4. For an affine
    point P with y not 0, let Q = [2]P. When x(Q) is not x(P), the
    chord slope is (y(Q) - y(P)) / (x(Q) - x(P)). Let Z+ be the
    number of such P whose slope is a nonzero square, and Z- the
    number whose slope is a nonzero nonsquare. The claim is that on
    E1093 the absolute difference |Z+ - Z-| is at least 1. The
    concrete negative is that the instrument checks pass and that
    difference is 0. On E1031 the same difference is a control that
    the pairing P with -P forces to 0, because -1 is a nonsquare, so
    the slope flips character. A nonzero control difference voids
    the instrument and is not a reading of E1093. This is not the
    y-axis prefix count of scalars 2, 5, and 11, not a cross product
    of two hit counts, and not a discrete logarithm.
  mechanism: >-
    OBJECT FRAME. The representation is affine (x, y). The operation
    set is doubling together with negation. The predicate is the
    quadratic character of the chord slope through P and [2]P. The
    tangent slope was not used. When -1 is a nonsquare the tangent
    slope also flips under negation, and that flip forces exact
    balance, so a tangent-slope claim on F_1031 cannot succeed. The
    chord slope flips sign under negation as well. On F_1093, where
    -1 is a square, the flipped slope stays in the same character
    bin, so a pair {P, -P} contributes two to one bin and the
    difference can be nonzero. On F_1031 the same flip changes the
    bin, so the difference is 0 whenever the instrument is counting
    points. LOSSY-PROJECTION TEST. The projection keeps one character
    and discards the slope and the discrete log. Many points share a
    bin. The projection is lossy. It is not a block system of the
    translation group.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question asks whether a coordinate predicate on ordinary
        prime-field curves carries discrete-log information, with a
        known-true control and a null of the same shape.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. This chord-slope count does not move that
        exponent.
      verified_by: >-
        design session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Negation classes change the iteration count of rho by a factor
        near sqrt(2). This record uses negation only as a pairing
        control on the slope character, not as a walk.
      verified_by: >-
        design session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
    - ref: Silverman, The Arithmetic of Elliptic Curves, chord-and-tangent law
      provenance: recalled
      claim: >-
        The chord through two affine points with distinct x-coordinates
        has slope (y2 - y1) / (x2 - x1). The book was not opened in
        this session.
      verified_by: null
  assumptions:
    - 1093 and 1031 are prime. Both were checked with sympy.isprime in this session.
    - 1093 = 1 mod 4 and 1031 = 3 mod 4, so -1 is a square modulo 1093 and a nonsquare modulo 1031.
    - The discriminant 4 A^3 + 27 B^2 is 275 on E1093 and 31 on E1031, neither 0 in the field. Both were reduced in this session.
    - In odd characteristic, [2]P is infinity exactly when y(P) = 0. Those points are excluded because the chord through P and infinity is vertical.
  proof_search_map:
    not_applicable_reason: >-
      This is one integer comparison of a slope character on one
      named curve, plus a pairing control on a second prime. It is
      not a proof that the character recovers a discrete logarithm.
    bottleneck: >-
      The quantity that would have to be nonzero for the predicate
      to be unbalanced on E1093 is |Z+ - Z-|. The F_1031 arm is the
      instrument check, not a second claim.
    baseline_embedding:
      parameter_slice: p = 1093 and p = 1031, doubling, chord slope, Legendre symbol
      reproduction_check: >-
        Each slope is recomputed after swapping the two points. The
        sign must flip and the character on F_1093 must stay the same.
        A disagreement voids the cell.
    observation_collision:
      observable: the ordered pair (Z+, Z-) on E1093
      distinct_preimage_search: >-
        If Z+ equals Z-, the same integer gap 0 arises from a balanced
        character and from an empty eligible set. The empty set is
        recorded separately and is not called balance.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the two Legendre bins of the chord slope
        predicted_gain: >-
          On E1093 the bin counts differ by at least 1, or the record
          reports that they do not.
    quantifier_order: >-
      Exists this one curve over F_1093 such that the absolute bin
      difference is at least 1, given that the F_1031 control
      difference is 0. Not for all primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two bin counts on E1093, and the control difference on
        E1031. No discrete logarithm is certifiable from them.
      nearby_object_control: >-
        E1031, where the pairing forces the difference to 0. A nonzero
        value there means the Legendre implementation is wrong.
    proof_obligations:
      - claim: Z+ and Z- count only non-vertical chords with nonzero slope.
        responsibility: correctness
  predictions:
    - metric: absolute difference of the two Legendre bins on E1093
      direction: different
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Enumerate both curves. Reject the cell if either discriminant
      is 0. For every affine P with y not 0 and x([2]P) not equal to
      x(P) and slope not 0, increment Z+ or Z- according to the
      Legendre symbol of the slope. Emit both differences. Interpret
      E1093 only when the E1031 difference is 0.
    controls:
      - >-
        Forced-balance control: on E1031 the difference must be 0.
        A nonzero value is an invalid instrument.
      - >-
        Sign control: swapping the two points on the chord negates
        the slope. On E1093 the character must be unchanged. One
        failure voids the cell.
      - >-
        Vertical tally: points with x([2]P) = x(P), and points with
        slope 0, are counted in a separate tally and are not put in
        Z+ or Z-.
      - >-
        Empty tally: if no point on E1093 enters either bin, the cell
        is unmeasured. It is not balance and not the negative.
    required_metrics:
      - Z+ and Z- on E1093
      - Z+ and Z- on E1031
      - absolute difference on each curve
      - the vertical-or-zero tally on each curve
  falsification_conditions:
    - On E1093 the instrument checks pass, the E1031 difference is 0, at least one point entered a bin, and Z+ equals Z-. That equality is the negative.
    - The E1031 difference is not 0. The instrument is void. E1093 is not interpreted.
    - Either model is singular, or E1093 contributes no eligible point. The cell is unmeasured.
  confounders:
    - >-
      Counting x-coordinates instead of points would change the pair
      contribution from 2 to 1 and is a different statistic. The count
      is of points.
    - >-
      A tangent slope, as opposed to the chord through P and [2]P,
      is a different predicate and is not this claim.
    - >-
      IDEA-20260805-bb4bf8 uses p = 1031 for a supersingular mass.
      That mass is not this slope count. The prime is shared. The
      object is not.
  interpretation_limits:
    - A nonzero gap on E1093 is one predicate on one curve. It is not a sub-rho algorithm.
    - KR-RHO-13bf67 still bounds generic algorithms by Omega(sqrt(N)). The exponent delta is 0.
    - This record does not restate the y-axis prefix census, the m = 3 rescaled quotient, an FGLM degree, or the product of two x-coordinates equal to a curve constant.
    - The E1031 arm is an instrument check. It is not a second success criterion.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On E1093 the chord slope, as P runs through eligible points,
        has quadratic character with mean within 1/N of 0, as a
        uniform nonzero field element would. The claim tested here is
        only the weaker statement that the two bins are not exactly
        equal.
      rigorous_support: >-
        The sign flip of the slope under negation is an identity of
        the chord formula. The Legendre symbol of -1 is the classical
        one, +1 when p = 1 mod 4 and -1 when p = 3 mod 4. The random
        mean is the distribution being imitated, not a theorem about
        this cubic.
      validation_plan: >-
        Compute the exact bin counts on E1093 and the control
        difference on E1031. Do not move to a third prime in this
        test. A difference of 0 on E1093, with the control at 0 and
        a nonempty eligible set, falsifies the imbalance on this
        curve. A nonzero control falsifies the instrument instead.
  target_complexity:
    time_exponent: >-
      The measurement enumerates E(F_p) in Theta(p) field operations.
      The discrete-log exponent stays 1/2. Delta versus Pollard rho
      is 0.
    memory_exponent: O(1) beyond the current point.
    best_known: Pollard rho at Theta(N^{1/2}) group operations, KR-RHO-13bf67.
    hidden_overhead: >-
      No o(1) term is claimed. There is no discrete-log algorithm in
      this record.
    tradeoff_note: >-
      No time-memory tradeoff. van Oorschot-Wiener does not apply to
      a one-pass census.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this census is dominated by Pollard rho.
    KR-RHO-13bf67, KR-RHO-fb88e6, KR-RHO-cd86f5, KR-RHO-6239aa, and
    KR-RHO-6654ba were opened. Rho meets Omega(sqrt(N)) up to a
    constant. The negation map and r-adding walks change constants.
    Distinguished points change storage of a collision search. Point
    halving is a binary-curve step. None of those rows states this
    chord-slope bin count, so they do not dominate the integer
    comparison. They do dominate any reading of the bins as an attack.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. Rho
    remains Theta(N^{1/2}) group operations. This census is Theta(p)
    field operations and returns one integer gap, not a logarithm.
  prior_art:
