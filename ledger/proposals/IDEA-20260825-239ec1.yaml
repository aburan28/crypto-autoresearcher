  batch: EC-STRUCTURE-20260825
  cluster: 'C7-targets: what structure the real curves actually carry'
  title: 'APPROXIMATE MULTIPLICATIVE SYMMETRY FROM THE PRIME''S SHAPE: on a Solinas prime the doubling
    map x -> 2x mod p preserves low binary weight except on a thin carry set, so a low-weight factor base
    is APPROXIMATELY invariant under an order-n cyclic action -- measure the symmetry defect and the displacement
    rank it induces in the relation matrix'
  class: mechanism
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: 'Displacement rank and structured solvers are established and already a lane here; Solinas
    reduction is published. The proposed contribution is the source of the symmetry: the PRIME''s shape
    rather than a designed relation support, which is a resource the program has not tried to use and
    which comes for free on every deployed curve.'
  claim:
    semantic_part: For p = 2^n - c with c short, doubling acts on binary representations as a shift plus
      a short correction, so the low-weight set is invariant under doubling except on the carry set; if
      the invariance were exact the relation matrix would be circulant with displacement rank O(1) and
      the linear-algebra stage would cost O~(B).
    evaluator_part: 'Unestablished: whether displacement rank degrades gracefully or catastrophically
      in the symmetry defect. That is the whole question and it is a finite-p measurement, not an asymptotic
      one.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Define the symmetry defect delta as the fraction of the factor base whose image under doubling leaves
    the base, and measure it exactly for several Solinas primes and weight budgets.
  - Build the relation matrix for the low-weight base and measure its displacement rank with respect to
    the doubling shift operator.
  - Plot displacement rank against delta to determine the degradation law; a linear law would leave a
    usable regime, an exponential one would not.
  - Charge the structured solve honestly, including the cost of the correction terms, and compare against
    generic sparse linear algebra on the same matrix.
  - 'Read the result against the sum-product dichotomy: this construction is precisely an attempt to have
    additive structure and an approximate multiplicative symmetry at once, which that record predicts
    is obstructed -- so a graceful degradation here would be evidence against the dichotomy''s strong
    form.'
  lossy_projection_test:
    tracked_object: the orbit of a factor-base element under the doubling action
    what_is_discarded: the element, keeping only its orbit and position
    propagation: 'approximate: propagation fails exactly on the carry set, and the failure rate is delta'
    verdict: PASSES with an explicitly approximate propagation, which the taxonomy records as a distinct
      mode; delta is the quantitative content.
  predictions:
  - id: P1
    status: established_formula
    statement: For p = 2^n - c, doubling is a shift plus a correction of weight bounded by the weight
      of c.
  - id: P2
    status: unestablished
    statement: Displacement rank grows sublinearly in delta over the accessible range.
  - id: P3
    status: unestablished
    statement: The structured solve beats generic sparse linear algebra on the same matrix once corrections
      are charged.
  minimal_discriminating_test:
    status: specified_not_run
    test: Toy Solinas primes at several sizes and weight budgets; measure delta, displacement rank and
      both solve costs; fit the degradation law.
    pass: P2 and P3 both hold in some accessible regime.
    fail: Displacement rank saturating at full rank for any delta above zero closes the approximate-symmetry
      route, which is the expected outcome and is recorded as such.
  controls:
  - 'Random prime of matched size, where no doubling symmetry exists: the null.'
  - An exactly invariant synthetic base (delta = 0) as the positive control that the structured solver
    realizes its advantage when the symmetry is exact.
  - Generic sparse solve on the same matrix as the cost baseline.
  confounders:
  - Displacement rank is defined relative to a chosen operator pair; the choice must be fixed in advance
    or the number is tunable.
  - The correction terms can cost more than the structure saves; they must be charged, and this is the
    most likely place a false positive would come from.
  - Yield and linear algebra are being varied together; the arms must isolate them.
  falsification:
    semantic: Full displacement rank at every nonzero delta closes the route.
    evaluator: A charging error scopes out that cell.
    not_falsification: A timeout on the largest matrix.
  why_this_is_not_a_variant: 'KN-OPEN-006 asks whether DESIGNED arithmetic-progression relation supports
    give a low-displacement-rank matrix. This record''s symmetry is not designed: it is inherited from
    the prime, so it costs nothing in relation probability, which is exactly the penalty that open problem
    names as the catch.'
