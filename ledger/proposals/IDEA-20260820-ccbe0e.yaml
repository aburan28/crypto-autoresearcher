    memory_exponent: 0
    data_queries: 0
    statement: no query lower bound for production SQIsign is presently claimed
  recommended_priority: high because a valid bound can cheaply falsify broad shrinkage claims
  recommended_cost: medium for proof audit; low for exact finite-channel controls
  prior: 0.35 probability of a correct synthetic-channel theorem and 0.08 for a useful production-relevant premise
