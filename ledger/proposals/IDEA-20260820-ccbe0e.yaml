idea:
  id: IDEA-20260820-ccbe0e
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Sequential privacy-loss martingale lower bound for certified ideal-list shrinkers
  class: information-theoretic lower-bound proposal
  claim: >-
    Under a stated uniform bound on candidate-pair sequential privacy loss, any
    adaptive algorithm that returns an ideal list of size at most L with
    coverage at least 1-delta should require a quantitatively lower-bounded
    number of public transcripts. The intended result is conditional and may
    instead expose that the required privacy-loss premise is false.
  mechanism: >-
    Fix N candidate ideals and transcript laws P_I. For each pair I,J define the
    predictable privacy-loss process sum_t log(dP_I/dP_J)(T_t | history).
    Prove a supermartingale concentration bound under either bounded increments
    or a declared conditional moment-generating-function inequality. Combine
    optional stopping with a list-Fano or change-of-measure step: coverage
    1-delta and output size L force accumulated information on the order of
    log(N/L), while q queries supply at most q times the verified per-query
    information budget. Every adaptive query, stopping decision, preprocessing
    bit, and verification step is included in the end-to-end statement.
  novelty_status: unverified
  status: proposed
  source_refs:
