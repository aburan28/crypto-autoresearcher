  predictions:
    - id: P1
      statement: >-
        For a synthetic sequential channel with N = 1024, target L = 32,
        delta = 0.05, and verified per-query KL budget epsilon, the empirical
        query threshold for 0.95 list coverage is no smaller than 0.8 times the
        derived lower bound across epsilon in {0.01, 0.02, 0.04}.
      metric: empirical threshold divided by proved query lower bound
      threshold: '>= 0.8'
      test_boundary: preregistered finite synthetic channels
    - id: P2
      statement: >-
        Under a genuine-simulator candidate-exchangeable null with zero privacy
        loss, no finite-q algorithm passes both L < N and coverage 0.95 except at
        the preregistered 0.05 error allowance.
      metric: false certified-shrinkage rate
      threshold: '<= 0.05 after multiplicity correction'
      test_boundary: matched true-simulator law
    - id: P3
      statement: >-
        In a planted positive with epsilon doubled, the median transcript count
        required for the same N, L, and coverage decreases by a factor between
        0.4 and 0.6, matching the predicted inverse-information scaling.
      metric: median q at 2 epsilon divided by median q at epsilon
      threshold: between 0.4 and 0.6
      test_boundary: planted calibrated privacy-loss family
  controls:
    - genuine-simulator null with candidate-identical transcript laws
    - planted positive with exact likelihood ratios and epsilon varied continuously
    - nonadaptive fixed-q list decoder reproducing a standard finite baseline
    - adaptive stopping rule that is valid only when optional-stopping terms are charged
    - known-false nearby object leaking the candidate in one public symbol, which must violate the privacy premise
    - public-curve witness check on every algorithm output counted as a certified list
  falsification_conditions:
    - a finite synthetic channel satisfying all premises beats the proved lower bound
    - optional stopping or adaptive query selection introduces an uncharged term
    - the lower-bound proof still applies to the one-symbol revealing nearby object
    - simulator-null certified shrinkage exceeds the 0.05 error allowance
  confounders:
    - using average pairwise divergence where the theorem needs a uniform bound
    - leaking candidate information through preprocessing or list verification
    - estimating likelihood ratios on evaluation transcripts
    - treating candidate priors as uniform without declaring the prior
  interpretation_limits:
    - no production SQIsign privacy-loss bound is established
    - a conditional lower bound does not establish security or simulator equivalence
    - the theorem concerns certified finite lists, not SSI hard-problem complexity
    - KN-TECH-058 supplies no verified GRH support for this proposal
  heuristic_assumptions:
    - all candidate-conditioned transcript laws share the declared support
    - the conditional privacy-loss moment bound holds under adaptive histories
    - list coverage and candidate prior are fixed before data collection
  target_complexity:
    baseline: q >= approximately log(N/L) divided by a verified per-query information budget
    proposed: optional-stopping-safe version with explicit delta and martingale remainder
    success_probability: lower bound applies to algorithms claiming coverage at least 1-delta
  cost_model:
    time: proof derivation plus end-to-end simulation of candidate laws and shrinkers
    memory: likelihood-ratio state, candidate posterior or list, and martingale diagnostics
    data: adaptive public-transcript queries q, all charged in the lower bound
    preprocessing: candidate family, prior, likelihood calibration, and any advice bits
    oracle_access: public transcript oracle only; no timing, retry-count, or signer-state access
    verification: premise audit, exact likelihood-ratio baseline, coverage, and curve witnesses
  proof_search_map:
    baseline_reproduction: rederive a fixed-q finite list-Fano or change-of-measure inequality exactly
    observation_collision_search: build distinct candidates with identical transcript laws and require infinite or vacuous q bound
    quantifier_order: fix candidate family, prior, delta, L, privacy budget, and algorithm class before transcripts
    method_ceiling: quantify looseness on a channel attaining the bound and on one where pairwise KL is insufficient
    nearby_object_control: force the proof against a one-symbol revealing channel where its conclusion is known false
  nearest_neighbors:
    - IDEA-20260815-824c71: posterior entropy accounting without an anytime query lower bound
    - IDEA-20260820-0725ed: conditional list upper certificate rather than universal lower bound
    - IDEA-20260820-9dc01a: constructive e-process shrinker whose query use this bound can audit
  dominated_by: n/a (no result claimed)
  sota_delta:
