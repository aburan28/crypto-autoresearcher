idea:
  id: IDEA-20260816-82de84
  question_id: RQ-ALR-001
  added: '2026-08-16'
  title: Read the ALR chart-wise target-divisor elimination as a contraction tree over F_p and measure
    the exact rank of each bond tensor against a uniformly random tensor of identical shape, so that
    compactness of the resultant tree becomes a measured rank rather than an inherited expectation
  class: composition
  claim: '(A) KN-OPEN-007 poses bond-rank low-rankness for the recursive Semaev resultant tree, and
    IDEA-20260807-049ed4 reports that the program''s own evidence measured those Semaev bond ranks
    far below full with a closed-form law. The ALR lane builds a different elimination: chart-wise
    reduction of K_P = A_P + v*B_P modulo the target polynomial W, composed over source points and
    over at most two x-injective charts. Nobody has read that composition as a contraction tree or
    measured a single one of its bonds. (B) The measurable is, for each bond of the ALR contraction
    tree, the exact rank over F_p of the intermediate tensor, computed by rank-revealing elimination
    rather than by any norm-based truncation, since over F_p no direction is negligible and KN-OPEN-007
    records that caveat explicitly. (C) The claim under test is a comparison, not an absolute: the
    ALR bond ranks are measured against uniformly random tensors of identical shape over the identical
    field, drawn and eliminated by the identical code path in the same invocation, and the reported
    quantity is the ratio measured rank over random rank per bond. (D) A ratio well below one is a
    compactness statement with a size attached, because a bond of rank r admits an r-term representation
    whose storage is r times the sum of the leg dimensions instead of their product, and that is the
    second size formula this lane needs. A ratio at one is an equally usable measured obstruction:
    it says the ALR elimination has no bond-rank structure to exploit, at the tested sizes, and closes
    that route with a number rather than a verdict. (E) NOT CLAIMED: no attack, no speedup, no assertion
    that a low bond rank yields a fast contraction, no re-derivation of Semaev degree growth, and
    no claim about the asymptotic bond-rank law that KN-OPEN-007 leaves open. Rank is storage; contraction
    cost is a separate accounting this entry does not attempt.'
  mechanism: 'STAGE 1, write the tree. Express the ALR chart-wise elimination as an explicit contraction
    schedule: leaves are the coefficient tensors of W and of K_P per chart, bonds are the eliminated
    variable v and the source index, and the root is the emitted candidate object. The schedule is
    written down and hashed before any measurement, because a rank measured on an unstated schedule
    is not reproducible. STAGE 2, materialise each intermediate at toy sizes only, where materialisation
    is affordable, and record its shape. STAGE 3, compute exact rank by Gaussian elimination over
    F_p on every matricisation of the intermediate across each bipartition of its legs, since bond
    rank is defined per bond and a tensor has one rank per bipartition. STAGE 4, draw thirty uniformly
    random tensors of identical shape over the same field and eliminate them identically, giving a
    null rank distribution per bond rather than a single generic number. STAGE 5, report per bond
    the measured rank, the null rank distribution, their ratio, and the storage implied by an exact
    rank-r representation against the dense shape. STAGE 6, sweep N and the source count to obtain
    a rank-growth curve per bond, and read it for the protocol''s structural tell: a rank that stays
    constant while the leg dimensions grow is either real structure or a bug in the matricisation,
    and the run distinguishes these by checking the rank against the trivially forced bounds first.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read knowledge/open-problems/KN-OPEN-007.md in full, and ledger/questions/RQ-ALR-001.yaml,
      ledger/hypotheses/H-ALR-001.yaml, ledger/evidence/EV-ALR-001.yaml. Greps run: grep -ril ''bond_rank|bond
      rank|tensor.train|tensor network'' ledger/proposals/ ledger/hypotheses/ (4 hits: IDEA-20260725-006,
      IDEA-20260807-0085af, IDEA-20260807-049ed4, IDEA-20260808-46d7ef; titles and question ids resolved
      for all four); grep -ril ''resultant'' ledger/proposals/ (30 hits, titles listed).'
    results: 'IDEA-20260807-049ed4 under RQ-TTN-001 is the closest record and is explicit: it reports
      EV-TTN-001 and EV-TTN-002 measuring exact F_p Semaev bond ranks 3, 6, 15 at m = 3, 4, 5 against
      full ranks 3, 25, 81, a closed-form law, and a constructive 45-term decomposition at m = 6,
      and it notes that H-TTN-001 was nevertheless rejected_scoped because the gate metric was recall
      under truncation. IDEA-20260808-46d7ef under RQ-AES-003 tracks a contraction schedule as its
      object in a symmetric-cipher setting. IDEA-20260807-0085af under RQ-NCP-001 concerns a path
      algebra. No record measures any bond of the ALR chart-wise target-divisor elimination, and RQ-ALR-001
      carries zero proposals.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Assembled from known parts:
      reading an elimination as a contraction tree and measuring exact F_p bond rank by rank-revealing
      elimination is exactly the method of RQ-TTN-001 and IDEA-20260807-049ed4, and the norm-free
      caveat is taken verbatim from KN-OPEN-007. The tracked-object framing of a contraction schedule
      is IDEA-20260808-46d7ef''s. Claimed new only as the object measured: the bonds of the ALR target-divisor
      elimination, which are not Semaev bonds, are not measured anywhere in this repository, and whose
      ranks may behave entirely differently because the elimination is affine in the eliminated variable.'
  object_first_candidate:
    tracked_object: 'The intermediate bond tensor of the ALR contraction tree, reduced to a single
      integer per bipartition: its exact rank over F_p. The object followed through the computation
      is the vector of bond ranks along the schedule, not the tensors themselves.'
    lossiness: 'Reducing a tensor to its rank discards everything except one integer per bipartition:
      the entries, the row and column spaces, the identity of the eliminated variable. It is severely
      lossy, and no contraction can be performed from ranks alone. The retained integer still propagates
      because rank is subadditive and bounded under contraction in known ways: contracting two tensors
      along a bond produces a tensor whose rank across any bipartition is bounded by products and
      sums of the constituent ranks, so a rank vector moves forward through the schedule with deterministic
      bounds even though the values do not. Honest caveat: those are bounds, not equalities, so propagation
      here is one-sided and the run measures the realised rank rather than predicting it.'
    propagation: One step of the target operation, eliminating v between W and one chart's K_P, contracts
      two leaf tensors across the v bond and produces an intermediate. Acting on the tracked object,
      the step maps a pair of ranks to a bound on the resulting rank across each bipartition of the
      merged leg set; composing over source points accumulates these bounds along the schedule. Because
      K_P is affine in v, the v leg has dimension two at every leaf, which forces small bonds at the
      first level and is exactly the structural feature that makes the ALR tree worth measuring separately
      from the Semaev tree.
    survival_score: Low-rank structure survives as far as the largest bond at which the measured rank
      is strictly below the null distribution's minimum. The entry reports that bond index and the
      corresponding N explicitly, together with the rank-growth exponent fitted over the tested range
      and its standard error, and states plainly that a fitted exponent over four or five points is
      a description of the tested range and not an asymptotic law, which is the part KN-OPEN-007 leaves
      open and this entry does not close.
  null_object_control: For each bond, draw thirty tensors with entries independent and uniform over
    the same F_p and the identical shape, and run the identical rank-revealing elimination on the
    identical bipartitions in the same invocation. The null must show full rank, the minimum of the
    two bipartition dimensions, with probability approaching one, since a uniformly random matrix
    over F_p is full rank except with probability O(1/p). If the null arm is not full rank at some
    bond, the shape itself forces rank deficiency, the measured rank is not evidence of structure,
    and the run reports the forced bound instead. This check runs before any measured rank is interpreted.
  discriminated_from:
  - KN-OPEN-007 and RQ-TTN-001 measure bonds of the recursive Semaev resultant tree; the ALR tree
    eliminates a variable in which one factor is affine, has at most two charts, and has source index
    as a second bond type, so its bonds are different tensors of different shapes and neither result
    transfers.
  - IDEA-20260807-049ed4 proposes costing the exact rank-one-term factorization of Semaev bonds as
    a construction and evaluation algorithm; this entry measures ranks of a different tree and explicitly
    declines to cost any construction, which is the part that record owns.
  - IDEA-20260808-46d7ef tracks a contraction schedule as the object in an AES integral-attack setting;
    the shared idea is that the schedule is the object, which is cited, and nothing else transfers.
  - 'The blacklisted Semaev degree-of-regularity ladders: no summation-polynomial degree, no Groebner
    monomial order and no degree of regularity is computed anywhere here.'
  - 'EV-ALR-001''s observation that every remainder matrix has full target rank: that is a rank statement
    about the remainder matrix, a different object from a bond tensor of the contraction tree, and
    the run reports both so that agreement or disagreement between them is visible rather than assumed.'
  assumptions:
  - The chart-wise elimination admits a contraction-tree presentation that is faithful to the route
    EV-ALR-001 records, an assumption the committed schedule makes checkable.
  - Rank over F_p is computed exactly by elimination with no truncation and no tolerance, per the
    norm-free caveat in KN-OPEN-007.
  - Intermediates at the tested sizes can be materialised in memory, which is what confines the run
    to toy N.
  - Uniformly random tensors over F_p are full rank except with probability O(1/p), so thirty draws
    suffice to establish a null.
  - Bond rank is measured per bipartition and reported per bipartition, never collapsed to one number
    per tensor.
  predictions:
  - metric: measured_bond_rank_over_null_bond_rank_at_first_level
    direction: lower
    minimum_effect: 0.5
  - metric: measured_bond_rank_over_null_bond_rank_at_deepest_measured_bond
    direction: different
    minimum_effect: 'refuse to pre-commit: IDEA-20260807-049ed4 reports dramatic deficiency for the
      Semaev tree while EV-ALR-001 reports full target rank for the ALR remainder matrix, so the two
      nearest data points predict opposite answers and pre-committing would be picking one without
      a reason'
  - metric: null_arm_full_rank_fraction
    direction: higher
    minimum_effect: 0.95
  - metric: fitted_rank_growth_exponent_over_tested_N_range
    direction: different
    minimum_effect: 1.0
  minimal_test:
    design: 'Restrict to the first two levels of the contraction tree, where intermediates are small.
      For N in 3, 4, 5, 6 and source count n in 2, 3, 4, build the leaf tensors from the ALR chart
      conventions, contract the v bond exactly over F_p, materialise each intermediate, and for each
      bipartition of its legs compute exact rank by Gaussian elimination. In the same invocation draw
      thirty uniformly random tensors of identical shape and rank them identically, giving a per-bond
      null distribution. Report per bond the measured rank, the null minimum, their ratio, the forced
      lower and upper bounds from leg dimensions, and the storage of an exact rank-r representation
      against the dense product of leg dimensions. Twelve cells at these sizes are seconds to minutes
      of exact linear algebra. This discriminates immediately because the forced bounds are checked
      first: a measured rank equal to a forced bound is not structure, and a measured rank strictly
      inside the bounds and strictly below every null draw is the only outcome that means anything.'
    controls:
    - Thirty uniformly random tensors of identical shape per bond, same invocation, same elimination
      code path.
    - 'Forced-bound check: compute the trivial rank bounds implied by leg dimensions and by the affineness
      of K_P in v, and report any measured rank that merely attains a forced bound as forced rather
      than as structure.'
    - 'Schedule commitment: the contraction schedule is written and hashed before measurement, so
      ranks cannot be reported against a schedule chosen after seeing them.'
    - 'Bipartition completeness: every bipartition of legs is ranked, not only the one that looks
      favourable.'
    - Second toy prime per cell, since exact rank over F_p can be characteristic-dependent.
    required_metrics:
    - measured_bond_rank_per_bipartition
    - null_bond_rank_distribution_per_bipartition
    - rank_ratio_measured_over_null
    - forced_rank_bounds_from_leg_dimensions
    - rank_r_representation_storage_versus_dense_shape
    - fitted_rank_growth_exponent_and_standard_error
    - second_prime_rank_agreement_rate
  falsification_conditions:
  - Measured bond ranks lie inside the null distribution at every bond and every bipartition, so the
    ALR tree has no measurable bond structure at the tested sizes.
  - Every measured rank equal to a forced bound, so the apparent structure is dimensional bookkeeping.
  - The null arm is not full rank at some bond, invalidating the comparison at that bond until the
    forced bound is reported instead.
  - Ranks differ between the two toy primes beyond the reported tolerance, indicating characteristic-dependent
    degeneracy rather than structure.
  - The committed contraction schedule cannot be shown to reproduce the route EV-ALR-001 records,
    so the measured tree is not the ALR tree.
  - No cell beyond the first level can be materialised within the memory budget, in which case the
    run reports an instrument limit and not a mathematical boundary.
  confounders:
  - Materialising intermediates is exactly what the lane is trying to avoid, so the measurement itself
    pays the represented cost; this is acknowledged as the price of measuring and bounds the run to
    toy sizes permanently.
  - 'Schedule choice: a different contraction order gives different bonds and different ranks, so
    any result is conditional on the committed schedule and would not transfer to a reordered one.'
  - Affineness in v forcing small first-level bonds for trivial reasons, which the forced-bound check
    is designed to expose.
  - Small p producing accidental rank drops, addressed by the second-prime control.
  - EV-ALR-001's full-target-rank observation possibly describing the same underlying object under
    a different matricisation, which would make an apparent contradiction a presentation difference;
    both are reported side by side for this reason.
  interpretation_limits:
  - Bond rank is a storage statement; contraction cost is a separate accounting and is not attempted
    here.
  - All results are conditional on the committed contraction schedule and on toy N and n, and no asymptotic
    rank-growth law is claimed, which is precisely the part KN-OPEN-007 leaves open.
  - A rank ratio at one is a measured obstruction over the tested range only and closes no direction
    outside it.
  - Nothing here bears on the Semaev tree, whose bonds are different tensors, and no Semaev result
    is confirmed or contradicted.
  target_complexity:
    time_exponent: No attack exponent is claimed. Contraction time is not modelled; the run reports
      only exact ranks and the storage they imply.
    memory_exponent: 'No asymptotic memory exponent is claimed. The reported memory quantity is concrete:
      r times the sum of leg dimensions field elements for an exact rank-r bond representation, against
      the product of leg dimensions for the dense intermediate, tabulated per bond at the tested sizes.'
    best_known: The incumbent is the dense chart-wise elimination recorded in EV-ALR-001, which materialises
      each intermediate in full; the entry measures how far below that the exact rank representation
      would sit and claims no improvement, since it does not supply a contraction that operates on
      the factored form.
    hidden_overhead: 'Hidden in the lower-order terms is the cost of converting between the factored
      and dense forms at every contraction step, which is invisible in a rank number and is where
      a naive low-rank contraction usually loses everything it gained. The human cost hides in the
      schedule: committing the wrong schedule produces ranks that are correct for a tree nobody uses.'
  dominated_by: n/a (no result claimed). All frontier rows recorded in this lane were checked, the
    B^(5/2) rho proxy and the five B^(7/2) represented routes of EV-ALR-001, and a rank measurement
    is not a point on any of them. It is also not dominated by IDEA-20260807-049ed4's Semaev bond
    result, because that concerns a different tree, which is why both are reported rather than compared.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is,
    per bond, the ratio of measured exact rank to the minimum of thirty random-tensor ranks of identical
    shape, plus the implied storage ratio r times sum of legs over product of legs.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'That a faithful contraction-tree presentation of the ALR elimination
    can be committed and checked against the route EV-ALR-001 records: 0.7, since the route is described
    in prose and a faithful schedule may require a Coordinator ruling. That the first-level bonds
    are measurably below the null: 0.75, largely because K_P is affine in v, though the forced-bound
    check may attribute most of that to dimensions rather than structure, which is why the forced-bound
    metric is required. That deeper bonds are strictly below their nulls: 0.35, since EV-ALR-001''s
    full-target-rank observation points the other way while IDEA-20260807-049ed4''s Semaev result
    points this way. That any deficiency found is characteristic-independent: 0.5. That the run reaches
    beyond the second level within the memory budget: 0.25.'
