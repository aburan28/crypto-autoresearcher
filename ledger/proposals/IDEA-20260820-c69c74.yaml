idea:
  id: IDEA-20260820-c69c74
  question_id: RQ-SQISIGN-001
  added: 2026-08-20
  title: Algebraic Stein operators for SQIsign transcript simulation
  class: transcript-distribution falsification method
  claim: >-
    Public norm, trace, degree, and verifier-incidence identities may induce
    Stein operators whose expectations vanish under an exact SQIsign transcript
    simulator but not under a real signer affected by acceptance-conditioned or
    conversion-choice bias. This is an unverified distinguisher audit, not
    evidence of leakage or recovery.
  mechanism: >-
    Build public functions A_j(T,f) from identities checked or implied by
    verification, with T a fully decompressed transcript and f a bounded test
    function on public strata. Choose A_j so summation by parts over neighboring
    verifier-admissible states gives E_sim[A_j(T,f)]=0. Estimate the same
    residuals on real signing transcripts. A replicating residual localized to
    one norm or incidence stratum identifies a distributional mismatch without
    pretending that it decodes the secret ideal.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: governing question and mandatory true-simulator null
    - id: KN-TECH-057
      provenance: internal
      use: fully charged SQIsign and ideal-to-isogeny baselines
    - id: KN-TECH-058
      provenance: internal
      use: current Fp2 baseline and conditional caveats
    - id: EXP-SSI-7c41d9
      provenance: internal
      use: three-replicate qualified-model simulator control precedent; unarchived
    - id: KN-LIT-1248
      provenance: kb
      use: unreviewed preprint pointer, not support
  predictions:
    - Genuine-simulator null residuals remain calibrated across at least three seeds and all preregistered public strata.
    - A planted epsilon tilt on one admissible norm-incidence transition produces a residual growing with epsilon before saturation.
    - Any real/sim residual replicates on held-out operators with the same sign and stratum localization.
  controls:
    true_simulator_null: identical genuine simulator, parsing, decompression, strata, and sample count
    planted_positive: verifier-admissible simulator with an epsilon tilt on one public norm-incidence transition
    nearby_object: randomized regular graph matched for degree and stratum counts
    blinding: fit operators on disjoint training transcripts and evaluate once on held-out seeds
  falsification_conditions:
    - The planted tilt is not detected at preregistered power.
    - The genuine-simulator null is miscalibrated.
    - All held-out real/sim residual intervals contain zero after multiplicity correction.
  confounders:
    - unequal parser rejection or decompression failures
    - sparse-stratum selection and operator overfitting
    - degree heterogeneity mistaken for protocol algebra
  interpretation_limits:
    - A null result covers only the selected operators, strata, scale, and sample budget.
    - A positive residual is a distinguisher artifact until replicated and does not imply ideal recovery.
    - No SSI hard-problem conclusion is authorized; GOAL-SSI-001 owns that lane.
  heuristic_assumptions:
    - H-ST-1: local verifier-admissible transitions can be enumerated or sampled with correct public multiplicities at the tested toy scale.
    - H-ST-2: held-out bounded operators have enough power to detect the planted effect sizes.
  target_complexity:
    objective: detect or upper-bound transcript mismatch; no secret recovery or asymptotic improvement
    unconditional_fp2: time p^(1/2)*(log p)^O(1), polynomial memory
    conditional_fp2: p^(1/3+o(1)) time and memory under Heuristic 1, superpolynomial hidden overhead, no concrete-cost conclusion
    conditional_fp: retain a separate KN-TECH-057 row and do not inherit the Fp2 estimate
    success_accounting: family-wise error plus inverse-power sample cost; no conversion from advantage to recovery
  cost_model:
    time: O(N*k*d) public-field and adjacency evaluations
    memory: O(k*S) summaries; raw transcript retention charged separately
    data_or_queries: N real, N genuine-simulator, and N planted-control transcripts
    preprocessing: verifier-state sampler and public multiplicity weights
    success_retries: at least three seeds, with multiplicity and low-power reruns charged
    verification: parser replay, operator identity checks, null calibration, and held-out reproduction
  proof_search_map:
    exact_baseline_reproduction: reproduce KN-TECH-057 full-cost rows and KN-TECH-058 caveats
    observation_collision_search: find distinct verifier states and conversion choices sharing every selected operator value
    quantifier_order: fix operators, strata, epsilon grid, and error budget before evaluation transcripts
    method_ceiling: blindness to large observation-collision classes limits conclusions to selected public algebra
    nearby_object_control: matched randomized graph tests degree heterogeneity as the explanation
  nearest_neighbors:
    - id: IDEA-20260801-020
      discriminator: derives algebraic zero-expectation operators rather than testing generic transcript independence
    - id: IDEA-20260815-56f047
      discriminator: localizes identities on verifier-state neighbors rather than divergence along conversion steps
  dominated_by: n/a (no result claimed)
  sota_delta:
    time_exponent: 0
    memory_exponent: 0
    data_or_queries: plus 2N matched control transcripts
    quantitative_statement: no SOTA improvement; expected delta is diagnostic resolution only
  recommended_priority: medium
  recommended_cost: low-to-medium toy-scale static construction plus controlled sampling
  recommended_prior: 0.20 probability of finding a reproducible non-null residual at a useful toy scale
  recommended_provenance: idea-generator judgement; unverified

