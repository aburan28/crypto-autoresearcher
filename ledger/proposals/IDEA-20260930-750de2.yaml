    - metric: M6 -- Stage-2 planted guess-and-kangaroo cost versus G_M * 2 sqrt(2^m/M) at the best modulus per cell
      direction: different
      minimum_effect: Measured mean within a factor 1.5 of the law; outside it the law (not the theorem) is re-fitted and the deviation reported.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): check Lemmas 1-2 and Theorem 3 by hand;
      write the closed-form table of C(k, w), 2 sqrt(2^m / M) and the Theorem-3
      lower bound for every cell and every k; hash it before any count runs.
      STAGE 1 (the CHEAPEST VALID DISCRIMINATOR, minutes of integer work, no
      group operations): cells (m, w) in {(24, 3), (24, 4), (24, 6), (28, 4),
      (28, 7), (32, 4), (32, 6), (32, 8)}. Exact residue class sizes |W_sigma|
      by a DP over positions with state (weight used, residue), O(m w M) per
      modulus, for (i) every odd M <= 4095 and (ii) M = 2^k - 1, 2^k + 1 and
      every divisor of these for k <= 16; for k in (16, m] the same moduli by
      direct enumeration of W (at most C(32, 8) = 10518300 elements) and
      counting distinct residues. Outputs G_M, D_M, C_M (worst and average) and
      R per cell. Same tables for NULL-1 (five seeds), NULL-2, W_clu with
      k0 = 8 and S0 = {0, 1, 2}, and the decay ladder q.
      STAGE 2 (an hour on (Z/l, +), l the least prime above 2^{m+2}): at the
      best modulus per cell from Stage 1, 30 planted x per cell, guess-and-
      kangaroo with distinguished points; certified solves; group additions
      counted by one frozen counter; peak words traced; plain kangaroo and
      brute force on the same instances as rows. One cell repeated on a
      self-generated prime-order toy curve (curve arm must reproduce the Z/l
      counts within sampling error).
      OUTCOME TABLE. E1: R >= 0.5 at all cells, M4 below 1, controls pass ->
      record the closure of class F_M at the section-4 standard (obstruction
      quantity G_M, value per cell, scope the ladder) and forward guidance to
      hash-walk and nested classes. E2: R <= 0.25 at two or more cells with the
      m-trend, controls pass -> the minimising moduli are a lead; a hypothesis
      is designed for the corresponding algorithm at larger m. ARTIFACT:
      positive control fails, decay flat, NULL-1 shows the same concentration,
      or M1 mismatch -> void, nothing about W is read.
      FALSIFICATION THRESHOLDS, FIXED NOW: Theorem 3 is falsified by any
      G_M < C(k, w) at a fold modulus; E1 is falsified by R <= 0.25 at two
      cells with the m-trend; E2 is falsified by R >= 0.5 at every cell.
      SEEDS: one PCG64 stream per arm, recorded; moduli sets and cells frozen
      before Stage 1.
    controls:
      - NULL-1 random set of equal size (five seeds), identical counter (blocking).
      - NULL-2 interval of equal size; family must return kangaroo.
      - POSITIVE CONTROL planted clustered class W_clu where a gain must be detected (blocking).
      - DECAY ladder q on W_clu (blocking).
      - Plain kangaroo, brute force and (where affordable) Coppersmith-split MITM rows on the Stage-2 instances with their own storage traces.
      - Elliptic consistency arm at one cell (instrument check, never a finding).
    required_metrics:
      - per (cell, M) the exact class-size histogram summary (G_M, max class, D_M), as integers
      - per cell C_M worst-case and average-case, B, R, and the minimising modulus
      - Theorem-3 bound versus measured G_M for every fold modulus
      - null, interval, positive-control and decay tables
      - Stage-2 certified additions, kangaroo constant, peak words, integer work of the guess enumeration
      - sha256 of every table and of the Stage-0 closed form

  falsification_conditions:
    - 'F1. Any fold modulus with G_M < C(k, w): Theorem 3 is wrong as stated; record superseded.'
    - 'F2. R <= 0.25 at two or more cells with R decreasing in m, controls passing: E1 is falsified and the minimising moduli are reported as a lead (favourable branch).'
    - 'F3. NULL-1 concentration equal to W at the same moduli: the effect is set size, not weight structure; the arm is void.'
    - 'F4. Positive control not detected or decay flat in q: instrument void; nothing about W is read.'
    - 'F5. Stage-2 measured cost outside a factor 1.5 of G_M * 2 sqrt(2^m/M): the cost law (not Lemma 1 or Theorem 3) is re-fitted and reported.'
    - 'F6. Budget exhaustion or crash: infrastructure outcome under AGENTS.md rule 3, never evidence.'

  confounders:
    - Toy m (24 to 32) puts poly(m) factors at the same scale as the exponents; Theorem 3 is asymptotic and the ladder tests the finite statement C_M >= B/2, not the exponent.
    - The average-case guessing order uses the measured class masses, which an attacker can compute offline; this is fair, but the offline table of M words is charged as advice and reported.
    - The kangaroo constant at toy L differs from 2; Stage 2 measures it rather than assuming it.
    - Residues of W are computed for the integer x < 2^m; on the curve arm the exponent is the same integer, so no wrap modulo n enters (l > 2^{m+2}).
    - Restricting general moduli to M <= 4095 leaves large non-fold moduli untested except by H1; the test says so.

  interpretation_limits:
    - Claim tier toy; the theorem is a derivation-level claim scoped to class F_M, odd moduli, M of fold type, w <= m/2.
    - E1 closes congruence filtering by guessed residues as a route to the RQ target for this class only; it does not close hash-iterated walks, nested collision search, approximate group-side filters, or the RQ.
    - E2 would be a lead for a conditional algorithm at toy scale, not a result at any cryptographic size.
    - No experiment, hypothesis, approval or status change is created by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Equidistribution of fixed-weight integers for moduli of large 2-order.)
        For odd M with ord_M(2) >= m and M <= |W|, max_sigma |W_sigma| <=
        (1 + eps) |W| / M + O(log M), i.e. D_M <= 1 + eps up to the Poisson
        fluctuation of M classes of mean |W|/M.
      rigorous_support: >-
        Gelfond 1968 and Erdos-Mauduit-Sarkozy 1986 (as quoted in
        arXiv:2411.07418) prove uniform distribution of digit- and
        sum-of-digit-restricted integers in residue classes of moduli coprime
        to g(g - 1) with error exp(-c log N / log M); Mauduit-Sarkozy (recalled)
        for fixed digit sum. These cover M = N^{o(1)}; H1 extrapolates to M up
        to |W|, which is where the guess-and-kangaroo trade lives.
      validation_plan: >-
        SAMPLE exhaustively: all odd M <= 4095 at the eight cells (exact class
        sizes, no sampling). COMPARE the maximum class size with the predicted
        maximum of M Poisson(|W|/M) variables; TAIL check: the five most
        concentrated non-fold moduli per cell are listed with their D_M and
        re-checked by direct enumeration. TRANSFER: none claimed beyond
        m = 32; extrapolation of H1 to cryptographic m is stated as such.
    - id: H1'
      statement: >-
        (Fold residues equidistribute modulo proper divisors.) For M a proper
        divisor of 2^k -+ 1 with k >= w, the C(k, w) weight-w residues and the
        rest of rho_{2^k -+ 1}(W) fall into residue classes mod M with
        G_M >= min(M, G_{2^k -+ 1}) / (1 + eps).
      rigorous_support: >-
        Pigeonhole gives only G_M >= G_{2^k -+ 1} M / (2^k -+ 1); H1' imitates
        the equidistribution of a structured set under a coarser modulus, the
        same classical statement as H1 applied to the fold image.
      validation_plan: >-
        SAMPLE every divisor of 2^k -+ 1 for k <= 32 at every cell (factorisations
        of these numbers at this size are small and are computed, not quoted);
        COMPARE G_M with min(M, G_{2^k -+ 1}); TAIL: report the divisor with the
        largest shortfall per k.

  heuristic_note: >-
    Lemmas 1-2 and Theorem 3 are exact (Theorem 3 for k >= 1.124 w; P-FOLD-2
    below that). H1 and H1' carry the only extrapolation and are measured
    exhaustively on the ladder.

  target_complexity:
    time_exponent: >-
      NO ALGORITHMIC IMPROVEMENT CLAIMED. For the guess-and-kangaroo family the
      record proves worst-case cost >= min(2^{m/2}, C(m, w))^{1 - o(1)} for
      Mersenne and Fermat moduli and conjectures it (H1, H1') for every other
      odd modulus; for any modular-filter transfer in F_M it states the
      multiplier G_M. Target of the RQ, for comparison: sqrt(C(m, w)) m^{O(1)},
      i.e. 2^{(H(alpha)/2) m}.
    memory_exponent: >-
      Kangaroo state plus the residue unranker, poly(m) words, for the family;
      the Stage-1 DP table of O(w M) words is analysis cost, never solver
      memory.
    best_known: >-
      Time sqrt(C(m, w)) m^{O(1)} with storage of the same order (Coppersmith /
      Stinson, recalled); polynomial memory: Esser-May as reported (KN-LIT-4794),
      the single-level half-split law |W|^{3/4} 2^{-w/4} (IDEA-20260906-ab08cb,
      heuristic), kangaroo 2^{m/2 + 1} (KR-RHO-898783); plain rho about
      0.886 sqrt(n) ignoring the promise.
    hidden_overhead: >-
      Producing the guess list costs O(G_M poly(m)) integer operations by
      unranking; this is reported beside group additions. The o(1) in Theorem 3
      hides the polynomial factor sqrt(k) of C(k, w) and the kangaroo constant;
      no superpolynomial term is hidden.
    tradeoff_note: >-
      Guesses are embarrassingly parallel and each kangaroo is parallel by
      van Oorschot-Wiener (KR-RHO-6239aa), so the family parallelises linearly;
      it trades nothing against memory, which is why it is the natural
      polylog-memory candidate and why its closure matters.

