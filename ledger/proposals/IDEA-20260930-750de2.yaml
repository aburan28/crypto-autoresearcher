idea:
  id: IDEA-20260930-750de2
  question_id: RQ-LHW-1877bb
  goal_id: null
  goal_id_note: >-
    RQ-LHW-1877bb carries goal_ids [] at filing time (context/L4-GENERIC.md).
    Left null deliberately; binding is a Coordinator decision.
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE RESIDUE-GUESS PRICE OF A MODULAR FILTER IN A PRIME-ORDER GROUP: every
    subset-sum technique that filters by a congruence (Schroeppel-Shamir and
    dissection, BCJ / Esser-May mod-M representation filters, Delaplace-Esser-May
    multiple collisions) can, on the low-weight DLP in a prime-order group,
    constrain only KNOWN partial exponents and must GUESS x mod M for the unknown
    side; low Hamming weight makes that guess cheap only for moduli in which 2
    has small order (Mersenne / Fermat folds), and the guess-and-kangaroo family
    built on those moduli is provably dominated by min(kangaroo, brute force) at
    leading exponent, with the residue-concentration ratio D_M as the single
    measured quantity that could reverse the verdict
  class: mechanism

  claim: >-
    SETTING. Generic group G of prime order n with generator P; target Q = [x]P
    with x in W(m, w) = {0 <= x < 2^m : popcount(x) = w}, 2^m < n, alpha = w/m.
    Realised at toy scale as (Z/l, +) and as prime-order subgroups of
    self-generated toy curves (the RQ's two arms). Cost unit: group additions;
    integer operations, lookups and storage charged separately.

    LANE FRAME (handoff constraint). Memory-heavy baseline: Coppersmith
    splitting / Stinson meet-in-the-middle at sqrt(C(m, w)) m^{O(1)} time with
    storage of the same order (KN-LIT-2177, KN-LIT-2135; formulas recalled).
    Best low-memory prior as the ledger records it: Esser-May, polynomial
    memory, reported 2^{0.65n}-type (subset sum 2^{0.645n}; the DLP curve is
    reported and NOT read by this program, KN-LIT-4794). Plain kangaroo on
    [0, 2^m) at 2 * 2^{m/2} with polylog memory is the sharper outer row
    (IDEA-20260906-ab08cb Claim B). The obstruction any memoryless collision
    search must overcome is a cheap, well-mixing map from W(m, w) to itself
    whose collisions yield logarithms; the only blind operations preserving W
    are doublings (orbit length at most m before overflow), and translations
    destroy W. THIS RECORD addresses the complementary route that subset-sum
    algorithms use instead of mixing -- FILTERING by a congruence -- and prices
    it.

    DEFINITIONS. For odd M let rho_M(x) = x mod M (a ring homomorphism of the
    INTEGER exponent, not a map on G), W_sigma = {x in W : x = sigma mod M},
    G_M = |rho_M(W)| (number of residues hit) and D_M = M max_sigma |W_sigma| /
    |W| (concentration ratio; D_M = 1 for perfect equidistribution).
    Baseline B(m, w) = min(2 * 2^{m/2}, |W|) (kangaroo or brute force).

    LEMMA 1 (TRANSFER PRICE; rigorous bookkeeping). Call F_M the class of
    algorithms that compute only elements [a]P and Q - [b]P with a, b known
    and that keep a b-side candidate only if b = tau (mod M) for a residue tau
    they supply, success requiring tau = x - a (mod M). In a group of prime
    order n there is no nontrivial homomorphism G -> Z/M (its image would have
    order dividing gcd(n, M) = 1), and more generally no exactly
    sum-compatible bucket function exists (KN-FIND-ffe1df Theorem C, exact
    case, validator-confirmed). Hence an algorithm in F_M cannot read x mod M
    from Q and must enumerate tau over rho_M(W) - a: worst-case multiplier
    G_M, average multiplier the guessing work of the residue distribution. A
    modular filter transferred from subset sum is therefore profitable on the
    low-weight DLP only if its saving factor exceeds G_M.

    LEMMA 2 (GUESS-AND-KANGAROO COST; rigorous given the kangaroo law). The
    simplest member of F_M: for each sigma in rho_M(W) solve the interval DLP
    for c = (x - sigma)/M in [0, ceil(2^m / M)) by kangaroo on
    [M^{-1}](Q - [sigma]P). Worst-case cost C_M = G_M * K(2^m / M) with
    K(L) = (2 + o(1)) sqrt(L) (KR-RHO-898783, proven). Since G_M >= M / D_M,
    C_M >= 2 sqrt(M) 2^{m/2} / D_M, so C_M < 2 * 2^{m/2} REQUIRES D_M > sqrt(M).

    THEOREM 3 (MERSENNE AND FERMAT FOLDS ARE DOMINATED; rigorous for
    1.124 w <= k <= m, w <= m/2). For M = 2^k - 1 or M = 2^k + 1, every k-bit
    integer r of weight w is itself in W (r < 2^k <= 2^m) and distinct such r
    are distinct residues, so G_M >= C(k, w). Hence
    log2 C_M >= log2 C(k, w) + (m - k)/2 - O(1). With kappa = k/m the leading
    exponent L(kappa) = kappa H(alpha/kappa) + (1 - kappa)/2 has derivative
    -log2(1 - alpha/kappa) - 1/2, which is decreasing in kappa, so L is CONCAVE
    on [alpha, 1]; L(kappa) >= 1/2 wherever H(alpha/kappa) >= 1/2, i.e. for
    kappa >= alpha/0.89 (H(0.11) = 0.4999, hand-computed); and L(1) = H(alpha).
    By concavity, on [1.124 alpha, 1] the minimum is at an endpoint, so
    log2 C_M >= min(m/2, log2 |W|) - O(log m). The fold family is never better
    than the better of kangaroo and brute force at leading exponent. For
    k < 1.124 w the same conclusion needs proof obligation P-FOLD-2 (residue
    inflation, below) and is checked exhaustively on the ladder.

    CONJECTURE 4 (EVERY OTHER MODULUS; conditional on H1 and H1'). For odd M
    with ord_M(2) >= m, and for proper divisors M of 2^k -+ 1, the residues of
    W are equidistributed enough that G_M >= min(M, |W|, C(k, w)) / (1 + eps);
    then C_M >= B(m, w) / (1 + eps) by the same arithmetic (M <= |W| gives
    C_M >= 2 sqrt(M) 2^{m/2}; M > |W| gives C_M >= 2 |W| sqrt(2^m / M) >= 2|W|
    for M <= 2^m).

    WORKED CELL (hand arithmetic, estimates, not measurements). (m, w) =
    (32, 6): |W| = 906192, kangaroo 2 * 2^16 = 131072, sqrt|W| about 952.
    Lower bounds G_M >= C(k, 6) give C_M >= 229824 (k = 8, M = 255),
    1.89e6 (k = 12), 4.10e6 (k = 16), 4.31e6 (k = 24): every one above
    kangaroo. (m, w) = (24, 3): |W| = 2024 below kangaroo 8192; C_M >= 20644
    (k = 6), 28160 (k = 12), 13056 (k = 18): every one above brute force.

    THE TWO EXPLANATIONS THIS RECORD DISCRIMINATES. E1 (EQUIDISTRIBUTION /
    FOLD LAW): no modulus concentrates W(m, w) beyond the fold bound, the
    guess-and-kangaroo family satisfies min_M C_M >= B / 2 on every ladder cell,
    and every modular-filter transfer pays at least G_M; congruence filtering
    is closed as a route to the RQ target for this class. E2 (HIDDEN
    CONCENTRATION): some modulus family M(m) with ord_M(2) not small has
    D_M > sqrt(M) by a margin that grows with m, giving a guess-and-kangaroo
    algorithm below min(kangaroo, brute force) with polylog memory, or a
    profitable filter transfer -- an exponent-level lead for the RQ.

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md; inventor protocol sections 1-2).
    Tracked object: the residue rho_M(e) of a KNOWN partial exponent e, and on
    the unknown side the guessed residue of x. Representation: the coefficient
    side of the computation (integers a, b carried beside the group elements),
    not a point representation of G. Operation set Sigma = {integer addition of
    known partial exponents; enumeration of a guess}. LOSSY-PROJECTION TEST
    against Sigma: rho_M discards everything but the class mod M (fibres of
    size about |W|/G_M on W); it propagates deterministically because
    rho_M(a1 + a2) = rho_M(a1) + rho_M(a2) on integers. It is NOT a projection of
    G: on the group side translation-compatibility would need a homomorphism
    G -> Z/M, which a prime-order group lacks (the c5d183 / Theorem C result),
    so the unknown side's residue is a BRANCHING object. TRICHOTOMY: partial
    action on the known side, branching on the unknown side, priced by the
    (L, b) meter of IDEA-20260802-002 with loss L = 0 and branching
    b = G_M (worst case). WHY LOW WEIGHT MATTERS: x mod (2^k - 1) depends only
    on the fold vector c(x) in Z_{>=0}^k, c_j = #{i in supp x : i = j mod k};
    for k much larger than w most folds are 0/1 vectors of weight w and G_M is
    about C(k, w), far below M = 2^k -- the residue really is cheap to guess.
    WHY IT STILL LOSES: a cheap guess needs a large k, a large k leaves an
    interval of length 2^{m - k} for kangaroo, and the trade
    C(k, w) * 2^{(m - k)/2} is concave in k (Theorem 3), so the two ends --
    kangaroo (k = 0) and brute force (k = m) -- always win. The quantity that
    could break this is D_M for moduli NOT of fold type; equidistribution of
    fixed-weight integers in residue classes (Gelfond 1968; Erdos-Mauduit-
    Sarkozy 1986, as quoted in arXiv:2411.07418; Mauduit-Sarkozy fixed sum of
    digits, recalled) is the classical theory that says it should not, but
    those theorems cover moduli only up to a size far below 2^k, which is why
    H1 is a heuristic here and is measured exhaustively.
    OFF-LIMITS AS PRIMARY LENS (heavily mined in this lane): hash-iterated
    single-level walks and the fibre-surplus law (IDEA-20260906-ab08cb), nested
    replay (IDEA-20260906-3493fe), nonbacktracking exchange walks
    (IDEA-20260906-7d5c16), carry mixtures (IDEA-20260906-c37df9,
    H-LHW-8e8cff), list-based balance ratios (H-ICEX-8f9ea2).

