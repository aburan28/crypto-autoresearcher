  assumptions:
    - n prime with 2^m < n; l prime above 2^{m+2} on the Z/l arm so no wrap affects residues.
    - Moduli M are odd (x mod 2^j is a positional split, already covered by Coppersmith splitting, and is excluded).
    - The guess list rho_M(W) is enumerated on the fly (unranking fold vectors or a DP over positions) and its integer work is charged separately from group additions; a stored residue table of M words is NOT polynomial memory and is reported as such.
    - Kangaroo is run with its standard parameters and its constant measured on the same instrument; K(L) = 2 sqrt(L) is the asymptotic law, not an assumption about toy constants.
    - Worst-case statements are over x in W; average-case statements use the uniform distribution on W and the best guessing order (decreasing class mass).

  proof_search_map:
    bottleneck: >-
      Whether any odd modulus M concentrates W(m, w) on few residue classes
      relative to sqrt(M) (D_M > sqrt(M)) outside the trivial brute-force
      regime -- the single step whose positive answer would turn a congruence
      filter into a usable constraint on the unknown side.
    baseline_embedding:
      parameter_slice: >-
        M = 1 reproduces plain kangaroo (C_1 = 2 * 2^{m/2}); M = 2^m - 1 (k = m)
        reproduces brute force (G_M = |W|, quotient interval of length 1); the
        interval nearby object W_I = [0, L) with L = |W| has D_M near 1 for
        every M <= L and the family returns kangaroo on W_I exactly.
      reproduction_check: >-
        Frozen fixture: the residue counter must return sum over sigma of
        |W_sigma| = C(m, w) exactly at every cell and modulus; G_M = |W| at
        M = 2^m - 1; G_M = M at M = 3, 5, 7 for every ladder cell with m >= 24
        (checked against direct enumeration); and Stage-2 planted kangaroo runs
        must show a mean cost within a factor 1.5 of 2 sqrt(L) before any C_M is
        read off the law.
    observation_collision:
      observable: The pair (G_M, D_M) per modulus and the ratio C_M / B per cell.
      distinct_preimage_search: >-
        REQUIRED. D_M alone does not decide: the random-set null W' (uniform
        subset of [0, 2^m) of size |W|) has D_M about M/|W| > sqrt(M) for M
        above |W|^2, yet guess-and-kangaroo on it is still dominated (it sits in
        the brute-force regime). So the decisive observable is C_M / B, and the
        record must exhibit, at one cell, two classes (W and W') with equal
        D_M / sqrt(M) and different C_M / B, or show none exists, before D_M is
        used as a flag.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Congruence filter in a prime-order group -> residue guess -> interval
          DLP on the quotient (x - sigma)/M.
        predicted_gain: None at leading exponent for fold moduli (Theorem 3); the value is the closure and the price G_M.
      - transform: observable_fiber
        proposed_object: The fold vector c(x) as the fibre variable through which x mod (2^k -+ 1) factors.
        predicted_gain: Turns G_M for fold moduli into a composition count, giving the rigorous bound G_M >= C(k, w).
      - transform: specialization_pack
        proposed_object: The exponent function L(kappa) = kappa H(alpha/kappa) + (1 - kappa)/2 and its concavity.
        predicted_gain: Reduces the whole fold family to two endpoints.
    quantifier_order: >-
      THEOREM 3: FOR ALL m, FOR ALL w <= m/2, FOR ALL k with 1.124 w <= k <= m,
      FOR M in {2^k - 1, 2^k + 1}: worst-case C_M >= C(k, w) * 2 sqrt(2^m /
      (2^k + 1)), hence log2 C_M >= min(m/2, log2 C(m, w)) - O(log m).
      CONJECTURE 4: FOR ALL odd M not of fold type (and proper fold divisors),
      under H1 / H1', C_M >= B / (1 + eps). EMPIRICAL CLAIM: FOR the declared
      ladder cells and the declared moduli set, min over M of C_M / B is as
      measured (exact integers, no sampling). No forall-x / exists-M swap: the
      modulus is chosen before the target.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Every algorithm in F_M pays a factor G_M; for Mersenne and Fermat
        moduli the guess-and-kangaroo family is no better than min(kangaroo,
        brute force) at leading exponent; on the ladder no tested modulus gives
        C_M < B/4." It certifies nothing about hash-iterated walks
        (IDEA-20260906-ab08cb), nested collisions (Esser-May), or APPROXIMATE
        group-side filters (Theorem C covers the exact case only), and nothing
        about any ECDLP without the promise.
      nearby_object_control: >-
        The planted clustered class W_clu (support restricted to positions i
        with i mod k0 in a small set S0) where the conclusion FAILS: x mod
        (2^{k0} - 1) takes a handful of values, D_M is far above sqrt(M), and
        guess-and-kangaroo beats kangaroo on that class. A method that cannot
        see that gain cannot certify its absence on W.
    proof_obligations:
      - claim: Lemma 1 -- no homomorphism G -> Z/M for prime n and odd M > 1; F_M must enumerate the b-side residue.
        responsibility: correctness
      - claim: Lemma 2 -- C_M = G_M K(2^m/M) worst case and G_M >= M / D_M.
        responsibility: runtime
      - claim: Theorem 3 -- G_M >= C(k, w) for M = 2^k -+ 1 and w <= k <= m; concavity of L on [alpha, 1]; the crossing kappa = alpha/0.89.
        responsibility: size
      - claim: P-FOLD-2 -- for k < 1.124 w and alpha <= 1/4, every k-bit residue of weight floor(k/2) is attained by some x in W via splits 2^a = 2^{a-1} + 2^{a-1+k} (positions a-1 and a-1+k), so G_M >= C(k, floor(k/2)).
        responsibility: feasibility
      - claim: The M = 1 and M = 2^m - 1 slices reproduce kangaroo and brute force exactly.
        responsibility: baseline
      - claim: The guess list is produced in polynomial memory by unranking, with its integer work charged.
        responsibility: memory
      - claim: Every Stage-2 solve carries a certificate re-verified by an independent scalar multiplication and a popcount check.
        responsibility: interface
      - claim: Nothing is claimed beyond class F_M, odd moduli, toy ladder, cost unit additions.
        responsibility: scope
    not_applicable_reason: null

  null_object_control: >-
    NULL-1 (RANDOM SET, BLOCKING): W' uniform random subset of [0, 2^m) with
    |W'| = |W|, five seeds; G_M, D_M and C_M/B tabulated on the same moduli.
    Prediction: G_M(W') about M (1 - exp(-|W|/M)); any fold-type modulus
    showing the same concentration on W' as on W means the instrument is
    measuring set size, not weight structure. NULL-2 (INTERVAL): W_I = [0, |W|);
    the family must return kangaroo on W_I to within the constant.
    POSITIVE CONTROL (BLOCKING): W_clu as in method_ceiling; the instrument must
    report C_M < B / 4 there. DECAY PARAMETER q: in W_clu(q) a fraction q of the
    w ones may sit anywhere; D_M at M = 2^{k0} - 1 must fall monotonically from
    its W_clu value toward its W value along q in {0, 0.25, 0.5, 0.75, 1}; a
    D_M flat in q is the artifact tell of docs/inventor-protocol.md section 3
    and voids the arm.

  predictions:
