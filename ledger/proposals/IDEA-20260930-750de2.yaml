    - metric: M2 -- G_M against the rigorous bound C(k, w) for M = 2^k -+ 1, every k in [w, m], every cell
      direction: higher
      minimum_effect: G_M >= C(k, w) at every (cell, k); a violation falsifies Theorem 3's counting step outright.
    - metric: M3 -- R = min over the declared moduli of C_M / B per cell (worst case) and its average-case analogue
      direction: higher
      minimum_effect: >-
        E1 iff R >= 0.5 at every cell; E2 iff R <= 0.25 at two or more cells AND
        the minimising moduli form a family whose R decreases with m across the
        three m values. Between, INCONCLUSIVE at this ladder.
    - metric: M4 -- max over non-fold moduli of D_M / sqrt(M), restricted to M <= |W| (outside the brute-force regime)
