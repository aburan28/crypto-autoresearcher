    - ref: IDEA-20260904-982159
      provenance: internal
      claim: >-
        Heuristics H1, H2 and H3 as stated there, and the cost formula
        T = n^{1/2}(h/sqrt d)^{1/2} n^{o(1)} that depends on all three.
      verified_by: >-
        Authored in this same task (TASK-20260904-300a32). Dependency, not independent
        corroboration.
    - ref: IDEA-20260904-7caed1
      provenance: internal
      claim: >-
        The Y_min versus Y_gen criterion, under which a measured deficiency of size
        n^{-c} in the coset minimum moves the exponent to 1/2 - c/2.
      verified_by: >-
        Authored in this same task. Dependency, not corroboration.
    - ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: internal
      claim: >-
        Section 4.2's heuristic-validation design - sampling via a correspondence that
        reaches cryptographic scale, empirical CDF of the log of the largest prime
        factor against Dickman-de Bruijn rho(u), a zoom on the smoothest samples, and
