        Second-hand from H-ECDLP-a4be60 structural_ingredients, read in full this task.

  assumptions:
    - >-
      n prime, gcd(n,p) = 1, curve and scalar self-generated at toy scale. NO LIVE
      KEY, WALLET OR DEPLOYED SYSTEM. No discrete logarithm is solved outside the
      planted calibration.
    - >-
      The sampler knows k by construction. Every measurement code path is statically
      checked not to read k except where the construction requires it, and the
      separation is a blocking control, because a statistic that reads k measures its
      own input.
    - >-
      Curve exclusion - anomalous (#E = p) and smooth-order curves excluded before a
      curve enters the run set, as IDEA-20260901-b4e6eb and H-ECDLP-a4be60 state the
      rule. KN-TECH-034 was NOT opened in this session.
    - >-
      Ladder - at least eight prime orders spanning three decades in the 17 to 30 bit
      band, at least four curves per prime order (directly addressing
      IDEA-20260807-347a83's one-instance-per-cell finding), and at least five values
      of the auxiliary parameter d or K.

  proof_search_map:
    bottleneck: >-
      Not applicable as a proof bottleneck; the record proves nothing. The MEASUREMENT
      bottleneck is the exact computation of h and of the class of each balanced
      prefix, which caps the auxiliary discriminant near 2^40 and therefore caps what
      HEUR-C can be validated over.
    baseline_embedding:
      parameter_slice: >-
        d = 1 (equivalently K = Q). The auxiliary lattice degenerates to Z, the coset
        is k + nZ, its minimum is exactly the absolute least residue of k, and its
        distribution is known in closed form (uniform on [0, n/2] for the absolute
        value). The estimator must reproduce that closed form EXACTLY.
      reproduction_check: >-
        FROZEN FIXTURE - at d = 1 the empirical CDF of the coset minimum must match the
        uniform law on [0, n/2] with a Kolmogorov-Smirnov p-value above 0.01 at every
        rung, in exact integer arithmetic. A pipeline that fails the one case with a
        closed-form answer is not measuring what it claims and no other cell is
        reportable. SECOND FIXTURE - at d = 1 the principal fraction is identically 1
        (Z is a PID), so HEUR-C's estimator must return exactly 1.000 there.
    observation_collision:
      observable: >-
        The triple (normalised coset minimum, largest prime factor of its norm,
        principal fraction).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - the on-curve sample and the SHAM MODULUS
        sample are structurally different objects (one has an elliptic curve behind its
        modulus, one does not) and are predicted to produce the SAME observable. That
        collision is the record's central claim, not a failure, and it CALIBRATES the
        conclusion to "the auxiliary construction sees nothing about the curve". A
        failure to collide is the most interesting outcome in the record and would
        suspend every exponent claim in the family until explained.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed and vary the forgotten structure - the curve, the
          curve's own CM discriminant, the auxiliary d, the bit size - and find whether
          any intrinsic invariant distinguishes the resulting samples. The prediction
          is that none does; the measurement is the test.
        predicted_gain: >-
          Either closes the family on a measured ground or produces the one thing the
          exemplar's method needs and prime-field ECDLP does not have.
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure as a per-cell record - (curve, n, d, M, statistic,
          seed) - and add charges only over proved-disjoint cells, so the ladder can be
          extended later without re-running what exists.
        predicted_gain: >-
          A reusable calibration artifact rather than a single verdict, which is what
          the corpus's one-instance-per-cell finding says is missing.
    quantifier_order: >-
      MEASUREMENT CLAIM - FOR ALL cells in the DECLARED ladder, the on-curve empirical
      distribution of each of the three statistics is within the pre-registered band of
      its matched null. The quantifier is over the declared ladder and the declared
      statistics only. THE STRONGER READING NOT CLAIMED - that curve-defined cosets are
      typical for every curve, every n and every auxiliary parameter; the record
      measures a finite grid and says so.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - "on the tested toy ladder the three heuristics hold within the
        pre-registered bands, with the stated Kolmogorov-Smirnov statistics and sample
        sizes, and the sham-modulus null is indistinguishable from the on-curve
        sample". It can NEVER certify the cost formula that depends on them, it
        certifies nothing at cryptographic n, and it proves no bound.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS is the exemplar's own
        setting, where the analogous "typicality" assertion is FALSE by a theorem -
        the minimal isogeny degree is p^{1/3} against a pigeonhole p^{1/2}. The
        planted-atypicality calibration is the in-scope stand-in for that object, and
        an instrument that cannot detect a planted factor n^{-1/6} - the exemplar's
        own gain, translated - has not shown it could see the phenomenon it is
        reporting absent. That specific planted value is a REQUIRED calibration point.
    proof_obligations:
      - claim: >-
          The d = 1 slice reproduces the closed-form uniform law and principal
          fraction 1.
        responsibility: baseline
      - claim: >-
          The planted-atypicality calibration recovers the dialled factor at all five
          values including n^{-1/6}.
        responsibility: feasibility
      - claim: >-
          No measurement code path reads k except the coset constructor.
        responsibility: interface
      - claim: >-
          Every reported statistic names the curve, n, d or K, M, the estimator and the
          seed.
        responsibility: scope
      - claim: >-
          The reported deviations are decomposed into an n-dependence and an
          M-dependence, and any deviation flat in n and decaying in M is reported as a
          controlled null.
        responsibility: correctness
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The triple (coset minimum, largest prime factor of its norm, principal fraction
      of its balanced prefixes), followed across resampling of k and of the curve.
    lossiness: >-
      Retains three real numbers of an object carrying log2 n bits; the fibre is
      enormous; the discard is compatible with resampling, which is the only operation
      the record performs. Passes, necessarily rather than informatively - the record
      states plainly that passing the lossy-projection test is not what makes this
      measurement worth running, the DECISION VALUE is, and it says so rather than
      dressing a control up as a discovery.
    propagation: >-
      Not applicable - this object is not propagated through a computation, it is
      sampled. The record does not claim a propagation result and must not be cited
      as one.
    survival_score: >-
      Not applicable for the same reason. The relevant depth here is the LADDER depth -
      three decades in n and five values of the auxiliary parameter - and that is
      reported as the scope of any conclusion.

  null_object_control: >-
    NULL-R, THE RANDOM COSET (blocking, primary comparator). Uniformly random cosets of
    the identical lattice on the identical estimator. HEUR-A's whole content is that
    the on-curve sample is indistinguishable from this.
    NULL-S, THE SHAM MODULUS (blocking, and the null that matters most). The identical
    measurement with n replaced by a random prime of matched bit length that is not the
    order of any curve in the run set. The construction contains no curve, so agreement
    is predicted and disagreement suspends the family.
    NULL-I, THE MATCHED RANDOM INTEGER (blocking, smoothness arm only). Uniformly random
    integers of the same size as N(alpha_min), which isolates the binary-form
    representability bias - a real, expected, n^{o(1)} effect - from any curve effect.
    NULL-H, THE SYNTHETIC BINOMIAL (blocking, class arm only). Draws from
    binomial(2^omega, 1/h), against which the measured principal fraction is compared.
    COMPARATOR 1 (blocking, matched control) - parallel Pollard rho with distinguished
    points and the negation map, run on the same instances in the same charged units.
    IT IS RUN EVEN THOUGH THIS RECORD MOUNTS NO ATTACK, because every number this
    record produces is eventually used to argue about a cost relative to rho, and the
    rho column must be measured on the same instances rather than quoted.
    COMPARATOR 2 (blocking, matched control) - BSGS on the same instances with memory
    reported, for the same reason.
    POSITIVE CONTROL A (blocking) - the d = 1 closed-form fixture.
    POSITIVE CONTROL B (blocking) - the planted-atypicality sweep, including the
    n^{-1/6} calibration point that corresponds to the exemplar's own gain.

  predictions:
    - metric: >-
        P1 - two-sample Kolmogorov-Smirnov statistic between the on-curve and NULL-R
        distributions of the normalised coset minimum, per (curve, n, d) cell
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. p-value above 0.01 in at least 95 percent of
        cells, with no systematic sign to the median shift across the ladder, records
        the CLOSURE branch for HEUR-A. A median ratio below 0.5 in three or more cells,
        with the deficiency GROWING in n and not in M, records the LEAD branch and
        routes to independent review before any interpretation. Between is INCONCLUSIVE
        in advance. BASIS - pre-registered from the sample size and the rank-2 Gaussian
        heuristic spread; NOT measurements.
    - metric: >-
        P2 - the empirical CDF of log(largest prime factor of N(alpha_min))/log N
        against rho(u), with a zoom on the 500 smoothest samples per cell, and against
        NULL-I
      direction: different
      minimum_effect: >-
        The on-curve CDF must agree with NULL-I within Kolmogorov-Smirnov p above 0.01
        - i.e. the only deviation from Dickman is the form-representability bias shared
        with NULL-I. TAIL CHECK in the exemplar's own style - the smoothest sample of M
        draws must be s-smooth with rho(u_s) within a factor 4 of 1/M. A curve-specific
        smoothness excess not shared by NULL-I is a lead.
    - metric: >-
        P3 - the measured principal fraction of balanced prefixes against 1/h, per
        (K, n) cell, and against NULL-H
      direction: different
      minimum_effect: >-
        Within a factor 2 of 1/h in at least 90 percent of cells records HEUR-C as
        validated in scope. A measured fraction reproducibly above 4/h is the single
        most consequential negative available in this session, because it is the one
        route by which the class-number penalty of IDEA-20260904-982159 could be
        smaller than derived, and it routes straight to independent review.
    - metric: >-
        P4 - the sham-modulus agreement, i.e. the Kolmogorov-Smirnov statistic between
        the on-curve and NULL-S samples on all three statistics
      direction: different
      minimum_effect: >-
        p above 0.01 in at least 95 percent of cells. DISAGREEMENT IS A BLOCKING
        FINDING - it means the curve enters the auxiliary construction through an
        unmodelled channel, and every exponent claim in the auxiliary-ring family is
        suspended until the channel is identified. It would also be a genuine and
        surprising discovery about the arithmetic of curve orders.
    - metric: >-
        P5 - the recovered planted factor in POSITIVE CONTROL B, at five dialled values
        including n^{-1/6}
      direction: different
      minimum_effect: >-
        Recovered within 20 percent at all five values. Failure at n^{-1/6} means the
        instrument cannot see an effect the size of the exemplar's own gain, and NO
        closure may be reported from P1 - only an inconclusive.
    - metric: >-
        P6 - the decomposition of every reported deviation into its n-dependence and
        its M-dependence
      direction: different
      minimum_effect: >-
        Any deviation flat in n and decaying like M^{-1/2} is reported as a CONTROLLED
        NULL and not as structure, per docs/inventor-protocol.md section 3. This is a
        reporting rule, pre-registered, and violating it voids the interpretation.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, HALF A DAY). State HEUR-A, HEUR-B, HEUR-C formally with
      uniformity ranges, pre-register every band above, and write the artifact schema.
      STAGE 1 (HOURS, HARD GATE). Implement the samplers - Lagrange-Gauss coset
      reduction, integer factorisation of the norm, class-group ideal reduction - and
      run POSITIVE CONTROL A (the d = 1 closed form, exact) and POSITIVE CONTROL B (the
      planted sweep). Exact agreement on A and 20-percent recovery on B, or stop.
      STAGE 2 (HOURS, THE MEASUREMENT). Eight prime orders spanning three decades in
      the 17 to 30 bit band, four curves per order, five auxiliary parameters, 10^4
      sampled k per cell for P1 and P2 and 10^3 smooth alpha per cell for P3, with
      NULL-R, NULL-S, NULL-I and NULL-H on the identical estimators.
      STAGE 3 (HOURS). The (n, M) decay surfaces of P6 and the artifact adjudication;
      the parallel-rho and BSGS comparator columns on the identical instances in the
      identical charged units.
      STAGE 4 (ONLY IF A LEAD FIRES). Stop and route to independent review.
      NO ATTACK IS RUN. No discrete logarithm is solved except inside POSITIVE
      CONTROL B's planted calibration, where the scalar is known by construction and is
      emitted with a certificate that the harness toy-curve verifier re-checks
      independently. No live key, wallet, or deployed system.
    controls:
      - Parallel Pollard rho with distinguished points and negation on the identical instances, identical charged units (blocking matched control)
      - BSGS on the identical instances, memory reported (blocking matched control)
      - NULL-R random coset of the same lattice (blocking, same shape)
      - NULL-S sham modulus with no curve behind it (blocking, same shape, record-specific)
      - NULL-I matched random integer, smoothness arm (blocking)
      - NULL-H synthetic binomial, class arm (blocking)
      - POSITIVE CONTROL A, the d = 1 closed-form fixture (blocking)
      - POSITIVE CONTROL B, the planted-atypicality sweep including n^{-1/6} (blocking)
      - Static check that no measurement path reads k outside the coset constructor (blocking)
    required_metrics:
      - Empirical CDF of the normalised coset minimum per (curve, n, d) cell, machine-readable, with sample size and seed
      - Two-sample Kolmogorov-Smirnov statistics against NULL-R and NULL-S per cell
      - Empirical CDF of log(largest prime factor)/log N with the 500-smoothest zoom, per cell, against rho(u) and NULL-I
      - Tail consistency check in the exemplar's style, per cell
      - Principal fraction per (K, n) cell with sample size, against 1/h and NULL-H
      - Exactly computed h, Reg, disc per auxiliary field with software and version
      - Recovered planted factor per dialled value
      - The (n, M) decay surface for every reported deviation
      - Measured rho and BSGS costs on the identical instances, in charged units
      - Wall clock and peak memory per stage
      - Pass or fail of every blocking control

  falsification_conditions:
    - >-
      F1. POSITIVE CONTROL A fails - the d = 1 slice does not reproduce the closed-form
      uniform law or returns a principal fraction other than 1. Implementation failure;
      nothing is reported and no mathematical conclusion is drawn (AGENTS.md rule 3).
    - >-
      F2. POSITIVE CONTROL B fails at the n^{-1/6} calibration point. The instrument
      cannot see an effect the size of the exemplar's own gain. P1 may then return only
      INCONCLUSIVE, never a closure, and the record says so in advance so that a null
      cannot be upgraded after the fact.
    - >-
      F3. P4 fails - the sham modulus disagrees with the on-curve sample. THE FAMILY IS
      SUSPENDED. The auxiliary construction is not curve-independent as its derivation
      claims, and locating the channel becomes the priority over every cost claim.
    - >-
      F4. P1 fires the lead branch - curve-defined coset minima systematically below
