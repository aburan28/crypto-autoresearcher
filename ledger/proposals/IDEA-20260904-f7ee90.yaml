idea:
  id: IDEA-20260904-f7ee90
  question_id: RQ-ECDLP-002
  handoff_id: TASK-20260904-300a32
  goal_id: null
  added: '2026-09-04'

  title: >-
    THE ONE MEASUREMENT THAT DECIDES THE WHOLE AUXILIARY-RING FAMILY COSTS AN
    AFTERNOON AND SOLVES NO DISCRETE LOGARITHM - is the coset that an ECDLP instance
    cuts out of an auxiliary lattice atypical? Sample its minimum, its norm's
    smoothness, and its principal-split rate against three matched nulls, one of
    which is a SHAM MODULUS WITH NO CURVE BEHIND IT, and read the answer off a
    Kolmogorov-Smirnov statistic; a null result closes an infinite family on a
    measured ground, and the only outcome that would be a lead is exactly the
    rigorous-bound-beats-pigeonhole phenomenon the exemplar's whole method rests on

  class: control

  claim: >-
    (A) WHAT IS BEING TESTED, AND WHY IT IS THE CHEAPEST DECISIVE THING IN THE
    SESSION. IDEA-20260904-982159, IDEA-20260904-7caed1 and IDEA-20260904-7582ba
    together assert that an entire infinite family of ECDLP algorithms is pinned at
    n^{1/2+o(1)}. That assertion rests on exactly three heuristics and on nothing
    else, and NONE OF THE THREE REQUIRES SOLVING A DISCRETE LOGARITHM TO MEASURE -
      HEUR-A (coset typicality) - the fibre phi^{-1}(k) of the ring homomorphism has
      the same minimum-distribution as a uniformly random coset of the same lattice;
      HEUR-B (norm smoothness) - the norm of that minimum behaves like a uniformly
      random integer of its size with respect to B-smoothness, following
      Dickman-de Bruijn rho(u) after correction for the form's representability bias;
      HEUR-C (class equidistribution) - balanced prefixes of a smooth ideal are
      equidistributed in the class group, so the principal fraction is 1/h.
    THIS RECORD MEASURES ALL THREE SEPARATELY, which is step 1 of the validation
    ladder in docs/inventor-protocol.md section 6, and it is the step this program is
    recorded as most often skipping.

    (B) WHY IT IS NOT A SUBORDINATE CHECK BUT A PROPOSAL IN ITS OWN RIGHT. HEUR-A is
    the ECDLP analogue of the exemplar's Theorem 1.5. In the supersingular setting
    the true object is SMALLER than counting predicts - deg phi at most (p/2)^{1/3}
    against a pigeonhole value p^{1/2} - and that single inequality is the entire
    source of the p^{1/3} exponent. HEUR-A asserts that no such inequality holds for
    prime-field ECDLP. IT HAS NEVER BEEN MEASURED IN THIS PROGRAM OR, AS FAR AS THIS
    SESSION CAN ESTABLISH, ANYWHERE. A measured violation - curve-defined cosets
    systematically closer to the lattice than random ones by a factor n^{c} - would
    move the ECDLP exponent to 1/2 - c/2 through the criterion of
    IDEA-20260904-7caed1, with no new algorithm required. A measured confirmation
    closes an infinite family with a number and error bars instead of a verdict.
    BOTH BRANCHES ARE PUBLISHABLE INSIDE THIS PROGRAM AND NEITHER IS A NULL RESULT.

    (C) THE THREE NULLS, AND ONE OF THEM IS THE POINT. NULL-R, a uniformly random
    coset of the same lattice - the direct comparator for HEUR-A. NULL-S, THE SHAM
    MODULUS - the identical measurement with n replaced by a random prime of the same
    bit length that is NOT the order of any elliptic curve in the run set, and with
    delta a square root of -d modulo that prime. The construction contains no curve
    anywhere, so the sham and the on-curve measurements MUST agree; if they do not,
    the curve is entering through a channel the derivation does not model and every
    exponent claim in the family is suspended until the channel is found. NULL-I, a
    random integer of the matched size, for the smoothness arm only, which isolates
    the binary-form representability bias from any curve effect.

    (D) THE DECAY REQUIREMENT, WHICH IS THE ARTIFACT TELL. Any effect this record
    reports must behave correctly under the parameter that is supposed to destroy
    it. For HEUR-A the parameter is n - a genuine arithmetic effect in the coset
    should PERSIST or grow as n grows, while a finite-sample artifact must shrink like
    M^{-1/2} in the sample size and be flat in n. The record therefore reports every
    statistic as a two-dimensional surface in (n, M) rather than as a single number,
    and a deviation that moves with M and not with n is recorded as a CONTROLLED
    NULL, per docs/inventor-protocol.md section 3, and not as structure.

    (E) WHAT THIS RECORD DOES NOT DO. It runs no attack, builds no
    meet-in-the-middle table, and recovers no scalar except in the planted
    calibration. It therefore cannot confirm the cost formula of
    IDEA-20260904-982159 - only that record's own Stage 3 can - and it does not
    attempt to. Its scope is exactly the three heuristics.

  mechanism: >-
    THE TRACKED OBJECT is the triple (minimum norm of the instance-defined coset,
    largest prime factor of that norm, principal fraction among its balanced
    prefixes), followed across the parameters (n, d or K, sample size M). It is a
    lossy projection of the ECDLP instance - it retains three real numbers out of
    log2 n bits and the fibre over a triple is enormous - and it is lossy compatibly
    with the operation the measurement performs, namely RESAMPLING k, because all
    three coordinates are defined for every k and their joint distribution is what is
    being estimated. The test passes; but the record's honest position is that
    passing the test is NECESSARY and not sufficient, and that the informative
    question is whether the distribution differs from the null, not whether the object
    is well defined.

    HOW EACH QUANTITY IS COMPUTED WITHOUT SOLVING A DISCRETE LOGARITHM. The sampler
    CHOOSES k and constructs the instance, so the coset phi^{-1}(k) is available
    directly; the ECDLP is never solved and no attack is run. The coset minimum is
    computed by Lagrange-Gauss reduction in rank 2 and by LLL in the Minkowski
    embedding for higher rank, both polylog per sample. The norm of the minimum is at
    most about n^{5/3} at the top of the ladder, i.e. under 50 bits, and is factored
    completely by trial division and Pollard rho on INTEGERS (not on the curve). The
    principal fraction is computed by ideal reduction in the class group, polylog per
    prefix, with h computed exactly by standard class-group software. THE ENTIRE
    MEASUREMENT IS LATTICE AND INTEGER ARITHMETIC and the elliptic curve enters only
    to supply n - which is the record's own claim, and NULL-S is the control that
    checks it.

    THE PLANTED CALIBRATION, WHICH MAKES A NEGATIVE READABLE. Construct cosets with a
    DIALLED atypicality - shift a random coset so that its minimum is smaller than
    typical by a known factor f taking at least five values from 1 down to n^{-1/2} -
    and verify that the estimator recovers f. An instrument that cannot see a planted
    deficiency of known size cannot report its absence, and this is the single
    control that separates this record from an uncalibrated null result.

    STAGE STRUCTURE. Stage 0, zero compute - state the three heuristics formally with
    their uniformity ranges and pre-register the bands. Stage 1, hard gate - implement
    the samplers, run the planted calibration and the r = 1 degenerate fixture.
    Stage 2 - the three measurements over the full ladder with all three nulls.
    Stage 3 - the decay surfaces in (n, M) and the artifact adjudication. Stage 4,
    only if a lead fires - stop and route to independent review.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval EMPTY, not called. Screening by (i) the 255-title ECDLP dedup
      digest read in full; (ii) PD-1 greps over ledger/proposals for 'Dickman',
      'smooth', 'coset', 'Minkowski', 'class number', 'Brauer-Siegel',
      'imaginary quadratic order'; (iii) full reads of IDEA-20260901-b4e6eb and
      H-ECDLP-a4be60, both of which are validation-shaped records in adjacent cells and
      whose control discipline is adopted here; (iv) the target-result-profile section
      A7, which is the template this record follows.
    results: >-
      The corpus contains several heuristic-validation records - IDEA-20260802-004 on
      crypto-scale validation of a Dickman-type assumption for Semaev intermediates,
      IDEA-20260802-001 on repairing the saddle-point smoothness reference,
      IDEA-20260731-009 on sampling Semaev-shaped systems without solving ECDLP - but
      all of them validate smoothness heuristics for INDEX CALCULUS factor bases and
      summation-polynomial intermediates. None measures a coset minimum, none measures
      a principal-split rate, and none uses a sham-modulus null. IDEA-20260807-347a83
      records that every yield and smoothness band in the campaign is calibrated on ONE
      curve instance per cell and calls this the single largest declared hole; this
      record's ladder design is a direct response to that finding.
    verdict: >-
      UNVERIFIED. The measurement is elementary and its ingredients (Lagrange-Gauss,
      Dickman, class-group reduction) are textbook; the external novelty of measuring
      exactly this triple is unestablished, and the load-bearing external statements
      (Dickman-de Bruijn, Brauer-Siegel, the Gaussian heuristic) are `recalled`. Under
      AGENTS.md rule 9 no higher label is admissible. THE ACT THAT WOULD LICENSE A
      HIGHER LABEL - open a standard analytic number theory source for the Dickman
      function and the Gaussian heuristic and record the verification.

