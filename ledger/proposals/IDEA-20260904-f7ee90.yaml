  confounders:
    - >-
      One-instance-per-cell bias. IDEA-20260807-347a83 records this as the campaign's
      largest declared hole; the ladder uses four curves per prime order specifically
      to avoid repeating it, and any cell that ends up with fewer must be reported as
      such rather than pooled.
    - >-
      Toy-scale Dickman. Below 2^30 the smooth-number asymptotic has not set in and
      rho(u) is a poor absolute predictor; that is why the primary smoothness
      comparison is against NULL-I (matched random integers) rather than against rho(u)
      directly, and rho(u) is reported as a secondary reference only.
    - >-
      Estimator degeneracy at small M. The Kolmogorov-Smirnov statistic on 10^4 samples
      can detect only shifts above about 1.5 percent; a genuine effect smaller than
      that is invisible and the record must report its minimum detectable effect per
      cell rather than claiming absence.
    - >-
      Class-group software conditionality. Regulators and class numbers for higher-degree
      fields are often GRH-conditional; every value must carry the software's own flag
      and a GRH-conditional cell makes its conclusion GRH-conditional.
    - >-
      The sampler knows k. The static provenance gate is blocking; only the coset
      constructor may read it.
    - >-
      Seed reuse across nulls. NULL-R, NULL-S, NULL-I and NULL-H must use independent
      seeds from the on-curve arm, recorded, or the comparison is between correlated
      samples.

  interpretation_limits:
    - >-
      THIS RECORD VALIDATES HEURISTICS, NOT A COST FORMULA. No conclusion about any
      algorithm's exponent may be drawn from it alone; that requires
      IDEA-20260904-982159's own Stage 3.
    - >-
      A closure branch closes the DECLARED LADDER on the TESTED toy family. It does not
      close the auxiliary-ring family at cryptographic n and no extrapolation is
      licensed.
    - >-
      A lead branch is a MEASURED distributional statement, not a theorem. The
      criterion it feeds requires a rigorous bound, and a sample median is not one.
    - >-
      Every external distributional statement here is `recalled`. The comparisons
      against rho(u) and against the Gaussian heuristic are only as good as those
