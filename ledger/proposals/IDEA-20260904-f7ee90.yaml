    - >-
      No disposition, status change or approval is made or implied.

  heuristic_assumptions:
    - id: HEUR-A
      statement: >-
        For a prime n, an auxiliary order O with a ring homomorphism phi onto Z/n, and
        k uniform in Z/n, the normalised minimum of the coset phi^{-1}(k) has the same
        distribution as that of a uniformly random coset of ker(phi), uniformly over
        curves of order n and over the tested range of auxiliary parameters.
      rigorous_support: >-
        The rigorous half is Minkowski's convex body theorem, which bounds the minimum
        from above unconditionally; the classical distribution statement imitated is the
        Gaussian heuristic for a random coset, explicit in rank 2. THE LOWER BOUND IS
        NOT AVAILABLE and the exemplar's setting is a known counterexample to the
        analogous assertion, which is precisely why this is measured and not assumed.
      validation_plan: >-
        SAMPLE - 10^4 draws per cell over 8 prime orders x 4 curves x 5 auxiliary
        parameters; minima by Lagrange-Gauss (rank 2) or LLL in the Minkowski embedding
        (higher rank), polylog per sample, NO discrete logarithm solved. SHORTCUT
        MAKING SAMPLING FEASIBLE - the sampler chooses k, so the coset is available
        directly; this is the analogue of the exemplar's use of the Deuring
        correspondence and it lets the heuristic be validated at sizes far above where
        the attack could run. COMPARISON DISTRIBUTION - NULL-R by two-sample
        Kolmogorov-Smirnov, and the closed-form rank-2 Gaussian heuristic where
        available. TAIL CHECK - the smallest on-curve minimum across all cells against
        the smallest over equally many NULL-R replicates. RECORDED PARAMETERS - curve
        coefficients, p, n, d or K, delta, k, seed, M. TRANSFER ASSUMPTION, STATED -
        validated at 17 to 30 bits only; the transfer to cryptographic n is an EXPLICIT
        EXTRAPOLATION recorded as unjustified.
    - id: HEUR-B
      statement: >-
        N(alpha_min) is B-smooth with the probability of a uniformly random integer of
        its size, after the form-representability correction that NULL-I shares -
        formally, the distribution of log(largest prime factor)/log N is that of a
        random integer of the same size conditioned on being represented by the same
        quadratic form, uniformly over the ladder.
      rigorous_support: >-
        The rigorous half is the Canfield-Erdos-Pomerance count of smooth integers
        (recalled); the classical distribution theorem imitated is Dickman-de Bruijn
        rho(u). THE KNOWN SLACK IS STATED - values of a binary quadratic form represent
        only integers whose prime factors split or ramify, an n^{o(1)} effect already
        carried in the cost formula, and NULL-I is the control that separates it from
        any curve effect.
      validation_plan: >-
        SAMPLE - 10^5 fully factored norms per cell (at most about 50 bits at the top
        of the ladder, so complete factorisation is cheap). COMPARISON - empirical CDF
        against NULL-I primarily and against rho(u) secondarily, with the 500-smoothest
        zoom of the exemplar's section 4.2. TAIL CHECK - the smoothest observed sample
        against the predicted rho(u), consistency in the exemplar's sense (within a
        factor 4 of 1/M). RECORDED - n, d or K, Y, B, seed. TRANSFER ASSUMPTION - toy
        scale only; the Dickman regime is not reached and rho(u) is a reference, not a
        predictor, below 2^30.
    - id: HEUR-C
      statement: >-
        Balanced prefixes of a B-smooth ideal are equidistributed in the class group,
        so the principal fraction is 1/h, uniformly over the tested fields and
        smoothness bounds.
      rigorous_support: >-
        The rigorous half is that split prime ideals of norm at most B generate the
        class group and equidistribute by Chebotarev; the imitated statement is that a
        product of omega independent uniform class elements is uniform for omega of
        order log h. THE PREFIXES OF ONE alpha ARE NOT INDEPENDENT, the composition is
        unwritten in this program, and HEUR-C is therefore the heuristic with the
        largest chance of being false - which is why P3's lead branch is flagged as the
        most consequential negative in the session.
      validation_plan: >-
        SAMPLE - 10^3 smooth alpha per cell, all 2^omega balanced prefixes reduced and
        classified; observed principal fraction against 1/h. SHORTCUT - class-group
        arithmetic is polylog and h is computable exactly up to |disc| about 2^40, far
        past the attack's reach; this is the second place the record validates an
        assumption at a scale the algorithm cannot reach. COMPARISON - NULL-H,
        binomial(2^omega, 1/h). TAIL CHECK - the maximum observed principal fraction
        over all cells against the maximum over equally many NULL-H replicates.
        RECORDED - K, h, Reg, disc, B, omega, seed. TRANSFER ASSUMPTION - |disc| at
        most 2^40 and degrees 2 to 4 only.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE CAN BE - no attack is run. The MEASUREMENT
      costs O(M * (log^3 n + F(Y) + 2^omega * log^2 |disc|)) bit operations per cell,
      where F(Y) is the cost of factoring a 50-bit integer; that is a property of the
      instrument and not of any algorithm. IF the P1 lead branch fired at deficiency
      n^{-c}, the implied exponent through IDEA-20260904-7caed1 would be 1/2 - c/2, and
      that is stated as a conditional consequence of another record and not as a claim
      of this one.
    memory_exponent: >-
      O(M) samples in memory per cell, a few hundred megabytes at the top rung. A
      property of the measurement. The object under test supplies no table, no
      distinguished-point structure and no precomputation, so there is no time-memory
      tradeoff to state for it.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map at about
      0.886 sqrt(n) group operations with small per-processor memory (KN-TECH-006,
      second-hand); BSGS at 2 sqrt(n) time and sqrt(n) memory; Pohlig-Hellman fixing n
      as the largest prime factor (KN-TECH-030). Both are run as matched controls on
      the same instances even though this record mounts no attack, so that the numbers
      it produces are comparable to every cost claim that will cite them.
    hidden_overhead: >-
      None hidden - the measurement's cost is explicit and polynomial. The o(1) terms
      that the record's SUBJECT (the cost formula) hides are exactly what the three
      heuristics are, and measuring them is the point.
    tradeoff_note: >-
      Exactness is bought with sample size, and the Kolmogorov-Smirnov minimum
      detectable effect scales like M^{-1/2}; extending the ladder in n is cheap
      (polylog per sample) while extending it in |disc| is capped by exact class-number
      computation near 2^40. Those two caps are design constraints, declared in
      advance, not oversights. The measurement parallelises perfectly across cells.

