idea:
  id: IDEA-20260809-66ef77
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    One cost function, many switches: reproduce every published CSIDH figure
    from its own assumptions before commenting on any of them
  class: representation
  claim: >-
    The published analyses can be expressed as settings of a common parameterized
    cost function whose switches are the oracle cost model, the memory model, the
    Kuperberg variant and its parameters, and the depth limit. The claim is that
    each published figure is recoverable from its own switch setting within a
    declared tolerance, and that any figure that is NOT recoverable identifies
    either an assumption the paper did not state or a modelling element the common
    function cannot express — both of which are findings about the dispute's
    structure.
  mechanism: >-
    Implement the common function with switches; extract each paper's stated
    assumptions into a switch setting; evaluate; compare with the paper's own
    number under a pre-registered tolerance.
  why_not_a_renamed_known_approach: >-
    Surveys compare published numbers side by side. Expressing them as evaluations
    of ONE function is different in kind: it forces every difference to appear as
    a named switch or as an inexpressibility, which is precisely the diagnosis the
    goal needs.
  predictions:
  - observable: reproduction outcome per published analysis
    metric: ratio to published figure against the pre-registered tolerance
    predicted: >-
      At least two of three reproduce; at least one does not. A universal
      reproduction would mean the dispute is entirely in the switch values, which
      would be the cleanest possible outcome and is the hypothesis to beat.
  - observable: number of switches needed to express all analyses
    metric: integer
    predicted: Small -- under ten. A large number would mean the analyses do not share a common structure, which is itself the answer to the goal's question.
  minimal_test: >-
    Three analyses, switch settings extracted with passage citations, tolerance
    pre-registered, function evaluated, outcomes reported including
    inexpressibilities.
  controls:
  - 'PRE-REGISTERED TOLERANCE, committed before evaluation.'
  - 'PASSAGE CITATION for every switch value; an uncited switch value is an assumption of this program and is labelled as such, not attributed to the paper.'
  falsification_conditions:
  - No analysis reproduces, indicating the common function is wrong.
  - Switch extraction is impossible for a majority of analyses, in which case the goal's pause condition on primary text applies.
  interpretation_limits: >-
    Reproducing a figure validates this program's reading of a paper, not the
    paper's correctness. No analysis is endorsed or rejected.
  sota_delta: 'No verdict. Delta: a common representation in which the disagreement can be located rather than described.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; acquisition-dominated.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for switchable cost model: no records. WEB NOT CHECKED.'
  source_refs:
  - The three or more primary CSIDH quantum analyses -- RECALLED, REQUIRED READS, NOT LOCATED.
