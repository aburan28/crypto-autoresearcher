idea:
  id: IDEA-20260922-fac3e7
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Special-model locus versus a generic classmate
  class: measurement
  claim: >-
    On one toy ordinary F_p-isogeny class that contains both a special-model
    curve and a generic classmate, measure the degree-capped new_falls
    profile of IDEA-20260916-4b7c1e on the locus and on one generic floor
    curve in that same class. The locus is a curve with a = 0, or b = 0, or
    full rational 2-torsion (so a Legendre or Montgomery model exists). The
    generic classmate has ab != 0 and does not have full rational 2-torsion.
    The attack stage is relation decomposition only, in an R1 coordinate
    representation. The gauge orbit of the locus j is measured as well, so a
    change of Weierstrass model is not mistaken for an isogeny change. This
    record does not claim that j = 0 or j = 1728 is easier; that is the
    question under test. If only the locus stays at its first fall while the
    generic classmate has d_lf_obs >= d_ff + 1, the reading is O2 of
    RQ-DREG-c8ae8d, and the walk is the path from the generic curve to the
    locus, which this proposal does not charge. If the locus also has
    d_lf_obs >= d_ff + 1, the hypothesis "walk to a special model" is
    falsified on that class. An unfinished matrix is neither reading.
    IDEA-20260807-8b9486 and IDEA-20260811-fe0934 locate the locus. This
    record measures the fall profile on it.
  mechanism: >-
    Object frame. Representation: R1, the field representation of (a, b)
    and of the x-coordinates in S_3. Attack stage: relation decomposition
    only. Operation set Sigma: Macaulay multiplication by monomials up to
    one frozen degree cap. Sigma is not the translation action. Trichotomy
    class of IDEA-20260806-c5d183: coordinate-dependent, because a locus
    defined by vanishing of (a, b) or by rational 2-torsion is a fact about
    the model, and the fall profile is a fact about the presentation.
    The projection discards the discrete logarithm, the point, and the
    endomorphism ring, and retains the new_falls vectors of the locus
    curve, of its gauge orbit, and of one generic floor curve. Those
    integers are lossy and are not a propagating attack object. Which
    volcano level the locus occupies is recorded as data. It is not
    assumed from a general theorem. IDEA-20260811-fe0934 gives that
    partition for one committed class only; this proposal does not extend
    that partition. Shared instrument: new_falls, d_ff, and d_lf_obs from
    IDEA-20260916-4b7c1e, same cap and the same factor-base rule on the
    locus and on the generic curve. S_3 is the system. S_4 is included
    only if both curves finish at the same cap. F2 is the component being
    measured. F6 (automorphism orbit at j = 0 or j = 1728) is a confounder
    to record, not the lens: an automorphism discount on point counting is
    not a fall-profile change.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: Fall-profile instrument applied to the locus and to one generic classmate. Not redefined.
      verified_by: idea-generator, lines 1-200 read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        O2 is variation only on a named locus, with the walk charged.
        This proposal measures that locus and names the walk without
        charging it.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260807-8b9486
      provenance: internal
      claim: >-
        The support of S_3 depends on the vanishing pattern of (a, b),
        constant for ab != 0, and different at a = 0 and at b = 0.
        That locates a support locus. It does not measure new_falls.
      verified_by: idea-generator, claim opening read 2026-09-22
    - ref: IDEA-20260811-fe0934
      provenance: internal
      claim: >-
        On one committed class, Legendre versus Edwards availability is
        partitioned by the 2-volcano. That locates which models exist.
        It does not measure a fall profile, and its partition is not
        used as a general fact.
      verified_by: idea-generator, claim opening read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: Coordinate-dependent trichotomy class.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R1 field representation; relation-decomposition stage.
      verified_by: idea-generator, title and scope opening read 2026-09-22
    - ref: IDEA-20260807-6eb96b
      provenance: internal
      claim: >-
        Gauge orbit of one j: many Weierstrass models, one curve. Used
        as the null for the locus j.
      verified_by: idea-generator, claim opening read 2026-09-22
    - ref: RQ-ICINV-475b5e
      provenance: internal
      claim: Parent question. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-DREG-bd6c86
      provenance: internal
      claim: Parent question. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: Parent question on volcano depth. Level is a recorded covariate here.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-ECTD-001
      provenance: internal
      claim: Parent question. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
  assumptions:
    - >-
      The class is chosen because it contains at least one locus curve and
      one generic floor curve. A class with no locus curve returns the
      label locus-absent and does not support O2.
    - >-
      Full rational 2-torsion means x^3 + a x + b splits into three linear
      factors over F_p. That is an exact arithmetic check, not a model
      advertisement.
    - >-
      IDEA-20260807-427cf3 is not assumed. Locus and generic curve are
      compared at the same factor-base cardinality.
    - >-
      F6 may be present at j = 0 or j = 1728. If the locus is one of those
      j-invariants, the automorphism group order is recorded and is not
      interpreted as a fall-profile effect.
  proof_search_map:
    bottleneck: >-
      Uncomputable degree of regularity and unfinished F4. The measurement
      is the capped fall profile on two curves and one gauge orbit.
    baseline_embedding:
      parameter_slice: >-
        Single-curve new_falls profile of IDEA-20260916-4b7c1e on the
        generic floor curve, which is the baseline the locus must beat
        or match.
      reproduction_check: >-
        Rank identity on the generic curve at every completed degree,
        repeated on the locus curve.
    observation_collision:
      observable: new_falls vector
      distinct_preimage_search: >-
        The locus curve and any gauge model of its j must collide. The
        locus curve and the generic floor curve are the pair that is
        allowed to differ. A difference inside the gauge orbit voids the
        comparison.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The Semaev presentation specialized to the locus (a = 0, or
          b = 0, or full rational 2-torsion), packed against the profile
          of one generic floor curve in the same class and against the
          gauge orbit of the locus j.
        predicted_gain: >-
          Accepts O2 or falsifies "walk to a special model" on that
          class. No ECDLP exponent gain.
    quantifier_order: >-
      There exists a toy class containing a locus curve L and a generic
      floor curve F. For all gauge models of j(L), the new_falls vector
      equals the vector of L. O2 on this class: d_lf_obs(L) = d_ff(L)
      and d_lf_obs(F) >= d_ff(F) + 1. The negation, which falsifies the
      walk hypothesis here: d_lf_obs(L) >= d_ff(L) + 1. Both quantifiers
      range only over degrees whose matrices finished.
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy-tier statement that on the tested class the special-model
        locus does, or does not, keep a bounded fall profile while a
        generic classmate's lower bound rises. Not a claim that those
        j-invariants are easier in general.
      nearby_object_control: >-
        The gauge orbit of j(L). A non-isogenous curve of the same order
        with the same vanishing pattern, if one exists at the same p, is
        the nearby object on which an isogeny-class reading would be
        false: the pattern would be the coefficients, not the class.
    proof_obligations:
      - claim: >-
          A locus-versus-floor gap is reported as O2 only when the gauge
          orbit of j(L) reproduces L's new_falls vector exactly.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: locus_versus_floor_fall_gap
      direction: different
      minimum_effect: >-
        On one class that contains both curves, exactly one label.
        O2-on-class: the locus has d_lf_obs = d_ff and the generic floor
        curve has d_lf_obs >= d_ff + 1, and the gauge orbit of the locus
        j matches the locus vector. Falsified-on-class: the locus has
        d_lf_obs >= d_ff + 1. Matched: both stay at the first fall, which
        is not O2 and does not say the locus is easier. Unmeasured: either
        matrix fails to finish. locus-absent: the class has no such locus.
        A gap of 1 in the certified lower bound is the minimum split; a
        smaller gap is not a difference.
    - metric: gauge_orbit_of_locus_hamming
      direction: lower
      minimum_effect: >-
        Hamming distance 0 between the locus vector and at least four
        gauge models. Any positive distance blocks the O2-on-class label.
  minimal_test:
    design: >-
      Select one ordinary toy class that contains a curve with a = 0, or
      b = 0, or full rational 2-torsion, and a curve with ab != 0 and
      without full rational 2-torsion. Record the volcano level of each
      as data. If the first class drawn has no locus curve, record
      locus-absent and draw another class that has one; do not drop the
      absent class from the report. Compute S_3 new_falls on the locus,
      on four gauge models of its j, and on the generic curve, at one
      frozen D_max. Assign the label in the prediction.
    controls:
      - Gauge orbit of the locus j.
      - >-
        Support-matched random system with the same monomial support as
        the locus S_3. A fall that appears there is a support effect.
      - Same factor-base cardinality on the locus and on the generic curve.
      - >-
        If the locus is j = 0 or j = 1728, record |Aut| and do not add it
        into the fall profile.
    required_metrics:
      - new_falls, d_ff, and d_lf_obs on the locus and on the generic curve
      - gauge Hamming distance
      - volcano level of each curve, as data
      - the assigned label
      - whether the locus was a = 0, b = 0, or full rational 2-torsion
  falsification_conditions:
    - >-
      The locus has d_lf_obs >= d_ff + 1. "Walk to a special model" is
      falsified on that class. This is a successful negative.
    - >-
      The gauge Hamming distance is positive. No O2 label is issued.
    - >-
      The generic curve's matrix does not finish. The comparison is
      unmeasured. The unfinished run is not evidence the generic curve
      explodes.
    - >-
      Both profiles stay at the first fall. The locus is not easier on
      this proxy. That is not O2.
  confounders:
    - Treating support sparsity at a = 0 or b = 0 as a fall-profile drop without computing new_falls.
    - Gauge model of the locus compared with a different j.
    - Factor-base size changing because the x-coordinate set changed.
    - Reading |Aut| > 2 as an algebraic-degree advantage.
    - Using IDEA-20260811-fe0934's one-class 2-torsion partition as if it held for the new class.
    - Volcano level correlated with the locus because of how the class was chosen, then quoted as a cause.
  interpretation_limits:
    - >-
      KN-OPEN-020: no new factor base. Same already-scoped rule on both
      curves.
    - >-
      O2-on-class does not charge the walk. The path length in rational
      ell-isogenies from the generic curve to the locus is recorded and
      left unpaid. Paying it is future work, and only if this label
      survives IDEA-20260922-f7de2a.
    - >-
      j = 0 and j = 1728 are not declared easier. A positive result is a
      fall-profile gap on the tested class.
    - Flat profile does not prove a small solving degree above the cap.
    - Toy tier only. ECDLP exponent delta is zero.
    - >-
      This is not a census of the whole class. Off-locus outliers away
      from the generic floor curve are IDEA-20260922-805a59's question.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Inside the cap, d_lf_obs tracks whether the solving degree is
        growing on this family. This is not the Petit-Quisquater
        first-fall-degree assumption. A flat profile does not prove the
        solving degree is small above the cap.
      rigorous_support: >-
        none; this is the hypothesis under test. The exact rank identity
        is IDEA-20260916-4b7c1e and is not a theorem about the solving
        degree above the cap.
      validation_plan: >-
        On the generic floor curve, if degree-by-degree elimination
        finishes by D_max, compare its highest degree with d_lf_obs.
        Disagreement by 1 or more falsifies H1 on that curve. Repeat the
        rank-identity check on the locus curve. Parameters: one toy
        class containing the locus, p small enough that both profiles
        finish. No transfer to cryptographic size. Tail check: a flat
        locus profile is not reported as a solving degree bounded for
        D > D_max.
  target_complexity:
    time_exponent: N^{1/2} for the ECDLP. No improvement is claimed.
    memory_exponent: >-
      O(1) for rho. The meter stores a handful of capped Macaulay
      matrices, not a class census.
    best_known: >-
      Pollard rho, time N^{1/2}, memory O(1). For the meter, one
      degree-capped rank profile, paid on the locus, its gauge orbit,
      and one generic curve.
    hidden_overhead: >-
      The unpaid walk to the locus. Naming it is not charging it. No
      o(1) attack term is claimed.
    tradeoff_note: >-
      Far smaller than a class census. Still not a rho tradeoff. An O2
      gap does not become an attack until the walk and the syzygy gate
      are paid.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time, memory, and
    queries. As a measurement of the locus, IDEA-20260807-8b9486
    dominates the support question and does not measure falls, and
    IDEA-20260811-fe0934 dominates model-availability on its one class
    and does not measure falls. On the fall-profile axis this record is
    undominated by those two. A full-class census (IDEA-20260922-805a59)
    dominates this record on coverage and is more expensive; this record
    is the cheaper test of the special-model hypothesis only. Attack
    papers beyond rho were not surveyed.
  sota_delta: >-
    ECDLP time-exponent delta 0. Memory-exponent delta 0. Query delta 0.
    Relative to a support count, the added observable is the capped
    new_falls vector on the locus and on one classmate.
  discriminated_from: >-
    IDEA-20260807-8b9486 proves, inside that proposal, that the support
    of S_m depends on vanishing of (a, b). This record does not recompute
    that support. It asks whether the fall profile on that locus stays
    at the first fall while a generic classmate's lower bound rises.
    IDEA-20260811-fe0934 shows, on one class, that Legendre and Edwards
    models sit at complementary volcano levels. This record does not
    re-derive which models exist. It measures new_falls where a model
    locus is present.
    IDEA-20260731-016 is a heavy-tail screen with full solvers.
    IDEA-20260807-427cf3 is not assumed.
    IDEA-20260807-6eb96b is the gauge null used on the locus j.
    IDEA-20260807-f6137c: degree of regularity is not computed.
    IDEA-20260807-899c5e: reduced-basis degree is not the metric.
    IDEA-20260826-2259f8 asks whether special j lowers the first fall
    against a random curve at the same p. This record's null is a
    generic curve in the same isogeny class, and the observable is the
    whole capped profile, including a rising lower bound.
    IDEA-20260903-47f358 looks for any lower first fall in a class,
    with pre-registered constancy off j in {0, 1728}. This record does
    not assume that constancy; it tests the locus against an explosion
    on a classmate.
    IDEA-20260916-4b7c1e is the instrument.
    IDEA-20260901-2fb77b counts fibrations. This record may record a
    level and does not count them.
    Parent questions are cited and not restated.
