idea:
  id: IDEA-20261006-576825
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Root counts of two explicit degree-4 polynomials differ over F_1031
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. The objects are two polynomials in one
    variable, written as the usual 3-division shape on two short
    Weierstrass models. The attack stage is a root count, not a
    collision search and not an ideal-degree computation. The
    discrete-log exponent versus Pollard rho stays 1/2. Let p = 1031.
    Let f1 = 3x^4 + 6x^2 + 12x - 1 and
    f3 = 3x^4 + 6x^2 + 36x - 1 in F_p[x]. These are the polynomials
    3x^4 + 6 A x^2 + 12 B x - A^2 at (A, B) = (1, 1) and (1, 3). The
    curves y^2 = x^3 + x + 1 and y^2 = x^3 + x + 3 have discriminants
    31 and 247, neither 0 in F_p. 1031 is prime. Let R1 be the number
    of distinct roots of f1 in F_p, and R3 the same count for f3.
    The claim is that |R1 - R3| is at least 1. The concrete negative
    is that both polynomials are exactly those two, every reported
    root evaluates to 0, and R1 = R3. A count above 4 voids the
    instrument. This is not an FGLM degree, not a count of unknowns
    in a rescaled quotient, and not the product of two x-coordinates.
  mechanism: >-
    OBJECT FRAME. The representation is a univariate polynomial of
    degree 4. The operation is evaluation at field elements. The
    predicate is "the value is 0". Two nearby coefficient vectors,
    differing only in the linear term 12 B, can have different
    numbers of roots. That difference is the whole claim. LOSSY-PROJECTION
    TEST. The projection keeps the root count and discards the roots
    and any point that might sit above a root on the cubic. Many
    polynomials share a count. The projection is lossy. Families of
    factor bases are not the lens. No summation polynomial is built.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question includes rational torsion as a known-true shape
        of coordinate information. This record counts roots of two
        explicit polynomials and does not claim that a root is a
        discrete log.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need Omega(sqrt(p)) group
        operations. A root count of a degree-4 polynomial does not
        move that exponent.
      verified_by: >-
        design session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: Silverman, The Arithmetic of Elliptic Curves, 3-division polynomial
      provenance: recalled
      claim: >-
        The 3-division polynomial on y^2 = x^3 + A x + B is recalled
        as 3x^4 + 6 A x^2 + 12 B x - A^2. The book was not opened.
        The polynomials f1 and f3 are frozen as written, so a
        different printed formula would not change the bytes of this
        test.
      verified_by: null
  assumptions:
    - 1031 is prime. It was checked with sympy.isprime in this session.
    - Discriminant 31 of y^2 = x^3 + x + 1 and discriminant 247 of y^2 = x^3 + x + 3 are both nonzero in F_1031. Both were reduced in this session.
    - A root is a field element r with f(r) = 0. Distinct means distinct as field elements. Multiplicity is not counted twice.
    - The degree of each polynomial is 4 because the leading coefficient 3 is not 0 in F_1031.
  proof_search_map:
    not_applicable_reason: >-
      This is one comparison of two root counts in a field of 1031
      elements. It is not a proof about torsion fields in general.
    bottleneck: >-
      The absolute difference |R1 - R3|. Equality is the negative.
      The difference is not an exponent.
    baseline_embedding:
      parameter_slice: p = 1031, f1 and f3 as written
      reproduction_check: >-
        Each reported root is substituted into the polynomial. A
        nonzero value voids the cell. The search visits every field
        element, so a missed root is an incomplete scan and voids
        the cell.
    observation_collision:
      observable: the unordered pair of root counts
      distinct_preimage_search: >-
        Equal counts are one observable. The same count can come from
        different root sets. The claim is about the counts, not about
        the sets being equal.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the two coefficient pairs (A, B) = (1, 1) and (1, 3)
        predicted_gain: >-
          The root counts differ by at least 1, or the record reports
          that they do not.
    quantifier_order: >-
      Exists these two polynomials over this one field such that the
      root counts differ. Not for all primes and not for all cubics.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two integers R1 and R3. They do not certify that a root
        lifts to a point of order 3, and they do not certify a
        discrete logarithm.
      nearby_object_control: >-
        The same scan on the polynomial x^4, whose only root is 0,
        must return the count 1. Any other count voids the instrument.
        That control polynomial is not f1 or f3.
    proof_obligations:
      - claim: R1 and R3 are counts of distinct roots, each checked by evaluation, and neither count exceeds 4.
        responsibility: correctness
  predictions:
    - metric: absolute difference of the two root counts
      direction: different
      minimum_effect: at least 1
  minimal_test:
    design: >-
      For each of f1, f3, and the control x^4, evaluate at every
      element of F_1031 and count the distinct zeros. Reject the cell
      if the control count is not 1, if either degree is not 4, or if
      a reported root fails evaluation.
    controls:
      - >-
        Control polynomial x^4 has exactly one root in F_1031. Any
        other count voids the instrument.
      - >-
        Evaluation control: every reported root satisfies the
        polynomial. One failure voids the cell.
      - >-
        Degree control: the leading coefficient 3 is not 0, so a scan
        that reports five or more roots is void.
      - >-
        Curve control: both discriminants are recomputed. A zero
        discriminant leaves the cell unmeasured. The root count is
        still of the polynomial, not of points on the curve.
    required_metrics:
      - R1 and R3
      - absolute difference of R1 and R3
      - the root count of x^4
  falsification_conditions:
    - The instrument checks pass and R1 equals R3. That equality is the negative.
    - The control polynomial x^4 does not have exactly one root. The instrument is void.
    - Either discriminant is 0. The cell is unmeasured.
  confounders:
    - >-
      A root of f1 need not be the x-coordinate of an affine point.
      The claim does not lift roots to points. A later protocol that
      counts only roots which are x-coordinates is a different count.
    - >-
      IDEA-20260805-bb4bf8 uses p = 1031 for a supersingular mass.
      That mass is not a root count of f1 or f3.
    - >-
      Equal counts do not mean equal root sets. The negative is about
      the counts.
  interpretation_limits:
    - A nonzero difference is two polynomials over one field of 1031 elements. It is not a torsion-field theorem and not a discrete logarithm.
    - The exponent delta versus Pollard rho is 0.
    - This record does not restate an FGLM degree of 16, a count of four unknowns, the product of translated x-coordinates, or the y-axis prefix census.
    - The recalled division-polynomial formula is not support. The frozen polynomials are the ones written above.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A monic degree-4 polynomial over a prime field, conditioned
        on having the shape 3x^4 + 6 A x^2 + 12 B x - A^2 with
        A fixed and B in {1, 3}, has a root count whose distribution
        is not concentrated on a single integer. The claim tested
        here is only that these two particular counts are not equal.
      rigorous_support: >-
        A nonzero polynomial of degree 4 has at most 4 roots. That is
        the proved bound. The distribution over this two-point family
        is not a theorem. No random model of all degree-4 polynomials
        is being sampled. The family has size 2.
      validation_plan: >-
        Evaluate both polynomials on every element of F_1031 and
        compare the counts. The control x^4 must return 1. Equality
        of R1 and R3 falsifies the difference on this pair. A timeout
        does not. No third coefficient B is added after the counts
        are seen.
  target_complexity:
    time_exponent: >-
      The scan is Theta(p) field operations for a degree-4 polynomial.
      The discrete-log exponent stays 1/2. Delta versus Pollard rho
      is 0.
    memory_exponent: O(1) beyond the running count.
    best_known: Pollard rho at Theta(N^{1/2}) group operations, KR-RHO-13bf67.
    hidden_overhead: No o(1) attack term. No Gröbner basis is computed.
    tradeoff_note: >-
      No time-memory tradeoff. A root count is not a collision search.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this scan is dominated by Pollard rho.
    KR-RHO-13bf67, KR-RHO-fb88e6, KR-RHO-cd86f5, KR-RHO-6239aa, and
    KR-RHO-6654ba were opened. None of those rows states R1 - R3 for
    these two polynomials. They dominate any reading of the counts as
    an attack. They do not dominate the integer comparison.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. The
    scan costs Theta(p) evaluations and returns one integer
    difference of root counts, not a logarithm.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-cd86f5
      - KR-RHO-6239aa
      - KR-RHO-6654ba
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          Time-exponent delta versus Omega(sqrt(p)) is 0. The new
          integer is |R1 - R3| for two degree-4 polynomials, which
          that row does not define.
      - ref: KR-RHO-6654ba
        provenance: internal
        relation: orthogonal
        delta: >-
          Point halving replaces addition steps on binary curves.
          This record is a prime-field root count. No halving step is
          used. The exponent delta is 0.
      - ref: KR-RHO-6239aa
        provenance: internal
        relation: orthogonal
        delta: >-
          Distinguished points store a collision search. This scan
          stores a counter. The memory delta versus that row, in
          stored points, is the whole distinguished-point table.
    searched:
      corpus_grep:
        - >-
          Proposals on origin/main bound to RQ-ECDLP-4fcbd3 were
          listed by title and claim. None compares these two root
          counts.
        - >-
          PR 1953 files the m = 3 rescaled quotient, an FGLM degree
          of 16, and the product x(P+T)*x(P) = b. This record is none
          of those.
        - >-
          IDEA-20260805-bb4bf8 mentions p = 1031 as a supersingular
          mass. The search hit the prime. The polynomial here is a
          different object.
