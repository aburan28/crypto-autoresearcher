        IDEA-20260818-f8dc30.
      verified_by: null
    - ref: 'https://eprint.iacr.org/2026/1450.pdf'
      provenance: recalled
      claim: >-
        "Optimizing Polynomial Multiplication and Fixed-Weight Sampling for HQC
        on ARM" -- evidence that multiple sampler IMPLEMENTATIONS are in
        circulation, which matters because Delta is a property of the
        implementation, not of the specification. Surfaced in a WebSearch
        result list; not opened.
      verified_by: null

  assumptions:
    - >-
      The attacker knows which sampler version and implementation generated the
      target key. For a standardized KEM this is realistic (spec version is
      negotiated / implied by the deployment) but it IS an assumption and a
      wrong guess costs the whole gain.
    - >-
      The bias, if any, is in the SUPPORT distribution over positions, not only
      in timing. A sampler can be constant-time and still output a non-uniform
      support; conversely a biased-but-secret-independent artifact gives no
      gain. The measurement distinguishes these.
    - >-
      Delta is claimed for the deployed instance distribution, NOT for uniform
      quasi-cyclic syndrome decoding. See interpretation_limits.

  object_first_framing:
    established_families_declared_off_limits_as_primary_lens:
      - Grover-Prange and quantum-walk BJMM as ALGORITHMS (this record changes
        only the initial state, not the algorithm).
      - The five prior objects of TASK-20260813-9f7a4a, all structural.
      - Timing / side-channel leakage of the sampler, which is a different
        claim class and is walled off from this RQ.
    tracked_object: >-
      THE SUPPORT DISTRIBUTION D ITSELF, compressed to its RENYI-1/2 DEFICIT
      relative to the uniform fixed-weight distribution -- a single real number
      per parameter set per sampler version, together with its per-position
      marginal vector and pair-correlation matrix.
    lossy_projection_test: >-
      PASSES. The projection sends a support set S (an element of a space of
      size C(2n,2w) = 2^{1064} at HQC-128) to a real number Delta and to a
      2n-vector of marginals: it discards essentially everything about the
      individual instance and retains only an ensemble statistic. That the
      projection is lossy is obvious; the non-obvious half of the test is
      COMPATIBILITY, and it holds for the specific reason that amplitude
      amplification's cost depends on the initial state ONLY through the
      squared overlap with the marked subspace, and that overlap is an
      expectation over D. So the discarded per-instance information is exactly
      the information the algorithm's cost does not see, and the retained part
      propagates deterministically through the one operation that matters
      (amplification). CONTRAST WITH A FAILING VARIANT, recorded to show the
      test has teeth: tracking "the most likely support set under D" is NOT a
      valid object -- it is a single instance, loses nothing about itself, and
      tells you nothing about the amplitude of the marked subspace.
    survival: >-
      Survives exactly as long as the sampler version is fixed. It dissolves
      the moment the deployment updates its sampler, which is a real risk given
      that HQC's sampler has changed across revisions -- and that fragility is
      itself a finding worth recording, because it means any Delta > 0 is a
      patchable defect rather than a break of the assumption.

  proof_search_map:
    bottleneck: >-
      The per-iteration success probability p of the amplified search. Every
      exponent in quantum ISD is log2(p^{-1/2}); the record's entire content is
      that p is computed under the wrong distribution.
    baseline_embedding:
      parameter_slice: >-
        D = the uniform fixed-weight distribution. Then Delta = 0 and the cost
        formula 2^{(2w - Delta)/2} must reduce EXACTLY to Grover-Prange's
        2^{w}. This is the old-method boundary and it is a strict identity, not
        an approximation.
      reproduction_check: >-
        Symbolic: substitute p_D = p_unif = C(n,2w)/C(2n,2w) into the cost
        expression and check it equals the published Grover-Prange expression
        term by term. Plus a frozen numeric fixture at (n,w) = (31,3),
        (101,5), where p_unif is computed exactly by enumeration and compared
        against the closed form.
    observation_collision:
      observable: >-
        Delta, estimated from marginals and pair correlations of the sampled
        supports.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS SEVERE, and it is the main technical risk of
        the record: two distributions with identical per-position marginals and
        identical pair correlations can have very different Renyi-1/2 entropies
        if they differ in higher-order structure (e.g. a sampler that
        deterministically forbids certain 3-subsets has flat marginals and
        pairs but reduced entropy). Therefore the measured Delta_hat is a LOWER
        BOUND on the exploitable gain from low-order structure and NOT an
        estimate of the true Renyi-1/2 deficit, and a Delta_hat = 0 result
        closes only the marginal-and-pair lane. This is stated in
        interpretation_limits and is the single most important honesty
        constraint on the record. Partial separation: additionally measure the
        empirical distribution of consecutive support GAPS and of
        supp mod small primes, which is where modular-reduction artifacts in
        this class of sampler show up first.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "uniform initial state" to "any
          efficiently preparable initial state over information sets", and
          prove a STRICT inward improvement whenever D is non-uniform, not
          merely that a better state exists.
        predicted_gain: 'exactly Delta/2 bits of exponent'
      - transform: specialization_pack
        proposed_object: >-
          A per-position resource measure beta_i = (marginal_i - w/n)/(w/n),
          realized by the specialization "choose the information set to be the
          n positions of smallest beta_i", with charges added only over
          positions, which are disjoint by construction.
        predicted_gain: >-
          Delta ~ 1.151 * 2w * sigma_beta bits classically to first order in
          sigma_beta, from the mean of the lower half of a distribution with
          relative sd sigma_beta.
    quantifier_order: >-
      FOR ALL sampler versions V and parameter sets P, THERE EXISTS a real
      Delta(V,P) >= 0 such that FOR ALL keys generated by V at P, prior-matched
      amplitude amplification succeeds with expected cost
      2^{(2w - Delta(V,P))/2 + o(w)}. The witness (the initial state A) depends
      on V and P but NOT on the individual key -- that uniformity is what makes
      this an attack rather than an oracle. NOTE the direction of the
      inequality that is NOT claimed: it is NOT claimed that Delta > 0 for any
      particular V; that is precisely what the experiment decides.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The deployed sampler's marginal-and-pair non-uniformity is worth at
        most Delta_hat + epsilon bits classically and (Delta_hat + epsilon)/2
        bits quantumly, at the measured confidence." The method can NEVER
        certify anything about uniform QC-SD, and can never rule out
        higher-order structure (see the observation collision).
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is an IDEAL
        rejection-sampling fixed-weight sampler at the same (n,w). The method
        must return Delta_hat consistent with 0 there. If it returns Delta_hat
        > 0 on the ideal sampler, the estimator is biased -- most likely
        because the analyst forgot that a FIXED-WEIGHT support has intrinsic
        negative pair correlations (-w(n-w)/(n^2(n-1)) per pair) that an
        independent-Bernoulli null would misread as structure. This is the
        single most likely way to fabricate a result here and the control
        catches it.
    proof_obligations:
      - claim: 'p_D >= p_unif for the D-adapted information-set choice'
        responsibility: correctness
      - claim: 'amplified cost is Theta(p_D^{-1/2}) uses of A and the oracle'
        responsibility: runtime
      - claim: 'A is preparable in depth O(n) with O(n) qubits and no QRAM'
        responsibility: feasibility
      - claim: 'Delta = 1.151 * 2w * sigma_beta + O(sigma_beta^2)'
        responsibility: size
      - claim: 'Delta_hat is a lower bound on the true Renyi-1/2 deficit'
        responsibility: scope
      - claim: 'Delta = 0 identically for the ideal fixed-weight sampler'
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: sigma_beta (relative sd of per-position support marginals, deployed sampler, HQC-128)
      direction: different
      minimum_effect: >-
        PREDICTED consistent with the finite-sample floor, i.e. no detectable
        bias, for the current specification's sampler. Detection floor at
        M samples is sigma_beta_min = z / sqrt(M w / n) with z ~ 5 after
        Bonferroni over 2n positions: 2.6% at M = 10^7, 0.8% at M = 10^8.
    - metric: Delta (classical log-likelihood gain, bits)
      direction: higher
      minimum_effect: >-
        Any Delta >= 2 bits at 99% confidence is a reportable result; Delta >=
        13.2 bits (i.e. quantum gain >= 6.6 bits = 10% of the 66-bit baseline)
        is an exponent-moving result and escalates. PREDICTED Delta < 1.5 bits
        at M = 10^8 for the current sampler, i.e. an UPPER BOUND rather than a
        gain.
    - metric: Delta/2 (quantum exponent shift, bits, HQC-128)
      direction: lower
      minimum_effect: 'predicted bounded above by 0.6 bits at M = 10^8'
    - metric: >-
        Delta measured on the SUPERSEDED sampler version(s) present in older
        reference code and in liboqs history
      direction: higher
      minimum_effect: >-
        This is the branch most likely to be positive and it is worth doing
        even though it is not a statement about current HQC: a historically
        deployed sampler with Delta >> 0 quantifies what the sampler fix was
        worth in exponent bits, which no record in this corpus states.
    - metric: gap-distribution chi-square statistic (support gaps vs the exact fixed-weight gap law)
      direction: higher
      minimum_effect: >-
        p < 0.01 after Bonferroni is a positive structural signal even if
        marginals are flat, and is the sensitive detector for
        modular-reduction artifacts.

  minimal_test:
    design: >-
      Purely classical measurement, no quantum simulation.
      (1) Build a harness around the HQC reference keygen at HQC-128 exposing
      supp(x), supp(y) per key, with recorded seeds. Generate M = 10^7 keys
      (about 20 core-minutes at ~100 us/keygen), extend to 10^8 only if the
      10^7 pass shows any signal.
      (2) Estimate: per-position marginals (2n counts), the pair-correlation
      matrix restricted to a random 2000-position subset (full 2n x 2n is
      3 x 10^8 cells and unnecessary), the gap distribution, and the
      distribution of supp mod q for q in {3,5,7,257,65537} (the moduli where
      Barrett/rejection artifacts in this sampler class appear).
      (3) Compute sigma_beta, the D-adapted information-set choice (the n
      positions of smallest marginal), p_D by the exact hypergeometric-with-
      weights expression, Delta = log2(p_D/p_unif), and a 99% confidence
      interval by bootstrap over keys.
      (4) Repeat the whole pipeline on the two controls below and on at least
      one SUPERSEDED sampler version recovered from reference-code history.
      (5) Report the table (sampler version) x (parameter set) x (Delta, CI,
      quantum exponent shift Delta/2).
    controls:
      - >-
        NULL OBJECT 1 (mandatory, decisive): an IDEAL fixed-weight sampler --
        uniform over all C(n,w) supports, implemented by Fisher-Yates on a
        cryptographic PRNG. The entire pipeline must return Delta_hat
        consistent with 0 within its CI. This is the control that separates
        "measured bias" from "estimator bias", and the specific artifact it
        catches is the intrinsic negative pair correlation of fixed-weight
        vectors being misread as exploitable structure.
      - >-
        NULL OBJECT 2: a DELIBERATELY biased sampler with a known injected
        sigma_beta (e.g. 5%). The pipeline must recover Delta within 10% of
        its analytic value. Without this the estimator's sensitivity is
        unmeasured and a null result means nothing.
      - >-
        NULL OBJECT 3: shuffle the position labels of the real samples with a
        fixed random permutation. Delta must be invariant (it is a symmetric
        functional of the marginal multiset); if it is not, the estimator has a
        position-index dependence and is wrong.
      - >-
        STRUCTURAL TELL (inventor-protocol section 3.1): sigma_beta_hat must
        DECAY as 1/sqrt(M) under the null. An estimate that stays constant as M
        grows by a decade is the signature of a real bias; one that decays as
        1/sqrt(M) is finite-sample noise. Run at M = 10^6, 10^7, 10^8 and plot
        the decay, rather than reporting one M.
    required_metrics:
      - per-position marginal vector and sigma_beta with bootstrap CI, per M
      - Delta and Delta/2 with 99% bootstrap CI, per sampler version and parameter set
      - pair-correlation deviation from the exact fixed-weight law, max and mean
      - gap-distribution and modular-residue chi-square statistics with Bonferroni-corrected p
      - injected-bias recovery error on NULL OBJECT 2
      - the 1/sqrt(M) decay check on sigma_beta_hat

  null_object_control: >-
    NULL OBJECT 1 (ideal Fisher-Yates fixed-weight sampler) is the load-bearing
    control and must run BEFORE any real-sampler number is interpreted, per
    docs/inventor-protocol.md section 3. The failure mode it exists to catch is
    concrete and easy to fall into: a fixed-weight support has exact intrinsic
    pair correlations, so comparing against an independent-Bernoulli null
    manufactures a "bias" of order 1/n on every pair and would yield a spurious
    Delta. NULL OBJECT 2 (injected known bias) is the matching sensitivity
    control, without which Delta_hat = 0 is uninterpretable.

  falsification_conditions:
    - >-
      Delta_hat on NULL OBJECT 1 (ideal sampler) is inconsistent with 0 at 99%
      confidence. Falsifies the estimator, and no other number in the run may
      be reported.
    - >-
      Delta_hat on NULL OBJECT 2 differs from the injected analytic value by
      more than 10%. Falsifies the estimator's calibration.
    - >-
      sigma_beta_hat fails to decay as 1/sqrt(M) on the ideal sampler across
      M = 10^6, 10^7, 10^8. Falsifies the measurement.
    - >-
      Delta_hat < 1.5 bits at M = 10^8 with the CI excluding 2 bits, on every
      current sampler version and parameter set. This CLOSES the lane for
      current HQC with a measured upper bound -- the predicted outcome, and a
      complete result, not a failure.
    - >-
      Delta_hat >= 13.2 bits at HQC-128 with the CI excluding 10 bits. This is
      an exponent-moving positive result (quantum exponent 66 -> <= 59.4 bits)
      and must be escalated to independent review before any further work.
    - >-
      The exponent formula fails its symbolic reduction to Grover-Prange at
      Delta = 0. Falsifies the mechanism outright.

  confounders:
    - >-
      INTRINSIC FIXED-WEIGHT CORRELATIONS misread as bias -- the dominant risk,
      addressed by NULL OBJECT 1.
    - >-
      Multiple testing over 2n = 35338 positions plus pair and gap statistics.
      All p-values must be Bonferroni- or Benjamini-Hochberg-corrected, stated
      in the protocol before the run, not chosen after.
    - >-
      PRNG artifacts of the test harness rather than of the sampler. Use two
      independent PRNGs (the reference DRBG and an OS CSPRNG) and require the
      result to be identical.
    - >-
      SAMPLER VERSION DRIFT: the measured Delta belongs to one implementation
      at one commit. Record the exact source, commit and build flags; a Delta
      measured on liboqs is not automatically a Delta on the reference code.
    - >-
      A Delta > 0 driven by the sampler's handling of the RARE rejection path
      would show up only in a tail of keys, and averaging over M keys hides it.
      Additionally report Delta restricted to the 1% of keys with the most
      extreme first-index value.
    - >-
      Any bias in x may differ from any bias in y (they are drawn by separate
      calls, and the 2025 spec changed key derivation). Measure and report the
      two blocks separately as well as jointly.

  interpretation_limits:
    - >-
      A positive Delta is a statement about HQC AS INSTANTIATED, not about
      quasi-cyclic syndrome decoding as an assumption. Uniform QC-SD hardness
      is untouched by any outcome here, and the record must never be cited as
      moving the QC-SD exponent. The RQ's decision target explicitly admits
      improvements "for at least one standardized HQC parameter set", which is
      why this is in scope, but the distinction is not negotiable.
    - >-
      Delta_hat bounds only the gain extractable from MARGINALS, PAIRS, GAPS
      and SMALL-MODULUS RESIDUES. Higher-order structure with flat low-order
      statistics is not excluded, and the record's closure branch closes only
      the measured lane.
    - >-
      A positive Delta is patchable by a sampler fix, so it is a defect claim
      with a short shelf life, not a break. It should be reported as such and,
      if found, disclosed rather than accumulated.
    - >-
      The quantum half of the claim is NOT measured by this experiment. The
      experiment measures Delta classically; Delta/2 follows from amplitude
      amplification's square-root law, which is cited, not tested here.
    - >-
      Nothing here bears on HQC's DFR model, on timing/side-channel claim
      classes, or on RQ-QALG-457b41 / RQ-QALG-74bf20.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the ideal fixed-weight sampler, the per-position support marginals
        are exactly w/n and the pair correlations are exactly
        -w(n-w)/(n^2(n-1)); the empirical marginal vector over M keys therefore
        has relative standard deviation sqrt((n-w)/(M w)) per position, with
        Gaussian tails uniformly over positions for M w / n >> 1.
      rigorous_support: >-
        The mean and pair correlation are EXACT combinatorial facts about the
        uniform distribution on weight-w vectors (no heuristic). The heuristic
        is only the Gaussian tail approximation, imitating the classical
        Berry-Esseen / de Moivre-Laplace regime for sums of weakly dependent
        indicators; the exact law is hypergeometric.
      validation_plan: >-
        Run the estimator on NULL OBJECT 1 at M = 10^6, 10^7, 10^8 and compare
        the empirical distribution of position counts against the exact
        Binomial(M, w/n) reference by a two-sided KS test at alpha = 0.01.
        TAIL CHECK: the maximum and minimum position counts over all 2n
        positions must lie inside the Bonferroni-corrected 1/(2n) quantiles of
        that reference; a single position outside is the detector's own false
        positive rate and must be observed at roughly the predicted frequency,
        not at zero (a detector that never fires under the null is
        mis-calibrated too).
      falsification_condition: >-
        KS rejection on the ideal sampler at any M, or extreme-count
        frequencies differing from the Bonferroni prediction by more than 3x.
    - id: H2
      statement: >-
        To first order in sigma_beta, choosing the information set to be the n
        positions of smallest marginal yields
        Delta = log2(p_D/p_unif) = 2w * E[-beta | lower half] * log2(e) =
        1.151 * 2w * sigma_beta + O(2w * sigma_beta^2), where beta_i is the
        relative marginal deviation and the constant 0.798 = sqrt(2/pi) is the
        mean of the lower half of a standard Gaussian.
      rigorous_support: >-
        Combines the exact identity p_D = E_D[prod over I of (1 - indicator)]
        with the classical half-normal mean sqrt(2/pi), i.e. it imitates the
        standard order-statistics computation for selecting the lower half of a
        Gaussian population. The Gaussian shape of the beta_i is the heuristic
        part; the selection identity is exact.
      validation_plan: >-
        On NULL OBJECT 2 with injected sigma_beta in {1%, 3%, 5%, 10%} and
        injected shapes {Gaussian, two-point, heavy-tailed}, compare measured
        Delta against the first-order formula and against the exact numerically
        evaluated p_D. TAIL CHECK: at sigma_beta = 10% the first-order formula
        is expected to overstate Delta; record the size of the second-order
        correction rather than asserting the formula.
      falsification_condition: >-
        First-order formula deviating from the exact numeric p_D by more than
        15% at sigma_beta <= 5%, or the Gaussian-shape assumption changing
        Delta by more than 25% across the three injected shapes (which would
        mean sigma_beta alone is not a sufficient statistic and the record must
        report the whole marginal vector instead).
    - id: H3
      statement: >-
        The measured Delta transfers from HQC-128 to HQC-192 and HQC-256
        proportionally to 2w, i.e. Delta(P) ~ 1.151 * 2w(P) * sigma_beta with
        the SAME sigma_beta, because the sampler's bias mechanism is a property
        of the index-generation routine and not of n.
      rigorous_support: >-
        No rigorous support. This is a pure transfer assumption and is flagged
        as the weakest link in the record. It imitates nothing classical.
      validation_plan: >-
        Measure sigma_beta independently at all three parameter sets with
        M = 10^7 each and test equality of the three values by a bootstrap
        two-sample test. Record the three separately regardless of outcome;
        never quote a Delta at HQC-192/256 derived from HQC-128 data.
      falsification_condition: >-
        sigma_beta differing by more than 2x across parameter sets. In that
        case H3 is dropped and every parameter set is reported on its own
        measurement only.

  target_complexity:
    time_exponent: >-
      2^{(2w - Delta)/2 + o(w)} amplified iterations, versus the baseline
      2^{w + o(w)}. At HQC-128 with 2w = 132: 2^{66 - Delta/2}. The exponent
      SHIFT is Delta/2 bits and is the entire claim; with Delta = 0 the record
      claims nothing and reduces exactly to Grover-Prange. If KN-LIT-f7d7dd's
      improved quantum-ISD exponent, rather than plain Grover-Prange, is the
      correct baseline in HQC's sublinear-weight regime, the SHIFT is claimed
      to be unchanged (Delta/2) while the base it applies to moves.
    memory_exponent: >-
      UNCHANGED from Grover-Prange: no list, no table, no claw structure. The
      classical description of the prior is O(n) real numbers (the marginal
      vector), i.e. about 35338 rotation angles at HQC-128, compiled into the
      state-preparation circuit as constants. CRITICALLY: NO QRAM AND NO QRACM
      ARE REQUIRED, because the advice is O(n) classical data compiled into a
      circuit rather than data queried in superposition. This is the record's
      main cost-model advantage over quantum-walk ISD and it must be stated
      alongside the exponent, not instead of it.
    qubit_and_depth_exponent: >-
      Assumes FULL FAULT-TOLERANT ERROR CORRECTION; the mechanism is
      meaningless on NISQ hardware (the circuit is 2^{66} amplified iterations
      deep in the serial limit). Logical qubits: the same as Grover-Prange
      (dominated by the coherent Gaussian-elimination workspace, of order
      n^2 ~ 2^{28} logical qubits if the permuted parity-check matrix is
      materialized -- see IDEA-20260818-e0ce51, which charges exactly this and
      is the reason no exponent here should be quoted without it). Additional
      cost of the prior-matched state preparation: O(n) controlled rotations,
      depth O(log n) with a fan-out tree, width O(n) -- NEGLIGIBLE against the
      linear-algebra oracle, which is the honest reason this mechanism is worth
      considering at all: it buys Delta/2 bits for a depth cost that does not
      show up in the leading term.
    best_known: >-
      Grover-Prange 2^{w(1+o(1))} = about 2^{66} iterations at HQC-128 (this
      RQ's declared baseline, with quantum-walk BJMM/MMT claimed no better in
      the sublinear-weight regime up to o(1), itself unverified in this
      corpus). The corpus record for the improved quantum-ISD line is
      KN-LIT-f7d7dd. Classical: ISD + DOOM at about 2^{125} iterations.
    hidden_overhead: >-
      The o(w) hides the same per-iteration linear algebra as the baseline and
      is NOT improved. It also hides the cost of ESTIMATING D, which is
      classical, one-off, and about 10^8 keygens -- negligible against 2^{59},
      but it must be paid before the attack starts and it requires the attacker
      to know the sampler version. Nothing superpolynomial hides in the o(1);
      unlike the exemplar, this record's asymptotics are tight and its
      uncertainty is entirely in whether Delta > 0.
    tradeoff_note: >-
      Parallelizes exactly like Grover: P machines give speedup sqrt(P), so the
      Delta/2 gain is preserved under parallelization and under depth limits
      (it multiplies the search space by 2^{-Delta}, which survives every
      re-accounting). That robustness is a genuine advantage over mechanisms
      whose gain lives in a memory or query model.

  dominated_by: >-
    IF Delta = 0 (predicted): dominated by Grover-Prange on every axis, since
    the mechanism reduces to it exactly. IF Delta > 0: NOT dominated on the
    time axis by any row checked, because every row on the frontier computes
    its success probability under the uniform-support assumption and the
    Delta-bit gain composes with all of them. Frontier rows checked
    individually: (1) classical ISD + DOOM, about 2^{125} iterations, poly
    memory -- this record beats it on time whenever Delta > 0, but note the
    same Delta bits are available CLASSICALLY (worth Delta, not Delta/2), so
    the classical frontier moves too and the QUANTUM-VS-CLASSICAL ratio is
    unchanged; this is the honest framing and it means the record is not a
    quantum-advantage result, it is an absolute-cost result; (2) Grover-Prange,
    2^{66} -- strictly improved by Delta/2 bits; (3) quantum-walk BJMM/MMT and
    the improved quantum-ISD line recorded as KN-LIT-f7d7dd -- the prior is
    claimed to compose with these identically, so they stay ahead by whatever
    o(1) they had, and this record does not claim to beat them, it claims to
    shift both; whether the composition is as clean for KN-LIT-f7d7dd's
    algorithm as for plain Grover-Prange is UNVERIFIED and is named as a
    pre-promotion check in that citation; (4) RLPN / SD 2.0 / Dual Attack 3.0
    -- dominated at R = 1/2, see IDEA-20260818-d5668d; (5) quantum
    dual-codeword sampling (arXiv:2509.24796) -- requires a superposition of
    noisy codewords, not available against a fixed public key, so not on this
    frontier; (6) brute-force support enumeration 2^{1064} -- not on the
    frontier. NO ROW WAS LEFT UNCHECKED, and the honest summary is that this
    record's Pareto position is entirely a function of a number that has not
    been measured.
  sota_delta: >-
    Delta/2 bits of quantum exponent, where Delta is measured. PREDICTED
    OUTCOME: Delta/2 <= 0.6 bits at M = 10^8, i.e. sota_delta ~ 0 and the
    deliverable is an upper bound rather than a gain. ESCALATION THRESHOLD:
    Delta/2 >= 6.6 bits (10% of the 66-bit baseline at HQC-128). SECONDARY
    DELIVERABLE, likely positive and not otherwise recorded anywhere in this
    corpus: Delta for SUPERSEDED sampler versions, which prices the historical
    sampler fix in exponent bits.

  obstruction:
    statement: >-
      To be filled by the run. The anticipated form is: "the deployed HQC
      fixed-weight sampler's support distribution is indistinguishable from
      uniform at the level of marginals, pairs, gaps and small-modulus
      residues, bounding the prior-matched amplitude-amplification gain at
      HQC-128 to Delta/2 <= X bits" -- a claim about the OBJECT (the sampler's
      output distribution) over a stated sample size, not about the attempt.
    quantity: 'Delta/2, the quantum exponent shift in bits, with its 99% upper confidence bound'
    value: >-
      NOT MEASURED. No run exists; this record proposes the measurement.
      Predicted upper bound 0.6 bits at M = 10^8 for HQC-128 under the current
      sampler, derived from the 5-sigma Bonferroni detection floor
      sigma_beta <= 0.8% and H2's first-order formula. Recording this as a
      prediction, not a measurement, per AGENTS rule 5.
    measured_by: []
    scope: >-
      Would be claimed only for the exact sampler source and commit measured,
      the exact parameter set, the exact sample size M, and only for
      marginal / pair / gap / small-modulus-residue structure. Not claimed for
      other implementations, other spec revisions, higher-order structure, or
      uniform QC-SD.
    resource_check:
      examined: true
      reading: >-
        The measurement is a RESOURCE for two theories independent of this
        attack. (i) DESIGN PRICING: Delta/2 converts "the sampler was fixed" --
        currently a qualitative statement in the HQC change history -- into a
        number of security bits, which is the unit in which parameter-selection
        decisions are actually made; the same estimator applied across spec
        revisions produces a time series that no corpus record holds. (ii)
        ESTIMATOR REUSE: the pipeline (ideal-sampler null, injected-bias
        calibration, Bonferroni-corrected marginal/pair/gap battery, 1/sqrt(M)
        decay tell) is sampler-agnostic and transfers verbatim to any
        fixed-weight or small-secret sampler -- BIKE's, and the fixed-weight
        samplers in the sibling RQs' targets -- WITHOUT transferring any
        cryptanalytic conclusion, which the RQ's isolation constraint forbids.
        The tool crosses the lane boundary; no number does.
      spawned_ids: []

  estimated_cost:
    implementation: medium
    compute: low
    detail: >-
      Implementation is medium only because it requires instrumenting the HQC
      reference keygen to expose supports, recovering a superseded sampler
      version from source history, and writing a calibrated estimator with two
      nulls. Compute is genuinely low: 10^8 keygens at HQC-128 is roughly 3
      core-hours; the pair-correlation estimate on a 2000-position subset is
      4 x 10^6 counters. No quantum simulation. Total well under one core-day.

  recommended_priority: high
