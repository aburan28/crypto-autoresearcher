    web_screen: >-
      One WebSearch run 2026-08-18 ('HQC fixed-weight sampling bias
      non-uniform vect_set_random_fixed_weight'), which surfaced the TCHES 2026
      "Sota Voce" paper on low-noise sampling of sparse fixed-weight vectors,
