idea:
  id: IDEA-20260818-45b8ea
  question_id: RQ-QALG-122b59
  added: '2026-08-18'
  proposed_by: idea-generator
  title: >-
    PRIOR-MATCHED AMPLITUDE AMPLIFICATION: the quantum ISD exponent against
    HQC is 2^{(2w - Delta)/2}, not 2^{w}, where Delta is the classical
    log-likelihood gain extractable from the NON-UNIFORMITY of HQC's own
    fixed-weight support sampler -- measure Delta, and the exponent follows
  class: algorithm

  claim: >-
    Grover-Prange's exponent against QC-SD is quoted as 2^{w(1+o(1))} because
    the per-iteration success probability is computed for a UNIFORMLY random
    error support. HQC's error support is not drawn uniformly: it is drawn by a
    concrete constant-time fixed-weight sampler whose output distribution D is
    a specified, implementable object with known bias history. For any
    non-uniform D, an amplitude-amplification attack whose initial state is
    MATCHED to D (rather than uniform over information sets) has success
    amplitude sqrt(p_D) instead of sqrt(p_unif), so its cost exponent is
    (2w - Delta)/2 bits where Delta = log2(p_D / p_unif) >= 0 is the classical
    log-likelihood gain of the best D-adapted information-set choice. The
    claim is that Delta is a MEASURABLE NUMBER of the deployed sampler, that
    the quantum exponent moves by exactly Delta/2 bits, and that the
    measurement is cheap enough to bound Delta from above even when it is
    zero. Concretely at HQC-128 (2w = 132): Delta = 1.151 * 2w * sigma_beta
    bits to first order, where sigma_beta is the relative standard deviation
    of the per-position marginal support probabilities; sigma_beta = 8.7%
    would move the quantum exponent by 6.6 bits (10% of the 66-bit baseline),
    and 10^8 sampled keys bound sigma_beta below 0.8%, hence Delta/2 below
    0.6 bits, at Bonferroni-corrected 5 sigma over all 2n positions.
  mechanism: >-
    Model quantum ISD as amplitude amplification over information sets: a
    unitary A prepares a superposition over information sets I, an oracle marks
    I with supp(e) n I = empty, and the amplitude of the marked subspace is
    sqrt(p) where p = Pr_{I ~ A}[I avoids supp(e)]. Grover-Prange takes A
    uniform, giving p_unif = C(n,2w)/C(2n,2w) ~ 2^{-2w} at R = 1/2, hence cost
    p_unif^{-1/2} = 2^{w}. Nothing forces A to be uniform. If the attacker
    knows the support distribution D -- and for HQC every attacker does, because
    the sampler is specified and its code is public -- then A can be chosen to
    concentrate on information sets built from the positions LEAST likely to be
    in the support under D. Success probability becomes p_D = E_{I ~ A}
    Pr_D[supp(e) n I = empty], and the cost becomes p_D^{-1/2}: amplitude
    amplification pays the square root of whatever classical advantage the
    prior buys, so a Delta-bit classical gain is a Delta/2-bit quantum gain.
    This is exactly the quantum-search-with-advice regime, in which the
    governing quantity is the RENYI-1/2 ENTROPY of the prior rather than its
    Shannon entropy -- the square-root-of-probabilities norm is what amplitude
    amplification sees. The mechanism is therefore an EXPONENT-LEVEL lever
    driven by a purely classical, cheaply measurable statistic of a deployed
    implementation. The structural ingredient making this live rather than
    academic is external and recent: fixed-weight sparse sampling in HQC is a
    known source of bias, addressed by dedicated work (TCHES 2026, "Sota Voce:
    Low-Noise Sampling of Sparse Fixed-Weight Vectors"), and HQC's sampler has
    changed across specification revisions. The research question is not
    whether biased sampling helps -- it provably does, by Delta/2 bits -- but
    what Delta IS for each deployed sampler version.
  novelty_status: unverified

  novelty_screen:
    corpus_screen: >-
      Same targeted grep set as IDEA-20260818-f8dc30 over ledger/proposals,
      ledger/hypotheses, knowledge/ ('HQC', 'quasi-cyclic', 'syndrome
      decoding', 'ISD'), plus full read of the prior wave's report
      (TASK-20260813-9f7a4a/idea-report.yaml). NOT FOUND: any record touching
      the HQC fixed-weight sampler, support-distribution non-uniformity, prior
      / advice-based quantum search, Renyi entropy, or a non-uniform initial
      state for amplitude amplification. The five prior objects are all
      structural (shift-orbit, CRT residue, orbit quotient, electric network,
      baseline ratio); none is distributional.
    coordinator_semantic_screen: >-
      A semantic screen over the coordinator's index was run after this record
      was written and returned NO COMPETING PROPOSAL. It surfaced
      KN-LIT-f7d7dd ("Improved quantum information set decoding", score 1.000)
      as the corpus literature this record's EXPONENT BASELINE sits on -- the
      2^{w(1+o(1))} figure that Delta/2 is subtracted from -- now cited below.
      novelty_status REMAINS 'unverified': the index is a dated snapshot, it
      cannot prove a negative, and this session has not opened the source.
    adjacency_declared: >-
      IDEA-20260815-eaa615 (QRAM charging, filed under RQ-QALG-74bf20) and
      IDEA-20260815-6ed3c9 (classical-baseline attribution) are portfolio-wide
      COST-MODEL audits of quantum claims. This record is not an audit: it
      proposes a specific attack modification and a specific exponent formula.
      It does, however, share those records' concern that a quantum advantage
