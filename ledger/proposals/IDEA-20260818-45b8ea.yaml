    verdict: >-
      unverified. Ingredients are individually standard (quantum search with
      advice; sampler bias as a cryptanalytic target). The composite -- an
      exponent formula for quantum ISD driven by a measured Renyi-1/2 deficit
      of a standardized sampler -- was not found in this corpus and was not
