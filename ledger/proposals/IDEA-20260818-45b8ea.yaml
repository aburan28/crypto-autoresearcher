  citations:
    - ref: KN-LIT-f7d7dd
      provenance: kb
      claim: >-
        "Improved quantum information set decoding" -- this corpus's record for
        the improved quantum-ISD line, scored 1.000 by the coordinator's
        semantic screen against this record's query. IT IS THE LITERATURE THIS
        RECORD'S BASELINE EXPONENT SITS ON: the 2^{w(1+o(1))} quantity from
        which Delta/2 is subtracted, and the row against which any measured
        Delta must be quoted. PROVENANCE HONESTY: resolved through the kb index
        BY THE COORDINATOR, not by this session, and NOT opened here. Two
        consequences must be checked before the exponent formula is promoted:
        (i) whether its improved exponent, rather than plain Grover-Prange, is
        the correct baseline in HQC's SUBLINEAR-weight regime -- which is
        IDEA-20260813-fe3c5e's open question, not this record's; and (ii)
        whether the prior-matched initial state composes with its improvements
        as cleanly as it does with plain Grover-Prange. The Delta/2 shift is
        claimed to compose with ANY amplitude-amplification-based row, but that
        is an argument, not a verified fact about this specific algorithm.
      verified_by: "coordinator semantic screen, 2026-08-18 (not opened by this session)"
    - ref: 'Sota Voce: Low-Noise Sampling of Sparse Fixed-Weight Vectors, IACR TCHES (2026)'
      provenance: recalled
      claim: >-
        Fixed-weight sparse sampling as used in HQC proceeds by sampling w
        near-uniform integers from decreasing intervals, mapping them to w
        distinct indices, and setting those bits; the paper introduces
        procedures "proven sound, secure, and introducing little to no bias",
        which presupposes that existing procedures DO introduce bias. Surfaced
        in a WebSearch result summary on 2026-08-18; the paper was NOT opened.
        This is the external structural ingredient the record leans on and it
        MUST be retrieved and read before any Delta is interpreted.
      verified_by: null
    - ref: 'Montanaro, "Quantum search with advice" (TQC 2010)'
      provenance: recalled
      claim: >-
        The quantum query complexity of finding a marked item drawn from a
        known prior distribution p is governed by the Renyi entropy of order
        1/2 of p, not by its Shannon entropy; the cost scales as
        2^{H_{1/2}(p)/2} up to logarithmic factors. Used as the rigorous
        backbone for "a Delta-bit classical prior advantage is a Delta/2-bit
        quantum advantage". RECALLED FROM MEMORY; the precise statement,
        constant factors and applicability conditions must be checked against
        the paper before the exponent formula is promoted past `proposed`.
      verified_by: null
    - ref: 'Brassard, Hoyer, Mosca, Tapp, "Quantum Amplitude Amplification and Estimation" (2002)'
      provenance: recalled
      claim: >-
        For any state-preparation unitary A with success amplitude sqrt(p),
        amplitude amplification finds a marked item in O(1/sqrt(p)) uses of A
        and the oracle. This is the load-bearing rigorous statement; unlike the
        Montanaro citation it is textbook and its use here is direct.
      verified_by: null
    - ref: 'https://pqc-hqc.org/doc/hqc_specifications_2025_08_22.pdf'
      provenance: recalled
      claim: >-
        Source of the fixed-weight sampler definition and of n, w per parameter
