idea:
  id: IDEA-20260930-f1d8ff
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: >-
    Target-law separation of the tuple ceiling: uniform, planted, and
    x-slice hit rates on one prime-degree sibling
  class: control
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (x-coordinate in a polynomial
    basis). The attack stage whose charged cost this record can change is
    relation collection, and only the reading of its success probability:
    it does not change the 1/2 exponent of Frobenius-class Pollard rho on
    a uniform or fixed public target.

    The audit ceiling p_ceil = min(1, C(B+m-1, m)/r) bounds the hit rate
    of a uniform subgroup target. It does not by itself price a planted
    m-sum or a target drawn uniformly from the points whose x-coordinate
    lies in a subspace W chosen independently of the factor-base subspace
    V. On the Koblitz curve E_0: y^2 + xy = x^3 + 1 over F_{2^19} (prime
    degree, ord_19(2) = 18, nontrivial cyclotomic block irreducible, same
    block shape as m = 83 and m = 131), at one cell with m = 3 and the
    smallest B such that C(B+2, 3)/r is at least 2^{-6} and the multiset
    sumset is enumerable in at most 10^7 group additions, the three rates
    satisfy the pre-registered null: rate(U) = |image|/r, rate(P) = 1 on
    every planted multiset, and rate(W)/rate(U) lies in [1/2, 2], where W
    is an independent subspace of the same dimension as V and S_W is the
    set of subgroup points with x in W. A ratio rate(W)/rate(U) at least 4
    on every seed is the concentration reading. That reading prices only
    the restricted problem "targets already known to have x in W". It does
    not lower the generic cost of one uniform public target, which remains
    one Bernoulli trial of success at most p_ceil.

    This adds a law index the cap statement does not contain.
    IDEA-20260926-3c6a19 and IDEA-20260926-4b65e3 use
    mu = C(B+m-1, m)/r as a mean decomposition count under one uniform
    law. They do not compare laws. The archived m = 83 rows (B = 332 and
    B = 498, m = 3, one-target ceilings 2.54535220e-18 and 8.56483486e-18)
    sit in the regime where a perfect solver and a useless factor base
    produce the same zero natural hits. This control is what separates
    those two explanations on a cell where the image is an enumerable set
    rather than an empty sample.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the x-coordinate in a polynomial
    basis of F_{2^19}. Operation set Sigma: the three sampling maps that
    draw a target under laws U (uniform in the prime-order subgroup), P
    (uniform among unordered m-multisets of the factor base, summed in
    the group), and W (uniform in S_W). Sigma is not the translation
    action. Trichotomy: branching, in the sense of IDEA-20260806-c5d183.
    The tracked object is the hit bit pi(T) = 1 when T lies in the image
    of the unordered m-multiset sum map of F_V = {P : x(P) in V}. That bit
    is the branching event of Class I index calculus. It is not a block
    system of the full translation action (KN-FIND-ffe1df Theorem C), and
    it does not propagate deterministically under translation by a single
    factor-base point unless an arity counter is carried, in which case
    each step branches by |F_V|.

    LOSSY-PROJECTION TEST, against Sigma. The projection keeps the hit bit
    and the law tag and discards the multiset and the discrete log. The
    discard is compatible with Sigma because each law is scored only
    through the hit bit: two targets with the same bit are equivalent for
    the rate. The projection is lossy: under the null, about r - |image|
    points share the miss bit. A projection that kept the point would be
    injective and is not this object.

    OPEN NUMBER. Loss L = log2(r) - log2(|image|) bits of coverage below
    the whole subgroup, and branching b = C(B+m-1, m)/|image|, the mean
    number of multisets per image point. Both are measured by enumerating
    the sumset once. The birthday prediction is b = 1 + Theta(C/r) when
    C <= r/64, so L = log2(r/C) + o(1) in that cell. The factor base is
    the bounded-degree linear subspace scoped by KN-OPEN-020, used as a
    component, not as the lens. F2 (the relation vector) is the family
    this hit bit sits in; what is added is the law index on the bit.
    Families F1 and F3-F7 are not the lens.

    TWO READINGS. E-NULL: rate(W)/rate(U) in [1/2, 2] and rate(P) = 1.
    Then the audit's r-denominator prices every law an attacker can sample
    without already knowing a decomposition, and a planted demo's hit rate
    is not evidence about a public target. E-SLICE: rate(W)/rate(U) >= 4
    on every seed. Then p_ceil is the wrong denominator for that slice.
    The restricted problem "T already has x in W" would be sized against
    |S_W|, not r. The challenge points are not known to lie in any such
    W, so E-SLICE does not move the exponent of the Certicom instances.
    Before a point is drawn, a uniform draw hits with probability at most
    p_ceil. Once a public point is fixed, the ceiling does not decide
    whether that point lies in the image. The audit's probability
    statement does not apply to a named point or to an adversarially
    chosen point. An adversarially chosen target built as an m-sum is
    law P. The control measures that split. It does not treat a fixed
    point as if the ceiling had already excluded it.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260926-3c6a19
      provenance: internal
      claim: >-
        The cap uses mu = C(B+m-1, m)/N as one uniform-law mean. This
        record adds the law index and does not restate the cap or the
        arity table.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: IDEA-20260926-4b65e3
      provenance: internal
      claim: >-
        The (1/2 - 1/m) oracle-budget line is the uniform-law cap locus.
        This control does not move that line.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: IDEA-20260926-178821
      provenance: internal
      claim: >-
        Coverage redundancy of the target-dependent conjugate base of P
        and Q. Different base, different observable (fiber size of one
        sumset, not a ratio of three laws).
      verified_by: idea-generator session 2026-09-30, file read
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Bounded-degree algebraic factor bases are the scoped-out class.
        The linear subspace here is that component, not an open-class escape.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: "Feller occupancy / birthday theorem (classical; no edition opened)"
      provenance: recalled
      claim: >-
        For a uniform random function from a set of size C into a set of
        size r, with C <= r/64, the image is C (1 - Theta(C/r)) and the
        mean fiber is 1 + Theta(C/r). Hedge: recalled, not opened.
      verified_by: null
  assumptions:
    - >-
      F2 is a component. The factor base is {P : x(P) in V} for an
      F_2-subspace V, the bounded-degree class of KN-OPEN-020. No claim
      is made that this base escapes that class.
    - >-
      The sum map on unordered multisets is the object. Repetition is
      allowed, matching the audit's C(B+m-1, m), not C(B, m).
  proof_search_map:
    bottleneck: >-
      Whether p_ceil may be used as the hit probability for a law other
      than uniform. Removing the ambiguity changes which denominator the
      cap locus is allowed to use. It does not remove a step inside rho.
    baseline_embedding:
      parameter_slice: >-
        The audit identity support <= min(r, C(B+m-1, m)), evaluated at
        the archived cells (m, B) = (3, 332) and (3, 498) on the m = 83
        prime subgroup, ceilings 2.54535220e-18 and 8.56483486e-18. Those
        cells are not re-run. The toy cell is the same identity at n = 19.
      reproduction_check: >-
        Recompute C(B+m-1, m)/r from the curve order at the chosen B
        before any rates are read. A mismatch with the stars-and-bars
        count voids the cell.
    observation_collision:
      observable: the hit bit pi(T), tagged by the law that produced T
      distinct_preimage_search: >-
        Two distinct multisets with the same sum are one fiber of b.
        The search is the enumeration that computes b, not a separate hunt.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of pi under each law: preimage size b for law U's
          image, and the conditional fiber inside S_W.
        predicted_gain: >-
          Separates E-NULL from E-SLICE before any solver is built. No
          exponent gain is predicted.
    quantifier_order: >-
      FOR ALL seeds of (V, W) at the single n = 19 cell: rate(P) = 1,
      and rate(U) equals |image|/r. EXISTS a reading of rate(W)/rate(U):
      the null says every seed lands in [1/2, 2]; the slice reading says
      every seed lands at or above 4. The two quantifiers are not the
      same claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        At this cell, either the uniform denominator prices law W to
        within a factor 2, or it does not. Nothing is certified about
        m = 83, about solver cost, or about a uniform public target's
        exponent.
      nearby_object_control: >-
        Law P is the object on which "hit probability <= p_ceil" is
        known false whenever p_ceil < 1: every planted target hits. An
        instrument that reports rate(P) near p_ceil has failed. The
        cofactor-4 torsion subgroup is the second nearby object: the
        same formula with N = 4 has ceiling above 1 once C >= 4, and
        "a miss is expected" is false there.
    proof_obligations:
      - claim: rate(U) equals |image|/r when targets are uniform and the image is exact
        responsibility: correctness
      - claim: rate(P) = 1 by construction of the planted multiset
        responsibility: correctness
      - claim: >-
          Under a random-sum model, b = 1 + Theta(C/r) for C <= r/64
        responsibility: success_probability
      - claim: E-SLICE does not change the exponent of a uniform challenge point
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: rate_P
      direction: higher
      minimum_effect: equals 1 on every planted target; any miss voids the census
    - metric: rate_W_over_rate_U
      direction: lower
      minimum_effect: >-
        pre-registered null is a ratio in [1/2, 2]; a ratio >= 4 on every
        seed is the concentration reading
    - metric: branching_b
      direction: lower
      minimum_effect: b <= 1 + 2*(C/r) at this cell under the birthday null
  minimal_test:
    design: >-
      E_0 over F_{2^19}, prime-order subgroup of order r computed from the
      group order, m = 3, one random subspace V, B minimal with
      C(B+2, 3)/r >= 2^{-6} and at most 10^7 additions to enumerate. Build
      the image by enumerating unordered 3-multisets. Draw 200 targets
      from each of U, P, and W (W independent, same dimension as V, one
      seed pair plus one holdout seed pair). Do not call a Gröbner solver.
      Do not use a composite-degree field. Do not quote any n = 53 wall ratio.
    controls:
      - Planted law P, where a miss falsifies the instrument rather than the curve
      - A second seed pair (V, W) as holdout, same B
      - The N = 4 torsion subgroup as the nearby object where a miss is not expected
    required_metrics:
      - "|image|, C(B+m-1, m), r, b, L"
      - rate(U), rate(P), rate(W), and rate(W)/rate(U) per seed
      - group additions charged, all of them, including the enumeration
  falsification_conditions:
    - >-
      rate(P) < 1 on any planted target: the census is wrong and no law
      comparison is read.
    - >-
      rate(W)/rate(U) >= 4 on every seed, with the image enumeration
      checksum correct: E-NULL is false for this cell. Scope stays n = 19.
      This is not a uniform-target exponent improvement.
    - >-
      rate(W)/rate(U) in [1/2, 2] and b <= 1 + 2*(C/r) on both seeds:
      E-SLICE is false at this cell, and the r-denominator stands for all
      three laws here.
  confounders:
    - >-
      W accidentally meets V, or S_W is smaller than 2^{l-1} because of
      the cofactor. Record dim(W cap V) and |S_W| and reject the seed if
      dim(W cap V) > 0.
    - >-
      n = 19 has ord_19(2) = 18. A later comparison at n = 17
      (ord_17(2) = 8, block splits) is a different Frobenius module and
      is not a replicate of this cell.
    - >-
      Using C(B, m) instead of C(B+m-1, m) changes the ceiling. The
      enumeration must count multisets, matching the audit.
  interpretation_limits:
    - >-
      KN-OPEN-020: no new factor base. The linear subspace is the
      scoped-out bounded-degree class, a component only.
    - >-
      One cell at n = 19. No transfer to m = 83 or m = 131 is claimed.
      The counting identity transfers; the measured ratio does not,
      without a fresh cell.
    - >-
      E-SLICE, if it occurs, prices a restricted target law. Certicom
      challenge points are single public points. A fixed point is one
      uniform draw, still success probability at most p_ceil.
    - >-
      Full-cost S and any matched-rho ratio stay null. This record does
      not solve a discrete logarithm.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At this cell, with C = C(B+m-1, m) <= r/64, the multiset-sum map
        of a uniform random subspace factor base pushes forward to a
        function whose image size and mean fiber match a uniform random
        function from a set of size C into a set of size r: |image| =
        C (1 - Theta(C/r)) and b = 1 + Theta(C/r). Law W, with W
        independent of V, has conditional hit rate within a factor 2 of
        |image|/r.
      rigorous_support: >-
        The classical occupancy theorem for a uniform random function
        (birthday / balls-and-bins): expected collisions are C(C-1)/(2r),
        so the image deficit is of that order when C = o(r). The
        assumption imitates that theorem. It is not a theorem about
        x(P+Q) on E_0. Pairwise independence of sums is the part that
        can fail.
      validation_plan: >-
        Sample two independent seeds of (V, W) at n = 19, m = 3, B as
        in the minimal test (C/r >= 2^{-6}, enumeration <= 10^7
        additions). Compare the empirical fiber-size histogram to the
        occupancy prediction truncated at fiber 1 and 2. Tail check: the
        heaviest fiber is at most 4 under the null at this C/r; a fiber
        above 8 is a tail failure. No transfer to m = 83 is part of the
        validation. Parameters recorded: n = 19, m = 3, the computed r,
        B, dim V, dim W.
  target_complexity:
    time_exponent: >-
      Unchanged r^{1/2}. Predicted outcome does not move the exponent of
      a uniform or fixed public target. E-SLICE would re-denominator only
      a restricted x-slice problem, which is not the challenge distribution.
    memory_exponent: >-
      r^{0} beyond the enumerated image at the toy cell (at most 10^7
      points). No large-memory algorithm is proposed.
    best_known: >-
      Pollard rho on Frobenius classes, about sqrt(pi * r / (4 * m))
      iterations on a Koblitz curve. ECC2K-130 is about 2^60.9 iterations
      (KR-RHO-037e22, KR-RHO-18cc42). This control is not a competitor.
    hidden_overhead: >-
      None claimed. The toy enumeration is Theta(C) group additions, a
      measurement cost, not an attack cost. No o(1) hides a subexponential.
    tradeoff_note: >-
      Not a time-memory attack. Parallelism does not arise. Dominated on
      time, memory, and queries by Frobenius rho for every outcome this
      design can certify.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-1fcdbc
      - KR-IC-73db3f
      - KR-IC-5931ee
      - KR-RHO-037e22
      - KR-RHO-13bf67
      - KR-RHO-46c2c6
    nearest:
      - ref: KR-IC-1fcdbc
        provenance: internal
        relation: adjacent
        delta: >-
          That row records that characteristic-2 summation attacks stay
          slower than rho. This record does not claim a speed and does
          not re-run those experiments. It adds a three-law hit-rate
          comparison the row does not state. Map row read; the cited
          papers were not opened.
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: orthogonal
        delta: >-
          Summation polynomials are the framework, used as the definition
          of the sum map, not as the proposal. Delta is the law index on
          the image, which that row does not discuss.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic-group lower bound still dominates a uniform target.
          This record's strongest certified claim stays inside that bound.
          Quantitative delta: no change to the 1/2 exponent.
    searched:
      corpus_grep:
        - "ledger/proposals IDEA-2026092* for planted, image cardinality, sumset, rate(W)"
        - "knowledge/ for tuple ceiling and M83 underpowered (no match on the audit phrase)"
      web: []
      blocked:
        - "External papers named only as recalled were not opened; novelty stays unverified."
