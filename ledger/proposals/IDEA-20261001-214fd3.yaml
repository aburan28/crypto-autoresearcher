idea:
  id: IDEA-20261001-214fd3
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES LAST-FALL DEGREE STAY BOUNDED AS n GROWS ON TOY WEIL-DESCENDED S_3?
    On binary toys n∈{17,19,23,29,31} with frozen V (dim ℓ=3), measure the
    last-fall degree of one descended S_3 system per cell and test whether
    it stays within a pre-registered band independent of n (KR-IC-fbdb61
    context), distinct from the first-fall meter of IDEA-20261001-556cea.

  class: heuristic_validation

  claim: >-
    KR-IC-fbdb61 records that last fall degree of Weil-descended systems is
    bounded independently of the extension degree under stated conditions,
    and that solving degree / last fall / degree of regularity are related
    but distinct; KR-IC-f5c584 / IDEA-20261001-556cea already target first-
    fall degree ≈2. CLAIM: for each toy prime n∈{17,19,23,29,31} with frozen
    V of dim ℓ=3, the measured last-fall degree LFD(n) of one (or the median
    of ≥5) descended S_3 system(s) satisfies LFD(n) ≤ L0 (pre-registered
    L0=8) — OR LFD(n) > L0 and is recorded as unbounded-at-toy under this
    protocol. CLAIM TIER: heuristic_validation. NO break. NO exponent. NO
    claim that bounded LFD implies subexponential binary ECDLP
    (KR-IC-889857 remains disputed). NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: Semaev S_3 on x-coordinates with factor
    base {P : x(P)∈V}, Weil-restricted to F_2 (KR-IC-5a43e5 / KR-IC-73db3f).
    Operation set: a last-fall-degree oracle (Macaulay / F4 fall schedule)
    only — report LFD, not a full PDP campaign. Trichotomy: Class I
    partial-action used as instrument for the algebraic system, not as a
    new attack. Lossy-projection: LFD discards solution content beyond the
    fall schedule; null is a random semi-regular Boolean system of matched
    size whose LFD should grow with the classical Bardet–Faugère–Salvy
    prediction and not inherit the Weil-descent bound. OFF-LIMITS: redoing
    IDEA-20261001-556cea (first-fall / solving-degree near 2); asserting
    KR-IC-889857; Crossbred/Karabina engine races. WHAT IS NEW: a
    pre-registered LFD-vs-n band (L0=8) on RQ-BINSTD toys under
    KR-IC-fbdb61.

