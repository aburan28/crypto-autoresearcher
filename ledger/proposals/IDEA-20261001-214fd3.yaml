    Stage 1: n=17,19 — compute LFD (± replicate ≥5 if cheap).
    Stage 2: n=23,29,31 + matched semi-regular null. Budget: ≤10
    CPU-hours. Stop if LFD oracle absent (IMP, never evidence).

