  assumptions:
    - Frozen V (dim ℓ=3), seeds, and LFD oracle definition (same across n).
    - LFD oracle already admitted or cell is failed_infrastructure.
    - L0=8 and ≥5 systems (or one designated) pre-registered; no post-hoc edits.
    - Bounded toy LFD ≠ subexponential binary ECDLP (KR-IC-889857 disputed).

  heuristic_assumptions:
    - id: HEUR-BINSTD-214fd3-H1
      formal_statement: >-
        FORALL prime n∈{17,19,23,29,31}: under frozen V with dim ℓ=3, the
        measured last-fall degree LFD(n) of the designated descended S_3
        system(s) satisfies LFD(n) ≤ 8.
      random_model_justification: >-
        Rigorous: KR-IC-fbdb61 gives conditions under which LFD is bounded
        independently of extension degree; KR-IC-f5c584 explains structural
        first-fall=2 but does not by itself pin LFD. Classical: if the toy
        systems inherit the Weil-descent bound, LFD should stay flat in n
        within a small integer band; L0=8 is a conservative pre-registered
        ceiling for the transfer hypothesis under test — not a claim that
        the published bound holds for every Semaev descent or that
        KR-IC-889857 is settled.
      supporting_results:
        - KR-IC-fbdb61
        - KR-IC-f5c584
      validation_experiment_ids: []
      falsification_condition: >-
        LFD(n) > 8 at a completed n-cell, OR a matched random semi-regular
        null shows LFD_null ≤ LFD(descent) (descent structure is not the
        driver of flatness), OR the LFD oracle is absent (infrastructure
        stop).

  predictions:
    - metric: last_fall_degree
      direction: upper_bounded
      minimum_effect: 'LFD(n) ≤ 8 at each toy prime n under frozen V/ℓ=3'
    - metric: lfd_vs_n_slope
      direction: upper_bounded
      minimum_effect: 'OLS slope of LFD vs n ≤ 0.05 per unit n across completed cells'
    - metric: random_semiregular_null_lfd
      direction: differ
      minimum_effect: 'LFD(descent) ≤ LFD(null) − 1 when both measured'

  minimal_test: >-
