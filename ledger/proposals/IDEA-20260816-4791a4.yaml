idea:
  id: IDEA-20260816-4791a4
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: Replace the inherited phrase detecting the trapdoor seems out of reach with an explicit triple
    of hypothesis class, adversary budget, and distinguishing advantage, and compute the exhaustive
    m-sweep detector cost exponent 1/d in log p for the class C(d,H) with a toy-size exact calibration
    of the sweep interval
  class: theory
  claim: '(A) THE PHRASE IS NOT A PROPOSITION. As it stands, detecting the trapdoor seems out of reach
    has no truth conditions: it names no hypothesis class, no adversary budget and no advantage. This
    proposal asserts that the phrase can be replaced, without loss, by a triple (C, B, eps): the class
    of special forms under consideration, the budget in elementary operations available to the distinguisher,
    and the advantage it achieves over guessing. Every disagreement about the phrase is then a disagreement
    about which triple is meant, and that is checkable. (B) THE TRIVIAL DETECTOR HAS A COMPUTABLE
    COST, SO THE QUANTIFIER IS NOT UNIVERSAL. For the class C(d,H) there is always a complete detector:
    enumerate the base m, and for each one run a rank-(d+1) lattice reduction to recover any degree-d
    witness with coefficients at most H. Membership is decided exactly when the enumeration covers
    every admissible m. The admissible interval is forced by the leading coefficient: if f has degree
    d, leading coefficient a_d with 1 <= |a_d| <= H, and f(m) = p, then m lies between (p/H)^(1/d)
    and p^(1/d) up to a correction from the lower-order terms that is bounded and computable. Hence
    the sweep length is at most ceil(p^(1/d)) - floor((p/H)^(1/d)) + O(1), the detector cost exponent
    is 1/d in log p, and the correct reading of the inherited phrase is a specific number of operations
    at a specific (d, n), not an impossibility. (C) THE TABLE IS THE DELIVERABLE. For each d, the
    detection exponent n/d bits of work is set against the degree the special form must have for the
    sieve advantage to exist at all, producing an explicit region where detection is cheaper than
    the attack it detects, and a region where it is not. That crossing is a proposition. (D) THE CALIBRATION.
    At toy sizes the interval endpoints are checked exactly by enumerating every (f,m) that produces
    an n-bit prime and confirming that no witness base falls outside the derived interval; a single
    counterexample refutes the interval and therefore the exponent. (E) WHAT IS NOT CLAIMED. No attack,
    no speedup, no assertion that detection is or is not feasible for anyone, and specifically no
    claim that the inherited phrase is wrong. The claim is only that the phrase becomes a measurable
    statement once the triple is fixed, and that under this class the trivial detector cost is computable
    rather than unknown. Whether a cleverer detector exists is untouched and remains open.'
  mechanism: 'STAGE ONE, pure algebra and zero compute: derive the admissible base interval. Write
    p = a_d m^d + r(m) with |r(m)| <= H (m^d - 1)/(m - 1) < H m^d / (m-1). Bound the correction and
    produce closed-form lower and upper endpoints for m in terms of p, d and H, with the error term
    explicit rather than absorbed. STAGE TWO: derive the detector cost as sweep length times the cost
    of one rank-(d+1) reduction, in elementary operations, and state it as an exponent in log p together
    with the constant. STAGE THREE: build the table. For n in a declared list and d in a declared
    list, tabulate log2 of the sweep length. STAGE FOUR, the calibration that can refute STAGE ONE:
    at n in {20, 24, 28} exhaustively enumerate every (f, m) with deg f = d and coefficients bounded
    by H such that f(m) is an n-bit prime, record the witness base for each, and check that all of
    them lie inside the derived interval. If any lies outside, the interval and hence the exponent
    are wrong and the derivation is refuted at zero further cost. STAGE FIVE: check the sharpness
    in the other direction by measuring how much of the derived interval actually contains witnesses,
    since an interval that is correct but grossly loose overstates the detector cost and therefore
    understates detectability. The deliverable is the derivation, the table, the calibration result,
    and the measured tightness ratio.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: ledger/questions/RQ-SNFS-005666.yaml and ledger/goals/GOAL-SNFS-001.yaml,
      both of which state the detectability question but neither of which contains a cost expression
      for a detector. Read docs/inventor-protocol.md section 8 and knowledge/techniques/KN-TECH-080.md
      on the quantifier-order audit. Greps: grep -ril -E ''trapdoor|SNFS|special number field'' ledger/proposals/
      returned 35 files, all inspected by question_id; grep -ril -E ''special.form|SNFS'' ledger/hypotheses/
      returned nothing; grep -ril -E ''detectab'' ledger/proposals/ ledger/hypotheses/ and header
      inspection of the returned records.'
    results: 'No record in ledger/ states a detector cost for special-form integers. The 35 files
      matching trapdoor are dominated by RQ-ECTD-001 curve-trapdoor work, of which IDEA-20260815-8dcde2
      is the clearest analogue: it derives an advantage inequality that a curve trapdoor must satisfy,
      which is the same methodological move applied to a different object. The cost-model lane under
      RQ-RSA-afe33c (IDEA-20260808-0cdd09, IDEA-20260805-1775f2) computes NFS attack exponents, never
      a detection exponent. KN-TECH-080 supplies the quantifier-order audit this proposal executes
      but contains no SNFS content.'
    verdict: 'UNVERIFIED. Nothing here asserts anything about published literature. Claimed new relative
      to this repository: the explicit derivation of the admissible base interval with its error term,
      the resulting detection cost exponent 1/d in log p as a stated proposition, and the exhaustive
      toy-size calibration that can refute the interval. Assembled from known parts: the base-m polynomial
      construction is textbook, the quantifier-order audit is KN-TECH-080 applied verbatim, and the
      advantage-inequality framing is the same move IDEA-20260815-8dcde2 makes for isogeny trapdoors.
      What is offered is the arithmetic and the refutable calibration, not the framing.'
  object_first_candidate:
    tracked_object: The admissible witness set A(p,d,H), namely the set of integers m for which some
      degree-d polynomial with coefficients bounded by H satisfies f(m) = p, projected onto its cardinality
      and its interval hull. The object followed through the argument is that interval and its length
      exponent, not any particular prime or polynomial.
    lossiness: 'Genuinely lossy. Everything about the arithmetic is discarded: the coefficients, the
      residues, the primality certificate, even which primes are in the class. What survives is a
      single interval and its length. The projection is many-to-one on a massive scale, since all
      primes of a given bit length share the same interval hull to leading order. It propagates because
      the operation that matters, enlarging the class by increasing d or H, acts on the interval endpoints
      through closed-form arithmetic and needs none of the discarded structure. The honest caveat
      is that the direction of loss is one-sided: the interval is an upper bound on the search, so
      a loose interval overstates the detector cost, and the tightness ratio measured in STAGE FIVE
      is what stops that loss from becoming a free pass.'
    propagation: One step of the target operation is d maps to d+1 at fixed n and H. The interval
      endpoints move from (p/H)^(1/d) and p^(1/d) to (p/H)^(1/(d+1)) and p^(1/(d+1)), so log2 of the
      sweep length falls from about n/d to about n/(d+1), a reduction of about n/(d(d+1)) bits per
      step. The complementary step, H maps to 2H at fixed d, lowers the interval floor and lengthens
      the sweep by a factor of about 2^(1/d) only, so coefficient growth is a far weaker lever than
      degree growth. Both statements are closed-form and are checked exactly at toy sizes.
    survival_score: 'The interval statement survives to arbitrary n by construction, since it is an
      identity in the leading term with an explicit remainder, and it dissolves exactly where the
      remainder bound stops being small compared with the gap between the endpoints, which happens
      when H approaches p^(1/d), that is, when the special form ceases to be special. That is the
      concrete boundary: the derivation is valid throughout the region log H < (n/d) - c for a small
      explicit c, and says nothing outside it.'
  null_object_control: The null object is the class with no smallness constraint, H set to the largest
    coefficient the construction permits, so that C(d,H) becomes essentially all primes. Running the
    identical interval derivation and the identical exhaustive toy enumeration on that class must
    show the interval degenerating to cover the entire admissible range and the exhaustive count of
    witness bases per prime rising to the point where membership carries no information. If the derived
    interval and the measured witness counts look the same for the constrained and the unconstrained
    class, the interval is not tracking speciality and the whole cost exponent is an artifact of the
    parameterisation rather than of the trapdoor.
  discriminated_from:
  - 'IDEA-20260815-8dcde2 under RQ-ECTD-001: same move, deriving the inequality before spending compute,
    but the object there is a secret isogeny chain length and the inequality is about attacker advantage,
    not about a detector sweep over integer bases.'
  - 'IDEA-20260808-0cdd09 under RQ-RSA-afe33c: computes NFS cost ratios between record computations.
    This computes a detection cost with no sieve, no relation and no matrix in it.'
  - 'IDEA-20260805-1775f2, the wiring exponent family of GNFS full-cost exponents: an attack exponent
    one-parameter family. The exponent here is a search exponent for a classifier and is not comparable
    to it.'
  - 'The lattice-detector ROC proposal in this same batch: that one measures a detector at a fixed
    budget, this one computes what a complete detector costs. One is empirical and bounded, the other
    is arithmetic and exhaustive; the second sets the axis the first is plotted on.'
  assumptions:
  - The special form is realised as p = f(m) with deg f = d and coefficients bounded by H; other realisations
    of speciality are outside this class and the derivation says nothing about them.
  - One rank-(d+1) lattice reduction suffices to decide, for a given base, whether a witness with
    coefficients bounded by H exists; if reduction quality is inadequate at some rank the cost model
    needs a correction factor, which is measured rather than assumed.
  - The remainder bound |r(m)| <= H(m^d - 1)/(m-1) is the operative one; a sharper bound would shorten
    the interval and lower the detector cost, so the derivation is conservative in the direction that
    makes detection look harder.
  - Exhaustive toy enumeration at 20 to 28 bits is a faithful check of the interval, since every witness
    is constructed rather than searched for.
  predictions:
  - metric: fraction of exhaustively enumerated witness bases lying inside the derived interval, n
      in {20,24,28}
    direction: higher
    minimum_effect: exactly 1.0; a single exception refutes the derivation
  - metric: log2 sweep length at fixed n as d increases by one
    direction: lower
    minimum_effect: decrease of at least 0.8 times n/(d(d+1)) bits, allowing for the endpoint correction
  - metric: tightness ratio, measured span of realised witness bases divided by derived interval length
    direction: different
    minimum_effect: 'no pre-commitment: the ratio depends on the coefficient distribution used by
      the sampler, which is a design choice not yet frozen, and guessing a number here would be inventing
      data'
  minimal_test:
    design: 'The derivation itself costs nothing and can be written and checked by hand. The refutation
      test is a single exhaustive enumeration: fix d = 3 and H = 8, enumerate every polynomial with
      those bounds and every base m from 2 up to the point where f(m) exceeds 2^28, retain the pairs
      whose value is a prime of exactly 24 bits, and for each retained pair check whether m lies inside
      the derived interval for its own p. This is a loop over at most 17^4 polynomials times a few
      thousand bases, well under a minute in pure Python, and it either confirms the interval on every
      one of the thousands of witnesses produced or it produces an explicit counterexample. The same
      enumeration yields, for free, the tightness ratio and the per-prime witness count that the null
      control needs. No sampling, no statistics, no threshold: the discrimination is a containment
      check with a decidable answer.'
    controls:
    - The unconstrained-H null class, run through the identical derivation and identical enumeration.
    - 'An off-by-one control: deliberately shift the derived interval endpoints inward by one and
      confirm that the containment check then fails, proving the check has power.'
    - 'A degree-mismatch control: score degree-3 witnesses against the degree-4 interval to confirm
      the interval is degree-sensitive.'
    - An independent recomputation of the interval endpoints using integer arithmetic only, no floating
      point, to rule out rounding as the source of any containment failure.
    required_metrics:
    - count of enumerated witness pairs per (d,H,n) cell
    - containment fraction of witness bases in the derived interval
    - derived interval length and its log2
    - measured span of realised witness bases and the tightness ratio
    - witnesses per prime, distribution
    - elementary-operation count of the modelled complete sweep
  falsification_conditions:
  - Any enumerated witness base falls outside the derived interval, refuting the interval and the
    exponent as stated.
  - The interval for the constrained class is indistinguishable in length from the unconstrained null
    class, showing the exponent is a parameterisation artifact.
  - The containment check passes even after the deliberate inward shift, showing the check has no
    power and proves nothing.
  - Integer-only recomputation of the endpoints disagrees with the floating-point version by more
    than one unit, making every reported length unreliable.
  - The measured per-step reduction in log2 sweep length as d grows does not approach n/(d(d+1)),
    falsifying the propagation statement.
  confounders:
  - Floating-point evaluation of p^(1/d) at large n is inaccurate and can manufacture both containment
    successes and failures; the integer-only control exists for this.
  - The coefficient sampler determines the realised base span, so the tightness ratio measures the
    sampler as much as the class.
  - Restricting to exactly-n-bit primes biases the enumerated witness set toward large leading coefficients,
    which pushes bases toward the interval floor.
  - Very small d makes the remainder comparable to the leading term and the asymptotic reading of
    the interval misleading, even where containment still holds.
  interpretation_limits:
  - A correct interval bounds the trivial complete detector only; it says nothing about whether a
    cleverer detector exists, and asserting otherwise would be exactly the unquantified move this
    proposal exists to remove.
  - The cost exponent is stated for the class C(d,H) and does not transfer to any other notion of
    special form.
  - Nothing here says the inherited phrase is right or wrong, only that it acquires truth conditions
    once the triple is fixed.
  - No claim about any real, published or deployed parameter set follows from a cost table.
  target_complexity:
    time_exponent: No attack exponent is claimed. The detection cost exponent for the class C(d,H)
      is 1/d in log p for the trivial complete detector, that is about 2^(n/d) rank-(d+1) reductions,
      with the constant and the endpoint correction stated explicitly rather than absorbed into an
      o(1).
    memory_exponent: No attack memory exponent is claimed. The complete sweep is streaming and holds
      one basis at a time, so memory is O(d^2 log p) bits, independent of the sweep length; this asymmetry,
      exponential time against logarithmic memory, is itself part of the deliverable.
    best_known: The incumbent is the inherited phrase in RQ-SNFS-005666, which states no cost at all.
      Within this repository the only comparable numbers are attack exponents in the GNFS cost lane,
      IDEA-20260805-1775f2 and IDEA-20260808-0cdd09, which measure a different quantity and are named
      here only so the two are not confused.
    hidden_overhead: The constant hidden by the exponent is the cost of one exact reduction, which
      in pure Python is large enough to matter by several orders of magnitude at any realistic size.
      The endpoint correction from the lower-order terms is bounded but not tight, so the true sweep
      may be materially shorter than the derived one, which would make detection cheaper than this
      proposal states. The human cost is in resisting the temptation to report the exponent without
      the tightness ratio.
  dominated_by: n/a for attack claims, none is made. As a cost statement, I checked every row this
    repository holds that states an exponent for anything adjacent, namely the GNFS full-cost exponent
    family in IDEA-20260805-1775f2 and the ratio-based cost validation in IDEA-20260808-0cdd09, plus
    KN-LIT-2663 on area-time batch costing as recorded in RQ-RSA-afe33c; none of them states a detection
    cost, so no row dominates this one and none is comparable. That is a checked emptiness, not an
    assumed null.
  sota_delta: No attack; conceptual and cost-accounting contribution only. Quantitatively, the delta
    is from an English phrase with no number to an explicit function, about n/d bits of work at degree
    d and modulus size n, together with a refutable containment test on thousands of exhaustively
    enumerated witnesses. There is no prior number in this program to compare against, and that absence
    is stated rather than filled with an invented baseline.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part B, that the derived interval contains every enumerated witness base:
    about 0.85, since it follows from an elementary bound, with the residual risk almost entirely
    in the endpoint correction and in floating-point evaluation rather than in the mathematics. Part
    C, that the resulting table shows a nonempty region where detection is cheaper than the sieve
    advantage it detects: about 0.4, because degree and coefficient bounds pull in opposite directions
    and the region may be empty for every parameter the construction would actually use, which would
    itself be the interesting result. That the tightness ratio is close enough to one for the exponent
    to be the operative quantity rather than an overstatement: about 0.5. That any of this changes
    what anyone believes about detectability at cryptographic sizes: low, and deliberately not claimed.'
