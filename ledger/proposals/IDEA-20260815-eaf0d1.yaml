idea:
  id: IDEA-20260815-eaf0d1
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THIS BATCH PROPOSES A GREAT DEAL OF AUDIT WORK AND AUDITS CAN CROWD OUT
    RESEARCH: score the batch by how much of it advances a hypothesis versus
    how much only checks the program's own instruments
  class: audit

  claim: >-
    A large share of this batch audits instruments, cost models, citations,
    scopes and process. Each is individually defensible and collectively
    they could consume a campaign without testing a single hypothesis about
    elliptic curves. Scoring the batch by what it advances is a cheap check
    against a failure mode the program's own emphasis on rigour makes
    likely.

  mechanism: >-
    Classify each batch record as hypothesis-advancing, instrument-
    validating, or process-auditing. Report the distribution and the share
    of estimated cost in each class. Compare against what the campaign's
    goals actually require.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Applies to the 2026-08-15 batch; grep the batch's own class fields
      and read its estimated costs.
    results: >-
      The batch's records carry class and cost fields; no record scores
      the batch's composition against what the campaign needs.
    verdict: >-
      ADAPTATION. Portfolio composition analysis is administrative; the
      contribution is applying it to a batch whose own emphasis makes
      over-auditing a live risk.

  object_first_candidate:
    tracked_object: >-
      THE BATCH'S COMPOSITION, by what each record advances rather than by
      what it studies.
    lossiness: >-
      Classifying by advancement discards subject matter, which is the
      point: two records on different curves can serve the same campaign
      function.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives within the batch; its conclusions bind this batch's
      composition and not the wider corpus.

  null_object_control: >-
    NULL 1 -- a record that plainly tests a hypothesis about curves, which
    must classify as hypothesis-advancing. NULL 2 -- a record that plainly
    validates an instrument, which must not; a classification collapsing the
    two measures nothing.

  discriminated_from:
    - >-
        The result-class spectrum record in this batch, which classifies
        RESULTS by claim strength; this classifies PROPOSALS by campaign
        function, which is a different axis and both are needed.
    - >-
        The batch self-screen record, which deduplicates; this scores
        composition and should run after deduplication so the shares are
        not inflated.

  assumptions:
    - >-
        Records classify cleanly by function; those serving several
        functions are reported as such rather than forced into one.
    - >-
        Estimated costs are comparable across records, which they are only
        roughly since they are coarse categorical labels.

  predictions:
    - metric: >-
        plainly-hypothesis-advancing null
      direction: different
      minimum_effect: >-
        FORCED so classified.
    - metric: >-
        plainly-instrument-validating null
      direction: different
      minimum_effect: >-
        FORCED not classified as hypothesis-advancing.
    - metric: >-
        share of records and of estimated cost per class
      direction: different
      minimum_effect: >-
        The deliverable; a batch dominated by audit work would consume a
        campaign without testing anything about curves.
    - metric: >-
        comparison against what the campaign's goals require
      direction: different
      minimum_effect: >-
        The actionable part: goals blocked on instruments need
        instrument work, and goals blocked on nothing need hypotheses.

  minimal_test:
    design: >-
      Classification across the batch, both nulls, cost shares computed
      from the records' own estimates.
    controls:
      - >-
          Both classification nulls.
      - >-
          Multi-function records reported rather than forced.
      - >-
          Run after the batch self-screen so shares are not inflated by
          duplicates.
      - >-
          Cost shares treated as coarse, since the underlying estimates
          are categorical.
    required_metrics:
      - >-
          Record and cost share per class.
      - >-
          List of multi-function records.
      - >-
          Comparison against the goals' stated blocking obligations.

  falsification_conditions:
    - >-
        A null misclassifies. The classification is not measuring
        function.
    - >-
        The batch is dominated by audit and instrument work. That may be
        correct given how many goals are blocked on instruments, but it
        should be a deliberate choice rather than an accident, and this
        record makes it visible.
    - >-
        The batch is balanced against what the goals need. The composition
        is appropriate and this record confirms it cheaply.
    - >-
        Most records serve several functions. The classification axis is
        too coarse and should be refined before use.

  confounders:
    - >-
        SELF-SERVING CLASSIFICATION: the batch's own author classifying
        its records is a conflict, and the two nulls are a weak control
        against it; an independent classification would be stronger and is
        worth requesting.
    - >-
        COST-ESTIMATE COARSENESS: the records' cost fields are three-
        valued labels, so cost shares are indicative at best and should
        not be reported with false precision.

  interpretation_limits:
    - >-
        Scores composition; makes no judgement about any record's quality
        or correctness.
    - >-
        Scoped to this batch, after deduplication.
    - >-
        A high audit share is not automatically wrong, since many goals
        are blocked on instruments; it is a fact to be decided on rather
        than a defect.

  heuristic_assumptions:
    - id: HEUR-COMPOSE-1
      statement: >-
        A batch's composition by campaign function predicts what the
        campaign will be able to conclude after executing it.
      rigorous_support: >-
        Rigorous ingredient: none, and this is labelled a heuristic
        rather than dressed as more. The observation behind it is
        structural: a record that validates an instrument cannot, by
        construction, move a hypothesis, so a batch containing no
        hypothesis-advancing records cannot move one. THE GAP:
        instrument work frequently unblocks hypothesis work, so a
        heavily instrument-weighted batch can be exactly the right
        composition for a campaign with four deferred lanes -- which is
        why the record compares against the goals' blocking obligations
        rather than asserting a target ratio.
      falsification_condition: >-
        A campaign whose conclusions after execution do not follow the
        composition prediction.
      validation_plan: >-
        SAMPLE: this batch, classified after deduplication, compared
        against the goals' recorded blocking obligations. TAIL CHECK:
        multi-function records, which are where the classification is
        weakest. TRANSFER: none; the scoring describes this batch.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic classification; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent composition analysis exists for this program's batches.
    hidden_overhead: >-
      Self-classification by the batch's author is the dominant weakness
      and an independent pass would be materially stronger.
    tradeoff_note: >-
      A batch heavy on instruments unblocks later work and tests nothing
      now; one heavy on hypotheses tests things on instruments nobody has
      validated. The right mix depends on what the goals are blocked on,
      which is why the comparison is against them.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As science: nothing is claimed. As a
    composition analysis of this batch: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: this batch's composition by
    campaign function with record and cost shares, compared against the
    blocking obligations the ECC goals actually record, making visible
    whether the batch's heavy audit weighting is a deliberate response to
    blocked lanes or an accident of how it was generated.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that records classify cleanly enough for the shares to mean
    something. 0.9 that the nulls behave. 0.75 that the batch turns out
    heavily weighted toward instrument and process work, which given four
    deferred lanes may well be the right composition but should be decided
    on rather than discovered later.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
