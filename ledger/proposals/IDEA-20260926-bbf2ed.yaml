  falsification_conditions:
    - 'Stage 1 fails to reproduce RC-1: instrument defect, nothing read.'
    - 'Walsh/Arf count and exhaustive count differ at any quadratic cell: derivation (D) or the instrument is wrong; nothing read until localised.'
    - 'Oracle and closure disagree on any instance in any arm: instrument defect, nothing read.'
    - 'Trace/subspace closure-work ratio above 2 or trace refutation rate below the subspace rate at D <= 5, replicated at both n: H_cheap is false and the trace fibre is entered as dominated with the measured penalty.'
    - 'Koblitz trace arm and ordinary trace arm differ in per-attempt cost by more than 1.5x: the instrument reads the curve where the constraint is field-level; defect until explained.'
    - 'Relations per hit on the Koblitz cell not equal to n for the trace arm: the base is not Frobenius-stable as implemented; defect.'
  confounders:
    - >-
      The trace arm has n free bits per block against l for the subspace; the
      hybrid arm (U meet the zero set of k quadratic classes) at k in {1, 2, 3}
      isolates the marginal cost per constraint at fixed free bits, and the
      random-quadric arm matches free bits, count and degree.
    - 'At n = 17 the exact |V_{E_q}| may deviate from 512 by the Arf sum; all arms are matched to the MEASURED size within a factor 1.5, and the yield comparison is normalised by |F|^m.'
    - 'A general normal basis at n = 17 and 19 is not the type-2 ONB of n = 131; the multiplication tensor differs (IDEA-20260926-917981 names it as the live confound), so per-attempt cost at toy n does not transfer.'
    - 'The closure instrument reaches D <= 5; cubic classes (Cell C) and the m = 4 row need higher D in general; the extrapolation in |E| and in the cubic share is an assumption, stated.'
    - 'Cubic classes at n = 131 are 33 of the 98 constraints in one arm and all 98 in the other; the toy cells probe at most 3 cubic classes.'
  interpretation_limits:
    - 'A representation record priced at toy scale; no attack, no exponent, no run at n = 131; the n = 131 sizing is arithmetic plus H1.'
    - 'KN-OPEN-020 class declared high-degree implicit membership; the universal statement is untouched.'
    - 'Best case is a constant-factor gain (the shift overhead and the GGMP constants on a base that exists, with a lower constraint degree than the ball), disclosed under docs/target-result-profile.md rule A1 as building-block, not target-class.'
    - 'The exact size formula (D) covers quadratic E only; cubic classes are counted, never derived.'
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Size.) For E a set of |E| cyclotomic classes of 2-weight 2 or 3 with
        |E| <= n - 20, |V_E| = 2^{n - |E|} (1 + delta) with |delta| <= 1/2;
        at n = 131, |E| = 98, |V_E| is within a factor 1.5 of 2^33.
      rigorous_support: >-
        Rigorous ingredient: for quadratic E the exact formula of claim (D),
        |V_E| = 2^{131 - |E|} + 2^{66 - |E|} sum eps_c over even-weight
        c != 0, so |delta| <= 1 unconditionally and |delta| << 1 if the Arf
        signs are not strongly correlated. Classical statement imitated:
        equidistribution of the joint values of "independent" Boolean
        functions of degree <= 3 (the exponential sums of cubic Boolean
        functions are not controlled by a Weil-type bound at these
        parameters, exactly as IDEA-20260926-cafcf1 notes for the abscissa
        indicator; the risk is a structured Arf-sign or cubic-sum bias).
      validation_plan: >-
        SAMPLE: exhaustive counts at n in {17, 19, 23} for every quadratic E
        (all 2^8, 2^9, 2^11 subsets, seconds) and for 200 random cubic E per
        cell; the Walsh/Arf recount for every quadratic E; at n = 131,
        density estimates for |E| in {10, 15, 20, 25} from 2^30 uniform
        samples each (about 2^30 / 2^{|E|} hits; 32 expected at |E| = 25).
        COMPARISON: delta against 0 with the exact-formula spread for
        quadratic E and the binomial band for cubic E. TAIL: the largest
        |delta| over all subsets per cell, and the growth of max |delta| with
        |E|. TRANSFER: from |E| <= 25 to |E| = 98 at n = 131 is an
        extrapolation and is labelled so; the exact formula makes the
        quadratic contribution bounded but does not bound the cubic one.
    - id: H2
      statement: >-
        (Yield.) The number of m-fold decompositions of a uniform target over
        F = V_E-abscissae is |F|^m / (m! N) (1 + o(1)), as for a subspace base
        of the same size.
      rigorous_support: >-
        No rigorous bound; imitates the standard index-calculus yield
        heuristic (KN-FIND-007's yield conservation, cited through
        KN-FIND-aa2efc) applied to a non-linear set; the risk is additive
        structure in a trace fibre (a fibre of Phi_E is not closed under
        addition, but Tr(x^e) for e of weight 2 is a quadratic form, so
        fibres are "quadric-like" and could carry sumset bias).
      validation_plan: >-
        SAMPLE: exhaustive oracle at n in {17, 19}, m = 2, 200 targets per
        arm. COMPARISON: empirical rate against |F|^2 / (2N) and against the
        random-set arm. TAIL: the largest per-target multiplicity. TRANSFER:
        to n = 131 only as the same heuristic every m = 4 row already uses.
    - id: H3
      statement: >-
        (Half are abscissae.) |V_E meet x(E_0)| = |V_E| / 2 (1 + o(1)) for
        E not containing the class of 1, at n = 131.
      rigorous_support: >-
        Rigorous ingredient: x is an abscissa of E_0 iff Tr(x) = Tr(1/x)
        (IDEA-20260926-cafcf1, re-derived there); the density-1/2 statement
        imitates equidistribution of the Kloosterman-type indicator over the
        fibre, which the Weil bound does not control at these sizes.
      validation_plan: >-
        SAMPLE: exact count of abscissae in V_E at n in {17, 19, 23} for every
        quadratic E. COMPARISON: |V_E| / 2. TAIL: the largest deviation over
        E. TRANSFER: an assumption at n = 131, stated.
  target_complexity:
    time_exponent: >-
      No exponent is claimed. At m = 4, |E| = 98, the trace fibre inherits
      the m = 4 row's attempts column (about 2^30 with orbits) and per-attempt
      budget (2^30.6 orbit-reduced; 2^5.73 under the no-orbit product law at
      the floor-optimal l; about 2^11 under IDEA-20260926-4b65e3's proposed
      cap, unreviewed); the per-attempt cost is the open number and is
      unmeasured at n = 131.
    memory_exponent: >-
      Linear algebra on about 2^24.7 unknowns (|V_E| / 262), sparse rows of
      weight 4: GB-scale; the decomposition solve's memory is the Macaulay or
      SAT memory of a 4 x 131-bit system with 392 extra cubic equations,
      unmeasured.
    best_known: >-
      Matched rho at 2^60.8 (KN-FIND-aa2efc); the orbit-union subspace base at
      m = 4 with its 2^30.6 per-solve budget (analysis/frobenius-orbit-
      ecc2k130) and the Hamming ball (IDEA-20260926-b6cc43) are the sibling
      rows.
    hidden_overhead: >-
      The cubic classes needed beyond the 65 quadratic ones at n = 131, whose
      solver cost the toy cells probe only at k <= 3; and the size heuristic
      H1 at |E| = 98, which no instrument can check exactly; both disclosed.
    tradeoff_note: >-
      Relation collection is embarrassingly parallel; the base needs no
      table (membership is 98 trace evaluations), a memory advantage over a
      random-set base and neutral against a subspace base.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Estimate. Pure-Python instruments on the existing CERTBIN modules;
      seconds for sizes, minutes per arm for closure at n in {17, 19}, hours
