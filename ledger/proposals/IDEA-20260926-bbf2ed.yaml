  proof_search_map:
    bottleneck: >-
      The per-attempt decomposition cost under m x 98 trace-form constraints
      of degree <= 3 on 131 free bits per block, against the affine
      constraint of a subspace base of the same size, and against the
      cardinality constraint of the ball.
    baseline_embedding:
      parameter_slice: >-
        E empty is the whole field; E = {1} is the trace hyperplane
        {Tr(x) = 0} (KR-IC-f5c584's linear equation, an ordinary subspace);
        the RC-1 subspace cell (n = 17, l = 9, V = {deg < 9}) is the affine
        slice at matched size; the Hamming ball B_3 at n = 17 is the
        symmetric-function slice of the rotation-invariant family
        (IDEA-20260926-b6cc43 Cell A).
      reproduction_check: >-
        The instrument must reproduce RC-1's own statistics (KN-FIND-5a8d3e,
        DEC-20260926-cb4487) on RC-1's V before any trace cell is read; the
        exhaustive oracle must agree with the closure verdict on every trace
        instance; and for quadratic E the Walsh/Arf count of claim (D) must
        equal the exhaustive count exactly at every toy cell (a zero-tolerance
        instrument identity).
    observation_collision:
      observable: >-
        Per-attempt closure work (rows eliminated to certificate) and
        refutation rate at D <= 5, per factor-base arm, at matched |F|; the
        exact |V_E| per cell.
      distinct_preimage_search: >-
        A trace arm that looks dearer could be dearer because (i) the
        constraints have degree 2 or 3 (genuine H_dear), (ii) the block has n
        free bits instead of l, or (iii) the closure sees 98 extra equations.
        The random-quadric arm has the same free bits, the same count and the
        same degree with NO invariance, so trace versus random-quadric
        isolates invariance; the hybrid arm U meet V_{E'} (U a subspace of
        dimension l + k, E' k quadratic classes, k in {1, 2, 3}) holds the
        free-bit count at l + k and isolates the marginal cost per non-linear
        constraint; the ball arm at the same n gives the degree-4-versus-
        degree-2 comparison within the invariant family.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "x_i in V" (l affine bits per block) by "Phi_E(x_i) = 0"
          (n bits per block plus |E| equations of degree wt_2(e), each the
          ANF of Tr(x^e) in the chosen basis). Completeness: every
          decomposition over V_E is a solution. Soundness: every solution is
          re-verified by curve arithmetic. Transfer: any n with a normal
          basis, any E. Cost loss: the constraint degree and the larger
          block; both measured.
        predicted_gain: >-
          Removal of the one-hot shift blocks (KN-FIND-47da4e's 1.0-1.5x and
          the 131 shift bits per summand) and the GGMP constants on a base
          that exists at n = 131, with constraint degree 3 rather than the
          ball's 7; no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold |F| fixed and vary the description: subspace, trace spectrum,
          random quadrics, Hamming ball, random set. The random set
          (membership by table only) fixes the enumeration floor every arm
          must beat; the random-quadric set separates invariance from degree.
        predicted_gain: >-
          Separates "the trace fibre is a usable algebraic description" from
          "it is as opaque as a random set" and "its invariance is visible to
          the solver" from "it is not".
    quantifier_order: >-
      EXISTS a toy cell (n = 17, m = 2, E = all 8 quadratic classes, |V_E|
      within a factor 1.5 of 512) at which the trace arm's per-attempt
      closure work and refutation rate are measured against the subspace,
