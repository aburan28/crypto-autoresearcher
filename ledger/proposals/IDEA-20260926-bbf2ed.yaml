    Stage 0 (class counts, the radical argument, the Walsh/Arf formula) and
    the trace-form ANF builder with the exhaustive-versus-Arf size identity
    at n = 17, then Stage 1's RC-1 reproduction.
  next_gate: >-
    Coordinator decision on designing Cells A and B into an EXP-CERTBIN-*
