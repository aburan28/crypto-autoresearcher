  recommended_priority: medium
  priority_rationale: >-
    Constant-factor at best and disclosed as such, but it is a genuinely new
    object in the corpus, passes the lossy-projection test against a named
    Sigma, exists at n = 131 where the linear stable bases do not, carries an
    exact size instrument for its quadratic sub-family, and is measurable in
    minutes on installed instruments with four matched controls, in the same
    bands as the ball so the two are directly comparable. Its negative
    outcome is a measured obstruction, which is the closure standard.
