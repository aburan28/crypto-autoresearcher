      artifact: >-
        Any Stage 1, Walsh/Arf, oracle-versus-closure or Koblitz-versus-
        ordinary discrepancy; nothing is read.
    falsification_threshold: >-
      Fixed before any run: trace/subspace closure-work ratio outside [0.5, 2]
      or refutation rate below the subspace arm's at D <= 5 falsifies H_cheap;
      trace/random-quadric ratio outside [0.67, 1.5] at two n falsifies the
      solver-blindness prediction; Walsh/Arf count differing from the
      exhaustive count by any amount is an instrument defect.
    estimated_cost:
      implementation: medium
      compute: >-
        ESTIMATE, order of magnitude: seconds for the exhaustive sizes,
        minutes per arm for closure at 34-38 unknowns, hours for Cell C; whole
        grid under a few CPU-hours in pure Python.
    required_metrics:
      - 'size_exact per arm per cell, with the Walsh/Arf recount for quadratic E'
      - 'oracle_rate per arm per cell'
      - 'closure_work and refutation_rate at D <= 5 per arm'
      - 'relations_per_hit on the Koblitz cell (must be n for stable arms)'
      - 'certificate acceptance counts'
