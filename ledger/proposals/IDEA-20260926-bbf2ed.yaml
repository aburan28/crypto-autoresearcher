  minimal_test:
    design: >-
      CELL A. RC-1 exactly: n = 17, f = t^17 + t^3 + 1, ordinary curve
      A = 97044, B = 126251, m = 2, subspace V = {deg < 9} (|V| = 512),
      targets in the x(2E) subgroup as in EXP-CERTBIN-e94b27 (DEC-20260926-
      cb4487 SUPPORT). Trace arm on the same curve and field: E_q = all 8
      quadratic classes {2^j + 1 : j = 1..8}; V_{E_q} counted exhaustively
      over the 2^17 field elements and by the Walsh/Arf formula. Random-
      quadric arm: 8 random quadratic Boolean functions on F_2^17 (seeded),
      joint zero set counted exhaustively, trimmed or padded to match |V|
      within a factor 1.5 by re-drawing. Ball arm: B_3 of IDEA-20260926-b6cc43
      Cell A (|B_3| = 834). Random-set arm: |V_{E_q}| abscissae drawn
      uniformly, membership by table. Hybrid arm: U = {deg < 9 + k} meet the
      zero set of k quadratic classes, k in {1, 2, 3}.
      CELL B. Koblitz E_0 over F_{2^19}, reduction polynomial t^19 + t^5 + t^2
      + t + 1, order 4 * 130873 (IDEA-20260926-b48c9d's recursion; re-checked
      at setup), general normal basis, E_q = all 9 quadratic classes, against
      a random dimension-10 subspace; plus the BRIEF's ordinary n = 19 cell
      (A = 46693, B = 306147) as the no-Frobenius control. On the Koblitz cell,
      additionally count relations per hit (must be exactly 19 for the trace
      and ball arms).
      CELL C (secondary, if Cells A and B complete within budget). n = 17,
      m = 3, l = 6: E = 8 quadratic + 3 cubic classes (|E| = 11), trace arm
      versus the subspace {deg < 6} and 11 random forms of matched degrees;
      probes the cubic classes at 51 unknowns.
      Targets: 200 per arm per cell, seeds 2026092681.., recorded. Instrument:
      experiments/EXP-CERTBIN-e94b27/impl/ (gf2n.py, curve.py, macaulay.py
      generalised to n = 19 and to a supplied basis and to n free bits per
      block, closure.py with the trace-form ANFs added as extra rows,
      oracles_rc1.py for the exhaustive ground truth over V_E); a new
      trace-form ANF builder and Walsh/Arf counter, about 200 lines.
      `missing: WDSat / CaDiCaL` for a SAT arm with XOR reasoning, declared as
      a follow-up and not assumed.
      STAGE 0 (zero compute): re-derive the class counts, the radical
      argument and the Walsh/Arf formula; write the falsification bands.
      STAGE 1: instrument control -- run the unchanged RC-1 pipeline on RC-1's
      V and reproduce its recorded closure statistics (blocking).
      STAGE 2: sizes -- exhaustive |V_E| per cell and the Walsh/Arf recount
      for every quadratic E (must agree exactly).
      STAGE 3: exhaustive oracle on every arm (decomposition rate,
      certificates).
      STAGE 4: closure at D <= 5 on every arm; rows eliminated, refutation
      rate, certificate acceptance by the separate verifier; Koblitz relation
      count per hit.
      STAGE 5: three-row reading.
      OUTCOME TABLE. POSITIVE (H_cheap): trace/subspace closure-work ratio in
      [0.5, 2] with equal refutation rate at D <= 5, oracle rates equal across
      arms, Walsh/Arf identity exact, Koblitz relation count exactly n -- the
      trace fibre is entered in the CERTBIN factor-base-choice column as a
      Frobenius-stable base with no shift overhead and degree-3 constraints,
      and the n = 131 row is opened for the m = 4 solve question beside the
      ball. NEGATIVE (H_dear): ratio above 2 or refutation rate below the
      subspace arm's at D <= 5 -- the trace fibre is dominated by the subspace
      base at matched size; the obstruction is the measured penalty, recorded
      with its value and beside the ball's. ARTIFACT: Stage 1 fails to
      reproduce RC-1, or oracle and closure disagree on any instance, or the
      Walsh/Arf and exhaustive counts differ, or the Koblitz trace arm differs
      from the ordinary trace arm in per-attempt cost -- nothing is read.
      FALSIFICATION THRESHOLD, fixed before any run: the [0.5, 2] band and the
      equal-refutation-rate condition; the [0.67, 1.5] band for trace versus
      random quadrics.
      COST (estimate, order of magnitude): implementation medium (trace-form
      ANF builder, Walsh/Arf counter, basis-general descent with n free bits
      per block, a few hundred lines on the existing modules); compute low to
      medium -- the exhaustive counts are 2^17 and 2^19 trace evaluations,
      seconds; the closure at D <= 5 with 34 or 38 unknowns is minutes per arm
      in pure Python; Cell C at 51 unknowns may be hours -- an estimate, not a
      measurement.
    cell:
      curve: >-
        PRIMARY: RC-1, n = 17, f = t^17 + t^3 + 1, ordinary A = 97044,
        B = 126251. SECONDARY: Koblitz E_0 over F_2[t]/(t^19 + t^5 + t^2 + t
        + 1), order 4 * 130873 (re-checked at setup), and the ordinary n = 19
        cell A = 46693, B = 306147, h = 2.
      m: 2 (Cells A, B); 3 (Cell C)
      l: 9 at n = 17; 10 at n = 19; 6 at Cell C
      factor_base: >-
        V_E with E = all quadratic classes (8 at n = 17, 9 at n = 19); Cell C
        adds 3 cubic classes; controls as listed.
      targets: 200 per arm per cell, x(2E) subgroup targets on RC-1 as in EXP-CERTBIN-e94b27
      seeds: 2026092681.. one per instance, recorded
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (n = 17; generalised to n = 19)
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py (generalised to n free bits per block and a supplied basis)
      - experiments/EXP-CERTBIN-e94b27/impl/closure.py (trace-form rows appended)
      - experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py (exhaustive oracle over V_E)
      - 'NEW: trace-form ANF builder, Walsh/Arf size counter, normal-basis constructor (about 200 lines, pure Python)'
      - 'missing: WDSat / CaDiCaL (optional XOR-aware SAT arm)'
    procedure:
      - 1. Stage 0 derivations and bands; construct the normal basis and verify rotation = squaring.
      - 2. Stage 1 RC-1 reproduction on the RC-1 subspace V (blocking).
      - 3. Stage 2 exhaustive |V_E| and Walsh/Arf recount per quadratic E; sizes of every arm.
      - 4. Stage 3 exhaustive oracle per arm with certificates.
      - 5. Stage 4 closure at D <= 5 per arm; rows eliminated, refutation rate, verifier acceptance; Koblitz relations per hit.
      - 6. Stage 5 three-row reading; no extrapolation to n = 131 beyond arithmetic and H1.
    metrics:
      - name: size_exact
        unit: field elements
        definition: exhaustive count of V_E (and of every arm), and the Walsh/Arf recount for quadratic E
      - name: oracle_rate
        unit: fraction of targets
        definition: fraction of targets with at least one certified m-fold decomposition over the arm's base
      - name: closure_work
        unit: rows eliminated to certificate
        definition: operation count of closure.py to the first certificate (1 in W_D) on unsatisfiable targets, and to fixpoint on satisfiable ones
      - name: refutation_rate
        unit: fraction
        definition: fraction of oracle-unsatisfiable targets refuted at D <= 5 with a verifier-accepted certificate
      - name: relations_per_hit
        unit: integer
        definition: number of distinct conjugate relations obtained from one certified decomposition on the Koblitz cell
    controls:
      - >-
        Instrument control: RC-1 reproduced on the RC-1 subspace V before any
        trace cell (blocking).
      - >-
        Null object of the same shape: a random abscissa set of the same
        cardinality with table membership (enumeration floor).
      - >-
        Random-quadric arm: same count, degree and free bits, no invariance
        (isolates invariance).
      - >-
        Size-matched subspace arm (the RC-1 subspace V at n = 17; a random
        dimension-10 subspace at n = 19).
      - >-
        Hamming ball B_3 (IDEA-20260926-b6cc43 Cell A) as the other member of
        the invariant family.
      - >-
        Ordinary curve of the same n as the no-Frobenius control (V_E exists,
        the orbit reduction does not).
      - >-
        Relabelled Z/NZ control: not applicable to the per-attempt cost (a
        coordinate object has no Z/NZ analogue); applied to the yield metric
        only, where a random subset of Z/NZ of the same size must reproduce
        the oracle decomposition rate.
      - >-
        Certificates: curve-arithmetic verification of every decomposition
        and separate-process verification of every refutation.
    outcomes:
      positive: >-
        H_cheap band met on both n, Walsh/Arf identity exact, Koblitz
        relation count exactly n; the trace fibre joins the ball as a
        Frobenius-stable factor base at n = 131 in the CERTBIN column, with
