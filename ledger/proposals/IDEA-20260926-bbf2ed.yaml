    factor-base choice at n = 131 is decided once.
  discriminated_from: >-
    IDEA-20260926-b6cc43 (Hamming ball) is the symmetric-function member of
    the rotation-invariant family with one cardinality constraint of degree
    w + 1; this record's base is the trace-form member with many constraints
    of degree <= 3 and an exact size formula for its quadratic part.
    KN-FIND-47da4e and analysis/frobenius-orbit-ecc2k130 build orbit unions
    of subspaces with a shift index; this base is rotation-closed by
    construction. IDEA-20260926-a79052 and IDEA-20260926-cafcf1 use the e = 1
    trace condition as abscissa membership and yield audit; this record uses
    the e > 1 forms, which are not group morphisms, as the base description.
