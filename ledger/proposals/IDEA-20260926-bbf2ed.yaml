      - claim: At n = 131 there are exactly 65 quadratic classes and 2795 cubic classes; at n = 17 exactly 8 quadratic classes.
        responsibility: size
      - claim: The radical of every nonzero Q_c at n = 131 is {0, 1} and the Walsh/Arf count of claim (D) follows.
        responsibility: correctness
      - claim: The Walsh/Arf count equals the exhaustive count at every quadratic toy cell.
