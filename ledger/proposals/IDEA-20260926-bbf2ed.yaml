idea:
  id: IDEA-20260926-bbf2ed
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE TRACE-SPECTRUM FACTOR BASE AT n = 131: V_E = {x : Tr(x^e) = 0 for e in
    E}, E a set of 98 cyclotomic classes of 2-weight at most 3, is
    Frobenius-stable, of K-degree above 2^130 but ANF degree at most 3 after
    descent, with O(n) membership and heuristic size 2^33; priced by closure
    cost on RC-1 against a size-matched subspace, random quadrics, the Hamming
    ball and a random set
  class: representation
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (the abscissa as a field
    element; the object is basis-independent, and in a normal basis it is a
    rotation-invariant Boolean predicate on the coordinate vector). The attack
    stages whose charged cost changes are FACTOR-BASE MEMBERSHIP (98 trace
    evaluations instead of a subspace test or a one-hot shift search) and
    RELATION DECOMPOSITION (a descended system with 131 free bits per block
    and 98 equations of degree at most 3 per block instead of 33 free bits and
    no extra equations).
    (A) THE OBJECT. For an exponent e < 2^131 write wt_2(e) for its binary
    weight. The Boolean function x -> Tr(x^e) on F_{2^131} has algebraic
    (ANF) degree exactly wt_2(e) in any F_2-basis (standard; recalled), and it
    is Frobenius-invariant since Tr((x^2)^e) = Tr((x^e)^2) = Tr(x^e); in a
    normal basis, where squaring is the cyclic shift, it is therefore a
    rotation-invariant Boolean function. Conversely every rotation-invariant
    quadratic form in normal-basis coordinates is an F_2-combination of Tr(x)
    and the 65 Gold forms Q_j(x) = Tr(x^{2^j + 1}), j = 1..65 (j and 131 - j
    give the same class), and the cubic rotation-invariant forms are spanned
    by the 2795 = C(131,3)/131 cubic classes Tr(x^{1 + 2^i + 2^j}). So the
    natural degree-bounded, Frobenius-stable, non-linear factor bases on the
    x-line are the fibres of the PARTIAL TRACE SPECTRUM Phi_E : x -> (Tr(x^e))
    _{e in E}, and this record takes V_E = Phi_E^{-1}(0). Because only 65
    quadratic classes exist, a base of index-calculus size at m = 4 (|F| about
    2^33, so |E| = 98) needs cubic classes as well: E = all 65 quadratic
    classes plus 33 cubic classes, or 98 cubic classes; both are arms.
    (B) WHY IT IS THE OPEN CLASS OF KN-OPEN-020. As a polynomial predicate over
    K, Tr(x^e) = x^e + x^{2e} + ... + x^{2^130 e} has degree 2^130 e, so the
    Bezout-type bound of the bounded-degree theorem is vacuous by a margin of
    about 2^100 bits; after Weil descent the same predicate has degree
    wt_2(e) <= 3. This is exactly the "high-degree implicit description" that
    KN-OPEN-020 names as open, with every column charged in mechanism.
    (C) WHY IT EXISTS AT n = 131 WHERE THE LINEAR OBJECTS DO NOT. The only
    Frobenius-stable subspaces at n = 131 have dimensions 0, 1, 130, 131
    (IDEA-20260918-9abf42); orbit unions of subspaces need a one-hot shift
    index (KN-FIND-47da4e); the Hamming ball (IDEA-20260926-b6cc43) is the
    symmetric-function member of the rotation-invariant family with one
    constraint of degree w + 1 = 7 at the m = 4 radius. V_E is the OTHER end of
    the same family: many constraints of degree at most 3. It is a union of
    Frobenius orbits by construction, so the GGMP orbit reduction (KN-LIT-796,
    gain exactly n on relations and n^2 on linear algebra, verified at
    n = 131 in analysis/frobenius-orbit-ecc2k130 part D) applies with no shift
    encoding and no cardinality constraint.
    (D) SIZE, EXACTLY WHERE IT CAN BE EXACT. For E consisting of quadratic
    classes only, the joint zero count has a closed form. Let Q_c = Tr(sum_j
    c_j x^{2^j+1}) for c in F_2^E, with polar form B(x, y) = Tr(y L_c(x)),
    L_c(x) = sum_j c_j (x^{2^j} + x^{2^{131-j}}). The radical of Q_c is the
    kernel of L_c, a Frobenius-stable subspace, hence of dimension in {0, 1,
    130, 131}; L_c(1) = 0 always, and dimension 130 or 131 would need the
    associated polynomial sum_j c_j (Z^j + Z^{131-j}) to equal Phi_131, which
    has a constant term and it does not. So the radical is exactly {0, 1} for
    every c != 0, Q_c(1) = Tr(1) wt(c) = wt(c) mod 2, and by the standard
    evaluation of quadratic-form character sums (recalled) the Walsh sum
    W(Q_c) = sum_x (-1)^{Q_c(x)} is 0 for odd wt(c) and eps_c 2^66 for even
    wt(c), eps_c = +-1 (an Arf-type invariant). Hence
    |V_E| = 2^{131 - |E|} + 2^{66 - |E|} sum_{c != 0, wt(c) even} eps_c.
    The deviation from 2^{131 - |E|} is a signed sum of 2^{|E| - 1} - 1 Arf
    invariants; it is exactly computable for |E| <= about 25 (2^24 radical and
    Arf computations, each polynomial in n) and it is the second, independent
    size instrument at toy n for every quadratic E. For cubic classes no such
    formula is used; the size is the exhaustive count at toy n and heuristic
    H1 at n = 131.
    (E) THE CHARGED QUESTION, WITH TWO EXPLANATIONS. Fix the m = 4 row with
    |F| about 2^33 (|E| = 98). The attempts column is that of every
    |F| = 2^33 base at m = 4 (about 2^30 with orbits, analysis/qsp-ecc2k130/
    table.md row (33, 3, 4, 131) as cited by IDEA-20260916-a17f43); the
    per-attempt budget to tie rho is about 2^30.6 under the orbit-reduced
    accounting (analysis/frobenius-orbit-ecc2k130 README part 1) and 2^5.73
    under the no-orbit product law at the floor-optimal l (BRIEF-ROUND2
    section 1, N = 4r), with IDEA-20260926-4b65e3's per-target-cap
    recomputation (about 2^11 at m = 4) cited as a proposal, not a finding.
    The ONE open number is the per-attempt cost of a decomposition solve whose
    factor-base constraint is Phi_E(x_i) = 0 (98 equations of degree <= 3 on
    131 bits per block) instead of x_i in V (affine, 33 free bits per block).
    (H_cheap) The trace-spectrum constraints cost the closure instrument no
    more than the affine ones at matched |F| within a factor 2 and refute the
    same fraction of unsatisfiable attempts at D <= 5: V_E is then a
    Frobenius-stable base at n = 131 with no shift overhead and constraint
    degree 3 rather than 7, and the m = 4 row reads the orbit-reduced budget.
    (H_dear) The 131 free bits per block and the 98 non-linear equations make
    the Macaulay/mutant closure materially larger and the refutation rate at
    D <= 5 lower, by more than the factor 131 the orbit reduction returns: V_E
    is then dominated by the subspace base it replaces, with the measured
    penalty as the named obstruction. A THIRD reading is separated by the
    random-quadric arm: if the trace arm and an arm with the same number of
    RANDOM (non-invariant) quadratic forms cost the same, rotation invariance
    is invisible to the solver (as IDEA-20260926-917981's Proposition B
    predicts for the SET, here tested across two different sets) and its
    whole payoff is the exactly-n orbit gain; if the trace arm is cheaper by
    more than a factor 2 at two n, the closure sees the invariant structure,
    which would be the first such observation in this program and is
    replicated before it is read.
    WHAT EACH OUTCOME MEANS. Positive (H_cheap): the CERTBIN factor-base-choice
    column gets a second Frobenius-stable entry at n = 131 beside the ball,
    with the lower constraint degree; the n = 131 row is still bounded by the
    unmeasured S_5 solve in 131-bit unknowns and no exponent moves. Negative
    (H_dear): V_E is entered as dominated with the measured penalty, and the
    comparison with the ball's penalty (IDEA-20260926-b6cc43) says whether
    degree or free-bit count is what a Frobenius-stable non-linear base pays.
    Artifact: the exhaustive oracle disagrees with the closure verdict on any
    instance, the Walsh/Arf count disagrees with the exhaustive count, or the
    Koblitz and ordinary trace arms differ in per-attempt cost.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the abscissa x as a field element; the
    predicate Phi_E is basis-independent and is rotation-invariant in any
    normal basis (Bailey et al.'s type-2 optimal normal basis at n = 131, a
    general normal basis at toy n). Operation set Sigma = {sigma (Frobenius),
    negation} together with translation by factor-base elements INSIDE the
    decomposition -- the Class I partial action index calculus already has.
    Trichotomy: Class I, PARTIAL-ACTION for the tracked relation vector over
    V_E / <sigma, -1>, which propagates deterministically only under
    translation by elements of V_E, exactly as in every F2 line; the record
    introduces no new class. The factor-base DESCRIPTION Phi_E is itself a
    Class III coordinate-dependent object (a function of the representation
    of x, not of the group element) used as a description, which is the role
    docs/object-frame-ideation.md section 4 assigns to a factor base.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The FULL trace spectrum x -> (Tr(x^e))
    over all cyclotomic classes determines x up to Frobenius conjugacy (the
    sequence Tr(x^e) is a linear-recurring sequence whose minimal polynomial
    is that of x; recalled), so the full spectrum is the orbit canonicaliser
    and loses only the rotation index. The PARTIAL spectrum Phi_E retains
    |E| = 98 of those bits and discards 131 - 98 = 33 bits of the orbit
    (heuristically 2^33 orbits per fibre, 131 elements each). Sigma-compatible:
    sigma fixes every Tr(x^e); negation acts trivially on x. Lossy in the
    representation used: distinct orbits share a fibre. Both clauses hold;
    Phi_E is a genuinely lossy, Sigma-compatible projection of the
    x-coordinate, and V_E = Phi_E^{-1}(0) is one fibre.
    PRICE THE ONE OPEN NUMBER. Canonicalising a Sigma-orbit costs 131
    rotations and a lexicographic minimum (Bailey et al.'s normalisation),
    negligible. The number that decides the object is the per-attempt
    decomposition cost under the constraints Phi_E(x_i) = 0, measured in the
    minimal test against four controls.
    KN-OPEN-020 CLASS: HIGH-DEGREE IMPLICIT MEMBERSHIP. Description: the
    exponent set E, 98 exponents of 2-weight <= 3, about 98 x 24 bits, plus
    the field polynomial. Membership: 98 evaluations of Tr(x^e), each two
    multiplications of Frobenius powers plus a trace, about 300 field
    multiplications, target-independent. Relation: one decomposition solve of
    the descended S_{m+1} system with m x 131 bit unknowns and m x 98 extra
    equations of degree <= 3. Descent: the target's own decomposition, same
    system. Time and memory: linear algebra on about |V_E| / 262 unknowns of
    weight m (about 2^24.7 at |E| = 98, as for the ball), sparse, about 2^49
    field operations by Wiedemann, below rho; the decomposition solve is the
    only open column, as for every m = 4 row.
    OFF-LIMITS COMPONENTS DECLARED. F2 is the family. The GGMP orbit reduction
    (RQ-FROB-7d8dd4's lens) is a component; what is added is a base on which
    it applies with no shift encoding and with degree-3 constraints at the one
    degree where no stable subspace exists. KR-IC-f5c584's trace morphism
    (Tr(x), degree 1, a group morphism E -> F_2) is the e = 1 member of the
    family and is excluded from E or included as the abscissa-parity
    condition; the e > 1 forms are NOT group morphisms, which is why they can
    cut the base without cutting the group.
    WHY THE CURVE ENTERS. V_E is defined on the field; the curve enters through
    the abscissa condition Tr(x) = Tr(1/x) on E_0 (IDEA-20260926-cafcf1) and
    through the orbit structure of relations. The ordinary control curve of
    the same field has the same V_E and no sigma endomorphism; the difference
    between the two arms is the null object for anything the Koblitz
    structure appears to buy beyond the orbit reduction.
