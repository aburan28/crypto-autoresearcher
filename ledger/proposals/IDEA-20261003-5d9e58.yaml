# IDEA-20261003-5d9e58
# Equal model-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-5d9e58
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A Montgomery equation and a Weierstrass equation both have degree 3
  class: representation
  claim: >-
    A Montgomery equation has degree 3. A short-Weierstrass equation
    has degree 3. Their gap is 0. Their product is 9. Their sum is 6.
    The gap is an equation degree, not an ECDLP exponent and not a
    point count.
  mechanism: >-
    OBJECT FRAME. The object is the curve equation. The operation
    set is the group law written on that equation. Changing from
    Weierstrass to Montgomery keeps the equation degree. Two
    Montgomery equations both have degree 3, so that gap is 0 as
    well. No point is counted.
  novelty_status: unverified
  citations:
