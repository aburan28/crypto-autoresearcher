      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        Factor-base dimension is a different lever from an equation degree.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two degrees are frozen before the subtraction.
    - No point is counted.
  proof_search_map:
    bottleneck: The degree gap 0.
    baseline_embedding:
      parameter_slice: The degrees 3 and 3.
      reproduction_check: >-
        Two readers subtract and must agree that 3 minus 3 is 0.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting one equation as degree 4 drops the match. Two
        Montgomery equations make that gap 0.
    constructive_transforms:
