  minimal_test:
    design: >-
      Subtract 3 from 3 and multiply 3 by 3. Do not count rational points.
    controls:
      - Two Montgomery equations, whose degree gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 0.
    - The product of the two degrees is not 9.
  confounders:
    - Clearing a leading coefficient does not change the degree.
  interpretation_limits:
