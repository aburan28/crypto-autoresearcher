  assumptions:
    - >-
      gcd(deg phi, N) = 1, so logarithms transport exactly and condition (i) of the
      object definition is satisfiable at all.
    - >-
      The pinning in condition (ii) is EXOGENOUS -- imposed by a public
      specification or by the multi-curve sharing requirement -- and is not a
      constraint the attacker may relax. Where the attacker CAN relax it the object
      is free-log-set and IDEA-20260830-3e38ce Horn 1 applies instead. This is the
      single assumption on which the whole record's admissibility rests and it is
      stated first for that reason.
    - >-
      `rebuild_batch_seconds_min_of_7` in the committed runs is one scalar
      multiplication per entry. INFERRED from its ~12x ratio to the incremental
      column and its flatness in ell; NOT verified against the run's source code in
      this session. STEP 3 is the check and it is blocking.
    - >-
      A scalar multiplication by a Theta(log N)-bit integer costs ~1.5*log_2 N group
      operations and cannot be reduced below Theta(log N) for independent
      pseudorandom exponents. Batch addition-chain methods improve the constant, not
      the exponent.
    - >-
      Toy scale: log_2 N between 9 and 14 at the committed primes, S = 400. The
      dynamic range in log_2 N is a factor of 1.6, which is the binding power
      constraint on the regression in STEP 2 and is disclosed rather than assumed
      away.

  proof_search_map:
    bottleneck: >-
      Whether the pinning of condition (ii) is real or self-inflicted. If the
      builder on the target curve is always free to choose a cheaper log set, the
      object does not exist and the record is empty. Everything else -- the cost
      arithmetic, the crossover, the regression -- is mechanical once the object is
      granted.
    baseline_embedding:
      parameter_slice: >-
        The free-log-set object at the same parameters -- a consecutive-multiples
        table, S = 400, ell 3 to 31, both committed primes.
      reproduction_check: >-
        The identical pipeline must reproduce EV-ENDO-10109d's committed ratios
        (1.471 at ell=3 through 21.089 at ell=31) to within timing noise, and must
        report NO crossover for that object. A pipeline that finds a crossover for
        the free-log-set object is not distinguishing objects and every number it
        produces about the pinned object is uninterpretable.
    observation_collision:
      observable: "transport-to-rebuild ratio below 1 at small ell"
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. A ratio below 1 is produced by ANY
        artificially expensive rebuild -- an unbatched interpreter loop, a
        per-entry Python object allocation, a modular inverse per entry -- with no
        mathematics involved. That is precisely why the committed run labelled the
        column INFLATED_DO_NOT_CITE, and that label must be treated as a live
        alternative explanation rather than as an oversight to be corrected. The
        disambiguators are (a) STEP 3's requirement that the batch-to-incremental
        ratio RISE with log_2 N as a scalar multiplication must, and (b) STEP 4's
        replacement of wall clock by counted group operations. Reporting the
        sub-1 ratio without both is prohibited by this record.
    constructive_transforms:
      - transform: cost_reallocation
        proposed_object: >-
          Charge the rebuild at the cost of the log set the builder is actually
          required to produce, rather than at the cost of the cheapest log set any
          builder could produce.
        predicted_gain: >-
          Moves the rebuild baseline from Theta(1) to Theta(log N) group operations
          per entry, which is the entire content of the record. Attack gain: zero.
      - transform: stronger_invariant
        proposed_object: >-
          Index preprocessing objects by the pair (is the log set free, is the value
          encoding-dependent), giving four cells of which three are closed by
          IDEA-20260830-3e38ce and one -- pinned logs, free encoding -- is this one.
        predicted_gain: >-
          Makes the lane's answer a small table rather than a single verdict, and
          identifies the only cell in which a correctly charged transport is
          net-positive.
    quantifier_order: >-
      CLAIMED: FORALL log-pinned Class I objects and FORALL F_p-isogeny paths of
      composite degree with max step ell, EXISTS a crossover ell* = Theta(log N)
      below which transporting the table costs strictly less than rebuilding it,
      with the constant measured in-harness.
      EXPLICITLY NOT CLAIMED: that any deployed advice object is log-pinned; that
      the crossover survives at cryptographic scale (the fitted constant is a toy
      measurement); or that anything below S*T^2 = Omega~(N) is reachable. The
      DANGEROUS weaker reading, NOT claimed: EXISTS a table for which transport is
      cheaper -- which is trivially satisfiable by making the rebuild arbitrarily
      expensive, and which is exactly what the DO-NOT-CITE label was guarding
      against. The audit obligation is that the pinning is exogenous and declared
      BEFORE the cost comparison.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For a log-pinned Class I table at the tested parameters, the measured
        transport-to-rebuild cost ratio crosses 1 at ell* = X +/- CI, and ell* fits
        a slope of Y +/- CI against log_2 N." It can NEVER certify a single-instance
        attack speedup, anything below the CGK frontier, any statement about
        encoding-pinned objects (3e38ce Horn 2), or anything at cryptographic scale.
        Any summary dropping "log-pinned" is overclaiming under AGENTS.md rule 4 and
        is the specific misreading the DO-NOT-CITE label anticipated.
      nearby_object_control: >-
        THE FREE-LOG-SET OBJECT (consecutive multiples). The method must FAIL there
        -- no crossover, ratios reproducing EV-ENDO-10109d. BLOCKING.
      proof_obligations:
        - claim: "The log-pinned object satisfies neither antecedent of 3e38ce's pincer."
          responsibility: correctness
        - claim: "Rebuilding a pinned entry costs Theta(log N) group operations and no less."
          responsibility: correctness
        - claim: "The batch column measures one scalar multiplication per entry."
          responsibility: feasibility
        - claim: "ell* fits a nonzero slope against log_2 N."
          responsibility: success_probability
        - claim: "The free-log-set control shows no crossover."
          responsibility: baseline
        - claim: "The AT^2 recharge does not flip this comparison's sign."
          responsibility: soundness
        - claim: "sota_delta is zero on every attack axis."
          responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        ratio rebuild_batch / rebuild_incremental, regressed against log_2 N across
        all classes in the two committed sweeps
      direction: higher
      minimum_effect: >-
        A slope significantly greater than zero, consistent with alpha*c_G per bit.
        A FLAT ratio (the four inspected cells sat at 11.4-11.9 across log_2 N from
        9 to 14, which is close to flat) means the batch column is not a scalar
        multiplication per entry, READING 2 holds, and the rest of this record must
        not be interpreted. THIS IS THE FIRST NUMBER TO COMPUTE.
    - metric: >-
        transport-to-batch-rebuild ratio at the smallest tested ell (ell=3), per
        prime
      direction: lower
      minimum_effect: >-
        Below 0.20, as already recorded (0.129 at one inspected p=50021 cell). A
        value above 1 at ell=3 refutes the record outright.
    - metric: located crossover ell* against the batch-rebuild baseline
      direction: different
      minimum_effect: >-
        Finite and in [10, 40] at the committed parameters, predicted between ell=17
        and ell=23 from the inferred 11.7 factor. A crossover outside [5, 100]
        means the cost model in (C) is wrong by more than a factor 4 and must be
        redone before it is reported.
    - metric: fitted slope of ell* against log_2 N
      direction: higher
      minimum_effect: >-
        Significantly greater than zero with a CI excluding 0, over the log_2 N
        range 9 to 14 available in the committed data. A slope indistinguishable
        from zero is READING 2 and closes this cell as a harness artefact.
    - metric: >-
        crossover for the free-log-set nearby object (consecutive multiples)
      direction: different
      minimum_effect: >-
        MUST BE ABSENT, with ratios reproducing 1.471 to 21.089. A crossover there
        means the pipeline is not distinguishing objects and voids the run set.
    - metric: >-
        area-optimised AT^2 transport-to-rebuild ratio for the log-pinned object at
        ell=3
      direction: lower
      minimum_effect: >-
        Below 1, and on the SAME side of 1 as the work-model ratio. A sign flip
        here -- unlike in IDEA-20260830-da8950's Horn 1 comparison, where a flip is
        predicted -- would mean the depth model is wrong for one of these two arms,
        since both are wide and parallel across entries.
    - metric: >-
        single-instance attack cost against matched Pollard rho on the same instance
      direction: different
      minimum_effect: >-
        EXACTLY UNCHANGED. Any measured single-instance improvement is a
        falsification of the accounting, not a finding, and requires
        review-breakthrough scrutiny before any claim.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, AND IT IS THE WHOLE DISCRIMINATOR): STEP 1's parse and
      STEP 3's blocking check on data already committed. Read the batch column at
      every ell in both sweeps, compute the batch-to-incremental ratio per class,
      and regress it against log_2 N. If that ratio is flat, READING 2 holds, the
      record's live cell is a harness artefact, and the session ends there with a
      clean scoped negative that cost nothing. If it rises, continue.
      STAGE 1 (zero compute): STEP 2's regression of ell* against log_2 N, with CI.
      STAGE 2 (minutes): STEP 6's free-log-set nearby-object control, re-run on the
      same pipeline to confirm the committed ratios reproduce.
      STAGE 3 (minutes): STEP 4's replacement of wall clock by counted group and
      field operations for a declared log-pinned build (r_i = H(i) mod N), removing
      the interpreter from the comparison entirely.
      STAGE 4 (minutes): STEP 5's AT^2 recharge under both area conventions.
      STAGE 5 (zero compute): STEP 7's boundary note on Mode selection.
    controls:
      - >-
        FREE-LOG-SET NEARBY OBJECT: no crossover, ratios reproduce EV-ENDO-10109d.
        BLOCKING.
      - >-
        BATCH-COLUMN IDENTIFICATION: the batch-to-incremental ratio must rise with
        log_2 N. BLOCKING, and it runs first.
      - >-
        OPERATION COUNTS REPLACING WALL CLOCK, so that an interpreter artefact
        cannot produce the sub-1 ratio.
      - >-
        IDENTITY ARM ell=1: transport cost must be the copy cost and the ratio must
        be the rebuild's reciprocal exactly.
      - >-
        RANDOM-RELABELLING NULL: per-entry log certificates at the chance rate 1/N,
        against 400 of 400 for true transport, so that the arm being priced is a
        genuine transport.
      - >-
        Matched Pollard rho and BSGS rows on the identical instances, per the RQ,
        to make visible that the whole comparison is a build cost that is o(N)
        against the online phase.
    required_metrics:
      - per cell, all three committed timing columns and both derived ratios
      - per class, log_2 N, N, trace, table_size, ell ladder
      - per class, the batch-to-incremental ratio and its regression against log_2 N
      - per class, the located crossover ell* with its interpolation method stated
      - the regression of ell* against log_2 N with slope, intercept, CI and R^2
      - counted group operations per pinned rebuild entry and counted field operations per transported entry
      - AT^2 under both area conventions for both arms
      - pass/fail of every control, with the free-log-set control's reproduced ratios listed
      - per-entry transport certificates

  falsification_conditions:
    - >-
      The batch-to-incremental ratio is flat in log_2 N. The batch column is not a
      scalar multiplication per entry, the cost model in (C) has no empirical
      anchor, READING 2 holds, and the live cell is closed as a harness artefact.
      This is the most likely single outcome and it is a clean, cheap negative.
    - >-
      The located crossover ell* does not move with log_2 N. Same conclusion by a
      second route; the apparent win is not a log N effect.
    - >-
      The free-log-set control shows a crossover. The pipeline is not
      distinguishing the two objects and the entire run set is INVALID rather than
      negative.
    - >-
      Replacing wall clock by counted operations removes the sub-1 ratio. The win
