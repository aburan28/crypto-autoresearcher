idea:
  id: IDEA-20260830-4a88d9
  question_id: RQ-MTGT-2cabee
  added: '2026-08-30'
  title: >-
    THE LOG-PINNED TABLE IS THE ONE OBJECT BOTH HORNS MISS, AND THE COMMITTED RUN
    ALREADY CONTAINS ITS POSITIVE NUMBER IN A COLUMN LABELLED DO-NOT-CITE: when the
    logarithm set is fixed in advance -- by a public advice specification, or by
    the requirement that ONE index serve M curves of a class -- the entries are no
    longer re-choosable, so rebuilding costs one scalar multiplication per entry,
    Theta(log N) group operations, against Theta(ell) field operations to
    transport; the crossover is ell* = Theta(log N) rather than absent, and
    `transport_over_batch_rebuild` in RUN-MTGT-p50021sweep is 0.13 to 0.64 at the
    small ell -- transport ALREADY WINS at both committed primes -- so the decisive
    experiment is a ZERO-COMPUTE re-analysis of data this program has already paid
    for, regressing ell* against log_2 N across the classes in the sweep
  class: algorithm

  claim: >-
    (A) THE OBJECT, DEFINED SO THE CLAIM HAS EDGES. A LOG-PINNED preprocessing
    table is a set A = {(R_i, r_i)} on (E, P) with R_i = [r_i]P, in which
      (i) the value of A depends only on the (group element, logarithm) pairing --
          it is IDEA-20260807-e0ddc6's Class I, so transport preserves it exactly;
      (ii) the LOGARITHM SET {r_1, ..., r_S} is FIXED IN ADVANCE and may not be
          re-chosen by whoever builds the table on a second curve; and
      (iii) the r_i are not an arithmetic or geometric progression of small step,
          so the set is not chain-buildable.
    Two concrete sources of the pinning, neither a straw man. FIRST, a PUBLIC
    ADVICE SPECIFICATION: advice that must be independently derivable or verifiable
    against a published rule (r_i = H(i) mod N) cannot be replaced by a cheaper set
    of the builder's choosing. SECOND, AND THIS IS THE ONE THAT MATTERS FOR THIS
    RQ: the M-curve family amortisation of IDEA-20260807-a127ab requires ONE advice
    object to serve M classmates, which forces the SAME logarithm set on every
    member; once the set is chosen on E_1 -- and if it was chosen as
    Bernstein-Lange chooses it, as pseudorandom walk endpoints -- it is pinned on
    E_2 through E_M.

    (B) WHY BOTH HORNS OF THE CLOSURE MISS IT, STATED AS THE EXACT FAILING STEPS.
    IDEA-20260830-3e38ce closes Mode A transport by a two-horn pincer.
      HORN 1 (pairing-valued objects) rests on the step "the entry set is
      re-choosable, so build the arithmetic progression at one group operation per
      entry". CONDITION (ii) DENIES THAT STEP.
      HORN 2 (encoding-pinned objects) rests on the step "the value predicate is a
      condition on the encoding, which phi destroys, and repairing it costs a fresh
      build". CONDITION (i) DENIES THAT STEP -- there is no encoding predicate to
      repair, because logarithms transport exactly.
    The log-pinned object satisfies neither antecedent. It is 3e38ce's own OPEN-1,
    named there and priced here.

    (C) THE CHARGED COMPARISON, WITH THE TRANSPORT COST INCLUDED. Per entry:
      REBUILD. Compute [r_i]P' for the pinned r_i on the target curve. With
        double-and-add this is ~1.5*log_2 N group operations; with a shared
        addition chain across the S entries it improves by a constant, never by an
        exponent, because each r_i is an independent Theta(log N)-bit integer. Cost
        c_rebuild = alpha * log_2 N * c_G field operations, alpha ~ 1.5, c_G the
        measured field-operations-per-group-operation constant.
      TRANSPORT. One Velu evaluation of the composite phi, c_transport = c_V*L*ell
        field operations, plus a once-per-path C_build charged over all S entries.
      CROSSOVER. Transport wins iff c_V*L*ell < alpha*c_G*log_2 N, i.e.
        ell* = (alpha*c_G/(c_V*L)) * log_2 N.
      SO THE CROSSOVER EXISTS, IT IS LINEAR IN log_2 N, AND IT IS THE FIRST
      CROSSOVER ANYONE IN THIS LANE HAS BEEN ABLE TO PLACE. Unlike Horn 1, where
      the rebuild is one group operation and no crossover can exist, and unlike
      Horn 2, where the saving is a vanishing fraction, here the two costs are
      Theta(ell) against Theta(log N) and cross.

    (D) THE COMMITTED RUN HAS ALREADY MEASURED IT AND LABELLED IT DO-NOT-CITE.
    RUN-MTGT-p50021sweep and RUN-MTGT-p60013sweep record THREE cost columns per
    cell, not two: `transport_seconds_min_of_7`,
    `rebuild_incremental_seconds_min_of_7` (one addition per consecutive multiple)
    and `rebuild_batch_seconds_min_of_7` (about 12x larger and flat in ell -- one
    scalar multiplication per entry). The derived ratio against the batch column is
    stored as `transport_over_batch_rebuild_INFLATED_DO_NOT_CITE` and takes the
    values 0.129, 0.273, 0.379 and 0.638 at the four p=50021 cells inspected this
    session, against 1.471, 3.242, 4.765 and 7.278 for the same cells' incremental
    ratio -- a constant factor of 11.4 to 11.9 between the two columns. THE
    DO-NOT-CITE LABEL IS CORRECT FOR THE OBJECT THAT RUN TRANSPORTED (a
    consecutive-multiples table, for which the incremental rebuild is the honest
    baseline) AND IS EXACTLY WRONG FOR A LOG-PINNED OBJECT, for which the batch
    column IS the honest baseline. Read that way the committed data says:
    TRANSPORT ALREADY WINS AT SMALL ell AT BOTH COMMITTED PRIMES, by up to 7.7x at
    the smallest tested ell, and the empirical crossover sits where the incremental
    ratio reaches ~11.7, i.e. between ell = 17 (11.31) and ell = 23 (15.62).
    THIS IS AN INFERENCE FROM COMMITTED NUMBERS, NOT A NEW MEASUREMENT, and the
    minimal test below is to read the batch column off directly per ell instead of
    inferring it from the constant factor.

    (E) THE DISCRIMINATION, WHICH IS THE POINT AND WHICH COSTS NOTHING. Two
    mutually exclusive readings, separated by a regression on data already on disk.
      READING 1 -- THE CROSSOVER IS A log N EFFECT. ell* fitted against log_2 N
      across the classes in the committed sweeps (log_2 N ranges from 9 to 14
      WITHIN a single sweep) has a slope significantly greater than zero and an
      intercept near zero. Then (C)'s model is right, the log-pinned cell is
      genuinely live, ell* extrapolates to Theta(log N) -- hundreds at
      cryptographic size -- and the lane has one regime that is net-positive when
      correctly charged.
      READING 2 -- THE CROSSOVER IS FLAT IN log_2 N. Then the batch column is not
      measuring a scalar multiplication per entry, the model in (C) is wrong, and
      the apparent win is an artefact of the harness's batching. The
      DO-NOT-CITE label was protecting against exactly this and would be vindicated.
    Both outcomes are deliverables and both are decided by the same regression.

    (F) WHAT IS NOT CLAIMED, AND IT IS MOST OF THE RECORD. The sota_delta is ZERO
    on every attack axis. This is a comparison between two ways of OBTAINING an
    advice table, both of which cost o(N); the online phase is unchanged at
    1.77*N^{1/3}, the operating point stays on S*T^2 = Omega~(N) (KN-TECH-005), and
    no single-instance attack improves. The nonzero delta lives on the M-curve
    family advice axis already recorded by IDEA-20260807-a127ab, whose deployed
    relevance IDEA-20260807-e41559 reports as zero known instances. What this record
    adds is that a127ab's Mode A is not uniformly dominated after all -- it is
    dominated for free-log-set objects and NOT dominated for pinned-log-set
    objects, with the boundary at ell* = Theta(log N).

  mechanism: >-
    STEP 1 (zero compute, THE WHOLE MINIMAL TEST). Parse the two committed
    raw-result JSON files. For every cell extract p, N, log_2 N, ell, table_size,
    the three timing columns, and the two derived ratios. Compute per cell the
    batch-to-incremental ratio (predicted ~ alpha*log_2 N*c_G, hence rising with
    log_2 N) and the transport-to-batch ratio. Locate, per class, the ell at which
    transport-to-batch crosses 1, by interpolation on the ell ladder. NOTHING IS
    RE-RUN AND NOTHING IS SOLVED.
    STEP 2 (zero compute). Regress the located ell* against log_2 N across all
    classes in both sweeps. Report slope, intercept, confidence interval and R^2.
    This is the READING 1 / READING 2 discrimination of claim (E).
    STEP 3 (zero compute, BLOCKING CONSISTENCY CHECK). The batch-to-incremental
    ratio must itself rise with log_2 N with a slope consistent with alpha*c_G. If
    that ratio is FLAT in log_2 N -- it appeared close to constant at ~11.4-11.9
    across the four p=50021 cells inspected, which spanned log_2 N from 9 to 14 --
    then the batch column is not one scalar multiplication per entry, READING 2
    holds, and STEP 2's regression must not be interpreted. THIS CHECK IS THE
    RECORD'S OWN MOST LIKELY FALSIFIER AND IT RUNS FIRST.
    STEP 4 (minutes, only if STEP 3 passes). Instrument a genuine log-pinned build
    -- r_i = H(i) mod N for a declared H -- and measure group operations per entry
    directly, rather than inferring them from wall clock. Compare against the
    transport's measured field operations per entry. Report the crossover from
    operation counts, not seconds.
    STEP 5 (minutes). The AT^2 recharge of the same comparison under both area
    conventions of IDEA-20260830-da8950: the log-pinned rebuild has depth
    Theta(log N) per entry and is parallel across entries; transport has depth
    Theta(log ell) and is parallel across entries. Both arms are wide, so unlike
    Horn 1 the AT^2 recharge should NOT flip this comparison's sign -- predicted
    AT^2 ratio ~ (ell*log ell)/(log N * log log N), crossing 1 at
    ell* ~ log N * log log N / log ell. Report it; a sign flip here would mean the
    depth model is wrong for one of the arms.
    STEP 6 (zero compute, BLOCKING NEARBY-OBJECT CONTROL). The FREE-LOG-SET object.
    The same pipeline applied to a consecutive-multiples table MUST reproduce
    EV-ENDO-10109d's negative (ratio 1.47 at ell=3 to 21.09 at ell=31, no
    crossover). If the pipeline reports a crossover for the free-log-set object
    too, it is not distinguishing the two objects and every number is void.
    STEP 7 (zero compute). Write the boundary: the M-curve family accounting of
    IDEA-20260807-a127ab is unchanged in its conclusion (zero single-instance
    delta) but its MODE selection changes -- Mode A is admissible for log-pinned
    objects below ell*, and Mode B remains dominant above it.

  novelty_status: unverified

