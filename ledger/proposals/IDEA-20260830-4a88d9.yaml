  heuristic_assumptions:
    - id: H1
      statement: >-
        SCALAR-MULTIPLICATION FLOOR FOR PINNED ENTRIES. For a log set
        {r_1, ..., r_S} of independent uniform elements of Z/N, computing
        {[r_i]P'} on a target curve costs Theta(S*log N) group operations, and no
        algorithm reduces the per-entry cost below Theta(log N / log log N) even
        with unbounded shared precomputation across the S entries.
      rigorous_support: >-
        The upper bound is the standard double-and-add at ~1.5*log_2 N additions per
        entry, and the shared-window improvement gives log N / log log N, which is
        the classical Pippenger/Yao multi-exponentiation bound -- rigorous. The
        LOWER bound is the heuristic half: it is the addition-chain lower bound
        log_2 r + (1 - o(1))*log_2 r / log_2 log_2 r for almost all r, which is a
        genuine theorem of Erdos for SINGLE chains but is only heuristically
        transferred to the S-entry shared-chain setting here. The classical
        distribution theorem it imitates is the Erdos addition-chain length
        distribution for random exponents.
      validation_plan: >-
        SAMPLE: at p in {50021, 60013} and one prime near 2^{20}, count group
        operations for {[r_i]P} with r_i = H(i) mod N, S in {100, 400, 1600}, under
        three implementations -- naive double-and-add, fixed-window with a shared
        precomputed table, and Pippenger bucketing. PREDICTED DISTRIBUTION: per-entry
        group-operation counts concentrated near 1.5*log_2 N, 1.15*log_2 N and
        log_2 N/log_2 log_2 N respectively, each within 10%. TAIL CHECK: the maximum
        per-entry count against the Erdos-predicted chain-length distribution, since
        a heavy tail would indicate the exponents are not behaving as random. DECAY
        PARAMETER: S -- the shared-precomputation saving must GROW with S and
        saturate at the Pippenger bound; a saving that does not grow with S means
        the implementation is not sharing and the floor is being measured too high,
        which flatters this record and must be corrected. TRANSFER ASSUMPTION: none
        beyond the sampled p and S.
    - id: H2
      statement: >-
        TRANSPORT COST LINEARITY. The measured per-entry transport cost is
        c_V*L*ell + O(1) field operations with c_V a constant independent of p and
        of the class, so that the crossover condition c_V*L*ell = alpha*c_G*log_2 N
        has a unique solution linear in log_2 N.
      rigorous_support: >-
        The Velu linear-in-ell work count is relayed at second hand
        (IDEA-20260807-a127ab relaying KN-LIT-780, a bulk-seeded entry marked "not
        verified here") -- confidence: reported. The EMPIRICAL support is direct and
        is the stronger of the two: the committed `transport_over_correct_rebuild`
        column is 1.471, 3.242, 4.765, 7.278, 9.000, 11.310, 15.622, 21.089 at
        ell = 3, 5, 7, 11, 13, 17, 23, 31, which is close to linear in ell with
        slope ~0.68 and small intercept.
      validation_plan: >-
        SAMPLE: regress the committed transport times against ell at each prime --
        ZERO COMPUTE, the data is on disk. PREDICTED: linear with R^2 > 0.99 and an
        intercept consistent with the once-per-path construction amortised over 400
        entries. TAIL CHECK: extend the ladder to ell in {41, 53, 61, 71} and
        confirm the fit does not break, since a quadratic term would move the
        crossover. CROSS-CHECK: c_V recovered from the fit must agree within a
        factor 2 with the 6*ell field operations relayed from KN-LIT-780; a
        disagreement larger than that indicts the relayed constant, which is
        useful information for every record in this lane.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT MOVES. Online phase 1/3 in N (Bernstein-Lange), unchanged.
      The record concerns the OFFLINE per-entry cost of obtaining a pinned table on
      a second curve: Theta(ell) field operations by transport against
      Theta(log N) group operations by rebuild, both o(N^{1/3}) per entry and both
      giving a total table cost of o(N^{2/3}). For the FULL preprocessing phase the
      exponent falls from 2/3 (Bernstein-Lange's 1.24*N^{2/3}) to 1/3 plus a log
      factor when a table already exists on a classmate and is merely transported --
      a preprocessing-time exponent statement, not an attack-time one, and it is the
      only exponent this record touches.
    memory_exponent: >-
      1/3 in N, identical in both arms; the table is stored either way and no new
      store is introduced. Per-worker memory is O(1) in both arms, which is why the
      AT^2 recharge is predicted not to flip this comparison.
    best_known: >-
      Bernstein-Lange at table N^{1/3}, precomputation 1.24*N^{2/3} multiplications,
      online 1.77*N^{1/3} (retrieved); CGK frontier S*T^2 = Omega~(N) (KN-TECH-005,
      KN-LIT-013); parallel rho 0.886*sqrt(N) at O(1) memory (KN-TECH-001,
      KN-TECH-006); automorphism-discounted rho, at most sqrt(6) (KN-TECH-018);
      BSGS sqrt(N)/sqrt(N), full cost N^{2/3+o(1)} (KN-TECH-031, KN-TECH-035);
      Kuhn-Struik multi-target rho sqrt(M*N). THIS RECORD BEATS NONE OF THEM. The
      RQ's other named baseline, "Mihailescu", has no record in this corpus and a
      web search this session surfaced only MIHALCIK 2010 in the preprocessing
      literature; no claim here rests on it.
    hidden_overhead: >-
      Disclosed. (1) The preprocessing-exponent statement above holds only when a
      table ALREADY EXISTS on a classmate; building the first one still costs
      1.24*N^{2/3}, so the 2/3-to-1/3 drop is an amortisation across curves and not
      a construction speedup, and quoting it without that condition would be the
      lane's characteristic overclaim. (2) C_build is excluded from the per-entry
      comparison at S = 400 and would dominate at small S. (3) The whole crossover
      rests on H1's scalar-multiplication floor, which is rigorous as an upper bound
      and heuristic as a lower bound. (4) The empirical anchor is wall-clock timing
      in an interpreter, and STEP 4 exists because that anchor is weak.
    tradeoff_note: >-
      No new time-memory point is produced; both arms land on the same operating
      point of the same frontier. What changes is which of two constructions reaches
      it more cheaply, as a function of ell and log N. Parallelization position:
      both arms are embarrassingly parallel across the S entries with O(1) memory
      per worker -- the pinned rebuild is S independent scalar multiplications and
      the transport is S independent Velu evaluations -- so unlike
      IDEA-20260830-da8950's Horn 1 comparison, where a deep chain faces a shallow
      map, this comparison is between two wide shallow computations and its sign is
      predicted to be model-robust. That prediction is itself tested in STEP 5.

