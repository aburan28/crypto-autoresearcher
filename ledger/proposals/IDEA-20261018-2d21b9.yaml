idea:
  id: IDEA-20261018-2d21b9
  title: Learned Groebner orderings (HATSolver) on Semaev and PKM systems
  class: algorithm
  question_id: RQ-DREG-bd6c86
  area: DREG
  goal_ids:
  - GOAL-DREG-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: A learned monomial/variable ordering in the style of HATSolver (arXiv 2512.14722) lowers the
    counted cost of msolve/F4 on Semaev and PKM cells by at least 2x against the default order on at least
    half of held-out cells, without changing any answer.
  mechanism: 'Constant-factor lever: ordering changes intermediate degrees and fill. The ml-cryptanalysis
    tooling can train on small cells and be applied to held-out larger cells; the M7/M9 predictors there
    are null beyond size, so the ordering must be validated, not assumed.'
  novelty_status: unverified
  regime: binary and prime degree cells; constant-level; cheap given the ml-cryptanalysis tooling
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.6 bullet 3
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: arXiv:2512.14722 (HATSolver)
    provenance: recalled
    claim: Learned Groebner orderings; cited in the review as surfaced, not re-opened.
    verified_by: idea-generator
  - ref: ml-cryptanalysis:experiments/hardness/report.md; experiments/fpn-degrees/report.md
    provenance: internal
    claim: Predictors null beyond size and the planted law; degree labels agree with the Macaulay bound
      on 5,592/5,592 rows.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-0d2021
    - KR-IC-f3da82
    nearest:
    - ref: KR-IC-0d2021
      provenance: internal
      relation: adjacent
      delta: Solving-degree refinements; learned ordering is an engineering lever on the same systems,
        not a degree theory.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Train and test split is by cell family (field-family split), never by instance.
  - Only counted cost is scored; wall-clock is not the unit.
  predictions:
  - metric: counted_cost_ratio_learned_over_default
    direction: lower
    minimum_effect: Below 0.5 on at least half of held-out cells, interval excluding 1.
  - metric: answer_agreement
    direction: higher
    minimum_effect: 100% identical solution sets.
  minimal_test:
    design: Train the ordering policy on small cells, freeze it, apply to held-out Semaev and PKM cells
      with msolve/F4 against default and a random-order control; compare counted cost.
    controls:
    - default order
    - random order
    - split by field family
    - A/A repeat
    required_metrics:
    - counted cost
    - intermediate degree reached
    - peak memory
    - answer agreement
  falsification_conditions:
  - Median ratio >= 0.5 or interval including 1 refutes the 2x claim.
  - A win that disappears on the field-family split is leakage, not a result.
  confounders:
  - size-only signal
  - msolve heuristics
  - training-set leakage
  interpretation_limits:
  - Constant factor; counts as an improvement only if it moves a verified end-to-end S.
  heuristic_assumptions:
  - id: H1
    statement: Ordering quality on small cells transfers to larger cells of the same family.
    rigorous_support: HATSolver reports transfer in its own setting (recalled, unverified).
    validation_plan: Evaluate on a size-held-out split.
  target_complexity:
    time_exponent: Constant-factor only; no exponent change.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low-medium
    compute: low
  recommended_priority: low
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: None measured.
