idea:
  id: IDEA-20260808-f332da
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDSA-87625f
  goal_id: GOAL-ECDSA-001
  title: 'Charge the Bleichenbacher range reduction''s memory under the program''s own Wiener
    theta = 1/3 convention and the optimal merge depth k MOVES: the full-cost optimum is not
    the time optimum, the shift is computable in closed form from the same (k, s, t) constraints,
    and this is the concrete artifact that binds GOAL-ECDSA-001 to GOAL-RSA-001''s charging
    convention as both goals'' non_duplication clauses require'
  class: algorithm
  claim: "SCOPE. Class BD as defined in X1-02; single victim key; exact l-bit leakage. A COST-MODEL\
    \ AND ALGORITHM-SELECTION CLAIM. No key is recovered at deployed size and no exponent\
    \ of any hard problem moves.\nTHE CLAIM. Under the Wiener three-dimensional wiring model\
    \ that this program already declares (KN-TECH-035: a table of S entries imposes a clock\
    \ cycle tau = S^{1/3}; KN-TECH-057 applies it as full cost = W * tau), the full cost of\
    \ a class-BD attack is\n  FC(k, s) = [ 2^{k+s} + t * 2^t ] * max(2^s, 2^t)^{1/3},   t\
    \ = N - k*s,\nsubject to the detection constraint s >= 1.3028 * 2^k at l = 1. Then:\n\
    P1. The time-optimal and full-cost-optimal parameters DIFFER. Specifically\n    the full-cost\
    \ optimum shifts s UPWARD and t DOWNWARD relative to the\n    balanced point s = t, because\
    \ the FFT table and the list store are\n    charged the same 1/3 power but the FFT contributes\
    \ an extra factor t\n    to the step count. The shift is computed in closed form in Stage\
    \ 1.\nP2. The full-cost-optimal merge depth k* is LESS THAN OR EQUAL TO the\n    time-optimal\
    \ k_max, and strictly less for at least one (N, l) cell in\n    {160, 256, 384} x {1,\
    \ 2, 3}. A deeper tree buys reduction bits but\n    costs bias, and once memory is charged\
    \ the reduction bits are worth\n    less.\nP3. The full-cost penalty relative to uncharged\
    \ accounting is exactly\n    (1/3) * min(s, t)... no: exactly (1/3) * log2 max(2^s, 2^t)\
    \ bits,\n    which at the balanced point is N/(3(k+1)) bits — DERIVED: at\n    N = 256,\
    \ k = 5 that is 14.2 bits of full cost that a time-only\n    report omits.\nP4. THE BINDING\
    \ ARTIFACT. The same theta appears in GOAL-RSA-001's\n    H-RSA-68884a as the linear-algebra\
    \ charging exponent. Reporting both\n    lanes at theta = 1/3 with memory beside time\
    \ is a single convention;\n    the deliverable is a one-page statement of it that both\
    \ goals cite.\n\nTHE DISCRIMINATOR. If P2 holds — the charged optimum uses a shallower\
    \ tree — then memory charging changes WHICH ATTACK IS BEST INSIDE the Fourier family,\
    \ before any comparison with the lattice family is even attempted, and every published\
    \ Fourier row is off its own charged optimum. If P2 fails (k* = k_max at every cell) then\
    \ memory charging is a monotone rescaling within this family, the published parameter\
    \ choices are already charged-optimal, and the interesting question moves entirely to\
    \ the between-family comparison. Both outcomes are informative and both are stated in\
    \ advance."
  mechanism: 'DERIVED IN-REPO. The ingredients are X1-02''s constraint pair and KN-TECH-035''s
    wiring exponent, both in-corpus and read.

    WHY MEMORY IS NOT FREE HERE AND WHY IT IS THE RIGHT PLACE TO LOOK. KN-TECH-057 states
    the rule sharply: an algorithm with per-processor storage O(1) has tau = O(1) and its
    full cost equals its step count, while an algorithm holding a shared table of S entries
    pays tau = S^{1/3}. A Bleichenbacher pipeline holds TWO large shared objects — the merge
    lists (2^s entries) and the FFT table (2^t entries) — and touches the FFT table in a pattern
    (butterfly) that is the opposite of amortized. So it is squarely on the charged side of
    KN-TECH-057''s dichotomy, in the same position as MITM and BSGS, and NOT in van Oorschot-Wiener''s
    exempt position. THIS PLACEMENT IS THE MECHANISM AND IT IS ARGUED, NOT ASSUMED.

    WHY THE OPTIMUM MOVES. Uncharged, the objective is 2^{k+s} + t 2^t with t = N - ks; the
    merge term grows in s and the FFT term shrinks, giving the balanced s = t. Charged, multiplying
    by max(2^s,2^t)^{1/3} penalizes the LARGER of the two objects, which breaks the symmetry
    of the balance and pushes the optimum toward equalizing a DIFFERENT quantity — 2^{k+s}
    * 2^{s/3} against t 2^t * 2^{t/3}. Taking logs, the crossover moves from s = t to k +
    4s/3 = t + log2 t + t/3, i.e. k + 4s/3 = 4t/3 + log2 t. With t = N - ks this is one linear
    equation in s for each k and is solved exactly in Stage 1. DERIVED SANITY CHECK at N =
    256, k = 5, ignoring log2 t: 5 + 4s/3 = 4(256-5s)/3 gives 15 + 4s = 1024 - 20s, s = 42.04,
    t = 45.8 — so charging moves s DOWN slightly and t UP relative to the balanced 42.67/42.67.
    Note this contradicts my own P1 direction statement above at this cell; THE DIRECTION
    IS THEREFORE NOT ASSERTED AND IS A STAGE-1 OUTPUT. Recording the contradiction rather
    than quietly fixing it is the point: the sign of the shift is exactly what the experiment
    is for, and a proposal that got it right by assertion would have no content.

    THE MEET-IN-THE-MIDDLE ANGLE, STATED AND ITS PRIOR ART NAMED. The merge tree is already
    a claw/MITM decomposition. The question a memory charge raises is whether a MEMORY-REDUCED
    k-list algorithm — the Schroeppel-Shamir four-list technique and its dissection generalizations
    — lowers FC by trading memory for time at a better rate than the 1/3 exponent charges.
    FROM MEMORY AND EXPLICITLY UNVERIFIED (web access failed this session): Bernstein has
    a note titled approximately "Better price-performance ratios for generalized birthday
    attacks" (SHARCS-era) that does exactly this for Wagner''s algorithm, and Dinur-Dunkelman-
    Keller-Shamir''s "dissection" (CRYPTO 2012) gives memory-efficient k-sum algorithms. IF
    EITHER ALREADY CONTAINS THE CHARGED OPTIMISATION FOR THE BLEICHENBACHER SETTING, THIS
    IDEA IS DOWNGRADED TO AN APPLICATION AND SAYS SO. Checking those two references is the
    first Stage-0 action and is the cheapest possible falsifier of the novelty claim.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN METHOD: parameter selection for generalized-birthday
    range reduction, which every Bleichenbacher implementation does — by minimizing TIME or
    by fitting available RAM. The difference is that this minimizes a DECLARED full-cost functional
    with a stated wiring exponent, and reports the shift between the two optima as the deliverable.
    The second difference is scope: the same functional, at the same theta, is applied in
    GOAL-RSA-001, so the two lanes become comparable — which is the explicit non_duplication
    requirement of both goal records and which no existing record in this program discharges.
    Against IDEA-20260805-411b0e / H-ECDSA-a23475: those charge PUBLISHED ROWS under five
    discrete conventions (T, M, A*T, A*T^2, acquisition). A*T and A*T^2 are NOT the Wiener
    functional; W * S^{1/3} is a different shape, and it is the shape this program has already
    adopted for isogenies (KN-TECH-057). Using two incompatible memory charges in one program
    is exactly what GOAL-ECDSA-001.non_duplication warns against, and this record is the reconciliation,
    not a sixth convention.'
  predictions:
  - observable: sign and size of the shift (s*, t*) minus the balanced point, per (N, l) cell
    metric: bits, signed
    predicted: NON-ZERO in at least 6 of the 9 cells in {160,256,384} x {1,2,3}, with |shift|
      between 1 and 6 bits. SIGN NOT PREDICTED — the hand computation above gives a negative
      s-shift at (256,1) while the heuristic argument suggested positive, and that disagreement
      is the experiment. A zero shift in all 9 cells refutes P1.
  - observable: charged-optimal merge depth k*
    metric: integer, versus k_max from X1-02
    predicted: k* <= k_max in all cells, and k* < k_max in at least one.
  - observable: full-cost penalty omitted by a time-only report
    metric: bits of log2 full cost
    predicted: 'N/(3(k+1)) bits at the balanced point: 10.7 bits at (160, k=4), 14.2 bits
      at (256, k=5), 21.3 bits at (384, k=5). DERIVED.'
  - observable: Whether a Schroeppel-Shamir / dissection merge lowers FC below the plain tree
      at the charged optimum
    metric: log2 FC difference
    predicted: Reported, no value asserted, because the prior art is unchecked. A negative
      result (no improvement) is a clean statement that the 1/3 exponent is too weak to reward
      memory-time trading here, and that is a useful, quotable fact about the wiring model.
  minimal_test: 'STAGE 0 (reading): check Bernstein''s generalized-birthday price- performance
    note and Dinur et al. dissection for the charged optimisation. STAGE 1 (zero compute):
    minimize FC(k, s) over the integer grid k in 0..8, s in 1..N, subject to the detection
    constraint, for the nine (N, l) cells; report (k*, s*, t*), the shift, and the omitted
    penalty. Exact arithmetic, no floating-point tolerance in the comparisons. STAGE 2 (toy,
    LABELLED TOY): at N in {32, 40, 48} run the pipeline at both the time-optimal and the
    charged-optimal parameters and MEASURE peak resident bytes and wall time, then evaluate
    the empirical FC. The prediction is that the charged-optimal parameters give lower measured
    W * (peak words)^{1/3}. This is validation-ladder step 2 — a measured ratio against a
    baseline, not an extrapolation.'
  controls:
  - 'NULL OBJECT: an attack variant with O(1) shared state — for class BD the degenerate k
    = 0, t = 0 case does not exist, so the null is constructed instead as the SAME pipeline
    with the FFT replaced by streaming accumulation into O(1) registers at a single frequency.
    Its full cost must show NO theta dependence, exactly as van Oorschot-Wiener does in KN-TECH-057.
    If the machinery reports a theta penalty for the streaming variant it is mis-specified
    and every treatment number is void.'
  - 'POSITIVE CONTROL: Shanks BSGS under the identical machinery must return n^{1/2} step
    count and n^{2/3} full cost, the value KN-TECH-035 independently attributes to Wiener.
    FAILURE HERE FORBIDS REPORTING ANY CHARGED NUMBER FOR THE ECDSA PIPELINE. This is the
    same control H-RSA-68884a declares as G4, deliberately reused so the two lanes share one
    calibration.'
  - 'MONOTONICITY: FC must be non-decreasing in theta at fixed parameters. A non-monotone
    curve indicts the evaluator.'
  - Stage 2 peak-memory measurement must be taken by an external observer (resource accounting
    of the process), not self-reported by the pipeline.
  confounders:
  - Real peak memory at toy scale is dominated by interpreter overhead, not by the algorithm's
    asymptotic footprint. Stage 2 must report BOTH the raw peak and the algorithmic footprint
    (list entries times entry width) and must draw its conclusion from the second while disclosing
    the first.
  - The Wiener model is asymptotic with unextracted constants (KN-TECH-035's own applicability
    limits). A shift of 1-2 bits is within the model's own resolution and must not be over-read.
  - The FFT's memory access pattern may permit blocking that amortizes the wiring cost, weakening
    the S^{1/3} charge. This is a real objection, it is the same objection HEUR-NFS-2 faces
    on the sieving side (see X1-05), and it is recorded as an open modelling question rather
    than dismissed.
  falsification_conditions:
  - Stage 1 returns zero shift in all nine cells. P1 refuted; memory charging is a monotone
    rescaling within class BD and the record says so.
  - Stage 1 returns k* = k_max in all cells. P2 refuted.
  - The positive control (BSGS) fails to return n^{2/3} at theta = 1/3. NO charged number
    may be reported at all; the instrument is broken and that is the finding.
  - The null (streaming) variant shows theta dependence. Evaluator mis-specified; all treatment
    numbers void.
  - Stage 2 measures LOWER full cost at the time-optimal parameters than at the charged-optimal
    ones, outside measurement error. The functional does not describe the implementation and
    the closed form is withdrawn for this pipeline.
  - Stage 0 finds the charged optimisation already published for this setting. Recorded as
    KNOWN and downgraded to an application.
  interpretation_limits: 'A COST-MODEL AND PARAMETER-SELECTION RESULT ABOUT A LEAKAGE-MODEL
    ATTACK. No key is recovered at deployed size, no published attack is criticised, no exponent
    of ECDLP or of any hard problem moves. The theta = 1/3 charge is a CONVENTION inherited
    from KN-TECH-035, not a law of physics, and every number is quoted with theta attached.
    Stage 2 is toy-scale and validates a ratio, not an attack. KN-TECH-035''s own caution
    applies and is repeated: step counting is conservative from the defender''s side, so nothing
    here licenses relaxing any parameter recommendation.'
  assumptions:
  - The wiring exponent theta = 1/3 as declared in KN-TECH-035 / KN-TECH-057; the analysis
    is re-run at theta in {0, 1/6, 1/3, 1/2} and all four reported.
  - Entry widths: 16 bytes per list entry and per FFT bin unless a source states otherwise;
      declared, not fitted.
  - Class BD merge trees with +-1 coefficients (X1-02); coefficient growth is out of scope.
  heuristic_assumptions:
  - id: HA-5
    statement: (Non-amortized table access.) FOR ALL parameter choices in the region considered,
      the Bleichenbacher FFT and the merge lists are accessed at a rate proportional to the
      step count, i.e. the fraction of steps that touch the large shared object is bounded
      below by a constant, so the Wiener clock cycle tau = S^{1/3} multiplies the whole step
      count rather than a vanishing fraction of it.
    rigorous_ingredient: 'KN-TECH-057''s exemption criterion, stated there exactly: van Oorschot-Wiener
      escapes the charge because the shared table is touched only at distinguished points,
      at an amortized rate O(p^{-1/6}) per step. The criterion is a stated, checkable property
      of an access pattern, not a heuristic; what is assumed is which side of it the FFT butterfly
      falls on.'
    distribution_imitated: None — this is an architectural assumption, and it is labelled
      as one rather than dressed as a distributional claim.
    validation_route: 'Instrument the toy pipeline with a counter of accesses to the large
      arrays per elementary operation, at t in {10,12,14,16}, and report the ratio. If the
      ratio is bounded below by a constant as t grows, HA-5 holds on this implementation;
      if it decays like a power of t, the FFT is effectively amortized and the charge must
      be reduced accordingly — and the measured decay exponent IS the corrected charge. Size-local:
      the ratio is a property of the access pattern, not of N.'
    tail_checks: Report the access-rate distribution across FFT stages; the first and last
      radix-2 stages have very different locality, and an average that hides a bimodal distribution
      would mis-state the charge.
  target_complexity:
    time_exponent: 'Step count 2^{k+s} + t 2^t, minimized under the class-BD constraints;
      at (N,l) = (256,1) about 2^{47.7} elementary operations at the balanced point. NOT an
      improvement on anything: the same as X1-02''s, since this record changes the OBJECTIVE,
      not the algorithm''s asymptotics.'
    memory_exponent: max(2^s, 2^t) words; 2^{42.7} at (256,1) balanced, moving to the Stage-1-computed
      (s*, t*) under charge. The full-cost exponent is step count + (1/3) log2 memory, i.e.
      about 2^{47.7} * 2^{14.2} = 2^{61.9} charged units at (256,1). DERIVED.
    best_known_baseline: 'The relayed published Fourier row at secp160r1: 2^36 samples, 279
      min, 850 GiB. Under this record''s accounting that row''s full cost is its step count
      times (850 GiB / 16 B)^{1/3} = (5.7e10)^{1/3} = 3.85e3, i.e. about 11.9 extra bits —
      a number the published table does not carry. DERIVED from a RELAYED figure and inheriting
      its unverified status.'
    hidden_overhead_disclosure: (i) theta is a convention with unextracted constants (KN-TECH-035);
      (ii) HA-5 could fail and reduce the charge to zero for the FFT; (iii) the log2 t factor
      on the FFT step count is dropped in the crossover algebra above and reinstated in Stage
      1; (iv) all of X1-02's disclosures (C0, HA-3's 2^{o(s)}) are inherited.
    time_memory_tradeoff: 'This record IS the tradeoff statement: FC(k,s) is a two-parameter
      surface and the deliverable is its minimizer under charge versus without. Parallelization:
      merge rounds parallelize over list partitions with communication equal to the list size
      per round; the FFT has sequential depth t which no additional processor reduces. The
      charged model and the sequential-depth floor are two different statements about the
      same stage and both are reported.'
  sota_delta: 'Attack-cost improvement: none claimed. The quantitative delta is the omitted
    full-cost penalty, N/(3(k+1)) bits: 10.7 bits at 160, 14.2 at 256, 21.3 at 384 (DERIVED).
    A published comparison that reports time and memory separately but never combines them
    is understating the cost of the memory-heavy family by that many bits relative to a streaming
    competitor.'
  dominated_by: 'CHECKED ACROSS THE FRONTIER. As an attack: dominated by every published row,
    since no attack is proposed. As a cost model: within this program, H-ECDSA-a23475''s K3/K4
    conventions cover the A*T and A*T^2 shapes and do NOT cover W*S^{1/3}; KN-TECH-057 covers
    W*S^{1/3} for isogenies and not for this family; so nothing in-corpus dominates. Externally
    UNCHECKED for the stated infrastructural reason, with two named candidates (Bernstein''s
    generalized-birthday price-performance note; Dinur et al. dissection).'
  estimated_cost: 'Implementation low-to-medium (Stage 1 is a grid minimization in exact arithmetic;
    Stage 2 reuses X1-02''s pipeline plus external memory accounting). Compute low: Stage
    1 seconds, Stage 2 a few CPU-hours, under 8 GB.'
  recommended_priority: medium
  honest_prior_of_survival: 0.5 that P1 and P3 survive (they are close to arithmetic), 0.35
    that P2 survives with a strict inequality somewhere, 0.25 that the whole package is not
    dominated by the two named external references. The hand computation that contradicted
    my own stated direction for P1 is the honest reason the prior is not higher, and it is
    left in the record.
  novelty_status: unverified
  novelty_screen: SCREENED in-repo against EXISTING_PROPOSALS.txt, EXISTING_HYPOTHESES.txt
    (H-ECDSA-a23475 read in full — its K1..K5 do not include W*S^{1/3}), KNOWLEDGE_BARRIERS.txt,
    knowledge/techniques/KN-TECH-035.md and KN-TECH-057.md (both read in full). NOT screened
    externally; two specific external candidates named. Status `unverified`.
  discriminated_from: 'H-ECDSA-a23475 (K3 = A*T, K4 = A*T^2): different functional form, applied
    to published rows rather than to parameter selection, and producing an ordering statistic
    rather than a minimizer. IDEA-20260805-72bcb5: charges block Wiedemann in bytes for NFS
    — same discipline, different primitive, and that record explicitly does not touch ECDSA.
    KN-TECH-057: applies W*S^{1/3} to isogeny path-finding, not to HNP.'
  source_refs:
  - knowledge/techniques/KN-TECH-035.md
  - knowledge/techniques/KN-TECH-057.md
  - ledger/questions/RQ-ECDSA-87625f.yaml
  - ledger/goals/GOAL-RSA-001.yaml
  - ledger/hypotheses/H-ECDSA-a23475.yaml
  - 'NAMED FROM MEMORY, NOT READ, PRIOR-ART CHECKS: Bernstein, "Better price-performance ratios
    for generalized birthday attacks" (SHARCS era); Dinur, Dunkelman, Keller, Shamir, "Efficient
    dissection of composite problems" (CRYPTO 2012). Both must be located and filed before
    any novelty statement is made.'
  proof_search_map:
    bottleneck: The single multiplication by max(2^s,2^t)^{1/3}. Removing it returns the uncharged
      optimum; the whole claim is that this one factor relocates the minimizer.
    baseline_embedding:
      parameter_slice: theta = 0. At theta = 0 the functional is the step count and the minimizer
        must be the balanced s = t = N/(k+1) with k = k_max, i.e. exactly X1-02's answer.
        The incumbent analysis is a boundary case at a named parameter value.
      reproduction_check: 'SYMBOLIC: at theta = 0, max(2^s,2^t)^0 = 1 identically, so FC =
        step count and the minimizer is unchanged by construction. A frozen fixture asserting
        (k*, s*, t*) at theta = 0 equals X1-02''s table must be committed before Stage 1 runs.'
    observation_collision:
      observable: the scalar FC, and the triple (k*, s*, t*).
      distinct_preimage_search: 'COLLISION EXHIBITED: FC is invariant under trading step count
        for memory along the curve W * S^{1/3} = const, so many (k,s) pairs share an FC value.
        FC alone therefore cannot identify the parameters. THE SEPARATING INVARIANT is the
        pair (peak words, sequential depth t), which is not a function of FC. Any report quoting
        FC without both is not identifiable, and Stage 1 must emit all three.'
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: Charge max(2^s, 2^t) rather than 2^s + 2^t, so no word is charged twice
        — the same conservative choice H-ECDSA-a23475 makes with A = max(M,V), reused deliberately
        so the two records' conventions agree.
      predicted_gain: A charge that cannot be accused of manufacturing the shift by double-counting,
        which matters because the claim IS a shift.
    - transform: representation_reduction
      proposed_object: Replace "is memory free in this attack" by "the shared object enters
        as S^theta with theta declared", so the disagreement becomes one rational number shared
        with GOAL-RSA-001.
      predicted_gain: One convention across two goals, which is the explicit non_duplication
        requirement of both goal records.
    quantifier_order: THERE EXISTS one functional FC, fixed before evaluation, SUCH THAT FOR
      ALL (N, l) in the declared grid its minimizer differs from the theta = 0 minimizer in
      at least one coordinate. The functional may NOT be chosen per cell. The weaker order
      — for all cells there exists a functional that shifts the optimum — is trivially satisfiable
      and is NOT claimed.
    method_ceiling:
      strongest_certifiable_claim: That under a DECLARED wiring convention with a DECLARED
        entry width, the full-cost-optimal class-BD parameters differ from the time-optimal
        ones by a stated number of bits, and that a time-only report omits a stated number
        of bits. It cannot certify that any real machine behaves this way, cannot bound the
        constants, and cannot say which family is actually better at any curve size.
      nearby_object_control: 'THE OBJECT WHERE THE EFFECT MUST NOT APPEAR: the streaming variant
        with O(1) shared state (the null above). THE OBJECT WHERE IT MUST APPEAR: BSGS at
        theta = 1/3 returning n^{2/3}. A machinery that cannot separate these two has not
        identified the load-bearing structure.'
    proof_obligations:
    - claim: FC(k,s) with theta = 0 reproduces X1-02's minimizer exactly.
      responsibility: baseline
    - claim: The crossover equation k + 4s/3 = 4t/3 + log2 t is the correct stationarity condition.
      responsibility: correctness
    - claim: max(2^s,2^t) charges no word twice.
      responsibility: memory
    - claim: BSGS returns n^{2/3} at theta = 1/3 under the identical rule.
      responsibility: interface
    - claim: The streaming null shows no theta dependence.
      responsibility: strictness
    - claim: Every quoted FC carries peak words and sequential depth beside it.
      responsibility: scope
    not_applicable_reason: null
