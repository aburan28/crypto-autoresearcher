idea:
  id: IDEA-20261007-d30bed
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Characteristic 79 has exactly seven distinct supersingular
    j-invariants.
  class: measurement
  claim: >-
    Let p = 79. Let s be the number of distinct j in F_{79^2} for
    which some elliptic curve of that j is supersingular. The claim
    is s = 7. The prediction uses the recalled count
    floor(p/12) + 1 when p ≡ 7 (mod 12): floor(79/12) + 1 = 7.
    That formula was not opened in a knowledge file this session.
    The measurement does not walk an isogeny, and the exponent delta
    against the opened path-finding cost is 0.
  mechanism: >-
    Supersingularity is the vanishing of the Hasse invariant, read as
    the coefficient of x^{p-1} in (x^3 + A x + B)^{(p-1)/2}. The
    integer s counts distinct j, not Weierstrass models. KN-TECH-024,
    opened, says the graph has about p/12 vertices and does not state
    the exact count at p = 79. A count other than 7 rejects this
    formula at this prime. It does not change path-finding.
    OBJECT FRAME. Representation: j-invariants in F_{79^2}.
    Operation set Sigma: the Hasse invariant of one model per j.
    TRICHOTOMY: a predicate on j, not a group law. LOSSY-PROJECTION
    TEST: the models are discarded and only the integer s is kept.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note says the supersingular ell-isogeny graph has
        about p/12 vertices. It does not give the exact count at
        p = 79.
      verified_by: coordinator, this session, via knowledge/techniques/KN-TECH-024.md
    - ref: mass-formula-count
      provenance: recalled
      claim: >-
        A remembered count says the number of supersingular
        j-invariants is floor(p/12), plus 1 when p ≡ 5 or 7 (mod 12).
        The source was not opened. The count s = 7 is the prediction
        under test, not a checked theorem.
  assumptions:
    - p = 79 is prime and 79 ≡ 7 (mod 12). The test checks both.
    - One nonsingular model is tested per j. Twists of the same j are one value.
    - j = 0 is ordinary at this prime because 79 ≡ 1 (mod 3), and j = 1728 is supersingular because 79 ≡ 3 (mod 4). Those two labels are instrument checks.
  predictions:
    - metric: absolute difference |s - 7|
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      For every j in F_{79^2}, build one nonsingular Weierstrass model
      and evaluate the Hasse invariant. Set s to the number of j whose
      invariant vanishes. Separately record the labels of j = 0 and
      j = 1728. Do not compute an isogeny. Do not list kernels.
    controls:
      - The census marks j = 1728 supersingular and j = 0 ordinary. The opposite label invalidates s.
      - Every j is tested once. A skipped j invalidates s.
      - A singular model is replaced. A j that has only singular models is not elliptic and is not counted.
      - Repeating the Hasse test on a second model of the same j does not change that j's label.
    required_metrics:
      - s
      - label_j0
      - label_j1728
      - j_tested_count
  falsification_conditions:
    - The instrument checks pass and |s - 7| is at least 1.
    - j = 1728 is labeled ordinary, or j = 0 is labeled supersingular, so s is not accepted.
    - j_tested_count is not 79^2.
  confounders:
    - Counting models instead of j inflates s by twists. The metric is distinct j.
    - Testing only j in F_79 misses quadratic j-invariants and can shrink s. The field is F_{79^2}.
  interpretation_limits:
    - One prime. No transfer to a cryptographic prime.
    - s = 7 checks this formula at p = 79. It does not prove the formula for every prime.
    - s ≠ 7 rejects the formula at p = 79 only.
    - Exponent delta against Õ(p^{1/4}) in the opened notes is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For p = 79 only, s equals floor(p/12) + 1 because p ≡ 7
        (mod 12). The formula is recalled and was not read from a
        knowledge file. The sample is one prime. No transfer is claimed.
      rigorous_support: >-
        KN-TECH-024, opened, gives the approximate size p/12 and not
        this exact formula. The Hasse test is the measurement. The
        formula is the prediction, not an input to the test.
      validation_plan: >-
        Compute s once. The checks are the two special j labels, a
        complete pass over F_{79^2}, and agreement of a second model.
        Sample size one has no tail. No second prime is drawn.
  target_complexity:
    time_exponent: >-
      One Hasse invariant per j in F_{79^2}. Polynomial in the fixed
      prime. No p^{1/4} path search is run.
    memory_exponent: >-
      One bit per j and the integer s. Memory is O(p^2) at p = 79.
    best_known: >-
      KN-LIT-078, opened note: Õ(p^{1/2}) full-graph meet-in-the-middle
      and Õ(p^{1/4}) on the F_p subgraph. Those algorithms are not run.
    hidden_overhead: >-
      No o(1) term. The prime is explicit. The output is one integer s.
    tradeoff_note: >-
      No time-memory tradeoff and no collision search. One prime.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
