idea:
  id: IDEA-20261006-cce801
  title: >-
    The degree-12 five-division polynomial has at least five distinct
    irreducible factors on the first eligible prime
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + 4x + 6. Let p be the smallest prime with
    41 ≤ p ≤ 140 such that E over F_p is nonsingular, the integer
    t = #E(F_p)-(p+1) is not 0, and the classical 5-division
    polynomial f5, of degree (25-1)/2 = 12, has no root in F_p. Let r
    be the number of distinct monic irreducible factors of f5 over
    F_p, multiplicity ignored. The claim is r ≥ 5. A finished
    factorization with degree 12 and r ≤ 4 is the concrete negative.
    No prime in the interval meeting the filters is also a negative.
    This is not a count of second x-differences along translation by
    a rational point of order 5, and it does not change exponent 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R5: f5 as the x-polynomial whose
    roots are the x-coordinates of the nontrivial 5-torsion, computed
    by the standard division-polynomial recurrence and then made
    monic of degree 12. Operation set Sigma is multiplication by 5 on
    the algebraic torsion, read only through the factorisation of f5
    over F_p. Sigma is not translation by a rational point, because
    the filter requires that f5 have no rational root. Trichotomy:
    partial-action. LOSSY-PROJECTION TEST against Sigma. Passing from
    the 5-torsion x-coordinates to the set of irreducible factors
    discards which roots lie in which extension and keeps the
    partition of the degree. The image is an integer r between 1 and
    12. The priced number is that integer on one prime. Off-limits
    families F1–F7 are not the lens. No factor base is built. Semaev
    summation polynomials are a different polynomial and are not
    factored here.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: coordinator
  approved_by: null
  question_id: RQ-TORS-8c7b79
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Semaev polynomials vanish on x-coordinates that sum to the
        identity. f5 is a division polynomial, not a summation
        polynomial, and this idea does not decompose a point.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        on 2026-10-06
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Small-order torsion already shrinks symmetrised decomposition.
        This idea builds no summation system. Order 5 appears only as
        the level of f5.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains Omega(√N). A factor count of one
        polynomial does not change that exponent.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        The universal factor-base no-go is open. This idea declares no
        factor base.
      verified_by: >-
        design session opened knowledge/open-problems/KN-OPEN-020.md
        on 2026-10-06
    - ref: division polynomial recurrence
      provenance: recalled
      claim: >-
        Pointer only, for how a reviewer might recognise f5. The test
        uses the standard recurrence and checks the monic degree is
        12. An unread closed form is not the certificate.
      verified_by: null
  assumptions:
    - >-
      Nonsingular means 4*(4)^3 + 27*(6)^2 is nonzero modulo p. The
      arithmetic is done in the run, not assumed from a table.
    - >-
      Ordinary means t ≠ 0. The Hasse bound is an instrument check: a
      count with |t| larger than the greatest integer whose square is
      at most 4p is not a factorisation.
    - >-
      Distinct irreducible factors ignore multiplicity. A repeated
      factor counts once toward r.
  proof_search_map:
    bottleneck: >-
      Whether f5, with no rational root, still splits into at least
      five distinct irreducible factors over the first eligible prime.
    baseline_embedding:
      parameter_slice: >-
        The summation-polynomial framework of KR-IC-5a43e5. This
        control does not build S_m.
      reproduction_check: >-
        The computed monic polynomial has degree 12, and substituting
        a root of a linear factor, if any were present, would be an
        x-coordinate of a rational nontrivial 5-torsion point. The
        filter says there is no linear factor.
    observation_collision:
      observable: the integer r
      distinct_preimage_search: >-
        Two factorisations of the same polynomial with different r
        are an instrument collision. One finished r is the observation.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The set of monic irreducible factors of f5, replacing the
          torsion points by a partition of the degree.
        predicted_gain: >-
          r at least 5, or a finished r of at most 4.
    quantifier_order: >-
      There exists a smallest prime p in 41..140 meeting the filters,
      and for that p the number of distinct irreducible factors is at
      least 5.
    method_ceiling:
      strongest_certifiable_claim: >-
        One factor count on one curve at one prime at most 140. Not a
        decomposition algorithm and not a statement past that prime.
      nearby_object_control: >-
        The same polynomial's number of linear factors, which the
        filter forces to 0. If a linear factor appears, the prime is
        not eligible and r is not scored.
    proof_obligations:
      - claim: Degree 12 is checked on the computed polynomial before r is read.
        responsibility: correctness
      - claim: A factor count is not an index-calculus relation.
        responsibility: scope
    not_applicable_reason: >-
      This is a factor count, not a theorem, bound, certificate,
      reduction, or closure.
  predictions:
    - metric: number of distinct monic irreducible factors of f5
      direction: higher
      minimum_effect: at least 5
  minimal_test:
    design: >-
      Scan primes from 41 through 140. Keep the first prime where the
      model is nonsingular and ordinary and f5 has no root in F_p.
      Factor f5 into monic irreducibles over that field and count
      distinct factors. Do not score a later prime. Do not run a walk.
    controls:
      - >-
        Degree must be 12. Any other degree is an instrument row, not
        an r of 4 or less.
      - >-
        A rational root makes the prime ineligible. It is not an r.
      - >-
        The factorisation is checked by multiplying the irreducible
        factors, with multiplicity, back to f5. A failed product is
        an instrument row.
    required_metrics:
      - selected prime, or none
      - degree of f5
      - r
      - number of linear factors, which must be 0 on the scored prime
  falsification_conditions:
    - The first eligible prime has f5 of degree 12 and r ≤ 4.
    - No prime in 41..140 is nonsingular, ordinary, and free of a rational root of f5.
    - >-
      The computed polynomial does not have degree 12. The factor
      count is then not the statistic the claim named.
  confounders:
    - >-
      Counting multiplicity instead of distinct factors can inflate r.
      The claim counts distinct monic irreducibles.
    - >-
      A different recurrence normalisation can scale f5 by a unit.
      The polynomial is made monic before factoring, so a unit does
      not change r.
    - >-
      Scoring a prime that has a rational 5-torsion x-coordinate
      answers a different question. Those primes are skipped.
  interpretation_limits:
    - >-
      r ≥ 5 does not produce a relation and does not change exponent
      1/2.
    - One curve and one prime at most 140. No transfer.
    - >-
      Not the second x-difference along an order-5 translation, and
      not a collision count of successive x-differences on an order-3
      coset.
    - Not a summation polynomial and not a factor base.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Conditional on no rational root, the factor degrees of a
        degree-12 division polynomial on this one model behave like a
        uniform random degree-12 polynomial conditioned on having no
        linear factor, only as a flag. The claim itself is the integer
        r, not the random-polynomial probability.
      rigorous_support: >-
        The number of monic irreducibles of each degree over a finite
        field is a classical count. This session did not open a
        generating-function reference, so that count is not support.
        KR-IC-5a43e5, which was opened, is about summation polynomials
        and does not give the factor-degree law for f5.
      validation_plan: >-
        On the one scored prime, record the multiset of factor
        degrees beside r. Tail check: if a linear factor is present,
        the prime was not eligible and H1 is not evaluated. If r = 1,
        a single degree-12 factor, record that as the finished
        negative when the other gates pass. Do not replace r by a
        probability.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: unchanged O(1) rho memory; one degree-12 polynomial is stored
    best_known: >-
      generic rho at exponent 1/2 (KR-RHO-13bf67); torsion-shrunk
      decomposition is a different algorithm and is not run
      (KR-IC-955fd6)
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No time-memory tradeoff. One polynomial is factored at one prime.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    No opened row dominates the factor count. Rows opened and not
    dominating that count: KR-IC-5a43e5 (summation polynomials; f5 is
    not S_m), KR-IC-955fd6 (torsion-shrunk decomposition; this idea
    builds no system), KR-RHO-13bf67 (exponent 1/2). KR-RHO-13bf67
    dominates any attack reading that would treat r as a sub-square-root
    algorithm.
  sota_delta: >-
    Zero change to exponent 1/2. The new quantity is the number of
    distinct monic irreducible factors of the degree-12 5-division
    polynomial on y^2 = x^3 + 4x + 6 at the first eligible prime at
    most 140. The claimed count is at least 5.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-955fd6
      - KR-RHO-13bf67
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: orthogonal
        delta: >-
          That row states that summation polynomials vanish on
          x-coordinates summing to the identity, with degree 2^{m-2}.
          This idea factors the degree-12 division polynomial f5 and
          does not form S_m. The scored integer is a factor count of
          at least 5, or a finished count of at most 4.
      - ref: KR-IC-955fd6
        provenance: internal
        relation: adjacent
        delta: >-
          That row uses small-order torsion to shrink a decomposition
          system. This idea does not build that system. Order 5 is
          only the level of the polynomial being factored.
    searched:
      corpus_grep:
        - >-
          origin/main ledger/proposals and PRs 1943 and 1940 for
          order-5 second x-differences and order-3 coset collision
          counts
      web: []
      blocked:
