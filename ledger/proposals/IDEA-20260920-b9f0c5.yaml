idea:
  id: IDEA-20260920-b9f0c5
  question_id: RQ-FROB-7d8dd4
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    WDSat conflict audit on Frobenius-invariant factor bases at n = 41 (cheap)
    and n = 43 (decisive): basis-blind vs first pruning
  class: measurement
  claim: >-
    On E/F_2 Koblitz curves over F_{2^n}, build Weil-descent PDP instances whose
    factor base is a Frobenius-stable F_2-subspace cut out by an irreducible
    factor of T^n - 1 of intermediate degree, run WDSat on certified-UNSAT
    targets, and compare the conflict count to the orbit-naive null
    2^{m l}/m!. At n = 43 the three degree-14 factors give three invariant
    bases of dimension 14; with m = 3 one has m l = 42 and the null is
    2^{42}/6 ≈ 7.3 × 10^{11}. If conflicts land within about one percent of
    that null, the solver is basis-blind: the invariant factor base is free
    but worthless to the search, and the subfield thread reduces to the
    trivial n / n^2 bookkeeping. If conflicts come in materially under, this
    is the first pruning observed on these instances and the branching order
    becomes the whole game — order the core bits block-by-block and measure
    conflict depth, not just conflict count. The cheap discriminating cell is
    n = 41, m = 2 (degree-20 factors, m l = 40, null 2^{40}/2 = 2^{39}); a
    null result there is as publishable as a positive one. No ECDLP break is
    claimed; deployed parameters are never instances.
  mechanism: >-
    By IDEA-20260918-9abf42 / Euler–Petit Prop. 2, Frobenius-stable F_2-subspaces
    of F_{2^n} are in bijection with monic divisors of T^n - 1. At n = 43,
    ord_43(2) = 14 and T^{43} - 1 = (T - 1) · f_1 f_2 f_3 with three irreducible
    degree-14 factors, giving stable subspaces of dimensions
    {0,1,14,15,28,29,42,43}. The three dim-14 subspaces V_i = ker f_i(σ) are
    the invariant factor bases under test. A PDP of arity m = 3 with x-coords
    in V_i has m l = 42 Boolean unknowns after Weil descent; WDSat explores
    that ANF. The orbit-naive conflict null 2^{m l}/m! accounts for S_m
    labelling of summands and assumes no further pruning from the invariant
    geometry. Comparing measured conflicts on certified-UNSAT instances to that
    null decides whether the invariant lattice buys a search-side gain (the
    open residual after IDEA-20260906-a77711 closes invariant-ring rewriting
    of the orbit system). At n = 41, ord_41(2) = 20 yields two degree-20
    factors and dim-20 bases; m = 2 gives the cheaper m l = 40 cell.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: >-
      User directive 2026-09-20 naming the deciding experiment for the
      FROB/WDSat residual after the stable-subspace count (IDEA-20260918-9abf42)
      and the equivariance obstruction (IDEA-20260906-a77711).
    overlap_review: >-
      IDEA-20260918-9abf42 enumerates the rich/poor ladder and proposes n = 7
      as the cheapest Groebner cell; it does NOT preregister a WDSat conflict
      null. DEC-20260920-f1e672 requires that any FROB contract from 9abf42
      rewrite its A-vs-B prior so it is not mis-attributed to a77711; this
      proposal is a NEW prior (WDSat conflict vs 2^{ml}/m!), not that repair.
      RQ-ICPERF-94c86e / GOAL-ICPERF-e6b6a4 own WDSat builds and PDP phase
      tables; this proposal reuses that solver stack with a different decision
      target (basis-blindness of search on invariant V). GFPN IDEA-20260920-18dc28
      scores a combined WDSat+torsion+coset arm and is deliberately not opened
      under GOAL-GFPN-380702; this record stays under RQ-FROB-7d8dd4.
  citations:
    - ref: ledger/proposals/IDEA-20260918-9abf42.yaml
      provenance: internal
      claim: >-
        Closed-form count of Frobenius-stable subspaces; n = 41 and n = 43 are
        rich; dimensions {20,21} and {14,15,28,29} respectively.
    - ref: ledger/proposals/IDEA-20260906-a77711.yaml
      provenance: internal
      claim: >-
        Frobenius is an equivariance of conjugate targets, not a symmetry of one
        fixed PDP; invariant-ring rewriting does not drop solving degree. Leaves
        open whether an invariant V still prunes a SAT search on one fixed R.
    - ref: ledger/decisions/DEC-20260920-f1e672.yaml
      provenance: internal
      claim: >-
        9abf42 counting holds; ladder design holds; a77711 mis-attribution must
        not enter a preregistered_prediction.
    - ref: inputs/TRIMOSKA-WDSAT-2024/source_record.yaml
      provenance: internal
      claim: WDSat static DPLL for Weil-descent ANF/CNF-XOR; conflict counter on UNSAT.
    - ref: inputs/TRIMOSKA-ECICB-2024/source_record.yaml
      provenance: internal
      claim: EC index-calculus instance generator used by ICPERF PDP cells.
  assumptions:
    - Public parameters only; no private-key recovery; toy Koblitz E/F_2 only.
    - Same WDSat binary sizing rules as EXP-ICPERF cells (MAX_ID from ANF).
    - >-
      UNSAT is independently certified (Groebner unit ideal or exhaustive on a
      reduced fixture) before the conflict count is treated as scientific.
    - >-
      The null 2^{ml}/m! is the preregistered basis-blind reference, not a
      theorem about WDSat's internal heuristics.
    - >-
      Orbit non-freeness and labelling are charged — report conflicts divided
      by (2^{ml}/m!) per cell, not raw conflicts alone.
  proof_search_map:
    bottleneck: >-
      Whether a Frobenius-stable factor base of intermediate dimension reduces
      WDSat conflicts on fixed-target UNSAT PDPs below the orbit-naive null.
    baseline_embedding:
      parameter_slice: >-
        n = 41, m = 2, V one degree-20 stable subspace (primary); n = 43, m = 3,
        each of the three degree-14 subspaces (decisive, capacity-gated).
      reproduction_check: >-
        Reproduce one shipped Trimoska/ICPERF WDSat UNSAT conflict count within
        2x on a regression cell before trusting n = 41 numbers.
    observation_collision:
      observable: >-
        WDSat conflicts on certified-UNSAT; ratio to 2^{ml}/m!; conflict depth
        histogram if ratio << 1.
      distinct_preimage_search: >-
        Size-matched RANDOM (non-stable) F_2-subspace of the same dimension at
        the same (n, m); if both arms match the null, the solver is
        basis-blind in general, not merely invariant-blind.
    constructive_transforms:
      - transform: frobenius_stable_factor_base
        proposed_object: V = ker f(σ) for irreducible f | (T^n - 1)/(T - 1)
        predicted_gain: >-
          Either conflicts within ~1% of 2^{ml}/m! (basis-blind; subfield
          thread → n/n^2 bookkeeping only) or materially under (first pruning;
          then branch-order / conflict-depth becomes the follow-on).
    quantifier_order: >-
      There exist preregistered toy cells (n, m, V) on which WDSat conflicts
      are measured end-to-end on fresh certified-UNSAT targets.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured conflict ratio at named (n, m, V) under a named null; no
        asymptotic or deployed-curve claim.
      nearby_object_control: >-
        Random same-dimension subspaces; poor-n control (e.g. n = 37) where no
        intermediate stable V exists.
    proof_obligations:
      - claim: Every accepted UNSAT is independently certified before scoring.
        responsibility: correctness
      - claim: MAX_ID matches the ANF-derived value (no mis-sized WDSat build).
        responsibility: runtime
      - claim: Ratio uses measured conflicts and the preregistered null, not a fitted constant.
        responsibility: cost-model
      - claim: Scope is toy Koblitz only; no transfer to ECC2K-130 without a new record.
        responsibility: scope
  predictions:
    - metric: conflict_ratio_vs_null
      direction: flat_or_lower
      minimum_effect: >-
        Primary readout. Within 1% of 1.0 ⇒ basis-blind (null wins). Ratio ≤ 0.5
        on every certified-UNSAT replicate ⇒ material pruning (positive).
    - metric: conflict_depth_on_prune
      direction: lower
      minimum_effect: >-
        Recorded only if ratio ≤ 0.5; otherwise marked N/A (branch-order
        follow-on not opened).
  minimal_test:
    design: >-
      PRIMARY: n = 41, Koblitz y^2 + x y = x^3 + a x^2 + 1 over F_2 extended to
      F_{2^{41}}, V = ker f(σ) for one irreducible degree-20 factor of T^{41}-1,
      m = 2 (m l = 40), ≥ 3 fresh certified-UNSAT targets, WDSat default.
      Size-matched random dim-20 control. DECISIVE (capacity-gated): n = 43,
      each of three degree-14 V_i, m = 3 (m l = 42), same protocol; skip with a
      recorded impediment if wall/memory cannot finish one UNSAT.
    controls:
      - ICPERF/Trimoska WDSat UNSAT regression within 2x conflicts.
      - Random non-stable same-dimension V at each primary cell.
      - Degenerate identity: rebuild with MAX_ID mismatch must refuse (instrument).
      - Poor-n optional: n = 37 has no intermediate stable V (structural control).
    required_metrics:
      - wdsat_conflicts_per_unsat
      - null_2_ml_over_m_factorial
      - conflict_ratio_vs_null
      - independent_unsat_certificate
      - random_V_conflicts
      - max_id_anf_match
      - conflict_depth_histogram_if_pruning
  falsification_conditions:
    - Primary cell cannot produce a certified-UNSAT with matched MAX_ID (instrument fail; not mathematical).
    - Random-V and stable-V ratios disagree by >10% while both near 1 (then "basis-blind" must be re-scoped to invariant-only).
    - Claimed pruning without an independent UNSAT certificate.
  confounders:
    - Toy n so small that factor-base saturation or field 2-torsion degeneracy appears.
    - Counting SAT conflicts or aborted runs as UNSAT evidence.
    - >-
      Using 1/m! without measuring labelling / orbit effects on the concrete ANF.
    - >-
      Comparing to 2^{ml} instead of 2^{ml}/m!.
  interpretation_limits:
    - Proposal only at filing; no run exists here.
    - A ratio ≈ 1 is a publishable null, not a proof that no other Frobenius use helps.
    - n = 43 may be capacity-blocked; primary scientific cell is n = 41.
    - Nothing about ECC2K-130 (poor n: only dims 0,1,130,131).
  heuristic_assumptions:
    - id: HEUR-FROB-WDSAT-NULL
      statement: >-
        The basis-blind reference conflict count on these ANFs is 2^{m l}/m!;
        tested by the ratio, not assumed as a theorem.
  heuristic_note: >-
    The decision rule is the ratio to HEUR-FROB-WDSAT-NULL. XOR/Gauss inside
    WDSat may already cut below 2^{ml}; the random-V arm absorbs that, so the
    invariant-vs-random contrast remains meaningful.
  target_complexity:
    time_exponent: Unknown; constant-factor search pruning, not an exponent move.
    memory_exponent: Unknown; WDSat static tables sized from the ANF.
    best_known: Trivial n-fold orbit bookkeeping; a77711 predicts no rewriting gain.
    hidden_overhead: Instance generation, UNSAT certification, WDSat rebuild per ANF.
    tradeoff_note: If pruning appears, follow-on is branch-order / conflict-depth, not a larger n alone.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: >-
      n = 41 must complete on the ICPERF host class; n = 43 is best-effort and
      may record resource_exhaustion without scoring a mathematical null.
  dominated_by: unchecked
  sota_delta:
