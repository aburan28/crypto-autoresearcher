  title: >-
    THE HUB-COVER CEILING: the basin-partition ceiling C_max(a) of
    IDEA-20260906-aed829 bounds tables whose online walk STOPS AT THE FIRST
    distinguished point; in the RQ's own cost unit (group operations, table
    probes uncharged) the stored set need not be distinguished points at all
    -- the online walk can probe every point (or every FINE distinguished
    point of density k theta) and continue to a cap D, so a stored point
    covers its depth-D ancestry and the covers nest instead of partitioning.
    Measure the oracle constant c_hub = min T L^2 / N of that family on exact
    random functional graphs against the first-DP oracle 1.64 and the
    published 3.2, with probes per target reported beside it
  class: measurement

  claim: >-
    (A) THE FAMILY. Fix the walk f and a probe predicate of density rho_p (every
    point, rho_p = 1; or fine distinguished points, rho_p = k theta). A stored
    set X (|X| = T, logs known) and a cap D define: an online walk from a
    uniform start y probes the table at every probe point it visits and
    succeeds at the first probe point in X, restarting after D steps without
    a hit. The covered set is Cov_D(X) = {y : f^j(y) in X for some j <= D},
    the single-walk hit probability is C_D(X) = |Cov_D(X)|/N, and the online
    cost per target is L = E[min(tau_X, D)] / C_D(X) group operations (restart
    scalar multiplications excluded, as the paper and the program's
    instrument exclude them). The Bernstein-Lange table is the member with
    rho_p = theta, X among distinguished points, and the extra stop rule
    "restart at the first unstored distinguished point"; IDEA-20260906-cf3b76
    (B) shows continue-through with RANDOMLY selected stored DPs equals
    restarts. Hence the ORACLE of the family is at least as good as the
    first-DP oracle by construction, and the question is only by how much.
    (B) WHY IT CAN BE STRICTLY BETTER. The first-DP oracle chooses among
    N theta RANDOMLY PLACED candidates and pays a Geometric(theta) walk to the
    first DP whether or not the start is covered (memorylessness, aed829 (A)).
    A hub oracle chooses among all N points (or N k theta fine DPs), so it can
    place stored points at high-traffic merge points with controlled spacing
    along trunks; a covered start then pays its actual distance to X (at most
    D) rather than a geometric walk. On a single path the difference is
    regular versus Poisson spacing, which alone halves the mean distance to the
    next mark at equal density; how much of that survives on the branching
    geometry of a random mapping is the measured quantity.
    (C) PREDICTION (pre-registered band, not derived). At equal L and at the
    best (D, T) per arm, T_hub / T_DPoracle lies in [0.55, 0.85] for probe
    density rho_p = 1, and the fine-DP ladder rho_p = k theta, k in
    {1, 2, 4, 8, 16}, interpolates monotonically between the first-DP oracle
    (k = 1 with stop rule) and the every-point value. Equivalently
    c_hub in [0.9, 1.4] against 1.64. A ratio >= 0.95 at every N falsifies the
    premise that the DP mechanism is where the slack of the 1.64 constant
    lives; that outcome is itself a result: the constant would then be a
    property of random-mapping geometry, shared by every walk-based table.
    (D) WHAT IS CHARGED. Group operations (the RQ unit) are unchanged per step;
    table probes rise from about L/W per target (first-DP) to about
    L rho_p per target and are REPORTED per target, with a lambda-weighted
    cost L (1 + lambda rho_p) for lambda in {0, 0.01, 0.1} so a reader can
    re-price probes as fractions of a group operation. Precomputation working
    storage for traffic counters is charged as S_peak. GENERIC and
    CONSTANT-FACTOR under KN-LIT-013; no exponent moves.

  mechanism: >-
    STEP 1 (exact oracle, N in {2^20, 2^22, 2^24}; keyed random function as in
    the program's instrument, plus an r = 256 r-adding arm per
    IDEA-20260923-5d07e3). Build f; compute depth-limited ancestry sizes
    a_d(x) = 1 + sum over f-children c of a_{d-1}(c) for d <= D_max by
    repeated weighted bincount (O(N D_max) vector work). Oracle arms:
    (i) FIRST-DP ORACLE: exact top-T basins at the best a (aed829's arm,
    reproduced as the baseline); (ii) HUB GREEDY, rho_p = 1: lazy greedy
    maximum coverage over candidates ranked by a_D, marking Cov_D(x) by
    depth-limited backward BFS over still-uncovered points; (iii) FINE-DP
    GREEDY, rho_p = k theta, the same restricted to fine DPs. For each X,
    compute tau_X(y) truncated at D for EVERY y by a multi-source backward
    BFS, hence C_D, E[min(tau, D)] and L exactly -- no sampling. Sweep
    T in N^{1/3} x {1/2, 1, 2} and D on a grid; report the (T, L) lower
    envelope per arm and T_arm / T_DPoracle at equal L by interpolation.
    STEP 2 (practical selection at charged P). Precompute P = r_0 T W group
    operations of walks from known starts (r_0 in {2, 8}); count traffic at
    fine DPs of density k theta (counters are S_peak); select greedily by
    estimated D-ancestry from traffic; compare with the static
    Bernstein-Lange table at the same P and T.
    STEP 3 (curve transfer). A toy prime-order curve at N near 2^24 with an
    r = 256 r-adding walk; every solved logarithm certified by independent
    scalar multiplication.
    OBJECT FRAME. Representation: points as labels in the walk's functional
    graph; operation set: the walk map f itself (not translation). Tracked
    object: the truncated hitting distance d_X(y) = min(D + 1, tau_X(y)).
    Trichotomy: PARTIAL-ACTION -- d_X(f(y)) = d_X(y) - 1 deterministically on
    the covered region, branching only at the cover boundary (D + 1 maps to
    {D, D + 1}); priced by coverage and mean distance, not by an orbit
    canonicalisation.

  novelty_status: unverified

  novelty_screen:
    kb_index: crypto-kb MCP tools not exposed in this session; corpus grepped.
    corpus_grepped: >-
      All seven prior proposals on RQ-ECDLP-78dbc5 read (aed829 lines 1-260,
      a3d6ae lines 1-200, ee3543 in full, 05ffb8 lines 1-90, cf3b76 lines
      1-180, ac100b lines 1-70, 5b1f84 in full); EV-ECDLP-60e266 in full.
    results: >-
      Every table in the corpus stores distinguished points and stops at the
      first DP (aed829, ee3543, 05ffb8, a3d6ae, ac100b); cf3b76 treats
      continue-through only with RANDOM stored DPs and predicts no gain; no
      record stores non-DP points, probes at fine DPs with a cap, or measures
      a depth-limited cover constant.
    external: >-
      Not searched in this session beyond the two WebSearch queries recorded
      in IDEA-20260923-9e4b71. Nearest recalled work, unopened: Hellman's
      time-memory tradeoff (every chain point checked against stored
      endpoints), Rivest's distinguished points introduced to cut table
      lookups, rainbow tables and checkpoints (Oechslin; Avoine-Junod-
      Oechslin), and Bernstein-Lange's choice of DP tables for DLP.
    verdict: >-
      UNVERIFIED. The every-point probe is Hellman's original design and is
      certainly known; what the corpus lacks, and what was not found, is the
      oracle cover constant of that design for DLP tables measured against the
      first-DP ceiling.

  discriminated_from:
    - >-
      IDEA-20260906-aed829 / IDEA-20260906-ac100b: their ceiling C_max(a) is a
      sum of disjoint first-DP basins; this record's covers nest, and the
      first-DP oracle is one member of its family.
    - >-
      IDEA-20260906-cf3b76 (B): continue-through with randomly selected stored
      DPs equals restarts; this record selects stored points by an oracle or by
      traffic, which is exactly the case cf3b76 does not cover.
    - >-
      IDEA-20260906-05ffb8 / IDEA-20260906-ee3543 / H-ECDLP-37dc01: change the
      estimator or the pool of a first-DP table; they are bounded by C_max and
      this record is not.
    - >-
      IDEA-20260906-a3d6ae: grows the stored set with batch walks; orthogonal
      (a hub table can be grown the same way).

  object_first_candidate:
    tracked_object: >-
      THE TRUNCATED HITTING DISTANCE d_X(y) of every point to the stored set,
      followed under the walk map.
    lossiness: >-
      GENUINELY LOSSY: forgets the path, the identity of the stored point hit,
      and every label; keeps one integer in [0, D + 1] per point.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED against the named operation set {f}:
      deterministic on the covered region, two-valued only at the boundary.
      Not a change of coordinates (the graph is not recoverable from d_X).
      Distinct from the basin partition: two stored points on one trunk have
      nested covers, which the partition object cannot represent.
    survival_score: >-
      NEW relative to the corpus (non-DP storage with a cap); TESTABLE exactly
      at 2^20-2^24; survives any walk that is a function of the point; dies if
      probes are charged at a group operation each (then rho_p = 1 is
      priced out and only the fine-DP rungs remain).

  null_object_control: >-
    MANDATORY. NULL 1 (random hubs): X drawn uniformly from probe points with
    the same T and D must reproduce the unselected-coverage prediction for
    that design (computed exactly on the same graph) and show no gain over a
    random first-DP table at equal probes. NULL 2 (relabelled traffic, Step 2):
    permute traffic counts among candidates before selection; the practical
    arm must collapse to NULL 1. DECAY: add noise of relative size sigma in
    {0, 0.5, 1, 2, 4} to the ranking statistic; the gain must fall
    monotonically to the NULL 1 level. BASELINE REPRODUCTION: arm (i) must
    reproduce aed829's exact top-T share and the program's measured
    rho_ORACLE-level constants within seed spread before any hub number is
    read. STRUCTURAL TELL: c_hub must be N-independent across 2^20-2^24; a
    constant that drifts with N measures finite-size structure, not the
    random-mapping constant.

  assumptions:
    - Table probes are free in the RQ's charged unit and are reported separately; any conclusion about deployment re-prices them.
    - The walk is a function of the point (keyed random function or r = 256 r-adding walk); uniform independent targets.
    - Logs of every stored point are known from the known-start precomputation walks (any point on such a walk has a known log).
    - Greedy maximum coverage is within its (1 - 1/e) guarantee of the true oracle; the measured c_hub is therefore an upper bound on the family's constant.

  proof_search_map:
    bottleneck: >-
      The mean distance from a covered start to the stored set at fixed
      coverage and table size, which the first-DP design fixes at W.
    baseline_embedding:
      parameter_slice: >-
        rho_p = theta, X among DPs, stop at first unstored DP: exactly the
        Bernstein-Lange / aed829 object.
      reproduction_check: >-
        Arm (i) against aed829's exact top-T share and the frozen instrument
        numbers of EV-ECDLP-60e266 (top-T share about 0.39 at a = 1/4,
        rho_ORACLE about 0.55).
    observation_collision:
      observable: The (T, L) lower envelope per arm.
      distinct_preimage_search: >-
        A hub gain and a finite-N artifact (short cycles, small components at
        2^20) give the same envelope at one N; the N sweep and the r = 256
        walk arm separate them.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: The first-DP oracle as the boundary of the probe-density family.
        predicted_gain: Strict inward improvement predicted at rho_p > theta; falsified if none.
    quantifier_order: >-
      FOR EACH N in the grid and EACH T, THERE EXISTS (X, D) in the family whose
      L is at most the first-DP oracle's L at that T; the claim is about the
      ratio of the two envelopes, not about any single seed.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact toy-scale oracle envelope (greedy upper bound on c_hub) and a
        practical-rule point at charged P; nothing about cryptographic N beyond
        the stated N-independence assumption.
      nearby_object_control: >-
        NULL 1 random hubs (where the hoped-for gain must vanish) and the k = 1
        rung (where the family must reproduce the first-DP oracle).
    proof_obligations:
      - claim: Exact computation of Cov_D and tau_X by backward BFS on the functional graph.
        responsibility: correctness
      - claim: Probe counts per target reported beside group operations.
        responsibility: interface
      - claim: S_peak of traffic counters charged in Step 2.
        responsibility: memory
      - claim: Scope limited to the tested N, walks and cost unit.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: T_hub / T_DPoracle at equal L, rho_p = 1, best (D, T) per arm, N = 2^24
      direction: lower
      minimum_effect: >-
        In [0.55, 0.85] (pre-registered band); falsified as a gain if >= 0.95 at
        all three N.
    - metric: T_arm / T_DPoracle across the fine-DP ladder k in {1, 2, 4, 8, 16}
      direction: lower
      minimum_effect: Monotone non-increasing in k; k = 1 with stop rule equal to 1 within seed spread.
    - metric: c_hub = min T L^2 / N across N in {2^20, 2^22, 2^24}
      direction: different
      minimum_effect: N-independent within 5%; band [0.9, 1.4] against the first-DP 1.64.
    - metric: practical fine-DP (k = 8) traffic-selected table versus static Bernstein-Lange at equal P and T
      direction: lower
      minimum_effect: At least 10% lower L at a = 1/4, r_0 = 2, with NULL 2 collapsing to NULL 1.
    - metric: table probes per target
      direction: higher
      minimum_effect: Reported, not a success condition; about L rho_p against L/W.

  minimal_test:
    design: >-
      CHEAPEST DISCRIMINATOR: Step 1 at N = 2^20 only, arms (i) and (ii), T in
      N^{1/3} x {1/2, 1, 2}, D on a 10-point grid, 3 seeds -- exact on a graph
      of 10^6 points, minutes of CPU. The single number T_hub / T_DPoracle at
      equal L decides whether the rest (N sweep, fine-DP ladder, practical
      rule, curve) is worth running.
    controls:
      - first-DP oracle (aed829 arm) as baseline reproduction
      - NULL 1 random hubs at equal T and D
      - NULL 2 relabelled traffic (Step 2)
      - ranking-noise decay
      - r = 256 r-adding walk arm beside the keyed random function
      - static Bernstein-Lange table at equal P (Step 2)
    required_metrics:
      - exact C_D, E[min(tau, D)], L per (arm, T, D, seed)
      - (T, L) lower envelopes and interpolated T ratios with seed-bootstrap intervals
      - probes per target; lambda-weighted cost for lambda in {0, 0.01, 0.1}
      - S_peak of traffic counters (Step 2)
      - certificate pass count (Step 3)

  falsification_conditions:
    - >-
      T_hub / T_DPoracle >= 0.95 at equal L at every N: the first-DP mechanism
      is not where the constant's slack lies; recorded as a measured closure of
      "store different points" with c_hub as its number.
    - >-
      The k = 1 rung fails to reproduce the first-DP oracle: instrument void.
    - >-
      NULL 1 shows a gain over the random first-DP table at equal probes: the
      cover bookkeeping leaks; void.
    - >-
      c_hub drifts by more than 10% across 2^20-2^24: a finite-size artifact;
      no constant is reported.

  confounders:
    - >-
      Greedy is not optimal; a small measured gain may understate the true
      oracle, a large one cannot be an overstatement (greedy is feasible).
    - >-
      At 2^20 short cycles and small components are a larger fraction of the
      graph; points on DP-free or X-free cycles are uncovered by every arm and
      are reported as cycle mass.
    - >-
      Probes are free in the charged unit; the every-point rung may be
      impractical at cryptographic table sizes where each probe is a random
      memory access -- that is why the fine-DP ladder and the lambda-weighted
      cost are required outputs.

  interpretation_limits:
    - Proposal only; no run exists. The band in (C) is a pre-registered guess, not a derivation.
    - Generic, constant-factor, claim_tier toy; the exponent 1/3 does not move.
    - A gain at rho_p = 1 is a statement about the free-probe cost model; its deployment value depends on the probe price.

  heuristic_assumptions:
    - id: H-B1
      statement: >-
        N-INDEPENDENCE OF THE HUB CONSTANT. For a uniformly random mapping on N
        points, min over (X, D) with |X| = T of T L^2 / N converges, as
        N -> infinity along T = N^{1/3}, to a constant c_hub, and the greedy
        cover attains a value within 5% of its N-limit already at N = 2^20.
      rigorous_support: >-
        Rigorous: the local weak limit of a uniform random mapping near a
        uniform point is a Poisson(1) Galton-Watson tree with a size-biased
        spine (recalled, Aldous-type); depth-D ancestries of high-traffic
        points are then critical-GW functionals of scale D^2, which makes
        T D^2 / N and hence T L^2 / N scale-free. Imitated statement: the
        scale-invariance that makes aed829's C_max(a) N-independent.
      validation_plan: >-
        Exact envelopes at N in {2^20, 2^22, 2^24}, 3-5 seeds each; fit
        c_hub(N) and test flatness; tail check: the largest selected a_D(x)
        per seed against the critical-GW order-statistic prediction.
        Transfer beyond 2^24 is an assumption.
    - id: H-B2
      statement: >-
        TRAFFIC ESTIMATION. With known-start precomputation walks of total
        length P = r_0 T W, fine-DP traffic counts rank candidates by
        D-ancestry with a coverage loss relative to the oracle that decreases
        in r_0 and is at most 30% at r_0 = 2.
      rigorous_support: >-
        Each walk passes a point with probability proportional to its full
        ancestry; the imitated statement is the Poisson sampling of basins by
        uniform starts used in aed829 (B1), applied to nested covers.
      validation_plan: >-
        At N = 2^20-2^24 compare traffic-ranked covers with the exact oracle at
        r_0 in {1, 2, 4, 8}; report the loss curve; tail check on the largest
        mis-ranked candidate.

  target_complexity:
    time_exponent: Unchanged, N^{1/3} online at T = N^{1/3}; constant predicted in [0.95, 1.2] N^{1/3} (sqrt of c_hub band) against the first-DP oracle 1.28 and published 1.77.
    memory_exponent: Unchanged, N^{1/3} advice; precomputation working storage for traffic counters up to P k / W entries.
    best_known: >-
      Bernstein-Lange 1.77 N^{1/3} after 1.24 N^{2/3} (KN-LIT-3060); model
      first-DP oracle 1.28 N^{1/3} (aed829); measured re-selection
      rho_T 0.65-0.69 at S_peak 2.6-8.9 T (EV-ECDLP-60e266).
    hidden_overhead: >-
      Probes: about L rho_p per target, i.e. up to one hash-table probe per
      group operation at rho_p = 1, uncharged in the RQ unit and disclosed.
    tradeoff_note: >-
      A probe-count versus table-size curve indexed by k; walks remain
      independent, so parallelisation is unchanged; the table is read-only
      online.

  dominated_by: >-
    n/a (no result claimed). Rows checked: Bernstein-Lange static; aed829
    first-DP oracle (a member of this family); H-ECDLP-37dc01 re-selection
    and IDEA-20260906-a3d6ae growth (first-DP designs, composable with hubs);
    CGK generic line (constant unspecified; respected). On the probe axis,
    every first-DP design dominates the rho_p = 1 rung.
  sota_delta: >-
    Predicted 15-45% fewer stored entries at equal online group operations
    against the first-DP oracle ceiling, at the price of about W times more
    table probes at rho_p = 1 (fewer on the fine-DP rungs); zero exponent
    change; no measured delta exists.

  object_studied: Depth-capped covers of stored points on the walk's functional graph.
  depth_of_verified_structure: >-
    The family contains the first-DP design (so its oracle is at least as
    good); everything else is a prediction.
  enumerated_closures:
    - >-
      MULTIPLE WALK FUNCTIONS (Hellman-style m tables of T/m entries): a
      restart under function i covers C(a/m) per walk against C(a) for one
      table, and C_max is concave in a (0.27, 0.39, 0.52, 0.66 at
      a = 1/8, 1/4, 1/2, 1), so splitting loses for every m >= 2 because DLP
      restarts are free re-randomisations. Closed at the aed829 model level;
      forward: only if restarts were not free (they are, here).
    - >-
      START-INDEX ADVICE COMPRESSION (store the index of a generating walk
      instead of the log): halves bits per entry at T = N^{1/3} but adds one
      regeneration walk per solve (about W to 1.5 W, estimated); at a = 1/4
      that is +28% to +42% in L, so S L^2 changes by a factor about
      0.5 x (1.28 to 1.42)^2 = 0.82 to 1.01 -- an ESTIMATE, not a closure,
      recorded as Pareto-near-neutral at the Bernstein-Lange operating point.
  open_directions:
    - Hub tables grown by batch walks (compose with IDEA-20260906-a3d6ae).
    - Fine-DP ladder at cryptographic probe prices.
    - A lower bound on c_hub for all single-walk table designs (the constant-level analogue of KN-LIT-013).

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      New cover/BFS code on top of the existing exact functional-graph
      instrument; Step 1 at 2^20 is minutes; 2^24 with greedy covers is
      hours on one core at most.
  recommended_priority: medium
  priority_rationale: >-
    The only proposal on this RQ that is not bounded by the C_max ceiling
    every other proposal lives under; constant-factor, so not target-class,
    and its deployment value depends on a probe price the RQ does not charge.
  honest_prior_of_survival: >-
    0.5 that the every-point rung gains at least 15% at equal L; 0.3 that the
    k = 8 fine-DP rung gains at least 10%; 0.2 that the practical traffic rule
    at r_0 = 2 beats static Bernstein-Lange by 10% at equal P.

