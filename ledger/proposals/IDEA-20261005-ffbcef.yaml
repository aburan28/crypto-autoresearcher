  title: >-
    Multiplication by 35 has degree 1225 and multiplication by 34 has degree 1156
  class: measurement
  claim: >-
    Multiplication by 35 has degree 1225. Multiplication by 34 has
    degree 1156. One thousand two hundred twenty-five exceeds one thousand
    one hundred fifty-six by 69. The product of the two degrees is 1416100.
    Their sum is 2381. The gap is a map degree, not an ECDLP exponent
    and not the degree pair 1156 and 1089.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Thirty-five squared is 1225. Thirty-four squared is 1156. Two
    maps of degree 1156 have gap 0 and product 1336336. No point is mapped.
  novelty_status: unverified
