idea:
  id: IDEA-20260905-579fcc
  title: 'MULTISETS OF x OVER A SHIFT SET ARE EITHER A CHANGE OF COORDINATES OR THE SHIFTED KUMMER COORDINATE, NOTHING
    IN BETWEEN - for S subset Z/N of size r >= 2 and fixed R, P |-> { x(P + sR) : s in S } is injective unless S
    is centrally symmetric (S = c - S), in which case it is exactly the translation-conjugate coordinate x_T with
    2T = -cR and has meter values (L, b) = (1, 2); the scalar-orbit multiset over H <= (Z/N)^* costs |H| per orbit
    (the KN-TECH-018 accounting); classes (7) and (9) of the brief closed with a theorem, a meter prediction and
    the generic-group ceiling stated'
  class: control
  claim: 'REPRESENTATION CLASS AND STAGE (RQ-ECDLP-623a32): class R1 (field values - the unlabelled multiset of
    x-coordinates over a shift set or a scalar orbit); attack stage whose charged cost is addressed is collision
    structure (walk state); the claimed change is zero (shift sets) or a quantified LOSS sqrt(|H|) (orbits). Let
    G = <P> have prime order N, fix R in G, R != O, and S subset Z/N, |S| = r >= 2; define M_S(P) = { x(P + sR)
    : s in S } as a multiset. (M1) DICHOTOMY. For generic P, M_S(P) = M_S(P'') iff P'' = P, or S is centrally symmetric
    (S = c - S) and P'' = -P - cR. SKETCH: equality of multisets means a bijection sigma of S and signs eps_s with
    P'' + sigma(s) R = eps_s (P + sR); for generic P the eps_s are constant; eps = +1 forces sigma(s) - s constant,
    hence sigma = id on a finite set and P'' = P; eps = -1 forces sigma(s) = -s - c, hence S = -S - c and P'' =
    -P - cR. (M2) CONSEQUENCE. Non-symmetric S: M_S injective, a change of coordinates, (L, b) = (0, 1). Symmetric
    S: fibres {P, -P - cR} = orbits of the involution P |-> -P - cR, whose quotient is the degree-2 coordinate x_T(P)
    = x(P - T) with 2T = -cR (NULL-3 of IDEA-20260807-4fc635); (L, b) = (1.000, 2.000) exactly, and every measurement
    on M_S reproduces the Kummer baseline after retargeting. (M3) DILATION VARIANT. For H <= (Z/N)^*, O_H(P) = {
    x(hP) : h in H } is a function on H-orbits: lossy by log2 |H| bits, deterministic under every scalar multiplication,
    NOT under translation; computing it costs |H| scalar multiplications per orbit, so an orbit walk gains sqrt(|H|)
    in space and loses |H| per step - net loss sqrt(|H|), the reason KN-TECH-018 restricts the discount to cheap
    automorphisms. (M4) CEILING. Every function of a multiset of x-values under group operations is generic-group
    simulable (x used only for equality and hashing), so nothing in class (9) beats Omega(sqrt N) (KN-TECH-005,
    KN-FIND-b7e091); the sole non-generic reading is a field-structured statistic (sums of h(x) over intervals),
    whose forced value is equidistribution up to Weil error (Kohel-Shparlinski, recalled), named as the one open
    corner. TWO EXPLANATIONS DISCRIMINATED. E-A: some shift or dilation multiset is a genuinely new lossy propagating
    object (L >= 1, 1 < b << |S|). E-B: every such multiset is (0, 1) or (1, 2) exactly, per (M1)-(M2). The meter
    decides.'
  mechanism: 'OBJECT FRAME. Two PAIRS. (i) Shift multisets: (representation: the unlabelled multiset M_S(P) of x-values;
    operation set Sigma: the affine involution P |-> -P - cR, i.e. negation conjugated by a translation, together
    with the single translation by R that slides the window). TRICHOTOMY CLASS: for centrally symmetric S, Class
    I partial-action, reason: M_S is deterministic under the involution (its fibres are the involution''s orbits,
    a block system of <Sigma> per IDEA-20260901-863e36 (C1)) and under nothing else; for asymmetric S the map is
    injective and has no class (discards nothing). Sigma is not the full translation action. WHAT IS DISCARDED:
    for symmetric S exactly the sign bit of the recentred point (lossy in the representation used, fibre size 2);
    the discard is Sigma-compatible because the fibre partition is the orbit partition of the involution; for asymmetric
    S nothing is discarded, which is the failure the frame excludes. (ii) Scalar-orbit multisets: (representation:
    O_H(P); Sigma: multiplication by H). Class I partial-action, reason: fibres are the H-orbits, a block system
    of <H> (863e36 (C3), the multiplication slice); the discard (which orbit element) is compatible with Sigma and
    incompatible with translation; the priced number is the canonicalisation cost c_can = |H| scalar multiplications
    per orbit (863e36 (C4)-(C5): generic canonicalisation is Omega(sqrt|H|), morphism-induced O(1) only inside Aut(E)).
    The labelling s |-> x(P + sR) is what the multiset forgets; recovering P from the unlabelled set is possible
    iff the label structure is rigid, and a finite subset of Z/N has trivial translation stabiliser and a reflection
    symmetry only when centrally symmetric. So the only information a multiset can discard is the Kummer sign.'
  non_generic_operation:
    operation: None made cheaper; the record shows the class reduces to x-coordinate comparisons (generic) or to
      a (1, 2) coordinate.
    attack_stage: collision structure (walk state); predicted unchanged
  object_first_candidate:
    tracked_object: The unlabelled multiset of x-values over a shift set S, or over a scalar orbit H.
    established_families_off_limits: F1 (walk-collision) and F6 (automorphism orbit) are the closed neighbours and
      are used as COMPONENTS (see assumptions); the object here is the multiset itself, tested for lossiness.
    lossy_projection_test: 'Asymmetric S: loses nothing (fails clause one). Symmetric S: loses 1 bit compatibly
      with the involution, but it is the Kummer bit, a reparametrisation of x_T. Predicted meter values (0, 1) and
      (1, 2). H-orbit multiset: loses log2 |H| bits, propagates under dilation only, per-step cost |H|.'
    survival: (M1) is a theorem for generic P and survives every S, R, curve and p. The corner it does not reach
      is (M4)'s field-structured statistic.
