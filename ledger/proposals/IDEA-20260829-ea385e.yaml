idea:
  id: IDEA-20260829-ea385e
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE DECLARED EQUIVALENCE IS NOT COST-PRESERVING, AND A COVERING FRACTION
    COMPUTED IN THE WRONG QUOTIENT IS NOT A COVERING FRACTION: audit whether
    bit-rotation and step-shift preserve the attack-cost proxy on SHA-1
    disturbance vectors, with rotation-invariance as the positive control the
    instrument must reproduce exactly
  class: measurement

  claim: >-
    RQ-DIFFP-a5c483's declared equivalence relation includes BOTH "step shifts"
    AND "bit rotations" as generators saying when two differential paths are
    THE SAME OBJECT. Define this program's own declared cost proxy for a SHA-1
    disturbance vector as the Hamming weight of the vector restricted to steps
    20 through 79 -- the count of local collisions outside the first round,
    which is the standard shape of a disturbance-vector cost function and which
    is declared HERE as an in-repository proxy, NOT read from any paper.
    (A) BIT-ROTATION PRESERVES THIS COST EXACTLY. Rotation permutes bit
    positions within every word simultaneously and does not move any bit across
    a step boundary, so the per-step weight vector is unchanged and the cost is
    invariant. This is a KNOWN ANSWER and the instrument must reproduce it at
    every draw.
    (B) STEP-SHIFT DOES NOT PRESERVE IT. Shifting the step index moves bits
    across the boundary at step 20 and across the end of the 80-step window, so
    cost changes whenever the boundary content is nonzero.
    (C) THEREFORE THE DECLARED RELATION IS TOO COARSE FOR ANY COST-BOUNDED
    STATEMENT. Two disturbance vectors the adjudicator calls THE SAME OBJECT
    can have different attack costs, so a covering fraction, a tiling claim, or
    a NON-MEMBER verdict computed in the full quotient is a statement about a
    quotient in which the quantity that decides usefulness is not a function.
    THE FALSIFIABLE, QUANTITATIVE FORM, WHICH IS WHAT THIS PROPOSAL ACTUALLY
    MEASURES: the within-orbit cost spread -- maximum cost minus minimum cost
    over an orbit -- is EXACTLY ZERO for the rotation subgroup on 100 percent
    of sampled orbits, and is STRICTLY POSITIVE on at least 50 percent of
    sampled orbits once step-shift is admitted, with the spread distribution
    reported as a function of the orbit's minimum cost. IF INSTEAD the spread
    is zero for step-shift too, that is an equally real and more surprising
    result -- it would mean the declared relation is cost-safe and that the
    covering fraction can be computed in the full quotient after all.
    NO PATH IS CLAIMED NEW AND NO ATTACK COST IS CLAIMED.

  mechanism: >-
    An equivalence relation is a choice about what to forget. This program
    declared one and then verified its generators against a CONFORMANCE
    criterion -- does the generator map conforming paths to conforming paths --
    which is the right check for the question "is this the same mathematical
    object" and is the WRONG check for the question "is this the same attack".
    A generator can be perfectly conformance-preserving and still change the
    number that decides whether anyone would ever use the object.
    THE MECHANISM IS A BOUNDARY EFFECT AND IT IS ELEMENTARY. The cost proxy is
    a weight restricted to a WINDOW of steps. Rotation acts inside words and
    commutes with the windowing, so it is a symmetry of the cost. Step-shift
    acts on the window index and does not commute with it, so it is a symmetry
    of the CODE but not of the COST. The two generators therefore sit on
    opposite sides of a distinction the declared relation does not make.
    WHY THIS MATTERS RATHER THAN BEING A PEDANTIC OBSERVATION. The goal's
    completion criterion 2 asks for a covering statement: how many orbits does
    the published census occupy, and how much of the REACHABLE, BUDGET-FEASIBLE
    difference space do those orbits cover. "Budget-feasible" is a cost
    predicate. If cost is not constant on orbits, then "the budget-feasible
    part of the orbit space" is not even well defined, and the criterion cannot
    be met as written until the relation is refined -- for instance to the
    rotation subgroup alone, or to the subgroup of shifts whose boundary
    content is zero, which is a computable condition per codeword.
    THE CONSTRUCTIVE OUTPUT is therefore a REFINED RELATION with a declared
    justification, plus the exact denominator IDEA-20260829-f2ffc1 supplies for
    the rotation-only quotient, plus a rule that every future covering or
    novelty statement names WHICH quotient it was computed in -- the same
    discipline this campaign already imposed on differing-cell counts, which no
    record may report without naming its selector.

