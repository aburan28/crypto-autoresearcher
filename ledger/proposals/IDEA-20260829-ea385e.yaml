  assumptions:
    - >-
      The cost proxy is DECLARED BY THIS PROGRAM, not adopted from any paper.
      Every number produced is scoped to it. If the published cost function is
      materially different -- for instance if it weights steps unequally, or
      counts something other than set bits -- the qualitative conclusion about
      rotation versus shift survives (rotation commutes with ANY per-step
      functional of the weight vector; shift commutes with none that depend on
      the step index) but the quantitative spread distribution does not.
    - >-
      Step-shift is implemented as the module automorphism of
      IDEA-20260829-f2ffc1 C3, i.e. shifting the window on the bi-infinite
      solution space, NOT as an array shift with zero fill. Which of the two
      the committed adjudicator implements is a read-off task and is one of
      this audit's declared outputs.
    - >-
      Sampling random codewords is a valid probe of the spread distribution at
      HIGH cost only. Low-cost codewords are not obtainable by uniform sampling
      and the low-cost regime is probed separately by sparse-information-word
      draws, whose bias is declared rather than corrected.

  proof_search_map:
    bottleneck: >-
      Deciding in which quotient a covering fraction for SHA-1 disturbance
      vectors is to be computed. Until this is settled, criterion 2 cannot be
      met by any amount of enumeration, because "budget-feasible orbit" is not
      well defined if cost is not constant on orbits.
    baseline_embedding:
      parameter_slice: >-
        Restricting the group to the trivial group reproduces the ungrouped
        baseline in which cost is trivially constant on singleton orbits and
        the spread is identically zero. Restricting to the rotation subgroup
        must ALSO give identically zero spread, and that is the positive
        control. The full declared group is the parameter slice under test.
      reproduction_check: >-
        Frozen fixture: 10^4 codewords drawn under declared seeds; for each,
        the 32 rotation images; require per-step weight vectors to be
        BITWISE-IDENTICAL as multisets and total cost to be EXACTLY equal, at
        32 of 32 images, on 10^4 of 10^4 codewords. A single exception is a
        bug in the group implementation and halts the audit before any
        step-shift number is read.
    observation_collision:
      observable: >-
        The orbit identifier (canonical form) emitted by the adjudicator, and
        the cost proxy.
      distinct_preimage_search: >-
        THE ENTIRE PROPOSAL IS AN OBSERVATION-COLLISION SEARCH, aimed
        deliberately at the pair (orbit id, cost): find two objects with the
        SAME orbit identifier and DIFFERENT cost. Such a pair does not falsify
        the equivalence as a mathematical relation; it falsifies the
        equivalence AS A CARRIER OF THE CONCLUSION "these two are the same
        attack", which is the conclusion any covering or novelty statement
        actually needs. The dual search -- different orbit identifier, same
        cost -- is run too and is NOT a falsifier, since cost is a lossy
        invariant and collisions are expected; its rate is reported as the
        invariant's resolving power.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the orbit identifier fixed and vary the group coordinate; the
          fiber is the orbit, and cost is the intrinsic invariant that
          distinguishes points within it.
        predicted_gain: >-
          A direct, per-witness demonstration that the forgotten structure
          carries the decision-relevant quantity, which is the strongest cheap
          argument that the relation must be refined.
      - transform: stronger_invariant
        proposed_object: >-
          The COST-REFINED quotient: orbits under the rotation subgroup, or
          under the subgroup of step-shifts whose boundary content is zero,
          which is a per-codeword computable condition.
        predicted_gain: >-
          A quotient in which cost IS a function, making "budget-feasible
          orbit" well defined and criterion 2 reachable in principle.
    quantifier_order: >-
      Claim A: "FOR ALL codewords c AND FOR ALL rotations r, cost(r.c) =
      cost(c)" -- universally quantified, checked exhaustively over the 32
      rotations for every sampled c. Claim B: "THERE EXISTS a codeword c and a
      step-shift s with cost(s.c) not equal to cost(c)" -- a bare existential
      discharged by exhibiting ONE witness with its two integers, which is why
      B is cheap. Claim C, the quantitative one, is the mixed statement "for a
      declared sampling distribution D, the probability over c drawn from D
      that the shift-orbit spread of c exceeds zero is at least 0.5", and it is
      an estimate with a confidence interval, NOT a theorem. THE THREE ARE
      REPORTED SEPARATELY AND NEVER MERGED INTO ONE SENTENCE.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the declared relation's step-shift generator does not preserve a
        DECLARED cost proxy, with an explicit witness, and a spread
        distribution over a DECLARED sampling distribution. IT CANNOT CERTIFY
        anything about the published cost function, which has not been read;
        it cannot certify that the refined relation is the RIGHT one, only that
        the unrefined one is not cost-safe; and it cannot produce a covering
        fraction, because it produces no cost-bounded enumeration.
      nearby_object_control: >-
        SHA-0. Its expansion code decomposes into 32 independent binary codes,
        so its automorphism group is much larger and its step-shift acts
        differently; the audit must produce a DIFFERENT spread profile for
        SHA-0 than for SHA-1 at matched sampling. An instrument returning the
        same profile for both is measuring the windowing and nothing else, and
        its SHA-1 numbers carry no SHA-1-specific content. A SECOND nearby
        object where the hoped-for conclusion FAILS: a cost proxy defined as
        the weight over ALL 80 steps rather than steps 20-79. Step-shift on the
        bi-infinite module then changes the total weight only through the
        window ends, so the spread must SHRINK sharply. If it does not, the
        mechanism attributed here (a boundary effect) is not the mechanism
        operating.
    proof_obligations:
      - claim: >-
          PO-0. SHA-1's step count, round boundaries and expansion recurrence
          are pinned from FIPS 180-4 primary text before any cost is computed.
        responsibility: baseline
      - claim: >-
          PO-1. The rotation implementation is a genuine bit-rotation within
          words and moves no bit across a step boundary, verified by a
          per-step weight-vector identity check.
        responsibility: correctness
      - claim: >-
          PO-2. The step-shift implementation maps the code to itself, verified
          by re-checking the recurrence on every image; if it does not, the
          audit reports THAT and stops, since it would mean the declared
          generator is not an automorphism at all.
        responsibility: correctness
      - claim: >-
          PO-3. The sampling distribution is declared with its seeds and its
          bias stated, and the low-cost regime is reported separately from the
          uniform regime and never pooled.
        responsibility: scope
      - claim: >-
          PO-4. Orbit enumeration is either exhaustive (32 * ord(T) images) or
          declared as a SAMPLE, in which case every spread is reported as a
          LOWER BOUND and never as the spread.
        responsibility: strictness
      - claim: >-
          PO-5. Whether the committed adjudicator's generators implement
          window-shift or zero-fill array shift is read off from committed
          source and reported, with the derivation, as a separate deliverable.
        responsibility: interface

  predictions:
    - metric: >-
        rotation_cost_invariance_rate (fraction of (codeword, rotation) pairs
        with cost exactly preserved)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0 over 10^4 codewords times 32 rotations. This is the
        instrument firing on a known answer; anything below 1.0 voids the run.
    - metric: >-
        shift_cost_spread_positive_fraction (fraction of sampled codewords
        whose orbit under the full declared group has strictly positive cost
        spread)
      direction: higher
      minimum_effect: >-
        at least 0.5 under uniform sampling. A measured value near 0.0 is the
        OPPOSITE result and is equally reportable: it would mean the declared
        relation is cost-safe in practice and criterion 2 can be attempted in
        the full quotient.
    - metric: >-
        median_shift_cost_spread (median over sampled codewords of max minus
        min cost within the orbit, in units of set bits)
      direction: higher
      minimum_effect: >-
        at least 8 set bits under uniform sampling. Reported separately for the
        sparse-information-word regime, where no minimum effect is predicted
        because the regime has never been measured.
    - metric: >-
        full_window_cost_spread_ratio (median spread under the all-80-steps
        proxy divided by median spread under the 20-79 proxy)
      direction: lower
      minimum_effect: >-
        below 0.5. This is the mechanism test: if the spread is a boundary
        effect, removing the interior boundary must shrink it substantially.
    - metric: sha0_versus_sha1_spread_profile_distance
      direction: different
      minimum_effect: >-
        the two median spreads differ by at least a factor of 2, or the
        SHA-1-specific content of the measurement is nil.
    - metric: >-
        adjudicator_shift_implementation (categorical: window-shift,
        zero-fill array shift, or absent)
      direction: different
      minimum_effect: >-
        a categorical answer with a written derivation from committed source,
        not a description. This is the read-off deliverable and it is also the
        candidate mechanical explanation for the two verified generators that
        emit no orbit image.

  minimal_test:
    design: >-
      ONE SMALL EXECUTOR TASK, four stages, all cheap, and it FAILS FAST.
      STAGE 0 pins the recurrence, step count and round boundaries from FIPS
      180-4 primary text and declares the cost proxy in the frozen contract.
      STAGE 1 IS THE POSITIVE CONTROL AND IT GATES EVERYTHING: draw 10^4
      codewords under declared seeds, apply all 32 rotations, and require
      per-step weight vectors identical and cost exactly equal at 320000 of
      320000 pairs. If it fails, stop and report a group-implementation defect;
      NO STEP-SHIFT NUMBER MAY BE READ FROM A RUN WHOSE POSITIVE CONTROL DID
      NOT FIRE. STAGE 2 constructs and reports ONE EXPLICIT WITNESS: a codeword
      c and a shift s with cost(c) and cost(s.c) written out as two integers,
      together with the per-step weight vectors of both, so a reader can check
      the arithmetic by hand. STAGE 3 measures the spread distribution over
      two declared sampling regimes -- uniform over the module, and sparse
      information words of Hamming weight 1, 2 and 3 -- enumerating each orbit
      exhaustively if 32 * ord(T) is small enough and otherwise sampling a
      declared number of group elements and reporting every spread as a LOWER
      BOUND. STAGE 4 runs the two nearby-object controls (SHA-0, and the
      all-80-steps proxy) at matched sampling, and reads off from committed
      source which shift the adjudicator actually implements. All tables emit
      unmeasured cells as null, never as 0.
    controls:
      - >-
        POSITIVE CONTROL (STAGE 1, GATING): rotation must preserve cost
        exactly, a known answer derivable by hand. THIS IS THE INSTRUMENT
        SHOWN TO FIRE, and no negative or null result from stages 2-4 may be
        reported from a run in which it did not.
      - >-
        HAND-CHECKABLE WITNESS (STAGE 2): a single pair with both integers and
        both weight vectors printed, so the central claim does not depend on
        trusting any aggregate.
      - >-
        NULL OBJECT: repeat the whole measurement with the group replaced by
        the TRIVIAL group. Spread must be identically zero. A pipeline that
        reports positive spread for the trivial group is measuring its own
        sampling noise.
      - >-
        SECOND NULL OBJECT: replace the code by a random 512-dimensional binary
        subspace with no rotation invariance and apply the same rotation
        images. Cost must now generally NOT be preserved. If it is preserved,
        the cost function is not reading the input.
      - >-
        MECHANISM CONTROL: the all-80-steps proxy, where the boundary effect is
        removed and the spread must shrink.
      - >-
        NEARBY-OBJECT CONTROL: SHA-0 at matched sampling.
      - >-
        SAMPLING-BIAS DISCLOSURE: uniform and sparse regimes reported
        separately and never pooled, with the seeds and draw counts recorded.
    required_metrics:
      - rotation_cost_invariance_rate (with the 320000-pair denominator shown)
      - the explicit witness pair, both costs, both per-step weight vectors
      - shift_cost_spread_positive_fraction, per sampling regime
      - median_shift_cost_spread and its interquartile range, per regime
      - spread as a function of the orbit's minimum cost (binned table)
      - orbit_enumeration_mode per codeword (exhaustive or sampled) and, if
        sampled, the number of group elements drawn
      - full_window_cost_spread_ratio
      - sha0_versus_sha1_spread_profile_distance
      - trivial_group_spread and random_subspace_rotation_invariance_rate
      - adjudicator_shift_implementation, with its derivation from source

  falsification_conditions:
    - >-
      Rotation is measured NOT to preserve cost. Either the group
      implementation is wrong or claim A is false; both halt the audit and
      neither is reported as a finding about SHA-1.
    - >-
      No witness of claim B can be constructed after an exhaustive search over
      the 32 * ord(T) images of 10^4 codewords. Claim B is then false as
      stated, the declared relation IS cost-safe, and this proposal's central
      contention collapses -- which is a clean, cheap, reportable negative that
      MAKES CRITERION 2 EASIER rather than harder.
    - >-
      shift_cost_spread_positive_fraction comes out below 0.05 under uniform
      sampling: the quantitative claim C is false even if the existential B
      holds, and the correct disposition is "the relation is cost-unsafe in
      principle and cost-safe in practice", which must be stated as such and
      not as either extreme.
    - >-
      full_window_cost_spread_ratio comes out near or above 1: the attributed
      boundary mechanism is wrong, and the spread has some other cause that
      must be found before the refinement proposed here is justified.
    - >-
      SHA-0 and SHA-1 produce indistinguishable spread profiles: the
      measurement has no primitive-specific content and its SHA-1 numbers must
      not be cited as being about SHA-1.
    - >-
      The committed adjudicator turns out not to implement step-shift at all.
      Claim C is then vacuous AGAINST THAT ARTIFACT -- though not against the
      relation as the RQ declares it -- and the honest report separates the two.

  confounders:
    - >-
      PROXY SUBSTITUTION. The cost proxy is this program's own. A reader who
      takes a spread measured under it as a statement about published attack
      complexity has substituted one function for another. Every emitted field
      must name the proxy, exactly as this campaign already requires every
      differing-cell count to name its selector.
    - >-
      SAMPLING REGIME. Uniform codewords are dense and their costs cluster near
      half the window; the interesting regime is sparse and is reached only by
      a biased draw. Pooling the two regimes would produce a single number that
      describes neither.
    - >-
      ORBIT ENUMERATION DEPTH. If ord(T) is large the orbits cannot be
      enumerated and every spread is a lower bound. A lower bound reported as a
      spread would overstate nothing in the positive direction but would
      understate the effect, and a NEAR-ZERO spread obtained from a shallow
      sample is exactly the artifact that would produce a false "the relation
      is cost-safe" conclusion. The enumeration mode is therefore a required
      per-codeword metric, not a footnote.
    - >-
      THE WINDOW BOUNDARY AT STEP 20 IS ITSELF A MODELLING CHOICE. Choosing 20
      because SHA-1 has four 20-step rounds is reasonable and is not derived
      from any measured attack. The all-80-steps control exists partly to keep
      this choice from being load-bearing.
    - >-
      DOUBLE-COUNTING WITH IDEA-20260829-f2ffc1. That record supplies ord(T)
      and the canonical form. If it has not been executed, this audit must
      compute them itself and must report them as ITS OWN measurements, not
      cite a sibling proposal's predictions as results.

  interpretation_limits:
    - >-
      NOTHING HERE IS A COVERING FRACTION. This audit determines WHICH QUOTIENT
      a covering fraction may legitimately be computed in; it computes none.
    - >-
      NO PATH IS CLAIMED NEW, no cost is claimed for any real attack, and no
      statement is made about any deployed system. Claim tier ceiling
      `analyzed`.
    - >-
      A NON-MEMBER verdict from the committed adjudicator is scoped to a census
      of readable size zero and remains uninformative about the literature
      whatever this audit finds. Refining the relation does not create census
      content.
    - >-
      Scoped to SHA-1's expansion code as pinned, to the declared cost proxy,
      to the two declared sampling regimes, to the seeds actually used, and to
      the group actually implemented. SHA-0 appears only as a control.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The Hamming weight of a disturbance vector restricted to steps 20-79 is
        a MONOTONE PROXY for the attack cost of the near-collision path it
        induces: among vectors of comparable structure, more set bits outside
        the first round means more local collisions to satisfy and higher cost.
        This imitates the classical practice of selecting disturbance vectors
        by low weight in the later rounds.
      rigorous_support: >-
        The rigorous part is only that each set bit outside the first round
        marks the start of a local collision whose conditions must be paid for,
        so cost is NON-DECREASING in the count under the standard local-
        collision accounting of KN-TECH-066. The monotonicity is NOT a theorem:
        published cost functions are known (at search-summary level) to weight
        positions unequally, so weight is a lower-resolution statistic than the
        real cost.
      validation_plan: >-
        Two routes, both executable without acquisition. (i) INTERNAL
        CONSISTENCY: compute, for 10^3 sampled vectors, both the plain window
        weight and a position-weighted variant with declared weights, and
        report the rank correlation; a Spearman coefficient below 0.7 means the
        proxy choice is load-bearing and every result must be reported under
        both. (ii) STRUCTURAL: verify that the qualitative rotation/shift
        asymmetry holds for EVERY per-step functional of the weight vector,
        which is an algebraic argument requiring no sampling and which, if it
        goes through, makes claims A and B independent of H1 entirely. Tail
        check: the vectors with the smallest observed window weight are
        inspected individually and their per-step profiles printed, so that a
        degenerate minimiser (for example an all-zero vector) cannot silently
        anchor the distribution. Sampled parameters: width 32, 80 steps,
        uniform and sparse regimes, seeds declared in the contract. TRANSFER
        ASSUMPTION, STATED: no transfer from this proxy to any published cost
        function is claimed, and the comparison is an acquisition obligation.
    - id: H2
      statement: >-
        Sampling the group uniformly at random from the 32 * ord(T) elements
        gives an unbiased estimate of the orbit's cost RANGE up to the usual
        extreme-value shortfall, so a sampled spread underestimates the true
        spread by an amount that shrinks with the number of draws. This
        imitates the standard use of random sampling to lower-bound the range
        of a function on a large finite set.
      rigorous_support: >-
        Rigorous only as a lower bound: any sampled max minus min is at most
        the true spread, with probability one. There is no rigorous upper bound
        on the shortfall without knowing the cost distribution on the orbit.
      validation_plan: >-
        Sample 2^k group elements for k = 4, 6, 8, 10 on the same 10^3
        codewords and plot the measured spread against k. A curve that
        PLATEAUS supports the estimate; a curve still rising at k = 10 means
        every reported spread is a loose lower bound and must be labelled so.
        Cross-check against exhaustive enumeration on the subset of codewords
        whose orbits are small enough to enumerate, and report the sampled
        versus exhaustive ratio for exactly those. Tail check: report the
        single largest spread observed and confirm it is attained by more than
        one codeword, since a unique extreme is usually a bug.

  target_complexity:
    time_exponent: >-
      Cost evaluation is O(80 * 32) = 2^11 bit operations. Stage 1 is
      10^4 * 32 = 2^18 evaluations. Stage 3 is at most 10^4 codewords times
      2^10 sampled group elements times 2^11 bit operations, about 2^34 bit
      operations, i.e. minutes single-threaded. Exhaustive orbit enumeration
      would be 32 * ord(T) per codeword and is bounded only once ord(T) is
      measured; the contract therefore caps sampled group elements and declares
      any resulting spread a lower bound.
    memory_exponent: >-
      Negligible: 2560 bits per codeword and at most 10^4 codewords resident,
      about 3 MB. No table, no tradeoff.
    best_known: >-
      There is NO known method in this program for deciding which quotient a
      covering fraction should be computed in -- the quantity has never been
      measured, and four batches of instrument work computed membership
      verdicts without ever asking whether the relation preserves the
      decision-relevant quantity. In the literature the position is UNKNOWN
      because no primary source was opened; a cost function for disturbance
      vectors is asserted at search-summary level to exist, and whether its
      behaviour under the equivalence has been examined is unknown.
    hidden_overhead: >-
      No asymptotic parameter and no o(1). What IS hidden and is stated: the
      whole measurement is under a self-declared cost proxy, so the honest
      description of the output is "the declared relation does not preserve
      THIS function", and the step from there to "does not preserve attack
      cost" is exactly H1, which is validated only by internal consistency
      until acquisition happens.
    tradeoff_note: >-
      Embarrassingly parallel across codewords; no memory pressure and hence no
      time-memory tradeoff. The only real budget knob is the number of group
      elements sampled per orbit, which trades wall clock against the
      tightness of a lower bound, and that trade is reported per codeword
      rather than hidden in an aggregate.

  dominated_by: >-
    PARETO CHECK ROW BY ROW. (1) Against this program's committed adjudicator
    and its four batches of control work (EV-DIFFP-b878aa, EV-DIFFP-b16b01,
    EV-DIFFP-afd96c, EV-DIFFP-1e08cc, abstracted in KN-TECH-6785f2): NOT
    dominated -- every one of those measures the instrument's power to
    DISTINGUISH objects under a fixed relation, and none measures whether the
    relation preserves the quantity a covering claim depends on. (2) Against
    the pending ~2950 s selector-swap control named in the goal's live
    next_action: NOT dominated and CHEAPER by roughly an order of magnitude;
    the selector-swap measures whether a differing-cell count is a property of
    the pair or of the selector, which is a question about the counting rule,
    while this is a question about the quotient. They are complementary and
    this one does not presuppose the funding decision. (3) Against
    IDEA-20260829-f2ffc1: NOT dominated; that record computes a denominator and
    is silent on cost. (4) Against the retrieved-but-unopened Manuel
    classification and cost function: UNKNOWN AND POSSIBLY DOMINATING. If that
    work states the behaviour of its cost function under step offset and
    rotation, this audit re-derives a published fact under a different proxy,
    and its honest status would drop to a replication. That row cannot be
    closed without acquisition and IS NOT CLOSED HERE. (5) Against
    IDEA-20260828-400967 and the RQ-MDFIVE / RQ-SHAONE proposal round of
    2026-08-28: NOT dominated and disjoint -- those measure template density,
    MITM ceilings, detector coverage and cost-model arithmetic, and none
    concerns the equivalence relation on paths.
  sota_delta: >-
    QUANTITATIVELY. Against the program's own state: the within-orbit cost
    spread is currently UNMEASURED (no value on record, in any batch, for
    either primitive), and this proposal produces it for SHA-1 in about 2^34
    bit operations with a two-sided known-answer control at 320000 pairs. If
    claim B holds, the delta is categorical rather than numerical: the number
    of quotients in which this program may legitimately state a covering
    fraction drops from one (the declared relation, assumed adequate) to a
    refined subgroup, and every future covering statement gains a mandatory
    selector field. NO CRYPTANALYTIC DELTA IS CLAIMED: no attack cost improves,
    no path is found, nothing is said about SHA-1's security, and the cost
    proxy is this program's own and is not any published complexity.

