idea:
  id: IDEA-20260905-fbe4a0
  title: Relative syzygy gluing across a Semaev chain separator
  class: mechanism
  claim: 'For two summation subsystems sharing one internal coordinate, the non-rewritable syzygy quotient may be
    controlled by a relative gluing module on that separator. Conjecture: after Koszul and membership syzygies are
    removed, this module either stays bounded with chain length or exposes the exact growing obstruction to a local-to-global
    degree bound.'
  mechanism: Write the chain ideal as two overlapping ideals in rings sharing the separator variable. Relations
    intrinsic to either side are already explained. The remaining quotient records compatibility relations across
    the separator, analogous to a fiber-product or mapping-cone correction. A small separator in the variable graph
    does not guarantee low algebraic degree; it may transmit exponentially complicated elimination data. The proposed
    object measures that missing algebra directly. Signatures and minimal non-rewritable generators remain the claim-carrying
    quantities, preserving the question's requirement to avoid the old normality proxy.
