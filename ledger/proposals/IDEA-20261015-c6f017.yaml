      iteration per core on Core 2 in 2009, Bailey's walk, no per-step
      canonicalization) <-> KR-RHO-482ed3 (canonicalization is charged in the
      sqrt(m) count). Transfer: the program's reference design canonicalizes
      every step; the 2009 design did not; at n=131 the first has a measured
      68 ns canonicalization and an unmeasured step, the second has a
      measured 2009 step and no canonicalization. One harness prices both.
    - >-
      GOAL-ECDLP2M-001 roll-ups RQ-QSP-f9bbdb (n=131 census, H-QSP-cd0c90),
      RQ-CERTBIN-836ce2 (ECC2K curves), KN-OPEN-095df5 / KN-FIND-b9a41d (n=131
      factor bases) <-> RQ-ICPERF-94c86e's rule that every cell carries a
      matched rho on the same machine. Transfer: these lanes report costs at
      n=131 with no denominator; a step price in the program's own ns and
      units is the missing column of every one of their tables.
    - >-
      research/n83_evaluation_20261012 (StrongRhoG<WideGf2,u64> on
      KoblitzCurve::new(1,83); tuned Fold/64/DP6) <-> BOUNDARY_TARGETS "Code
      guard: MAX_N = 127". Transfer: the wide path exists to 127; 131 needs a
      third limb, which is engineering, not research, and is the gate.
  claim: >-
    (1) A three-limb signed-Frobenius walk at n=131 (polynomial basis with
    CLMUL, table-driven basis change, 64 lockstep lanes, batched inversion)
    costs <= 2.5x the n=83 tuned walk's ns per step on the same host when it
    canonicalizes every step with lift_scan, and the canonicalization share of
    that step is in [0.2, 0.5]. (2) The same walk with Bailey's step
    P <- P + sigma^{j(P)}(P), j = 3 + ((HW(x)/2) mod 8), canonicalizing only at
    DPs (HW(x) <= 34 or a DP-bit predicate), costs <= 0.6x the canonicalizing
    walk per step at n=131. (3) On the n=83 a=1 subgroup (r ~ 2^52.9), where
    both walks run to a verified logarithm, the Bailey walk's steps-to-collision
    over the floor sqrt(pi r/(4n)) is within [1.0, 1.25] of the canonicalizing
    r-adding walk's. (4) Converted at the measured ns per step and 2^60.9
    iterations (KR-RHO-18cc42), the program's own ECC2K-130 cost estimate lands
    within a factor 4 of the 2009 figure scaled by core-count and clock, i.e.
    the canonicalize-every-step reference is NOT cheaper per iteration than
    the 2009 design despite seventeen years of hardware.
  mechanism: >-
    A 131-bit element is 64+64+3 bits; a field multiply is 6-9 CLMULs plus
    reduction mod z^131 + z^13 + z^2 + z + 1 (ECC2K-130's field), against 3-4
    CLMULs at 83 bits, so the arithmetic scales ~2-2.5x. The basis change for
    canonicalization is a byte-table or GFNI kernel (~1 ns/key at n <= 64 per
    R06-key-gfni, ~3x at three limbs). lift_scan at 68 ns/key is then a fixed
    additive term per step; whether it is 20% or 50% of the step is the
    number nobody has. Bailey's design pays no per-step canonicalization
    because P + sigma^j(P) is a class function when j is; its known price is a
    restricted selector (8 multipliers 1 + s^j), whose randomness penalty is
    measurable only where the walk completes, hence n=83. Claim (4) is the
    sanity check that turns the program's unit into the literature's: 530
    cycles/iteration on a 2009 core with no CLMUL instruction is the bar.
