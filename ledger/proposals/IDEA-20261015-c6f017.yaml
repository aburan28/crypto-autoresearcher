  minimal_test:
    design: >-
      Stage 0: lift the code guard to 131 with a three-limb type; unit tests
      against Sage for the ECC2K-130 field and curve (order, Frobenius
      eigenvalue, class size 262). Stage 1: step price at n=131 for the
      canonicalizing r-adding walk (lift_scan) and the Bailey walk, 64 lanes,
      10^7 steps each from public points (no solve), cachegrind Ir and isolated
      ns; canonicalization share by annotation. Stage 2: both walks to verified
      logarithms on the n=83 a=1 subgroup, 64 public points, steps/floor with
      bootstrap intervals, paired. Stage 3: the conversion of claim (4).
    controls:
