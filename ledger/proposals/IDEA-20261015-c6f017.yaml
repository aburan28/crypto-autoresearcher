  title: >-
    The n=131 denominator: every ECC2K-130 lane (QSP, CERTBIN, FROB at 131)
    has no matched rho because no 131-bit walk exists in the code base. Build
    it from the wide-field strong walk and the lift_scan canonicalizer, price
    the canonicalize-every-step design against Bailey's canonicalize-at-DP
    design per step at n=131 and per collision at n=83, and compare both with
    the 2009 campaign's 530 cycles per iteration
  class: measurement
  bridges:
    - >-
      papers/frobenius-orbits sec-limitations ("No 131-bit normal-basis multiply
      exists in the code base, so the cost relative to a point operation was
      not measured"; "the right answer at n=83 and n=131 inside such a loop is
      open") and cryptanalysis canon-n131-loop-20261014 (lift_scan ~68 ns/key,
