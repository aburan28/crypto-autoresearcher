      - steps/floor per design at n=83 with intervals; verified logarithm count
      - DP rate and table bytes per design
    stopping_rule: one pass; sizes 83 and 131 only
    replication: {seed_policy: public hash-to-curve points, seeds listed in the protocol, seeds: []}
  falsification_conditions:
    - n=131 step > 5x the n=83 step: the wide path is not a reference; a dedicated implementation precedes any n=131 comparison
    - Bailey walk steps/floor > 1.4x at n=83: the restricted selector's penalty eats its step saving; the canonicalizing design stays the reference and IDEA-20261015-2d8e5a's wide selector becomes the only route
    - canonicalization share < 0.1 at n=131: the canonicalization lane (zero-gap, lift_scan, the key) is a <= 10% question at the ECC2K-130 degree and should be deprioritised
    - any unverified logarithm: stop
  confounders:
    - the three-limb reduction polynomial choice (ECC2K-130's trinomial-plus) changes the step by itself; fix it to the challenge field
    - DP density changes the table bytes and the collision-detection latency; equalise DP bits across designs
    - the HW(x) <= 34 predicate yields far fewer DPs than a DP-bit predicate at these sizes; use the DP-bit form for both, HW only as Bailey's historical arm
  interpretation_limits:
