  sota_delta: ZERO on every attack axis; no attack is proposed. Tells the program which of its
    undone experiments are actually dispatchable, which is the input every batch-selection decision
    currently guesses at. Stops the recurrence at the freeze step for a few lines of code, and
    closes a 15-day-old undischarged obligation from a goal that was completed while still owing
    it.
  estimated_cost:
