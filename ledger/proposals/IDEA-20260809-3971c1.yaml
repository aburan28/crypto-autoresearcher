idea:
  id: IDEA-20260809-3971c1
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: 'The contract-parse gate DEC-20260724-020 ordered was never built: 18 frozen experiment
    specifications are unparseable at HEAD, one of them frozen the day before this review, and
    part of the execution debt is unreadable-contract debt that no dispatcher could ever have
    run'
  class: tooling
  claim: 'Neither half of an ordered control exists, 15 days on. DEC-20260724-020 (GOAL-ICLIFT-001
    BATCH-001) records: ''the frozen EXP-FB3-001 contract and its hypothesis and question records
    have never been machine-parseable. That is very likely part of why an experiment approved
    on 2026-07-17 sat unexecuted -- no tool could read its contract.'' Its third next_action orders
    ''Repair or supersede the unparseable frozen FB3 records ... and add a YAML-parse check to
    the contract-freezing step so no future experiment is approved with an unreadable contract.''
    GOAL-ICLIFT-001 was then marked completed. I re-measured at HEAD on 2026-08-08: ledger/RQ-FB3-001.yaml
    and ledger/H-FB3-001.yaml still fail yaml.safe_load with ScannerError, and of 555 top-level
    specification files across the experiments tree, EIGHTEEN are unparseable -- EXP-DREG-001,
    EXP-DREG-002, EXP-EQJ-001, EXP-FB-001, EXP-FB3-001, EXP-IC-002 (specification.v1-frozen-8987eb01.yaml),
    EXP-ICI-001, EXP-IT-001 (v2 and v3), EXP-MTARGET-20260807-1e897d/experiment.yaml, EXP-P13-NC2b,
    EXP-P13-NC2d, EXP-REP-001, EXP-REP-002, EXP-SIG-001, EXP-SIG-004, EXP-SIG-005, EXP-STR-003.
    A contract frozen on 2026-08-07 being unparseable PROVES no parse check exists at the freeze
    step. EXP-IC-002 is the yield-charged descent control REVIEW-UNADDRESSED-20260807 section
    3 names as having zero runs and ''NO MEASURED REPLACEMENT''. Nobody has separated the two
    causes of execution debt: run 1 classified ~90 zero-run contracts as ''a DISPATCH problem,
    not an idea problem'', and this measurement shows a distinct sub-population no dispatcher
    could ever have run, needing a different remedy.'
  mechanism: 'Two joined deliverables plus one cheap falsification of the framing. FALSIFY FIRST,
    at zero cost: if all 18 unparseable contracts turn out to be already-superseded or already-run,
    the sub-population is empty and the debt really is pure dispatch -- check that before anything
    else. DIAGNOSE: partition the zero-run contracts into unreadable (spec fails to parse), unapproved
    (status review_required) and approved-but-undispatched, and report the three counts, converting
    one undifferentiated debt number into three with different owners. CONTROL: add yaml.safe_load
    plus a required-fields assertion to the freeze step and to the CI path, then VERIFY IT FIRES
    by attempting to freeze a deliberately malformed contract in a scratch directory -- a forced-FAIL
    control, not an assertion that the check works. Do not edit the 18 immutable frozen files:
    emit a parallel transcription per DEC-20260724-020''s own precedent (''The files stay immutable;
    transcriptions carry the references'').'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'The obligation was filed as a next_action on a decision whose goal was completed in the
      same breath, so the goal that owned it stopped existing as a queue -- the exact failure
      mode cluster C04''s backward resolver is built to detect, which is why the two are ranked
      adjacent but kept separate (this one has a code deliverable and a debt partition; that one
      has a graph). The defect is also invisible to the tools most likely to notice it: anything
      that reads contracts by parsing YAML skips these directories silently rather than erroring,
      which is the same blindness that let EXP-FB3-001 sit for a week. CLAUDE.md''s main-health
      sweep and check_merge_hygiene both check parseability of LEDGER records; REVIEW-UNADDRESSED-20260807
      section 7 reports 6 unparseable ledger records as pre-existing on main and treats them as
      an artifact of that branch''s verification, not as a systemic freeze-step defect, and it
      does not scan experiments/ at all.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any cryptographic claim. The object is the CONTRACT
      AS A READABLE FILE.'
    tracked_object: Per frozen contract, the pair (parses?, has runs?), partitioning zero-run
      contracts into unreadable / unapproved / approved-but-undispatched.
    one_step_propagation_rule: Freezing a contract adds one file to the population; the parse
      bit is decided at freeze time and never changes, since the file is immutable.
    newness_score: Nil as engineering. Its content is that a decision ordered this control 15
      days ago, the goal that owned it was completed in the same breath, and a contract frozen
      on 2026-08-07 is unparseable -- which proves no check exists.
  lossy_projection_identifiability_audit:
    projection: the experiments tree -> a three-way partition of zero-run contracts.
    what_is_discarded: The science in every contract.
    is_it_only_a_change_of_coordinates: 'NO -- the partition does not exist today and the undifferentiated
      debt number is what batch selection currently guesses at. Honest caveat: this produces counts,
      not knowledge.'
    mirror_failure_check: CHECKED. The partition must be able to come out empty in the unreadable
      cell -- which is the first thing to test, and would refute the record's framing.
  null_object_control:
    primary_null: 'FALSIFY FIRST, AT ZERO COST: if all 18 unparseable contracts are already superseded
      or already run, the sub-population is empty and the debt really is pure dispatch. Check
      that before anything else.'
    secondary_nulls:
    - 'FORCED-FAIL CONTROL ON THE FIX: attempt to freeze a deliberately malformed contract in
      a scratch directory and require the new check to fire. Asserting that a check works is not
      evidence that it does.'
  assumptions: []
  predictions:
  - metric: zero-run contracts that are unreadable rather than merely undispatched
    direction: higher
    minimum_effect: Any nonzero count converts part of the execution-debt figure into a different
      problem with a different owner.
  minimal_test:
    design: Falsify first; then partition zero-run contracts three ways and report the counts;
      then add yaml.safe_load plus a required-fields assertion to the freeze step and the CI path,
      and verify it fires on a planted malformed contract.
    controls:
    - already-superseded/already-run falsification
    - forced-FAIL planted contract
    required_metrics:
    - three-way partition counts
    - list of unreadable frozen contracts
    - planted-contract check result
  falsification_conditions:
  - 'All 18 are superseded or already run: the sub-population is empty and the framing is wrong.'
  - 'The planted malformed contract is accepted after the fix: the control does not work.'
  - 'The unreadable set is not correlated with zero runs: unreadability is not why they went undispatched,
    and the causal story in DEC-20260724-020 does not generalise.'
  confounders:
  - Some unparseable files are superseded versions kept for provenance; the partition must read
    the supersession registry before counting.
  - A contract can be readable and still undispatchable for unrelated reasons.
  - The 18 immutable frozen files must not be edited; DEC-20260724-020's own precedent is a parallel
    transcription carrying the references.
  interpretation_limits:
  - Engineering, not science. It changes which experiments are known dispatchable, not what any
    of them would show.
  - Editing the freeze step is a harness change; proposed here, not made.
  heuristic_assumptions:
  - id: HEUR-PARSE-1
    statement: Unreadability is a contributing cause of non-dispatch, as DEC-20260724-020 asserts
      for EXP-FB3-001.
    rigorous_support: One anecdote in that decision.
    validation_plan: Test the correlation across the partition rather than assuming it; a null
      correlation is a reportable result.
