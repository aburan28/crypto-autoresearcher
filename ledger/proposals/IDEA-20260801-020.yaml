idea:
  id: IDEA-20260801-020
  question_id: RQ-SQISIGN-001
  title: >-
    Transcript-level leakage probe: statistical independence test of the
    SQIsign transcript against the matched endomorphism-ring baseline
  class: control
  claim: >-
    SQIsign's security model assumes the transcript (commitment
    isogeny, challenge, response) carries no more information about the
    secret endomorphism ring than the public key does; a controlled toy
    experiment comparing the transcript's statistical properties against
    those of a matched baseline (random endomorphism-ring instance without
    secret information) either confirms the independence assumption or
    reveals transcript-level leakage. This decides whether the transcript
    is a leak surface beyond the public key.
  mechanism: >-
    The transcript's components are produced by isogeny walks whose
    distribution may depend on the secret ring; if the transcript's joint
    distribution differs measurably from the baseline's, the difference is
    a transcript-level leak. At toy parameters the transcript and baseline
    distributions are both sampleable; a statistical independence test
    (e.g., a distance or divergence measure with permutation testing)
    quantifies the difference.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal runs a transcript-vs-baseline independence test
        for SQIsign at toy parameters in this program.
    conclusion: >-
      Control experiment; novelty unverified against full literature, which
      is the point of the probe.
  assumptions:
    - Toy parameters permit sampling both transcript and baseline
      distributions.
    - The independence test has sufficient power at toy sizes.
  predictions:
    - metric: transcript_vs_baseline_divergence_p_value
      direction: lower
      minimum_effect: >-
        A permutation-test p-value below 1e-3 at the largest toy size with
        power >= 0.95 against a constructed leak is a leakage signal.
  minimal_test:
    design: >-
      Generate N toy SQIsign transcripts and N baseline transcripts; run a
      divergence or distance statistic with permutation testing; report the
      p-value and the minimum detectable divergence at that sample size.
    controls:
      - Positive control using transcripts with a deliberately injected
        secret-dependent bias (must reject).
      - Negative control using transcripts from a ring independent of the
        secret (must not reject).
    required_metrics:
      - p-value of the independence test
      - minimum detectable divergence
      - positive and negative control outcomes
  falsification_conditions:
    - Test rejects on real transcripts (transcript-level leakage exists).
    - Test fails to reject on real transcripts while rejecting the positive
      control (independence holds within resolution).
  confounders:
    - Seed determinism breaking sample independence.
    - Toy-size effects on the isogeny walk distribution.
  interpretation_limits:
    - Toy probe only; no crypto-scale claim about SQIsign's parameters.
    - A non-rejection is a bound, not a proof of independence.
  heuristic_assumptions:
    - id: HEUR-SQISIGN-LEAK-1
      statement: >-
        The transcript-vs-baseline divergence at toy sizes is directionally
        representative of larger sizes.
      rigorous_support: None; heuristic, tested by the toy-size trend.
      validation_plan: Run the probe at 2-3 toy sizes and check the trend.
  target_complexity:
    time_exponent: n/a (probe)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a statistical bound on the transcript's
    divergence from the baseline, which either opens or closes the
    transcript-leak surface.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
