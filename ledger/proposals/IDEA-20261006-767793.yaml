idea:
  id: IDEA-20261006-767793
  question_id: RQ-SCURVE-42f1a3
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: Search P-192 principal CM norms, cancel large primes, then optimize only fully replayable loops
  class: experimental
  claim: >-
    A deterministic centered search for primitive alpha=u+v*pi, followed by
    exact one-/two-large-prime cancellation and weighted lattice optimization,
    can expose cheap principal loops that a radius- or degree-bounded isogeny
    BFS does not target.  This is a proposed search mechanism, not a claim that
    such a loop exists or weakens P-192.
  mechanism: >-
    For pi^2-t*pi+p=0, N(u+v*pi)=u^2+tuv+pv^2 and, with x=2u+tv,
    4N=x^2+|D|v^2.  Canonical (v,x) boxes enumerate principal elements rather
    than graph vertices.  Norm smoothness yields sparse oriented ideal
    relations; partials with at most two bounded large primes are recombined by
    an exact kernel calculation.  LLL, deterministic-budget BKZ, and exact
    integer optimization search the verified relation lattice for low HOT and
    COLD map-cost vectors.  A candidate advances only after explicit maps,
    subgroup preservation, terminal isomorphism, and a matched planted-key
    comparison are replayed.
  novelty_status: unverified
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-0528e7
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row forecloses treating movement inside an isogeny class as a
          route to a curve with different order-based weaknesses.  This
          protocol instead asks whether an explicitly replayable principal
          loop changes the constant cost of a frozen consumer; it preserves
          all order-based invariants and claims no result before measurement.
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds ordinary automorphism-orbit gains as constant
          factors.  This protocol charges every direction-specific map and
          tests a matched consumer rather than inferring a speedup from the
          existence of CM or an abstract class relation.
    searched:
      corpus_grep:
        - knowledge/frontiers/ecdlp for isogeny-class hardness and automorphism constant-factor rows on 2026-10-06
        - archive PR 1942 for the distinct L<=2^48 generator-word census and its no-result boundary
      blocked:
        - No external literature search was performed for this design-only freeze; novelty remains unverified.
  implementation_links:
    prior_archive:
      ref: https://github.com/aburan28/crypto-autoresearcher/pull/1942
      delta: >-
        The archive PR records the distinct L<=2^48 generator-word census.
        This proposal allocates a new family and searches centered
        principal-element norms at about 192 bits; it neither amends nor
        spends the prior experiment's run allowance.
    native_source:
      ref: https://github.com/aburan28/crypto/pull/1507
      delta: >-
        The native PR supplies certificate-oriented norm-sieve arithmetic.
        Segmented sieving, partial-relation recombination, optimizers, and
        explicit map replay remain admission obligations.
  assumptions:
    - The exact P-192 tuple and identity triplet are independently revalidated at execution.
    - The archived maximal-order derivation is replayed from native certificates rather than trusted by URL.
    - Every retained rational prime is resolved into an exact oriented prime ideal; inert or scalar factors cannot masquerade as edges.
    - Negative relation coefficients are implemented by certified conjugate/dual maps with their costs charged.
  predictions:
    - metric: verified_partial_or_complete_principal_relations
      direction: higher
      minimum_effect: At least one relation surviving exact norm, orientation, and recombination replay is needed to reach optimization; zero is an allowed outcome.
    - metric: fully_replayable_non_scalar_loops
      direction: higher
      minimum_effect: At least one loop with explicit maps and a terminal isomorphism is needed to reach the weakness gate.
    - metric: matched_end_to_end_speed_ratio
      direction: lower
      minimum_effect: The upper endpoint of the preregistered 95% paired interval must be below 1.00 in both HOT and COLD accounting before any scoped advantage claim.
  minimal_test:
    design: >-
      Run the positive and negative controls, replay the P-192 order and factor
      base, exhaust the three disjoint deterministic shells, recombine partials
      exactly, optimize verified rows, build the Pareto-front candidate maps,
      and compare planted-key recovery with the matched generic baseline.
    controls:
      - D=-23 class relation positive control.
      - P-192 scalar/ramified and symbolic sqrt(D) controls.
      - Atkin-prime, root-orientation, large-prime-incidence, map, subgroup, and endpoint mutations.
    required_metrics:
      - exact candidate and disposition counts with stream digests
      - raw relation and recombination certificates
      - raw HOT and COLD cost tuples
      - exact optimizer outputs and replay verdicts
      - paired end-to-end operation and timing ratios
  falsification_conditions:
    - A frozen arithmetic identity, root, orientation, box count, or independent certificate replay fails.
    - Search membership or relation acceptance changes when Q32 ranking weights are shuffled.
    - A purported advantage disappears when map construction, transfer, verification, or terminal-isomorphism costs are charged.
    - A claimed loop does not preserve the order-n subgroup or does not replay on planted public points.
  confounders:
    - Smoothness yield is a property of these fixed boxes, not an iid population estimate.
    - A cheap abstract class relation can require expensive or unavailable explicit maps.
    - Host timing, cache state, and endpoint choice can move wall time; raw operation tuples remain primary.
    - Lattice reduction can find a short projection that is not Pareto-optimal in the raw multidimensional costs.
  interpretation_limits:
    - No search has been executed by this record.
    - Finding an isogenous curve or a class relation alone is not a P-192 weakness.
    - A null result applies only to the exact boxes, factor bases, large-prime bound, solver budgets, and map support frozen in EXP-SCURVE-1a8daf.
    - No asymptotic ECDLP improvement is claimed.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: high
  dominated_by: >-
    A relation with no fully charged advantage is dominated by the matched
    generic-rho baseline and is retained only as structural evidence.
  sota_delta: >-
    Proposed targeting improvement over blind BFS: enumerate principal norms
    and optimize verified relation combinations.  Scientific delta is zero
    until a pending run family completes all claim gates.
