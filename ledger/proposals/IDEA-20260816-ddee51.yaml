idea:
  id: IDEA-20260816-ddee51
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: 'Compose the one mechanism that survived its cost correction with the one route that needs
    no heuristics: does conjugating the public form by short unimodular matrices ever lower the dimension
    of the exact-SVP call the unconditional reduction bottoms out in, or is n/2+1 a measured floor
    at toy degree?'
  class: composition
  claim: '(A) Two things in this corpus''s HAWK route table survive independently. KN-OPEN-028''s
    Q2 closure records that the re-randomisation mechanism - conjugate the public Gram matrix by short
    unimodular U to obtain distinct instances - SURVIVES its cost correction, with only the density
    estimate having failed. Separately, KN-LIT-7592 (Straznickas-Weis) is recorded as an UNCONDITIONAL,
    heuristic-free reduction of HAWK-n key recovery to poly(n) exact-SVP calls in dimension n/2+1.
    Nobody in this corpus has asked whether the surviving mechanism composes with the surviving reduction.
    (B) The claim is that the composition question is precisely stated and is a dimension question
    rather than a cost question: for a given public form G and a re-randomisation U, apply the reduction''s
    dimension-halving construction to U-star G U rather than to G, and record the dimension of the
    resulting exact-SVP instance. If that dimension is invariant under the conjugation - which is
    what one expects if the reduction''s construction depends only on the isometry class - then n/2+1
    is a floor for this composition and the floor is MEASURED rather than argued, which is a usable
    obstruction with a number attached. If it is not invariant, the distribution of achieved dimensions
    over the re-randomisation orbit is the deliverable and its minimum is the interesting statistic.
    (C) The claim is that this is answerable at toy ring degree with exact integer arithmetic and
    no lattice reduction whatsoever: the dimension of a constructed instance is a rank computation,
    not a solve, so the experiment never runs SVP and never claims a cost. (D) NOT CLAIMED: that any
    dimension reduction exists; that a lower dimension would imply a faster attack (it would not,
    absent a cost model this contract deliberately does not build); that the Straznickas-Weis reduction
    is reproduced or verified here - it is not, and its construction is used only as described in
    committed records with any gap declared; that KN-OPEN-028 is reopened; and no statement about
    HAWK''s security in either direction. The expected outcome is the measured floor, and that is
    a complete result.'
  mechanism: 'Stage 1 writes the reduction''s dimension-halving construction as an explicit map from
    a public form to an exact-SVP instance, at the level of detail this corpus''s records support,
    and marks every step the records do not determine - those marks are the contract''s honest boundary
    and are reported whether or not the run proceeds. Stage 2 verifies the construction on a toy instance
    by checking the constructed instance''s dimension equals n/2+1 as recorded, which is a baseline
    reproduction in the sense of inventor-protocol section 8 item 1: if the reproduction fails, no
    composition question can be asked and the failure is the result. Stage 3 builds the re-randomisation
    orbit: conjugate the toy public form by all words up to a fixed length in a declared generating
    set of short unimodular matrices, deduplicating by canonical form. Stage 4 applies the construction
    to every orbit element and records the resulting instance dimension, computed as an exact integer
    rank, never as a solve. Stage 5 forms the distribution of achieved dimensions over the orbit and
    reports its minimum, its mode and whether it is a point mass at n/2+1. Stage 6 runs the null:
    the identical orbit-and-construct pipeline on a random integral lattice of matched dimension and
    determinant with no module structure, where the construction may not even be defined - and whether
    it is defined is itself informative, since a construction that applies to any lattice is not using
    the module structure. Stage 7 applies the method-ceiling audit of section 8 item 4 symbolically:
    bound what conjugation could possibly achieve under ideal tuning, by asking whether the construction
    factors through the isometry class, which if true forces invariance and makes the measurement
    a confirmation rather than a search.'
  novelty_status: unverified
  novelty_screen:
    method: Read knowledge/open-problems/KN-OPEN-028.md in full, especially its q2_closure block ('the
      re-randomization idea SURVIVES ... it is a search over instance representations rather than
      over solutions') and its live-surface route table naming KN-LIT-7592 as unconditional at 2^{(n/2+1)+o(n)}.
      Read ledger/evidence/EV-HAWK-21edba.yaml and EV-HAWK-c99848.yaml in full. Grep -ril 'hawk|module-lip|nrd-pip|lattice
      isomorphism' over ledger/proposals/ (11 files) and read all 11 titles, with close attention
      to IDEA-20260807-90479e and IDEA-20260805-3a855d, which are the two that concern the n/2+1 exact-SVP
      call. Read docs/inventor-protocol.md section 8 in full for the baseline-reproduction and method-ceiling
      audits.
    results: 'IDEA-20260807-90479e is the nearest record in the corpus and must be named: it observes
      that the exact-SVP call in dimension n/2+1 which the unconditional disclosed reduction bottoms
      out in ''has never been costed or measured by this program'', that the 2^108 and 2^182 figures
      are relayed from the paper''s own gate model, and that the goal went dormant with completion
      criterion 1 unmet. IDEA-20260805-3a855d is adjacent, charging an uncosted poly(n) oracle-call
      factor, four unreconciled gate figures, an absent memory column, and the n/2+1 versus 3m/8+1
      normalisation discrepancy. Both are COST proposals about the same call; neither composes it
      with the re-randomisation mechanism, and neither asks whether the dimension is invariant under
      conjugation. KN-OPEN-028''s Q2 closure flags the re-randomisation as a representation search
      and cites docs/inventor-protocol.md as asking generators to look for that move, but the corpus
      contains no record composing it with the unconditional route. No proposal mentions the composition
      at all.'
    verdict: 'UNVERIFIED. Claimed new: the composition itself - applying the unconditional reduction''s
      dimension-halving construction to conjugates of the public form rather than to the public form
      - and the framing of the outcome as a MEASURED FLOOR on achieved dimension rather than as a
      cost claim. Assembled from known parts: the re-randomisation mechanism is entirely from the
      nrd-PIP route as recorded in KN-OPEN-028 Q2; the dimension-halving construction is entirely
      from KN-LIT-7592 as relayed in this corpus and is not re-derived here; the exact-SVP call and
      its n/2+1 dimension are already the subject of IDEA-20260807-90479e, which is named rather than
      left unnamed; the baseline-reproduction and method-ceiling audits are inventor-protocol section
      8 verbatim. The novel content is the composition and the invariance question. No claim about
      external literature is made or possible.'
  object_first_candidate:
    tracked_object: 'The achieved exact-SVP instance dimension: an integer attached to each element
      of the re-randomisation orbit, obtained by applying the reduction''s construction to that element
      and taking an exact rank. The object followed through the computation is the distribution of
      this integer over the orbit, as a function of word length and ring degree.'
    lossiness: 'Genuinely lossy, and aggressively so: the entire constructed exact-SVP instance -
      a lattice - is collapsed to a single integer, its dimension. Everything about the instance''s
      difficulty, geometry and structure is discarded. This is compatible with the operation of interest
      because the question asked is exactly and only whether conjugation can move the dimension, and
      the discarded content is where a cost claim would live - which this contract explicitly does
      not make. The honest caveat is stated up front: a lower dimension with a worse instance is not
      an improvement, and because this object discards everything that would reveal that, no improvement
      can ever be claimed from it. That is a limitation of the object by design, chosen so the contract
      cannot accidentally overclaim.'
    propagation: One step of the target operation is a single conjugation G maps to U-star G U. Under
      this step the tracked integer either does not move (if the construction factors through the
      isometry class, since conjugation preserves that class) or moves in a way determined by whichever
      part of the construction depends on the representative. Propagation is therefore deterministic
      given the construction, and the entire empirical question is which of those two regimes holds
      - a question the method-ceiling audit may settle symbolically before any run.
    survival_score: The tracked integer survives every conjugation trivially in the expected regime
      (constant orbit-wide), which is exactly why the interesting number is the orbit-wide MINIMUM
      and its multiplicity rather than the value itself. Structure dissolves at the ring degree where
      the construction can no longer be carried out exactly - expected at degree 32 (dimension 64)
      where the rank computations remain feasible but the construction's unspecified steps may not
      be reconstructible. The reported survival number is the largest ring degree at which the baseline
      reproduction succeeded.
  null_object_control: The null object is a random integral lattice of the same dimension 2n and determinant
    with no module structure, put through the IDENTICAL orbit-and-construct pipeline in the same invocation.
    Two things must hold for the signal arm to mean anything. First, if the construction is DEFINED
    on the null (produces an instance of dimension n/2+1 on an unstructured lattice), then it is not
    using the module structure at all, and the entire composition question is about something other
    than module-LIP - which would be a major finding about the construction as this corpus records
    it, and would need to be reported before any signal-arm number. Second, if the construction is
    undefined on the null, that confirms module structure is a precondition and the signal arm's dimension
    distribution is interpretable. Additionally a trivial-orbit control (conjugation by the identity
    alone) must return a single dimension equal to the recorded n/2+1, or the baseline reproduction
    has failed.
  discriminated_from:
  - 'IDEA-20260807-90479e: that record proposes to COST and MEASURE the exact-SVP call at dimension
    n/2+1 and to reconcile relayed gate figures. This contract measures no cost, no gates and no time;
    it measures only whether the DIMENSION moves under conjugation, and would be complete even if
    the call''s cost were perfectly known.'
  - 'IDEA-20260805-3a855d: charges an uncosted oracle-call factor, an absent memory column and a normalisation
    discrepancy. Again a cost-model audit; this contract builds no cost model and deliberately discards
    everything a cost model would need.'
  - 'KN-OPEN-028 Q2 closure: establishes that the re-randomisation mechanism survives its cost correction
    within the nrd-PIP route. This contract takes that as settled and asks a question the closure
    does not touch - whether the mechanism interacts with a DIFFERENT route.'
  - 'IDEA-20260801-019 (independent reimplementation of the reported attack): would run the nrd-PIP
    attack end to end. This contract runs no attack, forms no nrd-PIP instance, and never invokes
    a subfield solver or an SVP oracle.'
  - 'IDEA-20260805-6eac55 and IDEA-20260808-b1358c (tau-cocycle and involution lattices, with the
    second explicitly asking whether exact-SVP dimension falls from n/2+1 to about n/4 via a joint
    stabiliser): this is the closest existing record on the DIMENSION question specifically and must
    be named. It seeks a dimension drop from a NEW ALGEBRAIC OBJECT (a third involution and a joint
    stabiliser). This contract seeks nothing new algebraically - it asks whether the EXISTING re-randomisation,
    applied to the existing construction, moves the dimension at all, and expects the answer no. The
    two are complementary: a measured floor here sharpens what b1358c''s construction would have to
    beat.'
  assumptions:
  - The reduction's dimension-halving construction is reconstructible from committed records to the
    point where a toy instance can be built and its dimension checked against the recorded n/2+1;
    if not, the contract's output is the list of unreconstructible steps.
  - Conjugation by short unimodular matrices preserves the lattice up to isometry, which is definitional
    for the re-randomisation as recorded, and is verified in code by an exact Hermite normal form
    check on each orbit element.
  - Exact rank computation of the constructed instance is feasible at ring degrees 4, 8 and 16.
  - The generating set of short unimodular matrices used here stands in for the route's sampler, which
    this corpus does not hold; every conclusion is scoped to the declared generating set.
  predictions:
  - metric: orbit-wide minimum achieved exact-SVP instance dimension, ring degree 8
    direction: different
    minimum_effect: 'forced value: exactly n/2+1 = 5, i.e. no reduction. A measured minimum below
      n/2+1 would be the surprise and would require immediate independent re-derivation before any
      reporting'
  - metric: number of distinct achieved dimensions over the whole orbit
    direction: different
    minimum_effect: 'forced value: 1 (a point mass), if the construction factors through the isometry
      class as expected'
  - metric: whether the construction is defined on the unstructured null lattice
    direction: different
    minimum_effect: 'forced value: no. A yes means the construction does not use module structure
      and is a finding that supersedes everything else in the run'
  - metric: largest ring degree at which the baseline reproduction gives exactly n/2+1
    direction: different
    minimum_effect: 'refusal to pre-commit: this depends on how much of the construction is reconstructible
      from committed records, which is unknown until STAGE 1 is done'
  minimal_test:
    design: 'The method-ceiling audit is first and may end the contract at zero compute: if the construction
      provably factors through the isometry class, conjugation cannot move the dimension, the floor
      is proved rather than measured, and the run is unnecessary - which is the cheapest possible
      discriminating outcome and is a complete result. If the factorisation is unclear, the measured
      half is small. At ring degree 8, build one HAWK-SHAPED instance by the declared rule; verify
      the baseline reproduction gives dimension n/2+1 = 5; enumerate the conjugation orbit under all
      words of length at most 3 in a declared six-element generating set (at most 259 words, deduplicated);
      apply the construction to each and record the exact rank of the resulting instance. Report the
      dimension distribution, its minimum and its multiplicity. In the same invocation run the unstructured
      null and the identity-only trivial-orbit control. No SVP is ever solved, no lattice reduction
      is run, no timing is recorded. Cost is minutes.'
    controls:
    - 'Method-ceiling audit first, at zero compute: does the construction factor through the isometry
      class? A yes makes the measurement a confirmation and is reported as such.'
    - 'Trivial-orbit control: conjugation by the identity alone must give exactly one dimension equal
      to the recorded n/2+1, else the baseline reproduction failed.'
    - 'Unstructured null lattice: the construction must be undefined or must fail, else it is not
      using module structure.'
    - 'Isometry check: every orbit element must generate the same lattice as the base, verified by
      exact Hermite normal form; a failure means the conjugation implementation is wrong.'
    - 'Second generating set: repeat the orbit and dimension distribution with a different declared
      generating set, since any orbit-wide statistic is defined relative to the set.'
    required_metrics:
    - achieved exact-SVP instance dimension per orbit element
    - orbit-wide minimum, mode and number of distinct achieved dimensions
    - baseline reproduction result (dimension for the identity word) per ring degree
    - whether the construction is defined on the unstructured null
    - Hermite normal form isometry check pass rate over the orbit
    - count of construction steps not reconstructible from committed records
    - agreement of the dimension distribution across the two generating sets
  falsification_conditions:
  - The baseline reproduction does not give n/2+1 at any ring degree, meaning the construction as
    reconstructed here is not the recorded one and no composition question can be asked.
  - The construction is defined on the unstructured null lattice, meaning it does not use module structure,
    which supersedes the composition question entirely.
  - The Hermite normal form isometry check fails on any orbit element, indicating a conjugation implementation
    bug.
  - The dimension distribution differs between the two declared generating sets, meaning the statistic
    is a property of the set rather than of the composition.
  - More than a stated number of construction steps prove unreconstructible from committed records,
    in which case the contract reports that list and does not run - a boundary, not a result.
  - 'The orbit-wide minimum is below n/2+1: this falsifies the expected floor and, per the contract,
    triggers mandatory independent re-derivation before any reporting rather than immediate publication.'
  confounders:
  - The construction is relayed second-hand through this corpus rather than read from the source,
    so a reconstruction error could produce either a false floor or a false drop; the baseline reproduction
    control is the only defence and it is necessary rather than sufficient.
  - The declared generating set is a stand-in for the route's sampler, so orbit-wide statistics are
    scoped to it and a different sampler could reach different representatives.
  - Word length 3 truncates the orbit; a dimension drop reachable only at length 6 would be missed,
    and absence of a drop is therefore confounded with word length, which must be reported with every
    number.
  - HAWK-SHAPED instances from the declared rule may have atypical structure, so a floor measured
    on them is a floor for those instances; the generator-fidelity contract in this batch is the relevant
    caveat and should be cited in the output.
  - Rank computations over cyclotomic rings can silently degrade if reduction modulo the cyclotomic
    polynomial is done inconsistently; an exact arithmetic audit on a hand-checked small case is required.
  interpretation_limits:
  - 'A measured floor on achieved DIMENSION is not a statement about cost: the exact-SVP call''s cost
    at a given dimension is untouched here and is the subject of separate records (IDEA-20260807-90479e,
    IDEA-20260805-3a855d).'
  - Even a measured dimension drop would not imply a faster attack, because this object discards everything
    about instance quality by design; no improvement claim can be built on it.
  - All numbers are at ring degrees 4, 8, 16 on HAWK-SHAPED declared-rule instances, and RQ-HAWK-001's
    constraint block forbids reading them as statements about deployed parameters.
  - The construction is used as this corpus records it and is not verified against its source; every
    conclusion inherits that limitation.
  target_complexity:
    time_exponent: No attack exponent is claimed. The contract measures a dimension, and the relationship
      between dimension and cost is deliberately not modelled here. Measurement cost is orbit size
      times an exact rank computation, polynomial at fixed degree.
    memory_exponent: No attack memory exponent is claimed. Storage is one integer per orbit element
      plus the constructed instances transiently.
    best_known: The incumbent is the Straznickas-Weis unconditional reduction itself at exact-SVP
      dimension n/2+1 and 2^{(n/2+1)+o(n)} (KN-LIT-7592), as relayed in KN-OPEN-028's route table.
      This contract does not improve on it and its expected outcome is a measurement confirming that
      conjugation does not move its dimension.
    hidden_overhead: The reconstruction of the construction from second-hand records is the entire
      risk and the entire human cost; everything downstream is trivial code. A second hidden cost
      is the temptation to report a dimension drop as interesting when the object by construction
      cannot support any such interpretation, which is why the falsification list makes a drop trigger
      re-derivation rather than reporting.
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    unconditional 2^{(n/2+1)+o(n)} (KN-LIT-7592); nrd-PIP super-polynomial and underived (KN-LIT-7674);
    definite/indefinite LIP reporting HAWK unaffected (KN-LIT-7648); the SLIP AM-intersect-coAM ceiling
    (KN-LIT-7671) - plus generic lattice reduction on the 2n-dimensional lattice as a fifth row. This
    contract claims no attack and enters no row: n/a (no result claimed). Note that on the data axis
    every row is key-only, as is this.'
  sota_delta: No attack; measurement contribution only. The quantity moved is the achieved exact-SVP
    instance dimension under re-randomisation, which goes from never composed and never measured to
    a measured distribution with a minimum, a multiplicity and a stated word length and generating
    set - most likely confirming n/2+1 as a floor for this composition at toy degree.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that the composition question is well-posed given what this
    corpus records: 0.65 - it depends entirely on how much of the construction is reconstructible,
    and I have read only the route table''s summary of it, not a specification. Part (B), that the
    dimension is invariant and the floor is measured at n/2+1: 0.85, because a construction of this
    kind almost certainly factors through the isometry class, which is exactly why the method-ceiling
    audit runs first and may make the run unnecessary. That a dimension drop is found: 0.1, and I
    would not believe it without independent re-derivation, which the contract requires. Part (C),
    that the whole thing runs with no SVP solve and no lattice reduction: 0.9. Probability the contract''s
    real output is the list of unreconstructible construction steps rather than any dimension: 0.3,
    and that output is useful in its own right.'
