      verified_by: null

  assumptions:
    - >-
      That the committed run inputs (p, seed, fb-size ladder, target count, and
      the identity of the curves in the chosen class) are recoverable from the
      archived run records, so C1's predicted value can be computed against the
      SAME curves the anomaly was measured on. If they are not recoverable, the
      corrected sweep is a fresh measurement and may only be compared to a fresh
      uncorrected re-run, which the design provides as an arm.
    - >-
      That within the tested isogeny classes at least some curves have n1 > 1.
      If EVERY curve in both classes is cyclic, C1 is identically zero, the
      component is refuted before any run, and the record must say so; that check
      is Stage 0 and costs one call to group_structure per curve.
    - >-
      That 3V splits across the cosets of <G> like a uniformly random subset of
      matched size. This is a modelling assumption, stated as heuristic H1 below,
      and it is what turns C1 from a bias into a variance with a closed form.
      It is measured directly rather than assumed: the coset split of 3V is
      enumerable at these parameters.
    - >-
      That AGENTS.md rule 3 applies to every arm: a crashed or timed-out cell is
      an infrastructure stop and never negative evidence about any component.
    - >-
      Toy scale binds throughout (p <= 100057 in the cited runs, and this record
      proposes nothing larger). Nothing here transfers to cryptographic scale and
      nothing is offered that does.

  proof_search_map:
    bottleneck: >-
      The exact step whose correction changes the reported number: the
      substitution of #E for |<G>| as the denominator of the per-curve
      prediction in run_saturation.measure_at_density, and the severing of the
      identity route in the two/three sumset construction. Both are single lines
      of committed source and both are removable without touching the science.
    baseline_embedding:
      parameter_slice: >-
        n1 = 1 for every curve in the class AND density high enough that W is
        covered by non-cancelling routes. On that slice C1 = 0 and C2 = 0, and
        the corrected estimator must reproduce the committed uncorrected numbers
        exactly, to the last digit, on the same seed.
      reproduction_check: >-
        Frozen regression fixture: re-run the committed sweep with the correction
        code present but disabled by flag and require bitwise-identical
        variance_ratio and residual_over_binomial_ratio values against the
        archived raw-result.json rows. A mismatch means the re-implementation is
        not the same instrument and no comparison may be reported.
    observation_collision:
      observable: >-
        The scalar residual_over_binomial_ratio at one density row.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE POINT OF THE RECORD. Three distinct
        ground-truth states produce the same observable: (a) genuine within-class
        curve dependence of the true decomposition rate; (b) C1, a pure
        denominator/support mismatch with no curve dependence at all; (c) a
        single unlucky draw of the shared curve-and-target realization (C3).
        The observable does not separate them, which is why the committed record
        correctly says the cause is unknown. The separating additional conditions
        are declared here: C1 scales linearly in T and is flat in density; C2
        decays in density and is flat in T; C3 averages away over independent
        seeds. The two-factor (T, density) design plus seed replication makes the
        fibre a singleton.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar per-curve prediction |3V|/#E by the pair
          (|3V intersect <G>| / |<G>|, n1), preserving the support information
          the scalar discards.
        predicted_gain: >-
          Removes exactly T*mean(n1-1)/N from the variance ratio, a predicted
          0.1*(n1-1) per curve at the p = 4001 parameters, with no free
          parameter to tune.
      - transform: observable_fiber
        proposed_object: >-
          Hold residual_over_binomial_ratio fixed and vary T and density
          independently, which are the two directions along which the fibre's
          three preimages separate.
        predicted_gain: >-
          Converts a three-way ambiguity into a signed attribution at the cost of
          one extra factor in the sweep.
    quantifier_order: >-
      FOR ALL isogeny classes C and FOR ALL curves E in C with E(F_p) isomorphic
      to Z/n1 x Z/n2, and FOR ALL factor bases V, THERE EXISTS no dependence of
      the C1 contribution on the density r: under H1 the NULL-B variance ratio
      equals 1 + T*mean_{E in C}(n1(E) - 1)/N + (C2 term)(r) + (C3 noise),
      where the first correction is uniform in r and linear in T. The witness
      (the correction) is allowed to depend on the class and on T, and is
      forbidden to depend on r; that prohibition is the falsifiable content.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is an ATTRIBUTION at toy
        scale on the two tested classes: that a stated fraction of the recorded
        over-dispersion is accounted for by two named instrument components, with
        the remainder bounded above by the corrected ratio's confidence band. It
        cannot certify that the remainder is zero, cannot certify that no fourth
        component exists, and cannot say anything about any curve outside the two
        enumerated classes.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion must FAIL: a
        synthetic class of curves with n1 = 1 for every member and a target
        sampler that draws uniformly from the whole group, into which a genuine
        per-curve rate perturbation is planted at a known magnitude. The
        corrected estimator must still report over-dispersion there. A method
        that reports "artifact" on a planted real effect has not identified the
        load-bearing structure and its negatives are worthless.
    proof_obligations:
      - claim: >-
          Var(|3V intersect <G>|) under the random-subset model equals
          s*(1/n1)*(1-1/n1)*(N-s)/(N-1), hence Var(r_i) = r(1-r)(n1-1)/N to
          leading order and the r(1-r) cancels against NULL-B's divisor.
        responsibility: correctness
      - claim: >-
          The enumerated set `three` omits an element R of W only when R has no
          representation as a sum of three W-elements avoiding a cancelling pair,
          so the omission is at most 2B targets and is monotone decreasing in
          density.
        responsibility: strictness
      - claim: >-
          The corrected estimator reproduces the committed numbers bitwise when
          both corrections are disabled.
        responsibility: baseline
      - claim: >-
          Five independent seeds per density row suffice to distinguish a flat
          profile from a single-draw artifact at the reported effect sizes.
        responsibility: success_probability
      - claim: >-
          Every arm runs within minutes on one core at p <= 6007 with peak RSS
          under 500 MB.
        responsibility: runtime

  predictions:
    - metric: >-
        Stage-0 count of curves with n1 > 1 in the two tested isogeny classes
        (largest ordinary class at p = 4001 and at p = 6007), from
        exp_icinv.group_structure
      direction: higher
      minimum_effect: >-
        At least one curve per class with n1 > 1. If both classes are entirely
        cyclic, C1 is EXACTLY ZERO, the headline component is refuted at zero
        compute, and the record must report that before running anything else.
        This is a genuine pre-run kill switch and it is placed first deliberately.
    - metric: >-
        Predicted C1 contribution T*mean(n1 - 1)/N, computed from the committed
        run parameters, versus the measured excess (variance_ratio - 1) at each
        density row
      direction: different
      minimum_effect: >-
        The predicted C1 value must lie within a factor 2 of the measured excess
        at the LOW-density rows (density below 0.1), where C2 is largest and
        must therefore be added, and within a factor 1.5 at the high-density
        rows where C2 has vanished. Numerically at T = 400 and N about 4000 the
        prediction is 0.1*(n1-1) per curve: 1.1, 1.7 and 2.5 total ratio for
        class means of n1 = 2, 8 and 16. A predicted contribution below 0.05
        while the measured excess exceeds 0.3 falsifies C1 as the dominant
        component and hands the record to C2 and C3.
    - metric: >-
        Linearity of the measured variance ratio in T, at fixed density, across
        T in {100, 400, 1600}
      direction: higher
      minimum_effect: >-
        FORCED SHAPE, NOT A FIT: ratio - 1 must be proportional to T with the
        slope mean(n1-1)/N, to within 25 percent, if C1 dominates. A ratio that
        is FLAT in T at fixed density refutes C1 outright and points at a real
        per-curve rate difference, which is the interesting outcome.
    - metric: >-
        Density dependence of the C2 correction, measured as
        (|3W| including the cancelling-pair route) minus (|three| as the
        committed code computes it), per curve and per density row
      direction: lower
      minimum_effect: >-
        The gap must be strictly positive at the smallest factor-base sizes
        (fb_size 4 and 5) and must fall to zero at the saturated rows, with an
        upper bound of 2B targets at every row (2B = 8 at fb_size 4, 44 at
        fb_size 22). A gap of exactly zero at every row means the cancelling-pair
        route is covered by other representations everywhere and C2 is inert at
        these parameters; a gap ABOVE 2B means the reimplementation is wrong and
        the arm halts.
    - metric: >-
        Corrected residual-to-binomial ratio (subgroup denominator, restored
        cancelling-pair route, five independent seeds per row), at every density
        row at both primes
      direction: lower
      minimum_effect: >-
        Predicted to fall inside the Wilson-Hilferty 95 percent acceptance band
        around 1 at every row at both primes. A corrected ratio still above 1.5
        at three or more rows at BOTH primes is a surviving effect with two named
        artifacts excluded, and must be reported as such rather than as a
        confirmation of this record.
    - metric: >-
        Seed reproducibility of the density profile: the spread of the variance
        ratio across five independent target seeds at fixed density, relative to
        the spread across densities at fixed seed
      direction: different
      minimum_effect: >-
        If the across-seed spread is comparable to or larger than the
        across-density spread, then "monotonic_decay: False" is a statement about
        one draw and not about density, and the committed non-decay finding must
        be re-scoped. Pre-registered threshold: across-seed interquartile range
        at least 0.5 times the across-density range.
    - metric: >-
        Planted-effect positive control: recovery of a known per-curve rate
        perturbation of relative size 0.05 injected into a synthetic all-cyclic
        class
      direction: higher
      minimum_effect: >-
        The corrected estimator must still report over-dispersion, with measured
        ratio within 30 percent of the planted 1 + T*Var_planted/(r(1-r)). An
        estimator that reports 1.0 on a planted real effect is blind and NO
        negative from any other arm may be reported.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE, minutes). For each of the two committed
      classes, run exp_icinv.group_structure on every curve and tabulate n1.
      Compute the predicted C1 = T*mean(n1-1)/N at T = 400. If every curve is
      cyclic, stop: C1 is refuted and the record is re-scoped to C2 and C3 only.
      STAGE 1 (zero compute, algebra). Write out the hypergeometric variance
      derivation and verify the r(1-r) cancellation symbolically; verify by hand
      that the multiset {P, -P, R} is a valid length-3 decomposition of R and
      that the committed control flow cannot reach it through `two`. If either
      check fails the corresponding component is withdrawn before any run.
      STAGE 2 (minutes, regression). Re-implement the sweep with both
      corrections behind flags. With flags OFF, require bitwise reproduction of
      the archived rows. This gate must pass before any corrected number is
      looked at.
      STAGE 3 (tens of minutes, the battery). Two-factor design at both primes:
      T in {100, 400, 1600} crossed with the committed fb-size ladder, five
      independent target seeds per cell, four estimator arms -- (a) as committed,
      (b) subgroup denominator only, (c) cancelling-pair route restored only,
      (d) both. Record per-curve n1, |<G>|, |3V|, |3V intersect <G>|, hits,
      and the full per-row variance decomposition.
      STAGE 4 (minutes). Planted-effect positive control and the all-cyclic null
      object, both at T = 400.
      STAGE 5 (zero compute). Attribution table: measured excess per row split
      into C1 predicted, C2 measured, C3 seed spread, and residual, with the
      residual's confidence band. The deliverable is the table, not a verdict.
      ENVELOPE. Everything is exact enumeration over sets of size at most #E at
      p <= 6007 with factor bases of at most 22 x-coordinates; the committed
      sweep already runs in this envelope. Predicted peak RSS under 500 MB and
      wall time under one hour for the full battery on one core, both reported.
      No Groebner basis, no Macaulay matrix, no solver anywhere.
    controls:
      - >-
        NULL OBJECT, ALL-CYCLIC CLASS (blocking): a synthetic set of curves all
        with n1 = 1, sampled targets, no planted effect. C1 predicts EXACTLY
        zero excess here. An instrument that reports over-dispersion on this null
        is measuring something neither component names and no attribution may be
        reported from it.
      - >-
        PLANTED-EFFECT POSITIVE CONTROL (must fire): a known per-curve rate
        perturbation injected into the all-cyclic class. The corrected estimator
        must recover it. This is the control that stops the record from
        explaining away a real effect, which is its most likely failure mode.
      - >-
        BASELINE REPRODUCTION GATE (blocking, Stage 2): corrections disabled must
        reproduce the archived numbers bitwise on the same seed.
      - >-
        T-SCALING CONTROL: C1 is linear in T and C2 is independent of T. Running
        three values of T is the cheapest control that separates them, and it is
        a control that can fail.
      - >-
        SEED REPLICATION CONTROL: five independent target seeds per row, reported
        as a spread and never averaged into a single number, because the
        committed design's shared seed is precisely what C3 names.
      - >-
        CONVENTION FREEZE: whether a point and its negative count as one base
        element or two, and whether O is admitted as a target, are fixed in
        writing before Stage 2 and are identical across all four arms. Changing
        either mid-battery manufactures factors of 2^m (IDEA-20260805-5ac0a2).
    required_metrics:
      - 'per-curve n1, n2, |<G>| and the class mean of n1 - 1'
      - 'predicted C1 = T*mean(n1-1)/N per class and per T'
      - 'per-curve |3V| as committed, and |3W| with the cancelling-pair route restored, and their difference against the 2B bound'
      - 'per-curve |3V intersect <G>| and the corrected prediction |3V intersect <G>|/|<G>|'
      - 'variance ratio and residual-to-binomial ratio per arm, per row, per seed, per T'
      - 'across-seed spread versus across-density range'
      - 'null-object and planted-control outcomes with their pre-registered thresholds'
      - 'bitwise reproduction receipt for the flags-off regression gate'
      - 'peak RSS and wall time per arm'

  falsification_conditions:
    - >-
      Every curve in both tested classes is cyclic. C1 is exactly zero and the
      headline component is dead at zero compute. Reported as such.
    - >-
      The variance ratio does not scale with T at fixed density. C1 cannot be the
      dominant component whatever n1 is, and the attribution shifts to C2, C3 or
      a real effect.
    - >-
      The cancelling-pair gap is zero at every density row. C2 is inert at these
      parameters and only the derivation survives, as a latent defect that does
      not bite here.
    - >-
      The corrected ratio still exceeds 1.5 at three or more rows at both primes,
      with the planted control firing correctly. Then a genuine within-class
      curve dependence survives with two named artifacts excluded; this record is
      WRONG in the most useful direction and EV-ENDO-10109d's open question
      narrows rather than closes.
    - >-
      The flags-off regression gate fails to reproduce the archived rows. The
      re-implementation is not the same instrument; nothing may be compared and
      the batch halts.
    - >-
      The planted-effect control is not recovered. The corrected estimator is
      blind and no artifact attribution from it is admissible.
    - >-
      The across-seed spread swamps the across-density range. Then the committed
      "no decay" reading is a single-draw statement and must be re-scoped, which
      is a correction to the record rather than a confirmation of this one.

  confounders:
    - >-
      NON-CYCLIC TARGET POOL IS ALSO A REAL PROPERTY, NOT ONLY AN ARTIFACT. n1
      genuinely varies across an isogeny class and genuinely changes what a
      one-generator sampler can reach. Calling C1 an artifact is a statement
      about the ESTIMATOR's denominator, not a claim that group structure is
      uninteresting; a record that conflates the two would suppress a real
      curve-dependence. The corrected arm therefore reports n1 as a covariate
      rather than discarding it.
    - >-
      SMALL n_curves. The chi-square band on a variance ratio with a handful of
      curves is wide, and three of the four components can hide inside it. The
      number of curves per class is reported with every ratio and the band is
      drawn on every plot; rows whose band contains both 1 and 3.6 are declared
      uninformative rather than read.
    - >-
      SHARED SCALAR SEQUENCE. targets_uniform hashes (seed, i) and reduces modulo
      each curve's own gen_order, so curves with equal gen_order receive
      correlated target lists. This does not inflate the within-curve variance
      but it does correlate the per-curve estimates, which the seed-replication
      arm is sized to expose.
    - >-
      DROPPED TARGETS. E.mul returns None when h is congruent to 0 modulo
      gen_order, so len(targets) can be below the nominal count while the
      estimator divides by the nominal count. The effect is a small deterministic
      downward bias, largest for small gen_order; it is measured and reported per
      curve rather than assumed negligible.
    - >-
      3V IS NOT A UNIFORM RANDOM SUBSET. It is a sumset, and its coset split
      across <G> could be biased rather than hypergeometric -- for instance if
      the small-x window base sits preferentially in a subgroup. That bias would
      change C1's coefficient and is measured directly (H1's validation plan)
      rather than assumed away.
    - >-
      AUTHORSHIP ASYMMETRY. Explaining away another campaign's headline anomaly
      is cheap to produce and reads as rigour. The planted-effect positive
      control and the pre-registered "corrected ratio still above 1.5" branch
      exist so that failing to explain it costs the same work as explaining it.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO ALGORITHM. This is an estimator audit at toy
      scale (p <= 6007 in the arms proposed). Nothing here bears on ECDLP
      hardness and nothing is offered that does.
    - >-
      A successful attribution does NOT retroactively invalidate any committed
      number. It would license a correction record and a Coordinator decision,
      and nothing in this proposal performs either. No hypothesis status is moved
      by this record.
    - >-
      Scoped to the two tested isogeny classes, the tested primes, the tested
      fb-size ladder, m = 3 (with m = 2 reported alongside), and the committed
      sampler. Other classes, other target-selection rules and other arities are
      untested, exactly as EV-ENDO-10109d's own boundaries state.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was read for prior art (the twelve
      RQ-RELN-001 proposals by title, four of them in full, plus KN-FIND-007,
      EV-ENDO-10109d, IDEA-20260829-c6e7a4 and the harness source). One web
      search was run this session, for the Petit-Kosters-Messeng PKC 2016 paper,
      and it returned a public PDF URL whose technical content could not be
      extracted; no external search was run on estimator over-dispersion. Honest
      status: unverified.
    - >-
      The C1 closed form is derived under H1 (random-subset coset splitting). It
      is a MODEL for a quantity that is exactly enumerable at these parameters,
      so the model is checked rather than trusted; if it fails, the correction is
      still exact because the corrected estimator uses the MEASURED
      |3V intersect <G>| and not the model.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V of B small-x liftable coordinates on E(F_p) with
        E(F_p) isomorphic to Z/n1 x Z/n2, the three-fold signed sumset
        S = 3W (W = V union -W) meets the cyclic subgroup <G> of order n2 in a
        number of points distributed as Hypergeometric(N, |S|, n2); consequently
        Var(|S intersect <G>|/n2) = r(1-r)(n1-1)/N + o(1/N) with r = |S|/N, and
        the NULL-B variance ratio acquires the additive term T(n1-1)/N, uniformly
        in r.
      rigorous_support: >-
        The RIGOROUS ingredient is two-fold and is stated so the gap is visible.
        (i) The conservation identity of KN-FIND-007 fixes the mean number of
        size-m multisets summing to any target at binomial(|W|+m-1,m)/N exactly,
        in whatever group the sums live in -- so no distributional assumption is
        needed for the FIRST moment, and the coset-split assumption is used only
        for the second. (ii) The hypergeometric variance for a uniformly random
        s-subset split by a fixed index-n1 subgroup is exact and elementary.
        The CLASSICAL STATEMENT IMITATED is equidistribution of sumsets across
        subgroup cosets, the additive-combinatorics analogue of a character-sum
        equidistribution bound: for a set S with small Fourier bias, the coset
        counts deviate from |S|/n1 by O(sqrt(|S|)) times the bias. The GAP is
        that 3W is not a random subset and its bias against the n1 characters
        trivial on <G> is not bounded here.
      validation_plan: >-
        SAMPLE: at p = 4001 and p = 6007, for every curve in each tested class
        and every fb_size in the committed ladder, enumerate 3W EXACTLY (which
        the harness already does) and compute the full coset-count vector of 3W
        against <G>, giving n1 exact integers per (curve, fb_size) cell -- no
        sampling error at all. This is roughly 13 rows times the class size times
        two primes, all within the existing envelope. COMPARISON DISTRIBUTION:
        the hypergeometric coset-count distribution with parameters (N, |3W|,
        n2), by chi-square at the 1 percent level per cell, plus a pooled test
        over cells. TAIL CHECKS: (a) the most extreme coset deviation observed
        against the hypergeometric upper tail at 1/1000; (b) the observed
        variance-to-hypergeometric-variance ratio of the coset counts, whose
        departure from 1 is the direct measure of the bias the assumption
        ignores; (c) a check that the deviation does not correlate with the
        factor base sitting inside 2E, which is the concrete bias mechanism most
        likely to be present. RECORDED PARAMETERS: p, class trace, per-curve
        (n1, n2), fb_size, |3W|. TRANSFER ASSUMPTIONS: NONE. Nothing above
        p = 6007 is claimed, and the corrected estimator does not depend on H1
        holding, because it uses the measured intersection rather than the
        modelled one -- H1 is load-bearing only for the PREDICTED SIZE of C1.
    - id: H2
      statement: >-
        Five independent target seeds per density row are sufficient to
        distinguish a density profile that is a property of the density ladder
        from one that is a single realization of the shared curve-and-target
        draw, at the effect sizes recorded in EV-ENDO-10109d (variance ratios
        1.3 to 3.6).
      rigorous_support: >-
        The RIGOROUS ingredient is the sampling distribution of a variance ratio:
        (n-1)*ratio is chi-square with n-1 degrees of freedom under the null, so
        the ratio's own spread at the class sizes in use is computable exactly
        and is what sets the required number of seeds. The CLASSICAL STATEMENT
        IMITATED is the standard variance-components decomposition of a two-way
        layout with one observation per cell. The GAP is that the density rows
        are not independent even across seeds, because the curve set is fixed;
        five seeds bound the target-draw component only, not the curve-set
        component, and this record does not claim otherwise.
      validation_plan: >-
        SAMPLE: 5 seeds times 13 density rows times 3 values of T times 2 primes.
        COMPARISON: the chi-square sampling distribution of the ratio at the
        actual class size, reported as an acceptance band on every row.
        TAIL CHECK: the largest across-seed deviation at any row against that
        band. If five seeds prove insufficient (the across-seed band still
        contains both 1 and the measured value at most rows) the record must say
        so and state the number of seeds that would suffice, rather than
        reporting an underpowered attribution. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. Under
      docs/target-result-profile.md this is explicitly NON-TARGET-CLASS: it is an
      estimator-correctness precondition for every decomposition-rate number this
      program reports, and its priority rests on that and on nothing else. The
      measurement's own cost is O(B * |2W|) group operations per cell for the
      sumset build (already paid by the committed code) plus O(|3W|) scalar
      multiplications for the coset test, i.e. minutes per prime.
    memory_exponent: >-
      O(N) point-set storage at N under 2^13, well under 500 MB; O(B) for the
      base. No linear algebra of any kind.
    best_known: >-
      For the underlying question the incumbent is EV-ENDO-10109d itself, which
      established the anomaly and explicitly recorded no explanation; there is no
      prior attribution to beat. For prime-field ECDLP the frontier remains
      Pollard rho at 0.886*sqrt(N) time and O(1) memory, which this record does
      not approach and does not claim to.
    hidden_overhead: >-
      Disclosed honestly: C1's magnitude is proportional to T/N, so it is a
      TOY-SCALE effect that shrinks as the group grows at fixed target count and
      would be invisible at cryptographic scale. That is exactly why it can
      contaminate this program's toy measurements and no one else's, and it is
      why the correction must be applied before any toy number is quoted or
      extrapolated. Nothing about the correction is an advance; it is a debt.
    tradeoff_note: >-
      The one real design tradeoff this record quantifies: raising T buys
      precision on the per-curve rate at rate 1/sqrt(T) while inflating the C1
      artifact linearly in T, so an uncorrected estimator gets WORSE at exactly
      the setting an experimenter would reach for to get a cleaner number. After
      the correction the tradeoff disappears and T is free. Not a time-memory
      tradeoff; no algorithm is produced.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK it
    mounts none, so it is dominated on every axis by every frontier row checked:
    Pollard rho (0.886*sqrt(N) time, O(1) memory), parallel rho with distinguished
    points, multi-target rho, BSGS (sqrt(N) time and memory), van Oorschot-Wiener
    at memory w, the preprocessing/advice frontier, and MITM two-table index
    calculus. None is affected. As an ATTRIBUTION of EV-ENDO-10109d's residual
    over-dispersion, no prior attribution exists: the evidence record itself
    states the cause is unknown and the independent Validator confirmed the
    non-decay without offering a mechanism, so there is no row to be dominated
    by. As a STATEMENT ABOUT MEAN YIELD it is strictly dominated by KN-FIND-007,
    whose identity it quotes and does not extend. As a STATEMENT ABOUT THE
    DENOMINATOR GROUP it is adjacent to and not dominated by IDEA-20260829-c6e7a4,
    which makes the same argument on the factor-base side; the two should be read
    together and neither subsumes the other. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis: no attack, no exponent, no algorithm, no
    constant. Quantified deliverable: a closed-form predicted value,
    1 + T*mean(n1-1)/N, for a recorded and replicated anomaly currently carrying
    no explanation at all, evaluated at the committed parameters as 1.1, 1.7 and
    2.5 for class-mean n1 of 2, 8 and 16 against a measured band of 1.3 to 3.6;
    a second, independently signed component bounded above by exactly 2B targets
    with a decreasing-in-density signature; a two-factor design that separates
    them from each other and from a genuine effect at the cost of the committed
    sweep times three; and, whichever way it lands, either the retirement of a
    campaign's headline open question or its reduction to a residual with two
    named artifacts subtracted.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Reuses harness/exp_icinv.py and harness/run_saturation.py unchanged except
      for two flagged corrections and a coset-count instrument. The committed
      sweep already runs in this envelope; the battery is that sweep times three
      values of T times five seeds at two primes, predicted under one hour on one
      core with peak RSS under 500 MB, both reported rather than asserted.
  recommended_priority: high

