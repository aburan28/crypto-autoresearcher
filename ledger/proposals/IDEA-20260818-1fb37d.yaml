      provenance: recalled
      claim: >-
        RECALLED, CORROBORATED ONLY AT SEARCH-SUMMARY LEVEL on 2026-08-18: for
        the medium prime case with n = eta*kappa, gcd(eta,kappa)=1, exTNFS
        attains L_Q(1/3, (48/9)^{1/3}) ~ 1.747, and L_Q(1/3, (32/9)^{1/3}) ~
        1.526 when p has special form (SexTNFS). THE REVIEWER MUST RESOLVE
        THESE CONSTANTS AGAINST THE PRIMARY TEXT. The eprint host returned a
        block page to this session. Corpus record KN-LIT-3743 holds the title.
      verified_by: null
    - ref: 'Kim, Jeong, "Extended Tower Number Field Sieve with Application to Finite Fields of Arbitrary Composite Extension Degree" (KN-LIT-3742)'
      provenance: kb
      claim: >-
        Title-level only, from the corpus record: exTNFS extends to arbitrary
        composite extension degree, removing the gcd(eta,kappa)=1 restriction.
        The corpus entry is a title record; no complexity constant is taken
