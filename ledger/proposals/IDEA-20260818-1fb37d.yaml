        CORPUS ENTRY: a batch-NFS circuit of area L^{1.181...+o(1)} factors
        L^{0.5+o(1)} separate B-bit RSA keys in time L^{1.022...+o(1)}, with
        L = exp((log 2B)^{1/3}(log log 2B)^{2/3}); the area-time product is
        L^{1.704...+o(1)} PER KEY against L^{1.976...+o(1)} for the best
        single-key result; and early-abort ECM improves batch NFS by a
        superpolynomial factor exp((c+o(1))(log 2B)^{1/6}(log log 2B)^{5/6}).
        This is the closest thing this program holds to the load-bearing
        external ingredient of the mechanism above -- a re-costing of NFS under
        an AREA-TIME objective -- and it is for FACTORING, not for tower
