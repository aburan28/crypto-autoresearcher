      verified_by: 'coordinator-semantic-screen (this session, knowledge/literature/KN-LIT-2663.md read in full 2026-08-18); the idea-generator session that filed this proposal did NOT open the underlying PDF'
    - ref: IDEA-20260805-72bcb5
      provenance: internal
      claim: >-
        The block-Wiedemann traffic identity for GNFS records: bytes per row
        bounded below by log2 C(N, d_row), iteration count 3N/b fixing a
        sequential depth. This record reuses that accounting and applies it
        inside an optimiser rather than to a fixed published tuple.
      verified_by: 'this session read the first 60 lines of ledger/proposals/IDEA-20260805-72bcb5.yaml'

  object_first_candidate:
    tracked_object: >-
      THE ARGMIN OF THE COST FUNCTIONAL, as a function of the machine model.
      Not the cost, not the bit level: the parameter tuple (eta, kappa, B, A, b)
      that minimises it, followed as the communication price is turned up from
      zero. The object is chosen because a security level is the VALUE of a
      function at its argmin, and every published discussion varies the function
      while holding the argmin fixed at somebody else's choice.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record, because
      RQ-PAIR-f2e31f is already heavily worked and candidates otherwise regress
      into variants of them: (F1) asymptotic L-notation bookkeeping at a fixed
      parameter tuple; (F2) norm-size / Dickman yield estimation as such;
      (F3) searching for a better polynomial pair (that is IDEA-20260809-172a9e
      and IDEA-20260815-bf1328); (F4) simulation-based relation counting;
      (F5) extrapolation from record computations (IDEA-20260809-22a00c);
      (F6) Galois-symmetry speedups (IDEA-20260815-f4deca, KN-OPEN-025);
      (F7) mechanical one-at-a-time sensitivity sweeps (IDEA-20260809-237e4e).
      This record may CONSUME any of them as an input but may not use one as its
      lens.
    lossiness: >-
      LOSSY-PROJECTION TEST, applied before any experiment and costing no
      compute. The projection is (full attack execution) -> (parameter tuple,
      cost triple). It discards: every relation actually found, the factor base
      contents, the matrix entries, the kernel vector, and the logarithm. It
      retains: the tuple and the three aggregate resources. The discard is
      COMPATIBLE with the target's operations because the exTNFS cost function
      is by construction a function of the tuple alone -- relation collection's
      expected cost depends on the relations only through their expected count,
      and block Wiedemann's cost depends on the matrix only through (N, w, b).
      The projection is genuinely lossy: infinitely many distinct attack
      executions share a tuple. It is NOT a change of coordinates, because the
      logarithm is not recoverable from the retained part -- contrast the
      (Delta, Pi) example of docs/inventor-protocol.md section 2, where the
      unordered pair was recoverable as roots of a quadratic.
    propagation: >-
      One-step propagation is defined and measurable: raising the communication
      price by one increment moves the argmin by a computable displacement,
      obtained by solving the perturbed stationarity condition. The propagation
      is deterministic given the cost function, and the displacement is the
      quantity the experiment reports.
    survival_score: >-
      Survives as long as the cost function is differentiable in log(B) and the
      two terms remain separately identifiable. It DISSOLVES when the surface
      is flat (claim C3) -- at which point the argmin stops being a
      well-defined object, and that dissolution is itself the reportable
      obstruction rather than a failure of the record.
    newness_score: >-
      Genuinely-new-vs-repackaging: the ingredients (an exTNFS cost function, a
      communication charge, a numerical optimiser) are each standard, and the
      AT re-optimisation move is old for prime-field NFS. What this repository
      does not hold is the composition applied to the tower case with the
      argmin, not the value, as the tracked object. Score: ADAPTATION AT BEST,
      pending the reviewer's semantic screen; claimed as new only relative to
      this repository.

  null_object_control: >-
    NULL 1 -- ZERO-PRICE CONTROL (forced). Set the communication price to zero
    and re-run the identical optimiser. It MUST reproduce the published
    operation-count optimum and the published L-notation constant symbolically.
    If it does not, the cost function is wrong and nothing downstream may be
    reported.
    NULL 2 -- DEGENERATE-TOWER CONTROL (forced). Set eta = 1, kappa = n, which
    collapses exTNFS to the non-tower NFS-DL setting; and set n = 1, which
    collapses it to GNFS. Both slices must reproduce their own published
    constants at zero price. This is the baseline embedding of
    docs/inventor-protocol.md section 8 audit 1, run as a control rather than
    asserted.
    NULL 3 -- RANDOM-FUNCTIONAL CONTROL. Replace the communication term by a
    random smooth positive term of the same magnitude but with an arbitrary
    B-exponent. If the argmin displacement is of the same size as under the
    physically derived term, the displacement is measuring the optimiser's
    sensitivity rather than the physics of data movement, and the result is a
    controlled null, not a finding.
    NULL 4 -- INTENSITY CONTROL. The bandwidth-bound premise is itself
    measurable: micro-benchmark a mod-r sparse matrix-vector product at small N
    and record achieved modular-multiply-adds per byte moved. If the measured
    arithmetic intensity exceeds the host's flop:byte ratio, the linear algebra
    is NOT bandwidth-bound at the tested scale and heuristic H3 below is
    falsified at that scale.

  discriminated_from:
    - >-
        IDEA-20260805-72bcb5 (RQ-RSA-afe33c): audits published GNFS record
        numbers in bytes and explicitly forbids itself any optimisation lens.
        This record's entire content is the re-optimisation that record rules
        out, in a different algorithm family (tower, mod-r vectors).
    - >-
        IDEA-20260815-bf1328 (RQ-PAIR-21313f): re-runs polynomial selection for
        the same two curves with memory charged as a quantity. It reports a
        memory figure at a selected polynomial pair. This record reports the
        displacement of the ARGMIN and an L-notation constant, and treats the
        polynomial pair as one coordinate of the tuple it optimises over.
    - >-
        IDEA-20260809-1a5cb2 (RQ-PAIR-f2e31f): states matrix dimension and
        weight at deployment parameters and prices the incumbent tuple. This
        record moves the tuple. The two compose: 1a5cb2's dimension/weight model
        is an input here.
    - >-
        IDEA-20260809-237e4e (RQ-PAIR-f2e31f): a mechanical one-choice-at-a-time
        sensitivity sweep producing a ranked table. A sweep evaluates the
        function at perturbed inputs; this record re-solves for the minimiser
        under a structurally different objective, which a one-at-a-time sweep
        cannot reach because the machine model is not one of the swept
        conventions.
    - >-
        IDEA-20260809-240828 (RQ-PAIR-f2e31f): bounds the o(1) by comparing the
        asymptotic formula to observed cost across sizes. Orthogonal: that
        record holds the objective fixed and measures the formula's error; this
        one changes the objective and holds the formula's form fixed.
    - >-
        H-CRYPTO-a928b6: an embedding-degree census whose hidden_cofactor field
        records that NFS communication cost is charged only implicitly. This
        record is the instrument that field says is missing; it makes no census
        claim.

  assumptions:
    - >-
        An exTNFS cost function of the published shape can be written down
        explicitly and correctly from the primary sources. THIS IS NOT YET TRUE
        IN THIS PROGRAM: RQ-PAIR-f2e31f's own constraint forbids recording any
        cost figure before the exTNFS reference and at least one pairing
        key-size estimation paper are filed as KN-LIT entries. This record is
        BLOCKED on that filing and says so.
    - >-
        The BLS12-381 prime and its subgroup order are taken as published
        constants and are transcription-checked, not re-derived.
    - >-
        Relation collection's communication is negligible relative to linear
        algebra's. Stated as an assumption because batch/distributed relation
        collection has its own traffic; it is checked, not assumed, by
        reporting both terms' byte counts.

  proof_search_map:
    bottleneck: >-
      The parameter-balancing step: setting the relation-collection term equal
      to the linear-algebra term and solving for the smoothness bound B. Every
      published bit level for a pairing target field passes through this single
      equation, and the equation's right-hand side is where the communication
      price would enter.
    baseline_embedding:
      parameter_slice: >-
        communication price beta^{-1} = 0 must reproduce the published
        operation-count optimum for GF(p^12); additionally (eta=1, kappa=n)
        reproduces NFS-DL and (n=1) reproduces GNFS, each at its own published
        constant.
      reproduction_check: >-
        SYMBOLIC, not visual: the zero-price stationarity condition must reduce
        algebraically to the published expression for the optimal log(B), and
        the resulting exponent constant must equal the published constant to
        the precision the primary text states it. A frozen regression fixture
        stores the symbolic reduction and the three constants; a plot that
        "looks like" the baseline is not an embedding.
    observation_collision:
      observable: >-
        The scalar total cost at a tuple -- which is precisely the observable
        that a quoted "bit level" carries.
      distinct_preimage_search: >-
        DIRECTLY SEARCHED, and expected to succeed: enumerate the level set of
        tuples within 1 bit of the optimum and report the range of memory and
        of bytes-moved across it. A collision here (two tuples, same headline
        cost, memory differing by 2^10) is a direct falsifier of the
        identifiability of "the bit level" as a scalar, and is claim C3. This
        is the one audit in this record most likely to return a positive, and
        it costs no sieve time.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The exTNFS cost model re-expressed with the machine model as an
          explicit parameter, so that "the security level" becomes a function
          level(beta, mesh_dim, bytes_per_entry) rather than a scalar.
        predicted_gain: >-
          Converts a disagreement about conventions into an exactly evaluable
          function; the deliverable is the function and its argmin locus, not a
          number.
      - transform: specialization_pack
        proposed_object: >-
          Separate resource measures for the two stages (compute-seconds for
          relation collection, bytes-moved for linear algebra), added only over
          the two stages, which are disjoint in time.
        predicted_gain: >-
          Avoids the standard error of adding operation counts across stages
          with incomparable arithmetic intensities.
    quantifier_order: >-
      The published label implicitly asserts: THERE EXISTS a tuple T such that
      FOR ALL attackers, cost(T) >= 2^L. The honest statement is: FOR ALL
      machine models M there EXISTS a tuple T_M minimising cost_M, and
      L(M) = log2 cost_M(T_M) depends on M. The witness T is allowed to depend
      on M, which the scalar label forbids. This inversion is the record's
      central methodological point and it is checkable without any compute.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is: under machine model M
        and stated conventions, an attacker following the modelled exTNFS
        pipeline expends at least/at most the reported triple. It CANNOT
        certify a lower bound on the cost of any attack, cannot exclude an
        unmodelled algorithm, and cannot say anything about whether BLS12-381
        is secure. Any reading of the output as a security verdict is outside
        the method's ceiling.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion must FAIL: a field for
        which an executed record computation exists at a scale where the true
        cost is known -- the 521-bit GF(p^6) TNFS record of KN-LIT-4634. If the
        charged optimiser cannot bracket that record's actual resource
        consumption, it has not identified the load-bearing structure and its
        BLS12-381 output is uninterpretable.
    proof_obligations:
      - claim: 'Zero-price optimiser reproduces the published exponent constant for GF(p^12), NFS-DL and GNFS.'
        responsibility: baseline
      - claim: 'The communication term is derived from the block-Wiedemann access pattern, not fitted.'
        responsibility: correctness
      - claim: 'The argmin displacement under a nonzero price is at least 1.0 in log2(B).'
        responsibility: strictness
      - claim: 'Memory and bytes-moved at the re-optimised tuple, stated with the entry-size accounting.'
        responsibility: memory
      - claim: 'The 1-bit level set spans a memory range of at least 2^10.'
        responsibility: size
      - claim: 'No statement about deployed-curve security is derivable from the output.'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: 'zero-price control: reproduced L-notation constant for GF(p^12)'
      direction: different
      minimum_effect: >-
        FORCED to equal the published constant to the precision the primary
        text states. Any mismatch halts the record.
    - metric: 'displacement of argmin log2(B) between zero price and charged price'
      direction: higher
      minimum_effect: '>= 1.0 bit of log2(B); below that, claim C1 is falsified.'
    - metric: 'total cost gap between published tuple evaluated under the charged objective and the re-optimised tuple under the same objective'
      direction: lower
      minimum_effect: >-
        >= 8 bits. This gap is >= 0 by construction (re-optimisation cannot
        hurt the attacker), so the informative content is entirely in its
        magnitude; < 8 bits falsifies C2 and is the outcome meaning "the
        published tuple is near-optimal even under a charged objective", which
        would materially strengthen confidence in the deployed labels.
    - metric: 'span of memory across the 1-bit-optimal level set'
      direction: higher
      minimum_effect: '>= 2^10; below that, C3 is falsified and the bit level is a well-defined scalar under a fixed objective.'
    - metric: 'measured arithmetic intensity of the mod-r sparse matrix-vector product (modular multiply-adds per byte moved)'
      direction: lower
      minimum_effect: >-
        Predicted below the host flop:byte ratio, i.e. bandwidth-bound. If
        higher, H3 is falsified at the tested scale and the whole communication
        premise is wrong at that scale.
    - metric: 'ratio sd(charged cost) / sd(free cost) across the convention ensemble'
      direction: different
      minimum_effect: >-
        Reported without a directional prediction; it says whether charging
        communication makes the estimate more or less convention-sensitive,
        which is what a deployment reader needs.

  minimal_test:
    design: >-
      NO SIEVE IS RUN. Three components, in order, each with a stop gate.
      (S1) SYMBOLIC BASELINE, zero compute beyond CAS: write the exTNFS cost
      function from the filed KN-LIT sources; reduce the zero-price
      stationarity condition symbolically; check it against the published
      optimal-B expression and against the GNFS and NFS-DL degenerate slices.
      STOP GATE: if any of the three fails to reproduce, the record halts and
      reports the discrepancy as its result.
      (S2) MICRO-BENCHMARK, minutes: mod-r sparse matrix-vector product at
      N = 10^5..10^6 with row weight 20..100, r of 255 bits, measuring
      modular multiply-adds per byte moved and achieved bandwidth. This
      calibrates the single physical constant the charged objective needs and
      tests NULL 4.
      (S3) OPTIMISATION AND SURFACE MAP: minimise the charged cost function
      over (eta, kappa, log B, log A, b) at Q = p^12 for the BLS12-381 prime,
      across a declared grid of communication prices spanning free to
      severely bandwidth-limited, plus a mesh-AT arm. Emit the argmin locus,
      the cost triple at each argmin, the full 1-bit level set with its memory
      span, and NULL 3's random-functional arm.
      Every number emitted carries its machine model and its convention vector.
    controls:
      - 'NULL 1 zero-price reproduction of the published constant (forced, blocking).'
      - 'NULL 2 degenerate-tower slices to NFS-DL and GNFS (forced, blocking).'
      - 'NULL 3 random-functional communication term of matched magnitude.'
      - 'NULL 4 measured arithmetic intensity vs host flop:byte ratio.'
      - 'Nearby-object control: bracket the KN-LIT-4634 521-bit GF(p^6) record.'
      - 'Transcription check on the BLS12-381 prime and subgroup order against two independent published statements.'
    required_metrics:
      - 'argmin tuple per communication price, with the displacement in log2(B).'
      - 'cost triple (operations, memory bytes, bytes moved) at each argmin, never a scalar.'
      - 'L-notation constant recovered at zero price for GF(p^12), NFS-DL, GNFS.'
      - 'memory span of the 1-bit-optimal level set.'
      - 'measured modular multiply-adds per byte and achieved bandwidth.'
      - 'bracket interval around the KN-LIT-4634 record''s reported consumption.'

  falsification_conditions:
    - >-
        NULL 1 fails: the zero-price optimiser does not reproduce the published
        constant. The cost function is wrong; the record reports that and stops.
        This is the most likely failure and it is a useful one.
    - >-
        Argmin displacement < 1.0 in log2(B) across the whole price grid. C1 is
        false: the published tuple is robust to the machine model, and the
        convention "count operations" is defensible for this target. This would
        be a genuine reassurance about the deployed labels and must be reported
        as one.
    - >-
        Re-optimisation gap < 8 bits. C2 is false at the stated threshold.
    - >-
        1-bit level set spans < 2^10 in memory. C3 is false; the bit level is
        well defined once the objective is fixed, and the program's standing
        worry about unpriced memory reduces to a single number rather than an
        identifiability problem.
    - >-
        NULL 3 matches the physical term: the displacement is an artifact of
        optimiser sensitivity. Controlled null; no finding.
    - >-
        NULL 4 fails: linear algebra is compute-bound at the tested scale, H3 is
        falsified there, and the extrapolation to deployment scale must be
        re-argued or abandoned.

  confounders:
    - >-
        CONVENTION ENTANGLEMENT: the published constant this record must
        reproduce is itself the output of conventions (which smoothness
        estimate, which filtering assumption). A failure of NULL 1 may indicate
        a convention mismatch rather than an error, and the record must
        distinguish the two by sweeping the conventions before declaring the
        cost function wrong.
    - >-
        OPTIMISER ARTIFACTS: a flat surface makes the argmin numerically
        unstable, so an apparent displacement may be numerical. Mitigated by
        reporting the level set alongside the argmin and by NULL 3.
    - >-
        MICRO-BENCHMARK NON-TRANSFER: arithmetic intensity measured at N = 10^6
        on one host does not establish the intensity of a hypothetical
        deployment-scale attack on unknown hardware. The measurement bounds the
        premise at the tested scale only, and the extrapolation is stated as an
        assumption, never as a measurement.
    - >-
        HIDDEN o(1): at Q = 12 * 381 = 4572 bits the L-notation o(1) is not a
        small correction, and a bit-level difference computed from asymptotic
        formulas at that size inherits that uncertainty. IDEA-20260809-240828
        is the record that quantifies it; until it reports, every bit figure
        here carries an unbounded o(1) caveat and must say so.

  interpretation_limits:
    - >-
        NO ATTACK IS MOUNTED, no discrete logarithm is attempted, and no
        statement that any deployed curve is broken or safe may be derived from
        this record. A re-derivation showing a published figure corresponds to
        a particular machine model is a scoped methodological result about a
        cost model.
    - >-
        Every figure is scoped to the stated machine model, the stated
        conventions, the transcribed prime, and the asymptotic formula's own
        validity range.
    - >-
        The micro-benchmark is toy scale and never becomes a crypto-scale
        claim; it calibrates one constant of a model and nothing else.
    - >-
        The claim that re-optimisation cannot hurt the attacker is a statement
        about the MODEL's minimiser, not about real attackers, who face
        engineering constraints the model omits.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR the exTNFS relation-collection stage at parameters (eta, kappa, B,
        A) with Q = p^12 and log2 p = 381, the norm products of candidates
        drawn from the sieving region are B-smooth with probability
        rho(u)(1+o(1)), u = log(norm product)/log B, uniformly over the region,
        where rho is the Dickman-de Bruijn function.
      rigorous_support: >-
        Rigorous ingredient: Canfield-Erdos-Pomerance, Psi(X,B) =
        X * u^{-u(1+o(1))} uniformly in a stated u-range, for UNIFORMLY RANDOM
        integers of size X. THE GAP, stated rather than hidden: norm products
        over a sieve region are not uniformly random integers of their size --
        they are values of a fixed bilinear-ish form on a lattice, and the
        region's geometry biases them (this is exactly the object of
        IDEA-20260818-17300c, the companion record). H1 asks only that the
        bias does not change the SMOOTHNESS law's form.
      validation_plan: >-
        SAMPLE: norm products at small p (24-40 bits) over the exact sieve
        region for a tower of the same (eta,kappa) shape, 10^5 per parameter
        point; test B-smoothness by trial division to B then ECM to B, and
        declare not-smooth when the cofactor is composite and exceeds B^2.
        COMPARE: empirical smooth fraction against rho(u) with u computed from
        the observed norm sizes. TAIL CHECK: the smoothest sample's u against
        its predicted extreme probability. TRANSFER ASSUMPTION, STATED: the law
        measured at 24-40 bit p is assumed to hold in form at 381-bit p; only
        the FORM transfers, never the fitted constant.
      falsification_condition: >-
        Empirical smooth fraction departing from rho(u) by more than a factor 2
        at any tested parameter point, with the departure GROWING as p grows
        across the tested range (a departure that shrinks with p is a small-p
        artifact and is reported as such).
    - id: H2
      statement: >-
        FOR the exTNFS relation matrix at the modelled parameters, the average
        row weight w after filtering is bounded in a stated interval
        [w_lo, w_hi] independent of Q within the modelled range, and the
        post-filter dimension is a fixed fraction of the factor-base size.
      rigorous_support: >-
        Rigorous ingredient: the number of factor-base primes dividing a
        relation is bounded by log(norm)/log(2), and the matrix's information
        content is bounded below by log2 C(N, w) bits per row
        (IDEA-20260805-72bcb5's identity). THE GAP: the actual post-filter
        (N, w) is the output of a merge heuristic, not of a theorem, and this
        assumption imitates the practitioner convention that it lands in a
        narrow band.
      validation_plan: >-
        SAMPLE: build genuine relation sets in small tower fields (GF(p^6),
        GF(p^12) at 20-40 bit p), run a filtering pass, and record the
        (dimension, weight) trajectory as a function of relation excess.
        COMPARE: against the interval [w_lo, w_hi] asserted by the cost model.
        TAIL CHECK: the largest observed w and the smallest observed dimension
        ratio. TRANSFER ASSUMPTION, STATED: the interval is assumed size-
        independent, which is precisely what the trajectory across the tested
        sizes tests; a trend in w with size falsifies the assumption's
        size-independence and must be propagated into the cost function.
      falsification_condition: >-
        Measured w outside [w_lo, w_hi] at any tested size, or a monotone trend
        in w across the tested sizes exceeding 20% per doubling of log Q.
    - id: H3
      statement: >-
        FOR the block-Wiedemann Krylov iteration over Z/rZ with r of 255 bits,
        at matrix dimensions in the modelled range, the achieved arithmetic
        intensity (modular multiply-adds per byte moved across the memory
        boundary) is below the flop:byte ratio of the machine class considered,
        so the step's wall-clock is bandwidth-determined rather than
        arithmetic-determined.
      rigorous_support: >-
        Rigorous ingredient: each sparse matrix-vector product performs exactly
        N*w modular multiply-adds and must read at least the information
        content of the matrix, log2 C(N,w) bits per row, plus N vector
        coordinates of log2 r bits -- an O(1) flops-per-byte ratio by
        construction. THE GAP: caching, blocking width b, and vector reuse can
        raise the effective intensity by a factor b, so H3 is really the claim
        that b stays small enough, which is itself a parameter this record
        optimises over.
      validation_plan: >-
        SAMPLE: micro-benchmark at N = 10^5..10^6, w in {20,...,100}, b in
        {1,...,64}, measuring achieved multiply-adds per byte and bandwidth
        utilisation on the run host, 5 seeds each. COMPARE: against the host's
        measured peak flop:byte ratio obtained from a matched dense kernel.
        TAIL CHECK: the largest b, where the assumption is weakest by
        construction. TRANSFER ASSUMPTION, STATED: nothing about a
        deployment-scale machine is claimed; the benchmark bounds the premise
        at the tested N and b only, and the cost function carries the
        intensity as a declared parameter that a reader may re-set.
      falsification_condition: >-
        Measured arithmetic intensity at or above the host flop:byte ratio for
        any b in the modelled range; the communication charge then has no
        physical basis at that b and the optimiser must be restricted to the b
        range where H3 holds.

  target_complexity:
    time_exponent: >-
      The object is the constant c in L_Q[1/3, c] for Q = p^12, NOT the 1/3.
      Baseline (RECALLED, reviewer must resolve): c = (48/9)^{1/3} ~ 1.747 for
      general p, c = (32/9)^{1/3} ~ 1.526 for special-form p. THIS RECORD DOES
      NOT ASSERT A VALUE FOR THE CHARGED c. It asserts that c_charged is
      obtained by re-solving the same balance under a different objective, that
      the derivation is mechanical once the objective is written down, and that
      the experiment's job is to produce it. Guessing it here would be exactly
      the fabrication AGENTS.md rule 5 forbids.
    memory_exponent: >-
      Memory is the relation matrix: N * w entries, N = L_Q[1/3, c_B] with c_B
      the smoothness-bound constant of the chosen tuple, so memory is itself
      L-notation subexponential with a constant to be reported alongside c.
      A SCALAR BIT LEVEL WITH NO MEMORY STATEMENT IS NOT ADMISSIBLE OUTPUT of
      this record (RQ-PAIR-f2e31f constraint 2). The deliverable is the pair
      (c_time, c_memory) plus the bytes-moved term, per machine model.
    best_known: >-
      Incumbent frontier rows checked for domination: (i) exTNFS in the target
      field, L_Q[1/3,(48/9)^{1/3}] RECALLED; (ii) SexTNFS for special-form p,
      L_Q[1/3,(32/9)^{1/3}] RECALLED, which is the row that actually applies to
      BLS/BN primes and is the subject of IDEA-20260809-1d1734; (iii) the
      published post-exTNFS pairing key-size re-estimates (Barbulescu-Duquesne,
      RECALLED; Guillevic's STNFS-resistant short-list, KN-LIT-2223, in corpus
      as a title-only record); (iv) the Galois-symmetry linear-algebra speedup
      of KN-LIT-7643 (k=12, reported ~144x on one step, end-to-end unstated);
      (v) the lattice-enumeration / spherical-region sieving of KN-LIT-4634.
      This record IMPROVES NONE of them. It re-solves their shared balancing
      step under a different objective.
    hidden_overhead: >-
      Everything. At Q = 4572 bits the o(1) in L is not small, and this record
      compounds it with (a) an unverified transcription of the cost function
      from sources this program has not yet filed, (b) a bytes-per-entry
      constant that is an engineering choice, and (c) a filtering model (H2)
      that is a convention. The honest position is that the OUTPUT IS A
      DIFFERENCE between two evaluations of the same instrument, and only the
      difference is defensible; the absolute levels inherit every one of these.
    tradeoff_note: >-
      The charged objective makes the time-memory tradeoff explicit rather than
      implicit: at fixed communication price, smaller B gives a smaller matrix
      (less memory, less traffic) and more sieving (more compute, perfectly
      parallel); larger B does the reverse. The record's deliverable is
      precisely this frontier, plus the parallelisation position: relation
      collection scales linearly in workers with negligible traffic, while
      block Wiedemann has a SEQUENTIAL DEPTH of ~3N/b iterations that no
      additional hardware buys down -- the pairing analogue of the point
      IDEA-20260805-72bcb5 makes for GNFS records.

  obstruction:
    statement: >-
      ANTICIPATED, TO BE MEASURED, NOT ASSERTED. If claim C3 holds, the
      obstruction is a property of the OBJECT and not of the attempt: the
      exTNFS cost surface near its optimum is flat in the (log B, b) plane, so
      the map from "security level" to "parameter tuple" is not injective and a
      scalar bit level does not determine the attacker's resource profile.
    quantity: >-
      The memory span and the bytes-moved span of the set of tuples whose total
      cost is within 1 bit of the optimum, at fixed machine model.
    value: >-
      NOT YET MEASURED. Predicted >= 2^10 in memory (claim C3). Recording a
      value here before the run would be fabrication.
    measured_by: []
    scope: >-
      To be claimed only over Q = p^12 at the BLS12-381 prime, the declared
      convention ensemble, and the declared communication-price grid. Nowhere
      else.
    resource_check:
      examined: true
      reading: >-
        READ AS A RESOURCE, NOT A NUISANCE. A flat cost surface is an ATTACKER
        ASSET: it means the attacker may choose, among many near-optimal
        tuples, the one minimising whichever resource is actually scarce for
        them -- memory-poor attackers slide one way along the level set,
        bandwidth-poor attackers the other -- at a cost of under one bit. The
        theory that wants this measurement is any analysis of ADVERSARY CLASSES
        with heterogeneous resource endowments: the level set's width is
        exactly the free parameter such an analysis needs, and it is a quantity
        that the scalar bit level destroys. It also bears directly on
        IDEA-20260809-228021's joint frontier, which needs a set rather than a
        point on the target-field axis.
      spawned_ids: []

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, against the
    frontier named in target_complexity.best_known.
    AS AN ATTACK: n/a -- no attack is claimed, no algorithm is proposed, and
    every frontier row dominates this record trivially because this record
    computes nothing an attacker could run.
    AS A COST MODEL FOR GF(p^12): dominated by the published exTNFS/SexTNFS
    analyses and by the published pairing key-size re-estimates on the time
    axis, since those state a constant and this record does not yet have one.
    On the MEMORY axis and the BYTES-MOVED axis, no frontier row states a value
    for the tower case that this session could find, so on those two axes the
    dominating row is UNKNOWN rather than absent -- and UNKNOWN is not null.
    AS A RE-OPTIMISATION UNDER A CHARGED OBJECTIVE: dominated for prime-field
    NFS by the recalled area-time circuit analyses; for the tower case, no
    dominating row identified, but the citation supporting that gap is
    `recalled` and therefore does not support it. NOT NULL ON ANY AXIS.
  sota_delta: >-
    QUANTITATIVE, AND HONEST ABOUT BEING A PREDICTION RATHER THAN A RESULT. No
    exponent is improved: the 1/3 does not move and no c is claimed. Predicted
    deliverable: a pair (c_time, c_memory) plus a bytes-moved term for GF(p^12)
    under >= 5 machine models, versus one scalar c and no memory statement in
    the incumbent; an argmin displacement predicted at >= 1.0 in log2 B versus
    an incumbent that does not vary the argmin at all; a re-optimisation gap
    predicted at >= 8 bits versus an incumbent gap of 0 by construction; and a
    1-bit level-set memory span predicted at >= 2^10 versus an incumbent that
    reports no span. If every prediction fails, the delta is: the published
    convention is validated for this target, stated with the numbers that
    validate it -- which this program does not currently hold either.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.35 that the zero-price control (NULL 1) reproduces the published constant
    on a first attempt -- this is the hard part and the likeliest halt.
    0.75 that, conditional on NULL 1 passing, the argmin displacement exceeds
    1.0 in log2 B. 0.5 that the re-optimisation gap exceeds 8 bits. 0.8 that
    claim C3's level-set span exceeds 2^10, which is the cheapest and most
    likely positive in the record. 0.6 that H3's micro-benchmark confirms
    bandwidth-boundedness at the tested scale.

