idea:
  id: IDEA-20260818-1fb37d
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  added: '2026-08-18'
  title: >-
    THE PUBLISHED exTNFS OPTIMUM IS THE MINIMISER OF AN OBJECTIVE THAT PRICES
    DATA MOVEMENT AT ZERO: re-solve the parameter-balancing step for GF(p^12)
    under a bounded-bandwidth / area-time objective and report the L-notation
    constant and the (operations, memory, bytes-moved) triple it produces
  class: mechanism

  claim: >-
    Every published security level for a pairing target field is the value of a
    cost function at a parameter tuple (eta, kappa, smoothness bound B, sieve
    region A, block-Wiedemann blocking width b) that was chosen to minimise an
    OPERATION COUNT in which moving a byte is free. That is a modelling choice,
    not a fact about attackers. The claim has three parts, each separately
    falsifiable:
    (C1) Under a cost objective that charges data movement -- either bounded
    aggregate bandwidth beta, or the area-time (AT) product of a two-dimensional
    mesh -- the argmin of the exTNFS cost function for GF(p^12) at the
    BLS12-381 prime is a DIFFERENT tuple from the published one, differing in
    log2(B) by at least 1.0.
    (C2) The total cost at the re-optimised tuple differs from the published
    figure by at least 8 bits in magnitude, and the SIGN is determined by which
    of two competing effects dominates: charging communication raises the
    attacker's cost above the free-communication operation count, while letting
    the attacker re-optimise under that charge lowers it back. Charged cost is
    never below the free operation count, so under a bandwidth-charged reading
    the published figure UNDERSTATES attacker cost; under a parallel-mesh AT
    reading with a fixed hardware budget the wall-clock ordering can reverse.
    Which of these the deployed label should be read as is the finding.
    (C3) The cost surface near the optimum is flat enough that a set of tuples
    within 1 bit of optimal spans a memory range of at least 2^10, so "the bit
    level" is not a well-defined scalar even after the objective is fixed.
    NOTHING HERE ASSERTS THAT ANY DEPLOYED CURVE IS BROKEN OR SAFE. The output
    admissible under this record is: "under machine model M and conventions
    C1..Cn, which this record states and varies, the target-field cost is the
    triple (ops, memory, bytes moved) = X, and the published figure corresponds
    to M = free-communication RAM and to conventions C1'..Cn'."

  mechanism: >-
    exTNFS cost is the sum of a relation-collection term and a linear-algebra
    term, and the published constants are obtained by BALANCING those two terms
    and solving for B. Relation collection is compute-bound and embarrassingly
    parallel with negligible inter-worker traffic. Linear algebra is a block
    Wiedemann Krylov iteration over Z/rZ: roughly 3N/b passes, each streaming
    the entire sparse matrix (N rows, average weight w, entries indexing a
    factor base, vector coordinates of ~log2(r) bits -- 255 bits for
    BLS12-381's subgroup order). Its arithmetic intensity is O(1) modular
    multiply-adds per byte streamed, so on any machine whose flop:byte ratio
    exceeds O(1) the step is bandwidth-bound and its operation count is not its
    cost. The two terms therefore respond DIFFERENTLY to a communication price,
    and the balance point moves. Because the price enters the two terms with
    different exponents in B, the minimiser moves and the minimum value moves
    with it.
    THE STRUCTURAL INGREDIENT, AND THE REASON THIS IS NOT ARITHMETIC POLISHING:
    for the ordinary NFS over prime fields, the same substitution -- replace the
    RAM operation count by an area-time cost on a mesh, then RE-OPTIMISE the
    parameters rather than evaluating the old parameters under the new metric --
    is reported (RECALLED, see citations) to move the L-notation constant, not
    merely a constant factor, because the mesh's sorting/routing cost is itself
    subexponential in the problem size and enters the balance with a different
    B-exponent. This record transplants that re-optimisation to the TOWER case,
    where it has, as far as this program's corpus shows, never been carried out:
    the tower adds two structural features absent from the prime-field analysis
    -- a factor base indexed by ideals of a degree-eta tower ring, and vectors
    over Z/rZ rather than GF(2) -- and both act on the bytes-per-entry constant
    that the charged objective is most sensitive to.
    The conversion into a computation is elementary: write the exTNFS cost
    function symbolically with an explicit communication term parameterised by
    (beta, mesh dimension, bytes per matrix entry, bytes per vector
    coordinate); minimise numerically over the tuple at fixed Q = p^12 for the
    BLS12-381 prime; report the argmin, the minimum, and the full cost surface.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus greps in this worktree on 2026-08-18, by MECHANISM keyword:
      'exTNFS|TNFS|SexTNFS' (53 files), 'area-time|AT cost|bisection
      bandwidth|communication cost|data movement|block Wiedemann'
      case-insensitive over ledger/ (40 hits shown), 'RQ-PAIR-f2e31f' (18
      files). Read in full: RQ-PAIR-f2e31f, GOAL-PAIR-001 references,
      IDEA-20260805-72bcb5 (first 60 lines), IDEA-20260815-bf1328 (head),
      IDEA-20260815-f4deca (head), KN-LIT-7643, KN-LIT-4634, KN-LIT-2223,
      KN-OPEN-025, and the H-CRYPTO-a928b6 asymptotic_claim block.
      Web: two searches on 2026-08-18 (exTNFS complexity constants;
      Barbulescu-Duquesne key size estimations). Primary-text fetch of
      eprint.iacr.org/2015/1027 and eprint.iacr.org/2017/334 and
      hal.science/hal-01534101 was BLOCKED by the hosts; no primary source was
      read, so every external constant below stays `recalled`.
    results: >-
      IN CORPUS AND OVERLAPPING: (a) IDEA-20260805-72bcb5 under RQ-RSA-afe33c
      tracks matrix bytes crossing the memory boundary for GNFS/RSA record
      computations -- it is an AUDIT of published record numbers, explicitly
      declares every speedup and every re-optimisation off-limits, and proposes
      no change to any parameter tuple. (b) IDEA-20260815-bf1328 under
      RQ-PAIR-21313f re-runs polynomial selection for BLS12-381/BN254 with
      memory charged as a QUANTITY; it does not re-solve the balancing equation
      nor report an L-notation constant. (c) IDEA-20260809-1a5cb2 states the
      relation matrix's dimension and weight at deployment parameters and
      reports an (operations, memory) pair at the PUBLISHED tuple -- it prices
      the incumbent optimum, it does not move it. (d) H-CRYPTO-a928b6 records
      that "all NFS communication cost" is "charged only implicitly, and only
      if the AT^2 arm can be evaluated", i.e. the program has explicitly noted
      this gap without filling it. (e) RQ-RSA-afe33c names Bernstein-Lange
      area-time batch NFS (KN-LIT-2663) for FACTORING, not for tower fields.
      NOT FOUND in corpus: any re-optimisation of exTNFS parameters under a
      communication-charged objective; any statement of a tower-case
      L-notation constant under an AT metric; any measurement of the flatness
      of the exTNFS cost surface.
    verdict: >-
      UNVERIFIED. No primary external source was read in this session, so no
      claim is made about what the literature contains -- area-time NFS
      analysis is old and well known outside this program and it is entirely
      possible that the tower case has been done and this session simply has
      not read it. What is claimed is only: this repository holds no record
      that re-solves the exTNFS balancing step under a charged objective, and
      one record (H-CRYPTO-a928b6) explicitly flags the omission. The
      reviewer's semantic screen must resolve this against the corpus index and
      against the literature before any stronger label is used.

