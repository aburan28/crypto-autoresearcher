      verified_by: 'this session read knowledge/literature/KN-LIT-3742.md title metadata only'
    - ref: 'Barbulescu, Duquesne, "Updating Key Size Estimations for Pairings", J. Cryptology 32(4):1298-1336, 2019 (ePrint 2017/334)'
      provenance: recalled
      claim: >-
        RECALLED, CORROBORATED ONLY AT SEARCH-SUMMARY LEVEL on 2026-08-18: the
