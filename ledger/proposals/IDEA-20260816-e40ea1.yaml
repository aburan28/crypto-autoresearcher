idea:
  id: IDEA-20260816-e40ea1
  question_id: RQ-MDFIVE-6870c1
  added: '2026-08-16'
  title: 'Use MD4 and MD5 as a paired control to filter candidate mechanisms: require every proposed
    explanatory quantity to be computed by one identical instrument on both primitives and to move
    in the direction and rough magnitude that the reported difference between them demands, discarding
    those that do not.'
  class: control
  claim: '(A) RQ-MDFIVE-6870c1 names MD4 as the lower control precisely because the same method family
    is reported to break through there and to stall on MD5. That makes MD4 an identifiability test
    rather than a curiosity: any quantity Q proposed as the mechanism behind the collision-preimage
    asymmetry must take different values on MD4 and MD5, and the sign of the difference must match
    the reported ordering. A Q that takes the same value on both has not identified the load-bearing
    structure, in the exact sense of the nearby-object control in KN-TECH-080 audit 4. (B) The claim
    under test is that this filter is discriminating in practice rather than vacuous: that of the
    candidate quantities this program can compute cheaply, at least one is eliminated by the filter
    and at least one survives it. The candidates are the ones defined by the other records in this
    batch, namely modification depth, chunk separation, the freedom-to-condition divergence index,
    forward-backward wavefront separation, and the padding-pinned word mask size. (C) The deliverable
    is a filter table with one row per candidate and columns for Q(MD5), Q(MD4), their difference,
    the noise floor from shape-matched nulls, and a pass or fail verdict, with every value produced
    by one instrument in one invocation so no candidate benefits from bespoke tuning. (D) EXPLICITLY
    NOT CLAIMED: that surviving the filter makes a quantity the mechanism, that failing it proves
    a quantity irrelevant to anything else, that the reported difference between MD4 and MD5 in preimage
    status is verified by this program, or anything whatsoever about either primitive''s security.
    The reported ordering is taken from RQ-MDFIVE-6870c1''s own UNVERIFIED provenance block and is
    used as an assumption of the filter, which is stated as such in the assumptions field and would
    invalidate the filter''s verdicts if it is wrong.'
  mechanism: 'The mechanism is a discipline, executed as code. STAGE 1 collects the candidate quantities
    as callable functions with a uniform signature taking a primitive specification, so that MD4 and
    MD5 enter through the same door and no candidate can be implemented twice with different care.
    STAGE 2 computes each Q on MD5 and on MD4. STAGE 3 computes the noise floor for each Q by evaluating
    it over shape-matched null families for both primitives, giving the spread that the MD5-minus-MD4
    difference must exceed to count. STAGE 4 records, for each candidate, whether the difference exceeds
    the floor and whether its sign matches the direction the reported ordering demands, with the demanded
    direction written down before the values are computed. STAGE 5 reports the table. The filter refutes
    itself if every candidate passes or every candidate fails: a filter that never discriminates is
    not a control, it is a formality, and the record states that outcome plainly rather than reporting
    a full column of passes as a success.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rl MDFIVE and grep -ril md4 over ledger/proposals/, both empty. Read RQ-MDFIVE-6870c1's
      methods block, which explicitly names MD4 as the lower control. Read docs/inventor-protocol.md
      section 3 on controls before belief and section 8 audit 4 on the nearby-object control, and
      knowledge/techniques/KN-TECH-080 as referenced there. Checked knowledge/open-problems/ listing
      for an existing identifiability open problem and found KN-OPEN-019, which is the ECDLP tracked-object
      enumeration and is not this.
    results: 'Nothing in ledger/proposals/ mentions MD4 or MD5, so no existing record implements this
      filter. The discipline itself is prescribed rather than invented here: docs/inventor-protocol.md
      section 8 audit 4 requires applying a method to the closest object where the hoped-for conclusion
      fails, and RQ-MDFIVE-6870c1''s own methods block names MD4 in exactly that role. What no record
      does is instantiate the audit as an executable table over named candidate quantities. The blacklisted
      self-audit family under RQ-INSTR-f8faa0 and the falsification-follow-through records named in
      this session''s brief audit the program''s own process; this audits candidate explanatory quantities
      against a second primitive and is a cryptanalytic control, not a process metric.'
    verdict: 'UNVERIFIED. The nearby-object control is not new and is an explicit requirement of this
      program''s own protocol; MD4 as MD5''s control is named in the anchor question itself. What
      is claimed new is only the instantiation: a single-invocation table in which several independently
      proposed quantities are computed by one instrument on both primitives against shape-matched
      noise floors, with pass and fail declared in advance. Nothing is asserted about external literature.'
  object_first_candidate:
    tracked_object: The difference vector Q(MD5) minus Q(MD4) across the declared candidate quantities,
      together with the noise floor for each component; the object followed is not any one statistic
      but the cross-primitive contrast itself.
    lossiness: 'Lossy, and deliberately so at a second level. Each component Q is already a lossy
      projection of its primitive; the contrast then discards the absolute values and keeps only differences
      and their significance, so two primitives with wildly different absolute statistics but identical
      gaps map to the same point. That is precisely what the filter wants, because the reported ordering
      is a statement about a gap and not about an absolute level. What survives propagates because
      each component is computed by a deterministic instrument on a fixed specification, so the contrast
      is a fixed number once the instruments are fixed. Honest caveat recorded in-line: MD4 and MD5
      differ in step count and multiplicity profile, so a raw difference conflates shape with structure,
      which is why every component is also reported as a within-primitive percentile against its own
      null family.'
    propagation: There is no per-step propagation here in the sense of the other records; the operation
      whose action is tracked is substitution of the primitive. Replacing MD5's specification by MD4's
      changes the step count from 64 to 48, the round count from 4 to 3, the nonlinear function set,
      the rotation constants and the schedule, and each candidate Q responds to that substitution
      by a computable amount. The tracked action is therefore the map from specification change to
      contrast vector, and it is deterministic.
    survival_score: The contrast is meaningful only for quantities defined identically on both shapes.
      Modification depth and chunk separation survive the substitution cleanly since both are defined
      for any schedule. The freedom-condition divergence index survives only if the skeleton generators
      are shape-agnostic, which is a stated risk. The wavefront separation survives fully. The padding-mask
      size survives fully, since both use Merkle-Damgard strengthening. The record states per component
      whether the contrast is well defined, and refuses the contrast where it is not rather than reporting
      a number that compares two different measurements.
  null_object_control: 'For each candidate Q, a shape-matched null family is generated for MD5''s
    shape and for MD4''s shape separately, and the identical instrument computes Q across both families
    in the same invocation. The null must show the distribution of the cross-shape difference of Q
    between random members of the two families, which is the noise floor: if MD5-minus-MD4 for a candidate
    sits inside the central 90 percent of that floor, the candidate fails the filter for lack of signal
    rather than for wrong sign. For the whole exercise to mean anything, at least one candidate must
    exceed its floor and at least one must not; a table in which every candidate is inside the floor
    says the instruments are too coarse, and a table in which every candidate is outside it says the
    shapes differ so much that the contrast reads step count rather than structure, and both outcomes
    are recorded as such.'
  discriminated_from:
  - 'Each of the individual candidate-quantity records in this batch: those propose and measure a
    single quantity on MD5. This record does not propose a quantity at all; it consumes theirs and
    tests whether any of them identifies the contrast that the anchor question actually poses.'
  - 'docs/inventor-protocol.md section 8 audit 4 in the abstract: the protocol requires a nearby-object
    control but does not name the objects, the candidates, or the noise floor. This is the instantiation
    with all three fixed and executable.'
  - 'The blacklisted program self-audit family under RQ-INSTR-f8faa0 and the falsification-follow-through
    and findings-promotion records: those measure this program''s behaviour. This measures candidate
    cryptanalytic quantities on two hash specifications and would be unchanged if the program''s process
    were different.'
  - 'A simple side-by-side comparison of MD4 and MD5 specifications: that is a description. The filter''s
    content is the noise floor and the pre-declared direction, without which a difference between
    two different functions is guaranteed and meaningless.'
  - 'KN-TECH-066''s treatment of message modification across hash functions: that note discusses the
    technique family generally and does not define a pass or fail criterion for candidate explanatory
    statistics.'
  assumptions:
  - The ordering taken from RQ-MDFIVE-6870c1's UNVERIFIED provenance block, namely that the method
    family is reported to reach further on MD4 than on MD5, is used as the filter's direction assumption;
    if that ordering is wrong the filter's sign verdicts invert and its magnitude verdicts are unaffected.
  - Candidate quantities are implemented once with a uniform interface so no candidate is advantaged
    by better engineering.
  - Shape-matched null families are the right noise floor; the alternative of comparing only within-shape
    percentiles is run as a secondary arm because the two can disagree.
  - MD4 and MD5 are close enough in construction that a contrast between them isolates structure rather
    than reading off unrelated design differences; this is the weakest assumption in the record and
    is why the step-count control exists.
  predictions:
  - metric: number of candidate quantities passing the filter, out of five
    direction: different
    minimum_effect: at least 1 and at most 4; a table of 0 or 5 falsifies the filter's discriminating
      power
  - metric: sign agreement between MD5-minus-MD4 contrast and the pre-declared direction, among candidates
      exceeding their noise floor
    direction: higher
    minimum_effect: 0.5
  - metric: fraction of contrast magnitude attributable to step count alone, estimated by the 48-step-truncated
      MD5 control
    direction: lower
    minimum_effect: 0.5
  - metric: agreement between the shape-matched-null verdict and the within-shape-percentile verdict,
      per candidate
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a numeric threshold: the two nulls answer different
      questions and this program has no prior on how often they agree, so the disagreement rate is
      reported as a first observation'
  minimal_test:
    design: 'The cheapest version needs only the candidate implementations from the other records
      in this batch plus a driver. Fix a uniform primitive-specification record carrying step count,
      schedule, rotation constants and nonlinear function selector. Instantiate it for MD5 and MD4.
      Run every candidate through it. Generate 10^4 shape-matched null specifications per shape and
      run every candidate across both. Add one crucial control: MD5 truncated to 48 steps, which shares
      MD5''s schedule prefix, rotation constants and nonlinear functions but matches MD4''s step count,
      so any contrast that the truncated MD5 reproduces is attributable to step count rather than
      to the MD4-versus-MD5 distinction. Report the table with pass or fail per row. Total compute
      is dominated by whichever candidate is most expensive, and for the schedule-statistic candidates
      it is seconds; the wavefront candidate can be run at reduced sample count for this table since
      the filter needs a sign and a magnitude band, not a precise value.'
    controls:
    - Shape-matched null families for both MD4's and MD5's shapes, evaluated by the identical instrument
      in the same invocation.
    - MD5 truncated to 48 steps, isolating step count from every other design difference.
    - MD4 extended to 64 steps by continuing its schedule pattern, the mirror-image control of the
      truncation.
    - Within-shape percentile reporting as a secondary null so a verdict driven by shape mismatch
      is visible.
    - A deliberately non-discriminating dummy candidate, such as output length in bits, which must
      fail the filter; if it passes, the filter is broken.
    required_metrics:
    - Q(MD5) and Q(MD4) for each candidate
    - the contrast Q(MD5) minus Q(MD4) per candidate
    - noise floor percentiles per candidate from shape-matched nulls
    - pass or fail verdict per candidate against the pre-declared direction
    - contrast values for the 48-step-truncated MD5 and 64-step-extended MD4 controls
    - verdict for the dummy candidate
  falsification_conditions:
  - All five candidates pass, indicating the filter has no discriminating power.
  - No candidate passes, indicating the instruments are too coarse to see any cross-primitive structure.
  - The dummy candidate passes, invalidating the filter's construction.
  - The 48-step-truncated MD5 control reproduces more than half the contrast for every passing candidate,
    showing the filter reads step count rather than structure.
  - Shape-matched-null and within-shape-percentile verdicts disagree on a majority of candidates,
    leaving the table uninterpretable without a further ruling.
  confounders:
  - Step-count difference between MD4 and MD5, which alone guarantees numeric differences and is addressed
    by the truncation and extension controls.
  - Different multiplicity profiles making raw contrasts incomparable, addressed by within-shape percentiles.
  - Uneven implementation quality across candidates, addressed by the uniform interface and by running
    all of them in one invocation.
  - The direction assumption inherited from an UNVERIFIED provenance block, which propagates directly
    into every sign verdict.
  - Post-hoc candidate selection, prevented by freezing the candidate list and each pre-declared direction
    before any value is computed.
  interpretation_limits:
  - Passing the filter is a necessary condition for a quantity to be the mechanism, never a sufficient
    one, and no record may cite a pass as support for a mechanism claim.
  - Every verdict is conditional on the UNVERIFIED ordering between MD4 and MD5 that the filter assumes.
  - The filter compares two primitives only, so a quantity that separates them for a reason peculiar
    to that pair will pass without generalising anywhere.
  target_complexity:
    time_exponent: No attack exponent is claimed. The deliverable is a pass or fail table over candidate
      statistics.
    memory_exponent: No attack memory exponent is claimed.
    best_known: The incumbent is the protocol requirement itself, docs/inventor-protocol.md section
      8 audit 4 together with RQ-MDFIVE-6870c1's naming of MD4 as the lower control, neither of which
      supplies candidates, a noise floor, or a verdict rule. There is no quantitative incumbent to
      beat, because no record in this repository currently computes any candidate quantity on both
      primitives.
    hidden_overhead: 'Almost all of this record''s cost is coordination rather than computation. Every
      candidate must be reimplemented behind a uniform interface without changing its meaning, and
      verifying that each still returns its dedicated-run value is fiddly work that produces no result
      of its own. The pre-declared directions are the second hidden term: some are genuinely unobvious,
      and the honest options are to declare a direction that may be wrong or to report magnitudes
      only, which weakens the filter. Third, the whole table inherits an UNVERIFIED ordering from
      a provenance block, so its sign verdicts carry a dependency that no amount of care inside the
      run can discharge, and later readers will be tempted to forget it.'
  dominated_by: n/a (no result claimed). Both MD5 frontier rows on record in this program, the UNVERIFIED
    2^123.4 preimage figure and the seconds-scale collision figure in RQ-MDFIVE-6870c1, were checked;
    this record produces no time, memory or query figure and therefore cannot sit on either row. Reporting
    null would be a fabrication, so the honest answer is that no Pareto axis applies.
  sota_delta: no attack; conceptual/measurement contribution only. The output is a five-row verdict
    table with noise floors, which stands in no numerical relation to any attack complexity.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Split by part. That the uniform-interface driver can be built and that
    every candidate is computable on both shapes: about 0.8, with the freedom-condition divergence
    index the most likely component to be shape-dependent and drop out. That the filter discriminates,
    meaning between one and four candidates pass: about 0.65, since a total pass or total fail would
    require the instruments to be uniformly blind or uniformly sensitive. That the passing set is
    stable when the 48-step truncation control is applied, i.e. the contrast is not just step count:
    about 0.35, and this is the part I expect to do most of the damage. That the dummy candidate fails
    as required: about 0.9.'
