idea:
  id: IDEA-20260905-cea1d6
  title: Second-moment geometry of Frobenius correspondences before rare-stratum claims
  class: mechanism
  claim: A uniform second-moment bound for the multiplicity of short primitive Frobenius correspondences can convert
    a mass estimate into a certified lower bound for the proportion of curves admitting one, without assuming that
    multiplicities are Poisson.
  mechanism: Let Z_D(E) count primitive correspondences from E to its Frobenius conjugate of degree at most D, with
    automorphism weights fixed in advance. The mass sum sees E[Z_D], whereas the successful-curve fraction sees
    Pr(Z_D>0); these differ when a few curves carry many correspondences. The proposed object is the incidence space
    of pairs of primitive correspondences sharing a curve. Decompose its diagonal, common-suborder and transverse
    strata, then try to bound E[Z_D^2] geometrically. Cauchy-Schwarz gives Pr(Z_D>0)>=E[Z_D]^2/E[Z_D^2]. The new
    uncertainty is whether common embeddings dominate that denominator. This is a probability certificate, not a
    recipe to find a correspondence from an input curve.
