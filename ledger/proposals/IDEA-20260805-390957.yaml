idea:
  id: IDEA-20260805-390957
  question_id: RQ-FRODO-3260cc
  added: '2026-08-05'
  title: >-
    Conservation laws of a thirteen-integer table: five exact identities the
    FrodoKEM sampling distribution must satisfy, all derived before the primary
    source arrives, one of which already discriminates a damaged extraction from
    a correct one
  class: control

  claim: >-
    The FrodoKEM error distribution chi is specified by a table of at most
    thirteen non-negative integers. That table is not free: it is constrained by
    exact identities that follow from the sampler's own construction and from the
    object it is claimed to approximate, and every one of those identities is
    checkable in integer arithmetic on the thirteen numbers alone, with no
    convolution, no divergence computation, and no floating point. This proposal
    asserts that such a conservation-law gate is the cheapest decisive instrument
    available to GOAL-FRODO-001 and must run FIRST, before the Renyi and
    decryption-failure pipelines are built, for two reasons that are independent
    of each other. (1) It is a TRANSCRIPTION GATE. Every figure this goal names
    came from a visibly extraction-damaged excerpt in which the row arrived as an
    undelimited run of digits; a transcription that fails the normalisation
    identity is wrong, and everything computed downstream from it is void
    regardless of how carefully it is computed. (2) It is a DOCUMENT AUDIT. The
    same identities apply to the table as printed in the specification, so a table
    that is correctly transcribed and still fails an identity is a defect in the
    document -- the exact class of error GOAL-HQC-001's BATCH-002 found when a
    printed minimum distance of 49 stood where four independent routes give 59.
    NOTHING IS CLAIMED ABOUT WHICH OUTCOME OBTAINS. No run has happened.

  object_first_candidate:
    tracked_object: >-
      The sampling table as a MEASURE WITH ITS MOMENT VECTOR, followed through the
      sampler's construction: thirteen integers (p_0, ..., p_12) -> the two-sided
      integer measure z -> p_{|z|} on {-12, ..., 12} with the zero entry counted
      once -> its total mass, its second moment, its fourth moment, its cumulative
      sequence. The object tracked is the moment vector (m_0, m_2, m_4) together
      with the monotone structure of the table, NOT the individual probabilities.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: lattice reduction and any
      estimator-based analysis (BKZ, core-SVP, primal/dual/hybrid -- that lane
      belongs to GOAL-MLKEM-003 and GOAL-MLKEM-004 and this goal's
      non_duplication block forbids it here); all implementation-side attacks
      (Fujisaki-Okamoto timing KN-LIT-2088, fault injection KN-LIT-3859,
      hint-integrated primal attacks KN-LIT-118 / KN-TECH-047, per
      RQ-FRODO-3260cc.constraints); decryption-failure ATTACKS as such
      (KN-TECH-048 -- the cost side is IDEA-20260805-f16b44's, not this one's);
      and statistical goodness-of-fit testing of the sampler's OUTPUT, which is a
      test of an implementation rather than of the document. The lens retained is
      elementary exact integer arithmetic on the printed table.
    newness_score: >-
      The identities themselves are elementary and certainly known to the
      designers -- the normalisation one is forced by the sampler's construction
      and cannot have escaped them. What is not present anywhere in this corpus,
      and what this proposal supplies, is their use as a PRE-REGISTERED
      TRANSCRIPTION AND DOCUMENT GATE ordered ahead of every expensive stage, with
      each identity's failure disposition fixed before the source is opened. The
      corpus contains four FrodoKEM literature entries (KN-LIT-118, KN-LIT-2088,
      KN-LIT-2541, KN-LIT-3859), none of which is the specification and none of
      which contains the table; the FrodoKEM specification is NOT FILED.
    testability_score: >-
      Maximal. Thirteen integers, five identities, exact arithmetic, milliseconds.
      Two of the five have already been evaluated against the damaged excerpt in
      the mechanism below and their outcomes are reported there rather than
      predicted, because pretending otherwise would be dishonest.
    survival_score: >-
      The moment vector survives the sampler's construction exactly, because the
      construction is a deterministic finite map from uniform bits to integers.
      There is no approximation anywhere in the object. Its limit is that it says
      nothing about any quantity that is not a moment or a monotonicity property:
      it cannot see a Renyi divergence and it cannot see a failure rate.

  mechanism: >-
    THE SAMPLER'S CONSTRUCTION, AND WHAT IT FORCES. RECALLED, UNVERIFIED, AND A
    READ TARGET: FrodoKEM's sampler consumes a 16-bit uniform string r, uses one
    bit as a sign and the remaining bits to index a cumulative table over the
    magnitude, and emits a signed integer of magnitude at most 12. Applying a sign
    to the magnitude 0 yields 0 for either sign bit, so the magnitude-0 cell is
    NOT split while every cell of magnitude k >= 1 is. Whatever the exact bit
    budget, this forces the two-sided measure to be

      chi(0) = p_0 / M,   chi(+k) = chi(-k) = p_k / M  for 1 <= k <= 12,

    with M the total mass, and therefore forces

      IDENTITY C1 (NORMALISATION):  p_0 + 2 * sum_{k=1}^{12} p_k  =  M  EXACTLY,
      with M a power of two and NO ROUNDING SLACK.

    C1 is an integer equality. It cannot be approximately satisfied. It is
    therefore a genuine gate rather than a diagnostic.

    C1 EVALUATED, HONESTLY LABELLED. The Frodo-640 row quoted in
    RQ-FRODO-3260cc.provenance arrived as the undelimited run
    "2.8 9288 8720 7216 5264 3384 1918 958 422 164 56 17 4 1 200 0.324e-4".
    Reading 2.8 as the Gaussian parameter, the next thirteen integers as
    p_0, ..., p_12, and the trailing pair as the Renyi order and divergence, the
    one-sided sum is 37412 and

      p_0 + 2 * sum_{k>=1} p_k  =  9288 + 2*(37412 - 9288)  =  65536  =  2^16,

    EXACTLY. THIS IS A COMPUTATION PERFORMED IN THIS RECORD, on this machine,
    outside the harness, from an extraction-damaged excerpt -- it is
    SCOUT-COMPUTED and must be re-run in-harness against primary text before it is
    cited as anything. What it establishes is narrow and worth stating precisely:
    the extraction preserved thirteen integers in the correct order, the
    convention is a denominator of 2^16 with the zero cell counted once, and the
    excerpt is therefore usable as a PROVISIONAL working table rather than as
    noise. It establishes nothing whatever about FrodoKEM's security and does not
    verify the specification, which has not been read.

    IDENTITY C2 (SECOND MOMENT AGAINST THE STATED PARAMETER). chi is claimed to
    approximate a rounded Gaussian of parameter sigma. Rounding a continuous
    Gaussian of variance sigma^2 to the nearest integer adds, to leading order,
    the variance of the rounding residual: for a density flat on the scale of one
    unit the residual is nearly uniform on [-1/2, 1/2] with variance 1/12, so

      Var(rounded Gaussian)  ~=  sigma^2 + 1/12,

    with a correction that is exponentially small in sigma^2 (the Poisson-summation
    /theta-function tail, negligible at sigma ~ 2.8 and NOT negligible without
    check at sigma ~ 1.4). The table's own variance is an exact rational,
    Var(chi) = (2/M) * sum_{k>=1} k^2 p_k. C2 asserts these agree to the precision
    the correction allows. EVALUATED ON THE SAME EXCERPT, SCOUT-COMPUTED:

      Var(chi) = 64895/8192 = 7.9217529296875   (exact rational)
      sigma^2 + 1/12 = 7.84 + 0.08333... = 7.9233333...
      difference = -1.58e-3, i.e. 2.0e-4 in relative terms.

    C2 passes at Frodo-640 on the excerpt. Its value is that it CAN fail and that
    it is sensitive to exactly the errors C1 cannot see: C1 is blind to any
    transposition of two entries, and C2 is not.

    IDENTITY C3 (SIGN AND PARITY). If the sampler splits every non-zero magnitude
    across two sign bits then the two-sided pmf of a non-zero value has numerator
    p_k over a denominator of 2M, and the arithmetic must be consistent with an
    integer table at the stated bit width. Whether p_0 must additionally satisfy a
    parity condition depends on whether the table is stated in magnitude units or
    two-sided units, and THAT IS THE POINT: C3 is the identity that DETECTS WHICH
    CONVENTION THE DOCUMENT USES, and the convention is not itself a number in the
    table. Getting it wrong scales every probability by two.

    IDENTITY C4 (MONOTONE UNIMODALITY AND STRICT CDF MONOTONICITY). A rounded
    Gaussian is strictly decreasing in |z| on its support. So p_0 > p_1 > ... >
    p_12 > 0 must hold strictly, and the cumulative sequence must be strictly
    increasing with no repeated entry. A repeated cumulative entry is not a
    rounding artefact: it makes a magnitude unreachable by the sampler, i.e. the
    realised distribution has smaller support than the tabulated one. On the
    excerpt the sequence 9288 > 8720 > ... > 4 > 1 > 0 is strictly decreasing,
    so C4 passes there too.

    IDENTITY C5 (FOURTH MOMENT / KURTOSIS, THE ONE THAT PROPAGATES). The
    decryption-noise term is a sum of PRODUCTS of two chi samples, and the tail of
    a sum of products is governed by the product's kurtosis, not by its variance.
    For independent a, b ~ chi with mean zero, Var(ab) = Var(chi)^2 and
    E[(ab)^4] = E[a^4] E[b^4], so kurt(ab) = kurt(chi)^2. SCOUT-COMPUTED on the
    excerpt: E[chi^4] = 187.95361328125 and kurt(chi) = 2.99508, hence
    kurt(ab) = 8.970. A value BELOW 3 for chi and near 9 for the product is a
    structural fact with a downstream consequence that IDEA-20260805-411b60
    consumes directly: the exact decryption failure rate MUST EXCEED the Gaussian
    tail estimate taken at the same variance, because the summands are strongly
    leptokurtic. That converts C5 from a checksum into a pre-registered
    DIRECTIONAL prediction about a quantity computed in a different experiment,
    which is the strongest form a cheap gate can take.

    WHY THIS IS A GATE AND NOT A DECORATION. Order matters. If C1 fails, no
    divergence and no failure rate computed from that table means anything, and
    the correct response is to re-read the source, not to compute harder. If C1
    passes and C2 fails, the table is internally consistent but is not the rounded
    Gaussian the document says it approximates, and the Renyi computation is then
    the interesting one rather than a formality. If everything passes, the gate has
    cost milliseconds and has licensed the expensive stages. Every branch is
    useful and the branch is decided before any budget is spent.

  novelty_status: unverified

  literature_context:
    - >-
      THE FRODOKEM SPECIFICATION IS NOT IN THIS CORPUS AND HAS NOT BEEN READ BY
      THIS PROGRAM. Checked on 2026-08-05: the four FrodoKEM-mentioning literature
      entries are KN-LIT-118 (hint-integrated primal attacks), KN-LIT-2088
      (Fujisaki-Okamoto timing), KN-LIT-2541 (anonymity of NIST Round-3 KEMs), and
      KN-LIT-3859 (fault injection on the FO equality test). Three of the four are
      declared OUT OF SCOPE by RQ-FRODO-3260cc.constraints; none contains the
      sampling table. There is no KN-LIT entry for the specification, for the
      standard proposal, or for the CFRG draft.
    - >-
      NOT READ -- RELAYED CLAIM. RQ-FRODO-3260cc.provenance names
      frodokem.org/files/FrodoKEM_standard_proposal_20250929.pdf and the 20241205
      predecessor, the CiC/eprint paper (cic.iacr.org/p/2/3/25, eprint 2025/1861),
      and draft-longa-cfrg-frodokem-02 as the documents seen in excerpt on
      2026-08-04. This proposal has read NONE of them. Every FrodoKEM figure it
      quotes traces to that excerpt and is a research target.
    - >-
      RECALLED, UNVERIFIED. The sampler's structure described in the mechanism --
      one sign bit, a cumulative magnitude table, support |z| <= 12, 16-bit table
      entries -- is recalled from general familiarity with FrodoKEM and is
      consistent with the excerpt, which is weak corroboration and not
      verification. Establishing it from primary text is Stage 0 of any experiment
      built on this proposal.
    - >-
      IN-REPO AND READ: KN-TECH-048 (decryption-failure attacks and failure
      boosting) records that for the NIST candidates assessed the required query
      count is above practical limits because of conservative parameter choices.
      It is cited here only to fix what a failure-rate discrepancy could and could
      not mean; it is not evidence about FrodoKEM's table.
    - >-
      IN-REPO AND READ: GOAL-HQC-001's precedent, cited for METHOD only per
      GOAL-FRODO-001.non_duplication -- a printed minimum distance in a
      standardisation document was found to disagree with four independent
      derivation routes (DEC-20260802-344883, D-2). That a printed number in such
      a document can be wrong is the premise this proposal operationalises. It is
      NOT evidence that any FrodoKEM number is wrong.

  lossy_projection_identifiability_audit:
    projection: >-
      Thirteen-integer table (equivalently, the full 25-point two-sided pmf) -->
      the four-number summary (total mass, second moment, fourth moment,
      monotonicity flag).
    what_is_discarded: >-
      Everything about the SHAPE of the table that is not captured by two even
      moments and an ordering predicate. Two different tables with the same mass,
      the same variance, the same fourth moment and the same monotone ordering are
      indistinguishable to this object, and such pairs certainly exist: the table
      has thirteen degrees of freedom and the projection retains three numbers and
      one bit.
    why_genuinely_lossy: >-
      The fibre over a given moment triple is a large positive-integer polytope
      slice. This is a real discard, not a re-parameterisation: the table cannot be
      reconstructed from (m_0, m_2, m_4).
    why_compatible_with_the_operations: >-
      The operations that matter downstream are (i) taking products of two
      independent samples and (ii) summing many independent copies. Both act on
      moments deterministically and multiplicatively: Var(ab) = Var(a)Var(b),
      E[(ab)^4] = E[a^4]E[b^4], and moments of sums add for the cumulants. The
      retained part therefore propagates deterministically through exactly the
      computation the goal cares about, which is the condition the lossy-projection
      test demands.
    is_it_only_a_change_of_coordinates: >-
      NO, AND THE CHECK WAS RUN IN BOTH DIRECTIONS. Against the KN-LIT-7595 failure
      (the (Delta, Pi) = (x XOR y, x*y) case, where nothing is discarded because
      the pair is recoverable as the roots of t^2 + Delta t + Pi): here thirteen
      integers are compressed to three rationals and a bit, and there is no
      inversion, so the projection is not a change of coordinates. Against the
      MIRROR failure (a projection so lossy it is constant across instances, zero
      comparator spread): the retained quantities are NOT constant across the three
      parameter sets -- sigma differs (2.8 / 2.3 / 1.4 as recalled, a read target),
      so Var(chi) differs, so the comparator has spread by construction. The
      normalisation identity C1 IS constant across instances by design, and that is
      declared here rather than hidden: C1 alone would be a control that cannot
      distinguish parameter sets, which is precisely why it is paired with C2 and
      C5, which can.

  assumptions:
    - >-
      That the sampler applies the sign AFTER selecting a magnitude, so the zero
      cell is not split. If instead the table is already two-sided, C1's
      multiplicity changes and the gate must be restated. Stage 0 reads which.
    - >-
      That the table's denominator is a power of two. If the document normalises
      differently, C1 becomes an equality against a different constant and remains
      an exact integer check.
    - >-
      That "rounded Gaussian" means rounding to the nearest integer rather than
      the discrete Gaussian proportional to exp(-z^2/2s^2). THE TWO ARE DIFFERENT
      DISTRIBUTIONS WITH DIFFERENT VARIANCES and C2's target constant differs
      between them: the discrete Gaussian's variance is NOT sigma^2 + 1/12. Which
      one the document means is a read target and a named confounder, not an
      assumption to be carried silently.

  predictions:
    - metric: >-
        C1: p_0 + 2 * sum_{k>=1} p_k, computed in exact integer arithmetic from
        the table as transcribed from primary text, per parameter set
      direction: different
      minimum_effect: >-
        EXACTLY 2^16 = 65536 (or exactly the power of two the document states),
        with zero tolerance. The value 65536 is already attained by the damaged
        excerpt at Frodo-640 (SCOUT-COMPUTED, above), so for that parameter set
        this is a REPRODUCTION target rather than an open prediction, and it is
        reported as such. For Frodo-976 and Frodo-1344 no excerpt table exists in
        RQ-FRODO-3260cc and the prediction is genuinely open.
    - metric: >-
        C2: |Var(chi) - (sigma^2 + 1/12)| / (sigma^2 + 1/12), exact rational
        against the stated sigma, per parameter set
      direction: lower
      minimum_effect: >-
        Below 5e-3 at Frodo-640. Derived, not fitted: the excerpt gives 2.0e-4,
        and the bound is set an order of magnitude above it so the check is not a
        restatement of the observation. AT FRODO-1344 THE BOUND IS DELIBERATELY
        LOOSER, 5e-2, because sigma is recalled as ~1.4 and the theta-function
        correction to sigma^2 + 1/12 is exponentially small in sigma^2 and is
        therefore NOT negligible there. Predicting a tight bound at small sigma
        would be predicting the wrong thing, and a miss there is a signal about
        the rounding model rather than about the table.
    - metric: >-
        C4: number of non-strict descents in (p_0, ..., p_12) and number of
        repeated entries in the cumulative sequence, per parameter set
      direction: lower
      minimum_effect: >-
        EXACTLY 0 for both counts. A single repeat makes a magnitude unreachable
        and changes the realised support; it is not a rounding artefact.
    - metric: >-
        C5: kurt(chi) = E[chi^4]/Var(chi)^2, and the derived kurt(product) =
        kurt(chi)^2, per parameter set
      direction: higher
      minimum_effect: >-
        kurt(product) > 3 strictly, i.e. the product of two independent chi
        samples is leptokurtic. Excerpt value 8.970 at Frodo-640
        (SCOUT-COMPUTED). The consequence carried to IDEA-20260805-411b60 is a
        DIRECTIONAL prediction: the exact decryption failure rate exceeds the
        Gaussian estimate at matched variance. If kurt(product) came out below 3
        that consequence reverses, and this metric is what decides it.
    - metric: >-
        Convention determination: which of {magnitude table with denominator M,
        two-sided table with denominator 2M} the document uses, read from primary
        text and cross-checked against C1
      direction: different
      minimum_effect: >-
        A single unambiguous answer, recorded with a page or section reference. If
        C1 holds under BOTH readings the convention is not determined by the table
        and must be read from the sampler's pseudocode; that outcome is recorded as
        an identifiability limitation of the gate, not glossed.

  minimal_test:
    design: >-
      Four stages, cheapest first, and the FIRST is not a computation.
      STAGE 0 (READING, ZERO COMPUTE, GATING). Acquire the FrodoKEM specification
      and file it as a KN-LIT entry with provenance level and extraction damage
      marked, per RQ-FRODO-3260cc.constraints[0] and GOAL-FRODO-001.next_action.
      Transcribe the table for each parameter set BY HAND from the rendered page,
      twice, independently, and diff the two transcriptions. A transcription that
      does not survive its own diff never reaches Stage 1.
      STAGE 1 (INTEGER GATE, MILLISECONDS). Evaluate C1, C3, C4 in exact integer
      arithmetic. C1 failure TERMINATES: report a transcription or document defect
      and stop; do not proceed to any downstream computation.
      STAGE 2 (EXACT RATIONAL MOMENTS, MILLISECONDS). Evaluate C2 and C5 in
      fractions.Fraction. Report Var(chi) as an exact rational, never a float.
      STAGE 3 (MUTATION CALIBRATION, SECONDS). Perturb the table and confirm each
      identity responds as derived. This is what makes Stage 1 and Stage 2 into
      controls rather than assertions.
    controls:
      - >-
        NULL OBJECT, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. A table of thirteen
        integers drawn uniformly at random subject only to summing to the right
        total under C1's multiplicity. FORCED VALUES: C1 passes by construction
        (it is imposed), C4 FAILS with probability overwhelmingly close to 1 (a
        uniform composition is monotone decreasing with probability 1/13!
        ~= 1.6e-10), and C2 fails by orders of magnitude. If the null passes C2 or
        C4, the gate is not measuring what it claims and no result from it may be
        reported. Note carefully that C1 is deliberately NOT tested by this null,
        because a null that satisfies the identity by construction cannot falsify
        it -- that is the KN-TECH-1a5b7e "control that cannot fail" pattern and it
        is named here rather than committed.
      - >-
        SECOND NULL, WHICH C1 CAN ACTUALLY FAIL. A table drawn as thirteen
        independent integers with the observed magnitudes but WITHOUT the
        normalisation constraint. FORCED VALUE: C1 fails with probability
        1 - O(1/M). This is the null that gives C1 discriminating power and it is
        separated from the first null on purpose.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Construct
        the rounded Gaussian at the stated sigma directly, to 16-bit precision, by
        an independent route (error-function evaluation, rounded and renormalised).
        C1, C2, C4 and C5 MUST ALL PASS on it. If any fails, the gate is broken and
        NO negative result about the published table may be reported at all. The
        pass threshold is declared here, before the run: C2 below 1e-3 for this
        constructed object at sigma = 2.8.
      - >-
        GRADED CONTROL, FIVE INTERIOR POINTS, MONOTONICITY REPORTED. Perturb the
        published table by moving u units of mass from the tail cell to the centre
        cell, for u in {1, 2, 4, 8, 16}. FORCED VALUE: Var(chi) decreases linearly
        in u with slope exactly 2 * 144 / M per unit (an exact rational, 288/65536
        = 9/2048 at M = 2^16), so C2's relative residual grows linearly and
        crosses its 5e-3 threshold at a computable u. Report the crossing point and
        report whether the response is monotone. A gate whose residual does not
        grow with u is not responding to the perturbation it is claimed to detect.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Search the corpus for any prior evaluation of
        these identities on any FrodoKEM table. RESULT AS OF 2026-08-05: NONE
        EXISTS -- there is no FRODO-area experiment, evidence record, or hypothesis
        in the ledger and the specification is not filed. That absence is recorded
        as an absence, not claimed as a passed check, and absence of a search
        result is not evidence that nobody has done it (AGENTS.md retrieval policy).
    required_metrics:
      - transcribed table per parameter set, with page or section reference, and the two-pass diff result
      - C1 as an exact integer, with the multiplicity convention used and where it was read
      - Var(chi) as an exact rational, and the C2 residual against the stated sigma
      - the descent and repeat counts for C4
      - kurt(chi) and the derived kurt(product), exact rational
      - null-arm and positive-control outcomes, committed BEFORE the published table is evaluated

  falsification_conditions:
    - >-
      C1 fails on a table that survived its own two-pass transcription diff, at
      any parameter set. The gate has then found either a document defect or an
      unread convention, and the proposal's premise that the table is
      transcribable is falsified for that parameter set. Either way the downstream
      pipelines do not run on that table.
    - >-
      The positive control fails: the independently constructed rounded Gaussian
      does not satisfy C2 below 1e-3. The instrument is broken; nothing negative
      may be reported.
    - >-
      The graded control's C2 residual does not grow monotonically with the
      perturbation size u. The gate is not responding to the perturbation it is
      built to detect and its passes are uninformative.
    - >-
      C2 passes on the FIRST null (uniform composition subject to C1). The moment
      check is then not discriminating and must be replaced.
    - >-
      The document turns out to specify the discrete Gaussian rather than the
      rounded Gaussian, and C2's target constant is therefore wrong as stated. The
      identity is not falsified but this proposal's statement of it is, and the
      correction is a superseding record.

  confounders:
    - >-
      EXTRACTION DAMAGE, WHICH IS THE PRIMARY ONE. The only table this proposal
      has seen is the undelimited digit run quoted in RQ-FRODO-3260cc.provenance.
      That C1 returns exactly 65536 on it is strong evidence the thirteen integers
      survived in order, and NO evidence that the excerpt matches the document.
      Stage 0 exists solely to remove this confounder and no stage may proceed on
      the excerpt.
    - >-
      CONVENTION AMBIGUITY. Magnitude table versus two-sided table, 15-bit versus
      16-bit budget, rounded Gaussian versus discrete Gaussian. Each changes a
      target constant by a factor of two or by a small additive term, and each is
      resolvable only by reading. All four are read targets and none is assumed.
    - >-
      SELF-CONFIRMATION. Two of the five identities have already been evaluated
      against the excerpt in this record and PASSED. A stage that re-evaluates them
      on a table transcribed from primary text and reports agreement is at risk of
      reporting an agreement it arranged. The mitigation is structural: the
      transcription is done twice independently and diffed before any identity is
      evaluated, and the excerpt values are NOT used to resolve a transcription
      disagreement.
    - >-
      SIGMA AT FRODO-1344. The rounding correction sigma^2 + 1/12 is asymptotic in
      sigma and the neglected term is exponentially small in sigma^2. At the
      recalled sigma ~ 1.4 it may not be neglectable, and a C2 miss there would be
      a miss of the MODEL, not of the table. The looser threshold declared in the
      predictions is the pre-registered handling of this.

  interpretation_limits:
    - >-
      SPLIT CLAIM TIER, PER RQ-FRODO-3260cc.scope.claim_tier_ceiling. The
      ARITHMETIC claim -- that an integer identity on a printed table holds or
      fails -- is reachable at CRYPTO tier here, because it is a finite exact
      computation AT the standardised parameter sets and involves no
      extrapolation. Every SECURITY reading is capped at TOY and this proposal
      makes none. A table that satisfies all five identities is not thereby a
      secure parameter choice, and a table that fails one is not thereby an attack.
    - >-
      This gate is blind to the Renyi divergence and to the decryption failure
      rate. It constrains the inputs to both and computes neither. Any citation
      that reads a passed gate as verifying either quantity has overstated it.
    - >-
      A document defect found here would be a DOCUMENTATION defect until costed
      (RQ-FRODO-3260cc.constraints), and costing it is IDEA-20260805-f16b44's job,
      not this record's.
    - >-
      Nothing here bears on LWE hardness at Frodo's dimensions. That is
      GOAL-MLKEM-003's and GOAL-MLKEM-004's lane and this goal's non_duplication
      block forbids entering it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE IS LOAD-BEARING FOR C1, C3 OR C4. Those three are exact integer
        identities forced by the sampler's construction, not distributional
        claims. This entry exists to record that the gate's decisive part is
        unconditional.
      rigorous_support: >-
        C1 follows from the sampler being a deterministic function of a uniform
        bit string of fixed length: the induced measure's masses are integers over
        a power of two summing to that power of two. C4 follows from strict
        monotonicity of the Gaussian density in |z|.
      validation_plan: >-
        Direct exact evaluation, plus the null and positive controls above. Not a
        distributional validation and not presented as one.
    - id: H2
      statement: >-
        Var(rounded Gaussian at parameter sigma) = sigma^2 + 1/12 + eps(sigma),
        with |eps(sigma)| exponentially small in sigma^2.
      rigorous_support: >-
        Poisson summation applied to the Gaussian gives the discretisation
        correction as a theta-function series whose non-constant terms carry a
        factor exp(-2 pi^2 sigma^2). RECALLED AS STANDARD AND NOT RE-DERIVED HERE;
        it is a CANDIDATE TO CHECK, and checking it is a declared stage rather than
        an authority appealed to. At sigma = 2.8 the leading neglected term is
        far below the observed 2.0e-4 residual; at sigma ~ 1.4 it is not obviously
        so, which is why the Frodo-1344 threshold is set separately.
      validation_plan: >-
        Compute Var(rounded Gaussian) directly by summation over the truncated
        support at each stated sigma in exact rational arithmetic and compare to
        sigma^2 + 1/12. This is a computation of the heuristic's own error term,
        not an appeal to it, and it costs milliseconds.

