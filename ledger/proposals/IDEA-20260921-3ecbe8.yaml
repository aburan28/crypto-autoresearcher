idea:
  id: IDEA-20260921-3ecbe8
  id_allocation_provenance: >-
    Minted by the top-level coordinator session with `python3
    tools/allocate_id.py --next idea --date 20260921` and confirmed free
    with `--check` on 2026-09-21. Authored under the idea-generator role
    contract in the coordinator session (role-runtime outage; runtime
    substitution recorded per the interchangeable-runtimes clause, see
    DEC-20260921-4d1b40).
  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    CROSS-RATIO COORDINATES ARE THE ONE NATURAL PGL_2-CLOSED FAMILY: a
    statistic v(x) = f(cross-ratio(x, a, b, c)) built from the cross-ratio
    with a FIXED anchor triple (a, b, c) lives in a family that is CLOSED
    under composition with Moebius maps (PGL_2 permutes the family by
    moving the anchors, and maps generalised circles to circles), so
    lambda-level constancy across anchor triples is a WELL-POSED
    family-stability question the census never asked -- and composing a
    MULTIPLICATIVE condition in the cross-ratio coordinate (e.g. the QR
    coset of the cross-ratio's value) with the family's PGL_2 closure
    gives the first synthetic candidate for stable-AND-structured: the
    Moebius battery on it measures whether multiplicative flatness in
    the INVARIANT coordinate survives the additive Fourier transform in
    the x-line coordinate, with a cheap toy test and a clean negative
    (family lambda NOT constant, or flat in the invariant coordinate
    too) that scopes the whole cross-ratio lane out in one run.
  class: representation
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): class R1 of
    RQ-ECDLP-623a32 (the coordinate x reparametrised through the
    cross-ratio with fixed anchors, then a set statistic in that
    coordinate), attack stage COLLISION STRUCTURE. CLAIM: for the frozen
    anchor triple and the statistic v = 1_{{chi(cross-ratio(x,a,b,c)) =
    +1}}/|A| (chi the quadratic character of the cross-ratio's value,
    the multiplicative-coset construction in the invariant coordinate),
    the pair (lambda, anchor-constancy) is measurable on toys, and the
    design question it decides is whether the census's stability-signal
    tradeoff can be broken by building the statistic INSIDE a PGL_2-
    closed coordinate system: stable by family construction, structured
    by the multiplicative condition in the invariant coordinate.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the fibre statistic of
    the cross-ratio-coordinate set under the a5757d branching operation
    -- BRANCHING class (IDEA-20260806-c5d183 trichotomy: the discard is
    not translation-compatible), R1 representation, canonical
    probability normalisation (DEC-20260921-8e8086). WHY THE FAMILY IS
    PGL_2-CLOSED: the cross-ratio is the fundamental PGL_2 invariant;
    for a fixed map M in PGL_2, cross(Mx, Ma, Mb, Mc) is a Moebius
    function of cross(x, a, b, c), and conversely every anchor triple
    arises from some M -- so {v o M} is exactly {v with permuted
    anchors}, and the census's Moebius battery on v becomes an
    ANCHOR-TRIPLE SWAP test: lambda-constancy across the family is the
    stability question, asked without composing anything. THE TENSION IT
    TESTS: the census found multiplicative cosets stable but Gauss-flat
    IN THE x-LINE COORDINATE (flat because the additive Fourier
    transform of a multiplicative coset is flat by the classical Gauss
    sum). The QR condition INSIDE the cross-ratio coordinate is a
    multiplicative condition in a Moebius coordinate of x -- its
    x-line additive Fourier transform is a sum of Kloosterman-Salié
    type, whose cancellation behaviour is genuinely different from the
    pure Gauss case (the inversion mixes additive and multiplicative
    characters), so the flat-level conclusion does NOT transfer by
    analogy: the Kloosterman-scale coefficients could concentrate. This
    is the exact seam between the census's two findings, and it is
    measurable.
  novelty_status: unverified
  citations:
    -
      ref: EV-ECDLP-81f4d4
      provenance: internal
      claim: >-
        The tradeoff being attacked: additive-structured rows are
        PGL_2-unstable; multiplicative coset rows are stable but exactly
        at the random-set level (R08 = 0.5000 by the Gauss-sum
        derivation).
      verified_by: "coordinator session, authored and reviewed the record on 2026-09-21"
    -
      ref: IDEA-20260806-c5d183
      provenance: internal
      claim: The I/II/III trichotomy of lossy tracked objects.
      verified_by: "coordinator session, cited via docs/object-frame-ideation.md read in full on 2026-09-21"
    -
      ref: DEC-20260921-8e8086
      provenance: internal
      claim: Probability normalisation canonical for successor contracts.
      verified_by: "coordinator session, authored the ruling on 2026-09-21"
    -
      ref: Kloosterman and Salié sum cancellation bounds (classical)
      provenance: recalled
      claim: >-
        The x-line additive Fourier transform of a multiplicative
        condition composed with an inversion-type Moebius coordinate is
        governed by Kloosterman/Salié-type sums, whose cancellation
        differs from the pure Gauss case. RECALLED, NOT OPENED: a
        pointer for the reviewer, not support; the idea's test does not
        depend on the exact bound, only on the difference being
        measurable.
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: F5-adjacent (a formal-lift flavour)
      only in the sense that the cross-ratio is a coordinate change; the
      tracked object and battery are the census's own. What is added is
      the PGL_2-closed coordinate system and the invariant-coordinate
      multiplicative condition.
  proof_search_map:
    bottleneck: >-
      The empty stable-and-above-random cell of the census table: no
      known statistic family is both Moebius-stable in level and
      spectrally distinct from a matched random set.
    baseline_embedding:
      parameter_slice: >-
        The census's own rows at the same primes: R08 (flat, stable) as
        the boundary object the candidate must beat; R01 (structured,
        unstable) as the failure mode it must avoid.
      reproduction_check: >-
        R08's 0.5000 and the C02 Parseval level reproduce through the
        same harness before any cross-ratio row is read.
    observation_collision:
      observable: >-
        (lambda, anchor-constancy) for the cross-ratio QR statistic: two
        cosets in the cross-ratio coordinate with the same |A| but
        different anchor triples must read the same lambda if the family
        is level-constant -- a same-lambda/different-family collision
        the report must keep visible.
      distinct_preimage_search: >-
        Log the anchor triple and the induced set's additive structure
        beside every lambda so equal readings are not collapsed.
    constructive_transforms:
      -
        transform: representation_reduction
        proposed_object: >-
          The stability question reduced from "lambda invariant under
          composition with a random Moebius map" to "lambda constant
          across anchor triples of the cross-ratio coordinate" -- the
          same family, asked without composing.
        predicted_gain: >-
          Converts a battery into a family sweep; no complexity gain
          claimed.
    quantifier_order: >-
      For the frozen statistic construction, for every anchor triple in
      the frozen sweep, the measured lambda is recorded; constancy is
      asserted only over the swept triples at the measured primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale: the cross-ratio QR family IS or IS NOT
        lambda-constant, and its level IS or IS NOT above the random-set
        level. No attack claim at any outcome; a positive reading is a
        candidate key statistic pending replication and review.
      nearby_object_control: >-
        R08 (the pure Gauss case, flat and stable) run beside every
        cross-ratio row: the candidate must differ from R08's level by
        more than 2SE to count as structured, and the difference must
        survive the anchor sweep to count as stable.
    proof_obligations:
      -
        claim: the anchor-swap equivalence to the Moebius battery
        responsibility: correctness
      -
        claim: the QR-in-cross-ratio set's transform is Kloosterman-governed
        responsibility: feasibility
      -
        claim: negative outcome scopes only the swept family and primes
        responsibility: scope
    not_applicable_reason: null
  predictions:
    -
      metric: lambda(cross-ratio QR level set) vs the random level
      direction: different
      minimum_effect: >-
        Above 0.5 by more than 2SE would be the first structured member
        of a PGL_2-closed family; at 0.5 within 2SE extends the flat
        finding through the invariant coordinate.
    -
      metric: anchor-constancy (lambda spread across anchor triples)
      direction: lower
      minimum_effect: >-
        Spread within 2SE across at least 5 anchor triples for the
        stability claim; a spread beyond 2SE makes the family
        level-varying and the candidate void.
  minimal_test:
    design: >-
      Census-harness extension: at least 6 primes 2^12..2^20, the
      cross-ratio QR row at a frozen default anchor triple, an
      anchor-sweep of at least 5 triples (frozen hash stream), the R08
      and C02 controls beside every reading, the census checker battery.
    controls:
      - R08 boundary object (flat, stable) at matched primes
      - C02A Parseval level and C01 exact zero
      - same-size random-set control in the cross-ratio coordinate
    required_metrics:
      - lambda with SE per anchor triple; the spread statistic
      - the level-vs-R08 difference with 2SE test
  falsification_conditions:
    - >-
      All triples read flat (within 2SE of R08/C02): the Gauss-flat
      finding extends through the invariant coordinate; the cross-ratio
      lane is scoped out for set statistics and the negative names the
      Kloosterman-cancellation reading as the obstruction.
    - >-
      Anchor spread beyond 2SE: the family is not level-constant; the
      stability-by-construction premise fails and the idea is withdrawn
      in a superseding record.
    - >-
      Control failure voids the run (infrastructure, never evidence).
  confounders:
    - >-
      the cross-ratio is undefined at the anchors themselves (four
      points): pole handling must be frozen and recorded as in the
      census's C03 battery
    - the anchor sweep's triples are not a uniform sample of PGL_2; the
      constancy claim is scoped to the sweep
    - >-
      The size |A| varies across triples; match sizes as the census does
  interpretation_limits:
    - >-
      Toy scale; no attack claim; positive readings are candidates
      pending replication, the owed review, and a construction-step
      design with all costs charged.
    - >-
      KN-OPEN-020 CLASS, DECLARED: not a factor-base proposal;
      collision-structure keying only.
  heuristic_assumptions:
    -
      id: H1
      statement: >-
        LADDER EXTRAPOLATION (census HEUR-1 verbatim).
      rigorous_support: the census's validated two-ladder/jackknife guards.
      validation_plan: the harness's existing checks, verbatim.
    -
      id: H2
      statement: >-
        ANCHOR-SWEEP REPRESENTATIVITY: the swept anchor triples
        represent the family's lambda spread (no adversarial triple
        selection).
      rigorous_support: >-
        The triples are drawn from the frozen hash stream BEFORE any
        lambda is read -- the census's pre-registration discipline; the
        sweep is small and the claim is scoped to it.
      validation_plan: >-
        Report the spread with the sweep's members listed; a successor
        widens the sweep under an amendment if the reading is live.
  target_complexity:
    time_exponent: O~(p) per cell, census harness. No attack exponent.
    memory_exponent: O(p) words per prime, within cap.
    best_known: the random-set level 0.5 as the comparison.
    hidden_overhead: none beyond the harness's.
    tradeoff_note: flat parallelism.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
