# IDEA-20261004-61cd24
# Class-number count for discriminants -1612 and -1627. Proposal only. Not approved.
idea:
  id: IDEA-20261004-61cd24
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -1612 is 8 and of discriminant -1627 is 7
  class: measurement
  claim: >-
    Discriminant -1612 has 8 reduced binary quadratic forms.
    Discriminant -1627 has 7. Eight exceeds seven by 1. The product of
    the two class numbers is 56. Their sum is 15. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -1612 has the forms with coefficients 1, 0, 403 and
    2, 2, 202 and 4, -2, 101 and 4, 2, 101 and 11, -4, 37 and 11, 4, 37
    and 13, 0, 31 and 22, 18, 22. Discriminant -1627 has the forms with
    coefficients 1, 1, 407 and 7, -5, 59 and 7, 5, 59 and 11, -1, 37 and
    11, 1, 37 and 19, -11, 23 and 19, 11, 23. Two copies of class number
    7 have gap 0. No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks which j-invariant distinctions change an
        attack cost.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
