      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 1.
    baseline_embedding:
      parameter_slice: Discriminants -1612 and -1627 and class numbers 8 and 7.
      reproduction_check: >-
        Two readers must agree that -1612 has 8 reduced forms and that
