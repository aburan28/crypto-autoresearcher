idea:
  id: IDEA-20260724-002
  question_id: RQ-MLKEM-002
  title: Library-facing adequacy probe and widened optimized-compare second peer for the ML-KEM
    isolation question
  class: measurement
  claim: After EXP-MLKEM-004 restored KN-TECH-054 precedence reachability but left isolation
    untested (second_impl_unavailable) and answered instrument adequacy only as a harness
    tautology (EV-MLKEM-007, DEC-20260724-015), the isolation-versus-systemic question becomes
    askable if (1) the baseline-invisible adequacy control is a library-facing interposed
    defective comparator (or independently injected defective comparator object) whose G1-silent
    / G2-or-G3-visible property is observed through the library call path without generator
    special-casing of len(diffs)==1, and (2) either a concrete fixed-bound hand-written comparison
    target is preflight-pinned, or the mechanism criterion is explicitly widened with recorded
    rationale so a real optimized-compare peer is measured rather than predetermined unavailable.
  mechanism: Red-team RT-20260724-003 established that CTRL-SYNTHETIC-BASELINE-INVISIBLE answers
    KN-TECH-054 for precedence while restating it for library-facing power. Routing mutations
    through a library entry that calls an externally interposed defective compare object makes
    marginal detection a property of that call path. Separately, EV-MLKEM-007 emptied the
    preferred public fixed-bound-tail neighborhood; widening to the nearest reachable optimized-compare
    neighborhood (vectorized / block-stepped CT verify, including length-parameterized SIMD
    verify) asks isolation of a real peer while recording that a null under the widened criterion
    does not license isolation under the strict fixed-bound-tail mechanism class.
  novelty_status: adaptation
  novelty_screen: Direct successor of IDEA-20260724-001 / EXP-MLKEM-004 under DEC-20260724-015;
    not a cryptanalytic mechanism. Distinct by replacing the harness tautology and by authorizing
    an explicit criterion widening after evidenced empty fixed-bound neighborhood.
  predicted_effect: Either a library-facing adequacy probe is G1-silent and G2-or-G3-detected
    and a pinned second peer is measured, yielding a licensed isolation or systemic class,
    or an honest instrument-failure / infrastructure class fires without claiming isolation.
  cheapest_decisive_test: One four-run laboratory experiment extending EXP-MLKEM-004 with
    the library-facing probe and preflight-or-widen second-peer rule against wolfSSL pre/post-fix
    and one pinned optimized-compare peer.
  risks:
  - Interposition cannot be attested as actually on the library compare path.
  - Widened criterion is paraphrased as answering the strict fixed-bound question.
  - No buildable peer even under the widened criterion within budget.
  status: selected
  selected_by: coordinator
  created_at: '2026-07-24'
  updated_at: '2026-07-24'
  schema_repair_note: 'Committed under a `proposal:` top-level key with `statement:` instead
    of `claim:`, so it never parsed as an idea record and no field rule applied to it. Repaired
    2026-08-02 under CORR-20260802-009: key renamed to `idea:`, `statement` renamed to `claim`
    (no idea record carries both), `class` set from the proposal''s own description, and `novelty_status`
    set to the label its existing novelty_screen text already argues for. No claim, prediction,
    test or risk is changed.'
