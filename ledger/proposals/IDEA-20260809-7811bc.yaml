idea:
  id: IDEA-20260809-7811bc
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: No committed number in this program has ever been checked across two environments, although
    a matched cross-platform run set is already paid for and committed, and the one corpus entry
    establishing that the environment changes which code paths exist is cited by nothing
  class: control
  claim: 'KN-TECH-797223 (added 2026-08-04, confidence: verified_by_execution) records that the
    Sage/fpylll/G6K recipe of KN-TECH-14efa5 failed in four NEW places on a different container,
    that the original two recorded fixes were not the binding constraints there, and states the
    lesson explicitly: ''a successful route is also informative about one container and nothing
    else.'' Its measured causes include an interpreter patch-version difference and a setuptools
    version that removed pkg_resources -- differences that change which sieve kernels are importable
    at all. Every run manifest records an environment block. Yet NOTHING HAS EVER COMPARED A NUMBER
    ACROSS ENVIRONMENTS. I re-censused all 2,174 manifests by (python_version, operating_system):
    209 experiments have runs and only FIVE span more than one signature, of which EXP-IT-001
    and EXP-LPF-001 are missing-field artifacts rather than different machines. The genuinely
    clean cases are EXP-SEMAEV-001 -- runs on Linux-6.18.5/Python 3.11.15, macOS-15.6-arm64/Python
    3.12.13 AND macOS-26.6/Python 3.13.1 -- and EXP-SSIQ-a85692 (Linux-6.18.5-fc-v18/GCC 13.3.0
    versus macOS-26.6/Clang 15). That is a free, already-paid-for matched cross-platform comparison
    sitting in committed artifacts. EV-SEMAEV-001 cites the relevant runs, reports ''gb wall time
    0.157-0.173s, flat across 8-12 bits'', lists two unresolved_confounds -- both mathematical
    -- and NEVER MENTIONS that its runs came from three different platforms. KN-TECH-797223 is
    cited by zero ledger, experiment or knowledge records.'
  mechanism: 'ZERO-MARGINAL-COMPUTE FIRST STEP, entirely over committed artifacts: partition EXP-SEMAEV-001''s
    32 runs by platform and test whether the Linux and macOS arms of each identical (bits, seed-family)
    cell agree on the metrics EV-SEMAEV-001 actually reports -- the reduced-Groebner max-degree
    proxy, which SHOULD be platform-invariant so that a disagreement is a bug and not noise, and
    wall time, which is expected to differ, which is precisely why a timing-derived claim must
    not be pooled across platforms. Repeat for EXP-SSIQ-a85692''s macOS run against its Linux
    runs. Then the general instrument: an environment-partition field on evidence records, so
    a record pooling runs from N platforms must say so. PREDICTED RESULT AND THE HONEST REASON
    TO RUN IT: the degree proxy agrees and the timings do not, which would establish that the
    program''s STRUCTURAL claims are platform-robust and that its COST claims carry an uncontrolled
    between-platform term nobody has bounded -- and cost claims are what the program exports.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'KN-TECH-797223 is explicit that it ''is infrastructure, not a research finding'' and its
      concrete discipline items are all forward-looking install advice; it never asks whether
      any ALREADY-COMMITTED measurement is environment-dependent, and its lesson has produced
      no successor task. KN-OPEN-3f7a21 concerns the LITERATURE corpus''s provenance (7,457 entries
      marked read against an absent downloads tree) -- a different corpus and a different failure.
      IDEA-20260807-f73d98 is network reachability of external sources, not the execution environment
      of committed runs. IDEA-20260805-78d9bd is a measured environment audit that unblocks a
      specific infrastructure blocker, not a check on committed numbers. Nothing among 459 proposals
      or 271 hypotheses frames environment-dependence of a measured quantity (verified by title
      scan: three hits, all unrelated).'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any cryptographic claim. The object is a COMMITTED
      NUMBER''S PLATFORM DEPENDENCE.'
    tracked_object: Per metric, whether the Linux and macOS arms of an identical (bits, seed-family)
      cell agree.
    one_step_propagation_rule: A platform-invariant metric must agree exactly; a platform-dependent
      one need not. The partition is decided per metric in advance.
    newness_score: Nil as engineering. The content is that a matched cross-platform run set is
      already paid for and committed, and no committed number in this program has ever been checked
      across environments.
  lossy_projection_identifiability_audit:
    projection: the run set -> per-metric cross-platform agreement verdicts.
    what_is_discarded: Everything but the metric values.
    is_it_only_a_change_of_coordinates: 'NO -- the verdicts do not exist today. Honest caveat:
      this produces agreement bits, not knowledge, and a disagreement in a wall-time metric is
      expected and uninteresting.'
    mirror_failure_check: CHECKED. The design pre-declares which metrics MUST agree (the reduced-Groebner
      max-degree proxy, which is platform-invariant so a disagreement is a bug) and which need
      not (wall time), so the check has both a forced-agree and a free-to-differ class.
  null_object_control:
    primary_null: 'WALL TIME IS THE FREE-TO-DIFFER CONTROL: it is expected to differ across platforms,
      and if it does NOT differ the arms are probably not genuinely distinct environments and
      the whole comparison is void.'
    secondary_nulls:
    - 'The reduced-Groebner max-degree proxy is the forced-agree control: any disagreement is
      a bug, not noise.'
    - Pre-declare the metric partition before looking at the data.
  assumptions: []
  predictions:
  - metric: platform-invariant metrics disagreeing across arms of an identical cell
    direction: different
    minimum_effect: Any disagreement in a forced-agree metric is a defect in a committed number.
  minimal_test:
    design: Partition EXP-SEMAEV-001's 32 runs by platform; for each identical (bits, seed-family)
      cell, compare the metrics EV-SEMAEV-001 reports; pre-declare the invariant/variant partition
      first.
    controls:
    - wall-time free-to-differ control
    - max-degree forced-agree control
    - pre-declared metric partition
    required_metrics:
    - per-metric per-cell agreement verdict
    - magnitude of any disagreement
    - list of committed numbers affected
  falsification_conditions:
  - 'Every forced-agree metric agrees: the committed numbers are platform-robust, which is a reassuring
    first-of-its-kind statement.'
  - 'Wall time does not differ across arms: the arms are not genuinely distinct environments and
    the comparison is void.'
  - 'The runs cannot be partitioned by platform from committed metadata: the free cross-platform
    data is not actually usable and that is the finding.'
  confounders:
  - Seed families must match exactly or the comparison is between different computations.
  - Library versions differ across platforms and are a confound distinct from the platform itself;
    record both.
  - A single experiment's robustness does not generalise to the corpus.
  interpretation_limits:
  - Engineering robustness, not mathematics.
  - A clean result licenses no claim beyond the metrics and the one experiment tested.
  heuristic_assumptions:
  - id: HEUR-XENV-1
    statement: EXP-SEMAEV-001's cross-platform arms are representative of the corpus's numerical
      robustness generally.
    rigorous_support: None -- one experiment.
    validation_plan: State the scope as one experiment and treat any generalisation as unwarranted.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a -- no attack
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no attack claimed)
  sota_delta: ZERO on every attack axis; no attack is proposed. The program calls itself reproducible
    and has 2,174 immutable manifests to back it, but reproducibility has only ever been asserted,
    never tested, and the one entry that could have prompted the test is cited by nothing. A negative
    result (agreement) is worth as much as a positive one and costs one script over data already
    committed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.9 that the partition is possible from committed metadata. 0.85 that
    the forced-agree metrics agree, which is the expected and reassuring outcome. 0.15 that a
    disagreement surfaces, which would be a defect in a committed number and would matter well
    beyond this experiment.
