idea:
  id: IDEA-20260807-f8a045
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    Charge the j=0 / j=1728 automorphism gain in the RELATION SYSTEM exactly:
    one successful decomposition on a mu_k-stable factor base yields |Aut|/2
    relations and permits a factor-base quotient with |Aut|/2 fewer columns, so
    the index-calculus gain is at most 3 on collection and 9 on linear algebra
    for j=0 (2 and 4 for j=1728) - LINEAR in |Aut|, not sqrt, and still a
    constant; measure whether the mu_k-orbit constraint charges a decomposition-
    probability penalty that cancels it
  class: measurement

  claim: >-
    (A) THE ACCOUNTING, DERIVED. Let E/F_p be ordinary with j=0 (p congruent to
    1 mod 3, Aut(E) cyclic of order 6, generated by (x,y) -> (zeta_3 x, -y)) or
    j=1728 (p congruent to 1 mod 4, Aut of order 4, generated by (x,y) ->
    (-x, i y)). Write A = Aut(E) and note that negation is already inside A and
    is ALREADY EXPLOITED by every standard factor base, which is indexed by
    x-coordinates and therefore identifies P with -P. The EXTRA structure at
    special j is therefore A/{+-1}, of order 3 for j=0 and 2 for j=1728 - not
    6 and 4.
    Let phi generate A/{+-1} and let the factor base F be a union of phi-orbits.
    If R = sum of e_i P_i with P_i in F is a decomposition, then phi(R) =
    sum of e_i phi(P_i) is a decomposition over the SAME F. With R = [a]P + [b]Q
    and phi acting on the prime-order G as multiplication by lambda, the induced
    relations have right-hand sides (a,b), (lambda a, lambda b), ...,
    (lambda^{r-1} a, lambda^{r-1} b) where r = |A/{+-1}|.
    CONSEQUENCE 1 (collection): ONE successful decomposition search yields r
    relations instead of 1.
    CONSEQUENCE 2 (linear algebra): on the quotient factor base F/phi, the
    logarithm of every orbit member is determined by one orbit representative
    (log(phi P) = lambda log P), so the number of unknowns falls from B to B/r
    and the dense-solve cost falls from Theta(B^2) to Theta(B^2/r^2).
    CONSEQUENCE 3 (the free trivial relation, and it is a limit not a gain):
    for j=0, lambda^2 + lambda + 1 = 0 mod N, so the SUM of the three relations
    from one solve has right-hand side (1 + lambda + lambda^2)(a,b) = (0,0). One
    of every three rows produced is a relation among factor-base logarithms with
    zero right-hand side. Such rows are usable but they are not three independent
    (a,b)-directions, so the effective gain on the collection side is bounded by
    r and is not larger.
    NET: at most 3x on collection and 9x on linear algebra for j=0; 2x and 4x
    for j=1728. All constants. [derived in this record; the r-fold relation yield
    and the B/r column count are the quantities the experiment measures.]

    (B) THIS IS A DIFFERENT CONSTANT FROM KN-TECH-018's sqrt(|Aut|), AND THE
    DIFFERENCE IS THE POINT. KN-TECH-018 records the rho gain, which is
    sqrt(|Aut|) because rho's cost is a birthday cost on a set shrunk by |Aut|.
    Index calculus is not a birthday algorithm; its two stages scale linearly and
    quadratically in the factor-base size, so the same quotient buys |Aut|/2 and
    (|Aut|/2)^2 respectively. The lane must not quote sqrt(6) as the ceiling for
    the index-calculus side. IT IS STILL A CONSTANT AND STILL NEVER AN EXPONENT,
    and it is bounded by 9 for j=0 and 4 for j=1728 in this program's cost model.
    THIS PROPOSAL CLAIMS NOTHING BEYOND A CONSTANT and is filed as baseline
    calibration, not as an attack. It also cannot produce an attack, because
    prime-field index calculus is not competitive with rho in the first place
    (KN-TECH-001, KN-TECH-006).

    (C) THE QUANTITY THAT COULD CANCEL IT, AND WHY IT IS NOT OBVIOUS. The gain
    above assumes the decomposition probability of a random target over a
    mu_r-stable factor base of size B equals that over a random factor base of
    size B. That is plausible - the base still covers B x-coordinates - but it is
    NOT proved, and this program has an unresolved measurement in exactly this
    place: H-STR-002 posited a "relation-density penalty" and was moved to
    `weakened` (DEC-20260727-009) on artifact and cost-path grounds, with its
    transition record stating explicitly that the mechanism was not shown false
    and that no arm of EXP-STR-003 tested the C_3-equivariance of the closed
    system. The density ratio
      D = Pr[random target decomposes over a random F of size B]
          / Pr[random target decomposes over a mu_r-stable F of size B]
    is therefore an OPEN NUMBER in this repository, and it is the number that
    decides whether the derived factor r survives.

    (D) THE THREE OUTCOMES, FIXED IN ADVANCE.
      O1 D = 1 within noise and the measured relations-per-solve equals r
        exactly. The derivation in (A) is confirmed; the j=0 index-calculus gain
        is exactly 3 on collection and 9 on dense linear algebra, and L3 records
        that as its calibrated constant. Predicted.
      O2 D > 1 materially (say D >= 1.5). The mu_r-stable factor base is a WORSE
        factor base, the constant is eaten, and the correct statement is that
        special j confers no index-calculus advantage after charging. This would
        be a clean negative with a measured mechanism.
      O3 relations-per-solve exceeds r, or D < 1 materially. Either the
        instrument is double-counting shifted rows (the exact failure mode
        recorded against EXP-STR-002's appended rows in DEC-20260727-009's
        finding R2) or something real is happening. Audit before reporting.

  resource_label: >-
    R1 and R2 primarily (x-coordinates as field elements, and the equation that
    relates them), with R3 entering only as the source of the eigenvalue lambda.
    The relation-yield gain is a property of the polynomial system and the factor
    base, not of the group action on G.

  admissibility: admissible
  admissibility_argument: >-
    The tested object is the number of usable ROWS of a relation matrix per
    Groebner solve and the decomposition probability of a target over a
    structured factor base. Both are properties of the field-element factor base
    and the equation (R1/R2 in DECOMPOSITION.md section 2), which the generic
    group oracle does not return. H-ENDO-001 forbids expecting NEW CONGRUENCES
    from phi acting on G, and this proposal expects none: the r right-hand sides
    (lambda^i a, lambda^i b) all lie on one line in (Z/N)^2, exactly as
    H-ENDO-001's index-pinning argument requires, and claim (A) CONSEQUENCE 3
    states that limitation rather than hiding it. What is gained is bookkeeping -
    r rows for the price of one solve - which is a cost-model fact about the
    relation stage, not a new algebraic constraint on k. KN-FIND-b7e091's GGM
    closure is untouched because no oracle is invented here.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009) and its experiment EXP-STR-002 /
      EXP-STR-003. Those measured the DISPLACEMENT RANK alpha of the relation
      matrix under a phi-shift operator and a structured-solve cost model
      alpha^2 B log B. This proposal measures NEITHER. It measures (i)
      relations-per-successful-solve and (ii) the density ratio D, on a
      QUOTIENTED factor base with B/r columns rather than a B-column
      block-circulant one, and it uses the ordinary dense/Wiedemann cost model
      rather than a displacement-rank one. It does not re-assert H-STR-002 and
      its outcome cannot restore or further weaken it. The open replication
      obligation DEFER-BATCH009-001 belongs to H-STR-002 and is not discharged
      here.
    - >-
      IDEA-20260726-002, which proposed the phi-invariant factor base as a
      displacement-rank device. Same curve family, different measured quantity.
    - >-
      IDEA-20260807-477e40 (this batch): support and degree of the polynomial.
      This proposal takes the polynomial as given and counts rows.
    - >-
      IDEA-20260807-d329e2 (this batch): the SAME quotient realised at the
      polynomial level by changing coordinate to w = y^2, where it appears as a
      degree increase rather than as a row count. The two are two views of one
      constant and must agree; disagreement between them is an instrument
      failure and is a declared cross-check here.
    - >-
      KN-TECH-018, which is the rho-side sqrt(|Aut|) constant. This is the
      index-calculus-side constant and they are different numbers, as (B) states.

  object_first_candidate:
    tracked_object: >-
      THE ORBIT-INDEXED RELATION ROW: a relation recorded not as a vector over
      B factor-base x-coordinates but as a vector over B/r phi-ORBITS with
      coefficients in Z[lambda]/N.
    lossiness: >-
      LOSSY. The orbit-indexed row forgets WHICH member of each orbit occurred
      in the decomposition; it retains only the orbit and the accumulated power
      of lambda. Knowing the row does not let you reconstruct the summands.
    propagation: >-
      Compatible with exactly the two operations the relation stage uses:
      (i) applying phi to a whole relation, which shifts the row within its
      orbit coordinates and multiplies the right-hand side by lambda - a
      deterministic map on the projected object; and (ii) row reduction over
      Z/N, which is linear and hence descends. It is NOT compatible with the
      group law on individual points: the orbit of P+Q is not determined by the
      orbits of P and Q (see IDEA-20260807-f00729, which makes exactly that
      failure the lane's central obstruction). That is why this object buys a
      bookkeeping constant and cannot buy more.
    survival_score: >-
      Survives arity change and factor-base size change. Dies immediately if the
      factor base is not phi-stable (the projection stops being well defined),
      and dies at any attempt to use it inside a walk or a decomposition search
      rather than in the relation ledger.

  mechanism: >-
    STEP 1 (implementation, medium). Extend the existing j=0 driver
    harness/endomorphism_la.py so that it (a) builds a factor base as a union of
    exact phi-orbits and RECORDS THE ORBIT PARTITION, (b) collects relations by
    genuine decomposition search only, and (c) derives the r-1 shifted rows
    ANALYTICALLY from each found decomposition rather than by re-searching -
    while marking derived rows as derived. The current committed driver appends
    shifted rows into the same list it later measures, which is precisely the
    accounting the H-STR-002 weakening flagged (DEC-20260727-009 finding R2:
    "with the appended rows removed"); derived rows must be counted once as a
    yield multiplier and never as independent search successes.
    Also: the committed driver raises IndexError when B mod 3 != 0
    (harness/endomorphism_la.py main(), noted in DEC-20260727-009), so B is
    constrained to multiples of r or the code path is fixed before any run.

    STEP 2 (the yield measurement). For each (p, seed, arity m, B): count
    SOLVES (distinct decomposition searches that succeeded) and count USABLE
    ROWS (rank of the resulting matrix over F_N, not the number of rows
    appended). Report yield = usable_rows / solves. Predicted r for a phi-stable
    base and 1 for a random base. Rank, not row count, is what makes
    CONSEQUENCE 3 visible: if the three rows from one j=0 solve contribute rank
    3, CONSEQUENCE 3 is wrong; if they contribute rank 3 but only one
    independent (a,b) direction, the report must say both numbers.

    STEP 3 (the density measurement, and it is the decisive one). On the SAME
    curve, same p, same target stream and same B, compare decomposition
    probability over (i) a phi-stable factor base and (ii) a uniformly random
    factor base of the same size. Estimate D with a binomial confidence
    interval over at least 200 targets per cell. This is the size-matched
    comparison DECOMPOSITION.md section 4 (L4) calls "the only comparison that
    isolates equivariance from factor-base size".

    STEP 4 (the quotient solve). Build the B/r-column orbit-indexed matrix over
    Z[lambda]/N, solve it, and CERTIFY the recovered logarithms independently by
    recomputing the point (docs/claims-and-verification.md; harness/toycurve.py
    is the independent verifier). Report the fully charged cost of the whole
    pipeline against matched rho and matched BSGS on the identical instance in
    the same operation unit (one elliptic-curve point addition or doubling).

    STEP 5 (the withheld-endomorphism arm - the matched null). Rerun the entire
    pipeline on the SAME j=0 curve with phi withheld from the algorithm: random
    factor base, no shifted rows, no quotient. Any difference between Step 4 and
    Step 5 is attributable to knowing phi; any difference between Step 5 and a
    generic-j curve at matched p is attributable to being a j=0 curve without
    using it, which should be ZERO and is the artifact detector.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) grep -ril "glv" ledger/ -> 25 files
      (2) read ledger/hypotheses/H-STR-002.yaml in full, including the
          DEC-20260727-009 weakening rationale
      (3) read harness/endomorphism_la.py in full
      (4) read knowledge/techniques/KN-TECH-018.md in full
      (5) grep -ril "phi-invariant\|phi-stable\|orbit factor base" ledger/ knowledge/
    results: >-
      The phi-invariant factor base is well travelled in this repository:
      IDEA-20260726-002 proposed it, H-STR-002 formalised it, EXP-STR-002 ran
      it, DEC-20260726-006 supported it and DEC-20260727-009 weakened it. What
      is ABSENT from every one of those records is the pair of numbers this
      proposal measures: relations-per-solve as a RANK, and the density ratio D
      against a size-matched random base on the same curve. H-STR-002's
      prediction list names "phi_orbit_relation_density_vs_random" but
      DEC-20260727-009 records that the one-variable ablation "the ablation this
      hypothesis's own experiment declared and never implemented" was not run,
      and that no linear system was ever assembled. KN-TECH-018 records only the
      sqrt(|Aut|) rho constant and contains no index-calculus accounting.
    verdict: >-
      ADAPTATION, with a duplicate-adjacent surface that is declared rather than
      hidden. The mu_k-orbit factor base is not new to this program; the
      accounting in claim (A), the rank-based yield metric, the density ratio D,
      and the explicit separation of the index-calculus constant (linear in
      |Aut|) from the rho constant (sqrt) are what is added. If the Coordinator
      judges this too close to H-STR-002's open replication obligation
      DEFER-BATCH009-001, the correct disposition is to merge it into that
      replication rather than to run it twice.

  null_object_control: >-
    MANDATORY AND BLOCKING, THREE MATCHED NULLS.
    N1 SIZE-MATCHED RANDOM FACTOR BASE on the same curve, same p, same targets.
      This is the only comparison that isolates equivariance from base size.
    N2 WITHHELD-ENDOMORPHISM ARM: the same j=0 curve run without phi (Step 5).
      Predicted to be indistinguishable from a generic-j curve at matched p.
    N3 RANDOM-PERMUTATION ORBIT PARTITION: a factor base partitioned into
      arbitrary blocks of size r that are NOT phi-orbits, quotiented the same
      way. The quotient must FAIL to produce consistent logarithms here. An
      instrument that reports a gain on a fake partition is measuring the
      bookkeeping and not the automorphism.
    DECAY PARAMETER: the factor-base size B. The derived gain is a CONSTANT r
    independent of B. A measured yield that GROWS with B is the canonical
    artifact tell (docs/inventor-protocol.md section 3) and indicates derived
    rows being recounted as searches - the exact failure DEC-20260727-009
    recorded. A measured yield that decays toward 1 as B grows means the orbit
    structure is being destroyed by collisions and must be explained.

  assumptions:
    - >-
      p congruent to 1 mod 3 (j=0) or 1 mod 4 (j=1728) so that the extra
      automorphism is F_p-rational, and the curve is ordinary (verified by point
      counting).
    - >-
      lambda is publicly computable without solving a discrete logarithm: for
      D_0 = -3 as a root of L^2 + L + 1 = 0 mod N, for D_0 = -4 as a root of
      L^2 + 1 = 0 mod N (H-ENDO-001 assumption list). Any phi whose eigenvalue
      required a DLP would make the whole exercise circular and is excluded.
    - >-
      The factor base is a union of EXACT phi-orbits of full length r. Orbits of
      shorter length (x = 0 on a j=0 curve is fixed by phi) are excluded and
      counted separately.
    - >-
      Toy scale, p up to about 2^24, pure Python, arity m in {2,3}. Every
      recovered logarithm is certified independently by harness/toycurve.py.
    - >-
      Costs are counted in one elliptic-curve point addition or doubling, the
      same unit as the matched rho and BSGS controls. Step counts in different
      units are not admissible as a comparison.

  proof_search_map:
    not_applicable_reason: >-
      Predominantly empirical: the deliverables are two measured numbers (yield
      and D) and a fully charged cost comparison. The one derived quantity - the
      r-fold relation yield with its zero-sum third row - is elementary
      (1 + lambda + lambda^2 = 0 mod N for D_0 = -3) and is verified
      symbolically in Step 2 as a pre-registered prediction rather than carried
      as a proof obligation. No theorem, asymptotic bound, certificate family,
      reduction or closure argument is proposed, so the section-8 audits have no
      object. If outcome O3 fires, a proof_search_map becomes mandatory before
      any follow-up and this record does not pre-authorise one.

  predictions:
    - metric: usable relation rank per successful decomposition search, j=0, phi-stable base
      direction: higher
      minimum_effect: >-
        Predicted exactly 3 (and 2 for j=1728), against exactly 1 on a
        size-matched random base. A value below 2.5 on j=0 means the derived
        rows are not usable and the accounting in (A) is wrong.
    - metric: >-
        number of independent (a,b) right-hand-side directions contributed per
        solve, j=0
      direction: different
      minimum_effect: >-
        Predicted exactly 1 (CONSEQUENCE 3). A measured 3 refutes
        1 + lambda + lambda^2 = 0 mod N and is an instrument failure, since that
        identity is forced by the order-3 automorphism.
    - metric: >-
        density ratio D = P(decompose | random base) / P(decompose | phi-stable
        base) at matched B
      direction: different
      minimum_effect: >-
        Predicted 1.00 with a 95 percent binomial interval contained in
        [0.85, 1.18] at the largest completed B. D >= 1.5 is outcome O2 and
        cancels the gain; D <= 0.7 is outcome O3 and must be audited.
    - metric: >-
        fully charged pipeline cost (point additions) on the quotient, divided
        by matched rho cost on the identical instance
      direction: different
      minimum_effect: >-
        Predicted STRICTLY GREATER THAN 1 at every tested size - i.e. index
        calculus loses to rho on prime fields even with the full factor-9
        automorphism discount. A ratio below 1 at any size contradicts
        KN-TECH-001/KN-TECH-006's standing position and would require
        independent replication before being reported at all.
    - metric: yield as a function of B
      direction: different
      minimum_effect: >-
        Flat in B within 10 percent across at least three values of B. Growth in
        B is the artifact tell and voids the yield number.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR: Step 3 alone, at one prime and one arity.
      Fix a j=0 toy curve at 16 bits. Build one phi-stable factor base and one
      random factor base of identical size B. Stream 200 random targets through
      the SAME decomposition routine (harness/semaev.py _find_decomposition) and
      count successes on each. That single number D decides outcome O1 versus O2
      and needs no linear algebra, no quotient, no displacement rank, and no
      solve. It is cheap because it reuses committed code unchanged and because
      the comparison is size-matched by construction.
      Only if D is near 1 do Steps 2, 4 and 5 become worth their implementation
      cost.
    controls:
      - size-matched random factor base on the same curve (N1)
      - withheld-endomorphism arm on the same j=0 curve (N2)
      - fake orbit partition, which must fail to produce consistent logs (N3)
      - matched Pollard rho with negation on the identical instance
      - matched BSGS on the identical instance
      - >-
        generic-j curve at the same p and matched N, to check that N2 and the
        generic curve are indistinguishable
    required_metrics:
      - solves, appended rows, and MATRIX RANK over F_N, separately
      - independent (a,b) right-hand-side directions per solve
      - decomposition successes / attempts per arm, with binomial intervals
      - factor-base size B, orbit partition, and count of short orbits excluded
      - fully charged point-addition count for every arm including controls
      - certificate verification pass/fail for every recovered logarithm
      - wall time and peak memory per cell

  falsification_conditions:
    - >-
      Yield per solve on a j=0 phi-stable base is below 2.5 (or below 1.7 for
      j=1728). The r-fold accounting in (A) is false.
    - >-
      D >= 1.5 with a 95 percent interval excluding 1.2. The mu_r-stable factor
      base is materially worse and the constant is cancelled: outcome O2, a
      clean negative for the lane.
    - >-
      The fake-partition control (N3) produces a consistent solve. The
      instrument is not testing the automorphism and every number it produced is
      void.
    - >-
      The withheld-endomorphism arm differs measurably from a generic-j curve at
      matched p. Something about being a j=0 curve is affecting the measurement
      without phi being used, which is either a confound in curve generation or
      a finding, and must be resolved before anything else is reported.
    - >-
      Yield grows with B. Derived rows are being recounted as searches; the
      accounting is void (this is the recorded EXP-STR-002 failure mode and the
      reason the driver must mark derived rows).
    - >-
      Any recovered logarithm fails independent certificate verification. The
      run is INVALID, not negative.

  confounders:
    - >-
      DERIVED-ROW DOUBLE COUNTING. The committed harness/endomorphism_la.py
      appends phi-shifted rows into the relation list before measuring it. Every
      metric here must distinguish searched rows from derived rows or it repeats
      the exact error DEC-20260727-009 documented.
    - >-
      RANK DEFICIENCY. DEC-20260727-009 records the phi arm's matrix being
      rank-deficient by 4, 6, 30 and 67 in the earlier work. Row count is not
      rank; only rank is reported as yield.
    - >-
      B MOD r. The committed driver's orbit machinery assumes B divisible by r
      and raises IndexError otherwise. Choosing B only at multiples of r is a
      legitimate constraint but must be stated, because it silently changes the
      comparison against a random base of arbitrary size.
    - >-
      SHORT ORBITS. x = 0 is fixed by phi on a j=0 curve and lies on E whenever
      b is a square; such points form orbits of length 1 and must be excluded or
      accounted separately.
    - >-
      TOY-SCALE B. At B of order sqrt(N) with N under 2^24, B is small enough
      that a factor of 3 in the number of needed relations is within run-to-run
      noise unless many seeds are used. At least five seeds per cell.
    - >-
      THE COMPARISON THAT MATTERS IS AGAINST RHO, NOT AGAINST UNSTRUCTURED
      INDEX CALCULUS. A factor 9 on the linear algebra of an algorithm that
      loses to rho by orders of magnitude changes nothing, and every reported
      ratio must be accompanied by the rho ratio.

  interpretation_limits:
    - >-
      A CONSTANT IS BEING MEASURED. Nothing here can move an exponent and
      nothing here is an attack. Filed as baseline calibration.
    - >-
      The ceiling is 3 (collection) and 9 (dense linear algebra) for j=0, 2 and
      4 for j=1728. A measurement at or below the ceiling is a confirmation of
      known structure, not a discovery.
    - >-
      Scoped to toy primes, short Weierstrass form, arity m in {2,3}, the
      declared factor-base construction, and pure-Python solvers.
    - >-
      This record does not move H-STR-002 in either direction and no reading of
      its outcome may be used to do so; only the Coordinator changes status.
    - >-
      Even outcome O1 leaves prime-field index calculus dominated by rho, so O1
      is a calibrated constant inside a losing algorithm.

  reachability_gate: >-
    NOT APPLICABLE AS A WALK: the curve is fixed and no isogeny step is taken.
    T4 nonetheless bounds the result's reach: the r-fold gain exists only on
    curves with an F_p-rational automorphism of order > 2, which requires
    D_0 = -3 or D_0 = -4, and by T4 a curve whose isogeny class lacks such a
    curve cannot be walked to one. There is therefore no route by which a
    generic curve acquires this constant, at any cost, and the result may never
    be reported as applying beyond D_0 in {-3,-4}.

  target_complexity:
    time_exponent: >-
      UNCHANGED. Relation collection and linear algebra keep their exponents in
      B and N; only the constants move, by at most r = |Aut|/2 and r^2. In the
      program's prime-field index-calculus cost model the total remains
      dominated by the |F|-size linear algebra and remains above rho's 1/2.
    memory_exponent: >-
      The quotient reduces stored matrix columns from B to B/r, i.e. peak memory
      falls by exactly r (3 or 2). That is the honest memory statement and it is
      a constant. Against rho's O(1) memory it is no improvement at all.
    best_known: >-
      Parallel rho with distinguished points at 0.886*sqrt(N) and O(1) memory
      (KN-TECH-001, KN-TECH-006); automorphism-discounted rho on CM curves at
      0.886*sqrt(N/|Aut|), a factor at most sqrt(6) (KN-TECH-018); BSGS at
      sqrt(N) time and memory, full cost N^{2/3+o(1)} (KN-TECH-031).
    hidden_overhead: >-
      Disclosed, and it is the reason the constant may be worthless: the density
      ratio D. If the mu_r-stable base decomposes targets less often, the factor
      r is paid back in the collection stage. That number is unmeasured in this
      repository and this proposal exists to measure it.
    tradeoff_note: >-
      The quotient trades nothing - it reduces both time and memory of the
      linear-algebra stage by constants. There is no time-memory dial here. The
      relevant tradeoff is external: index calculus (large memory, B columns)
      versus rho (O(1) memory), and on that axis rho dominates at every tested
      size.

  dominated_by: >-
    AS AN ATTACK: dominated by every frontier row, checked individually.
    TIME - rho at 0.886*sqrt(N) group operations (KN-TECH-001, KN-TECH-006);
    prime-field index calculus with the full factor-9 discount is still
    predicted to lose at every tested size and the experiment measures by how
    much. MEMORY - rho at O(1) versus this pipeline's B/r stored columns; rho
    dominates outright. DATA/QUERIES - both need only (E, P, Q); no advantage
    either way, so this axis does not rescue the proposal. CM-SPECIFIC ROW -
    automorphism-discounted rho (KN-TECH-018) at 0.886*sqrt(N/6) dominates on
    exactly the family studied here. MEMORY-RICH CORNER - BSGS (KN-TECH-031) at
    sqrt(N) time dominates on time among memory-heavy methods. dominated_by is
    NOT null and each row was checked.
  sota_delta: >-
    Zero against rho: the predicted cost ratio to matched rho is strictly
    greater than 1 at every tested size and the experiment reports the number.
    Against UNSTRUCTURED prime-field index calculus on the same curve the
    predicted delta is a factor of at most 3 in relation collection and at most
