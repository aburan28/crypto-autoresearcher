idea:
  id: IDEA-20261018-b32287
  title: 'Re-run the autoresearcher negatives whose ground was infrastructure: DREG C1, ECTD arity-3 panel,
    H-STR-002, H-DTREE-001'
  class: control
  question_id: RQ-ECDLP-002
  area: ECDLP
  goal_ids:
  - GOAL-DREG-001
  - GOAL-ECTD-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: 'With the resource or design defect removed, each of four negatives yields a measured outcome
    instead of an infrastructure loss: DREG C1 (n=15, D=6) completes all arms given at least 16 GiB where
    the recorded runs peaked at 11.7-12.2 GiB against an 8 GiB cap; the ECTD arity-3 panel completes the
    17 of 20 arms lost to infrastructure; H-STR-002 gets its missing artifacts; H-DTREE-001 gets a feasible
    design. Whether each verdict then stays negative is the open question.'
  mechanism: The ledger records H-STR-002 as weakened (missing artifacts), H-DTREE-001 as inconclusive
    (design infeasible) and DREG C1 as failed_infrastructure; those are not measurements and should not
    be cited as results. H-IC-001 (criterion revised post hoc) is related but outside this item. This
    record proposes the re-runs only. Relabelling is a Coordinator action and is not made here.
  novelty_status: adaptation
  regime: autoresearcher ledger hygiene; re-measurement with sufficient resources
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.2 last bullet, 2.3
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: ledger/hypotheses/H-STR-002.yaml; ledger/hypotheses/H-DTREE-001.yaml; ledger/hypotheses/H-IC-001.yaml
    provenance: internal
    claim: Statuses weakened / inconclusive / weakened; grounds as listed in the review.
    verified_by: idea-generator
  - ref: ledger/goals/GOAL-DREG-001.yaml (item C1); ledger/goals/GOAL-ECTD-001.yaml
    provenance: internal
    claim: C1 peak RSS 11.7-12.2 GiB vs 8 GiB cap; ECTD arity-3 panel 17 of 20 arms lost to infrastructure.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-5931ee
    - KR-IC-0d2021
    nearest:
    - ref: KN-OPEN-5b3a08
      provenance: internal
      relation: adjacent
      delta: 'Same family of bookkeeping debt: archived Semaev/decomposition results whose standing is
        uncertain.'
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Each re-run uses the original frozen protocol; only resources or the broken artifact change.
  - Original records stay immutable; new runs get new ids.
  predictions:
  - metric: arms_completed
    direction: higher
    minimum_effect: All arms complete without failed_infrastructure for DREG C1 and the ECTD panel.
  - metric: verdict_after_rerun
    direction: different
    minimum_effect: Each hypothesis receives a measured verdict; the prediction is that the DREG C1 and
      ECTD verdicts are recorded, with no prediction of their sign.
  minimal_test:
    design: Provision at least 16 GiB for DREG C1 (n=15, D=6; the (15,5) degree-8 cell needs 18-50 GB
      and rides the large-memory node), re-run the 17 lost ECTD arms, rebuild the H-STR-002 artifacts,
      redesign H-DTREE-001 to a feasible size, all under the original frozen protocols.
    controls:
    - originally completed arms of the ECTD panel as A/A
    - known-answer instance in each re-run
    - original protocol hash check
    required_metrics:
    - arms completed
    - peak RSS
    - outcome per arm
    - protocol hash equality
  falsification_conditions:
  - Any arm still lost to infrastructure under the raised resource refutes the resource estimate.
  - A re-run that changes the protocol is not a re-run; it is a new experiment.
  confounders:
  - resource availability
  - protocol drift
  - artifact recoverability
  interpretation_limits:
  - Does not change hypothesis status or relabel history; the Coordinator decides what the re-runs supersede.
  heuristic_assumptions:
  - id: H1
    statement: The losses were purely resource or design, not signs of a real effect.
    rigorous_support: Recorded failed_infrastructure and infeasible-design notes.
    validation_plan: The re-run outcomes decide.
  target_complexity:
    time_exponent: No exponent. Record hygiene.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low
    compute: medium (16+ GiB; part rides the large-memory node)
  recommended_priority: medium
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: Not an improvement; converts four process failures into measurements or confirms they cannot
    be measured.
