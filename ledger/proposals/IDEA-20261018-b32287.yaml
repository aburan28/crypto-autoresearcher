idea:
  id: IDEA-20261018-b32287
  title: 'Complete infrastructure and artifact gaps while retaining scoped evidence: DREG C1, ECTD arity-3
    panel, H-STR-002, H-DTREE-001'
  class: control
  question_id: RQ-ECDLP-002
  area: ECDLP
  goal_ids:
  - GOAL-DREG-001
  - GOAL-ECTD-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: 'With the named resource, artifact or design gap resolved, each affected lane yields the missing
    measurement: DREG C1 (n=15, D=6) completes all arms given at least 16 GiB where
    the recorded runs peaked at 11.7-12.2 GiB against an 8 GiB cap; the ECTD arity-3 panel completes the
    17 of 20 arms lost to infrastructure; H-STR-002 gets its missing artifacts; H-DTREE-001 gets a feasible
    design. Existing scoped measurements remain evidence within their recorded limits; the missing
    measurements may or may not change the Coordinator verdict.'
  mechanism: H-STR-002 is weakened partly by a measured common-phi-shift/no-append ablation in
    DEC-20260727-009 R2/R4. At B=27,55,204,397, phi/random alpha pairs were 27/27,52/52,197/199,386/387.
    Those scoped comparisons remain recorded evidence. R3 separately records missing RHS/full-cost
    artifacts and rank gaps 4,6,30,67; those gaps do not erase the ablation or adjudicate the underlying
    mechanism, whose instrument confound remains UNADJUDICATED. H-DTREE-001 remains inconclusive
    because its design was infeasible, and DREG C1 remains failed_infrastructure. H-IC-001 (criterion
    revised post hoc) is related but outside this item. This proposal fills gaps without rewriting the
    original decisions or hypothesis states; any subsequent relabelling is a Coordinator action.
  novelty_status: adaptation
  regime: autoresearcher ledger hygiene; re-measurement with sufficient resources
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.2 last bullet, 2.3
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: ledger/hypotheses/H-STR-002.yaml; ledger/hypotheses/H-DTREE-001.yaml; ledger/hypotheses/H-IC-001.yaml
    provenance: internal
    claim: Statuses weakened / inconclusive / weakened; grounds as listed in the review.
    verified_by: idea-generator
  - ref: ledger/decisions/DEC-20260727-009.yaml
    provenance: internal
    claim: R2/R4 retain the four-instance measured ablation; R3 retains missing RHS/full-cost artifacts
      and rank gaps. The decision does not reject the underlying mechanism and leaves its instrument
      confound UNADJUDICATED.
    verified_by: PR review session 2026-10-19
  - ref: ledger/goals/GOAL-DREG-001.yaml (item C1); ledger/goals/GOAL-ECTD-001.yaml
    provenance: internal
    claim: C1 peak RSS 11.7-12.2 GiB vs 8 GiB cap; ECTD arity-3 panel 17 of 20 arms lost to infrastructure.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-5931ee
    - KR-IC-0d2021
    nearest:
    - ref: KN-OPEN-5b3a08
      provenance: internal
      relation: adjacent
      delta: 'Same family of bookkeeping debt: archived Semaev/decomposition results whose standing is
        uncertain.'
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - A replay retains the original frozen protocol. Any changed design or bound requires a newly frozen
    protocol and its own approval; this proposal does not authorize or retrospectively amend a run.
  - Original records stay immutable; new runs get new ids.
  predictions:
  - metric: arms_completed
    direction: higher
    minimum_effect: All arms complete without failed_infrastructure for DREG C1 and the ECTD panel.
  - metric: verdict_after_rerun
    direction: different
    minimum_effect: Each hypothesis receives a measured verdict; the prediction is that the DREG C1 and
      ECTD verdicts are recorded, with no prediction of their sign.
  minimal_test:
    design: Provision at least 16 GiB for DREG C1 (n=15, D=6; the (15,5) degree-8 cell needs 18-50 GB
      and rides the large-memory node), re-run the 17 lost ECTD arms, rebuild the H-STR-002 artifacts,
      redesign H-DTREE-001 to a feasible size under a newly frozen protocol. Preserve the H-STR-002
      ablation and distinguish its artifact/full-cost completion from an independent mechanism test.
    controls:
    - originally completed arms of the ECTD panel as A/A
    - known-answer instance in each re-run
    - original protocol hash check
    required_metrics:
    - arms completed
    - peak RSS
    - outcome per arm
    - protocol hash equality
  falsification_conditions:
  - Any arm still lost to infrastructure under the raised resource refutes the resource estimate.
  - A re-run that changes the protocol is not a re-run; it is a new experiment.
  confounders:
  - resource availability
  - protocol drift
  - artifact recoverability
  interpretation_limits:
  - Does not change hypothesis status or relabel history; the Coordinator decides what the re-runs supersede.
  heuristic_assumptions:
  - id: H1
    statement: The named resource, artifact and design gaps can be resolved without discarding existing
      measured evidence or presuming the sign of new results.
    rigorous_support: The historical records name these gaps; DEC-20260727-009 also retains the scoped
      H-STR-002 measured ablation. Feasibility of the proposed repair is not established by those records.
    validation_plan: Check each repaired lane against its frozen acceptance criteria and retain all censors.
  target_complexity:
    time_exponent: No exponent. Record hygiene.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low
    compute: medium (16+ GiB; part rides the large-memory node)
  recommended_priority: medium
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: None measured by this proposal. It fills specific missing measurements while retaining the
    existing ablation and all unresolved or censored outcomes.
