idea:
  id: IDEA-20260816-b3478d
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: Build module-LIP and plain-LIP instances as a matched pair in which module structure over
    the cyclotomic ring is the only difference, holding dimension, determinant, construction rule
    and seed fixed, and measure whether any eligible isometry invariant separates the two arms at
    all.
  class: control
  claim: '(A) The whole nrd-PIP route exists because HAWK''s instances are MODULE lattice-isomorphism
    instances rather than plain ones: the reduction consumes the module structure, and KN-TECH-081
    records that the non-commutative principal-ideal setting is a different problem from the commutative
    one precisely because of the ring. Yet nothing in this corpus measures what the module structure
    buys, in either direction, on a matched pair. (B) The claim is that a matched pair is constructible.
    For ring degree n, a rank-2 module over the cyclotomic ring presents as a 2n-dimensional integral
    lattice with a Gram matrix, and one can construct a plain 2n-dimensional lattice by the SAME deterministic
    short-basis rule with the same determinant, differing only in that its basis is not ring-linear.
    Holding dimension, determinant, construction rule and seed fixed makes module structure the single
    manipulated variable. A battery of cheap, exactly computable invariants - short-vector counts
    to a fixed radius by exhaustive enumeration, automorphism group order, Gram statistics, Gram rank
    modulo small primes - can then be run identically on both arms, and at least one of them should
    separate the arms with an effect that grows with n. (C) The claim is that the interesting outcome
    is the negative one: if no eligible invariant separates the arms at toy n, then module structure
    is not visible in the objects themselves at the scales this program can reach, which localises
    it to the operations - the reduction and the solver - rather than the instance, and that is a
    usable measured obstruction with an immediate consequence for how any successor experiment must
    be designed. (D) NOT CLAIMED: that module structure helps or hinders an attack; that any separation
    found is exploitable; that HAWK''s instances are of the constructed shape - they are HAWK-SHAPED
    by a declared rule following the discipline recorded in H-HAWK-c7a551, not HAWK, whose Round-3
    specification this program has not read; that plain LIP and module LIP have any particular relative
    hardness; and no statement about HAWK''s security in either direction.'
  mechanism: 'Stage 1 fixes the construction rule: a deterministic seeded procedure producing a short
    basis, applied twice - once with the basis constrained to be ring-linear (the module arm), once
    with the same entrywise distribution and the same seed but without that constraint (the plain
    arm). Stage 2 forces the match: reject and resample until both arms agree exactly on dimension
    and on determinant, recording the rejection rate, because a high rejection rate on one arm is
    itself a measurement of how constrained module bases are. Stage 3 establishes eligibility before
    any comparison: each candidate invariant must be constant across 100 random unimodular re-bases
    of a fixed lattice, since only isometry invariants may carry a claim about lattices rather than
    about bases; the drop list is reported. Stage 4 computes the eligible battery on both arms in
    one invocation, with the identical code path taking an arm label as its only argument - which
    is what makes the control executable alongside the signal rather than merely described. Stage
    5 runs the battery across ring degrees 4, 8 and 16 with at least 200 matched pairs per degree,
    reporting each invariant''s standardised arm difference with a paired permutation p-value computed
    by shuffling arm labels within matched pairs. Stage 6 applies the growth test from docs/inventor-protocol.md
    section 3: a genuine structural difference should behave monotonically in n, and an effect identical
    across n is the signature of an artifact of the construction rule rather than of module structure.
    Stage 7 applies the tautology verdict to every separator: does the separating invariant discard
    anything, or is it merely reading back the ring-linearity imposed by construction, in which case
    it is recorded as a tautology and cannot carry the claim. Stage 8 emits, per invariant, the effect
    size, its growth in n, the permutation p-value and the tautology verdict.'
  novelty_status: unverified
  novelty_screen:
    method: 'Grep -ril ''plain LIP'' over ledger/proposals/ returned 0 files. Grep -ril ''matched
      pair'' returned 9 files; grep -ril ''quadratic form'' returned 49; grep -ril ''Gram matrix''
      returned 21; grep -ril ''genus'' returned 42. Inspected the headers of the nearest Gram- and
      matched-pair-bearing records: IDEA-20260808-baf8bc, IDEA-20260806-c5d183, IDEA-20260811-565915
      and IDEA-20260815-528b6e. Read ledger/questions/RQ-HAWK-001.yaml, knowledge/open-problems/KN-OPEN-027.md
      and KN-OPEN-028.md in full, knowledge/techniques/KN-TECH-081.md in full, and the scope statements
      of ledger/hypotheses/H-HAWK-c7a551.yaml and H-HAWK-a28be6.yaml. Read the anti-duplication item
      on KN-OPEN-026, which requires a measured discount with a growth direction rather than a bare
      ''does structure help''.'
    results: 'No proposal uses the phrase ''plain LIP''. The 9 matched-pair hits are elsewhere in
      the portfolio: IDEA-20260808-baf8bc is a Classic McEliece memory-capped ISD frontier comparison,
      IDEA-20260806-c5d183 is an ECDLP translation-action orbit argument, IDEA-20260811-565915 is
      an endomorphism-level identifiability record, IDEA-20260815-528b6e extends the ECDLP rigidity
      theorem to objects on pairs - none constructs a module-versus-plain lattice pair. The 42 genus
      and 49 quadratic-form hits are dominated by the isogeny-side lane (IDEA-20260806-a3ef00, IDEA-20260807-6cdff2)
      and by ECDLP records. KN-OPEN-026 is named in the anti-duplication list as needing a MEASURED
      discount with a growth direction rather than a helps-or-hurts verdict, which is exactly the
      shape of this deliverable: per-invariant effect sizes with growth directions and tautology verdicts.
      The two committed HAWK hypotheses both work at ring degrees up to 32 with exact integer arithmetic
      under a HAWK-SHAPED declared rule, so the instrument scope proposed here is inherited rather
      than invented.'
    verdict: 'UNVERIFIED. Claimed new: the matched-pair construction in which ring-linearity of the
      basis is the single manipulated variable with dimension, determinant, construction rule and
      seed all held fixed, together with the tautology verdict step asking whether a separating invariant
      merely reads back the imposed constraint. Assembled from known parts: the invariant battery
      - short-vector counts, automorphism order, Gram statistics - is standard; the HAWK-SHAPED declared-rule
      instrument and the ring-degree ladder are inherited from H-HAWK-c7a551 and EXP-HAWK-a2f34a;
      the growth-in-n artifact test is docs/inventor-protocol.md section 3 verbatim; the demand for
      a measured discount with a direction is KN-OPEN-026''s own stated requirement. No claim is made
      about external literature, which this program cannot read.'
  object_first_candidate:
    tracked_object: 'The matched pair itself: an ordered pair of 2n-dimensional integral lattices
      sharing dimension, determinant, construction rule and seed, differing only in whether the generating
      basis is ring-linear. The object followed through the computation is the DIFFERENCE of an eligible
      invariant across the pair, not either lattice alone.'
    lossiness: 'Split verdict, stated honestly. Passing from a basis to its Gram matrix is lossy -
      the left orthogonal factor is discarded - and passing from the Gram matrix to a battery invariant
      discards far more: short-vector counts retain only a truncated theta prefix, automorphism order
      retains one integer. But the pair-difference of a FULL Gram matrix would not be lossy in any
      interesting sense, because the module arm''s Gram is ring-structured by construction and reading
      that structure back is a change of coordinates rather than a discovery. That is exactly why
      the tautology verdict is a required stage rather than an optional one. The genuinely lossy and
      therefore genuinely informative battery members are those surviving the forgetting of the basis
      entirely - short-vector counts, automorphism order, modular Gram rank - and only those are eligible
      to carry the claim.'
    propagation: 'One step of the target operation is a unimodular change of basis, which is the equivalence
      LIP quotients by. It acts trivially on every eligible invariant by construction and non-trivially
      on the Gram matrix. So eligible invariants propagate deterministically, being constant along
      the orbit, while ineligible ones do not - and the propagation test is exactly the eligibility
      test: run each candidate invariant on 100 random unimodular re-bases of the same lattice and
      keep only those that are constant.'
    survival_score: 'Eligibility survives all the way by construction for the isometry invariants.
      What dissolves is computability: exhaustive short-vector enumeration to a fixed radius is feasible
      at dimensions 8, 16 and 32 and becomes budget-bound at 64, so the battery survives in full to
      ring degree 16 and only in its cheap members - Gram statistics, modular rank - at degree 32.
      The concrete survival number to report is the largest ring degree at which every eligible invariant
      completed within budget.'
  null_object_control: 'The null object is a same-shape pair with NO structural difference: two plain
    2n-dimensional lattices generated by the identical rule with different seeds, matched on dimension
    and determinant exactly as the signal pair is, run through the identical battery and identical
    permutation test in the same invocation. For the signal arm to mean anything the null pair must
    show effect sizes consistent with zero and permutation p-values uniform across the battery; if
    the null pair shows the same separations as the module-versus-plain pair, the battery is detecting
    the seed or the matching procedure rather than module structure and every signal-arm number is
    void. A second null - two module lattices with different seeds - runs identically, and the two
    nulls together bound the within-arm variability that any between-arm claim must exceed.'
  discriminated_from:
  - 'KN-OPEN-026 as it currently stands (''does structure help''): the anti-duplication list names
    that framing as insufficient. This entry never asks whether structure helps; it asks whether structure
    is VISIBLE to a fixed eligible battery on a matched pair, and reports per-invariant effect sizes
    with growth directions and tautology verdicts.'
  - 'KN-TECH-081''s three-settings table: that separates commutative, rank-1 non-commutative and rank-2
    non-commutative PIP by known status. This entry does not touch PIP at all; it compares module
    and plain LATTICES as objects, upstream of any reduction.'
  - 'H-HAWK-c7a551 and EXP-HAWK-a2f34a (tau-cocycle certification): those track a cocycle lattice
    arising from a Galois involution and certify forced values. This entry tracks a between-arm invariant
    difference and shares only the instrument lineage and the HAWK-SHAPED generation discipline, which
    it inherits explicitly rather than re-deriving.'
  - 'IDEA-20260808-baf8bc (memory-capped ISD frontier): a matched comparison, but of algorithms on
    one problem rather than of two object classes under one battery; different domain and different
    manipulated variable.'
  - 'Structured-versus-unstructured lattice comparisons run through a lattice estimator: the anti-duplication
    list rules out bare estimator calls, and this entry deliberately uses no estimator, no BKZ simulation
    and no solver - only isometry invariants computed exactly, so that nothing depends on a cost model.'
  assumptions:
  - A deterministic seeded rule can produce plain and module bases with matching dimension and determinant
    at acceptable rejection rates; if the module arm's rejection rate is very high, exact determinant
    matching may be infeasible and the design falls back to determinant-class matching, a weaker control
    that would be recorded as such.
  - Exhaustive short-vector enumeration to a fixed radius is feasible at dimensions up to 32 in exact
    integer arithmetic without a lattice library.
  - Automorphism group order is computable at these dimensions by orbit-stabiliser search over short
    vectors within budget.
  - The HAWK-SHAPED declared rule inherited from H-HAWK-c7a551 produces instances whose module structure
    is representative enough for the comparison to be meaningful at toy scale - an assumption explicitly
    NOT transferred to any statement about HAWK.
  predictions:
  - metric: number of eligible battery members separating the arms at permutation p below 0.01 at
      ring degree 16
    direction: higher
    minimum_effect: at least 1 eligible member; 0 is the informative negative outcome and is fully
      reportable
  - metric: automorphism group order, module arm versus plain arm
    direction: higher
    minimum_effect: a factor of 2n on the median, since ring-unit multiplication supplies automorphisms
      the plain arm need not have - the prediction most at risk of being a tautology and flagged for
      the tautology verdict
  - metric: growth in n of any separating invariant's standardised effect size
    direction: higher
    minimum_effect: monotone increase across n in 4, 8, 16; a flat effect is treated as an artifact
      per docs/inventor-protocol.md section 3 and not as structure
  - metric: permutation p-value distribution on the two null pairs across the whole battery
    direction: different
    minimum_effect: 'forced value: uniform on the unit interval to within a Kolmogorov-Smirnov test
      at alpha 0.05, else the battery is void'
  - metric: rejection rate when matching determinants across arms
    direction: different
    minimum_effect: 'refusal to pre-commit: the rate depends on the declared rule''s entrywise distribution
      and no honest prior is available before the rule is fixed'
  minimal_test:
    design: 'One invocation, two arms, two nulls, one code path. At ring degree 8 (dimension 16),
      generate 200 matched pairs by the declared seeded rule with exact determinant matching, plus
      200 null pairs of each kind. Compute the eligible battery on every lattice: exhaustive short-vector
      count to a radius fixed as a stated multiple of the determinant''s 2n-th root, automorphism
      group order by orbit-stabiliser over those short vectors, and Gram rank modulo 2, 3, 5 and 7.
      Eligibility is established first by checking each candidate invariant is constant over 100 random
      unimodular re-bases of a fixed lattice; invariants failing this are dropped before any arm comparison
      and the drop list is reported. Then run the paired permutation test, shuffling arm labels within
      pairs, 10000 shuffles, on the signal pair and both nulls. The discriminating output is the per-invariant
      standardised effect size with its permutation p-value on the signal pair, read against the same
      numbers on the nulls. This costs under an hour of CPU and settles whether the full ring-degree
      ladder is worth running.'
    controls:
    - 'Eligibility pre-check: every invariant must be constant across 100 random unimodular re-bases
      before entering the comparison; the drop list is reported.'
    - 'Null pair one: two plain lattices, different seeds, identically matched and identically tested,
      same invocation.'
    - 'Null pair two: two module lattices, different seeds, identically matched and identically tested,
      same invocation.'
    - 'Tautology verdict: for each separating invariant, check whether it is a deterministic function
      of the imposed ring-linearity, for instance by recomputing it on a plain lattice artificially
      given a ring-compatible Gram; if so it is recorded as reading back the construction.'
    - 'Determinant-matching audit: report the rejection rate and confirm matched pairs have exactly
      equal determinants, since an unmatched determinant would separate the arms trivially.'
    required_metrics:
    - per-invariant standardised effect size, signal pair, per ring degree
    - per-invariant permutation p-value, signal pair and both nulls
    - eligibility drop list
    - automorphism group order distributions per arm
    - short-vector counts to the fixed radius per arm
    - determinant-matching rejection rate per arm
    - tautology verdict per separating invariant
    - largest ring degree at which the full battery completed within budget
  falsification_conditions:
  - 'No eligible invariant separates the arms at any tested ring degree: module structure is not visible
    to this battery at toy scale, which localises it to the operations rather than the objects and
    is the entry''s most useful negative outcome.'
  - Every separating invariant receives a tautology verdict, meaning the battery only reads back the
    imposed ring-linearity and discovers nothing.
  - Either null pair shows the same separations as the signal pair, voiding the battery.
  - Separating effect sizes are flat across ring degree rather than monotone, the artifact signature
    named in docs/inventor-protocol.md section 3.
  - Determinant matching proves infeasible at acceptable rejection rates, so the arms differ in more
    than one variable and no causal attribution to module structure is available.
  confounders:
  - The declared HAWK-SHAPED rule may induce entrywise distributions differing between arms even at
    fixed determinant, so a separation could be a distribution artifact rather than a structure effect;
    the null pairs catch this only if the rule is applied identically.
  - Ring-linearity forces automorphisms, so the automorphism-order prediction is at high risk of tautology
    and must not count as evidence without its verdict.
  - The short-vector enumeration radius is a free parameter, and choosing it after seeing results
    would manufacture separation, so it is frozen in the specification as a formula in the determinant.
  - Exhaustive enumeration cost differs between arms if one has more short vectors, so timing must
    never be used as an invariant - only counts.
  - Determinant matching by rejection sampling biases accepted instances in ways that may differ per
    arm, which is why rejection rates are a first-class metric rather than a diagnostic.
  interpretation_limits:
  - A separation at ring degrees 4 to 16 says nothing about deployed HAWK parameters, and no extrapolation
    is performed or licensed.
  - The instances are HAWK-SHAPED by a declared rule and not HAWK, since this program has not read
    the Round-3 specification, per RQ-HAWK-001's own constraint block.
  - Visibility of module structure to a battery of invariants is not exploitability, and no attack,
    discount or speedup follows from any outcome.
  - The battery is finite and chosen in advance, so 'no invariant separates' means no member of this
    battery separated and is a statement about the battery as much as about the objects.
  target_complexity:
    time_exponent: No attack exponent is claimed. Measurement cost is dominated by exhaustive short-vector
      enumeration, exponential in dimension by construction, which is why the ladder stops at ring
      degree 16 or 32.
    memory_exponent: No attack memory exponent is claimed. Storage is the short-vector lists, a few
      hundred megabytes at dimension 32 at the frozen radius.
    best_known: For HAWK-shaped key recovery the incumbent in this corpus is Straznickas-Weis, unconditional,
      2^{(n/2+1)+o(n)} (KN-LIT-7592). For the question this entry actually asks - is module structure
      visible in the instance - this corpus records no incumbent measurement at all, which is the
      gap it addresses.
    hidden_overhead: 'The eligibility pre-check and the tautology verdict carry nearly all the human
      cost and are both easy to skip; skipping either turns the contract into a machine for producing
      tautological separations. Also hidden: the determinant-matching rejection loop, whose cost is
      unknown before the rule is fixed and which could dominate the run.'
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    2^{(n/2+1)+o(n)} (KN-LIT-7592), nrd-PIP super-polynomial and underived (KN-LIT-7674), definite/indefinite
    LIP reporting HAWK unaffected (KN-LIT-7648), the SLIP AM-intersect-coAM ceiling (KN-LIT-7671)
    - plus generic lattice reduction on the 2n-dimensional lattice as a fifth row. No attack is produced
    and no frontier row is entered: n/a (no result claimed).'
  sota_delta: No attack; measurement contribution only. The quantity moved is the per-invariant visibility
    of module structure on a matched pair at ring degrees 4 to 16, which goes from unmeasured in this
    corpus to measured with effect sizes, permutation p-values, growth directions and tautology verdicts
    - the shape KN-OPEN-026 asks for rather than a helps-or-hurts verdict.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (B), that a matched pair with exactly equal determinant is constructible
    at acceptable rejection rates: 0.6, the main risk being that ring-linearity constrains achievable
    determinants enough to make matching rare. Part (B), that at least one eligible invariant separates
    the arms: 0.7 at ring degree 16 - but conditional on that, the probability the separation SURVIVES
    the tautology verdict is only about 0.35, because the most likely separator, automorphism order,
    is close to definitionally forced by ring-unit multiplication. Part (C), that the negative outcome
    is usable if it occurs: 0.85, since ''not visible in the object at reachable scale'' is a directly
    actionable design constraint for successor experiments. Probability the whole contract is budget-bound
    below ring degree 16: 0.25.'
