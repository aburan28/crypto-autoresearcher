idea:
  id: IDEA-20261001-99487f
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES 2-TORSION/HALVING REDUCTION CUT TOY PDP COST BY ≥2×? On binary toys
    n∈{17,19,23} with frozen V (dim ℓ∈{3,4}), compare charged cost of Semaev
    S_3 Weil-descent PDP with vs without the Galbraith–Gebregiyorgis-style
    2-torsion / halving symmetry reduction under a shared XOR-SAT pin.

  class: heuristic_validation

  claim: >-
    KR-IC-955fd6 / KR-IC-1fcdbc record that 2-torsion and halving symmetries
    reduce PDP cost by about 2^{ω(n−1)} factors without changing the exponent
    vs rho. CLAIM: at each toy cell (n,ℓ)∈{17,19,23}×{3,4}, on ≥40 matched
    random targets, charged cost C = median_wall / max(success_rate, ε)
    (ε=1/40) satisfies C(sym) ≤ 0.50 × C(plain) — OR the inequality fails and
    is recorded as torsion-halving-not-2x at this scale. CLAIM TIER:
    heuristic_validation. NO break. NO exponent. NO n≥131 transfer. Distinct
    from IDEA-20261001-ae7005 (halving as a rho *walk step*).

  mechanism: >-
    OBJECT FRAME. Representation: Semaev S_3 on x-coordinates with FB
    {P : x(P)∈V}, Weil-restricted to the admitted XOR/Boolean path
    (KR-IC-5a43e5 / KR-IC-5765d2). Operation set: two PDP schedules —
    (A) plain descended S_3; (B) the same system after applying the
    pre-registered 2-torsion / point-halving symmetry reduction named by
    KR-IC-1fcdbc / KR-IC-955fd6. Trichotomy: Class I partial-action.
    Lossy-projection: charged cost discards which symmetry branch fired;
    null is a matched-size random Boolean family whose C(sym)/C(plain)
    should not inherit torsion structure. OFF-LIMITS: rho walk-step
    halving (IDEA-20261001-ae7005); Karabina symmetric reformulation race
    (5c936b); crossbred/F4 engine races (3f2d06 / c35b2a). WHAT IS NEW:
    a pre-registered ≤0.50 charged-cost band for torsion/halving *inside
    PDP*, not inside rho.

  novelty_status: unverified
