  assumptions:
    - Frozen V, seeds, XOR-SAT pin, and symmetry-reduction recipe.
    - Symmetry encoder already admitted or cell is failed_infrastructure.
    - Cost band 0.50 and ≥40 targets pre-registered; no post-hoc edits.
    - Cheaper toy PDP ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-99487f-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: on ≥40 matched random targets under
        the frozen XOR-SAT pin, C(sym) ≤ 0.50 × C(plain) where
        C = median_wall / max(success_rate, ε) with ε=1/40.
      random_model_justification: >-
        Rigorous: KR-IC-955fd6 / KR-IC-1fcdbc give that 2-torsion and
        halving shrink the effective search by a symmetry factor without
        changing the asymptotic vs rho. Classical: if the reduction
        removes roughly one bit of branching at toys, C should drop by
        about 2×; if encoding overhead dominates, C(sym) may not beat
        0.50×. The ≤0.50 band is the pre-registered transfer hypothesis
        at toys — not a claim that PDP beats rho.
      supporting_results:
        - KR-IC-955fd6
        - KR-IC-1fcdbc
        - KR-IC-5765d2
      validation_experiment_ids: []
      falsification_condition: >-
        C(sym) > 0.50 × C(plain) at a completed cell
        (torsion-halving-not-2x), OR symmetry encoder absent
        (infrastructure stop), OR success_rate=0 on both arms
        (inconclusive; report, do not invent a ratio).

  predictions:
    - metric: charged_cost_ratio_sym_over_plain
      direction: upper_bounded
      minimum_effect: '≤ 0.50 at each (n,ℓ) cell'
    - metric: target_count
      direction: lower_bounded
      minimum_effect: '≥ 40 matched targets per cell'
    - metric: both_arms_nonzero_success
      direction: lower_bounded
      minimum_effect: '≥ 1 success on each arm, else mark inconclusive'

  minimal_test: >-
    Stage 0: freeze V, seeds, XOR-SAT pin, symmetry recipe, band 0.50.
    Stage 1: n=17, ℓ∈{3,4} — ≥40 targets; report C ± bootstrap CI.
    Stage 2: n=19,23 + random-Boolean null. Budget: ≤12 CPU-hours.
    Stop if symmetry encoder absent (IMP, never evidence).

  controls:
    - ctl_matched_random_targets
    - null_random_boolean_matched_size
    - ctl_bootstrap_ci_reported
    - ctl_no_posthoc_band_edit
    - ctl_shared_xorsat_pin
    - ctl_plain_arm_identical_except_symmetry

  falsification_conditions:
    - Claiming practical binary IC from a toy symmetry win (KR-IC-1fcdbc).
    - Treating 'use 2-torsion/halving' as novelty (KR-IC-955fd6 forbids).
    - Confusing this PDP meter with rho walk-halving (ae7005).
    - Transferring the 0.50 band to n≥131 without a new contract.
    - Editing the band after seeing timings.

