idea:
  id: IDEA-20260816-7c9222
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: 'Run the observation-collision audit on the whole detectability programme: search at toy
    sizes for pairs of primes, one inside and one outside the hypothesis class, that agree on every
    statistic in a frozen battery, since one such pair falsifies identifiability for that battery
    outright'
  class: theory
  claim: '(A) THE AUDIT IS MANDATED AND HAS NEVER BEEN RUN HERE ON THIS OBJECT. KN-TECH-080 audit
    2 requires naming the observable a conclusion rests on and searching for two distinct ground-truth
    objects with the same observable, preferably one on each side of the claimed conclusion. For the
    detectability campaign the observable is the battery score vector s(p), and the claimed conclusion
    is membership in C(d,H). A collision is therefore a pair (p_in, p_out) with p_in in the class,
    p_out not, and s(p_in) = s(p_out) within the resolution the battery can distinguish. (B) A COLLISION
    IS A DIRECT FALSIFIER AND IT IS CONSTRUCTIVE. Unlike most falsifiers, this one is exhibited rather
    than inferred: the pair is written down, membership on both sides is decided by exhaustive witness
    search at toy sizes, and no statistical argument is involved. One pair proves the battery cannot
    identify the class; many pairs, counted, give a collision RATE that measures how far from identifying
    it is. (C) THE COUNT IS THE REAL DELIVERABLE. The collision rate as a function of battery size
    K and of the resolution at which two score vectors are called equal is a measured curve. A battery
    whose collision rate stays high as K grows is not merely weak, it is structurally blind, and that
    is a named obstruction in the inventor-protocol section 4 sense rather than a fatigue report.
    (D) THE SYMMETRIC RESULT IS ALSO USEFUL. If no collision is found at the resolution the sample
    supports, the audit yields a collision-free margin: the smallest observed distance between an
    in-class and an out-of-class score vector, which is a lower bound on the battery''s discriminating
    resolution and a genuine positive statement about the instrument. (E) WHAT IS NOT CLAIMED. No
    detector is proposed, no separation is asserted, and no claim is made that the class is or is
    not detectable by any battery other than the one audited. A collision falsifies identifiability
    for the audited battery only. Nothing here concerns any real, published or deployed parameter
    set, and finding a collision at 32 bits says nothing about 1024.'
  mechanism: 'STAGE ONE: fix the battery and the resolution rule, that is the quantisation at which
    two score vectors count as equal, and hash them. STAGE TWO: at a toy size where exhaustive witness
    search is affordable, enumerate every prime in a range and decide membership in C(d,H) exactly
    by sweeping every admissible base, using the interval derivation to bound the sweep. This produces
    a complete labelled population rather than a sample, which is what makes a collision search decisive.
    STAGE THREE: compute the battery score vector for every prime in the population and quantise it.
    STAGE FOUR: bucket by quantised score vector and report every bucket containing both an in-class
    and an out-of-class prime; each such bucket yields collisions directly. STAGE FIVE: sweep the
    battery size K over nested subsets and the quantisation resolution, producing the collision rate
    surface. STAGE SIX: if no bucket is mixed at the finest resolution, compute the minimum distance
    between in-class and out-of-class score vectors and report it as the collision-free margin. STAGE
    SEVEN, the control that gives the audit meaning: repeat the entire procedure with a fabricated
    class label assigned at random to the same population, where collisions must be ubiquitous by
    construction; if the fabricated-label run shows fewer collisions than the real one, the bucketing
    or the labelling is broken. The audit is complete when the surface and either the collisions or
    the margin are recorded.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: docs/inventor-protocol.md section 8 and knowledge/techniques/KN-TECH-080.md,
      which define the observation-collision audit; RQ-SNFS-005666 and GOAL-SNFS-001. Greps: grep
      -ril -E ''detectab'' ledger/proposals/ ledger/hypotheses/; grep -ril -E ''trapdoor|SNFS|special
      number field'' ledger/proposals/; grep -ril -E ''special.form|SNFS'' ledger/hypotheses/, empty.
      Header inspection of IDEA-20260811-565915, which the earlier grep surfaced for identifiability.'
    results: 'IDEA-20260811-565915 under RQ-VOLC-f6253b is the corpus record most similar in shape:
      it argues an identifiability collapse inside an isogeny class, where every level quantity is
      a function of one integer so no regression can work, and it resolves the problem by finding
      a derived rather than fitted quantity. That is the same audit applied to a different object
      and reaching a constructive conclusion, and it is named here as the nearest neighbour. No record
      applies the collision audit to integer primes or to a detectability battery of any kind. KN-TECH-080
      supplies the audit definition and contains no SNFS content.'
    verdict: 'UNVERIFIED. Nothing about external literature is asserted. Claimed new relative to this
      repository: the application of the mandated collision audit to the SNFS detectability observable,
      made decisive by using a COMPLETE labelled population from exhaustive witness search rather
      than a sample, and the reporting of a collision-rate surface over battery size and quantisation
      resolution, with the collision-free margin as the symmetric deliverable. Assembled from known
      parts: the audit itself is KN-TECH-080 verbatim, bucketing by quantised feature vector is elementary,
      and the identifiability framing appears in this corpus already at IDEA-20260811-565915 for a
      different object.'
  object_first_candidate:
    tracked_object: The quantised battery score vector s_q(p) in Z^K, treated as a bucket label, together
      with the exact class membership bit of p. The object followed is the joint distribution of bucket
      label and membership bit over a complete population of primes, and specifically the set of buckets
      that are mixed.
    lossiness: 'Genuinely lossy, and the loss is the entire subject. Each prime is projected to K
      quantised integers, so a bucket contains many primes and the fibre of the projection is exactly
      what a collision exhibits. The membership bit is retained separately and is NOT part of the
      projection, which is what makes the audit meaningful: if the bit were recoverable from the bucket
      label there would be no collisions by definition. Propagation is well defined because refining
      the battery or the quantisation refines the bucketing monotonically, so mixed buckets can only
      split, never merge, and the collision rate is monotone non-increasing in both parameters. That
      monotonicity is a checkable property of the construction and its violation would indicate a
      bug.'
    propagation: 'One step of the target operation is refining the quantisation, halving the bucket
      width along one coordinate. Every bucket splits into at most two, and a mixed bucket either
      stays mixed or resolves into a pure pair, so the collision count is monotone non-increasing.
      The same holds for K maps to K+1. The measured rate at which collisions resolve under refinement
      is the propagation law and it is informative: a rate that falls quickly means the battery separates
      the classes at fine resolution and the obstruction is only sampling noise, while a rate that
      plateaus means there are genuinely coincident score vectors and no refinement of this battery
      will separate them.'
    survival_score: The collision structure survives refinement down to the resolution at which the
      population itself runs out, that is until buckets contain at most one prime, at which point
      collisions are trivially impossible and the measurement is exhausted. The concrete statement
      is that the audit is informative only while the mean bucket occupancy exceeds one, so at a population
      of P primes and battery size K the usable resolution range is bounded by P^(1/K); at P = 10^5
      and K = 10 that is a very coarse resolution per coordinate, which is a real and reportable limitation
      on how fine an audit this design can perform.
  null_object_control: 'The fabricated-label control: the identical population, the identical battery,
    the identical bucketing, with the class membership bit replaced by a random bit at the same marginal
    rate. Collisions must then be far more numerous than in the real run, since a random label cannot
    be predicted from any observable. The null must show a collision rate near the ceiling implied
    by bucket occupancy; if the real run''s collision rate is not clearly below the fabricated one,
    the battery carries no information about membership at all and the audit result is that the observable
    is uninformative rather than merely non-identifying. A second control, a deliberately informative
    label such as p modulo 4 which is trivially readable from any digit statistic, must show a collision
    rate near zero, confirming the pipeline can detect identifiability when it exists.'
  discriminated_from:
  - 'IDEA-20260811-565915 under RQ-VOLC-f6253b: the closest record in the corpus, arguing an identifiability
    collapse where every level quantity reduces to one integer. Same audit, different object, and
    that record resolves its collapse by finding a derived quantity, whereas this one measures a collision
    rate over a complete population and makes no such move.'
  - 'The lattice, digit and p-minus-one detectors in this batch: those propose observables. This audits
    observables and can falsify any of them, so it is upstream of all three rather than a competitor.'
  - 'The max-over-K calibration in this batch: that measures how much separation arises from noise.
    This measures whether separation is possible at all given the observable, which is a different
    failure mode; a battery can pass the calibration and still fail this audit.'
  - 'KN-TECH-080 itself: the technique note defines the audit as a protocol step. This record instantiates
    it on a named class with a complete population and produces a number, which the protocol requires
    but does not supply.'
  assumptions:
  - Exhaustive membership decision is affordable at the chosen population size, which follows from
    the interval derivation bounding the base sweep and is verified by the sweep terminating.
  - Quantisation of the score vector is a faithful stand-in for the resolution at which a real detector
    would operate; coarser quantisation makes collisions easier and the sweep exists to show the dependence.
  - The population is complete over the chosen range rather than sampled, which is what makes a single
    collision decisive.
  - Monotonicity of the collision count under refinement holds by construction and is checked rather
    than assumed.
  predictions:
  - metric: existence of at least one mixed bucket at coarse quantisation with K = 2
    direction: higher
    minimum_effect: at least 1 collision, since two coarse statistics cannot separate a sparse class
      from a dense complement
  - metric: collision rate at the finest resolution the population supports, K = 10
    direction: lower
    minimum_effect: 'no pre-commitment: this is precisely the unknown the audit exists to measure,
      and predicting it would be assuming the conclusion'
  - metric: monotonicity of collision count under refinement of K and of quantisation
    direction: lower
    minimum_effect: strictly non-increasing at every refinement step; any increase indicates a bug
  - metric: fabricated-label control collision rate relative to the real-label rate
    direction: higher
    minimum_effect: at least 2 times the real-label rate, otherwise the battery carries no membership
      information
  minimal_test:
    design: 'Choose n = 26 so that the entire prime population in a fixed range is enumerable and
      the base sweep for membership is affordable. Enumerate all primes in a range containing about
      10^5 of them. For each, decide membership in C(3,4) exactly by sweeping every base in the derived
      admissible interval and testing whether the centred digits fit inside the coefficient bound,
      which is complete for that subclass and cheap. Compute a ten-statistic battery on every prime,
      quantise each coordinate into eight bins, bucket, and list every mixed bucket. The discrimination
      requires nothing beyond a dictionary: a mixed bucket is a collision and the pair is printed.
      Then refine the quantisation twice and record how many collisions survive. The fabricated-label
      and trivially-readable-label controls run over the same buckets at no extra cost. Total cost
      is one enumeration of 10^5 primes with a bounded base sweep each, minutes in pure Python, memory
      tens of megabytes.'
    controls:
    - The fabricated random-label control on the identical population and buckets.
    - The trivially-readable-label control, using p modulo 4, which must show near-zero collisions.
    - A monotonicity check across every refinement step of both K and quantisation.
    - A bucket-occupancy report, so that resolution exhaustion is distinguished from genuine separation.
    - A membership-decision audit on a random subsample, re-deciding membership by an independent
      method to confirm the labels are correct.
    required_metrics:
    - number of mixed buckets and number of collision pairs per (K, resolution)
    - collision rate normalised by bucket count
    - collision-free margin, the minimum in-class to out-of-class score distance, where no collision
      exists
    - fabricated-label and readable-label control collision rates
    - mean and maximum bucket occupancy
    - class prevalence in the population
  falsification_conditions:
  - Collision count increases under a refinement of K or of quantisation, which is impossible by construction
    and indicates a bug.
  - The trivially-readable-label control shows substantial collisions, meaning the pipeline cannot
    detect identifiability even when it is trivially present.
  - The fabricated-label control shows fewer collisions than the real-label run, meaning the bucketing
    or labelling is broken.
  - The membership-decision audit finds mislabelled primes, invalidating every collision reported.
  - Bucket occupancy falls to one before any interesting resolution is reached, meaning the population
    is too small for the audit to say anything.
  confounders:
  - Class prevalence at toy sizes may be very low, so mixed buckets are rare simply because in-class
    primes are rare, which is a prevalence effect and not a resolution effect; the normalisation by
    class prevalence exists for this.
  - Quantisation bin boundaries interact with statistics that take few distinct values, creating artificial
    purity.
  - Correlated statistics reduce the effective dimension of the bucket space and inflate collisions
    without that being a property of the class.
  - Restricting to a fixed prime range correlates several statistics with size in a way that would
    not occur across a wider range.
  - Membership decided only for the digit-representable subclass understates the in-class population
    and biases the collision count.
  interpretation_limits:
  - A collision falsifies identifiability for the audited battery and resolution only, and says nothing
    about any other observable.
  - No collision is not evidence that the battery identifies the class; it is a margin at the resolution
    the population supports, and the contract requires it to be reported that way.
  - Results are scoped to the tested size, degree and coefficient bound and to a population this program
    enumerated.
  - Nothing here says anything about real, published or deployed parameters, and no such statement
    may be written.
  target_complexity:
    time_exponent: No attack exponent is claimed. The audit costs one exhaustive membership decision
      per prime, which is the base sweep of length about p^(1/d), times the population size, plus
      a linear-time bucketing pass; at the chosen toy size the total is a few times 10^8 elementary
      operations and is reported rather than hidden.
    memory_exponent: No attack memory exponent is claimed. The bucket table holds one entry per distinct
      quantised score vector, bounded by the population size, so memory is O(P K) integers, tens of
      megabytes at the stated population.
    best_known: The incumbent is the protocol requirement in KN-TECH-080 and docs/inventor-protocol.md
      section 8 that this audit be run, which supplies no number. Within this repository the nearest
      executed analogue is the identifiability argument in IDEA-20260811-565915 for a different object.
      No external baseline is asserted.
    hidden_overhead: 'The hidden cost is population size: the audit''s resolution is bounded by P^(1/K),
      so a battery of any realistic size exhausts the population almost immediately, and a no-collision
      result is far weaker than it sounds. That limitation must be stated with the margin every time
      it is quoted. There is also a labelling cost, since exhaustive membership decision is only complete
      for the digit-representable subclass unless a full lattice sweep is run.'
  dominated_by: n/a for attack claims, none is made. As an audit, I checked the corpus records that
    touch identifiability, principally IDEA-20260811-565915, and the batch's own three detector contracts,
    and none performs a collision search over a complete labelled population, so no row dominates
    this one. Against the cheaper alternative of simply reporting a battery's ROC, this audit is dominated
    on cost and dominates on what it can rule out, since an ROC cannot exhibit a counterexample while
    this produces one explicitly; that two-row frontier is the honest comparison.
  sota_delta: No attack; audit and identifiability contribution only. Quantitatively the delta is
    from a mandated but unexecuted protocol step to a collision-rate surface over battery size and
    resolution, plus either explicit collision pairs or a measured collision-free margin, on a population
    of about 10^5 completely labelled primes. No time, memory or data figure for any attack changes,
    and none is claimed to.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That collisions exist at coarse quantisation with a small battery: about
    0.95, since a sparse class against a dense complement with few coarse statistics almost cannot
    avoid them, so that part is nearly certain and correspondingly uninformative. That the collision
    rate plateaus rather than falling to zero under refinement, giving a genuine structural obstruction:
    about 0.4, and this is the outcome worth having. That the population is large enough for the finest
    resolution to be meaningful: about 0.35, which is the audit''s main methodological risk. That
    any conclusion transfers beyond the tested size: not claimed, and the contract forbids it.'
