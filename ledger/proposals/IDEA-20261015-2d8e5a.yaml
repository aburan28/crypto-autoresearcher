  falsification_conditions:
    - the key costs >= 0.8x variant B at n=83 or >= lift_scan at n=131: no gain, and the probe-path use is dead
    - R4 steps-to-collision > 1.3x R3: the Frobenius-adding walk's randomness penalty exceeds the canonicalization saving at this n; only the probe-path use survives
    - any key hit whose exact canonical form differs from the exhaustive scan's: implementation defect, stop
    - false hits per probe > 1e-4 at p ~ 2^61: the collision argument is wrong
  confounders:
    - the mulmod chain is latency-bound per key; throughput only appears when keys are independent, so the loop measurement is the one that counts (the paper's variant A/C lesson)
    - the n=83 zero-gap stage share (~0.27) bounds the whole-stage gain to <= 1.37x regardless of key speed; report the stage and the key separately
    - a Frobenius-adding walk cannot use precomputed r-adding multiples; its step is one point addition plus a rotation, cheaper than r-adding, which flatters R4 for a reason unrelated to the key; the HW-selector control isolates the key's share
