  claim: >-
    With p a 61-bit prime, p = 1 (mod n), w of order n in F_p^*, and K(x) =
    (sum_{i<n} x_i w^i)^n mod p for x in normal-basis coordinates: (1) K is
    invariant under all 2n signed-Frobenius actions (rotation multiplies the
    inner sum by w^k; the n-th power kills it; negation leaves x fixed), and two
    distinct classes collide with probability ~ n/p ~ 2^-55; (2) in the n=83
    index's canonicalization stage, keying the packed root table by K and
    canonicalizing only on a key hit cuts the stage's canonicalization time by
    >= 2x against variant B (predicted key cost 40-60 ns/word against 195
    ns/word unisolated), bounded by the stage share (1.42x canonicalizer gain
    gave 1.086x on the stage, so the share is ~0.27 and the stage gain is
    <= 1.37x); (3) at n=131, K costs <= 0.8x lift_scan per key in instructions
    on the cachegrind harness and <= 0.5x in the loop (branch-free, independent
    keys overlap); (4) a strong-rho rung R4 at n=53 that selects its
    Frobenius-adding step P <- P + sigma^{j}(P), j = 3 + (K(x) mod 32), and
    its DP predicate from K, with NO per-step canonicalization, retires
    >= 1.4x fewer instructions per step than R3 while its steps-to-collision
    stay <= 1.1x R3's; net >= 1.25x fewer total Ir to a verified logarithm.
  mechanism: >-
    f(x) = sum x_i w^i is linear in the 0/1 vector x; f(rot_k x) = w^k f(x), so
    f^n is a rotation invariant and the signed class is the rotation class of
    x. Collisions f(x)^n = f(y)^n mean f(x) = w^k f(y) for some k: the wanted
    case plus ~n spurious solutions per value, hence ~n/p false matches per
    pair; with 2^28 table states and p ~ 2^61 the expected false hits per probe
    are 2^28 * 83 / 2^61 ~ 2^-26.6, and every hit is verified by exact
    canonicalization anyway. Cost: ceil(n/8) byte-table loads (tables T_t[b] =
    sum of w^{8t+i} over the bits of b, 11 x 256 x 8 B = 22 KB at n=83, L1
    resident) with lazy 128-bit accumulation, then x^n by 6-7 squarings and
    2-3 multiplications mod p (~9 mulmod64). No data-dependent branch, so
    consecutive independent keys overlap in the out-of-order core, which is
    exactly what the paper found variant A's two loop exits prevent (variant C
    beat A inside the loop, 39-41 vs 61 ns/summand, for that reason). For the
    walk: P + sigma^j(P) is a class function of the class of P whenever j is
    (KN-LIT-661e97), so no representative is needed per step; K supplies j
    with 61 bits of entropy instead of Bailey's ~6, so the walk can use 32 or
    more multipliers (1 + s^j) and the DP predicate K mod 2^d = 0 is free.
    A 32-bit modulus is NOT enough for the n=83 table (2^28 * 83 / 2^32 ~ 5
    false hits per probe); 61 bits are needed, which is why the cost estimate
    uses 64-bit modular multiplication.
