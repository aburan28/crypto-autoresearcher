  title: >-
    A rotation-invariant polynomial key K(x) = (sum_i x_i w^i)^n mod p, w of
    order n in F_p, replaces exact necklace canonicalization wherever only a
    class INVARIANT is needed: the root-index probe key, the reference walk's
