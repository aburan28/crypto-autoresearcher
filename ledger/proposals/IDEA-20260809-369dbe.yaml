  sota_delta: ZERO on every attack axis; no attack is proposed. Restores the ability of a goal
    record to describe its own state and of a completion claim to be audited. Concretely it surfaces
    25 designed contracts invisible to every goal, removes a false 'source gate shut' signal that
    persists for a second independent reason beyond the network reachability IDEA-20260807-f73d98
    already measured, and repairs the auditability of the program's three oldest completion claims
    -- an external reader who checks GOAL-XEDN-001 today reads a GOAL-ECDLP-001 revise decision
    and can conclude the completion is unsupported, though the underlying science (max_|coeff|
    = 1, scoped toy) is fine and deserves a citable record. The resolver stops the next completion
    inheriting the defect at essentially zero recurring cost.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.99 that the forward resolver finds broad disagreement -- 36 of 46
    empty is measured. 0.9 that at least one closure is UNRESOLVABLE (XEDN-001 is verified). 0.5
    that the XEDN citations turn out ALIASED rather than genuinely broken once corrections/ is
    walked, which would be the better and less alarming outcome.
