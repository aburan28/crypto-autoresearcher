idea:
  id: IDEA-20260809-369dbe
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: 'A goal record cannot describe or substantiate its own state: 46 of 46 goals have empty
    active_hypothesis_ids and 202 of 271 hypotheses carry no goal_id, while three of the five
    completed goals cite closing decisions that at HEAD are other campaigns'' records'
  class: tooling
  claim: 'The surveyor reported this for 14 goals; I re-measured and it is CORPUS-WIDE AND WORSE.
    ALL 46 goals -- active, draft, paused, completed alike -- have an empty or absent active_hypothesis_ids,
    and 202 of 271 hypotheses resolve goal_id to null, while the experiment contracts DO carry
    goal_id (22 of 25 in the draft-goal slice). So there is no committed link from any goal to
    the work done under it, and the goal record -- the thing a resuming Coordinator reads first
    -- reports a state that is materially wrong. All 14 draft goals'' next_action fields still
    direct the reader to acquire primary sources (GOAL-FRODO-001: ''THE SOURCE GATE IS SHUT AND
    MUST BE OPENED FIRST''; GOAL-SQISIGN-002: ''this program has read NO Round-3 specification'')
    while the designs beneath them cite filed primary text by version and date (H-SQISIGN-c0488f
    scoped to SQIsign v2.0.1 dated 2025-07-07 at NIST-I/III/V; H-MQOM-a0a477 to MQOM v2.1 dated
    2025-09-22 and its eighteen Table 6 instances). Downward, the same edge fails at closure and
    I verified every instance by resolving the cited ids: GOAL-XEDN-001 says ''Completed by DEC-20260725-001'',
    which at HEAD targets [''GOAL-ECDLP-001'',''BATCH-003'',...] with decision ''revise''; GOAL-XEDN-002
    says ''Completed by DEC-20260725-002'', which at HEAD targets GOAL-SSI-001/RQ-SSI-001; GOAL-ICLIFT-001''s
    next_action asserts ''DEC-20260724-009 supports H-XEDN-002 and retains DEC-20260724-008'',
    while DEC-20260724-009 at HEAD targets [''H-BKKMV-001'',''H-BKK-001'']. DEC-20260727-005 with
    CORR-20260727-002 adjudicated exactly this, reissued the XEDN records at DEC-20260725-003/-004
    and published an alias; two days later CORR-20260729-001 -- a merge note authored on a branch,
    with no decision record -- gave those ids to SSI decisions (verified: both resolve to GOAL-SSI-001
    records at HEAD) and parked the XEDN bodies under ledger/corrections/, recording in its own
    limitations ''Cross-program DEC-20260725-003/004 ID collision remains''. Nothing since revisits
    it, and no check anywhere asserts that a goal''s cited decision_id resolves to a record naming
    that goal.'
  mechanism: 'One deterministic resolver, two verdict families, run over all 46 goals. FORWARD:
    report per goal the hypotheses and contracts that name it anywhere (hypothesis.goal_id, experiment.goal_id,
    or transitively via question_id) versus what active_hypothesis_ids lists -- expect 46 of 46
    to disagree, and expect the draft-goal slice to surface 25 designed unapproved contracts that
    appear nowhere in any goal''s view of itself. BACKWARD: for every goal with status completed
    / closed_at_budget / paused, resolve each cited decision_id and evidence_id against the union
    namespace (ledger/*.yaml AND ledger/<type>/ AND ledger/corrections/), assert the target''s
    target_ids or context names that goal, and emit PROVENANCE-RESOLVED / ALIASED / UNRESOLVABLE
    with the alias chain walked. Expect ICLIFT, XEDN-001 and XEDN-002 UNRESOLVABLE. NULL CONTROL,
    which the corpus supplies free: run the same resolver against the ML-KEM lane, whose reserved_alias_note
    blocks in DEC-20260730-005/-006 show the pattern done correctly, and require it to return
    clean there. Then two mechanical guards: add hypothesis.goal_id to the validator''s required
    set for any hypothesis whose question is owned by a goal, and make an unresolvable closing
    citation an error. Everything downstream of the resolver -- refreshing 14 stale next_action
    fields, re-adjudicating the DEC-20260725-003/-004 double occupancy under supersede-do-not-rename
    -- is a Coordinator act and is reported, not taken.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - IDEA-20260807-86e43e is the only proposal that mentions active_hypothesis_ids and it does
      so for GOAL-SQISIGN-001/002 only, as one clause inside a SQIsign reading-task proposal;
      it does not report that the break holds for all 46, and it does not identify hypothesis.goal_id
      as the field going unset. IDEA-20260807-d7ef50 concerns a different record type (evidence)
      and a different missing field (question_id) -- the hypothesis->goal edge and the goal->hypothesis
      back-reference are separate edges and are exactly the ones that make a goal resumable. On
      the closure side, searches for closure provenance, goal-completion provenance and decision-id
      resolution return ZERO proposals among 459 (verified). Both collision events were handled
      as merge hygiene by whichever session hit them and the artifacts are corrections, not gap
      statements; the CORR-20260727-002 alias makes the historical strings readable, so nobody
      re-derived that its target has since been reassigned -- following it today lands on an SSI
      decision. GOAL-XEDN-001/002 were completed before either event, so no session that touched
      them ever read the collision records.
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any cryptographic claim. The object is the GOAL-TO-WORK
      EDGE and the closure citation.'
    tracked_object: Per goal, the set of hypotheses and contracts that name it, versus what the
      goal record says about itself; and per closure, whether the cited decision resolves to a
      record naming that goal.
    one_step_propagation_rule: Each new hypothesis either names its goal or does not; the goal's
      self-description is the union of the naming edges and is exactly computable.
    newness_score: Nil as mathematics. A goal record is what a resuming Coordinator reads first,
      and it currently cannot describe its own state.
  lossy_projection_identifiability_audit:
    projection: the campaign -> the goal record's self-description.
    what_is_discarded: Everything the goal does not name -- which is the defect.
    is_it_only_a_change_of_coordinates: 'NO: the resolver computes an edge set that does not currently
      exist in any record. Honest caveat: this creates auditability, not knowledge.'
    mirror_failure_check: CHECKED. The resolver must be able to return clean. The ML-KEM lane's
      reserved_alias_note blocks in DEC-20260730-005/-006 show the pattern done correctly and
      are the required clean case.
  null_object_control:
    primary_null: RUN THE RESOLVER AGAINST THE ML-KEM LANE, whose alias discipline is correct,
      and REQUIRE it to return PROVENANCE-RESOLVED there. A resolver that flags everything is
      not measuring provenance.
    secondary_nulls:
    - 'FORCED UNRESOLVABLE: GOAL-XEDN-001''s cited DEC-20260725-001 resolves at HEAD to a `revise`
      decision targeting GOAL-ECDLP-001 / BATCH-003 -- verified by the consolidating session --
      and must be reported UNRESOLVABLE.'
  assumptions: []
  predictions:
  - metric: goals whose active_hypothesis_ids disagrees with the computed edge set
    direction: higher
    minimum_effect: 36 of 46 goals have an empty active_hypothesis_ids (measured at HEAD), so
      disagreement is near-certain; the deliverable is the per-goal list.
  - metric: completed/paused/closed goals whose closing citation is UNRESOLVABLE
    direction: higher
    minimum_effect: At least one is forced (GOAL-XEDN-001).
  minimal_test:
    design: One deterministic resolver over all 46 goals, forward (who names this goal) and backward
      (does the cited closing decision name it), emitting PROVENANCE-RESOLVED / ALIASED / UNRESOLVABLE
      with the alias chain walked; run the ML-KEM clean case first.
    controls:
    - ML-KEM lane clean case
    - forced-UNRESOLVABLE GOAL-XEDN-001
    - alias-chain walk through ledger/corrections/
    required_metrics:
    - per-goal forward edge set vs active_hypothesis_ids
    - per-closure resolution verdict
    - count of hypotheses lacking goal_id
  falsification_conditions:
  - 'The resolver returns clean on the ML-KEM lane and flags nothing elsewhere: the corpus''s
    provenance is sound and the concern is unfounded.'
  - 'The XEDN citations resolve once ledger/corrections/ aliases are walked: the defect is a resolver-scope
    problem, not a provenance problem, and the fix is to teach every reader the alias namespace.'
  - 'The forward edge set matches active_hypothesis_ids anywhere: the field is being maintained
    in at least part of the corpus and the claim must be narrowed.'
  confounders:
  - An empty active_hypothesis_ids may be a deliberate attention record rather than an error --
    GOAL-ECDLP-001's own note says membership 'is an attention record, not an evidential one'.
    The resolver reports the disagreement; it does not call it a bug.
  - Alias chains through ledger/corrections/ are legitimate; not walking them manufactures false
    UNRESOLVABLEs.
  - Some hypotheses legitimately belong to no goal.
  interpretation_limits:
  - Auditability, not science. The underlying XEDN result (max |coeff| = 1, scoped toy) is unaffected
    and deserves a citable record.
  - Refreshing stale next_action fields and re-adjudicating the DEC-20260725-003/-004 double occupancy
    are Coordinator acts under supersede-do-not-rename; reported, not taken.
  heuristic_assumptions:
  - id: HEUR-GPROV-1
    statement: A goal's true edge set is recoverable from hypothesis.goal_id, experiment.goal_id
      and question_id transitively.
    rigorous_support: None; work may be attached by none of the three.
    validation_plan: Report the residue that no edge reaches, which is itself the finding.
