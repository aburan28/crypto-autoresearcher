idea:
  id: IDEA-20260809-0e919c
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    Represent every admissible verifier as a point in a finite predicate lattice,
    turning the divergence matrix from a survey into a lattice computation
  class: representation
  claim: >-
    Every admissible Ed25519 verification procedure is a conjunction of
    predicates drawn from a small fixed set (cofactored equation, canonical A,
    canonical R, small-order A rejection, small-order R rejection, S-range,
    encoding-length), so the space of verifiers is the Boolean lattice over that
    set. The claim is that the ACCEPTANCE SETS are monotone in this lattice and
    that the entire divergence matrix is therefore determined by the acceptance
    sets at the lattice's atoms plus the join structure — meaning a small number
    of computations determines every pair's separation, including readings no
    specification currently describes.
  mechanism: >-
    Compute, for each candidate object from the enumerated space, the vector of
    predicate outcomes. Two verifiers separate on that object exactly when their
    predicate conjunctions differ on it. Monotonicity means adding a predicate
    can only shrink the acceptance set, so the lattice is ordered by inclusion
    and the separating objects for any pair are read off as a set difference.
  why_not_a_renamed_known_approach: >-
    Published work compares NAMED implementations pairwise. This record replaces
    the implementations with their defining predicates and computes over the
    whole lattice, which covers readings nobody has implemented and makes
    "which pairs can possibly differ, and on what" a closed-form answer rather
    than a survey result.
  predictions:
  - observable: monotonicity of acceptance sets under predicate addition
    metric: boolean, checked over the whole enumerated object space
    predicted: >-
      Holds. A non-monotone predicate would mean some check ACCEPTS objects
      another reading rejects, which would be a genuinely surprising structural
      finding and worth more than the lattice itself.
  - observable: number of distinct acceptance sets over the lattice
    metric: integer, compared against 2^k for k predicates
    predicted: Strictly fewer than 2^k, because some predicates are implied by others; the collapse structure is itself a deliverable.
  minimal_test: >-
    Implement each predicate independently, evaluate every enumerated candidate
    against every predicate, build the acceptance sets for all lattice points,
    check monotonicity, and emit the collapse structure plus the pairwise
    separating sets.
  controls:
  - 'INDEPENDENCE CHECK: predicates must be implemented in isolation; a predicate that internally calls another silently creates a false implication in the collapse structure.'
  - 'SPECIFICATION ANCHOR: at least two lattice points must correspond to readings actually derived from filed specification text; a lattice with no anchored points is mathematics without a subject.'
  falsification_conditions:
  - Acceptance sets are not monotone, invalidating the lattice ordering (and constituting a more interesting result than the one proposed).
  - The candidate object space is too coarse to separate lattice points that specifications actually distinguish, meaning the representation loses information.
  interpretation_limits: >-
    The lattice covers readings that no specification endorses. A separation
    between two lattice points is not evidence that any real verifier implements
    either, and records must not slide from lattice points to implementations.
  sota_delta: >-
    No attack. The delta is a representation that makes completeness claims
    checkable and covers unimplemented readings, at the cost of abstracting away
    everything about real implementations except their predicates.
  dominated_by: >-
    Not dominated by any corpus record. Dominated by published taxonomies on the
    question "what do real libraries do", which this representation deliberately
    does not answer.
  estimated_cost: Implementation small-to-medium; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for predicate lattice / verification semantics: no records. WEB NOT CHECKED.'
  source_refs:
  - RFC 8032 and FIPS 186-5 -- REQUIRED READS, NOT YET READ; needed to anchor at least two lattice points.
