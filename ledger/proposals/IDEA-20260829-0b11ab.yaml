    - ref: "van Oorschot and Wiener, parallel collision search with cryptanalytic applications (time-memory interpolation sqrt(N^3/w))"
      provenance: recalled
      claim: >-
        Relied on only as the standard example that a cryptanalytic cost is
        naturally a curve over a memory parameter rather than a scalar, which
        is why a single reported operating point carries an implicit
        convention.
      verified_by: null
    - ref: docs/target-result-profile.md
      provenance: internal
      claim: >-
        Part D requires a concrete-cost table with time and memory for the new
        result AND the previous best "under matched accounting" before any
        asymptotic claim is promoted past analyzed. This proposal builds the
        matched-accounting instrument that requirement presupposes.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full file read
        (397 lines).
  assumptions:
    - >-
      Every generator in G must be justified by an explicit statement in a
      primary source that is quoted with an exact locator. A generator derived
      from a reviewer's estimate, a benchmark run by this program, or a
      recollection is recorded in a separate set G_unsupported and may never
      be composed into a canonical attribution.
    - >-
      The instrument NEVER overwrites a committed row. It emits a derived
      overlay artifact carrying, per row, the unit label, the reachable-unit
      set, and per-pair (offset, residual, path, generator locators). The
      committed schema v2 refusal rule stays in force for canonical dominance.
    - >-
      No cryptanalytic search, attack execution, or reproduction occurs. Per
      RQ-SYMF-5ab172, this question authorizes none.
    - >-
      A residual is never labelled "cryptanalytic improvement". It is labelled
      "unattributed under G", which is what the measurement supports.
  proof_search_map:
    bottleneck: >-
      Constructing an attack-independent conversion generator between two
      declared cost units using only statements present in the primary
      sources. Every downstream number (unit connectivity, phi, holonomy
      defect) exists only if this step succeeds; if the sources do not state
      unit relations, G is empty, the instrument returns the committed refusal
      behaviour unchanged, and that null is the answer.
    baseline_embedding:
      parameter_slice: >-
        G = empty set. With no generators declared, no cross-unit path exists,
        every cross-unit pair is incomparable, and the instrument reduces
        exactly to schema v2's dominance_rules.
      reproduction_check: >-
        Frozen regression fixture: run the instrument with G = empty over the
        21 canonical frontier rows and 9 verified-baseline rows of
        knowledge/frontiers/symmetric-cryptanalysis.yaml; the emitted
        is_frontier vector must equal the committed vector element for
        element, and the emitted dispositions must equal the committed
        dispositions (21 admitted_partial_frontier, 9
        admitted_verified_baseline_frontier_unresolved). Any mismatch halts
        the experiment before a single generator is declared.
    observation_collision:
      observable: >-
        The normalised log2 time scalar of a row after applying a path in G.
      distinct_preimage_search: >-
        COLLISION FOUND BY CONSTRUCTION, and it is a falsifier of any
        single-scalar headline. Two rows can share a normalised time scalar
        while differing arbitrarily on memory, preprocessing, and success
        probability - the committed ledger already exhibits the shape, since
        LEGACY-SHA1-IP-COLLISION-THEORY carries time 2^61.2 with memory and
        preprocessing null (not_stated_by_source) while the chosen-prefix rows
        were found by red team to carry source-explicit storage, RAM, graph
        construction and manual-preparation costs (EV-SYMF-d46055 J2).
        SEPARATING CONDITION, which the instrument must enforce and which is
        therefore a hard design constraint rather than a caveat: attribution
        and dominance are computed on the full six-axis vector, and the scalar
        is never emitted as a comparable quantity. A second collision class to
        hunt during execution: two generators, one derived from a hardware
        equivalence and one from an algorithmic call-count identity, giving
        the same offset between the same unit pair - identical observable,
        different epistemic standing; the instrument must keep them distinct
        and report which was used.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from unit-tagged scalars to a log2 vector space equipped with a
          generator multigraph, where "same unit" becomes an exact equality
          condition and "comparable" becomes graph connectivity.
        predicted_gain: >-
          MODELED, NOT MEASURED. Converts a currently unanswerable question
          ("is 2^61.2 better than 2^63.1") into two reported numbers (offset
          under G, residual) plus an explicit consistency test. Expected
          quantitative gain is the number of newly attributable pairs; the
          proposal predicts at least 3 among the SHA-1 partition, and the
          honest possibility is 0 if no source states a unit relation.
      - transform: observable_fiber
        proposed_object: >-
          Hold the normalised scalar fixed and vary the forgotten structure
          (the memory and preprocessing axes suppressed by normalisation) to
          exhibit two rows with equal normalised time and non-comparable full
          cost vectors.
        predicted_gain: >-
          A concrete counterexample pair drawn from the committed ledger,
          usable as a standing regression test that forbids scalar
          normalisation in the schema.
    quantifier_order: >-
      Claimed - FOR ALL ordered pairs of units (u1, u2) in the declared
      generator graph, and FOR ALL paths P1, P2 from u1 to u2 built from
      source-supported generators, offset(P1) = offset(P2) within the
      precommitted tolerance tau = 0.5 bits. Equivalently, FOR ALL closed
      walks, the summed offset is 0 within tau. NOT CLAIMED - there exists a
      path making two given rows comparable (an existential claim of that form
      is exactly the cherry-picking failure the instrument is built to
      prevent). THE QUANTIFIER DEFECT BEING HUNTED - a generator whose offset
      secretly depends on the attack (for example a GPU-equivalence factor
      valid only for an attack whose inner loop is a full compression call)
      makes the offset instance-dependent, which is a forall-forall violation
      and shows up as nonzero holonomy.
    method_ceiling:
      strongest_certifiable_claim: >-
        Under the declared generator set G with recorded per-generator source
        locators and tolerance tau, X bits of the raw log2 gap between two
        named rows are attributable to G and Y bits are unattributed, with the
        holonomy defect over the cycles touching those generators measured and
        reported. The method can NEVER certify that the unattributed residual
        is cryptanalytic progress, nor that the true full cost (in the Wiener
        sense) is ordered as the normalised costs are.
      nearby_object_control: >-
        Two results reported IN THE SAME PAPER, IN THE SAME UNIT, for the same
        primitive and notion (for example two rows of a single comparison
        table in a retrieved primary source). The generator set must produce
        an offset of exactly 0 bits between them. If G produces a nonzero
        offset on a same-paper same-unit pair, the instrument is broken and no
        cross-paper attribution from that run may be reported. A second
        control at the other boundary - a pair of rows that differ ONLY in
        attacker model (single-key versus related-key), where no unit
        conversion may be permitted to make them comparable; if the instrument
        connects them, it has learned to launder rather than to normalise.
    proof_obligations:
      - claim: >-
          With G empty the instrument reproduces the committed canonical
          dispositions and is_frontier flags exactly.
        responsibility: baseline
      - claim: >-
          Every declared generator carries a primary-source quotation and
          exact locator, and generators without one are segregated into
          G_unsupported and excluded from canonical attribution.
        responsibility: interface
      - claim: >-
          Holonomy defect is computed over a cycle basis of the generator
          multigraph, not over a hand-picked subset of cycles.
        responsibility: correctness
      - claim: >-
          Attribution is emitted per pair as (offset, residual, path,
          locators) and never as a single normalised scalar.
        responsibility: scope
      - claim: >-
          The instrument runs in seconds on the committed corpus and its
          runtime is reported, so that no result is attributed to a truncated
          search.
        responsibility: runtime
    not_applicable_reason: null
  predictions:
    - metric: >-
        unit-connectivity fraction Q1 - share of the 21 canonical frontier
        rows whose declared cost unit is connected, through at least one
        source-supported generator in G, to the unit of at least one other row
        in the same dominance domain
      direction: lower
      minimum_effect: >-
        Q1 at most 0.50, i.e. at least half of the canonical rows remain
        unit-isolated even after a deliberate generator-construction effort
        over the retrieved primary sources. A Q1 above 0.80 falsifies the
        premise that unit isolation is a binding limitation of the current
        ledger.
    - metric: >-
        convention-attributed fraction phi for the SHA-1 full-round
        identical-prefix pair (2^61.2 theoretical GTX-970-equivalent versus
        2^63.1 demonstrated realized effort), raw gap 1.9 bits
      direction: higher
      minimum_effect: >-
        phi at least 0.25, i.e. at least 0.475 of the 1.9 bits attributable to
        declared conversion. phi below 0.05 on this pair AND on the other two
        declared SHA-1 partition pairs falsifies the claim that convention is
        a measurable component of this program's headline gaps.
    - metric: >-
        maximum absolute holonomy defect over a cycle basis of the generator
        multigraph, in bits
      direction: different
      minimum_effect: >-
        Two-sided and both sides informative. A maximum defect below tau = 0.5
        bits supports attack-independence over the tested generators and
        licenses the attribution. A maximum defect above 2.0 bits localises at
        least one attack-dependent pseudo-generator and is reported as a named
        structural finding about the literature's cost units, with the
        offending edge identified.
  minimal_test:
    design: >-
      Stage 0 (no retrieval): run the instrument with G empty over the
      committed canonical rows and verify the frozen reproduction fixture.
      Stage 1: extract, from the primary sources ALREADY retrieved and
      verified by this program (the five sources cited in EV-SYMF-d46055 -
      IACR ePrint 2026/1744, USENIX Security 2020 Leurent-Peyrin, IACR ePrint
      2017/190, IACR ePrint 2011/449, IACR ePrint 2024/1447), every explicit
      statement relating two cost units, with quotation and page-level
      locator. Stage 2: build the generator multigraph, compute a cycle basis,
      and measure holonomy on every basis cycle. Stage 3: compute Q1 and,
      for the three SHA-1 partition pairs named in EV-SYMF-d46055 O-SYMF-3,
      compute phi with residuals. Stage 4: run the two nearby-object controls
      (same-paper same-unit pair must give 0 bits; single-key versus
      related-key pair must remain disconnected). Report all four stages
      whether or not G is non-empty; an empty G is a complete result.
    controls:
      - >-
        Empty-generator baseline (Stage 0) as a frozen regression fixture
        against the committed 21/9 dispositions.
      - >-
        Same-paper, same-unit zero-offset control - the generator set must
        return exactly 0 bits between two rows a single source reports in one
        unit.
      - >-
        Model-separation control - a single-key row and a related-key row must
        remain disconnected under G; connectivity here is an instrument
        failure, not a finding.
      - >-
        Shuffled-label null - randomly permute the unit labels across rows and
        recompute Q1 and holonomy. Under the null, holonomy defects should be
        large and phi meaningless; if the shuffled run produces defects
        comparable to the real run, the real run's consistency is not evidence
        of anything.
      - >-
        Generator-provenance ablation - recompute every reported number with
        G_unsupported included and again with it excluded, and report both, so
        that no attribution silently depends on an unsupported factor.
    required_metrics:
      - "Q1, unit-connectivity fraction over the 21 canonical rows, with the per-row reachable-unit set"
      - "|G| and |G_unsupported|, with per-generator source locator and quoted sentence"
      - "cycle-basis size and the full list of per-cycle holonomy defects in bits, with max and median"
      - "phi and unattributed residual in bits for each of the three declared SHA-1 partition pairs"
      - "same-paper same-unit control offset in bits (must be 0.0)"
      - "single-key versus related-key connectivity indicator (must be false)"
      - "shuffled-label null holonomy distribution (max, median) for comparison"
      - "instrument wall-clock runtime"
  falsification_conditions:
    - >-
      Stage 0 fails - the instrument with G empty does not reproduce the
      committed is_frontier vector and dispositions. The proposal is halted;
      the discrepancy is reported as a defect in either the instrument or the
      committed compilation, and no attribution number is produced.
    - >-
      G is empty or near-empty after Stage 1 over the five already-retrieved
      sources (fewer than 3 source-supported generators). Falsifies the
      mechanism's precondition and yields the named obstruction "published
      symmetric-cryptanalysis costs do not carry source-stated unit relations,
      so cross-unit attribution cannot be built from the literature as
      written", with forward guidance toward re-derivation rather than
      normalisation.
    - >-
      phi below 0.05 for all three declared SHA-1 pairs - convention
      contributes less than 5 percent of the headline gaps and bit-level
      normalisation is unnecessary for these rows.
    - >-
      Maximum holonomy defect exceeds 2.0 bits on a cycle whose generators are
      all source-supported - attack-independence is rejected, and every phi
      computed through the offending edge is withdrawn.
    - >-
      Shuffled-label null produces holonomy defects statistically
      indistinguishable from the real run - the measured consistency is a
      property of the graph's sparsity, not of the literature.
    - >-
      The same-paper same-unit control returns a nonzero offset - instrument
      failure, all cross-paper attributions from that run are void.
  confounders:
    - >-
      Generator selection bias. An analyst who knows the SHA-1 gap is 1.9 bits
      can construct generators that explain it. Mitigation - Stage 1 extracts
      generators from sources BEFORE any pair is chosen for attribution, the
      generator list is frozen with hashes, and the pair list is precommitted
      from EV-SYMF-d46055 O-SYMF-3 rather than chosen after seeing G.
    - >-
      Hardware-equivalence drift. A "GTX-970 SHA-1 equivalent" is a
      measurement on one device and workload; treating it as a unit smuggles
      an attack-dependent factor. This is exactly what the holonomy test
      targets, but it can also be masked if too few cycles pass through the
      generator; report the number of cycles covering each edge.
    - >-
      Sparse graph masking. A generator graph that is a forest has an empty
      cycle space and therefore zero holonomy by construction, which is not
      evidence of consistency. The cycle-basis size must be reported alongside
      every defect statistic, and a forest must be reported as "untestable",
      not as "consistent".
    - >-
      Composition of tolerances. Offsets composed along a path of length k
      accumulate tolerance; a per-generator tau of 0.5 bits over a path of 4
      generators admits 2.0 bits of slack, which can exceed the gap being
      attributed. Report path length with every attribution and refuse
      attribution when accumulated tolerance exceeds the raw gap.
    - >-
      Provenance contamination. A generator inferred from a secondary survey
      would look identical in the artifact to one quoted from a primary
      source; the G / G_unsupported split and the ablation control exist to
      make this visible.
  interpretation_limits:
    - >-
      Scoped to the committed corpus (knowledge/frontiers/symmetric-cryptanalysis.yaml
      at snapshot commit 5fc23783da8a2e62e2b3ab8728e47c48958ce02f) and to the
      five primary sources already retrieved and verified under
      EV-SYMF-d46055. It says nothing about the literature outside that set.
    - >-
      An unattributed residual is not evidence of cryptanalytic superiority.
      It is the part of a gap the declared generators do not explain, and it
      may be convention that no source stated.
    - >-
      A zero holonomy defect over a small cycle basis supports
      attack-independence only over the generators those cycles cover, and
      only at resolution tau.
    - >-
      No attack is reproduced, no complexity is verified, and no published
      claim is confirmed or refuted. The instrument measures relations among
      reported numbers, not the numbers' truth.
    - >-
      The instrument cannot repair a row whose source never stated an axis;
      such rows stay null with their existing null_reason, per the question's
      standing constraint.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Attack-independence of declared generators.) For every generator g in
        G relating cost units u1 and u2, there is a real constant delta(g)
        such that FOR ALL rows r in the corpus whose cost is expressible in
        u1, the same result expressed in u2 has log2 cost equal to log2
        cost_u1(r) + delta(g), uniformly over r, up to a tolerance tau = 0.5
        bits. Consequently the labelled generator multigraph carries a
        consistent potential and every closed walk sums to 0 within
        k*tau for a walk of length k.
      rigorous_support: >-
        Exact when a conversion is a genuine change of unit - unit changes act
        as a free abelian group on log-scaled quantities, so path-independence
        is a theorem, not a hypothesis. This imitates dimensional analysis,
        where the units group acts freely on dimensioned quantities and any
        consistent system of conversions is a cocycle with zero holonomy. The
        heuristic is exactly the assumption that the literature's cost units
        behave as units rather than as attack-parameterised benchmarks; the
        contrasting rigorous fact is Wiener's full-cost position (recalled,
        JoC 17 (2004) 105-124) that processor-step accounting and full cost
        differ by an amount that DOES depend on the algorithm's memory access
        pattern, which shows in advance that H1 must fail for at least some
        unit pairs and makes the location of failure the deliverable.
      validation_plan: >-
        WHAT TO SAMPLE - every closed walk in a cycle basis of the generator
        multigraph built in Stage 1, plus every same-paper same-unit pair
        available in the five retrieved sources (ground truth offset exactly
        0). SCALE - the whole cycle basis (expected small, on the order of 1
        to 20 cycles for a graph of at most a few dozen unit nodes; if the
        basis is empty, report untestable). PREDICTED DISTRIBUTION - all
        defects concentrated at 0 within k*tau; under the shuffled-label null
        the defects should be spread over a range comparable to the spread of
        the raw cost values (tens of bits). COMPARISON - empirical defect
        distribution against the point mass at 0 (real run) and against the
        shuffled-label null distribution, reported as both distributions, not
        a p-value alone. TAIL CHECK - the single largest absolute defect and
        the edge it implicates, reported explicitly, since a single
        attack-dependent generator is exactly a tail event and would be
        invisible in a median. TRANSFER ASSUMPTION, STATED - results transfer
        only to unit pairs actually covered by a cycle; uncovered generators
        are reported as untested and their attributions carry that flag.
    - id: H2
      statement: >-
        (Stability of hardware-equivalence constants.) For a generator derived
        from a hardware or platform equivalence (for example
        SHA1_equivalents_on_GTX970 to SHA-1 compression function calls), the
        source-stated constant is stable across the attacks in the corpus to
        within a spread of at most 0.5 bits, so that a single scalar offset is
        an adequate representation.
      rigorous_support: >-
        None proved here. It imitates the standard practice of area-time (AT)
        cost normalisation in hardware cryptanalysis and the full-cost
        accounting of Wiener (recalled), both of which express an attack's
        cost relative to a fixed reference operation. The rigorous ingredient
        available is weaker but real - within one source, an author's own
        stated conversion is internally consistent by construction, which
        gives a zero-offset ground truth for the same-paper control.
      validation_plan: >-
