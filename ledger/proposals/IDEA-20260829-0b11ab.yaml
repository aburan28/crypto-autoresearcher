    - ref: "Michael J. Wiener, 'The Full Cost of Cryptanalytic Attacks', Journal of Cryptology 17 (2004) 105-124, DOI 10.1007/s00145-003-0213-5"
      provenance: recalled
      claim: >-
        Relied on for the general position that conventional processor-step
        accounting understates attack cost once memory access and wiring are
        charged, so that two published costs stated under different accounting
        conventions are not directly comparable. Specific recalled example:
        Shanks' method costs n^(1/2+o(1)) processor steps but n^(2/3+o(1))
