idea:
  id: IDEA-20260829-0b11ab
  question_id: RQ-SYMF-5ab172
  title: >-
    Measure how many bits of a published symmetric-cryptanalysis gap are
    convention rather than cryptanalysis, by declaring cost-unit conversion
    generators from primary sources and testing whether they close around
    cycles (a unit-holonomy defect test)
  class: measurement
  claim: >-
    For the committed symmetric frontier ledger, the cost figures of rows that
    the schema currently declares mutually incomparable can be embedded in a
    single log2 cost space by a set G of explicitly source-supported
    conversion generators (each generator being a stated relation between two
    cost units, e.g. "SHA1-equivalent on a GTX-970" to "SHA-1 compression
    function calls"), and the resulting instrument yields two measurable
    quantities that no committed artifact currently reports. (Q1) The
    unit-connectivity fraction, the share of canonical frontier rows whose
    declared cost unit is reachable from at least one other row's unit through
    G. (Q2) The convention-attributed fraction phi of a published gap, defined
    for an ordered pair of rows in the same dominance domain as phi = |offset
    contributed by G| / |raw log2 gap|. CONCRETE FALSIFIABLE INSTANCE: for the
    SHA-1 full-round identical-prefix pair recorded in this program's own
    ledger (theoretical 2^61.2 in unit SHA1_equivalents_on_GTX970 versus
    demonstrated 2^63.1 realized effort, EV-SYMF-d46055 observation O-SYMF-3),
    the raw gap is 1.9 bits and the claim is that phi is at least 0.25 for
    that pair, i.e. at least 0.475 bits of the 1.9 are attributable to
    declared unit conversion and not to cryptanalytic difference. The
    instrument is valid only if it is internally consistent, which is testable
    without any cryptanalysis: if every generator in G is attack-independent,
    the composed offset around any closed cycle of conversions is exactly
    zero, so a measured nonzero holonomy defect is a direct rejection of
    attack-independence for the generators on that cycle.
  mechanism: >-
    TRACKED OBJECT. The object followed through the computation is the
    log2 cost vector of a published result expressed in a declared unit basis,
    stripped of all cryptanalytic content. One-step propagation is defined and
    measurable: applying a declared generator g adds a fixed log2 offset
    delta(g) to the relevant coordinate and rewrites the unit label. Nothing
    else about the row changes.
    LOSSY-PROJECTION TEST (algebraic, no compute). The projection row ->
    (log2 cost vector, unit label) discards the attack mechanism, the trail,
    the message-modification structure, the key schedule, and the proof. It is
    strictly lossy: infinitely many distinct attacks map to the same point.
    The discard is compatible with the operation the instrument performs
    precisely when a conversion factor is a property of the unit pair alone
    and not of the attack, because only then does the retained part propagate
    deterministically under G. That compatibility condition is not assumed; it
    is the thing the holonomy test measures, and its failure is the
    interesting outcome. This is why the object is not a change of
    coordinates: a change of coordinates would be exactly invertible for every
    row, whereas an attack-dependent generator makes the offset
    path-dependent and the projection non-functorial.
    WHY THE ALGEBRA GIVES A FREE TEST. Let the declared units be the vertices
    of a multigraph and each source-supported generator an edge labelled by
    its log2 offset. If every offset is attack-independent, the labels define
    a homomorphism from the free group on the edges to (R, +) that factors
    through the cycle space, so the sum of labels around any closed walk is 0.
    The measured deviation from 0 is the holonomy defect, in bits. It is a
    quantitative, per-cycle falsifier of the normalisation, obtainable from
    the papers alone.
    HOW A GAP IS DECOMPOSED. Given two rows in one dominance domain with raw
    log2 costs c1, c2 in units u1, u2, and a path P in the generator graph
    from u1 to u2 with total offset o(P), the convention-attributed part is
    o(P) and the unattributed residual is (c2 - c1) - o(P). The instrument
    reports both, never a single normalised scalar, and never asserts that the
    residual is cryptanalytic progress; it asserts only that the residual is
    what the declared generators do not explain.
    WHAT MAKES THIS DIFFERENT FROM THE COMMITTED SCHEMA. Schema v2's
    dominance_rules resolve unit mismatch by refusal ("Null, unresolved,
    qualitative, compound, or incompatible units never create a favorable
    ordering by inference"). Refusal is sound and produces zero comparisons
    and zero measurements. This proposal keeps the refusal as the default and
    adds an auditable, source-bound, tolerance-bounded exception whose
    consistency is itself testable.
  tracked_object: >-
    The unit-labelled log2 cost vector of a published result, propagated by
    declared source-supported unit conversion generators.
  lossy_projection_test: >-
    PASSES conditionally. The projection discards attack mechanism entirely
    (strictly lossy, non-invertible) and retains only dimensional content.
    Deterministic propagation holds exactly when generators are
    attack-independent; that condition is the measured quantity (holonomy
    defect), not an assumption. If the defect is zero everywhere the object is
    a valid new lens; if the defect is large the object has located the exact
    place where "cost unit" is not a unit at all but a hidden attack
    parameter, which is a reportable structural finding about the literature.
  novelty_status: unverified
  citations:
    - ref: RQ-SYMF-5ab172
      provenance: internal
      claim: >-
        The research question's constraint that unknown or unstated costs
        remain explicit nulls and prevent a dominance claim where the missing
        axis matters, and its cost_axes list (time, data, memory,
        preprocessing, queries, success_probability).
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full record read
        (ledger/questions/RQ-SYMF-5ab172.yaml, 47 lines).
    - ref: knowledge/frontiers/symmetric-frontier-schema.yaml
      provenance: internal
      claim: >-
        Schema crypto.autoresearch.symmetric_frontier.v2 dominance_rules
        including "A qualitative value such as negligible is not ordered
        against a numeric exponent without a source-supported bound or
        normalization", and the complete required_row_fields list, which
        contains no field capable of expressing a unit conversion or a
        convention attribution.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, full file read
        (137 lines).
    - ref: knowledge/frontiers/symmetric-cryptanalysis.yaml
      provenance: internal
      claim: >-
        Row LEGACY-SHA1-IP-COLLISION-THEORY carries time value 2^61.2 in unit
        SHA1_equivalents_on_GTX970 with data, memory, preprocessing and
        success_probability all null with null_reason not_stated_by_source;
        row LEGACY-SHA0-COLLISION-DEMO carries time 2^33.6 in unit
        SHA0_hash_function_calls_measured. Two distinct, non-intercomparable
        time units inside one 21-row canonical set.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, PARTIAL READ - header
        blocks (scope, snapshot_binding, counts, headline_boundaries) and the
        first two canonical rows read in full (lines 1-160); the remaining
