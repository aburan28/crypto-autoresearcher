idea:
  id: IDEA-20260809-2976d8
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Score the standard lattice estimator against this goal's own certified
    recoveries before any of its predictions are used as a baseline
  class: control
  claim: >-
    Every margin statement in the lattice world is mediated by an estimator whose
    predictions are rarely scored against completed recoveries at the same
    parameters. The claim is that this goal, because it produces certified
    recoveries across a sweep, can score the estimator directly; that the score
    is a per-cell ratio of predicted to observed effort; and that the ratio's
    trend across the sweep — not its value at any one cell — is what determines
    whether estimator-based statements elsewhere in the campaign are usable.
  mechanism: >-
    For each cell where recovery succeeded, record the block size and effort
    actually required, run the estimator at the same parameters, and compare.
    The comparison is per phase and per cell, with the estimator's own
    assumptions declared.
  why_not_a_renamed_known_approach: >-
    Estimator validation exists in the literature at specific parameter points.
    Doing it as a control INSIDE a campaign that is about to use estimator
    outputs, with a pre-declared usability criterion, is the methodological
    content.
  predictions:
  - observable: ratio of estimator-predicted to observed block size at recovery
    metric: ratio per cell
    predicted: Within a small factor, with a systematic direction. A ratio with no consistent direction across the sweep means the estimator cannot be corrected and its outputs must not be used as baselines here.
  - observable: whether the ratio depends on q across the transition
    metric: trend of ratio versus log q
    predicted: >-
      A dependence is expected precisely because the estimator does not model the
      dense sublattice event; the size of that dependence is a direct measure of
      the estimator's blind spot for this goal's object.
  minimal_test: >-
    Score every successful cell from the main sweep, report the ratio
    distribution and its trend, and state the usability criterion before scoring.
  controls:
  - 'PRE-DECLARED CRITERION: the usability threshold is committed before the scoring run, since a threshold chosen afterwards always passes.'
  - 'RANDOM-LATTICE ANCHOR: score the estimator on matched random lattices too; the estimator is expected to do better there, and the gap between the two scores isolates the blind spot.'
  falsification_conditions:
  - No consistent direction in the ratio, in which case estimator outputs are excluded from this goal's baselines.
  - The estimator scores identically on NTRU and matched random lattices, which would mean the event is invisible to the observable used for scoring.
  interpretation_limits: >-
    Scores are for the parameter range actually run. An estimator that scores
    well at toy dimension is not thereby validated at deployed dimension.
  sota_delta: 'No attack. Delta: a scored baseline instrument rather than an assumed one.'
  dominated_by: Not dominated by any corpus record; the ML-KEM goals use estimators for a different structural setting.
  estimated_cost: Implementation small; compute negligible on top of the main sweep.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for estimator scoring: adjacent ML-KEM records exist for core-SVP, not for this control. WEB NOT CHECKED.'
  source_refs:
  - Lattice estimator documentation and its underlying cost models -- REQUIRED READS, NOT YET READ.
