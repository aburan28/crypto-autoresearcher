idea:
  id: IDEA-20260904-3c7a91
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SATIC-1ae57a
  title: >-
    The pdp CNF-XOR model admits no above-leaf pruning: the "SAT solver" is a
    complete enumerator of V^m modulo S_m with a unit-propagation leaf test, so
    the search exponent is exactly ml - log2|G| and no solver engineering can
    move it

  class: mechanism

  claim: >-
    SCOPE: symmetrized S_{m+1} pdp over F_{2^n}, Weil-descended to F_2, in the
    CNF-XOR model of SRC-SATIC-TRIMOSKA-2019 section 3.2 and in the
    non-symmetrized chained/direct model built by src/semaev_tree.py; m = 3 and
    m = 4; l in 6..9; DPLL/CDCL solvers branching on the ml core variables.
    CLAIM TIER toy. NO ATTACK, NO EXPONENT IMPROVEMENT, NO PRIME-FIELD TRANSFER.

    (A) THE STRUCTURAL CLAIM. In this model, unit propagation from a PARTIAL
    assignment of the ml core variables c_{i,j} essentially never produces a
    conflict: conflicts occur only at, or within O(1) levels of, the leaf depth
    d = ml. Therefore the number of conflicts a complete DPLL/CDCL search
    reports on an UNSATISFIABLE instance is

        N_conf(l, m) = (1 +- eps) * 2^{ml} / |G|,     eps <= 0.05,

    where |G| is the order of the symmetry group the solver quotients by
    (|G| = 1 with no symmetry breaking, |G| = m! with the lexicographic
    tree-pruning of section 4 of the source). The constraints coming from the
    curve do NOT prune the search; they only decide leaves.

    (B) THE CONSEQUENCES, EACH INDEPENDENTLY FALSIFIABLE.
      B1. N_conf is INDEPENDENT of n at fixed (l, m), to within 1%, across any
          range of n for which the model is defined.
      B2. N_conf is INDEPENDENT of the curve, of the target point R, of the
          field basis alpha and of the instance seed, on UNSAT instances, to
          within 1%.
      B3. On SATISFIABLE instances the conflict count is a random variable with
          mean approximately N_conf/2 and a large coefficient of variation,
          because the planted solution sits at a uniformly random position in a
          complete enumeration.
      B4. The pruned fraction 1 - N_conf/(2^{ml}/|G|) SHRINKS toward zero as l
          grows and does not grow as n (the number of equations) grows. A
          constraint set whose pruning power falls as more constraints are added
          is the canonical artifact tell of docs/inventor-protocol.md section 3,
          and here it is being asserted as the FINDING rather than feared as an
          artifact.
      B5. Two solvers that both branch on the ml core variables report conflict
          counts within a few percent of each other, whatever their clause
          learning, restart policy or XOR module. Any wall-clock difference
          between them is therefore entirely a cost-per-conflict difference.

    (C) THE CEILING, WHICH IS THE POINT OF THE RECORD. If (A) holds, the pdp
    solving exponent under this model is exactly ml - log2|G| bits of complete
    enumeration and is not reachable by better search. The only levers that move
    it are (i) reducing ml (smaller factor-base dimension l, or smaller arity m,
    both of which cost decomposition probability), and (ii) enlarging |G| (the
    m! symmetry of the source; the 2-torsion / 4-torsion action on the factor
    base of Galbraith-Gebregiyorgis, which the source names as its own open
    problem, would multiply |G| by the order of the induced orbit action). This
    converts an open-ended solver-engineering question into a closed arithmetic
    one, and it makes an out-of-sample prediction for every future variant
    before it is run.

    (D) MOTIVATING ARITHMETIC, DERIVED BY THIS AGENT FROM THE AUTHORS' REPORTED
    NUMBERS AND NOT REPRODUCED ANYWHERE. Dividing the UNSAT conflict counts of
    Table 3 of the frozen source (WDSat with symmetry breaking, m = 3) by
    2^{3l}/6 gives, at l = 6,7,8,9,10,11 respectively, ratios
    1.0042/1.0079, 1.0052/1.0021, 1.0015/1.0026, 1.0012..1.0009,
    1.00035..1.00062, 1.00031..1.00037. Dividing the Table 2 UNSAT counts
    (WDSat with Prop. 1, NO symmetry breaking) by 2^{3l} gives 0.9715, 0.9746,
    0.9885, 0.9857, 0.9934, 0.9945. The same Table 2 rows for CMS with Prop. 1
    give 0.995, 0.991, 0.9907, 0.9871, 0.9987, 1.0004. At l = 9 the four
    reported n values 37, 47, 59, 67 give UNSAT counts spanning a ratio of
    1.00069. THESE ARE THE AUTHORS' NUMBERS ON THE AUTHORS' HARDWARE; the
    division is this agent's arithmetic; nothing here is a measurement made in
    this repository, and no timing ratio is formed. The arithmetic is recorded
    as the REASON to run the experiment, never as its result.

  mechanism: >-
    WHY THERE IS NO ABOVE-LEAF PRUNING. Proposition 1 of the source (claim C1)
    says the ml variables c_{i,j} form what the SAT literature calls a STRONG
    BACKDOOR with respect to unit propagation: every total assignment of them
    reduces the formula to a unit-propagation decision. The proposition is
    stated for TOTAL assignments, and the source draws only the upper bound
    2^{ml} from it. This idea is about the complementary and unstated fact:
    what a PARTIAL assignment propagates.

    Follow the four clause sets of section 3.2. A substitution variable c'
    standing for a conjunction c_{i1,j1} AND ... AND c_{ik,jk} is forced to
    FALSE as soon as any one of its factors is false, but is forced to TRUE only
    when ALL k factors are true; a d' variable over the d_{i,j} is one further
    level removed, and the d_{i,j} themselves are XOR-determined by the c and c'
    variables (the E-X-relation set). The F-set parity constraints -- the only
    clauses carrying the curve, since they are the Weil-descended coefficients
    of S'_{m+1} -- are XORs over d and d' variables. A single F-set XOR clause
    becomes unit, and can therefore fire or conflict, only when every one of its
    literals but one is determined. Under the block branching order the source
    requires (leading bit of x_1 through trailing bit of x_m), the top-degree
    monomials of S'_{m+1} touch all m blocks and so are undetermined until the
    LAST block is finished. Hence the F-set is inert until depth ml - O(l), and
    the residual pruning within the last block is the 1-3% deficit visible in
    (D).

    In one sentence: the model achieves its minimality (ml variables) by pushing
    all of the curve's content into monomials that are functionally determined
    only at the bottom of the tree, and that is exactly the property that
    destroys early conflict detection. MINIMAL BACKDOOR AND EARLY PROPAGATION
    ARE IN TENSION, and the source's headline is the first half of that trade
    reported without the second.

    THE LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2). The tracked
    object proposed here is the CONFLICT-DEPTH HISTOGRAM: the map from a search
    node to the integer depth in the core-variable order at which the solver
    reported a conflict, accumulated over the run. It is genuinely lossy -- 2^d
    distinct partial assignments collapse to the single value d, and which
    variables took which values is discarded entirely. It is discarded
    COMPATIBLY with the target's operations, because depth is the one quantity
    that DPLL's decide/propagate/backtrack triple acts on deterministically:
    decide increments it, backtrack sets it to the asserting level, and neither
    consults the identity of the variables. So the retained part propagates
    deterministically and the projection is a new object, not a change of
    coordinates. Contrast the projection that fails the test: "the current
    partial assignment restricted to the core variables" loses nothing, because
    Proposition 1 says the rest is recoverable from it -- that is a change of
    coordinates and is why it cannot be the object.

  novelty_status: unverified

