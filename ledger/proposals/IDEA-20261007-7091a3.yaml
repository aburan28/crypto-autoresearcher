idea:
  id: IDEA-20261007-7091a3
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  title: >-
    Tangent intercept image versus the slope image on y^2 = x^3 + 2x + 2
    over F_13
  class: representation
  claim: >-
    Toy instance only, prediction fixed before any run. Let E be
    y^2 = x^3 + 2x + 2 over F_13. For each affine point P with
    y(P) not 0, let lambda(P) be the tangent slope
    (3 x(P)^2 + 2) times the inverse of 2 y(P), and let mu(P) be the
    intercept y(P) - lambda(P) x(P). Let N_lambda be the number of
    distinct slopes and N_mu the number of distinct intercepts.
    Prediction: N_lambda minus N_mu is at least 3. Let mu_shift be
    y(P) - (lambda(P)+1) x(P) and let N_shift be its image size.
    Prediction: N_lambda minus N_shift is at most 1. If the shifted
    intercept also drops by at least 3, the drop is the formula and
    the claim fails. This claim does not say an ECDLP exponent changes.
  mechanism: >-
    The retained coordinate is the tangent intercept mu, an affine
    function of the slope and the point. The operation is reading the
    tangent line at P, not translation by a 2-torsion point and not a
    product of two x-coordinates. The slope still sees y(P). Dropping
    from the slope to the intercept can collide lines that the slope
    separates. The shift lambda maps to lambda+1 inside the same
    intercept formula is the null operation. Discarded: the point P
    itself and the second intersection of the tangent with E. No
    summation polynomial is formed and no walk is run.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R3 includes representations that are not the Kummer line of one
        point. This proposal measures an intercept image.
      verified_by: >-
        coordinator session 2026-10-07 opened
        ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic discrete logarithm needs Omega(sqrt(p)) group
        operations. This proposal claims exponent difference 0.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials are the decomposition framework. This
        proposal does not form S_m.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
  assumptions:
    - >-
      4 A^3 + 27 B^2 is nonzero modulo 13 for A = 2 and B = 2, so the
      cubic is nonsingular. The test recomputes the residue.
    - The characteristic is not 2, so the tangent slope has denominator 2 y.
  proof_search_map:
    not_applicable_reason: >-
      This is one image comparison at p = 13, not a proof that an
      exponent changes.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: N_lambda minus N_mu
      direction: higher
      minimum_effect: at least 3
    - metric: N_lambda minus N_shift
      direction: different
      minimum_effect: at most 1
  minimal_test:
    design: >-
      List every affine point by testing squares. Skip y = 0. Compute
      each slope by the chord-and-tangent formula, then both
      intercepts. Score the two differences only after both images
      exist.
    controls:
      - >-
        Shift the slope by 1 inside the intercept formula and keep the
        same points.
      - >-
        Record the discriminant residue. A zero residue is an invalid
        run.
    required_metrics:
      - N_lambda
      - N_mu
      - N_shift
      - N_lambda minus N_mu
      - N_lambda minus N_shift
  falsification_conditions:
    - N_lambda minus N_mu is less than 3.
    - N_lambda minus N_shift is at least 3.
    - A zero discriminant or a zero denominator is an invalid run, not support.
    - A timeout is infrastructure, not a falsification and not support.
  confounders:
    - Points with y = 0 have no tangent slope of this shape and are excluded. Their count is reported.
  interpretation_limits:
    - A confirmed gap is a count at p = 13. It is not an exponent improvement.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On this curve the intercept map collides at least three slopes
        that the slope coordinate separates, while adding 1 to the
        slope before the same formula collides at most one.
      rigorous_support: >-
        The tangent formula is a rational function. No theorem opened
        in this session bounds the intercept image.
      validation_plan: >-
        Enumerate every eligible affine point at p = 13, not a sample.
        Compare N_mu with N_lambda and compare N_shift with N_lambda.
  target_complexity:
    time_exponent: p^{1/2} unchanged
    memory_exponent: O(1) beyond the prime-field point list
    best_known: >-
      Pollard rho in Theta(p^{1/2}) group operations, matching
      KR-RHO-13bf67 up to the constant
    hidden_overhead: >-
      None claimed. No asymptotic algorithm is proposed.
    tradeoff_note: >-
      The measurement stores one slope per point and does not define a
      discrete-logarithm tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    KR-RHO-13bf67 dominates any exponent reading: Omega(p^{1/2}) against
    exponent delta 0. KR-IC-5a43e5 dominates any reading of the tangent
    as a summation polynomial. Neither row states this intercept gap.
  sota_delta: >-
    Exponent difference 0 against Omega(p^{1/2}). Counted delta: slope
    image exceeds intercept image by at least 3 at p = 13, while the
    shifted intercept drops by at most 1.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-5b1c0a
      - KR-RHO-6654ba
      - KR-IC-5a43e5
      - KR-IC-46d822
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          S_2 is x1 minus x2. This proposal never forms S_m. The
          counted delta is an intercept image gap of at least 3.
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: orthogonal
        delta: >-
          The negation map is a rho walk on pairs {P, -P}. This
          proposal does not walk and claims no square-root-of-2 factor.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for tangent intercept
        - PR 1962 and PR 1960 idea titles
      web: []
      blocked: []
