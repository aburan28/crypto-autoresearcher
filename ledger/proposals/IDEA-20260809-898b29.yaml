idea:
  id: IDEA-20260809-898b29
  question_id: RQ-ECDLP-002
  added: '2026-08-09'
  title: ROADMAP Phase 4 promises four research programs; three have questions, hypotheses and
    evidence and the fourth was retired by one line of prose in a markdown synthesis that is not
    a ledger record, cites no evidence, and names no successor -- while the deterministic baseline
    it assumed exists does not
  class: measurement
  claim: 'ROADMAP.md Phase 4 names four programs. 4.1 isogeny-neighborhood audit maps to RQ-ISO-001
    / H-ISO-001 / EV-ISO-001; 4.2 representation search to RQ-REP-001 / EV-REP-001 / EV-REP-002;
    4.4 predicate and decomposition channel tests to RQ-NCP-001 / H-NCP-001 / EV-NCP-001. Item
    4.3 reads ''Pair-selection learning: Establish deterministic Buchberger baselines. Compare
    heuristic, imitation-learning, and reinforcement-learning policies. Separate step-count gains
    from arithmetic-operation gains.'' Verified at HEAD: ''reinforcement learning'' and ''imitation
    learning'' occur in ZERO records anywhere under ledger/, knowledge/ or experiments/, and none
    of the 66 RQ titles concerns solver policy or learned search order. The only disposition on
    record is one line of prose in ledger/SYNTHESIS-20260716.md: ''Pair-selection learning (Phase
    4.3): at d_reg=2 only step-count constants remain; prior low (corpus SAT/ML found no scale
    win).'' That file is a markdown synthesis, not a coordinator_decision -- it carries no ID,
    no decided_by, no target_ids and no knowledge_promotion, so nothing in the harness treats
    it as a closure and nothing surfaces it to a later session. It cites no evidence ID, states
    no budget, no test boundary, no remaining uncertainty and names no successor or revisit condition
    -- the five things CLAUDE.md rule 9 requires of any deprioritization. Its stated reason is
    a SATURATION ARGUMENT, which docs/inventor-protocol.md treats as a hypothesis about the search
    rather than a reason to decline and names as premature closure. Separately, IDEA-20260807-899c5e
    and EXP-INSTR-f1aebb both record that the harness''s actual solver IS ''Buchberger with a
    pair-selection heuristic'', that it ''is not F4 and not F5'', and that it does not expose
    the degree the computation reached -- so the deterministic Buchberger baseline 4.3 requires
    does not exist either.'
  mechanism: 'DO NOT START WITH LEARNING; START WITH THE BASELINE THE CLOSURE ASSUMED EXISTS.
    Establish a deterministic Buchberger baseline on the frozen Semaev fixtures already used by
    EXP-INSTR-f1aebb, instrumented for BOTH axes ROADMAP 4.3 names -- S-pair step count and F_p
    arithmetic-operation count -- since the whole point of 4.3 is that those can move in opposite
    directions and the corpus has never separated them. Then run the cheapest possible discriminator:
    sweep the three standard deterministic strategies (normal, sugar, degree-lex-first) and measure
    the SPREAD. If the spread across hand-written strategies is a constant factor, the closure
    was right and now has an evidence record with a stated boundary instead of a one-line prior
    -- a perfectly good outcome, and it should be filed as the successor the closure never named.
    If the spread is NOT a constant factor, a learned policy has room the saturation argument
    denied, and the 2026-07-16 prior was calibrated on a different problem class (SAT/ML at scale)
    than the one at hand.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'RQ-MODEL-e61cb2 is Phase 4.2 (representation search: does the MODEL change the degree),
      not Phase 4.3 (does the SEARCH ORDER change the cost at a fixed model). RQ-INSTR-f8faa0
      is about whether instruments detect planted signals, not solver policy. IDEA-20260807-899c5e
      is the sole record mentioning pair selection at all and it does so as an incidental property
      of the meter-card instrument it proposes, not as a research program. Verified: exactly one
      proposal among 459 mentions pair selection, and it is that one.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: learned policies, reinforcement
      learning and imitation learning -- deliberately, because the baseline they would be compared
      against does not exist. The object is the DETERMINISTIC SOLVER''S PAIR-SELECTION SPREAD.'
    tracked_object: Per strategy, the pair (S-pair step count, F_p arithmetic-operation count)
      on frozen Semaev fixtures.
    one_step_propagation_rule: Changing the selection strategy changes both counts; ROADMAP 4.3's
      whole point is that they can move in OPPOSITE directions, and the corpus has never separated
      them.
    newness_score: Nil as mathematics -- deterministic Buchberger strategies are textbook. The
      content is that a declared ROADMAP program was retired by one line of prose in a markdown
      synthesis that is not a ledger record, cites no evidence and names no successor.
  lossy_projection_identifiability_audit:
    projection: a Groebner computation -> the (steps, operations) pair.
    what_is_discarded: The basis itself and everything about the ideal.
    is_it_only_a_change_of_coordinates: 'NO -- two strategies reaching the same basis by different
      routes have different pairs, which is exactly the quantity at issue. Honest caveat: a WEAK
      object, two counters, and it bears on a constant factor rather than an exponent.'
    mirror_failure_check: CHECKED. The spread must be able to be a constant factor -- which is
      what the retirement assumed. If it is, the closure was right and now has an evidence record
      instead of a one-line prior, which is a perfectly good outcome.
  null_object_control:
    primary_null: 'THE CONSTANT-FACTOR NULL IS THE EXPECTED RESULT AND MUST BE ACCEPTABLE: if
      the spread across hand-written strategies is a constant factor independent of instance size,
      the 2026-07-16 retirement was correct and should be re-filed as an evidenced negative with
      a stated boundary.'
    secondary_nulls:
    - Same fixtures as EXP-INSTR-f1aebb, so the instrument is already characterised.
    - Report both axes separately; a strategy that wins on steps and loses on operations is the
      case ROADMAP 4.3 exists to detect and would be invisible to either axis alone.
  assumptions: []
  predictions:
  - metric: spread in arithmetic-operation count across three deterministic strategies as instance
      size grows
    direction: different
    minimum_effect: Growth with instance size rather than a constant factor would mean a learned
      policy has room the saturation argument denied.
  minimal_test:
    design: Establish a deterministic Buchberger baseline on the frozen Semaev fixtures, instrumented
      for both axes; sweep normal, sugar and degree-lex-first selection; measure the spread as
      a function of instance size.
    controls:
    - constant-factor null
    - two-axis separation
    - EXP-INSTR-f1aebb fixture reuse
    required_metrics:
    - steps and operations per strategy per fixture
    - spread as a function of instance size
    - whether the two axes ever disagree in sign
  falsification_conditions:
  - 'The spread is a constant factor: the retirement was right, and the deliverable is the evidence
    record with a stated boundary that the one-line prose never had.'
  - 'The two axes never disagree in sign: ROADMAP 4.3''s premise is wrong and the program can
    be retired on its merits rather than on a prior.'
  - 'The harness solver cannot be instrumented for arithmetic-operation counts: recorded as an
    instrumentation limit, and it is the same limit IDEA-20260807-899c5e''s meter-card work needs
    solved anyway.'
  confounders:
  - The harness solver is Buchberger with a pair-selection heuristic, not F4 or F5, and does not
    expose the degree reached -- so 'deterministic baseline' means this solver's, not a canonical
    one.
  - Toy Semaev fixtures may not exhibit the spread that larger instances would.
  - Three hand-written strategies is a small sample of the strategy space; a null across them
    does not bound what a learned policy could do, and the record must say so rather than over-closing.
  interpretation_limits:
  - Toy scale, one solver. No exponent claim; this bears on a constant factor at most.
  - This record deliberately does NOT propose a learned policy. It builds the baseline such a
    proposal would need.
  heuristic_assumptions:
  - id: HEUR-PSEL-1
    statement: Spread across three hand-written deterministic strategies bounds what strategy
      choice can buy.
    rigorous_support: None, and it is probably a weak bound -- a learned policy could exceed the
      hand-written spread.
    validation_plan: State it as a lower bound on the available room, never as a ceiling.
  target_complexity:
    time_exponent: No exponent claim. Bears on the constant factor of the Groebner stage, which
      FINDING-PF-IC-001 says is not the dominating stage anyway.
    memory_exponent: Reported per strategy.
    best_known: The harness's current pair-selection heuristic.
    hidden_overhead: Instrumentation cost for operation counting.
    tradeoff_note: Even a favourable spread is a constant-factor result in a non-dominating stage,
      and the record says so up front.
  dominated_by: Pollard rho at exponent 1/2 for the end-to-end problem; no attack row is added.
  sota_delta: ZERO on every attack axis; no attack is proposed. Converts a ROADMAP promise that
    silently expired into either an evidenced negative with a stated boundary or a live lane,
    and produces the deterministic solver baseline IDEA-20260807-899c5e's meter-card work needs
    anyway. It is also the cleanest available test of whether this program's NON-RECORD PROSE
    can silently retire a declared program -- a failure mode that, if real, applies to every other
    synthesis file in the repository.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 0.9 that the baseline is establishable on existing fixtures. 0.7 that
    the spread is a constant factor, vindicating the retirement and converting it into an evidenced
    negative. 0.2 that it grows with instance size, which would reopen a declared ROADMAP program.
    0.4 that the arithmetic-operation instrumentation needs work first.
