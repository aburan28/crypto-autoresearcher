    - metric: G on direct_t3 relative to chain_t3
      direction: lower
      minimum_effect: "direct needs about n^2/2 blocks, so K* >= n^2/2 and G_direct < G_chain"
  minimal_test:
    design: >-
      Stage 0 (zero compute) block counts and K* per presentation. Stage 1 n=8
      identity. Stage 2 n 10 and 12, D 3 and 4, four presentations, 8 targets, 3
      seeds, reporting C_struct, C_red, C_sel, C_res separately.
    controls:
      - A random structural system plus random affine pencil, same degree histogram.
      - B real structural system plus fresh random non-affine target block.
      - The fresh and batched arms of EXP-SBRG-60c55e on the same targets.
    required_metrics: [C_struct, C_red, C_sel, C_res, s_red, G, K_star, NF density, peak RSS]
  falsification_conditions:
    - identity_mismatch_bits > 0 in any cell (instrument defect, halt).
    - G < 1.1 in every valid chain cell (reduction is not the bottleneck).
    - G_real within 10 percent of control A everywhere (generic bookkeeping, nothing Semaev-specific).
  confounders:
    - NF fill-in can make selection costlier than reduction; that is the measurement.
    - Guard skips are failed_infrastructure; n=12 D=5 is guard-blocked (IDEA-20260829-cb4fd5).
  interpretation_limits:
    - Toy binary fields, XOR counts. No exponent; G^{2/(m+1)} through the two-term optimum is a constant.
  heuristic_assumptions:
    - id: H1
      statement: NF rows have target-independent density d_q, so C_sel ~ (n/2)*rows_T*q*d_q/64, and C_res has coefficient of variation below 0.25 across targets.
      rigorous_support: NF linearity and exact affinity; imitates random sparse fill-in and rank concentration for random affine pencils.
      validation_plan: Measure d_q and CV on 8 targets x 3 seeds per cell against the model, report the worst target; no transfer past n 12.
  target_complexity:
    time_exponent: "Unchanged: n^{O(D)} per attempt divided by G <= 1/(1-s_red); fully charged a constant G^{2/(m+1)}."
    memory_exponent: "Precompute (n+1)*rows_T*q bits = n^{2D+O(1)}, independent of B (explicit table: B^{t-1})."
    best_known: Pollard rho 0.886*sqrt(N), O(1) memory (KR-RHO-13bf67); F4 trace replay (KR-IC-f3da82).
    hidden_overhead: Precompute equals n+1 target-equivalents of reduction.
  dominated_by: Pollard rho on every axis; no attack claimed.
