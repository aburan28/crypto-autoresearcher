  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Target-affine pencil: n+1 precomputed reduced direction blocks make per-target
    reduction against the structural carrier an XOR selection; the measured
    reduction share is the null the batch-reuse gate lacks
  class: algorithm
  claim: >-
    (A) EXACT. The closing block S_3(u,x,r) = r^2(u+x)^2 + r*u*x + u^2x^2 + b is
    F_2-affine in the n bits of r, so M_D(r) = M_0 + sum_i r_i M_i with M_i
    independent of r, and S_struct rows do not involve r (chained and balanced
    presentations; direct S_{t+1} has bit-degree up to t-1 in r). (B) ALGORITHM.
    Build the RREF carrier of S_struct once; compute NF(M_0), NF(M_1..M_n) once (NF
    is linear); reduced target rows for any r are NF(M_0) plus the sum of NF(M_i)
    over set bits of r. No pivot search, no elimination against S_struct. Break-even
    batch K* = (n+1)/(1 - C_sel/C_red) >= n+1. (C) LEMMA, zero compute. The pencil
    has trivial kernel: nonzero delta gives M(delta) = delta^2(u+x)^2 + delta*u*x,
    which vanishes at a structural solution iff u*x = delta(u+x)^2; so no
    translation period comes from the rows at any D and the channel is a constant.
    (D) CLAIM. Online gain G = (C_red+C_res)/(C_sel+C_res) <= 1/(1-s_red), s_red the
    share of fresh per-target XORs spent reducing target rows against the carrier.
    Prediction G >= 1.5 on chain_t3 and chain_t4, n in {10,12}, D in {3,4}.
    s_red < 1/3 makes the row-partition ceiling of IDEA-20260829-fa8235 tight.
  mechanism: >-
    PAIR. R1 (F_2 bit coordinates of x after Weil descent), Sigma = additive
    translations r -> r+delta of the target bit vector (not group translation).
    Trichotomy: coordinate-dependent. LOSSY-PROJECTION TEST. The object is the
    pencil modulo the structural row space; it discards structural rows and
    pivots; the discard commutes with Sigma exactly since NF is linear and
    M_D(r+delta) = M_D(r) + sum delta_i M_i. BEYOND REPLAY. KR-IC-f3da82 replays a
    pivot schedule; Lemma 2 of experiments/EXP-CERTBIN-4e92d7/derivation-note-replay-forms.md
    shows a full-matrix schedule survives only on a coset of dimension n-K_rank
    (one target at K_rank = n, measured at m = 2 with no structural rows). Here
    structural pivots are r-independent (retention 1) and the tail is linear.
    Factor base: explicit F_2-subspace, inside the scoped-out class of KN-OPEN-020,
    no escape claimed. Stage: relation decomposition. Priced by s_red and K*.
  novelty_status: unverified
