  predictions:
    - metric: pencil_gain_G (median fresh online XORs / pencil online XORs, 8 targets)
      direction: higher
      minimum_effect: ">= 1.5 on chain_t3 and chain_t4, n 10 and 12, D 3 and 4"
    - metric: identity_mismatch_bits (pencil rows vs direct NF, 200 targets per cell)
      direction: lower
