idea:
  id: IDEA-20260807-631e80
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    POINT-LEVEL RANDOM SELF-REDUCTION INSIDE AN ISOGENY CLASS BY SMALL-ELL ELKIES
    WALKS: measure the mixing constant c in "L = c*log(p) steps to uniformity" and
    the per-step transport cost, so that any weak-curve finding in L1 CASCADES to
    the whole class with a MEASURED polylog overhead instead of an asserted one --
    and, symmetrically, so that a within-class variance finding can be priced
    against the T5 reachability dichotomy before it is called an attack
  class: composition

  claim: >-
    (A) THE REDUCTION, STATED WITH ITS QUANTIFIERS. Let E be an ordinary curve over
    F_p with prime-order subgroup G = <P> of order N, Q = [k]P. Let
    ell_1, ..., ell_L be Elkies primes (each <= 13), and let
    Phi = phi_L o ... o phi_1 be the composition of the corresponding F_p-rational
    Vélu isogenies. By the kernel-or-injective dichotomy (IDEA-20260807-053a55),
    each phi_i is injective on the image of G because gcd(ell_i, N) = 1, so Phi is
    injective on G and
      Phi(Q) = [k] Phi(P),   with the SAME k.
    Therefore (E_L, Phi(P), Phi(Q)) is an ECDLP instance on a DIFFERENT curve of the
    SAME class with the SAME secret, and any solution pulls back for free. If the
    walk mixes -- i.e. if E_L is close to uniform in the class after L steps -- then
    a WORST-CASE instance on E has been converted into an AVERAGE-CASE instance on a
    random curve of the class, at a cost of L transports.
    CONSEQUENCE (the cascade, which is why this is worth doing): if ANY property of
    a curve makes the ECDLP measurably cheaper there, and that property holds on a
    non-negligible fraction of the class, then the reduction makes EVERY instance in
    the class cheaper by the same factor up to the transport overhead. That is
    DECOMPOSITION.md T2 made EFFECTIVE and PRICED rather than merely asserted.

    (B) WHAT IS ALREADY KNOWN, STATED FIRST SO NOTHING IS CLAIMED THAT ISN'T NEW.
    This reduction is not new. Jao, Miller and Venkatesan (KN-LIT-237, recorded in
    this corpus at `confidence: reported` from its abstract) construct expander
    graphs from Cayley graphs of narrow ray class groups under GRH and state that
    "the graph of small prime degree isogenies between ordinary elliptic curves
    achieves non-negligible eigenvalue separation", explaining "the relationship
    between the expansion properties of these graphs and the security of the
    elliptic curve discrete logarithm problem." DECOMPOSITION.md T5 records the same
    thing as the campaign's central open item: the crater of the ell-volcano is a
    Cayley graph of Cl(O) and is a rapid mixer under GRH, so a uniformly random
    curve in the class is reachable in O(log p) steps. THIS RECORD CLAIMS NO
    THEOREM. It claims a MEASUREMENT: the constant hidden in O(log p), the
    per-step cost in group and field operations, the fraction of curves from which
    the walk is even startable (curves with no Elkies prime in {3,...,13} have no
    cheap step available), and the empirical mixing profile at toy scale where the
    class can be enumerated exhaustively and the true stationary distribution is
    therefore KNOWN rather than assumed.

    (C) WHY A MEASURED CONSTANT IS NOT A COSMETIC IMPROVEMENT ON AN ASYMPTOTIC.
    Three concrete decisions in this campaign depend on the constant and cannot be
    made without it.
      1. L1's DECISION RULE. If L1 finds within-class variance in a cost functional,
        the immediate question is whether a better curve is REACHABLE. T5's
        dichotomy says goodness is usable only if it is common enough to hit by
        random walking or locally detectable. "Common enough" is a statement about
        the mixing constant and the goodness density jointly; without c the
        dichotomy cannot be evaluated on any concrete finding.
      2. THE CASCADE'S PRICE. A speedup factor s on a fraction f of the class
        cascades to a speedup of roughly s on ALL of it only if the expected number
        of walk restarts, about 1/f, times the per-restart cost L*(cost per step),
        is small against the attack cost itself. That is an explicit
        per-attempt-cost x inverse-success-probability bookkeeping, and every term
        in it except s and f is what this record measures.
      3. THE HONEST NEGATIVE. If the measurement shows the transport overhead is
        LARGE relative to toy-scale attack costs, then even a real within-class
        variance would not be exploitable at this scale, and L1's eventual negative
        becomes stronger -- it would rest on a measured obstruction rather than on
        an untested assumption that transport is cheap.

    (D) THE POINT-DEPENDENT DATA AND THE HARD CONSTRAINT. The walk's output is
    (E_L, Phi(P), Phi(Q)) -- point-dependent, publicly computable, no discrete
    logarithm anywhere (each step is: build psi_ell, extract a rational kernel, run
    Vélu, evaluate at two points). DOES IT LEAK ANYTHING ABOUT k? NO, and the reason
    is IDEA-20260807-053a55's simulator: Phi|_G is an injective homomorphism with an
    efficiently computable inverse, so the walk's entire output is self-generatable
    and adds no query power. THE WALK IS NOT AN ATTACK AND THIS RECORD DOES NOT
    PROPOSE IT AS ONE. It is a REDUCTION -- a way to move an instance to where a
    hypothetical advantage might live -- and its value is exactly zero until some
    other lane exhibits such an advantage. Filing it now, with its cost measured,
    is what makes a later L1 finding immediately priceable instead of triggering a
    fresh design cycle.

    (E) THE TWO OUTCOMES.
      OUTCOME 1 -- the walk mixes at toy scale with a measured small constant, and
        the per-step cost is polylog. Then the cascade is real and priced, T2 is
        effective rather than nominal, and every subsequent within-class finding in
        this campaign inherits a concrete overhead figure.
      OUTCOME 2 -- the walk mixes slowly, or a material fraction of curves have no
        cheap Elkies step, or the transport cost dominates. Then the cascade is
        EXPENSIVE at toy scale, which is a named obstruction against the whole
        "walk to a better curve" family and is exactly the kind of measured
        negative docs/inventor-protocol.md section 4 asks for -- with forward
        guidance naming what remains (larger ell at higher per-step cost; vertical
        rather than horizontal steps; the locally-detectable-goodness branch of T5).

  resource_label: R5
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE AS A RESOURCE USE, WITH NO ATTACK CLAIMED. Each step consumes R5 --
    the Elkies condition and the rational-kernel extraction are computations on
    E[ell] as a Galois module, which the generic group oracle does not supply -- and
    R4, the isogeny graph structure. The walk therefore genuinely escapes the
    generic model at the curve level. At the POINT level it does not: Phi|_G is a
    scalar under any identification (H-ENDO-001) and the transported instance is
    simulable (IDEA-20260807-053a55). The record's position is that this is
    admissible AND currently worthless as an attack, and that the honest deliverable
    is the price list rather than the resource label. A reader who takes
    "admissible" here as a hint of promise has misread the record.

  discriminated_from:
    - >-
      KN-LIT-237 (Jao-Miller-Venkatesan). That work supplies the GRH-conditional
      expansion theorem. This record supplies neither a theorem nor an improvement
      to one: it measures the constant and the per-step cost at toy scale, where the
      class is exhaustively enumerable and the stationary distribution is known
      exactly. The corpus entry for KN-LIT-237 is at `confidence: reported` from its
      abstract and was not read in full here; nothing in this record depends on the
      theorem being true, because the measurement is direct.
    - >-
      IDEA-20260807-053a55. That record proves the ONE-STEP dichotomy and builds the
      transport primitive with its certificate. This record composes many steps and
      measures a MIXING property, which is not derivable from the one-step dichotomy
      and is a different kind of claim (a distributional one). The two are in a
      strict dependency: 631e80 cannot run until 053a55's certificate passes.
    - >-
      IDEA-20260807-c98c3d. That record uses the Elkies classification as a
      class-membership sieve; this one uses Elkies isogenies as walk steps. The
      overlap is the Elkies test itself.
    - >-
      IDEA-20260807-aabd67. That record's "walk" is a Pollard rho walk on POINTS of
      one curve; this record's walk is an isogeny walk between CURVES. They share
      the word and nothing else, and the reachability gate binds only here.
    - >-
      CSIDH-style vectorization (KN-TECH-051 territory). Reaching a SPECIFIED curve
      is the hard problem; reaching a RANDOM one is the easy one. This record does
      only the easy one, and says so, because "walk to the best curve in the class"
      is precisely the inference T5 exists to block.

  object_first_candidate:
    tracked_object: >-
      THE WALKED INSTANCE (E_i, Phi_i(P), Phi_i(Q)) after i Elkies steps, tracked as
      a trajectory: the sequence of j-invariants together with the transported point
      pair and a running transport-cost counter.
    lossiness: >-
      Two-sided, and the sides must be kept apart. On the POINT half it is NOT lossy
      (Phi|_G is invertible), which by docs/inventor-protocol.md section 2 makes the
      point half a change of coordinates rather than an object. On the CURVE half it
      IS lossy: the trajectory forgets the path taken and retains only the endpoint,
      and that forgetting is exactly what mixing means. So the genuine tracked
      object here is the CURVE trajectory, and it is k-independent -- the point half
      is carried along for the reduction, not for information.
    propagation: >-
      Propagates exactly and by construction: each step is a well-defined isogeny,
      composition is composition, and the transport certificate re-verifies the point
      half at every step. The interesting propagation question is DISTRIBUTIONAL --
      how fast the curve marginal approaches uniform on the class -- and that is the
      measured quantity.
    survival_score: >-
      Survives arbitrarily many steps with k intact, which is the reduction's whole
      point and simultaneously the reason it is not an attack. It fails at the first
      curve with no Elkies prime in the declared set, where the walk simply cannot
      step; measuring how often that happens is a required metric.

  mechanism: >-
    STEP 1 (dependency) -- IDEA-20260807-053a55's transport primitive with its
    four-part certificate must pass at 100 percent. Nothing here runs otherwise.

    STEP 2 (class enumeration) -- enumerate a toy isogeny class exhaustively at
    16-20 field bits using the fingerprint sieve of IDEA-20260807-c98c3d plus exact
    point counting for confirmation. THE EXHAUSTIVE ENUMERATION IS THE POINT: it
    gives the exact stationary distribution (uniform on the class for a symmetric
    walk on the crater) so mixing can be measured against ground truth rather than
    estimated. This is the toy-scale shortcut that makes the measurement possible at
    all, and it is unavailable at cryptographic size.

    STEP 3 (the walk) -- from each starting curve, run R independent walks of length
    up to L_max, at each step choosing uniformly among the available Elkies primes in
    {3,5,7,11,13} and, for each, uniformly among the rational kernels found. Record
    the j-invariant trajectory and the transported point pair with its certificate at
    every step.

    STEP 4 (the mixing measurement) -- at each step i, compute the total-variation
    distance between the empirical distribution of j(E_i) over the R walks and the
    uniform distribution on the enumerated class. Fit the decay to
    TV(i) ~ A * exp(-i / tau) and report tau, then convert to the operational
    quantity: L_mix(eps) = the smallest i with TV(i) <= eps for declared
    eps in {0.1, 0.05, 0.01}, and the constant c = L_mix(0.05) / log(p) measured
    across at least three field sizes so that c is a fitted constant rather than a
    single-point ratio.

    STEP 5 (the cost measurement) -- field operations and wall clock per step, by
    ell; total cost of a mixed walk; the fraction of enumerated curves with zero
    available Elkies primes in the declared set (dead starts); and the fraction with
    exactly one (walks that can only shuttle back and forth, which mix poorly and
    must be reported separately because averaging them with well-connected curves
    would hide the failure mode).

    STEP 6 (the cascade price sheet) -- combine into the bookkeeping of claim (C.2):
    for a hypothetical speedup s on a fraction f of the class, the expected total
    cost is (1/f) * L_mix * (cost per step) + (attack cost / s). Publish the sheet as
    a function of (f, s) so any future L1 finding is immediately priceable. NO VALUE
    OF s OR f IS ASSUMED OR PREDICTED -- they are the finding's inputs, and this
    record supplies only the other terms.

  novelty_status: known
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "Jao\|Venkatesan\|random self-reduc\|self-reducib" knowledge/ ledger/ docs/ analysis/`;
      `grep -ri "expander\|mixing" knowledge/techniques/`;
      `grep -n "T5\|rapid mixer\|vectorization" analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md`;
      plus full reads of KN-LIT-237, KN-TECH-024, KN-TECH-051 (header),
      DECOMPOSITION.md sections 3 and 5.
    results: >-
      KN-LIT-237 is Jao-Miller-Venkatesan and states the ordinary-isogeny expansion
      result and its relationship to ECDLP security, at `confidence: reported` from
      its abstract. DECOMPOSITION.md T5 states the same rapid-mixing fact under GRH
      and makes reachability a mandatory second gate for every lane. KN-TECH-024
      records the supersingular graph as Ramanujan. NO record in this repository
      measures a mixing constant, measures a transport cost, or prices a cascade;
      `grep -ri "mixing"` in knowledge/techniques returns KN-TECH-057's remark that
      "VW on F_p requires rapid mixing for the birthday bound" and nothing about
      isogeny walks.
    verdict: >-
      KNOWN as a reduction -- the random self-reduction across an isogeny class is
      Jao-Miller-Venkatesan and this record claims no part of it. What is new to
      this corpus is the MEASUREMENT at toy scale against an exhaustively enumerated
      class (where the stationary distribution is known exactly rather than assumed),
      the per-step cost, the dead-start fraction, and the cascade price sheet.
      External novelty for the measurement is UNVERIFIED; no web search was
      performed this session, and toy-scale mixing measurements on ordinary isogeny
      graphs may well exist in the point-counting or CSIDH literature.

  null_object_control: >-
    MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: a RANDOM-JUMP WALK on the same
    enumerated class -- at each step, jump to a uniformly random curve of the class
    (possible only because the class is enumerated, which is again the toy-scale
    shortcut). The null has the same state space, the same step count and the same
    stationary distribution, and differs from the real walk ONLY in the step
    structure. It mixes in ONE step by construction, so it is the upper reference:
    the real walk's TV curve must lie above the null's and converge to it. DECAY
    PARAMETER: the step index i. The TV distance of the REAL walk must DECAY with i;
    a TV distance that plateaus above eps is the signature of a disconnected or
    poorly connected graph -- most likely because the declared Elkies set does not
    generate the class -- and that is a real and reportable obstruction, not a
    measurement failure.
    SECOND NULL, and this one can fail informatively: a LAZY WALK that stays put
    with probability 1/2. It must mix roughly twice as slowly. If it does not, the
    TV estimator is not responding to the walk at all.
    THIRD CONTROL (connectivity, blocking): verify from the enumerated class and the
    extracted kernels that the Elkies-isogeny graph on the class is CONNECTED under
    the declared prime set. If it is not, uniformity is unreachable by construction
    and the mixing measurement is void -- it would be measuring convergence to the
    uniform distribution on a component, not on the class. This check costs nothing
    once the class is enumerated and it is the single most likely way the experiment
    is silently wrong.

  assumptions:
    - >-
      The class is exhaustively enumerable at 16-20 field bits. This is the binding
      scale constraint and the reason the measurement is possible; at 24+ bits the
      enumeration degrades to sampling and the TV measurement loses its ground truth.
    - >-
      ell <= 13, so each step costs at most a degree-84 psi_ell construction plus a
      Vélu evaluation. Larger ell would improve connectivity at higher per-step cost;
      that tradeoff is named as forward guidance and is NOT measured here.
    - >-
      Each step chooses uniformly among available Elkies primes and kernels, making
      the walk symmetric on the crater. Ascending/descending (vertical) steps change
      the volcano level and are NOT part of the declared walk; if the enumerated
      class has volcano depth (see IDEA-20260807-1d9c5f), the walk is confined to a
      level and the "class" it mixes over must be reported as that level, not the
      whole class. THIS IS THE MOST LIKELY SILENT ERROR IN THE DESIGN and the
      connectivity check exists to catch it.
    - >-
      The transported instance's k is verified against harness ground truth at every
      step by IDEA-20260807-053a55's certificate. A walk with an unverified step is
      an infrastructure failure, not a data point.
    - >-
      The GRH-conditional rapid-mixing statement (T5, KN-LIT-237) is NOT assumed by
      the measurement and is NOT validated by it. The measurement is direct and
      unconditional at toy scale; agreement or disagreement with the asymptotic
      picture is reported as an observation about toy-scale behaviour, since a
      constant fitted over 16-20 bits says nothing about the asymptotic regime.

  proof_search_map:
    bottleneck: >-
      Exhaustive class enumeration (STEP 2). Everything else is cheap. The
      enumeration cost bounds the field size, the field size bounds how many points
      the c = L_mix/log(p) fit has, and a constant fitted over three field sizes
      spanning 16 to 20 bits is a weak fit -- which is disclosed here as the
      record's principal quantitative weakness rather than discovered later.
    baseline_embedding:
      parameter_slice: >-
        L = 1 with a single Elkies prime: one transport step, where the "walk" is
        exactly IDEA-20260807-053a55's primitive and the TV distance after one step
        is computable directly from the graph's adjacency structure on the
        enumerated class. This slice reproduces the one-step behaviour exactly and
        with no statistics.
      reproduction_check: >-
        Frozen fixture: one enumerated class, its Elkies-isogeny adjacency matrix
        built from the extracted kernels, and the one-step TV distance computed BOTH
        analytically from the adjacency matrix AND empirically from R walks. Exact
        agreement to within sampling error. A mismatch means the empirical TV
        estimator or the walk sampler is wrong, and no multi-step number is
        interpretable.
    observation_collision:
      observable: >-
        The endpoint curve E_L (its j-invariant) and the transported instance.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and its success is the mixing property
        itself: many distinct paths must reach the same endpoint, and after mixing
        the endpoint must be uninformative about the start. THE COLLISION IS THE
        DELIVERABLE. Its failure -- endpoints that remain correlated with starts
        after L_max steps -- is OUTCOME 2 and the named obstruction.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Randomise the location of the instance within the class and charge the
          resulting cost to a single global budget -- the walk length times the
          per-step cost -- rather than to any individual instance. This is the
          re-randomisation transform the target profile names (rigorous structural
          fact: injectivity of Phi on G; distribution statement: rapid mixing of the
          class-group Cayley graph; re-randomisation: the walk; pull-back: the dual
          isogeny and one modular inversion).
        predicted_gain: >-
          Worst-case to average-case within the class, at an overhead this record
          measures. NO exponent gain: the overhead is polylog and the exponent is
          untouched, so the gain is CONDITIONAL on some other lane exhibiting an
          average-case advantage, and is zero otherwise.
      - transform: representation_reduction
        proposed_object: >-
          Move "is this instance hard?" to "is a random instance of this class
          hard?", where the answer is a statement about a distribution rather than
          about a point. Encoding obligation: the walk must actually mix.
          Completeness: every curve must be a possible endpoint (connectivity).
          Soundness: k must be preserved (the certificate). Cost-loss: L_mix times
          per-step cost, measured.
        predicted_gain: >-
          Makes T2 effective. No attack gain by itself.
    quantifier_order: >-
      Claimed as a REDUCTION: FORALL instances (E, P, Q) with E in a fixed class,
      FORALL k, THERE EXISTS a walk Phi of length L such that
      (E_L, Phi(P), Phi(Q)) is an instance with the same k, and Phi is efficiently
      invertible on G. The walk depends on E and on randomness but NOT on k or Q --
      which is what makes it a legitimate reduction rather than an oracle.
      Claimed as a MEASUREMENT: FORALL enumerated toy classes in the declared family,
      THERE EXISTS a measured L_mix(eps) and a fitted constant c. The dangerous
      stronger reading NOT claimed: "FORALL classes, L_mix <= c log p for a UNIVERSAL
      c" -- that is the asymptotic statement, it is GRH-conditional, it is
      KN-LIT-237's and not this record's, and a constant fitted over three toy field
      sizes is not evidence for it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On these enumerated toy classes, an Elkies walk over primes <= 13 reaches
        total-variation distance eps from uniform in L_mix(eps) steps at a measured
        cost of X field operations per step, and the reduction preserves k exactly
        as certified." It can NEVER certify the asymptotic mixing rate, never
        certify anything about a SPECIFIED target curve (that is vectorization),
        and never produce an attack.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS is a class whose
        Elkies-isogeny graph under primes <= 13 is DISCONNECTED, or a curve at a
        volcano floor with a single available kernel. There the walk cannot mix, and
        exhibiting such a case explicitly is mandatory -- a method that reports
        mixing without checking connectivity has not identified the load-bearing
        structure, which is generation of the class group by the small primes.
    proof_obligations:
      - claim: Phi is injective on G for every declared step.
        responsibility: correctness
      - claim: k is preserved, certified per step.
        responsibility: correctness
      - claim: The Elkies graph on the enumerated class is connected under the declared primes.
        responsibility: feasibility
      - claim: The one-step empirical TV matches the adjacency-matrix computation.
        responsibility: baseline
      - claim: The lazy-walk null mixes about twice as slowly.
        responsibility: correctness
      - claim: Per-step cost is measured in field operations, not estimated.
        responsibility: runtime
      - claim: c is reported as a fit over >= 3 field sizes with its residuals.
        responsibility: size
      - claim: No asymptotic mixing claim is made from toy-scale data.
        responsibility: scope

  predictions:
    - metric: >-
        One-step total-variation distance, empirical over R walks versus computed
        from the class adjacency matrix
      direction: different
      minimum_effect: >-
        Agreement within sampling error at R >= 10^4. A mismatch invalidates the
        estimator. BASIS - both quantities are computed from the same enumerated
        class; this is an internal consistency check, not a finding.
    - metric: >-
        Total-variation distance to uniform on the class as a function of step index
        i, over R independent walks
      direction: lower
      minimum_effect: >-
        Monotone decay to below 0.05 within L_max = 50 steps on a connected class.
        A plateau above 0.05 fires OUTCOME 2. NO SPECIFIC DECAY RATE IS PREDICTED --
        predicting tau or c would be fabrication, and measuring them is the
        deliverable. BASIS - monotone decay is expected for an ergodic symmetric
        walk; the L_max = 50 cap and the 0.05 threshold are PRE-REGISTERED and
        UNTESTED.
    - metric: >-
        c = L_mix(0.05) / log(p), fitted across >= 3 field sizes
      direction: different
      minimum_effect: >-
        Reported as a fitted value with residuals and an explicit statement of how
        few points the fit has. A fit over 16, 18 and 20 bits is THREE POINTS over a
        narrow range and cannot distinguish c*log(p) from many other slowly growing
        functions; the record must say so where c is reported. BASIS - this is a
        measurement design statement, not a prediction.
    - metric: >-
        Fraction of enumerated curves with zero available Elkies primes in
        {3,5,7,11,13} (dead starts), and the fraction with exactly one
      direction: different
      minimum_effect: >-
        Reported as a distribution. The heuristic expectation for zero is about 1/32
        under the Binomial(5, 1/2) model of IDEA-20260807-c98c3d's H1; a materially
        larger dead-start fraction directly bounds the reduction's applicability and
        is a first-class result. BASIS - the 1/32 is a heuristic arithmetic
        consequence of that model and is NOT a measurement.
    - metric: >-
        Field operations and wall clock per walk step, by ell
      direction: higher
      minimum_effect: >-
        Reported per ell. The arithmetic component is known -- psi_ell construction
        at degree (ell^2-1)/2 plus a Vélu evaluation -- but the constant in pure
        Python is unknown to this record and guessing it would be fabrication.
    - metric: >-
        Transport certificate pass rate across all walk steps
      direction: different
      minimum_effect: >-
        100 percent. Any failure is an infrastructure outcome under AGENTS.md rule 5
        and voids the walk containing it. BASIS - IDEA-20260807-053a55's derivation.

  minimal_test:
    design: >-
      STAGE 0 (dependency gate): IDEA-20260807-053a55's certificate at 100 percent.
      STAGE 1 (hours to a day, the budget sink): enumerate one toy class exhaustively
      at 16 bits, then 18 and 20 if budget allows. Build the Elkies adjacency matrix
      and RUN THE CONNECTIVITY CHECK FIRST -- it costs nothing and it decides whether
      the rest of the experiment is meaningful.
      STAGE 2 (HARD GATE, minutes): the one-step TV reproduction against the
      adjacency matrix.
      STAGE 3 (hours): R >= 10^4 walks per starting curve up to L_max = 50; TV curve;
      tau and L_mix(eps) for eps in {0.1, 0.05, 0.01}.
      STAGE 4 (minutes): the random-jump null and the lazy-walk null.
      STAGE 5 (hours): per-step cost measurement and the dead-start distribution.
      STAGE 6 (zero compute): the cascade price sheet as a function of (f, s).
      BUDGET: ell <= 13 throughout (deg psi_13 = 84); field sizes 16-20 bits for the
      exhaustive enumeration. This is the most expensive proposal in the L7 set and
      its cost is dominated by STAGE 1, not by the walks.
    controls:
      - connectivity check on the enumerated class under the declared primes (blocking, run FIRST)
      - one-step TV against the adjacency matrix (blocking)
      - random-jump null, mixes in one step, upper reference (blocking)
      - lazy-walk null, must mix about twice as slowly (blocking)
      - transport certificate at every step (blocking)
      - volcano-level check via IDEA-20260807-1d9c5f, to confirm the walk is not
        silently confined to one level of a multi-level class
      - anomalous / smooth-order exclusion per KN-TECH-034
    required_metrics:
      - TV distance per step index, with R and its sampling error
      - tau, L_mix(eps) for three eps, and c with fit residuals and point count
      - dead-start and single-kernel fractions
      - field operations and wall clock per step by ell
      - certificate pass rate
      - connectivity verdict and the number of connected components
      - class size and enumeration completeness

  falsification_conditions:
    - >-
      The Elkies graph on the enumerated class is disconnected under primes <= 13.
      Uniformity is unreachable by construction; the mixing measurement is VOID (not
      negative) and the honest report is that the declared prime set does not
      generate the class at this size -- with the immediate forward guidance that
      larger ell must be included.
    - >-
      The one-step empirical TV disagrees with the adjacency-matrix computation. The
      estimator or the sampler is wrong; nothing else is interpretable.
    - >-
      The TV curve plateaus above 0.05 at L_max on a CONNECTED class. OUTCOME 2: the
      walk mixes too slowly for the cascade to be cheap at this scale. A genuine
      measured obstruction.
    - >-
      The lazy-walk null does not mix more slowly than the real walk. The TV
      estimator is not responding to the walk structure.
    - >-
      A transport certificate fails mid-walk. INFRASTRUCTURE outcome under AGENTS.md
      rule 5; the walk is discarded, not recorded as a data point.
    - >-
      Exhaustive class enumeration at 16 bits exceeds the wall-clock budget. Also an
      infrastructure outcome; the proposal reduces scope to a sampled enumeration
      and reports the TV measurement as an estimate against an estimated stationary
      distribution, with the weakening stated prominently.

  confounders:
    - >-
      VOLCANO CONFINEMENT, the most dangerous confounder here. If the class has
      ell-volcano depth for some declared ell, a horizontal-only walk stays on one
      level and will appear to mix to uniform ON THAT LEVEL while the "class" it is
      compared against is larger. The TV distance would then plateau at a value
      determined by the level's share of the class and would be misread as slow
      mixing. The volcano-level check is mandatory and its output must be used to
      define the correct comparison distribution.
    - >-
      Class size versus R. With R = 10^4 walks and a class of size h, the TV
      estimator's own bias is order sqrt(h/R); for large classes at 20 bits this can
      dominate the signal and must be reported alongside every TV value.
    - >-
      Non-uniform step availability. Curves with more Elkies primes are visited more
      often under a "choose uniformly among available" rule, so the stationary
      distribution of the declared walk may NOT be uniform on the class. This is a
      real design flaw risk: the walk must either be made symmetric (Metropolis
      correction) or its true stationary distribution computed from the adjacency
      matrix and used as the comparison. The record flags this explicitly because
      comparing against the wrong stationary distribution would produce a plateau
      that looks exactly like slow mixing.
    - >-
      Toy-scale fit weakness. Three field sizes over 16-20 bits cannot separate
      c*log(p) from c'*p^delta for small delta. Any statement about c must carry
      that limitation in the same sentence.
    - >-
      Pure-Python constants. Per-step wall clock does not transfer to a compiled
      implementation; field-operation counts do.

  interpretation_limits:
    - >-
      NOT AN ATTACK, and its value is zero until another lane exhibits an
      average-case advantage. The record's own claim (D) says so.
    - >-
      The reduction is KNOWN (Jao-Miller-Venkatesan, KN-LIT-237, relayed from
      abstract). Only the measurement is this record's contribution.
    - >-
      A toy-scale mixing constant is not an asymptotic mixing rate and may not be
      cited as evidence for or against the GRH-conditional statement in T5.
    - >-
      Reaching a RANDOM curve is cheap; reaching a SPECIFIED one is vectorization
      and is hard. Nothing here bears on the latter, and any downstream use that
      requires a specified target is outside this record's scope.
    - >-
      claim_tier capped at toy per RQ-TORS-8c7b79.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The declared Elkies walk on an enumerated toy class is ergodic with uniform
        stationary distribution, and its total-variation distance to uniform decays
        geometrically, TV(i) <= A * exp(-i/tau), with tau small enough that
        L_mix(0.05) <= 50 steps at 16-20 field bits.
      rigorous_support: >-
        Rigorous half: for a connected, symmetric, aperiodic walk on a finite graph
        the stationary distribution is uniform and TV decays geometrically at a rate
        set by the spectral gap -- this is standard finite Markov chain theory and is
        unconditional once connectivity and symmetry are VERIFIED, which STAGE 1 and
        the confounder note require rather than assume. Distributional half: the
        claim that the gap is large (i.e. tau is small) is the expander property,
        which for the ordinary small-degree isogeny graph is the GRH-conditional
        statement of KN-LIT-237 and DECOMPOSITION.md T5. That entry is RELAYED FROM
        ITS ABSTRACT in this corpus and was not read in full here; it is named as the
        classical statement H1 imitates, not as a proof of H1.
      validation_plan: >-
        SAMPLE: R >= 10^4 independent walks from each of >= 10 starting curves, on
        each enumerated class at 16, 18 and 20 field bits, to L_max = 50 steps.
        SHORTCUT MAKING THE MEASUREMENT POSSIBLE: exhaustive class enumeration, which
        gives the exact state space and lets the stationary distribution be COMPUTED
        from the adjacency matrix rather than assumed -- the toy-scale analogue of
        the role the Deuring correspondence plays in crypto-scale isogeny sampling,
        and unavailable at cryptographic size. COMPARISON DISTRIBUTION: the empirical
        TV curve against (i) the exact second-eigenvalue prediction from the
        adjacency matrix, which is computable at toy scale, and (ii) the random-jump
        null. TAIL CHECKS: the slowest-mixing starting curve rather than the mean,
        since a reduction is only as good as its worst start; and the largest
        observed TV at L_max across all starts. TOY SCALE ONLY, LABELLED AS SUCH:
        this measures 16-20 bit classes and asserts nothing about asymptotic mixing
        or about cryptographic-size class groups.
    - id: H2
      statement: >-
        The per-step transport cost is polylogarithmic in p and independent of the
        class size, so the total reduction overhead is L_mix times a polylog factor.
      rigorous_support: >-
        Rigorous half: one Elkies step at fixed ell costs a psi_ell construction of
        degree (ell^2-1)/2 -- independent of p in its degree -- plus field arithmetic
        whose cost is polylog in p, plus a Vélu evaluation at fixed degree ell.
        Nothing in the step depends on the class size. Distributional half: none
        needed; H2 is close to rigorous and is listed so that its ONE soft spot is
        visible -- the kernel-subset search in the extraction step has a cost that
        depends on the factorisation type of psi_ell, which varies, so the per-step
        cost is a random variable rather than a constant.
      validation_plan: >-
        SAMPLE: field-operation counts for every step of every walk, tagged by ell
        and by the observed psi_ell factorisation type. COMPARISON: the empirical
        per-step cost distribution against the deterministic (ell^2-1)/2 + Vélu
        arithmetic count. TAIL CHECK: the 99th-percentile step cost, since a heavy
        tail in the kernel-subset search would make the walk's cost unpredictable
        even if its mean is fine. TOY SCALE ONLY, LABELLED AS SUCH.

  reachability_gate: >-
    REQUIRED, AND THIS RECORD IS ESSENTIALLY A MEASUREMENT OF IT. IS A GOOD OBJECT
    REACHABLE, AND AT WHAT COST?
    (i) A UNIFORMLY RANDOM curve of the class: reachable in L_mix steps, and L_mix is
    exactly what this record measures. Under T5 and KN-LIT-237 this is expected to be
    O(log p) under GRH; at toy scale it is measured directly and unconditionally.
    (ii) A SPECIFIED curve: NOT reachable cheaply. That is the vectorization problem
    underlying CSIDH, costing about sqrt(h(O)) ~ p^{1/4} classically at best (T5).
    This record does not attempt it and no part of the design depends on it.
    (iii) THEREFORE the reduction is usable only under T5's first branch -- goodness
    common enough to hit by random walking -- with expected restarts 1/f for a
    goodness density f. It is NOT usable for goodness identified only by a global
    address. The price sheet in STEP 6 is stated as a function of f precisely so that
    this constraint is visible in the arithmetic rather than in prose.
    (iv) DEAD STARTS: curves with no Elkies prime in the declared set cannot step at
    all. Their measured fraction is a hard bound on the reduction's coverage and is a
    required metric.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IMPROVEMENT IS CLAIMED. The reduction's overhead is L_mix times the
      per-step cost, i.e. polylog(p) under H1 and H2, so it PRESERVES whatever
      exponent the underlying attack has. Its function in an exponent argument would
      be as a CASCADE: an average-case exponent improvement on a fraction f of the
      class becomes a worst-case one at an additive polylog cost and a multiplicative
      1/f restart factor. Since no such average-case improvement exists in this
      program, the current exponent delta is exactly zero.
    memory_exponent: >-
      O(polylog p) for the walk itself (one kernel polynomial of degree <= 84 and the
      current instance). The EXPERIMENT's memory is O(class size) for the enumeration
      and O(R) for the TV estimator, both small at toy scale but both the reason the
      field size is capped.
    best_known: >-
      For prime-field ECDLP the frontier is unchanged: parallel rho with distinguished
      points at 0.886*sqrt(N) group operations and O(1) memory per processor
      (KN-TECH-001, KN-TECH-006), automorphism-discounted by at most sqrt(|Aut|) on
      CM curves (KN-TECH-018); BSGS at 2*sqrt(N) time and sqrt(N) memory
      (KN-TECH-031); Pohlig-Hellman fixing N (KN-TECH-030). For the REDUCTION itself
      the incumbent is Jao-Miller-Venkatesan (KN-LIT-237), which this record does not
      improve and does not attempt to.
    hidden_overhead: >-
      Three things hide in "polylog". (1) The kernel-subset search, whose cost depends
      on psi_ell's factorisation type and is therefore a random variable with a tail
      H2 measures. (2) The restart factor 1/f, which is not the reduction's cost but
      is inseparable from it in any application. (3) The dead-start fraction, which is
      not an overhead at all but a coverage gap -- the reduction simply does not apply
      to those curves under the declared prime set.
    tradeoff_note: >-
      The walk is low-memory and embarrassingly parallel across independent walks, so
      it sits far from the van Oorschot-Wiener tradeoff curve and does not interact
      with it. The real tradeoff is ell against connectivity: larger ell gives better
      connectivity and faster mixing at a per-step cost growing like ell^2 for the
      psi_ell construction. Measuring the low-ell end and naming the high-ell end as
      forward guidance is this record's position on it.

  dominated_by: >-
    AS AN ATTACK: mounts none, and claim (D) proves it cannot on its own -- the walk
    output is self-generatable. Dominated on every axis by every row of the
    prime-field frontier, checked individually: parallel rho with distinguished
    points (0.886*sqrt(N) group operations, O(1) memory per processor, linear
    parallel speedup; KN-TECH-001, KN-TECH-006); automorphism-discounted rho on CM
    curves (KN-TECH-018); BSGS (2*sqrt(N) time, sqrt(N) memory; KN-TECH-031);
    Pohlig-Hellman (KN-TECH-030). Data/query axis: it issues no queries and produces
    no solve, and by IDEA-20260807-053a55's simulator the extra instances it produces
    have no query value.
    AS A REDUCTION: dominated by Jao-Miller-Venkatesan (KN-LIT-237), which states the
    asymptotic result this record only measures a toy-scale instance of. NOT dominated
    as a MEASUREMENT: no record in this repository contains a mixing constant, a
    per-step transport cost, a dead-start fraction, or a cascade price sheet, and L1
    currently cannot price any within-class finding without them.
  sota_delta: >-
    Zero speedup against any attack baseline, and zero improvement to the reduction
    it instantiates. Measurement delta, quantified: it supplies four numbers this
    program does not have -- L_mix(eps) for three eps on enumerated toy classes, the
    fitted constant c = L_mix(0.05)/log(p) over >= 3 field sizes with its residuals
    and an explicit statement of the fit's weakness, the per-step transport cost in
    field operations by ell (arithmetic component (ell^2-1)/2 plus Vélu, constant
    measured), and the dead-start fraction bounding the reduction's coverage --
    together with a cascade price sheet (1/f)*L_mix*(cost per step) + (attack cost)/s
    that makes any future L1 within-class finding immediately priceable instead of
    triggering a fresh design cycle.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.99 that the reduction is correct (it is one-step transport composed, and
    053a55's dichotomy covers it). 0.6 that a toy class at 16-20 bits is connected
    under Elkies primes <= 13 -- this is the single biggest risk and the connectivity
    check is run first for exactly that reason. 0.5 that the walk's stationary
    distribution is uniform without a Metropolis correction, given the non-uniform
    step availability flagged in the confounders; if it is not, the fix is cheap but
    must be applied before any TV number is reported. 0.7 that L_mix(0.05) <= 50 on a
    connected class. 0.3 that a c fitted over three toy field sizes is worth
    reporting as a constant at all -- the honest expectation is that the record's
    durable outputs are the per-step cost, the dead-start fraction and the price
    sheet, with c reported as a weakly constrained number carrying its own caveat.
    Priority is MEDIUM rather than high because the whole record is CONDITIONAL: its
    value is realised only if L1 finds within-class variance, and if L1 finds none
    the measurement is a well-characterised instrument with no consumer.

