  title: |-
    Cyclotomic lift with complete splitting - one K-point gives phi(c) residues and a free Galois trace relation
  class: measurement
  claim: |-
    (i) the relation yield ratio R(H) = #trace relations from K-points of height <= H divided by #distinct residues they produce stays below 1 and decreases in H, as on a random field of the same degree and discriminant in which p splits completely; (ii) the covering exponent of E(F_p) residues against enumeration work does not grow with d beyond the random-field null; (iii) rank E(K) - rank E(Q) matches matched random fields. Alive if R(H) >= 1 at some H with the random-field control below 1, or the covering exponent exceeds the null by > 0.2 across >= 3 primes.
  mechanism: |-
    For p = 2^c - 1 with c prime, ord_p(2) = c, so p = 1 mod c and p splits completely in Q(zeta_c); F_p is Z[zeta_c]/P_i for each of the phi(c) primes P_i above p, i.e. F_p is a quotient of the group ring Z[C_c] via x -> 2, which is the ring the Cunningham SNFS exploited (2^c - 1 = prod_{d | c} Phi_d(2)). Lift E to a subfield K of Q(zeta_c) of degree d dividing c - 1; p still splits completely, a K-point P reduces to d points P_i = P mod P_i of E(F_p), and the Galois trace gives sum_i P_i = Tr_{K/Q}(P) mod p with Tr(P) in E(Q). With E(Q) finite this is one free linear relation among d factor-base residues per small K-point; index calculus needs at least one relation per residue, and the canonical-height obstruction says small K-points are rare.
  novelty_status: unverified
