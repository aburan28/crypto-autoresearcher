  minimal_test:
    design: |-
      1. Toy Mersenne primes p = 2^c - 1 for c in {13, 17, 19, 31}; curves E/Q of rank 0 from small-conductor tables with good reduction at p, so Tr(P) is torsion.
      2. Subfields K of Q(zeta_c) of degree d dividing c - 1 with d <= 12; descent over K (Sage / Magma) or point search to height H; reduce at every prime above p.
      3. Count distinct residues, trace relations, R(H), covering exponent, rank gain, smallest non-torsion height.
      4. Random-field control at every (p, d) with three fields of the same degree and similar discriminant in which p splits completely (found by search), same curves.
