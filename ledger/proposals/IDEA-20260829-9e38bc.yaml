      direction: higher
      minimum_effect: >-
        PREDICTED 20 out of 20 - three exact values (Anomalous 11, BN(2,254) 3,
        secp256k1 3) and seventeen bound-branch confirmations that no |D| at most
        10^8 exists, which is consistent with but strictly weaker than the
        mirror's "above 2^100" cells and must be reported as the weaker statement.
