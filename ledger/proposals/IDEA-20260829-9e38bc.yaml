    - metric: >-
        fraction of toy complex-multiplication curves at 30 bits for which the
        instrument returns the CONSTRUCTED |D| exactly, over all nine
        class-number-one discriminants
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000, zero exceptions permitted, since the map is
