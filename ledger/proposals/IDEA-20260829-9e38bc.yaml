idea:
  id: IDEA-20260829-9e38bc
  question_id: RQ-SCURVE-84a540
  goal_id: GOAL-SCURVE-48e06c
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE TRACE-DETERMINED CM DISCRIMINANT - on a trace-one curve the complex
    multiplication discriminant is a function of the MODULUS ALONE, so the
    Anomalous row's disc lane is derivable from p with no point count and no
    table read; certify it by exhibiting (D, f) with |D| f^2 = 4p - 1, verified
    in ONE big-integer multiplication, CROSS-CHECK it against the |D| = 11 the
    in-repository SafeCurves mirror publishes for this row, and supply the
    derivation the mirror itself lacks for why this row's embedding degree cell
    reads "Unverified" - a lane IDEA-20260829-f89a3a does not touch and cannot
    reach
  class: measurement

  claim: >-
    THE ANOMALOUS ROW'S INTAKE DESCRIPTION NAMES TWO STRUCTURES AND THE PROGRAM
    IS ABOUT TO INSTRUMENT ONLY ONE. RQ-SCURVE-84a540 records the curve as
    "created as an illustration of additive transfer AND SMALL DISCRIMINANT", and
    its expected criteria mark BOTH `transfer` and `disc` false.
    IDEA-20260829-f89a3a, filed earlier today, fires the additive transfer and
    solves a discrete logarithm on this row. It says nothing about the
    discriminant, and its object - the formal-group logarithm coordinate - cannot
    reach it. This record takes the second structure. Five separable sub-claims
    of decreasing rigour.

    (C1) RIGOROUS, NO HEURISTIC, AND IT IS THE WHOLE IDEA. For a curve E over F_p
    with #E(F_p) equal to p, the trace of Frobenius is t equal to p + 1 - #E,
    which is EXACTLY 1. Hence the discriminant of the Frobenius order is
    t^2 - 4p = 1 - 4p, a specific negative integer DETERMINED BY p AND BY NOTHING
    ELSE. Writing 1 - 4p = f^2 D with D the fundamental discriminant of the CM
    field, the CM field of any trace-one curve over F_p is Q(sqrt(1 - 4p)) and is
    a function of the modulus alone. THE CURVE EQUATION IS NOT AN INPUT, and
    neither is any table. No other row in the twenty-curve family has this
    property in this form.

    (C2) THE CERTIFICATE, WHICH IS WHAT MAKES THIS AN AUDIT AND NOT A
    TRANSCRIPTION. Recovering (D, f) means finding the square part of 4p - 1. The
    POSITIVE certificate is the pair (D, f) itself, re-verified by ONE
    big-integer multiplication and one comparison - |D| times f^2 equals 4p - 1,
    with D negative and congruent to 0 or 1 modulo 4. It is genuinely succinct,
    in sharp contrast to IDEA-20260807-98a970's lower-bound embedding-degree
    certificate which costs K equal to 10^6 multiplications to verify. The
    NEGATIVE certificate is an exhaustive statement - for every |D| at most B
    with |D| congruent to 0 or 3 modulo 4, either |D| does not divide 4p - 1 or
    the quotient is not a perfect square - which establishes |D| greater than B
    rigorously and costs B divisions plus B integer square roots to verify. That
    asymmetry is disclosed, not hidden.

    (C3) THE ANSWER IS PUBLISHED AND THAT MAKES THIS A CHECK, NOT A LOOKUP.
    inputs/SAFECURVES-20260825/tables/disc.tsv, read directly on 2026-08-29,
    gives this row's trace as 1 and its CM field discriminant as
    "-11= -1 * 11, approx -2^3.5", with the "|D| above 2^100?" cell False. So the
    derivation of C1 and C2 has a PRE-STATED TARGET - the scan must return
    |D| equal to 11 with f^2 equal to (4p - 1)/11, and it must find nothing
    smaller. THIS IS BETTER FOR THE RECORD, NOT WORSE. A derivation whose answer
    is known in advance and which reads none of the inputs that produced it is a
    genuine consistency test between an offline computation and a published
    compilation, and it is exactly the "pending check" the goal's own next_action
    says every stated numeric relation in this dossier is still waiting for. TWO
    OUTCOMES, BOTH INFORMATIVE. AGREEMENT converts a published integer into one
    this program can re-verify in one multiplication. DISAGREEMENT means either
    the mirror, the intake modulus, or the derivation is wrong, and the record
    must localise which by re-reading pages/disc.html per the recorded authority
    order - never by preferring the more convenient value.

    (C4) A DERIVATION THE PUBLISHED SOURCE ITSELF DOES NOT CARRY, AVAILABLE FOR
    FREE. inputs/SAFECURVES-20260825/tables/transfer.tsv gives this row as "False"
    for the additive transfer but "Unverified" for BOTH the multiplicative
    transfer and the embedding degree - the only row of the twenty where those
    cells are not filled. There is a one-line reason and this program can supply
    it. For a trace-one curve the prime subgroup order l equals p, which is the
    field characteristic, so p^k is congruent to 0 modulo l for every k at least
    1 and is NEVER congruent to 1; the multiplicative order ord_l(p) therefore
    DOES NOT EXIST and the embedding degree is undefined rather than large. That
    is a checkable derivation, it explains an "Unverified" cell in the source, and
    it independently supports IDEA-20260829-f5bcff's prediction that a
    single-clause threshold predicate cannot cover both the Anomalous and the BN
    transfer failures, because the two rows fail for reasons that are not
    commensurable quantities at all.

    (C5) WHAT IS NOT CLAIMED. Nothing here is an attack, nothing moves an
    exponent, and a small discriminant is not a break - no ECDLP attack is known
    that exploits small |D| beyond the sqrt(|Aut|) rho discount of KN-TECH-018,
    nontrivial only for D equal to -3 or -4, and this record proposes none. The
    record also does NOT adjudicate the disc criterion cell, because the
    criterion's numeric threshold lives in pages/disc.html, which this session did
    not open.

  mechanism: >-
    THE TRACKED OBJECT is the SQUARE PART OF THE FROBENIUS DISCRIMINANT - the
    pair (D, f) with t^2 - 4p = f^2 D, D a fundamental discriminant, carried as a
    projection of the whole curve tuple.

    OBJECT-FIRST GENERATION, per docs/inventor-protocol.md sections 1 and 2, with
    the standing caveat that this program has no written object enumeration for
    the ECDLP - KN-OPEN-019 - so what follows is a sketch and not a taxonomy.
    ESTABLISHED FAMILIES ON A TRACE-ONE CURVE, NAMED AND DECLARED OFF-LIMITS AS
    THE PRIMARY LENS - (F1) the point walked by rho; (F2) the formal-group
    logarithm coordinate, which is Smart, Satoh-Araki and Semaev and is exactly
    IDEA-20260829-f89a3a's object; (F3) the pairing image, which C4 shows is not
    merely inapplicable but UNDEFINED here; (F4) summation-polynomial objects.
    CANDIDATE OBJECTS SCORED ON THE THREE AXES.
    (O1) THE SQUARE PART OF t^2 - 4p. Genuinely new in this program as a computed
    object - a 2026-08-29 grep finds no CM discriminant, no conductor and no
    square-part computation anywhere in knowledge/ or ledger/ for any named
    curve, and the published mirror gives the VALUE of D but no conductor f and
    no witness. Concretely testable - its one-step propagation is the map p to
    (D, f), measured by exact integer equality against a pre-stated target, with
    an exhaustive negative available. Survives every isogeny, every twist and
    every model change. CHOSEN.
    (O2) The formal-group logarithm coordinate. Family F2, off-limits, and
    already taken by f89a3a.
    (O3) The LIFT-AMBIGUITY MODULE - the subgroup of F_p by which the formal-log
    coordinate of [#E] times a lift is undetermined, which is trivial exactly
    when #E is divisible by p. Interesting because it QUANTIFIES why f89a3a's
    attack is binary rather than graceful, and recorded here as an OPEN DIRECTION
    rather than proposed, because its predicted measurement - uniform over F_p off
    trace one, a point mass at trace one - is a two-valued observable with no
    intermediate regime, and an experiment whose outcome space has two points
    already known algebraically is not worth compute.
    (O4) The conductor of End(E) itself, as distinct from f. NOT determined by p,
    NOT published by the mirror, and NOT obtainable here without isogeny-class
    computation; recorded as an open direction and as an explicit limitation
    of O1.

    LOSSY-PROJECTION TEST ON O1, applied before any experiment, costing no
    compute.
    WHAT IS DISCARDED - a 204-bit modulus plus two 204-bit curve coefficients,
    the base point, the group structure and the entire odd part of the group,
    collapsing to one small negative integer D and one roughly 102-bit conductor
    f. The curve equation is discarded ENTIRELY - it is not read at any point in
    the computation of (D, f) once the trace is known.
    IS IT A CHANGE OF COORDINATES? NO, and the fibre is exhibitable rather than
    merely asserted. Every curve over F_p with trace plus or minus 1 has the SAME
    (D, f); so do all curves in the same F_p-isogeny class; so, for a small |D|,
    do the curves over every other prime p' with 4p' - 1 equal to |D| f'^2, an
    infinite family. Nothing about a, b or the base point is recoverable. This is
    the direct contrast with the (Delta, Pi) worked example of KN-LIT-7595, from
    which the unordered pair is recoverable as the roots of a quadratic and which
    therefore gains nothing.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? Four operations, four answers,
    all deterministic. (i) QUADRATIC TWISTING - t maps to -t, so t^2 is invariant
    and (D, f) is EXACTLY INVARIANT; the object cannot distinguish a curve from
    its twist and that is disclosed as its principal blindness. (ii)
    F_p-ISOGENY - t is an isogeny-class invariant, so (D, f) is constant along
    the class, though the conductor of End(E) may vary within it, which is object
    O4 and is NOT captured. (iii) MODEL CHANGE, Weierstrass to Montgomery to
    Edwards - birational over F_p, so #E and t are unchanged and (D, f) is
    preserved; unlike the 2-adic instrument of IDEA-20260829-d052e6, NO chain has
    to be recomputed in the new model, because the object never reads the model.
    (iv) BASE CHANGE to F_p^m - t changes by the Frobenius recursion and the
    object must be recomputed; it does not propagate and that is stated. PASSES
    on the three operations the audit uses.
    WHERE THE STRUCTURE DISSOLVES - at any curve whose trace is not known
    independently. For most rows the trace must be read from the mirror or
    derived from a transcribed order; on THIS row the structure supplies its own
    input, and that self-sufficiency is the reason this record is filed against
    THIS question.

    WHAT THE MIRROR CHANGES AND WHAT IT DOES NOT. inputs/SAFECURVES-20260825/ has
    carried the SafeCurves pages, fifteen derived per-page TSV tables and thirteen
    specification documents since 2026-08-25, and I read this row's cells in
    tables/disc.tsv, transfer.tsv, rho.tsv, twist.tsv and index.tsv on 2026-08-29.
    So nothing in this record is motivated by the values being unavailable. What
    the mirror does NOT supply is (a) any witness this program can re-verify, (b)
    the conductor f, which appears in no table, (c) any explanation of the
    "Unverified" transfer cells, which C4 supplies, and (d) protection against a
    transcription defect in either direction. The record's value therefore moves
    from ACCESS to VERIFICATION - a smaller claim, honestly stated.
    READING DISCIPLINE, BINDING. The mirror carries a documented defect,
    MIRROR-DEF-1 in source_record_addendum_01.yaml - the pages/*.txt renderings
    are produced by stripping tags, which COLLAPSES EMPTY TABLE CELLS and blurs
    row boundaries, so a comment belonging to one row can appear attached to
    another; the confirmed instance is the M-383 row of pages/rigid.html, whose
    comments cell is EMPTY while the adjacent Curve383187 row carries one. THE
    RECORDED AUTHORITY ORDER IS pages/*.html and specs/* FIRST, tables/*.tsv
    NEXT, pages/*.txt LAST and prose only. Every mirror value in this record came
    from tables/*.tsv, the SECOND tier; any value that becomes load-bearing must
    be re-read from pages/*.html before the claim is filed, and NO value may be
    sourced from a .txt rendering. THIS ROW IS UNUSUALLY EXPOSED TO THAT DEFECT,
    because its transfer row contains TWO cells reading "Unverified", and an
    empty-versus-Unverified confusion in a stripped rendering is precisely the
    failure mode the addendum describes - so C4's reading must be confirmed
    against pages/transfer.html before it is asserted.

    HOW THIS DIFFERS FROM IDEA-20260829-f89a3a, STATED EXPLICITLY BECAUSE THE
    TWO RECORDS SHARE A CURVE. (1) DIFFERENT LANE - f89a3a is L6-TRANSFER, this
    is the disc lane and the "CM discriminant and conductor structure" entry of
    the eight additional diagnostics. (2) DIFFERENT OBJECT - f89a3a tracks the
    formal-group logarithm coordinate of a POINT; this tracks the square part of
    an INTEGER derived from the field. (3) DIFFERENT INPUTS - f89a3a needs the
    curve equation, a base point and a generated instance; this needs the modulus
    and a trace certificate and never reads the coefficients. (4) DIFFERENT
    CERTIFICATE KIND - f89a3a emits a `discrete_log` certificate; this emits
    neither `discrete_log` nor `decomposition` but an arithmetic-identity
    witness, so under docs/claims-and-verification.md its run is `kind: none` for
    the certificate field and the identity is carried as a first-class artifact,
    which the record states plainly rather than mislabelling. (5) NON-OVERLAPPING
    OUTCOMES - f89a3a succeeding tells you nothing about |D|, and this record
    returning 11 tells you nothing about whether the additive solver works.
    (6) A GENUINE DEPENDENCY IN ONE DIRECTION ONLY - both need the trace certified
    as 1, and that certificate ([p]G equal to the identity for several independent
    G, plus Hasse uniqueness) is f89a3a's heuristic H1 and is REUSED here rather
    than re-minted. If f89a3a runs first, this record consumes its trace
    certificate; if not, this record produces it, at a cost of ten scalar
    multiplications. Note that the mirror also STATES the trace as 1, which is a
    third, independent-of-both corroboration and is used as such and not as a
    substitute for either.

    EXECUTION. Step 1, certify the trace and compare against the mirror. Step 2,
    form n equal to 4p - 1 and scan |D|. Step 3, emit either the (D, f) witness or
    the exhaustive bound, and compare against the mirror's |D| equal to 11. Step
    4, the nulls and the nearby-object controls. Step 5, the C4 derivation and the
    family sweep.

