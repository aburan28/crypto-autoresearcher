    order is t^2 - 4p, the CM field is Q(sqrt(t^2 - 4p)), and complex-
    multiplication construction of anomalous curves is standard. The label is
    `unverified` and NOT `known` because the EXTERNAL LITERATURE was not read -
    no textbook or paper was opened in this session, and the recalled sources
    below carry `verified_by: null`. Reading the in-repository SafeCurves mirror
    does NOT change that label: the mirror is a table of results, not a
    derivation, and it establishes nothing about who first stated the identity or
    about whether the trace-determined framing is novel. Per
    agents/idea-generator.md a proposal whose external literature is entirely
    recalled is `unverified`. NO NOVELTY IS CLAIMED FOR THE MATHEMATICS.
