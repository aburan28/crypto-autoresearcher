  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, minutes of thought. Write out C1's derivation, C4's
      one-line embedding-degree argument, and the null-density count as a
      derivation note. A failure here is the cheapest possible negative and costs
      no machine time.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR, seconds of compute. Test p for
      primality at a stated tier; draw 10 random non-identity points on the
      intake curve; check [p]G equals the identity for each; then scan |D| from 3
      to 10^6 and report the first hit. RECORD THE DERIVED VALUE BEFORE OPENING
      THE MIRROR CELL IN THE RUN LOG, then compare against the published 11. This
      settles the trace question and the discriminant question in seconds. IF THE
      TRACE CHECK FAILS, EVERYTHING ELSE IS WITHDRAWN AND THAT IS THE RESULT.
      STAGE 2, minutes. Extend the scan to B equal to 10^8 across the 14 cores if
      Stage 1 found nothing, and emit either the (D, f) witness or the exhaustive
      bound with its B. Report f, which no source carries.
      STAGE 3, minutes. The toy complex-multiplication ladder over all nine
      class-number-one discriminants at 30 bits; the trace-two nearby control at
      matched size; the wrong-trace controls at the real modulus.
      STAGE 4, minutes. The null - 10^4 random 204-bit primes and 10^4 random
      206-bit odd integers through the identical code path, seeds recorded.
      STAGE 5, seconds. THE TWENTY-ROW REGRESSION FIXTURE - run the instrument on
      every mirror row using the mirror's published trace, and compare against the
      mirror's D column, reporting exact matches, bound-branch confirmations and
      any failure. Re-read every load-bearing cell from pages/*.html first.
      STAGE 6, seconds. The C4 check and its pages/transfer.html confirmation.
    controls:
      - >-
        POSITIVE, BLOCKING - toy curves constructed by complex multiplication
        with KNOWN |D| across all nine class-number-one discriminants at 30 bits.
        The instrument must return each exactly. AN INSTRUMENT THAT HAS NEVER
        RETURNED A VALUE OTHER THAN THE ONE IT REPORTS CANNOT CERTIFY THAT VALUE;
        this is IDEA-20260807-98a970's blocking rule applied to a different lane,
        and it is sharpened here because the target value is published in advance.
      - >-
        NEARBY-OBJECT NEGATIVE, THE SHARP ONE - a trace-two curve at matched size
        and matched discriminant family, one integer of trace away. Must return a
        different decomposition.
      - >-
        WRONG-TRACE CONTROL AT THE REAL MODULUS - feed the instrument t equal to
        2, 3 and 0 at the intake p. It must produce different answers, and for a
        generic wrong t it must find NO small |D| - the same 89-bit signal read in
        reverse, and a full-size test of the arithmetic.
      - >-
        PUBLISHED-ROW NEGATIVE BRANCH - the mirror's seventeen rows with |D| above
        2^100. The instrument must return a BOUND for each, not a value. A value
        returned for any of them contradicts the mirror and must be localised.
      - >-
        NULL, SAME SHAPE, QUANTIFIED - 10^4 uniformly random 204-bit primes with
        seeds recorded, identical code path, expected zero hits against a density
        of about 2^-88.7. A spurious hit voids the instrument.
      - >-
        SECOND NULL - 10^4 random 206-bit odd integers, not necessarily prime,
        through the same scan, to separate a defect in the primality path from a
        defect in the square-part path.
      - >-
        MIRROR-READING CONTROL, ADDED IN RESPONSE TO MIRROR-DEF-1 - for every
        mirror cell used, read the value from tables/*.tsv AND from the
        corresponding pages/*.html and require exact agreement; additionally read
        the same cells from pages/*.txt and record whether the known row-boundary
        collapse actually corrupts them for this row, whose two "Unverified"
        transfer cells are the most exposed in the family. This is a direct,
        cheap measurement of MIRROR-DEF-1's blast radius that no record holds.
      - >-
        CROSS-IMPLEMENTATION - every perfect-square test performed twice, once by
        math.isqrt with an exact re-multiplication and once by an independent
        Newton iteration on integers. Disagreement on any input voids the run.
      - >-
        DEGENERATE-INPUT CONTROL - |D| equal to 4p - 1 itself, f equal to 1, which
        trivially satisfies the identity and must be REJECTED by the |D| at most B
        constraint rather than reported as a hit. This is the single most likely
        way to manufacture a false positive and it is pre-registered.
    required_metrics:
      - 'the primality tier reached for p, and the exact modulus used'
      - 'the 10 [p]G witnesses with the points used'
      - 'the exact integer 4p - 1'
      - 'the derived |D|, recorded BEFORE the mirror cell is opened in the run log'
      - 'the pair (D, f) with the verifying product as an exact integer, or the bound B with the scan parameters'
      - 'log2 f, and the small-prime factorisation of f found within a declared trial-division bound'
      - 'per toy CM curve, the constructed |D| and the returned |D|'
      - 'the trace-two and wrong-trace control outputs'
      - 'the twenty-row regression outcome per row, exact match or bound or failure'
      - 'the null hit count over 10^4 random primes and 10^4 random odd integers, with seeds'
      - 'per mirror value used, the file and the authority tier it was read from, and the tsv-versus-html agreement'
      - 'the C4 check result and its pages/transfer.html confirmation'
      - 'wall clock per stage, the B actually reached, and the core count used'

  falsification_conditions:
    - >-
      [p]G is not the identity for some random non-identity G on the intake
      curve. The row is not anomalous, C1 does not apply, and this contradicts
      both the intake and the mirror - a material finding about the family's
      designated positive control; halt, report, and do not proceed to the scan.
    - >-
      p is composite. The Hasse-uniqueness argument collapses; every claim is
      withdrawn.
    - >-
      The derived |D| is not 11. Either the mirror, the modulus, or the derivation
      is wrong; halt, re-read pages/disc.html per the recorded authority order,
      and report which. DO NOT prefer the more convenient value, and DO NOT extend
      B opportunistically - any extension is declared in advance with its cost.
    - >-
      No |D| at most 10^8 is found. This certifies |D| greater than 10^8 and
      CONTRADICTS the mirror's published -11 as well as the intake's own
      description; it is a decisive localisable discrepancy, not an inconclusive
      search.
    - >-
      Any toy complex-multiplication curve whose constructed |D| the instrument
      fails to return, or any of the twenty regression rows that fails. The
      instrument is void and nothing is reported at 204 bits.
    - >-
      Any hit on the 10^4-sample random-prime null. The divisibility or
      perfect-square test is wrong and the 89-bit signal is not real.
    - >-
      The instrument returns the same answer for the trace-two control as for the
      trace-one row. It is not reading the trace and every output is void.
    - >-
      Any disagreement between the two independent perfect-square implementations,
      or any tsv-versus-html disagreement on a mirror cell used here. The former
      is an implementation failure; the latter is a defect in the derived table
      beyond MIRROR-DEF-1's recorded scope and must be reported against the source
      record.
    - >-
      p^k congruent to 1 modulo l for some k, contradicting C4. Then l is not p
      and the trace certificate is wrong; halt.

  confounders:
    - >-
      CONFIRMATION BIAS AGAINST A PUBLISHED ANSWER, AND IT IS NOW THE LEADING
      RISK IN THIS RECORD. The mirror states |D| equal to 11 and the trace equal
      to 1 before the executor computes anything, so an implementation that is
      subtly wrong is far likelier to be tuned until it matches than to be caught.
      MANDATORY MITIGATION - the run log records the derived |D| BEFORE the mirror
      cell is opened, and the twenty-row regression fixture is run afterwards so
      that a defect tuned to one row is exposed on nineteen others.
    - >-
      f EQUAL TO 1 IS A TRIVIAL SOLUTION. Every integer n satisfies n equals n
      times 1^2, so without the constraint |D| at most B the scan "succeeds"
      vacuously on every input, including every null sample. The constraint is
      what makes the null 2^-88.7 rather than 1, and an implementation that
      forgets it will report a 100 percent hit rate and look spectacular. This is
      the single most likely defect and it is pre-registered as a control.
    - >-
      FUNDAMENTAL VERSUS NON-FUNDAMENTAL D. The scan finds the largest square
      factor, giving a squarefree-ish cofactor; converting that to a FUNDAMENTAL
      discriminant requires the congruence adjustment D congruent to 0 or 1 modulo
      4, which changes D by a factor of 4 and f by a factor of 2 in half the
      cases. The mirror's own column is headed "CM field discriminant" and gives
      -11, which is fundamental, and -3 for the two j equal to 0 rows; a record
      that reports D without stating which convention it used has reported an
      ambiguous quantity, and the two conventions differ by exactly the factor a
      threshold comparison would be made against.
    - >-
      THE FROBENIUS ORDER IS NOT End(E). The instrument determines the
      discriminant of Z[pi] and the CM FIELD; End(E) may be a larger order with a
      conductor dividing f. A record that writes "the endomorphism ring has
      discriminant D" has overstated the observable.
    - >-
      MIRROR-DEF-1, AND THIS ROW IS THE MOST EXPOSED IN THE FAMILY. Its transfer
      row carries two "Unverified" cells; a stripped-text rendering that collapses
      empty cells could make an "Unverified" appear to belong to a neighbouring
      row or vice versa. C4 is therefore blocked on a pages/transfer.html re-read
      and must not be asserted from the TSV alone.
    - >-
      TOY-SCALE CONSTRUCTION BIAS. The toy ladder uses only class-number-one
      discriminants because the Hilbert class polynomial must be linear. So every
      toy curve is special in a second way, and an instrument secretly depending
      on |D| being in that nine-element list would pass the ladder. The mitigation
      is that the instrument reads only an integer and never the curve - an
      argument, stated as one - and the twenty-row regression fixture, which
      includes seventeen rows with |D| far outside that list.
    - >-
      A SMALL DISCRIMINANT IS NOT A WEAKNESS. SafeCurves' disc criterion is
      prudential; no ECDLP attack is known that exploits small |D| beyond the
      sqrt(|Aut|) rho discount of KN-TECH-018, a CONSTANT factor nontrivial only
      for D equal to -3 and -4. Reporting a small |D| as a vulnerability would be
      a claim-tier violation.

  interpretation_limits:
    - >-
      NOTHING HERE IS AN ATTACK AND NOTHING HERE MOVES AN EXPONENT. The record
      computes an invariant; it mounts no algorithm against the ECDLP. Per the
      target profile this is explicitly NON-TARGET-CLASS work, and its priority
      rests on being a cheap building block that converts published values into
      re-verified ones and produces one quantity (the conductor f) that no source
      in the repository holds - not on ambition.
    - >-
      A SOLVE OR AN INVARIANT ON A DELIBERATELY BROKEN CURVE IS NOT A DISCOVERY.
      The Anomalous row exists in the family to be broken; measuring its
      discriminant is instrument validation, and the goal's own claim boundaries
      say so when they call this row a positive-control candidate.
    - >-
      AGREEMENT WITH THE MIRROR IS CONSISTENCY, NOT CORRECTNESS, AND NOT SOURCING.
      SafeCurves is a compilation; the goal's first completion criterion asks for
      reconciliation to PRIMARY or authoritative sources with citation provenance,
      and inputs/SAFECURVES-20260825/specs/ carries thirteen specification
      documents this session did not open. This record does not satisfy that
      criterion and must not be cited as doing so.
    - >-
      THE DISC CELL IS NOT ADJUDICATED BY THIS RECORD. The criterion's numeric
      threshold lives in pages/disc.html, which this session did not read. The
      record MEASURES |D| and REFUSES to compare it to a threshold it has not
      read. Note for successors - IDEA-20260829-f5bcff proposes recovering that
      threshold by inverting the verdict table, and its motivating premise that
      the criterion pages are unreachable is superseded by the mirror; the
      threshold should now simply be read, which makes f5bcff's inversion a
      cross-check on a readable definition rather than a substitute for it.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) THE IDENTITY
      t^2 - 4p equals f^2 D and the square-part instrument transfer FULLY and
      verbatim to every row - field-agnostic, model-agnostic, twist-invariant, and
      reading no curve equation. The twenty-row regression fixture IS that
      transfer and is part of the minimal test. (b) THE INPUT is now available for
      all twenty rows, because the mirror publishes a trace for every one; but
      only THREE rows can supply it INDEPENDENTLY of the mirror - Anomalous, where
      #E equal to p forces t equal to 1 (this record); BN(2,254), where the
      polynomial family gives t equal to 6u^2 + 1 from a recovered u
      (IDEA-20260829-3e330e); and secp256k1, where the j equal to 0 CM structure
      gives six candidate traces by Cornacchia (IDEA-20260829-3af6ec). For the
      other seventeen the check is instrument-versus-mirror rather than
      derivation-versus-mirror, which is a weaker but still real check, and the
      deliverable must label which kind each row got. (c) THE CONDUCTOR f is new
      for ALL TWENTY rows, since the mirror publishes none. (d) AS A CONTROL the
      transfer is FULL - once the instrument has returned constructed
      discriminants on the toy ladder and reproduced the mirror's column on twenty
      rows, all twenty goals' disc lanes can cite a fired instrument. (e) C4
      transfers to trace-one curves only, which is one row. (f) NO TRANSFER AT ALL
      to any claim about the odd part of any group, about End(E), or about any
      curve's security.
    - >-
      The negative certificate is NOT succinct - verifying |D| greater than B
      genuinely costs B operations, the same honest fallback
      IDEA-20260807-98a970 records for its embedding-degree bound. Presenting it
      as a short proof would be dishonest, and it matters here because seventeen
      of twenty rows can only ever get the negative branch from this instrument.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random prime p of 204 bits, the integer 4p - 1 behaves
        like a uniformly random integer of the same size with respect to having a
        divisor decomposition m times f^2 with m at most B; formally,
        Pr[there exist m at most B and f with 4p - 1 equal to m f^2] is at most
        2 sqrt(B) / sqrt(4p), which at B equal to 10^8 and p near 2^204 is about
        2^-88.7.
      rigorous_support: >-
        The RIGOROUS half is a counting bound needing no heuristic at all - the
        number of integers below X of the form m f^2 with m at most B is at most
        the sum over m at most B of sqrt(X/m), which is at most 2 sqrt(B) sqrt(X),
        an exact and elementary estimate. That upper bound is the ONLY thing the
        null control needs. The HEURISTIC half is only that PRIMES are not biased
        toward this shape relative to all integers, which imitates the classical
        statement that the squarefree density among shifted primes matches the
        density 6/pi^2 among integers - a Landau-type result whose analogue for
        shifted primes is standard but is asserted here rather than cited, and
        that gap is recorded rather than hidden.
      validation_plan: >-
        SAMPLING - 10^4 uniformly random 204-bit primes AND, separately, 10^4
        uniformly random 206-bit odd integers, seeds recorded, through the
        identical scan; running BOTH populations separates a bias in primes from a
        defect in the scan. SCALE AND PARAMETERS RECORDED - the two population
        sizes, the bound B, and the seeds. COMPARISON DISTRIBUTION - the observed
        hit rate against the exact combinatorial bound 2 sqrt(B) / sqrt(X); this
        is an EXACT null, not an asymptotic one, so the test can only REFUTE the
        exponent and never confirm it, which is stated rather than glossed. A
        SECOND, EMPIRICAL COMPARISON IS NOW AVAILABLE - the mirror's twenty rows,
        seventeen of which report |D| above 2^100, are real curves rather than
        random integers and give an independent sanity check on the rarity claim,
        with the obvious caveat that standardised curves are not randomly chosen.
        TAIL CHECK - the empirical distribution of the LARGEST square divisor
        found in each sample without the |D| at most B cut, which should follow
        the sum over f of 1/f^2 tail, so that about 1 sample in 4 has a square
        divisor at least 4 and essentially none above 2^20. TRANSFER - none, since
        the null runs at the real bit length.
    - id: H2
      statement: >-
        An instrument whose output agrees with the constructed discriminant on
        100 percent of an exhaustive toy population at 30 bits is correct at 204
        bits; formally, the map from (p, t) to (D, f) has no size-dependent
        failure mode - overflow, truncation, or an inexact integer square root -
        first appearing above 30 bits.
      rigorous_support: >-
        NONE, and the record says so plainly. This is the same shape as heuristic
        H2 of IDEA-20260829-d052e6 and of IDEA-20260829-f89a3a and as the archived
        audit plan's H4. THREE mitigations, stated as mitigations and NOT as
        support. (i) The POSITIVE output is verified at 204 bits by one exact
        big-integer multiplication independent of the scan, so a wrong (D, f) is
        CAUGHT. (ii) The mirror supplies FULL-SIZE EXPECTED VALUES for twenty
        rows spanning 204 to 521 bits, so a size-dependent defect surviving the
        toy ladder has twenty independent full-size chances to be caught - a
        materially better position than d052e6 or f89a3a were in, and the concrete
        benefit of the mirror to this record. (iii) The one genuinely
        size-sensitive primitive is the integer square root, cross-implemented
        against a second routine on every input. THE NEGATIVE OUTPUT HAS NO SUCH
        CHECK - a bound |D| greater than B is only as good as the scan that
        produced it, and that asymmetry is the honest weak point.
      validation_plan: >-
        SAMPLING - the nine class-number-one toy curves at 30 bits, the same
        ladder at 40, 60 and 80 bits, the wrong-trace controls AT THE REAL 204-BIT
        MODULUS, and the twenty-row regression fixture at 204 to 521 bits.
        COMPARISON - exact integer equality throughout, and cross-implementation
        agreement of the integer square root on 10^4 inputs at 206 bits. TAIL
        CHECK - inputs with f near 1, f near 2^102, and 4p - 1 a perfect square
        plus or minus 1, where an off-by-one in the square test surfaces first.
        TRANSFER - correctness is assumed to transfer; cost is measured at every
        size and not transferred. The record states plainly that no independent
        SOLVER exists for this quantity above the toy ladder, only an independent
        VERIFIER on the positive branch and a published comparison target.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS AVAILABLE FROM THIS OBJECT. As an
      audit instrument the scan costs O(B) big-integer divisions plus O(B) integer
      square roots on a roughly 206-bit operand, that is O(B log^2 p) bit
      operations - at B equal to 10^8 this is minutes in Python across 14 cores
      and seconds at B equal to 10^6. The trace certificate costs 10 scalar
      multiplications, O(log p) group operations. C4 costs one modular
      exponentiation and a one-line argument. VERIFICATION IS ASYMMETRIC and that
      asymmetry is the record's honest complexity statement - the POSITIVE witness
      verifies in ONE big-integer multiplication and is genuinely succinct, while
      the NEGATIVE certificate |D| greater than B costs B operations to verify,
      exactly as IDEA-20260807-98a970 records for its lower-bound embedding-degree
      certificate.
    memory_exponent: >-
      O(log p) working memory and O(log p) certificate size - a few hundred bytes
      per row. The 48 GB envelope is not a binding constraint; the 14 cores are
      used only to parallelise the scan and the 10^4-sample nulls, both
      embarrassingly parallel.
    best_known: >-
      For the VALUE of the CM discriminant of any row in this family, the best
      known route is now to read inputs/SAFECURVES-20260825/tables/disc.tsv, which
      costs one file read and returns D for all twenty rows - that incumbent
      strictly dominates this record on cost, and this record does not dispute it.
      For a WITNESS, and for the conductor f, no incumbent exists inside or
      outside this program that has been identified. For an arbitrary curve not in
      the family, the best known route is a full SEA point count to obtain t,
      roughly O(log^8 p) bit operations, unavailable in this environment, followed
      by the same square-part extraction; on a TRACE-ONE curve the point count is
      unnecessary and this record's route is the best available, a statement about
      a measure-zero family and not a frontier claim. Against the ECDLP attack
      frontier - rho at 0.886 sqrt(N) (KN-TECH-001, KN-TECH-006), which the mirror
      evaluates as 2^101.6 for this row, automorphism-discounted rho
      (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
      (KN-TECH-032), and the trace-one additive transfer (KN-TECH-033) - this
      record is dominated by every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. Four honest hidden costs. (i) SCOPE -
      the SELF-SUPPLYING trace input holds only for trace-one curves, a set of
      density about 4 sqrt(p) over p among Hasse-admissible orders, so the
      retrieval-independent property applies to one row in twenty; for the other
      nineteen the trace comes from the mirror and the check is weaker. (ii) THE
      NEGATIVE CERTIFICATE IS NOT SUCCINCT, and seventeen of twenty rows can only
      get the negative branch. (iii) CORRECTNESS at 204 bits is carried by
      heuristic H2 with no rigorous support, mitigated on the positive branch. (iv)
      The output is an invariant of the ISOGENY CLASS and the FIELD, not of the
      curve, so it answers a strictly weaker question than a reader may assume.
    tradeoff_note: >-
      One genuine tradeoff, and it is unusual. The instrument buys a factor of
      roughly log^5 p in time over SEA by discarding the curve entirely - it
      answers a strictly weaker question, and there is NO setting of any parameter
      that recovers the group order or the odd part from this object. That is the
      lossy-projection test passing, read as a cost. A SECOND TRADEOFF IS B - a
      larger B strengthens the negative certificate linearly in cost and only
      logarithmically in evidential value, since the null density falls as
      sqrt(B); B is declared in advance and the B reached is reported. No
      time-memory tradeoff exists and parallelisation is linear and trivial.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. AS AN ATTACK it is dominated by every row, because it is not an
    attack - rho (KN-TECH-001, KN-TECH-006), automorphism-discounted rho
    (KN-TECH-018), BSGS (KN-TECH-031) and its n^{2/3+o(1)} full cost
    (KN-TECH-035), MOV and Frey-Ruck (KN-TECH-032), and the trace-one additive
    transfer (KN-TECH-033) all dominate it on time, memory and data
    simultaneously. AGAINST IDEA-20260829-f89a3a ON THE SAME CURVE it is dominated
    on every axis a solve is measured by - that record produces a crypto-tier
    discrete logarithm and this produces an arithmetic invariant - and it is NOT
    dominated on the axis this record occupies, because f89a3a produces no
    discriminant and its object cannot reach one. Pareto-incomparable across
    lanes. AS A SOURCE OF THE VALUE, inputs/SAFECURVES-20260825/tables/disc.tsv
    STRICTLY DOMINATES this record on cost - one file read against minutes of
    scanning - and that domination is stated first, not buried. This record is NOT
    dominated on three narrow axes and they are its entire case: it produces a
    WITNESS the mirror does not carry, verifiable in one multiplication; it
    produces the CONDUCTOR f, which appears in no table in the mirror and in no
    record in this program; and it produces the C4 derivation explaining the two
    "Unverified" cells the mirror leaves blank for this row. AS A GENERAL
    MEASUREMENT INSTRUMENT a full SEA point count dominates it on INFORMATION,
    returning #E exactly and working on every curve, but does NOT dominate it on
    TIME and is unavailable in this environment, so the two are incomparable on
    the time-versus-generality plane.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS DATA, STATED AT ITS
    TRUE AND SMALLER SIZE NOW THAT THE MIRROR IS ACCOUNTED FOR - the VALUE of D
    for this row is not new to the repository; inputs/SAFECURVES-20260825/ has
    carried it since 2026-08-25 and reports it as -11. What does not exist
    anywhere in ledger/ or knowledge/, and what this record would produce, is - a
    one-multiplication WITNESS for that value; the CONDUCTOR f, which no table in
    the mirror carries for ANY of the twenty rows; a twenty-row regression fixture
    comparing an independent instrument against the published D column; a measured
    null over 2 times 10^4 samples quantifying the roughly 89-bit rarity of the
    small-|D| shape; a fired toy ladder over nine constructed discriminants; the
    C4 derivation explaining the only two "Unverified" cells in the mirror's
    transfer table; and a direct measurement of MIRROR-DEF-1's blast radius on the
    row most exposed to it. AS COST - the disc lane for this row moves from a
    published number with no witness to a number this program can re-verify in one
    multiplication, and the conductor moves from nonexistent to computed. AS
    PROCESS - the goal's next_action names the deficiency as an unperformed
    arithmetic check on transcribed relations; this record performs that check for
    one of the eight declared additional diagnostics, on one row, and reports
    exactly which of the other nineteen got the weaker instrument-versus-mirror
    form instead of the derivation-versus-mirror form.
  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Under 150 lines of elementary integer arithmetic - primality test, scalar
      multiplication via harness/toycurve.py, a divisor scan, an integer square
      root, and a TSV parser for the regression fixture. Stage 1 is seconds; Stage
      2 at B equal to 10^8 is minutes across 14 cores; the toy ladder, the twenty-
      row fixture and the two 10^4-sample nulls are minutes. No pairing, no
      extension fields, no factoring, no network.
  recommended_priority: high

