        Miyaji 1993 on elliptic curves over F_p suitable for cryptosystems
      provenance: recalled
      claim: >-
        That an ordinary curve over F_p with trace t has complex multiplication
        by an order in Q(sqrt(t^2 - 4p)) with t^2 - 4p equal to f^2 D; that
        curves with prescribed small |D| and prescribed trace are constructed by
        solving 4p equal to t^2 + |D| v^2 and taking j to be a root of the
        Hilbert class polynomial H_D modulo p; and that this is the standard
        route to anomalous curves at sizes where search is infeasible. NOT OPENED
        IN THIS SESSION. Named so a reviewer with retrieval can chase them. The
        proposal does NOT rely on the recollection for its rigorous content -
        C1's identity is definitional and the scan of Step 2 tests it by exact
        integer equality against both the modulus and the mirror's published
        |D| equal to 11, failing loudly if the recollection is wrong. Note that
        |D| equal to 11 has class number 1, so if the curve was built this way the
        Hilbert class polynomial for it is linear, which is consistent with
        f89a3a's toy construction ladder and is a checkable structural remark
        rather than a claim about provenance.
      verified_by: null

  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers and math.isqrt. This is the assumption the archived batch could
      NOT make - its producer had no shell and performed no arithmetic - and it
      is the declared blocker of all twenty goals.
    - >-
      No Sage, no PARI, no SEA backend and NO NETWORK EGRESS is required: the
      derivation needs only the modulus, and the comparison target is already in
      the repository under inputs/SAFECURVES-20260825/.
    - >-
      MIRROR READING DISCIPLINE IS BINDING. Per MIRROR-DEF-1 the pages/*.txt
      renderings collapse empty cells and may attach a row's content to a
      neighbour. Values are taken from tables/*.tsv for screening and RE-READ from
      pages/*.html before any claim is filed on them; no value is ever taken from
      a .txt rendering; the executor records the authority tier per value. This
      row's two "Unverified" transfer cells are specifically at risk and C4 is
      blocked on an HTML re-read.
    - >-
      The intake modulus is used exactly as recorded in RQ-SCURVE-84a540 and is
      NOT re-typed from memory. Its agreement with the mirror's index table is a
      consistency check; the row remains a positive-control CANDIDATE per the
      goal's claim boundaries, and SafeCurves is a compilation rather than a
      primary specification, so the goal's first completion criterion is NOT
      satisfied by this record.
    - >-
      p is verified prime at a stated tier before anything else. If p is
      composite the Hasse-uniqueness trace argument collapses and every claim
      here is withdrawn.
    - >-
      Scope is prime fields and ordinary curves in odd characteristic. A
      supersingular curve has trace 0 over F_p and is out of scope; the trace
      certificate excludes that case explicitly rather than by assumption.

  proof_search_map:
    bottleneck: >-
      Converting this row's published CM discriminant into a re-verified one, and
      obtaining the conductor f, which no source in the repository carries. The
      goal's next_action records the deficiency exactly - the producer performed
      no arithmetic, so every stated numeric relation is a transcription plus a
      pending check. The bottleneck is verification capability, not access.
      Removing it changes no cost and no theorem; it changes whether the disc lane
      may cite an integer as evidence rather than as intake, and it produces one
      quantity (f) that currently exists nowhere.
    baseline_embedding:
      parameter_slice: >-
        Restricted to a curve whose trace is supplied externally - which the
        mirror now does for all twenty rows - this record reduces exactly to the
        certificate form IDEA-20260829-f5bcff names in its Step 2: exhibit v and D
        with t^2 - 4p equal to v^2 D, verifiable in one multiplication. That is
        the best-known statement inside this program and this record must contain
        it as a boundary case, not merely resemble it. The instrument must
        therefore accept an externally supplied t and return the identical pair.
      reproduction_check: >-
        TWO fixtures. (i) TOY, where ground truth is constructed - curves built by
        complex multiplication with |D| in the class-number-one list
        {3, 4, 7, 8, 11, 19, 43, 67, 163} at 30 bits, where the Hilbert class
        polynomial is linear so j is a known rational constant and no
        class-polynomial machinery is needed; the instrument must return the
        CONSTRUCTED |D| exactly on every one. This is the same ladder
        IDEA-20260829-f89a3a's heuristic H1 defines, reused rather than re-minted.
        (ii) FULL SIZE, where ground truth is published - the instrument, run on
        the mirror's trace for every row whose trace the mirror gives, must
        reproduce the mirror's D column. That is a twenty-row regression fixture
        that did not exist when this record was first drafted and it is a
        materially stronger baseline check than the toy ladder alone.
    observation_collision:
      observable: >-
        The pair (D, f), or the exhaustive bound |D| greater than B.
      distinct_preimage_search: >-
        REQUIRED, AND THE COLLISIONS ARE MASSIVE AND MUST BE STATED RATHER THAN
        DISCOVERED. (1) A curve and its QUADRATIC TWIST have identical (D, f),
        since t maps to -t. Exhibitable at toy scale in one line. (2) Every curve
        in an F_p-isogeny class shares (D, f), though their endomorphism rings may
        differ by conductor - so (D, f) identifies the CM FIELD and the Frobenius
        order, NOT End(E), and a record that writes "the endomorphism ring has
        discriminant D" has overstated the observable. (3) For a fixed small |D|,
        infinitely many primes p' give the same D - and the mirror exhibits this
        directly, listing D equal to -3 for BOTH BN(2,254) and secp256k1 at
        different primes. CONSEQUENCE - the disc observable is a property of the
        ISOGENY CLASS and the field, not of the curve, and no downstream record
        may cite it as a statement about the specific coefficients.
        THE MALIGN COLLISION, PREDICTED ABSENT - two curves over the SAME p with
        DIFFERENT traces returning the same (D, f). Impossible for |t1| not equal
        to |t2| since f^2 D equals t^2 - 4p is injective in t^2; if the instrument
        ever produces one, it is reading a cached value and is void.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "what is the CM discriminant of this 204-bit
          curve", which as posed requires the group order, by the question "what
          is the square part of the integer 4p - 1", which is a bounded scan of
          small divisors with an exact perfect-square test and reads no table.
        predicted_gain: >-
          A witness where the repository currently has only a published value, in
          seconds to minutes, plus the conductor f which no source carries.
          Encoding is the identity t^2 - 4p equals f^2 D; completeness is that
          every ordinary curve has such a pair; soundness is one multiplication.
      - transform: boundary_lift
        proposed_object: >-
          The exhaustive scan read as a rigorous LOWER BOUND |D| greater than B
          when it fails, rather than as an inconclusive search.
        predicted_gain: >-
          Converts a null result from "we did not find a small discriminant" into
          "no discriminant of absolute value at most B exists", a checkable
          statement with a stated verification cost of B operations, which is
          exactly what the goal's completion criterion asks for when it says
          "checkable certificates OR an explicit reproducible bound". This also
          makes the instrument useful on the SEVENTEEN rows the mirror reports
          with |D| above 2^100, where the positive branch is unreachable and only
          a bound is available.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (D, f) fixed and vary the forgotten structure - the
          curve coefficients, the twist, the isogeny class member - to enumerate
          the fibre and publish its size.
        predicted_gain: >-
          Bounds the disc verdict to exactly what it covers and prevents a
          downstream record from reading a small |D| as a statement about the
          particular equation, which is the most likely misuse of this output.
    quantifier_order: >-
      C1 is claimed UNIFORMLY. FOR ALL primes p and FOR ALL ordinary E over F_p
      with #E equal to p, the trace is 1 and the Frobenius discriminant is
      1 - 4p; no witness depends on the curve. C2 POSITIVE is claimed PER
      INSTANCE, EXISTENTIALLY - FOR THIS modulus THERE EXIST D and f with |D| f^2
      equal to 4p - 1 and |D| at most B. C2 NEGATIVE is claimed UNIVERSALLY OVER
      A FINITE SET - FOR ALL |D| at most B congruent to 0 or 3 modulo 4, the
      exhibited failure holds; the quantifier is discharged by exhaustion and B is
      stated in the certificate. C4 is claimed UNIFORMLY over trace-one curves -
      FOR ALL k at least 1, p^k is congruent to 0 and not 1 modulo l when l equals
      p. NOT CLAIMED - anything about |D| beyond B, and nothing whatsoever about
      the conductor of End(E) as opposed to the conductor of the Frobenius order.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the stated modulus, assuming the trace is 1 as certified by the
        attached witnesses, the CM field is Q(sqrt(1 - 4p)) with fundamental
        discriminant D and Frobenius conductor f, verified by one multiplication,
        and this agrees with the D published in the in-repository SafeCurves
        mirror" - or its negation, "no such D of absolute value at most B exists,
        which contradicts the mirror". It certifies NOTHING about the ECDLP,
        NOTHING about SafeCurves' disc threshold, which lives in pages/disc.html
        and was not read here, NOTHING about the conductor of End(E), and NOTHING
        about the odd part of the group.
      nearby_object_control: >-
        A TRACE-TWO CURVE at matched size, built by the same complex-
        multiplication route with 4p' equal to 4 + |D| s^2, one integer of trace
        away from anomalous, same discriminant family, same construction
        pedigree. The instrument must return a DIFFERENT square-part
        decomposition for it, namely from 4 - 4p' rather than 1 - 4p'. This is the
        control that isolates the trace as the load-bearing input. SECOND NEARBY
        OBJECT - the SAME modulus with a deliberately wrong trace fed in by hand;
        the instrument must produce a different, and predictably square-part-free,
        answer. THIRD, AND NEW - the mirror's own M-221 row, whose published trace
        is a 34-digit NEGATIVE integer and whose |D| is above 2^100; the
        instrument must return a bound rather than a value there, exercising the
        negative branch against a published expectation.
    proof_obligations:
      - claim: >-
          #E equal to p forces t equal to 1, and t^2 - 4p equals 1 - 4p depends
          on p alone.
        responsibility: correctness
      - claim: >-
          p prime, p in its own Hasse interval, and [p]G equal to the identity
          for a non-identity G on E together force #E equal to p exactly.
        responsibility: baseline
      - claim: >-
          The scan over |D| at most B congruent to 0 or 3 modulo 4, testing
          divisibility and then an exact integer square root of the quotient, is
          complete for that range.
        responsibility: strictness
      - claim: >-
          The recovered |D| equals the 11 published in the mirror's disc table,
          and |D| times f^2 equals 4p - 1 by exact integer multiplication.
        responsibility: interface
      - claim: >-
          The count of integers below X of the form m times a square with m at
          most B is at most 2 sqrt(B) sqrt(X), giving the stated null density.
        responsibility: size
      - claim: 'The scan costs O(B) big-integer divisions and O(B) integer square roots.'
        responsibility: runtime
      - claim: >-
          For l equal to p the multiplicative order of p modulo l does not exist,
          so the embedding degree is undefined rather than large.
        responsibility: correctness
      - claim: >-
          The toy complex-multiplication ladder recovers its constructed |D| on
          every instance, and the twenty-row sweep reproduces the mirror's D
          column wherever the mirror supplies a trace.
        responsibility: baseline
      - claim: >-
          Every mirror value used is read from tables/*.tsv or pages/*.html and
          never from pages/*.txt, with the authority tier recorded per value.
        responsibility: scope
      - claim: >-
          Nothing in the output is described as a certificate of a kind defined
          in docs/claims-and-verification.md, since neither defined kind applies.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of independent random non-identity points G on the intake curve
        for which [p]G equals the identity, out of 10
      direction: higher
      minimum_effect: >-
        PREDICTED 10 out of 10, certifying #E equal to p and hence t equal to 1,
        and agreeing with the mirror's published trace of 1. A result of 0 out of
        10 means the intake tuple is NOT anomalous, which would contradict BOTH
        the intake and the mirror - a material finding about the family's
        designated positive control, and one that would also invalidate
        IDEA-20260829-f89a3a's headline artifact before it is attempted, which is
        a concrete reason to run this cheap check first.
    - metric: >-
        the smallest |D| at most 10^8 with |D| congruent to 0 or 3 modulo 4,
        |D| dividing 4p - 1, and (4p - 1)/|D| a perfect square
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 11, matching the mirror's published CM field
        discriminant of -11 for this row, with the scan finding nothing smaller.
        THE TWO OUTCOMES MEAN DIFFERENT THINGS. AGREEMENT converts a published
        integer into a witness re-verifiable in one multiplication and is a
        roughly 89-bit consistency signal that cannot arise by accident.
        DISAGREEMENT - any other value, or no hit at 10^8 - means the mirror, the
        intake modulus, or the derivation is wrong; halt, re-read pages/disc.html
        per the MIRROR-DEF-1 authority order, and report which, never widening the
        scan until something convenient appears.
    - metric: >-
        the conductor f, reported as an exact integer and as log2 f
      direction: different
      minimum_effect: >-
        PREDICTED near 2^101.5, since |D| f^2 equals 4p - 1 with 4p - 1 near
        2^206 and |D| equal to 11. THIS IS THE ONE QUANTITY IN THIS RECORD THAT
        NO SOURCE IN THE REPOSITORY CARRIES - the mirror publishes D for all
        twenty rows and f for none - so it is a genuinely new datum rather than a
        re-verification, and its small-prime factorisation within a declared
        trial-division bound is worth recording because it constrains the possible
        End(E) conductors, which this instrument does NOT determine.
    - metric: >-
        number of hits at |D| at most 10^8 over 10^4 uniformly random 204-bit
        primes, null control, identical code path
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0. Derivation stated so it is checkable - the density
        is at most 2 sqrt(B) / sqrt(X), which at B equal to 10^8 and X near
        2^206 is about 2^-88.7, so the expected count over 10^4 samples is about
