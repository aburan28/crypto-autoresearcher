  title: 'ER-McE: seed a code-decoding trapdoor from a canonical complete supersingular endomorphism ring'
  class: composition
  claim: >-
    A complete evaluable End(E) basis can be canonicalized and used as the
    deterministic seed of a McEliece-style code trapdoor, yielding an explicit
    public KeyGen/Enc/Dec interface with conditional perfect actual-message
    correctness. The candidate does not yet have a reduction from an IND-CPA
    attacker to EndRing; only the reverse attack implication is known.
  mechanism: >-
    Publish E, a salt, parameters, and a scrambled binary Goppa generator
    matrix derived from H(CanRing(End(E)),salt). Encrypt as mG_pub+e and decrypt
    by the secret Goppa decoder. This replaces isogeny evaluation/lifting with
    code bounded-distance decoding, while making the separate code assumption
    and the bare-EndRing embedding gap explicit.
  why_not_a_renamed_known_approach: >-
    The mechanism does not transport isogeny labels, reconstruct target
    frames, evaluate C-star, or recover a quotient endpoint. It is a generic
    ring-seeded trapdoor composition and may ultimately be judged vacuous as
    an EndRing construction; that is a falsifiable assumption-direction issue.
  novelty_status: unverified
  novelty_note: No primary source was read in this task; generic secret-seeded code-trapdoor compositions may be known.
