idea:
  id: IDEA-20261006-706e9c
  question_id: RQ-TORS-8c7b79
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The 3-division polynomial of y^2 = x^3 + x + 1 has degree 4 and
    not four rational roots
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + x + 1. Let p be the smallest prime with
    20 < p < 100 and p not equal to 3 such that E is nonsingular
    over F_p and the trace of Frobenius is not divisible by p. Let
    ψ_3(x) = 3 x^4 + 6 x^2 + 12 x - 1. The claim is that the leading
    coefficient 3 is nonzero modulo p, so the degree is 4, and that
    the number of roots of ψ_3 in F_p is not 4. If the degree is not
    4, or the root count is 4, the claim is false. If no such prime
    exists, the cell is unmeasured. No discrete logarithm is
    transferred, no Weil pairing is evaluated, and the generic
    exponent 1/2 is unchanged.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate of a point of
    order dividing 3. Operation set: evaluation of the 3-division
    polynomial, not a pairing. The polynomial is the standard
    ψ_3 for A = 1 and B = 1. Degree 4 is the leading-term count
    when 3 is invertible. The root count in F_p is the number of
    rational x-coordinates of nontrivial 3-torsion. Four rational
    roots would be the full set of x-coordinates of E[3]. The
    prediction is that this prime does not realize that full set.
    The projection keeps the degree and the root count and discards
    the y-coordinates.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials vanish on x-coordinates of points that
        sum to the identity. The 3-division polynomial is a different
        polynomial. The opened row does not state this root count.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic discrete logarithm needs Ω(√N) group operations.
        Counting roots of ψ_3 is not a discrete-logarithm algorithm.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share the number of points. This cell does
        not walk an isogeny.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
  assumptions:
    - A prime p in (20, 100), p not 3, exists with the curve nonsingular and ordinary. If the sweep finds none, the cell is unmeasured.
    - ψ_3 is exactly 3 x^4 + 6 x^2 + 12 x - 1. A different polynomial voids the cell.
    - A root is counted without multiplicity first, and a repeated root is recorded separately. The claim uses the number of distinct roots.
  proof_search_map:
    not_applicable_reason: >-
      One degree and one root count. Not a theorem about torsion
      modules changing an attack exponent.
  predictions:
    - metric: distinct_rational_roots_of_psi3
      direction: lower
      minimum_effect: the degree is 4 and the number of distinct roots in F_p is at most 3
  minimal_test:
    design: >-
      Sweep primes from 23 upward, skipping 3. At the first prime
      that passes, evaluate ψ_3 at every field element, or factor
      it, and count distinct roots. Repeat the count with a second
      evaluation order. Score the same polynomial shape on the null
      curve y^2 = x^3 + 2 x + 3 at the same p and record its root
      count without applying the claim to it.
    controls:
      - The two evaluation orders agree on the root count. Disagreement voids the cell.
      - The null curve's root count is reported and is not substituted for the object's count.
      - The leading coefficient is reduced modulo p and checked nonzero.
    required_metrics:
      - the prime p
      - the degree
      - the number of distinct roots in F_p
      - the null curve's distinct-root count
  falsification_conditions:
    - >-
      The prime exists, the leading coefficient is nonzero, and
      ψ_3 has 4 distinct roots in F_p.
    - The degree is not 4. The claim is false.
    - The two evaluation orders disagree. The cell is void.
  confounders:
    - A multiple root counted twice would inflate the count. Distinct roots are the metric.
    - Characteristic 3 makes the leading coefficient 0 and is excluded.
    - A Weil pairing value is a different quantity and is not a control for this count.
  interpretation_limits:
    - One curve, one prime below 100. No statement about cryptographic torsion fields.
    - Degree 4 with fewer than 4 rational roots does not move the generic exponent 1/2.
    - This is not an embedding-degree claim and not a self-pairing claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For A = 1 and B = 1, ψ_3(x) = 3 x^4 + 6 x^2 + 12 x - 1, and
        at the smallest ordinary prime in (20, 100) excluding 3 the
        number of distinct roots in F_p is at most 3. The model
        imitated is the classical division polynomial, not a random
        degree-4 polynomial's Galois group.
      rigorous_support: >-
        The shape of ψ_3 is a finite formula. KR-IC-5a43e5, opened,
        is the summation-polynomial row and is not this formula.
        The root-count bound is a prediction for one prime, not a
        theorem this session derived.
      validation_plan:
        sampling: every element of F_p, or a complete factorization, with no subsampling
        comparison: the degree against 4 and the distinct-root count against 4
        tail_check: >-
          A repeated root is recorded as one distinct root and is
          not dropped. If the sweep finds no prime, record
          unmeasured. Do not widen the prime interval after seeing
          a root.
        parameters: one curve, primes from 23 to 97, ell = 3. No transfer to ell > 3.
  target_complexity:
    time_exponent: >-
      Unchanged. Opened KR-RHO-13bf67 gives the generic exponent
      1/2. Root-counting ψ_3 does not move it.
    memory_exponent: >-
      Unchanged. One degree-4 polynomial.
    best_known: >-
      KR-RHO-13bf67, opened, Ω(√N). KR-IC-5a43e5, opened, summation
      polynomials, which are not ψ_3. KR-RHO-755e35, opened, equal
      hardness across an isogeny class, which is not walked here.
    hidden_overhead: >-
      No o(1) attack term. Evaluating a degree-4 polynomial at p
      field elements is O(p) arithmetic and is not an attack.
    tradeoff_note: >-
      Not a time-memory tradeoff. The output is a degree and a
      root count.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          The row's degree for S_3 in each variable is 2. This
          record's predicted degree for ψ_3 is 4, and the predicted
          distinct-root count is at most 3. The row does not state
          that root count.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The row's exponent is 1/2. This measurement changes that
          exponent by 0.
    searched:
      corpus_grep:
        - 3-division polynomial in October proposals on origin/main
        - order-5 Weil self-pairing, which this record does not restate
      web: []
      blocked:
        - No web fetch in this session.
  dominated_by: >-
    Checked KR-IC-5a43e5, KR-RHO-13bf67, and KR-RHO-755e35, all
    opened. KR-RHO-13bf67 dominates any reading of a root count as
    a discrete-logarithm algorithm. KR-IC-5a43e5 dominates any
