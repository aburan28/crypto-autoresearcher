  sota_delta: >-
    Predicted degree 4 and distinct-root count at most 3, against a
    full-rational count of 4, one prime below 100. Exponent gap
    versus opened KR-RHO-13bf67: 0. Degree gap versus the S_3
    per-variable degree 2 in opened KR-IC-5a43e5: these are
    different polynomials, and no attack exponent moves.
