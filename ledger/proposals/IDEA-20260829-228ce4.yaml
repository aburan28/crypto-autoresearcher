idea:
  id: IDEA-20260829-228ce4
  question_id: RQ-QALG-122b59
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE WHOLE LANE HAS PRICED KEY RECOVERY AND NOBODY HAS PRICED THE CIPHERTEXT
    -- HQC message recovery is a rate-1/3 syndrome-decoding instance whose
    quantum Prange cost is 2^{65.8} at HQC-128, within 0.5 bits of key recovery;
    and unlike key recovery its MARKED SET is not a singleton, because the
    attacker needs only the MESSAGE: he may add any auxiliary codeword and may
    declare up to 30 of the 46 Reed-Solomon symbols ERASED, giving a
    one-parameter family of cheaper-looking instances whose optimum is a
    computable integer
  class: mechanism

  claim: >-
    Every proposal filed against this RQ prices the KEY-RECOVERY instance
    (2-QCSD, length 2n, weight 2w). HQC's ciphertext-side instance has never
    been priced in this corpus at all, and it is a genuinely different object:
    eliminating the message with the auxiliary code's parity check turns
    (u, v) into a syndrome-decoding instance of length 3n and dimension n + k,
    i.e. RATE ABOUT 1/3 rather than 1/2, with error weight
    W = 2 w_r + w_e = 225 at HQC-128 rather than 132. Its quantum Prange cost is
    2^{(W/2) log2(3/2)} = 2^{65.8}, against key recovery's 2^{66} -- the two are
    tied to within 0.5 bits at HQC-128 and, on the same computation, 2^{100.1}
    against 2^{100} at HQC-192 and 2^{130.8} against 2^{131} at HQC-256. That
    triple of near-ties is a reusable number no record in this corpus holds and
    it is worth having on its own.
    THE MECHANISM IS WHAT MAKES THE CIPHERTEXT SIDE STRUCTURALLY DIFFERENT.
    Amplitude amplification's cost is the inverse square root of the MARKED
    FRACTION, and for key recovery the marked set is a singleton -- there is one
    secret. For message recovery it need not be: the attacker succeeds if he
    recovers m, not (r1, r2, e), so every triple that decodes to the same
    message is marked. Two enlargements exist and both are exactly computable.
    (E1) COSET ENLARGEMENT: any e' in e + C, where C is the concatenated
    Reed-Muller/Reed-Solomon auxiliary code, yields the same message; the gain
    is gamma = log2 of the number of such e' within the weight budget, and the
    prediction is gamma = 0 EXACTLY, because C's minimum distance is at least
    d_RS * d_RM = 31 * 192 = 5952 at HQC-128 while the budget is 75, so no other
    coset element is anywhere near low weight. (E2) ERASURE ENLARGEMENT, which
    is the live one: the external Reed-Solomon code RS-S1 = [46, 16, 31] can be
    decoded from ERASURES ALONE in up to d - 1 = 30 positions, so the attacker
    needs only 16 of the 46 inner blocks and may declare the other 30 erased --
    which in syndrome-decoding terms means PUNCTURING the instance on j inner
    blocks, dropping both their parity constraints and their error coordinates.
    That is a one-parameter family of instances, indexed by j in {0,...,30},
    that no ISD accounting for HQC in this corpus considers, and the claim is
    that its optimum j* is a computable integer and that the message-recovery
    exponent is min over j of cost(j), not cost(0).
    THE PREDICTION, STATED SO IT CAN FAIL: j* = 0 and cost(j) is strictly
    increasing, because puncturing j blocks sheds j * n2 = 384 j parity
    constraints while shedding only about w_e * 384 j / n = 1.6 j expected error
    coordinates -- constraints leave 240 times faster than errors. If that is
    right the deliverable is a closure with a named obstruction and a design
    number; if it is wrong at any parameter set, the quantum message-recovery
    exponent moves by cost(0) - cost(j*) bits and HQC's ciphertext side is the
    weaker of its two instances by a computable amount.
  mechanism: >-
    THE INSTANCE. HQC encryption produces u = r1 + h r2 and v = m G + s r2 + e
    with wt(r1) = wt(r2) = w_r and wt(e) = w_e, where G generates the
    concatenated auxiliary code C of length n1 n2 (shortened Reed-Solomon over
    F_256 concatenated with a duplicated first-order Reed-Muller code) and
    dimension k. Applying C's parity check H_C to v kills m G, giving
    H_C v = H_C (s r2 + e). Together with u = r1 + h r2 the attacker holds
    n + (n - k) = 2n - k linear constraints on the unknown triple
    (r1, r2, e) in F_2^{3n} of total weight W = 2 w_r + w_e. That is syndrome
    decoding of a length-3n code of dimension n + k, i.e. rate about 1/3.
    THE BASELINE COST. Prange succeeds when a random information set of size
    n + k avoids all W error positions, with probability about
    ((2n - k)/(3n))^{W} = (2/3)^{W}(1 + o(1)); amplitude amplification therefore
    costs 2^{(W/2) log2(3/2)}. At HQC-128 (n = 17669, k = 128,
    w_r = w_e = 75, W = 225) that is 2^{65.8}. THE ARITHMETIC IS ELEMENTARY AND
    IS EXACTLY WHY THE ABSENCE OF THIS NUMBER FROM THE CORPUS IS WORTH FIXING:
    every other record in this lane quotes 2^{66} for HQC-128 without saying
    which of the two instances it belongs to.
    ENLARGEMENT E1 AND WHY IT IS ZERO. Fixing r2 determines r1 = u - h r2 and
    then v - s r2 = m G + e, so the message follows from ANY e' with
    v - s r2 - e' in C, i.e. any e' in the coset e + C. That coset has 2^{k}
    elements, but ISD needs a LOW-WEIGHT one: for c nonzero in C,
    wt(e + c) >= d_min(C) - w_e >= 5952 - 75 = 5877 at HQC-128, by the standard
    concatenation bound d_min(C) >= d_RS * d_RM, which is a LOWER bound and
    therefore the rigorous direction for this argument. So enlarging the weight
    budget to capture a second coset element requires raising it by a factor
    about 78, which multiplies the Prange exponent far faster than it multiplies
    the marked set. gamma = 0, and the computation that establishes it is three
    lines. Recorded because a zero that is COMPUTED is a design margin, while a
    zero that is assumed is a gap.
    ENLARGEMENT E2 AND WHY IT IS THE LIVE ONE. The external code is
    RS-S1 = [46, 16, 31] over F_256 (RS-S2 = [56, 24, 33], RS-S3 = [90, 32, 59
    or 49 -- the specification's printed value is internally inconsistent and the
    corpus record documents three independent derivations giving 59). A code of
    minimum distance d corrects d - 1 ERASURES, so the attacker needs only k_RS
    of the n1 symbols: 16 of 46 at HQC-128. Declaring j blocks erased is exactly
    PUNCTURING the syndrome-decoding instance on those j n2 coordinates of the
    v-side: their error coordinates vanish from W and their parity constraints
    vanish from the redundancy. The punctured instance has length 3n - j n2,
    redundancy n + (n1 - j) n2 - k_punc where k_punc is the dimension of the
    punctured auxiliary code, and expected weight W(j) = 2 w_r + w_e (1 - j n2 / n).
    The cost is the Prange exponent of that instance and j* = argmin over
    j in {0,...,d_RS - 1}.
    WHY THE PREDICTION IS THAT IT LOSES, AND WHY IT IS STILL WORTH COMPUTING.
    Each erased block removes 384 coordinates from the codeword side, of which
    only about w_e n2 / n = 1.63 are expected to carry errors, so the
    information-set fraction moves the wrong way. But the counting is not
    obvious: the punctured Reed-Solomon code's dimension does not drop with j
    until j exceeds n1 - k_RS, so the redundancy sheds n2 per block while the
    length sheds n2 per block and the weight sheds only 1.63 -- the rate RISES
    toward 1/2 and the relative weight FALLS, and which effect wins is exactly
    what the one-dimensional optimization decides. A cost curve that is
    non-monotone, or that dips at moderate j, is a real possibility that costs
    an hour to exclude and that nothing in the literature this corpus holds
    excludes for us.
    ENLARGEMENT E3, RECORDED AND PREDICTED DEAD. A third relaxation suggests
    itself and must be closed rather than left implicit: since the attacker
    needs only 16 blocks, could he GUESS each block's Reed-Muller codeword
    directly from v restricted to that block, there being only 2^{8} = 256
    candidates? No, and the reason is quantitative: the per-block noise is
    (s r2 + e) restricted to the block, and s has weight about n/2, so every
    coordinate of s r2 has bias essentially zero and the per-block channel
    capacity is about 0, giving no information about which of the 256 codewords
    is correct. The measured per-coordinate bias of s r2 is the quantity that
    closes E3 and it is cheap to measure.
