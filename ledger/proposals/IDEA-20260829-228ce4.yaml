      - >-
        RQ-HQC-001 / GOAL-HQC-001 own HQC's decoding-failure-rate model and a
        memory-charged CLASSICAL ISD baseline. THIS RECORD USES NO DFR
        QUANTITY. The only property of the auxiliary code it uses is MINIMUM
        DISTANCE and the elementary fact that a code of minimum distance d
        corrects d - 1 erasures -- combinatorial facts about the code, not
        statements about the analytic DFR model, and true whether or not that
        model is correct. No GOAL-HQC-001 measurement is cited as load-bearing,
        and nothing found here bears on the DFR model in either direction.
      - >-
        IDEA-20260818-45b8ea enlarges the marked set's AMPLITUDE via a
        non-uniform prior on supports. This record enlarges the marked set's
        CARDINALITY via the target relation. The two are different factors of
        the same success probability and compose; neither implies the other.
      - >-
        IDEA-20260813-a46301 (quantum-DOOM) multiplies targets using the CYCLIC
        SHIFT ORBIT, which applies to both instances equally and is orthogonal
        to the auxiliary-code structure used here. Its correlated-branch caveat
        does not apply to E1/E2, whose enlargements are exact and deterministic
        rather than statistical.
      - >-
        IDEA-20260818-d5668d bounds the dual family on the key-recovery
        instance at rate 1/2. The ciphertext instance is rate about 1/3, which
        is closer to the published RLPN advantage window R < 0.3 -- a fact this
