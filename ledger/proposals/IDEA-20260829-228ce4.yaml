        recomputing d5668d's bound at rate 1/3 is that record's business and its
        secret-window mechanism would have to be re-derived for the three-block
        error structure.
      - >-
        IDEA-20260818-e0ce51's MAXDEPTH accounting applies to this record's
        exponents exactly as to every other in the lane, and this record's
        numbers are iteration counts, not costs, which is disclosed here as it
        is there.
    web_screen: >-
      NOT PERFORMED for this record. The ciphertext-side ISD accounting for HQC
      is certainly published -- HQC's own specification section 6.3 covers known
      attacks including ISD and DOOM, per KN-LIT-b9e1a8 -- so the BASELINE half
      of this record is expected to be 'known' and is filed as a corpus gap
      rather than a discovery. What is not known to this session is whether the
      ERASURE-BUDGET degree of freedom has been used in any published ISD
      accounting, and no search was run for it. novelty_status is unverified and
      the honest expectation is 'known' for the baseline number and
      'unverified, possibly adaptation' for the erasure family.
    verdict: >-
      unverified. Expected classification: the 2^{65.8} figure is likely
      recomputable from published HQC security analyses and should be treated as
      a corpus gap being filled, not as a finding; the erasure-indexed instance
      family and the computed gamma = 0 margin were not found in this corpus and
