idea:
  id: IDEA-20260807-d53a93
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-07'
  title: >-
    The coverage ratio rho = 12M/p and the rho-stability test: a subsampling
    instrument that classifies every toy statistic in the Q2/Q3 slices as
    rho-stable (extrapolable) or rho-unstable (not), with a measurement
    behind each row, before any of those statistics is cited at scale
  class: empirical

  claim: >-
    Every toy experiment on the search side of this campaign (C2-5's filter
    survival, C2-10's four randomness statistics, C2-12's predictor test,
    Q2-5, Q2-10) builds L(E,X,B) exhaustively at log2 p <= 40 and measures a
    collision-flavoured statistic on it. Collision statistics are functions
    of the coverage ratio rho = M/(p/12), and rho is not a free knob: with
    X = B^{1/2}(p/2)^{1/6} and M ~ Psi(X,B)*X, rho ~ B*p^{-2/3+o(1)}. At
    crypto scale rho = 2^{-159.14}; at reachable toy scales rho ranges from
    2^{-5.4} (p = 2^20, B = 30) to 2^{-18.0} (p = 2^40, B = 100) -- a gap of
    141-154 octaves that no reachable p closes. Expected ordinary collisions
    in the table are M^2/(2*p/12), which is ~2^{4.6} ~= 24 at p = 2^20 and
    2^{-66.9} at NIST-I: the toy object solves OneEnd by accident dozens of
    times per build, and the cryptographic object never does. THE CLAIM IS A
    CLASSIFICATION, NOT A SINGLE VERDICT: a subsampling instrument built once
    on the shared toy table can determine, per statistic and with a
    measurement behind each row, which of the campaign's toy statistics are
    rho-stable (their value is invariant under rho, hence extrapolable in
    this respect) and which are rho-unstable (their value is an artefact of
    the toy regime's saturated collision density and must not be
    extrapolated). Predicted rho-unstable: C2-10's collision profile,
    C2-10's locus-occupancy, C2-5's survival probability whenever fR ~= 1.
    Predicted rho-stable: neighbour auto-correlation, sigma-orbit
    distribution, Q2-10's alignment exponent e, Q2-5's rho_LSH. NO CLAIM IS
    MADE ABOUT WHICH WAY ANY GIVEN STATISTIC WILL FALL: a rho-unstable
    verdict is exactly as informative a deliverable as a rho-stable one, and
    the entry's own expected outcome (recorded honestly) is that at least
    two statistics close as non-extrapolable.

  mechanism: >-
    Build the toy table once at each of three field sizes. For
    rho' in {rho, rho/4, rho/16, ..., rho/2^10}, compute each named statistic
    on a uniform random SUBSAMPLE of the table's entries of the corresponding
    size, with 200 bootstrap resamples per level, and fit the statistic's
    dependence on log(rho'). A statistic whose fitted slope is
    indistinguishable from 0 (within 2 sigma) across all three field sizes is
    declared rho-stable FOR THE TESTED RANGE ONLY; any other statistic is
    declared non-extrapolable and every downstream use in this corpus must
    carry that label from this point forward. CHARGED, NOT FREE: a subsample
    is not the same object as a smaller table L(E,X',B) at smaller X' -- it
    has the same degree profile with fewer entries -- so both the subsample
    and a freshly built smaller-X' table must be run and their difference
    reported, or the instrument confounds "fewer entries" with "smaller
    radius". This entry is a META-TEST on C2-10 (and on C2-5, C2-12, Q2-5,
    Q2-10), not a competitor to any of them, and per the catalogue's own
    sequencing note it must run INSIDE the same batch as those toy builds so
    the table is built once and shared.

  novelty_status: unverified

  sequencing_dependency: >-
    BINDING PRECONDITION, STATED EXPLICITLY PER THE COORDINATOR'S DISPATCH
    INSTRUCTION: per ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/INDEX.md
    section 2b row 29 and section "hard sequencing constraints" ("SEQUENCE
    Q2-8 before every SSQI toy statistic"), this entry's rho-stability
    classification is a PRECONDITION for trusting every other not-yet-
    designed toy measurement in the Q2/Q3 catalogue slices (named there:
    Q2-5, Q2-9, Q2-10, Q3-8, and by extension C2-5, C2-10, C2-12). Those
    entries are NOT YET DESIGNED as of this batch and are not authorized by
    anything in this record; this record only formalizes Q2-8 itself and
    records the dependency so a future designer of any sibling toy entry
    finds it. No sibling entry's toy value may be cited at any scale beyond
    "toy, not yet gated by rho-stability" until this hypothesis's H-A2 half
    (or a successor) has produced the classification.

  interpretation_limits:
    - >-
      TOY CEILING, DELIBERATE: this entry's product is a bound on what OTHER
      toy entries may claim, which the catalogue source states is "the
      strongest form a toy result takes" for an instrument of this kind. No
      claim is made about crypto-scale behaviour of any statistic; the
      instrument only tests whether a toy-scale measurement transfers within
      the toy regime's own subsampled range.
    - >-
      A rho-unstable verdict is not a failure of the campaign and must not be
      reported with more or less emphasis than a rho-stable one -- both are
      the deliverable (AGENTS.md rule 6, scoped negatives are informative).
    - >-
      The subsampling instrument establishes extrapolability WITHIN THE
      TESTED rho RANGE ONLY (rho down to rho/2^10 at three field sizes). It
      says nothing about the 141-154 octave gap between the reachable toy
      range and the cryptographic rho, and no record may claim it closes
      that gap.
    - >-
      No exponent claim and no break claim is made or implied anywhere in
      this record. This is a validity-control instrument for existing and
      future toy measurements, not a lever on F1-F4 of the goal's exponent
      budget.

