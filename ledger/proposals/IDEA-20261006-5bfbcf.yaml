      claim: A generic algorithm on a prime-order group of size N needs Omega(sqrt(N)) group operations.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        A universal no-go for every algebraic factor base over a prime field
        is open. Bounded-degree explicit predicates are the scoped negative,
        and this base is one of those predicates.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-020.md
    - ref: Hasse bound
      provenance: recalled
      claim: >-
        The absolute value of #E(F_p) minus (p+1) is at most 2 sqrt(p). For
        p = 61 this lower-bounds the point count enough that four distinct
        x-coordinates exist, but this recollection is not support for the
        sumset claim.
  assumptions:
    - Discriminant check: 4*(1)^3 + 27*(4)^2 = 436, and 436 mod 61 = 9, so E is nonsingular.
    - The four smallest x-coordinates each have a point. If fewer than four affine x-coordinates exist, the cell is unmeasured.
    - C(N, 4) > 20 so the index rule can return 20 subsets distinct from F. If not, the cell is unmeasured.
    - The base is the scoped-out degree-1 predicate of KN-OPEN-020. No escape is claimed.
  predictions:
    - metric: sumset_image_gap
      direction: higher
      minimum_effect: I(F) >= M + 8
  minimal_test:
    design: >-
      Enumerate E(F_61). Build F by the four smallest x rule. Compute all
      64 ordered sums and the size of the image. Draw 20 comparison 4-subsets
      by the seeded combination-index rule, compute their image sizes, and
      take the 10th order statistic.
    controls:
      - Twenty size-matched random 4-subsets on the same curve and the same group law. They are the null of equal cardinality.
      - The full set of affine points as a saturation control: its 3-fold image size is at most the rational-point count, and I(F) cannot exceed that number.
      - One repeated-point base of a single affine point repeated four times, whose image has size at most 7. This checks that the summer is not counting 64 labels as 64 sums.
    required_metrics:
      - I(F)
      - the 20 image sizes and their lower median M
      - I(F) - M
      - rational-point count of E over F_61 and the order of the largest prime-order subgroup
  falsification_conditions:
    - I(F) <= M + 7. The small-x base then has no yield gain of 8 or more over a random base of the same size, which is the negative outcome.
    - If the random-base images themselves miss the occupancy prediction of HA-1 by more than a factor of 2, the gap is not interpretable as small-x structure.
  confounders:
    - An x-interval in the field is not an arithmetic progression in E(F_61). A small image can be a field accident rather than a group-law accident.
    - If the rational-point count is composite, torsion can inflate or shrink images. The prime-order subgroup restriction is a required metric, not the scored population.
    - Global negation identifies P and -P only through the y-in-{0,...,30} rule. Dropping that rule double-counts points.
  interpretation_limits:
    - L = 4 and one prime. A gap of 8 changes the relation count by at most 64, a constant. It does not move the prime-field exponent, which KR-IC-5931ee already places at or above the generic square root under its assumptions.
    - The population is all of E(F_61), not a prime-order subgroup. A gap that disappears on the largest prime-order subgroup is not a yield gain for the discrete log in that subgroup.
    - This factor base stays inside the bounded-degree scope of KN-OPEN-020.
    - Evidence from this cell is toy-scale.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a uniform random 4-subset S of an abelian group of order N, the
        64 ordered sums P+Q+R behave like 64 independent uniform group
        elements, so the expected image size is N * (1 - (1 - 1/N)^64), and
        a size-matched small-x base is claimed to exceed the lower median of
        that image by at least 8.
      rigorous_support: >-
        There are exactly 64 ordered triples from a 4-element set. If those
        sums were independent and uniform, the image size would follow the
        classical occupancy law N * (1 - (1 - 1/N)^64). The proved part is
        that identity for independent uniform draws. The imitation is that
        elliptic sums of a random 4-subset are close to those draws, and that
        the small-x subset is not. Independence of the 64 sums is false for
        every S, because the triples overlap, so the occupancy law is only
        the comparison distribution.
      validation_plan: >-
        On this single curve, p = 61, L = 4, 64 triples, compare the mean of
        the 20 random image sizes to N * (1 - (1 - 1/N)^64), where N is the
        counted rational-point count, not assumed. Accept HA-1 for the null
        arm if that mean lies within a factor of 2 of the occupancy number.
        Tail check: no random subset has image size less than half the
        occupancy number. If the null arm fails the factor-of-2 check, do not
        read I(F) - M as structure. Transfer assumption: the occupancy law is
        for the full group of rational points, not for a hidden subgroup.
  target_complexity:
    time_exponent: >-
      Unchanged. Prime-field naive decomposition stays at least the generic
      cost p^{1/2} under the assumptions of KR-IC-5931ee. A gap of 8 at L = 4
      is a constant in the relation count.
    memory_exponent: >-
      O(1) at L = 4, since 64 sums are stored. Asymptotically a small-x base
      large enough to matter has memory at least the base size, still inside
      the generic rho memory of distinguished points, which is p^{o(1)} when
      the distinguished-point density is p^{-o(1)}.
    best_known: >-
      Pollard rho, Theta(sqrt(N)) group operations in the generic group model
      (KR-RHO-13bf67), about sqrt(pi N / 2) iterations with distinguished
      points (KR-RHO-6239aa).
    hidden_overhead: >-
      No o(1) improvement is claimed. The toy hides only the field-multiplication
      constant inside one addition.
    tradeoff_note: >-
      A larger image is a constant-factor yield gain at fixed L. It does not
      open a van Oorschot-Wiener improvement. If the image is smaller than
      the median, the yield move is in the attack-worsening direction and the
      claim is false.
