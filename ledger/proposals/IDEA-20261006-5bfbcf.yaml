    Generic Pollard rho at Theta(sqrt(N)) group operations (KR-RHO-13bf67),
    and the naive prime-field Semaev lower bound of KR-IC-5931ee under its
    stated assumptions. Time, memory, and data were compared: time stays
    p^{1/2}, memory at this cell is 64 sums, and the data are one curve and
    20 subsets. An image gap of 8 does not beat rho.
