idea:
  id: IDEA-20261006-5bfbcf
  question_id: RQ-RELN-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: Ordered 3-fold sumset of a 4-point small-x factor base versus size-matched random bases on one prime-field curve
  class: measurement
  claim: >-
    Representation R1, attack stage relation yield. On E: y^2 = x^3 + x + 4
    over F_61, let F be the four affine points whose x-coordinates are the
    four smallest integer representatives in {0, 1, ..., 60} that occur, each
    with the unique y in {0, 1, ..., 30}. Let I(S) be the number of distinct
    sums P+Q+R in E(F_61), repetitions allowed and order significant, with
    the point at infinity counted as one element if it occurs. Let M be the
    lower median, the 10th of 20 sorted values, of I(S) over 20 distinct
    4-point subsets drawn as combination indices (20261006 * (k+1)) mod
    C(N, 4) for k = 0, 1, ... in colex order of the affine points sorted by
    (x, y), skipping F. The claim is I(F) >= M + 8. The negative outcome is
    I(F) <= M + 7. No subexponential prime-field index calculus is claimed.
  mechanism: >-
    OBJECT FRAME. Representation R1: the integer representative of the
    x-coordinate, with membership the degree-1 predicate "among the four
    smallest x-coordinates". Operation set Sigma: addition of three points
    of the factor base, the relation step of index calculus. Sigma is not
    the full translation action. Trichotomy: partial-action. A sum is
    determined by the triple only when each summand lies in the base, which
    is Class I index calculus. LOSSY-PROJECTION TEST. I(S) discards which
    ordered triple produced each sum. The discard is compatible with Sigma
    because Sigma's output is the sum. Distinct triples can share a sum, so
    the projection is lossy. The identity map on triples would not be lossy
    and is not the object. The open number is I(F) - M, predicted >= 8.
    Canonicalising a sum to the affine point with y in {0, ..., 30}, or to
    infinity, costs one negation. KN-OPEN-020: this predicate is explicit
    and bounded-degree, degree 1, inside the scoped-out class. The record
    stops at the image-size gap and does not claim an escape. Families
    F1-F7 are not the lens.
  novelty_status: speculative
  citations:
