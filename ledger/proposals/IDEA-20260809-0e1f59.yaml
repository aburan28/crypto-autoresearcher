idea:
  id: IDEA-20260809-0e1f59
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    The S-range check is the only divergence reachable by an adversary who
    controls the signature bytes alone, which makes it the highest-severity row
    of the matrix
  class: measurement
  claim: >-
    Among all enumerated divergence classes, the S-range check (S < L versus a
    weaker bound) is the unique one an adversary can exercise while controlling
    NEITHER the key NOR the message — only the signature bytes in transit. That
    control class is strictly weaker than any other in the matrix, and the claim
    is that it is realized: given any valid signature, a modified signature can
    be produced that verifies under a weak-range reading and fails under a
    strict one, with no secret material.
  mechanism: >-
    Replace S by S + L when the sum stays below the weak bound. The verification
    equation is evaluated with scalars reduced modulo the group order in a
    correct implementation, so the modified value is equivalent as a scalar;
    only the explicit range predicate separates the readings.
  why_not_a_renamed_known_approach: >-
    The mechanism is elementary and known. What this record contributes is the
    ORDERING claim: that this row dominates every other row of the divergence
    matrix on adversary control, which is a statement about the whole enumerated
    space and can only be made once the space of IDEA-20260809-022eb5 exists.
  predictions:
  - observable: fraction of honest signatures for which S + L stays below the weak bound
    metric: fraction in [0,1], measured over many honest signatures
    predicted: >-
      Close to the fraction determined by the ratio of the group order to the
      weak bound, and computable exactly in advance. A measured fraction far
      from the computed one indicates an implementation error.
  - observable: whether any other divergence class is reachable with signature-only control
    metric: boolean, over the full enumerated space
    predicted: No. If another class is reachable with signature-only control, the ordering claim is false and the matrix's severity ranking changes.
  minimal_test: >-
    Over a sample of honest signatures with declared seed, apply the shift where
    it stays in range, evaluate under strict and weak readings, emit certificates,
    and separately search the full enumerated space for any other class reachable
    without key or message control.
  controls:
  - 'EQUIVALENCE CONTROL: the shifted scalar must be congruent to the original modulo the group order; verify symbolically, not only by acceptance.'
  - 'OUT-OF-RANGE CONTROL: shifting past the weak bound must be rejected by both readings.'
  falsification_conditions:
  - The shift is rejected by all admissible readings, which would mean no implementation admits the weak bound and the row is empty.
  - Another divergence class proves reachable with signature-only control, falsifying the ordering claim.
  interpretation_limits: >-
    Producing a differently encoded signature for an already-signed message is
    not forgery. Where systems keyed on signature bytes are described, they are
    described generically and no deployment is named.
  sota_delta: 'No attack. Delta: an ordering over the divergence matrix by adversary control, with the top row witnessed.'
  dominated_by: Not dominated by any corpus record; depends on IDEA-20260809-022eb5 for the space over which the ordering claim quantifies.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no EdDSA records. WEB NOT CHECKED.'
  source_refs:
  - RFC 8032 -- REQUIRED READ, NOT YET READ.
