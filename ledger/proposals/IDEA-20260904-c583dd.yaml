  assumptions:
    - >-
      N = #<P> prime, N ~ p, cofactor O(1); m fixed unless the m! term is
      explicitly carried.
    - >-
      Relations needed = B = N^{beta}; sparse linear algebra time N^{2 beta},
      memory N^{beta}.
    - >-
      Targets are uniform in <P>, so the target count is max(1, 1/P_dec) with
      P_dec the KN-FIND-007 mean.
    - >-
      Memory above N^{1/2} is not admissible for a claim against rho, because
      BSGS already achieves N^{1/2} time at N^{1/2} memory; memory near N is
      degenerate because a full table trivializes the problem.

  proof_search_map:
    bottleneck: >-
      The admission gate itself -- the inequality every proposed decomposition
      solver in this lane is scored against. If the gate is wrong, every score
      in the lane is wrong, and the error is in an exponent.
    baseline_embedding:
      parameter_slice: >-
        sigma = 1 (exhaustive solve) in the SPARSE regime must reproduce the
        known statement that prime-field index calculus costs m! N for every m
        and every B, i.e. worse than BSGS. That is 812554's own baseline and the
        corrected model must contain it unchanged.
      reproduction_check: >-
        Symbolic: substitute sigma = 1, beta < 1/m into the clamped model and
        verify the B-dependence cancels identically, as a frozen regression
        fixture; plus a numeric check that clamped and unclamped models agree to
        machine precision for every beta < 1/m.
    observation_collision:
      observable: >-
        The pair (time exponent, memory exponent) of a family member.
      distinct_preimage_search: >-
        Two distinct (beta, m, solver) triples with the same (time, memory)
        pair, one inside and one outside the frontier, would show the pair does
        not identify admissibility and that a third axis (queries,
        preprocessing, parallel depth) is needed. Deliberately searched over the
        grid; if none is found, the two-axis frontier is the right object.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure: the (time, memory) Pareto
          frontier of the whole decomposition family, with each solver
          contributing a curve and each constraint (yield clamp, linear algebra,
          memory cap) a half-plane.
        predicted_gain: >-
          Converts a set of inequalities into one frontier picture, and locates
          the corrected gate (m-2)/(2(m-1)) and the MITM point
          (N^{1/2+1/m}, N^{1/2}) on it.
      - transform: boundary_lift
        proposed_object: >-
          Replace the unclamped reciprocal probability by max(1, 1/P_dec)
          throughout the lane.
        predicted_gain: >-
          A strictly inward correction of the admissible region wherever
          beta > 1/m; no loosening anywhere, so it cannot manufacture a win.
    quantifier_order: >-
      FOR ALL m >= 2, FOR ALL beta in (0, 1/2), FOR ALL solver exponents sigma,
      the corrected total is
      max( N^{beta} * max(1, m!N/B^m) * B^{(m-1)sigma}, m N^{2 beta} ) with
      memory max(N^{beta}, memory of the solver). THERE EXIST (m, beta, sigma)
      with total below N^{1/2} and memory below N^{1/2} IF AND ONLY IF the
      corrected gate is met. The MITM sub-claim is: FOR ALL m and FOR ALL beta,
      the MITM instance has time at least N^{1/2 + 1/m}, with equality at
      beta = 1/m.
    method_ceiling:
      strongest_certifiable_claim: >-
        A corrected cost model and a frontier picture, both derivations inside a
        stated cost model. It cannot certify a lower bound on any algorithm; it
        certifies only what THIS model says, and a different model (different
        linear-algebra cost, different relation requirement, large-prime
        variations) moves the frontier.
      nearby_object_control: >-
        Extension fields F_{q^n} under Weil descent, where index calculus DOES
        beat rho. The corrected model must still admit that regime; a correction
        that closes F_{q^n} is over-tight and is void. Second control: the
        large-prime variation, where a "relation" is redefined and the yield
        clamp moves -- named here as the boundary of this record's scope and as
        the most likely place the frontier is not the last word.
    proof_obligations:
      - claim: >-
          the clamped model reproduces the sigma = 1 cancellation and the
          sparse-regime gate exactly
        responsibility: baseline
      - claim: >-
          the saturated-regime gate is sigma < (m-2)/(2(m-1)) at beta = 1/m
        responsibility: correctness
      - claim: >-
          the MITM optimum is beta = 1/m with time N^{1/2+1/m} and memory
          N^{1/2}
        responsibility: runtime
      - claim: >-
          solver memory is charged for MITM (B^{m/2}) and for lattices
          (dimension)
        responsibility: memory
      - claim: >-
          letting m grow reintroduces m! and the limit is the BSGS point, not
          inside it
        responsibility: strictness
      - claim: >-
          the extension-field control still admits index calculus
        responsibility: scope
    not_applicable_reason: null

  object_first:
    tracked_object: >-
      The COST TRIPLE of a family member: (relations needed, targets per
      relation, solve cost), together with the memory each term demands.
    lossy_projection_test: >-
      Lossy: the triple discards the curve, the factor base geometry, the
      polynomial system and the solver's internals, retaining only three
      exponents and a memory tag; the entire 551,304-member isogeny class, every
      window, every GAP and every digit presentation of a given size collapse to
      the same triple, which is exactly KN-FIND-007's content (yield is
      conserved across base geometries, so the triple cannot see geometry).
      Compatible: the operations performed on it -- multiplying stages,
      maximizing over the linear-algebra term, imposing budget half-planes --
      are defined on exponents alone and propagate deterministically, PROVIDED
      the clamp is applied, which is precisely the compatibility failure this
      record identifies: an unclamped reciprocal probability lets the projection
      leave the region where it is a faithful abstraction of counting targets.
      So the audit is not an accounting nicety; it is the statement that the
      tracked object was being propagated through an operation it does not
      survive. Honest scoring: (1) not a new object -- it is the lane's own
      object, with one operation corrected; (2) concretely testable, since both
      regimes can be checked by exhaustive counting at toy p; (3) it survives
      the whole cost derivation once clamped, and dissolves only when "relation"
      is redefined, as under a large-prime variation.
    survival: >-
      Survives every stage of the standard index-calculus accounting; dissolves
      at redefinitions of the relation (large primes, batching), which is named
      as the open successor.

  predictions:
    - metric: >-
        Boolean: does the region {beta > 1/m} intersect the jointly admissible
        region {beta < 1/4, beta(m-1)(1-sigma) > 1/2, sigma >= 0} for some
        m <= 32
      direction: different
      minimum_effect: >-
        This record derives YES, first at m = 5, with an explicit witness at
        m = 8, beta = 0.2, sigma = 0 (0.2 * 7 = 1.4 > 0.5). A NO would mean the
        clamp never binds and 812554's gate stands as written, which is E2 and
        is a certification.
    - metric: >-
        Saturated-regime admission gate at beta = 1/m
      direction: lower
      minimum_effect: >-
        (m-2)/(2(m-1)) against the recorded (m-3)/(m-1); at m = 8 that is 0.4286
        against 0.7143, a difference of 0.286 in sigma, which is
        beta(m-1)*0.286 = 0.4 in the time exponent -- an exponent-level
        correction, not a constant.
    - metric: >-
        Minimum time exponent of the MITM decomposition over all beta, at fixed
        m
      direction: different
      minimum_effect: >-
        Exactly 1/2 + 1/m, attained at beta = 1/m, with memory exactly N^{1/2}.
        Any other optimum falsifies the derivation.
    - metric: >-
        Exhaustive toy check of the target count against max(1, m!N/B^m)
      direction: different
      minimum_effect: >-
        Empirical mean targets consumed per relation must equal max(1, 1/P_dec)
        within 5 percent at p in {2^12, 2^16}, m in {3, 4}, and B on both sides
        of the clamp boundary. A systematic excess would signal correlated
        solver failure and would be a separate, reportable obstruction.
    - metric: >-
        Extension-field control -- does the corrected model still admit index
        calculus over F_{q^n}
      direction: different
      minimum_effect: >-
        Must remain admissible. If not, the correction is over-tight and the
        record is void.

  minimal_test:
    design: >-
      Symbolic plus a small toy count; no solver is implemented. STAGE 0 (hard
      gate): re-read IDEA-20260808-812554 in full -- this record's screen used
      targeted grep -- and confirm the unclamped P_dec^{-1} is load-bearing
      rather than clamped elsewhere in the record. If it is already clamped,
      the record is withdrawn and that is reported. STAGE 1: implement the
      clamped model as a small module with the two regimes, reproduce the
      sigma = 1 cancellation and the sparse-regime gate as frozen fixtures, and
      emit the corrected admissible region over a grid in
      (m <= 32, beta, sigma). STAGE 2: add the memory column (solver memory for
      MITM and for lattices) and emit the (time, memory) Pareto frontier of the
      family, marking rho, BSGS, the MITM point and the windowed small-root
      point on it. STAGE 3 (toy, hours): exhaustive decomposition counting at
      p in {2^12, 2^16}, m in {3, 4}, B on both sides of B^m = m!N, measuring
      targets consumed per relation against max(1, 1/P_dec). STAGE 4: the
      extension-field control.
    controls:
      - >-
        Baseline reproduction: sigma = 1 must still give total m! N with the
        B-dependence cancelling.
      - >-
        No-loosening control: the corrected admissible region must be a SUBSET
        of the recorded one everywhere; a point admitted by the correction and
        not by the original is a derivation error.
      - >-
        Extension-field control: F_{q^n} index calculus must remain admissible
        under the corrected model.
      - >-
        Toy counting control: measured targets per relation against
        max(1, 1/P_dec), with a matched random base.
      - >-
        Degenerate-memory control: any point with memory exponent >= 1 is
        flagged as trivializing rather than winning.
    required_metrics:
      - >-
        the corrected admissible region as a table over (m, beta, sigma), with
        the recorded region overlaid
      - >-
        the two gates and their difference in sigma and in time exponent, per m
      - >-
        the MITM optimum (beta, time, memory) per m, and the miss N^{1/m}
      - >-
        the (time, memory) Pareto frontier with rho, BSGS, MITM and the
        small-root point located
      - >-
        measured versus predicted targets per relation at toy scale, both sides
        of the clamp boundary

  falsification_conditions:
    - >-
      Stage 0 finds the clamp already applied in 812554 or in the records that
      cite it. The record is withdrawn and the finding is that the gate is
      sound; the memory column (B) remains as a smaller contribution.
    - >-
      The clamped region is not a subset of the recorded one at some point. The
      derivation is wrong; nothing is filed against 812554.
    - >-
      The clamp region {beta > 1/m} does not intersect the admissible region for
      any m <= 32. This is E2 -- the gate is certified as written and the lane
      can cite it with confidence, which it currently cannot.
    - >-
      The clamp region does intersect. This is E1 -- the corrected gate
      (m-2)/(2(m-1)) is filed as a supersession, and every proposal in the lane
      scored at beta > 1/m must be rescored. This is a correction, not a result,
      and must be presented as one.
    - >-
      The MITM optimum is not at beta = 1/m or the value is not N^{1/2+1/m}.
      The (C) derivation is wrong and is withdrawn.
    - >-
      Toy counting shows targets per relation systematically above
      max(1, 1/P_dec). Correlated solver failure -- a genuine and separately
      reportable obstruction that would make every cost model in the lane
      optimistic in a second, independent way.

  confounders:
    - >-
      The m! factor sits inside the clamp boundary (B^m = m!N, not B^m = N);
      getting it wrong shifts the boundary by a constant in beta and could flip
      the intersection test at small m. It must be carried symbolically, not
      dropped.
    - >-
      The linear-algebra cost model (Wiedemann at m B^2 time, B memory) is
      assumed; a structured speedup would move the frontier, and H-STR-002 was
      weakened, so none is assumed here.
    - >-
      Charging solver memory changes which comparisons are legitimate: a point
      at memory N^{1/2} must be compared against BSGS, not against rho, and
      mixing the comparators is the easiest way to manufacture a false win.
    - >-
      "Time" here is a group-operation / field-operation exponent, not
      wall-clock; comparing a lattice-reduction exponent against group
      operations without the shared unit of IDEA-20260802-007 is a category
      error.
    - >-
      Large-prime and batching variations redefine what a relation is and move
      the clamp; they are outside this record's scope and are named as the
      successor, not silently excluded.

  interpretation_limits:
    - >-
      This is an audit of a cost model, not a lower bound on any algorithm. It
      says what the model says.
    - >-
      It closes nothing about the ECDLP and claims no attack; sota_delta on
      time, memory and queries is zero.
    - >-
      The MITM frontier (C) is derived inside this model; a different relation
      definition (large primes) is explicitly outside it and is the named open
      direction.
    - >-
      The screen of IDEA-20260808-812554 used targeted grep, NOT a full read;
      Stage 0 exists precisely because this record could be wrong about what
      that record does.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For uniformly random targets R, the number of m-multisets from V summing
        to R is Poisson with parameter mu = C(B+m-1,m)/N, uniformly for
        B = N^{beta}, beta in (0, 1/2), m fixed -- so that the expected number
        of targets consumed per relation is max(1, 1/mu)(1 + o(1)) and not
        larger.
      rigorous_support: >-
        The mean is EXACT and geometry-independent (KN-FIND-007's double count).
        Only the distribution is assumed, imitating the Erdos-Renyi
        representation-function heuristic for random sumsets -- the same
        assumption Gaudry and Diem make implicitly when they use the 1/n!
        decomposition rate.
      validation_plan: >-
        SAMPLE: at p in {2^12, 2^16, 2^20} with B on both sides of the clamp
        boundary and m in {3, 4}, compute the exact histogram of representation
        counts over ALL targets by one pass over V^m (feasible for
        B^m <= 2^30), plus a matched random-subset null. COMPARE against
        Poisson(mu) by chi-square and by the upper tail. TAIL CHECKS: coverage
        must satisfy coverage <= min(1, mu) and must not exceed 1.107 times the
        random base (the Sidon ceiling); the maximum count must not exceed the
        Poisson prediction by more than a factor log N, and KN-FIND-007's
        recorded 1224x concentration for a structured base is the reference for
        what a failure looks like. RECORDED PARAMETERS: p, curve, B, m, seed.
        TRANSFER: the clamp itself is exact arithmetic and needs no transfer;
        H1 is needed only for the "and not larger" clause.
    - id: H2
      statement: >-
        A target-keyed meet-in-the-middle over half-decompositions costs
        B^{ceil(m/2)} time and B^{floor(m/2)} memory with only polylog overhead,
        with no better memoryless variant: low-memory golden-collision search
        over domains of size D and memory w costs time of order sqrt(D^3/w),
        which is worse for w below D.
      rigorous_support: >-
        The time and memory of the table construction are elementary counting.
        The memoryless comparison imitates the van Oorschot-Wiener parallel
        collision search cost model recorded in KN-TECH-006 (recalled, not
        opened this session).
      validation_plan: >-
        SAMPLE: implement both variants at toy B in {2^6, 2^8, 2^10}, m in
        {3, 4}, and measure operation counts and peak memory. COMPARE the fitted
        log-log slopes against ceil(m/2) and floor(m/2), and the memoryless
        variant against 1.5*log D - 0.5*log w. TAIL CHECK: report the largest B
        at which the memoryless variant is competitive; if it ever is, (C)'s
        conclusion changes and that is the finding.

  target_complexity:
    time_exponent: >-
      No attack is claimed. The record's own outputs are exponents about OTHER
      proposals: the corrected saturated-regime gate sigma < (m-2)/(2(m-1)); and
      the MITM frontier, minimum time exponent 1/2 + 1/m at fixed m, tending to
      1/2 + o(1) as m grows with the m! factor charged. Both are NEGATIVE
      results at exponent level, i.e. the family is farther from rho than the
      current model says.
    memory_exponent: >-
      This is the record's main addition: memory = max(N^{beta}, solver memory),
      with solver memory B^{m/2} = N^{m beta/2} for MITM and N^{delta} for a
      dimension-N^{delta} lattice. At the MITM optimum memory is exactly
      N^{1/2}, which is BSGS's memory, so the comparison must be against BSGS.
    best_known: >-
      Pollard rho / vOW at 0.886 sqrt(N), O(1) memory; BSGS at sqrt(N) time and
      sqrt(N) memory. The MITM decomposition lane's infimum coincides with the
      BSGS point and never enters the region strictly below it.
    hidden_overhead: >-
      m! is superpolynomial once m grows with N and is exactly what prevents the
      N^{1/m} miss from being driven to zero; it is carried explicitly in (C)
      rather than absorbed into o(1). The polylog of table lookup and the
      2^{m-2} sign-pattern factor are charged and small.
    tradeoff_note: >-
      The whole record is a tradeoff statement. Along the MITM curve, time
      N^{1+beta-m beta/2} trades against memory N^{m beta/2}, and the trade is
      monotone with a single optimum at the clamp boundary. Against vOW at
      matched memory, rho gives N^{1/2} at O(1) memory, so this family must beat
      N^{1/2} outright at memory below N^{1/2}, which (C) shows it does not.
      Relation collection is embarrassingly parallel; the MITM table is a shared
      structure with communication cost equal to its size, which parallel rho
      does not pay.

  dominated_by: >-
    Pollard rho / vOW at N^{1/2} time, O(1) memory, dominates every point of the
    corrected family; at the MITM optimum, BSGS at (N^{1/2}, N^{1/2}) dominates
    on time at equal memory. All nine frontier rows checked as in
    IDEA-20260904-8dccc9: rho with negation; BSGS; kangaroo (not comparable,
    full-range target); automorphism-discounted rho (a further constant);
    Pohlig-Hellman (not applicable, N prime); preprocessing S T^2 = N (not
    comparable, no preprocessing claimed -- and explicitly so, since a
    preprocessing comparison would be the one place a large table is
    legitimate); Kuhn-Struik sqrt(TN) (not comparable, single target);
    special-curve attacks (out of scope); no published prime-field index
    calculus. On the narrow axis "clamped cost model with a memory column for
    this family" the corpus holds nothing, so on that axis the record is
    dominated by nothing -- a gap in the corpus, not a place on the frontier.

  sota_delta: >-
    +0 on time, memory and queries, and DELIBERATELY NEGATIVE for the family:
    the corrected model places every member farther from rho than the current
    model does. Quantified deltas: (i) the admission gate in the saturated
    regime tightens from (m-3)/(m-1) to (m-2)/(2(m-1)), a difference of 0.286 in
    sigma at m = 8 and 0.4 in the time exponent at the witness point; (ii) the
    MITM decomposition lane is placed at exactly N^{1/2 + 1/m} time and N^{1/2}
    memory, i.e. Pareto-tied to BSGS, with the miss N^{1/m} named as the
    quantity to attack; (iii) the family acquires its first (time, memory)
    frontier, which docs/target-result-profile.md A8 requires before any
    asymptotic promotion and which the lane has never produced.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    ~0.7 that the clamp is genuinely missing from the lane's model (Stage 0 may
    find it handled). ~0.9 that, if missing, it binds inside the admissible
    region for m >= 5. ~0.85 that the MITM frontier derivation survives review.
    ~0.99 that the record produces no attack, which is stated in the claim
    rather than in a footnote. Priority MEDIUM rather than high because it moves
    no attack forward; it is elevated above low because a wrong gate silently
    mis-scores every future solver proposal in this lane, and because the
    frontier artifact is a promotion prerequisite the lane will need anyway.

  scope: >-
    The cost model of prime-field decomposition-based index calculus with a
    fixed notion of relation (m factor-base points summing to a target), sparse
    Wiedemann linear algebra, and solvers charged for their own memory. Toy
    validation only. Explicitly outside scope, and named as the successor:
    large-prime and batching variations, which redefine a relation and move the
    clamp, and preprocessing-model comparisons, where large tables are
    legitimate.

