idea:
  id: IDEA-20260904-c583dd
  question_id: RQ-PFDR-ae2fba
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE YIELD CLAMP AND THE MEMORY COLUMN: the lane's cost model lets the target
    count m!N/B^m fall below 1, which credits fractional targets and moves the
    admission gate from sigma < (m-3)/(m-1) to sigma < (m-2)/(2(m-1)) wherever
    beta > 1/m -- inside the admissible region for every m >= 5 -- and once
    memory is charged, the meet-in-the-middle decomposition lane misses Pollard
    rho by exactly N^{1/m}, bottoming out at time N^{1/2+1/m} with memory
    N^{1/2}, i.e. Pareto-TIED to BSGS and never inside it.
  class: control

  claim: >-
    (A) THE CLAMP. IDEA-20260808-812554's master formula
    C_rel = B * P_dec^{-1} * T_solve = m! N B^{(m-1)(sigma-1)} uses
    P_dec^{-1} = m!N/B^m with no lower bound. But the number of targets consumed
    per relation is max(1, m!N/B^m): a target that decomposes with probability
    exceeding 1 still costs one target. The unclamped expression therefore
    UNDER-counts cost precisely when B^m > m!N, i.e. beta > 1/m (up to the m!
    correction). That region is not exotic: the admissible region of the same
    record is beta < 1/4 with beta(m-1)(1-sigma) > 1/2, and beta in (1/m, 1/4)
    is nonempty for every m >= 5 and contains admissible points (e.g. m = 8,
    beta = 0.2, sigma = 0 gives 1.4 > 0.5). The corrected accounting has two
    regimes -- SPARSE, beta < 1/m, with
    time = N^{1 + beta - m beta} * T_solve; and SATURATED, beta >= 1/m, with
    time = N^{beta} * T_solve -- and the admission gate in the saturated regime,
    with T_solve = B^{(m-1)sigma}, is beta(1 + sigma(m-1)) < 1/2, i.e.
    sigma < (m-2)/(2(m-1)) at the boundary beta = 1/m. At m = 8 that is 0.4286
    against the record's 0.7143: the true gate is materially tighter, and the
    binding gate is the minimum of the two.
    (B) THE MEMORY COLUMN. The same record states that beta is exactly the
    memory exponent. That is true when the solver is memoryless and FALSE for
    the two solvers this lane actually proposes: a meet-in-the-middle
    decomposition stores B^{m/2} half-sums, and a small-root solver of shift
    dimension D stores the lattice. Charging them changes which points of the
    family are admissible at all, because a point with memory above N^{1/2} is
    dominated by BSGS by construction and a point with memory above N is
    degenerate.
    (C) THE MITM FRONTIER, DERIVED. With T_solve = B^{m/2} (target-keyed
    meet-in-the-middle, memory B^{m/2}) and the clamp, the sparse regime gives
    time = N^{1 + beta - m beta/2}, decreasing in beta, and the saturated regime
    gives time = N^{beta(1 + m/2)}, increasing in beta; so the unique optimum is
    beta = 1/m exactly, giving TIME = N^{1/2 + 1/m}, MEMORY = N^{1/2}, and
    linear algebra N^{2/m}. The lane therefore misses rho by exactly N^{1/m} for
    every m, at the point where its memory equals BSGS's. In sigma units the
    miss is exactly 1/(m-1), since sigma_MITM = m/(2(m-1)) against the corrected
    gate (m-2)/(2(m-1)). Letting m grow to close the miss reintroduces the m!
    factor; balancing 1/m against m log m / (2 log N) at
    m ~ sqrt(2 log N / log log N) gives TIME = N^{1/2 + o(1)} at MEMORY
    N^{1/2 - o(1)} -- exactly the BSGS point, approached from outside and never
    crossed. This is a closure with a mechanism (the clamp plus the ordering
    factor) and a number (N^{1/m} at fixed m), not a fatigue report.
    (D) WHAT IS DISCRIMINATED. E1: the clamp binds inside the admissible region,
    the corrected gate is (m-2)/(2(m-1)) there, and every proposal in this lane
    that cleared the old gate at beta > 1/m was scored against the wrong number
    -- which is a correction the lane must absorb before it evaluates any new
    solver. E2: the clamp never binds jointly with the other two constraints,
    the old gate stands unmodified, and the audit certifies it -- which is also
    worth having, because the gate is cited by a dozen records and has never
    been checked.

  mechanism: >-
    Every cost model in this lane multiplies three factors: relations needed,
    targets per relation, and solve cost per target. The middle factor is a
    reciprocal probability, and reciprocal probabilities silently go below one.
    When they do, the model bills the attacker for a fraction of a target, and
    the resulting "win" is arithmetic, not cryptanalysis. The clamp is the
    smallest possible fix and it moves an exponent, not a constant: it converts
    the gate from (m-3)/(m-1) to (m-2)/(2(m-1)), a gap that tends to 1/2 as
    m grows. The memory column is the same failure in a different axis: a
    solver's own storage is invisible in a model where beta is declared to be
    the memory exponent, and the meet-in-the-middle lane is exactly the case
    where that storage is the dominant term. Fixing both turns a set of
    inequalities into a (time, memory) Pareto frontier, which is the object
    docs/target-result-profile.md A8 and C15 require before any asymptotic claim
    is promoted, and which this lane has never drawn.

  novelty_status: unverified

  novelty_screen:
    kb_index: >-
      Empty (CRYPTO_KB_QDRANT_URL = ':memory:'); search_knowledge not called.
    corpus_grepped: >-
      ledger/proposals for 'sigma', 'clamp', 'max(1', 'yield', 'time-memory',
      'meet-in-the-middle', 'vOW'; knowledge/techniques for 'vOW',
      'van Oorschot', 'time-memory'.
    results: >-
      IDEA-20260808-812554 (claim, target_complexity and proof_search_map fields
      read by grep) states the master formula with the unclamped P_dec^{-1}, the
      gate sigma < 1 - 2/(m-1), the achieved exponent 2/(2 + (m-1)(1-sigma)),
      and the assertion that beta is exactly the memory exponent.
      IDEA-20260808-9ef88c (read in full) uses MITM at theta = ceil(m/2) as the
      dominating baseline and charges its own grid memory honestly, but does not
      derive the MITM frontier or the N^{1/m} miss. IDEA-20260727-003 (free
      oracle floor) and IDEA-20260727-007 are named by 812554 as slices of its
      surface; neither was opened here. knowledge/techniques KN-TECH-006, -018,
      -050, -055, -057, -079 contain vOW and time-memory material (not opened).
      No record found that clamps the target count, that derives the
      saturated-regime gate, or that draws a (time, memory) frontier for this
      family.
    external: >-
      Not checked. The clamp is elementary and the MITM frontier derivation is
      standard bookkeeping; it is entirely possible that the prime-field index
      calculus literature states the N^{1/2+1/m} point, and a reviewer should
      check Semaev, Gaudry, Diem and the hyperelliptic large-prime line before
      any novelty is claimed for (C).
    conclusion: >-
      unverified. The contribution is an AUDIT with two derivations; its value
      does not depend on novelty, and if (C) turns out to be known that is
      itself the useful outcome, because this corpus does not record it.

