idea:
  id: IDEA-20261018-2c37f5
  title: Stacked D4 + double-large-prime arm on E(F_{p^4}), end to end in ecbench
  class: composition
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: Stacking D4 symmetry (18.2x [16.4, 20.8] whole-solve constant) with double large primes (LA exponent
    0.495 -> 0.420 [0.405, 0.440]) gives an end-to-end cold S below the D4-only arm at the largest measured
    sizes with a lower fitted exponent, because D4 attacks the relation phase that makes plain 2LP 2.31x
    [2.10, 2.62] costlier (relation phase 0.238 -> 0.333; crossover only near 2^219).
  mechanism: Measured separately and never run together. Plain 2LP loses because its relation phase worsens;
    D4 reduces relation-phase cost by a constant. Run the stacked arm against the D4-only arm (the new
    baseline) and the plain arm, same instances, with sparse LA (see the relation-matrix idea) so the
    LA exponent gain is realised, and every phase charged cold.
  novelty_status: adaptation
  regime: prime-field extension E(F_{p^4}), k=4 ladder; proven-exponent regime; 1-2 weeks after the sparse-LA
    wiring
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.4 bullet 1, 2.2 row 1, 4 row 5
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/ic_next10_20261014/01-fp4-ladder/README.md
    provenance: internal
    claim: D4 18.2x [16.4,20.8]; 2LP exponent 0.495 -> 0.420; whole solve 2.31x costlier; stacked arm
      not run (path as named in the review's item-1 row).
    verified_by: idea-generator
  - ref: crypto:research/d4_symmetrised_s5_20261015/README.md
    provenance: internal
    claim: 'D4 lane: weighted Macaulay solve, 844-863x below plain S4 in C_w, handover n* = 2^118.9, classed
      engineering.'
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-46d822
    - KR-IC-a4dd54
    - KR-IC-955fd6
    nearest:
    - ref: KR-IC-a4dd54
      provenance: internal
      relation: adjacent
      delta: Double large primes in the genus-g setting; here combined with D4 symmetry on E(F_{p^4}),
        a composition of two measured components.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Both components keep their measured effect when stacked (no interaction); this is the thing tested.
  - Sparse LA from the relation-matrix item is available, else the LA exponent gain is not realised.
  predictions:
  - metric: stacked_vs_D4_only_whole_solve_S
    direction: lower
    minimum_effect: Ratio below 1 with interval excluding 1 at the largest sizes.
  - metric: fitted_whole_solve_exponent
    direction: lower
    minimum_effect: Below the D4-only exponent, interval excluding it, over at least four sizes.
  - metric: gap_to_matched_rho
    direction: different
    minimum_effect: Reported per row as distance remaining.
  minimal_test:
    design: Freeze instances and protocol; run plain, D4-only, 2LP-only and D4+2LP arms interleaved in
      ecbench with every phase cold, verified answers, exact replays; at least four sizes so an exponent
      is fitted. Baseline for the ratchet is the D4-only arm.
    controls:
    - A/A on the D4-only arm
    - 'positive control: reproduce the 18.2x and 2.31x components separately'
    - matched rho at the same sizes
    - unpriced work priced at 0/0.1/1 GAE
    required_metrics:
    - end-to-end cold S per arm
    - per-phase costs
    - fitted exponent per arm
    - verification and replay status
  falsification_conditions:
  - Stacked S >= D4-only S at the largest sizes, or a fitted exponent not below D4-only, refutes 'the
    gains stack'.
  - A relation-phase gain without an end-to-end gain is a stage improvement only.
  confounders:
  - large-prime bound tuning
  - interaction between D4 orbit reduction and large-prime matching
  - sparse LA availability
  interpretation_limits:
  - Toy-size ladder; no claim about a deployed curve.
  - Beating rho needs a cold S below matched rho, robust at growing n and replayed independently.
  heuristic_assumptions:
  - id: H1
    statement: D4 orbit reduction and double-large-prime matching compose multiplicatively on relation
      yield.
    rigorous_support: Each effect measured separately on the same ladder.
    validation_plan: Measure the stacked relation phase against the product of the two separate factors.
  target_complexity:
    time_exponent: 'Conditional: relation-phase constant from D4 and LA exponent about 0.420 from 2LP;
      first candidate for an IC row on a frontier. Exponent not claimed until fitted.'
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium-high
    compute: medium (1-2 weeks, reviewer estimate)
  recommended_priority: high
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: 'None measured for the stack. Components: D4 18.2x constant, 2LP LA exponent -0.075.'
