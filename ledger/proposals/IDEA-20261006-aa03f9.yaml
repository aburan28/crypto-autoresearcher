idea:
  id: IDEA-20261006-aa03f9
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    One-step branching of the field norm of x under addition, on
    y^2 = x^3 + x + 1 over F_7, against the x-coordinate and a random label.
  class: mechanism
  claim: >-
    On E: y^2 = x^3 + x + 1 over F_7, let π_N send an affine point P of
    E(F_{7^3}) to N_{F_{343}/F_7}(x(P)) in F_7. With L and b as in
    IDEA-20260802-002, the claim is L >= 2 and b <= 4, while a uniform
    random label onto a set of size 7 has b >= 6 on the same points, and
    the x-coordinate projection has b = 2 and L = 1 exactly. The
    representation is R1. The stage is one-step propagation, not a walk and
    not a factor base. The discrete-log time exponent stays 1/2 and the
    delta versus Pollard rho is 0.
  mechanism: >-
    Explanation 1: fibres of the norm are large and no chord-tangent
    identity bounds N(x(A+B)), so b saturates at the image size, just as a
    random label does, and b <= 4 fails. Explanation 2: N(x(A+B)) takes at
    most 4 values as A and B run over a pair of fibres, in the same way
    that x(A+B) and x(A-B) give b = 2 for the x-coordinate. The claim is
    explanation 2.
    OBJECT FRAME. Representation: R1, x(P), then the field norm down to
    F_7. Operation set Sigma: the full translation set used by the meter,
    that is A, B ranging over fibres and the step A+B. Because Sigma
    contains full translation, the candidate is branching and says so.
    TRICHOTOMY. Branching. Reason: b is predicted greater than 1, and
    IDEA-20260806-c5d183 forbids deterministic lossy propagation under every
    translation, so a finite b > 1 is the only remaining reading of a norm
    that is not injective. LOSSY-PROJECTION TEST against Sigma. Discarded:
    the position inside a norm fibre. Compatible only up to branching: the
    norm of a sum is not a function of the two norms alone unless b = 1,
    which full translation rules out whenever L >= 1. Lossy: the image lies
    in a set of size at most 7 and the curve over F_{343} is larger, so a
    mean fibre of size at least 4 gives L >= 2. Priced pair: the measured
    (L, b), with the success gate b <= 4 and L >= 2.
    OFF-LIMITS. F1 is not the lens: no walk is run. F2 is not the lens: no
    factor base is stored. F6 is not the lens: Frobenius enters only as the
    field automorphism inside the norm, not as an orbit key. A membership
    test for a norm value would be the high-degree implicit class of
    KN-OPEN-020 and is not claimed.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260802-002
      provenance: internal
      claim: >-
        L is log2 of the mean fibre. b is the mean, over pairs of image
        values, of the number of distinct projections of A+B with A and B
        in those fibres. The x-coordinate returns L = 1 and b = 2.
      verified_by: idea-generator, 2026-10-06, opened ledger/proposals/IDEA-20260802-002.yaml
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Lossy and deterministic under every translation are mutually
        exclusive on a prime-order subgroup. Branching is the class with
        b > 1.
      verified_by: idea-generator, 2026-10-06, opened ledger/proposals/IDEA-20260806-c5d183.yaml
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C: an exactly sum-compatible bucket map on a prime-order
        subgroup is a homomorphism, hence constant or bijective when the
        subgroup order is prime.
      verified_by: idea-generator, 2026-10-06, opened knowledge/findings/KN-FIND-ffe1df.md
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs on the order of the square root of the
        group order. This proposal does not undercut that exponent.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Gaudry's exponent in q is 2-2/n for fixed n. A single branching
        number on F_{7^3} is not a new value of that exponent.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Tate's theorem: over a finite field, isogenous curves have the same
        number of points, and an isogeny walk cannot reach a different
        weakness class. This proposal does not walk an isogeny class.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Bounded-degree algebraic factor bases are scoped out conditionally.
        The open remainder includes high-degree and implicit membership.
        This proposal does not enter that remainder.
      verified_by: idea-generator, 2026-10-06, opened knowledge/open-problems/KN-OPEN-020.md
  assumptions:
    - >-
      The point at infinity is omitted from the domain of π_N. Fibres are
      computed on the affine points only.
    - >-
      The x-coordinate calibration must return L = 1 and b = 2 before the
      norm's (L, b) is accepted. A miss voids the run.
    - >-
      The random label is a frozen function from the affine points to
      {0,1,2,3,4,5,6}, built by enumerating points in lexicographic order
      and assigning successive integers mod 7. It is not redrawn after
      seeing b.
  proof_search_map:
    bottleneck: >-
      The one-step branching b of π_N. If b > 4, the norm does not propagate
      inside a fanout small enough to match the x-coordinate calibration up
      to a factor 2, and explanation 1 holds on this curve.
    baseline_embedding:
      parameter_slice: >-
        The x-coordinate projection on this same curve E(F_{7^3}), predicted
        L = 1 and b = 2 by the negation identity in IDEA-20260802-002.
      reproduction_check: >-
        Compute that pair first. Accept the norm measurement only if the
        pair is exactly (1, 2).
    observation_collision:
      observable: the value of the norm in F_7
      distinct_preimage_search: >-
        Search for two affine points with the same norm and different
        traces of x. A hit shows the norm fibre is not a single Frobenius
        orbit of one x-coordinate. The search is reported and is not itself
        the success gate.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The field norm of the affine x-coordinate, fibres taken on
          E(F_{7^3}).
        predicted_gain: >-
          A measured pair (L, b) with L >= 2 and b <= 4. No smaller
          discrete-log exponent.
    quantifier_order: >-
      There exists a computation on this one curve for which L >= 2 and
      b <= 4, and for which the random label on a 7-set has b >= 6. Not a
      statement for every q or every n.
    method_ceiling:
      strongest_certifiable_claim: >-
        The integers L and b on y^2 = x^3 + x + 1 over F_{7^3}, plus the
        two calibration readings. Nothing about a second prime.
      nearby_object_control: >-
        The random label onto seven bins, where b >= 6 is required. A
        claim that every map onto a 7-set has b <= 4 is false on that
        control, and a norm reading with b >= 6 lands in explanation 1.
    proof_obligations:
      - claim: The x-coordinate pair is exactly L = 1, b = 2 before the norm is scored.
        responsibility: baseline
      - claim: b is the mean image size in the definition from IDEA-20260802-002, not a wall-clock proxy.
        responsibility: correctness
      - claim: The gate is one curve and one extension.
        responsibility: scope
      - claim: b <= 4 is strictly stronger than the random-label reading b >= 6 on this instance.
        responsibility: strictness
    not_applicable_reason: >-
      None. The bottleneck, the x-coordinate baseline, the fibre collision,
      the quantifier order, and the random-label ceiling all apply. The
      record still does not claim an exponent change.
  predictions:
    - metric: one-step branching b of the norm of x
      direction: lower
      minimum_effect: "b(norm) <= 4, L(norm) >= 2, and b(random label) >= 6, with the x-coordinate at b = 2 and L = 1"
  minimal_test:
    design: >-
      Curve E: y^2 = x^3 + x + 1 over F_7, points over F_{7^3}. Recheck the
      discriminant. Enumerate affine points. Compute (L, b) for the
      x-coordinate, then for π_N, then for the frozen random label onto
      seven bins. Toy scope is this single extension. No discrete log is
      attempted.
    controls:
      - x-coordinate returns L = 1 and b = 2 exactly, or the run is void.
      - Identity projection on a subset of 30 points returns L = 0 and b = 1.
      - Random label returns b >= 6, or the norm gate is not interpreted.
      - Two independent loops over fibres, one swapping the order of summation, agree on b to the last integer.
      - Mean fibre size of π_N is reported beside L.
    required_metrics:
      - L(x-coordinate) and b(x-coordinate)
      - L(norm) and b(norm)
      - b(random label)
      - image size of the norm (integer, at most 7)
      - affine point count (integer)
  falsification_conditions:
    - b(norm) >= 5, which selects explanation 1.
    - L(norm) < 2, so the norm is not lossy enough on this curve.
    - The x-coordinate calibration is not exactly (L, b) = (1, 2).
    - b(random label) < 6, so the meter did not see saturation on a control that should saturate.
    - The two fibre loops disagree.
  confounders:
    - Omitting the point at infinity changes fibres by one point. The omission is fixed and the affine count is reported.
    - A norm image smaller than 7 lowers the random-label comparison only if the random label is also shortened. The random label stays on seven bins even if the norm misses a value.
    - Negation identifies two points with the same x and hence the same norm. That identification is already priced by the x-coordinate calibration b = 2; it does not by itself force b(norm) <= 4.
  interpretation_limits:
    - Toy scope: F_7 and F_{343} only.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0, whether or not b <= 4.
    - A passed gate is one integer on one curve. It is not a claw algorithm and not a factor base.
    - KN-OPEN-020 is not discharged. High-degree implicit membership is not constructed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The number of distinct norms N(x(A+B)), as A and B range over a
        pair of norm fibres, has mean at most 4. This imitates the exact
        identity that the two x-coordinates x(A+B) and x(A-B) exhaust the
        image of the x-projection on a pair of negation fibres, scaled by a
        factor 2. The scaling is not proved for the norm.
      rigorous_support: >-
        IDEA-20260802-002 records b = 2 for the x-coordinate from the two
        sums A+B and A-B. The norm map F_{7^3}^× -> F_7^× is the
        surjective homomorphism z |-> z^{(7^3-1)/(7-1)}. Composing that
        homomorphism with x(A+B) has no opened bound of 4.
      validation_plan: >-
        Compute b exactly on this curve, as the minimal test. Tail check:
        report the maximum, over fibre pairs, of the number of distinct
        norms of A+B, beside the mean b. If the mean is <= 4 and the
        maximum is >= 7, H1's bounded-fanout reading fails even though the
        mean passed. A later session may repeat the same meter at q = 11
        and q = 13 on y^2 = x^3 + x + 1 after checking the discriminant;
        that repeat is not part of this minimal test.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "1/2 is the generic collision memory scale and is not improved; this test stores fibres of one curve of size about 7^3"
    best_known: >-
      Pollard rho at discrete-log exponent 1/2 (KR-RHO-13bf67), and Gaudry
      Õ(q^{2-2/n}) for fixed n (KR-IC-46d822). Neither exponent is replaced.
    hidden_overhead: >-
      No o(1) term is claimed. b and L are exact rationals converted to the
      comparisons above, on one curve.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus Pollard
      rho is 0. Bounded branching on one toy curve is not a van
      Oorschot-Wiener tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-RHO-13bf67, KR-RHO-037e22, KR-IC-b0fcda, KR-IC-46d822, and
