idea:
  id: IDEA-20260816-c65293
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: The archived campaign's single celebrated positive is a maximum taken over many screened
    cells, so count the cells, estimate their effective independence by resampling the archived design,
    and report how many survivors a campaign of that exact shape produces when nothing is there.
  class: measurement
  claim: '(A) EV-ALPF-001 imports 32 experiment packages, and the individual analyses within them
    screen many cells each: the EXP-ALPF-011 table alone lists five representations crossed with two
    factor-base sizes and at least three bit sizes, and EXP-ALPF-010''s cost table lists three bit
    sizes by three factor-base sizes by two trace values. The campaign''s headline -- ''the campaign''s
    FIRST prime-field algebra-track positive'' -- is by construction a maximum over that grid. Nothing
    in the ledger states how many cells were screened in total or what a maximum over that many cells
    is worth. (B) The claim is that both numbers are recoverable and that the second follows from
    the first plus a per-cell null rate: count the screened cells directly from the archived analysis
    tables, estimate their effective independence by resampling the archived design structure, since
    cells sharing a curve, a representation or a bit size are not independent, and compute the expected
    number of cells firing under a per-cell null rate, with its full distribution rather than a point.
    (C) The claim is further that the archived design is heavily non-independent -- the same five
    representations recur at every bit size and factor-base size -- so the effective number of independent
    cells is well below the raw count. That cuts both ways: it weakens any naive multiplicity correction,
    and it means the grid explored far fewer genuinely distinct configurations than its row count
    suggests, which is a statement about how much of the space the campaign covered. (D) NOT CLAIMED:
    that the archived positive is a chance finding; that any correction should be applied retroactively
    to an immutable record; that the campaign was badly designed. A cell count and an effective-independence
    estimate are descriptive statistics of a committed design, and their purpose is to let a future
    ALPF campaign size itself deliberately instead of accumulating cells and taking a maximum.'
  mechanism: 'STAGE 1 (zero compute): parse every archived ALPF analysis.md table and count screened
    cells, recording for each cell its curve label, representation, bit size, factor-base size and
    verdict. This produces a design matrix of the campaign as executed, which no record currently
    contains. STAGE 2 (zero compute): describe the factor structure and the nesting -- which cells
    share a curve, which share a representation -- and report the raw count alongside the distinct-configuration
    count per factor. STAGE 3: estimate effective independence by permutation resampling on the design
    matrix, repeatedly permuting verdicts within each factor level and measuring the variance of the
    number of fires against the binomial variance full independence would give; the ratio is a design
    effect. STAGE 4: combine a per-cell null fire rate, supplied by a companion measurement and swept
    over a range, with the effective cell count to give the distribution of chance survivors for a
    campaign of this shape. STAGE 5: report the archived observed survivor count against that distribution,
    descriptively, with the multiplicity structure stated. STAGE 6: emit a forward sizing table --
    given a target of at most one expected chance survivor, how many cells of each kind a future ALPF
    campaign may screen. Refutation: if the design effect is near 1 and the expected chance-survivor
    count is far below the observed count, multiplicity is not an issue for this campaign and the
    entry closes that concern with a number.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'positive predictive|PPV|base rate' ledger/proposals/ ; grep -ril 'ALPF' ledger/proposals/
      ; read ledger/evidence/EV-ALPF-001.yaml observation list in full, experiments/EXP-ALPF-011/analysis.md
      and EXP-ALPF-010/analysis.md tables, ledger/hypotheses/H-ALPF-001.yaml and H-ALPF-017.yaml,
      docs/inventor-protocol.md sections 3 and 4.
    results: 'Zero proposals reference ALPF: grep -ril ALPF over all 920 proposal files returns nothing.
      The base-rate nouns match IDEA-20260815-143d6e (tier-ladder pricing), IDEA-20260805-2f2863,
      IDEA-20260805-db5afa, IDEA-20260805-250e50, IDEA-20260807-caf061, IDEA-20260815-5f2a58, IDEA-20260805-51996a
      and IDEA-20260815-c13ef4. Closest by intent is IDEA-20260815-5f2a58 (RQ-ECDLP-002), which states
      a proposal batch''s own prior of survival and checks it against the program''s historical yield
      -- a portfolio-level yield statement across proposals. The blacklisted IDEA-20260815-bc26a3
      covers the program''s own false-positive rate in that same portfolio sense. Neither reconstructs
      the design matrix of ONE campaign from its committed analysis tables, and neither estimates
      effective independence of screened cells within a design. Inside the ALPF artifacts the multiplicity
      is visible but never counted: EXP-ALPF-011''s table crosses five representations with two factor-base
      sizes and three bit sizes, and its headline sentence explicitly reports a first-of-campaign
      maximum.'
    verdict: 'UNVERIFIED. No literature claim in either direction; external literature is unreachable
      from this environment. Assembled from known parts: cell counting, permutation-based design-effect
      estimation, and a per-cell null rate that a companion measurement supplies. Claimed new relative
      to this repository: (i) reconstructing one campaign''s design matrix from its immutable analysis
      tables, which no record contains; (ii) estimating EFFECTIVE rather than raw cell count, so any
      correction is not the naive Bonferroni that this design''s heavy nesting would make absurd;
      (iii) emitting a forward sizing table for future ALPF campaigns rather than a retrospective
      verdict on the archived one. Distinct from portfolio-level yield accounting (IDEA-20260815-5f2a58,
      IDEA-20260815-bc26a3), which counts proposals and campaigns rather than cells within one grid.'
  object_first_candidate:
    tracked_object: 'The campaign''s design matrix: the multiset of screened cells with their factor
      coordinates (curve label, representation, bit size, factor-base size) and their verdicts, treated
      as one object rather than as a list of independent measurements.'
    lossiness: 'Genuinely lossy. The design matrix retains only factor coordinates and a verdict per
      cell, discarding every polynomial, degree, coefficient, timing and intermediate the campaign
      produced. This is compatible with the operation of interest -- taking a maximum over cells,
      which is what a campaign headline does -- because the maximum depends only on the verdicts and
      the count. The projection is massively non-injective: any campaign with the same grid shape
      and the same fire pattern projects to the same object, which is exactly what makes the resampling
      null well defined. Stated honestly: the retained factor coordinates are load-bearing for the
      design-effect estimate, and if they too were discarded the object would collapse to a single
      count and no design effect could be estimated at all.'
    propagation: 'One step of the target operation is the addition of one screened cell to the campaign.
      Acting on the tracked object it increments the count, appends one factor-coordinate row, and
      updates the campaign-level maximum to the OR of its previous value with the new cell''s verdict.
      Propagation is therefore monotone at campaign level in the same way the per-cell first-passage
      structure is monotone in degree: the probability the campaign reports at least one survivor
      is non-decreasing in the number of cells, and its growth rate is governed by the effective rather
      than the raw count. That growth rate is what the resampling estimates.'
    survival_score: 'The object survives as long as archived analysis tables can be parsed into factor
      coordinates, which covers the whole 32-package import in principle, with a concrete failure
      mode: several analyses are one-word summaries rather than tables (EV-ALPF-001 records EXP-ALPF-002
      as ''failed'' and EXP-ALPF-004 as ''INCONCLUSIVE'') and contribute an unknown number of cells.
      The structure dissolves exactly at those packages, and the honest output reports counted and
      uncounted packages separately rather than imputing.'
  null_object_control: The null object is a synthetic campaign of the identical design shape in which
    every verdict is drawn independently at a specified per-cell null rate, generated 10000 times.
    The IDENTICAL counting and maximum-taking procedure runs over it in the same invocation. For the
    comparison to mean anything the null campaigns must reproduce the archived grid dimensions exactly
    -- same factor levels, same nesting, same cell count -- and the rate must be measured rather than
    assumed; if no measured per-cell null rate is available the entry reports the design matrix and
    design effect only and refuses to report an expected chance-survivor count at all. A second null
    permutes the archived verdicts within factor levels, preserving the observed marginal fire rate
    and destroying only the association with factor coordinates, which isolates whether fires cluster
    by representation.
  discriminated_from:
  - IDEA-20260815-5f2a58 states a proposal batch's prior of survival against the program's historical
    yield. That counts proposals across the portfolio; this counts cells inside one campaign's grid
    and estimates their non-independence, which is a property of a design, not of a portfolio.
  - IDEA-20260815-bc26a3 (blacklisted and named here deliberately) concerns the program's own false-positive
    rate across campaigns. This entry never aggregates across campaigns and produces no program-level
    number; its outputs are a design matrix and a forward sizing table for one lane.
  - The companion per-cell null-rate measurement supplies the rate; this entry consumes it and adds
    only the multiplicity structure. Without that input it degrades to a design-matrix-and-design-effect
    report, and that degradation is specified rather than hidden.
  - EXP-ALPF-011's own headline reports a first-of-campaign positive. That maximum is what this entry
    measures the null distribution of; it re-measures no cell and runs no algebra whatsoever.
  - IDEA-20260815-abcbbc (goal-status inventory) and IDEA-20260815-eaf0d1 (audit crowd-out) are program-management
    audits. This is a statistical property of one committed experimental grid, producing a forward
    design constraint rather than a management recommendation.
  assumptions:
  - The archived analysis.md tables can be parsed into factor coordinates for a substantial share
    of the 32 packages; unparseable packages are reported as uncounted rather than imputed.
  - A per-cell null fire rate is available from a companion measurement; without it only the design
    matrix and design effect are reported.
  - Cells sharing a factor level are correlated in a way a within-level permutation captures; this
    is the standard design-effect assumption and is explicitly a modelling choice.
  - Verdict labels are extractable unambiguously as fires/quiet, with inconclusive kept as a third
    category rather than folded into either.
  - The archived grid is a faithful record of what was screened; cells screened but not reported would
    bias the count downward, a limitation stated rather than corrected.
  predictions:
  - metric: raw screened cell count across parseable ALPF packages
    direction: higher
    minimum_effect: 150
  - metric: design effect, resampled fire-count variance over binomial variance
    direction: higher
    minimum_effect: 1.5
  - metric: effective independent cell count as a fraction of the raw count
    direction: lower
    minimum_effect: 0.5
  - metric: fraction of the 32 packages whose analyses yield a parseable cell table
    direction: different
    minimum_effect: 'refuse to pre-commit: several observations in EV-ALPF-001 are one-word summaries
      such as ''failed'' and ''inconclusive'', so how many packages carry full tables is unknown until
      parsed'
  minimal_test:
    design: 'Two packages, zero algebra. Parse the analysis tables of EXP-ALPF-011 and EXP-ALPF-010
      only -- the two that certainly carry full tables, since both are quoted at length in the imported
      analyses -- into factor coordinates and verdicts. Count cells, tabulate the factor structure,
      and run 10000 within-level permutations to estimate the design effect for that sub-design. Then,
      with a per-cell null rate supplied as a parameter and swept from 0.01 to 0.20, report the distribution
      of chance survivors for a grid of that exact shape. This costs minutes and no elliptic-curve
      work at all, and already discriminates: a design effect near 1 with an expected chance-survivor
      count well below 1 at a rate of 0.05 settles the multiplicity question for these two packages,
      while a design effect above 2 shows the campaign''s rows are far less independent than their
      count suggests.'
    controls:
    - Within-level permutation null preserving the observed marginal fire rate, over the same design
      matrix.
    - Independent-Bernoulli synthetic campaigns at the supplied per-cell rate, matched to the exact
      grid shape.
    - Null-rate sensitivity sweep from 0.01 to 0.20 so no conclusion is hostage to a single value.
    - 'Parseability control: counted and uncounted packages reported separately, uncounted ones listed
      by id.'
    - 'Verdict-extraction control: two independent extraction passes over the same tables, with disagreements
      listed rather than silently reconciled.'
    required_metrics:
    - raw screened cell count, per package and total
    - factor-level counts per factor (curve label, representation, bit size, factor-base size)
    - design effect from within-level permutation
    - effective independent cell count
    - chance-survivor count distribution per swept null rate
    - observed survivor count in the archived campaign
    - list of unparseable packages by id
  falsification_conditions:
  - Design effect at or below 1.1, falsifying the non-independence claim and making the raw count
    the right count.
  - Expected chance-survivor count below 0.1 at the supplied null rate, closing the multiplicity concern
    with a number.
  - Fewer than half of the 32 packages parseable, in which case only a partial design matrix is reported
    and no campaign-level expectation is claimed.
  - The two verdict-extraction passes disagreeing on more than 5 percent of cells, indicating the
    tables are not machine-readable enough to support a count.
  - Within-level permutation and independent-Bernoulli nulls giving indistinguishable fire-count distributions,
    indicating the factor structure carries no association and the design effect is unmeasurable.
  confounders:
  - Cells screened but not reported are invisible, biasing the raw count downward by an unknown amount.
  - The verdict vocabulary is inconsistent across packages (fires, survived, POSITIVE, SCOPED_NEGATIVE,
    INCONCLUSIVE), so categorisation involves judgement that the two-pass control bounds but does
    not remove.
  - Within-level permutation assumes exchangeability within a level, which is plainly questionable
    for factor-base size where larger bases may be systematically harder.
  - The per-cell null rate is measured on shape-matched random systems, which may not be the right
    null for every archived cell type.
  - Counting INCONCLUSIVE cells as screened or not changes the headline count materially and is a
    stated modelling choice, computed both ways.
  interpretation_limits:
  - This is descriptive statistics of a committed design; it corrects nothing, since the archived
    records are immutable and were never claimed above toy tier.
  - Any expected chance-survivor count is conditional on a null rate measured elsewhere and on the
    assumption that the archived grid is fully reported.
  - Nothing here evaluates any representation, curve or decomposition, and no attack or security consequence
    follows.
  - The forward sizing table constrains future ALPF campaign design at toy scale only and carries
    no implication for other lanes.
  target_complexity:
    time_exponent: No attack exponent is claimed. This entry runs no cryptographic computation at
      all; its cost is parsing plus 10000 permutations of a small matrix.
    memory_exponent: No attack memory exponent is claimed. The design matrix is a few hundred rows.
    best_known: The incumbent is the campaign's own reporting practice, which states a first-of-campaign
      positive with no cell count and no multiplicity statement anywhere in EV-ALPF-001 or the individual
      analyses. No competing estimate of the ALPF grid's effective size exists in the repository.
      The underlying-problem incumbent, Pollard rho at roughly sqrt(n) group operations, is untouched.
    hidden_overhead: 'The human cost is entirely in verdict extraction from prose-and-table analyses
      written by a different harness, and it is easy to underestimate; the two-pass control exists
      because a single pass would look clean and be wrong. Lower-order term: deciding whether INCONCLUSIVE
      cells count as screened moves the headline number more than any statistical choice in the entry.'
  dominated_by: 'n/a (no result claimed on any attack frontier). Pareto check performed across time,
    memory and data/queries: this entry produces no attack point and no algorithmic artifact, so no
    frontier row applies. Against the incumbent reporting practice it dominates on information at
    essentially zero compute cost, and is dominated by it only on human effort.'
  sota_delta: 'No attack; measurement and reporting-discipline contribution only. Quantitatively:
    the incumbent states zero cell counts and zero multiplicity statements; this yields a raw count,
    per-factor level tabulation, a design effect over 10000 resamples, and a chance-survivor distribution
    swept over null rates from 0.01 to 0.20. Zero change to any ECDLP time or memory exponent.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the design matrix can be reconstructed for the two table-carrying
    packages: 0.9, since both tables are quoted verbatim in the imported analyses. That it can be
    reconstructed for a majority of all 32 packages: 0.4 -- EV-ALPF-001''s observation list shows
    several packages summarised in one word, and those almost certainly lack machine-readable tables.
    That the design effect exceeds 1.5: 0.65, motivated by the same five representations recurring
    at every size in the archived grid. That the entry yields a usable forward sizing table whichever
    way the numbers fall: 0.85, because both a low and a high design effect constrain future campaign
    sizing. Probability the archived positive turns out plausibly attributable to multiplicity: 0.2,
    and that is explicitly not the deliverable.'
