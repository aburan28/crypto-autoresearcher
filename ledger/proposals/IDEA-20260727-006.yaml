idea:
  id: IDEA-20260727-006
  question_id: RQ-ECDLP-002
  title: >-
    Equidistribution-resolution gap - the factor-base size at which Weil error
    terms can certify Semaev decomposition yield exceeds, for every arity, the
    largest factor base at which prime-field index calculus could beat rho
  class: measurement
  claim: >-
    For prime-field Semaev index calculus with an interval (or any
    Fourier-accessible) factor base F = {P in E(F_p) : x(P) in I}, |I| = p^beta,
    and decomposition arity m, define two exponents.
    (A) The CERTIFICATION THRESHOLD beta_cert(m) is the smallest beta at which
    the main term of the decomposition count over I^m dominates the Weil error
    term, so that the yield is a theorem rather than a heuristic. Completing the
    box indicator into additive characters and applying the Weil-Deligne bound
    to the summation hypersurface S_{m+1}(x_1,...,x_m,x(Q)) = 0 gives main term
    |I|^m/p and error O(p^{(m-1)/2} (log p)^m), so
    beta_cert(m) = (m+1)/(2m) + o(1): 3/4 at m = 2, 2/3 at m = 3, 5/8 at m = 4,
    3/5 at m = 5, decreasing to 1/2 as m -> infinity.
    (B) The ADMISSIBILITY CEILING beta_adm(m) is the largest beta at which the
    free-oracle cost floor of IDEA-20260727-003 still leaves room to beat
    matched rho; with relation count p^beta, sparse linear algebra
    p^{omega_LA beta}, and the yield constraint beta >= 1/m, the admissible
    window is nonempty only for m >= 2 omega_LA and is then centred at
    beta = 1/m, so beta_adm(m) <= 1/(2 omega_LA) and in practice
    beta_adm(m) ~ 1/m.
    CLAIM: beta_cert(m) - beta_adm(m) >= 2/5 for every m >= 5, and the gap is
    monotonically INCREASING in m, approaching 1/2. Therefore no prime-field
    Semaev index calculus at admissible parameters can have its relation yield
    certified by any bound of Weil-Deligne strength; the entire lane is, and
    with current equidistribution technology permanently remains,
    heuristic-conditional on the counting assumption. The measurement is
    falsified if measured yield at admissible beta exceeds the counting
    heuristic by a factor growing with p (which would be the first quantitative
    non-generic signal this program has produced and would require independent
    review), or if measured yield falls systematically BELOW the heuristic
    (which would tighten IDEA-20260727-003's floor and make the lane worse than
    currently modelled), or if omega_LA is measured below 1.5 so that
    beta_adm(m) rises.
  mechanism: >-
    Prime-field index calculus needs to know, for a factor base of size
    B = p^beta and arity m, the probability that a random target decomposes.
    Every cost model in this ledger - EV-IC-001's K*, IDEA-20260726-001's
    crossover, IDEA-20260727-003's floor - takes that probability from the
    counting heuristic B^m/(m! p). This record asks the prior question: at what
    parameters is that heuristic a THEOREM?
    The decomposition condition is that the Semaev summation polynomial
    S_{m+1}(x_1, ..., x_m, x(Q)) vanishes with every x_i in the interval I.
    S_{m+1} is symmetric of degree 2^{m-1} in each variable, and its zero set is
    a hypersurface V in A^m. Two facts control the count of V(F_p) inside the
    box I^m. First, if the relevant components of V are absolutely irreducible,
    Lang-Weil gives #V(F_p) = p^{m-1} + O(p^{m-3/2}), so the density of V in
    A^m is 1/p and the expected count in I^m is |I|^m/p. Second, restricting a
    variety count to a box is done by expanding the indicator of I in additive
    characters, which costs a factor (log p)^m and leaves exponential sums over
    V, each bounded by Deligne at O(p^{(m-1)/2}). The main term beats the error
    exactly when |I|^m/p >> p^{(m-1)/2}, i.e. |I| >> p^{(m+1)/(2m)}.
    That threshold is a property of the METHOD, not of the curve: square-root
    cancellation is the best any Weil-type bound gives, and no known technique
    beats it for a general hypersurface in a short box. Meanwhile, index
    calculus is only interesting when the factor base is SMALL - the relation
    count is B and the sparse solve is B^{omega_LA}, so B must sit far below
    p^{1/2}. The two requirements pull in opposite directions and, as computed
    above, never meet: at m = 5 certification needs beta >= 3/5 while
    admissibility needs beta <= 1/5, and as m grows the certification threshold
    falls only to 1/2 while admissibility falls to 0.
    This has a concrete methodological consequence for this ledger. Every
    index-calculus claim it can ever make about prime fields will be
    heuristic-conditional in the exact sense the target-result profile requires
    to be declared: the heuristic cannot be upgraded to a theorem by better
    analytic number theory of the current type, only by a genuinely new
    equidistribution technique for varieties in short boxes. That is a scoping
    result with exponent content, and it is also a positive instruction: the
    right thing to do with the heuristic is to VALIDATE it distributionally at
    the largest feasible scale, which is what the minimal test does.
    The measurement discriminates three explanations of prime-field relation
    yield at admissible parameters, which no ledger record currently separates.
    (a) MATCHES the counting heuristic within Poisson noise: the barrier stands,
    the lane is permanently conditional, and IDEA-20260727-003's floor is
    correctly parameterized.
    (b) EXCEEDS the heuristic by a factor growing in p: the summation
    hypersurface is not equidistributed in short boxes - a genuine non-generic
    structural signal, the first this program would have found, and the only
    outcome that could reopen m <= 4.
    (c) FALLS BELOW the heuristic: the Semaev variety's symmetry, reducibility,
    or singular locus removes solutions - directionally consistent with the
    arithmetic-progression yield penalty measured in EV-STR-001, which spans
    17.5x to 4128.6x across its tested cells (medians 17.5x and 214.9x at
    n = 211, 41.9x and 924.5x at n = 1009, 87.8x and 4128.6x at n = 4099, for
    m = 3 and m = 4 respectively) and which that record states grows with field
    size and superlinearly in m, and directionally consistent with the
    2.62-3.20x density penalty in DEC-20260727-009 - in which case every
    existing cost model in this ledger is optimistic and must be re-charged.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-07-27'
    corpus_paths_grepped:
      - /Volumes/Volume/git/autolab/research
      - /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006/ledger
    grep_results:
      - >-
        "character sum|Weil bound|equidistribution|Deligne|Bombieri|points in a
        box|incomplete sum" (case-insensitive) in the report corpus - 265
        occurrences across 63 files. Densest: idea_generation_20260719_batch8.md
        (28), idea_generation_20260718.md (20),
        idea_generation_20260720_batch5.md (20). batch8 read in the relevant
        sections: its analytic-number-theory arm uses the large sieve, Selberg
        weights and Bombieri-Vinogradov as SUPPLY CEILINGS on the two-large-
        prime PAIR support, i.e. on residue-class occupancy of pair sums for
        RT-1472, culminating in a parity-problem barrier. It also lists
        "Lang-Weil (point count of a variety)" among prior supply barriers for
        the same 2-LP object. Different object: pair-sum residue occupancy at a
        deck of large primes, versus the m-fold Semaev decomposition count
        inside a coordinate box. Same technology family, disclosed.
      - >-
        "sum-product|Heath-Brown|Shkredov|Konyagin|additive energy|multiplicative
        subgroup" - 228 occurrences across 75 files, with dedicated artifacts
        ec_coordinate_sumproduct_fixed_preprocessing_lead_20260715.md,
        p1447_coordinate_additive_expansion_theorem_target.md and
        experiment_contract_p1416_coordinate_additive_energy_recursive_s3_after_p1415.md.
        The multiplicative-subgroup and additive-energy factor-base variants I
        considered proposing alongside this record are therefore CORPUS
        DUPLICATES and are not proposed; recorded here as a screened rejection.
      - >-
        "error term|main term|resolution|square-root cancellation" - 3983
        occurrences across 871 files, dominated by unrelated Groebner
        solving-degree and harness files. No occurrence pairs a certification
        threshold with an admissibility ceiling, and no occurrence states the
        (m+1)/(2m) exponent.
      - >-
        In this ledger, no record contains a certification threshold, a Weil
        error term, or any statement about whether a yield heuristic is
        provable. EV-IC-001 records that "the S_rel heuristic was not directly
        measured at bits >= 16", which is the empirical half of the same gap.
    literature_verified: []
    conclusion: >-
      The analytic ingredients (Lang-Weil, Deligne, completion of incomplete
      sums) are textbook, and the external report corpus already uses the same
      family as a supply ceiling for a different object. The adaptation claimed
      is the pairing of a certification threshold with this ledger's own
      admissibility ceiling to produce an exponent gap, and the pre-registered
      three-way yield measurement that discriminates the three explanations.
      The (m+1)/(2m) computation is presented as a DERIVATION to be checked in
      the experiment's literature step, not as a verified citation; no external
      source was retrieved that states it.
  assumptions:
    - >-
      The relevant components of the Semaev hypersurface are absolutely
      irreducible over F_p for the arities tested, so Lang-Weil applies. This is
      known to fail for some specializations; the minimal test measures
      irreducibility directly rather than assuming it, and a failure is a
      reportable outcome, not a discarded run.
    - >-
      The factor base is Fourier-accessible: its indicator function has a
      character expansion with (log p)^{O(1)} effective support, which holds for
      intervals and for unions of O(1) intervals. Factor bases defined by
      arbitrary predicates are OUTSIDE the certification analysis, and this is
      stated because it is the obvious escape a referee will propose.
    - >-
      omega_LA is the empirically fitted sparse linear-algebra exponent from
      IDEA-20260727-003, not an assumed value. beta_adm(m) is computed from the
      measured omega_LA, so the two records must be run against the same
      measurement or the gap figure is not comparable.
    - >-
      Matched rho with negation at 0.886 sqrt(N) is the mandatory baseline.
    - >-
      Square-root cancellation is the best available for exponential sums over a
      general hypersurface in a short box. This is a statement about CURRENT
      technology, explicitly not an impossibility claim, and the record does not
      assert that no future technique can do better.
  predictions:
    - metric: measured_over_heuristic_yield_ratio_at_admissible_beta
      direction: different
      minimum_effect: >-
        The ratio (measured decomposition count) / (B^m / (m! p)) lies in
        [0.5, 2.0] and shows no monotone trend in p across at least four field
        sizes, with the trend slope's 95 percent interval containing zero. The
        competing outcome (b) is a ratio exceeding 2.0 and increasing with p
        across at least three consecutive sizes. The competing outcome (c) is a
        ratio below 0.5 and decreasing.
    - metric: certification_threshold_exponent_beta_cert
      direction: different
      minimum_effect: >-
        The empirically located crossover beta at which the observed deviation
        from the main term stops being dominated by the p^{(m-1)/2} scale agrees
        with the derived (m+1)/(2m) within 0.05 for m in {2, 3}, where exhaustive
        enumeration is feasible. A measured crossover more than 0.10 below the
        derivation would mean the error term is not tight and the gap must be
        recomputed - the most valuable falsification available here.
    - metric: certification_admissibility_gap
      direction: higher
      minimum_effect: >-
        beta_cert(m) - beta_adm(m) >= 0.40 for every m in {5, 6, 8, 10} using
        the measured omega_LA, and the gap is non-decreasing in m over that
        range. A gap below 0.40 at any m, or a decreasing trend, falsifies the
        headline claim.
    - metric: semaev_component_absolute_irreducibility_rate
      direction: higher
      minimum_effect: >-
        At least 95 percent of tested (curve, target) specializations of
        S_{m+1} for m in {2, 3} have an absolutely irreducible component of the
        expected dimension, verified by an explicit factorization test over a
        splitting field. A rate below 95 percent invalidates the Lang-Weil step
        and makes the derivation of beta_cert inapplicable as stated.
    - metric: fully_charged_ic_ops_over_rho_ops_at_admissible_beta
      direction: higher
      minimum_effect: >-
        Ratio >= 1.0 at every tested instance when relation collection, the
        chosen solve, and descent are charged against 0.886 sqrt(N). This is the
        standing control that prevents a yield measurement from being read as an
        attack result.
  minimal_test:
    design: >-
      (1) EXHAUSTIVE YIELD CENSUS at m = 2 and m = 3. On toy prime fields at 12,
      14, 16 and 18 bits with prime-order subgroups, fix an interval factor base
      I of size p^beta for beta on a grid {0.15, 0.20, ..., 0.80}, and count
      EXACTLY, by enumeration of all m-subsets of the factor base, the number of
      targets in the subgroup that decompose. Compare with B^m/(m! p). No
      Groebner call is required at any point: decomposition is decided by
      building the set of factor-base m-sums and testing membership by hash
      lookup, which is why this test is implementation-independent.
      (2) DEVIATION SCALING. For each beta, plot the absolute deviation
      |observed - main term| against p on log-log axes and fit its exponent;
      the derivation predicts the deviation tracks p^{(m-1)/2} (times log
      factors) below the crossover and Poisson sqrt(main term) above it.
      Locate the empirical crossover and compare with (m+1)/(2m).
      (3) ADMISSIBLE-REGIME YIELD at m = 5. At beta = 1/5 the factor base is
      small enough to enumerate C(B,5) sums only at the smallest sizes; at
      larger sizes estimate the yield by sampling at least 10^7 uniform targets
      against a precomputed sum set, reporting an upper bound where the rate is
      below the sampling floor. Report the ratio to the heuristic with Wilson
      intervals.
      (4) IRREDUCIBILITY AUDIT. For each tested specialization, factor
      S_{m+1}(x_1, ..., x_m, x_Q) over F_p and over a quadratic extension and
      report whether an absolutely irreducible component of the expected
      dimension exists.
      (5) GAP TABLE. Combine the measured omega_LA from IDEA-20260727-003 with
      the derived and measured beta_cert to tabulate beta_cert(m) - beta_adm(m)
      for m in {2, ..., 10}, with the extrapolated entries explicitly labelled
      as derivation rather than measurement.
    controls:
      - >-
        RANDOM-HYPERSURFACE NULL CONTROL - repeat stage 1 with S_{m+1} replaced
        by a random polynomial of the same multidegree. Its deviation exponent
        must match the Semaev one; a discrepancy is the signature that the
        Semaev variety is NOT behaving like a random hypersurface and is the
        strongest form of outcome (b).
      - >-
        UNIFORM-RANDOM FACTOR BASE at identical B on the identical curve, i.e.
        a factor base not defined by an interval. Its yield must match the
        counting heuristic; the interval base is the one at risk of structure.
      - >-
        ARITHMETIC-PROGRESSION FACTOR BASE calibration leg, run inside
        EV-STR-001's OWN regime and NOT at the census parameters: B =
        ceil(sqrt(n)), m in {3, 4}, n in {211, 1009, 4099}, shift set
        D = {1..64}. Stage 1 of this census uses B = p^beta on a grid, which is
        a DIFFERENT factor-base convention, so EV-STR-001's figures are not a
        reproduction target at census parameters; any comparison drawn between
        this calibration leg and the p^beta grid is QUALITATIVE only and must be
        labelled as such in the run record. On this leg the harness must recover
        EV-STR-001's per-cell yield penalty within a factor 2 - medians 17.5x
        and 214.9x at n = 211, 41.9x and 924.5x at n = 1009, 87.8x and 4128.6x
        at n = 4099, for m = 3 and m = 4 respectively - and must reproduce the
        qualitative trend that record reports, namely a penalty growing with n
        at fixed m and superlinearly in m at fixed n. If the harness cannot
        recover a known penalty in the regime where that penalty was actually
        measured, its yield numbers are not trustworthy.
      - >-
        EXHAUSTIVE TRUTH CONTROL - at 12-14 bits the sampled estimator and the
        exhaustive count must agree within sampling error, validating the
        estimator used at larger sizes.
      - >-
        COLLISION ACCOUNTING CONTROL - report the number of DISTINCT reachable
        m-sums alongside the number of (unordered) m-subsets, so that the
        heuristic denominator m! is checked rather than assumed.
      - >-
        Matched Pollard rho with negation and matched BSGS with memory, in the
        same group-operation unit, on every instance.
    required_metrics:
      - exact and sampled decomposition counts per (p, beta, m)
      - heuristic main term B^m/(m! p) and the observed/heuristic ratio with
        Wilson intervals
      - fitted deviation exponent against p per beta, with fit interval
      - empirical crossover beta per m and the derived (m+1)/(2m)
      - distinct reachable m-sums versus C(B,m), per instance
      - absolute-irreducibility verdict per specialization
      - measured omega_LA (imported) and the resulting beta_adm(m)
      - gap table beta_cert(m) - beta_adm(m) for m in 2..10, derivation flagged
      - AP calibration leg - recovered penalty per (n, m) cell against the
        EV-STR-001 median for that same cell, with the ratio reported per cell
        and the convention difference stated
      - matched rho and BSGS operation counts and BSGS memory
  falsification_conditions:
    - >-
      The observed/heuristic yield ratio exceeds 2.0 and increases across at
      least three consecutive field sizes at any admissible beta - the
      equidistribution assumption fails in the favourable direction, the lane
      reopens, and independent review is mandatory before any interpretation.
    - >-
      The empirical crossover beta lies more than 0.10 below the derived
      (m+1)/(2m) at m = 2 or m = 3 - the Weil error term is not tight for this
      family and the whole gap computation must be redone.
    - >-
      The measured gap beta_cert - beta_adm falls below 0.40 at any m in
      {5, 6, 8, 10}, or decreases in m - the headline claim is false.
    - >-
      The absolute-irreducibility rate falls below 95 percent - Lang-Weil does
      not apply as assumed and beta_cert is not derivable by this route; the run
      is inconclusive on the certification question, not negative.
    - >-
      The random-hypersurface null control shows a DIFFERENT deviation exponent
      from the Semaev variety - the Semaev variety carries structure the
      analysis does not model, which is a reportable positive signal
      independently of the yield ratio.
    - >-
      The AP calibration leg, run in EV-STR-001's own regime, fails to recover
      that record's per-cell yield penalty within a factor 2 in at least 5 of
      its 6 cells - the per-cell targets being 17.5x (n = 211, m = 3), 214.9x
      (n = 211, m = 4), 41.9x (n = 1009, m = 3), 924.5x (n = 1009, m = 4),
      87.8x (n = 4099, m = 3) and 4128.6x (n = 4099, m = 4) - or fails to
      reproduce the monotone growth of the penalty in n at fixed m and its
      superlinear growth in m at fixed n. A single fixed threshold is
      deliberately NOT used here: the measured penalty spans 17.5x to 4128.6x
      across these cells, so any one number would be calibrated to a single
      cell and would be met trivially at the others. Failure means the harness
      is not measuring yield correctly, so all its numbers are VOID rather than
      negative.
  confounders:
    - >-
      At toy p the interval I is a large fraction of F_p for the higher beta
      values, so the "short box" regime is barely entered. The crossover
      location is therefore the fragile measurement; it must be fitted across at
      least four sizes and reported with an interval, never as a point.
    - >-
      Collisions among factor-base m-sums reduce the reachable target set, so
      the naive heuristic overstates yield. The bias direction is known and
      favours outcome (c); a measured ratio slightly below 1 is therefore
      expected and is NOT evidence of structure.
    - >-
      Points with x in I come in pairs (x, +-y), so the factor base has size
      about 2|I| times the fraction of x with a rational y. Whether the
      heuristic uses |I| or the true point count changes the ratio by a constant;
      the convention must be fixed before the run and reported.
    - >-
      The m! denominator assumes unordered distinct m-subsets. Repeated
      factor-base elements and the identity element must be handled explicitly
      or the ratio will be biased by an O(1) factor at small B.
    - >-
      beta_adm depends on the measured omega_LA from a different record. If the
      two are measured on different matrices the gap is not a like-for-like
      comparison; the same matrix family must be used or the dependency must be
      declared broken.
    - >-
      The (m+1)/(2m) exponent is a DERIVATION made in this record and was not
      retrieved from any source. It must be independently re-derived by the
      reviewer before the gap table is treated as more than a working model.
    - >-
      EV-STR-001's factor-base convention (x-interval FB at B = ceil(sqrt(n)),
      D = {1..64}, m in {3, 4}, n <= 4139) is not this census's convention
      (B = p^beta on a grid, m in {2, 3, 5}), and that record's own boundaries
      state it closes only its tested scope. Its penalty figures calibrate the
      harness inside its own regime only; treating them as a cross-convention
      reproduction target would be a category error and would manufacture a
      false calibration failure. The penalty is also strongly cell-dependent
      (17.5x to 4128.6x), so quoting any single cell as characteristic
      understates the effect by up to two orders of magnitude.
  interpretation_limits:
    - >-
      A confirmation is a statement about what CURRENT equidistribution
      technology can certify. It is not a proof that the yield heuristic is
      true, not a proof that it is false, and emphatically not a lower bound on
      ECDLP.
    - >-
      The measurement is toy-scale (12-18 bits exhaustive, up to about 32 bits
      sampled). The distributional agreement it can establish is toy-scale
      validation of the heuristic and must never be presented as crypto-scale
      validation. The gap table at m >= 5 and crypto-sized p is a derivation.
    - >-
      Outcome (b) - yield above heuristic and growing - would be a signal about
      the Semaev variety, not an attack. It would still have to clear
      IDEA-20260727-003's free-oracle floor and the fully charged comparison
      before it changed any ECDLP claim.
    - >-
      Nothing here bears on binary or extension fields, where the summation
      polynomial system behaves differently and where published subexponential
      results exist.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Box equidistribution of the summation hypersurface.) Let V be the
        F_p-variety S_{m+1}(x_1, ..., x_m, x(Q)) = 0 in A^m and let I be an
        interval of length p^beta. Then
        #(V(F_p) ∩ I^m) = |I|^m / p + O(p^{(m-1)/2} (log p)^m),
        i.e. V's points are equidistributed in boxes to the square-root scale,
        exactly as for a uniformly random subset of A^m(F_p) of density 1/p.
      rigorous_support: >-
        The main term is RIGOROUS given absolute irreducibility: Lang-Weil gives
        #V(F_p) = p^{m-1} + O(p^{m-3/2}). The error term is the standard
        completion of an incomplete sum: expanding the indicator of I in
        additive characters costs (log p)^m and leaves complete exponential sums
        over V, each bounded by Deligne's O(p^{(m-1)/2}). The classical
        distribution statement being imitated is that a random density-1/p
        subset of a box of volume |I|^m has Binomial(|I|^m, 1/p) points, whose
        fluctuation is sqrt(|I|^m/p) - so H1 asserts the arithmetic count sits
        between the Weil scale and the Poisson scale in the standard way.
      validation_plan: >-
        Sampled quantity: #(V(F_p) ∩ I^m) for m in {2, 3}. Shortcut making
        sampling feasible at meaningful size: the count is computed WITHOUT any
        Groebner basis by enumerating factor-base m-sums and hashing, so the
        measurement is O(B^m) rather than O(Groebner), which puts 12-18 bit
        fields with beta up to 0.8 inside budget. Comparison distribution: the
        empirical distribution of (observed - |I|^m/p) / sqrt(|I|^m/p) is
        compared against the standard normal (the Poisson/Binomial regime) above
        the crossover, and against the p^{(m-1)/2} scale below it; the crossover
        location is the fitted quantity compared against (m+1)/(2m). Tail
        consistency check: the largest single-instance deviation over the whole
        census, compared against the Gumbel prediction for the maximum of the
        corresponding number of standardized normals - a deviation exceeding the
        predicted maximum is the signature of outcome (b). LABEL: TOY-SCALE.
    - id: H2
      statement: >-
        (Independence of decomposition across targets.) For a fixed factor base
        of size B and arity m, the events "target T decomposes" for distinct
        random targets T are pairwise independent up to O(B^m/p) correlation, so
        the number of decomposable targets in a sample of size s is
        Binomial(s, B^m/(m! p)) up to that correction.
      rigorous_support: >-
        The rigorous content is the counting bound: the set of reachable m-sums
        has at most C(B, m) elements, so the decomposition probability is at
        most C(B,m)/N, with equality iff all m-sums are distinct. The classical
        distribution statement imitated is the balls-in-bins / occupancy model:
        C(B,m) balls thrown into N bins produce a distinct-image count
        N(1 - exp(-C(B,m)/N)), and the deviation from C(B,m) is the standard
        birthday correction.
      validation_plan: >-
        Sampled quantity: the number of DISTINCT reachable m-sums versus
        C(B, m), and the empirical decomposition rate over 10^7 uniform targets.
        Shortcut: both are hash-set computations on the group, requiring no
        algebraic solver and no discrete logarithm. Comparison distribution:
        distinct-count against the occupancy prediction
        N(1 - exp(-C(B,m)/N)); decomposition rate against Binomial with Wilson
        intervals. Tail consistency check: the most-collided sum bucket versus
        the maximum-load prediction for the occupancy model. LABEL: TOY-SCALE at
        12-18 bits exhaustive; SAMPLED with reported upper bounds beyond.
    - id: H3
      statement: >-
        (Genericity of the specialization.) For a random curve and a random
        target Q, the specialized polynomial S_{m+1}(x_1,...,x_m,x(Q)) has an
        absolutely irreducible component of dimension m-1 with probability
        1 - O(1/p).
      rigorous_support: >-
        Absolute irreducibility of the generic summation polynomial is classical
        for small m; the assumption here is only that a random SPECIALIZATION
        inherits it, which is the standard Bertini/Noether specialization
        heuristic. The classical distribution statement imitated is the Noether
        irreducibility theorem's quantitative form: the locus of bad
        specializations is a proper closed subvariety, hence of density O(1/p).
      validation_plan: >-
        Sampled quantity: an explicit absolute-irreducibility verdict per
        specialization, obtained by factoring over F_p and over F_{p^2} and
        comparing component counts. Shortcut: multivariate factorization over
        small prime fields at m in {2, 3} is polynomial time and directly
        feasible, so no correspondence trick is required. Comparison
        distribution: the observed bad-specialization rate against the O(1/p)
        prediction, across four field sizes. Tail check: if any bad
        specialization is found, report the target's x-coordinate and test
        whether bad specializations concentrate on a computable subvariety -
        concentration would itself be a structural finding. LABEL: TOY-SCALE.
  target_complexity:
    time_exponent: >-
      This is a measurement and a barrier, not an algorithm; it claims no
      improvement. The exponents it certifies are the two thresholds:
      beta_cert(m) = (m+1)/(2m) and beta_adm(m) ~ min(1/m, 1/(2 omega_LA)),
      with the assertion beta_cert - beta_adm >= 2/5 for m >= 5 and increasing
      in m. The downstream index-calculus exponent, if the yield heuristic is
      granted, is max(beta, omega_LA beta, descent) which
      IDEA-20260727-003 already shows exceeds 1/2 for m <= 4.
    memory_exponent: >-
      The measurement itself needs memory Theta(B^m) at the exhaustive sizes
      (the hash set of reachable m-sums), which is the binding budget constraint
      and is why the exhaustive stage stops at 18 bits and m = 3. The
      index-calculus lane it measures needs memory Theta(B) = Theta(p^beta) for
      the sparse relation matrix.
    best_known: >-
      0.886 sqrt(N) group operations with N^{o(1)} memory for matched rho; no
      published prime-field index calculus beats it, and the external report
      corpus's EXP-020 solve gate measured an m = 3 end-to-end decomposition
      cost exponent of about n^{0.89} against rho's n^{0.5}, with the ratio
      growing from 21.5 to 205.7 across sizes.
    hidden_overhead: >-
      No o(1) is claimed because no improvement is claimed. The honest
      disclosures: the (log p)^m completion factor is genuinely large at the
      arities of interest (m = 5 gives (log p)^5, roughly 2^{45} at 512-bit p)
      and is absorbed into the o(1) of beta_cert - at crypto scale this makes
      the certification threshold WORSE than stated, so the derived gap is
      conservative. The Lang-Weil implied constant depends on the degree
      2^{m-1}, which grows exponentially in m; this too worsens beta_cert and is
      not modelled.
    tradeoff_note: >-
      Not a time-memory-tradeoff record. The relevant frontier remains
      S T^2 = Omegatilde(N) (Corrigan-Gibbs-Kogan), against which
      DEC-20260727-008 already found K* infinite at all 34 instances; a yield
      measurement cannot move that frontier and must not be reported as if it
      could.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
