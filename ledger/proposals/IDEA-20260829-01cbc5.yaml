  assumptions:
  - >-
    THE 31 BASE POINTS ARE AN EXTERNAL INPUT. They were published by a third
    party and this program certified their joint independence; it did not find
    them and does not claim them. Every statement built on them is RELATIVE and
    must be reported as "external 31, plus k certified here", never as a rank
    result of this program. The same discipline EV-ECRANK-b6c9b6 applied to its
    degree-2 rung binds here.
  - >-
    The model conversion from [1,1,1,a4,a6] to short Weierstrass form is exact
    and is itself a proof obligation: the isomorphism must be exhibited and every
    base point transported and re-verified on the converted model before any
    twist is formed. This is the exact failure mode EV-ECRANK-b6c9b6 records as
    having occurred once, when coset representative cancellation put 16 points on
    an isomorphic but different model.
  - >-
    Rank statements are LOWER bounds from exhibited points only. No analytic
    rank, no Selmer bound, no BSD, no GRH - consistent with
    RQ-ECRANK-27dcc5 constraint 1 and with the frozen baseline's own
    claim_boundary.

  proof_search_map:
    bottleneck: >-
      The 2^k - 1 - k PRODUCT classes. Generator classes are free by the identity;
      the base rank is free by an external input already certified; the degree is
      free by square-root tests. Every unfilled slot in the ladder is a product
      class, and the step whose removal changes the answer is "exhibit a point on
      E^(d_S) for a product class d_S of a hundred-digit base curve".
    baseline_embedding:
      parameter_slice: >-
        k = 0, V trivial, K = Q. The construction returns exactly the external 31
        and adds nothing. That is the exact old-method boundary and it is a
        regression fixture.
      reproduction_check: >-
        Frozen and run FIRST. Re-run the committed certifier on the 31 base
        points after the model conversion and require exactly 31, matching
        RUN-ECQ-f5af06-v2-A-certify. If model conversion changes the certified
        number in either direction the conversion is wrong and everything
        downstream is unreadable. Second fixture: reproduce the committed
        degree-2 rung on the Alpoge-Howell curve at x0 = 0 and require exactly
        one added class.
    observation_collision:
      observable: >-
        The square class [f(x_0)] in Q*/(Q*)^2, together with the boolean "this
        class carries an exhibited non-torsion point".
      distinct_preimage_search: >-
        COLLISIONS ARE THE CENTRAL BOOKKEEPING RISK AND THEY ARE CHEAP TO DETECT.
        Distinct x_0 frequently give the SAME class - f(x_0) and f(x_1) collide
        exactly when f(x_0)f(x_1) is a square - so a naive count of x_0 values
        wildly overstates the number of classes filled and would inflate the
        certified rank. Every pair is screened by one integer square-root test,
        and more strongly, the whole generating set is screened by the 2^k - 1
        subproduct tests, which catch not only pairwise equality but every
        multiplicative dependence. A second collision, in the opposite direction:
        a product class d_S may coincide with a generator class d_i, in which
        case the ladder has fewer distinct classes than 2^k and the degree is
        smaller than claimed - caught by the same tests.
    quantifier_order: >-
      EXISTS x_1..x_k in Q such that FOR ALL nonempty subsets S of {1..k}, the
      integer prod_{i in S} f(x_i) is NOT a rational square; AND FOR ALL i, the
      exhibited point (d_i x_i, d_i^2) on E^(d_i) is non-torsion. Both universals
      are over finite explicit lists and are discharged by direct exact check.
      The base term is a separate, already-discharged existential over an
      EXTERNAL input. Nothing is quantified over an infinite family and the
      certified statement therefore needs no heuristic at all - the heuristics
      below govern only the YIELD measurement, never the certificate.
    method_ceiling:
      strongest_certifiable_claim: >-
        rank E(K) >= r_0 + (number of classes of V carrying an exhibited
        non-torsion point) <= r_0 + 2^k - 1, where r_0 is the base rank over Q.
        With only forced points the ceiling is r_0 + k, i.e. r_0 + log_2 [K - Q]:
        the field degree must DOUBLE for each additional unit of rank. The method
        says nothing about rank over Q, nothing about exactness, and cannot
        exceed r_0 + 2^k - 1 by any tuning.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion must fail is a base
        curve of rank 0 with the identical construction: the ladder must then
        return exactly k, not more, at degree 2^k. Running it on a rank-0 curve
        of small conductor is the pipeline's proves-too-much control, and a
        pipeline that reports more than k there is manufacturing rank from the
        forced points alone. The second nearby object is the SAME construction on
        a conductor-53 curve, where the committed dense rungs say the yield
        should be near 1 - if the pipeline cannot reproduce a high yield THERE it
        has no standing to report a low yield on the record curve.
    proof_obligations:
    - claim: the short-Weierstrass conversion is an isomorphism and every transported point re-verifies
      responsibility: correctness
    - claim: each forced point satisfies its twist equation in exact rational arithmetic
      responsibility: correctness
    - claim: each forced point is non-torsion by an exhibited Mazur check
      responsibility: correctness
    - claim: no nonempty subproduct of the d_i is a square, by exhibited integer square-root tests
      responsibility: interface
    - claim: the base rank is external and is reported as external everywhere
      responsibility: scope
    - claim: the yield figures carry the frozen search box and the denominator that defines them
      responsibility: strictness

  predictions:
  - id: P1
    metric: >-
      certified rank over a degree-2 field with a witness containing zero
      floating-point operations, base ICARM no. 302
    direction: increase over the committed degree-2 rung of 31
    minimum_effect: >-
      at least 32, with the entire witness - 31 base points, one forced twist
      point, the non-square test, the Mazur check - verified by an implementation
      that did not produce it, in under 60 s. Anything below 32 means the
      composition failed and the failure is in the model conversion or the
      eigenspace bookkeeping, not in the mathematics.
  - id: P2
    metric: >-
      product-class yield y(H) = (number of non-generator classes of V carrying
      an exhibited non-torsion point) / (2^k - 1 - k), at k = 3, measured on base
      curves spanning log_10 of the largest coefficient from about 2 to about 100
    direction: >-
      decrease monotonically with log H
    minimum_effect: >-
      y above 0.7 at log_10 H <= 6 and y below 0.15 at log_10 H >= 60, i.e. a
      drop of at least 0.55 across the range, with the search box frozen and
      identical across bases. A flat y falsifies the height-law mechanism and
      would mean dense ladders are available on record curves - the outcome most
      valuable to be wrong about, since it would put rank about 46 at degree 32
      within reach.
  - id: P3
    metric: >-
      the ladder exponent theta in (certified rank - base rank) = Theta(D^theta)
      for the record-size base, fitted over k = 1..5
    direction: >-
      theta indistinguishable from 0 (logarithmic ladder), against theta near 1
      (linear, dense ladder) for the conductor-53 base
    minimum_effect: >-
      fitted theta below 0.25 for the record base and above 0.75 for the
      small-conductor base, with non-overlapping intervals. Overlapping intervals
      mean the two regimes are not separated by this design and the measurement
      is inconclusive rather than negative.
  - id: P4
    metric: >-
      smallest canonical height of any exhibited point on a positive-rank
      quadratic twist, regressed on log of the base curve's minimal discriminant
    direction: increase
    minimum_effect: >-
      a positive fitted slope with a 95 percent interval excluding 0, and a slope
      of at least 0.05 in units of canonical height per unit of log|Delta|. This
      is the MECHANISM behind P2; if P2 holds but P4's slope is zero, the yield
      collapse has a different cause and the stated mechanism is wrong even
      though the prediction held.

  minimal_test:
    design: >-
      PART A, hours, no search. Convert ICARM no. 302 to short Weierstrass form,
      transport and re-verify the 31 base points, re-run the certifier and
      require exactly 31. Choose x_0 = 0 and, if f(0) = B is a square or zero,
      the smallest |x_0| for which f(x_0) is a non-square. Exhibit d = f(x_0),
      the point (d x_0, d^2), the exact substitution, the non-square integer
      square-root test, and the Mazur non-torsion check. Emit a single JSON
      witness and verify it with a second implementation. Deliverable: a
      float-free rank >= 32 over a degree-2 field, reported as external 31 plus 1
      certified here. Extend to k = 2..5 with the subproduct square-root tests
      and report rank >= 31 + k at degree 2^k.
      PART B, the research half. Freeze a search box for product classes: for a
      target class d_S, search x in a frozen interval and y bounded so that the
      naive height of any accepted point is at most a frozen bound, using the
      committed exact on-curve check and Mazur check only - NO descent anywhere.
      Freeze a base-curve ladder spanning coefficient size: the conductor-53
      curve of EV-ECRANK-b6c9b6, a mid-range curve from the 137 certified fibres,
      the rank-12 pencil curve (a6 about 1.4e26), a rank-13 Mestre pool curve (a4
      about 1e19), and ICARM no. 302 (a6 about 1e100). For each base and each of
      at least 30 randomly drawn generator triples (x_1, x_2, x_3), form the four
      product classes and record whether the frozen box yields a point. Report
      y(H) with its denominator, the fitted theta per base, and the
      smallest-point heights for P4.
    controls:
    - >-
      REGRESSION on the 31 base points after model conversion. Exactly 31; more
      or fewer is a stop condition.
    - >-
      REGRESSION on the committed degree-2 rung of the Alpoge-Howell curve at
      x0 = 0. Exactly one added class.
    - >-
      NULL OBJECT - rank-0 base curve of small conductor, same construction. The
      ladder must return exactly k at degree 2^k and never more. A pipeline that
      manufactures rank from forced points alone fails here.
    - >-
      HIGH-YIELD POSITIVE CONTROL - the conductor-53 curve, where the committed
      record says 32 of 32 and 64 of 64 classes carry points. The frozen box must
      reproduce a high yield there before a low yield anywhere else is reported.
    - >-
      DEGENERACY CONTROL - deliberately supply x_1, x_2 with f(x_1)f(x_2) a
      square and require the subproduct test to reject the pair. A degree claim
      that survives this control is not a degree claim.
    - >-
      MATCHED BOX. The product-class search box is IDENTICAL across all bases in
      absolute terms. A box that scales with the curve would confound the yield
      with the search effort, which is the entire measurement.
    required_metrics:
    - certified rank and field degree per rung, with the count of floating-point operations (target 0)
    - product-class yield y with numerator and denominator, per base, per k
    - fitted theta per base, with interval
    - smallest exhibited point height per positive twist, and log|Delta| of the base
    - wall clock and peak RSS for the whole witness verification
    - count of degenerate generator sets rejected by the subproduct tests

  falsification_conditions:
  - >-
    Model conversion changes the certified base count away from 31. Stop
    condition; nothing downstream may be read.
  - >-
    P1 fails: the degree-2 witness is not accepted at 32 by an independent
    implementation. Since every step is a finite exact check, this can only be an
    implementation or bookkeeping error, and the failure is `invalid_measurement`
    per docs/claims-and-verification.md, NOT a mathematical negative.
  - >-
    P2 fails flat: the yield does not fall with log H beyond the stated effect.
    Then the height-law mechanism is wrong, dense ladders are available on
    record-size curves, and the correct next move is to build one - a
    falsification that opens a better lane than the prediction it kills.
  - >-
    P2 fails downward at the positive control: the frozen box cannot reproduce a
    high yield even on the conductor-53 curve where the committed record reports
    32 of 32. Then the box is too small and every yield number is a statement
    about the box, not about the curves.
  - >-
    P4's slope interval contains 0 while P2 holds. The prediction survives with
    its stated mechanism refuted, and the record must say so rather than keeping
    the mechanism because the number came out right.

  confounders:
  - >-
    SEARCH-BOX CONFOUND, the dominant one. Yield is a joint measurement of the
    curves and the box. A box frozen in absolute terms disadvantages large curves
    by construction - which is the hypothesis - so the design cannot distinguish
    "large curves have no small points" from "the box was too small for large
    curves" without the height regression P4. P4 is therefore not optional
    decoration; it is what converts the yield curve from an artefact into a
    mechanism.
  - >-
    SQUARE-CLASS COLLISION inflating the class count. Screened by the subproduct
    tests, listed here because it is the cheapest route to a spurious rank.
  - >-
    MODEL-CONVERSION CONTAMINATION. Transporting 31 points across a model change
    at 100-digit coefficients is exactly the operation that already failed once
    in this program. Every transported point is re-verified on the target model
    and the count of off-curve points is a required metric with target 0.
  - >-
    THE BASE RANK IS EXTERNAL. Any drift in the third-party record - a
    correction, a withdrawal, a different point list - changes the base term.
    The frozen snapshot with its recorded response_sha256 is the input of record
    and later board changes are reported against it, never absorbed into it, per
    the goal record's own live_board_policy.

  interpretation_limits:
  - >-
    NOTHING HERE IS A CLAIM ABOUT RANK OVER Q, AND THE HEADLINE IS RELATIVE. The
    32 at degree 2 is an external 31 plus 1 certified here. This program did not
    find the 31 points, does not claim them, and re-verified only their joint
    independence. Rank >= 31 over Q is a live external claim and is not this
    program's to restate as its own result.
  - >-
    Over a quadratic field, high rank is not surprising and unbounded rank over
    number fields is classical. The content is entirely the WITNESS and the
    DEGREE - a rank-32 statement checkable in integer arithmetic in under a
    minute at degree 2 - and not the existence of such a curve.
  - >-
    Every number is a LOWER bound. Nothing here bounds any rank above, and the
    programme's constraint forbidding Selmer upper bounds is respected
    throughout.
  - >-
    The yield and theta figures are scoped to the frozen box, the frozen base
    ladder, and the drawn generator triples, with denominators reported. They
    transfer to no other family and are not a law.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      Let f be the cubic of the base curve and let x_0 range over rationals of
      bounded numerator and denominator. Then the square classes [f(x_0)] in
      Q*/(Q*)^2 are modelled as behaving like the square classes of independent
      random integers of size |f(x_0)|; in particular, among M values of x_0 the
      number of DISTINCT square classes is M(1 + o(1)), and the probability that
      a given nonempty subproduct of k such classes is a square is O(2^{-c*log
      H}) - negligible - so a random generating set is multiplicatively
      independent with probability tending to 1.
    rigorous_support: >-
      PROVEN BOUND FIXING THE QUANTITY: Hooley's theorem that an irreducible
      cubic polynomial takes squarefree values with positive density - so f(x_0)
      is squarefree, hence equal to its own squarefree kernel, for a positive
      proportion of x_0, which fixes the size of the class representative at
      about |f(x_0)| itself rather than at an unknown divisor. Additionally
      PROVEN and load-bearing for the CERTIFICATE rather than the heuristic: no
      heuristic is needed to VERIFY independence, because the subproduct
      square-root tests decide it exactly; HA-1 governs only how many x_0 must be
      tried before an independent set is found. CLASSICAL DISTRIBUTION THEOREM
      IMITATED: the density 6/pi^2 of squarefree integers, and the classical
      count of square values of a polynomial, which is O(sqrt(M)) and hence
      negligible among M candidates.
    validation_plan: >-
      SAMPLE: for each base curve in the frozen ladder, enumerate f(x_0) for all
      integer x_0 with |x_0| <= 10^4 (about 20,000 values per base, 5 bases) and
      for a matched set of rational x_0 = p/q with |p| <= 200, q <= 20. SCALE:
      about 10^5 exact evaluations plus O(M^2) pairwise square-root tests done by
      hashing squarefree kernels where factorisation is feasible and by direct
      pairwise integer square-root tests where it is not. PREDICTED DISTRIBUTION:
      the observed number of distinct classes against M, and the observed
      squarefree fraction against 6/pi^2 adjusted for the fixed local obstructions
      of f. TAIL CHECKS: the largest observed collision class (how many x_0 share
      one class) against the prediction of O(1); a class shared by more than 10
      values of x_0 in a sample of 20,000 indicates a structural factorisation of
      f that must be reported. TRANSFER ASSUMPTION RECORDED: this is measured on
      the specific f of each base curve and is not claimed for other cubics.
  - id: HA-2
    statement: >-
      For a quadratic twist E^(d) of positive rank, the canonical height of the
      smallest non-torsion rational point is modelled as growing linearly in
      log|Delta(E^(d))|, hence linearly in log H of the base curve at fixed d, so
      the probability that a frozen naive-height box of size B contains a point
      on a positive-rank product-class twist decays like exp(-c*(log H - log B))
      for a positive constant c.
    rigorous_support: >-
      PROVEN BOUND FIXING THE QUANTITY: unconditional Lang-Silverman-type lower
      bounds for the canonical height of a non-torsion point in terms of the
      discriminant exist for curves with integral j-invariant, and the
      Hindry-Silverman bound gives the general statement conditional on Szpiro -
      so the DIRECTION of the law is proven in a nontrivial case and conjectural
      in general, and that split is declared here rather than smoothed over.
      CLASSICAL DISTRIBUTION THEOREM IMITATED: the Birch-Swinnerton-Dyer-flavoured
      prediction that the regulator of a rank-1 curve grows with the conductor at
      fixed L-value, the same shape of prediction this program has already used
      and measured elsewhere for the Mestre-Nagao per-rank shift.
      OBSTRUCTION DECLARED: the unconditional half applies only to integral
      j-invariant, so on a general record curve the rigorous support is weaker
      than the exemplar's and this is the heuristic most likely to be attacked.
    validation_plan: >-
      SAMPLE: every positive-rank twist encountered in Part B, plus the 137
      certified fibres of certified_curves.json and the rank >= 1 members of the
      1,206-curve pool, giving several hundred (smallest point height,
      log|Delta|) pairs across six orders of magnitude of discriminant. SCALE:
      no new descent needed - the point sets are committed. PREDICTED
      DISTRIBUTION: a linear fit of smallest canonical height against
      log|Delta| with a positive slope, compared against the modelled linear law;
      residuals checked for heteroscedasticity, since the model predicts
      increasing spread. TAIL CHECKS: the largest positive residual - a curve of
      huge discriminant with an unusually small point - is examined individually,
      because a cluster of such curves would be the constructive route to a dense
      ladder on large curves and is worth more than the fit.

  heuristic_assumptions_note: >-
    NO CERTIFIED RANK DEPENDS ON EITHER HEURISTIC. The degree-2 rank >= 32
    statement, and every rank >= 31 + k statement, is a finite exact check:
    substitution, integer square roots, twelve point multiplications. HA-1 and
    HA-2 govern only how many candidates must be tried and how the yield behaves,
    i.e. predictions P2, P3, P4 and nothing else. This is deliberate and is the
    reason the design puts the certificate on the forced-point identity rather
    than on a search.

  target_complexity:
    time_exponent: >-
      CERTIFICATE VERIFICATION, which is what this question measures: O(r_0^2 *
      |S| * M(log p)) for the base independence check (measured anchor 1.831 s at
      r_0 = 31, |S| = 45), plus O(k * (log H)^2) for the k forced points and
      their Mazur checks, plus O(2^k * M(k log H)) for the subproduct integer
      square-root tests. At k = 5 and log_10 H = 100 the square-root tests are 31
      integer square roots on 500-digit numbers - microseconds. TOTAL predicted
      under 60 s for any rung, polynomial in every input including log H.
      LADDER GROWTH, the quantity that matters for the question: certified rank
      minus base rank is k = log_2 D with forced points only, against 2^k - 1 =
      D - 1 if every class fills. The exponent theta in D^theta is 0 versus 1 and
      P3 measures which regime a record-size base is in.
      BEST KNOWN for a dense ladder: the committed 64 of 64 at degree 64 on a
      small-conductor curve, i.e. theta = 1 is ACHIEVED in this repository - on a
      curve of conductor about 53. Nothing achieves theta > 0 on a record-size
      base and that is the gap.
    memory_exponent: >-
      O(r_0 * log H + 2^k * k * log H) bits for the witness - at r_0 = 31, k = 5,
      log_10 H = 100 that is a file of order 10^4 to 10^5 bytes. Verifier working
      memory O(r_0 * |S|) bits for the F_l matrix plus O(k log H) for the
      integers, i.e. kilobytes. Measured anchor: peak RSS 23.2 MB for the whole
      Python process. Memory is not binding anywhere and this is stated rather
      than left to inference.
    best_known: >-
      Committed frontier rows at each degree: D = 2, R = 31 relative and
      regulator-assisted (EV-ECRANK-b6c9b6); D = 32, R = 32 float-free; D = 64,
      R = 64 float-free; D = 64, R = 68 regulator-assisted. Over Q, D = 1,
      R = 31 as a float-free confirmation of an external curve. Externally, high
      rank over number fields is classical and unbounded, so the external
      baseline for EXISTENCE is trivially better and the comparison that means
      anything is on the witness, not the existence.
    hidden_overhead: >-
      DISCLOSED. (i) The base term r_0 = 31 is EXTERNAL and its cost is not this
      program's; a from-scratch route to r_0 = 31 costs the world record, and
      RUN-ECQ-f5af06-v2-B-extension exhausted an 8-decimal-digit x-coordinate box
      at 95,899,629 of 95,899,629 with 0 rank-increasing hits while the actual
      generators have 33-digit x-numerators, about 25 orders of magnitude outside
      it. The ladder inherits that gap and must never present it as closed. (ii)
      The subproduct tests are 2^k - 1 and therefore exponential in k; at k <= 6
      that is at most 63 square roots and irrelevant, but the certificate size
      and the degree both being 2^k means nothing here scales past k = 6 in any
      useful sense - which coincides with RQ-ECRANK-27dcc5's own scope bound of
      k <= 6. (iii) Part B's product-class search has no bound at all; it is a
      frozen-box measurement, not an algorithm, and its negative results are
      scoped to the box.
    tradeoff_note: >-
      THE TRADEOFF IS RANK AGAINST FIELD DEGREE AND IT IS THE QUESTION ITSELF.
      Forced points buy +1 rank per DOUBLING of the degree. Dense filling buys
      +1 rank per unit of degree but requires a point on every product class,
      which the height law says is unaffordable on large curves. So the frontier
      has two regimes and the design measures where the crossover sits as a
      function of log H. PARALLELIZATION: irrelevant - the certificate is
      seconds; Part B's box search is embarrassingly parallel and its cost is
      chosen by the box, not by the problem.

  dominated_by: >-
    CHECKED ROW BY ROW; `null` is not asserted. ROW 1 - EV-ECRANK-b6c9b6 D = 2,
    R = 31, relative and regulator-assisted: this proposal STRICTLY DOMINATES it
    - same degree, rank 32 > 31, and float-free where that row has a 30x30
    numerical regulator. This is the one row it beats outright. ROW 2 - D = 32,
    R = 32 float-free: ties on rank at sixteen times the degree, so this proposal
    dominates on degree; the committed row dominates on nothing. ROW 3 - D = 64,
    R = 64 float-free: DOMINATES this proposal on rank (64 > 32 and > 31 + 5);
    not dominated on degree. ROW 4 - D = 16, R = 32 regulator-assisted: ties on
    rank at eight times the degree; dominated by this proposal. ROW 5 - D = 32,
    R = 52 and D = 64, R = 68, regulator-assisted: both DOMINATE on rank. ROW 6 -
    RUN-ECQ-f5af06-v2-A-certify, D = 1, R = 31 float-free: DOMINATES on degree
    and ties strength; it is beaten only by +1 of rank, and that +1 is the whole
    of this proposal's certified contribution. ROW 7 - EV-ECQ-0d142e, D = 1,
    R = 12 exact and from scratch: dominated on rank, dominates on degree and on
    provenance, since its 12 is this program's own and the 31 here is not. ROW 8
    - the external world record rank >= 31 over Q: dominates on degree and is not
    this program's. HONEST SUMMARY: this proposal is dominated on RANK by rows 3
    and 5 and on DEGREE by rows 6, 7 and 8; it strictly dominates row 1 and row 4
    and produces the repository's first float-free rung below degree 16. The
    genuinely non-dominated deliverable is Part B's yield law, which no row
    contains.
  sota_delta: >-
    QUANTITATIVELY. (i) Degree-2 rung: 31 to 32 certified rank, and the witness's
    floating-point operation count goes from a 30x30 regulator at 80 and 150
    digits to ZERO. (ii) Smallest field degree carrying a float-free rung: 32
    today, 2 after this work - a factor of 16 on the axis
    RQ-ECRANK-27dcc5 names in its title. (iii) Witness verification time for the
    best float-free rung: the committed degree-32 and degree-64 eigenspace
    certificates have no published verification time; this rung targets under
    60 s with a published number. (iv) Degree certification without
    factorisation: currently noted as an observation for one 98-digit class,
    after this work a general k-class procedure with 2^k - 1 exhibited tests.
    (v) The yield law y(H) and the exponent theta: UNMEASURED anywhere; after
    this work a curve over six orders of magnitude of coefficient size with
    denominators. ZERO delta on rank over Q, where this program's own certified
    maximum from scratch remains 12 exact and 13 as a lower bound.

  estimated_cost:
    compute: >-
      Part A: minutes. Model conversion, 31 point transports, one certifier run
      (anchor 1.831 s), k forced points, at most 63 integer square roots. Part B:
      about 20 CPU-hours, dominated by the frozen-box product-class search across
      5 bases x 30 generator triples x 4 product classes = 600 searches, each a
      bounded enumeration with an exact on-curve test and no descent. Memory
      under 1 GB throughout.
    wall_clock_seconds_estimate: 75000
    human_or_agent_effort: >-
      One Executor task for Parts A and B; one Validator task to re-verify the
      Part A witness with an implementation that did not produce it and to run
      the null-object and positive-control arms. Part A alone is a
      half-day task and delivers the Pareto move; Part B is the research half and
      can be dispatched separately.
    inputs_required: >-
      All committed: the frozen ICARM-302 baseline with its recorded
      response_sha256; RUN-ECQ-f5af06-v2-A-certify and the certifier at its
      recorded sha256; EV-ECRANK-b6c9b6's certificates for the regression
      fixtures; certified_curves.json and highrank_pool.json for the base ladder.
      No network access is required and none should be taken - the frozen
      snapshot is the input of record.
    risk_of_zero_information: >-
      Very low for Part A, which is a finite exact computation whose only failure
      modes are implementation errors that the controls catch. Moderate for Part
      B only in the specific sense that a badly chosen box could make every yield
      zero, which the conductor-53 positive control is designed to catch before
      any yield is reported.

  recommended_priority: high
