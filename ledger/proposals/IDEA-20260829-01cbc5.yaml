idea:
  id: IDEA-20260829-01cbc5
  question_id: RQ-ECRANK-27dcc5
  goal_id: GOAL-ECRANK-002
  goal_id_note: >-
    Named as the paused goal bound to this question. Naming is not dispatch and
    authorizes nothing; only a Coordinator decision does.
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    Push the field axis instead of the rank axis: a float-free rank >= 32 over a
    QUADRATIC field from the forced-twist-point identity, and a measurement of
    how the product-class yield collapses with base coefficient size

  class: composition

  claim: >-
    THE PART THAT IS ESSENTIALLY FREE. For E - y^2 = f(x) over Q and any rational
    x_0 with f(x_0) not zero and not a square, the twist E^(d) with d = f(x_0)
    carries the EXPLICIT rational point (d*x_0, d^2), by the one-line identity
    (d*x_0)^3 + A*d^2*(d*x_0) + B*d^3 = d^3*f(x_0) = d^4 = (d^2)^2. No search, no
    descent, no height. Combine this with the 31 points of ICARM no. 302 that
    THIS PROGRAM HAS ALREADY CERTIFIED jointly independent in exact integer
    arithmetic (RUN-ECQ-f5af06-v2-A-certify - stacked F_2 rank 31, 45 good
    primes, torsion bound 1, 1.831 s, PARI not used), and the eigenspace argument
    gives rank E(Q(sqrt d)) >= 32 over a field of DEGREE 2, with a witness that
    contains no floating-point number anywhere. Iterating with k independent
    values x_1..x_k gives rank E(K) >= 31 + k over the degree-2^k field
    K = Q(sqrt d_1, ..., sqrt d_k), and [K - Q] = 2^k is itself certified by
    2^k - 1 EXACT INTEGER SQUARE-ROOT TESTS - no factorisation of the
    hundred-digit d_i is needed, because Kummer theory needs only that no
    nonempty subproduct of the d_i is a rational square.
    THE PART THAT IS RESEARCH. That ladder grows only LOGARITHMICALLY in the
    field degree, because it fills k of the 2^k classes. The committed ladder of
    EV-ECRANK-b6c9b6 fills ALL of them - 32 of 32 at degree 32, 64 of 64 at
    degree 64 - but does so on curves of conductor 53 and similar. THE CLAIM IS
    THAT THIS DIFFERENCE IS NOT A SEARCH-EFFORT DIFFERENCE BUT A HEIGHT LAW: the
    product classes d_S = prod_{i in S} d_i, |S| >= 2, are not of the form f(x),
    so a point on them must be FOUND, and the smallest point on a positive-rank
    quadratic twist grows with the conductor, so the yield of product classes
    must collapse as the base curve's coefficients grow. Measuring that collapse
    - the yield exponent theta in (certified rank - base rank) = Theta(D^theta),
    theta = 0 for a sparse ladder and theta = 1 for a dense one, as a function of
    log H - is the deliverable, and it explains why every dense rung this program
    holds sits on a tiny curve.

  mechanism: >-
    Three ingredients compose, and each is exact.
    (1) THE FORCED POINT. Put the base curve in short Weierstrass form
    y^2 = f(x) = x^3 + Ax + B by the standard completion (recording the model
    change as a proof obligation, since ICARM no. 302 is given as
    [1, 1, 1, a4, a6]). For rational x_0 set d = f(x_0). The quadratic twist
    E^(d) - Y^2 = X^3 + A d^2 X + B d^3 - contains (d x_0, d^2). Verification is
    one exact rational substitution. Non-torsion follows from Mazur's theorem by
    checking m*P != O for m = 1..12 in exact arithmetic.
    (2) THE DEGREE CERTIFICATE WITHOUT FACTORISATION. K = Q(sqrt d_1..sqrt d_k)
    has degree 2^k exactly when d_1..d_k are independent in the F_2-vector space
    Q*/(Q*)^2, i.e. when NO nonempty subproduct prod_{i in S} d_i is a rational
    square. That is 2^k - 1 integer square-root tests on integers of size about
    k*log H bits. EV-ECRANK-b6c9b6 already noted for its degree-2 rung that the
    squarefree kernel of a 98-digit class was never computed and is not needed;
    this generalises that observation from k = 1 to all k and turns it into the
    degree half of the certificate.
    (3) THE EIGENSPACE ARGUMENT, unchanged from H-ECRANK-28dba7. G = Gal(K/Q) =
    (Z/2)^k acts on E(K) tensor Q; the image of E^(d)(Q) under
    phi_d(u,v) = (u/d, v/(d^2) * sqrt d) is a chi_d-eigenvector, so points
    attached to distinct classes lie in distinct isotypic components and are
    Z-independent by algebra alone. The 31 base points sit in the TRIVIAL
    character. Hence rank E(K) >= 31 + (number of non-identity classes of V
    carrying an exhibited non-torsion point), with no pairing, no regulator and
    no descent.
    THE TRACKED OBJECT is the SQUARE CLASS of f(x_0) in Q*/(Q*)^2 - an element of
    an infinite elementary abelian 2-group, carried through the computation
    instead of the point that produced it.

  lossy_projection_test: >-
    The projection is x_0 -> [f(x_0)] in Q*/(Q*)^2. It discards the point, the
    curve's geometry, the size of f(x_0) up to squares, and every arithmetic
    invariant except the square class - infinitely many x_0 share a class. What
    it discards is discarded COMPATIBLY with the operation that matters, because
    the operation is FORMING THE SUBGROUP V and the field it generates, and both
    depend on the d_i only through their square classes: multiplication of
    classes is the group law of Q*/(Q*)^2 and the extension degree is |V|, a
    function of the classes alone. So the retained part propagates
    deterministically through field composition, which is exactly the step the
    certificate performs. It is not a change of coordinates: the point (d x_0,
    d^2) is irrecoverable from the class, and indeed two x_0 in the same class
    give the same field but different points. PASSES.

