idea:
  id: IDEA-20260829-8cbb9b
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-e72c0b
  goal_id_note: >-
    ROUTING ONLY. Naming a goal is not a dispatch and authorizes no run. This
    record proposes an INSTRUMENT and explicitly moves no rank; GOAL-ECQ-e72c0b's
    pause conditions and completion criteria stand unchanged.

  title: >-
    Buy an unconditional upper bound by giving up base rank: a rational 2-torsion
    section replaces the class group of a cubic field with the FACTORISATION of
    two integers, and the exchange rate - Shioda-Tate ceiling units paid per
    natural-log unit of certification reach gained - has never been measured

  class: composition

  claim: >-
    This program's upper-bound instrument is PARI ellrank, and two facts about it
    are committed. FIRST, IT DIES ON SIZE: 84 of 140 attempted descents timed out
    at an 8 s alarm, 31 of 31 upper-bound descents timed out at a4 of order 1e19,
    and the censor was identified as coefficient size with Spearman +0.765
    against log of the absolute a6 (EV-ECQ-0d142e OBS-5, OBS-6, B-6, UC-3), which
    is why 60 percent of this program's excess measurements are censored and why
    UC-3 names re-descending them the highest-value unrun measurement of its
    round. SECOND, ITS UNCONDITIONALITY IS UNDER LIVE AUDIT:
    IDEA-20260829-c7472b observes that the program's single strongest claim -
    "rank EXACTLY 12" - rests on ellrank's r_high, that general 2-descent works
    in a cubic algebra whose class and unit groups PARI obtains through the bnf
    family, and that the word "unconditional" there is unaudited. THE CLAIM UNDER
    TEST IS THAT BOTH FACTS HAVE A COMMON STRUCTURAL FIX WITH A MEASURABLE PRICE.
    For a curve carrying a rational point of order 2, written y^2 = x(x^2 + a x
    + b), descent via the 2-isogeny needs only the SQUARE-CLASS GROUPS Q(S,2) and
    Q(S',2) with S the primes dividing b and S' the primes dividing a^2 - 4b,
    together with local solvability tests on explicit quartics - NO number field,
    NO class group, NO unit group, and therefore NO GRH-dependent subroutine
    anywhere. THE PRICE IS PAID IN BASE RANK: a torsion section forces reducible
    fibres, and Shioda-Tate subtracts their root-lattice contribution from the
    ceiling, so a family engineered to carry 2-torsion cannot attain the 8 that
    this program's torsion-free pencil attains. DEFINE THE EXCHANGE RATE: P =
    (max Shioda-Tate ceiling attainable with a rational 2-torsion section) minus
    (max ceiling without), in units of rank; and G = (largest log|a6| at which an
    unconditional upper bound returns within a declared alarm by the isogeny
    route) minus (the same for ellrank on matched torsion-free curves), in natural
    log units. TWO READINGS ARE PRE-DECLARED. IF P is at most 2 and G is at least
    10 - four decimal orders of magnitude of extra reach - then this program
    should build its CALIBRATION families with a rational 2-torsion point, the
    censoring that blocks every excess measurement it has ever made becomes
    curable structurally rather than by longer alarms, and the exactness claims
    become auditably GRH-free. IF P is at least 4, or G is at most 2, the
    exchange is bad, 2-torsion is not the route to un-censoring, and the correct
    conclusion is that upper bounds at record coefficient size are structurally
    unavailable to this program - which is itself a boundary the campaign has
    never stated with a number.

  mechanism: >-
    Two cost structures that look similar are in different complexity classes,
    and the difference is exactly a rational point of order 2. GENERAL 2-DESCENT
    on y^2 = f(x) with f irreducible cubic works in the algebra A = Q[x]/f(x);
    the 2-Selmer group is cut out of the S-unit group A(S,2) by local conditions,
    and computing A(S,2) requires the class group and the unit group of a cubic
    field whose discriminant is of the size of the curve's own. Obtaining those
    under GRH means a relation search over prime ideals of norm below Bach's
    bound of order log^2 of the discriminant; obtaining them unconditionally
    means searching to the Minkowski bound, of order the square root of the
    discriminant - exponential in the DIGIT COUNT rather than polynomial in it.
    That is the certifiability horizon IDEA-20260829-c7472b locates.
    DESCENT VIA A 2-ISOGENY needs no field at all. With E: y^2 = x(x^2 + ax + b)
    and E' its 2-isogenous partner y^2 = x(x^2 - 2a x + (a^2 - 4b)), the two
    Selmer groups sit inside Q(S,2) and Q(S',2) for S the primes dividing b and
    S' the primes dividing a^2 - 4b, membership is decided by local solvability
    of the explicit quartic d w^2 = d^2 u^4 + a d u^2 v^2 + b v^4 at the finitely
    many places in S and at infinity, and the resulting bound rank E(Q) at most
    dim Sel^phi + dim Sel^phihat - 2 is unconditional. THE ONLY HARD STEP IS
    FACTORING TWO INTEGERS. So the unconditional upper-bound cost moves from a
    relation search of size exponential in the digit count to a factorisation,
    plus a search of size 2^{|S|+1} over square classes that the local conditions
    prune. The exchange is not free and the mechanism says exactly where the bill
    arrives: a 2-torsion SECTION of an elliptic surface meets the fibres in a
    way that forces reducible fibres, Shioda-Tate's rank formula subtracts
    sum(m_v - 1) over those fibres, and KN-FIND-e1b836 has already measured this
    exact arithmetic on 13391 of 13391 Mestre families - every one carries a
    multiplicative fibre of type I_4 or I_6 at T = infinity, and the per-family
    ceiling is exactly 18 minus the root-lattice contribution. That census
    machinery, including the Euler check sum(deg * v_disc) = 24 = 12d, is
    committed and reusable, which is why the price P is measurable at low cost
    rather than argued from a recalled classification table.

  tracked_object:
    object: >-
      The pair (S, S') of prime supports of b and a^2 - 4b, together with the two
      F2 square-class spaces Q(S,2) and Q(S',2) and the subsets of them cut out
      by local solvability. NOT the curve, NOT the points, NOT any number field,
      NOT the Mordell-Weil group.
    lossy_projection_test: >-
      PASSES. The projection sends a curve over Q with its full arithmetic - its
      Mordell-Weil group, its heights, its conductor, its j-invariant, every
      rational point - to two finite sets of primes and two F2 subspaces of
      dimension at most |S| + 1. From that data one cannot recover the curve,
      cannot recover a point, cannot recover the rank (only bound it), and cannot
      distinguish rank r from rank r - 2 with a 2-dimensional 2-part of Sha. It
      is NOT a change of coordinates: the map from curves to prime supports is
      wildly many-to-one, and the whole non-2-primary arithmetic is annihilated.
      What is retained propagates DETERMINISTICALLY under the operations the
      pipeline performs: a quadratic twist by d replaces S by S union the primes
      of d and transforms the local conditions by an explicit character; an
      isogeny of odd degree leaves the supports unchanged; and specialisation
      within a family sends the polynomial factorisations of b(t) and
      a(t)^2 - 4b(t) to the integer factorisations at t, with the polynomial
      factors giving a guaranteed part of S in one step. That last propagation is
      what makes a FAMILY with 2-torsion cheaper to certify than a random curve
      of the same size, and it is a property of the retained data alone.
    what_the_loss_costs: >-
      The object yields an UPPER bound only. It exhibits no point, certifies no
      rank from below, and cannot separate a true rank r from r - 2 hidden by
      Sha[2]. It is a pruning and pricing instrument and may never be cited as a
      rank. It also does not exist at all for a curve with no rational 2-torsion,
      which is the case for this program's headline rank-12 curve.

  novelty_status: unverified
  novelty_note: >-
    THE MATHEMATICS IS CLASSICAL AND IS NOT CLAIMED AS NEW: descent via 2-isogeny
    and complete 2-descent for curves with rational 2-torsion are textbook, and
    the Shioda-Tate accounting for torsion sections is standard. Both are cited
    below as `recalled` with verified_by null, and no full text was read this
    session. WHAT IS NEW IS INTERNAL AND IS A MISSING MEASUREMENT. A corpus grep
    this session over ledger/proposals/, ledger/ideas/ and knowledge/findings/
    for "2-torsion", "torsion", "isogeny descent", "GRH" and "bnf" found: the
    torsion vocabulary used only for the torsion-row bookkeeping of an
    independence certificate (GOAL-ECQ-e72c0b criteria 3 and 4); the GRH exposure
    named as an OPEN AUDIT in IDEA-20260829-c7472b, filed today against a
    different research question; and NO record proposing torsion as a FAMILY
    DESIGN CHOICE, no record measuring the base-rank price of a torsion section,
    and no implementation of any descent other than a call to PARI ellrank.
    IDEA-20260829-4c61db (sibling question) proposes a surface-level
    Gillibert-Levin p-descent for an upper bound over Q(t); that is a different
    level - a bound on the FAMILY's generic rank, not on a fibre's rank over Q -
    and it is built from a paper with no located implementation, where this route
    is textbook. Classified as an adaptation and NOT as known, because the two
    numbers claimed here, the price P and the gain G, are not something this
    session verified anyone has measured for this program's objects. External
    literature was NOT searched for this specific question. `unverified` is
    required.

