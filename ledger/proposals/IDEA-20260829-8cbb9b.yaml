  assumptions:
    - >-
      A family carrying a rational 2-torsion section can be constructed over Q(t)
      inside this program's existing machinery, by taking a Weierstrass model
      y^2 = x(x^2 + a(t) x + b(t)) with a, b in Q[t] of declared degrees. This is
      a construction assumption and the design verifies non-isotriviality and
      minimality rather than assuming them.
    - >-
      Factoring b(t0) and a(t0)^2 - 4 b(t0) at the coefficient sizes tested is
      affordable within the declared alarm. This is the route's real cost and it
      is MEASURED across four size regimes in step 0, not assumed.
    - >-
      Every upper bound produced is cross-checked against PARI ellrank on every
      curve where ellrank terminates, so the implementation is validated on an
      overlap region before it is used where ellrank cannot go.

  proof_search_map:
    bottleneck: >-
      Obtaining an unconditional upper bound on the rank of a fibre whose
      coefficients are too large for general 2-descent. This is the step that
      censors 60 percent of every excess measurement this program has made, that
      leaves the Mestre route's rank 13 with no upper bound at all, and that
      carries the conditionality exposure IDEA-20260829-c7472b names. Removing it
      means an upper bound whose only expensive step is a factorisation.
    baseline_embedding:
      parameter_slice: >-
        The overlap region: curves that carry a rational 2-torsion point AND are
        small enough for PARI ellrank to terminate. There the two instruments
        compute the same quantity and must agree, which is an exact parameter
        slice of the general claim rather than a lookalike.
      reproduction_check: >-
        Frozen fixture. On at least 200 curves with a rational 2-torsion point
        and log|a6| below 25, run both instruments and require the isogeny-descent
        bound to be at least the ellrank r_high on every one and equal on at
        least 80 percent. A single curve where the new bound is BELOW ellrank's
        upper bound is an implementation error and halts everything. Separately,
        recompute KN-FIND-e1b836's per-family ceiling 18 - sum(m_v - 1) on all
        13,391 families with the Euler check and require exact agreement before
        any new ceiling is reported.
    observation_collision:
      observable: >-
        The integer dim Sel^phi + dim Sel^phihat - 2, and the pair (P, G).
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE STANDARD ONE, stated because it bounds what
        the instrument can ever say: the observable takes the same value for a
        curve of true rank r and for a curve of true rank r - 2 carrying a
        2-dimensional 2-part of Sha. The two are indistinguishable to any
        2-descent, so a large Selmer bound is never evidence of a large rank, and
        the instrument is used only to PRUNE and to CLOSE intervals from above.
        The separation condition is exhibited points: an interval closes only
        when the exhibited lower bound meets the Selmer upper bound, and where it
        does not the result is published as an interval and never as its
        endpoint. A second collision on the PRICE side: two families with
        different fibre configurations can share the same ceiling
        18 - sum(m_v - 1), so P is a statement about ceilings and never about
        which family to use - family choice still needs the measured height
        envelope of KN-FIND-91f871.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the number-theoretic model (the S-unit group of a cubic algebra,
          requiring class and unit groups) by the elementary model (two F2
          square-class groups of rational integers, requiring only
          factorisations), where the hypothesis becomes local solvability of an
          explicit quartic at finitely many named places.
        predicted_gain: >-
          The unconditional upper-bound cost moves from a relation search of size
          exponential in the digit count (Minkowski) to a factorisation of two
          integers plus a 2^{|S|+1} pruned search, and the GRH exposure
          disappears from the call path - which is checkable by instrumenting the
          calls rather than by argument.
      - transform: boundary_lift
        proposed_object: >-
          The certificate family enlarges from "curves ellrank can finish" to
          "curves with a rational 2-torsion point whose b and a^2 - 4b factor";
          the strict inward improvement to be demonstrated is G at least 10
          natural-log units of a6.
        predicted_gain: >-
          The 60 percent censoring that blocks every excess measurement becomes,
          on the redesigned family, a measured completion rate above 95 percent -
          which is precisely the gate IDEA-20260829-1348a3 declares it cannot run
          without.
    quantifier_order: >-
      DECLARED BEFORE ANY FAMILY IS BUILT. FOR ALL curves E in the declared test
      set carrying a rational point of order 2, and FOR ALL points P in E(Q),
      THERE EXISTS an integer B(E), computed from the factorisations of b and
      a^2 - 4b and from local conditions at the places in S union S' union
      {infinity} alone, such that the rank of E(Q) is at most B(E). B is allowed
      to depend on E - it is the thing being computed - and is NOT allowed to
      depend on any point, on any search, or on anything measured after E was
      selected. For the price P the order is different and must not be blurred:
      FOR ALL surfaces X in the declared census carrying a 2-torsion section,
      the ceiling is at most 8 - sum(m_v - 1) - a statement about every member of
      the census, not about a best member found by searching.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The rank of this curve over Q is at most B, unconditionally, by an
        argument using only factorisations of two explicit integers and local
        solvability at explicitly listed places." That is an UPPER bound. Its
        sign is wrong for the objective by construction: it can only ever show
        that a curve does NOT have rank 32, never that one does. Its entire value
        is in un-censoring measurements and in closing intervals, and no
        deliverable may present it as progress toward a rank.
      nearby_object_control: >-
        The closest object where the method must FAIL: this program's own
        headline rank-12 curve at t = -65/22, whose committed witness exhibits no
        rational 2-torsion. The instrument must REFUSE it rather than return a
        plausible integer. A second nearby control: a curve with a rational
        2-torsion point whose b has a large prime factor that the factoriser
        cannot split within the alarm - the instrument must report an OPERATIONAL
        failure and not a bound.
    proof_obligations:
      - claim: The isogeny-descent bound is an unconditional upper bound for rank E(Q).
        responsibility: correctness
      - claim: No load-bearing step calls a class-group, unit-group or bnf routine.
        responsibility: correctness
      - claim: On the overlap region the new bound is never below ellrank's r_high.
        responsibility: baseline
      - claim: The committed 13,391-family geometric ceiling table is reproduced exactly first.
        responsibility: baseline
      - claim: The 2-torsion census's ceilings are computed over a declared, canonical, non-cherry-picked set.
        responsibility: scope
      - claim: Factorisation cost at the four declared size regimes fits the declared alarm.
        responsibility: runtime
      - claim: Every open interval is published as an interval, never as an endpoint.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        overlap_agreement -- on at least 200 curves with a rational 2-torsion
        point and log|a6| below 25, the fraction on which the isogeny-descent
        bound equals PARI ellrank's r_high, and the count on which it is strictly
        BELOW it
      direction: different
      minimum_effect: >-
        equality on at least 0.80, and strictly below on EXACTLY 0. Any curve
        where the new bound falls below an established upper bound halts the
        experiment.
    - metric: >-
        certification_reach_gain G -- the largest log|a6| at which an
        unconditional upper bound returns within a 120 s alarm, isogeny route on
        2-torsion curves minus ellrank on matched torsion-free curves
      direction: higher
      minimum_effect: >-
        at least 10 natural-log units, which is more than four decimal orders of
        magnitude of coefficient size. G at most 2 is the pre-declared negative
        and means the factorisation, not the class group, was the binding cost
        all along.
    - metric: >-
        torsion_price P -- the maximum Shioda-Tate ceiling over a declared
        canonical census of at least 500 rational elliptic surfaces carrying a
        rational 2-torsion section, computed as 8 - sum(m_v - 1) with the Euler
        check, subtracted from the torsion-free maximum of 8
      direction: lower
      minimum_effect: >-
        at most 2, that is an attainable ceiling of at least 6. A measured P of
        at least 4 is the pre-declared opposite reading: 2-torsion families
        cannot host the base rank this program already owns, and the instrument
        gain must be bought on a family nobody would use for a record.
    - metric: >-
        conditionality_audit -- the number of load-bearing calls to a class-group,
        unit-group or bnf routine in the isogeny-descent path, measured by
        instrumenting the call stack rather than by reading the code
      direction: lower
      minimum_effect: >-
        exactly 0. Any nonzero count means the route is not GRH-free as
        implemented and the unconditionality claim is withdrawn for that
        implementation.
    - metric: >-
        censoring_rate -- descent completion rate within the declared alarm, on a
        height-matched cell, 2-torsion arm versus the torsion-free arm
      direction: higher
      minimum_effect: >-
        at least 0.95 in the 2-torsion arm, against the 56 of 140 equal to 0.40
        that EV-ECQ-0d142e measured on the torsion-free arm. Below 0.80 means the
        censoring gate that IDEA-20260829-1348a3 requires is still unreachable.
    - metric: >-
        excess_price -- mean excess over the family's own base rank at MATCHED
        fibre naive height, 2-torsion family versus torsion-free pencil
      direction: different
      minimum_effect: >-
        reported with a confidence interval. A difference of at least 0.5 rank
        units in either direction means 2-torsion also changes the excess
        distribution, so a 2-torsion calibration fixture is NOT representative of
        the families a record attempt would use, and any beta measured on it may
        not be transferred.

  minimal_test:
    design: >-
      STEP 0 (cost model and stop-gate, about 2 h). Measure factorisation wall
      clock for integers of 20, 30, 60 and 100 decimal digits drawn from the
      shapes b(t0) and a(t0)^2 - 4b(t0) actually produce, under a declared alarm.
      If 100-digit integers of the observed shape are unfactorable within the
      alarm, the record-scale arm is declared out of scope HERE, before any code
      is written, and the proposal is re-scoped to the sizes that do factor.
      STEP 1 (reproduction gate, about 1 CPU-hour). Recompute
      KN-FIND-e1b836's per-family ceiling 18 - sum(m_v - 1) on all 13,391
      families with the Euler check and require exact agreement. STOP CONDITION.
      STEP 2 (implementation and overlap validation, about 3 CPU-hours plus the
      implementation budget). Implement descent via 2-isogeny. Validate on at
      least 200 small 2-torsion curves against PARI ellrank; require the
      agreement and the never-below conditions. Instrument the call stack and
      report the conditionality audit.
      STEP 3 (the price census, about 3 CPU-hours). Build a declared canonical
      census of at least 500 rational elliptic surfaces carrying a rational
      2-torsion section, compute the fibre configuration and the ceiling for each
      with the Euler check, and report the maximum and the distribution. Publish
      the canonicalisation rule and per-class multiplicity.
      STEP 4 (the reach and censoring measurement, about 4 CPU-hours). On a
      height-matched cell, run the isogeny route on the best 2-torsion family and
      ellrank on the torsion-free pencil, both at a 120 s alarm, and report G,
      the completion rates, and the excess histograms on completed denominators.
      STEP 5 (the consequential application, about 3 CPU-hours). Attempt an
      unconditional upper bound, by the new route, on any curve in this
      repository's committed pools that carries rational 2-torsion and has never
      had one - and report explicitly that the two certified rank-13 Mestre
      curves and the rank-12 pencil fibre are NOT such curves if they are not.
    controls:
      - >-
        OVERLAP CONTROL WITH A KNOWN ANSWER: 200 small 2-torsion curves where
        ellrank terminates. Agreement on at least 0.80 and never below.
      - >-
        REFUSAL CONTROL: the committed rank-12 curve at t = -65/22, with no
        rational 2-torsion in its witness. The instrument must REFUSE, not return
        a number.
      - >-
        REPRODUCTION CONTROL: the 13,391-family ceiling table must come back
        exactly, with the Euler check passing.
      - >-
        SIGN CONTROL: on every curve where exhibited points give a lower bound L,
        the new bound must satisfy B at least L. A bound below an exhibited
        lower bound is an implementation failure and halts the census.
      - >-
        FACTORISATION-FAILURE CONTROL: a 2-torsion curve whose b is a product of
        two 50-digit primes. The instrument must report an OPERATIONAL failure and
        never a bound, under AGENTS.md rule 3.
      - >-
        CONDITIONALITY CONTROL: the call-stack instrumentation must be shown to
        DETECT a bnf call by running it deliberately on a general 2-descent path
        first, so a zero count on the isogeny path is a measurement and not a
        blind spot.
      - >-
        HEIGHT-ENVELOPE CONTROL: every 2-torsion family proposed as a fixture is
        reported with its measured lower height envelope over 1e5 fibres in the
        KN-FIND-91f871 convention, so a cheap descent is not bought by an
        unusable family.
    required_metrics:
      - factorisation wall clock by digit count, with the alarm and the failure count
      - the 13,391-family ceiling reproduction outcome and the Euler check result
      - per curve -- isogeny-descent bound, ellrank r_low and r_high where available, exhibited lower bound
      - overlap agreement fraction and the count of below-ellrank violations
      - the 2-torsion census -- canonicalisation rule, size, fibre configurations, ceiling distribution, maximum
      - G in natural log units of a6, with both arms' reach reported separately
      - completion rate per arm per height cell, and the excess histogram on completed denominators
      - the conditionality audit call counts, with the deliberate-positive detection check
      - measured height envelope of every proposed 2-torsion family
      - wall clock, peak RSS, and every timeout recorded as operational

  falsification_conditions:
    - >-
      If the committed 13,391-family ceiling table is not reproduced exactly, no
      new ceiling may be reported.
    - >-
      If the isogeny-descent bound falls below ellrank's r_high on ANY overlap
      curve, the implementation is unsound and every number from it is void.
    - >-
      If the conditionality audit finds any load-bearing class-group or bnf call,
      the GRH-free claim is falsified for this implementation and must be
      withdrawn, whatever the reach turns out to be.
    - >-
      If G is at most 2 natural log units, the reach claim is falsified: the
      binding cost was the factorisation and not the class group, and the
      censoring is not curable this way.
    - >-
      If the maximum attainable ceiling over the 2-torsion census is at most 4,
      the price is at least 4 and the exchange is bad; the pre-declared negative
      reading is recorded, and its consequence is that upper bounds at large
      coefficient size remain structurally unavailable to this program.
    - >-
      If the excess price is at least 0.5 rank units, a 2-torsion family is not a
      representative calibration fixture and no beta measured on one may be
      transferred to a torsion-free family.
    - >-
      A factorisation that does not complete, an OOM, or a timeout is an
      OPERATIONAL condition under AGENTS.md rule 3 and is never a rank bound.

  confounders:
    - >-
      SHA[2] SLACK. The Selmer bound exceeds the rank by the F2-dimension of the
      2-part of Sha, so a large bound is never evidence of a large rank and the
      instrument's intervals do not close on curves with nontrivial Sha[2].
      Direction stated: this makes the instrument CONSERVATIVE as an upper bound,
      which is the safe direction, but it also means a wide interval is not
      evidence of anything and must be published as an interval.
    - >-
      SELECTION IN THE 2-TORSION CENSUS. Families are enumerated by a
      construction rule, and a rule that happens to favour few reducible fibres
      would understate the price P. Controlled by publishing the canonicalisation
      rule and per-class multiplicities, and by reporting the ceiling
      DISTRIBUTION rather than only its maximum.
    - >-
      FACTORISATION LUCK. The reach G depends on how the integers b and
      a^2 - 4b happen to factor, which varies wildly and is not a property of the
      method. Controlled by reporting G as a distribution over at least 200
      instances per size regime, and by reporting the failure rate alongside.
    - >-
      HEIGHT PAYBACK. A 2-torsion family has its own O(1) height constant, and
      KN-FIND-e1b836 measured a 17.49 log-unit spread between a family's envelope
      minimum and its rank-12 locus WITHIN one family. A 2-torsion family with a
      terrible envelope would give cheap descents on curves nobody wants.
      Measured explicitly, never assumed away.
    - >-
      INSTRUMENT SUBSTITUTION MASQUERADING AS A RESULT. Comparing a new
      implementation against PARI is comparing an implementation, not a method.
      Controlled by requiring agreement on the overlap region before any
      out-of-overlap number is reported, and by reporting the comparison as
      implementation-versus-implementation in the deliverable.

  interpretation_limits:
    - >-
      THIS MOVES NO RANK AND EXHIBITS NO CURVE. Its output has the wrong sign for
      GOAL-ECQ-e72c0b's objective by construction: an upper bound can only ever
      show a curve is not the one wanted. Its value is un-censoring measurements
      and auditing exactness.
    - >-
      A SELMER BOUND IS NOT A RANK. B may never be cited as a rank, and a curve
      with B = 13 has not been shown to have rank 13.
    - >-
      2-TORSION COSTS BASE RANK ON PURPOSE. Any family designed under this record
      is a CALIBRATION FIXTURE, not a record candidate, unless the measured price
      P turns out to be 0 - which the recalled Shioda-Tate accounting says it
      will not be.
    - >-
      IDEA-20260829-c7472b's GRH observation is an OPEN AUDIT and nothing here
      asserts that this program's committed "exactly 12" is wrong. What this
      record offers is an alternative path whose conditionality is measurable by
      instrumenting a call stack.
    - >-
      Scoped to the declared census, the declared size regimes, the declared
      alarms, PARI as the comparator, and the software stack actually used. Rank
      at least 31 over Q remains a live claimed record held by others.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (FACTORISATION IS THE ONLY SUPERPOLYNOMIAL STEP.) For curves
        y^2 = x(x^2 + a x + b) in the declared test set, the wall clock of the
        isogeny-descent upper bound is dominated by the factorisations of b and
        a^2 - 4b, and the residual work - enumerating and locally testing the at
        most 2^{|S|+1} square classes on each side - contributes at most 20
        percent of the total on at least 80 percent of instances, where |S| is
        the number of distinct prime factors found.
      rigorous_support: >-
        RIGOROUS PART: the Selmer group is a subgroup of Q(S,2) whose size is
        exactly 2^{|S|+1}, and each local solvability test is a finite exact
        computation at a named place, so the residual work is EXACTLY
        2^{|S|+1} times a bounded cost with no hidden search; and the bound
        rank at most dim Sel^phi + dim Sel^phihat - 2 needs no hypothesis.
        DISTRIBUTION IMITATED: the classical Hardy-Ramanujan and
        Erdos-Kac picture in which the number of distinct prime factors of a
        random integer near N is about log log N with Gaussian fluctuation, so
        2^{|S|} is quasi-polynomial in the size on typical inputs and the
        exponential term does not bind. THE FAILURE MODE THIS NAMES is an integer
        with anomalously many small prime factors, which is exactly what a
        polynomial b(t) with many factors over Q[t] can systematically produce -
        so a FAMILY may be systematically worse than a random integer, and that
        is the tail this validates.
      validation_plan: >-
        Sample: at least 200 specialisations per size regime at 20, 30, 60 and
        100 decimal digits of a6, drawn from the declared 2-torsion families, so
        the integers have the shapes the method actually meets rather than random
        shapes. Shortcut making this feasible: b(t) factors over Q[t] first, so
        the polynomial factorisation is free and only the integer cofactors need
        splitting. Compare: the empirical distribution of |S| against the
        log log N prediction with its Erdos-Kac normalisation, and the measured
        share of wall clock spent in factorisation against the 80 percent
        prediction. Tail check: report the ten instances with the largest |S| and
        their 2^{|S|+1}, and report the single instance with the largest residual
        share; if any instance spends more than half its time outside
        factorisation, H1 is falsified for that family shape and the family is
        redesigned rather than the assumption relaxed. TRANSFER ASSUMPTION,
        STATED: |S| measured on a family's own specialisations does not transfer
        to another family, since it is a property of how b(t) factors, and it
        does not transfer to 1000-digit coefficients at all.
    - id: H2
      statement: >-
        (BOUND SHARPNESS ON THE FIXTURE.) On the declared 2-torsion calibration
        family, the isogeny-descent upper bound equals the exhibited-point lower
        bound on at least 70 percent of fibres in the declared height cells, so
        the excess histogram measured there is a histogram of EXACT ranks rather
        than of intervals.
      rigorous_support: >-
        RIGOROUS PART: both endpoints are unconditional - the lower bound is
        exhibited points verified on the exact curve, the upper bound is a Selmer
        dimension - so the interval is real data with no heuristic content
        whatever. WHAT IS HEURISTIC is only that the interval COLLAPSES often
        enough for a histogram to be meaningful, and the obstruction to collapse
        is a nontrivial Sha[2]. DISTRIBUTION IMITATED: the empirical regime
        EV-ECQ-0d142e measured on the torsion-free pencil, where certified rank
        equalled both ellrank endpoints on all 54 completed descents; the
        assumption is that the 2-isogeny analogue behaves similarly, which is an
        analogy across a change of descent map and is NOT evidence.
      validation_plan: >-
        Sample: every fibre certified in STEP 4, at least 150 per height cell
        across at least three cells. Compare: the collapse rate against the 70
        percent prediction, stratified by height cell and by |S|. Tail check:
        report every open interval with its width, and the widest observed; an
        open interval is published as an interval and never as an endpoint. If
        the collapse rate falls below 40 percent, H2 is falsified, the fixture
        does not deliver exact ranks, and the censoring problem has been traded
        for a Sha problem rather than solved. TRANSFER ASSUMPTION, STATED: a
        collapse rate measured on curves with rational 2-torsion says nothing
        about torsion-free curves, which are the ones a record attempt uses.

  target_complexity:
    time_exponent: >-
      THE EXPONENT MOVED IS THE COST OF AN UNCONDITIONAL RANK UPPER BOUND AS A
      FUNCTION OF THE COEFFICIENT DIGIT COUNT D. CURRENT PATH: general 2-descent
      in a cubic algebra, whose class and unit groups are obtained under GRH by a
      relation search to Bach's bound of order log^2 of the discriminant, and
      UNCONDITIONALLY only by searching to the Minkowski bound of order the
      square root of the discriminant - that is exp(Theta(D)) in the digit count,
      which IDEA-20260829-c7472b instantiates as roughly 1e30 against roughly
      2.3e5 for this program's own rank-12 curve. PROPOSED PATH: factor two
      integers of D digits, heuristically exp(Theta(D^{1/3} (log D)^{2/3})) by
      the number field sieve, plus 2^{|S|+1} local tests with |S| about
      log log of the integer. SO THE UNCONDITIONAL UPPER-BOUND EXPONENT MOVES
      FROM Theta(D) TO Theta(D^{1/3} (log D)^{2/3}) IN THE EXPONENT, AT THE PRICE
      OF REQUIRING A RATIONAL 2-TORSION POINT. That is an exponent statement
      about a certification step, NOT about any hard problem, and it must never
      be quoted as a cryptographic speedup. The factoring exponent is quoted as
      the standard heuristic NFS figure, is recalled, and is not verified here.
    memory_exponent: >-
      Small and flat: two prime lists, two F2 spaces of dimension at most
      |S| + 1, and the local test data. Budget 2 GB peak RSS against the 1.22 GB
      the predecessor campaign measured; the factoriser, not the descent,
      dominates memory and its usage is measured rather than asserted.
    best_known: >-
      IN THIS REPOSITORY: PARI ellrank, measured at 84 of 140 attempted descents
      censored at an 8 s alarm and 31 of 31 upper-bound descents timing out at a4
      of order 1e19, with its unconditionality under open audit. No other upper
      bound of any kind has ever been computed here for a curve over Q.
      EXTERNALLY: descent via 2-isogeny and complete 2-descent are textbook and
      are implemented in mwrank and PARI; nothing algorithmically new is claimed
      and this program would be building an instrument it lacks.
    hidden_overhead: >-
      Four disclosures. (1) The bound has the WRONG SIGN for the objective and can
      never raise a rank. (2) It requires a rational 2-torsion point, which this
      program's headline curve does not have. (3) The 2^{|S|+1} term is benign for
      random integers by Erdos-Kac but a FAMILY can systematically produce
      integers with many small factors, which is the named failure mode of H1.
      (4) The price P is real, is paid in Shioda-Tate ceiling, and is the reason
      this route builds fixtures rather than record candidates.
    tradeoff_note: >-
      Not a time-memory problem. The real trade is BASE RANK against
      CERTIFICATION REACH, and the whole proposal is the measurement of that
      exchange rate. A secondary trade is ALARM against COMPLETION: the reach G
      is quoted at a declared 120 s alarm and is a function of it, so both arms
      are run at the identical alarm and the alarm is published with the number.
      Trivially parallel over curves; the campaign runs at max_concurrent 1.

  dominated_by: >-
    FRONTIER ROWS CHECKED ACROSS TIME, MEMORY AND DATA. (1) PARI AND MWRANK
    DOMINATE THE ALGORITHM: descent via 2-isogeny is classical and implemented,
    and this program would be acquiring a capability rather than inventing one.
    (2) PARI ellrank DOMINATES ON GENERALITY - it needs no torsion - and is
    dominated here on coefficient size and, pending the open audit, on
    unconditionality. (3) IDEA-20260829-c705b4 DOMINATES ON THE LOWER-BOUND HALF:
    an exact character certificate needs no torsion, no factorisation and no
    descent, and removes the floating point from every lower bound; it is
    dominated in turn here because it can never give an upper bound and therefore
    can never close an interval or measure an exact rank. (4)
    IDEA-20260829-4c61db DOMINATES ON LEVEL - a surface-level Gillibert-Levin
    bound prices a whole family at once - and is dominated here on tooling risk,
    since it is a build from a paper with no located implementation and unread
    hypotheses, where this is textbook. (5) LONGER ALARMS dominate on
    implementation cost, being free, and are dominated on reach, since
    EV-ECQ-0d142e's censor is coefficient size and not time at the margin - 31 of
    31 timeouts is not a budget problem. (6) On BASE RANK every published family
    dominates, and this record makes base rank WORSE on purpose. On the axis this
    record competes on - an unconditional, auditably GRH-free rank upper bound at
    coefficient sizes where the incumbent instrument returns nothing - no row in
    this repository dominates it, because no row exists.
  sota_delta: >-
    QUANTITATIVELY. Delta on rank over Q: EXACTLY ZERO, and NEGATIVE on base rank
    by construction, since the price P is paid in Shioda-Tate ceiling units.
    Delta on the world record: ZERO. WHAT MOVES: this program's unconditional
    upper-bound capability goes from "PARI ellrank, which returned nothing on 31
    of 31 attempts at a4 of order 1e19 and whose unconditionality is under open
    audit" to "a bound whose only superpolynomial step is a factorisation, with
    the conditionality settled by instrumenting a call stack", with the reach
    gain G stated in natural log units of a6 and a pre-declared target of at
    least 10, that is more than four decimal orders of magnitude. The consequent
    campaign-level gain is that the 60 percent censoring rate which currently
    blocks IDEA-20260829-1348a3's 95-percent-completion gate becomes measurable
    on a fixture; the cost is that the fixture has base rank at most 8 - P and is
    not a record candidate. Both halves are the deliverable.

  estimated_cost:
    implementation: high
    compute: medium
    basis: >-
      Implementation is the dominant risk and is honestly high: a correct descent
      via 2-isogeny with local solvability tests at every place in S union S'
      union the infinite place, a family constructor carrying a 2-torsion
      section, a call-stack instrumenter, and the census harness reusing
      KN-FIND-e1b836's ceiling machinery. Compute is roughly 16 CPU-hours across
      six steps, dominated by STEPS 3 and 4, with the factoriser dominating
      memory. STEP 0 is a genuine stop-gate that costs two hours and can re-scope
      the whole proposal before a line is written.

  recommended_priority: medium

