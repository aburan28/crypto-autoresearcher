idea:
  id: IDEA-20260809-d89bcf
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    A binding harness with three-valued output: certificate, derivation, or out of
    scope — and no silent pass
  class: tooling
  claim: >-
    Given a combiner's key-derivation input list, the harness should return, for
    each binding property, either a constructed certificate, a derivation of why
    no certificate exists within the enumerated class, or an explicit out-of-scope
    marker. The claim is that this three-valued contract is implementable for the
    combiners in this goal, and that forbidding a bare pass is what makes the
    harness's output admissible as evidence under this program's rules.
  mechanism: >-
    The harness takes a declarative description of the combiner's inputs, consults
    the lattice for the derivation, and dispatches to a constructor when the
    lattice predicts a failure. Absence of both a certificate and a derivation is
    represented only as out-of-scope, which is a distinct value rather than a
    default.
  why_not_a_renamed_known_approach: >-
    Test harnesses normally return pass or fail. The three-valued contract, with
    the third value carrying the reason the question was not settled, is the design
    decision that matters here and it mirrors the goal's undetermined column.
  predictions:
  - observable: outputs across the goal's combiners
    metric: value per combiner per property
    predicted: Certificates and derivations for the implemented combiners, out-of-scope only where the input list falls outside the lattice.
  - observable: agreement with hand-produced results
    metric: exact match on the cells filled in IDEA-20260809-c48d6a
    predicted: Agreement; disagreement blocks the harness's use as evidence.
  minimal_test: >-
    Run the harness over every combiner in the goal, compare with the
    hand-produced table, and test that no code path returns a bare pass.
  controls:
  - 'REGRESSION FIXTURES from the hand-produced cells.'
  - 'NEGATIVE CONTROL: adding a bare-pass path must fail the test suite.'
  falsification_conditions:
  - The harness disagrees with a hand-produced cell.
  - The three-valued contract cannot be maintained without a catch-all, in which case the harness is recorded as tooling only and not as an evidence source.
  interpretation_limits: >-
    A derivation is relative to the enumerated construction class; out-of-scope
    means unsettled, not safe. Both limits appear in the harness's own output.
  sota_delta: 'No attack. Delta: honest-by-construction tooling that generalizes the goal''s table to combiners nobody has proposed yet.'
  dominated_by: Downstream of IDEA-20260809-c41b2e and c48d6a; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: medium
