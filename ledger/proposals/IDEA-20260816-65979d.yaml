idea:
  id: IDEA-20260816-65979d
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: Fix one three-round public-coin toy argument whose whole transcript space is enumerable,
    then measure the exponent alpha in the Fiat-Shamir soundness loss eps_FS(Q) modelled as c times
    Q to the alpha, by running an exhaustively optimal Q-query cheating prover instead of assuming
    the union-bound value alpha equal to one
  class: mechanism
  claim: '(A) For a fixed three-round public-coin argument with challenge set C of size q per round
    and a false statement, the interactive soundness error eps_I is exactly computable by enumeration,
    and the non-interactive Fiat-Shamir error under a budget of Q hash evaluations, eps_FS(Q), is
    also exactly computable when the hash is instantiated as a keyed random function drawn per trial
    and the prover strategy space is finite. (B) The accounting that proof systems use converts eps_I
    to eps_FS by a factor at most Q, so a log-log fit of measured eps_FS(Q) against Q over Q in a
    swept range should have slope alpha near one for a one-round protocol and can rise toward the
    round count r for multi-round state-restoration strategies; the deliverable of this proposal is
    that fitted alpha and its confidence interval at named q, r, and Q ranges, together with the measured
    ratio eps_FS(Q) divided by Q times eps_I as a plain number. (C) The measurement is exhaustive
    on the prover side: for each sampled hash key the cheating prover is the argmax over the enumerated
    strategy tree, so the reported eps_FS(Q) is an attained optimum for that key rather than a heuristic
    prover''s score, and the only sampling is over hash keys, whose Monte Carlo error is reported.
    (D) NOT CLAIMED: nothing here is an attack, a break, or a statement about any deployed or third-party
    proof system; no claim is made that any published bound is wrong, since the measured object is
    this program''s own toy protocol at toy parameters and a bound that holds for all protocols is
    not refuted by one protocol falling below it; no claim is made about protocols with large challenge
    spaces beyond the stated extrapolation assumption; and no security consequence for any parameter
    set in use anywhere is asserted or implied.'
  mechanism: 'STAGE A: fix the reference protocol. A commit-challenge-response argument over F_p with
    p a small prime, in which the prover commits to a vector, receives a challenge in C, and opens
    a challenge-dependent linear combination; the statement is false by construction, so an honest
    prover cannot succeed and every acceptance is a cheat. STAGE B: enumerate. Build the full strategy
    tree: every first message the prover can send, and for each, every response it can give per challenge.
    Compute eps_I as the maximum over first messages of the fraction of challenges the prover can
    answer. This is a closed-form check against d over q for the specific algebraic structure chosen,
    and disagreement here means the enumerator is wrong, not that the theory is. STAGE C: instantiate
    Fiat-Shamir with a keyed hash mapping the first message to a challenge. For each of N sampled
    keys, give the prover Q attempts: it may try Q distinct first messages, computing the induced
    challenge for each, and accepts if any yields an answerable challenge. Record success or failure.
    eps_FS(Q) is the success frequency across keys. STAGE D: sweep Q geometrically and fit log eps_FS
    against log Q by least squares, reporting alpha, intercept, and residuals; the fit is done only
    in the regime where eps_FS is bounded away from one, since saturation flattens the curve and would
    bias alpha downward. STAGE E: repeat the identical pipeline for the null object of stage F below,
    and for a second protocol with a different d over q so that alpha is measured at two points rather
    than one.'
  novelty_status: unverified
  novelty_screen:
    method: Listed every proposal whose question_id is RQ-WFS-e776b6 by parsing all of ledger/proposals/IDEA-*.yaml
      with PyYAML and printing id, class and title. Read ledger/questions/RQ-WFS-e776b6.yaml, ledger/questions/RQ-ROS-595c15.yaml,
      ledger/questions/RQ-GGMB-6eaabc.yaml in full, and the first eighty lines of ledger/proposals/IDEA-20260815-85378c.yaml.
      Ran case-insensitive greps over ledger/proposals/ and ledger/hypotheses/ for the strings soundness
      error, challenge space, union bound, extractor, rewinding, forking lemma, state restoration,
      grinding, and Schwartz-Zippel, then inspected the titles of every 2026-08-16 and 2026-08-09
      hit under RQ-WFS.
    results: Thirteen proposals already sit on RQ-WFS-e776b6. IDEA-20260815-85378c, IDEA-20260809-792aca,
      IDEA-20260809-7d450f and IDEA-20260809-7e45f5 own the omission-class and forged-transcript catalogue.
      IDEA-20260809-7ca867, IDEA-20260816-f05ef2 and IDEA-20260816-8639e7 own grinding cost and state-restoration
      prefix reuse. IDEA-20260809-7caba9 owns the per-round round-by-round gap against a quoted bit
      level. IDEA-20260809-82e7ba owns sweeping challenge entropy downward against forgery cost. IDEA-20260816-722a94
      owns calibrating a soundness instrument on protocols of known soundness. The string forking
      lemma returned zero hits across all proposals and hypotheses; no record found sweeps the query
      budget Q as the independent variable or reports a fitted exponent of Q.
    verdict: 'UNVERIFIED. No agent in this environment can read external literature, so nothing is
      asserted about what is published; the Q-factor in Fiat-Shamir accounting is standard textbook
      material and is treated here as known. What is claimed new is only internal: the independent
      variable is the query budget Q rather than challenge entropy (IDEA-20260809-82e7ba) or round
      index (IDEA-20260809-7caba9), and the deliverable is a fitted exponent with its interval rather
      than a certificate or a curve of cost. The exhaustive-prover enumerator is assembled from the
      same known parts those records use.'
  object_first_candidate:
    tracked_object: 'The attainable-challenge set A(m) of a first message m: the subset of the challenge
      space C for which the cheating prover has a valid response after committing to m. The whole
      computation is followed as the map m to A(m), and every soundness quantity in this proposal
      is a functional of that map.'
    lossiness: Genuinely lossy. The full prover state at commitment time is the committed vector plus
      all its algebraic relations to the false statement; A(m) discards all of it and keeps only a
      subset of C of size at most d. Two structurally different first messages with the same attainable
      set are identified, and the number of such classes is far smaller than the number of first messages.
      The discard is compatible with the target operation because Fiat-Shamir acts on m only through
      the induced challenge H(m), and acceptance depends only on whether H(m) lies in A(m); nothing
      outside A(m) can influence acceptance, so the retained part propagates deterministically.
    propagation: 'One step of the target operation is one hash query: the prover picks m, the transform
      delivers the single challenge H(m), and the step succeeds exactly when H(m) is an element of
      A(m). Under Q steps with distinct m the object propagates as a coupon-collection over the family
      of sets A(m1) through A(mQ) against Q independent uniform draws, so the survival probability
      of the cheat is one minus the product over i of one minus the density of A(mi) in C, when the
      densities are constant, and the deviation of the measured curve from that product form is exactly
      what the fitted alpha reports.'
    survival_score: 'The object survives as long as A(m) is computable per m, which holds while the
      response space is enumerable. Concretely: it survives to challenge sets of size up to about
      two to the twenty and prover strategy trees up to about ten million nodes on one machine within
      the declared budget, and dissolves beyond that, where A(m) must be sampled rather than computed
      and the attained optimum degrades into a lower bound. It also dissolves when the protocol has
      adaptive rounds whose response space depends on earlier challenges in a way that makes A(m)
      a tree rather than a set; that is the boundary this proposal declares and does not cross.'
  null_object_control: 'NULL OBJECT: the identical protocol with a TRUE statement and an honest prover
    replaced by a random-guessing cheating prover whose attainable set A(m) is drawn uniformly at
    random as a subset of C of the same size d, independent of m and of the statement, with the identical
    Q-query loop, the identical hash instantiation, the identical fit, and executed in the same invocation
    as the signal arm. For the signal arm to mean anything the null must produce a fitted alpha statistically
    indistinguishable from the coupon-collection value implied by its own density d over q, since
    a random attainable set has no structure for the transform to exploit. If the null returns the
    same alpha as the signal arm, the measurement is reporting the sampling geometry of the loop and
    not any property of the protocol, and the result is recorded as a controlled null.'
  discriminated_from:
  - IDEA-20260809-82e7ba sweeps challenge-space entropy downward and asks where forgery cost stops
    matching assumed entropy; its independent variable is the size of C and its deliverable is a crossover
    point. Here C is fixed and Q is swept, and the deliverable is an exponent of Q.
  - IDEA-20260809-7caba9 measures the per-round gap the transform introduces against a quoted bit
    level; its independent variable is the round index. This record fixes the round count at three
    and varies only the adversary budget.
  - IDEA-20260816-722a94 calibrates the instrument on protocols of soundness identically zero and
    identically one. That is a correctness check on the harness; this record uses a protocol of intermediate,
    exactly computed soundness and reports a fitted scaling law.
  - IDEA-20260815-85378c produces one forged transcript per omission class. Its object is a certificate
    for a broken instantiation; this record leaves the transform correctly instantiated and measures
    the residual loss that remains when nothing is omitted.
  - 'A generic textbook statement that Fiat-Shamir loses a factor Q: that is an upper bound valid
    for all protocols, and this record measures where one named protocol sits under it, which neither
    confirms nor contradicts a universal bound.'
  assumptions:
  - The three-round protocol can be written so that the response space per challenge is finite and
    enumerable at the chosen parameters, and the false statement admits no honest proof.
  - Instantiating the challenge oracle as a keyed hash sampled per trial is an acceptable stand-in
    for the random-oracle idealisation at the toy sizes used; deviations of a concrete hash from uniform
    are separately measured, not assumed away.
  - The attained maximum over the enumerated strategy tree is the true optimum for the tree as defined;
    strategies outside the enumerated class, such as ones that abort and restart with correlated commitments,
    are outside scope and would only raise eps_FS.
  - Monte Carlo error over hash keys is the dominant statistical error and is controlled by the declared
    key count, with the binomial interval reported rather than a point estimate.
  - The log-log fit is only meaningful in the unsaturated regime; the fit window is pre-registered,
    not chosen after seeing the curve.
  predictions:
  - metric: fitted exponent alpha in eps_FS(Q) proportional to Q to the alpha, unsaturated window
    direction: different
    minimum_effect: pre-registered null value alpha equal to 1.00; a deviation is called only if the
      95 percent fit interval excludes the interval 0.95 to 1.05
  - metric: ratio eps_FS(Q) divided by Q times eps_I at Q equal to 64
    direction: lower
    minimum_effect: 0.9
  - metric: eps_I computed by enumeration versus the closed-form d divided by q for the chosen algebraic
      structure
    direction: different
    minimum_effect: 'forced value: exact agreement to the last representable digit; any disagreement
      halts the run as an instrument fault, not as a finding'
  - metric: difference in fitted alpha between the signal arm and the null arm at matched density
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: the protocol chosen has no known structural reason
      to deviate from the null, so pre-committing a nonzero effect would be inventing a prediction;
      the null result is the expected and still-publishable outcome'
  minimal_test:
    design: 'One protocol, one parameter point, one afternoon. Take p equal to 257, challenge set
      C equal to the nonzero residues so q equals 256, and a false statement for which the cheating
      prover can answer exactly d equal to 4 challenges per commitment, so eps_I equals 4 over 256.
      Enumerate the strategy tree once and verify eps_I against the closed form; a mismatch stops
      everything. Then for Q in the geometric sweep 1, 2, 4, 8, 16, 32, 64, 128 run 20000 independent
      hash keys, each key giving the prover Q distinct commitments, and record the empirical success
      frequency. Fit log eps_FS against log Q over the window where eps_FS is below 0.3. Run the null
      arm with randomly drawn attainable sets of size 4 in the same process, sharing the random-number
      stream discipline and the same fit code. The discriminating output is two numbers: alpha_signal
      and alpha_null with intervals. If they agree, the loss is exactly the coupon-collection geometry
      and nothing protocol-specific is present at these parameters, which is itself the measured obstruction.'
    controls:
    - Null arm with randomly drawn attainable sets of the same size, executed in the same invocation.
    - 'Positive control: a protocol with d equal to q, where every challenge is answerable, whose
      eps_FS must be identically one at every Q.'
    - 'Negative control: a protocol with d equal to zero, whose eps_FS must be identically zero at
      every Q.'
    - Enumerated eps_I cross-checked against the closed form before any Fiat-Shamir loop runs.
    - Two independent hash instantiations, one keyed BLAKE2 and one keyed SHA-256 reduction, to show
      the fitted alpha does not depend on the hash choice.
    - 'Seed replay: the entire sweep re-executed from the recorded seed and required to reproduce
      every frequency bit for bit.'
    required_metrics:
    - eps_I from exhaustive enumeration
    - eps_FS(Q) empirical frequency with binomial 95 percent interval, per Q
    - fitted alpha with 95 percent interval and fit residual norm
    - ratio eps_FS(Q) over Q times eps_I, per Q
    - strategy tree node count and enumeration wall time
    - number of hash keys sampled and number of distinct commitments per key
    - null-arm alpha with interval
  falsification_conditions:
  - 'Enumerated eps_I disagrees with the closed form: the instrument is wrong and no soundness number
    may be reported from this run.'
  - The positive control does not return eps_FS identically one, or the negative control does not
    return identically zero.
  - 'The fitted alpha for the signal arm and the null arm agree within their intervals at every parameter
    point: no protocol-specific structure is detectable and the record closes as a controlled null
    with the geometry named.'
  - 'Fitted alpha depends on the hash instantiation beyond the reported interval: the measurement
    is reading the hash, not the transform, and must be re-scoped.'
  - The fit residual norm exceeds the pre-registered threshold, indicating the power-law model itself
    does not describe the data, in which case the deliverable becomes the tabulated curve and no exponent
    is reported.
  - 'Replay from the recorded seed does not reproduce the frequencies: the run is void.'
  confounders:
  - 'Saturation: at large Q the success frequency approaches one and flattens the log-log slope, biasing
    alpha downward if the fit window is chosen carelessly.'
  - Collisions among the Q induced challenges reduce the effective number of independent draws, an
    effect that grows with Q over q and can masquerade as a sub-linear alpha.
  - The keyed hash is not a random function; its bias contributes to eps_FS and is confounded with
    protocol structure unless the null arm shares the identical hash.
  - 'Monte Carlo error at small eps_FS: with 20000 keys, frequencies below about 0.0005 are dominated
    by counting noise.'
  - Duplicate commitments generated by the prover would silently reduce the effective budget; the
    loop must enforce distinctness and count it.
  interpretation_limits:
  - Every number is scoped to the named protocol, the named p and q, the named d, the named hash instantiations
    and the named Q range; no extrapolation to large challenge spaces or to protocols with different
    structure is asserted.
  - 'A measured alpha below one does not mean any published bound is wrong: a universal upper bound
    is not contradicted by one instance sitting under it.'
  - The keyed-hash-per-trial instantiation is not a random oracle and is not a deployed hash usage
    pattern; conclusions are about this instantiation.
  - No statement about any third-party proof system, library, circuit, or deployment follows from
    any outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement cost is O(N times Q) hash evaluations
      plus one O(|M| times q) enumeration of the strategy tree, where M is the first-message space.
    memory_exponent: No attack memory exponent is claimed. Peak memory is O(|M|) for the attainable-set
      table, under one gigabyte at the stated parameters.
    best_known: 'The incumbent is the union-bound accounting itself: the standard argument that a
      Q-query Fiat-Shamir prover succeeds with probability at most Q times the interactive soundness
      error, which is what every parameter table in this space uses. This proposal does not beat it;
      it measures where one instance sits relative to it.'
    hidden_overhead: 'The human cost dominates: specifying a false statement whose attainable-set
      structure is exactly known and provably has no larger strategy class takes far longer than the
      compute. Also hidden is the fit-window choice, which must be pre-registered or it silently becomes
      a free parameter, and the distinctness bookkeeping on prover commitments.'
  dominated_by: n/a (no result claimed). No attack, solve, or cost improvement is proposed, so there
    is no frontier row to compare against; the Pareto check does not apply and asserting null here
    would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a fitted exponent
    and a ratio at named toy parameters, not a cost improvement over any algorithm.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A, that eps_I and eps_FS are exactly computable at the stated parameters:
    about 0.9, the only risk being that the strategy tree is larger than estimated and the optimum
    degrades to a sample. Part B, that a clean power law fits the unsaturated window with a reportable
    alpha: about 0.6, since collisions and saturation may curve the log-log plot enough that no single
    exponent describes it. Part C, that alpha differs measurably from the null arm: about 0.15, and
    this is the part I expect to fail; the honest expectation is that the transform loss at these
    parameters is pure coupon-collection geometry, which is why the null arm is the real deliverable.
    Part D, that the resulting numbers are reusable by other RQ-WFS records as a calibrated baseline:
    about 0.7.'
