      claim: RC-A (N-CONV), RC-B (substituted fall profile), RC-D (degree-disciplined certificates), resource reading R3, J7-J9 measurements
      verified_by: coordinator (read in full for this design)
    - ref: KN-FIND-5a8d3e
      provenance: internal
      claim: W_4 refutes 62/62 U62 at the first iteration; nulls exactly semi-regular at D = 4; N-ELL 0/20
      verified_by: coordinator (read)
    - ref: EV-CERTBIN-4a9d2f
      provenance: internal
      claim: exact_scoped_claim; TA-7 (specificity against N-CONV not assumed); unresolved confound "the mechanism is open"
      verified_by: coordinator (read)
    - ref: KN-LIT-7604 (Kosters-Yeo, arXiv:1503.08001, abstract)
      provenance: kb
      claim: first fall degree 2 for the S_3 Weil descent in characteristic 2 via a group morphism to F_2
      verified_by: TASK-20260924-d95e70 (abstract retrieved by the red team); consistency with ell is the red team's derivation, not confirmed at source

  assumptions:
    - Unsatisfiability of every drawn system is decided exactly by exhaustive evaluation over all 2^18 assignments, never by a closure.
    - The 144 x_R are exactly the archived U62, S62 and C20 targets of RUN-CERTBIN-c417e0 (instance-sets.json). No new curve or target is sampled.
    - >-
      "S_3's support" is the union support U_k of the Stage-1 affine basis,
      the same set N-F262 draws from, restricted to degree <= 1 columns for
      the random bits.

  proof_search_map:
    see: H-CERTBIN-be6cbd proof_search_map (the hypothesis carries the full map; this proposal adds nothing to it)

  predictions:
    - metric: w = verified W_4 refutations among the 144 unsatisfiable N-CONV draws
      direction: different
      minimum_effect: E-TENSOR w >= 130; E-LINEAR w <= 14; MIXED otherwise (EXP-CERTBIN-ddfe75 NC-DR-1)
    - metric: rank of the degree-4 projection of M_4, N-CONV against S_3 at the same x_R
      direction: different
      minimum_effect: equal on every instance (a theorem, L-TOP); any difference is an instrument defect

  minimal_test:
    design: >-
      One draw per archived x_R per arm (seeded PCG64 streams). Rejection
      sampling to one unsatisfiable system and one satisfiable control per
      slot. M_4, W_4 and the ell-substituted R'_4 on every kept system with
      the pinned fast engine crypto_autoresearcher.gf2. Degree-disciplined
      certificates are verified by independent code.
    controls:
      - S_3 reference (archived U62, C20, S62; regression against RC-1)
      - N-ELL144 (fresh, red-team O2 rule) and N-ELL20 (archived)
      - same-support nulls N-AFF62 and N-F262 (archived)
      - N-CONVL and N-CONV17 (secondary ladder rungs)
      - satisfiable controls in every fresh arm
    required_metrics: [w and CP95, M_4 rate, R'_4 profiles, ladder rates at W_4]

  falsification_conditions:
    - E-TENSOR is falsified iff w <= 72 of 144.
    - E-LINEAR is falsified iff w >= 73 of 144.
    - A refuted satisfiable control, or a counted refutation whose certificate fails, falsifies the instrument (void run), never either reading.

  confounders:
    - >-
      Random linear bits break the block symmetry of S_3's linear part
      (v_j and v_{9+j} share a coefficient). So N-CONV randomizes two things
      at once: the Semaev linear coefficients and that symmetry. N-CONVL
      isolates the constant.
    - >-
      N-CONVL systems are S_3 descents for another curve constant b' at x_R
      that are generally NOT x(2E) targets of that curve. Its reading mixes a
      curve change with a target-class change.
    - The constant bit is random only where bit k of B is 1 (S_3's support), so b' is restricted to a sub-cube.

  interpretation_limits:
    - >-
      TENSOR would mean that S_3's lower-degree part is not NEEDED at this
      cell, relative to uniform random bits on S_3's support. It is not an
      exact account of the mechanism (KN-OPEN-3c8f51 resolution criterion 3
      stays open).
    - n = 17 only; no transfer to n = 19 (KN-OPEN-3c8f51 item B) is assumed.
    - x(2E) modulation is not tested (every x_R here is a subgroup target).

  heuristic_assumptions: []
  heuristic_assumptions_note: No heuristic is assumed. Every quantity is an exact closure measurement on drawn systems.
  target_complexity: null
  target_complexity_note: No complexity claim.
  dominated_by: >-
    Per attempt at m = 2: oracle A (2^9 = 512 quadratic root-findings over V)
    decides satisfiability and returns the solutions; it dominates every
    closure here. For the DLP at q = 32603: parallel Pollard rho, about 160
    group operations (RT-20260924-d95e70 baseline_comparison). Checked against
    oracle A, Pollard rho and BSGS on time and memory as in EV-CERTBIN-4a9d2f;
    FES and WDSat not compared.
  sota_delta: zero on every ECDLP cost axis (time, memory, data)
  test_boundary:
    field: F_2[t]/(t^17 + t^3 + 1)
    m: 2
    l: 9
    V: '{deg < 9} (polynomial basis)'
    curve: A = 97044, B = 126251 (#E = 4 * 32603)
    targets: the 144 archived x_R of RUN-CERTBIN-c417e0 (U62, S62, C20)
    closures: M_4, W_4, R'_4 (ell-substituted); no D >= 5
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  recommended_priority_note: First in CERTBIN per DEC-20260924-e61f3b rerank; not above exponent-targeting ECC work elsewhere.
