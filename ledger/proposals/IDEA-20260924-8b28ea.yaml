idea:
  id: IDEA-20260924-8b28ea
  question_id: RQ-CERTBIN-836ce2
  question_ids: [RQ-CERTBIN-836ce2]
  open_problem_id: KN-OPEN-3c8f51
  added: '2026-09-24'
  proposed_by: coordinator
  origin: >-
    Red team RT-20260924-d95e70 (TASK-20260924-d95e70), required control RC-A;
    adopted by DEC-20260924-e61f3b (RC-A response and next action NA-2).
  status: proposed
  status_note: >-
    Designed into H-CERTBIN-be6cbd and EXP-CERTBIN-ddfe75 by
    DEC-20260924-833c70 on the day it was recorded. This record is not edited
    when that happens.
  title: >-
    N-CONV. Keep S_3's exact quadratic part phi_{x_R}(Q) (the rank-16 image of
    the 17 convolution forms) at each of the 144 archived RC-1 targets x_R.
    Replace only the linear and constant bits by uniform random bits on S_3's
    support. Measure the degree-4 closures M_4 and W_4, the ell-substituted
    R'_4 fall profile (RC-B), and degree-disciplined certificates (RC-D),
    beside a null ladder. Question: does the degree-4 refutation at n = 17
    come from the convolution tensor or from the rest of S_3?
  class: control

  claim: >-
    CEILING FIRST. No cost claim of any kind. At m = 2, oracle A (2^9
    root-findings per attempt) decides satisfiability outright, and parallel
    Pollard rho dominates the DLP. This control only locates which part of the
    S_3 system carries a degree-4 refutation property that is already
    measured.

    At the RC-1 cell (n = 17, f = t^17 + t^3 + 1, m = 2, l = 9,
    V = {deg < 9}, curve A = 97044, B = 126251), W_4 refutes every
    unsatisfiable S_3 subgroup-target attempt of the Stage-1 arm (386/386,
    quoted per DEC-20260924-e61f3b NA-4). The same-support random bilinear
    nulls give 0/62 each, and N-ELL (one linear fall in an otherwise generic
    system) gives 0/20 (KN-FIND-5a8d3e). Neither null shares S_3's quadratic
    part. There are two readings:
    E-TENSOR: the quadratic part phi_{x_R}(Q) carries the property. Then
      systems that keep it and have random lower-degree bits are refuted by W_4
      at S_3's rate (>= 90% of unsatisfiable draws).
    E-LINEAR: S_3's specific linear/constant part is load-bearing. Then those
      systems behave like N-ELL (<= 10% refuted).
    Either outcome, and MIXED, is possible and decidable from predefined
    counts with exact CP95 intervals.

  mechanism: >-
    STRUCTURE OF THE DESCENDED SYSTEM. Read from
    experiments/EXP-CERTBIN-e94b27/impl/macaulay.py (s3_multilinear) and the
    red-team structure reading (j7-mechanism/structure.json, 92/92):
    S_3(x_1, x_2, x_R) = phi(x_1 x_2) + x_R^2 (x_1 + x_2)^2 + B, with
    phi(y) = y^2 + x_R y. In the Boolean variables:
    - the quadratic part of f_k is sum_s [phi(t^s)]_k Q_s, where
      Q_s = sum_{i+j=s} v_i v_{9+j}. It has rank 16 over the 17 convolution
      forms, and its cokernel functional c_k = Tr(t^k / x_R^2) gives the
      linear fall ell = v_0 + v_9 + Tr(B / x_R^2);
    - the linear part is [x_R^2 t^{2j}]_k (v_j + v_{9+j}), which depends on
      x_R only;
    - the constant is bit k of B.
    COORDINATOR READING, disclosed: the curve coefficient B enters the
    descended system ONLY through the constant column. The curve otherwise
    enters through which x_R are targets (x(2E)). The linear part is Semaev
    structure at x_R, not curve data. So "tensor vs curve" (RC-A) splits into
    three parts: the quadratic tensor, the Semaev linear part, and the curve
    constant. N-CONV holds the curve-selected x_R fixed and randomizes the
    linear and constant parts together. The secondary rung N-CONVL randomizes
    only the constant. The secondary rung N-CONV17 keeps the convolution
    forms but removes the rank-16 cokernel (T = identity), so it has no linear
    fall at degree 2.

    WHY E-TENSOR IS PLAUSIBLE (Coordinator derivation L-TOP, stated exactly
    in H-CERTBIN-be6cbd). The degree-4 part of every M_4 row mu*f_k depends
    only on the quadratic part q_k. So the rank P of the degree-4 projection of
    M_4, and the space Z_top of row combinations whose degree-4 part vanishes,
    are identical for S_3 and for any system with S_3's quadratic part at the
    same x_R. The fallen dimension is dim Z_top minus the number of true
    syzygies. S_3's M_4 has 964-978 fallen dimensions against 323 for
    semi-regular nulls, and 98-112 non-trivial syzygies (RT-20260924-d95e70
    J7, J8). A random lower-degree part is not expected to lift more of Z_top
    into syzygies than S_3's special one does. N-CONV should then carry at
    least as many degree falls as S_3.
    WHY E-LINEAR IS PLAUSIBLE. A refutation needs falls that combine to 1,
    not just many falls. The red team found that S_3's non-ell falls alone
    fill W^(1) = B_{<=4}, but those falls are specific polynomials. With random
    lower parts they are different polynomials. The random-model reading that
    was exact for N-ELL and the nulls may transfer to N-CONV.

  novelty_status: unverified
  novelty_note: >-
    An internal control on an internal measurement. No external novelty is
    claimed or checked.
  citations:
    - ref: RT-20260924-d95e70 (coordination/review/certbin-20260924-3d7e1a/reviews/TASK-20260924-d95e70/red-team-report.yaml)
