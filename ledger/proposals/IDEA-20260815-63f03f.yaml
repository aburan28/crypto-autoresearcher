idea:
  id: IDEA-20260815-63f03f
  question_id: RQ-ECTD-001
  added: '2026-08-15'
  title: >-
    A TRAPDOOR'S SECRET IS A PATH AND PATHS HAVE LENGTH DISTRIBUTIONS:
    measure whether the endpoint curve's public invariants leak the chain
    length, which would bound the search an attacker faces
  class: measurement

  claim: >-
    GOAL-ECTD-001's construction hides a secret isogeny chain. Even if the
    endpoint's weakness is invisible, the chain LENGTH may not be: walking
    further from a starting curve changes statistics an observer can
    compute. If length leaks, the attacker's path search is bounded rather
    than open-ended and the trapdoor's security argument changes
    quantitatively.

  mechanism: >-
    Generate endpoints at several known chain lengths. Compute public
    invariants of each endpoint and test whether a blinded regressor
    recovers the length. Report recovery accuracy against a chance baseline.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-ECTD-001 and H-ECTD-001; grep 'chain length', 'path
      length', 'walk length leakage'.
    results: >-
      The construction's security rests on path recovery being hard; no
      record tests whether the path's LENGTH leaks from the endpoint.
    verdict: >-
      UNVERIFIED. Random-walk length inference is a standard question for
      graph-based constructions; whether it has been asked for this
      construction is a stage-one check.

  object_first_candidate:
    tracked_object: >-
      THE CHAIN LENGTH, as a quantity possibly recoverable from the
      endpoint's public invariants.
    lossiness: >-
      Reducing an endpoint to its public invariants is exactly what an
      observer can do, so the projection is the attacker's own.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while endpoints at known lengths are generable in quantity,
      which follows from the construction being implementable at toy
      scale.

  null_object_control: >-
    NULL 1 -- shuffled length labels, destroying the pairing while
    preserving both marginals; recovery there means the regressor is fitting
    noise. NULL 2 -- endpoints from a walk with randomised length, where
    recovery must be at chance.

  discriminated_from:
    - >-
        The invisibility-classifier record in this series, which asks
        whether trapdoored curves are distinguishable from random; this
        asks whether the secret's length leaks, which is a quantitative
        refinement and would matter even if the classifier finds nothing.
    - >-
        The feasibility-inequality record in this series, whose chain-
        length parameter this record's answer would constrain from the
        security side.

  assumptions:
    - >-
        Endpoints at controlled known lengths are generable in quantity at
        toy scale.
    - >-
        The invariant set is broad enough that a leak would be caught; an
        unlisted invariant is the blind spot, as in the invisibility
        record.

  predictions:
    - metric: >-
        shuffled-label null
      direction: different
      minimum_effect: >-
        FORCED chance recovery; better means the regressor fits noise.
    - metric: >-
        randomised-length null
      direction: different
      minimum_effect: >-
        FORCED chance recovery.
    - metric: >-
        length recovery accuracy from public invariants
      direction: different
      minimum_effect: >-
        The measurement; any above-chance recovery bounds the attacker's
        path search and changes the security argument quantitatively.
    - metric: >-
        which invariant carries the signal
      direction: different
      minimum_effect: >-
        Reported where recovery succeeds, since knowing the carrier is
        what would let the construction be repaired.

  minimal_test:
    design: >-
      Endpoints at four known lengths, fifty per length, blinded regressor
      with cross-validation, both nulls.
    controls:
      - >-
          Shuffled-label null.
      - >-
          Randomised-length null.
      - >-
          Cross-validation with the regressor blinded to labels during
          training.
      - >-
          Generation pipeline held identical across lengths, since a
          pipeline difference would leak length spuriously.
    required_metrics:
      - >-
          Length recovery accuracy against chance, with interval.
      - >-
          Per-invariant importance where recovery succeeds.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        A null shows recovery. The regressor is fitting an artifact and
        the measurement is void.
    - >-
        Length is recoverable. The attacker's path search is bounded,
        which weakens the construction quantitatively and identifies which
        invariant to fix.
    - >-
        Length is not recoverable at this scope. A necessary condition
        holds against the tested invariants at toy scale, which is one of
        several the construction needs.
    - >-
        Endpoints at controlled lengths are not generable. The measurement
        cannot be made and the construction's testability is itself in
        question.

  confounders:
    - >-
        PIPELINE LEAKAGE: if longer walks are generated differently from
        shorter ones, the regressor learns the pipeline rather than the
        walk, which is the same dominant risk as in the invisibility
        record.
    - >-
        TOY-SCALE NON-TRANSFER: length leakage at short walks may vanish
        at cryptographic lengths and vice versa, so neither outcome
        extrapolates.

  interpretation_limits:
    - >-
        Tests one necessary condition; a null result is not a security
        argument.
    - >-
        Scoped to the tested invariants, lengths and toy scale.
    - >-
        Recovery would bound an attacker's search rather than break the
        construction outright.

  heuristic_assumptions:
    - id: HEUR-ECTD-LEN-1
      statement: >-
        A non-backtracking walk of sufficient length in the isogeny
        graph produces an endpoint whose public invariants are
        independent of the walk's length.
      rigorous_support: >-
        Rigorous ingredient: rapid mixing of the isogeny graph implies
        the endpoint distribution converges to uniform, after which
        additional steps change nothing observable -- and the mixing
        bound is a theorem for supersingular graphs. THE GAP:
        convergence is asymptotic in walk length, and at the SHORT
        lengths a trapdoor would want for holder efficiency the
        distribution may be far from mixed, which is precisely the
        regime where length would leak.
      falsification_condition: >-
        Above-chance length recovery at the walk lengths the
        construction would actually use.
      validation_plan: >-
        SAMPLE: >= 4 lengths x >= 50 endpoints, spanning short to well-
        mixed. COMPARISON: recovery accuracy as a function of length.
        TAIL CHECK: the shortest walks, where leakage is most expected.
        TRANSFER: none beyond toy scale.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is endpoint generation at controlled lengths
      plus invariant extraction.
    memory_exponent: >-
      Negligible at toy scale.
    best_known: >-
      The incumbent is the mixing argument that justifies treating walk
      endpoints as uniform, which this measures at the short lengths a
      trapdoor would use.
    hidden_overhead: >-
      Short walks are where the trapdoor wants to operate and where mixing
      arguments are weakest, which is why the measurement targets them.
    tradeoff_note: >-
      Longer chains hide length better and cost the holder more, which is
      the same tension the feasibility inequality prices from the cost
      side.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing is mounted. As a
    length-leakage measurement for this construction: none exists here. Not
    null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: measured recoverability of
    the secret chain length from an endpoint's public invariants across the
    walk lengths a trapdoor would use, with pipeline and label nulls,
    identifying which invariant carries any signal.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that controlled-length endpoints are generable. 0.5 that the
    generation pipeline can be held identical across lengths, which is the
    dominant false-positive risk. 0.45 that length is recoverable at short
    walks, which would matter for a construction that wants short chains for
    holder efficiency.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
