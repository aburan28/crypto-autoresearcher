  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write Theorems F and F+- with all
      collision types per convention; compute F(l) as exact integer sums at
      every ladder prime; check the k = 2 and fixed-budget slices by hand;
