  assumptions:
    - l prime, l >= 5, so 2 and 3 are units and beta-differences in {1, 2, 3} are invertible.
    - One new element per counted addition; the P -+ Q trick, block or simultaneous-inversion variants (GWZ's 0.38 / 0.36-type rows) are a different cost unit and are out of scope.
    - Collision detection is immediate; batched detection is a different schedule.
    - The floor is a theorem; predictions M3-M5 about measured constants are empirical and toy-tier.

  proof_search_map:
    bottleneck: >-
      The overlap term delta_ovl: the floor reduces the RQ's constant to it,
      and whether it is bounded away from zero over the declared arithmetic
      family (E1) or can be driven to zero (E2) is the only open part of the
      lower half of the problem.
    baseline_embedding:
      parameter_slice: >-
        k = 2 (rate (1, 1, 0)): floor 4/3 equals interleaved BSGS (recalled),
        attained because two arithmetic progressions with steps 1 and m never
        overlap before saturation; fixed budget 1.5 sqrt l: two-class bound
        0.5625 equals the BSGS figure, three-class bound 0.75 >= 23/32.
      reproduction_check: >-
        Frozen fixture: at three ladder primes near 2^10, 2^12, 2^14 the
        covered-set counter must give delta_ovl = 0 for every n below
        saturation on the k = 2 slice (BSGS), E/sqrt l within 2/sqrt l of 4/3,
        and |C_n| <= P_n at every n of every schedule; any violation is an
        instrument defect.
    observation_collision:
      observable: The integer pair (P_n, |C_n|) for every n, and the floor F(l).
      distinct_preimage_search: >-
        Two schedules with the same (n_0, n_1, n_2) trajectory (same P_n) but
        different steps must be exhibited with different |C_n| -- otherwise the
        overlap term is not schedule-dependent and E2 is moot. Candidates:
        mu = 1 versus mu = 0.75 at rate (1, 1, 1).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: The pair-count envelope P_n as an upper invariant for |C_n| valid for every schedule in M3(B), including adaptive ones.
        predicted_gain: A schedule-free rigorous lower clip 2/sqrt 3 on the RQ's constant (plain) and 0.8165 / 0.7454 / 0.7559 under the declared negation conventions.
      - transform: telescoping_potential
        proposed_object: E(l) - F(l) as a telescoped sum of per-n deficits split into imbalance and overlap.
        predicted_gain: Two nonnegative, separately certifiable terms instead of one fitted constant.
    quantifier_order: >-
      THEOREM F: FOR ALL primes l >= 5, FOR ALL (possibly adaptive) algorithms
      in M3(B), FOR ALL n: |C_n| <= (n + 3)^2 / 3; hence E(l) >= F_3(l).
      THEOREM F+-: FOR ALL primes l >= 5, FOR ALL algorithms in M3({0, 1, 2})
      under N-CROSS: E >= (2/3) sqrt(3 l / 2) - O(1); under N-ALL:
      E >= (sqrt 5 / 3) sqrt l - O(1); FOR M3({0, 1, -1}) under N-ALL:
      E >= (2/3) sqrt(3 l / 2) - O(1). EMPIRICAL (E1/E2, M4, M5): FOR the
      declared schedule family and ladder only. NOT CLAIMED: any schedule
      outside M3, the P -+ Q cost unit, non-generic groups.
    method_ceiling:
      strongest_certifiable_claim: >-
        "c(schedule) >= 2/sqrt 3 for every three-class schedule, with the gap
        split into measured imbalance and overlap terms; under the stated
        negation conventions the floors are 0.8165, 0.7454 and 0.7559." The
        floor cannot certify the value of c, cannot certify optimality of any
        schedule, and says nothing about rho-type walks (unbounded beta), whose
        floor is the generic 0.9428.
      nearby_object_control: >-
        Interleaved BSGS, the k = 2 member, where the floor is ATTAINED
        (overlap identically zero before saturation); and the truly random
        three-sequence walk, where the class model does not apply (target-
        dependent solved set, generic floor 0.9428, measured mean about
        sqrt(pi/2) = 1.2533). A method reporting overlap zero for grumpy at the
        1.5 sqrt l budget contradicts 23/32 and is wrong.
    proof_obligations:
      - claim: Every computed element of every declared schedule has beta in B, starting elements included (induction on the schedule).
        responsibility: correctness
      - claim: One x per cross-class pair; none per same-class pair (plain); the two negation conventions as stated, including the s = -1 loss of the giant-giant second equation.
        responsibility: correctness
      - claim: Adaptive algorithms follow one computation path until their first collision, so the pair bound holds for them.
        responsibility: scope
      - claim: AM-QM and the Lagrange maximum 4/5 at (1/5, 2/5, 2/5); (7/9) at equal rates; (2/3) for B = {0, 1, -1}.
        responsibility: size
      - claim: F_3(l) and the negation floors as exact integer sums, and their (2/3) sqrt(l / kappa) - O(1) asymptotics with the O(1) written out.
        responsibility: strictness
      - claim: The k = 2 slice reproduces 4/3 and 0.5625; the three-class bound 0.75 is consistent with 23/32.
        responsibility: baseline
      - claim: The decomposition identity sums exactly to E(l) - F(l) on the counter, at every ladder prime.
        responsibility: interface
    not_applicable_reason: null

