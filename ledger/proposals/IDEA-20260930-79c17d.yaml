idea:
  id: IDEA-20260930-79c17d
  question_id: RQ-GRUMPY-964876
  goal_id: null
  goal_id_note: >-
    RQ-GRUMPY-964876 carries goal_ids [] at filing time (context/L4-GENERIC.md).
    Left null deliberately.
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE THREE-CLASS COVERAGE FLOOR AND THE OVERLAP-LOSS DECOMPOSITION OF THE
    GRUMPY CONSTANT: any (even adaptive) generic schedule whose computed
    elements carry one of three fixed x-coefficients solves at most
    n0 n1 + n0 n2 + n1 n2 <= (n + 3)^2 / 3 targets after n additions, so its
    all-target mean is at least (2/sqrt 3) sqrt l - O(1) = 1.1547 sqrt l; with
    x-coordinate matching the floor is 1.1547/sqrt 2 = 0.8165 when only
    cross-sequence matches are checked and drops to sqrt(5)/3 = 0.7454 (best
    class balance) or 2/sqrt 7 = 0.7559 (equal rates) when within-sequence
    matches are also checked and the giants' coefficients are (1, 2) -- a
    convention-level reason the negation map need NOT divide the grumpy
    constant by sqrt 2; the exact mean then splits as floor + imbalance loss +
    overlap loss, each an integer sum on the covered-set instrument
  class: mechanism

  claim: >-
    SETTING. Generic group of prime order l >= 5, realised as Z/l with
    generator 1; target x uniform on Z/l. COST UNIT: one group addition per
    newly computed element. The three starting elements (b_0 = 0, g_0 = x,
    h_0 = s x) are counted as free and the step precomputation (m P,
    (m + 1) P, s Q) is reported separately, as in IDEA-20260906-7bd805; any
    other convention shifts every floor below by O(1) additions. Table lookups,
    comparisons and storage are charged separately (RQ constraint).

    MODEL M3(B). A (possibly adaptive) generic algorithm every computed element
    of which is [alpha + beta x]P with alpha known and beta in a fixed set
    B = {beta_0, beta_1, beta_2} whose pairwise differences are units mod l;
    a collision is detected the moment it occurs. Write n_i for the number of
    elements of class i after n additions (n_0 + n_1 + n_2 = n + 3). The
    Bernstein-Lange two-grumpy-giants-and-a-baby algorithm with
    B = {0, 1, 2} (giant-2 start multiplier s = 2) and every schedule of the
    families declared in IDEA-20260906-7bd805 / IDEA-20260906-c9ac0d (mu grid,
    directions, rate vectors; s = -1 gives B = {0, 1, -1}) lie in M3(B). The
    degenerate s = 1 has only two classes and falls to the two-class floor 4/3.

    THEOREM F (PLAIN MATCHING; elementary, unconditional). For every
    algorithm in M3(B) and every n, |C_n| <= n_0 n_1 + n_0 n_2 + n_1 n_2 <=
    (n + 3)^2 / 3, where C_n is the set of targets solved within n additions.
    PROOF. Two elements of classes i != j are equal iff
    (beta_i - beta_j) x = alpha_j - alpha_i, one x per pair (unit
    coefficient); two elements of one class with distinct alpha are never
    equal. Adaptivity does not help: until its first collision every equality
    test an algorithm makes returns 'unequal', so the computation path is the
    same for every target not yet solved, and C_n is a union over one fixed
    list of pairs. Sum over pairs; AM-QM. Since mean = sum over n >= 0 of
    (1 - |C_n| / l),
      E(l) >= F_3(l) := sum over n >= 0 of max(0, 1 - (n + 3)^2 / (3 l))
           = (2/sqrt 3) sqrt l - O(1),  2/sqrt 3 = 1.154700.
    For k classes the same argument gives (2/3) sqrt(2k/(k - 1)) sqrt l:
    4/3 at k = 2 (attained by interleaved BSGS, which has no overlaps),
    1.1547 at k = 3, 1.0887 at k = 4, and (2/3) sqrt 2 = 0.9428 for
    unrestricted generic algorithms.

    THEOREM F+- (X-COORDINATE MATCHING; elementary). Under the negation map an
    element is matched on its class {y, -y}. A cross-class pair now yields up
    to two equations ((beta_i - beta_j) x = ... and (beta_i + beta_j) x = ...,
    the second only if beta_i + beta_j is a unit), and a same-class pair yields
    one equation 2 beta_i x = -(alpha + alpha') iff beta_i != 0 AND the
    implementation checks within-sequence matches. Two declared conventions:
    N-CROSS (only cross-sequence matches checked): |C_n| <= 2 (n+3)^2 / 3, floor
    (2/3) sqrt(3/2) = 0.8165 = 1.1547 / sqrt 2. N-ALL with B = {0, 1, 2}:
    |C_n| <= 2 (n_0 n_1 + n_0 n_2 + n_1 n_2) + C(n_1, 2) + C(n_2, 2), whose
    maximum on the simplex is (4/5)(n + 3)^2 at rates (1/5, 2/5, 2/5) (Lagrange,
    hand-derived) and (7/9)(n + 3)^2 at equal rates; floors sqrt(5)/3 = 0.7454
    and 2/sqrt 7 = 0.7559. N-ALL with B = {0, 1, -1} (s = -1): the giant-giant
    cross pair loses its second equation (beta_1 + beta_2 = 0), the maximum is
    (2/3)(n + 3)^2 at equal rates, floor 0.8165 again. General form: if
    |C_n| <= kappa n^2 then E >= (2/3) sqrt(l / kappa) - O(1).

    BASELINE REPRODUCTION (hand-checked against KN-LIT-fbe4e0's relayed
    figures). At a fixed budget of 1.5 sqrt l additions the bound gives success
    <= min(1, kappa 2.25): for two classes kappa = 1/4 gives 0.5625, exactly the
    BSGS figure (BSGS attains its bound); for three classes kappa = 1/3 gives
    0.75 >= 0.71875 = 23/32, the grumpy figure -- so at that budget grumpy sits
    1/32 below the three-class maximum, the overlap density IDEA-20260906-7bd805
    derives independently.

    DECOMPOSITION (exact identity). For any schedule,
    E(l) - F_3(l) = (1/l) sum_n [ ((n+3)^2/3 - P_n)^+ + (P_n - |C_n|) ] up to
    saturation terms, with P_n = n_0 n_1 + n_0 n_2 + n_1 n_2: an IMBALANCE loss
    (class sizes off one third) plus an OVERLAP loss (pairs hitting an
    already-solved target). Both are integers per n on the target-independent
    covered-set counter of H-GRUMPY-1ead49 (Theorem A), so the RQ's constant
    becomes c = 2/sqrt 3 + delta_imb + delta_ovl with two separately
    certifiable, nonnegative terms.

    THE TWO EXPLANATIONS. E1 (OVERLAP IS FORCED): for every schedule in the
    declared arithmetic family, delta_ovl(l) stays >= 0.03 at the top ladder
    rungs -- three arithmetic collision lattices cannot tile Z/l without
    intersecting before saturation, and the grumpy constant is the floor plus a
    positive geometric overlap integral. E2 (FLOOR NEARLY ATTAINABLE): some
    schedule has delta_ovl(l) <= 0.01 at the top two rungs, decreasing in l;
    then the Bernstein-Lange schedule is not optimal for its own class and the
    class optimum is 2/sqrt 3 + o(1). Either is a result; the conjectural
    1.25 (Galbraith-Wang-Zhang, as relayed by IDEA-20260906-7bd805) would put
    delta at about 0.095.

  mechanism: >-
    The tracked object is the pair count P_n = sum_{i<j} n_i n_j together with
    the solved set C_n; P_n is the cardinality of the multiset of 'candidate
    logarithms' the computation has produced, and |C_n| is the size of its
    support. OBJECT FRAME: representation = the coefficient pairs (alpha, beta)
    carried beside the elements; operation set Sigma = {append one element to
    one class}. LOSSY-PROJECTION TEST: (lists) -> (n_0, n_1, n_2) forgets every
    alpha and every target; it propagates deterministically under Sigma (one
    coordinate increases by one) and is genuinely lossy (three integers for
    3 n residues). It is a partial-action object in the trichotomy of
    IDEA-20260806-c5d183 (arbitrary translation does not preserve it). It is an
    UPPER envelope, not a projection of C_n: |C_n| <= P_n, and the gap
    P_n - |C_n| is the overlap the schedule pays. That is why the floor is a
    proof route for the lower half of the constant and an instrument for the
    upper half: Theorem A (H-GRUMPY-1ead49) gives |C_n| exactly, this record
    gives the envelope it is measured against. THE NEGATION POINT: under
    x-coordinate matching the giants' self-pairs become informative (2 beta x =
    -(alpha + alpha')) while the baby's do not (beta = 0), so the envelope's
    shape changes, not just its scale; whether the negation constant divides
    the plain one by sqrt 2 -- the question IDEA-20260906-c9ac0d poses -- then
    depends on a DETECTION convention the RQ has not fixed. Under N-CROSS the
    envelopes scale by exactly sqrt 2; under N-ALL with s = 2 they do not
    (ratio 1.1547 / 0.7559 = 1.5275 at equal rates, hand-computed), and with
    s = -1 the giants are negation-redundant and the envelope falls back to the
    N-CROSS value.

