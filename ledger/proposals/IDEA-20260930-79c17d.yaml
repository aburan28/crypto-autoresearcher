      s in {2, -1}, giant-2 direction +-1, rates (1,1,1), (2,1,1), (1,2,2)) in
      three conventions (plain, N-CROSS, N-ALL), record per n the integers
      n_i, P_n, |C_n|, the imbalance and overlap deficits, and E(l); cross-check
      the counter against per-target exhaustive simulation at every prime of
      this stage (integer equality). M1 and M2 are decided here.
      STAGE 2 (hours): extend the ladder to primes near 2^16, 2^18, 2^20 with
      the counter (per-target simulation where affordable, labelled otherwise);
      M3-M6 decided at the top rungs. One prime near 2^14 repeated on a
      self-generated prime-order toy curve: counts must equal the Z/l counts to
      the integer.
      OUTCOME TABLE. E1: the constant is floor + a positive overlap integral for
      the whole family; the RQ's interval for c is clipped below by 2/sqrt 3 with
      the measured delta_ovl beside it. E2: report the schedule and its
      convergence; the grumpy schedule is suboptimal in its class. ARTIFACT: any
      M1 violation, failed positive control, or drifting residual: void.
      FALSIFICATION THRESHOLDS, FIXED NOW: as in M1-M5.
    controls:
      - Positive control interleaved BSGS (k = 2), floor attained (blocking).
      - Truly random three-sequence walk reported as outside the model (blocking; no decomposition computed).
      - Instrument identity |C_n| <= P_n at every n (blocking).
      - Per-target exhaustive simulation cross-check at every Stage-1 prime (integer equality).
      - Elliptic consistency arm at one prime (instrument check, never a finding).
      - Floor table hashed before any mean is read.
    required_metrics:
      - per (prime, schedule, convention) the exact mean as an integer ratio, E/sqrt l, F(l), delta_imb, delta_ovl
      - per n the integers n_i, P_n, |C_n| (compressed, hashed)
      - fixed-budget success at 1.5 sqrt l per schedule
      - M4, M5 differences and M6 ratios with the floor values beside them
      - storage (table sizes) and lookup counts, reported separately from additions

  falsification_conditions:
    - 'F1. Any E(l) < F(l) on a prime l: a schedule leaves M3(B) or the counter is wrong (the theorems are proofs); nothing is read until localised to an (n, x).'
    - 'F2. BSGS shows nonzero overlap before saturation or misses 4/3 by more than 2/sqrt l at three primes: the counter is wrong.'
    - 'F3. E2 falsified if every schedule has delta_ovl >= 0.03 at both top rungs; E1 falsified if some schedule has delta_ovl <= 0.01 at both and decreasing.'
    - 'F4. |c_neg(N-ALL) - c_neg(N-CROSS)| <= 0.005 at the top rungs for s = 2: the within-giant matches do not move the constant and the floor-tracking reading of the negation factor is falsified.'
    - 'F5. |c_neg(s = -1) - c_neg(s = 2)| <= 0.005 under N-ALL: negation-redundancy of s = -1 giants is not measurable at this ladder.'
    - 'F6. Budget exhaustion or crash: infrastructure outcome under AGENTS.md rule 3.'

  confounders:
    - The starting-element and precomputation convention shifts every mean and every floor by O(1) additions; both are computed under one declared convention and the residual is read on that convention only.
    - Under N-ALL a same-sequence match must be looked up in the sequence's own table; an implementation that skips it is N-CROSS whatever it is called. The convention is recorded per run.
    - Rounding of m makes mu effectively l-dependent at O(1/sqrt l) (IDEA-20260906-7bd805); delta_ovl is reported per realised (m, l).
    - Near saturation the floor's max(0, .) truncation and the solved set's last few targets interact; saturation terms are computed exactly, not approximated.
