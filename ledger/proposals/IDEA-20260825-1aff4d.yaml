  batch: EC-STRUCTURE-20260825
  cluster: 'C4-harmonic: attacking DL circularity head-on'
  title: 'THE DUAL SIDE IS NOT CIRCULAR: bounds on exponential sums over the INDEX of an algebraic function
    of the point are classical, while the H-PSEUDO sums are over the POINTS of an algebraically-defined
    set with a DL in the exponent -- test whether Parseval over the correct pair of dual groups transfers
    anything, or prove the transfer vacuous'
  class: theory
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: 'Nontrivial bounds for sums of the form sum over k of e(a x(kP)/p) exist in the literature
    and are recalled, not verified; the exact strength and hypotheses are not asserted here and must be
    retrieved before any use. The proposed contribution is the duality question: whether DL circularity
    is intrinsic or is an artifact of which group the sum is taken over.'
  claim:
    semantic_part: The obstruction recorded in this ledger is that the Fourier coefficient of an algebraically
      defined factor base has a discrete logarithm in its exponent and so is out of reach of Weil-type
      machinery; the dual family -- sums over the index k of an additive character of an algebraic coordinate
      function -- has the algebraic content in the SUMMAND instead, and is exactly the family classical
      bounds address.
    evaluator_part: 'Unestablished: whether any Parseval or Poisson relation connects the two families
      in a way that is not vacuous. The default expectation is that the transfer loses a factor that destroys
      it, and identifying that factor precisely is the deliverable if so.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Write both families explicitly with all groups named: the H-PSEUDO family sums an additive character
    of the index over an algebraically defined point set; the classical family sums an additive character
    of an algebraic coordinate over an interval of indices.'
  - Apply Parseval on the pair (E(F_p), its dual) and on the pair (F_p, its dual) and see which combination,
    if any, expresses one family in terms of the other.
  - 'Quantify the loss in any transfer: the number of terms, the completion factor, and whether the resulting
    bound is below the trivial bound.'
  - If vacuous, record the exact factor that kills it. That upgrades DL circularity from 'the machinery
    does not apply' to 'the machinery applies and loses exactly this much', which is a materially stronger
    obstruction statement.
  lossy_projection_test:
    tracked_object: a Fourier coefficient of the factor-base indicator
    what_is_discarded: the set itself, keeping one complex number per frequency
    propagation: 'convolution: Fourier coefficients multiply under sumset formation, which is exactly
      the index-calculus relation'
    verdict: PASSES and is the standard analytic object; the record's content is a change of DUAL GROUP,
      not of object.
  predictions:
  - id: P1
    status: established_formula
    statement: Parseval holds on both dual pairs and the two sum families are expressible in each other's
      terms with an explicit kernel.
  - id: P2
    status: unestablished
    statement: The transfer's loss factor exceeds the gain from any classical bound, making the route
      vacuous.
  - id: P3
    status: unestablished
    statement: The loss factor is exactly the size of the factor base, so the transfer is vacuous for
      precisely the B that index calculus needs.
  minimal_discriminating_test:
    status: specified_not_run
    test: Symbolic derivation of the transfer with explicit constants; toy-scale numerical verification
      that both sides of the identity agree exactly for small p, which validates the derivation independently
      of any bound.
    pass: The identity verifies numerically and the loss factor is derived.
    fail: A derivation error surfaces as a numerical mismatch, scoping out that derivation only.
  controls:
  - 'The multiplicative group F_p^*, where the DL is a character and both families collapse to classical
    Gauss sums with known answers: the positive control that the machinery is being applied correctly.'
  - A random subset in place of the factor base, giving the square-root-cancellation null against which
    any structure must be read.
  confounders:
  - Completion and truncation losses are where such transfers usually die; they must be tracked explicitly
    and not absorbed into constants.
  - Numerical agreement at small p does not validate an asymptotic bound.
  - The two-to-one x-coordinate map introduces a factor that is easy to lose.
  falsification:
    semantic: A nonvacuous transfer would refute the DL-circularity obstruction as currently stated and
      is the outcome worth having.
    evaluator: Numerical mismatch scopes out the derivation only.
    not_falsification: Failure to locate a classical bound in the literature.
  why_this_is_not_a_variant: IDEA-20260808-726aa3 asks how much cancellation beyond square-root would
    be needed. This record asks the prior question of whether the machinery can be brought to bear at
    all through a change of dual group, which is upstream of any quantitative gap statement.
  limits:
