idea:
  id: IDEA-20260913-1eb65c
  title: Cubic residue of affine y under doubling
  class: representation
  claim: >-
    The cubic residue symbol chi_3(y(P)) = y^{(p-1)/3} in F_p, for p=1 mod 3,
    is a lossy R1 multiplicative-character projection of the affine point.
    Paired with Sigma={[2]}, either (A) chi_3(y([2]P)) is a function of
    chi_3(y(P)) on the three-letter alphabet mu_3 union {0}, or (B) it does
    not close and is priced by (L, b). KN-FIND-ffe1df leaves cubic residue
    characters (family D) open as translation filters and 84755b P3 measures
    d-th power residues of x under translation; this asks doubling-compatibility
    of the cubic residue of y. Stage-0 is a frozen two-value identity
    (chi_3(y), chi_3(y')). No pairing, Miller, or Tate. No exponent gain.
    Attack stage: collision structure.
  mechanism: >-
    Representation: R1 field representation — affine y in F_p, then the
    multiplicative character chi_3(y) = y^{(p-1)/3} (values in mu_3 union {0}).
    Operation set Sigma = {[2]}, then recompute chi_3(y([2]P)). Trichotomy
    class: coordinate-dependent -- chi_3(y) is a function of the affine chart
    and of the choice of a cubic character of F_p^*, not a homomorphism of
    the prime-order subgroup (Theorem C). One-line reason: a multiplicative
    character of one coordinate is not a class function of <P>. R1 class.
    Attack stage: collision structure (a 3-valued predicate), not factor-base
    membership and not pairing transfer.

    LOSSY-PROJECTION TEST against Sigma={[2]}. What is discarded: x, the
    magnitude of y beyond its cubic class, and all other models. Lossy:
    alphabet size 4 (including 0) or 3 on F_p^*, so 1 < M << N. Discard
    compatibility: doubling produces y' as a rational function of (x, y);
    chi_3(y') is then well-defined. Unary closure of chi_3(y') as a function
    of chi_3(y) is Outcome A versus B. If A, the fibres are a block system of
    <[2]> and the open number is canonicalisation from a 3-valued label
    (again not a sum-compatible bucket). If B, measure (L, b) against
    identity, random mu_3 labels, and relabelled Z/NZ.

    Not F4: this is not a pairing into F_{p^k}^*; it is a character of the
    base field applied to one affine coordinate. Miller and Tate are not
    used. Not 84755b P3 (residues of x, translation defect). Not a factor
    base (KN-OPEN-020 does not apply). Not cubical/biextension.
