        (chi_3(y), chi_3(y')) = (7, 1) in F_19. Known-false invariance
        chi_3(y')=7 fails. Null random mu_3 labels are not credited.
    - metric: unary_closure
      direction: different
      minimum_effect: >-
        Outcome A if chi_3(y') is a function of chi_3(y) on the frozen
        curve's affine census. Outcome B if any input class has two outputs.
    - metric: L_and_b
      direction: different
      minimum_effect: If Outcome B, measure L and b against identity, random mu_3, and relabelled Z/NZ.
  minimal_test:
    execution_status: design_only
    design: >-
      STAGE-0 FINITE EXACT IDENTITY (named). Freeze p=19 (p=1 mod 3), A=1,
      B=-1, P=(2,3), [2]P=(16,11) as in IDEA-20260913-fa01b7's designed cell.
      chi_3(u) = u^6 in F_19. REAL pair: 3^6 = 729 ≡ 7 and 11^6 ≡ 1
      (11^2 ≡ 7, 11^4 ≡ 11, 11^6 ≡ 77 ≡ 1). Known-false claim: chi_3(y') = 7
      (invariance). Null object: an independent uniform element of
      {1, 7, 11} (the cube roots of 1 in F_19). Invalid-input reject: y=0
      must be flagged as the zero fibre, not assigned a class in mu_3.
      Unary-closure cell: census of (chi_3(y(Q)), chi_3(y([2]Q))) over affine
      non-singular Q. Nearby-object control: repeat the identity shape on
      one additional p=13 curve (also 1 mod 3), without pooling.
    matched_null: Independent uniform labels in mu_3(F_19) = {1, 7, 11}.
    known_false: chi_3(y([2]P)) = 7 (wrong-value invariance) on the frozen REAL point.
    controls:
      - kind: matched_null
        design: Random mu_3 labels.
      - kind: known_false
        design: Invariance claim output=7.
      - kind: invalid_input
        design: y=0 is the zero fibre, not a mu_3 class.
      - kind: baseline
        design: Same power map applied to x (84755b P3 slice) on the same census.
      - kind: generic_group
        design: Relabelled Z/NZ with a random mu_3 tag.
    required_metrics:
      - cubic_symbol_hold
      - unary_closure
      - L_and_b
    decision_threshold: >-
      REAL pair (7, 1) must match independent recomputation of the two sixth
      powers. Known-false invariance must fail. Unary closure is a separate
      yes/no on this curve. No exponent claim and no pairing claim.
    stopping_rules:
      - Stop at the first failed exact identity or known-false control and classify it as a procedure defect.
      - No run is authorized here.
    required_artifacts:
      - frozen (p, A, B, P, [2]P, chi_3(y), chi_3(y')) manifest
      - REAL / known-false / null / invalid outcomes
      - optional full-curve 3-by-3 occupancy table
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: requires a new approved frozen handoff
  falsification_conditions:
    - Independent recomputation disagrees with 3^6 ≡ 7 or 11^6 ≡ 1 in F_19 (procedure defect; supersede).
    - Unary closure holds and the random-mu_3 control shows the same function (artifact).
    - Scope is the frozen p=19 cell plus the optional p=13 nearby-object cell, not pooled.
  confounders:
    - Computing a pairing or an embedding-degree character instead of y^{(p-1)/3}.
    - Using x instead of y (then the object is 84755b P3).
    - p != 1 mod 3 (chi_3 not F_p-valued).
    - Treating chi_3(0)=0 as a fourth ordinary class in a 3-letter function.
  interpretation_limits:
    - Not F4, not Miller/Tate, not a factor base, not a Kummer-line coordinate.
    - A 3-valued label cannot be an exact sum-compatible bucket (Theorem C).
    - Stage 0 is a calibrator. established_exponent_gain = 0.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-1eb65c
      statement: >-
        For uniform non-2-torsion P with y != 0, chi_3(y(P)) is equidistributed
        on mu_3 up to O(p^{-1/2}) discrepancy. Imitates Weil's bound on
        cubic-character sums of a non-constant regular function on E.
      rigorous_support: >-
        Weil bound |sum_P psi(y(P))| = O(sqrt(p)) for a nontrivial
        multiplicative character psi of F_p^* (recalled pointer to Weil 1948;
        not opened). The cubic character is such a psi when p=1 mod 3.
      random_model_justification: >-
        Pair the Weil bound with the classical statement that a non-constant
        regular function behaves like a uniform F_p^* element versus
        multiplicative characters of bounded order. No smoothness law.
      validation_plan: >-
        Exact census on the frozen p=19 curve of chi_3(y) versus 1/3 on
        {1,7,11}, excluding y=0. Tail check: list the three multiplicities.
        Nearby-object: one p=13 census, not pooled.
      falsification_condition: >-
        On the p=19 census, some mu_3 class is empty or holds more than half
        of the y != 0 points (gross departure from 1/3).
    - id: H2-IDEA-20260913-1eb65c
      statement: >-
        Predicted Outcome B: chi_3(y o [2]) is not a function of chi_3(y) on
        a generic ordinary prime-order curve with p=1 mod 3.
      rigorous_support: No theorem; the 3-by-3 occupancy table decides.
      random_model_justification: Exact finite table.
      validation_plan: Exhaustive (chi_3(y), chi_3(y')) table on p=19; a single input class with two outputs is Outcome B.
      falsification_condition: Each occupied input class has exactly one output (Outcome A on that toy).
