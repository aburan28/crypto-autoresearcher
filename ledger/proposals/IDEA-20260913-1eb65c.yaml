  assumptions:
    - p = 1 mod 3 so that (p-1)/3 is an integer and mu_3 subset F_p^*.
    - Public short-Weierstrass, prime-order subgroup, odd characteristic.
    - chi_3 is the power map y |-> y^{(p-1)/3} in F_p, not a residue symbol in a number field and not a pairing.
    - y=0 is a zero of chi_3 and is charged as a special fibre, not as a cubic class.
    - No Miller/Tate/MOV computation is performed or assumed.
  predictions:
