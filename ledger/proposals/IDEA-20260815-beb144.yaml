idea:
  id: IDEA-20260815-beb144
  question_id: RQ-CLGRP-66ab7f
  added: '2026-08-15'
  title: >-
    A HIDDEN-ORDER GROUP IS ONLY AS TRUSTLESS AS ITS DISCRIMINANT SELECTION:
    enumerate the discriminant properties that would weaken class-number
    computation and check whether proposed selection procedures can be
    steered
  class: control

  claim: >-
    Class groups are proposed as trustless because no party knows a
    factorisation. That holds only if the discriminant cannot be chosen
    adversarially to make the class number easy. Whether a party controlling
    discriminant selection can steer toward weak instances -- small class
    number, smooth class number, or special forms -- is a selection-
    procedure question that determines whether trustlessness survives.

  mechanism: >-
    Enumerate discriminant properties correlated with easier class-number
    computation. For each proposed selection procedure, determine whether a
    party influencing its inputs can bias toward those properties, and
    measure the achievable bias empirically at toy sizes.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-CLGRP-001 objective; grep 'discriminant selection',
      'trustless', 'adversarial parameter'.
    results: >-
      Trustlessness is the stated motivation; no record examines whether
      the selection procedure itself can be steered.
    verdict: >-
      UNVERIFIED. Adversarial parameter selection is a standard concern
      for hidden-order groups and is likely discussed in the class-group
      cryptography literature; the stage-one check is blocking.

  object_first_candidate:
    tracked_object: >-
      THE ACHIEVABLE BIAS in discriminant properties under a party
      influencing the selection procedure.
    lossiness: >-
      Reducing a discriminant to a weakness bit discards its other
      structure, so the properties are enumerated and reported
      individually rather than aggregated.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while selection procedures are specified concretely;
      procedures specified only informally cannot be analysed and are
      reported as such.

  null_object_control: >-
    NULL 1 -- unbiased selection, giving the baseline distribution of each
    weakness property. NULL 2 -- a procedure with no adversarial input at
    all (e.g. a fixed published discriminant), where achievable bias must be
    zero.

  discriminated_from:
    - >-
        The certified-cost ladder record in this series, which measures
        computation cost for honest discriminants; this asks whether the
        discriminant can be chosen dishonestly.
    - >-
        RSA-modulus trusted-setup concerns, which are the alternative this
        construction claims to avoid; the comparison is the point but the
        mechanisms differ entirely.

  assumptions:
    - >-
        Weakness-correlated discriminant properties are enumerable; an
        unenumerated property is the record's main coverage risk.
    - >-
        Proposed selection procedures are specified concretely enough to
        analyse for steerability.

  predictions:
    - metric: >-
        no-adversarial-input null
      direction: different
      minimum_effect: >-
        FORCED zero achievable bias.
    - metric: >-
        baseline property distribution under unbiased selection
      direction: different
      minimum_effect: >-
        The reference any achievable bias is measured against.
    - metric: >-
        achievable bias per property under each selection procedure
      direction: different
      minimum_effect: >-
        The measurement; any material bias undermines the trustlessness
        claim for that procedure.

  minimal_test:
    design: >-
      Two selection procedures, three weakness properties, both nulls, at
      toy discriminant sizes where class numbers are computable.
    controls:
      - >-
          Unbiased-selection baseline.
      - >-
          No-adversarial-input null.
      - >-
          Weakness properties enumerated in advance and reported
          individually.
      - >-
          Class numbers computed exactly at toy sizes so weakness is
          verified rather than predicted.
    required_metrics:
      - >-
          Achievable bias per property per procedure.
      - >-
          Baseline distributions.
      - >-
          Class numbers computed exactly for sampled discriminants.
      - >-
          List of properties considered and any known to be
          unenumerated.

  falsification_conditions:
    - >-
        The no-input null shows bias. Analysis wrong.
    - >-
        A procedure admits material bias toward weak discriminants. Its
        trustlessness claim fails and that procedure should not be used.
    - >-
        No procedure admits bias. Trustlessness survives against the
        enumerated properties, which is a useful positive scoped to that
        enumeration.
    - >-
        Weakness properties cannot be enumerated meaningfully. The
        analysis cannot conclude and must say so rather than test an
        arbitrary subset.

  confounders:
    - >-
        ENUMERATION INCOMPLETENESS: a weakness property nobody listed is
        exactly what an adversary would target, so a null result binds
        only the enumerated set.
    - >-
        TOY-SIZE WEAKNESS: properties correlated with easy computation at
        toy sizes may not be the binding ones at deployment sizes.

  interpretation_limits:
    - >-
        Analyses selection procedures; makes no security claim about
        class-group constructions generally.
    - >-
        A no-bias result is scoped to the enumerated properties and the
        analysed procedures.
    - >-
        Toy sizes only; property-weakness correlations may differ at
        deployment scale.

  heuristic_assumptions:
    - id: HEUR-CLGRP-SEL-1
      statement: >-
        The enumerated discriminant properties capture the ways a class
        number can be made easier to compute.
      rigorous_support: >-
        Rigorous ingredient: class-number computation cost is governed
        by the class group's structure and the discriminant's size, and
        small or smooth class numbers are demonstrably easier. THE GAP:
        the correlation between discriminant form and class-group
        structure is governed by Cohen-Lenstra heuristics rather than
        theorems, so the enumeration rests on heuristics and could miss
        a structural property entirely.
      falsification_condition: >-
        A discriminant family with easy class-number computation that
        none of the enumerated properties identifies.
      validation_plan: >-
        SAMPLE: >= 500 toy discriminants with exact class numbers,
        correlating computation cost against each enumerated property.
        TAIL CHECK: the easiest-computed discriminants, checked against
        every enumerated property to see whether any is unexplained.
        TRANSFER: none beyond toy sizes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is class-number computation for many toy
      discriminants.
    memory_exponent: >-
      Per-computation working set; modest at toy sizes.
    best_known: >-
      No incumbent steerability analysis exists here; the trustlessness
      claim is stated as a motivation rather than analysed.
    hidden_overhead: >-
      The enumeration's completeness is the whole record and cannot be
      established, only bounded by the tail check.
    tradeoff_note: >-
      Enumerating more properties buys coverage and costs analysis; the
      unexplained-tail check is what measures the remaining gap.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing is mounted. As a
    selection-steerability analysis: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: achievable bias toward
    weakness-correlated discriminant properties under proposed selection
    procedures, with exact toy class numbers verifying weakness rather than
    predicting it, and an unexplained-tail check bounding the enumeration's
    completeness.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that toy class numbers are computable in quantity. 0.6 that
    selection procedures are specified concretely enough to analyse. 0.35
    that some procedure admits material bias, which would undermine its
    trustlessness claim and is the outcome that would matter.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-CLGRP-66ab7f
    - RQ-CLGP-b99df5
    - GOAL-CLGRP-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
