idea:
  id: IDEA-20261017-2cecfc
  title: Koblitz projected-orbit feasibility gate
  class: measurement
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator
  added: '2026-10-17'
  claim: 'A target-blind Frobenius-orbit base can be compared after cofactor projection with a same-column
    random base on certified Koblitz n71/73 prime subgroups in 2^50..2^63. First gate: bounded m=8 solver/certificate
    feasibility on a=0,n=71. N53 is a separate 45-bit-subgroup regression.'
  mechanism: Use target-blind Frobenius orbits of full binary-field points, then exact [h] projection
    and deduplication into order-r columns. Relation vectors propagate under admitted additions and known
    tau scalars (Class I partial-action). The same-column random control tests whether the known orbit
    construction retains useful rank after charging setup, duplicates and certificates.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-b0fcda
    provenance: internal
    claim: Frobenius-invariant factor bases and relation/LA savings on subfield curves are known.
    verified_by: idea-generator
  - ref: IDEA-20260915-8fe0ef
    provenance: internal
    claim: Earlier ICPERF idea proposed tau-stable subspace savings at smaller cells
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-b0fcda
    - KR-IC-73db3f
    - KR-IC-5765d2
    - KR-IC-889857
    - KR-IC-5a43e5
    nearest:
    - ref: KR-IC-b0fcda
      provenance: internal
      relation: special_case
      delta: Three certified subgroups with log2(r) about 52.29, 56.26 and 62.22; zero observed full-cost
        gain.
    searched:
      frontier_review: 25 live index-calculus rows checked at e2263064.
      proposal_index: Ledger index checked; nearest prior proposal named in citations.
  assumptions:
  - 'Certified (a,n,r,h): (0,71,5513228015079457,428276), (0,73,86020738150056119,109796), (1,73,5384682420498870703,1754).'
  - N53 has r=21044858204113 and is not pooled with these rows.
  - Freeze bases before targets and verify [h] projection, tau and duplicate columns.
  - m=8 requires S9 or chained S3, not S8 alone.
  proof_search_map:
    bottleneck: Do tau orbits retain distinct prime-subgroup columns and useful rows after projection?
    baseline_embedding:
      parameter_slice: N53 has a 45-bit subgroup; n71/73 are separate cells.
      reproduction_check: Inspect N53 receipt and replay certificate arithmetic; verify three larger fixtures.
    observation_collision:
      observable: Raw orbit or solver conflict count.
      distinct_preimage_search: Equal raw orbits may project to different columns; equal columns may have
        different rank.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Cofactor-projected tau-orbit columns with witnesses.
      predicted_gain: Measured same-curve feasibility only.
    quantifier_order: Fix curve, seed, projected B, comparator, backend and caps before targets.
    method_ceiling:
      strongest_certifiable_claim: Bounded relation feasibility; complete IC gain requires all later phases.
      nearby_object_control: Same-column random base on the same subgroup.
    proof_obligations:
    - claim: Check rational points, cofactor projection and deduplication.
      responsibility: correctness
    - claim: Check tau, signs and exact target sum in certificates.
      responsibility: interface
    - claim: Price rank, LA, target, setup and matched rho later.
      responsibility: runtime
    not_applicable_reason: null
  predictions:
  - metric: projected_distinct_columns_per_raw_orbit_seed
    direction: different
    minimum_effect: Record exactly for each frozen fixture and control; no assumed n-fold saving.
  - metric: bounded_m8_full_point_certificates
    direction: higher
    minimum_effect: At least one checked natural relation from either arm on four base-independent a=0,n=71
      pilot targets within the cap; feasibility only.
  - metric: exact_certificate_count_by_arm
    direction: different
    minimum_effect: Count and deduplicate certificates; four targets cannot estimate coverage or orbit
      advantage.
  minimal_test:
    design: Inspect N53 receipt/arithmetic and independently verify n71/73 field, curve, [r]G=O, [h],
      tau and addition identities. On a=0,n=71 freeze a target-blind orbit base, equal-column random control,
      m=8 S3 encoder, one positive sum per arm, four independent public targets and complete raw-channel
      count C<=4. Stop if channel coverage is incomplete. Cap each solver call at 300 s, 8 GiB and 64
      models, with four quiet-host hours total; execute 2+8C calls, retaining all outcomes. A separate
      <=1,000,000-step signed-tau rho throughput calibration is not a full rho comparator. Four targets
      test certificates only.
    controls:
    - same-column-count projected random base
    - separate planted-positive sums per arm
    - N53 receipt/arithmetic replay
    - independent higher-degree fixture replay
    - bounded signed-Frobenius rho step calibration
    required_metrics:
    - curve and cofactor identity checks
    - raw/projected base size
    - rejected/deduplicated points
    - setup CPU/wall/RSS
    - solver CPU/wall/RSS
    - certified distinct subgroup rows
    - exact pilot certificate count
    - rho calibration steps and resources
  falsification_conditions:
  - A field, curve or cofactor identity fails, invalidating this runner interface.
  - A planted positive fails inside the cap, limiting this solver route.
  - No natural certified row on four targets fails finite-cap viability only.
  confounders:
  - 45-bit N53 subgroup versus higher-degree in-range subgroups
  - unequal cofactors
  - tau-orbit duplicates
  - base-size drift
  - conjugate-row dependence
  - raw-channel count
  - solver censoring
  - host load
  interpretation_limits:
  - N53 is below the requested subgroup range; n71/73 have no complete IC runs.
  - Four pilot targets cannot estimate coverage, orbit gain or an exponent.
  heuristic_assumptions:
  - id: H1
    statement: After projection/deduplication, fixed-base m-sum occupancy is approximately random-map
      conditional on measured orbit correlations.
    rigorous_support: C(2B+m-1,m) bounds reachable sums; Frobenius closure gives no uniformity.
    validation_plan: Enumerate smaller comparable Koblitz cells; compare occupancy tails to cyclic-group
      null and state transfer assumptions.
  - id: H2
    statement: Tau-collapsed accepted rows have rank increments resembling weight-matched random sparse
      rows.
    rigorous_support: Exact modular rank is checkable; orbit count is only an upper bound.
    validation_plan: Compare smaller-cell rank-growth tails with weight-matched random matrices; report
      actual n71/73 rank separately.
  target_complexity:
    time_exponent: 'Conditional cold cost: C_FB + B*C_dec/(q_rel*rho_rank) + C_LA + C_target_attempt/q_target
      + C_verify. If B=r^beta, q_rel~B^m/r in a validated sparse regime, C_dec=r^gamma and rho_rank=r^-delta,
      the relation exponent is 1-(m-1)*beta+gamma+delta; the full exponent also includes setup, LA and
      target. No exponent is measured.'
    memory_exponent: Conditional peak max{base, solver, LA, target table}; all r exponents unmeasured.
    best_known: Matched signed-Frobenius rho has r^0.5 group-operation exponent with curve-degree-dependent
      constant; N53's IC/rho wall ratio 3.294582 belongs only to its 45-bit subgroup.
    hidden_overhead: No o(1) claim; field representation, orbit and [h] maps, missed seeds, duplicate
      rows, certificates, LA and target work remain charged.
    tradeoff_note: Cold one-target setup is primary; only a separately recorded T-target case may charge
      C_FB/T with exact T and memory persistence.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: medium
  dominated_by: No result; 25 rows checked.
  sota_delta: Zero new complete-cost gain; N53 IC/rho wall ratio 3.294582 is only its own 45-bit panel.
