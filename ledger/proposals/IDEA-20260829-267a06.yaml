  assumptions:
    - >-
      HQC's public code is the rate-1/2 quasi-cyclic code with parity check
      [I_n | rot(h)] over R = F_2[X]/(X^n - 1), n prime, and h is a dense
      uniform ring element derived from a public seed.
    - >-
      The error support is uniform over weight-2w vectors. If it is NOT --
      which is exactly what IDEA-20260818-45b8ea proposes to measure -- the
      shape-invariance argument still holds for any support distribution that is
      EXCHANGEABLE across positions, and must be re-derived otherwise. This
      record does not assume 45b8ea's outcome in either direction.
    - >-
      The unit of account is the logical Toffoli-equivalent gate and the logical
      circuit layer; full fault-tolerant error correction is assumed and no
      physical-qubit overhead is modelled. NISQ is excluded by inspection.
    - >-
      The comparison baseline for the (g, d, width) columns is whichever of
      IDEA-20260818-e0ce51's first-principles estimate or KN-LIT-aa3372's
      published circuit is authoritative; where they differ, the published
      circuit supersedes and this record's ratios must be recomputed against it.

  object_first_framing:
    established_families_declared_off_limits_as_primary_lens:
      - >-
        Grover-Prange and quantum-walk BJMM/MMT AS ALGORITHMS. This record
        changes neither's search structure; it changes only the implementation
        of one subroutine.
      - >-
        The ten objects already generated against this RQ: shift-orbit DOOM
        folding, CRT-residue hidden shift, automorphism-orbit walk quotient,
        electric-network walk re-derivation, sparse-regime baseline
        reproduction, classical-baseline attribution, support-distribution
        Renyi deficit, dual-window (eps, s) bound, the MAXDEPTH cost functional,
        and transform-domain linear complexity.
      - >-
        Any claim on the ITERATION-COUNT exponent. This record explicitly does
        not touch it.
    tracked_object: >-
      THE DISPLACEMENT-GENERATOR PAIR (G, H) OF THE INFORMATION-SET SUBMATRIX --
      that is, an information set is followed through the computation not as a
      set of columns and not as a matrix, but as 2 alpha generator columns of
      length n from which the whole submatrix and all its Schur complements are
      reconstructible.
    lossy_projection_test: >-
      PASSES. LOSSY: the submatrix M = rot(h)[S^c, T] has about n^2 = 2^{28.2}
      bit entries at HQC-128 while its generator pair has 2 alpha n = about
      2^{18.2} bits at alpha = 8 -- a compression of ten orders of magnitude in
      bits, so the fibres of the projection are astronomically large (almost
      every n x n matrix is NOT displacement-structured and has no such
      representation at all). COMPATIBLE, which is the half with teeth: the one
      operation the oracle performs on M is Schur complementation, and the
      generators of a Schur complement are computable from the generators of the
      parent by a rank-preserving update -- displacement rank does not grow
      under the recursion. So the discarded information is discarded compatibly
      with the target's own operation and the retained part propagates
      deterministically, which is precisely why a superfast solver exists at
      all. FAILING VARIANT, recorded to show the test bites: tracking 'M in
      row-echelon form' discards nothing (echelon form is a basis change and M
      is recoverable), so it is a change of coordinates, not an object -- and it
      is exactly what the dense oracle currently tracks, which is why the dense
      oracle costs n^3.
    survival: >-
      The object survives every step of the ISD iteration: generator
      construction, the full solver recursion, and the residual-weight test. It
      DISSOLVES the moment the information set stops being interval-structured
      -- one arbitrary column moved out of an interval raises alpha by 2, and a
      generic information set has alpha = Theta(n), at which point the
      representation is larger than the matrix. That dissolution boundary is
      exactly the family-size constraint, which is why rho and gamma are pinned
      rather than free.

  proof_search_map:
    bottleneck: >-
      The per-iteration coherent linear-algebra cost pair (g, d). The iteration
      count 2^{w} is NOT the bottleneck for this record and is not touched.
    baseline_embedding:
      parameter_slice: >-
        rho = gamma = n/2, i.e. every column is its own interval. Then
        alpha = Theta(n), the structured solver degenerates to dense elimination
        and the cost must reproduce EXACTLY the O(n^3) figure, including its
        leading constant. This is the old-method boundary and it is an identity,
        not an approximation.
      reproduction_check: >-
        Symbolic: substitute alpha = n into O(alpha^2 n log^2 n) and check the
        crossover point against 2 n^3 term by term, recording the n at which the
        structured solver stops winning. Numeric: a frozen fixture at
        n in {31, 101, 257} that runs BOTH solvers on the same submatrices and
        asserts bit-identical solutions, plus operation counts fitted against
        alpha^2 n log^2 n and n^3 respectively. A structured solver that does not
        agree with dense elimination on every fixture instance is discarded
        before any cost number is reported.
    observation_collision:
      observable: >-
        The displacement rank alpha of the information-set submatrix, and
        through it the predicted (g, d).
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT MATTERS. Two information sets with identical
        alpha can have very different SOLVER BEHAVIOUR, because the
        divide-and-conquer recursion needs strongly regular leading minors and
        alpha says nothing about regularity: a mosaic-Toeplitz matrix of
        displacement rank 8 can be nonsingular with a singular leading half,
        which stalls the recursion. In superposition a stall is not recoverable
        by a data-dependent branch, so alpha alone is NOT an identifying
        observable for cost. SEPARATING CONDITION: carry the pair (alpha, number
        of regularization retries needed), and measure the retry distribution
        empirically. A second, milder collision: alpha does not determine the
        error-avoidance probability, but that is harmless here because the
        probability is shape-independent by the exact argument above.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'the permuted parity-check matrix' by 'the displacement
          generator pair of the information-set submatrix'. The hypothesis
          'this information set is cheap to eliminate' becomes the exact
          algebraic condition 'displacement rank at most rho + gamma + 2'.
        predicted_gain: >-
          Per-iteration gates from about 2^{43.3} to about 2^{27.7}, depth from
          about 2^{28} to a predicted 2^{12}-2^{20}, width from about 2^{29.2}
          to O(alpha n) = about 2^{17.2} logical qubits, at HQC-128.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from 'unstructured information sets' to
          'interval-structured information sets with the minimum interval count
          that keeps the family larger than 2^{2w}', and prove a strict inward
          improvement -- the cost strictly drops and the success probability is
          strictly unchanged, rather than merely 'a cheaper family exists'.
        predicted_gain: >-
          The pinned counts rho = gamma = 3 / 4 / 5 at HQC-128/192/256, each
          derived from the family-size inequality rather than tuned.
    quantifier_order: >-
      FOR ALL parameter sets P and FOR ALL interval counts (rho, gamma) with
      C(n,2 rho) C(n,2 gamma) / n at least 2^{2w}, THERE EXISTS a coherent
      oracle whose gate and depth costs are O((rho+gamma)^2 n log^2 n) and whose
      marked fraction is EXACTLY the Grover-Prange marked fraction, uniformly
      over instances. Note what is NOT claimed: the witness (the solver) must not
      depend on the instance h or on the information-set index in a way that
      requires data-dependent control flow -- that uniformity is precisely
      heuristic H3, it is the single most likely failure point, and it is stated
      as an assumption rather than assumed away.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At HQC-128/192/256, under cost model M, a coherent Prange oracle over
        interval-structured information sets costs (g*, d*, width*) with the
        same marked fraction as the unstructured oracle, giving a total
        depth-limited cost lower by X bits at MAXDEPTH D.' The method can NEVER
        certify anything about the iteration-count exponent, about the hardness
        of QC-SD, or about physical qubit cost.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion must FAIL is a RANDOM
        (non-quasi-cyclic) [2n, n] code at the same parameters. There, submatrix
        entries are independent and no interval structure exists, so alpha must
        measure as Theta(n) and the structured solver must show NO advantage. A
        pipeline that reports a speedup on a random code is measuring its own
        implementation, not quasi-cyclicity. Second control: BIKE/QC-MDPC, where
        the code is also quasi-cyclic -- the method MUST show the same oracle
        saving there, and if it does not, the saving is not coming from
        circulant structure.
    proof_obligations:
      - claim: 'rot(h)[S^c, T] has displacement rank at most rho + gamma + 2'
        responsibility: size
      - claim: 'a displacement-rank-alpha system of size m solves in O(alpha^2 m log^2 m) operations'
        responsibility: runtime
      - claim: 'the structured solver returns the same solution as dense elimination'
        responsibility: correctness
      - claim: 'Pr[supp(e) avoids I] depends only on |I|, for exchangeable supports'
        responsibility: success_probability
      - claim: 'C(n,2rho) C(n,2gamma)/n >= 2^{2w} at the pinned (rho, gamma)'
        responsibility: size
      - claim: 'the solver admits a branch-free reversible implementation at bounded retry count'
        responsibility: feasibility
      - claim: 'the family degenerates to dense elimination at alpha = Theta(n)'
        responsibility: baseline
      - claim: 'no claim is made on the iteration-count exponent'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        minimum interval count rho = gamma satisfying
        C(n,2rho) C(n,2gamma) / n >= 2^{2w}, per parameter set
      direction: different
      minimum_effect: >-
        PREDICTED 3 at HQC-128, 4 at HQC-192, 5 at HQC-256, computed this
