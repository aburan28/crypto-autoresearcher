idea:
  id: IDEA-20260829-267a06
  question_id: RQ-QALG-122b59
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE COHERENT PRANGE ORACLE DOES NOT NEED GAUSSIAN ELIMINATION -- restrict
    Grover-Prange to information sets whose two blocks are unions of rho and
    gamma cyclic INTERVALS, so the submatrix to invert is mosaic-Toeplitz of
    displacement rank at most rho+gamma+2 and a superfast structured solver
    replaces O(n^3) elimination, at ZERO cost in success probability because
    Prange's success probability depends only on the SIZE of the information
    set and not on its shape
  class: algorithm

  claim: >-
    Grover-Prange against quasi-cyclic syndrome decoding spends essentially all
    of its per-iteration cost coherently reducing a permuted parity-check matrix
    to systematic form, estimated at about 2^{43.3} Toffoli-equivalents and
    about 2^{28} layers of depth at HQC-128. That cost is an artifact of
    searching over UNSTRUCTURED information sets. For a quasi-cyclic code with
    parity check [I_n | rot(h)], an information set that takes S from the first
    block and T from the second requires inverting the submatrix rot(h)[S^c, T];
    when S and T are each unions of cyclically consecutive intervals -- rho of
    them and gamma of them -- that submatrix is a mosaic of Toeplitz blocks and
    therefore has displacement rank at most rho + gamma + 2, so a superfast
    structured-matrix solver of the Bitmead-Anderson / Morf type solves it in
    O((rho+gamma)^2 n log^2 n) field operations instead of O(n^3). THE CLAIM HAS
    TWO HALVES AND BOTH ARE FALSIFIABLE. (i) COST -- the per-iteration oracle
    drops by a predicted 12 to 18 bits in gates and, more importantly, by a
    predicted 8 to 16 bits in DEPTH, which is the axis on which amplitude
    amplification against this target actually fails under a binding MAXDEPTH.
    (ii) NO PROBABILITY LOSS -- restricting the information-set family costs
    NOTHING in per-iteration success probability, because for a uniformly random
    error support the probability that a FIXED n-subset avoids it depends only
    on the subset's cardinality, not on its shape; the only requirement is that
    the structured family be at least as large as the search space 2^{2w}, which
    fixes a minimum interval count predicted to be exactly rho = gamma = 3 at
    HQC-128, 4 at HQC-192 and 5 at HQC-256. NOTHING IS CLAIMED ABOUT THE
    ITERATION-COUNT EXPONENT -- it stays 2^{w(1+o(1))} -- and the record says so
    plainly rather than dressing a multiplier as an exponent. What moves is the
    depth-limited total cost, which under the parallel-Grover accounting scales
    as N_full * d * g / MAXDEPTH and therefore inherits the full (g,d) reduction
    linearly -- a predicted 20 to 34 bit reduction in total logical gate cost at
    MAXDEPTH 2^{40}, on an axis where the same accounting is what makes
    Grover-Prange lose to classical ISD at all.
  mechanism: >-
    SETUP. HQC's public code has parity check H = [I_n | rot(h)] over F_2, where
    rot(h) is the n x n circulant of the public ring element h, n prime. Prange
    selects n of the 2n columns as the REDUNDANCY set, assumes the error is zero
    on the complementary information set, inverts the selected n x n submatrix
    and checks the residual weight. Write the selected set as S in block 1 (the
    identity block, |S| = a) together with T in block 2 (|T| = n - a). Column
    j of the identity block is e_j, so eliminating those columns simply deletes
    the rows indexed by S; what remains to invert is the (n-a) x (n-a)
    submatrix M = rot(h)[S^c, T], rows S^c and columns T.
    THE STRUCTURAL INGREDIENT. rot(h) has entries M[i][j] = h_{i-j mod n}: it is
    Toeplitz along every diagonal. A submatrix with row set a union of rho
    cyclic intervals and column set a union of gamma cyclic intervals is
    therefore a rho x gamma MOSAIC of Toeplitz blocks. Mosaic-Toeplitz matrices
    have DISPLACEMENT RANK at most rho + gamma + 2 with respect to the standard
    shift-displacement operator, and matrices of displacement rank alpha are
    represented by 2 alpha generator columns rather than by n^2 entries and are
    inverted by superfast divide-and-conquer solvers (Morf; Bitmead-Anderson;
    the Kaltofen line over finite fields) in O(alpha^2 n log^2 n) field
    operations. The generators of a Schur complement are computable from the
    generators of the parent -- that closure property is what makes the recursion
    work, and it is also exactly the compatibility half of the lossy-projection
    test below.
    WHY THE PROBABILITY DOES NOT MOVE. Amplitude amplification's cost is
    p^{-1/2} where p is the fraction of MARKED elements of whatever set the
    initial state ranges over. Here p = Pr[supp(e) avoids I] for I drawn from the
    structured family. For a uniformly random weight-2w support and ANY fixed
    n-subset I, that probability is C(2n - n, 2w)/C(2n, 2w), a function of |I|
    alone. Averaging over any family of n-subsets returns the same number.
    Restricting the family therefore changes nothing in the numerator of the
    exponent, and the ONLY constraint the restriction imposes is that the family
    be large enough to contain 2^{2w} distinct members -- otherwise amplitude
    amplification is searching a space with fewer than one expected marked
    element and must re-use information sets, which wastes work.
    FAMILY SIZE, WHICH FIXES rho AND gamma. A union of rho cyclic intervals in
    Z_n is determined by 2 rho endpoints, so there are about C(n, 2 rho) choices
    for S and C(n, 2 gamma) for T, less about a factor n for the constraint
    |S| + |T| = n. At HQC-128 (n = 17669, log2 n = 14.11, 2w = 132) with
    rho = gamma = 3 that is about 2^{12 x 14.11 - log2(720^2) - 14.11} = 2^{136},
    which clears 2^{132} with 4 bits to spare; rho = gamma = 2 gives about
    2^{94} and does NOT clear it. At HQC-192 (n = 35851, 2w = 200) the same
    computation predicts rho = gamma = 4, and at HQC-256 (n = 57637, 2w = 262)
    rho = gamma = 5. So the mechanism's own parameter is pinned by a counting
    argument, not chosen, and the counting argument is a one-line falsifiable
    prediction.
    THE RESULTING ALGORITHM. Amplitude amplification over the index of a
    structured information set (the 2(rho+gamma) interval endpoints, about 136
    qubits at HQC-128), with an oracle that (1) builds the displacement
    generators of M directly from h and the endpoints -- O(alpha n) work, no
    matrix ever materialized, (2) runs a branch-free structured solver on the
    generators, (3) computes the residual weight and marks. Width is O(alpha n)
    logical qubits rather than the about 2^{29} needed to materialize a permuted
    matrix, so this improves the WIDTH axis as well and requires NO QRAM and NO
    QRACM: h is a classical constant compiled into the circuit.
    WHY THIS IS NOT COFACTOR POLISHING, STATED HONESTLY. In the iteration-count
    model it IS a multiplier, and per docs/target-result-profile.md C2 that
    disqualifies it from target class on its own. Its claim to exponent-level
    relevance is conditional and specific: once a depth budget D binds, the
    optimal parallel arrangement costs Theta(N_full * d * g / D) total gates
    rather than N_it * g, so d and g enter LINEARLY and a 2^{26} reduction in
    d*g is a 26-bit reduction in the total, at a budget where the quantum row is
    within tens of bits of the classical one.
