idea:
  id: IDEA-20260905-b8971d
  title: A specialization certificate for a named section lattice without global injectivity
  class: composition
  claim: For a supplied finite-rank subgroup of rational sections, a specialization can be certified injective on
    that subgroup by combining an exact generic relation certificate with a finite-prime certificate for its specialized
    generators; global injectivity of the entire Mordell-Weil group is unnecessary.
  mechanism: The target is the commutative square between a named section lattice, its rational specialization,
    and finite residue quotients. First identify the section relations exactly, for example through intersection
    divisors with rational arithmetic. Choose a basis of the resulting torsion-free lattice, specialize it at a
    nonsingular rational parameter, and verify full column rank modulo the image of rational torsion at a suitable
    auxiliary prime. A primitive integer relation would produce a nonzero residue relation, so an injective residue
    certificate proves independence of the displayed specialized points. The structural addition is a subgroup-specific
    certificate that can succeed where a global specialization criterion is unavailable, especially without rational
    two-torsion.
