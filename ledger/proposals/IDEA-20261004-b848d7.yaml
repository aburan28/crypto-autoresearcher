# IDEA-20261004-b848d7
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-b848d7
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-28 window table stores 134217728 entries and a width-27 table stores 67108864
  class: representation
  claim: >-
    A window of width 28 stores 134217728 precomputed entries. A window of
    width 27 stores 67108864. One hundred thirty-four million two hundred
    seventeen thousand seven hundred twenty-eight exceeds sixty-seven
    million one hundred eight thousand eight hundred sixty-four by
    67108864. The product of the two table sizes is 9007199254740992.
    Their sum is 201326592. The gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    27 is 134217728. Two to the power 26 is 67108864. Two width-27 tables both
    store 67108864, so that gap is 0 and their product is 4503599627370496. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 67108864.
    baseline_embedding:
      parameter_slice: The widths 28 and 27 and the sizes 134217728 and 67108864.
      reproduction_check: >-
        Two readers must agree that 2 to the power 27 is 134217728 and that
        2 to the power 26 is 67108864.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 67108864 drops the gap. Two width-27
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-27 table.
        predicted_gain: Sixty-seven million one hundred eight thousand eight hundred sixty-four fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 134217728 and 67108864. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-27 tables. Both store 67108864, and the gap is 0.
    proof_obligations:
      - claim: The width-28 table stores 134217728 entries.
        responsibility: size
      - claim: The width-27 table stores 67108864 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: One hundred thirty-four million two hundred seventeen thousand seven hundred twenty-eight exceeds sixty-seven million one hundred eight thousand eight hundred sixty-four by 67108864.
  minimal_test:
    design: >-
      Compute 2 to the power 27 and 2 to the power 26. Do not add a
      curve point.
    controls:
      - Two width-27 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-28 table size is not 134217728.
    - The product of the two sizes is not 9007199254740992.
  confounders:
    - A width-27 table of size 67108864 is a different window from a width-26 table of size 33554432.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 67108864 and 33554432.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-28 table has size 2 to the power 27, and the
        frozen width-27 table has size 2 to the power 26.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: One hundred thirty-four million two hundred seventeen thousand seven hundred twenty-eight stored entries versus sixty-seven million one hundred eight thousand eight hundred sixty-four, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
