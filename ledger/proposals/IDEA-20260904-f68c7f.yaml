  assumptions:
    - >-
      n prime, gcd(n,p) = 1, instance public and self-generated. NO LIVE KEY, WALLET
      OR DEPLOYED SYSTEM, at any stage, including the planted-epsilon calibration.
    - >-
      v is computable in n^{o(1)} bit operations from x(R) alone, and the evaluation
      of f and g_c costs one scalar multiplication plus one addition plus the cost of
      v. The charged unit is the group operation; the statistic's own cost is charged
      separately and reported.
    - >-
      The frequency a is KNOWN to the attacker. This is the load-bearing assumption
      and it is isolated as heuristic H2 rather than buried; at toy scale a is found
      by a full DFT in O(n log n) and at cryptographic n it is not, so the reduction
      as stated is a REDUCTION and not yet an executable attack.
    - >-
      Charged cost model - group operations counted, statistic evaluations counted
      separately, memory counted in machine words including the lattice, and the
      certificate check charged.

  proof_search_map:
    bottleneck: >-
      Not the estimator and not the lattice, both of which are standard, but the
      LOCATION OF THE FREQUENCY a. Every exponent in this record is conditional on a
      being known, and at cryptographic n no method in this corpus finds it within
      the claimed budget. A reviewer who supplies a sparse-Fourier algorithm over
      Z/n with query complexity poly(log n) * eps^{-2} converts this record from a
      conditional reduction into an unconditional one, and should say so.
    baseline_embedding:
      parameter_slice: >-
        eps = n^{-1/4}. At that value the conversion costs exactly n^{1/2 + o(1)},
        i.e. it lands ON the Pollard rho exponent, which is the boundary of the
        claim. The second slice is the PLANTED positive control v = (-1)^k, the
        discrete-log parity, for which fhat is supported at a = n/2 with
        |fhat| = 2/pi exactly - H-ECDLP-a4be60 records that constant as its POS-A
        design-time value.
      reproduction_check: >-
        FROZEN FIXTURE - running Algorithm 1 with v = (-1)^k and a = the frequency of
        largest coefficient must recover k with M = O(delta^{-2}) samples and total
        cost n^{o(1)}, i.e. POLYLOG, at every rung of the ladder, and the measured
        |fhat| must equal 2/pi to three digits, matching the value H-ECDLP-a4be60
        archived independently at design time. A pipeline that does not reproduce
        2/pi is not measuring the same object as the live contract and no number from
        it is comparable.
    observation_collision:
      observable: >-
        The pair (measured eps at frequency a, measured recovery cost).
      distinct_preimage_search: >-
        REQUIRED. Two statistics with the SAME eps and different structure - the
        planted t(k) at its known n^{-0.21} scale and a synthetic statistic built to
        have exactly the same |fhat(a)| but no relation to the discrete logarithm -
        must give the SAME recovery cost, because the conversion depends on nothing
        but eps. If they do not, the cost is not a function of eps and claim (C) is
        wrong. THE COLLISION THAT WOULD BE FATAL - a statistic with eps well above
        n^{-1/4} whose recovery cost is NOT eps^{-2} n^{o(1)}; the record must hunt
        for one and the planted-epsilon sweep is that hunt.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the ECDLP into the Hidden Number Problem by manufacturing HNP samples
          from the instance itself, with encoding (t_i = a c_i, u_i = top bits of the
          measured phase), completeness (every c_i gives a sample), soundness (the
          candidate k is verified by one scalar multiplication, so false positives
          cost nothing), transfer (the identity (A)) and the DISCLOSED cost loss
          (eps^{-2} delta^{-2} samples per HNP row).
        predicted_gain: >-
          Converts an unquantified "distinguisher" into a key-recovery exponent 2beta
          with polylog memory, and yields the threshold beta < 1/4.
      - transform: stronger_invariant
        proposed_object: >-
          Preserve the PHASE of the coefficient rather than only its modulus. The
          corpus's entire probabilistic-regime lane measures |fhat| and discards
          arg(fhat); the phase is the coordinate that carries k, and keeping it is
          what makes recursion (over the L multipliers) possible.
        predicted_gain: >-
          The whole reduction. It is the reason the record exists, and it is a
          one-line change to the estimator the live contract already implements.
    quantifier_order: >-
      FOR ALL statistics v computable in n^{o(1)}, FOR ALL nonzero frequencies a,
      FOR ALL instances (P, Q) on a curve of prime order n, IF |fhat(a)| >= eps THEN
      Algorithm 1 outputs k with probability at least 1 - eta in
      O(eps^{-2} delta^{-2} log(1/eta) * L) group operations, ASSUMING H1 and H2. The
      witness a is allowed to depend on (E, P, v) - all PUBLIC - and is FORBIDDEN to
      depend on k or on Q; the implementation must enforce that separation and the
      static provenance gate over the frequency-selection code path is BLOCKING,
      because a frequency chosen with knowledge of k would make the whole measurement
      circular. THE CONVERSE IS NOT CLAIMED - the record does not say that eps <=
      n^{-1/4} implies no attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - "any efficiently computable coordinate statistic with a KNOWN
        nonzero DL-Fourier frequency of size eps yields key recovery in
        eps^{-2} n^{o(1)} group operations and polylog memory, hence sub-rho exactly
        when eps > n^{-1/4+o(1)}". It can NEVER certify that such a statistic exists;
        it can never certify a lower bound on the ECDLP; and at cryptographic n it is
        not executable without a solution to the frequency-location problem, which it
        does not solve.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS is a statistic whose
        largest coefficient sits at a = 0 - the pure marginal. There the shift
        identity is vacuous (e_n(0) = 1), no phase carries k, and the recovery cost
        is infinite however large the coefficient. A pipeline that reports a
        "large A(v)" without separating the a = 0 term is measuring a marginal and
        not a distinguisher; this is exactly H-ECDLP-a4be60's own H2 and its NULL-2
        matched-marginal shuffle, and this record adopts that control unchanged and
        makes it BLOCKING for its own arms.
    proof_obligations:
      - claim: >-
          g_c(j) = f(j + ck) and ghat_c(a) = e_n(ack) fhat(a), exactly, for all a, c.
        responsibility: correctness
      - claim: >-
          M = O(eps^{-2} delta^{-2} log(1/eta)) samples determine the phase to within
          delta with probability 1 - eta.
        responsibility: success_probability
      - claim: >-
          The pairs (a c_i mod n, top b bits of a c_i k mod n) form a Boneh-Venkatesan
          HNP instance with random known multipliers.
        responsibility: interface
      - claim: >-
          With b = ceil(sqrt(log2 n)) and L = O(sqrt(log n)) the lattice step runs in
          time polynomial in log n and returns k.
        responsibility: runtime
      - claim: >-
          The total is L * M = eps^{-2} n^{o(1)} group operations and the memory is
          O(L^2 log n) bits.
        responsibility: memory
      - claim: >-
          The planted v = (-1)^k fixture recovers k at polylog cost with measured
          |fhat| = 2/pi.
        responsibility: baseline
      - claim: >-
          A(v) <= ||vhat||_1 * n^{-1/2+o(1)} for coordinate statistics, hence
          ||vhat||_1 > n^{1/4-o(1)} is necessary.
        responsibility: strictness
      - claim: >-
          No frequency-selection or estimator code path reads k or Q.
        responsibility: interface
      - claim: >-
          Every reported cost names n, v, a, eps, delta, L, M, the charged units and
          the memory.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The phase arg(ghat_c(a)) of one DL-Fourier coefficient of the self-generated
      shifted statistic, quantised to b bits.
    lossiness: >-
      Retains b = O(sqrt(log n)) bits of an object carrying log2 n bits and discards
      the rest, so it is genuinely lossy and is not a change of coordinates. The
      discard is compatible with the operation used - shifting the argument by [c]Q
      multiplies the coefficient by a character, which acts on the retained phase
      coordinate alone. Test PASSED, and passed in the exact regime the protocol
      calls for - the retained part propagates deterministically, not merely
      statistically.
    propagation: >-
      EXACT under the one-parameter shift action j -> j + ck, by identity (A). Not
      defined under the full translation action, which is why IDEA-20260807-df906f's
      rigidity theorem is not contradicted; the record states the reconciliation
      explicitly in mechanism.
    survival_score: >-
      Survives arbitrarily many shifts with no degradation of the SIGNAL - the
      modulus |ghat_c(a)| is eps for every c - and degrades only through the
      estimator's sampling error, which is why the cost is eps^{-2} and not
      exponential in the number of samples. That is an unusually deep survival for an
      ECDLP object and it is the reason this projection is worth the record.

  null_object_control: >-
    NULL-1, THE KEYED-RANDOM STATISTIC (blocking). v replaced by a keyed random
    function of x(R) with the same image size, run through the identical estimator.
    Its measured eps must sit at the finite-sample floor O(M^{-1/2}) and its recovery
    attempt must FAIL at the declared budget. A pipeline that recovers k from a keyed
    random statistic is reading k from somewhere else and every number it produced is
    void.
    NULL-2, THE MATCHED-MARGINAL SHUFFLE (blocking, adopted unchanged from
    H-ECDLP-a4be60 and the o2 lane). Removes the a = 0 marginal artifact. Any eps
    that does not survive the shuffle may not enter the conversion.
    NULL-3, THE ZERO-FREQUENCY ARM (blocking, and the null specific to this record).
    Run Algorithm 1 with a = 0. It must fail identically, at every eps, because the
    shift identity is vacuous there. This is the cheapest possible check that the
    conversion is using the phase and not leaking k through the harness.
    COMPARATOR 1 (blocking) - parallel Pollard rho with distinguished points and the
    negation map on the identical instances in identical charged units.
    COMPARATOR 2 (blocking) - BSGS on the identical instances, memory reported. The
    memory column matters here more than usual, because the conversion's headline
    advantage over BSGS is polylog memory.
    POSITIVE CONTROL A (blocking) - v = (-1)^k, the discrete-log parity, with
    |fhat| = 2/pi exactly. Recovery must be polylog.
    POSITIVE CONTROL B (blocking) - the PLANTED-EPSILON SWEEP. Construct v_eps whose
    coefficient at a known a is a dialled eps taking at least six values from 2^{-2}
    down to n^{-1/2}, by mixing the parity statistic with a keyed random statistic in
    a known ratio. The measured recovery cost must track eps^{-2} over the whole
    sweep with fitted exponent -2 within 0.2. THIS SWEEP IS THE RECORD'S PRIMARY
    EXPERIMENT; everything else is a check on it.
    CONTROL C - a statistic whose largest coefficient is at a = 0 (an unbalanced
    statistic), where the conversion must fail although A(v) is large. Known-answer
    calibration of NULL-3.

  predictions:
    - metric: >-
        P1 - the fitted exponent gamma in (measured group operations to recover k)
        ~ eps^{-gamma}, over the planted-epsilon sweep, at each of six prime orders
        from 2^17 to 2^27
      direction: different
      minimum_effect: >-
        gamma in [1.8, 2.2] at every rung confirms claim (C) in the tested scope.
        gamma above 2.5, or a cost that grows with n at fixed eps, REFUTES the
        conversion's cost model and the threshold of (D) collapses with it; that
        refutation is a decision, not an estimate, and it is the single cheapest way
        to kill this record.
    - metric: >-
        P2 - peak memory in machine words during recovery, as a function of n at
        fixed eps
      direction: different
      minimum_effect: >-
        Flat in n up to the polylog lattice growth - specifically below 10^5 words at
        every rung. Memory growing like a power of n means the implementation is not
        the algorithm described and the polylog claim, which is the record's only
        Pareto advantage over BSGS, is void.
    - metric: >-
        P3 - the measured |fhat| for POSITIVE CONTROL A
      direction: different
      minimum_effect: >-
        2/pi = 0.63662 to three digits at every rung, matching H-ECDLP-a4be60's
        independently archived design-time value. Any other value means the estimator
        disagrees with the live contract's and no cross-record comparison may be made.
    - metric: >-
        P4 - the recovery outcome of NULL-1, NULL-3 and CONTROL C at the declared
        budget
      direction: different
      minimum_effect: >-
        FAILURE in 100 percent of trials for all three. A single success is an
        information leak in the harness and voids everything.
    - metric: >-
        P5 - the derived threshold eps* at which measured recovery cost crosses the
        measured charged cost of parallel rho on the same instances
      direction: different
      minimum_effect: >-
        eps* consistent with n^{-1/4} within 0.03 in the exponent, at every rung.
        This is the number the whole record exists to produce and it is measured
        against the incumbent rather than asserted against an idealised rho constant.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, HARD GATE, HALF A DAY). Write L1-L4 and the assembly.
      Verify the shift identity symbolically. Verify that at eps = n^{-1/4} the cost
      equals the rho exponent. Verify the a = 0 degeneracy. If any of these fails the
      record stops and the derivation is the deliverable.
      STAGE 1 (HOURS, HARD GATE). Implement Algorithm 1. Run POSITIVE CONTROL A and
      the 2/pi fixture. Exact agreement or stop.
      STAGE 2 (HOURS, THE PRIMARY EXPERIMENT). POSITIVE CONTROL B, the
      planted-epsilon sweep - six eps values, six prime orders 2^17 to 2^27, 20
      independent instances per cell, measuring group operations, statistic
      evaluations, peak memory and success rate. Fit gamma per rung.
      STAGE 3 (HOURS). NULL-1, NULL-2, NULL-3, CONTROL C, and the two blocking
      comparators (parallel rho, BSGS) on the identical instances in identical
      charged units; derive eps* per rung.
      STAGE 4 (ZERO COMPUTE). Report the corollary (E) as a SCREEN - tabulate
      ||vhat||_1 against the n^{1/4} bar for every statistic family the corpus has
      measured, taking the digit-family value p^{0.39} from KN-FIND-ffe1df at second
      hand and marking it as such.
      NO NATURAL STATISTIC IS ATTACKED AT SCALE AND NO KEY IS RECOVERED OUTSIDE THE
      TOY CALIBRATION. All instances self-generated. No live key, wallet, or deployed
      system.
    controls:
      - Parallel Pollard rho with distinguished points and negation, identical instances, identical charged units (blocking matched control)
      - BSGS, identical instances, identical charged units, memory reported (blocking matched control)
      - NULL-1 keyed-random statistic of matched image size (blocking, same shape)
      - NULL-2 matched-marginal shuffle, adopted unchanged from H-ECDLP-a4be60 (blocking)
      - NULL-3 the a = 0 zero-frequency arm, which must fail identically (blocking)
      - POSITIVE CONTROL A, the discrete-log parity with |fhat| = 2/pi (blocking)
      - POSITIVE CONTROL B, the planted-epsilon sweep (blocking, primary)
      - CONTROL C, an unbalanced statistic whose mass is at a = 0
      - Static check that no frequency-selection or estimator code path reads k or Q (blocking)
    required_metrics:
      - Charged group operations, statistic evaluations and wall clock to recovery, per (n, eps, instance)
      - Peak memory in machine words and in bytes, per cell
      - Fitted gamma per rung with residuals and confidence interval
      - Measured |fhat| for POSITIVE CONTROL A against 2/pi
      - Success rate per cell, and failure rate of NULL-1, NULL-3 and CONTROL C
      - eps* per rung, derived from the measured rho comparator on the same instances
      - Certificate - the recovered k with the independent recomputation [k]P = Q, re-verified by a separate code path and by the harness's toy-curve verifier
      - Pass or fail of every blocking control

  falsification_conditions:
    - >-
      F1. The shift identity fails symbolically or numerically. The record is wrong
      at its root and stops at Stage 0.
    - >-
      F2. POSITIVE CONTROL A does not recover k at polylog cost, or |fhat| is not
      2/pi. Instrument failure; nothing is reported and no mathematical conclusion is
      drawn (AGENTS.md rule 3).
    - >-
      F3. The planted-epsilon sweep returns gamma outside [1.8, 2.2], or a cost that
      grows with n at fixed eps. THE COST MODEL OF (C) IS REFUTED, the threshold of
      (D) is void, and H-ECDLP-a4be60's pre-registered beta band loses the derivation
      this record offered it. This is the most likely way the record dies and it
      costs a few CPU-hours to find out.
    - >-
      F4. NULL-1 or NULL-3 recovers k. The harness leaks k; every number is void and
      the leak must be located before anything is reported.
    - >-
      F5. All predictions hold. The conversion is validated at toy scale, the
      threshold beta < 1/4 is established as a cost statement, the corollary (E)
      supplies a spectral-norm screen, and the live contract EXP-ECDLP-56ee42's lead
      band gains a derivation. IT IS STILL NO ATTACK - no statistic with
      eps > n^{-1/4} is known, and the frequency-location problem at cryptographic n
      is untouched. The honest headline is "a costed reduction from a measured
      Fourier coefficient to key recovery, with a threshold and a memory column".
    - >-
      F6. Budget exhaustion before the sweep resolves. INFRASTRUCTURE outcome under
      AGENTS.md rule 3, never evidence about the conversion.

  confounders:
    - >-
      The a = 0 marginal. A statistic with a large marginal has a large A(v) that
      carries NO information about k; NULL-2 and NULL-3 are both blocking for exactly
      this reason and the record must never report an eps that has not survived them.
    - >-
      Toy-scale frequency location. At n below 2^27 the full DFT is affordable, so
      the experiment silently solves the problem that dominates the cryptographic
      case. This is DISCLOSED as heuristic H2 and it is the single largest gap
      between what is measured and what is claimed.
    - >-
      Estimator variance versus effect size. At small eps the sample size M grows as
      eps^{-2} and the run time is dominated by sampling; an underpowered cell will
      look like a failure of the conversion rather than of the budget. Every cell
      must report its M and its achieved phase precision.
    - >-
      The sampler knows k. The estimator and frequency-selection code paths must not
      read k or Q, and the static provenance gate is blocking; a frequency chosen
      using k would make P5 circular.
    - >-
      Curve exclusion. Anomalous (#E = p) and smooth-order curves excluded before a
      curve enters the run set, as IDEA-20260901-b4e6eb and H-ECDLP-a4be60 state the
      rule; KN-TECH-034 was NOT opened in this session.
    - >-
      The Boneh-Venkatesan bit threshold is `recalled`. If the true threshold is
      higher than remembered, b grows, delta^{-2} grows, and the n^{o(1)} factor
      grows - possibly enough to move the threshold in (D) away from exactly 1/4.
      The planted sweep measures the composite and therefore detects this, which is
      why the sweep and not the derivation is the primary experiment.

  interpretation_limits:
    - >-
      THIS IS A REDUCTION, NOT AN ATTACK. It converts a hypothetical measured
      quantity into a cost. No statistic with eps > n^{-1/4} is known to this record
      and none is claimed.
    - >-
      The conversion consumes a KNOWN frequency. At cryptographic n the frequency is
      not known and this record does not supply it; IDEA-20260901-a66d70's
      sparse-Fourier route is the nearest candidate and its exponent in 1/tau is
      unstated in this corpus.
    - >-
      Nothing here re-poses, duplicates or modifies H-ECDLP-a4be60 or
      EXP-ECDLP-56ee42. That contract measures A(v) for three digit statistics; this
      record measures the COST OF A CONVERSION on planted statistics with dialled
      eps. The two share an estimator definition and nothing else, and no arm of this
      proposal may be run inside that contract.
    - >-
      Toy tier throughout, 17 to 27 bits. No transfer to cryptographic n is licensed
      and the extrapolation of gamma is explicitly unjustified.
    - >-
      Corollary (E) rests on a recalled character-sum bound and is therefore a
      conditional screen, not a theorem. It must be quoted with its condition.
    - >-
      No disposition, status change, or approval is made or implied.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a statistic v and a frequency a with |fhat(a)| = eps, the empirical mean
        Shat_c over M uniform samples concentrates at the Hoeffding rate with no
        heavy tail - Pr[|Shat_c - ghat_c(a)| > s] <= 4 exp(-M s^2 / 8) - uniformly
        over c and over the tested ladder of n.
      rigorous_support: >-
        The rigorous half is Hoeffding's inequality for bounded independent complex
        random variables, applied separately to real and imaginary parts, which is a
        theorem and requires only that the j_t be independent and uniform. The
        classical distribution statement it imitates is the central limit behaviour
        of a bounded i.i.d. mean. WHAT IS ASSUMED is only the sampler's uniformity
        and independence, which the harness controls; H1 is therefore the WEAKEST
        heuristic in this record and is stated for completeness rather than because
        it is in doubt.
      validation_plan: >-
        SAMPLE - for POSITIVE CONTROL A, where ghat_c(a) is known in closed form,
        draw 10^3 independent estimates at each of eight values of M spanning three
        decades and compare the empirical distribution of |Shat - ghat| against the
        Hoeffding envelope. COMPARISON DISTRIBUTION - the Gaussian limit with
        variance 1/M. TAIL CHECK - the largest deviation over all 8000 estimates
        against the Hoeffding bound at the same confidence. SAMPLED PARAMETERS
        RECORDED - n, v, a, c, M, seed. TRANSFER ASSUMPTION - none needed; the
        inequality is uniform in n.
    - id: H2
      statement: >-
        A frequency a with |fhat(a)| within a constant factor of A(v) is computable
        from the PUBLIC data (E, P, v) in cost at most eps^{-2} n^{o(1)}, uniformly
        in n.
      rigorous_support: >-
        NO RIGOROUS SUPPORT IS AVAILABLE and this is stated as the record's principal
        weakness rather than smoothed over. At toy n the full DFT costs O(n log n),
        which is far more than eps^{-2} n^{o(1)} and therefore VIOLATES H2 at the
        very scale where the experiment runs - the experiment silently assumes away
        the hardest part. The classical statement it imitates is the existence of
        sparse-Fourier / significant-Fourier-transform algorithms over Z/N with query
        complexity poly(log N, 1/tau), the Akavia-Goldwasser-Safra line that
        IDEA-20260901-a66d70 records as recalled. Whether the exponent of 1/tau in
        that line is 2 or larger DECIDES whether the threshold in (D) is 1/4 or
        smaller, and this program has not opened the source.
      validation_plan: >-
        SAMPLE - measure the actual cost of locating the largest frequency by three
        methods at each rung: full DFT (baseline, O(n log n)), random probing of
        n^{1/2} frequencies, and a hand-rolled binary-splitting sparse-Fourier
        search; report the cost of each against eps^{-2}. PREDICTED SHAPE - full DFT
        grows like n, probing like n^{1/2}, and only the sparse method has a chance
        of being flat; the honest expected outcome is that H2 FAILS for the first two
        and is untested for the third. COMPARISON - the measured location cost
        divided by the measured recovery cost, reported per rung as the record's
        headline caveat rather than in a footnote. TRANSFER ASSUMPTION, STATED - if
        the sparse method's measured cost grows with n, the reduction is toy-only and
        the record must say so in every downstream citation.
    - id: H3
      statement: >-
        The Boneh-Venkatesan lattice with L = O(sqrt(log n)) random multipliers and
        b = ceil(sqrt(log2 n)) known most significant bits recovers the hidden number
        with probability at least 1/2 in time polynomial in log n.
      rigorous_support: >-
        The rigorous half is the Boneh-Venkatesan theorem itself (RECALLED, the bit
        threshold corroborated only by a WebSearch snippet), together with Babai's
        nearest-plane guarantee on top of LLL, which the retrieved Archive of Formal
        Proofs entry confirms is the algorithm used and has been machine-formalised.
        The classical distribution statement imitated is that random multipliers make
        the HNP lattice behave like a random lattice of the same determinant.
      validation_plan: >-
        SAMPLE - 10^3 synthetic HNP instances per rung with exactly the (L, b)
        parameters the conversion produces, solved by the same lattice code, with the
        success rate reported as a function of b at fixed L and of L at fixed b.
        COMPARISON - the recalled threshold sqrt(log q) + log log q, plotted against
        the measured 50-percent success contour. TAIL CHECK - the smallest b at which
        any instance succeeds, against the predicted threshold. TRANSFER ASSUMPTION -
        validated only at the toy moduli of the ladder; the record's headline cost is
        recomputed with the MEASURED (L, b) rather than the recalled threshold if
        they differ.

  target_complexity:
    time_exponent: >-
      eps^{-2} * n^{o(1)} group operations, i.e. n^{2 beta + o(1)} when
      A(v) = n^{-beta}. Sub-rho exactly when beta < 1/4. At the corpus's predicted
      closure value beta = 1/2 the conversion costs n^{1 + o(1)}, which is worse than
      rho by n^{1/2} - so the PREDICTED reading of the live contract's outcome is
      that this conversion is useless, and the record says so.
    memory_exponent: >-
      POLYLOG - O(L^2 log n) bits for the lattice plus O(log n) for the running
      estimator. This is the record's only Pareto advantage and it is real - the
      conversion is not a claw-finding algorithm and stores no table, so unlike
      BSGS, unlike IDEA-20260904-982159, and unlike the whole meet-in-the-middle
      class, it is not dominated on the memory axis by parallel rho.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map, about
      0.886 n^{1/2} group operations at small per-processor memory (KN-TECH-006, cited
      second-hand); BSGS at about 2 n^{1/2} time and n^{1/2} memory;
      automorphism-discounted rho at sqrt(n/|Aut|); batch rho at Theta(sqrt(Mn));
      generic preprocessing at S T^2 = Theta(n).
    hidden_overhead: >-
      The n^{o(1)} carries delta^{-2} = 2^{2 sqrt(log2 n)} and L = O(sqrt(log n)),
      both SUPERPOLYNOMIAL IN log n but subpolynomial in n - at n = 2^256 the factor
      2^{2 sqrt(256)} = 2^{32} is very large in practice and is stated here rather
      than absorbed, so the CONCRETE threshold at 256 bits is not eps > 2^{-64} but
      roughly eps > 2^{-48}, and the difference is exactly the kind of optimism the
      profile requires be flagged. It does NOT carry the frequency-location cost,
      which is heuristic H2 and is charged separately and reported separately.
    tradeoff_note: >-
      Time-memory - there is essentially nothing to trade; memory is polylog and
      cannot be usefully increased. That places the conversion at a corner of the
      frontier that no other member of this session's portfolio occupies.
      Parallelisation - PERFECT and embarrassingly so, since the M samples per
      multiplier are independent and the L multipliers are independent, so with
      Z processors the wall clock is eps^{-2} n^{o(1)} / Z with no communication
      until the final lattice step. That is a strictly better parallel profile than
      claw finding and comparable to parallel rho.

  dominated_by: >-
    CONDITIONALLY NOT DOMINATED, and this is the one proposal in the session for
    which the answer is not simply "yes"; the frontier was walked row by row and the
    condition is stated. (1) Parallel Pollard rho with distinguished points and
    negation at 0.886 n^{1/2} time, polylog memory - DOMINATES this proposal whenever
    eps <= n^{-1/4}, and is DOMINATED BY IT on time at equal memory whenever
    eps > n^{-1/4}. That single inequality is the whole Pareto question and it is why
    the record exists. (2) BSGS at n^{1/2} time and n^{1/2} memory - dominated on
    memory by this proposal at every eps, and dominating on time whenever
    eps <= n^{-1/4}. (3) Automorphism-discounted rho at sqrt(n/|Aut|) - shifts the
    threshold by the constant |Aut|^{1/4} and is otherwise as row (1). (4) Batch rho
    at Theta(sqrt(Mn)) - dominates for M targets unless the conversion is also
    batched, which it is not here and which is named as an open direction. (5)
    Generic preprocessing at S T^2 = Theta(n) - wins on online time when the advice
    is free, is neutral when preprocessing is charged, and is orthogonal since this
    conversion uses no advice. (6) Pohlig-Hellman - not comparable, n prime. (7)
    MOV/FR at small embedding degree and the anomalous additive transfer - dominate
    on the curve families where they apply and are excluded here. (8) Prime-field
    index calculus - at or above n^{1/2} in this corpus, so it does not dominate.
    (9) Shor - a different computational model and out of scope for this record.
    DATA AND QUERY AXIS - the conversion issues eps^{-2} n^{o(1)} self-generated
    evaluations and no oracle queries; there is no auxiliary-input row to be
    dominated on. UNCONDITIONALLY, TODAY, the proposal IS dominated by row (1),
    because no statistic with eps > n^{-1/4} is known - and that is stated as the
    honest current position rather than hidden behind the conditional.
  sota_delta: >-
    +0 on time and +0 on memory TODAY, because the hypothesis eps > n^{-1/4} is
    unmet. CONDITIONALLY, at A(v) = n^{-beta} with beta < 1/4, the delta is
    n^{1/2 - 2 beta} in time at EQUAL (polylog) memory against parallel rho - for
    example beta = 0.21, the corpus's own measured scale for the planted Thue-Morse
    statistic of the discrete log, would give n^{0.08}, i.e. a factor 2^{20} at
    n = 2^256 before the disclosed 2^{32} overhead, hence NOT a win at 256 bits and a
    win only for beta below about 0.19 at that size - a concrete-cost statement this
    record makes explicitly against its own interest. The quantitative deltas
    actually claimed are (i) an exponent, 2 beta, where the corpus had none;
    (ii) a memory column, polylog, where the corpus had none, and it is the column
    that makes the comparison against rho rather than against BSGS the right one;
    (iii) a THRESHOLD, beta < 1/4, that converts a pre-registered convention in a
    live approved contract into a derived quantity; (iv) a necessary condition
    ||vhat||_1 > n^{1/4} that screens the entire statistic search space at zero
    compute and is already satisfied by exactly one family on file (digit sums, at a
    measured p^{0.39}) and failed by every interval family; (v) a corrected mechanism
    replacing IDEA-20260815-f558e4 (F)'s kangaroo sketch, which does not work as
    written.

