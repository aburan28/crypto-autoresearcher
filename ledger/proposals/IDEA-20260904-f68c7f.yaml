idea:
  id: IDEA-20260904-f68c7f
  question_id: RQ-ECDLP-002
  handoff_id: TASK-20260904-300a32
  goal_id: null
  added: '2026-09-04'

  title: >-
    THE CONVERSION H-ECDLP-a4be60 EXPLICITLY DEFERS, WITH ITS EXPONENT, ITS MEMORY
    AND ITS COST TABLE - a single known nonzero frequency at which ANY efficiently
    computable coordinate statistic has DL-Fourier coefficient of size eps converts
    to FULL key recovery in eps^{-2} * n^{o(1)} group operations and POLYLOG memory,
    by a phase read-off of the self-generated shifted function plus Boneh-Venkatesan
    lattice reconstruction; therefore the sub-rho threshold on the quantity that
    live contract already measures is EXACTLY A(v) > n^{-1/4}, the corpus's
    pre-registered lead band beta <= 0.25 acquires a derivation instead of a
    convention, and the correct necessary condition on a statistic's F_p spectral
    norm is L > n^{1/4}

  class: algorithm

  claim: >-
    SETTING. E/F_p public, P of prime order n, G = <P>, Q = [k]P with k unknown and
    self-generated. Let v be any function from F_p to a finite set S computable in
    n^{o(1)} bit operations, and let f be the induced function on Z/n,
    f(j) = v(x([j]P)). For a character e_n(t) = exp(2 pi i t / n) and an embedding
    of S into the complex unit disc, define the DL-FOURIER COEFFICIENT
      fhat(a) = (1/n) SUM_{j in Z/n} f(j) e_n(-a j),
    which for a real-valued balanced v is exactly the observable
    A(v) = max over a of |fhat(a)| that IDEA-20260815-f558e4 defines and that
    EXP-ECDLP-56ee42 is approved to measure. NO ARM OF THAT CONTRACT IS RE-POSED
    HERE; this record takes its observable as an INPUT and supplies the missing
    output.

    (A) THE SHIFT IDENTITY, WHICH IS THE WHOLE MECHANISM AND IS EXACT. For any
    integer c the attacker can evaluate, at the cost of one scalar multiplication
    and one group addition and with NO knowledge of k,
      g_c(j) = v( x( [j]P + [c]Q ) ) = f(j + c k).
    Hence ghat_c(a) = e_n(a c k) * fhat(a) identically, for every a and every c.
    THE UNKNOWN k SITS IN THE PHASE OF A QUANTITY THE ATTACKER CAN SAMPLE. This is
    an identity, not an approximation, and it holds for every v whatsoever.

    (B) THE ESTIMATOR AND ITS COST (Lemma L2). Draw M values j uniformly from Z/n
    and form Shat_c = (1/M) SUM_t f(j_t + c k) e_n(-a j_t). Then E[Shat_c] =
    ghat_c(a) and each term has modulus at most 1, so by Hoeffding in the real and
    imaginary parts, |Shat_c - ghat_c(a)| <= 2 sqrt(log(4/eta)/M) with probability
    1 - eta. To determine the PHASE of ghat_c(a), whose modulus is eps = |fhat(a)|,
    to within an angle delta, it suffices that 2 sqrt(log(4/eta)/M) <= eps * delta/2,
    i.e.
      M = O( eps^{-2} delta^{-2} log(1/eta) )
    evaluations of v and scalar multiplications. The same estimate at c = 0 supplies
    the phase of fhat(a) itself.

    (C) THE ASSEMBLY (Theorem, conditional on H1 and H2). Choose L random multipliers
    c_1..c_L in Z/n. Step (A) plus step (B) yield, for each i, the top
    b = log2(1/delta) bits of ( a c_i k mod n ). Writing t_i = a c_i mod n - which
    the attacker KNOWS, since a and c_i are known - this is verbatim an instance of
    the Boneh-Venkatesan HIDDEN NUMBER PROBLEM with hidden number k, known random
    multipliers t_i, and b known most significant bits per sample, solvable by
    Babai nearest-plane on the standard HNP lattice in time polynomial in L and
    log n once b exceeds the Boneh-Venkatesan threshold of about
    sqrt(log n) + log log n bits with L about 2 sqrt(log n) samples. Taking
    b = ceil(sqrt(log2 n)) gives delta^{-2} = 2^{2 sqrt(log2 n)} = n^{o(1)} and
    L = n^{o(1)}, so
      TOTAL COST = L * M = eps^{-2} * n^{o(1)} group operations,
      TOTAL MEMORY = O(L^2 log n) bits = n^{o(1)}, i.e. POLYLOG,
      CERTIFICATE = the recovered k, re-verified by one scalar multiplication.

    (D) THE THRESHOLD, WHICH IS THE DELIVERABLE. Against the incumbent parallel
    Pollard rho at about 0.886 n^{1/2} group operations, the conversion of (C) wins
    exactly when eps^{-2} n^{o(1)} < n^{1/2}, i.e. when
      A(v) > n^{-1/4 + o(1)}   at some KNOWN nonzero frequency a.
    Writing A(v) ~ n^{-beta}, THE ATTACK THRESHOLD IS beta < 1/4. That number is
    exactly the pre-registered LEAD band of H-ECDLP-a4be60's prediction P2 ("beta at
    or below 0.25 surviving NULL-1 and NULL-2 records the lead"), which that record
    states WITHOUT DERIVATION. This record supplies the derivation, and in doing so
    changes the band from a convention into a cost statement with a memory column.

    (E) THE SPECTRAL-NORM COROLLARY, WHICH TURNS THE THRESHOLD INTO A SCREEN. If v
    is a function on F_p with F_p-Fourier expansion v = SUM_xi vhat(xi) psi_xi and
    L1 norm ||vhat||_1 = L, then by the triangle inequality
      A(v) <= L * max over (xi nonzero, a) of | (1/n) SUM_j psi_xi(x([j]P)) e_n(-aj) |
    and the inner hybrid sum exhibits square-root cancellation of size
    n^{-1/2+o(1)} by the Kohel-Shparlinski and Lange-Winterhof character-sum lineage
    (RECALLED). Hence A(v) <= L n^{-1/2+o(1)}, and combining with (D) - A NECESSARY
    CONDITION FOR ANY CHEAP COORDINATE STATISTIC TO YIELD A SUB-RHO ATTACK IS
      ||vhat||_1 > n^{1/4 - o(1)}.
    KN-FIND-ffe1df's committed measurement for the digit-sum family is
    L ~ p^{0.39}, which CLEARS n^{1/4}; the interval and top-bit families have
    L = O(log p)^{O(1)}, which does not. THE LIVE EXPERIMENT IS THEREFORE POINTED AT
    THE ONLY FAMILY ON FILE THAT COULD POSSIBLY CLEAR THE BAR, and this record makes
    that a computation rather than a taste judgement.

    (F) WHAT IS NOT CLAIMED. No statistic with A(v) > n^{-1/4} is known to exist and
    this record does not claim one exists; it claims a REDUCTION and its exponents.
    The reduction consumes a KNOWN frequency a; locating a at cryptographic n is a
    separate problem addressed by heuristic H2 and by the sparse-Fourier route
    IDEA-20260901-a66d70 already records, and the record's honest position is that
    without a the conversion is not executable at scale.

  mechanism: >-
    THE TRACKED OBJECT is the PHASE of a single Fourier coefficient of a
    self-generated shifted function - a one-real-number projection of the ECDLP
    state. The lossy-projection test of docs/inventor-protocol.md section 2 applies
    and PASSES non-vacuously - the map from the instance to arg(ghat_c(a)) retains
    exactly log2(1/delta) bits out of log2 n, discards everything else, and what is
    discarded is discarded COMPATIBLY with the operation the attacker actually
    performs, namely translation of the argument by c k, because translation acts on
    the Fourier side by multiplication by a character. The retained part therefore
    propagates DETERMINISTICALLY - and it propagates as an exact identity, not
    probabilistically, which is the unusual feature. The rigidity theorem of
    IDEA-20260807-df906f forbids exact propagation of a lossy object under the FULL
    translation action on the group; this object propagates exactly under the
    ONE-PARAMETER family of shifts by multiples of k, which is a strictly smaller
    action, and that is why the two statements coexist rather than conflict. The
    record states that reconciliation explicitly because a reviewer will and should
    reach for the rigidity theorem first.

    WHY THIS IS NOT THE KANGAROO SKETCH IT REPLACES. IDEA-20260815-f558e4's
    constructive branch (F) says that a non-decaying advantage "localises k to a
    sub-interval at poly cost, which is the input a kangaroo method consumes
    directly". That sketch is not costed and, read literally, it is the WRONG
    mechanism - a Fourier coefficient of f along the DL coordinate does not by itself
    localise k to an interval, because f is a function of the POINT, not of k, and
    its bias says nothing about where k lies. The correct mechanism is the shift
    identity (A) - the attacker manufactures the k-dependence by shifting the
    argument with [c]Q, and reads k out of a PHASE rather than out of a bias in k's
    own distribution. That correction is a substantive part of this record's content
    and it changes the exponent from unstated to eps^{-2} and the memory from
    unstated to polylog.

    NUMBERED ALGORITHM 1 (Require/Ensure). REQUIRE - E, P of prime order n, Q = [k]P,
    a statistic v computable in n^{o(1)}, a frequency a nonzero in Z/n with
    |fhat(a)| >= eps, parameters delta and L. ENSURE - k, or FAIL. Step 1, estimate
    fhat(a) with M = O(eps^{-2} delta^{-2} log(1/eta)) samples and record its phase.
    Step 2, for i = 1..L draw c_i uniformly, precompute [c_i]Q once, and estimate
    ghat_{c_i}(a) with M samples; set u_i = the top b bits of
    arg(ghat_{c_i}(a)/fhat(a)) * n / (2 pi). Step 3, build the Boneh-Venkatesan
    lattice from the pairs (t_i = a c_i mod n, u_i) and run Babai nearest plane.
    Step 4, output the candidate k and VERIFY by checking [k]P = Q; on failure
    increase L and repeat. PROOF DECOMPOSITION - L1 the shift identity (exact
    algebra); L2 the estimator cost (Hoeffding, above); L3 correctness of the HNP
    reduction under the Boneh-Venkatesan bit threshold; L4 success probability under
    H1 and H2. The theorem only assembles L * M and states the memory.

    STAGE STRUCTURE. Stage 0 is a zero-compute derivation and is the hard gate.
    Stage 1 is a PLANTED-EPSILON calibration in which v is constructed to have a
    dialled coefficient of known size, which converts the whole claim into a
    measured curve of recovery cost against eps. Stage 2 runs the declared natural
    statistics and reports where they sit relative to the threshold. Stage 3 runs
    the nulls and the two incumbents.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval is EMPTY here and was not called. Screening by (i) the
      255-title ECDLP dedup digest read in full; (ii) PD-1 greps over
      ledger/proposals for 'hidden number problem', 'Boneh-Venkatesan',
      'Bleichenbacher', 'Babai', 'nearest plane', 'SFT', 'Akavia',
      'significant Fourier'; (iii) full reads of H-ECDLP-a4be60 and
      IDEA-20260901-b4e6eb; (iv) targeted reads of IDEA-20260808-be161c,
      IDEA-20260815-3f6b4c and the SFT passage of IDEA-20260901-a66d70; (v) a grep
      of IDEA-20260815-f558e4 for its constructive branch (F); (vi) one WebSearch on
      the hidden number problem and one WebFetch that successfully opened the
      Archive of Formal Proofs entry for the HNP.
    results: >-
      IDEA-20260808-be161c and IDEA-20260815-3f6b4c are HNP records in the ECDSA
      NONCE-LEAKAGE lane (RQ-ECDSA-87625f), and be161c explicitly scopes itself
      "NOT the plain ECDLP (KN-TECH-019 boundary)". Neither contains the shift
      identity, neither manufactures its own samples, and neither states an ECDLP
      exponent. IDEA-20260901-a66d70 (RQ-ECDLP-160d89) DOES contain the closest
      prior art in this corpus and it is credited in full - it observes that a
      function on Z/N with a heavy Fourier coefficient at xi_0 and another at
      xi_0 * x yields x by two Akavia-Goldwasser-Safra sparse-Fourier calls, hence a
      polynomial-time DLP. THE DIFFERENCES ARE THREE AND THEY ARE THE CONTENT HERE -
      a66d70 works in the regime of a coefficient of size 1 - gamma with gamma small
      (a CONSTANT heavy coefficient) and concludes "polynomial time", whereas this
      record works at VANISHING eps = n^{-beta} and produces the exponent 2 beta and
      the threshold beta < 1/4; a66d70's route depends on a recalled external
      theorem whose exponent in 1/tau is not stated, whereas this record's route is
      elementary (Hoeffding plus Babai) with an explicit constant and POLYLOG memory;
      and a66d70 is used as a NO-GO for join keys in a different question, whereas
      this record is used as the cost model that H-ECDLP-a4be60 F4 explicitly defers.
      IDEA-20260815-f558e4's branch (F) states the existence of a conversion in one
      sentence with no exponent, no query count, no memory and, as argued in
      mechanism, the wrong mechanism.
    verdict: >-
      UNVERIFIED. The mathematical content is a composition of standard pieces
      (Hoeffding, the shift identity, Boneh-Venkatesan) and the author's own reading
      is ADAPTATION, but the Boneh-Venkatesan bit threshold and the
      Kohel-Shparlinski hybrid-sum bound are `recalled` - one WebFetch opened an
      Archive of Formal Proofs page confirming that the HNP is due to Boneh and
      Venkatesan and is solved by Babai nearest plane, but it does NOT state the bit
      threshold, and the character-sum sources were not opened at all. Under
      AGENTS.md rule 9 and this task's constraint, `unverified` is the only
      admissible label. THE ACT THAT WOULD LICENSE A HIGHER LABEL - open Boneh and
      Venkatesan 1996 (or Nguyen-Shparlinski) for the bit threshold and one
      Kohel-Shparlinski or Lange-Winterhof source for the hybrid bound, and record
      the verification. It is also entirely possible that (A)-(D) is folklore in the
      pseudorandomness literature; the record does not claim otherwise and the
      external novelty is UNESTABLISHED.

  citations:
    - ref: https://www.isa-afp.org/entries/Hidden_Number_Problem.html
      provenance: retrieved
      claim: >-
        The Hidden Number Problem is due to Boneh and Venkatesan (1996); it concerns
        recovering a hidden number alpha from a bit-leaking oracle; the formalised
        adversary solves it via Babai's nearest plane algorithm for approximate CVP
        on top of LLL, and the formalisation is aimed at attacks on DSA and ECDSA.
      verified_by: >-
        TASK-20260904-300a32, WebFetch of that URL on 2026-09-04, page opened and
        read. THE PAGE DOES NOT STATE THE BIT THRESHOLD; the threshold used in claim
        (C) is carried separately as a recalled citation below.
    - ref: >-
        Boneh and Venkatesan, Hardness of computing the most significant bits of
        secret keys in Diffie-Hellman and related schemes, CRYPTO 1996; and
        Nguyen-Shparlinski on the HNP for DSA
      provenance: recalled
      claim: >-
        With random known multipliers t_i and about sqrt(log q) + log log q known most
        significant bits per sample, the HNP is solved in polynomial time by Babai
        nearest plane on the standard lattice, using O(sqrt(log q)) samples. A
        WebSearch snippet on 2026-09-04 corroborated the threshold phrase "greater
        than sqrt(log q) + log log q"; the source itself was NOT opened, so provenance
        stays recalled and no novelty label above unverified may rest on it.
