idea:
  id: IDEA-20260823-850562
  record_type: proposal
  added: "2026-08-23"
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-90fff7
  task_id: TASK-20260823-9ccc23
  role: idea-generator
  title: Division-polynomial residue syndromes as a recurrence-closed lossy code
  class: mechanism
  claim: >-
    Conditional research proposal only; the exact possible bound and every
    unproved dependency remain solely those already stated in
    conditional_complexity_claim, and no algorithm or improvement is
    established.
  mechanism: >-
    The proposed mechanism is exactly the composition already specified by
    lossy_object, public_evaluation, one_step_propagation, and target_decoder;
    their existing current_gap and falsification fields remain controlling.
  proposal_status: unverified
  novelty_status: unverified
  novelty_note: >-
    Division-polynomial and elliptic-divisibility-sequence relations are
    established literature. The proposed fixed-size residue syndrome and its
    hoped-for recurrence-closed decoder have not been verified as known or novel
    by the retrieved sources. No novelty inference is made.
  claim_boundary:
    allowed: definition of a falsifiable adaptation and its proof-search ceiling
    disallowed:
      - implementation claim
      - experiment claim
      - unconditional complexity improvement
      - hypothesis status change
      - novelty claim
      - breakthrough claim
  problem:
    group: prime-order subgroup generated by P on an elliptic curve over a prime field
    order_symbol: N
    target: Q equals scalar multiplication of x and P
    excluded_lenses:
      - smoothness and index-calculus relations
      - interval-only discrete logarithm
      - automorphism-only quotienting
      - generic rho or baby-step giant-step repackaging
      - pairing, Tate-Lichtenbaum, or field-discrete-log transfer
      - special-cardinality EDS transfer such as the known order q minus 1 case
  lossy_object:
    name: fixed division-polynomial residue syndrome
    definition: >-
      For a fixed public index set S of polylogarithmic cardinality and the
      division polynomials psi_n, define D_S(R) as the tuple
      (chi(psi_n(R))) indexed by n in S, using an explicit sentinel for zeros and
      poles.
    parameter_range:
      index_set_size: polylogarithmic in N
      maximum_index_bitlength: polylogarithmic in N
      field: prime
    discarded_information: >-
      The syndrome retains only character classes of division-polynomial values.
      It discards the field values, point coordinates, scalar index, and all
      division-polynomial positions outside S.
    lossiness_argument: >-
      For a fixed character alphabet and polylogarithmic S, collision
      multiplicity is not assumed away. The first audit measures whether
      syndromes collide and whether colliding points propagate differently.
  public_evaluation:
    inputs: [curve_parameters, R, S, chi]
    method: evaluate division polynomials by public addition-chain recurrences and apply chi
    charged_cost:
      time: sum of the public division-polynomial evaluation costs for S
      memory: working recurrence state plus the syndrome
      data_queries: one public character result per syndrome coordinate
    forbidden_assistance:
      - pairing oracle
      - field discrete-log oracle
      - scalar of R
      - target-dependent index set
      - uncharged EDS association table
  one_step_propagation:
    exact_relation: >-
      Division polynomials satisfy identities relating psi_n([a]R),
      psi_na(R), and psi_a(R) raised to an n-squared power. Applying chi gives a
      multiplicative character relation among those terms when all are defined.
    missing_state: >-
      For a fixed small S, the right-hand side generally requires indices na
      outside S and a value associated with psi_a(R). Thus the syndrome is not
      closed under scalar multiplication or translation without adding indices
      whose count can grow toward the full orbit.
    collision_test: >-
      Find R and R' with D_S(R)=D_S(R') but D_S(R+P) unequal, or with different
      required out-of-set residues under the multiplication identity. Either
      refutes closed propagation for that S.
  target_decoder:
    required_statement: >-
      From D_S(P) and D_S(Q), recover x with fewer than N^(1/2-o(1)) charged
      operations, without converting the syndrome to a pairing value, field DLP,
      full EDS association, or target-trained table.
    candidate_mechanism: >-
      Prove that a public recurrence-closed index code of sub-square-root size
      determines the scalar shift and supports algebraic target descent.
    current_gap: >-
      Retrieved EDS attacks either use special group-order conditions or reduce
      associated EDS problems to standard elliptic-curve DLP machinery. No
      general fixed-syndrome scalar decoder or sub-rho recurrence closure theorem
      was found.
    verification: verify every candidate x by scalar multiplication of P and comparison with Q
  conditional_complexity_claim:
    statement: >-
      If a public index family S of size N^(1/3+o(1)) is closed under every
      division-polynomial relation used by the decoder, can be evaluated and
      stored within N^(1/3+o(1)) cost, and uniquely locates arbitrary target
      scalars in N^(1/3+o(1)) time without a pairing or field DLP, then the
      resulting ECDLP algorithm has that conditional time and memory bound.
    status: unverified
    heuristic_dependencies:
      - id: H-EDS-1
        statement: a source-independent recurrence-closed index family of the stated size exists
        falsification: closure forces N^(1/2-o(1)) or more distinct indices or evaluations
      - id: H-EDS-2
        statement: residue syndromes over that family uniquely or boundedly locate arbitrary scalar shifts
        falsification: collisions leave N^(1/2-o(1)) or more viable scalar candidates
  predictions:
    - Fixed polylogarithmic syndromes will show propagation collisions or out-of-set index growth.
    - Any valid positive result must separate its decoder from established EDS association and pairing transfers.
    - Closure size and residual scalar-list size will dominate local polynomial-evaluation cost.
  minimal_discriminating_tests:
    - id: EDS-AUDIT-BASELINE
      type: static
      action: reproduce exact rho and BSGS costs and charge every syndrome coordinate
      falsification: the gain disappears after closure expansion, retries, or target descent
    - id: EDS-AUDIT-COLLISION
      type: proposed_experiment
      action: enumerate small groups for equal syndromes with unequal successors
      control: random fixed-alphabet codes with the same length and collision rate
      falsification: one such pair refutes deterministic syndrome propagation
    - id: EDS-AUDIT-CLOSURE
      type: proof_search
      action: iterate required indices under the exact identities and bound closure growth
      falsification: closure reaches square-root size or contains a disguised full orbit
    - id: EDS-AUDIT-NEARBY
      type: static_control
      action: run the proof outline on a known EDS association instance whose solution still requires ECDLP
      falsification: an outline that declares success before discharging the ECDLP step proves too much
  falsification_criteria:
    mechanism:
      - syndrome propagation is not closed
      - closure growth reaches the generic square-root cost
      - target descent invokes a pairing, field DLP, or full association problem
    conditional_claim:
      - H-EDS-1 or H-EDS-2 fails
      - charged total work, memory, or candidate verification reaches N^(1/2-o(1))
  confounders:
    - zeros and poles can create artificial sentinel correlations
    - small-order or special-cardinality groups can activate known EDS transfers
    - addition-chain reuse can hide preprocessing cost
    - quadratic-character normalization choices can introduce scale ambiguity
  interpretation_limits:
    - Failure of one index family does not rule out every recurrence-closed code.
    - Special q-minus-1 results do not transfer to generic prime-order subgroups.
    - EDS equivalence results do not supply a sub-rho decoder.
    - This proposal is not evidence of an ECDLP improvement.
  cost_model:
    baseline:
      pollard_rho:
        time: N^(1/2+o(1)) group operations
        memory: O(1) serial state, with parallel coordination charged
        data_queries: none beyond public group operations
      baby_step_giant_step:
        time: N^(1/2+o(1)) group operations
        memory: N^(1/2+o(1)) group elements
        data_queries: none beyond public group operations
    candidate_charges:
      preprocessing: index-family construction and recurrence scheduling
      enumeration: every added closure index and every candidate scalar
      linear_algebra: any recurrence recovery or syndrome solving
      target_descent: conversion from target syndrome to scalar list
      retries: inverse success probability times per-attempt cost
      verification: one scalar multiplication per candidate
      memory: recurrence cache, syndrome table, closure set, and candidate list
      data_queries: every division-polynomial and character evaluation
      parallelism: aggregate work and memory
      multi_target: disclose source-only reuse, target count, and any per-target advice
    present_bound: >-
      Public evaluation is explicit, but fixed syndromes are not closed under the
      identities and no sub-rho locator is known. Expanding to a complete
      association or invoking a pairing/field DLP is excluded and does not
      establish the claimed route.
  pareto:
    comparison_axes: [time, memory, data_queries]
    dominated_by:
      - Pollard rho dominates any closure or candidate list of square-root size with additional syndrome overhead.
      - BSGS dominates a full EDS association table for a single target.
    sota_delta:
      time_exponent: unknown
      memory_exponent: unknown
      data_query_exponent: unknown
      statement: >-
        Recurrence algebra is a structural benefit, but no charged decoder bound
        exists; unknown axes remain incomparable rather than being assigned a gain.
    checked_rows:
      - Pollard rho
      - baby-step giant-step
  proof_search_map:
    target_statement: >-
      A recurrence-closed division-polynomial residue code supports a general
      prime-field sub-rho ECDLP decoder without established transfer routes.
    lemma_dependencies:
      - id: EDS-L1
        responsibility: lossiness and collision multiplicity
      - id: EDS-L2
        responsibility: exact character form of the division-polynomial identities
      - id: EDS-L3
        responsibility: closure-size upper bound
      - id: EDS-L4
        responsibility: target-list size, correctness, and success probability
      - id: EDS-L5
        responsibility: transfer exclusion and full cost composition
    audits:
      exact_baseline_reproduction:
        status: specified_not_run
        requirement: charge evaluation, closure, candidate checks, rho, and BSGS
      observation_collision_search:
        status: specified_not_run
        requirement: equal syndromes with unequal propagation
      quantifier_order:
        status: specified_not_run
        statement: >-
          There exists one public index family and preprocessing algorithm
          depending only on curve parameters and P such that for every target Q
          the scalar decoder succeeds within the stated bound.
      method_ceiling:
        status: specified_not_run
        nearby_object_control: EDS association instance whose remaining step is known to be an elliptic-curve DLP
        ceiling: division-polynomial identities alone can restate rather than solve scalar location
  citations:
    - citation: >-
        N. P. Smart and K. Shipsey, Elliptic Divisibility Sequences, IACR ePrint
        2008/444.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://eprint.iacr.org/2008/444.pdf
      supports: division-polynomial identity, EDS association, and special order q minus 1 attack boundary
    - citation: >-
        K. Lauter and K. E. Stange, The Elliptic Curve Discrete Logarithm Problem
        and Equivalent Hard Problems for Elliptic Divisibility Sequences,
        arXiv:0803.0728.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://arxiv.org/abs/0803.0728
      supports: EDS association, residue and width-three EDS equivalence context and generic rho or BSGS applicability
    - citation: >-
        J. H. Silverman, Common Divisors of Elliptic Divisibility Sequences over
        Function Fields, arXiv math/0404412.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://arxiv.org/abs/math/0404412
      supports: periodicity context for division-polynomial sequences over finite fields
    - citation: >-
        V. Shoup, Lower Bounds for Discrete Logarithms and Related Problems,
        EUROCRYPT 1997.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://www.shoup.net/papers/dlbounds1.pdf
      supports: generic square-root baseline
  safety:
    defensive_purpose: assess whether public division-polynomial structure weakens ECDLP
    implementation_created: false
    experiment_runs: 0
