# IDEA-20261003-bc9295
# Discriminant-absolute count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-bc9295
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The absolute discriminants 4 and 3 differ by 1
  class: measurement
  claim: >-
    The frozen absolute discriminant for j=1728 is 4. The frozen
    absolute discriminant for j=0 is 3. Four exceeds three by 1.
    The product of the two absolutes is 12. Their sum is 7. The
    gap is a discriminant label, not an ECDLP exponent.
  mechanism: >-
    The two labels are the objects. No class polynomial is built
    and no curve is counted. Two copies of the absolute 3 have
    gap 0. This is not a point-count ratio and not an automorphism
    order.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether special j-invariants confer an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from these two absolutes.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two absolutes are frozen before the subtraction.
    - No class polynomial is computed.
  proof_search_map:
    bottleneck: The absolute gap 1.
    baseline_embedding:
      parameter_slice: The absolutes 4 and 3.
      reproduction_check: >-
        Two readers subtract and must agree that 4 exceeds 3 by 1.
    observation_collision:
      observable: The absolute gap and the product.
      distinct_preimage_search: >-
        Reporting both absolutes as 3 drops the gap. Two copies of
        3 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The absolutes 4 and 3.
        predicted_gain: Integer gap. No class polynomial.
    quantifier_order: >-
      The absolutes are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The absolute gap 1. Not a point count.
      nearby_object_control: >-
        Two copies of the absolute 3. The gap is 0.
    proof_obligations:
      - claim: The frozen absolute for j=1728 is 4.
        responsibility: size
      - claim: The frozen absolute for j=0 is 3.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: absolute_gap
      direction: different
      minimum_effect: Four exceeds three by 1.
  minimal_test:
    design: >-
      Subtract the two frozen absolutes. Do not build a class polynomial.
    controls:
      - Two copies of 3, whose gap is 0.
      - An independent count.
    required_metrics:
      - both absolutes
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 1.
    - The product of the two absolutes is not 12.
  confounders:
    - A sign on the discriminant is not part of the absolute.
  interpretation_limits:
    - An absolute discriminant is not a point count.
    - No transfer to a cryptographic curve.
    - This does not measure an automorphism order.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen absolute for j=1728 is 4 and the frozen absolute
        for j=0 is 3.
      rigorous_support: >-
        No class-number theorem is claimed. The count is a reading
        of two labels.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: The class polynomial is a different object.
    tradeoff_note: A smaller absolute is not a shorter walk.
  estimated_cost:
