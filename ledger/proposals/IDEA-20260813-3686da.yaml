idea:
  id: IDEA-20260813-3686da
  question_id: RQ-UOV-001
  added: '2026-08-13'
  title: >-
    THE ATTACK MODEL'S REPRESENTATION IS LOSSY IN CHARACTERISTIC 2 AND THE LOSS
    IS COUNTABLE: the polar matrices discard the diagonal, so a polar-only
    formulation searches for a common totally ISOTROPIC subspace while the
    secret is a common totally SINGULAR one -- a gap of exactly m*o scalar
    equations, and whether the intersection-attack cost model charges them
    decides the model's own accuracy
  class: mechanism

  claim: >-
    (A) THE ALGEBRAIC FACT, WHICH IS ELEMENTARY AND NOT IN DISPUTE. Let
    P_1..P_m : F_q^n -> F_q be the homogeneous quadratic components of a UOV
    public map, q even. Write P_i(x) = sum_{j<=k} a^{(i)}_{jk} x_j x_k. The
    polar form P'_i(u,v) = P_i(u+v) - P_i(u) - P_i(v) is bilinear and
    ALTERNATING in characteristic 2, and its matrix depends only on the
    coefficients a^{(i)}_{jk} with j < k. THE DIAGONAL COEFFICIENTS
    a^{(i)}_{jj} DO NOT APPEAR IN THE POLAR MATRIX AT ALL. So the map
    P |-> (P'_1, ..., P'_m) discards exactly m*n field elements, and it is a
    genuinely lossy projection of the public key rather than a change of
    coordinates.
    This program already USES the alternating fact -- IDEA-20260805-74e78c
    derives P'(x,x) = 0 in char 2, and IDEA-20260805-ca92fd uses alternating
    invertibility. Neither asks what the projection DISCARDS. That is the gap
    this record addresses.

    (B) WHAT THE LOSS IS, STATED AS A COUNT. The oil space O of dimension o
    satisfies the TOTALLY SINGULAR condition P_i|_O = 0 identically, for every
    i. A polar-matrix formulation can only express the TOTALLY ISOTROPIC
    condition P'_i(u,v) = 0 for u,v in O. Over char 2 these are not the same
    condition, and the difference is countable:
      isotropic conditions per component:  o(o-1)/2   (pairs of basis vectors)
      singular conditions per component:   o(o-1)/2 + o
    so the singular formulation carries m*o MORE scalar equations than the
    polar-only one, and every one of them is a linear condition on the
    diagonal coefficients the polar matrices threw away. IN ODD
    CHARACTERISTIC THE GAP IS EMPTY, because P_i(u) = P'_i(u,u)/2 recovers the
    quadratic form from its polar form; the gap is a characteristic-2
    phenomenon exactly, and UOV's deployed instantiations are characteristic 2.

    (C) THE CLAIM, WHICH IS ABOUT THE COST MODEL AND CAN BE WRONG IN EITHER
    DIRECTION. RQ-UOV-001 asks whether the published plain-UOV security model
    is calibrated. This record claims that the model's accuracy turns, in part,
    on which of the two condition sets its complexity accounting assumes, and
    that the two give different predictions:
      IF the model's system is polar-only, it under-constrains the search by
        m*o equations. Its solution variety is then LARGER than the oil-space
        variety -- there can be common isotropic subspaces that are not
        singular -- so a solver reaching a solution may reach a SPURIOUS one,
        and the published cost is an underestimate of the work to a USABLE key
        while being an overestimate of the work to a solution.
      IF the model's system is singular (full quadratic), the m*o extra
        equations lower the solving degree relative to the polar-only system,
        and the published cost should reflect that.
    These are opposite biases. Determining which one the published model
    actually makes is a reading task plus an arithmetic check, and it is worth
    doing before any solving-degree measurement is designed, because the two
    formulations are different experiments.

    (D) THE CHEAP DECISIVE MEASUREMENT. At toy (q, v, m) with q even, generate
    UOV keys with known oil space, build BOTH systems -- polar-only and
    singular -- and count, exactly: the dimension of each solution variety, the
    number of common totally isotropic o-subspaces that are NOT totally
    singular, and the solving degree of each system. The middle quantity is the
    one nobody has: if it is zero at every toy cell, the two formulations
    coincide in practice and the gap is real but empty, which is a clean
    controlled null. If it is positive and grows, polar-only formulations are
    solving a strictly easier and strictly wrong problem.

    (E) WHAT THIS IS NOT. NOT a claimed attack, NOT a claimed break, and NOT a
    statement about deployed parameters -- RQ-UOV-001 caps this at toy tier and
    forbids design before primary sources are filed. The Round-3 specification
    has not been read by this program (RQ-UOV-001.provenance), so every
    statement here about what the PUBLISHED model assumes is a research target,
    not an established fact.

  discriminated_from:
    - >-
      IDEA-20260805-74e78c, which derives P'(x,x) = 0 in char 2 and uses it to
      factor MAYO's whipped map through polar values. It uses the alternating
      property; it does not ask what the polar projection discards, and it is
      about MAYO's whipping rather than plain UOV's attack model.
    - >-
      IDEA-20260805-ca92fd, which derives the intersection system from the oil
      space and measures its solving degree, and which notes char-2
      alternating invertibility and the vacuity of x^T L^{-1} x. That record's
      vacuous-equation observation is adjacent -- it is a place where char 2
      LOSES an equation -- but it is about duplicate equations inside the
      intersection system, not about the diagonal coefficients absent from the
      polar representation. The two should be read together and this record
      cites it as the nearest neighbour rather than claiming independence.
    - >-
      IDEA-20260808-ec2128 (multi-homogeneity of the k-tuple intersection
      system) and IDEA-20260808-f0dd08 (the component-dominance inequality).
      Both analyse the structure of the intersection system as given. This
      record asks whether the system as given is the right system.
    - >-
      "Witt index", "Arf invariant" and "totally singular" return ZERO hits
      across ledger/proposals and knowledge/ as of 8e230f800.

  object_first_candidate:
    tracked_object: >-
      THE DIAGONAL RESIDUE: the m*n coefficients a^{(i)}_{jj} that the polar
      projection discards, together with the m*o scalar conditions they impose
      on a candidate oil space.
    lossiness: >-
      LOSSY AND EXACTLY MEASURED: m*n field elements discarded, m*o equations
      lost on any candidate o-space. In odd characteristic the same projection
      is lossless, which is the cleanest possible demonstration that the loss
      is real rather than a bookkeeping artifact.
    propagation: >-
      The diagonal residue is NOT preserved by the change-of-basis action that
      the polar matrices carry cleanly: under x -> Sx the polar matrix goes to
      S^T P' S, while the diagonal transforms with a Frobenius twist because
      squaring is additive in char 2. That twist is the reason the residue is
      usually dropped, and it is also why it may carry information the linear
      model does not see.
    survival_score: >-
      Survives every step of a polar-only attack invisibly -- it is never
      consulted. Dies the moment the formulation moves to the full quadratic
      system, at which point it is absorbed as m*o extra equations.

  mechanism: >-
    STEP 0 -- ACQUISITION GATE, MANDATORY AND FIRST. RQ-UOV-001.constraints
    forbids designing any experiment before the relevant primary sources are
    filed as KN-LIT entries, and RQ-UOV-001.provenance records that the Round-3
    specification bundle has NOT been read and that NIST is unreachable from
    this harness (proxy CONNECT 403). So Stage 0 is: obtain the UOV
    specification and the intersection-attack source, file them as KN-LIT, and
    READ OFF whether the published complexity model's system is polar-only or
    full-quadratic. If the sources cannot be obtained, this record stops at
    Stage 0 and reports that, at zero compute -- which is the same wall
    IDEA-20260807-f73d98 documents for twenty-two questions.

    STEP 1 -- THE ARITHMETIC, WHICH NEEDS NO SOURCE. The counts in (B) are
    derivable now and are independent of any parameter set: o(o-1)/2 isotropic
    conditions per component, o additional singular conditions per component,
    m*o total gap. Verify symbolically, and verify that the gap is identically
    zero in odd characteristic. That second check is what proves the first is
    about characteristic 2 rather than about an indexing mistake.

    STEP 2 -- BUILD BOTH SYSTEMS AT TOY SCALE and compare their solution
    varieties directly, by exhaustive enumeration where the parameters permit
    it. The quantity of interest is the count of common totally isotropic
    o-subspaces that are not totally singular. It has a derivable expected
    value under a random-alternating-forms model, and measuring it against that
    expectation is the experiment.

    STEP 3 -- SOLVING DEGREE OF BOTH. Reuse this program's d_reg
    instrumentation, which RQ-UOV-001.methods already names, and report the
    two solving degrees side by side per toy cell. A gap in solving degree
    between the two formulations is the quantity that would move the published
    cost model.

  novelty_status: unverified
  novelty_screen:
    method: >-
      grep -ril over ledger/proposals, knowledge/techniques, knowledge/findings
      and knowledge/open-problems for "Witt index", "Arf invariant", "totally
      singular", "totally isotropic", "polar form", "characteristic 2",
      "alternating", "diagonal", "squared", performed 2026-08-13 against
      8e230f800; then a targeted sweep of the 14 proposals citing RQ-UOV-001.
    results: >-
      "Witt index", "Arf invariant", "totally singular": ZERO hits anywhere.
      "squared": zero hits among the 14 UOV proposals. "characteristic 2"
      appears in 3 of them (74e78c, ca92fd, 778f82) and "alternating" in 2
      (74349c, ca92fd), always as a property being USED, never as a projection
      whose discarded part is the object of study. No record counts the
      isotropic-versus-singular gap.
    verdict: >-
      UNVERIFIED, and deliberately so. The algebra in (A) and (B) is textbook
      quadratic-form theory in characteristic 2 and NOTHING about it is claimed
      as new. Whether the published UOV cost model is polar-only or
      full-quadratic is a question about a document THIS PROGRAM HAS NOT READ,
      so no novelty claim against the external literature is made and none
      could be. What is claimed is that this corpus contains no record asking
      the question. Stage 0 may well find the published model already uses the
      full quadratic system, in which case this record's contribution is the
      explicit count and a controlled null -- still worth having, and cheap.

  null_object_control: >-
    (1) ODD-CHARACTERISTIC NULL, DERIVED AND BLOCKING: run the identical
    pipeline at odd q. The isotropic-singular gap must be EXACTLY ZERO there,
    because the quadratic form is recoverable from its polar form. If the
    pipeline reports a non-zero gap at odd q it is measuring an indexing error,
    not characteristic 2, and nothing is reported.
    (2) RANDOM-FORMS NULL: replace the UOV public map by m random alternating
    forms of the same size with no planted common singular subspace, and count
    common isotropic o-subspaces. This gives the background rate against which
    the UOV count must be read; a UOV count matching the random rate means the
    planted structure is invisible to the isotropic condition, which is itself
    the answer to (D).
    (3) PLANTED POSITIVE CONTROL: a key with a KNOWN oil space, where the
    singular system must have the planted space in its solution variety. A
    pipeline that cannot find a planted solution cannot be trusted to count
    spurious ones.

  assumptions:
    - >-
      The public map is homogeneous quadratic and q is even. Both are RECALLED
      from the literature and UNVERIFIED against the Round-3 specification;
      Stage 0 checks them and the record is void for any parameter set where
      they fail.
    - >-
      The oil space is totally singular for every component, which is the
      defining property of a UOV key. If the Round-3 specification defines the
      trapdoor differently, the counts in (B) change and the record is
      superseded rather than amended.
    - >-
      Toy (q, v, m) small enough that the solution varieties can be enumerated
      exhaustively, so the spurious-subspace count is exact rather than
      sampled. RQ-UOV-001 caps the claim tier at toy regardless.

  proof_search_map:
    bottleneck: >-
      Whether the published intersection-attack complexity model's system is
      polar-only or full-quadratic. Every downstream statement about model
      accuracy depends on that single reading, and it cannot be settled without
      the primary source.
    baseline_embedding:
      parameter_slice: >-
        Odd characteristic, where the two formulations provably coincide. That
        slice must reproduce identical solution varieties and identical solving
        degrees for both systems.
      reproduction_check: >-
        Symbolic: verify P_i(u) = P'_i(u,u)/2 at odd q, hence the m*o extra
        equations are dependent. Plus a frozen fixture at one odd-q toy cell
        where both systems are built and compared for exact equality.
    observation_collision:
      observable: >-
        A candidate o-dimensional subspace that satisfies the polar-only
        (isotropic) conditions.
      distinct_preimage_search: >-
        THIS IS THE EXPERIMENT, NOT A SIDE AUDIT: search for two distinct
        subspaces with the same isotropic certificate, one totally singular and
        one not. Each such pair is a direct witness that the polar-only
        observable fails to identify the oil space. Finding none at every toy
        cell is a controlled null and means the gap, though real in the
        equations, is empty in the solution set.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The full quadratic system (singular conditions) in place of the polar
          system (isotropic conditions) -- preserving the m*o equations the
          polar representation discards.
        predicted_gain: >-
          A strictly smaller solution variety and a possibly lower solving
          degree. Quantitatively: m*o additional equations against the same
          variable count. Whether that lowers the solving degree is measured,
          not assumed.
      - transform: observable_fiber
        proposed_object: >-
          Hold the polar matrices fixed and vary the discarded diagonal,
          enumerating the fibre of the projection, then ask which fibre members
          admit a common singular subspace.
        predicted_gain: >-
          Direct measurement of how much the discarded data constrains the
          secret, rather than an argument about it.
    quantifier_order: >-
      Stated precisely, because the two readings differ in strength:
      FOR ALL UOV keys, FOR ALL i, FOR ALL u in O: P_i(u) = 0 -- the singular
      condition, which is what the trapdoor guarantees.
      FOR ALL UOV keys, FOR ALL i, FOR ALL u,v in O: P'_i(u,v) = 0 -- the
      isotropic condition, which is implied by it.
      The converse implication is what fails in characteristic 2, and the
      record's whole content is the size of that failure. A reader who treats
      the two as interchangeable has assumed odd characteristic without saying
      so.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these toy parameters, the polar-only and full-quadratic
        formulations have solution varieties differing by this measured count,
        and solving degrees differing by this measured amount." It can NEVER
        certify anything about UOV's deployed security, and RQ-UOV-001's
        claim_tier_ceiling makes that explicit.
      nearby_object_control: >-
        Odd characteristic, where the desired distinction provably vanishes. A
        method that reports a gap there has not identified the load-bearing
        structure. This is the cheapest possible check on the whole record.
    proof_obligations:
      - claim: The polar matrix omits the diagonal coefficients in char 2.
        responsibility: correctness
      - claim: The isotropic-singular gap is exactly m*o equations.
        responsibility: size
      - claim: The gap is identically zero in odd characteristic.
        responsibility: baseline
      - claim: Which system the published model uses.
        responsibility: scope
      - claim: The planted oil space lies in the singular system's variety.
        responsibility: correctness

  predictions:
    - metric: >-
        isotropic-singular equation gap, counted symbolically
      direction: different
      minimum_effect: >-
        Exactly m*o at even q and exactly 0 at odd q, with no exceptions across
        the toy grid. Any deviation refutes the count and halts the line.
    - metric: >-
        number of common totally isotropic o-subspaces that are NOT totally
        singular, per toy cell, against the random-alternating-forms expectation
      direction: different
      minimum_effect: >-
        Two-branch pre-registration: a count of 0 at every cell records a
        CONTROLLED NULL (the gap is real in the equations and empty in the
        solutions); a count growing with o or with m records that polar-only
        formulations admit spurious solutions, and the growth rate is the
        deliverable. A count matching the random-forms rate means the planted
        structure is invisible to the isotropic condition.
    - metric: >-
        solving degree of the polar-only system versus the full-quadratic system
      direction: different
      minimum_effect: >-
        A difference of at least 1 at some toy cell is required before any claim
        that the formulation choice moves the cost model. Predicted: no
        difference at the smallest cells, with a difference appearing only if
        the spurious-subspace count is positive.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): obtain and file the UOV specification
      and the intersection-attack source as KN-LIT; read off which system the
      published model uses. Halt here if unobtainable, and report the halt.
      STAGE 1 (zero compute): verify the m*o count symbolically and verify it
      collapses to 0 at odd q.
      STAGE 2 (minutes, HARD GATE): planted positive control -- generate toy
      UOV keys with known oil space and confirm the singular system's variety
      contains the planted space.
      STAGE 3 (minutes to hours): exhaustively enumerate common isotropic
      o-subspaces at each toy cell; count those that are not singular; run the
      random-alternating-forms null and the odd-q null on the identical
      pipeline.
      STAGE 4 (hours): solving degree of both systems per cell, using the d_reg
      instrumentation RQ-UOV-001.methods names.
    controls:
      - odd-characteristic null -- gap must be exactly zero
      - random alternating forms with no planted common singular subspace
      - planted oil space that the singular system must recover
      - >-
        a second, independent construction of the polar matrices from the
        public map, to exclude a transcription error in the projection itself
    required_metrics:
      - symbolic equation counts, both characteristics
      - count of isotropic-not-singular o-subspaces per cell, exact
      - the same count for the random-forms null
      - solving degree of each system per cell
      - planted-control recovery success
      - wall-clock and memory per cell, and the largest (q, v, m) reached

  falsification_conditions:
    - >-
      The odd-characteristic null shows a non-zero gap. The count is wrong or
      the implementation is; the record is superseded, not amended.
    - >-
      The planted control fails to recover the known oil space. Instrument
      failure; nothing is reported.
    - >-
      Stage 0 finds the published model already uses the full quadratic system
      AND the spurious-subspace count is zero everywhere. The record's
      cost-model claim is refuted and its residue is the explicit count plus a
      controlled null -- a smaller but honest outcome, and it is recorded as
      such rather than reframed.
    - >-
      The spurious-subspace count matches the random-forms null exactly. The
      isotropic condition carries no information about the planted structure at
      these parameters, which bounds every conclusion drawn from polar-only
      formulations and is itself the finding.

  confounders:
    - >-
      Homogeneity. If the deployed public map carries linear or constant terms,
      the polar form and the diagonal interact differently and the counts
      change. Stage 0 must read this off the specification rather than assume
      it, and the record says so.
    - >-
      Frobenius twist. The diagonal transforms with a squaring under change of
      basis, so a naive linear-algebra treatment of the residue is wrong. Any
      implementation that treats the diagonal as transforming linearly is
      measuring an artifact.
    - >-
      Toy-scale degeneracy. At very small o the counts o(o-1)/2 and o are
      comparable, so the gap looks proportionally huge in a way it would not at
      deployed o. Reported ratios must name their o.
    - >-
      Conflating "the model is polar-only" with "implementations are
      polar-only". A cost model and a working implementation can differ, and
      the question here is about the model that sets the published parameters.

  interpretation_limits:
    - >-
      Toy tier only, by RQ-UOV-001.claim_tier_ceiling. No statement about
      deployed UOV parameters follows from anything measured here.
    - >-
      Every claim about what the PUBLISHED model assumes is unverified until
      Stage 0 files the primary source. This record is a proposal, not a
      finding, and AGENTS.md rule 9 governs.
    - >-
      A measured gap in solving degree is a statement about two formulations of
      the same problem, not about UOV's security. Converting it into a cost
      statement requires the matched-baseline discipline RQ-UOV-001.constraints
      imposes.

  heuristic_assumptions:
    - id: HEUR-UOVC2-1
      statement: >-
        For m random alternating forms on F_q^n with q even and no planted
        common singular subspace, the expected number of common totally
        isotropic o-dimensional subspaces is the Gaussian binomial
        [n choose o]_q multiplied by q^{-m*o(o-1)/2}, i.e. each of the
        m*o(o-1)/2 isotropy conditions behaves like an independent uniform
        constraint on F_q.
      rigorous_support: >-
        The rigorous side is the exact count of o-subspaces of F_q^n, the
        Gaussian binomial, and the exact number of isotropy conditions
        o(o-1)/2 per form. The heuristic side is INDEPENDENCE of those
        conditions across forms and across subspaces, which imitates the
        standard random-matrix heuristic used throughout this program's
        algebraic-counting arguments and which is known to fail near
        degenerate parameter regimes.
      validation_plan: >-
        Exhaustive enumeration at toy (q, n, o) where the Gaussian binomial is
        small enough to enumerate completely -- so the comparison is against an
        exact count with no sampling error. Compare the empirical multiset of
        counts across many random draws with the predicted expectation, and
        check the variance as well as the mean, since independence failures
        show in the variance first. Tail check: the largest observed count
        against the predicted upper tail. Toy scale only and labelled so; no
        crypto-scale validation is claimed or implied.
    - id: HEUR-UOVC2-2
      statement: >-
        Adding the m*o singular conditions to the polar-only system lowers its
        solving degree by at most 1 at toy parameters.
      rigorous_support: >-
        The rigorous side is that the added equations are linear in the
        discarded diagonal coefficients and of degree 2 in the subspace
        parameters, so they cannot raise the degree; the heuristic side is the
        magnitude of the reduction, which is exactly what the program's own
        record shows extrapolations get wrong (RQ-UOV-001.motivation).
      validation_plan: >-
        Measure both solving degrees on the identical instances across the toy
        grid and report the difference as a distribution, not a single number.
        Comparison: the matched random-forms system of the same shape, so a
        measured reduction is read against the reduction that shape alone
        produces. Toy scale only.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. No attack is proposed and no complexity against
      UOV is claimed. If the spurious-subspace count is positive, the
      consequence is a CORRECTION to a published cost model's direction of
      bias, not a new exponent -- and that correction would need its own record
      with matched baselines.
    memory_exponent: >-
      Exhaustive subspace enumeration is the memory-dominant step and is what
      caps the toy grid; the Gaussian binomial grows fast in o, so the
      reachable cells are small and are reported explicitly.
    best_known: >-
      The intersection-attack family at Round-3 parameters, as recorded in
      RQ-UOV-001.targets. NOT re-derived here and NOT read from primary text;
      the matched-baseline discipline in RQ-UOV-001.constraints applies to any
      cost statement and this record makes none.
    hidden_overhead: >-
      The whole result hides inside "at toy parameters". The Gaussian binomial
      makes the enumerable region very small, so a null observed there is weak
      evidence about larger o, and the record says so rather than implying the
      null scales.
    tradeoff_note: >-
      Not applicable; no algorithm is produced.

  dominated_by: >-
    As an ATTACK: mounts none, so it is dominated on every axis by the
    intersection-attack family and by Kipnis-Shamir and reconciliation, the
    three baselines RQ-UOV-001.targets names. Checked across time, memory and
    data; nothing here improves any of them.
    As a MODEL-CALIBRATION contribution: the incumbents are IDEA-20260801-014
    (measured attack cost versus model prediction) and IDEA-20260805-ca92fd
    (derive the intersection system from the oil space, then measure its
    solving degree). This record is dominated by both on maturity -- they
    specify measurements of the system as given -- and dominates them on one
    axis only: it asks whether the system being measured is the right system,
    which neither does.
  sota_delta: >-
    Zero speedup. Deliverable delta as exact counts: one symbolic gap of m*o
    equations between the two formulations, provably zero in odd
    characteristic; one previously uncounted quantity (common totally isotropic
    o-subspaces that are not totally singular) with a derived random-forms
    expectation to read it against; and a two-branch pre-registered
    interpretation so that a zero count is a controlled null rather than a
    failed experiment. Stated as counts because "the model may use the wrong
    system" is not a value.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the m*o count and its odd-characteristic collapse are correct --
    the algebra is elementary and the risk is transcription. 0.35 that Stage 0
    finds the published model is polar-only in the load-bearing place; the more
    likely reading is that it already uses the full quadratic system, in which
    case the record's value drops to the explicit count and the null. 0.15 that
    the spurious-subspace count is positive at any enumerable toy cell. The
    record is cheap enough that the 0.15 branch justifies it, and the Stage-0
    reading is owed for the other thirteen UOV proposals anyway.

  id_allocation_provenance: >-
    python3 tools/allocate_id.py --next idea --date 20260813 (random token, no
    state scanned), then --check IDEA-20260813-3686da confirmed free before use.

