    "claim": "If an endpoint-specific solver relies on publicly measurable rank or sparsity responses, its public query signature may identify favorable endpoints at a cost below the private advantage. The test quantifies that discoverability channel without inferring a trapdoor from cost heterogeneity.",
    "mechanism": "Representation is a vector of bounded public query responses at a curve endpoint, paired with Sigma={one declared public probe, finite local isogeny exploration}. Coordinate-dependent: probes depend on curve equations and discard almost all of the solver's internal state. They are not claimed to propagate under point translations.\n\nFreeze a candidate endpoint weakness and the exact public inputs accepted by its solver. Separate response features obtainable without the secret path from features that require it. Train a threshold rule on some complete toy classes and evaluate on held-out classes with a matched endpoint prevalence, charging all negative probes. The scientific object is the ROC curve plotted against total endpoint search cost and private net solve cost. A public signature with high precision and adequate recall converts an alleged hidden weakness into a searchable one; no such signature in this finite grammar leaves it unresolved rather than proving secrecy.",
