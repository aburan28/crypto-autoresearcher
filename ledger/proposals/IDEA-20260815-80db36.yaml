idea:
  id: IDEA-20260815-80db36
  question_id: RQ-FALSIFY-a2c501
  added: '2026-08-15'
  title: >-
    THIS PROGRAM'S PROPOSALS ALL CARRY FALSIFICATION CONDITIONS AND NOBODY
    HAS CHECKED WHETHER ANY EXECUTED EXPERIMENT ACTUALLY TESTED ITS OWN:
    audit executed experiments against the falsifiers their proposals
    declared
  class: control

  claim: >-
    Every proposal here declares falsification conditions. An experiment
    that runs without testing its proposal's declared falsifiers is not a
    test of that proposal, whatever it reports. Checking executed
    experiments against the falsifiers their originating proposals declared
    is mechanical and directly measures whether the program's falsifiability
    discipline is operative or ceremonial.

  mechanism: >-
    For each executed ECC experiment, retrieve its originating proposal's
    falsification conditions and check whether the run's declared metrics
    could have detected each. Report per-falsifier coverage.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of RQ-FALSIFY-a2c501; grep 'falsification_conditions',
      'falsifier', and cross-check against experiment specifications.
    results: >-
      Falsification conditions are required on every proposal; no record
      checks whether executed experiments tested them.
    verdict: >-
      ADAPTATION. Checking an experiment against its own hypothesis's
      falsifiers is elementary; that the program has never done it is what
      makes this worth running.

  object_first_candidate:
    tracked_object: >-
      EACH DECLARED FALSIFIER, checked against whether the executed
      experiment could have detected it.
    lossiness: >-
      Reducing an experiment to falsifier coverage discards its results,
      which is deliberate: the question is whether it was a test, not what
      it found.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while experiments cite originating proposals; those that do
      not cannot be audited and are the key category.

  null_object_control: >-
    NULL 1 -- an experiment known to test its falsifiers, which must audit
    clean. NULL 2 -- a falsifier that is untestable by construction, such as
    one requiring an unavailable measurement, which must be flagged rather
    than scored as uncovered.

  discriminated_from:
    - >-
        The scoped-negative audit in this series, which checks conclusions
        against run coverage; this checks whether the experiment could
        have produced a different conclusion at all.
    - >-
        The screen-power audit, which measures whether a screen could
        detect what it looked for; this checks whether the experiment
        looked for what its proposal declared.

  assumptions:
    - >-
        Experiments cite originating proposals identifiably; those that do
        not are reported rather than assumed sound.
    - >-
        Falsifiers are stated concretely enough to check against declared
        metrics; vague falsifiers are the audit's second key category.

  predictions:
    - metric: >-
        clean-experiment null
      direction: different
      minimum_effect: >-
        FORCED clean; a flag means the criterion is too strict.
    - metric: >-
        untestable-falsifier null
      direction: different
      minimum_effect: >-
        FORCED flagged as untestable rather than scored uncovered, since
        the two mean different things.
    - metric: >-
        per-falsifier coverage across executed experiments
      direction: different
      minimum_effect: >-
        The deliverable; uncovered falsifiers mean the experiment was
        not a test of its proposal in that respect.
    - metric: >-
        count of experiments not citing an originating proposal
      direction: different
      minimum_effect: >-
        Reported separately; these cannot be audited at all.

  minimal_test:
    design: >-
      All executed ECC experiments, both nulls first.
    controls:
      - >-
          Clean-experiment and untestable-falsifier nulls.
      - >-
          Falsifiers quoted verbatim from the originating proposal so
          the audit cannot substitute easier ones.
      - >-
          Experiments not citing a proposal reported as a distinct
          category.
    required_metrics:
      - >-
          Per-falsifier coverage verdict with the metrics checked.
      - >-
          Counts of uncovered falsifiers, untestable falsifiers, and
          unauditable experiments.

  falsification_conditions:
    - >-
        A null misbehaves. The criterion is miscalibrated.
    - >-
        Most falsifiers are covered. The falsifiability discipline is
        operative, which is worth establishing rather than assuming.
    - >-
        Many falsifiers are uncovered. Experiments are running without
        testing what their proposals declared, which means the program's
        negatives are weaker than their form suggests and is the finding
        with the widest consequences.
    - >-
        Many falsifiers are untestable as declared. The proposals are
        writing falsifiers that cannot be tested, which is a different and
        equally serious process finding.

  confounders:
    - >-
        FALSIFIER VAGUENESS: a vaguely stated falsifier can be read as
        covered by almost any metric, so the audit must record the
        specific metric it matched and the judgement it made.
    - >-
        SCOPE EVOLUTION: an experiment's contract may legitimately narrow
        a proposal's scope, in which case an uncovered falsifier is out of
        scope rather than untested, and the two must be distinguished.

  interpretation_limits:
    - >-
        Audits process; establishes nothing mathematical.
    - >-
        Scoped to executed experiments citing originating proposals.
    - >-
        An uncovered falsifier means the experiment did not test that
        condition, not that the proposal is wrong.

  heuristic_assumptions:
    - id: HEUR-FALSIFY-1
      statement: >-
        An experiment's declared metrics determine which of its
        proposal's falsifiers it could have detected.
      rigorous_support: >-
        Rigorous ingredient: a falsifier is a condition on measurable
        quantities, so detection requires the experiment to measure
        those quantities, which is checkable from the declared metric
        list. THE GAP: a falsifier can sometimes be detected indirectly
        through a metric it does not name, so a purely syntactic match
        understates coverage and the audit needs judgement it must
        record rather than a mechanical rule.
      falsification_condition: >-
        A falsifier scored uncovered that a reviewer judges the
        experiment could in fact have detected.
      validation_plan: >-
        SAMPLE: all executed ECC experiments with originating proposals.
        COMPARISON: falsifier against declared metrics, with judgement
        recorded per pair. TAIL CHECK: falsifiers matched only by
        judgement rather than syntactically, reported separately.
        TRANSFER: none; the audit describes this corpus.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is comparison per falsifier per experiment.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent audit exists; falsification conditions are required by
      contract without their testing being checked.
    hidden_overhead: >-
      Vague falsifiers require judgement to match, and that judgement is
      where the audit's own reliability sits.
    tradeoff_note: >-
      Auditing falsifier coverage is cheap and measures whether the
      program's central discipline is operative; leaving it unaudited lets
      falsifiers be ceremonial.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As science: nothing is claimed. As an audit
    of the falsifiability discipline: none exists here. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: per-falsifier coverage across
    the program's executed ECC experiments, with untestable falsifiers
    distinguished from uncovered ones and experiments lacking an originating
    proposal counted separately, measuring directly whether the
    falsifiability requirement is operative or ceremonial.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that experiments cite proposals identifiably. 0.8 that the nulls
    calibrate the criterion. 0.5 that a substantial share of falsifiers turn
    out uncovered, which would mean the program's negatives are weaker than
    their form suggests and would be the most consequential process finding
    in this batch.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
