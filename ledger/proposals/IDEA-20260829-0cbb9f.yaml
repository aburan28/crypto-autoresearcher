    - ref: "Controlled vocabularies and thesauri in structured scientific record keeping (e.g. SKOS-style synonym rings, MeSH-style entry terms)"
      provenance: recalled
      claim: >-
        Relied on only for the method shape - that a curated database whose
        matching depends on exact string equality customarily supplies a
        controlled vocabulary with entry terms mapping surface forms to
