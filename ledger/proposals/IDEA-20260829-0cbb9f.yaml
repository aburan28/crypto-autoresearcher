  assumptions:
    - >-
      The instrument is read-only over committed artifacts and emits a derived
      overlay carrying, per field, the observed value multiset, the adjudicated
      synonym classes, and per newly created relation the two rows, the merged
      values and the adjudication outcome. It never edits a committed row and
      never proposes a vocabulary as an accepted schema amendment.
    - >-
      A synonym merge is admitted only when two independent adjudicators, blind
      to which rows it would connect and blind to this proposal's predictions,
      both judge the two strings to denote the same notion under the 8
      anti_laundering_rules. A merge that would connect rows across a
      primitive, a round scope, a key relation, a quantum/classical boundary or
      a result-kind boundary is rejected by rule, not by judgment.
    - >-
      No cryptanalytic search, attack execution, or reproduction occurs. Per
      RQ-SYMF-5ab172 none is authorized. Deciding that "offline" and
      "offline_computation" denote one notion is lexical adjudication, not
      cryptanalysis.
    - >-
      The provenance-channel arm (B) requires NO adjudication and is run first,
      so that a negative there stops the paid adjudicated arm.
    - >-
      This proposal depends on comparison keys being recomputable from field
      values. If IDEA-20260829-5045bf reports that the canonicalisation cannot
      be recovered, the merge arm operates on keys recomputed under a declared
      canon and says so in every result.
  proof_search_map:
    bottleneck: >-
      Byte-exact equality of eleven free-text strings, which is the precondition
      for every dominance comparison the schema permits. Any information in
      those strings that is not about the cryptanalysis - house style, producer
      identity, author phrasing - is a false separator that blocks comparisons
      the mathematics does not block, and no amount of additional literature
      acquisition removes it.
    baseline_embedding:
      parameter_slice: >-
        The empty synonym map. With no merges declared, the instrument computes
        exactly the committed key classes and exactly the committed dominance
        outcomes.
      reproduction_check: >-
        FROZEN FIXTURE, exact and able to fail - with the empty map, the
        recomputed key-class partition must reproduce the validation report's
        literal_unique_keys, target_qualified_unique_keys and its four
        enumerated cross-target collision groups, and the recomputed
        is_frontier vector must equal the committed one over the 21 canonical
        and 9 baseline rows. A mismatch halts the run before any merge is
        declared.
    observation_collision:
      observable: >-
        The proposition "these two rows have the same value in this key field".
      distinct_preimage_search: >-
        COLLISION PRESENT IN BOTH DIRECTIONS AND BOTH ARE ALREADY EXHIBITED IN
        COMMITTED TEXT. Direction 1 (different observable, same ground truth) -
        "full" and "full_round" are different strings for one notion, as are
        "offline" and "offline_computation", and two different round_convention
        strings both name source Table 5 of one paper; each such pair is a
        false separation and is the collision this proposal exploits.
        Direction 2 (same observable, different ground truth) - the string
        not_stated_by_source appears BOTH as a cost null_reason and as the
        value of the comparison-key field success_probability_convention, so
        one token carries two meanings in one schema, and two rows agreeing on
        that token agree on nothing in particular. SEPARATING CONDITION - each
        comparison-key field must carry a closed enumerated vocabulary with
        entry terms, exactly as allowed_null_reason and verification_states
        already do in the same file; the deliverable here is the measured size
        of the comparability that condition would recover, not the vocabulary
        itself.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "string equality on a free-text field" by "class equality
          under a declared, adjudicated, closed vocabulary", making
          comparability a function of the notion rather than of the spelling.
        predicted_gain: >-
          MODELED, NOT MEASURED. Encoding obligation - the empty map must
          reproduce the committed partition exactly. Soundness obligation - no
          merge may create a relation that violates any of the 8
          anti_laundering_rules under blind adjudication. Transfer obligation -
          a vocabulary adjudicated over these 67 rows is not asserted for rows
          outside them. Cost-loss obligation - the added cost is one entry-term
          table per field, plus the adjudication that produced it, both
          recorded with their kappa.
      - transform: specialization_pack
        proposed_object: >-
          Charge each merge only over the disjoint set of relations IT newly
          creates, and place the merge arm and the field-drop arm on the same
          (new relations, adjudicated violations) axes so the two coarsening
          strategies are directly comparable.
        predicted_gain: >-
          MODELED, NOT MEASURED. A two-strategy Pareto plot in which merging is
          predicted to lie strictly inside dropping - fewer new relations, zero
          violations - which is the falsifiable content. If merging produces
          violations too, the surgical claim fails and the honest conclusion is
          that no coarsening of this key is laundering-free.
    quantifier_order: >-
      CLAIMED - THERE EXISTS at least one comparison-key field containing at
      least one pair of distinct strings s, t such that FOR ALL rows carrying s
      or t, treating them as equal creates only relations that survive blind
      adjudication against ALL 8 anti_laundering_rules. AND - FOR the
      round_scope and oracle_access fields, THERE EXISTS a deterministic rule
      predicting producer shard with accuracy at least 0.90. NOT CLAIMED - that
      every observed value pair is synonymous, that a merged key is
      cryptographically sound in general, or that the recovered comparability
      changes any published result's standing. The quantifier defect being
      hunted is an existential merge sold as a universal repair, and it is
      guarded by requiring the FOR ALL rows clause to be checked over every row
      carrying either string, not only over the pair that motivated the merge.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the committed snapshot - the exact observed value multiset of each
        of the 11 comparison-key fields, an exact producer-shard classification
        accuracy from named fields against a permutation null, an adjudicated
        synonym map with Cohen's kappa, the exact count of newly evaluable
        ordered pairs it creates with their adjudication outcomes, and the
        head-to-head comparison against the same fields' drop coarsenings. The
        method can NEVER certify that a merged key is cryptographically
        correct, NEVER certify that two strings denote the same notion beyond
        the adjudicators' agreement, NEVER establish anything about rows
        outside the corpus, and NEVER convert a recovered comparison into a
        claim that a published attack is better or worse than reported.
      nearby_object_control: >-
        THE KNOWN-BAD MERGE NULL OBJECT, embedded in the same blind pool as the
        real candidates - merge full with reduced, chosen_plaintext with
        chosen_key, and hash_function with block_cipher. These are wrong by the
        anti_laundering_rules themselves and any competent adjudicator must
        reject them. Required outcome - at least 0.90 of the relations created
        by known-bad merges are adjudicated as violations, and the known-bad
        merges themselves are rejected at a rate near 1.0. If the adjudicators
        accept a known-bad merge, the rubric is broken and every yield number
        from the run is void. This is the null-object requirement of
        inventor-protocol section 3 applied to the adjudicator rather than to
        the data, and it is deliberately the same shape as the identity-field
        control in IDEA-20260829-9aaa40 so the two runs' adjudication quality
        can be compared.
    proof_obligations:
      - claim: >-
          With the empty synonym map the instrument reproduces the committed
          key-class counts, the four enumerated collision groups and the
          committed is_frontier vector.
        responsibility: baseline
      - claim: >-
          The producer-shard classification accuracy is reported against a
          label-permutation null and against the majority-class base rate, not
          as a bare accuracy.
        responsibility: correctness
      - claim: >-
          Every candidate merge is adjudicated blind by two reviewers with
          known-bad merges mixed into the pool, and Cohen's kappa is reported.
        responsibility: interface
      - claim: >-
          A merge is applied only after checking its FOR ALL clause over every
          row carrying either string, not only over the motivating pair.
        responsibility: strictness
      - claim: >-
          The merge arm and the drop arm are run on the same harness and
          plotted on the same axes, with each arm's relations listed so the
          set difference is inspectable.
        responsibility: correctness
      - claim: >-
          All conclusions scoped to the committed snapshot and to the
          adjudicated map, with the map itself published as an artifact.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        per-field observed value counts - the number of distinct strings taken
        by each of the 11 comparison-key fields over the 67 snapshot rows, and
        the number of fields containing at least one adjudicated synonym pair
      direction: higher
      minimum_effect: >-
        at least 3 of the 11 fields contain at least one adjudicated synonym
        pair. Zero such fields across all 11 falsifies the house-style claim
        and means the corpus already uses one string per notion, which would be
        a strong positive result about the producers' discipline.
    - metric: >-
        producer-shard recoverability - classification accuracy of a
        deterministic rule using ONLY round_scope and oracle_access in
        predicting a row's producer shard (legacy / modern / block) over the 67
        rows
      direction: higher
      minimum_effect: >-
        at least 0.90, against a label-permutation null and reported alongside
        the majority-class base rate (20, 27 and 20 rows, so the base rate is
        27 of 67 = 0.403). An accuracy at or below 0.60 falsifies the
        provenance-channel claim and means the observed value diversity tracks
        primitive class rather than producer.
    - metric: >-
        synonym-merge yield - the number of ordered pairs that newly share a
        full target-qualified key after applying the adjudicated synonym map,
        and the number of those pairs whose implied comparison is adjudicated
        as an anti-laundering violation
      direction: higher
      minimum_effect: >-
        at least 2 new pairs with EXACTLY ZERO adjudicated violations. Any
        nonzero violation count falsifies the surgical claim for that merge and
        the merge is withdrawn. Zero new pairs means the corpus's false
        separations do not fall inside otherwise-matching keys, i.e. the
        vocabulary problem is real but not currently costing comparability -
        an informative negative that redirects effort to key granularity.
    - metric: >-
        head-to-head - for each field carrying an adjudicated merge, whether
        the corresponding field-DROP coarsening creates a strict superset of
        the merge's relations, and how many relations in the set difference are
        adjudicated violations
      direction: higher
      minimum_effect: >-
        strict superset for every such field, with at least 1 adjudicated
        violation in the set difference for at least one field. If dropping
        creates no violations that merging avoids, the two strategies are not
        separable on this corpus and the surgical claim is not supported here.
    - metric: >-
        adjudication controls - rejection rate of the known-bad merges and
        Cohen's kappa over the blind pool
      direction: higher
      minimum_effect: >-
        known-bad rejection at least 0.90 and kappa at least 0.6. Below either
        threshold, all yield numbers are withdrawn.
  minimal_test:
    design: >-
      STAGED so that the unadjudicated arm gates the adjudicated one.
      STEP 0 - empty-map frozen fixture against the committed key-class counts,
      collision groups and is_frontier vector. HALT AND REPORT on mismatch.
      STEP 1 (no adjudication, minutes) - emit the complete observed value
      multiset of all 11 comparison-key fields over the 67 rows, with per-shard
      breakdown; fit and report the deterministic producer-shard rule from
      round_scope and oracle_access; run the label-permutation null.
      STEP 2 - decide from STEP 1 whether to proceed; an accuracy at or below
      0.60 stops the run and is reported as a clean negative.
      STEP 3 - generate candidate merges mechanically as all within-field value
      pairs whose rows would otherwise share a full key, plus the three
      known-bad merges, shuffle them, and have two independent reviewers
      adjudicate blind against the 8 anti_laundering_rules.
      STEP 4 - apply the surviving merges, recompute key classes and dominance,
      and record every newly created ordered pair with both rows' full cost
      vectors and the merge responsible.
      STEP 5 - run the same fields through a field-DROP coarsening on the same
      harness and plot both arms on (new relations, adjudicated violations).
      STEP 6 - report the value multisets, the shard rule, the adjudicated map
      with kappa, both arms' yields, and the known-bad rejection rate,
      whatever they are. A run in which no merge survives adjudication is a
      complete result.
    controls:
      - >-
        Empty-map baseline (STEP 0), which can fail and halts the run.
      - >-
        Known-bad merge null object - full with reduced, chosen_plaintext with
        chosen_key, hash_function with block_cipher, mixed blind into the
        adjudication pool; rejection at least 0.90 required.
      - >-
        Label-permutation null for the shard classifier - shuffle shard labels
        100 times and report the accuracy distribution, so that a high accuracy
        is read against chance rather than against zero.
      - >-
        Primitive-class confound control - refit the shard classifier with
        primitive and primitive_class REMOVED from the row and also within
        primitive class, so that "modern rows are sponges" cannot masquerade as
        "modern rows were written by a different task".
      - >-
        Blind adjudication - reviewers see two strings and the rows they would
        connect, never which field was targeted by this proposal's predictions
        and never the predictions themselves.
      - >-
        FOR ALL check - every merge is applied corpus-wide and its full
        consequence set is inspected, so a merge cannot be justified by the
        pair that motivated it.
    required_metrics:
      - "complete observed value multiset for all 11 comparison-key fields over 67 rows, with per-shard breakdown"
      - "count of fields containing at least one adjudicated synonym pair, with the pairs listed"
      - "producer-shard classification rule, its accuracy, the permutation-null accuracy distribution, and the majority-class base rate"
      - "within-primitive-class shard accuracy from the confound control"
      - "adjudicated synonym map published as an artifact, with Cohen's kappa and per-pair votes"
      - "known-bad merge rejection rate (must be at least 0.90)"
      - "merge-arm yield - new ordered pairs, each with the merge responsible and its adjudication outcome"
      - "drop-arm yield on the same fields, with the set difference against the merge arm itemised"
      - "both arms plotted on (new relations, adjudicated violations), with the point coordinates printed"
      - "recomputed is_frontier vector under the merged key, presented as an overlay and never as a correction"
  falsification_conditions:
    - >-
      STEP 0 fixture fails - the empty-map instrument does not reproduce the
      committed key-class counts or is_frontier vector. Run halts; the
      discrepancy is reported and all numeric claims withdrawn.
    - >-
      Shard accuracy at or below 0.60, or accuracy collapsing to chance within
      primitive class - the provenance-channel claim fails and the observed
      value diversity is attributable to genuine primitive differences. This
      stops the run before any adjudication is paid for.
    - >-
      Zero fields contain an adjudicated synonym pair - the corpus already uses
      one string per notion; the vocabulary claim fails and the lane closes as
      a controlled positive about producer discipline.
    - >-
      Zero new ordered pairs after applying the surviving merges - the false
      separations do not sit inside otherwise-matching keys, so the vocabulary
      defect is real but currently costs no comparability; forward guidance
      redirects to key granularity and to acquisition.
    - >-
      Any adjudicated violation among the merge arm's new relations - the
      surgical claim fails for that merge; the merge is withdrawn and reported.
    - >-
      Known-bad merges accepted at a rate above 0.10, or kappa below 0.6 - the
      adjudication rubric fails its own null object and every yield number is
      void.
    - >-
      The drop arm creates no violation the merge arm avoids - the two
      coarsening strategies are not separable on this corpus; the head-to-head
      claim fails and both proposals' Pareto points coincide.
  confounders:
    - >-
      PRIMITIVE-CLASS CONFOUND, DOMINANT. The three shards partition the corpus
      largely by primitive family - legacy hashes, modern hashes and
      permutations, block ciphers - so a field that predicts shard may be
      predicting primitive class instead. This is the single most likely
      alternative explanation and it is why the within-primitive-class refit is
      a mandatory control rather than a robustness check. round_scope is the
      cleanest test available, because "full" versus "full_round" carries no
      primitive-class content whatever.
    - >-
      Adjudicator anchoring. A reviewer who suspects the study's direction may
      accept marginal merges. Mitigated by blinding the field, shuffling the
      pool, embedding known-bad merges, and withholding the predictions.
    - >-
      Merge cascades. Merging two values can make a third value's rows share a
      key with both, so consequences are not additive across merges. The design
      applies merges one at a time and reports the incremental consequence set,
      then reports the joint application separately, rather than presenting
      per-merge numbers as an orthogonal decomposition.
    - >-
      Genuine distinctions dressed as synonyms. target_component hash_function
      versus sponge_hash_construction may encode a real difference (a sponge
      collision and a Merkle-Damgard collision are not the same object), and an
      eager adjudicator could merge them. Mitigated by requiring the FOR ALL
      clause and by the anti-laundering rubric, and by reporting contested
      pairs as contested rather than resolving them.
    - >-
      Small yields. With 21 canonical rows the merge arm may create only one or
      two relations, so every yield must be printed as a count with its
      denominator and never as a percentage.
    - >-
      Shard labelling. Shard membership is inferred here from row-id prefixes
      and the validation report's 20 + 27 + 20 reconciliation; the executing
      task must take it from the recorded producer_task field instead, and any
      row whose shard is ambiguous is excluded and reported.
  interpretation_limits:
    - >-
      Scoped to snapshot commit 5fc23783da8a2e62e2b3ab8728e47c48958ce02f and
      its 67 producer rows. It is a statement about this compilation's
      vocabulary, never about the published literature's terminology.
    - >-
      An adjudicated synonym map is a candidate for schema discussion, not an
      approved amendment; only a Coordinator decision on reviewed evidence can
      change the schema, and the recomputed is_frontier vector under a merged
      key is an overlay, never a correction.
    - >-
      A high producer-shard accuracy shows that the key CARRIES provenance
      information. It does not show that any specific comparison was wrongly
      blocked, which is what the merge arm measures separately.
    - >-
      The repair (a controlled vocabulary with entry terms) is ordinary
      practice in curated databases and no novelty is claimed for it. What is
      claimed as measured is its absence here and the size of what it costs.
    - >-
      No attack, trail, collision, cost or key recovery is reproduced,
      verified or questioned.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Decidability of within-field synonymy.) For a comparison-key field and
        two distinct observed values s and t, two independent adjudicators
        blind to the field's role in this study agree on whether s and t denote
        the same notion under the 8 anti_laundering_rules, with Cohen's kappa
        at least 0.6 overall and at least 0.9 on the embedded known-bad merges.
      rigorous_support: >-
        Nothing is proved. The assumption imitates the entry-term discipline of
        controlled vocabularies, where surface forms are mapped to concepts by
        curators and inter-indexer consistency is measured rather than assumed
        (recalled, general practice). The rigorous ingredients in hand are two -
        the 8 anti_laundering_rules are enumerated, finite, and each names a
        specific structural distinction, so the rubric is closed rather than a
        matter of taste; and the same schema file already carries three closed
        vocabularies applied without dispute across 266 null slots
        (invalid_or_missing_reason_count is 0), which shows the producers can
        apply an enumerated vocabulary consistently when one is supplied.
      validation_plan: >-
        WHAT TO SAMPLE - the complete blind pool of candidate merges (all
        within-field value pairs whose rows would otherwise share a full key)
        plus the three known-bad merges, adjudicated independently by two
        reviewers. SCALE - complete enumeration; the pool is expected to be
        tens of pairs at this corpus size and if it exceeds 200 a uniform
        sample of 200 is taken and the sampling reported. SHORTCUT USED TO
        REACH SCALE - the mechanical pre-filter (only pairs whose rows would
        otherwise match on all remaining key fields are adjudicated) reduces
        the pool from all value pairs to the ones that could possibly matter,
        which is what makes the adjudication affordable. PREDICTED
        DISTRIBUTION - kappa at least 0.6 overall, near 1.0 on the known-bad
        subset, and lowest on target_component, where sponge versus
        Merkle-Damgard is a genuine boundary. COMPARISON - report the per-field
        kappa and the per-pair vote table, never a pooled kappa alone. TAIL
        CHECK - the single pair with the widest disagreement, reported verbatim
        with both reviewers' reasons, since one contested pair is exactly the
        tail event a pooled kappa hides. TRANSFER ASSUMPTION, STATED - kappa
        measured on this rubric, this corpus and these reviewers does not
        transfer to another primitive set or a revised rule list.
    - id: H2
      statement: >-
        (Producer style is separable from primitive class.) The association
        between comparison-key field values and producer shard is not fully
        explained by primitive class - formally, the shard classification
        accuracy from round_scope and oracle_access remains at least 0.75 when
        the classifier is refit WITHIN a single primitive class, or when
        primitive and primitive_class are withheld from it.
      rigorous_support: >-
        Not proved and genuinely at risk, because the shards were assigned
        largely by primitive family and the confound is structural rather than
        incidental. The rigorous ingredient in hand is one specific field where
        the confound cannot operate - round_scope's values full and full_round
        both mean the whole primitive and carry no primitive-class content, so
        a split between them along shard lines cannot be explained by what is
        being attacked, only by who wrote the row.
      validation_plan: >-
        WHAT TO SAMPLE - every row, refitting the classifier (i) with primitive
        and primitive_class withheld, and (ii) restricted to hash_function rows
        alone, where both legacy and modern shards contribute. SCALE - complete
        enumeration of the 67 rows; no sampling. PREDICTED DISTRIBUTION - the
        withheld-feature accuracy stays above 0.75 while the permutation null
        stays near the base rate 0.403; if the within-primitive-class accuracy
        collapses to the base rate, H2 fails and the provenance-channel claim
        must be reported as confounded rather than established. TAIL CHECK -
        the specific rows misclassified by the round_scope rule, listed, since
        a producer who used both spellings would appear only there.
        CONSEQUENCE IF IT FAILS, PRECOMMITTED - the shard result is reported as
        confounded, the merge arm still runs on its own merits, and the claim
        that the key leaks producer identity is withdrawn rather than caveated.
        TRANSFER ASSUMPTION - measured on these three shards only.
  target_complexity:
    time_exponent: >-
      NO CRYPTANALYTIC EXPONENT IS CLAIMED OR MOVED. Instrument cost - the
      value census is O(R * F) at R = 67 and F = 11, i.e. 737 cells. The shard
      classifier over 11 categorical features on 67 rows is trivial, and 100
      permutation refits add nothing measurable. Key-class recomputation and
      pairwise dominance are O(R^2 * A) = 13266 scalar comparisons per applied
      map; with at most a few dozen merges applied one at a time, under 1e6
      operations total. Sub-second throughout.
    memory_exponent: >-
      O(R * F) plus O(R^2) relation records - kilobytes. No time-memory
      tradeoff is relevant.
    best_known: >-
      There is no incumbent measurement. The committed required_row_fields list
      (read in full this session) has no field for a vocabulary, a synonym
      class, or a producer-style attribute, so the incumbent value on every
      metric here is UNDEFINED rather than worse. The nearest incumbent inside
      this program is IDEA-20260829-9aaa40's field-DROP ablation, which
      dominates on the narrow axis "how many relations can coarsening create"
      (dropping a field creates a superset of what merging within it creates)
      and is dominated on the axis this proposal targets (laundering incurred
      per relation gained), which is precisely the head-to-head the run
      settles. Externally, controlled vocabularies with entry terms are
      ordinary curated-database practice and the REPAIR is explicitly not
      claimed as novel; a bounded two-query WebSearch this session located no
      application to a cryptanalysis frontier and nothing was fetched, so
      external dominance on the MEASUREMENT is BOUNDED-SEARCH NEGATIVE rather
      than established absent.
    hidden_overhead: >-
      The o(1) is blind two-reviewer adjudication and it dominates - minutes per
      candidate pair, scaling with the pool the mechanical pre-filter produces.
      Compute is sub-second. A second hidden cost is that the merge arm's
      conclusions live or die on the adjudication rubric, so a rubric failure
      costs the whole adjudicated arm while leaving the unadjudicated shard arm
      intact - which is exactly why the two arms are staged in that order.
    tradeoff_note: >-
      The instrument's analogue of a time-memory tradeoff is the same
      COMPARABILITY-versus-LAUNDERING tradeoff IDEA-20260829-9aaa40 defines,
      and the contribution here is a second point on it rather than a different
      curve. Deliverable - both arms' coordinates on the identical axes (new
      adjudicated-surviving relations, adjudicated violations), for every field
      carrying a merge, so a reader can see whether surgical coarsening is
      strictly inside blunt coarsening or merely cheaper. Parallelization is
      irrelevant at this scale and is not claimed.
  dominated_by: >-
    Partially dominated, disclosed rather than asserted - IDEA-20260829-9aaa40
    dominates on the axis "number of new dominance relations creatable by
    coarsening the key", because a field DROP creates a superset of what any
    within-field MERGE of that field creates; this proposal does not contest
    that axis and predicts it explicitly. It is NOT dominated on the axes it
    targets - adjudicated laundering incurred per relation gained, and producer
    provenance recoverable from the key - and on those the incumbent value is
    UNDEFINED. Pareto check performed against - (i) the COMPLETE committed
    required_row_fields list of schema v2 (read in full this session), which
    has no field for a vocabulary, a synonym class or a style attribute;
    (ii) the J1 validation report's comparison_key_reconstruction and
    comparison_key_collision_groups blocks, read in full this session, which
    report unique-key counts and four cross-target collisions and no value
    census, no synonymy and no provenance analysis; (iii) the red team report
    read in full, which challenges notions and scope in prose and quantifies no
    vocabulary; (iv) the other three sibling proposals under this question -
    IDEA-20260829-0b11ab converts cost UNITS rather than key values,
    IDEA-20260829-d29588 re-represents costs as curves, IDEA-20260829-083a6b
    calibrates reviewers - none of which touches the key vocabulary; and
    (v) IDEA-20260829-b418f4 filed in this session, which measures BETWEEN
    encoders where this measures WITHIN one corpus. DISCLOSED LIMIT - half the
    validation report and most canonical row bodies were not read this session,
    and the shard attribution of value styles is inferred from row-id prefixes
    and file order rather than confirmed row by row; a validator should check
    that inference first, because it is load-bearing for prediction (B).
  sota_delta: >-
    No attack, no exponent. Quantitative delta against this program's own
    instrument - the corpus gates every comparison on byte-exact equality of 11
    free-text fields and reports the vocabulary of those fields as, literally,
    nothing; there is no value census, no synonym map, no measurement of how
    much producer identity the key carries, and no comparison between
    coarsening strategies. This proposal targets a complete per-field value
    multiset over 67 rows, a producer-shard classification accuracy against a
    permutation null and a within-primitive-class refit, an adjudicated synonym
    map with per-field kappa published as an artifact, an exact merge yield
    with per-relation adjudication, and a head-to-head Pareto comparison
    against the field-drop arm on identical axes. It also contributes three
    observations that need no experiment - round_scope carries five spellings
    for what appear to be two notions, two round_convention strings name one
    source table, and the token not_stated_by_source is simultaneously a cost
    null_reason and a comparison-key VALUE. Against the target-result profile
    this is explicitly NON-target-class - checklist C1 is answered "no" and no
    asymptotic exponent moves - and it is proposed as a BUILDING BLOCK under
    Idea Generator search heuristic 1, since a frontier that cannot compare two
    full-round attacks because two agents spelled "full" differently cannot
    supply the matched accounting Part D of the profile requires before any
    asymptotic claim is promoted.
