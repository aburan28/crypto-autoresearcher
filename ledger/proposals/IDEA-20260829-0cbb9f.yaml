idea:
  id: IDEA-20260829-0cbb9f
  question_id: RQ-SYMF-5ab172
  title: >-
    The comparison key leaks producer identity - measure how many bits of
    "which task wrote this row" are recoverable from the key alone, and test
    surgical synonym MERGING of field values against blunt field DROPPING on
    the comparability-versus-laundering frontier
  class: representation
  claim: >-
    Schema v2 enumerates a closed allowed value set for allowed_null_reason
    (5 values), verification_states (5) and canonical_dispositions (5), and
    enumerates one for ZERO of the 11 comparison_key fields whose byte-exact
    equality gates every dominance comparison the frontier can perform. The
    consequence is measurable and this proposal measures it in three parts.
    (A) The field values are house style, not cryptanalysis. Over the 30
    canonical and verified-baseline rows read this session, round_scope takes
    the five values full, reduced, reduced_round, full_round and
    full_round_component, and oracle_access takes offline_computation and
    offline among others - and these split along PRODUCER SHARD, with
    LEGACY-prefixed hash rows using full/reduced plus offline_computation while
    the modern-hash rows use reduced_round/full_round_component plus offline.
    Two rows describing full-round attacks are therefore key-incompatible
    because two different producer tasks spelled "full" differently.
    (B) The claim is that this is a measurable provenance channel - an exact
    rule reading only round_scope and oracle_access classifies a row's producer
    shard with accuracy at least 0.90 over the 67 snapshot rows, against a
    label-permutation null.
    (C) The claim is that the repair is SURGICAL rather than blunt, and that
    the two repairs are separable in one run. Merging adjudicated synonym
    values WITHIN a field creates at least 2 new evaluable same-key ordered
    pairs with ZERO adjudicated violations of the 8 anti_laundering_rules,
    whereas dropping the same field entirely - the coarsening
    IDEA-20260829-9aaa40 proposes - creates a strict superset of those pairs
    containing at least one adjudicated violation, because dropping round_scope
    merges full with reduced while merging full with full_round does not.
    SUPPORTING OBSERVATION THAT NEEDS NO ADJUDICATION - two distinct
    round_convention strings in the committed canonical set, "first/selected
    consecutive Keccak-p[1600] rounds as parameterized in source Table 5" and
    "source Table 5 Keccak-p[1600] round convention", refer to the same table
    of the same paper, and the value not_stated_by_source - a member of the
    cost-null vocabulary - appears as the VALUE of the comparison-key field
    success_probability_convention on the AES chosen-key rows.
  mechanism: >-
    TRACKED OBJECT. The object followed through the computation is the NOTION a
    key-field string denotes - the equivalence class of the string under
    adjudicated synonymy within its field. One-step propagation is defined and
    measurable - merging one adjudicated synonym pair in one field is a single
    move that can only coarsen the induced partition, and the observable after
    each move is the set of ordered pairs that newly share a key.
    LOSSY-PROJECTION TEST (algebraic, no compute). The projection
    field string -> notion discards the spelling, the casing, the separator
    style, the producing task's house conventions and the source author's
    phrasing. It is strictly lossy - full and full_round and "full-round" all
    map to one notion and the string is not recoverable from the class. The
    discard is compatible with the operation the target performs, because the
    dominance gate tests EQUALITY of key fields and its intended semantics is
    equality of notion; replacing string equality by notion equality preserves
    exactly what the gate is for while destroying surface form. Not a change of
    coordinates - the map is many-to-one and non-invertible.
    THE ONE HONEST CAVEAT, STATED HERE RATHER THAN DISCOVERED LATER - the
    projection is well defined only relative to an ADJUDICATED synonym map, so
    unlike the algebraic projections in this question's other proposals it is
    not free of judgment. That judgment's reproducibility is heuristic H1, it
    is measured by Cohen's kappa with known-bad merges embedded in the pool,
    and if kappa fails the projection is not established and the yield numbers
    are withdrawn.
    WHY MERGING AND DROPPING ARE DIFFERENT OPERATIONS AND WHY THAT IS THE
    POINT. Both coarsen the key, so both create comparisons. Dropping a field
    quotients by the whole field - it merges full with reduced, which is
    anti-laundering rule 5 ("Reduced-round reach is not a full-round break")
    violated by construction. Merging adjudicated synonyms quotients by a
    relation that is, if the adjudication is right, ALREADY IMPLIED by the
    field's semantics - it merges full with full_round and nothing else. The
    two operations therefore sit at different points of the
    comparability-versus-laundering frontier, and a single run can put both on
    the same axes. This is the head-to-head that neither proposal can run
    alone, and it is why this proposal is written to share a harness with
    IDEA-20260829-9aaa40 rather than to compete with it.
    WHY THE PROVENANCE CHANNEL IS THE RIGHT DIAGNOSTIC. If the key were a
    function of the cryptanalysis, it would carry no information about which
    agent wrote the row. Measuring how much producer identity IS recoverable
    from the key is therefore a direct, quantitative test of contamination that
    needs no synonym adjudication at all - it is a classification accuracy
    against a permutation null - and it can be run before and independently of
    the adjudicated arm. A high accuracy localises the contamination to named
    fields; a chance-level accuracy falsifies the house-style claim outright
    and means the observed value diversity tracks genuine primitive-class
    differences instead.
    RELATION TO THE ENCODER QUESTION. IDEA-20260829-b418f4 asks whether two
    encoders of the SAME result produce the same key. This proposal asks
    whether ONE corpus uses one string per notion. They are independent - a
    corpus could be internally consistent and still not reproducible across
    encoders, or vice versa - and they have different repairs, a canon versus
    a synonym table. Both are consequences of the same root fact, that the
    schema enumerates no vocabulary for any comparison-key field.
  tracked_object: >-
    The notion denoted by a comparison-key field value - the equivalence class
    of the string under adjudicated within-field synonymy - propagated by
    single synonym-pair merges through the coarsening lattice.
  lossy_projection_test: >-
    PASSES, with a stated caveat. field string -> notion is many-to-one and
    non-invertible (spelling, casing and house style discarded), and what is
    retained is exactly the equality relation the dominance gate consumes, so
    the retained part propagates deterministically once the synonym map is
    fixed. CAVEAT, DISCLOSED - the map is adjudicated rather than algebraic, so
    determinism holds relative to a declared map whose reproducibility is
    measured as H1 and not assumed.
  novelty_status: unverified
  citations:
    - ref: knowledge/frontiers/symmetric-frontier-schema.yaml
      provenance: internal
      claim: >-
        The file enumerates closed value sets for allowed_null_reason (5),
        verification_states (5) and canonical_dispositions (5), lists 8
        dominance_rules, 8 anti_laundering_rules and an 8-cell
        sha1_required_partition, and enumerates a closed value set for NONE of
        the 11 comparison_key fields. dominance_rules require "Compare rows
        only when every dominance_domain_key field is identical".
        anti_laundering_rules include "Reduced-round reach is not a full-round
        break" and "A related-key or chosen-key result is not single-key key
        recovery".
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, FULL file read
        (137 lines).
    - ref: knowledge/frontiers/symmetric-cryptanalysis.yaml
      provenance: internal
      claim: >-
        Over the 30 canonical and verified-baseline rows, a field-targeted grep
        returns round_scope values {full, reduced, reduced_round, full_round,
        full_round_component}; oracle_access values {offline_computation,
        offline, single_message_input, chosen_input_permutation_evaluations,
        keyed_permutation_model, chosen_plaintext, chosen_key};
        target_component values {hash_function, sponge_hash_construction,
