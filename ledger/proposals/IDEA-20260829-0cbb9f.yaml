        source Table 5" and "source Table 5 Keccak-p[1600] round convention".
        success_probability_convention includes both snake_case values
        (source_expected_work, measured_complexity,
        expected_GPU_equivalent_work) and free prose with spaces ("expected
        source-reported complexity", "source reports success rate one"), and
        takes the value not_stated_by_source on two AES chosen-key rows.
        LEGACY-SHA0-COLLISION-DEMO uses round_scope full with oracle_access
        offline_computation; LEGACY-SHA1-IP-COLLISION-THEORY likewise.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, PARTIAL READ - lines
        1-175 read in full, plus a field-targeted grep returning the
