  minimal_test:
    design: >-
      CELLS. n = 17, f = t^17 + t^3 + 1, RC-1 curve; (i) m = 2 direct, l = 9,
      the 144 archived targets of RUN-CERTBIN-c417e0; (ii) m = 3 direct S_4,
      l = 6 (all 4096 pairs per attempt) and l = 9 (10^3 sampled pairs per
      attempt), 100 unsatisfiable attempts by the Stage-1 rule with the m = 3
      enumeration oracle as ground truth; (iii) m = 3 chained, l = 6, the same
      100 attempts; (iv) Koblitz sibling B = 1 on the random-x stratum as a
      secondary arm. INSTRUMENT. experiments/EXP-CERTBIN-e94b27/impl/gf2n.py,
      curve.py, macaulay.py's multilinear helpers, oracles_rc1.py's quadratic
      root-finder, plus about 250 lines: the univariate residual builder
      (S_4(x_1, x_2, X, x_R) by the resultant of IDEA-20260926-9cc043,
      verified against point addition), the degree-<=2 descent of a
      univariate, the prefix walk with a bit-packed rank test, the chain's
      sequential solve, the null residual generator, and the leaf counter
      checked against a literal DPLL on a 3-bit toy. Solver arm: `missing:
      WDSat` (vendored source at inputs/TRIMOSKA-WDSAT-2024 per KN-LIT-6e036d
      is not built in this container); if built, run XG-ext on the identical
      instances and report the realised fraction.
      PROCEDURE. (0) Zero-run: Propositions C, L1, L2 written out; the u*(n)
      table; the residual degree bound. (1) L1 regression on (i). (2) Depth-0
      rank check (ell). (3) L2 on (iii). (4) Ideal-XG walk on (ii) at both l,
      unsatisfiable attempts; the null residual; the prunable control at
      l = 6. (5) Secondary: satisfiable attempts (the walk must reach a leaf
      that oracle B confirms); the reversed leg order; the Koblitz arm. (6)
      Aggregation with CP95 on log leaf counts. SEEDS: one recorded stream for
      the pair sample at l = 9, the null draws and the Koblitz stratum.
      METRICS (units): leaf count per attempt (count) and its log2; conflict
      depth histogram (counts per depth); rank per node (dimension);
      realised fraction (dimensionless, or missing). CONTROLS: L1 and L2
      exact regressions; same-support null residual; prunable control; literal
      DPLL on a toy; reversed order; no relabelled Z/NZ control (no
      group-structure claim). OUTCOME TABLE. POSITIVE (E-LAW on the direct
      S_4, null in band, prunable control moves 2^l): the ideal-XG law is
      recorded as the ceiling of GE-in-SAT on the direct model, with u*(n)
      as its form, and every GE claim in the lane is priced against it.
      NEGATIVE (E-BELOW): the residual has linear structure beyond generic and
      the direct model's SAT exponent can approach (m-1)l; a successor
      localises the structure (a KN-FIND-5a8d3e-type functional on the
      residual) before any cost reading. ARTIFACT (L1 or L2 regression fails,
      the toy DPLL disagrees, or the prunable control does not move): void.
      FALSIFICATION THRESHOLD. E-LAW falsified iff the direct-S_4 statistic is
      outside [2^4, 2^6] at l = 6; Proposition C falsified iff any engine run
      shows L_real < L_XG on an identical instance (this would be a headline
      and would mean the engine derives nonlinear consequences, 412391's
      object). COST (estimate): implementation medium (about 250 lines);
      compute minutes at l = 6 (4096 pairs x at most 127 rank tests of
      17 x 22 per attempt), about one CPU-hour at l = 9 with 10^3 sampled
      pairs per attempt. Not a measurement.
    controls:
      - L1 exact regression at m = 2 against oracle A on the 144 archived targets.
      - L2 exact regression on the chained m = 3 system.
      - Same-support null residual (uniform coefficients on the residual's support) at the generic u*.
      - Prunable control (l redundant linear equations adjoined), predicted 2^l fewer leaves.
      - Literal DPLL enumeration on a 3-bit toy as the leaf-counter interface check.
    required_metrics:
      - leaf count and log2 leaf count per attempt, per presentation and l, with CP95
      - conflict-depth histogram per presentation
      - null-residual and prunable-control statistics
      - depth-0 linear-consequence rank (must be 1 at m = 2)
      - realised fraction per engine, or missing

  falsification_conditions:
    - 'L1 falsified iff ideal-XG at m = 2 does not reproduce oracle A on every archived target or does not give exactly 2^9 leaves.'
    - 'L2 falsified iff the chained leaf count differs from 2^{12} on any attempt.'
    - 'E-LAW falsified iff the direct-S_4 statistic at l = 6 lies outside [2^4, 2^6]; E-BELOW falsified iff it is >= 2^4.'
    - 'Proposition C falsified iff an engine refutes an identical instance in fewer leaves than ideal-XG.'
    - 'Instrument falsified (void) iff the toy DPLL disagrees with the leaf counter or the prunable control fails to move by about 2^l.'

  confounders:
    - The generic step of L3 assumes the residual's equations are in general position over their monomials; the null residual calibrates it, and the ell-type linear consequences of S_4's residual (if any) are exactly what E-BELOW would show.
    - Real XG modules see substitution variables, not monomials (e12b5a); the realised fraction is engine-specific and is never quoted without the engine, version and flags.
    - The leg order matters for the residual's identity (which leg is last); the reversed-order replicate bounds it.
    - Symmetrised CNF-XOR models (Trimoska's e-variables) change the block structure; the simulation is on the non-symmetrised direct model and says nothing about the symmetrised one without a separate encoding.
    - Satisfiable attempts have leaves at the solution; unsatisfiable attempts are the primary stratum, as RQ-SATIC-1ae57a requires.

  interpretation_limits:
    - Toy tier; n = 17, m in {2, 3}, one curve and a Koblitz sibling; the u*(n) values at larger n are arithmetic, not measurements.
    - A ceiling, not a lower bound on solvers that derive nonlinear consequences (412391's pass); Proposition C is scoped to linear-consequence refutation.
    - No exponent moves; the m <= 3 rows are closed on ECC2K-130 by the product law and the ceiling equals enumeration at every m, which the law says GE-in-SAT cannot beat.
    - KN-OPEN-020 class of V is the scoped-out linear-subspace class; not escaped.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Generic last-block refutation.) For an unsatisfiable attempt, the
        residual system of n Boolean equations of degree <= m - 1 in u free
        bits is inconsistent as a linear system in its monomials as soon as
        n exceeds the number of monomials present, and consistent while u is
        larger, so ideal-XG closes at u*(n) up to a constant factor.
      rigorous_support: >-
        Exact that a system with more independent equations than unknowns is
        inconsistent unless the right-hand sides align; the heuristic is that
        the residual's equations behave like a uniformly random system of
        that shape (the semi-regular / random-matrix reading at degree 1),
        which KN-FIND-5a8d3e shows holds for same-support nulls and fails for
        S_3 itself at degree 4, hence the E-BELOW reading.
      validation_plan: >-
        SAMPLE 100 attempts x (4096 or 10^3) pairs; COMPARE the empirical
        collapse depth distribution with the generic u* and with the null
        residual's; TAIL: the earliest collapse over all nodes and the
        fraction of nodes collapsing above u* + 1. TRANSFER: the u*(n) formula
        at n >= 19 is stated as extrapolation of the generic step.

  heuristic_note: Propositions C, L1 and L2 are exact; L3's u*(n) is exact as a count of monomials and heuristic (H1) as a refutation depth.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. The law bounds GE-in-SAT below by
      2^{(m-1)l + u*(n)} leaves on the direct model and by 2^{(m-1)l} on
      chains, i.e. by the enumeration oracle of IDEA-20260904-96c4f3 times
      2^{u*(n)}; at ECC2K-130's m = 4 cap locus that is at least 2^99 per
      attempt against a budget of 2^4.4 to 2^11, closed by about 90 bits.
    memory_exponent: Polynomial (a rank test per node); the ideal-XG tree needs no clause database.
    best_known: >-
      For the same step at poly memory, the (m-1)-fold enumeration at
      2^{(m-1)l}/(m-1)! group operations (96c4f3), which the ceiling equals on
      chains and exceeds by 2^{u*(n)} on the direct model; for the DLP, rho.
    hidden_overhead: The per-node rank test (n x (1 + u + C(u,2)) over F_2) and, for a real engine, the per-conflict constant; neither changes the exponent.
    tradeoff_note: Embarrassingly parallel across attempts and across subtrees; no time-memory tradeoff is taken.

