  proof_search_map:
    bottleneck: >-
      Whether GE-in-SAT has any regime below the enumeration exponent
      (m-1)l on the direct model, which Proposition C says it cannot, and where
      exactly its ceiling sits above enumeration (u*(n)), which L3 predicts
      and the simulation measures.
    baseline_embedding:
      parameter_slice: >-
        m = 2 direct at l = 9 is the exact slice where ideal-XG must equal
        oracle A (L1): L_XG = 2^9 leaves and the sat/unsat labels of the 144
        archived RC-1 targets reproduced exactly. The chain at m = 3, l = 6 is
        the L2 slice: L_XG = 2^{12} exactly.
      reproduction_check: >-
        (i) L1 on the archived targets, 144/144 label agreement with oracle A
        and leaf count exactly 2^9. (ii) Depth-0 ideal-XG on the direct S_3
        finds exactly one linear consequence, KN-FIND-5a8d3e's ell (a rank
        check). (iii) L2 on 100 chained attempts, leaf count exactly 2^{12}.
    observation_collision:
      observable: The ideal-XG conflict-depth histogram and leaf count per attempt and presentation; the realised fraction if an engine runs.
      distinct_preimage_search: >-
        A leaf count near 2^{(m-1)l + u*} could come from (i) generic rank
        behaviour of the residual (E-LAW) or (ii) a residual with rank
        deficiency compensated by chance; separated by the same-support null
        residual (uniform coefficients on the residual's support), which must
        give the generic u* exactly, and by the prunable control of 3c7a91
        (l redundant linear equations adjoined), where ideal-XG must close
        2^l earlier.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "run a SAT solver with XG on" by the ideal-XG tree, a
          solver-free object whose leaf count is a rank computation, ordered
          above every real XG solver by Proposition C.
        predicted_gain: A ceiling, not a gain; it bounds GE-in-SAT by enumeration plus 2^{u*(n)}.
      - transform: observable_fiber
        proposed_object: The same simulation on direct m = 2, direct m = 3, chained m = 3, the null residual and the prunable control.
        predicted_gain: Decides E-LAW against E-BELOW and E-ABOVE and locates the last-block collapse.
    quantifier_order: >-
      Proposition C: FORALL solvers refuting by linear consequences of the
      restricted parity rows, FORALL instances: L_real >= L_XG. L1, L2:
      FORALL attempts at the named presentations, exact. L3: FOR the named
      cells, L_XG within a factor 2 of 2^{(m-1)l + u*(n)} on unsatisfiable
      attempts (H1); EXISTS-or-not a residual structure making it smaller
      (E-BELOW), decided by the histogram.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At n = 17, l in {6, 9}: ideal-XG has leaf count 2^l at m = 2 (exact),
        2^{2l} on the chain (exact), and (measured) on the direct S_4 against
        the prediction 2^{2l + 5}; the null residual gives (measured); the
        realised fraction of WDSat XG-ext is (measured, or missing WDSat)."
        It certifies nothing about other n except through the u*(n) formula
        and nothing about any cost on ECC2K-130 beyond the product-law
        closure.
      nearby_object_control: >-
        The chained system (where the ceiling equals enumeration by
        construction) and the prunable control (where the conclusion must
        move by exactly 2^l).
    proof_obligations:
      - claim: Proposition C (ideal-XG refutes every node a linear-consequence solver refutes).
        responsibility: correctness
      - claim: L1 (affine residual at m = 2) and L2 (sequentially affine chain).
        responsibility: correctness
      - claim: The residual of the direct S_4 has Boolean degree <= 2 in the last block (exponent weights of a degree-4 univariate).
        responsibility: size
      - claim: u*(n) table for m = 3 (5, 5, 6, 7, 8, 12, 15 at n = 17, 19, 23, 29, 37, 89, 131).
        responsibility: size
      - claim: The simulation's leaf counter agrees with a literal DPLL enumeration on a 3-bit toy (interface check).
        responsibility: interface
      - claim: Nothing here transfers to symmetrised CNF-XOR models or to solvers with inprocessing without measurement.
        responsibility: scope
    not_applicable_reason: null

