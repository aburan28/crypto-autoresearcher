idea:
  id: IDEA-20260926-b11cb1
  question_id: RQ-SATIC-1ae57a
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    GAUSSIAN ELIMINATION IN SAT HAS A SOLVER-FREE CEILING, THE IDEAL-XG LAW:
    linearising the restricted descended system at every node closes the last
    block of the direct S_{m+1} model at u*(n) free bits with sum_{i<=m-1}
    C(u*, i) <= n (u* about sqrt(2n) at m = 3), so the leaf count is
    2^{(m-1)l + u*(n)}, exactly the enumeration oracle at m = 2 and on chains;
    computed by a rank simulation, priced against 47da4e's XG-ext ratios and
    Trimoska's "small decrease"
  class: measurement

  claim: >-
    CEILING FIRST. No row moves. The law says XOR-Gaussian elimination inside
    a DPLL search on the descended point-decomposition system can never do
    better than the (m-1)-fold enumeration oracle of IDEA-20260904-96c4f3
    (2^{(m-1)l} per attempt), which the product law already closes on
    ECC2K-130 at every m (at the m = 4 cap locus l is about 33, so
    2^{(m-1)l} is about 2^99 against a per-attempt budget of about 2^4.4,
    KN-FIND-aa2efc, or about 2^11, IDEA-20260926-4b65e3). It is a cost law
    for the SAT oracle, a closure of "Gaussian elimination as the lever", and
    a reconciliation of three corpus numbers that point in different
    directions. Representation class R1 (Boolean coordinates of the legs in a
    basis of V, block branching order); attack stage: the per-attempt solve.

    THE OBJECT. IDEAL-XG at a node of the block core order (x_1's l bits,
    then x_2's, ..., x_m's) with d bits fixed: substitute the fixed bits into
    the descended Boolean system (multilinear reduction), treat every
    remaining monomial as an independent unknown, and Gaussian-eliminate the
    n equations; the node is a conflict iff 1 lies in the row space. The
    ideal-XG tree is the DPLL tree pruned at ideal-XG conflicts, and its leaf
    count L_XG is computable exactly by a rank simulation with no SAT solver.
    PROPOSITION C (ceiling; exact). Any solver whose refutation at a node is a
    linear consequence of the parity rows restricted by the current
    assignment (Gauss-Jordan on XOR clauses plus unit propagation through
    AND gates, which is WDSat's XG module as described in KN-LIT-102cdb's
    frozen text) refutes a node only if ideal-XG does, because collapsing
    partially fixed monomials and eliminating is at least as strong as
    eliminating with the monomials opaque (IDEA-20260904-e12b5a's inertness
    mechanism is exactly the opaque case). Hence L_real >= L_XG for every such
    solver, and the realised fraction L_XG / L_real in [0, 1] is the one open
    number.
    PROPOSITION L (the law; exact where stated, generic where marked). (L1)
    m = 2, direct S_3: after x_1's l bits, S_3(x_1, X, x_R) is a quadratic in
    X whose descent is AFFINE in the l bits of x_2 (X^2 and X are both
    F_2-linear; KN-FIND-5a8d3e's ell is the depth-0 instance of the same
    linearity), so ideal-XG closes every depth-l node: L_XG = 2^l exactly, the
    root-finding oracle A of EXP-CERTBIN-e94b27 in disguise. (L2) Chained
    presentation at any m (KN-TECH-b18366): after the x-bits of m - 1 legs the
    chain is SEQUENTIALLY affine (u_1 from S_3(u_1, x_1, x_2), then u_2, ...,
    then x_m from the last S_3), so ideal-XG closes at depth (m-1) l:
    L_XG = 2^{(m-1) l}, the k = m - 1 branch that IDEA-20260922-af7396 names
    for the Oakley chain. (L3) Direct S_{m+1} at m >= 3: after (m-1) l bits the
    residual is a univariate of degree 2^{m-1} in x_m whose descent has
    Boolean degree <= m - 1 (exponent weights, IDEA-20260926-9cc043), so with
    u free bits left it has at most sum_{i<=m-1} C(u, i) monomials; a generic
    system of n equations in fewer than n monomial-unknowns is inconsistent,
    so ideal-XG closes at u*(n) = max{u : sum_{i<=m-1} C(u, i) <= n} free
    bits (H1 for the generic step): L_XG = 2^{(m-1) l + u*(n)} up to a
    constant. At m = 3, 1 + u + C(u, 2) <= n gives u* = 5, 5, 6, 7, 8, 12, 15
    at n = 17, 19, 23, 29, 37, 89, 131 (integer arithmetic, computed here),
    i.e. u* about sqrt(2n). So the ideal-XG exponent on the direct model is
    (m-1) l + u*(n), strictly between the enumeration exponent (m-1) l and the
    exhaustive-core exponent m l of IDEA-20260915-0d8e90 and IDEA-20260904-
    3c7a91, and the gap to enumeration GROWS with n like (( (m-1)! n )^{1/(m-1)}).

    THE RECONCILIATION THE LAW OFFERS (arithmetic on records, not
    measurements). (i) KN-FIND-47da4e (unverified deposit) reports WDSat's
    XG-ext cutting conflicts by 69x at n = 19 and 220x at n = 23 on m = 2
    instances with |S| about 2^{n/2}; ideal-XG's gain at m = 2 is 2^{l'} with
    l' about n/2, about 700 and 2900, so the realised fraction there is about
    0.1. (ii) The frozen Trimoska text (KN-LIT-102cdb, lines 793-798, read
    this session) reports that on the direct S_4 model Gaussian elimination
    "yields a small decrease in the number of conflicts" (IDEA-20260904-e12b5a
    reads Table 4 as 0.16% to 3.4%); ideal-XG's gain at m = 3 is 2^{u*} = 32
    at n = 17..19 and 256 at n = 37, so the realised fraction there is below
    0.01. (iii) IDEA-20260904-e12b5a derives why the CNF-XOR model's GE is
    inert before depth (m-1) l and predicts "a single sharp collapse in the
    last block"; L3 says WHERE the collapse sits for an ideal module, u*(n)
    bits above the leaves. The three are consistent under one reading: real
    XG realises the ideal ceiling only where the residual is affine (m = 2,
    chains) and almost none of it where the residual is nonlinear (direct
    m = 3), because the collapse of partially fixed monomials that L3 needs
    lives in the AND gates, which the XOR module does not see (e12b5a's
    mechanism). THE READINGS. E-LAW: the rank simulation reproduces L1 and L2
    exactly and L3 within a factor 2 (the generic step holds). E-BELOW: L3's
    residual refutes at MORE free bits than u* (the descended univariate has
    linear structure beyond generic; the interesting outcome, and the only
    one that would push the direct model's SAT exponent toward (m-1) l).
    E-ABOVE: refutes at fewer (rank-deficient residuals). Solver arm, if an
    engine is available (missing WDSat): E-IDEAL (realised fraction >= 0.5),
    E-INERT (<= 0.05), E-PARTIAL between; the corpus's two data points predict
    E-PARTIAL at m = 2 and E-INERT at m = 3.

  mechanism: >-
    OBJECT FRAME. Representation R1 in the block core order. TRACKED OBJECT:
    the linearisation state of the RESTRICTED algebraic system at a node (its
    monomial count and rank), refined to the conflict-depth histogram of the
    ideal-XG tree. Operation set Sigma: DPLL's decide / backtrack on core bits
    (a partial action on the search tree), and re-targeting. TRICHOTOMY:
    COORDINATE-DEPENDENT (the object depends on the branching order and the
    presentation, not on the group element), and BRANCHING under
    re-targeting (a fresh x_R changes the residual; the law is a statement
    about the distribution over targets, 3c7a91's B2 reading). The relation
    vector itself is untouched, Class I. LOSSY-PROJECTION TEST against Sigma:
    the projection (node) -> (depth, conflict flag) discards the assignment
    values and the identity of the variables; it is Sigma-compatible because
    decide increments depth and backtrack resets it without consulting
    values (IDEA-20260904-3c7a91's argument for the conflict-depth
    histogram); it is lossy (2^d assignments per depth). DISCRIMINATION FROM
    THE NEIGHBOUR OBJECT: IDEA-20260904-e12b5a tracks the linear deficit of
    the PARITY ROWS with substitution variables opaque (the real module's
    view); this record tracks the linearisation of the RESTRICTED ALGEBRA with
    monomials collapsed (the ideal module's view); Proposition C orders the
    two, and the realised fraction is their ratio. THE ONE OPEN NUMBER: u*(n)
    measured against the generic formula (E-LAW / E-BELOW / E-ABOVE) and, with
    an engine, the realised fraction.
    WHY A RANK SIMULATION SUFFICES. At m = 3 the expensive part of the
    descended S_4 (all monomials of degree <= 6 in 3l variables) is never
    needed: after 2l bits the residual is the univariate quartic
    S_4(x_1, x_2, X, x_R) in X over F_{2^n}, built by field arithmetic per
    (x_1, x_2) pair and descended to n Boolean equations of degree <= 2 in l
    bits (1 + l + C(l, 2) monomials); ideal-XG on the last block is then a
    walk over prefixes of x_3's bits with an n x (1 + u + C(u, 2)) rank test
    per node. At l = 6 that is 4096 pairs x at most 127 tiny eliminations;
    at l = 9 a sample of 10^3 pairs gives the conflict-depth distribution and
    L_XG = 2^{2l} x (mean subtree size). At m = 2 the simulation is oracle A
    plus the rank test at depth l (a regression check, L1). On the chain it is
    the sequential solve (L2). None of this needs numpy beyond the existing
    modules.
    OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2):
    F2 as the family; V = {deg < l} inside KN-OPEN-020's scoped-out class;
    nothing escapes it. What is added beyond the filed SAT corpus: the
    ideal-XG ceiling as a proposition, the u*(n) law for the direct model
    (the last-block collapse LOCATED, not just predicted), the reconciliation
    of 47da4e, Trimoska and e12b5a under one reading, and a solver-free
    instrument for all of it.

