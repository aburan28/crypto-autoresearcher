idea:
  id: IDEA-20260808-2ef5c8
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICEX-001
  goal_id: GOAL-ICEX-001
  title: The arity threshold was derived for a B-independent oracle and every real oracle
    depends on B; with D_trial = B^theta and the trials>=1 cap the rho-beating condition becomes
    theta < (m-1)/2, and meet-in-the-middle misses it by exactly 1/2 in theta at every arity
  class: composition
  claim: 'IDEA-20260803-fa9839 charges T = m! N D_trial / B^{m-1} + c_LA B^2 and derives "beats
    rho iff D_trial = N^d with d < (m-3)/4", treating D_trial as constant in B. No real oracle
    is: enumeration costs B^{m-1} 2^{m-1}, target-keyed meet-in-the-middle costs B^{ceil(m/2)},
    a graded algebraic solve costs about B^{m omega} under the E2-01 null. Put D_trial = c_D
    B^theta. Then T(B) = m! c_D N B^{theta-m+1} + c_LA B^2 subject to the feasibility constraint
    the model omits, trials = m! N / B^{m-1} >= 1, i.e. B <= (m! N)^{1/(m-1)}. TWO REGIMES.
    (i) theta <= 2: interior optimum B* = Theta(N^{1/(m+1-theta)}), T* = Theta(N^{2/(m+1-theta)}),
    beats rho iff theta < m-3 — which is fa9839''s threshold re-derived exactly, since d =
    theta/(m+1-theta) and theta < m-3 <=> d < (m-3)/4 identically. (ii) theta > 2: the cap
    binds, B = Theta(N^{1/(m-1)}), the linear-algebra term drops out entirely, T* = Theta(N^{theta/(m-1)}),
    beats rho iff theta < (m-1)/2. CONSEQUENCE: theta_MITM = ceil(m/2) > (m-1)/2 for every
    m, so MITM index calculus lands at N^{ceil(m/2)/(m-1)} — 2/3 at m=4, 3/5 at m=6, 4/7 at
    m=8 — decreasing to 1/2 from above and never reaching it. Enumeration (theta = m-1) gives
    exactly N^1 at every arity. The exponent deficit of MITM against rho is 1/(2(m-1)) for
    even m: at m=10 it is N^{1/18}. SO THE TARGET IS A FACTOR B^{1/2} OVER MEET-IN-THE-MIDDLE
    AT LARGE ARITY, a sublinear-in-B saving, which is exactly why stacked constant factors
    (KN-FIND-8f2c90 / 2a8b7e / c7d31e) cannot compose into it.'
  mechanism: 'Every measurement goal in this slice produces a solving degree, and a solving
    degree converts to a cost that is a power of B, not a power of N with B free. Once written
    that way the optimisation changes character: for theta > 2 the interior optimum demands
    fewer than one trial, the boundary binds, and B stops being a design parameter — so tuning
    B or the sparse linear algebra is worthless in exactly the regime every real oracle occupies
    at m >= 5. The uniform-in-m gap (ceil(m/2) versus (m-1)/2) is structural rather than numerical:
    it says the decomposition MITM is exactly a half power too expensive, and it does not
    shrink with m, which is the signature of there being only ONE constraint (the group equation)
    to zero out — so a Wagner-style k-way split, which needs a constraint splittable into
    independent blocks, degenerates back to the 2-way split. That degeneration is the named
    obstruction this record hands forward.'
  why_not_a_renamed_known_approach: 'Nearest known method: two-term index-calculus cost balancing
    (classical), and in-corpus IDEA-20260803-fa9839, whose body was read in full this session.
    Differences: (i) D_trial becomes B^theta, moving the optimiser from N^{1/(m+1)} to N^{1/(m+1-theta)};
    (ii) the trials>=1 constraint is added and BINDS for every theta > 2; (iii) the resulting
    uniform 1/2-in- theta miss by MITM is not expressible in fa9839''s form at all, because
    MITM''s cost cannot be written as N^d without first fixing B. fa9839''s threshold is reproduced
    exactly in its regime of validity, which is the required baseline embedding.'
  proof_search_map:
    bottleneck: The per-trial decomposition-decision cost D_trial.
    baseline_embedding:
      parameter_slice: theta = 0 recovers fa9839 identically.
      reproduction_check: Symbolic identity theta < m-3 <=> theta/(m+1-theta) < (m-3)/4; plus
        fa9839's own extension-field gate (predicted 2n/(n+1) vs reported 2-2/n, discrepancy
        2/(n(n+1))) re-evaluated with the Gaudry-Diem oracle's true theta. That gate is INHERITED,
        not claimed closed.
    observation_collision:
      observable: the reported single exponent alpha
      distinct_preimage_search: 'COLLISION EXHIBITED: (theta=2, m=6) gives 2/(6+1-2) = 2/5
        and (theta=4, m=11) gives 4/10 = 2/5. Two different oracles at two different arities
        give the same alpha, so alpha alone does not identify the oracle and the ICEX single-alpha
        deliverable is not identifiable; the reportable object is the pair (theta, m).'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: theta as the common deliverable of GOAL-SDEG-001 / GOAL-RELN-001 /
        GOAL-DREG-001, replacing three incommensurable quantities.
      predicted_gain: one scalar with a pre-registered pass line theta < (m-1)/2.
    quantifier_order: 'FOR ALL m >= 2 and FOR ALL oracles with D_trial = Theta(B^theta) UNIFORMLY
      in B on the feasible range, THERE EXISTS c with total cost c N^{theta/(m-1)} (theta>2)
      or c N^{2/(m+1-theta)} (theta<=2). The uniformity in B is the load-bearing quantifier:
      an oracle whose fitted theta drifts with B has no exponent and the model does not apply
      to it — a live possibility for a Groebner oracle with degree falls.'
    method_ceiling:
      strongest_certifiable_claim: A conditional exponent given a measured theta. It can never
        certify that any theta is achievable.
      nearby_object_control: F_{q^n}, where membership degree is 2 after Weil descent and
        index calculus genuinely wins at q^{2-2/n}. A cost model blind to the F_p/F_{q^n}
        difference has not found the load-bearing structure; this one localises the whole
        difference in theta.
    proof_obligations:
    - claim: two-regime formula and its boundary at theta = 2
      responsibility: correctness
    - claim: theta_MITM = ceil(m/2) including sort and hash costs
      responsibility: runtime
    - claim: trials>=1 is the binding constraint
      responsibility: feasibility
    - claim: memory exponent of each oracle at its optimal B
      responsibility: memory
  predictions:
  - observable: charged IC exponent as a function of (theta, m)
    metric: alpha = theta/(m-1) if theta>2 else 2/(m+1-theta)
    predicted: 'Exact rationals emitted before measurement for theta in {0,1,2,3,4,5,m/2,m-1,2m},
      m in 2..12. Forced values: MITM 2/3 (m=4), 3/5 (m=6), 4/7 (m=8); enumeration exactly
      1 at every m; E2-01-null algebraic about omega.'
  - observable: MITM deficit against rho
    metric: alpha_MITM - 1/2
    predicted: Exactly 1/(2(m-1)) for even m, 1/(m-1) for odd m; strictly positive at every
      m, tending to 0. No arity at which MITM IC beats rho in time.
  - observable: identifiability of the ICEX deliverable
    metric: count of distinct (theta,m) mapping to one alpha in the plausible box
    predicted: At least 2. If the enumeration finds none, the identifiability objection dies
      — a reachable negative for this record.
  minimal_test: Zero compute, one session. (1) Verify the symbolic identity theta < m-3 <=>
    theta/(m+1-theta) < (m-3)/4. (2) Emit alpha(theta,m) over the grid with exact rationals
    and a flag per cell for which constraint binds. (3) Place enumeration, MITM and the E2-01-null
    algebraic oracle on a (time, memory) plane against rho, BSGS and van Oorschot-Wiener at
    their optimal B. (4) Enumerate alpha collisions. (5) Read the frozen ICEX exponent_definition
    and record — proposing no status change — whether it reports alpha alone or (theta, m).
  controls:
  - 'KNOWN-ANSWER GATE, INHERITED UNWEAKENED: the corrected model must reproduce the published
    extension-field exponent when theta is set to the Gaudry-Diem oracle''s true value. If
    it does not, the correction is wrong and nothing else may be read.'
  - 'FEASIBILITY CHECK per cell: B >= 1 and trials >= 1. A reported optimum violating either
    is an instrument failure — detecting exactly that is how this record found the defect
    it reports.'
  - MEMORY-CHARGED COLUMN alongside every alpha, plus a time-memory-product column. A conclusion
    surviving only in the time-only column is labelled.
  - 'FREE-ORACLE NULL: theta = 0 must reproduce IDEA-20260727-003''s floor F(beta,m) = max(B,
    c_LA B^2, ...). Disagreement between the two corpus cost models is itself the finding.'
  confounders:
  - theta may not exist for a Groebner oracle (degree falls make the cost non-power-law);
    a fitted theta needs a CI and a lack-of-fit statistic.
  - Mean yield from KN-FIND-007 is exact only under harvest-all; one-relation-per-target costs
    a bounded factor <= 1.582, disclosed, does not move theta.
  - Relation independence is not modelled; the conservation mean scores a rank-deficient base
    as tied with a random one.
  - The x-only factor base multiplies the MITM table by 2^{ceil(m/2)} (sign ambiguity); constant
    at fixed m, disclosed.
  falsification_conditions:
  - The symbolic identity in step (1) fails — baseline embedding wrong, record void.
  - The corrected model still misses the published q^{2-2/n} with the true theta — the two-term
    charge itself is wrong and no prime-field corollary may be drawn.
  - Someone exhibits a decomposition oracle with theta < (m-1)/2 at some m — headline falsified,
    and that is the most valuable outcome available here.
  - No (theta,m) collision exists in the plausible box — identifiability objection withdrawn.
  interpretation_limits: A cost model, not an algorithm and not a lower bound. It assumes
    the charged shape (relation collection plus sparse linear algebra); large-prime, partial-relation
    and batch-descent variants change the first term and are out of scope (IDEA-20260731-012
    owns them). It asserts nothing about achievability of any theta. Toy tier is irrelevant
    here because nothing is measured; the tier of any conclusion is the tier of the theta
    fed in.
  assumptions:
  - Prime-order group of order N, factor base size B, arity m fixed.
  - Sparse linear algebra at c_LA B^2; dense B^omega reported as a variant.
  - Yield taken exactly from KN-FIND-007.
  - D_trial = Theta(B^theta) uniformly on the feasible B-range.
  heuristic_assumptions:
  - id: HA-1
    statement: Per-target relation counts are Poisson with mean mu = C(B+m-1,m)/N and independent
      across targets, so B relations need B/mu targets when mu >= 1.
    rigorous_ingredient: 'KN-FIND-007: the mean is exactly C(B+m-1,m)/N for every factor base,
      a double count, measured deviation exactly 0 over 144 cells. Only independence and the
      Poisson shape are heuristic.'
    distribution_imitated: Poissonisation of a uniform allocation of C(B+m-1,m) multiset sums
      into N targets.
    validation_route: Exhaustively enumerate multisets on toy curves (N <= 2^18, m in {2,3}),
      compare the empirical per-target count CDF against Poisson(mu) by chi-square, cross-checking
      cell means against KN-FIND-007's battery. TOY SCALE; the Poisson shape at crypto scale
      is neither validated nor claimed.
    tail_checks: Observed maximum per-target count against the Poisson tail; a heavy upper
      tail means concentration (KN-FIND-007 measured 1224x for the small-multiples base) and
      invalidates the trials estimate for structured bases specifically.
  - id: HA-2
    statement: 'theta_MITM = ceil(m/2): the target-keyed meet-in-the-middle over an unstructured
      base of size B costs Theta~(B^{ceil(m/2)}) time and Theta~(B^{floor(m/2)}) memory per
      target, with no k-way improvement.'
    rigorous_ingredient: Rigorous for the counts (enumerate C(B,ceil(m/2)) partial sums, sort,
      look up complements). Heuristic only in the no-Wagner clause, which rests on there being
      exactly one group constraint rather than a constraint splittable into independent blocks.
    distribution_imitated: The generalised birthday problem with a single modular constraint,
      where the k-tree algorithm degenerates to 2-way MITM.
    validation_route: On prime-order groups with N <= 2^24 measure 2-way versus 4-way splits
      at m in {4,6,8} and confirm the 4-way does not win. Cheap and decisive. TOY SCALE.
    tail_checks: False-positive table hits per target should be Theta(B^m/N); an excess signals
      a hashing defect, not structure.
  target_complexity:
    time_exponent: alpha = theta/(m-1) for theta>2, 2/(m+1-theta) for theta<=2. Enumeration
      N^1; MITM N^{ceil(m/2)/(m-1)} (2/3, 3/5, 4/7 at m=4,6,8); algebraic under the E2-01
      null about N^{omega}. Versus rho N^{1/2}.
    memory_exponent: Enumeration N^{2/(m-1)} (relation matrix only); MITM N^{floor(m/2)/(m-1)}
      -> N^{1/2}; dense Macaulay N^{2 m omega/(m-1)}, sparse unmeasured anywhere in this corpus.
      Rho is O(1).
    best_known_baseline: rho 0.886 sqrt(N) time O(1) memory; BSGS (N^{1/2}, N^{1/2}); van
      Oorschot-Wiener sqrt(N)/n_proc.
    hidden_overhead_disclosure: Every alpha hides m!, c_D, c_LA and sort/hash polylogs; m!
      = 720 at m=6 is not negligible at the arities actually discussed and is carried explicitly.
      Several cells sit at exactly one trial, where the asymptotic model is weakest.
    time_memory_tradeoff: Central. MITM at (N^{ceil(m/2)/(m-1)}, N^{floor(m/2)/(m-1)}) is
      dominated by rho under any memory-charged model (KN-TECH-035, KN-TECH-044); the time-only
      column is the only one where the family is competitive and is labelled as such wherever
      quoted. A recompute-instead-of-store variant is the obvious next costing and is NOT
      done here.
  sota_delta: 'Zero on every attack axis; no algorithm is proposed. Quantitatively: the threshold
    moves from "d < (m-3)/4 for a B-independent oracle" to "theta < (m-1)/2 whenever theta
    > 2", which is the regime every real oracle occupies at m >= 5; the best known decomposition
    oracle is placed at N^{4/7} at m=8 instead of at an unstated point; the required improvement
    over it is quantified as B^{1/2} = N^{1/(2(m-1))}, i.e. N^{1/18} at m=10; and an identifiability
    collision in the ICEX deliverable is exhibited.'
  dominated_by: 'n/a (no result claimed); frontier checked row by row. TIME: rho dominates
    every cell of the table; BSGS N^{1/2}; Gaudry-Diem q^{2-2/n} dominates only in the extension-field
    slice. MEMORY: rho O(1) dominates everything here. DATA/QUERIES: all query-free, no separation.
    PREPROCESSING: S T^2 = Omega~(N) (KN-TECH-005), not approached. MULTI-TARGET: sqrt(TN),
    not addressed here (see E2-11). Honest verdict: no cell produced is Pareto-undominated,
    and saying so IS the result.'
  estimated_cost: Implementation low (table generator plus one symbolic identity check); compute
    zero; one session.
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the two-regime formula and the feasibility correction
    are right. 0.85 that theta_MITM = ceil(m/2) survives with no k-way improvement. 0.6 that
    the identifiability collision is judged decision-relevant. 0.03 that the record causes
    anyone to exhibit theta < (m-1)/2 — the branch worth 100x the rest.
  novelty_status: screened
  novelty_class: adaptation
  novelty_screen: EXISTING_PROPOSALS.txt (all title lines; full bodies of IDEA-20260803-fa9839
    and IDEA-20260806-7ea402 read), EXISTING_HYPOTHESES (H-ICEX-4ccbaa/9e54c2/a2e95b, H-PATH-7fdef7),
    REJECTED_TITLES, CATALOGUE_TITLES (A1-13, A1-4), KNOWLEDGE_BARRIERS, GOAL-ICEX-001.yaml
    in full, KN-FIND-007, KN-TECH-005, KN-TECH-035, and my own E2.yaml. No corpus record writes
    D_trial as B^theta, imposes trials>=1, or states theta < (m-1)/2. WEB SEARCH UNAVAILABLE;
    two-term balancing and MITM are classical and no novelty is claimed for either.
  discriminated_from: 'IDEA-20260803-fa9839 (parent, read in full): fixes D_trial = N^d independent
    of B; this makes it B^theta, adds the cap, derives a second regime fa9839 cannot express.
    IDEA-20260727-003 computes the FREE-oracle floor — that is the theta=0 slice, used here
    as a control. IDEA-20260731-007 proposes the claw rewrite of the decomposition search;
