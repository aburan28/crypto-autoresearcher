    does not. IDEA-20260805-4d31bc/-bb4488/-c8524f/-c06631 audit the ICEX ESTIMATOR and its
    CI; this audits the COST MODEL the estimator estimates, and its identifiability point
    is about the deliverable''s arity, not its confidence interval. E2-01 supplies the algebraic
    theta this record consumes.'
