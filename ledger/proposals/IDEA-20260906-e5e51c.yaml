  honest_prior_of_survival: >-
    0.2. Decomposed: P(the FIPS 203 premise and the absence of a per-key salt
    both hold) about 0.85; P(the crossing exists at ML-KEM-1024 for some
    reachable N, given that) about 0.9, since the arithmetic is nearly forced;
