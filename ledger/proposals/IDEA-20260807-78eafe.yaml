idea:
  id: IDEA-20260807-78eafe
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    THE EDWARDS y-ONLY SUMMATION POLYNOMIAL WAS NEVER MEASURED - EV-REP-001 and
    EV-REP-002 compared 4-variable Weierstrass Semaev against an 8-variable
    NATIVE Edwards system and concluded "model-invariant"; the matched object is
    the ELIMINATED 3-variable S_3 in the Edwards y-coordinate, whose per-variable
    degree is predicted EXACTLY 2 and whose support is predicted to lie in the
    14 even-total-degree monomials because translation by the 2-torsion point
    (0,-1) acts on y as y -> -y
  class: representation

  claim: >-
    (A) THE GAP IN THE LEDGER, STATED PRECISELY BECAUSE IT IS THE WHOLE REASON
    THIS RECORD EXISTS. EV-REP-001 records, at m = 2, arms "W_semaev (fair
    Weierstrass baseline, y-eliminated Semaev, x-membership)" and "ED_x and ED_y
    (Edwards native)". EV-REP-002 records, at m = 3, "Edwards native (8 vars)
    wall-time grows 0.09 -> 31s across d while Weierstrass Semaev (4 vars) stays
    fast: constant-factor disadvantage at the SAME solving degree." DEC-20260716-
    002 then set H-REP-001 to rejected_scoped and KN-FIND-023 recorded "model not
    a solving-degree lever at that scope". The comparison was between a
    y-ELIMINATED Weierstrass system and a NON-eliminated Edwards system. Those are
    not matched objects: one has 4 variables, the other 8. The observed Edwards
    disadvantage is therefore fully explained by the variable count, exactly as
    EV-REP-001 itself already diagnosed for the W_native_x arm ("this is a
    suboptimal formulation whose extra solutions are +-y sign branches, NOT a
    model property"). The same diagnosis was applied to the Weierstrass arm and
    NOT to the Edwards arm. The matched Edwards object - the reduced summation
    polynomial in the single coordinate y, with 3 variables at m = 3 - does not
    appear in any run record I can find.

    (B) THE OBJECT AND ITS DEGREE. On a twisted Edwards curve
    a x^2 + y^2 = 1 + d x^2 y^2, negation is -(x, y) = (-x, y). So the coordinate
    y is negation-invariant, the map y : E -> P^1 has degree 2, and it is exactly
    the Kummer coordinate. By the fibre count of IDEA-20260807-dadcd2 (L1) with
    Gamma = {+-1}, the reduced summation polynomial S_m^{Ed,y} has per-variable
    degree EXACTLY 2^(m-2) - identical to Weierstrass. Concretely
    deg_{y_i} S_3^{Ed,y} = 2, total degree 4, in 3 variables. Equivalently, since
    the Edwards-to-Montgomery map is u = (1 + y)/(1 - y), a MOEBIUS map, S_3^{Ed,y}
    is the Weierstrass S_3 with a Moebius substitution per variable and
    denominators cleared - degree-preserving by construction.

    (C) THE SUPPORT PREDICTION, WHICH IS THE PART THAT IS NOT A RESTATEMENT.
    The point T = (0, -1) is 2-torsion on every twisted Edwards curve, and
      (x, y) + (0, -1) = ((x*(-1) + y*0)/(1 + 0), (y*(-1) - a*x*0)/(1 - 0))
                       = (-x, -y),
    directly from the twisted Edwards addition law. So translation by T acts on
    the coordinate y as y -> -y. Replacing P_i by P_i + T for an EVEN number of
    indices leaves P_1 + ... + P_m unchanged; hence S_m^{Ed,y} is invariant under
    flipping the sign of any even number of its variables, hence
      SUPPORT(S_m^{Ed,y}) is contained in the monomials of EVEN TOTAL DEGREE.
    At m = 3 with per-variable degree at most 2 this is a count I can do exactly:
    of the 27 exponent vectors in {0,1,2}^3, those with even coordinate sum number
    (27 + 1)/2 = 14. So
      SUPPORT(S_3^{Ed,y}) <= 14, versus SUPPORT(S_3^W) = 13 (hand-expanded in
      IDEA-20260807-e6d79e) and SUPPORT(S_3^Mont) = 27 for A != 0.
    The exact value in {?, ..., 14} is [open] and IS THE MEASUREMENT.

    (D) THE THREE OUTCOMES, PRE-REGISTERED, EACH WITH A MEANING.
      OUTCOME 1 - support exactly 14 and degree exactly 2. Then Edwards is
        essentially TIED with Weierstrass (14 versus 13) on the only axis where
        models can differ at all, and the standing conclusion KN-FIND-023 is
        CONFIRMED on the matched object it was never tested on. That upgrade
        matters: right now the conclusion rests on a mismatched comparison.
      OUTCOME 2 - support strictly below 13, say 9 or 10. Then the Edwards
        coordinate is genuinely SPARSER than short Weierstrass, and since mixed
        volume is monotone-ish in support (KN-TECH-007), the lane has found the
        first model that beats short Weierstrass on a measurable axis. That would
        be a real, if constant-factor, finding and would justify recomputing the
        BKK constants of KN-FIND-2a8b7e / KN-FIND-c7d31e in the Edwards
        coordinate.
      OUTCOME 3 - support above 14, or degree not 2. Then the parity argument in
        (C) is wrong, or the elimination is not returning the reduced polynomial,
        or the addition law used is not the twisted Edwards one. All three are
        instrument findings that invalidate other L11 arms and must be fixed
        before anything else in the lane is believed.

    (E) WHY THIS IS THE CHEAPEST VALID DISCRIMINATOR IN THE LANE. It is one
    resultant elimination and one monomial count on one curve. It costs minutes.
    It simultaneously (i) closes a documented gap in the ledger, (ii) tests
    IDEA-20260807-dadcd2's (L1) on the model where the corpus already has an
    empirical prior, and (iii) produces the number that decides whether L11 has
    anything at all beyond its closure.

  resource_label: >-
    R1 (x-coordinates - here y-coordinates - as field elements forming the factor
    base) and R2 (curve equation and model).
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE. The resource is the polynomial system's coefficient data, which
    is invisible to the generic-group simulator of KN-FIND-b7e091: that simulator
    answers group-operation and equality queries and cannot produce the monomial
    support of a polynomial over F_p. H-ENDO-001 does not apply because no
    endomorphism is applied to points of G. The ceiling is nevertheless known in
    advance and stated: IDEA-20260807-dadcd2 shows the DEGREE cannot move, so the
    admissible resource can only purchase support and coefficient structure.

  discriminated_from:
    - >-
      H-REP-001 / EV-REP-001 / EV-REP-002 / DEC-20260716-002 / KN-FIND-023. Those
      tested "Edwards native", an 8-variable system at m = 3 using both Edwards
      coordinates per point. This tests the 3-variable ELIMINATED y-only
      summation polynomial, which is the object matched to Weierstrass Semaev.
      This record does NOT re-assert H-REP-001; H-REP-001 claimed a strictly LOWER
      SCALING of d_reg in the factor-base degree and was rejected on its own
      terms. This record predicts NO degree change at all and asks a different
      question - support - on a different object.
    - >-
      IDEA-20260807-dadcd2, which derives the degree tie for every model. This
      record supplies the Edwards-specific parity structure, which is a symmetry
      by a TORSION TRANSLATION and therefore contributes nothing to that record's
      g (translations are not in Aut(E,O)). The two records are complementary and
      the distinction between deck-group symmetry and torsion symmetry is exactly
      the content.
    - >-
      KN-LIT-004 (Faugere-Gaudry-Huot-Renault 2014). That paper already exploits
      the extra 2-torsion symmetry on twisted Edwards curves to shrink
      decomposition systems and claims an exponential-in-n factor. THIS RECORD
      CLAIMS NO NOVELTY FOR THE SYMMETRY. What it claims is the specific,
      unrecorded consequence for the MONOMIAL SUPPORT of the y-only S_3, and the
      specific comparison against the hand-counted 13 for short Weierstrass -
      numbers that appear nowhere in this repository.
    - >-
      IDEA-20260807-e6d79e (Montgomery). Same 2-torsion point, Moebius-conjugate
      presentation. On Montgomery the involution is x -> 1/x and produces a
      PALINDROMIC COEFFICIENT relation with full support; on Edwards it is
      y -> -y and produces SPARSITY. Same symmetry, opposite manifestation. Which
      manifestation you get is exactly the model choice, and that is the sharpest
      statement L11 can make.

  object_first_candidate:
    tracked_object: >-
      THE PARITY GRADING of the summation polynomial: the decomposition of
      S_m^f into components by the character of the group generated by the
      residual involutions that the curve's RATIONAL 2-torsion induces on the
      Kummer line. Tracked as the coordinate varies over one fixed curve.
    established_families_off_limits: >-
      Off-limits as the primary lens: rho and its variants, BSGS, Semaev in the
      Weierstrass coordinate as an algorithm to tune, Weil descent, pairing
      transfer, lattice/HNP, isogeny walks. The object is a character
      decomposition of a polynomial, not an algorithm.
    lossiness: >-
      LOSSY AND COMPATIBLY SO. The grading forgets all coefficient values and all
      monomials, retaining only the character under which each surviving monomial
      transforms. It is not a change of coordinates: the fibre over a given
      grading is a large linear family. The retained part propagates
      deterministically under the target's operation because the group inducing
      the grading acts by TRANSLATIONS on E, and translation by T applied to an
      even number of summands preserves the relation sum P_i = O exactly - so the
      grading is preserved by the very operation the decomposition problem uses.
      A coordinate in which the involution is not monomial (Montgomery, where it
      is x -> 1/x) still carries the grading but as a coefficient relation rather
      than as sparsity, which is precisely the compatible-discard condition being
      satisfied in a different basis.
    propagation: >-
      One step - apply the involution to one variable - flips the character. Two
      steps return to the trivial character. So the one-step propagation rule is
      an explicit Z/2 action on the exponent box, and is measurable by counting
      monomials in each parity class.
    survival_score: >-
      Survives every Moebius reparametrisation as a grading (it is intrinsic),
      but survives as SPARSITY only in the coordinates that diagonalise the
      involution. Dies entirely when the curve has no rational 2-torsion - which
      is exactly the prime-order cryptographic case, and is why this record is
      scoped to cofactor-4 curves and says so.

  mechanism: >-
    STEP 1 - BUILD AND VERIFY. Construct a toy twisted Edwards curve
    a x^2 + y^2 = 1 + d x^2 y^2 over a 16-bit prime with its birational
    Weierstrass model. Verify on 200 random points that the map is a group
    isomorphism onto its image, using harness/toycurve.py as the independent
    on-curve verifier for the Weierstrass side. GATE: a failure stops the line.
    STEP 2 - ELIMINATE. Form the twisted Edwards addition law for
    P_1 + P_2 + P_3 = O and eliminate x_1, x_2, x_3 using the curve equations
    x_i^2 = (1 - y_i^2)/(a - d y_i^2), obtaining a polynomial in y_1, y_2, y_3
    only. Take its squarefree part. GATE: verify by direct substitution that the
    result vanishes on 200 random valid triples and does NOT vanish on 200 random
    invalid triples. A polynomial that vanishes on everything is the trivial
    failure mode of an over-eager elimination and must be caught here.
    STEP 3 - COUNT. Read off per-variable degree (predicted exactly 2), total
    degree (predicted 4), the explicit support set, and the support size
    (predicted at most 14). Verify directly that every monomial has even total
    degree - this is a strong check of the parity argument that costs one pass.
    STEP 4 - CROSS-CHECK BY SUBSTITUTION. Independently obtain S_3^{Ed,y} by
    substituting the inverse Moebius map y_i -> (u_i - 1)/(u_i + 1) into the
    Montgomery S_3 of IDEA-20260807-e6d79e and clearing denominators. The two
    derivations must agree up to a scalar. Disagreement means one of the two
    eliminations is wrong.
    STEP 5 - THE COST COMPARISON, ON MATCHED OBJECTS. On the SAME curve, the SAME
    points, and the SAME factor base expressed in each model's own coordinate,
    run the identical measurement panel of IDEA-20260807-1354d8 on the 3-variable
    Weierstrass Semaev system and the 3-variable Edwards y-only system: Bezout,
    BKK mixed volume, Macaulay dimension at the first fall, F4 maximum degree,
    Groebner basis size and wall time. This is the comparison EV-REP-002 could
    not make because its Edwards arm had 8 variables.
    STEP 6 - THE NULL. Apply the random-Moebius null of IDEA-20260807-4fc635 to
    the Weierstrass coordinate. If a random Moebius reparametrisation produces
    the same support statistics as Edwards, the Edwards number is not an Edwards
    property. The parity check of Step 3 is the discriminator: the random null
    must FAIL it, Edwards must PASS it.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for "Edwards" (2026-08-07); 29 ledger
      files and several knowledge files hit. Full reads of ledger/H-REP-001.yaml,
      ledger/RQ-REP-001.yaml, ledger/EV-REP-001.yaml, ledger/EV-REP-002.yaml,
      ledger/DEC-20260716-002.yaml, knowledge/findings/KN-FIND-023.md,
      knowledge/open-problems/KN-OPEN-003.md, knowledge/literature/KN-LIT-004.md,
      knowledge/techniques/KN-TECH-002.md, harness/semaev.py. Web search on
      summation polynomials over curve forms.
    results: >-
      INTERNAL - the Edwards arms of EV-REP-001/002 are explicitly labelled
      "native" and the m = 3 arm explicitly has 8 variables. No record contains a
      3-variable Edwards y-only summation polynomial, its degree, or its support.
      KN-OPEN-003 remains OPEN and asks exactly this question. KN-FIND-023 is the
      standing scoped negative and is cited here as the thing being tested on its
      matched object rather than contradicted.
      EXTERNAL - KN-LIT-004 (FGHR, J. Cryptology 27(4) 595-635, 2014) establishes
      the 2-torsion symmetry on twisted Edwards curves and its exploitation; that
      mechanism is NOT claimed as new. Cheng-Kodera-Miyaji, IEICE Trans.
      Fundamentals E102-A(9) 1061-1071, 2019, doi 10.1587/transfun.E102.A.1061,
      compares twisted Edwards among other forms under index calculus; I have
      read only the abstract and therefore mark as UNKNOWN whether it reports the
      y-only support count. Stage 0 of the minimal test is to find out.
    verdict: adaptation

  null_object_control: >-
    MANDATORY AND BLOCKING. Matched null - the SAME curve in the SAME Weierstrass
    model with a random Moebius substitution x_i -> mu(x_i) applied identically to
    every variable, mu drawn uniformly from PGL_2(F_p). Same degree, same variable
    count, same curve, same points: only the coordinate differs, exactly as for
    Edwards. DECAY PARAMETER: the number of independent random Moebius maps
    applied, 0 to 3. The parity property of Step 3 must decay to failure as soon
    as that parameter exceeds 0 (a random mu does not diagonalise the 2-torsion
    involution), while support size must NOT decay - it should jump to 27 and stay
    there. A pipeline in which the random null also passes the parity check has a
    bug in the parity check. SECOND NULL - a curve WITHOUT rational 2-torsion, in
    any degree-2 coordinate: the parity grading must be absent, since the
    mechanism requires the rational 2-torsion point. That second null is what
    connects this record to the prime-order case and is the reason the finding,
    whatever it is, cannot be transported to a cryptographic curve.

  assumptions:
    - >-
      The curve has a rational point of order 4 (equivalently admits a twisted
      Edwards model), so 4 | #E(F_p). Guaranteed by construction for the tested
      instances and fatal to any transport to prime-order curves.
    - >-
      a and d are both nonzero and a != d (non-singular twisted Edwards).
    - >-
      Elimination returns the reduced polynomial; verified by the vanish/non-vanish
      gate in Step 2 rather than assumed.
    - >-
      "Support" is counted over F_p for the specific instance; a coefficient that
      vanishes mod p by accident inflates sparsity. Repeated over 5 primes.

  proof_search_map:
    bottleneck: >-
      Step 2, the elimination of x_1, x_2, x_3 from the twisted Edwards addition
      relation. This is the step that has not been done in this repository, it is
      where the object either exists in 3 variables or does not, and its cost and
      correctness determine everything downstream.
    baseline_embedding:
      parameter_slice: >-
        The Weierstrass arm of the SAME comparison: 3-variable Semaev S_3 from
        harness/semaev.py s3_expr on the same curve, same factor base. Predicted
        per-variable degree 2, support 13.
      reproduction_check: >-
        Frozen fixture - s3_expr on the fixed toy curve, exact per-variable degree
        2 and exact monomial count 13 for a, b nonzero, plus the planted-root
        check already implemented in measure_s3_decomposition. Any deviation halts
        the line before Edwards is touched.
    observation_collision:
      observable: >-
        The triple (per-variable degree, support size, parity-class distribution
        of the support).
      distinct_preimage_search: >-
        REQUIRED. Search for a Weierstrass reparametrisation with the same support
        size as Edwards. If one exists, support size alone does not identify the
        model and only the PARITY DISTRIBUTION does - which is why the observable
        is a triple rather than an integer, and why Step 3 records the explicit
        support set rather than its cardinality.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "support size" by "the character decomposition of the support
          under the rational-2-torsion involution group". The size is a shadow of
          it and can collide across models; the decomposition cannot.
        predicted_gain: >-
          Distinguishes a genuine model effect from a generic reparametrisation
          effect at zero extra compute, which is exactly what the null demands.
      - transform: boundary_lift
        proposed_object: >-
          Extend from cofactor-4 curves (where the grading exists) to
          prime-order curves (where it cannot) and record the boundary as the
          scope statement rather than as a caveat.
        predicted_gain: >-
          Converts "toy curves only" from an apology into a precise arithmetic
          condition, 4 | #E(F_p), that a reader can check on any target curve.
    quantifier_order: >-
      CLAIMED - FORALL twisted Edwards curves over F_p (p > 3, a, d nonzero,
      a != d) and FORALL m >= 3, EVERY monomial of the reduced S_m^{Ed,y} has even
      total degree, and deg_{y_i} S_m^{Ed,y} = 2^(m-2).
      NOT CLAIMED - that the support is exactly 14 at m = 3, which is an upper
      bound plus an open exact value; and NOT claimed for any m > 3 support count.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On curves with a rational point of order 4, the Edwards y-coordinate
        gives a summation polynomial of the same degree as short Weierstrass whose
        support is confined to the even-parity classes." It can NEVER certify
        anything about prime-order curves, about measured wall time at
        cryptographic scale, or about any m for which the count was not run.
      nearby_object_control: >-
        A curve with 4 | #E(F_p) but where the Edwards model is taken with the
        WRONG neutral element (a shifted coordinate), on which the parity grading
        must FAIL. If the grading appears there too, it is not coming from the
        2-torsion translation and the mechanism is misattributed.
    proof_obligations:
      - claim: Negation on twisted Edwards is (x,y) -> (-x,y), so y has degree 2.
        responsibility: correctness
      - claim: Translation by (0,-1) is (x,y) -> (-x,-y).
        responsibility: correctness
      - claim: Even-index translation preserves the summation relation.
        responsibility: correctness
      - claim: Exactly 14 exponent vectors in {0,1,2}^3 have even coordinate sum.
        responsibility: size
      - claim: The eliminated polynomial is reduced and cuts out the right locus.
        responsibility: correctness
      - claim: The Weierstrass baseline support is 13.
        responsibility: baseline
      - claim: Nothing transports to prime-order curves.
        responsibility: scope

  predictions:
    - metric: per-variable degree of the reduced 3-variable S_3^{Ed,y}
      direction: different
      minimum_effect: >-
        EXACTLY 2 in each of y_1, y_2, y_3, total degree exactly 4. Zero
        tolerance. This is the direct test of IDEA-20260807-dadcd2 (L1).
    - metric: parity of the total degree of every monomial in the support
      direction: different
      minimum_effect: >-
        EVERY monomial even. A single odd-total-degree monomial falsifies (C)
        outright and is not a rounding matter.
    - metric: support size of the reduced 3-variable S_3^{Ed,y}
      direction: different
      minimum_effect: >-
        At most 14. Pre-registered branch rule: 14 means Outcome 1 (tie with
        Weierstrass's 13); at most 11 means Outcome 2 (Edwards genuinely sparser,
        and the BKK constants deserve recomputation in the Edwards coordinate);
        12 or 13 is declared INCONCLUSIVE IN ADVANCE so neither branch can be
        reached by a coincidence of one or two monomials.
    - metric: >-
        variable count of the matched Edwards system at m = 3
      direction: lower
      minimum_effect: >-
        EXACTLY 3, versus the 8 recorded in EV-REP-002. This single number is what
        makes the comparison matched, and the wall-time gap of 0.09s -> 31s in
        EV-REP-002 is predicted to shrink substantially or vanish once it is fixed.
    - metric: >-
        wall time and F4 maximum degree, Edwards y-only versus Weierstrass Semaev,
        matched 3-variable systems, same curve and factor base
      direction: different
      minimum_effect: >-
        Predicted: F4 maximum degree identical; wall time within a factor 2. If
        the wall-time gap remains at the 300x of EV-REP-002 after matching the
        variable count, the variable-count explanation is wrong and something
        model-specific is happening that no argument in this record predicts -
        which would be the most interesting result available here.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): read Cheng-Kodera-Miyaji 2019 and the FGHR 2014
      body for an existing y-only support count. A hit reclassifies this record.
      STAGE 1 (minutes, GATE): reproduce the Weierstrass baseline - s3_expr
      per-variable degree 2, support 13, planted root verified.
      STAGE 2 (minutes, GATE): build the Edwards curve and verify the birational
      map on 200 points.
      STAGE 3 (minutes to an hour): eliminate to the 3-variable S_3^{Ed,y}, take
      the squarefree part, run the vanish / non-vanish gate.
      STAGE 4 (minutes): count degree, support, parity classes; cross-check via
      the Moebius substitution from Montgomery.
      STAGE 5 (an hour): the matched measurement panel of IDEA-20260807-1354d8 on
      both 3-variable systems, 5 primes, 3 seeds, factor-base degrees d in
      {4, 6, 8} to match the EV-REP-002 grid exactly so the comparison is direct.
      STAGE 6 (minutes): the random-Moebius null and the no-2-torsion null.
    controls:
      - Weierstrass 3-variable Semaev on the same curve and factor base
      - random-Moebius null with decay parameter 0..3
      - a curve without rational 2-torsion, where the grading must be absent
      - >-
        an Edwards model with a deliberately wrong neutral element, where the
        grading must also be absent
      - >-
        the EV-REP-002 parameter grid reproduced exactly, so the new numbers sit
        beside the old ones rather than in a new coordinate system
    required_metrics:
      - per-variable and total degree of every eliminated polynomial
      - explicit support set, size, and parity-class histogram
      - variable count per arm (the load-bearing number)
      - Bezout, BKK mixed volume, Macaulay dimension at first fall
      - F4 maximum degree, Groebner basis size, wall time per arm
      - pass/fail of the vanish / non-vanish gate and of every null

  falsification_conditions:
    - >-
      An odd-total-degree monomial appears in the reduced S_3^{Ed,y}. The parity
      argument (C) is false; supersede this record.
    - >-
      Per-variable degree is not 2. Falsifies both (B) here and
      IDEA-20260807-dadcd2 (L1).
    - >-
      The two independent derivations (direct elimination and Moebius substitution
      from Montgomery) disagree up to a scalar. One elimination is wrong; nothing
      is reported until it is found.
    - >-
      The eliminated polynomial vanishes on random INVALID triples. The
      elimination has lost information; the object does not exist as constructed.
    - >-
      The random-Moebius null also passes the parity check. Instrument fault.
    - >-
      After matching the variable count to 3, the Edwards wall-time disadvantage
      of EV-REP-002 persists at the same magnitude. Then the variable-count
      explanation in (A) is wrong, and the honest report is that EV-REP-002's
      conclusion stands for a reason nobody in this lane has identified.
    - >-
      Support comes out at 12 or 13. Pre-registered as INCONCLUSIVE; no branch is
      claimed.

  confounders:
    - >-
      VARIABLE COUNT. This is the confounder that produced the original result and
      it must be controlled by construction, not by argument: both arms have
      exactly 3 variables at m = 3 or the comparison is void.
    - >-
      MODEL-EXISTENCE BIAS. Every Edwards-admitting curve has cofactor at least 4.
      The comparison is therefore run only on cofactor-4 curves, and a
      Weierstrass-versus-Edwards difference measured there says nothing about
      prime-order curves. This is not a caveat; it is the scope.
    - >-
      ACCIDENTAL COEFFICIENT VANISHING at 16 bits inflates sparsity. Five primes,
      report the distribution.
    - >-
      NON-REDUCED ELIMINATION adds monomials of both parities and would falsely
      break the parity check. The squarefree gate must run before the parity count.
    - >-
      The factor base must be the SAME SET OF POINTS in both arms, addressed by
      each model's own coordinate - the assumption H-REP-001 already made and the
      one that makes the comparison about representation rather than about which
      points are cheap.

  interpretation_limits:
    - >-
      ASYMPTOTIC CEILING, STATED AS THE BRIEF REQUIRES. NO exponent change is
      claimed and none is possible: this record predicts the per-variable degree
      is EXACTLY 2^(m-2), the same as short Weierstrass, precisely because the
      Edwards y-coordinate is Moebius-equivalent to the Weierstrass x-coordinate
      and a birational change of model is an isomorphism of function fields.
      Diem's and Gaudry's degree bounds are model-agnostic in asymptotic form and
      nothing here touches them. The only claimed movement is in MONOMIAL SUPPORT
      at m = 3 - a constant-factor, small-m effect routed through BKK
      (KN-TECH-007), whose banked value in this program is a 2-5x constant
      (KN-FIND-2a8b7e, KN-FIND-c7d31e).
    - >-
      The mechanism REQUIRES rational 2-torsion and therefore cannot exist on a
      prime-order curve. Whatever is found here is structurally unavailable on
      every standard cryptographic curve. That is the single most important limit
      in this record.
    - >-
      Support is not solving degree, and mixed volume equals Bezout for
      Newton-saturated systems (KN-TECH-007), in which case a support difference
      buys nothing at all.
    - >-
      Toy scale, claim_tier toy (AGENTS.md rule 7). The comparison with
      EV-REP-002 is a comparison of toy numbers with toy numbers.

  reachability_gate: >-
    TRIVIAL AND STATED EXPLICITLY. T5 gates lanes that move between CURVES; this
    lane moves between COORDINATES on a fixed curve, at the cost of one Moebius
    substitution, with probability 1, no walk and no mixing time. There is,
    however, a MODEL-EXISTENCE gate that is not a search cost and must not be
    confused with one: a twisted Edwards model exists iff the curve has a rational
    point of order 4. That is decided by the curve's group order, is free to check,
    and is either satisfied or unsatisfiable at any price. On a prime-order curve
    it is unsatisfiable, so the object of this proposal does not exist there -
    which is a fact about arithmetic, not about reachability, and it is recorded
    here rather than left implicit.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CHANGE CLAIMED. Per-variable degree predicted identical at
      2^(m-2); Bezout identical at B^(m-1)/2. The claimed movement is a support
      count at m = 3, whose best case (Outcome 2) would feed the BKK mixed-volume
      route and could at most improve the existing 2-5x constant of
      KN-FIND-2a8b7e / KN-FIND-c7d31e by a further constant. Prime-field ECDLP
      stays at p^(1/2) for rho and exp(c sqrt(log N log log N)) for Semaev index
      calculus (KN-FIND-f8c290).
    memory_exponent: >-
      Unchanged - the Macaulay matrix dimension is set by variable count and
      reached degree (KN-TECH-011), both predicted identical between the two
      matched 3-variable arms. The 8-variable Edwards arm of EV-REP-002 was
      strictly worse on memory and that is one of the things being corrected.
    best_known: >-
      Rho at 0.886 sqrt(N) and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
      sqrt(N)/sqrt(N) (KN-TECH-031); automorphism-discounted rho (KN-TECH-018);
      Semaev index calculus (KN-FIND-f8c290) with BKK constants (KN-FIND-2a8b7e,
      KN-FIND-c7d31e).
    hidden_overhead: >-
      No o(1) is claimed because no asymptotic is claimed. The honest hidden cost
      is the elimination itself: producing S_m^{Ed,y} for m > 3 requires iterated
      resultants whose intermediate swell is the practical limit, and any m > 3
      support count is [open] precisely because that swell has not been paid.
    tradeoff_note: >-
      Not applicable - no algorithm is produced. If Outcome 2 fires, the follow-on
      would be a BKK-in-Edwards-coordinates proposal with its own cost table.
  dominated_by: >-
    AS AN ATTACK - mounts none, dominated on every axis by every frontier row,
    each checked: parallel rho with distinguished points (0.886 sqrt(N) group
    operations, O(1) memory, 0 queries) KN-TECH-001/KN-TECH-006;
    automorphism-discounted rho on CM curves KN-TECH-018; BSGS (sqrt(N) time,
    sqrt(N) memory) KN-TECH-031; Semaev index calculus KN-FIND-f8c290 with BKK
    constants KN-FIND-2a8b7e/KN-FIND-c7d31e. None is escaped on time, memory or
    queries.
    AS A MEASUREMENT - dominated by EV-REP-002 on EXISTING EVIDENCE (that record
    has runs, this has none) and dominates it on OBJECT MATCHING (3 variables
    versus 8) and on the metric measured (support and parity, versus a d_reg
    proxy that was pinned at 2 in every arm - see IDEA-20260807-1354d8).
  sota_delta: >-
    Zero speedup against any attack baseline. Quantitatively, the pre-registered
    outcomes are: support 14 versus 13 (a 7.7% increase in term count, i.e. a
    negative delta), or support at most 11 (at least a 15% decrease, feeding a
    mixed-volume route whose banked value in this program is 2.0x at m = 3 by
    KN-FIND-c7d31e). In neither branch does any attack exponent move; the change
    to the ECDLP cost exponent is 0.000 by construction. The delta to the LEDGER
    is that KN-FIND-023's conclusion would, for the first time, rest on a matched
    comparison.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the per-variable degree is exactly 2 - it is forced by the Moebius
    equivalence. 0.85 that every monomial has even total degree - the addition-law
    computation for (x,y) + (0,-1) = (-x,-y) is one line and I did it. 0.25 that
    the support comes in at 11 or below, i.e. that Edwards genuinely beats
    Weierstrass's 13; my expectation is 14, which is Outcome 1. 0.6 that matching
    the variable count substantially closes EV-REP-002's 300x wall-time gap. The
    reason this is HIGH priority despite an expected Outcome 1 is that Outcome 1
    is itself worth having: it converts a standing ledger conclusion from a
    mismatched comparison into a matched one, at a cost of minutes.

