idea:
  id: IDEA-20260903-e1e38b
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-22c36b
  added: '2026-09-03'
  title: >-
    THE p-ARY ALGEBRAIC IMMUNITY OF THE DIGIT-SUBSTITUTED SEMAEV TOP FORM IS
    1/m OF THE GENERIC VALUE AND IT IS DERIVABLE, NOT ONLY MEASURABLE - at
    d = 2 the top form of S_{m+1}(x, x_R) is the single monomial
    prod_k x_k^{2^{m-1}}, so under the digit map it becomes the block-tensor
    product prod_k ell_k^{2^{m-1}} in the squarefree algebra
    F_p[a]/(a_i^2), whose annihilator is spanned by the per-block
    annihilators of ell_k^{2^{m-1}}; by dimension counting (unconditional)
    and by Wilson's inclusion-matrix rank theorem (snippet-retrieved, exact)
    the first fall degree is d_ff(m,2,s) = m 2^{m-1} + floor((s - 2^{m-1})/2)
    + 1 for 2^{m-1} <= s and 2^s <= p - linear in s with slope 1/2 against
    the semi-regular null's slope m/2, curve- and target-INDEPENDENT,
    reproduced exactly by a block-factored random null and beaten by the
    support-matched random null - so IDEA-20260830-84cdb7's H1 ('d_ff bounded
    in s') is refuted by derivation before its ladder runs, its Outcome 3
    exponent stake is dead at d = 2, and the residual open object is the
    solving degree, where the curve and the target first enter
  class: mechanism

  claim: >-
    SETTING. Fix m >= 2, p > 3, E over F_p non-singular, an affine target R
    with x-coordinate x_R, the base-2 digit map of IDEA-20260830-84cdb7 with s
    digits per unknown (2^s <= p), n = ms digit variables a_{k,i}, the linear
    forms ell_k = sum_{i<s} 2^i a_{k,i}, the affine field ideal
    J = (a_{k,i}^2 - a_{k,i}), the function ring B = F_p[a]/J, and the
    top-form (squarefree) algebra A = F_p[a]/(a_{k,i}^2) = A_1 tensor ...
    tensor A_m with A_k the s-variable squarefree algebra. The digit-presented
    summation generator is S~ = S_{m+1}(ell_1, ..., ell_m, x_R) reduced in B,
    with top homogeneous part S~_top of degree delta.
    (D1) THE OBJECT, DEFINED SO THE p-ARY CASE IS NOT CONFUSED WITH THE BOOLEAN
    ONE. Boolean algebraic immunity AI(f) is the least degree of a nonzero g
    with g f = 0 or g(f + 1) = 0 in the function ring over F_2. Over F_p the
    function-ring annihilator of a non-Boolean-valued S~ is the WRONG object:
    g S~ = 0 in B means g vanishes on the support of S~, and since the zero
    set of S~ on {0,1}^n is the decomposition set (typically empty or tiny)
    the constant 1 annihilates S~ trivially. The object that controls the
    first fall is the GRADED annihilator: AI_p(S~) := min{deg g : g in A
    nonzero, g . S~_top = 0 in A}. A degree fall at D is a g of degree
    D - delta with deg(g S~ reduced in B) < D; reduction a^2 -> a only lowers
    degree, so the degree-D part of the reduced product is exactly the image
    of g_top S~_top in A_D, and FALL AT D <=> g_top annihilates S~_top in A.
    Hence d_ff(S~, J) = delta + AI_p(S~) exactly, with 'first fall' the
    boolean-Macaulay fall_dim definition of experiments/EXP-SBRG-60c55e/
    driver/macaulay.py transported to F_p. In odd characteristic the only
    trivial syzygies of the top-form system (S~_top, a_i^2) are the Koszul
    ones, because S~_top^2 is not forced to vanish in A (no Frobenius
    identity when p is odd) - the point at which the p-ary and the F_2 cases
    differ, which is lane A's corner and is cited here only as a boundary.
    (D2) THE THEOREM-SHAPED CEILING (unconditional). Multiplication by S~_top
    maps A_j -> A_{j+delta}; a kernel is forced when binom(n,j) > binom(n,
    j+delta), i.e. j > (n - delta)/2. So AI_p(S~) <= floor((n - delta)/2) + 1
    and d_ff <= floor((n + delta)/2) + 1 =: D_null(n, delta), the p-ary
    analogue of the Boolean ceil(n/2) ceiling. D_null is also the first
    forced-kernel degree of 84cdb7's semi-regular null up to the convention
    on a zero coefficient: ceil((ms + 2m)/2) is the degree where the Hilbert
    coefficient first is <= 0; a zero coefficient is a square map that need
    not be singular, so the first forced fall is floor((n + delta)/2) + 1,
    equal to ceil((n + delta)/2) when n + delta is odd and one more when
    even. This record uses D_null throughout and says so.
    (D3) THE TOP FORM IS A MONOMIAL. For m = 2, S_3(x_1, x_2, x_R) = (x_1 -
    x_2)^2 x_R^2 - 2((x_1 + x_2)(x_1 x_2 + a) + 2b) x_R + (x_1 x_2 - a)^2 -
    4b(x_1 + x_2), whose degree-4 part is x_1^2 x_2^2 and nothing else; the
    curve (a, b) and the target x_R enter only at degree <= 3. For m = 3 the
    archived EXP-ALPF-011 profile records S_4(x_1, x_2, x_3, x_R) at total
    degree 12 with per-variable degree 4, and 12 = 3 . 4 forces the top form
    to be the single monomial c x_1^4 x_2^4 x_3^4 with c nonzero (an inference
    from the archived degree profile, re-derived symbolically at Stage 0).
    General m is the hypothesis H-TOP below: top form of S_{m+1}(x, x_R)
    equals c prod_k x_k^{2^{m-1}}, so delta = m 2^{m-1}.
    (D4) THE DERIVATION. Substituting x_k = ell_k (linear forms in disjoint
    variables) preserves degree, so S~_top is the image of c prod_k ell_k^e
    in A with e = 2^{m-1}. In A_k, ell_k^e = e! sum_{|I|=e} (prod_{i in I}
    2^i) a_I, nonzero iff e <= s (e! is nonzero mod p because 2^s <= p forces
    p > s >= e). Multiplication by prod_k ell_k^e on A = tensor_k A_k is the
    tensor product M_1 tensor ... tensor M_m of the per-block maps M_k =
    multiplication by ell_k^e on A_k, and for linear maps over a field
    ker(M_1 tensor M_2) = ker M_1 tensor A_2 + A_1 tensor ker M_2. Therefore
    AI_p(S~) = min_k a_0(A_k, ell_k^e) EXACTLY, where a_0 is the least degree
    of a nonzero element of ker M_k. UPPER BOUND (unconditional, one block):
    a kernel is forced when binom(s,j) > binom(s,j+e), so a_0 <= floor((s -
    e)/2) + 1 and d_ff <= m e + floor((s - e)/2) + 1. EXACTNESS (conditional
    on Wilson): rescaling a_{k,i} -> 2^{-i} a_{k,i} is an automorphism of A_k
    taking ell_k to sum_i a_{k,i}; multiplication by (sum a_i)^e from A_j to
    A_{j+e} is e! times the transpose of the inclusion matrix W_{j, j+e} of
    j-subsets versus (j+e)-subsets of an s-set, and Wilson (1990) gives
    rank_p W_{t,k} = sum over 0 <= i <= t with p not dividing binom(k - i,
    t - i) of [binom(s,i) - binom(s,i-1)] for t <= min(k, s - k). With t = j,
    k = j + e, every binom(k - i, t - i) is a positive integer at most
    binom(s, floor(s/2)) < 2^s <= p, so p divides none of them, the rank is
    binom(s, j), M_k is injective in degree j whenever binom(s,j) <=
    binom(s,j+e), and hence a_0 = floor((s - e)/2) + 1 and
    d_ff(m, 2, s) = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1 for 2^{m-1} <= s.
    The kernel in degree a_0 has dimension binom(s, a_0) - binom(s, a_0 + e)
    per block, and the m block kernels are independent in that degree, so
    fall_dim(d_ff) = m [binom(s, a_0) - binom(s, a_0 + e)].
    (D5) THE NUMBERS. m = 2 (e = 2): d_ff = 4 + floor(s/2), D_null = s + 3;
    s = 2,3,4,5,6 gives d_ff = 5,5,6,6,7 against D_null = 5,6,7,8,9, with
    fall_dim(d_ff) = 4,4,10,10,28; s = 2 is the boundary cell (no strict
    early fall), s = 3 the first strict one, and the gap grows like
    ceil(s/2) - 1. m = 3 (e = 4, s >= 4): d_ff = 11 + floor(s/2), D_null =
    floor((3s + 12)/2) + 1; s = 4,5,6,8 gives d_ff = 13,13,14,15 against
    D_null = 13,14,16,19; s = 4 is the boundary cell. The slope in s is 1/2
    at every m; the null slope is m/2; the ratio AI_p / generic is about 1/m.
    (D6) WHAT IS CURVE-INDEPENDENT. Nothing in (D4) uses a, b, x_R or p
    beyond p > s: the first fall of the d = 2 digit presentation is a
    property of the monomial top form under a block-linear substitution.
    The support-matched null of 84cdb7 (random multilinear polynomial with
    S~'s monomial support, hence a random element of A_delta with the same
    block-degree pattern) has no tensor factorisation and its expected
    first fall is D_null, so the Semaev arm beats that null by ceil(s/2) - 1
    at m = 2 - a real, reproducible early fall; the BLOCK-FACTORED null
    (random q_1(block 1) ... q_m(block m), each q_k a random form of degree e)
    reproduces d_ff = m e + floor((s - e)/2) + 1 exactly, because a random
    degree-e form in A_k has the same maximal-rank multiplication maps as
    ell_k^e in degrees where either has full rank. So the early fall is a
    controlled null with respect to the curve.
    (D7) WHAT A LOW-IMMUNITY FINDING LICENSES AND DOES NOT. It licenses
    naming the mechanism behind 84cdb7's H1 - the tensor factorisation of a
    monomial top form - and refuting H1 as stated: d_ff is not bounded in s.
    The upper bound in (D4) is unconditional given H-TOP; the refutation of
    boundedness needs the lower bound, which is conditional on Wilson's
    full-rank statement, and the s <= 6 ranks of the minimal test check
    exactly that statement. It does NOT license an exponent: even if the
    solving degree equalled the first fall (it is at least as large), the
    reduced Macaulay column count at D = d_ff is sum_{j <= D} binom(ms, j)
    ~ 2^{ms H(1/(2m))} = B^{m H(1/(2m))} with H the binary entropy, about
    B^{1.62} at m = 2 and B^{2.17} at m = 4 before the exponent omega,
    against enumeration at B^{m-1} and MITM at B^{ceil(m/2)}; the sigma of
    IDEA-20260808-812554 stays at or above 1. The conditional stake of
    84cdb7 claim (D) Outcome 3 (N^{2/(m+1)+o(1)}) needed D bounded in s;
    under this derivation it is dead at d = 2 for every m.

  mechanism: >-
    TRACKED OBJECT. The top-form class S~_top in A_delta, followed through the
    Macaulay computation by g -> g S~_top (the degree-D layer's top
    projection) - equivalently the graded annihilator ideal Ann_A(S~_top) and
    its initial degree AI_p. LOSSY-PROJECTION TEST, PASSED AND INFORMATIVE.
    S~ -> S~_top discards every term of degree below delta, and those terms
    are exactly where the curve coefficients, the target x_R and the constant
    digit offsets live; the retained part propagates deterministically under
    the Macaulay layer operation (top of (g S~) equals g_top S~_top in A, a
    homomorphic identity), so the projection is compatible with the target's
    operation. It is not a change of coordinates: the fibre over S~_top
    contains every curve, every target and every lower-order perturbation.
    Its survival horizon is precisely the first fall degree; at the SOLVING
    degree the discarded lower terms re-enter and the object dissolves, which
    is stated as the forward boundary rather than hidden.
    ONE-STEP PROPAGATION, MEASURABLE. Per degree D, form the F_p rows
    {mu S~ reduced in B : mu a squarefree monomial of degree D - delta}, take
    the rank of the full row space and of its top-degree projection;
    fall_dim(D) = rank_full - rank_top (the macaulay.py identity over F_p).
    The prediction is fall_dim(D) = 0 for D < d_ff and fall_dim(d_ff) =
    m [binom(s, a_0) - binom(s, a_0 + e)] - a second exact integer per cell,
    not just a threshold.
    WHY THE DIGIT PRESENTATION SPECIFICALLY. In the direct presentation the
    membership top forms x_k^B and the monomial top form x_1^2 x_2^2 give
    the syzygy x_1^{B-2} S_top = x_2^2 x_1^B at degree B + 2 > D_null = B + 1
    at m = 2 - no early fall, consistent with IDEA-20260808-afe4ce's floor.
    The digit map replaces the single power x_k^B by a squarefree block
    algebra in which powers of a LINEAR form have large annihilators; the
    early fall is bought by the change of algebra, not by the curve.
    RELATION TO d > 2. For base d the block algebra is F_p[a]/(a_i^d) and the
    same tensor-kernel argument gives AI_p <= floor((s(d-1) - e)/2) + 1
    unconditionally (forced kernel past the middle degree of the block
    algebra), i.e. d_ff <= m e + floor((s(d-1) - e)/2) + 1 against the null
    floor((ms(d-1) + m e)/2) + 1 - again a factor-m reduction of the
    annihilator degree; exactness at d > 2 would need the analogue of
    Wilson's theorem for multiset inclusion matrices in characteristic p,
    which this record does not claim.

