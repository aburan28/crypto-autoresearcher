  assumptions:
    - >-
      d = 2, p > 3, 2^s <= p (hence p > s), s >= 2^{m-1}; for s < 2^{m-1} the
      power ell_k^{2^{m-1}} vanishes in A_k and the top form of S~ is of
      lower degree - a separate regime, excluded here and reported as such.
    - >-
      H-TOP (the monomial top form) is derived at m = 2, inferred from the
      archived profile at m = 3, and is a Stage-0 symbolic obligation at
      m >= 4.
    - >-
      'First fall' is the top-form fall_dim definition; the target x_R is a
      constant (planted or random makes no difference to d_ff by (D6)).
    - >-
      Exact ranks over F_p; no CAS termination event is read as a degree.

  proof_search_map:
    bottleneck: >-
      The step '84cdb7 Stage 2 measures the slope of d_ff in s'. This record
      claims the slope is derivable (1/2) and that the measured quantity is
      curve-blind; removing the measurement from the critical path and
      replacing it with a two-cell check changes the lane's plan, not any
      attack cost.
    baseline_embedding:
      parameter_slice: >-
        s = 1 is excluded (s >= 2^{m-1} is needed), so the embedding into the
        direct presentation is through the direct-presentation syzygy
        computation in the mechanism section: at m = 2 the direct system's
        top forms (x_1^2 x_2^2, x_1^B, x_2^B) have first non-Koszul syzygy at
        degree B + 2 > D_null = B + 1, reproducing afe4ce's 'no early fall'.
        The digit arm at s = 2 (n = 4, d_ff = 5 = D_null) is the boundary
        cell with no strict early fall; s = 3 is the first cell with one.
      reproduction_check: >-
        Symbolic: expand S_3(ell_1, ell_2, x_R) at s = 2 by hand and verify
        the degree-4 part equals ell_1^2 ell_2^2 = 16 a_{1,0} a_{1,1} a_{2,0}
        a_{2,1} in A; verify multiplication by it kills A_1 (degree 5, since
        A_5 = 0 at n = 4) and not A_0. Frozen fixture: the s = 2 and s = 3
        cells at m = 2, p = 4099, one generic curve, one target, with the full
        rank profile committed.
    observation_collision:
      observable: >-
        d_ff(m, 2, s) and fall_dim(d_ff), read by the F_p Macaulay meter.
      distinct_preimage_search: >-
        DESIGNED TO SUCCEED, and that is the content: the block-factored null
        (random degree-e form per block) is predicted to have identical d_ff
        and identical fall_dim to the Semaev arm at every s, and two
        different curves or targets at the same (m, s) are predicted to
        collide exactly. The collision is the proof that the observable
        carries no curve information at the first fall. The collision that
        must NOT occur is with the support-matched random null, which is
        predicted at D_null.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the first-fall question into the squarefree algebra A as the
          exact statement ker(mult by S~_top) in degree j, then into the
          tensor decomposition ker(M_1 tensor ... tensor M_m), then into the
          inclusion-matrix rank of Wilson. Encoding exact (top forms);
          completeness exact (every fall is a top-form annihilator);
          soundness exact; transfer fails outside d = 2 (needs multiset
          inclusion ranks); cost loss none.
        predicted_gain: >-
          Replaces a fitted slope with a closed form and a per-cell exact
          integer fall_dim; converts 84cdb7's 3-outcome ladder into a 2-cell
          check.
      - transform: observable_fiber
        proposed_object: >-
          Hold S~_top fixed and vary the discarded structure (curve, target,
          lower digits): the fibre is the whole family and d_ff is constant
          on it. The intrinsic invariant that DOES vary on the fibre is the
          solving degree, named as the forward object.
        predicted_gain: >-
          A closure of the first-fall route for the d = 2 digit presentation
          with a named residual (solving degree), at the section-4 standard.
    quantifier_order: >-
      CLAIMED: FOR ALL m >= 2, FOR ALL p > 3, FOR ALL s with 2^{m-1} <= s and
      2^s <= p, FOR ALL non-singular E/F_p, FOR ALL affine targets, IF H-TOP
      holds at m THEN d_ff(m,2,s) <= m 2^{m-1} + floor((s - 2^{m-1})/2) + 1
      (unconditional given H-TOP), AND equality holds (conditional on
      Wilson's rank theorem). NOT CLAIMED: anything about d > 2 beyond the
