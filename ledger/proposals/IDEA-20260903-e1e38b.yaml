    - >-
      Scoped to d = 2, s >= 2^{m-1}, 2^s <= p, and to the top-form first-fall
      definition; d > 2 carries only the upper bound.
    - >-
      Nothing here transfers to cryptographic s; the closed form is a
      derivation and the s <= 6 check tests Wilson's rank statement where it
      is computable, not the digit presentation at scale.
    - >-
      Novelty is unverified; the argument may be folklore.

  heuristic_assumptions:
    - id: H-TOP
      statement: >-
        For every m >= 2 and every affine target x_R, the top homogeneous
        part of S_{m+1}(x_1, ..., x_m, x_R) in (x_1, ..., x_m) is c prod_k
        x_k^{2^{m-1}} with c a nonzero constant, so delta = m 2^{m-1}.
      rigorous_support: >-
        RIGOROUS at m = 2 by expansion (degree-4 part x_1^2 x_2^2). At m = 3
        the archived EXP-ALPF-011 profile (total degree 12, per-variable
        degree 4) forces the top form to be the single monomial x_1^4 x_2^4
        x_3^4 with nonzero coefficient, because 12 = 3 . 4 and per-variable
        degree is at most 4. CLASSICAL FACT IMITATED: S_{m+1} is symmetric of
        degree 2^{m-1} in each variable (Semaev), and the resultant recursion
        S_{m+1} = Res_T(S_m(x_1..x_{m-1},T), S_3(x_m, x_R, T)) multiplies
        leading coefficients; the claim is that the top-degree term of the
        resultant is the product of the top terms, the generic behaviour of
        resultants whose leading coefficients in T are themselves the
        top-degree parts.
      validation_plan: >-
        SAMPLE: symbolic computation of S_4 and S_5 with x_R symbolic, over Q
        and over F_p for p in {4099, 65537}, three curves each; extract the
        top homogeneous part. COMPARISON: exact equality with c x_1^4 x_2^4
        x_3^4 and c x_1^8 ... x_4^8. TAIL CHECK: the coefficient c as a
        polynomial in (a, b, x_R) must be a nonzero constant, not a
        polynomial that can vanish for special (a, b, x_R); if it can vanish,
        the special locus is reported and excluded. No transfer assumption:
        this is a finite symbolic identity per m.
    - id: H-WIL
      statement: >-
        For p > s and 0 <= j, j + e <= s, multiplication by ell^e on the
        squarefree algebra F_p[a_1..a_s]/(a_i^2) from degree j to degree
        j + e has maximal rank min(binom(s,j), binom(s,j+e)); equivalently
        the inclusion matrix W_{j, j+e} has full rank mod p.
      rigorous_support: >-
        Wilson (1990), snippet-level retrieved: rank_p W_{tk} equals the sum
        of binom(v,i) - binom(v,i-1) over i <= t with p not dividing
        binom(k-i, t-i); with v = s < p every such binomial is a positive
        integer less than p, so no term is dropped and the rank is
        binom(s, t). The classical distribution imitated is the strong
        Lefschetz property of the squarefree algebra in characteristic zero
        (multiplication by a power of a generic linear form has maximal
        rank), here made exact in characteristic p > s by the rank formula.
      validation_plan: >-
        SAMPLE: exact F_p ranks of multiplication by ell^2 from degree j to
        j + 2 for s in {2,...,8}, all j, p in {4099, 65537}, computed directly
        (at most binom(8,4) = 70 rows) - a direct check of the rank statement
        independent of any curve. COMPARISON: min(binom(s,j), binom(s,j+2))
        exactly. TAIL CHECK: the cells with j + 2 = s - j (square maps), where
        a singular map would contradict full rank. TRANSFER: none needed; the
        statement is used only at the tested s.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED; the record proposes no
      algorithm. What it derives about the digit presentation's algebraic
      oracle: with first fall at D = m 2^{m-1} + s/2 + O(1), even the most
      optimistic reading d_solve = d_ff gives a reduced Macaulay column count
      sum_{j <= D} binom(ms, j) ~ B^{m H(1/(2m))} (H the binary entropy),
      about B^{1.62} at m = 2, B^{2.17} at m = 4, B^{2.6} at m = 6, times
      omega, against enumeration B^{m-1} and MITM B^{ceil(m/2)}; in the sigma
      language of IDEA-20260808-812554 that is sigma >= 1 at every m, so the
      conditional N^{2/(m+1)+o(1)} of 84cdb7 is closed at d = 2.
    memory_exponent: >-
      For this record's own test: at most 2^{ms} squarefree columns, 4096 at
      the largest m = 2 cell and 32768 at m = 3, s = 5; negligible. For the
      hypothetical oracle: the same B^{m H(1/(2m))} column count as memory,
      above MITM's B^{floor(m/2)} at every m.
    best_known: >-
      Pollard rho at 0.886 sqrt(N) with O(1) memory; BSGS (N^{1/2}, N^{1/2});
      kangaroo on an interval; automorphism-discounted rho; Pohlig-Hellman;
      generic preprocessing S T^2 = N; algebra-free MITM index calculus at
      N^{1/2 + 1/m}; for the decomposition subtask enumeration at 2^{m-1}
      B^{m-1} and target-keyed MITM at B^{ceil(m/2)}.
    hidden_overhead: >-
      Nothing is hidden in o(1) because no cost is claimed; the two
      disclosed conditionalities are H-TOP at m >= 3 and Wilson's rank
      theorem for exactness. The H(1/(2m)) estimate uses the entropy bound
      on binomial sums and is an order-of-exponent statement, not a
      constant.
    tradeoff_note: >-
      Not applicable; no algorithm. The one tradeoff named is
      methodological: the closed form removes 84cdb7's Stage 2 (low tens of
      CPU hours) in favour of a two-cell check (seconds), at the price of
      conditionality on a snippet-retrieved theorem that the same check
      tests.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST CATALOGUE A1-13 ON TIME, MEMORY AND
    DATA/QUERIES. As an attack: none is mounted; dominated on every axis by
    parallel rho with negation (0.886 sqrt(N), O(1)), BSGS (N^{1/2},
    N^{1/2}), kangaroo (interval), automorphism-discounted rho,
    Pohlig-Hellman (not comparable, no smooth order assumed), generic
    preprocessing S T^2 = N (online time only), algebra-free MITM index
    calculus (N^{1/2 + 1/m}, N^{1/2}); no queries used. As a
    decomposition-oracle statement: dominated by enumeration and MITM, which
    is the point of (D7). As a statement about the digit presentation:
    undominated on the narrow axis 'closed-form first fall degree and
    curve-independence at d = 2', where IDEA-20260830-84cdb7 (measurement)
    and IDEA-20260808-afe4ce (direct presentation) hold the nearest rows and
    neither covers it. Not null.
  sota_delta: >-
    +0 on time, memory and queries. Quantified deltas: (i) a closed form
    d_ff(m, 2, s) = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1 replacing a fitted
    slope with resolution 0.25 on a 5-point ladder; (ii) the derived slope
    1/2 against the null's m/2 - a factor m in the annihilator degree, i.e. a
    real early fall of size ceil(s/2) - 1 at m = 2 relative to the
    support-matched null; (iii) the statement that this fall is reproduced
    by a curve-free block-factored null, so it carries zero curve
    information; (iv) the consequence that 84cdb7's H1 is false at d = 2 and
    its conditional N^{2/(m+1)} stake is closed there, saving that record's
    Stage 2 compute; (v) a per-cell exact fall_dim prediction (4, 4, 10, 10,
    28 at m = 2, s = 2..6); (vi) the corrected generator degree m 2^{m-1}
    for m >= 3 in 84cdb7's null.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the tensor-kernel argument and the m = 2 top form are correct
    as stated (elementary). 0.85 that Wilson's rank statement applies as
    used (snippet-level retrieval; the s <= 8 direct rank check covers the
    used range regardless). 0.8 that H-TOP holds symbolically at m = 3, 4.
