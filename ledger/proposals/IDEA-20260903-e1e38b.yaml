    - >-
      ACCIDENTAL CANCELLATION: the coefficient e! prod 2^i is nonzero for
      p > s, but a curve-dependent lower-order term could in principle
      combine with g to vanish entirely in B; excluded generically and the
      reason a hand fixture is run first.
    - >-
      THE METER'S FIRST-FALL DEFINITION differs from the ALPF Sage meter's
      'nontrivial(D) > 0 on homogeneous leading forms' only by which trivial
      syzygies are subtracted; with a single non-field generator the two
      coincide, and this is asserted, not assumed, at Stage 1.
    - >-
      WILSON'S CONDITION t <= min(k, v - k): the rank statement is applied
      with t = j, k = j + e, v = s, valid while j + e <= s - j; beyond that
      the map is on the surjective side and the kernel dimension is the
      dimension difference, which is what the closed form uses.

  interpretation_limits:
    - >-
      A first fall degree is not a solving degree, not a cost, and not an
