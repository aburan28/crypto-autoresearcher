    verdict: >-
      UNVERIFIED. The tensor-kernel argument and the block-annihilator bound
      are elementary and may be folklore in the Boolean-function literature;
      Wilson's theorem is classical. What is offered as new to this program
      is the closed form for d_ff of the digit presentation, the
      curve-independence conclusion, the block-factored null, and the
      consequence for 84cdb7's H1 and Outcome 3.

