    results: >-
      No corpus record computes an annihilator degree, a tensor-kernel
      decomposition, or an inclusion-matrix rank for any decomposition
      system. 84cdb7 proposes to MEASURE the slope of d_ff in s and
      pre-registers three outcomes (slope m/2, sublinear, bounded), none of
