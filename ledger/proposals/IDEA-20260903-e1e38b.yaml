  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate, one page): (i) derive the top form of
      S_3(x, x_R) and verify symbolically that the top form of S_4(x, x_R)
      and S_5(x, x_R) is the pure monomial (H-TOP at m = 3, 4); (ii) write
      the tensor-kernel identity and Wilson's rank statement, evaluate
      a_0(s, e), d_ff(m, 2, s), D_null and fall_dim for every cell of Stages
      1-2 into a frozen prediction file. STAGE 1 (minutes): port
      macaulay.py's layer analysis to F_p (rows reduced by a^2 = a,
      coefficients mod p, rank over F_p); validate on the s = 2 fixture by
      hand; run m = 2, s = 2..6 on 3 curves x 2 targets x p in {4099, 65537},
      with NULL-1, NULL-2 and NULL-3 in the same invocation; record the full
      rank profile, d_ff, fall_dim and sol(D) of IDEA-20260806-7ea402 per
      cell. Largest column space 2^12 = 4096. STAGE 2 (minutes to an hour):
      m = 3, s in {4, 5}, one curve, two targets, both nulls; column space at
      most 2^15. STAGE 3 (minutes): the mixed-block nearby object and the
      non-monomial-top-form nearby object at m = 2, s = 4. THE CHEAPEST VALID
      DISCRIMINATOR is the single cell m = 2, s = 3 (n = 6, 64 squarefree
      columns): Semaev forced 5, NULL-1 predicted 6, NULL-2 forced 5; three
      integers computable in seconds separate 'derivation right' from
      'derivation wrong' and 'curve-specific' from 'block artifact'. No
      status change is proposed.
    controls:
      - NULL-1 support-matched random multilinear generator (blocking; predicted D_null)
      - NULL-2 block-factored random generator (blocking; predicted equal to Semaev)
      - NULL-3 curve and target scramble at fixed (m, s) (predicted no change)
      - s = 2 hand-verified fixture as the instrument gate
      - mixed-block and non-monomial nearby objects (predicted to break the closed form)
      - artifact tell - the gap D_null minus d_ff must grow with s
      - per-cell memory pre-flight (2^{ms} columns) with abort before allocation
    required_metrics:
      - 'full F_p rank profile per degree per arm, d_ff, fall_dim(d_ff)'
      - 'frozen Stage-0 predictions and the signed residual per cell'
      - 'sol(D) and d_solve per cell (7ea402 object), reported not claimed'
      - 'H-TOP symbolic check result at m = 3, 4'
      - 'column counts, peak RSS, wall time per cell'

