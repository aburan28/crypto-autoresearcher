          The opened row is tag tracing for finite-field rho steps.
          The top frontier match on this claim text was that row,
          score 6, from the word step. This idea adds no rho table.
          The exponent delta is 0.
      - ref: KR-RHO-755e35
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is Tate's isogeny criterion for point counts.
          This idea compares two j-invariants. The exponent delta is 0.
  dominated_by: >-
    Compared with KN-TECH-027, opened: classical vectorization is
    subexponential in log p and the quantum hidden-shift cost is
    2^{O(sqrt(log p))}. This measurement uses poly(83) time and
    recovers no ideal. It does not beat that baseline on time, memory,
    or data.
  sota_delta: >-
    The predicted gap is |j35 - j53| = 0, with both j-invariants in
    F_83. The exponent delta against 2^{O(sqrt(log p))} is 0.
