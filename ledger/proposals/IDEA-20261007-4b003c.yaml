idea:
  id: IDEA-20261007-4b003c
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    One rational 3-step then one rational 5-step on y^2 = x^3 + x over
    F_83 returns the same j as the reverse order.
  class: measurement
  claim: >-
    Let p = 83 and let E0 be y^2 = x^3 + x over F_83. For ell in {3, 5},
    use a Vélu step only when the current curve has exactly one rational
    subgroup of order ell. Let j35 be the j-invariant after the order-3
    step and then the order-5 step, and let j53 be the j-invariant after
    the reverse order. The claim is j35 = j53 in F_83. This is one
    equality of two field elements after one step each. It does not
    measure return lengths, it does not recover an ideal, and the
    exponent delta against the opened CSIDH costs is 0.
  mechanism: >-
    KN-TECH-027, opened, states that the class group acts commutatively
    on a suitable set of supersingular curves over F_p. It does not
    identify that action with the unique rational subgroup of order 3
    or 5 at p = 83. Equality of j35 and j53 means this j-projection of
    the two rational steps commutes on this curve. Inequality means the
    projection does not. OBJECT FRAME. Representation: one j-invariant
    in F_83. Operation set: one Vélu quotient by the unique rational
    order-3 subgroup and one by the unique rational order-5 subgroup,
    in both orders. Not translation on a prime-order subgroup. The
    Weierstrass coefficients are discarded. Twists share a j-invariant,
    so the projection is lossy.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-027
      provenance: internal
      claim: >-
        The opened note states a commutative class-group action, a
        subexponential classical vectorization cost, and quantum cost
        2^{O(sqrt(log p))}. It does not state j35 or j53 at p = 83.
      verified_by: coordinator, this session, via knowledge/techniques/KN-TECH-027.md
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        The opened row states that over a finite field, curves are
        isogenous if and only if they have the same number of points.
        This idea compares two j-invariants, not two point counts.
      verified_by: coordinator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
  assumptions:
    - p = 83 is prime and 83 ≡ 3 (mod 4). The test checks both.
    - "#E0(F_83) = 84. If it fails, the instance is missing."
    - Each step is defined only when the current curve has exactly one rational subgroup of that order.
  predictions:
    - metric: absolute difference |j35 - j53| as integers in 0..82
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      Confirm p = 83 and #E0(F_83) = 84. From E0, take the unique
      rational order-3 subgroup, replace the curve by its Vélu quotient,
      then do the same for order 5, and record j35. Repeat from E0 in
      the other order and record j53. Do not walk more than one step
      of each degree. Do not compute a class group.
    controls:
      - "#E0(F_83) = 84, and both intermediate curves have 84 rational points."
      - Each kernel used is the unique rational subgroup of the stated order. Any other count aborts that order as undefined.
      - One step followed by its dual restores the starting j.
      - The ordinary control is the first a in 1..20 for which y^2 = x^3 + x + a over F_83 has trace not divisible by 83. That curve is not walked.
    required_metrics:
      - point_count_E0
      - j35
      - j53
      - rational_subgroup_count_3
      - rational_subgroup_count_5
  falsification_conditions:
    - j35 and j53 are both defined and j35 != j53.
    - "#E0(F_83) is not 84, so the comparison is not run."
    - Either order meets a rational subgroup count other than 1, so that composite is undefined.
    - A dual step fails to restore the starting j.
  confounders:
    - Twists share a j-invariant, so equal j does not mean equal Weierstrass models.
    - A shared j after one step each is not a statement about return lengths.
  interpretation_limits:
    - One prime and one step of each degree. No transfer to CSIDH-512.
    - This is not the capped return-length comparison o_3 != o_5 at p = 59.
    - Exponent delta against KN-TECH-027 is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p = 83 only, the unique rational subgroups of orders 3 and 5
        imitate two commuting ideal-class steps on j-invariants. The
        imitation is not a theorem. No transfer to another prime is claimed.
      rigorous_support: >-
        KN-TECH-027, opened, states that the class group acts
        commutatively on a suitable set of supersingular curves. The
        suitable set is not identified with these rational kernels.
      validation_plan: >-
        Compute j35 and j53 once at p = 83. Consistency checks are the
        point count 84, uniqueness of each kernel, and dual restoration
        of j. Sample size one has no tail.
  target_complexity:
    time_exponent: >-
      Four Vélu quotients of degree 3 or 5 on a 83-element field, plus
      one point count. Polynomial in the fixed p. No vectorization is run.
    memory_exponent: O(1) field elements at p = 83.
    best_known: >-
      KN-TECH-027, opened: classical vectorization subexponential in
      log p, and quantum cost 2^{O(sqrt(log p))}. Those baselines are
      not claimed.
    hidden_overhead: No o(1) term. The output is two j-invariants in F_83.
    tradeoff_note: No time-memory tradeoff. One pair of walks at one prime.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
