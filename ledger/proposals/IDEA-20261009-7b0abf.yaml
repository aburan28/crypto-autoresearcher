idea:
  id: IDEA-20261009-7b0abf
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  added: '2026-10-09'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  source: User request 2026-10-09 ('these all sound great') on the follow-on angles after BATCH-2e44f7; filed by
    the coordinator under the standing authorization.
  title: 'The xedni dependence rate measured exactly: lift r points, fit the curve, search bounded relations'
  class: measurement
  claim: Lifting r in {2, 3} random points of E(F_p) to their symmetric integer representatives, fitting the Weierstrass
    model through them, and searching exactly for a relation sum m_i P~_i = O with max |m_i| <= 6 finds a dependence
    in 0 of 100 trials per (p, r) cell for p from 101 to 12809, while a planted dependence P~_2 = [2]P~_1 is detected
    in 100 percent of controls; the lifted points have naive log-height about 0.7 log p and the lifted coefficients
    about 2 log p.
  mechanism: Silverman's xedni calculus needs the r lifted points to be linearly dependent on E/Q; JKSST showed
    the probability is negligible because the lifted curve has rank >= r with overwhelming probability and dependent
    configurations have small height. This idea measures the rate directly at the only scale where dependence could
    be cheap (coefficients ~ p^2), with an exact bounded relation search rather than a height regulator, so the
    number is a count and not a heuristic.
  novelty_status: known
  citations:
  - ref: KR-IC-cd159a
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Known-negative row: xedni calculus and lifting to characteristic zero fail (Jacobson-Koblitz-Silverman-Stein-Teske);
      forecloses ''canonical lift for ECDLP'' and ''rank of lifted curve''.'
  - ref: KR-RHO-53c89f
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Textbook row: Semaev/Satoh-Araki/Smart solve trace-one curves in polynomial time; forecloses ''p-adic
      lifting for trace one'' as a generic algorithm.'
  - ref: KN-TECH-73630e
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: The canonical prime-to-p torsion lift exists and is closed for every group-theoretic invariant; the formal
      logarithm route degenerates to O = mO.
  predictions:
  - metric: dependence_rate_overall
    direction: different
    minimum_effect: dependence_rate_overall = 0 with 1600 valid trials (upper 95 percent bound 0.0019) and control_detection_rate
      = 1.0
  minimal_test:
    design: 'run.py of EXP-CZLIFT-ed8113: 8 primes x r in {2,3} x 100 trials, relation bound 6, 24 planted controls'
    required_metrics:
    - dependence_rate_overall
    - dependence_rate_by_r
    - control_detection_rate
    - height_ratio_point_over_log_p
  falsification_conditions:
  - a dependence rate above 0.01 on both seeds
  - a control detection rate below 1.0 (instrument)
  interpretation_limits:
  - relation bound 6 and r <= 3; a dependence with larger coefficients is not searched
  - symmetric integer lifts only; the xedni freedom to choose other lifts is not explored beyond the curve fit
  estimated_cost:
