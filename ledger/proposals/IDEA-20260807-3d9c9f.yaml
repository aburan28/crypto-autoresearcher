idea:
  id: IDEA-20260807-3d9c9f
  question_id: RQ-AES-001
  added: '2026-08-07'
  title: >-
    Across-key overdispersion phi = Var_K(N)/E_K(N) of a truncated-differential
    hit count as a second-moment instrument for the differential hull, at
    r in {3,4,5,6,10}, AES-128
  class: measurement

  claim: >-
    FORMALIZATION OF CATALOGUE ENTRY A1-7 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md,
    lines 550-616). At r = 5 and r = 6, with M = 2^20 pairs per key and
    m = 2^12 keys, the overdispersion index phi - 1 (across-key variance over
    mean of the truncated-differential hit count N, reusing the CAND-ND-1
    inverse-SR-diagonal collision readout) is predicted to be positive and to
    scale linearly in M across M in {2^16, 2^18, 2^20} -- the scaling, not the
    value, is the falsifiable content, because a constant offset in phi is an
    instrument artifact and a linear one cannot be. No break, no key recovery,
    no relation to any baseline mechanism or published result is claimed;
    ceiling toy, sota_delta 0.

  mechanism: >-
    If a truncated differential's probability is carried by essentially one
    characteristic, p(K) is near-constant across keys and N | K ~
    Poisson(Mp), giving phi = 1 exactly. If it is carried by a cluster whose
    signed contributions depend on the key, p(K) varies and
    phi = 1 + M*Var_K(p)/E_K(p) > 1, with the excess growing linearly in the
    per-key data volume M. phi is a second moment across the key -- a
    functional distinct from every first-moment-at-fixed-key statistic this
    program has tracked (e.g. CAND-ND-2), and is identically 1 for any
    first-moment effect however large, however strong. The tracked object
    (phi) discards which pairs hit, which key produced which count, and the
    trail identities; it is invariant under relabelling of keys and of pairs,
    and a Poisson mixture cannot be inverted to recover the trail set that
    produced it.

  novelty_status: unverified

  source_refs:
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md (frame/CEILING section
      lines 1-46, entry A1-7 lines 550-618)
    - >-
      ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md section 4c
      "STRONGEST -- entries I could not break", item 4 (lines 417-422):
      independent red-team review found the orthogonality claim exact and the
      linear-in-M signature untrappable by any constant artifact, and could
      not break the entry.
    - >-
      ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/DEDUP.md row flag5 (line 45):
      dedup flags A1-7 as mergeable with A3-6 (same draws/counts/code path,
