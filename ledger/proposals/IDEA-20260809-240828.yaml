idea:
  id: IDEA-20260809-240828
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    Bound the o(1): measure the gap between the asymptotic formula and observed
    cost across sizes, and report how far the trend has to be extrapolated
  class: measurement
  claim: >-
    Security levels are read off an L-notation formula whose o(1) term is
    unbounded at any finite size. The claim is that the gap between the formula
    and measured cost, tracked across the calibration sizes, has a discernible
    trend; that the trend can be extrapolated with an interval; and that the
    interval at deployment size is wide enough to be worth stating alongside
    every quoted figure — or, if it is narrow, that this is a genuine and
    reportable vindication of the asymptotic practice.
  mechanism: >-
    Fit the residual between measured cost and the formula's prediction as a
    function of size, using only the sizes this program actually ran, and carry
    the fit's uncertainty forward. The residual is the empirical stand-in for the
    o(1) term.
  why_not_a_renamed_known_approach: >-
    Everyone knows the o(1) matters at practical sizes; the standard response is
    to quote the formula anyway. The contribution here is a measured residual
    trend with an interval, produced from this program's own certified runs, so
    that the correction is a number rather than a caveat.
  predictions:
  - observable: residual between measured cost and formula prediction versus size
    metric: log-scale residual per size
    predicted: Systematic rather than random, because the o(1) term is structural. A residual indistinguishable from noise would falsify the approach and mean the calibration sizes are too few or too close together.
  - observable: width of the extrapolated interval at deployment size
    metric: bits
    predicted: Wide -- plausibly larger than the differences that distinguish published estimates from one another, which if true is the single most important sentence this goal can write.
  minimal_test: >-
    Use the three certified calibration sizes, fit the residual with a declared
    model form, report residuals and interval, and state explicitly how many
    orders of magnitude of extrapolation separate the largest calibration size
    from the deployment size.
  controls:
  - 'MODEL-FORM CONTROL: at least two residual model forms are fitted and both intervals reported; a conclusion that depends on the choice of fit form is not a conclusion.'
  - 'LEAVE-ONE-OUT CONTROL: refit omitting each calibration size in turn and report how the deployment interval moves.'
  falsification_conditions:
  - The residual is indistinguishable from noise across sizes.
  - The two fit forms give materially different intervals, in which case the honest output is the disagreement rather than an interval.
  interpretation_limits: >-
    Three calibration points extrapolated over many orders of magnitude is a
    weak inference and the record must present it as such. The interval's WIDTH
    is the deliverable; its centre is not a security level.
  sota_delta: 'No attack. Delta: an explicit extrapolation interval attached to figures that are normally quoted bare.'
  dominated_by: Downstream of IDEA-20260809-15e1cd; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for o(1) / extrapolation interval: no cost-model records. WEB NOT CHECKED.'
  source_refs:
  - exTNFS asymptotic statements -- RECALLED, REQUIRED READS.
