idea:
  id: IDEA-20260809-24eec3
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Detect the dense sublattice event from the reduction profile, not from
    recovery success — the profile is an observable, recovery is a coin flip
  class: measurement
  claim: >-
    The overstretched event has a signature in the basis profile: the Gram-Schmidt
    log-norm sequence departs from the shape predicted for a random lattice of the
    same volume, in a localized way, before any secret is recovered. The claim is
    that this signature is measurable at dimensions far below where recovery
    succeeds, giving a detector with far better statistical power per unit compute
    than success counting, and therefore a much tighter estimate of where the
    transition lies.
  mechanism: >-
    Run reduction to a fixed block size, record the full profile, and compare
    against the profile of a matched random lattice. The departure statistic is
    computed as a localized deviation over the profile; the transition is located
    where the statistic separates the two populations.
  why_not_a_renamed_known_approach: >-
    The shape distortion is described qualitatively in the overstretched-NTRU
    literature. Turning it into a declared STATISTIC with a null distribution, and
    using it as the primary observable instead of recovery, is what this record
    proposes; the payoff is that non-recovery stops being uninformative.
  predictions:
  - observable: separation between the departure statistic on NTRU lattices and on matched random lattices
    metric: effect size, swept across q at fixed n
    predicted: >-
      Separation appears at q values below the recovery threshold. If the
      statistic only separates where recovery already succeeds, it adds nothing
      and the record says so.
  - observable: block size required for detection versus for recovery
    metric: two integers per cell
    predicted: Detection at strictly smaller block size, which is the entire value proposition.
  minimal_test: >-
    At one small n, sweep q across the predicted transition; at each cell run
    twenty NTRU instances and twenty matched random lattices at several block
    sizes; record profiles and compute the statistic's distributions.
  controls:
  - 'MATCHED-VOLUME NULL: random lattices of identical dimension and determinant, without which any profile departure could be an artifact of volume rather than of structure.'
  - 'BLOCK-SIZE LADDER: the statistic is computed at several block sizes, since a departure that appears only at one block size is a reduction artifact.'
  falsification_conditions:
  - The statistic does not separate NTRU from matched random lattices anywhere below the recovery threshold.
  - The separation depends on block size in a way that has no monotone trend, indicating an artifact.
  interpretation_limits: >-
    Toy dimension only. A detector calibrated at small n is not evidence about
    deployed parameters and its extrapolation carries the goal's stated interval.
  sota_delta: 'No attack. Delta: an observable with power where success counting has almost none, which changes the achievable precision of the transition estimate.'
  dominated_by: Not dominated by any corpus record; the ML-KEM goals measure lattice behaviour for a different structural event.
  estimated_cost: Implementation small; compute moderate and parallel.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for NTRU/fatigue/dense sublattice: no records. WEB NOT CHECKED.'
  source_refs:
  - NTRU fatigue-point reference -- RECALLED, REQUIRED READ, NOT YET READ.
