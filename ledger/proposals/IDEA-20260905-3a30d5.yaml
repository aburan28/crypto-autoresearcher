idea:
  id: IDEA-20260905-3a30d5
  added: '2026-09-05'
  recorded_at: '2026-09-05'
  title: >-
    THE FERMAT-QUOTIENT DIGIT: the Teichmuller lift of a coordinate has second
    p-adic digit x times the Fermat quotient of x, the unique homomorphic (torsion)
    lift has its own second digit, and their difference divided by 2y is the
    formal-group defect of the canonical non-homomorphic section -- three cheap
    canonical functions E(F_p) -> F_p that no recorded gate covers (not
    group-theoretic, not homogeneous, not bounded-degree, no formal-group map
    taken) and whose discrete-log spectra have never been measured; run them
    through the DL-spectrum census with the anomalous attack, which IS a
    Fermat-quotient construction, as the object on which the same instrument must
    read linear
  class: measurement
  question_id: RQ-ECDLP-c1b7b1
  question_ids: [RQ-ECDLP-c1b7b1, RQ-ECDLP-4fcbd3, RQ-ECDLP-002, RQ-CRYPTO-001]
  goal_ids: [GOAL-ECDLP-001, GOAL-CRYPTO-001]
  goal_applicability:
    GOAL-ECDLP-001: >-
      The first measurement in face F2 beyond group-theoretic invariants, aimed at
      exactly the two openings the ledger names (KN-OPEN-3417fc's coordinate digit
      statistics; ECFG-P1543's compact defect family), with a same-shape null, a
      decay test and a known-true object inside one instrument.
    GOAL-CRYPTO-001: >-
      Measures the fast-high-degree door of the coordinate-bias ceiling
      (IDEA-20260905-b6154d class E1) on its most natural member, the Fermat
      quotient of a coordinate, which is the ingredient of the only lifting attack
      that ever worked.
  status: proposed
  proposed_by: claude-code-session
  claim: >-
    (A) THE THREE FUNCTIONS. E/F_p ordinary, cofactor 1, n = #E coprime to p, E^ the
    naive lift with the same coefficients, R = (x, y) with y != 0.
    (A1) TEICHMULLER DIGIT. The Teichmuller representative omega(x) satisfies
    omega(x) = x^p mod p^2 (x^(p^k) is constant mod p^2 for k >= 1, an elementary
    check), and x^p = x (1 + p q_p(x)) with q_p(x) = (x^(p-1) - 1)/p the Fermat
    quotient. So the Teichmuller section s(R) = (omega(x), y~) with y~ the Hensel
    lift has second x-digit F(R) := x q_p(x) mod p. One exponentiation mod p^2.
    (A2) TORSION DIGIT. The unique homomorphic section t (KN-TECH-73630e, P1543)
    has second x-digit D_t(R) := (x(t(R)) mod p^2) div p, computed from any lift
    by [n]-multiplication and one division in the formal group at precision 2.
    (A3) DEFECT DIGIT. s(R) - t(R) lies in E_1 and, to first order along the
    invariant differential dx = 2y dt, x(s(R)) - x(t(R)) = 2y psi(s(R) - t(R))
    mod p^2, so delta_1(R) := (F(R) - D_t(R)) (2y)^(-1) mod p is the first digit of
    the formal-group defect u(R) = s(R) - t(R) of ECFG-P1543 for the canonical
    section s, computed as a coordinate difference with no formal-group map taken.
    Precision-3 variants (second digits) are the same construction one digit down.
    (B) WHY NO RECORDED GATE COVERS THEM. Not group-theoretic (73630e closes only
    those). Not homogeneous into a torsion-free module (dbb250's gate): delta is
    the defect of a non-homomorphic section, nonlinear by P1543's pro-p gate, and
    F, D_t are not homomorphisms of anything. Not a formal logarithm of a torsion
    object and not a valuation profile (ECDLP-IDEA-436's family and exclusions).
    Not of bounded degree: q_p(x) is a degree p - 1 function of x evaluated in
    log p multiplications, a fast high-degree function exactly like Miller's loop,
    outside the class C(D, L) whose DL-spectra IDEA-20260905-b6154d bounds at the
    Weil level. And the anomalous attack is a Fermat-quotient construction
    (KN-LIT-088's title, KN-TECH-033's tags): at n = p the analogous quantity
    psi([p] s(R)) / p mod p is LINEAR in the scalar. So these are the canonical
    cheap functions on which the one working lift attack and the unworking ones
    differ, and the difference has never been measured on the non-anomalous side.
    (C) PREDICTIONS, PRE-REGISTERED. On non-anomalous toy curves, for each of F,
    q_p(x), q_p(y), D_t, delta_1, delta_2 and their cheap post-functions (residues
    mod 2, 4, 8; Legendre symbol; half-interval), the DL-spectrum statistics of
    EXP-ECDLP-184fc4 are white: beta in [0.45, 0.60], Z in [0.5, 4], half-energy
    fraction 0.5 +- 0.05, matching the random-function null and with zero slope in
    p. On anomalous toy curves the Smart functional Sigma(R) := psi([p] s(R)) / p
    mod p, normalised to [0, 1), has beta = 1 and half-energy fraction below 8/N
    (a ramp in the scalar: energy on the arithmetic progression of multiples of
    its slope), and the scalar is recovered exactly with certificate [m]P = Q;
    the plain Fermat-quotient digit F is measured there too, with no prediction
    other than that it is reported.
    (D) READINGS. White everywhere: the measured obstruction is that the canonical
    section's defect values are white against the discrete log (P1543's compact
    defect family does not exist for the canonical section at this precision) and
    the torsion lift's coordinate digits carry no character correlation
    (KN-OPEN-3417fc, negative at toy scale for this family). A member with beta at
    or above 0.60 replicated on a second curve family: the first computational
    handle in face F2, to be replicated at a fourth seed and a further size and
    reviewed independently before any cost is modelled.
  mechanism: >-
    WHY THESE THREE AND NOT OTHERS. A cheap canonical function of a point in face
    F2 must come from a lift, and lifts of a point are exactly t(R) + X with X in
    E_1; a canonical choice of X is a canonical section, and the Teichmuller
    section is the one canonical section defined by coordinates alone (the
    torsion section is defined by the group law). The pair (F, D_t) records both
    sections' second digits and delta_1 records their difference, which is the
    canonical section's defect. Everything in face F2 at precision 2 is a function
    of these. WHY THE ANOMALOUS OBJECT IS THE RIGHT CONTROL. It is the unique case
    in which the same machinery (Hensel lift, [n]-multiplication into E_1, formal
    logarithm) yields a scalar-linear function, and its linearity is the exact
    spectral signature (beta = 1, energy on a progression) that a positive on the
    non-anomalous side would have to show. An instrument that does not read the
    anomalous object as linear is void, and one that does has been calibrated on
    the only known-true object in the lane. THE LOSSY-PROJECTION TEST. The tracked
    object is the DL-spectrum of a digit function; it discards the point-by-point
    digits and keeps the correlation with every character; the group law acts on
    spectral magnitudes by phases (translation by a known multiple), so magnitudes
    propagate deterministically. It passes; see IDEA-20260905-f31bc4.
  novelty_status: unverified
  novelty_screen:
    method: >-
      search_knowledge unavailable in this container (index empty). Local grep
      over ledger/, knowledge/ and ideas/ for Teichmuller, Fermat quotient,
      torsion section, defect, digit, valuation profile, anomalous, Serre-Tate;
      nearest records read in full as cited. Incomplete; no global novelty claim.
    nearest_internal_record: ECDLP-IDEA-436 (ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md)
    precise_difference: >-
      436 proposes valuation profiles v_p(x([k]S^) - x([j]S^)) and digit
      statistics on the TORSION lift, asks for efficient invertibility and a
      precision schedule, forbids any formal-group map, and has a GGM-simulability
      memo as its only next action; it was never run. This record measures the
      prior question, correlation with characters at fixed precision 2 and 3,
      adds the canonical NON-torsion section's defect and the Fermat-quotient
      digit (which 436 excludes), carries the anomalous known-true object and a
      random-function null with a decay test, and takes no formal-group map for
      F, D_t or delta_1.
    second_nearest: IDEA-20260807-cfe576 (Steps 3-4)
    second_difference: >-
      cfe576 verifies constructively that the torsion section is a homomorphism
      and that the naive set-section's defect is non-additive; this record's
      Stage 1 reuses exactly those two checks as blocking instrument gates and
      then measures what cfe576 does not: the defect's correlation with the
      discrete log.
    third_nearest: IDEA-20260807-dbb250 (Steps 2-3)
    third_difference: >-
      dbb250 computes p-adic heights of the torsion lift (predicted zero) with an
      anomalous control; no height is computed here, and the anomalous control is
      shared.
    scope: No global novelty claim.
