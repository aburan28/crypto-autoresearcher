  assumptions:
    - >-
      Cofactor-1 non-anomalous curves for the primary arm, with y != 0 (the three
      2-torsion x-values are excluded and counted).
    - >-
      Anomalous curves are found by search at field_bits 10 to 16 only (density
      about 1/(4 sqrt p) among random curves makes 18 bits and above too costly
      for naive point counting); the primary ladder runs to 20 bits.
    - >-
      Precision 2 and 3; every digit at precision 3 truncated must agree with the
      precision-2 computation, which is the instrument's consistency tell.
    - Toy tier; no transfer beyond the slopes.
  proof_search_map:
    bottleneck: >-
      A spike in the DL-spectrum of a canonical digit function on a non-anomalous
      curve; nothing in face F2 beyond group theory exists without it.
    baseline_embedding:
      parameter_slice: >-
        The anomalous arm (beta = 1, exact recovery) and the random-function null
        (beta = 0.5); and the torsion section's homomorphism check as the exact
        baseline of what a homomorphic lift looks like.
      reproduction_check: >-
        Anomalous recovery certified by [m]P = Q on every anomalous instance;
        random null at beta = 0.5 +- 0.05; torsion section a homomorphism on every
        random pair; naive-section defect non-additive on random pairs.
    observation_collision:
      observable: (beta, Z, half-energy fraction) per digit function
      distinct_preimage_search: >-
        A spike shared with the random null is normalisation, not structure; a
        spike absent on the null and present on the true digit at the two largest
        sizes with beta above 0.6 is structure. The anomalous arm shows what
        structure looks like on the same instrument.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the DL-spectra of the three canonical digit functions and their post-functions
        predicted_gain: a measured obstruction in face F2 at precision 2 and 3; no exponent
    quantifier_order: >-
      FOR ALL non-anomalous cells and FOR ALL members: white. Alternative: THERE
      EXISTS a member with a persistent concentrated spectrum across the ladder.
    method_ceiling:
      strongest_certifiable_claim: >-
        White spectra of the frozen digit library at precision 2 and 3 on
        cofactor-1 curves to 20 bits, with the anomalous object detected. Nothing
        about higher precision, other sections, or other lifts of the curve.
      nearby_object_control: the anomalous toy curve
    proof_obligations:
      - claim: Teichmuller congruence and the first-order identity (numerical verification)
        responsibility: correctness
      - claim: torsion section is a homomorphism; naive defect is non-additive (P1543 checks)
        responsibility: baseline
      - claim: Gumbel level and beta windows as in EXP-ECDLP-184fc4
        responsibility: size
      - claim: precision-2 and -3 arithmetic within one tool window to 20 bits
        responsibility: runtime
      - claim: toy tier, precision 2-3 only
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: beta_per_digit_function
      direction: different
      minimum_effect: Null in [0.45, 0.60] with the random null at 0.5 +- 0.05; structure at or above 0.60 on both families at the two largest sizes.
    - metric: half_energy_fraction
      direction: different
      minimum_effect: Null 0.5 +- 0.05; structure below 0.1; anomalous Sigma below 8/N.
    - metric: anomalous_recovery
      direction: higher
      minimum_effect: exact scalar recovery with certificate on every anomalous instance; beta = 1 for Sigma.
    - metric: precision_consistency
      direction: different
      minimum_effect: precision-3 digits truncated equal precision-2 digits on every point, exactly.
  minimal_test:
    design: >-
      Stage 1 builds and validates the p-adic instrument (IDEA-20260905-dacf4f);
      Stage 2 tabulates logs and computes the digit library on cofactor-1
      non-anomalous curves at field_bits 10 to 20, three seeds, and runs the
      EXP-ECDLP-184fc4 spectral statistics with the random-function null; Stage 3
      runs the anomalous arm at 10 to 16 bits; Stage 4 reports slopes and readings.
    controls:
      - random function with the member's marginal (null of the same shape)
      - second curve family per size
      - anomalous toy curves with certified recovery (known-true; blocking)
      - torsion-section homomorphism and naive-defect non-additivity checks (blocking)
      - precision consistency 2 versus 3 (blocking)
    required_metrics:
      - beta, Z and half-energy fraction per member per cell, with the null beside them
      - anomalous recovery certificates and Sigma's spectrum
      - precision consistency pass counts
      - wall seconds and peak bytes per cell
  falsification_conditions:
    - >-
      A member with beta at or above 0.60 on both families at the two largest
      sizes while the null stays at 0.5. Claim (C) false for that member; replicate
      and review.
    - >-
      The anomalous arm fails to recover the scalar or Sigma is not beta = 1. The
      instrument is void; nothing is reported.
    - >-
      Precision-3 and precision-2 digits disagree. Instrument defect; nothing is
      reported.
    - Crashes, timeouts, memory exhaustion. Infrastructure, never negative mathematical evidence.
  confounders:
    - >-
      Degenerate anomalous lifts: for some curve lifts psi([p] s(R)) may vanish
      mod p^2 (the recalled failure mode of the attack on the canonical lift);
      the contract then perturbs the curve lift by p and records it.
    - >-
      Points with y = 0 mod p or x = 0 (q_p undefined at x = 0); excluded and
      counted.
    - >-
      Small p makes the Fermat quotient's marginal far from uniform; the null
      shares the marginal by construction.
  interpretation_limits:
    - Toy tier, precision 2 and 3, naive curve lift; other lifts of the curve are a different arm not run here.
    - A white result closes the frozen digit family at this precision only; it does not close face F2.
    - No attack, no exponent moved; the anomalous arm reproduces a known attack.
  heuristic_assumptions:
    - id: H1
      statement: >-
        White-digit heuristic: on a non-anomalous cofactor-1 curve, the second and
        third p-adic digits of the Teichmuller and torsion lifts, and their defect,
        behave against the group characters like random functions with the same
        marginal.
      rigorous_support: >-
        None at the Weil level (the functions are of unbounded degree); the only
        rigorous inputs are P1543's non-additivity of the defect and 73630e's
        information-theoretic emptiness of the torsion lift, neither of which
        bounds a correlation. The classical statement imitated is the
        equidistribution of Fermat quotients, recalled and unverified.
      validation_plan: >-
        This record's census with the random null and the decay test, with the
        tail check that the largest Z observed has null exceedance probability
        above 1/(members * cells).
  target_complexity:
    time_exponent: >-
      No claim. A member at beta = 1 on a non-anomalous curve would be an additive
      transfer and would be priced only after replication and review.
    memory_exponent: Not applicable.
    best_known: 'Generic rho 0.886 sqrt(N) (KN-TECH-006); anomalous linear time only at #E = p (KN-TECH-033).'
    hidden_overhead: The precision charged per digit; none hidden.
    tradeoff_note: Not applicable.
  estimated_cost:
    implementation: medium
    compute: low
    note: >-
      The p-adic instrument is a few hundred lines of pure Python; the census
      reuses the FFT pipeline (numpy, an undeclared dependency the executor must
      install and record).
  recommended_priority: high
