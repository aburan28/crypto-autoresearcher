idea:
  id: IDEA-20261001-fbee3f
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES SMALL dim(V·V) PREDICT usable_dimensions=∅? On toy Koblitz n∈{17,23,31}
    with ord_n(2)=n−1 when available, sweep F_2-subspaces V of dim ℓ and test
    whether dim(V^(2)) below a pre-registered floor co-occurs with empty
    usable_dimensions under the Part-1 census predicates.

  class: heuristic_validation

  claim: >-
    Part-1 on EXP-BINSTD-178742 reported usable_dimensions=[] at deployed
    n with ord_n(2)=n−1; IDEA-20261001-11aa69 asks whether that emptiness is
    the right structural gate. CLAIM: at toy n∈{17,23,31}, for a sweep of
    subspaces with dim V=ℓ∈{⌊n/8⌋..⌊n/4⌋}, the Spearman rank correlation
    between dim(V^(2)) and |usable_dimensions(V)| is ≤ −0.6 across ≥30
    subspaces — OR the correlation fails and the two meters are recorded as
    empirically independent at this scale. CLAIM TIER: heuristic_validation.
    NO break. NO exponent. NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: F_2-subspaces V⊂F_{2^n} as factor-base
    supports; V^(2)=span{uv : u,v∈V} in a fixed basis. Operation set: compute
    dim(V^(2)) and the Part-1 usable_dimensions predicate on the same V.
    Trichotomy: Class II check that the FPPR product-space heuristic
    (KR-IC-73db3f) predicts the program's emptiness gate. Lossy-projection:
    random V of the same dimension must be compared to structured
    polynomial-basis spans; if only structured V show correlation, report
    that scope. OFF-LIMITS: choosing V to claim a PDP speedup; Semaev solves.
    WHAT IS NEW: a joint numeric meter tying product-space dimension to the
    Part-1 usable_dimensions emptiness observation.

  novelty_status: unverified
  prior_art:
