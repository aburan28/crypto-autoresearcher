  assumptions:
    - Uses the same usable_dimensions predicate as Part-1 / 11aa69 scope.
    - Toy n only; random vs structured V both required.
    - No PDP success-rate claim from dim(V^(2)) alone.

  heuristic_assumptions:
    - id: HEUR-BINSTD-fbee3f-H1
      formal_statement: >-
        FORALL n∈{17,23,31}, over a pre-registered set S_n of ≥30 subspaces
        with dim V∈[⌊n/8⌋,⌊n/4⌋]: Spearman ρ(dim(V^(2)), |usable_dimensions(V)|)
        ≤ −0.6.
      random_model_justification: >-
        Rigorous: dim(V^(2)) is an exact linear-algebra invariant of V.
        Classical: FPPR/Petit–Quisquater-style heuristics treat small product
        spaces as the cost driver for descended systems (KR-IC-73db3f).
        Whether that invariant tracks this program's usable_dimensions gate
        is the transfer hypothesis under test.
      supporting_results:
        - KR-IC-73db3f
      validation_experiment_ids: []
      falsification_condition: >-
        Spearman ρ > −0.6 on the frozen S_n, OR structured and random V of
        equal dimension disagree on sign of association.

  predictions:
    - metric: spearman_dimV2_vs_usable_dims
      direction: lower
      minimum_effect: '≤ −0.6 at each toy n'
    - metric: structured_vs_random_sign_agreement
      direction: match
      minimum_effect: 'same sign of association on both families'

  minimal_test: >-
    Stage 0: freeze S_n (structured polynomial spans + random V), predicate
    code hash. Stage 1: n=17, ≥30 subspaces, report ρ + scatter. Stage 2:
    n=23,31. Budget: ≤20 runs, ≤4 CPU-hours. Stop if predicate hash drifts.

  controls:
    - ctl_structured_polynomial_basis_spans
    - ctl_random_subspaces_matched_dim
    - ctl_predicate_code_hash_pin
    - null_shuffle_usable_dimensions_labels

  falsification_conditions:
    - Claiming PDP / exponent gains from a correlation alone.
    - Transferring toy ρ to n≥131 without a new contract.
    - Editing S_n after seeing ρ.

