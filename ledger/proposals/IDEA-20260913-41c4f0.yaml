idea:
  id: IDEA-20260913-41c4f0
  title: >-
    Nagao's O(n^{8w+1}) is a polynomial with no constants written down, in a paper
    that says its own o(1) is HUGE and contains no table, no timing and no
    measurement. Write the constants down at the FIPS binary labels and the
    polynomial may lose to Pollard rho at every curve anyone deploys -- and if it
    does not, that is where the interesting n is.
  class: cost_model_audit
  claim: >-
    Nagao ePrint 2015/984 Theorem 1 states that under the first fall degree
    assumption ECDLP over F_{2^n} costs O(n^{8w+1}) with w ~ 2.7, and the author's
    own ePrint keyword for the paper is "polynomial time algorithm". The paper
    supplies no concrete cost of any kind: eight pages, zero tables, zero
    measurements, and Section 6 in the author's own capitalisation warns that "many
    complicated terms are included into the o(1) term and so for normal size input n,
    o(1) has HUGE value".

    The claim of this proposal is that the concrete content of Theorem 1 is
    computable by arithmetic alone, using machinery BATCH-9d649f has already built
    and had independently validated for Semaev's bound, and that the answer is
    decision-relevant either way. Two outcomes, both useful: the constant-explicit
    cost exceeds 0.886 * 2^{n/2} at every FIPS binary label, in which case a
    published polynomial-time claim against ECDLP has no concrete consequence for any
    standardised curve and this program can say so with a table rather than a
    dismissal; or it does not, in which case there is a crossover n and it is the most
    important number in this area.
  mechanism: >-
    WHAT NAGAO'S BOOKKEEPING ACTUALLY SAYS. His Section 7 fixes k = C_0 a small
    constant, m ~ n/C_0, so:

      #Fb_i ~ p^{C_0},   #Fb ~ m * p^{C_0} = (p^{C_0}/C_0) * n = O(n)
      variables in EQS4:  N = n(m-1) ~ n^2/C_0
      Groebner charge:    O(N^{d_F w}) = O((nm)^{4w}) = O(n^{8w})   [Lemma 2, d_F = 4]
      decompose step:     #Fb relations x that charge  =>  O(n^{8w+1})
      linear algebra:     (#Fb)^w = O(n^w), which he calls "very very small"

    Every one of those steps hides a factor, and the hidden factors are not small:

      (H1) Lemma 2's O(N^{d_F}) monomial count is really C(N + 4, 4) ~ N^4/24 at
           d_F = 4, so the 1/24 helps while the binomial's lower terms hurt, and the
           SQUARE of it is what the linear algebra costs -- the same C(N+4,4)^2
           accounting the SEMBIN validator built and reconciled against the frozen
           source's own Tables 1-2.
      (H2) w ~ 2.7 is asserted; the program's committed convention set is
           omega in {2.376, 2.807, 3.0} (H-SEMBIN-97ea23, EXP-SEMBIN-2c40bb), and
           n^{8w+1} spans n^{20.0} to n^{25.0} across it. At n = 571 that is a range
           of 46 BITS, wider than most of the effects this program measures.
      (H3) p^{C_0}/C_0 is a constant in n and a disaster in practice: it multiplies
           the relation count, and C_0 must be large enough that no coset is empty --
           Nagao's own parenthesis, "if one takes k = 1, it sometimes happens
           #Fb_i = empty. To avoid such case and confirm the relation
           prod_i #Fb_i ~ p^n, we choose suitable constant C_0."  He never says how
           large. The cost is exponential in C_0 and the correctness constraint is a
           lower bound on C_0, so this term is the one that decides everything.
      (H4) "Probability that decomposition success is O(1)" is not probability 1.
           prod_i #Fb_i ~ #E gives EXPECTED SOLUTION COUNT ~ 1, so under the Poisson
           heuristic the success probability is ~ 1 - 1/e ~ 0.632, and the inverse
           enters multiplicatively. Small, but it is charged, not waved.
      (H5) MEMORY IS NEVER MENTIONED IN THE PAPER. A degree-4 Macaulay block on
           N ~ n^2/C_0 variables is the whole cost, and at n = 409 with C_0 = 4,
           N ~ 41,820, so C(N+4,4) ~ 2^{57} columns. The memory Theorem 1 needs is
           not O(n^{anything}) small, and the target-result profile requires memory
           beside time for any asymptotic claim.

    THE COMPARISON, AND WHY IT IS APPLES TO APPLES. This is the same computation
    BATCH-9d649f performed for Semaev's 2^{1.6986 sqrt(n ln n)}: charge the algorithm
    and charge van Oorschot-Wiener parallel rho in the same metric, over the declared
    metric set (time only, time x memory, area-time, equal-rate), with the baseline
    charged at its own operating point rather than at a mismatched one. That last
    point is not optional here: O-6 of EV-SEMBIN-71e5cd is the round's largest single
    finding -- the record had charged vOW the memory of a 2^30-point store and the
    time of one processor, two different points on vOW's curve, overcharging by
    exactly 29.0 bits at every label. Nagao's cost must be compared against the
    Pareto-minimum of vOW's own curve, or the comparison reproduces the defect the
    review just found.

    WHAT THIS PRODUCES. A concrete-cost table at n in {163, 233, 283, 409, 571}, for
    each omega in the committed set and each metric, with every hidden factor above
    made a named column rather than absorbed, plus the C_0 sensitivity that (H3)
    makes load-bearing, plus the crossover n where one exists. And an explicit
    affected-versus-safe scope statement, which for a bound this loose is expected to
    read "no standardised curve is affected" -- a conclusion worth having in a table
    rather than as an opinion.
  question_id: RQ-SEMBIN-9e8f82
  question_ids: [RQ-SEMBIN-9e8f82]
  goal_ids: [GOAL-SEMBIN-5078bc]
  goal_applicability:
    - >-
      GOAL-SEMBIN-5078bc audit lane. Direct successor to COST-SEMBIN-8d123b (as
      superseded in scope by DEC-20260913-74e208 and CORR-20260913-53739b), reusing
      its conventions, its baseline charging as CORRECTED by O-6/O-7, and its metric
      set -- against a second published bound over the same object.
  status: proposed
  proposed_by: coordinator
  recorded_at: '2026-09-13'
  task_id: null
  batch_id: BATCH-SEMBIN-20260913-9d649f
  area_tags: [SEMBIN, ECDLP2M]
  novelty_status: adaptation
  novelty_screen:
    what_is_not_new: >-
      Concrete-costing an asymptotic bound against vOW rho at standardised parameters
      is exactly what COST-SEMBIN-8d123b did for Semaev's bound, using code and
      conventions that already exist and that three independent reviewers have been
      over. Nothing methodological here is new; this is the same instrument pointed at
      a second target.
    what_is_new: >-
      That the target has never been costed. Nagao's Theorem 1 has no concrete
      evaluation in this program's corpus, and the paper itself contains none, so
      there is no number in existence to reproduce or dispute. Also new: the C_0
      sensitivity, which no source addresses -- Nagao's cost is exponential in C_0
      while his own correctness constraint (no empty coset) is a lower bound on C_0,
      and nobody has written down what that lower bound is.
    searched: >-
      the frozen Nagao text (no tables, no timings, verified by reading all eight
      pages); grep of knowledge/, ledger/ and experiments/ for any evaluation of
      n^{8w+1} or of Nagao's bound (none); COST-SEMBIN-8d123b and CORR-20260913-53739b
      for the conventions this would reuse.
  citations:
    - source: >-
        inputs/NAGAO-2015-984/paper_fulltext.md -- Theorem 1; Lemma 2 (the O(N^{d_F w})
        charge); Section 6 (the "o(1) has HUGE value" disclosure); Section 7 (k = C_0,
        m ~ n/C_0, #Fb = O(n), the empty-coset parenthesis, and the O(1) yield)
      provenance: retrieved
      verified_by: >-
        coordinator this session -- frozen at inputs/NAGAO-2015-984/ with a
        sha256-pinned retrieval receipt, and read in full
    - source: >-
        EV-SEMBIN-71e5cd O-6 and O-7 -- the baseline was charged at a dominated
        operating point, overcharging vOW by exactly 29.0 bits at n = 283, 310, 409
        and 571 alike, and charging it coherently moves the crossover by 85 in n
      provenance: internal
      verified_by: >-
        red team TASK-20260913-cf9d98, composed by coordinator in DEC-20260913-74e208
    - source: >-
        H-SEMBIN-97ea23 and experiments/EXP-SEMBIN-2c40bb/specification.yaml -- the
        committed omega set {2.376, 2.807, 3.0}, the four-store axis including
        nonzeros_with_index_sparse, and the metric set
      provenance: internal
      verified_by: coordinator, DEC-20260913-74e208
    - source: >-
        CORR-20260913-53739b -- the authoritative yield-charge and floor-coefficient
        conventions after the ledger/ideation divergence was re-derived
      provenance: internal
      verified_by: coordinator this session
  unread_pointers:
    note: >-
      NOT A CITATION, AND DELIBERATELY NOT IN THE CITATIONS BLOCK, for the reason
      AGENTS.md rule 9 gives: a recalled reference is a pointer and never support. The
      novelty_status above rests on the Nagao text that was read and on this program's
      own committed cost records.
    pointers:
      - >-
        van Oorschot and Wiener, Parallel collision search with cryptanalytic
        applications, J. Cryptology 12(1), 1999. THE ARITHMETIC THIS PROPOSAL USES IS
        NOT RECALLED: the 0.886 * 2^{n/2} convention and the T = W(1/M + 1/w),
        Mem = 3n max(w, M) curve are carried in COST-SEMBIN-8d123b, were re-derived
        independently by the red team in TASK-20260913-cf9d98, and are cited above as
        internal and verified. What remains unread in this program is the PRIMARY
        SOURCE, which is a standing pending item and is recorded as one here so that
        the baseline's provenance is not quietly upgraded by reuse.
  assumptions:
    - >-
      Nagao's Theorem 1 is evaluated AS STATED, granting Proposition 5 and the first
      fall degree assumption for the sake of the costing. This proposal does not test
      either; IDEA-20260913-352163 tests the former. A cost computed under a granted
      assumption is a conditional cost and is labelled one.
    - >-
      C(N + d, d) is the honest monomial count at degree bound d, and the
      linear-algebra cost is charged on its square in the accounting family the
      SEMBIN validator reconciled against the frozen source's Tables 1-2. Nagao's
      N^{d_F} is the loose form and both are reported.
    - >-
      An expected solution count of ~1 gives a constant success probability, not 1.
      The Poisson heuristic used to turn one into the other is itself a heuristic and
      is numbered as such.
  predictions:
    - >-
      P1. At every FIPS binary label n in {163, 233, 283, 409, 571}, the
      constant-explicit Nagao cost EXCEEDS 0.886 * 2^{n/2} under time-only charging,
      for every omega in the committed set, by a margin of at least 40 bits. Stated as
      the preregistered prior: the polynomial is asymptotic and the labels are small,
      so n^{20} to n^{25} at n = 571 is 2^{183} to 2^{229} against rho's 2^{285} --
      WHICH IS THE OPPOSITE DIRECTION. This prediction is therefore recorded as the
      one most likely to be WRONG, and the arithmetic that decides it is the whole
      point of the experiment.
    - >-
      P2. A time-only crossover EXISTS below n = 571 and the interesting question is
      not whether but where, because n^{8w+1} grows polynomially while 2^{n/2} grows
      exponentially. Under omega = 2.807 and the loosest reading, the crossover is
      predicted in the range n in [250, 450].
    - >-
      P3. P2 does not survive memory charging. Once the degree-4 Macaulay block on
      N ~ n^2/C_0 variables is charged as memory -- C(N+4,4) columns, which the paper
      never mentions -- the time x memory product is predicted to exceed vOW's
      Pareto minimum at every label, and the crossover to move above n = 571 or
      vanish. Memory is where this bound is expected to die, exactly as O-6/O-7 found
      memory to be where Semaev's advantage died.
    - >-
      P4. C_0 SENSITIVITY DOMINATES OMEGA SENSITIVITY. The cost carries p^{C_0}/C_0
      multiplicatively and (n^2/C_0)^{4w} in the base, so C_0 pulls in two directions;
      the predicted spread across defensible C_0 (bounded below by the no-empty-coset
      constraint) exceeds the 46-bit spread across the omega set at n = 571.
    - >-
      P5. The no-empty-coset constraint forces C_0 = Omega(log n) rather than a
      constant, because m ~ n/C_0 cosets each of expected size ~ p^{C_0} must all be
      non-empty simultaneously, which is a coupon-collector condition. If so, k is not
      constant, m ~ n/log n, and THEOREM 1 IS NOT POLYNOMIAL AS STATED -- a defect in
      the theorem's own parameter choice that is independent of Proposition 5 and
      cheaper to check than it.
  minimal_test:
    what: >-
      Pure arithmetic, log2 domain, no execution: the cost surface over
      n in {163, 233, 283, 409, 571} x omega in {2.376, 2.807, 3.0} x C_0 in a
      defensible range x the four committed metrics x both monomial-count readings
      (N^4 and C(N+4,4)), against vOW charged at the Pareto minimum of its own curve.
      Plus the P5 coupon-collector derivation, which is a closed-form check and should
      be run FIRST because it can invalidate the whole table's premise.
    controls:
      - >-
        REPRODUCTION GATE: the same code must reproduce COST-SEMBIN-8d123b's Semaev
        figures as corrected by CORR-20260913-53739b, cell for cell, before any Nagao
        cell is reported. A tool that cannot reproduce the number it was built for has
        not been shown to compute anything.
      - >-
        KNOWN-FALSE OBJECT: charge the same accounting at d_F = 5 rather than 4. The
        cost must rise, and by the amount the degree ratio predicts; a costing that is
        insensitive to the degree bound is not costing this algorithm.
      - >-
        MATCHED NULL: a free-yield null (success probability set to 1) and a
        zero-memory null, to decompose how much of any Nagao advantage comes from the
        yield claim and how much from memory going uncharged.
      - >-
        NEARBY OBJECT: the p = 3 and p = 5 branch, where Nagao's own exponent is
        (6p+2)w+1 rather than 8w+1 -- n^{54} at p = 3. Both branches come from one
        formula and a pipeline that does not reproduce the odd-characteristic exponent
        has mis-implemented the characteristic-2 one.
    stopping: >-
      A complete table, or a recorded statement of which cells were not computed and
      why. There is no run to time out.
  falsification_conditions:
    - >-
      P5 holding -- C_0 = Omega(log n) forced by the no-empty-coset constraint --
      falsifies Theorem 1's polynomiality AS STATED, independently of Proposition 5,
      and is the cheapest available refutation. It would also be a claim against a
      published result and would need independent review before it is asserted.
    - >-
      A time-and-memory-charged crossover below n = 571 falsifies P3 and would be a
      claimed result about a standardised curve family. It requires
      review-breakthrough at max effort under core rule 12 before it leaves this
      program's own records, and it may not be degraded.
    - >-
      Failure to reproduce COST-SEMBIN-8d123b's corrected figures invalidates every
      cell and is reported as an implementation failure, never as a finding about
      Nagao.
  confounders:
    - >-
      CHARGING NAGAO AND SEMAEV IN DIFFERENT CONVENTIONS. The two bounds must be
      charged in one convention set or the comparison measures the conventions.
      CORR-20260913-53739b exists because exactly this diverged once already.
    - >-
      RECHARGING vOW AT ITS DOMINATED POINT. O-6 measured that error at exactly 29.0
      bits. Reusing the old baseline call reintroduces it silently.
    - >-
      C_0 CHOSEN TO FLATTER OR TO KILL. C_0 is a free parameter with a correctness
      lower bound nobody has derived; picking it produces whatever answer is wanted.
      The deliverable is a surface over C_0, never a single C_0.
    - >-
      READING O(1) AS 1. The yield, the monomial-count constant, and the
      linear-algebra constant are each O(1) in the source and none is 1.
    - >-
      Comparing an ASYMPTOTIC bound at small n at all. n^{8w+1} is a bound with an
      unstated onset; a table at n = 163 may be entirely outside the regime where the
      bound means anything, and the table must say so rather than implying the bound
      applies there.
  interpretation_limits:
    - >-
      Conditional on Proposition 5 and on the first fall degree assumption, both
      granted here and neither tested. A conditional cost is not a cost.
    - >-
      A cost table is not an attack and this proposal will not report one. The
      expected conclusion is an explicit affected-versus-safe statement in which no
      standardised curve is affected.
    - >-
      Nagao's o(1) is self-described as HUGE. Any table this produces is an
      interpretation of what his bound would cost IF the absorbed terms are the ones
      enumerated here, and the enumeration is this program's, not his. It must be
      attributed accordingly and never quoted as Nagao's number.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        With m ~ n/C_0 pairwise disjoint cosets each of expected size p^{C_0}, the
        probability that ALL m are non-empty tends to 1 only if p^{C_0} = Omega(log m),
        i.e. C_0 = Omega(log log n / log p) at minimum and C_0 = Omega(log n / log p)
        for the stronger condition prod_i #Fb_i ~ p^n that Nagao's yield argument
        requires.
      random_model_justification: >-
        The number of points of E(F_{p^n}) whose x-coordinate lies in a fixed coset of
        a k-dimensional F_p-subspace behaves like a binomial count with mean ~ p^k,
        under the standard heuristic that x-coordinates of curve points are
        equidistributed over F_{p^n}; m independent such counts all being non-empty is
        then a coupon-collector condition.
      supporting_results:
        - >-
          Nagao 2015/984 Section 7's own parenthesis is the qualitative form of this:
          "if one takes k = 1, it sometimes happens #Fb_i = empty. To avoid such case
          ... we choose suitable constant C_0." Provenance retrieved, read this
          session. He states the problem and does not quantify it.
      validation_experiment_ids: [EXP-SEMBIN-db9bc3]
      falsification_condition: >-
        A derivation showing the all-non-empty probability tends to 1 at constant C_0,
        or an exact count at small (n, k) showing no empty coset arises where the
        heuristic predicts one.
  proof_search_map:
    bottleneck: >-
      Not an algorithmic step but a bookkeeping one: which terms Theorem 1's O(.) and
      o(1) absorb. The theorem is arithmetic given its inputs, so the entire distance
      between "polynomial" and "irrelevant at every deployed parameter" lives in five
      named factors (H1-H5 in the mechanism above), and the bottleneck is that nobody
      has written them down.
    baseline_embedding:
      parameter_slice: >-
        C_0 = k with m = n/k and the m! yield restored: at that slice Nagao's Section 7
        accounting degenerates to Semaev's Section 4.3 accounting, since the only
        structural difference between them is disjointness of the cosets. The
        already-costed Semaev bound is therefore an exact boundary case of this one.
      reproduction_check: >-
        The Semaev figures of COST-SEMBIN-8d123b as corrected by CORR-20260913-53739b,
        reproduced cell for cell as a frozen regression fixture, and the degenerate
        slice returning them. Gate, not a check: no Nagao cell is reported until it
        passes.
    observation_collision:
      observable: >-
        the signed margin in bits between the charged Nagao cost and the charged vOW
        cost at a given (n, omega, C_0, metric, monomial-count reading).
      distinct_preimage_search: >-
        Search for (C_0, omega) pairs giving the SAME margin at one n but OPPOSITE
        orderings at another -- i.e. two parameter choices indistinguishable at
        n = 283 that disagree at n = 571. If such pairs exist and are both defensible,
        then a single crossover number is not a well-defined deliverable and the
        answer is a surface, which is precisely the framing failure
        EXP-SEMBIN-f4a17b's own falsification criterion fired on (O-9). Designing this
        as a surface from the start is that finding applied rather than repeated.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          the whole cost in the log2 domain as a sum of named, separately reportable
          terms -- yield, monomial count, linear-algebra exponent, coset constant,
          relation count, memory -- rather than one closed form.
        predicted_gain: >-
          makes every hidden factor a column a reviewer can attack independently, and
          makes the C_0 and omega sensitivities readable off the table instead of
          requiring a re-derivation.
      - transform: boundary_lift
        proposed_object: >-
          the coupon-collector bound on C_0 (HEUR-1), lifted from Nagao's qualitative
          parenthesis to a quantitative constraint.
        predicted_gain: >-
          if it forces C_0 = Omega(log n) then Theorem 1 is not polynomial as stated,
          which is a refutation obtained from the paper's own footnote and no
          computation at all -- the cheapest possible outcome and the reason P5 is run
          first.
    quantifier_order: >-
      Theorem 1 says "the complexity ... is O(n^{8w+1})", which is: THERE EXISTS a
      constant C and an n_0 such that FOR ALL n > n_0 the cost is <= C n^{8w+1}. Both
      C and n_0 are unstated, and Section 6 says C is HUGE. A concrete-cost table at
      n in {163, ..., 571} is a statement about n possibly BELOW n_0, so it can never
      contradict the theorem -- it can only establish that the theorem has no content
      at those n. Getting this order right is what keeps the deliverable honest: the
      table's conclusion is about applicability at deployed parameters, not about
      whether Nagao is wrong.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under Nagao's Theorem 1 read with the following five absorbed factors made
        explicit, and granting Proposition 5 and the first fall degree assumption, the
        cost at n in {163, 233, 283, 409, 571} is [table], against vOW at its own
        Pareto minimum, giving [margins]." Conditional, convention-explicit, and
        silent on whether the theorem is true.
      nearby_object_control: >-
        The p >= 3 branch, exponent (6p+2)w+1 from the same formula: n^{54.5} at p = 3,
        omega = 2.807. It comes from Nagao's Proposition 2 rather than a separate
        derivation, so a pipeline that gets 8w+1 right and (6p+2)w+1 wrong has
        hardcoded the characteristic-2 case.
    proof_obligations:
      - claim: The pipeline reproduces the corrected Semaev figures exactly.
        responsibility: baseline
      - claim: vOW is charged at the Pareto minimum of its own time-memory curve.
        responsibility: baseline
      - claim: Every absorbed factor is a named, separately reported column.
        responsibility: runtime
      - claim: Memory is charged beside time at every cell.
        responsibility: memory
      - claim: The C_0 lower bound is derived rather than chosen.
        responsibility: feasibility
      - claim: >-
          The table states that it concerns applicability at deployed n and cannot
          contradict an asymptotic theorem whose n_0 is unstated.
        responsibility: scope
      - claim: No conclusion about any curve's security.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    problem: ECDLP over F_{2^n}
    prior_best: 0.886 * 2^{n/2} (van Oorschot-Wiener parallel rho, charged at its own Pareto minimum)
    claimed_by_source: O(n^{8w+1}), w ~ 2.7, under the first fall degree assumption
    this_proposal_claims: >-
      NOTHING about the exponent. It computes what the source's claimed exponent costs
      at deployed parameters under explicitly stated absorbed constants.
    claim_kind: audit
  dominated_by:
    checked: true
    result: >-
      Expected: Nagao's charged cost is DOMINATED by vOW parallel rho at every FIPS
      binary label under every metric that charges memory. That expectation is P1/P3
      and is exactly what the experiment tests, so it is recorded as the prior and not
      as a result.
    frontier_rows_checked:
      - van Oorschot-Wiener parallel rho, time-only, 0.886 * 2^{n/2}
      - >-
        van Oorschot-Wiener at the Pareto minimum of T = W(1/M + 1/w),
        Mem = 3n max(w, M) -- the coherent charging established by O-6/O-7, which
        moved the Semaev crossover 85 in n
      - Semaev 2015/310, 2^{1.6986 sqrt(n ln n)}, time-only
      - >-
        Semaev under the four store readings of H-SEMBIN-97ea23 (dense width^2,
        rows x cols dense, record sparse, nonzeros-with-index sparse), whose
        crossovers span 344 to 435
      - >-
        Nagao's own p >= 3 branch, n^{(6p+2)w+1}, as the nearby object
    basis: >-
      Every row above is a committed record in this repository with figures that three
      independent reviewers went over in REVIEW-SEMBIN-20260913-9d649f. The frontier is
      checked across time, memory and the time x memory product; there is no
      data/query axis for this problem.
  sota_delta:
    quantity: >-
      concrete cost of Nagao Theorem 1 at FIPS binary labels, in bits, with absorbed
      constants explicit, against vOW at its Pareto minimum
    current_value: >-
      undefined -- the source contains no table, no timing and no measurement, and no
      evaluation exists in this program's corpus. There is no prior number.
    delta_if_successful: >-
      A signed margin in bits at five labels across three omega values, four metrics,
      two monomial-count readings and a C_0 range, plus a derived lower bound on C_0
      that the source states only qualitatively. The honest expected sign of every
      margin is AGAINST Nagao.
  recommended_priority: high
  estimated_cost:
    wall_clock_seconds: null
    memory_gb: 1
    note: >-
      Advisory. This is log2-domain arithmetic over a few thousand cells; the cost is
      in getting the conventions right, not in computing.
  dependencies: []
  authorized_runs: 0
  inference:
    policy: research-deep
    reasoning_effort: null
