idea:
  id: IDEA-20260807-4e8da3
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    THE ONE L10 FRAMING THAT IS STILL OPEN, AND THE ONLY EXPERIMENT THAT CAN
    TEST IT: IDEA-20260807-413fcc closes the ORACLE framing of L10 but states
    explicitly that the COST-FUNCTIONAL framing survives, and
    IDEA-20260807-02b7b2 proves Cl(O) is constant within an isogeny class while
    IDEA-20260807-a3d644 proves D cannot be varied at fixed (p, N, cofactor) --
    so the ONLY design in which the class group varies with the group order held
    EXACTLY fixed is one that varies p, which no record in the corpus proposes;
    at a fixed p-band the Cohen-Lenstra fluctuation of h(D) supplies variation
    orthogonal to p, making the partial correlation of normalised rho step count
    with Cl(D) structure a measurable quantity with a stated detection floor
    rather than an assumed zero
  class: control

  claim: >-
    (A) THE EXACT GAP, QUOTED FROM THE RECORD THAT LEFT IT. IDEA-20260807-413fcc
    section (F) states, of its own closure: "It does NOT close lanes L2, L3, L10
    or L7. Those lanes do not have to route their structure through an ORACLE:
    they may instead claim that curve-level structure changes the COST of a
    non-generic algorithm run on that curve... This closure kills the ORACLE
    framing of those lanes and leaves their COST-FUNCTIONAL framing entirely
    intact." For L10 the cost-functional framing has a single natural content:
    does any statistic of Cl(O) = Cl(t^2 - 4p) predict the cost of solving the
    ECDLP on E? Fifteen proposals cite RQ-CLGP-b99df5 and not one measures it.

    (B) WHY THE OBVIOUS DESIGNS ARE ALL BLOCKED, WHICH IS WHY THIS IS NOT AN
    OVERSIGHT.
      (B1) WITHIN a class: blocked by IDEA-20260807-02b7b2. Every curve in an
           F_p-isogeny class shares t, hence D = t^2 - 4p, hence O and Cl(O).
           The class-group statistic has provably ZERO within-class variance, so
           a within-class design has zero explanatory variable and cannot test
           anything. This is a theorem, not a difficulty.
      (B2) ACROSS classes at fixed p: blocked by IDEA-20260807-a3d644 section
           (A), which derives from T4 that fixing p, N and the cofactor fixes
           #E, hence t, hence D. Two curves over the same p with the same group
           order have the same discriminant. So D cannot be varied at fixed p
           with N held exactly fixed.
      (B3) ACROSS classes at fixed p with the cofactor allowed to differ: this
           is a3d644's NULL-1 and it varies N (through the cofactor), which is
           exactly the confounder -- attack cost depends on N first and on
           everything else second, so a design that lets N move cannot isolate
           Cl(D).
    THE ESCAPE THAT NOBODY HAS TAKEN: vary p. Fix the prime subgroup order N
    exactly and the cofactor c exactly, and let p range. Then #E = cN is fixed,
    t = p + 1 - cN moves with p, D = t^2 - 4p moves with p, and Cl(D) moves.
    a3d644's obstruction is an obstruction only to holding p fixed; it says
    nothing about this design, and no record in the corpus proposes it.

    (C) WHY VARYING p DOES NOT JUST MAKE h A PROXY FOR p, WHICH IS THE OBVIOUS
    OBJECTION AND IS ANSWERABLE. The concern: h(D) ~ sqrt(|D|) ~ sqrt(p), so
    across a wide p range h merely tracks p. Two answers, and both are part of
    the design.
      (C1) THE METRIC IS p-FREE. The measured quantity is the rho STEP COUNT
           divided by sqrt(N), not wall time. Step count for Pollard rho with
           distinguished points on a cyclic group of order N is a function of N
           and of the walk, and is INDEPENDENT of p at fixed N. So the response
           variable has no direct p-dependence to confound with.
      (C2) h HAS VARIATION ORTHOGONAL TO p. By the class number formula
           h(D) = sqrt(|D|) L(1, chi_D) / pi (up to the unit factor), so within
           a NARROW p band, |D| is nearly constant and h varies by the full
           Cohen-Lenstra-scale fluctuation of L(1, chi_D) -- a factor whose
           spread is not small. The design therefore restricts to narrow p bands
           and regresses within band, so the explanatory variable is the residual
           log h - (1/2) log|D|, which is by construction orthogonal to p.
    THIS IS THE WHOLE REASON THE EXPERIMENT IS WELL POSED, and heuristic H2
    below makes the required spread a pre-registered, falsifiable quantity: if
    the residual spread is too small, the design is UNDERPOWERED and the run is
    reported as attempted_and_inconclusive, never as a null.

    (D) THE CLAIM, FALSIFIABLE IN BOTH DIRECTIONS. Let S be the rho step count
    to solve a random ECDLP instance in the order-N subgroup, and let
    X = (log h(D) residual, 2-rank of Cl(D), number of invariant factors,
    log exponent(Cl(D)), the genus-character vector's Hamming weight). CLAIM:
    with N and the cofactor held exactly fixed and p restricted to one band, the
    partial correlation of E[S]/sqrt(N) with every coordinate of X is zero, to
    within a detection floor of about 2/sqrt(M) for M curves.
      OUTCOME 1 (predicted): all partial correlations inside the floor, the
        permutation null is not cleared, and the planted positive control IS
        detected. Reading: the class-group cost-functional framing of L10 is
        closed by MEASUREMENT with a stated floor, which is what
        docs/inventor-protocol.md section 4 asks for and what completion
        criterion C1 of GOAL-ENDO-001 requires for this lane. This is the
        first executed measurement in the lane rather than the sixteenth
        argument.
      OUTCOME 2: a partial correlation outside the floor that (i) clears the
        stratified permutation null, (ii) survives re-randomisation of the rho
        walk function, and (iii) reproduces on an independent curve sample.
        Reading: the first non-generic class-group signal in the campaign.
        Pause condition P3 of GOAL-ENDO-001 fires and no record states an
        excess before an independent review-adversarial session.
      OUTCOME 3: H2 fails -- the residual spread in h is too small at feasible
        toy scale. Reading: attempted_and_inconclusive. The design is sound but
        the instrument has no power at this scale, and saying so is the honest
        deliverable rather than reporting Outcome 1.
    Three distinguishable outcomes with different meanings, defined before the
    run, which is the quality bar this record is written against.

    (E) WHAT THIS RECORD DOES NOT CLAIM. It does not claim a bridge, a
    reduction, a speedup, or an exponent. It does not contradict
    IDEA-20260807-bbdcf3's OBS-5 (which kills homomorphic bridges by counting)
    or IDEA-20260807-5d7606's constancy obstruction; those close the REDUCTION
    question and this record does not reopen it. A cost correlation is not a
    congruence and would not by itself be an attack -- bbdcf3's condition (C3)
    says exactly that. What Outcome 2 would establish is that a curve-level
    class-group statistic predicts attack cost, which is a claim about a cost
    functional and is precisely the thing 413fcc(F) declined to close.

  resource_label: >-
    R3 (End(E) as a ring: the class group of O as a finite abelian group, its
    order and its invariant factors). The measurement consumes the structure of
    Cl(D) and the rho step count; it uses no oracle and no endomorphism applied
    to any point, so H-ENDO-001 does not bite.
  admissibility: admissible
  admissibility_argument: >-
    Admissible, and admissible for a specific reason that must not be blurred:
    this is NOT an oracle proposal. IDEA-20260807-413fcc closes oracles whose
    signature takes no group handle; a claim that an algorithm's COST varies with
    public curve data is not an oracle at all and is explicitly outside that
    closure by its own section (F). The proposal is also not blocked by
    KN-FIND-b7e091's generic-group closure, because a curve-dependent cost is not
    a query advantage. If Outcome 2 occurred, the resulting oracle class WOULD
    have to be passed through RQ-GGMB-6eaabc per completion criterion C3 before
    any interpretation; that routing is pre-committed here.

  discriminated_from:
    - >-
      IDEA-20260807-02b7b2 proves Cl(O) is constant within a crater and derives
      zero within-class variance for functionals of (O, pi, n). This record
      AGREES and uses that theorem as the reason a within-class design is
      impossible; it then goes where 02b7b2 does not, to the across-class
      direction, which that record does not address at all.
    - >-
      IDEA-20260807-a3d644 (L3 null battery) proves matched (p, N, cofactor)
      across different D_0 is impossible by T4 and builds its nulls by letting
      the cofactor differ at fixed p. This record takes the OTHER escape from
      the same obstruction -- vary p, hold N and the cofactor exactly -- which
      a3d644 does not consider. It also targets Cl(D) STRUCTURE (invariant
      factors, 2-rank, exponent) rather than |D_0| smallness, which is a
      different explanatory variable on a different lane.
    - >-
      IDEA-20260807-bbdcf3 STEP 4 enumerates toy curves and reports the
      distribution of h/N, log2 h/log2 N and gcd(N, h). That is a DESCRIPTIVE
      distribution of the class number. This record REGRESSES an attack cost on
      class-group structure with N held fixed, a permutation null, a planted
      positive control and a stated detection floor. bbdcf3 measures the
      explanatory variable; it never measures a response.
    - >-
      IDEA-20260807-cb672c builds a mutual-information instrument measuring bits
      of k carried by class-group statistics of an INSTANCE, with nulls that
      resample k. This record's response variable is a COST, not an information
      quantity, and its explanatory variable is a property of the CURVE, not of
      the instance; the two nulls are different (cb672c resamples k with the
      curve fixed, this record permutes the class-group label across curves at
      matched N). They are complementary and neither subsumes the other.
    - >-
      IDEA-20260807-34754f (the campaign's isogeny-class null, stratified on N
      and the twist pairing) is an instrument-design record for WITHIN-class
      variance. Its stratification advice is adopted here; its design is not
      reused, because within-class variance of a class-group statistic is
      provably zero by 02b7b2 and there is nothing for it to measure.
    - >-
      IDEA-20260805-38aebb tracks h(f^2 D_K) and the short-endomorphism count as
      functions of the conductor. That is a within-class, across-volcano-level
      question about O. This record holds the level structure as a stratification
      variable and varies the CLASS, which 38aebb does not do.

  object_first_candidate:
    tracked_object: >-
      THE ISOMORPHISM TYPE OF Cl(t^2 - 4p) AS A FINITE ABELIAN GROUP -- its
      invariant factor decomposition, not merely its order -- tracked across an
      ensemble of curves at EXACTLY matched prime subgroup order N and matched
      cofactor, with p allowed to vary within a band.
    lossiness: >-
      LOSSY, and the loss is the point. The projection E |-> Cl(t^2 - 4p)
      discards the curve equation, every point, the generator P, the target Q,
      the secret k, the j-invariant, the specific position in the isogeny class,
      and even the trace t itself (many t give isomorphic class groups). It
      retains a finite abelian group of order about sqrt(p). It is emphatically
      not a change of coordinates: the fibre over a given isomorphism type
      contains many curves over many primes, and the reconstruction map does not
      exist. What is discarded is discarded COMPATIBLY with the operation that
      matters for this lane -- the F_p-isogeny -- because an isogeny preserves t
      exactly, hence preserves D, hence acts as the IDENTITY on the retained
      part. That is the strongest possible compatibility (deterministic, indeed
      constant, propagation) and it is simultaneously the object's weakness: an
      object that is constant under the target's characteristic operation cannot
      distinguish anything within a class, which is (B1) and which is why the
      design must go across classes.
    propagation: >-
      One-step propagation under an ell-isogeny: the class group is UNCHANGED on
      the crater (D is a class invariant) and changes by the explicit conductor
      formula h(O) = h(O_K) f prod_{l|f}(1 - (D_K/l)/l) / [O_K^*:O^*] on a
      descending step, with the invariant-factor structure changing by the
      corresponding exact sequence. Both are computable in poly(log p, ell), so
      one-step propagation is defined and measurable -- the concrete-testability
      axis is satisfied. Propagation across the ensemble (the direction this
      design actually uses) is not a walk at all but a resampling of p at fixed
      (N, c), and that step is also explicitly defined.
    survival_score: >-
      Survives every F_p-isogeny trivially (it is invariant), survives volcano
      descent with a computable correction, and survives the automorphism and
      isomorphism gauge entirely (u^4 a, u^6 b changes nothing). It DISSOLVES
      as an explanatory variable exactly where its variation dies: within a
      class it is constant, and at fixed p with N and c fixed it is determined.
      The object therefore has a sharp, computable domain of usefulness, and
      naming that domain -- the across-p ensemble -- is this record's
      contribution.

  mechanism: >-
    STEP 1 (zero compute, HARD GATE). Write out (B1)-(B3) and confirm from the
    cited records that the across-p design is the unique unblocked one. If a
    reviewer exhibits a fourth design that varies Cl(D) at fixed N without
    varying p, this record's premise is wrong and it should be superseded rather
    than run.

    STEP 2 (minutes). ENSEMBLE CONSTRUCTION. Fix a prime N (toy scale, roughly
    2^16 to 2^20) and a cofactor c in a small set. For each t in a range with
    p := cN + t - 1 prime, t != 0, and t^2 < 4p (ordinary), record the candidate
    (p, t). For each, find a curve E/F_p with #E(F_p) = cN exactly by sampling
    random (a, b) and computing the order by BSGS/Schoof until the target order
    is hit; the expected number of trials is O(sqrt(p)/H(D)) and is small at toy
    scale. Record the number of trials and the total construction cost, since
    an ensemble built by rejection sampling is a structurally selected sample
    and every statistic on it is conditional on that selection.

    STEP 3 (minutes). EXPLANATORY VARIABLES. For each instance compute
    D = t^2 - 4p, the conductor f, the order O, and Cl(D) as the form class
    group: h(D) by counting primitive reduced binary quadratic forms, the
    invariant factors by the standard structure computation on that group, the
    2-rank from genus theory (number of prime discriminant factors of D), and
    the exponent. Also record the volcano level, which is a stratification
    variable and not an explanatory one.

    STEP 4 (hours). RESPONSE VARIABLE. For each curve, solve R independent
    ECDLP instances (fresh random k, fresh random walk seed) in the order-N
    subgroup by Pollard rho with distinguished points, recording the step count
    S. Run BSGS as the mandatory matched control on the same instances. Every
    claimed solve carries a certificate ([k]P = Q) re-verified independently of
    the solver per docs/claims-and-verification.md. The per-curve statistic is
    the mean of S/sqrt(N) over the R instances, with its standard error.

    STEP 5 (minutes). REGRESSION AND FLOOR. Within each p band, regress the
    per-curve mean of S/sqrt(N) on each coordinate of X, controlling for volcano
    level and construction-trial count. Report partial correlations with
    confidence intervals and state the detection floor 2/sqrt(M) explicitly
    BEFORE reading the result.

    STEP 6 (minutes, BLOCKING NULLS). (a) STRATIFIED PERMUTATION NULL: permute
    the class-group label X across curves within a p band and within a volcano
    level, recompute every partial correlation, and report the observed value's
    quantile in the permutation distribution. (b) PLANTED POSITIVE CONTROL:
    inject a synthetic response S' = S * (1 + beta * X_1_normalised) for
    beta in {0, 0.02, 0.05, 0.1, 0.2} and confirm the pipeline recovers beta and
    that its recovered value DECAYS TO ZERO as beta -> 0. A pipeline that
    reports a nonzero effect at beta = 0 is leaking and its run set is INVALID.
    (c) WALK RE-RANDOMISATION DECAY TEST: re-run with a different rho walk
    partition function. A correlation caused by the walk decays; a correlation
    caused by the curve does not. This is the canonical artifact test of
    docs/inventor-protocol.md section 3 applied in its correct direction.

    STEP 7 (zero compute). Write the outcome per (D), including the detection
    floor, the H2 power check, and -- if Outcome 1 -- a closure at the section 4
    standard with forward guidance naming what a cost-functional framing could
    still mean for L10 (non-mean statistics of S; the tail of the collision-time
    distribution; multi-instance amortised cost, which is lane L13).

  novelty_status: unverified
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/: all fifteen proposals citing
      RQ-CLGP-b99df5 read by title and claim; "class number|h\(O\)|h\(D\)|
      Cl\(O\) structure|invariant factor|2-rank|genus theory" across ledger/;
      "(h\(D\)|class number).{0,120}(cost|rho|predict|correlat)" multiline
      across ledger/proposals/; full reads of IDEA-20260807-bbdcf3,
      IDEA-20260807-413fcc (sections E and F), IDEA-20260807-a3d644 (section A),
      IDEA-20260807-02b7b2, IDEA-20260807-34754f, RQ-CLGP-b99df5,
      DECOMPOSITION.md L10.
    results: >-
      No record regresses an attack cost on a class-group statistic. No record
      proposes an across-p, fixed-N ensemble; every across-class design in the
      corpus fixes p and lets the cofactor vary, which a3d644 shows moves N.
      413fcc(F) names the cost-functional framing of L10 as explicitly NOT
      closed. bbdcf3 STEP 4 measures the class-number distribution but no
      response variable. The gap is real and is stated by the corpus itself.
    external_check: >-
      NOT PERFORMED. Web search was unavailable in this session. The design
      combines standard components (form class group computation; Pollard rho
      with distinguished points; stratified permutation testing) and claims no
      external novelty; if a published study correlates ECDLP cost with class
      group structure, a citation would supersede this record and would be a
      better deliverable than running it.
    verdict: >-
      UNVERIFIED, because no external check was performed. Internally the design
      is new to this corpus and its premise -- that this is the unique unblocked
      design -- is derived from three committed records rather than asserted.

  null_object_control: >-
    MANDATORY, BLOCKING, AND TWO-DIRECTIONAL per RQ-INSTR-f8faa0 and completion
    criterion C4.
    NEGATIVE DIRECTION: the stratified permutation null of STEP 6(a). It must be
    stratified on the p band and the volcano level, following
    IDEA-20260807-34754f's finding that a FREE permutation reports spurious
    variance reduction for quantities that are deterministic functions of N and
    the torsion structure. A free permutation is not acceptable here.
    POSITIVE DIRECTION: the planted-beta family of STEP 6(b), which the pipeline
    must detect at beta = 0.1 and must report as zero at beta = 0.
    DECAY PARAMETER, STATED IN THE CORRECT DIRECTION: beta. The recovered effect
    must decay to zero as beta -> 0. A recovered effect that does NOT decay is
    the canonical artifact tell and voids every number the instrument produced.
    SECOND DECAY PARAMETER: R, the number of independent DLP instances per curve.
    A correlation driven by per-curve walk noise must shrink as 1/sqrt(R); one
    that is flat in R is a genuine curve-level effect. Reporting the R-dependence
    is required, not optional.

  assumptions:
    - >-
      E/F_p ordinary with #E(F_p) = cN, N prime, c small and fixed; Cl(O) acts
      freely and transitively on the F_p-isomorphism classes with End_{F_p} = O
      (Deuring/Waterhouse/Kohel). Verified at toy scale by orbit counting.
    - >-
      Pollard rho step count on a cyclic group of prime order N is independent of
      p at fixed N. This is what makes the response variable p-free and is
      checkable directly by comparing step-count distributions across p at fixed
      N -- a check the pipeline must run before the regression.
    - >-
      The form class group computation returns Cl(D) correctly. Validated
      against the analytic class number formula and against the exact sequence
      relating Cl(O) to Cl(O_K) via the conductor.
    - >-
      Curve construction by rejection sampling produces a sample that is uniform
      over the isogeny class of trace t but is NOT uniform over any natural
      population of curves. Every statistic is conditional on the construction
      procedure and must say so.

  proof_search_map:
    bottleneck: >-
      Statistical power, not mathematics. The design's validity rests entirely on
      whether h(D) retains enough variation orthogonal to p within a feasible
      band at toy scale (H2). If it does not, no amount of compute produces a
      usable null. That is the step whose resolution decides whether the
      experiment means anything, and it is checkable before the expensive
      response-variable stage.
    baseline_embedding:
      parameter_slice: >-
        beta = 0 on the planted family, and the degenerate slice where every
        curve in the ensemble shares one class group. In both the regression must
        return partial correlations statistically indistinguishable from zero and
        the permutation null must be uninformative by construction. If the
        pipeline reports an effect in either slice, it is broken.
      reproduction_check: >-
        Frozen fixture: a single curve, R = 200 DLP instances, mean S/sqrt(N)
        compared against the classical 0.886 constant (KN-TECH-001, KN-TECH-006)
        within 15 percent, and the empirical collision-time CDF compared against
        exp(-x^2/2). This validates the response variable before it is used as
        one, and it is the same check H1's validation plan performs.
    observation_collision:
      observable: >-
        The pair (isomorphism type of Cl(D), mean S/sqrt(N)).
      distinct_preimage_search: >-
        REQUIRED, AND EXPECTED TO SUCCEED, which is why Outcome 2 would be a
        correlation and never a reduction. Two curves over different primes with
        the same N can share a class group isomorphism type exactly while having
        entirely unrelated secrets k -- indeed the observable is independent of k
        by construction, which is the whole content of IDEA-20260807-413fcc(B).
        So the observable's fibres are large and it can never identify k. This
        collision is a direct falsifier of any reading of Outcome 2 as an attack,
        and it is stated here so that no downstream summary can make that
        reading.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialise the confounded comparison "curves with different class
          groups" by fixing N and c exactly and banding p, so the residual
          log h - (1/2) log|D| becomes a resource measure orthogonal to the
          dominant cost driver; charges are then added only over the
          proved-disjoint blocks (p bands x volcano levels).
        predicted_gain: >-
          Not a speedup. The gain is identifiability: it converts an
          uninterpretable across-class comparison into one where a null has a
          stated detection floor. Predicted measured effect: zero.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (mean S/sqrt(N)) fixed and vary the forgotten
          structure (Cl(D)) -- i.e. exhibit pairs of curves with matched cost and
          maximally different class groups. If such pairs are abundant, that is
          direct evidence for Outcome 1 and is cheaper than the full regression.
        predicted_gain: >-
          A cheap pre-check that can reach Outcome 1 on a small sample before the
          full ensemble is built.
    quantifier_order: >-
      WHAT IS TESTED: FORALL N prime and c in the tested set, FORALL p bands in
      the tested range, FORALL coordinates X_i of the class-group statistic, the
      partial correlation of E_k[S]/sqrt(N) with X_i, controlling for volcano
      level, is zero to within the stated floor. The quantifiers are all
      universal over a FINITE, ENUMERATED tested set -- there is no existential
      and no asymptotic claim, which is what caps this at claim tier toy.
      WHAT IS NOT CLAIMED: FORALL p (asymptotically), or FORALL N. A null here
      closes the tested scope only (AGENTS.md rule 6). In particular the tested
      N are about 2^16-2^20 and any statement about crypto-sized N is an
      extrapolation and must be labelled one.
      WHAT OUTCOME 2 WOULD ASSERT: THERE EXISTS a coordinate X_i and a tested
      band with a correlation above the floor surviving all three controls. That
      is an existential over a finite tested set -- a measurement, not a theorem,
      and not a reduction.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the tested (N, c, p-band) grid, no class-group statistic predicts
        mean normalised rho step count above a partial correlation of about
        2/sqrt(M)." It can NEVER certify that no cost functional depends on
        Cl(D) (only the mean of one functional was measured), that the ECDLP is
        hard, or anything about crypto-sized parameters. It also cannot certify
        anything about non-mean statistics -- the tail of the collision-time
        distribution is untested and is named in the forward guidance.
      nearby_object_control: >-
        THE PLANTED-beta FAMILY, where the desired conclusion (no dependence)
        FAILS by construction. If the analysis pipeline also reports "no
        dependence" at beta = 0.1, it is proving too much and has no power; that
        is a pipeline failure and is BLOCKING. A second nearby object: the
        cofactor c itself, which genuinely does affect the cost of the full-group
        DLP (through Pohlig-Hellman) while not affecting the order-N subgroup
        cost -- the pipeline must show the expected dependence on c for the
        full-group solve and no dependence for the subgroup solve, demonstrating
        that it can tell a real curve-level effect from none.
    proof_obligations:
      - claim: >-
          Within an F_p-isogeny class, Cl(D) is constant.
        responsibility: baseline
      - claim: >-
          At fixed p, N and cofactor, D is determined; so Cl(D) cannot be varied.
        responsibility: feasibility
      - claim: >-
          At fixed N and cofactor with p varying, D varies and Cl(D) varies.
        responsibility: feasibility
      - claim: >-
          Within a narrow p band, log h - (1/2) log|D| retains variance bounded
          below.
        responsibility: success_probability
      - claim: >-
          Rho step count is independent of p at fixed N.
        responsibility: correctness
      - claim: >-
          The detection floor on a partial correlation from M curves is about
          2/sqrt(M).
        responsibility: size
      - claim: >-
          The planted-beta control is recovered at beta = 0.1 and returns zero at
          beta = 0.
        responsibility: soundness

  predictions:
    - metric: >-
        partial correlation of mean rho step count / sqrt(N) with the residual
        log h(D), controlling for volcano level, within a p band at fixed (N, c)
      direction: different
      minimum_effect: >-
        Predicted |r| below the detection floor 2/sqrt(M); with a target M = 200
        curves the floor is about 0.14. An |r| above 0.14 that clears the
        stratified permutation null at p < 0.01 is Outcome 2 and triggers P3.
    - metric: >-
        same, for the 2-rank of Cl(D) and for the number of invariant factors
      direction: different
      minimum_effect: >-
        Predicted below floor. These are reported separately from h because the
        2-rank is computable in polynomial time from the factorisation of D
        while h is not, so a signal on the 2-rank alone would be far more
        interesting than a signal on h and must not be pooled with it.
    - metric: >-
        recovered beta on the planted family, at beta in {0, 0.02, 0.05, 0.1, 0.2}
      direction: higher
      minimum_effect: >-
        Monotone recovery with recovered beta within 30 percent of injected beta
        at beta >= 0.05, and recovered beta statistically zero at beta = 0. Any
        other profile means the instrument is not calibrated and every null it
        reports is void.
    - metric: >-
        standard deviation of the residual log h - (1/2) log|D| within a p band
      direction: higher
      minimum_effect: >-
        At least 0.35 in natural log. Below that the design is underpowered
        (Outcome 3) and the run is reported as attempted_and_inconclusive rather
        than as a null. This threshold is pre-registered precisely so that a weak
        instrument cannot be reported as a strong negative.
    - metric: >-
        R-dependence of any observed correlation
      direction: lower
      minimum_effect: >-
        A correlation from walk noise must fall as 1/sqrt(R) between R = 25 and
        R = 200. One that is flat in R is a candidate curve-level effect. This is
        the discriminator between the two competing explanations of any nonzero
        reading and is the reason the experiment has a possible negative outcome
        in both directions.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): confirm the (B1)-(B3) blocking argument
      and the uniqueness of the across-p design.
      STAGE 1 (minutes, POWER GATE): build a small ensemble at one N and one c,
      compute h(D) and the residual spread, and check it against the 0.35
      threshold. IF IT FAILS, STOP AND REPORT OUTCOME 3. This is the cheapest
      gate and it comes before any DLP is solved.
      STAGE 2 (minutes): response-variable validation -- one curve, R = 200,
      mean S/sqrt(N) against 0.886 and the collision-time CDF against
      exp(-x^2/2); plus the p-independence check at fixed N.
      STAGE 3 (minutes): the planted-beta calibration at five beta values.
      STAGE 4 (hours): the full ensemble, M target 200 curves, R = 200 per curve,
      with BSGS as the matched control and certificates re-verified independently.
      STAGE 5 (minutes): regression, stratified permutation null, R-decay and
      walk-re-randomisation checks.
      STAGE 6 (zero compute): the write-up per (D), with the floor stated.
    controls:
      - >-
        Pollard rho with distinguished points and BSGS on every instance, as
        mandated by RQ-CLGP-b99df5's constraints
      - >-
        stratified permutation null (p band x volcano level), NOT a free
        permutation, per IDEA-20260807-34754f
      - >-
        planted-beta positive control with a decay-to-zero requirement -- BLOCKING
      - >-
        cofactor-dependence nearby-object control: dependence must appear for the
        full-group solve and must not for the order-N subgroup solve
      - >-
        walk re-randomisation with a second partition function
      - >-
        R-decay check between R = 25 and R = 200
      - >-
        independent certificate verification of every claimed solve
    required_metrics:
      - per curve (p, t, D, f, level, h, invariant factors, 2-rank, exponent, c, N)
      - per curve mean and standard error of S/sqrt(N) over R instances, plus the
        BSGS control operation count
      - partial correlations with confidence intervals, and the stated detection
        floor 2/sqrt(M)
      - permutation-null quantile per correlation
      - recovered beta versus injected beta, with the decay curve
      - residual spread of log h - (1/2) log|D| per band
      - construction trial counts per curve (the selection record)

  falsification_conditions:
    - >-
      A partial correlation above the floor that clears the stratified
      permutation null, is flat in R, and survives walk re-randomisation. The
      predicted null is falsified. GOAL-ENDO-001 pause condition P3 fires: work
      pauses for an independent review-adversarial session before any record
      states the excess, and the resulting oracle/cost class is routed through
      RQ-GGMB-6eaabc per criterion C3 before any interpretation.
    - >-
      The planted-beta control is not recovered at beta = 0.1, or a nonzero
      effect is reported at beta = 0. The run set is INVALID (not negative) and
      no null from it may be cited (AGENTS.md rule 5, criterion C4).
    - >-
      The residual spread of log h is below 0.35. Outcome 3: the design is sound
      but underpowered at toy scale; report attempted_and_inconclusive, and hand
      forward the exact scale at which the spread would suffice.
    - >-
      Rho step count is found to depend on p at fixed N. The response variable is
      not p-free, (C1) fails, and the whole design is confounded; the record must
      be superseded with a different response variable.
    - >-
      A reviewer exhibits a design that varies Cl(D) at fixed (N, cofactor, p).
      The premise in (B) is wrong and the uniqueness claim must be withdrawn,
      though the experiment itself would remain valid.

  confounders:
    - >-
      h AS A PROXY FOR p. The dominant confounder, addressed by (C1) and (C2):
      p-free response variable, narrow bands, and the residual as the explanatory
      variable. If any of the three is dropped, the measurement is meaningless.
    - >-
      VOLCANO LEVEL. Curves at different levels in the same class have different
      O and different h. Level is a stratification variable throughout and is
      never pooled.
    - >-
      SELECTION BY REJECTION SAMPLING. Curves are found by sampling until the
      target order is hit, so the ensemble is conditional on that search. Curves
      in classes with large H(D) are found faster, which correlates the
      construction cost with h -- and construction cost must therefore be
      recorded and controlled for, or it enters the regression as a back door.
    - >-
      COHEN-LENSTRA NOISE AT SMALL |D|. h(D) fluctuates heavily at toy sizes.
      This is what supplies the design's power (C2) and simultaneously what makes
      any single instance uninformative. Report distributions, never instances.
    - >-
      MULTIPLE COMPARISONS. Five explanatory coordinates times several bands
      times two response statistics is enough tests that one will cross 0.05 by
      chance. The permutation null must be computed on the MAXIMUM statistic
      across all tests, not per test, and the number of tests must be
      pre-registered.
    - >-
      RHO WALK QUALITY. A poorly mixing partition function inflates step counts
      in a way that can correlate with incidental curve properties. The walk
      re-randomisation control exists for exactly this and is not optional.

  interpretation_limits:
    - >-
      A cost correlation is NOT a reduction and NOT a congruence on k. Even
      Outcome 2 would leave IDEA-20260807-bbdcf3's OBS-5 and
      IDEA-20260807-5d7606's constancy obstruction completely intact. Any summary
      that reads Outcome 2 as a bridge is misreporting this record.
    - >-
      Toy scale throughout: N about 2^16-2^20, p up to about 2^24. Claim tier
      capped at toy per GOAL-ENDO-001. Nothing here is crypto-scale validation
      (AGENTS.md rule 7), and the null closes only the tested (N, c, p-band)
      grid (AGENTS.md rule 6).
    - >-
      Only the MEAN of one cost functional is tested. Tail statistics of the
      collision time, memory-bound variants, multi-instance amortised cost (lane
      L13), and index-calculus solving degree are all untested and are named in
      the forward guidance rather than silently covered.
    - >-
      Timeouts, crashes, failed curve constructions and failed class-group
      computations are infrastructure outcomes and are never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        For Pollard rho with distinguished points on a cyclic group of prime
        order N with a well-mixing partition function, the step count T satisfies
        E[T] = 0.886 sqrt(N) (1 + o(1)) and T/sqrt(N) converges in distribution
        to the birthday collision law, P(T/sqrt(N) > x) -> exp(-x^2/2), with the
        law independent of p at fixed N.
      rigorous_support: >-
        Rigorous side: the birthday bound gives collision within O(sqrt(N)) steps
        for a uniformly random map, and the distinguished-point technique changes
        the constant and the memory, not the exponent. Classical distribution
        statement imitated: the birthday-problem collision-time law for a random
        function on N points, whose limiting distribution is exp(-x^2/2).
        Recorded in the corpus as KN-TECH-001 and KN-TECH-006.
      validation_plan: >-
        One curve, R = 200 independent (k, seed) pairs; compare the empirical
        CDF of T/sqrt(N) against exp(-x^2/2) by KS; compare the mean against
        0.886 within 15 percent; tail check on the slowest 5 percent of solves
        against the predicted exponential tail. Repeat at three values of p with
        N held fixed to verify p-independence directly. LABELLED TOY SCALE: this
        validates the instrument at N ~ 2^18, not the constant at N ~ 2^256.
      falsification_condition: >-
        KS rejection against exp(-x^2/2) at p < 0.01, or a mean outside
        [0.75, 1.02] times sqrt(N), or a measured dependence on p at fixed N.
        Any of these means the response variable is not what the design assumes
        and the experiment must not proceed to STAGE 4.
    - id: H2
      statement: >-
        Over the ensemble at fixed (N, c) with p restricted to a band of relative
        width at most 2, the residual R_h := log h(D) - (1/2) log|D| has standard
        deviation at least 0.35 and is uncorrelated with log p at |r| below 0.2.
        Formally: h(D) = sqrt(|D|) L(1, chi_D) / pi up to the unit factor, so
        R_h = log L(1, chi_D) + O(1), and the claim is that log L(1, chi_D) has
        non-degenerate spread across the ensemble.
      rigorous_support: >-
        Rigorous side: the analytic class number formula is exact, and
        L(1, chi_D) = O(log|D|) unconditionally while Siegel gives
        L(1, chi_D) >> |D|^{-eps} ineffectively -- so R_h is bounded in a range
        of width O(log log|D|) but is not pinned. Classical distribution
        statement imitated: the Cohen-Lenstra heuristics and the known
        distribution of L(1, chi_D) over fundamental discriminants, which has
        positive variance and no mass at zero.
      validation_plan: >-
        Compute h(D) exactly for every ensemble member by counting primitive
        reduced binary quadratic forms; plot the empirical distribution of R_h
        per band; compare against the distribution of log L(1, chi_D) obtained by
        direct truncated Euler product evaluation on the same discriminants; tail
        checks on the largest and smallest R_h against the Euler-product
        prediction. LABELLED TOY SCALE -- |D| up to about 2^26 is not |D| ~ 2^256
        and the comparison validates the instrument and the design's power, not
        any asymptotic.
      falsification_condition: >-
        Standard deviation of R_h below 0.35 within every feasible band, or
        |corr(R_h, log p)| above 0.2. Either means the explanatory variable is
        degenerate or is a p-proxy; the run is reported as Outcome 3,
        attempted_and_inconclusive, and must NOT be written up as a null.

  reachability_gate: >-
    NOT BINDING, and stated rather than omitted. T5 prices reaching a SPECIFIED
    curve within an isogeny class. This design never moves within a class -- it
    resamples across classes by choosing p, which costs one primality test and
    one rejection-sampling curve construction, both polynomial. The reachability
    question does not arise because the ensemble is CONSTRUCTED, not navigated.
    Correspondingly, nothing here bears on IDEA-20260807-c36472's Otilde(p^{1/4})
    transport accounting in either direction.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT CLAIMED, and the predicted outcome is that none is
      available by this route. The measured quantity is the rho step count
      itself; the predicted result is 0.886 sqrt(N) (1 + o(1)) uniformly across
      every class-group stratum, i.e. exponent 1/2 unchanged. IF Outcome 2
      occurred with a partial correlation r, the implied cost effect would be a
      CONSTANT-FACTOR shift of order r on the mean step count, NOT an exponent
      move -- a correlation of 0.2 on a normalised cost is a few percent of
      constant, which docs/target-result-profile.md classifies as explicitly not
      target-class. This is stated up front so that no positive reading of
      Outcome 2 can be inflated into an exponent claim.
    memory_exponent: >-
      Rho with distinguished points: O(1) working memory per solve (the
      distinguished-point table is O(polylog) at the toy sizes used). BSGS
      control: sqrt(N) memory. The experiment's own storage is O(M * R) scalars,
      negligible.
    best_known: >-
      Prime-field ECDLP: 0.886 sqrt(N) group operations at O(1) memory
      (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)/sqrt(N); automorphism-
      discounted rho at 0.886 sqrt(N/|Aut|) with |Aut| <= 6 (KN-TECH-018), which
      is the mandated control on CM curves. This proposal matches, and does not
      beat, all three by construction.
    hidden_overhead: >-
      No asymptotic claim is made, so nothing hides in an o(1). What DOES hide,
      and is disclosed: computing Cl(D) exactly by form counting is O(|D|^{1/2+
      eps}) and is what caps p at about 2^26; at crypto scale it would be
      L_{|D|}(1/2) by Hafner-McCurley, i.e. subexponential, so this measurement
      is not merely untested at crypto scale, it is not RUNNABLE there in the
      form specified. Any crypto-scale version would need the class group as an
      oracle, which changes the question.
    tradeoff_note: >-
      Not applicable to a claimed attack, since none is claimed. For the
      measurement: the M-versus-R budget is a genuine tradeoff -- the detection
      floor on a curve-level correlation falls as 2/sqrt(M) and does NOT improve
      with R beyond the point where per-curve standard error is small relative to
      between-curve spread. Spending budget on more curves rather than more
      instances per curve is therefore the right allocation, and the pre-
      registered split (M = 200, R = 200) is chosen with that in mind rather than
      by convenience. The DLP solves parallelise perfectly across curves.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW OF THE
    FRONTIER. As an attack this proposal mounts none, so it is dominated on time
    by parallel Pollard rho with distinguished points (0.886 sqrt(N), O(1)
    memory; KN-TECH-001, KN-TECH-006), on the time-memory frontier by BSGS
    (sqrt(N) time, sqrt(N) memory), on CM curves by automorphism-discounted rho
    (0.886 sqrt(N/|Aut|); KN-TECH-018), and on a known-interval instance by
    Pollard kangaroo (2 sqrt(W), O(1) memory). It consumes no data and no
    adaptive queries beyond its own generated instances, so it is not dominated
    on that axis -- but only because it does not use it, not because it wins
    there. If Outcome 2 occurred, the implied constant-factor effect would still
    leave every one of those rows dominating it on the exponent.
    dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against every baseline: 0.886 sqrt(N) before and after, and the
    experiment's own predicted finding is that this constant is invariant across
    every class-group stratum tested. The quantitative content is a DETECTION
    FLOOR rather than a speedup: with M = 200 curves the design can exclude
    partial correlations above about 0.14 between normalised rho cost and any of
    five class-group statistics, at fixed N and cofactor, over the tested p
    bands. The corpus currently asserts this null with no floor at all; the delta
    is "assumed zero" -> "measured zero, |r| < 0.14, at claim tier toy."

  estimated_cost:
    implementation: medium
    compute: medium

  recommended_priority: medium

  priority_justification: >-
    Explicitly NOT target-class under docs/target-result-profile.md C1-C2: the
    best realistic outcome is a constant-factor correlation, and the predicted
    outcome is nothing. It is ranked medium, not low, for two reasons that are
    about the campaign rather than about the mathematics. First, GOAL-ENDO-001
    completion criterion C1 requires for every lane either an executed,
    independently reviewed run or a closure at the inventor-protocol standard;
    L10 currently has fifteen arguments and zero executed measurements, and this
    is the only design in the corpus that can produce one for the framing 413fcc
    explicitly left open. Second, STAGE 1 is a power gate costing minutes that
    can terminate the whole line honestly before any DLP is solved. It is ranked
    below any exponent-moving candidate and should not displace one.

  honest_prior_of_survival: >-
    0.97 that the (B1)-(B3) blocking argument is correct (it is three quoted
    committed records plus T4). 0.9 that the across-p design is genuinely the
    unique unblocked one -- the residual risk is a fourth design a reviewer sees
    and I did not. 0.75 that H2's power gate passes at feasible toy scale; this
    is the dominant practical risk and is why STAGE 1 exists. 0.9 that, given
    power, the result is Outcome 1 (measured null). About 0.05 for Outcome 2, and
    that branch is the entire reason to run it. Roughly 0.2 that the honest
    verdict is Outcome 3, attempted_and_inconclusive, which is a legitimate
    deliverable and must not be laundered into a null.

