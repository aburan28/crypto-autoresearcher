  title: Required section height H(p, r) from the lattice-count heuristic
  class: measurement
  claim: |-
    Measured N(H) on E1 lattices matches the heuristic within 2x for H >= 3 lambda_1^2; the required degree d for p in {2^64, 2^128, 2^256} and r in {20, 50, 100, 300} exceeds 100 for every r <= 100 at 256 bits.
  mechanism: |-
    N(H) about V_r H^(r/2) / sqrt(det MW). Coverage of E(F_p) needs N(H) >= p, giving H about p^(2/r) * det^(1/r) * r/(2 pi e); for r = 100, 256-bit p and lambda_1^2 about 18 this is H about 650, i.e. sections of degree in the hundreds and a system with about 10^3 unknowns.
