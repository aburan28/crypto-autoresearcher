idea:
  id: IDEA-20260816-bd7f26
  question_id: RQ-MLKEM-003
  added: '2026-08-16'
  title: 'Settle KN-OPEN-026''s Q3 as an interaction term rather than a regime claim: run a two-factor
    design crossing structured versus unstructured with secret sparsity, and report whether the discount''s
    dependence on sparsity is an interaction or an offset'
  class: measurement
  claim: '(A) KN-OPEN-026''s Q3 asks whether the sparse-secret concentration in the reported structure-discount
    figures is essential or incidental, and observes that every large reported gap is in the sparse
    regime while uniform-ish secrets show a small one. That is stated as a comparison across separate
    reports. It is measurable as a single designed experiment, because sparsity is a knob. The object
    tracked here is the interaction term in a two-factor design: factor S is structure (module versus
    matched unstructured), factor H is secret Hamming weight over a grid from very sparse to full,
    and the response is the recovery observable. (B) The claim is that the essential-versus-incidental
    question is exactly the question of whether the S x H interaction is nonzero. If the discount
    is a fixed offset present at every sparsity, sparsity is incidental to it. If the discount vanishes
    as the secret fills in and is large only when the secret is sparse, the interaction is nonzero
    and sparsity is essential in the precise sense Q3 asks about. Nothing else needs to be assumed,
    and no cost model enters, because both factors are manipulated within one matched-pair generator
    and the response is exact recovery against retained ground truth. (C) The design is powered for
    the interaction, not for the main effects, which is a different and larger sample requirement,
    and the entry commits to reporting the achieved power. (D) NOT CLAIMED: no attack, no bit figure,
    no statement about FHE or ML-KEM parameter selection, no claim that the interaction measured at
    n <= 48 holds at deployed dimensions, and no assertion about what the sources KN-OPEN-026 relays
    contain. An interaction measured here is a statement about this design.'
  mechanism: 'STAGE 1. Extend the matched-pair generator so that the secret''s Hamming weight h is
    an explicit parameter: sample s uniformly from the set of vectors with exactly h nonzero coordinates
    drawn from the base secret law, and use the same s in both the structured and the unstructured
    arm of a pair. STAGE 2. For each (h, arm) cell, run progressive BKZ plus Babai to exact recovery
    and record beta* or a censoring flag. STAGE 3. Fit the response surface: model log beta* (or the
    recovery indicator, where censoring dominates) as an additive model in S and H plus an interaction
    term, and report the interaction coefficient with an interval. STAGE 4. Run the ring-deleted null
    across the entire H grid; its interaction must be zero. STAGE 5. Run the sparsity-only null: an
    unstructured instance across the H grid, which establishes that the response depends on h at all,
    since an interaction is uninterpretable if the main effect of H is absent. STAGE 6. Report the
    interaction, the two main effects, the achieved power and the censoring map. Refutation: an interaction
    interval containing zero across a well-powered H grid is a measured statement that sparsity is
    incidental at these parameters.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rilE 'module.structure|structure discount|ring structure|coefficient isometr' ledger/proposals/;
      grep -rilE 'sparse' ledger/proposals/ (via the same structure sweep); grep -rilE 'dual.?attack|dual.?sieve'
      ledger/proposals/. Read KN-OPEN-026 in full, in particular Q3. Read titles and claim heads of
      IDEA-20260805-530869, IDEA-20260808-dd4d30, IDEA-20260813-28cf9c.
    results: No record found in ledger/proposals/ runs a factorial design over structure and sparsity,
      and no record found reports an interaction term of any kind in the lattice lane. IDEA-20260805-530869
      supplies the matched generator but has one secret law. IDEA-20260808-dd4d30 contrasts FrodoKEM's
      matrix secret with ML-KEM's ring structure on the rank axis, with no sparsity knob. IDEA-20260813-28cf9c
      selects ML-KEM keys with a rank-deficient SampleNTT matrix and prices the resulting equations
      as lattice hints - a conditioning-on-key-property design, not a factorial one. KN-OPEN-026 poses
      Q3 and proposes to answer it by reading papers, explicitly deferring experiment.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Claimed new relative to this
      repository: posing the essential-versus-incidental question as an interaction term in a designed
      two-factor experiment with both factors manipulated inside one generator, and powering the design
      for the interaction rather than the main effects. Assembled from known parts: the matched-pair
      generator of IDEA-20260805-530869, the recovery observable used elsewhere in this batch, sparse
      secret sampling, and ordinary factorial analysis.'
  object_first_candidate:
    tracked_object: The response surface R(S, H) over the two-factor grid, where S is structure and
      H is secret Hamming weight, with the response being beta* or the recovery indicator per cell;
      the derived object is the interaction coefficient.
    lossiness: 'Genuinely lossy. The full state per cell is every reduced basis at every blocksize
      for every seed; the response surface retains one number per cell and discards all of it. The
      discard is compatible with the operation of interest because the question - is the discount''s
      size conditional on sparsity - is a question about a two-dimensional surface''s shape, and the
      shape is determined by the cell responses alone. What is discarded and matters: the mechanism
      by which sparsity helps, since a sparse secret aids both hybrid guessing and plain reduction
      and the surface cannot separate them. That blind spot is stated, and it is the reason the entry
      claims an interaction rather than a mechanism.'
    propagation: One step of the target operation is decreasing the secret's Hamming weight by one.
      Under that step the target vector in the primal embedding becomes shorter and more compressible,
      so beta* falls in both arms; the interaction is the statement that it falls faster in the structured
      arm. In the structured arm each sparse coordinate pattern has d rotations that are equally sparse,
      so a technique that exploits sparsity has d correlated chances - which is the concrete reason
      an interaction is plausible and is exactly what the design tests.
    survival_score: The factorial survives while exact recovery is reachable in enough cells. At n
      = 32, d = 16 the response is observable across h from 4 to 32, roughly a factor of eight in
      sparsity, with censoring rising at the dense end. At n = 48 the dense cells censor out entirely
      and the surface becomes a half-grid, which is reported rather than filled by imputation. The
      object dissolves when censoring exceeds half the cells, since an interaction cannot be fitted
      on a mostly-censored surface; the entry states that boundary as the design's reach.
  null_object_control: 'Two nulls, both in the same invocation. NULL B, the ring-deleted structured
    instance with the entry multiset preserved by a seeded within-block permutation, is run across
    the entire H grid; its interaction coefficient must be zero within interval. If it is not, the
    interaction tracks the block layout rather than the ring and the signal surface is an artifact,
    recorded as a controlled null under inventor-protocol section 3. NULL C, the sparsity-only arm:
    the unstructured instance across the H grid, which must show a clear main effect of H - beta*
    decreasing as h decreases - because an interaction term is uninterpretable if the response does
    not depend on the manipulated factor at all. NULL C is a precondition, not a comparison: if sparsity
    does not move the response in the unstructured arm, the design has no interaction to measure and
    the run reports that instead.'
  discriminated_from:
  - 'The matched-discount entry in this same batch: one secret law, dimension as the varied factor,
    answering KN-OPEN-026''s Q2. This varies sparsity and answers Q3. They share a generator and are
    powered differently.'
  - 'The technique-trend entry in this same batch: varies technique strength, answering Q1. Three
    entries, three sub-questions, one generator, deliberately.'
  - 'IDEA-20260805-530869: the instrument and precondition, with forced algebraic calibrations and
    one secret law.'
  - 'IDEA-20260813-28cf9c: conditions on a public key property (rank-deficient SampleNTT matrix) and
    prices the resulting equations. That is a selection design on keys; this is a factorial design
    on secrets.'
  - KN-OPEN-026's own proposed route for Q3, which is to read the sources and extract each mechanism's
    regime. That is a literature task this program cannot perform from this environment; this is a
    measurement that does not depend on it.
  assumptions:
  - Sparsity can be manipulated independently of the rest of the secret law by fixing the support
    size and drawing nonzero values from the base law; the resulting secret norm varies with h and
    is recorded as a covariate.
  - The same s in both arms of a pair is the correct matching at every h.
  - An interaction fitted on a partially censored surface is interpretable provided censoring is below
    half the cells and is reported per cell.
  - Exact recovery against retained ground truth defines the response.
  - An interaction measured at n <= 48 carries no implication for deployed dimensions or for FHE parameter
    selection, and none is drawn.
  predictions:
  - metric: 'main effect of H in the unstructured arm: change in median log2 beta* from h = n to h
      = n/8'
    direction: lower
    minimum_effect: 0.3
  - metric: S x H interaction coefficient on the signal surface
    direction: different
    minimum_effect: 'refusal to pre-commit on sign: whether sparsity is essential or incidental is
      precisely the question, and KN-OPEN-026 records the reported evidence as pointing one way while
      explicitly flagging that it may reflect where the technique matured rather than where it works.
      An interval excluding zero is the threshold for reporting an interaction.'
  - metric: S x H interaction coefficient on NULL B (ring-deleted)
    direction: different
    minimum_effect: 'forced value: 0.00, interval must contain zero.'
  - metric: fraction of cells censored across the full grid
    direction: lower
    minimum_effect: 0.5
  - metric: achieved power to detect an interaction of the pre-specified size
    direction: higher
    minimum_effect: 0.7
  minimal_test:
    design: One dimension, three arms, four sparsity levels. Fix q = 3329, d = 16, k = 2, n = 32,
      m = 2n, blocksize ceiling 24, and h in {4, 8, 16, 32}. Draw 50 seeds per h. From each seed and
      each h emit the structured instance, the matched unstructured NULL C, and the ring-deleted NULL
      B, all sharing s and e. Run progressive BKZ plus Babai on all three in the same invocation -
      twelve cells, 600 instances. Record beta* or censoring. Fit an additive-plus-interaction model
      on log2 beta* with censoring handled by an interval-censored likelihood, and report the interaction
      coefficient with its interval on the signal surface and on NULL B, alongside NULL C's main effect
      of H. This is the cheapest design that discriminates because an interaction needs at least two
      levels of each factor and four sparsity levels give it a shape rather than a slope, while the
      two nulls separately establish that the response depends on sparsity at all and that any interaction
      is about the ring.
    controls:
    - NULL C, the matched unstructured arm across the full H grid, establishing the main effect of
      sparsity as a precondition.
    - NULL B, the ring-deleted structured arm across the full H grid, whose interaction must be zero.
    - 'Norm covariate control: secret Euclidean norm recorded per instance, and the interaction refitted
      with norm as a covariate to separate sparsity from magnitude.'
    - Zero-error positive control at each h, where recovery must succeed at minimal blocksize in every
      arm.
    - 'Support-pattern control: at fixed h, half the seeds use a contiguous support and half a scattered
      one, exposing any dependence on support geometry rather than on weight.'
    required_metrics:
    - beta* or censoring flag per (seed, h, arm)
    - interaction coefficient with interval, signal surface
    - interaction coefficient with interval, NULL B
    - main effect of H in NULL C with interval
    - censoring fraction per cell
    - achieved power for the pre-specified interaction size
    - secret Euclidean norm per instance
    - support-geometry contrast at fixed h
  falsification_conditions:
  - 'NULL C shows no main effect of H: sparsity does not move the response and there is no interaction
    to measure; the design''s premise fails.'
  - 'NULL B''s interaction interval excludes zero: the interaction tracks block layout rather than
    the ring and the signal surface is an artifact.'
  - 'Censoring exceeds half the cells: the surface cannot be fitted and the entry reports a reachability
    floor.'
  - 'The interaction disappears once secret norm is included as a covariate: the effect is about magnitude,
    not sparsity, and must be reported as such.'
  - 'The support-geometry contrast is larger than the interaction: the response depends on where the
    support sits rather than how large it is, and weight is the wrong parameterisation.'
  - 'The interaction interval contains zero across a well-powered grid: sparsity is measured to be
    incidental at these parameters, refuting the entry''s motivating expectation and supplying a usable
    obstruction.'
  confounders:
  - Secret norm falls with sparsity, so a sparsity effect and a magnitude effect are aliased; addressed
    by the norm covariate and reported as partially confounded regardless.
  - Very sparse secrets make some instances trivially easy in both arms, compressing the response
    and shrinking any interaction toward zero.
  - Censoring is not random across cells - it concentrates at the dense end - so a naive fit would
    attribute the resulting curvature to an interaction; the interval-censored likelihood is required
    and its influence is reported.
  - 'Support geometry interacts with the ring: a contiguous support in a negacyclic ring has rotations
    that remain contiguous, which the support-geometry control exposes.'
  - Progressive BKZ's blocksize granularity is coarse relative to the expected effect, quantising
    the response.
  interpretation_limits:
  - An interaction measured at n <= 48 and blocksize ceiling 24 is a statement about that design and
    not about FHE or ML-KEM parameter selection.
  - The design detects an interaction; it does not identify the mechanism producing one, since sparsity
    aids several techniques at once.
  - Sparsity and secret magnitude cannot be fully separated by this design, only partially, and the
    residual aliasing is reported.
  - Nothing here bears on any deployed system or supports any security consequence.
  target_complexity:
    time_exponent: No attack exponent is claimed. The design's own cost is O(cells * seeds * BKZ)
      counted operations.
    memory_exponent: No attack memory exponent is claimed. Each instance holds one basis of O(n^2)
      integers.
    best_known: No incumbent attack is challenged. The incumbent for the question itself is KN-OPEN-026's
      own relayed pattern - large gaps reported in sparse-secret settings, small ones for uniform-ish
      secrets - which this design would turn from a cross-report comparison into a within-experiment
      interaction, or fail to.
    hidden_overhead: 'The aliasing between sparsity and secret norm is the hidden cost and it is analytic
      rather than computational: no covariate adjustment fully separates them, so the entry''s headline
      is intrinsically weaker than a clean factorial would suggest, and stating that honestly costs
      the result some of its force. Secondary: the interval-censored fit is fiddly in pure Python
      and its implementation risk is real.'
  dominated_by: n/a (no result claimed). Checked against every structure-discount row this corpus
    records - KN-OPEN-026's relayed 2-3 bit and 13-15 bit figures, KN-TECH-046's exp(Otilde(sqrt(n)))
    class-group line, and the matched-null instrument of IDEA-20260805-530869 - and none is a cost
    frontier this entry sits on, since the deliverable is an interaction coefficient and not a cost.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is an S x H interaction
    coefficient with an interval, two nulls, a censoring map and an achieved-power figure.
  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium
  honest_prior_of_survival: 'Three separable parts. (i) That the grid runs with acceptable censoring
    and both nulls behave: about 0.6, the dense cells being the risk. (ii) That NULL C shows a clear
    main effect of sparsity, without which nothing else is interpretable: about 0.85, since sparser
    secrets are straightforwardly easier. (iii) That a nonzero interaction survives the norm covariate
    and the support-geometry control: about 0.2, and I decline to raise it, because the sparsity-magnitude
    aliasing is intrinsic and the most likely honest outcome is an interaction that shrinks toward
    zero once magnitude is charged.'
