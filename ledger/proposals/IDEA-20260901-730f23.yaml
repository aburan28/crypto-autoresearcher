  minimal_test:
    design: >-
      STATIC AND SYMBOLIC ONLY, zero runs, inside the RQ claim boundary.
      Step 1: write (L-A) and run the two proves-too-much controls (M3).
      Step 2: write (L-B) with the averaging step and the fibre-size
