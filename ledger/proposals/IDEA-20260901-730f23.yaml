      write (L-D). FUTURE, separate authority, NOT proposed here: a toy
      resultant computation at 16-24 bits confirming M1 numerically for
      |x(D)| in a small ladder.
    controls:
      - F_2^{3m} prefix join, (L-A) must fail (blocking, proves-too-much).
      - F_p^* subgroup join, M1 escape must fire (blocking, proves-too-much).
      - D = G full-pair locator, must reproduce Theta(L^2) (baseline).
      - x^{-1}(I) Semaev slice, must reproduce B64-DER-2 (baseline).
      - Mandatory Pareto rows, Pollard rho and BSGS.
    required_metrics:
      - failing_step_of_L_A_on_each_control
      - explicit_constant_in_the_L_B_degree_bound
      - statement_of_cost_model_M1_with_its_named_escape
      - v_degree_of_the_Semaev_slice_as_a_formula_in_x_of_D
      - gamma_lower_bound_placed_on_the_3f0f4b_surface
      - the_three_open_successor_classes_with_defeated_steps

  falsification_conditions:
    - >-
      F1. (L-A) also concludes triviality for the F_2^{3m} or F_p^*
      control. Proves too much; void until repaired.
