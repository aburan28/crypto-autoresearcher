  assumptions:
    - A1. N prime; every nonzero element generates G; used in (L-A) only.
    - >-
      A2. phi and psi are rational functions of the point of bounded
      degree d, hence at most d-to-1 on G. The corpus's coordinate keys
      (x, y, bucketed x, quadratic character of x) all satisfy this with
      d <= 3.
    - >-
      A3. The join is row-wise root finding as defined; a join that reads
      both lists jointly through some other primitive is outside the class.
    - >-
      A4. Cost model M1 as stated in (L-C), with its escape named.
    - A5. No exact nontrivial quotient of G is assumed; (L-A) derives its absence.

  proof_search_map:
    bottleneck: >-
      The class 390ccc could not reach: joins that are not fibre systems.
      Removing it from the open list changes what a successor may propose;
      the decision-changing number is gamma >= 2 for the class.
    baseline_embedding:
      parameter_slice: >-
        The Semaev resultant join with c = 1, d = 2: v-degree 2|x(D)|, cost
        min(sigma, L) per row. With D = G it is the full-pair locator
        (B64-DER-5) at Theta(L^2); with D = x^{-1}(I) it is the exact
        K-EC-XINTERVAL-1 enumerator at Theta(L^2) (B64-DER-2).
      reproduction_check: >-
        Symbolic: deg_v Res_t(f_3(u, v, t), g(t)) = deg_v f_3 * deg g = 2 deg g
        by the resultant degree formula, and deg g = |x(D)| = sigma/2 for
        sign-closed D. Frozen fixture (FUTURE, separate authority): at a
        toy p, compute the resultant symbolically for |x(D)| in {3, 5, 8}
        and assert the v-degree equals 2|x(D)| exactly.
    observation_collision:
      observable: The per-row emitted count, i.e. the number of roots found per row.
      distinct_preimage_search: >-
        Two objects share Theta(sigma/N * L) emitted roots per row: (a) a
        polynomial of v-degree sigma with those roots (the honest case,
        cost L per row under M1); (b) a straight-line program of size
        log p whose root set is a coset of a multiplicative subgroup (the
        F_p^* control), where the same emitted count is found by one
        exponentiation and a hash lookup. They differ in whether the root
        set is a coset of a subgroup of the ambient group, and (L-A) says
        that on G no such coset exists for a nontrivial D. The separating
        condition is subgroup structure, not degree.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Represent the join's row as a univariate polynomial and the
          coverage condition as a root-count condition; the cost then
          becomes a degree, an exact algebraic quantity.
        predicted_gain: >-
          Closes the algebraic class at gamma >= 2 with a two-line proof
          instead of a structure theorem; zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the row degree fixed and vary the root-set structure
          (generic, coset of a field subgroup, image of an isogeny). The
          intrinsic invariant is whether the root set is the image under
          psi of a translate of a subgroup of G.
        predicted_gain: >-
          Names exactly which algebraic root sets escape M1 and shows each
          is a keyed join in disguise.
    quantifier_order: >-
      FOR ALL prime N, FOR ALL bounded-degree coordinate projections
      phi, psi, FOR ALL polynomials Phi (coefficient or SLP form), FOR ALL
      sign-closed D with sigma <= N/2, IF the row-wise root-finding join has
      coverage c > 0 and soundness eta < 1 - sigma/N THEN for a c/2 fraction
      of rows deg_v Phi(phi(R), .) >= c*sigma/(2d), and under M1 the total
      cost is at least L * min(c*sigma/(2d), L) / polylog. No witness
      depends on the lists or on Q. NOT CLAIMED: anything for k >= 2
      vector projections, for unbounded d, or outside M1.
    method_ceiling:
      strongest_certifiable_claim: >-
        gamma >= 2 - o(1) for row-wise polynomial-relation joins with
        bounded-degree scalar coordinate projections, under M1. It can
        NEVER certify a bound for vector-valued projections, auxiliary
        state, or cost models granting sublinear root finding for
        SLP-given polynomials with unstructured roots; and it is not an
        ECDLP lower bound.
      nearby_object_control: >-
        Where the conclusion FAILS: F_2^{3m} with the prefix projections
        and Phi = u + v (degree 1, exact, lossy) -- (L-A)'s last step fails
        because the stabilizer of the kernel subspace is itself; and F_p^*
        with the L-th-power projections -- degree is about sigma but the
        root set is a coset and M1's escape fires. A derivation that also
        closes either control proves too much and is void.
    proof_obligations:
      - claim: >-
          Exact two-sided acceptance with a non-injective projection forces
          D trivial (L-A).
        responsibility: correctness
      - claim: >-
          A rational function of degree d on E is at most d-to-1 on G, so
          psi(D - R) has at least sigma/d elements.
        responsibility: size
      - claim: >-
          Coverage c implies a c/2 fraction of rows emit at least
          c*sigma/2 qualifying pairs (averaging).
        responsibility: correctness
      - claim: >-
          A nonzero univariate polynomial has at most deg many roots; the
          identically-zero row violates soundness when eta < 1 - sigma/N.
        responsibility: strictness
      - claim: >-
          Under M1, per-row cost is at least min(deg, L)/polylog, and the
          only escape is a root set that is psi of a translate of a
          subgroup of G, which does not exist for nontrivial D.
        responsibility: runtime
      - claim: >-
          The Semaev resultant slice has v-degree exactly 2|x(D)| and
          reproduces B64-DER-2 and B64-DER-5.
        responsibility: baseline
      - claim: The argument is silent on F_2^n and on F_p^* with subgroup accepted sets.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The row polynomial Phi(phi(R), .) of a left point, equivalently its
      root multiset on the right coordinate.
    lossiness: >-
      Lossy as a projection of the row's emitted set of POINTS to a set of
      COORDINATE VALUES (each value carries up to d points), by at most
      log2(d) bits per root. (L-A) shows that for exact joins this is the
      only loss permitted, and (L-B) shows the retained part is as large as
      the accepted row; so the object passes the lossy-projection test only
      in the degenerate sense that it discards almost nothing, which is the
      obstruction.
    propagation: >-
      Not applicable in the group-law sense: the row polynomial is not
      carried through additions. Its one-step operation is root finding,
      and its cost is the degree.
    survival_score: >-
      The object is exact at every level of a k-tree but at cost sigma per
      row at every level; it never dissolves and never helps, which is the
      cleanest possible closure shape.

  null_object_control: >-
    NULL-1 (zero compute): D a uniformly random sign-closed subset of
    density 1/L. (L-B) gives v-degree at least c*sigma/(2d) for any join
    with coverage c; the same bound as for x^{-1}(I), which is the record's
    statement that the degree obstruction sees only |D|, not its structure,
    and that structure enters only through M1's escape. NULL-2: D = G
    (no concentration), where the join is the full-pair locator and the
    bound is sigma = N, consistent with B64-DER-5. POSITIVE CONTROLS
    (blocking, both must escape): F_2^{3m} prefix join and F_p^* subgroup
    join, as in method_ceiling. DECAY PARAMETER for a FUTURE toy check: the
    measured v-degree of the Semaev resultant as |x(D)| grows must scale
    exactly linearly; a sublinear fit means the resultant construction is
    wrong, not that the bound fails.

  discriminated_from:
    - >-
      IDEA-20260829-390ccc. NEAREST RECORD. It closes SOUND BALANCED
      RECTANGLE COVERS via Cauchy-Davenport and Vosper and lists algebraic
      joins as open item (d). EXACT DELTA: this record closes item (d) by a
      degree argument that needs neither soundness (only coverage) nor
      balance nor any additive-combinatorial theorem, at gamma >= 2 rather
      than at 'the key is a coarse log'. It is weaker in conclusion (a cost
      bound, not a structure theorem) and wider in hypothesis (partial
      coverage, arbitrary overlapping rows).
    - >-
      IDEA-20260829-4b34c5. That record wants BILINEAR character sums to
      bound the discrepancy of the acceptance matrix for rectangle joins
      and predicts its threshold exceeds N^{1/3}. This record needs no
      analytic input at all for the algebraic class; the two are
      complementary and neither implies the other.
    - >-
      IDEA-20260829-3f0f4b. Supplies the surface on which this record
      places gamma >= 2; 3f0f4b's own Bostan pointer is an intuition about
      output size, and (L-B) is the degree statement that survives partial
      coverage, which output-size intuition does not.
    - >-
      IDEA-20260901-a66d70 (filed in this session). Closes the ORDER join
      by approximate additivity and a Fourier cascade. Different primitive
      (sorted scan versus root finding), different invariant (additivity
      defect versus degree), no shared step.
    - >-
      B64-DER-2 (BATCH-671cae). That finding is scoped to the SUPPLIED
      enumerators and disclaims a generic bound; (L-C) is the generic bound
      for the algebraic sub-class, with its model stated.

