idea:
  id: IDEA-20260901-730f23
  question_id: RQ-ECDLP-160d89
  goal_id: null
  added: '2026-09-01'
  title: >-
    THE POLYNOMIAL-RELATION JOIN CEILING: a level-1 join realized by root
    finding of a bivariate polynomial in two coordinate projections cannot be
    output-sensitive on a prime-order group, because exact acceptance through
    a lossy projection forces the accepted set to be trivial (two-variable
    rigidity) and acceptance through a bounded-degree coordinate forces the
    polynomial's row degree to be at least a constant fraction of the accepted
    set, which is N^{2/3} -- so the class IDEA-20260829-390ccc left open as
    'algebraic, resultant or root-finding joins' sits at gamma >= 2 on the
    (gamma, s) surface, no better than the brute-force pair scan
  class: mechanism

  claim: >-
    Setting. G = <P> of prime order N; source-labelled lists of length L;
    accepted set D of size sigma = N^{s}, sign-closed. A POLYNOMIAL-RELATION
    JOIN consists of two COORDINATE PROJECTIONS phi, psi from G to F_p, each
    a rational function of the point of bounded degree d (so every fibre has
    at most d points; x has d = 2, y has d = 3), and a bivariate polynomial
    Phi in F_p[u, v], given either by its coefficients or by a straight-line
    program. The join emits (R_i, S_j) whenever Phi(phi(R_i), psi(S_j)) = 0,
    and is implemented row by row: for each i, find the roots of the
    univariate Phi(phi(R_i), .) among the L values psi(S_j). It is
    (1-eta)-SOUND and has COVERAGE c if at least 1 - eta of emitted pairs
    have R + S in D and at least a c fraction of pairs with R + S in D are
    emitted. This is the class listed as escape (d) in IDEA-20260829-390ccc's
    method ceiling and as excluded by assumption A4 of IDEA-20260829-4b34c5.

    (L-A) TWO-VARIABLE RIGIDITY (derivation tier). If acceptance is an EXACT
    function of (phi(R), psi(S)) -- Phi(phi(R), psi(S)) = 0 if and only if
    R + S in D -- and D is neither empty nor G, then phi and psi are
    injective on G. PROOF. If psi(S) = psi(S') with S != S', then for every
    R the two acceptances agree, so D - S = D - S', so D + (S' - S) = D, and
    since S' - S generates G, D is invariant under all translations and is
    trivial. Symmetrically for phi. No hypothesis on Phi is used; the lemma
    holds for any exact two-sided key, polynomial or not, and is the
    two-variable form of IDEA-20260807-df906f's rigidity.

    (L-B) VANISHING DEGREE. Suppose the join has coverage c > 0 and
    soundness eta < 1 - sigma/N. Then for at least a c/2 fraction of rows R,
        deg_v Phi(phi(R), .)  >=  c * sigma / (2 d),
    unless Phi(phi(R), .) is identically zero, which would emit the whole
    row and violate soundness. PROOF. The row's emitted set is
    {S : Phi(phi(R), psi(S)) = 0}; coverage forces it to contain a c
    fraction of D - R for most rows (averaging), i.e. at least c*sigma/2
    points S of D - R; psi has fibres of size at most d, so those S map to
    at least c*sigma/(2d) distinct values psi(S), each a root of the
    univariate Phi(phi(R), .). A nonzero univariate polynomial has at most
    its degree many roots. NOTE that soundness is not needed for the degree
    bound, only coverage; soundness only excludes the identically-zero row.

    (L-C) COST. Under cost model M1 (below), enumerating the roots of a
    univariate polynomial of degree e among L candidate values costs at
    least min(e, L) / (log N)^{O(1)} operations per row: in coefficient
    form the polynomial has e coefficients to read; in straight-line form of
    size s it costs L*s to evaluate at the candidates; and the only known
    way to beat evaluation is when the root set has algebraic structure
    (a coset, a subgroup, an image of a homomorphism) that makes membership
    a keyed equality, which is the hash-join class closed by 390ccc and by
    (L-A). Combining with (L-B) at sigma = N^{2/3} and L = N^{1/3}: per-row
    cost >= min(N^{2/3}, N^{1/3})/polylog = L/polylog, total >= L^2/polylog,
    i.e. gamma >= 2 - o(1). On the IDEA-20260829-3f0f4b surface that is
    N^{max(2(2-s)/4, s/2)} = N^{2/3} at s = 2/3, strictly worse than rho,
    and gamma < 3/2 (the retargeted sub-rho threshold of 3f0f4b) is
    unreachable by any polynomial-relation join with bounded-degree scalar
    coordinate projections.

    (L-D) WHAT IS NOT CLOSED, NAMED. (i) Vector-valued projections
    psi: G -> F_p^k with k >= 2 and acceptance 'psi(S) lies on a variety
    V_{phi(R)}': a degree-e variety in k dimensions can contain
    e*p^{k-1} points, so (L-B) gives nothing; the join becomes a
    point-variety incidence enumeration problem and this record makes no
    claim about it. (ii) Joins with auxiliary state (elliptic nets,
    KN-TECH-009). (iii) Coordinate projections of unbounded degree, where
    d grows with N; there (L-B) weakens to sigma/d and the fibre structure
    of psi re-enters through (L-A)'s approximate form. Each is a live
    successor class.

  mechanism: >-
    THE TRACKED OBJECT is the ROW POLYNOMIAL Phi(phi(R), .): a univariate
    polynomial attached to each left-list point, whose root set on the
    right coordinate is the row's emitted set. What the projection to the
    row polynomial discards is which right points sit on which root; what
    it retains is the root multiset. The lossy-projection test is passed
    trivially and uselessly: the root set is a set of coordinate values,
    not of points, and (L-A) shows that for it to be exactly the accepted
    row it must be as large as the row, which is the whole content.

    WHY DEGREE IS THE RIGHT MEASURE HERE AND NOT ELSEWHERE. The corpus's
    rigidity results (df906f, 863e36, 390ccc) all bound STRUCTURE: which
    partitions, block systems, or fibre systems can exist. An algebraic
    join is not a fibre system -- the row emitted sets overlap arbitrarily
    across rows -- so those results are silent on it, which is why 390ccc
    lists it as open. The correct invariant for a root-finding join is the
    number of roots, and a polynomial's root count is bounded by its degree
    in every model. (L-B) converts 'the row emitted set is large' into 'the
    row polynomial has large degree', and (L-C) converts degree into cost.
    The argument is short because the object is right, not because the
    class is easy; the Semaev baseline slice below shows the class contains
    every algebraic formulation of the pair scan the program has considered.

    STAGE 0 (zero compute, HARD GATE). Run (L-A) on the object where its
    conclusion must FAIL: F_2^{3m} with phi = psi = the m-bit prefix map
    (fibres of size 2^{2m}, wildly non-injective) and Phi(u, v) = u + v
    (degree 1), which is Wagner's exact prefix join with D the kernel
    subspace. There D + (S' - S) = D for every S' - S in D, i.e. the
    stabilizer of D is D itself, so the lemma's last step fails exactly
    because subgroups exist. Second object: F_p^* with D = H the subgroup of
    L-th powers, phi(R) = R^{(p-1)/L}, psi(S) = S^{(p-1)/L},
    Phi(u, v) = u*v - 1: exact, projections lossy, degree of the SLP-given
    polynomial in the ORIGINAL coordinates about sigma but with a coset as
    root set, so the join is a keyed equality -- the (L-C) escape, allowed
    there because H is a subgroup, forbidden on G because no nontrivial
    subgroup exists (RQ constraint restated as a theorem input, not an
    assumption).

    STAGE 1 (symbolic). Write (L-B) with the averaging step explicit: the
    number of (R, S) with R + S in D is N*sigma; coverage c gives
    c*N*sigma emitted qualifying pairs; so at least a c/2 fraction of rows
    emit at least c*sigma/2 qualifying pairs. Carry the fibre size d and the
    identically-zero exclusion.

    STAGE 2 (symbolic). State cost model M1 precisely and derive (L-C).
    Reproduce the BASELINE SLICE: the Semaev summation-polynomial join
    Phi(u, v) = Res_t( f_3(u, v, t), g_{x(D)}(t) ), where f_3 is the third
    summation polynomial (f_3(x(R), x(S), x(T)) = 0 iff R +/- S +/- T = O)
    and g_{x(D)} is the polynomial with root set x(D). Its v-degree is
    2*|x(D)| = sigma (up to the sign fold), matching (L-B) with c = 1 and
    d = 2, and its per-row cost under M1 is min(sigma, L) = L, i.e. the
    brute-force pair scan of B64-DER-2 and B64-DER-5 in algebraic dress.
    With D = G this is the full-pair locator at Theta(L^2).

    STAGE 3 (symbolic). Place gamma >= 2 on the 3f0f4b surface and record
    that the class cannot reach gamma < 3/2 at s = 2/3, nor gamma < 2/(2-s)
    at any s, because (L-B)'s bound scales with sigma = N^{s} while the
    candidate count is L = N^{(2-s)/4} < N^{s} for all s > 2/5.

    STAGE 4 (symbolic). Write (L-D)'s three escapes with the exact step of
    the argument each defeats, so a successor knows what to attack.

