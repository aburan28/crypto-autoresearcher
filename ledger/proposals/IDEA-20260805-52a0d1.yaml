idea:
  id: IDEA-20260805-52a0d1
  question_id: RQ-CRYPTO-001
  added: '2026-08-05'
  title: >-
    The uncertifiable conjunct: GOAL-CRYPTO-001's completion criterion requires
    an empirical comparison whose cheapest admissible instance exceeds the goal's
    entire declared campaign budget by a factor of about 1.2 x 10^3, and only
    exponent-sized advantages are statistically certifiable at all
  class: control

  claim: >-
    GOAL-CRYPTO-001 completes when a pipeline "completes on a recognized curve
    above 96 bits and independently reproduces a fully charged wall-clock or
    operation-count advantage over the matched Pollard-rho baseline." A discrete
    logarithm is trivially certifiable -- check kP = Q, one scalar multiplication.
    AN ADVANTAGE OVER A BASELINE IS NOT CERTIFIABLE AT ALL, because the baseline's
    cost on the same instance is a random variable that must be MEASURED, and
    measuring it means running the baseline. This proposal derives what that
    costs. Two forced numbers, both zero-compute and both derived below rather
    than looked up. (1) Pollard rho's running time on a fixed instance has, under
    the standard birthday model, a coefficient of variation of exactly
    sqrt(4/pi - 1) = 0.5227, INDEPENDENT of the group order and independent of
    the leading constant -- so the number of matched baseline runs needed to
    certify a relative advantage eps at the conventional 5% level with 80% power
    is n = (z_{.975} + z_{.80})^2 (4/pi - 1) / eps^2 = 2.1446 / eps^2 per arm,
    giving n ~ 2 at a factor-2 advantage, n ~ 214 at a 10% advantage, and
    n ~ 5362 at a 2% advantage. (2) A single matched rho baseline at exactly 96
    bits costs 2^47.83 group operations, which at an optimistic 10^7 elliptic
    curve group operations per second per core is 2.50 x 10^7 seconds -- 0.79
    core-years, and 1.16 x 10^3 times the goal's own declared
    campaign_budget.total_wall_clock_seconds of 21600. Certifying a 10% advantage
    at 96 bits therefore costs about 170 core-years, roughly 2.5 x 10^5 times the
    declared budget; at 128 bits one baseline alone is 5.2 x 10^4 core-years.
    THE CONSEQUENCE IS NOT THAT THE GOAL IS IMPOSSIBLE. It is that the goal's
    completion criterion, as written, cannot be satisfied by measurement under
    its own budget for any advantage smaller than an exponent-sized one, and that
    thirteen batches have been screening candidates against a criterion whose
    empirical half nobody has costed. The repair is concrete and cheap and is
    named here: certify the SOLVE by certificate and the BASELINE by closed-form
    operation count, and require the candidate's advantage to be large enough
    that a single comparison decides it.

  object_first_candidate:
    tracked_object: >-
      The COST OF THE BASELINE ON A FIXED INSTANCE, treated as a random variable
      rather than a number, and followed through the comparison: instance ->
      rho's walk randomness -> collision time T -> the ratio T_candidate /
      T_rho -> the admission verdict. Everyone in this program has tracked the
      candidate's cost; nobody has tracked the distribution of the thing it is
      compared against.
    established_families_off_limits: >-
      Off-limits as the primary lens: every attack family, without exception.
      This proposal contains no algorithm, screens no mechanism, and touches no
      curve. Semaev index calculus, Groebner instrumentation, BKK, xedni,
      descent, isogeny and pairing transfers, spectral arguments and rho
      variants are all outside it. The object is the goal's own success
      predicate, which is a measurement question.
    newness_score: >-
      Genuinely new for this goal and, so far as this repository shows, for the
      program: greps found no record anywhere that costs a matched rho baseline
      at any bit size, and no record that treats the baseline's cost as a
      distribution. The variance of rho is textbook; costing THIS GOAL'S
      COMPLETION CRITERION against THIS GOAL'S DECLARED BUDGET with it is the
      part that does not exist.
    testability_score: >-
      Maximal for the derivation -- it is closed-form probability plus
      arithmetic, and the arithmetic was executed during this ideation session
      and is reported below with its inputs. The one empirical input, group
      operations per second, is measurable in minutes on any host and the
      conclusion is reported AS A FUNCTION of it so that the conclusion does not
      hinge on the measurement.
    survival_score: >-
      The object survives all the way to the admission verdict, which is why it
      is worth tracking. It dissolves only if the criterion is reinterpreted so
      that the baseline is analytic rather than measured -- which is exactly the
      repair this proposal recommends, so the object's dissolution IS the
      deliverable.

  mechanism: >-
    STEP 1 -- THE BASELINE IS A RANDOM VARIABLE, AND ITS SPREAD IS SCALE-FREE.
    Under the standard birthday model for a pseudorandom walk in a cyclic group
    of order N, the number of steps T before a collision satisfies
    Pr[T > t] = exp(-t^2 / (2N)) + o(1), i.e. T = sqrt(N) * R with R standard
    Rayleigh. For standard Rayleigh, E[R] = sqrt(pi/2), Var[R] = 2 - pi/2, so
        E[T] = sqrt(pi N / 2),  sd[T] = sqrt((2 - pi/2) N),
        cv = sd/mean = sqrt((2 - pi/2)/(pi/2)) = sqrt(4/pi - 1) = 0.522723...
    THE CRUCIAL STRUCTURAL FACT: cv does not depend on N, and it does not depend
    on the leading constant in front of sqrt(N). This matters because the
    program's quoted rho cost, sqrt(pi N / 4), is RECALLED-UNVERIFIED and
    different sources normalise it differently (walk length versus total group
    operations, Floyd versus Brent versus distinguished points). The sample-size
    conclusion below is INVARIANT to that choice, because a constant factor
    cancels in cv. Every conclusion in this proposal that depends on the constant
    is separated from every conclusion that does not, and this one does not.

    STEP 2 -- HOW MANY BASELINE RUNS A CERTIFICATION NEEDS. Suppose a candidate
    claims cost (1 - eps) times the rho baseline in expectation. Testing that
    against the null "no advantage" at two-sided alpha = 0.05 with power 0.80
    needs, per arm,
        n = (z_{0.975} + z_{0.80})^2 * cv^2 / eps^2
          = (1.95996 + 0.84162)^2 * 0.273240 / eps^2
          = 2.1446 / eps^2.
    If the candidate's own cost is also random with comparable spread, double it.
    Evaluated (one-sample / two-sample):
        eps = 1.00 (factor 2 faster)   ->    2.1 /    4.3
        eps = 0.50                      ->    8.6 /   17.2
        eps = 0.20                      ->   53.6 /  107.2
        eps = 0.10                      ->  214.5 /  428.9
        eps = 0.05                      ->  857.8 / 1715.7
        eps = 0.02                      -> 5361.6 /10723.1
    A single matched comparison decides only advantages of order eps >~ 1.5,
    i.e. factors of roughly 2.5 or more. THIS IS THE STATISTICAL FORM OF THE
    PROGRAM'S EXPONENT-FIRST BIAS, and it is the first time that bias has been
    given a number in this corpus.

    STEP 3 -- WHAT ONE BASELINE RUN COSTS. rho at group order N = 2^96 costs
    sqrt(pi N / 4) = 2^47.83 group operations. Writing R for sustained elliptic
    curve group operations per second per core, one baseline takes 2^47.83 / R
    seconds. At R = 10^7 (an optimistic single-core figure for 96-bit prime-field
    arithmetic, DECLARED AS AN ASSUMPTION AND MEASURABLE IN MINUTES): 2.50 x 10^7
    seconds = 0.79 core-years. GOAL-CRYPTO-001's own record declares
    campaign_budget.total_wall_clock_seconds = 21600. The ratio is 1.16 x 10^3.
    At R = 10^9 -- two orders of magnitude beyond what a single core plausibly
    sustains, offered as an extreme bound rather than a projection -- the ratio
    is still 11.6. At 112 bits, one baseline is 202 core-years (2.96 x 10^5 x
    budget); at 128 bits, 5.18 x 10^4 core-years (7.57 x 10^7 x budget).
    Combining with Step 2: certifying a 10% advantage at exactly 96 bits needs
    ~215 baselines ~ 170 core-years ~ 2.5 x 10^5 times the declared budget.

    STEP 4 -- THE QUANTIFIER PROBLEM UNDERNEATH. "The matched Pollard-rho
    baseline" reads as a definite description of a number. It is not one. Rho's
    cost depends on the walk's randomness as well as the instance, so on a FIXED
    instance (P, Q) there is no such number, only a distribution; and the
    criterion's phrase "independently reproduces" quantifies over independent
    sessions, each of which draws again. Written with explicit quantifiers, the
    criterion is: THERE EXISTS a pipeline such that FOR ALL independent verifying
    sessions, the measured advantage over a freshly drawn baseline is positive.
    With cv = 0.52, a claimed 10% advantage fails that FOR-ALL with probability
    of order 0.4 on any single draw. The criterion as written is therefore not
    merely expensive; it is not satisfiable by a small-advantage mechanism at any
    budget, because the FOR-ALL is over draws.

    STEP 5 -- THE REPAIR, STATED CONSTRUCTIVELY BECAUSE A CLOSURE OWES FORWARD
    GUIDANCE. Split the criterion into the part that certifies and the part that
    does not.
      (a) THE SOLVE remains empirical and certificate-verified. kP = Q is checked
          in one scalar multiplication by any third party. Nothing is relaxed.
      (b) THE BASELINE becomes ANALYTIC: rho's cost is a closed form in N and a
          measured per-operation cost, and the per-operation cost is measured on
          the same host in seconds, not extrapolated from a full run. This is
          the standard practice the goal's own prior proposal IDEA-20260801-001
          gestures at with its GOE ruler, and it removes the 10^3 factor
          entirely.
      (c) THE ADVANTAGE THRESHOLD becomes explicit: the criterion should name the
          minimum eps it will accept, and Step 2 says the honest floor for a
          single comparison is around a factor of 2.5, with anything smaller
          requiring a replication count the goal should state rather than imply.
      (d) THE CHARGE becomes single-valued -- which is the complementary point
          derived in IDEA-20260805-6253cf, and the two repairs should be adopted
          together or the criterion stays ambiguous in the other direction.
    THIS PROPOSAL DOES NOT MAKE ANY OF THESE CHANGES. It derives them and hands
    them to the Coordinator, who alone may amend a goal record.

  novelty_status: unverified

  literature_context:
    - >-
      The Rayleigh birthday model, E[T] = sqrt(pi N / 2) and Var[T] = (2 - pi/2)N
      for the collision time of a random walk. RECALLED and re-derived in this
      record from Pr[T > t] = exp(-t^2/2N); the derivation is elementary and is
      given above rather than cited, precisely so that no citation is asserted.
    - >-
      The quoted rho cost sqrt(pi N / 4) group operations. RECALLED-UNVERIFIED,
      and normalisation conventions differ across sources (walk steps versus
      group operations, Floyd versus Brent versus distinguished points).
      DELIBERATELY QUARANTINED: every conclusion in Step 2 is invariant to it
      because a constant cancels in cv, and only the absolute figures in Step 3
      depend on it. Step 3's figures are therefore reported with the constant
      shown so a reader can substitute their own.
    - >-
      IN-CORPUS, READ THIS SESSION: ledger/goals/GOAL-CRYPTO-001.yaml -- the
      completion criteria quoted verbatim above, and
      campaign_budget.total_wall_clock_seconds = 21600, maximum_batches = 13,
      max_concurrent = 3. Those three numbers are the entire empirical basis of
      the budget comparison and they are read from the committed record, not
      recalled.
    - >-
      IN-CORPUS: IDEA-20260801-001 (this goal's own prior proposal) argues that
      the blocker is a missing shared ruler and proposes measuring a GOE baseline
      on a curve of order >= 160 bits with a memory-charged rho harness. IT DOES
      NOT COST THAT MEASUREMENT. Applying Step 3 at 160 bits gives a rho baseline
      of 2^79.83 group operations, which is not merely over budget but outside
      any plausible campaign; so the prior proposal's central artifact, taken
      literally as a full rho run, cannot be built. This is not a criticism of
      that record's intent -- a per-operation ruler is exactly right and is
      recommended above as repair (b) -- it is the arithmetic that record omits,
      and supplying it is a direct advance on this goal's own prior art.
    - >-
      NOVELTY SCREEN AND ITS LIMITS. Greps of ledger/, experiments/ and
      knowledge/ on 2026-08-05 found no record costing a matched rho baseline at
      any bit size and no record treating the baseline cost as a distribution.
      That screen sees this repository's file text and nothing else; the
      statistical content is textbook and no claim of external novelty is made.

  lossy_projection_identifiability_audit:
    projection: >-
      The full comparison "candidate versus baseline on instance I" projected
      onto the single scalar (measured candidate cost) / (measured baseline
      cost), and then onto the binary verdict "advantage / no advantage".
    what_is_discarded: >-
      The baseline's entire distribution -- everything except one draw from it --
      together with the instance's identity and the walk's seed.
    why_genuinely_lossy: >-
      Strictly lossy and, critically, lossy in a way that DESTROYS THE
      INFORMATION NEEDED FOR THE VERDICT. The retained scalar is a ratio of one
      draw to one number; the discarded part is the spread that determines
      whether the ratio means anything. This is the rare case where the
      projection's lossiness is itself the finding.
    why_compatible_with_the_operations: >-
      NOT FULLY COMPATIBLE, and that is the point being made. The goal's
      admission operation is a FOR-ALL over independent verifying sessions, and a
      single-draw ratio does not propagate deterministically through that
      quantifier: two sessions computing the identical projection on the identical
      candidate can disagree, with probability ~0.4 at eps = 0.1 as derived in
      Step 4. A projection whose value is not stable under the operation it feeds
      is not a valid observable for that operation.
    is_it_only_a_change_of_coordinates: >-
      NO -- far too much is discarded.
    which_failure_was_checked_for: >-
      A THIRD FAILURE, and it is named explicitly rather than forced into one of
      the two canonical ones. The canonical pair is (i) nothing discarded, so it
      is a change of coordinates -- checked and rejected -- and (ii) so much
      discarded that the value is CONSTANT across instances, giving zero
      comparator spread -- checked and rejected, since the ratio plainly varies.
      The failure that actually fires here is the opposite of (ii): the observable
      has TOO MUCH spread relative to the effect it is supposed to detect. Zero
      spread makes a statistic uninformative because it cannot move; spread large
      compared with the signal makes it uninformative because its movement is not
      the signal. Both are identifiability failures and only the first is in the
      protocol's worked catalogue. Recording the second, with cv = 0.5227 as its
      measured instance, is a contribution to the protocol as well as to this
      goal.

  assumptions:
    - >-
      That the birthday/Rayleigh model describes rho's collision time well enough
      for its coefficient of variation. Standard, and the FALSIFICATION IS CHEAP
      AND IS BUILT INTO THE EXPERIMENT: measure the empirical cv of rho at toy
      sizes where thousands of full runs are free, and compare to 0.5227.
    - >-
      That sustained group-operation throughput R is within a couple of orders of
      magnitude of 10^7 per core at 96 bits. DECLARED, MEASURABLE IN MINUTES, and
      the conclusion is reported as a function of R so that being wrong about R
      changes a number and not the verdict.
    - >-
      That campaign_budget.total_wall_clock_seconds = 21600 is the operative
      budget. Read from the committed goal record. If the Coordinator's operative
      budget differs, the ratio changes proportionally and the derivation is
      restated, not withdrawn.

  predictions:
    - metric: >-
        Empirical coefficient of variation of matched Pollard rho iteration
        counts, measured over >= 2000 independent runs at toy group orders
        N in {2^20, 2^24, 2^28, 2^32}
      direction: different
      minimum_effect: >-
        0.5227 +/- 0.05 at EVERY size, and FLAT IN N. Derived before any run from
        sqrt(4/pi - 1). Two ways this can fail and both are informative: a value
        far from 0.5227 refutes the Rayleigh model for the implemented walk, and
        a value that TRENDS with N refutes the scale-freeness on which the whole
        sample-size argument rests.
    - metric: >-
        Ratio of one 96-bit matched rho baseline to
        campaign_budget.total_wall_clock_seconds, at measured throughput R
      direction: higher
      minimum_effect: >-
        Greater than 100. Pre-derived value 1.16 x 10^3 at R = 10^7; the
        prediction is stated at 100 so that being wrong about R by an order of
        magnitude does not overturn it. If the measured ratio is below 1, the
        entire proposal is wrong and must be withdrawn -- and that is the honest
        falsifier, since it depends only on a throughput measurement anyone can
        repeat.
    - metric: >-
        Number of matched baseline runs required to certify eps = 0.10 at
        alpha = 0.05, power 0.80, computed from the MEASURED cv
      direction: different
      minimum_effect: >-
        Between 150 and 300 per arm. Pre-derived value 214.5 at cv = 0.5227.
    - metric: >-
        Minimum eps decidable by a SINGLE matched comparison at power 0.80
      direction: different
      minimum_effect: >-
        eps >= 1.4 (i.e. the candidate must be at least ~2.4x faster). Derived
        from 2.1446/eps^2 <= 1. This is the number the goal should be told,
        because it says that funding a mechanism whose claimed advantage is a
        constant factor below ~2.5 buys an uncertifiable result at any budget.
    - metric: >-
        Presence, anywhere in GOAL-CRYPTO-001's committed records, of a costed
        estimate for a matched rho baseline at any bit size
      direction: different
      minimum_effect: >-
        Pre-derived expectation: ZERO such records. This is a falsifiable claim
        about the corpus and the experiment checks it rather than asserting it;
        finding one would mean the arithmetic has been done and this proposal
        should report and cite it instead of re-deriving it.

  minimal_test:
    design: >-
      Three stages, cheapest first, all within budget by construction because the
      whole point is that the expensive thing is not run.
      STAGE 0 (arithmetic, zero compute, can terminate the line): re-derive cv
      and the sample-size formula; recompute the budget ratios from the committed
      budget number at several R; grep the goal's records for any existing cost
      estimate. If one exists, stop and report it.
      STAGE 1 (toy measurement, minutes, pure Python, no dependencies): implement
      a matched rho on toy groups at N in {2^20, 2^24, 2^28, 2^32}, run >= 2000
      independent seeds per size, and measure the cv and its trend in N.
      STAGE 2 (throughput measurement, minutes): measure sustained group
      operations per second at 96-bit prime-field arithmetic on the host, and
      report the budget ratio as a measured number with its host recorded.
    controls:
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE ANSWER IS KNOWN (must fire).
        Run the identical cv measurement on a plain BIRTHDAY COLLISION SEARCH --
        uniform independent draws from the same group, no walk, no curve -- where
        the Rayleigh model is exact by construction. FORCED VALUE 0.5227,
        derived before the run. If the instrument does not return 0.5227 there,
        it is broken and NO conclusion may be drawn about rho's cv.
      - >-
        MATCHED NULL (can fail). Measure the cv of a DETERMINISTIC baby-step
        giant-step run on the same instances. FORCED VALUE ~0 (BSGS's cost is a
        deterministic function of N, varying only through where the answer sits
        in the enumeration). If the pipeline reports a large cv for BSGS, the
        measurement is picking up host noise rather than algorithmic variance and
        every cv number in the package is void. This null is not decorative: it
        separates algorithmic spread from timing noise, which is the one
        confusion that would invalidate the whole argument.
      - >-
        GRADED CONTROL, 4 interior points with monotonicity reported: cv at
        N = 2^20, 2^24, 2^28, 2^32. The forced pattern is FLAT, not monotone,
        which is a stronger and rarer prediction than a trend -- and note the
        inversion of the usual artifact tell: here a quantity that FAILS TO STAY
        CONSTANT is the tell, because scale-freeness is the derived property.
        Both directions of departure are pre-registered as informative.
      - >-
        ARITHMETIC REPLICATION. Every budget figure recomputed independently by
        two different expressions (from bits, and from the group-order integer)
        and required to agree to three significant figures.
      - >-
        ORDERING RULE. The cv measurement and its controls are completed and
        committed before the budget ratios are computed, so no throughput figure
        can be selected to make a ratio look decisive.
    required_metrics:
      - measured cv per size with sample count and seed derivation, plus the flatness test
      - the positive control's cv and the BSGS null's cv, both reported before the rho figure
      - measured sustained group operations per second, with host, code and method recorded
      - budget ratio at 96, 112 and 128 bits, as a function of R, with the committed budget cited
      - sample-size table from the MEASURED cv, not the derived one

  falsification_conditions:
    - >-
      The uniform-birthday positive control does not return cv ~ 0.5227. The
      instrument is broken; nothing else may be reported.
    - >-
      The BSGS null returns a large cv. Timing noise dominates and every cv
      number is void.
    - >-
      Measured cv for rho is far from 0.5227 or trends with N. The scale-free
      claim fails, the sample-size table must be rebuilt from the measured
      distribution, and the headline invariance argument is withdrawn.
    - >-
      The measured budget ratio at 96 bits is below 1. The central quantitative
      claim is false and the proposal is withdrawn.
    - >-
      A costed rho baseline is found in the goal's committed records. The
      arithmetic has been done; report and cite it rather than claiming the gap.

  confounders:
    - >-
      THROUGHPUT IS HOST-DEPENDENT and varies by orders of magnitude across
      implementations, coordinate systems and instruction sets. The conclusion is
      therefore stated as a function of R and asserted only at the "> 100"
      threshold, which absorbs an order of magnitude in either direction.
    - >-
      PARALLELISM. Distinguished-point rho parallelises with near-linear speedup,
      so a large machine converts core-years into wall-clock. That changes the
      WALL-CLOCK ratio and not the CORE-YEAR one, and the record must report
      both -- and note that the goal's budget is stated in wall-clock seconds
      with max_concurrent = 3, so the parallelism available under the declared
      budget is a factor of 3, not a factor of 10^5.
    - >-
      THE CONSTANT IN rho's COST. Recalled and normalisation-dependent. It
      affects Step 3's absolute figures and cancels in Step 2. The record keeps
      the two separated and must not let a reader merge them.
    - >-
      DISTRIBUTIONAL SHAPE VERSUS SPREAD. The sample-size formula uses a normal
      approximation to the sample mean. At n of order 200 that is fine; at n of
      order 2 it is not, and the single-comparison threshold eps >= 1.4 should be
      read as an order-of-magnitude statement rather than a precise bound. Stated
      here rather than discovered later.
    - >-
      CRITICISING A GOAL'S OWN CRITERION IS CHEAP and reads as rigour. The design
      answers this with a positive control that must fire, a null that can fail,
      and a pre-registered falsifier (budget ratio below 1) that would end the
      proposal on a measurement anyone can repeat in minutes.

  interpretation_limits:
    - >-
      NOTHING HERE IS EVIDENCE ABOUT THE ECDLP, about any curve, or about any
      mechanism. No exponent moves, no attack is proposed, no security claim is
      made or implied.
    - >-
      This does NOT show GOAL-CRYPTO-001 is unachievable. It shows one CONJUNCT
      of its completion criterion is not achievable BY MEASUREMENT UNDER THE
      DECLARED BUDGET for small advantages, and it supplies a repair. Declaring
      the goal impossible would be exactly the premature closure the inventor
      protocol forbids, and this record does not do it.
    - >-
      NO CHANGE to the goal's objective, completion criteria, budget, status or
      next_action is made or requested here. Amending a goal record is a
      Coordinator action (AGENTS.md rule 1). The derivation is offered as input.
    - >-
      The toy cv measurement is toy-tier and transfers only the scale-freeness it
      measures. It is not evidence about rho at 96 bits, and the record must not
      be cited as if a 2^32 measurement said anything about 2^96 beyond the
      model's own flatness.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a pseudorandom walk on a cyclic group of order N with a well-mixed
        step function, the collision time T satisfies
        Pr[T > t] = exp(-t^2/(2N))(1 + o(1)) uniformly for t = Theta(sqrt(N)),
        hence cv[T] -> sqrt(4/pi - 1) as N -> infinity.
      random_model_justification: >-
        The walk is modelled as sampling uniformly at random with replacement;
        the birthday calculation is then exact in the limit, and cv follows from
        the Rayleigh moments computed above. This is a uniform-model
        justification, offered as such, and the deviation of real r-adding walks
        from uniformity is a known and measured effect that inflates the constant
        without changing the shape -- RECALLED, and the toy measurement is what
        checks it here rather than the recall.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Measured cv departing from 0.5227 by more than 0.05, or trending with N,
        at toy sizes where thousands of full runs are affordable.
    - id: H2
      statement: >-
        Sustained elliptic-curve group-operation throughput at 96-bit prime-field
        arithmetic is within two orders of magnitude of 10^7 per second per core.
      random_model_justification: >-
        Not a random model at all -- an engineering estimate, labelled as such
        rather than dressed as one. It is the only empirical input to the budget
        ratio and it is measurable in minutes.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Measured throughput above 10^10 per core, which would drop the 96-bit
        ratio below 1 and refute the headline.
    - id: H3
      statement: >-
        A candidate pipeline's own cost is either deterministic or has spread no
        larger than rho's, so the one-sample sample sizes are a lower bound and
        the two-sample column is an upper bound.
      random_model_justification: >-
        Stated as a bracket rather than a value precisely because no candidate
        exists to measure. Both columns are reported so no reader has to guess
        which applies.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A candidate with cv substantially above 0.52, which would push the
        required n above the two-sample column and strengthen the conclusion
        rather than weaken it.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED. Stated plainly as the generation
      contract requires. The proposal's relevance to exponents is indirect but
      sharp: it derives that only advantages of roughly a factor 2.5 or more are
      certifiable from a single comparison, which is a quantitative argument for
      the program's exponent-first bias and against funding constant-factor
      polishing on this goal.
    memory_exponent: >-
      n/a. rho's memory is polylogarithmic in the distinguished-point form; the
      memory question belongs to IDEA-20260805-6253cf and is deliberately not
      duplicated here.
    best_known: >-
      Matched Pollard rho at sqrt(pi N / 4) = 2^47.83 group operations at
      N = 2^96, 2^55.83 at 2^112, 2^63.83 at 2^128, 2^79.83 at 2^160, 2^127.83 at
      2^256.
    hidden_overhead: >-
      The per-group-operation cost R, which is host and implementation dependent
      and is the entire content of converting operation counts into budget
      ratios. It is measured rather than assumed, and every figure is reported as
      a function of it.
    tradeoff_note: >-
      The only tradeoff here is statistical: certification cost scales as
      1/eps^2, so halving the advantage you are willing to claim quadruples the
      baseline runs you must buy.

  dominated_by: >-
    n/a (no result is claimed on any cost axis; there is no algorithm here, so
    no Pareto point exists to be dominated, and this is stated rather than left
    as an unchecked null). On the QUESTION addressed -- what does
    GOAL-CRYPTO-001's completion criterion cost to satisfy -- the frontier rows
    checked are: the goal record itself (states the criterion and the budget,
    never multiplies them); IDEA-20260801-001 (proposes the measured ruler,
    does not cost it); all thirteen EV-CRYPTO records (screening dispositions,
    no cost estimate); and a grep of ledger/ and experiments/ for any costed rho
    baseline at any bit size, which returned none. No row dominates because no
    row exists. Absence of a search result is not evidence that no prior work
    exists (AGENTS.md retrieval policy), and the experiment re-runs the grep
    rather than trusting this one.
  sota_delta: >-
    Quantitative and in the units of the deliverable. Before: GOAL-CRYPTO-001
    carries a completion criterion with an empirical conjunct and a declared
    budget of 21600 seconds, and no record multiplies the two. After: the exact
    ratio at three bit sizes (1.16 x 10^3 at 96 bits, 2.96 x 10^5 at 112,
    7.57 x 10^7 at 128, at R = 10^7), a scale-free spread constant
    cv = 0.5227, a sample-size law n = 2.1446/eps^2 with a six-row table, a
    single-comparison decidability floor of eps >= 1.4, and a four-part repair.
    Compute cost: minutes. No attack; delta on every attack axis is exactly zero
    and is stated as zero.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.95 that the derivation and the arithmetic stand -- they are closed-form
    probability and multiplication, they were executed once during this ideation
    session, and the only external input is a throughput figure whose effect is
    absorbed by stating the claim at "> 100" rather than at 1160. Not 1.00
    because the rho constant is recalled and because the Rayleigh cv is a
    limit statement that real r-adding walks approach rather than attain -- the
    toy measurement is exactly what settles that, and a measured cv of, say,
    0.60 would change the sample-size table by 32% without touching the
    conclusion. 0.35 that the Coordinator adopts any part of the repair, which
    is a process judgement outside this proposal's control and is the reason the
    record is written so that the derivation stands on its own whether or not
    the repair is adopted.
