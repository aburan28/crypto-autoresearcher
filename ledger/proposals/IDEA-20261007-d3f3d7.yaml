idea:
  id: IDEA-20261007-d3f3d7
  question_id: RQ-ICINV-475b5e
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Vélu 2-isogeny from y^2 = x^3 + 6x over F_41 preserves the
    rational point count
  class: control
  claim: >-
    Let E be y^2 = x^3 + 6x over F_41. The point (0, 0) lies on E.
    Let E-prime be the codomain short-Weierstrass model of the Vélu
    isogeny with kernel the subgroup generated by (0, 0). If either
    model is singular, the run is an invalid setup. Let phi be that
    isogeny and let phi-hat be its dual. If there is no affine point
    R outside the kernel with phi-hat(phi(R)) = 2R, the run is an
    invalid setup. Otherwise the number of F_41-points of E, counting
    the point at infinity, equals the number for E-prime. A nonzero
    difference, after that composition check passes, is a negative.
    The claim does not state a j-invariant and does not state a sum
    of twist point counts. No discrete logarithm is computed, and
    the generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the rational
    point count of a short-Weierstrass model. Sigma is a degree-2
    Vélu isogeny, not translation. Trichotomy class: partial-action,
    because an isogeny is a homomorphism and Tate's criterion ties
    the isogeny to the point count. The projection keeps only the
    integer difference of the two counts. Explanation A: a 2-isogeny
    defined over F_41 preserves the F_41-point count. Explanation B:
    the counts differ after the composition check, so the codomain
    is not an F_41-isogenous model or the counter is wrong. No rho
    walk is run.
  novelty_status: known
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if
        they have the same number of points. This idea tests one
        direction on one Vélu kernel.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. Equal point counts do not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-ICINV-475b5e
      provenance: internal
      claim: >-
        The question asks whether an attack-cost functional is
        non-constant on an isogeny class. Equal point counts are
        the invariant that class shares.
      verified_by: ledger/questions/RQ-ICINV-475b5e.yaml
  assumptions:
    - (0, 0) has order 2 on this model. If 2(0, 0) is not O, the setup fails.
    - The composition check uses one affine point outside the kernel. A failed check is an invalid setup, not the negative.
    - Both counts include the point at infinity.
  predictions:
    - metric: absolute difference of the two F_41-point counts
      direction: lower
      minimum_effect: exactly 0 after the composition check passes
  minimal_test:
    design: >-
      Build the Vélu codomain of the kernel generated by (0, 0).
      Check phi-hat(phi(R)) = 2R for one affine R outside the kernel.
      Count points on both models over F_41, including infinity.
      Do not run Pollard rho.
    controls:
      - A singular model makes the run invalid.
      - A failed composition check makes the run invalid and is not a point-count difference.
      - The quadratic twist of E is not substituted for E-prime.
    required_metrics:
      - point_count_E
      - point_count_codomain
      - composition_ok
      - discriminant_is_zero
  falsification_conditions:
    - The composition check passes, both models are nonsingular, and the point counts differ.
    - Either model is singular, or the composition check fails. No difference from that run is admissible.
  confounders:
    - Dropping the point at infinity from one count and not the other produces a difference of 1. Both counts include it.
    - An isomorphic model that is not the Vélu codomain can still share the count. The composition check is what ties the model to the kernel.
  interpretation_limits:
    - Equal counts are the isogeny invariant already stated in KR-RHO-755e35. They do not change the exponent 1/2.
    - The scope is this one kernel at p = 41.
    - A j-invariant is not part of the claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A separable isogeny defined over F_p preserves the number of
        F_p-points. On this kernel the Vélu codomain is such an
        isogeny once phi-hat(phi(R)) = 2R. The heuristic is that the
        implementation's codomain is that isogeny and not a twist.
      rigorous_support: >-
        KR-RHO-755e35, opened, states that isogenous curves over a
        finite field have the same number of points. It does not
        compute this kernel at p = 41.
      validation_plan: >-
        At this one kernel, record the absolute difference of the
        counts after the composition check. If the difference is not
        0, H1 is false for this implementation. No second prime is
        claimed.
  target_complexity:
    time_exponent: >-
      One Vélu codomain and two point counts at p = 41. The
      generic-group exponent 1/2 is unchanged.
    memory_exponent: O(1) coefficients
    best_known: >-
      KR-RHO-755e35, opened, already states the equal-count criterion.
      KR-RHO-13bf67, opened, gives the square-root generic bound.
      This count beats neither.
    hidden_overhead: >-
      No o(1) term. The test is one kernel.
    tradeoff_note: >-
      No time-memory tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-IC-5931ee
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: special_case
        delta: >-
          The opened row states that isogenous curves have the same
          number of points. This idea adds one integer, the absolute
          difference of two F_41-point counts on one Vélu kernel,
          predicted equal to 0. The exponent distance to the generic
          bound is the whole 1/2, which is not claimed.
  dominated_by: >-
    The equal-count criterion in KR-RHO-755e35 already dominates this
    kernel as a special case. Pollard rho, at the square-root exponent
    in KR-RHO-13bf67, dominates any reading of the count as an attack.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the absolute
    difference of two point counts, predicted equal to 0, at the
    prime 41. The generic-group exponent stays 1/2.
