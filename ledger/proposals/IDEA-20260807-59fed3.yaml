idea:
  id: IDEA-20260807-59fed3
  question_id: RQ-EWALK-8fa147
  added: '2026-08-07'
  title: >-
    MIXING, NOT SPACE: on the Aut-quotient the step may choose WHICH orbit
    element to translate, as a function of the class, giving r*|Aut| distinct
    well-defined class maps from r stored table points -- so the walk should
    reach Teske's ideal collision constant at a table |Aut| times smaller,
    while the derived fruitless-2-cycle rate 1/(|Aut|*r) is UNCHANGED by the
    same construction; the two predictions point in opposite directions, are
    measured in one run, and the honest ceiling is that the entire mixing axis
    is worth at most the ~20 percent Teske headroom that this program's
    baseline has ALREADY SPENT, so the deliverable is table memory at fixed
    constant, not speed
  class: algorithm

  claim: >-
    (A) THE CONSTRUCTION, AND WHY IT IS WELL DEFINED WHERE THE OBVIOUS VARIANT
    IS NOT. On the quotient by Aut of order m, a step must map classes to
    classes. The obvious "apply phi then translate" map A |--> phi(A) + T_s is
    NOT well defined on classes: for sigma in Aut, phi(sigma A) + T =
    sigma phi(A) + T, and sigma X + T is not Aut-related to X + T. What IS well
    defined is to canonicalise FIRST and then choose an orbit element by a
    function of the class:
      A |--> sigma_{e([A])}( canon(A) ) + T_{s([A])},
    where canon is the canonical-representative map, s(.) is the usual
    r-branch partition of classes, and e(.) is a SECOND partition of classes
    into m cells selecting one of the m automorphisms. Every ingredient is a
    function of the class, so the map descends to G/Aut and is memoryless in
    the sense van Oorschot-Wiener parallelisation requires (KN-TECH-006).
    Exponent bookkeeping is unchanged in kind: canon contributes a known scalar
    and sigma_e contributes a known scalar, so (a, b) |--> (u a + c_s,
    u b + d_s) with u the product of the two known scalars mod N.

    (B) THE EFFECTIVE-BRANCH-COUNT CLAIM, WHICH IS THE POINT AND IS SHARP.
    The map above realises r*m distinct affine class maps while storing only r
    group elements. Teske's result, as recorded in KN-TECH-006, is that
    well-chosen r-adding walks reach the ideal random-walk constant and that
    Pollard's original 3-branch map is about 20 percent worse. So the claim is
    an EQUIVALENCE, pre-registered as an exact comparison rather than as a
    vague improvement:
      the orbit-choice quotient walk with r table points has the same
      collision constant, within the bootstrap band, as the plain quotient
      walk with r*m table points.
    At m = 6 that is a SIX-FOLD reduction in table size at equal walk quality.
    It is falsified by a single (r, m) cell where the two disagree beyond the
    band.

    (C) THE DERIVED NULL INSIDE THE SAME EXPERIMENT, POINTING THE OTHER WAY.
    Redo the immediate-undo derivation of IDEA-20260807-6355c6 for the
    orbit-choice map. With nu = sigma_{e([A])}, B = nu canon(A) + T_s,
    canon(B) = rho B, and mu = sigma_{e([B])} rho, the next output is
      C = mu nu canon(A) + mu T_s + T_{s'}.
    [C] = [A] requires (mu nu - tau) canon(A) = -(mu T_s + T_{s'}) for some
    tau in Aut. The generic branch is tau = mu nu together with
    T_{s'} = -mu T_s, an equation in the table alone. With a generic (non
    Aut-stable) table this needs mu = -1 and s' = s. But rho is still the
    canon-selected automorphism, still uniform on Aut and independent of
    e([B]), so P(mu = -1) = 1/m exactly as before, and
      rate = 1/(m r), UNCHANGED.
    THIS IS A DERIVED NULL, NOT A HOPE. The orbit choice is predicted to
    improve mixing and to leave the 2-cycle rate alone. A measured change in
    the cycle rate refutes the (B1) branch model that both this record and
    IDEA-20260807-6355c6 rest on, and that refutation would be the more
    valuable outcome because it would mean the dominant cycle mechanism is not
    the one either record models.

    (D) THE CEILING, STATED BEFORE THE EXPERIMENT SO IT CANNOT BE INFLATED
    AFTERWARDS. Mixing changes the CONSTANT, never the exponent (KN-TECH-005),
    and the constant is bounded on both sides:
      - Above, by the ideal random-map value 1.2533*sqrt(M) on a class set of
        size M = N/m. No memoryless walk collides sooner than a random map in
        any way that helps, and IDEA-20260806-37eab9 derives the achievable
        band as [1, ideal], a factor strictly under 1.3.
      - Practically, by the fact that THE HEADROOM IS ALREADY SPENT. KN-TECH-006
        records that Teske's r-adding walks REACH the ideal constant, about 20
        percent better than the 3-branch map. At r >= 20 this proposal's
        mixing gain is therefore EXACTLY ZERO on the collision constant, by
        construction, and saying so up front is what distinguishes this from a
        proposal that would discover it after spending a batch.
      So the collision-constant gain is: up to about 20 percent at r in
      {2, 3, 4}, converging to 0 as r approaches 20, and 0 beyond. The
      DELIVERABLE IS NOT SPEED. It is table size: a factor m fewer stored
      points at equal quality, which is a memory and cache-locality constant in
      exactly the deployment where rho constants are actually paid -- the
      record computation of KN-LIT-097 ran 3 rho cores per Spartan-6 FPGA and
      up to 576 FPGAs, where per-core table storage is a hard area constraint.

    (E) WHAT THIS IS NOT. Not an exponent claim. Not a space-size claim: M is
    still N/m and the sqrt(m) ceiling of IDEA-20260807-ebcae6 is untouched. Not
    a claim that the orbit choice is free: sigma_e costs 1-2 field
    multiplications on a j = 0 curve and must be charged, and at m = 2 it costs
    a conditional negation and is nearly free but also nearly pointless, since
    r*2 rarely crosses the Teske threshold from below.

  resource_label: >-
    R3 (End(E) as a ring -- its unit group Aut, used here as a source of
    step-map diversity rather than as a source of space reduction).

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    INADMISSIBLE. Every use of the automorphism is an application to points of
    G, which on a prime-order subgroup is multiplication by a known scalar
    (H-ENDO-001) and is exactly Oracle D of KN-FIND-b7e091, generic-group
    simulable and closed at exponent 1/2 (KN-TECH-005). Sharpened for this
    record: the orbit-choice map is a MEMORYLESS FUNCTION OF THE GROUP ELEMENT
    composed with known scalar multiplications and one group addition, so a
    generic-group simulator reproduces it step for step at O(log N) overhead
    per step. Nothing here escapes the model, and nothing is claimed to. The
    record is filed as a recorded closure with an obstruction named, plus a
    measurable constant-and-memory question inside the closed family, which is
    the brief's stated legitimate deliverable for lane L6.

  discriminated_from:
    - >-
      IDEA-20260806-37eab9, which frames iteration-function design as a bounded
      optimisation and derives the band. That record's search space is
      (partition rule, r, jump multiset, automorphism quotient, escape rule, DP
      granularity). The orbit-choice degree of freedom -- selecting WHICH orbit
      element to translate, by a partition of the classes -- is not in that
      list and is not a re-parameterisation of anything in it: it changes the
      number of realised class maps without changing the number of stored
      points, which is precisely the axis that record's per-step cost budget
      (about 10 field multiplications) makes valuable.
    - >-
      IDEA-20260807-6355c6 (this batch), which measures the cycle rate and the
      net gain as |Aut| varies. This record holds the space reduction fixed and
      varies the STEP MAP, and it contributes a derived null to that record's
      model rather than a competing measurement.
    - >-
      IDEA-20260807-06cc5d (this batch), which uses a NON-unit endomorphism as
      a step multiplier and derives the "an automorphism cannot be spent twice"
      dichotomy. That record's multiplier is not in Aut and gives no space
      reduction; this record's is in Aut and is used simultaneously for space
      and for diversity. The two are the two halves of the mixing axis and
      their predictions differ.
    - >-
      KN-TECH-006 / Teske. That establishes the ideal constant is REACHABLE at
      r >= 16-20. This record takes that as its ceiling and asks for the same
      quality at a smaller table, which is a different currency.
    - >-
      Lane L4's phi-stable factor bases (RQ-EQIC-8cb959). Those are index
      calculus objects; a walk's step table is not a factor base and the
      relevant symmetry question has the opposite sign here (see
      IDEA-20260807-6355c6: an Aut-stable STEP TABLE multiplies the cycle rate
      by m).

  object_first_candidate:
    tracked_object: >-
      THE REALISED CLASS MAP as an element of the set of well-defined maps
      G/Aut -> G/Aut expressible as canonicalise, apply an automorphism chosen
      by a class partition, translate by a table point chosen by a class
      partition. Tracked quantity: the number of DISTINCT such maps realised
      per stored table point, and the resulting empirical collision constant.
    lossiness: >-
      The projection under test is the same Aut-orbit projection as the rest of
      the lane: it forgets log2(m) bits (which orbit element) and retains the
      class. It is genuinely lossy -- the point is not recoverable from the
      class -- and it is NOT a change of coordinates. What is new here is that
      the construction deliberately RE-READS the discarded coordinate through
      e([A]): the step chooses an orbit element, i.e. it writes back into the
      coordinate the projection forgot, using only class-level information. The
      projection is therefore lossy and the map is still well defined on the
      quotient, which is the exact condition
      docs/inventor-protocol.md section 2 asks for.
    propagation: >-
      DETERMINISTIC ON CLASSES BY CONSTRUCTION, and this is checkable rather
      than asserted: for any sigma in Aut, the input canon(sigma A) = canon(A)
      identically, so both e and s see the same argument and the output is the
      same class. That identity is a unit test, not a hope, and it is the first
      thing the implementation must verify.
    survival_score: >-
      Survives change of r, of size, of DP granularity, of curve model, of
      escape rule. Dies at m = 2 in the sense that the construction becomes a
      relabelling with only a factor-2 effective-branch gain, which at r >= 10
      is below the resolution of the measurement. Dies entirely if canon is not
      idempotent under Aut, i.e. if the canonicalisation is implemented on a
      non-normalised projective representation -- a real implementation hazard,
      since x = X/Z^2 requires an inversion before the orbit can be ordered.

  mechanism: >-
    STAGE 0 (zero compute). Write the well-definedness identity
    canon(sigma A) = canon(A) and the exponent update (a, b) |-> (u a + c_s,
    u b + d_s); derive the effective-branch-count claim (B) and the cycle-rate
    null (C); state the r >= 20 zero-gain boundary from KN-TECH-006 so no
    reader expects a speed win there.

    STAGE 1 (implementation, HARD GATE). Extend the quotient walk with a second
    partition e(.) into m cells. Unit-test well-definedness by asserting that
    all m orbit elements of a random point produce the identical next class,
    over at least 10^4 random points on each of the three curve families. A
    single failure is an implementation defect and blocks everything.

    STAGE 2 (the equivalence measurement, the core). On GEN (m = 2), J1728
    (m = 4) and J0 (m = 6), measure the empirical collision constant
    steps/sqrt(N/m) for:
      arm A: plain quotient walk with table size r, r in {2, 3, 4, 6, 8, 12,
        16, 20, 24, 32, 48, 96};
      arm B: orbit-choice quotient walk with table size r, same grid.
    PRE-REGISTERED COMPARISON: arm B at r must match arm A at r*m within the
    bootstrap band, at every r for which r*m is in the grid. Report the paired
    differences, not two separate curves.

    STAGE 3 (the derived null, in the same runs). Instrument the immediate-undo
    events in both arms and compare the measured 2-cycle rate against the
    derived 1/(m r) for BOTH arms. Pre-registered: the two arms agree. A
    difference beyond a factor 1.5 refutes the (B1) model.

    STAGE 4 (charging). Report fully charged cost in F_p multiplications with
    the curve model named, including the sigma_e evaluation and the
    normalisation inversion that canon requires, so the table-size saving is
    reported net of the arithmetic it costs. A table-size win that costs more
    per step than it saves in cache traffic is not a win and the record must be
    able to say so.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/, analysis/, research/,
      experiments/ on 2026-08-07 for "orbit choice", "orbit element",
      "effective branch", "table size", "r-adding", "Teske", "mixing time",
      "spectral gap", "partition function". Records read in full:
      IDEA-20260806-37eab9, KN-TECH-006, KN-TECH-018, KN-LIT-097, KN-LIT-042,
      KN-LIT-2945, H-RHO-bc6ea6, EXP-RHO-60da4f,
      research/pollard-rho-generic/literature.md,
      inputs/h100_session/h041_xonly_walk.json.
    results: >-
      "mixing time": 40+ files, essentially all of them about isogeny-graph or
      class-group mixing (GOAL-SSI-001, the CSIDH-adjacent lanes), not about
      rho walk quality. "Teske" and "r-adding": appear as BASELINE citations in
      KN-TECH-006 and in cost-convention proposals, and as an optimisation
      target only in IDEA-20260806-37eab9. "orbit choice" / "orbit element
      selected by a partition of classes": ZERO hits. The idea of realising
      r*|Aut| class maps from r stored points appears nowhere in the corpus.
      research/pollard-rho-generic/literature.md records Kim-Montenegro-Peres-
      Tetali's birthday paradox for Markov chains as motivation for measuring
      collision quality under stated mixing assumptions, and KN-LIT-2945
      (Kijima-Montenegro) as a rigorous collision-time analysis; both are
      relevant anchors and neither contains this construction.
    verdict: >-
      ADAPTATION, with a caveat recorded rather than hidden. Equivalence-class
      walks and r-adding walk quality are both classical, and the specific
      device of using the automorphism to enrich the step map on the quotient
      is natural enough that it may well exist in the negation-map
      implementation literature (Bos-Kleinjung-Bernstein-style work on the
      correct use of the negation map, and the FPGA record of KN-LIT-097, both
      of which had to solve exactly this engineering problem). Stage 0 must
      locate that literature and record what it already answers; a positive hit
      converts Stage 2 from a discovery into a replication, which is a better
      outcome than a wrong novelty claim. No novelty against external
      literature is asserted here.

  null_object_control: >-
    MANDATORY, AND THIS PROPOSAL CARRIES ITS NULL INSIDE ITS OWN PREDICTIONS.
    (1) THE MATCHED PLAIN-TABLE NULL: arm A at table size r*m, run on the same
    curve, same seeds, same DP granularity, in the same batch. THE DECAY
    PARAMETER IS r. As r grows past the Teske threshold (about 16-20) the
    measured advantage of arm B at r over arm A at r MUST DECAY TO ZERO,
    because arm A is then already at the ideal constant and there is nothing
    left to gain. An advantage that persists at r = 96 is the canonical
    artifact tell -- it would mean arm B is beating the ideal random map, which
    IDEA-20260806-37eab9's band derivation forbids, so it falsifies the
    instrument rather than the band.
    (2) THE DERIVED CYCLE-RATE NULL: the 2-cycle rate must be the SAME in both
    arms, at 1/(m r). This is a null the mechanism itself predicts, so the
    experiment cannot be read as confirmatory on both axes at once.
    (3) RANDOM-ORACLE WALK on classes, realising the ideal constant by
    construction, as the absolute reference both arms are measured against.

  assumptions:
    - >-
      canon is idempotent under Aut: canon(sigma A) = canon(A) for all sigma.
      This requires canonicalisation on NORMALISED affine coordinates, hence an
      inversion (or batched simultaneous inversion) per step, which is charged.
    - >-
      N prime, so Aut acts freely and orbits have size exactly m
      (IDEA-20260807-ebcae6 Lemma 2).
    - >-
      Aut is F_p-rational, verified per curve, not inferred from j.
    - >-
      The generic bound KN-TECH-005 holds; the exponent is 1/2 and only
      constants and memory are at stake.
    - >-
      Toy scale, pure Python, p up to about 32 bits. Table-size claims are
      about the ALGORITHM's stored-point count, which is scale-free, but the
      cache-locality benefit that makes table size valuable is a hardware
      property that this scale cannot measure and this record does not claim
      to measure.

  proof_search_map:
    bottleneck: >-
      The number of distinct well-defined class maps realisable per stored
      table point. Everything in the proposal turns on it: if r*m distinct maps
      are not actually realised -- for instance because e and s are correlated,
      or because sigma_e collapses on some orbits -- the effective-branch claim
      fails and the table-size saving evaporates.
    baseline_embedding:
      parameter_slice: >-
        e(.) constant (always the identity automorphism). Then the construction
        degenerates exactly to the plain quotient walk with table size r, which
        is the object EXP-RHO-60da4f and KN-TECH-006 already describe.
      reproduction_check: >-
        A frozen-seed regression: with e identically the identity, arm B must
        produce a BYTE-IDENTICAL step sequence to arm A at the same r on the
        same seed. Not "similar curves" -- identical sequences. Any divergence
        is an implementation defect.
    observation_collision:
      observable: >-
        The empirical collision constant steps/sqrt(N/m).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is what makes the equivalence
        claim in (B) testable at all: arm B at r and arm A at r*m are two
        distinct algorithms predicted to have the SAME observable. That is a
        deliberate collision, and the claim is precisely that it occurs. The
        separating observable, needed so the two are not conflated in the
        write-up, is the stored-point count -- which is r versus r*m and is
        exact, not statistical. Any conclusion must report both observables
        together.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the admissible class-map family from {canonicalise then
          translate} to {canonicalise, choose an orbit element by a class
          partition, then translate}, and ask for a strict inward improvement
          in stored points at fixed collision constant rather than mere
          feasibility.
        predicted_gain: >-
          A factor m in stored points, exactly, with zero change in collision
          constant. Bounded above by m because the orbit has exactly m
          elements.
      - transform: stronger_invariant
        proposed_object: >-
          Track the pair (e_t, s_t) rather than s_t alone, so the empirical
          joint distribution can be checked for the independence the
          effective-branch count assumes.
        predicted_gain: >-
          Detects the main failure mode -- correlation between e and s making
          the realised map count below r*m -- directly rather than through its
          downstream effect on the constant.
    quantifier_order: >-
      CLAIMED: FOR EACH m in {2, 4, 6} and FOR EACH r in the tested grid with
      r*m also in the grid, THERE EXISTS a choice of the partitions (e, s) such
      that FOR ALL tested seeds and sizes the collision constant of arm B at r
      equals that of arm A at r*m within the pre-registered band.
      NOT CLAIMED: FOR ALL (e, s) -- a badly chosen e (for instance one
      correlated with s) is expected to fail, and finding which choices fail is
      part of the result rather than a refutation of it. Stating this order
      matters because the weaker universally-quantified version is false and it
      would be easy to write the claim that way by accident.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested sizes, on these curves, in this charging convention, the
        orbit-choice quotient walk attains the plain quotient walk's collision
        constant with a table m times smaller." It can NEVER certify a speed
        improvement at r >= 20 (there is none by construction), an exponent
        change, a cache-level benefit at deployment scale, or anything about
        curve models or hardware it did not run.
      nearby_object_control: >-
        THE PLAIN QUOTIENT WALK AT r >= 20, where the ideal constant is already
        attained. The method must show ZERO collision-constant gain there. A
        version of this measurement that shows a gain at r = 96 is measuring an
        artifact, because there is provably nothing left to win; this control
        is the cheapest available honesty check on the harness.
    proof_obligations:
      - claim: canon(sigma A) = canon(A) for all sigma in Aut.
        responsibility: correctness
      - claim: The step map descends to G/Aut and is memoryless.
        responsibility: interface
      - claim: r*m distinct class maps are realised.
        responsibility: feasibility
      - claim: Exponent bookkeeping (a, b) -> (u a + c, u b + d) is exact mod N.
        responsibility: correctness
      - claim: e identically identity reproduces arm A byte-for-byte.
        responsibility: baseline
      - claim: The 2-cycle rate is unchanged at 1/(m r).
        responsibility: success_probability
      - claim: No collision-constant gain is claimed at r >= 20.
        responsibility: scope

  predictions:
    - metric: >-
        collision constant of arm B at table size r versus arm A at table size
        r*m, paired on identical seeds
      direction: different
      minimum_effect: >-
        EQUAL within the bootstrap band at every (r, m) with r*m in the grid.
        This is an equivalence prediction: a difference beyond the band at any
        cell falsifies the effective-branch-count claim. Pre-registering it as
        an equality rather than an inequality is deliberate -- it is the only
        form that can fail in both directions.
    - metric: >-
        collision constant of arm B at r versus arm A at r, at r in {2, 3, 4}
      direction: lower
      minimum_effect: >-
        At least 5 percent lower at m = 6, r = 3 (where arm B realises 18
        effective maps against arm A's 3, and Teske's 3-branch penalty is about
        20 percent). Less than 5 percent means the effective-branch mechanism
        is not operating at the size where it should be largest.
    - metric: same comparison at r = 96
      direction: different
      minimum_effect: >-
        ZERO within the band, in both arms. A measured gain at r = 96 falsifies
        the instrument (see nearby_object_control), not the band.
    - metric: per-step immediate-undo rate, arm B versus arm A
      direction: different
      minimum_effect: >-
        EQUAL within a factor 1.5, at the derived 1/(m r). A change beyond that
        refutes the (B1) branch model shared with IDEA-20260807-6355c6 and is
        the more interesting outcome.
    - metric: >-
        fully charged cost per step, arm B versus arm A, in F_p multiplications
      direction: higher
      minimum_effect: >-
        Arm B must cost MORE per step (it evaluates sigma_e). The measured
        excess must be reported and the table-size saving reported net of it.
        A measurement showing arm B cheaper per step is an accounting error.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): derivations, the r >= 20 zero-gain boundary, and
      the external-literature check on negation-map step-map engineering.
      STAGE 1 (hours, HARD GATE): implement; unit-test well-definedness over
      10^4 points per family; verify the e = identity byte-identical
      regression against arm A.
      STAGE 2 (hours): the paired equivalence measurement on J0 (m = 6) at
      r in {2, 3, 4} against arm A at r in {12, 18, 24}. THIS IS THE CHEAPEST
      DECISIVE CELL: m = 6 maximises the effect and small r is where Teske's
      penalty is largest, so if the mechanism does not show there it does not
      exist.
      STAGE 3 (hours): the r = 96 zero-gain control and the cycle-rate null,
      both in the same runs.
      STAGE 4 (hours): charging and the net table-size-versus-arithmetic
      report.
    controls:
      - arm A at r*m, paired on identical seeds (blocking)
      - e = identity byte-identical regression to arm A (blocking)
      - well-definedness unit test over all m orbit elements (blocking)
      - random-oracle class walk at the ideal constant (blocking)
      - r = 96 zero-gain nearby-object control
      - derived cycle-rate null in both arms
    required_metrics:
      - collision constant steps/sqrt(N/m) with bootstrap interval, per arm,
        per r, per m, per size
      - stored-point count per arm (exact, not statistical)
      - realised distinct class-map count, measured rather than assumed
      - joint empirical distribution of (e_t, s_t), to test independence
      - per-step immediate-undo rate per arm
      - fully charged per-step cost in F_p multiplications, curve model named
      - censored fraction per cell, charged not dropped

  falsification_conditions:
    - >-
      The well-definedness unit test fails on any curve. Implementation defect;
      nothing is reported.
    - >-
      arm B at r does not match arm A at r*m within the band at any tested
      cell. The effective-branch-count claim is false as stated and the record
      is superseded rather than amended.
    - >-
      arm B shows a collision-constant gain at r = 96. Instrument failure, by
      the band derivation of IDEA-20260806-37eab9.
    - >-
      The measured 2-cycle rate differs between arms beyond a factor 1.5. The
      (B1) branch model is wrong; report the measured rates and the cycle-length
      histograms as the finding.
    - >-
      The realised distinct class-map count is materially below r*m, i.e. e and
      s are correlated. The construction is degenerate for that partition
      choice; report which choices degenerate.
    - >-
      Crashes, timeouts, memory exhaustion. INFRASTRUCTURE outcome under
      AGENTS.md rule 5, never negative mathematical evidence.

  confounders:
    - >-
      PARTITION CORRELATION. If e and s are derived from the same hash bits,
      the realised map count is below r*m and the equivalence fails for reasons
      of implementation rather than mathematics. Measured directly via the
      joint distribution.
    - >-
      NORMALISATION COST. canon requires affine coordinates, hence an
      inversion; whether it is charged per step or amortised by simultaneous
      inversion changes the per-step comparison by more than the effect.
      Convention frozen before Stage 2.
    - >-
      TABLE-SIZE UNITS. "Table size" must be reported as stored GROUP ELEMENTS
      and as bytes, since arm B stores r points but also needs the e-partition
      evaluation; a byte comparison that omits the latter flatters arm B.
    - >-
      SMALL-r VARIANCE. At r = 2 the rho length distribution is very
      heavy-tailed; medians with bootstrap intervals, not means, and cells with
      overlapping intervals are reported as indistinguishable.
    - >-
      x-COORDINATE CLASS COUNTING would make m = 4 look like m = 2 and halve
      the predicted effect on J1728 (IDEA-20260807-ebcae6 observation
      collision).

  interpretation_limits:
    - >-
      ANY MEASURED EXCESS OVER sqrt(|Aut|) -- and equally, any measured
      collision constant BELOW the ideal 1.2533*sqrt(N/m) -- IS A SUSPECTED
      INSTRUMENT ARTIFACT UNTIL THE NULL CONTROLS SAY OTHERWISE
      (RQ-EWALK-8fa147 decision_target). This record's own strongest claim is
      an EQUALITY, so a surprise in either direction is first an instrument
      question.
    - >-
      Mixing improvements affect the CONSTANT only. The constant on a class set
      of size M is bounded in [1.0, 1.2533]*sqrt(M) for any memoryless walk
      (band derivation, IDEA-20260806-37eab9), the practical headroom is
      Teske's ~20 percent between a 3-branch and an r >= 16 walk, and
      KN-TECH-006 records that the program's baseline has already spent it. At
      r >= 20 the collision-constant gain of this construction is ZERO by
      construction, and the record says so before measuring.
    - >-
      The deliverable is TABLE SIZE at fixed quality. Table size is not speed,
      and this proposal does not claim it converts into speed at any measured
      rate; the deployment argument (KN-LIT-097's FPGA area constraint) is
      context, not evidence.
    - >-
      Toy scale, pure Python. No crypto-scale validation and no hardware
      measurement (AGENTS.md rule 7).
    - >-
      The space-size ceiling sqrt(|Aut|) is untouched. This changes the
      constant multiplying sqrt(N/m), never m.

  reachability_gate: >-
    DOES NOT MOVE BETWEEN CURVES. The construction runs on whatever curve it is
    given and its magnitude is set by |Aut| of that curve, which by T4 is fixed
    by the isogeny class through D_0. On a generic curve m = 2 and the
    effective-branch gain is a factor 2 in table size, which at r >= 10 is
    below measurement resolution; the mechanism is only interesting on the
    D_0 in {-3, -4} classes, and those are reachable only if the target is
    already in one -- 0 isogeny steps, or unreachable at any cost. As with the
    rest of L6 the reachability question is degenerate, and it is recorded
    rather than omitted so that the campaign's T5 accounting stays complete.

  target_complexity:
    time_exponent: >-
      1/2, unchanged. The claim is that arm B attains the SAME constant
      1.2533*sqrt(N/m) as arm A at r*m, i.e. a zero-change claim on time.
    memory_exponent: >-
      THIS IS WHERE THE CLAIM LIVES. Per-processor working memory for the step
      table drops from r*m stored group elements to r, a factor m <= 6, at
      fixed collision constant. The distinguished-point table is unchanged and
      remains the dominant memory term in the van Oorschot-Wiener model, so the
      overall memory exponent is UNCHANGED -- this is a constant-factor saving
      in the small term, and calling it anything more would be overclaiming.
    best_known: >-
      Teske r-adding quotient walk at r >= 16-20 reaching the ideal constant
      (KN-TECH-006), with the negation/automorphism discount (KN-TECH-018,
      KN-LIT-042). This proposal matches that constant, does not beat it, and
      asks for it at a smaller table.
    hidden_overhead: >-
      No o(1); no asymptotic claim. Disclosed: the sigma_e evaluation (1-2
      field multiplications on j = 0), the normalisation inversion required by
      canon, and the fact that the cache-locality benefit which motivates the
      table-size saving is a hardware property this toy-scale measurement
      cannot observe.
    tradeoff_note: >-
      The construction trades a small amount of per-step arithmetic for a
      factor-m reduction in step-table storage at fixed walk quality. It does
      not touch the distinguished-point granularity, which remains the real
      memory/steps knob; that knob is held fixed here to isolate the effect,
      which is a limitation rather than a virtue. Memorylessness is preserved,
      so near-linear van Oorschot-Wiener parallel speedup is unaffected.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK: none is
    mounted. Dominated on TIME by every frontier row -- parallel rho with DPs
    at 0.886*sqrt(N) and O(1) memory (KN-TECH-001, KN-TECH-006), the
    automorphism-discounted CM variant at 1.2533*sqrt(N/m) (KN-TECH-018,
    KN-LIT-042), BSGS at sqrt(N) time and sqrt(N) memory, and kangaroo /
    Galbraith-Ruprai for intervals at a heuristic 1.36*sqrt(N) (KN-LIT-7437).
    On MEMORY: it does not dominate rho either, because rho's per-processor
    memory is already O(1) plus the DP table and this saving is inside the O(1)
    -- so the honest statement is that on the Pareto frontier as this program
    records it, nothing moves. On DATA/QUERIES: nothing consumed. The only axis
    on which this proposal is not dominated is a sub-axis the frontier does not
    track (step-table stored-element count at fixed collision constant), and
    saying that plainly is the point of filling this field honestly.
  sota_delta: >-
    ZERO on time. ZERO on the memory exponent. The quantitative delta is a
    factor m <= 6 in step-table stored group elements at equal collision
    constant, net of 1-2 extra field multiplications per step -- so at m = 6
    the trade is 6x fewer stored points for roughly a 10-20 percent per-step
    arithmetic increase against a Jacobian step of 11-16 field
    multiplications, and whether that is a net win is a hardware question this
    proposal does not answer. Secondary quantitative delta: 1 derived null
    (unchanged 2-cycle rate) that tests the branch model shared with
    IDEA-20260807-6355c6, and 1 pre-registered equivalence (arm B at r equals
    arm A at r*m) that can fail in both directions.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.7 that the equivalence in (B) holds within the band at m = 6 -- the
    counting argument is straightforward and the main risk is partition
    correlation, which is measured. 0.85 that the cycle-rate null holds, since
    the derivation shows the canon-selected automorphism is still uniform and
    independent of e. 0.95 that the r = 96 zero-gain control passes, and if it
    does not the harness is wrong. 0.15 that this is genuinely new against the
    external negation-map implementation literature, which is the honest number
    and the reason Stage 0's literature check is a gate rather than a courtesy.
    Overall the expected deliverable is a confirmed table-size equivalence with
    zero speed change -- a real, small, correctly-scoped result.

