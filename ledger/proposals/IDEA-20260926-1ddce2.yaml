  falsification_conditions:
    - 'P1 density grows with m by more than 5x across m = 2..4: the chained size law is not a stable fraction of the cubic dense bound; the 2^31 figure is withdrawn.'
    - 'P4 recomputation differs by more than 0.5 bit: arithmetic error, corrected in a superseding record.'
