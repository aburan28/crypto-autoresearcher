  minimal_test:
    design: >-
      CELLS. RC-1 (n = 17, t^17 + t^3 + 1, A = 97044, B = 126251) with V =
      {deg < l}, l in {9, 6, 4}; the n = 19 cell (A = 46693, B = 306147) with
