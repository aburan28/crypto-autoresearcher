  heuristic_assumptions:
    - id: H1
      statement: >-
        (Sparsity stability.) The ratio of the true descended monomial count
        of one chain link to the dense cubic bound is bounded above by a
        constant independent of n, m and l.
      rigorous_support: >-
        Each descended equation is a coordinate of a fixed cubic form in the
        field coordinates; the number of its monomials is at most the number
        of monomials of the trilinear multiplication tensor of F_{2^n}, which
        is O(n^2) per coordinate against C(2n + l, 3) = O(n^3), so the ratio
        is at most O(1/n); imitates the statement that a structured cubic
        has density at most that of a random one.
      validation_plan: >-
        SAMPLE: the counts at n in {17, 19}, m in {2, 3, 4}. COMPARISON: ratio
        against the O(1/n) bound. TAIL: the largest ratio. TRANSFER: the bound
        is unconditional; the constant is what transfers, and only as an
        upper charge.

