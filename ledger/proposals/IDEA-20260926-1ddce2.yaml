idea:
  id: IDEA-20260926-1ddce2
  question_id: RQ-ICPERF-94c86e
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE CHAINED-S_3 ORACLE AT m = 5, 6 IS WRITABLE ON ECC2K-130 WHERE THE
    UNCHAINED S_{m+1} IS NOT: the chain materialises in about 2^31 to 2^33
    monomials (dense bound, (m-1) n cubic equations in about 2n + l variables
    each) against EV-ICPERF-784b25's +40.8-bit ANF deficit for S_{m+1}, and in a
    normal basis its description is one equation per link plus rotations; so
    seam S1 is a solver question with a 2^73-bit gap to the loop, measurable as
    an ANF size law at n = 17, 19
  class: control

  claim: >-
    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, subspace coordinates plus full
    field elements for the chain nodes; the attack stage is the
    SYSTEM-FORMATION phase of the decomposition oracle (the cost paid before
    any solver runs). TARGET ARITY AND BUDGET: m in {5, 6, 8} on ECC2K-130
    against the validator's per-attempt budgets 2^13.96, 2^19.77, 2^27.37
    (producer's model, BRIEF-ROUND2 section 1) and IDEA-20260926-4b65e3's cap
    column 2^32.4, 2^37, 2^42 as the alternative. This record is a cost-column
    correction and moves neither.
    (A) THE BOUND BEING CORRECTED, EXACTLY. EV-ICPERF-784b25 charges one
    operation per monomial of the Weil-descended ANF of S_{m+1}(x_1, ..., x_m,
    x_R) with x_i in a subspace of dimension l, Boolean degree m min(m-1, l)
    (its measured law), and finds that at n = 131 the ANF exceeds the entire
    per-decomposition budget by +40.8 bits at the best viable arity, so that
    "no solver, however good, removes a term that is paid before the solver
    is called". Its own scope clause says the charge "binds every method
    that MATERIALISES the descended system" and "does not bind a method that
    never materialises it", naming that gap as the one place an escape could
    live. This record shows the gap is occupied by a method already in the
    corpus: the chained presentation of KN-TECH-b18366 materialises a
    DIFFERENT descended system for the same decomposition.
    (B) THE CHAIN'S SIZE, MY ARITHMETIC (zero compute, to be recomputed). The
    chain at arity m has (m-1) links, each S_3(u, x, v) = 0 with S_3 =
    (uxv... ) of total degree 3 in the field elements (KN-TECH-b18366:
    S_3 = (x_1 x_2 + x_1 x_3 + x_2 x_3)^2 + x_1 x_2 x_3 + b); after descent
    each link is n cubic Boolean equations in the coordinates of its three
    arguments, which are at most 2n + l Boolean variables (two full nodes and
    one base point) or n + 2l (the first link). The dense monomial bound per
    link is n x sum_{i <= 3} C(2n + l, i). At n = 131, l = 23 (the free-oracle
    optimum at m = 5, B = 2^22.76): 2n + l = 285, C(285, 3) = 3.8 x 10^6,
    per link 131 x 3.9 x 10^6 = 2^28.9, four links 2^30.9; at m = 6 (l = 22,
    B = 2^21.4 from the finding's balance) five links 2^31.2; at m = 8 seven
    links 2^31.7. Under the cap model (l = 28 at m = 5) the numbers move by
    under half a bit. The ACTUAL descended S_3 is far sparser than the dense
    bound (KN-FIND-5a8d3e's E(r) at n = 17 is a 17 x 172 matrix, i.e. 172
    monomials per equation against a dense C(18 + 17, 3) bound of 6545), so
    the true count is lower by one to two orders of magnitude; the record
    uses the dense bound as the honest upper charge.
    (C) THE KOBLITZ DESCRIPTION. On y^2 + xy = x^3 + a x^2 + 1 the coefficients
    of S_3 lie in F_2, so in a normal basis the n descended equations of one
    link are the n cyclic rotations of ONE Boolean polynomial in the rotated
    variables (IDEA-20260906-a77711 Lemma A1, equivariance): the DESCRIPTION
    of the system is one equation per link, 1/131 of the materialised size,
    while the materialised size for a solver is unchanged. This is the
    Koblitz-specific content and it is a description gain, not a cost gain;
    the record says so.
    (D) WHAT THE CORRECTION MEANS FOR SEAM S1. With the chain, the system at
    m = 5 on ECC2K-130 costs about 2^31 operations to write, which is 17 bits
    ABOVE the validator's per-attempt budget 2^13.96 and 1.5 bits BELOW
    IDEA-20260926-4b65e3's cap-locus budget 2^32.4; at m = 6 it is 11 bits
    above 2^19.77 and 6 bits below 2^37; at m = 8, 4 bits above 2^27.37 and
    10 bits below 2^42. So under the producer's model even WRITING the chain
    exceeds the budget at m <= 8, and under the cap model writing it fits at
    m >= 5 and the entire question is the solver's cost. Since the (m-1)-loop
    costs 2^{(m-1)l}/(m-1)! = 2^87.4 at (m, l) = (5, 23), the solver must beat
    enumeration by about 2^55 (cap model) or 2^73 (producer's model) per
    attempt at m = 5. This is the number the lane's algebraic-oracle
    candidates must be held to, stated in one place.
    (E) WHAT EACH OUTCOME MEANS. (i) The measured chained ANF at n = 17, 19
    follows (m-1) n x C(2n + l, 3) x (sparsity constant) with the constant
    stable in n and m (P1), and the unchained S_4, S_5 ANF follows 784b25's
    dense law (P2): the correction stands; the chained row is entered as
    "writable at m >= 5 under the cap model; solver question with a 2^55 gap".
    (ii) The chained sparsity constant grows with n or m: the size law is
    wrong and the 2^31 figure is revised in a superseding record. (iii) The
    unchained builder disagrees with 784b25's degree law: instrument defect.

  mechanism: >-
    OBJECT FRAME. Representation: R1, subspace coordinates for the base
    points and normal-basis coordinates for the chain nodes. Operation set
    Sigma: translation by factor-base elements along the chain (Class I,
    partial action, index calculus's own). TRICHOTOMY: Class I; no new
    tracked object. LOSSY-PROJECTION TEST: not applicable to a cost-column
    correction and stated rather than omitted; the chain is a different
    PRESENTATION of the same relation object, equivalent under KN-TECH-b18366's
    correctness conditions (lower chains unsatisfiable; nodes unconstrained).
    WHY THE SIZE DIFFERS. Elimination (the resultant recursion S_m =
    Res(S_{m-r}, S_{r+2})) squares the degree at each step, so S_{m+1} has
    degree 2^{m-1} per variable and descends to Boolean degree m(m-1); the
    chain keeps the intermediate x-coordinates as unknowns and never
    eliminates, so every equation stays cubic. The ANF of a cubic in N
    variables is at most C(N, 3) + C(N, 2) + N + 1, polynomial of degree 3 in
    N, against the degree-m(m-1) count sum_{i <= m(m-1)} C(ml, i). The price
    is (m-2) n extra unknowns, which is where the solving cost lives.
    KN-OPEN-020 CLASS: the subspace base, scoped-out class; unchanged.
    OFF-LIMITS COMPONENTS USED, NAMED: F2 (family); KN-TECH-b18366 (the
    chain); EV-ICPERF-784b25 (the bound being scoped). What is added: the
    chained size law at ECC2K-130's arity-m loci and its position against
    both budget columns.

