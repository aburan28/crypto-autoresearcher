      constant terms.
      STAGE 0 (zero compute): recompute (B) and (D); write the column.
      STAGE 1: extend macaulay.py's S_3 descent to a (m-1)-link chain builder
      (about 120 lines) and to unchained S_4 and S_5 builders via the resultant
      recursion of KR-IC-5a43e5 (about 200 lines; S_5 at l = 4 only, since its
      descended degree 12 in 16 variables is the largest that fits); count
      distinct monomials per equation and per system; verify every descended
      equation by evaluation against direct S_3 / S_4 / S_5 evaluation on 200
      random assignments; report P1, P2.
      STAGE 2: rebuild the chain on the Koblitz siblings in a normal basis and
      test P3.
      STAGE 3: write the corrected column beside EV-ICPERF-784b25's and both
      budget columns as an analysis note.
      OUTCOME TABLE. POSITIVE for the record: P1-P4 in band -- the chained
      row is writable and S1 is a solver question with the stated gap.
      NEGATIVE: P1 density grows with m beyond 3x -- the size law is revised
      and the 2^31 figure withdrawn. ARTIFACT: any evaluation check fails or
      P2 degrees differ from 784b25's law -- builder defect, nothing read.
      FALSIFICATION THRESHOLD, fixed now: P1 density outside [0.005, 0.5] or
      varying more than 5x; P2 degree not equal to m min(m-1, l).
      COST (estimate, order of magnitude): implementation medium (builders
      about 320 lines on macaulay.py, gf2n.py, curve.py); compute low, minutes
      per cell; the S_5 resultant at l = 4 is the largest single item. Nothing
      is missing.
