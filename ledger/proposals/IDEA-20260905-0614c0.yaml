idea:
  id: IDEA-20260905-0614c0
  title: Countermodel bases for dependencies among curve criteria
  class: mechanism
  claim: Within an explicitly defined algebraic family, a small basis of proved implications and separating countermodels
    can distinguish mathematical dependence among audit criteria from coincidence in a twenty-row comparison table.
  mechanism: 'Represent each selected criterion by a precise predicate on a common parameter space, including domain
    assumptions. Derive implications by eliminating intermediate parameters or by exact square-class identities;
    refute converse implications using parameter-matched countermodels. Start with two algebraic predicates rather
    than all eleven labels: an admissible encoding-shape witness and a formula-completeness condition. The object
    is a directed implication graph whose edges carry proofs and whose absent converses carry witnesses. Extending
    to other criteria requires a formal predicate; rhetoric about rigidity or security cannot be inserted as a Boolean
    variable without its definition. This makes independent audit obligations visible and prevents double-counting
    one theorem as two independent confirmations.'
