idea:
  id: IDEA-20260905-77d3ae
  title: A transport modulus for detectable endpoint cost valleys
  class: mechanism
  claim: 'A complexity functional C on an ordinary isogeny class admits a useful local modulus only when its endpoint
    representation can be transported with bounded description growth. Conjecture: for a chosen finite-degree relation
    presentation, the variation of log C across an edge is bounded by the logarithm of its transport and saturation
    cost; violations isolate equation-specific endpoint structure.'
  mechanism: A prime-to-N isogeny preserves the group relation, but transporting an algebraic presentation changes
    degrees, coefficients and exceptional sets. Compare the cost of the native endpoint presentation with that of
    the transported source presentation. The latter supplies an upper envelope, not an equality of optimal costs.
    A telescope along a path would constrain how deep a cost valley can be hidden from local observations. The gap
    between native and transported presentation complexity is the non-generic resource being investigated. Small
    embedding degree and anomalous trace remain class-invariant controls, never secret endpoint candidates.
