idea:
  id: IDEA-20260815-824c71
  question_id: RQ-SQISIGN-001
  added: '2026-08-15'
  title: >-
    AUDIT THE SQIsign ROUND-3 PUBLISHED-DATA SURFACE AGAINST THE KANI
    PRECONDITION PAIR, ITEM BY ITEM, WITH EVERY PUBLISHED QUANTITY
    CLASSIFIED RATHER THAN THE DESIGN JUDGED AS A WHOLE
  class: audit

  claim: >-
    GOAL-SQISIGN-002 audits the Round-3 design against the SIDH attack
    template. A whole-design verdict is hard to check and ages badly.
    Classifying every individual published quantity -- each transcript
    field, each parameter, each auxiliary value -- against the two Kani
    preconditions produces a line-by-line artifact a reviewer can dispute
    item by item.

  mechanism: >-
    Enumerate every quantity the Round-3 specification publishes. For each,
    record whether it reveals an isogeny degree, a torsion action, both, or
    neither, with the specification text cited per item.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-SQISIGN-002 objective and KN-TECH-3b593f route 2; grep
      'published-data surface', 'torsion image' (33).
    results: >-
      The goal states this audit as its objective and it is not executed
      item by item; the Kani precondition pair is recorded in KN-
      TECH-3b593f.
    verdict: >-
      ADAPTATION. Both the criterion and the design are published; the
      contribution is the item-level classification with per-item
      citations.

  object_first_candidate:
    tracked_object: >-
      EACH PUBLISHED QUANTITY of the design, classified against the two
      preconditions.
    lossiness: >-
      Classifying a quantity into four buckets discards its role in the
      protocol, which is why the specification citation travels with each
      item.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the specification is precise; items whose role is
      ambiguous are the audit's real output.

  null_object_control: >-
    NULL 1 -- SIDH's published data run through the same classification,
    which must show both preconditions met. NULL 2 -- a quantity known to be
    independent of the secret, which must classify as neither.

  discriminated_from:
    - >-
        KN-TECH-3b593f, which applies the criterion to prime-field ECDLP
        and closes it there; this applies it to one isogeny design item by
        item.
    - >-
        The cross-family triage record in this batch series, which
        classifies whole designs; this one goes item-level for a single
        design.

  assumptions:
    - >-
        The Round-3 specification is precise enough to classify each
        published quantity; ambiguous items are listed rather than assumed
        safe.
    - >-
        The two-precondition criterion is inherited from KN-TECH-3b593f
        and is not re-derived.

  predictions:
    - metric: >-
        SIDH control classification
      direction: different
      minimum_effect: >-
        FORCED to show both preconditions met; failure means the
        criterion is misapplied.
    - metric: >-
        secret-independent quantity control
      direction: different
      minimum_effect: >-
        FORCED to classify as neither.
    - metric: >-
        count of items classified ambiguous
      direction: different
      minimum_effect: >-
        The deliverable; a high count means the specification does not
        support this audit and that is worth knowing.

  minimal_test:
    design: >-
      Full item enumeration for one parameter set, both controls first.
    controls:
      - >-
          SIDH positive control.
      - >-
          Secret-independent negative control.
      - >-
          Per-item specification citation, mandatory.
      - >-
          Ambiguous items listed, never defaulted to safe.
    required_metrics:
      - >-
          Per-item classification with citation.
      - >-
          Count of ambiguous items.
      - >-
          Both control outcomes.

  falsification_conditions:
    - >-
        A control misclassifies. Criterion misapplied; audit void.
    - >-
        Most items are ambiguous. The specification does not support the
        audit and that is the finding.
    - >-
        Any item reveals both preconditions. Immediate independent review
        before anything else.

  confounders:
    - >-
        SAFE-BY-DEFAULT BIAS: classifying an ambiguous item as harmless is
        the specific error that would make this audit actively misleading.
    - >-
        VERSION DRIFT: the classification binds one specification version
        and must be re-run on revision.

  interpretation_limits:
    - >-
        Classifies published data; makes no security claim about SQIsign.
    - >-
        Inherits the two-precondition criterion without re-deriving it.
    - >-
        Scoped to one specification version and parameter set.

  heuristic_assumptions:
    - id: HEUR-SQI-ITEM-1
      statement: >-
        Every quantity relevant to Kani-style recovery appears
        explicitly in the published specification.
      rigorous_support: >-
        Rigorous ingredient: the specification defines the signature and
        verification data completely, so anything a verifier uses is
        published. THE GAP: implementation-derived quantities such as
        timing or length are not in the specification yet are
        observable, and this audit does not reach them.
      falsification_condition: >-
        An observable quantity carrying precondition information that
        the specification does not list.
      validation_plan: >-
        SAMPLE: full item enumeration plus a cross-check against what a
        reference implementation actually emits. TAIL CHECK: any emitted
        value absent from the specification. TRANSFER: none beyond the
        audited version.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic classification only.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is per-design analysis in the isogeny literature,
      deeper in argument and not item-indexed.
    hidden_overhead: >-
      Ambiguity in the specification is the dominant hidden term and
      determines whether the audit concludes anything.
    tradeoff_note: >-
      Item-level classification buys disputability and costs the ability
      to state a single overall verdict.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As analysis: dominated by published per-
    design work. As an item-level classification: none exists here. Not null
    on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an item-by-item
    classification of the Round-3 published-data surface against the Kani
    preconditions, each with a specification citation, plus an explicit
    ambiguous-item list.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that controls classify correctly. 0.5 that most items classify
    unambiguously. 0.03 that any item meets both preconditions.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-SQISIGN-001
    - RQ-SQISIGN-39f231
