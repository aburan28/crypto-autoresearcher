idea:
  id: IDEA-20261006-622d5a
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    The map x(P)+x(2P) collides on y^2 = x^3 + 5x + 7 over F_131
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. The tracked label is the field element
    x(P)+x(2P). The stage is a coordinate image-size count, not a
    collision search for a discrete log. The discrete-log exponent
    versus Pollard rho stays 1/2. Let p=131 and let E be
    y^2 = x^3 + 5x + 7 over F_p. Let M be the number of affine points
    with nonzero y. Let I be the number of distinct values of
    x(P)+x(2P) as P runs through those points. The claim is I <= M-1,
    after the model has been checked nonsingular and the point count
    has been checked different from p+1. The concrete negative is
    I = M under those same checks: every eligible point has a distinct
    sum. A singular model or a point count equal to p+1 leaves the
    comparison unmeasured. This is not a least-bit agreement, not a
    Legendre symbol, not a cross product of hit counts, not a Phi_7
    root count, and not a count of roots of two degree-4 polynomials.
  mechanism: >-
    OBJECT FRAME. The representation is the affine x-coordinate. The
    operation set Sigma is doubling on points with nonzero y, a
    partial action. Trichotomy: branching. The label x(P)+x(2P) is
    not injective on the eligible set if the claim holds, and it is
    not a homomorphism. LOSSY PROJECTION. The projection keeps one
    field element and discards y and the discrete log. A collision is
    two eligible points with the same sum. What is priced is the
    defect M-I. No factor base is proposed. F1 through F7 are not the
    lens. Summation polynomials are a fence, not the method: the
    census does not solve S_m = 0 over a factor base.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question asks whether a coordinate bias of prime-field
        addition carries discrete-log information below the square-root
        bound.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Semaev summation polynomials vanish when x-coordinates sum to
        the identity, up to signs. Using them as a decomposition is
        the index-calculus framework. This record does not decompose
        a point.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share their point count. This census is on
        one model and does not walk an isogeny.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
  assumptions:
    - p=131 is prime. The run recomputes this by trial division. This session checked that no prime at most 11 divides 131.
    - >-
      4 A^3 + 27 B^2 for A=5 and B=7 is 1823, which is 120 in F_131,
      not 0. The run recomputes it. A zero leaves the cell unmeasured.
    - Eligible points are affine with nonzero y. Infinity and the 2-torsion points are not eligible.
    - Two points that are negations of each other are two eligible points if both have nonzero y. They are not collapsed.
  predictions:
    - metric: M minus I
      direction: higher
      minimum_effect: M - I is at least 1
  minimal_test:
    design: >-
      Confirm 131 is prime. Recompute the discriminant and the point
      count. For every affine point with nonzero y, compute 2P by the
      doubling formula and by P+P, require agreement, and insert
      x(P)+x(2P) into a set. Compare the set size I with M.
    controls:
      - >-
        Nonsingularity and ordinary controls. A zero discriminant or
        a point count equal to 132 leaves the cell unmeasured.
      - >-
        Two addition methods agree on every eligible point. One
        disagreement voids the instrument.
      - >-
        Label control. Replace each eligible x by a Fisher-Yates
        shuffle of the eligible x-lifts with s_0 = 6434138 and
        s_{k+1} = (1103515245 * s_k + 12345) mod 2^31, recompute the
        image size of the shuffled labels under the same doubles'
        indices, and report it beside I. Do not write it into I.
    required_metrics:
      - M and I
      - the point count
      - the shuffled image size, reported beside I
  falsification_conditions:
    - The instrument checks pass and I = M. That equality is the negative.
    - The model is singular, or the point count equals 132. The comparison is then unmeasured.
    - The two addition methods disagree. The instrument is void.
  confounders:
    - Negation pairs share x, so they can share the sum when their doubles share x. The definition counts points, not orbits. Collapsing to orbits would measure a different integer.
    - A point counted twice because two addition methods were both inserted would inflate M. The agreement check forbids that.
  interpretation_limits:
    - A collision of this label does not lower the generic exponent 1/2 and does not recover a discrete logarithm.
    - KR-IC-5a43e5 is not a license to call this sum a summation polynomial. No factor base is defined.
    - The shuffled image size is reported beside I and is not substituted for it.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If x(2P) were independent of x(P) and uniform in F_p, the sum
        x(P)+x(2P) would collide on a set of size M when M is larger
        than about sqrt(p), by the birthday heuristic. Here p=131 and
        M is the eligible count, which is on the order of p, so a
        collision is the expected birthday outcome. The birthday
        sentence is the distribution being imitated. It is not a
        theorem about this cubic. The pre-registered prediction is
        only I <= M-1.
      rigorous_support: >-
        Doubling is a rational map. The number of preimages of one
        point is bounded by the degree. That bound does not decide
        whether the sums x(P)+x(2P) are all distinct.
      validation_plan: >-
        Compute I and M exactly at p=131. Report the shuffled image
        size beside I. If I = M, the prediction fails on this cell
        even if the shuffled labels collide. No transfer to a larger
        prime is claimed.
  target_complexity:
    time_exponent: >-
      The census is linear in p=131. The discrete-log exponent stays
      1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) set entries per eligible point, at most p of them.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) on this curve (KR-RHO-13bf67).
      Semaev summation polynomials are a decomposition framework
      (KR-IC-5a43e5), not an image-size census.
    hidden_overhead: No o(1) discrete-log term.
    tradeoff_note: No collision-search tradeoff. The output is two integers.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As an ECDLP method, counting these collisions is dominated by
    Pollard rho on this curve. The rows read were KR-IC-5a43e5,
    KR-RHO-13bf67, and KR-RHO-755e35. Summation polynomials, the
    generic square-root bound, and shared point counts across
    isogenies. None of those rows defines I. They dominate any claim
    that M-I moves an exponent.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. The
    integer added here is M-I at p=131. A positive defect is not a
    speedup factor.
