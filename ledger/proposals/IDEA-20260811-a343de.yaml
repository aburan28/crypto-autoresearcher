idea:
  id: IDEA-20260811-a343de
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-c439c2
  axis: A4
  claim_tier: toy
  title: >-
    THE ANSWER-BRANCHING FLOOR -- a SIMULATOR-FREE closure criterion, and the
    weakest possible non-simulable oracle located exactly. In the generic group
    model the group oracle transmits ZERO bits about k, so every bit an adversary
    learns must come from the augmenting oracle; pigeonholing the view against a
    k-set of size N - binom(g+2,2) gives Pr[success] <= binom(g+2,2)/N +
    2^t/(N - binom(g+2,2)) where t is the TOTAL answer-branching entropy. Hence
    ANY oracle emitting o(log_2 N) bits in total is closed at exponent 1/2
    WITHOUT EXHIBITING A SIMULATOR, and the floor log_2 N - O(1) is ACHIEVED to
    within O(m log m) bits by a single arity-m decomposition query over a
    known-log base -- so the boundary between simulable-and-closed and provably
    open is located at log_2 N bits of oracle output, tight on both sides
  class: mechanism

  claim: >-
    (A) THE OBSERVABLE. For an ECDLP instance (E, P, Q = [k]P) in the generic
    group model augmented by an oracle O, define the ANSWER-BRANCHING ENTROPY of
    an execution as
      t := log_2 ( number of distinct answer-strings O could have returned,
                   given the adversary's coins and the simulated generic
                   transcript ).
    This is NOT the raw bit-length of the answers. An oracle that returns a
    handle whose formal linear form is determined by the query's linear forms has
    t = 0 for that query even though it returns log_2 p bits of label. An oracle
    that returns one of Z candidate witnesses has t <= log_2(Z+1) for that query.
    t is the only quantity in this record and everything follows from it.

    (B) THEOREM E-1, THE FLOOR. For every adversary A making g invocations of the
    group and equality oracles and any number of queries to any augmenting oracle
    O whose total answer-branching entropy is t,
      Pr[ A outputs k ] <= binom(g+2,2)/N  +  2^t / ( N - binom(g+2,2) ).
    PROOF, COMPLETE. Run the standard lazy formal-linear-form simulation of the
    group oracle. Let NOCOLL be the event that no two formally distinct linear
    forms among the at most g+2 formed coincide at the true k; each pair
    coincides with probability exactly 1/N because a nonzero linear form over the
    field Z/N has exactly one root, so Pr[not NOCOLL] <= binom(g+2,2)/N.
    CONDITIONED ON NOCOLL the entire group-oracle transcript is a deterministic
    function of A's coins AND of the oracle answers -- it contains no other
    dependence on k, because every answer the group oracle gives is either a
    fresh label or a repeat forced by a formal identity. Therefore, for fixed
    coins, A's whole view ranges over at most 2^t values, and A's output is a
    function of its view, so at most 2^t distinct values of k are ever output.
    Under NOCOLL, k is uniform on a set of size at least N - binom(g+2,2).
    Pigeonhole gives the second term. QED.

    (C) COROLLARY E-2, THE SIMULATOR-FREE CLOSURE CRITERION, AND THIS IS THE
    USEFUL PART. If t = log_2 N - omega(1) and g = o(sqrt(N)), the success
    probability is o(1). Hence:
      ANY AUGMENTING ORACLE WHOSE TOTAL ANSWER-BRANCHING ENTROPY OVER A WHOLE
      EXECUTION IS o(log_2 N) BITS IS CLOSED AT EXPONENT 1/2, WHETHER OR NOT IT
      IS SIMULABLE, AND WITHOUT ANYONE EXHIBITING A SIMULATOR.
    This is strictly stronger than the campaign's incumbent technique in one
    direction: it closes oracles that are PROVABLY NOT SIMULABLE. Example, and it
    is not artificial -- "is x(R) a quadratic residue in F_p?" is not a function
    of lambda(R) and admits no formal simulator, but asked O(1) times it emits
    O(1) bits and is closed by E-2 on the spot. The campaign has been exhibiting
    simulators one oracle at a time; for every low-entropy oracle that labour is
    unnecessary.
    IT IS ALSO STRICTLY WEAKER IN THE OTHER DIRECTION, and the record says so
    before a reviewer does: an oracle with Z = 1 queried q = sqrt(N) times has
    t about sqrt(N) >> log N, so E-2 says nothing about it, while the formal
    simulator of KN-FIND-b7e091 closes it outright. E-2 AND THE SIMULATOR
    CRITERION ARE INCOMPARABLE; their UNION is strictly larger than either, and
    the correct operational rule is to try both.

    (D) THEOREM E-3, TIGHTNESS, AND THIS IS WHY THE FLOOR IS A CHARACTERISATION
    RATHER THAN A BOUND. The floor is achieved. Take the arity-m decomposition
    oracle over a KNOWN-log factor base: the adversary picks a_1..a_L uniformly,
    forms P_i = [a_i]P at a cost of L group operations, sets
    L = ceil((m! N)^{1/m}) so that a random target decomposes with constant
    probability, forms R = [a]P + [b]Q with b invertible, and makes ONE query
    DECOMP(R) receiving m indices. Then
      a + b*k = a_{i_1} + ... + a_{i_m}  (mod N),
    and k falls out. The answer-branching entropy of that single query is
      t = log_2 binom(L, m) = log_2 (m! N)/1 + O(1) = log_2 N + O(m log m).
    So the achieved t exceeds the floor log_2 N - O(1) by at most O(m log m)
    bits. THE BOUNDARY IS LOCATED AT log_2 N BITS AND IS TIGHT TO AN ADDITIVE
    O(m log m). Nothing weaker than log_2 N - O(1) bits can ever break the
    generic bound; log_2 N + O(m log m) bits suffice, in one query.

    (E) THE CONSISTENCY CHECK, BECAUSE E-1 AND E-3 MUST NOT COLLIDE. E-1's first
    term needs binom(g+2,2) < N/2 for the second term to be meaningful, i.e.
    g < sqrt(N). The (D) adversary uses g = L = (m! N)^{1/m} group operations,
    which is below sqrt(N) exactly when m >= 3 (at m = 2, L is about sqrt(2N) and
    the adversary is already at rho cost, so there is nothing to explain).
    THE ENTROPY FLOOR IS NON-VACUOUS PRECISELY ON THE SUB-BIRTHDAY REGIME, which
    is the regime the campaign cares about, and it degenerates exactly where the
    adversary stops being interesting. That the two thresholds coincide at m = 3
    is a check, not a coincidence, and if it had failed the record would be wrong.

    (F) WHAT THIS SAYS ABOUT THE AXIS QUESTION. The axis asks for the WEAKEST
    oracle that is provably not simulable and for where the boundary runs. In the
    ANSWER-BRANCHING coordinate the answer is now exact: the boundary runs at
    log_2 N bits of total oracle output, and the arity-m decomposition oracle at
    the index-calculus parameter sits ON it, delivering the minimum possible
    information in a single query. It is, in this precise sense, an
    INFORMATION-THEORETICALLY OPTIMAL generic-bound breaker. Every other oracle
    this campaign has considered is either below the floor (closed by E-2) or
    above it while being simulable (closed by KN-FIND-b7e091's technique). That
    is a two-sided characterisation of the campaign's own oracle zoo, obtained
    with no compute.

  resource_label: >-
    None -- this is an audit instrument, exactly as lane L12 is defined in
    DECOMPOSITION.md section 4. It consumes no non-generic resource because it
    mounts no attack. It applies to oracles labelled R1 through R8 uniformly,
    which is the point: the criterion does not care what the oracle is about.
  admissibility: admissible
  admissibility_argument: >-
    Admissible. No endomorphism is applied to any point of G and H-ENDO-001 is
    neither used nor tested. KN-FIND-b7e091 is EXTENDED, not revisited: its four
    oracle verdicts are re-derived below as a baseline-reproduction fixture and
    every one must come out unchanged, and its third category ("non-simulable but
    useless") is given the quantitative criterion it currently lacks. If any
    existing verdict changes, this record is wrong and halts.

  object_first_candidate:
    tracked_object: >-
      THE ANSWER-BRANCHING ENTROPY t -- the log of the number of answer-strings
      the oracle could have returned given the simulated generic transcript.
      Accumulated over the whole execution, it is one non-negative real number
      per algorithm.
    lossiness: >-
      MAXIMALLY LOSSY. An algorithm's entire mathematical content, the oracle's
      subject matter, the curve, the field and every scalar are projected onto a
      single real number. Uncountably many (algorithm, oracle) pairs share any
      given t, so the projection is not invertible and is emphatically not a
      change of coordinates. What is RETAINED is exactly the quantity the
      pigeonhole argument consumes, and nothing else.
    propagation: >-
      DETERMINISTIC AND ADDITIVE, which is why it is trackable. Over a sequence
      of queries t adds; over a query whose answer is determined by the simulated
      transcript t increases by 0; over an existential search of width Z it
      increases by at most log_2(Z+1); over a composition of two oracles it
      increases by at most the sum. It is discarded COMPATIBLY with the target's
      operations because group operations increase t by exactly 0 -- that is the
      content of the NOCOLL conditioning -- so the retained part still propagates
      deterministically under the group law. This is the inventor-protocol
      section 2 condition verified explicitly.
    survival_score: >-
      Survives change of curve, of prime, of field, of solver, of arity, and of
      resource label, because it is a property of the interface rather than of the
      mathematics. Dies at three places, all recorded rather than discovered
      later: (i) oracles whose answer set is not enumerable, where t is undefined;
      (ii) the preprocessing / multi-instance model, where the k-set is not
      uniform on a single N and the pigeonhole must be restated per instance
      (this is axis A3's territory and is out of scope here); (iii) success
      probabilities that are inverse-polynomially small, where "at most 2^t
      distinct outputs" is still true but the pigeonhole is loose and a
      Shannon-entropy version is needed instead.

  mechanism: >-
    STEP 1 (zero compute) -- DEFINE t PRECISELY, including the handle-returning
    case (t = 0 when the returned handle's linear form is determined) and the
    bottom/failure case (bottom counts as one answer-string).
    STEP 2 (zero compute) -- PROVE E-1 exactly as written in (B). The one step
    that needs care is the assertion that, conditioned on NOCOLL, the group
    transcript adds no branching: it must be checked that a repeat label is
    forced by a formal identity and therefore carries no k-dependence.
    STEP 3 (zero compute) -- STATE E-2 and apply it to the campaign's whole
    oracle zoo, producing a table with t beside each entry. Required entries:
    KN-FIND-b7e091's Oracles A, B, C, D; IDEA-20260807-413fcc's
    curve-measurable class; IDEA-20260807-d73e83's transport oracle;
    IDEA-20260807-569c82's pairing oracle; IDEA-20260807-fd2d89's height oracle;
    IDEA-20260807-070d03's FBMEM at arity 1 and the arity-m decomposition oracle.
    STEP 4 (zero compute) -- PROVE E-3 by exhibiting the (D) witness with its
    entropy accounting, and run the (E) consistency check on the m >= 3
    threshold. THIS STEP IS THE PROPOSAL: if the achieved t does not land within
    O(m log m) of the floor, the boundary is not tight and the record's headline
    claim is withdrawn while E-1 and E-2 survive.
    STEP 5 (zero compute) -- WRITE THE INCOMPARABILITY STATEMENT of (C)
    explicitly, with one oracle on each side, so that no reader takes E-2 to
    supersede the simulator criterion.
    STEP 6 (toy compute, OPTIONAL instrument check only) -- verify on toy curves
    that a decomposition-oracle adversary given exactly floor-many bits recovers
    k and that one given fewer does not, which is the two-directional control.

  why_not_a_renamed_known_approach: >-
    The pigeonhole itself is elementary and is not claimed as new mathematics --
    "you need log_2 N bits to name one of N things" is not a discovery. THREE
    things are claimed, and none of them is that.
    FIRST, the observation that in the GENERIC MODEL the group oracle contributes
    exactly ZERO branching conditioned on NOCOLL, which is what makes the
    pigeonhole bite at all: without it, the adversary's view has g*log_2 p bits
    and the bound is vacuous. That step is the load-bearing one and it is
    specific to the model.
    SECOND, the resulting CLOSURE CRITERION that requires no simulator. Every
    closure this campaign has issued -- KN-FIND-b7e091 included -- proceeds by
    exhibiting a simulator. E-2 closes oracles for which no simulator exists,
    which is a different proof technique reaching a different set of oracles.
    THIRD, the TIGHTNESS, which turns a bound into a characterisation: the
    known-log decomposition witness sits within O(m log m) bits of the floor, so
    the boundary is not merely bounded but located. A bound with no matching
    construction would be worth much less and would not answer the axis question.
    EXTERNAL NOVELTY IS NOT CLAIMED. Information-theoretic lower bounds on oracle
    output are standard in complexity theory and web search was unavailable this
    session; the claim is that this campaign does not have this criterion and
    would stop doing avoidable work if it did.

  predictions:
  - observable: baseline reproduction on the campaign's existing verdicts
    metric: number of KN-FIND-b7e091 and L12 verdicts CHANGED by adding the
      t column
    direction: different
    predicted: EXACTLY ZERO CHANGED VERDICTS. Pre-registered before the
      recomputation. E-2 may CLOSE additional oracles that were previously
      unadjudicated, and is expected to close at least one (the quadratic-residue
      style predicate oracles), but it must not reopen or overturn anything. One
      or more overturned verdicts means the criterion is unsound and halts the
      line.
  - observable: the achieved entropy of the known-log decomposition witness
    metric: log_2 binom(L, m) at L = ceil((m! N)^{1/m}), computed exactly for
      m in {3,4,5} and N on the ladder {2^16, 2^24, 2^32, 2^160, 2^256}
    direction: different
    predicted: log_2 N + delta with 0 <= delta <= 4*m*log_2 m at every cell. A
      delta growing with N falsifies the tightness claim in E-3 and the record
      drops to a one-sided bound.
  - observable: non-vacuity threshold in the arity
    metric: the smallest m for which (m! N)^{1/m} < sqrt(N)/2, computed exactly
    direction: different
    predicted: exactly m = 3 for all N >= 2^16. If the threshold is not 3, the
      consistency check (E) fails and the coincidence the record leans on is not
      there.
  - observable: two-directional instrument check at toy scale
    metric: measured success rate of a decomposition-oracle adversary given
      exactly floor(log_2 N) bits of answer versus one given floor(log_2 N) - 8
      bits (the oracle returns the m indices with the low 8 bits of the last
      index truncated), at p in {2^16, 2^18, 2^20}, 200 trials each
    direction: lower
    predicted: near 1 for the full-answer arm and at most about 2^-8 times that
      for the truncated arm, i.e. a measured drop by a factor between 100 and
      400. A truncated arm that still succeeds means the harness leaks k through
      a channel the entropy accounting does not see, and the measurement is void
      rather than negative.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, about ninety minutes, HARD GATE, AND IT IS THE
      CHEAPEST VALID DISCRIMINATOR IN THIS BATCH). Prove E-1 and attack it at its
      one weak joint: does conditioning on NOCOLL really leave the group
      transcript free of k-dependence when the ADVERSARY IS ADAPTIVE and chooses
      its next group operation as a function of earlier oracle answers? Write the
      lazy-sampling order of quantifiers explicitly and check. If it fails, the
      record dies for the price of an afternoon, with no curve, no solver and no
      run. Then compute the E-3 entropy exactly and check it against the floor.
      STAGE 1 (zero compute, one hour). Recompute t for every oracle on the
      campaign's books and require ZERO existing verdicts to change. This is the
      regression fixture and it is blocking.
      STAGE 2 (toy compute, <= 30 minutes, instrument check only). The truncated-
      answer experiment above, with its matched null.
      STAGE 3 (zero compute). Write the incomparability statement and the
      operational rule ("try E-2 first, it is free; fall back to exhibiting a
      simulator").
    controls:
    - >-
      NULL OBJECT (matched, blocking): an oracle with the SAME answer-branching
      entropy t whose answers are INDEPENDENT OF k -- for instance "return m
      uniformly random indices in [L], ignoring the query". It has identical t,
      identical interface, identical cost, and true information content zero. The
      measured success rate against it must be the guessing rate 1/N at every t.
      AN INSTRUMENT THAT REPORTS SUCCESS FOR THE k-INDEPENDENT ORACLE IS READING
      THE BOUND AND NOT THE OBJECT, and this null is what keeps E-1 visible as an
      UPPER bound on advantage rather than a measurement of it.
    - >-
      PLANTED SIGNAL (blocking, opposite direction): the full-answer known-log
      decomposition oracle of (D), which must succeed with probability near 1 at
      t = log_2 N + O(m log m). An instrument that cannot see this cannot see
      anything and every null it reports is void.
    - >-
      DECAY PARAMETER: the number of truncated bits, on the ladder
      {0, 4, 8, 16, 32}. The measured success rate must decay like 2^-(bits
      truncated). A success rate that does NOT decay as bits are removed is the
      canonical artifact tell and means the adversary is recovering k from
      something other than the oracle answer.
    - >-
      Hygiene: N prime (the exact 1/N per-pair root count needs it), factored
      group order and largest prime factor per curve (KN-TECH-030), #E != p
      (KN-TECH-033).
    required_metrics:
    - t per oracle, with the answer set explicitly named, for every entry in the
      campaign zoo
    - count of existing verdicts changed (pre-registered as zero)
    - log_2 binom(L,m) - log_2 N at each (m, N) cell of the tightness table
    - success rate versus bits truncated, with the k-independent null beside it
    - the smallest m with (m! N)^{1/m} < sqrt(N)/2

  controls:
  - >-
    NULL OBJECT: the k-independent oracle at matched t (returns random indices).
    Must give the guessing rate. Blocking.
  - >-
    PLANTED SIGNAL: the (D) known-log decomposition oracle at full answer width.
    Must succeed. Blocking.
  - >-
    REGRESSION FIXTURE: KN-FIND-b7e091's four verdicts and the six L12 verdicts
    on the books, all required unchanged.
  - >-
    DECAY LADDER in truncated bits, as the artifact test.

  confounders:
  - >-
    t IS AN UPPER BOUND ON INFORMATION, NOT A MEASUREMENT OF IT. An oracle can
    have t = 10*log_2 N and carry zero bits about k. Large t is grounds for
    WITHHOLDING a closure by this criterion, never for asserting an attack, and
    the k-independent null exists precisely to keep that visible. Reading a
    failed E-2 closure as evidence of usefulness is the exact inverse of the
    record's purpose and would be worse than not having the record.
  - >-
    SPECIFICATION-DEPENDENT t. Two equivalent descriptions of one oracle can have
    different apparent t if one hides a search inside a "function". The defence is
    IDEA-20260807-63056d's Q0 signature freeze, and a reviewer should re-derive t
    from the frozen signature rather than accept the proposer's number.
  - >-
    THE HANDLE-RETURN CASE IS THE EASIEST PLACE TO GET t WRONG. An oracle
    returning a group element contributes t = 0 only when the returned element's
    formal linear form is DETERMINED by the query. If it returns an element whose
    linear form is a fresh variable, t is still 0 for the answer but the
    simulator's rank grows -- a different accounting entirely, handled by
    IDEA-20260811-a28c44 and not by this record. Conflating the two would produce
    a false closure.
  - >-
    SUCCESS PROBABILITY REGIME. The pigeonhole gives a clean statement for
    constant success probability. For inverse-polynomial success the bound is
    loose and a Shannon-entropy version should be used instead; quoting E-1 at
    tiny success probabilities would understate what an oracle can do.
  - >-
    COMPOSITE N. The exact 1/N per-pair coincidence uses primality of N. A toy
    curve with composite subgroup order silently changes the first term.

  falsification_conditions:
  - >-
    The NOCOLL conditioning does not survive an adaptive adversary. E-1 is false
    as stated; the record dies at zero compute. THIS IS THE INTENDED CHEAP DEATH
    and it is the single joint a reviewer should attack first.
  - >-
    The recomputation changes any existing KN-FIND-b7e091 or L12 verdict. The
    criterion is not conservative; a criterion that reopens closed oracles is far
    more likely an error than a discovery and the line halts pending review.
  - >-
    log_2 binom(L,m) - log_2 N grows with N in the tightness table. E-3's
    tightness fails; the record survives as a one-sided floor with no
    characterisation, which is materially less valuable and must be reported as
    such rather than dressed up.
  - >-
    The smallest m with (m! N)^{1/m} < sqrt(N)/2 is not 3. The consistency check
    (E) fails and the record's claim that the floor is non-vacuous exactly on the
    sub-birthday regime is withdrawn.
  - >-
    The k-independent null oracle shows a success rate above the guessing rate.
    The harness is leaking; the measurement is void, not negative (AGENTS.md rule
    3 and rule 5).
  - >-
    The truncated-answer arm succeeds at the same rate as the full-answer arm.
    The entropy accounting is not measuring what the adversary uses, and the
    whole observable is wrong.
  - >-
    A reviewer shows E-2 is subsumed by IDEA-20260807-7270d1's q*Z = o(N)
    criterion. Then the record's contribution shrinks to the tightness result
    E-3, and it should be filed as such. (The record's own analysis says the two
    are incomparable, and exhibits an oracle on each side, so this outcome would
    mean that analysis is wrong.)

  interpretation_limits:
  - >-
    THIS IS A CLOSURE CRITERION, NOT A RESULT ABOUT ECDLP AND NOT AN ATTACK. Its
    most likely net effect is to make the campaign's negatives cheaper to obtain
    and slightly broader, and to stop the practice of hand-building a simulator
    for every low-entropy oracle.
  - >-
    E-2 closes oracles at exponent 1/2 IN THE GENERIC MODEL. It says nothing
    about the real world, where the adversary holds concrete coordinates; the
    scope limit recorded by IDEA-20260807-5876b8 cell (b) applies unchanged and
    is not weakened here.
  - >-
    E-3's witness is NOT an attack. It uses a free decomposition oracle whose
    real implementation cost is IDEA-20260807-070d03's open quantity C. The
    group-operation count N^{1/m} is real; the total cost is not sub-rho and must
    never be reported as such.
  - >-
    KN-FIND-b7e091 is binding, is used as a regression fixture, and is not
    revisited. Its "non-simulable but useless" category is given a criterion, not
    a correction.
  - >-
    Nothing here bears on H-STR-002 or on phi-stable factor bases; no
    equivariance property is used. NOT P2-adjacent. Nothing here claims any cost
    below the automorphism-discounted rho baseline; P3 is not triggered and the
    record contains no such number.
  - >-
    Toy-scale only for the Stage-2 measurement (p <= 2^20, one harness). E-1 and
    E-3 are scale-independent arguments whose support is Stage 0.

  assumptions:
  - N prime and k uniform in Z/N, independent of the adversary's coins.
  - >-
    The standard lazy-sampling formalisation of the generic group model, in which
    labels are a uniformly random injection and the simulator answers by formal
    comparison of linear forms. Cited (KN-TECH-005), not reproved.
  - >-
    The oracle's answer set is enumerable, so that "number of distinct
    answer-strings" is well defined. Oracles quantifying over unenumerable sets
    have t undefined and the criterion is SILENT about them, which is the honest
    default rather than a closure.
  - >-
    Constant target success probability. The pigeonhole form of E-1 is stated for
    that regime.
  - >-
    In E-3 the adversary knows the factor-base discrete logarithms because it
    chose them. That is what makes one query sufficient. An unknown-log base
    needs L+1 relations and the entropy accounting must be redone; that variant
    is NOT claimed to sit on the floor.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      DECOMPOSITION OCCUPANCY AT THE INDEX-CALCULUS PARAMETER. For a factor base
      of L elements with discrete logarithms uniform and independent in Z/N, a
      uniformly random target admits an m-subset decomposition with probability
      1 - exp(-binom(L,m)/N); hence L = ceil((m! N)^{1/m}) gives constant
      decomposition probability and E-3's single query succeeds with constant
      probability.
    rigorous_ingredient: >-
      THE THEOREM DOES NOT NEED IT. E-1 is a union bound and a pigeonhole and
      assumes nothing about the base. HA-1 is used ONLY in E-3, to argue that the
      floor is ACHIEVED rather than merely approached, and only to set the
      parameter L. If HA-1 fails, E-1 and E-2 stand untouched and E-3 weakens
      from "the floor is achieved" to "the floor is approached at a parameter
      that must be determined empirically". The rigorous ingredient in the
      neighbourhood is that for uniform independent logs the expected number of
      decompositions of a fixed target is exactly binom(L,m)/N, which is a
      linearity-of-expectation computation and needs no independence at all; only
      the concentration around it does.
    distribution_imitated: >-
      The classical occupancy / balls-in-bins limit for uniform independent
      placements, in the same role that Dickman-de Bruijn rho plays for
      smoothness heuristics in the exemplar profile.
    validation_route: >-
      Direct sampling at toy scale where the logs are computable. At
      p in {2^16, 2^18, 2^20} with N prime and m = 3, choose L to hit each rung
      of the ladder binom(L,m)/N in {2^-8, 2^-4, 2^-1, 1, 2, 8}, and measure the
      fraction of 200 uniformly random targets that decompose. Compare the
      empirical CDF against 1 - exp(-binom(L,m)/N). TAIL CHECK: the 2^-8 rung,
      where the predicted rate is about 0.4 percent and a systematic EXCESS would
      indicate dependence between the base and the targets -- which, if real,
      would be prime-field factor-base structure the program has not identified
      and would be escalated rather than absorbed. SAMPLED PARAMETERS AND
      TRANSFER: validated at p <= 2^20 only, with a known-log base built from
      uniform a_i; transfer to cryptographic size is NOT established by anything
      here and is not claimed.
  - id: HA-2
    statement: >-
      ANSWER-SET ENUMERABILITY FOR THE CAMPAIGN'S ORACLES. For every oracle this
      campaign has proposed or will propose in lanes L1-L13, the answer set is
      finite, explicitly describable, and its cardinality is computable in closed
      form from the oracle's frozen signature.
    rigorous_ingredient: >-
      None, and it is false in general -- an oracle quantifying over an
      unenumerable set has no t. It is an empirical expectation about the oracles
      at hand, verifiable by inspection one oracle at a time, and it is stated
      rather than assumed because a criterion silently applied to an oracle with
      undefined t would manufacture a false closure.
    validation_route: >-
      Enumerate the campaign's oracle zoo (the ten entries listed in mechanism
      STEP 3) and compute t for each from its frozen signature; count how many
      have t undefined. Two independent adjudicators compute t for three of them
      and compare, riding along with the inter-rater check of
      IDEA-20260807-63056d at no extra cost. A disagreement is a finding about
      the specification schema and not about the criterion.

  proof_search_map:
    bottleneck: >-
      The NOCOLL conditioning step in E-1's proof -- specifically, that
      conditioned on no formal collision the group-oracle transcript carries zero
      branching about k EVEN WHEN the adversary chooses its group operations
      adaptively as a function of previous oracle answers. Everything else is a
      union bound and a pigeonhole. Removing that step removes the theorem, it
      costs zero compute to check, and it is where all the attention belongs.
    baseline_embedding:
      parameter_slice: >-
        t = 0. At this slice E-1 reads Pr[success] <= binom(g+2,2)/N + 1/(N -
        binom(g+2,2)), which is Shoup's bound up to the lower-order guessing
        term. Second slice: the four oracles of KN-FIND-b7e091, whose verdicts
        must be reproduced unchanged.
      reproduction_check: >-
        SYMBOLIC at t = 0 by substitution. FROZEN FIXTURE for the verdict table:
        record the ten-row (oracle, t, verdict) table once and re-check it on
        every later use. ANY CHANGE TO AN EXISTING VERDICT HALTS THE LINE.
    observation_collision:
      observable: t, the answer-branching entropy.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, IN BOTH DIRECTIONS, AND BOTH COLLISIONS ARE
        LOAD-BEARING. FIRST: the k-dependent decomposition oracle and the
        k-INDEPENDENT random-index oracle have IDENTICAL t and opposite true
        information content. So t does not identify usefulness, only its ceiling
        -- which is why E-2 is a closure criterion in one direction only and can
        never be run backwards. That collision is the null object above.
        SECOND: an oracle with Z = 1 asked sqrt(N) times and an oracle with
        Z = sqrt(N) asked once have the same t and completely different
        simulability status -- one is closed by the formal simulator and the
        other is not closed by anything here. This is exactly the incomparability
        with IDEA-20260807-7270d1's criterion, stated as a collision rather than
        as a caveat.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Replace the binary verdict (simulable / not) with the pair (t, verdict)
        and the derived quantity t/log_2 N. The stronger state survives the
        operation that destroys the binary verdict's meaning -- namely repeating
        a query -- under which the verdict is invariant and t is not.
      predicted_gain: >-
        A closure criterion that needs no simulator, closing a class of provably
        non-simulable oracles the campaign currently cannot close at all, at zero
        compute. No attack speedup.
    - transform: boundary_lift
      proposed_object: >-
        Treat Shoup's theorem as the t = 0 boundary of a family indexed by t, and
        prove the strict inward statement for t > 0 (the conclusion weakens as t
        grows, which is the honest direction), with the incumbent recovered
        exactly at the boundary.
      predicted_gain: >-
        A one-parameter family in place of a point, with a MATCHING CONSTRUCTION
        at t = log_2 N, which is what upgrades a bound to a characterisation.
    - transform: observable_fiber
      proposed_object: >-
        Hold t fixed at log_2 N and vary the forgotten structure: which oracles
        achieve the floor? The fiber is predicted to contain exactly the
        decomposition-type oracles at the index-calculus parameter. Finding a
        STRUCTURALLY DIFFERENT oracle on the floor would be a new attack family
        and is the constructive branch.
      predicted_gain: >-
        If the fiber contains an oracle that is cheap to implement over F_p, that
        is a concrete algorithmic target. Predicted probability: low, and the
        record is filed as a criterion with a live constructive branch rather
        than as an attack proposal.
    quantifier_order: >-
      E-1: FORALL augmenting oracles O with well-defined answer sets, FORALL
        adversaries A making g group invocations with total answer-branching
        entropy t, FORALL instance distributions with k uniform on Z/N:
          Pr[A outputs k] <= binom(g+2,2)/N + 2^t/(N - binom(g+2,2)).
        The universal over O comes FIRST and does not depend on what O is about;
        that ordering is the entire content, and the weaker "EXISTS O for which
        the bound holds" would say nothing.
      E-2: FORALL O with t = o(log_2 N), the augmented problem retains exponent
        1/2. A corollary of E-1, same order.
      E-3: EXISTS an oracle O* (arity-m decomposition over a known-log base) and
        EXISTS an adversary with t = log_2 N + O(m log m) that outputs k with
        constant probability. An EXISTENTIAL, and it is realised -- which is what
        makes the floor tight rather than merely true.
      NOT CLAIMED, AND IT IS THE CONVERSE: that t >= log_2 N implies an oracle is
      useful. It implies only that THIS ARGUMENT does not close it. Reading a
      failed closure as an attack is the inverse error and would be worse than
      having no criterion.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For prime N, single instance, k uniform, in the generic group model, an
        adversary whose total answer-branching entropy is t succeeds with
        probability at most binom(g+2,2)/N + 2^t/(N - binom(g+2,2)); and this is
        tight to an additive O(m log m) bits, witnessed by one arity-m
        decomposition query over a known-log base." It can NEVER certify that a
        high-t oracle is useful, that any oracle is implementable, anything about
        implementation cost, anything about the real (non-generic) world, or
        anything about preprocessing and multi-instance models.
      nearby_object_control: >-
        THE k-INDEPENDENT ORACLE AT MATCHED t is the nearest object on which the
        hoped-for reading fails: same t, zero true information. The method
        assigns it the same bound and therefore CANNOT distinguish it from a
        genuinely informative oracle. That is the ceiling, stated before it is
        discovered. A SECOND nearby object: the PREPROCESSING model, where an
        advice string of S bits is amortised over many instances; there the k-set
        is not a single uniform N and the pigeonhole must be restated per
        instance. The method does not apply there and must not be quoted there --
        that regime belongs to axis A3 (TASK-20260811-f58f22) and this record
        makes no claim about it.
    proof_obligations:
    - claim: >-
        Conditioned on NOCOLL the group transcript contributes zero branching,
        including under an adaptive adversary.
      responsibility: correctness
    - claim: Pr[not NOCOLL] <= binom(g+2,2)/N for prime N.
      responsibility: correctness
    - claim: >-
        A's output takes at most 2^t values for fixed coins, hence the pigeonhole
        term.
      responsibility: success_probability
    - claim: The t = 0 slice reproduces Shoup and reopens no existing verdict.
      responsibility: baseline
    - claim: >-
        t(known-log arity-m decomposition, one query) = log_2 N + O(m log m).
      responsibility: size
    - claim: >-
        The (D) witness recovers k with constant probability and uses
        (m! N)^{1/m} group operations, which is below sqrt(N)/2 exactly for
        m >= 3.
      responsibility: feasibility
    - claim: >-
        E-2 and the simulator criterion are incomparable, witnessed by one oracle
        on each side.
      responsibility: scope
    - claim: >-
        The record changes no status and reopens no closed oracle.
      responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT MOVES AND NONE IS CLAIMED. The record is a lower bound
      inside a model: exponent 1/2 is retained for every oracle with
      t = o(log_2 N), and the bound is SILENT (not negative, not positive) above
      that. The one campaign object whose position is sharpened is the arity-m
      decomposition oracle, which is shown to sit exactly on the floor -- which
      is a statement about its INFORMATION, not about its cost, and its cost is
      IDEA-20260807-070d03's open C and IDEA-20260811-ae0f6f's crossover
      inequality.
    memory_exponent: >-
      The criterion itself is O(1) memory. The E-3 witness stores L = N^{1/m}
      factor-base labels, i.e. N^{1/m} log p bits, which is why it is NOT
      Pareto-comparable to rho even in the query model and is reported with its
      memory rather than without.
    best_known_baseline: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); the automorphism-
      discounted variant at a constant factor at most sqrt(6) (KN-TECH-018),
      which is baseline calibration and never an exponent; BSGS at sqrt(N) time
      and sqrt(N) memory (KN-TECH-031). Unmoved.
    hidden_overhead_disclosure: >-
      THE CRITERION HIDES IMPLEMENTATION COMPLETELY, and this is the disclosure
      that matters. An oracle can fail E-2 (so the closure does not apply) and
      still be useless because implementing it costs more than rho. That is the
      NORMAL case. E-1 must therefore always be read beside
      IDEA-20260807-070d03's cost analysis and IDEA-20260811-ae0f6f's crossover
      inequality, and a failed closure must never be read as a live attack.
      Second disclosure: t is measured on the FROZEN signature, and a
      re-specification that hides a search inside a function can lower the
      apparent t and manufacture a closure. That failure mode is real and the Q0
      freeze is the only defence.
    time_memory_tradeoff: >-
      Not applicable to the criterion. For the E-3 witness: (time N^{1/m} group
      operations plus one free query, memory N^{1/m} labels), which is off the
      rho-BSGS segment on the query axis and on it nowhere. No cryptanalytic
      tradeoff is introduced. Parallelisation: the witness's base construction is
      embarrassingly parallel and the single query is not parallelisable at all,
      which is irrelevant because it is free by assumption.

  sota_delta: >-
    ZERO against every attack baseline: 0 time, 0 memory, 0 queries, 0 data. No
    attack is mounted and none is claimed. QUANTITATIVE CONTENT INSTEAD, stated
    in the units the criterion works in. (i) The closure threshold is located
    exactly: log_2 N bits, with a matching construction within O(m log m) bits,
    so the two-sided gap is O(m log m) rather than unbounded. (ii) The criterion
    closes a class the campaign currently cannot close at all -- provably
    non-simulable low-entropy oracles -- at zero compute per oracle, replacing an
    estimated one hour of agent work per oracle under IDEA-20260807-63056d's
    declared ceiling. (iii) It changes ZERO existing verdicts, pre-registered.
    The largest number in the record is log_2 N itself, and it is a floor, not a
    speedup.
  dominated_by: >-
    AS AN ATTACK: dominated by every row of the prime-field frontier, checked
    individually, because it is not an attack. Parallel Pollard rho with
    distinguished points (0.886*sqrt(N) group operations, O(1) memory, 0 queries)
    -- KN-TECH-001, KN-TECH-006 -- dominates on every axis; automorphism-
    discounted rho on CM curves (KN-TECH-018) dominates by a further constant at
    most sqrt(6); BSGS (KN-TECH-031) at sqrt(N) time and sqrt(N) memory dominates
    on time. This record occupies no point on the frontier and `null` would be a
    fabrication under AGENTS.md rule 5.
    AS A CLOSURE CRITERION: the incumbent is the simulator-exhibition technique of
    KN-FIND-b7e091 and H-GGM-001, which dominates this on every oracle whose
    answers are voluminous but formally determined (large t, simulable), and is
    dominated by this on every oracle that is low-entropy and non-simulable. The
    two are INCOMPARABLE and the record says so rather than claiming a
    replacement. The nearest live internal competitor is
    IDEA-20260807-7270d1's q*Z = o(N) criterion, which dominates on repeated
    small-Z queries and is dominated here on single high-Z queries; the two agree
    exactly at q = 1.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that E-1 is correct -- it is a pigeonhole on top of the standard lazy
    simulation and I have written both steps out, and the residual risk is
    concentrated entirely in the adaptivity of the NOCOLL conditioning, which
    Stage 0 attacks directly. 0.85 that E-3's entropy computation lands within
    O(m log m) of the floor, since it is an exact binomial computation. 0.80 that
    the recomputation changes zero existing verdicts. 0.5 that a reviewer agrees
    the criterion is genuinely incomparable to, rather than a corollary of,
    IDEA-20260807-7270d1's Z criterion -- that is the record's main novelty risk
    and the two-oracle witness in (C) is the argument. 0.02 that anything here
    leads to an exponent, because it is a closure tool. HIGH priority regardless,
    because it is ninety minutes of derivation, it is the cheapest discriminator
    in this batch, and it is the only item in it that would be citable outside
    this program as stated.

  novelty_status: adaptation
  novelty_screen: >-
    PERFORMED 2026-08-11 against the committed proposal corpus in
    ledger/proposals/ (146 records under this goal) with the harness Grep tool.
    (1) `^  question_id: RQ-GGMB-6eaabc` -> 9 lane records, all inspected;
    IDEA-20260807-070d03 and IDEA-20260807-7270d1 read in full.
    (2) `search-to-decision|entropy|information-theoretic|bits about k|counting
    bound` case-insensitive over ledger/proposals/ -> 73 files. Inspected the
    hits that use `entropy` in a bound: IDEA-20260805-72bcb5 (NFS post-merge
    matrix entropy floor -- a STORAGE floor for a matrix, unrelated to oracle
    output), IDEA-20260808-aa551f (log2(binom(tau N, tau)) - tau*log2(N), a
    combinatorial counting statement in a different lane),
    IDEA-20260805-630606 / H-MLDSA-2ae88d (ML-DSA hint entropy, different goal),
    IDEA-20260807-df906f and IDEA-20260807-6355c6 (log2(N)-bit state
    descriptions, descriptive not bound-forming). NO record states a bound of the
    form 2^t/N on generic-model success, and no record uses oracle output
    entropy as a closure criterion.
    (3) `log_2 N bits|bits of oracle|oracle output entropy|entropy floor|
    minimum number of bits` over ledger/ -> 10 hits, all accounted for above.
    (4) The nearest conceptual art is IDEA-20260807-7270d1's q*Z = o(N), which
    bounds a SIMULATOR'S ERROR PROBABILITY; this record bounds the ADVERSARY'S
    INFORMATION and needs no simulator, and section (C) exhibits one oracle on
    each side to show the two criteria are incomparable.
    EXTERNAL NOVELTY IS NOT ESTABLISHED: WebSearch and WebFetch both failed this
    session with a backend model error, so no external literature was checked.
    Pigeonhole information bounds are elementary and standard and this record
    does NOT claim to have invented one; it claims the campaign lacks the
    criterion and the tightness result. novelty_status: `adaptation`.
  discriminated_from: >-
    IDEA-20260807-7270d1 (graded simulability by existential width Z) is the
    nearest record and the discrimination is exact. -7270d1 bounds the FORMAL
    SIMULATOR'S ERROR at Z/N per query and concludes a closure holds iff
    q*Z = o(N); it therefore requires a simulator to exist and grades how wrong
    it is. This record bounds the ADVERSARY'S OUTPUT ENTROPY and concludes a
    closure holds if t = o(log_2 N); it requires no simulator and applies to
    oracles for which none exists. The two criteria are INCOMPARABLE, witnessed
    by two oracles: (a) Z = 1 asked q = sqrt(N) times, closed by -7270d1
    (q*Z = sqrt(N) = o(N)) and NOT closed here (t about sqrt(N) >> log N);
    (b) a quadratic-residue predicate on x(R) asked O(1) times, which admits no
    formal simulator so -7270d1's grading is undefined, and is closed here
    immediately (t = O(1)). They AGREE exactly at q = 1, where q*Z = o(N) and
    t = log_2 Z < log_2 N say the same thing -- and that agreement at the
    index-calculus parameter is a consistency check this record passes rather
    than an overlap it hides. IDEA-20260807-070d03 measures the COST C of one
    decomposition; this record measures its INFORMATION and shows it is minimal;
    the two are orthogonal coordinates on the same object and neither is complete
    without the other. IDEA-20260807-5876b8's four cells classify oracles by
    simulability and self-computability; t is a third, numeric coordinate that
    cuts across all four cells (cell (b) oracles can have any t) and refines none
    of them. IDEA-20260806-530fdd's AOM_d grades simulator OVERHEAD by algebraic
    degree; overhead is work and t is information, and an oracle can have
    unbounded degree with t = 0. IDEA-20260811-a28c44 (this batch, FB-GGM) closes
    a state-CREATING primitive by exhibiting a simulator; that primitive has
    t = 0 and is therefore ALSO closed by E-2, which is a cross-check between two
    records of this batch rather than a duplication -- a28c44's content is the
    rank-(s+2) simulator and the taxonomy split, not the closure verdict.
    KN-FIND-b7e091 is binding, is used as a regression fixture that must come out
    unchanged, and is not revisited.
