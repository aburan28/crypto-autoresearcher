idea:
  id: IDEA-20261005-f1b0af
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    One degree-3 x-coordinate on an ordinary curve over F_7 has a
    strictly smaller minimal-polynomial weight than the matched-order
    null curve over F_{343}.
  class: measurement
  claim: >-
    Let q = 7 and n = 3. Let E be the lexicographically first ordinary
    short-Weierstrass curve over F_7. Let x_E be the first affine
    x-coordinate of a point of E(F_{343}), in lexicographic order of
    the monomial basis of the first monic irreducible cubic over F_7,
    whose minimal polynomial over F_7 has degree 3. Let E' be the
    lexicographically first ordinary short-Weierstrass curve over
    F_{343} whose j-invariant is outside F_7 and whose rational-point
    count equals #E(F_{343}). Let x_{E'} be the first degree-3
    x-coordinate on E' under the same order. Let w be the number of
    nonzero coefficients of the monic minimal polynomial, including
    the leading 1. The claim is w(x_E) < w(x_{E'}). This is one
    integer comparison. It is not a relation collection and it does
    not change an ECDLP exponent.
  mechanism: >-
    Both minimal polynomials have degree 3 by the selection rule, so
    a smaller weight is sparsity beyond the orbit-size alternative
    {1, n}. If w(x_E) < w(x_{E'}), this one object coordinate is
    sparser over F_7 than the null coordinate at matched field and
    matched full rational-point count. If w(x_E) ≥ w(x_{E'}), this
    coordinate shows no such sparsity. Neither outcome prices a
    pipeline stage and neither is a rho timing.
    OBJECT FRAME. Representation: R1, the affine x-coordinate in
    F_{q^n}. Operation set Sigma: the q-power map σ(x) = x^q.
    Sigma is not translation on E. TRICHOTOMY: partial-action.
    Reason: the minimal polynomial is constant on the Frobenius
    orbit and does not propagate under a general translation.
    LOSSY-PROJECTION TEST against Sigma = ⟨σ⟩. Discarded: the sign
    y, the discrete logarithm, and the ordered coefficients
    themselves. Retained: the weight. Weight is constant on a
    Frobenius orbit, and many orbits share a weight, so the
    projection is lossy. It is not a change of coordinates. No
    factor base is proposed, so no KN-OPEN-020 escape class is
    claimed. The dimension of a shift-invariant descended quadratic
    is not computed, and Frobenius-stable subspaces are not
    enumerated.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-002
      provenance: internal
      claim: >-
        The opened note reports heuristic time O~(q^{4/3}) for ECDLP
        over GF(q^3) by point decomposition. The paper PDF was not
        opened. That exponent is not claimed here.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-002.md
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        The opened frontier row states that Frobenius-invariant
        factor bases reduce the number of systems by up to 1/n and
        speed linear algebra by n^2. This idea does not run either
        reduction.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KN-FIND-b9a41d
      provenance: internal
      claim: >-
        The opened finding classifies sigma-stable F_q-subspaces by
        monic divisors of T^n - 1 and treats the resulting gain as a
        constant factor. This idea does not list those divisors.
      verified_by: idea-generator, this session, via knowledge/findings/KN-FIND-b9a41d.md
    - ref: KN-LIT-010
      provenance: internal
      claim: >-
        The opened note is an experimental Weil-descent and Semaev
        study. It says specific measured degrees were not extracted
        in the note. No degree from that note is reused as data.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-010.md
  assumptions:
    - The first monic irreducible cubic over F_7 is the defining polynomial of F_{343}. Lexicographic order uses coefficients in {0, 1, ..., 6} on the basis 1, z, z^2.
    - Both selected x-coordinates have degree 3 over F_7. A point whose x has smaller degree is skipped.
    - E' matches #E(F_{343}) and is ordinary, and j(E') is not in F_7.
  predictions:
    - metric: w(x_{E'}) - w(x_E)
      direction: higher
      minimum_effect: 1
  minimal_test:
    design: >-
      Build F_{343}. Select E and x_E, then E' and x_{E'}, as in the
      claim. Compute both monic minimal polynomials by linear algebra
      on {1, x, x^q, x^{q^2}} over F_7. Count nonzero coefficients.
      Compare. Do not descend a summation polynomial, do not build a
      factor base, and do not run rho.
    controls:
      - Both minimal-polynomial degrees equal 3. Any other degree restarts the point scan.
      - j(E) lies in F_7 and j(E') does not.
      - '#E(F_{343}) = #E''(F_{343}), and p = 7 divides neither trace.'
      - Applying σ to x replaces the minimal polynomial by itself. A change means the polynomial was not the orbit polynomial.
    required_metrics:
      - object_weight
      - null_weight
      - object_degree
      - null_degree
      - matched_point_count
  falsification_conditions:
    - w(x_E) ≥ w(x_{E'}) when both degrees equal 3, equivalently w(x_{E'}) - w(x_E) ≤ 0.
    - E(F_{343}) has no x-coordinate of degree 3.
    - No ordinary E' over F_{343} has j outside F_7 and the same rational-point count as E.
    - Sigma changes the computed minimal polynomial of either selected x.
  confounders:
    - Weight includes the leading 1. Dropping it shifts both weights by 1 and can fake a gap only if one polynomial is mishandled.
    - A null curve with j in F_7 is a second subfield curve. The j-test rejects it.
    - Matching the full rational-point count is not matching a prime-order subgroup. A gap at this N is about two field elements.
  interpretation_limits:
    - A weight gap of 1 on one coordinate is sparsity of one polynomial. It is not a change in solving degree, relation yield, or linear-algebra dimension.
    - The n-fold orbit alternative is already removed by requiring degree 3 on both sides. The comparison does not re-measure that factor.
    - This measurement does not change an ECDLP exponent. The opened heuristic O~(q^{4/3}) and the factor-base factors 1/n and n^2 are not claimed.
    - RQ-FROB-7d8dd4 asks for a stage-charged pipeline against Frobenius-class rho. This record is one integer at (7, 3) and does not answer that full comparison.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        The weight of the monic minimal polynomial of a degree-n
        element imitates the Hamming weight of a uniform random monic
        polynomial of degree n over F_q, whose mean is
        (n + 1)(1 - 1/q). For (q, n) = (7, 3) that mean is 24/7.
        The sample is two degree-3 elements at this single pair
        (q, n). No transfer to another extension is claimed.
      rigorous_support: >-
        The minimal polynomial of a field element is monic of degree
        dividing n, so a degree-3 polynomial has weight in
        {1, 2, 3, 4}. That bound is the rigorous part. Uniformity
        among monic polynomials is the imitation.
      validation_plan: >-
        Record both weights. Reject the run if either weight falls
        outside {1, 2, 3, 4} or either degree is not 3. Compare the
        two weights. No further sample and no tail beyond that
        interval check.
  target_complexity:
    time_exponent: >-
      Polynomial in q^n at the fixed pair q = 7, n = 3, a field of
      343 elements. The heuristic exponent 4/3 in q from KN-LIT-002
      is not claimed.
    memory_exponent: O(n) coefficients with n = 3, plus the points needed to match one group order.
    best_known: >-
      KN-LIT-002, opened note: heuristic O~(q^{4/3}) on GF(q^3).
      KR-IC-b0fcda, opened row: a factor up to 1/n on the number of
      systems and n^2 on linear algebra. Rho at this field size is
      on the order of q^{n/2} = q^{3/2}. None of these is claimed.
    hidden_overhead: >-
      No o(1) term. The output is one difference of two integers in
      {1, 2, 3, 4}.
    tradeoff_note: >-
      No time-memory tradeoff and no parallel collision search. One
      linear algebra of size n = 3 on each arm.
