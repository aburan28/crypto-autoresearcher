idea:
  id: IDEA-20260905-31d01b
  title: A resource monotone that distinguishes reversible evaluation from graph access
  class: representation
  claim: Two isogeny cost models can share a per-step arithmetic count yet fail to admit a cost-preserving translation
    because one erases intermediate data and the other must retain or recompute it; a dependency-graph pebbling
    certificate can expose this non-transferability.
  mechanism: Abstract a supplied mathematical evaluation into a dependency directed acyclic graph whose vertices
    carry exact output widths and whose edges indicate required inputs. Classical evaluation may delete obsolete
    values. Reversible evaluation must uncompute garbage while preserving the named interface. Track live information
    across graph cuts and record recomputation count separately from arithmetic work. The proposed object is a width-weighted
    pebbling constraint system with typed interfaces, not an isogeny algorithm. Its purpose is to prove lower bounds
    on any claimed translation under an explicit scheduling model, or demonstrate that a supposedly shared cost
    unit omits a resource.
  question_id: RQ-CSIDH-64343f
  question_ids:
  - RQ-CSIDH-64343f
  - RQ-SSIQ-9702af
