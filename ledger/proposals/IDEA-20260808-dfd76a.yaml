  title: 'The frozen source''s affected list omits its own reference [6]: a trusted setup
    whose entire purpose is producing a supersingular curve of unknown endomorphism ring must
    now be sized against p^{1/3+o(1)}, and a cascade census finds three further consumers
    the paper''s scope statement does not name.'
  class: composition
  claim: 'The frozen source names as affected the CGL hash [14], the SQIsign family, GPS [28],
    PRISM [5] and tensor-MIKE [39] (line 31), and as safe all group-action constructions and
    torsion-based key exchanges (lines 33-37). CLAIM: the affected list is incomplete in a
    specific, checkable way, and the omission is findable from the paper''s own bibliography.
    Candidates, each with the named reduction that carries it: (1) "Supersingular Curves You
    Can Trust" [6] -- cited by the paper itself at line 193 for its mixing lemma. Its deliverable
    is a curve of UNKNOWN endomorphism ring; an adversary who can compute End at p^{1/3+o(1)}
    defeats the setup''s purpose directly, with no reduction needed. The paper cites [6] and
    does not list it. (2) CGL COLLISION resistance [14]: a collision is a cyclic smooth-degree
    endomorphism of the base curve. The route is OneEnd -> EndRing ([35, Thm 1]) -> KLPT ->
    a 2-power-degree ideal -> the isogeny; all polynomial given End, so collision resistance
    inherits p^{1/3+o(1)}. The paper lists CGL as affected but does not say through which
    of its properties or by which reduction, and preimage and collision travel by different
    routes. (3) The ORIENTED problems reachable through the unconditional equivalence network
    of [33], which the paper cites at line 127 for the network but never uses for scope. DELIVERABLE:
    a cascade table -- target problem, named reduction, its overhead exponent, whether p^{1/3+o(1)}
    survives, and which of SC-1 (GRH) and SC-3 (non-inheritable concrete cost) attaches.'
  mechanism: 'This is the A6 move of the target-result profile applied in reverse: instead
    of proving one thing and citing reductions for the rest, take the proved thing and enumerate
    everything the published reduction network carries it to. The frozen source performs that
    move once (Corollary 1.2) and stops. The census is a bibliography-driven enumeration over
    the network built by [23, 45, 35, 33] (line 127), and its correctness is a matter of naming
    the right reduction for each edge, not of new mathematics.'
  why_not_a_renamed_known_approach: The paper's own Section 1.1 is the nearest prior art and
    this record is explicitly an audit of it. Corpus-side, IDEA-20260806-62ba9d costed the
    OneEnd -> EndRing -> Isogeny chain; catalogue B1-11 audits KN-OPEN-024's PIP descent.
    Neither enumerates consumers, and no corpus record has noticed that [6] is cited by the
    paper for a lemma while being absent from its scope list.
