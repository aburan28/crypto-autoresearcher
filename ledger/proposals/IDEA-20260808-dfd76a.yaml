  - observable: the GRH attachment
    metric: which rows require GRH
    predicted: Every row reached through [35, Proposition 8.5] does, per SC-1. The census
      must not silently drop it, which is the error DEC-20260805-be2f87 found this campaign
      making throughout.
  minimal_test: Zero compute, one document. (i) String-check the affected and safe lists.
    (ii) For each candidate consumer, name the reduction edge and its stated conditions. (iii)
    Produce the table with an explicit "NOT VERIFIED" column for every reduction this program
    has not read -- which is currently all of them ([35] is not in this repository; KN-TECH-058
    records that the cascade is inherited, not checked).
  controls:
  - 'SCOPE CONTROL (must not fire): run the identical census on the SAFE list (CSIDH, qt-Pegasis,
    M(D)-SIDH, FESTA, POKE). Every row must return ''other cryptanalysis dominates'' with
