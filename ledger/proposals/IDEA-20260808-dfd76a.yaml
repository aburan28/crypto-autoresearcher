    a verdict, so that omissions are visible.'
  confounders:
  - 'Whether [6]''s trusted setup is ''affected'' depends on its threat model: if the setup''s
    guarantee is against the PARTICIPANTS rather than against an unbounded external adversary,
    a p^{1/3} external attack may be out of its model. The census must state each consumer''s
