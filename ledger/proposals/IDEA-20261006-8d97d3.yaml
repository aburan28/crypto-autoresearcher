  assumptions:
    - Composition of additive polynomials is substitution of maps. In characteristic 3 the freshman's dream expands a q-power of a sum.
    - For Delta in F_3, Delta^3 = Delta and Delta^9 = Delta, so the leading term of the square is Delta squared times x^81.
    - Delta squared equals Delta in F_3-star exactly for Delta = 1. Both 1 and 2 square to 1.
    - No formula for a j-invariant is an input. Equality of leading coefficients is not a count of isomorphism classes.
    - The rank-3 neighbor is tau^2 + tau^3. The disagreeing control is tau^2 + 2 tau^3, still A-characteristic (T), rank 3, coefficients in F_3.
  predictions:
    - metric: number of the six modules whose square leading coefficient equals Delta
      direction: different
      minimum_effect: 3
    - metric: Carlitz indicator that the square leading coefficient equals 1
      direction: different
      minimum_effect: 1
    - metric: indicator for tau^2 + tau^3 that the square leading coefficient equals 1
      direction: different
      minimum_effect: 1
    - metric: indicator for tau^2 + 2 tau^3 that the square leading coefficient equals 2
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      For each of the six polynomials, substitute p(x) = g x^3 +
      Delta x^9 into itself and read the coefficient of x^81. Score
      equality with Delta. Do the same for x^3, for x^9 + x^27, and
      for x^9 + 2 x^27, reading the coefficient of the highest
      monomial that substitution actually produces. Compare that
      coefficient with the input leading coefficient. Do not divide
      by Delta, do not form a j-invariant, and do not count classes.
    controls:
      - Carlitz x^3 composed with itself. The prediction is leading coefficient 1, equal to the input. A different leading coefficient falsifies the substitution at rank 1.
      - Neighbor x^9 + x^27. The prediction is square leading coefficient 1, equal to the input. This is the same-rank object on which equality holds.
      - Control x^9 + 2 x^27. The prediction is square leading coefficient 1, unequal to 2. Equality on this control supports the idempotent reading and falsifies the claim.
      - The three modules with Delta = 1 must be the successes, and the three with Delta = 2 the failures. A success with Delta = 2 is a negative.
    required_metrics:
      - square_leading_coefficient_six
      - equality_count
      - carlitz_square_leading
      - neighbor_rank3_leading1_square
      - control_rank3_leading2_square
  falsification_conditions:
    - The number of equalities among the six is not 3 while substitution was used.
    - A module with Delta = 2 has square leading coefficient 2, or a module with Delta = 1 has square leading coefficient other than 1.
    - The Carlitz square leading coefficient is not 1.
    - The neighbor tau^2 + tau^3 has square leading coefficient other than 1.
    - The control tau^2 + 2 tau^3 has square leading coefficient 2. The idempotent reading then survives at rank 3 and the claim fails.
  confounders:
    - Ordinary commutative multiplication of polynomials, ignoring that composition is substitution, produces a different degree and a different leading term. The test uses substitution.
    - Reducing the square modulo x^27 - x destroys the x^81 term before it is read. The coefficient must be read in the polynomial ring.
    - Quotienting the leading coefficient by a recalled j-formula is a different integer and is not this metric.
  interpretation_limits:
    - The count 3 is a count of modules, at q = 3 only. It is not a class number and not an isogeny-class count.
    - Equality of leading coefficients does not decide isomorphism. No isomorphism search is performed.
    - The rank-3 control with leading coefficient 2 is outside the six. It is the nearby object on which equality is predicted to fail.
    - No ECDLP exponent is in scope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For Delta in F_3, the leading term of (g x^3 + Delta x^9)
        composed with itself is Delta squared times x^81. This imitates
        Fermat, Delta^9 = Delta, together with the freshman's dream in
        characteristic 3. The sample is the six modules and the three
        controls. No extrapolation to a larger constant field, where a
        leading coefficient need not satisfy a^9 = a.
      rigorous_support: >-
        Substitution and the freshman's dream are identities in
        characteristic 3. Fermat on F_3 is the splitting of X^3 - X.
        KN-LIT-174 and KN-LIT-1515 state neither identity. A recalled
        j-formula is not an input, so it is not support.
      validation_plan: >-
        Expand all six substitutions and both rank-3 substitutions in
        the polynomial ring and read the highest coefficient. Compare
        each with the product of the input leading coefficient by its
        ninth power. Any disagreement withdraws the expansion, and the
        equality count is not scored. Tail check: all six pairs are
        expanded, not a sample of them. The Delta = 2 rank-3 control
        is required; without it the idempotent reading is untested.
  target_complexity:
    time_exponent: >-
      No ECDLP exponent is in scope. The census is 9 polynomial
      substitutions of degree at most 27 into degree at most 27.
    memory_exponent: >-
      One polynomial of degree 729 for the rank-3 square, and degree
      81 for each rank-2 square. Constant memory at this size.
    best_known: >-
      Direct substitution. Opened baselines do not give a leading
      coefficient for these squares.
    hidden_overhead: >-
      None. No smoothness weight and no o(1) term. Degrees are exact.
    tradeoff_note: >-
      No time-memory tradeoff. Each square is expanded once.
