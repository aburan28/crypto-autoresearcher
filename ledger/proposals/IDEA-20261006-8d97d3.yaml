idea:
  id: IDEA-20261006-8d97d3
  question_id: RQ-DRINF-6b5a9d
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Leading coefficient of the composition square against the leading
    coefficient of Phi_T, for the six modules and two rank-3 controls.
  class: measurement
  claim: >-
    For Phi_T = g tau + Delta tau^2 the composition Phi_T composed with
    itself has tau-degree 4 and leading coefficient Delta squared.
    Exactly 3 of the six modules satisfy Delta squared = Delta, and
    they are the three with Delta = 1. The Carlitz square of tau is
    tau^2, whose leading coefficient equals 1. The rank-3 neighbor
    tau^2 + tau^3 has square leading coefficient 1, equal to its own
    leading coefficient. The rank-3 control tau^2 + 2 tau^3 has square
    leading coefficient 1, which is unequal to 2. No j-invariant is
    formed. No ECDLP exponent is in scope.
  mechanism: >-
    The elliptic analogy still open is the normalisation datum an
    isomorphism would have to absorb: the leading coefficient of a
    division polynomial, here the composition square, versus the
    leading coefficient of Phi_T. Two explanations. Idempotent reading:
    every leading coefficient in F_3-star is fixed by squaring, so all
    six equalities hold. Frobenius reading: the twisted rule sends the
    leading term Delta tau^2 to Delta times Delta to the ninth, times
    tau^4, and Delta to the ninth equals Delta, so the new coefficient
    is Delta squared, which equals Delta exactly when Delta = 1. The
    count 3 decides. The two rank-3 controls share the rank and differ
    in the leading coefficient, so a match between them would say rank
    is what matters, while a split says the leading coefficient is
    what matters. LOSSY-PROJECTION TEST. Ambient object: Phi_T in the
    twisted polynomial ring. The projection keeps the leading
    coefficient of the composition square and discards g together with
    every lower term of the square. Operation set Sigma is composition
    of additive polynomials. The leading term multiplies by the
    substitution rule, so the retained coefficient propagates. The
    projection is lossy because the three modules with a fixed Delta
    and varying g produce one and the same leading coefficient.
