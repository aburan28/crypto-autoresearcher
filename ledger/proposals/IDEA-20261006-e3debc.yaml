idea:
  id: IDEA-20261006-e3debc
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Mean absolute trace of y(P) minus y(π(P)) versus y(P) minus y(P+T)
    on y^2 = x^3 + 2x + 5 over F_{29^2}
  class: control
  claim: >-
    On E: y^2 = x^3 + 2x + 5 over F_29, let S be the affine points of
    E(F_{29^2}) whose x-coordinate is not in F_29 and for which π(P) is
    distinct from P and from -P. Let M_frob be the mean, over P in S, of
    the absolute value in 0..14 of the integer representative of
    Tr(y(P) - y(π(P))), the relative trace onto F_29. Let T be the first
    affine point in lexicographic order. Let S_shift be the points of S
    for which P+T is affine and distinct from P, and let M_shift be the
    same mean of Tr(y(P) - y(P+T)) on S_shift. The claim is |S| >= 40,
    |S_shift| >= 40, and M_frob + 1 <= M_shift. The discrete-log time
    exponent stays 1/2 and the delta versus Pollard rho is 0.
  mechanism: >-
    Two explanations are distinguished before any mean is seen.
    Explanation A: the y-coordinate difference against the Frobenius
    image has the same mean absolute trace as the difference against a
    frozen translation, so M_frob + 1 > M_shift. Explanation B: the
    endomorphism pulls that difference toward a thinner trace, short by
    at least 1. The claim is explanation B. OBJECT FRAME. Representation:
    the trace of a difference of y-coordinates. Operation set Sigma: the
    coordinate 29-power. Sigma is not translation. The measured object is
    a mean of integers in 0..14, not a trace-zero proportion of three
    x-coordinates. F1 and F3-F7 are not used.
  novelty_status: unverified
  citations:
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A group morphism onto F_2 produces a linear polynomial on
        ordinary binary curves. This proposal measures a mean absolute
        trace in odd characteristic and does not claim that morphism.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Gaudry's fixed-n cost is Õ(q^{2-2/n}). No smaller exponent is
        claimed here.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        Frobenius classes give a sqrt(2m) rho speedup on binary Koblitz
        curves. This proposal does not walk classes.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
  assumptions:
    - Either sample under 40 voids the run.
    - The integer representative of a trace value in F_29 is its lift in 0..28, and the absolute value is the distance to 0 or to 29, hence an integer in 0..14.
    - The modulus of F_{29^2} is the least monic quadratic over F_29 with no root, recorded before the means.
  proof_search_map:
    bottleneck: not_applicable
    constructive_transforms: []
    proof_obligations: []
    not_applicable_reason: >-
      Mean comparison on one toy curve. It does not certify an exponent.
  predictions:
    - metric: mean absolute trace of y(P) - y(π(P)) against the same mean for y(P) - y(P+T)
      direction: lower
      minimum_effect: "M_frob + 1 <= M_shift, with both samples at least 40"
  minimal_test:
    design: >-
      Confirm the discriminant of y^2 = x^3 + 2x + 5 is nonzero in F_29.
      Enumerate affine points of E(F_{29^2}). Compute the two means as
      rational numbers. Toy scope is n=2 and q=29 only.
    controls:
      - The trace of every sampled difference lands in F_29.
      - On 20 points, Tr(y^29) equals Tr(y).
      - A second addition agrees on P+T for 20 points.
      - Both sample sizes are at least 40.
    required_metrics:
      - "|S| (integer)"
      - "|S_shift| (integer)"
      - M_frob (rational)
      - M_shift (rational)
  falsification_conditions:
    - Both samples have size at least 40 and M_frob + 1 > M_shift, which selects explanation A on this instance.
    - Either sample has size under 40.
    - Any sampled trace leaves F_29.
    - Any of the 20 trace or addition checks fails.
  confounders:
    - T may lie in a small subgroup. T is recorded. A second translation 2T is reported and does not choose the row.
    - Points with y = 0 contribute a trace of y(π(P)) or of y(P+T). Their count is reported and does not choose the row.
  interpretation_limits:
    - Toy scope only. A mean gap of 1 does not drop a variable at general n.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0.
    - This is a mean of absolute traces of y-differences. It is not a trace-zero proportion on summing triples.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The absolute value of a uniform trace onto F_29 has mean 7.5 on
        the balanced model that puts mass 1/29 at 0 and 2/29 at each of
        1..14. Explanation B says the Frobenius differences fall short of
        the translation differences by at least 1. The balanced mean is
        the model being imitated. The shortfall is unproved.
      rigorous_support: >-
        A uniform element of F_29 has a known absolute-value mean under
        the fold 0..14. KR-IC-f5c584 gives a linear equation in
        characteristic 2 and does not give this mean.
      validation_plan: >-
        The minimal test is the measurement. Tail check: split S into the
        first and second half of the frozen order and require both half
        means to lie within 0.5 of M_frob. A larger split does not choose
        the row.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "0 in the group order; one pass stores two running sums"
    best_known: >-
      Pollard rho at exponent 1/2. The characteristic-2 linear factor in
      KR-IC-f5c584 is a solving-degree fact in another characteristic,
      not a smaller exponent for this curve.
    hidden_overhead: >-
      No o(1) term. The margin 1 is an absolute difference of means on
      one field of 841 elements.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0. No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-f5c584, KR-IC-46d822, KR-IC-5a43e5, KR-IC-b0fcda, and
    KR-RHO-037e22. None dominates: f5c584 is a characteristic-2 morphism
    onto F_2, 46d822 is Gaudry's exponent, 5a43e5 is the summation
    polynomial, b0fcda is an n-fold factor-base symmetry, and 037e22 is
    a rho class walk. None states a mean-absolute-trace gap of 1 for
    y(P) - y(π(P)) on this curve.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus Pollard
    rho is 0. The pre-registered margin is 1, an absolute difference of
    means of integers in 0..14, on one curve over a field of 841 elements.
  prior_art:
