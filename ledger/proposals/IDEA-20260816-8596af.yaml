idea:
  id: IDEA-20260816-8596af
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-16'
  title: 'A reduction quoted asymptotically and used as if tight has a ledger of forgiven factors:
    enumerate every constant, lower-order term and absorbed inequality dropped along a chain of game
    hops, multiply them, and report the accumulated amnesty as one number in bits with an audit trail
    naming where each factor was forgiven.'
  class: measurement
  claim: '(A) OBJECT. A chain of reductions is written as a sequence of steps, each of which replaces
    one expression by another that is claimed to be no smaller. The tracked object is the AMNESTY
    MULTISET: for each step, the ratio between the expression that was replaced and the expression
    that replaced it, expressed in bits, together with the step''s identifier and the reason the drop
    was made (absorbed constant, big-O suppression, union bound over a small set, worst-case substitution
    for an average, or a stated inequality applied loosely). (B) CLAIM. The accumulated amnesty is
    the sum of the multiset in bits, it is computable exactly once the chain is written at step granularity,
    and it is a DIFFERENT quantity from the reduction''s tightness loss as usually quoted: the quoted
    loss is a factor that appears in the final inequality, whereas amnesty is everything that was
    discarded on the way and no longer appears anywhere. A chain can be perfectly tight in the quoted
    sense and still carry a large amnesty, and this proposal''s content is that the two can be separated
    and counted separately. (C) STRUCTURAL CLAIM. Amnesty is dominated by a small number of steps,
    so the multiset is heavy-tailed rather than uniform, and identifying the largest two or three
    contributors is more useful than the total. The audit trail is therefore the deliverable, and
    the total is a summary of it. (D) WHAT IS NOT CLAIMED. No attack, no break, and above all no claim
    that a large amnesty means anything is insecure or that any published analysis is wrong: dropping
    constants is legitimate and universal, and a ledger of drops is a record of what an asymptotic
    statement chose not to track, not an accusation. Nothing here asserts what any published chain
    contains, since no chain is filed in this corpus. This is also not an audit of this program''s
    own cost model or machine variance, and it produces no timing of any kind.'
  mechanism: 'STAGE 1. Fix a step granularity and a step schema: each step records the expression
    before, the expression after, the justification class, and the exact ratio in bits, computed at
    a frozen evaluation point in exact rational arithmetic. Freeze both before any chain is written.
    STAGE 2. Build a fully explicit SYNTHETIC reduction chain in which nothing is dropped, so its
    true amnesty is exactly zero by construction. This is the null object and it is executable in
    the same invocation as everything else. STAGE 3. Build a family of synthetic chains with known,
    deliberately injected drops of known sizes, so the ledger''s recovery of a known total can be
    measured rather than assumed. STAGE 4. Measure recovery: total amnesty recovered versus injected,
    per chain, plus the rank correlation between the ledger''s identification of the largest contributors
    and the true injection sizes. STAGE 5. Heavy-tail check: measure the fraction of total amnesty
    carried by the top two steps across the synthetic family, which is the claim (C) test on chains
    whose drop-size distribution is set by the generator rather than by nature, so the result describes
    the generator and is reported that way. STAGE 6. Sensitivity of amnesty to the frozen evaluation
    point, since a ratio between two expressions generally depends on where it is evaluated, and a
    ledger whose total swings wildly with the evaluation point is reporting a location rather than
    a chain. STAGE 7. Apply to a real chain only if one is filed under RQ-FRODO-a2dbe2 constraint
    1, reporting the trail and never a verdict.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-FRODO-a2dbe2 in full, in particular the target asking whether any step in the
      chain is non-tight in a way the published category assignment does not charge, stated as a named
      term rather than as a verdict. Read GOAL-FRODO-002 objective. Read the anti-duplication blacklist
      item forbidding re-proposals of audits of this program''s own cost model, machine variance or
      single-machine timing under RQ-INSTR-f8faa0, and checked this design against it: no timing,
      no machine, no cost model of this program appears anywhere in it. Ran grep -ril over ledger/proposals/
      for tightness, reduction tightness, game hop, lower-order, constant factor, big-O, and read
      the titles of the hits.'
    results: 'Twelve proposals match tightness. IDEA-20260813-6819af (RQ-MQOM-001) is the closest:
      a reduction-loss saturation ledger isolating every TCitH ROM and QROM game hop and searching
      for a matching adversary or a provable slack witness. The word ledger is shared and the granularity
      is the same, but the quantity is different in a way that matters: that record asks whether each
      hop''s loss is ACHIEVABLE by an adversary, which is a semantic existence question requiring
      an attack construction; this one asks what was DISCARDED at each hop and never asks whether
      anything is achievable. The two are complementary and a chain could have zero saturation and
      large amnesty or the reverse. IDEA-20260815-72c70d recomputes CGL hash margins under a new isogeny
      baseline and is unrelated. IDEA-20260805-f16b44 and IDEA-20260805-411b60 (FRODO) concern the
      failure rate rather than the chain. No record in the corpus enumerates dropped factors as a
      multiset or measures a ledger''s recovery of injected drops.'
    verdict: 'UNVERIFIED. External literature is unreachable, so nothing is asserted about published
      tightness accounting. Claimed new inside this repository: separating amnesty, meaning what was
      discarded and no longer appears, from the quoted loss, meaning what does appear; making the
      ledger''s own accuracy measurable by injecting known drops into synthetic chains; and measuring
      the ledger total''s sensitivity to the evaluation point, which decides whether the number describes
      a chain or a location. Assembled from known parts: step-granular game-hop enumeration is IDEA-20260813-6819af''s
      and is cited rather than restated; exact rational evaluation is already a constraint of both
      FRODO questions; injection-recovery calibration is the same positive-control discipline used
      throughout this batch.'
  object_first_candidate:
    tracked_object: 'The amnesty multiset of a reduction chain: one entry per step, each carrying
      the step identifier, the justification class of the drop, and the exact ratio in bits between
      the replaced expression and its replacement, evaluated at a frozen point.'
    lossiness: 'The projection discards the mathematical content of every step, the games themselves,
      the adversaries, and the final bound, keeping one labelled number per step. It is genuinely
      lossy: two chains proving entirely different statements with the same pattern of drops have
      identical amnesty multisets, and a chain that is wrong at every step but drops nothing has amnesty
      zero. What survives propagates because the drops compose multiplicatively along the chain and
      therefore additively in bits, independently of what each step actually proved. That additivity
      is why the object is closed under chain composition and why partial chains can be ledgered separately
      and summed, which is what makes the audit trail reusable.'
    propagation: 'One step of the target operation is appending one game hop to the chain. It appends
      one entry to the multiset and adds that entry''s bit value to the running total, with no interaction
      with any earlier entry. Under concatenation of two chains the multisets union and the totals
      add. The object therefore has the simplest possible propagation rule, which is exactly what
      makes the heavy-tail claim (C) nontrivial: additivity means the total carries no information
      about concentration, so the multiset must be kept rather than summarized.'
    survival_score: 'The object is well defined for as long as every step can be written as a replacement
      of one evaluable expression by another. It dissolves at the first step that is not of that form,
      and the named candidates are: a step that changes the quantifier structure rather than the magnitude,
      a step that introduces a new object with no predecessor expression, and a step whose ratio depends
      on a variable not fixed by the evaluation point. The proposal predicts that quantifier-changing
      steps are the common dissolution and treats counting them as a deliverable, because a chain
      in which many steps are not magnitude replacements is one whose looseness cannot be summarized
      by any number at all.'
  null_object_control: 'A FULLY EXPLICIT SYNTHETIC CHAIN in which every step is an exact identity,
    so its true amnesty is exactly zero by construction, run through the IDENTICAL ledger pipeline
    in the same invocation as every other arm. The ledger must report exactly zero bits and an empty
    heavy-tail structure. If it reports a positive total, the pipeline manufactures amnesty out of
    exact steps and every other number is void. The positive side of the control is the injected-drop
    family: chains built by taking the exact chain and replacing k steps with inequalities of known
    bit size, where the ledger must recover the injected total and rank the contributors correctly.
    Neither control alone is sufficient, since a pipeline that always reports zero passes the first
    and fails the second, and one that always reports a large number does the reverse.'
  discriminated_from:
  - 'IDEA-20260813-6819af (RQ-MQOM-001): a reduction-loss saturation ledger over TCitH game hops that
    searches for a matching adversary or a provable slack witness at each hop. That is a semantic
    achievability question needing an adversary construction; this counts discarded factors and constructs
    no adversary, so a hop can be saturated with zero amnesty or unsaturated with large amnesty and
    the two records measure different things.'
  - 'IDEA-20260805-f16b44 (FRODO): converts a failure-rate discrepancy into bits. That is one input''s
    sensitivity in the final bound; amnesty is about what never reached the final bound at all.'
  - The blacklisted class of audits of this program's own cost model, machine variance or single-machine
    timing under RQ-INSTR-f8faa0. Nothing here measures any runtime, any machine, or any cost model
    of this program; the ledger's entries are exact ratios between symbolic expressions and the pipeline
    produces no timing at all.
  - The neighbouring FRODOFO exponent-vector proposal, which measures the difference between two written
    bounds' gradients. That compares finished statements; amnesty concerns the interior of a derivation
    and is invisible in any finished statement, which is the reason it needs its own object.
  - An ordinary reading of a proof that notes where constants were dropped. That produces prose; the
    content here is a frozen step schema, exact ratios at a frozen evaluation point, and a measured
    recovery rate that says how much of an injected total the procedure actually finds.
  assumptions:
  - A reduction chain can be written at a step granularity where most steps are magnitude replacements;
    the fraction that cannot is counted and reported rather than assumed small.
  - A frozen evaluation point is chosen before any ratio is computed, and the ledger total's sensitivity
    to that choice is measured, since ratios generally depend on location.
  - Exact rational arithmetic is used so that the exact-chain null can report exactly zero rather
    than a small residue.
  - Justification classes are assigned by the person writing the chain and are recorded as claims
    by that person, not as facts established by the tool.
  - For any application to a real chain, the chain must be filed under RQ-FRODO-a2dbe2 constraint
    1; every calibration stage runs on synthetic chains and does not depend on that.
  predictions:
  - metric: ledger total on the fully explicit exact synthetic chain
    direction: lower
    minimum_effect: forced value exactly 0 bits; any positive total voids the pipeline
  - metric: relative error between recovered and injected total amnesty on the injected-drop family
    direction: lower
    minimum_effect: 0.01
  - metric: rank correlation between ledger-identified top contributors and true injection sizes
    direction: higher
    minimum_effect: 0.9
  - metric: fraction of total amnesty carried by the top two steps, across the injected family
    direction: higher
    minimum_effect: 0.5
  - metric: swing in the ledger total across three frozen evaluation points spanning the plausible
      parameter range, in bits
    direction: different
    minimum_effect: 'no pre-commitment, with reason: this swing is the quantity that decides whether
      an amnesty total describes a chain or merely a location, and any number I named in advance would
      be invented rather than derived'
  minimal_test:
    design: 'Everything that calibrates the instrument is synthetic and cheap. Write the step schema,
      the exact chain of twelve steps whose true amnesty is zero, and an injected family built by
      replacing k of those steps, for k in one to six, with inequalities of known bit sizes drawn
      from a heavy-tailed and from a uniform generator. Run the ledger over all of them in one invocation
      at three frozen evaluation points. The discriminating measurements are two: the exact chain
      must return exactly zero bits, and the injected chains must return totals matching the injections
      to within one percent with the top contributors correctly ranked. If the exact chain returns
      anything but zero, the pipeline invents amnesty and nothing else matters. If recovery is accurate
      under the uniform generator but the heavy-tail fraction simply mirrors whichever generator was
      used, then claim (C) is a property of the generator and must be reported as such rather than
      as a finding about chains. Cost: minutes.'
    controls:
    - Fully explicit exact chain with true amnesty zero, run in the same invocation.
    - Injected-drop family with known bit sizes, as the positive control for recovery and ranking.
    - Two injection generators, heavy-tailed and uniform, so the heavy-tail claim cannot be confirmed
      by the generator alone.
    - Three frozen evaluation points, measuring the total's location sensitivity.
    - Quantifier-changing step counter, reporting how many steps are not magnitude replacements.
    - An always-zero stub ledger and an always-large stub ledger through the identical harness, fixing
      the endpoints of the recovery scale.
    required_metrics:
    - ledger total in bits per chain and per evaluation point
    - relative error between recovered and injected total
    - rank correlation between identified and true top contributors
    - fraction of total carried by the top two steps
    - count of steps that are not magnitude replacements
    - swing of the total across evaluation points
    - stub endpoint values
  falsification_conditions:
  - The exact chain returns a nonzero total, meaning the pipeline manufactures amnesty.
  - Recovery error on injected chains exceeds the pre-registered threshold.
  - Rank correlation with true injection sizes falls below the pre-registered threshold, so the audit
    trail misidentifies the dominant contributors and the deliverable is worthless even if the total
    is right.
  - The heavy-tail fraction simply reproduces whichever injection generator was used, so claim (C)
    says nothing about chains.
  - The total swings across evaluation points by more than the chain's own total, meaning the number
    describes a location rather than a chain.
  - A large fraction of steps are not magnitude replacements, so the object does not cover realistic
    chains.
  confounders:
  - The synthetic chains and the injection generators are authored here, so both the recovery rate
    and the heavy-tail fraction are properties of that authorship; the two-generator design limits
    but does not remove this.
  - 'Step granularity is a free choice and directly sets the number of ledger entries: a coarser granularity
    merges drops and hides concentration, a finer one manufactures many tiny entries. The granularity
    must be frozen and reported with every total.'
  - Justification classes are self-reported by the chain writer and are not verified by anything,
    so class-level summaries are weaker than the totals.
  - The frozen evaluation point interacts with which steps dominate, so the top-contributor ranking
    may be location-dependent even when the total is not; both must be reported per point.
  - Exact rational ratios can have enormous denominators over a long chain, and a floating-point fallback
    would silently break the exact-zero null.
  interpretation_limits:
  - An amnesty total is a record of what a derivation chose not to track. It is not an error, not
    a defect, and not evidence that any analysis is wrong.
  - Nothing here asserts what any published chain contains, since no chain is filed in this corpus;
    the calibration runs on chains this program writes.
  - Recovery rates and heavy-tail fractions are properties of self-authored generators and bound nothing
    about real chains.
  - No security consequence follows from any value of the total, and no adversary is constructed or
    costed anywhere in the design.
  target_complexity:
    time_exponent: No attack exponent is claimed. The ledger costs O(steps) exact rational evaluations
      per chain per evaluation point; seconds.
    memory_exponent: No attack memory exponent is claimed. One entry per step; kilobytes.
    best_known: The incumbent is the practice of quoting a reduction's loss as a factor in the final
      inequality, which RQ-FRODO-a2dbe2 asks be replaced by a named term rather than a verdict. Amnesty
      is a strictly different quantity from that factor and does not compete with it; the proposal
      claims only that both can be counted and that counting them separately is possible at negligible
      cost.
    hidden_overhead: 'Writing a chain at step granularity is the entire cost and it is human, unautomatable,
      and larger than it looks: a published derivation is not written as a sequence of magnitude replacements,
      so rendering it into one is an act of interpretation, and different renderings give different
      totals. The granularity choice and the justification classes are both self-reported, which means
      the ledger is only as trustworthy as the person filling it in, and the calibration stages measure
      the pipeline rather than that person.'
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo across ledger/ returns goals, hypotheses, proposals, questions and one decision and
    NO evidence record, so this program holds zero measured time, memory or query rows for FrodoKEM
    and nothing here can be dominated. Against IDEA-20260813-6819af, the nearest ledger-style record,
    no Pareto comparison exists because neither produces a cost on any axis.'
  sota_delta: no attack; conceptual and measurement contribution only. The deliverable is an amnesty
    multiset, a total in bits, a top-contributor ranking, a measured recovery rate and a location-sensitivity
    figure. No bit-security number is asserted or moved for any scheme.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Claim (B), that amnesty is computable at step granularity and is a different
    quantity from the quoted loss: 0.85, since the distinction is definitional once the chain is written,
    with the risk sitting in whether real chains can be written that way at all. Claim (C), heavy-tail
    concentration in the top two steps: 0.4 as a statement about real chains, because my synthetic
    family cannot establish it and the measurement will mostly reflect my own generator, which I say
    here rather than after the fact. Recovery accuracy and correct ranking on injected chains: 0.85,
    since it is close to a unit test of the implementation. Location sensitivity being small enough
    that a single total is meaningful: 0.5, and this is the result I most want, because a large swing
    would mean amnesty totals should never be quoted without their evaluation point, which is itself
    a useful and reusable finding. That a real chain is ever ledgered within this goal''s budget:
    0.25, given the undischarged acquisition constraint.'
