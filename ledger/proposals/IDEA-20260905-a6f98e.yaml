  assumptions:
  - UNSAT verdicts are accepted only from terminated searches with a checked proof; a timeout is infrastructure
    and certifies nothing.
  - D_NS is computed over the direct Boolean system in the ml core variables (Boolean degree <= 6 at m = 3); the
    symmetrized presentation with d-variables is a second arm, not pooled.
  - The Macaulay build obeys a pre-flight column contract (abort above 2 x 10^5 columns or 4 GiB), and aborted cells
    are reported as lower bounds on D_NS, never as values.
  proof_search_map:
    bottleneck: The size of the smallest checkable certificate that a target does not decompose. If the algebraic
      certificate is polynomial in l where the clausal one is 2^{ml}, the UNSAT side of the pdp has a polynomial
      decider and, by self-reduction, so does the SAT side - the step whose removal changes the exponent.
    baseline_embedding:
      parameter_slice: 'l = 3, m = 3, n = 8: both certificates are computable exactly (leaf count 512/6, Macaulay
        columns Ncols(9, D) <= 512) and the proof can be checked by a hand-written checker as well as by drat-trim.'
      reproduction_check: 'Frozen fixture: L_res versus the instrumented leaf count and versus 2^{ml}/|G| at l in
        {3,4,5}; D_NS at l = 3 recomputed by two independent rank implementations (peel_and_rank and Sage) with
        exact agreement required.'
    observation_collision:
      observable: The pair (L_res, D_NS) of one UNSAT instance.
      distinct_preimage_search: 'PREDICTED COLLISION on the leaf axis with the N0 shape-matched null (b40e6d ladder):
        identical L_res. The D_NS axis is where a non-collision is possible - the real system may have smaller D_NS
        than N0 (that is what KN-FIND-006''s non-generic syzygies would predict) - and the record pre-registers
        that this is the only axis on which curve content could appear. A collision on BOTH axes with N0 means neither
        certificate sees the curve.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Move "is SAT faster than Groebner on UNSAT instances" from timings to the exact statement
        "which of L_res and Ncols(ml, D_NS) is smaller", with encoding (both certificates checkable), completeness
        (both exist for every UNSAT instance), soundness (independent checkers), transfer (fails at cells where
        D_NS is only bounded) and cost loss (none) stated separately.
      predicted_gain: A hardware-free number replacing the source's uncontrolled 300x.
    - transform: baseline_lift
      proposed_object: 'Treat the leaf-count proof as the boundary of the certificate family and ask for a strict
        inward improvement: any checked proof shorter than 0.5 x leaves.'
      predicted_gain: 'Strictness, not feasibility: a shorter proof exhibits structure the search missed; predicted
        not to exist.'
    quantifier_order: 'CLAIMED: FORALL UNSAT instances in the boundary, L_res lies within 20 percent of the instrumented
      leaf count (witness independent of instance). MEASURED, NOT CLAIMED: the slope of D_NS in l. Outcome (II)
      would be the statement EXISTS D FORALL l, curves, targets and bit-restrictions, D_NS <= D - the quantifier
      over restrictions is the one a naive reading forgets and the record names it.'
    method_ceiling:
      strongest_certifiable_claim: 'Toy-tier: checked certificates for every UNSAT verdict at the tested cells;
        L_res equal to the leaf count within 20 percent; D_NS values or lower bounds at l <= 6 with the size comparison
        decided per cell. It cannot certify D_NS at cryptographic l, cannot turn outcome (II) into an unconditional
        algorithm, and cannot compare to Magma.'
      nearby_object_control: 'KNOWN-FALSE OBJECT for (A): the system plus l redundant linear equations c_{1,j} =
        c_{2,j}, where the proof must shrink by about 2^l and trimming must matter. KNOWN-TRUE SEPARATION for (B):
        a Tseitin parity contradiction of comparable size, where D_NS must be the generator degree and L_res must
        be exponential; a random 3-CNF where both are large. An instrument that cannot reproduce these reports nothing
        about the pdp.'
    proof_obligations:
    - claim: Every UNSAT verdict carries a checked proof; unchecked verdicts are excluded.
      responsibility: correctness
    - claim: L_res equals the instrumented leaf count within 20 percent.
      responsibility: size
    - claim: D_NS is computed by exact rank with a pre-flight contract and reported as value or lower bound.
      responsibility: memory
    - claim: The Tseitin and random-3-CNF calibration objects reproduce the known separation.
      responsibility: feasibility
    - claim: Outcome (II) is recorded only as a conditional claim under the two-record rule.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: UNSAT proof_length_ratio = learned clauses in the checked LRAT/DRAT proof / instrumented leaves, m =
      3, l in {4..8}
    direction: different
    minimum_effect: In [0.8, 1.2]. A ratio <= 0.5 witnesses above-leaf structure.
  - metric: UNSAT trim_fraction = 1 - (clauses after backward trimming) / (clauses before)
    direction: lower
    minimum_effect: <= 0.2. A trim above 0.5 falsifies the no-reuse mechanism.
  - metric: D_NS(l) on UNSAT instances, l in {3,4,5,6}, direct ANF system, >= 5 instances per cell
    direction: different
    minimum_effect: 'Reported as exact integers with the fitted slope and CI; outcome bands: slope CI within [0.5,
      2] is (I); CI containing 0 and excluding 0.25 over >= 4 consecutive l is (II); aborted top cells give (III).'
  - metric: size_comparison = log2 Ncols(ml, D_NS or D_lower) - (ml - log2 m!), per cell
    direction: different
    minimum_effect: Reported per cell with sign; a consistently negative value at l >= 5 says the algebraic certificate
      is smaller and is the implementation- free form of the source's Groebner-on-UNSAT remark.
  - metric: SAT-side certificate_verified fraction on planted instances
    direction: higher
    minimum_effect: 1.0; the SAT certificate is the decomposition itself and any failure invalidates the run as
      invalid_measurement.
  - metric: prime_field_excess = D_NS - d_ff on the digit system at m = 2, s in {3..6}
    direction: higher
    minimum_effect: '>= 0 by derivation; the value with CI is the deliverable of arm (C).'
  - metric: null_D_NS_ratio = D_NS(real) / D_NS(N0 shape-matched null), same cells
    direction: different
    minimum_effect: A ratio <= 0.8 in >= 3 cells is curve-specific algebraic structure on the UNSAT side and is
      the highest-value outcome.
  minimal_test:
    design: 'STAGE 0 (zero compute). Commit the leaf-count table 2^{ml}/|G| and the Macaulay column counts Ncols(ml,
      D) for D <= 9 at every cell; build the Tseitin and random-3-CNF calibration objects. STAGE 1 (instrument validity).
      l = 3, m = 3: emit DRAT and LRAT from cadical (and DRAT from kissat), check with drat-trim and lrat-check
      (built), and with a 60-line reference checker; compute D_NS by two rank implementations; run the two calibration
      objects. STAGE 2 (the measurement). m = 3, l in {4..8}, n in {3l-1, 4l}, 10 random targets per cell (UNSAT
      ones proceed), >= 3 seeds; record L_res, trimmed length, check time, leaf count, depth histogram; for l <=
      6 compute D_NS or its lower bound under the memory contract; SAT planted instances run in parallel with certificate
      re-verification. STAGE 3 (controls). N0 and N1 nulls of b40e6d at l in {4,5,6} on both axes; the redundant-linear
      known-false object; the prime-field arm at m = 2, s in {3..6}, p = 65537 with D_NS over F_p. STAGE 4. Per-cell
      size comparison, slope of D_NS with CI, outcome band.'
    controls:
    - SHAPE-MATCHED RANDOM NULL (N0, N1 of IDEA-20260904-b40e6d) on both certificate axes.
    - PLANTED-SATISFIABLE INSTANCES with independently verified decomposition certificates.
    - KNOWN-FALSE OBJECT (l redundant linear relations) on which the proof must shrink by about 2^l.
    - KNOWN-TRUE SEPARATION (Tseitin parity contradiction) on which D_NS must be small and L_res exponential.
    - TWO INDEPENDENT RANK IMPLEMENTATIONS for D_NS at the fixture cell.
    - MEMORY PRE-FLIGHT with abort-before-allocation and lower-bound reporting.
    required_metrics:
    - proof_length_clauses, trimmed_length, checker_name_and_version, check_seconds, check_result
    - instrumented_leaf_count, solver_conflicts, decisions
    - D_NS_or_lower_bound, Ncols_at_D, rank_engine, peak_rss_mb, aborted_flag
    - certificate_verified (SAT arm)
    - termination_reason (completed | timeout | memory_abort | crash | unbuildable)
    - l, m, n, seed, curve_id, target_kind, null_tier, field (F_2 | F_p), s, p
  falsification_conditions:
  - 'F1. proof_length_ratio <= 0.5 or trim_fraction >= 0.5 at any cell: the search proves more compactly than it
    searches; the compressed proof is analysed for the structure it used.'
  - 'F2. D_NS bounded across >= 4 consecutive l with no aborted cells at the top: outcome (II); recorded as a conditional
    claim, never a theorem, and routed to review-breakthrough.'
  - 'F3. The calibration objects fail to reproduce the known separation: instrument failure; nothing is reported
    about the pdp.'
  - 'F4. A checker rejects a proof: the solver run is invalid_measurement, not a negative observation.'
  - 'F5. null_D_NS_ratio <= 0.8 in >= 3 cells: curve-specific structure on the algebraic axis; the b40e6d localisation
    ladder is run on D_NS.'
  - F6 (pre-registered negative). Under outcome (I) the deliverable is the per-cell size comparison, the slope with
    CI, and the checked certificates - an obstruction measured, not a verdict.
  confounders:
  - DRAT proofs from solvers with inprocessing contain deletion and strengthening steps; learned-clause counts are
    taken from the LRAT addition lines only, and inprocessing is disabled.
  - Proof length depends on the CNF encoding of XORs (cut size); the leaf-axis identity is expected to be encoding-invariant,
    and two cut sizes are run.
  - D_NS is presentation-dependent (a generating-set invariant, as IDEA-20260830-84cdb7 records); the direct and
    symmetrized presentations are both measured and never pooled.
  - Aborted Macaulay cells cluster at large l and bias any slope downward toward outcome (II); the slope is reported
    with and without the top cells and (II) may not be declared from a truncated ladder.
  - At small l the Boolean degree 6 of the direct system is comparable to ml, masking the slope; the ladder must
    reach l >= 5.
  interpretation_limits:
  - CLAIM TIER toy; l <= 8 for proofs, l <= 6 for D_NS.
  - Certificates certify non-decomposability of ONE target for ONE factor base; they say nothing about yield or
    about ECDLP hardness.
  - Outcome (I) closes nothing universally; outcome (II) would be conditional and requires the restriction-uniformity
    quantifier.
  - No number here compares to Magma or to any timing in the frozen source.
  heuristic_assumptions:
  - id: H1
    statement: LEAF-PROOF CORRESPONDENCE. On UNSAT pdp instances under the block core order, the LRAT proof emitted
      by a CDCL solver with inprocessing disabled has (1 +- 0.2) 2^{ml}/|G| clause additions and backward trimming
      removes at most 20 percent, uniformly over n in [3l-1, 4l].
    rigorous_support: 'RIGOROUS HALF: each conflict adds one learned clause, so additions <= conflicts, and 3c7a91
      fixes conflicts near 2^{ml}/|G|. IMITATED LAW: the DPLL-tree / tree-like-resolution correspondence (Beame
      et al., recalled) under which no clause is reused.'
    validation_plan: 'SAMPLE proofs at l in {4..8}; COMPARE additions to leaves and trimmed to untrimmed; SHORTCUT
      for larger l: proofs of capped-depth subcubes (fix k top variables) at l = 9, 10, extrapolated only as an
      estimate; TAIL: the single most-trimmed instance exhibited.'
  - id: H2
    statement: NULLSTELLENSATZ SLOPE. On UNSAT instances of the direct system, D_NS(l) = a l + b with a in [0.5,
      2] over the tested ladder.
    rigorous_support: 'RIGOROUS HALF: D_NS >= first fall, and over F_2 the field equations bound D_NS <= ml. IMITATED
      LAW: Bardet-Faugere-Salvy semi-regularity for n equations of degree <= 6 in ml Boolean variables, whose degree
      of regularity is linear in ml; the honest counter-prior is KN-LIT-005/KN-LIT-024''s bounded first fall, which
      bounds a different quantity.'
    validation_plan: 'Exact ranks at l in {3..6}, D <= 9, >= 5 instances per cell; COMPARE the fitted slope with
      the semi-regular prediction computed from the Boolean Hilbert series; TAIL: the cell with the smallest D_NS
      - d_ff gap exhibited; no cryptographic-scale shortcut exists for this quantity and none is claimed.'
  - id: H3
    statement: PRIME-FIELD FLOOR. On the d = 2 digit system, D_NS >= d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2) +
      1 for 2^{m-1} <= s, 2^s <= p.
    rigorous_support: IDEA-20260903-e1e38b's derivation under H-TOP and Wilson's rank theorem (snippet-retrieved
      there); a certificate for 1 is a fall to degree 0 so it cannot precede the first fall.
    validation_plan: 'Exact F_p ranks at m = 2, s in {3..6}, p = 65537; COMPARE D_NS with d_ff cell by cell; TAIL:
      any cell with D_NS < d_ff is a derivation failure and is exhibited.'
  target_complexity:
    time_exponent: 'NO EXPONENT IMPROVED. Certificate one costs the search (ml - log2 m! bits) plus linear check
      time; certificate two costs Ncols(ml, D_NS)^omega to find and Ncols(ml, D_NS) to check; under H2 both are
      2^{Theta(l)} and the record measures which exponent is smaller. Enumeration bound (96c4f3): (m-1)l bits, below
      both on the SAT side. Groebner baseline: the source''s reported behaviour, not reproduced. Pollard rho: 0.886
      N^{1/2}, dominating all.'
    memory_exponent: 'Certificate one: proof storage 2^{ml}/|G| clauses of length ~ml (about 2^{ml} ml bits - the
      proof is as large as the search); certificate two: Ncols(ml, D_NS) squared bits for the Macaulay build, reported
      as peak RSS with a 4 GiB contract.'
    best_known: 'For certifying a negative: none in this program; the source reports none. For deciding: enumeration
      at 2^{(m-1)l}/(m-1)! with a trivially checkable positive certificate and no negative one.'
    hidden_overhead: Proof checking time (linear but with a large constant), the checker build, the Macaulay memory,
      and the omega in the algebraic find cost.
    tradeoff_note: The certificate that is cheaper to FIND (search) is the more expensive to STORE; the algebraic
      certificate trades find-time for size. No parallelisation claim.
  estimated_cost:
    implementation: medium
    compute: medium
    basis: 'CNF encoder shared with the SATIC lane; cadical/kissat present with native proof output; drat-trim,
      lrat-check or cake_lpr must be built (small C programs); the GF(2) rank engine exists in EXP-DREG-001; the
      F_p rank port exists in IDEA-20260903-e1e38b''s plan. Compute: proofs at l = 8 are ~2.8 x 10^6 clauses per
      instance (hundreds of MB); Macaulay at l = 6, D = 9 is ~1.5 x 10^5 columns.'
  recommended_priority: high
  dominated_by: 'CHECKED ROW BY ROW: as a decision procedure both certificate routes are dominated by the (m-1)-fold
    enumeration (2^{(m-1)l}/(m-1)!, poly memory) and by Pollard rho / VW for the ECDLP; MITM, BSGS, Groebner F4
    (reported), generic CDCL and the crossbred/hybrid re-costings (fc5e3e, da1428, dcf857) were checked and none
    produces a checkable negative certificate. As a certification deliverable: n/a (no result claimed) - no frontier
    row certifies non-decomposability.'
  sota_delta: 'Zero on attack axes. Deliverables: every UNSAT verdict in the lane gains an independently checked
    proof (from "reported as unproved" to certified); the identity L_res = leaves within 20 percent; and the per-cell
    exponent comparison between 2^{ml}/m! and Ncols(ml, D_NS), the first hardware-free SAT-versus-Groebner number
    in the program.'
