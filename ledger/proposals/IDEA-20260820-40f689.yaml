    - id: Robust parsing and fault analyses for post-quantum signatures, exact primary source not retrieved
      provenance: recalled
      verified_by: null
  novelty_screen:
    method: Screened 28 direct-tree RQ-SQISIGN-001 proposals; persistent search_knowledge was unavailable.
    verdict: Unverified; local non-overlap is not a literature result.
  predictions:
    - metric: exception-fallback versus no-fault held-out public-outcome AUC
      direction: higher
      minimum_effect: AUC >= 0.60 with 95% lower bound above 0.55
    - metric: lower bound on total variation of emit-reject-parse-verifier histogram
      direction: higher
      minimum_effect: '>= 0.03 with simultaneous 95% confidence'
    - metric: equal-length true-simulator-null AUC
      direction: different
      minimum_effect: remain in [0.47,0.53]
  minimal_test:
    design: >-
      Freeze one serializer and documented handler. Compare no fault, O_ser_exc,
      genuine simulator, and a 15% planted sentinel-fallback mixture. Retain rejection
      and parse failure as outcomes and equalize emitted analysis length.
    controls:
      - Matched true-simulator no-fault null.
      - Ordinary real-signer null.
      - Fifteen-percent sentinel-mixture positive.
      - Forced exception in a dead diagnostic serializer.
      - Second independent parser on the frozen byte corpus.
    required_metrics: [outcome_histogram, held_out_AUC, sentinel_frequency, plant_power]
  controls:
    - Genuine simulator with matched messages, parsing, output shape, and rejection accounting.
    - Planted mixture strength swept from 0.01 through 0.15.
    - Uncaught exception recorded as infrastructure behavior, never hypothesis evidence.
    - No time, retries, raw length, power, cache, or branch trace.
  falsification_conditions:
    - All public-outcome statistics remain in null bands while planted-positive power is >= 0.90.
    - Dead-serializer injection yields an equal or larger effect or a second parser removes it without changing mathematical objects.
    - Silent omission of exceptions, arm-revealing padding, or simulator miscalibration invalidates the test.
  confounders:
    - Dropping rejected samples manufactures selection effects.
    - Parser disagreement can mimic a signer-law change.
    - Padding bytes can reveal the arm.
    - The handler may consume fresh randomness and conflate fallback with state shift.
  interpretation_limits:
    - The oracle is stronger than an ordinary remote interface.
    - A public mixture does not certify secret dependence or exploitability.
    - SQIsign-002 Kani and GOAL-SSI-001 are out of scope.
  fault_oracle:
    name: O_ser_exc
    intervention: Force one named serializer call to return one named exception code.
    exposed: Padded published bytes, explicit rejection, parse result, and verification only.
    excluded: [time, retry_count, raw_length, secret, power, cache, branch_trace]
  heuristic_assumptions:
    - id: H1
      statement: The chosen documented handler returns to a path producing an emitted or explicitly rejected public outcome.
      rigorous_support: Control-flow reachability is exactly checkable for the fixed implementation.
      validation_plan: Establish reachability on fixed toy inputs, then blind internal branch labels.
    - id: H2
      statement: The frozen public outcome map retains a fallback effect after length equalization.
      rigorous_support: Guaranteed only for the planted sentinel mixture.
      validation_plan: Sweep planted mixture weights and preregister the minimum detectable value.
  target_complexity:
