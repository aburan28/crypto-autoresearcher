idea:
  id: IDEA-20260820-40f689
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Serialization-exception fallback as a public outcome mixture, provenance-corrected
  class: control
  corrects: IDEA-20260820-1dbf95
  supersedes: IDEA-20260820-1dbf95
  correction_scope: >-
    Preserves the forced internal serializer exception, documented fallback path,
    explicit rejection category, equal-length analysis, and two-parser control.
    It repairs source provenance and removes unsupported GRH wording.
  claim: >-
    For a fixed toy implementation, forcing one named internal serialization call
    to return one named exception can select a documented fallback whose published
    emit-reject-parse-verifier outcome law differs from the ordinary signer and a
    genuine simulator. This is not timing, length, recovery, forgery, or SSI evidence.
  mechanism: >-
    O_ser_exc(f,e) injects exception e after the input object to serializer f is
    computed but before bytes are exposed. The implementation follows its existing
    catch/fallback path and either emits or rejects. Sentinel substitution, partial
    resampling, or coordinate reordering can form a public mixture even after output
    byte lengths are padded and excluded.
  novelty_status: unverified
  status: proposed
  source_refs:
    - {id: RQ-SQISIGN-001, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-057, provenance: internal, verified_by: TASK-20260820-922be8}
