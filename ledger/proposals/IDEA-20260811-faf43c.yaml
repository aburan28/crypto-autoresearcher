idea:
  id: IDEA-20260811-faf43c
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  title: >-
    A FROZEN PROTOCOL THAT REQUIRES A COMPARISON AGAINST A QUANTITY NOBODY EVER
    RECORDED IS UNEXECUTABLE BY CONSTRUCTION, AND THIS CAMPAIGN HAS PRODUCED THE
    PATTERN MORE THAN ONCE: the fix is a REFERENCE-RESOLUTION GATE run at freeze
    time -- every MUST-report comparison target in a contract resolves to a
    committed artifact path, a sha256 and a field selector, or is produced by the
    contract itself, or the contract does not freeze -- with a retro-audit of
    every committed contract as its own two-directional control
  class: tooling

  claim: >-
    (A) THE FAILURE CLASS, NAMED PRECISELY. A pre-registered protocol can be
    internally consistent, independently reviewed, and still unexecutable,
    because it requires reporting a measured quantity AGAINST A REFERENCE that
    exists in no committed artifact -- while simultaneously forbidding the
    executor from re-measuring the reference, since re-measuring would breach the
    freeze. The contract then has no admissible terminal state: executing it
    violates the freeze and not executing it fails the contract. This is not a
    protocol bug in the ordinary sense; it is a DANGLING REFERENCE, and it is
    invisible to every check the campaign currently runs, because YAML parses,
    identifiers resolve, and the write scope is well formed.
    (B) THE INSTANCE THE CAMPAIGN HAS RECORDED. EXP-ICINV-4d33aa is PAUSED on two
    independent grounds, one of them a finding recorded as F-V1.4: its amendment
    v3 freezes a MUST to report per-curve exactness against reference per-curve
    rates that do not exist in any committed artifact, while forbidding
    re-measurement. The dispatching context for this session reports it as the
    THIRD instance of the pattern in this campaign. This record does not take the
    count of three on trust and does not name the other two: enumerating them
    from committed artifacts is the audit's first job, and a count asserted
    without that enumeration would be exactly the kind of unsourced number the
    campaign has already had to correct once (CORR-20260810-7cf0e9).
    (C) THE INSTRUMENT. A REFERENCE-RESOLUTION GATE, run before a contract is
    frozen and re-run at dispatch. It parses the contract for every MUST-report
    or success-criterion clause containing a comparison, extracts the reference
    operand, and requires each one to resolve to exactly one of three states:
    RESOLVED (a committed path plus sha256 plus a field selector that a machine
    can read, verified to exist at the named commit); SELF-PRODUCED (the contract
    itself computes it, with the producing step named); or UNRESOLVED, which
    blocks the freeze. The output is a REFERENCE-CLOSURE GRAPH per contract,
    archived with it, so the check is auditable rather than an assertion.
    (D) THE PREDICTION, WHICH IS WHAT MAKES THIS A MEASUREMENT AND NOT A PROPOSAL
    TO WRITE SOFTWARE. Applied retroactively to every committed frozen contract in
    this repository, the gate flags AT LEAST TWO with at least one unresolved
    reference. If it flags zero, the failure class is misdiagnosed, the recorded
    F-V1.4 finding must be re-read, and this record is refuted at a cost of a few
    hours. If it flags nearly every contract, the parser is over-triggering and
    its precision must be fixed before any of its verdicts are actionable.
    (E) WHY THIS BELONGS TO RQ-INSTR AND NOT TO ENGINEERING. The lane exists so
    that the campaign's negatives are citable. A negative produced by a contract
    with a dangling reference is not citable in either direction: it is neither a
    mathematical result nor an infrastructure failure, which is why the
    campaign's existing categories did not catch it. The gate adds the missing
    category -- CONTRACT UNEXECUTABLE AT FREEZE -- and makes it detectable before
    compute rather than after.

  mechanism: >-
    Freezing a protocol converts its text into an obligation. Obligations that
    quantify over data create a dependency on that data existing; nothing in the
    current process checks the dependency, because review reads the contract for
    scientific validity and the dispatcher checks paths for write scope, and a
    comparison's right-hand operand is neither. The gate closes that gap by
    treating every comparison as a link and refusing to freeze a graph with a
    dangling edge.

  tracked_object: >-
    The reference-closure graph of a frozen contract: nodes are required
    quantities, edges point from a required report to the artifact that supplies
    its comparison operand, and the invariant is that every edge terminates in a
    committed artifact or inside the contract itself.

  resource: >-
    None. This lane audits the campaign's own evidence process and consumes no
    cryptographic resource.

  lossy_projection_test: >-
    PASSES. The closure graph is a drastic projection of a contract: it retains
    only the comparison structure and discards all mathematics, so contracts with
    entirely different science share a graph. It propagates deterministically
    under the operation that matters -- amendment -- because an amendment's graph
    is the base graph with edges added or redirected, and an amendment can
    therefore be checked incrementally without re-reading the whole contract.
    That incrementality is the practical payoff and it is why the graph, rather
    than the contract text, is the tracked object.

  t5_reachability: >-
    Not applicable and stated: no curve, no walk, no class.

  null_object: >-
    Two-directional, both mandatory. NEGATIVE CONTROL: a synthetic contract whose
    every reference resolves, which the gate must PASS -- a gate that blocks
    everything is worthless and would simply relocate the failure. POSITIVE
    CONTROL: a synthetic contract containing exactly one injected dangling
    reference of each of three shapes -- a path that does not exist, a path that
    exists at HEAD but not at the named commit, and a path that exists with the
    named field absent -- all three of which the gate must block, naming the
    offending clause. The third shape is the hardest and is the one the
    EXP-ICINV-4d33aa instance most resembles, since the artifact exists and the
    per-curve field does not.

  why_not_a_renamed_known_approach: >-
    The lane already contains an executable-provenance checker that re-runs a
    named code path on recorded inputs (IDEA-20260808-8aaddb), an immutability
    conservation law for committed records (IDEA-20260808-90c7ab), a
    multiplicity-and-detection-floor contract (IDEA-20260807-caf061), a planted
    signal battery (-efc8de) and a class null definition (-34754f). All of them
    check what happened AFTER a run. This gate checks a contract BEFORE it is
    frozen, and the failure it catches is one where no run ever happens -- which
    is why none of those instruments can see it.

  novelty_status: unverified
  novelty_screen: >-
    Screened this session against the RQ-INSTR lane (IDEA-20260807-caf061,
    -efc8de, -34754f, -c015f5, -f6137c, -899c5e, -257001, IDEA-20260808-8aaddb,
    -90c7ab, -b3c97b) and against DEC-20260810-d70ece's NA-list, which carries
    the EXP-ICINV-4d33aa pause forward as N10. WEB SEARCH UNAVAILABLE; the
    software-engineering analogue (dangling-reference checks, link checkers) is
    obviously not novel, and no novelty is claimed for the technique -- only for
    its application to frozen research protocols.

  discriminated_from: >-
    NOT IDEA-20260808-8aaddb, which re-runs a producing code path on recorded
    inputs to catch a headline number whose path crashes; that presupposes a run
    exists. NOT IDEA-20260808-90c7ab, whose conservation law catches post-hoc
    edits to committed evidence. NOT IDEA-20260807-caf061, which budgets
    statistical multiplicity inside a contract. This record catches a contract
    that can never produce a number at all, and it runs at freeze time, which is
    a point in the lifecycle no existing instrument occupies.

  assumptions:
  - >-
    Frozen contracts are machine-readable YAML with identifiable success criteria
    and MUST-report clauses. Where a clause is prose, the gate must flag it as
    UNPARSED rather than silently pass it, and the rate of UNPARSED clauses is
    itself a reported metric.
  - >-
    Committed artifacts are addressable by path and commit, and their field
    structure is machine-readable. Where a reference points into a Markdown
    report rather than a data file, resolution requires a field selector the
    author must supply -- which is a cost of the gate and is stated rather than
    hidden.
  - >-
    The campaign's contracts are immutable. The gate therefore never edits a
    contract; it produces a graph and a verdict, and a failing verdict on an
    already-frozen contract is information for a successor, not a licence to
    amend.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      Tooling and process instrumentation. No theorem, asymptotic bound,
      certificate family, reduction or closure argument about a mathematical
      object is proposed, so section 8's audits have no object to apply to. The
      analogous discipline IS applied in the design: the gate carries a
      reproduction check (it must reproduce the known EXP-ICINV-4d33aa flag), a
      collision search (contracts with identical graphs and different science),
      and a method ceiling (it cannot detect a reference that resolves to the
      WRONG number, only one that resolves to no number).

  predictions:
  - metric: number_of_committed_frozen_contracts_flagged_with_an_unresolved_reference
    direction: different
    minimum_effect: >-
      AT LEAST TWO, one of which must be EXP-ICINV-4d33aa's amendment v3, whose
      dangling reference is already recorded as F-V1.4 and therefore acts as the
      gate's known-answer test. Flagging zero refutes the record. Flagging more
      than half the corpus means the parser over-triggers and its precision must
      be fixed before any verdict is used.
  - metric: precision_on_the_synthetic_control_pair
    direction: different
    minimum_effect: >-
      100 percent: the all-resolved contract passes and all three injected
      dangling shapes are blocked with the offending clause named. Anything less
      voids the instrument.
  - metric: unparsed_clause_rate
    direction: lower
    minimum_effect: >-
      Below 20 percent of MUST-report clauses across the corpus. Above that, the
      gate's coverage is too low for its passes to mean anything, and the honest
      report is that the contracts need a more machine-readable comparison syntax
      -- itself a useful finding.
  - metric: false_block_rate_on_contracts_known_to_have_executed_cleanly
    direction: lower
    minimum_effect: >-
      Zero. A contract that ran to a terminal state with all its comparisons
      reported must not be blocked retroactively; if it is, the gate is reading
      the corpus wrongly.

  minimal_test:
    design: >-
      Build the gate as a standalone checker and run it in three passes. PASS 1,
      known answer: EXP-ICINV-4d33aa and its amendments, where the expected
      verdict is a block naming the per-curve exactness reference. PASS 2,
      synthetic controls: the all-resolved contract and the three injected
      dangling shapes. PASS 3, retro-audit: every committed frozen contract in
      experiments/, producing a per-contract closure graph, a verdict, and an
      unparsed-clause rate. Publish the table with every flagged clause quoted
      and its resolution attempt shown. Cost: hours, no cryptographic compute.
    controls:
    - The synthetic all-resolved contract, which must pass.
    - Three injected dangling shapes, all of which must block.
    - Contracts with recorded clean terminal states, which must not be blocked.
    - A deliberately AMBIGUOUS clause whose reference is prose, which must be
      reported as UNPARSED and not as either pass or block -- the category that
      keeps the gate honest about its own coverage.
    required_metrics:
    - per_contract_reference_closure_graph
    - per_contract_verdict_with_quoted_offending_clauses
    - unparsed_clause_rate_per_contract
    - control_pair_precision_and_recall
    - retro_audit_flag_count

  falsification_conditions:
  - >-
    Zero committed contracts flagged. The failure class as described does not
    exist in the corpus, F-V1.4 must be re-read, and the record is refuted
    cheaply -- which is a perfectly good outcome.
  - >-
    The known-answer case is not flagged. The gate cannot detect the one instance
    the campaign has documented, and every other verdict it produces is void.
  - >-
    A synthetic control is mis-handled in either direction. Same conclusion.
  - >-
    The unparsed rate exceeds 50 percent. The gate is measuring its own parser
    and not the corpus; report that, do not report verdicts.

  confounders:
  - >-
    A reference can RESOLVE and still be wrong -- pointing at a real number that
    is not the right one. The gate cannot see that, and claiming otherwise would
    be the instrument's own overclaim. Its method ceiling is dangling references
    only, and every report must carry that sentence.
  - >-
    Prose clauses are the corpus's dominant style, so coverage is the gate's real
    risk. Reporting UNPARSED as a first-class outcome is what prevents a low
    coverage from masquerading as a clean bill of health.
  - >-
    Retro-auditing immutable contracts can produce flags that no one may act on.
    The flags are information for successors and for the freeze process, and the
    record states plainly that they authorise no amendment; only a Coordinator
    decision can do anything with them.

  interpretation_limits:
  - >-
    NO CRYPTOGRAPHIC CLAIM WHATSOEVER. This record is about the campaign's
    evidence pipeline. claim_tier is not applicable to a tooling deliverable and
    no evidence about any hypothesis is produced.
  - >-
    A blocked contract is not a wrong contract. It is a contract that cannot
    reach a terminal state as written, which is a different and narrower defect.
  - >-
    The record deliberately does not assert the count of prior instances. The
    audit produces the count; the session that dispatched this work reported
    three, and that report is treated as a lead, not as a measurement.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      Dangling comparison references in frozen contracts arise from a systematic
      cause -- contracts authored to compare against quantities the author
      believed were recorded -- rather than from independent authoring accidents,
      so their incidence is concentrated in contracts that cite prior runs and is
      near zero in contracts that are self-contained.
    rigorous_support: >-
      No theorem; this is a stated expectation about the process, and it is
      falsifiable by the audit's own cross-tabulation. Its rigorous half is
      structural: a self-contained contract has no external comparison operands
      by definition and therefore cannot dangle, so any nonzero flag rate among
      self-contained contracts refutes the mechanism immediately.
    validation_plan: >-
      Cross-tabulate the audit's flags against a binary classification of each
      contract as self-contained or prior-run-citing, computed from the presence
      of external artifact references. Predicted: flags concentrated entirely in
      the citing group, with a Fisher exact test on the two-by-two table.
      Sampled scope: every committed frozen contract in this repository, which is
      a census rather than a sample, so no extrapolation assumption is needed and
      none is claimed.

  target_complexity:
    time_exponent: >-
      Not applicable to a cryptographic problem. The checker is linear in the
      corpus size and its cost is minutes.
    memory_exponent: Negligible.
    best_known: >-
      No existing instrument in this repository occupies the freeze-time
      position, which is the record's whole premise and is verified by the
      lane screen above rather than asserted.
    hidden_overhead: >-
      The real cost is authorial: making comparison clauses machine-readable
      imposes a burden on every future contract author. That burden is the
      price of the gate and is stated as such, not amortised away.
    tradeoff_note: >-
      Not applicable.

  dominated_by: >-
    n/a as an attack -- no cryptographic result is claimed, and the frontier rows
    (parallel rho at 0.886 sqrt(N) with O(1) memory, KN-TECH-001 and
    KN-TECH-006; the automorphism-discounted variant, KN-TECH-018; BSGS at
    sqrt(N)/sqrt(N), KN-TECH-031) are checked and none is relevant. As an
    instrument, dominated by nothing in this repository at the freeze-time
    position; IDEA-20260808-8aaddb dominates it at the post-run position and the
    two are complementary rather than competing.
  sota_delta: >-
    No attack; conceptual and process contribution only. Quantitatively: it
    converts an unexecutable-contract failure mode with at least one recorded
    instance and a reported count of three into a pre-compute check costing
    minutes.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that the retro-audit flags at least two contracts. 0.95 that the
    known-answer case is caught, since its defect is already documented in
    detail. 0.4 that the unparsed rate is low enough for the passes to be
    meaningful without a contract-syntax change -- and if it is not, that is
    itself the finding the lane most needs. Filed high because the campaign has
    now lost executable work to this failure class more than once and the fix is
    cheap and permanent.

  source_refs:
  - ledger/decisions/DEC-20260810-d70ece.yaml (NA8, carrying the EXP-ICINV-4d33aa
    pause forward as N10 with the v3 amendment file still unwritten)
  - experiments/EXP-ICINV-4d33aa/ (the paused contract and its amendments; the
    known-answer case for the gate)
  - ledger/corrections/CORR-20260810-7cf0e9.yaml (the unsourced-number
    correction, cited as the reason this record does not assert a count)
  - ledger/proposals/IDEA-20260808-8aaddb.yaml (post-run executable provenance;
    complementary position)
  - ledger/proposals/IDEA-20260808-90c7ab.yaml (record-immutability conservation
    law)
  - docs/inventor-protocol.md section 3 (controls before belief) and section 5
    (honest accounting)
