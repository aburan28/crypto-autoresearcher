  dominated_by: >-
    Checked KR-IC-955fd6, KR-IC-5a43e5, KR-RHO-755e35, KR-RHO-53c89f,
    and KN-FIND-b7e091, all opened. Rho at exponent 1/2 dominates any
    attack reading of two point orders. KR-IC-955fd6 dominates any
    reading of the gap 12 as a decomposition saving: this cell varies
    no extension degree and performs 0 decompositions. KR-RHO-53c89f
    is the MOV and anomalous curve check and does not dominate an
    order computation, because no pairing and no anomalous solver is
    run.
  sota_delta: >-
    Absolute order gap 12 on one curve over F_23. Distance to
    KR-IC-955fd6 is that integer against a heuristic decomposition
    saving. Decompositions: 0. Discrete logarithms: 0. Time exponent
    versus rho: 0. No ECDLP cost is claimed.
