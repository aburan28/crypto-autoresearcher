idea:
  id: IDEA-20261006-a8dfb5
  question_id: RQ-TORS-8c7b79
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Order gap of (4, 10) and (13, 11) on y^2 = x^3 + 3x + 1 over F_23
  class: measurement
  claim: >-
    On E: y^2 = x^3 + 3 x + 1 over F_23, the point (4, 10) has order
    15 and the point (13, 11) has order 3 in the chord-and-tangent
    group law with identity at infinity. The absolute gap of the two
    orders is 12. A recount that returns any other pair of orders is
    a negative. The order of (4, 10) computed a second time is 15, so
    that self-gap is 0. The curve is nonsingular because
    4 A^3 + 27 B^2 is 20 in F_23, and it has 15 projective points.
    The orders are obtained by repeated addition. This does not
    recover a discrete logarithm, is not a doubling-preimage count,
    and is not a root count of the 3-division polynomial over F_5.
  mechanism: >-
    OBJECT FRAME. Representation R1: affine coordinates of two named
    points on a named curve. Operation set Sigma: the elliptic
    addition law, iterated. Sigma is the group law, and the tracked
    object is the order of a point, which is the least positive
    integer n with n P = O. Trichotomy: coordinate-dependent, because
    the order is a property of the point in this model and is not a
    new projection of the whole group. The projection keeps one
    positive integer and discards the intermediate multiples. Lossy:
    eight points of this curve share the order 15. The open number is
    the absolute gap 12 between these two orders. No factor base is
    proposed.
  novelty_status: unverified
  citations:
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        The question asks whether ell-torsion data, for ell different
        from the group order, carries public information about an
        attack cost, and it asks for point-dependent data obtained
        without a discrete logarithm. This record names two points and
        their orders and claims no attack cost.
      verified_by: design session 2026-10-06, question file opened
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Exploiting summation symmetry and small-order torsion reduces
        point-decomposition cost by about 2 to the omega(n-1), under
        a heuristic estimate on extension fields. This record performs
        0 decompositions and outputs two orders on one prime field.
      verified_by: design session 2026-10-06, row file opened
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials are the decomposition framework. This
        record does not evaluate them.
      verified_by: design session 2026-10-06, row file opened
    - ref: KN-FIND-b7e091
      provenance: internal
      claim: >-
        Incidence and endomorphism-image oracles are closed at generic
        exponent 1/2. Two point orders are not one of those oracles.
      verified_by: design session 2026-10-06, finding file opened
  assumptions:
    - The group law is the chord-and-tangent law on y^2 = x^3 + A x + B with A = 3 and B = 1, identity the point at infinity.
    - Order means the least positive integer n with n P equal to the identity. A point that never returns is an implementation failure, not an infinite order.
    - This session enumerated the affine points and iterated addition. The cyclic count of a group of order 15 matches the orders found: 8 points of order 15, 4 of order 5, and 2 of order 3.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms:
      - transform: not_applicable
        proposed_object: not_applicable
        predicted_gain: not_applicable
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations:
      - claim: not_applicable
        responsibility: not_applicable
    not_applicable_reason: >-
      Two point orders. Not a proof that torsion data reveals a
      discrete logarithm, and not a decomposition-cost theorem.
  predictions:
    - metric: absolute_gap_of_point_orders
      direction: different
      minimum_effect: >-
        Absolute difference 12 between order 15 and order 3. Any other
        pair of orders is a negative.
  minimal_test:
    design: >-
      Confirm both points lie on the curve. Compute each order by
      repeated addition until the identity, and stop if the multiple
      count passes 23. Compute the order of (4, 10) a second time.
      Record the projective point count. Do not solve a discrete
      logarithm.
    controls:
      - >-
        The second computation of the order of (4, 10). Disagreement
        voids the cell.
      - >-
        The projective point count must be 15. Any other count voids
        the cell, because an order cannot exceed the group order on
        a curve this small if the count is right, and a wrong count
        means the group law or the enumeration is not the pinned one.
    required_metrics:
      - order of (4, 10)
      - order of (13, 11)
      - absolute gap
      - self-order of (4, 10)
      - projective point count
      - discrete logarithms solved, required to be 0
  falsification_conditions:
    - Both orders finish and the pair is not (15, 3).
    - The two computations of the order of (4, 10) disagree. That voids the cell and is not a torsion result.
  confounders:
    - A doubling-preimage count, including the F_17 count of preimages of (0, 1) and (13, 1), is a different observable.
    - A root count of psi_3 over F_5 is a different observable.
    - The sum of the two points is not part of the claim.
  interpretation_limits:
    - Two orders on a group of size 15 do not determine an attack cost and do not move the exponent 1/2.
    - KR-IC-955fd6 remains a heuristic decomposition estimate on extension fields. This cell does not join it.
    - The group order 15 is the point count, not a secret.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a finite elliptic curve the order of a rational point
        divides the group order. The prediction uses that divisor
        constraint only as a void condition: an order that does not
        divide 15 means the addition loop is not the group law. It
        is not a heuristic about a decomposition probability.
      rigorous_support: >-
        Lagrange's theorem on a finite group supplies the divisor
        constraint once the set of rational points is a group under
        the chord-and-tangent law. KR-IC-955fd6, opened, is a
        decomposition estimate and is not used as the value of either
        order.
      validation_plan:
        sampling: >-
          Two named points, one repeated order, and one projective
          point count, all at p=23 on this equation.
        comparison: >-
          The order pair against (15, 3), the self-order against 15,
          and the point count against 15.
        tail_check: >-
          No third point is scored. An order that fails to divide 15
          voids the cell rather than extending the claim.
        parameters: >-
          p=23, A=3, B=1, points (4, 10) and (13, 11). No transfer
          to a larger prime and no decomposition system.
  target_complexity:
    time_exponent: >-
      No improvement. Generic rho remains exponent 1/2. Two addition
      chains of length at most 15 are not an algorithm.
    memory_exponent: >-
      Not claimed. The output is two integers.
    best_known: >-
      Pollard rho at N^{1/2}. KN-FIND-b7e091 closes incidence and
      endomorphism-image oracles at that exponent. KR-IC-955fd6 is a
      heuristic decomposition saving on a different field shape.
    hidden_overhead: >-
      At most 15 additions per order, twice for the control. No o(1)
      attack term is hidden because no attack is claimed.
    tradeoff_note: >-
      Not a time-memory tradeoff. The output is one integer gap.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
