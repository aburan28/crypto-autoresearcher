idea:
  id: IDEA-20260816-cfe83d
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: Test whether the customized XOF mode's map from a (customization string, message) pair to
    the exact padded absorb sequence entering the permutation is INJECTIVE, by exhaustive enumeration
    over a declared short-length class, with a deliberately defect-injected variant of the same encoder
    as the null arm that the identical search must catch
  class: measurement
  claim: '(A) Domain separation in a customized XOF is, stripped of interpretation, an injectivity
    property of a pure encoding function: the mode takes a pair (Z, M) -- customization string and
    message -- and produces a fully determined sequence of rate-sized blocks that is absorbed into
    the permutation, together with the domain-separation and padding bits appended at declared positions.
    If two distinct pairs (Z1, M1) and (Z2, M2) produce the identical absorb sequence, then no property
    of the permutation can separate them: their outputs are equal by construction. That is a finite,
    decidable property of the encoder alone, and it can be settled by exhaustive enumeration within
    a declared length class WITHOUT any cryptanalysis and WITHOUT reading any literature. (B) The
    proposal is to build the encoder as an isolated, testable unit -- separated from the permutation
    entirely -- and enumerate every (Z, M) pair with |Z| and |M| below a declared byte bound, canonicalising
    each to its absorb sequence and hashing that sequence into a collision table. The output is either
    a certificate (an explicit colliding pair, machine-checkable in one line) or the statement that
    the map is injective on the enumerated class, WITH the unenumerated region named exactly. (C)
    NOT CLAIMED: that any collision exists; that Ascon-CXOF128 has any defect; that injectivity on
    a short-length class implies injectivity anywhere else; that this program has correctly pinned
    the standardized encoder, which is an explicit prerequisite and an explicit derivation gap. A
    negative enumeration is a coverage statement over a declared class, never a security proof. (D)
    The measurement is only meaningful if the search can catch a collision it is given: the null arm
    is a second encoder, identical except for one injected separation defect (length prefix omitted),
    and the identical enumeration must return its collisions. A search that misses planted collisions
    has measured nothing about the real encoder.'
  mechanism: 'Stage one implements the absorb-sequence encoder as a pure function returning a byte
    string, with the permutation stubbed out entirely, and validates it against declared test vectors
    -- pinning is a hard gate, since a subtly wrong encoder would manufacture a false finding, which
    is exactly the failure RQ-ASCON-2dfd8b names in its constraints. Stage two defines the enumerated
    class: all (Z, M) with lengths in a declared range, drawn over a reduced alphabet where necessary
    to keep the count finite, with the reduction stated as a scope limit and not hidden. Stage three
    enumerates, canonicalises and inserts into a hash table keyed on the full absorb sequence, reporting
    any bucket of size above one as a candidate collision and re-verifying each candidate byte-for-byte
    independently of the table. Stage four runs the identical enumeration against the defect-injected
    encoder in the same invocation. Stage five reports three numbers: collisions found in the signal
    arm, collisions found in the null arm, and the exact boundary of the enumerated class. Refutation
    of the METHOD is a null arm returning zero collisions; refutation of the negative reading is any
    signal-arm collision, which is then a certificate.'
  novelty_status: unverified
  novelty_screen:
    method: 'Shared screen described in the first record of this batch, with the terms relevant here
      being domain.separation, sponge, duplex and capacity over ledger/proposals/*.yaml, plus grep
      -ril ascon over ledger/proposals, ledger/hypotheses, ledger/evidence and experiments. Read:
      ledger/questions/RQ-ASCON-2dfd8b.yaml in full (its second target is the customized XOF enumeration
      and its constraints name a subtly wrong implementation as the specific manufacturing risk),
      ledger/goals/GOAL-ASCON-001.yaml first 60 lines (which names GOAL-BLAKE-001 as owning BLAKE3
      tree-mode domain separation and requires a shared enumeration methodology), and headers of knowledge/techniques/KN-TECH-066.md.'
    results: 'The domain.separation grep returned ten proposal files before the head -20 truncation:
      IDEA-20260731-003, IDEA-20260731-006, IDEA-20260805-cec9b6, IDEA-20260808-917e63, IDEA-20260808-95a21c,
      IDEA-20260809-1b5b15, IDEA-20260809-7f2d9c, IDEA-20260809-c4ecac, IDEA-20260809-ce875b and IDEA-20260809-dc7006.
      Their filenames were seen and their contents were NOT read except for IDEA-20260808-95a21c,
      which is a FAEST Fiat-Shamir cost audit; the remainder must be read by a Coordinator before
      approval and that is recorded as a derivation gap. The ascon grep returned no ledger record
      at all, so no existing proposal targets Ascon-CXOF128. GOAL-ASCON-001 states directly that GOAL-BLAKE-001
      owns the analogous BLAKE3 tree-mode finite enumeration and that whichever goal runs second must
      adopt the other''s declared-class convention or record why it cannot.'
    verdict: 'UNVERIFIED. Nothing here asserts what external literature contains, and no agent in
      this environment could check. Claimed NEW relative to this repository: the reduction of a customized-XOF
      domain-separation audit to an injectivity test on the absorb-sequence encoder with the permutation
      removed from the loop entirely, and the use of a defect-injected sibling encoder as an executable
      null in the same invocation. ASSEMBLED FROM KNOWN PARTS: exhaustive finite enumeration of a
      mode surface is the methodology GOAL-ASCON-001 says GOAL-BLAKE-001 already owns for BLAKE3 tree-mode
      flags; encoder injectivity as the substance of domain separation is elementary and is not claimed
      as an insight; the requirement that the null run in the same invocation is docs/inventor-protocol.md
      section 3.'
  object_first_candidate:
    tracked_object: 'The absorb sequence: the exact, fully padded, domain-separated byte string that
      the mode commits to feeding block by block into the permutation, as a function of the pair (Z,
      M). The permutation is not in the object at all -- it is stubbed. What is followed through the
      computation is the encoding, not the state.'
    lossiness: 'Lossy in one direction and honest about it. Discarded: the entire permutation, every
      state value, every output byte, and any notion of cryptographic strength. Retained: the syntactic
      commitment the mode makes before any mixing happens. The discard is compatible with the target
      operation because absorbing is a function of the absorb sequence alone: two equal sequences
      produce equal states under any permutation whatsoever, so the discarded part cannot rescue a
      collision in the retained part. This asymmetry is why the projection is worth making -- it is
      lossy toward the safe side. It is NOT lossy in the other direction: a distinct absorb sequence
      tells us nothing about whether outputs differ, and the record states that limit rather than
      eliding it.'
    propagation: 'One step of the target operation is the appending of one more input unit -- a byte
      of Z, a byte of M, a separator, or a padding rule firing at a block boundary. Acting on the
      absorb sequence it either extends it, or triggers a boundary rule that inserts declared bits
      at declared positions. The property tracked under this action is whether the extension keeps
      the length-and-position information recoverable: an encoder that appends Z then M with no length
      or boundary marker propagates a merge -- moving one byte from the end of Z to the start of M
      leaves the sequence fixed -- while an encoder that emits a length prefix or a boundary separator
      propagates a distinction. Injectivity is exactly the statement that no sequence of such steps
      ever merges two distinct histories.'
    survival_score: 'The property survives exactly as far as the enumerated class reaches and not
      one byte further, and this record refuses to extrapolate. Concretely: with |Z| and |M| each
      ranging over 0 to a declared bound and a reduced alphabet, the enumeration covers a stated finite
      count of pairs, and every pair outside that count is named as unenumerated in the deliverable.
      The structure dissolves as soon as lengths exceed the class boundary or the alphabet is widened,
      and the honest output names where that happened rather than asserting the property continues.'
  null_object_control: 'A DEFECT-INJECTED SIBLING ENCODER, built by the same code with one declared
    change -- the customization-string length prefix removed, so that (Z || M) is absorbed without
    a boundary marker -- enumerated by the IDENTICAL search routine over the IDENTICAL class in the
    SAME process invocation. For the signal arm''s negative result to mean anything, the null arm
    must return a nonzero and roughly predictable number of collisions: the count of pairs that differ
    only by moving bytes across the Z/M boundary. If the null returns zero, the search cannot see
    collisions at all and the signal arm''s silence is a property of the search, not of the encoder.
    A second null runs a randomly permuted-output encoder of the same output length, which must return
    collisions at the birthday rate for the enumerated count.'
  discriminated_from:
  - 'GOAL-BLAKE-001, which GOAL-ASCON-001 states owns BLAKE3 tree-mode domain separation as a finite
    enumeration. Same methodology class, different design, different surface: tree-mode flags versus
    a customization-string/message boundary, and GOAL-ASCON-001 requires the second goal to adopt
    the first''s declared-class convention, which this record commits to doing.'
  - IDEA-20260808-95a21c -- sponge and Merkle-Damgard prefix amortisation as a Fiat-Shamir cost audit.
    That record is about the COST of a hash query given a shared prefix; this record is about whether
    two distinct inputs produce the SAME query at all, and computes no cost.
  - The nine other proposals matched by the domain.separation grep (IDEA-20260731-003, IDEA-20260731-006,
    IDEA-20260805-cec9b6, IDEA-20260808-917e63, IDEA-20260809-1b5b15, IDEA-20260809-7f2d9c, IDEA-20260809-c4ecac,
    IDEA-20260809-ce875b, IDEA-20260809-dc7006) whose filenames were seen and contents not read; none
    targets Ascon since the ascon grep returned no ledger record, but a Coordinator must read them
    before approval and that is filed as a derivation gap.
  - Generic collision search against a hash function. This search never calls the permutation; it
    is a syntactic enumeration over an encoder, its cost is the size of the declared class rather
    than a birthday bound, and a hit is a certificate checkable by string comparison rather than by
    a cryptanalytic argument.
  - KN-TECH-066 (differential cryptanalysis of hash functions and permutations -- rebound, message
    modification, internal differentials). That technique is about finding differences that survive
    a permutation; this record deliberately removes the permutation from the object.
  assumptions:
  - The standardized customized-XOF encoder can be pinned exactly from primary text and validated
    against the standard's own test vectors before any enumeration; without that, the enumeration
    measures an encoder this program invented and is void.
  - Injectivity of the absorb-sequence encoder is a meaningful necessary condition for domain separation,
    and its failure would be decisive while its success is only a coverage statement.
  - A declared reduced alphabet does not hide collisions that a full alphabet would expose -- an assumption
    known to be UNSAFE in general, so the reduction is reported as a scope limit and the class boundary
    is named in the deliverable.
  - The defect-injected null encoder differs from the signal encoder in exactly one declared respect,
    verified by diffing the two implementations and attaching the diff to the run record.
  - Enumeration counts are within a single machine's reach at the declared bounds, so no sampling
    is required and the word exhaustive is literal within the class.
  predictions:
  - metric: collisions found in the null (length-prefix-removed) arm over the declared class
    direction: higher
    minimum_effect: strictly greater than zero, and matching the combinatorially predicted count of
      boundary-shift pairs to within exact equality, since that count is computable in closed form
      before the run
  - metric: collisions found in the signal arm over the declared class
    direction: lower
    minimum_effect: 'no pre-commitment to zero. Refusing to pre-commit here is deliberate: pre-committing
      to zero would make a null result feel like a confirmation, and the honest posture is that either
      outcome is reportable and a hit is a certificate'
  - metric: fraction of the declared class actually enumerated, as opposed to sampled
    direction: different
    minimum_effect: exactly 1.0, a forced value -- if any part is sampled the deliverable is renamed
      from exhaustive to partial and the unenumerated region is named
  - metric: encoder test-vector agreement before enumeration begins
    direction: different
    minimum_effect: exactly 100 percent on every declared vector; anything less halts the run before
      a single pair is enumerated
  minimal_test:
    design: Strip the permutation out. Implement the customized-XOF absorb-sequence encoder as a pure
      byte-string function and gate the run on exact agreement with the standard's declared test vectors,
      reproduced through the full mode so that the encoder is pinned rather than guessed. Then enumerate
      every (Z, M) pair with |Z| in 0..3 and |M| in 0..3 over a reduced 4-symbol alphabet -- a few
      hundred thousand pairs, seconds of CPU -- canonicalise each to its absorb sequence, and insert
      into a dictionary keyed on that sequence. Any bucket of size above one is re-verified byte-for-byte
      outside the dictionary. In the same invocation, run the identical enumeration against the defect-injected
      encoder and against a random-output encoder of matched length. Report signal collisions, null
      collisions, the closed-form predicted null count, and the exact class boundary. The whole discriminating
      measurement fits in one process and a few seconds.
    controls:
    - Defect-injected null encoder (customization-string length prefix removed), identical search,
      same invocation, with the implementation diff attached.
    - Random-output null encoder of matched output length, which must produce collisions at the birthday
      rate for the enumerated count, calibrating the collision detector itself.
    - 'Test-vector gate: the encoder must reproduce every declared standard test vector through the
      full mode before enumeration starts, and the run halts otherwise.'
    - Independent re-verification of every candidate collision by direct byte comparison outside the
      hash table, so a dictionary bug cannot manufacture a hit.
    - Second implementation of the encoder by a different code path used to cross-check a random 1
      percent sample of absorb sequences.
    required_metrics:
    - signal-arm collision count over the declared class
    - null-arm collision count, and its closed-form predicted value
    - random-encoder null collision count against the birthday expectation
    - exact enumerated class size and the named unenumerated region
    - test-vector agreement rate before enumeration
    - per-candidate independent re-verification outcome
    - cross-check agreement rate between the two encoder implementations
  falsification_conditions:
  - The null arm returns zero collisions, showing the search is blind and voiding any reading of the
    signal arm.
  - The null arm's collision count disagrees with the closed-form prediction, showing the enumeration
    is not covering the class it claims to cover.
  - The encoder fails any declared test vector, which halts the run and makes every downstream number
    meaningless.
  - The two independent encoder implementations disagree on any sampled absorb sequence.
  - A candidate collision survives the dictionary but fails independent byte comparison, showing a
    detector defect.
  - The declared class turns out not to be enumerable within budget, in which case the deliverable
    is renamed partial and the exhaustive claim is withdrawn -- a budget outcome, never mathematical
    evidence.
  confounders:
  - An encoder pinned from a secondary description rather than primary text would make the entire
    measurement about a fiction; this is the exact manufacturing risk RQ-ASCON-2dfd8b names and the
    test-vector gate is the only defence.
  - The reduced alphabet could suppress exactly the collisions a full alphabet would show, so absence
    in the signal arm is bounded by the alphabet as well as by the length bound.
  - Canonicalisation of the absorb sequence could accidentally normalise away a genuine distinction,
    turning a non-collision into an apparent one or vice versa; the two-implementation cross-check
    is the mitigation.
  - The defect injected into the null is chosen by the same agent that wrote the encoder and may be
    easier to catch than a realistic defect would be, so a passing null is weaker evidence than it
    looks.
  - Little-endian versus big-endian byte assembly in the encoder is itself one of the reported submission-to-standard
    differences, so an implementation that gets it wrong changes the object under test without changing
    its name.
  interpretation_limits:
  - A zero-collision signal arm is a coverage statement over a declared finite class and is NOT a
    proof of domain separation, not a security claim, and not a statement about Ascon-CXOF128 at deployed
    input lengths.
  - A collision, if found, is a statement about the ENCODER's injectivity within the class; converting
    it into any security consequence would require argument this record does not make and this program's
    claim ceiling forbids.
  - Nothing here says anything about the permutation, since the permutation is stubbed out by construction.
  - If a domain-separation gap were ever found, RQ-ASCON-2dfd8b requires disclosure to NIST and the
    designers before publication, and this record inherits that requirement.
  target_complexity:
    time_exponent: No attack exponent is claimed. Enumeration cost is exactly the declared class size,
      |A|^(Lz+Lm) summed over the length ranges, with a small constant per pair.
    memory_exponent: No attack exponent is claimed. Memory is linear in the enumerated class size
      for the collision dictionary, reducible to constant by sorting to disk if the class is widened.
    best_known: 'The incumbent is the design argument that a customization string is separated from
      message data by construction. Within this repository there is no competitor at all: the ascon
      grep returned zero ledger records, and GOAL-ASCON-001 states the customized XOF was added at
      standardization and therefore has the least third-party analysis of anything in the standard.'
    hidden_overhead: 'Pinning the encoder is the entire hidden cost and it is human, not machine:
      it requires primary text, test vectors, and a careful reading of the endianness and padding
      conventions, and it is precisely where an error would manufacture a finding. A second hidden
      cost is the declared-class convention shared with GOAL-BLAKE-001, which must be adopted or explicitly
      refused, and that negotiation is human time not counted in the compute budget.'
  dominated_by: 'n/a (no result claimed). Pareto check performed across all three axes: time (enumeration
    is class-size linear and no attack time is produced), memory (dictionary is class-size linear
    and no attack memory is produced), data/queries (zero oracle queries -- the permutation is never
    called). There is no frontier row to compare against because no distinguisher, attack or bound
    is claimed, and this statement is made after considering each axis rather than as a default.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The quantitative delta is coverage:
    from zero enumerated (Z, M) pairs on record in this program to a stated finite count with its
    boundary named, plus a calibrated collision detector demonstrated to catch a planted defect.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separately: that the encoder can be pinned and test-vector-validated
    in this environment, about 0.3, because it requires primary text this program currently lacks
    and the RQ constraint blocks design until both documents are filed. That the null arm catches
    its planted collisions at the closed-form count, above 0.9, since that is elementary combinatorics
    on a boundary shift. That the enumeration is genuinely exhaustive within the declared class at
    the stated bounds, about 0.85, the risk being alphabet or length blowup. That the signal arm returns
    a collision, LOW and deliberately unquantified beyond that: a standardized mode is expected to
    be injective and a hit would be surprising, but pre-committing a number here would either overstate
    suspicion or manufacture a confirmation, and the honest posture is that either outcome is a reportable
    result.'
