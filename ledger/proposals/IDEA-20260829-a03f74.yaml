  assumptions:
    - >-
      The recurrence and width are as recalled. If the width were not a power of
      two the chain-ring description changes but C1 does not: R-linearity gives
      unit multiplication as an automorphism at any width, and only the unit
      count changes.
    - >-
      "Same object" for a disturbance vector is intended to mean "same attack",
      and the attack-relevant statistic is the per-step weight profile. This is
      DECLARED here and is shared with IDEA-20260829-ea385e's H1; if the right
      statistic is something else, C3's pinning is to a different group and C4's
      measurement must be re-run against that statistic.
    - >-
      The grid-respecting class -- a step permutation composed with one global
      bit permutation -- is a proper subclass of all 2560-coordinate
      permutations. An exhaustive negative over that class is NOT a proof that
      PAut(C) equals the rotation group, and the record never states it as one;
      the hypergraph bound is the class-free instrument and it is
      budget-limited.

  proof_search_map:
    bottleneck: >-
      Choosing the group in which every covering fraction, orbit count and
      NON-MEMBER verdict of this campaign is computed. The campaign declared one
      by fiat, verified its generators for conformance, and never asked whether
      the set is complete or whether the choice is forced. Until it is pinned,
      goal completion criterion 2's "how many distinct orbits does the census
      occupy" has no determinate answer, because the answer moves by 500 binary
      orders of magnitude with the choice.
    baseline_embedding:
      parameter_slice: >-
        Restricting the candidate generator set to the 32 rotations reproduces
        the campaign's current position exactly: the declared rotation subgroup,
        with f2ffc1's closed form as its orbit count. That slice must be
        recovered by the audit -- the 32 rotations must be CONFIRMED as
        permutation automorphisms by the same code path that tests every
        candidate.
      reproduction_check: >-
        Frozen fixture: apply each of the 32 rotations to a basis of C and
        re-verify the recurrence on every image, requiring 32 of 32 to pass; and
        apply 10^4 random coordinate permutations of the 2560 positions and
        require essentially all to FAIL. A test that accepts everything or
        rejects everything is caught here before any candidate is read.
    observation_collision:
      observable: >-
        The verdict "this permutation preserves C", and downstream the orbit
        identifier a candidate group assigns to a codeword.
      distinct_preimage_search: >-
        TWO-SIDED. (i) TOO COARSE, the dangerous direction: search for a
        permutation OUTSIDE the declared group that nevertheless preserves C --
        if one exists, two codewords the campaign calls DISTINCT are the same
        object under isometry, and every NON-MEMBER verdict inherits the error.
        The search is exhaustive over the grid-respecting class and bounded
        above by the hypergraph automorphism group outside it. (ii) TOO FINE:
        search for an element OF the declared group that does NOT preserve the
        weight profile -- predicted to exist and to be exactly the step-shift,
        which is the same object IDEA-20260829-ea385e attacks from the cost
        side; finding it here by an independent route is a cross-instrument
        agreement check and not a duplication of that record's measurement.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the declared generating set by the isometry-pinned group
          PAut(C), together with the pair of numbers (upper bound on |PAut(C)|,
          size of the declared group) so that any covering fraction carries the
          index that separates them.
        predicted_gain: >-
          Every future orbit count, covering fraction and NON-MEMBER verdict
          gains a named, justified quotient instead of a declared one, and any
          over-count is reported as an explicit index rather than absorbed.
      - transform: observable_fiber
        proposed_object: >-
          Hold the orbit identifier fixed under the FULL module automorphism
          group and vary the forgotten structure; the intrinsic invariant
          distinguishing the resulting objects is the weight profile, and its
          non-constancy on those fibers is the direct proof that GL_16(R) is the
          wrong group.
        predicted_gain: >-
          A per-witness demonstration, printable by hand, that the algebraic
          symmetry group cannot be the equivalence relation -- which is C1 and
          C2 turned into an exhibit rather than an argument.
    quantifier_order: >-
      C1 is "FOR ALL units u of R and FOR ALL codewords W, u W is a codeword" --
      universally quantified, provable in one line from R-linearity and checked
      exhaustively on a basis, since linearity makes a basis check sufficient.
      C2 is a counting statement about a group action, universally quantified
      over the orbit-classification argument. C4 has BOTH shapes and they are
      reported separately: the negative form is "FOR ALL permutations p in the
      declared grid-respecting class outside the rotation group, p does not
      preserve C" -- exhaustive over a finite declared class, and its truth says
      NOTHING about permutations outside that class; the positive form, if any
      candidate survives, is a bare existential discharged by exhibiting the
      permutation. THE ASYMMETRY IS THE RECORD'S MAIN EPISTEMIC HAZARD and is
      why the class-free hypergraph bound is a required metric rather than an
      optional extra.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the unit group of R acts on C by automorphisms (rigorous, one
        line); that the full module automorphism group has exactly 33 orbits
        (rigorous); that a specific, exhaustively enumerated class of
        permutations contains no automorphism of C beyond the 32 rotations; and
        an upper bound on the order of PAut(C) from the automorphism group of
        the low-weight support hypergraph, when that computation completes
        within budget. IT CANNOT CERTIFY that PAut(C) equals the rotation group
        in general, cannot certify that weight is the right cost statistic,
        cannot produce any covering fraction, and cannot say anything about the
        published census, which is readable-empty.
      nearby_object_control: >-
        SHA-0, WHERE THE HOPED-FOR CONCLUSION MUST FAIL LOUDLY AND WHERE THE
        INSTRUMENT IS THEREFORE SHOWN TO FIRE. Without the rotation the code
        splits into 32 independent copies of one length-80 binary code, so every
        one of the 32! permutations of the bit columns preserves it and the
        SHA-0 code's permutation automorphism group is astronomically larger
        than 32. AN INSTRUMENT THAT REPORTS "NOTHING BEYOND THE ROTATIONS" FOR
        SHA-0 IS FALSIFIED ON THE SPOT, and a SHA-1 negative from such a run
        means nothing. A SECOND nearby object: the code with rotation amount 2
        in place of 1, where the squaring map on R carries C to it, so the two
        codes are ISOMORPHIC AS MODULES but must be measured as DIFFERENT CODES;
        an instrument that cannot separate them is reading the module and not
        the code.
    proof_obligations:
      - claim: >-
          PO-0. The SHA-1 and SHA-0 recurrences and the word width are pinned
          from FIPS primary text before any verdict is computed.
        responsibility: baseline
      - claim: >-
          PO-1. The MacWilliams extension theorem is read from a primary or
          textbook source and its hypotheses are checked against this setting,
          or C3's pinning argument is withdrawn and the record keeps only C1,
          C2 and the empirical part of C4.
        responsibility: correctness
      - claim: >-
          PO-2. The unit count of R is verified by direct enumeration at reduced
          widths (2, 4, 8) against the closed form 2^(w-1), and the non-unit
          case is shown to have nontrivial kernel by an explicit rank
          computation, so that "automorphism" is distinguished from
          "endomorphism" by measurement.
        responsibility: correctness
      - claim: >-
          PO-3. The 33-orbit count under GL_16(R) is verified at toy rank and
          width by explicit orbit computation, not asserted from the chain-ring
          classification alone.
        responsibility: size
      - claim: >-
          PO-4. The grid-respecting candidate class is ENUMERATED and its size
          printed, so that an exhaustive negative is reported with the exact
          class it is exhaustive over.
        responsibility: strictness
      - claim: >-
          PO-5. The hypergraph automorphism computation reports either a bound
          or a declared BUDGET OUTCOME; a timeout is never reported as a bound
          and never as evidence that no extra automorphism exists.
        responsibility: scope

