  minimal_test:
    design: >-
      ONE SMALL EXECUTOR TASK, ENTIRELY SYMBOLIC AND SMALL-SCALE, FIVE STAGES,
      AND IT FAILS FAST. STAGE 0 pins both recurrences and the width from FIPS
      primary text and discharges PO-1 by reading the MacWilliams statement from
      a citable source, recording exactly what was read. STAGE 1 IS THE
      TWO-SIDED INSTRUMENT CHECK AND IT GATES EVERYTHING: verify the 32
      rotations as permutation automorphisms (known YES, must be 32 of 32) and
      reject 10^4 random coordinate permutations (known NO, must be 0 of 10^4),
      through the SAME code path. STAGE 2 discharges C1 and C2: verify unit
      multiplication closure on 10^4 codeword-unit pairs, compute the kernel
      dimensions of multiplication by (x+1)^k for all k, and verify the GL orbit
      count at toy widths by explicit orbit computation. STAGE 3 enumerates the
      grid-respecting candidate class in full -- step-index permutations from
      the declared set (identity, all 80 cyclic shifts, reversal, all affine
      maps sending i to a i + b with a invertible modulo 80) crossed with bit
      permutations from the declared set (x to x^k for all odd k, and bit
      reversal) -- prints the class size, and reports every candidate's verdict
      with its derivation. STAGE 4 runs SHA-0 through the identical pipeline at
      matched parameters (the known-larger answer), runs the rotation-amount-2
      nearby object, runs the random-subspace null, and attempts the hypergraph
      automorphism upper bound on the low-weight support set within a declared
      budget, reporting a timeout as a budget outcome. Every table emits
      unmeasured cells as null, never as 0.
    controls:
      - >-
        POSITIVE CONTROL, GATING, AND TWO-SIDED IN ONE STAGE: the 32 rotations
        must be ACCEPTED and 10^4 random permutations must be REJECTED, by the
        same function. An acceptance test never shown to say yes, or never shown
        to say no, certifies nothing in either direction.
      - >-
        FULL-SCALE KNOWN-LARGER-ANSWER CONTROL (SHA-0): the pipeline must find a
        vastly larger automorphism group for SHA-0 than for SHA-1. This is the
        instrument firing on a positive answer at full parameters, which the
        SHA-1 arm cannot provide if its predicted answer is "nothing extra".
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION MUST CHANGE: rotation amount 2, a
        code module-isomorphic to C but not equal to it. An instrument reporting
        the same automorphism verdicts for both is reading the module and not
        the code.
      - >-
        NULL OBJECT: a random 512-dimensional binary subspace of the same
        ambient dimension. Its permutation automorphism group must be trivial
        with overwhelming probability; a nontrivial result means the acceptance
        test has a bug or a degenerate short-circuit.
      - >-
        CROSS-RECORD CONSISTENCY CONTROL: the step-shift's weight-preservation
        rate must agree with IDEA-20260829-ea385e's rotation-versus-shift
        prediction. Agreement is a cross-instrument check, disagreement is a
        first-class finding, and neither record's numbers may be cited by the
        other as results.
      - >-
        CLASS-SIZE DISCLOSURE: an exhaustive negative is reported with the exact
        size and definition of the class it is exhaustive over, printed beside
        the verdict, so that no reader can promote it to a statement about all
        permutations.
      - >-
        BUDGET-OUTCOME DISCIPLINE on the hypergraph bound: a timeout is recorded
        as a budget outcome about a solver, never as evidence that PAut(C) is
        small.
    required_metrics:
      - unit_multiplication_closure_rate with its denominator
      - nonunit kernel dimensions, all 32 values, closed form beside measurement
      - gl_orbit_count_toy per (rank, width) cell
      - rotation_permutation_verification_rate and
        random_permutation_acceptance_rate, both with denominators
      - extra_grid_respecting_automorphism_count with the class size printed
      - every extra automorphism found, printed in full with its derivation
      - sha0_extra_automorphism_count at matched parameters
      - rotation-amount-2 nearby-object verdicts
      - paut_upper_bound_log2 or NOT OBTAINED WITHIN BUDGET, with the budget
      - step_shift_weight_preservation_rate
      - the index of the rotation group in whatever group is found, as an
        explicit over-count factor for every prior orbit count

  falsification_conditions:
    - >-
      Any (codeword, unit) product failing the recurrence. C1 is false and the
      whole record collapses; it is superseded rather than patched.
    - >-
      The toy GL orbit count differs from width plus one. C2 is false as stated.
    - >-
      The rotations are not accepted at 32 of 32, or any random permutation is
      accepted. The instrument is broken and no verdict from the run may be
      cited.
    - >-
      SHA-0 returns no extra automorphisms. The instrument cannot find
      automorphisms that certainly exist, so its SHA-1 negative is void.
    - >-
      A grid-respecting permutation outside the rotation group IS found to
      preserve C. C4's negative form is false; the campaign's declared group is
      too fine; every orbit count on record over-counts by the measured index;
      and this is the run's most important output.
    - >-
      The hypergraph upper bound comes out BELOW 32. Something is wrong, since
      the 32 rotations are in PAut by C3; the run is void until explained.
    - >-
      The MacWilliams statement, once read, does not support the pinning step.
      C3 is withdrawn and the record keeps only C1, C2 and C4's measurement,
      with the pinning question reopened.
    - >-
      Step-shift is measured to preserve the weight profile exactly. Then it is
      an isometry after all, C3's classification of it is wrong, and this record
      and IDEA-20260829-ea385e disagree in a way that must be resolved before
      either is cited.

  confounders:
    - >-
      EXHAUSTIVE OVER A CLASS IS NOT EXHAUSTIVE. The grid-respecting class is a
      tiny subset of the permutations of 2560 coordinates. A negative over it is
      informative and is NOT a proof that PAut(C) is the rotation group, and any
      summary that drops the class qualifier converts a scoped measurement into
      a theorem. The class size is printed on every table for exactly this
      reason.
    - >-
      THE WEIGHT STATISTIC IS A CHOICE INHERITED FROM A SIBLING RECORD. If the
      attack-relevant statistic is not the weight profile, MacWilliams pins a
      different group and every conclusion is about the wrong one. This is
      shared with IDEA-20260829-ea385e's H1 and is not independently validated
      here.
    - >-
      MODULE ISOMORPHISM VERSUS CODE EQUALITY. C and the rotation-amount-2 code
      are isomorphic as R-modules through the squaring map, and an
      implementation that checks module structure rather than the literal
      recurrence would call them the same. The nearby-object control exists
      precisely to catch that, and its verdict must be reported even when it is
      the expected one.
    - >-
      A NEGATIVE RESULT THAT COSTS NOTHING LOOKS LIKE DILIGENCE. Predicting and
      then finding "no extra automorphisms" is the cheap outcome, and the only
      thing separating it from an untested assumption is the SHA-0 arm and the
      random-permutation rejection rate. Both are required metrics and neither
      may be omitted from a report that states the negative.
    - >-
      THE AMBIENT-CODE QUESTION IS INHERITED AND UNRESOLVED. If the
      disturbance-vector space is a larger code than the expansion code, its
      automorphism group is a different group and every verdict here is scoped
      to C. That risk is IDEA-20260829-d81e3b's H1 and is not resolved here.

  interpretation_limits:
    - >-
      NO PATH IS CLAIMED NEW, no attack is claimed, no cost is claimed, and
      nothing is said about any deployed system. Claim tier ceiling `analyzed`.
    - >-
      THIS RECORD PRODUCES NO COVERING FRACTION AND NO CENSUS CONTENT. It
      constrains which denominator a later covering fraction may use, and with a
      readable census of size zero no covering fraction is available at any
      denominator.
    - >-
      An exhaustive negative over the grid-respecting class is scoped to that
      class, and the hypergraph bound, if obtained, is an UPPER bound and not
      the group.
    - >-
      Scoped to the expansion code as pinned, to width 32, to 80 steps, to the
      weight statistic declared, and to the candidate classes actually
      enumerated. SHA-0 and the rotation-amount-2 code appear ONLY as controls
      and no result about either is claimed.
    - >-
      This record introduces NO new tracked object; it measures which projection
      of an existing one is legitimate. Its mechanism section says so first.

  heuristic_assumptions:
    - id: H1
      statement: >-
        ISOMETRY IS THE RIGHT PINNING CRITERION. Two disturbance vectors should
        count as the same object exactly when they are related by a map
        preserving the per-step Hamming weight profile, and therefore -- by the
        MacWilliams extension theorem over GF(2) -- exactly when they are
        related by an element of PAut(C). Formally: the equivalence relation on
        disturbance vectors that a covering fraction should be computed modulo
        is the orbit equivalence of PAut(C), not of any larger algebraic
        automorphism group and not of any declared set that is not a subgroup of
        it.
      rigorous_support: >-
        The MacWilliams extension theorem is rigorous (subject to PO-1's reading
        from a source), and the containment of the rotations in PAut(C) is a
        one-line verification. What is NOT rigorous is that weight is the
        decision-relevant statistic; that is inherited from
        IDEA-20260829-ea385e's H1, whose own rigorous support is only that cost
        is non-decreasing in the count of local collisions under KN-TECH-066's
        accounting. This is the weakest link in the record and it is named as
        such rather than assumed.
      validation_plan: >-
        Two routes, both executable without acquisition. (i) STRUCTURAL: verify
        that the qualitative conclusion is INDEPENDENT of the specific weight
        functional by checking that the same permutation set preserves every
        per-step functional of the weight vector -- an algebraic argument
        requiring no sampling, which if it goes through makes H1 depend only on
        "the statistic is a functional of the per-step weight vector" rather
        than on the exact functional. (ii) EMPIRICAL CROSS-CHECK: for 10^3
        sampled codewords under declared seeds, compute the plain 20-to-79
        weight and a position-weighted variant with declared weights, and report
        the Spearman rank correlation; below 0.7 the functional choice is
        load-bearing and every verdict must be reported under both. TAIL CHECK:
        the codewords with the most extreme weight profiles are inspected
        individually so a degenerate minimiser cannot anchor the comparison.
        TRANSFER ASSUMPTION, STATED: no transfer to any published cost function
        is claimed; locating the published function is an acquisition
        obligation.
    - id: H2
      statement: >-
        THE DECLARED CANDIDATE CLASS IS INFORMATIVE. The grid-respecting class
        -- a permutation of the 80 step indices composed with one global
        permutation of the 32 bit positions -- captures every permutation
        automorphism of C that a human or an adjudicator would plausibly declare
        as an equivalence generator, so an exhaustive negative over it is
        informative about the practical question even though it is not a
        theorem about PAut(C). This imitates the standard practice of searching
        a code's automorphism group within a structured subgroup suggested by
        the construction.
      rigorous_support: >-
        NONE for the general statement. PAut(C) could contain a permutation that
        mixes bit and step coordinates in a way no product form captures, and
        nothing here excludes that. The rigorous content is only that the class
        is finite, that its enumeration is exhaustive over itself, and that the
        hypergraph bound is class-free.
      validation_plan: >-
        Run the hypergraph automorphism computation on the complete low-weight
        support set as the class-free instrument, at toy parameters and on SHA-0
        where the answer is known to be large, and report the ratio between the
        class-restricted answer and the class-free bound at those parameters. A
        large ratio on the controls means the class restriction is doing most of
        the work and the SHA-1 negative must be reported with that ratio beside
        it. Sampled parameters: toy widths 2, 4, 8 with ranks 2 and 4; SHA-0 at
        full 80 steps; SHA-1 at whatever low-weight set is available. TAIL
        CHECK: inspect the largest automorphism found on the controls and
        confirm it is of the predicted form (a bit-column permutation on SHA-0).
        TRANSFER ASSUMPTION, STATED: a ratio measured on SHA-0 or on toy codes
        does not transfer to SHA-1, and is reported as a property of the
        controls.

  target_complexity:
    time_exponent: >-
      No asymptotic parameter. Unit-closure verification: 10^8 word
      multiplications, about 2^30 bit operations. Kernel dimensions: 32 rank
      computations on 512-by-512 GF(2) matrices, about 2^27 bit operations. The
      grid-respecting class has size at most about 80 times 32 times a small
      constant, a few thousand candidates, each tested by 16 basis expansions,
      about 2^25 bit operations total. Toy GL orbit computations: at most 2^20
      module elements. THE ONLY UNBOUNDED PIECE is the hypergraph automorphism
      computation, which is capped by a declared budget and reported as a budget
      outcome on timeout.
    memory_exponent: >-
      Negligible: 512-by-512 GF(2) matrices are 32 KB each, the candidate class
      is a list of a few thousand permutations, and the toy enumerations are
      under 100 MB. The hypergraph computation's memory is bounded by the size
      of the low-weight set it is given, which is reported. No time-memory
      tradeoff to state.
    best_known: >-
      IN THIS PROGRAM: the equivalence group is DECLARED and its completeness
      has never been measured; there is no baseline number of any kind, and the
      campaign's four batches verified generators for conformance without ever
      asking whether the set is closed or complete. IN THE LITERATURE: UNKNOWN.
      One search returned no source stating the automorphism group of the SHA-1
      expansion code, which is a fact about one search and not evidence of
      absence; coding-theoretic analysis of this code is published at
      search-summary level and may well contain the answer.
    hidden_overhead: >-
      No o(1). What is hidden and is stated: the entire measured part of C4 is
      exhaustive only over a declared finite class, so its negative is a
      class-scoped negative and the honest general statement is the hypergraph
      UPPER BOUND, which may not complete within budget. If it does not, the
      record's general claim is precisely C1 and C2 and nothing more.
    tradeoff_note: >-
      Not applicable at this scale; every computation is small and
      single-threaded except the hypergraph bound, which is a standard graph
      automorphism workload with its own well-known scaling and is budget-capped
      rather than optimised here.

  dominated_by: >-
    PARETO CHECK, ROW BY ROW. (1) Against IDEA-20260829-f2ffc1: NOT dominated
    and partially ADVERSARIAL -- that record computes an exact orbit count under
    a group it takes as given; this one shows the group is a declared sliver of
    the code's automorphism group and measures whether it is the isometry-pinned
    one. Neither supersedes the other; f2ffc1's number becomes MEANINGFUL if
    this record's C4 negative holds and becomes an over-count by a measured
    index if it fails. (2) Against IDEA-20260829-ea385e: NOT dominated and
    complementary on the opposite side of the same question -- too coarse for
    cost versus too fine as a group -- with one shared prediction (step-shift is
    not weight-preserving) deliberately measured twice by different routes as a
    cross-check. (3) Against IDEA-20260829-d81e3b: NOT dominated and mutually
    supplying -- that record needs a pinned group to quotient its cost-bounded
    set, this record needs its low-weight set for the class-free bound. (4)
    Against IDEA-20260829-9e6650 and IDEA-20260829-c92c2f: NOT dominated and
    disjoint. (5) Against the committed adjudicator and its four batches of
    control work (KN-TECH-6785f2; EV-DIFFP-b878aa, b16b01, afd96c, 1e08cc): NOT
    dominated -- all of that measures whether the instrument implements the
    declared relation, none of it measures whether the declared relation is the
    right one or even a complete one. (6) Against the pending roughly
    2950-second selector-swap control: NOT dominated, CHEAPER by roughly an
    order of magnitude, complementary, and it does not presuppose the funding
    decision. (7) Against the retrieved-but-unopened coding-theory line
    (Pramstaller-Rechberger-Rijmen; Rijmen-Oswald 2004/364; Jutla-Patthak
    2005/247) and the Manuel classification: UNKNOWN AND POSSIBLY DOMINATING. A
    classification of disturbance vectors indexed by a step offset and a bit
    rotation, if that is what it is, is a statement about exactly this group,
    and if it also states the code's automorphism group then C4 is a
    re-derivation. THAT ROW REQUIRES ACQUISITION AND IS NOT CLOSED HERE. (8)
    Against the 2026-08-28 RQ-SHAONE and RQ-MDFIVE round: NOT dominated and
    disjoint -- none of those records concerns the equivalence relation or any
    automorphism group.
  sota_delta: >-
    QUANTITATIVELY, AGAINST THE PROGRAM'S OWN STATE. The size of the SHA-1
    expansion code's automorphism group is currently UNRECORDED anywhere in this
    program, and the declared equivalence group's completeness has never been
    measured; the campaign's working denominator is a group of order 32 plus a
    step-shift of unmeasured order. This record establishes rigorously that at
    least 2^31 unit automorphisms exist and that the full module automorphism
    group leaves exactly 33 orbits, so that the available orbit counts span from
    33 to 2^512 -- about 500 binary orders of magnitude of denominator that the
    campaign has been treating as fixed. It then measures, over an exhaustively
    enumerated candidate class of a few thousand permutations and for about 2^30
    bit operations, whether the isometry-pinned group exceeds the 32 rotations,
    with a two-sided instrument check and a full-scale known-larger-answer
    control on SHA-0. AGAINST THE LITERATURE: no delta is claimed, because no
    paper was opened. NO CRYPTANALYTIC DELTA OF ANY KIND IS CLAIMED: no attack,
    no cost, no path, and no statement about SHA-1's security.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      A few hundred lines of Python with a GF(2) linear-algebra helper; the
      whole battery except the optional hypergraph bound runs in minutes on one
      core. The hypergraph bound needs an off-the-shelf graph automorphism tool
      and is budget-capped and optional; the record's claims C1, C2 and the
      class-restricted part of C4 do not depend on it.

  recommended_priority: high
