idea:
  id: IDEA-20260829-a03f74
  question_id: RQ-DIFFP-a5c483
  goal_id: GOAL-DIFFP-84d641
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE DENOMINATOR IS A CHOICE AND THE ALGEBRA WILL NOT MAKE IT FOR YOU -- every
    one of the 2^31 units of GF(2)[x]/(x^32+1) is an automorphism of the SHA-1
    expansion code, so the orbit count of the disturbance-vector space ranges
    from 33 to 2^512 depending on which group is declared; pin the group by the
    MacWilliams isometry criterion and MEASURE whether the permutation
    automorphism group is larger than the 32 rotations, with SHA-0 as the
    known-larger-answer positive control
  class: representation

  claim: >-
    Write R for GF(2)[x]/(x^32 + 1) with a 32-bit word read as a polynomial and
    the one-bit left rotation as multiplication by x, and C for the SHA-1
    expansion code, a free R-module of rank 16. FOUR CLAIMS, SEPARATELY
    FALSIFIABLE, THE FIRST TWO RIGOROUS AND THE LAST TWO MEASURED.
    (C1) THE DECLARED GROUP IS A VANISHINGLY SMALL PART OF THE CODE'S
    AUTOMORPHISM GROUP. The expansion recurrence is R-LINEAR, so componentwise
    multiplication of a codeword by ANY element u of R maps C into C, and by any
    UNIT u maps C onto C. R has exactly 2^31 units (the odd-weight
    polynomials, since the non-units are the ideal (x + 1) of size 2^31).
    RQ-DIFFP-a5c483's declared equivalence uses the cyclic group of order 32
    generated by the rotation, which is the subgroup of units generated by x.
    The declared group is therefore a subgroup of index at least 2^26 in the
    unit group alone, and the full R-module automorphism group GL_16(R) is
    larger still, of order exceeding 2^8000.
    (C2) THEREFORE "THE ORBIT COUNT OF THE DISTURBANCE-VECTOR SPACE" IS NOT A
    NUMBER ABOUT SHA-1 UNTIL A GROUP IS PINNED, AND THE RANGE IS ENORMOUS.
    Under the trivial group there are 2^512 orbits. Under the full module
    automorphism group GL_16(R) there are EXACTLY 33, because the orbits of
    GL_n over a finite chain ring on the free module are classified by the
    minimum (x + 1)-adic valuation of the coordinate vector, which takes the 32
    values 0 to 31 plus the zero module element. Under the declared rotation
    group the count is the 2^507-scale closed form of IDEA-20260829-f2ffc1. A
    covering fraction is therefore a fraction of a denominator that spans about
    500 binary orders of magnitude depending on an undeclared choice.
    (C3) THE ONLY DEFENSIBLE PINNING CRITERION IS ISOMETRY, AND IT IS
    COMPUTABLE. The quantity that decides whether two disturbance vectors are
    the same attack is the per-step weight profile, so the group must consist of
    maps preserving Hamming weight. By the MacWilliams extension theorem, every
    linear Hamming isometry of a binary code is induced by a permutation of the
    coordinates, so the isometry-pinned group is exactly PAut(C), the
    permutation automorphism group of C inside the symmetric group on 2560
    coordinates. THE 32 ROTATIONS LIE IN PAut(C) -- a rotation permutes bit
    positions within every word simultaneously. THE STEP-SHIFT DOES NOT LIE IN
    PAut(C) AT ALL, because it is not a coordinate permutation of the 80-step
    array: it recomputes words at the window ends.
    (C4) THE MEASURED, TWO-SIDED CLAIM. PAut(C) contains NOTHING beyond the 32
    rotations within the exhaustively testable class of grid-respecting
    permutations -- pairs consisting of a permutation of the 80 step indices and
    a single global permutation of the 32 bit positions. Concretely, step
    reversal is NOT in PAut(C) (reversing the step order sends C to the code of
    the reciprocal recurrence, which is not C), the bit map x to x^k for odd k
    is not in PAut(C) for k not equal to 1 (it sends C to the code with rotation
    amount k), and no step-index affine map other than the identity is in
    PAut(C). IF ANY OF THESE IS FALSE, the campaign's declared group is TOO FINE
    and every orbit count computed under it OVER-COUNTS distinct disturbance
    vectors by the index of the declared group in PAut(C) -- which makes every
    NON-MEMBER verdict over-declare distinctness by that same factor. IF ALL ARE
    TRUE, the isometry-pinned group is exactly the rotation group, the closed
    form of IDEA-20260829-f2ffc1 IS the right denominator, and the declared
    equivalence is too coarse by exactly the step-shift factor that
    IDEA-20260829-ea385e independently attacks on cost grounds. BOTH OUTCOMES
    ARE RESULTS AND NEITHER IS A FAILURE.
    NO PATH IS CLAIMED NEW, NO ATTACK IS CLAIMED, AND NO COST IS CLAIMED.

  mechanism: >-
    THE STRUCTURAL DIAGNOSIS, AND IT IS ONE LINE OF ALGEBRA THAT NOBODY IN THIS
    CAMPAIGN HAS WRITTEN DOWN. Four batches of instrument work have taken the
    declared equivalence generators as given and asked whether the ADJUDICATOR
    implements them correctly. Nobody has asked whether the declared generating
    set is anywhere near the code's actual symmetry group. It is not: the
    recurrence is linear over a ring with 2^31 units, and every unit acts. The
    declared group of order 32 is a sliver.
    WHY THE SLIVER IS NOT OBVIOUSLY WRONG, AND WHY THAT IS THE INTERESTING PART.
    Multiplication by a general unit -- say by 1 + x + x^2 -- replaces each word
    by the XOR of three rotations of itself. That is an automorphism of the CODE
    and a catastrophe for the ATTACK: it changes the Hamming weight, moves the
    local collisions, and destroys the object's meaning as a disturbance vector.
    So the code's symmetry group is much larger than the attack's symmetry
    group, and the declared group is an attempt at the second while being
    described as if it were the first. The two are pulled apart here for the
    first time in this campaign.
    THE PINNING MECHANISM IS MacWilliams, AND IT CONVERTS A TASTE QUESTION INTO
    A COMPUTATION. "Which maps preserve what makes a disturbance vector useful"
    sounds like a modelling choice with no right answer. It has one, once
    usefulness is tied to the weight profile: the linear maps preserving Hamming
    weight on a binary code are exactly the coordinate permutations preserving
    the code, by the MacWilliams extension theorem. So the group is PAut(C), a
    concrete finite object, and the open question becomes the concrete one of
    whether PAut(C) is bigger than the obvious 32 rotations. That question is
    decidable in the grid-respecting class by exhaustive testing over a few
    thousand candidates, and boundable from above outside that class by a
    hypergraph automorphism computation on the supports of the code's lightest
    codewords.
    THE LOSSY-PROJECTION TEST, APPLIED HONESTLY AND ANSWERED WITH A
    QUALIFICATION. The tracked object is the ORBIT of a codeword under a
    declared group, and an orbit is a genuinely lossy projection -- it discards
    the group coordinate. What this record adds is not a new object but a
    measurement of WHICH projection is legitimate, and the reason that is not
    merely a change of coordinates is C1: distinct choices of group differ by
    500 binary orders of magnitude in what they discard, so the choice is not a
    relabelling of one object but a selection among wildly different ones.
    STATED PLAINLY: THIS RECORD INTRODUCES NO NEW TRACKED OBJECT. Its value, if
    any, is entirely in C1's rigorous content and in C4's measurement, and
    saying so up front is cheaper than being caught by the test later.

