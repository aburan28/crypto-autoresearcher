  lossy_projection_identifiability_audit:
    projection: >-
      The full algebraic state -- a supersingular curve with its endomorphism ring, its
      torsion, its quaternion order, and the arithmetic of F_{p^2} -- is projected to the
      transcript: a labelled subgraph of j-invariants with l-labels and Frobenius pairings.
    what_is_discarded: >-
      End(E) and every quaternion invariant including delta(E); all torsion structure and
      every point of E; every field operation other than equality of j-invariants; and the
      global position of the explored subgraph inside the graph.
    why_genuinely_lossy: >-
      DEMONSTRATED, NOT ASSERTED, AND THE DEMONSTRATION IS THE PROOF TECHNIQUE. Below the
      girth every explored neighbourhood is an (l+1)-regular tree, so the transcript is
      isomorphic for every starting curve. In particular a curve with delta = 1 and a curve
      with delta ~ p^{1/3} have identical transcripts, while delta -- the quantity that
      determines the entire cost -- differs by p^{1/3}. The fibre of the projection over a
      short transcript is essentially the whole vertex set.
    why_compatible_with_the_operations: >-
      Exactly compatible, by construction: the model's operations are defined ON the
      transcript, so the retained part propagates deterministically and completely. This
      is the one case where the propagation requirement is satisfied by definition rather
      than by an argument, and the record states that plainly rather than claiming credit
      for it.
    is_it_only_a_change_of_coordinates: >-
      NO, and this is the sharpest available answer in this goal. The canonical failure of
      docs/inventor-protocol.md section 2 is a projection from which the discarded data is
      recoverable. Here the discarded datum delta(E) is provably NOT recoverable from a
      sub-girth transcript, because the transcripts collide across the full range of delta.
      The record's own claim is that this collision is not a defect of the object but the
      content of the model.
    mirror_failure_check: >-
      CHECKED AND FIRED IN A CONTROLLED WAY, WHICH MUST BE REPORTED. The mirror failure is
      a projection so lossy it is CONSTANT across inputs. Below the girth this projection
      IS essentially constant -- that is exactly Step 2. It stops being constant at the
      first cycle or Frobenius coincidence, which is where all the algorithm's information
      comes from. THE HONEST STATEMENT IS THEREFORE: the comparator spread is zero below
      the girth and positive above it, and the whole model's discriminating power lives
      above the girth. Any evaluation of this model that reports a signal from sub-girth
      transcripts is reporting an artifact.

  null_object_control:
    primary_null: >-
      THE delta-ORACLE-AUGMENTED MODEL. Add a fourth operation (Q4): given j in S and a
      threshold T, return whether delta(E_j) <= T, at unit cost. Re-run the identical
      lower-bound argument. IT MUST RETURN AN EXPONENT AT OR BELOW 1/5.
    why_it_can_fail: >-
      IT CAN FAIL AND ITS FAILURE KILLS THE RECORD. The bound of 1/5 is not invented here:
      IDEA-20260805-250e50 derives that a free exact delta-screen gives time exponent
      E = 1/5 at theta = 1/5 from its own committed cost identity, by a route that does not
      pass through this model at all. So the augmented model has an independently known
      answer. IF THE ARGUMENT STILL RETURNS 1/3 AFTER Q4 IS ADDED, then it is insensitive
      to the single piece of information the whole record claims is decisive, it is
      measuring the shape of the counting rather than the information content of the
      transcript, and every conclusion drawn from it is an artifact. This is the control
      the twelve committed closures do not have and it is the reason to run this record at
      all.
    secondary_nulls:
      - >-
        FROBENIUS-FREE BASELINE REPRODUCTION. Delete Q2 and set the target to a second
        given curve E'. The bound must return 1/2, reproducing Delfs-Galbraith and
        meet-in-the-middle. A model that cannot reproduce the pre-2026 baseline may not be
        used to certify the post-2026 one.
      - >-
        NO-PLANTED-PATH NULL. Run the identical argument on a random (l+1)-regular
        Frobenius-equivariant graph with NO short E -> E^{(p)} path planted (i.e. without
        Theorem 1.5). The bound must return 1/2 -- the birthday exponent -- not 1/3. If it
        returns 1/3 there too, the argument is not using Theorem 1.5 and the 1/3 is coming
        from the accounting rather than from the mathematics.
      - >-
        EMBEDDING GATE: all five known algorithms must embed with their committed query
        counts. A model that cannot express van Oorschot-Wiener's memory-w variant at
        p^{1/2}/w^{1/2} transcript entries is missing the memory axis and its bound is not
        comparable to the committed frontier.

  assumptions:
    - Classical computation. No quantum operation is in the model and none is claimed.
    - >-
      Success is measured against a uniformly random supersingular E over F_{p^2}, matching
      the quantifier of Heuristic 1 and of Lemma 3.5 of the frozen source.
    - >-
      B is p^{o(1)}, matching the incumbent's own choice B = e^{(1/3)sqrt(log(p/2))}
      (line 200, READ). A model with B = p^{Omega(1)} is a different model and the record
      does not score it.

  proof_search_map:
    bottleneck: >-
      Making "the adversary may place the split midpoint uniformly among the p^{1/3+o(1)}
      reachable vertices, consistently with all answers given" rigorous. Everything else in
      the argument is counting.
    baseline_embedding:
      parameter_slice: >-
        Q2 deleted, target a second given curve: the bound must be 1/2. And with Q2
        present but Theorem 1.5 withheld: also 1/2.
      reproduction_check: >-
        Symbolic, plus the five-algorithm embedding table with committed query counts.
        A frozen regression fixture is the embedding table itself: it is written once and
        every later version of the model must reproduce it row for row.
    observation_collision:
      observable: The transcript.
      distinct_preimage_search: >-
        PERFORMED AND A COLLISION WAS FOUND ON EACH SIDE OF THE CONCLUSION, WHICH IS THE
        strongest form section 8 asks for: a curve with j in F_p (delta = 1, the problem is
        trivial there since E^{(p)} is isomorphic to E) and a generic curve
        (delta ~ p^{1/3}) have identical sub-girth transcripts. The collision is therefore
        not a falsifier of the record -- it is the record's engine -- but it IS a falsifier
        of any claim that the transcript identifies the instance, and the record makes no
        such claim.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from "no sub-p^{1/3} algorithm is known" to "no algorithm in IGQ makes
          o(p^{1/3-o(1)}) queries", where the hypothesis becomes an exact counting
          condition on transcripts. Separate obligations: encoding (the embedding table),
          completeness (every classical algorithm embeds), soundness (the bound), transfer
          (what the bound does NOT cover, i.e. E1-E3), cost loss (the o(1)).
        predicted_gain: >-
          No cost gain. The gain is that a negative result acquires a mechanism and a
          named escape, which is what docs/inventor-protocol.md section 4 requires and what
          the twelve closures currently lack.
      - transform: observable_fiber
        proposed_object: >-
          Hold the transcript fixed and vary delta. The intrinsic invariant distinguishing
          the resulting curves is delta itself, which is computable on the quaternion side
          and not in the model -- which is precisely the statement E1.
        predicted_gain: The forward guidance, stated as a theorem-shaped sentence.
    quantifier_order: >-
      FOR ALL primes p, FOR ALL IGQ algorithms A with query budget Q, IF A outputs a valid
      path E -> E^{(p)} with probability at least 1/3 over a uniformly random supersingular
      E and A's own coins, THEN Q >= p^{1/3-o(1)}.
      NOTE THE ORDER CAREFULLY, BECAUSE IT IS WHERE SUCH CLAIMS USUALLY FAIL: A may depend
      on p (non-uniformity in p is allowed and is exactly what IDEA-20260806-9c2f80 studies
      on the advice axis), and the o(1) may depend on the success probability, but A may
      NOT depend on E. An argument that quietly lets the adversary choose the graph AFTER
      seeing A is proving a weaker statement than it appears to; an argument that lets A
      depend on E is proving nothing. Both failure modes are pre-registered as audit items.
    method_ceiling:
      strongest_certifiable_claim: >-
        "In IGQ, Omega(p^{1/3-o(1)}) queries are necessary." IT CAN NEVER SHOW that no
        sub-p^{1/3} algorithm exists, because the model excludes the quaternion side, the
        torsion side, and symbolic manipulation of Phi_l -- and the frozen source's own
        section 4.2 computes on the quaternion side. A model-relative lower bound that
        excludes the most promising technique is a MAP OF WHERE TO LOOK, not an
        impossibility result, and no downstream record may cite it as one.
      nearby_object_control: >-
        The delta-oracle-augmented model (primary null): the closest object on which the
        desired conclusion FAILS, since the conclusion there is at most 1/5 by an
        independent committed derivation. A method that cannot distinguish IGQ from
        IGQ+Q4 has not identified the load-bearing structure.
    proof_obligations:
      - claim: Every known classical algorithm embeds in IGQ at its committed query count.
        responsibility: completeness
      - claim: Sub-girth transcripts are instance-independent.
        responsibility: feasibility
      - claim: The admissible-midpoint count is p^{o(1)}.
        responsibility: size
      - claim: The adversary may keep the midpoint uniform (THE OPEN OBLIGATION).
        responsibility: strictness
      - claim: The bound does not extend past E1, E2, E3.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        embedding_failures: number of the five known algorithms {Kohel, Delfs-Galbraith,
        MITM, vOW at memory w, Wesolowski Algorithm 3} that fail to embed in IGQ at their
        committed query counts
      direction: lower
      minimum_effect: >-
        EXACTLY 0. A single failure means the model is not a model of this problem and the
        line stops before any bound is attempted. This is the cheapest possible kill and it
        is run first.
    - metric: >-
        bound_exponent(model variant) for variants {IGQ, IGQ minus Q2 with a second-curve
        target, IGQ on a graph with no planted short path, IGQ + delta-oracle Q4}
      direction: different
      minimum_effect: >-
        PRE-REGISTERED: 1/3, 1/2, 1/2, and <= 1/5 respectively. The four values must be
        distinct in the pattern shown. If the first three collapse to one value the
        argument is not sensitive to its inputs; if the fourth does not drop below 1/3 the
        argument is an artifact and nothing may be reported.
    - metric: >-
        open_obligation_locus: the identified step at which the uniform-midpoint
        conditioning fails to be made rigorous, named to the level of a single lemma
      direction: different
      minimum_effect: >-
