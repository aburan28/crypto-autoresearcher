idea:
  id: IDEA-20260806-d5a34e
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-06'
  title: >-
    Turn "twelve avenues closed" into one theorem in one stated model: the
    isogeny-graph query model, in which the incumbent algorithm is LITERALLY an
    algorithm, a matching Omega(p^{1/3-o(1)}) query lower bound is attemptable, and the
    named escape is exactly the quaternion side -- with a delta-oracle null that MUST
    drop the bound to 1/5 or the argument is an artifact
  class: theory

  claim: >-
    DEC-20260805-596d71 records that "p^{1/3+o(1)} is the tight classical exponent" on
    the strength of twelve avenues closed by named obstructions. Under
    docs/inventor-protocol.md section 4 that is a count of screened-and-rejected
    mechanisms -- a fatigue report -- unless it is converted into a named obstruction, an
    argument, and forward guidance. THIS RECORD PROPOSES THE CONVERSION, AND IT IS
    ATTEMPTABLE BECAUSE THE INCUMBENT ALGORITHM IS ALREADY EXPRESSED IN THE MODEL BY ITS
    OWN AUTHOR.
    DEFINE THE ISOGENY-GRAPH QUERY MODEL (IGQ). State: a finite set S of j-invariants,
    initially {j(E)}. Three operations, each one query:
      (Q1) NEIGHBOUR. Given j in S and a prime l <= B, return the roots of
           Phi_l(j, X) in F_{p^2} -- the l+1 neighbours -- and add them to S.
      (Q2) FROBENIUS. Given j in S, return j^p and add it to S.
      (Q3) EQUALITY. Given j, j' in S, return whether j = j'.
    Output: a sequence of edges in S witnessing a path E -> E^{(p)}. Cost: query count.
    THE INCUMBENT IS AN IGQ ALGORITHM, VERBATIM. Algorithm 1 step 6 of the frozen source
    (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 147, READ) says: "it is sufficient
    to represent the isogenies eta as sequences of elliptic curves (E0, E1, . . .) ... one
    only needs to compute the codomain of each step eta (via modular polynomials)."
    Algorithm 2 line 171 (READ) is a Q2 followed by Q3 against a keyed table. Algorithm 3
    line 202 (READ) is a sequence of Q1s at l = 2. So the entire p^{1/3+o(1)} result is
    Theta~(p^{1/3}) IGQ queries, and so are Delfs-Galbraith, meet-in-the-middle, van
    Oorschot-Wiener and Kohel. THE MODEL IS NOT A STRAW MAN: IT CONTAINS EVERY CLASSICAL
    ALGORITHM THIS CORPUS HAS EVER COSTED.
    THE TARGET STATEMENT, WHICH IS A CONJECTURE WITH A PROOF PLAN AND NOT A THEOREM THIS
    RECORD CLAIMS: any IGQ algorithm that outputs a path E -> E^{(p)} with constant
    probability over a uniformly random supersingular E makes Omega(p^{1/3-o(1)}) queries.
    THE PROOF ROUTE IS AN OBSERVATION COLLISION AND IT IS THE SAME COLLISION THAT MAKES
    THE MODEL LOSSY: below the girth, every explored neighbourhood is a tree, so curves
    with wildly different minimal degrees delta present IDENTICAL transcripts, and the
    algorithm can only locate the split midpoint by enumerating a p^{-o(1)} fraction of a
    ball of X^{2+o(1)} = p^{1/3+o(1)} vertices, there being only tau(delta)/u = p^{o(1)}
    admissible midpoints (the divisor-window count already derived in this campaign by
    IDEA-20260805-b4bc59 and, independently, by the pre-ledger entry C2-3).
    BOTH OUTCOMES ARE DELIVERABLES AND NEITHER IS AN ATTACK. If the bound goes through,
    this goal replaces twelve enumerated closures with one theorem plus a precisely named
    escape hatch -- ANY ALGORITHM THAT COMPUTES ON THE QUATERNION SIDE, which is exactly
    where the frozen source's own section 4.2 experiment lives and exactly where
    IDEA-20260805-250e50's screen would have to be built. If it does not go through, the
    step at which the adversary argument fails IS A CONSTRUCTION HINT, because that step
    names what an IGQ algorithm could exploit that no known one does.

  discriminated_from:
    nearest_existing_idea: IDEA-20260805-c60813
    why_it_is_the_nearest: >-
      c60813 is the only committed record in either goal that offers a KILL -- a named
      obstruction with an argument and a redirection, written to be attacked -- rather
      than a measurement or a cost model. Both records are closure-shaped and both accept
      that the honest expected outcome is a negative with a mechanism.
    differing_observable: >-
      THE QUANTIFIER OVER ALGORITHMS, AND THE QUERY COUNT AS THE MEASURED QUANTITY.
      c60813's three prongs are statements about ONE named architecture (relation
      collection on the Deuring side): the object is a groupoid, its abelianisation is
      trivial, its Hecke module has dimension ~p/12. Every prong is refuted by exhibiting
      a different architecture, and c60813 says so. THIS RECORD'S statement quantifies
      over ALL algorithms in a stated model and its observable is a COUNTED NUMBER OF
      QUERIES, not a structural property of one construction. Concretely: c60813's
      prongs cannot be evaluated on Wesolowski's own algorithm at all (it collects no
      relations), whereas this record's observable is defined for it and takes the value
      p^{1/3+o(1)}. That is a differing observable on a shared object, not a reframing.
      Second concrete difference: c60813's obstruction, if correct, closes the relation
      lane and says nothing about the meet-in-the-middle lane; this record's obstruction,
      if correct, closes BOTH and every other IGQ lane simultaneously, and leaves open
      exactly the quaternion-side lane that c60813 was working in.
    also_discriminated_from:
      - >-
        IDEA-20260805-e7ee4a and IDEA-20260806-e4c719 -- both compute the cost of a FIXED
        architecture (balanced split) as a function of the object's parameters. Neither
        quantifies over algorithms and neither has a query count. e4c719's identity is an
        UPPER bound machine; this record attempts a LOWER bound, and the two meet at
        p^{1/3} which is the required consistency check between them.
      - >-
        IDEA-20260805-250e50 -- prices a screen. This record does not price a screen; it
        USES the screen as its null object, because 250e50's derived free-exact-screen
        exponent 1/5 is the number the delta-oracle-augmented model must return.
      - >-
        IDEA-20260803-82b2b7 -- also a collision search deciding a definability question,
        also written to terminate a lane. But its projection pi is the FC0 observable
        trace of a CSIDH collimation sieve and its question is measurability of a stopping
        time. Different object, different problem, different model; and DEC-20260805-0e1c91
        records that 82b2b7's presumed-frozen projection is not in fact in the freeze,
        which is a defect this record's projection cannot inherit because the projection
        here is DEFINED by this record rather than adopted from an external freeze.
      - >-
        ideas/catalogue-20260805/A3-6 (pre-ledger) attempts KN-OPEN-019 -- an
        object-indexed taxonomy from equivariance under the self-reduction group -- FOR
        THE PRIME-FIELD ECDLP. It is the closest thing in the corpus to "convert a
        saturation claim into an argument", and it is on a different problem with a
        different group and no query model.

  object_first_candidate:
    tracked_object: >-
      THE TRANSCRIPT: the labelled subgraph the algorithm has explored, together with
      which vertices are Frobenius-images of which. It is followed through the computation
      as: initial state {j(E)} -> query -> appended edges and vertices -> ... -> the
      output path. Everything the algorithm can ever condition on is a function of the
      transcript.
    one_step_propagation_rule: >-
      Deterministic and complete by construction. A Q1 query at (j, l) appends l+1 vertices
      and l+1 edges labelled l; a Q2 query appends one vertex and one Frobenius pairing; a
      Q3 query appends one bit. The transcript after k+1 queries is a function of the
      transcript after k queries and the query issued, and NOTHING ELSE. That is the
      strongest possible form of the propagation requirement and it is what makes a lower
      bound attemptable at all.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) proposing any algorithm -- this record proposes
      none; (b) meet-in-the-middle / claw / vOW as objects of improvement (they are
      INSTANCES to be measured in the model); (c) KLPT and quaternion-side algorithms as
      attacks -- they are the named ESCAPE from the model and are deliberately outside it;
      (d) orientation / CM descent (closed for GOAL-SSI-001 by DEC-20260804-3677f1);
      (e) torsion-image / Kani; (f) quantum models -- the model as stated is classical and
      the record says so on its face; (g) CSIDH / FC0.
    newness_score: >-
      Query-complexity lower bounds and adversary arguments are entirely standard
      technique. What this corpus does not contain -- verified in
      coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/tasks/TASK-20260806-fd3518/duplication_audit.md
      -- is (i) any model in which the campaign's own tightness claim is a statement rather
      than an enumeration, (ii) the observation that the frozen source's Algorithm 1
      already restricts itself to codomain-only queries and is therefore an IGQ algorithm
      by its author's own design choice, and (iii) the delta-oracle null that makes the
      argument's sensitivity testable. Whether such a model appears in the published
      literature is NOT adjudicated: primary sources are unreachable.
    testability_score: >-
      High for the audits, honest about the theorem. The model definition, the embedding
      of five known algorithms, the two baseline reproductions and the delta-oracle null
      are all pen and paper and all can fail. The lower bound itself is a research task
      with an uncertain outcome, and the record's ranking reflects that.
    survival_score: >-
      The transcript survives the entire computation by definition. The MODEL dissolves
      the moment an algorithm evaluates anything about a curve beyond its neighbours --
      a torsion point, a modular polynomial at a non-supersingular argument, a quaternion
      order. Naming that dissolution boundary precisely is half the deliverable.

  mechanism: >-
    STEP 1 -- THE MODEL CONTAINS THE INCUMBENT, WHICH IS WHY IT IS NOT A STRAW MAN. Three
    verbatim readings from inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ IN THIS
    SESSION. Line 147 (Algorithm 1 step 6): "it is sufficient to represent the isogenies
    eta as sequences of elliptic curves (E0, E1, . . .), where each Ei is l-isogenous to
    E_{i+1} for some l <= B. In particular, one only needs to compute the codomain of each
    step eta (via modular polynomials)." Line 156 (Lemma 3.3 proof): the neighbours "are
    precisely the roots of the modular polynomial Phi_l(j(E'), x)". Line 171 (Algorithm 2
    step 5): "if (E')^{(p)} is the key of an entry". Those three lines are Q1, Q1 and
    Q2+Q3. The author deliberately avoids kernels and Velu until the very last step
    (line 172, "one may want to convert this final isogeny to a more explicit form"),
    which is a post-solution conversion and outside the search.
    EMBEDDING TABLE, TO BE PRODUCED AS THE FIRST DELIVERABLE: Kohel (p queries),
    Delfs-Galbraith (p^{1/2}), meet-in-the-middle (p^{1/2}), van Oorschot-Wiener
    (p^{1/2}/w^{1/2} with w stored transcript entries), Wesolowski Algorithm 3
    (p^{1/3+o(1)}). If any of the five fails to embed, the model is wrong and the record
    ends there.

    STEP 2 -- THE OBSERVATION COLLISION, WHICH IS BOTH THE LOSSY-PROJECTION ARGUMENT AND
    THE PROOF TECHNIQUE. The supersingular l-isogeny graph has girth Omega(log p)
    (RECALLED; it follows from the Ramanujan property and the absence of short cycles at
    a generic vertex, and it is a stage to check rather than an authority). Below the
    girth, the explored neighbourhood of ANY vertex is an (l+1)-regular tree, so as an
    abstract labelled object it is the SAME for every starting curve. Two supersingular
    curves E1 and E2 with delta(E1) = 1 (i.e. j in F_p) and delta(E2) ~ p^{1/3} therefore
    produce IDENTICAL transcripts under any sequence of fewer than girth-many Q1 queries
    that has not yet closed a cycle or hit a Frobenius coincidence. THE OBSERVABLE
    COLLIDES ACROSS THE ENTIRE RANGE OF THE QUANTITY THAT DETERMINES THE COST. That is
    exactly what an adversary argument needs, and it is why the same fact that makes the
    projection genuinely lossy is the engine of the bound.

    STEP 3 -- THE COUNTING THE BOUND RESTS ON, STATED SO IT CAN BE ATTACKED. Fix a curve E
    whose minimal isogeny phi: E -> E^{(p)} has degree delta and is B-smooth. The
    algorithm succeeds only by exhibiting, inside its transcript, a path from E to E^{(p)}.
    Any such path decomposes at some vertex M as phi = eta o psi. The admissible midpoints
    are indexed by the divisors d of delta with d <= X and delta/d <= X, and that count is
    tau(delta) restricted to a multiplicative window of width X^2/delta = B -- the
    divisor-window count k_div, which this campaign has already derived to be p^{o(1)}
    (IDEA-20260805-b4bc59; independently, catalogue entry C2-3 computes it as
    ~ tau(delta)/u with u = sqrt(log(p/2))). Meanwhile the number of vertices reachable at
    degree <= X is Psi(X,B) X^{1+o(1)} = X^{2+o(1)} = p^{1/3+o(1)} (Lemma 3.2 and section
    4.1, READ). CONDITIONED ON THE TRANSCRIPT BEING TREE-LIKE, the adversary is free to
    place the midpoint uniformly among those p^{1/3+o(1)} candidates, so an algorithm
    exploring a fraction alpha of the E-side ball and beta of the E^{(p)}-side ball
    succeeds with probability at most alpha*beta*k_div. Success with constant probability
    therefore needs alpha*beta >= p^{-o(1)}, hence max(alpha, beta) >= p^{-o(1)}, hence
    Q >= p^{1/3-o(1)}. THE STEP THAT IS NOT YET A PROOF is the conditioning: making
    "the adversary is free to place the midpoint uniformly" rigorous requires exhibiting a
    distribution over supersingular graphs, consistent with all answers given, under which
    the planted path's midpoint is uniform. THE RECORD DOES NOT CLAIM THIS STEP IS DONE.
    Identifying precisely why it is hard -- the graph is a fixed arithmetic object, not a
    random one -- is stated in method_ceiling as the argument's own ceiling.

    STEP 4 -- WHAT THE MODEL EXCLUDES, WHICH IS THE FORWARD GUIDANCE AND THE MOST USEFUL
    PART EVEN IF THE BOUND FAILS. Three named escapes, all real and all currently live:
      (E1) THE QUATERNION SIDE. Given End(E) as a maximal order, delta(E) and its minimal
      vector are computed by a rank-3 lattice reduction in polynomial time -- this is the
      frozen source's own section 4.2 experimental method (READ: "the lattice of isogenies
      Hom(E, E^{(p)}) ... is isometric to the unique two-sided ideal P of reduced norm p in
      O ... we sample random maximal orders ... and find the smallest vector in P"). No IGQ
      query sequence can produce that, and the model's whole content is that this is where
      the information is. IDEA-20260805-250e50's screen, IDEA-20260806-9c2f80's advice
      constructions, and any Deuring-side attack all live here.
      (E2) TORSION AND HIGHER DIMENSION. Kani-style embeddings evaluate isogenies on
      torsion points, which is not a Q1/Q2/Q3 operation. Out of RQ-SSI-001 scope as a
      positive target, but it must be named as outside the model rather than silently
      assumed away.
      (E3) NON-BLACK-BOX USE OF Phi_l. An algorithm that manipulates the modular polynomial
      symbolically -- resultants across l, elimination, a Groebner computation on the
      isogeny relations -- reads structure the query model hides. THIS IS THE ESCAPE THE
      RECORD FLAGS AS MOST UNDER-EXPLORED, because it needs no quaternion arithmetic and no
      torsion, and because this programme's ECDLP goals already own the machinery for it.

