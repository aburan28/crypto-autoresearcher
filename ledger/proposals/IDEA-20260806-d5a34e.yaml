        proof completes, the result is a closure-tier claim and requires independent
        review at the non-degradable tier under AGENTS.md rule 12 before any statement
        outside the ledger.
    - metric: >-
        escape_census: the number of committed corpus techniques that fall OUTSIDE IGQ,
        enumerated from knowledge/techniques and this goal's proposals
      direction: higher
      minimum_effect: >-
        At least three (E1 quaternion side, E2 torsion/higher dimension, E3 symbolic
        Phi_l). A census returning zero escapes would mean the model is the whole problem,
        which is certainly false and would indicate the census was not run.

  minimal_test:
    design: >-
      ZERO COMPUTE THROUGHOUT. Four stages, cheapest first, each able to terminate the line.
      STAGE 0 (~1 hour): write the model precisely and produce the five-algorithm embedding
      table with committed query counts. If any row fails, stop.
      STAGE 1 (~1 hour): run the two baseline-reproduction nulls (Frobenius-free; no
      planted path) and check both return 1/2.
      STAGE 2 (~1 hour): run the delta-oracle null and check it returns at most 1/5,
      cross-checked against IDEA-20260805-250e50's committed identity at (theta, s, gamma)
      = (1/5, 3/10, 0).
      STAGE 3 (open-ended, budget-capped): attempt the lower bound. Deliverable is either a
      proof or the named open obligation. THE STAGE IS EXPLICITLY BUDGET-CAPPED AND
      EXHAUSTING THE BUDGET IS REPORTED AS BUDGET EXHAUSTION, NEVER AS EVIDENCE THAT THE
      BOUND IS FALSE (AGENTS.md rule 5).
    controls:
      - delta-oracle null (primary, can fail, run BEFORE Stage 3)
      - Frobenius-free baseline reproduction (must return 1/2)
      - no-planted-path null (must return 1/2)
      - five-algorithm embedding gate (must return 0 failures)
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS: run the argument with the planted path's
        degree bound set to p^{theta} for theta in {1/6, 1/4, 1/3, 1/2} and check the bound
        returns theta each time. A bound that does not track the planted degree is not
        reading the planted structure.
    required_metrics:
      - the model definition and the five-row embedding table
      - bound_exponent for all four model variants plus the four graded theta points
      - the named open obligation, or the proof
      - the escape census with one line per technique

  falsification_conditions:
    - Any of the five known algorithms fails to embed. Model wrong; stop.
    - >-
      The delta-oracle null does not drop below 1/3. The argument is insensitive to the
      information it claims is decisive; nothing may be reported.
    - >-
      Either baseline null returns something other than 1/2. The argument does not
      reproduce the pre-2026 baseline and may not certify the post-2026 one.
    - >-
      The graded control does not track the planted degree across the four theta points.
    - >-
      An IGQ algorithm is exhibited making o(p^{1/3-o(1)}) queries. Then the conjecture is
      false, and since IGQ contains the incumbent, such an algorithm would be a genuine
      sub-p^{1/3} classical algorithm requiring immediate independent review at the
      non-degradable tier (AGENTS.md rule 12). This is the record's most consequential
      possible outcome and it is a real possibility, not a rhetorical one.

  confounders:
    - >-
      THE ADVERSARY MAY NOT CHOOSE THE GRAPH. The supersingular graph is a fixed arithmetic
      object for each p, not a random regular graph. A lower bound proved against a random
      graph is a bound in a DIFFERENT model and must be labelled as such. This is the
      single largest confounder and the most likely reason Stage 3 stalls; it is stated
      here rather than discovered later.
    - >-
      MEMORY IS NOT QUERIES. IGQ counts queries; van Oorschot-Wiener's whole content is a
      time-memory tradeoff. The embedding must carry a transcript-size axis alongside the
      query count or the model cannot express row (3) of the committed frontier, and a
      query lower bound with no memory axis says nothing about the p^{1/2}/w^{1/2} branch.
    - >-
      THE o(1). Both the upper and lower bounds carry p^{o(1)} factors of different origin
      (smoothness on one side, divisor-window multiplicity on the other). The record's
      claim is at exponent precision only and may never be read as a concrete-cost
      statement.
    - >-
      GIRTH IS A GENERIC STATEMENT. Special vertices (j = 0, 1728, and the F_p-rational
      locus) have short cycles. The argument must exclude them explicitly or restrict to a
      1 - O(p^{-1/2}) fraction of curves, and the excluded set is exactly the
      Delfs-Galbraith target set, which is not a coincidence and must be reported.

  interpretation_limits:
    - >-
      NO ALGORITHM IS PROPOSED, NO ATTACK IS CLAIMED, AND NO SECURITY STATEMENT ABOUT ANY
      SCHEME FOLLOWS FROM ANYTHING HERE. Per RQ-SSIQ-9702af, 0.25 is a target and not a
      claim, and this record does not bear on whether it is reachable.
    - >-
      A LOWER BOUND IN A RESTRICTED MODEL IS NOT A LOWER BOUND. The model excludes the
      quaternion side, where the frozen source's own experiments live and where every
      promising candidate in this goal would have to be built. The record must never be
      cited as showing that a sub-p^{1/3} algorithm does not exist, and the escape census
      exists so that the exclusion is quantified rather than implied.
    - >-
      Theorem 1.5 is an EXISTENCE bound proved for all E. Nothing in this record bears on
      its correctness, and the no-planted-path null exists precisely to show which half of
      the bound comes from that theorem.
    - >-
      If Stage 3 exhausts its budget, the honest deliverable is Stages 0-2 plus the named
      open obligation. Budget exhaustion is an infrastructure outcome and is never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H-IGQ-1
      statement: >-
        FOR ALL sufficiently large p and FOR ALL but an O(p^{-1/2}) fraction of
        supersingular E/F_{p^2}, the l-isogeny graph has no cycle through j(E) of length
        below c*log_l(p) for an absolute constant c > 0.
      rigorous_support: >-
        RECALLED. The intended support is the Ramanujan property of the supersingular
        graph (Pizer via Eichler) plus the standard fact that a cycle at E of length k
        yields an endomorphism of degree l^k, and endomorphisms of small degree exist only
        on the O(sqrt(p)) curves with small discriminant CM. THE SECOND HALF IS ACTUALLY
        THE STRONGER AND MORE ELEMENTARY ROUTE and it is the one the validation plan uses:
        a short cycle IS a small endomorphism, and small endomorphisms are counted by the
        same rank-3 lattice count this campaign has already derived
        (IDEA-20260805-2d2c41: ~c T^{3/2} p^{-1/2} vectors of degree <= T).
      validation_plan: >-
        ZERO-COMPUTE ARM: from the committed lattice count, the number of curves with an
        endomorphism of degree <= l^k is ~ l^{3k/2} p^{-1/2} * (p/12), so a positive
        fraction only once l^k ~ p^{1/3} -- giving girth ~ (1/3) log_l p directly. This is
        an internal consistency derivation from a committed record and it can disagree with
        the recalled Ramanujan route, which would itself be worth reporting.
        TOY ARM, LABELLED TOY: measure the girth distribution on the 2-isogeny graph at
        p in {103, 251, 503, 1019} using the construction already demonstrated in this
        campaign, and compare to (1/3) log_2 p.
      falsification_condition: >-
        Measured girth below half the predicted value at every tested p, or the two
        derivations disagreeing by more than a constant factor.
    - id: H-IGQ-2
      statement: >-
        FOR ALL sufficiently large p and FOR a uniformly random supersingular E whose
        minimal degree delta is B-smooth, the number of admissible split midpoints -- the
        divisors d of delta with d <= X and delta/d <= X for X = B^{1/2}(p/2)^{1/6} -- is
        p^{o(1)}.
      rigorous_support: >-
        tau(delta) <= 2^{Omega(delta)} and Omega(delta) = O(log delta / log 2), with the
        operative value ~u = sqrt(log(p/2)) at the incumbent's parameters, so
        log(count) = O(sqrt(log p)) which is superpolynomially small in p. This is the same
        bookkeeping IDEA-20260805-2d2c41 uses to bound Remark 1's multiplicity to
        O(B^{3/2}) = p^{o(1)}, reached from a second direction. The classical statement it
        imitates is the normal order of the divisor function on smooth integers.
      validation_plan: >-
        EXACT ENUMERATION, ZERO ISOGENY MACHINERY: enumerate B-smooth integers delta in a
        declared range, count divisors in the window [delta/X, X], and fit the exponent
        against 0. This is pure integer arithmetic in Python and reuses the same
        enumeration the pre-ledger entries C2-3 and C1-1 specify, giving a cross-check
        against a second derivation of the same quantity.
      falsification_condition: >-
        Fitted exponent bounded away from 0, i.e. the midpoint count carrying an exponent.
        That would strengthen the upper-bound side and weaken the lower-bound side
        simultaneously, and must be reported in both directions.
    - id: H-IGQ-3
      statement: >-
        THE OPEN OBLIGATION, STATED AS AN ASSUMPTION RATHER THAN SMUGGLED IN AS A STEP.
        Conditioned on any sub-girth transcript, there is a distribution over supersingular
        graphs consistent with that transcript under which the split midpoint of the
        planted minimal isogeny is uniform over the p^{1/3+o(1)} reachable vertices.
      rigorous_support: >-
        NONE. This is the conjecture the whole lower bound rests on and the record refuses
        to present it as supported. The classical statement it imitates is the standard
        adversary argument for claw finding over a random function. THE REASON IT IS HARD
        IS NAMED: the supersingular graph is a fixed arithmetic object, so "a distribution
        over graphs consistent with the transcript" may be a distribution over a set that
        is too rigid to be uniform.
      validation_plan: >-
        There is no experiment that validates a conditioning argument. The route is
        mathematical and its deliverable is either the proof or the named failure point.
        A partial substitute is available and is required at Stage 2: the delta-oracle null
        tests whether the ARGUMENT AS WRITTEN is sensitive to the information the
        conditioning is supposed to be hiding, which is the strongest empirical check
        available on a conditioning step.
      falsification_condition: >-
        An explicit sub-girth transcript together with two consistent graph completions
        whose midpoint distributions are provably far from uniform, in a way an algorithm
        can exploit.

  target_complexity:
    time_exponent: >-
      NO ALGORITHM IS PROPOSED, SO NO TIME EXPONENT IS OFFERED. The record's own target is
      a LOWER bound of p^{1/3-o(1)} queries matching the incumbent's p^{1/3+o(1)} upper
      bound in one stated model. Its positive-for-the-attacker branch -- an IGQ algorithm
      below p^{1/3} -- would be a genuine exponent movement and the record treats that
      outcome as requiring rule-12 review rather than celebration.
    memory_exponent: >-
      The model's memory analogue is TRANSCRIPT SIZE. Wesolowski Algorithm 3 embeds at
      p^{1/3+o(1)} stored entries; van Oorschot-Wiener at w entries with
      p^{1/2+o(1)}/w^{1/2} queries (frozen source line 39, READ). A query bound alone does
      NOT bound the time-memory frontier and the record says so; extending it to a
      query-memory bound is named as a separate obligation, not assumed.
    best_known: >-
      Upper: p^{1/3+o(1)} time and memory, conditional on Heuristic 1 (Theorem 1.1, READ).
      Lower: NONE. This corpus records no lower bound of any kind for this problem in any
      model, which is precisely the gap the record targets.
    hidden_overhead: >-
      The upper bound's o(1) is superpolynomial by its author's own disclosure (section
      1.1, READ). The proposed lower bound's o(1) comes from H-IGQ-2 and is also
      superpolynomially small; the two are of the same shape (exp(O(sqrt(log p)))) but are
      NOT the same quantity, and a matching upper and lower exponent does not mean matching
      cofactors. The record forbids reading a "tight" conclusion at concrete parameters.
    tradeoff_note: >-
      The bound as stated is memory-free and therefore does not touch the van
      Oorschot-Wiener branch. Extending IGQ with a transcript-size budget w and proving
      Q >= p^{1/2-o(1)}/w^{1/2} would be the model-relative form of "vOW is optimal", and
      that is the single most valuable follow-on this record identifies. It is named, not
      attempted.

  dominated_by: >-
    n/a (no attack proposed, no algorithm exhibited). ROWS CHECKED ACROSS TIME, MEMORY AND
    DATA/QUERIES before writing n/a, per docs/inventor-protocol.md section 5:
    (1) Wesolowski 2026: time and memory p^{1/3+o(1)}, queries 0 (no oracle).
    (2) Delfs-Galbraith: p^{1/2}(log p)^{O(1)}, polynomial memory.
    (3) van Oorschot-Wiener: p^{1/2+o(1)}/w^{1/2} time, memory w.
    (4) Meet-in-the-middle: p^{1/2} time, p^{1/2} memory.
    (5) Kohel 1996: p*(log p)^{O(1)} time, polynomial memory.
    The problem consumes no oracle, so the data/queries axis is 0 on every row and the
    frontier is two-dimensional. This record adds no row and reduces no cost; it proposes a
    statement ABOUT the frontier.
  sota_delta: >-
    ZERO on every attack axis. QUANTITATIVELY, the deliverable is the replacement of twelve
    separately-argued mechanism closures by ONE conditional statement over a class of
    algorithms containing all five committed frontier rows, together with a census of at
    least three named techniques the statement does not cover. If the bound is proved, the
    campaign's tightness claim moves from "unverified" under
    docs/inventor-protocol.md section 4 to "closed in IGQ, open outside it" -- a change in
    epistemic status, not in cost. If it is not proved, the deliverable is the named open
    obligation, which is strictly more than the current state.

