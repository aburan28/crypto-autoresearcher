idea:
  id: IDEA-20260811-dc6ece
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  title: >-
    THE p-ADIC HALF OF THE LIFTING LANE CLOSES BY IDENTITY, AND THE NAIVE LIFT
    CLOSES BY HAVING NO PROPAGATION RULE: every isogeny of degree prime to p is
    an isomorphism on E[p^infinity], so the unit root of x^2 - t x + p, the
    formal group's height and every Serre-Tate deformation invariant of the
    CANONICAL lift are EXACTLY constant on an isogeny class -- while the NAIVE
    integral lift, the one an implementer actually writes, has no functorial
    relation to any other class member and its p-adic digits are predicted to be
    indistinguishable from uniform noise, with the two-arm design measuring both
    at once
  class: control

  claim: >-
    (A) THE CANONICAL ARM, CLOSED BY IDENTITY AND NOT BY MEASUREMENT. For an
    ordinary E/F_p the Frobenius characteristic polynomial x^2 - t x + p factors
    over Z_p as (x - u)(x - p/u) with u a p-adic unit congruent to t mod p, since
    p does not divide t. By T4 the trace is fixed across the class, so u is
    IDENTICAL for all 138 members of the committed class -- and with it the
    formal group's height (1 for every ordinary curve), the Newton polygon, the
    p-divisible group's isogeny class, and every invariant computed from them.
    Structurally the reason is stronger than the trace argument: an isogeny of
    degree prime to p induces an ISOMORPHISM of p-divisible groups
    E[p^infinity] -> E'[p^infinity], so the Serre-Tate deformation spaces of any
    two class members are canonically identified and the canonical lift is
    carried to the canonical lift. There is nothing to measure and nothing to
    search: the p-adic axis of L9 is closed for the canonical lift, with the
    obstruction named.
    (B) THE NAIVE ARM, CLOSED FOR THE OPPOSITE REASON. The lift an implementer
    actually writes is the integral model (a, b) with 0 <= a, b < p viewed over
    Z_p, or the Hensel lift of j(E) as a root of some polynomial. That lift is
    NOT functorial: the naive lift of E' is not the image of the naive lift of E
    under the lifted isogeny, so the object has no one-step propagation rule and
    fails the second clause of the lossy-projection test. Its p-adic digits
    beyond the first are therefore predicted to be structureless across the
    class. The prediction is sharp and testable: the second p-adic digit of the
    Hensel-lifted CM j-invariant, taken over the 138 members, is uniform on F_p
    and independent of the volcano level, matching a uniform null.
    (C) WHY THE PAIR IS WORTH RUNNING TOGETHER RATHER THAN ASSERTING (A). (A) is
    a theorem and (B) is a prediction, and running them as two arms of one
    measurement makes the instrument self-calibrating: the canonical arm must
    show EXACT constancy (a quantity known in advance), and the naive arm must
    show exact noise. An instrument that reports variation in the canonical arm
    is broken; one that reports structure in the naive arm has found something,
    and the campaign would have to explain how a non-functorial construction
    acquired class structure. That two-sided design is what
    docs/inventor-protocol.md section 3 asks for and what the lane, with no
    executed experiment across four batches, has never had.
    (D) THE SEPARATION THIS FIXES. IDEA-20260807-ee6ef7 prices the GLOBAL lift at
    |D|^{1+o(1)} and IDEA-20260811-dcbea4 refines that to |D_0|^{1+o(1)} at the
    crater. Neither is a statement about the p-ADIC lift, which is cheap at every
    level -- a Hensel iteration to precision p^m costs O(m log p) multiplications
    once a defining polynomial is known. The campaign should carry both rows and
    not one: cheap p-adic representation with no class information, and expensive
    global representation with the arithmetic that lift attacks actually need.

  mechanism: >-
    Isogenies of degree prime to p are invisible to the p-divisible group, and
    the p-divisible group is the entire input to Serre-Tate deformation theory.
    So everything the canonical lift knows about the curve, p-adically, is a
    function of data that the isogeny class shares. Conversely, the naive lift is
    a choice of representative with no functorial content, so its higher digits
    are an artifact of the representative and carry no arithmetic at all. Both
    halves of the lane's p-adic question are answered by the same observation
    read in two directions.

  tracked_object: >-
    Two objects run side by side: (i) the p-adic unit root u together with the
    formal group height, tracked along isogenies; (ii) the digit expansion of the
    naive lift's j-invariant beyond the first digit, tracked along the same
    isogenies. The experiment is a comparison of their propagation behaviour.

  resource: >-
    R6 (lifts to Z_p) and R3. No point of G is touched; H-ENDO-001 satisfied.
    Note that the one historical case where a p-adic lift breaks the ECDLP is the
    anomalous case N = p (Smart; Satoh-Araki; Semaev), which is excluded here by
    N prime and different from p, and which IDEA-20260807-dbb250 has already
    analysed as the failure of the hypothesis N != p.

  lossy_projection_test: >-
    THE RECORD IS THE TEST, APPLIED TO TWO OBJECTS WITH OPPOSITE OUTCOMES. Object
    (i) is genuinely lossy -- u is one p-adic unit and forgets the curve entirely,
    138 members share it -- and propagates deterministically, indeed trivially,
    under every prime-to-p isogeny. It passes both clauses and is therefore a
    legitimate tracked object whose verdict is CONSTANT, i.e. a closure. Object
    (ii) is lossy but does NOT propagate: there is no rule taking the naive lift
    of E to the naive lift of E', so the retained part is not determined by the
    retained part of the source. It fails the second clause, which is exactly why
    the record predicts noise rather than structure, and the prediction is a
    consequence of the algebra rather than a guess.

  t5_reachability: >-
    Vacuous on the canonical arm, and the record says so: a constant functional
    has no minimiser to reach. On the naive arm, if structure were found, the T5
    question would immediately arise and would be answerable by the local-label
    budget of IDEA-20260811-9bb909 -- a digit of the naive lift IS locally
    computable, so it would be a legitimate T5 option-(ii) test, and its
    information content would be measured there rather than assumed.

  null_object: >-
    Built in and mandatory in both directions. For the naive arm the null is a
    uniform draw of 138 elements of F_p, against which the observed digit
    distribution is compared, plus a level-permutation null for the
    digit-versus-level association. For the canonical arm the "null" runs the
    other way: the unit root is computed independently for 138 curves from OTHER
    traces, where it MUST vary, so that the observed constancy on the class is
    demonstrably a class effect and not a computation returning the same number
    for everything -- which is the single most likely way this measurement lies.

  why_not_a_renamed_known_approach: >-
    The lane's committed records treat the canonical lift as a source of GLOBAL
    points (IDEA-20260807-cfe576), of heights (-6533fd, -761a8c), of p-adic
    heights (-dbb250) and of class-field structure (IDEA-20260808-5158fa).
    Nobody has stated the p-divisible-group invariance, which closes the p-adic
    axis for the whole lane in one line, or paired it with the naive lift as a
    controlled null. The mathematics is classical Serre-Tate and Deuring theory
    and no novelty is claimed for it; the pairing and the closure statement are
    the contribution.

  novelty_status: adaptation
  novelty_screen: >-
    Screened this session against the full RQ-CANL lane (IDEA-20260807-cfe576,
    -ee6ef7, -44ba75, -6533fd, -11b93d, -dbb250, -fd5a24, -761a8c, -13c821,
    IDEA-20260808-5158fa) and against the anomalous-curve treatment in -dbb250.
    WEB SEARCH UNAVAILABLE this session; Serre-Tate local moduli, the Deuring
    lifting theorem and the ordinary Newton polygon are classical.

  discriminated_from: >-
    NOT IDEA-20260807-dbb250, whose two-line target-module gate kills every
    p-adic HEIGHT as a carrier of scalar information because a quadratic form on
    a prime-order group into a torsion-free Z_p-module vanishes; this record is
    about p-adic invariants of the CURVE rather than of points, and the two
    together close the p-adic axis from both sides. NOT IDEA-20260807-cfe576,
    which closes point lifting. NOT IDEA-20260811-dcbea4, which is about the
    GLOBAL representation size and explicitly delegates the p-adic row here.

  assumptions:
  - >-
    E ordinary over F_p, so p does not divide t, the Newton polygon has slopes
    0 and 1, and the unit root u exists in Z_p^* with u = t mod p
    [recall-confident, classical].
  - >-
    An isogeny of degree prime to p induces an isomorphism on p-divisible groups
    [recall-confident: the kernel has order prime to p and therefore meets
    E[p^infinity] trivially; NOT re-verified this session].
  - >-
    Serre-Tate deformation theory identifies lifts of E with elements of a formal
    torus determined by E[p^infinity], and the canonical lift is the identity
    point [recall-confident: Serre-Tate; Katz, Serre-Tate local moduli. NOT
    verified this session].
  - >-
    N != p, so the anomalous attack is out of scope, as this campaign's records
    already establish.

  proof_search_map:
    bottleneck: >-
      Whether any p-adic invariant of the lift distinguishes class members. Its
      answer decides whether the lane's p-adic axis needs an experiment at all.
    baseline_embedding:
      parameter_slice: >-
        The anomalous case N = p is the boundary where the desired conclusion
        FAILS spectacularly -- the p-adic elliptic logarithm solves the ECDLP in
        polynomial time. Including it as a slice is what makes the closure a
        family statement rather than an assertion, and it must be exhibited, not
        merely mentioned.
      reproduction_check: >-
        On an anomalous curve of toy size, the same p-adic machinery must
        reproduce the known polynomial-time solve. A pipeline that cannot solve
        an anomalous instance has no standing to report that p-adic data is
        uninformative in the non-anomalous case.
    observation_collision:
      observable: >-
        The tuple (unit root, formal group height, Newton polygon).
      distinct_preimage_search: >-
        Total collision by construction: all 138 members share it. The
        informative search is for a p-adic invariant that does NOT collide, and
        the naive lift's digits are the candidate, tested directly.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the p-adic invariant map over its single value, with the
        j-invariant as the forgotten structure; the question is whether any
        p-adically defined quantity recovers any of it.
      predicted_gain: >-
        None. The predicted outcome is a closure, and the record is filed as a
        control precisely because its expected value is a well-characterised
        negative.
    quantifier_order: >-
      For all class members and all isogenies of degree prime to p, the p-adic
      invariants agree -- universal, with no instance-dependent witness. For the
      naive lift the statement is existential and negative: there is no rule
      phi -> (naive lift of the target as a function of the naive lift of the
      source), and the absence of a witness is what the noise prediction encodes.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the p-adic invariants of the canonical lift are class-constant, and
        that one specific naive-lift statistic is noise on one class at one p.
        It cannot certify that NO p-adic construction distinguishes class members
        -- only that the natural ones do not -- and the honest forward guidance
        names what remains: constructions using ramified extensions, higher
        Serre-Tate coordinates of non-canonical lifts, and p-adic modular forms
        evaluated at the lifted point.
      nearby_object_control: >-
        The anomalous curve, where p-adic data is decisive. A method that treats
        the anomalous and non-anomalous cases identically has not identified the
        load-bearing structure, which here is the coincidence N = p.
    proof_obligations:
    - claim: The unit root is class-constant.
      responsibility: correctness
    - claim: Prime-to-p isogenies are isomorphisms on p-divisible groups.
      responsibility: correctness
    - claim: The naive lift has no functorial propagation rule.
      responsibility: scope
    - claim: The naive lift's higher digits are uniform across the class.
      responsibility: success_probability
    not_applicable_reason: null

  predictions:
  - metric: number_of_distinct_unit_roots_across_the_138_member_class
    direction: different
    minimum_effect: >-
      EXACTLY ONE, to any precision computed. Two distinct values is an
      implementation error, since the unit root is a function of t and p alone.
  - metric: number_of_distinct_unit_roots_across_138_curves_from_other_traces
    direction: higher
    minimum_effect: >-
      Essentially 138 distinct values, confirming the computation is not
      constant-by-construction. Fewer than 100 distinct values means the
      instrument is degenerate and the class result is void.
  - metric: distribution_of_the_second_p_adic_digit_of_the_hensel_lifted_j
    direction: different
    minimum_effect: >-
      Uniform on F_4001 within a chi-squared test at 138 samples, and independent
      of the volcano level under a level-permutation null. Detected structure --
      in particular any association with the level -- falsifies (B) and is a lead
      of real interest, since it would mean a non-functorial construction carries
      class information.
  - metric: anomalous_curve_control_solve
    direction: different
    minimum_effect: >-
      A successful polynomial-time solve on a toy anomalous instance, with a
      re-verified solution certificate per docs/claims-and-verification.md.
      Failure voids the pipeline's standing to report p-adic negatives.

  minimal_test:
    design: >-
      Hours, no heavy compute. On the committed 138-member class: (i) compute the
      unit root of x^2 - 30 x + 4001 in Z_p to precision p^{10} and verify it is
      the same object for every member by computing it per curve from that
      curve's own point count rather than from the shared trace -- the per-curve
      route is what makes the constancy a measurement rather than a tautology;
      (ii) Hensel-lift each member's j-invariant as a root of its level's Hilbert
      class polynomial (shared with IDEA-20260811-5e4cd5) to precision p^{5} and
      tabulate the second and third digits against the level; (iii) run the
      anomalous-curve control; (iv) run the other-traces control for the unit
      root.
    controls:
    - >-
      OTHER-TRACES CONTROL for the unit root, which must vary.
    - >-
      UNIFORM NULL and LEVEL-PERMUTATION NULL for the digit distribution.
    - >-
      ANOMALOUS-CURVE POSITIVE CONTROL, which the p-adic machinery must solve.
    - >-
      PRECISION SWEEP: all digit statistics recomputed at precisions p^3, p^5 and
      p^7, since a structure that appears at one precision and vanishes at
      another is a Hensel-iteration artifact and not arithmetic. This is the
      decay test the inventor protocol asks for, with precision as the parameter
      that should destroy a spurious signal.
    required_metrics:
    - per_curve_unit_root_to_stated_precision
    - distinct_unit_root_count_on_class_and_on_control
    - per_curve_second_and_third_p_adic_digits
    - digit_uniformity_chi_squared_and_level_association_p_value
    - precision_sweep_stability_of_every_digit_statistic
    - anomalous_control_solve_certificate

  falsification_conditions:
  - >-
    More than one unit root on the class. Implementation error; no mathematical
    conclusion follows.
  - >-
    The other-traces control shows a constant unit root. The computation is
    degenerate and the closure claim is unsupported by measurement, even though
    it remains true by algebra -- and the record must say which of the two it is
    relying on.
  - >-
    The naive lift's digits associate with the volcano level and survive the
    precision sweep. (B) is false, a non-functorial construction carries class
    information, and this is the outcome worth routing to independent review.
  - >-
    The anomalous control does not solve. The pipeline cannot detect the one case
    where p-adic data is decisive, and every p-adic negative it produces is void.

  confounders:
  - >-
    COMPUTING THE UNIT ROOT FROM t RATHER THAN FROM THE CURVE makes the
    constancy a tautology. The design computes it per curve from that curve's own
    point count for exactly this reason, and an implementation that shortcuts to
    the shared trace has measured nothing.
  - >-
    Hensel lifting a root of a class polynomial embeds the level into the
    construction, so the digit-versus-level test is partially circular: the
    polynomial differs by level. The record's honest form of the test is
    therefore WITHIN-LEVEL digit uniformity plus a between-level comparison that
    is reported separately and interpreted with the circularity stated. A cleaner
    variant, run as a second arm, lifts j as a root of the modular polynomial
    relation instead, which does not know the level.
  - >-
    Precision-dependent artifacts are the canonical failure mode of p-adic
    measurement and are why the precision sweep is blocking rather than
    advisory.

  interpretation_limits:
  - >-
    TOY SCALE, claim_tier toy, one class at one p, plus controls. NO ATTACK, NO
    EXPONENT, NO SPEEDUP; sota_delta zero.
  - >-
    The canonical arm's result is an ALGEBRAIC IDENTITY that the measurement
    confirms rather than establishes; the record must never be cited as
    empirical evidence for a theorem, only as a check that the pipeline computes
    the theorem's quantity correctly.
  - >-
    The closure is for the NATURAL p-adic invariants, and the forward guidance
    names what remains open: ramified constructions, non-canonical Serre-Tate
    coordinates, and p-adic modular forms at the lifted point. Declaring the
    p-adic direction impossible is not what this record does.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding; P2 respected. The
    anomalous case N = p is out of scope and is used only as a positive control.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      The higher p-adic digits of a naive or class-polynomial Hensel lift are
      equidistributed in F_p across the members of an isogeny class, independently
      of the volcano level, because the lift is a choice of representative with
      no functorial relation to the class structure.
    rigorous_support: >-
      Rigorous ingredient: the Hensel lift of a simple root is unique and
      determined by the defining polynomial and the residue, so the higher digits
      are determined by data (the polynomial's coefficients) that varies across
      levels but not within them in any controlled way. The classical
      distribution imitated is the equidistribution of digits of algebraic
      numbers in a p-adic expansion, treated as a random-integer heuristic; NO
      theorem is claimed and the record's prediction is therefore falsifiable in
      the interesting direction.
    validation_plan: >-
      Directly, on all 138 members at three precisions, against a uniform null by
      chi-squared and against a level-permutation null for association. Tail
      check: the count of members whose second digit lies in the smallest
      decile, predicted binomial(138, 0.1). Sampled parameters recorded: p = 4001,
      t = 30, precisions p^3, p^5, p^7. NO TRANSFER to other p is claimed; a
      second class at a different p is the stated replication arm and is not run
      in the minimal test.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. Instrument cost: O(m log p)
      multiplications per Hensel lift to precision p^m, i.e. polylog -- which is
      itself the record's point (D), since the p-adic representation is cheap at
      every volcano level while the global one is not.
    memory_exponent: >-
      O(m log p) bits per curve. Negligible.
    best_known: >-
      For the ECDLP, 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006).
      For the anomalous subcase only, the p-adic elliptic logarithm solves in
      polynomial time -- cited as the boundary case and explicitly out of scope.
    hidden_overhead: >-
      None in the p-adic computation. The hidden cost in the lane as a whole
      lives in the GLOBAL object and is priced by IDEA-20260811-dcbea4; conflating
      the two rows is the error this record exists partly to prevent.
    tradeoff_note: >-
      Cheap p-adic representation with no class information versus expensive
      global representation with the arithmetic lift attacks need. The campaign
      should carry both rows; there is no interpolation between them.

  dominated_by: >-
    As an attack: dominated by every frontier row, since none is proposed --
    parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). Within the lane, the p-adic-height direction is already
    dominated by IDEA-20260807-dbb250's target-module gate, and this record
    covers the complementary curve-side invariants rather than competing with it.
  sota_delta: >-
    Zero on every attack axis. Against the lane's state: closes the p-adic axis
    for the canonical lift with a named obstruction and supplies the lane's first
    two-directional control, in a lane with no executed experiment across four
    batches.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.99 that the unit root is constant on the class (it is a theorem; the
    measurement checks the pipeline). 0.85 that the naive lift's digits are noise.
    0.05 that a level association survives the precision sweep, which would be
    the interesting branch. 0.00 that anything here produces an attack. FILED AS
    A PROBABLE DEAD END THAT IS CHEAP ENOUGH TO KILL, and additionally as the
    cheapest way to give RQ-CANL-63098f an executed experiment with real
    controls.

  source_refs:
  - ledger/proposals/IDEA-20260807-dbb250.yaml (target-module gate for p-adic
    heights; the complementary closure)
  - ledger/proposals/IDEA-20260807-cfe576.yaml (point lifting closure)
  - ledger/proposals/IDEA-20260811-dcbea4.yaml (the global representation row)
  - ledger/proposals/IDEA-20260811-5e4cd5.yaml (supplies the class polynomials
    this record Hensel-lifts)
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md (T4, which fixes
    the trace and hence the unit root)
  - '"[recall-confident] Serre-Tate canonical lifts and Katz, Serre-Tate local
    moduli; Deuring lifting; Smart / Satoh-Araki / Semaev for the anomalous case.
    NOT verified this session; web search unavailable."'
