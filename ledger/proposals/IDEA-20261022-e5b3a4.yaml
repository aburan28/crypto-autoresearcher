idea:
  id: IDEA-20261022-e5b3a4
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  status: proposed
  title: Model-priced pairing-transfer reference rows beside matched rho in the 5a band (the one route by which SNFS reaches E(F_p))
  class: measurement
  supersedes: null
  lineage:
    extends: IDEA-20261009-2abd32
    adds: >-
      B4 has no priced row and no matched rho. Adds (i) rows for named BN/BLS/KSS sizes from published cost models,
      (ii) the 5a band against matched rho, (iii) a refusal rule for undefined rows, (iv) k* from primary tables.
      B4 limb (b) (Murphy-E vs CADO) is not carried and stays with B4; limbs (a),(c) were run by EXP-ECDLP-6dacdb.
    also_extends: "EXP-ECDLP-6dacdb deployed-table.md (k* from recalled constants, o(1) dropped, a 10^3 fudge)"
    related_not_superseded: [IDEA-20260815-0676d4, IDEA-20260815-bf1328, IDEA-20260818-d44bba, IDEA-20261009-64a1c0]
  claim: >-
    [proposed, conditional on H1-H3] A table of model-priced rows for MOV/Frey-Rueck transfer of E(F_p)[r] into
    F_{p^k}^* followed by (S)exTNFS, for p = p(u) of BN, BLS, KSS at standard sizes, can sit beside matched rho at
    the same r under AGENTS.md 5a (0, 0.1, 1 GAE per unpriced native operation), ranking two arms only where the
    order holds at every weight. [derived, unverified] BN-254: transfer < rho across the band. BLS12-381: within a
    few bits of rho, unresolved. P-256, secp256k1: no row (ord_r(p) about 2^254). Accounting table, not an
    improvement of the index-calculus baseline, not a security statement; rows are model-based, never measured.
  mechanism: >-
    [derived] Transfer cost = min(NFS-variant cost in F_{p^k}, rho in mu_r); NFS term 2^kappa L_Q[1/3,c]
    (Barbulescu-Duquesne). Matched rho = sqrt(pi r/4)/sqrt(|Aut|) group additions (|Aut| = 6, j=0) plus native
    counters. The NFS arm has no group additions, so S_T(w) = w*C_model and S_rho(w) = steps*(1 + w*c_native);
    S_T/S_rho increases in w, so the order is robust iff it holds at w = 1. Undefined rows (k > k_cap) are refused.
  novelty_status: unverified
  citations:
    - {ref: KN-LIT-30605a, provenance: kb, claim: "BN u=-2^62-2^55-1 at 99.69 bits; Table 8 field sizes", verified_by: "KN-LIT-30605a (JoC HTML, no PDF)"}
    - {ref: KN-LIT-3743, provenance: kb, claim: "exTNFS L(1/3,(48/9)^{1/3})", verified_by: "KN-LIT-3743 (read)"}
    - {ref: KN-LIT-2223, provenance: kb, claim: "Guillevic PKC 2020; title only, nothing relied on", verified_by: "title only"}
    - {ref: KN-LIT-24b9c7, provenance: kb, claim: "114-bit BN rho, order-6 automorphism", verified_by: "summary"}
    - {ref: "research/elliptic_snfs_survey_20261016 sec 4A, 7, T2", provenance: internal, claim: "shape A; figures unchecked; T2 unbuilt", verified_by: "read"}
    - {ref: "BLS12-381 ~126 bits, BN 100-110 (secondary)", provenance: recalled, claim: "to be checked, not relied on", verified_by: null}
  assumptions:
    - "Public parameters only; no key, no deployed-system test. Rust only; no TNFS code exists in this repo."
  proof_search_map:
    not_applicable_reason: "Reference table of published models; no algorithm or theorem proposed."
  predictions:
    - {metric: model_bits_BN_u_62_55_1, direction: different, minimum_effect: "|model - 99.69| <= 1 bit else table untrusted"}
    - {metric: model_bits_BLS12_381, direction: different, minimum_effect: "in [120,130]; outside contradicts the secondary 126"}
    - {metric: S_T/S_rho_at_w1_BN254, direction: lower, minimum_effect: "< 1"}
    - {metric: S_T/S_rho_at_w1_BLS12_381, direction: different, minimum_effect: "within 2^+-4 of 1 (unresolved expected)"}
    - {metric: k_star_256bit_r_primary_minus_6dacdb, direction: different, minimum_effect: "|delta| >= 1 on the SexTNFS column; sign reported"}
  minimal_test:
    design: >-
      1. Re-extract kappa, c, unit of an operation per variant from the primary tables. 2. Rust evaluator for BN-254,
      BN-462, BLS12-381, BLS12-446, KSS16, KSS18, BLS24 at published sizes. 3. Matched rho from ecbench rho-neg
      counters (lower bound where a counter is not emitted). 4. S(w), w in {0,0.1,1}, pair verdicts in band-pkm.md
      format. 5. k* sweep, 256-bit r, k = 2..64.
    controls:
      - "positive: BN row reproduces 99.69 bits and the BD19 Table 8 sizes"
      - "negative: P-256, secp256k1 refused as undefined ((n-1)/3: RESEARCH_NIST_CYCLOTOMIC_POINT_HEIGHTS 2.1 for P-256; RESEARCH_SECP256K1_CM line ~509 for secp256k1)"
      - "planted: synthetic k=12 must land on the BN row"
      - "kappa re-fit on a second record; spread = model band"
    required_metrics: [model_bits_per_row, S_w0, S_w01, S_w1, pair_verdict, k_star_per_w, kappa_spread_bits]
  falsification_conditions:
    - "Positive control misses 99.69 by more than 1 bit: constants wrong, no row trusted."
    - "An undefined row gets a finite price: refusal rule broken."
    - "BLS12-381 model bits outside [120,130]: secondary figure contradicted."
    - "BN-254 order flips inside the band: operation-unit mismatch; restate."
  confounders:
    - "kappa folds in polynomial selection; memory uncharged (IDEA-20260815-bf1328 charges it)."
    - "A model operation is not a GAE (H3)."
  interpretation_limits:
    - "Not a statement about any deployed curve's security or any key. Transfer needs small k (KR-RHO-53c89f)."
    - "Cannot move the baseline; becomes measured only via a TNFS implementation (separate study)."
  heuristic_assumptions:
    - id: H1
      statement: "cost = 2^kappa L_Q[1/3,c], kappa fixed on records, extrapolates from log2 Q 768-1024 to 3000-6000 for p = p(u)."
      rigorous_support: "none; imitates Canfield-Erdos-Pomerance smoothness (Dickman rho) as NFS analysis does"
      validation_plan: "re-fit kappa on two records (768-bit prime field; 1024-bit SNFS, KN-LIT-7635); report spread; reproduce Table 8 sizes within 2 percent. Transfer: calibration range to target range."
    - id: H2
      statement: "matched rho = sqrt(pi r/4)/sqrt(|Aut|) additions plus ecbench native counters."
      rigorous_support: "KR-RHO-13bf67, KR-RHO-93979e, KR-RHO-0528e7"
      validation_plan: "ecbench rho-neg S(w) at 19-26 bits (band-pkm.md); fit constant; min/max over 32 solves per curve."
    - id: H3
      statement: "one model operation costs at most 1 GAE, so w = 1 is conservative against the transfer arm."
      rigorous_support: "KR-RHO-825bca: about 1129 cycles per rho step"
      validation_plan: "read the unit in BD19; if not cycle-scale, restate w and rerun."
  target_complexity:
    time_exponent: "none claimed on E; reference arm L_{p^k}[1/3,c], subexponential in log p^k at fixed k"
    memory_exponent: "uncharged in the published models; rho O(1) plus DP table"
    best_known: "rho sqrt(pi r/(4|Aut|)) (KR-RHO-13bf67, -0528e7); on small-k curves the transfer is best known (KR-RHO-53c89f)"
    hidden_overhead: "o(1) dropped; kappa absorbs polynomial selection; sieve and linear-algebra memory uncharged"
    tradeoff_note: "TNFS parallelism and memory not modelled"
