  assumptions:
    - >-
      m = 4, prime fields, char > 3, non-singular short Weierstrass curves.
      Nothing transfers to F_{q^n}, characteristic 2 or 3, or any cost claim.
    - >-
      Two curves over the same F_p are isogenous iff they have equal trace
      (Tate). Matched pairs are therefore ISOGENOUS BY CONSTRUCTION, which is
      the opposite of EXP-MONO-0e6e8f's admissibility gate and must be
      declared, not inherited: the point of a matched pair is that the coarse
      invariants agree, and this design REQUIRES what that run FORBADE. The
      run wrapper must not carry over the "any_isogenous_pair =>
      failed_infrastructure" check into this contract.
    - >-
      #E^d(F_p)[4] is computed from E^d : y^2 = x^3 + A d^2 x + B d^3 for a
      fixed non-residue d and is independent of d.
    - >-
      Strata are separated and never pooled: the primary comparison is on the
      distinct-split stratum, with the (linear)(irreducible quadratic) and
      irreducible strata and the three excluded strata reported as separate
      integer vectors.

  proof_search_map:
    bottleneck: >-
      This is a MEASUREMENT design, not a theorem, and its one decisive step is
      CELL SATISFIABILITY: whether a pair matched on (t, Z, #E(F_p)[4]) but
      differing in #E^d(F_p)[4] exists at any declared prime. If it does not,
      HYP-B and HYP-C cannot be separated at that prime and the record's
      headline question is untested -- a bounded negative that must be reported
      as such, never swapped for an easier cell.
    baseline_embedding:
      parameter_slice: >-
        EXACT SLICE, ALREADY COMMITTED: the single archived witness pair
        (p=101, (A,B) = (2,12) and (4,1)) is a member of CELL-B by
        construction. Re-running it must return {38180, 107184, 6732} and
        {38092, 107008, 6996} on the distinct-split stratum. This is the
        experiment's own reproduction fixture.
      reproduction_check: >-
        Frozen regression fixture: those six integers, plus the
        admissible-stratum prediction {1^4: 38048, 2+2: 114048} that the
        archived review reports as identical for both curves. A run that does
        not reproduce all eight is an integrity failure and nothing downstream
        is read.
    observation_collision:
      observable: >-
        The five-class integer vector plus the (g-factor-type x class) joint
        table of a curve, per stratum.
      distinct_preimage_search: >-
        THE ENTIRE EXPERIMENT IS THE SEARCH. CELL-M asks for two distinct
        curves with the SAME observable and the same candidate invariant (a
        collision that HYP-C predicts must exist); CELL-T asks for two curves
        with the same #E(F_p)[4] and DIFFERENT observables (a collision that
        HYP-B predicts must NOT be breakable). The observable's fibre is
        measured rather than assumed, which is what the previous round did not
        do.
      residual_collision_risk: >-
        A matched-quadruple agreement in CELL-M bounds, but does not eliminate,
        finer curve structure: it shows only that THIS observable does not
        carry it. Any citation asserting "no finer invariant exists" from a
        CELL-M pass is an overclaim, and this is the exact error made with
        (t,Z) one round ago.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the class-count vector's candidate determinants fixed one
          invariant at a time -- (t,Z), then (t,Z,#E[4]), then
          (t,Z,#E[4],#E^d[4]) -- and vary everything else.
        predicted_gain: >-
          A nested ladder in which each rung is refuted or survives by an exact
          integer, so the answer is not "an invariant exists" but "this
          invariant and not that one", with the separating cell named.
      - transform: stronger_invariant
        proposed_object: >-
          Adjoin #E^d(F_p)[4] to the tracked invariant.
        predicted_gain: >-
          If CELL-T differs, the census's curve dependence is pinned to four
          integers and the parallel collision-rate closure of EXP-MONO-005b49
          is shown to have named a proxy rather than the mechanism. If CELL-T
          agrees, the adjoined coordinate is shown redundant HERE, which is a
          real and citable negative.
    quantifier_order: >-
      FOR ALL primes p in the declared list, FOR ALL pairs of non-isomorphic
      curves over F_p matched on the cell's declared invariant tuple, the
      per-stratum class-count vectors are equal (CELL-M, CELL-T under HYP-B) or
      unequal by the stated exact integers (CELL-B, CELL-T under HYP-C). No
      existential over curves is claimed: a cell that is empty is reported
      empty, and "there exists a pair that differs" is NOT the claim -- the
      claim is universally quantified over the cell's members.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at m = 4, over the declared primes and the exhaustively
        enumerated curve panel, the symmetric-base class counts are (or are
        not) constant on the fibres of a named invariant tuple. IT CANNOT
        certify a mechanism -- only the companion derivation proposal does that
        -- and a CELL-T difference of the predicted SIZE is stronger evidence
        for the mechanism than a difference of some other size, which is why
        the predicted integers are pre-registered rather than the mere
        direction. It CANNOT bound any relation rate, solver cost or exponent,
        CANNOT close KN-OPEN-009, and CANNOT be quoted beyond the tested primes
        and strata.
      nearby_object_control: >-
        CELL-N. The Red Team's E6 curve-free object reproduces the entire
        five-class census at the frequency level, so it is an object on which
        the conclusion "the census sees the curve" is KNOWN FALSE. It must
        show split-stratum degeneracy EXACTLY 0 while the real curves show
        thousands. If E6 also shows degeneracies, the observable does not see
        the curve either and NOTHING is concluded in any cell.
    proof_obligations:
      - claim: The archived witness pair reproduces bitwise under this contract.
        responsibility: baseline
      - claim: >-
          Every declared cell's occupancy is established by an exhaustive
          (A,B) scan BEFORE any census is run, and reported whether populated
          or empty.
        responsibility: feasibility
      - claim: >-
          Strata are separated; no comparison pools the degenerate stratum with
          the admissible one.
        responsibility: correctness
      - claim: >-
          The isogeny-exclusion gate inherited from EXP-MONO-0e6e8f is
          explicitly disabled for matched pairs, with the disabling recorded.
        responsibility: interface
      - claim: >-
          Nothing transfers to relation rates, cost, exponents, m != 4, or
          cryptographic scale.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        P1 (REPRODUCTION GATE) -- the archived witness pair's six
        distinct-split integers under an independently coded census
      direction: same
      minimum_effect: >-
        BITWISE IDENTICAL to {38180, 107184, 6732} and {38092, 107008, 6996}.
        Failure is an integrity failure and halts the run.
    - metric: >-
        P2 (CELL-M) -- per-class integer difference between the members of each
        (t, Z, #E[4], #E^d[4])-matched pair, on every stratum separately
      direction: different
      minimum_effect: >-
        EXACTLY 0 in every class on every stratum, on >= 5 pairs. One nonzero
        integer is outcome (III) and is the headline.
    - metric: >-
        P3 (CELL-B) -- per-class integer difference between the members of each
        (t,Z)-matched, #E[4]-mismatched pair
      direction: different
      minimum_effect: >-
        NONZERO on >= 5 pairs, and specifically |Delta #1^4| = |Delta h_+| * n_-
        on the distinct-split stratum if the companion mechanism is right.
        An all-zero cell resurrects HYP-A and indicts the archived probe.
    - metric: >-
        P4 (CELL-T, THE CRUX) -- per-class integer difference between the
        members of the (t, Z, #E[4])-matched, #E^d[4]-mismatched pair
      direction: different
      minimum_effect: >-
        HYP-B predicts EXACTLY 0. HYP-C predicts |Delta #1^4| =
        |Delta h_-| * n_+ and |Delta #2+1+1| = 3 |Delta h_-| * n_+ on the
        distinct-split stratum, i.e. >= 50 and >= 150 integers at p ~ 101.
        The two predictions are separated by more than 50 integers on an
        exhaustive enumeration.
    - metric: >-
        P5 (CELL-N, NULL SEPARATION, MANDATORY) -- split-stratum degenerate
        (repeated-root) count for the E6 curve-free object and for uniformly
        random monic quartics
      direction: lower
      minimum_effect: >-
        EXACTLY 0 for E6, against thousands on the real curves. If E6 emits
        degeneracies the observable is not curve-specific and NO CELL MAY BE
        READ, in either direction.
    - metric: >-
        P6 (SATISFIABILITY, REPORTED AS A FACT) -- occupancy of every
        (t, Z, #E[4], #E^d[4]) cell at each declared prime, from an exhaustive
        (A,B) scan
      direction: same
      minimum_effect: >-
        A complete table, reported whether or not the crux cell is populated. A
        null search is a bounded negative with its exact range, never silence
        and never a substituted cell.
    - metric: >-
        P7 (FREE STRUCTURAL CHECK) -- parity of h_+ + h_- : odd for p = 1 mod 4
        and even for p = 3 mod 4, on every Z = 3 curve in the scan
      direction: same
      minimum_effect: >-
        100.000% exactly. A violation indicates the h computation is wrong and
        voids every h-dependent number in the run.

  minimal_test:
    design: >-
      STAGE 0 (SCAN AND SATISFIABILITY, NO CENSUS). For each declared prime
      (>= 2 with p = 1 mod 4, >= 1 with p = 3 mod 4; p = 101 mandatory because
      the archived witness lives there), enumerate ALL non-singular (A,B) in
      F_p^2 and compute (j, t, Z, tau, group structure of E(F_p) and E^d(F_p),
      #E[4], #E^d[4], h_+, h_-, n_+, n_-). Emit the full cell-occupancy table
      (P6) and check the parity law (P7). Cost: O(p^3) ~ 10^6 operations at
      p = 101. THE CELLS ARE SELECTED FROM THIS TABLE BEFORE ANY CENSUS RUNS
      AND ARE FROZEN IN THE CONTRACT.
      STAGE 1 (REPRODUCTION GATE). Census the archived witness pair
      exhaustively on the distinct-split stratum and check P1. Halt on failure.
      STAGE 2 (THE THREE CELLS). Exhaustive census of every curve in CELL-M,
      CELL-B and CELL-T over ALL p^3 base points, with the five strata
      (distinct-split; (linear)(irreducible quadratic); irreducible;
      non-squarefree g; Res(g,f)=0) counted and reported SEPARATELY and never
      pooled. Read P2, P3, P4 as exact integer differences.
      STAGE 3 (CELL-N). The identical measurement on the E6 curve-free object
      and on uniformly random monic quartics (P5).
      STAGE 4 (LADDER, OPTIONAL AND SEPARATE). Repeat CELL-T at a second prime
      if one is populated, to show the crux result is not a p = 101 accident.
    controls:
      - >-
        NULL OBJECT (CELL-N), mandatory before any cell is read. The E6
        curve-free random-sign-function object reproduces the pooled five-class
        frequencies, so it is the correct null for "does this observable see
        the curve at all". Its split-stratum degeneracy count must be exactly 0.
      - >-
        KNOWN-TRUE BOUNDARY: an odd-order curve (Z = 0), whose split-stratum
        degeneracy count the archived review already measured as exactly 0
        (p=101, A=1, B=35, #E=121). An implementation emitting a nonzero count
        there has a bug and voids the run.
      - >-
        DUAL INDEPENDENT CLASSIFICATION PATHS with a declared cross-check
        subsample: PATH 1 factors Q_e over F_p by squarefree + distinct-degree
        factorization with no knowledge of any recipe; PATH 2 evaluates the
        (C3) recipe plus the degeneracy criterion. Disagreement voids the
        affected cell as an integrity failure, never a result.
      - >-
        MUTATION-TESTED POWER, measured not assumed: perturb one coefficient of
        S_4 by +1 and record the PATH1/PATH2 disagreement rate against a
        pre-registered floor; a control not demonstrated capable of failing is
        recorded as "not evaluated", never "passed".
      - >-
        ISOGENY GATE EXPLICITLY DISABLED, with the disabling recorded in the
        contract. Matched pairs are isogenous by Tate's criterion; the
        inherited "any_isogenous_pair => failed_infrastructure" check from
        EXP-MONO-0e6e8f would reject every cell in this design.
      - >-
        j = 0 and j = 1728 are excluded from generic arms and appear only as
        deliberately-studied members; any effect on them is checked against the
        extra-automorphism explanation before attribution (KN-OPEN-009's own
        requirement).
      - >-
        CURVE PANELS DRAWN FROM THE FULL EXHAUSTIVE SCAN, never a small-height
        (A,B) box (CORR-20260802-1d8384 defect 9).
      - >-
        STRATUM SEPARATION, enforced structurally: the report emits one integer
        vector per stratum per curve and the comparison code refuses a pooled
        vector.
      - >-
        h_+ and h_- computed two independent ways (2-descent character
        criterion on the root differences; direct enumeration of points of
        exact order 4 on E and E^d) and cross-checked; disagreement is an
        implementation failure.
    required_metrics:
      - full (t, Z, #E[4], #E^d[4], h_+, h_-, n_+, n_-, j) table for every non-singular curve at every declared prime
      - cell-occupancy table with every cell reported, populated or empty
      - per-curve five-class integer vector PER STRATUM, exhaustive
      - per-pair per-class integer differences for CELL-M, CELL-B, CELL-T
      - (g-factor-type x class) joint tables per curve, so a zero total difference with nonzero cell differences is visible
      - CELL-N degeneracy counts
      - PATH1/PATH2 agreement rate and mutation-test disagreement rate
      - the archived-witness reproduction check, all eight integers

  falsification_conditions:
    - >-
      F1 (INTEGRITY) -- the archived witness pair does not reproduce bitwise.
      Nothing downstream is read; the archived probe's own
      not-evidence-eligible status is confirmed and the discrepancy is
      reported as the finding.
    - >-
      F2 -- any CELL-M pair differs in any class on any stratum, with the dual
      path agreeing. HYP-C is refuted, a finer invariant exists, and the report
      localizes it. THIS IS OUTCOME (III) AND MUST BE THE HEADLINE, NOT
      ABSORBED.
    - >-
      F3 -- every CELL-B pair agrees bitwise. HYP-A is not refuted after all,
      the archived single-pair witness does not replicate, and the entire
      #E[4] lead named by DEC-20260904-dd58c3 next_action (1) is called into
      question. Low prior, decisive if it happens.
    - >-
      F4 -- CELL-T agrees bitwise. HYP-C is refuted, HYP-B stands as the
      operative invariant exactly as the Red Team named it, and the companion
      mechanism proposal's twist term (D1/h_-) is wrong. This is a legitimate
      and fully reportable outcome, not a failure of the experiment.
    - >-
      F5 -- CELL-T differs, but NOT by the pre-registered integers
      |Delta h_-| * n_+ and 3 |Delta h_-| * n_+. Then the invariant is finer
      than #E(F_p)[4] but the proposed mechanism's arithmetic is wrong, which
      separates "the twist matters" from "the twist matters in this specific
      way" -- a distinction only pre-registering the magnitude can buy.
    - >-
      F6 -- CELL-N's E6 object emits a nonzero split-stratum degeneracy count.
      The observable does not see the curve; NO CELL is read in either
      direction and the outcome is an instrument result, never mathematical
      evidence (AGENTS.md rule 5).
    - >-
      F7 -- the crux cell is EMPTY at every declared prime. P4 is NOT TESTED;
      the result is a bounded negative with its exact search range, HYP-B and
      HYP-C remain unseparated, and the successor extends the prime list rather
      than substituting a different cell.
    - >-
      F8 (THE PLANNED NEGATIVE, PRE-REGISTERED) -- if the cells resolve and the
      batch does NOT emit a statement of what remains open, the work is
      unfinished. Required forward guidance, fixed here: (i) m != 4; (ii) the
      relation-rate half of KN-OPEN-009; (iii) cryptographic scale, where the
      whole effect is O(1/p) relative and unobservable; (iv) whether the
      invariant that governs THIS observable governs any observable defined on
      relation collection, which is not tested here and must not be inferred.

  confounders:
    - >-
      STRATUM POOLING -- named verbatim in IDEA-20260904-ad63fe's own
      confounders and the direct cause, per objection O-2 of the Red Team
      report, of the previous round's chi-square artifact. The whole
      matched-pair signal lives in an O(1/p)-density stratum; pooling it with
      the admissible stratum both hides it and biases everything else.
      Structurally enforced here, not merely warned about.
    - >-
      CELL SCARCITY AND CELL SHOPPING. The crux cell may be empty. The
      declared prime list and the cell definitions are frozen before the scan
      is read, so an empty cell is reported empty rather than replaced by
      whatever the scan happens to offer.
    - >-
      ISOGENY. Matched pairs are isogenous by construction. Any effect must not
      be attributed to non-isogeny, and the inherited isogeny gate must be
      disabled deliberately and recorded.
    - >-
      IMPLEMENTATION SHARING WITH THE OBJECT UNDER TEST. Reusing
      EXP-MONO-0e6e8f's classifier for both paths makes the cross-check
      circular; at least one path must be blind to it, with blind_from declared.
    - >-
      j = 0 / 1728 AS BOTH THE CHEAPEST CM CONSTRUCTION AND A KNOWN
      EXTRA-AUTOMORPHISM LOCUS: any difference involving them is checked
      against the automorphism-count explanation first.
    - >-
      MODEL CORRELATION, CARRIED FORWARD: the design, the archived probe it
      re-tests, and the parallel collision-rate closure were all produced by
      the same model family. Any review must record that confound rather than
      inherit it.

  interpretation_limits:
    - >-
      CLAIM TIER: toy, for every measurement. This record derives nothing; it
      decides between named hypotheses by comparing integers.
    - >-
      NO ECDLP CLAIM IN EITHER DIRECTION; no curve becomes weaker or stronger.
      The whole effect is O(1/p) relative and vanishes at cryptographic size.
    - >-
      NO RELATION-RATE CLAIM. DEC-20260810-2f86db D-1's rejection of the
      generic-fibre cycle-type census as a relation-rate probe is accepted
      without qualification.
    - >-
      A CELL-M pass bounds finer structure only for THIS observable. Asserting
      "no finer invariant exists" from it repeats, one refinement later,
      exactly the error (C4) made with (t,Z).
    - >-
      m = 4 only, declared primes only, declared strata only. Does not close
      KN-OPEN-009 and does not authorize a status change.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING FOR THE COMPARISON ITSELF. Every metric is a
        difference of two EXHAUSTIVE integer counts over a finite stratum, so
        no distributional assumption, no sampling model, and no tolerance
        enters anywhere. This is deliberate and is the design's central
        property: H-MONO-1d50ac's history in this lane is a history of
        statistical instruments that were either constant or of unmeasured
        power, and an exact integer difference has neither failure mode.
      rigorous_support: >-
        Exhaustive enumeration of a finite set is not a statistical procedure.
        The only quantities that could be wrong are implementation-level, which
        is what the dual path, the mutation test, the known-true Z=0 boundary
        and the reproduction gate are for.
      validation_plan: >-
        SAMPLE: all p^3 base points per curve at p = 101 (1,030,301 per curve),
        of which the distinct-split stratum is C(n_+ + n_-, 3). COMPARE
        AGAINST: the archived witness integers (reproduction) and the
        pre-registered per-cell predictions of HYP-B and HYP-C. TAIL CHECK: the
        (g-type x class) joint tables must agree cell by cell wherever the
        totals agree, since compensating differences are the only way a matched
        pair could pass spuriously. TRANSFER ASSUMPTION, STATED: an exact
        result at p = 101 establishes nothing at any other prime except by
        re-running, which is why the prime list contains more than one and why
        no extrapolation is offered.
      falsification_condition: >-
        Any per-stratum integer difference inconsistent with the cell's
        pre-registered prediction, with the dual classification path agreeing
        and the null and boundary controls passing.
    - id: H2
      statement: >-
        HEUR-CELL-1 (SATISFIABILITY, TO BE ESTABLISHED, NOT ASSUMED). At least
        one declared prime carries (a) >= 5 pairs matched on
        (t, Z, #E[4], #E^d[4]) with distinct j, (b) >= 5 pairs matched on
        (t,Z) with different #E[4], and (c) >= 1 pair matched on
        (t, Z, #E[4]) with different #E^d[4].
      rigorous_support: >-
        (b) is already demonstrated: the archived review reports 47 (t,Z)
        buckets with >= 2 distinct j-invariants at p = 101 and 157 at p = 1009
        from a partial scan. (a) follows from the same bucket census once the
        buckets are refined. (c) is structurally available at p = 1 mod 4 with
        Z = 3 and #E(F_p)[4] = tau (which forces #E = 4 mod 8, hence
        #E^d = 0 mod 8, hence #E^d[4] in {8,16}, so both values are a priori
        reachable inside one isogeny class) but its occupancy at any particular
        small prime is a counting fact, not a theorem.
      validation_plan: >-
        SAMPLE: exhaustive (A,B) scan at every declared prime, O(p^3) work at
        p = 101. COMPARE AGAINST: nothing -- this is a census of cell
        occupancy, reported as a fact with the full table. TAIL CHECK: report
        the number of curves in every cell, including empty ones, so a reader
        can see what was available. TRANSFER ASSUMPTION: none.
      falsification_condition: >-
        A required cell is empty at every declared prime: that arm is NOT
        TESTED and is reported as a bounded negative with its exact range,
        never as support for either hypothesis.
    - id: H3
      statement: >-
        HEUR-CELL-2 (INSTRUMENT, MEASURED NOT ASSERTED). The independently
        coded factorization path has non-trivial power to detect a
        misclassification, i.e. it is not forced by construction to agree with
        the recipe path.
      rigorous_support: >-
        None a priori, which is why it is measured. EV-MONO-efbd1c records that
        an earlier headline metric in this lane was proved close to logically
        forced by its own construction, so classifier power is treated here as
        a quantity to measure rather than a property to assert.
      validation_plan: >-
        SAMPLE: mutation testing -- perturb one coefficient of S_4 by +1 and
        measure the PATH1/PATH2 disagreement rate over >= 5,000 base points;
        repeat for a perturbation of g and of f. COMPARE AGAINST a
        pre-registered floor (>= 50% disagreement). TAIL CHECK: feed the
        classifier a hand-built genuine 2+1+1 and a genuine repeated-root
        fibre and confirm correct labels.
      falsification_condition: >-
        Disagreement below the floor: the cross-check is near-vacuous, its
        agreement carries little evidence, and the run is reported as an
        implementation check rather than a measurement.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE. No algorithm and no attack is proposed; no exponent is
      claimed or moved. Measurement cost: O(p^3) for the curve scan and
      O(p^3 log p) field operations for one exhaustive census per curve, i.e.
      about 1.03 x 10^6 base points per curve at p = 101 (the archived run
      spent ~283 CPU-seconds for two such curves).
    memory_exponent: >-
      O(p) for character and point tables plus a constant-size counter vector
      per (curve, stratum, class); far under 1 GB at every declared parameter.
    best_known: >-
      Not applicable; no ECDLP complexity claim. The prime-field baseline is
      Pollard rho at O(sqrt N) time and O(1) memory (KN-OPEN-001), untouched in
      either direction. If the companion mechanism proposal's closed form
      survives, the census becomes an O(p) computation instead of an O(p^3)
      one -- which is a reason to run BOTH, since this record's exhaustive
      census is exactly the thing that would certify that replacement.
    hidden_overhead: >-
      None hidden. The whole measured effect is O(1/p) in relative density
      (132 and 44 instances out of 152,096 on the archived witnesses); at
      cryptographic p it is unobservable, and this record says so rather than
      implying an extrapolation.
    tradeoff_note: >-
      Not applicable. The census is embarrassingly parallel over base points,
      which is a convenience, not a result.

  dominated_by:
    value: not_applicable
    reason: >-
      No Pareto point is claimed on any cryptanalytic axis; there is no time,
      memory, or data/query coordinate on which this could dominate or be
      dominated. The frontier row for the underlying problem -- Pollard rho,
      O(sqrt N) time, O(1) memory over prime fields (KN-OPEN-001) -- was
      checked and is untouched. ON THE NARROW AXIS OF "DECIDING WHICH INVARIANT
      GOVERNS THIS OBSERVABLE", the incumbent is the archived single-pair
      review-side probe in EXP-MONO-0e6e8f's red-team report, which this design
      dominates on every axis it has: number of pairs (>= 11 vs 1), hypotheses
      separated (3 vs 1), contract status (frozen and evidence-eligible vs
      self-declared not evidence-eligible), and null control (present vs
      absent). It does NOT dominate on cost: the probe was seconds and this is
      up to a CPU-hour.
  sota_delta: >-
    0, exactly, on every attack axis; no security estimate for any curve at any
    size moves. Against the incumbent probe: 1 pair -> >= 11 pairs, 1 cell ->
    3 pre-registered cells plus a null cell, 0 -> 1 hypothesis pair (HYP-B vs
    HYP-C) that no prior record can separate, and a difference of >= 50
    integers where the incumbent design predicts 0.

  estimated_cost:
    implementation: medium
    compute: low
  estimated_cost_detail: >-
    Stage 0 scan: ~10^6 operations per prime. Stage 2: ~11-16 exhaustive
    censuses at p = 101 at roughly 140 CPU-seconds each by the archived run's
    own measured rate, i.e. under one CPU-hour total. Implementation is medium
    only because the curve scan (group structure, #E[4], #E^d[4], h_+, h_-)
    and the stratum separation are new code; the census core is reuse.

  recommended_priority: high

  priority_rationale: >-
    Ranked HIGH as the companion measurement to the mechanism proposal, and
    ranked high INDEPENDENTLY of it: this design answers
    DEC-20260904-dd58c3's next_action (1) on its own terms even if the
    mechanism derivation is judged premature, and it is the design that makes
    the archived matched-(t,Z) finding evidence-eligible at all. Its
    information-per-CPU-second is unusually high because every metric is an
    exact integer over an exhaustively enumerated stratum -- the lane's
    recurring failure mode (H-MONO-1d50ac: constant statistics, unmeasured
    power, single inconclusive cells) is structurally excluded rather than
    mitigated. And the crux cell is the rare object this program prizes: a
    single, cheap, exhaustively decidable comparison whose two possible
    outcomes are BOTH publishable internally -- either the invariant this
    session named twice is a proxy for a finer one, or it is exactly right and
    the finer candidate is dead.

