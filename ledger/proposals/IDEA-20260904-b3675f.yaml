  title: >-
    A ZERO-TOLERANCE, EXHAUSTIVE, MULTI-PAIR MATCHED-INVARIANT CENSUS THAT
    DECIDES WHICH FINER INVARIANT GOVERNS THE m=4 SYMMETRIC-BASE CLASS COUNTS:
    (t,Z) [already refuted by one pair], #E(F_p)[4] [the currently named
    candidate], or the pair (#E(F_p)[4], #E^d(F_p)[4]). Three pre-registered
    cells, exact integers, no statistics, no power calculation.

  claim: >-
    SCOPE FIRST. m = 4 only, prime fields F_p, p > 3, toy range p in
    [101, 1009]. The object is the symmetric-base Semaev quartic Q_e(T) of
    IDEA-20260904-ad63fe (C1) censused over base points (e1,e2,e3). NO ECDLP,
    relation-rate, cost, or exponent claim is made or implied. Claim tier: toy
    for every measurement.

    NOTATION. t, Z, tau = Z+1, n_+ , n_- as in IDEA-20260904-ad63fe (C4);
    E^d the quadratic twist; and
      h_+ := (#E(F_p)[4]   - tau)/4 = #{T in E[2](F_p)\{O} : T in 2E(F_p)},
      h_- := (#E^d(F_p)[4] - tau)/4 = #{T in E[2](F_p)\{O} : T in 2E^d(F_p)}.

    THE CLAIM IS A DISCRIMINATION, STATED AS THREE MUTUALLY EXCLUSIVE
    HYPOTHESES ABOUT ONE EXACT INTEGER VECTOR.
      HYP-A ("(t,Z) and nothing else", IDEA-20260904-ad63fe C4 as written).
        Two curves over the same p with the same (t,Z) have BITWISE IDENTICAL
        class counts. ALREADY REFUTED by a single pair in
        EXP-MONO-0e6e8f's Red Team review -- but by ONE pair, in a REVIEW-SIDE
        PROBE that declares itself not evidence-eligible. Re-tested here under
        a contract, on many pairs, as the baseline.
      HYP-B ("#E(F_p)[4] completes it", the invariant that review NAMED, and
        the same invariant EXP-MONO-005b49's own red-team-breakthrough review
        independently found completes the m=4 collision-rate closed form).
        Two curves over the same p with the same (t, Z, #E(F_p)[4]) have
        bitwise identical counts.
      HYP-C ("the twist counts too"). Two curves over the same p with the same
        (t, Z, #E(F_p)[4], #E^d(F_p)[4]) have bitwise identical counts, and
        two curves matched on (t, Z, #E(F_p)[4]) but NOT on #E^d(F_p)[4] have
        DIFFERENT counts.
    HYP-C strictly refines HYP-B, which strictly refines HYP-A. The three are
    separated by exact integers on exhaustively enumerated strata, so the
    experiment has no tolerance to negotiate and no power to lose.

    THE DESIGN, IN THREE CELLS, ALL EXHAUSTIVE AND ALL EXACT.
      CELL-M (the null-invariant / matched arm). >= 5 pairs of non-isomorphic
        curves over one prime sharing (t, Z, #E[4], #E^d[4]). Prediction under
        HYP-C: bitwise identical five-class vectors AND identical
        (g-factor-type x class) joint tables. Any differing integer refutes
        HYP-C and shows a still-finer invariant exists.
      CELL-B (the reproduction arm). >= 5 pairs sharing (t, Z) with DIFFERENT
        #E(F_p)[4]. Prediction under HYP-B and HYP-C alike: counts differ.
        This reproduces the archived single witness at scale and under a
        contract; a cell in which counts AGREE would resurrect HYP-A and
        indict the archived probe.
      CELL-T (THE CRUX -- the only cell that separates HYP-B from HYP-C).
        >= 1 pair sharing (t, Z, #E(F_p)[4]) with DIFFERENT #E^d(F_p)[4].
        HYP-B predicts BITWISE IDENTICAL. HYP-C predicts a difference of
        exactly (h_-^{(1)} - h_-^{(2)}) * n_+ in class 1^4 and
        -3 * (h_-^{(1)} - h_-^{(2)}) * n_+ in class 2+1+1 on the distinct-split
        stratum. At p ~ 101 that is >= 50 integers, typically >= 150. ONE PAIR
        DECIDES.
      CELL-N (null objects, mandatory, not a hypothesis arm). The Red Team's
        own E6 object -- the (C3) recipe driven by an i.i.d. random +-1
        function with NO curve, NO group law, NO cover -- and uniformly random
        monic quartics over the same F_p, measured identically. Both must show
        ZERO split-stratum degeneracy; both reproduce the pooled five-class
        frequencies, so this is the measurement that separates the cover from
        its own null.

    THE THREE OUTCOMES, DEFINED BEFORE ANY RUN.
    (I) CELL-M agrees bitwise, CELL-B differs, CELL-T differs by exactly the
        predicted integers: the operative invariant is (#E[4], #E^d[4]), HYP-B
        is refined, and the m=4 symmetric-base census's curve dependence is
        pinned to four integers.
    (II) CELL-M agrees, CELL-B differs, CELL-T agrees bitwise: HYP-B stands,
        #E(F_p)[4] is the operative invariant exactly as named, and the twist
        plays no role -- which would be the direct, exact confirmation of the
        Red Team's own naming and of the parallel collision-rate result, and
        would refute the companion mechanism proposal's (D1).
    (III) CELL-M DISAGREES on any pair: none of the three hypotheses is
        complete, a still-finer invariant governs the census, and the honest
        report localizes it by which cells and which joint-table entries moved.
        This is the most informative outcome and the one this design exists to
        be able to detect.

  mechanism: >-
    WHY AN INVARIANT AT ALL, AND WHY THESE THREE CANDIDATES. The five-class
    label factors through S_4 -> S_4/V_4 = S_3, whose S_3 part is the
    factorization type of the uniformly random monic cubic g and carries NO
    curve information; the curve enters only in the V_4 part, through the
    quadratic characters chi(f(t_i)) (EXP-MONO-0e6e8f Red Team, J3 step 1,
    independently re-derived there and agreeing with IDEA-20260904-ad63fe
    (C3)(a)). That accounts for (t, Z) and for HYP-A. HYP-A then fails on the
    DEGENERATE sub-locus where two of the four fibre points coincide, which
    happens iff P_i +- P_j lies in E[2]\{O} -- a condition on 2-torsion, hence
    on 4-torsion once one asks WHICH pairs of x-coordinates are related, since
    the relation is a fixed-point condition for the translation-by-2-torsion
    involution on the x-line. #E(F_p)[4] counts halvings of 2-torsion by
    F_p-RATIONAL points; the census's base points are arbitrary elements of
    F_p, not x-coordinates of rational points, so on a priori grounds the
    x-rational halvings -- which include halvings on the quadratic twist --
    are the ones that can enter. HYP-B and HYP-C are exactly the two readings
    of that sentence, and they are experimentally separable.

    WHAT MAKES THIS DESIGN DIFFERENT FROM THE THREE CENSUSES THIS LANE HAS
    ALREADY RUN. EXP-MONO-12ce1c's mandatory cross-curve null was proved
    UNSATISFIABLE for any companion object, voiding its Stage 2.
    EXP-MONO-815525 conditioned on g irreducible, which its own red-team null
    proved has zero discriminating power. EXP-MONO-0e6e8f fixed both but froze
    an ASYMPTOTIC chi-square null its own parent record said was false, and
    deferred the matched control. This design makes NO density comparison and
    computes NO test statistic: every metric is a difference of two exhaustive
    integer counts, which is either zero or not. H-MONO-1d50ac's long history
    in this lane is a history of instruments whose statistics were constant or
    whose power was unmeasured; an exact integer difference has neither
    failure mode.

    THE LOSSY-PROJECTION TEST, RUN BEFORE ANY COMPUTE. TRACKED OBJECT: the
    ordered pair (five-class integer vector, (g-type x class) joint table) of
    a CURVE -- i.e. the curve projected onto its census signature. Genuinely
    lossy: the p^2-sized space of curves at a prime collapses onto a small set
    of integer vectors, discarding j, the endomorphism ring, the automorphism
    group, the CM discriminant, and the group structure itself. Discarded
    COMPATIBLY: the projection is a sum over base points of a quantity that
    (C3) and the degeneracy criterion together determine pointwise from f and
    g alone, so it propagates deterministically under the cover's operation.
    NOT a change of coordinates: the previously tracked object was the census
    of ONE curve, whose fibre over the observable was never examined; this
    object is the FIBRE ITSELF -- which curves share a signature -- and the
    whole experiment is the search for two curves in one fibre that differ in
    a named invariant. A projection with a one-element fibre would be a change
    of coordinates; this one has fibres of size >= 2 by construction, and
    establishing that (via the Stage 0 scan) is a precondition of the run
    rather than an assumption of it.

