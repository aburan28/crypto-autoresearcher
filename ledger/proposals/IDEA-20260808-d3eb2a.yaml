idea:
  id: IDEA-20260808-d3eb2a
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDSA-87625f
  goal_id: GOAL-ECDSA-001
  title: 'Erroneous leakage turns the lattice route into a CLAW problem, not a degraded one:
    the naive (1-e)^m success law is the cost of guessing the clean subset blindly, but pairwise
    HNP consistency is a checkable predicate on 2-subsets, so subset selection admits a meet-in-the-middle
    with a computable exponent — and the error rate is the axis the frontier is most likely
    to assume away'
  class: algorithm
  claim: "SCOPE: ECDSA/DSA partial-nonce leakage with ERRONEOUS bits, error model \"the reported\
    \ l-bit value is correct with probability 1-e and otherwise uniform among the other 2^l\
    \ - 1 values, i.i.d. across signatures\". NOT the plain ECDLP. H-ECDSA-7ccd4b derives,\
    \ for the naive lattice route, success probability exactly (1-e)^m — i.e. all m chosen\
    \ samples must be clean — giving an expected (1-e)^(-m) repetitions when m samples are\
    \ drawn blindly from M available ones. CLAIM: that law prices BLIND SELECTION, and selection\
    \ is not blind, because the HNP structure supplies a cheap consistency predicate on SMALL\
    \ subsets:\n  for a pair (i, j), the lattice generated by the two centred congruences\n\
    \  contains a vector of predicted norm computable from (l, N) alone, and a\n  pair containing\
    \ an erroneous sample fails that norm test with\n  probability bounded below by a computable\
    \ quantity q(l, N).\nTherefore the clean-subset search is a CLAW/MITM problem: build two\
    \ halves of a candidate subset independently, filter each by the pairwise predicate, and\
    \ join. PREDICTION: the exponent of the selection cost drops from m log2(1/(1-e)) to roughly\
    \ (m/2) log2(1/(1-e)) plus a join term, i.e. a SQUARE-ROOT of the naive selection cost,\
    \ at the price of storing the surviving half-lists. THE DISCRIMINATOR: q(l, N) is either\
    \ bounded away from zero — the predicate has power, the claw decomposition applies, and\
    \ the erroneous regime is far cheaper than (1-e)^(-m) suggests — or q decays to zero as\
    \ l falls, in which case at l = 1 the predicate is blind, no MITM exists, and the (1-e)^(-m)\
    \ law is TIGHT for the lattice family at exactly the leakage level the goal cares about.\
    \ Both outcomes are directly decision-relevant to GOAL-ECDSA-001's completion criterion\
    \ 3."
  mechanism: 'DERIVED IN-REPO. From X1-01''s algebra (file X1.yaml), sample i gives A_i d
    + Btilde_i = u_i (mod n) with |u_i| <= n/2^(l+1) when the leaked bits are correct, and
    u_i essentially uniform mod n when they are not. A CLEAN PAIR therefore admits a small
    simultaneous solution while a CORRUPTED PAIR generically does not: eliminating d between
    two congruences gives A_j u_i - A_i u_j = A_j Btilde_i - A_i Btilde_j (mod n), whose left
    side is bounded by 2 |A| n/2^(l+1) for clean samples and unbounded for corrupted ones.
    The predicate is one modular multiplication and one comparison — cheaper than any lattice
    reduction — and it is exactly the kind of cheap, structure-preserving filter a claw decomposition
    needs. WHY IT IS A CLAW AND NOT JUST FILTERING: after pairwise filtering the survivors
    still contain corrupted samples that happened to pass, so the m-subset must still be assembled;
    assembling it by two independent halves joined on a consistency key is Wagner/MITM in
    the same sense as the merge tree of X1-02. The join key is the residue of the eliminated-d
    expression, which is computable per half-subset. THE HONEST WEAK POINT, STATED UP FRONT:
    q(l, N) is the probability that a corrupted pair FAILS the bound, and it is close to 1
    only when 2 n/2^(l+1) is much smaller than n, i.e. when l is not tiny. At l = 1 the clean
    bound is n/4, so a corrupted pair passes with constant probability and the predicate is
    nearly powerless. I THEREFORE EXPECT THE MECHANISM TO WORK IN THE MODERATE-l REGIME AND
    TO FAIL AT l = 1 — and saying which is the deliverable, because "the error-rate axis is
    cheap at l >= 3 and brutal at l = 1" is a frontier fact nobody has stated.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN: sample filtering / outlier rejection in
    HNP attacks, which practitioners certainly do, and H-ECDSA-7ccd4b''s own (1-e)^m law.
    The differences: (a) the predicate is derived from the pairwise elimination identity rather
    than from a heuristic score, so its failure probability q(l, N) is a computable quantity
    rather than a tuned threshold; (b) the selection problem is framed as a CLAW with an explicit
    MITM split and a time-memory tradeoff, which is a different cost statement from filtering;
    (c) the deliverable is the l-dependence of q, i.e. WHERE the technique dies, which is
    the part that matters for the 1-bit boundary. PRIOR-ART RISK, NAMED: erroneous-HNP handling
    appears in the Bleichenbacher/lattice literature I could not read this session; if a published
    pairwise-consistency MITM exists, this reduces to an application and says so.'
  predictions:
  - observable: q(l, N), the probability a corrupted pair fails the norm bound
    metric: measured fraction over 10^4 random pairs per cell, N in {32,48,64}, l in {1,2,3,4}
    predicted: Decreasing in decreasing l; above 0.5 at l >= 3 and below 0.15 at l = 1. Structural
      expectation from the bound 2n/2^(l+1), not a measurement. If q is high at l = 1 the
      mechanism is stronger than I expect and the frontier moves in the attacker's favour.
  - observable: selection cost to find one clean m-subset, MITM versus blind
    metric: log2 ratio of predicate evaluations
    predicted: Saving of at least 0.35 m log2(1/(1-e)) bits at l >= 3, e in {0.05, 0.15};
      no saving at l = 1.
  - observable: peak memory of the MITM half-lists
    metric: log2 entries
    predicted: About half the log2 of the blind search space, the standard claw tradeoff;
      reported beside every time figure.
  - observable: false-clean rate — subsets accepted by the pipeline that contain a corrupted
      sample
    metric: fraction
    predicted: Nonzero and computable from q; the certificate (d*G = Q) is what makes a false-clean
      harmless, and any pipeline without it is inadmissible.
  minimal_test: Toy scale, LABELLED TOY. At N in {32, 48, 64} on prime-order toy curves, generate
    M signatures with l-bit leakage corrupted at rate e; measure q(l, N) directly by evaluating
    the pairwise predicate on known-clean and known-corrupted pairs (ground truth available
    because the harness plants the errors); then run blind selection and MITM selection to
    first certified recovery and compare predicate-evaluation counts and peak memory. Every
    recovery certified by d*G = Q computed independently of the solver.
  controls:
  - GROUND-TRUTH CONTROL: the harness knows which samples are corrupted, so q is measured
      directly rather than inferred from attack success. This separates predicate power from
      pipeline performance (validation-ladder step 1).
  - MATCHED NULL: e = 0. The predicate must accept essentially all pairs and the MITM must
      give no saving; a saving at e = 0 means the machinery is exploiting something other
      than error structure.
  - DECAY TEST: sweep e from 0 to 1. Selection cost must rise monotonically and both methods
      must converge to hopeless at e near 1. Non-monotonicity indicts the measurement.
  - CERTIFICATE: no statistical acceptance anywhere; only d*G = Q counts as recovery.
  confounders:
  - The A_i are not independent of the u_i in a real signature stream if the leakage source
    correlates with nonce value; the i.i.d. error model is an idealization inherited from
    H-ECDSA-7ccd4b and is stated as such.
  - Pairwise predicate power does not compose independently across pairs within a subset;
    treating subset acceptance as a product of pairwise acceptances is an approximation and
    must be measured, not assumed.
  - Toy N inflates the relative size of boundary effects in the norm bound; the l-dependence
    of q is the transportable part, the absolute value is not.
  - MITM memory at toy scale is dominated by interpreter overhead; report algorithmic entry
    counts alongside raw peak.
  falsification_conditions:
  - q(l, N) is near zero at every tested l — the predicate has no power anywhere, no claw
    exists, and the (1-e)^m law stands. A clean negative that strengthens H-ECDSA-7ccd4b.
  - MITM selection shows no saving at l >= 3 where q is measured high — the composition assumption
    fails and the claw framing is withdrawn.
  - A saving appears at e = 0 — the machinery is measuring an artifact.
  - Prior art shows the pairwise-consistency MITM published — recorded as KNOWN, downgraded
    to an application.
  interpretation_limits: A statement about SELECTION COST under an assumed erroneous-leakage
    model, not about ECDSA and not about the ECDLP. Every result carries the leakage assumption
    and the error rate in the same sentence. Toy-scale throughout; the transportable claim
    is the l-dependence of q, never an absolute cost at 256 bits. It improves no published
    attack and moves no exponent of any hard problem.
  assumptions:
  - The i.i.d. error model of H-ECDSA-7ccd4b Part B; other models (burst errors, biased corruption)
    are out of scope and named as such.
  - Prime group order, A_i effectively uniform mod n.
  - Certificate-first acceptance (docs/claims-and-verification.md).
  heuristic_assumptions:
  - id: HA-13
    statement: (Corrupted-pair unboundedness.) For a pair containing at least one corrupted
      sample, the eliminated-d residual A_j u_i - A_i u_j mod n is distributed essentially
      uniformly on Z/n, so it exceeds the clean bound with probability q(l, N) = 1 - O(2^(-l))
      up to the boundary effects the toy scale exposes.
    rigorous_ingredient: The clean bound |A_j u_i - A_i u_j| <= 2 max|A| n/2^(l+1) is an exact
      triangle inequality; only the corrupted-side distribution is assumed.
    distribution_imitated: Equidistribution of products of independent uniform residues mod
      n — the same heuristic every HNP yield analysis makes.
    validation_route: 'Directly measurable with ground truth at toy N: plant corruptions,
      evaluate the residual on 10^4 corrupted pairs per (l, N) cell, and compare the empirical
      exceedance rate against 1 - 2^(-l+1). Exact enumeration is possible at N = 32 for small
      sample counts, giving a sampling-error-free check. TOY LABEL: toy-scale; the l-dependence
      is the transportable part.'
    tail_checks: Examine the LOW tail of the corrupted residual distribution — corrupted pairs
      that look clean are precisely the false-cleans that survive filtering, and their frequency,
      not the mean, controls the pipeline.
  target_complexity:
    time_exponent: 'Blind selection: (1-e)^(-m) trials, i.e. exponent m log2(1/(1-e)) bits.
      Claimed MITM selection: about (m/2) log2(1/(1-e)) plus a join term, i.e. a square-root
      in the selection factor — CONDITIONAL on q bounded away from zero and therefore expected
      to hold at l >= 3 and to fail at l = 1. No exponent of ECDLP or of any hard problem
      moves; this is an attack-cost exponent inside an assumed leakage model.'
    memory_exponent: About half the blind log-search-space in half-list entries — the standard
      claw tradeoff, reported beside every time figure. Blind selection is memory-free, so
      this is a genuine memory cost the naive law does not have and it must not be omitted
      from any comparison.
    best_known_baseline: H-ECDSA-7ccd4b's (1-e)^m law for the naive lattice route, plus whatever
      the erroneous-leakage rows of the published frontier report (RELAYED and unverified
      per RQ-ECDSA-87625f.provenance).
    hidden_overhead_disclosure: The join term is not derived here and could dominate; the
      composition of pairwise into subset acceptance is approximate; and the whole claim is
      void where q is small, which is exactly the l = 1 cell the goal cares most about. Stated
      in the claim rather than buried.
    time_memory_tradeoff: 'Explicit: the claw split is the tradeoff, and under the program''s
      theta convention (X1-08) the half-list storage is charged, which partially erodes the
      saving. The charged and uncharged savings must both be reported.'
  sota_delta: 'Conditional and bounded: at l >= 3 and moderate e, a predicted selection saving
    of at least 0.35 m log2(1/(1-e)) bits against the naive law, paid for in memory. At l
    = 1, predicted zero saving. The honest headline is that the deliverable is the LOCATION
    of the transition in l, not a speedup.'
  dominated_by: 'CHECKED across the frontier this program holds: as an attack it is dominated
    by every published erroneous-leakage row until it is implemented; against in-corpus analysis,
    H-ECDSA-7ccd4b dominates on the naive law and does NOT address selection strategy. EXTERNALLY
    UNCHECKED (web unavailable): published erroneous-HNP filtering may dominate, and that
    is the named Stage-0 prior-art question.'
  estimated_cost: Implementation medium (toy curve, error injection, pairwise predicate, half-list
    join, certificate check — all pure Python). Compute low, a few CPU-hours for the full
    (N, l, e) sweep, under 8 GB.
  recommended_priority: medium
  honest_prior_of_survival: 0.4. I expect q to be measurable and l-dependent (high confidence,
    ~0.8), but I expect the MITM saving to materialize only where the attack was already cheap,
    and to vanish at l = 1 where it would matter. The value of the record is therefore mostly
    in the negative half of its own prediction, which is stated up front rather than discovered
    later.
  novelty_status: unverified
  novelty_screen: SCREENED against ledger/hypotheses/H-ECDSA-7ccd4b.yaml (read in full, including
    its Part B error model and (1-e)^m law), H-ECDSA-a23475 (full), the RQ-ECDSA rows of EXISTING_PROPOSALS.txt,
    EXISTING_HYPOTHESES.txt, KNOWLEDGE_BARRIERS.txt, knowledge/techniques/KN-TECH-019.md,
    and my own X1.yaml (X1-01..X1-04). No in-corpus record treats subset selection as a claw.
    External literature not reachable this session, so status is `unverified` rather than
    `screened`.
  discriminated_from: 'H-ECDSA-7ccd4b Part B: derives the (1-e)^m success law and the bias
    contraction under error; it prices blind selection and proposes no selection algorithm,
    no predicate, and no memory cost. X1-01/X1-02 (in X1.yaml): exact-leakage objects and
    a class bound; neither touches the error rate. X1-04: negative certificates, a different
    deliverable.'
  source_refs:
  - ledger/hypotheses/H-ECDSA-7ccd4b.yaml
  - ledger/questions/RQ-ECDSA-87625f.yaml
  - knowledge/techniques/KN-TECH-019.md
  - docs/claims-and-verification.md
  proof_search_map:
    bottleneck: The probability q(l, N) that a corrupted pair is detectable. Everything —
      whether a claw exists, whether the saving is real, whether the l = 1 cell is reachable
      — turns on that single quantity.
    baseline_embedding:
      parameter_slice: e = 0, where selection is trivial and both methods cost 1 trial; and
        q = 0, where the predicate is blind and the method reduces exactly to blind selection
        at (1-e)^(-m).
      reproduction_check: 'Symbolic: at q = 0 no pair is ever rejected, so the half-lists
        are the full search space and the MITM cost equals the blind cost identically. The
        incumbent law is an exact boundary case, not something the method merely resembles.'
    observation_collision:
      observable: the count of predicate evaluations to first certified recovery.
      distinct_preimage_search: 'COLLISION: a low count can arise from a powerful predicate
        OR from a lucky draw of a clean subset early, and at small M these are indistinguishable
        in a single run. SEPARATING CONDITION: the measured q on ground-truth pairs, which
        is independent of the attack''s luck. That is why q is measured separately rather
        than inferred from attack success.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Replace "reject noisy samples" by the exact modular inequality from
        eliminating d between two congruences, so the filter's power is a computable probability
        rather than a tuned threshold.
      predicted_gain: q becomes a measurable function of (l, N) with a predicted l-dependence,
        hence falsifiable.
    - transform: specialization_pack
      proposed_object: Split the subset search into two halves joined on the eliminated-d
        residue, charging each half's storage once.
      predicted_gain: A square-root in the selection factor, with the memory cost charged
        rather than hidden.
    quantifier_order: THERE EXISTS one predicate, fixed before any run and derived from the
      elimination identity, SUCH THAT FOR ALL (l, N, e) in the declared grid its measured
      rejection rate on corrupted pairs equals q(l, N) within sampling error, and the MITM
      cost follows. The predicate may not be retuned per cell. The weaker order — for each
      cell there exists a threshold that separates — is trivially satisfiable and is not claimed.
    method_ceiling:
      strongest_certifiable_claim: At most a selection-cost statement under an assumed i.i.d.
        error model at toy sizes, with a measured q and a measured ratio. Cannot certify any
        cost at 256 bits, cannot bound the predicate-composition approximation, cannot speak
        to other error models, and says nothing about ECDLP.
      nearby_object_control: 'THE OBJECT WHERE THE METHOD MUST FAIL: l = 1, where the clean
        bound is n/4 and a corrupted pair passes with constant probability. If the machinery
        reports a large saving at l = 1 it is not measuring predicate power and every other
        cell is void.'
    proof_obligations:
    - claim: The clean-pair bound is an exact triangle inequality.
      responsibility: correctness
    - claim: At q = 0 the method reduces exactly to blind selection.
      responsibility: baseline
    - claim: q is measured on ground truth, not inferred from attack success.
      responsibility: interface
    - claim: Half-list memory is reported beside every selection-cost figure.
      responsibility: memory
    - claim: Every recovery carries an independently verified d*G = Q certificate.
      responsibility: correctness
    - claim: No sentence states a result without the leakage assumption and error rate.
      responsibility: scope
    not_applicable_reason: null
