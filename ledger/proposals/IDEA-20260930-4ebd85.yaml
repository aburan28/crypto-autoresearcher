idea:
  id: IDEA-20260930-4ebd85
  question_id: RQ-KIC-7502b9
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: Triple-sum occupancy against a relabelled cyclic group, two toy binary scales
  class: measurement
  claim: For a frozen explicit point set B of size m on the prime-order subgroup of a toy binary Koblitz
    curve, the fraction of subgroup elements that lie in the unordered distinct triple sumset of B matches
    the same fraction computed in a relabelled copy of Z/rZ, up to a relative gap of 0.25, at both n=7
    and n=11. The comparison distribution is the classical occupancy probability 1-(1-1/r)^M with M=m(m-1)(m-2)/6,
    which is a theorem for independent uniform throws and is not a theorem for elliptic sums; the null
    used for the decision is uniform group elements under a random bijection to Z/rZ. Representation class
    R3 (an ordered triple in E^3, projected to its sum). The attack stage is relation yield, not solver
    time. No time or memory exponent moves. If the relative gap exceeds 0.25 at either scale, the curve
    sumset is not generic at that scale and the uniform explanation is false.
  mechanism: 'OBJECT FRAME. Representation: R3, an ordered triple of subgroup points, which is a point
    of E^3 rather than a function E -> X. Operation set Sigma: the action of S_3 by permuting the three
    slots. Sigma is not translation and does not contain the full translation action of the subgroup.
    Trichotomy: branching. Reason: the unordered sum is invariant under S_3, but distinct S_3-orbits can
    share a sum, and that collision is not a block system of any subgroup of translations. On a base that
    is not itself a coset of a subgroup, no nontrivial translation preserves B^3.


    LOSSY-PROJECTION TEST, against Sigma = S_3. The tracked object is the sum element in the subgroup,
    equivalently the 0-1 indicator that a group element is hit. Discarded: the order of the summands and
    the identity of which S_3-orbit produced the sum. Order-discard is Sigma-compatible because every
    permutation leaves the sum unchanged, so the sum factors through the quotient by S_3. The further
    discard of which orbit is the loss: it is lossy precisely when the mean number of S_3-orbits per hit
    element is greater than 1. If every hit has exactly one orbit, L=0 for the orbit-to-sum map and the
    projection from orbits to sums is not lossy; that cell is reported and does not support a non-generic-yield
    claim. The x-coordinate is not the object, so this is not a Kummer line.


    THE PROBABILITY. Let r be the subgroup order, m=|B|>=3, M=m(m-1)(m-2)/6 the number of unordered distinct
    triples, and cov the fraction of the r subgroup elements (including the identity, which is a legal
    sum) that equal at least one such triple sum. For independent uniform throws of M group elements the
    hit probability of a fixed element is p_occ = 1-(1-1/r)^M, and the expected coverage is p_occ. No
    classical theorem in this session''s reading says elliptic triple sums obey p_occ. The decision null
    is therefore uniform group elements: draw a fixed random bijection phi from the subgroup to Z/rZ,
    replace the sum P+Q+R by phi^{-1}(phi(P)+phi(Q)+phi(R)), and compute cov on that law with the same
    image of B. A second null draws M independent uniform subgroup elements (random-label) and computes
    their coverage. Identity is the curve law.


    TWO EXPLANATIONS. Explanation G: cov_curve / cov_cyclic is in [0.75, 1.25], so at these scales the
    useful relation yield of a three-point predicate is the generic occupancy of M sums, and co-design
    of which points sit in B cannot beat the random set of the same size by more than that band. Explanation
    N: the ratio exits that band, so the curve law plus this B produces a non-generic sumset and cardinality
    is not the whole yield story. Both are decidable. This is not H-KIC-c72d8b, which asks whether one
    affine plane retains 95 percent of a specific coverage count on one N=19 pool. This idea does not
    search for a plane.


    What was avoided. Not a first-fall-degree subexponential claim (KR-IC-889857). Not Diem''s regime
    n ~ sqrt(log q) as an algorithm (KR-IC-64659b is cited only as the open-case reminder that prime-degree
    binary fields are outside that theorem). Not tau-Horner, not a subspace choice, not SAT versus F4.
    F2 is a named component only as the definition of a useful relation (a triple sum). Added: the occupancy
    comparison and the cyclic null.


    OPEN NUMBER. L = log2 of the mean number of S_3-orbits per hit element. b from IDEA-20260802-002 applied
    to the indicator of the sumset is expected to be large under translation, and that large b is a calibration,
    not a proposed propagation. Canonicalisation of one S_3-orbit is 6 orderings, or fewer when points
    repeat; repeats are excluded by the distinct-triple rule, so the canonicalisation cost is the constant
    6 and is not the quantity under test. The quantity under test is the coverage gap.'
