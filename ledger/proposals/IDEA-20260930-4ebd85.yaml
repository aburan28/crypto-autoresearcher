    verified_by: null
  assumptions:
  - 'The n=7 parameters are those recorded in H-KIC-9416d9, which this session read: a=1, modulus x^7+x+1,
    group order 142, subgroup order 71. The n=11 order is computed by enumeration inside the test and
    is not stated in this proposal.'
  - 'B is chosen by a frozen rule before coverage is computed: the m lexicographically smallest subgroup
    x-coordinates, both lifts included until |B|=m, and a second B drawn by a frozen seed as a uniform
    subset of size m. Neither set is optimized on coverage.'
  - The identity element is a legal sum and is counted in the denominator r.
  - Distinct summands only. Ordered triples that differ by an S_3 permutation are one orbit.
  - No exponent, no smoothness probability, and no first-fall degree is assumed. H1 below is a statement
    about coverage, and the decision null does not depend on H1.
  proof_search_map:
    bottleneck: Whether a coverage gap between the curve and a relabelled cyclic group is distinguishable
      from occupancy variance at m and r of the two toy scales. There is no algorithmic bottleneck being
      removed.
    baseline_embedding:
      parameter_slice: n=7, r=71, m=8 and m=12, exhaustive image of all unordered distinct triples. The
        baseline coverage is the relabelled Z/rZ law on the same labels, plus the closed-form p_occ for
        the random-label expectation.
      reproduction_check: Two independent implementations of the n=7 curve sumset (schoolbook addition
        and a second addition routine) must produce the same hit set. The cyclic sumset must have size
        computable by sorting M sums.
    observation_collision:
      observable: The hit-set of the triple sumset, as a subset of the subgroup.
      distinct_preimage_search: For each hit element record the number of S_3-orbits. An element with
        two orbits is an observation collision for the sum. The test keeps those multiplicities. Coverage
        alone collides a Sidon-like set with a set that has relations; the multiplicity vector is retained
        so coverage is not the only observable.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: The fiber of the sum map on S_3-orbits of distinct triples.
      predicted_gain: Separates generic occupancy (fiber sizes matching the cyclic null) from a structured
        sumset (fiber sizes or coverage outside the band).
    - transform: specialization_pack
      proposed_object: The same measurement at n=7 and n=11 with the same m-rule.
      predicted_gain: A gap that appears at only one scale is not reported as a property of the family.
    quantifier_order: 'For all frozen (n in {7,11}, m in the pre-registered list, seed of the cyclic bijection
      and of the random subset) fixed before coverage is read: compute cov_curve, cov_cyclic, and cov_random_label.
      The bijection is not redrawn after seeing cov_curve. Exists is only the enumeration.'
    method_ceiling:
      strongest_certifiable_claim: At these two degrees and these m, either the curve triple sumset matches
        the cyclic null within a relative gap 0.25, or it does not. The match does not prove genericity
        at n=131. The mismatch does not prove an index-calculus exponent.
      nearby_object_control: A subgroup of Z/rZ itself, with B an arithmetic progression of length m.
        There the sumset size is a theorem (at most 3m-2 for three-fold sumset of an AP, restricted to
        distinct triples it is still an interval-like set). The instrument must report a gap outside 0.25
        against the random-bijection null on that AP, or the instrument cannot see non-generic structure
        and the curve result is void.
    proof_obligations:
    - claim: The n=7 hit set is independent of which correct addition routine is used.
      responsibility: correctness
    - claim: p_occ equals 1-(1-1/r)^M for the random-throw expectation.
      responsibility: baseline
    - claim: The AP control on Z/rZ exits the match band.
      responsibility: strictness
    - claim: No runtime or memory exponent is inferred.
      responsibility: scope
    not_applicable_reason: Empirical measurement. method_ceiling is the decision the test can certify.
      The other blocks are pre-registered checks of that measurement, not a proof that elliptic sumsets
      are uniform.
  predictions:
  - metric: abs_relative_gap_cov_curve_vs_cov_cyclic
    direction: lower
    minimum_effect: 0.25
  - metric: ap_control_exits_match_band
    direction: higher
    minimum_effect: 1
  minimal_test:
    design: 'At n=7 use the frozen parameters from H-KIC-9416d9. At n=11 use the same a=1 Koblitz equation
      and a recorded irreducible of degree 11, enumerate #E and the prime-order subgroup, and write both
      orders into the output before computing coverage. For m in {8,12} at n=7 and m in {12,16} at n=11,
      build the lexicographic B and one seeded random B. Compute the unordered distinct triple sumset
      by a pair table: store all pair sums, probe the third point. Do the same under one frozen random
      bijection to Z/rZ and under one draw of M uniform random elements. Run the arithmetic-progression
      control in Z/rZ. Compare coverages. Do not retune m after seeing the gap.'
    controls:
    - 'Identity: curve law, two addition implementations.'
    - 'Random-label: M independent uniform subgroup elements, coverage versus p_occ.'
    - 'Relabelled Z/rZ: one frozen bijection, same B-labels, cyclic addition.'
    - 'Nearby-object: arithmetic progression of length m in Z/rZ, which must exit the band.'
    - 'Duplicate-orbit control: multiplicities retained, not collapsed before the digest is stored.'
    required_metrics:
    - 'r, #E, m, M, at each scale'
    - cov_curve, cov_cyclic, cov_random_label, p_occ
    - abs relative gap |cov_curve-cov_cyclic|/max(cov_cyclic, 1/r)
    - mean and maximum S_3-orbit multiplicity per hit
    - L = log2(mean multiplicity)
    - AP-control coverage and its gap
    - hit-set digest per law
  falsification_conditions:
  - At either n=7 or n=11, for the lexicographic B at either pre-registered m, the absolute relative gap
    between cov_curve and cov_cyclic exceeds 0.25. Explanation G is then false at that cell.
  - The arithmetic-progression control remains inside the band [0.75, 1.25]. The instrument cannot see
    a structured sumset, and every curve conclusion from this run is void.
  - The two curve addition routines disagree on the n=7 hit set. The run is invalid.
  - Mean multiplicity is 1 and the gap is inside the band. Then L=0 and the sum map on orbits is not lossy;
    the generic-yield reading may still be reported, but it must not be described as a lossy projection
    finding.
  confounders:
  - A bijection redrawn until the gap is small manufactures explanation G. One bijection is frozen from
    a seed written before the curve coverage is computed. A second bijection is a sensitivity row, not
    a replacement.
  - 'Including or excluding the identity changes cov by 1/r. The rule is frozen: identity is included
    in the denominator and is a legal sum.'
  - Lexicographic B can correlate with x-coordinate size. The seeded random B of equal size is reported
    beside it. A gap that appears for only one of them is not a property of every set of size m.
  - 'n=11 group order computed incorrectly shifts r and p_occ together. The order is checked by #E = cofactor
    * r and by a random-point order test.'
  interpretation_limits:
  - The explicit point set is inside the scoped-out enumerated class of KN-OPEN-020. This idea does not
    propose a new factor base and stops there. Yield is a property of the set, not of an encoding. That
    restates the question's own constraint and does not extend it.
  - A match at n=7 and n=11 is not genericity at cryptographic size and is not a closure of co-design.
  - A mismatch is not an attack and is not a subexponential claim. KR-IC-889857 is not invoked.
  - No time exponent and no memory exponent moves. rho remains the ECDLP algorithm.
  heuristic_assumptions:
  - id: H1
    statement: 'Let throws be independent and uniform in a set of size r. Then the expected fraction of
      elements hit by M throws equals p_occ = 1-(1-1/r)^M. Heuristic, stated separately from that theorem:
      the curve''s triple-sum coverage at the tested (n,m) lies within a relative gap 0.25 of the coverage
      of the relabelled cyclic law. The proposal does not assume the heuristic in order to run; the test
      decides it.'
    rigorous_support: The identity E[coverage] = p_occ is the classical occupancy theorem for independent
      uniform throws (Feller). Cauchy-Davenport and other Z/p sumset theorems are not claimed for the
      elliptic subgroup; the program's own translation-rigidity results say a prime-order subgroup does
      not inherit a nontrivial sum-compatible quotient. No elliptic sumset theorem is cited as support.
    validation_plan: 'Sample: exhaustive triple sumsets at n=7, r=71, m in {8,12}, and at n=11 with r
      computed in-test, m in {12,16}, lexicographic B and one seeded random B. Comparison distribution:
      p_occ, the relabelled Z/rZ coverage, and one random-label coverage of M uniform elements. Tail check:
      the maximum multiplicity against the Poisson tail of mean M/r (the probability of a bin at least
      k under that mean, compared with the observed max). Tested parameters are exactly those (n,m). Transfer
      assumptions: none to n>11, none to m growing with r, none from the random subset to a co-designed
      algebraic base. The AP control is the check that a structured sumset is visible.'
  target_complexity:
    time_exponent: Unchanged at 1/2 versus Pollard rho. Coverage enumeration is Theta(m^2 + r) with a
      pair table and is a measurement, not an ECDLP algorithm.
    memory_exponent: The pair table is Theta(m^2) field elements. rho's distinguished-point memory is
      polylogarithmic in r. This measurement does not compete with rho.
    best_known: Pollard rho, time exponent 1/2, binary-curve S about 1.25 as named in the task brief,
      not re-derived here. The measurement baseline is exhaustive coverage, which is exact at these r.
    hidden_overhead: None asymptotic. Charged costs inside the measurement are pair-table build and the
      cyclic bijection, and they are not an attack cost.
    tradeoff_note: Not a time-memory tradeoff against rho. The pair table can be replaced by sorting M
      sums when M is smaller than r; both are exact and the test may use either, declared before the run.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: Pollard rho for every ECDLP cost axis (time exponent 1/2, distinguished-point memory).
    This record claims no ECDLP result, so the dominating algorithm for the discrete log is unchanged.
    The 24 KR-IC rows at the named commit were checked; a coverage measurement is not dominated as a theorem
    by those rows because it claims no algorithm, and it is dominated as an attack by rho. KR-IC-889857
    is disputed and is not used as a better algorithm.
  sota_delta: 'Time exponent versus rho: 1/2 versus 1/2, delta 0. Memory exponent versus distinguished-point
    rho: no attack memory is proposed, delta 0 on the ECDLP. The predicted coverage gap is a relative
    difference at most 0.25 against the cyclic null, which is not a speedup.'
