  assumptions:
    - The six maps are (x, y) -> (ω^k x, s y) for k in {0, 1, 2} and s in {1, -1}, with ω = 9 in F_13.
    - A point is on E when y^2 - x^3 - 1 = 0 in F_13. The point at infinity is not in either set.
    - The identity control uses only k = 0 and s = 1.
    - No discrete logarithm is computed. No rho walk is run.
