idea:
  id: IDEA-20261006-e08291
  question_id: RQ-EWALK-8fa147
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Automorphism orbit sizes of (2, 3) and (0, 1) on y^2 = x^3 + 1 over F_13
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + 1 over F_13, and let ω = 9, the root of
    t^2 + t + 1 in F_13. The set of points (ω^k * 2, ±3) for k = 0, 1, 2
    has 6 distinct points of E. The set of points (ω^k * 0, ±1) for
    k = 0, 1, 2 has 2 distinct points of E. A recount that returns any
    other pair of sizes is a negative. The identity map alone sends
    (2, 3) to a one-point set. This comparison is not a Pollard rho
    iteration count, and it does not change the generic exponent 1/2.
  mechanism: >-
    The maps (x, y) -> (ω^k x, ±y) preserve y^2 - x^3 because ω^3 = 1
    and (±y)^2 = y^2. On x = 2 they produce three distinct x-coordinates,
    each with two y-coordinates, so the orbit has size 6. On x = 0 the
    same maps fix the x-coordinate, so only the two signs of y survive
    and the orbit has size 2. The identity map is the nearby object on
    which size 6 is false. KR-RHO-0528e7 states that an automorphism
    group of order 6 reduces expected rho iterations by sqrt(6) and
    does not change the exponent. These two orbit sizes are not that
    iteration count.
  novelty_status: unverified
