  minimal_test:
    design: >-
      In F_13, set ω = 9. List the six images of (2, 3) and the six
      formal images of (0, 1). Discard duplicates. Check each surviving
      point against y^2 = x^3 + 1. Report both sizes and the identity
      size. Do not run a random walk.
    controls:
      - The identity map on (2, 3) returns the one-point set {(2, 3)}. Any other identity size voids the run.
      - Each reported point satisfies y^2 - x^3 - 1 = 0. A point that fails the equation voids the run.
    required_metrics:
      - orbit size of (2, 3)
      - orbit size of (0, 1)
      - identity size
      - count of points that fail the curve equation, required to be 0
  falsification_conditions:
    - Both lists are built and the sizes are not 6 and 2.
    - A listed point fails the curve equation. That voids the run and is not a mathematical negative.
  confounders:
    - Counting the point at infinity, or using a different cube root of unity, changes the set.
    - KR-RHO-0528e7 states the sqrt(6) iteration factor. It does not state these two orbit sizes at p = 13.
    - A rho walk that quotients by the automorphism group is a different measurement.
  interpretation_limits:
    - Two orbit sizes at p = 13 do not measure a rho speedup and do not move the exponent 1/2.
    - The sqrt(6) factor in KR-RHO-0528e7 is not recomputed here.
    - KR-RHO-fb88e6's fruitless-cycle probability is not estimated here. Walk steps performed: 0.
    - A result at p = 13 does not transfer to a cryptographic prime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If the six images of a uniform random point of E were drawn
        independently, collisions would be rare and the orbit size
        would be 6. The point (0, 1) is not uniform for this purpose:
        its x-coordinate is fixed by multiplication by ω. The
        exhaustive list is the test. The independence model is the
        null, not a theorem about automorphisms.
      rigorous_support: >-
        The maps are checked by substituting ω^3 = 1 into y^2 - x^3.
        KR-RHO-0528e7 is the separate statement that the iteration
        factor is sqrt(m). This heuristic does not replace that
        statement. No distribution theorem is invoked beyond counting
        a 6-element list.
      validation_plan:
        sampling: >-
          Exhaustive list of 6 formal images for each of two named
          points. No random sample.
        comparison: >-
          Distinct on-curve images against the integers 6 and 2.
        tail_check: >-
          Repeat the same maps at p = 19 on the point (2, 3) if it
          lies on y^2 = x^3 + 1 there, and on (0, 1). Record the two
          sizes. They do not change the p = 13 assignment. If (2, 3)
          is not on the curve at p = 19, record that and do not
          substitute a different point after seeing the sizes.
        parameters: >-
          p = 13 for the claim. p = 19 for the sign-style scope check
          only. Curve y^2 = x^3 + 1. ω the root of t^2 + t + 1 that
          is 9 at p = 13.
