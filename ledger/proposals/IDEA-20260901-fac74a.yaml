idea:
  id: IDEA-20260901-fac74a
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    THE EXCEPTIONAL BOUNDARY, CONSTRUCTED RATHER THAN SEARCHED FOR - the CM
    equation makes H-PAIR-27e16a's 'full rational N-torsion' exception
    deterministically constructible on j = 0: take t = 2 + N t', v = N v',
    p = (t^2 + 3 v^2) / 4 prime, and the j = 0 curve of trace t has
    E[N] contained in E(F_p), N^2 dividing #E, k = 1, and the automorphism
    zeta as a GENUINE distortion map on every non-eigen point; its descending
    N-isogenous neighbour E_1 (End of conductor N) at the SAME (p, N) has
    CYCLIC rational N-torsion inside a rational Z/N^2, no distortion map, and
    a TRIVIAL Tate self-pairing despite k = 1 because the order-N point is
    N-divisible. One isogeny class thereby exhibits both edges of the lane's
    three closures at once - 'the exception is full rational torsion, not
    k = 1' (464ff8) and 'k = 1 is necessary but exact divisibility is the
    other half' (713241) - as measurable facts on two curves at one p.
  class: control

  claim: >-
    Setting: D_0 = -3, O_K = Z[zeta_3], N an odd prime >= 5, t', v' integers
    with t' = v' mod 2 and N not dividing v'.

    (X1) THE CONSTRUCTION, exact. Put t = 2 + N t', v = N v',
    p = (t^2 + 3 v^2) / 4. If p is prime then p = 1 mod 3 (so j = 0 curves
    over F_p are ordinary with End = O_K), and among the six twists of
    y^2 = x^3 + b over F_p exactly one has trace t. Call it E. Then:
    #E(F_p) = p + 1 - t = N^2 (t'^2 + 3 v'^2) / 4, so N^2 | #E, with N^2
    exactly dividing when N does not divide (t'^2 + 3 v'^2) / 4;
    p - 1 = N t' + N^2 (t'^2 + 3 v'^2) / 4, so p = 1 mod N and k = 1;
    and (pi - 1) / N = (t' + v' sqrt(-3)) / 2 lies in O_K = End(E), so pi
    acts as the identity on E[N] and E[N] is contained in E(F_p). This is
    exactly the configuration H-PAIR-27e16a and IDEA-20260807-464ff8 (C)
    identify as the unique exception to the scalar-action argument, and
    which 27e16a's outcome 3 feared might be unconstructible in budget.

    (X2) THE DISTORTION MAP EXISTS THERE, exact. zeta: (x, y) -> (omega x, y)
    acts on E[N] = Z/N + Z/N with two distinct eigenvalues lambda_1,
    lambda_2 (the roots of L^2 + L + 1 mod N, distinct since N != 3). For
    P = P_1 + P_2 with P_i non-zero in the two eigenlines, zeta(P) is not in
    <P>, and e_N(P, zeta(P)) = e_N(P_1, P_2)^{lambda_2 - lambda_1}, a
    primitive N-th root of unity. For P in an eigenline, e_N(P, zeta(P)) = 1.
    So the 'CM distortion map' the RQ asks about exists on exactly this
    family and on exactly the non-eigen points - where the ECDLP is already
    MOV-broken at k = 1 into F_p^*.

    (X3) THE NEARBY OBJECT AT THE SAME (p, N), exact. Z[pi] has conductor
    N v' in O_K, so the N-volcano of the class has depth at least 1 and the
    curve E_1 = E / C for a suitable order-N subgroup C of E[N] has
    End(E_1) = Z + N O_K. Since (pi - 1) / N = (t' + v' sqrt(-3)) / 2 is NOT
    in Z + N O_K when N does not divide v', E_1[N] is not fully rational:
    E_1(F_p)[N] is cyclic of order N while #E_1 = #E is divisible by N^2, so
    the N-primary part of E_1(F_p) contains a rational point R of order N^2
    and the order-N rational point P_1 = [N] R is N-DIVISIBLE. Consequences
    on E_1: every endomorphism acts on the cyclic rational N-torsion as a
    scalar (H-ENDO-001) and no distortion map exists (27e16a's mechanism);
    the reduced Tate self-pairing t(P_1, P_1) is TRIVIAL although k = 1,
    because the class of P_1 in E_1(F_p) / N E_1(F_p) is zero; and the
    classical transfer still runs with the SECOND point R, since t(P_1, R) is
    non-degenerate. This is the Jordan-block case of 27e16a with N^2 | #E,
    and it shows that H-PAIR-713241's k = 1 non-degeneracy needs its exact
    divisibility hypothesis and not merely k = 1.

    (X4) WHAT THE PAIR (E, E_1) DECIDES. Three lane records make claims whose
    edges are stated but not exhibited: 464ff8/27e16a ('the exception is
    full rational N-torsion, not k = 1'), 713241 ('t(P, P) primitive at k = 1
    when N exactly divides #E'), and IDEA-20260901-2d3f07 (C5) ('the family
    distinction reappears at rank 4 on full rational torsion'). The pair
    realises all three edges at one (p, N), one field, one isogeny class,
    with the only difference being the volcano level, so the load-bearing
    hypotheses are separated from each other by construction.

  mechanism: >-
    THE TRACKED OBJECT is the volcano level of the curve at the prime N of
    the cryptographic subgroup - the N-adic valuation of the conductor of
    End(E) - carried across the descending N-isogeny. It discards the curve
    equation, the points and the isogeny, retains one integer, and is exactly
    compatible with N-isogenies (it changes by exactly one per step in a
    known direction), so it propagates deterministically. It is genuinely
    lossy and is not a change of coordinates. The point of the record is that
    THIS integer, and not k, decides whether the one-point self-pairing and
    the distortion map exist.

    WHY THE CM EQUATION IS THE CONSTRUCTION. Full rational N-torsion is
    (pi - 1) / N in End(E). On j = 0 the ring End(E) is the maximal order
    Z[zeta_3] with no freedom, so the condition is purely on pi: N | t - 2 and
    N | v. The CM equation 4p = t^2 + 3 v^2 then parametrises every such p by
    (t', v'), and primality of p is the only search. Without CM one would
    search random curves for N^2 | #E and N | p - 1 jointly, which is what
    27e16a's outcome 3 worried about. The descending isogeny to E_1 is a
    Velu computation with an explicit kernel, since E[N] is rational and its
    N + 1 order-N subgroups are all rational.

    STAGE 0 (zero compute, hard gate). Verify (X1)'s three identities
    symbolically and check the parity condition; verify (X3)'s membership
    computation in Z + N O_K.

    STAGE 1 (construction, minutes to hours). For N in a declared ladder
    (2^8 to 2^12) and |t'|, |v'| <= 60 with t' = v' mod 2 and N not dividing
    v', list primes p = (t^2 + 3 v^2) / 4 below 2^32; for each, find the
    twist of y^2 = x^3 + b with trace t by exact point counting on the six
    twists; certify #E = N^2 (t'^2 + 3 v'^2) / 4.

    STAGE 2 (the exceptional curve, hours). Exhibit two independent
    N-torsion points (Weil pairing primitive - the e7eb5d instrument, gate
    G1-G2); compute the eigenlines of zeta; measure e_N(P, zeta(P)) on
    eigen and non-eigen points; run the k = 1 transfer on a non-eigen
    subgroup and certify [x]P = Q on the curve.

    STAGE 3 (the neighbour, hours). Compute E_1 = E / C by Velu for an
    order-N subgroup C chosen so that End(E_1) has conductor N (check by
    counting rational N-isogenies from E_1: a floor vertex has exactly one);
    verify #E_1 = #E; exhibit R of order N^2 and P_1 = [N] R; verify
    E_1(F_p)[N] is cyclic; compute t(P_1, P_1), predicted 1, and t(P_1, R),
    predicted primitive; verify no distortion: for the endomorphism
    N . zeta of E_1 (or any element of Z + N O_K evaluated via the isogeny),
    the image of P_1 lies in <P_1>.

    STAGE 4 (nulls). Trace-two random-D_0 curves with N exactly dividing
    #E (k = 1, N | D_0 by IDEA-20260901-8f7ca2 (A)): cyclic N-torsion,
    t(P, P) PRIMITIVE - the 713241 positive - which separates 'N-divisible
    P' from 'k = 1' as the reason for triviality on E_1. Matched random
    curves at the same p with k > 1: everything trivial, the forced null.

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE THIS SESSION (':memory:', empty index);
      search_knowledge was NOT called. Direct reading 2026-09-01 of the 13
      RQ-PAIR-21313f proposals (full reads of df5984, e7eb5d, 5f24d7, 40aab9;
      claim sections of the rest), H-PAIR-27e16a (in full, including its
      exceptional_search_condition and outcome 3), H-PAIR-713241 (in full),
      IDEA-20260829-920b16 (claim section, the automorphism self-pairing
      level meter), KN-FIND-009, DECOMPOSITION.md. Greps over ledger/,
      knowledge/, ideas/ for 'full rational', 'N^2 | #E', 'Jordan block',
      'exceptional', 'distortion map'. No web source was opened.
    results: >-
      H-PAIR-27e16a asks for exactly this exceptional curve and records that
      it may be unconstructible in budget; its test_boundary gives the
      condition N | p - 1 and N^2 | #E but no construction. IDEA-20260807-e7eb5d
      plants k = 1 positives via trace-two curves (exact divisibility), not
      full rational torsion. IDEA-20260829-920b16 uses automorphism
      self-pairings on ell^k-torsion as a volcano level meter for ell not
      equal to N and is the nearest object-level relative; it does not
      construct the N-level exception or the E_1 neighbour. IDEA-20260808-40aab9
      lists 'curves constructed to have k = 1 via CM' as a planted positive
      for its rank test but does not construct full rational torsion or the
      descending neighbour. No record contains (X1)'s parametrisation, (X3),
      or the trivial-Tate-self-pairing-at-k = 1 observation.
    verdict: >-
      UNVERIFIED. The construction is elementary CM-method arithmetic and
      curves with rational full N-torsion at k = 1 appear in the
      pairing-friendly literature (RECALLED: Koblitz-Menezes on k = 1 curves)
      in some form; no source was opened. The record's value is that it
      discharges a stated contingency of an existing hypothesis and exhibits
      three closures' edges at once, not novelty.

