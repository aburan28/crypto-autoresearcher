      verified_by: null

  assumptions:
    - >-
      D_0 = -3 and End(E) = Z[zeta_3] for every j = 0 curve over F_p with
      p = 1 mod 3 (the maximal order; textbook, not transcribed here). The
      same construction works for j = 1728 with 4p = t^2 + 4 v^2 and is left
      as the second family.
    - >-
      N odd prime >= 5, so that N does not divide D_0 and the eigenvalues of
      zeta on E[N] are distinct.
    - >-
      N does not divide v', so the N-volcano has depth exactly 1 and E_1 is
      its floor; deeper volcanoes (N | v') give more levels and are excluded
      here to keep the pair clean.
    - >-
      Toy scale: p <= 2^32, N <= 2^12; nothing extrapolates, and the ECDLP on
      every curve built here is MOV-broken by design.

  resource_label: >-
    R7 (pairings into F_{p^k}, here F_p since k = 1) composed with R3 (the
    conductor of End(E)) and R4 (one step in the N-isogeny graph). The record
    consumes them only to build controls; it mounts nothing.
  admissibility: admissible
  admissibility_argument: >-
    An instrument-and-control record is admissible by construction; it
    asserts nothing about the ECDLP on curves of interest. It is recorded so
    the campaign's resource table shows the exception cell as EXHIBITED
    rather than asserted.

  proof_search_map:
    bottleneck: >-
      Membership of (pi - 1) / N in End(E). On E it is in O_K by (X1); on E_1
      it is not in Z + N O_K by (X3). Everything else is substitution and
      point counting.
    baseline_embedding:
      parameter_slice: >-
        The trace-two random-D_0 curve with N exactly dividing #E: k = 1,
        cyclic N-torsion, t(P, P) primitive - H-PAIR-713241's k = 1 positive
        and IDEA-20260807-e7eb5d's gate G4, reproduced as Stage 4's first
        control.
      reproduction_check: >-
        Frozen fixture: one such curve with t(P, P) of exact order N and a
        certified F_p-DLP transfer.
    observation_collision:
      observable: >-
        The triple (k, rank of E(F_p)[N], whether t(P, P) = 1).
      distinct_preimage_search: >-
        REQUIRED and the point of the record: E and E_1 share (p, N, k = 1,
        #E) and differ in rank of rational N-torsion and in t(P, P). The
        observable separates them; k alone does not, which is exactly the
        collision that shows k = 1 is not the load-bearing condition.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold (p, N, k) fixed, vary the volcano level by one N-isogeny, and
          observe the distortion map and the Tate self-pairing switch off.
        predicted_gain: >-
          Exhibits the edges of three closures constructively in one class.
      - transform: specialization_pack
        proposed_object: >-
          Specialise the exceptional condition to the CM family where End is
          forced maximal, so the condition becomes a two-parameter integer
          family and primality is the only search.
        predicted_gain: >-
          Turns 'may be unconstructible in budget' into minutes.
    quantifier_order: >-
      (X1): FOR ALL odd primes N >= 5 and integers t', v' with t' = v' mod 2
      and p = ((2 + N t')^2 + 3 N^2 v'^2) / 4 prime, THERE EXISTS a j = 0
      curve E over F_p with E[N] contained in E(F_p), N^2 | #E, k = 1.
      (X3): under the same hypotheses with N not dividing v', THERE EXISTS an
      N-isogenous E_1 with cyclic rational N-torsion and t(P_1, P_1) = 1.
      NOT CLAIMED: anything about curves with N exactly dividing #E, or about
      any curve of cryptographic interest.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The exceptional configuration of H-PAIR-27e16a is constructible on
        j = 0 for every odd N >= 5 by the CM equation, the distortion map
        exists exactly there and only on non-eigen points, and its
        N-isogenous floor neighbour at the same (p, N) has no distortion map
        and a trivial Tate self-pairing despite k = 1.' It certifies nothing
        about ECDLP hardness anywhere.
      nearby_object_control: >-
        The trace-two random-D_0 curve (k = 1, exact divisibility, primitive
        t(P, P)), where the Tate self-pairing conclusion of 713241 HOLDS and
        must be seen to hold, so that E_1's trivial self-pairing is
        attributed to N-divisibility and not to k.
    proof_obligations:
      - claim: The three identities of (X1) hold and p = 1 mod 3 whenever p is prime.
        responsibility: correctness
      - claim: (pi - 1) / N lies in O_K and not in Z + N O_K when N does not divide v'.
        responsibility: correctness
      - claim: e_N(P, zeta(P)) is primitive for non-eigen P and trivial for eigen P.
        responsibility: correctness
      - claim: On E_1 the order-N rational point is N-divisible and t(P_1, P_1) = 1 while t(P_1, R) is primitive.
        responsibility: strictness
      - claim: The trace-two control shows a primitive t(P, P).
        responsibility: baseline
      - claim: Every certificate is verified on the curve independently of the solver.
        responsibility: scope

  object_first_candidate:
    tracked_object: >-
      The N-adic valuation of the conductor of End(E), i.e. the level of E in
      its N-volcano, carried across one descending N-isogeny.
    lossiness: >-
      Lossy - one integer retained from the whole curve; not a change of
      coordinates.
    propagation: >-
      Deterministic under N-isogenies (changes by exactly one, direction
      known from the kernel), which is the only operation applied.
    survival_score: >-
      Survives the whole volcano; the record uses two adjacent levels only.

  null_object_control: >-
    NULL-1 (blocking): matched random curves at the same p with k > 1 -
    every self-pairing trivial, no distortion map; the forced null of
    IDEA-20260807-e7eb5d gate G6. POSITIVE CONTROL A (blocking): the
    trace-two random-D_0 curve with N exactly dividing #E - k = 1, primitive
    t(P, P), transfer certified; separates N-divisibility from k as the cause
    of E_1's trivial self-pairing. POSITIVE CONTROL B (blocking): the
    supersingular distortion map of e7eb5d gate G3, proving the instrument
    can see a distortion map before (X2) is believed. DECAY PARAMETER: the
    volcano level - descending one more step (when N | v' is allowed in a
    second ladder) must keep the distortion map off and the self-pairing
    trivial; an effect that reappears at depth 2 is an artifact.
    BROKEN-INSTRUMENT COPY (blocking): the final-exponentiation-free copy
    must fail the mu_N check on E_1's values.

  discriminated_from:
    - >-
      H-PAIR-27e16a. That hypothesis names the exceptional configuration and
      caps its closure at 'no counterexample found' if the configuration
      cannot be built. This record builds it deterministically via the CM
      equation and adds the floor neighbour; the exact delta is (X1) and
      (X3).
    - >-
      H-PAIR-713241. That record proves t(P, P) primitive at k = 1 under
      exact divisibility. This record exhibits a k = 1 curve (E_1) on which
      t(P, P) = 1 because the hypothesis fails, showing the hypothesis is
      load-bearing; it does not contradict 713241.
    - >-
      IDEA-20260807-464ff8. That record states the exception is full
      rational torsion, not k = 1. This record exhibits the two cases side by
      side at one (p, N).
    - >-
      IDEA-20260807-e7eb5d. That instrument plants k = 1 positives on
      trace-two curves; this record supplies a different positive (full
      rational torsion with a genuine distortion map) that e7eb5d's gates do
      not include, and uses e7eb5d to measure it.
    - >-
      IDEA-20260829-920b16. That record reads volcano level from automorphism
      self-pairings at ell not equal to N on special-j classes. This record
      is at ell = N, the subgroup prime itself, and reads the distortion map
      and the Tate self-pairing, not the level; the shared object is the
      level, the measured quantities differ.
    - >-
      IDEA-20260901-2d3f07 and IDEA-20260901-8f7ca2. This record is the
      nearby-object supplier for both: the rank-4 curve for 2d3f07 (C5) and
      the 'k = 1 with N split and N^2 | #E' object for 8f7ca2's positive
      control B.

  predictions:
    - metric: >-
        M1 - fraction of constructed (N, t', v') cells with p prime for which
        the trace-t twist has #E = N^2 (t'^2 + 3 v'^2) / 4 and two independent
        rational N-torsion points
      direction: higher
      minimum_effect: 100 percent, no tolerance.
    - metric: >-
        M2 - on E, the order of e_N(P, zeta(P)) for non-eigen P versus eigen P
      direction: different
      minimum_effect: >-
        EXACTLY N on 100 percent of non-eigen points and EXACTLY 1 on 100
        percent of eigen points, over at least 200 sampled points per curve.
    - metric: >-
        M3 - on E_1, the order of t(P_1, P_1) and of t(P_1, R)
      direction: different
      minimum_effect: >-
        EXACTLY 1 and EXACTLY N respectively, on 100 percent of cells, with
        R-invariance over 20 auxiliary divisors per value.
    - metric: >-
        M4 - on the trace-two control, the order of t(P, P)
      direction: higher
      minimum_effect: EXACTLY N; otherwise the instrument cannot see the k = 1 positive and M3 is void.
    - metric: >-
        M5 - number of rational N-isogenies from E and from E_1
      direction: different
      minimum_effect: >-
        N + 1 from E (all order-N subgroups rational) and EXACTLY 1 from E_1
        (floor), on every cell; a different count means E_1 is not at the
        floor and (X3) has not been reached.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate): (X1) and (X3) checked symbolically.
      STAGE 1 (minutes): the (N, t', v') search at N in {2^8, 2^10, 2^12},
      |t'|, |v'| <= 60, p <= 2^32; at least 5 cells per N. STAGE 2 (hours): M1
      and M2 on E with the e7eb5d instrument. STAGE 3 (hours): Velu descent
      to E_1, M5, M3. STAGE 4 (hours): the controls, M4, the broken copy.
      THE CHEAPEST DECISIVE STEP IS M1 PLUS M5 at one N: point counting and
      isogeny counting, no pairing code, and they already show the two
      curves differ in the rank of rational N-torsion at the same (p, N).
    controls:
      - NULL-1 matched random curves at the same p with k > 1 (blocking)
      - POSITIVE CONTROL A, trace-two curve with primitive t(P, P) (blocking)
      - POSITIVE CONTROL B, supersingular distortion map (blocking)
      - broken-instrument copy failing the mu_N check (blocking)
      - R-invariance sweep over 20 auxiliary divisors per value
      - Pollard rho with distinguished points and BSGS on every constructed instance as the mandatory matched baselines, automorphism-discounted rho on the j = 0 curve (KN-TECH-006, KN-TECH-018, KN-TECH-031); they calibrate and do not move
      - exclusion of the anomalous case per KN-TECH-034 (t = 1 is never produced by the construction and is checked anyway)
    required_metrics:
      - per cell N, t', v', p, the group order, the twist index and its trace
      - per curve the rank of rational N-torsion and the count of rational N-isogenies
      - per pairing value its order, its mu_N membership, the auxiliary divisor
      - certificate pass or fail per transfer
      - pass or fail of every control
      - wall-clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. A cell with p prime whose trace-t twist lacks two independent
      rational N-torsion points. (X1) is wrong or the twist selection is;
      the record stops.
    - >-
      F2. A non-eigen point with trivial e_N(P, zeta(P)) or an eigen point
      with a non-trivial one, surviving the instrument controls. (X2) is
      wrong.
    - >-
      F3. E_1 with rank-2 rational N-torsion, or with t(P_1, P_1) non-trivial
      while the trace-two control is primitive. (X3) is wrong.
    - >-
      F4. The trace-two control returning a trivial t(P, P). Instrument
      failure under AGENTS.md rule 5; nothing is reported.
    - >-
      F5. No prime p found in the search box. Infrastructure or density
      outcome (H1); the box is widened and the record is reported as unbuilt
      at that N, never as evidence.

  confounders:
    - >-
      Twist selection. Six twists share j = 0; picking the wrong one gives a
      curve with the wrong trace and none of the properties. The trace must
      be certified by exact point counting, not by [#E] R = O alone.
    - >-
      Eigen versus non-eigen points. Sampling 'random' N-torsion points that
      happen to lie in an eigenline gives a trivial pairing that looks like a
      refutation of (X2); the eigenline test must precede every M2 value.
    - >-
      N-divisibility on E_1. The trivial self-pairing is caused by P_1 being
      N-divisible, not by k; POSITIVE CONTROL A exists so this attribution is
      measured rather than argued.
    - >-
      Reading E as a vulnerability. Every curve here is MOV-broken by design
      and of no cryptographic interest; every report must say so.

  interpretation_limits:
    - >-
      A control record. It establishes nothing about the ECDLP on any curve
      of interest, moves no exponent, and exists to make three closures'
      edges visible.
    - >-
