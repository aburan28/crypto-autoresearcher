      statement: >-
        RANDOM-FUNCTION IDEALISATION PER VARIATION. For a fixed instance and
        each of the three variations (gauge, multiplier seed, start point),
        the charged collision time T satisfies T/sqrt(N) -> Rayleigh(1) in
