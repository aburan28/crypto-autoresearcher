  confounders:
    - >-
      RESIDUE-CLASS IMBALANCE. Since p is not a multiple of r, the residues
      mod r are unequally represented in [0, p) by at most one element each;
      the null's expected cell count must use the exact residue frequencies,
      not N/r^2, or a spurious excess of order r/p appears.
    - >-
      NEGATION. x(R) = x(-R), so A_M and A_{-M} are related; offsets M and -M
      must not both be counted as independent replicates.
    - >-
      GAUGE ORBIT SIZE ON CM CELLS. (p-1)/6 or (p-1)/4 distinct models; the 48
      draws must be distinct models, checked by j and by the u^{|Aut|}
      coset.
    - >-
      FLOYD VERSUS DISTINGUISHED POINTS. The harness's cycle detection adds a
      deterministic overhead to T that is the same across variations; ratios
      cancel it, absolute sd values do not fully, which is why the band is
      20 percent.
    - >-
      READING A_M NULL AS WALK RANDOMNESS. Pair-level randomness is
      necessary, not sufficient; STAGE 2 exists because of this gap and the
      record does not infer walk randomness from M1 alone.

