idea:
  id: IDEA-20260901-753636
  question_id: RQ-ECDLP-165d4b
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-165d4b has no bound GOAL record at filing time (context file for
    TASK-20260901-da5e05). Left null deliberately.
  added: '2026-09-01'
  title: >-
    PLAIN RHO SEES THE CURVE THROUGH EXACTLY ONE APERTURE -- THE PARTITION
    h(R) = x(R) mod r -- AND THE ISOMORPHISM ORBIT OF AN INSTANCE IS THE
    UNIQUE NULL OBJECT THAT VARIES THAT APERTURE WHILE HOLDING EVERYTHING ELSE
    FIXED: decompose the dispersion of charged rho work on ONE instance into
    its gauge (u), multiplier-seed and start-point components, measure the
    partition-transition matrix A_M[i][j] = #{R : h(R)=i, h(R+M)=j} against
    its random-label null with decay in p and in r, and thereby give
    IDEA-20260830-a22049's unproved residual ("a curve-level effect entering
    through the walk's function graph rather than its step cost") both a
    mechanism and a floor
  class: measurement

  claim: >-
    (A) THE APERTURE, READ OFF THE INSTRUMENT. harness/rho.py implements a
    Teske r-adding walk whose branch is s = x(R) mod branches (32) and whose
    step is R -> R + T_s. The step is (a, b)-free (IDEA-20260830-a22049, exact
    algebra). Therefore the ONLY place the curve equation, the model, or any
    curve-level invariant can enter the walk's function graph is the integer
    x(R) read modulo r. Every curve-level effect on plain rho work -- whatever
    j, End(E), the conductor, or the class is -- must pass through the joint
    behaviour of h(R) and h(R + M) along the walk. That is a statement about
    the code plus one line of algebra, not a heuristic.

    (B) THE TRACKED OBJECT. For a fixed offset M in G define the
    partition-transition matrix
        A_M[i][j] = #{ R in G : h(R) = i, h(R + M) = j },  0 <= i, j < r.
    It is a lossy projection of the addition table (it keeps r^2 counts out
    of N rows), and what it discards is discarded compatibly with translation
    by M (the count propagates deterministically: it is a count). Under the
    random-function idealisation that underwrites the 0.886 constant
    (KN-TECH-006) every entry is Binomial(N, 1/r^2), sd sqrt(N)/r. A
    curve-level structure visible to rho is, by (A), a systematic departure
    of A_M (and its higher-order analogues along the walk) from that null.

    (C) THE RIGOROUS ANCHOR, AND WHY IT DOES NOT SETTLE THE TOY CELLS. By the
    Bombieri-Weil bound on exponential sums of rational functions over the
    points of E (the function alpha*x(R) + beta*x(R+M) has bounded pole
    order at O and at -M), composed with Erdős–Turán–Koksma, the pairs
    (x(R), x(R+M)) are jointly equidistributed in [0,p)^2 with discrepancy
    O(p^{-1/2} log^2 p) UNIFORMLY IN E; hence
        | A_M[i][j] - N/r^2 |  <=  C * sqrt(p) * log^2 p
    for every curve, every M and every residue pair. RECALLED, not opened:
    the nearest opened source is Lange-Shparlinski 2005 (retrieved, abstract
    only), which bounds discrepancy of multiples {z_s G}, an adjacent
    statement. THE HONEST ARITHMETIC: the bound is weaker than the null's own
    sd by a factor r*log^2 p, about 32 x 200 at 16 bits. So the theorem
    guarantees only that any curve-level excess DECAYS relative to sqrt(N)/r
    as p grows; at census scale the question is empirical, which is why this
    is a measurement and not a derivation.

    (D) THE NULL OBJECT THAT NOBODY HAS USED FOR RHO. Let u in F_p^*. The
    model change (a, b, x, y) -> (u^4 a, u^6 b, u^2 x, u^3 y) is an
    F_p-isomorphism: the group G, the points as group elements, the scalar k,
    and the walk multipliers' scalars (c_s, d_s) are all UNCHANGED, and the
    only thing that changes is h, because x(R) -> u^2 x(R) mod p permutes the
    residues mod r pseudo-randomly. The ISOMORPHISM ORBIT of an instance is
    therefore the unique family that varies the aperture and nothing else.
    It is the cheapest null of exactly the census's shape (it IS a census
    curve, with the same j, f, |Aut|, N, k), and it separates three sources
    of dispersion in charged rho work that every existing record pools as
    "seed noise":
      D_u    -- gauge only (h varies; multipliers and start fixed),
      D_mult -- multiplier seed only (c_s, d_s vary; gauge and start fixed),
      D_start -- start point only.
    PREDICTION under the random-function idealisation: all three have
    sd(log T) = 0.6413 (the Rayleigh figure derived in IDEA-20260829-172151
    claim B) within finite-size tolerance, and D_u equals D_mult. The
    informative outcome is INEQUALITY: D_u below D_mult says the walk's cost
    is set by the points (multipliers, start) more than by the hash, i.e. the
    function graph is not a random function of the encoding; D_u above D_mult
    says the aperture is doing something the random model forbids.

    (E) THE DISCRIMINATION. Two mutually exclusive readings.
      READING 1 -- CONTROLLED NULL WITH A MECHANISM. A_M sits inside the
      random-label null envelope at every tested p and r, any excess decays
      with p and with r, and D_u = D_mult = D_start = 0.64 within CI. Then
      a22049's H1 ("function-graph difference is seed-level noise") is a
      MEASURED fact with a named channel and a floor, 20b05f's READING 1 has
      its mechanism, and the census records: "no curve-level structure enters
      plain rho through the partition at 16-24 bits; the residual is bounded
      by the u-orbit floor".
      READING 2 -- APERTURE EFFECT. A_M shows an excess over the null that
      does NOT decay with p (the artifact tell of docs/inventor-protocol.md
      section 3, but on an exhaustively computed object, where the usual
      sampling artifacts are absent), or D_u differs from D_mult beyond CI at
      two bit sizes. Then the partition is reading arithmetic structure of E
      -- the first R1-channel curve-level signal in this lane -- and the
      record routes it to independent review before any interpretation,
      together with the prediction that the effect should vanish under a
      keyed hash h' = H(x(R)) mod r (the decay parameter for READING 2).

    (F) WHAT IS NOT CLAIMED. No exponent, no constant-factor attack. The
    record is the aperture statement (A), the matrix (B), the bound (C), the
    null (D), and the decomposition. It corrects nothing in a22049; it
    measures the one thing a22049 names as outside its derivation.

  mechanism: >-
    STAGE 0 (zero compute, HARD GATE). Source audit of harness/rho.py: list
    every read of curve data inside the walk; assert the only one is
    s = x(R) mod branches. (a22049's STEP 3 audit covers the addition path;
    this audit covers the partition path.) Then write (C) and compute the
    bound-to-null-sd ratio at 16, 20 and 24 bits so the reader sees why the
    theorem does not close the toy cells.

    STAGE 1 (exhaustive matrices, minutes). For each census curve at 16, 20
    and 24 bits, and for each of 8 offsets M drawn from the walk's own
    multiplier set, enumerate G once (N point additions) and tabulate A_M for
    r in {8, 16, 32, 64, 128}. Compute the chi-square statistic
    X^2 = sum (A_M[i][j] - N/r^2)^2 / (N/r^2). NULL-A: replace h by a random
    labelling of G (a random function G -> Z/r) and recompute X^2, 200
    replicates; this is the random-function null of exactly the same shape.
    The elliptic X^2 is scored against the null's empirical distribution per
    (curve, M, r). Report the excess E(p, r) = X^2_elliptic / median X^2_null.

    STAGE 2 (the decomposition, hours). On 12 instances per bit size, run the
    charged rho walk under three orthogonal variations, 48 draws each: (i)
    48 gauges u drawn uniformly from F_p^* / {+-1} with multipliers and start
    fixed; (ii) 48 multiplier seeds with u = 1 and start fixed; (iii) 48 start
    points with u = 1 and multipliers fixed. Record sd(log T) per variation
    and the pairwise ratios with bootstrap CIs.

    STAGE 3 (decay). E(p, r) across the p-ladder and the r-ladder; the
    decomposition ratios across the p-ladder. A structure that does not
    decay in p is READING 2; a decomposition inequality that does not
    persist across bit sizes is an artifact.

    STAGE 4 (only under READING 2). Repeat STAGE 1 with a keyed hash h' in
    place of x mod r. The excess must vanish; if it persists under h' the
    effect is not in the aperture and STAGE 0's audit is wrong.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval UNAVAILABLE (index ':memory:', empty; not called).
      Direct reading 2026-09-01 of: the four RQ-ECDLP-165d4b proposals; the
      five H-ECDLP hypotheses (C-RELABEL, C-RAND-BASE controls);
      IDEA-20260830-a22049 in full (its u-scaling baseline check and its
      dominated_by residual); IDEA-20260901-863e36 (H2 uses a
      character-sum bound for orbit minima); EV-ICINV-6b6264 and
      EV-ICINV-343679 C-GAUGE passages; harness/rho.py lines 26-101;
      KN-TECH-006. Greps over ledger/, knowledge/, analysis/ for
      'Teske|adding walk|r-adding|partition function|Shparlinski|
      equidistribut|discrepancy' and 'isomorphism orbit|u-scaling|u\^4|u\^6|
      relabel'. External: Cambridge Core page of Lange-Shparlinski 2005
      fetched (abstract only). No source on partition-transition matrices of
      r-adding walks was opened; Teske 2001 and Bernstein-Lange's
      "two grumpy giants" style walk analyses are recalled, not opened.
    results: >-
      The gauge (u^4 a, u^6 b) exists in the corpus as C-GAUGE, used to check
      EXACT invariance of an algebraic invariant (S_3 support) in the Semaev
      lane, and as a22049's single-u operation-count check. C-RELABEL in
      H-ECDLP-63d136 is an arbitrary deterministic relabelling, not an
      isomorphism. NO record varies the gauge over its orbit to measure rho's
      dispersion, decomposes rho dispersion into gauge / multiplier / start
      components, or tabulates the partition-transition matrix against a
      random-label null. 863e36's H2 invokes a character-sum bound for a
      different object (orbit minima under a scalar action). Externally,
      Teske's walk-quality analysis is generic (any group, random hash) and
      does not address curve-level content of x mod r; absence of a search
      hit is not evidence of absence.
    verdict: >-
      UNVERIFIED. The aperture statement is a code fact plus a22049's algebra;
      the bound is recalled; the null design and the three-way decomposition
      have no located precedent in the corpus and were not searched for
      externally beyond one abstract.

