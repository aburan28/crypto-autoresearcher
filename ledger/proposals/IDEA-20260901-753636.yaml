      rigorous_support: >-
        Rigorous ingredient: the uniform discrepancy bound
        O(p^{-1/2} log^2 p) for (x(R), x(R+M)) from Bombieri-Weil plus
        Erdős–Turán–Koksma (recalled), which forces the deviation to be
