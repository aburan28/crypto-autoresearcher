  assumptions:
    - >-
      The partition is x mod r as implemented; if the harness is changed to a
      keyed hash the aperture statement changes and STAGE 0 must be re-run
      against the new commit.
    - >-
      Ordinary prime-order non-anomalous curves over F_p with declared
      embedding-degree and twist checks (RQ scope, KN-TECH-034); on CM cells
      the automorphism-discounted walk is the control and the gauge orbit
      has (p-1)/|Aut| elements rather than (p-1)/2.
    - >-
      Toy scale, 16-24 bits; G enumerable so A_M is exact, not sampled.
    - >-
      The Rayleigh sd 0.6413 is the asymptotic null; finite-size deviation is
      IDEA-20260829-34f3ed's subject and enters here only as a common offset
      shared by all three variations, which the pairwise ratios cancel.

  proof_search_map:
    bottleneck: >-
      The step "attribute a curve-level rho effect to a channel". Without
      (A) every observed spread is 'seed noise'; with (A) it must be in A_M
      or in nothing, and the u-orbit measures the floor of 'nothing'.
    baseline_embedding:
      parameter_slice: >-
        u = 1 and the random-label null: the elliptic pipeline at u = 1 is
        the harness's own walk exactly; NULL-A at r = 32 is the random
        function on which the 0.886 constant is derived. Both must
        reproduce their known statistics (mean T/sqrt(N) = 1.2533 before the
        negation discount, sd(log T) = 0.64 within 34f3ed's finite-size band).
      reproduction_check: >-
        Frozen fixture: on one 16-bit instance and one seed, the committed
        walk trace must be reproduced bit-for-bit at u = 1, and the trace at
        u = 2 must differ at the first step whose branch index changes
        (which is checkable by hand from x mod 32 versus 4x mod 32).
    observation_collision:
      observable: the excess E(p, r) and the dispersion triple (D_u, D_mult, D_start)
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: E(p, r) near 1 is produced both by
        a curve whose partition is random-like AND by a pipeline that
        computed A_M on the wrong object (e.g. on x mod r of consecutive
        multiples rather than of R and R + M). The separating condition is a
        PLANTED structure: replace h by h_planted(R) = (x(R) mod r) XOR
        (x(R + M) mod r) for one fixed M; then A_M is exactly diagonal and
        E(p, r) must blow up. A pipeline that reports E near 1 on the planted
        object is measuring nothing. BLOCKING.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The isomorphism orbit of an instance: hold the group, the points
          and k fixed, vary only the encoding aperture, and read the
          resulting dispersion of the observable.
        predicted_gain: >-
          Turns 'seed noise' into three measured components and supplies the
          exact-shape floor every within-class spread (20b05f's S(C)) must
          exceed.
      - transform: specialization_pack
        proposed_object: >-
          The excess E(p, r) as a per-cell resource measure with two decay
          parameters, so that a future 'does not decay' report in this lane
          is scored against an exhaustively computed quantity.
        predicted_gain: >-
          Makes the section-3 artifact tell operational on an object with no
          sampling noise at all.
    quantifier_order: >-
      CLAIMED (A): FOR ALL curves in scope and FOR ALL instances, the walk's
      function graph depends on the curve equation ONLY through h(x(R)) --
      exact, given the audited code. CLAIMED (C): FOR ALL E, M, i, j, the
      deviation of A_M[i][j] is bounded uniformly by C*sqrt(p)*log^2 p --
      recalled theorem. PREDICTED (not claimed): FOR ALL tested cells, E(p, r)
      within the null envelope and D_u = D_mult = D_start. EXPLICITLY NOT
      CLAIMED: anything about walks with a keyed hash, about non-rho
      functionals, or beyond 24 bits.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested curves, offsets, r and bit sizes, the
        partition-transition matrix of x mod r is inside the random-label
        null with excess E(p, r) decaying as [fitted law], and the rho
        dispersion on one instance splits as (D_u, D_mult, D_start) =
        [values] with ratios [CIs]." It can NEVER certify that no
        curve-level structure exists for other partitions, other walks, or
        larger p; and it certifies nothing about the ECDLP.
      nearby_object_control: >-
        The PLANTED partition h_planted above (must show a large excess), and
        the composite-order group with a rational 2-torsion point T2, where
        x(R + T2) is a Möbius function of x(R) and A_{T2} is provably
        structured (each x-fibre maps to one x-fibre): the instrument must
        see that structure. A method reporting E near 1 on both has not
        identified the aperture.
    proof_obligations:
      - claim: "The walk reads curve data only through x(R) mod r (code audit)."
        responsibility: feasibility
      - claim: "A_M entries deviate from N/r^2 by at most C sqrt(p) log^2 p uniformly in E."
        responsibility: correctness
      - claim: "The bound-to-null-sd ratio at toy sizes is r log^2 p, so the cells are empirical."
        responsibility: size
      - claim: "The u-orbit changes h and nothing else about the instance."
        responsibility: correctness
      - claim: "The planted partition and the 2-torsion control show large excess."
        responsibility: strictness
      - claim: "No claim beyond the tested partition, walk and sizes."
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The partition-transition matrix A_M of the aperture h = x mod r, and,
      as its null family, the isomorphism orbit {(u^4 a, u^6 b)} of a fixed
      instance.
    lossiness: >-
      A_M keeps r^2 counts of an N-row table: genuinely lossy, not
      invertible, and its discard is compatible with translation by M
      because counts propagate. The gauge projection (a, b, P, Q) -> (j, G, k)
      discards u; it is lossy and compatible with the group law since
      isomorphisms are homomorphisms. Neither is a change of coordinates.
    propagation: >-
      A_M is exact under 'translate by M'. Along a walk the relevant objects
      are the higher-order transition tensors; the record measures the pair
      level and treats a pair-level null as necessary, not sufficient, for
      walk-level randomness -- which is why STAGE 2 measures the walk
      directly.
    survival_score: >-
      The object survives the whole computation by construction; the
      question is whether its structure exceeds its null, and by how much
      that excess decays.

  null_object_control: >-
    NULL-A (blocking, primary): random labelling of G in place of x mod r,
    same N, same r, 200 replicates per cell; the elliptic X^2 is scored
    against its empirical distribution. NULL-B (blocking): the gauge orbit
    itself as the floor for the rho dispersion, compared with the multiplier
    and start variations. POSITIVE CONTROL A (blocking): the planted
    partition h_planted with diagonal A_M. POSITIVE CONTROL B: composite
    order with rational 2-torsion, where A_{T2} is provably structured.
    BSGS ROW (exact-invariance control): the harness's BSGS cost is a
    function of k and the table ordering only and must show ZERO dispersion
    over the u-orbit; any nonzero u-dispersion in BSGS is an instrument
    fault. CM CELLS: on j = 0 / j = 1728 the automorphism-discounted walk is
    the control (KN-TECH-018), the gauge orbit has (p-1)/|Aut| elements, and
    the partition must be evaluated on the orbit representative. DECAY
    PARAMETERS: p (excess must fall), r (excess must fall), and under READING
    2 the keyed hash (excess must vanish).

  discriminated_from:
    - >-
      IDEA-20260830-a22049 (nearest). It uses the gauge once, as an
      operation-count equality check, and closes the STEP-COST channel by
      algebra; it assumes (H1) and names as its residual the FUNCTION-GRAPH
      channel. EXACT DELTA: this record measures that residual, names its
      aperture (x mod r), tabulates its object (A_M), bounds it (C), and uses
      the gauge ORBIT as a dispersion floor rather than a single point as an
      equality check.
    - >-
      EV-ICINV-6b6264 / EV-ICINV-343679 C-GAUGE. There the gauge tests exact
      invariance of an algebraic invariant and can only fail if the code is
      wrong. Here the rho cost is NOT gauge-invariant (the aperture rescales)
      and the size of its gauge dispersion is the measured quantity.
    - >-
      H-ECDLP-63d136 C-RELABEL / C-RAND-BASE. An arbitrary deterministic
      relabelling and a random same-order curve. The gauge orbit is the
      finite set of relabellings that are curve isomorphisms; it keeps the
      instance inside the census's own object class and holds k fixed, which
      C-RAND-BASE cannot.
    - >-
      IDEA-20260829-172151. Measures the paired-arm correlation rho of
      log-work between C-BASE and C-NEG; this record decomposes the
      single-arm dispersion into three sources. Its 0.6413 is used here as
      the null value.
    - >-
      IDEA-20260829-34f3ed. Calibrates the finite-size BIAS of the baseline
      residual in N; this record concerns the curve-level CONTENT of the
      partition channel at fixed N and its decay in p and r.
    - >-
      IDEA-20260829-20b05f. Its seed-noise null resamples seeds on one model;
      the gauge floor is the same-instance, same-k null and is the number
      S(C) must exceed. A22049 already lowers 20b05f's information gain; this
      record supplies the mechanism its READING 1 would rest on.
    - >-
      IDEA-20260901-863e36 H2. Invokes a character-sum bound for order
      statistics of x along a scalar orbit; a different object (orbit minima)
      and a different operation group (multiplication by lambda).
    - >-
      H-ECDLP-{1853dc,63d136,63eecd,80fceb,e42bda}. Automorphism-quotient
      hypotheses; untouched, used as CM-cell controls.

  predictions:
    - metric: >-
        M1 -- excess E(p, r) = X^2_elliptic / median X^2_null per (curve, M, r)
        at 16, 20, 24 bits, r in {8,16,32,64,128}
      direction: different
      minimum_effect: >-
        READING 1: E inside the null's central 99 percent interval in at
        least 95 percent of cells at every (p, r), with any mean excess
        decreasing in p and in r. READING 2: E above the null's 99.9th
        percentile in a fixed (M-independent) pattern at two bit sizes with
        NO decrease in p. Anything else is INCONCLUSIVE.
    - metric: >-
        M2 -- the dispersion triple sd(log T) under gauge, multiplier and
        start variation, 12 instances x 48 draws per bit size
      direction: different
      minimum_effect: >-
        READING 1: all three in [0.51, 0.77] (172151's 20 percent band around
        0.6413) and pairwise ratios with CIs containing 1. A ratio
        D_u/D_mult outside [0.8, 1.25] at two bit sizes is READING 2's
        decomposition signature.
    - metric: M3 -- BSGS cost dispersion over the u-orbit
      direction: different
      minimum_effect: >-
        EXACTLY zero. Any nonzero value is an instrument fault and voids the
        run.
    - metric: M4 -- planted-partition excess
      direction: higher
      minimum_effect: >-
        E above 10 at every r; a planted excess below 3 means the instrument
        cannot see a diagonal A_M and every negative is inadmissible.
    - metric: M5 -- 2-torsion control excess on a composite-order group
      direction: higher
      minimum_effect: >-
        Above the null's 99.9th percentile at every r; the same failure rule
        as M4.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hours): the partition audit of harness/rho.py
      and the bound-to-null arithmetic. STAGE 1 (minutes): exhaustive A_M on
      12 curves x 8 offsets x 5 values of r at 16 and 20 bits with NULL-A,
      POSITIVE CONTROL A and the 2-torsion control; this alone decides M1,
      M4, M5 at two bit sizes and is the cheapest valid discriminator.
      STAGE 2 (hours): the three-way decomposition at 16 and 20 bits (12
      instances x 48 draws x 3 variations x 2 sizes = 3456 rho runs at
      <= 2^10 steps each) plus the BSGS u-orbit row. STAGE 3 (hours): the
      24-bit rungs of both stages if STAGE 1's controls pass. STAGE 4 only
      under READING 2.
    controls:
      - NULL-A random labelling of G, 200 replicates per cell (blocking)
      - NULL-B the gauge orbit as the dispersion floor (blocking)
