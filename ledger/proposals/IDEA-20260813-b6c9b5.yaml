idea:
  id: IDEA-20260813-b6c9b5
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  title: Conversion-choice fibre multiplicity and tie-break leakage
  class: mechanism
  claim: >-
    After the primary Round-3 SQIsign specification and scheme-specific sources
    are filed, test whether the real signer and a genuine simulator assign
    different probabilities to public transcript values because the
    ideal-to-isogeny conversion has secret-dependent fibre multiplicities or a
    non-equivariant tie-break rule. This is a falsifiable proposal, not a claim
    that such a difference exists.
  mechanism: >-
    For a public transcript projection y, let F_s(y) be the set of admissible
    internal conversion choices under secret ideal information s. Even when
    each admissible choice is sampled uniformly, variation in |F_s(y)|, or a
    deterministic tie-break that is not invariant under public relabellings,
    can reweight y. A true simulator that does not receive s should reproduce
    the same projected law; failure to do so would localize the discrepancy to
    conversion-choice fibres rather than to verifier acceptance alone.
  why_not_a_renamed_known_approach: >-
    IDEA-20260807-ba5eda studies verifier accept fibres and strong
    unforgeability, whereas this proposal studies pre-verification fibres of
    the ideal-to-isogeny conversion and their selection rule. IDEA-20260801-020
    is the nearest transcript-independence probe, but it does not isolate
    multiplicity from tie-breaking. IDEA-20260808-ee5d81 studies
    commitment-curve collision entropy, not the number of hidden conversion
    choices mapping to one transcript.
  predictions:
    - metric: conditional real-versus-genuine-simulator distance within equal public conversion strata
      direction: different
      minimum_effect: >-
        A preregistered nonzero separation that survives multiplicity
        reweighting, relabelling, and multiple-testing correction; no numerical
        threshold is set before primary sources are filed.
    - metric: transcript probability versus enumerated conversion-fibre multiplicity
      direction: different
      minimum_effect: >-
        A reproducible dependence in the real signer that is absent under the
        genuine simulator and the uniformized-fibre null.
    - metric: planted tie-break positive-control recovery
      direction: higher
      minimum_effect: >-
        The later analysis must detect an intentionally secret-indexed
        tie-break before a null result is interpretable.
  minimal_test:
    design: >-
      Blocked pre-design gate: first file the exact primary Round-3
      specification, signing algorithm, genuine simulator, serialization, and
      conversion subroutine for the selected scheme. Only after that gate may
      the Coordinator authorize a toy exact-enumeration plan comparing the real
      signer with that genuine simulator over matched public inputs and
      decomposing transcript mass by conversion-choice fibre. This paragraph is
      a test boundary, not an approved or executable experiment design.
    controls:
      - Genuine-simulator null on identical public inputs and transcript projection; mandatory before any signal analysis.
      - Uniformized choice over every enumerated conversion fibre of the same shape.
      - Public relabelling and permutation control preserving fibre sizes.
      - Planted positive control with an intentionally secret-indexed tie-break of known direction.
      - Nearby-object control using equal-size synthetic fibres with secret-independent labels.
    required_metrics:
      - Exact or interval-bounded fibre multiplicities after the source gate.
      - Real, genuine-simulator, uniformized-null, and planted-control transcript frequencies.
      - Conditional and marginal distance with uncertainty and multiplicity correction.
      - Wall-clock, memory, preprocessing, oracle access, verification cost, and signature count.
  controls:
    - true_simulator_null_mandatory
    - planted_secret_indexed_tie_break_positive_control
    - uniformized_equal_shape_conversion_fibre
    - public_relabelling_invariance
  confounders:
    - A purported simulator reconstructed from memory rather than the primary proof or implementation.
    - Rejection sampling, aborts, retries, or acceptance conditioning already covered by IDEA-20260805-2a669e.
    - Serialization differences mistaken for fibre multiplicity.
    - Automorphisms causing several encodings to represent the same mathematical object.
    - Tiny-parameter degeneracies that do not transfer beyond the toy ceiling.
  falsification_conditions:
    - >-
      Exact toy enumeration, once source-gated, shows that fibre multiplicities
      and tie-break probabilities are secret-independent for every tested
      public stratum and the genuine simulator matches them within the
      preregistered tolerance.
    - >-
      Any observed discrepancy vanishes under canonical relabelling or is fully
      reproduced by the equal-shape, secret-independent null.
    - >-
      The planted positive control is not recovered, invalidating sensitivity
      rather than supporting the mechanism.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - No Round-3 or per-scheme fact is treated as verified until primary sources are filed.
    - Toy observations cannot establish production-parameter leakage or a cryptanalytic speedup.
    - A constant distinguisher does not improve the EndRing or OneEnd exponent.
    - >-
      GOAL-SSI-001 exclusively owns hard-problem EndRing/OneEnd algorithms,
      reductions, and status. This proposal is restricted to protocol-level
      transcript simulation and must not change or imply any GOAL-SSI-001
      conclusion.
  assumptions:
    - The later filed primary specification exposes a well-defined ideal-to-isogeny conversion choice or a formally equivalent hidden choice.
    - The primary source defines a genuine simulator whose input excludes secret ideal information.
    - Toy fibres can be enumerated without substituting an easier, inapplicable hard problem.
  heuristic_assumptions:
    - id: H-FIBRE-1
      statement: >-
        Conditional on a fixed public input and public conversion stratum, the
        later toy sampler draws independent signer or simulator coins, and the
        enumerated preimage set equals the support prescribed by the filed
        algorithm.
      rigorous_support: >-
        Finite-support counting is exact once the source-defined transition
        kernel and all equivalence relations are implemented; independence is
        an experimental sampling condition, not a theorem about SQIsign.
      validation_plan: >-
        After source filing, compare exhaustive counts where feasible with two
        independent enumerators, report all tails rather than only a mean, and
        explicitly label any transfer from toy parameters as unvalidated.
  proof_search_map:
    bottleneck: >-
      Determine whether a source-defined conversion kernel is invariant under
      replacing secret ideal information while holding public inputs fixed.
    baseline_embedding:
      parameter_slice: >-
        Reproduce the exact filed signer and genuine simulator on the smallest
        source-valid parameter slice; no substitute simulator or easier
        hard-problem baseline is admissible.
      reproduction_check: >-
        Verify normalization, acceptance support, serialization, and the
        source-stated simulator interface before comparing any distributions.
    observation_collision:
      observable: Public transcript projection together with its public conversion stratum.
      distinct_preimage_search: >-
        Enumerate distinct internal conversion choices and quotient known
        automorphisms to find equal observables with different secret-labelled
        preimages.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: A fibre table indexed by public transcript and public stratum.
        predicted_gain: Separates multiplicity reweighting from endpoint acceptance and encoding effects.
      - transform: stronger_invariant
        proposed_object: Canonical orbit identifier for conversion choices.
        predicted_gain: Prevents automorphic duplicates from creating a false multiplicity signal.
    quantifier_order: >-
      For every tested public input and secret key in the toy domain, compare
      one source-defined real distribution with one uniform secret-free
      simulator distribution; do not choose a different simulator after seeing
      each secret or transcript.
    method_ceiling:
      strongest_certifiable_claim: >-
        A source-gated toy statement about equality or separation of specified
        conversion-choice distributions on enumerated parameters.
      nearby_object_control: >-
        Equal-size synthetic fibres with secret-independent labels and the same
        public projection; the method must return the null there.
    proof_obligations:
      - claim: Reproduce the filed real and genuine-simulator kernels exactly.
        responsibility: baseline
      - claim: Prove or enumerate the relevant fibre quotient and its normalization.
        responsibility: correctness
      - claim: Bound estimation and multiple-testing error for every reported stratum.
        responsibility: success_probability
      - claim: Charge enumeration, sampling, preprocessing, storage, and verification.
        responsibility: runtime
      - claim: Keep every inference within protocol leakage and the toy parameter slice.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: n/a; no ECDLP or EndRing/OneEnd exponent claim
    memory_exponent: n/a; no ECDLP or EndRing/OneEnd exponent claim
    best_known: >-
      KN-TECH-057 matched baseline: van Oorschot-Wiener p^(1/2) time over
      Fp2, or conditional p^(1/4) over Fp only with the stated mixing
      assumption. No easier inapplicable baseline may be used.
    hidden_overhead: >-
      Fibre enumeration may be exponential in toy parameter size; simulator
      construction, canonicalization, rejection sampling, and verification are
      fully charged. No production extrapolation is presently justified.
    tradeoff_note: >-
      Parallel fibre enumeration can exchange memory for time but does not
      change the hard-problem baseline. A protocol signal would require a
      positive-power candidate-space reduction and end-to-end accounting before
      any exponent relevance could be considered by GOAL-SSI-001.
  sota_delta:
    claim: No speedup claimed; current exponent delta is 0.
    baseline_time_exponent_fp2: 0.5
    conditional_baseline_time_exponent_fp: 0.25
    proposed_time_exponent_delta: 0.0
    proposed_memory_exponent_delta: 0.0
    pareto_rows:
      time: Toy fibre enumeration adds cost; no asymptotic gain established.
      memory: Stores fibre tables; no asymptotic gain established.
      data: Requires source-gated signer and genuine-simulator samples or exact support.
      preprocessing: Canonical orbit and fibre construction are charged per public parameter set.
      oracle: No secret, EndRing, OneEnd, or uncharged conversion oracle is allowed.
      verification: Independent normalization, orbit, and simulator-interface checks are charged.
    frontier_check: >-
      Checked all six declared rows against the nearest transcript,
      accept-fibre, posterior-entropy, and collision proposals; none supplies
      this conversion-fibre decomposition at lower cost with the same
      discrimination target.
