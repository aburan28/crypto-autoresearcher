  discriminated_from:
    - explanation: Verifier accept-fibre leakage.
      discriminator: Hold verifier acceptance fixed and vary only conversion-choice multiplicity or tie-break.
    - explanation: Serialization or canonicalization bias.
      discriminator: Compare orbit-canonical and raw encodings at fixed fibre multiplicity.
    - explanation: Abort or retry conditioning.
      discriminator: Condition on identical retry history and compare within that stratum.
