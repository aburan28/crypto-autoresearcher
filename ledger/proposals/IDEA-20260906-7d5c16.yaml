    "claim": "Remembering the last exchange in a walk on a fixed-weight representation domain may reduce return-induced useless collision mass enough to improve its low-memory constant or scoped exponent, provided useful collision density and mixing are jointly certified. It cannot be justified by Johnson-graph mixing alone.",
    "mechanism": "R3 history state (weight-u subset,last removed position,last added position), paired with Sigma={one legal nonbacktracking exchange plus public hash choice}. Branching class after projecting away the subset: the compressed hash state loses subset identity, so b and useful-fibre probability are explicitly measured. Retaining the last exchange uses O(log m) words, not an exponential table.\n\nChoose a weight-u coefficient domain D and two flavors [a]P and Q-[b]P. An exchange updates a known subset sum in two group additions. Exclude the inverse of the previous exchange and use a hash-derived legal move. The key joint object is the killed transition operator on pairs of trajectories before a useful cross-flavor equality. Its escape eigenvalue and the mass on valid cross-flavor pairs determine success; a large underlying spectral gap does not imply many useful collisions. The lift is meant to suppress immediate useless mergers while preserving access to many independent representations.",
