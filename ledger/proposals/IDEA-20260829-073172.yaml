idea:
  id: IDEA-20260829-073172
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  goal_id_note: >-
    ROUTING ONLY. GOAL-ECQ-2298dc is `blocked`; filing a proposal is not a dispatch and does
    not resume it. Any run needs its own Coordinator decision meeting a resume condition of
    DEC-20260824-b7557b. This idea consumes only artifacts already committed under that goal
    and under GOAL-ECQ-001 and GOAL-ECQ-002, and generates no new search.

  title: >-
    The demand side of the search barrier: measure D(r), the decimal size a generating set of a
    rank-r curve must have, and convert lane L1's one-curve 25-digit gap into a law with a
    slope and a blocked rank r*

  class: measurement

  claim: >-
    Lane L1 of DEC-20260824-b7557b closed the "find a 32nd point on ICARM curve no. 302" route
    on a named obstruction with a number: the 31 known witness points have x-numerators of
    about 33 decimal digits, the exhausted frozen box reaches 8, a shortfall of about 25
    decimal digits, at 95,899,629 of 95,899,629 = 100 percent coverage with 0 hits. THAT NUMBER
    IS A PROPERTY OF ONE CURVE AND IT IS BEING USED AS IF IT WERE A PROPERTY OF THE PROBLEM.
    THE CLAIM UNDER TEST TURNS IT INTO A LAW. Define, over curves of certified Mordell-Weil
    rank at least r whose points are published or committed, D(r) = the minimum, over such
    curves, of the maximum decimal digit length of the x-coordinate numerator across a
    LATTICE-REDUCED generating set, and H(r) = the minimum naive height log max(|c4|^3, c6^2)
    over the same rank cell. THE CLAIM: H(r) grows at least linearly in r with slope at least
    15 natural-log units per unit of rank over 12 <= r <= 31, and D(r) grows at least linearly
    with slope at least 0.8 decimal digits per unit rank over the same range; consequently any
    x-coordinate enumeration whose reach is D decimal digits is blocked above rank
    r*(D) = 12 + (D - D(12))/0.8, and this program's exhausted reach of 8 digits gives an
    r* BELOW ITS OWN CERTIFIED RANK OF 12. THE SECOND READING IS PRE-DECLARED AND IS THE
    CONSEQUENTIAL ONE. If, after normalising by the curve's own size -- the ratio
    rho(r) = D(r) / log10|discriminant| -- the growth in r disappears (rho flat, slope
    confidence interval containing 0), then generator size is driven ENTIRELY by curve size and
    NOT by rank, the 25-digit gap is a property of the particular record curve rather than of
    rank 31, and there is no rank-driven barrier to searching for a SMALL rank-32 curve. That
    would reopen lane L1 with a concrete target and would contradict the way this campaign has
    been reading its own closure.

  mechanism: >-
    Two of this program's committed measurements sit on opposite sides of a question neither
    was designed to ask, and putting them together is free. GOAL-ECQ-002's objective records
    the ICARM board's own height envelope with a visible discontinuity: minimum naive height
    jumps 85.19 to 118.77 from the r >= 14 cell to the r >= 15 cell, against steps of 9.4 and
    6.6 on either side. DEC-20260824-b7557b lane L3 records, for the top of the ladder, naive
    heights 393.6297, 442.0854 and 468.2771 at ranks 28, at least 30 and at least 31, with
    log|disc| 381.2024, 432.1249 and 453.0469. Those two records together already imply a
    slope: 468.2771 - 118.77 over 31 - 15 is 21.8 natural-log units of naive height per unit
    of rank, and 468.2771 - 86.77 over 31 - 12 is 20.1 using KN-FIND-e1b836's rank-12 worked
    instance. KN-FIND-91f871 supplies the reason a slope should exist at all on the FAMILY
    side: an elliptic surface of degree d has fibre naive height 12 d log|t| + O(1) and
    Shioda-Tate caps generic rank at 10d - 2, so generic rank r forces height slope at least
    1.2(r+2) -- buying rank buys a steeper height law. What nobody in this program has done is
    ask whether the same coupling holds for the GENERATORS rather than the curve, and that is
    the quantity a point search actually pays for. The mechanism separating the two readings is
    explicit: h_x(P), the naive height of a point, and its canonical height hhat(P) differ by a
    term bounded in terms of log|Delta| (Silverman's difference bounds, recalled), and
    log|Delta| = 453.0469 for the record curve, so the theory permits ANY relation between
    generator size and rank that this program cares about -- the bound is 197 decimal digits
    wide at the record scale and settles nothing. The relation is therefore an EMPIRICAL
    quantity, it is measurable from data this program already holds under content hashes, and
    it is currently unmeasured.

  tracked_object:
    object: >-
      The exact decimal digit-length vector of the x-coordinate numerators of a
      LATTICE-REDUCED generating set of the exhibited subgroup, indexed by rank cell. NOT the
      curve, NOT the family, NOT the canonical heights themselves, NOT the points as points.
    lossy_projection_test: >-
      PASSES. The projection sends a set of rational points on a specific curve over Q to a
      short vector of positive integers -- digit counts. From it one cannot recover a point,
      cannot verify a point lies on the curve, cannot compute an independence certificate,
      cannot recover the curve, and cannot even recover the sign of a coordinate. It is
      discarded COMPATIBLY with the operation the target performs, which is ENUMERATION over a
      box: a search box is specified by exactly this statistic and nothing else, so the
      retained data determines, deterministically and in one step, whether a given box can
      contain a given generating set. That is the compatibility the protocol asks for, and it is
      the whole reason the object is the right one for a barrier claim: the discarded structure
      is precisely the structure the enumeration is blind to.
    what_the_loss_costs: >-
      A digit count cannot say whether a point EXISTS, only how large it would have to be. The
      measurement therefore bounds a SEARCH and never a curve, and D(r) is a minimum over
      KNOWN curves, hence an upper bound on the true minimum over all curves. That asymmetry is
      load-bearing and appears again in the interpretation limits: a small measured D(r) is
      informative, a large one is only informative about the curves anybody has published.
    basis_dependence_is_the_first_hazard: >-
      D is a property of a BASIS, not of a group, so an unreduced published generating set
      measures the finder's bookkeeping rather than the lattice. The design reduces first and
      reports the reduction method, and the reduction is the single largest methodological
      choice in the proposal.

  novelty_status: unverified
  novelty_note: >-
    CORPUS CHECK PERFORMED THIS SESSION. A grep over ledger/ideas/ and ledger/proposals/ for
    "height", "point search", "x-numerator" and "search box" found no record measuring
    generator size as a function of rank. THE NEAREST PRIOR ART IS ON THE SIBLING QUESTION AND
    IS EXPLICITLY THE OTHER HALF OF THE SAME PROBLEM: IDEA-20260829-07fd5f (RQ-ECQ-80f23c, read
    IN FULL this session) measures a cost exponent alpha for RECOVERING a point of given
    canonical height -- the SUPPLY side, what a search can reach per unit budget. This record
    measures the DEMAND side, what size a generating set must have at a given rank. Neither
    determines the other and the blocked rank r* is a function of both; that is stated here so
    no reader treats one as a duplicate of the other, and a batch that ran both would get the
    two halves of one number. IDEA-20260829-02418a (RQ-ECQ-80f23c, read IN FULL this session)
    also handles the height lattice of the record curve but tracks its ISOMETRY CLASS to infer
    a base rank; it discards exactly the coordinate sizes that this record measures, so the two
    are complementary projections of the same input file. KN-FIND-91f871 is prior art for the
    FAMILY-side height slope 1.2(r+2) and this record does not restate it; what is new is the
    same question asked of generators on curves over Q rather than of fibres in a family.
    External literature was NOT checked for this question: there is a recalled body of work on
    canonical-height difference bounds and on the size of generators of high-rank curves that
    could already settle or reframe it, and no search for it was run this session.
    `unverified` is the required label.

