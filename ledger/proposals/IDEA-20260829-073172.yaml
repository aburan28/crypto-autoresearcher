  assumptions:
    - >-
      The frozen ICARM snapshot carries, per curve, at least the a-invariants and a rank cell.
      Whether it carries POINTS is unknown to this session and is checked in step 0. If it does
      not, D(r) is computable only where points are separately committed -- the 137 in-repo
      fibres at r = 8 to 12, ICARM no. 302 at r = 31, and the rank-28 curve's single listed
      point P1 -- and the design degrades to a TWO-CLUSTER comparison with a 19-rank gap, which
      is reported as such and never fitted as a regression.
    - >-
      Canonical heights on curves with a6 of about 10^100 can be computed to 150 digits within
      the declared budget. This is a capability assumption, is checked in step 0, and if it
      fails the lattice reduction falls back to an exact integer-greedy reduction and the fact
      is reported.
    - >-
      Every point used is verified to lie on its stated curve in exact rational arithmetic
      before any statistic is computed. A point that fails is an input defect and stops the
      arm.

  proof_search_map:
    bottleneck: >-
      RQ-ECQ-e9b361's decision target has a half that has never been answered: "a certified
      statement of what this program's own instrument can and cannot certify at record scale",
      and DEC-20260824-b7557b's obstruction is stated as a rank deficit of -15 whose search
      component (lanes L1 and L2) rests on ONE curve's generator sizes. The bottleneck is that
      the search barrier is known at one point and is being extrapolated as if it were known as
      a function. Removing it costs no new search at all -- only reading committed data with a
      declared statistic.
    baseline_embedding:
      parameter_slice: >-
        The single-curve case r = 31, ICARM no. 302, where L1 already reports the answer: about
        33 decimal digits in the x-numerators against a box reaching 8. Restricting this
        design's statistic to that one curve, with no lattice reduction, must REPRODUCE "about
        33" -- that is the exact old-method boundary, not a lookalike.
      reproduction_check: >-
        Frozen fixture. Recompute the maximum x-numerator digit length over the 31 committed
        witness points of ICARM-302.json without any reduction, and require agreement with
        L1's "about 33" to within 1 digit. A pipeline that does not reproduce the committed
        number may not produce a new one. Separately re-verify all 31 points on the exact curve
        in exact rational arithmetic and report the count, since GOAL-ECQ-2298dc records that
        check as already passed.
    observation_collision:
      observable: >-
        The pair (D(r), H(r)) per rank cell, and the normalised ratio rho(r) = D(r)/log10|Delta|.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT IS THE EXPERIMENT'S CENTRAL DANGER. Two mechanisms produce the
        same observed growth of D with r: (a) the real effect, rank itself demands larger
        generators; and (b) a pure size effect, because high-rank curves are found inside
        families or searches that produce large curves anyway, and generator size tracks curve
        size. These are not distinguishable from D alone. SEPARATION CONDITION, MANDATORY AND
        DECLARED IN ADVANCE: report rho(r) = D(r)/log10|Delta| alongside D(r), and treat the
        slope of rho in r as the headline. A slope of D that vanishes after normalisation is
        reported as mechanism (b) and the rank-driven barrier claim is WITHDRAWN, not rescued.
        A SECOND COLLISION, equally dangerous: D(r) is a minimum over PUBLISHED curves, and the
        ICARM board selects for SMALL curves at each rank -- so the board's envelope is already
        the minimum somebody looked for, and its growth may measure the difficulty of the
        SEARCH that produced it rather than a property of rank. Controlled only by disclosure:
        every D and H is labelled "minimum over curves anyone has exhibited", never "minimum
        over curves".
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure charging each rank cell exactly once, over disjoint cells defined
          by the rank threshold, with the denominator (how many curves are in each cell)
          recorded before any statistic is computed.
        predicted_gain: >-
          Converts a single anecdote (one curve, 25 digits) into a slope with a stated
          denominator per cell, which is what the campaign's obstruction block currently lacks.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the pair (digit length, log10|Delta|) rather than the digit length alone,
          because the weaker invariant is exactly what makes the size effect and the rank effect
          look identical.
        predicted_gain: >-
          Separates the two colliding mechanisms; the weaker invariant provably cannot.
      - transform: boundary_lift
        proposed_object: >-
          The claim's boundary moves from "no 32nd point in a box reaching 8 digits on one
          curve" to "no enumeration reaching D digits can find a generating set at rank r
          whenever D < D(r)", a statement quantified over searches rather than over one run.
        predicted_gain: >-
          A closure of the enumeration lane that does not depend on the box actually run, and
          therefore does not have to be re-argued when the box changes.
    quantifier_order: >-
      FROZEN BEFORE THE DATA IS OPENED. FOR ALL rank cells r in the declared set, THERE EXISTS a
      curve E in the cell and a reduced generating set B of the exhibited subgroup of E(Q) such
      that FOR ALL P in B the x-numerator has at most D(r) decimal digits; D(r) is then the
      minimum of that quantity over the cell. Note the order: D is an existential over curves
      and a universal over the basis, which is what makes it the right quantity for a search
      barrier -- a search must find EVERY generator, so the max over the basis is the binding
      cost, while it may choose ANY curve, so the min over the cell is the binding target. The
      reduction algorithm, the rank cells, the digit convention and the exclusion rules are
      frozen in the contract before the snapshot is opened.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the curves this program can see, a generating set at rank r has at least D(r)
        decimal digits in some x-numerator, and D(r) grows with slope s per unit rank with a
        stated confidence interval." That is a statement about EXHIBITED curves and about
        ENUMERATION. It is not a theorem that no small rank-32 curve exists, it is not a bound
        on any other search method (a lattice search, a descent, or a family specialisation is
        untouched), and it certifies no rank.
      nearby_object_control: >-
        The closest object where the barrier claim should FAIL: a curve of MODEST rank and
        LARGE coefficients -- for instance a high-rank fibre from the in-repo pencil after a
        deliberate non-minimal rescaling (x, y) -> (u^2 x, u^3 y), which raises log|Delta| and
        every coordinate while leaving the rank alone. D must rise there and rho must NOT, and
        if rho rises too then rho is not the normalisation it is claimed to be and the
        separation condition fails.
    proof_obligations:
      - claim: The committed 33-digit figure for ICARM no. 302 is reproduced to within 1 digit.
        responsibility: baseline
      - claim: Every point used lies on its stated curve, verified in exact rational arithmetic.
        responsibility: correctness
      - claim: The reported digit counts are exact integers, with floats used only to choose a basis.
        responsibility: interface
      - claim: Two independent reductions of the same lattice agree, or the result is an interval.
        responsibility: strictness
      - claim: Every rank cell's denominator is recorded before its statistic is computed.
        responsibility: scope
      - claim: The whole measurement fits a low compute budget on committed data with no new search.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        reproduction -- maximum x-numerator decimal digit length over the 31 committed witness
        points of ICARM curve no. 302, unreduced
      direction: different
      minimum_effect: >-
        33 plus or minus 1, matching DEC-20260824-b7557b L1. A mismatch stops the experiment.
    - metric: >-
        H_slope -- fitted slope of the minimum naive height H(r) against r over the rank cells
        of the frozen ICARM snapshot in the range 12 <= r <= 31
      direction: higher
      minimum_effect: >-
        at least 15 natural-log units per unit of rank, with a 95 percent confidence interval
        excluding 0. The two committed anchor pairs already imply about 20 to 22, so a fitted
        slope below 15 would contradict data this program has committed and would be the first
        thing to disbelieve about the pipeline.
    - metric: >-
        D_slope -- fitted slope of D(r), the reduced-basis maximum x-numerator digit length,
        against r over the ranks where points are available
      direction: higher
      minimum_effect: >-
        at least 0.8 decimal digits per unit of rank. If points are available only at r = 8-12
        and r = 31, this is reported as a TWO-CLUSTER interval on the slope and explicitly NOT
        as a regression, with the 19-rank gap stated in the same sentence.
    - metric: >-
        rho_slope -- fitted slope of rho(r) = D(r)/log10|Delta| against r, THE HEADLINE
      direction: different
      minimum_effect: >-
        two-sided against the null that the slope is 0. Declared detectable effect: absolute
        value at least 0.005 per unit rank at p below 0.05. A confidence interval containing 0
        is the pre-declared "size, not rank" reading, WITHDRAWS the rank-driven barrier claim,
        and reopens lane L1 with the concrete target "find a rank-32 curve of small
        discriminant"; a slope bounded away from 0 and positive names the blocker as rank-driven
        and prices it.
    - metric: >-
        r_star -- the rank above which an x-coordinate enumeration of reach 8 decimal digits,
        the reach this program actually exhausted, cannot contain a generating set, computed
        from the fitted D law
      direction: different
      minimum_effect: >-
        reported as an integer with a confidence interval and with the extrapolation range
        flagged in the same sentence. The pre-declared expectation is r* at most 12, which
        would say the exhausted 95,899,629-candidate box was already below this program's OWN
        certified rank and was never capable of finding a 32nd point -- making L1's zero an
        expected zero rather than an informative one.
    - metric: >-
        rescaling control -- D and rho on an in-repo rank-12 fibre before and after a
        non-minimal rescaling (x, y) -> (u^2 x, u^3 y) at declared u
      direction: different
      minimum_effect: >-
        D must rise by the amount the rescaling predicts, and rho must change by less than
        0.005. If rho moves with a pure change of model, it is not a normalisation and the
        headline metric is void.

  minimal_test:
    design: >-
      STEP 0 (input audit, about 1 h, no compute). Open the frozen snapshot
      icarm_database_20260823.json (sha256 118db069...cadc59) and record exactly which fields
      it carries per curve, in particular whether POINTS are present and at which ranks. Freeze
      the rank cells, the digit convention, the reduction algorithm, and the exclusion rules
      NOW, before any statistic is computed. Re-read ICARM-302.json's `_provenance` field, as
      the goal record instructs, before citing it.
      STEP 1 (reproduction gate, about 30 min). Re-verify all 31 witness points of no. 302 on
      the exact curve in exact rational arithmetic, and recompute the unreduced maximum
      x-numerator digit length. Require 33 plus or minus 1. STOP CONDITION.
      STEP 2 (the envelope law, about 1 CPU-hour). From the frozen snapshot alone, compute
      H(r) per rank cell with the number of curves in each cell recorded first, and fit the
      slope over 12 <= r <= 31. This arm needs no points and runs even if step 0 finds none.
      STEP 3 (the generator law, about 3 CPU-hours). Wherever points exist, compute canonical
      heights at 150 digits, LLL-reduce the point lattice against the height Gram, then
      recompute the resulting points in EXACT rational arithmetic and report their exact digit
      lengths. Do this twice with two different reduction settings; if the two disagree by more
      than 1 digit, report an interval. Compute D(r) and rho(r) per cell.
      STEP 4 (controls, about 2 CPU-hours). Run the rescaling control on an in-repo rank-12
      fibre; run the modest-rank-large-coefficient nearby object; run the empty and degenerate
      supports (a rank-1 curve and an empty point set) and require the pipeline to return 1 and
      0 rather than a number.
      STEP 5 (the deliverable, about 30 min). Report r*(8) from the fitted law, with its
      confidence interval and its extrapolation range, alongside the raw statement of L1's
      exhausted box. If the rho slope is indistinguishable from 0, report the "size, not rank"
      reading as the result and state its consequence for lane L1 explicitly.
    controls:
      - >-
        REPRODUCTION CONTROL: L1's "about 33 digits" must come back to within 1 digit on the
        committed file. If it does not, nothing else runs.
      - >-
        NORMALISATION CONTROL, THE LOAD-BEARING ONE: rho = D/log10|Delta| reported alongside D
        at every cell, with the rho slope as the headline. Without it the size effect and the
        rank effect are the same number.
      - >-
        MODEL-RESCALING CONTROL: the same curve at a non-minimal model. D must move and rho must
        not. This is the control that decides whether rho is a normalisation or a coincidence.
      - >-
        BASIS CONTROL: two independent lattice reductions of the same point set. Disagreement
        beyond 1 digit is reported as an interval, never averaged.
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION FAILS: a modest-rank curve with record-scale
        coefficients. D must be large there while r is small, which by itself falsifies any
        reading of D as a pure function of rank.
      - >-
        EMPTY AND DEGENERATE SUPPORT: a rank-1 curve and an empty exhibited set must return 1
        and 0 respectively, never a fitted value.
      - >-
        SELECTION DISCLOSURE, recorded as a control because it cannot be removed: every D and H
        is a minimum over curves SOMEBODY EXHIBITED, on a board that scores rank relative to
        size, so both statistics are conditioned on other people's search effort. Reported in
        the same sentence as the numbers, every time.
    required_metrics:
      - the snapshot's field inventory and per-rank-cell curve counts, recorded before any statistic
      - unreduced and reduced maximum x-numerator digit lengths per curve, as exact integers
      - H(r) and D(r) per cell with denominators, and rho(r) with log10|Delta| per curve
      - fitted slopes for H, D and rho with confidence intervals and the fitted range
      - the two reduction settings and the digit lengths under each
      - rescaling-control before and after values for D and rho
      - exact on-curve verification pass and fail counts for every point used
      - r*(8) with confidence interval and the extrapolation range stated
      - wall clock, peak RSS, and the precision at which every canonical height was computed

  falsification_conditions:
    - >-
      If the unreduced maximum x-numerator digit length for ICARM no. 302 does not reproduce
      L1's "about 33" to within 1 digit, the pipeline disagrees with a committed record and no
      new number may be reported.
    - >-
      If the fitted rho slope's confidence interval contains 0 and excludes 0.005, the
      rank-driven barrier claim is FALSIFIED and the pre-declared "size, not rank" reading is
      recorded as the result, with its consequence for lane L1 stated: no rank-driven barrier
      was found, and the L1 gap is a property of that curve.
    - >-
      If rho moves under a pure change of Weierstrass model, rho is not a normalisation and the
      headline metric is void; the record then carries only H(r) and D(r) unnormalised, with
      the collision unresolved and stated as unresolved.
    - >-
      If the two lattice reductions disagree by more than 1 digit on more than 20 percent of
      the point sets, D is basis-dependent at the resolution of the claim and every D is
      reported as an interval.
    - >-
      If points are absent from the snapshot AND the in-repo low-rank cluster is the only
      source below r = 31, no D slope may be fitted; the deliverable is a two-cluster interval
      and the 19-rank gap is stated wherever the interval is quoted.
    - >-
      A failure to compute a canonical height at the declared precision, an OOM, or a crash is
      an OPERATIONAL condition under AGENTS.md rule 3, reported as an instrument limit, and is
      never a digit count.

  confounders:
    - >-
      SELECTION BY THE BOARD. The ICARM leaderboard scores rank RELATIVE TO SIZE, so the curves
      in each cell are the smallest anybody has found and submitted. H(r) therefore measures a
      lower envelope of other people's search effort, and its jump at r >= 15 (85.19 to 118.77
      against neighbouring steps of 9.4 and 6.6) may be a discontinuity in effort rather than
      in mathematics. Cannot be removed; disclosed with every number.
    - >-
      BASIS DEPENDENCE. D is a property of a basis. Published generating sets are not reduced
      and may reflect how the finder happened to write them down. Controlled by reducing first,
      by reporting the reduction settings, and by the two-reduction interval rule.
    - >-
      MINIMALITY OF THE MODEL. A non-minimal model inflates every coordinate. GOAL-ECQ-2298dc
      records that establishing minimality at record scale needs the factorisation of
      discriminants of roughly 450 to 900 decimal digits and is therefore UNSATISFIABLE as a
      flat requirement (DEC-20260824-b7557b E3). Controlled by reporting a PARTIAL minimality
      screen labelled partial on every row, exactly as that amendment requires, and by the
      rescaling control which measures the size of the effect directly.
    - >-
      THE TWO CLUSTERS. In-repo data sits at r = 8 to 12 and the record data at r = 28 to 31,
      with essentially nothing between unless the snapshot supplies it. A slope fitted across a
      19-rank gap is an interpolation with two anchors and must never be described as a
      regression.
    - >-
      PRECISION. KN-FIND-6b3e17 records regulator determinants from the in-repo batch quoted to
      no more than about 16 significant digits, with an unexplained uniform 17th-digit
      divergence whose obvious cause was tested and FALSIFIED. Canonical heights here are
      computed at two precisions and any statistic that changes between them is reported as
      precision-bound rather than as signal; the reported digit counts are exact integers and
      are unaffected.
    - >-
      PROVENANCE OF THE TOP CLUSTER. The rank-28 and no. 273 a-invariants come from an
      orchestrating-session retrieval document with no committed run record, through a tool
      documented to drop exponents; no. 302's data carries its own summarising-fetch caveat.
      Any statistic resting on those rows is reported with the caveat attached, and the fit is
      repeated with them dropped.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (LINEAR HEIGHT DEMAND.) Over curves of certified Mordell-Weil rank at least r that have
        been exhibited by anyone, the minimum naive height H(r) = min log max(|c4|^3, c6^2)
        satisfies H(r) = s*r + c with s at least 15 natural-log units per unit rank, uniformly
        over the range 12 <= r <= 31, and the analogous reduced-generator statistic D(r)
        satisfies D(r) = s'*r + c' with s' at least 0.8 decimal digits per unit rank over the
        ranks where points are available.
      rigorous_support: >-
        RIGOROUS PART: none is claimed for the functional form over curves. What is rigorous is
        the FAMILY-SIDE analogue that motivates it, KN-FIND-91f871's derivation that an
        elliptic surface of degree d has fibre naive height 12 d log|t| + O(1) with
        d at least ceil((r+2)/10), forcing an asymptotic slope of at least 1.2(r+2) -- a slope
        that is itself increasing in r. DISTRIBUTION IMITATED: the standard empirical picture in
        which higher rank is found at higher conductor, together with this program's own two
        committed anchor pairs, which give 21.8 units per rank from (15, 118.77) to
        (31, 468.2771) and 20.1 from (12, 86.77) to (31, 468.2771). The predicted 15 is
        deliberately BELOW both anchors so that the prediction can fail.
      validation_plan: >-
        Sample: every rank cell of the frozen ICARM snapshot
        (sha256 118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59, retrieved
        2026-08-23T00:43Z) in the range 12 to 31, with the number of curves per cell recorded
        BEFORE any statistic; plus the 137 in-repo certified fibres for the low end and the
        three record curves for the high end. Shortcut making this feasible: every quantity is
        a function of the a-invariants alone and is computed in exact integer arithmetic at
        microseconds per curve, so no search, no descent and no certification is needed and the
        whole envelope arm costs about one CPU-hour. Compare: the fitted slope against the two
        committed anchor pairs above, and the fitted line's residuals cell by cell rather than
        only its slope. Tail check: fit on 12 <= r <= 25 and PREDICT H(31), requiring agreement
        with the committed 468.2771 within 10 percent; a held-out prediction that misses by more
        than that means the law is not linear over the range and the slope may not be
        extrapolated to 32. TRANSFER ASSUMPTION, STATED IN FULL: extrapolating from r at most 31
        to r = 32 is one unit and is mild; extrapolating a search barrier from the curves anyone
        has PUBLISHED to the curves that EXIST is not mild at all, is supported by nothing
        measured here, and is the single least defensible step the deliverable will contain.
    - id: H2
      statement: >-
        (DISCRIMINANT AS THE SUFFICIENT NORMALISER.) Conditional on log10|Delta|, the reduced
        generator size D is independent of the curve's rank except through rank's effect on
        log10|Delta| itself; that is, log10|Delta| is a sufficient statistic for the size
        confounding, so a nonzero slope of rho = D/log10|Delta| in r is attributable to rank.
      rigorous_support: >-
        RIGOROUS PART: the difference between the canonical height and half the naive x-height
        of a point is bounded in terms of log|Delta| (Silverman, recalled), so log|Delta| is
        the quantity through which model size mechanically constrains coordinate size; dividing
        by it removes that mechanical channel. H2 IS THE ASSUMPTION MOST LIKELY TO BE FALSE,
        because the bound is two-sided and wide -- about 197 decimal digits of slack at
        log|Delta| = 453.0469 -- so "sufficient" is a modelling choice and not a theorem, and
        because the number of generators r itself enters the geometry of the lattice
        independently of |Delta|.
      validation_plan: >-
        Sample: the rescaling control, which is the direct test -- take at least 10 in-repo
        certified fibres of ranks 8 to 12, apply (x, y) -> (u^2 x, u^3 y) at u in a declared set
        of at least 4 values, and recompute D and rho. Compare: if H2 holds, D moves by exactly
        the amount the rescaling predicts and rho moves by less than 0.005; the observed
        movement of rho is the DIRECT MEASUREMENT of H2's failure. Tail check: repeat at the
        largest u in the set, where the mechanical channel is strongest and H2 should fail worst,
        and report rho's movement there separately. Also report the conductor as an alternative
        normaliser alongside log10|Delta| and state whether the two give the same SIGN for the
        rho slope; disagreement between the two normalisers is reported, never resolved by
        choosing one. If H2 fails, the correct report is that the size and rank effects cannot
        be separated with the available data, which withdraws the headline rather than
        rescuing it.

  target_complexity:
    time_exponent: >-
      NO ALGORITHMIC EXPONENT IS CLAIMED OR MOVED. This record MEASURES a quantity that sets an
      exponent elsewhere: the enumeration cost of an x-coordinate search over a box of reach D
      decimal digits is proportional to 10^(3D/2) for the u, w parametrisation this program
      actually used (|u| up to 10^D with w up to 10^(D/2)), so the cost of reaching a generating
      set at rank r is exp(theta * D(r)) with theta = (3/2) log 10 = 3.4539 and D(r) the
      quantity measured here. The exhausted v2 box, 95,899,629 candidates at D = 8, against a
      demanded D = 33, is a shortfall of 10^(3*25/2) = 10^37.5 candidates -- a number this
      record's fitted law is what makes quotable as a function of r rather than of one curve.
    memory_exponent: >-
      Negligible and flat. The whole measurement is a pass over at most a few thousand curves
      with exact integer arithmetic plus a handful of 150-digit height matrices of dimension at
      most 31. Budget 2 GB peak RSS; expected far below.
    best_known: >-
      IN THIS REPOSITORY the search barrier is known at exactly one point: DEC-20260824-b7557b
      L1's "8 searched against about 33 exhibited" on ICARM curve no. 302, from an
      orchestrating-session reading of a committed run. No law, no slope, no other rank, no
      confidence interval. EXTERNALLY, this session checked nothing: no literature search was
      run on the size of generators of high-rank curves, and there may be a published law that
      settles this at zero cost. That gap is disclosed rather than filled by assertion.
    hidden_overhead: >-
      Two disclosures. (1) D(r) is a minimum over curves SOMEBODY FOUND, so it is an upper
      bound on the true minimum and it silently encodes other people's search budgets; a fitted
      slope may be measuring the history of the leaderboard rather than the arithmetic. (2) The
      data has a 19-rank hole between the in-repo cluster and the record cluster unless the
      frozen snapshot fills it, and a slope across a hole is an interpolation with two anchors,
      whatever the confidence interval says.
    tradeoff_note: >-
      Not a time-memory problem. The relevant trade is PRECISION against BASIS STABILITY: a
      higher-precision height Gram gives a more stable LLL reduction and therefore a tighter D,
      at linear cost in the height computation, and the design buys stability first because the
      two-reduction interval rule makes instability directly visible in the deliverable. Fully
      parallel over curves and irrelevant at this scale.

  dominated_by: >-
    FRONTIER ROWS CHECKED ACROSS TIME, MEMORY AND DATA. (1) A PUBLISHED LAW FOR GENERATOR SIZE
    AT HIGH RANK, IF ONE EXISTS, WOULD DOMINATE THIS ENTIRELY -- it would be free and would
    cover curves nobody in this program has seen. This session did NOT search for one, so this
    row is checked as UNRESOLVED rather than as absent, and that is the honest state; the first
    action of any run is to look. (2) IDEA-20260829-07fd5f dominates on the SUPPLY side and is
    not a competitor: r* is a function of both records and neither is derivable from the other.
    (3) IDEA-20260829-02418a consumes the same input file for a different projection and
    dominates on ambition (it targets the base rank behind the record) while costing four to
    five times as much; it does not touch generator size. (4) Running a bigger search box
    dominates on directness and is dominated on cost by an unbounded factor: L1 already
    exhausted 95,899,629 candidates to reach 8 digits, and this record's own cost model says
    reaching 33 needs about 10^37.5 more. (5) DEC-20260824-b7557b L1 itself dominates on
    certainty for the single curve r = 31 and says nothing about any other rank, which is
    exactly the gap this record fills. On the axis "what does a generating set at rank r cost
    to enumerate, as a function of r, from data already committed", no row in this repository
    dominates it because no row addresses it.
  sota_delta: >-
    QUANTITATIVELY. Delta on rank over Q: ZERO. Delta on the world record: ZERO. Delta on any
    complexity exponent: ZERO -- this measures the argument of an exponent that already exists,
    it does not move one. WHAT MOVES IS THE OBSTRUCTION RECORD: the campaign's search-lane
    obstruction is currently "about 25 decimal digits", read off ONE curve, with no slope, no
    denominator, no confidence interval and no statement about any other rank; after this
    measurement it is a fitted law H(r) and D(r) with confidence intervals, a normalised rho
    that separates the size effect from the rank effect, a blocked rank r*(8) for the box this
    program actually exhausted, and a pre-declared alternative reading that would REOPEN the
    lane. Estimated cost roughly 7 CPU-hours on committed data with no new search, against the
    1,993.0 s and 95,899,629 candidates already spent to produce the single point it
    generalises. That is the cheapest available conversion of a verdict into a measurement in
    this campaign, and it is still only a measurement.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Implementation is one JSON reader, one exact digit-length routine, one canonical-height
      call, one LLL, one linear fit and a rescaling control -- no new mathematics and no new
      search code. Compute is roughly 7 CPU-hours total, dominated by 150-digit canonical
      heights on 100-digit coefficients for the 31-point record lattice; the envelope arm alone
      is about 1 CPU-hour and is independently deliverable if the point data is absent. Peak
      RSS well under 2 GB. THIS IS THE CHEAPEST OF THE FOUR PROPOSALS FILED THIS SESSION AND
      THE ONLY ONE THAT NEEDS NO NEW EXTERNAL TOOLING.

  interpretation_limits:
    - >-
      THIS EXHIBITS NO CURVE AND CERTIFIES NO RANK. It measures a barrier to ONE search method,
      x-coordinate enumeration, and leaves rank 32 over Q exactly as far away as before.
    - >-
      A LAW OVER PUBLISHED CURVES IS NOT A THEOREM ABOUT CURVES. D(r) is a minimum over what
      anybody has exhibited; a small rank-32 curve with small generators is not excluded by any
      number this record can produce, and no artifact may say otherwise.
    - >-
      The barrier is specific to enumeration. A lattice-reduction search
      (IDEA-20260829-07fd5f), a descent, or a specialisation of a high-rank family is not
      bounded by anything here.
    - >-
      Scoped to the frozen 2026-08-23 ICARM snapshot, the committed in-repo point sets, the
      declared reduction settings and the declared digit convention. Later board movement is
      reported against that snapshot and never absorbed into it.
    - >-
      Rank at least 31 over Q is a live claimed record held by others. The record curve appears
      here only as a data point about coordinate sizes, and nothing about it is restated as this
      program's result.
    - >-
      The "size, not rank" reading would REPRICE lane L1, not reopen it as a plan. No batch may
      be authorised on the strength of a fitted slope alone.

  recommended_priority: high
  recommended_priority_basis: >-
    HIGHEST OF THE FOUR FOR FIRST TEST. It is the only proposal in this set that needs no new
    external tooling, no licence, no paper read at full text and no new search; it runs entirely
    on artifacts already committed under content hashes; its reproduction gate independently
    checks a committed orchestrating-session computation that has never been reproduced; and
    both of its pre-declared readings change what the campaign should do next. Expected
    information gain per CPU-hour is the largest in this set even though its ambition is the
    smallest.

