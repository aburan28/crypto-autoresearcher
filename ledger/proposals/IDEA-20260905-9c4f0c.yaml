idea:
  id: IDEA-20260905-9c4f0c
  added: '2026-09-05'
  recorded_at: '2026-09-05'
  title: >-
    THE REAL WALK IS NOT THE CONVOLUTION: the r-adding walk chooses its branch from
    coordinates, so its transition operator is not translation-invariant and its
    itinerary classes are cheap coordinate predicates of degree exponential in
    depth -- past depth log(N)/(2 log 2r) the character-sum bound is vacuous and
    nothing proved forbids a class of sqrt(N) points from having its discrete logs
    concentrated on a short arc; measure the lumped spectral defect and the
    itinerary-class arc concentration against a random-label walk of the same
    shape, with the localized-kangaroo exploit cost as the modelled readout
  class: measurement
  question_id: RQ-ECDLP-4fcbd3
  question_ids: [RQ-ECDLP-4fcbd3, RQ-ECDLP-002, RQ-CRYPTO-001, RQ-EWALK-8fa147]
  goal_ids: [GOAL-ECDLP-001, GOAL-CRYPTO-001]
  goal_applicability:
    GOAL-ECDLP-001: >-
      The one place in the coordinate-bias lane where the theorem-shaped ceiling of
      IDEA-20260905-b6154d is silent by its own hypotheses (unbounded degree), so a
      null here is a measured obstruction the ceiling cannot supply and a positive
      here is the only route in the lane that could move an exponent.
    GOAL-CRYPTO-001: >-
      Attaches a concrete exploit shape (itinerary localises the log to an arc,
      kangaroo finishes) so a measured concentration converts to a modelled cost
      against rho without a second design step.
  status: proposed
  proposed_by: claude-code-session
  claim: >-
    (A) THE OBJECT. The additive walk on G = <P> of prime order N is F(W) = W +
    T_{s(W)} with s(W) = x(W) mod r (harness/rho.py) and table points T_j = c_j P +
    d_j Q of known logs t_j. Its transition matrix is a deterministic 0/1 matrix on
    G, so its eigenvalues are roots of unity from cycles and zeros from trees: the
    interesting operator is not this matrix but the walk LUMPED by a cheap
    coordinate partition g: G -> [k], i.e. the k x k row-stochastic matrix Q_g[i,j]
    = Pr over uniform W of [g(F(W)) = j | g(W) = i]. If coordinates carry no
    information about the next coordinates beyond marginals, Q_g is rank one (every
    row equals the stationary law of g) and its centred second singular value
    lambda_2(Q_g) is at the sampling-noise level. The second object is the depth-k
    ITINERARY class C_sigma = {W : (s(W), s(F(W)), ..., s(F^(k-1)(W))) = sigma} for
    sigma in [r]^k. Every W in C_sigma has the same displacement F^k(W) - W = sum of
    T_{sigma_j}, and membership costs k walk steps to decide from coordinates alone.
    (B) THE PREDICTIONS. (B1) For g of bounded Fourier complexity, lambda_2(Q_g)
    decays like p^(-1/2) times polylog across the toy ladder and is within a factor
    2 of the same statistic on the random-label null walk (s replaced by a seeded
    uniformly random labelling s' of G, same r, same table). (B2) For itinerary
    classes: define the arc concentration A_sigma as the length, divided by N, of
    the shortest arc of Z/N containing half of the logs of C_sigma. Under uniform
    spreading of |C_sigma| points A_sigma = 1/2 - O(|C_sigma|^(-1/2)). The
    prediction is that the class-averaged A_k and the class-minimum A_k^min match
    the random-label null within its bootstrap band at every depth k with r^k <=
    sqrt(N), INCLUDING the depths beyond k* = log(N)/(2 log(2r)) where the
    Weil-level bound on the class indicator's DL-spectrum exceeds the class size
    and so certifies nothing. (B3) The DL-spectrum max spike of each class
    indicator (IDEA-20260905-f31bc4's instrument applied to 1_{C_sigma}) sits at the
    Gumbel level sqrt(2 |C_sigma| log N) at every depth.
    (C) THE EXPLOIT SHAPE, SO THAT A POSITIVE HAS A PRICE BEFORE IT IS SEEN. If at
    depth k every class had arc concentration A, then for the target Q the point W
    = Q + uP for one random u has an itinerary computable in k steps that localises
    log(W) = log(Q) + u to an arc of length A*N, and a kangaroo on that arc costs
    about 2 sqrt(A N) group operations. The fully charged cost k + 2 sqrt(A N) beats
    the 0.886 sqrt(N) rho baseline iff A < 0.196, and the sub-exponent regime needs
    A to shrink polynomially in N. That number is a MODEL, computed from a measured
    A, and it is reported as such; the exploit is never run in this record.
    (D) THE CEILING THIS RECORD DOES NOT DISPUTE. Mixing quality of r-adding walks
    is a constant on the square-root exponent (Teske's 20 percent, KN-TECH-006, and
    the recalled (1 - 1/r)-type correction of Brent-Pollard analyses), and the
    lumped-spectrum arm (B1) is expected to reproduce exactly that: a coordinate
    partition equal to s itself has Q_s with a known structure (row i is the law of
    s(W + T_i) over W with s(W) = i), whose defect is what the constant-factor
    literature already prices. Nothing in (B1) can move an exponent and the record
    says so; (B2)-(B3) are where an exponent could hide.
  mechanism: >-
    WHY THE DETERMINISTIC WALK COULD DIFFER FROM THE CONVOLUTION AT ALL. In the
    random-branch model the step is independent of the state and the operator is a
    convolution whose eigenvectors are the characters; correlation with coordinates
    is then the Kohel-Shparlinski sum and is Weil-bounded (IDEA-20260905-b6154d).
    The real walk ties the branch to x(W) mod r, so consecutive coordinates are
    linked through the addition correspondence: (x(W), x(W + T_i)) lies on a curve
    of bounded degree for each fixed i, and the pair (s(W), s(F(W))) is a
    residue-class condition on that correspondence. Its deviation from independence
    is bounded by completion of sums at O(r^2 sqrt(p) log^2 p / N) relative, hence
    (B1). But the depth-k class is a residue condition on the k-fold composite
    x(F^(k-1)(W)), whose degree as a rational function of W grows like a constant
    to the k, so the Weil bound on sum over C_sigma of chi_a is c * 2^k * poly(r) *
    sqrt(p), which is larger than |C_sigma| = N / r^k once (2r)^k > sqrt(N). From
    that depth on, no bound in the lane's toolkit says anything about where the
    logs of a class sit. Under the random-mapping heuristic they are spread
    uniformly, and every published analysis of rho assumes exactly that; this
    record measures it instead of assuming it, at the depths where it is unproved.
    WHY CONCENTRATION IS THE RIGHT STATISTIC. A class whose logs are concentrated on
    an arc is a localiser, and a localiser is an attack (part C); a class whose logs
    are merely non-uniform in some other way (an arithmetic progression, a union of
    arcs) is caught by the DL-spectrum spike (B3), which is why both are measured.
    A concentration that appears at depth k on the true walk and NOT on the
    random-label walk, and that does not shrink when p grows at fixed r^k / sqrt(N),
    is the finding; a concentration shared with the random-label walk is a property
    of small classes, not of coordinates, and is recorded as a controlled null.
    THE LOSSY-PROJECTION TEST. The tracked object is the pair (itinerary, log arc):
    the itinerary discards the point and keeps k residues, and it propagates
    deterministically under the walk (the depth-k itinerary of F(W) is the depth-k
    itinerary of W shifted by one symbol plus one new symbol), so what is retained
    is compatible with the operation. The projection is genuinely lossy: r^k
    classes for N points. It is a change of coordinates only at r^k = N, which is
    why the depth is capped at r^k <= sqrt(N).
  novelty_status: unverified
  novelty_screen:
    method: >-
      search_knowledge unavailable in this container (index empty). Local grep over
      ledger and knowledge for rho walk, r-adding, iteration function, mixing time,
      spectral gap, lumpability, itinerary, fruitless cycle; nearest records read as
      named in citations. Incomplete; no global novelty claim.
    nearest_internal_record: IDEA-20260905-afa907
    precise_difference: >-
      The neighbour asks whether a feature-only simulator with a small coupling
      defect can exist for a restricted operation set on groups of order 11 and 17.
      This record measures the lumped spectral defect of the ACTUAL harness walk on
      prime-order subgroups up to 2^24 and, separately, the arc concentration of
      itinerary classes past the depth where character-sum bounds are vacuous, with
      an exploit cost model attached. The neighbour has no walk, no depth, no arc
      statistic and no null walk.
    second_nearest: EXP-EWALK-f19570
    second_difference: >-
      The EWALK contract measures collision constants and 2-cycle rates of
      automorphism-quotient walks and states (correctly) that mixing moves the
      constant, never the exponent. This record accepts that for the lumped
      spectrum (B1) and goes after a different object, the DL-location of itinerary
      classes, which no EWALK record measures.
    scope: No global novelty claim.
  citations:
    - ref: IDEA-20260905-afa907
      provenance: internal
      claim: Nearest claim and mechanism read in full; comparison in novelty_screen.
      verified_by: claude-code-session 2026-09-05 (Read, all lines)
    - ref: EXP-EWALK-f19570
      provenance: internal
      claim: >-
        The orbit-choice quotient walk contract; its statement that mixing changes
        the constant and never the exponent, its use of harness/rho.py-style
        r-adding walks, and its null-object discipline (decay parameter r, derived
        cycle-rate null, random-oracle walk reference).
      verified_by: claude-code-session 2026-09-05 (Read, lines 1-320)
    - ref: harness/rho.py
      provenance: internal
      claim: >-
        The harness walk is a Teske r-adding walk with s(W) = x(W) mod branches,
        table T_s = c_s P + d_s Q seeded from the instance seed, Floyd cycle
        detection, and independent certificate recomputation of k*P.
      verified_by: claude-code-session 2026-09-05 (Read, all lines)
    - ref: harness/toycurve.py
      provenance: internal
      claim: >-
        Exact affine short-Weierstrass arithmetic, naive point counting for
        field_bits <= 24, generate_instance picking the largest prime factor of #E
        as subgroup order, and lift_x.
      verified_by: claude-code-session 2026-09-05 (Read, lines 1-330)
    - ref: KN-TECH-006
      provenance: internal
      claim: >-
        Teske r-adding walks reach the ideal random-walk constant, about 20 percent
        better than the three-branch map; the baseline is the fully charged
        parallel van Oorschot-Wiener cost.
      verified_by: claude-code-session 2026-09-05 (Read, all lines)
    - ref: KN-TECH-001
      provenance: internal
      claim: Rho baseline sqrt(pi n / 2) with certificate emission.
      verified_by: claude-code-session 2026-09-05 (Read, all lines)
    - ref: RQ-EWALK-8fa147
      provenance: internal
      claim: >-
        The walk lane's constraints (null objects, decay tests, certificates, toy
        cap) which this record inherits.
      verified_by: claude-code-session 2026-09-05 (Read, all lines)
    - ref: Brent, R. and Pollard, J., Factorization of the eighth Fermat number, Math. Comp. 36 (1981)
      provenance: recalled
      claim: >-
        Recalled as the origin of the analysis of r-adding-type walks as random walks
        with a constant-factor deviation from the random-mapping collision constant
        that shrinks as the branch count grows. Exact form of the correction is
        unverified here and nothing in this record depends on it.
      verified_by: null
    - ref: Lange, T. and Shparlinski, I., Certain exponential sums and random walks on elliptic curves, Canad. J. Math. 57 (2005)
      provenance: recalled
      claim: >-
        Recalled as proving uniformity of distribution for additive random walks on
        elliptic curves via exponential sums, for SHORT walks or on average over
        parameters; the depth regime in (B2) is recalled to be outside what is
        proved. A reviewer with retrieval should check which regime the theorems
        cover, since that is exactly the boundary this record measures across.
      verified_by: null
    - ref: Teske, E., On random walks for Pollard's rho method, Math. Comp. 70 (2001)
      provenance: recalled
      claim: >-
        Recalled as the source of the r-adding walk and its empirical collision
        constants; cited here through KN-TECH-006, which relays it.
      verified_by: null
  assumptions:
    - >-
      The table logs t_j = c_j + d_j k mod N are known at toy scale because k is
      known to the instance generator; they are used only to tabulate logs and to
      compute the displacement of a class, never as an input to any predicate.
    - >-
      The walk is the harness walk step for step, checked by a byte-identical
      regression of the first 10^4 iterates against harness/rho.py on a shared seed.
    - >-
      Toy scale, field_bits 12 to 24, r in {4, 8, 16, 32}; depths k with r^k <=
      sqrt(N). No transfer to cryptographic scale is offered.
  proof_search_map:
    bottleneck: >-
      The step from "coordinates determine the branch" to "coordinates locate the
      log": it requires a class of cheaply decidable points whose logs are not
      spread uniformly. At depths below k* the Weil bound forbids it; at depths
      above k* nothing forbids it and nothing produces it, and the bottleneck is
      exactly that gap.
    baseline_embedding:
      parameter_slice: >-
        The random-label walk (s' uniformly random) at every (p, r, k) cell, on the
        same curve and table: the exact null of the same shape. And the k = 1 slice,
        where the class is a plain residue condition and the Weil bound applies with
        margin, so measured concentration must be at the uniform level.
      reproduction_check: >-
        At k = 1 the class-averaged arc concentration must equal 1/2 within the
        uniform-spreading band on both walks; the lumped matrix for g = s must
        reproduce the marginal law of s on both walks to machine precision.
    observation_collision:
      observable: arc concentration A_sigma of an itinerary class and lambda_2 of a lumped matrix
      distinct_preimage_search: >-
        A small A_sigma has two preimages: logs genuinely concentrated by the walk,
        and a class so small that half of few points always fits in a short arc.
        The random-label walk has classes of identical size distribution and
        separates the two; the statistic is always reported as the paired
        difference true-minus-null at matched class size.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The pair (itinerary, log arc) in place of the single walk statistic
          (collision time), preserving where a class sits on the log line rather
          than only how often classes collide.
        predicted_gain: >-
          None predicted on the exponent; the transform exposes the one observable
          that could carry one.
    quantifier_order: >-
      FOR ALL cells (p, r, k) in the ladder with r^k <= sqrt(N), FOR ALL classes
      sigma: A_sigma is at the uniform level up to the null's band. The alternative
      is existential in the class and universal in the cell: THERE EXISTS a depth
      k >= k* such that FOR EVERY class the arc concentration is below 0.196 on the
      true walk and not on the null, persisting as p grows; a single anomalous
      class is a Bonferroni event, not a finding.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, the measured arc concentration and spectral spike of every
        class at every depth up to r^k = sqrt(N), paired with the null walk, and
        the decay slopes. Cannot certify absence of concentration at depths beyond
        the cap or at larger p; cannot certify anything about other iteration
        functions (negation-map, Montgomery-ladder, mixed walks).
      nearby_object_control: >-
        A walk whose table points all lie in a proper coset structure is not
        available on a prime-order group, so the nearby object is instead the walk
        on a curve of order 2q restricted to the parity character: itineraries of
        a walk whose branch is chosen by the descent symbol delta(W) (a genuine
        group character) DO localise the log modulo 2 exactly, giving a class
        structure with A = 1/2 on each parity but a DL-spectrum spike at q. The
        instrument must show that spike; on the prime-order walk it must not.
    proof_obligations:
      - claim: The log table and the walk are correct (certificates and regression).
        responsibility: correctness
      - claim: k* = log(N)/(2 log 2r) is the depth at which the class-indicator Weil bound exceeds the class size.
        responsibility: baseline
      - claim: Uniform-spreading band for the min-half-arc of m uniform points on Z/N.
        responsibility: size
      - claim: The localized-kangaroo cost model k + 2 sqrt(A N) is stated as a model.
        responsibility: runtime
      - claim: Toy tier; no transfer.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: lambda_2_lumped_slope_vs_log_p
      direction: different
      minimum_effect: >-
        Null: slope within -0.5 +- 0.15 for every g in the library on both walks,
        and the true/null ratio within a factor 2. Structure: slope above -0.25 on
        the true walk only.
    - metric: arc_concentration_paired_difference
      direction: different
      minimum_effect: >-
        Null: class-averaged A_k(true) - A_k(null) within the bootstrap band of
        zero at every depth, including k >= k*. Structure: a depth at which the
        class-averaged A_k(true) is below 0.4 while A_k(null) stays near 0.5, at
        the two largest p.
    - metric: class_indicator_max_spike
      direction: different
      minimum_effect: >-
        Null: at the Gumbel level sqrt(2 |C| log N) for every class. Structure: a
        class family exceeding 8 times that level at the two largest p.
    - metric: modelled_localized_kangaroo_cost
      direction: lower
      minimum_effect: >-
        Reported only; under the null it equals or exceeds the rho baseline. Any
        modelled cost below 0.886 sqrt(N) is flagged for replication and review,
        never asserted.
  minimal_test:
    design: >-
      For field_bits in {12, 14, 16, 18, 20, 22, 24}, three seeds, prime-order
      curves, r in {4, 8, 16, 32}: enumerate G, tabulate logs, run the harness
      walk map F on every point, compute the lumped matrices for the frozen
      partition library and the itineraries to depth k with r^k <= sqrt(N). For
      every cell run the identical pipeline on the random-label walk. Report the
      paired differences and slopes.
    controls:
      - random-label walk with the same table and r (null of the same shape)
      - k = 1 slice as the baseline reproduction cell
      - second curve family per size
      - byte-identical regression against harness/rho.py
      - descent-symbol-driven walk on a cyclic order-2q curve as the known-true spectral object
    required_metrics:
      - lambda_2(Q_g) per partition per cell, true and null, with slope
      - class-averaged and class-minimum arc concentration per depth, true and null
      - class-indicator DL-spectrum max spike per depth, true and null
      - modelled localized-kangaroo cost from measured A, labelled modelled
      - wall seconds and peak bytes per cell
  falsification_conditions:
    - >-
      A depth k >= k* at which the class-averaged arc concentration on the true
      walk is below 0.4 while the null stays near 0.5, at the two largest p, and
      replicated on the second curve family. The uniform-spreading claim (B2) is
      FALSE at that depth; the record escalates to independent review before any
      cost is modelled beyond the readout.
    - >-
      lambda_2 on the true walk fails to decay (slope above -0.25) while the null
      decays. Claim (B1) is FALSE; the lumped operator carries coordinate
      information the constant-factor literature does not price.
    - >-
      The descent-symbol walk on the order-2q curve does NOT produce the spectral
      spike at q. The instrument is void.
    - >-
      Crashes, timeouts, memory exhaustion: infrastructure, never negative
      mathematical evidence.
  confounders:
    - >-
      Class-size effects: small classes concentrate trivially; every statistic is
      paired with the null at matched class size and never reported unpaired.
    - >-
      Multiple comparisons: r^k classes per cell; the class-minimum statistic uses
      an extreme-value null computed from the random-label walk, not a Gaussian.
    - >-
      Table degeneracy: a table with two equal logs or a log equal to zero makes
      classes collide artificially; the table is checked for distinct nonzero
      logs before any cell runs.
  interpretation_limits:
    - Toy tier. The depth cap r^k <= sqrt(N) is at most 6 symbols at r = 4 and
      N = 2^24; conclusions are about those depths only.
    - A null here closes the itinerary-class family for the harness walk at toy
      scale; it says nothing about other iteration functions and nothing about
      cryptographic scale beyond the measured slopes.
    - The exploit cost is a model derived from a measured A and is never a claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Random-mapping heuristic for itinerary classes: the depth-k itinerary class
        of the r-adding walk is distributed on the log line like a uniformly random
        subset of Z/N of the same size, for every depth with r^k <= sqrt(N).
      rigorous_support: >-
        For depths below k* the Weil-level bound on the class indicator's DL-spectrum
        (recalled, via Bombieri and Kohel-Shparlinski; unverified here) forces the
        class to be equidistributed against every character; above k* there is no
        rigorous support, which is the point of the measurement. The classical
        statement imitated is the equidistribution of a random subset.
      validation_plan: >-
        This record's arc-concentration and spectral-spike arms at every depth,
        paired with the random-label null, with the tail check that the single most
        concentrated class observed across all cells has a predicted exceedance
        probability above 1/(number of classes measured) under the null.
  target_complexity:
    time_exponent: >-
      No exponent claim. Under the null the modelled localized-kangaroo cost is at
      or above 0.886 sqrt(N). A measured class-family concentration A(N) shrinking
      like N^(-2 delta) would model to N^(1/2 - delta), which is the only route in
      this lane that could move an exponent and is predicted NOT to occur.
    memory_exponent: O(1) for the modelled exploit; O(N) for the toy measurement.
    best_known: 'Generic rho: 0.886*sqrt(N), O(1) memory; Teske constants (KN-TECH-006).'
    hidden_overhead: The k walk steps per attempt, charged; nothing hidden.
    tradeoff_note: Not applicable under the null.
  estimated_cost:
    implementation: medium
    compute: low
    note: >-
      One walk evaluation per point per r, itineraries by table lookup, lumped
      matrices by counting; a few CPU hours for the full ladder.
  recommended_priority: high
  dominated_by: null
  dominated_by_check: >-
    A measurement; not dominated on any axis by a ledger record because no record
    measures itinerary-class log concentration. Set to null after checking the
    EWALK and ENDO walk records named in the citations.
  sota_delta: >-
    Zero on the exponent by construction. Deliverable: the first measured
    obstruction (or resource) at the depths where the lane's only theorem is silent.
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: max
    resolved_model_id: null
    model_verified: false
    fallback_used: false
    degraded_requirements: []
    runtime_provenance: >-
      Authored directly in the top-level Claude Code session at max effort on the
      user's direction, not by a dispatched idea-generator subagent; no batch or
      task envelope exists for it. Model identifier not probed.
