idea:
  id: IDEA-20260830-21e7c4
  question_id: RQ-RELN-001
  added: '2026-08-30'
  title: >-
    P(decomp) IS NOT A PROBABILITY TO BE ESTIMATED, IT IS AN INTEGER RATIO THE
    HARNESS ALREADY COMPUTES AND THEN THROWS AWAY: the sampled-target estimator
    is dominated in BOTH cost and precision below the crossover B^floor(m/2) < T,
    it wastes variance by a factor 1 + N/T, and the resulting exact protocol
    yields a per-cell decidability table -- which comparisons this lane can
    settle and which are undecidable within the Tier path cost contract
  class: measurement

  claim: >-
    (A) THE OBJECT IS DETERMINISTIC. For a factor base V of B x-coordinates, the
    signed point set W = V union -V, arity m, and a declared target support H (a
    subgroup, or the whole group), the probability that a uniformly drawn target
    in H decomposes is EXACTLY
        P(decomp) = |mW intersect H| / |H|,
    an integer ratio, with no randomness anywhere except the choice of V. There
    is nothing to estimate. Every sampled-target decomposition rate in this
    program is a noisy estimate of a number the same code path can compute
    exactly.
    (B) THE COMMITTED CODE ALREADY COMPUTES IT AND DISCARDS IT.
    harness/run_saturation.py builds the three-fold set `three` in full and
    returns len(three) alongside the hit count, then estimates |three|/#E by
    testing 400 sampled targets for membership in the very set it just built.
    harness/exp_icinv.py's decomposition_rate_m2 and _m3 do the same without even
    returning the size. The sampling stage in the committed instrument is pure
    added cost and pure added noise.
    (C) THE CROSSOVER, DERIVED, WITH BOTH HONEST ESTIMATORS COSTED. The genuine
    alternative to exact enumeration is a sumset-free sampled estimator: draw T
    targets and decide each by meet-in-the-middle over W at O(B^ceil(m/2)) time
    and memory. Exact costs O(min(B^m, N*B)) time and O(min(B^m, N)) memory.
    Exact is cheaper exactly when B^floor(m/2) < T (up to the N cap). At the
    committed cells (B <= 22, m = 3, T = 400) the condition reads 22 < 400 and is
    satisfied with a factor of eighteen to spare, so EXACT IS BOTH CHEAPER AND
    ERROR-FREE AT EVERY CELL THIS LANE HAS EVER RUN.
    (D) THE PRECISION LOSS, ALSO DERIVED. For comparing two constructions with n
    factor bases each, the variance of the estimated mean coverage is
    Var_base/n under exact enumeration and (Var_base + r(1-r)/T)/n under
    sampling. With Var_base of order r(1-r)/N -- the coverage fluctuation of a
    random base of matched size -- the ratio of variances is exactly 1 + N/T.
    At N about 4000 and T = 400 the sampled estimator wastes a factor of ELEVEN
    in statistical efficiency; at N = 2^18 with T = 400 it wastes 656. The waste
    GROWS with N, which is the opposite of what an experimenter reaching for more
    targets expects.
    (E) THE DELIVERABLE, WHICH IS WHAT RQ-RELN-001 ASKS FOR. A per-cell
    decidability table over (N, B, m): the crossover verdict, the equivalence
    bound on the coverage ratio achievable at a stated budget, and that bound
    compared against the three reference effects this program has already
    derived or measured -- the 1.582 headroom ceiling (KN-FIND-007), the
    Bose-Chowla Sidon ratio 1.1071, and the small-multiples collapse to 0.0021.
    Worked pre-run instance: at N = 2^14, r = 0.2, with n = 200 exact bases per
    construction, the certifiable equivalence bound on the relative coverage
    difference is about 0.22 percent, i.e. 260 times finer than the largest
    effect that can exist. THE NO-GO HALF IS THE SAME TABLE READ THE OTHER WAY:
    any construction pair whose true coverage difference is smaller than the
    cell's bound is UNDECIDABLE at that budget, the bound falls only as
    1/sqrt(n), and the cost per base is min(B^m, N) -- so the table states, per
    cell and with numbers, what this lane can settle and what it cannot. That is
    either a frozen protocol or a scoped no-go, which are precisely the two
    outcomes the question's decision target admits.
    (F) A CONSISTENCY CHECK THAT CAN FAIL AND IS INDEPENDENTLY INFORMATIVE. The
    exact value and the sampled estimate must agree within the sampled
    estimator's own standard error. Where they do not, one of the two is biased,
    and a named candidate already exists: IDEA-20260830-1f2b8b's component C1
    predicts a mismatch exactly on curves whose target sampler reaches only the
    index-n1 subgroup <G>, with the mismatch a per-curve offset between
    |mW intersect <G>|/|<G>| and |mW|/#E. So this record's cheapest arm doubles
    as an independent detector for that record's headline component.

  mechanism: >-
    TRACKED OBJECT AND THE LOSSY-PROJECTION TEST. The tracked object is the
    SUPPORT of the multiplicity function -- the set mW intersect H, projected to
    its cardinality. Two projections are in play and distinguishing them is the
    whole content. The projection (base V) -> (multiplicity histogram) -> (its
    support size) is genuinely lossy: it forgets which targets are hit, forgets
    every multiplicity above 1, and forgets the curve beyond |H|; vast numbers of
    distinct bases share a support size. It is lossy COMPATIBLY with the
    operation the measurement performs, because membership in mW is determined by
    the group law alone and the support size is exactly what a uniform target's
    success probability integrates. The SECOND projection -- (support size) ->
    (sampled hit count out of T) -- is ALSO lossy, and that is the defect: it
    discards information the computation already held, and it is not a change of
    coordinates in the harmless direction but a strict coarsening with a
    quantified price, 1 + N/T in variance. The lossy-projection test therefore
    returns opposite verdicts on the two stages, and saying which is which is the
    proposal.
    WHY THIS IS A DISCRIMINATION AND NOT AN ASSERTION. Two accounts of the
    sampling stage are live. ACCOUNT 1: sampling buys something -- robustness to
    an enumerator bug, or feasibility at cells where the sumset does not fit, or
    a fair comparison to a solver-based pipeline that must sample. ACCOUNT 2:
    below the crossover it buys nothing and costs a factor 1 + N/T. These make
    opposite predictions that the battery separates: under ACCOUNT 1 there exist
    committed cells where the sumset does not fit or where sampling is cheaper,
    and the measured wall times show it; under ACCOUNT 2 no such cell exists in
    the entire committed ladder and the measured crossover matches
    B^floor(m/2) = T within a factor 2. The record does not assume which; it
    measures the crossover and reports where it falls.
    WHY THE EQUIVALENCE BOUND IS THE RIGHT DELIVERABLE RATHER THAN A p-VALUE.
    KN-FIND-007 fixes the mean yield identically for every base of size B, so a
    construction comparison can never be a mean comparison; it is necessarily a
    comparison of coverage at fixed mean, whose total admissible range is bounded
    above by min(1, mu)/(1 - exp(-mu)) <= 1.582. A test of "are the constructions
    different" against a null of exact equality is therefore guaranteed to reject
    eventually for any nonzero difference and says nothing useful. The decidable
    question is the equivalence one -- how small a difference can be EXCLUDED at
    a given budget -- and that is what the table reports.

  novelty_status: unverified

  citations:
    - ref: KN-FIND-007
      provenance: internal
      claim: >-
        Mean per-target yield is binomial(B+m-1,m)/N exactly for every base of
        size B, geometry-independent, measured deviation exactly 0 over 144
        cells; coverage <= min(1, mean) with equality iff no target has two
        decompositions; the one-relation-per-target gain is bounded by
        min(1,mu)/(1 - exp(-mu)) <= 1.582, maximised at mu = 1; a Bose-Chowla
        Sidon base attains the ceiling at a measured coverage ratio of 1.1071 and
        the H017 small-multiples base collapses to 0.0021 at N about 2^18 with a
        concentration statistic of 1224x. Explicitly: only coverage, relation
        rank, recognizability and solve cost are worth measuring.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-007.md, all 96 lines.
    - ref: 'harness/run_saturation.py (decomposition_rate_m3_with_size, measure_at_density)'
      provenance: internal
      claim: >-
        decomposition_rate_m3_with_size builds the complete two-fold and
        three-fold sets by enumeration, returns (hits, trials, len(three)), and
        computes hits by testing each sampled target for membership in `three`.
        measure_at_density then forms densities_per_curve = size3v / rec.order --
        the exact quantity -- and separately forms rates from the sampled hits,
        reporting the variance of the sampled rates against a binomial null. The
        exact and the sampled estimate of the same number are both present in the
        same function.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        harness/run_saturation.py, all 203 lines.
    - ref: 'harness/exp_icinv.py (decomposition_rate_m2, decomposition_rate_m3, max_possible_sums, targets_uniform)'
      provenance: internal
      claim: >-
        Both rate functions build the full sumset as a set of points and return
        only (hits, len(targets)), discarding the sumset size. max_possible_sums
        computes binomial(2B+m-1, m) with n = 2*fb_size, i.e. the conservation
        total for the signed point set, and is used only as a normalizer for
        decomposition_efficiency. targets_uniform draws targets as multiples of a
        single maximal-order point, so the declared target support is the cyclic
        subgroup <G>, not necessarily E(F_p).
      verified_by: >-
        Read this session (Read tool, 2026-08-29): harness/exp_icinv.py lines
        1-232 and 278-478, including the full bodies of all four functions.
    - ref: IDEA-20260805-4ddd8c
