  assumptions:
    - >-
      That the declared target support H is recorded with every measurement. The
      exact identity P = |mW intersect H|/|H| is only meaningful once H is named,
      and the committed instrument's H is the cyclic subgroup generated by one
      sampled point, which is not always E(F_p). A protocol that omits H is not
      comparable across constructions, which is the same defect
      IDEA-20260829-c6e7a4 identifies on the factor-base side.
    - >-
      That the enumerated set mW is correct. This record measures a cost and a
      precision, not a correctness; the correctness of the negative half is
      IDEA-20260830-d2ebb5's certificate suite, and this record's exact values
      are only as good as that suite. The two are sequenced deliberately.
    - >-
      That Var_base, the coverage fluctuation across random bases of matched
      size, is of order r(1-r)/N. This is heuristic H1 below and it is measured,
      not assumed; the efficiency factor 1 + N/T depends on it.
    - >-
      That memory, not time, is the binding constraint on exact enumeration at
      large N, so the crossover N* is a memory crossover. Measured directly.
    - >-
      Toy scale binds. All arms are at p <= 2^18-scale groups; nothing transfers
      to cryptographic scale and nothing is offered that does.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes both the cost and the precision of
      every P(decomp) number in this lane: the sampled-target membership loop,
      which runs AFTER the full sumset has been constructed and which estimates a
      quantity the constructed object already determines.
    baseline_embedding:
      parameter_slice: >-
        T -> infinity with the sumset built. In that limit the sampled estimator
        converges to |mW intersect H|/|H|, which is the exact estimator's output,
        so the exact estimator is the T = infinity boundary of the committed
        instrument rather than a different measurement. That is the embedding,
        and it is exact rather than a resemblance.
      reproduction_check: >-
        Frozen fixture: at each committed cell, the exact value must lie within
        the sampled estimator's own 95 percent interval at T = 400, and the
        sampled estimate must converge to the exact value as T is raised through
        {100, 400, 1600, 6400} at the rate 1/sqrt(T). A systematic gap that does
        not close is a bias in one of the two and is reported before anything
        else.
    observation_collision:
      observable: >-
        The scalar reported decomposition rate at one cell.
      distinct_preimage_search: >-
        COLLISION EXHIBITED. Two distinct ground-truth states give the same
        reported rate: (a) a base whose sumset covers a fraction r of E(F_p)
        uniformly across cosets, measured against H = E(F_p); and (b) a base
        whose sumset covers a fraction r' of E(F_p) with a coset bias such that
        |mW intersect <G>|/|<G>| = r, measured against H = <G> with r' not equal
        to r. The reported scalar is identical and the two lie on opposite sides
        of the conclusion "this construction covers more targets". The separating
        additional condition is the declaration of H and the reporting of the
        coset-count vector, which this record makes mandatory fields. Without
        them the observable is not identifying, which is the concrete reason
        archived rates from different constructions may not be comparable.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the estimation problem by an exact counting problem: report the
          integer pair (|mW intersect H|, |H|) instead of a rate with an error
          bar. Encoding obligation: the pair determines the rate. Completeness:
          the enumeration is exhaustive by construction. Soundness: delegated to
          IDEA-20260830-d2ebb5's certificate. Transfer: none above the memory
          crossover. Cost loss: memory min(|mW|, N) instead of a sampled
          estimator's O(B^ceil(m/2)).
        predicted_gain: >-
          Sampling variance to exactly zero, and a statistical efficiency gain of
          1 + N/T for construction comparisons at fixed budget -- 11x at the
          committed cells, 656x at N = 2^18 with T = 400.
      - transform: specialization_pack
        proposed_object: >-
          Build the decidability measure per cell -- equivalence bound versus
          budget -- and add charges only over cells whose enumerations are
          disjoint, so the table's totals are additive and no cell is
          double-counted against the Tier path cost contract.
        predicted_gain: >-
          Converts "run the ladder and see" into a pre-run statement of which
          cells can settle which comparison, at what cost.
    quantifier_order: >-
      FOR ALL factor bases V of size B, FOR ALL arities m, FOR ALL target
      supports H, THERE EXISTS an exactly computable integer pair determining
      P(decomp), and its computation cost is below the sumset-free sampled
      estimator's cost WHENEVER B^floor(m/2) < T. The witness (the enumeration)
      may depend on V, m and H; it may NOT depend on the target draw, on the
      seed, or on the curve beyond its group law -- and that independence is the
      falsifiable content, because a measured dependence of the exact value on the
      target seed would mean the instrument is not computing what this record says
      it computes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim available is a per-cell EQUIVALENCE bound at toy
        scale: "at this cell, with this budget, any coverage-ratio difference
        larger than X between the two named constructions would have been
        detected". It can never certify that two constructions are identical, can
        never certify anything above the memory crossover N*, and can never
        convert a coverage statement into a statement about solve cost or
        relation rank -- KN-FIND-007 is explicit that yield says nothing about
        either, and this record inherits that limit unchanged.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion must FAIL: the
        small-multiples base, whose coverage ratio KN-FIND-007 measured at 0.0021
        with concentration 1224x. The exact protocol must separate it from a
        matched random base with overwhelming margin at every cell. If the table
        declares that pair undecidable at a cell, the table's calibration is
        wrong, because that difference is enormous and derivable. Symmetrically,
        the Bose-Chowla Sidon base at ratio 1.1071 must be separated from random
        wherever the table says it can be, and must NOT be claimed separated
        where the table says it cannot.
    proof_obligations:
      - claim: >-
          P(decomp) for a uniform target in H equals |mW intersect H|/|H|
          exactly.
        responsibility: correctness
      - claim: >-
          Exact enumeration costs O(min(B^m, N*B)) time and O(min(B^m, N))
          memory; the sumset-free sampled estimator costs O(T*B^ceil(m/2)) time
          and O(B^ceil(m/2)) memory; the crossover is B^floor(m/2) = T.
        responsibility: runtime
      - claim: >-
          The variance ratio of the two estimators for a construction-mean
          comparison is 1 + N/T under H1.
        responsibility: size
      - claim: >-
          The exact estimator is the T -> infinity boundary of the committed one
          and reproduces it within its interval at every cell.
        responsibility: baseline
      - claim: >-
          The equivalence bound scales as 1/sqrt(n) and the cost per base as
          min(B^m, N), so the table's cost column is honest.
        responsibility: scope

  predictions:
    - metric: >-
        Measured wall-time crossover between exact enumeration and the
        sumset-free MITM sampled estimator, as a function of B at m = 3 and
        T = 400
      direction: different
      minimum_effect: >-
        The crossover must occur at B within a factor 2 of T = 400, i.e. the
        predicted condition B^floor(3/2) = B < T. Since the committed ladder
        stops at B = 22, the prediction is that EXACT IS CHEAPER AT EVERY
        COMMITTED CELL, by a factor of roughly T/B = 18 at B = 22 and 100 at
        B = 4. A measured crossover below B = 50 falsifies the cost model and the
        record must republish it.
    - metric: >-
        Statistical efficiency ratio of the exact and sampled estimators for a
        construction-mean comparison, measured as the ratio of empirical variances
        of the estimated mean coverage over n = 200 bases
      direction: higher
      minimum_effect: >-
        Predicted 1 + N/T, i.e. about 11 at N = 4001 with T = 400 and about 41 at
        N = 2^14 with T = 400. Pre-registered acceptance: measured within 25
        percent of the prediction at each cell. A measured ratio near 1 falsifies
        H1's estimate of Var_base -- meaning base-to-base variation dwarfs
        sampling noise -- and is itself a first-class finding, because it would
        say construction comparisons are limited by the base draw and not by the
        target draw, which changes the entire budget allocation.
    - metric: >-
        Exact-versus-sampled consistency: the standardized gap between
        |mW intersect H|/|H| and the sampled rate, per curve, per cell
      direction: different
      minimum_effect: >-
        Predicted to be standard normal with mean 0 under a correct instrument.
        Pre-registered: at most 5 percent of curve-cells exceed 2 sigma. A
        systematic gap correlating with n1, the index of the target support in
        E(F_p), CONFIRMS IDEA-20260830-1f2b8b's component C1 through an
        independent route; a systematic gap uncorrelated with n1 is a new,
        unnamed bias and halts the battery.
    - metric: >-
        Certifiable equivalence bound on the relative coverage difference between
        two constructions at n bases per construction, exact enumeration
      direction: lower
      minimum_effect: >-
        Predicted about 0.22 percent at N = 2^14, r = 0.2, n = 200, against a
        maximum possible effect of 58.2 percent (the 1.582 ceiling) -- a
        resolution 260 times finer than the largest effect that can exist. The
        bound must scale as 1/sqrt(n) across n in {25, 50, 100, 200}, verified
        empirically rather than asserted. A bound that does not scale as
        1/sqrt(n) means the base draws are correlated and the table must be
        recomputed with the measured correlation.
    - metric: >-
        Calibration on the two derived reference geometries: small-multiples
        (coverage ratio 0.0021) and Bose-Chowla Sidon (1.1071), against a matched
        random base
      direction: different
      minimum_effect: >-
        Both must be separated from random with the exact protocol at every cell
        of the table, with the measured ratios reproducing KN-FIND-007's
        committed values to the printed precision. Failure to reproduce a
        committed number from a cheaper instrument means the instrument is wrong,
        and NO decidability verdict from it is admissible.
    - metric: >-
        Memory crossover N*: the largest group order at which the exact sumset
        fits within the declared memory budget
      direction: different
      minimum_effect: >-
        Measured, not predicted, and reported with the budget. Above N* the table
        must mark cells as sampled-only and must attach the corrected null of
        IDEA-20260830-1f2b8b to them. A table that marks no cell sampled-only has
        not probed its own boundary and must extend the ladder until it does.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, algebra, HARD GATE). Write out the identity
      P = |mW intersect H|/|H|, the two cost models, and the variance ratio
      1 + N/T. Verify the crossover condition symbolically. If the cost models
      disagree with the committed code's actual structure, republish before
      running.
      STAGE 1 (minutes, reproduction gate). At each committed cell, compute the
      exact value and check it lies inside the archived sampled estimator's 95
      percent interval. Raise T through {100, 400, 1600, 6400} at one cell and
      check 1/sqrt(T) convergence to the exact value.
      STAGE 2 (tens of minutes, the cost measurement). Implement the sumset-free
      MITM sampled estimator (the honest alternative) and time both estimators
      across B in {4, 8, 16, 32, 64, 128, 256, 512} at m = 2 and m = 3, at
      N in {2^12, 2^14, 2^16, 2^18}, recording wall time, operation counts and
      peak RSS. Locate the measured crossover and the memory crossover N*.
      STAGE 3 (tens of minutes, the precision measurement). n = 200 random bases
      per cell; compute exact coverage for each and the sampled estimate at
      T = 400 for each; report the empirical variance of both estimated means and
      their ratio against 1 + N/T.
      STAGE 4 (minutes, calibration). Small-multiples and Bose-Chowla arms
      against matched random, reproducing 0.0021 and 1.1071.
      STAGE 5 (zero compute, the deliverable). The decidability table: per cell,
      crossover verdict, memory verdict, equivalence bound at three budgets, and
      the DECIDABLE or UNDECIDABLE label with the number that justifies it. Plus
      the mandatory-metadata block (declared support H, denominator group, sign
      convention, arity) without which a rate is not comparable.
      ENVELOPE. Pure Python plus integer arithmetic; no solver, no Groebner
      basis, no Macaulay matrix, so the GOAL-DREG-001 memory wall cannot be
      reached. Predicted under two hours on one core for the full ladder with
      peak RSS under 2 GB at the N = 2^18 cells, both reported rather than
      asserted, and the N = 2^18 cells dropped rather than swapped if the budget
      binds.
    controls:
      - >-
        REPRODUCTION GATE (blocking): the exact value must sit inside the
        archived sampled interval at every committed cell before any new claim is
        made. This control can fail and would indicate a bias in one estimator.
      - >-
        POSITIVE CONTROL, SMALL-MULTIPLES BASE (must fire): coverage ratio 0.0021
        at N about 2^18 per KN-FIND-007. A protocol that cannot separate this
        from random has no power and no negative from it is admissible.
      - >-
        POSITIVE CONTROL, BOSE-CHOWLA SIDON BASE (must fire, opposite direction):
        ratio 1.1071. Two controls firing in opposite directions bound the
        instrument on both sides where a single null does not.
      - >-
        NULL OBJECT: two independently seeded random bases of the same size
        compared against each other. The equivalence test must return
        "indistinguishable within the bound" and the bound must be reported. If
        two draws of the SAME construction are declared different, the test's
        false-positive rate is wrong and the table is void.
      - >-
        T-LADDER CONTROL: 1/sqrt(T) convergence of the sampled estimator to the
        exact value, which is the check that the two estimators target the same
        quantity at all.
      - >-
        SUPPORT DECLARATION CONTROL: every cell records H explicitly and the
        coset-count vector of mW against H, because the observation collision in
        the proof map shows the scalar rate is not identifying without it.
      - >-
        ORDERING CONTROL: the cost models, the predicted crossover and the
        predicted variance ratio are committed to the run directory before Stage
        2 executes, and outputs are compared against the committed file.
    required_metrics:
      - 'exact |mW intersect H| and |H| per cell, as integers'
      - 'sampled rate, its standard error, and the standardized exact-versus-sampled gap per curve-cell'
      - 'wall time, operation count and peak RSS for both estimators across the B and N ladders'
      - 'measured cost crossover in B and measured memory crossover N*, with the budget stated'
      - 'empirical variance of the estimated construction mean under both estimators, and their ratio against 1 + N/T'
      - 'equivalence bound at n in {25, 50, 100, 200}, with the 1/sqrt(n) scaling check'
      - 'small-multiples and Sidon calibration ratios against the committed 0.0021 and 1.1071'
      - 'coset-count vector of mW against H per cell, and the declared metadata block'
      - 'the decidability table with a DECIDABLE or UNDECIDABLE label and its justifying number per cell'

  falsification_conditions:
    - >-
      The measured cost crossover falls below B = 50 at m = 3. The cost model is
      wrong, sampling is not dominated at the committed cells, and the headline
      collapses to a precision argument only.
    - >-
      The measured statistical efficiency ratio is near 1 rather than 1 + N/T.
      H1's estimate of the base-to-base coverage variance is wrong, construction
      comparisons are base-limited rather than target-limited, and the entire
      budget allocation this record recommends is wrong in an informative
      direction.
    - >-
      The exact value falls outside the archived sampled interval at a
      substantial fraction of cells with no correlation to n1. An unnamed bias
      exists in one estimator; the battery halts and reports it rather than
      publishing a table.
    - >-
      The equivalence bound does not scale as 1/sqrt(n). Base draws are
      correlated and the table must be recomputed with the measured correlation,
      which would raise every bound.
    - >-
      Either calibration control fails to reproduce its committed value. The
      instrument cannot see a known effect and no decidability verdict is
      admissible.
    - >-
      The null-object arm declares two draws of the same construction different.
      The false-positive rate is mis-specified and the table is void.
    - >-
      No cell of the extended ladder is sampled-only. The memory crossover was
      not reached, the table's boundary is unprobed, and the no-go half of the
      deliverable is unsupported.

  confounders:
    - >-
      EXACT IS NOT CORRECT. An exhaustive enumeration with a bug gives a
      confidently wrong integer, and removing sampling noise removes the only
      thing that was visibly noisy. This is the single largest risk of adopting
      the record's recommendation, and the mitigation is explicit sequencing:
      IDEA-20260830-d2ebb5's certificate suite is a PREREQUISITE, not a
      companion. A protocol that mandates exact enumeration without mandating the
      certificate is worse than the one it replaces.
    - >-
      THE COMPARISON IS NOT THE ONE THE QUESTION ASKS UNTIL THE CONSTRUCTIONS
      ARE DEFINED. The table is parameterised by (N, B, m, H) and is computable
      without knowing what the Semaev and Petit-Kosters-Messeng prime-field bases
      actually are; but naming a cell DECIDABLE for those two constructions
      requires their definitions, which this session did not obtain. The table is
      therefore delivered as construction-agnostic, and the construction-specific
      verdict is explicitly blocked on a literature fixture.
    - >-
      VAR_BASE IS NOT A CONSTANT ACROSS GEOMETRIES. A structured base has a
      different base-to-base variance from a random one, so 1 + N/T is the
      efficiency gain for the RANDOM arm and must be recomputed per geometry. The
      table reports it per geometry rather than quoting one number.
    - >-
      TOY-SCALE TIMINGS ARE INTERPRETER-BOUND. Wall-time ratios at these sizes are
      dominated by Python overhead, so operation counts are reported alongside
      every timing and the crossover is read off the operation counts, with the
      timing as a consistency check rather than as the measurement.
    - >-
      1 + N/T GROWS WITH N, WHICH FLATTERS THE RECOMMENDATION EXACTLY WHERE THE
      RECOMMENDATION STOPS APPLYING. Above the memory crossover N* exact
      enumeration is unavailable and the efficiency gain is unavailable with it;
      quoting 656x at N = 2^18 while N* sits below 2^18 would be a fabrication of
      applicability. The table reports the gain and the availability in the same
      row for exactly this reason.
    - >-
      AUTHORSHIP ASYMMETRY. "The existing instrument is wasteful" is cheap to
      produce and reads as rigour. The null-object arm, the reproduction gate and
      the pre-registered crossover are there so that "sampling was fine" is a
      reachable, publishable outcome.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO ALGORITHM. This is a measurement-design and
      budgeting record at toy scale.
    - >-
      Nothing here says anything about the COST OF FINDING a decomposition. The
      exact enumeration is not an algorithm an attacker could run: it enumerates
      the whole sumset, which is why it is affordable only at toy scale and why
      KN-FIND-007's boundary -- that yield says nothing about the
      point-decomposition solve or the linear algebra -- applies unchanged.
    - >-
      An UNDECIDABLE verdict at a cell is a statement about that cell's budget,
      not about the constructions. It does not say the constructions are the
      same, does not close RQ-RELN-001, and may not be quoted as a negative
      result about factor-base design.
    - >-
      Freezing the protocol, mandating the metadata block, or amending any
      committed record is a Coordinator decision. Nothing here performs one and
      no hypothesis status is moved.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was screened by reading all twelve
      RQ-RELN-001 proposal titles and four of them substantially, plus
      KN-FIND-007, EV-ENDO-10109d and the harness source. IDEA-20260805-4ddd8c
      and IDEA-20260805-a25f11 already propose exact-enumeration censuses and are
      credited above; what this record adds is the cost crossover, the efficiency
      factor, the equivalence-bound table and the decidability verdict, none of
      which appears in either. One web search was run this session. Honest
      status: unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For factor bases of size B drawn uniformly at random on a curve of order
        N, the coverage |mW|/N has variance across bases of order r(1-r)/N with
        r the mean coverage, i.e. the coverage of a random base concentrates like
        a sum of N weakly dependent indicators; consequently the exact-versus-
        sampled variance ratio for a construction-mean comparison is 1 + N/T.
      rigorous_support: >-
        The RIGOROUS ingredient is KN-FIND-007's conservation identity, which
        fixes the first moment exactly for every base and therefore removes the
        mean entirely from the comparison, leaving only the coverage deficit; and
        the exact bound coverage <= min(1, mu), which caps the range. The
        CLASSICAL STATEMENT IMITATED is the Poisson occupancy limit for a
        balls-in-bins process with binomial(2B+m-1,m) balls and N bins, under
        which the number of occupied bins has variance
        N*exp(-mu)(1 - (1+mu)exp(-mu)), of order N*r(1-r) for moderate mu, giving
        variance r(1-r)/N for the coverage fraction. THE GAP is the independence
        of the placements, which is false in detail because the sums are algebraic
        and the base is plus-minus symmetric -- IDEA-20260805-a25f11 derives
        exactly the forced dependence that breaks it at m = 2.
      validation_plan: >-
        SAMPLE: n = 200 independent random bases per cell, at B in {8, 16, 32}
        and N in {2^12, 2^14, 2^16}, with coverage computed EXACTLY for every
        base -- so the sampled quantity has no measurement error at all and the
        empirical variance is the estimand itself. Roughly 1800 exact
        enumerations, each inside the committed envelope. COMPARISON
        DISTRIBUTION: the Poisson-occupancy prediction
        N*exp(-mu)(1-(1+mu)exp(-mu))/N^2 for the coverage variance, compared by
        the ratio of empirical to predicted variance with a chi-square interval
        at the 1 percent level per cell. TAIL CHECKS: (a) the most extreme
        coverage observed against the occupancy upper tail at 1/1000; (b) the
        empirical variance at m = 2, where the negation-forced dependence is
        largest and the model should fail FIRST -- a measured excess there and
        agreement at m = 3 would localise the failure to the mechanism
        IDEA-20260805-a25f11 names, which is a more useful outcome than uniform
        agreement. RECORDED PARAMETERS: N, B, m, n, seed lineage. TRANSFER
        ASSUMPTIONS: none; the efficiency factor is recomputed per cell and never
        extrapolated.
    - id: H2
      statement: >-
        The identity P(decomp) = |mW intersect H|/|H| for a uniformly drawn
        target in H is exact and unconditional, and the cost models
        O(min(B^m, N*B)) for exact enumeration and O(T*B^ceil(m/2)) for the
        sumset-free sampled estimator hold up to constant factors independent of
        the curve.
      rigorous_support: >-
        NOT HEURISTIC IN ITS FIRST HALF, and this entry exists to say which half
        is which. The identity is a definition unrolled: a uniform target lies in
        a fixed subset with probability equal to that subset's density, exactly.
        The COST MODEL half is an ordinary algorithmic count -- the m-fold sumset
        is built by m-1 rounds of pairwise addition against W, and the
        meet-in-the-middle test splits the multiset into halves of sizes
        ceil(m/2) and floor(m/2) -- and the only assumption is that constant
        factors do not depend on the curve, which is checkable by timing at fixed
        (B, m, N) across curves.
      validation_plan: >-
        SAMPLE: operation counts and wall times for both estimators at every cell
        of the B and N ladders, plus a fixed-(B, m, N) sweep across 12 curves to
        test curve-independence of the constants. COMPARISON: the predicted
        exponents read off a log-log regression of operation count against B,
        required to match m and ceil(m/2) within 0.1. TAIL CHECKS: the slowest
        cell against the model, and the memory crossover located by bisection
        rather than assumed. If the measured exponents disagree with the model,
        the crossover is republished from the MEASURED exponents and the record's
        headline is restated with them. TRANSFER: none above the measured N*.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. Under
      docs/target-result-profile.md this is explicitly NON-TARGET-CLASS. The
      exponents that appear are the MEASUREMENT's own: exact enumeration at
      O(min(B^m, N*B)) group operations against the sumset-free sampled
      estimator's O(T*B^ceil(m/2)), giving the crossover B^floor(m/2) = T. These
      are instrument costs, not attack costs, and no reader may quote them as
      cryptanalytic.
    memory_exponent: >-
      O(min(B^m, N)) for exact enumeration -- the binding constraint and the
      reason a crossover N* exists at all -- against O(B^ceil(m/2)) for the
      sampled estimator. The memory crossover is measured rather than predicted
      and is the honest boundary of the recommendation.
    best_known: >-
      The incumbent for this measurement is the committed sampled-target
      estimator in harness/exp_icinv.py and harness/run_saturation.py at T = 400.
      For the underlying hard problem the frontier remains Pollard rho at
      0.886*sqrt(N) time with O(1) memory and its van Oorschot-Wiener
      parallelization; nothing here approaches it, and the exact enumeration is
      explicitly not an attack because it enumerates the whole sumset.
    hidden_overhead: >-
      Two disclosed honestly. First, the efficiency gain 1 + N/T is only
      available below the memory crossover N*, and quoting it above N* would be a
      fabrication of applicability. Second, exact enumeration removes the visible
      noise without removing error: an enumerator bug becomes a confidently wrong
      integer, which is why IDEA-20260830-d2ebb5's certificate is a prerequisite
      and is named as one rather than recommended.
    tradeoff_note: >-
      The genuine tradeoff this record quantifies is memory for precision: exact
      enumeration buys zero sampling variance and a factor 1 + N/T in efficiency
      at the price of min(|mW|, N) storage, while the sampled estimator holds
      O(B^ceil(m/2)) and pays the variance. Above N* the tradeoff is unavailable
      and the corrected sampled null of IDEA-20260830-1f2b8b becomes mandatory.
      No cryptanalytic time-memory tradeoff is involved; no algorithm is produced.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK it
    mounts none and is dominated on every axis by every frontier row checked:
    Pollard rho, parallel rho with distinguished points, multi-target rho, BSGS,
    van Oorschot-Wiener at memory w, the preprocessing/advice frontier, and MITM
    two-table index calculus. As a STATEMENT ABOUT MEAN YIELD it is strictly
    dominated by KN-FIND-007, quoted not extended. As an EXACT-ENUMERATION CENSUS
    it is dominated in scope by IDEA-20260805-4ddd8c (which proposes the same
    enumeration for the second moment Xi, with an exact null) and by
    IDEA-20260805-a25f11 (which proposes the graded additive-energy census and
    derives the collision floor and the B > (N/2)^(1/3) threshold); this record
    measures neither Xi nor the deficit and adds only the cost crossover, the
    efficiency factor, the equivalence bound and the decidability verdict, which
    neither of those records computes. As a DECIDABILITY TABLE for construction
    comparisons no prior record exists in this corpus. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis. Quantified deliverable, on the measurement
    axis: the committed instrument's sampling stage is shown to be dominated in
    cost by a factor of about T/B (18x at the largest committed cell, 100x at the
    smallest) and in statistical efficiency by 1 + N/T (11x at the committed
    primes, 41x at N = 2^14, 656x at N = 2^18) whenever B^floor(m/2) < T; the
    resulting exact protocol certifies coverage-ratio equivalence to about 0.22
    percent at N = 2^14 with 200 bases per construction, against a maximum
    possible effect of 58.2 percent, i.e. 260x finer than the largest effect that
    can exist; and the same numbers, read the other way, give the first per-cell
    statement in this program of which construction comparisons are decidable
    within the Tier path cost contract and which are not.

  estimated_cost:
