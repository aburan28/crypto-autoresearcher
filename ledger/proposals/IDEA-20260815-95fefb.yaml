idea:
  id: IDEA-20260815-95fefb
  question_id: RQ-ICEX-001
  added: '2026-08-15'
  title: >-
    AN EXPONENT COMPARISON NEEDS BOTH SIDES MEASURED ON THE SAME INSTANCES:
    require index calculus and rho to be run on one frozen instance set,
    because comparing per-side averages over different instances is not a
    comparison
  class: control

  claim: >-
    The lane will compare a charged index-calculus exponent against rho. If
    the two are measured on separately generated instance sets, instance-to-
    instance difficulty variation enters the comparison as bias. Running
    both on one frozen, certificate-carrying instance set makes the
    comparison paired, which removes that variance entirely and costs
    nothing extra.

  mechanism: >-
    Freeze one instance set with certificates. Require every method to run
    on exactly those instances. Report paired per-instance ratios rather
    than per-side averages, with the pairing enforced by the harness rather
    than by convention.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of RQ-ICEX-001's decision target and constraints; grep 'paired
      comparison', 'frozen instance set', 'matched instances'.
    results: >-
      The lane requires matched rho/BSGS controls; no record specifies
      instance-level pairing or reports paired ratios rather than side
      averages.
    verdict: >-
      ADAPTATION. Paired experimental design is elementary; the
      contribution is making it a harness-enforced requirement for the
      lane's headline comparison.

  object_first_candidate:
    tracked_object: >-
      THE PER-INSTANCE COST RATIO between methods, replacing the ratio of
      per-side averages.
    lossiness: >-
      Averaging within a side before comparing discards the pairing, which
      is the variance-reduction the design exists for.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while both methods can run on identical instances;
      instances where one method fails are the interesting cases and are
      reported rather than dropped.

  null_object_control: >-
    NULL 1 -- the same method run twice on the frozen set, whose paired
    ratio must be one within noise; a deviation means the harness is not
    truly pairing. NULL 2 -- deliberately different instance sets per side,
    reproducing the unpaired comparison so the variance reduction can be
    quantified rather than asserted.

  discriminated_from:
    - >-
        The lane's existing matched-controls requirement, which this makes
        instance-level and harness-enforced rather than conventional.
    - >-
        The measured-rho-baseline record in this series, which supplies
        one side of the comparison and must consume the same frozen set.

  assumptions:
    - >-
        Both methods can run on the same instances; if index calculus
        requires a differently generated instance the comparison is not
        paired and that must be reported, not worked around.
    - >-
        The frozen set is large enough for the paired ratio's interval to
        be useful.

  predictions:
    - metric: >-
        same-method-twice null
      direction: different
      minimum_effect: >-
        FORCED ratio one within noise; deviation means the pairing is
        not real.
    - metric: >-
        unpaired reproduction
      direction: different
      minimum_effect: >-
        Quantifies the variance the pairing removes, turning the design
        choice into a measured benefit.
    - metric: >-
        instances where one method fails
      direction: different
      minimum_effect: >-
        Reported explicitly; dropping them would bias the paired ratio
        toward whichever method fails on hard instances.

  minimal_test:
    design: >-
      One frozen set of thirty certificate-carrying instances, both
      methods, both nulls.
    controls:
      - >-
          Same-method-twice pairing null.
      - >-
          Unpaired reproduction for variance comparison.
      - >-
          Failed instances reported, never dropped.
      - >-
          Certificates on every instance in the frozen set.
    required_metrics:
      - >-
          Paired per-instance ratios with intervals.
      - >-
          Variance under paired versus unpaired designs.
      - >-
          List of instances where either method failed.
      - >-
          Frozen set manifest with hashes.

  falsification_conditions:
    - >-
        The same-method-twice null deviates from one. Pairing is not real;
        the design does not work.
    - >-
        Index calculus cannot run on the same instances. The comparison
        cannot be paired and must be reported as unpaired with its
        variance penalty stated.
    - >-
        Failed instances cluster on one side. The paired ratio is biased
        and must be reported with the failures rather than over the
        survivors.
    - >-
        Pairing removes substantial variance. The lane's comparison
        becomes materially sharper at no extra cost, which is the record's
        payoff.

  confounders:
    - >-
        SURVIVOR BIAS: dropping instances where one method fails compares
        the methods on the subset the weaker one could handle, which
        flatters it.
    - >-
        INSTANCE-GENERATION COUPLING: if the frozen set is generated in a
        way that favours one method, pairing removes variance but not
        bias.

  interpretation_limits:
    - >-
        An experimental-design requirement; produces no comparison result
        itself.
    - >-
        Pairing removes instance variance, not generation bias.
    - >-
        Scoped to methods that can run on identical instances.

  heuristic_assumptions:
    - id: HEUR-ICEX-PAIR-1
      statement: >-
        Instance-to-instance difficulty variation is a substantial share
        of the total variance in the lane's comparison, so pairing
        materially narrows the interval.
      rigorous_support: >-
        Rigorous ingredient: for paired designs the variance of the
        difference excludes the shared instance effect, which is exact.
        THE GAP: the size of the instance effect for ECDLP at toy scale
        is unmeasured, and if instances are nearly interchangeable the
        pairing buys almost nothing -- which the unpaired reproduction
        measures directly rather than assuming.
      falsification_condition: >-
        Paired and unpaired designs giving intervals of similar width.
      validation_plan: >-
        SAMPLE: 30 instances, both designs. COMPARISON: interval width,
        paired versus unpaired. TAIL CHECK: the instances with the most
        extreme per-instance ratios. TRANSFER: none beyond the frozen
        set.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is the lane's existing runs, reorganised onto
      one instance set.
    memory_exponent: >-
      Unchanged from the lane's existing profile.
    best_known: >-
      The incumbent is the lane's matched-controls convention, which this
      makes instance-level and enforceable.
    hidden_overhead: >-
      Instances where one method fails are the hidden term: how they are
      handled determines whether the paired ratio is honest.
    tradeoff_note: >-
      Pairing costs nothing and buys variance reduction, provided both
      methods can run on the same instances; where they cannot, the honest
      report is an unpaired comparison with its penalty stated.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a comparison: the lane owns that and this
    record only constrains its design. As a paired-design requirement: not
    currently specified at instance level. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an instance-level paired
    design for the lane's headline comparison, a measured quantification of
    the variance pairing removes, and an explicit policy for instances where
    one method fails.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that both methods can run on identical instances, which is the
    design's precondition. 0.9 that the pairing null behaves if so. 0.5 that
    pairing narrows the interval enough to matter, which the unpaired
    reproduction measures rather than assumes.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
