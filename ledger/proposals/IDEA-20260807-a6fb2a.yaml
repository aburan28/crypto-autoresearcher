idea:
  id: IDEA-20260807-a6fb2a
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    ARITHMETIC SIZE IS LEVEL-BLIND BUT ALGEBRAIC SIZE IS NOT: bit length, Hamming
    weight and multiplicative order of j are uniform at every volcano level
    because reduction mod p destroys height, yet the MINIMAL DEGREE OF A
    SMALL-COEFFICIENT INTEGER POLYNOMIAL ANNIHILATING j -- which is h(disc End E)
    -- grows with the conductor, giving an LLL-based level detector that uses no
    isogeny computation at all, plus a named coefficient-sparsity artifact at
    j = 0 and j = 1728 that a random isomorphic remodelling must kill
  class: representation

  claim: >-
    (A) THE NEGATIVE HALF, STATED SHARPLY. Over F_p there is no archimedean size.
    The j-invariants of the curves at level i of the ell-volcano are the roots in
    F_p of the Hilbert class polynomial H_{D_K f^2}(X) mod p, where f is the
    conductor at that level. REDUCTION MOD p DESTROYS HEIGHT: a root of a
    degree-h polynomial modulo p is an element of F_p and carries no residual
    smallness. Therefore every ARITHMETIC size functional -- bit length of the
    canonical representative in [0, p), Hamming weight, popcount of (a, b),
    multiplicative order of j in F_p^*, the height of the smallest rational
    number congruent to j modulo p by rational reconstruction -- is predicted to
    be indistinguishable from its distribution on a uniform random element of
    F_p, AT EVERY LEVEL, INCLUDING THE CRATER. This is a prediction with a
    direction and an effect size, not a shrug: the Kolmogorov-Smirnov distance
    between the level-i sample and the uniform reference must lie inside the
    sampling band, at every level.

    (B) THE POSITIVE HALF, AND IT IS THE POINT OF THE RECORD. There is a size
    functional that DOES see the level, and it is algebraic rather than
    arithmetic. Define
      d(j) = the least d such that there exist integers (c_0, ..., c_d), not all
             zero, with |c_i| <= C and sum_i c_i j^i congruent to 0 mod p,
    for a declared coefficient bound C. Because the level-i j-invariants are
    roots of H_{D_K f^2} mod p, a curve at conductor f satisfies such a relation
    at degree h(D_K f^2) with the coefficients of that class polynomial. And
    h(D_K f^2) = h(D_K) * f * (w_f/w_1) * prod_{l | f} (1 - (D_K/l)/l), which
    GROWS ESSENTIALLY LINEARLY IN f -- the exact formula machine-checked at 180
    cells in IDEA-20260805-38aebb. So:
      ASCENDING THE VOLCANO STRICTLY REDUCES THE ALGEBRAIC DEGREE OF j.
    At the crater of a class-number-one class, h(D_K) = 1 and j is the reduction
    of one of the thirteen RATIONAL CM j-invariants (the class-number-one
    discriminants -3, -4, -7, -8, -11, -12, -16, -19, -27, -28, -43, -67, -163;
    RECALLED, standard, and checkable directly by table lookup at toy scale). At
    a level with conductor f the degree is about f * h(D_K). The signal is real,
    it is graded, and it is a function of the SCALAR conductor f, not of any
    single ell-coordinate -- which places it squarely in the H_size branch of
    IDEA-20260807-a2b59a's trichotomy, and that record's factorial is what would
    confirm it.

    (C) THE DETECTOR, AND WHY IT IS INTERESTING BEYOND MEASUREMENT. d(j) is
    computable by LLL on the lattice generated by the rows of the (d+1) x (d+2)
    matrix encoding (1, j, j^2, ..., j^d) mod p with a weight on the modular
    coordinate: a short vector in that lattice IS a small-coefficient annihilating
    polynomial. So THE VOLCANO LEVEL CAN BE READ OFF j ALONE BY LATTICE
    REDUCTION, WITH NO ISOGENY COMPUTATION, NO MODULAR POLYNOMIAL AND NO WALK.
    Cost: one LLL in dimension d+1 with entries of size p, which is polynomial in
    d and log p. FEASIBILITY BOUNDARY, stated honestly: this works only while
    d = h(D_K f^2) is small enough for LLL, i.e. a few hundred, which by
    h ~ f sqrt(|D_K|) means only near the crater of a SMALL-DISCRIMINANT class.
    That is exactly where the signal exists, so the detector's range and the
    signal's range coincide -- which is a coherence check the record passes rather
    than a coincidence to be celebrated.

    (D) THE ARTIFACT, NAMED IN ADVANCE. At j = 0 the curve is y^2 = x^3 + b (so
    a = 0) and at j = 1728 it is y^2 = x^3 + a x (so b = 0). A vanishing
    coefficient makes the Semaev summation polynomial SPARSER, which makes
    sympy's Groebner routine measurably faster for reasons that are entirely about
    term counts and nothing about mathematics. Because j = 0 and j = 1728 occur
    only at craters of the D_K = -3 and D_K = -4 classes, THIS SPARSITY ARTIFACT
    WILL PRESENT AS A CRATER SPEEDUP unless controlled. THE CONTROL IS EXACT AND
    CHEAP: re-run the same measurement on a random ISOMORPHIC model of the same
    curve, (a, b) -> (u^4 a, u^6 b) for random u in F_p^*, which is the same curve
    with the same group, the same level, the same everything -- except dense
    coefficients. If the speedup vanishes under remodelling it was sparsity; if it
    survives it is something else. Any crater-versus-floor result in this lane
    that has not been run through this control is uninterpretable, and this record
    exists partly to put that requirement on the record before such a result
    appears.

  resource_label: R2 (the curve equation / model) primarily, with R3 entering only as the stratifying conductor
  admissibility: admissible
  admissibility_argument: >-
    Every measured quantity is a function of the curve's EQUATION or of its
    j-INVARIANT as a field element -- R2, and in the LLL detector's case R2 plus
    integer lattice reduction. None of it is a group-operation output, so
    KN-FIND-b7e091's simulability argument does not apply; none of it applies an
    endomorphism to a point of G, so H-ENDO-001 does not apply; and none of it
    factors through the abstract triple (G, P, Q), so IDEA-20260807-5cabfc's
    closure leaves it open. Note carefully what admissibility does NOT mean here:
    the detector in (C) reads the level from public curve data, and by
    IDEA-20260807-4f43ac's argument a level so obtained is a curve-only constant
    and is worth nothing to a group-only algorithm. Admissible means the
    MEASUREMENT is outside the closed model, not that an attack follows.

  discriminated_from:
    - >-
      DECOMPOSITION lane L3 / RQ-JINV-8fc13a (j-invariant special values and CM
      discriminant size). L3 compares curves with small |D_0| against generic-D_0
      curves ACROSS classes at matched p and N. This record varies the LEVEL
      WITHIN one class, where D_K is fixed by definition and only f moves. The two
      cannot be confounded because L3's variable is constant here. L3's stated
      obstruction -- the automorphism discount is a constant at most sqrt(6)
      (KN-TECH-018) -- applies to this record too and is why claim (D) is framed as
      an artifact control rather than as a mechanism.
    - >-
      IDEA-20260805-38aebb. That record uses h(D_K f^2) as one factor of a
      conserved product with short-endomorphism density. This record uses the same
      class number as the DEGREE OF AN ANNIHILATING POLYNOMIAL FOR j, which is a
      different role for the same quantity and yields a detector rather than a
      closure. It explicitly reuses that record's machine-checked class-number
      formula rather than re-deriving it, and cites it as the source of the
      verified predicate.
    - >-
      IDEA-20260807-b1b604 (the toy level certifier). That instrument determines
      the level by ISOGENY COUNTING AND WALKING. This record's detector determines
      it by LATTICE REDUCTION ON j, with no isogenies at all. The two are
      INDEPENDENT INSTRUMENTS for the same quantity, which makes them each other's
      strongest control: agreement between them on every vertex is far better
      evidence of correct labelling than either alone.
    - >-
      IDEA-20260807-a2b59a. That record's trichotomy classifies effects as
      ell-local (H_ell), order-size (H_size) or absent (H_0). This record predicts
      its own signal is squarely H_size, since d(j) depends on f through h and not
      on any single ell-coordinate. That is a prediction the factorial can check,
      and a failure of it would mean d(j) is not what this record thinks it is.

  object_first_candidate:
    tracked_object: >-
      THE ALGEBRAIC DEGREE d(j) -- the least degree of a small-coefficient integer
      polynomial annihilating j modulo p -- tracked as the curve moves up and down
      the volcano. Secondarily, the vector of ARITHMETIC size statistics of
      (a, b, j), tracked over the same path as the negative control.
    lossiness: >-
      HIGHLY LOSSY: d(j) is one integer. It discards which curve, which level in
      which ell-volcano (it sees only the scalar f), the whole horizontal position,
      the entire group, and every bit of arithmetic information about j. It is not
      a change of coordinates -- the fibre of d over a value contains all h(D_K f^2)
      crater-orbit curves at that conductor and more. COMPATIBILITY: a descending
      ell-step multiplies f by ell, hence multiplies h by about ell, hence
      increases d by about a factor ell. So d propagates deterministically (up to
      the bounded Euler factor in the class-number formula) under the graph's
      edges, which is exactly what the lossy-projection test requires. That
      propagation rule is itself a testable prediction.
    propagation: >-
      One descending ell-step: d -> d * ell * (1 - (D_K/ell)/ell) approximately,
      i.e. multiplied by about ell. One ascending step: divided by about ell. One
      horizontal step: UNCHANGED, because horizontal isogenies preserve End(E)
      hence preserve f hence preserve h. The horizontal invariance is the sharpest
      part of the propagation rule and is the easiest to falsify.
    survival_score: >-
      Survives until d exceeds the LLL feasibility bound, a few hundred. Since
      d ~ f sqrt(|D_K|), the object survives about log_ell(few hundred /
      (h(D_K))) levels below the crater and dies below that. Stated as a number
      rather than a hope: for D_K = -3 and ell = 2 that is roughly seven levels.

  mechanism: >-
    STEP 1 -- THE ARITHMETIC NEGATIVE. On a completely enumerated toy class
    (IDEA-20260807-3f5545 Step 2), compute per curve: bit length and Hamming
    weight of j, a, b; multiplicative order of j in F_p^*; and the
    rational-reconstruction height of j (the smallest max(|u|,|v|) with
    u/v congruent to j mod p, by the extended Euclidean algorithm -- exact, cheap,
    no LLL needed). Compare each statistic's distribution per level against the
    uniform reference computed on random elements of F_p, by two-sample KS.
    STEP 2 -- THE ALGEBRAIC POSITIVE. For each curve, run LLL on the lattice
    spanned by the rows of [[1, 0, ..., 0, W], [0, 1, ..., 0, W j], ...,
    [0, ..., 1, W j^d], [0, ..., 0, W p]] for increasing d and a weight W chosen
    so that a short vector forces the modular relation. Record the smallest d at
    which a vector with coefficients bounded by C appears. Compare against
    h(D_K f^2) computed from the level label.
    STEP 3 -- THE HORIZONTAL INVARIANCE TEST. Walk horizontally at fixed level and
    check d is unchanged; walk vertically and check d scales by about ell. This is
    the propagation rule as an experiment.
    STEP 4 -- THE CLASS-NUMBER-ONE TABLE CHECK. In a class with h(D_K) = 1,
    verify that the crater j equals the reduction mod p of the tabulated rational
    CM j-invariant for that D_K. This is an exact equality check and it is the
    cheapest possible confirmation that the level labelling and the detector agree
    with classical theory.
    STEP 5 -- THE SPARSITY ARTIFACT AND ITS CONTROL. Measure the frozen Semaev
    meter on j = 0 and j = 1728 curves and on random isomorphic remodellings of
    the same curves, plus on generic-j curves at the same level. Report the
    speedup with and without remodelling. The difference IS the artifact size, and
    reporting it is a service to every other record in this lane.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/ for "Hilbert class polynomial", "class polynomial", "j-invariant",
      "rational reconstruction", "LLL", "Hamming weight", "height". Read in full:
      DECOMPOSITION.md (L3 in particular), IDEA-20260805-38aebb, KN-TECH-018,
      RQ-VOLC-f6253b.
    results: >-
      "Hilbert class polynomial" appears in DECOMPOSITION.md's L3 and L9 entries
      as a named object with no measurement attached. "rational reconstruction"
      and "Hamming weight" applied to a j-invariant: ZERO hits in ledger/ and
      knowledge/. No record proposes reading the volcano level from j by lattice
      reduction. The j = 0 sparsity artifact is not named anywhere, although
      harness/endomorphism_la.py works exclusively with j = 0 curves (a = 0),
      which means every measurement in that module is exposed to it and no control
      for it is recorded.
    verdict: >-
      ADAPTATION. That CM j-invariants satisfy class polynomials and that class
      numbers grow with the conductor are textbook; using LLL to find a low-degree
      modular annihilator is a standard lattice technique. The adaptation is the
      combination into a level detector, the horizontal-invariance propagation
      rule, and the explicit naming of the j = 0 sparsity artifact together with
      the remodelling control that kills it.

  null_object_control: >-
    (N1) THE UNIFORM-FIELD-ELEMENT NULL for the arithmetic half: random elements
      of F_p, same sample size. Every arithmetic statistic must be
      indistinguishable from this at every level. Blocking for claim (A).
    (N2) THE RANDOM-ISOMORPHIC-REMODELLING NULL for the sparsity artifact: the
      SAME curve with (a, b) -> (u^4 a, u^6 b). Same curve, same group, same
      level, same j, dense coefficients. Any speedup that vanishes here was
      sparsity. Blocking for any crater-versus-floor cost claim.
    (N3) THE RANDOM-j NULL for the LLL detector: run the detector on uniformly
      random elements of F_p. It must report d at or above the LLL bound -- i.e.
      find NO small-coefficient annihilator of low degree -- because a random
      element satisfies no such relation. A detector that finds low-degree
      relations for random elements is measuring lattice noise, not CM structure,
      and this is the single most important control in the record.
    (N4) THE WEIGHT-SWEEP CONTROL: vary the LLL weight W and the coefficient bound
      C over a declared grid and report d as a function of both. A d that depends
      strongly on W is a parameter artifact.
    DECAY PARAMETER: the conductor f, equivalently the level. d must GROW like f;
    the arithmetic statistics must NOT change with f at all. Two opposite
    predicted behaviours in the same experiment is what makes this a
    discrimination rather than a fishing trip: an instrument that moved both, or
    neither, would be telling on itself.

  assumptions:
    - >-
      The j-invariants of the curves with End of conductor f are exactly the roots
      of H_{D_K f^2} mod p. RECALLED, UNVERIFIED (standard CM theory / Deuring).
      Checked at toy scale by the class-number-one table lookup in Step 4 and by
      counting roots per level.
    - >-
      h(D_K f^2) = h(D_K) f (w_f/w_1) prod_{l|f} (1 - (D_K/l)/l). Machine-checked
      at 180 cells in IDEA-20260805-38aebb by direct primitive-reduced-form
      counting; reused as a verified predicate rather than re-derived.
    - >-
      The thirteen class-number-one discriminants and their rational j-invariants.
      RECALLED, standard; the table is verified at toy scale by direct
      construction of curves with those j and comparison of their traces, so a
      wrong table entry is caught rather than propagated.
    - >-
      LLL finds a shortest-enough vector for this purpose in the dimensions used
      (d up to a few hundred). Standard; the weight sweep N4 is what detects
      failure.
    - >-
      Toy scale, p <= 2^16 for the enumeration, possibly larger for the LLL half
      since it needs no point counting once j is given.

  proof_search_map:
    bottleneck: >-
      The LLL reduction in dimension d+1 = h(D_K f^2) + 1 with entries of size p.
      That is the exact step whose feasibility bounds how deep the detector reaches,
      and it is why the record states a level ceiling in numbers rather than
      claiming a general method.
    baseline_embedding:
      parameter_slice: >-
        f = 1 in a class-number-one class: the detector must return d = 1 and the
        annihilating polynomial X - j_0 for the tabulated rational j_0. That is the
        classical boundary case and it must be reproduced exactly, not
        approximately.
      reproduction_check: >-
        Frozen fixture: for each of the thirteen class-number-one discriminants
        realizable at the chosen p, construct the crater curve from the tabulated
        j and check that the detector returns d = 1 with the correct integer.
    observation_collision:
      observable: >-
        The integer d(j).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: all h(D_K f^2) curves at conductor f
        share the same d, so the observable collides across an entire horizontal
        orbit. That collision is the horizontal-invariance prediction and confirms
        d sees only the conductor. THE FALSIFYING COLLISION is different and must
        be searched for separately: two curves at DIFFERENT conductors with the
        same d. Under the class-number formula that requires h(D_K f_1^2) =
        h(D_K f_2^2) with f_1 != f_2, which the Euler-product factor makes possible
        for special f. Those exact coincidences must be enumerated in advance and
        excluded from the detector's claimed resolution, or the detector will
        mislabel them.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track not just d but the full COEFFICIENT VECTOR of the minimal
          annihilating polynomial, i.e. H_{D_K f^2} mod p itself. It preserves
          strictly more state than d and would distinguish conductors that share a
          class number, closing the collision named above.
        predicted_gain: >-
          Resolution: turns a many-to-one detector into a nearly injective one, at
          the cost of comparing h coefficients instead of one integer.
      - transform: observable_fiber
        proposed_object: >-
          Hold d fixed and vary the curve within the fibre; ask whether any
          ARITHMETIC statistic distinguishes members. Claim (A) predicts none does,
          so the fibre should be arithmetically featureless.
        predicted_gain: >-
          A clean statement that the arithmetic and algebraic halves see disjoint
          information, which is the record's organizing claim.
    quantifier_order: >-
      CLAIMED (algebraic half): FORALL classes and FORALL levels with
      h(D_K f^2) below the LLL feasibility bound, FORALL curves at that level,
      d(j) equals h(D_K f^2) for a suitable declared coefficient bound C. The
      dependence of C on the class-polynomial coefficient sizes is the honest weak
      point: C must be large enough to admit H's coefficients, which grow with
      |D|, so C is NOT uniform over classes and the claim is stated per class.
      CLAIMED (arithmetic half): FORALL levels, the arithmetic statistics are
      distributionally indistinguishable from uniform on F_p. Uniform over levels,
      which is what makes it a clean negative.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The volcano level is readable from j alone by lattice reduction, in
        polynomial time, whenever h(disc End E) is below a few hundred; and no
        arithmetic size statistic of (a, b, j) carries any level information at
        all." It can NEVER certify a level for a large-class-number curve, which
        is the generic case at crypto scale, and it certifies no attack.
      nearby_object_control: >-
        A GENERIC-D_K CLASS AT CRYPTO SCALE, where h(D_K) is already about
        sqrt(p) and the detector is hopeless at every level including the crater.
        The method must be seen to fail there. A version that appeared to work
        would have found a polynomial-time CM-detection method for random curves,
        which is certainly wrong.
    proof_obligations:
      - claim: Level-i j-invariants are roots of H_{D_K f^2} mod p.
        responsibility: baseline
      - claim: h(D_K f^2) grows essentially linearly in f.
        responsibility: size
      - claim: d(j) = h(D_K f^2) for a suitable per-class C.
        responsibility: correctness
      - claim: d is invariant under horizontal isogenies.
        responsibility: strictness
      - claim: LLL finds the relation in dimension d+1 within budget.
        responsibility: runtime
      - claim: Random field elements admit no low-degree small-coefficient relation.
        responsibility: soundness
      - claim: Arithmetic statistics are uniform at every level.
        responsibility: correctness
      - claim: The j = 0 / j = 1728 speedup is sparsity, killed by remodelling.
        responsibility: interface

  predictions:
    - metric: >-
        two-sample KS distance between the per-level distribution of each
        arithmetic statistic (bit length, Hamming weight, multiplicative order,
        rational-reconstruction height of j) and the uniform reference
      direction: different
      minimum_effect: >-
        PREDICTED NULL: KS distance inside the sampling band at every level, for
        every statistic. Any statistic exceeding the band, reproducibly across two
        classes, is the surprise and would need independent review before being
        reported. Note the trap: rational-reconstruction height is the one where a
        naive implementation can manufacture a signal by reconstructing to a fixed
        bound; the bound must be sqrt(p) and stated.
    - metric: >-
        measured d(j) versus h(D_K f^2) computed from the level label
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT on at least 95 percent of curves within the LLL feasibility
        range, with the disagreements enumerated and explained (expected causes:
        conductors sharing a class number, and coefficient bound C too small).
        Agreement below 80 percent means the detector does not work as described.
    - metric: >-
        d(j) across a horizontal walk at fixed level
      direction: different
      minimum_effect: >-
        EXACTLY CONSTANT. A single horizontal step changing d falsifies the
        propagation rule and means d is not a function of the conductor alone.
    - metric: >-
        d(j) after one descending ell-step
      direction: higher
      minimum_effect: >-
        Multiplied by ell within the bounded Euler factor
        (1 - (D_K/ell)/ell), i.e. a measured ratio in [ell(1-1/ell),
        ell(1+1/ell)] = [ell-1, ell+1]. Outside that band the class-number formula
        is being misapplied or the level label is wrong.
    - metric: >-
        d(j) on uniformly random elements of F_p (control N3)
      direction: higher
      minimum_effect: >-
        At or above the LLL feasibility bound on at least 99 percent of samples,
        i.e. NO low-degree relation found. Low-degree relations found for random
        elements void the detector entirely.
    - metric: >-
        Groebner wall-time ratio for j = 0 curves versus generic-j curves at the
        same level, WITH and WITHOUT random isomorphic remodelling
      direction: lower
      minimum_effect: >-
        A ratio of at least 1.3 without remodelling and a ratio within the noise
        band WITH remodelling. That pattern establishes the artifact and its size.
        A speedup that SURVIVES remodelling is not sparsity and would be a genuine
        j = 0 effect requiring separate explanation -- and would also mean every
        result from harness/endomorphism_la.py, which uses only a = 0 curves,
        needs re-reading.

  minimal_test:
    design: >-
      STAGE 1 (minutes): arithmetic statistics on an enumerated class plus the
      uniform null. Pure integer work, no curves needed beyond the enumeration.
      STAGE 2 (hours): the LLL detector with the weight sweep and the random-j
      control. numpy or a hand-rolled LLL suffices at these dimensions; no Sage.
      STAGE 3 (minutes): the class-number-one table check.
      STAGE 4 (hours): horizontal-invariance and descending-step propagation tests.
      STAGE 5 (hours): the j = 0 / j = 1728 sparsity measurement with remodelling.
      STAGES 1, 3 AND 5 CAN RUN WITHOUT ANY ISOGENY CODE, which makes this the
      most independent item in the batch and a useful early check on the others.
    controls:
      - uniform random field elements for the arithmetic half (N1, blocking)
      - random isomorphic remodelling of the same curve (N2, blocking)
      - random-j input to the LLL detector (N3, blocking)
      - LLL weight and coefficient-bound sweep (N4)
      - cross-check of every level label against the isogeny-counting instrument
        of IDEA-20260807-b1b604 -- two independent instruments must agree
    required_metrics:
      - each arithmetic statistic per curve, per level, with KS distances
      - d(j) per curve, with the recovered annihilating polynomial
      - h(D_K f^2) per level from the class-number formula
      - horizontal-walk d sequence and descending-step d ratios
      - LLL dimension, wall time and peak memory per detection
      - Groebner wall time for j = 0 / j = 1728 with and without remodelling
      - agreement rate between the LLL detector and the isogeny-counting labeller

  falsification_conditions:
    - >-
      Any arithmetic statistic showing a reproducible level dependence. Claim (A)
      is false and the mechanism must be found before anything else is reported.
    - >-
      d(j) not constant along a horizontal walk. The propagation rule is false and
      d is not a conductor invariant.
    - >-
      The LLL detector finding low-degree small-coefficient relations for random
      field elements. The detector is void; nothing from Stage 2 may be reported.
    - >-
      Detector-versus-isogeny-labeller disagreement above 5 percent. One of the two
      instruments is wrong and the lane's level labels are unreliable until it is
      resolved. This is the most consequential possible outcome of this record,
      because every other proposal in the batch depends on those labels.
    - >-
      The j = 0 speedup surviving random isomorphic remodelling. Not sparsity;
      requires a new explanation, and casts doubt on prior measurements taken on
      a = 0 curves.

  confounders:
    - >-
      COEFFICIENT BOUND C IS NOT UNIFORM. Hilbert class polynomial coefficients
      grow with |D|, so a C large enough at one class is too small at another. C
      must be declared per class and the sensitivity reported; a fixed global C
      would manufacture level-dependent detection failures that look like signal.
    - >-
      CLASS-NUMBER COINCIDENCES. Two conductors can give the same h, so d does not
      determine f uniquely. The coincidences must be enumerated in advance for the
      tested classes and excluded from the resolution claim.
    - >-
      RATIONAL RECONSTRUCTION BOUND. Reconstructing j to a bound smaller than
      sqrt(p) gives failures whose rate depends on j in ways unrelated to CM; the
      bound must be exactly sqrt(p) and stated.
    - >-
      j = 0 and j = 1728 have extra automorphisms as well as sparse coefficients.
      Remodelling kills the sparsity but NOT the automorphisms, so a surviving
      effect could still be the KN-TECH-018 discount rather than something new.
      Both explanations must be separated before either is claimed.
    - >-
      LLL implementation quality at dimension a few hundred with entries of size p
      is a real engineering variable in pure Python; the weight sweep is the guard
      and the achieved reduction quality must be reported.

  reachability_gate: >-
    THE DETECTOR CHANGES THE REACHABILITY PICTURE IN ONE SPECIFIC WAY AND NOT MORE.
    Determining the level normally requires walking (IDEA-20260807-3c6bd8:
    O(ell * h^2) isogeny computations, infeasible at large ell). The LLL detector
    determines the SCALAR conductor from j alone with no walk, in time polynomial
    in h(disc End E) and log p. So for small-class-number classes the level is
    LOCALLY DETECTABLE at a vertex with no graph exploration whatsoever, which
    strengthens the "goodness is locally detectable" branch of DECOMPOSITION T5
    for exactly those classes. IT DOES NOT HELP AT CRYPTO SCALE for random curves,
    where h(D_K) is already about sqrt(p) and the lattice is far out of reach --
    and that limitation is not incidental, it is the reason no attack follows.
    Reaching a target level still costs what bb03d3 says it costs; only the
    detection is cheapened.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT CLAIMED. Detector cost: one LLL in dimension
      h(disc End E) + 1 with entries of size p, so polynomial in h and log p, and
      INFEASIBLE once h exceeds a few hundred. Since h ~ sqrt(|disc|) ~ sqrt(p)
      for a random curve at crypto scale, the detector is a toy-and-small-CM
      instrument by construction and the record says so rather than implying
      otherwise.
    memory_exponent: >-
      O(h^2 log p) bits for the lattice basis. At h a few hundred and p toy-sized
      this is megabytes; at crypto scale with h ~ 2^128 it is absurd, which is the
      same feasibility statement in a second currency.
    best_known: >-
      For level determination: isogeny walking at O(ell h^2) per ell
      (IDEA-20260807-3c6bd8), and the subexponential full-ring algorithms
      KN-LIT-251 / KN-LIT-309 (abstracts read, full texts NOT READ). The LLL
      detector is not comparable to those in general -- it is faster in its narrow
      range and useless outside it. For the ECDLP: rho at 0.886 sqrt(N)
      (KN-TECH-001, KN-TECH-006).
    hidden_overhead: >-
      Disclosed: (i) the per-class coefficient bound C, which is the detector's
      real tuning parameter and is not uniform; (ii) class-number coincidences that
      cap the detector's resolution; (iii) LLL quality in pure Python;
      (iv) the arithmetic half's null is only as strong as its sample size, and the
      achieved power must be reported since a null is the predicted result.
    tradeoff_note: >-
      A genuine instrument tradeoff: the LLL detector needs no isogeny machinery
      and no graph exploration but dies at moderate class number, whereas the
      walking labeller works at any class number but needs Velu and dies at large
      ell. Their ranges are complementary, which is why running both and demanding
      agreement is the strongest available check on this lane's level labels.

  dominated_by: >-
    AS AN ATTACK: mounts none, dominated on every axis by every frontier row --
    parallel rho at 0.886 sqrt(N) time and O(1) memory (KN-TECH-001,
    KN-TECH-006); automorphism-discounted rho at 0.886 sqrt(N/|Aut|) with
    |Aut| <= 6 (KN-TECH-018); BSGS at 2 sqrt(N) time and sqrt(N) memory
    (KN-TECH-031); toy Semaev index calculus (KN-FIND-f8c290). Checked across
    time, memory and data/queries.
    AS A LEVEL DETECTOR: dominated by isogeny walking whenever h is large, and
    dominating it whenever h is small and ell is large -- an honest Pareto
    crossing rather than a win. Dominated by KN-LIT-251 / KN-LIT-309 on generality.
    AS AN ARTIFACT CONTROL (claim D): not dominated, because no remodelling control
    is recorded anywhere in this corpus and harness/endomorphism_la.py runs
    exclusively on a = 0 curves without one.
  sota_delta: >-
    Zero speedup against any attack baseline. Instrument deltas, quantitative:
    level determination in one LLL of dimension h+1 versus O(ell * h_vol^2) isogeny
    computations, a win of orders of magnitude when h is small and ell is large and
    a total loss when h exceeds a few hundred. Artifact delta: the j = 0 sparsity
    speedup is predicted at 1.3x or more and is predicted to vanish entirely under
    remodelling -- a number this program does not currently have and needs, since
    an existing harness module measures only a = 0 curves.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the arithmetic half's null holds -- reduction mod p destroying height
    is not a subtle point. 0.7 that the LLL detector reproduces h(D_K f^2) within
    the stated agreement rate; the risk is entirely in the coefficient bound C and
    in LLL quality, both of which the weight sweep exposes. 0.95 that horizontal
    invariance of d holds, since it follows immediately from horizontal isogenies
    preserving End(E). 0.75 that the j = 0 speedup is sparsity and dies under
    remodelling. Priority is medium because no attack can follow, but the artifact
    control in claim (D) is arguably the single most useful line in the record and
    should be run regardless of what happens to the rest.

