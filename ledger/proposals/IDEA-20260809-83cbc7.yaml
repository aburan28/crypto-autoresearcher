idea:
  id: IDEA-20260809-83cbc7
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    Enumerate the class group's known structural sub-cases and construct an
    explicit witness for each, then check every countermeasure against every case
  class: measurement
  claim: >-
    The low-order and adaptive-root assumptions fail in the presence of elements
    of small known order, and classical genus theory says exactly where such
    elements come from: ambiguous forms tied to the discriminant's factorization.
    The claim is that the sub-cases are finite, enumerable from the discriminant
    alone, that an explicit witness element can be constructed for each in
    milliseconds, and that the resulting case-by-countermeasure table is fillable
    today with no cost model and no sweep.
  mechanism: >-
    From the discriminant's factorization, enumerate the ambiguous forms and hence
    the two-torsion; construct each witness explicitly as a binary quadratic form
    and verify its order by direct composition. For each named countermeasure —
    working in a quotient, restricting to a subgroup, choosing prime
    discriminants — check whether the witness survives.
  why_not_a_renamed_known_approach: >-
    The two-torsion issue is known and the countermeasures exist because of it.
    What does not exist in one place is the exhaustive case-by-countermeasure
    table with a constructed witness per cell, which is the difference between
    knowing the issue and having checked the fix.
  predictions:
  - observable: number of structural sub-cases enumerable from the discriminant
    metric: exact count as a function of the discriminant's factorization
    predicted: Determined exactly by the number of prime factors; a discriminant that is prime should yield the minimal case count, which is why prime discriminants are a countermeasure.
  - observable: countermeasure coverage
    metric: per cell, removed or surviving
    predicted: >-
      All cells removed by at least one countermeasure. A surviving cell under a
      deployed countermeasure would be the most valuable finding this goal can
      produce and requires immediate independent re-verification before recording.
  minimal_test: >-
    At several small discriminants with varied factorization structure, enumerate
    sub-cases, construct and verify witnesses by composition, and evaluate each
    countermeasure per cell.
  controls:
  - 'ORDER VERIFICATION: each witness''s order is verified by explicit composition rather than inferred from theory, since the theory is what the witness is meant to instantiate.'
  - 'PRIME-DISCRIMINANT CONTROL: with a prime discriminant the enumeration must yield the minimal case set, confirming the enumeration tracks the factorization.'
  falsification_conditions:
  - Witness orders disagree with the enumeration's prediction.
  - The enumeration cannot be made exhaustive within the declared class, in which case the boundary is stated and no completeness is claimed.
  interpretation_limits: >-
    A structural witness is a statement about the group, not about any system
    using it. No deployed parameter is evaluated and no verdict is recorded.
  sota_delta: 'No attack. Delta: a filled case-by-countermeasure table with constructed witnesses, cheap and complete within its declared class.'
  dominated_by: Not dominated by any corpus record; GOAL-CSIDH-001 touches class groups for a different purpose and may not cite this.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for class group / ambiguous forms: no records. WEB NOT CHECKED.'
  source_refs:
  - Binary quadratic forms and genus theory references -- RECALLED, REQUIRED READS.
  - Hidden-order group construction papers -- RECALLED, REQUIRED READS.
