idea:
  id: IDEA-20261018-c4adb6
  title: Fitted degree rule and geometric-progression bases as a factor-base prior in fb-search
  class: composition
  question_id: RQ-KIC-7502b9
  area: KIC
  goal_ids: []
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: Using the cryptanalysis fitted degree rule D = 2 + [e < -3.5] + [e < -8.5] (MAE 0.06 over 656
    bases) and the finding that geometric-progression bases are 15-40x cheaper per query as a prior in
    fb-search yields factor bases whose end-to-end S is no worse than unguided search at equal search
    budget, or equal quality at least 15x cheaper per search query; today no learned component feeds a
    measured IC run.
  mechanism: fb-search scores candidate bases by expensive trials. A rule that predicts the solving degree
    from the base (e as defined in the cryptanalysis experiment) prunes the search; the geometric-progression
    result supplies a cheap family. The ready fpn_decomposable config (about 10 CPU-minutes) turns the
    null M7/M9 result into a citable one first.
  novelty_status: adaptation
  regime: binary factor-base co-design; ML-to-IC loop; constant-level; CPU-minutes to days
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.7 bullet 1, 2.4
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: cryptanalysis:experiments/pdp-degree-heuristics/README.md
    provenance: internal
    claim: Fitted rule, MAE 0.06 over 656 bases; geometric-progression bases 15-40x cheaper per query.
    verified_by: idea-generator
  - ref: ml-cryptanalysis:experiments/fpn-degrees/report.md; experiments/hardness/report.md
    provenance: internal
    claim: Degree labels agree with the Macaulay bound on 5,592/5,592 rows; hardness and decomposability
      predictors null beyond size and |Aut|/2.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-73db3f
    - KR-IC-49c882
    - KR-IC-b0fcda
    nearest:
    - ref: KR-IC-73db3f
      provenance: internal
      relation: special_case
      delta: Choosing the factor-base subspace V is the row; this idea adds a measured degree prior to
        the search, evaluated by end-to-end S.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - The rule's validation set (656 bases) is disjoint from the bases scored here.
  - Scoring is by counted cost on verified solves, not by prediction error.
  predictions:
  - metric: end_to_end_S_prior_vs_unguided
    direction: lower
    minimum_effect: Ratio at or below 1 at equal search budget, interval reported; any real gain must
      also exceed the search-cost saving it claims.
  - metric: per_query_cost_ratio
    direction: lower
    minimum_effect: At least 15x cheaper per query on the geometric-progression family.
  minimal_test:
    design: Run the ready fpn_decomposable config first. Then implement the rule as a prior in fb-search,
      run guided and unguided search at equal budget over a frozen set of cells, solve each chosen base
      end to end with verified answers.
    controls:
    - unguided fb-search
    - random-prior search
    - field-family split for the rule
    - A/A repeat
    required_metrics:
    - end-to-end S of the chosen base
    - search queries used
    - per-query cost
    - rule prediction error on held-out bases
  falsification_conditions:
  - Chosen bases with S ratio above 1 (interval excluding 1) at equal budget refutes the prior's value.
  - A per-query saving with no S change is accounting, not an improvement.
  confounders:
  - size-only signal in the rule
  - cell mix
  - search budget definition
  interpretation_limits:
  - Constant-level; a null is a valid outcome and is recorded.
  heuristic_assumptions:
  - id: H1
    statement: The rule's degree prediction transfers from the PDP degree experiments to the repository's
      measured IC cells.
    rigorous_support: MAE 0.06 on 656 bases in cryptanalysis.
    validation_plan: Evaluate on a held-out family before use.
  target_complexity:
    time_exponent: Constant-level; no exponent.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low-medium
    compute: low (about 10 CPU-minutes for the precursor; days for the search)
  recommended_priority: low
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: None measured. Closes the loop between the ML tooling and the measured pipeline.
