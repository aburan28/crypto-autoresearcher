  assumptions:
    - Matched dims and routine across arms: same (n,m,k), same seeds/order/routine distribution, same corrected XOR product; arm label is the only systematic difference.
    - N>=20 shifts per arm per (n,m,k) where budget allows at n<=24; smaller K recorded with exact test, never approximated away.
    - Every degree labelled (Def5-true, Def6-fake, Semaev-d_F4 where computable, Macaulay-rank-fall); unlabelled draws discarded as incomplete.
    - Refs 2013/548 and 2013/549 recalled only, no support.
    - No claim about any deployed curve's security; scope is tested n,m,k, shift ensembles, labelled rank fall, with transfer assumptions stated.
  proof_search_map:
    bottleneck: whether any observed shift-fragility is specific to the Nagao disjoint-coset pattern or generic to affine shifts (controls-before-belief gate for the companion measurement).
    baseline_embedding:
      parameter_slice: matched (n,m,k) at n<=24 with v=0 EQS2 baseline reproducing the companion measurement values.
      reproduction_check: v=0 baseline triple must match the companion batch values with same routine before arm draws count; arm dims verified equal via C(N+4,4) equality.
    observation_collision:
      observable: per-shift labelled preservation bit (rank-fall preserved vs diverged at degree 4) plus Def-split where computable.
      distinct_preimage_search: same specificity gap from seed/order imbalance vs true pattern effect; searched via balanced seeds, order permutation, label shuffle, B-variation.
    constructive_transforms: []
    quantifier_order: FORALL tested (n,m,k) compare arm rates; EXISTS one (n,m,k) with significant Nagao advantage (preserves more) suffices to establish specificity at tested scope; universal genericity requires all tested (n,m,k) to show indistinguishability.
    method_ceiling:
      strongest_certifiable_claim: scoped specificity/genericity statement at tested (n,m,k,K) with exact test; no transfer beyond stated assumption.
      nearby_object_control: v=0 baseline; odd-p control (IDEA-20261006-486aa2) as orthogonal axis; curve-blindness B-record as covariate.
    proof_obligations:
      - claim: random-shift sampler uniform over same-dimension affine shifts with documented RNG/seed
        responsibility: future executor under frozen contract
      - claim: arm comparison uses matched dims and exact contingency test
        responsibility: future validator
    not_applicable_reason: "Constructive transforms N/A: null-control proposal claiming no theorem; bottleneck/collision/quantifier/ceiling audits retained."
  predictions:
    - metric: arm divergence-rate difference Delta=rate_rand_diverge minus rate_Nagao_diverge (labelled Macaulay-rank-fall at degree 4)
      direction: different
      minimum_effect: "|Delta|<=0.05 absolute or <=1 pair per N>=20-per-arm batch with Fisher exact p>=0.05 supports genericity; Delta>=0.20 with p<0.05 supports Nagao specificity"
    - metric: Def-split concordance across arms (fraction of draws where Def6-fake<=4 with Def5-true>4, labelled)
      direction: different
      minimum_effect: concordance difference across arms <=0.10 supports generic Def-conflation; >=0.25 with p<0.05 supports pattern-specific conflation
  minimal_test:
    design: |
      Per matched (n,m,k) at maximal exact n<=24: K>=20 Nagao-pattern shifts + K>=20 random same-dimension shifts with balanced seeds/order and corrected routine; per draw record labelled rank-fall preservation vs v=0 baseline; test Delta with Fisher exact plus effect size. NEGATIVE outcome for genericity (significant Nagao advantage) is informative specificity; NEGATIVE for specificity (indistinguishability) is informative genericity; joint preservation in both arms is the corroborating direction.
    controls:
      - v=0 EQS2 baseline at same (n,m,k,seeds/order/routine)
      - balanced seed/order permutation across arms
      - random-label shuffle within each arm
      - generic random-Boolean control of same (N,degree)
      - B-coefficient variation record
    required_metrics:
      - per-draw Macaulay degree-4 rank-fall preserved/diverged (labelled) plus C(N+4,4) dims and shift descriptor (Nagao vs random, seed)
      - per-arm rates, Delta with 95pct exact interval, Fisher exact p
      - Def5-true/Def6-fake values where computable (labelled) and concordance rates
  falsification_conditions:
    - Significant Nagao preservation advantage (Delta>=0.20, p<0.05) at any tested (n,m,k) falsifies the indistinguishability (genericity) claim at tested scope.
    - Universal indistinguishability across all tested (n,m,k) falsifies the specificity alternative at tested scope (does not prove beyond-scope genericity).
    - Baseline mismatch (v=0 differs from companion values) invalidates the batch, not either hypothesis.
  confounders:
    - RNG/seed imbalance across arms (balance and record; preregister K)
    - dimension mismatch (verify via equal C(N+4,4); drop mismatched draws)
    - XOR-product version drift (pin corrected routine)
    - monomial order, basis, (m,t) slicing, y-recovery, rank tolerance
    - B-coefficient coupling (record; do not pool across B without test)
  interpretation_limits:
    - Scope is tested (n,m,k,K), shift ensembles, labelled rank fall only; transfer to larger n or other shift families requires unstated stability/uniformity assumptions NOT established.
    - Either informative outcome (generic fragility or Nagao specificity) FAILS to corroborate Nagao Theorem 1: ordinary scoped science.
    - Joint preservation in both arms (no divergence anywhere) WOULD corroborate the proposition and is breakthrough-adjacent: flag explicitly, needs breakthrough-tier review, still NO claim about any deployed curve's security.
    - Stopping on small K or infeasible dims is a scope limit, never evidence.
  heuristic_assumptions:
    - id: H1
      statement: |
        FORMAL (sampling): the K>=20 random affine shifts per (n,m,k) are i.i.d. uniform over same-dimension affine cosets V+v_rand in the fixed basis, independent of the Nagao-pattern draws conditional on dimension.
      rigorous_support: |
        RNG uniformity is implementational, not mathematical: documented sampler over F2^{n-m} offset space with fixed basis; no distribution theorem for rank-fall over shifts is asserted. Classical analogue invoked only for the exact contingency test (hypergeometric null under exchangeability), not for rank-fall values.
      validation_plan: |
        Sampling: preregistered K, seeds, sampler code version. Comparison distribution: offset uniformity diagnostics (marginals over coordinates) plus exchangeability check via label-shuffle permutation null for Delta. Tail checks: Delta vs K (cumulative), vs n, vs coset dimension; report (n,m,k,K) and transfer assumption explicitly.
