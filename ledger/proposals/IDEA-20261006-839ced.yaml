idea:
  id: IDEA-20261006-839ced
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-06'
  approved_by: null
  title: "Null-ensemble specificity: Nagao disjoint-coset shifts vs random affine shifts on matched pairs"
  class: control
  claim: |
    On matched (n,m,k) batches at n<=24, Macaulay degree-4 rank-fall divergence (shifted vs v=0 EQS2) on Nagao disjoint-coset shifts is indistinguishable from that on random affine shifts of the same dimension (|divergence-rate difference|<=1 pair per batch of N>=20 shifts per arm, Fisher exact p>=0.05): observed non-invariance is generic affine-shift fragility, not Nagao-structure-specific. Falsified if Nagao shifts preserve fall significantly more often than random shifts (difference >=20pp with p<0.05).
  mechanism: |
    OBJECT FRAME: point representation R_bin = x-coordinate of E/F_{2^n}: y^2+xy=x^3+Ax^2+B restricted to an affine coset V+v, Weil-descended via S_3 (Nagao Def.1 / KN-LIT-fa346d family); two shift arms share dimension and routine: arm S_Nagao = Nagao disjoint-coset pattern (EQS4), arm S_rand = uniform-random affine shifts V+v_rand of same F2-dimension. Operation set Sigma_Fb per arm = translation by that arm's factor-base elements only (Class I partial-action each).
    TRICHOTOMY: Class I partial-action in both arms, because the tracked rank-fall descriptor propagates only under the arm's own Sigma_Fb; not branching nor coordinate-dependent (the exhibited invertible-M 2->3 rise of IDEA-20260929-0238ee is treated as one draw from S_rand, not a separate lens).
    LOSSY-PROJECTION TEST vs Sigma_Fb: tracked object D=(labelled rank-fall + Def5-true/Def6-fake where computable, C(N+4,4) dims). Discard: full Macaulay entries, coefficient values, monomial-order details, relation order. Sigma-compatibility: arm translation permutes coset labels/relation indices deterministically. Lossiness: many distinct full systems map to one D; many-to-one, not a coordinate change. Arm label retained so cross-arm comparison is like-for-like on dims and routine.
    PRICE THE OPEN NUMBER: open number = specificity gap (rate_Nagao_preserve minus rate_rand_preserve). Plan: per matched (n,m,k) draw K>=20 Nagao-pattern shifts + K>=20 random shifts, build degree-4 Macaulay matrices (exact C(N+4,4), corrected XOR, pure Python), record labelled preservation per shift; controls: v=0 identity baseline, random-label shuffle, generic-Boolean control, B-variation record.
    F2 DELTA: adds the null ensemble beyond Semaev descent + Nagao cosets; proposes no new descent or factor base. Generalises IDEA-20260929-0238ee (single M with Boolean-ring FFD 2->3) to an ensemble specificity test and supplies the missing null for IDEA-20260913-352163.
    FACTOR-BASE ESCAPE: inside KN-OPEN-020 scoped-out class in both arms (explicit affine membership); no escape claimed; stops per constraint (f).
  novelty_status: unverified
