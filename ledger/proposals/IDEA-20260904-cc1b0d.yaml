idea:
  id: IDEA-20260904-cc1b0d
  id_allocation_provenance: >-
    Token minted by the coordinator with
    `python3 tools/allocate_id.py --next idea --date 20260904` and confirmed
    free with `--check` (0 occurrences across 11563 identifier-bearing paths),
    relayed to this session 2026-09-04. Not derived by scanning state.
  question_id: RQ-ECDLP-165d4b
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-165d4b has no bound GOAL record visible to this session. Left null
    deliberately, not omitted.
  added: '2026-09-04'
  title: >-
    THIS CENSUS MEASURES NON-GENERIC HARDNESS WITH FOUR GENERIC INSTRUMENTS AND
    HAS NEVER ONCE BEEN SHOWN A CURVE IT COULD DETECT: run the census's own
    declared method set unchanged over a PLANTED-WEAK BATTERY - an anomalous
    curve (linear time by SSSA), a small-embedding-degree curve (subexponential
    by MOV/Frey-Ruck), and a class-floor curve whose surface carries j = 0 -
    alongside the structure-specific attacks that actually break them, and
    report the SENSITIVITY GAP as a ratio; the prediction is that the gap is
    unbounded and that every "no non-generic behaviour found" cell in this RQ
    is therefore a statement about a generic constant, not about non-generic
    hardness
  class: control

  claim: >-
    (A) THE STRUCTURAL OBSERVATION, ZERO COMPUTE. RQ-ECDLP-165d4b's declared
    method list is exactly {Pollard rho, negation quotient, automorphism
    quotient, charged isogeny transfer}. The first three are GENERIC-GROUP
    algorithms in the precise sense of KN-TECH-005: they access the curve only
    through the group operation, an equality test, and (for the quotients) a
    finite set of free maps. Their charged cost is therefore a function of N and
    |Aut| alone, up to encoding effects that IDEA-20260901-753636 bounds to one
    aperture. The fourth changes which curve the first three run on and,
    per IDEA-20260829-20b05f's Tate closure, cannot change N at all.
    CONSEQUENCE, WHICH IS A THEOREM ABOUT THE INSTRUMENT AND NOT ABOUT ANY
    CURVE: for any curve family whose non-generic weakness is realised by a
    STRUCTURE-SPECIFIC algorithm - anomalous curves, where SSSA/Smart/Semaev
    solve in O(log p) (KN-TECH-033); small embedding degree, where
    MOV/Frey-Ruck transfers to a subexponential finite-field DLP
    (KN-TECH-032) - THIS CENSUS'S VERDICT COLUMN READS "GENERIC" BY
    CONSTRUCTION. The census cannot detect the very phenomena its motivation
    names.

    (B) WHY THIS IS NOT A REPHRASING OF THE OBVIOUS. Every existing control in
    this lane is a NULL control: IDEA-20260829-172151's planted dial is
    explicitly synthetic and "delivers no mathematical advantage";
    IDEA-20260829-20b05f's seed-noise null, IDEA-20260829-34f3ed's sabotage
    ladder, IDEA-20260901-753636's random-label null and planted diagonal
    partition, and the H-ECDLP hypotheses' C-RELABEL and C-RAND-BASE are all
    designed to show the instrument does NOT see something. NOT ONE OF THEM IS
    A POSITIVE CONTROL CARRYING REAL MATHEMATICS. A census with only null
    controls has never established that it can detect anything, and under
    docs/inventor-protocol.md section 3 a measurement whose sensitivity is
    unmeasured cannot convert an absence into a finding. The battery below is
    the missing half.

    (C) THE MEASURED QUANTITY. Define, per planted family F and per bit size b,
    the SENSITIVITY GAP
        S(F, b) = (charged cost of the best CENSUS-DECLARED method on F)
                  / (charged cost of the STRUCTURE-SPECIFIC attack on F),
    both fully charged in the same frozen cost model, both verified by a
    solution certificate on the original curve. Predicted values: for the
    anomalous family, rho at 0.886*sqrt(p) versus SSSA at O(log p) field
    operations, i.e. S ~ 10^2 at 20 bits, ~10^3 at 28 bits, and ~2^{115} at
    p ~ 2^256; for the small-k family, rho versus a transfer plus an
    index-calculus solve in F_{p^k}. And define the DETECTION DELTA
        D(F, b) = (charged census cost on F) / (charged census cost on a
                   matched random ordinary prime-order curve of the same N),
    which is what the census actually reports. Predicted D = 1 within the
    detection floor for every planted family EXCEPT j = 0 and j = 1728, where
    D = 1/sqrt(3) and 1/sqrt(2) exactly.

    (D) THE DISCRIMINATION, AND BOTH BRANCHES ARE INFORMATIVE.
      READING 1 -- STRUCTURAL BLINDNESS CONFIRMED, WITH A NUMBER. D = 1 within
      the detection floor on the anomalous and small-k families while S is
      enormous and measured. Then the census's verdict column is proven to be
      a measurement of a generic constant, every past and future null cell in
      RQ-ECDLP-165d4b must be restated as "no deviation of the generic
      constant beyond MDE" rather than "no non-generic behaviour", and the RQ's
      decision target cannot be settled by the declared method set alone - the
      method column set must be extended with structure-specific probes, which
      this record names.
      READING 2 -- COUPLING. D differs from 1 beyond the detection floor on a
      planted family with no automorphism advantage, i.e. charged generic-walk
      work is sensitive to arithmetic structure the generic model says it
      cannot see. That contradicts the generic-group idealisation underlying
      the 0.886 convention and is a first-order finding requiring independent
      validation and red-team review before any interpretation, with
      IDEA-20260901-753636's partition-transition instrument as the designated
      follow-up channel.

    (E) WHAT IS NOT CLAIMED. No new attack. SSSA and MOV are known and are used
    here as CALIBRATION SOURCES, not as results. No exponent moves. The RQ's
    own constraint excludes anomalous and small-k curves from PRIMARY cells and
    this record respects that: the battery is declared as CONTROL cells, never
    as primary, and no verdict about primary curves is drawn from it.

  mechanism: >-
    THE TRACKED OBJECT is the DETECTION DELTA D(F, b) - the census's own
    verdict statistic evaluated on a curve whose ground truth is known
    independently. Its lossy-projection test is in `object_first_candidate`.

    STAGE 0 (zero compute, HARD GATE). Write (A) as a source-level argument:
    enumerate every read of curve data in harness/rho.py and in the quotient
    arms, and assert that none of them is a function of t, of End(E), of the
    embedding degree, or of anomalousness. IDEA-20260901-753636's STAGE 0 audit
    covers the partition path and IDEA-20260830-a22049 covers the step-cost
    path; this stage composes them into the single statement that the declared
    method set is generic-plus-|Aut|. If a read is found that is NOT of that
    form, (A) is false for this harness and the record is re-scoped before
    anything runs - which would itself be the finding.

    STAGE 1 (low compute, THE BATTERY). Construct, at 16, 20, 24 and 28 bits,
    with full construction provenance recorded:
      W1 ANOMALOUS: N = p, ordinary, prime order (p prime), built by CM with a
      declared discriminant. Ground truth: SSSA solves in O(log p).
      W2 SMALL EMBEDDING DEGREE: k in {2, 3, 4, 6}, ordinary, prime order,
      non-anomalous, built by CM/MNT-style construction. Ground truth:
      MOV/Frey-Ruck transfers to F_{p^k}.
      W3 j = 0 (|Aut| = 6) and j = 1728 (|Aut| = 4), ordinary, prime order.
      Ground truth: the census CAN see these, at exactly sqrt(3) and sqrt(2).
      THIS IS THE POSITIVE CONTROL THE INSTRUMENT MUST PASS.
      W4 CLASS-FLOOR: |Aut| = 2, j generic, sitting at the floor of a volcano
      whose SURFACE carries j = 0. Ground truth: the curve itself is
      indistinguishable from random by every per-curve invariant the census
      records, yet a bounded-degree ascent reaches the sqrt(3) discount.
      W5 NULL: matched random ordinary prime-order non-anomalous curves of the
      same bit size, declared embedding degree and twist rows, no structure.
      W6 SMOOTH N-1: N - 1 smooth, no known weakness - a decoy that LOOKS
      special and is not, guarding against a verdict rule that fires on
      any arithmetic peculiarity.

    STAGE 2 (low compute, THE CENSUS ARM). Run the RQ's declared method set
    unchanged over W1-W6: charged rho, negation-quotient rho,
    automorphism-quotient rho where an F_p-rational automorphism is certified,
    and charged isogeny transfer to one bounded-degree neighbour. 24 seeds, one
    frozen cost model, matched target scalars, solution certificates on the
    original curve. Report D(F, b) per family with bootstrap CIs and against
    the detection floor computed by IDEA-20260829-172151's machinery at the
    achieved n and measured pairing correlation.

    STAGE 3 (low compute, THE GROUND-TRUTH ARM). Run the structure-specific
    attack on each family where one exists: SSSA on W1 (lift to Z_{p^2},
    formal logarithm), MOV/Frey-Ruck on W2 (Weil or Tate pairing into
    F_{p^k}^*, then a finite-field DLP), the ascending transfer on W4 followed
    by the automorphism quotient. Charge every step including pairing
    evaluation and the finite-field solve; verify every recovered scalar on the
    original curve by code that does not call the attack. Report S(F, b).

    STAGE 4 (zero compute, THE ARTIFACT AND THE RESTATEMENT). Emit the
    sensitivity table (family by bit size by {D, S, detection floor,
    certificate status}) and, as the reusable deliverable, a per-cell schema
    field `instrument_sensitivity` recording which structural families the
    cell's method set could and could not have detected. A census cell whose
    method set has zero measured sensitivity to a family may not report a
    verdict about that family at all; it reports UNTESTED. Emit S as an
    obstruction record with units, error bars, runs and scope.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval NOT called. Direct reading 2026-09-04 of all seven
      prior RQ-ECDLP-165d4b proposals in full, KN-TECH-005 and KN-TECH-018 in
      full, KN-OPEN-001 in full, plus grep of knowledge/techniques for
      'Semaev', 'anomalous', 'embedding degree', which located KN-TECH-032
      (MOV/Frey-Ruck, small k), KN-TECH-033 (anomalous, order equal to p, SSSA)
      and KN-TECH-059 (formal logarithm at order equal to p) by header line
      only. Greps of ledger/proposals for 'positive control', 'planted',
      'anomalous'.
    results: >-
      The corpus knows both weak families as TECHNIQUES (KN-TECH-032,
      KN-TECH-033) and the RQ excludes them from primary cells by constraint.
      Every planted control located in this RQ's proposals is explicitly
      synthetic and mathematics-free: IDEA-20260829-172151's dial "delivers no
      mathematical advantage and is charged in full"; IDEA-20260901-753636's
      planted diagonal partition is a hash substitution; IDEA-20260829-34f3ed's
      sabotage is an injected fixed overhead. NO RECORD RUNS A CURVE WITH REAL
      NON-GENERIC WEAKNESS THROUGH THE CENSUS'S DECLARED METHOD SET, and no
      record defines or measures a sensitivity gap.
    verdict: >-
      UNVERIFIED. The component facts are textbook and are corpus techniques;
      the instrument-sensitivity framing, the battery design and the
      restatement rule have no located precedent in this corpus, and
      KN-TECH-032, KN-TECH-033 and KN-TECH-059 were seen by header or grep
      only, not read.

  citations:
    - ref: KN-TECH-005
      provenance: internal
      claim: >-
        Generic-group model: elements are opaque encodings accessed only via
        the group-operation oracle; any generic DLP algorithm needs
        Omega(sqrt p); "the bound is about the generic model; it says nothing
        about attacks exploiting concrete structure (isogenies, pairings on
        low-embedding-degree curves, anomalous curves with #E = p,
        summation-polynomial index calculus over extension fields). Those live
        precisely in the model's blind spot."
      verified_by: >-
        this session, 2026-09-04, read in full. THIS SENTENCE IS THE RECORD'S
        LOAD-BEARING INTERNAL CITATION - the census's method set lives in the
        model, and the corpus already states what the model cannot see.
    - ref: KN-TECH-033
      provenance: internal
      claim: >-
        The anomalous condition is exactly #E(F_p) = p; the additive transfer
        (Smart, Satoh-Araki, Semaev) applies only at trace one and does not
        degrade gracefully.
      verified_by: >-
        this session, 2026-09-04, HEADER AND GREP LINE ONLY (line 19 of
        knowledge/techniques/KN-TECH-033.md plus the claim as quoted in
        IDEA-20260829-20b05f). The record was NOT opened.
    - ref: KN-TECH-032
      provenance: internal
      claim: >-
        The embedding degree k is the least k with l dividing q^k - 1; small k
        enables the MOV/Frey-Ruck transfer to a subexponential finite-field
        DLP; the transfer itself is polynomial, so the attack is useful only
        for small k; small k is negligibly rare for random ordinary
        prime-field curves.
      verified_by: >-
        this session, 2026-09-04, HEADER LINES ONLY (complexity and
        applicability fields, plus the claim as quoted in
        IDEA-20260829-20b05f). The record was NOT opened.
    - ref: IDEA-20260829-172151
      provenance: internal
      claim: >-
        The lane's pre-registered eight-pair sign-permutation rule at
        alpha = 0.025 requires all eight pairs concordant; power at the
        pre-registered ratio 0.90 is about 0.032 under rho = 0, and 80 percent
        power at that effect needs a paired log-work correlation above 0.9964.
        Its planted dial is explicitly synthetic and delivers no mathematics.
      verified_by: this session, 2026-09-04, read in full
    - ref: IDEA-20260829-34f3ed
      provenance: internal
      claim: >-
        Five of six declared census bit rows are empty and the sixth is
        populated from below; the matched-baseline residual is predicted to
        follow R(N) - 1 = c*N^{-e}; its positive control is an injected fixed
        overhead, not a mathematical structure.
      verified_by: this session, 2026-09-04, read in full
    - ref: IDEA-20260901-753636
      provenance: internal
      claim: >-
        harness/rho.py implements a Teske r-adding walk whose only read of
        curve data inside the walk is s = x(R) mod 32, and the step is
        (a, b)-free; therefore every curve-level effect on plain rho must pass
        through that one aperture. Its planted control is a substituted hash.
      verified_by: this session, 2026-09-04, read in full
    - ref: IDEA-20260829-20b05f
      provenance: internal
      claim: >-
        By Tate's theorem every order-derived non-genericity - the anomalous
        condition, the embedding degree k = ord_N(p), Pohlig-Hellman
        smoothness, and the generic-group bound itself - is exactly constant
        across an F_p-isogeny class, so charged isogeny transfer can move none
        of them.
      verified_by: this session, 2026-09-04, read in full
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        The sqrt(|Aut|) discount is a constant factor that does not change the
        exponent; generic ordinary prime-field curves have |Aut| = 2.
      verified_by: this session, 2026-09-04, read in full
    - ref: KN-OPEN-001
      provenance: internal
      claim: >-
        No known algorithm beats ~sqrt(p) for prime-field ECDLP; toy-scale
        prime-field measurements can motivate scaling studies but never settle
        it.
      verified_by: this session, 2026-09-04, read in full
    - ref: null
      provenance: recalled
      claim: >-
        (i) Smart / Satoh-Araki / Semaev: when the curve order equals p the
        p-adic elliptic logarithm gives a group isomorphism to (Z/p, +)
        computable in O(log p) field operations. (ii) Menezes-Okamoto-Vanstone
        and Frey-Ruck: the Weil or Tate pairing embeds the l-torsion of E(F_p)
        into F_{p^k}^*, reducing the ECDLP to a finite-field DLP solvable
        subexponentially. (iii) CM construction of curves with prescribed
        trace, and MNT curves for k in {3, 4, 6}. ALL THREE ARE LOAD-BEARING
        FOR THE BATTERY AND NONE WAS OPENED THIS SESSION; STAGE 3 verifies
        every recovered scalar on the original curve, so no number rests on the
        recollection.
      verified_by: null

  assumptions:
    - >-
      The battery families W1 and W2 are declared CONTROL cells, not primary
      cells. The RQ's constraint that primary curves be non-anomalous with
      declared embedding degree is respected exactly, and no verdict about
      primary cells is inferred from a control cell.
    - >-
      Every planted weakness must be VERIFIED, not asserted: W1 by checking the
      curve order equals p exactly, W2 by computing k = ord_N(p) exactly, W3 by
      certifying an F_p-rational automorphism, W4 by an independent volcano
      level computation. A family whose ground truth cannot be certified is
      dropped, not assumed.
    - >-
      Both arms use ONE frozen cost model with a hash asserted identical. The
      sensitivity gap is a ratio of two charged costs and a cost-model change
      between arms manufactures it.
    - >-
      No hidden scalar-dependent advice: SSSA and MOV are run from public data
      only (curve, p, P, Q), and the pairing and the finite-field solve are
      charged in full including any factor base.
    - >-
      Detection floors come from IDEA-20260829-172151's machinery at the
      ACHIEVED n and the MEASURED correlation, not at the pre-registered ones.
      A D = 1 verdict without its floor is inadmissible by that record's own
      rule and this record adopts it.

  object_first_candidate:
    tracked_object: >-
      The detection delta D(F, b): the census's own verdict statistic - charged
      cost on a planted family divided by charged cost on a matched null -
      evaluated where the ground truth is known independently.
    lossiness: >-
      GENUINELY LOSSY. D retains one ratio and discards the walk, the seeds,
      the collision, the curve equation, the attack, and the certificate; the
      run is not recoverable from it. It is not a change of coordinates.
      COMPATIBILITY WITH THE OPERATION THAT MATTERS. The census's operation is
      COMPARING CELLS, and D is compatible with it by construction because it
      is taken within a bit size against a matched null, so the finite-size
      offset IDEA-20260829-34f3ed measures cancels in the ratio and no
      calibration constant is required. What D discards - everything about WHY
      a cost is what it is - is precisely what the census's verdict column
      discards too, which is why D is the right object for auditing that
      column rather than a richer one.
      RELATION TO IDEA-20260829-172151'S OBJECT: that record's tracked object
      is the VERDICT BIT and its fibre is the set of effect sizes consistent
      with it. D is the statistic UNDERNEATH the bit, evaluated where the true
      effect is not merely known but is mathematically enormous. The two
      compose: 172151 bounds Type II error at a given effect; this record shows
      the effect can be infinite and D still 1.
    propagation: >-
      One-step propagation is defined and measurable: change one structural
      parameter of the planted curve (trace to make it anomalous, embedding
      degree, automorphism count, volcano level) holding N's bit size fixed,
      and measure how D moves. That sweep IS the sensitivity curve and it is
      the record's primary output.
    survival_score: >-
      Survives exactly as far as the census's method set does. It dies the
      moment a structure-specific method is added to the column set - which is
      the record's forward guidance, not a defect.

  null_object_control: >-
    NULL-1, MATCHED RANDOM CURVE (blocking, primary). W5: ordinary,
    prime-order, non-anomalous, matched on N's bit size, declared embedding
    degree and twist rows. D is defined against it and D(W5) = 1 by
    construction; its seed spread IS the detection floor.
    NULL-2, DECOY (blocking). W6: N - 1 smooth, no known weakness. D must be 1.
    A verdict rule that fires here fires on arithmetic peculiarity rather than
    on hardness and every positive is suspect.
    POSITIVE CONTROL (blocking, and it is the whole record's licence). W3:
    j = 0 and j = 1728. The census's automorphism arm MUST return
    D = 1/sqrt(3) = 0.577 and 1/sqrt(2) = 0.707 within EV-ENDO-10109d's
    reported seed spread. An instrument that cannot see the one structure it is
    designed to see may not be used to report an absence of any other.
    GROUND-TRUTH ARM (blocking). Every planted weakness must be
    independently DEMONSTRATED by solving an instance with the
    structure-specific attack and verifying the scalar on the original curve.
    A family whose weakness cannot be demonstrated is UNCERTIFIED and its D is
    uninterpretable.
    CERTIFICATE INDEPENDENCE (blocking). Verification code must not call the
    attack code, per docs/claims-and-verification.md.
    MATCHED PARETO ROWS: charged rho and charged BSGS with memory
    (KN-TECH-006, KN-TECH-031) on every battery member.
    DECAY PARAMETER: bit size. S(W1, b) must GROW with b as
    sqrt(p)/log p, and D must stay at 1. An S flat in b means the ground-truth
    arm is not exploiting the structure; a D that drifts with b is the
    finite-size effect IDEA-20260829-34f3ed measures leaking into the ratio and
    the matched-null design has failed.

  relation_to_prior:
    - >-
      IDEA-20260829-172151 (NEAREST). It computes the OPERATING CHARACTERISTIC
      of the lane's decision rule - Type II error at a stated effect size - and
      its planted dial is explicitly synthetic, "delivers no mathematical
      advantage", with a peek-check forbidding it from touching real structure.
      EXACT DELTA: that record asks "how small an effect would this rule miss";
      this record asks "does the METHOD SET produce an effect at all when the
      curve is genuinely broken". A perfectly powered test of a blind
      instrument is still blind, and 172151 cannot detect that because its dial
      is a dial. The two compose: 172151 supplies the detection floor this
      record's D values are read against, and this record supplies the positive
      control 172151's design lacks.
    - >-
      IDEA-20260829-34f3ed. Calibrates the instrument's finite-size BIAS on a
      null family and injects a known fixed overhead as its positive control.
      EXACT DELTA: an injected overhead tests whether the fit can recover a
      number it was told to expect; it says nothing about mathematical
      sensitivity. This record's ratio is taken within a bit size against a
      matched null, so it needs no calibration constant - stated explicitly so
      the two are not conflated.
    - >-
      IDEA-20260901-753636. Names the aperture x mod r and shows that any
      curve-level effect on plain rho must pass through it; its planted control
      is a substituted hash. EXACT DELTA: that record establishes the CHANNEL
      through which structure could enter and measures its null; this record
      pushes maximal real structure into that channel and measures whether
      anything comes out. Under READING 2 this record routes directly to
      753636's partition-transition instrument, which is named as the follow-up.
    - >-
      IDEA-20260829-20b05f. Proves by Tate that the anomalous condition and the
      embedding degree are class-constant, hence untouchable by transfer. EXACT
      DELTA: that is a statement about what transfer cannot MOVE; this record
      is a statement about what the census cannot SEE, and it uses 20b05f's
      closure to explain why the transfer arm cannot rescue the sensitivity.
    - >-
      IDEA-20260829-2dc43c. Counts the |Aut| > 2 cell and screens anomalous and
      small-k curves "in the same pass at no extra cost". EXACT DELTA: that
      record RECORDS those cells as arithmetic facts; this record RUNS the
      census's methods on them and measures that the methods report nothing.
      Recording a weak curve in a census whose instrument cannot see it is
      exactly the gap this record names.
    - >-
      IDEA-20260901-3e68ad and IDEA-20260901-e3ffc2. The symmetry-column
      closure and the population transfer reading. Neither concerns instrument
      sensitivity and neither runs a weak curve.

  proof_search_map:
    bottleneck: >-
      The step "convert a charged cost measurement into a statement about
      non-generic hardness". Every verdict this census can issue passes through
      it, and the instrument's sensitivity to real non-generic structure has
      never been measured, only its sensitivity to synthetic dials.
    baseline_embedding:
      parameter_slice: >-
        W3, the automorphism family, is the exact parameter slice where the
        census's method set IS sensitive. The instrument must reproduce
        D = 1/sqrt(3) and 1/sqrt(2), i.e. KN-TECH-018's constants, which
        embeds the known-good case as the boundary of the sensitivity family.
      reproduction_check: >-
        Frozen fixture: at p = 100057 with 20 seeds, the j = 0 and j = 1728
        arms must reproduce EV-ENDO-10109d's ratio-to-ceiling means 1.0043 and
        1.0442 within their reported sds 0.1128 and 0.1059. Symbolic: the
        anomalous check (curve order equals p) and the embedding degree
        k = ord_N(p) are computed twice by independent routines and must agree
        exactly.
    observation_collision:
      observable: the detection delta D(F, b)
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - IT IS THE RECORD'S CENTRAL CLAIM.
        Exhibit two curves with the SAME D = 1.00 within the detection floor,
        one of which (W5) is genuinely generic and the other (W1) is solvable
        in O(log p) by a public algorithm. That collision is a direct falsifier
        of the census verdict column's identifiability, and the additional
        condition that separates them is not available to the declared method
        set at all - it is the arithmetic screen, which is a different
        instrument. Failure to construct such a pair would refute the record
        and would mean the census IS sensitive, which is READING 2.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the verdict "generic" - the set of true hardness
          profiles consistent with D = 1 at the cell's own floor - populated
          with an explicit member (W1) whose true cost is O(log p).
        predicted_gain: >-
          Converts "the census found nothing" from an unbounded silence into a
          fibre with a named, maximally distant inhabitant, at the cost of one
          toy run per family.
      - transform: specialization_pack
        proposed_object: >-
          A per-cell `instrument_sensitivity` field listing which structural
          families the cell's method set has MEASURED nonzero sensitivity to.
        predicted_gain: >-
          Makes every cell's verdict self-limiting: a cell may report a verdict
          only over the families its instrument was shown to detect, and must
          report UNTESTED elsewhere, at zero marginal cost once the battery has
          run once.
    quantifier_order: >-
      CLAIMED: FOR ALL planted families F in the battery and FOR ALL tested bit
      sizes b, THERE EXISTS a measured pair (D, S) with stated CIs, and for the
      anomalous and small-k families D is within the detection floor of 1 while
      S grows with b. EXPLICITLY NOT CLAIMED: that no method set could detect
      those families - a structure-specific probe trivially can, and naming
      those probes is the record's forward guidance. ALSO NOT CLAIMED: anything
      about primary cells, which the battery does not contain.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested battery, bit sizes, seeds and cost model, the census's
        declared method set shows detection delta D = [values] with floors
        [values], while the structure-specific attacks show sensitivity gaps
        S = [values], every solve certified on the original curve." It can
        NEVER certify that a primary cell is or is not weak, that no other
        method would see the families, or anything at cryptographic scale.
      nearby_object_control: >-
        THE AUTOMORPHISM FAMILY W3, which is the closest object on which the
        hoped-for conclusion FAILS: there the census's method set IS sensitive,
        by exactly sqrt(|Aut|/2). A method that reports blindness on W3 as well
        has not identified the load-bearing structure (genericity of the method
        set, not weakness of the instrument) and every D is void. BLOCKING.
    proof_obligations:
      - claim: "The declared method set reads curve data only through the group law, equality and Aut."
        responsibility: correctness
      - claim: "Each planted weakness is certified by an independent arithmetic screen."
        responsibility: feasibility
      - claim: "Each structure-specific attack solves an instance, certified on the original curve."
        responsibility: correctness
      - claim: "D is measured against a matched null within a bit size, so no calibration constant enters."
        responsibility: interface
      - claim: "D on W3 reproduces KN-TECH-018's constants and EV-ENDO-10109d's means."
        responsibility: baseline
      - claim: "S grows with bit size as sqrt(p)/log p on the anomalous family."
        responsibility: size
      - claim: "No verdict about primary cells is drawn from a control cell."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        M1 -- detection delta D on the ANOMALOUS family W1, census method set,
        24 seeds, at 16, 20, 24 and 28 bits
      direction: different
      minimum_effect: >-
        Predicted 1.00 with a CI containing 1 and a width below the cell's own
        detection floor at every bit size. A D outside [0.85, 1.18] at two bit
        sizes is READING 2 and escalates.
    - metric: >-
        M2 -- sensitivity gap S on W1, charged rho over charged SSSA, both
        certified
      direction: higher
      minimum_effect: >-
        Predicted above 50 at 16 bits and above 500 at 28 bits, growing as
        sqrt(p)/log p. An S below 10 means the ground-truth arm is not
        exploiting the structure and the family is UNCERTIFIED.
    - metric: >-
        M3 -- detection delta D on the SMALL-k family W2 (k in {2,3,4,6})
      direction: different
      minimum_effect: >-
        Predicted 1.00 within the floor. Same escalation rule as M1.
    - metric: >-
        M4 -- detection delta D on the AUTOMORPHISM family W3 (positive
        control, blocking)
      direction: lower
      minimum_effect: >-
        Predicted 0.577 at j = 0 and 0.707 at j = 1728, within the seed spread
        EV-ENDO-10109d reports (sd about 0.11 on a ratio to ceiling). A D
        indistinguishable from 1 here means the instrument is blind to the one
        structure it was built for and every other number in the run is void.
    - metric: >-
        M5 -- number of distinct battery families sharing the verdict "generic"
        at D within the floor, at least one of which is certified breakable
      direction: higher
      minimum_effect: >-
        Predicted at least 3 of {W1, W2, W5, W6}, establishing the observation
        collision. Fewer than 2 refutes the collision claim and the
        interpretability argument fails.
    - metric: >-
        M6 -- detection delta D on the CLASS-FLOOR family W4 under the census's
        charged transfer arm at bounded degree
      direction: different
      minimum_effect: >-
        Predicted 1.00 for the plain and quotient arms, and 1/sqrt(3) times the
        charged ascent penalty for the transfer arm. This is the one battery
        member where the transfer arm can do something, and its measured value
        is a direct input to the RQ's decision target.
    - metric: >-
        M7 -- certificate pass rate across both arms
      direction: different
      minimum_effect: >-
        Exactly 1.000. Any failure voids the run as an infrastructure outcome,
        never as mathematical evidence.

  minimal_test:
    design: >-
      STAGE A (zero compute, hours): the source-level genericity audit of
      STAGE 0 and the write-up of (A) and (C). Reviewable with no runs, and it
      alone establishes the structural claim; the runs quantify it.
      STAGE B (low compute, THE CHEAPEST VALID DISCRIMINATOR): 16 and 20 bits
      only, with W1 (anomalous), W3 (j = 0), W5 (matched null) and the SSSA
      ground-truth arm. FOUR CELLS AND ONE STRUCTURE-SPECIFIC ATTACK ALREADY
      ESTABLISH THE COLLISION: W3 proves the instrument is not dead, W1 versus
      W5 proves it is blind, and SSSA proves W1 was genuinely broken. Estimated
      wall clock: rho at 16 bits is about 227 charged steps and at 20 bits
      about 900, times 4 families times 4 arms times 24 seeds, i.e. under
      4e5 charged steps in total - minutes, memory megabytes.
      STAGE C (low compute): add W2 (small k, requiring an MNT-style
      construction and a pairing implementation), W4 and W6 at 16-28 bits, plus
      the MOV ground-truth arm. The finite-field solve at k = 3 and 28 bits is
      an 84-bit field DLP and is the only nontrivial cost; bounded and reported
      separately. Estimated single-digit CPU-hours, memory megabytes.
      If STAGE B's positive control W3 fails, STOP and report an instrument
      defect; no D may be interpreted.
    controls:
      - W3 automorphism positive control reproducing 0.577 and 0.707 (blocking)
      - W5 matched random null defining D and the detection floor (blocking)
      - W6 smooth-N-minus-1 decoy, D must be 1 (blocking)
      - ground-truth arm demonstrating each planted weakness by an actual solve (blocking)
      - certificate on the original curve by code independent of the attack (blocking)
      - independent arithmetic screens - the order-equals-p check and k = ord_N(p), computed twice (blocking)
      - detection floor computed at the ACHIEVED n and MEASURED correlation per IDEA-20260829-172151 (blocking)
      - frozen cost-model hash identical across both arms (blocking)
      - matched charged rho and BSGS rows with memory (KN-TECH-006, KN-TECH-031)
      - construction provenance recorded for every planted curve
    required_metrics:
      - per family per bit size - charged cost of each declared method arm, 24 seeds, with bootstrap CI
      - D with CI and the cell's detection floor
      - S with CI, and the charged breakdown of the structure-specific attack
      - certificate status for every solve, both arms
      - arithmetic screen values per curve - t, N, order-equals-p flag, k, |Aut|, volcano level, twist order
      - the verdict-collision set (families sharing the verdict generic)
      - the emitted instrument_sensitivity schema field
      - pass or fail of every blocking control; wall clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. The W3 positive control fails to show D near 0.577 and 0.707. The
      instrument cannot see the structure it was built for; every D is void and
      this is an instrument defect, reported as such.
    - >-
      F2. D differs from 1 beyond the detection floor on W1 or W2 at two bit
      sizes with all controls passing. READING 2: charged generic-walk work is
      coupled to arithmetic structure the generic model excludes. Routed to
      independent validation, red-team review, and IDEA-20260901-753636's
      partition instrument before any interpretation.
    - >-
      F3. The ground-truth arm cannot solve W1 or W2 within budget. Those
      families are UNCERTIFIED, their D values are uninterpretable, and the
      shortfall is recorded as an infrastructure outcome, not as evidence that
      the curves are strong.
    - >-
      F4. Fewer than two families share the "generic" verdict. The observation
      collision does not occur and the interpretability argument fails.
    - >-
      F5. The W6 decoy shows D away from 1. The verdict rule fires on
      arithmetic peculiarity rather than hardness; every positive in this lane
      is suspect and the rule must be re-specified.
    - >-
      F6. All controls pass, D = 1 on W1 and W2, S large and growing.
      READING 1 confirmed: the census's method set has measured zero
      sensitivity to two known non-generic families, and every null cell in
      RQ-ECDLP-165d4b is restated accordingly.
    - >-
      F7. Budget exhaustion. INFRASTRUCTURE outcome under AGENTS.md rule 3.

  confounders:
    - >-
      A BLIND INSTRUMENT IS NOT A WRONG INSTRUMENT. rho is optimal among
      generic methods (KN-TECH-005) and its blindness is a property of the
      MODEL, not a defect. The record must never be summarised as "rho is
      broken"; it is summarised as "a generic instrument cannot answer a
      non-generic question".
    - >-
      PLANTED CURVES ARE NOT PRIMARY CURVES. W1 and W2 are excluded from the
      RQ's primary family by its own constraints. Any inference from the
      battery to primary cells is forbidden and the record says so in every
      summary.
    - >-
      D IS A RATIO AND ITS FLOOR IS NOT ZERO. A D of 1.00 with a floor of 0.30
      says almost nothing; the floor must be reported with every D, per
      IDEA-20260829-172151's own rule, and computed at the achieved n rather
      than the pre-registered one.
    - >-
      MATCHING IS THE WHOLE DESIGN. If W5 differs from a planted curve in bit
      size, seed policy, target scalar or cost model, D measures the mismatch.
      Matching must be on N's bit size, seeds, target policy and cost-model
      hash, and the match reported.
    - >-
      THE GROUND-TRUTH ARM CAN BE UNDERCHARGED. SSSA's lift and MOV's pairing
      and finite-field solve must be charged in full; an undercharged
      ground-truth arm inflates S and makes the gap look larger than it is.
      S is reported with its full breakdown.
    - >-
      SMALL k AT TOY SIZES IS EASY FOR EVERYONE. At 20 bits a k = 3 transfer
      lands in a 60-bit field where index calculus is fast but so is anything;
      the S trend across bit sizes, not its value at one, carries the claim.

  interpretation_limits:
    - >-
      "claim_tier: toy. 16-28 bits. No cryptographic-scale statement is made;
      the S extrapolation to 2^{115} at p ~ 2^256 quoted in (C) is an
      ARITHMETIC CONSEQUENCE of the two algorithms' known complexities, not a
      measurement, and is labelled as such wherever it appears."
    - >-
      This record makes NO statement about any primary census curve's
      genericity, about the ECDLP, or about any deployed system. It is an audit
      of an instrument's sensitivity.
    - >-
      A measured blindness closes exactly the tested method set. Extending the
      census's method column with structure-specific probes - an anomalous
      screen, an embedding-degree screen, a volcano-level screen - removes it,
      and naming those probes is the record's forward guidance, not a defect
      report.
    - >-
      Per KN-OPEN-019 this program has no ECDLP object enumeration; showing one
      instrument blind to two families does not enumerate the families it might
      be blind to, and the record does not claim otherwise.
    - >-
      The corpus records KN-TECH-032 and KN-TECH-033 were seen by header and
      grep only this session. Every ground-truth claim rests on STAGE 3's
      certified solves, not on those headers.

  heuristic_assumptions:
    - id: H1
      statement: >-
        GENERIC-COST INVARIANCE. For ordinary prime-order curves over F_p with
        |Aut| = 2 and fixed N, the seed-averaged charged cost of every method
        in the RQ's declared set is independent of the curve's arithmetic
        invariants (trace, End(E), conductor, embedding degree, anomalousness)
        up to a relative deviation bounded by the cell's detection floor,
        uniformly over 16 <= b <= 28.
      rigorous_support: >-
        Pairs (i) the rigorous statement of the generic-group model
        (KN-TECH-005, Shoup; Nechaev) - an algorithm accessing group elements
        only through opaque encodings and the group oracle has a cost
        distribution depending on the group order alone - with (ii) the
        classical distribution statement it imitates, the random-function
        birthday law that produces the 0.886 constant (KN-TECH-006). The
        heuristic step, and the only one, is that the IMPLEMENTED walk's single
        non-generic read - the aperture s = x(R) mod 32 identified by
        IDEA-20260901-753636 - carries no arithmetic information, which is
        exactly what this record's W1 and W2 cells test with maximal structure
        rather than with a null.
      validation_plan: >-
        SAMPLING - 24 seeds on each of at least 8 curves per family per bit
        size at 16, 20, 24 and 28 bits, with N exactly known and matched across
        families. COMPARISON DISTRIBUTION - the empirical distribution of
        charged cost on each planted family against the matched-null family's,
        by two-sample Kolmogorov-Smirnov and by the paired ratio D with a
        bootstrap CI; the pre-registered expectation is equality within the
        detection floor. TAIL CHECKS - the fastest and slowest of the 24 seeds
        per family compared across families, since a coupling that shows only
        in the tail would be invisible in the mean; and the smallest observed
        charged cost on W1 compared against the SSSA cost, which must remain
        orders of magnitude larger. SAMPLED PARAMETERS RECORDED - p, N, t, k,
        |Aut|, volcano level, construction provenance, seeds, target scalars,
        cost-model hash, harness commit. TRANSFER ASSUMPTION, STATED - none
        beyond 28 bits, and none to any method outside the declared set; the
        extrapolation of S to cryptographic size is arithmetic on published
        complexities, not an extrapolation of these measurements.
    - id: H2
      statement: >-
        BATTERY CONSTRUCTIBILITY. At every declared bit size 16-28 there exist
        ordinary curves over F_p that are simultaneously prime-order and
        anomalous (curve order equal to p), and ordinary prime-order
        non-anomalous curves with embedding degree k in {2, 3, 4, 6},
        constructible by CM/MNT-style methods at negligible cost, in numbers
        sufficient for 8 curves per family per bit size.
      rigorous_support: >-
        The rigorous ingredient is the CM method: given a discriminant d and a
        representation 4p = t^2 + |d|v^2 with p and p + 1 - t prime, a curve
        with trace t is constructible from the Hilbert class polynomial, and
        the anomalous condition t = 1 and the MNT conditions for k in {3,4,6}
        are explicit polynomial parametrisations. The classical statement
        imitated is the density 1/(2h(d)) of primes represented by a form of
        discriminant d, together with the Hardy-Littlewood density of primes in
        the resulting linear form. The heuristic step is only that both
        primality conditions hold often enough at 16-28 bits, which is a
        finite check.
      validation_plan: >-
        CERTIFICATE RATHER THAN SAMPLING: exhibit the constructed curves and
        certify each by an independent order computation (the curve order
        recomputed and checked against the Hasse bound, plus the order times a
        random point equalling the identity), an independent primality test on
        N, an independent computation of k = ord_N(p), and an independent
        twist-order record. A family that cannot be populated to 8 members at a
        bit size is reported SHORT with the achieved count and its D is
        reported with the correspondingly wider floor, never silently pooled
        across bit sizes. SAMPLED PARAMETERS RECORDED - the discriminant list,
        the (t, v, p) solutions, the class polynomial degrees, and every
        certificate. TRANSFER - none; each bit size is populated independently.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED. NO EXPONENT IS CLAIMED OR MOVED BY THIS RECORD. It is a
      control and is offered explicitly as a building block: on its own it is
      instrument characterisation and ranks low under the search heuristics.
      Its priority rests entirely on the fact that every exponent-relevant
      NEGATIVE this RQ can produce is uninterpretable without it, and that the
      quantity it measures (the sensitivity gap S) is itself an exponent
      statement about the gap between the census's instrument and the known
      attacks - 1/2 versus 0 on the anomalous family and 1/2 versus
      subexponential on the small-k family.
    memory_exponent: >-
      O(1) for rho, unchanged, on both arms except the MOV finite-field solve,
      whose factor base and linear algebra are charged in full and reported
      separately. The battery stores O(families times curves times seeds)
      scalars.
    best_known: >-
      Parallel rho at 0.886*sqrt(N), O(1) memory (KN-TECH-006);
      automorphism-discounted rho at most sqrt(6) better (KN-TECH-018); BSGS at
      2*sqrt(n) time, sqrt(n) memory, n^{2/3+o(1)} full cost (KN-TECH-031);
      generic lower bound Omega(sqrt p) (KN-TECH-005). ON THE PLANTED FAMILIES
      THE BEST KNOWN IS NOT GENERIC: SSSA at O(log p) on W1 (KN-TECH-033) and
      MOV/Frey-Ruck plus a subexponential finite-field DLP on W2
      (KN-TECH-032). That mismatch is the measured quantity.
    hidden_overhead: >-
      Disclosed. (i) The sensitivity gap S depends on how well the
      structure-specific arms are implemented; a weak SSSA or MOV
      implementation understates S, so S is reported as a LOWER bound on the
      true gap. (ii) The detection floor is inherited from
      IDEA-20260829-172151's model and is only as good as that model's Rayleigh
      assumption at toy size, which that record's own H1 flags as least
      accurate exactly where this record works. (iii) Battery construction is
      not free and its cost is reported separately from the measurement.
    tradeoff_note: >-
      No time-memory tradeoff is introduced on the census arm. The MOV arm's
      finite-field solve occupies a different corner of the frontier entirely
      and its memory is charged; the comparison D is taken only within the
      census arm, so no cross-corner comparison is made.

  dominated_by: >-
    AS AN ATTACK: none is proposed; every Pareto row checked individually.
    TIME - parallel rho at 0.886*sqrt(N) (KN-TECH-006) dominates on primary
    curves; on the battery, SSSA (KN-TECH-033) and MOV (KN-TECH-032) dominate
    absolutely, and that domination IS the measurement rather than a claim of
    this record.
    MEMORY - rho at O(1) dominates the census arm.
    MEMORY-RICH - BSGS (KN-TECH-031), carried as a matched control.
    CM-SPECIFIC - automorphism-discounted rho (KN-TECH-018) dominates W3 and is
    used as the blocking positive control, not beaten.
    DATA/QUERIES - none consumed beyond the instances solved.
    LOWER BOUND - KN-TECH-005's Omega(sqrt p) is untouched, and the record's
    whole point is that it is a bound about a model.
    All rows checked; none beaten.
    AS A CONTROL ARTIFACT: not dominated by any record in this repository - no
    committed record measures any instrument's sensitivity to real non-generic
    structure, and every planted control located in this lane is explicitly
    synthetic and mathematics-free. Against external practice, running known
    weak instances through an evaluation pipeline is elementary methodology and
    no priority is claimed; novelty_status is unverified accordingly.

  sota_delta: >-
    ECDLP time exponent delta 0; memory exponent delta 0; data/query delta 0;
    security bits reduced 0. NON-ZERO DELTAS, QUANTIFIED.
    (i) SENSITIVITY, MEASURED FOR THE FIRST TIME: the census's method set is
    predicted to show D = 1.00 on a curve whose true cost is O(log p), giving a
    measured sensitivity gap of at least 50 at 16 bits and at least 500 at 28
    bits, and an arithmetic gap of about 2^{115} at p ~ 2^256. Before this
    record that gap is not merely unmeasured, it is not defined.
    (ii) VERDICT SEMANTICS: converts every present and future "no non-generic
    behaviour found" cell in RQ-ECDLP-165d4b from an unbounded silence into the
    bounded statement "no deviation of a generic constant beyond MDE, over the
    families this instrument was shown to detect" - which is a strictly
    smaller and strictly honest claim, at the cost of one battery run.
    (iii) DECISION TARGET: bounds what a null in EITHER lane can mean. A null
    in the endomorphism-orbit lane or the transfer lane, produced by an
    instrument with measured zero sensitivity to known weakness, cannot settle
    the RQ's decision target, and this record supplies the number that says so.
    (iv) FORWARD GUIDANCE WITH A PRICE: names the three structure-specific
    probes (anomalous screen, embedding-degree screen, volcano-level screen)
    that would restore sensitivity, each of which is O(polylog) per curve and
    two of which IDEA-20260829-2dc43c already proposes computing in the same
    pass at no extra cost.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the source-level genericity audit (A) survives for this harness.
    0.93 that D = 1 within the floor on W1 and W2 (so about 0.07 on the
    coupling branch, which is the branch worth the run). 0.9 that the W3
    positive control reproduces 0.577 and 0.707. 0.8 that both ground-truth
    arms are implementable within budget at 16-28 bits, with the MOV arm the
    likelier shortfall. Most likely honest headline: "the census's declared
    method set shows detection delta 1.00 +/- 0.06 on curves that a public
    algorithm breaks in O(log p), so its verdict column measures a generic
    constant and its nulls must be restated."

