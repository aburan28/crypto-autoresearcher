  novelty_screen: >-
    Screened on 2026-08-11 against the committed proposal corpus by ripgrep.
    Queries: "ray class|ray-class|level structure|Artin map|Shimura reciprocity"
    over ledger/ (the only substantive hits are IDEA-20260808-5158fa,
