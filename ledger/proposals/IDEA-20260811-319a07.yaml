idea:
  id: IDEA-20260811-319a07
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  claim_tier: toy
  title: >-
    THE OBJECTS DO FUSE, AND THE REDUCTION EXISTS -- FOR THE OTHER GROUP.
    Because E(F_p) = ker(pi - 1) = E[m] with m = (pi - 1)O, the pairs
    (curve, rational point) in one ordinary isogeny class form a torsor under
    the RAY CLASS GROUP Cl_m(O), and the extension
    1 -> (O/m)^*/{+-1} -> Cl_m(O) -> Cl(O) -> 1 splits the ray-class
    vectorization problem EXACTLY into ECDLP (the kernel part) and
    Cl(O)-vectorization (the quotient part). So a Cl(O)-vectorization oracle is
    provably the useless half by construction, a Cl_m-vectorization oracle
    solves ECDLP outright, and the corpus's "curves and points are different
    objects" obstruction is FALSE as a categorical statement -- the real
    obstruction is that exactly one arrow in the diagram, the coordinate map
    psi from points to O/m, is not computable, and computing it IS the ECDLP
  class: mechanism

  claim: >-
    (A) THE OBJECT, CONSTRUCTED. Let E/F_p be ordinary with Frobenius pi,
    End_{F_p}(E) = O, and set m := (pi - 1)O, an ideal of O. Then
      [fact] E(F_p) = ker(pi - 1) = E[m],
    so the group of rational points IS the m-torsion, and
      [fact, Lenstra 1996] E(F_p) is isomorphic to O/m as an O-module.
    Consider the set
      X_m := {(E', P') : E' in the F_p-isogeny class with End = O,
              P' a generator of E'[m] as an O-module} / isomorphism,
    i.e. curves in the class equipped with (pi - 1)-level structure.

    (B) THE GROUP THAT ACTS. For an ideal a of O coprime to m and to the
    conductor, the isogeny phi_a : E' -> E'/E'[a] carries E'[m] isomorphically
    onto (E'/E'[a])[m], so a acts on X_m. A principal ideal (alpha) with
    alpha = 1 mod m acts trivially, because phi_alpha acts on E'[m] as
    multiplication by alpha mod m = 1. Hence the generalised (ray) class group
      Cl_m(O) := I_m(O) / P_{m,1}(O)
    acts on X_m, and it sits in the exact sequence
      [recall-confident, standard class field theory of generalised ideal
       class groups]
      1 -> (O/m)^* / image(O^*) -> Cl_m(O) -> Cl(O) -> 1.
    The counting identity #X_m = #Cl_m(O) is a CHECKABLE prediction of simple
    transitivity and is the record's hard gate (see minimal_test); simple
    transitivity itself is marked [open] and carried as a proof obligation, not
    asserted.

    (C) THE REDUCTION, IN BOTH DIRECTIONS, WITH QUANTIFIER ORDER EXPLICIT.
    Define RAY-VECT: given (E_1, P_1) and (E_2, P_2) in X_m, output the unique
    [c] in Cl_m(O) with [c] * (E_1, P_1) = (E_2, P_2).

      DIRECTION 2-PRIME (oracle to ECDLP):
        FORALL p, FORALL ordinary (E, O) with m = (pi - 1)O,
        THERE EXISTS a polynomial-time oracle machine R,
        FORALL P generating G of prime order N, FORALL k in (Z/N)^*:
          R^{RAY-VECT}(p, E, P, [k]P) = k.
        MECHANISM: query RAY-VECT on ((E, P), (E, [k]P)). Both pairs have the
        SAME curve, so the answer maps to the identity in Cl(O) and therefore
        lies in the kernel subgroup (O/m)^*/{+-1}. Push it through the ring
        surjection O/m -> O/n = Z/N, where n = (N, pi - 1); the image is
        exactly +-k. One group operation resolves the sign. This is a genuine
        polynomial-time reduction and it is the deliverable the axis asks for.

      DIRECTION 2-PRIME, CONVERSE (ECDLP plus curve vectorization to oracle):
        RAY-VECT reduces to Cl(O)-VECT plus ECDLP: vectorise the curves to get
        [a] with [a]E_1 = E_2; take a smooth representative of [a]; evaluate
        phi_a on P_1; solve one ECDLP between phi_a(P_1) and P_2 on E_2. The
        smooth-representative step is the only heuristic input (HA-1).
      CONCLUSION: RAY-VECT is EQUIVALENT to the pair (Cl(O)-VECT, ECDLP), with
      the exact sequence in (B) as the reduction diagram. The kernel part IS
      the ECDLP; the quotient part IS curve vectorization.

    (D) WHAT THIS SETTLES, AND IT IS THE HANDOFF'S QUESTION.
      D1. "A vectorization oracle is useless" is a THEOREM about the QUOTIENT
          of the exact sequence and a HABIT about the word "vectorization". The
          Cl(O) oracle is, by construction, an oracle for the part of the
          problem that k does not live in. Saying it is useless is correct and
          says nothing about the object; the object that contains k is the
          kernel, and the corpus has never named it.
      D2. "Curves and points are different objects" (the obstruction
          DECOMPOSITION.md L10 records) is FALSE as a categorical statement:
          X_m fuses them into one torsor and the fusion is canonical, standard
          and computable on the ideal side. What is true is a strictly weaker
          and much more useful statement, given next.
      D3. THE COORDINATE OBSTRUCTION, NAMED. Every arrow of the diagram is
          polynomial-time computable from public data -- O and m as explicit
          rings; O/m as an explicit finite ring; the surjection O/m -> Z/N; the
          scalar lambda_alpha by which any alpha in O acts on G; the action of
          any smooth ideal on a pair -- with EXACTLY ONE exception: the
          O-module coordinate map
            psi : E(F_p) -> O/m,
          normalised by psi(P) = 1, for which psi(Q) = k. Computing psi on one
          point IS the ECDLP. The obstruction is not that the objects are
          different, and not that Hom vanishes; it is that the diagram is
          computable everywhere except on the single arrow that leaves the
          point world.
      D4. THE COMPUTABLE PART OF psi IS EXACTLY POHLIG-HELLMAN. For a prime
          ideal q dividing m of small norm ell, the image of Q in
          E(F_p)/qE(F_p) is computable in O(ell) group operations -- and it is
          precisely the ell-part of k. For prime N with small cofactor there is
          nothing left to compute. This retro-derives, as a corollary,
          IDEA-20260807-e9d57c's observation that the composite-order bridge
          leaks exactly v_ell(k) and is worth exactly nothing, and it predicts
          that record's calibrated non-null from the diagram rather than from
          inspection.
      D5. THE PRIZE, STATED AS A CONDITIONAL AND NOT AS A CANDIDATE. Ray class
          groups of imaginary quadratic orders admit subexponential structure
          and discrete-logarithm computation in |D| (Hafner-McCurley /
          Buchmann line, as already recorded in IDEA-20260807-8cdc79's PIP
          discussion). IF a polynomial-time algorithm existed that produced an
          IDEAL REPRESENTATIVE of the ray class of a point -- i.e. any partial
          computation of psi beyond D4 -- ECDLP would fall to L_p(1/2). No such
          algorithm is proposed here and the record's own prediction is that
          none exists; the conditional is stated so that the target is precise
          rather than vague.

    (E) WHY THE PREVIOUSLY RECORDED OBSTRUCTIONS ARE SHADOWS OF D3.
      IDEA-20260807-5d7606 OBS-1 (the kernel-ideal bridge is constant): the
        bridge it studies is the composite X_m -> X (forget the level
        structure). Of course it is constant on the fibre -- the fibre is
        exactly what it forgets.
      IDEA-20260807-0fafe8 (Hom(Z/N, Cl(O)) = 0) and IDEA-20260807-bbdcf3 (the
        size gap h < N): both correctly show k cannot live in the QUOTIENT.
        The diagram shows it lives in the KERNEL, where no size obstruction
        applies at all -- #(O/m)^* is of order #E(F_p), not of order h.
      IDEA-20260808-5158fa (p splits completely in the ray class field K_n, so
        the Artin symbol is trivial): this is the characteristic-zero closure of
        the ONE route to computing psi through splitting data. It is the
        strongest existing partial answer to D3 and this record does not
        duplicate it -- it names the general obstruction of which 5158fa closes
        one instance.

  resource_label: >-
    R3 (End(E) as a ring -- the ideal m, the finite ring O/m, the ray class
    group), R4 (the class-group action on curves, lifted to pairs), and R5
    (E[m] as a torsion module with level structure). TAXONOMY NOTE: the
    resource actually consumed is LEVEL STRUCTURE AT THE FROBENIUS MODULUS,
    which R5 covers only for ell != N; here the modulus is m = (pi - 1), whose
    norm is #E(F_p) and which therefore straddles the R5/G boundary. The record
    proposes this as a candidate NEW taxonomy sub-entry, R5', rather than
    silently reusing R5, and leaves the decision to the Coordinator.
  admissibility: admissible_with_a_caveat_stated_in_full
  admissibility_argument: >-
    THE CAVEAT IS STATED FIRST BECAUSE IT IS THE FILTER'S CENTRAL CASE. The
    kernel part of the exact sequence acts on the point by P -> [lambda_alpha]P,
    which IS an endomorphism applied to a point of G, and H-ENDO-001 says that
    is a scalar and adds no congruence. If the record's only content were that
    action, it would be INADMISSIBLE ON ITS FACE and must not be filed.
    It is not. The record's content is the DIAGRAM: (i) the identification of
    the object X_m whose coordinate contains k, (ii) the exact sequence that
    splits ray-class vectorization into the two halves, (iii) the demonstration
    that the corpus's chosen group is the useless half BY CONSTRUCTION, and
    (iv) the naming of the single non-computable arrow. None of (i)-(iv) is an
    application of phi to a point of G, and (iii) in particular is a statement
    about which oracle to grant, not about how to use one. The record explicitly
    does NOT claim that applying endomorphisms to G yields anything, and it
    treats H-ENDO-001's scalar collapse as the CORRECT description of the
    kernel's action -- indeed the scalar collapse is what makes D3's
    identification of psi with the ECDLP exact.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Named and declared off-limits as the PRIMARY lens for this session: the
      connecting ideal class (the vectorization object); the kernel ideal of
      <Q>; the scalar lambda of an endomorphism on G; cost functionals as class
      functions; the generic-group transcript.
    tracked_object: >-
      THE RAY-CLASS COORDINATE OF A PAIR: the element of Cl_m(O) that carries
      (E_0, P_0) to (E', P'), followed as the pair moves under isogenies and
      under scalar multiplication of the point. It is anchored at neither the
      curve alone nor the point alone.
    lossiness: >-
      GENUINELY LOSSY, AND THIS IS CHECKABLE. The projection sends the full
      state (a Weierstrass equation over F_p, an affine point with two field
      coordinates, all of E(F_p)) to a single element of a group of order
      about h*N -- discarding the field-element content of x(P') and y(P')
      entirely, and discarding every point of E'(F_p) other than the chosen
      generator's O-module class. What survives is a torsor coordinate. It is
      discarded COMPATIBLY with the target's operations: the two operations of
      interest -- apply a smooth isogeny, and multiply the point by a scalar --
      both act on the coordinate by group multiplication in Cl_m, so the
      retained part propagates deterministically and one-step propagation is
      exactly one group multiplication. Contrast with the failed example in
      docs/inventor-protocol.md section 2: nothing here is recoverable from the
      coordinate alone without the base point, so this is not a change of
      coordinates.
    propagation: >-
      One step, defined and measurable: multiplying P' by u in (Z/N)^* moves
      the coordinate by the kernel element u; applying phi_l for a split prime
      l moves it by the class of l. Both are computable at toy scale, and the
      composite of the two commutes exactly (the sequence is a group extension,
      not merely a filtration) -- a testable algebraic identity.
    survival_score: >-
      Survives the entire class and all of (Z/N)^*, i.e. the whole instance
      family, which is the point: it is the first object in this lane whose
      value is NOT constant on {(E, P, [k]P)}. It DISSOLVES exactly where the
      order theory does: when gcd(m, conductor) > 1, when E'[m] is not
      O-cyclic, and in the supersingular case where O is not commutative. Those
      three dissolution points are the record's declared scope boundary.

  mechanism: >-
    STEP 1 (zero compute, symbolic). Write the diagram: X_m, the action, the
    exact sequence, and the two reduction directions of (C), with quantifiers
    frozen.

    STEP 2 (zero compute, symbolic). Write out every arrow with its computation
    cost, and mark exactly which are polynomial-time from public data. Produce
    the one-page table whose single non-computable entry is psi. This table is
    the deliverable an outside reader should be handed first.

    STEP 3 (toy compute, HARD GATE -- the counting identity). For toy ordinary
    classes with maximal O and small h: enumerate the class; for each curve
    enumerate the generators of E'[m] up to isomorphism; count #X_m. Compute
    #Cl_m(O) independently from the exact sequence as
    h(O) * #(O/m)^* / #image(O^*). Assert equality. A mismatch falsifies simple
    transitivity as implemented and halts the line; it is an elementary
    identity, so a mismatch is an implementation bug until independently
    replicated.

    STEP 4 (toy compute). Verify the reduction of (C) end to end at toy scale:
    implement RAY-VECT by brute force on a small class, run the Direction-2'
    reduction, and check it returns k for 200 values of k on each curve. Then
    run the converse: implement RAY-VECT from Cl(O)-VECT plus an ECDLP solver
    and check the two implementations agree on every pair.

    STEP 5 (toy compute). Verify D4 quantitatively: on curves with cofactor
    c > 1, measure how many bits of k the computable part of psi yields, and
    confirm it equals log2(c) exactly -- and equals ZERO when c = 1.

    STEP 6 (zero compute). Record the residual open class for D5: partial
    computations of psi. Hand the characteristic-zero branch to
    IDEA-20260808-5158fa, which has already closed it, and state the remaining
    characteristic-p branch explicitly.

  why_not_a_renamed_known_approach: >-
    The nearest known mathematics is entirely classical and NONE of it is
    claimed as new: Lenstra's CM structure theorem, the ideal-subgroup
    correspondence, generalised ideal class groups, and the theory of complex
    multiplication with level structure. What is not present in this corpus,
    and is the record's contribution, is the USE: identifying X_m as the object
    the lane has been missing, deriving the exact sequence as a REDUCTION
    DIAGRAM that splits ray-class vectorization into ECDLP times curve
    vectorization, and converting the lane's folk obstruction ("different
    objects") into the sharp and correct one ("one non-computable arrow").
    IDEA-20260808-5158fa uses the ray class FIELD of conductor n = (N, pi - 1)
    in characteristic zero to close one route; this record works in
    characteristic p with the ray class GROUP of modulus m = (pi - 1), a
    different (larger) modulus, a different object (a torsor of pairs rather
    than a Galois group of a number field), and reaches a different kind of
    statement (a reduction plus a named obstruction rather than a splitting
    computation). The two are complementary and 5158fa is cited as closing one
    branch of this record's forward guidance.

  proof_search_map:
    bottleneck: >-
      The coordinate map psi : E(F_p) -> O/m. Everything else in the diagram is
      polynomial time. Removing psi's non-computability is precisely removing
      the ECDLP; no other step in the record would change any cost.
    baseline_embedding:
      parameter_slice: >-
        Take m = (1), i.e. trivial level structure. Then X_m collapses to the
        set of curves, Cl_m = Cl(O), and the whole diagram degenerates to the
        ordinary class-group action studied by every existing L10 record --
        with k nowhere in it. That degeneration is the exact parameter slice
        reproducing the corpus's baseline framing, and it makes visible that
        the baseline was working in the quotient.
      reproduction_check: >-
        Symbolic: with m = (1) the exact sequence has trivial kernel and
        Cl_m = Cl. Additionally, a frozen fixture at toy scale must reproduce
        the known class-group order h(O) from the general #Cl_m formula when
        m = (1). Verified by construction, checked numerically on the ladder.
    observation_collision:
      observable: >-
        The ray-class coordinate of a pair, i.e. the element of Cl_m(O)
        connecting (E_0, P_0) to (E', P').
      distinct_preimage_search: >-
        REQUIRED. Search for two distinct pairs with the same coordinate. If
        simple transitivity holds, none exists and the observable is perfectly
        identifying -- the opposite of every prior L10 observable, all of which
        collided on the entire instance family. The search is therefore run in
        the CONFIRMING direction and any collision found falsifies simple
        transitivity, which is the record's own hard gate in STEP 3. Note the
        honest consequence: a perfectly identifying observable is not an
        attack; it relocates the difficulty into computing the observable,
        which is D3.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the curve coordinate (which is k-independent, hence does not
          survive the reduction to the instance family) by the pair coordinate,
          which does. Record the three required maps: strong state -> target
          property is the projection of the kernel part to Z/N giving k;
          one-step preservation is the group multiplication in Cl_m; and
          initialisation is the choice of base pair (E, P).
        predicted_gain: >-
          None as an attack. The gain is that the invariant now CONTAINS the
          answer, which converts the lane's question from "is there a bridge"
          (answered: yes, canonically) to "is the coordinate computable"
          (answered: no, except on the Pohlig-Hellman part).
      - transform: representation_reduction
        proposed_object: >-
          The exact sequence as a reduction chain with separate obligations:
          encoding (pairs to ray classes), completeness (every pair is hit),
          soundness (the coordinate is unique), transfer (the surjection to
          Cl(O) and the injection of (O/m)^*), and cost loss (smooth
          representative for the converse direction, HA-1).
        predicted_gain: >-
          Exhibits Cl(O)-vectorization as provably the k-free half, which is a
          stronger statement than any measured or model-relative closure in the
          lane.
    quantifier_order: >-
      ASSERTED (Direction 2-prime): FORALL p, FORALL ordinary (E, O) with
      m = (pi - 1)O and E[m] O-cyclic, THERE EXISTS a polynomial-time R,
      FORALL P of prime order N, FORALL k in (Z/N)^*:
      R^{RAY-VECT}(E, P, [k]P) = k. R is uniform given (p, E, O); the base point
      is NOT chosen by R; End(E) IS known to R (it must construct m).
      ASSERTED (converse): FORALL instances, RAY-VECT is computable from one
      Cl(O)-VECT query, one smooth-representative computation (HA-1) and one
      ECDLP solve.
      NOT ASSERTED: that RAY-VECT is easier than ECDLP -- it contains ECDLP, so
      it is not; that any oracle in this diagram is realisable below p^{1/2};
      that psi is computable.
      WITHOUT KNOWLEDGE OF End(E) the reduction still holds but R must first
      factor t^2 - 4p, which is subexponential; this variant is strictly weaker
      and is labelled.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Ray-class vectorization for the modulus (pi - 1) is polynomial-time
        equivalent to the pair (Cl(O)-vectorization, ECDLP), and the ECDLP is
        exactly the kernel factor." It can NEVER certify a cost improvement,
        because the object it identifies CONTAINS the problem it is about. Any
        reading of this record as an attack is a misreading and is
        overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE COMPOSITE-ORDER / LARGE-COFACTOR CURVE. There the desired
        conclusion "the coordinate is uncomputable" FAILS in a controlled,
        quantified way: the computable part of psi yields log2(c) bits, exactly
        Pohlig-Hellman. That the method reproduces the known answer on the
        nearby object where the conclusion is known to fail is the evidence
        that it has identified the load-bearing structure rather than restated
        "points are not curves". A version of this argument that also predicted
        zero bits in the cofactor case would be identifying the wrong thing.
    proof_obligations:
      - claim: E(F_p) = ker(pi - 1) = E[m] for m = (pi - 1)O.
        responsibility: correctness
      - claim: E(F_p) is O-isomorphic to O/m (Lenstra).
        responsibility: correctness
      - claim: >-
          Ideals coprime to m and to the conductor act on X_m, and P_{m,1} acts
          trivially, so Cl_m(O) acts.
        responsibility: correctness
      - claim: The action of Cl_m(O) on X_m is simply transitive.
        responsibility: feasibility
        status: >-
          '[open] -- carried as an obligation, tested by the counting identity
          in STEP 3, and NOT asserted. For non-maximal O the statement needs
          coprimality to the conductor and may require the correct notion of
          proper ideals; the record scopes its primary claims to O maximal.'
      - claim: >-
          1 -> (O/m)^*/im(O^*) -> Cl_m(O) -> Cl(O) -> 1 is exact.
        responsibility: correctness
        status: '[recall-confident] standard; NOT re-verified this session.'
      - claim: >-
          The kernel element connecting (E, P) to (E, [k]P) maps to +-k under
          O/m -> O/n = Z/N.
        responsibility: correctness
      - claim: >-
          Every arrow except psi is polynomial-time computable from
          (p, E, t, D, factorisation of D).
        responsibility: scope
      - claim: >-
          The computable part of psi is exactly the Pohlig-Hellman part.
        responsibility: strictness

  predictions:
    - metric: >-
        agreement of the counting identity #X_m = h(O) * #(O/m)^* / #image(O^*)
        on fully enumerated toy classes
      direction: different
      minimum_effect: >-
        exact equality on 100 percent of tested classes. This is an identity,
        not a correlation; a single mismatch falsifies simple transitivity as
        implemented and halts the line.
    - metric: >-
        success rate of the Direction-2' reduction, over 200 values of k per
        toy curve, given a brute-force RAY-VECT oracle
      direction: higher
      minimum_effect: >-
        1.00 after sign resolution. Anything below 1.00 means the kernel-to-Z/N
        projection is mis-implemented, not that the reduction fails.
    - metric: >-
        number of bits of k recovered by the computable part of psi, as a
        function of the cofactor c = #E(F_p)/N
      direction: higher
      minimum_effect: >-
        exactly log2(c) bits, and exactly 0 when c = 1. A measurement showing
        MORE than log2(c) bits at c = 1 would refute D4 and would be the single
        most consequential outcome available in this lane; it would be escalated
        under P3 rather than stated.
    - metric: >-
        commutativity residual of the two one-step propagations (scalar on the
        point versus small-prime isogeny on the curve), measured as the number
        of pairs on which the two orders of composition disagree
      direction: lower
      minimum_effect: >-
        exactly 0, because the sequence is a group extension. A nonzero
        residual means the action is not what the diagram says and the whole
        record is wrong at its foundation.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the cheapest discriminator): write the diagram and
      the arrow-cost table. If a reviewer can name a polynomial-time
      computation of psi beyond the Pohlig-Hellman part, the record is refuted
      -- and that refutation is an ECDLP result, so the stage is worth running
      even at prior probability near zero.
      STAGE 1 (minutes): toy ordinary curves at 12-20 bits with O maximal
      (f = 1), h(O) between 4 and 40, and prime N with small cofactor.
      Construct O, m, the finite ring O/m, and the surjection to Z/N
      explicitly. Verify pi = 1 mod m by ideal arithmetic.
      STAGE 2 (minutes, HARD GATE): the counting identity of STEP 3.
      STAGE 3 (minutes): the end-to-end reduction check of STEP 4, both
      directions, on the same instances.
      STAGE 4 (minutes): the cofactor ladder of STEP 5, c in {1, 2, 4, 8, 9},
      measuring recovered bits against log2(c).
      Total: one CPU-hour with a computer-algebra system that does binary
      quadratic form / order arithmetic. No solver, no certificate, no new
      infrastructure.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): the SAME pipeline with the level
        structure REMOVED, i.e. m = (1). Every quantity must degenerate: X_m
        becomes the curve set, the kernel becomes trivial, the recovered bits
        become 0, and the reduction of (C) must FAIL to return k. An
        implementation that still returns k with trivial level structure is
        reading k from somewhere it should not and every result is void.
      - >-
        PLANTED SIGNAL (two-directional control): the cofactor ladder is the
        planted signal -- at c = 8 the instrument MUST recover exactly 3 bits.
        An instrument recovering 0 bits at c = 8 is blind and the run set is
        INVALID rather than negative.
      - >-
        Two independent constructions of O/m (from the binary quadratic form
        and from the explicit Z-basis {1, theta} with pi = A + (f/f_E) theta)
        must agree elementwise, so a ring-arithmetic bug cannot masquerade as a
        structural finding.
      - >-
        SUPERSINGULAR CONTROL: one supersingular instance, where O is not
        commutative and the construction does not apply. The pipeline must
        REFUSE it rather than silently produce a number.
    required_metrics:
      - '#X_m and #Cl_m(O) per class, with the equality flag'
      - reduction success rate over sampled k, both directions
      - recovered bits versus log2(cofactor)
      - commutativity residual count
      - per-instance h(O), |D|, conductor f, cofactor c

  controls:
    - >-
      NULL OBJECT: trivial level structure m = (1), as above. The matched null
      the deliverable requires.
    - >-
      DECAY PARAMETER: the cofactor c. Recovered bits must decay to 0 as c -> 1.
      A signal that does not decay is the canonical artifact tell of
      docs/inventor-protocol.md section 3 and means the instrument is reading
      something other than psi.
    - >-
      A second decay parameter: h(O). As h -> 1 the quotient part of the exact
      sequence becomes trivial and RAY-VECT must degenerate to pure ECDLP. If
      the measured reduction changes behaviour at h = 1, the two halves are not
      cleanly separated and the diagram is mis-implemented.

  confounders:
    - >-
      NON-MAXIMAL ORDERS. For f_E > 1 the ideal theory needs proper ideals and
      coprimality to the conductor; m = (pi - 1) may fail to be coprime to the
      conductor. The record scopes its primary claims to O maximal and treats
      the general case as an explicit open extension rather than assuming it
      through.
    - >-
      O-CYCLICITY OF E'[m]. If E'(F_p) is not O-cyclic the level structure is
      not a single generator and X_m is not what the record defines. Checked
      per instance, not assumed.
    - >-
      UNITS. For D_0 = -3 and -4 the unit group is larger than {+-1} and the
      counting identity changes; those instances are reported separately and
      never pooled.
    - >-
      THE SIGN AMBIGUITY. The kernel is (O/m)^*/{+-1}, so the reduction returns
      +-k. This is a genuine one-bit ambiguity, resolved by one group
      operation, and it must be reported rather than silently absorbed.

  falsification_conditions:
    - >-
      The counting identity fails on any fully enumerated toy class. Simple
      transitivity is false as stated and the object is not a torsor; the
      diagram must be rebuilt.
    - >-
      The Direction-2' reduction fails to return +-k on any instance with a
      correct brute-force oracle. The kernel-to-Z/N projection is wrong and the
      central reduction claim collapses.
    - >-
      The m = (1) null returns k. The pipeline leaks and every measurement is
      void, not negative.
    - >-
      A reviewer exhibits a polynomial-time computation of psi beyond the
      Pohlig-Hellman part. Then D3 is false, D5's antecedent holds, and this
      record is superseded by an ECDLP result -- the branch the record most
      wants tested and rates least likely.

  interpretation_limits:
    - >-
      THIS IS NOT AN ATTACK AND CONTAINS NO ALGORITHM. The object identified
      CONTAINS the ECDLP; identifying it moves no cost. Anyone reading a
      speedup into the phrase "the reduction exists" has misread the direction
      of the arrows.
    - >-
      The reduction in (C) is polynomial time in the ORACLE model only. RAY-VECT
      is not a known-easy problem and this record explicitly does not claim it
      is; it is at least as hard as ECDLP by (C) itself.
    - >-
      Scoped to ORDINARY curves over F_p with O maximal, E[m] O-cyclic, N prime.
      Nothing is claimed about supersingular curves, non-maximal orders,
      extension fields, or any deployed curve.
    - >-
      Toy scale for every measured quantity. The symbolic parts are scale-free;
      their empirical confirmation is not.
    - >-
      D5 is a CONDITIONAL whose antecedent this record argues is false. It is
      not a claim that any curve is at risk, and it must not be quoted without
      its antecedent.

  assumptions:
    - >-
      E ordinary over F_p, p > 3, End_{F_p}(E) = O maximal in K = Q(sqrt(D_0)),
      N prime with N || #E(F_p), E(F_p) cyclic as an O-module.
    - >-
      '[recall-confident] H. W. Lenstra Jr., Complex multiplication structure of
      elliptic curves, J. Number Theory 56 (1996) 227-241: E(F_p) = O/(pi - 1)O
      as O-modules. NOT re-verified this session.'
    - >-
      '[recall-confident] The ideal-subgroup (Deuring/Waterhouse/Kohel)
      correspondence and its equivariance, and the standard exact sequence for
      generalised ideal class groups. NOT re-verified this session.'
    - >-
      '[recall-confident] Complex multiplication with level structure: the ray
      class group of modulus m acts on curves with m-level structure. This
      record uses only the char-p torsor statement, which STEP 3 tests
      numerically rather than assuming.'

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a uniformly random class [a] in Cl(O) with h(O) = |D|^{1/2+o(1)},
        a representative ideal that is B-smooth with B = (log|D|)^{O(1)} exists
        and is found in polynomial time by the standard relation-lattice
        reduction, with probability 1 - o(1), uniformly over classes.
      rigorous_support: >-
        Pairs the rigorous fact that the split primes below (log|D|)^{2}
        generate Cl(O) under GRH (Bach's bound) with the classical
        Canfield-Erdos-Pomerance smoothness distribution imitated by treating a
        reduced representative's norm as a random integer of its size. This is
        the same shape of composition as Heuristic 1 of the exemplar in
        docs/target-result-profile.md.
      validation_plan: >-
        Toy scale: for 10^4 random classes over a ladder of discriminants with
        h(O) in [50, 5000], compute a reduced representative, factor its norm,
        and compare the empirical CDF of log(largest prime factor) against the
        Dickman-de Bruijn rho(u) prediction with u = log(Nm)/log(B). Record the
        discriminant ladder, the sample sizes, and the fact that this validates
        only the toy regime; the transfer assumption to crypto-sized |D| is
        stated and NOT established.
      tail_checks: >-
        Compare the smoothest observed representative in each ladder rung
        against the predicted rho(u) probability for that smoothness bound, and
        record the count of classes whose reduced representative has NO factor
        below B as a check on the opposite tail.
    - id: HA-2
      statement: >-
        NOT A HEURISTIC, RECORDED SO NO CONDITIONALITY IS IMPORTED. Claims
        (A)-(D4) use no distributional assumption whatsoever. The exact
        sequence, the action, the counting identity and the Pohlig-Hellman
        identification are algebraic. Only the CONVERSE direction of (C) and
        D5's cost estimate touch HA-1.
      rigorous_support: >-
        Group theory and the cited structure theorems; no analytic input beyond
        h(O) = |D|^{1/2+o(1)}, which is unconditional up to the ineffective
        Siegel constant.
      validation_plan: >-
        The counting identity in STEP 3 IS the validation: it is exact and
        computable, so the algebra is checkable rather than sampled.
      tail_checks: >-
        Not applicable (no distribution). The analogue is the m = (1) null,
        which must exhibit the opposite behaviour.

  reachability_gate: >-
    T5 STATUS. The record does not need to reach a specified curve: its
    Direction-2' reduction queries the oracle on a pair whose CURVE is E itself,
    the instance's own curve, at zero walk cost. The converse direction does
    need a smooth ideal representative, which is HA-1 and is the easy side of
    T5 (random reachability), never the hard side (specified reachability). So
    T5 is not the binding constraint here either; the coordinate obstruction
    D3 binds strictly earlier and does not depend on any walk.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. The reduction in (C) is
      polynomial time relative to an oracle that contains the problem, so its
      exponent is not defined as an attack. The foreclosed prize in D5 -- had
      psi been partially computable -- would have been L_p(1/2), a
      subexponential move from the standing p^{1/2}, which is why the
      obstruction is worth naming precisely.
    memory_exponent: >-
      O(log p) per pair for the symbolic parts. The toy enumeration of a class
      costs O(h) = p^{1/2+o(1)} storage and that is the caller's choice, not
      the diagram's cost.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)
      time and memory (KN-TECH-031); automorphism-discounted rho at
      0.886*sqrt(N/|Aut|) (KN-TECH-018). None is changed by this record.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic algorithm is proposed.
      What DOES hide, and is disclosed: the phrase "polynomial-time computable
      from public data" in D3's arrow table presupposes the factorisation of
      t^2 - 4p, which is subexponential at crypto scale, and presupposes O
      maximal.
    tradeoff_note: >-
      Not applicable -- no algorithm is produced. For the record, the two
      halves of the exact sequence have very different costs if realised:
      the quotient half (curve vectorization) sits at about h^{1/2} = p^{1/4}
      with p^{1/4} memory, BELOW rho, which is exactly the elimination-cost
      observation developed in IDEA-20260811-40c0b5; the kernel half is the
      ECDLP at p^{1/2}. The asymmetry of the two halves is the quantitative
      content of the split.

  sota_delta: >-
    Zero. 0.886*sqrt(N) before, 0.886*sqrt(N) after. The delta is structural:
    it supplies the lane's missing object, converts the folk obstruction
    "curves and points are different objects" into a named and false
    categorical claim plus a true and precise computational one (the coordinate
    obstruction), exhibits the exact sequence that makes Cl(O)-vectorization
    provably the k-free half, and retro-derives three previously recorded
    obstructions as shadows of one.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier this campaign recognises: parallel rho with
    distinguished points (0.886*sqrt(N), O(1) memory, KN-TECH-001/006);
    automorphism-discounted rho (KN-TECH-018); BSGS (sqrt(N) time and memory,
    KN-TECH-031); kangaroo on an interval of width W (about 2*sqrt(W)); van
    Oorschot-Wiener at sqrt(N^3/w) with memory w. This record mounts no attack
    and is dominated by every one of them on time; it consumes no data or
    queries beyond the granted oracle. dominated_by is NOT null.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.90 that the counting identity verifies exactly for O maximal with
    O-cyclic point group -- it is a short derivation from standard theorems and
    the test is a direct check. 0.85 that the Direction-2' reduction verifies
    end to end. 0.80 that the cofactor ladder reproduces log2(c) exactly. 0.55
    that the non-maximal-order extension goes through without a new hypothesis.
    Below 0.02 that any partial computation of psi beyond Pohlig-Hellman turns
    up -- and that branch is the only one that would move an exponent, which is
    why STAGE 0 states it as an explicit invitation to a reviewer.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base appears; H-STR-002 and DEFER-BATCH009-001
    are untouched in both directions.
    P3: FLAGGED AS ADJACENT, NOT TRIGGERING. Prediction 3 contains a branch
    ("more than log2(c) bits at c = 1") whose realisation WOULD exceed the
    baseline. Per the standing constraint the record states the branch as a
    stopping condition and an escalation trigger, states no excess, and
    contains no candidate that exceeds the automorphism-discounted rho
    baseline. If that branch ever fires in an experiment, the executing session
    must stop and hand it to the Coordinator rather than record a number.

