    DEC-20260810-2c7e3c which cites 5158fa); "vectorization" (43 files);
    "question_id: RQ-CLGP-b99df5" (11 records, all headers read);
    "gcd(N, h)|N divides h"; "cocycle|coboundary". FULL READS:
    IDEA-20260808-5158fa (complete -- the closest prior art, discriminated
    below), IDEA-20260807-5d7606 (complete), IDEA-20260807-1b7241 (model),
    IDEA-20260807-413fcc (oracle class), IDEA-20260808-4d77a6 (format and the
    Lenstra identity it derives), KN-FIND-b7e091, DECOMPOSITION.md.
    RESULT: the ray class FIELD of conductor n = (N, pi - 1) is present in the
    corpus (5158fa); the ray class GROUP of modulus m = (pi - 1) acting on
    curves-with-level-structure in characteristic p is NOT, and neither is the
    exact sequence used as a reduction diagram, nor the coordinate obstruction
    as a named unifying obstruction.
    EXTERNAL NOVELTY IS NOT ESTABLISHED: WEB SEARCH WAS UNAVAILABLE THIS
    SESSION (backend model error on every attempt). All the mathematics used is
    classical and is very likely folklore in the CM literature; the record
    claims novelty only against THIS corpus and only for the use, not the
    ingredients. novelty_status is `unverified`.
  discriminated_from: >-
    IDEA-20260808-5158fa is the nearest record and shares the modulus family.
    Differences, each load-bearing: (i) modulus -- 5158fa uses n = (N, pi - 1)
    of norm N, this record uses m = (pi - 1) of norm #E(F_p), and the exact
    sequence needs the larger one; (ii) characteristic -- 5158fa lifts to a CM
    curve over the ring class field and studies Gal(K_n/H_O), this record stays
    over F_p and studies a torsor of pairs; (iii) statement type -- 5158fa is a
    CLOSURE (p splits completely, so the Artin symbol is trivial), this record
    is a REDUCTION plus a named obstruction of which 5158fa closes one branch;
    (iv) consequence -- 5158fa kills the small-l character ladder in
    characteristic zero, this record predicts the SAME ladder is exactly
    Pohlig-Hellman in characteristic p, which is a different derivation of a
    consistent conclusion and is a cross-check on both.
    IDEA-20260807-5d7606: its bridge beta is the composite that FORGETS the
    level structure, so its constancy result is the fibre of this record's
    projection. Not a duplicate; a corollary.
    IDEA-20260807-0fafe8 and IDEA-20260807-bbdcf3: both prove k cannot live in
    Cl(O). This record agrees and localises k in the KERNEL of the extension,
    where their size and Hom arguments do not apply.
    IDEA-20260807-02b7b2: proves n = (N, pi - 1) is constant across the crater.
    True and used here -- it is precisely why the QUOTIENT carries nothing.
    IDEA-20260807-e9d57c: its composite-order bridge leaking v_ell(k) is
    predicted by D4 from the diagram rather than observed; the two records must
    agree numerically and disagreement falsifies one of them.
    IDEA-20260806-0c9de1 (X_1(N) diamond torsor): a different torsor (modular
    curve level structure at N, in characteristic p), and its structure group is
    (Z/N)^*/{+-1} rather than Cl_m(O). The relation is that 0c9de1's torsor is
    the image of this record's kernel; the curve direction is absent there.
