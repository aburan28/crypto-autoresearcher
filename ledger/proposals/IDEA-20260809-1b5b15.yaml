  controls:
    execution_order:
      - CTRL-BASELINE-AND-SEED
      - CTRL-MATCHED-MEAN-CLUSTERING
      - CTRL-REPEATED-COVERAGE
      - CTRL-BALANCED-ANTISYMMETRIC
      - CTRL-EXACT-QUOTIENT
      - CTRL-PLANTED-GAMMA-1-6
      - CTRL-PLANTED-GAMMA-5-18
      - CTRL-PLANTED-GAMMA-3-10
      - CTRL-ISOMORPHISM-APPARATUS
      - signed_y_treatment
    treatment_admission_rule: >-
      Every preceding control, exact compiler equality, throughput gate, and
      resource reserve must pass. A missing, capped, nonconverged, or failed
      control prohibits treatment and is not ECDLP evidence.
    balanced_antisymmetric: >-
      On odd prime Z/NZ, H=(N-1)/2. Derive a unit a and c mod H, put
      pi(t)=a*t+c mod H, and for nonzero r use r=epsilon*u with
      u=min(r,N-r), h_null(r)=epsilon*(pi(u-1) mod M) mod M; h_null(0)=0.
      This is exactly antisymmetric and balanced within one count.
    exact_quotient:
      definition: >-
        For b in {18,21,24,27,30}, U=2^(b/3), M=U-1, L=M, K=M^3,
        G=Z/KZ, and h_q(x)=x mod M. Allocate U bucket slots only so one bucket
        slot is zero-padded; there is no padded list element, map evaluation,
        selected pair, join, metric event, operation, traffic event, or hash input.
      size_rows:
        - {bits: 18, U: 64, M: 63, L: 63, K: 250047}
        - {bits: 21, U: 128, M: 127, L: 127, K: 2048383}
        - {bits: 24, U: 256, M: 255, L: 255, K: 16581375}
        - {bits: 27, U: 512, M: 511, L: 511, K: 133432831}
        - {bits: 30, U: 1024, M: 1023, L: 1023, K: 1070599167}
      totals:
        sum_U: 1984
        sum_M: 1979
        sum_L: 1979
        root_rows: 40960
        list_records_and_labels: 64847872
        bucket_values: 64847872
        selected_pair_writes_and_hash_inputs: 129695744
        join_lookups: 64847872
        group_additions: 129736704
        candidate_slots_equalities_and_witness_queries: 1310720
        root_metric_records: 40960
      formulas:
