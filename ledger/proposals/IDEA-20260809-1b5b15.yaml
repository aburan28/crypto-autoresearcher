        - '8*32*256*1979=129695744 selected-pair writes and ordered hash inputs.'
        - '129695744+32*256*5=129736704 synthetic group additions.'
        - '32 candidate slots*40960 roots=1310720 candidate, equality, and witness slots.'
      metric_and_hash_rule: >-
        Each root metric binds U,M,L,K and the size-row identifier. I_L and I_R
        caps are 4L, their combined selected-pair cap is 8L, the join cap is 4L,
        and the ordered pair-stream hash absorbs exactly the actual L-derived
        events. The retained five 64-byte parameter records bind every value.
    planted_gamma: >-
      Three independent arms use gamma_star in {1/6,5/18,3/10}. Their synthetic
      schedule uses U=L and K=U^3=2^b in both mode branches; this K is distinct
      from the pure CTRL-EXACT-QUOTIENT K=(U-1)^3 above. Select quotient mode
      with exact probability K^(-1/3+gamma_star) and balanced mode otherwise,
      before any map call. Evaluate one selected map; no labels, lists, buckets,
      pairs, roots, modes, or outputs are reused.
    matched_mean_clustering:
      sizes: [262144, 2097152, 16777216, 134217728, 1073741824]
      clusters_per_size: 32
      roots_per_cluster: 8192
      roots_per_size: 262144
      construction: >-
        The matched-mean cluster-rank domain assigns 16 clusters A_c=1024 and
        16 clusters A_c=3072 at every size, common to both arms. The arm-specific
        root-rank domain orders 8192 roots per cluster. Diffuse: first A_c roots
        have (D,Y,X,V,S)=(1048576,1,1,1,1). Concentrated: with
        kappa=2^(b/3), first A_c/kappa roots have
