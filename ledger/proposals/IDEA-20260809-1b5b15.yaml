  planted_probability_sampler:
    status: prospective_exact_finite_fail_closed
    parameterization:
      base_group_order: 'K_b=U_b^3=2^b for b in {18,21,24,27,30}.'
      rows:
        - {arm: CTRL-PLANTED-GAMMA-1-6, gamma_star: '1/6', probability: 'K^(-1/6)', d: 6}
        - {arm: CTRL-PLANTED-GAMMA-5-18, gamma_star: '5/18', probability: 'K^(-1/18)', d: 18}
        - {arm: CTRL-PLANTED-GAMMA-3-10, gamma_star: '3/10', probability: 'K^(-1/30)', d: 30}
    complete_key_domain: deterministic_generators.domains.planted_mode
    events: 122880
    event_formula: '3 arms*5 sizes*32 clusters*256 roots=122880.'
    xof_rule: >-
      From each fresh complete key squeeze exactly 32 bytes once, close the
      state, and interpret the 256 bits most-significant-bit first. Bytes after
      the first decision remain consumed and charged but do not change it.
    exact_comparison: >-
      After t bits, 1<=t<=256, let A_t be the unsigned t-bit prefix and let
      q=K^(-1/d). Return quotient-mode bit 1 if
      K*(A_t+1)^d <= 2^(t*d). Return balanced-mode bit 0 if
      K*A_t^d >= 2^(t*d). Otherwise advance to t+1. These integer inequalities
      are exactly the statements that the half-open dyadic cell lies wholly
      below q or wholly at or above q, respectively; no floating point,
      rounded threshold, or rational replacement is used.
    hard_cap_bits_per_event: 256
    fixed_xof_bytes_per_event: 32
    total_bits_available: 31457280
    total_xof_bytes: 3932160
    boundary_tests_per_bit_cap: 2
    integer_boundary_test_slots: 62914560
    boundary_test_formula: '122880*256*2=62914560 exact integer boundary-test slots.'
    finite_error_semantics: >-
      On every admitted event the sampling error is exactly zero. If neither
      inequality separates by t=256, no mode bit is emitted, no alternate bit
      is substituted, the complete prospective run package is invalid, and no
      control or treatment inference is permitted. Under an ideal uniform bit
      stream, each event has cap-hit probability at most 2^-256 and the union
      bound over 122880 events is at most 122880*2^-256; this is an invalidation
      probability, not an approximation error or evidence claim.
    retained_audit_record:
      count: 122880
      width_bytes: 48
      bytes: 5898240
      layout: >-
        Eight identifier/status bytes; u16 first-decision index; u16 consumed
        bit count fixed to 256; 32-byte SHA-256 of the exact XOF bytes; u16
        parameter-row identifier; u16 reserved zero. A status other than exact
        decision at t<=256 invalidates the package.
    retained_parameter_records: {count: 15, width_bytes: 64, bytes: 960}
    resource_charge:
      logical_local_traffic_bytes: 15728640
      traffic_formula: '122880*32 XOF bytes + 2*122880*48 audit-record bytes=15728640.'
      archive_bytes: 5899200
      archive_formula: '122880*48+15*64=5899200.'
      live_memory_bytes: 65536
      planned_cpu_nanoseconds: 57600000000000
      hard_cpu_nanoseconds: 72000000000000
      planned_wall_nanoseconds: 7200000000000
      hard_wall_nanoseconds: 9000000000000
      charge_scope: >-
        The fixed XOF bytes, all 62914560 possible boundary-test slots, audit
        records, exact-integer workspace, hashes, and invalidation path are
        inside these prospective S1 budgets. No early decision refunds a byte
        or budget slot.
    falsification_conditions:
      - Any mismatch with exhaustive small-K dyadic and algebraic boundary fixtures.
      - Any event with more or fewer than 32 squeezed bytes.
      - Any admitted cap-hit, approximate comparison, regenerated stream, or imputed mode.
      - Any audit hash, first-decision index, parameter row, or seed-regeneration mismatch.

  unequal_isomorphism_fixture:
    id: CTRL-ISOMORPHISM-APPARATUS
    timing: hard_pre_treatment_gate
    admitted_curves: 160
    noncanonical_models_per_curve: 3
    equal_fixtures_per_curve: 8
    unequal_fixtures_per_curve: 8
    equal_fixture_count: 1280
    unequal_fixture_count: 1280
    model_generator: >-
      Rejection-sample nonzero u. Require (u^4,u^6) pairwise distinct and
      different from (1,1), with accepted curves having nondegenerate A and B.
      Define E_u:y^2=x^3+(A*u^4)x+B*u^6 and
      phi_u(x,y)=(u^2*x,u^3*y), phi_u(O)=O.
    equal_generator: >-
      Rejection-sample distinct nonzero r1..r4 and nonzero a, derive known k,
      and set b_eq=r1+r2+r3+r4-a*k mod N. Compute R_j=[r_j]P,
      A0=R1+R2, B0=R3+R4, T0=A0+B0, and Q_eq=[a]Q+[b_eq]P.
      Q_eq and T0 are the same unique point and are encoded once.
    unequal_generator: >-
      From the disjoint unequal key rejection-sample delta uniformly from
      {1,...,N-1}. Set D_delta=[delta]P, b_neq=b_eq+delta mod N,
      Q_neq=Q_eq+D_delta, k_hat_neq=a^(-1)*(sum_j r_j-b_neq) mod N,
      and W_neq=[k_hat_neq]P.
    noncollision_proof: >-
      T0=[sum r_j]P and Q_neq=[sum r_j+delta]P. Equality would imply
      [delta]P=O, hence delta=0 mod N because P has prime order N, contradicting
      delta in {1,...,N-1}. Each phi_u is bijective, so equality after
      transformation is equivalent to equality before it. Thus all accepted
      unequal fixtures are noncolliding without probabilistic appeal.
    mandatory_checks:
      - Every explicitly enumerated canonical and transformed point is on its declared curve.
      - Every forward point round-trips to identical canonical bytes.
      - The three positive homomorphism sums and final equality hold.
      - 'T0!=Q_neq and phi_u(T0)!=phi_u(Q_neq) for all models.'
      - 'phi_u(Q_eq)+phi_u(D_delta)=phi_u(Q_neq).'
      - 'k_hat_eq=k and [k_hat_eq]P=Q in all four models.'
      - 'k_hat_neq!=k and W_neq!=Q in all four models.'
    fixture_record_schema: >-
      One fixed 160-byte little-endian record per curve/fixture pair: 16-byte
      identifiers; ten u32 scalars r1..r4,a,b_eq,delta,b_neq,k_hat_eq,
      k_hat_neq; 32-byte equal canonical transcript SHA-256; 32-byte unequal
      canonical transcript SHA-256; 32-byte aggregate transformed transcript
      SHA-256; u32 non-on-curve check mask; u32 model mask. The separate ordered
      on-curve bitset and per-curve hash bind every point check.
    archive_records: 1280
    archive_record_width_bytes: 160
    archive_bytes: 204800
    pass_rule: >-
      Every one of the 1280 equal and 1280 unequal fixtures passes on the
      canonical model and all three noncanonical models before treatment.

