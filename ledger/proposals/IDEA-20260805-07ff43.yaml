idea:
  id: IDEA-20260805-07ff43
  question_id: RQ-WESO-8aff57
  added: '2026-08-05'
  title: >-
    The conjugate-degree density law rho_p(Y) ~ Y^{3/2} p^{-1/2}: a one-parameter
    family that contains BOTH Delfs-Galbraith and Wesolowski as endpoints,
    reproduces the van Oorschot-Wiener interpolation line without using van
    Oorschot-Wiener, and pins the memory corner at 1/3 by a class-number argument
  class: mechanism

  claim: >-
    Wesolowski's Algorithm 3 and the Delfs-Galbraith algorithm are the two
    endpoints of ONE algorithm parameterised by a target degree bound Y on the
    conjugate isogeny E' -> E'^{(p)}, and the entire time-memory curve between
    them is forced by a single density function
      rho_p(Y) := #{E supersingular /F_{p^2} : delta(E) <= Y} / #{E},
      delta(E) := min{deg phi : 0 != phi in Hom(E, E^{(p)})}.
    DERIVED, NOT INTERPOLATED: counting the pairs (E, theta) with theta in
    End(E), theta^2 = -pd, d <= Y via the Deuring/Eichler correspondence gives
    rho_p(Y) = Theta(Y^{3/2} p^{-1/2 + o(1)}), because the number of optimal
    embeddings of the order Z[sqrt(-pd)] into the maximal orders of B_{p,infty}
    is h(-4pd) = (pd)^{1/2 + o(1)} (Siegel), and sum_{d <= Y} sqrt(pd) =
    (2/3) sqrt(p) Y^{3/2}. The exponent 3/2 is then INDEPENDENTLY FORCED by two
    anchors that were never put on the same page: rho_p(1) = p^{-1/2 + o(1)}
    (delta(E) = 1 iff j(E) in F_p, and the count of those is the class number
    that Delfs-Galbraith runs on), and rho_p((p/2)^{1/3}) = 1 exactly (Theorem
    1.5 of the frozen paper, i.e. arXiv:2607.14624). Any pure power law through
    those two points has exponent (1/2)/(1/3) = 3/2.
    CONSEQUENCE, exponent-level: running the paper's own Algorithm 2 with
    (p/2)^{1/3} replaced by a free parameter Y gives table size and memory
    M_Y = Y^{1 + o(1)}, success probability per attempt rho_p(Y) * P0(Y, B),
    and therefore
      TIME = p^{1/2 + o(1)} / Y^{1/2},   MEMORY = Y^{1 + o(1)},
      hence  TIME * MEMORY^{1/2} = p^{1/2 + o(1)}  for EVERY Y in [1, (p/2)^{1/3}].
    That is bit-for-bit the exponent content of the interpolation the paper
    attributes to van Oorschot-Wiener ("time essentially sqrt(N^3/w) =
    p^{1/2+o(1)}/w^{1/2} with memory w"), obtained by a mechanism with no
    collision search, no distinguished points and no golden-collision penalty in
    it. Two independent derivations landing on the same curve is an observation
    collision in the sense of inventor-protocol section 8 audit 2, and it cuts
    both ways: it corroborates the paper's frontier AND it says the frontier is
    a property of the CLAW STRUCTURE rather than of the search technique, so no
    improvement to the search technique can move it.
    WHAT IS ACTUALLY CLAIMED HERE IS A DENSITY LAW AND A REDUCTION, NOT AN
    ATTACK. No exponent is moved by this proposal. The exponent-moving question
    it makes precise, and which nobody in this corpus has asked, is: is there a
    curve family, or a re-randomisation reaching one, on which rho_p(Y) has
    exponent STRICTLY GREATER than 3/2? If rho_p reaches 1 at some
    Y0 = p^{1/3 - eps} on a reachable family, the algorithm's time AND memory
    both drop to p^{1/3 - eps + o(1)}, and 1/3 was never the right corner.

  object_first_candidate:
    tracked_object: >-
      delta(E), the minimal degree of a nonzero isogeny E -> E^{(p)}, followed as
      a single integer-valued function on the supersingular j-set S_p of size
      p/12 + O(1), together with the involution sigma: j -> j^p that S_p carries.
      Everything else in the paper -- the smooth list L(E, X, B), the modular
      polynomials, the meet-in-the-middle table, the walk -- is machinery for
      DETECTING delta(E') <= Y at a given Y. The tracked object is the level set
      structure of delta, not the isogenies themselves.
    established_families_off_limits: >-
      Declared off-limits as the PRIMARY lens for this proposal, so that
      candidates cannot regress into them in new notation:
      (a) meet-in-the-middle / claw finding and every memory variant of it,
      including van Oorschot-Wiener parallel collision search, distinguished
      points, and Jaques-Schanck quantum RAM accounting -- this proposal is
      required to reach its curve WITHOUT any of them, and the fact that it does
      is the result;
      (b) Delfs-Galbraith subfield search and its accelerations (fast subfield
      root detection, oriented-curve path finding) taken as an algorithm rather
      than as the Y = 1 level set;
      (c) Kohel-style endomorphism-ring computation and KLPT/quaternion
      arithmetic;
      (d) the per-entry cost calibration lane that consumed BATCH-002 and
      BATCH-003 of this goal (EXP-PEC-6be870, EXP-PEC-49c773). That lane
      measures the CONSTANT multiplying the table cost. This proposal is about
      the EXPONENT of the table size against the exponent of the retry count and
      does not touch, restate, reuse or depend on any c value; the two are
      deliberately disjoint.
    newness_score: >-
      The individual ingredients are old and this record says so: the
      theta^2 = -pd correspondence is Deuring; h(-4D) = D^{1/2 + o(1)} is Siegel;
      Delfs-Galbraith is 2016; Theorem 1.5 is the 2026 arXiv:2607.14624 input the
      paper cites. What is not in this corpus, and what the frozen paper does not
      do, is (i) treating (p/2)^{1/3} as a FREE PARAMETER of the algorithm rather
      than as a constant supplied by Theorem 1.5, (ii) writing rho_p(Y) down at
      all, and (iii) observing that the resulting curve coincides with the VW
      line. The corpus check is recorded under dominated_by.
    testability_score: >-
      High and cheap at the low end. rho_p(Y) is directly enumerable at toy p by
      building S_p and testing membership of j^p in the degree-<= Y ball of j;
      at p ~ 10^4 that is minutes of pure Python, and the two anchors are exact
      integer identities that either hold or do not. The asymptotic exponent
      cannot be certified at toy p and this record does not pretend otherwise --
      the toy ladder can only refute a gross departure and measure a trend.
    survival_score: >-
      The object survives all the way to the cost model, which is the point: it
      converts an algorithm-design question into a lattice-minimum distribution
      question, and lattice-minimum distributions are governed by class numbers,
      which are pinned to p^{1/2 + o(1)} by Siegel. That pinning is what makes
      the honest prior of an exponent improvement low, and it is also the exact
      place a counterexample would have to live.

  mechanism: >-
    All logarithms natural unless written log2. Write S_p for the set of
    supersingular j-invariants over F_{p^2}, #S_p = p/12 + O(1), and
    sigma: S_p -> S_p, sigma(j) = j^p, an involution whose fixed locus is
    S_p ∩ F_p.

    STEP 1 - THE OBJECT. For a supersingular E/F_{p^2}, Hom(E, E^{(p)}) is a
    rank-4 Z-lattice and deg is a positive definite quaternary quadratic form on
    it. Put delta(E) = min{deg(phi) : 0 != phi}. Two exact facts anchor delta:
      (A1) delta(E) = 1  <=>  E ≅ E^{(p)}  <=>  j(E) in F_p.
      (A2) delta(E) <= (p/2)^{1/3} for EVERY supersingular E (Theorem 1.5 of the
           frozen paper, attributed there to arXiv:2607.14624; READ in the frozen
           full text, the arXiv paper itself NOT READ).

    STEP 2 - WHY THE GENERIC LATTICE HEURISTIC IS WRONG HERE, AND WHY THAT
    MATTERS. Section 4.2 of the frozen paper states that Hom(E, E^{(p)}) with the
    form deg is isometric to the two-sided ideal P of reduced norm p in the
    corresponding maximal order O, with the form Nrd/p. Reduced norm on a maximal
    order of B_{p,infty} has Gram determinant p^2/16 (RECALLED, UNVERIFIED --
    a checkable step, see heuristic_assumptions HA-3); [O : P] = Nrd(P)^2 = p^2,
    so det(Nrd on P) = p^4 * p^2/16, and dividing the form by p divides the
    rank-4 determinant by p^4, leaving det(deg on Hom(E,E^{(p)})) ~ p^2/16.
    The Gaussian heuristic for a rank-4 form of determinant D predicts
    #{x : q(x) <= Y} ~ (pi^2/2) Y^2 / sqrt(D), so the generic minimum would sit
    at Y ~ p^{1/2}. THEOREM 1.5 SAYS THE MINIMUM IS ALWAYS AT MOST p^{1/3}.
    So this lattice family is NEVER generic: it always carries a vector shorter
    by a factor p^{1/6} than a random rank-4 lattice of the same determinant
    would have. That structural excess is the entire reason the paper's algorithm
    exists, and it is the reason rho_p cannot be computed from the Gaussian
    heuristic. It must be computed from the arithmetic.

    STEP 3 - THE ARITHMETIC COUNT (the derivation). Let phi : E -> E^{(p)} have
    degree d and let iota : E^{(p)} -> E be the p-power Frobenius. Then
    theta = iota o phi lies in End(E), has inseparable degree p, and deg(theta)
    = pd. Choosing phi in its Z-coset so that theta has trace 0 gives
    theta^2 = -pd, i.e. an embedding Z[sqrt(-pd)] -> End(E). Conversely an
    embedding of an order containing sqrt(-pd) produces a degree-d isogeny to the
    conjugate. So, at the level of counting,
      #{(E, phi) : deg(phi) = d}  ~  #{optimal embeddings of Z[sqrt(-pd)] into
                                       maximal orders of B_{p,infty}}
                                  ~  h(-4pd)   (Deuring / Eichler; HA-2)
                                  =  (pd)^{1/2 + o(1)}   (Siegel; HA-1).
    Summing over d <= Y and dividing by #S_p = p/12 + O(1):
      SUM_{d <= Y} h(-4pd) ~ sqrt(p) * SUM_{d<=Y} sqrt(d) ~ (2/3) sqrt(p) Y^{3/2},
      rho_p(Y)  <=  12 * (2/3) * Y^{3/2} * p^{1/2} / p  =  8 Y^{3/2} p^{-1/2+o(1)}.
    The inequality is an UPPER bound on the count of distinct curves because a
    curve with several admissible d is counted several times; the multiplicity is
    exactly the quantity Remark 1 of the frozen paper calls "multiple small
    isogenies E -> E^{(p)}" and it is the subject of the companion proposal
    IDEA-20260805-b4bc59. Stating the bound as an inequality rather than an
    equality is deliberate: the lower bound needs a second-moment or
    inclusion-exclusion argument and is DECLARED NOT DERIVED here.

    STEP 4 - THE TWO ANCHORS AGREE WITH THE DERIVATION, WHICH IS THE FIRST
    NON-TRIVIAL CHECK AND IT COSTS NOTHING.
      At Y = 1: 8 p^{-1/2 + o(1)} * (p/12) = (2/3) p^{1/2 + o(1)} curves with
      j in F_p. The true count is the class number h(-p) or 2h(-p) depending on
      p mod 4, which is p^{1/2 + o(1)} by Siegel. AGREES.
      At Y = (p/2)^{1/3}: 8 * (p/2)^{1/2} * p^{-1/2} = 8/2^{1/2} = 5.66..., i.e.
      rho saturates at 1 within a constant of the point where Theorem 1.5 says it
      must be exactly 1. AGREES, and it says Theorem 1.5 is EXPONENT-TIGHT for
      the typical curve, not merely a worst-case bound.
    A power law forced through the two anchors alone, with no arithmetic, gives
    exponent (1/2)/(1/3) = 3/2. The arithmetic derivation gives 3/2. The generic
    rank-4 lattice heuristic gives 2 and is refuted by the anchors (it would
    predict p^{1/3} curves with j in F_p against a true count of p^{1/2}).
    THREE ROUTES, TWO AGREE, ONE IS RULED OUT BY AN EXACT COUNT. That is the
    strongest pre-compute position available here.

    STEP 5 - THE ALGORITHM FAMILY. Take the frozen paper's Algorithm 2 verbatim
    and replace the constant (p/2)^{1/3} by a free parameter Y in
    [1, (p/2)^{1/3}]:
      X_Y = B^{1/2} Y^{1/2}                        (Algorithm 2 line 1, with
                                                    (p/2)^{1/3} -> Y)
      L_Y = L(E', X_Y, B),  M_Y = Psi(X_Y, B) X_Y  (Lemma 3.2 / Section 4.1)
      per-attempt success = rho_p(Y) * P0(Y, B),
        P0(Y,B) = u_Y^{-u_Y(1+o(1))},  u_Y = log Y / log B.
    Lemma 3.4's proof goes through unchanged with (p/2)^{1/3} replaced by Y,
    because the only place it uses the bound is deg(phi) <= (p/2)^{1/3} in the
    display deg(eta) <= l_{k+1} (p/2)^{1/3} / X. CHECK THIS LINE FIRST: it is the
    single point where the generalisation could fail, and it is one line.
    Note u_Y at Y = (p/2)^{1/3} is log((p/2)^{1/3})/log B = log(p/2)/(3 log B),
    which is the paper's own u. The generalisation is consistent at the endpoint
    by construction.
    With B = p^{o(1)}: Psi(X_Y,B) = X_Y^{1+o(1)}, so M_Y = Y^{1+o(1)}; and
      TIME(Y) = M_Y / (rho_p(Y) P0) = Y^{1+o(1)} * p^{1/2} Y^{-3/2} * p^{o(1)}
              = p^{1/2 + o(1)} Y^{-1/2},
      MEMORY(Y) = Y^{1 + o(1)}.
    Endpoints: Y = 1 gives time p^{1/2+o(1)}, memory p^{o(1)} -- Delfs-Galbraith.
    Y = (p/2)^{1/3} gives time and memory p^{1/3+o(1)} -- Theorem 1.1. The
    product identity TIME * MEMORY^{1/2} = p^{1/2+o(1)} holds identically along
    the family and is exactly the paper's stated VW line.

    STEP 6 - WHAT THIS BUYS AND WHAT IT DOES NOT. It does NOT move an exponent.
    It (i) supplies an independent derivation of a curve the paper states without
    optimisation and explicitly flags as unclear ("It is currently unclear how to
    reduce the memory cost without increasing the time"); (ii) replaces a
    collision-search-based middle-memory algorithm by a retry-based one whose
    hidden constants are plausibly much smaller -- no distinguished points, no
    golden-collision factor, each attempt independent and perfectly parallel, and
    a SMALLER smoothness parameter u_Y = u * (log Y / log((p/2)^{1/3})) which
    RAISES P0 monotonically as Y falls; (iii) identifies precisely which quantity
    would have to misbehave for the corner to move, namely the exponent of
    rho_p, hence the exponent of h(-4pd), which Siegel pins at 1/2 + o(1).
    THE HONEST OBSTRUCTION, stated at the inventor-protocol section 4 standard:
    the memory corner 1/3 is the solution of "table size Y equals retry count
    p^{1/2} Y^{-3/2}", and the 3/2 in the retry exponent is the 1/2 of Siegel's
    class-number law composed with the 3/2 from summing sqrt(d) over d <= Y. To
    move the corner one must break one of those, and both are theorems.
    FORWARD GUIDANCE, naming what remains open rather than declaring the lane
    dead: (a) the o(1) in Siegel is ineffective and the class number fluctuates
    by p^{o(1)} either way -- that fluctuation cannot move an exponent but it can
    move a NIST-level bit count, and it is measurable; (b) the count in STEP 3 is
    an upper bound and the multiplicity correction is unmeasured; (c) the whole
    derivation is about the MINIMAL isogeny, whereas the algorithm succeeds on
    any SMOOTH one, so the joint distribution of (delta(E), smoothness) is the
    real object and its correlation has never been measured; (d) restricted
    curve families with anomalous rho -- in particular j = 0 and other small-CM
    curves -- are a nearby-object control this corpus has repeatedly named
    (angle #22 of the session angle brief) and never run.

  novelty_status: unverified

  literature_context:
    - >-
      Benjamin Wesolowski, "The supersingular isogeny problem in time and memory
      p^{1/3+o(1)}". READ IN FULL, verbatim frozen at
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, and every quotation in this
      record is from that file. Load-bearing quotations: Section 1.1, "the
      algorithm essentially resolves a claw-finding problem for two sets of size
      N = p^{1/3+o(1)}. The time-memory tradeoff of van Oorschot-Wiener [43]
      solves a claw-finding problem of this size in time essentially
      sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} with memory w"; and "It is currently
      unclear how to reduce the memory cost without increasing the time".
      Theorem 1.5 and Section 4.1's five-row cost table are used verbatim.
      Externally corroborated provenance (relayed from the session angle brief,
      NOT independently re-fetched here): the input is ePrint 2026/1486.
    - >-
      Y. Aubry, R. Oyono, C. Vincent, "Minimal degree of an isogeny between a
      supersingular elliptic curve and its conjugate", arXiv:2607.14624, cited as
      [4] by the frozen paper. NOT READ -- relayed claim. All this record uses is
      the STATEMENT as quoted in the frozen paper's Theorem 1.5. Whether the
      bound is (p/2)^{1/3} for all p or carries conditions is a checkable step,
      and it is stage S0 of the paired experiment. If the bound has hypotheses
      the paper omitted, anchor (A2) weakens and the forced exponent changes.
    - >-
      C. Delfs and S. D. Galbraith, "Computing isogenies between supersingular
      elliptic curves over F_p", Designs Codes Cryptogr. 78(2), 2016, cited as
      [21]. NOT READ -- relayed claim. Used only for the structural statement
      that the algorithm searches for F_p-rational j-invariants and that their
      number is p^{1/2 + o(1)}. That number is independently checkable by direct
      enumeration at toy p and is a stage of the experiment, not an authority.
    - >-
      Deuring correspondence and Eichler's optimal-embedding count; Siegel's
      theorem h(D) = D^{1/2+o(1)}. RECALLED, UNVERIFIED. These are standard and
      the record asserts no theorem number, no page and no venue for either.
      Both are load-bearing (HA-1, HA-2) and both are validated numerically at
      toy p by direct counting inside the paired experiment, which is the only
      status they are given here.
    - >-
      P. C. van Oorschot and M. J. Wiener, "Parallel collision search with
      cryptanalytic applications", J. Cryptology 12(1), 1999, cited as [43] by
      the frozen paper. NOT READ. The formula sqrt(N^3/w) is used ONLY as quoted
      from the frozen paper, and this proposal deliberately does not rely on it:
      the whole point is that the same curve is reached without it.
    - >-
      Internal: EV-PEC-2e67ff and EV-PEC-857664 (this goal, BATCH-002 and
      BATCH-003) established that Section 4.1's one-F_{p^2}-operation-per-entry
      convention is refuted in the attack's disfavour, and bracketed the
      correction. THIS PROPOSAL IS ORTHOGONAL TO THAT LANE AND DOES NOT USE, CITE
      AS SUPPORT, OR CONTRADICT ANY c VALUE. A per-entry constant multiplies
      M_Y identically at every Y and therefore shifts the whole frontier
      vertically without changing its shape or the location of its corner. Saying
      so is itself a small, free result of the parameterisation.

  lossy_projection_identifiability_audit:
    projection: >-
      A supersingular curve E/F_{p^2}, with its full endomorphism ring and its
      whole isogeny neighbourhood, is projected to the single integer
      delta(E) = min{deg phi : phi in Hom(E, E^{(p)})}, and then to the single
      bit [delta(E) <= Y].
    what_is_discarded: >-
      Everything except one integer: the isomorphism class, End(E), the
      j-invariant, the identity of the minimising isogeny, all non-minimal
      isogenies to the conjugate, and the smoothness of any of their degrees.
      The fibre of delta over a typical value has size p^{1 - o(1)} / (typical
      value), which is enormous.
    why_genuinely_lossy: >-
      The map E -> delta(E) is many-to-one with fibres of size p^{1-o(1)} at
      typical Y, and delta does NOT determine E: two curves with the same delta
      are in general not isogenous by any small isogeny. So this is not a change
      of coordinates. Contrast with the canonical failure named in the inventor
      protocol, (Delta, Pi) = (x+y, xy) in characteristic 2, where the unordered
      pair is recoverable as the roots of t^2 + Delta t + Pi: THERE the fibre is
      a single point and nothing was discarded. Here the fibre is exponentially
      large, and the retained integer still propagates deterministically under
      the operation the algorithm actually performs -- extending the smooth ball
      by one prime step can only decrease the detected degree, so the retained
      part is monotone under the algorithm's only move.
    why_compatible_with_the_operations: >-
      The algorithm's operations are (i) a random walk E -> E', which re-samples
      delta from its population distribution -- this is exactly why rho_p, a
      population quantity, is the right object -- and (ii) growing the smooth
      isogeny ball, under which the predicate [delta <= Y] is monotone in Y.
      Both operations act on delta alone, without needing anything that was
      discarded. That is precisely the compatibility condition the lossy
      projection test demands.
    is_it_only_a_change_of_coordinates: >-
      NO, checked in both directions and both failure modes named.
      FAILURE MODE 1 (nothing discarded, a change of coordinates): excluded --
      delta has exponentially large fibres, see above.
      FAILURE MODE 2 (so lossy it is constant across instances, zero comparator
      spread -- the mirror failure): THIS IS THE ONE THAT HAD TO BE CHECKED, and
      it does NOT occur, but only because of an exact fact. delta is bounded
      above by (p/2)^{1/3} for every curve (Theorem 1.5), so it could in
      principle have been essentially constant near that bound, in which case
      rho_p would be a step function, the whole family would collapse to its
      right endpoint, and the proposal would be empty. It is not constant:
      anchor (A1) exhibits p^{1/2 + o(1)} curves with delta = 1, i.e. the
      comparator spread is at least the full range [1, (p/2)^{1/3}] and the
      lower end is populated to a measurable density. THE CHECK RETURNED
      NON-CONSTANT, WITH AN EXACT WITNESS. This is the audit that decides whether
      the proposal has content, and it is why anchor (A1) is load-bearing rather
      than decorative.

  assumptions:
    - >-
      That Lemma 3.4's proof in the frozen paper survives replacing (p/2)^{1/3}
      by Y. Verified by inspection here on the single display it appears in, and
      re-checked as stage S1 of the experiment. If it does not survive, the
      family is not well defined and the proposal fails at zero compute.
    - >-
      That "memory" means the table L_Y, as the frozen paper's Section 4.1 states
      ("the memory cost of the algorithm is ~ M"). Any additional memory in the
      walk, in root-finding, or in the modular polynomial evaluation is p^{o(1)}
      and is NOT charged here. Declared, not hidden.
    - >-
      That the re-randomising walk in Algorithm 3 mixes to uniform, so that
      rho_p as a POPULATION density is the correct per-attempt success
      probability. This is the paper's own assumption (Algorithm 3 step 3, with
      n = O(log p) from [37]/[6, Lemma 14]) and is inherited unchanged.

  proof_search_map_note: >-
    The full four-audit proof_search_map is carried on the paired hypothesis
    H-WESO-9dc201, per templates/research-records.md, and is not duplicated here.

  predictions:
    - metric: >-
        a_hat: the least-squares exponent of rho_p(Y) in log Y, fitted over
        Y in the declared grid at each toy prime p, with rho_p measured by
        exhaustive enumeration of S_p
      direction: different
      minimum_effect: >-
        FORCED VALUE 3/2, DERIVED BEFORE ANY RUN. Pre-registered admissible band
        a_hat in [1.35, 1.65] at the largest toy prime reached, and the trend of
        a_hat across the prime ladder must be non-divergent. a_hat consistent
        with 2.0 and inconsistent with 1.5 REFUTES the class-number derivation
        and supports the generic rank-4 lattice heuristic instead, which would in
        turn contradict anchor (A1) -- so that outcome is a genuine contradiction
        requiring a correction record rather than a tuning.
    - metric: >-
        n_fp: the exact number of supersingular j-invariants lying in F_p, by
        direct enumeration, compared with the class number h(-p) or 2h(-p)
        computed independently by counting reduced binary quadratic forms
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT, integer for integer, at every toy prime. This is a
        POSITIVE CONTROL on the enumeration instrument and not a research
        measurement: the two counts are computed by disjoint code paths (curve
        enumeration versus form reduction) and must agree exactly. Any
        disagreement means the enumeration is wrong and NO negative result about
        rho_p may be reported from that run.
    - metric: >-
        max_delta: the maximum over all E in S_p of delta(E), compared with the
        bound (p/2)^{1/3} asserted by Theorem 1.5
      direction: lower
      minimum_effect: >-
        max_delta <= (p/2)^{1/3} at EVERY toy prime, with no exception. A single
        counterexample would refute an external 2026 theorem this program has
        only ever seen relayed, and is the single highest-value outcome
        available in this experiment. It is also the most likely place for an
        instrument bug to show, so a counterexample is treated first as a bug
        report and only second as mathematics, and the disambiguation rule is
        frozen in the contract.
    - metric: >-
        ratio_at_corner: measured rho_p(Y) at Y = floor((p/2)^{1/3})
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0 at every toy prime, by Theorem 1.5 and by definition. Same
        status as n_fp -- an instrument check with a forced value, not a finding.
    - metric: >-
        decoy_rate: the number of accidental sigma-collisions in a MATCHED RANDOM
        subset of S_p of the same cardinality as the measured degree-<= Y ball,
        divided by the number of structural collisions
      direction: lower
      minimum_effect: >-
        Forced expected value 12 * |ball|^2 / p, which at the operating point
        |ball| ~ p^{1/3} is 12 p^{-1/3} -- i.e. it must DECAY with p at exponent
        -1/3. A decoy rate that does NOT decay as p grows is the canonical
        artifact tell named in inventor-protocol section 3 and would mean the
        measured collisions are not the structural ones.

  minimal_test:
    design: >-
      Five stages, ordered cheapest-first, each able to terminate the line.
      S0 (reading, hours, zero compute): confirm Theorem 1.5's statement and its
      hypotheses against arXiv:2607.14624 itself rather than against the frozen
      paper's paraphrase. If the bound carries conditions, anchor (A2) changes
      and everything downstream is re-derived before any compute.
      S1 (algebra, one page, zero compute): check the single display in Lemma
      3.4's proof under (p/2)^{1/3} -> Y; check the u_Y endpoint identity; write
      out the STEP 3 count with the local factors that HA-2 elides. A failure
      here ends the line for the cost of an afternoon.
      S2 (arithmetic, seconds): compute h(-4pd) for d <= Y at three toy primes by
      counting reduced forms, and confirm sum_{d<=Y} h(-4pd) ~ (2/3) sqrt(p)
      Y^{3/2} to the declared tolerance. This tests HA-1 and HA-2 jointly without
      touching a single elliptic curve.
      S3 (enumeration, minutes to an hour): build S_p at a ladder of toy primes,
      measure delta on every curve, fit a_hat, and run the controls.
      S4 (interpretation, zero compute): report the frontier TIME * MEMORY^{1/2}
      at each measured a_hat, and state explicitly the gap between a toy fit and
      an asymptotic exponent.
    controls:
      - >-
        NULL OBJECT (matched, forced value derived pre-run, CAN FAIL). Replace
        the degree-<= Y ball of j by a UNIFORMLY RANDOM subset of S_p of the
        IDENTICAL cardinality, and count sigma-collisions. Forced value:
        E[#collisions] = |ball|^2 * 12/p exactly, by linearity over ordered pairs
        with collision probability 12/p. At the operating point this is
        12 p^{-1/3} << 1, so the prediction is "essentially zero, and decaying in
        p at exponent -1/3". This CAN fail: if the random control returns
        collisions at the structural rate, the enumeration is finding collisions
        by construction and the measurement is void.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. The
        Y = 1 level set: the effect (a sigma-collision) MUST be found for every
        one of the p^{1/2+o(1)} curves with j in F_p, because sigma fixes them.
        The instrument must return delta = 1 on exactly that set and on no other
        curve. If it misses any F_p-rational curve, or reports delta = 1 off
        F_p, the instrument is broken and NO negative result about rho_p may be
        reported from that run. This control is exact, free, and cannot be passed
        by accident.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. Measure
        rho_p(Y) at Y in {1, 2, 3, 5, 8, 13, ..., floor((p/2)^{1/3})} -- at least
        five interior points strictly between the two anchors. rho_p must be
        non-decreasing in Y by definition (a monotonicity violation is an
        instrument bug, reported as such), and the local slope
        d log rho / d log Y must be reported at every interior point rather than
        only as a global fit. A global fit of 3/2 assembled from wildly
        non-constant local slopes is a coincidence, not a law, and this control
        is what distinguishes the two.
      - >-
        SECOND NULL: the generic rank-4 lattice prediction a = 2, computed on the
        same grid from the same code. It is a REAL alternative hypothesis with a
        different forced value, it is already known to fail anchor (A1) by a
        factor p^{1/6}, and reporting both fits side by side prevents the
        confirmation-by-single-model failure.
      - >-
        ARCHIVE CHECK (zero compute). Search the corpus for any prior measurement
        of delta, of rho_p, or of the F_p-rational supersingular count. NOT
        AVAILABLE as far as this session could determine, and that unavailability
        is recorded as an absence rather than claimed as a passed check.
    required_metrics:
      - exact #S_p, exact n_fp, exact max_delta, per toy prime, with the enumeration method named
      - rho_p(Y) as an exact rational (count/total) at every grid Y, not a float
      - local slopes d log rho / d log Y at every interior grid point
      - a_hat with its fit residuals, and the competing a = 2 fit on the same data
      - matched-null collision counts against their forced expectations
      - the h(-4pd) table from S2 with the form-counting method named

  falsification_conditions:
    - >-
      a_hat is inconsistent with 3/2 and consistent with 2 at the largest toy
      prime reached, AND the n_fp positive control passed. The class-number
      derivation is then wrong, the two anchors do not lie on one power law, and
      the family is not the VW line. This is the primary falsifier.
    - >-
      Lemma 3.4's proof does not survive (p/2)^{1/3} -> Y at stage S1. The
      algorithm family does not exist as described and the proposal is withdrawn
      at zero compute.
    - >-
      Theorem 1.5, checked against its own source at S0, carries hypotheses that
      exclude the generic supersingular curve. Anchor (A2) fails and the forced
      exponent is not forced.
    - >-
      The matched null returns collisions at the structural rate. The measurement
      is an artifact and nothing may be concluded from it.
    - >-
      The n_fp positive control fails. Nothing at all may be reported.

  confounders:
    - >-
      TOY SCALE IS THE DOMINANT CONFOUNDER AND IT IS NOT REMOVABLE. At p ~ 10^4,
      (p/2)^{1/3} ~ 17, so the fitting range spans barely one decade in Y and the
      p^{o(1)} factors in Siegel and in Psi are of the same order as the effect.
      A toy fit of 1.5 does not certify an asymptotic 3/2 and this record does not
      claim it does; what the toy ladder can do is refute a gross departure
      (an exponent near 2) and report a trend.
    - >-
      MINIMAL VERSUS SMOOTH. delta is the minimum over ALL isogenies; the
      algorithm needs a SMOOTH one. At toy p every degree in range is smooth over
      the primes used, so the toy measurement cannot see the smoothness
      restriction at all. This is a known, stated, one-directional bias:
      rho_p as measured is an upper bound on the algorithmically usable density.
    - >-
      MULTIPLICITY. STEP 3's sum overcounts curves with several admissible d, so
      the derived law is an upper bound on the CDF. The size of the overcount is
      unmeasured and is the subject of IDEA-20260805-b4bc59; until it is
      measured, the derivation supports the exponent from above only.
    - >-
      INSTRUMENT DEGREE CEILING. Enumerating delta by walking l-isogeny graphs
      requires modular polynomials for every prime l up to the degree ceiling. At
      the toy primes proposed, all degrees in range are 13-smooth, so the ceiling
      is not binding -- but that must be CHECKED per prime and recorded, not
      assumed, and if it binds the measured delta is an upper bound on the true
      delta and every downstream statement inherits that direction.

  interpretation_limits:
    - >-
      NO EXPONENT IS MOVED BY THIS PROPOSAL AND NO ATTACK IS CLAIMED. The
      deliverable is a density law, a reduction of the paper's own tradeoff to
      it, and a named obstruction to improving the corner. A validated a = 3/2
      makes the p^{1/3} corner STRUCTURAL rather than incidental, which is
      information that constrains future work in this goal; it does not weaken
      any scheme and does not strengthen any either.
    - >-
      CLAIM TIER toy for anything measured, derivation tier for the algebra. A
      toy-scale fit may never be cited as a crypto-scale validation of the law
      (AGENTS.md rule 7), and the algebra is a derivation whose two load-bearing
      inputs are RECALLED and validated only numerically at toy p.
    - >-
      This proposal does not license the sentence "the memory corner cannot be
      improved". The obstruction is named and argued, in the sense of
      inventor-protocol section 4, but it is an obstruction to improving rho_p's
      EXPONENT on the FULL supersingular population by the counting route
      analysed. Restricted families, non-minimal isogenies, and higher-
      dimensional generalisations are outside it and are named as open in the
      mechanism's forward guidance.
    - >-
      NO STATUS CHANGE to H-WESO-001 or to GOAL-P13-001 is proposed or implied,
      and this record asserts nothing about completion criterion 1.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        (Siegel) For a fundamental discriminant -D < 0, h(-D) = D^{1/2 + o(1)}
        as D -> infinity. Used in the form h(-4pd) = (pd)^{1/2 + o(1)}.
      rigorous_support: >-
        Siegel's theorem is a genuine theorem with an INEFFECTIVE constant, which
        is why it is recorded here as load-bearing rather than as background: it
        supports an exponent and nothing finer, and the o(1) it hides cannot be
        made explicit. RECALLED, UNVERIFIED -- no theorem number, page or venue
        is asserted. Non-fundamental discriminants -4pd carry a conductor factor
        h(-4pd) = h(-4pd_0) * f * prod(1 - (chi(l))/l) which is between
        f/log log f and f; that factor is p^{o(1)} for d <= p^{1/3} and is
        DECLARED as absorbed rather than silently dropped.
      validation_plan: >-
        Direct computation at toy p: count reduced binary quadratic forms of
        discriminant -4pd for every d <= Y and every toy prime in the ladder, and
        check sum_{d<=Y} h(-4pd) against (2/3) sqrt(p) Y^{3/2} to a declared
        tolerance. Pure Python, seconds, no dependency.
    - id: HA-2
      statement: >-
        (Deuring/Eichler) The number of supersingular curves E/F_{p^2} carrying
        an isogeny of degree exactly d to E^{(p)}, counted with the natural
        weights, is h(-4pd) up to a factor that is p^{o(1)} and independent of d
        in the range d <= p^{1/3}.
      rigorous_support: >-
        RECALLED, UNVERIFIED, AND THE WEAKEST LINK IN THE DERIVATION. The
        statement I can support is the correspondence theta^2 = -pd <-> a
        degree-d isogeny to the conjugate, which is elementary and is written out
        in STEP 3. The counting statement needs Eichler's optimal-embedding
        theorem with its local factors at p and at the primes dividing d, and
        those local factors are exactly what "up to p^{o(1)}" is hiding. If a
        local factor is d-DEPENDENT with a power of d in it, the exponent 3/2
        changes and the whole proposal changes with it. This is stated as a
        hazard, not as a caveat.
      validation_plan: >-
        The same toy enumeration that measures rho_p measures this directly: for
        each d <= Y count the curves with an isogeny of degree exactly d to the
        conjugate, and compare against h(-4pd) computed independently by form
        counting. A systematic d-dependent ratio is the failure signature and is
        pre-registered as such.
    - id: HA-3
      statement: >-
        det(deg) on Hom(E, E^{(p)}) is p^2/16 up to bounded factors, so a generic
        rank-4 lattice of that determinant would have minimum ~ p^{1/2}.
      rigorous_support: >-
        RECALLED, UNVERIFIED. Used ONLY to make the negative point that the
        family is non-generic, and that point is independently established by the
        anchors alone (a generic law would predict p^{1/3} curves with j in F_p
        against a true p^{1/2}). So HA-3 is decorative, not load-bearing, and is
        recorded so that a reviewer can strike it without touching the argument.
      validation_plan: >-
        Compute the Gram matrix of deg on Hom(E, E^{(p)}) at toy p for a handful
        of curves and read its determinant. Optional; the argument does not
        depend on it.
    - id: HA-4
      statement: >-
        rho_p(Y) obeys a single power law over the whole range 1 <= Y <=
        (p/2)^{1/3}, rather than two regimes with a crossover.
      rigorous_support: >-
        NOT SUPPORTED, and this is the assumption the graded control exists to
        break. The anchors constrain only the endpoints; the arithmetic
        derivation predicts a single law, but a crossover would satisfy both
        anchors while making the middle of the frontier wrong. The local-slope
        readout, not the global fit, is what tests this.
      validation_plan: >-
        Report d log rho / d log Y at >= 5 interior grid points per prime and
        require the spread of local slopes to be smaller than the gap between the
        two competing global exponents, 1.5 and 2.0. If it is not, the honest
        report is "no single power law over this range", which is itself a
        result and is pre-registered as an admissible outcome.

  target_complexity:
    time_exponent: >-
      No exponent is moved. The family reproduces the paper's own pair of
      exponents at its two endpoints (1/2 at memory p^{o(1)}, 1/3 at memory
      p^{1/3}) and derives the connecting curve TIME = p^{1/2+o(1)} MEMORY^{-1/2}
      that the paper states without deriving. The exponent-moving question the
      proposal defines, and does not answer, is whether any reachable family has
      rho exponent > 3/2; a family reaching rho = 1 at Y = p^{1/3-eps} would move
      BOTH exponents to 1/3 - eps.
    memory_exponent: >-
      MEMORY = Y^{1+o(1)}, freely selectable in [p^{o(1)}, p^{1/3+o(1)}]. The
      memory exponent is the family's parameter, which is the whole point: the
      paper presents one point of this curve as its theorem and one sentence
      about the rest.
    best_known: >-
      As stated by the frozen paper: p^{1/3+o(1)} time and memory (Theorem 1.1,
      conditional on Heuristic 1); p^{1/2} (log p)^{O(1)} time with negligible
      memory (Delfs-Galbraith [21]); and the interpolation p^{1/2+o(1)}/w^{1/2}
      at memory w, stated without optimisation.
    hidden_overhead: >-
      Fully inherited and NOT improved at the exponent level: the superpolynomial
      p^{o(1)} of Psi and of P0, the (B + log p)^{O(1)} per-step modular
      polynomial cost whose true size is the subject of this goal's own
      EV-PEC-857664 bracket, and the ineffective o(1) of Siegel. The one honest
      directional statement available is that u_Y = u * log Y / log((p/2)^{1/3})
      DECREASES as Y decreases, so P0 IMPROVES monotonically along the family
      towards the low-memory end -- an o(1)-level effect that could matter at
      NIST parameters and is measurable in the companion contract.
    tradeoff_note: >-
      TIME * MEMORY^{1/2} = p^{1/2+o(1)} identically along the family. Charged
      axes: time and memory. Data/queries: none -- this is a static computation
      with no oracle and no data complexity, so that Pareto axis is empty by
      construction and is recorded as empty rather than omitted. Communication in
      the parallel setting is NOT charged here and the paper does not charge it
      either; the family plausibly wins there, since its attempts are wholly
      independent while VW's distinguished-point machinery requires a shared
      table. That is an unclaimed advantage, named and left unmeasured.

  dominated_by: >-
    n/a for the density law (it is a measurement, not an algorithm). For the
    ALGORITHM FAMILY the answer is that it is Pareto-EQUAL, not dominated and not
    dominating, against the frozen paper's own stated interpolation, at every
    memory budget and at the exponent level -- which is the finding. Rows checked
    across time, memory, and data/queries before writing this field:
    (i) Delfs-Galbraith, p^{1/2}(log p)^{O(1)} time / p^{o(1)} memory / no data
    -- reproduced exactly at Y = 1, so not dominated;
    (ii) the frozen paper's Theorem 1.1, p^{1/3+o(1)} time / p^{1/3+o(1)} memory
    / no data -- reproduced exactly at Y = (p/2)^{1/3};
    (iii) the frozen paper's VW interpolation p^{1/2+o(1)}/w^{1/2} at memory w --
    coincident at every w;
    (iv) the parallel VW variant p^{1/2+o(1)}/(w^{1/2} n) with n processors --
    the family parallelises identically (independent attempts), so equal;
    (v) Kohel p (log p)^{O(1)} -- strictly dominated by both endpoints;
    (vi) [15, 24, 26, 40] as described by the frozen paper, logarithmic-cofactor
    improvements on p^{1/2} -- dominated at the exponent level by the Y-endpoint;
    (vii) the quantum setting as reported by the frozen paper via [29], where
    quantum computation is said to help only with memory at the same time
    complexity -- NOT READ, relayed, and NOT compared, because a quantum cost
    model is not established in this corpus and asserting a comparison would be
    fabrication;
    (viii) this corpus: the P13 lane (EV-PEC-2e67ff, EV-PEC-857664,
    EV-WESO-001, EV-WESO-b6ceff), IDEA-20260801-006, H-WESO-001, H-P13-001, and
    the 46 EV-SSI-* records -- no record measures delta, rho_p, or a
    Y-parameterised family, and 38 of 46 EV-SSI records do not mention memory at
    all. Absence of a search result is not evidence of absence (AGENTS.md
    retrieval policy).
  sota_delta: >-
    Quantitatively zero on every attack axis: the family's (time, memory)
    exponent pairs are IDENTICAL to the frozen paper's stated interpolation at
    every memory budget, so sota_delta = 0 in both exponents, at every point.
    What is non-zero is (a) the derivation status of that curve, which moves from
    "stated by analogy with a generic claw problem" to "derived from a
    class-number count with two independent anchors", and (b) two directional
    o(1)-level effects that are candidates for a concrete-bit delta and are NOT
    quantified here because no run has happened: P0 improves monotonically toward
    the low-memory end, and the family avoids the van Oorschot-Wiener
    golden-collision overhead entirely. Refusing to attach a bit count to (b)
    before measuring it is deliberate.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.55 that the measured a_hat is consistent with 3/2 rather than with 2 at the
    largest toy prime reached. It is not higher because HA-2's local factors are
    genuinely unverified and a d-dependent local factor would change the exponent
    outright; because the toy range spans about one decade in Y, over which a
    1.5-versus-2.0 discrimination is not comfortable; and because HA-4 (a single
    power law with no crossover) has no support at all beyond the arithmetic. It
    is not lower because the two anchors are exact and independent of the
    derivation, and they alone force 3/2 for any pure power law while ruling out
    2 by a factor p^{1/6} -- so the derivation would have to be wrong in a way
    that ALSO breaks the anchors, which is a much narrower target. Separately,
    0.90 that the experiment reaches a decisive reading at all, since stages S1
    and S2 are pen-and-paper and pure integer arithmetic and the positive control
    at Y = 1 is exact.
