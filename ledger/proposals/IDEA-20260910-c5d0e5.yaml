idea:
  id: IDEA-20260910-c5d0e5
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-09-10'
  proposed_by: idea-generator
  status: proposed
  class: algorithm

  title: >-
    Larger exchanged-boomerang trail clusters with joint inactive-diagonal
    predicates and honest Poisson success-probability accounting — a
    program-adjudicable ACC/FPR record beyond Shin's four-trail POINTER

  claim: >-
    TRACKED CLAIM (REF-A / REF-B / REF-C only). There exists a secret-key
    distinguisher for AES-128 at r=5 whose ACCEPT predicate is the UNION of
    k>=5 exchanged-boomerang trails (or a joint inactive-diagonal predicate
    across m>4 inverse-diagonal exchanges) such that: (i) measured AES
    acceptance probability and measured 10-round control acceptance
    probability yield a likelihood ratio with measured FPR at a frozen query
    budget; (ii) success probability is accounted by an honest Poisson /
    rare-event model whose parameters are FITTED OR VALIDATED on control arms
    before AES arms are read; (iii) the measured CM-3 cost of one decision is
    a new program-adjudicable baseline for THIS clustered object. Shin's
    recalled four-trail cluster (probabilities 2^-28 + 2^-27.4 + 2^-28 +
    2^-30 = 2^-26.1 vs random 2^-30; ACC ~2^27.1 @79.6%) is STAGE 0 scaffolding
    and a POINTER (KN-LIT-1424), never a published-SOTA margin (R3). The claim
    aims at a NEW measured record for a LARGER cluster / joint predicate, not
    at reproducing Shin's headline ACC.

  object_first_candidate:
    tracked_object: >-
      THE CLUSTER ACCEPT EVENT C_k: the event that at least one trail in a
      declared set T_1..T_k of exchanged-boomerang patterns fires, OR that a
      joint predicate J_m on m inverse-diagonal inactivity/activity patterns
      holds. Readout is binary ACCEPT under a fixed adaptive query schedule.
      Lossy: discards which trail fired and the witness texts.
    established_families_off_limits: >-
      Primary lens is NOT classical single-trail boomerang, not yoyo alone,
      not integral, not linear. Cluster union / joint inactive-diagonal
      predicate is the tracked object; individual trails are ingredients.
      Off-limits as sole primary lens: differential, linear, integral,
      impossible differential, MiTM, biclique, algebraic, plain yoyo,
      subspace trail.
    newness_score: >-
      Shin POINTER already clusters four trails. This proposal's distinct
      object is (a) k>4 or m>4 joint predicates and (b) program-local Poisson
      accounting with control-first fitting — the adjudicable deliverable is
      the measured FPR+cost record, not the paper's claimed ACC.
    testability_score: >-
      High on small-AES (w=4) for probability-model validation; medium on
      AES-128 once Stage 0 four-trail smoke is instrumented.
    survival_score: >-
      Adjudicated at r=5. Larger clusters that only recover Shin's POINTER
      figures without improving THIS PROGRAM's measured likelihood ratio vs
      a self-built four-trail REF-B are ranked low regardless of published
      recollection.

  mechanism: >-
    Shin (KN-LIT-1424; figures RECALLED from user-provided text this session)
    clusters four exchanged-boomerang trails with Din = one active diagonal
    and D'in = one inactive diagonal, summing trail probabilities under an
    approximate independence model. Random-side pattern probability is further
    suppressed by friend pairs + four inverse-diagonal exchanges.
    THIS MECHANISM: (1) implement a PROGRAM-LOCAL exchanged-boomerang oracle
    with friend-pair option; (2) STAGE 0 — measure a four-trail cluster as
    REF-B self-baseline (not as Shin reproduction claim); (3) enumerate
    additional trails / joint inactive-diagonal predicates over more exchange
    axes; (4) price the union by Poissonisation: if each trail i has measured
    control rate λ_i and AES rate μ_i per attempt, union rates under
    independence are 1−∏(1−λ_i) and 1−∏(1−μ_i); dependence is measured by
    comparing union rate to this prediction on BOTH AES and control; (5)
    ACCEPT uses the joint predicate that maximises measured LR subject to
    control FPR ≤ pre-registered ε. COST = (per-attempt CM-3 cost) /
    measured AES success probability. DISCRIMINATION: larger clusters help
    iff they raise AES union mass faster than control union mass after
    honest dependence correction; if dependence makes the union behave like
    the best single trail, clustering is a bookkeeping illusion.

  novelty_status: unverified

  literature_context:
    - ref: KN-LIT-1424
      provenance: kb
      claim: >-
        Four-trail multiple exchanged boomerang; friend-pair random
        suppression; recalled ACC ~2^27.1 @79.6% — POINTER only.
      verified_by: null
    - ref: KN-LIT-1848
      provenance: kb
      claim: Related-differential line (Yan 2026/1039) — POINTER for alternate
        trail ingredients, not required for Stage 0.
      verified_by: null
    - ref: KN-LIT-6976
      provenance: kb
      claim: Exchange attack / exchange-invariant sets — POINTER.
      verified_by: null
    - ref: KN-LIT-699
      provenance: kb
      claim: Practical reduced-round AES distinguishers — POINTER.
      verified_by: null
    - ref: "eprint.iacr.org/2026/1286 (multiple-of / related-differential; small-AES w=4 validation)"
      provenance: recalled
      claim: >-
        Small-AES (w=4) used to validate probability models before AES-128
        spend — methodological POINTER for Stage 0.5 of this IDEA.
      verified_by: null

  lossy_projection_identifiability_audit:
    projection: >-
      Adaptive exchanged-boomerang transcript → per-trail fire bits →
      cluster union / joint J_m bit.
    what_is_discarded: Trail identity, friend witnesses, unused exchanges.
    why_genuinely_lossy: Many transcripts map to the same ACCEPT bit.
    why_compatible_with_the_operations: >-
      Trails are defined under the exchange operation set and boomerang
      adaptive queries; the union bit is a monotone function of trail bits
      and inherits compatibility. Joint inactive-diagonal predicates are
      predicates on the same exchange orbits (POINTER KN-LIT-6976).
    is_it_only_a_change_of_coordinates: >-
      No — union erases which trail fired; not invertible.

  predictions:
    - metric: >-
        Measured dependence gap |rate(union) − (1−∏(1−rate_i))| on 10-round
        control at Stage 0 four-trail and Stage 1 k>4 clusters
      direction: lower
      minimum_effect: >-
        Gap within pre-registered tolerance (e.g. relative 20%) OR an explicit
        fitted copula / empirical joint replaces independence in pricing.
        A gap left unmodelled falsifies honest Poisson accounting.
    - metric: >-
        Measured LR = rate_AES(ACCEPT)/rate_control(ACCEPT) for best Stage-1
        cluster vs Stage-0 four-trail REF-B, matched budget
      direction: higher
      minimum_effect: >-
        Primary decision: Stage-1 LR exceeds Stage-0 LR with pre-registered
        significance, with control FPR and resolution in bits stated beside
        both. If Stage-1 LR ≤ Stage-0 LR, larger clustering is dominated by
        the program's own four-trail baseline.
    - metric: Measured CM-3 cost per decision of the winning cluster
      direction: lower
      minimum_effect: >-
        Recorded vs REF-B (four-trail self-baseline) and REF-A only; never vs
        recalled published ACC.

  minimal_test:
    design: >-
      STAGE 0: instrument four-trail cluster + friend-pair option; measure
      per-trail and union rates on AES-r=5 and 10-round control; fit/validate
      Poisson union model on CONTROL FIRST.
      STAGE 0.5 (cheap, recommended): repeat probability-model checks on
      small-AES (w=4) if a miniature SPN harness is available — methodological
      pattern POINTER 2026/1286 — before AES-128 scale-up.
      STAGE 1: add trails / increase inverse-diagonal exchanges m>4; remeasure
      LR and dependence gap; freeze winning ACCEPT rule.
      STAGE 2: CM-3 cost of winning rule vs Stage-0 REF-B.
    controls:
      - 10-round AES matched control (FPR + union model).
      - Four-trail self-baseline as REF-B for this object family.
      - >-
        Independence-broken synthetic — force shared witnesses across trails;
        model must detect dependence gap.
      - >-
        Graded r in {4,5,6}: excess must decay with r.
    required_metrics:
      - per-trail rates AES and control
      - union rates and independence prediction residual
      - LR with CI; FPR with resolution in bits
      - CM-3 wall clock, RSS, queries
      - cluster definition digest (immutable ACCEPT rule)

  falsification_conditions:
    - >-
      Independence residual on control exceeds tolerance and no replacement
      joint model is fitted before AES reading — accounting invalid.
    - >-
      Best k>4 cluster fails to improve LR vs four-trail REF-B at matched
      FPR — larger clustering dominated; close this branch.
    - >-
      Friend-pair option required for any apparent excess but sibling
      misaligned exchanges reproduce the excess — geometry artifact.
    - Excess non-monotone in r — artifact tell.

  confounders:
    - >-
      Trail enumeration bias: searching many clusters without freezing the
      ACCEPT rule manufactures significance; freeze rule on control-held-out
      keys before AES test keys.
    - >-
      Overlapping witnesses induce positive dependence that inflates union
      rates on BOTH sides — the interesting quantity is the LR, not AES rate
      alone.
    - >-
      Shin figure recollection may mis-state trail probabilities; Stage 0
      never treats recalled 2^-26.1 as a fixture.

  interpretation_limits:
    - Toy / reduced-round only. No full-round claim.
    - R3: no "beats published" / "falls short of published" language.
    - Proposal only under standing authorisation; no experiment approval.
    - Cluster success is not key recovery.

  heuristic_assumptions:
    - id: HEUR-CL1
      statement: >-
        Conditional on the control, distinct exchanged-boomerang trails in a
        declared set behave as rare events whose union rate is within a
        stated relative tolerance of the independent Poisson union formula,
        OR a measured pairwise correlation matrix suffices to correct it.
      rigorous_support: >-
        Standard Poissonisation of rare Bernoulli trials; exchange-orbit
        random model (POINTER KN-LIT-6976) motivates near-independence when
        trails use disjoint witness sets.
      validation_plan: >-
        Stage 0 control arms: estimate λ_i, measure union, compute residual;
        optionally validate on small-AES (w=4) at higher event counts.
      falsification_condition: >-
        Residual > tolerance with no successful correction model — HEUR-CL1
        fails; union pricing may not be used for cost claims.
    - id: HEUR-CL2
      statement: >-
        Adding trails that are AES-structured but control-rare increases LR
        until witness overlap saturates the gain.
      rigorous_support: >-
        Monotone set-function intuition for LR under independent rare events;
        saturation under dependence is the classical inclusion limit.
      validation_plan: >-
        Stage 1 LR curve vs k; pre-register stopping when marginal LR gain
        < cost of one added trail's queries.
      falsification_condition: >-
        LR non-increasing in k for all enumerated additions — clustering
        path exhausted for this trail family.

  target_complexity:
    time_exponent: >-
      No asymptotic exponent. Target: measured CM-3 queries/time for the
      winning cluster distinguisher at r=5, vs REF-B four-trail self-baseline
      and REF-A. Recalled Shin ACC ~2^27.1 / massive ~2^31 are POINTERS only.
    memory_exponent: Measured peak RSS; friend-pair tables charged if used.
    best_known: >-
      Best known TO THIS PROGRAM for clustered exchanged-boomerang ACCEPT:
      none measured yet; Stage 0 four-trail becomes the internal best once
      run.
    hidden_overhead: >-
      Trail enumeration and multiple-testing correction are charged; freezing
      ACCEPT on held-out keys is mandatory overhead.
    tradeoff_note: >-
      Larger clusters raise data/query cost roughly linearly in k under
      sequential testing; only LR/FPR improvements justify the spend.

  dominated_by: >-
    After Stage 0, any Stage-1 cluster with LR ≤ four-trail REF-B at matched
    FPR is dominated_by that REF-B. Published Shin ACC rows are unresolvable
    under R3 and are not used as dominated_by targets. vs REF-A: any working
    distinguisher is expected to dominate exhaustive search on cost — not a
    meaningful ranking criterion alone.
  sota_delta: >-
    Quantitative delta claimed only after measurement: ΔLR and ΔCM-3 vs
    program four-trail REF-B. vs REF-C: r=5 adjudicable distinguisher where
    full-diagonal integral is dead. Published delta: UNADJUDICABLE.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium
  honest_prior_of_survival: >-
    ~0.45 that Stage 0 four-trail instrumentation yields a usable REF-B with
    measurable AES−control gap; ~0.20 that k>4 strictly improves LR after
    dependence correction. Clustering gains often saturate early; the honest
    value of this IDEA may be the Poisson accounting discipline itself.
