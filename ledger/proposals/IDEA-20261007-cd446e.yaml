idea:
  id: "IDEA-20261007-cd446e"
  question_id: RQ-SSI-1946c9
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: "Torsion-image redaction ladder for pure-EndRing versus torsion-aided dependency"
  class: control
  claim: "For any candidate PKE mechanism on this question that publishes torsion-point auxiliary data aux, replacing aux with independently random same-shape torsion tuples while holding pk and sk fixed either preserves toy decryption-agreement within tolerance (aux inessential, dependency stays pure-EndRing-shaped) or collapses agreement to chance (dependency is torsion-aided and stronger than EndRing and must be named separately); a mechanism with no aux takes the empty-aux rung only."
  mechanism: "Define a variant ladder over a fixed candidate and fixed keypair: V0 full published aux, V1 aux replaced by uniform random torsion tuples of identical shape and order, V2 aux omitted with decryptor resampling public torsion deterministically from pk, V3 aux replaced by an orientation descriptor only where the candidate claims one. Run the identical toy correctness harness per rung with fixed seeds and compare agreement rates. Post-SIDH rationale is that torsion images carried the catastrophic auxiliary structure, so a correctness that survives only on exact published images depends on torsion-aided path-finding, never on the pure EndRing distribution. This complements the finite-witness quotient audit (secret-operation answers Q_A) by targeting public auxiliary data, and complements the label-transport barrier (hidden labelings) by forcing aux into the open before varying it."
  novelty_status: unverified
  citations:
    - {ref: "KN-OPEN-013", provenance: "recalled", claim: "Auxiliary structure was catastrophic for SIDH; oriented curves weaker in some regimes", verified_by: null}
    - {ref: "IDEA-20261004-edbd24", provenance: "recalled", claim: "Finite-witness quotient audit over secret-operation answers; this ladder differs by varying public auxiliary torsion data", verified_by: null}
    - {ref: "IDEA-20261004-e4c461", provenance: "recalled", claim: "Label-transport barrier; this ladder differs by redacting stated aux rather than positing hidden labelings", verified_by: null}
    - {ref: "KN-LIT-074", provenance: "recalled", claim: "Pure EndRing to path equivalence shape that torsion-aided variants go beyond", verified_by: null}
    - {ref: "KN-LIT-827", provenance: "recalled", claim: "Prior supersingular pointer to position against, not checked", verified_by: null}
    - {ref: "KN-LIT-1260", provenance: "recalled", claim: "Prior supersingular pointer to position against, not checked", verified_by: null}
  assumptions:
    - "Candidate keypair, EndRing distribution, output equivalence, and auxiliary shape are declared before the ladder runs; the ladder never redefines them mid-run."
    - "Random-aux sampling is uniform over same-order torsion tuples with the candidate shape check applied; malformed replacements are discarded and counted, not silently repaired."
    - "Unconditional toy-correctness control: no heuristic assumptions are invoked, stated explicitly here rather than invented."
    - "Agreement persistence is compatibility with pure-EndRing shape, never proof of hardness or security."
