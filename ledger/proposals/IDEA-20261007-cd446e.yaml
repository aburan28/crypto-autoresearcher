  predictions:
    - {metric: "agreement drop from V0 to V1", direction: "different", minimum_effect: "torsion-essential verdict requires V0 agreement at least 0.85 while V1 agreement falls inside 0.50 plus-minus 0.08 over N at least 200 per rung; aux-inessential verdict requires V1 within 0.07 of V0"}
    - {metric: "malformed-replacement rate", direction: "lower", minimum_effect: "below 0.05 of V1 samples, else the shape sampler not the candidate explains the drop"}
  minimal_test:
    design: "Fix one candidate instance and keypair on a declared toy slice; run V0 through V3 with identical message and randomness schedules (N at least 200 per rung), same decoder, and fixed-seed random-aux stream."
    controls: ["shape-matched random aux with order check", "fixed-seed replay of the aux stream", "null-witness decoder that must sit at chance on every rung", "V0 rerun at the end to catch state drift"]
    required_metrics: ["per-rung agreement rate with Wilson interval", "V0-minus-V1 difference with interval", "malformed-replacement count", "failure taxonomy per rung"]
  falsification_conditions:
    - "V1 agreement within tolerance of V0 falsifies torsion-essentiality for that instance and returns aux-inessential with forward guidance to keep the pure-EndRing ledger entry."
    - "V0 itself at chance falsifies nothing about aux and returns broken-syntax obstruction with forward repair to the syntax before any dependency claim."
    - "High malformed-replacement rate falsifies the rung comparison and returns sampler obstruction with forward repair to the shape sampler."
  confounders:
    - "Random aux accidentally encoding a weak but valid auxiliary instance."
    - "Order or pairing checks rejecting random aux at different rates than published aux."
    - "Small-p torsion structure unrepresentative of larger parameters, disclosed without extrapolation."
    - "State reuse across rungs leaking V0 aux into V1 through caches."
  interpretation_limits:
    - "Distinguishes stated-aux dependence only; silent or hidden aux outside the declared list is out of scope and must be listed by the reduction ledger."
    - "Toy scope only; no hardness, security, or deployment inference."
    - "A collapse to chance names torsion-aided dependence, never a break of EndRing."
