idea:
  id: IDEA-20260813-710293
  question_id: RQ-QALG-74bf20
  goal_id: GOAL-QALG-001
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  title: >-
    k-ary Wagner-tree generalization of Kuperberg's pairwise collimation
    step: does a global multi-way join change the sieve's round-count
    exponent, and does a valid k-input coherent combine unitary even exist?
  class: algorithm

  claim: >-
    Kuperberg's sieve combines coherent coset-sample pairs (k=2) at each of
    Theta(sqrt(log N)) rounds, bucketing locally by matching leading bits.
    This proposal asks two ordered questions. Q1 (existence): does a
    well-defined k>2-ary unitary combine operation exist that generalizes
    Kuperberg's pairwise phase-combination rule while preserving the
    coherence later rounds require? Q2 (asymptotic form, contingent on Q1):
    if such a unitary exists, does replacing Kuperberg's LOCAL round-by-round
    greedy bucketing with a GLOBAL Wagner-style k-tree join across the full
    current-round list change the round-count/list-size optimum from
    Theta(sqrt(log N)) rounds to a smaller FUNCTIONAL FORM, or only retune
    the existing form's constant?

  mechanism: >-
    Kuperberg's sieve maintains a list of labeled qubit-pair states, each
    carrying an integer label c such that the state is, up to global phase,
    |0> + w^{cd}|1>. At each round it partitions the list by leading bits and
    combines states WITHIN a bucket pairwise, folding a few leading bits to
    zero, producing shorter-label states for the next round, repeating for
    Theta(sqrt(log N)) rounds. This proposal replaces the local bucket-pair
    step with two changes: (a) a proposed k-input unitary folding k labels'
    leading bits to zero simultaneously rather than one bit at a time via
    repeated pairwise folds, and (b) selecting which k-tuples to combine via a
    Wagner-style k-tree meet-in-the-middle search over the full current list
    rather than local bucket membership, aiming to find more k-tuples per
    round whose combined label has more leading zero bits than the pairwise
    bucket approach achieves for the same list-size budget.

  established_families_declared_off_limits: >-
    Per docs/inventor-protocol.md section 1: Kuperberg's original sieve and
    its own internal round/list-size parameter tradeoffs (KN-LIT-2c8264);
    the collimation c-sieve variant trading quantum memory for the same
    asymptotic time (Peikert's generalization and classical simulator,
    KN-LIT-127); Regev's oracle-based poly-time reduction (KN-LIT-21383c,
    conditional on an uninstantiable subset-sum oracle); Simon 2026's
    noise-tolerant Hadamard-erasure mechanism (KN-LIT-e204ab, addressed
    separately in IDEA-20260813-e6d55d). None of these is claimed as the
    source of this proposal's mechanism; the delta is the k-ary GLOBAL join
    replacing the LOCAL pairwise bucket rule, which -- to the extent this
    session's screening could determine -- is not addressed by any filed
    KN-* entry.

  novelty_status: unverified
  novelty_screen: >-
    crypto-kb MCP was unavailable and WebSearch failed on every attempt this
    session (see retrieval-screen.yaml). Corpus grep found no KN-* entry
    discussing a k-ary or Wagner-tree generalization of Kuperberg's
    combination step. It is explicitly plausible, and this session cannot
    rule out, that Kuperberg's own 2005 paper already analyzes a general
    k-ary tradeoff parameter internally, in which case this proposal reduces
    to Q1's existence question plus re-deriving an already-known result --
    exactly the "regression to a variant in new notation" that
    docs/inventor-protocol.md section 1 warns is invisible until checked.
    The baseline-reproduction audit below is designed to surface this before
    any compute is spent.

  assumptions:
    - >-
      Wagner's classical generalized-birthday k-tree technique's asymptotic
      form (query/time roughly 2^{n/(1+log2 k)} for k lists) is the correct
      analogy being tested for a quantum, phase-coherent combine step, not
      assumed to transfer directly.

  proof_search_map:
    bottleneck: >-
      Whether a k-input generalization of Kuperberg's 2-input combine step
      exists as a unitary operation on k coherent coset-sample registers
      that (i) folds more than one bit per application (else k-ary offers no
      round-count benefit over iterated pairwise folding) and (ii) leaves the
      resulting state in the same |0>+w^{c'd}|1> form the next round
      requires. If no such unitary exists, or the best k-input unitary only
      ever achieves what k-1 sequential pairwise folds already achieve, the
      round-count question (Q2) is moot and the proposal closes at Q1.
    baseline_embedding:
      parameter_slice: >-
        Kuperberg's own round-count-vs-list-size formula (2^{O(sqrt(log
        N))}, balancing R rounds each shrinking the list by a fixed ratio
        against O(1) bits folded per round) is the exact boundary; k=2 is
        the published operating point.
      reproduction_check: >-
        Not performed this session. Required before Coordinator approval:
        symbolically re-derive the round-count-vs-list-size balance equation
        from Kuperberg's own paper (not a secondary source) and confirm it
        as stated as a function of k, since if Kuperberg's own paper already
        parameterizes by k and shows the sqrt(log N) form is k-invariant,
        this closes Q2 as already established rather than open.
    observation_collision:
      observable: >-
        The number of leading zero bits achieved by a folded label after one
        round, as a function of the number of states consumed to produce it.
      distinct_preimage_search: >-
        Search for two distinct k-tuple selection strategies (local bucket
        versus global Wagner join) that, given the same input list, produce
        combined-label distributions with the same leading-zero-bit
        histogram -- if the histograms coincide, the global join provides no
        round-count advantage regardless of Q1, since the sieve's complexity
        is a direct function of that histogram (a direct falsifier reachable
        by a toy combinatorial computation, no quantum simulation needed).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          A k-input combine unitary preserving a stronger invariant than the
          pairwise case requires: coherent phase across all C(list,k)
          possible k-subsets simultaneously, analogous to how Wagner's
          classical k-tree exploits joint structure across k lists at once.
        predicted_gain: >-
          If achievable, and IF the round-count reduces from
          Theta(sqrt(log N)) to Theta(log N / log k) with k allowed to grow
          with n (mirroring Wagner's own k-tree exponent form), the optimal
          k(n) could change the overall exponent's functional form -- this
          is the exponent-moving best case and must be checked against the
          nearby-object control below before being taken seriously.
    quantifier_order: >-
      Kuperberg's claim: there exists an algorithm, for all N, taking
      2^{O(sqrt(log N))} time. This proposal's claim, if Q1 and Q2 both
      resolve favorably: there exists a k(n)-dependent algorithm, for all N,
      taking a different closed form. The critical quantifier check: does
      the proposed unitary's existence (Q1) depend on k being FIXED (not
      growing with n), in which case Wagner-style asymptotic gains (which
      require k to grow with instance size) are unreachable by construction,
      collapsing Q2 to a constant-factor question regardless of Q1's answer.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, a genuine round-count exponent change (Theta(sqrt(log N))
        to a smaller form), contingent on Q1's unitary existing for k
        growing with n. If Q1 fails for growing k (the most likely outcome
        per the quantifier check above), the strongest certifiable claim
        degrades to a constant-factor retuning of the existing sqrt(log N)
        exponent's leading coefficient, explicitly NOT exponent-moving per
        docs/target-result-profile.md A1 and to be reported at
        building-block-or-lower priority, not as a target-class result.
      nearby_object_control: >-
        Apply the identical k-ary construction attempt to the simplest
        possible dihedral instance where k-ary combination is classically
        decidable by exhaustive search: N=2^8, k in {2,3,4}. If exhaustive
        search shows k=3 or k=4 combination, chosen optimally (not
        restricted to local buckets), achieves strictly more
        leading-zero-bits-per-consumed-state than the best achievable k=2
        pairwise strategy at the same toy size, that is a genuine positive
        signal surviving the control; if the ratio is identical across k (a
        plausible outcome, since folding more bits per combination trivially
        costs proportionally more consumed states), the object dissolves at
        this toy scale and the proposal closes without needing Q1's quantum
        unitary question resolved at all.
    proof_obligations:
      - claim: A k>2-input unitary exists generalizing Kuperberg's combine step, for k fixed and small.
        responsibility: feasibility
      - claim: The same unitary's existence extends to k growing with n.
        responsibility: scope
      - claim: The leading-zero-bits-per-consumed-state ratio strictly improves with k at toy scale.
        responsibility: strictness
      - claim: Any observed toy-scale improvement extrapolates to the round-count formula's functional form, not merely its constant.
        responsibility: success_probability
    not_applicable_reason: null

  predictions:
    - metric: >-
        leading-zero-bits achieved per consumed input state, k=2 versus k=3
        versus k=4, exhaustively computed on toy dihedral group N=2^8
      direction: different
      minimum_effect: >-
        any statistically distinguishable difference in the ratio across k
        at toy scale, beyond what a random-relabeling null produces. The
        honest a-priori expectation, per Kuperberg's own round-count/list-
        size balance argument, is that the ratio is INVARIANT under k; this
        is a genuine two-sided prediction, not an assumed positive result.

  minimal_test:
    design: >-
      Purely classical, combinatorial, toy-scale (N=2^8..2^16) exhaustive or
      near-exhaustive search: for k in {2,3,4}, compute the best achievable
      leading-zero-bit yield per consumed state under (a) Kuperberg's own
      local bucket rule and (b) an unrestricted global k-tuple search over
      the full list, and compare against the round-count formula's implied
      requirement. No quantum simulation is required, since the question is
      a classical combinatorial optimization over the same label space
      Kuperberg's own analysis already treats classically for its list-size
      bookkeeping.
    controls:
      - k=2 local-bucket rule exactly as published, as the baseline reproduction.
      - >-
        k=2 GLOBAL search (not restricted to local buckets) as an
        intermediate control isolating whether any gain comes from k-arity
        or from the global-versus-local search change alone.
      - A random (non-adaptive) k-tuple selection null at each k, to confirm any measured gain is not a toy-instance artifact.
    required_metrics:
      - leading-zero-bits per consumed state, by k and by selection rule
      - >-
        implied round count R(k) to reduce an n-bit label to O(1) bits,
        extrapolated from the toy-scale ratio under the same functional
        assumption Kuperberg's own paper uses
      - Q1's unitary-existence answer, recorded as symbolic yes/no/undetermined with the specific obstruction if no

  falsification_conditions:
    - >-
      The leading-zero-bits-per-consumed-state ratio is statistically
      indistinguishable across k in {2,3,4} at toy scale (matches the
      random-null control) -- closes Q2 without needing Q1 resolved.
    - >-
      No k>2 unitary generalizing Kuperberg's combine step can be
      constructed even for fixed small k -- closes the proposal at the
      algebraic pre-compute stage, the cheapest possible falsifier.
    - >-
      The k-arity gain, if any, requires k growing with n, but the
      constructed unitary is shown to exist only for fixed k -- closes Q2's
      asymptotic form even if Q1 passes for fixed k.

  confounders:
    - >-
      Kuperberg's own paper may already treat k as a free parameter
      internally (the novelty risk flagged above); a positive toy-scale
      result must be checked against a symbolic re-derivation of the
      original paper's round-count formula as a function of k before being
      reported as new.
    - >-
      Global search over k-tuples is itself combinatorially expensive
      classically at the toy scale used for bookkeeping; the toy-scale test
      measures an idealized "if we could search all k-tuples" ratio, which
      does not by itself establish that a quantum Wagner-style search
      achieves this ratio at the SAME cost as Kuperberg's own local search --
      a genuine crossover claim requires costing the search step itself.

  interpretation_limits:
    - A toy-scale (N <= 2^16) combinatorial finding is hypothesis-generating only, never a statement about CSIDH-standardized class-group orders.
    - Resolving Q2 favorably at toy scale does not by itself establish Q1; both must hold for any complexity claim.
    - >-
      No claim is made about whether Kuperberg's own paper already covers
      this parameterization; that is exactly what the baseline-reproduction
      audit is for, and until performed, novelty_status stays unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random toy dihedral hidden-shift instance of order
        N, the leading-zero-bit yield of an optimal (exhaustively searched)
        k-tuple combination behaves, as N grows within the toy-testable
        range, like a smooth function of k and N extrapolable to the
        round-count formula's asymptotic regime.
      rigorous_support: >-
        No rigorous bound is composed here; this is explicitly a bookkeeping
        extrapolation assumption, not a Wesolowski-style rigorous-bound
        times classical-distribution-theorem composition -- flagged
        honestly as the weakest-supported heuristic in this proposal, since
        the corpus supplies no classical distribution theorem analogous to
        Dickman-de Bruijn for this specific combinatorial quantity.
      validation_plan: >-
        Compute the yield ratio at N in {2^8, 2^10, 2^12, 2^14, 2^16}
        exhaustively (or by large-sample Monte Carlo above 2^12 where
        exhaustive search becomes infeasible), fit the observed k-vs-yield
        curve, and check whether it is consistent with EITHER a k-invariant
        asymptote (falsifying H1's premise that k matters) or a genuinely
        k-dependent trend extrapolating toward the claimed round-count
        change -- report both fits and their residuals rather than selecting
        the favorable one.

  target_complexity:
    time_exponent: >-
      Undetermined pending Q1/Q2 resolution. Best case (both resolve
      favorably with k growing with n): a functional-form change from
      2^{Theta(sqrt(log N))} to a smaller form, structurally analogous to
      Wagner's k-tree exponent form. Most likely case (per the round-count/
      list-size balance argument and the quantifier concern above): no
      functional-form change, at best a constant-factor improvement to the
      sqrt(log N) exponent's leading coefficient.
    memory_exponent: >-
      Increases with k in the worst case (a global k-tree join requires
      storing cross-products of the current list, mirroring Wagner's own
      memory cost, the known price of his time gain); any claimed time
      improvement must be reported alongside this memory cost.
    best_known: >-
      2^{O(sqrt(log N))} time and query (Kuperberg 2005, KN-LIT-2c8264);
      collimation c-sieve variant (KN-LIT-127) for the memory axis.
    hidden_overhead: >-
      Even in the best case, the o(1)/O(1) terms hide the same kind of
      superpolynomial overhead Kuperberg's own algorithm already carries at
      k=2; this proposal does not claim to reduce that overhead, only to
      potentially change the sqrt(log N) exponent's form via k.
    tradeoff_note: >-
      Any k-arity gain in time is expected, per Wagner's own classical
      precedent, to trade against memory (more lists, more storage for the
      joint search) -- an explicit time-memory tradeoff position,
      interpolating between k=2 (Kuperberg, low relative memory) and large
      k (Wagner-style, higher memory), would need to be derived alongside
      any positive Q1/Q2 result, not asserted.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: medium

  dominated_by: >-
    Kuperberg's sieve (KN-LIT-2c8264) and its collimation-sieve memory
    variant (KN-LIT-127) dominate on every checked axis (time, memory,
    verification maturity) as of this session; no row of the known
    CSIDH-relevant frontier (Kuperberg 2005, Peikert 2020, Bonnetain-
    Schrottenloher 2020, SQALE 2022) is dominated by this unimplemented
    proposal.

  sota_delta: >-
    0x / no measured improvement; no experiment has been run. The proposal's
    own method-ceiling analysis already predicts the MOST LIKELY outcome is
    a constant-factor-in-the-exponent result (explicitly non-target-class
    per docs/target-result-profile.md A1), stated honestly rather than
    inflated, pending the toy-scale minimal test's actual numbers.

