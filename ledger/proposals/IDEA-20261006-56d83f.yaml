idea:
  id: IDEA-20261006-56d83f
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Odd-character gap of Tr(x(P)+x(Q)+x(R)) on summing triples versus
    shifted triples, object curve against a null curve.
  class: control
  claim: >-
    On E: y^2 = x^3 + x + 1 over F_5, among ordered triples of pairwise
    distinct affine points of E(F_{5^3}) with P+Q+R = O, let p_rel be the
    fraction with Tr_{F_{125}/F_5}(x(P)+x(Q)+x(R)) = 0, and let p_shift be
    the fraction for the matched triples (P, Q, R+T) where T is the first
    non-identity point in a frozen enumeration. Let g_obj = |p_rel - p_shift|.
    Define g_null the same way on a curve over F_{125} that is not defined
    over F_5. The claim is g_obj >= 0.15 and g_null <= 0.05. The
    representation is R1. The stage is the linear part of a descended
    relation system. The discrete-log time exponent stays 1/2 and the delta
    versus Pollard rho is 0.
  mechanism: >-
    Two explanations are distinguished before any count is seen. Explanation
    A: the linear trace constraint of KR-IC-f5c584 uses a group morphism
    onto F_2 on ordinary binary curves, and KN-FIND-ffe1df Theorem C says an
    exactly sum-compatible index is a homomorphism, which x-coordinates do
    not give in odd characteristic, so g_obj < 0.15. Explanation B: merely
    defining the curve over F_5 forces the trace of the sum of x-coordinates
    on every relation into a biased subset of F_5, so g_obj >= 0.15 and the
    same bias is absent on the null curve. The claim is explanation B.
    OBJECT FRAME. Representation: R1, the triple of x-coordinates. Operation
    set Sigma: {φ}, the coordinate 5-power map applied to all three points.
    Sigma is not translation. TRICHOTOMY. Coordinate-dependent. Reason: the
    trace of a sum of x-coordinates is a function of the affine chart, not a
    block system of a translation subgroup. LOSSY-PROJECTION TEST against
    Sigma. Discarded: the three x-coordinates in F_{125}, keeping one element
    of F_5. Compatible with Sigma: Tr(z^5) = Tr(z), so the trace is
    unchanged when φ is applied to the triple. Lossy: three extension
    elements determine the trace, and the trace does not determine them.
    Priced pair: b = 1 under Sigma, checked on 20 triples; L = log2 of the
    mean fibre of the trace on the relation sample, reported and required to
    be at least 1. F2 is a component only as the predicate P+Q+R = O via the
    group law. The measured object is the trace, not a relation vector.
    F1 and F3-F7 are not used.
  novelty_status: unverified
  citations:
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        On ordinary binary curves the Weil descent of S_3 has first fall
        degree 2 because a morphism E -> F_2 produces a linear polynomial.
        The row is scoped to characteristic 2.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
    - ref: KR-IC-f3da82
      provenance: internal
      claim: >-
        Joux–Vitse's F4 variant records one reduction trace and replays it
        on many similar decomposition systems. This proposal does not build
        or replay an F4 trace.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-f3da82.yaml
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C in that note: exact sum-compatibility plus associativity
        forces a surjective homomorphism onto the bucket group, which is
        impossible for prime order N when the number of buckets is strictly
        between 1 and N.
      verified_by: idea-generator, 2026-10-06, opened knowledge/findings/KN-FIND-ffe1df.md
    - ref: KR-IC-fbdb61
      provenance: internal
      claim: >-
        Last fall degree, solving degree, and degree of regularity are
        distinct. This proposal measures a trace proportion, not a solving
        degree.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-fbdb61.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Gaudry's fixed-n cost is Õ(q^{2-2/n}). A single linear bias at n=3,
        even if present, is not given an exponent in this record.
      verified_by: idea-generator, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Coordinate-dependent objects are functions of the representation.
        The trace of x is placed in that class.
      verified_by: idea-generator, 2026-10-06, opened ledger/proposals/IDEA-20260806-c5d183.yaml
  assumptions:
    - >-
      Triples containing the point at infinity are dropped, because x is
      undefined there. A relation sample of size under 100 voids the run.
    - >-
      The shift point T is fixed before the proportions are computed, and
      the same rule is used on the null curve.
    - >-
      The null curve is y^2 = x^3 + x + β with β^3 + β + 1 = 0 over F_5,
      after the run checks that this cubic has no root in F_5 and that the
      discriminant is nonzero. If the discriminant is zero, replace β by
      β+1 and record the equation that passed.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a control that separates two explanations by two proportions
      on toy curves. It does not certify a dropped variable or a new
      exponent.
  predictions:
    - metric: absolute gap between trace-zero proportions on summing triples and on shifted triples
      direction: different
      minimum_effect: "g_obj >= 0.15 and g_null <= 0.05"
  minimal_test:
    design: >-
      Object curve: y^2 = x^3 + x + 1 over F_5. Confirm 31 is nonzero in
      F_5. Enumerate affine points of E(F_{5^3}). Relation arm: every
      ordered pair (P, Q) with R = -(P+Q) and P, Q, R pairwise distinct
      affine points. Shift arm: the same pairs with R replaced by R+T.
      Trace arm: relative trace F_{125} -> F_5 of x(P)+x(Q)+x(R). Repeat
      on the null curve. Toy scope is n=3 and q=5 only.
    controls:
      - On 20 relation triples, applying the coordinate 5-power to every point leaves the trace unchanged.
      - A second implementation of the group law agrees on the sum of 20 triples.
      - The proportion of trace zero on a uniform sample of single field elements, size equal to the relation sample, lies in [0.15, 0.25], as a check that the trace code is not constantly zero.
      - Null curve discriminant is nonzero on the recorded equation.
      - Sample sizes of the relation arm and the shift arm are equal.
    required_metrics:
      - relation sample size (integer)
      - p_rel (rational)
      - p_shift (rational)
      - g_obj (rational)
      - g_null (rational)
      - L on the relation sample (float)
  falsification_conditions:
    - g_obj < 0.15, which selects explanation A on this instance.
    - g_null > 0.05, so a gap of that size is not tied to the curve being defined over F_5.
    - Any of the 20 Frobenius-trace checks fails.
    - The single-element trace proportion lies outside [0.15, 0.25], so the trace implementation is not believed.
    - Either sample has size under 100.
  confounders:
    - The shift T may itself be a relation in a subgroup. T is recorded, and a second shift T' = 2T is reported; the claim uses only T.
    - Points with y = 0 have a repeated x-coordinate in the group law. They stay in the sample; their count is reported.
    - A cyclic trace that is biased on all triples, relation or not, moves p_rel and p_shift together and shrinks the gap. That outcome falsifies the claim rather than supporting it.
  interpretation_limits:
    - Toy scope: F_5 and F_{125} only. A gap here does not drop a variable in Gaudry's system at general n.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0.
    - Explanation A remains available if the inequality fails. Failure is about this trace, not about every linear functional.
    - This is not the binary trace morphism of KR-IC-f5c584, and it does not restate a point count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If explanation B holds, the expectation of the indicator
        Tr(x(P)+x(Q)+x(R)) = 0 on relations is at least 1/5 + 0.15, while a
        uniform map from triples of field elements to F_5 has expectation
        1/5. The uniform figure is the model being imitated; the bias is the
        unproved transfer of the characteristic-2 trace constraint to odd
        characteristic.
      rigorous_support: >-
        KR-IC-f5c584 gives a linear equation in characteristic 2 from a
        morphism onto F_2. For a uniform F_5-valued function the zero locus
        has density 1/5. KN-FIND-ffe1df Theorem C blocks an exactly
        sum-compatible bucket map that is not a homomorphism. Neither
        statement proves a bias over F_5.
      validation_plan: >-
        The minimal test is the measurement. Tail check: split the relation
        sample into the first and second half of the frozen pair order and
        require both halves to have trace-zero proportion within 0.05 of
        p_rel. If the halves differ by more than 0.05, the gap is not read
        as a property of the whole sample.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "0 in the group order; one pass stores proportions, not a matrix"
    best_known: >-
      Pollard rho at exponent 1/2. The characteristic-2 linear factor in
      KR-IC-f5c584 is a solving-degree fact in another characteristic, not
      a smaller exponent for this curve.
    hidden_overhead: >-
      No o(1) term. Thresholds 0.15 and 0.05 are absolute gaps on one
      extension of 125 elements.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus Pollard
      rho is 0. No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-f5c584, KR-IC-5a43e5, KR-IC-fbdb61, KR-IC-46d822, and
