idea:
  id: IDEA-20260805-f49efb
  question_id: RQ-DREG-001
  added: '2026-08-05'
  title: >-
    The block-matched null: GOAL-DREG-001 has never run its signal against a
    null of the same shape, and the two nulls it does have disagree by 7,110 at
    the single decisive cell
  class: control

  claim: >-
    Every deficit this goal has measured - 1,322 (n=12 D5), 1,862 (n=15),
    1,823 (n=17), 1,999 (n=18), 2,724 (n=21 seed 1) and the D6 headline 17,947 -
    is a difference against a null that is NOT matched in shape to the object
    being measured. The boolean chained Semaev system at t = 3 is an AMALGAM OF
    TWO SUPPORT BLOCKS glued along the u-coordinates (block A: n quadrics on
    (U, X3); block B: n cubics on (U, X1, X2) - derived in IDEA-20260805-90a841
    from src/semaev_tree.py). The semi-regular reference sr_pred(n,D) is computed
    from the series (1+z)^{nb} (1+z^2)^{-n} (1+z^3)^{-n}, which models n quadrics
    and n cubics IN GENERAL POSITION ON ALL nb VARIABLES. It knows the degree
    histogram and knows nothing about the blocks. The proposal is to build the
    null that this program has never built - a random boolean system with the
    IDENTICAL block supports and identical degree histogram, uniform random
    coefficients on those supports - and to report the deficit against IT. Two
    outcomes, both first-class: if the block-matched null carries most of the
    deficit, the departure recorded across five rungs is a property of the
    variable-block incidence pattern and not of elliptic-curve arithmetic, and
    the honest reading of five committed cells changes; if it does not, the
    residual is Semaev-specific structure that has survived the strongest control
    available, which is the strongest positive result this goal could produce at
    toy scale.

  object_first_candidate:
    tracked_object: >-
      The equation-support block pattern used as a NULL-GENERATING TEMPLATE: the
      map from a real system to the random ensemble that shares its supports
      exactly, followed through Macaulay construction to exact GF(2) rank. What
      is tracked is the rank of a random member of that ensemble.
    established_families_off_limits: >-
      Off-limits as the primary lens: index calculus and relation collection;
      Weil-descent decomposition attacks; F4/F5 solving-degree estimation as an
      oracle; Pollard rho / BSGS comparison; subset-column corank (an artifact
      per h012 finding iv); and - specifically for this proposal - the
      semi-regular Hilbert series used as the reference. The series is retained
      only as a CALIBRATION quantity that the full-support null must reproduce
      exactly; it is deliberately not the comparator for the treatment arm.
    newness_score: >-
      The technique is not new anywhere in cryptanalysis and is the corpus's own
      house rule (inventor protocol section 3, "controls before belief"; the
      merged method census records 39 of 1,694 run directories as controls and
      166 of 229 evidence records with no null at all). What is new is the
      OBJECT: no null in this lane matches the block structure. Arm P deletes
      columns from a full-support system after it is built; arm R constrains
      supports by seeded greedy set-cover. Neither is the ensemble that shares
      the sem's supports, and the corpus contains no record that notices the
      difference.
    testability_score: >-
      High and, importantly, buildable IN THIS CONTAINER. Sage is absent
      (verified: `import sage` fails; src/semaev_tree.py and
      src/h012c_block_m4ri.py both fail to import), so the SEM arm cannot be
      rebuilt here - but the sem ranks are already committed, and a
      block-matched null is random boolean polynomials on prescribed supports,
      which is pure Python. numpy 2.4.6 is present, so a bit-packed GF(2)
      elimination gives exact ranks at n = 9 D5 in minutes and n = 12 D5 in
      hours without any solver.
    survival_score: >-
      The object survives all the way to the measured quantity, which is the
      point of a null. Where it stops is stated: it says nothing about d_reg
      itself, only about how much of the measured deficit the block pattern
      alone accounts for.

  mechanism: >-
    WHY THE EXISTING NULLS ARE NOT MATCHED, AND WHY THAT SHOWS UP AS A 7,110
    CONTRADICTION IN THE COMMITTED RECORD.

    The reference sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+ with h_k the
    coefficients of H_n(z) = (1+z)^{nb} (1+z^2)^{-n} (1+z^3)^{-n}. Re-derived and
    re-checked this session, it returns sr_pred(9,3..6) = 180 / 1,674 / 9,504 /
    28,068 and sr_pred(12,3..6) = 312 / 3,834 / 29,418 / 156,520, matching every
    committed value; and sr_pred(12,5) - 28,096 = 1,322, sr_pred(18,5) - 143,882
    = 1,999, sr_pred(21,5) - 265,950 = 2,724 recover three of the committed
    deficits exactly from the two instrument validation gates and the BATCH-003
    anchor. So the reference is correctly implemented and correctly transcribed.
    The question is not whether it is computed right; it is whether it is the
    right thing to compute.

    It models 2n polynomials in general position on nb variables. The actual
    system's polynomials are not in general position on nb variables: family A
    lives in the subring on n+k variables and family B in the subring on n+2k
    variables. Concretely at n = 12: nb = 24, but block A's 12 quadrics see only
    16 variables and block B's 12 cubics see only 20. Evaluating the BLOCK series
    H_A(z) = (1+z)^{n+k} (1+z^2)^{-n} gives, at n = 12,
    h^A = [1, 16, 108, 368, 458, -1104, ...], so the block-A subsystem alone is
    predicted to FREEZE at degree 5 - it is modelled as already generating the
    whole degree-5 space of its own subring - while the global series
    h = [1, 24, 264, 1724, 7104, 16920, 7494] stays positive through degree 6 and
    freezes only at 7. That gap phi_A < phi_full holds at every rung computed
    (phi_A = 4, 5, 6, 6, 6, 7, 7, 8, 9 against phi_full = 6, 7, 8, 8, 9, 9, 10,
    11, 12 for n = 9, 12, 15, 17, 18, 21, 24, 27, 30). A block that saturates
    earlier than the ambient model expects is precisely a source of rank deficit
    that the ambient model cannot see, and every syzygy internal to a block can
    be lifted by an arbitrary monomial in the variables the block does not use -
    a multiplicity of C(2k, D-d) for block A and C(k, D-d) for block B.

    THE NAIVE FORM OF THAT MECHANISM IS ALREADY FALSIFIED BY THE COMMITTED DATA,
    AND SAYING SO IS PART OF THE PROPOSAL. If the D=5 deficit were purely
    block-A freeze lifted by X1-X2 monomials, it would require phi_A <= 5, which
    fails at n = 15 (phi_A = 6) and beyond - yet the n = 15 deficit (1,862) is
    LARGER than the n = 12 one (1,322). So the freeze-degree story in its
    simplest form does not generate the observed D5 deficits. This is stated
    before any run precisely because it is the kind of thing that gets quietly
    dropped: the mechanism is a candidate SOURCE of deficit, not a derived
    formula for it, and the whole reason to MEASURE a block-matched null rather
    than to model one is that no closed form for the block-structured null's
    Hilbert series is in hand. That is an honest gap, and it is why the design is
    a measured null and not a predicted one.

    WHAT THE MEASURED NULL WILL SETTLE THAT NO MODEL CAN. Define
    D_glob = sr_pred(n,D) - rank_sem and D_block = rank_BMN - rank_sem, where BMN
    is the block-matched null. The share s = D_block / D_glob is the fraction of
    the measured departure attributable to elliptic-curve arithmetic rather than
    to variable-block incidence. Nobody has computed s at any cell.

    THE OBSERVATION COLLISION THAT MAKES THIS URGENT. At the single cell
    n = 12, D = 6 the corpus holds TWO null ranks: 156,520 (arm P,
    TASK-20260731-016, support-restricted, deficit vs sr_pred exactly 0) and
    149,410 (arm R, EV-SIG-008 N1, column-matched, deficit 7,110), with
    essentially the same column count (174,035 vs 174,033) and the same degree
    histogram. The sem rank at that cell is 138,573. So the sem's deficit is
    17,947 against arm P and 10,837 against arm R - the SAME measurement, two
    conventions, a 40 percent spread. H-SDEG-0dd021 has already noticed this as a
    modelling problem and proposes a formula to reconcile it. This proposal makes
    the complementary move: rather than adjudicating between two mismatched
    nulls, build the one whose supports are forced to equal the sem's, so the
    convention has nothing left to choose.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/evidence/EV-DREG-004/006/007/008.yaml, EV-SIG-006/008 as cited
      - ledger/hypotheses/H-SDEG-0dd021.yaml
      - ledger/goals/GOAL-DREG-001.yaml (BATCH-001..003 checkpoints)
      - ledger/proposals/IDEA-20260801-002.yaml
    grep_results:
      - >-
        Two null arms exist and are named in the corpus: arm P (matrix-projected,
        full-support system with columns deleted afterwards) and arm R
        (system-restricted, supports built by safe pools plus seeded greedy
        set-cover). Neither is drawn from the sem's own supports.
      - >-
        No record in this goal compares a signal against an ensemble null sharing
        the treatment's supports. The nearest is CTRL-B, which restricts the
        FULL-SUPPORT null's columns to the sem's - a projection, not a matched
        ensemble.
    conclusion: >-
      Not present in this corpus. The technique is standard; the gap is that this
      lane's specific object never received it.

  lossy_projection_identifiability_audit:
    projection: >-
      Real chained-Semaev boolean system  -->  its support family
      {supp(f_1), ..., supp(f_{2n})}  -->  the uniform ensemble of boolean
      systems with exactly those supports.
    what_is_discarded: >-
      Every coefficient, hence the curve, R_X, B_curve, and the basis alpha. The
      support family is retained exactly, including which particular pairs and
      triples occur in which equation - not merely the block pattern.
    why_genuinely_lossy: >-
      The fibre is the full coefficient space over the supports, of size
      2^{sum_i |supp(f_i)|}, which at n = 12 is astronomically larger than one.
      The sem system is one member of an ensemble the projection cannot
      distinguish it from - which is the definition of a matched null and the
      reason the comparison is meaningful.
    why_compatible_with_the_operations: >-
      Compatible with Macaulay construction exactly (the column set is a function
      of the supports alone, per EV-SIG-006's verified up-closure law and
      IDEA-20260805-90a841's closed form), and compatible with rank only in the
      distributional sense - the ensemble has a rank DISTRIBUTION, not a rank.
      That is why the design demands at least three seeds per cell and reports
      the spread before it reports any difference.
    is_it_only_a_change_of_coordinates: >-
      No. Coefficients are genuinely destroyed and cannot be recovered from the
      supports; there is no analogue of the char-2 (Delta, Pi) recovery. THE
      MIRROR FAILURE IS THE ONE TO WATCH AND IT IS CHECKED: is the projection so
      lossy that it is constant, i.e. does the ensemble rank fail to vary?
      Partly - and deliberately: the ensemble's COLUMN COUNT is constant by
      construction (that constancy is the pre-run forced value, 11,032 at n=9 D5,
      46,717 at n=12 D5, 29,332 at n=9 D6, 174,035 at n=12 D6). Its RANK must
      vary, and if the measured seed-to-seed rank spread is zero the ensemble is
      degenerate and the comparison is void. Zero spread is therefore recorded as
      an instrument failure, not as a clean result.

  assumptions:
    - >-
      That the sem's per-equation supports are recoverable from the committed
      system hashes (EXP-DREG-004 prefix 0da7ff6aa40007e8) or rebuildable in an
      environment that has Sage. IF NEITHER HOLDS, the fallback is the
      BLOCK-TEMPLATE null - supports generated from the block-incidence pattern
      derived in IDEA-20260805-90a841 rather than copied from the sem - which is
      weaker (it matches the block structure but not the per-equation support)
      and must be labelled as the weaker object wherever it is used. The
      experiment declares which of the two it ran.
    - >-
      That exact GF(2) rank of the null matrices is reachable without Sage. A
      bit-packed numpy elimination at n = 9 D5 (11,032 columns x 10,440 rows) and
      n = 12 D5 (46,717 x 31,512) is arithmetic this container can do; n = 12 D6
      (174,035 x 183,312) is not budgeted and is explicitly out of scope.

  predictions:
    - metric: >-
        ncols of the block-matched null at n = 9 D5, n = 9 D6, n = 12 D5,
        n = 12 D6
      direction: different
      minimum_effect: >-
        EXACTLY 11,032 / 29,332 / 46,717 / 174,035, forced pre-run by the closed
        form of IDEA-20260805-90a841. Zero tolerance. This is the construction
        gate: a null whose column count differs is not matched and the run stops.
    - metric: >-
        deficit of the FULL-SUPPORT null against sr_pred at n = 9 D5 and n = 12
        D5 (calibration / positive control)
      direction: different
      minimum_effect: >-
        EXACTLY 0, i.e. rank = sr_pred = 9,504 and 29,418 respectively. This
        reproduces the committed BATCH-002 calibration ("null rank = sr_pred =
        156520, deficit 0 => calibrated") one degree lower and at a second n.
        If it is not 0, the rank instrument is broken and NO negative result may
        be reported from any other arm.
    - metric: >-
        s = (rank_BMN - rank_sem) / (sr_pred - rank_sem) at n = 12, D = 5, over
        >= 3 null seeds, against the committed rank_sem = 28,096 and the
        committed deficit 1,322
      direction: higher
      minimum_effect: >-
        s >= 0.50 is the proposal's positive prediction: at least half of the
        1,322 deficit is block incidence. s <= 0.15 (block-matched null deficit
        below ~198) FALSIFIES it and is the more interesting outcome, because it
        would mean the departure survives the strongest available control and is
        arithmetic. The band 0.15 < s < 0.50 is pre-declared INCONCLUSIVE at this
        cell and requires the n = 9 rung and the graded arm to interpret.
    - metric: >-
        seed-to-seed spread of rank_BMN at each cell, reported BEFORE any
        comparison to rank_sem
      direction: lower
      minimum_effect: >-
        Spread strictly less than the deficit being discussed at that cell (i.e.
        < 1,322 at n = 12 D5). If the ensemble's own spread is comparable to the
        effect, the effect is not resolvable and the cell reports a spread, not a
        deficit. Zero spread is an instrument failure, not a pass.
    - metric: >-
        graded arm - deficit of a null interpolating from block supports (f = 0)
        to full supports (f = 1) in 5 steps at n = 9 D5
      direction: lower
      minimum_effect: >-
        Monotone decrease to exactly 0 at f = 1. A quantity that fails to decay
        as the parameter meant to destroy it increases is the canonical artifact
        tell (inventor protocol section 3), and this arm is here to trigger it.

  minimal_test:
    design: >-
      See EXP-DREG-9ac65a. Cheapest-first, with an early stage that can end the
      line: (0) recover or reconstruct supports and verify column counts against
      the forced values - seconds, pure Python, TERMINATES THE RUN on mismatch;
      (1) full-support null at n = 9 D5, forced deficit 0 - minutes, calibrates
      the instrument; (2) block-matched null at n = 9 D5, >= 3 seeds; (3) graded
      arm at n = 9 D5, 5 interior points; (4) block-matched null at n = 12 D5,
      >= 3 seeds, the primary cell, compared against the committed rank_sem =
      28,096. n = 12 D6 is NOT in the budget.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, forced value derived pre-run, CAN FAIL:
        the block-matched ensemble itself IS the null for the sem arm, and its
        column count is forced to 11,032 / 46,717 exactly. It can fail loudly -
        wrong support reconstruction, wrong degree histogram, or a degenerate
        ensemble all show up as a wrong column count or zero rank spread.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: the FULL-SUPPORT random
        null must return deficit EXACTLY 0 at n = 9 D5 and n = 12 D5. The
        committed n = 12 D6 calibration establishes that this is the instrument's
        behaviour when it is working. If deficit != 0 there, the instrument is
        broken and no negative may be reported at all.
      - >-
        GRADED CONTROL, 5 interior points, monotonicity reported: f in {0, 0.25,
        0.5, 0.75, 1} adding cross-block monomials to the supports. This
        localises any obstruction to a monomial class rather than leaving "the
        null did not explain it".
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION SHOULD FAIL: a null with the same
        BLOCK SIZES but the blocks permuted so that the degree-3 family sits on
        (U, X3) and the degree-2 family on (U, X1, X2). Column counts differ in a
        computable way; if the deficit is unchanged, the measurement is
        responding to block sizes only and not to the actual incidence pattern.
      - >-
        ORDERING CONTROL: the full-support and block-matched null arms are run
        and their numbers committed BEFORE the committed sem ranks are re-read
        into the analysis, and the decision rule is executed on the null arms
        first. If the rule emits the same label on both null arms it discriminates
        nothing and must be rewritten before any sem comparison.
    required_metrics:
      - ncols per arm per cell against the forced values
      - exact rank per arm per seed, with per-chunk pivot accounting
      - seed spread per cell, reported first
      - s = D_block / D_glob per cell with its interval over seeds
      - the graded curve and its monotonicity verdict

  falsification_conditions:
    - >-
      The block-matched null's column count differs from the forced value at any
      cell. The construction is not matched; nothing downstream is reportable.
    - >-
      The full-support null's deficit is not exactly 0 at n = 9 D5. Instrument
      broken; no negative reported (AGENTS.md rule 5 and inventor protocol
      section 3).
    - >-
      s <= 0.15 at n = 12 D5 with seed spread small. The proposal's claim - that
      the deficit is largely block incidence - is FALSE, and the goal gains its
      strongest positive: a departure that survived a matched null.
    - >-
      Seed spread of rank_BMN is zero, or is comparable to the deficit. The
      ensemble is degenerate or the effect is unresolvable; report the spread.

  confounders:
    - >-
      SUPPORT PROVENANCE. If the sem supports cannot be recovered and the
      block-template fallback is used, the null is matched on block structure but
      not on the per-equation support, and it may over- or under-state s. This
      must be declared on the face of every number, not in a footnote.
    - >-
      ENSEMBLE VS INSTANCE. rank_sem is one system; rank_BMN is a distribution.
      Comparing a point to a mean is legitimate only with the spread reported
      first, which is why the spread is a pre-registered primary metric.
    - >-
      IMPLEMENTATION ASYMMETRY. The sem ranks were produced by the chunked
      block-m4ri engine under Sage; the null ranks here would be produced by a
      numpy bit-packed elimination. Two implementations, one comparison. The
      mitigation is the full-support positive control, which both implementations
      must place at the same committed value (29,418 at n = 12 D5); if they do
      not, the comparison is void and that is an infrastructure finding, never
      mathematical evidence.
    - >-
      DEGREE CHOICE. D = 5 is far below any plausible d_reg (phi_full = 7 at
      n = 12, 9 at n = 21). A deficit at D = 5 is a low-degree structural
      observation, not a solving-degree observation, and must not be narrated as
      one.

  interpretation_limits:
    - >-
      Toy scale, boolean, t = 3, n <= 12, D = 5. No crypto-scale claim, no
      exponent, no attack, no prime-field transfer, and no H-DREG-001 status
      change - only the Coordinator may make one (AGENTS.md rule 1).
    - >-
      A large s does NOT close RQ-DREG-001. It would mean the committed deficits
      are largely a support-incidence effect, which changes their INTERPRETATION
      and leaves the d_reg question open at the degrees that matter. Forward
      guidance if s is large: the next object is the block-structured Hilbert
      series itself (a closed form for the amalgam), and the next measurement is
      at D >= phi_A rather than at D = 5.
    - >-
      A small s does NOT establish a departure in d_reg either. It establishes
      that a low-degree rank deficit survives a support-matched null at one or
      two toy cells. The distance from there to "d_reg departs from the null" is
      the whole remaining goal.

  heuristic_assumptions:
    - id: H1
      statement: >-
        ENSEMBLE CONCENTRATION. For fixed supports, the exact GF(2) rank of the
        degree-D Macaulay matrix of a uniformly random system on those supports
        concentrates, i.e. its seed-to-seed spread is small relative to the
        deficits under discussion (order 10^3 at the cells used).
      rigorous_support: >-
        NOT PROVED, and this is the load-bearing assumption of the design.
        Partial in-corpus support: at n = 12 D6 the sem's own rank moves only
        from 138,570 (seed 2) to 138,573 (seed 2026), a spread of 3 against
        deficits of order 10^4, and the full-support null hits sr_pred exactly at
        the cells where it has been measured. That is suggestive of strong
        concentration and is not a proof of it. H-SDEG-0dd021's HEUR-BF-1 makes
        the stronger claim (determinism) and records that it has no surviving
        random-model justification; this record makes the weaker claim and
        measures it rather than assuming it.
      validation_plan: >-
        Spread is a PRIMARY metric, reported before any comparison, at >= 3 seeds
        per cell and >= 5 at n = 9 D5 where seeds are cheap. If spread is not
        small the design's comparison is withdrawn at that cell and the cell
        reports a distribution.
    - id: H2
      statement: >-
        SUPPORT SUFFICIENCY. The deficit-relevant difference between the sem and
        a generic system of the same degree histogram is carried by the supports,
        so an ensemble matched on supports is the right null.
      rigorous_support: >-
        This is the hypothesis under test, not an assumption granted to it. It is
        listed here because the design's INTERPRETATION depends on it: if there
        is a coefficient-level structure invisible to the supports, a matched
        null will not capture it and a small s will be the correct answer for the
        wrong reason. The nearby-object control (block-permuted null) is the
        cheapest available probe of that.
      validation_plan: >-
        Report s at two cells and the block-permuted control; a coefficient-level
        effect shows up as s small at BOTH cells with the permuted control also
        showing the full deficit.

  target_complexity:
    time_exponent: >-
      n/a - this proposal moves no exponent and claims no algorithm. It is a
      control. What it changes is the admissible reading of five committed cells
      that currently carry an unmatched comparator.
    memory_exponent: >-
      n/a. Peak working set for the budgeted cells is under 1 GB with bit-packed
      columns (46,717 columns / 64 = 730 uint64 words per row, 31,512 rows,
      ~184 MB).
    best_known: >-
      The incumbent comparator is sr_pred, the global semi-regular series. It is
      not a competing attack; it is the reference this proposal argues is
      mismatched.
    hidden_overhead: >-
      Support recovery. If Sage is unavailable and the committed supports are not
      extractable, the whole design degrades to the block-template fallback, and
      that degradation is the real cost.
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed, no Pareto point offered) - and the frontier was
    nevertheless checked, because an unchecked null is a fabrication under rule
    5. Rows checked for an existing matched-null measurement in this family:
    TIME - the two existing null arms (P at 1,623.8 s / 7.16 GB; R via
    EV-SIG-008, whose run directories its own artifact_absence_statement records
    as absent or pre-schema); neither is support-matched, so neither dominates on
    the axis that matters here (correctness of the comparator), and this
    proposal is strictly more expensive on wall clock than doing nothing.
    MEMORY - the budgeted cells sit at ~0.2 GB against CTRL-B's 7.16 GB, but they
    are different cells and the comparison is not a domination.
    DATA/QUERIES - all arms need the same committed sem ranks; no arm needs new
    sem computation, which is the design's main economy. On the ECDLP attack
    frontier this proposal offers no point at all and dominates nothing.
  sota_delta: >-
    Zero on every attack axis - no time, memory, data, query or advice
    improvement against Pollard rho or anything else. The quantitative delta is
    evidentiary: it replaces a comparator whose two available conventions differ
    by 7,110 at the decisive cell (17,947 vs 10,837 for the same sem
    measurement, a 40 percent spread) with one whose column set is forced to
    agree exactly, and it supplies the first number in this goal's history for
    the share s of the departure attributable to support incidence.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    0.45 that s >= 0.50 at n = 12 D5 - i.e. that block incidence carries most of
    the deficit. Not higher, because the naive freeze-degree form of the
    mechanism is ALREADY falsified by the committed data (phi_A = 6 > 5 at
    n = 15, yet the n = 15 D5 deficit is larger than n = 12's), so the block
    story has no derived quantitative form and the prediction rests on the
    structural argument alone; and because the D = 5 cells sit far below phi_A at
    most rungs, where block freeze cannot be the operative source. Not lower,
    because the two existing nulls disagree by 7,110 at the one cell where both
    exist, which is direct evidence that the comparator convention alone moves
    numbers of the same order as the effect, and because the entire deficit
    signal has never met a matched null. Separately: 0.85 that the experiment
    reaches a decisive number at n = 9 D5 in this container, and 0.55 at
    n = 12 D5, the gap being the arithmetic budget rather than the mathematics.
