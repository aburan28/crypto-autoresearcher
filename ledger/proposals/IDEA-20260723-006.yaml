idea:
  id: IDEA-20260723-006
  title: Corner-coefficient induction and exceptional-target saturation theorem
  class: control
  claim: >-
    For every m>=3, the target-sectioned Semaev Newton polytope is the full
    box outside an explicit O(m)-sized exceptional target set. Consequently the
    original support-aware route either has the full-box mixed-volume driver or
    must pay for an exception-only target bridge that is not sub-rho under
    uniform masking. This is a proposed negative theorem gate, not a sub-rho
    algorithm.
  mechanism: >-
    Semaev leading-coefficient identities and corner-coefficient induction
    classifying every possible loss of a Newton-box vertex; exception bridge
    cost charged against Pollard rho.
  novelty_status: speculative
  question_id: RQ-CRYPTO-001
  source_refs:
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-008/tasks/TASK-20260723-801/newton_screen_report.yaml
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-008/tasks/TASK-20260723-803/red_team_report.yaml
  disposition: support
  interpretation_limits:
    - Supported only as a scoped negative Newton/BKK gate (EV-CRYPTO-009).
    - No cryptographic advantage or breakthrough is claimed.
    - Strength remains preliminary; KN-FIND not yet warranted.
  recorded_by: coordinator
  recorded_at: '2026-07-23'
