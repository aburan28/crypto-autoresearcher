idea:
  id: IDEA-20261001-833e78
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES THE FROBENIUS-CLASS WALK CONSTANT MATCH √(2n) AT TOY KOBLITZ SCALE?
    On stdlib (or already-admitted) toy Koblitz cells n∈{17,23,31}, compare an
    r-adding walk on points vs a walk on ⟨τ,−1⟩ classes and measure the
    iteration-ratio against the classical √(2n) prediction.

  class: heuristic_validation

  claim: >-
    RQ-BINSTD cost tables need an honest rho baseline with the symmetries the
    curve grants. CLAIM: on each toy n∈{17,23,31} with ≥10 independent seeds,
    the ratio (mean iterations to collision on points) /
    (mean iterations on Frobenius-class walks) lies in [0.85·√(2n), 1.15·√(2n)]
    — OR a measured deviation band is recorded as the obstruction to using
    √(2n) at that scale. CLAIM TIER: heuristic_validation / observational.
    NO break. NO exponent move. NO n≥131 solve claim.

  mechanism: >-
    OBJECT FRAME. Representation: affine points on E:Y^2+XY=X^3+a / F_{2^n}
    and their ⟨τ,−1⟩ class labels. Operation set: Teske-style r-adding steps
    (r≈20) on points vs on classes; distinguished-point or full birthday
    collision detector at toy order. Trichotomy: Class II heuristic check of
    KR-RHO-037e22's √(2n) factor at reachable scale. Lossy-projection: null
    object = walk on a curve without efficient Frobenius class structure
    (pseudorandom sibling) must NOT show the √(2n) gain. OFF-LIMITS: claiming
    ECC2K-130 progress from toys; GPU/FPGA engineering. WHAT IS NEW: a
    pre-registered numeric band for the class-walk constant on the same toy
    cells the Part-2 instrument uses.

  novelty_status: unverified
