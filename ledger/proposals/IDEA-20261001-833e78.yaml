  assumptions:
    - Toy orders only; collision search must finish inside budget.
    - Null curve must lack an efficient τ-class representative map.
    - No transfer of measured constants to ECC2K-130 without a new contract.

  heuristic_assumptions:
    - id: HEUR-BINSTD-833e78-H1
      formal_statement: >-
        FORALL n∈{17,23,31} and FORALL ≥10 independent seeds: letting R_n be
        the ratio of mean point-walk iterations to mean class-walk iterations
        to first collision, |R_n / √(2n) − 1| ≤ 0.15.
      random_model_justification: >-
        Rigorous: |⟨τ,−1⟩|=2n on ordinary Koblitz (up to the usual center);
        random-oracle partition collision Θ(√|G|) (KR-RHO-93979e lineage).
        Classical: Teske r-adding near-random for r≈20 (KR-RHO-cd86f5).
        Transfer to toy n is the hypothesis under test; ECC2K-130 remains
        out of scope.
      supporting_results:
        - KR-RHO-037e22
        - KR-RHO-cd86f5
      validation_experiment_ids: []
      falsification_condition: >-
        Any n in the set with |R_n/√(2n)−1| > 0.15 on the pre-registered
        seed budget, OR the non-Koblitz null shows a ≥1.5× spurious 'class'
        gain.

  predictions:
    - metric: class_walk_speedup_ratio
      direction: match_band
      minimum_effect: 'within ±15% of √(2n) at each toy n'
    - metric: null_curve_false_gain
      direction: lower
      minimum_effect: '<1.15× on the pseudorandom sibling'

  minimal_test: >-
    Stage 0: pin r=20, seeds, collision detector, null curve. Stage 1: n=17
    with ≥10 seeds point vs class. Stage 2: n=23,31 + null. Budget: ≤30 runs,
    ≤8 CPU-hours. Stop if any arm exceeds wall budget without a collision
    (infrastructure, not negative evidence).

  controls:
    - ctl_fixed_r_adding_r20
    - null_pseudorandom_sibling_curve
    - ctl_negation_only_partial_class
    - ctl_seed_replication_ge10

  falsification_conditions:
    - Quoting √(2n) at n≥131 from this toy band without a new contract.
    - Treating a timeout as evidence against H1.
    - Claiming a break or exponent improvement.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Validates the known √(2n) constant at toy scale.
    memory_exponent: O(√|#G|) birthday tables at toy order (or DP subset)
    best_known: >-
