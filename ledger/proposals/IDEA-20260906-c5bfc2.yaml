  assumptions:
    - >-
      FIPS 203 conformant key generation derives the whole key from a 32-byte d
      and publishes rho = G(d || k)[0:32]. If Stage 0 refutes this, the record
      reports the refutation and stops rather than salvaging.
    - >-
      RC.MATZOV's log2(rop) figures and the constants 143 / 207 / 272 live in
      one comparable gate accounting. This is EV-MLKEM-020's own H6/H11 and is
      recorded there as unverified; this record inherits the assumption
      unchanged and does not launder it.
    - >-
      A gate count is meaningless without a declared basis, and no count in one
      basis is compared with a count in another.
    - >-
      The comparison is single-target. Multi-target amortisation of the same
      object is a separate record (IDEA-20260906-e5e51c) and is deliberately
      excluded here so that this record's ceiling is the conservative one.
    - >-
      Keccak-f[1600] is treated as generic. No structural preimage attack on
      full-round Keccak is assumed, and none is claimed to be impossible; a
      structural attack would only lower the ceiling.

  proof_search_map:
    bottleneck: >-
      The unexamined assumption, present in every security figure this lane
      holds, that the cheapest attack on ML-KEM is a lattice attack. Removing it
      requires exhibiting a non-lattice attack and pricing it in the same units;
      that exhibition is this record.
    baseline_embedding:
      parameter_slice: >-
        The seed attack at N = 1 target, full-keyspace convention, gate metric,
        c = 0. In that slice the comparison must reduce to a two-number
        inequality, 256 + g against 272, containing no lattice quantity at all.
      reproduction_check: >-
        Frozen fixture: the pipeline fed EV-MLKEM-020's committed triple and the
        cutoffs must return the committed undercuts 2.800527 / 6.041285 /
        1.276377 to all printed digits before it is allowed to add a new row.
    observation_collision:
      observable: >-
        The reported bit-security of ML-KEM-1024, i.e. log2 of the cheapest
        priced attack.
      distinct_preimage_search: >-
        COLLISION FOUND, AND IT IS THE CONTENT. The number 270.7 arises from (a)
        a lattice attack with 2^180.9 elements of randomly accessed memory and
        (b), if g is near 15.7, a symmetric search with O(1) memory. These are
        distinguished by no quantity this lane currently reports, because the
        lane reports a scalar. The separating condition is to report the triple
        (time, memory, data) per attack, which is this record's Stage 3
        deliverable.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the priced attack family from lattice attacks to
          {lattice attacks} union {generic search on the key-derivation seed},
          and prove a strict inward improvement on the reported minimum at
          ML-KEM-1024 whenever g < 15.72, rather than merely showing the new
          family is non-empty.
        predicted_gain: >-
          Either a strictly cheaper attack at ML-KEM-1024, or a proved upper
          bound of g - 16 bits on the achievable non-lattice margin. One of the
          two is forced.
      - transform: stronger_invariant
        proposed_object: >-
          Carry (time, memory, data, parallel form) per attack instead of a
          scalar cost, since the scalar cannot survive a change of metric and
          the tuple can.
        predicted_gain: >-
          Makes T3 decidable and makes the memory-charging arguments of this
          lane comparative rather than absolute.
    quantifier_order: >-
      THERE EXISTS an algorithm A and THERE EXISTS a constant g (the gate count
      of one Keccak-f[1600] in a declared basis) such that FOR ALL FIPS
      203-conformant ML-KEM key pairs, A recovers the decapsulation key in
      expected 2^255 evaluations of A's one-step map, i.e. 255 + g gate-bits,
      using O(1) memory. The witness g does NOT depend on the instance, the
      parameter set, or the seed - which is what makes the statement a ceiling
      rather than an average-case estimate. NOT claimed: any uniform statement
      over non-conformant key generation, and nothing at all about IND-CCA
      advantage short of key recovery.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under basis B, one Keccak-f[1600] costs 2^g gates; therefore every
        FIPS 203 ML-KEM key is recoverable in 255 + g gate-bits with O(1)
        memory, and ML-KEM-1024's margin over its category-5 reference is at
        most g - 16 bits." Nothing about whether the lattice estimate is right,
        nothing about ML-KEM-512 or ML-KEM-768 beyond non-bindingness, and
        nothing about quantum adversaries.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a KEM
        identical to ML-KEM except that rho is drawn independently of d (seed
        length 512 bits). The method must return a ceiling of 2^512 there and
        2^256 here. A method that returns the same ceiling for both is reading
        "there is a seed" rather than "the public key exposes an image of the
        seed", and has not identified the load-bearing structure. This control
        is NULL-S and is constructible in one line of code.
    proof_obligations:
      - claim: rho is a deterministic 256-bit function of d, checked on FIPS 203 KAT vectors.
        responsibility: correctness
      - claim: One trial is exactly one Keccak-f[1600] permutation plus a comparison.
        responsibility: runtime
      - claim: Expected trials 2^255, expected spurious preimages O(1), each removed in one keygen.
        responsibility: success_probability
      - claim: Memory is O(1) words at N = 1 and the attack parallelises with no communication.
        responsibility: memory
      - claim: g is counted in a declared basis and the AES-256 control is counted in the same one.
        responsibility: baseline
      - claim: The ceiling is claimed only for FIPS 203-conformant key generation.
        responsibility: scope

  predictions:
    - metric: >-
        g, the counted gate count of one Keccak-f[1600] permutation in the
        declared {AND, XOR, NOT-free} basis, expressed as log2
      direction: different
      minimum_effect: >-
        The verdict changes at g = 15.7236234535225 (T1) and at g = 16 or 17
        (T2, convention-dependent). Any counted g is a complete answer; the
        record predicts no value and must not be read as predicting one.
    - metric: >-
        the ML-KEM-1024 non-lattice margin, defined as (256 + g) - 272 gate-bits
      direction: lower
      minimum_effect: >-
        The claim bites if this is below 6.041285 bits, i.e. below the largest
        committed margin in the lane, since it would then be the binding
        constraint at ML-KEM-1024 under any lattice improvement of that size.
        It is decisive if it is negative.
    - metric: >-
        c_seed = (g - 15.7236234535225) / 180.924993, the memory-charge exponent
        at which the O(1)-memory seed attack overtakes the committed lattice
        figure at ML-KEM-1024
      direction: different
      minimum_effect: >-
        Report against the committed c* = 0.00705473. The two orderings
        (c_seed < c* versus c_seed > c*) are different findings and the record
        must state which before interpreting either.
    - metric: >-
        number of parameter sets at which the ceiling 255 + g falls below the
        NIST cutoff
      direction: higher
      minimum_effect: >-
        1 would be decisive and would be a category failure with no lattice
        content. 0 is the expected and still-useful outcome, since it converts
        the ceiling into a proved upper bound on the lane's achievable margin.

  minimal_test:
    design: >-
      TWO STEPS, BOTH CHEAP, AND THEY ARE THE CHEAPEST VALID DISCRIMINATOR IN
      THIS RECORD. Step 1 (minutes, no lattice compute): on FIPS 203
      known-answer test vectors, compute SHA3-512(d || k) and check byte-for-
      byte that its first 32 bytes equal the rho embedded in the KAT public key,
      for every KAT seed at all three parameter sets. This either establishes
      the structural premise at full FIPS 203 scale with an exact artifact
      check, or refutes the record outright. Step 2 (hours, still no lattice
      compute): compile Keccak-f[1600] and an AES-256 core to a declared gate
      basis and COUNT, then evaluate T1, T2, T3 in closed form against
      EV-MLKEM-020's committed constants. No BKZ run, no estimator run, no
      dimension-512 measurement is required anywhere in this record - which
      matters because this program has measured that a d=512 / beta=55 /
      mpfr=100 cell ran at least 14448 s without completing.
    controls:
      - NULL-K, the KAT reproduction null - the derivation must reproduce a published rho from its own d.
      - NULL-B, the basis null - the same circuit counted in two declared bases, both reported.
      - NULL-A, the matched-reference null - AES-256 counted by the same counter, checked against NIST's implied 2^16.
      - NULL-S, the scrambled-scheme null - a variant with independent rho must return a 2^512 ceiling.
      - Forced-value declaration recorded before any number is produced.
    required_metrics:
      - g in each declared basis, with the counting convention stated
      - counted AES-256 gates in the same basis, and its ratio to NIST's implied 2^16
      - the ceiling 255 + g and 256 + g at all three parameter sets
      - the three signed thresholds T1, T2, T3 with the convention used
      - c_seed, reported beside the committed c* = 0.00705473
      - the full (time, memory, data, parallel form) row for the seed attack
      - KAT check outcome per parameter set, pass or fail, with the vector identifiers

  falsification_conditions:
    - >-
      If the KAT check in Step 1 fails - if rho is not the first half of
      G(d || k) for conformant key generation - then part (A) is false, the
      ceiling is not 2^256, and the record is REFUTED at its premise. This is a
      clean negative obtainable in minutes.
    - >-
      If the counted g exceeds 17 in every declared basis, then the ceiling
      clears both the cutoff and the committed lattice figure at every parameter
      set, the seed attack is not competitive, and the record's attack claim is
      refuted. What survives is only the upper bound g - 16 on the achievable
      margin, which must then be reported as the record's entire content rather
      than dressed up as more.
    - >-
      If the AES-256 control does not land near NIST's implied 2^16 gates per
      trial in the same basis, then the counter and the inherited constants are
      not in one accounting, T2 is uninterpretable, and no threshold verdict may
      be stated at all.
    - >-
      If a reviewer with retrieval finds this exact quantitative observation in
      the published literature, the record is superseded as a novelty claim
      while remaining valid as a lane-local calibration; it must then be
      re-filed citing that source rather than silently retained.

  confounders:
    - >-
      BASIS MISMATCH, the largest one. A count in {AND, XOR, NOT} is not a count
      in {NAND} or in a Toffoli basis, and Keccak is XOR-heavy while AES is
      AND-heavy, so the RATIO g - 16 is far more basis-sensitive than either
      count alone. A basis choice can therefore manufacture either verdict, and
      the record must report every basis it counted, not the favourable one.
    - >-
      NIST's constants may embed deliberate conservatism or rounding. A measured
      ceiling slightly below 272 may reflect NIST's own margin rather than an
      ML-KEM defect, and this record cannot distinguish those without primary
      text that EV-MLKEM-020 records as unreadable.
    - >-
      RC.MATZOV's rop unit may not be a gate in the same sense as NIST's. This
      is EV-MLKEM-020's H6, recorded there as never having had its PURPOSE
      stated. Every comparison in part (B) inherits that defect, and it is
      inherited on the same side for all three parameter sets, so it shifts the
      thresholds uniformly rather than differentially.
    - >-
      Bitsliced counting measures a circuit, not a machine. Routing, clock
      distribution and yield are all below the gate and are excluded on both
      sides, which is the standard convention and is also the reason the
      resulting numbers must not be read as buildability claims.
    - >-
      The average-trial versus full-keyspace convention is worth exactly one bit
      and both thresholds sit within about 1.3 bits of each other, so a silent
      convention switch could flip a verdict. Both conventions are reported.

  interpretation_limits:
    - >-
      This is a statement about KEY RECOVERY under FIPS 203 conformant key
      generation. It is not a statement about IND-CCA advantage, not a statement
      about any specific implementation, and not a claim that any deployed
      system is broken.
    - >-
      Claim tier under docs/claims-and-verification.md: the KAT check is an
      exact artifact check at full standardized scale, and the gate counts are
      exact for the circuits counted; but the COMPARISON against 143 / 207 / 272
      and against RC.MATZOV rop is conditional on inherited constants this
      program records as unverifiable, so no category verdict may be stated
      unconditionally.
    - >-
      No lattice claim is made or implied. In particular nothing here bears on
      whether core-SVP is conservative; the record's whole point is that it
      supplies a bound that holds whatever the answer to that question is.
    - >-
      The ceiling is an upper bound on security, not a lower bound. Finding that
      the ceiling is comfortably above the lattice figure does NOT license any
      statement that ML-KEM-1024 is secure.
    - >-
      If Stage 0 cannot obtain FIPS 203 KAT vectors under this harness's network
      policy, the record is BLOCKED, not weakened, and must say so rather than
      proceed on the recalled premise.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random d in {0,1}^256 and the fixed public function
        F(d) = SHA3-512(d || k)[0:32], the number of trials needed to find some
        d' with F(d') = rho, for a rho that is itself F of a uniform d, is
        distributed as a geometric variable with mean 2^256, so expected trials
        are 2^255 to hit the specific target and the expected number of
        additional preimages of rho is 1 - o(1) by the Poisson limit for
        balls-in-bins with 2^256 balls and 2^256 bins. Uniformity range: all
        three FIPS 203 parameter sets, which differ only in the constant byte k.
      rigorous_support: >-
        The rigorous part is the counting: for ANY function F from a 256-bit
        domain to a 256-bit codomain, exhaustive search terminates in at most
        2^256 trials and the true d is found, so the ceiling 2^256 is
        unconditional and needs no heuristic at all. The heuristic is only about
        the CONSTANT (2^255 rather than 2^256) and about the count of spurious
        preimages, and it imitates the classical random-function model for
        Keccak-based hashes - the same model under which SHA3-512's own preimage
        resistance is claimed. The record's thresholds are stated under both
        conventions precisely so that the heuristic carries at most one bit.
      validation_plan: >-
        Sample at reduced output width, which is where this is checkable: define
        F_w(d) = SHA3-512(d || k)[0:w] for w in {2, 3, 4, 5} bytes, enumerate the
        full 2^{8w} image for 10^6 random d, and compare the empirical
        distribution of preimage-set sizes against the Poisson(1) prediction by
        a chi-square test over the counts 0, 1, 2, 3+, plus a tail check on the
        largest observed preimage class against its Poisson tail probability.
        Transfer assumption, stated explicitly: the result at w <= 5 bytes is
        transferred to w = 32 bytes on the random-function model for Keccak and
        on nothing else; the transfer is stated, not proved, and its failure
        would move the constant, never the 2^256 ceiling.
    - id: H2
      statement: >-
        The cost of one trial in a declared gate basis is exactly one
        Keccak-f[1600] permutation plus a 32-byte comparison, uniformly over all
        trials, with no amortisation available across trials beyond a fixed
        additive saving S_pre for the shared padded-suffix portion of the input
        block; that is, amortised gates per trial G(t) = 2^g - S_pre, with S_pre
        bounded by the gate count of the theta and rho steps of round 1 acting
        on the constant portion of the state.
      rigorous_support: >-
        Rigorous: G(t) <= 2^g, because shared work is computed once. Rigorous:
        the input (d || k) occupies 33 of the 72 rate bytes, so 39 rate bytes
        plus the entire 800-bit capacity are CONSTANT across all trials, and any
        gate depending only on constant bits is shared - this is the same
        subtree-amortisation accounting IDEA-20260829-bc9cc5 applies to AES's
        key schedule, applied here to Keccak's absorb. NOT rigorous: the SIZE of
        S_pre, which depends on Keccak's diffusion and is expected to be small
        because theta mixes the whole state in round 1. That expectation is
        stated so it cannot later be reported as a finding.
      validation_plan: >-
        Sample: instrument the counted circuit and mark every gate whose
        transitive input cone contains no bit of d; count them. This is an exact
        static count, not a statistical estimate, so the sample size is one
        circuit. Compare S_pre against the round-1 theta gate count as an upper
        bound the measurement must respect. Tail check: setting the variable
        input to zero bits must collapse G to zero, a forced value the counter
        must hit. Transfer: S_pre is a property of the counted implementation
        and basis and transfers to no other implementation; the SAME
        amortisation must be applied to the AES-256 control or the comparison is
        biased, and bc9cc5's R2 arm is the place that symmetry is enforced.

  target_complexity:
    time_exponent: >-
      2^255 evaluations of Keccak-f[1600], i.e. 255 + g gate-bits with
      g = log2(gates per permutation); equivalently 2^{256}/N for N targets
      (that variant is IDEA-20260906-e5e51c and is excluded here). The exponent
      is in the SEED LENGTH, 256 bits, and is completely independent of n, k, q,
      eta, the module rank, the ring, and every lattice quantity - which is the
      whole point.
    memory_exponent: >-
      2^0 words. O(1) memory at a single target: one 32-byte target, one state,
      one comparator. This is the first row on this lane's frontier with
      negligible memory at a competitive time. Against it, EV-MLKEM-020's
      committed lattice attack needs 2^180.924993 Z_q elements at ML-KEM-1024,
      randomly accessed.
    best_known: >-
      This program's committed best-known figure at ML-KEM-1024 is primal_bdd
      under RC.MATZOV at 270.7236234535225 log2 rop with 2^180.924993 elements
      of memory (EV-MLKEM-020). The comparison is therefore 255 + g against
      270.7236234535225 in gate-bits and 0 against 180.924993 in memory-bits.
      Whether the new row DOMINATES the old one depends entirely on g and is
      stated as a threshold, not as a claim.
    hidden_overhead: >-
      Honest disclosure, both directions. UNDERSTATED here: the 32-byte
      comparison and the loop control are charged as O(1) and not counted; the
      final verification keygen is charged once and not counted; routing, clock
      and yield are below the gate on both sides. OVERSTATED here: no
      amortisation across trials is claimed beyond H2's S_pre, and a bitsliced
      implementation processing many trials in parallel words may beat the naive
      per-trial count by a small factor. There is no o(1) term hiding a
      superpolynomial overhead, unlike the lattice side, where EV-MLKEM-020
      records the o(n) in 2^{0.2075 n + o(n)} as unbounded by anything this
      program holds - the asymmetry favours the seed attack and is stated.
    tradeoff_note: >-
      Time-memory: at a single target there is nothing to trade, but the map
      d -> rho is FIXED AND UNSALTED, so Hellman-style tables and the
      Biryukov-Shamir TM^2D^2 = N^2 family apply in full, with precomputation
      P = N/D for D targets. That is the multi-target record's subject and is
      named here only so that the frontier row is not misread as a single point.
      Parallelisation: embarrassing. 2^255 independent trials, no communication,
      no shared memory, no synchronisation - identical in form to AES key
      search, and structurally unlike the sieve, which is the single largest
      qualitative difference between the two rows and the reason any
      memory-aware or depth-aware metric moves the comparison toward this row.

  dominated_by: >-
    AT ML-KEM-512 AND ML-KEM-768: DOMINATED, decisively and by a wide margin.
    EV-MLKEM-020's committed primal_bdd figures 140.1994731076207 and
    200.9587149140538 are lower than 255 + g for any plausible g by roughly
    115 + g and 54 + g bits respectively, and the lattice attack is also cheaper
    on the data axis (one public key each). No memory charge closes a 115-bit
    gap at c < 1/3. The seed attack is Pareto-dominated at those two parameter
    sets and this record says so first.
    AT ML-KEM-1024: UNDETERMINED, and that is the finding. The comparison is
    (255 + g, 2^0 memory, 1 key) against (270.7236234535225, 2^180.924993
    elements, 1 key). Neither dominates on all axes for any g in the plausible
    range: the lattice row wins on time iff g > 15.72 and loses on memory
    always. Pareto check performed against every row this program holds on the
    relevant frontier - EV-MLKEM-020's eighteen enumeration-costed cells
    (219.04 to 745.26 bits, all above the cutoffs), its RC.MATZOV primal_bdd /
    primal_usvp / dual_hybrid triple at Kyber-512 (140.199473 / 143.771733 /
    145.528285 from VAL-CTRL-A), EV-MLKEM-015's pinned-estimator figures, and
    the external points recorded in the corpus (KN-LIT-110 MATZOV, KN-LIT-122
    AGPS20, KN-LIT-7617 Carrier et al.). Not checked, and named as such: any
    published attack figure this program has not filed, and Bernstein's
    "clumping" gate-count reduction for Kyber-512, which IDEA-20260829-bc9cc5
    records as a FAILED fetch and which is numerator work on the lattice side.
  sota_delta: >-
    At ML-KEM-512: -114.8 - g bits (worse), i.e. the seed attack is about 115
    bits more expensive than the committed best known; delta is negative and
    large and no reading rescues it.
    At ML-KEM-768: -54.0 - g bits (worse).
    At ML-KEM-1024: 15.7236234535225 - g bits, sign unknown until g is counted.
    A counted g of 14 would make the seed attack 1.7 bits CHEAPER than the
    committed best-known figure; a counted g of 18 would make it 2.3 bits more
    expensive. On the memory axis the delta is +180.924993 bits in the seed
    attack's favour at every parameter set, unconditionally.
    Against the category reference the delta is g - 16 bits at ML-KEM-1024 and
    is the entire non-lattice margin.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.35 overall, decomposed because the components have very different priors
    and averaging them would hide the structure. P(the FIPS 203 premise survives
    the KAT check) about 0.9 - I am confident in the recollection but I have not
    read the standard. P(the arithmetic yields a ML-KEM-1024 non-lattice margin
    below 6 bits, given the premise) about 0.8 - this follows from 256 being so
    close to 272 - 16. P(the seed attack is actually CHEAPER than the committed
    lattice figure, i.e. g < 15.72) about 0.3 - my recollection puts Keccak
    somewhat above AES in gate count, which would put g above 16. P(this
    quantitative observation is NOT already in the published literature) about
    0.25 - the qualitative fact is folklore and someone has very likely written
    the arithmetic down. The product of the last two, which is what "a new
    cheapest attack, credited to this program" would require, is under 0.1; but
    the record's PRIMARY deliverable is the ceiling and its threshold form,
    which survives at about 0.7 conditional on the premise. I would rather state
    a low number for the exciting reading than a high one for the safe reading.
