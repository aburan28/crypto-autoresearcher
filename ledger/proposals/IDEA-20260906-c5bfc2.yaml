    results: >-
      Relative to this repository the object is absent. Of the 33 proposals
      filed against RQ-MLKEM-003 and the 42 against RQ-MLKEM-001, every one
      tracks a lattice quantity, an estimator quantity, an implementation
      quantity, or (uniquely, IDEA-20260829-bc9cc5) the AES reference
      computation. None tracks a symmetric attack on ML-KEM itself, and the
      grep above shows the word Keccak does not occur in the lane.
      The two nearest records and why neither contains this. bc9cc5 makes the
      REFERENCE computation an object and re-prices AES key search; it is
      denominator work and explicitly declares "no attack, no algorithm". This
      record puts a new attack on the NUMERATOR and uses NIST's implied
      per-trial gate counts only as a comparison target. IDEA-20260828-faca4f
      adds a third attack family (Arora-Ge / Groebner) to the priced set, which
      is the same MOVE as this record but a different and purely lattice-side
      family; the symmetric family it does not consider.
      Relative to the outside world, this is very probably folklore in part.
      "A scheme's security is capped by its key-generation seed" is a standard
      design constraint, and NIST's own requirement that seeds match the
      security level exists because of it. What I have NOT been able to check,
      and what a reviewer with retrieval must check, is whether anyone has
      published the QUANTITATIVE form at FIPS 203 parameters - specifically the
      observation that ML-KEM-1024's non-lattice margin over category 5 reduces
      to log2(gates(Keccak-f[1600]) / gates(AES-256)) and is therefore of order
      one bit.
    verdict: >-
