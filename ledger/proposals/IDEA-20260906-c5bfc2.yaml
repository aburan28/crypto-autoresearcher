  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record, because the lane
      is heavily mined and variants arrive in new notation: primal uSVP and BDD
      embeddings and their blocksize laws (IDEA-20260829-353361, -db9f2b,
      -1ebebd); dual sieve plus FFT distinguishers and their score statistics
      (IDEA-20260805-5a4409, -a102ec, -bb7668, IDEA-20260808-0eb075,
      IDEA-20260816-ba5bd8, -725f05, IDEA-20260901-2f778b); sieve cost constants
      and calibration (IDEA-20260807-8fbc86, IDEA-20260805-f7c912, -fc6361);
      sieve memory and memory access pricing (IDEA-20260816-70e41d, -7bc28c,
      IDEA-20260821-46c09f); the module/ring structure discount
      (IDEA-20260816-b824af, -f4ce0b, -fdc8e8, -bd7f26); dimensions for free
      (IDEA-20260821-374af4); the oracle-call schedule (IDEA-20260821-41cd67);
      hybrid/MITM guessing splits (IDEA-20260901-67f498, -7eb9e1); algebraic
      attacks (IDEA-20260828-661a28, -faca4f); the quantum resource triple
      (IDEA-20260821-472aa2); and implementation side channels, which belong to
      RQ-MLKEM-002 and are excluded by that question's own constraints.
    tracked_object: >-
      THE KEY SEED d, and specifically the pair (|d| in bits, cost of one
      forward evaluation of the public map d -> rho) carried through the same
      gate-charging operation the lattice attack is carried through. Not the
      lattice, not the basis, not the estimator: the 256-bit object from which
      the entire ML-KEM secret is regenerated, together with the single public
      function that exposes it.
    lossiness: >-
      LOSSY, and provably so. The underlying state is the whole key: A (a k x k
      matrix over R_q, about 12 * 256 * k^2 bits), s and e (2 * 256 * k CBD
      coefficients), t_hat, and z. The projection retains 256 bits plus one
      scalar cost. It discards A entirely, discards the CBD structure of s and
      e, discards the module rank, discards q, and discards every geometric
      property the whole rest of this lane measures. The map is many-to-one in
      the strong sense that two schemes with completely different lattice
      parameters and the same seed length and expansion cost are the SAME object
      here - which is exactly why the object gives an attack that is blind to
      every lattice improvement and to every cost-model dispute in this lane.
      NOT A CHANGE OF COORDINATES: the discarded structure cannot be recovered
      from the retained pair, since the retained pair does not even determine k.
      THE COMPATIBILITY CONDITION, which is the part that makes the object work.
      What is discarded must be discarded compatibly with the target's
      operations. The operation here is FIPS 203 key generation itself, which is
      by construction a deterministic function of d alone; every discarded
      quantity is an OUTPUT of that function, not an input to it. So the
      retained coordinate propagates deterministically through the entire
      keygen: guess d, and everything discarded is regenerated exactly. That is
      the strongest possible form of the compatibility condition, and it is
      supplied by the standard rather than assumed.
    propagation: >-
      One step is one trial: one Keccak-f[1600] permutation on (d || k) and one
      32-byte comparison against the published rho. Propagation is exactly
      deterministic and the one-step cost is exactly countable - which is the
      reason this object can be priced to the gate while the lattice objects in
      this lane cannot. The cheap internal falsifier of the whole pipeline: on a
      FIPS 203 KAT vector, the forward step applied to the KAT's own d must
      reproduce the KAT's rho byte for byte. If it does not, Stage 0 has failed
      and nothing downstream is reportable.
    survival_score: >-
      Survives the entire attack, end to end, at full FIPS 203 scale, with no
      extrapolation and no toy instance - which no other object in this lane
      does. It dissolves at exactly two boundaries, both named: (i) it says
      nothing about IND-CCA advantage below full key recovery, since a
      distinguisher need not recover d; (ii) it is generic in Keccak, so it is
      silent about any structural attack on round-reduced Keccak-f[1600]
      constrained-input constrained-output problems, and if such an attack
      existed at full 24 rounds the ceiling would be lower still, not higher.
      Both boundaries move the conclusion in the same direction, which is stated
      so that the record cannot be read as conservative in the wrong direction.

  null_object_control: >-
    NULL-K, THE KAT REPRODUCTION NULL, AND IT IS LOAD-BEARING. Before any cost
    is reported, the forward map must reproduce a FIPS 203 known-answer public
    key's rho from that KAT's own d. OBJECT REMOVED: the search. OBJECT
    PRESERVED: the derivation. CAN IT FAIL: yes, and if it fails the premise in
    part (A) is refuted and the record's conclusion inverts (ceiling 2^512).
    NULL-B, THE BASIS NULL. Count the SAME circuit in two declared bases and
    report both. If g differs across bases by more than the T1-to-T2 gap of
    about 1.3 bits, then no threshold verdict may be stated without naming a
    basis, and the record must report the verdict as basis-conditional rather
    than pick the favourable basis.
    NULL-A, THE MATCHED-REFERENCE NULL. Count an AES-256 encryption core in the
    identical basis with the identical counter. If the counted AES-256 figure
    does not land near NIST's own implied 2^16 gates per trial (272 - 256), then
    the counter and NIST's constant do not live in the same accounting, T2 is
    uninterpretable, and the record reports that instead of a margin.
    NULL-S, THE SCRAMBLED-SCHEME NULL. Apply the identical pipeline to a
    hypothetical ML-KEM variant whose rho is NOT derived from d (independent
    32-byte draw). The pipeline must return a ceiling of 2^512 rather than
    2^256. If it returns 2^256 anyway, the pipeline is reading the seed length
    rather than the derivation structure and is not measuring what it claims.
    FORCED VALUES DECLARED BEFORE ANY MEASUREMENT, so that they cannot later be
    reported as findings: (1) the ceiling is 255 + g gate-bits at ALL THREE
    parameter sets, identical, because d is 32 bytes at all three; (2) it is
    therefore non-binding at ML-KEM-512 and ML-KEM-768 by construction, and any
    report suggesting otherwise is an arithmetic error; (3) charging memory can
    only move the comparison in the seed attack's favour, since its memory is
    O(1) and the sieve's is 2^180.924993 elements, so only the MAGNITUDE of
    c_seed carries information, never its sign.

  discriminated_from:
    - >-
      IDEA-20260829-bc9cc5 tracks the AES key-search REFERENCE COMPUTATION and
      re-prices the denominator 143 / 207 / 272; it declares "no attack, no
      algorithm, no complexity result claimed". This record adds a NUMERATOR row
      - an attack on ML-KEM - and uses NIST's implied per-trial gate counts only
      as the comparison target. The two are complementary and, notably, they
      interact: if bc9cc5's amortised-search arm lowers the reference, T2 gets
      HARDER for ML-KEM, not easier.
    - >-
      IDEA-20260828-faca4f prices a third attack family (Arora-Ge / Groebner)
      that this RQ had never costed. Same move, different family: faca4f's
      family is algebraic and lattice-adjacent and its cost depends on q, n and
      the secret distribution; this record's family is symmetric and depends on
      NONE of them, which is why it produces a ceiling rather than an estimate.
    - >-
      IDEA-20260821-472aa2 opens the quantum resource triple (coherent depth,
      QRAM width, QRAM query count) behind ML-KEM's quantum category assignment
      and uses depth-limited Grover AES-128 figures as a calibration key. This
      record is classical, produces a classical ceiling, and explicitly defers
      its own quantum row to that record's accounting rather than duplicating
      it.
    - >-
      IDEA-20260805-1d76e9 and H-MLKEM-dc51f5 study MULTI-TARGET key recovery
      via weak keys - selecting the luckiest secret from N keys by a norm order
      statistic - and concluded the luckiest key is not lucky enough. That lane
      selects among lattice instances; this record does not select at all and
      does not care whether a key is weak, because the seed search cost is
      independent of the secret's geometry.

