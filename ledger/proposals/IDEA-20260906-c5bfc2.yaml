idea:
  id: IDEA-20260906-c5bfc2
  question_id: RQ-MLKEM-003
  added: '2026-09-06'
  title: >-
    ML-KEM's key-recovery security has a NON-LATTICE CEILING that no lattice
    result can raise, and at ML-KEM-1024 the ceiling is within a couple of bits
    of the committed lattice figure. Under FIPS 203 key generation the entire
    secret key is a deterministic function of one 32-byte seed d, and the
    published rho is the first half of G(d || k), so key recovery is a
    single-block SHA3-512 preimage search of expected cost 2^255 Keccak-f[1600]
    permutations. Track the SYMMETRIC CEILING as the object, express it in the
    same gate units EV-MLKEM-020 already uses, and reduce the whole ML-KEM-1024
    non-lattice margin to ONE uncounted number - the gate count of one
    Keccak-f[1600] permutation
  class: mechanism

  claim: >-
    (A) THE STRUCTURAL FACT, STATED SO IT CAN BE CHECKED. Under FIPS 203
    conformant key generation, ML-KEM.KeyGen draws d uniformly from 32 bytes and
    everything else is deterministic: K-PKE.KeyGen(d) computes (rho, sigma) =
    G(d || k) with G = SHA3-512, expands the public matrix A from rho, samples s
    and e from sigma, and publishes ek = ByteEncode12(t_hat) || rho. The
    encapsulation key therefore PUBLISHES a 256-bit image of the 256-bit key
    seed under a fixed public function. Recovering the entire decapsulation key
    is exactly the problem: find d with G(d || k)[0:32] = rho. This is a
    single-block preimage search: a 33-byte input absorbs into one SHA3-512
    block (rate 72 bytes) and the 64-byte output needs no second squeeze, so one
    trial is exactly ONE Keccak-f[1600] permutation plus a 32-byte comparison.
    Expected trials 2^255; expected spurious preimages O(1), removed by one
    re-derivation of t_hat.
    (B) THE CONSEQUENCE, IN THIS PROGRAM'S OWN COMMITTED UNITS. Write g =
    log2(gates per Keccak-f[1600] permutation in a declared gate basis). Then
    the seed attack costs S = 255 + g gate-bits (average-trial convention) or
    S = 256 + g (full-keyspace convention, which is the convention NIST's own
    constants use: 143 - 128 = 15, 207 - 192 = 15, 272 - 256 = 16 implied gate
    bits per trial). EV-MLKEM-020 commits primal_bdd under RC.MATZOV at
    140.1994731076207 / 200.9587149140538 / 270.7236234535225 gate-bits against
    cutoffs 143 / 207 / 272. Therefore, with ZERO lattice computation, three
    forced thresholds fall out of the single number g, at ML-KEM-1024 only:
    T1, THE ATTACK THRESHOLD. The seed search is cheaper than the committed
    best-known lattice figure iff g < 15.7236234535225 (average convention) or
    g < 14.7236234535225 (full-keyspace convention).
    T2, THE CATEGORY THRESHOLD. ML-KEM-1024 meets its category-5 reference
    against this attack iff g >= 16 (full-keyspace convention, i.e. iff one
    Keccak-f[1600] costs at least as much as one AES-256 encryption in the same
    basis). The ENTIRE non-lattice margin of ML-KEM-1024 over category 5 is
    exactly g - 16 bits and depends on no lattice quantity whatsoever.
    T3, THE MEMORY-CHARGE THRESHOLD. Under EV-MLKEM-020's own T x M^c charge
    with log2 M = 180.924993, the seed attack (whose memory is O(1) words)
    overtakes the lattice attack at c_seed = (g - 15.7236234535225) /
    180.924993. That number is directly comparable with the committed
    c* = 0.00705473, and the ORDER of c_seed and c* decides whether, as memory
    is charged, ML-KEM-1024's lattice figure crosses the NIST cutoff before or
    after it crosses a purely symmetric attack.
    (C) WHAT DISCRIMINATES, AND BOTH OUTCOMES ARE USEFUL. EXPLANATION A,
    NON-BINDING CEILING - the counted g exceeds 17 and the ceiling sits clear of
    both the cutoff and the lattice figure; then ML-KEM-1024's margin is a
    genuinely lattice-limited quantity, the lane's numerator work is well
    targeted, and this record has supplied the upper bound that bounds it, which
    is itself new information (the margin cannot exceed g - 16 bits no matter
    how wrong core-SVP turns out to be). EXPLANATION B, BINDING CEILING - the
    counted g falls below 17, or below 15.72; then either ML-KEM-1024's
    category-5 claim fails against an attack containing no lattice at all, or
    the cheapest known attack on ML-KEM-1024 under RC.MATZOV gate accounting is
    not a lattice attack, and every proposal in this lane is optimising a
    quantity that is not the minimum.
    (D) THE SCOPE, WHICH IS NARROW AND SAID UP FRONT. The ceiling is 255 + g at
    ALL THREE parameter sets, so at ML-KEM-512 and ML-KEM-768 it sits roughly
    112 + g and 48 + g bits ABOVE their cutoffs and is not binding by any
    reading. Only ML-KEM-1024 is in play, and it is in play only because its
    committed margin is 1.276377 bits.
    (E) WHAT IS NOT CLAIMED. No break. No claim that ML-KEM-1024 fails any
    category - that depends on g, which this record does not know and does not
    guess. No claim about FIPS 203's text beyond a recalled reading that Stage 0
    must confirm against a conformant implementation. No status change to any
    committed record.

  mechanism: >-
    STAGE 0, CONFIRM THE STRUCTURAL PREMISE OR STOP. Everything rests on one
    reading of FIPS 203 that this program has never verified: that (rho, sigma)
    = G(d || k) with G = SHA3-512, that rho is published verbatim inside ek, and
    that d is 32 bytes. Primary NIST text is unreachable under this harness
    (RQ-MLKEM-003 provenance block: proxy CONNECT 403). The substitute is a
    CONFORMANT ARTIFACT rather than a document: take the FIPS 203 known-answer
    test vectors or any implementation that passes them, evaluate SHA3-512 on
    (d || k) for the KAT seeds, and check byte-for-byte that the first 32 output
    bytes equal the rho embedded in the KAT public key. That check is exact,
    cheap, and either passes or refutes the premise outright. If it refutes it -
    for example if a conformant KeyGen draws rho independently rather than from
    d - the record says so, the ceiling rises to 2^512, and the finding is that
    ML-KEM has a 512-bit rather than a 256-bit key-recovery ceiling.
    STAGE 1, COUNT g. Compile a bitsliced Keccak-f[1600] permutation to a fixed
    declared basis - {AND, XOR, NOT} with NOT free, and separately {AND, XOR} -
    and COUNT gates, not cycles. Report g with its basis. Count in the same
    declared basis an AES-256 encryption core, so that the comparison implied by
    T2 is made within one basis rather than across two. This is the whole
    measurement, and it is a counting problem with an exact answer.
    STAGE 2, THE THREE THRESHOLDS, CLOSED FORM. Evaluate T1, T2, T3 above at the
    counted g under both trial conventions, and report the six signed numbers
    plus c_seed against the committed c*. Nothing here is estimated; the inputs
    are one counted number and six committed constants.
    STAGE 3, THE PARETO ROW. Emit the seed attack as an explicit row on this
    lane's frontier with all three axes filled: time 255 + g gate-bits, memory
    O(1) words (single target), data one public key, parallelism embarrassing
    (2^255 independent trials, no communication, no memory traffic). The lane
    has never had a row with negligible memory at a competitive time, and the
    absence of one is why every memory-charging argument in the lane so far
    could only move the lattice attack against a cutoff, never against a rival
    attack.
    STAGE 4, THE QUANTUM ROW, EXPLICITLY DEFERRED AND SCOPED. Grover on the same
    preimage gives about 2^128 Keccak-f[1600] evaluations against a category-5
    quantum reference that is Grover on AES-256, so the quantum margin is again
    a ratio of two symmetric circuits under a MAXDEPTH constraint. This record
    does NOT compute it; it names IDEA-20260821-472aa2's depth-and-QRAM
    accounting as the place it belongs, and records the structural point that
    the quantum ceiling has the same shape as the classical one.

