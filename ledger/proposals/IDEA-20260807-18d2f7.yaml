    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that (A) is correct -- it is counting. 0.9 that the two-threshold
    separation in (C) survives review; the residual risk is in the
    spurious-collision count feeding the disambiguation term. 0.8 that the
    alpha = 1/3 balance is right as stated; it is a one-line optimisation with
    a stated assumption. 0.6 that the GGM argument in (E) survives an
    independent L12 audit -- that is the weakest link and the one most worth
    attacking, because a simulator there would close the lane cheaply and
    completely. 0.02, and this is the honest number rather than a hedge, that
    anyone finds a cheap large-order orbit invariant over F_p: the
    <lambda>-action is not a morphism of E, so there is no algebraic reason for
    an invariant rational function to exist, and that heuristic is recorded in
    the proof_search_map as the strongest available argument against the rung.
    The record's value is not that the rung is likely; it is that the rung is
    NAMED, PRICED and CORRECTLY RESOURCE-LABELLED instead of being absorbed
    into a closure it does not belong to.

