idea:
  id: IDEA-20260807-18d2f7
  question_id: RQ-EWALK-8fa147
  added: '2026-08-07'
  title: >-
    THE QUOTIENT LADDER, INCLUDING ITS TRIVIAL TOP AND ITS ONE OPEN RUNG:
    quotienting G by the FULL End(E)-action leaves exactly TWO classes and zero
    information about k, so the ladder is bounded above by uselessness and
    below by |Aut| <= 6; the two costs that bound it are INDEPENDENT and have
    DIFFERENT thresholds -- canonicalisation costs h per STEP and binds at
    h > 6, disambiguation costs h per COLLISION and does not bind until
    h ~ sqrt(N) -- and the gap between those thresholds is the lane's only
    exponent-moving target: an efficiently computable H-invariant on the
    ENCODING for H of order h >> 6 would give a sqrt(h) speedup, which at
    h = N^{2/3} is N^{1/6} total, and Shoup's bound does NOT forbid it because
    such an invariant is non-generic by construction
  class: mechanism

  claim: >-
    (A) THE TOP OF THE LADDER IS TRIVIALLY USELESS, AND SAYING SO CLOSES A
    FAMILY THAT KEEPS REAPPEARING. "Quotient the group by the endomorphism ring
    action" sounds like the natural maximal version of the automorphism trick.
    It is not, and the reason is one line. On a prime-order G every
    endomorphism acts as a scalar (H-ENDO-001), and Z is contained in every
    End(E), so the image of the full endomorphism action on G is ALL of Z/N.
    The orbit of any A != O under that action is therefore [c]A for every c,
    i.e. the whole of <A> = G \ {O}. THE QUOTIENT HAS EXACTLY TWO CLASSES: {O}
    and everything else. A walk on it carries zero bits about k, and no
    collision in it is a relation. The family is closed by counting, at zero
    compute, and the closure is worth recording precisely because the
    construction sounds maximal rather than degenerate.

    (B) THE LADDER, ENUMERATED, WITH THE REALISABILITY CONSTRAINT MADE
    EXPLICIT. The equivalences available are indexed by subgroups
    H <= (Z/N)^*, with A ~ [c]A for c in H. Orbits have size h = |H| (freely,
    since N is prime and c != 1 fixes no nonzero point). The ladder:
      h = 1     no quotient. Baseline 1.2533*sqrt(N).
      h = 2     H = {+-1}, the negation. Canon free. Gain sqrt(2). AVAILABLE ON
                EVERY CURVE.
      h = 4     H = mu_4, units of Z[i]. Requires D_0 = -4, j = 1728,
                p = 1 mod 4. Canon free (min over <= 4 encodings). Gain 2.
      h = 6     H = mu_6, units of Z[zeta_3]. Requires D_0 = -3, j = 0,
                p = 1 mod 3. Canon free. Gain sqrt(6) = 2.449. THIS IS THE TOP
                OF THE FREE-CANON LADDER (IDEA-20260807-ebcae6, Lemma 1).
      6 < h < N H = <lambda> for lambda of multiplicative order h. Realisable
                as an ACTION at cost: free if lambda is a unit (impossible for
                h > 6), a few field operations if lambda is the eigenvalue of
                an efficiently computable non-unit endomorphism (small |D_0|
                only), and about log2(N) group operations for an arbitrary
                scalar c. Canon by enumeration costs h evaluations per step.
                THE OPEN RUNG.
      h = N-1   H = (Z/N)^*, i.e. (A). Two classes, zero information.
    THE REALISABILITY CONSTRAINT IS OFTEN MISSED AND IS WORTH STATING: one
    cannot simply "choose H". To quotient by H one must be able to APPLY its
    elements, and the cheaply applicable ones are exactly the F_p-rational
    endomorphisms, which for a generic curve are the scalars (expensive,
    log2(N) group operations each) plus {+-1} (free).

    (C) THE TWO COSTS ARE INDEPENDENT AND THEIR THRESHOLDS DIFFER BY AN
    EXPONENT. This is the record's substantive content and it does not appear
    anywhere in the corpus.
      (COST 1) CANONICALISATION, PAID PER STEP. Every step must map a class to
        a class, which requires a canonical orbit element. By enumeration that
        is h evaluations per step. The gain is sqrt(h), so the charged ratio is
        h/sqrt(h) = sqrt(h) >= 1 and the quotient is a strict LOSS for every
        h >= 2 whose canon is not free. THRESHOLD: binds immediately, i.e. at
        h > 6 where free canon runs out.
      (COST 2) DISAMBIGUATION, PAID PER COLLISION. A class collision gives
        a_i P + b_i Q = [c](a_j P + b_j Q) for an UNKNOWN c in H. With h
        candidates one tries each and verifies [k]P = Q, costing h*log2(N)
        group operations ONCE per candidate collision, not per step. THRESHOLD:
        this stays below the walk's own sqrt(N) cost until roughly
        h ~ sqrt(N)/log2(N).
      SO THE TWO CONSTRAINTS ARE SEPARATED BY AN ENORMOUS GAP: h > 6 kills the
      step cost while h up to about sqrt(N) is affordable for the collision
      cost. EVERYTHING THE LANE'S CEILING RESTS ON IS COST 1 ALONE. Cost 2 is
      not the obstruction and never was, and any argument that conflates them
      is bounding the wrong quantity.

    (D) THE OPEN RUNG IS EXPONENT-MOVING, WHICH IS WHY THIS RECORD REFUSES TO
    CLOSE THE LANE. Suppose there existed an efficiently computable
    H-INVARIANT: a function f on G, computable in O(1) or O(polylog) field
    operations from the ENCODING of a single point, non-constant, with
    f([c]A) = f(A) for all c in H, for some H of order h. Then canon is free
    (use f as the class label), COST 1 vanishes, and the walk runs on
    (N-1)/h + 1 classes at 1.2533*sqrt(N/h) steps. Put h = N^{alpha}:
      total cost about N^{(1-alpha)/2}, plus COST 2 at about N^{alpha} once.
      Balancing (1-alpha)/2 = alpha gives alpha = 1/3 and total N^{1/3}.
    A cheap invariant for an orbit of size N^{1/3} would therefore give an
    N^{1/3} algorithm for prime-field ECDLP, an EXPONENT MOVE from 1/2 to 1/3.
    THIS IS NOT A CLAIM THAT SUCH AN f EXISTS. It is a statement of what the
    lane's one open rung is worth, stated so the rung is not quietly filled in
    with "closed".

    (E) SHOUP'S BOUND DOES NOT FORBID IT, AND THE REASON IS EXACTLY WHY THE
    LANE IS FILED AS INADMISSIBLE. In the generic group model the encodings are
    random labels, so a function of a single label that is constant on
    <lambda>-orbits would have to encode knowledge of the orbit structure,
    which a generic algorithm does not have; the only generic route is to
    compute the h orbit elements, which costs h. So the Omega(sqrt(N)) bound
    (KN-TECH-005) and the ceiling sqrt(|Aut|) are CONSISTENT with (D):
    the bound forbids a GENERIC cheap canon, and (D) asks for a NON-GENERIC
    one -- a function of the actual x-coordinates of the actual curve. That is
    resource R1 in the campaign's taxonomy (x-coordinates as field elements),
    not R3, and it is therefore OUTSIDE the closure of KN-FIND-b7e091, which
    covers incidence and endomorphism-image oracles only. THE HONEST READING OF
    LANE L6 IS THEREFORE: the R3-only part is closed at sqrt(6), and the one
    live question it points at is an R1 question that belongs to lanes L1/L11
    and should be handed to them with this framing attached.

    (F) THE NATURAL CANDIDATES FOR f FAIL, AND THE FAILURES ARE INSTRUCTIVE
    RATHER THAN EXHAUSTIVE.
      (F1) THE ORBIT SUM sum_{i<h} [lambda^i] A = [(lambda^h - 1)/(lambda - 1)] A
        = O identically, since lambda^h = 1 and lambda - 1 is invertible mod N.
        Constant, hence useless. Instantiated at h = 3 on a real curve
        (p = 4294967539, y^2 = x^3 + 7, N = 613557433) in EV-ENDO-001 /
        KN-FIND-009, where P + phi(P) + phi^2(P) returned the point at
        infinity.
      (F2) ANY SYMMETRIC FUNCTION OF THE ORBIT COMPUTED IN THE GROUP inherits
        the same problem for the additive symmetric functions, and the
        non-additive ones (products of x-coordinates, elementary symmetric
        polynomials in the x_i) are NOT computable without first computing the
        orbit -- which is COST 1 again. This is the loop the family keeps
        returning to.
      (F3) A MODULAR FUNCTION OR ISOGENY INVARIANT would be invariant under
        maps of CURVES, not of POINTS, and so does not separate points at all.
        This is the point where the lane hands off to L10/RQ-CLGP-b99df5, and
        the hand-off is a scope boundary rather than a failure.
      NOT EXHAUSTIVE, AND THE RECORD SAYS SO. F1-F3 are the candidates a
      session naturally reaches for. The absence of a cheap invariant is an
      OPEN PROBLEM here, not a theorem, and calling it a theorem would be
      exactly the premature closure docs/inventor-protocol.md forbids.

    (G) WHAT EACH POSSIBLE OUTCOME OF PURSUING (D) WOULD MEAN. Stated so the
    rung is a research object rather than a gesture:
      OUTCOME 1 -- someone exhibits a cheap non-constant <lambda>-invariant on
        the encoding for some h >> 6. Exponent-moving; the largest possible
        result in this campaign; would require independent review at
        review-breakthrough before any description.
      OUTCOME 2 -- someone proves no such invariant exists for a stated class
        of computations (e.g. low-degree rational functions of x). Then the
        sqrt(6) ceiling becomes a theorem rather than a cost argument, and the
        lane closes at the section-4 standard with a genuinely strong
        obstruction.
      OUTCOME 3 -- neither. The rung stays open and is carried forward as a
        named open problem with its payoff computed, which is strictly better
        than the current state where it is not written down at all.

  resource_label: >-
    R3 for the ladder and the closures (End(E) as a ring; its unit group and
    the multiplicative orders of non-unit eigenvalues). The OPEN RUNG in (D) is
    explicitly R1 (x-coordinates as field elements) and is labelled as such,
    which is the whole point of (E) -- the lane's live question is not in the
    lane's own resource.

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    THE LADDER AND ITS CLOSURES ARE INADMISSIBLE; THE OPEN RUNG IS NOT, AND THE
    RECORD SEPARATES THEM RATHER THAN AVERAGING THEM. Everything in (A), (B),
    (C) and (F) applies endomorphisms to points of a prime-order G, which is
    Oracle D of KN-FIND-b7e091 -- generic-group simulable, closed at exponent
    1/2 (KN-TECH-005). The overall verdict for this record is therefore
    `inadmissible_generic_group`, and it is filed as a recorded closure of the
    full-ring-quotient family with its obstruction named. BUT (D)/(E)
    identify an object -- a cheap H-invariant computed from the x-coordinate
    ENCODING -- that is NOT generic-group simulable, precisely because in the
    GGM the labels are random and no function of one label can be constant on
    orbits without knowing the orbit structure. That object consumes R1 and
    escapes KN-FIND-b7e091's closure, which covers incidence and
    endomorphism-image oracles and not encoding-dependent invariants. It is
    therefore an ADMISSIBLE target that this lane has surfaced and cannot
    pursue, and the correct disposition is a hand-off to the R1 lanes with the
    payoff calculation attached.

  discriminated_from:
    - >-
      IDEA-20260807-ebcae6 (this batch), which derives the sqrt(|Aut|) ceiling
      from the three admissibility conditions and bounds |Aut| <= 6. That
      record's quantifier_order block explicitly declines to prove that no
      instance-dependent O(1) canonicalisation exists and names that as its
      escape hatch. THIS record is that escape hatch developed into a research
      object: the ladder it sits on, the two-threshold cost analysis showing
      only COST 1 binds, the exponent calculation showing the payoff is
      N^{1/3}, and the GGM argument showing Shoup does not forbid it. The two
      records must be read as a pair and neither contains the other.
    - >-
      IDEA-20260802-005, which MEASURES the crossover in orbit size using a
      free-representative calibrator and concludes the endomorphism lane closes
      at constant-factor sqrt(|Aut|). That proposal's own mechanism text says
      "the only general way to canonicalize an orbit of size r is to generate
      it". THE WORD "GENERAL" IS LOAD-BEARING AND THIS RECORD PICKS IT UP: a
      non-general, curve-specific canonicalisation is exactly what (D) asks
      for, and IDEA-20260802-005 neither excludes it nor computes what it would
      be worth. Its outcome (c) -- "some representative is cheaper than orbit
      enumeration for that lambda" -- is the same object seen from the
      measurement side; this record gives it a payoff and a resource label.
    - >-
      KN-FIND-009 / EV-ENDO-001, whose (F1) instance this record cites. Those
      records use the degeneracy to falsify a lattice prediction; this record
      uses it to close one canonicalisation route, and explicitly does not
      claim the route enumeration is exhaustive.
    - >-
      KN-FIND-b7e091, which closes incidence and endomorphism-image oracles.
      (E) states precisely why the object in (D) is outside that closure, so
      this record does not contradict it and does not extend it either.
    - >-
      Lane L12 / RQ-GGMB-6eaabc, the campaign's simulability auditor. The GGM
      argument in (E) is a claim about a NEW oracle class -- an
      encoding-dependent orbit invariant -- and it is exactly the kind of claim
      L12 exists to check. This record should be read as filing a request to
      that lane, not as settling it.

  object_first_candidate:
    tracked_object: >-
      THE ORBIT-LABEL FUNCTION f: the class label a walk uses, considered as an
      object in its own right with two attributes -- the subgroup H whose
      orbits it is constant on, and the cost of evaluating it from a single
      point's encoding. The ladder in (B) is the enumeration of this object.
    lossiness: >-
      LOSSY BY DESIGN AND THE LOSS IS THE ADJUSTABLE PARAMETER: f discards
      log2(h) bits, exactly the choice of orbit element. The ladder is a family
      of projections of increasing lossiness, from h = 1 (no loss, no gain --
      the change-of-coordinates degenerate case the lossy-projection test
      warns about) to h = N-1 (total loss, no information -- the degenerate
      case at the other end, which is claim (A)). BOTH ENDS ARE USELESS AND FOR
      OPPOSITE REASONS, which is an unusually clean illustration of why the
      test has two clauses.
    propagation: >-
      A class label propagates deterministically if and only if it is
      computable from a single point's encoding, i.e. if and only if COST 1 is
      O(1). That is precisely condition (D). So the lossy-projection test's
      compatibility clause and the lane's cost question are THE SAME
      CONDITION, and recognising that is what turns the cost analysis into an
      object-first statement rather than an accounting exercise.
    survival_score: >-
      The ladder survives every implementation choice and every curve. The
      free-canon rungs die above h = 6 over F_p (they survive further over
      extension and subfield curves, where Frobenius enlarges the available
      maps -- KN-LIT-042's sqrt(2d) and sqrt(2m) factors for subfield and
      Koblitz curves). The open rung survives as an open problem and would die
      the moment either a cheap invariant or an impossibility proof for a
      stated computation class appears.

  mechanism: >-
    ZERO COMPUTE. The deliverable is a written enumeration and two derivations,
    plus one optional cheap check.

    PART 1 -- THE LADDER (B), with each rung carrying: the subgroup H, its
    order h, the realisability of its action and at what cost, the
    canonicalisation cost, the resulting gain, and the curve condition
    (D_0 value, congruence on p) under which it exists.

    PART 2 -- THE TWO-THRESHOLD COST ANALYSIS (C), with the per-step and
    per-collision accounting written separately and their thresholds computed:
    h > 6 for COST 1 and about h ~ sqrt(N)/log2(N) for COST 2.

    PART 3 -- THE PAYOFF CALCULATION (D): balance (1-alpha)/2 against alpha to
    get alpha = 1/3 and a total N^{1/3}. State the memory position too: the
    walk is still O(1) per processor plus a distinguished-point table, so an
    N^{1/3} time with O(1) memory would be a strictly better Pareto point than
    anything currently on the prime-field frontier -- which is a reason to take
    the rung seriously and also a reason to be extremely sceptical of any
    claimed cheap invariant.

    PART 4 -- THE GGM ARGUMENT (E), written carefully enough for lane L12
    (RQ-GGMB-6eaabc) to audit: state the oracle class ("returns a label
    constant on <lambda>-orbits, computable from one encoding"), and either
    exhibit a simulator or argue none exists. THIS RECORD ARGUES NONE EXISTS
    AND FLAGS THE ARGUMENT AS REQUIRING INDEPENDENT AUDIT, because a
    simulability result here would close the rung and would be the cheapest
    possible way to finish the lane.

    PART 5 -- THE CANDIDATE FAILURES (F), with (F1) verified symbolically and
    already instantiated on a real curve in EV-ENDO-001.

    OPTIONAL PART 6 (minutes of compute, and it is a known-answer check rather
    than an experiment). On a toy curve, verify by direct enumeration that:
    the full-scalar-action quotient has exactly 2 classes; the <lambda>-orbits
    for a random lambda have size ord(lambda) and partition G \ {O} evenly; and
    the orbit sum is O for every orbit. Each is a one-line prediction of the
    derivations and each is checkable in seconds with harness/toycurve.py.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/, analysis/ on 2026-08-07 for
      "quotient by the endomorphism", "Z[phi]", "orbit invariant", "orbit
      sum", "canonical representative", "N^{1/3}", "exponent 1/3",
      "class label". Records read in full: IDEA-20260802-005, H-ENDO-001,
      EV-ENDO-001, KN-FIND-009, KN-FIND-b7e091, KN-TECH-005, KN-TECH-018,
      KN-LIT-042, RQ-GGMB-6eaabc, DECOMPOSITION.md sections 2 and 4.
    results: >-
      The full-ring quotient's triviality is not stated anywhere. The
      two-threshold separation between per-step canonicalisation and
      per-collision disambiguation is not stated anywhere -- IDEA-20260802-005
      analyses the per-step cost only and does not mention disambiguation. The
      N^{1/3} payoff calculation appears nowhere. The observation that a cheap
      orbit invariant is non-generic and therefore outside KN-FIND-b7e091's
      closure appears nowhere; KN-FIND-b7e091's own "non-simulable but
      non-useful oracles" section lists first-jet and elliptic-net oracles and
      does not consider orbit-label oracles at all. "orbit sum" as a
      canonicalisation candidate: zero hits; the identity itself appears only
      at eigenvalue level in KN-FIND-009.
    verdict: >-
      ADAPTATION. Every ingredient is elementary -- orbit counting, a birthday
      law, a balance calculation, and a GGM simulability argument -- and none
      is claimed as new mathematics. What is new to this program is the
      assembly: the ladder with both degenerate ends, the two-threshold
      separation identifying COST 1 as the sole binding constraint, the
      exponent payoff of relieving it, and the resource re-labelling that moves
      the lane's one live question from R3 to R1. No claim of novelty against
      the external literature is made; whether the "cheap orbit invariant"
      question has been posed and answered elsewhere is UNVERIFIED and locating
      that is the first thing anyone pursuing the rung should do.

  null_object_control: >-
    MANDATORY EVEN THOUGH THIS IS A DERIVATION. THE MATCHED NULL IS THE LADDER
    ITSELF EVALUATED AT ITS OWN DEGENERATE ENDS, and the decay parameter is h.
    At h = 1 the projection loses nothing and gains nothing -- the
    change-of-coordinates case. At h = N-1 it loses everything and gains
    nothing -- claim (A). A derivation that predicted a gain at EITHER end
    would be manufacturing an effect, so the derivation must be checked to
    produce gain exactly 1.0 at h = 1 and to produce ZERO USABLE INFORMATION at
    h = N-1. THE DECAY REQUIREMENT: the net charged gain sqrt(h)/h = 1/sqrt(h)
    must DECAY monotonically to 0 as h grows under enumerative canon, and must
    GROW as sqrt(h) under free canon; a cost model in which the gain does not
    respond to h in opposite directions under the two canon assumptions is not
    modelling the canonicalisation cost at all, and is the canonical artifact
    tell for this record. SECOND NULL, for Optional Part 6: the enumeration
    must recover exactly 2 classes for the full-scalar quotient and exactly
    (N-1)/h + 1 for <lambda>, on a curve where both are independently
    computable.

  assumptions:
    - >-
      N prime, so scalars c != 1 fix no nonzero point, orbits are free and
      equal-sized, and lambda - 1 is invertible in (F1). Over composite N the
      whole analysis changes (Pohlig-Hellman applies and partial information is
      recoverable), and nothing here transfers.
    - >-
      p > 3 and Aut taken over F_p, so |Aut| <= 6 (IDEA-20260807-ebcae6
      Lemma 1). Over extension fields, subfield curves and Koblitz curves the
      available maps are larger and the ladder's free-canon top is higher
      (KN-LIT-042 reports sqrt(2d) and sqrt(2m)-type factors there); those
      cases are OUT OF SCOPE and the record says so rather than implying the
      bound is universal.
    - >-
      [open] The candidate-invariant failures in (F) are NOT exhaustive. This
      is stated as an assumption because treating it as a theorem would be
      premature closure, and because the record's main forward-looking claim
      depends on the question being genuinely open.
    - >-
      The N^{1/3} balance in (D) assumes the disambiguation cost is paid once
      per candidate collision and that the number of candidate collisions is
      O(1) in a distinguished-point run. If the quotient produces many spurious
      collisions the balance shifts and alpha falls; the calculation is
      indicative of the SHAPE of the payoff, not a complexity claim, and it is
      labelled that way.
    - >-
      Shoup's bound (KN-TECH-005) holds, which is what makes (E)'s consistency
      argument necessary rather than optional.

  proof_search_map:
    bottleneck: >-
      COST 1, the per-step canonicalisation. The two-threshold analysis exists
      to identify it, and it is the exact step whose removal changes the
      exponent rather than the constant. Nothing else in the lane is a
      bottleneck in the sense that relieving it changes an exponent.
    baseline_embedding:
      parameter_slice: >-
        h = 2, H = {+-1}. The ladder must reproduce the negation walk at
        1.2533*sqrt(N/2) = 0.886*sqrt(N), which is this program's frozen
        baseline convention (KN-TECH-006).
      reproduction_check: >-
        Symbolic: sqrt(pi/2)/sqrt(2) = sqrt(pi)/2 = 0.8862269..., compared
        digit-for-digit with the 0.886 convention and with the
        0.8862269254527579 recorded as `negation` in the staged artifact
        inputs/h100_session/h040_rho_const.json. Optional Part 6 adds the
        enumerative check that the h = 2 quotient really has (N-1)/2 + 1
        classes.
    observation_collision:
      observable: >-
        The pair (h, achieved speedup).
      distinct_preimage_search: >-
        A REAL AND IMPORTANT COLLISION: h = 6 with free canon and h = 36 with
        canon costing 6 evaluations per step have the SAME charged cost --
        sqrt(6) gain against a 6x step cost in the second case gives
        sqrt(36)/6 = 1, versus sqrt(6)/1 = 2.449 in the first, so in fact they
        differ; the genuine collision is between h = 4 with free canon (gain 2)
        and h = 16 with a canon costing 2 evaluations (gain 4/2 = 2). Two very
        different quotients with identical charged gain. The separating
        observable is the DISAMBIGUATION cost h per collision, which differs by
        a factor 4, and it is reported alongside because a ladder that ranks
        rungs by charged step cost alone would call these equivalent when their
        collision-side behaviour differs.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "H is a group of automorphisms of
          E" to "H is any subgroup of (Z/N)^* admitting an efficiently
          computable invariant", and ask for a strict inward improvement --
          a rung with h > 6 and free canon -- rather than mere feasibility.
        predicted_gain: >-
          sqrt(h). At h = N^{1/3} the total becomes N^{1/3}, an exponent move.
          This is the transform the lane's whole remaining value sits in and it
          is stated with its prerequisite (the invariant) unmet.
      - transform: representation_reduction
        proposed_object: >-
          Move "is there a cheap canonicalisation" from the group into the
          FUNCTION FIELD: does there exist a low-degree rational function on E
          invariant under the <lambda>-action on points? Encoding obligation:
          the function must be evaluable from x alone. Completeness/soundness:
          it must be non-constant and constant on orbits. Transfer: it must be
          computable without knowing the orbit. Cost-loss: its evaluation cost
          must be O(polylog).
        predicted_gain: >-
          Reformulates the open rung as a concrete question about invariant
          rational functions of a large-order translation-like action, which is
          a question with a literature and is answerable in principle -- and
          whose likely answer is negative, since the <lambda>-action is not
          algebraic on E (it is a group-theoretic action on points, not a
          morphism), which is itself the sharpest available heuristic against
          the rung and is recorded here as such.
    quantifier_order: >-
      CLOSURE CLAIMED: FOR ALL prime-order G and FOR ALL H <= (Z/N)^* with
      |H| = h, quotienting by H yields (N-1)/h + 1 classes, and at h = N-1
      exactly 2, carrying zero information about k.
      COST CLAIM: FOR ALL H whose canonicalisation is by enumeration, the
      charged gain is 1/sqrt(h) <= 1.
      NOT CLAIMED, EXPLICITLY: FOR ALL H THERE IS NO cheap invariant. The
      record asserts only that F1-F3 fail, and states the general question as
      OPEN. Getting this quantifier wrong in the permissive direction would
      turn a legitimate open problem into a fabricated closure, which is the
      single most likely way this record could do harm.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The full-ring quotient is trivial; the free-canon ladder tops out at
        h = 6 over F_p; enumerative canon is a strict loss; and relieving the
        canonicalisation cost at h = N^{1/3} would give N^{1/3} total." It can
        NEVER certify that no cheap invariant exists, and any summary reading
        it that way is wrong.
      nearby_object_control: >-
        THE KOBLITZ / SUBFIELD CURVE AND THE EXTENSION-FIELD CASE, where
        Frobenius supplies cheaply computable maps of larger order and
        KN-LIT-042 records sqrt(2d) and sqrt(2m)-type factors that exceed
        sqrt(6). The argument MUST fail to bound those, and it does, because
        the |Aut| <= 6 bound is specific to End_{F_p}(E) being an imaginary
        quadratic order. Note what this control shows: THE OPEN RUNG IS NOT
        EMPTY IN GENERAL -- on subfield curves a cheaply computable large-order
        map exists and the corresponding speedup is real and classical. Over
        F_p it does not. That contrast is the strongest available evidence that
        the rung is a genuine question about F_p rather than a category error.
    proof_obligations:
      - claim: The full endomorphism action on prime-order G has image all of Z/N.
        responsibility: correctness
      - claim: Its quotient has exactly 2 classes and carries zero information.
        responsibility: correctness
      - claim: <lambda>-orbits are free of size ord(lambda) for N prime.
        responsibility: correctness
      - claim: Enumerative canon gives charged gain 1/sqrt(h).
        responsibility: runtime
      - claim: Disambiguation costs h per collision, not per step.
        responsibility: runtime
      - claim: Balancing gives alpha = 1/3 and total N^{1/3}.
        responsibility: size
      - claim: >-
          An encoding-dependent orbit-label oracle is not GGM-simulable.
        responsibility: interface
      - claim: The h = 2 rung reproduces the 0.886 baseline convention.
        responsibility: baseline
      - claim: >-
          The non-existence of a cheap invariant is NOT claimed.
        responsibility: scope

  predictions:
    - metric: number of classes under the full endomorphism-action quotient
      direction: different
      minimum_effect: >-
        EXACTLY 2, on every prime-order instance. A single toy instance with
        more than 2 falsifies (A) and would mean the scalar image is not all of
        Z/N, which would contradict Z being in End(E).
    - metric: >-
        charged gain of an enumeratively canonicalised <lambda>-quotient, as h
        varies
      direction: lower
      minimum_effect: >-
        1/sqrt(h), decaying monotonically; below 1 for every h >= 2, and below
        0.5 by h = 4. A gain that does not decay with h is the artifact tell.
    - metric: orbit sum sum_{i<h} [lambda^i] A
      direction: different
      minimum_effect: >-
        The point at infinity, for every A and every lambda of order h > 1.
        One counterexample refutes (F1). One instance at h = 3 is already
        computed and recorded (EV-ENDO-001).
    - metric: >-
        derived total exponent when canonicalisation is free at h = N^{alpha}
      direction: lower
      minimum_effect: >-
        (1-alpha)/2 for the walk plus alpha for disambiguation, minimised at
        alpha = 1/3 giving 1/3. THIS IS A CONDITIONAL DERIVATION WITH AN UNMET
        PREREQUISITE and is recorded as the rung's payoff, never as an
        achieved or achievable complexity.
    - metric: >-
        existence of a GGM simulator for an encoding-dependent orbit-label
        oracle
      direction: different
      minimum_effect: >-
        This record predicts NONE EXISTS and flags the prediction for lane L12
        audit. A simulator would CLOSE the rung and finish the lane, which
        makes finding one the highest-value cheap action available and is why
        the prediction is stated in falsifiable form rather than assumed.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is the entire primary deliverable): write
      the ladder, the two-threshold analysis, the payoff calculation, the GGM
      argument, and the candidate failures, with the quantifier discipline of
      the proof_search_map enforced -- in particular, the open rung is written
      as OPEN.
      STAGE 1 (minutes, optional known-answer checks): on one toy curve,
      enumerate and verify (i) the full-scalar quotient has 2 classes,
      (ii) <lambda>-orbits have size ord(lambda) and partition G \ {O},
      (iii) the orbit sum is O for every orbit, (iv) the h = 2 quotient has
      (N-1)/2 + 1 classes. Each is a one-line prediction and each fails loudly
      if wrong.
      STAGE 2 (zero compute): file the GGM question with lane L12
      (RQ-GGMB-6eaabc) as an explicit oracle-class audit request, and file the
      invariant-rational-function question with the R1 lanes (L1
      RQ-ICINV-475b5e, L11 RQ-MODEL-e61cb2) with the payoff attached.
      THE CHEAPEST DECISIVE ACTION IS STAGE 2's L12 REQUEST: a simulability
      result there costs no compute and would close the rung, finishing lane
      L6 at the section-4 standard with a genuinely strong obstruction rather
      than a cost argument.
    controls:
      - h = 1 degenerate end: gain must be exactly 1.0
      - h = N-1 degenerate end: information must be exactly zero
      - h = 2 baseline reproduction against the 0.886 convention
      - Koblitz/subfield nearby-object control: the argument must NOT bound it
      - enumerative-canon decay: gain must fall as 1/sqrt(h)
    required_metrics:
      - class count per rung, verified by enumeration at toy size
      - orbit size and freeness per rung
      - canonicalisation cost and disambiguation cost, stated separately with
        their units (per step versus per collision)
      - the derived gain per rung, free-canon and enumerative-canon columns
        reported separately and never mixed
      - the curve condition (D_0, congruence on p) each rung requires
      - explicit OPEN/CLOSED status per rung, with the open one labelled R1

  falsification_conditions:
    - >-
      A prime-order instance whose full-endomorphism quotient has more than 2
      classes. (A) is false.
    - >-
      A <lambda>-orbit of size other than ord(lambda), or one fixing a nonzero
      point. The freeness argument is false and the whole ladder's class counts
      are wrong.
    - >-
      A counterexample to the orbit-sum identity. (F1) is false.
    - >-
      A GGM simulator for the encoding-dependent orbit-label oracle. (E) is
      false, the open rung is CLOSED, and lane L6 finishes -- which this record
      names as the most valuable possible refutation of itself.
    - >-
      An efficiently computable non-constant <lambda>-invariant on the encoding
      for h >> 6. (D)'s prerequisite is met, the ceiling of
      IDEA-20260807-ebcae6 is void, and the result requires independent
      review-breakthrough handling before any description (AGENTS.md rule 12).
    - >-
      The h = 2 rung failing to reproduce the 0.886 convention. The ladder's
      arithmetic is wrong and every rung is void.

  confounders:
    - >-
      CONFLATING THE TWO COSTS. Almost every informal treatment of "why can't
      we quotient by more" mixes the per-step canonicalisation with the
      per-collision disambiguation. They have thresholds separated by an
      exponent and mixing them bounds the wrong quantity. This is the record's
      main contribution and also its main way of being misread.
    - >-
      READING THE PAYOFF AS A RESULT. The N^{1/3} in (D) is conditional on an
      object that does not exist as far as this record knows. Quoting it
      without its prerequisite would be a serious overclaim, and it is flagged
      here, in interpretation_limits, and in the method_ceiling.
    - >-
      SCOPE CREEP TO EXTENSION FIELDS. On subfield/Koblitz curves cheap
      large-order maps DO exist and the corresponding speedups are classical
      (KN-LIT-042). Reading the F_p ceiling as universal would be wrong in a
      way that is easy to check and easy to miss.
    - >-
      SPURIOUS-COLLISION COUNT. The (D) balance assumes O(1) candidate
      collisions in a DP run. A quotient that generates many spurious
      collisions shifts alpha downward and the payoff with it.
    - >-
      REALISABILITY. "Choose H" is not free: applying an arbitrary scalar costs
      log2(N) group operations, so a ladder rung that ignores the cost of
      APPLYING the action is measuring a fiction.

  interpretation_limits:
    - >-
      ANY MEASURED EXCESS OVER sqrt(|Aut|) IS A SUSPECTED INSTRUMENT ARTIFACT
      UNTIL A NULL CONTROL SAYS OTHERWISE (RQ-EWALK-8fa147 decision_target).
      This applies with particular force here: a claimed cheap invariant would
      manifest exactly as such an excess, and the correct first response is the
      matched-seed null and the enumeration instrument of
      IDEA-20260807-cbbcfd, not excitement.
    - >-
      THE N^{1/3} FIGURE IS CONDITIONAL ON AN OBJECT THAT IS NOT KNOWN TO
      EXIST. It is the value of an open rung, not a complexity claim, not an
      algorithm, and not a target this record proposes to pursue. It is written
      down so the rung is not silently closed.
    - >-
      The closures in (A), (C) and (F1) are scoped to prime-order subgroups
      over prime fields with p > 3. Extension fields, subfield curves,
      composite orders and supersingular curves over F_{p^2} are all outside
      and behave differently.
    - >-
      (F) is NOT an exhaustive enumeration of candidate invariants, and the
      record states this as an assumption rather than a theorem. A count of
      failed candidates is a fatigue report under
      docs/inventor-protocol.md section 4, and this record avoids that by
      giving the ladder, the thresholds and the payoff instead.
    - >-
      Nothing here moves a hypothesis status, closes a goal, or constitutes an
      attack. The lane's R3 part is bounded; its R1 hand-off is open.

  reachability_gate: >-
    TWO DIFFERENT GATES, AND SEPARATING THEM IS PART OF THE POINT.
    (i) FOR THE FREE-CANON RUNGS (h = 4, 6): unreachable in the strong sense.
    |Aut| is fixed by D_0, which by T4 is fixed by the isogeny class, so from a
    class with D_0 not in {-3, -4} no isogeny walk of any length reaches a
    curve with a larger automorphism group -- not expensive, impossible. Cost
    of construction when generating curves for measurement: O(1) rejection
    sampling on p mod 3 or p mod 4.
    (ii) FOR THE OPEN RUNG: the reachability question does not arise at all,
    because the object sought is a FUNCTION on a fixed curve, not another
    curve. That is a meaningful structural difference from the rest of the
    campaign, where T5 is the crux: the lane's one live question is entirely
    local, needs no isogeny walking, and would apply to ANY prime-field curve
    including the target's own. It is therefore the only object surfaced in
    this lane whose value is not gated by the class invariants -- which is
    precisely why it is worth handing to the R1 lanes rather than dropping.

  target_complexity:
    time_exponent: >-
      1/2 for every realisable rung, i.e. UNCHANGED, with the constant
      1.2533/sqrt(h) and h <= 6 over F_p. CONDITIONALLY, if a free
      canonicalisation existed at h = N^{alpha}, the total would be
      N^{max((1-alpha)/2, alpha)}, minimised at alpha = 1/3 giving N^{1/3}.
      THAT SECOND SENTENCE IS CONDITIONAL ON AN UNMET PREREQUISITE and is not
      a claim.
    memory_exponent: >-
      O(1) per processor plus the distinguished-point table, for every rung
      including the hypothetical one -- which is what would make an N^{1/3}
      time with O(1) memory a strictly better Pareto point than anything on the
      prime-field frontier, and is a reason for scepticism proportional to the
      prize.
    best_known: >-
      0.886*sqrt(N) fully charged parallel rho with DPs and negation
      (KN-TECH-001, KN-TECH-006), with the automorphism discount on CM curves
      (KN-TECH-018, KN-LIT-042). Nothing here improves it and nothing is
      claimed to.
    hidden_overhead: >-
      The conditional N^{1/3} hides its entire content in the phrase "if
      canonicalisation were free", which is the unmet prerequisite. It also
      hides the assumption of O(1) candidate collisions. Both are disclosed
      here and in interpretation_limits, and neither may be dropped in any
      downstream citation.
    tradeoff_note: >-
      The ladder IS a tradeoff curve: space reduction sqrt(h) against
      canonicalisation cost per step and disambiguation cost per collision. The
      finding is that the curve is dominated by its h <= 6 endpoint over F_p
      under enumerative canon, and that the only way off that endpoint is to
      change the canonicalisation cost, not the space reduction. Parallelisation
      is unaffected throughout, since every rung's class map is memoryless.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK this record
    mounts none and every rung it can realise is dominated by, or equal to, the
    existing frontier: parallel rho with DPs at 0.886*sqrt(N) time and O(1)
    memory (KN-TECH-001, KN-TECH-006); the automorphism-discounted CM variant
    at 1.2533*sqrt(N/|Aut|) (KN-TECH-018, KN-LIT-042), which is the h = 4 and
    h = 6 rungs and is therefore the frontier row this record DESCRIBES rather
    than beats; BSGS at sqrt(N) time and sqrt(N) memory; kangaroo and the
    Galbraith-Ruprai equivalence-class interval variant at a heuristic
    1.36*sqrt(N) (KN-LIT-7437), for the different interval problem. The
    enumerative-canon rungs are dominated by plain rho by a factor sqrt(h). On
    data/queries nothing is consumed. The hypothetical free-canon rung at
    h = N^{1/3} would dominate every row above on time at equal memory -- and
    it is hypothetical, which is exactly why it is recorded as an open question
    and not as a result.
  sota_delta: >-
    ZERO against every attack baseline; nothing is computed and nothing is
    improved. Stated quantitatively as a structural delta: 1 family closed by
    counting (the full-ring quotient, exactly 2 classes); 1 cost separation
    with thresholds differing by an exponent (h > 6 for per-step
    canonicalisation versus about h ~ sqrt(N)/log2(N) for per-collision
    disambiguation), where the corpus previously analysed only the former; 1
    conditional payoff calculation (alpha = 1/3, total N^{1/3}, O(1) memory)
    for the single open rung; 1 resource re-labelling that moves the lane's
    live question from R3 to R1 and therefore outside KN-FIND-b7e091's closure;
    and 2 concrete hand-offs, to lane L12 for a simulability audit and to the
    R1 lanes for the invariant-function question.

