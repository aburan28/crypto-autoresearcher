  assumptions:
    - >-
      Exact-arithmetic facts established in this session on the frozen
      parameters and re-derivable in ten lines: for both Oakley curves,
      b^{2^5} != b and b^{2^p} != b, so b lies in neither F_{2^5} nor F_{2^p}
      (p = 31, 37). Hence the 2-torsion translation x -> sqrt(b)/x does NOT
      preserve V = F_{2^p} on either curve, and no 2-torsion symmetry
      reduction of the factor-base system is available.
    - >-
      Rho comparators at the subgroup sizes: sqrt(pi r/4) ~ 2^{75.8} (r 152-bit)
      and 2^{91.3} (r 183-bit); the Oakley curves are not Koblitz so no
      Frobenius speedup applies; negation gives at most sqrt 2.
    - >-
      The sibling ladder uses E/F_{2^{5p}} with random b not in F_{2^p}, a = 0,
      p in 3..8, an irreducible degree-5p modulus, and a prime-order subgroup
      found by baby-step giant-step in the Hasse interval (O(2^{5p/4}) <=
      2^{10} steps at p = 8) -- all pure Python, no Sage.
    - >-
      Machine: 4 cores, ~6 GB free, gcc/make present, WDSat compilable from
      the vendored source. No Sage, sympy, msolve, Magma, M2, Singular.

  proof_search_map:
    bottleneck: >-
      The per-attempt decomposition cost at n = 5, and specifically its
      DEPENDENCE ON q: exponential (SAT) or constant (Groebner). Every other
      factor in the relation stage (5!, 2^{30} or 2^{36} relations, sparse
      linear algebra 2^{60} / 2^{72}) is fixed by the object.
    baseline_embedding:
      parameter_slice: >-
        t = 3, V = {deg x < l}, direct S_4: the Trimoska cells (15,5), (17,6),
        (19,6) where IDEA-20260915-0d8e90 reports c . 2^{3l}. The chained t = 3
        system on the same (n, l) is the k = 2 versus k = 3 analogue of this
        record's k = 4 versus k = 5 and must be run first as the bridge.
      reproduction_check: >-
        Re-run WDSat on the three shipped Trimoska cells from the vendored
        source and reproduce c within the reported 3-6 % before any chain
        instance is built; a compile that does not reproduce those medians
        invalidates the instrument, not the curve.
    observation_collision:
      observable: >-
        The exponent k in conf ~ c . 2^{kp}, fitted across p in 3..8 on
        certified-unsatisfiable targets.
      distinct_preimage_search: >-
        k = 4 is produced both by "XG recovers the affine structure" and by
        "the solver's variable order happens to put x_1..x_4 first and x_5 is
        never branched on for an unrelated reason". Discriminate by (i) forcing
        the order to put x_5 first (k must rise to 5 if the affine structure
        is what buys the bit-block) and (ii) disabling XG (k must rise). A k
        that does not move under either manipulation is an artefact of the
        fit, not a property of the system.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The two-formulation ladder p in 3..8 on identical instance bytes:
          SAT exponent k measured here, Groebner constant K_5 measured in
          IDEA-20260922-70a67c on an engine this machine lacks; the crossover
          p* = (log_2 K_5 + log_2 4!)/k read off both.
        predicted_gain: >-
          Converts the RQ's "SAT versus Groebner at n = 5" from a tool
          comparison into two scaling laws with an explicit crossover, so the
          endpoint extrapolation is a computation rather than an opinion.
    quantifier_order: >-
      FORALL p >= 3, FORALL b in F_{2^{5p}} \ F_{2^p}, FORALL unsatisfiable
      targets R: conf(WDSat, chain_5(R)) >= c_0 . 2^{4p} for a constant c_0 >=
      0.5 (the lower branch). EXISTS a variable order under which
      conf <= c_1 . 2^{4p} with c_1 <= 1 (the upper branch of (A)). The pricing
      in (C) is a corollary of the FORALL clause alone.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tower family with the subfield factor base, WDSat's per-attempt
        conflict count grows as c . 2^{kp} with k in {4, 5} over p in 3..8, and
        the SAT formulation of the n = 5 PDP at either Oakley endpoint costs
        more than exhaustive group search." It certifies nothing about other
        SAT solvers (DPLL_ANF of KN-LIT-92919e is the named next candidate),
        nothing about a sub-exhaustive regime at p > 8, and nothing about the
        Groebner constant K_5.
      nearby_object_control: >-
        PROVES-TOO-MUCH: the same argument applied to the chained t = 3 system
        at Trimoska's (n, l) predicts k = 2 (2^{2l}); if the measured chained
        t = 3 exponent is 3, the affine-propagation mechanism (A) is not what
        WDSat exploits and the k = 4 branch of this record is withdrawn, leaving
        k = 5 and a WORSE price. NULL OBJECT: a random Boolean system of the
        same variable count, equation count, degree profile and XOR density;
        it must show no 2^{4p} structure -- a 2^{4p} law that survives on the
        null object is a property of the instance shape, not of the curve.
    proof_obligations:
      - claim: Each chain equation is F_2-affine in its new argument once the other two are fixed.
        responsibility: correctness
      - claim: The DPLL core is at most the 4p x-bits of four points.
        responsibility: size
      - claim: conf = c . 2^{kp}, k in {4,5}, c in [0.5, 1], p-independent at fixed k, over p in 3..8.
        responsibility: runtime
      - claim: Both Oakley b's lie outside F_{2^5} and F_{2^p}.
        responsibility: correctness
      - claim: Endpoint totals 2^{156} / 2^{186} exceed rho and exhaustive search.
        responsibility: scope
      - claim: Crossover p* in [11, 13] for K_5 in [2^{40}, 2^{48}].
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: fitted exponent k in conf ~ c . 2^{kp} on certified-UNSAT chained t = 5 instances, p in 3..8
      direction: different
      minimum_effect: >-
        k in {4, 5} with residual < 0.3 in log_2 at every p; k = 4 if and only
        if XG is enabled and x_5 is not forced first. Any k < 3.5 is the
        sub-exhaustive surprise and is the outcome worth the most.
    - metric: c = conf / 2^{kp} at fixed k
      direction: different
      minimum_effect: >-
        c in [0.5, 1.0] and p-independent (no monotone trend across p in 3..8
        beyond +-20 %). A c that decays with p refutes the exhaustive-core
        reading and reopens the SAT arm.
    - metric: conf ratio, chained t = 3 versus direct S_4 on identical (n, l, target) bytes
      direction: lower
      minimum_effect: >-
        Ratio ~ 2^{-l} (k = 2 versus 3) if the affine-propagation mechanism is
        real; ratio ~ 1 if it is not. Registered as the bridge measurement.
    - metric: conf on the shape-matched random Boolean null object
      direction: different
      minimum_effect: >-
        No fit of the form c . 2^{4p} with c in [0.5, 1]; a null object that
        fits the law shows the law is about instance shape, not the curve.

  minimal_test:
    design: >-
      (1) Compile WDSat from inputs/TRIMOSKA-WDSAT-2024 (gcc present); reproduce
      the three shipped Trimoska medians within 6 % as the instrument check.
      (2) Extend harness/macaulay_fp/fixtures/gf2_chained_builder.py (pure
      Python, currently t = 3 and V = {deg < k}) to t = 5 and to V given by an
      explicit F_2-basis, with the subfield basis of F_{2^p} inside F_{2^{5p}}
      computed as the kernel of sigma^p - 1. (3) For p in {3, 4, 5, 6, 7}
      (n = 15, 20, 25, 30, 35), a random b not in F_{2^p}, a prime-order
      subgroup found by BSGS, 20 targets per cell: 10 certified-UNSAT (R with
      no 5-point decomposition, certified by the exhaustive 4-loop of
      IDEA-20260904-96c4f3 at p <= 5 and by WDSat's own UNSAT proof at p >= 6)
      and 10 SAT. (4) Run WDSat in four configurations: default; XG off; x_5
      forced first; x_1..x_4 forced first. Record conflicts, wall time, memory.
      (5) Fit k and c per configuration; report the chained t = 3 bridge on
      Trimoska's cells alongside. Budget: 2^{28} conflicts per instance at
      p = 7 under k = 4 (~minutes); p = 7 under k = 5 is 2^{35} (~10 h per
      instance) and is run for 2 instances only; p = 8 only if k = 4 holds.
    controls:
      - identity control: Groebner-free -- the exhaustive 4-loop certificate and WDSat agree on SAT/UNSAT for every p <= 5 instance
      - null object: shape-matched random Boolean system (same variable count, equation count, degree profile, XOR-clause density) at every cell
      - order control: x_5-first versus x_1..x_4-first variable orders on identical bytes
      - propagation control: XG on versus off on identical bytes
      - bridge: chained t = 3 versus direct S_4 at Trimoska's (15,5), (17,6), (19,6)
      - size-matched random V of dimension p at n = 5p (the same bytes feed IDEA-20260922-684291)
    required_metrics:
      - conflicts per instance, per configuration
      - fitted k and c with residuals, per configuration
      - SAT/UNSAT agreement with the exhaustive certificate at p <= 5
      - wall-clock and peak RSS per instance (charged, not modelled)
      - null-object fit statistics

  falsification_conditions:
    - k < 3.5 at any p >= 5 on certified-UNSAT instances under default order with XG on: the exhaustive-core reading is wrong for the chain and the SAT arm is reopened; the endpoint pricing in (C) is withdrawn.
    - c decreasing by more than a factor 2 from p = 4 to p = 7: sub-exhaustive regime; same consequence.
    - The chained t = 3 bridge shows k = 3 (no 2^{-l} gain over direct S_4): mechanism (A) is not what WDSat exploits; only the k = 5 branch survives.
    - The null object fits c . 2^{4p} with c in [0.5, 1]: the law is about shape, and nothing here is a statement about the curve.
    - Either Oakley b is found to lie in F_{2^p}: the exact-arithmetic assumption is wrong, the 2-torsion symmetry becomes available, and the pricing must be redone with D/16.

  confounders:
    - WDSat's static allocation and variable-order heuristics may impose a p-dependent overhead that mimics a change in k; the four-configuration design and the null object exist to separate solver from system.
    - Certifying UNSAT at p >= 6 relies on WDSat's own completeness; an incomplete run (memory cap, watchdog) is an infrastructure fact, never a k.
    - A prime-order subgroup is needed so that "no decomposition" is a property of R and not of a small-order component; the BSGS order computation must be recorded.
    - p = 5 makes F_{2^p} coincide with the degree-5 subfield of the tower (F_{2^{25}} has both); flag it and prefer p in {3, 4, 6, 7} for the fit.

  interpretation_limits:
    - Every measured number is a number at p <= 8. The endpoint figures in (C) are EXTRAPOLATIONS riding on H1 (p-independence of c at fixed k) and are labelled so.
    - Nothing here bears on the Groebner formulation; K_5 is priced in IDEA-20260922-70a67c and this record only supplies the SAT side of the crossover.
    - Nothing here asserts anything about the security of any deployed system; RFC 2409's EC2N groups are withdrawn objects.
    - A closure of the SAT arm at the endpoints is a closure of WDSat on this formulation; DPLL_ANF (KN-LIT-92919e) and CryptoMiniSat are named, unmeasured successors.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For fixed k, the constant c(p) = conf / 2^{kp} on certified-UNSAT
        chained t = 5 instances is independent of p over p in 3..8, and extends
        unchanged to p = 31 and 37.
      rigorous_support: >-
        Proposition 1 of KN-LIT-102cdb (relayed): a DPLL tree over an s-bit
        core with no pruning above the leaves has exactly 2^s leaves; the
        affine-propagation lemma (A) shows the core is at most 4p bits. This
        imitates the "uniformly random Boolean system of this shape has no
        exploitable structure" model in which every leaf must be visited.
      validation_plan: >-
        Sample 10 certified-UNSAT targets per p in 3..8 (sibling curves, random
        b not in F_{2^p}); fit c(p); tail check: the maximum and minimum c
        across targets at each p must lie within a factor 2 of the median.
        Transfer to p = 31, 37 is an explicit extrapolation and is stated as
        such wherever the endpoint figures are quoted.
    - id: H2
      statement: >-
        A uniformly random target R in the prime-order subgroup decomposes as a
        sum of five factor-base points with probability
        C(|F|+4, 5)/#E ~ 1/5!, so 5! attempts per relation.
      rigorous_support: >-
        Expected-count identity for a sum of independent uniform points
        (GOAL-RELN-001's audited yield formula); imitates the Poisson model of
        the number of representations.
      validation_plan: >-
        Exact enumeration of all 5-multisets of F at p in 3..6 (<= 1e7 sums),
        compared with 1 - exp(-lambda); the subfield-versus-random-V
        comparison of this quantity is IDEA-20260922-684291's first metric.

  target_complexity:
    time_exponent: >-
      SAT arm per attempt Theta(2^{4p})/4! to Theta(2^{5p}), i.e. q^4 to q^5 in
      q = 2^p; relation stage 5! . 2^{p-1} . that; at the endpoints 2^{156}
      (155-bit field) and 2^{186} (185-bit field). No exponent claim is made
      FOR the method; the record prices it.
    memory_exponent: >-
      WDSat: static, polynomial in 20p (megabytes at p <= 8). Relation matrix:
      2^{30} / 2^{36} rows of weight 5.
    best_known: >-
      Parallel rho at the subgroup: 2^{75.8} (group 3), 2^{91.3} (group 4),
      negation only, no Frobenius (non-Koblitz). GHS descent (KN-LIT-3305
      relays that F_{q^5} is weak) is the actually-better structural attack and
      is priced in IDEA-20260922-2caba8.
    hidden_overhead: >-
      c in [0.5, 1] is measured, not assumed; per-conflict cost in curve
      operations is charged from the measured wall clock. Nothing hides in an
      o(1): the SAT arm loses by 80+ bits at both endpoints under any c.
    tradeoff_note: >-
      Embarrassingly parallel over targets; no time-memory tradeoff on the SAT
      side. The Groebner side's tradeoff (large primes, q^{2-2/n} rebalancing)
      is analysed in IDEA-20260922-70a67c and is shown there to be
      counterproductive at n = 5.

  dominated_by: >-
    As an ATTACK: n/a, none is claimed; parallel rho remains the frontier at
    both endpoints and GHS is the better structural comparator. As a PRICING
    INSTRUMENT: dominated by nothing in the corpus -- IDEA-20260915-0d8e90 prices
    the direct S_4 at t = 3, IDEA-20260904-96c4f3 prices the exhaustive loop, and
    neither states the chain's affine-propagation core, the k = 4 / 5 branch, or
    the Oakley endpoint numbers. Checked against every row of RQ-OAKLEY-264353's
    method list (Groebner, SAT, subspace choice, GHS): each row is either priced
    here or in a sibling record of this session.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against the program's prior state: the RQ's
    premise that SAT is "the alternative" at n = 5 acquires a quantitative
    boundary -- it is the better formulation only for p below 11..13, and the
    endpoints lie at p = 31 and 37. The exponent-in-q distinction between the
    two formulations was not previously written down for this object.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
