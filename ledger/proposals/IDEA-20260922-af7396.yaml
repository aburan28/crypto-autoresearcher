idea:
  id: IDEA-20260922-af7396
  question_id: RQ-OAKLEY-264353
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE SAT ARM OF THE OAKLEY n = 5 LADDER IS PRICED BEFORE IT IS RUN, AND THE
    PRICE IS q^4: on the tower family E/F_{2^{5p}} with the subfield factor base
    V = F_{2^p}, the chained-S_3 five-point Weil-descent system (20p Boolean
    unknowns, 20p equations, Boolean degree 3) is predicted to cost WDSat
    c . 2^{4p} to 2^{5p} conflicts per unsatisfiable target, because after the
    x-bits of four points are assigned every remaining equation is F_2-affine
    in the u-bits and in the fifth point's x-bits and XOR-Gauss closes the
    instance; extrapolated to the two Oakley endpoints that is 2^{124}/24 and
    2^{148}/24 curve-equivalent operations PER DECOMPOSITION ATTEMPT, above
    exhaustive search of the whole subgroup (2^{152}, 2^{183}) once the 5! and
    2^{30} / 2^{36} relation multipliers are charged, and above the q-independent
    Groebner per-solve constant K_5 (IDEA-20260922-70a67c) for every p >= 13.
    The ladder this machine can run (p in 3..8) therefore sits ENTIRELY in the
    regime where SAT beats Groebner for a reason that is guaranteed to reverse
    below the Oakley endpoints, and a contract built from it must say so.
  class: measurement

  claim: >-
    Let E/F_{2^{5p}}: y^2 + xy = x^3 + b with b not in F_{2^p} (the Oakley shape;
    both RFC 2409 curves satisfy b not in F_{2^5} and b not in F_{2^p}, verified
    by exact arithmetic in this session). Let V = F_{2^p} and take Semaev's
    chained system for t = 5 points: S_3(u_1, x_1, x_2) = S_3(u_1, u_2, x_3) =
    S_3(u_2, u_3, x_4) = S_3(u_3, x_5, x_R) = 0 with x_i in V, u_i in F_{2^{5p}}.
    (A) STRUCTURE, exact. With S_3(a, b', c) = (ab' + ac + b'c)^2 + ab'c + B and
    squaring F_2-linear, each chain equation is affine-linear over F_2 in the
    coordinates of its "new" variable once the other two arguments are fixed:
    S_3(u_1, x_1, x_2) is affine in u_1 given (x_1, x_2); S_3(u_1, u_2, x_3) is
    affine in u_2 given (u_1, x_3); S_3(u_2, u_3, x_4) is affine in u_3 given
    (u_2, x_4); S_3(u_3, x_5, x_R) is affine in x_5 given u_3. Hence assigning
    the 4p x-bits of x_1..x_4 reduces the whole 20p-variable system to a linear
    system over F_2, and the DPLL core is AT MOST the 4p bits of four points.
    (B) PREDICTION. WDSat with XOR-Gauss enabled refutes an unsatisfiable
    instance in conf = c . 2^{k p} conflicts with k in {4, 5} and c in
    [0.5, 1.0], independent of p at fixed k; k = 4 if the XG module recovers the
    affine structure of (A) after each assignment, k = 5 if it does not. Either
    way the per-attempt cost is exponential in p = log_2 q with exponent >= 4,
    while the Groebner per-solve cost of the same decomposition is a
    q-independent constant K_5 (JV 2010: the symmetrised S_6 restriction has
    generically 2^{20} solutions over the closure, so K_5 >= 2^{40} F_q-ops
    under sparse FGLM). (C) PRICING at the endpoints, under (A)-(B): per target
    2^{4p}/4! >= 2^{119.4} (p = 31) and 2^{143.4} (p = 37); per relation x 5! ;
    relations 2^{30} / 2^{36}; total 2^{156} / 2^{186} against rho 2^{75.8} /
    2^{91.3} and against exhaustive group search 2^{152} / 2^{183}. The SAT arm
    is dominated by EVERY comparator at both endpoints, by 80+ bits.
    (D) THE CROSSOVER. 2^{4p}/24 exceeds K_5 = 2^{40} at p >= 11 and
    K_5 = 2^{48} at p >= 13. The machine-reachable ladder p in 3..8 lies below
    the crossover for every admissible K_5, so a SAT-beats-Groebner reading of
    the ladder is an artefact of small p and is pre-registered here as such.

  mechanism: >-
    OBJECT FRAME. Representation: R1 -- the point's x-coordinate written in the
    F_2-basis of F_{2^{5p}}, with the factor-base constraint x in F_{2^p}
    imposed as 4p linear equations sigma^p(x) = x (or, equivalently, x written
    in p free bits in a tower basis). Operation set Sigma = translation by
    factor-base elements only (the relation vector propagates under adding a
    factor-base point to R and shifting one coordinate), never the full
    translation action. TRICHOTOMY: Class I, partial-action, as index calculus
    always is (IDEA-20260806-c5d183); the branching event is whether R
    decomposes at all, with probability 1/5! at |V| = q. LOSSY-PROJECTION TEST
    against Sigma: the tracked object is the relation vector in F_2^{|F|}
    (which factor-base classes appear); it discards the whole group element
    and every non-factor-base coordinate, is compatible with translation by
    factor-base points (append one coordinate), and is lossy in the
    representation used (2^{|F|} vectors versus 2^{152} points). Passes.
    KN-OPEN-020 CLASS: the subfield factor base is a LINEAR subspace, inside the
    scoped-out class; nothing here escapes KN-OPEN-020 and nothing claims to.
    REPRESENTATION CLASS AND STAGE: R1; the stage whose charged cost the idea
    prices is RELATION DECOMPOSITION (the per-attempt solve).
    THE MECHANISM. Semaev's chain trades Gaudry's single degree-16 equation for
    four degree-2-in-each-argument equations at the price of three auxiliary
    field elements. In Boolean form the price is 15p extra variables, but the
    structure of S_3 -- a square of a bilinear form plus a trilinear term --
    makes every chain equation F_2-affine in whichever argument is "new" once
    the other two are fixed (squaring is linear over F_2). A DPLL solver with
    Gaussian elimination on XOR clauses therefore only has to branch on the
    x-bits of four points; the u's and the fifth point are propagated. This is
    the SAT-side analogue of the (m-1)-fold loop of IDEA-20260904-96c4f3
    (2^{(m-1)l}/(m-1)! group operations by exhaustive enumeration with a linear
    last-point membership test), and the exhaustive-core law of
    IDEA-20260915-0d8e90 (c . 2^{ml} on the DIRECT S_4 instances, where the last
    variable enters with degree 4 and is not linear) predicts the k = 5 branch.
    Which k WDSat attains is the one open number and is what the test measures.
    WHY THIS IS A PRICING RESULT AND NOT A TOOL COMPARISON. The two
    formulations differ in EXPONENT in q, not in constant: SAT is
    Theta(q^4)/24 to Theta(q^5) per attempt, Groebner is q^0 . K_5. No amount of
    solver engineering on the SAT side changes the exponent unless a
    sub-exhaustive regime exists (c(p) decaying exponentially in p), which is
    IDEA-20260915-0d8e90's registered falsifier and is inherited here at k = 4.
    WHAT IS ADDED over the corpus: the k = 4 versus k = 5 distinction for
    Semaev's chain specifically (IDEA-20260915-0d8e90 measured the direct S_4
    and predicts 2^{ml}; IDEA-20260904-96c4f3 states the (m-1)l loop but not
    the SAT realisation); the exact-arithmetic verification that both Oakley
    b's lie outside F_{2^5} and F_{2^p}; the endpoint pricing; and the
    crossover p* in [11, 13] that bounds what any machine-reachable ladder can
    say about the endpoints.

  novelty_status: unverified

