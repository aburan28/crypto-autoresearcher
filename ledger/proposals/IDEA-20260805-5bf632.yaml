idea:
  id: IDEA-20260805-5bf632
  question_id: RQ-XEDN-004
  added: '2026-08-05'
  title: >-
    The XEDN coefficient metric is anti-monotone in its own data: replace
    "shortest relation among all observed sections" by the maximum circuit
    coefficient, whose forced value on an affine-E_8 configuration is 6 and
    whose ladder is Hermite's -- then raise the slot count, not the prime
  class: measurement

  claim: >-
    H-XEDN-005 and its four predecessors measure "the infinity-norm of the
    shortest nonzero Mordell-Weil relation among the observed free-x sections".
    That statistic is ANTI-MONOTONE in the observation: enlarging the observed
    set can only shrink the shortest relation, never grow it, because every
    relation on a subset is a relation on the superset. So the hypothesis
    "max_|coeff| stays in {1,2,3}" becomes EASIER to satisfy the more sections
    are found, and its only failure mode is finding too FEW -- which is exactly
    the p = 31 cell that EXP-XEDN-006 recorded as a density block and
    EXP-XEDN-007 then removed by finding more. The coefficient bound and the
    density obstruction are two ends of one artifact. The repair is to measure
    the MAXIMUM CIRCUIT COEFFICIENT instead: for the matroid represented by the
    observed sections in the Mordell-Weil height lattice, take every minimal
    dependent subset T (circuit), let v_T be its primitive relation, and report
    M(S) = max_T ||v_T||_inf. M is monotone NON-DECREASING in S, it reduces to
    the current statistic when the configuration has a single circuit (which is
    the case for all 14 archived relations), and it has a forced value on a
    nearby object where the {1,2,3} claim is FALSE: nine height-2 sections in
    an extended-E_8 configuration have a unique circuit with coefficient vector
    (1,2,3,4,6,5,4,3,2), so M = 6. That vector was computed in this session in
    exact integer arithmetic by enumerating the 120 positive roots of E_8 from
    its Cartan matrix; it is not recalled. Under M, the parameter to raise is
    the SLOT COUNT, not the prime -- and the richest window in reach is the one
    the lane already abandoned: deg b <= 6, deg a <= 4, arithmetic genus 1,
    where integral sections are the roots of a Mordell-Weil lattice of rank up
    to 8 and can number in the hundreds, against a maximum of 6 slots ever
    observed under deg b = 10.

  object_first_candidate:
    tracked_object: >-
      The CIRCUIT SYSTEM of the observed section configuration: the set of
      minimal dependent subsets of {P_1..P_n} in the Mordell-Weil height
      lattice, each carrying its primitive coefficient vector. Followed
      through the computation: surface -> free-x window -> represented matroid
      on the window -> circuits -> primitive relation vectors -> the maximum
      infinity-norm M(S), and separately the multiset of circuit lengths, which
      is a genuine invariant of the configuration and is what a
      relation-collection cost model would charge.
    established_families_off_limits: >-
      Off-limits as the primary lens: the degree-shape ladder (raise deg a,
      raise deg b, raise deg x) that generated GOAL-XEDN-001, -002 and -003;
      the prime ladder p = 7,13,19,31; specialisation verification as the
      primary instrument; xedni lifting; index calculus over F_p. All three
      prior goals moved along the degree axis and the prime axis while holding
      the configuration size at whatever the window happened to yield. This
      proposal refuses both axes and moves the configuration size, which is the
      axis on which the statistic actually has content.
    newness_score: >-
      The matroid-circuit framing is standard mathematics and is claimed as
      nothing else. What is not in this corpus: any statement that the lane's
      primary metric is anti-monotone; any statistic on these configurations
      that is monotone in the observation; any use of the configuration size
      as an independent variable; and any nearby object at which the {1,2,3}
      conclusion is known to fail. The prior art here is four goals of
      degree-and-prime laddering, all reporting the same value.
    testability_score: >-
      High. M(S) on a configuration of n <= 12 sections is a finite enumeration
      over C(n, r+1) subsets with an exact rational kernel each -- pure Python,
      seconds. The affine-E_8 forced value is already computed. The expensive
      part is producing large configurations, which needs the chi = 1 window
      and function-field arithmetic without Sage.
    survival_score: >-
      M survives as far as the configuration is faithfully represented. It
      dissolves exactly where the height pairing dissolves -- torsion sections
      and non-minimal models -- and those are named in the confounders rather
      than left implicit.

  mechanism: >-
    DERIVED IN-REPO.

    (A) ANTI-MONOTONICITY, IN ONE LINE. Let S subset S'. Every integer relation
    supported on S is an integer relation on S' with zeros elsewhere, so
    shortest(S') <= shortest(S) in infinity-norm. Therefore the statistic
    "infinity-norm of the shortest relation among the observed sections" is
    non-increasing under enlarging the observation. A hypothesis predicting
    that this statistic stays SMALL is therefore made easier by every extra
    section found, and can only be stressed by finding fewer. The archive
    exhibits this directly: the largest configurations in the archive (6 slots
    at p = 7, 4 slots at p = 31) all report 1, and the only cell that ever
    "failed" -- p = 31 under EXP-XEDN-006 -- failed by having 2 eligible
    surfaces and 0 relations, i.e. by having too little data. EXP-XEDN-007's
    densification then supplied more data and, by (A), could not have moved the
    statistic upward.

    (B) THE REPAIRED STATISTIC. The relations of MINIMAL SUPPORT among
    {P_1..P_n} are exactly the circuits of the matroid these vectors represent
    over Q. For a circuit T of size r+1 spanning rank r, the primitive relation
    v_T is unique up to sign and, by the index identity, |v_T(i)| =
    [<T> : <T \ {P_i}>]. Define M(S) = max over circuits T of ||v_T||_inf.
    MONOTONICITY: if S subset S', every circuit of S is a union of circuits of
    S' or is itself a circuit, and in either case max over the larger circuit
    system is at least as large; concretely, every circuit of S remains a
    dependent set of S' and contains a circuit of S', so M(S') >= the maximum
    over that induced family. The experiment measures this rather than assuming
    it -- monotonicity of M in n is itself one of the pre-registered
    predictions, and if it fails the repaired statistic is wrong and must be
    replaced.
    REDUCTION TO THE OLD STATISTIC: when the configuration has corank 1 there
    is exactly one circuit and M equals the old value. All 14 archived
    relations are corank-1 by construction of the search (it returns the first
    minimal-support relation it finds), so M is a strict generalisation and not
    a different subject.

    (C) THE LADDER AND THE FORCED VALUE. By the Hermite argument of
    IDEA-20260805-5a9d2c, a circuit of size r+1 among equal-norm vectors has
    ||v_T||_inf <= gamma_r^{r/2}, whose floor is 1,1,1,2,2,4,8,16 at r = 1..8.
    So M can only climb by acquiring LARGER circuits, which requires larger
    configurations. The forced value at the top of that ladder was computed in
    this session, not recalled: from the E_8 Cartan matrix (determinant
    verified to be 1 in exact rational arithmetic) the 120 positive roots were
    enumerated and the highest root has coefficient vector (2,3,4,6,5,4,3,2)
    over the simple roots, so the extended-diagram circuit
    {alpha_0, alpha_1, ..., alpha_8} has primitive relation (1,2,3,4,6,5,4,3,2)
    and M = 6 >= 4. Six exceeds H-XEDN-005's falsification threshold. The
    smaller extended diagrams supply the interior points of a graded control:
    affine A_r has all marks 1 (M = 1), affine D_r has marks up to 2, affine
    E_6 up to 3, affine E_7 up to 4, affine E_8 up to 6 -- to be COMPUTED by
    the same enumeration, not asserted; only the E_8 value was computed here.

    (D) WHERE SUCH CONFIGURATIONS LIVE, AND WHY THE LANE WALKED AWAY FROM
    THEM. RECALLED, UNVERIFIED, and the first thing the experiment checks: for
    a rational elliptic surface (arithmetic genus 1; Weierstrass model with
    deg a <= 4, deg b <= 6) with no reducible fibres, the Mordell-Weil lattice
    is E_8 and the integral sections are its 240 roots. That is precisely the
    window of GOAL-XEDN-001 and GOAL-XEDN-002, which the lane left in order to
    raise deg b to 10 so that deg x = 3 would be executable. The move traded a
    window that can hold up to 240 sections for one whose committed slot
    histograms are {0:11, 1:64, 2:9, 3:4, 4:2, 6:1} at p = 7 and
    {0:3, 1:103, 2:11, 3:2, 4:1} at p = 31. Under an anti-monotone statistic
    that trade is invisible; under M it is the whole experiment.

    (E) WHAT M MEASURES THAT max_|coeff| CANNOT. Three things, none of them in
    any EV-XEDN record: the circuit-length multiset (how many sections must be
    combined before a relation appears -- the relation-collection quantity);
    the SATURATION INDEX [L_sat : L] of the observed sublattice in MW, which is
    1 exactly when the free-x window generates the section group and > 1 when
    the window systematically misses generators; and the normalised covolume
    covol(L)^{1/r}, which is the size-free version of "how dependent" the
    configuration is. A window with saturation index > 1 is a window that
    cannot be used as a relation source no matter how many sections it returns,
    and that is a statement with actual consequences for the lifting programme
    the XEDN lane exists to serve.

    (F) NOT A CLOSURE AND NOT A REBUTTAL. Nothing here says H-XEDN-005 is
    false. It says the statistic chosen to test it moves the wrong way, and
    proposes a monotone replacement with a pre-computed forced value on an
    object where the hoped-for conclusion is known to fail. That is
    inventor-protocol section 8 audit 4 -- the nearby-object control -- applied
    to a lane that has never run one.

  novelty_status: unverified

  literature_context:
    - >-
      Shioda's theorem identifying the Mordell-Weil lattice of a rational
      elliptic surface with no reducible fibres as E_8, and integral sections
      with its 240 roots, is RECALLED, UNVERIFIED. No paper was read for this
      record; no author, theorem number, volume or page is asserted. It is
      load-bearing ONLY for the claim that affine-E_8 configurations are
      REALISABLE by free-x sections; the forced value 6 itself is pure lattice
      combinatorics and was computed here.
    - >-
      The correspondence between minimal-support linear dependencies and
      matroid circuits, and the fact that affine Dynkin diagram marks are the
      coefficients of the unique relation among the extended simple roots, are
      standard. The E_8 instance was verified computationally in this session;
      the A, D, E_6 and E_7 instances are to be computed in the experiment and
      are NOT asserted here.

  lossy_projection_identifiability_audit:
    projection: >-
      observed section configuration S --> the represented matroid on S,
      together with each circuit's primitive coefficient vector --> M(S), the
      circuit-length multiset, the saturation index, and covol^{1/r}.
    what_is_discarded: >-
      The curve, the prime, the degree window, the polynomials, and the
      embedding of the configuration in the ambient Mordell-Weil lattice --
      everything except the rational dependency structure and its indices.
    why_genuinely_lossy: >-
      Genuinely lossy: the matroid is invariant under every isometry and under
      any change of basis of the ambient lattice, and infinitely many
      configurations share one. It propagates deterministically under the group
      law because dependencies are preserved by integer linear algebra, so the
      retained part is exactly what relation-finding needs.
    is_it_only_a_change_of_coordinates: >-
      No. The mirror failure -- constancy -- was checked and does NOT fire for
      M, and that is the entire point of proposing M: the current statistic HAS
      zero spread over the committed archive (14 of 14 report 1), while M is
      pre-computed to take at least the values 1 and 6 on realisable
      configurations, so its comparator range is non-degenerate before any run.
      The (Delta,Pi) failure does not apply: the projection is far from
      injective.

  assumptions:
    - >-
      That M is monotone non-decreasing in the observed set. Argued in
      mechanism (B) and pre-registered as a measured prediction rather than
      assumed, because a circuit of S need not be a circuit of S'.
    - >-
      That affine-E_8 configurations are realisable by free-x integral sections
      of a rational elliptic surface over a small F_p. This is the recalled
      half and it is exactly what the experiment's stage 3 tests; if it fails,
      the forced value 6 remains true as lattice combinatorics and false as a
      statement about this family, and that distinction must be reported.
    - >-
      That the height pairing is positive definite on the observed sections,
      i.e. that no observed section is torsion. Torsion sections have height 0
      and would make the Gram singular for reasons unrelated to relations. The
      archive's mu3 control is adjacent to this but is not the same check.

  proof_search_map_note: >-
    This is a metric-design proposal rather than a theorem or asymptotic
    claim. Its one derivable assertion -- the Hermite ladder and the affine-E_8
    forced value -- is carried by hypothesis H-XEDN-754174's proof_search_map,
    whose method-ceiling audit names exactly this object as the nearby control.

  predictions:
    - metric: >-
        affine_E8_circuit_coefficient: M on a nine-element configuration
        realising an extended E_8 diagram
      direction: different
      minimum_effect: >-
        EXACTLY 6, with primitive relation vector (1,2,3,4,6,5,4,3,2) up to
        permutation and sign. Computed in this session from the E_8 Cartan
        matrix in exact integer arithmetic. If the experiment's own
        circuit-finder returns anything else on this input, the finder is
        broken and no other arm may be reported.
    - metric: >-
        anti_monotonicity_demonstration: on the committed 6-slot p = 7
        configuration, the shortest-relation infinity-norm computed on every
        3-element, 4-element, 5-element and 6-element subset
      direction: lower
      minimum_effect: >-
        The subset maximum must be NON-INCREASING as the subset grows, on 100
        per cent of the chains examined. This is forced by (A) and is the
        cheapest possible demonstration that the lane's statistic moves the
        wrong way. A single increasing chain refutes (A) and the proposal.
    - metric: >-
        M_monotonicity: M evaluated along the same chains
      direction: higher
      minimum_effect: >-
        NON-DECREASING on 100 per cent of chains. If M is not monotone, the
        repaired statistic is wrong and must be replaced before anything is
        built on it.
    - metric: >-
        max_slot_count achieved in the chi = 1 (deg b <= 6, deg a <= 4) window
        under full enumeration at p in {7,13,19,31}
      direction: higher
      minimum_effect: >-
        >= 9 on at least one surface, which is the minimum configuration size
        at which M can legally exceed 3 under the Hermite ladder. NO
        PREDICTION IS MADE about whether 240 is approached; the committed
        deg b = 10 histograms top out at 6 and there is no in-corpus
        measurement of the chi = 1 window's slot distribution to extrapolate
        from, so inventing one would be a fabrication. If the maximum slot
        count stays below 9, the whole line is blocked at the enumeration
        stage and that blockage -- with its measured histogram -- is the
        deliverable.
    - metric: >-
        saturation_index [L_sat : L] of the observed configuration in MW
      direction: different
      minimum_effect: >-
        No pre-registered value; this quantity has never been measured in this
        lane and asserting a number for it would be a fabrication. The
        pre-registered DISPOSITION: index 1 means the free-x window generates
        the section group over the tested surfaces and the window is a
        legitimate relation source; index > 1 means it is not, and the amount
        by which it exceeds 1 is the first honest measurement of how much the
        degree window costs.

  minimal_test:
    design: >-
      Four stages, cheapest first; stages 1 and 2 need no curves at all and
      either can end the line.
      STAGE 1 (pure Python, seconds): compute the affine Dynkin marks for
      A_r, D_r, E_6, E_7, E_8 by root enumeration from the Cartan matrices, and
      confirm the E_8 value 6 independently of the computation already done in
      this session. Confirm the Hermite ladder floors 1,1,1,2,2,4,8,16.
      STAGE 2 (pure Python, seconds): implement the circuit enumerator and M,
      and run the anti-monotonicity and M-monotonicity demonstrations on the
      committed archived configurations, using their recorded slot lists and
      relation vectors. If M is not monotone, STOP.
      STAGE 3 (pure Python, hours of implementation): enumerate the chi = 1
      free-x window (deg b <= 6, deg a <= 4, deg x <= 2, deg y <= 3) at
      p in {7,13,19,31} and report the slot-count histogram. This reuses the
      frozen EXP-XEDN-001 square predicate, which is committed, but needs an
      F_p(t) group law written from scratch because Sage is absent from this
      container (verified this session).
      STAGE 4 (pure Python, minutes given stage 3): compute M, the
      circuit-length multiset, the saturation index and covol^{1/r} on every
      configuration with >= 5 slots, and report M against the Hermite ladder as
      a function of configuration size.
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN fail). Random
        rank-8 integral lattices with n vectors drawn from the ball of the same
        radius, matched on n and on the norm profile, with no elliptic curve
        behind them. Forced prediction: M climbs the same Hermite ladder with
        n, so the CURVE-DERIVED configurations must be compared to the null by
        RATIO, not by raw value. If the ratio is 1 at every n, the free-x
        window is behaving as a generic lattice ball and the geometry is
        invisible to this statistic -- which is a controlled null and a real
        deliverable, not a failure.
      - >-
        POSITIVE CONTROL (the effect MUST appear). The affine-E_8
        configuration, injected as a synthetic 9-vector input, on which M must
        return exactly 6. A second positive control at the low end: an
        affine-A_2 configuration (three vectors, all marks 1) on which M must
        return exactly 1. Both are forced and both are computed before any
        curve is touched. If either fails, no negative may be reported.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. M as a
        function of configuration size n = 3,4,5,6,7,8,9 on synthetic
        equal-norm configurations, reported against the forced ladder. The
        prediction is monotone non-decreasing with the first legal 2 at n = 5
        and the first legal 4 at n = 7. A plateau at 1 all the way to n = 9
        would mean generic ball configurations never realise large circuits,
        which localises the requirement to SPECIAL (root-system) configurations
        and is itself informative.
      - >-
        NEARBY-OBJECT CONTROL (inventor protocol section 8 audit 4). The whole
        chi = 1 arm IS the nearby object at which the {1,2,3} conclusion is
        expected to fail. The pair to hold apart is (chi = 1, large window,
        M expected > 3) against (chi = 2, small window, M = 1 observed). A
        statistic that cannot separate that pair has not found the load-bearing
        structure.
      - >-
        ARCHIVE CHECK. The committed slot histograms and slot lists of
        EXP-XEDN-006 and EXP-XEDN-007 are available and stage 2 uses them
        directly. The chi = 1 window's histograms may exist in
        EXP-XEDN-002/003 artifacts, which this session did NOT read; stage 3
        must enumerate them rather than assume they are absent.
    required_metrics:
      - affine Dynkin marks per diagram, computed
      - anti-monotonicity and M-monotonicity chain results, with the fraction of chains satisfying each
      - slot-count histogram of the chi = 1 window per prime
      - M, circuit-length multiset, saturation index and covol^{1/r} per configuration
      - the M-versus-null ratio at each configuration size

  falsification_conditions:
    - >-
      A chain on which the shortest-relation statistic INCREASES with the
      subset. Claim (A) is wrong and the anti-monotonicity headline collapses.
    - >-
      M fails to be monotone on the archived configurations. The repaired
      statistic is wrong and must be replaced before use.
    - >-
      The circuit-finder does not return 6 on the affine-E_8 control. The
      instrument cannot see large coefficients and nothing may be reported.
    - >-
      The chi = 1 window's maximum slot count stays below 5 at every tested
      prime. The line is blocked at enumeration and the honest deliverable is
      the histogram plus a named enumeration obstruction, not a conclusion
      about coefficients.
    - >-
      The M-versus-null ratio is 1 at every configuration size. The statistic
      is measuring lattice geometry rather than elliptic-surface geometry, and
      that controlled null must be reported as the result.

  confounders:
    - >-
      REALISABILITY. Whether free-x integral sections can be found in an
      extended-E_8 configuration over a small F_p is unknown to this record and
      is the load-bearing empirical question. Failure to realise one is NOT
      evidence that the coefficient bound holds; it is evidence about the
      window, and the report must say which.
    - >-
      COMBINATORIAL COST. Enumerating all circuits of an n-element
      configuration is exponential in n. At n <= 12 it is trivial; if stage 3
      produces configurations of size 100 or more, M must be computed on a
      declared subsample with the subsampling rule frozen in advance, or it
      becomes an optimisation over a search the experimenter controls.
    - >-
      TORSION AND NON-MINIMALITY. Torsion sections have height 0 and
      non-minimal models change chi; either breaks the height pairing's
      positive definiteness or its normalisation. Both must be screened before
      M is computed.
    - >-
      METRIC SHOPPING. Proposing a new statistic after seeing that the old one
      is flat is exactly the move that produces unfalsifiable research. The
      defence, and it must be honoured: M's forced values at both ends (1 on
      affine A_2, 6 on affine E_8) and its full ladder are declared BEFORE any
      curve is enumerated, and the null arm is committed before the treatment
      arm is read.

  interpretation_limits:
    - >-
      No status change to any record is proposed or implied. This record does
      not assert that any prior XEDN conclusion is false, and only a
      Coordinator may change a status.
    - >-
      Realising M = 6 on a chi = 1 surface would NOT falsify H-XEDN-005, whose
      scope is deg b = 10 and deg x <= 3. It would show that the coefficient
      bound is a property of small windows rather than of the family, which is
      the sentence H-XEDN-005's mechanism asserts the opposite of. Keeping
      those two statements apart is mandatory.
    - >-
      Toy scale. Nothing here is an ECDLP cost, exponent, attack, or
      crypto-scale claim, and the xedni-calculus motivation is background, not
      a claim of progress toward an attack.

  heuristic_assumptions:
    - id: H1
      statement: >-
        M(S) = max over circuits T of S of ||v_T||_inf is monotone
        non-decreasing under enlarging S.
      rigorous_support: >-
        Sketched in mechanism (B): every circuit of S is dependent in S' and so
        contains a circuit of S'. The step from "contains a circuit" to "that
        circuit's coefficients are at least as large" is NOT proved here and is
        the weak point.
      validation_plan: >-
        Measured directly on every chain in the archived configurations and on
        10^4 synthetic chains, and reported as a fraction rather than assumed.
        If monotonicity fails, replace M by max over SPANNING circuits of a
        declared size, and report the replacement as a post-hoc change with
        confirmatory status exploratory_only.
    - id: H2
      statement: >-
        A rational elliptic surface with no reducible fibres has Mordell-Weil
        lattice E_8, and its integral sections are the 240 roots.
      rigorous_support: >-
        RECALLED, UNVERIFIED. Load-bearing only for realisability, not for the
        forced value.
      validation_plan: >-
        Enumerate the chi = 1 window at small p, count integral sections, and
        compare the count and the observed height values to the E_8 prediction
        (240 sections, all of height 2 when there are no reducible fibres).
        This is a strong and cheap test of the recalled statement.
    - id: H3
      statement: >-
        The Hermite ladder floor(gamma_r^{r/2}) = 1,1,1,2,2,4,8,16 bounds
        circuit coefficients for equal-norm configurations.
      rigorous_support: >-
        Derived in IDEA-20260805-5a9d2c; gamma_r values are RECALLED with a
        partial in-session check (E_8 Cartan determinant 1, minimum 2, giving
        gamma_8 >= 2).
      validation_plan: >-
        Shared with H-XEDN-754174's validation plan; the ladder is used here
        only to declare which configuration sizes can legally exceed 3.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT MOVED, NONE CLAIMED. This is metric design plus a
      toy-scale enumeration.
    memory_exponent: n/a.
    best_known: Pollard rho for the ECDLP, untouched.
    hidden_overhead: >-
      Circuit enumeration is exponential in configuration size; the
      subsampling rule is the declared mitigation.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed). Rows checked across time, memory and data/queries:
    no algorithm and no cost point is proposed. On the question of whether a
    monotone relation statistic, a circuit census, or a saturation index has
    been measured in this lane, the following were read and none does:
    RQ-XEDN-004, H-XEDN-005, EXP-XEDN-006 and EXP-XEDN-007 specifications,
    EV-XEDN-005, EV-XEDN-006, DEC-20260730-001, DEC-20260730-002, KN-FIND-010,
    KN-FIND-011, GOAL-XEDN-003, and both committed raw-result.json files. The
    EXP-XEDN-002/003/004/005 artifacts were NOT read in this session and could
    contain such a measurement; that gap is recorded rather than papered over.
    Absence of a search result is not evidence of absence.
  sota_delta: >-
    No attack; measurement-design contribution only. Quantitatively: replaces a
    statistic with comparator spread 0 over 14 observations by one with a
    pre-computed range spanning 1 to at least 6 on realisable configurations,
    and changes the experiment's independent variable from the prime (4 levels,
    all giving the same value) to the configuration size (the axis on which the
    Hermite ladder says the statistic can move at all).

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.55
  honest_prior_of_survival_reasoning: >-
    0.55 that the full programme delivers, i.e. that a configuration with
    M > 3 is actually realised by free-x sections at a tested prime. The
    cheap half is near-certain: anti-monotonicity is one line and the
    affine-E_8 forced value 6 is already computed, so stages 1 and 2 will
    almost surely confirm that the lane's statistic moves the wrong way and
    that a monotone replacement exists with a non-degenerate range. The number
    is only 0.55 because the expensive half depends on realisability -- whether
    the chi = 1 free-x window at p in {7,13,19,31} yields nine simultaneous
    sections in a root configuration -- and there is NO in-corpus measurement
    of that window's slot distribution to reason from, the committed deg b = 10
    histograms top out at 6 slots, and a small prime may simply not have enough
    F_p-rational structure. It is not lower because even a blocked enumeration
    produces the histogram, the saturation index and the controlled null, all
    of which are absent from the corpus and all of which the goal's own
    question would need before anyone could read the coefficient result as
    geometry.
