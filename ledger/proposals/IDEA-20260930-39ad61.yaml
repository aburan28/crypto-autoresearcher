idea:
  id: IDEA-20260930-39ad61
  question_id: RQ-MTGT-2cabee
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE TRANSPORT STEP HAS ITS OWN PREPROCESSING FRONTIER: a Bernstein-Lange
    distinguished-point table on the CRATER TORSOR (class-group walks from the
    table curve E_0 with known vectors) turns the per-curve path-finding charge
    of the one-table-per-class attack from sqrt(h) = p^{1/4} (IDEA-20260811-b3a355,
    IDEA-20260901-48b364) into sqrt(h/S_c) -- p^{1/6} at S_c = p^{1/6} class-side
    advice -- so the multi-curve preprocessing attack sits on a COMPOSITE frontier
    (S_g T_g^2 = N) x (S_c T_c^2 = h) whose class-side term binds only when
    S_g > L^2 N^{1/2} S_c; the crater walk is generic-group-ACTION simulable, so
    nothing per target moves, and the one open number -- the merge exponent of a
    hash-directed walk on a Cl(O_K)-torsor -- is measured on an enumerated toy
    crater against the identity, relabelled Z/hZ, wrong-walk and random-vector
    controls
  class: composition

  claim: >-
    CEILING FIRST. No per-target exponent moves. The per-target online cost of the
    one-table-per-class attack stays at T_g = sqrt(N/S_g) with S_g group-side
    advice (Corrigan-Gibbs--Kogan S T^2 = Omega~(eps N), KN-LIT-013, retrieved
    this session), and every oracle this record consumes is simulable (see
    SIMULABILITY). What the record prices is the ONE charge the lane's existing
    records leave at p^{1/4}: reaching the table curve E_0 from a new classmate
    E'. Representation class R2 of RQ-ECDLP-623a32 (the CURVE as an encoding of
    the abstract group G; on the crater the encoding is a point of a
    Cl(O_K)-torsor); attack stage: the transport stage of a preprocessing attack,
    i.e. path-finding E' -> E_0 followed by mode-B pull of the two target points
    (IDEA-20260807-a127ab).

    (A) THE CONSTRUCTION. Let the class have crater size h = h(O_K) after the
    deterministic ascent of IDEA-20260901-48b364 and IDEA-20260807-bb03d3. Fix r
    small primes ell_1..ell_r split in O_K, one orientation per prime (the
    Frobenius eigenvalue on the kernel, Elkies-style), and a hash s: F_p -> [r].
    The STEP f(E) = l_{s(j(E))} * E is a function of the vertex only, so two walks
    that meet continue identically -- the merging property van Oorschot-Wiener
    distinguished points need (KN-TECH-006). PRECOMPUTATION on the table curve
    E_0: for i = 1..S_c draw a known word a_i in the l_j, walk from a_i * E_0
    until a distinguished j (top d bits zero), store (j_DP, a_i + walk word),
    keeping the most useful walks as Bernstein-Lange do (KN-LIT-7cc07f via
    KR-RHO-ea34b8; eprint 2012/458 retrieved this session: table l^{1/3} after
    1.24 l^{2/3} precomputation, online 1.77 l^{1/3}). ONLINE for a new E': ascend
    to the crater, walk with the SAME f until a distinguished j, look it up; on a
    hit the class-group vector v with E' = v * E_0 is (stored word) - (online
    word), and the explicit isogeny chain E' -> E_0 is the online walk forward
    followed by the stored walk reversed (conjugate ideals), of length
    T_c + 1/theta + |a_i|. Then mode B of IDEA-20260807-a127ab pulls (P', Q')
    through the chain to (E_0, G) at O(chain length * ell^2 log p) field
    operations per point, and the group-side table applies with the same k (T1).

    (B) THE COST LAW, STATED AS THE TWO NUMBERS THIS RECORD CLAIMS. Under H1
    (the hash-directed crater walk is a random mapping on the h-element torsor)
    the Bernstein-Lange analysis transfers verbatim because it uses only the
    random-mapping property and the ability to add known step labels:
    expected online steps per curve T_c = c sqrt(h / S_c) with c of order 1,
    precomputation about S_c * (1/theta) walk steps with 1/theta ~ T_c,
    class-side advice S_c entries of O(log p) bits. At S_c = h^{1/3}:
    T_c = h^{1/3} = p^{1/6 + o(1)} after h^{2/3} = p^{1/3 + o(1)} precomputation,
    against the sqrt(h) = p^{1/4 + o(1)} per curve that IDEA-20260811-b3a355
    (meet-in-the-middle, p^{1/4} memory) and IDEA-20260901-48b364 (crater
    meet-in-the-middle or DP walk) charge with NO class-side advice. The
    class-side frontier S_c T_c^2 = h is claimed as an UPPER bound only; no lower
    bound for group actions with preprocessing is claimed or cited.

    (C) WHEN THE CLASS-SIDE TERM BINDS, SO NOBODY OVER-READS (B). For M curves
    with L targets each, total online = M sqrt(h/S_c) + M L sqrt(N/S_g). With
    h ~ N^{1/2 + o(1)} the class-side term exceeds the group-side term iff
    S_g > L^2 N^{1/2} S_c, i.e. only in the HIGH-ADVICE regime where the
    group-side online cost is already below p^{1/4}. At the standard
    Bernstein-Lange point S_g = N^{1/3}, L = 1 the per-curve p^{1/4} of b3a355 is
    lower order than the per-target N^{1/3} and this record changes the leading
    term of nothing. The record is therefore a FRONTIER COMPLETION of
    IDEA-20260807-a127ab (which charges a KNOWN path at O(L ell^3)) and
    IDEA-20260811-b3a355 (which charges the path search at p^{1/4} with no advice),
    not an attack: it supplies the missing class-side (S_c, T_c) axis and says
    where it matters.

    (D) THE TWO READINGS THE MEASUREMENT SEPARATES. R-BL: the merge exponent
    alpha in T_c ~ (h/S_c)^alpha is 1/2 on the treatment arm and 1 on the
    wrong-walk and random-vertex arms; the crater torsor supports
    Bernstein-Lange amortisation and (B) stands at toy scale. R-NOMERGE:
    alpha is near 1 on the treatment arm as well -- the hash-directed crater
    walk does not behave as a random mapping (restricted prime-set support,
    IDEA-20260801-007's "effective collision surface"), the class-side table
    degrades to the baby-step-giant-step regime T_c ~ h/S_c, and (B) is false at
    the tested scale with a measured obstruction. Both are reportable.

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md section 3). REPRESENTATION: R2,
    the curve as encoding; on the crater, the j-invariant as a point of the
    Cl(O_K)-torsor. OPERATION SET Sigma: the hash-directed crater step f (one
    small split-prime ideal chosen by a hash of j, applied in the oriented
    direction) together with the group-side transport phi|_G and its dual, which
    are relabellings of G (IDEA-20260807-d73e83). Sigma is NOT the full
    Cl(O_K)-action (translation by arbitrary ideal classes) and NOT the
    translation action on G, so the closure of IDEA-20260806-c5d183 and
    KN-FIND-ffe1df Theorem C does not apply to it; if one enlarged Sigma to the
    full class-group action the object below would become branching, and the
    record does not do that. TRACKED OBJECT: the BASIN MAP of f on the crater,
    curve -> (distinguished endpoint, stored vector). TRICHOTOMY: Class I,
    PARTIAL ACTION -- the basin map propagates deterministically under f (a basin
    is f-invariant by definition) and under nothing else; it is exactly the
    object a Bernstein-Lange table tracks, moved from the group to the torsor.
    LOSSY-PROJECTION TEST AGAINST Sigma: the map discards the curve's position
    inside its basin and retains only the endpoint and its vector; the discard
    is compatible with f because f maps every basin into itself (the fibre
    partition is a block system of <f>); it is lossy because h >> #stored
    endpoints (mean fibre h/S_c >= h^{2/3} at the operating point); it is not a
    change of coordinates because the vector of a curve is not recoverable from
    its endpoint without re-walking. THE ONE OPEN NUMBER is the orbit --
    here basin -- canonicalisation cost per curve, T_c, equivalently the merge
    exponent alpha, and it is measured rather than asserted.

    SIMULABILITY (RQ-GGMB-6eaabc), STATED FIRST. The crater step consumes the
    class-group ACTION oracle (ideal, curve) -> curve with j-invariants as
    labels; this is a generic group-action oracle in the sense of the
    Montgomery-Zhandry model (recalled; not opened this session) and is
    simulable by a torsor simulator that issues fresh labels for fresh orbit
    elements -- the record's own relabelled Z/hZ control is that simulator run
    for real. The group-side transport is a relabelling (IDEA-20260807-d73e83).
    Hence the whole construction lives in "generic group action with
    preprocessing" composed with "generic group with preprocessing", the
    per-target bound S_g T_g^2 = Omega~(N) stands, and the lane is CLOSED at
    exponent 1/2 per target without advice and at the CGK frontier with it. What
    it still delivers is the class-side (S_c, T_c) axis of (B)-(C), which the
    single-group model has no vocabulary for and which the existing MTGT records
    price at a single point (S_c = 0, T_c = sqrt(h)).

    NON-GENERIC RESOURCE CONSUMED: R4 (the isogeny graph, as the supplier of the
    efficiently computable identification between the M encodings) and R8
    (multi-instance / preprocessing structure), exactly as IDEA-20260807-a127ab
    labels them; nothing acts on G except isogenies, so H-ENDO-001 is satisfied
    and no new congruence is claimed. The automorphism discount (KR-RHO-0528e7,
    KN-TECH-018) is orthogonal and untouched.

    OFF-LIMITS COMPONENTS DECLARED (docs/object-frame-ideation.md section 2): F7
    (preprocessing table) and F3 (isogeny path) are both used as components.
    What is added beyond them: the table is placed on the TORSOR rather than the
    group, the composite frontier of (C) is written down, and the merge
    exponent of the torsor walk is measured against a relabelled control.

    WHY THE MERGE LAW MIGHT FAIL, WHICH IS WHY IT IS MEASURED. Bernstein-Lange's
    walk lives in a group where any step label is available; the crater walk
    has r small-prime generators and one orientation each, so its step set is a
    tiny subset of Cl(O_K). Under GRH the Cayley graph on small split primes is
    an expander (Jao-Miller-Venkatesan, eprint 2004/312, retrieved this session),
    which gives MIXING; the random-mapping statistics that Bernstein-Lange's
    analysis actually uses (basin sizes, merge times) are a stronger heuristic
    and IDEA-20260801-007 records, for CSIDH, that the restricted prime set can
    change the effective collision surface. H1 is therefore a genuine
    assumption with a genuine failure mode.

