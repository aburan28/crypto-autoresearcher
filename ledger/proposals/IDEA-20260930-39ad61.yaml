  citation_note: >-
    Three sources were fetched and read at abstract level this session
    (KN-LIT-013 / eprint 2017/1113, eprint 2012/458, eprint 2004/312); the
    crypto-kb index is empty this session, so no kb provenance exists. The
    Bernstein-Lange constants are quoted from the fetched abstract; the law
    T_c^2 S_c = h on the torsor is DERIVED here by transferring their analysis
    under H1 and is not a quotation. Every exponent in this record is
    re-derived in the claim.

  assumptions:
    - >-
      The class is ordinary with prime N exactly dividing #E, the crater is
      reached by the deterministic ascent of IDEA-20260901-48b364, and the
      crater is a Cl(O_K)-torsor of size h = h(O_K) (Kohel; Fouquet-Morain;
      recalled through 48b364, which cites them).
    - >-
      Small split primes ell_1..ell_r with an orientation per prime are
      available and one oriented step costs O~(ell^2 log p) field operations
      (modular polynomial root plus Elkies kernel); the per-step constant is
      measured, never assumed.
    - >-
      The group-side table is a Bernstein-Lange known-log DP table on (E_0, G)
      and transports by mode B of IDEA-20260807-a127ab; nothing on the group
      side is changed by this record.
    - >-
      OFF-LIMITS COMPONENTS: F7 and F3 as components; nothing escapes
      KN-OPEN-020 because no factor base is proposed.
    - >-
      Toy scale only: craters with h between about 10^3 and 10^5, i.e. p of
      roughly 20 to 34 bits chosen so that |D_0| is near 4p (f small) and the
      whole crater is enumerable for ground truth.

  proof_search_map:
    bottleneck: >-
      Whether a hash-directed walk on a Cl(O_K)-torsor with r oriented
      small-prime steps obeys the random-mapping merge law that Bernstein-Lange
      preprocessing needs, so that stored distinguished endpoints from E_0 are
      reached from a fresh classmate in sqrt(h/S_c) rather than h/S_c steps.
    baseline_embedding:
      parameter_slice: >-
        S_c = 0 reproduces the lane's current charge: two-ended DP walk /
        meet-in-the-middle at sqrt(h) (IDEA-20260811-b3a355, IDEA-20260901-48b364).
        S_g with S_c = 0 reproduces IDEA-20260807-a127ab exactly.
      reproduction_check: >-
        Frozen fixture: on the smallest toy crater the two-ended walk must
        reproduce sqrt(h) scaling and the recovered path must certify (apply
        the chain to E', land on j(E_0)); on the group side the mode-B pull
        must reproduce a127ab's certificate [r_i] phi(P) == phi(R_i) on 20
        entries before any class-side number is read.
    observation_collision:
      observable: >-
        Per curve: online steps to a stored distinguished endpoint, the
        recovered vector, and a certificate (the explicit chain applied to E'
        lands on E_0 and pulls (P', Q') to a pair with the same k, checked
        against the toy ground-truth k).
      distinct_preimage_search: >-
        A short online time could come from (i) genuine merging into stored
        walks, (ii) the crater being so small that random stored vertices are
        hit by chance (BSGS regime), or (iii) a lookup that matches j without
        a valid vector. (ii) is separated by the random-vertex null (same S_c,
        no walk structure), (iii) by the certificate, and the relabelled Z/hZ
        control separates "torsor structure" from "elliptic structure".
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The per-curve transport charge expressed as a point (S_c, T_c) on a
          class-side frontier S_c T_c^2 = h, with the composite accounting of
          claim (C). Encoding exact (a stored DP with its vector IS a
          class-side advice entry); completeness and soundness spent in H1; cost
          loss: the ascent and orientation overheads, charged separately.
        predicted_gain: >-
          Per-curve p^{1/4} -> p^{1/6} at S_c = p^{1/6}; zero per target.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (online steps per curve) fixed and vary the
          forgotten structure: same walk on the real crater, on the relabelled
          Z/hZ torsor, and with the wrong hash seed. Predicted: identical on the
          first two (generic-action simulability), degraded to h/S_c on the
          third.
        predicted_gain: Separates torsor content from elliptic content at zero extra modelling cost.
    quantifier_order: >-
      FOR the declared toy craters, FOR the declared prime sets and hash, FOR
      S_c in the declared ladder, the measured merge exponent alpha is as
      reported with bootstrap intervals; EXISTS-or-not a class-side table
      achieving T_c = O(sqrt(h/S_c)) at cryptographic h is an EXTRAPOLATION
      under H2 and is labelled so wherever it appears. No statement of the form
      "for all walks on all torsors" is made.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the declared craters the class-side table achieves alpha = (value)
        against alpha = (value) on the wrong-walk and random-vertex nulls and
        (value) on the relabelled torsor, with every recovered path certified."
        It certifies nothing per target, nothing about a lower bound for group
        actions with preprocessing, and nothing at cryptographic h.
      nearby_object_control: >-
        The relabelled Z/hZ torsor with the same hash-directed walk is the
        object on which the conclusion must HOLD IDENTICALLY (the construction
        is generic); the wrong-walk arm is the object on which it must FAIL
        (no merging). A pipeline that cannot see both has not identified the
        load-bearing structure, which is the merging property of a deterministic
        step function.
    proof_obligations:
      - claim: The oriented hash-directed step is a well-defined function of the vertex and two walks that meet continue identically.
        responsibility: correctness
      - claim: The recovered vector gives an explicit chain E' -> E_0 whose mode-B pull preserves k (T1).
        responsibility: correctness
      - claim: Under H1 the Bernstein-Lange analysis transfers to the torsor, giving T_c^2 S_c = O(h).
        responsibility: runtime
      - claim: The composite accounting of (C) and its binding condition S_g > L^2 N^{1/2} S_c.
        responsibility: scope
      - claim: Class-side memory is S_c entries of O(log p) bits; precomputation about S_c T_c steps.
        responsibility: memory
    not_applicable_reason: null

  predictions:
    - metric: alpha_T = fitted exponent in T_c ~ (h/S_c)^alpha on the treatment arm over the S_c ladder, per crater, with bootstrap CI
      direction: lower
      minimum_effect: >-
        R-BL iff alpha_T in [0.40, 0.60] on every tested crater; R-NOMERGE iff
        alpha_T >= 0.80; INCONCLUSIVE between. Pre-registered anchors: 0.5
        (Bernstein-Lange law) and 1 (baby-step-giant-step regime).
    - metric: alpha_W, alpha_R = the same exponent on the wrong-walk and random-vertex arms
      direction: higher
      minimum_effect: >-
        Both >= 0.80; a null arm at alpha <= 0.6 means the crater is too small
        to separate merging from chance and the cell is void.
    - metric: paired difference alpha_T(real crater) - alpha_T(relabelled Z/hZ torsor)
      direction: same
      minimum_effect: >-
        Zero within the bootstrap spread (generic-action simulability). A
        persistent difference that GROWS with h is the only elliptic-content
        reading and triggers independent review before interpretation.
    - metric: certified path fraction (chain applied to E' lands on E_0; pulled pair has the ground-truth k)
      direction: same
      minimum_effect: 'exactly 1.000 on hits; any failure voids the instrument.'
    - metric: retention(alpha_mix) for a stored table whose vectors are a uniformly random alpha_mix fraction correct (IDEA-20260807-0e8977 design)
      direction: increasing
      minimum_effect: >-
        Affine in alpha_mix with slope within [0.95, 1.05] and intercept below
        2/h; a flat curve is the canonical artifact tell.
    - metric: per-step cost of the oriented crater step, in field operations, per ell
      direction: different
      minimum_effect: Reported as a measured constant with no predicted value; it feeds the composite accounting of (C).

  minimal_test:
    design: >-
      CELLS. Three ordinary classes chosen so the crater is enumerable and
      h = h(O_K) lies near 10^3, 10^4 and 10^5 (p of roughly 20, 27 and 34 bits;
      the class is fixed by (p, t) and the record freezes (p, t, D_0, f, h)
      before any walk). The crater is enumerated once by exhaustive oriented
      walking from one vertex for ground truth; every vertex gets its true
      vector relative to E_0 in the l-basis.
      WALK. r = 4 split primes (the four smallest split in O_K, typically among
      2, 3, 5, 7, 11, 13), one orientation each fixed by the Frobenius
      eigenvalue on the kernel, hash s(j) = j mod r; distinguished predicate
      "top d bits of j zero" with theta = 2^{-d} tuned so that 1/theta ~ T_c.
      LADDER. S_c in {h^{1/4}, h^{1/3}, h^{1/2}} entries, rounded; 200 fresh
      online start curves per cell drawn uniformly from the enumerated crater
      by a recorded PCG64 stream; online steps counted to the first stored hit
      (cap 8 h / S_c, capped runs reported separately as censored, never
      dropped).
      ARMS. T (treatment: table built with the same f from E_0); W (wrong
      walk: table built with a different hash seed); R (random vertices: S_c
      uniformly random crater vertices with their true vectors, no walk
      structure); Z (the identical pipeline on Z/hZ with a random bijective
      relabelling and the same hash-directed step rule on labels); P (planted
      identity: E' = E_0, T_c must be 0); MIX (alpha_mix sweep
      {0, 0.125, 0.25, 0.5, 0.75, 1} of correct vectors in the T table).
      CERTIFICATE. Every hit yields an explicit chain; the wrapper applies it
      to E' independently of the walker, checks j = j(E_0), pulls a toy
      (P', Q') with known k and checks the pulled pair's k by direct toy
      discrete log on E_0.
      GROUP SIDE. Not re-measured; the record cites a127ab for the group-side
      table and runs only its certificate fixture (20 entries) as C-BASE.
      OUTCOME TABLE. R-BL (alpha_T in [0.40, 0.60] on all three craters, nulls
      >= 0.80, Z indistinguishable from T, MIX affine): claim (B) stands at toy
      scale; the composite frontier (C) is recorded with measured constants and
      handed to a Coordinator decision on whether the high-advice regime is
      worth a contract. R-NOMERGE (alpha_T >= 0.80 on the treatment arm):
      claim (B) is false at the tested scale; the obstruction is the measured
      merge exponent, read against IDEA-20260801-007's collision-surface
      reading, and the per-curve charge stays at p^{1/4}. ARTIFACT (P arm
      nonzero, any certificate failure, MIX not affine, or a null arm at
      alpha <= 0.6): the run is void and says nothing about (B).
      FALSIFICATION THRESHOLD, FIXED NOW. R-BL is falsified iff alpha_T >= 0.70
      on the h ~ 10^5 crater; R-NOMERGE is falsified iff alpha_T <= 0.60 there.
      COST (estimate, order of magnitude). Implementation medium-high: an
      oriented crater walker (modular polynomials for ell <= 13 or Velu with
      Elkies kernels), DP store, vector arithmetic, chain evaluator, certificate
      wrapper; about 600 lines of Python on top of whatever transport code
      EV-ENDO-10109d's runs used (not read this session). Compute low: crater
      enumeration at h ~ 10^5 is about 10^5 oriented steps; walks total about
      10^7 steps across all arms; hours on one core.
    controls:
      - 'ARM Z: relabelled Z/hZ torsor, identical pipeline (generic-action simulability; must match ARM T).'
      - 'ARM W: wrong-walk table (must NOT merge; alpha >= 0.80).'
      - 'ARM R: random stored vertices with true vectors (BSGS regime; alpha >= 0.80).'
      - 'ARM P: E_prime = E_0 identity (T_c = 0 exactly).'
      - 'ARM MIX: alpha_mix dose-response, affine with slope 1 (IDEA-20260807-0e8977 design transferred to the class side).'
      - 'C-BASE: the two-ended sqrt(h) walk at S_c = 0 reproduced on every crater; a127ab certificate fixture on 20 group-side entries.'
      - 'Certificate on every hit, verified independently of the walker; censored runs reported, never dropped.'
    required_metrics:
      - online steps per curve per arm per S_c, with bootstrap CI and censoring counts
      - fitted alpha per arm per crater with CI and residuals
      - paired T-minus-Z difference per cell
      - certified-path fraction and pulled-pair k agreement
      - MIX slope, intercept, R^2
      - per-step field-operation cost per ell, precomputation steps, class-side table bytes
      - the composite accounting of claim (C) instantiated with the measured constants, labelled toy

  falsification_conditions:
    - 'R-BL falsified iff alpha_T >= 0.70 on the largest crater with nulls at >= 0.80 and ARM Z matching.'
    - 'R-NOMERGE falsified iff alpha_T <= 0.60 on the largest crater.'
    - 'Generic-action simulability reading falsified iff ARM T and ARM Z differ by more than the bootstrap spread AND the gap grows with h; routed to independent review, never interpreted in-record.'
    - 'Claim (C) as stated is falsified iff the composite accounting with measured constants shows the class-side term binding at S_g = N^{1/3}, L = 1 on any crater (it predicts it does not).'
    - >-
      Instrument falsified (run void) iff ARM P is nonzero, any certificate
      fails, MIX is not affine, or a null arm sits at alpha <= 0.6; a void run
      is not evidence about (B) (AGENTS.md rule 3).

  confounders:
    - >-
      Crater size is tiny at toy scale, so the baby-step-giant-step regime and
      the merge regime are separated by only a factor sqrt(h/S_c) ~ 10 at
      h = 10^4, S_c = h^{1/3}; the three-crater ladder and the pre-registered
      exponent bands exist for this, and h ~ 10^5 carries the decision.
    - >-
      The orientation rule (which of the two horizontal ell-neighbours is "the
      l direction") must be consistent across vertices or the walk is not a
      function on the torsor; a mis-oriented step turns the torsor walk into a
      walk on a Schreier graph and destroys merging in a way that mimics
      R-NOMERGE. The enumerated ground truth detects this: every step's label
      must match the true vector difference.
    - >-
      The hash s(j) = j mod r is not a random function; a different hash is one
      of the declared variations and is reported separately.
    - >-
      Fruitless cycles do not arise (no negation quotient on the torsor), but
      short cycles from l * l^{-1} cannot occur either since only one
      orientation per prime is used; cycles of length > r are possible and are
      counted.
    - >-
      One toy family of classes with f small; classes with large conductor pay
      the ascent (IDEA-20260901-48b364) which is charged separately and is not
      part of alpha.

  interpretation_limits:
    - Toy tier. Three craters, one prime set, one hash. Nothing transfers to cryptographic h by any argument in this record; H2 names the extrapolation.
    - >-
      NO PER-TARGET EXPONENT MOVES. The per-target online cost stays at
      sqrt(N/S_g) (KN-LIT-013); the per-curve transport exponent is the only
      quantity priced, and claim (C) says where it is lower order.
    - >-
      No lower bound for group actions with preprocessing is claimed; the
      class-side frontier is an upper bound realised by a construction.
    - >-
      The crater oracle is generic-action simulable and the group-side
      transport is a relabelling, so this record is CLOSED at exponent 1/2 per
      target without advice (RQ-GGMB-6eaabc) and delivers only the class-side
      (S_c, T_c) axis.
    - >-
      KN-OPEN-020 is not touched: no factor base, no relation mechanism.
    - >-
      R-NOMERGE, if it fires, is a statement about this walk on these craters,
      not a theorem about torsor walks.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Random-mapping behaviour of the oriented hash-directed crater walk.)
        For a crater torsor of size h under Cl(O_K), r >= 4 oriented small split
        primes and a hash s: F_p -> [r], the map f(E) = l_{s(j(E))} * E has the
        merge-time and basin-size statistics of a uniformly random mapping on
        h points, so that walks from S_c stored starts and one fresh start meet
        after c sqrt(h/S_c) fresh steps with c = O(1), uniformly for S_c <= h^{1/2}.
      rigorous_support: >-
        The rigorous ingredient is expansion: under GRH the Cayley graph of
        Cl(O_K) on small split primes is an expander, so O(log h)-step walks are
        close to uniform (Jao-Miller-Venkatesan, retrieved abstract). The
        random-mapping statistics beyond mixing imitate the classical analysis
        of Pollard rho and of Bernstein-Lange tables (KR-RHO-93979e for rho walks
        with random partitions; KR-RHO-ea34b8), transplanted from a group with
        an unrestricted step set to a torsor with r generators. That transplant
        is the heuristic content and IDEA-20260801-007 records a setting where
        restricted generators change the collision surface.
      validation_plan: >-
        SAMPLE: 200 fresh starts per (crater, S_c) cell on three enumerated
        craters with h near 10^3, 10^4, 10^5 (the enumeration is the shortcut
        that makes ground truth available; no Deuring-type sampling is needed
        at these sizes). COMPARE: the empirical distribution of online steps
        against the random-mapping merge law (Rayleigh-type tail with mean
        c sqrt(h/S_c)) by Kolmogorov-Smirnov, and against ARM Z, which IS a
        random-mapping on a relabelled torsor. TAIL: the 99th percentile and
        the number of censored runs per cell reported beside the mean; a heavy
        tail attributed to short cycles is counted separately. TRANSFER
        ASSUMPTION: H1 is validated only for h <= 10^5 and r = 4; its use at
        cryptographic h is H2.
    - id: H2
      statement: >-
        (Scale transfer.) The merge exponent alpha measured at h <= 10^5
        persists to h ~ p^{1/2} at cryptographic p, so that T_c = O(sqrt(h/S_c))
        holds there.
      rigorous_support: >-
        None rigorous. Imitates the standard assumption that random-mapping
        statistics are scale-free, which is true for genuinely random mappings
        and is exactly what is in question for a walk with r generators.
      validation_plan: >-
        SAMPLE the three craters as a ladder and fit alpha per crater; a drift
        of alpha with h beyond the bootstrap spread refutes H2 at the tested
        scale. Any use at p ~ 2^256 is labelled extrapolation.

  heuristic_note: >-
    The composite accounting of claim (C) is bookkeeping and is exact given
    (B); (B) rests on H1; nothing at cryptographic scale rests on anything but
    H2, which is labelled an extrapolation everywhere.

  target_complexity:
    time_exponent: >-
      PER TARGET: unchanged, T_g = sqrt(N/S_g) group operations online
      (N^{1/3} at S_g = N^{1/3}), bound by KN-LIT-013. PER CURVE (the quantity
      this record prices): T_c = c sqrt(h/S_c) oriented isogeny steps under
      H1, i.e. p^{1/6+o(1)} at S_c = p^{1/6}, against p^{1/4+o(1)} with no
      class-side advice (IDEA-20260811-b3a355, IDEA-20260901-48b364). The
      class-side term is leading only when S_g > L^2 N^{1/2} S_c.
    memory_exponent: >-
      Group side S_g entries (N^{1/3} at the Bernstein-Lange point); class side
      S_c entries of O(log p) bits each (p^{1/6} at the operating point), plus
      O(T_c) for the chain. Disclosed as a real cost; rho needs O(1).
    best_known: >-
      Per target: Bernstein-Lange 1.77 N^{1/3} online after 1.24 N^{2/3}
      precomputation with N^{1/3} table (KR-RHO-ea34b8); rho 0.886 sqrt(N) at
      O(1) memory (KN-TECH-006); multi-target sqrt(2 L N) (KR-RHO-46c2c6). Per
      curve: p^{1/4} meet-in-the-middle or two-ended DP walk (b3a355, 48b364).
    hidden_overhead: >-
      The o(1) hides the ascent to the crater (polynomial, 48b364), the per-step
      orientation and modular-polynomial costs (polylog), the GRH condition on
      expansion, the Bernstein-Lange usefulness-selection overhead on the class
      side, and the fact that the class-side table is useful only when many
      curves of ONE class are attacked -- a threat model IDEA-20260807-e41559
      shows is thin for deployed curves (the quadratic twist is never in the
      class).
    tradeoff_note: >-
      Two independent van Oorschot-Wiener style tradeoffs, one per axis:
      S_g T_g^2 = N (lower-bounded, KN-LIT-013) and S_c T_c^2 = h (upper bound
      only, this record). Both parallelise linearly with distinguished points.
      The class-side axis never competes with rho on memory and never moves the
      per-target point.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Estimate. About 600 lines (oriented walker, DP store, vectors, chain
      evaluator, certificate wrapper); crater enumeration plus about 10^7 walk
