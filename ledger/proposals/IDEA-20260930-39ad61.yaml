    KN-LIT-013) forbids anything better per target. Per curve: no frontier row
    prices the transport step; the program's own IDEA-20260811-b3a355 (p^{1/4},
    p^{1/4} memory) and IDEA-20260901-48b364 (h(O_K)^{1/2}) are the incumbents,
    and this record dominates them on per-curve time only in exchange for
    class-side memory and only under H1. Isogeny walks still reach no weaker
    curve (KR-RHO-755e35) and the automorphism constant (KR-RHO-0528e7) is
    orthogonal. As an attack the record occupies no new Pareto point per
    target; "n/a (no per-target result claimed)" is the honest answer there.

