idea:
  id: IDEA-20260815-e0b239
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-15'
  title: >-
    GLV DECOMPOSITION IS ACCEPTED AS A CONSTANT-FACTOR SPEEDUP AND NOBODY
    HAS MEASURED WHETHER THE CONSTANT IMPROVES POLLARD RHO'S WALK RATHER
    THAN JUST ITS ARITHMETIC
  class: measurement

  claim: >-
    GLV curves admit an efficiently computable endomorphism used to speed up
    scalar multiplication. Rho's cost is a step count times a per-step cost,
    and the endomorphism can in principle reduce the step count too by
    giving equivalence classes under the automorphism, which is the
    classical automorphism speedup. Whether the two effects compose or
    interfere on real GLV curves is measurable and is not recorded here.

  mechanism: >-
    Implement rho with and without endomorphism-class reduction on GLV
    curves and on matched non-GLV controls. Measure step count and wall
    clock separately so an arithmetic gain is not mistaken for a walk gain.

  novelty_status: known

  novelty_screen:
    method: >-
      Grep 'GLV' (23), 'automorphism speedup', 'equivalence class walk';
      read of GOAL-ENDO-001.
    results: >-
      GLV appears mainly as fast arithmetic; the classical automorphism
      speedup for rho is known in the literature, and no record here
      measures the two effects separately or their composition.
    verdict: >-
      KNOWN in substance: both the GLV arithmetic speedup and the
      automorphism walk speedup are published, and their sqrt(m) factor is
      classical. The contribution is measuring their composition on the
      program's own baseline, which matters only because the campaign's
      rho baseline is unmeasured.

  object_first_candidate:
    tracked_object: >-
      THE STEP COUNT and the PER-STEP COST of rho, measured separately,
      under endomorphism-class reduction.
    lossiness: >-
      Reporting only wall clock conflates the two effects, which is
      precisely the conflation this record separates.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives on curves with an efficiently computable endomorphism;
      matched non-GLV controls bound what is attributable to the
      endomorphism.

  null_object_control: >-
    NULL 1 -- non-GLV curves at matched size, where class reduction is
    unavailable and the step count must match the plain baseline. NULL 2 --
    GLV curves with class reduction disabled, isolating the arithmetic gain
    from the walk gain.

  discriminated_from:
    - >-
        The published automorphism speedup for rho, which gives the
        expected sqrt(m) step-count factor and is the prediction this
        record checks rather than discovers.
    - >-
        The measured-rho-baseline record in this series, which this one
        extends with the endomorphism arm and should share its
        implementation.

  assumptions:
    - >-
        Efficiently computable endomorphisms are available on the test
        curves.
    - >-
        Class-reduction bookkeeping does not itself cost more than it
        saves, which is the practical question and is measured rather than
        assumed.

  predictions:
    - metric: >-
        step count under class reduction versus plain rho
      direction: lower
      minimum_effect: >-
        PREDICTED to fall by roughly the classical sqrt(m) factor; a
        departure indicates a bookkeeping problem rather than a
        discovery.
    - metric: >-
        per-step cost under class reduction
      direction: higher
      minimum_effect: >-
        PREDICTED to rise, since canonical-representative computation is
        extra work; the net effect is the measurement.
    - metric: >-
        non-GLV control step count
      direction: different
      minimum_effect: >-
        FORCED to match plain rho; a difference means the harness is not
        isolating the endomorphism.

  minimal_test:
    design: >-
      Two GLV curves, two matched non-GLV controls, both arms, thirty
      instances each.
    controls:
      - >-
          Non-GLV matched controls.
      - >-
          GLV curves with class reduction disabled.
      - >-
          Step count and per-step cost reported separately, never as
          wall clock alone.
    required_metrics:
      - >-
          Step count and wall clock per arm and curve.
      - >-
          Per-step cost derived from both.
      - >-
          Net speedup with interval.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        The non-GLV control shows a step-count change. Harness not
        isolating the endomorphism.
    - >-
        Step count does not fall under class reduction. Bookkeeping is
        wrong; the classical factor is well established.
    - >-
        The net effect is a slowdown. Canonical-representative cost
        exceeds the walk saving at these sizes, which is a useful
        practical finding for the campaign's baseline.
    - >-
        The two effects compose multiplicatively. The campaign's rho
        baseline on GLV curves is understated and must be corrected before
        any comparison uses it.

  confounders:
    - >-
        CONFLATING ARITHMETIC AND WALK GAINS, the specific error this
        record exists to prevent; only separate step-count and per-step
        reporting avoids it.
    - >-
        TOY-SIZE BOOKKEEPING OVERHEAD: canonical-representative cost is a
        larger share of per-step cost at small sizes, so the net effect
        may reverse with size.

  interpretation_limits:
    - >-
        Measures a classical speedup's composition; claims no new
        algorithm.
    - >-
        Scoped to the tested curves, sizes and implementation.
    - >-
        Any net gain is a constant factor and is explicitly not target-
        class under docs/target-result-profile.md.

  heuristic_assumptions:
    - id: HEUR-GLV-COMP-1
      statement: >-
        The automorphism walk speedup and the GLV arithmetic speedup
        compose multiplicatively on curves admitting both.
      rigorous_support: >-
        Rigorous ingredient: the automorphism speedup is a step-count
        factor from walking on equivalence classes, and the arithmetic
        speedup is a per-step factor; the two act on different terms of
        the product. THE GAP: class reduction requires computing a
        canonical representative every step, which is itself arithmetic,
        so the two are not independent and the composition may be
        sublinear or negative.
      falsification_condition: >-
        A measured net speedup materially below the product of the two
        separately measured factors.
      validation_plan: >-
        SAMPLE: both arms on >= 2 GLV curves x >= 30 instances, at >= 2
        sizes so the size trend in bookkeeping overhead is visible. TAIL
        CHECK: the smallest size, where overhead dominates. TRANSFER:
        none beyond tested sizes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is rho solves in both arms across curves and
      sizes.
    memory_exponent: >-
      Distinguished-point table, as in the plain baseline.
    best_known: >-
      Incumbents are the published GLV arithmetic and automorphism walk
      speedups, both classical; neither is improved and their composition
      is measured.
    hidden_overhead: >-
      Canonical-representative computation per step is the hidden cost
      that decides whether the composition is favourable at all.
    tradeoff_note: >-
      Class reduction buys steps and costs per-step work; the net is size-
      dependent and is the measurement.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As algorithms: entirely dominated by the
    classical GLV and automorphism-speedup literature. As a composition
    measurement on this program's baseline: none exists. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent, and explicitly a constant-factor question.
    Content delivered: separated step-count and per-step measurements for
    endomorphism-class-reduced rho on GLV curves, with matched non-GLV
    controls, correcting the campaign's rho baseline where GLV curves are
    used.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the classical step-count factor is reproduced. 0.6 that the net
    effect is favourable at toy sizes given bookkeeping overhead. 0.4 that
    the campaign's existing rho baseline is materially understated on GLV
    curves, which would be the practically relevant outcome.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ENDO-001
    - GOAL-ENDO-001
