# IDEA-20261003-7a264e
# Addition-count for the integer 11. Proposal only. Not approved.
idea:
  id: IDEA-20261003-7a264e
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The integer 11 has bit length 4, 3 doublings, and 2 additions
  class: measurement
  claim: >-
    The integer 11 has bit length 4 and binary weight 3. Reaching
    it by doubling and adding uses 3 doublings and 2 additions.
    Four exceeds three by 1. Three exceeds two by 1. The product
    of 4, 3, and 2 is 24. Their sum is 9. The gap is a digit count,
    not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the binary expansion of the integer
    11, which is coordinate-dependent and is not a group element.
    The operation set is reading one bit and either doubling or
    doubling and adding. Two readings of the addition count both
    give 2, so that gap is 0. No curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-6654ba
      provenance: internal
      claim: >-
        Point halving on binary curves is a different object from
        these digit counts of the integer 11.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The integer 11 is frozen before the bits are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The gap between bit length 4 and addition count 2.
    baseline_embedding:
      parameter_slice: The counts 4, 3, and 2.
      reproduction_check: >-
        Two readers must agree that the bit length is 4, the
        doubling count is 3, and the addition count is 2.
    observation_collision:
      observable: The three counts and their product.
      distinct_preimage_search: >-
        Reporting the addition count as 3 drops the gap against
        the doubling count. Two readings of the addition count
        make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The integer 11.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The integer is fixed before the counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 4, 3, and 2. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 2, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 11 is 4.
        responsibility: size
      - claim: The doubling count is 3 and the addition count is 2.
        responsibility: size
      - claim: The product is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: digit_gap
      direction: different
      minimum_effect: Four exceeds two by 2.
  minimal_test:
    design: >-
      Read the bits of 11 and count doublings and additions. Do not
      add a curve point.
    controls:
      - Two readings of the addition count, whose gap is 0.
      - An independent count.
    required_metrics:
      - the bit length
      - the doubling count
      - the addition count
      - the product
  falsification_conditions:
    - The addition count is not 2.
    - The product of 4, 3, and 2 is not 24.
  confounders:
    - A non-adjacent recoding of 11 is a different digit string.
  interpretation_limits:
    - A digit count is not a walk length.
    - No transfer to a cryptographic scalar.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen integer 11 has bit length 4, binary weight 3,
        3 doublings, and 2 additions.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent readings. A mismatch voids the product.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: A different recoding is not counted.
    tradeoff_note: Fewer additions on one integer do not by themselves shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
