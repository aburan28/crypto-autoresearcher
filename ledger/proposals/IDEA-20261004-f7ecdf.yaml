  minimal_test:
    design: >-
      Count the reduced forms of discriminants -379 and -403. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 2, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -379 is not 3.
    - The product of the two class numbers is not 6.
  confounders:
    - The absolute values 379 and 403 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 3 and 2 of discriminants -283 and -267.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -379 has class number 3, and the
        frozen discriminant -403 has class number 2.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
