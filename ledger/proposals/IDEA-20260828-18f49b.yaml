idea:
  id: IDEA-20260828-18f49b
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    From a measured distinguisher excess to an executed filter: does the
    round-5 yoyo/boomerang quartet excess (established non-S-box-specific by
    EV-AES-048545) carry ANY key information when used as a wrong-key sieve
    at r=6, or is it a constant of the apparatus at the key-hypothesis level
    too?
  class: algorithm

  claim: >-
    BATCH-002's yoyo/boomerang quartet construction (mode A1) measures an
    r=5 hit count of 59 against a null expectation of 4.0 at N=2^32 chosen
    texts. GOAL-AES-003 checkpoint BATCH-713991 (EV-AES-048545, read in full
    via the goal record's own outcome text this session) subsequently
    measured that TWO INDEPENDENT UNIFORM RANDOM BIJECTIVE S-BOXES reproduce
    this excess (58 and 51 hits), with all controls inside a pre-registered
    [0,12] band -- establishing that the excess is a property of the ROUND
    GEOMETRY (ShiftRows/MixColumns coset structure, consistent with the
    MDS-geometry mechanism IDEA-20260808-83b3ba and IDEA-20260808-bfee7e
    independently probe, headers reviewed this session, full content not
    re-verified here) and NOT of the AES S-box's specific values. EVERY
    YOYO/BOOMERANG RECORD IN THIS CAMPAIGN MEASURES THE EFFECT ON A FIXED,
    KNOWN KEY: none guesses a key byte and asks whether the quartet count
    depends on whether the guess is right. THIS PROPOSAL BUILDS THAT MISSING
    STEP AND IT DISCRIMINATES A QUESTION THE PRIOR WORK CANNOT ANSWER: an
    effect can be independent of the S-BOX's identity while still depending
    on the KEY's VALUE (the S-box-substitution test only ever varied the
    S-box, holding the TRUE key fixed and known throughout); whether the
    r=5/r=6 yoyo excess is ALSO key-independent -- literally unable to
    distinguish a right partial-key guess from a wrong one -- is a separate,
    untested claim. TWO MUTUALLY EXCLUSIVE OUTCOMES: (i) appending one round
    to the r=5 core with a HYPOTHESIZED byte of the boundary round key (the
    yoyo "swap" boundary), and re-running the quartet-count statistic once
    per candidate byte value, shows the TRUE byte's quartet count separated
    from the WRONG-byte population by a measured, pre-registered margin --
    the campaign's first EXECUTABLE boomerang-family key-recovery filter,
    whose resulting hint budget h is then priced against REF-B's h*/B(h)
    curve (IDEA-20260805-72ec9a) exactly as attack6n was; or (ii) the
    true-byte count is statistically indistinguishable from the wrong-byte
    population (both drawn from the SAME forced distribution regardless of
    key hypothesis) -- which PROVES, rather than merely leaves open, that
    this specific measured excess is vacuous as an attack primitive: an
    effect that is a genuine, controlled, non-null observation against a
    random-permutation baseline, and is SIMULTANEOUSLY unusable for key
    recovery because it carries no information about which key byte
    produced it. Neither outcome is assumed.

  mechanism: >-
    The r=5 A1 construction's quartet condition is, by the campaign's own
    convention, a function of the round key ONLY THROUGH the cipher's actual
    evaluation on the fixed target key -- the construction never separates
    "the condition as evaluated under a HYPOTHESIZED key byte" from "the
    condition as evaluated under the true key", because it has never needed
    to: it audits a distinguisher, and a distinguisher needs no key
    hypothesis. THE CONVERSION NEEDED IS THE SAME ONE ATTACK6N ALREADY
    PERFORMS FOR ITS INTEGRAL CORE: append one round beyond the tested
    distinguisher's boundary, and for each candidate value of the appended
    round's key byte(s) touching the yoyo swap boundary, PARTIALLY DECRYPT
    the observed ciphertexts by that candidate before re-evaluating the SAME
    quartet-matching condition the A1 instrument already computes.
    STAGE 0 (zero compute, MANDATORY BEFORE ANY CODE): re-read the A1 source
    in sq_null.c (or wherever BATCH-002's A1 mode lives) and identify (a)
    the exact byte position(s) of the yoyo swap boundary, (b) whether that
    boundary sits at a round boundary where a SINGLE round-key byte,
    appended after the r=5 core, suffices to peel one round of
    encryption/decryption before the quartet check, and (c) whether the
    boundary is even reachable at r=6 with the pinned round-key/MixColumns
    convention. IF (b) OR (c) FAILS, THE CONSTRUCTION AS SPECIFIED IS NOT
    BUILDABLE AT r=6 UNDER THIS CONVENTION AND THAT IS ITSELF A RECORDED,
    ZERO-COMPUTE OUTCOME -- a scoped barrier statement about this specific
    extension, never a claim about boomerang attacks on AES generally.
    Given (b) and (c) hold, the filter is: for each of up to 256 candidate
    values of the appended byte, partially decrypt the observed ciphertext
    quartets by that candidate, recompute the A1 quartet-match statistic,
    and record its value; the TRUE candidate's value is compared against the
    population of WRONG-candidate values using a matched random-permutation
    sibling null (identical procedure on a keyed 10-round-AES permutation
    surrogate, per the campaign's existing convention) and a uniform-random-
    bijective-S-box sibling (reusing EV-AES-048545's own two S-box instances
    if their code is reachable, or freshly generated ones if not).

  why_not_a_renamed_known_approach: >-
    Boomerang/yoyo and its use for key recovery (as opposed to
    distinguishing) is a NAMED, ESTABLISHED FAMILY on RQ-AES-003's own
    off-limits-as-primary-lens list ("boomerang and retracing boomerang"),
    and this proposal makes NO claim that appending a key-recovery round to
    a boomerang/yoyo distinguisher is itself novel -- it is textbook.
    RQ-AES-003 explicitly exempts the baseline/implementation arm from that
    restriction, exactly as it does for DS-MITM (IDEA-20260828-0155e5) and
    key-bridging (IDEA-20260828-6cf68c) in this same round. What is new,
    checked against every record this session has read in full
    (IDEA-20260805-72ec9a, f2fc33, c8c0d4, 86e431; IDEA-20260828-0155e5,
    6cf68c, da36ef, c65b10), is that NONE of them converts THIS SPECIFIC
    MEASURED EXCESS into an executed key-hypothesis-dependent filter --
    every existing yoyo/boomerang record in this campaign (BATCH-002 A1,
    BATCH-713991/EV-AES-048545, and per header review IDEA-20260808-83b3ba
    and IDEA-20260808-bfee7e) treats the key as fixed and known and asks
    only about the S-box or the linear layer's branch number. The genuinely
    new content is the OUTER KEY-HYPOTHESIS LOOP and the resulting
    discriminating test, not the underlying attack family.

  object_first_candidate:
    tracked_object: >-
      The per-key-hypothesis quartet-match count -- the A1 statistic,
      RE-EVALUATED once per candidate value of one appended round-key byte,
      rather than once for the fixed true key -- together with its
      population distribution over wrong candidates and its separation (if
      any) from the true-candidate value.
    established_families_off_limits: >-
      Boomerang and retracing boomerang, named on RQ-AES-003's off-limits
      list as the primary lens; used here ONLY under the explicit
      baseline/implementation-arm exemption, exactly as DS-MITM and
      key-bridging are used elsewhere in this round. No novelty is claimed
      for the family.
    lossy_projection_identifiability_audit:
      projection: >-
        (full ciphertext quartet under a candidate partial decryption) -->
        (quartet-match bit) --> (count of matches over the whole structure,
        per candidate byte value).
      what_is_discarded: >-
        Every byte of the quartet except whether the yoyo-swap relation
        holds after the candidate partial decryption; which specific
        quartet matched; everything about candidates that agree on the
        count.
      is_it_only_a_change_of_coordinates: >-
        NO -- 256 candidate partial decryptions of a 2^32-structure collapse
        to 256 integers, and the entire point of the experiment is that
        this 256-way collapse might (outcome i) or might not (outcome ii)
        still separate the true candidate from the rest. This is genuinely
        lossy in the direction that matters: if it separates the true key
        even after this much discarding, that is a strong result; if it
        does not, the discarding has proved nothing was there to keep.

  novelty_status: unverified

  citations:
    - ref: "GOAL-AES-003.yaml batch_checkpoints entry BATCH-713991 (EV-AES-048545, DEC-20260804-73977c)"
      provenance: internal
      claim: >-
        Two independent uniform random bijective S-boxes reproduce the r=5
        yoyo/boomerang hit count (58, 51 vs AES 59, null 4.0, N=2^32), with
        all controls inside a pre-registered [0,12] band; the effect is not
        S-box-specific.
      verified_by: "idea-generator subagent, read this exact outcome text in full via ledger/goals/GOAL-AES-003.yaml this session"
    - ref: "IDEA-20260808-83b3ba (branch-number-as-knob control)"
      provenance: internal
      claim: >-
        The r=5 yoyo excess is hypothesized to arise from MDS coset
        geometry, predicted monotone in the linear layer's branch number.
      verified_by: "idea-generator subagent (header/title reviewed only this session; full content not re-verified)"
    - ref: "IDEA-20260808-bfee7e (closed-form null for the r=5 yoyo excess)"
      provenance: internal
      claim: >-
        A closed-form ShiftRows/MixColumns-geometry null for the r=5 yoyo
        excess is derivable with zero cipher evaluations.
      verified_by: "idea-generator subagent (header/title reviewed only this session; full content not re-verified)"
    - ref: "classical boomerang / yoyo key-recovery extension (textbook technique: append a round, guess a boundary key byte, filter by the quartet relation)"
      provenance: recalled
      claim: A boomerang/yoyo distinguisher is converted to key recovery by appending a round and guessing the boundary key material, filtering candidates by quartet survival.
      verified_by: null

  assumptions:
    - >-
      The A1 construction's yoyo-swap boundary sits at a byte-aligned round
      boundary reachable by a single appended round under the pinned
      convention; NOT assumed to hold and checked at Stage 0 before any
      code.
    - >-
      The random-permutation and random-S-box sibling nulls from
      EV-AES-048545 are reusable (code or parameters recoverable) or can be
      regenerated at equivalent scale without materially changing the
      pre-registered [0,12] band.

  proof_search_map:
    bottleneck: >-
      Whether the yoyo-swap boundary condition, once re-evaluated under a
      WRONG appended-round-key byte, is a genuinely DIFFERENT function of
      the ciphertext than under the true byte, or whether the round
      geometry that produces the r=5 excess is so coarse that the appended
      round's candidate value never enters the computation that actually
      produces "hits" (in which case every candidate necessarily reads the
      same count and outcome (ii) is forced by construction, not measured).
    baseline_embedding:
      parameter_slice: >-
        The TRUE key hypothesis reproduces the already-committed BATCH-002
        A1 r=5 count (59) and EV-AES-048545's structure exactly, since it is
        the same computation with the appended round undone correctly; this
        is the zero-cost reproduction check before any wrong-candidate
        sweep is run.
      reproduction_check: >-
        Exact reproduction of the committed count 59 (or its r=6-appropriate
        analogue) under the true-key candidate, before any other candidate
        is evaluated.
    observation_collision:
      observable: "the quartet-match count as a function of candidate byte value."
      distinct_preimage_search: >-
        Two distinct ground-truth mechanisms produce the SAME observable if
        the appended round's candidate value does not actually enter the
        quartet test's live computation path (a wiring defect identical in
        shape to the f2fc33 failure mode) -- guarded by requiring the
        true-candidate count to reproduce the committed 59 exactly AND
        requiring at least one wrong candidate to differ from it before any
        claim is made either way.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          the per-candidate quartet-count vector (up to 256 integers)
          replacing the single fixed-key count the campaign currently
          reports.
        predicted_gain: >-
          Either a working key-recovery filter with a measurable h, or a
          constructive proof that this excess carries zero key information
          -- both new to the campaign.
    quantifier_order: >-
      FOR the pinned A1 construction and boundary, THERE EXISTS a candidate
      byte value (the true one) whose quartet count is measurably separated
      from the population of the other 255; the claim is existential over
      ONE appended byte at ONE boundary, never a claim about boomerang key
      recovery on AES in general.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at this boundary and this round count, the true
        candidate's quartet count is (or is not) separated from wrong
        candidates by a stated margin, against a matched random-permutation
        and random-S-box null." It certifies nothing about boomerang
        attacks generally and nothing about full-round AES.
      nearby_object_control: >-
        The random-permutation sibling null with a HYPOTHESIZED
        (necessarily meaningless) key byte swept identically: since the
        permutation has no key structure at all, every candidate must read
        the SAME forced null count. If the permutation control shows
        separation across candidates, the sweep procedure itself is broken
        and no AES reading is trustworthy.
    proof_obligations:
      - claim: "the true-candidate count reproduces the committed r=5 value of 59 exactly."
        responsibility: baseline
      - claim: "the random-permutation control shows NO separation across candidates."
        responsibility: correctness
      - claim: "any reported h is priced against REF-B's B(h) curve, never against the published frontier."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: "true-candidate quartet count vs the committed r=5 value (59)"
      direction: different
      minimum_effect: "exact reproduction is required before anything else is trusted; a mismatch stops the line"
    - metric: "separation (in empirical standard errors) between the true candidate's count and the population of 255 wrong candidates"
      direction: higher
      minimum_effect: >-
        No minimum is assumed in advance; both a large separation (outcome
        i) and no separation beyond noise (outcome ii) are pre-registered
        as informative. A decision threshold of 4 empirical standard errors
        is set before the sweep is read.
    - metric: "random-permutation control's separation across the same 256 candidates"
      direction: lower
      minimum_effect: "FORCED to be zero beyond sampling noise; any measured separation here voids the whole reading"

  minimal_test:
    design: >-
      STAGE 0 (zero compute): re-read the A1 source, identify the
      yoyo-swap boundary and confirm a single appended round-key byte can be
      peeled before the quartet test; if not, stop and record the barrier
      statement. STAGE 1 (cheap, reproduction): run the true-key candidate
      only and confirm it reproduces the committed r=5 count exactly.
      STAGE 2 (the sweep): run all up to 256 candidate values of the
      appended byte at the same structure count, recording the quartet
      count per candidate. STAGE 3 (controls): run the identical sweep
      against a matched 10-round-AES permutation surrogate and, if the code
      is reachable, EV-AES-048545's own uniform-random-bijective S-box
      instances. STAGE 4 (verdict and pricing): if separated, compute the
      resulting h from the number of candidates excluded and price it
      against REF-B's B(h) curve; if not separated, record the constructive
      negative result.
    controls:
      - "True-candidate exact reproduction of the committed r=5 count (must pass before anything else is trusted)"
      - "Random-permutation sibling sweep over the same 256 candidates (must show zero separation)"
      - "Random-S-box sibling sweep, reusing or regenerating EV-AES-048545's instances"
    required_metrics:
      - "per-candidate quartet count (up to 256 integers), per null arm"
      - "separation in empirical standard errors between true candidate and wrong-candidate population"
      - "resulting h and its priced cost against REF-B's B(h), if outcome (i)"

  falsification_conditions:
    - "The true-candidate count fails to reproduce the committed r=5 value of 59 -- the re-implementation is wrong, stop."
    - "The random-permutation control shows nonzero separation across candidates -- the sweep procedure is broken, no AES reading is trustworthy."
    - "Stage 0 finds no single-byte appended-round boundary reachable at r=6 under the pinned convention -- barrier statement, not a claim about boomerang attacks generally."

  confounders:
    - "The A1 construction's exact swap boundary is unknown to this proposing session and may not admit a clean one-byte appended-round peel; Stage 0 is designed to catch this before compute is spent."
    - "Reuse of EV-AES-048545's exact S-box instances may not be possible if their generating seed is not committed; a freshly generated pair at equivalent scale is an acceptable substitute and must be stated as such."
    - "Multiple hypothesis testing across up to 256 candidates requires the decision threshold to be set BEFORE the sweep is read, not chosen after seeing which candidate looks best."

  interpretation_limits:
    - "Toy tier, reduced-round only, no statement about full-round or deployed AES."
    - "No comparison to the published boomerang/yoyo literature in either direction (R3)."
    - "A negative result (outcome ii) says this SPECIFIC excess at THIS boundary carries no key information; it does not foreclose every boomerang-family construction on reduced-round AES."

  heuristic_assumptions:
    - id: H1
      statement: >-
        Under a WRONG candidate value of the appended round-key byte, the
        partially-decrypted quartet-match statistic is drawn from the same
        null distribution as under a random permutation of the same shape
        (the standard wrong-key-randomization heuristic, applied here to a
        boomerang/yoyo filter rather than to an integral one).
      rigorous_support: >-
        Not proved. This is the boomerang-family analogue of the U1
        assumption IDEA-20260805-f2fc33 measures for the integral filter,
        and of the structured-deviation concern IDEA-20260828-da36ef raises
        for the same U1 assumption; no prior record in this campaign has
        measured it for a boomerang/yoyo construction specifically.
      validation_plan: >-
        The minimal_test's Stage 3 controls ARE the validation: the
        random-permutation sweep over all 256 candidates must show zero
        separation, at the same scale as the real-cipher sweep, before any
        cipher reading is trusted.

  target_complexity:
    time_exponent: >-
      No exponent moved against AES generically. If outcome (i) obtains,
      the target is a measured h from the number of excluded candidates,
      priced against REF-B's B(h) exactly as attack6n was
      (IDEA-20260805-72ec9a); if outcome (ii), no attack complexity is
      claimed at all.
    memory_exponent: >-
      Unchanged from the existing A1 instrument's memory footprint (a 2^32-
      text structure and small per-candidate counters); to be measured, not
      assumed.
    best_known: "REF-A (definitional) and REF-B (IDEA-20260805-72ec9a's frozen curve, once committed)."
    hidden_overhead: >-
      None disclosed beyond what the A1 instrument already carries; the
      256-candidate sweep multiplies the instrument's cost by at most 256x,
      which must be measured against the producer-task envelope before
      Stage 2 is run.
    tradeoff_note: >-
      If outcome (i) obtains, the same time-memory-data tradeoff structure
      REF-B already exposes applies; if outcome (ii), there is no tradeoff
      to state.

  dominated_by: >-
    For the distinguisher axis: dominated by nothing checked here (different
    axis; EV-AES-048545 already established the S-box-non-specificity
    finding and this record does not re-litigate it). For the key-recovery
    axis: REF-B (IDEA-20260805-72ec9a's h*/B(h) curve, once frozen) is the
    row to beat if outcome (i) obtains. Checked REF-A, REF-B, and every
    record read in full this session (72ec9a, f2fc33, c8c0d4, 86e431,
    0155e5, 6cf68c, da36ef, c65b10); none attempts a key-hypothesis-dependent
    boomerang/yoyo filter.
  sota_delta: >-
    Against REF-A: any successful filter beats it astronomically and
    uninformatively, per R3. Against REF-B: UNKNOWN UNTIL EXECUTED. Against
    REF-C: not applicable, this is a key-recovery attempt, not a
    distinguisher claim. Published-frontier comparison: UNADJUDICABLE in
    this environment (R3).

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  source_refs:
    - RQ-AES-003
    - GOAL-AES-003
    - IDEA-20260805-72ec9a
    - IDEA-20260805-f2fc33
    - IDEA-20260828-da36ef
    - IDEA-20260808-83b3ba
    - IDEA-20260808-bfee7e
