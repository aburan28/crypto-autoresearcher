idea:
  id: IDEA-20260805-db5afa
  question_id: RQ-HQC-001
  added: '2026-08-05'
  title: >-
    The evaluation character of F_2[X]/(X^n - 1) is the only nontrivial ring
    projection HQC has, and it forces w(e') = w_e mod 2 exactly: a zero-compute
    disproof of assumption A5, a derived (1-2p*)^l damping law, and the
    confounder the queued joint-moment measurement does not control for
  class: control

  claim: >-
    For every HQC instance, the Hamming weight of the error vector
    e' = x.r2 - r1.y + e, taken over the FULL ambient length n, satisfies
    w(e') = w_e (mod 2) DETERMINISTICALLY - not with high probability, not in
    distribution, but for every choice of x, y, r1, r2, e admitted by the
    scheme's own fixed-weight sampler. The reason is one line: evaluation at
    X = 1 is a ring homomorphism F_2[X]/(X^n - 1) -> F_2, so
    e'(1) = x(1)r2(1) + r1(1)y(1) + e(1) = w.w_r + w_r.w + w_e = w_e (mod 2),
    the two convolution terms cancelling identically because x and y carry the
    same weight w and r1, r2 carry the same weight w_r. SPEC assumption A5
    (transcribed at
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md)
    models the coordinates of e' as independent Bernoulli(p*), under which
    Eq. (3) assigns probability (1 + (1-2p*)^n)/2 = 0.5 + 1e-2400 to the WRONG
    parity class. A5 is therefore not merely a simplification: it is exactly
    false, and it is false in a way that can be exhibited with no compute and
    no simulation. THIS IS NOT AN ATTACK AND NOT A BREAK. The consequence for
    HQC's own parameters is damped by the l = n - n1.n2 trailing coordinates
    that A23 truncates before the concatenated code ever sees the error, and
    the damping factor is itself derivable: the parity bias surviving
    truncation is exactly (1-2p*)^l, which is 3.378e-03 / 7.191e-07 /
    1.105e-22 at HQC-1 / HQC-3 / HQC-5. The deliverable is threefold: a proved
    dependence channel with an exact magnitude (the first quantitative bound on
    ANY dependence channel in this campaign), a graded artifact test with a
    forced decay law, and a mandatory confounder control for the joint-moment
    measurement GOAL-HQC-001's next_action queues - because a reduced parameter
    set chosen without regard to l will measure this algebraic identity and
    report it as inner-decoder dependence.

  object_first_candidate:
    tracked_object: >-
      The image of the ciphertext-error computation under the evaluation
      character chi_1: F_2[X]/(X^n - 1) -> F_2, f -> f(1) (equivalently: the
      parity of the Hamming weight; equivalently: the coordinate of f in the
      F_2 factor of the CRT decomposition of the ambient ring). It is followed
      through the whole computation - keygen (x, y), encryption randomness
      (r1, r2, e), the two cyclic convolutions, the sum, and finally the
      truncation to the first n1.n2 coordinates, which is the one step in the
      chain that does NOT commute with chi_1 and is therefore where the
      information is destroyed and where the (1-2p*)^l law comes from.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this proposal:
      (i) information-set decoding and all its descendants (Prange, Stern, MMT,
      BJMM, May-Ozerov, DOOM) - that is a separate proposal,
      IDEA-20260805-baa4da; (ii) the timing / power / single-trace
      implementation-attack line named in RQ-HQC-001.scope.targets[3];
      (iii) decryption-failure attacks in the Guo-Johansson sense (chosen
      ciphertext, precomputed failure-inducing vectors) - this proposal
      measures a model, not a key; (iv) algebraic structural attacks on
      quasi-cyclic codes (polynomial factorisation, folding); (v) the pairwise
      correlation of inner-decoder failure indicators, which DEC-20260802-9664c6
      D-6 already establishes cannot sign the direction and which the goal's
      queued lane already owns. The CRT / character lens IS the primary lens
      here and that is the point: it has never been pointed at HQC in this
      corpus.
    newness_score: >-
      The algebraic fact is elementary and an expert would call it obvious once
      stated; no claim of mathematical novelty is made and none should be
      inferred. What is new, and what this record supplies, is (a) that the
      identity is nowhere in this corpus - grep over knowledge/ returns no
      occurrence of "parity" in any of the three HQC KN-LIT entries filed by
      BATCH-002 (KN-LIT-b9e1a8, KN-LIT-1c9474, KN-LIT-4c1133), and none of the
      23 numbered assumptions in the BATCH-001 transcription records it;
      (b) that neither primary source transcribed by this program states it,
      although SPEC's own hedge H2 ("can realistically only be <= p*") is a
      claim about exactly this kind of conditioning; and (c) its conversion
      into a pre-registered graded control with a forced decay law, which is
      the deliverable the queued measurement lane lacks. Whether the identity
      appears in the external decryption-failure literature is UNKNOWN to this
      program and the audit's stage 0 is to look.
    testability_score: >-
      Maximal, and mostly free. The headline is checkable by hand in one line
      and confirmable by exhaustive enumeration at n = 7 in milliseconds. The
      graded decay law is measurable in pure Python plus numpy (both verified
      present in this container on 2026-08-05: numpy 2.4.6; sympy and scipy are
      NOT present) at 1e6 samples per cell in minutes.
    survival_score: >-
      The identity survives the entire computation exactly - it is a
      homomorphism, so it cannot fail to. It dies at exactly one step, the
      truncation, and it dies at a known rate. That the object has a single,
      identifiable, quantifiable death is what makes it useful rather than
      merely true.

  mechanism: >-
    DERIVED IN THIS RECORD. Every step below is elementary algebra over F_2 and
    is checkable without any source. Numbers marked [SESSION-COMPUTED] were
    computed during this generation session with the exact procedure stated and
    MUST be re-derived in-harness before any evidence record cites them; they
    are pre-registered forced values, not measurements.

    (1) THE RING. HQC works in R = F_2[X]/(X^n - 1). SPEC section 4.1, verbatim
    in the BATCH-001 transcription: "The parameter n denotes the length of the
    ambient space namely the smallest primitive prime greater than n1 n2."
    "Primitive prime" means n is prime and 2 is a primitive root mod n, i.e.
    ord_n(2) = n - 1. Then X^n - 1 = (X - 1) . Phi(X) over F_2 with Phi of
    degree n - 1 IRREDUCIBLE, so by CRT R = F_2 x F_{2^{n-1}} and R has
    EXACTLY TWO ring factors. [SESSION-COMPUTED, by explicit order computation
    over the factorisation of n-1: ord_n(2) = n - 1 holds for all three
    parameter sets - 17668 for n = 17669, 35850 for n = 35851, 57636 for
    n = 57637.] This is the number the program-wide angle inventory names as
    HQC's cheapest decisive gate, and it settles the multiplicative-split
    family in the direction it predicted: there is no rich CRT decomposition to
    exploit. But it does NOT settle it to nothing. It settles it to exactly one
    nontrivial projection, and that projection is not information-free.

    (2) THE PROJECTION. The unique nontrivial ring homomorphism R -> F_2 is
    chi_1: f -> f(1) = sum of coefficients mod 2 = w(f) mod 2. It is well
    defined because 1^n - 1 = 0, and multiplicative because it is evaluation.

    (3) THE IDENTITY. SPEC section 6.1 defines e' = x.r2 - r1.y + e, all
    products being products in R and subtraction being addition in
    characteristic 2. Applying chi_1:
      chi_1(e') = chi_1(x)chi_1(r2) + chi_1(r1)chi_1(y) + chi_1(e)
                = (w mod 2)(w_r mod 2) + (w_r mod 2)(w mod 2) + (w_e mod 2)
                = w_e mod 2.
    The two convolution terms are EQUAL, not merely equidistributed, because
    A1 fixes w(x) = w(y) = w and w(r1) = w(r2) = w_r. They cancel in
    characteristic 2 for every instance. Hence
      w(e') = w_e (mod 2)   with probability exactly 1.
    At HQC-1 and HQC-5, w_e = 75 and 149 are odd, so w(e') is ALWAYS ODD; at
    HQC-3, w_e = 114 is even, so w(e') is ALWAYS EVEN.

    (4) WHAT THIS DOES TO A5 AND EQ. (3). SPEC Eq. (3) states
    Pr[w(e') = d] = C(n,d) p*^d (1-p*)^{n-d}. Under it the parity of w(e') is
    Bernoulli with bias (1-2p*)^n, i.e. uniform to within 10^{-2400}. The true
    distribution is supported on ONE parity class. The total variation distance
    between the modelled and the true weight distribution is therefore AT LEAST
    1/2 - O((1-2p*)^n), which is essentially 1/2. A5 is not approximately true
    at the level of the weight distribution of e' over the full ambient length;
    it is maximally wrong there in the total-variation metric. This is a
    statement about the model as literally written and NOT yet a statement
    about the DFR, because the DFR is not a function of w(e') over the full
    ambient length - which is step (5), and is the honest part.

    (5) THE DAMPING, AND WHY THE HEADLINE IS NOT A BREAK. A23 records SPEC's
    own rule: computations are in length n, the concatenated code occupies the
    first n1.n2 coordinates, and the trailing l = n - n1.n2 coordinates are
    truncated. [SESSION-COMPUTED: l = 5, 11, 37 at HQC-1/3/5, from
    n1.n2 = 17664, 35840, 57600 against n = 17669, 35851, 57637.] The decoder
    sees e'_trunc, the first n1.n2 coordinates, and
      w(e'_trunc) = w(e') - w(tail),
    so the parity of w(e'_trunc) is determined by w_e mod 2 XOR parity(tail).
    IF the l tail coordinates were independent Bernoulli(p*) - which is A5
    again, now used only on l = 5 to 37 coordinates rather than on all n, and
    which RMRS Remark 4.2 explicitly supports for "a small proportion of HQC
    bits" - the parity bias of the truncated weight is exactly
      B(l) = |2.Pr[w(e'_trunc) = w_e mod 2] - 1| = (1 - 2p*)^l,
    the standard XOR-of-independent-bits bias identity. [SESSION-COMPUTED from
    the transcribed model in exact rationals: p* = 0.339788 / 0.361804 /
    0.372489 at HQC-1/3/5, reproducing SPEC Table 9's 0.3398 and Table 11's
    0.3618 and 0.3725 to every printed digit; hence
      B(5) = 3.378e-03, B(11) = 7.191e-07, B(37) = 1.105e-22.]
    So at HQC's own parameters the exact algebraic constraint is destroyed by
    an accident of parameter selection - the gap between n1.n2 and the next
    primitive prime - and the surviving distortion at NIST-5 is 1e-22, far
    below the 2^-256 DFR target's own scale and not a security-relevant
    quantity. SAY SO PLAINLY: this proposal does not weaken HQC.

    (6) WHY IT IS NEVERTHELESS WORTH RUNNING, IN THREE PARTS.
    (6a) IT IS THE FIRST QUANTIFIED DEPENDENCE CHANNEL IN THIS CAMPAIGN. Three
    batches have established that A17/A5's failure direction cannot be signed
    from the page (DEC-20260802-9664c6 D-6) and that the measurement is
    structurally infeasible at HQC's parameters (EV-HQC-0e9116: T_req ~ 1/DFR,
    3.4e41 / 6.8e59 / 8.4e79 trials). This channel is signed, exact, and needs
    no trials at all. It converts "the coordinates are not independent" from an
    assertion into a decomposition: dependence = (character channel, magnitude
    (1-2p*)^l, derived) + (residual, unknown).
    (6b) IT IS A CONFOUNDER FOR THE QUEUED MEASUREMENT, AND AN UNCONTROLLED
    ONE. The next_action directs BATCH-004 to measure the joint moment
    mu_{delta_e+1} of inner-decoder failure indicators on the true space (T) at
    REDUCED parameters. A reduced parameter set is a choice of (n, n1, n2, w,
    w_r, w_e) and therefore a choice of l. Nothing in the queued design fixes
    l, and at small l the character channel injects a real, algebraically
    forced dependence among block weights whose magnitude (1-2p*)^l can exceed
    the residual dependence the measurement is trying to see. The proposal's
    operational output is a SELECTION RULE: choose reduced parameters with
    (1-2p*)^l at or below the (1-2p*)^l of the HQC level being modelled, and
    report B(l) beside every joint moment. A measurement that does not do this
    is measuring an identity.
    (6c) IT IS A GRADED ARTIFACT TEST WITH A FORCED DECAY LAW. inventor
    protocol section 3 asks what a measured quantity SHOULD do as the parameter
    meant to destroy it increases. Here the answer is not a guess: the parity
    bias must decay as (1-2p*)^l, exactly, one geometric factor per truncated
    coordinate. A measured bias that does not decay at that rate localises the
    defect - too slow means a second, non-character dependence channel among
    the tail coordinates (which is a FINDING, and the most interesting outcome
    available); too fast, or absent at l = 0, means the instrument is broken
    and no negative may be reported.

    (7) THE CLOSURE THIS SUPPLIES, AT THE INVENTOR-PROTOCOL SECTION 4 STANDARD.
    Named obstruction: because ord_n(2) = n - 1 by HQC's own parameter
    selection rule, R has exactly two CRT factors, so the CRT/character family
    contains exactly ONE nontrivial projection, chi_1, and its entire content
    is the single parity bit derived above. Argument: any F_2-algebra
    homomorphism out of R factors through one of the two factors; the
    F_{2^{n-1}} factor is a field of degree n-1 and carries no proper quotient,
    so no further coordinate-wise-computable invariant is available from the
    ring decomposition. Forward guidance, naming what remains open: the
    residual dependence in e' is NOT of ring-decomposition origin and must come
    from the two structures the character cannot see - the FIXED WEIGHT of
    x, y, r1, r2, e (a global constraint the character reduces to one bit) and
    the SUPPORT GEOMETRY of the cyclic convolution (which coordinates of
    x.r2 collide). Those two are the open lanes, and the queued joint-moment
    measurement is aimed at the second of them.

  novelty_status: unverified
  novelty_screen:
