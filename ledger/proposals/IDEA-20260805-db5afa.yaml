      - knowledge/literature (14 files match "HQC")
      - knowledge/open-problems
      - ledger/proposals
      - ledger/decisions, ledger/evidence (all HQC records)
      - coordination/goals/GOAL-HQC-001 (all three batches, all task artifacts)
    grep_results:
      - >-
        No occurrence of "parity" in KN-LIT-b9e1a8, KN-LIT-1c9474,
        KN-LIT-4c1133 (the three HQC entries BATCH-002 filed), nor in
        KN-LIT-2141.
      - >-
        The BATCH-001 transcription's 23 numbered assumptions (A1-A23) and 10
        anomalies (X1-X10) contain no statement of the evaluation character,
        the CRT decomposition of the ambient ring, or any exact constraint on
        w(e').
      - >-
        ord_n(2) is computed nowhere in the corpus. The phrase "primitive
        prime" appears only inside the transcribed SPEC quotation.
      - >-
        IDEA-20260801-011, the only prior proposal on RQ-HQC-001, measures
