idea:
  id: IDEA-20260828-faca4f
  question_id: RQ-MLKEM-003
  added: '2026-08-28'
  title: >-
    A third attack family this RQ has never priced: memory-charge the Arora-Ge/Gröbner-basis
    algebraic attack (Steiner, EUROCRYPT 2024 / ePrint 2024/313, generic-coordinates Castelnuovo-
    Mumford-regularity bound) at FIPS 203's own (n, k_rank, q=3329, eta) and its hard sample-count
    ceiling m=n*k_rank, and report by how many orders of magnitude it is dominated by the committed
    core-SVP margin — turning an assumed dismissal into a computed, cited one
  class: control
  claim: >-
    (A) THE UNEXAMINED THIRD FAMILY. Twelve-plus batches of GOAL-MLKEM-003/004 and all 25 filed
    RQ-MLKEM-003 proposals evaluate exactly two attack families against ML-KEM's underlying MLWE
    problem: primal/BDD lattice reduction (core-SVP) and the dual/FFT statistical distinguisher. A
    targeted grep of ledger/ and knowledge/ this session found no proposal or knowledge entry
    mentioning Arora-Ge, Gröbner-basis, linearization, or algebraic attacks on LWE at all, anywhere
    in this repository. This matters specifically because ML-KEM's error/secret coordinates are
    drawn from a SMALL, bounded-support distribution (CBD_eta, eta in {2,3}) — exactly the regime
    Arora-Ge-style attacks are designed to exploit (small integer error/secret enables a low-degree
    noise-free polynomial system) — and because ML-KEM's module structure hard-caps the available
    sample count at m = n*k_rank (an attacker gets no fresh, independently-noised samples beyond the
    public key/ciphertext structure). Recent theoretical machinery (Matthias Johann Steiner, "The
    Complexity of Algebraic Algorithms for LWE," EUROCRYPT 2024 / ePrint 2024/313 / arXiv:2402.07852,
    confirmed to exist via consistent WebSearch results from dblp/IACR/Springer/arXiv this session)
    proves that the Arora-Ge polynomial satisfies a genericity condition (Caminata-Gorla's "generic
    coordinates"), which lets its Gröbner-basis complexity be bounded via the Castelnuovo-Mumford
    regularity and the Macaulay bound — making this a computable, falsifiable comparison for the
    first time without a from-scratch complexity derivation.
    (B) THE CLAIM, FALSIFIABLE. Applying Steiner's genericity-based complexity estimate to the
    Arora-Ge system at ML-KEM's exact (n=256*k_rank, m=n, q=3329, eta) for k_rank in {2,3,4}, and
    CHARGING MEMORY for the resulting linearization/Macaulay matrix at the same per-entry convention
    this program applies to sieve memory, produces a (time, memory) pair that EITHER (i) is
    dominated by the committed primal_bdd/RC.MATZOV cost by many more orders of magnitude than the
    smallest committed margin (+1.276377 bits) — closing this family with a NAMED, COMPUTED
    obstruction (the sample cap m=n interacting with the regularity degree) rather than assumed
    folklore — OR (ii) is closer to the committed lattice cost than the working assumption, which
    would be a first-of-its-kind quantitative check on an assumption this program has never actually
    evidenced.
    (C) WHAT IS FLAGGED, NOT CLAIMED. A WebSearch synthesis this session asserted a specific
    Kyber768 worked example inside Steiner's paper (15446 equations in 768 variables, m=n) — but a
    SEPARATE search explicitly stated the paper's own abstract contains no mention of Kyber768, and
    a direct WebFetch of the PDF returned only unreadable compressed binary. This numeric claim is
    UNVERIFIED and is Stage 0's first job to confirm or refute by reading the primary text (or its
    HTML mirror), not something this record asserts as established.
  mechanism: >-
    STAGE 0 (reading, zero compute). (0a) Fetch and read Steiner's ePrint 2024/313 or the HTML
    mirror arxiv.org/html/2402.07852v2 (the PDF fetch failed this session; the HTML version may parse
    more reliably) for the exact complexity formula and to CONFIRM OR REFUTE the unverified Kyber768
    numeric example. (0b) Fetch and read Arora-Ge's original 2011 construction and the
    Albrecht-Cid-Faugère-Fitzpatrick-Perret semi-regularity estimate (the pre-Steiner heuristic
    baseline Steiner's genericity result supersedes). (0c) Determine, from Steiner's text, whether
    the genericity/regularity result is proved for GENERIC (unstructured) LWE only, or whether it is
    known to transfer to MODULE-structured, sample-CAPPED instances (ML-KEM's rows are themselves
    NTT-friendly ring elements, not fully generic vectors); if the text does not resolve this, the
    record proceeds with the unstructured-case number as a stated, flagged UPPER-BOUND-flavored
    surrogate rather than a validated ML-KEM-specific estimate.
    STAGE 1 (arithmetic). Instantiate the formula at ML-KEM-512/768/1024's exact (n, m=n*k_rank,
    q=3329, eta) at the hard sample cap (not an arbitrarily larger m an unstructured-LWE attacker
    could request).
    STAGE 2 (memory charge). Charge memory for the resulting Macaulay/linearization matrix at one
    field-element unit per entry, matching this program's sieve-memory convention; state explicitly
    whether this charges the INITIAL matrix size or the (potentially much larger) intermediate
    fill-in during elimination, and flag whichever is NOT charged as a separate, larger possible cost.
    STAGE 3 (comparison). Compare against EV-MLKEM-020's committed primal_bdd/RC.MATZOV cost at the
    same three parameter sets, and against this session's sibling record (the memory-charged hybrid
    attack) if available, placing all three known LWE-attack families on one comparison table for
    the first time in this program.
    STAGE 4 (toy-scale genericity-transfer validation, per H1). Using the program's existing
    passagemath/Sage toolchain (KN-TECH-14efa5), construct a MODULE-structured Arora-Ge system and a
    matched UNSTRUCTURED control at toy scale (n=8-16, k_rank=1-2, q a small NTT-friendly prime,
    eta=2-3), compute exact Gröbner bases for both, and compare the observed regularity degree
    against Steiner's generic-coordinates prediction, at >=3 toy scales with >=8 random instances
    each.
  novelty_status: unverified
  novelty_screen:
    method: >-
      Grep of ledger/proposals/ for `Arora.?Ge|Gr.bner|linearization|BKW|algebraic attack`
      (case-insensitive) -> 41 files, none among the 25 RQ-MLKEM-003 files. Grep of knowledge/ for
      `Arora-Ge|Arora and Ge|2402\.07852|2024/313` -> 0 files. WebSearch: "Arora-Ge algebraic attack
      LWE small error Kyber ML-KEM linearization memory cost estimate" (9 links, one synthesized
      summary claimed a specific Kyber768 numeric instantiation inside the paper); WebSearch "The
      Complexity of Algebraic Algorithms for LWE arxiv 2402.07852 authors abstract Kyber768" (8
      links, a SECOND synthesis explicitly stated "the search results do not contain any mention of
      Kyber768 in connection with this paper" — a direct contradiction of the first synthesis, hence
      the numeric claim is flagged unverified rather than used). WebFetch
      https://arxiv.org/pdf/2402.07852 -> FAILED (returned unparseable compressed binary, no text
      extracted). WebSearch "Barbosa Hulsing... " and hybrid-attack searches (shared session with
      sibling records) additionally surfaced no Arora-Ge/Gröbner connection.
    results: >-
      No RQ-MLKEM-003 proposal, no other ledger record, and no knowledge/ entry addresses algebraic/
      Gröbner-basis attacks on ML-KEM or on LWE generally. The existence, author, venue, and general
      topic of Steiner's paper are corroborated by multiple independent, consistent WebSearch results
      (dblp, IACR eprint listing, Springer, ResearchGate, IACR CryptoDB); the specific Kyber768
      numeric application is NOT corroborated and is contradicted by one of the two searches.
    verdict: >-
      UNVERIFIED. Corpus-absence is corroborated by grep. The paper's existence/topic is corroborated
      by search but its content was not independently read (PDF fetch failed), and the one numeric
      claim that would most directly support this idea is explicitly flagged as possibly
      search-engine-synthesis noise rather than a real feature of the paper, pending Stage 0.
  citations:
    - ref: "Matthias Johann Steiner, \"The Complexity of Algebraic Algorithms for LWE\", EUROCRYPT 2024 / ePrint 2024/313 / arXiv:2402.07852"
      provenance: recalled
      claim: >-
        Proves the Arora-Ge polynomial system is "in generic coordinates" (a genericity condition of
        Caminata-Gorla), enabling complexity estimation of DRL Gröbner-basis computation via the
        Castelnuovo-Mumford regularity and the Macaulay bound. Title, author, venue, and this general
        abstract content confirmed by multiple consistent WebSearch results this session; a specific
        Kyber768 numeric instantiation (15446 equations, 768 variables, m=n) was asserted by one
        search synthesis and explicitly contradicted by another — UNVERIFIED, and direct WebFetch of
        the PDF failed (unparseable binary). Stage 0 must read the primary text or its HTML mirror
        before this citation is load-bearing for any ML-KEM-specific number.
      verified_by: null
    - ref: "Arora, Ge, \"New Algorithms for Learning in Presence of Errors\", ICALP 2011"
      provenance: recalled
      claim: Introduces the noise-free polynomial system construction for computing an LWE secret via linearization, given small bounded error.
      verified_by: null
    - ref: "Albrecht, Cid, Faugère, Fitzpatrick, Perret, \"On the complexity of the Arora-Ge Algorithm against LWE\""
      provenance: recalled
      claim: Prior (pre-Steiner) semi-regularity-based heuristic complexity estimate for Gröbner-basis computation on the Arora-Ge system, assuming semi-regularity without proof. Title confirmed via WebSearch (ResearchGate listing); content unread.
      verified_by: null
    - ref: EV-MLKEM-020 (committed evidence record, this repository)
      provenance: internal
      claim: "Committed primal_bdd/RC.MATZOV cost: 140.199 / 200.959 / 270.724 bits at the three FIPS 203 parameter sets."
      verified_by: >-
        Not independently opened this session; transcribed from verbatim quotations inside
        IDEA-20260821-374af4 and IDEA-20260821-46c09f, both read in full this session.
    - ref: KN-TECH-14efa5 (this repository)
      provenance: internal
      claim: Documents this program's existing passagemath-standard/fpylll/g6k toolchain, reusable here for the toy-scale Gröbner-basis computer-algebra validation (H1).
      verified_by: >-
        Not independently opened this session; cited verbatim within IDEA-20260821-374af4, which was
        read in full this session.
  assumptions:
    - "Steiner's genericity/regularity result is stated (or can be adapted) for sample-capped systems (m fixed, not free to grow), which is the practically relevant regime for a structured cryptographic instance; if the paper only treats m growing with n, the FIPS-203-scale instantiation in Stage 1 may not be licensed and Stage 0 must say so."
    - "The toy-scale Sage/passagemath computation is feasible within a modest compute budget at n=8-16; if Gröbner-basis computation blows up even at that scale, the validation plan's scale must shrink further and this is reported as a scoping constraint, not silently worked around."
  proof_search_map:
    bottleneck: >-
      The value of the semi-regularity / Castelnuovo-Mumford regularity degree d_reg for ML-KEM's
      SPECIFIC (structured, sample-capped) Arora-Ge system — this single integer determines both
      time and memory exponent, and whether Steiner's proved (for the unstructured, generic) bound on
      it transfers to the module-structured, sample-capped case is the step this record targets.
    baseline_embedding:
      parameter_slice: >-
        The classical Arora-Ge / Albrecht-Cid-Faugère-Fitzpatrick-Perret semi-regularity HEURISTIC
        estimate (unproven semi-regularity) is the old-method boundary; Steiner's paper is itself the
        "new method" whose baseline must be reproduced symbolically before ML-KEM's parameters are
        substituted.
      reproduction_check: >-
        Symbolic re-derivation of Steiner's regularity/Macaulay-bound formula from the read primary
        text, checked against any worked numeric example the paper itself provides, before
        substituting ML-KEM's parameters.
    observation_collision:
      observable: "The (time, memory) cost pair for the ML-KEM-parameterized Arora-Ge/Gröbner attack."
      distinct_preimage_search: >-
        An UNSTRUCTURED LWE instance and a MODULE-STRUCTURED ML-KEM instance of the same nominal
        (n, m, q, eta) could yield the SAME regularity degree if module structure genuinely does not
        affect genericity (Explanation 1), or could DIFFER if ring automorphisms impose extra
        algebraic relations that help or hurt the attacker (Explanation 2). Stage 4's toy-scale check
        is designed exactly to distinguish these two preimages of "the same nominal parameters,"
        rather than assume one.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: "Steiner's generic unstructured-LWE regularity/Macaulay bound, specialized (or shown not to transfer) to ML-KEM's exact module-structured, sample-capped instance."
        predicted_gain: "A computed order-of-magnitude gap against the committed lattice-attack cost, replacing an assumed dismissal with a cited number."
    quantifier_order: >-
      FOR EACH FIPS 203 parameter set, evaluating Steiner's formula (as read, and per Stage 4
      transferred or corrected for module structure) at the sample cap m=n*k_rank gives a (time,
      memory) pair; the claim is the SIGN and MAGNITUDE of that pair's bit-cost minus EV-MLKEM-020's
      committed cost, not a universal statement about algebraic attacks on all LWE instances.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At FIPS 203 parameters, under Steiner's genericity bound (transferred or flagged
        untransferred per Stage 4), the Arora-Ge/Gröbner attack costs Z bits time and Z' bits memory,
        versus the committed W bits lattice cost" — never a claim that Gröbner-basis attacks are
        generically hard or easy on LWE, and never beyond the specific parameter sets evaluated.
      nearby_object_control: >-
        An LWE instance with much larger eta (or a discrete-Gaussian error of large sigma) is the
        nearby object where Arora-Ge is known to become hopeless even faster (regularity degree grows
        with eta); the identical pipeline must show a much larger gap there, or it is not sensitive to
        eta and is broken.
    proof_obligations:
      - claim: "Steiner's formula is transcribed from a primary read, not a search summary."
        responsibility: baseline
      - claim: "The sample cap m=n*k_rank, matching ML-KEM's actual structure, is used rather than an arbitrary larger m."
        responsibility: scope
      - claim: "The toy-scale genericity-transfer check (H1) is run before the FIPS-203-scale instantiation is reported as more than an upper-bound-flavored estimate."
        responsibility: success_probability
      - claim: "Memory charges state explicitly whether they cover initial matrix size or elimination fill-in."
        responsibility: interface
    not_applicable_reason: null
  predictions:
    - metric: "log2(time cost) of the memory-charged Arora-Ge/Gröbner attack at ML-KEM-512, minus EV-MLKEM-020's committed 140.199-bit primal_bdd cost"
      direction: higher
      minimum_effect: 50
    - metric: "the same signed gap at ML-KEM-1024 (smallest committed lattice margin, +1.276377 bits)"
      direction: higher
      minimum_effect: 50
    - metric: "observed toy-scale Gröbner regularity degree for a module-structured system minus Steiner's generic-coordinates predicted degree, averaged over >=8 random instances at each of >=3 toy scales"
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Stage 0 (reading): fetch and read Steiner's paper (retry PDF or use HTML mirror) and the
      classical Arora-Ge / ACFFP baseline. Stage 1-2 (arithmetic): instantiate and evaluate at the
      three FIPS 203 parameter sets. Stage 3 (comparison, zero additional compute). Stage 4 (low-to-
      medium compute): toy-scale exact Gröbner-basis computation via the program's existing Sage/
      passagemath toolchain, for both a module-structured and matched unstructured control system.
    controls:
      - "Unstructured-LWE control at identical (n, m, q, eta) as each toy module-structured instance, same code path, differing only in whether A is drawn generically or as a genuine module/NTT-structured matrix."
      - "Larger-eta nearby-object control confirming the pipeline shows a widening gap as eta grows."
      - "Reproduction of at least one worked numeric example from Steiner's own paper, if any exists, before trusting the FIPS-203-scale instantiation."
    required_metrics:
      - "log2(time), log2(memory) for the Arora-Ge/Gröbner attack at each FIPS 203 parameter set"
      - "the same for the matched unstructured control at toy scale, and Steiner's unstructured formula as an upper-bound surrogate at full scale if the structured case cannot be computed there"
      - "observed vs predicted regularity degree at toy scale, per H1"
      - "the gap in bits against EV-MLKEM-020's committed cost, per parameter set"
  falsification_conditions:
    - "If Stage 0's read shows Steiner's genericity/Macaulay-bound result does not apply to sample-capped systems, the FIPS-203-scale instantiation is inapplicable and the record must say so rather than substitute an uncited formula."
    - "If the toy-scale check shows the module-structured regularity degree is persistently and substantially LOWER than the unstructured prediction (module structure genuinely helps the algebraic attacker), the FIPS-203-scale extrapolation using the unstructured formula is wrong in direction, not merely imprecise, and must be flagged as potentially understating attacker cost."
    - "If the computed gap at any parameter set is smaller than 20 bits, that is itself the reportable finding — a decisive reversal of the folklore assumption that algebraic attacks are irrelevant — and is escalated for independent Reviewer/Red Team verification before any wider claim, per AGENTS.md rule 12's routing for a contradiction of an established (if never actually evidenced) assumption."
  confounders:
    - "Steiner's estimate is for DRL Gröbner-basis computation specifically; a smarter monomial order or a module-LWE-aware Gröbner algorithm not searched for this session could change the true regularity degree in either direction."
    - "The \"memory-charged\" convention borrowed from this program's sieve-memory accounting (1 unit per stored field element) may not be the natural unit for Gröbner-basis computation, whose real bottleneck is often intermediate fill-in during elimination rather than the initial matrix size; Stage 2 must state which is charged and flag the other."
    - "The toy-scale validation (n=8-16) is far from FIPS 203 scale (n~512-1024); any transfer of the observed regularity-degree offset is an explicit, stated extrapolation, never a direct measurement."
  interpretation_limits:
    - "This compares ESTIMATED costs for a third attack family against costs ALREADY COMMITTED for a different family; it is not a new measurement of core-SVP's tightness and does not move any existing hypothesis's status."
    - "No claim is made about algebraic attacks against other lattice schemes, other secret distributions, or non-module-structured LWE; scoped to FIPS 203's three parameter sets and Steiner's specific machinery as read in Stage 0."
    - "If Stage 0 cannot obtain a readable primary-source formula, the honest fallback is to report only the toy-scale computer-algebra measurement without any FIPS-203-scale extrapolation, stated explicitly rather than substituting an uncited formula."
  heuristic_assumptions:
    - id: H1
      statement: >-
        ML-KEM's Arora-Ge polynomial system, restricted to its actual available sample count
        m = n*k_rank, satisfies Steiner's "generic coordinates" genericity condition to the same
        degree a GENERIC (unstructured) LWE instance of the same (n, m, q, eta) would, despite
        ML-KEM's module/NTT-friendly algebraic structure potentially introducing non-generic
        symmetries that could raise or lower the effective regularity degree relative to the
        unstructured case.
      rigorous_support: >-
        Steiner's theorem proves genericity for the unstructured Arora-Ge construction; the
        classical fact this heuristic imitates is that generic complete intersections achieve the
        Macaulay-bound-predicted regularity. The heuristic content is exactly the TRANSFER of that
        genericity result from the unstructured to the module-structured, sample-capped setting,
        which Steiner's paper — as far as this session's unverified screen could tell — may not
        address directly.
      validation_plan: >-
        At toy scale (n=8-16, k_rank=1-2, small NTT-friendly q, eta=2-3), construct the actual
        module-LWE-shaped Arora-Ge system and compute its exact Gröbner basis / regularity degree via
        Sage's Gröbner-basis routines (reusing KN-TECH-14efa5's passagemath toolchain), comparing the
        observed regularity degree against Steiner's generic-coordinates prediction at the same toy
        size, across >=3 toy scales and >=8 random instances each, reporting whether the largest
        observed regularity degree stays close to the generic prediction or shows a persistent
        structured offset.
  target_complexity:
    time_exponent: >-
      Per Steiner's genericity result (numeric instantiation UNVERIFIED pending Stage 0), Gröbner-
      basis/Arora-Ge time complexity is bounded via the Castelnuovo-Mumford regularity degree d_reg,
      giving a complexity of order binomial(n+d_reg, d_reg)^omega for a matrix-multiplication exponent
      omega, with d_reg itself depending on eta — smaller eta gives smaller d_reg, which is the
      mechanism by which ML-KEM's small error makes this family LESS hopeless than for a generic-error
      LWE instance, and exactly why eta must be ML-KEM's true eta, not a larger stand-in.
    memory_exponent: >-
      The Macaulay/linearization matrix has binomial(n+d_reg, d_reg) columns and at least that many
      rows before elimination — memory scales with the SAME quantity as time, unlike the hybrid
      attack's separately-exposed k parameter, and this family is well known for memory (not just
      time) being its practical bottleneck.
    best_known: >-
      EV-MLKEM-020's committed primal_bdd/RC.MATZOV cost, 140.199 / 200.959 / 270.724 bits. This
      record's point is a comparison, not an improvement: the expected (though unconfirmed until
      computed) outcome is domination by many orders of magnitude, made into a computed, cited fact
      rather than an assumed one.
    hidden_overhead: >-
      Genericity in the technical algebraic-geometry sense does not by itself guarantee the
      regularity degree is small; a large actual regularity would make the true complexity far worse
      than the naive formula, an unbounded-in-principle degree term that must be disclosed, not
      assumed away.
    tradeoff_note: >-
      No exposed time-memory tradeoff parameter analogous to the hybrid attack's k or core-SVP's
      beta; memory and time scale together via the same regularity-degree parameter, stated
      explicitly as a qualitative difference on the three-family comparison table this record and its
      sibling jointly build.
  dominated_by: >-
    EV-MLKEM-020's committed primal_bdd/RC.MATZOV cost, expected (not yet computed) to dominate by a
    very large margin; if Stage 1-2 instead finds a materially smaller gap, that reversal is the
    reportable finding and would require Coordinator review before "dominated_by" is used elsewhere.
  sota_delta: >-
    0 in the attack sense (no improvement claimed or expected). The deliverable is a quantitative
    closure of RQ-MLKEM-003's implicit, never-evidenced assumption that algebraic attacks are
    irrelevant, expressed as a computed order-of-magnitude gap with a named obstruction (the sample
    cap m=n interacting with the regularity degree) rather than an unexamined dismissal.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
