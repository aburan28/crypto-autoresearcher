idea:
  id: IDEA-20260815-634cb9
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THIS BATCH HAS PROPOSED A HUNDRED RECORDS AGAINST ONE CORPUS AND THAT IS
    EXACTLY THE CONDITION UNDER WHICH DUPLICATES APPEAR: screen the batch
    against itself before any of it is scheduled
  class: control

  claim: >-
    A large ideation batch generated in one pass shares an author's framing
    and is prone to internal duplication and to proposing mutually dependent
    work in the wrong order. Screening the batch against itself -- for
    duplicate mechanisms, for records whose preconditions another record
    supplies, and for records that would consume each other's outputs -- is
    a cheap gate that should run before any of it is scheduled.

  mechanism: >-
    Compute pairwise similarity across the batch on mechanism and tracked
    object. Build the dependency graph from records that name each other as
    inputs. Report duplicate candidates, dependency cycles, and a
    topological order for scheduling.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Applies to the 2026-08-15 batch itself; grep the batch's own
      discriminated_from and source_refs fields for internal references.
    results: >-
      The batch was generated in one session against one corpus reading,
      which is precisely the condition the inventor protocol's variant-
      regression warning describes. No self-screen has been run.
    verdict: >-
      ADAPTATION. Self-screening a batch is elementary; the contribution
      is applying it to a batch large enough that its absence would
      matter.

  object_first_candidate:
    tracked_object: >-
      THE BATCH ITSELF, treated as a corpus to be screened rather than as
      a set of independent proposals.
    lossiness: >-
      Reducing each record to its mechanism and tracked object discards
      its detail, which is what makes duplicate detection tractable.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives entirely within the batch; its conclusions bind this batch
      and say nothing about the wider corpus.

  null_object_control: >-
    NULL 1 -- a record compared with itself, which must score maximally
    similar. NULL 2 -- two records known to be genuinely different, which
    must not; a screen flagging everything is useless.

  discriminated_from:
    - >-
        The corpus-wide equivalence quotient record in this batch, which
        screens the whole corpus structurally; this screens one batch and
        is cheaper and narrower.
    - >-
        The per-record novelty screens each record in the batch already
        carries, which check against the PRIOR corpus and by construction
        cannot catch a sibling generated in the same pass.

  assumptions:
    - >-
        Batch records state mechanisms and tracked objects comparably,
        which they do since they share a schema.
    - >-
        Dependency relations are extractable from source_refs and
        discriminated_from, which capture explicit references but not
        implicit ones.

  predictions:
    - metric: >-
        self-comparison null
      direction: different
      minimum_effect: >-
        FORCED maximally similar.
    - metric: >-
        known-different-pair null
      direction: different
      minimum_effect: >-
        FORCED not flagged.
    - metric: >-
        duplicate candidate pairs within the batch
      direction: different
      minimum_effect: >-
        The deliverable; each needs adjudication before scheduling and
        some may be legitimate complements rather than duplicates.
    - metric: >-
        dependency cycles
      direction: different
      minimum_effect: >-
        FORCED to be reported; a cycle means two records each wait on
        the other and neither can be scheduled first.
    - metric: >-
        topological scheduling order
      direction: different
      minimum_effect: >-
        Directly actionable: it says which records must run before
        which.

  minimal_test:
    design: >-
      Pairwise screen across the batch, both nulls, dependency extraction
      from explicit references.
    controls:
      - >-
          Self-comparison and known-different nulls.
      - >-
          Dependency extraction from explicit references only, with
          implicit dependencies acknowledged as uncaptured.
      - >-
          Duplicate candidates reported for adjudication rather than
          auto-merged.
    required_metrics:
      - >-
          Pairwise similarity matrix.
      - >-
          Duplicate candidate list.
      - >-
          Dependency graph with any cycles identified.
      - >-
          Topological scheduling order.

  falsification_conditions:
    - >-
        A null misbehaves. The similarity measure is miscalibrated.
    - >-
        Duplicate candidates are found. They must be adjudicated before
        scheduling, and some will be complements rather than duplicates.
    - >-
        A dependency cycle exists. Two records each wait on the other and
        the cycle must be broken by descoping one before either can run.
    - >-
        No duplicates and no cycles. The batch is internally clean and can
        be scheduled in the reported order, which is the outcome that
        makes the batch immediately usable.

  confounders:
    - >-
        SIMILARITY MISCALIBRATION: records in one batch share vocabulary
        and framing by construction, so a naive similarity measure will
        flag many pairs that are genuinely different work.
    - >-
        IMPLICIT DEPENDENCIES: a record can depend on another's output
        without naming it, and explicit-reference extraction will miss
        those entirely.

  interpretation_limits:
    - >-
        Screens one batch; says nothing about the wider corpus or about
        any record's scientific value.
    - >-
        Duplicate candidates require adjudication and are not conclusions.
    - >-
        The dependency graph captures explicit references only.

  heuristic_assumptions:
    - id: HEUR-BATCH-1
      statement: >-
        Records generated in one ideation pass that share a mechanism
        and tracked object are duplicates rather than complements.
      rigorous_support: >-
        Rigorous ingredient: none -- this is a heuristic and is labelled
        as one. The observation behind it is the inventor protocol's
        warning that candidates regress to variants and that the
        regression is invisible because the variant arrives in new
        notation. THE GAP: two records can share a mechanism and tracked
        object while measuring genuinely different things about it,
        which several pairs in this batch do deliberately, so similarity
        is a flag for adjudication and never a merge criterion.
      falsification_condition: >-
        A flagged pair that adjudication finds to be genuine
        complements.
      validation_plan: >-
        SAMPLE: all pairs above the similarity threshold. TAIL CHECK:
        the highest-similarity pairs, adjudicated individually and their
        outcomes recorded. TRANSFER: none; the screen binds this batch.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is pairwise comparison across the batch.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent self-screen exists; per-record novelty screens check
      against the prior corpus and cannot see siblings from the same pass.
    hidden_overhead: >-
      Shared vocabulary within a batch inflates similarity scores, so the
      threshold must be calibrated against the known-different null rather
      than set a priori.
    tradeoff_note: >-
      A self-screen is cheap and catches exactly the duplication a single-
      pass batch is prone to; skipping it lets the corpus absorb siblings
      that per-record screens structurally cannot catch.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing. As a self-screen
    for this batch: none exists, and the per-record screens cannot
    substitute since they check only the prior corpus. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a pairwise duplicate screen
    across the batch, a dependency graph with any cycles identified, and a
    topological scheduling order, covering the one duplication mode the
    batch's own per-record novelty screens structurally cannot detect.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the screen runs and the nulls calibrate. 0.6 that some
    duplicate candidates are found, since a single-pass batch of this size
    makes them likely. 0.8 that a usable scheduling order is produced, which
    is the batch's most immediately actionable output.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
