  id: IDEA-20260811-18bb47
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-5ff234
  axis: A1
  claim_tier: toy
  title: >-
    "E(F_p) AS A POSSIBLY-NON-CYCLIC GROUP" AND "COSETS RATHER THAN SUBGROUPS" ARE
    THE SAME OBJECT AND IT IS NOT A NEW ONE: whenever E[N] is not rational the full
    group splits as G x H with gcd(#H, N) = 1, every publicly computable homomorphism
    out of E(F_p) into a group of exponent coprime to N is TRIVIAL ON G (obstruction
    O-EXPONENT), and the coset label of any point of G with respect to any
    N-coprime subgroup carries exactly zero bits about k -- demonstrated on the one
    map that is genuinely outside H-ENDO-001's reach, the polynomial-time
    Tate-Lichtenbaum pairing, which is not an endomorphism, is defined on the whole
    group, and lands in a different group, and which nevertheless returns nothing
  class: mechanism
  resource: >-
    R7 (pairings into a different group) as the worked example, applied to a group
    over F_p rather than over an extension; and R5 (torsion at ell != N as a module)
    for the cofactor structure. The record argues NO new taxonomy entry is needed:
    the "full group" and the "coset" are not resources at all, because they factor
    into G and N-coprime data, and the taxonomy indexes resources, not decompositions.
  admissibility: >-
    Admissible. The maps examined are not endomorphisms applied to points of G -- the
    Tate-Lichtenbaum pairing is a bilinear map into F_p^* modulo n-th powers, and the
    coset label is a quotient map -- so H-ENDO-001 does not reach them and the record
    exists precisely to show what does. The record proposes no attack; its conclusion
    is a closure with two named obstructions.
  p2_p3_flags:
    p2_adjacent: false
    p3_triggered: false
    note: >-
      No phi-stable factor base; no comparison against the automorphism-discounted rho
      baseline. Neither pause condition is engaged.

  claim: >-
    Let E/F_p be ordinary, p > 3, E(F_p) isomorphic to Z/n_1 x Z/n_2 with n_1 | n_2,
    N a prime dividing #E(F_p), G a subgroup of order N, P a generator, Q = [k]P.

    (A) [fact] THE STRUCTURE CONSTRAINT. The Weil pairing on E[n_1] is non-degenerate
        and Galois-equivariant, and E[n_1] is contained in E(F_p), so mu_{n_1} is
        contained in F_p^* and n_1 divides p - 1. Non-cyclicity of E(F_p) is therefore
        not free: it is paid for in the divisibility n_1 | gcd(#E(F_p), p - 1).

    (B) [fact] AT THE PRIME N THE OBJECT COLLAPSES. If E[N] is not contained in
        E(F_p) then the N-Sylow of E(F_p) is cyclic, G is its unique subgroup of
        order N, and E(F_p) is isomorphic to G x H where H is the N-coprime part
        together with any higher N-power part above G. If E[N] IS contained in
        E(F_p) then N | n_1 | p - 1, so the embedding degree is 1 and the curve is
        transferred into F_p^* by MOV / Frey-Ruck and broken outright. So the ONLY
        curves on which "non-cyclic at N" is a genuine phenomenon are curves already
        broken, which is the same boundary IDEA-20260811-00391a derives for the
        admissibility filter itself, reached here from the group side rather than the
        map side.

    (C) [fact] O-EXPONENT -- THE OBSTRUCTION GOVERNING EVERYTHING H-ENDO-001 DOES
        NOT. Let psi be any homomorphism from E(F_p) to an abelian group A with
        gcd(N, exp(A)) = 1. For R in G, psi(R)^N = psi([N]R) = psi(O) = identity, and
        psi(R)^{exp(A)} = identity; since the two exponents are coprime, psi(R) is the
        identity. So psi is TRIVIAL ON G, whatever psi is, however it is computed, and
        whether or not it is an endomorphism. This is a one-line argument and it is
        the rigidity that plugs the source-side gaps in H-ENDO-001's scope: the filter
        governs endomorphisms of G, O-EXPONENT governs every homomorphism out of the
        larger group into an N-coprime target, and together they leave only targets
        whose exponent is divisible by N -- which by IDEA-20260727-005's target-side
        classification means unipotent (N = p, anomalous), toric (N | p^k - 1, the
        embedding degree), or abelian-variety (cost at least p^{1 - o(1)}).

    (D) THE WORKED EXAMPLE, CHOSEN BECAUSE IT IS THE STRONGEST CANDIDATE THE AXIS
        OFFERS. The reduced Tate-Lichtenbaum pairing
          t_n : E(F_p)[n] x E(F_p)/n E(F_p) -> F_p^* / (F_p^*)^n
        is defined over F_p and computable in polynomial time by Miller's algorithm
        whenever n | p - 1, which by (A) is exactly the condition under which E(F_p)
        can be non-cyclic at n. It satisfies every clause of "the kind of map
        H-ENDO-001 does not govern": it is not an endomorphism, its source is the
        whole group rather than G, and its target is a different group. Fixing
        S in E(F_p)[n] gives a publicly computable homomorphism
          psi_S : E(F_p) -> mu_n,  psi_S(R) = t_n(S, R),
        which is precisely the kind of exit map the axis was asked to look for.
        [fact] IT IS TRIVIAL ON G, for the sharpest possible reason: gcd(n, N) = 1
        forces G to be contained in n E(F_p), because for R in G one has
        R = [n]([n^{-1} mod N] R) with [n^{-1} mod N] R again in G. So G dies in the
        second argument of the pairing before O-EXPONENT is even needed, and
        O-EXPONENT gives the same conclusion independently. TWO INDEPENDENT PROOFS OF
        THE SAME TRIVIALITY IS THE SHAPE OF A CLOSURE, NOT OF AN ACCIDENT.

    (E) [fact] COSETS. Let K be any subgroup of E(F_p) with gcd(#K, N) = 1 and let
        c : E(F_p) -> E(F_p)/K be the quotient. Then c restricted to G is INJECTIVE,
        not trivial -- so the coset label does not destroy information -- but c(G) is
        again a cyclic group of order N and c is an isomorphism onto it, so the
        instance (c(P), c(Q)) has the same k and the same difficulty. Passing to
        cosets is a relabelling. Conversely if N divides #K then c kills G entirely
        and the label carries zero bits. THERE IS NO INTERMEDIATE CASE, because N is
        prime: a quotient either preserves G exactly or kills it exactly. That
        dichotomy is the reason "cosets rather than subgroups" cannot be a resource
        over a prime-order subgroup, and it is worth recording as the mechanism
        rather than as a slogan.

    (F) THE CLOSURE AND ITS FORWARD GUIDANCE. E(F_p) as an object equals G together
        with N-coprime data, and every publicly computable map out of it either
        restricts to an isomorphism on G (a relabelling), or kills G (zero bits), or
        has a target of exponent divisible by N (and is then charged by
        IDEA-20260727-005's per-class exponents). WHAT REMAINS OPEN, NAMED SO THE
        NEXT SESSION DOES NOT RE-TREAD THIS: (i) whether the N-coprime part supplies a
        FREE and well-distributed partition function for a rho walk or a
        distinguished-point predicate -- a constant-factor question at best, and the
        record states in advance that it cannot be an exponent; (ii) the multi-instance
        setting in which many targets share one cofactor structure, which is resource
        R8 and belongs to axis A3, not here; (iii) composite-order or small-subgroup
        settings, where the prime-order dichotomy in (E) does not apply and where the
        analysis would have to be redone from scratch.

  mechanism: >-
    Prime order is a rigidity, and the rigidity has two faces the campaign has so far
    only used one of. The face H-ENDO-001 uses is that End of a cyclic group of prime
    order is a field, so self-maps are scalars. The face this record uses is that a
    cyclic group of prime order is either preserved or annihilated by any
    homomorphism, with nothing in between, and that it is invisible to any target
    whose exponent is coprime to N. Together these say that enlarging the object from
    G to E(F_p) cannot help: the enlargement consists entirely of N-coprime material,
    and N-coprime material and G do not talk to each other, in either direction,
    through any homomorphism. The Tate-Lichtenbaum pairing is the sharpest test of
    this because it is the one polynomial-time map in the whole picture whose source
    is the full group and whose target is a genuinely different group; it fails for a
    reason that is arithmetic (coprimality) rather than structural, which is why it
    could not have been predicted by H-ENDO-001 and why it is worth writing down.

  why_not_a_renamed_known_approach: >-
    IDEA-20260727-005 classifies exits by TARGET and is the record this one leans on
    for the residual case; it does not consider the full group as a source, does not
    state O-EXPONENT, and does not treat the Tate-Lichtenbaum pairing at all.
    IDEA-20260807-569c82 shows the WEIL pairing is identically 1 on G x G and that
    the reduced Tate pairing is degenerate on G x G because G is a single Frobenius
    eigenspace; that is a statement about a pairing of G with ITSELF, over
    F_{p^{k_emb}}. This record's psi_S is a pairing of the FULL group with n-torsion
    over F_p at an n COPRIME to N, which is a different map, with a different
    domain, a different field of definition, and a different reason for triviality
    (coprimality, not alternation and not eigenspace degeneracy). IDEA-20260807-df5984
    identifies H^1(Gal, E[N]) with the Tate pairing's second argument via Lang's
    theorem; that concerns the N-torsion and descent, whereas the whole point here is
    the n-torsion for n coprime to N. IDEA-20260808-4d77a6 computes n_1 from Lenstra's
    module structure and is upstream tooling for the census, not a claim about what
    the non-cyclic structure can do.

  proof_search_map:
    bottleneck: >-
      The coprimality step. Every conclusion in (C), (D) and (E) rests on
      gcd(N, exp(A)) = 1 or gcd(n, N) = 1. Remove it and the claims fail, which is
      exactly what happens at k_emb = 1.
    baseline_embedding:
      parameter_slice: >-
        Setting n = N in (D) leaves the coprimality regime and recovers the standard
        MOV / Frey-Ruck setting, which requires N | p - 1 for a pairing over F_p. That
        is the exact boundary of the closure and the slice it must reproduce.
      reproduction_check: >-
        Symbolic: at n = N the argument "G is contained in n E(F_p)" fails because
        n^{-1} mod N does not exist, and the pairing becomes non-degenerate on the
        relevant piece. Frozen fixture: a toy curve with N | p - 1 on which psi_S must
        be measurably NON-trivial on G.
    observation_collision:
      observable: >-
        The multiset of values {psi_S(R) : R in G}, i.e. the image of G under the
        candidate exit map.
      distinct_preimage_search: >-
        The observable is predicted to be the singleton {identity} for every curve
        with gcd(n, N) = 1, so it collides across all such curves by design; the
        separating condition is exactly gcd(n, N), which is public and cheap. The
        collision therefore carries no hidden information, and the search for a
        non-colliding pair is the minimal test's planted-signal arm.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "E(F_p) is possibly non-cyclic" by the exact statement
          E(F_p) = G x H with gcd(#H, N) = 1, in which the hypothesis becomes an exact
          direct-product decomposition rather than a qualitative possibility.
        predicted_gain: >-
          Turns a vague object into a decomposition whose second factor is provably
          k-independent, which is what makes (C)-(E) one-line arguments instead of
          case analyses.
    quantifier_order: >-
      CLOSURE CLAIM: forall E/F_p ordinary with E[N] not contained in E(F_p), forall
      abelian A with gcd(N, exp(A)) = 1, forall homomorphisms psi from E(F_p) to A --
      publicly computable or not -- forall R in G: psi(R) is the identity. Note that
      psi is quantified AFTER A and BEFORE R, and that no computability hypothesis is
      needed: the conclusion is information-theoretic, not computational, which is
      strictly stronger than what the axis asked for and is stated that way
      deliberately.
      BOUNDARY CLAIM: exists E with E[N] contained in E(F_p) -- necessarily with
      N | p - 1 -- for which the conclusion fails.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is that no homomorphism out of E(F_p) into an
        N-coprime target yields any information about k. It certifies NOTHING about
        non-homomorphic maps out of E(F_p), which is the R1 lane, and nothing about
        maps whose target has exponent divisible by N, which is
        IDEA-20260727-005's territory.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS is a curve with N | p - 1, where
        psi_S can be non-trivial on G and the DLP transfers into F_p^*. The instrument
        must separate that curve from an ordinary one, and the minimal test includes
        exactly that pair.
    proof_obligations:
      - claim: n_1 divides p - 1 by the Weil pairing.
        responsibility: correctness
      - claim: E[N] rational implies N | p - 1 implies k_emb = 1.
        responsibility: correctness
      - claim: coprime exponents force triviality on G.
        responsibility: correctness
      - claim: G is contained in n E(F_p) whenever gcd(n, N) = 1.
        responsibility: correctness
      - claim: a quotient by an N-coprime subgroup is injective on G.
        responsibility: correctness
      - claim: Miller's algorithm computes t_n in polynomial time for n | p - 1.
        responsibility: runtime

  predictions:
    - observable: triviality of the Tate exit map on G
      metric: >-
        the number of distinct values of psi_S(R) as R ranges over all of G, for every
        curve in a toy census with n_1 > 1 and gcd(n_1, N) = 1, and for every
        S in E(F_p)[n]
      direction: lower
      predicted: >-
        exactly 1 (the identity) for 100 percent of curves and every S. A curve
        yielding two or more values with gcd(n, N) = 1 falsifies (C) and (D) and would
        be the single most consequential outcome available from this record.
    - observable: non-triviality on the planted-signal curve
      metric: the same count on a curve with N | p - 1 and n = N
      direction: higher
      predicted: >-
        N distinct values, i.e. psi_S restricted to G is injective. If the instrument
        reports 1 there, it cannot see the one phenomenon the record predicts and all
        of its negatives are void, not negative.
    - observable: the structure predicate
      metric: >-
        over the census, the cross-tabulation of "N divides n_1" against
        "k_emb = ord_N(p) equals 1"
      direction: different
      predicted: >-
        every curve with N | n_1 has k_emb = 1, with no exceptions. A curve with
        N | n_1 and k_emb > 1 falsifies (B).
    - observable: coset injectivity
      metric: >-
        for every subgroup K of E(F_p) with gcd(#K, N) = 1, the size of the image of G
        under the quotient map
      direction: different
      predicted: >-
        exactly N in every case, confirming (E)'s dichotomy; and exactly 1 whenever
        N divides #K. No intermediate size may occur, and an intermediate size would
        contradict the primality of N and indicate an implementation error rather than
        a discovery.

  minimal_test:
    design: >-
      Entirely exhaustive at toy scale, so every count is exact.
      STAGE 0 (zero compute). Write out (C), (D)'s divisibility step, and (E)'s
      dichotomy as three short arguments. Each is two or three lines. If any fails,
      the record dies at zero cost, which is the cheapest possible discriminator.
      STAGE 1 (minutes). Build a census of ordinary curves over primes p of 12-16
      bits, retaining those with n_1 > 1 -- which by (A) requires n_1 | p - 1 and is
      therefore found by searching p with smooth p - 1. For each, compute E(F_p) as
      Z/n_1 x Z/n_2 by two independent routes, identify G, and for each n dividing
      n_1 and each S in E(F_p)[n], evaluate psi_S on every element of G. G is
      exhaustively enumerable at these sizes, so the "number of distinct values" is an
      exact count and not a sample.
      STAGE 2 (minutes). Construct the planted signal: a curve with N | p - 1, which
      requires N small and is easy to find at toy scale. Repeat stage 1 there; psi_S
      must be injective on G.
      STAGE 3 (minutes). Enumerate all subgroups K of E(F_p) at toy size and record
      |c(G)| for each, checking the dichotomy in (E).
      No pairing library beyond a Miller implementation over F_p, no solver, no
      isogeny walk, no Groebner basis.
    controls:
      - >-
        NULL OBJECT: replace psi_S by a uniformly random function from E(F_p) to mu_n
        that fixes the identity. The "number of distinct values on G" statistic must
        then be large (close to min(N, n)), confirming that the statistic has power to
        detect non-triviality. If the random function also reports 1 distinct value,
        the statistic is broken and every negative it produced is void.
      - >-
        PLANTED SIGNAL: the N | p - 1 curve of stage 2, where the map must be
        injective on G. Two-directional control as required by RQ-INSTR-f8faa0 and
        GOAL-ENDO-001 C4.
      - >-
        CYCLIC CONTROL: curves with n_1 = 1, where the non-cyclic machinery must
        report an empty n-torsion and the pairing must be undefined rather than
        trivial. A pipeline that reports "trivial" there is silently succeeding on an
        empty input.
      - >-
        INDEPENDENT STRUCTURE COMPUTATION: (n_1, n_2) computed by random-point order
        testing and, separately, by the Smith-normal-form route of
        IDEA-20260808-4d77a6. Disagreement means an arithmetic bug, not a finding.
    required_metrics:
      - per curve, (p, a, b, t, #E, n_1, n_2, N, N | n_1, k_emb)
      - per (curve, n, S), the exact number of distinct values of psi_S on G
      - the same count for the random-function null and for the planted signal
      - per curve, |c(G)| for every subgroup K, with gcd(#K, N) recorded
      - the cross-tabulation of "N | n_1" against "k_emb = 1", with the predicted empty cell

  controls:
    - Random-function null, which must show many distinct values on G.
    - Planted signal at N | p - 1, where psi_S must be injective on G.
    - Cyclic control at n_1 = 1, where the map must be undefined rather than trivial.
    - Two independent group-structure computations.

  confounders:
    - >-
      FINDING NON-CYCLIC CURVES AT TOY SCALE requires n_1 | p - 1 with n_1 > 1, which
      biases the census toward primes with smooth p - 1. The census is therefore NOT a
      uniform sample of curves and must not be reported as one; it is a targeted
      search for the phenomenon, which is the correct design for a universally
      quantified negative but the wrong design for any frequency claim.
    - >-
      The planted-signal curve necessarily has small N (since N | p - 1 and N | #E
      with #E about p), so it differs from the main census in N as well as in the
      predicate. The two arms cannot be matched in N -- that is forced by the
      arithmetic, not a design flaw -- and the report must say so rather than imply
      a matched comparison.
    - >-
      Miller's algorithm has degenerate cases (the point S in the support of the
      divisor being evaluated) that produce spurious identity values. Every reported
      identity must survive a re-evaluation with a randomised divisor shift, or a
      degenerate evaluation will be mistaken for the predicted triviality -- which is
      the single most likely way this record produces a false confirmation.
    - >-
      "Publicly computable" is not needed for (C), which is information-theoretic, but
      IS needed for (D)'s practical reading. The record separates the two so that a
      reviewer cannot conflate an information-theoretic triviality with a
      computational one.

  falsification_conditions:
    - >-
      A curve with gcd(n, N) = 1 on which psi_S takes more than one value on G. (C)
      and (D) are false and a publicly computable exit map exists that nobody has
      accounted for. This must be independently replicated before any interpretation;
      it contradicts an elementary argument, so an implementation error is far more
      likely than a discovery.
    - >-
      A curve with N | n_1 and k_emb > 1. (B) is false, the non-cyclic case is NOT
      confined to the MOV-broken family, and both this record and
      IDEA-20260811-00391a's boundary claim must be reopened.
    - >-
      A quotient map whose image of G has size strictly between 1 and N. (E) is false,
      which contradicts the primality of N.
    - >-
      The planted signal is not detected, or the random-function null reports a single
      value. The instrument has no power and nothing measured with it counts.

  interpretation_limits:
    - >-
      This is a CLOSURE with two named obstructions, in the sense of
      docs/inventor-protocol.md section 4. It is not a lower bound, not evidence that
      ECDLP is hard, and not a claim that no use of the cofactor can ever exist.
    - >-
      Scoped to ordinary curves over prime fields with N prime and, for the main
      claim, E[N] not rational. Says nothing about composite-order groups,
      small-subgroup settings, extension fields, or genus greater than 1 -- and (E)'s
      dichotomy uses primality essentially, so the composite case is genuinely open
      and is named as such in (F).
    - >-
      NO EXPONENT MOVES AND NONE IS CLAIMED. The forward-guidance item about walk
      partition functions is stated in advance as a constant-factor question so that
      no later reading can inflate it.
    - >-
      All measurement is toy scale (12-16 bits). The arguments in (A)-(E) are
      scale-free; the census is a check on them and an instrument validation.

  assumptions:
    - E/F_p ordinary, p > 3, N prime dividing #E(F_p), G of order N.
    - >-
      The Weil pairing on E[n] is non-degenerate and Galois-equivariant, so rational
      full n-torsion forces mu_n into F_p. [standard]
    - >-
      The reduced Tate-Lichtenbaum pairing on E(F_p)[n] x E(F_p)/nE(F_p) is
      well-defined and computable by Miller's algorithm in polynomial time when
      n | p - 1. [recall-confident; NOT re-verified this session.]
    - >-
      E(F_p) is isomorphic to Z/n_1 x Z/n_2 with n_1 | n_2. [standard structure theorem
      for the group of rational points; the module-theoretic refinement is
      IDEA-20260808-4d77a6's object and is not needed here.]

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Census reachability.) At 12-16 bits, ordinary curves with n_1 > 1 and with a
        prime N > sqrt(#E) coexisting in the same group are common enough to populate
        both arms of the cross-tabulation with at least 100 curves each, when primes p
        are drawn with p - 1 having a divisor in a prescribed range.
      rigorous_support: >-
        The rigorous ingredient is (A): n_1 > 1 requires n_1 | gcd(#E, p - 1), so the
        search is a search over p with a prescribed small divisor of p - 1 and then
        over curves with prescribed n_1, and the Deuring/Waterhouse correspondence
        guarantees curves exist for every admissible trace. The heuristic content is
        only the DENSITY, i.e. how many curves must be tried, and the classical
        statement imitated is the standard equidistribution of #E(F_p) in residue
        classes, the same heuristic IDEA-20260808-4d77a6's HA-1 uses in a different
        guise.
      validation_plan: >-
        Sampled quantity: the number of curves tried per curve retained, per arm, for
        p in three dyadic ranges at 12, 14 and 16 bits. Shortcut: the retention
        predicate is computed from #E and p - 1 alone -- integer arithmetic with one
        point count per curve and no pairing evaluation -- so screening is far cheaper
        than the measurement it feeds. Comparison distribution: the observed retention
        rate against the heuristic prediction of order 1/n_1 per candidate curve.
        Tail check: the largest n_1 observed in the census against the prediction that
        n_1 exceeding p^{1/4} should not occur in a sample of this size. TRANSFER
        ASSUMPTION, EXPLICIT: this is a statement about the FEASIBILITY OF THE
        EXPERIMENT at toy scale and nothing about crypto scale; no claim in (A)-(F)
        depends on it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. The maps examined are polynomial
      time to evaluate -- Miller's algorithm is (log p)^{O(1)} -- and return zero bits
      about k, so their cost-benefit is exactly zero benefit at polynomial cost. The
      audit itself costs one group-structure computation and one exhaustive
      enumeration of G per curve, the latter being O(N) and therefore toy-scale only
      by construction, deliberately, since a sampled check could not establish a
      universally quantified triviality at these sizes.
    memory_exponent: O(log p) per curve for the audit; O(N) for the exhaustive enumeration at toy N.
    best_known: >-
      Parallel Pollard rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006); the automorphism-discounted variant (KN-TECH-018); BSGS at
      sqrt(N) time and memory (KN-TECH-031). For the k_emb = 1 boundary family the
      relevant baseline is MOV / Frey-Ruck transfer into F_p^* (KN-TECH-032), against
      which those curves are already broken.
    hidden_overhead: >-
      Nothing hides in an o(1) because no improvement is claimed. The honest disclosure
      is the other way: the closure has a nonempty exception set (k_emb = 1), and (E)'s
      dichotomy uses the primality of N essentially, so the composite-order case is
      genuinely not covered and is named in (F) rather than quietly assumed away.
    tradeoff_note: Not applicable; no algorithm is proposed.

  sota_delta: >-
    Zero. No attack, no speedup, no exponent. A closure of two named objects with two
    named obstructions, plus a worked example on the strongest candidate map the axis
    supplies.

  dominated_by: >-
    As an attack, dominated by everything, since it is not an attack. Checked against
    every row of the frontier the program maintains: parallel Pollard rho at
    0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N) time and memory
    (KN-TECH-031); the preprocessing frontier at N^{1/3} online with N^{1/3} advice
    (Corrigan-Gibbs-Kogan, charged in DEC-20260727-008); and, on the k_emb = 1 family
    only, MOV / Frey-Ruck (KN-TECH-032). As a CLOSURE it is partially dominated by
    IDEA-20260727-005, whose target-side classification already covers the residual
