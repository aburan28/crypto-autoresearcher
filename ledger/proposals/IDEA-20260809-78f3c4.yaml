idea:
  id: IDEA-20260809-78f3c4
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    Ship the reconstruction as an artifact that refuses to emit a verdict, with
    each analysis as a named fixture
  class: tooling
  claim: >-
    The chief risk in this goal is drift from "locating the disagreement" to
    "settling it". The claim is that the risk can be handled structurally rather
    than by discipline: an artifact whose interface returns a labelled evaluation
    per switch setting, with each published analysis as a named fixture, and which
    has NO code path producing an unqualified security level. Making the
    prohibited output unrepresentable is stronger than a rule against writing it.
  mechanism: >-
    The evaluation interface returns a record carrying the switch setting, the
    provenance of each switch value, and the computed cost — with no aggregation
    across settings and no default setting. Fixtures pin each analysis's setting
    and its published figure so regressions are caught.
  why_not_a_renamed_known_approach: >-
    Software design as compliance enforcement is a general engineering pattern.
    Applying it to a specific research-integrity constraint — the goal's rule
    against adjudicating — is the contribution and it is directly checkable.
  predictions:
  - observable: existence of any code path returning an unlabelled cost
    metric: boolean, checked by test
    predicted: None. A path that exists is removed before the artifact is used.
  - observable: fixture regression behaviour
    metric: fixtures pass or fail on each change
    predicted: Fixtures catch changes to switch semantics; a change that alters a published reproduction without failing a fixture means the fixtures are too weak.
  minimal_test: >-
    Implement the interface, write fixtures for each analysis, add a test
    asserting no unlabelled output path exists, and run the suite.
  controls:
  - 'NEGATIVE CONTROL: deliberately adding an unlabelled output path must fail the test suite.'
  - 'FIXTURE INDEPENDENCE: fixtures encode the published figures, not this program''s computed ones, so a drift in the model shows up as a fixture failure.'
  falsification_conditions:
  - The constraint cannot be enforced without making the artifact unusable, in which case it is recorded as a design finding and the rule reverts to discipline.
  - Fixtures pass under a deliberately broken model.
  interpretation_limits: >-
    Tooling constrains what this program can emit; it says nothing about CSIDH.
  sota_delta: 'No verdict. Delta: a structural guarantee against the goal''s main failure mode.'
  dominated_by: Downstream of IDEA-20260809-66ef77; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for verdict-free tooling: no records. WEB NOT CHECKED.'
  source_refs:
  - AGENTS.md -- IN CORPUS.
