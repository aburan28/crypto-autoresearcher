# IDEA-20261003-e31c6e
# Rational-kernel count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-e31c6e
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Full rational 2-torsion gives 3 kernels and one rational point gives 1
  class: measurement
  claim: >-
    A curve with three nontrivial rational 2-torsion points has 3
    kernels of degree 2. A curve with one such point has 1 kernel.
    Three exceeds one by 2. The product of the two counts is 3.
    Their sum is 4. The gap is a kernel count, not an ECDLP
    exponent and not a geometric kernel size.
  mechanism: >-
    OBJECT FRAME. R3 is the kernel of a degree-2 isogeny. The
    operation set is choosing one rational point of order 2 as the
    generator. Two curves that each have one kernel both count 1,
    so that gap is 0. No point is mapped and no relation is collected.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves being equally hard is a different claim
        from this kernel count.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two counts are frozen before the subtraction.
    - No isogeny is computed.
  proof_search_map:
    bottleneck: The kernel-count gap 2.
    baseline_embedding:
      parameter_slice: The counts 3 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 3 exceeds 1 by 2.
    observation_collision:
      observable: The kernel-count gap and the product.
      distinct_preimage_search: >-
        Reporting both counts as 1 drops the gap. Two curves with
        one kernel make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The counts 3 and 1.
        predicted_gain: Integer gap. No isogeny.
    quantifier_order: >-
      The counts are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The kernel-count gap 2. Not a walk.
      nearby_object_control: >-
        Two curves with one kernel. Both count 1, and the gap is 0.
    proof_obligations:
      - claim: The full rational case has 3 kernels.
        responsibility: size
      - claim: The one-point case has 1 kernel.
        responsibility: size
      - claim: The gap is not a geometric kernel size.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: kernel_gap
      direction: different
      minimum_effect: Three exceeds one by 2.
  minimal_test:
    design: >-
      Subtract 1 from 3 and multiply 3 by 1. Do not compute an isogeny.
    controls:
      - Two one-kernel counts, whose gap is 0.
      - An independent count.
    required_metrics:
      - both counts
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 2.
    - The product of the two counts is not 3.
  confounders:
    - The geometric kernel of multiplication by 2 has size 4, which is a different count.
  interpretation_limits:
    - A kernel count is not a walk length.
    - No transfer to a cryptographic curve.
    - This is not a decomposition speedup.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen full-rational count is 3 and the frozen
        one-point count is 1.
      rigorous_support: >-
        No isogeny theorem is claimed. The count is a reading of
        two kernel labels.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Computing the isogeny is a different task.
    tradeoff_note: More rational kernels are not a shorter walk.
