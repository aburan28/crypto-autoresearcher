idea:
  id: IDEA-20260905-05648a
  title: >-
    THE TORSION-QUOTIENT COORDINATE IS SEMAEV ON THE QUOTIENT CURVE: for a cyclic
    rational torsion subgroup C of order k on a cofactor curve, the coordinate
    t = x' o phi_C (rational deck order 2k) has summation polynomial EQUAL to
    Semaev's polynomial of E' = E/C, hence per-variable degree 2^(m-2) and NOT
    (2k)^(m-2); the scheme buys exactly the cofactor h in relations per solve
    over naive Weierstrass index calculus on the same curve and exactly 1 over a
    prime-order curve at the same subgroup order -- the deck-group law's
    automorphism branch and the translation branch are separated by one
    symbolic degree read-off (x^3 on j = 0 gives 6, (xy)^2 on Edwards gives 2)
  class: mechanism

  claim: >-
    R2 CLASS AND STAGE. The equation scheme is a Montgomery or Edwards model of
    E/F_p together with the cyclic rational torsion subgroup C it certifies
    (order k in {2, 4, 8}; BBJLP Theorem 3.3 for the order-4 point, the note's
    Table for the eleven cofactor curves). The attack stage changed is
    RELATION DECOMPOSITION and the LINEAR-ALGEBRA unknown count of
    summation-polynomial index calculus on E(F_p). The non-generic operation
    made cheaper is the removal of the cofactor redundancy from the
    decomposition system, at a stated constant and no exponent.
    SETUP. p > 3, #E(F_p) = h l with l prime and gcd(h, l) = 1, G the subgroup
    of order l, C a cyclic F_p-rational subgroup of order k dividing h,
    phi_C the F_p-rational separable isogeny E -> E' = E/C of degree k (Velu),
    x' the short-Weierstrass coordinate of E', and
    t := x' o phi_C, a map E -> P^1 of degree 2k whose geometric fibre over a
    generic value is {+-Q + c : c in C}, with rational deck group
    <-1> x C, dihedral of order 2k. On an Edwards curve x^2 + y^2 = 1 + d x^2
    y^2 (a = 1, available on all eleven cofactor curves) these coordinates are
    explicit up to a Moebius map of P^1, namely t_2 = y^2 for C = <T2>,
    T2 = (0, -1), because P + T2 = (-x, -y); and t_4 = (x y)^2 for C = <T4>,
    T4 = (1, 0), because P + T4 = (y, -x) sends x y to -x y while negation
    sends x y to -x y as well, so (x y)^2 is invariant under the order-8 group
    <-1, tau_T4> and has degree 8; for k = 8 the coordinate is obtained by
    Velu on the Montgomery model or as (x' y')^2 o phi_T2.
    (S1) THE IDENTITY. The reduced polynomial S_m^t whose zero set is the
    closure of {(t(P_1), ..., t(P_m)) : P_1 + ... + P_m = O} equals, up to a
    nonzero scalar, Semaev's S_m for the curve E' in the coordinate x'. Proof:
    if the P_i sum to O then the phi_C(P_i) sum to O on E'; conversely if the
    Q'_i = phi_C(P_i) sum to O on E' then the P_i sum to an element c of C,
    and replacing P_1 by P_1 - c leaves every t-value unchanged and gives a
    genuine relation. The two closures coincide. Consequently, by KN-TECH-002
    applied to E', deg_{t_i} S_m^t = 2^(m-2) for every k. The reading of the
    deck-group law IDEA-20260807-dadcd2 (L1) at g = 2k, which predicts
    (2k)^(m-2), is therefore FALSE for this coordinate; (L1) is stated for
    deck groups inside Aut(E, O) and its proof uses that a deck element acts on
    a SUM of points by a global automorphism, which a translation does not do.
    dadcd2's own worked case (E) already computes 2^(m-2) for an isogeny
    pull-back; this record adds the identification of the polynomial itself.
    (S2) RATIONAL FIBRES AND LIFTING. For t_0 in F_p the rational fibre
    t^(-1)(t_0) meets E(F_p) in either the empty set or in a full coset
    {+-P + c : c in C} of 2k points; it is non-empty exactly when t_0 = x'(Q')
    for a rational Q' in H := phi_C(E(F_p)), a subgroup of index k in E'(F_p).
    A solution (t_1, ..., t_m) of S_{m+1}^{E'}(t_1, ..., t_m, t(R)) = 0 lifts,
    after at most 2^(m-1) sign trials and ONE membership test in C, to a
    relation P_1 + ... + P_m = R + c with c in C; every one of the k^m choices
    of coset representatives gives the SAME relation between logarithms in G,
    because C meets G trivially (gcd(k, l) = 1) and the logarithm of P + c in
    G equals that of P.
    (S3) THE COST ACCOUNTING, AT MATCHED UNKNOWN COUNT U. Let F be a
    C-stable factor base of B = 2 k U points (U distinct t-values, U unknowns
    after quotienting by <-1> x C). The t-system is the E'-Semaev system with
    the base phi_C(F) of 2U points of H and membership polynomial of degree U:
    Bezout 2^(m-1) U^m, identical to Weierstrass Semaev on ANY curve with U
    unknowns. Its expected relations per target, by the exact mean of
    KN-FIND-007 applied inside the group H of order h l / k, is
    k * C(2U + m - 1, m) / (h l). Naive Weierstrass Semaev on E with a random
    base of 2U points has mean C(2U + m - 1, m) / (h l) at the same Bezout
    number. A prime-order curve of order l with 2U points has
    C(2U + m - 1, m) / l. HENCE the scheme buys a factor exactly k (= h when
    C is the full 2-primary torsion) in relations per solve over naive index
    calculus on the SAME cofactor curve, and a factor exactly 1 over a
    prime-order curve at the same subgroup order l. The eleven cofactor curves
    with t = x' o phi_{E(F_p)[2^inf]} are, for the decomposition stage,
    indistinguishable from prime-order curves of order l.
    (S4) THE REDUNDANCY IT REMOVES. The Weierstrass x-system on the SAME
    C-stable base F has k U distinct x-values, membership degree k U, Bezout
    2^(m-1) (k U)^m, i.e. k^m times larger, and its solutions come in bundles
    of k^(m-1) point-tuples per t-solution, all encoding one G-relation.
    That bundle is the prime-field transport of FGHR Section 4.1.2's
    '2^(n-1) decompositions of R from one' (retrieved text, lines 1213-1244),
    extended from k = 2 to k in {4, 8} through the quotient curve; FGHR Section
    4.2.1 (lines 1481-1493) records that the 4-torsion action on twisted
    Edwards does not fit their linear-invariant framework because x cannot be
    expressed through y. Passing to E/C makes every C-translation act
    trivially on the coordinate, at the price of relaxing the relation to
    R + C, which over F_p costs nothing by (S2).
    (S5) THE DISCRIMINATING PAIR FOR THE DECK-GROUP LAW. Two coordinates of
    rational deck order at least 6 must give DIFFERENT per-variable degrees at
    m = 3: on a j = 0 toy curve with 6 | p - 1, the coordinate x^3 (deck group
    mu_6 inside Aut(E, O)) must give 6 (dadcd2 (L1) applies); on a Z/4 toy
    curve, t_4 = (x y)^2 (deck order 8, translation type) must give 2. The
    degree is decided by the TYPE of the deck elements, not by their number.
    WHAT EACH OUTCOME MEANS. Outcome A (degrees 2 and 6, yield ratio k,
    prime-order tie at 1): the RQ-MODEL-e61cb2 decision target is met with a
    constant, namely h relative to naive cofactor-curve index calculus and 1
    relative to a prime-order curve; the note's 'which way the constant moves'
    contrast is resolved with mechanism. Outcome B (t-degree above 2 for some
    k): (S1) is false and the isogeny relaxation argument has a hole; the
    record is superseded. Outcome C (yield ratio departs from k, or the
    prime-order tie fails after the null battery): a genuine torsion lever or
    an accounting error; independent review before interpretation.

  mechanism: >-
    OBJECT FRAME. Representation: the equation scheme (Montgomery or Edwards
    model, certifying C) with the coordinate t = x' o phi_C. Operation set
    Sigma = {negation, translation by C, the isogeny phi_C and its dual}; the
    walk step is not in Sigma and the full translation action is not in Sigma.
    TRICHOTOMY CLASS: PARTIAL-ACTION (Class I of IDEA-20260806-c5d183). The
    projection t propagates deterministically under translation by the proper
    subgroup C of E(F_p) (t(P + c) = t(P)) and under negation, and under the
    isogeny step (t(P) = x'(phi_C(P)) by definition); under a translation by an
    element outside <-1> x C it branches with b = 2 exactly as the Kummer
    coordinate does. Note the group acted on is E(F_p) of composite order h l,
    where c5d183's rigidity theorem does not forbid a lossy deterministic
    quotient; restricted to the prime-order subgroup G the map t is injective
    up to sign, which is the content of (S2)-(S3).
    LOSSY-PROJECTION TEST AGAINST SIGMA. Discarded: the sign and the C-coset,
    L = 1 + log2(k) bits. The discard is a block system of <Sigma> acting on
    E(F_p): the blocks are the cosets +-P + C. Lossy in the representation
    used: a value t_0 has 2k rational preimages, so t is not a change of
    coordinates on E(F_p). Retained part propagates deterministically under
    every element of Sigma. Restricted to G the discarded C-component is the
    Pohlig-Hellman-trivial 2-primary component, so the extra loss over the
    Kummer coordinate is loss of information the ECDLP never needed -- which is
    exactly why the constant relative to a prime-order curve is 1.
    THE ONE OPEN NUMBER, PRICED. Canonicalising a <Sigma>-orbit is one
    evaluation of x' o phi_C: O(k) field operations by Velu (k at most 8), or
    two squarings and a multiplication for t_4 = (x y)^2 on an Edwards model;
    lifting a solved tuple costs at most 2^(m-1) group operations plus one
    membership test in C (k comparisons). Both are charged in
    target_complexity.
    STAGES OF THE DESIGN (no compute is authorised by this record).
    STAGE 0 (symbolic, minutes, HARD GATE): on a 16-bit Edwards toy curve with
    torsion Z/8, compute the 2-isogeny E -> E/<T2> and the 4-isogeny
    E -> E/<T4> by Velu on the Montgomery model, and verify symbolically that
    y^2 and (x y)^2 are Moebius-equivalent to x' o phi for k = 2 and 4
    respectively (compare fibres on 200 random points and check the degree of
    the field extension F_p(E) over F_p(t)).
    STAGE 1 (symbolic, minutes): eliminate to the reduced S_3^t for k in
    {2, 4, 8}; read per-variable degrees (predicted 2, 2, 2) and check
    S_3^t = c * S_3^{E'} after the Moebius substitution (predicted exact).
    STAGE 2 (enumeration, minutes): histogram the rational fibre sizes of t
    over all of E(F_p) (predicted 2k on every non-ramified attained value) and
    the fraction of attained values (predicted about 1 / (2k)).
    STAGE 3 (counting, hours): at m = 3 and matched U, count exact arity-3
    solutions per target for the t-system on a C-stable base, the x-system on
    the same base, the x-system on a random base of 2U points, and Semaev on a
    matched prime-order curve of order near l; report the four means against
    KN-FIND-007's exact values (predicted ratios k, k^(m-1) bundles, k, 1).
    STAGE 4 (symbolic, minutes): the j = 0 control of (S5).
    STAGE 5: the null battery and decay ladder of minimal_test.controls.

  tracked_object: >-
    The C-coset-and-sign class of a point of E(F_p), realised as the value
    t = x' o phi_C, followed through the m-fold decomposition relation and the
    isogeny step; equivalently the point phi_C(P) of the quotient curve E' up
    to sign.

  lossy_projection_test: >-
    PASSES against Sigma = {negation, C-translation, phi_C, dual}. Discards
    1 + log2(k) bits (sign, C-coset); the fibre partition {+-P + C} is a block
    system of <Sigma> on E(F_p); 2k rational preimages per attained value, so
    not a change of coordinates on E(F_p). FAILS on G alone, deliberately: on
    the prime-order subgroup t is the Kummer coordinate of E' composed with an
    injective isogeny, discarding only the sign. The test is passed on the
    composite-order group and this is the mechanism, not a defect.

  null_object: >-
    NULL-1, the PGL_2(F_p) battery of IDEA-20260807-4fc635 applied to t: random
    Moebius maps per variable, decay parameter the number of randomised
    variables 0..m; per-variable degree must stay exactly 2 and the identity
    with S_3^{E'} must survive as an identity after the same substitution;
    monomial support may change and is reported, never interpreted.
    NULL-2, the translation-conjugate null t_R(P) = t(P - R) with retargeting
    R -> R - mR, exact agreement on every algebraic metric. NULL-3, a matched
    random curve at the same p with the SAME torsion structure (Z/8, resp.
    Z/4): every ratio must reproduce; NULL-4, a matched random curve with a
    DIFFERENT structure, (Z/2)^2 x odd, on which no cyclic C of order 4 exists
    and the k = 4 arm must be reported absent; KNOWN-FALSE object: a
    prime-order curve of the same bit size, on which C is trivial, t = x, and
    every ratio must be exactly 1 with fibre size 2. DECAY: the chain of
    subgroups C of orders 8, 4, 2, 1 inside one Z/8 curve; the relations-per-
    solve ratio must equal k at each rung and per-variable degree must stay 2;
    a ratio that does not track k is an artifact.

  why_not_a_renamed_known_approach: >-
    FGHR (KN-LIT-004, retrieved text) exploit the 2-torsion translation as a
    LINEAR action on the y-coordinate of twisted Edwards curves over F_{q^n}
    and stop at 2-torsion for the polynomial system (their Section 4.2 handles
    4-torsion only as a factor-base halving on Jacobi intersections, with a
    non-linear action they cannot fit). This record replaces the invariant-
    ring construction by the quotient curve E/C, which handles every cyclic k
    uniformly, identifies the resulting polynomial as Semaev's on E/C, and does
    the prime-field cost accounting at matched unknown count, where FGHR's
    exponential factor 2^(omega(n-1)) has no counterpart (see
    IDEA-20260905-61ea3b for the boundary). IDEA-20260807-dadcd2 supplies the
    deck-group law but reads g = 2k into (L1) where (L1) does not apply; this
    record separates the automorphism and translation branches by a symbolic
    test on one pair of coordinates. IDEA-20260807-fed641 computed the degree
    2^(m-2) for an isogeny pull-back on a PRIME-ORDER curve and closed it by
    rationality; this record is the cofactor case fed641 (D2) names as 'the
    one honest regime', with the lifting cost corrected from k^(m-1) to
    2^(m-1) + one C-test by (S2).

