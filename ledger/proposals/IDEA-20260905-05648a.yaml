        degree is not blind to the deck type.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Reduce 'index calculus in the torsion-quotient coordinate on E' to
          'Semaev index calculus on E/C inside the index-k subgroup H'.
          Encoding exact by (S1); completeness and soundness by (S2); cost
          loss the Velu evaluation O(k) per point and the C-test per relation.
        predicted_gain: >-
          Converts the note's open contrast into a constant computed in
