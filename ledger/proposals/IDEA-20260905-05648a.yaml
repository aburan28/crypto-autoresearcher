  predictions:
    - metric: per-variable degree of the reduced S_3^t for k in {2, 4, 8} on one Z/8 toy curve
      direction: different
      minimum_effect: >-
        EXACTLY 2 for each k, zero tolerance; and S_3^t equals c * S_3^{E'}
        after the Moebius substitution, an exact symbolic identity. Any k with
        degree 4 or 8 falsifies (S1).
    - metric: per-variable degree of S_3 in the coordinate x^3 on a j = 0 toy curve with 6 | p - 1
      direction: higher
      minimum_effect: EXACTLY 6 (dadcd2 (L1) with g = 6); a 2 there means the deck-type reading is wrong.
    - metric: rational fibre size histogram of t over E(F_p)
      direction: different
      minimum_effect: >-
        Every attained non-ramified value has exactly 2k rational preimages;
        the fraction of attained values in F_p lies within 20 percent of
        1/(2k) at p about 2^20. Any fibre of size strictly between 1 and 2k
        off the ramification locus falsifies (S2).
    - metric: mean arity-3 relations per solve, t-system on a C-stable base versus x-system on a random base, matched U
      direction: higher
      minimum_effect: >-
        Ratio EXACTLY k in the KN-FIND-007 mean (within the binomial spread of
        200 targets); the ratio must track k = 8, 4, 2, 1 down the subgroup
        chain (decay test).
    - metric: mean arity-3 relations per solve, t-system on the Z/8 curve versus Weierstrass Semaev on a matched prime-order curve, matched U and matched l within 5 percent
      direction: different
      minimum_effect: >-
        Ratio 1.00 within 10 percent after correcting for the exact l ratio.
        A ratio above 1.5 surviving the null battery and NULL-3 is the lever
