    GOAL-ECDLP-001: >-
      Names a representation-and-operation pair in class R2 with its lossy
      audit, a priced canonicalisation cost, and a constant-factor decision
      for the decomposition stage on cofactor curves.
    GOAL-CRYPTO-001: >-
      Charges the full decomposition-stage accounting (setup, transport by
      Velu, lifting, memory) and predicts no advantage over rho; a matched rho
      row is a control.
    GOAL-ENDO-001: >-
      Supplies RQ-MODEL-e61cb2's decision target with a derived constant (h
      versus naive, 1 versus prime order) and the discriminating symbolic
      pair for IDEA-20260807-dadcd2's two branches.
    GOAL-SCURVE-51437e: >-
      Curve25519 (Z/8, cofactor 8) is named as the public parameter set
      whose torsion structure realises k = 8; no target, no safety statement.
    GOAL-SCURVE-9eb661: >-
      Curve1174 (Z/4, cofactor 4) is named as the public parameter set
      realising k = 4 on an Edwards model where t_4 = (x y)^2 is explicit; no
      target, no safety statement.
    GOAL-SCURVE-be9707: >-
      NIST P-256 is named only as the prime-order, trivial-torsion
      known-false object on which every predicted ratio must be 1.
    GOAL-SCURVE-3d5b30: >-
      secp256k1 (j = 0) is named only as the automorphism-type nearby object
      of (S5), where the x^3 coordinate must show degree 6; no target, no
      safety statement.

