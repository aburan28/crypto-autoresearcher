    - metric: solution bundles of the x-system on the C-stable base per t-solution
      direction: higher
      minimum_effect: EXACTLY k^(m-1) = k^2 at m = 3, every bundle encoding one G-relation.
    - metric: (L, b) of the projection t on the meter of IDEA-20260802-002 over E(F_p)
      direction: different
      minimum_effect: L = 1 + log2(k) bits and b = 2.000 exactly; see IDEA-20260905-2bcabb.

  minimal_test:
    design: >-
      Stage 0 (symbolic gate, minutes): Velu isogenies for k = 2, 4, 8 on one
      16-bit Edwards curve with torsion Z/8, verified as homomorphisms; y^2 and
      (xy)^2 checked Moebius-equivalent to x' o phi. Stage 1 (symbolic,
      minutes): reduced S_3^t for each k, degrees and the identity with
      S_3^{E'}. Stage 2 (enumeration, minutes): rational fibre histogram.
      Stage 3 (counting, hours): the four-arm yield comparison at m = 3, U in
      {16, 32, 64}, 200 targets per cell, three primes, three seeds. Stage 4
      (symbolic, minutes): the j = 0 x^3 control. Stage 5: the null battery,
      NULL-3, NULL-4, the known-false prime-order arm, and the subgroup-chain
      decay ladder. CHEAPEST VALID DISCRIMINATOR: Stage 1 alone decides (S1)
      against the (2k)^(m-2) reading in one resultant computation per k, and
      Stage 4 separates the two branches of the deck-group law in a second;
      everything else is accounting.
    controls:
      - PGL_2(F_p) random-reparametrisation battery per IDEA-20260807-4fc635 (blocking)
      - translation-conjugate null t_R with retargeting, exact agreement (blocking)
      - matched random curve, same p, same torsion structure (Z/8 and Z/4 arms) (blocking)
      - matched random curve, same p, different structure (Z/2)^2 x odd (reported)
      - known-false prime-order curve at the same bit size, all ratios exactly 1 (blocking)
      - j = 0 curve with 6 | p - 1, coordinate x^3, degree 6 (blocking positive control)
      - subgroup-chain decay ladder k = 8, 4, 2, 1 (blocking)
      - Pollard rho with distinguished points and BSGS on G, matched instances, controls only
      - automorphism-discounted rho (KN-TECH-018) on the j = 0 control curve
    required_metrics:
      - per-variable and total degree of each reduced S_3 per coordinate per curve
      - symbolic identity pass or fail against S_3^{E'} per k
      - rational fibre histogram and attained-value fraction per k
      - mean, variance and coverage of arity-3 relation counts per arm per cell against KN-FIND-007
      - bundle multiplicity of x-system solutions per t-solution
      - Velu evaluation cost per point and lifting group operations per relation
      - pass or fail of every control; wall-clock and peak memory per stage

  falsification_conditions:
    - F1. Any k gives per-variable degree above 2 in the reduced S_3^t. (S1) is false; supersede.
    - F2. The x^3 control gives 2. The deck-type discriminator is wrong and (S5) is withdrawn.
    - F3. A rational fibre of size strictly between 1 and 2k off the ramification locus. (S2) is false.
    - F4. The yield ratio versus naive index calculus is not k at some rung of the chain. (S3) accounting is wrong.
    - >-
      F5. The prime-order tie fails by more than 50 percent, reproduced on
      NULL-3 and surviving the PGL_2 battery. A torsion lever that the
      derivation forbids; independent review before any interpretation.
    - F6. NULL-2 fails exact agreement. Instrument fault; nothing reported.
    - F7. Budget exhaustion or Velu verification failure. Infrastructure, never evidence.

  confounders:
    - >-
      Matching l between a cofactor curve and a prime-order control at toy
      scale is inexact; the ratio must be corrected by the exact l values and
      the correction reported.
    - >-
      Ramification values of t (images of C-cosets containing 2-torsion) have
      fibres smaller than 2k and must be counted separately, never filtered.
    - >-
      A window of t-values is a window in x' of E', which is not a window in
      x of E; the C-stable base must be built as a point set and expressed in
      each coordinate, exactly the confound IDEA-20260811-fe0934 names.
    - >-
      Non-reduced elimination inflates degrees; the squarefree gate of dadcd2
      runs before any degree is read.
    - Small p makes accidental C-membership of random points non-negligible; three primes, report spreads.

  interpretation_limits:
    - >-
      NO EXPONENT. RQ-MODEL-e61cb2 forbids one and the derivation predicts a
      constant: h relative to naive index calculus on the cofactor curve, 1
      relative to a prime-order curve at the same l. Diem's and Gaudry's
      asymptotics are untouched.
    - >-
      Scoped to prime fields; the extension-field behaviour is a different
      claim (IDEA-20260905-61ea3b) and FGHR's own scope statement (Section 1.3)
      is carried unchanged.
    - >-
      Toy tier throughout; nothing here is a statement about any named curve's
      security, and the named SafeCurves curves are public parameter sets used
      to fix torsion structures.
    - >-
      Factor-base escape (KN-OPEN-020): the t-window base is a bounded-degree
      algebraic description (membership polynomial of degree U in t), inside
      the scoped-out class; this record makes no factor-base escape claim and
      stops there.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a C-stable window base and uniformly random targets in G, the
        per-target arity-m relation count on E' inside H is distributed as
        for a uniformly random subset of H of the same size, so that the mean
        identity of KN-FIND-007 governs and the variance is Poisson-like,
        uniformly for U between 16 and 256 at toy p.
      rigorous_support: >-
        The mean is an exact double count (KN-FIND-007, unconditional). The
        distributional half imitates the Poisson law of representation counts
        for random subsets of a cyclic group, the same assumption charged in
        the corpus's yield battery (EV-FBG-001 via KN-FIND-007).
      validation_plan: >-
        Sample 200 targets per cell at p in {2^16, 2^20}, U in {16, 32, 64};
        compare the empirical count distribution with Poisson at the exact
        mean by chi-squared; tail check on the maximum count per cell against
        the Poisson tail; sampled p, curve, C, U, seed recorded; no transfer
        beyond toy scale is claimed.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CHANGE. Decomposition-stage constant: relations per solve
      multiplied by k (at most h = 8) relative to naive Weierstrass Semaev on
      the same cofactor curve, and by exactly 1 relative to a prime-order curve
      of the same subgroup order l. Prime-field ECDLP stays at rho's
      0.886 sqrt(l) group operations; no prime-field decomposition method is
      competitive at any tested size (KN-LIT-025, corpus note).
    memory_exponent: >-
      Unchanged: the Macaulay matrix is set by U and 2^(m-2), both identical to
      the prime-order case; the C-stable base stores B = 2kU points but only U
      unknowns.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(l) and O(1) memory;
      BSGS at sqrt(l) time and memory; automorphism-discounted rho on CM
      curves (KN-TECH-018); Semaev and Petit-Kosters-Messeng decomposition over
      prime fields, not competitive at any tested size (KN-TECH-002,
      KN-LIT-025).
    hidden_overhead: >-
      Velu evaluation O(k) field operations per point (k at most 8); lifting
      2^(m-1) group operations plus one C-membership test per relation; the
      Pohlig-Hellman projection [h] once per relation. None is asymptotic.
    tradeoff_note: >-
      Not applicable; no time-memory point moves. The scheme removes a
      cofactor dilution, it does not create a tradeoff.

