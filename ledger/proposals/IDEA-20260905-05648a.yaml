    observation_collision:
      observable: >-
        The pair (per-variable degree of the reduced S_3 in the coordinate,
        relations per solve at matched U).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED: the t-coordinate on a Z/8 curve and the x-
        coordinate on a prime-order curve of order l collide on the observable
        (2, C(2U+2,3)/l). That collision is the result. The separating object
