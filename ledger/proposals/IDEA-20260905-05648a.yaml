          separates the fibre.
        predicted_gain: >-
          Locates exactly where IDEA-20260807-dadcd2 (L1) stops applying.
    quantifier_order: >-
      FOR ALL p > 3, FOR ALL E/F_p with a cyclic F_p-rational subgroup C of
      order k, FOR ALL m >= 3: S_m^{x' o phi_C} = c * S_m^{E/C} and
      deg_{t_i} = 2^(m-2). FOR ALL C-stable bases with U unknowns and FOR ALL
      targets in G: the expected relations per solve equal k C(2U+m-1,m)/(hl)
      exactly in the mean (KN-FIND-007 is unconditional). The prime-order tie
      is a statement about two different curves at equal l and U and is
      exact in the mean, heuristic in the distribution (H1).
    method_ceiling:
      strongest_certifiable_claim: >-
        On cofactor curves the torsion-quotient coordinate realises exactly
        the decomposition-stage cost of a prime-order curve of the same
        subgroup order, and no coordinate certified by rational torsion can do
        better than that at matched unknowns. It can NEVER certify anything
        about monomial support, Groebner solving degree, extension fields, or
        an exponent.
      nearby_object_control: >-
        The j = 0 curve with 6 | p - 1 and the coordinate x^3, where the
        conclusion 'degree 2' FAILS (predicted 6) because the deck group is
        automorphism-type; and the extension field F_{q^n}, where the
        prime-order tie FAILS because FGHR's conjugate structure adds a
        genuine 2^(n-1) (IDEA-20260905-61ea3b).
    proof_obligations:
      - claim: The closure of the t-image of the relation locus equals V(S_m^{E'}).
