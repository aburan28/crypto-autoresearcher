  assumptions:
  - A distinguished-point golden-collision search can be implemented and
    instrumented at toy scale so that its cost exponent in the list size N is
    measurable over at least a decade of N. This is the load-bearing feasibility
    assumption of the whole proposal.
  - The supersingular graph at toy p can be built exhaustively so that both the
    sigma arm and the random-involution arm run on the SAME vertex set with the
    same list-generation code path, differing only in the involution.
  - The list L(E,X,B) can be generated at toy p by the paper's Algorithm 1
    (modular-polynomial root finding), so that the measured instance is the real
    one and not a surrogate.

  proof_search_map:
    bottleneck: >-
      The memory term w in Wesolowski's cost. Time is p^{1/3+o(1)} and memory is
      p^{1/3+o(1)}; the paper names reducing memory at fixed time as open. The
      exact step whose removal changes the cost is storing the table L: it exists
      only to answer "is (E')^{(p)} a key of L". Anything that answers that
      question without the table removes the memory term.
    baseline_embedding:
      parameter_slice: >-
        w = N = p^{1/3+o(1)} reproduces Wesolowski's Algorithm 2 exactly: the
        whole list is stored, the lookup is O(1), and the time is N * p^{o(1)} =
        p^{1/3+o(1)}. w = poly(log p) reproduces the van Oorschot-Wiener endpoint
        p^{1/2+o(1)}, which is the Delfs-Galbraith exponent. The claimed frontier
        min(N^2/w, N^{3/2}/w^{1/2}) must reduce to both at those two slices.
      reproduction_check: >-
        Symbolic: substitute w = N and w = 1 into min(N^2/w, N^{3/2}/w^{1/2}) and
        require N and N^{3/2} = p^{1/2+o(1)} respectively, matching the paper's
        two named endpoints. Frozen fixture: at toy p, run the full Algorithm 2
        with an unlimited table and record the exact number of table entries and
        lookups; the instrumented golden-collision implementation with w = N must
        find the same golden pair with the same number of list evaluations up to
        a stated constant.
    observation_collision:
      observable: >-
        The measured cost exponent of golden-collision search as a function of
        list size N at fixed memory w.
      distinct_preimage_search: >-
        The exponent collides badly: an instance with genuine exploitable
        structure and an instance with none can produce the same measured
        exponent if the structure only affects constants, and - more dangerously
        - an instance with NO structure can appear to have a better exponent if
        the distinguished-point parameters were tuned per-arm. Both preimages are
        realisable in a sloppy experiment. The separating conditions, which this
        design imposes, are: identical distinguished-point parameters across
        arms, identical list-generation code path, and reporting of the raw
        function-evaluation counts alongside the fitted exponent so the fit can
        be audited. Without those, the observable does not identify the
        conclusion and no result may be claimed.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        Charge each walk step to a global budget defined by the number of
        distinct codomains visited, and randomise the walk start so that the
        cost of the unlucky segment (a walk that cycles without reaching a
        distinguished point) is charged to the global budget rather than to the
        segment.
      predicted_gain: >-
        None on the exponent; the transform exists to make the measurement
        stable, since unrandomised starts are the standard way to produce a
        spuriously good exponent at small N.
    - transform: observable_fiber
      proposed_object: >-
        Hold the measured exponent fixed and vary the forgotten structure - the
        involution itself - across sigma, a random fixed-point-free involution,
        and a random involution with an artificially enlarged fixed set of size
        p^{1/2}, p^{2/3} and p^{5/6}. The intrinsic invariant separating them is
        the fixed-set density.
      predicted_gain: >-
        Locates the fixed-set density at which the free-collision channel starts
        to matter. If the crossover sits above p^{1/2}, then sigma's real fixed
        set is provably on the wrong side of it and the closure is complete with
        a measured threshold, which is exactly the reusable number the closure
        standard asks for.
    quantifier_order: >-
      The claim to be tested, written out: THERE EXISTS an absolute constant c
      such that FOR ALL p, FOR ALL supersingular E/F_{p^2}, and FOR ALL memory
      budgets w with poly(log p) <= w <= p^{1/3}, the expected time of any
      distinguished-point golden-collision search for the sigma-claw is at least
      c * min(p^{2/3}/w, p^{1/2}/w^{1/2}). Note the order: c may not depend on E
      or on w. A per-instance improvement - a special family of curves on which
      the sigma-claw is cheap - does NOT falsify this and would be a separate,
      weaker and still interesting finding; the experiment therefore reports the
      full distribution over E and not only its mean.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale instrumented measurement can certify a fitted cost exponent
        with a confidence interval, on the tested primes, list sizes and memory
        budgets, for the specific golden-collision implementation used. It cannot
        certify a lower bound over ALL algorithms - no experiment can - so the
        frontier claim in (B) is at best an empirical failure to beat the generic
        bound with the methods tried, and must be worded that way in any evidence
        record. It also cannot certify anything at p^{1/3} list sizes for
        cryptographic p, since those are unreachable.
      nearby_object_control: >-
        The nearby object on which the desired conclusion fails: an involution
        with fixed-set density p^{-1/6} instead of p^{-1/2}, engineered
        artificially. For that object a list of size p^{1/3} contains an expected
        p^{1/6} fixed points and the free-collision channel demonstrably works,
        so a method that reports the same exponent for it as for sigma has not
        identified the load-bearing structure. This control is mandatory: it is
        the positive control that proves the measurement can see the effect it is
        looking for.
    proof_obligations:
    - claim: 'w = N and w = polylog reproduce the two published endpoints of the cost expression.'
      responsibility: baseline
    - claim: 'The blocked scheme costs N^2/w and the distinguished-point scheme N^{3/2}/w^{1/2}; setting them equal gives w^{1/2} = N^{1/2}, so the two branches cross at w = N, which is w = p^{1/3} for N = p^{1/3+o(1)}.'
      responsibility: runtime
    - claim: 'The sigma arm and the null arm are measured under identical parameters and code paths.'
      responsibility: correctness
    - claim: 'The positive control (enlarged fixed set) shows a measurable exponent gain, proving the instrument works.'
      responsibility: feasibility
    - claim: 'Conclusions are scoped to the tested primes, list sizes, memory budgets and implementation, and are never stated as algorithm-independent lower bounds.'
      responsibility: scope

  predictions:
  - metric: >-
      fitted cost exponent e in (expected function evaluations) ~ N^{e} at fixed
      w, measured for the sigma arm over at least a decade of N at toy p
    direction: different
    minimum_effect: >-
      Predicted e = 1.5 at small fixed w (the van Oorschot-Wiener branch). The
      decision is against the null arm: |e_sigma - e_null| <= 0.05 is a
      controlled null and establishes (B) empirically; e_sigma <= e_null - 0.10
      with non-overlapping CIs is a positive and routes to adversarial review.
  - metric: >-
      fitted exponent for the positive control (artificially enlarged fixed set
      of density p^{-1/6})
    direction: lower
    minimum_effect: >-
      Must be at least 0.15 below the null arm. If it is not, the instrument
      cannot detect the effect it is designed to detect and NO conclusion of
      either sign may be drawn from the sigma arm. This is the single most
      important control in the design.
  - metric: >-
      fixed-set density threshold at which the fitted exponent first drops below
      e_null - 0.10, swept over engineered densities p^{-1/2}, p^{-1/3},
      p^{-1/4}, p^{-1/6}
    direction: different
    minimum_effect: >-
      A threshold reported with its bracketing densities. This is the reusable
      obstruction measurement the closure standard requires: a number with units
      and a scope, not a verdict. Predicted threshold strictly denser than
      p^{-1/2}, i.e. sigma is on the wrong side.
  - metric: >-
      crossing memory budget w* at which the blocked scheme and the
      distinguished-point scheme cost the same, measured rather than derived
    direction: different
    minimum_effect: >-
      Predicted w* = N up to a constant. A measured w* differing from N by more
      than a factor of 4 indicates that the derived frontier expression in (B) is
      wrong in its constants and the derivation must be redone before use.
  - metric: >-
      whether any of the ALISO Hecke-support artifacts (EXP-ALISO-006, 008, 009,
      036, 037) supplies a Mem-predicate estimator whose cost is sublinear in the
      supersingular set size, as assessed by reading their recorded metrics
    direction: different
    minimum_effect: >-
      Predicted: none does, and EXP-ALISO-008's own "ALGORITHM FALSE" plus
      EXP-ALISO-006's "SUPPORT-PRIMITIVE NOT IMPLEMENTED" are the archive's own
      statements of that. A single artifact exhibiting a sublinear estimator
      would be a major finding and would reopen the entire lane.

  minimal_test:
    design: >-
      Stage 1 (no compute): the symbolic reproduction check - substitute w = N
      and w = polylog into min(N^2/w, N^{3/2}/w^{1/2}) and confirm the two
      published endpoints; and the archival assessment of prediction 5 by reading
      the five ALISO Hecke-support packages' recorded metrics. Stage 2 (toy):
      build the full supersingular graph at three toy primes; generate
      L(E, X, B) by Algorithm 1 for a grid of X and B giving list sizes N over at
      least a decade; run an instrumented distinguished-point golden-collision
      search for the sigma-claw at a grid of memory budgets w; fit e per arm.
      Stage 3: repeat identically with (a) a uniformly random fixed-point-free
      involution, (b) engineered involutions with fixed-set densities p^{-1/2},
      p^{-1/3}, p^{-1/4} and p^{-1/6}. Stage 4: measure w* directly by running
      both schemes at every w on the grid. All arms share one list-generation
      code path and one distinguished-point parameter setting, fixed before any
      arm is run.
    controls:
    - 'Null object: uniformly random fixed-point-free involution on the same vertex set, same seeds, same parameters. This is the controlled-null arm; a match IS the predicted result and is reported as a controlled null, not as a non-result.'
    - 'Positive control: engineered involution with fixed-set density p^{-1/6}, which must show a measurable exponent gain, proving the instrument is sensitive.'
    - 'Parameter freeze: distinguished-point probability, walk length cap and restart policy fixed before any arm runs and identical across arms; per-arm tuning voids the comparison.'
    - 'Raw-count reporting: expected function evaluations and stored-point counts reported per cell alongside every fitted exponent, so a reviewer can refit.'
    - 'Structural tell: the fitted e must approach its asymptote monotonically as N grows. An e identical across the whole N-decade is the artifact signature of docs/inventor-protocol.md section 3 and halts interpretation.'
    - 'Algorithm-2 cross-check: at the smallest N, the unlimited-memory Algorithm 2 must find the same golden pair as the instrumented search, or the instrument is wrong.'
    required_metrics:
    - fitted_exponent_e_per_arm_with_ci
    - raw_function_evaluations_per_cell
    - stored_points_per_cell
    - measured_crossing_memory_w_star
    - fixed_set_density_threshold_bracket
    - positive_control_exponent_gap
    - algorithm2_cross_check_agreement
    - aliso_hecke_support_assessment_table
    - wall_clock_and_peak_rss

  falsification_conditions:
  - >-
      e_sigma <= e_null - 0.10 with non-overlapping confidence intervals: the
      involution carries an exponent, claim (B) is false, and memory below
      p^{1/3} at time p^{1/3} becomes a live candidate. Routes immediately to
      independent adversarial review under AGENTS rule 12.
  - >-
      The positive control fails to show a gap of at least 0.15: the instrument
      is insensitive and the experiment yields NO evidence in either direction.
      This is an instrument failure, not a negative result, per AGENTS rule 3.
  - >-
      Measured w* differs from N by more than a factor of 4: the frontier
      expression in (B) is wrong in its constants and must be rederived before
      any use.
  - >-
      The Algorithm-2 cross-check disagrees at the smallest N: implementation
      error; the run is void.
  - >-
      Reading eprint 2026/1821 in full shows the frontier of (B) already
      established there: part (B) is superseded as prior art. This is an
      acceptable and complete outcome and must be recorded rather than narrowed
      around.
  - >-
      Any of EXP-ALISO-006/008/009/036/037 is found on inspection to contain a
      sublinear Mem estimator: prediction 5 is falsified and the lane reopens.

  confounders:
  - >-
      Toy-scale reach. At toy p the list size N is at most a few thousand, and
      exponent fits over such a range have wide confidence intervals. The design
      mitigates this with a full decade of N and three primes, but the fits will
      not be tight and the record must say so rather than quoting a point
      estimate.
  - >-
      Distinguished-point parameter sensitivity. Golden-collision cost is
      notoriously sensitive to the distinguished-point probability; the parameter
      freeze exists for this, and any deviation invalidates the arm comparison.
  - >-
      Fixed-set engineering artifacts. An artificially enlarged fixed set changes
      the involution's cycle structure globally, not only its fixed density, and
      that could itself change the exponent. The sweep over four densities is
      what separates a density effect from a cycle-structure artifact.
  - >-
      The o(1) terms. At toy p, p^{1/3}, p^{2/5} and p^{1/2} are numerically
      close and the p^{o(1)} factors dominate. No exponent measured here may be
      compared directly to 1/3, 2/5 or 1/2; only the ARM DIFFERENCE is
      interpretable, which is why every prediction above is stated as a
      difference against a control.
  - >-
      Recalled van Oorschot-Wiener theorem content. The N^{3/2}/w^{1/2} form is
      taken from the in-repo body text's restatement of [43] in section 1.1; the
      van Oorschot-Wiener paper itself was not fetched this session, so the
      optimal distinguished-point parameter choice behind that form is recalled.
      If the recalled form is wrong the entire frontier expression changes.

  interpretation_limits:
  - >-
      No experiment here establishes an algorithm-independent lower bound. The
      strongest available conclusion is that the specific structured search did
      not beat its own control at the tested scale, which is a scoped negative
      about the methods tried and never a statement that no method exists.
      "Never declare a direction impossible" applies with full force.
  - >-
      Everything is at toy p, and per the RQ-ALISO-001 constraint "No deployment
      or crypto-scale promotion from toy Autolab runs", nothing here may be
      turned into a concrete-security statement.
  - >-
      Part (B) is very likely dominated by eprint 2026/1821, published two days
      before this proposal was written and read only at abstract level. This
      proposal's honest value is concentrated in parts (C) and (D) - the
      random-involution null and the reformulation of the ALISO Hecke-support
      target as the Mem predicate - and in the reusable fixed-set-density
      threshold. Its priority is set accordingly.
  - >-
      The five ALISO Hecke packages are cited from their recorded status strings
      and, for EXP-ALISO-001, from a full read of its result JSON. Four of the
      five had only their claim_status lines read. Any adjudication of them must
      read their bodies first; this proposal's prediction 5 is a hypothesis about
      what a reader will find, not a report of what was found.
  - >-
      The prior closure in IDEA-20260806-bcbcf5 is not re-litigated here and is
      not re-derived. This proposal asks about a membership predicate for a
      smooth-degree ball, which is a different object from an eigenvector
      coordinate, and it makes no claim about whether the two are related.

  heuristic_assumptions:
  - id: H1
    statement: >-
      Generic-claw behaviour of the sigma-structured instance. Let p be prime,
      E/F_{p^2} supersingular, and L = L(E,X,B) the list of Algorithm 1 with
      |L| = N. For memory budget w with poly(log p) <= w <= N, the expected
      number of function evaluations of a distinguished-point golden-collision
      search for the pair (psi, chi) with codomains related by sigma is
      Theta(min(N^2/w, N^{3/2}/w^{1/2})), with the implied constants independent
      of p, E and w - that is, the sigma-claw behaves like a claw between two
      independent uniformly random sets of size N.
    rigorous_support: >-
      The rigorous ingredient is the elementary blocked-comparison bound: a list
      of size N compared against itself in blocks of w costs exactly ceil(N/w)*N
      evaluations, which is an unconditional upper bound of N^2/w and needs no
      assumption. The classical distribution statement being imitated is van
      Oorschot-Wiener's analysis of designated-collision search on a RANDOM
      function, giving sqrt(R^3/w) with memory w (recalled, restated in the
      in-repo section 1.1 with R = N). H1 asks only that the sigma-structured
      instance has the same constants as the random-function case. The known
      reason to doubt it is stated in claim (C): sigma has a structured fixed
      locus of density p^{-1/2}, and any list element landing on it yields a free
      collision. The counter-arithmetic is that N * p^{-1/2} = p^{-1/6} < 1, so
      the channel is expected to be empty - and THAT is the measurement.
    validation_plan: >-
      Sample: at least 3 toy primes with fully enumerable supersingular graphs,
      at least 10 list sizes N spanning a decade, at least 5 memory budgets w,
      and at least 50 independent (curve, seed) instances per cell. Shortcut:
      none - and this is the point. Unlike the smoothness heuristics in this
      lane, H1 is about a SEARCH PROCEDURE, so it can be measured directly at any
      scale where the search runs, and no correspondence-based transfer is
      needed to make the measurement; the transfer question is only whether the
      exponent persists to larger N. Comparison distribution: the fitted exponent
      against the random-involution null arm, plus the raw evaluation counts
      against Theta(min(N^2/w, N^{3/2}/w^{1/2})) with fitted constants. Tail
      checks: the 95th percentile of evaluation counts per cell must obey the
      same law as the median; a heavy right tail in the sigma arm only would
      indicate a rare structured obstruction rather than a mean effect and must
      be reported separately. Transfer assumptions, recorded: the exponent
      measured at N up to a few thousand is extrapolated to N = p^{1/3} at
      cryptographic p, an extrapolation of more than twenty decades that this
      experiment cannot justify and that is the dominant limitation of the whole
      design.
  - id: H2
    statement: >-
      Membership hardness. There is no algorithm computing the predicate
      Mem(E, E'', X, B) = "there exists a B-smooth cyclic isogeny E -> E'' of
      degree at most X" in time and memory p^{o(1)} for X = p^{1/6+o(1)} and
      B = p^{o(1)}, for a uniformly random supersingular pair (E, E''), with
      advantage bounded away from that of the trivial predicate.
    rigorous_support: >-
      The rigorous fact leaned on is that Mem with X unbounded is the
      supersingular isogeny problem itself, which the reduction network of the
      in-repo Corollary 1.2 makes polynomially equivalent to EndRing and OneEnd -
      so Mem at full range is as hard as the problem, and the only question is
      whether the smooth, bounded-degree restriction is easier. The classical
      statement being imitated is the standard expectation that a
      bounded-distance decision problem in an expander graph is not easier than
      the corresponding search when the ball size exceeds the storage budget. H2
      is stated so that it can FAIL: the archive's own EXP-ALISO-006, 008 and 009
      are attempts at exactly such a primitive, and their self-recorded failure
      is evidence about those attempts and not about the problem.
    validation_plan: >-
      Sample: at toy p, compute Mem exhaustively for all pairs (E, E'') by full
      enumeration - this is the ONLY scale at which ground truth is available -
      and then evaluate every candidate cheap estimator against it: subfield
      membership of E'', the Frobenius-orbit invariant, the degree-support
      vectors recorded by EXP-ALISO-006/036/037, and the Krylov statistics of
      EXP-ALISO-008. Scale: three toy primes with supersingular sets of 10^2 to
      10^4 vertices, full pair enumeration. Comparison distribution: ROC of each
      estimator against exhaustive ground truth, with the trivial base-rate
      predictor as the null. Tail checks: performance on the hardest decile -
      pairs whose Mem value flips under a small change of X - where a genuine
      estimator must retain advantage and a base-rate artifact must not.
      Transfer assumption: an estimator that works at 10^4 vertices is assumed to
      extend; nothing in this design tests that, and an estimator found here
      would need a separate scaling experiment before any claim.

  target_complexity:
    time_exponent: >-
      No new time exponent is claimed. The predicted frontier is
      time = min(p^{2/3}/w, p^{1/2}/w^{1/2}) * p^{o(1)} at memory w, which at
      w = p^{1/3} gives Wesolowski's p^{1/3+o(1)} and at w = poly(log p) gives
      p^{1/2+o(1)}. The falsifying branch (e_sigma < e_null) would give time
      p^{1/3+o(1)} at memory strictly below p^{1/3}, with the achievable exponent
      set by the measured gap.
    memory_exponent: >-
      w, treated as the free parameter. The proposal's whole subject is the
      shape of the frontier in w, and its predicted outcome is that the frontier
      is the generic one.
    best_known: >-
      Wesolowski (in-repo full text, eprint 2026/1486): p^{1/3+o(1)} time and
      memory, heuristic. Udovenko (eprint 2026/1575, abstract retrieved):
      p^{2/5+o(1)} time and memory, unconditional. Delfs-Galbraith ([21]):
      p^{1/2}(log p)^{O(1)} time, negligible memory. van Oorschot-Wiener applied
      to this claw, as reported in the in-repo section 1.1:
      p^{1/2+o(1)}/w^{1/2} time with memory w, and p^{1/2+o(1)}/(w^{1/2} n) with
      n processors. Mamah (eprint 2026/1821, abstract retrieved): concrete
      assessment of exactly these tradeoffs including quantum variants.
    hidden_overhead: >-
      The p^{o(1)} in the frontier expression carries Wesolowski's own
      superpolynomial u^{u} success-probability overhead, unchanged - this
      proposal does nothing about it and must not be read as reducing it. It also
      carries the B^{O(1)} modular-polynomial cost per list entry, which the
      source declines to optimise. At toy scale both dominate the measurement
      completely, which is exactly why every prediction here is an arm difference
      rather than an absolute exponent.
    tradeoff_note: >-
      This proposal is entirely about the time-memory tradeoff and adds nothing
      to time at fixed memory. Parallelization: the source states its algorithm
      parallelizes perfectly, and van Oorschot-Wiener parallelizes to
      p^{1/2+o(1)}/(w^{1/2} n); the distinguished-point search measured here
      inherits that and the measurement is single-threaded by design so the
      parallel behaviour is derived rather than measured. Quantum position: per
      [29] as relayed in the in-repo text, quantum computation is expected to
      reduce memory rather than time here, so a classical memory result of the
      falsifying branch would partially overlap the quantum benefit and that
      overlap must be stated in any comparison.

  dominated_by: >-
    Part (B), the frontier statement, is dominated by eprint 2026/1821 (Mamah,
    approved 2026-08-28), which by its abstract analyses concrete costs, memory,
    van Oorschot-Wiener optimisations, quantum claw-finding and the scenarios
    where low-memory algorithms still win - i.e. the same frontier, at greater
    depth, with the paper's own numbers. Read at abstract level only. On the
    algorithmic frontier itself this proposal claims no point, so its position is
    "n/a (no result claimed)" for parts (C) and (D). Frontier rows checked this
    session: Wesolowski p^{1/3+o(1)}/p^{1/3+o(1)}; Udovenko
    p^{2/5+o(1)}/p^{2/5+o(1)} unconditional; Delfs-Galbraith p^{1/2}polylog /
    negligible; van Oorschot-Wiener p^{1/2+o(1)}/w^{1/2} with memory w;
    Jaques-Schanck quantum claw-finding (recalled, memory-reducing at equal
    time); eprint 2026/1821 concrete assessment (abstract only). NOT CHECKED: the
    van Oorschot-Wiener and Jaques-Schanck primary sources, neither fetched; and
    no search was run for prior work specifically on involution-structured claw
    finding, which is the one place part (C) could already exist. Declared
    incomplete rather than null.
  sota_delta: >-
    Predicted outcome: sota_delta = 0 on every axis - the measurement is expected
    to confirm the generic frontier and produce a controlled null plus a
    fixed-set-density threshold. Falsifying outcome: memory exponent reduced from
    1/3 to 1/3 - g at time exponent 1/3, where g is set by the measured exponent
    gap; at p = 2^256 each 0.05 of memory exponent is a factor 2^{12.8} of
    storage against the 2^{92.5} figure in the source's section 4.1. The
    experiment claims neither; it measures the gap.

  estimated_cost:
    implementation: high
    compute: medium

  recommended_priority: low
