idea:
  id: IDEA-20260829-bb6e9b
  question_id: RQ-ALISO-001
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'

  title: >-
    Wesolowski's claw is a SELF-claw under an efficiently computable involution,
    not a claw between two independent sets; the Autolab Hecke-support and Krylov
    packages are failed attempts at the membership oracle that would exploit
    that, and a random-involution null decides in one measurement whether the
    involution is worth an exponent or a factor of two

  class: measurement

  claim: >-
    (A) THE STRUCTURE THE COST MODEL IGNORES. Algorithm 2 of the in-repo text
    builds ONE table L(E,X,B) keyed by codomain and searches for a pair
    (E', psi) and ((E')^{(p)}, chi) both inside it. So the search is not a claw
    between two independent sets of size N = p^{1/3+o(1)}; it is a claw between L
    and sigma(L), where sigma is the Frobenius conjugation involution
    j -> j^p on the supersingular set - an involution that is computable in
    O(log p) field operations and that COMMUTES with every ell-isogeny adjacency
    operator, so it acts on the whole search structure and not merely on its
    output. Section 1.1 nevertheless prices the search as a generic claw problem
    of size N and quotes van Oorschot-Wiener's time p^{1/2+o(1)}/w^{1/2} with
    memory w, and states plainly: "It is currently unclear how to reduce the
    memory cost without increasing the time."

    (B) THE CLAIM, WITH ITS NULL. Claim: the sigma-structure is worth a bounded
    factor and no exponent. Concretely, the golden-collision cost of the
    sigma-structured instance is statistically indistinguishable from the cost on
    a RANDOM-INVOLUTION null of the same shape - same vertex set, same list size,
    same distinguished-point parameters, a uniformly random fixed-point-free
    involution in place of sigma - so the achievable frontier is
    time = min(N^2/w, N^{3/2}/w^{1/2}) * p^{o(1)} with N = p^{1/3+o(1)}, i.e.
    min(p^{2/3}/w, p^{1/2}/w^{1/2}), whose two branches cross exactly at
    w = p^{1/3}. Wesolowski's operating point is that crossing point, which is
    why no partition-and-stream scheme improves on van Oorschot-Wiener below it.

    (C) WHY THAT IS NOT A FOREGONE CONCLUSION. sigma is not a random involution:
    its fixed-point set is the subfield locus S_p of size Theta(sqrt p), it is
    the Frobenius action, and it commutes with the isogeny operators. An
    involution with a large, structured, cheaply recognisable fixed set can in
    principle be exploited: any walk that lands on a fixed point yields a
    collision for free with no stored table. The measurement decides whether that
    channel carries anything at the relevant list size. If the sigma arm beats
    the null arm by a measurable exponent, memory below p^{1/3} at time
    p^{1/3} becomes reachable and the open question the paper names is answered.
    If it does not, the frontier in (B) is established as a scoped negative with
    a named mechanism, and the correct forward guidance is that the only
    remaining opening is a sublinear MEMBERSHIP PREDICATE for the smooth-isogeny
    ball.

    (D) THE MEMBERSHIP PREDICATE, AND THE AUTOLAB PACKAGES THAT ALREADY TRIED IT.
    Define the predicate Mem(E, E'', X, B): "is there a B-smooth cyclic isogeny
    E -> E'' of degree at most X?" If Mem were computable in p^{o(1)} time and
    memory, Algorithm 2 needs no table at all: walk over candidate midpoints and
    test. The imported Autolab packages EXP-ALISO-006, 008, 009, 036 and 037 are
    attempts at exactly this class of primitive - degree-pair support enumeration,
    a Hecke-Krylov probe, and a Hecke support-cost probe - and their own recorded
    statuses are "SUPPORT-PRIMITIVE NOT IMPLEMENTED" (006) and "TOY-EVIDENCE /
    FULL-GRAPH ORACLE / MODEL-BOUND / ALGORITHM FALSE" with success false (008).
    Those are self-declared negatives at full-graph-oracle scope. This proposal
    does not repeat them; it reformulates the target as Mem and gives the
    measurement that would show whether ANY sublinear estimator is available,
    including the null that says it is not.

  mechanism: >-
    Golden-collision search on a random function over a range of size R finds a
    designated collision in time R^{3/2}/w^{1/2} with memory w (van
    Oorschot-Wiener), while blocked exhaustive comparison of a list of size N
    against itself in blocks of size w costs N^2/w. Both are generic: they use
    nothing about how the list is generated. The only two ways to beat them are
    (i) an algebraic membership test that removes the need to store one side, or
    (ii) structure in the pairing map that concentrates the golden pair into a
    small, cheaply enumerable subset. Here the pairing map is sigma, and sigma's
    structure is entirely in its fixed locus and in its commutation with the
    isogeny operators. Commutation means sigma maps the ball around E to the ball
    around E^{(p)} - useful for correctness, useless for search, because it moves
    the whole list rather than distinguishing a part of it. The fixed locus is
    the only asymmetry, and it has density p^{-1/2}, so a list of size p^{1/3}
    contains an expected p^{-1/6} fixed points: typically none. That is the
    mechanism by which the involution is predicted to be worth nothing, and it is
    the same density arithmetic that appears in IDEA-20260829-980192 from the
    other direction. The two proposals therefore share one obstruction
    measurement and can be run against a shared fixture.

