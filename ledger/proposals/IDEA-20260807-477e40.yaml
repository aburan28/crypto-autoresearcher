idea:
  id: IDEA-20260807-477e40
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    Decide, by exact symbolic support computation rather than by timing, whether
    setting a=0 (j=0) or b=0 (j=1728) in the Semaev decomposition system is a
    DEGREE reduction, a SUPPORT/COEFFICIENT reduction, or NOTHING - with the
    m=2 answer pre-registered as "nothing after specialisation" and the m=3
    answer pre-registered as "support restricted to total-x-degree 0 mod 3 for
    a=0, with per-variable degree unchanged at 4"
  class: measurement

  claim: >-
    (A) WHAT IS ACTUALLY SIMPLER. The third summation polynomial for
    y^2 = x^3 + a x + b (KN-TECH-002, harness/semaev.py:s3_expr) is
      S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
            + ((x1 x2 - a)^2 - 4 b (x1+x2)).
    Expanded, it carries exactly 13 monomials in (x1,x2,x3). Setting a=0 kills
    the four monomials whose coefficient is a multiple of a or a^2 (namely
    x1x3, x2x3, x1x2 and the constant), leaving 9. Setting b=0 kills the three
    monomials with coefficient -4b (namely x3, x1, x2), leaving 10. Per-variable
    degree is 2 in every case; total degree is 4 in every case. So on the
    UNSPECIALISED polynomial the effect is a 31 percent (a=0) or 23 percent
    (b=0) support reduction and NOT a degree reduction. [derived in this record
    by hand; to be re-verified symbolically as the experiment's first act, and
    treated as a pre-registered prediction, not as a measurement.]

    (B) THE PART THAT MATTERS IS THE SPECIALISED SYSTEM, AND THERE THE EFFECT
    APPEARS TO BE ZERO. Index calculus never solves S_3; it solves
    S_3(x1, x2, x_R) with x_R the target's x-coordinate, together with
    factor-base membership. Collecting coefficients of the 9 surviving monomials
    in (x1,x2):
      1        : a^2 - 4 b x_R
      x1, x2   : -2 a x_R - 4 b
      x1x2     : -2 x_R^2 - 2a
      x1^2,x2^2: x_R^2
      x1^2x2, x1x2^2 : -2 x_R
      x1^2x2^2 : 1
    For generic x_R and b != 0 the a=0 specialisation leaves ALL NINE
    coefficients nonzero; for a != 0 the b=0 specialisation likewise. Therefore
    THE SPECIALISED SYSTEM AT m=2 HAS IDENTICAL SUPPORT, IDENTICAL NEWTON
    POLYGON AND IDENTICAL BKK BOUND ON j=0, j=1728 AND GENERIC CURVES. The
    a=0 / b=0 simplification is invisible to any solver whose cost is a
    function of the support. That is the answer "NOTHING", stated in advance and
    falsifiable by one sympy call.

    (C) THE PART THAT IS GENUINELY OPEN, AND WHY. S_3 restricted to a=0 is
    WEIGHTED-HOMOGENEOUS of weight 4 under deg(x_i)=1, deg(b)=3; restricted to
    b=0 it is weighted-homogeneous of weight 4 under deg(x_i)=1, deg(a)=2.
    [derived here; verifiable by inspection of the nine/ten monomials.] Because
    the resultant of two weighted-homogeneous polynomials is weighted-
    homogeneous, S_4 = Res_t(S_3(x1,x2,t), S_3(x3,x4,t)) inherits weight
    2*4 + 2*4 - 2*2*1 = 12. Setting u = zeta_3 (so u^3 = 1 and b is fixed) gives
    S_4|_{a=0}(zeta x1, ..., zeta x4) = zeta^{12} S_4|_{a=0} = S_4|_{a=0}:
    S_4 on a j=0 curve is INVARIANT under the diagonal mu_3 action, so its
    support is confined to monomials of total x-degree congruent to 0 mod 3.
    That is a factor-approximately-3 support restriction that has no analogue on
    a generic curve. Whether it survives the specialisation x4 := x_R - which
    breaks the diagonal action, because x_R is a constant - is the single open
    question this proposal exists to answer.

    (D) WHAT IS BEING CLAIMED BEYOND THE sqrt(|Aut|) CONSTANT: NOTHING. Per
    KN-TECH-018 the automorphism discount is a constant at most sqrt(6) and
    never an exponent. This proposal claims no speedup of any kind. Its output
    is a set of exact integers (monomial counts, Newton polytope vertices, BKK
    mixed volumes, Groebner solving degrees) that either license or forbid every
    downstream L3 claim about "the equation is simpler on j=0 curves". It is
    filed as BASELINE CALIBRATION, not as an attack.

    (E) THE THREE OUTCOMES, EACH WITH ITS MEANING FIXED IN ADVANCE.
      O1 DEGREE REDUCTION. Per-variable or total degree of the specialised
        system drops at a=0 or b=0, or S_4|_{a=0} FACTORS over F_p into pieces
        of strictly lower degree. This would be the first genuine structural
        gain in L3 and would move the lane from calibration to target. Predicted
        probability: low, because the leading coefficients of S_3 in t
        ((x1-x2)^2 and (x3-x4)^2) contain neither a nor b, so the t-degree and
        hence the resultant degree cannot drop.
      O2 SUPPORT REDUCTION ONLY. Support and BKK shrink (predicted: by about a
        third on unspecialised S_3, by about two thirds on unspecialised S_4 at
        a=0 via the mod-3 grading) while per-variable degree and measured
        Groebner solving degree do not. Meaning: a constant-factor arithmetic
        saving in building the Macaulay/F4 matrices, bounded by the support
        ratio, with no exponent movement.
      O3 NOTHING. Specialised support, Newton polygon, BKK and solving degree
        are identical to generic. Meaning: the a=0 / b=0 "simplification" is an
        artifact of how S_3 is written, and every L3 argument that leans on
        "the equation is simpler" is void. This is the predicted outcome at m=2.

  resource_label: >-
    R2 - the curve equation (a,b) and the polynomial system it induces. This is
    the resource, not the group: nothing here applies any map to a point of G.

  admissibility: admissible
  admissibility_argument: >-
    The measured objects are the monomial support, Newton polytope, BKK mixed
    volume and Groebner solving degree of a polynomial system over F_p. None of
    these is a group-operation output, so the H-ENDO-001 scalar-action argument
    does not apply: that argument says every endomorphism acts on the
    prime-order G as multiplication by a scalar, which constrains what can be
    done WITH POINTS OF G and says nothing about the shape of the equation whose
    solutions those points are. The KN-FIND-b7e091 GGM closure likewise bounds
    oracles simulable by group operations and equality tests; the coefficient
    vector of S_3 is field data the generic-group oracle does not return
    (DECOMPOSITION.md section 2, resource R1/R2). Admissible - and admissible is
    not the same as useful; see (D).

  discriminated_from:
    - >-
      IDEA-20260807-f8a045 (this batch): that proposal measures how many
      RELATIONS one successful decomposition yields on a mu_k-stable factor
      base, and whether the orbit constraint depresses decomposition
      probability. It takes the polynomial's shape as given. This proposal
      measures the polynomial's shape and takes relation accounting as given.
      Neither result implies the other.
    - >-
      IDEA-20260807-d329e2 (this batch): that proposal CHANGES THE COORDINATE
      (x to the mu_6-invariant w = y^2) and derives a different polynomial. This
      proposal keeps the x-coordinate and only specialises the coefficients.
    - >-
      H-STR-002 (status weakened, DEC-20260727-009). That hypothesis concerns
      the DISPLACEMENT RANK of the relation matrix on a phi-invariant factor
      base. It contains no statement about the monomial support of S_m and this
      proposal neither re-asserts nor tests it. The transition record's
      "what_this_transition_does_not_assert" clause explicitly leaves the
      C_3-equivariance of the closed system untested; this proposal touches only
      the support and degree, which no arm of EXP-STR-003 measured.
    - >-
      KN-TECH-002, which records deg(S_n) = 2^{n-2} per variable for the generic
      curve. This proposal asks whether that bound is attained at a=0 and b=0 -
      a question KN-TECH-002 does not address.

  object_first_candidate:
    tracked_object: >-
      THE MONOMIAL SUPPORT (equivalently, the Newton polytope) of the
      decomposition system, followed as the pair (a,b) moves from generic to
      (0,b) to (a,0), and as the arity m and the specialisation x_{m+1} := x_R
      are applied.
    lossiness: >-
      GENUINELY LOSSY. The support forgets every coefficient value - it retains
      only which monomials occur. Two systems with the same support can have
      completely different solution sets, so no solution and no discrete
      logarithm can be recovered from it. It is exactly the projection that BKK
      and the degree-of-regularity heuristics already consume.
    propagation: >-
      Compatible with the operations that build the system: the support of a
      resultant is contained in a set determined by the supports of its
      arguments (that is what makes the BKK bound a bound), and specialisation
      of a variable maps support to support by projection along that
      coordinate. So the retained part propagates deterministically through
      "build S_3, take resultant to get S_4, specialise x_{m+1} := x_R". It does
      NOT propagate through cancellation: a resultant's support can be strictly
      smaller than the projected prediction, and finding out where it is is the
      whole point of the measurement.
    survival_score: >-
      Survives the passage from S_3 to S_4 (that is measured here). Dies at any
      change of model (Edwards, Montgomery, Hessian - lane L11 / RQ-MODEL-e61cb2
      owns that) and dies at any claim about solving TIME, because two systems
      with the same support can have very different solving behaviour. The
      object is deliberately weak; its value is that it is exactly computable.

  mechanism: >-
    STEP 0 (minutes, symbolic, ZERO risk). Re-derive (A) mechanically:
    sympy.Poly(s3_expr(a,b), x1,x2,x3) over Q[a,b], count monomials; substitute
    a=0 and b=0; count again. Assert 13 / 9 / 10. A mismatch means the hand
    derivation in (A) is wrong and everything downstream is re-based on the
    machine numbers before anything is reported.

    STEP 1 (minutes). Specialise x3 := x_R symbolically over Q[a,b,x_R], collect
    in (x1,x2), and record which of the 9 coefficients vanish identically under
    a=0 and under b=0. Assert: none, for generic x_R. This is the (B)
    prediction and it is the cheapest possible test of the lane's premise.

    STEP 2 (minutes). Verify the weighted-homogeneity in (C): check that
    S_3|_{a=0} is homogeneous of weight 4 with deg(b)=3 and S_3|_{b=0} is
    homogeneous of weight 4 with deg(a)=2, by evaluating the weight of every
    monomial.

    STEP 3 (minutes to an hour). Compute S_4 = Res_t(S_3(x1,x2,t),
    S_3(x3,x4,t)) generically (harness/semaev.py already has s4_expr), then at
    a=0 and at b=0. Record: per-variable degree, total degree, monomial count,
    and - for a=0 - the distribution of total x-degree mod 3. Assert per-variable
    degree 4 in all three cases and, at a=0, support confined to x-degree
    congruent to 0 mod 3.

    STEP 4 (minutes). Attempt sympy.factor on S_4, S_4|_{a=0}, S_4|_{b=0} over
    Q and over F_p for three declared primes. A factorisation at a=0 that does
    not occur generically is outcome O1 and is the one interesting event; report
    it and stop, because it would need independent verification before anything
    else in this lane is run.

    STEP 5 (hours). Newton polytope vertices and BKK mixed volume for the
    specialised systems at m=2 and m=3, generic vs a=0 vs b=0, computed on the
    identical code path.

    STEP 6 (hours). The empirical arm, and the only one that costs real compute:
    on matched toy instances (see minimal_test), run the existing
    harness/semaev.py Groebner measurement on the three curve families and
    record groebner_basis_max_degree, groebner_basis_size and
    groebner_seconds. These are implementation-bound proxies and
    harness/semaev.py's own docstring says so; they are reported as proxies and
    never as the degree of regularity.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) grep -ril "newton polytope" knowledge/ ledger/ docs/ analysis/
      (2) grep -ril "summation polynomial" knowledge/ | wc -l
      (3) grep -rn "a=0\|a = 0\|b = 0" knowledge/ -i
      (4) grep -ril "hilbert class polynomial" knowledge/ ledger/ docs/ analysis/
      (5) read knowledge/techniques/KN-TECH-002.md in full
      (6) read harness/semaev.py in full
    results: >-
      (1) 22 files contain Newton-polytope / BKK / mixed-volume material,
      concentrated in KN-TECH-007, KN-FIND-017/018/019, KN-FIND-2a8b7e,
      KN-FIND-c7d31e and KN-OPEN-004: the program has a mature BKK instrument.
      (2) 40+ files mention summation polynomials. (3) Only three hits for the
      literal a=0 / b=0 specialisation anywhere in knowledge/, and the only
      substantive one is KN-FIND-003, which concerns mu_3 orbits of Mordell-Weil
      sections on a LIFTED j=0 family in the Xedni lane - a different object in
      a different lane. (5) KN-TECH-002 states deg = 2^{n-2} for the generic
      curve and says nothing about specialisation. (6) harness/semaev.py builds
      S_3 and S_4 with a and b symbolic and never specialises them. NO RECORD IN
      THIS REPOSITORY COMPUTES THE SUPPORT OF A SUMMATION POLYNOMIAL AT a=0 OR
      b=0.
    verdict: >-
      ADAPTATION. The BKK/Newton-polytope instrument exists and is being pointed
      at a target it has not been pointed at. No novelty is claimed against the
      external literature: the mu_3-grading of S_4 on j=0 curves is elementary
      and may well be folklore, and a Stage-0 literature check is part of the
      design. A positive external hit would be an ingredient (it would supply the
      m>=4 answer for free), not a disappointment.

  null_object_control: >-
    MANDATORY AND BLOCKING. Matched null: a GENERIC-j curve at the same prime p,
    with (a,b) both nonzero, drawn from the same generator, measured on the
    identical code path at the identical factor-base size. The comparison is
    generic vs a=0 vs b=0 and never a=0 against nothing.
    DECAY PARAMETER: the arity m. A support/BKK gap at a=0 that does NOT grow
    with m is a coefficient-writing artifact and not structure - because the
    mod-3 grading argument in (C) predicts the gap to grow (weight 4 at m=2,
    weight 12 at m=3, weight growing with m), while a fixed-size gap is what a
    bookkeeping artifact looks like. A gap that is constant in m is the canonical
    artifact tell of docs/inventor-protocol.md section 3 and must be reported as
    such.
    SECOND NULL (representation null, and it is the sharp one): the SAME j=0
    curve written with a different b. Over F_p, b and u^6 b give F_p-ISOMORPHIC
    curves for any u in F_p^*, hence identical ECDLP and identical everything
    intrinsic. Any support, BKK or solving-degree difference between b and u^6 b
    is measuring the representative, not the curve, and voids the instrument.

  assumptions:
    - >-
      p > 3 and p is congruent to 1 mod 3 for the j=0 family (else the order-3
      automorphism is not F_p-rational and the curve y^2 = x^3 + b is
      supersingular), and congruent to 1 mod 4 for the j=1728 family. Curves are
      verified ordinary by point counting before use.
    - >-
      The hand derivations in (A), (B) and (C) are PREDICTIONS, not
      measurements. Step 0-3 verify them mechanically and the record is
      superseded if any of them is wrong.
    - >-
      Toy scale, p up to about 2^24 for the Groebner arm and purely symbolic
      over Q[a,b] for the support arm. sympy's Buchberger-family routine is not
      an optimised F4 and does not expose the degree of regularity; only
      observable proxies are reported (harness/semaev.py docstring).
    - >-
      x_R != 0 for the generic-specialisation claim in (B). On a j=0 curve with
      b a square, (0, sqrt(b)) IS a point, of order 3; x_R = 0 is a degenerate
      stratum on which several coefficients vanish and it is measured separately
      rather than folded into the generic count.

  proof_search_map:
    bottleneck: >-
      The resultant computation Res_t(S_3(x1,x2,t), S_3(x3,x4,t)) over Q[a,b],
      and, at m>=4, the iterated resultant. This is the step whose cost sets the
      largest reachable m, and it is also the step where the predicted mod-3
      support grading either appears or cancels.
    baseline_embedding:
      parameter_slice: >-
        Generic (a,b), m = 2 and m = 3, no specialisation. Must reproduce
        KN-TECH-002's recorded per-variable degrees 2 and 4 exactly, and must
        reproduce harness/semaev.py's s3_expr and s4_expr term for term.
      reproduction_check: >-
        Frozen fixture: exact integer equality of the expanded polynomial
        against harness/semaev.py's output on a fixed (a,b,p). Any mismatch is
        an instrument failure and halts the line before any specialisation is
        computed.
    observation_collision:
      observable: >-
        The monomial support (equivalently the Newton polytope) of the
        specialised system.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED at m=2, which is precisely prediction
        (B): a j=0 curve, a j=1728 curve and a generic curve at the same p and
        the same x_R are three distinct ground-truth objects with the SAME
        observable. That collision is the result, not a falsifier: it establishes
        that support cannot distinguish special j from generic j at m=2, and
        therefore that no support-based or BKK-based argument may be used to
        claim a j=0 advantage at m=2. Reporting a support-based j=0 claim
        without exhibiting this collision search is prohibited.
    quantifier_order: >-
      Intended: FORALL primes p in the declared set, FORALL ordinary curves E/F_p
      with a=0 (resp. b=0), FORALL targets R with x_R not in the declared
      degenerate stratum, the specialised m=2 system's support EQUALS the
      support of the corresponding generic-curve system.
      The dangerous weaker reading, NOT claimed: FORALL E EXISTS a target x_R for
      which the supports agree - which would let x_R be chosen per curve and
      would be vacuous. The audit obligation is that the coefficient list in (B)
      is checked as a list of polynomials in (a,b,x_R) that are not identically
      zero, uniformly, and not at sampled points.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For arities m in the tested set, at the declared primes, in short
        Weierstrass form, the monomial support and BKK bound of the specialised
        decomposition system are (or are not) changed by a=0 / b=0." It can
        never certify anything about solving TIME, about other curve models,
        about m outside the tested set, or about the ECDLP.
      nearby_object_control: >-
        The NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS is a curve with
        a and b both nonzero but with b a sixth power (so that (a,b) "looks
        special" in an arithmetically irrelevant way). The method must NOT
        report a support change there. A support instrument that fires on a
        sixth-power b is detecting a numerical accident and has not identified
        the load-bearing structure.
    proof_obligations:
      - claim: The 13/9/10 monomial counts of unspecialised S_3.
        responsibility: correctness
      - claim: The nine specialised coefficients in (B) are not identically zero.
        responsibility: correctness
      - claim: S_3|_{a=0} is weighted-homogeneous of weight 4 with deg(b)=3.
        responsibility: correctness
      - claim: >-
          S_4|_{a=0} is diagonal-mu_3-invariant, hence supported on total
          x-degree congruent to 0 mod 3.
        responsibility: correctness
      - claim: Per-variable degree of S_4 is 4 at a=0 and at b=0.
        responsibility: scope
      - claim: >-
          The symbolic pipeline reproduces harness/semaev.py's s3_expr/s4_expr
          exactly on a frozen fixture.
        responsibility: baseline

  predictions:
    - metric: monomial count of unspecialised S_3 over Q[a,b], generic / a=0 / b=0
      direction: lower
      minimum_effect: >-
        Exactly 13 / 9 / 10. Any other triple falsifies the derivation in (A)
        and the record is superseded rather than amended.
    - metric: >-
        monomial count of the SPECIALISED m=2 system in (x1,x2) after x3 := x_R,
        generic / a=0 / b=0
      direction: different
      minimum_effect: >-
        Predicted 9 / 9 / 9 - i.e. NO DIFFERENCE. Any difference at generic x_R
        is a positive result for the lane and must be reported and independently
        replicated before use. This is the prediction that decides outcome O3.
    - metric: per-variable degree of S_4 at a=0 and at b=0
      direction: different
      minimum_effect: >-
        Predicted 4, unchanged from generic. A drop to 3 or below is outcome O1
        and would be the lane's first real finding.
    - metric: >-
        fraction of S_4|_{a=0} monomials whose total x-degree is congruent to
        0 mod 3
      direction: higher
      minimum_effect: >-
        Predicted exactly 1.000 (all of them), against a generic-curve baseline
        of approximately 1/3. A measured fraction strictly between 1/3 and 1
        falsifies the weighted-homogeneity argument in (C).
    - metric: >-
        BKK mixed volume of the specialised m=3 system, a=0 vs generic, at
        matched factor-base size
      direction: lower
      minimum_effect: >-
        A ratio of at least 1.5 is required before any "the equation is simpler
        at m=3" statement may be made. A ratio in [0.9, 1.1] is outcome O3 at
        m=3 and closes the support route for m<=3.
    - metric: >-
        sympy Groebner max-degree proxy and basis size, a=0 vs b=0 vs generic,
        at matched p, matched factor-base size and matched target
      direction: different
      minimum_effect: >-
        Predicted identical distributions (Mann-Whitney p > 0.05 over the seed
        set). Because this is an implementation-bound proxy, a difference here
        WITHOUT a corresponding support or BKK difference is evidence about
        sympy, not about the curve, and must be reported in those words.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS STEP 1 ALONE, AND IT COSTS SECONDS.
      Symbolically specialise S_3(x1,x2,x_R) over Q[a,b,x_R], collect in
      (x1,x2), list the nine coefficients, and check which vanish identically at
      a=0 and at b=0. If none vanish, the lane's premise "the equation is
      genuinely simpler on a=0 curves" is FALSE at m=2 and every downstream
      claim in this batch that leans on it is void without any compute at all.
      Steps 0, 2, 3, 4 add the m=3 answer for minutes more. Only Step 6 costs
      real compute, and it is run only if Steps 1-5 produce a nonzero gap worth
      chasing.
    controls:
      - generic-j curve at the same p, same factor-base size, same target
      - >-
        representation null: the same j=0 curve written with b replaced by
        u^6 b for three declared u, which must give identical everything
      - >-
        nearby-object control: a curve with a,b both nonzero but b a sixth
        power, on which no support change may be reported
      - >-
        degenerate stratum measured separately: x_R = 0 on a j=0 curve with b a
        square, where the coefficient list genuinely does collapse
      - >-
        frozen fixture reproducing harness/semaev.py's s3_expr and s4_expr term
        for term before any specialisation is computed
    required_metrics:
      - monomial count and full support list, per (m, specialisation)
      - per-variable degree and total degree, per (m, specialisation)
      - Newton polytope vertex list and BKK mixed volume, per (m, specialisation)
      - distribution of total x-degree mod 3 for S_4|_{a=0}
      - factorisation result over Q and over each declared F_p
      - >-
        sympy Groebner max-degree proxy, basis size, wall time, per (curve
        family, seed, factor-base size), labelled implementation-bound proxy
      - pass/fail of every control above

  falsification_conditions:
    - >-
      The 13/9/10 counts are wrong. The derivation in (A) is false; supersede
      this record before proceeding.
    - >-
      Any of the nine specialised coefficients in (B) vanishes identically at
      a=0 or at b=0 for generic x_R. Prediction (B) is false and the lane gains
      a target; this must be independently replicated before it is used.
    - >-
      S_4|_{a=0} has a monomial of total x-degree not congruent to 0 mod 3.
      The weighted-homogeneity argument in (C) is false as stated.
    - >-
      The representation null fires: b and u^6 b give different support, BKK or
      solving degree. The instrument is measuring the representative and every
      number it produced is void.
    - >-
      The resultant at m=3 exceeds the memory budget before any support is
      resolved. That is an INFRASTRUCTURE outcome under AGENTS.md rule 5,
      recorded as such, and is not evidence about support.

  confounders:
    - >-
      MONOMIAL COUNT IS NOT SOLVING COST. A system with fewer monomials can be
      harder to solve. Every reported count is accompanied by the BKK bound and
      by the empirical proxy, and no count is reported as a cost.
    - >-
      SYMPY IS NOT F4. groebner_basis_max_degree is a property of the returned
      reduced basis, not the maximum degree reached during computation. A
      difference in this proxy without a support/BKK difference is a solver
      artifact.
    - >-
      SPECIALISATION ORDER. Specialising x_{m+1} := x_R before versus after
      taking the resultant can give different intermediate supports. The order
      is frozen before Step 3 and stated with every number.
    - >-
      SMALL p. At p < 2^10 accidental coefficient collisions mod p can shrink
      support for reasons unrelated to a=0. All support work is done over Q[a,b]
      first and only then reduced mod each declared p, and the two are reported
      separately.
    - >-
      COORDINATE CHOICE. Everything here is short Weierstrass. Lane L11
      (RQ-MODEL-e61cb2) owns the model question and a support result in one
      model does not transfer to another.

  interpretation_limits:
    - >-
      No speedup of any kind is claimed. Outcome O2 would bound a
      constant-factor arithmetic saving by the support ratio and nothing more.
    - >-
      Nothing here touches the exponent, which is fixed at 1/2 for generic
      methods (KN-TECH-005 as cited in KN-TECH-018) and is not challenged.
    - >-
      Scoped to short Weierstrass form, arities m in {2,3}, the declared primes,
      and the declared factor-base construction.
    - >-
      Even outcome O1 would be a statement about one step of one attack family
      that does not currently beat rho over prime fields at all.

  reachability_gate: >-
    NOT APPLICABLE AS A WALK - this proposal fixes the curve and performs no
    isogeny step, so T5 imposes no cost. But T4 is binding on how the result may
    be read: j = 0 requires D_0 = -3 and j = 1728 requires D_0 = -4, so a curve
    whose isogeny class does not already contain such a curve CANNOT BE WALKED
    TO ONE AT ANY PRICE. Consequently, even outcome O1 would apply only to
    curves already in a D_0 = -3 or D_0 = -4 class and would confer nothing on
    any other curve. This limit is stated here so that no downstream record can
    read a positive result as generally applicable.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and none is reachable from this proposal.
      The best case, outcome O1 with a full degree halving at every m, would
      change the constant in the per-decomposition solve inside an index-calculus
      family that does not beat rho over prime fields; it would not move the
      1/2 exponent.
    memory_exponent: >-
      Not applicable to a claim; as an experiment, the resultant at m=3 over
      Q[a,b] is the memory-dominant step and is measured and reported per cell.
    best_known: >-
      Prime-field ECDLP: parallel Pollard rho with distinguished points at
      0.886*sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006);
      on CM curves the automorphism-discounted variant, at most sqrt(6) better
      (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory, with full cost
      N^{2/3+o(1)} once memory is charged (KN-TECH-031). For the decomposition
      step specifically, KN-TECH-002's per-variable degree 2^{n-2}.
    hidden_overhead: >-
      None hidden, because no asymptotic claim is made. The honest disclosure is
      the opposite one: the support reduction reported in (A) is measured on a
      polynomial that no solver ever sees, and (B) predicts it vanishes on the
      polynomial solvers do see. That gap is the finding.
    tradeoff_note: >-
      Not applicable - no algorithm is produced. The symbolic computation's own
      time/memory behaviour is bookkeeping, not a cryptanalytic tradeoff.

  dominated_by: >-
    AS AN ATTACK: mounts none, so it is dominated on every axis by every row of
    the prime-field frontier, checked individually. Time: rho at 0.886*sqrt(N)
    (KN-TECH-001, KN-TECH-006) - this proposal offers no time. Memory: rho at
    O(1) - this proposal offers no algorithm to compare. Data/queries: rho needs
    only P and Q - this proposal needs the curve equation, which is public, and
    still offers nothing. Automorphism-discounted rho on CM curves (KN-TECH-018)
    dominates it on the specific family it studies. BSGS (KN-TECH-031) dominates
    it in the memory-rich corner. dominated_by is therefore NOT null and the
    check was performed row by row.
    AS AN INSTRUMENT for the decomposition step: the incumbents are the
    degree-of-regularity and first-fall-degree meters and the program's existing
    BKK instrument (KN-FIND-017/018/019, KN-FIND-2a8b7e, KN-FIND-c7d31e). This
    proposal is dominated by them on maturity and on the range of m they reach,
    and adds only the specialisation axis they have never been run on.
  sota_delta: >-
    Zero speedup against any attack baseline; the ratio to rho is exactly 1
    because no algorithm is proposed. Instrument delta, quantitatively: adds
    3 specialisation levels x 2 arities = 6 new cells to the existing BKK/support
    instrument at a marginal cost of one symbolic resultant per cell and, in the
    predicted outcome, returns the integer 0 for the m=2 support gap and a
    factor-3 support restriction for the unspecialised m=3 a=0 case. The lane's
    stated obstruction (KN-TECH-018's sqrt(6) constant) is not exceeded and is
    not claimed to be.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the 13/9/10 counts verify (hand algebra on nine visible terms).
    0.85 that prediction (B) verifies, i.e. that the specialised m=2 support is
    IDENTICAL across generic / a=0 / b=0 - which means the most likely headline
    is a clean negative: "at m=2 the j=0 simplification is nothing at all". 0.7
    that the mod-3 grading of S_4|_{a=0} verifies. Under 0.1 that any genuine
    degree reduction (O1) appears, because the leading coefficients of S_3 in t
    contain neither a nor b and so cannot degenerate. The proposal is ranked
    high not because it is likely to find something but because it is the
    cheapest possible test of the premise every other L3 proposal borrows.

