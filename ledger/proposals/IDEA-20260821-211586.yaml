  assumptions:
    - >-
      That the template's applicability is governed by an inequality with a
      published modulus on one side and a secret degree on the other. If the
      primary sources show it is governed by something else (a divisibility, a
      smoothness condition on the auxiliary degree, or a condition on End(E_0)),
      the ledger gains a column and the margin framing survives only for those
      conditions that are quantitative. This is the single assumption on which
      the record stands or falls, and it is checkable by reading.
    - >-
      That the deficits are chosen by the adversary, so their prices combine as
      a MINIMUM over strategies. A ledger that multiplies them overstates
      security.
    - >-
      That the auxiliary-isogeny completion needed by the template is available
      at negligible cost when the inequality holds (a sum-of-squares
      decomposition is always available; the two-dimensional version's N - d may
      additionally need to be smooth). Whether smoothness of the completion is
      required is a ledger column, not an assumption.
    - >-
      That the Round-3 documents fix the published surface unambiguously. If a
      quantity is implementation-defined rather than specified, that is itself a
      finding and the cell is recorded as UNDETERMINED-BY-SPECIFICATION rather
      than guessed.

  proof_search_map:
    bottleneck: >-
      The step that decides everything: extracting, from the Round-3
      specification and the primary design papers, the pair (N, d) for each
      published image of a secret map, and the exponent c in the template's
      embedding condition. Every number in the ledger is downstream of that
      extraction, and no computation substitutes for it.
    baseline_embedding:
      parameter_slice: >-
        SIDH ITSELF is the exact parameter slice at which the ledger must
        reproduce a known outcome: there M1 >= 0 (the images are published at
        precisely the modulus the counterparty needs), M2 = 0 (the degree is a
        public parameter) and M3 = 2 (a full basis image is published), so the
        ledger must return LIVE with e = 0 and cost poly -- reproducing the
        published break.
      reproduction_check: >-
        SYMBOLIC AND DOCUMENTARY: instantiate the ledger's three columns on
        SIDH/SIKE parameters as reported in the primary sources and require the
        verdict LIVE, e = 0. A ledger that does not reproduce the SIDH break on
        SIDH parameters is measuring nothing, and this check must be run and
        recorded BEFORE any cell is filled for SQIsign. It is the same object as
        the null control in mechanism (3), applied to a real historical scheme
        rather than a constructed variant, and both are required because one is
        historical and one is parameter-swept.
    observation_collision:
      observable: >-
        A ledger cell's verdict (CLOSED with exponent e / LIVE / UNDETERMINED).
      distinct_preimage_search: >-
        THE COLLISION IS NAMED AND IT IS THE FAILURE MODE OF EVERY PRIOR BINARY
        AUDIT: "the template does not apply" is returned identically by a
        surface missing the inequality by 2 bits and by one missing it by 200,
        and identically by a surface where the secret is not of the exploitable
        form at all. Three distinct ground-truth situations, one observable.
        THE SEPARATING CONDITION IS THE ENTIRE PROPOSAL: report e, not a
        verdict. A second collision, recorded because it is easy to miss:
        "no image is published" and "an image is published but of a
        secret-dependent point" both read as absent in a byte inventory and are
        different for the template, which is why M3 records the deterministic-
        versus-secret-dependent status of each published point.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the MARGIN (a signed bit count) and the SEARCH EXPONENT e where
          previous audits carried a boolean; carry the derivative dM/dt where
          previous audits carried "structural or parametric" as a judgement.
        predicted_gain: >-
          No attack and no cost gain. The gain is that the audit's output
          becomes comparable with a baseline exponent and differentiable in the
          scheme's own parameters, which converts a verdict into an object a
          tweak proposal can be checked against.
      - transform: observable_fiber
        proposed_object: >-
          Hold the verdict fixed ("does not apply") and vary the forgotten
          structure (the size of the deficit). The intrinsic invariant
          distinguishing the resulting schemes is e, and exhibiting two schemes
          in the same fibre with wildly different e is the argument that the
          fibre is the wrong object.
        predicted_gain: >-
          A disqualification rule for binary audits, available at zero compute.
    quantifier_order: >-
      FOR EACH published item x of the Round-3 surface, THERE EXISTS an
      adversary strategy costing 2^{e(x)} template invocations that supplies
      the ingredients x leaves missing; and the surface is safe against this
      template IFF FOR ALL x, 2^{e(x)} exceeds the matched baseline. THE ORDER
      MATTERS IN ONE SPECIFIC WAY: the adversary picks x AFTER seeing the
      parameters, so the ledger's verdict is the MINIMUM of e over items, and a
      per-item audit that reports each item's safety separately without taking
      that minimum has quantified over x in the wrong place. Prior binary
      inventories are structurally vulnerable to exactly this, because a boolean
      per item has no minimum to take.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Against THIS template, with the embedding condition as stated in the
        filed primary sources, the Round-3 published surface leaves a deficit of
        e bits, minimised over published items." It certifies nothing about
        other templates, nothing about future higher-dimensional embeddings that
        might weaken the inequality, and nothing about the scheme's security
        generally. In particular a large e is NOT a security proof: the
        template's exponent c has already moved once in the literature (from
        the two-dimensional to the higher-dimensional embedding), and a future
        move in c changes every M1 in the ledger by a multiplicative factor.
        THE LEDGER MUST THEREFORE RECORD ITS c AND BE RE-RUNNABLE WHEN c MOVES;
        that re-runnability is a design requirement, not a caveat.
      nearby_object_control: >-
        SIDH, where the conclusion "the template does not apply" is KNOWN FALSE,
        and SQIsign-WEAK, constructed in mechanism (3) to make it known false by
        one parameter change. An audit that cannot distinguish either from the
        real scheme has not identified the load-bearing structure. Both are
        mandatory and both are cheap.
    proof_obligations:
      - claim: "The template's applicability is governed by a quantitative inequality whose two sides are extractable from the specification."
        responsibility: interface
      - claim: "Each deficit has a search exponent e closing it, and the combined price is the minimum over items."
        responsibility: feasibility
      - claim: "The ledger returns LIVE with e = 0 on SIDH parameters and on SQIsign-WEAK."
        responsibility: baseline
      - claim: "dM1/dt and dM2/dt are well defined for each tweakable parameter t and are computed, not judged."
        responsibility: strictness
      - claim: "No cell is filled from any source not filed as KN-LIT; undetermined cells are recorded as undetermined."
        responsibility: scope

  object_first_candidate:
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) byte-level transcript inventories
      (IDEA-20260805-244f78) -- this record consumes an inventory, it does not
      produce one; (b) transcript-distinguishability and simulator questions,
      which belong to GOAL-SQISIGN-001 and are excluded by this question's
      three-way scope separation; (c) endomorphism-ring hardness, which belongs
      to GOAL-SSI-001 and enters here ONLY as the comparison baseline;
      (d) side-channel observables (retry counts, signature lengths), which are
      a different surface entirely.
    tracked_object: >-
      THE SIGNED MARGIN OF AN INEQUALITY, IN BITS, together with the search
      exponent that closes it -- followed across published items and
      differentiated in the scheme's tweakable parameters. Not the transcript,
      not the curve, not the isogeny: a number that can be negative, and its
      derivative.
    one_step_propagation_rule: >-
      Publishing one more point image at modulus N moves M3 by one and leaves M1
      unchanged; raising the published torsion exponent by one bit moves M1 by
      c bits; fixing the secret degree as a public parameter sets M2 to zero.
      Each rule is exact arithmetic on the specification, which is what makes
      the object propagate deterministically under design changes -- and design
      changes are exactly the operations this question cares about.
    newness_score: >-
      The template is not new, the inventory is not new, and the condition pair
      is not new (IDEA-20260815-af4007 states it). WHAT IS NEW IS TREATING THE
      CONDITION AS QUANTITATIVE: a margin, a price, a minimum over items, and a
      derivative. The inventor protocol's closure standard demands exactly that
      -- "an obstruction is a quantity someone measured over a stated scope" --
      and the four nearest filed records all return booleans.
    testability_score: >-
      High and unusually cheap for this lane: every number is read or computed
      from documents, and the two controls (SIDH, SQIsign-WEAK) are parameter
      substitutions into the same ledger. The binding cost is the reading task,
      which this question already names as its gate.
    survival_score: >-
      The framing survives any value of the margins. It dies only if the
      template's condition turns out not to be quantitative -- which is
      assumption 1 and is settled by reading.

  lossy_projection_test:
    projection: >-
      "the entire Round-3 published surface" -> "the triple (M1, M2, M3) per
      published item, plus a search exponent e".
    what_is_discarded: >-
      Every byte of the transcript, the scheme's zero-knowledge structure, its
      compression, its distributions, and all of its arithmetic. Four numbers
      per item remain.
    why_genuinely_lossy: >-
      Overwhelmingly: the surface cannot be reconstructed from four numbers, and
      two schemes with identical margins can differ in everything else. The
      projection is many-to-one by design.
    why_compatible_with_the_operations: >-
      The operations that matter here are DESIGN CHANGES -- publish one more
      point, raise a torsion exponent, fix or randomise a degree -- and each acts
      on the retained numbers by an exact rule (one_step_propagation_rule above)
      without reference to anything discarded. That is what makes the margin a
      legitimate tracked object for a tweak-window question rather than merely a
      summary statistic.
    is_it_only_a_change_of_coordinates: >-
      NO on both failure modes. Not invertible (above). And NOT CONSTANT ACROSS
      CANDIDATES, which is the check that matters here and the one the binary
      audits fail: the projection separates SIDH (M1 >= 0, M2 = 0, M3 = 2, e = 0)
      from SQIsign-WEAK (constructed to match) from the real scheme (unknown
      until read), whereas a boolean audit returns the same value for the last
      two whenever the deficit is positive, however small. THE HONEST
      LIMITATION: the projection is defined relative to ONE template with ONE
      exponent c. It is not a security measure; it is a distance to one known
      attack, and a scheme at large distance from this attack may be at zero
      distance from another.

  null_object_control:
    primary_null: >-
      SQIsign-WEAK: the identical scheme and the identical ledger, with the
      published torsion modulus raised until M1 >= 0 at M2 = 0 and M3 = 2. THE
      LEDGER MUST RETURN LIVE, e = 0, cost poly. This is this question's own
      binding methodological requirement ("an audit that concludes the attack
      does not apply without ever having been shown to fire when the ingredient
      is present has demonstrated nothing about SQIsign -- only about the
      audit"), implemented as a one-number parameter substitution.
    secondary_nulls:
      - >-
        HISTORICAL CONTROL: SIDH/SIKE at its published parameters, where the
        ledger must return LIVE with e = 0, reproducing the published break.
        Distinct from SQIsign-WEAK because it is not a construction of ours and
        cannot be tuned to pass.
      - >-
        NEGATIVE HISTORICAL CONTROL: a scheme that publishes NO image of any
        secret map (the corpus's own description of the pre-redesign claim),
        where M3 = 0 and the ledger must return CLOSED with e undefined-by-
        absence rather than a large finite e. The distinction between "deficit"
        and "ingredient structurally absent" must be visible in the output, or
        the ledger is conflating the two situations its own observation-
        collision analysis identifies.
      - >-
        GRADED CONTROL, at least three interior points: sweep the published
        torsion exponent across a range spanning the M1 = 0 crossing and check
        that e falls monotonically to zero. A ledger whose e does not move
        monotonically with the parameter it is a function of is mis-implemented.
      - >-
        UNDETERMINED-CELL AUDIT: count the cells that cannot be filled from
        filed sources. A ledger with no undetermined cells, given that no
        Round-3 specification has yet been read by this program, would be
        evidence of guessing rather than of completeness.

  predictions:
    - metric: "ledger verdict and search exponent e on SIDH/SIKE published parameters"
      direction: different
      minimum_effect: >-
        FORCED VALUES: verdict LIVE, e = 0. A miss voids the instrument and no
        SQIsign cell may be filled.
    - metric: "ledger verdict and e on SQIsign-WEAK"
      direction: different
      minimum_effect: >-
        FORCED VALUES: verdict LIVE, e = 0. This is the question's mandatory
        null control and is a precondition, not a robustness check.
    - metric: "M1, in bits, for each published image of a secret map in the Round-3 surface"
      direction: different
      minimum_effect: >-
        NO VALUE IS PREDICTED -- the specification has not been read and
        predicting it would be fabrication. What IS pre-registered is the
        DECISION RULE: M1 >= 0 escalates immediately to independent review;
        -80 < M1 < 0 is a live avenue requiring the priced search to be compared
        against the baseline; M1 <= -128 is a closed cell with a number.
    - metric: "minimum over published items of the search exponent e, versus the matched baseline exponent"
      direction: different
      minimum_effect: >-
        The decision quantity. Pre-registered rule: an avenue is reported LIVE
        iff 2^{e} * poly is below the baseline, with the baseline TIER named
        (conditional p^{1/3+o(1)} or unconditional p^{1/2}(log p)^{O(1)}) and
        with the note that the conditional tier's superpolynomial o(1) forbids a
        concrete-parameter conclusion.
    - metric: "dM1/dt and dM2/dt for each tweakable parameter t, in bits per unit"
      direction: different
      minimum_effect: >-
        A non-zero derivative for any t means the obstruction is PARAMETRIC and
        the tweak window carries risk at the stated rate; all-zero derivatives
        across the full parameter list mean STRUCTURAL, and that is the only
        form in which this record permits the word structural to be used.
    - metric: "count of cells recorded UNDETERMINED-BY-SPECIFICATION"
      direction: different
      minimum_effect: >-
        Reported, not minimised. A zero count before the Round-3 package is
        filed as KN-LIT would itself be a red flag.

  minimal_test:
    design: >-
      STAGE 0 -- THE GATE, AND IT IS THIS QUESTION'S OWN CONSTRAINT, NOT AN
      OPTION: file the Round-3 SQIsign submission and the primary
      higher-dimensional-design papers as KN-LIT entries at stated provenance
      levels. NO LATER STAGE MAY RUN BEFORE THIS, AND NO CELL MAY BE FILLED
      FROM MEMORY OR FROM A SEARCH SNIPPET.
      STAGE 1 (zero compute, documentary): extract c and the exact form of the
      embedding condition from the filed primary sources, recording the theorem
      and page. Build the empty ledger with its columns fixed.
      STAGE 2 (zero compute): run the ledger on SIDH/SIKE parameters. Require
      LIVE, e = 0. If it misses, stop and record only that.
      STAGE 3 (zero compute): run the ledger on SQIsign-WEAK. Require LIVE,
      e = 0.
      STAGE 4 (zero compute): fill the Round-3 cells, marking every unfillable
      one UNDETERMINED-BY-SPECIFICATION. Compute the minimum e over items and
      apply the decision rule against both baseline tiers.
      STAGE 5 (zero compute): compute dM1/dt and dM2/dt across the declared
      parameter list, and run the graded control across the M1 = 0 crossing.
      STAGE 6 (only if some cell is LIVE, and only under a new contract): a
      toy-scale end-to-end instantiation of the template at small primes, at the
      TOY TIER this question's claim_tier_ceiling imposes without exception.
    controls:
