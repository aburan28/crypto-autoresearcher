  falsification_conditions:
    - >-
      The ledger fails to return LIVE with e = 0 on SIDH parameters. The
      instrument does not reproduce a published break and nothing else is
      recorded.
    - >-
      The ledger fails to fire on SQIsign-WEAK. Per this question's constraints
      no negative conclusion about the real scheme may be recorded at all.
    - >-
      The primary sources show the template's applicability is NOT governed by a
      quantitative inequality. Assumption 1 fails, the margin framing dies for
      the non-quantitative conditions, and the honest deliverable is the list of
      conditions that are quantitative and those that are not.
    - >-
      Some published item has M1 >= 0 with M2 = 0 and M3 = 2. THIS WOULD BE A
      CLAIMED BREAK OF A ROUND-3 NIST CANDIDATE AND IS THE ONE OUTCOME THAT MAY
      NOT BE REPORTED BY THIS RECORD'S OWN MACHINERY: it must be escalated
      immediately to an independent review-breakthrough session per AGENTS.md
      rule 12, treated as an extraction error until independently confirmed,
      and never published from a single session's reading.
    - >-
      Every derivative dM/dt is zero across a parameter list that a reviewer
      shows to be incomplete. The structural verdict is then unsupported and the
      cell reverts to unverified.

  confounders:
    - >-
      c IS A MOVING TARGET. The template's embedding exponent already moved once
      in the literature (two-dimensional to higher-dimensional), and a future
      move rescales every M1. The ledger must record its c prominently and be
      re-runnable; a margin quoted without its c is meaningless.
    - >-
      MULTIPLYING DEFICITS. An adversary picks the cheapest deficit, so prices
      combine as a minimum. A ledger that multiplies them overstates security --
      the single most likely way this instrument produces a wrong verdict.
    - >-
      SPECIFICATION VERSUS IMPLEMENTATION. A quantity fixed by a reference
      implementation but not by the specification is not a scheme property; such
      cells are UNDETERMINED-BY-SPECIFICATION and are themselves findings.
    - >-
      COMPRESSION. A published value may encode a torsion image indirectly (a
      scalar with respect to a canonical basis rather than a point). The ledger
      must classify by INFORMATION CONTENT, not by field name, or a compressed
      image will be recorded as absent.
    - >-
      SECRET-DEPENDENT VERSUS DETERMINISTIC BASIS POINTS. Both appear in a byte
      inventory as "a point"; only one gives the template what it needs. M3
      records the distinction explicitly for this reason.
    - >-
      BASELINE DRIFT. Comparing e against the older p^{1/2} tier when the
      conditional p^{1/3+o(1)} tier applies mis-ranks cells. The tier must be
      named in every comparison (KN-TECH-058's own instruction).

  interpretation_limits:
    - >-
      EVERY TECHNICAL STATEMENT ABOUT SQIsign HERE IS UNVERIFIED. No Round-3
      specification has been read by this program or this session, and the
      ledger is entirely empty until Stage 0 completes. This record proposes an
      instrument, not a result.
    - >-
      THE LEDGER MEASURES DISTANCE TO ONE TEMPLATE, NOT SECURITY. A large
      minimum e means this template does not consume this surface at these
      parameters; it says nothing about other attacks, other templates, or
      future embeddings with a smaller c.
    - >-
      TOY TIER WITHOUT EXCEPTION for any attack behaviour, per this question's
      claim_tier_ceiling. The documentary ledger is a documentary result and is
      reported as such; a negative closes only the exact template, published
      surface and parameters examined (AGENTS.md rule 6) and is NEVER reported
      as "SQIsign is safe from SIDH-style attacks".
    - >-
      SCOPE SEPARATION IS BINDING. This record does not touch endomorphism-ring
      hardness (GOAL-SSI-001) or transcript distinguishability
      (GOAL-SQISIGN-001); the endomorphism-ring baseline enters only as the
      yardstick in the decision rule.
    - >-
      ACADEMIC / DEFENSIVE ONLY. Nothing here is applied to a live deployment,
      and the one outcome that would constitute a break carries a mandatory
      escalation rather than a report.

  heuristic_assumptions:
    - id: H5
      statement: >-
        SEARCH-PRICE ADDITIVITY IN THE EXPONENT. If a published surface leaves a
        deficit that an adversary closes by guessing a quantity of entropy e
        bits, and each guess is testable by ONE independent template invocation
        whose failure is detectable, then the expected cost is 2^{e-1} template
        invocations and the strategy space's cost is the minimum of 2^{e(x)}
        over items x.
      rigorous_support: >-
        The rigorous part is elementary: independent uniform guessing with a
        detectable failure has geometric hitting time. THE PART THAT IS NOT
        RIGOROUS, AND IT IS NAMED RATHER THAN ASSUMED AWAY: that a wrong guess
        is DETECTABLE at unit cost. In the SIDH setting the template's output is
        checkable against the public key, which is why the guessing argument
        works there; whether the same check exists for a partially-specified
        higher-dimensional response is a property of the Round-3 verification
        equation and must be extracted, not assumed. This heuristic imitates the
        standard cryptanalytic convention that an attack with a verifiable
        candidate costs (search space) x (test cost), which is exactly the
        convention that fails when candidates are not testable.
      validation_plan: >-
        NOT A DISTRIBUTIONAL HEURISTIC, SO NOT A DISTRIBUTIONAL VALIDATION --
        recorded here rather than omitted, because this record's other content
        is documentary and a reader is entitled to know which of its claims is
        assumption-bearing. Validation route: at TOY primes (this question's
        claim_tier_ceiling permits nothing else), instantiate the template with
        a deliberately withheld quantity of e bits for e in {4, 8, 12}, and
        measure the number of invocations to success against the predicted
        2^{e-1}, together with the false-acceptance rate of the verification
        check. Predicted ratio 1.0; a false-acceptance rate materially above
        zero falsifies unit-cost testability and the pricing must then charge
        the disambiguation.
      falsification_condition: >-
        Measured invocations to success departing from 2^{e-1} by more than a
        factor 4 at two or more values of e, or a false-acceptance rate above
        2^{-e} in the verification check.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE TO THE LEDGER ITSELF, which is a documentary instrument and
      claims no algorithm. The quantity the ledger PRODUCES is a search exponent
      e in template invocations, and its decision rule compares 2^{e} * poly
      against the matched baseline. No exponent is claimed to move, and no
      attack is proposed.
    memory_exponent: >-
      Negligible for the ledger. For any avenue the ledger reports LIVE, the
      memory of the template invocation must be charged in the escalation
      record, and the escalation must state it beside the time -- the same
      obligation KN-TECH-058 imposes on every cost statement in this program.
    best_known: >-
      The comparison yardstick, both tiers named: bare-curve key recovery at
      p^{1/3+o(1)} TIME AND MEMORY conditional on Heuristic 1 of the frozen
      source, and p^{1/2}(log p)^{O(1)} time at polynomial memory
      unconditionally (KN-TECH-058). No published-surface avenue is interesting
      unless it undercuts the applicable tier, and the tier must be named.
    hidden_overhead: >-
      The conditional baseline's o(1) is SUPERPOLYNOMIAL by its author's own
      disclosure, so the decision rule is applied AT THE EXPONENT LEVEL and no
      concrete-parameter conclusion is computed above it. The ledger's own
      numbers (bits of margin) are exact integers read from a specification and
      carry no asymptotics -- which is precisely why they are worth having.
    tradeoff_note: >-
      Not applicable: the ledger has no time-memory tradeoff. The one tradeoff
      it must not obscure is the adversary's, between paying for a modulus
      deficit and paying for degree entropy; that is why the combined price is
      a minimum over strategies and why the ledger reports per-item exponents
      rather than a single number.

  dominated_by: >-
    n/a (no attack or complexity result is claimed). The Pareto check was
    nonetheless run against every row of the frontier for the baseline this
    record uses as its yardstick, because the yardstick's correctness is the
    part that could be wrong: Kohel p(log p)^{O(1)}; Delfs-Galbraith
    p^{1/2}(log p)^{O(1)} at polynomial memory; MITM p^{1/2} time and memory
    (full cost Otilde(p^{2/3}), KN-TECH-057); van Oorschot-Wiener
    p^{1/2+o(1)}/w^{1/2} at memory w (full cost Otilde(p^{1/2})); Wesolowski
    2026 p^{1/3+o(1)} time and memory conditional on Heuristic 1. The
    F_p-restricted Otilde(p^{1/4}) row of KN-TECH-058 is excluded (different
    problem; relayed_from_abstract and contested, RC4). Data/queries axis: this
    is the only record in this session with a non-trivial value on it, since the
    whole question is about PUBLISHED data -- and the published-data axis is
    where a Kani-style avenue would beat every row above, which is why the
    question exists.
  sota_delta: >-
    NO ATTACK; INSTRUMENT AND MEASUREMENT CONTRIBUTION ONLY. Quantitatively, the
    deliverable is per published item a signed margin in bits, a search exponent
    e, a verdict against a named baseline tier, and a derivative in bits per
    unit of each tweakable parameter -- where the four nearest filed records
    return one boolean per item. The difference is that a boolean cannot rank a
    two-bit deficit against a two-hundred-bit one, cannot be compared with a
    baseline exponent, and cannot be differentiated with respect to a tweak.

  discriminated_from:
    - >-
      IDEA-20260815-af4007 (NEAREST; digest summary read, record not opened):
      Kani recovery needs known degree PLUS torsion of modulus exceeding the
      degree, and no record enumerates the condition pair across the family.
      DISTINCT: that record enumerates which of the two conditions each design
      withholds -- a two-valued classification per design. This record measures
      HOW FAR each condition is from holding, prices the search that closes the
      gap, and differentiates it in the scheme's parameters. Its enumeration is
      this record's input; a reviewer must open it before crediting the
      distinction.
    - >-
      IDEA-20260815-824c71: classify every individual published quantity against
      the template rather than issuing a whole-design verdict. DISTINCT AND
      COMPLEMENTARY: that record fixes the granularity (per quantity, not per
      design); this one fixes the VALUE TYPE (a margin and a price, not a
      class). Run together, they give a per-quantity margin table, which is the
      artifact this question's decision target actually needs.
    - >-
      IDEA-20260805-244f78: the byte-budget completeness certificate for what a
      verifier receives. DISTINCT: an inventory of what is present; this record
      consumes such an inventory and asks how far what is present is from
      sufficing. Note the specific dependency recorded in the confounders: a
      byte inventory cannot distinguish a deterministic from a secret-dependent
      basis point, and M3 must.
    - >-
      IDEA-20260805-c4ae3d: reading KeyGen's step that evaluates the secret
      isogeny on a deterministic public basis. DISTINCT: that is one extracted
      fact (an input to M3 and possibly to M1); this record is the frame that
      says what to do with it, namely compute the margin rather than conclude
      from the fact alone.
    - >-
      IDEA-20260808-3da739: the obstruction is not "SQIsign publishes no torsion
      images" but that the response is built from higher-dimensional isogenies a
      verifier must evaluate. DISTINCT AND DIRECTLY BUILT ON: that record
      relocates the obstruction; this one insists that wherever it is relocated
      to, it must be recorded as a quantity with a scope, which is the inventor
      protocol's closure standard applied to that relocation.
    - >-
      IDEA-20260815-56f047: whether SQIsign's parameter sets still meet their
      claimed security levels under the new p^{1/3+o(1)} baseline. DISTINCT:
      that asks whether the BASELINE broke the parameters; this asks whether the
      PUBLISHED SURFACE offers something below the baseline. They meet only in
      the decision rule, where this record's e is compared against that record's
      baseline -- and the coupling is recorded in mechanism (4).

