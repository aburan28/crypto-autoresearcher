idea:
  id: IDEA-20260821-211586
  research_question: RQ-SQISIGN-39f231
  question_id: RQ-SQISIGN-39f231
  added: '2026-08-21'
  title: >-
    The Kani template's requirement is an INEQUALITY, so the obstruction is a
    MARGIN IN BITS and not a verdict: replace "does the template apply?" with
    three measured margins (modulus, degree entropy, basis completeness), price
    the search that would close each one, compare that price against the
    matched endomorphism-ring baseline, and report the derivative of the margin
    with respect to each tweakable parameter -- which is the only form in which
    "would a variant publishing slightly more survive?" has an answer
  class: measurement

  claim: >-
    SCOPE FIRST, AS THIS QUESTION'S CONSTRAINTS REQUIRE. Every technical
    statement about SQIsign below is UNVERIFIED; no Round-3 specification has
    been read by this program or by this session, and the template's exact
    inequality is carried at provenance: recalled. NOTHING HERE IS AN ATTACK ON
    SQIsign, no experiment may be designed until the Round-3 submission and the
    primary higher-dimensional-design papers are filed as KN-LIT entries, and
    the deliverable proposed here is a documentary ledger plus a null control.

    THE CLAIM. The SIDH/Kani attack template does not consume a data surface or
    fail to consume it; it consumes a surface WHENEVER AN INEQUALITY HOLDS
    between a published torsion modulus and a secret degree. Consequently the
    "named obstruction" this question asks for is not a sentence but three
    numbers, each in bits, each extractable from the specification alone:

      M1  MODULUS MARGIN      = c * log2(N)  -  log2(d)
          where N is the largest modulus at which an image of the secret map
          under attack is published, d is that map's degree, and c is the
          exponent in the template's embedding condition (c = 1 for the
          two-dimensional Kani embedding with an auxiliary isogeny of degree
          N - d; c = 2 for the higher-dimensional embedding using a sum-of-
          squares completion). THE VALUE OF c IS A PARAMETER OF THE LEDGER,
          NOT AN ASSUMPTION OF THIS RECORD: the audit's first job is to extract
          it from the primary source and record which source and which theorem
          it came from.
      M2  DEGREE ENTROPY      = H(d | all published data), in bits. Zero if the
          secret isogeny's degree is a fixed public parameter; otherwise the
          exact entropy of the degree given the specification's key-generation
          distribution.
      M3  BASIS COMPLETENESS  = the number of independent points of order N
          whose images are published (0, 1, or 2), together with, for each
          published image, whether it is the image of a DETERMINISTIC public
          basis point or of a secret-dependent one.

    THE DECISION RULE, WHICH IS WHAT MAKES THE LEDGER MORE THAN AN INVENTORY.
    A deficit is not an obstruction until it is priced. For each item on the
    published surface, the ledger records the SEARCH EXPONENT e that closes its
    deficit -- the exponent such that an adversary supplying the missing
    ingredient by search pays 2^{e} template invocations -- and then applies one
    comparison:

        THE AVENUE IS LIVE IFF   2^{e} * poly(log p)  <  the matched baseline,

    where the matched baseline is bare-curve key recovery at p^{1/3+o(1)}
    conditional on Heuristic 1 of the frozen source, and p^{1/2}(log p)^{O(1)}
    unconditional at polynomial memory (KN-TECH-058, both tiers named). A
    deficit of e bits with e above the baseline exponent is a CLOSED cell with a
    number; a deficit with e below it is a live avenue and must be escalated
    immediately. A deficit recorded without e is an unpriced verdict and does
    not satisfy this question's closure standard.

    THE FOURTH COLUMN, WHICH ANSWERS THE QUESTION'S "STRUCTURAL OR PARAMETRIC"
    TARGET IN THE ONLY FORM IT HAS AN ANSWER. For each tweakable parameter t of
    the scheme (torsion modulus exponents, secret-degree size, compression
    choices, the number of published points), record the DERIVATIVE dM1/dt and
    dM2/dt in bits per unit of t. A margin that no parameter moves is
    STRUCTURAL; a margin that a named parameter moves at a stated rate is
    PARAMETRIC, and the rate says how much slack the tweak window has. "Would a
    variant that published slightly more survive?" is exactly the question of
    whether some dM/dt is non-zero, and it cannot be answered by a binary audit.

    WHY THIS IS NOT A RESTATEMENT OF THE FILED INVENTORY WORK. The corpus
    already has a byte-budget completeness certificate for what a verifier
    receives (IDEA-20260805-244f78), a reading of KeyGen's evaluation of the
    secret isogeny on a deterministic public basis (IDEA-20260805-c4ae3d), a
    per-quantity classification against the template (IDEA-20260815-824c71), and
    a family-wide enumeration of the condition PAIR "known degree plus torsion
    of sufficient modulus" (IDEA-20260815-af4007). ALL FOUR PRODUCE BINARY
    VERDICTS PER ITEM. None produces a margin, none prices a search, and none
    computes a derivative -- so none of them can distinguish a surface that
    misses the template by four bits from one that misses it by two hundred,
    and that distinction is the whole security question.

  mechanism: >-
    (1) WHY THE INEQUALITY IS THE RIGHT OBJECT. The template's recalled shape:
    given phi : E_0 -> E of degree d and the images of a basis of E_0[N], one
    embeds phi into an isogeny of principally polarised abelian varieties using
    an auxiliary isogeny whose degree completes d to a norm form -- N - d in
    dimension 2, or a sum of squares completing d to N^2 in the
    higher-dimensional version -- and recovers phi from the embedded object in
    polynomial time. Every ingredient except the inequality is either present or
    structurally absent; the inequality is the only ingredient that is present
    to a DEGREE. Recording it as present/absent throws away the quantity, and
    the quantity is what a tweak moves.

    (2) THE THREE MARGINS ARE INDEPENDENT AND MUST NOT BE SUMMED CARELESSLY.
    M1 < 0 with M2 = 0 and M3 = 2 is a modulus deficit: the adversary knows the
    degree and has a full basis image but at too small a modulus. M1 >= 0 with
    M2 > 0 is a degree-uncertainty deficit: the surface would be consumable if
    the degree were known, and the price is a search over candidate degrees, one
    template invocation each. M3 < 2 is a basis deficit and its price depends on
    the template's tolerance for partial data, which the audit must extract
    rather than assume. THE COMBINED PRICE IS A MINIMUM OVER STRATEGIES, NOT A
    PRODUCT, because an adversary chooses which deficit to pay for -- and a
    ledger that multiplies deficits will systematically overstate security,
    which is the error this design exists to prevent.

    (3) THE NULL CONTROL IS A PRECONDITION AND IS CONSTRUCTED, NOT ASSUMED.
    Per this question's methods block, no conclusion that the template fails may
    be recorded before the identical ledger has been shown to FIRE against a
    variant supplying the missing ingredient. The construction is explicit:
    define SQIsign-WEAK as the same scheme with the published torsion modulus
    raised until M1 >= 0 at M2 = 0 and M3 = 2. The ledger must return "LIVE,
    e = 0, cost poly" on SQIsign-WEAK. If it does not, the ledger is broken and
    every negative it reports about the real scheme is void. This is the audit
    equivalent of a positive control, and it is cheap: it is the same ledger run
    with one number changed.

    (4) WHY THE PRICING CONNECTS TO THIS PROGRAM'S OTHER LANE, AND WHY THAT
    MATTERS. The comparison baseline is the endomorphism-ring cost, which moved
    from p^{1/2}(log p)^{O(1)} to p^{1/3+o(1)} conditional on Heuristic 1
    (KN-TECH-058). A published-surface avenue costing 2^{e} template invocations
    is only interesting while 2^{e} sits below that baseline, so THE BASELINE
    MOVING DOWN SHRINKS THE SET OF INTERESTING AVENUES. That is a live
    coupling: a deficit of e bits that was "not worth pursuing" against a
    p^{1/2} baseline is even less worth pursuing against p^{1/3}, and any ledger
    that fixes its baseline at the older tier will mis-rank its own cells. The
    coupling is recorded here so the two campaigns' scope separation (binding
    under this question's constraints) does not become an accounting separation.

