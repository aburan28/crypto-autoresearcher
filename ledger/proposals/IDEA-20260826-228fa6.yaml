  novelty_screen:
    method: >-
      Filesystem screening; the crypto-kb MCP retrieval server is bound to
      ':memory:' in this session and returns nothing, disclosed rather than
      worked around. Read: the three RQ records (ICINV, EWALK, VOLC);
      GOAL-ENDO-001/goal.yaml head; IDEA-20260821-cae674, IDEA-20260821-ad7c97
      and IDEA-20260817-4c6519 in full; the titles and tracked_object fields of
      the most recent ICINV-bound proposals (IDEA-20260816-0027ac,
      IDEA-20260815-6d4580, IDEA-20260811-c72830); greps over ledger/proposals
      for volcano / isogeny-class / within-class-variance terms (238 hits
      triaged by lane binding). No web source opened for this record.
    results: >-
      NEAREST FILED WORK, NAMED. (1) IDEA-20260815-6d4580 censuses which cheap
      VERTEX invariants vary across a class; it treats the class as an unordered
      set of curves and reports marginal variances. This record instead equips
      the class with its Cl(O)-torsor GROUP structure and reads the functional in
      the Fourier basis of that group -- an object the census does not construct.
      (2) IDEA-20260811-c72830 tracks a vertex cost functional Delta(E) that
      varies by conductor; it is a magnitude per curve, not a spectrum over the
      class, and it says nothing about navigability. (3) IDEA-20260807-0afbab
      (recalled via IDEA-20260817-4c6519) measures rho step-count variance across
      a class and its correlation with j and conductor -- again a scalar variance
      and a marginal correlation, not a torsor spectrum. (4) IDEA-20260821-ad7c97
      attributes the committed over-dispersion to a sampler-reachable-subgroup
      mixture; this record is orthogonal to it -- if ad7c97's mixture is the whole
      story the spectrum will be white after cell conditioning, which this design
      predicts and tests, so the two records are complementary and mutually
      falsifying.
    verdict: >-
      UNVERIFIED, and mechanism-distinct from all four. The new object is the
      Fourier power spectrum of a cost functional over the Cl(O)-torsor and its
      low-frequency-vs-white shape; no filed record constructs the torsor
      identification, computes characters of Cl(O), or ties spectral shape to the
      T5 reachability gate. The torsor structure and abelian Fourier analysis are
      classical; the honest label is `unverified` because no external source was
      opened.

  object_first_candidate:
    tracked_object: >-
      THE FOURIER POWER SPECTRUM {|chat(chi)|^2 : chi in Cl(O)^} of a mean-centred
      per-curve cost functional c, after identifying the horizontal class X_O with
      Cl(O) via a fixed base curve. Established families declared OFF-LIMITS as the
      primary lens for this session: per-curve (vertex) invariant censuses,
      scalar within-class variance ratios, Semaev/Groebner solving-degree proxies,
      and the sampler-subgroup mixture. The object here is neither a curve
      invariant nor a variance; it is a function on the DUAL group Cl(O)^.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The projection (per-curve functional
      c : X_O -> R) |-> (power spectrum |chat(.)|^2) discards ALL PHASE
      information: it forgets which curve carries which value and retains only how
      much power sits at each frequency. It is emphatically not a change of
      coordinates -- the fibre over a given power spectrum contains every
      functional obtained from c by a translation of the torsor (relabelling the
      base curve) and by any sign/phase reassignment of the characters, an
      exponentially large set of distinct functionals with identical spectra.
      What is discarded (phase) is discarded compatibly with the group operation,
      because the power spectrum is exactly the translation-invariant part of c:
      it propagates deterministically under the Cl(O)-action (the action permutes
      curves but leaves |chat(chi)|^2 fixed), which is the required compatibility.
    propagation: >-
      One-step propagation is defined and measurable. A single ell_i-isogeny step
      is multiplication by the generator l_i in Cl(O); on the Fourier side it acts
      diagonally, multiplying chat(chi) by chi(l_i), a root of unity. So the
      one-step change of the functional along an isogeny edge is, per frequency,
      a deterministic phase rotation of known angle, and the measurable per-step
      quantity is the correlation c(l_i * E) vs c(E) averaged over the class,
      which equals sum_chi |chat(chi)|^2 Re chi(l_i) -- directly estimable and the
      exact smoothness statistic the descent depends on.
    survival_score: >-
      Survives as long as the horizontal class is a single Cl(O)-orbit of
      manageable size (toy: h(O) from a few to a few hundred), which is exactly
      the RQ-ICINV toy regime. It dissolves when the class is not a single orbit
      (mixed endomorphism rings across volcano levels -- then the spectrum must be
      taken per level, which is the clean interface to RQ-VOLC), when Cl(O) is
      cyclic of prime order with a single generator (spectrum degenerates to a
      1-parameter DFT, still valid but with no multi-generator smoothness notion),
      and at cryptographic scale where h(O) ~ sqrt(p) makes the full spectrum
      infeasible and only low-frequency probes survive -- disclosed, not hidden.

  proof_search_map:
    bottleneck: >-
      The step at which the campaign converts a scalar within-class variance into
      a statement about the RQ-ICINV decision target. That target has TWO clauses
      (variance above null AND minimiser reachable) and the committed instrument
      measures only the first. Removing this bottleneck -- supplying a single
      statistic that adjudicates both -- changes what the campaign's most-cited
      open number can decide.
    baseline_embedding:
      parameter_slice: >-
        The committed decomp_rate_m2/m3 per-curve values on the p=4001 t=30
        138-curve census (EV-ICINV-343679 / EV-ENDO-10109d), restricted to a
        single volcano level so that End_{F_p}(E) is one order O and the torsor
        structure is exact. The crater level (f_E = 1, 3 curves) is too small; the
        f_E = 16 floor (72 curves, cyclic) is the primary slice.
      reproduction_check: >-
        Before any spectral claim, recompute the scalar within-class variance of
        the chosen functional on the chosen level directly from the committed
        per-curve values and require it to equal Parseval's sum over nontrivial
        characters of |chat(chi)|^2 to floating-point tolerance. A mismatch means
        the torsor identification or the character table is wrong and halts the
        experiment as an instrument finding, never a mathematical result.
    observation_collision:
      observable: >-
        The power spectrum {|chat(chi)|^2}.
      distinct_preimage_search: >-
        A COLLISION IS NAMED IN ADVANCE. Two distinct functionals -- a genuine
        low-frequency signal and its random phase-scramble -- can share the SAME
        total power (same variance) while having OPPOSITE spectral shapes. The
        variance cannot separate them; the spectral flatness statistic
        (geometric-mean over arithmetic-mean of the power spectrum) can. This is
        precisely why the variance is not identifying for the decision target and
        the spectrum is proposed.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the functional from the set X_O to the group Cl(O) via the torsor
          identification, where "smooth / navigable" becomes the exact condition
          "low-frequency" (a vanishing/decay condition on Fourier coefficients).
        predicted_gain: >-
          Converts the vague reachability clause of T5 into a measurable spectral
          decay rate; separately, it makes the null (a random function on Cl(O))
          have a closed-form flat expected spectrum, so the "above null" clause is
          also read off the same object.
      - transform: observable_fiber
        proposed_object: >-
          Hold the power spectrum fixed and vary the phase (relabel the base curve
          / apply a random Cl(O)-translation); confirm the descent-reachability of
          the minimiser is invariant, isolating that it is a property of the
          spectrum and not of the labelling.
        predicted_gain: >-
          Attributes navigability to the spectral shape rather than to a lucky
          base-point choice, which is what distinguishes a mechanism from an
          artifact of enumeration order.
    quantifier_order: >-
      THE CLAIM WRITTEN OUT. Decision-target positive branch: THERE EXISTS a
      constant K and a decay rate r > 0 such that FORALL characters chi of Cl(O),
      |chat(chi)| <= K * exp(-r * wordlength(chi)) in the l_i-generators, AND the
      total nontrivial power exceeds the matched-null power. The witnesses K, r
      may depend on the class O and the functional but NOT on the base curve
      (phase). Null branch: FORALL decay rates r > 0, the best-fit K makes the
      residual power indistinguishable from a flat spectrum at the tested
      significance. No uniform-over-all-classes claim is made; every statement is
      scoped to the one tested class.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On this one class, at this one factor base, the within-class variation of
        this one functional is (or is not) low-frequency in the Cl(O)-Fourier
        basis, and its minimiser is (or is not) reached by l_i-greedy descent in
        O(diam) steps, at claim_tier toy." It can NEVER certify anything about
        ECDLP hardness on the prime-order subgroup (where every endomorphism is a
        scalar and this whole structure is invisible -- H-ENDO-001), about crypto
        scale, or about functionals not measured.
      nearby_object_control: >-
        A MATCHED RANDOM FUNCTIONAL on the same Cl(O): draw c' by assigning each
        curve an i.i.d. value with the observed marginal distribution, take its
        spectrum. If the real functional's spectrum is statistically
        indistinguishable from c''s flat spectrum, the structure is absent. Second
        nearby object: the SAME functional on a DIFFERENT class of the same size
        (p=6007) -- a genuine low-frequency signal is a property of the arithmetic
        and should recur; an artifact should not.
    proof_obligations:
      - claim: "X_O is a simply transitive Cl(O)-torsor; base-point fixes an isomorphism to Cl(O)"
        responsibility: baseline
      - claim: "within-class variance = sum over nontrivial chi of |chat(chi)|^2 (Parseval)"
        responsibility: correctness
      - claim: "a matched random functional on Cl(O) has flat expected power spectrum"
        responsibility: feasibility
      - claim: "low-frequency decay implies O(diam) l_i-greedy descent to an approximate minimiser"
        responsibility: strictness
      - claim: "descent-reachability is invariant under Cl(O)-translation (phase), not base-point luck"
        responsibility: interface
      - claim: "toy tier, one class, one level, one functional; invisible on the prime-order subgroup"
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The chosen census level is a SINGLE Cl(O)-orbit: End_{F_p}(E) is exactly one
      order O for every curve in the slice. This must be verified by group-
      structure or Hilbert-class-polynomial level assignment BEFORE the torsor
      identification; mixing two levels destroys the torsor and the spectrum is
      meaningless. This is the clean interface to RQ-VOLC and IDEA-20260821-ad7c97.
    - >-
      The class group Cl(O) and its structure (invariant factors, the images of
      the small primes l_i) are computed correctly at toy scale. At |D| for the
      p=4001 t=30 class (D_0 = -59, small conductors) this is elementary and
      independently checkable by two methods (Cornacchia/forms reduction and a
      direct isogeny-graph BFS), which is a required cross-check.
    - >-
      The per-curve functional is a genuine function of the curve on the slice,
      not of the harness sampler. Where a functional is sampler-dependent
      (IDEA-20260821-ad7c97 shows decomp_rate is on the non-cyclic curves), the
      spectrum must be taken of the SAMPLER-FREE exact functional (e.g. |3V|/#E)
      so that phase corresponds to curves and not to sampler state.

  predictions:
    - metric: >-
        spectral_flatness of the mean-centred functional over Cl(O) (geometric
        mean divided by arithmetic mean of the power spectrum), measured on the
        real functional and on a matched random functional
      direction: different
      minimum_effect: >-
        H-STRUCTURED requires real flatness <= 0.5 while the matched null sits at
        >= 0.85 (a separation of >= 0.35). If the real functional's flatness is
        within 0.1 of the null's, H-WHITE holds and the functional is closed on
        this axis.
    - metric: >-
        low_frequency_power_fraction: fraction of total nontrivial power carried
        by characters of l_i-wordlength <= 2
      direction: higher
      minimum_effect: >-
        >= 0.6 for H-STRUCTURED (most power near DC). A fraction near the
        uniform-share baseline (number of low-freq characters / total) is
        evidence for H-WHITE.
    - metric: >-
        descent_reachability: number of l_i-greedy steps from a random start curve
        to within 5% of the class-minimum of the functional, versus the class
        diameter
      direction: lower
      minimum_effect: >-
        <= 2 * diam for H-STRUCTURED (navigable). If greedy descent stalls at a
        value no better than the class median in > 50% of random starts, the
        minimiser is not locally reachable -- the T5 gate fails even if variance
        is above null, which is itself a clean, decision-relevant negative.
    - metric: >-
        cross_class_recurrence: correlation of the spectral shape (binned by
        wordlength) between the p=4001 and p=6007 classes
      direction: higher
      minimum_effect: >-
        A positive rank correlation significant at 5% supports arithmetic origin;
        near-zero correlation supports per-class artifact and weakens any
        structured reading.
    - metric: >-
        parseval_residual: |within-class variance - sum of nontrivial power| as a
        fraction of the variance
      direction: lower
      minimum_effect: >-
        < 1e-6. A larger residual means the torsor identification or character
        table is wrong and the run is an instrument finding, not a result.

  minimal_test:
    design: >-
      FIVE STEPS, THE FIRST TWO COSTING ESSENTIALLY NOTHING.
      STEP 1 (zero compute): confirm the chosen census slice is a single Cl(O)
      -orbit by level assignment; compute Cl(O), its invariant-factor
      decomposition, and the images of the small primes l_i, by two independent
      methods and require agreement.
      STEP 2 (minutes): build the character table of Cl(O), fix a base curve,
      identify each census curve with its class-group element by BFS on the toy
      isogeny graph, and DFT the committed per-curve functional; verify Parseval
      against the committed scalar variance (gate).
      STEP 3 (minutes): compute the power spectrum, spectral flatness, and low-
      frequency power fraction for (a) the sampler-free exact functional |3V|/#E
      and (b) the committed decomp_rate_m3, each mean-centred.
      STEP 4 (minutes): the MATCHED NULL -- 10^3 random functionals with the
      observed marginal, spectra and flatness computed identically; report the
      null flatness distribution and the real functional's percentile.
      STEP 5 (minutes): run l_i-greedy descent from every census curve; record
      steps-to-within-5%-of-minimum and the stall rate. Repeat STEPS 1-5 on the
      p=6007 class as the nearby-object control.
    controls:
      - >-
        MATCHED RANDOM FUNCTIONAL on the same Cl(O) (inventor-protocol section 3
        null): a genuine signal must beat its flat spectrum.
      - >-
        PHASE-SCRAMBLE CONTROL: randomly translate the functional by a Cl(O)
        element; the power spectrum must be invariant and the descent-reachability
        must be unchanged, or the effect is a base-point artifact.
      - >-
        SAMPLER-FREE ARM: take the spectrum of the exact functional |3V|/#E, which
        has no sampler state, so phase corresponds to curves (interfaces with
        IDEA-20260821-ad7c97's sampler-confinement finding).
      - >-
        NEARBY-OBJECT CONTROL: the p=6007 class; a spectral shape that recurs is
        arithmetic, one that does not is per-class.
      - >-
        POSITIVE CONTROL: plant a known low-frequency functional (value = Re of a
        single nontrivial character) and confirm the pipeline recovers a single
        spectral spike and a navigable descent (GOAL-ENDO-001 C4 / RQ-INSTR).
    required_metrics:
      - Cl(O) structure and l_i images, by two independent methods, with agreement
      - character table and the curve-to-group-element identification map
      - Parseval residual (gate) between spectral power and committed variance
      - power spectrum, spectral flatness, low-frequency power fraction, real vs null
      - greedy-descent steps-to-minimum and stall rate per start curve
      - cross-class spectral-shape correlation p=4001 vs p=6007
      - planted-signal recovery (spike location and amplitude) for the positive control
      - artifact manifest with source hashes, the base-curve choice, and a rebuild receipt

  falsification_conditions:
    - >-
      The Parseval residual exceeds 1e-6. The torsor identification or character
      table is wrong; the run is halted and reported as an instrument-integrity
      finding, and no spectral conclusion is drawn.
    - >-
      Real spectral flatness is within 0.1 of the matched null's. H-WHITE holds:
      the within-class variation is spectrally indistinguishable from a random
      functional on Cl(O), the functional is closed on the reachability axis with
      the named "white Cl(O)-spectrum" obstruction, and its measured flatness with
      an error bar is the deliverable.
    - >-
      The spectrum is low-frequency (H-STRUCTURED) BUT greedy descent stalls above
      the class median in the majority of random starts. Then variance can be
      above null while the minimiser is NOT locally reachable -- the T5 gate fails
      for a reason the spectrum alone would have missed, and the deliverable is
      that dissociation.
    - >-
      The planted low-frequency positive control is NOT recovered as a single
      spectral spike. Under GOAL-ENDO-001 P1 the instrument has failed its
      two-directional control; measurement stops and all arms are marked
      attempted_and_inconclusive.
    - >-
      H-STRUCTURED holds, the variance exceeds its matched null, descent reaches
      the minimiser, AND the implied per-curve cost gap appears to exceed the
      automorphism-discounted rho baseline. This does NOT get recorded as a
      result: it triggers GOAL-ENDO-001 P3, pausing for an independent
      review-adversarial session before any excess is stated.

  confounders:
    - >-
      LEVEL CONTAMINATION. If the slice secretly mixes two volcano levels the
      torsor is not a single Cl(O)-orbit and the "spectrum" is a meaningless DFT
      over a non-group index set. MITIGATION: the single-orbit check in STEP 1 is
      a hard gate, not a caveat.
    - >-
      SMALL h(O). At toy scale h(O) may be tiny (h(-59) = 3), giving a spectrum
      with only 3 characters and no meaningful low-vs-high frequency distinction.
      MITIGATION: choose a class with h(O) at least ~30 for the primary slice
      (the f_E = 16 floor of the p=4001 class has 72 curves but its order is
      non-maximal -- its class number must be recomputed, not assumed), and treat
      tiny-h classes as unable to support the test rather than as negatives.
    - >-
      MARGINAL-DISTRIBUTION MISMATCH in the null. If the random functional's
      marginal differs from the real one, a flatness gap could be a marginal
      artifact, not a structural one. MITIGATION: the null draws from the observed
      empirical marginal exactly.
    - >-
      BASE-POINT DEPENDENCE. A careless identification could make phase encode
      enumeration order rather than curve identity. MITIGATION: the phase-scramble
      control and the requirement that descent-reachability be translation
      invariant.
    - >-
      SAMPLER STATE LEAKING INTO PHASE. decomp_rate on non-cyclic curves is a
      function of (curve, sampler subgroup) per IDEA-20260821-ad7c97, so its
      spectrum could reflect sampler confinement, not curve arithmetic.
      MITIGATION: the sampler-free |3V|/#E arm is the primary object; decomp_rate
      is secondary and interpreted only in light of ad7c97's cell structure.

  interpretation_limits:
    - >-
      TOY TIER, ONE OR TWO CLASSES, ONE LEVEL EACH. Nothing transfers to
      cryptographic scale, where h(O) ~ sqrt(p) makes the full spectrum infeasible
      and only low-frequency probes survive. No transfer is offered.
    - >-
      INVISIBLE ON THE PRIME-ORDER SUBGROUP. On the prime-order subgroup G every
      endomorphism acts as a scalar (H-ENDO-001), so this entire torsor/spectrum
      structure concerns the cost FUNCTIONAL's variation across curves, NOT the
      discrete logarithm itself. A structured spectrum is a statement about the
      campaign's measured functional, not about ECDLP hardness.
    - >-
      A LOW-FREQUENCY SPECTRUM IS NOT AN ATTACK. Even a fully navigable functional
      only means "the cheapest curve in the class is locally reachable"; reaching
      it is the vectorization/T5 problem at ~sqrt(h) ~ p^{1/4}, which this record
      does not touch and which caps any exploitation.
    - >-
      NO EXPONENT MOVES IN EITHER BRANCH. sota_delta is zero on every attack axis
      whatever the outcome.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SMOOTHNESS-NAVIGABILITY LINK. If the mean-centred functional c on Cl(O)
        satisfies |chat(chi)| <= K exp(-r * wordlength(chi)) for the small-prime
        generators, then l_i-greedy descent from any start reaches a value within
        epsilon of the class minimum in O((1/r) log(1/epsilon) + diam) steps with
        probability >= 1 - o(1) over start points.
      rigorous_support: >-
        RIGOROUS INGREDIENT: a band-limited function on a finite abelian group is
        Lipschitz in the Cayley word metric with constant controlled by the
        spectral decay (a finite-group Bernstein inequality), and greedy descent
        on a Lipschitz function with no low-order local minima converges in
        diameter-many steps. CLASSICAL STATEMENT IMITATED: the correspondence
        between Fourier decay and Cayley-graph smoothness used in the analysis of
        random walks on groups (Diaconis-style spectral bounds). THE GAP, STATED:
        band-limited functions can still have spurious local minima; the honest
        assumption is that a genuinely arithmetic low-frequency functional does
        not, which is exactly what the descent stall-rate metric tests.
      falsification_condition: >-
        A functional measured to be low-frequency (flatness <= 0.5, low-freq power
        fraction >= 0.6) nonetheless produces a greedy-descent stall rate above
        50%. Then the link fails empirically at this scope and no reachability may
        be inferred from the spectrum.
      validation_plan: >-
        SAMPLE: all curves of the chosen level as descent starts (exhaustive at
        toy scale, not sampled). SHORTCUT: none needed; the class is small enough
        to enumerate the isogeny graph fully. COMPARISON: measured steps-to-
        minimum against the O(diam) prediction, and stall rate against 0. TAIL
        CHECK: the worst-case start's step count against the diameter. TRANSFER:
        none; the link is checked at exactly the class used, and its crypto-scale
        analogue is explicitly out of scope.
    - id: H2
      statement: >-
        NULL WHITENESS. A functional assigning i.i.d. values (from the observed
        marginal) to the curves of a Cl(O)-torsor has, in expectation, a flat
        power spectrum: E|chat(chi)|^2 is equal across all nontrivial chi.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for i.i.d. inputs the Fourier coefficients at
        distinct nontrivial characters are uncorrelated with equal variance
        (orthogonality of characters plus independence), so the expected power
        spectrum is exactly flat. CLASSICAL STATEMENT IMITATED: the flat
        expected periodogram of white noise (Wiener-Khinchin for a finite abelian
        group).
      falsification_condition: >-
        The simulated matched-null spectrum is measurably non-flat (flatness
        significantly below 0.85 at n = 10^3 draws), indicating a bug in the
        pipeline or a hidden dependence in the "random" functional.
      validation_plan: >-
        SAMPLE: 10^3 i.i.d. random functionals on the toy Cl(O). COMPARISON:
        empirical flatness distribution against the theoretical near-1 value; a
        chi-square test of the per-character power against equality. TAIL CHECK:
        the most and least powerful character against the order-statistics of the
        equal-variance model. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. This is a measurement/control on the
      campaign's own functionals and is explicitly a BUILDING BLOCK, prioritised
      because it adjudicates BOTH clauses of the RQ-ICINV decision target (the
      gating lane per completion criterion C2) with one cheap statistic, where the
      committed instrument adjudicates only one. Experiment cost: full isogeny-
      graph BFS on a class of <= ~100 curves, one DFT over Cl(O) (h(O)^2 or
      h(O) log h(O) operations), 10^3 null draws, and exhaustive greedy descents
      -- seconds to minutes on one core.
    memory_exponent: >-
      O(h(O)) values held (the functional and its transform); negligible at toy
      scale. No preprocessing table, no time-memory tradeoff.
    best_known: >-
      For the ECDLP on these curves: Pollard rho ~0.886 sqrt(pi N / 2), O(w)
      memory, automorphism-discounted by sqrt(|Aut|) (KN-TECH-018), and BSGS at
      ~sqrt(N) time and memory, both mandatory matched controls under RQ-ICINV.
      Neither is challenged. For the reachability question specifically, the
      incumbent is vectorization on the Cl(O)-torsor at ~sqrt(h(O)) ~ p^{1/4}
      (CSIDH-style meet-in-the-middle), which caps any exploitation and which this
      record does not beat.
    hidden_overhead: >-
      NOTHING HIDES IN AN o(1) BECAUSE NO ASYMPTOTIC IS CLAIMED. What is disclosed
      instead: the full-spectrum method is toy-only -- at crypto scale h(O) ~
      sqrt(p) and only O(polylog) low-frequency characters can be probed (via
      short isogeny-walk correlations), so the crypto-scale version of the test is
      strictly weaker than the toy version and is not claimed here.
    tradeoff_note: >-
      Not applicable -- no algorithm is proposed. The relevant negative tradeoff:
      even a fully navigable low-frequency functional yields a reachable minimiser
      only at vectorization cost ~sqrt(h(O)), so a structured spectrum does not by
      itself produce a sub-rho attack and P3 governs any claim that it might.

  dominated_by: >-
    CHECKED ACROSS EVERY FRONTIER AXIS BEFORE ANSWERING. As an ECDLP attack: n/a
    (no result claimed) -- no time, memory, or data/query point is offered, so no
    frontier row applies. As a theorem about the class: dominated by classical CM
    theory (Deuring, Waterhouse, Schoof) and abelian Fourier analysis, which
    already contain the torsor structure and Parseval; the assembly into a
    decision statistic for T5 is new to this program, the mathematics is not. As a
    measurement of the campaign's residual over-dispersion: not dominated -- no
    committed record takes the spectrum, and IDEA-20260821-ad7c97's sampler-mixture
    explanation is complementary (this record tests exactly whether ad7c97's
    mixture leaves a white residual). As a reachability probe: the vectorization
    frontier (~p^{1/4}) dominates any exploitation, disclosed above.
  sota_delta: >-
    ZERO on every attack axis in both branches. Time exponent unchanged at 1/2,
    memory unchanged, no query model touched, claim_tier toy. What changes is the
    campaign's decision resolution on its gating lane: from a scalar variance ratio
    (which adjudicates one of the two RQ-ICINV clauses) to a spectral-flatness plus
    descent-stall pair (which adjudicates both), with a matched-null percentile and
    a named "white Cl(O)-spectrum" obstruction available in the expected branch.

  discriminated_from:
    - >-
      IDEA-20260815-6d4580 censuses which vertex invariants vary across a class.
      It reports marginal variances on an unordered set of curves; this record
      equips the class with its Cl(O) group law and reads the functional in the
      dual basis, an object 6d4580 never constructs.
    - >-
      IDEA-20260811-c72830 tracks the vertex cost Delta(E) varying by conductor.
      That is a per-curve magnitude; this is a spectrum over the class and a
      navigability test, and it says nothing about conductor scaling.
    - >-
      IDEA-20260821-ad7c97 attributes the committed over-dispersion to a
      sampler-reachable-subgroup mixture. This record is orthogonal and mutually
      falsifying: if ad7c97's mixture is the whole story, the sampler-free
      functional's spectrum is white after level restriction, which this design
      predicts and tests directly.
    - >-
      IDEA-20260817-4c6519 (withdrawn) and IDEA-20260807-0afbab measure rho
      step-count variance and its correlation with j/conductor -- a scalar and a
      marginal correlation. Neither constructs the torsor spectrum nor ties
      spectral shape to the T5 reachability gate.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that STEP 1-2 succeed and Parseval closes (arithmetic on a small class).
    0.6 that the expected branch is H-WHITE after level restriction and sampler-
    free scoring (consistent with the generic-group closure and with
    IDEA-20260821-ad7c97's mixture explanation absorbing most of the variance).
    0.25 that a genuine low-frequency signal survives, which is the branch that
    would matter and is exactly why the spectrum is worth taking rather than
    assuming the variance is noise. 0.15 that H-STRUCTURED holds but descent
    stalls, the dissociation that only this object can expose.

