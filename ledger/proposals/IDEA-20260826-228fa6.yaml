idea:
  id: IDEA-20260826-228fa6
  question_id: RQ-ICINV-475b5e
  research_question: RQ-ICINV-475b5e
  added: '2026-08-26'
  title: >-
    THE CLASS IS A Cl(O)-TORSOR, SO A COST FUNCTIONAL ON IT HAS A FOURIER
    SPECTRUM: measure whether the committed within-class cost variation is
    concentrated on low-frequency characters of Cl(O) (smooth over the torsor,
    hence minimiser reachable by a class-group-directed descent) or spread as a
    white spectrum (indistinguishable from a matched null, hence closable with a
    named obstruction). The spectrum, not the variance, is the decision-relevant
    output because it adjudicates BOTH halves of the RQ-ICINV decision target at
    once.
  class: measurement

  claim: >-
    STATED AS THREE SEPARABLE CLAIMS, THE FIRST A STRUCTURAL FACT COSTING NO
    COMPUTE, THE SECOND A MEASUREMENT, THE THIRD A DISCRIMINATION. NO ATTACK IS
    PROPOSED AND NO EXPONENT MOVES.

    (A) THE HORIZONTAL ISOGENY CLASS IS A PRINCIPAL HOMOGENEOUS SPACE UNDER THE
    CLASS GROUP. For an ordinary E/F_p with End_{F_p}(E) = O a fixed order, the
    set X_O of F_p-isomorphism classes of curves in the isogeny class with
    endomorphism ring exactly O is a torsor under Cl(O): the ideal-class action
    [a]*E = E/E[a] is simply transitive (Deuring / Waterhouse / Schoof; the same
    structure CSIDH uses). Fixing a base curve E_0 identifies X_O with the finite
    abelian group Cl(O) via [a] |-> [a]*E_0. ANY per-curve functional
    c : X_O -> R is therefore a function on the abelian group Cl(O) and admits a
    Fourier expansion c = sum over chi in Cl(O)^ of chat(chi) chi, with the small
    -norm prime ideals l_1,...,l_k (the ell_i-isogeny generators) as the
    distinguished generating set / Cayley directions.

    (B) THE DECISION-RELEVANT STATISTIC IS THE POWER SPECTRUM, NOT THE VARIANCE.
    By Parseval the within-class variance of c equals sum over nontrivial chi of
    |chat(chi)|^2. The committed campaign reports a within-class over-dispersion
    of decomp_rate_m2/m3 with variance ratio in [1.3, 3.6] (EV-ENDO-10109d) and
    reads it only as a scalar. CLAIM: that scalar is the L2 norm of a spectrum
    whose SHAPE is never measured, and the shape carries strictly more decision-
    relevant information than the norm -- specifically, it separates the two
    branches of the RQ-ICINV decision target that the variance alone cannot.

    (C) THE DISCRIMINATION, WITH BOTH BRANCHES NAMED IN ADVANCE.
    (H-STRUCTURED) If the spectral mass of the mean-centred functional is
    concentrated on LOW-FREQUENCY characters -- those trivial or near-trivial on
    the small-norm generators l_i, i.e. |chat(chi)| decaying with the word-length
    of chi in the l_i -- then c is Lipschitz-smooth on the Cayley (isogeny) graph,
    a class-group-directed greedy descent using only the l_i-neighbours reaches an
    approximate minimiser in O(diam) steps, and the RQ-ICINV reachability gate T5
    is DISCHARGED CONSTRUCTIVELY on this functional at this scope. IF AND ONLY IF
    this branch ALSO shows the pooled variance exceeding its matched null does the
    functional satisfy both admissibility conditions -- and because that is the
    configuration RQ-ICINV was built to detect, any such outcome is a positive C2
    lead and, if the implied per-curve advantage appears to exceed the
    automorphism-discounted rho baseline, is routed to the P3 independent review
    BEFORE any record states it. It is framed here strictly as a test to run.
    (H-WHITE) If the spectral mass is spread approximately uniformly across all
    characters (flat power spectrum, the signature of a random function on Cl(O)),
    then no low-frequency structure exists, greedy descent has no gradient to
    follow, the minimiser is NOT locally reachable, and the functional is closed
    on this axis with the named obstruction "white Cl(O)-spectrum" -- a measured
    quantity (spectral flatness) with units, read from the runs, at the
    inventor-protocol section 4 standard. This is the expected branch and it is a
    first-class deliverable, not a fatigue report.

  mechanism: >-
    T1 says the ECDLP transports along F_p-isogenies of degree coprime to N up to
    transport cost, so a genuine attack-cost functional is an isogeny-class
    invariant up to that cost, and any measured within-class variation is either
    (i) not an attack cost (instrument or combinatorial artifact) or (ii) a real
    cost whose minimiser must be REACHED to be exploited. The RQ-ICINV decision
    target demands both: variance above null AND local reachability. The Cl(O)
    -torsor structure is the exact tool that fuses those two demands into one
    measurement. Reachability by an isogeny walk is precisely descent on the
    Cayley graph of Cl(O) generated by the small primes l_i; a functional is
    descent-navigable iff it is smooth in that Cayley metric iff its Fourier mass
    sits at low frequency. So the spectrum simultaneously (a) reproduces the
    variance as its total power (the "above null" test) and (b) reports whether
    that power is navigable (the "reachable" test). A white spectrum is the
    canonical null tell of docs/inventor-protocol.md section 3 imported to the
    frequency domain: structure that a matched random functional would reproduce
    exactly. The mechanism is not an attack; it is the harmonic-analysis reading
    of the campaign's own standing open number.

  novelty_status: unverified

