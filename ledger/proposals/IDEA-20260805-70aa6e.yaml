idea:
  id: IDEA-20260805-70aa6e
  question_id: RQ-SNOVA-001
  added: '2026-08-06'
  title: >-
    The oil space of SNOVA is not a subspace, it is a module: a Morita-style
    counting theorem that fixes the exponent of the correct matched-UOV
    baseline, computes it for all eleven published parameter sets, and says
    plainly that the resulting ceiling is not binding
  class: control

  claim: >-
    SNOVA's secret oil space is not an F_q-subspace of the flattened variable
    space; it is a module over the coefficient algebra A = F_q[S], and the set
    of candidate oil spaces is therefore an A-Grassmannian, not an F_q-one.
    DERIVED AND SESSION-VERIFIED BY EXACT ENUMERATION (see mechanism): for a
    semisimple coefficient algebra A of F_q-dimension ell, the number of
    admissible oil objects is a Gaussian binomial over A rather than over F_q,
    so log_q(number of candidate oil spaces) = ell * o * (n - o) under the
    F_q[S]-linear reading, against ell^4 * o * (n - o) for a UOV over F_q with
    the SAME number of F_q variables and the SAME F_q oil dimension. The
    deficit factor in the exponent is ell^3. THE HONEST CONSEQUENCE IS A
    NEGATIVE AND IT IS STATED UP FRONT: at every one of the eleven parameter
    sets published on the SNOVA project page the resulting entropy ceiling is
    between 1920 and 19800 bits, so exhaustive oil-space search does not come
    close to any claimed level and this is NOT an attack. What it is, and what
    the goal's third completion criterion actually needs, is the correct
    matched baseline: any comparison of SNOVA at (v, o, q, ell) against "a UOV
    with ell^2 (v+o) variables" overstates SNOVA's structural entropy by a
    factor ell^3 in the exponent, and the entropy-matched plain-UOV instance is
    the one with o'(n' - o') = ell * o * (n - o). Both halves are zero-compute
    and neither depends on any attack paper.

  object_first_candidate:
    tracked_object: >-
      The secret oil space itself, carried as an object of the module category
      over the coefficient algebra A = F_q[S] rather than as a set of vectors:
      standard oil submodule O_0 -> secret A-linear change of basis T -> the
      submodule O = T(O_0) of the ambient module V = M_ell(F_q)^n -> the orbit
      of O under the secret-key group -> the cardinality of that orbit, which
      is the only quantity followed to the end. Every UOV-family attack's
      terminal object is O (recovering O is an equivalent key), so this is the
      object the whole attack literature is about, tracked in the category
      SNOVA actually lives in instead of the one flattening puts it in.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens for this proposal: the wedge-product
      attack, MinRank and rectangular-MinRank, Kipnis-Shamir, reconciliation,
      intersection attacks, direct/Groebner attacks on the public map, hybrid
      guess-and-solve, quantum MQ solvers, side channels and fault attacks, and
      weak-key search. None of them is used to derive anything here. This is
      deliberately a counting statement about the key space, which is upstream
      of every one of those families and is what they all have to search.
    newness_score: >-
      The Morita correspondence for M_ell(F_q) and the module structure of
      F_q[S] are textbook, and the observation that a structured-ring UOV
      variant has a smaller key space is surely folklore among the people who
      broke SNOVA. What is not in this corpus, at all, is (a) the exponent
      written down, (b) the ell^3 deficit factor named, (c) the entropy
      evaluated for every published parameter set, and (d) the entropy-matched
      UOV instance defined so that GOAL-SNOVA-001's size-versus-security
      question has a baseline that is not circular. Novelty is claimed only for
      (b)-(d) as records in this program, and not against the literature.
    testability_score: >-
      Maximal, and free. The counting theorem is checkable by brute-force
      enumeration over tiny algebras in pure Python with no numeric or algebra
      dependency at all, which matters because this container's solver
      availability is disputed between two scouting reports. The parameter
      arithmetic is exact integer arithmetic on eleven rows.
    survival_score: >-
      The object survives all the way to a number, which is exactly why it is
      worth tracking, and equally why the deliverable is a baseline and not an
      attack: an entropy count bounds security from above and never exhibits a
      recovery. The proposal is written so that the honest ceiling result -
      "not binding anywhere" - is the expected outcome and still a deliverable.

  mechanism: >-
    SOURCE DISCIPLINE FIRST. GOAL-SNOVA-001's next_action forbids restating the
    secondhand margin-loss, weak-key-density and SNOVA-I figures carried in the
    goal and question records as this program's results. They are not restated
    anywhere in this proposal and no derivation below uses them.
    What WAS fetched in this session, on 2026-08-06, and what its status is:
    (S1) https://snova.pqclab.org/ - FETCHED (HTTP 200) via the harness web
    tool, which returns a model-rendered markdown of the page. The eleven-row
    parameter table (SL, (v, o, q, ell), public key size, signature size,
    private key sizes) and the sentence defining the ring as
    F_q[S] = {a_0 + a_1 S + ... + a_{ell-1} S^{ell-1} : a_i in F_q} with
    F_q = GF(16) come from that fetch. THE SPECIFICATION PDF WAS NOT READ. The
    table is page-level evidence rendered by a summarising model, so Stage 0 of
    the paired experiment re-fetches it and transcribes it from raw HTML before
    any number is used.
    (S2) https://eprint.iacr.org/2026/237 - ABSTRACT PAGE FETCHED (HTTP 200).
    Title "Exploiting SNOVA's Structure in the Wedge Product Attack"; authors
    Maxime Bros, Thai Hung Le, Jacob Lichtinger, Brice Minaud, Ray Perlner,
    Daniel Smith-Tone, Cristian Valenzuela; dated 2026-02-13. THE BODY WAS NOT
    READ (the corpus's own network survey records eprint PDF bodies returning
    403). Its abstract's figures are the authors' claims, are labelled
    ABSTRACT-RELAYED wherever they appear in this record, are not reproduced
    here, and are NOT an input to any prediction below.
    (S3) The internal algebra of SNOVA's central map - the exact form of the
    public quadratic, which matrices are public, and precisely which group the
    secret transformation ranges over - is RECALLED, UNVERIFIED. That
    uncertainty is not papered over: it is the branch point of the whole
    proposal and Stage 0 exists to resolve it.

    THE THEOREM, WHICH IS UNCONDITIONAL AND OWES NOTHING TO SNOVA. Let A be a
    finite F_q-algebra with dim_{F_q} A = ell, let V = A^N be a free left
    A-module, and count free rank-k A-submodules of V. When A is a field
    F_{q^ell} the count is the Gaussian binomial [N choose k]_{q^ell}, of order
    q^{ell k (N - k)}. When A = M_ell(F_q), Morita equivalence with F_q sends
    A^N to C^{ell N} for the simple module C = F_q^ell, and left submodules of
    C^{M} correspond bijectively to F_q-subspaces of F_q^{M}; a submodule
    isomorphic to A^k = C^{ell k} therefore corresponds to a subspace of
    dimension ell k, and the count is [ell N choose ell k]_q, of order
    q^{ell^2 k (N - k)}. When A = F_q x F_q the count factors as the product of
    two ordinary Grassmannian counts. When A = F_q[x]/(x^2), which is local and
    NOT semisimple, the count is not a Gaussian binomial at all: free rank-1
    submodules of A^2 number (|A|^2 - |mA|^2) / |A^x| = q(q+1).
    SESSION-COMPUTED AND EXACTLY CONFIRMED, in pure Python, this session, by
    enumerating every cyclic left submodule: for A = M_2(F_2) and N = 2 the
    submodule-size histogram is {1: 1, 4: 15, 16: 35}, i.e. 35 free rank-1
    submodules against [4 choose 2]_2 = 35 and 15 copies of the simple module
    against [4 choose 1]_2 = 15. For A = F_2[x]/(x^2), N = 2, the histogram is
    {1: 1, 2: 3, 4: 6}, giving 6 = q(q+1) free rank-1 submodules, DIFFERENT
    from the 5 = [2 choose 1]_4 of the semisimple algebra of the same
    dimension. THESE NUMBERS WERE COMPUTED OUTSIDE THE HARNESS AND ARE
    PRE-REGISTERED IN THE PAIRED EXPERIMENT TO BE RE-COMPUTED INSIDE IT; they
    are not cited as results.

    HOW IT APPLIES TO SNOVA, AND THE BRANCH THAT STAGE 0 MUST SETTLE. SNOVA's
    signature variables X_1, ..., X_n (n = v + o) are ell-by-ell matrices over
    F_q, so the flattened variable count is ell^2 n and the flattened oil
    dimension is ell^2 o. The coefficient algebra is A = F_q[S], commutative of
    F_q-dimension ell, and equal to F_{q^ell} exactly when the characteristic
    polynomial of S is irreducible. Three readings of "which objects can be the
    secret oil space" give three different exponents, and they are separated by
    powers of ell, so the branch is not cosmetic:
      READING 1 (A-linear secret transform, T in GL_n(F_q[S]) acting on the n
        coordinates): candidate oil spaces = Gr_A(o, n), count
        [n choose o]_{q^ell}, log_q = ell * o * (n - o).
      READING 2 (full matrix-ring-linear secret transform, T in GL_n(M_ell)):
        candidates = free rank-o M_ell-submodules of M_ell^n, count
        [ell n choose ell o]_q, log_q = ell^2 * o * (n - o).
      READING 3 (no ring structure at all - the flattened generic UOV that a
        naive matched baseline uses): Gr_{F_q}(ell^2 o, ell^2 n), log_q =
        ell^4 * o * (n - o).
    Reading 1 is the one the recalled description of SNOVA supports and is
    taken as the working reading; the deficit against Reading 3 is then a
    factor ell^3 in the exponent, and against Reading 2 a factor ell^2. NO
    READING IS ASSERTED AS SNOVA'S UNTIL STAGE 0 READS THE SPECIFICATION; all
    three exponents are carried and reported.

    THE NUMBERS, AND THE NEGATIVE THEY PRODUCE. Under Reading 1 the oil-space
    entropy is ell * o * v * log2(q) bits with v = n - o. SESSION-COMPUTED by
    exact integer arithmetic over the eleven rows of (S1), with q = 16 so
    log2 q = 4: (37,17,2) 5032; (25,8,3) 2400; (24,5,4) 1920; (56,25,2) 11200;
    (49,11,3) 6468; (37,8,4) 4736; (24,5,5) 2400; (75,33,2) 19800; (66,15,3)
    11880; (60,10,4) 9600; (29,6,5) 3480 bits. The smallest is 1920 bits
    against a category-I claim. THE CEILING IS NOT BINDING ANYWHERE AND THIS
    PROPOSAL SAYS SO BEFORE IT IS RUN. A second, tighter, still-unconditional
    ceiling of the same kind: the cost of the SNOVA analogue of UOV's
    "guess a vinegar-free vector" step is (q^ell)^{v - o} under Reading 1
    rather than q^{ell^2 (v - o)}, giving ell (v - o) log2 q bits: 160, 204,
    304, 248, 456, 464, 380, 336, 612, 800, 460 over the same eleven rows. The
    minimum, 160 bits at (37,17,16,2), is still above its category claim. Both
    tables are exact arithmetic, both will be recomputed in-harness, and both
    are reported whichever way they come out.

    WHAT THE DELIVERABLE THEREFORE IS. Not an attack. The entropy-matched
    plain-UOV instance: given SNOVA at (v, o, q, ell), the UOV over F_q whose
    oil space carries the same entropy is any (n', o') with
    o'(n' - o') = ell * o * (n - o), and it is THAT instance, not the
    ell^2-flattened one, whose public-key size may legitimately be set beside
    SNOVA's. This converts GOAL-SNOVA-001's third completion criterion from a
    comparison whose baseline was never defined into an arithmetic one. And it
    yields a falsifiable structural prediction for later batches: if the
    reported structural attacks against SNOVA are exploiting the module
    structure rather than something else, their complexity exponents should
    track a law in ell * o * v or ell * (v - o) rather than the ell^2 or ell^4
    laws a flattened reading would give. That prediction is stated here, with a
    closed candidate list, and is NOT evaluated in this proposal because
    evaluating it requires reading the attack paper's tables.

  novelty_status: unverified

  literature_context:
    - >-
      SNOVA project page, https://snova.pqclab.org/ - FETCHED 2026-08-06 (HTTP
      200) through the harness web tool, which renders pages through a
      summarising model. Supplies: the eleven parameter rows (v, o, q, ell)
      with q = 16 throughout and ell in {2,3,4,5}, the public-key and signature
      sizes, and the definition of the ring as the F_q-span of powers of S. THE
      SPECIFICATION DOCUMENT ITSELF WAS NOT READ, so the exact form of the
      central map, the exact group the secret transformation ranges over, and
      the exact index set Omega are NOT established by this fetch.
    - >-
      Bros, Le, Lichtinger, Minaud, Perlner, Smith-Tone, Valenzuela,
      "Exploiting SNOVA's Structure in the Wedge Product Attack", IACR ePrint
      2026/237, dated 2026-02-13. ABSTRACT PAGE FETCHED 2026-08-06 (HTTP 200);
      BODY NOT READ. ABSTRACT-RELAYED, the authors' claim and not this
      program's: the attack exploits the block-ring structure, removes spurious
      solutions that blocked earlier generic attacks, breaks 6 of 11 proposed
      parameter sets and improves 2 more, and for (v,o,ell) = (29,6,5)
      estimates 181 bits against 310 for the previous best known attack. NO
      NUMBER IN THIS SENTENCE IS USED ANYWHERE IN THIS PROPOSAL'S DERIVATIONS,
      PREDICTIONS OR CONTROLS. It is recorded so that a later batch has the
      exact bibliographic handle to check.
    - >-
      KN-LIT-7620 (NIST IR 8610) is the only SNOVA-touching literature entry in
      this corpus; it names SNOVA as one of nine Round-3 candidates and asserts
      no per-scheme technical claim. There is no KN-LIT entry for the SNOVA
      specification and none for ePrint 2026/237. Filing those is
      GOAL-SNOVA-001's declared next_action and is a prerequisite for anything
      beyond Stage 0 here.
    - >-
      Morita equivalence of M_ell(F_q) with F_q, and the classification of
      modules over a finite commutative semisimple algebra, are standard
      algebra. NO CITATION IS ASSERTED, because none was read in this session;
      the correspondence is instead DERIVED in the mechanism and VERIFIED by
      exact enumeration at small parameters, which is the form this program's
      rules require when a source cannot be read.
    - >-
      KN-OPEN-027's complexity ceiling (SLIP in AM intersect coAM) is named in
      this session's scouting brief as bearing on any goal that bases hardness
      on an isomorphism or equivalence problem, SNOVA included. NOT READ in
      this session; recorded as a pointer for a later batch, not used here.

  lossy_projection_identifiability_audit:
    projection: >-
      Full SNOVA secret key (secret transformation T, central map coefficients
      F) --> the oil object alone: the submodule O = T(O_0), with its
      isomorphism class as a module and nothing else.
    what_is_discarded: >-
      The entire central map F, every basis of O, and the whole coset of
      transformations that fix O setwise. Quantitatively the fibre over one
      value of the observable has size |Stab(O)| times |{admissible F}|, which
      is astronomically larger than the observable's own range.
    why_genuinely_lossy: >-
      The discard is real: many keys share one oil space, which is precisely
      the equivalent-key phenomenon the whole UOV literature is organised
      around. This is not a repackaging of the key.
    why_compatible_with_the_operations: >-
      Compatible in the strong sense the test demands. The oil object
      propagates deterministically through the operations that matter: it is
      preserved by every equivalent-key transformation, it is the terminal
      target of Kipnis-Shamir, reconciliation and intersection attacks, and it
      determines forgery capability. The retained part therefore still
      propagates; nothing about the attack surface is lost by forgetting F.
    is_it_only_a_change_of_coordinates: >-
      CHECKED, AND THIS IS THE FAILURE THE PROPOSAL HAD TO AVOID. Flattening
      SNOVA to F_q coordinates is an injective F_q-linear map and therefore
      loses NOTHING - it is a change of coordinates in the exact sense of the
      protocol's (Delta, Pi) = (x xor y, x . y) example, and any proposal whose
      content was "flatten SNOVA and look at it as a UOV" would be that failure
      verbatim. The move made here is the OPPOSITE one: refuse the flattening
      and count in the category where the object lives. The observable is the
      cardinality of the orbit of admissible oil objects, and the whole point
      is that this cardinality is NOT invariant under the change of coordinates
      - it differs by the factor ell^3 - which is what makes it a real
      invariant of the structure rather than of the presentation.
    mirror_failure_check: >-
      CHECKED SEPARATELY. The mirror failure is a projection so lossy it is
      constant across instances, with zero comparator spread. It does not
      apply: the observable here is a COUNT, so it is by construction constant
      across instances at fixed (v, o, q, ell) - and that is deliberate, since
      the quantity being audited is a property of the parameter set, not of a
      key. This is flagged rather than hidden, and it is exactly why this
      proposal claims a BASELINE and not a DISTINGUISHER: a constant carries no
      per-instance information and no attack can be built on it. The instance-
      varying comparator that a distinguisher would need is named as absent.

  assumptions:
    - >-
      That SNOVA's secret transformation is F_q[S]-linear on the n ring
      coordinates (Reading 1). RECALLED, UNVERIFIED. If Stage 0 finds it is
      M_ell(F_q)-linear the exponent becomes ell^2 o (n - o) and the deficit
      factor becomes ell^2; if it is merely F_q-linear on all ell^2 n
      coordinates the whole counting argument does not apply to SNOVA at all
      and the proposal's SNOVA half is void while the theorem stands. All three
      branches are pre-declared and all three are reportable.
    - >-
      That the characteristic polynomial of S is irreducible over F_q, so
      F_q[S] is a field. RECALLED, UNVERIFIED, and testable in one line once
      the spec's S is read. If it is squarefree but reducible, F_q[S] is etale
      and the count is a product of Gaussian binomials, which is a different
      pre-registered value. If it is not squarefree, F_q[S] is not semisimple
      and the count is not a Gaussian binomial at all - the local control in
      the experiment exists to make sure the instrument notices that case.
    - >-
      That recovering the oil space constitutes a break. This is the standard
      equivalent-key statement for UOV-family schemes and it is RECALLED for
      SNOVA specifically; Stage 0 records whether the specification states it.

  predictions:
    - metric: >-
        exact_submodule_count_A_equals_M2F2_N2_k1: number of free rank-1 left
        M_2(F_2)-submodules of M_2(F_2)^2, by exhaustive enumeration
      direction: different
      minimum_effect: >-
        EXACTLY 35, equal to the Gaussian binomial [4 choose 2]_2 = 35.
        Pre-registered before any in-harness run. Any other integer falsifies
        the Morita step of the mechanism outright.
    - metric: >-
        exact_submodule_count_A_equals_F4_N2_k1: number of free rank-1
        F_4-submodules of F_4^2 (the commutative field reading at ell = 2)
      direction: different
      minimum_effect: >-
        EXACTLY 5 = [2 choose 1]_4. This value differs from the 6 of the
        non-semisimple algebra of the same F_q-dimension, so the pair 5 versus
        6 is the instrument's demonstration that it can tell semisimple from
        non-semisimple.
    - metric: >-
        exact_submodule_count_A_equals_F2x_over_x2_N2_k1: number of free rank-1
        submodules of A^2 for the local algebra A = F_2[x]/(x^2)
      direction: different
      minimum_effect: >-
        EXACTLY 6 = q(q + 1) at q = 2, and EXACTLY 12 at q = 3. Derived from
        (|A|^2 - |mA|^2)/|A^x| before the run; not a Gaussian binomial.
    - metric: >-
        deficit_exponent_factor: log_q(Reading 3 count) / log_q(Reading 1
        count), computed exactly at (n, o) with symbolic ell
      direction: different
      minimum_effect: >-
        EXACTLY ell^3, and EXACTLY 1 at ell = 1. The value at ell = 1 is the
        null: if the computed factor is anything other than 1 when the algebra
        is F_q itself, the instrument is measuring its own construction and no
        conclusion about SNOVA may be drawn.
    - metric: >-
        binding_parameter_sets: number of the eleven published parameter sets
        whose Reading-1 oil-space entropy in bits falls below its claimed NIST
        category level (128 / 192 / 256)
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0, from the session-computed table (minimum 1920 bits
        at (24,5,16,4) against 128). A count of 1 or more would be a break
        criterion met by exhaustive search alone, would be the single most
        consequential outcome available here, and is predicted NOT to occur.
        The prediction is recorded so that the expected negative costs
        something to reach.
    - metric: >-
        binding_parameter_sets_second_ceiling: same count for the
        ell (v - o) log2 q ceiling
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0, minimum 160 bits at (37,17,16,2) against 128.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line, and no
      stage requiring any package this container's two scouting reports
      disagree about. STAGE 0 (reading, zero compute): re-fetch the SNOVA
      project page from raw HTML and transcribe the eleven parameter rows
      without a summarising model in the path; attempt the specification
      document and ePrint 2026/237 through the abstract page, arXiv and an
      author copy in that order, and record exactly which endpoints returned
      what. Settle the Reading-1/2/3 branch. If the branch cannot be settled
      from obtainable text, STOP and report a source blocker - which is
      infrastructure signal, never mathematical evidence. STAGE 1 (enumeration,
      seconds, pure Python integers only): brute-force every cyclic submodule
      of A^N for the five pre-registered algebras and compare against the exact
      pre-registered integers. STAGE 2 (arithmetic, minutes): recompute both
      entropy tables over the eleven rows in-harness, and compute the
      entropy-matched plain-UOV instance for each row. STAGE 3 (optional, only
      if the attack paper body is obtained): fit the reported complexity
      exponents against the closed candidate law list and report which laws are
      consistent, as a correlational audit explicitly labelled as such.
    controls:
      - >-
        NULL OBJECT (ell = 1, same shape, can actually fail). Run the identical
        enumeration and the identical exponent computation with A = F_q. FORCED
        VALUE DERIVED BEFORE THE RUN: the submodule count must equal the
        ordinary Gaussian binomial [n choose o]_q exactly, and the deficit
        factor must be EXACTLY 1. This null can fail: an implementation that
        conflates the ambient dimension with the module dimension returns
        something other than 1 here, and if it does, nothing downstream is
        reportable.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. A =
        M_2(F_2), N = 2: the effect - a submodule count strictly larger than
        the same-dimension commutative algebra's - MUST appear, with the exact
        value 35 against 5. If the enumerator does not reproduce 35 the
        instrument is broken and NO negative result about SNOVA may be reported
        at all.
      - >-
        GRADED CONTROL, five interior points, monotonicity reported. At fixed
        (N, k) = (2, 1) and q = 2, enumerate over the ladder of algebras
        A = F_2 (count 3), F_4 (5), F_2[x]/(x^2) (6), F_2 x F_2 (9),
        M_2(F_2) (35). The ladder is pre-registered with those exact integers.
        It is deliberately NOT monotone in F_q-dimension - 6 for the local
        algebra sits above 5 for the field of the same dimension - and that
        non-monotonicity is recorded in advance so that observing it is a pass
        and not a surprise. A failure at one rung localises the obstruction to
        that algebra class instead of leaving "it did not work".
      - >-
        SECOND NEARBY OBJECT, THE ONE THAT DECIDES WHETHER THE METHOD SEES
        NONCOMMUTATIVITY AT ALL: QR-UOV, whose coefficient algebra is
        commutative of F_q-dimension ell. Its deficit factor is forced to ell,
        not ell^3. If the method returns the same factor for QR-UOV and SNOVA
        it is responding to the dimension of the algebra and not to its
        structure, and the SNOVA-specific claim must be withdrawn.
      - >-
        ARCHIVE CHECK, zero compute. Enumerate every prior measurement of this
        observable in the corpus. NOT AVAILABLE - the area SNOVA has no
        experiments, no evidence and no hypotheses, and the module-count
        observable appears nowhere. That unavailability is recorded as such
        rather than counted as a passed check.
      - >-
        VERDICT-ON-THE-NULL-FIRST ORDERING. The ell = 1 arm is computed,
        committed and hashed before any ell > 1 arm is looked at.
    required_metrics:
      - exact enumerated submodule counts per algebra, with the enumeration method stated
      - the pre-registered integer each was compared against, and the comparison outcome
      - both entropy tables recomputed in-harness over all eleven rows, with the arithmetic shown
      - the entropy-matched (n', o') plain-UOV instance per row
      - a verbatim record of which URLs returned which status codes in Stage 0

  falsification_conditions:
    - >-
      The enumerated count for A = M_2(F_2), N = 2, k = 1 is not 35. The Morita
      step is wrong and the whole exponent claim collapses.
    - >-
      The ell = 1 null returns a deficit factor other than 1. The instrument is
      measuring its own construction; nothing is reportable.
    - >-
      Stage 0 establishes that SNOVA's secret transformation is not linear over
      any subalgebra of M_ell(F_q) larger than F_q. Reading 3 holds, the
      deficit is zero, and this proposal's SNOVA-specific half is withdrawn as
      a superseding record while the counting theorem stands unaffected.
    - >-
      Stage 0 establishes that the characteristic polynomial of S is not
      squarefree. F_q[S] is then not semisimple, the Gaussian-binomial count
      does not apply, and the correct count must be re-derived for a local or
      mixed algebra before any exponent is quoted.
    - >-
      The positive control fails. No negative result may be reported.

  confounders:
    - >-
      SUMMARISED-SOURCE RISK. Both fetches in this session passed through a
      summarising model, so the parameter table and the abstract are
      paraphrases of pages, not transcriptions. Stage 0 exists to remove this
      confounder and no number may be promoted past Stage 0 on the paraphrase.
      This is the same confounder IDEA-20260805-e805b6 records for its own
      source and it is handled the same way.
    - >-
      READING AMBIGUITY. The factor ell^3 versus ell^2 versus 1 depends
      entirely on which group the secret transformation ranges over. Reporting
      one factor without reporting which reading it assumes would be the single
      easiest way for this record to mislead a later agent, so all three are
      carried through every deliverable.
    - >-
      ENTROPY IS NOT COST. A smaller key space bounds security from above and
      implies nothing about the cost of any particular attack. The proposal's
      own headline number - the deficit factor - is therefore a statement about
      a baseline, and the temptation to read it as a security drop is the
      failure mode this record is most likely to cause downstream. It is
      flagged here and again in interpretation_limits.
    - >-
      TOY ENUMERATION. Stage 1 runs at q in {2,3}, ell = 2, N in {2,3}. Those
      are checks of an algebraic identity that has no size dependence, not
      extrapolations - but they are toy computations and are labelled toy.

  interpretation_limits:
    - >-
      NO ATTACK IS CLAIMED, NO EXPONENT OF ANY ATTACK IS MOVED, AND NO
      PARAMETER SET IS ASSERTED BROKEN OR SAFE. The deliverable is a counting
      identity, an exponent for a baseline, and two ceiling tables that are
      predicted not to bind.
    - >-
      The ceilings are unconditional upper bounds on security, so a
      non-binding ceiling says nothing whatever in SNOVA's favour either. It
      does not support any parameter set.
    - >-
      Nothing here bears on the reported wedge-product or weak-key results, and
      no figure from either is reproduced, confirmed or contradicted. The
      goal's next_action constraint is respected in full.
    - >-
      A claim tier of toy applies to Stage 1. The Stage-2 arithmetic is exact
      and parameter-set-specific but is arithmetic on published parameters, not
      a measurement, and evidence derived from it must say so.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING FOR THE COUNTING THEOREM. The submodule counts are
        exact algebraic identities over finite algebras, proved rather than
        assumed, and verified by exhaustive enumeration at small parameters.
        This entry exists to record that the theorem half of the proposal is
        unconditional, and that the only assumptions in the record are
        evidentiary (what SNOVA's spec actually says), not mathematical.
      rigorous_support: >-
        Morita equivalence of M_ell(F_q) with F_q; the correspondence between
        submodules of C^M and subspaces of F_q^M for C the simple module; the
        Gaussian-binomial count of subspaces. Each is elementary and each is
        checked numerically rather than cited.
      validation_plan: >-
        Exhaustive enumeration at (q, ell, N, k) in the pre-registered list,
        compared to exact integers fixed before the run.
    - id: H2
      statement: >-
        Recovery of the oil object constitutes a break of SNOVA, so an upper
        bound on the number of oil objects is an upper bound on security.
      rigorous_support: >-
        The equivalent-key argument for UOV-family schemes, RECALLED for SNOVA
        specifically. Stated as a heuristic here precisely because it is
        recalled: if signing additionally requires data not determined by the
        oil object, the ceiling bounds key recovery but not forgery, and the
        deliverable must be restated in those terms.
      validation_plan: >-
        Stage 0 records what the specification says about signing from an
        equivalent key. If the specification cannot be obtained, the ceiling is
        reported as a bound on oil-space recovery only, which is the narrower
        and safe statement.

  target_complexity:
    time_exponent: >-
      This proposal moves NO attack exponent and says so plainly. What it fixes
      is the exponent of a BASELINE: log_q of the number of candidate oil
      objects is ell * o * (n - o) under the working reading, against
      ell^4 * o * (n - o) for the flattened matched UOV that a naive comparison
      uses, a deficit factor of ell^3. Exponent-first ambition is met in the
      only place it honestly can be here - the exponent of the key space - and
      is not dressed up as an attack exponent.
    memory_exponent: >-
      n/a. No algorithm is proposed, so there is no memory to charge. The
      arithmetic in Stage 2 is eleven rows of integer arithmetic.
    best_known: >-
      For key recovery against SNOVA the reported best known is the wedge-
      product attack of ePrint 2026/237, ABSTRACT-RELAYED and not reproduced
      here; this proposal does not compete with it and does not compare to it.
    hidden_overhead: >-
      None in the counting theorem. The hidden risk is entirely evidentiary:
      the applicability of the theorem to SNOVA rests on a recalled structure
      that Stage 0 must confirm.
    tradeoff_note: >-
      An entropy ceiling has no time-memory tradeoff; it is a single number per
      parameter set.

  dominated_by: >-
    n/a (no result claimed). No attack, no cost, no Pareto point is asserted,
    so there is no frontier row this could sit below. Rows checked before
    writing that: (i) the corpus, by grep for SNOVA across knowledge/, ledger/
    and docs/ - the only hits are KN-LIT-7620, the two SNOVA goal and question
    records, IDEA-20260801-016, IDEA-20260801-014 and the four 2026-08-05
    UOV/MAYO proposals, and none of them counts oil objects or states an
    entropy exponent; (ii) the area's own experiment, evidence and hypothesis
    directories - empty for SNOVA; (iii) the reported external frontier for
    SNOVA key recovery, ePrint 2026/237, whose abstract was fetched and whose
    body was not read. Time, memory and data axes were all considered and all
    are inapplicable because no algorithm is proposed. What this check CANNOT
    establish is that the counting identity is unpublished; it is elementary
    algebra and probably known, and no novelty against the literature is
    claimed.
  sota_delta: >-
    Quantitatively: zero on every attack axis - time, memory, data, queries,
    advice - because no attack is proposed. On the baseline axis, which is what
    GOAL-SNOVA-001's third completion criterion needs, the delta is a factor
    ell^3 in the exponent of the matched instance: for the published rows that
    is 8 at ell = 2, 27 at ell = 3, 64 at ell = 4 and 125 at ell = 5. On the
    audit axis, the delta is eleven parameter sets acquiring an exact,
    unconditional, previously unrecorded security ceiling, predicted in advance
    to be non-binding at every one of them.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the counting theorem survives exactly as stated, and 0.45 that it
    applies to SNOVA under Reading 1 as opposed to Reading 2 or a structure the
    specification turns out to describe differently. The first number is high
    because the identity was confirmed by exhaustive enumeration in this
    session (35 = [4 choose 2]_2, 15 = [4 choose 1]_2, 6 = q(q+1)) and because
    it is elementary algebra rather than a conjecture; it is not higher because
    the enumeration was run outside the harness and has not been reproduced
    inside it, and because one arithmetic slip in the Morita bookkeeping would
    change ell^3 to ell^2 without changing any of the small-case checks. The
    second number is under a half because the branch turns on a recalled
    description of SNOVA's secret transformation that this session could not
    verify - the project page gave the ring but not the group - and this
    program's own history (DEC-20260803-64b55b) records two occasions in a
    single batch where scouting was wrong in the direction that would have shut
    work down. 0.02 that anything here yields an attack, which is the number
    the record's framing is built around rather than against.
