idea:
  id: IDEA-20261005-ddbf31
  question_id: RQ-MONO-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Geometric monodromy of the four signed sums over the symmetric base
    (e1, e2), as a homomorphism into the wreath subgroup of S_4
  class: measurement
  claim: >-
    R1 affine coordinates; no attack stage is assigned a new charged cost.
    Fix m=3, char > 3, and a nonsingular short Weierstrass curve
    E: y^2 = f(x). Let the base be the symmetric configuration space
    U_sym = Spec k[e1, e2] minus the discriminant locus
    e1^2 - 4 e2 = 0 and minus the locus where the four points below fail
    to be distinct. Let the fibre over a geometric point be the unordered
    4-set Psi = {P+Q, -(P+Q), P-Q, -(P-Q)}, where {x(P), x(Q)} is the
    unordered pair with elementary symmetric coordinates (e1, e2). This
    4-set is independent of the choice of lifts and of the order of the
    pair. The monodromy representation is the continuous action on a
    labelling of Psi,
    rho_sym: pi_1(U_sym) -> S_4,
    equivalently the geometric Galois action of the function field
    k(e1, e2) on the coordinates of the four points. The inverse-pair
    partition {{P+Q, -(P+Q)}, {P-Q, -(P-Q)}} is the candidate block
    system, and its setwise stabiliser W in S_4 is the wreath product
    (Z/2) wr S_2, of order 8. The claim to be decided, at toy scope, is
    the pair of readings of RQ-MONO-001 for this cover: either the image
    of rho_sym equals W for every ordinary j outside {0, 1728}, or the
    ordinary locus contains a j outside {0, 1728} whose image is a proper
    subgroup of W. A uniform image of order dividing 4 on the whole
    ordinary panel decides the first reading in the negative and is not
    by itself an exceptional locus.
  mechanism: >-
    OBJECT FRAME. Representation of the point: R1, each of P, Q and each
    element of Psi recorded by its affine (x, y) on the fixed curve E.
    Operation set Sigma: the deck transformations generated by inertia
    about the branch components that the census actually meets, concretely
    the swap of the two summands and the negation of either summand.
    Sigma is not the translation action of E. F2 (factor-base
    decomposition) is a named component only: S_3 = 0 is the equation that
    identifies Psi with the summation fibre. The tracked object is the
    permutation representation rho_sym, not a relation vector.
    TRICHOTOMY. Coordinate-dependent. Reason: Psi is a function of the
    unordered pair of x-coordinates, and a generic translation of one
    summand moves (e1, e2), so Psi does not propagate under translation.
    LOSSY-PROJECTION TEST against this Sigma, not against translation.
    The projection pi_x: Psi -> {x(P+Q), x(P-Q)} discards the
    y-coordinate of each point, which is the choice of sign inside an
    inverse pair. The discarded signs are the internal (Z/2) of each
    block of the partition above. That partition is a block system of
    <Sigma> if and only if every measured permutation preserves it; in
    that case the image lands in W and pi_x is the quotient by the blocks.
    The projection is lossy on this representation: four points map to two
    x-coordinates. A single measured permutation that sends a point to a
    point of the other x-coordinate without swapping the whole block
    shows that the partition is not a block system of <Sigma>.
    Base, fibre, and homomorphism, restated as the object: base U_sym,
    fibre Psi (four points of E), homomorphism rho_sym into S_4 with
    comparison group W of order 8. The two x-roots of S_3 in the last
    variable are the image under pi_x, a 2-element set; this proposal
    permutes the four points, not those two roots. The input 4-set of
    points lying over {x(P), x(Q)} is a different fibre and is used only
    as an instrument control.
  novelty_status: unverified
