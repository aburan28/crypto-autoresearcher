  assumptions:
    - Characteristic greater than 3 and f squarefree, so E is nonsingular and the x-map is a separable double cover.
    - A specialization is good when Psi has four distinct points. The census drops the complementary closed set.
    - j=0 and j=1728 are an artifact panel. They are computed and reported, and they are excluded from the ordinary tally.
    - F2 is not the primary lens. No factor base is built and no discrete logarithm is solved.
  predictions:
    - metric: order of the permutation group generated on Psi
      direction: different
      minimum_effect: >-
        Order 8, versus order dividing 4. The factor-of-two gap is the
        split. Order 8 on a curve means that curve realizes the full
        wreath W. Order dividing 4 means the image is a proper subgroup
        of W. All four ordinary panel curves at order 8 means the panel
        contains no exceptional curve. A mix of 8 and a divisor of 4
        inside the ordinary panel is an exceptional locus inside the
        panel. All four at order dividing 4 means the full-wreath
        reading fails uniformly on the panel.
    - metric: presence of a 4-cycle in the generated group on Psi
      direction: different
      minimum_effect: >-
        At least one 4-cycle, versus zero 4-cycles. A 4-cycle lies in
        W and does not lie in the sign subgroup that only flips blocks
        internally. Zero 4-cycles with the instrument control still
        emitting a 4-cycle on the input fibre means this fibre's image
        missed the wreath class that swaps the blocks with a twist.
  minimal_test:
    design: >-
      At p=101, take four ordinary curves with j outside {0, 1728} and
      a separate artifact pair at j=0 and j=1728. For each curve, draw
      64 good specializations (e1, e2) in F_p^2, label Psi by sorting
      affine coordinates in a fixed quadratic extension, and record the
      Frobenius permutation in S_4. Generate the subgroup. Repeat the
      identical sampler on the four input points over the same
      unordered pair. Separately, continue one transverse path across
      each irreducible component of the locus where Psi drops below
      four points, and record those inertia permutations.
    controls:
      - >-
        Input-fibre control: the same 64 specializations, permuting the
        four points of E lying over the unordered pair. The draw is
        inconclusive if that control realizes fewer than 8 permutations.
      - >-
        Null quartic: Frobenius on the roots of a random monic separable
        quartic over the same F_p, same sample size. The draw is
        inconclusive if this null never emits cycle type 3+1.
      - >-
        Artifact panel: j=0 and j=1728, same sample size, reported
        separately from the ordinary tally.
    required_metrics:
      - order of the generated subgroup of S_4 on Psi, per curve
      - whether a 4-cycle occurs, per curve
      - whether every generator preserves the inverse-pair partition
      - order of the input-fibre control group, per curve
      - whether the null quartic emitted cycle type 3+1
  falsification_conditions:
    - Any permutation of Psi that does not preserve the inverse-pair partition falsifies containment of the image in W.
    - >-
      Image order 8 on all four ordinary curves is the full-wreath
      reading on this panel. It falsifies the claim that this panel
      contains an exceptional ordinary curve. It does not prove the
      image equals W for every ordinary j.
    - >-
      Image order dividing 4 on all four ordinary curves, with the
      input-fibre control at order 8 and the null quartic emitting a
      3-cycle, falsifies the full-wreath reading on this panel.
    - >-
      Image order 8 on at least one ordinary curve and order dividing 4
      on another, under the same two controls, is the exceptional-locus
      reading. A later census that returns order 8 on the curve that
      dropped falsifies that drop.
    - Input-fibre control below order 8, or a null quartic with no 3-cycle, makes the run inconclusive.
  confounders:
    - >-
      Specializations where two of the four sums meet, including
      rational 2-torsion collisions, produce a shorter permutation and
      must be dropped rather than scored as a smaller group.
    - >-
      Frobenius generates the arithmetic monodromy. A class that
      appears only over F_{p^2} is a constant-field effect and is
      reported separately from a drop in the geometric image.
    - >-
      Extra automorphisms at j=0 and j=1728 can shrink or relabel
      stabilisers. Those two curves are not evidence of an ordinary
      exceptional locus.
    - >-
      A fixed labelling that jumps at the branch divisor fabricates
      permutations. The inertia paths and the Frobenius sample have to
      agree on the subgroup they generate, or the run is inconclusive.
  interpretation_limits:
    - m=3, char > 3, toy prime p=101 for the minimal test. No statement at cryptographic size and no transfer to m >= 4.
    - No ECDLP exponent, no relation rate, and no decomposition algorithm. KR-IC-5a43e5 stays the decomposition framework.
    - Full image W on four curves does not prove emptiness of an exceptional locus outside the panel.
    - This is not a factor-base construction, so the open classes of high-degree, implicit, or target-dependent factor bases are not invoked.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For this tame cover of degree at most 8, the Frobenius
        permutations at 64 uniform good points (e1, e2) in F_p^2
        generate the arithmetic monodromy group whenever every
        conjugacy class has positive density.
      rigorous_support: >-
        Imitates Chebotarev equidistribution of Frobenius classes in
        proportion to conjugacy-class size, in the form recorded in
        KN-LIT-039.md. No effective error term was opened.
      validation_plan: >-
        Sample p=101, N=64 good points on each of four ordinary curves,
        and the same N on the input-fibre control. Tail check: the
        input-fibre control must realize 8 permutations; if it misses
        that count, redraw once at N=256. A second miss stops the
        reading. Transfer assumption: a result at p=101 is not a result
        at cryptographic p.
    - id: H2
      statement: >-
        For p > 3 the geometric image is generated by inertia at the
        irreducible components of the locus where Psi has fewer than
        four points.
      rigorous_support: >-
        Imitates generation of tame monodromy by inertia. That
        generation statement is provenance recalled; no source was
        opened.
      validation_plan: >-
        On one ordinary curve at p=101, continue a transverse line
        across each irreducible component of the drop locus and record
        the permutation of a labelled Psi. Compare the subgroup those
        inertia elements generate with the subgroup the 64 Frobenius
        elements generate. Equality is the check. One disagreement
        means the branch list or the labelling is incomplete, and the
        group-order reading is withheld.
  target_complexity:
    time_exponent: Unchanged. The ECDLP baseline remains the rho exponent 1/2 in the group order.
    memory_exponent: Unchanged. Distinguished-point memory stays the rho baseline.
    best_known: >-
      KR-RHO-6239aa, about sqrt(pi n / 2) group operations; KR-RHO-825bca,
