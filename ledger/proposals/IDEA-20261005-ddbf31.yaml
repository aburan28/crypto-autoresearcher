    hidden_overhead: >-
      None claimed. The census is a bounded S_4 computation at fixed
      fibre size 4. No o(1) attack term is introduced.
    tradeoff_note: No time-memory tradeoff is proposed. The distinguished-point tradeoff of KR-RHO-6239aa is untouched.
