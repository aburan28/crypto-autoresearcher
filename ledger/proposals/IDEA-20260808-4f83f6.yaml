  discriminated_from: IDEA-20260805-031ce2 asks whether violating signatures still verify
    (a verifier question); this asks what the rejections do to the SIGNER's output law. IDEA-20260805-630606
    recovers t0 from the hint; this uses the challenge frequencies and touches no hint. H-MLDSA-2d4123
