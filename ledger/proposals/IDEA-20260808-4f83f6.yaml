  lossy_projection_test: 'PASSES. Tracked object: the empirical frequency vector of accepted
    challenges over B_tau — a 256-bin (plus sign) histogram distilled from the full transcript,
    discarding every z, every hint, every message. The fibre is enormous. Discarded compatibly,
    because R3''s acceptance predicate is a function of c and t0 alone, so the retained histogram
    is exactly the marginal that predicate acts on and it propagates deterministically under
    the rejection loop. Tracking the transcript itself loses nothing and is the incumbent.'
